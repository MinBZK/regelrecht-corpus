      [ref2]: https://wetten.overheid.nl/BWBR0003381#Artikel39
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel59b
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '36'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0003381
        artikel: '39'
        hoofdstuk: III
        paragraaf: '1'
  - number: 59b.2
    text: |-
      De in [artikel 36, onderdeel c][ref1], bedoelde vrijstelling geldt voor de in het eerste lid genoemde granen
      slechts indien het bij de aangifte ten uitvoer te overleggen formulier L, bedoeld in [artikel 39][ref2] van de
      Douaneregeling, een van de volgende vermeldingen bevat:


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0003381#Artikel39
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel59b
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '36'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0003381
        artikel: '39'
        hoofdstuk: III
        paragraaf: '1'
  - number: 59b.2.a
    text: |-
      in geval een producent van granen als bedoeld in de [Beschikking medeverantwoordelijkheidsheffing granen 1988][ref1]
      (Stcrt. 124) granen als bedoeld in het eerste lid uitvoert: ‘aangifte van de heffingen ingevolge de
      [beschikking Medeverantwoordelijkheidsheffing granen 1988][ref2]’:


      [ref1]: https://wetten.overheid.nl/BWBR0004358
      [ref2]: https://wetten.overheid.nl/BWBR0004358
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel59b
    references:
      - id: ref1
        bwb_id: BWBR0004358
      - id: ref2
        bwb_id: BWBR0004358
  - number: 59b.2.b
    text: |-
      in geval een koper granen als bedoeld in het eerste lid uitvoert, waarover hij
      geen medeverantwoordelijkheidsheffing is verschuldigd ‘geen heffingen ingevolge de
      [Beschikking Medeverantwoordelijkheidsheffing granen 1988][ref1] verschuldigd’.


      [ref1]: https://wetten.overheid.nl/BWBR0004358
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel59b
    references:
      - id: ref1
        bwb_id: BWBR0004358
  - number: 59b.3
    text: |-
      De in [artikel 36, onderdeel a][ref1], bedoelde vrijstelling geldt voor de in het eerste lid genoemde granen
      voorzover de aangifte ten uitvoer in de lid-staat van verzending voor 1 juli 1988 heeft plaatsgevonden, slechts
      indien bij de aangifte ten invoer een formulier L, bedoeld in [artikel 37][ref2] van de Douaneregeling, wordt
      overgelegd, voorzien van de vermelding ‘aangifte tot verzending aanvaard vóór 1 juli 1988’.


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0003381#Artikel37
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel59b
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '36'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0003381
        artikel: '37'
        hoofdstuk: III
        paragraaf: '1'
  - number: 59d
    text: |-
      De in [artikel 36, onder c][ref1], bedoelde vrijstelling geldt voor artikel 10, tweede lid, van [verordening (EG)
      nr. 2449/96](31996R2449) van de Commissie van de Europese Gemeenschappen van 18 december 1996 houdende opening
      en vaststelling van de wijze van beheer van bepaalde jaarlijkse tariefcontingenten voor produkten van de GN-
      codes 0714 10 91, 0714 10 99, 0714 90 11 en 0714 90 19, van oorsprong uit andere derde landen dan Thailand (PbEG
      L 333), en artikel 4, derde lid, van [verordening (EG) nr. 2781/1999](31999R2781) van de Commissie van de Europese
      Gemeenschappen van 27 december 1999 houdende opening en vaststelling van de wijze van beheer van een communautair
      tariefcontingent voor 2000 voor producten van de GN-codes 0714 10 10, 0714 10 91 en 0714 10 99, van oorsprong uit
      Thailand (PbEG L 334), onder de volgende voorwaarden:


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel36
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel59d
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '36'
        hoofdstuk: III
        paragraaf: '1'
  - number: 59d.a
    text: |-
      de in te voeren hoeveelheden maniok overtreffen de hoeveelheden die door de afgegeven invoercertificaten worden
      gedekt met 2% of minder;
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel59d
  - number: 59d.b
    text: er is ingevolge genoemde verordeningen bij het productschap een zekerheid gesteld;
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel59d
  - number: 59d.c
    text: |-
      bij het doen van de voor het surplus afzonderlijk benodigde aangifte ten invoer is een formulier L, dan wel een
      formulier zekerheidstelling, als bedoeld in [artikel 37][ref1] van de Douaneregeling overgelegd waaruit blijkt dat
      de zekerheid bij het productschap is gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel37
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel59d
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '37'
        hoofdstuk: III
        paragraaf: '1'
  - number: '62.1'
    text: |-
      Naast het stellen van een zekerheid, ter verzekering van de voldoening van een landbouwheffing bij invoer
      van de in kolom 3 van [bijlage I][ref1] aangewezen goederen, bij en ten genoegen van de inspecteur van de
      rijksbelastingdienst, bevoegd inzake de douane, kan die zekerheid bij en ten genoegen van het produktschap worden
      gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003381
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0003381
  - number: '62.2'
    text: |-
      In afwijking van het eerste lid kan de zekerheid niet bij en ten genoegen van het produktschap worden gesteld in
      de gevallen:
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel62
  - number: 62.2.a
    text: |-
      dat voor het vrije verkeer aangegeven goederen, waarvoor de verschuldigde landbouwheffing bij invoer niet voordien
      is voldaan, vallen onder [bijlage I][ref1], kolom I, horizontale balken il, VIa, VIc, VId en VIIa;


      [ref1]: https://wetten.overheid.nl/BWBR0003381
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0003381
  - number: 62.2.b
    text: |-
      dat de inspecteur van de rijksbelastingdienst, bevoegd inzake de douane, de voorwaardelijke vrijstelling van de
      landbouwheffing bij invoer toekent;
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel62
  - number: 62.2.c
    text: dat goederen in fictief douaneentrepot worden ingeslagen;
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel62
  - number: 62.2.d
    text: |-
      dat een document wordt afgegeven, dat geen aanvaarde aangifte ten invoer of een voorwaardelijke vrijstelling van de
      landbouwheffing bij invoer betreft;
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel62
  - number: 62.2.e
    text: |-
      dat met toepassing van de regeling bijzondere bestemmingen als kennisgeving de benodigde exemplaren van het
      Overdrachtsformulier bijzondere bestemmingen worden aanvaard, onderscheidenlijk het controle-exemplaar T-5 wordt
      aanvaard, eerder met betrekking tot dezelfde goederen bij de inspecteur van de rijksbelastingdienst, bevoegd inzake
      de douane, zekerheid is gesteld.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel62
  - number: '62.3'
    text: |-
      In afwijking van het eerste lid kan de zekerheid uitsluitend bij en ten genoegen van het produktschap worden
      gesteld in de gevallen:
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel62
  - number: 62.3.a
    text: |-
      dat voor het vrije verkeer aangegeven goederen, waarvoor de verschuldigde landbouwheffing bij invoer niet voordien
      is voldaan, vallen onder [bijlage I][ref1], kolom III, horizontale balk V, zevende gedachtenstreepje;


      [ref1]: https://wetten.overheid.nl/BWBR0003381
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0003381
  - number: 62.3.b
    text: dat het produktschap de voorwaardelijke vrijstelling van de landbouwheffing bij invoer toekent en
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel62
  - number: 62.3.c
    text: |-
      dat met toepassing van de regeling bijzondere bestemmingen als kennisgeving de benodigde exemplaren van het
      Overdrachtsformulier bijzondere bestemmingen worden aanvaard, onderscheidenlijk het controle-exemplaar T-5 wordt
      aanvaard, eerder met betrekking tot dezelfde goederen bij het produktschap zekerheid is gesteld.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel62
  - number: '63'
    text: |-
      Naast de vormen van zekerheid die zijn toegestaan in artikel 193 van het Communautair douanewetboek kunnen als
      vormen van zekerheid worden aanvaard: - storting van geld, niet zijnde Nederlands geld, of deponering van de door
      de ontvanger als betaalmiddel erkende cheques of andere waardepapieren, welke niet luiden in Nederlandse valuta;
        - hypotheek of
        - verpanding van goederen, waardepapieren of vorderingen.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel63
  - number: '64'
    text: |-
      Van het stellen van de zekerheid, bedoeld in [artikel 62][ref1], bij het produktschap wordt door de aangever aan
      de inspecteur van de rijksbelastingdienst, bevoegd inzake de douane, mededeling gedaan door overlegging van een
      formulier zekerheidstelling, dan wel van een op beide exemplaren van het formulier L, bedoeld in [artikel 37][ref2]
      van de Douaneregeling, gestelde verklaring van het produktschap, houdende vermelding van de hoeveelheid en soort
      goed alsmede het bedrag waarvoor de zekerheid is gesteld en zonodig de tijdsduur waarvoor zij geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel62
      [ref2]: https://wetten.overheid.nl/BWBR0003381#Artikel37
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '62'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0003381
        artikel: '37'
        hoofdstuk: III
        paragraaf: '1'
  - number: '65'
    text: |-
      Van het stellen van de zekerheid bij het produktschap door degene, die met toepassing van de regeling bijzondere
      bestemmingen de goederen heeft overgenomen, wordt aan de inspecteur van de rijksbelastingdienst, bevoegd inzake de
      douane, mededeling gedaan door een, op een van de exemplaren van het Overdrachtsformulier Bijzondere bestemmingen,
      onderscheidenlijk op de extra kopie van het controle-exemplaar T 5, gestelde verklaring van het produktschap,
      houdende vermelding van de hoeveelheid en soort goed waarvoor zekerheid is gesteld en zonodig de tijdsduur waarvoor
      zij geldt.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel65
  - number: '72.1'
    text: |-
      De mededeling, bedoeld in artikel 221, eerste lid, van het Communautair douanewetboek, van het bedrag aan
      landbouwheffingen bij invoer dat voortvloeit uit een douaneschuld geschiedt door het vaststellen van een
      uitnodiging tot betaling door het produktschap voor ieder van de heffingen afzonderlijk, indien ter verzekering van
      de voldoening van een dergelijke heffing de zekerheid bij het produktschap is gesteld.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel72
  - number: '72.2'
    text: |-
      In afwijking van het eerste lid geschiedt de mededeling door de inspecteur van de rijksbelastingdienst, bevoegd
      inzake de douane, in alle gevallen waarin:
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel72
  - number: 72.2.a
    text: de aangever tot onmiddellijke betaling van de douaneschuld wenst over te gaan;
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel72
  - number: 72.2.b
    text: |-
      blijkens de aan de inspecteur van de rijksbelastingdienst, bevoegd inzake de douane, verstrekte mededelingen,
      bedoeld in [artikel 64][ref1], en met inachtneming van de aangifte voor het vrije verkeer en van hetgeen bij
      verificatie is bevonden, aangenomen moet worden dat bij het produktschap geen of onvoldoende zekerheid is gesteld
      voor de voldoening van de ter zake van het in het vrije verkeer brengen van goederen verschuldigde landbouwheffing
      bij invoer;


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel64
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '64'
        hoofdstuk: IV
  - number: 72.2.c
    text: een te zuiveren document niet is gezuiverd;
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel72
  - number: 72.2.d
    text: |-
      een douaneschuld is ontstaan, bedoeld in de artikelen 201, eerste lid, onderdeel b, 202, eerste lid, 203, eerste
      lid, 204, eerste lid en 205, eerste lid, van het Communautair douanewetboek of
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel72
  - number: 72.2.e
    text: met betrekking tot enig in dit lid bedoeld geval tot boeking achteraf wordt overgegaan.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel72
  - number: '73'
    text: |-
      De beschikking tot terugbetaling of kwijtschelding van landbouwheffingen bij invoer, bedoeld in artikel 886 van de
      toepassingsverordening Communautair douanewetboek, wordt door het produktschap gegeven voor ieder van de heffingen
      afzonderlijk in de gevallen, waarbij het produktschap de mededeling, bedoeld in artikel 221, eerste lid, van het
      Communautair douanewetboek, doet.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel73
  - number: '74'
    text: |-
      Het produktschap is belast met de invordering van de landbouwheffingen bij invoer in de gevallen, waarbij het
      produktschap de mededeling, bedoeld in artikel 221, eerste lid, van het Communautair douanewetboek, doet.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel74
  - number: '78.1'
    text: |-
      Voor de in kolom 4 van [bijlage I][ref1] aangewezen goederen kan ter zake van hun uitvoer naar landen of gebieden
      die geen deel uitmaken van de Gemeenschap een restitutie worden verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0003381
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0003381
  - number: '78.2'
    text: |-
      De restitutie kan uitsluitend worden verleend voor goederen of – indien het samengestelde goederen betreft –
      bestanddelen van goederen, die voldoen aan de voorwaarden van de [artikelen 23](onbekend) en [24 van het Verdrag
      tot oprichting van de Europese Gemeenschap](onbekend), tenzij het goederen betreft die zich tijdelijk in het
      binnenlandse verkeer hebben bevonden of worden uitgevoerd in passief veredelingsverkeer.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel78
  - number: '78.3'
    text: |-
      Het bedrag van de restitutie is voor elk van de in kolom 4 van [bijlage I][ref1] aangewezen goederen gelijk aan
      het bij de uitvoeringsbepalingen vastgesteld bedrag, voorzover nodig omgerekend in Nederlands courant, dat voor de
      toepassing van de basisverordeningen of uitvoeringsbepalingen in de gevallen, naar de onderscheidingen en volgens
      de regelen gesteld in de basisverordeningen dan wel in die uitvoeringsbepalingen, bij de uitvoer van dat goed
      volgens zijn bestemming dan restitutie moet worden verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0003381
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0003381
  - number: '78.4'
    text: |-
      Voor toepassing van het vorige lid moet onder bedrag van de restitutie tevens worden verstaan elk bedrag dat op
      grond van de basisverordeningen of uitvoeringsbepalingen onder andere benaming, zoals aanvullend bedrag, bij de
      uitvoer van het goed moet worden verleend.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel78
  - number: '79'
    text: |-
      Voor de toepassing van dit hoofdstuk wordt met uitvoer gelijkgesteld het bereiken van bijzondere bestemmingen
      binnen de Gemeenschap, die als zodanig voor de verlening van restitutie in de basisverordeningen of
      uitvoeringsbepalingen zijn aangewezen.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel79
  - number: '80.1'
    text: |-
      Behoudens het bepaalde in paragraaf 2 van dit hoofdstuk heeft aanspraak op restitutie degene die op het formulier
      L, bedoeld in [artikel 19][ref1], als exporteur is aangeduid.


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel19
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '19'
        hoofdstuk: II
        paragraaf: '2'
  - number: '80.2'
    text: |-
      De restitutie kan eerst worden toegekend nadat aan alle in de basisverordening of uitvoeringsbepalingen voor de
      toekenning gestelde voorwaarden is voldaan en de daarin voorgeschreven bescheiden zijn overgelegd. Indien die
      basisverordeningen of uitvoeringsbepalingen daartoe de mogelijkheid openstellen kan, op verzoek en met inachtneming
      van hetgeen dienaangaande is voorgeschreven, de aanspraak op restitutie geheel of gedeeltelijk worden omgezet
      in een aanspraak op een invoercertificaat voor met de uitgevoerde goederen overeenkomende hoeveelheden goederen,
      volgens een bij vorenbedoelde basisverordeningen of uitvoeringsbepalingen ingestelde regeling inzake de invoer
      tegen een bijzonder tarief.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel80
  - number: '80.3'
    text: |-
      Als bewijs dat het goed in ongewijzigde staat, als bedoeld in de uitvoeringsbepalingen,
      via het grondgebied van een andere Lid-Staat het douanegebied van de Gemeenschap heeft
      verlaten dan wel in een andere Lid-Staat een bijzondere bestemming als aangegeven in
      [paragraaf 3a van de Beschikking denaturatie- en verwerkingssteun magere melkpoeder 1980][ref1] (Stcrt. 1979, 247),
      heeft bereikt, dient krachtens de uitvoeringsbepalingen het terugontvangen controle-exemplaar T 5.


      [ref1]: https://wetten.overheid.nl/BWBR0003281#Paragraaf3a
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0003281
        paragraaf: 3a
  - number: '80.4'
    text: |-
      Bij de beoordeling welke bescheiden in de zin van het tweede lid dienen te worden overgelegd past het produktschap
      het bepaalde in artikel 20, eerste tot en met derde lid, van [verordening 800/1999](31999R0800) toe. Met
      inachtneming van hetgeen dienaangaande in artikel 49, eerste tot en met zevende lid, van [verordening 800/1999]
      (31999R0800) is voorgeschreven erkent het produktschap als gelijkwaardig aan het controle-exemplaar T 5 te
      beschouwen documenten, onder periodieke opgave aan de Minister van de gevallen, waarin de restitutie op grond van
      deze documenten is uitbetaald.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel80
  - number: 80a.1
    text: |-
      De minister is belast met de erkenning van op internationaal niveau in controle en toezicht gespecialiseerde
      ondernemingen, als bedoeld in artikel 16 van [verordening 800/1999](31999R0800) en met de intrekking van verleende
      erkenningen. De minister kan, in aanvulling op de voorwaarden genoemd in de volgende leden, aan de verlening van
      een erkenning nadere voorwaarden stellen. De minister kan de bevoegdheden welke hem ingevolge dit lid toekomen,
      delegeren aan de voorzitter van het Hoofdproductschap Akkerbouw.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel80a
  - number: 80a.2
    text: |-
      Een erkenning, als bedoeld in het eerste lid, wordt op aanvraag verleend aan in de Gemeenschap zetelende
      rechtspersonen met een vestiging in Nederland die: - blijkens hun statuten uitsluitend of ondermeer tot doel hebben
      controles te verrichten en toezicht uit te oefenen op internationaal niveau;
        - rechtstreeks of via bijkantoren vertegenwoordigd zijn in meerdere derde landen, als bedoeld in artikel 15, eerste
      lid, van [verordening 800/1999](31999R0800);
        - op het gebied van controle en toezicht een uitstekende reputatie hebben;
        - op het gebied van controle en toezicht, douane-aangelegenheden in het algemeen en certificering van de lossing
      van landbouwgoederen in het bijzonder een ruime ervaring hebben.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel80a
  - number: 80a.3
    text: |-
      De op grond van het eerste lid erkende ondernemingen: - geven in het kader van artikel 16 van [verordening
      800/1999](31999R0800) voor een derde land slechts verklaringen inzake de lossing of verklaringen inzake de
      lossing en de invoer voor verbruik af, indien zij in het betrokken derde land rechtstreeks of via bijkantoren zijn
      vertegenwoordigd;
        - doen in een daartoe dagelijks bijgehouden register verslag van de uitgevoerde werkzaamheden, het aantal
      onderzochte monsters van de landbouwgoederen en de analyseresultaten, alsmede van het overige bewijsmateriaal op
      basis waarvan in het kader van artikel 16 van [verordening 800/1999](31999R0800) een verklaring inzake de lossing
      en/of invoer tot verbruik wordt afgegeven, houden dit register ter beschikking van de Algemene Inspectiedienst, het
      Hoofdproduktschap voor Akkerbouwprodukten en de Accountantsdienst van het Ministerie van Landbouw, Natuurbeheer en
      Visserij en zenden na afloop van elke kalendermaand een afschrift van het op die maand betrekking hebbende deel van
      het register toe aan de voorzitter van het Hoofdproduktschap voor Akkerbouwprodukten;
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel80a
  - number: 80a.4
    text: |-
      De op grond van het eerste lid erkende ondernemingen stellen de in het kader van artikel 16 van [verordening
      800/1999](31999R0800) afgegeven verklaringen inzake de lossing of verklaringen inzake de lossing en de invoer voor
      verbruik op een formulier waarvan het model door de Voorzitter van het Hoofdproduktschap voor Akkerbouwprodukten
      namens de minister wordt vastgesteld en dat volledig en naar waarheid is ingevuld, ondertekend en gedagtekend.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel80a
  - number: 80a.5
    text: |-
      De verklaringen inzake de lossing of verklaringen inzake de lossing en de invoer voor verbruik bevatten in ieder
      geval de volgende gegevens:
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel80a
  - number: 80a.5.a
    text: de gegevens als bedoeld in artikel 5, vierde lid, van [verordening 800/199](32099R0800);
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel80a
  - number: 80a.5.b
    text: de plaats en de datum van aankomst van het vervoermiddel;
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel80a
  - number: 80a.5.c
    text: de plaats en de datum van lossing van het vervoermiddel;
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel80a
  - number: 80a.5.d
    text: |-
      de plaats en de datum van vervulling van de formaliteiten voor de invoer van verbruik van de vervoerde produkten.
      Tevens bevatten de verklaringen een gedetailleerd verslag van alle gebeurtenissen en omstandigheden die van
      invloed kunnen zijn op de naleving van de communautaire wetgeving inzake de termijnen en de controle op de
      uitvoerrestituties.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel80a
  - number: '81.1'
    text: |-
      Indien, afwijkend van hetgeen bij het doen van de aangifte ten uitvoer is vermeld, het goed, door welke oorzaak
      dan ook een andere bestemming heeft bereikt, of aan dit goed een andere bestemming wordt gegeven, doet de exporteur
      hiervan ten spoedigste mededeling aan het produktschap onder opgave van de redenen die tot de wijziging van de
      bestemming hebben geleid.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel81
  - number: '81.2'
    text: |-
      Onverminderd het bepaalde in het voorgaande lid is degene die voor een restitutie in aanmerking wenst te komen
      gehouden alle voor de toekenning van de restitutie van belang zijnde gegevens te verstrekken en bescheiden over
      te leggen die het produktschap van hem verlangt en alle in verband daarmee door het produktschap gestelde vragen
      getrouwelijk prompt en naar waarheid te beantwoorden.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel81
  - number: '82'
    text: |-
      Behoudens het bepaalde in paragraaf 2 van dit hoofdstuk wordt de restitutie berekend overeenkomstig
      de gedane aangifte ten uitvoer, in voorkomend geval zoals deze achteraf is gewijzigd ingevolge
      [artikel 81, eerste lid][ref1], en met inachtneming van hetgeen is bevonden of vastgesteld: - bij de verificatie
      van de aangifte of van het daarop afgegeven document en
        - in voorkomend geval – aan de hand van het terugontvangen controle-exemplaar T 5 als bedoeld in het
      [derde lid van artikel 80][ref2];
        - bij een ingesteld nader onderzoek van zodanige aangifte, zodanig document of zodanige controle-exemplaren;
        - bij onderzoek van de door belanghebbende of ambtshalve overgelegde overige bescheiden ten bewijze van de door het
      goed bereikte bestemming en het voldoen aan de overige voor de toekenning gestelde voorwaarden dan wel
        - ingevolge andere wettelijke bepalingen De genoemde verrichtingen geschieden, in voorkomend geval in afwijking
      van het ter zake bij of krachtens de [Douanewet][ref3] bepaalde met inachtneming van hetgeen dienaangaande in de
      basisverordeningen of uitvoeringsbepalingen is voorgeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel81
      [ref2]: https://wetten.overheid.nl/BWBR0003381#Artikel80
      [ref3]: https://wetten.overheid.nl/BWBR0007632
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '81'
        hoofdstuk: V
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0003381
        artikel: '80'
        hoofdstuk: V
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0007632
  - number: 82a
    text: |-
      Als wordt geconstateerd dat een exporteur een hogere restitutie heeft gevraagd dan die welke geldt voor de
      uitgevoerde of de ten uitvoer aangegeven goederen, worden administratieve sancties op de voet van het bepaalde in
      de artikelen 51 en 52 van [verordening 800/1999](31999R0800) opgelegd.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel82a
  - number: 82b
    text: |-
      Voor de marktdeelnemers, als bedoeld in artikel 1, tweede lid, van [verordening (EG) nr. 1469/95](31995R1469) van
      de Raad van de Europese Unie van 22 juni 1995 betreffende de maatregelen die moeten worden genomen ten aanzien
      van bepaalde begunstigden van uit het EOFGL, afdeling Garantie, gefinancieerde verrichtingen, kunnen de in artikel
      3, eerste lid, onder a, b en c, van die verordening bedoelde maatregelen en de ten uitvoering daarvan gestelde
      maatregelen worden genomen.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel82b
  - number: '83.1'
    text: |-
      Behoudens het bepaalde in paragraaf 2 van dit hoofdstuk wordt de restitutie toegekend naar het tarief dat geldt op
      de dag van uitvoer van de goederen, zoals deze uit de toepassing van [artikel 8][ref1] voortvloeit. Evenwel wordt
      indien gebruik gemaakt wordt van een aan de exporteur op zijn verzoek toegekende aanspraak op restitutie tegen een
      van te voren vastgesteld tarief ten blijke daarvan een uitvoercertificaat of voorfixatiecertificaat als voorzien
      in de basisverordeningen of uitvoeringsbepalingen wordt overgelegd, de restitutie toegekend naar het tarief dat
      met inachtneming van de uitvoeringsbepalingen op dit certificaat is aangegeven of omschreven, zonodig aangepast en
      gecorrigeerd zoals in de basisverordeningen of uitvoeringsbepalingen is voorgeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel8
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '8'
        hoofdstuk: I
  - number: '83.2'
    text: |-
      In afwijking van het bepaalde in het eerste lid kan, in de gevallen waarin en op de wijze waarop de
      uitvoeringsbepalingen dit voorschrijven, het bedrag van de restitutie worden bepaald door middel van een
      inschrijving.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel83
  - number: '84.1'
    text: Op de restitutie, die wordt verleend ter zake van
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel84
  - number: 84.1.a
    text: |-
      de uitvoer van goederen al dan niet via het geografisch grondgebied van een andere Lid-Staat naar een land of
      gebied dat geen deel uitmaakt van de Gemeenschap;
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel84
  - number: 84.1.b
    text: |-
      leveranties aan een in een andere Lid-Staat gevestigde internationale organisatie, of aan strijdkrachten die
      zijn gestationeerd op het grondgebied van een Lid-Staat, doch niet tot die Lid-Staat behoren, na uitvoer naar de
      betrokken Lid-Staat, wordt op verzoek van de belanghebbende en met inachtneming van hetgeen dienaangaande in de
      uitvoeringsbepalingen is voorgeschreven door het produktschap een voorschot verleend.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel84
  - number: '84.2'
    text: 'Het voorschot wordt slechts verleend aan diegene die zich tegenover het produktschap verbindt tot:'
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel84
  - number: 84.2.a
    text: |-
      levering binnen de gestelde termijn en op de in de uitvoeringsbepalingen voorgeschreven wijze van het bewijs van
      het verlaten van het douanegebied van de Gemeenschap onderscheidenlijk van het bereiken van het bij aangifte ten
      uitvoer aangegeven land van bestemming of van een bijzondere bestemming als bedoeld in artikel 36 van [verordening
      800/1999](31999R0800);
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel84
  - number: 84.2.b
    text: |-
      indien en voor zover het onder a bedoelde bewijs niet is geleverd, terugbetaling aan het produktschap van het
      alsdan ten onrechte verkregen voorschot of gedeelte daarvan, alsmede in dat geval betaling als boete aan het
      produktschap van het bedrag dat overeenkomt met het in de uitvoeringsbepalingen voorgeschreven percentage,
      waarmee de gestelde zekerheid het verleende voorschot te boven gaat. Door het verlenen van het voorschot wordt het
      produktschap geacht deze verbintenis te hebben aanvaard. Het bepaalde in [artikel 42, tweede en vierde lid][ref1],
      is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel42
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '42'
        hoofdstuk: III
        paragraaf: '2'
  - number: '84.3'
    text: |-
      De verlening van een voorschot vindt plaats na ontvangst bij het produktschap van het formulier L, bedoeld in
      [artikel 39][ref1] van de Douaneregeling.


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel39
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '39'
        hoofdstuk: III
        paragraaf: '1'
  - number: '85.1'
    text: De toekenning van de restitutie vindt plaats door het produktschap.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel85
  - number: '85.2'
    text: De betaling van de restitutie kan overeenkomstig de uitvoeringsbepalingen in gedeelten geschieden.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel85
  - number: '85.3'
    text: |-
      In geval de restitutie wordt toegekend met plaatsing van de uit te voeren goederen onder de regeling voor
      communautair douanevervoer voor per spoor vervoerde goederen als bedoeld in het Communautair douanewetboek,
      geschiedt de betaling onder de voorwaarde dat zij als onverschuldigd zal worden aangemerkt, indien en zodra blijkt
      dat de goederen niet binnen de gestelde termijnen het douanegebied van de Gemeenschap hebben verlaten.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel85
  - number: '85.4'
    text: Het bepaalde in artikel 49, negende lid, van [verordening 800/1999](31999R0800) blijft buiten toepassing.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel85
  - number: '85.5'
    text: |-
      Het produktschap mag afzien van terugvordering, als de Lid-Staten daartoe bevoegd zijn op grond van artikel 52,
      derde lid, van [verordening 800/1999](31999R0800).
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel85
  - number: '85.6'
    text: |-
      De oplegging van de administratieve sancties, als bedoeld in artikel 51 van [verordening 800/1999](31999R0800),
      vindt plaats door het produktschap.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel85
  - number: '85.7'
    text: |-
      De in artikel 3, eerste lid, onder b en c, van [verordening (EG) nr. 1469/95](31995R1469) van de Raad van de,
      bedoelde maatregelen en de ten uitvoering daarvan gestelde maatregelen worden door het produktschap genomen. Het
      produktschap is tevens bevoegd tot het nemen van verscherpte controlemaatregelen, als bedoeld in artikel 3, eerste
      lid, onder a, van [Verordening (EG) nr. 1469/95](31995R1469), voor zover deze maatregelen betrekking hebben op de
      uitoefening van zijn taken in het kader van deze regeling.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel85
  - number: '86.1'
    text: |-
      Voor de goederen, voor welke de uitvoeringsbepalingen dit toestaan, kan de restitutie met inachtneming van hetgeen
      in die bepalingen is voorgeschreven op verzoek van de belanghebbende worden voorgefinancierd, na entreposering van
      de goederen hier te lande, of in een andere lidstaat.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel86
  - number: '86.2'
    text: |-
      Voorfinanciering van de restitutie vindt slechts plaats indien de belanghebbende zich tegenover het produktschap
      heeft verbonden tot:
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel86
  - number: 86.2.a
    text: |-
      nakoming van de verplichtingen bedoeld in [artikel 91][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel91
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '91'
        hoofdstuk: V
        paragraaf: '2'
  - number: 86.2.b
    text: |-
      indien en voor zover niet aan het onder a gestelde is voldaan, terugbetaling aan het produktschap van de alsdan
      ten onrechte verkregen restitutie, alsmede in dat geval betaling als boete aan het produktschap van het bedrag
      dat overeenkomt met het in de uitvoeringsbepalingen voorgeschreven percentage, waarmee de gestelde zekerheid de
      verleende resitutie te boven gaat. Door de voorfinanciering van de restitutie wordt het produktschap geacht deze
      verbintenis te hebben aanvaard.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel86
  - number: '86.3'
    text: 'Voor de toepassing van deze paragraaf wordt onder entreposering verstaan:'
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel86
  - number: 86.3.a
    text: |-
      indien deze plaatsvindt hier te lande: voorlopige opslag zonodig gevolgd door tijdelijke opslag in een inrichting
      voor douane-opslag en opslag in een douane-entrepot;
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel86
  - number: 86.3.b
    text: |-
      indien deze plaatsvindt in een andere lidstaat: opslag in een inrichting die volgens de ter zake geldende
      communautaire bepalingen als entrepot of vrije zone wordt aangemerkt.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel86
  - number: 86a
    text: |-
      De regeling tot plaatsen onder douanecontrole van basisprodukten staat open voor de exporteur, die voorafgaande
      toestemming heeft van het produktschap.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel86a
  - number: '87.1'
    text: |-
      De voorafgaande toestemming, bedoeld in [artikel 86a][ref1], kan aan de exporteur worden verleend, indien deze in
      ieder geval de volgende gegevens verstrekt:


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel86a
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: 86a
        hoofdstuk: V
        paragraaf: '2'
  - number: 87.1.a
    text: |-
      uitgedrukt in de GN-code en de restitutienomenclatuur de basisprodukten waarvan plaatsing onder douanecontrole
      wordt beoogd;
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel87
  - number: 87.1.b
    text: |-
      de soorten goederen en/of verwerkte produkten in verband met welker uitvoer basisprodukten onder douanecontrole
      kunnen worden geplaatst;
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel87
  - number: 87.1.c
    text: |-
      de handelsnaam of in het voorkomende geval de handelsnamen van de goederen en/of verwerkte produkten in verband met
      welker uitvoer basisprodukten onder douanecontrole kunnen worden geplaatst;
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel87
  - number: 87.1.d
    text: de locatie of locaties die kunnen worden gebruikt voor de opslag en de verwerking van de basisprodukten;
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel87
  - number: 87.1.e
    text: |-
      de rendementsverhoudingen en in voorkomend geval de coëfficiënten, die voor de berekening van de vooruit te betalen
      restitutie in aanmerking zullen worden genomen;
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel87
  - number: 87.1.f
    text: de plaats waar in de Nederland de hoofdadministratie van de exporteur is gevestigd en
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel87
  - number: 87.1.g
    text: de volledige naam en het volledig adres waar het bedrijf in Nederland is gevestigd.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel87
  - number: '87.2'
    text: |-
      Naast het verstrekken van de in het eerste lid genoemde gegevens is de exporteur voor het verkrijgen van de
      voorafgaande toestemming verplicht om continu een zodanige administratie te voeren, dat naar het oordeel van het
      produktschap de basisprodukten, de verwerking daarvan en de uitvoer van de verwerkte produkten of goederen kunnen
      worden gevolgd.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel87
  - number: '87.3'
    text: |-
      Wijziging in de omstandigheden op grond waarvan de voorafgaande toestemming, bedoeld in [artikel 86a][ref1], is
      verleend meldt de exporteur per ommegaande aan het produktschap


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel86a
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: 86a
        hoofdstuk: V
        paragraaf: '2'
  - number: '88'
    text: |-
      Het produktschap kan, indien het dat nodig acht, aanvullend op de verplichtingen, bedoeld in
      [artikel 87, eerste lid en tweede lid][ref1], nadere verplichtingen opleggen aan de exporteur.


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel87
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel88
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '87'
        hoofdstuk: V
        paragraaf: '2'
  - number: '89.1'
    text: |-
      Het produktschap kan na een schriftelijk en gemotiveerd verzoek van de exporteur ontheffing verlenen van één of
      meer verplichtingen, bedoeld in [artikel 87][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel87
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '87'
        hoofdstuk: V
        paragraaf: '2'
  - number: '89.2'
    text: |-
      Door het produktschap kan bij het verlenen van de ontheffing, bedoeld in het eerste lid, nadere verplichtingen aan
      de exporteur worden opgelegd.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel89
  - number: '90.1'
    text: |-
      De exporteur dient het verzoek tot het verkrijgen van de voorafgaande toestemming, bedoeld in [artikel 86a][ref1],
      in door middel van een volledig en naar waarheid ingevuld formulier, overeenkomstig het door het produktschap
      vastgestelde model, bij het produktschap.


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel86a
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: 86a
        hoofdstuk: V
        paragraaf: '2'
  - number: 90a.1
    text: |-
      De verlening van de voorafgaande toestemming, bedoeld in [artikel 86a][ref1], of de ontheffing, bedoeld in
      [artikel 89, eerste lid][ref2], geschiedt slechts na raadpleging van de inspecteur, bedoeld in [artikel 32][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel86a
      [ref2]: https://wetten.overheid.nl/BWBR0003381#Artikel89
      [ref3]: https://wetten.overheid.nl/BWBR0003381#Artikel32
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel90a
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: 86a
        hoofdstuk: V
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0003381
        artikel: '89'
        hoofdstuk: V
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0003381
        artikel: '32'
        hoofdstuk: II
        paragraaf: '3'
  - number: 90a.2
    text: |-
      De belastingdienst onderzoekt of de exporteur aan de verplichtingen, bedoeld in [artikel 87][ref1],
      [artikel 88][ref2] en [artikel 89, tweede lid][ref3], voldoet.


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel87
      [ref2]: https://wetten.overheid.nl/BWBR0003381#Artikel88
      [ref3]: https://wetten.overheid.nl/BWBR0003381#Artikel89
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel90a
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '87'
        hoofdstuk: V
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0003381
        artikel: '88'
        hoofdstuk: V
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0003381
        artikel: '89'
        hoofdstuk: V
        paragraaf: '2'
  - number: 90a.3
    text: De exporteur is verplicht om medewerking te verlenen aan het onderzoek, bedoeld in het vorige lid.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel90a
  - number: 90b.1
    text: |-
      De voorafgaande toestemming, bedoeld in [artikel 86a][ref1], geldt maximaal voor 1 jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel86a
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel90b
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: 86a
        hoofdstuk: V
        paragraaf: '2'
  - number: 90b.2
    text: |-
      De in het eerste lid bedoelde geldigheidsduur wordt telkens stilzwijgend met 1 jaar verlengd, tenzij een maand
      voor het einde van die geldigheidsduur de exporteur schriftelijk op de hoogte is gebracht van het feit, dat de
      voorafgaande toestemming komt te vervallen.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel90b
  - number: 90c
    text: |-
      De voorafgaande toestemming, bedoelde in [artikel 86a][ref1], kan te allen tijde door het produktschap onder opgave
      van reden worden ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel86a
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel90c
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: 86a
        hoofdstuk: V
        paragraaf: '2'
  - number: 90d
    text: |-
      De ontheffing, bedoeld in [artikel 89, eerste lid][ref1], kan te allen tijde door het produktschap onder opgave van
      reden worden ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel89
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel90d
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '89'
        hoofdstuk: V
        paragraaf: '2'
  - number: 90e.1
    text: |-
      De voorafgaande toestemming, bedoeld in [artikel 86a][ref1], wordt door het produktschap aan de exporteur kenbaar
      gemaakt door middel van toezending van een document, overeenkomstig het door het produktschap vastgestelde model.


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel86a
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel90e
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: 86a
        hoofdstuk: V
        paragraaf: '2'
  - number: 90e.2
    text: |-
      Het produktschap stuurt een afschrift van de voorafgaande toestemming aan de inspecteur, bedoeld in
      [artikel 32][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel32
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel90e
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '32'
        hoofdstuk: II
        paragraaf: '3'
  - number: 90f
    text: |-
      De exporteur die basisprodukten onder douanecontrole heeft geplaatst, meldt de voorgenomen verwerking van die
      basisprodukten bij de in [artikel 32][ref1] bedoelde inspecteur op een zodanig tijdstip dat laatstbedoelde
      uiterlijk één werkdag voor de aanvang van die voorgenomen verwerking.


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel32
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel90f
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '32'
        hoofdstuk: II
        paragraaf: '3'
  - number: 90g.1
    text: |-
      Het produktschap kan op verzoek van de exporteur ontheffing verlenen van de melding, bedoeld in
      [artikel 90f][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel90f
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel90g
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: 90f
        hoofdstuk: V
        paragraaf: '2'
  - number: 90g.2
    text: Door het produktschap kunnen nadere verplichtingen aan de in het eerste lid bedoelde worden gesteld.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel90g
  - number: 90g.3
    text: |-
      De verlening van de in het eerste lid bedoelde ontheffing geschiedt slechts na raadpleging van de inspecteur,
      bedoeld in [artikel 32][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel32
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel90g
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '32'
        hoofdstuk: II
        paragraaf: '3'
  - number: 90h
    text: |-
      De melding, bedoeld in [artikel 90f][ref1], geschiedt schriftelijk, onder vermelding van:


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel90f
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel90h
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: 90f
        hoofdstuk: V
        paragraaf: '2'
  - number: 90h.a
    text: |-
      het nummer en de datum van de betalingsaangifte, bedoeld in [artikel 32][ref1], waarbij de te verwerken
      basisprodukten onder douanecontrole zijn geplaatst;


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel32
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel90h
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '32'
        hoofdstuk: II
        paragraaf: '3'
  - number: 90h.b
    text: de verwerkingslocatie of verwerkingslocaties waar de verwerking plaats zal vinden en
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel90h
  - number: 90h.c
    text: per verwerkingslocatie wordt de verwerkingsperiode aangegeven.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel90h
  - number: 90i
    text: |-
      De ontheffing, bedoeld in [artikel 90g, eerste lid][ref1], wordt door het produktschap vermeld op het document,
      bedoeld in [artikel 90e, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel90g
      [ref2]: https://wetten.overheid.nl/BWBR0003381#Artikel90e
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel90i
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: 90g
        hoofdstuk: V
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0003381
        artikel: 90e
        hoofdstuk: V
        paragraaf: '2'
  - number: 90j.1
    text: |-
      Op verzoek van de exporteur kan het productschap aan die exporteur toestaan om basisproducten, als bedoeld in
      artikel 28, derde lid, van [verordening 800/1999](31999R0800), te vervangen door equivalente basisproducten.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel90j
  - number: 90j.2
    text: |-
      Op verzoek van de exporteur kan het productschap aan die exporteur toestaan om in bulk opgeslagen tussenproducten
      als bedoeld in artikel 28, vierde lid, van [verordening 800/1999](31999R0800), te vervangen door equivalente
      tussenproducten.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel90j
  - number: 90k.1
    text: |-
      Indien de exporteur equivalentie toepast meldt hij dat vooraf schriftelijk aan de inspecteur, bedoeld in
      [artikel 32, onder][ref1] vermelding van:


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel32
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel90k
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '32'
        hoofdstuk: II
        paragraaf: '3'
  - number: 90k.1.a
    text: de hoeveelheid basisprodukten, die door equivalente basisprodukten wordt vervangen;
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel90k
  - number: 90k.1.b
    text: de opslaglocatie of opslaglocaties van de te vervangen basisprodukten;
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel90k
  - number: 90k.1.c
    text: de opslaglocatie of opslaglocaties van de equivalente basisprodukten en
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel90k
  - number: 90k.1.d
    text: |-
      het nummer en de datum van de betalingsaangifte, bedoeld in [artikel 32][ref1], waarbij de te verwerken
      basisprodukten onder douanecontrole zijn geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel32
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel90k
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '32'
        hoofdstuk: II
        paragraaf: '3'
  - number: 90k.2
    text: De exporteur maakt een aantekening van elke toepassing van equivalentie in zijn administratie.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel90k
  - number: 90l.1
    text: |-
      Het produktschap kan op verzoek van de exporteur ontheffing verlenen van de melding, bedoeld in
      [artikel 90k][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel90k
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel90l
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: 90k
        hoofdstuk: V
        paragraaf: '2'
  - number: 90l.2
    text: Aan de in het eerst lid bedoelde ontheffing kunnen voorwaarden door het produktschap worden gesteld.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel90l
  - number: 90l.3
    text: |-
      De verlening van de in het eerste lid bedoelde ontheffing geschiedt slechts na raadpleging van de inspecteur,
      bedoeld in [artikel 32][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel32
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel90l
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '32'
        hoofdstuk: II
        paragraaf: '3'
  - number: '91'
    text: |-
      De indiening van de aangifte als bedoeld in [artikel 21, onder a][ref1], door middel waarvan het verzoek wordt
      gedaan tot vooruitbetaling van de restitutie wegens entreposering, brengt voor degene die daarin als exporteur
      is aangeduid de verplichting mede om de voor uitvoer aangegeven goederen in ongewijzigde staat, als bedoeld in de
      uitvoeringsbepalingen, en binnen de daarin vastgestelde termijnen: - het grondgebied van de Gemeenschap te doen
      verlaten of binnen de Gemeenschap een bijzondere bestemming als bedoeld in [artikel 79][ref2] te doen bereiken en
        - van een en ander op de voorgeschreven wijze te doen blijken.


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0003381#Artikel79
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '21'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0003381
        artikel: '79'
        hoofdstuk: V
        paragraaf: '1'
  - number: '92'
    text: |-
      Ingeval entreposering van de goederen plaatsvindt in een andere lidstaat, wordt het bewijs dat de goederen na
      entreposering in ongewijzigde staat achtereenvolgens zijn uitgeslagen en hetzij zijn uitgegaan uit de Gemeenschap
      hetzij een bijzondere bestemming, als bedoeld in [artikel 79][ref1], hebben bereikt, geleverd door een controle-
      exemplaar T 5, houdende de volgende gegevens: - de soort en de hoeveelheid van de uitgeslagen goederen;
        - de datum van uitslag;
        - het uitgaan van de goederen uit de Gemeenschap, dan wel het bereiken van een bijzondere bestemming, als bedoeld
      in [artikel 79][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel79
      [ref2]: https://wetten.overheid.nl/BWBR0003381#Artikel79
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '79'
        hoofdstuk: V
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0003381
        artikel: '79'
        hoofdstuk: V
        paragraaf: '1'
  - number: '93.1'
    text: |-
      Het stellen van de met het oog op het verkrijgen van vooruitbetaling van de restitutie na ondercontrolestelling
      van de te verwerken goederen goederen dan wel na entreposering in de uitvoeringsbepalingen voorgeschreven
      zekerheid als garantie, dat binnen de gestelde termijnen zal worden voldaan aan de verplichtingen, weergegeven
      in de [artikelen 89, tweede lid][ref1] en [91][ref2], geschiedt bij het produktschap. Het bepaalde in het
      [artikel 42, tweede lid][ref3], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel89
      [ref2]: https://wetten.overheid.nl/BWBR0003381#Artikel91
      [ref3]: https://wetten.overheid.nl/BWBR0003381#Artikel42
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '89'
        hoofdstuk: V
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0003381
        artikel: '91'
        hoofdstuk: V
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0003381
        artikel: '42'
        hoofdstuk: III
        paragraaf: '2'
  - number: '93.2'
    text: |-
      Het produktschap neemt bij de berekening van de zekerheid onderscheidenlijk de gehele of gedeeltelijke vrijgave
      daarvan, onderscheidenlijk de terugvordering van de vooruitbetaalde bedragen tot garantie waarvan de zekerheid is
      gesteld, het gestelde in de artikelen 33 en 35 van [verordening 800/1999](31999R0800) in acht. Het produktschap
      past onder omstandigheden artikel 43 van [Verordening (EEG) nr. 3719/88](31988R3719) toe.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel93
  - number: '94'
    text: |-
      In aanvulling op dan wel in afwijking van de bepalingen van deze regeling en onverminderd het bepaalde in
      [verordening 800/1999](31999R0800), gelden de volgende bepalingen bij levering voor proviandering, als bedoeld in
      titel III van genoemde verordening, waarbij aanspraak op restitutie of een voorschot daarop wordt gemaakt dan wel
      de Beschikking actief veredelingsverkeer 1986 wordt toegepast.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel94
  - number: '95'
    text: |-
      – Bij levering voor proviandering van zeeschepen en luchtvaartuigen in de Gemeenschap, als bedoeld in artikel 36,
      eerste lid, onder a, van [verordening 800/1999](31999R0800), alsmede voor boor- en produktieplatforms en marine-
      en hulpschepen, als bedoeld in [artikel 44][ref1] van genoemde verordening, dient de exporteur, ter verkrijging
      van de restitutie danwel afboeking in het veredelingsverkeer, op de aangifte ten uitvoer alsmede in vak 44 van
      het formulier L, bedoeld in [artikel 39][ref2] van de Douaneregeling, te vermelden: ‘Bestemd voor boordproviand’
      alsmede de naam en de vlag van het zee-, marine- of hulpschip of het registratienummer van het luchtvaartuig, boor-
      of produktieplatform.


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0003381#Artikel39
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '44'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0003381
        artikel: '39'
        hoofdstuk: III
        paragraaf: '1'
  - number: 95a
    text: |-
      Het aanvullend bewijs als bedoeld in artikel 31, tweede lid, onderdeel a, van [verordening (EEG) nr. 3719/88]
      (31988R3719) van de Commissie van 16 november 1988, houdende gemeenschappelijke uitvoeringsbepalingen inzake het
      stelsel van invoer-, uitvoer- en voorfixatiecertificaten voor landbouwprodukten (PbEG L 331), wordt geleverd door
      een voor uitvoer afgetekend controle-exemplaar T 5.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel95a
  - number: '96.1'
    text: |-
      Bij levering voor proviandering van zeeschepen en luchtvaartuigen in de Gemeenschap, als bedoeld in artikel
      36, eerste lid, onder a, van [verordening 800/1999](31999R0800), alsmede voor proviandering van boor- en
      productieplatforms en marine- en hulpschepen, als bedoeld in [artikel 44][ref1] van genoemde verordening, kan
      in afwijking van [artikel 17][ref2], op voet van het bepaalde in [artikel 37][ref3] van genoemde verordening,
      onder toepassing van de volgende procedure en voorwaarden, restitutie worden toegekend dan wel afboeking in het
      veredelingsverkeer plaatsvinden.


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0003381#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0003381#Artikel37
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '44'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0003381
        artikel: '17'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0003381
        artikel: '37'
        hoofdstuk: III
        paragraaf: '1'
  - number: '96.2'
    text: |-
      De exporteur dient voor de verkrijging van de restitutie danwel afboeking in het veredelingsverkeer aan de volgende
      voorwaarden te voldoen.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel96
  - number: 96.2.a
    text: |-
      De exporteur dient een toestemming te hebben als bedoeld in artikel 37, eerste lid, van [verordening 800/1999]
      (31999R0800).
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel96
  - number: 96.2.b
    text: |-
      De aangifte ten uitvoer moet volledig en naar waarheid worden gedaan met gebruikmaking van de exemplaren 1, 2 en
      3 van het formulier Enig document, waarop in vak 44 de vermelding ED 63 is aangebracht, of met de exemplaren 2
      en 3 van het formulier Enig document en een extra exemplaar, waarop in vak 44 de vermelding ED 69 is aangebracht,
      met, voor zover het formulier niet toereikend is voor de vereiste gegevens, aan het formulier een specificatie
      gehecht, waarop is aangegeven voor welke goederen aanspraak op restitutie wordt gemaakt dan wel afboeking in het
      veredelingsverkeer wordt verlangd. In het geval basisprodukten onder douanecontrole zijn geplaatst, bedoeld in
      [artikel 86a][ref1], wordt op het formulier het nummer en de datum van de betreffende betalingsaangifte vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel86a
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: 86a
        hoofdstuk: V
        paragraaf: '2'
  - number: 96.2.c
    text: |-
      Voor afloop van de kalendermaand volgend op die van de aangifte ten uitvoer moet bij het produktschap een staat
      zijn ingediend met het verzoek om toekenning van de restitutie.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel96
  - number: 96.2.d
    text: |-
      De staat dient betrekking te hebben op alle in de voorafgaande kalendermaand ter bestemming afgeleverde goederen,
      dan wel op alle verrichte leveranties waarvoor in de voorafgaande kalendermaand aangifte ten uitvoer is gedaan
      en dient te zijn gespecificeerd naar post of postonderverdeling van de gecombineerde nomenclatuur en, indien van
      toepassing, restitutiecode. Voor de hier te lande verrichte leveranties dient de staat per exportdatum te worden
      ingevuld onder vermelding van de datum van aangifte ten uitvoer en de naam en de vlag van het zee-, marine- of
      hulpschip dan wel het registratienummer van het luchtvaartuig, boor- of produktieplatform waar de goederen aan
      boord zijn gebracht. In geval van vaststelling van de restitutie vooraf worden bij de betrokken leveranties tevens
      de nummers van de te benutten voorfixatiecertificaten vermeld. De gegevens die betrekking hebben op de hier te
      lande verrichte leveranties aan boor- en produktieplatforms en marine- en hulpschepen en die welke betrekking
      hebben op leveranties hier te lande aan zeeschepen en luchtvaartuigen dienen te worden vermeld op afzonderlijke
      maandstaten. De gegevens die betrekking hebben op leveranties in andere Lid-Staten dienen te worden vermeld op de
      daarvoor bestemde specifieke maandstaten. Voorzover de maandstaat zelf niet toereikend is voor de vermelding van de
      voorgeschreven gegevens, kunnen zij worden vermeld op aan de maandstaten gehechte bijlagen.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel96
  - number: '96.3'
    text: |-
      Het exemplaar nr. 3 van het formulier Enig document waarop in vak 44 de vermelding ED 63 is aangebracht dan wel
      het extra exemplaar behorend bij het formulier Enig document waarop in vak 44 de vermelding ED 69 is aangebracht
      wordt, tezamen met eventuele specificaties, na behandeling door de belastingdienst aan de exporteur toegezonden. De
      exporteur houdt dit exemplaar in de in [artikel 101b][ref1] bedoelde bedrijfsadministratie ter beschikking van de
      Algemene Inspectiedienst. Ten behoeve van de toezending wordt door de exporteur op de achterzijde van het betrokken
      exemplaar zijn adres vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel101b
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: 101b
        hoofdstuk: V
        paragraaf: '3'
  - number: 96.4.a
    text: |-
      Het produktschap kent de restitutie toe aan de hand van: - de daartoe op de staat geplaatste aanvraag;
        - de bevindingen van het produktschap bij het onderzoek van de ingediende staat;
        - het terugontvangen controle-exemplaar T 5, in geval van levering in of via een andere Lid-Staat, waaruit dient te
      blijken dat de goederen binnen de voorgeschreven termijn de bijzondere bestemming, als bedoeld in het eerste lid,
      hebben bereikt.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel96
  - number: 96.4.b
    text: |-
      Behoudens vaststelling vooraf, wordt de restitutie berekend en worden, in voorkomend geval, de noodzakelijke
      aanpassingen bepaald naar de restitutievoet geldende op de laatste dag van de kalendermaand waarop de aanvraag
      betrekking heeft. In geval van vaststelling vooraf dienen de voorfixatiecertificaten of uittreksels daarvan, om in
      aanmerking te worden genomen, nog geldig te zijn op de laatste dag van de maand waarvoor de staat wordt ingediend.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel96
  - number: 96.4.c
    text: |-
      In voorkomend geval schrijft het produktschap onder toepassing van de depotregeling van certificaten, als bedoeld
      in [artikel 45][ref1], op het certificaat of het uittreksel daarvan de hoeveelheden af die overeenstemmen met de
      voor het betreffende goed op de staat vermelde hoeveelheden


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel45
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '45'
        hoofdstuk: III
        paragraaf: '2'
  - number: '96.5'
    text: |-
      De exporteur aan wie toestemming is verleend, als bedoeld in het tweede lid, onder a, mag, zolang deze toestemming
      van kracht is, voor de proviandering, als bedoeld in het eerste lid, geen gebruik maken van andere procedures ter
      verkrijging van restitutie, behoudens de regeling tot het onder douanecontrole plaatsen van basisprodukten, bedoeld
      in [artikel 86a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel86a
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: 86a
        hoofdstuk: V
        paragraaf: '2'
  - number: '97.1'
    text: |-
      Bij levering via een zich hier te lande bevindend bevoorradingsdepot, als bedoeld in artikel 40 van [verordening
      800/1999](31999R0800), van zeeschepen en luchtvaartuigen in de Gemeenschap, voor proviandering van boor- en
      produktieplatforms en marine- en hulpschepen, alsmede voor rechtstreekse proviandering van zeeschepen buiten de
      Gemeenschap, als bedoeld in [artikel 43, derde lid, onder a][ref1], van genoemde verordening, kan op voet van
      het bepaalde in eerstgenoemd artikel, onder toepassing van de volgende procedure en voorwaarden restitutie worden
      toegekend bij wijze van voorschot dan wel afboeking in veredelingsverkeer plaatsvinden.


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel43
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel97
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '43'
        hoofdstuk: III
        paragraaf: '2'
  - number: '97.2'
    text: |-
      Het in artikel 41, eerste lid, van [verordening 800/1999](31999R0800) bedoelde nationale document is het controle-
      exemplaar T 5.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel97
  - number: '97.3'
    text: |-
      De exporteur dient voor de verkrijging van het voorschot dan wel de afboeking in het veredelingsverkeer aan de
      volgende voorwaarden te voldoen.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel97
  - number: 97.3.a
    text: |-
      De aantekening ‘Opslag in depot onder verplichting van levering voor bevoorrading van zeeschepen of luchtvaartuigen
      – toepassing van artikel 40 van [verordening 800/1999](31999R0800)’ wordt vermeld: - op de aangifte ten uitvoer;
        - in vak 44 van het bij die aangifte over te leggen formulier L, bedoeld in [artikel 39][ref1] van de
      Douaneregeling en
        - in vak 104, onder de rubriek ‘Andere’, van het controle-exemplaar T 5.


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel39
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel97
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '39'
        hoofdstuk: III
        paragraaf: '1'
  - number: 97.3.b
    text: |-
      De ten uitvoer aangegeven goederen worden binnen dertig dagen na aanvaarding van de aangifte opgeslagen in
      een vrij entrepot, als bedoeld in artikel 828 van [verordening (EEG) nr. 2454/93](31993R2454) van de Commissie
      van de Europese Gemeenschappen van 2 juli 1993, houdende vaststelling van enkele bepalingen ter uitvoering van
      [verordening (EEG) nr. 2913/92](31992R2913) van de Raad tot vaststelling van het communautair douanewetboek, of
      een douane-entrepot type c, d of e, als bedoeld in artikel 506 van [verordening (EEG) nr. 2454/93](31993R2454)
      van de Commissie van de Europese Gemeenschappen van 2 juli 1993, houdende vaststelling van enkele bepalingen
      ter uitvoering van [verordening (EEG) nr. 2913/92](31992R2913) van de Raad tot vaststelling van het communautair
      douanewetboek.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel97
  - number: 97.3.c
    text: |-
      Dit bevoorradingsdepot dient ter beschikking te staan van een natuurlijke persoon of rechtspersoon die is erkend
      als depothouder in de zin van artikel 40, tweede lid, van [verordening 800/1999](31999R0800).
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel97
  - number: 97.3.d
    text: |-
      Op het formulier L dan wel, indien dit op de plaats van aangifte, niet zijnde de plaats van inslag, is
      achtergehouden, op het uitvoerdocument, dient door de depothouder schriftelijk te worden verklaard dat hij de
      goederen heeft ingeslagen.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel97
  - number: '97.4'
    text: |-
      4. Het controle-exemplaar T 5 wordt door de Belastingdienst behandeld. Na constatering van de inslag van
      betreffende goederen in het bevoorradingsdepot wordt het controle-exemplaar T 5 terstond door de Belastingdienst
      naar het produktschap gezonden.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel97
  - number: 97.5.a
    text: |-
      Het produktschap kent het voorschot toe aan de hand van: - de aanvrage zoals deze blijkt uit het formulier L,
      bedoeld in [artikel 39][ref1] van de Douaneregeling;
        - de bevindingen van de belastingdienst bij de verificatie van de aangifte ten uitvoer en bij inslag in het
      bevoorradingsdepot;


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel39
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel97
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '39'
        hoofdstuk: III
        paragraaf: '1'
  - number: 97.5.b
    text: |-
      Behoudens vaststelling vooraf, wordt de restitutie berekend en worden, in voorkomend geval, de noodzakelijke
      aanpassingen bepaald naar de restitutievoet geldende op de dag van aanvaarding van de aangifte ten uitvoer
      voorafgaande aan de inslag van de goederen in het bevoorradingsdepot.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel97
  - number: 97.5.c
    text: |-
      Het produktschap zendt terstond na de behandeling van het controle-exemplaar T 5 een fotokopie daarvan aan
      het kantoor van de regionale inspectie van de Algemene Inspectiedienst binnen welks ressort de opslag heeft
      plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel97
  - number: 97a
    text: |-
      Levering in een derde land, al dan niet via een aldaar gelegen bevoorradingsdepot geschiedt volgens de navolgende
      procedure
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel97a
  - number: 97a.a
    text: |-
      op de aangifte ten uitvoer, alsmede op het formulier L, als bedoeld in [artikel 19][ref1]. dient al naar gelang
      het geval te worden vermeld: ‘bestemd voor boordproviand directe leverantie’, dan wel ‘bestemd voor boordproviand
      entrepotopslag’;


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel19
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel97a
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '19'
        hoofdstuk: II
        paragraaf: '2'
  - number: 97a.b
    text: |-
      de restitutie wordt eerst toegekend nadat - overeenkomstig het bepaalde in artikel 45 van [verordening 800/1999]
      (31999R0800) is bewezen dat de op het formulier L, als bedoeld in [artikel 19][ref1]. vermelde goederen feitelijk
      aan boord zijn gebracht;
        - volledige gegevens over de aan boord geleverde produkten zijn verstrekt aan het produktschap, alsmede gegevens
      omtrent de leveringsdatum, de naam en de vlag van het schip of het registratienummer van het luchtvaartuig;
        - ten genoegen van het produktschap is aangetoond dat de als boordproviand geleverde hoeveelheden overeenstemmen
      met de normale behoeften van de bemanningsleden en de passagiers van het betrokken schip of luchtvaartuig;


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel19
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel97a
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '19'
        hoofdstuk: II
        paragraaf: '2'
  - number: 97a.c
    text: |-
      Indien de in [artikel 45, derde lid, onderdeel a en b][ref1], tweede gedachtestreepje, van [verordening 800/1999]
      (31999R0800) voorgeschreven documenten niet kunnen worden overgelegd, kan het produktschap, in overeenstemming
      met de Directie Juridische en Bedrijfsorganisatorische Zaken van het Ministerie van Landbouw en Visserij,
      op een met redenen omkleed schriftelijk verzoek van de exporteur toestaan, dat het bewijs wordt geleverd
      met een door de scheepskapitein of een andere scheepsofficier van dienst respectievelijk door een beambte
      van de luchtvaartmaatschappij ondertekend certificaat van ontvangst, dat is voorzien van een scheepsstempel
      respectievelijk het stempel van de luchtvaartmaatschappij.


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel45
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel97a
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '45'
        hoofdstuk: III
        paragraaf: '2'
  - number: 97a.d
    text: |-
      op goederen, welke niet zijn bestemd voor directe leverantie als bedoeld in artikel 45 van [verordening 800/1999]
      (31999R0800) vindt [artikel 97][ref1] geen toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel97
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel97a
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '97'
        hoofdstuk: V
        paragraaf: '3'
  - number: '98.1'
    text: |-
      Bij levering voor proviandering, als bedoeld in [artikel 97, eerste lid][ref1], welke niet via een zich hier
      te lande maar via een zich in een andere Lid-Staat bevindend bevoorradingsdepot plaatsvindt, kan op voet van
      het bepaalde in artikel 40 van [verordening 800/1999](31999R0800), onder toepassing van de volgende procedure
      en voorwaarden restitutie worden toegekend bij wijze van voorschot danwel afboeking in het veredelingsverkeer
      plaatsvinden.


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel97
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel98
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '97'
        hoofdstuk: V
        paragraaf: '3'
  - number: '98.2'
    text: |-
      De exporteur dient voor de verkrijging van het voorschot danwel afboeking in het veredelingsverkeer aan de volgende
      voorwaarden te voldoen.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel98
  - number: 98.2.a
    text: |-
      Op de aangifte ten uitvoer alsmede in vak 44 van het bij die aangifte over te leggen formulier L, bedoeld in
      [artikel 39][ref1] van de Douaneregeling, dient tevens te worden vermeld: ‘Opslag in depot onder verplichting van
      levering voor bevoorrading van zeeschepen of luchtvaartuigen- toepassing van artikel 40 van [verordening 800/1999]
      (31999R0800) alsmede de Lid-Staat waar het bevoorradingsdepot zich bevindt.


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel39
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel98
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '39'
        hoofdstuk: III
        paragraaf: '1'
  - number: 98.2.b
    text: |-
      De ten uitvoer aangegeven goederen dienen binnen dertig dagen na aanvaarding van de aangifte te zijn opgeslagen
      in een door de Lid-Staat van bestemming erkend bevoorradingsdepot, als bedoeld in artikel 40, tweede lid, van
      [verordening 800/1999](31999R0800).
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel98
  - number: '98.3'
    text: |-
      Het formulier L, bedoeld in [artikel 39][ref1] van de Douaneregeling, wordt door de belastingdienst na behandeling
      terstond verzonden naar het produktschap. Dit geldt ook voor het terugontvangen controle-exemplaar T 5


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel39
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel98
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '39'
        hoofdstuk: III
        paragraaf: '1'
  - number: 98.4.a
    text: |-
      Het produktschap kent het voorschot toe aan de hand van: - de daartoe strekkende aanvraag zoals deze blijkt uit het
      formulier L, bedoeld in [artikel 39][ref1] van de Douaneregeling:
        - de bevindingen van de belastingdienst bij de verificatie van de aangifte ten uitvoer.
        - het terugontvangen controle-exemplaar T 5 waaruit dient te blijken dat aan de in het tweede lid, onder b,
      genoemde voorwaarde is voldaan


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel39
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel98
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '39'
        hoofdstuk: III
        paragraaf: '1'
  - number: 98.4.b
    text: |-
      Behoudens vaststelling vooraf, wordt de restitutie berekend en worden, in voorkomend geval, de noodzakelijke
      aanpassingen bepaald naar de restitutievoet geldende op de dag van aanvaarding van de aangifte ten uitvoer
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel98
  - number: '99.1'
    text: |-
      Bij inslag in een bevoorradingsdepot hier te lande van een goed waarvoor in een andere Lid-Staat aangifte
      ten uitvoer is gedaan met aanspraak op restitutie bij wijze van voorschot op voet van het bepaalde in artikel
      40 van [verordening 800/1999](31999R0800), dient door de depothouder aan de met betrekking tot de inslag
      bevoegde ambtenaar van de belastingdienst een fotokopie van het controle-exemplaar T 5, als bedoeld in
      [artikel 41, tweede lid][ref1], van genoemde verordening, waarop het depot van inslag staat vermeld, ter hand te
      worden gesteld


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel41
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '41'
        hoofdstuk: III
        paragraaf: '2'
  - number: '99.2'
    text: |-
      De belastingdienst tekent de in het eerste lid bedoelde fotokopie voor inslag in het depot af, nadat de depothouder
      daarop schriftelijk heeft verklaard dat hij de aangeleverde goederen heeft ingeslagen, en zendt deze vervolgens toe
      aan het gewestelijke kantoor van de Algemene Inspectiedienst binnen welks ressort de opslag heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel99
  - number: '99.3'
    text: |-
      Het controle-exemplaar T 5, als bedoeld in het eerste lid, wordt door de belastingdienst met afgetekend dan nadat
      zij heeft vastgesteld: - dat het in het eerste lid bedoelde bevoorradingsdepot een bevoorradingsdepot is als
      bedoeld in [artikel 97, tweede lid, onder b][ref1].
        - dat de in het eerste lid bedoelde depothouder een depothouder is als bedoeld in
      [artikel 97, tweede lid, onder c][ref2], en
        - dat de in het bevoorradingsdepot ingeslagen goederen zijn ingeschreven in het in
      [artikel 101b, eerste lid][ref3], bedoelde register


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel97
      [ref2]: https://wetten.overheid.nl/BWBR0003381#Artikel97
      [ref3]: https://wetten.overheid.nl/BWBR0003381#Artikel101b
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '97'
        hoofdstuk: V
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0003381
        artikel: '97'
        hoofdstuk: V
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0003381
        artikel: 101b
        hoofdstuk: V
        paragraaf: '3'
  - number: '100.1'
    text: |-
      Bij levering voor proviandering van boor- of produktieplatforms en marine- en hulpschepen, als bedoeld in artikel
      44, eerste lid, van [verordening 800/1999](31999R0800), gelden voor de toekenning van restitutie dan wel afboeking
      in het veredelingsverkeer, de volgende aanvullende bepalingen
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel100
  - number: '100.2'
    text: |-
      De proviandering hier te lande van een platform dient te geschieden met gebruikmaking van een bevoorradingsschip of
      -helikopter welke wordt geëxploiteerd door een als exploitant erkende natuurlijke of rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel100
  - number: '100.3'
    text: |-
      Levering voor proviandering van een platform dient plaats te vinden op basis van een schriftelijke overeenkomst,
      waarin de exploitant van het platform of diens vertegenwoordiger zich ertoe verbindt de goederen slechts te
      benutten ter consumptie op het platform door het boordpersoneel. In de overeenkomst dient tevens te zijn vermeld
      welke voor de exploitant van het platform werkzame personen bevoegd zijn tot afgifte en ondertekening van het in
      artikel 44, tweede lid, van [verordening 800/1999](31999R0800) bedoelde leverantiebewijs.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel100
  - number: '100.4'
    text: |-
      In de overeenkomst, als bedoeld in het derde lid, verplicht de exploitant zich tegenover de exporteur aan de
      Algemene Inspectiedienst op haar verzoek inzage te verschaffen in een door de exploitant bij te houden register
      van alle leveranties voor proviandering van het betrokken platform. Dit register dient een globale beschrijving
      te bevatten van de geleverde goederen en hoeveelheden, de data van levering aan boord en de namen van de betrokken
      exporteurs.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel100
  - number: '100.5'
    text: |-
      Het produktschap kent de restitutie toe aan de hand van de in [artikel 39][ref1] van de Douaneregeling en de
      [artikelen 95][ref2] en [96][ref3] voor de toekenning van restitutie voorgeschreven documenten alsmede aan de hand
      van het leverantiebewijs, als bedoeld in artikel 44, tweede lid, van [verordening 800/1999](31999R0800).


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0003381#Artikel95
      [ref3]: https://wetten.overheid.nl/BWBR0003381#Artikel96
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel100
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '39'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0003381
        artikel: '95'
        hoofdstuk: V
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0003381
        artikel: '96'
        hoofdstuk: V
        paragraaf: '3'
  - number: '100.6'
    text: |-
      Voor zover het levering aan platforms betreft, vervalt het recht op restitutie indien de exporteur geen
      overeenkomst houdende de in het derde en vierde lid genoemde verplichtingen ter beschikking van de Algemene
      Inspectiedienst houdt of de in deze overeenkomst genoemde verplichtingen door de exploitant van het platform met
      zijn nageleefd
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel100
  - number: '101.1'
    text: |-
      Bij levering voor proviandering van zeeschepen en luchtvaartuigen in een derde land, als bedoeld in artikel 45 van
      [verordening 800/1999](31999R0800), al dan met via entrepotopslag aldaar, gelden voor de toekenning van restitutie
      dan wel afboeking in het veredelingsverkeer de volgende aanvullende bepalingen
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel101
  - number: '101.2'
    text: |-
      De exporteur dient op de aangifte ten uitvoer alsmede in vak 44 van het formulier L, bedoeld in [artikel 39][ref1]
      van de Douaneregeling, te vermelden: ‘Bestemd voor boordproviand directe leverantie’, danwel ‘Bestemd voor
      boordproviand entrepotopslag’


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel39
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel101
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '39'
        hoofdstuk: III
        paragraaf: '1'
  - number: '101.3'
    text: |-
      Het produktschap kent de restitutie slechts toe als de volgende aanvullende bewijsdocumenten door de exporteur
      zijn overgelegd: - het document danwel, naar gelang van het geval, de documenten waarmee overeenkomstig artikel
      45, derde lid, onder a en b, van [verordening 800/1999](31999R0800) is bewezen dat de op het formulier L, bedoeld
      in [artikel 39][ref1] van de Douaneregeling, vermelde goederen daadwerkelijk aan boord zijn gebracht. De genoemde
      documenten dienen volledige gegevens te bevatten over de aan boord geleverde produkten, alsmede gegevens omtrent de
      leveringsdatum, de naam en de vlag van het schip of het registratienummer van het luchtvaartuig;
        - een kopie van het vervoerdocument;
        - het document waaruit blijkt dat de voor proviandering bestemde produkten zijn betaald. Indien er bij het
      produktschap gerede twijfel bestaat ten aanzien van de aard van de leverantie, dient de exporteur ter verkrijging
      van de restitutie ten genoege van het produktschap bovendien aan te tonen dat de voor proviandering geleverde
      hoeveelheden overeenstemmen met de normale behoeften van de bemanningsleden en de passagiers van het betrokken
      schip of luchtvaartuig.


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel39
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel101
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '39'
        hoofdstuk: III
        paragraaf: '1'
  - number: 101a.1
    text: |-
      Indien goederen bestemd voor levering voor proviandering, als bedoeld in [artikel 97, eerste lid][ref1], uit het
      bevoorradingsdepot worden uitgeslagen met het doel daaraan de voorgeschreven bestemming te geven dan wel deze op
      de voet van het bepaalde in artikel 43, eerste lid, van [verordening 800/1999](31999R0800) over te brengen naar
      een ander erkend bevoorradingsdepot hier te lande dan wel in een andere Lid-Staat, dient daarvan aangifte te
      worden gedaan als bij uitslag uit douane-entrepot, met dien verstande dat bij het doen van die aangifte een extra-
      exemplaar 0/0 van het formulier Enig document met in vak 9 de vermelding ‘Exemplaar bestemd voor de A.I.D.’ dient
      te worden overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel97
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel101a
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '97'
        hoofdstuk: V
        paragraaf: '3'
  - number: 101a.2
    text: |-
      Van elke voorgenomen uitslag van de in het eerste lid bedoelde goederen uit een erkend bevoorradingsdepot, dat
      onderdeel uitmaakt van een douane-entrepot, dient voorafgaand aan de feitelijke uitslag met gebruikmaking van
      het extra-exemplaar 0/0, als bedoeld in het eerste lid, dan wel van andere door de belastingdienst voorgeschreven
      bescheiden mededeling te worden gedaan aan de met de verificatie belaste ambtenaar, die tijd en plaats kan bepalen
      wanneer deze goederen ter verificatie moeten worden aangeboden.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel101a
  - number: 101a.3
    text: |-
      De overbrenging van de in het eerste lid bedoelde goederen van het ene naar het andere erkende bevoorradingsdepot
      binnen een publiek douane-entrepot dient te geschieden met gebruikmaking van het extra-exemplaar 0/0, als bedoeld
      in het eerste lid, dan wel van andere door de belastingdienst voorgeschreven bescheiden.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel101a
  - number: 101a.4
    text: |-
      Op het extra-exemplaar 0/0, als bedoeld in het eerste lid, dient te allen tijde het depot van uitslag te zijn
      vermeld en, indien dit extra-exemplaar 0/0 wordt gebezigd bij depotverwisseling binnen Nederland, zowel het depot
      van uitslag als het depot van inslag, waarvoor de goederen zijn bestemd. In de genoemde aangifte worden geen andere
      dan bevoorradingsdepotgoederen opgenomen. De omschrijving van de goederen wordt op alle bescheiden, waarvan gebruik
      wordt gemaakt, zodanig gespecificeerd als nodig is voor de berekening van de restitutie.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel101a
  - number: 101a.5
    text: |-
      De belastingdienst zendt het extra-exemplaar 0/0, als bedoeld in het eerste lid, indien gebezigd voor levering voor
      proviandering of voor overbrenging naar een erkend bevoorradingsdepot in een andere Lid-Staat, na aftekening voor
      het bereiken van de bestemming respectievelijk de uitgang uit Nederland aan de depothouder.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel101a
  - number: 101a.6
    text: |-
      Het extra-exemplaar 0/0 dat heeft gediend voor overbrenging van de in het eerste lid bedoelde goederen van het ene
      bevoorradingsdepot naar het andere bevoorradingsdepot binnen Nederland tekent de belastingdienst voor inslag in
      het depot af, nadat de depothouder schriftelijk op het formulier heeft verklaard dat hij de aangeleverde goederen
      heeft ingeslagen, en zendt het vervolgens toe aan het gewestelijk kantoor van de Algemene Inspectiedienst in welks
      ressort de inslag heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel101a
  - number: 101b.1
    text: |-
      Degene die als exporteur met gebruikmaking van de procedure van [artikel 96][ref1] levert voor proviandering,
      degene die als exporteur levert voor proviandering van boor- en produktieplatforms onder de voorwaarden van
      [artikel 100][ref2], en degene die op de voet van het bepaalde in de [artikelen 97][ref3] en [99][ref4] als
      erkend depothouder goederen bestemd voor proviandering in opslag houdt, is verplicht als onderdeel van zijn
      bedrijfsadministratie een register bij te houden waarin hij van dag tot dag aantekening houdt van zijn leveranties
      en/of van de mutaties in zijn voorraden in het te zijner beschikking staande erkende bevoorradingsdepot.


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel96
      [ref2]: https://wetten.overheid.nl/BWBR0003381#Artikel100
      [ref3]: https://wetten.overheid.nl/BWBR0003381#Artikel97
      [ref4]: https://wetten.overheid.nl/BWBR0003381#Artikel99
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel101b
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '96'
        hoofdstuk: V
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0003381
        artikel: '100'
        hoofdstuk: V
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0003381
        artikel: '97'
        hoofdstuk: V
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0003381
        artikel: '99'
        hoofdstuk: V
        paragraaf: '3'
  - number: 101b.2
    text: |-
      Het in het eerste lid bedoelde register dient in ieder geval de gegevens te bevatten die, al naar gelang het geval,
      zijn voorgeschreven in de artikelen 37, 40 en 44 van [verordening 800/1999](31999R0800), benevens de gegevens ten
      aanzien waarvan de voorzitter van het Hoofdproduktschap voor Akkerbouwprodukten heeft bepaald dat ook deze dienen
      te worden vermeld.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel101b
  - number: 101b.3
    text: |-
      Het in het eerste lid bedoelde register dient door de exporteur of erkende depothouder gedurende tenminste
      drie jaren na afloop van het betreffende kalenderjaar in zijn administratie te worden bewaard tezamen met alle
      commerciële bescheiden, vervoersdocumenten, facturen, exemplaren van de gedane douane-aangiften en alle andere
      documenten die betrekking hebben op de door hem geleverde en/of in opslag gehouden goederen en kunnen dienen als
      bewijs van de juistheid van de in het register aangetekende gegevens en, indien van toepassing, van het bereiken
      van de voorgeschreven bestemming.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel101b
  - number: 101b.4
    text: |-
      De directeur van de Algemene Inspectiedienst is bevoegd voorschriften te geven omtrent de inrichting
      van het in het eerste lid bedoelde register alsmede van de bedrijfsadministratie, als bedoeld in
      [artikel 101c, zesde lid, onder a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel101c
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel101b
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: 101c
        hoofdstuk: V
        paragraaf: '3'
  - number: 101c.1.a
    text: |-
      De minister is belast met: - het verlenen en intrekken van de toestemming, als bedoeld in
      [artikel 96, tweede lid, onder a][ref1];
        - het verlenen en intrekken van erkenningen als depothouder, als bedoeld i artikel
        - tweede lid, onder c;
        - het verlenen en intrekken van erkenningen als exploitant, als bedoeld in [artikel 100, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel96
      [ref2]: https://wetten.overheid.nl/BWBR0003381#Artikel100
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel101c
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '96'
        hoofdstuk: V
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0003381
        artikel: '100'
        hoofdstuk: V
        paragraaf: '3'
  - number: 101c.1.b
    text: |-
      De minister kan, in aanvulling op de voorwaarden genoemd in de leden 4, 5 en 6, nadere voorwaarden te stellen aan
      de verlening van een toestemming dan wel een erkenning, als bedoeld in onderdeel a.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel101c
  - number: 101c.1.c
    text: |-
      De minister kan voorschriften geven omtrent de inrichting van de in
      [artikel 96, tweede lid, onderdelen c en d][ref1], bedoelde staten.


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel96
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel101c
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '96'
        hoofdstuk: V
        paragraaf: '3'
  - number: 101c.1.d
    text: |-
      De minister kan de bevoegdheden welke hem ingevolge de onderdelen a, b en c toekomen delegeren aan de voorzitter
      van het Hoofdproductschap Akkerbouw.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel101c
  - number: 101c.2
    text: |-
      De belastingdienst is belast met het verlenen en intrekken van erkenningen van bevoorradingsdepots, als bedoeld
      in [artikel 97, tweede lid, onder b][ref1]. Zij is bevoegd aan de verlening van een erkenning, in aanvulling op de
      voorwaarden genoemd in het zevende lid, nadere voorwaarden te stellen. Terzake van de verlening of intrekking van
      erkenningen pleegt zij overleg met de Algemene Inspectiedienst.


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel97
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel101c
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '97'
        hoofdstuk: V
        paragraaf: '3'
  - number: 101c.3.a
    text: |-
      a. De belastingdienst doet aan de voorzitter van het Hoofdproduktschap voor Akkerbouwprodukten en aan de Algemene
      Inspectiedienst mededeling van de voor bevoorradingsdepots verleende erkenningen, als bedoeld in het tweede lid, en
      de mutaties terzake.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel101c
  - number: 101c.3.b
    text: |-
      De voorzitter van het Hoofdproduktschap voor Akkerbouwprodukten doet aan de produktschappen, de belastingdienst
      en de Algemene Inspectiedienst mededeling van de verleende toestemmingen, als bedoeld in het eerste lid, onder a,
      eerste gedachtenstreepje en de mutaties terzake, alsmede voor de verleende erkenningen, als bedoeld in het eerste
      lid, onder a, tweede en derde gedachtenstreepje en de mutaties terzake.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel101c
  - number: 101c.4.a
    text: |-
      a. De toestemming, als bedoeld in [artikel 96, tweede lid, onder a][ref1], wordt slechts verleend aan een exporteur
      die: '- gespecialiseerd is in proviandering, als bedoeld in [artikel 96, eerste lid][ref2], en goederen levert'
      vallende onder de bevoegdheid van meer dan een produktschap;
        - een bedrijfsadministratie voert die voldoet aan de eisen die daaraan met het oog op de controle op het bereiken
      van de bestemming van de ten uitvoer aangegeven goederen moeten worden gesteld;
        - als onderdeel van de in het vorige gedachtenstreepje genoemde bedrijfsadministratie een controleregister
      bijhoudt, als bedoeld in artikel 37 van [verordening 800/1999](31999R0800);
        - voldoet aan de aanvullende voorwaarden welke in voorkomend geval door de voorzitter van het Hoofdproduktschap
      voor Akkerbouwprodukten zijn gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel96
      [ref2]: https://wetten.overheid.nl/BWBR0003381#Artikel96
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel101c
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '96'
        hoofdstuk: V
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0003381
        artikel: '96'
        hoofdstuk: V
        paragraaf: '3'
  - number: 101c.4.b
    text: |-
      Voorafgaande aan de verlening van de toestemming wordt door de Algemene Inspectiedienst een controle bij de
      exporteur uitgevoerd die er met name op is gericht om vast te stellen of de bedrijfsadministratie aan de onder
      a, tweede gedachtenstreepje, bedoelde eisen voldoet. Op basis van de terzake gedane constateringen adviseert de
      Algemene Inspectiedienst de voorzitter van het Hoofdproduktschap voor Akkerbouwprodukten over de verlening van
      de toestemming.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel101c
  - number: 101c.4.c
    text: |-
      De toestemming wordt ingetrokken indien de exporteur daarom verzoekt, dan wel indien de exporteur niet langer aan
      de onder a genoemde voorwaarden voldoet.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel101c
  - number: 101c.5.a
    text: |-
      De erkenning als depothouder, als bedoeld in [artikel 97, tweede lid, onder c][ref1], is met name afhankelijk
      van de erkenning van het bevoorradingsdepot, als bedoeld in het tweede lid, en de bevindingen van de Algemene
      Inspectiedienst naar aanleiding van het onderzoek naar de inrichting van de bedrijfsadministratie van de
      depothouder. Deze bedrijfsadministratie dient met name te voldoen aan de eisen welke daaraan dienen te worden
      gesteld in verband met de controle op het bereiken van de voorgeschreven bestemming van de in opslag genomen
      goederen. Ook overigens moet voldoende zijn gewaarborgd dat de depothouder de op hem rustende verplichtingen
      nakomt.


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel97
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel101c
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '97'
        hoofdstuk: V
        paragraaf: '3'
  - number: 101c.5.b
    text: |-
      De erkenning wordt ingetrokken indien de depothouder daarom verzoekt, dan wel indien de depothouder niet langer
      aan de onder a genoemde voorwaarden of aan de in voorkomend geval door de voorzitter van het Hoofdproduktschap voor
      Akkerbouwprodukten gestelde aanvullende voorwaarden voldoet. De voorzitter doet van de intrekking mededeling aan
      de belastingdienst.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel101c
  - number: 101c.6.a
    text: |-
      De erkenning als exploitant, als bedoeld in [artikel 100, tweede lid][ref1], is met name afhankelijk van
      de bevindingen van de Algemene Inspectiedienst naar aanleiding van het onderzoek naar de inrichting van de
      bedrijfsadministratie van de exploitant. Deze bedrijfsadministratie dient met name te voldoen aan de eisen
      welke dienen te worden gesteld in verband met de controle op het bereiken van de bestemming van levering voor
      proviandering van boor- en produktieplatforms en marine- en hulpschepen geleverde goederen.


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel100
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel101c
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '100'
        hoofdstuk: V
        paragraaf: '3'
  - number: 101c.6.b
    text: |-
      De erkenning wordt ingetrokken indien de exploitant daarom verzoekt, dan wel indien de exploitant niet langer aan
      de onder a genoemde voorwaarden of aan de in voorkomend geval door de voorzitter van het Hoofdproduktschap voor
      Akkerbouwprodukten gestelde aanvullende voorwaarden voldoet.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel101c
  - number: 101c.7.a
    text: |-
      a. De erkenning van een bevoorradingsdepot, als bedoeld in [artikel 97, tweede lid, onder b][ref1], is met name
      afhankelijk van het voldoen aan de eisen welke aan het depot dienen te worden gesteld in verband met de controle
      op het bereiken van de voorgeschreven bestemming van de in opslag genomen goederen. Deze eisen betreffen de
      ligging, de afscheiding van andere percelen of perceelgedeelten, de bouw en de inrichting van als depot te erkennen
      gebouw, of gedeelte van een gebouw, en overigens hetgeen terzake voorts in [verordening 800/1999](31999R0800) als
      voorwaarde wordt gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel97
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel101c
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '97'
        hoofdstuk: V
        paragraaf: '3'
  - number: 101c.7.b
    text: |-
      De erkenning wordt ingetrokken indien de depothouder daarom verzoekt, dan wel indien het bevoorradingsdepot
      niet langer aan de in onderdeel a genoemde voorwaarden of aan de door de belastingdienst gestelde aanvullende
      voorwaarden voldoet.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel101c
  - number: 101d.1
    text: |-
      De Algemene Inspectiedienst is belast met een periodieke nacontrole op de juistheid van de ingevolge
      [artikel 96, vierde lid][ref1], en [artikel 97, vierde lid][ref2], voor de levering voor proviandering, al dan
      niet bij wijze van voorschot, uitbetaalde restitutiebedragen dan wel afboekingen in het veredelingsverkeer,
      met de controle op de naleving van verplichtingen welke ingevolge het bepaalde in artikel 40 van [verordening
      800/1999](31999R0800) op de erkende depothouder rusten alsmede met de in artikel 44, vierde lid, van
      [verordening 800/1999](31999R0800) bedoelde controle. Deze controles geschieden door onderzoek, al naargelang
      het geval, bij de exporteurs, erkende depothouders en erkende exploitanten hier te lande, met name aan
      de hand van de bedrijfsadministratie van deze bedrijven en in voorkomend geval aan de hand van het in
      [artikel 100, vierde lid][ref3], bedoelde register.


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel96
      [ref2]: https://wetten.overheid.nl/BWBR0003381#Artikel97
      [ref3]: https://wetten.overheid.nl/BWBR0003381#Artikel100
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel101d
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '96'
        hoofdstuk: V
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0003381
        artikel: '97'
        hoofdstuk: V
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0003381
        artikel: '100'
        hoofdstuk: V
        paragraaf: '3'
  - number: 101d.2
    text: |-
      Van de bevindingen ter zake van de in het eerste lid bedoelde onderzoeken brengt de Algemene Inspectiedienst
      rapport uit aan de produktschappen.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel101d
  - number: 101d.3
    text: |-
      Indien een in het eerste lid bedoeld onderzoek van de Algemene Inspectiedienst danwel enig ander onderzoek van
      een met het toezicht op de naleving van de in deze beschikking gestelde regelen belaste dienst daartoe aanleiding
      geeft, herzien de betrokken produktschappen hun beslissing tot uitbetaling van de restitutie, al dan niet bij
      wijze van voorschot, of afschrijving in het veredelingsverkeer, dan wel gaan de betrokken produktschappen over tot
      toepassing van het bepaalde in artikel 42 van [verordening 800/1999](31999R0800).
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel101d
  - number: 101d.4
    text: |-
      Indien een herziening of toepassing van artikel 42 van [verordening 800/1999](31999R0800), als bedoeld in
      het vorige lid, bij meer dan één produktschap moet plaats vinden ten aanzien, van eenzelfde exporteur met
      betrekking tot eenzelfde periode, kunnen de betrokken produktschappen overeenkomen dat één van hen namens hen
      gezamenlijk tot terugvordering van ten onrechte uitbetaalde restitutiebedragen of tot invordering op voet van
      het bepaalde in genoemd [artikel 42][ref1] over gaat. Zulks kan ook worden overeengekomen voor de erkenning
      van gelijkwaardige bewijsstukken, als bedoeld in [artikel 49, derde lid][ref2], van genoemde verordening en als
      bedoeld in [artikel 101e, zesde lid][ref3], alsmede voor de toekenning van aanvullende termijnen, als bedoeld in
      [artikel 49, vierde lid][ref4] van genoemde verordening en als bedoeld in [artikel 101e, zevende lid][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0003381#Artikel49
      [ref3]: https://wetten.overheid.nl/BWBR0003381#Artikel101e
      [ref4]: https://wetten.overheid.nl/BWBR0003381#Artikel49
      [ref5]: https://wetten.overheid.nl/BWBR0003381#Artikel101e
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel101d
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '42'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0003381
        artikel: '49'
        hoofdstuk: III
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0003381
        artikel: 101e
        hoofdstuk: V
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0003381
        artikel: '49'
        hoofdstuk: III
        paragraaf: '4'
      - id: ref5
        bwb_id: BWBR0003381
        artikel: 101e
        hoofdstuk: V
        paragraaf: '3'
  - number: 101e.1
    text: |-
      De in [artikel 101d, eerste lid][ref1], bedoelde controle van erkende depothouders betreft in het
      bijzonder het bereiken van de voorgeschreven bestemming van levering voor proviandering, als bedoeld in
      [artikel 97, eerste lid][ref2], dan wel van inslag in een erkend bevoorradingsdepot hier te lande of in een andere
      Lid-Staat van uit het erkende bevoorradingsdepot uitgeslagen goederen.


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel101d
      [ref2]: https://wetten.overheid.nl/BWBR0003381#Artikel97
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel101e
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: 101d
        hoofdstuk: V
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0003381
        artikel: '97'
        hoofdstuk: V
        paragraaf: '3'
  - number: 101e.2
    text: |-
      In geval van rechtstreekse levering voor proviandering van zeeschepen buiten de Gemeenschap, als bedoeld in
      artikel 45, derde lid, van [verordening 800/1999](31999R0800), dienen zich in de administratie van de depothouder,
      als bedoeld in [artikel 101b][ref1], de in [artikel 101, derde lid][ref2], genoemde documenten te bevinden.
      Daarnaast kan de Algemene Inspectiedienst bewijzen terzake van de aard van de leverantie, als bedoeld in
      [artikel 101, derde lid][ref3], laatste alinea, eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel101b
      [ref2]: https://wetten.overheid.nl/BWBR0003381#Artikel101
      [ref3]: https://wetten.overheid.nl/BWBR0003381#Artikel101
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel101e
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: 101b
        hoofdstuk: V
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0003381
        artikel: '101'
        hoofdstuk: V
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0003381
        artikel: '101'
        hoofdstuk: V
        paragraaf: '3'
  - number: 101e.3
    text: |-
      In geval van levering voor proviandering van boor- en produktieplatforms en marine- en hulpschepen is
      [artikel 100][ref1] van overeenkomstige toepassing, met dien verstande dat, indien de depothouder geen overeenkomst
      houdende de in [artikel 100, derde en vierde lid][ref2], genoemde verplichtingen ter beschikking van de Algemene
      Inspectiedienst houdt of de in deze overeenkomst genoemde verplichtingen door de exploitant van het platform niet
      zijn nageleefd, voor de betrokken goederen wordt overgegaan tot toepassing van het bepaalde in artikel 42 van
      [verordening 800/1999](31999R0800).


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel100
      [ref2]: https://wetten.overheid.nl/BWBR0003381#Artikel100
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel101e
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '100'
        hoofdstuk: V
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0003381
        artikel: '100'
        hoofdstuk: V
        paragraaf: '3'
  - number: 101e.4
    text: |-
      Een door de produktschappen van de belastingdienst ontvangen controle-exemplaar T 5 dat betrekking heeft op
      leveringen vanuit een bevoorradingsdepot hier te lande voor een bestemming in een andere Lid-Staat, te weten een
      controle-exemplaar als bedoeld in [artikel 43][ref1], derde dan wel vierde lid, van genoemde verordening, als ook
      een controle-exemplaar T 5 dat betrekking heeft op leveringen vanuit een bevoorradingsdepot hier te lande voor
      rechtstreekse proviandering van zeeschepen buiten de Gemeenschap, als bedoeld in artikel 45, derde lid, onder a,
      van [verordening 800/1999](31999R0800), van genoemde verordening, via een andere Lid-Staat, te weten een controle-
      exemplaar als bedoeld in [artikel 6][ref2] van genoemde verordening, zenden zij onverwijld toe aan het gewestelijk
      kantoor van de Algemene Inspectiedienst binnen welk ressort de opslag heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0003381#Artikel6
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel101e
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '43'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0003381
        artikel: '6'
        hoofdstuk: I
  - number: 101e.5.a
    text: |-
      Het in het vierde lid bedoelde controle-exemplaar T 5, dient om in aanmerking te worden genomen, behoudens
      overmacht, binnen 12 maanden na uitslag uit het bevoorradingsdepot van de goederen waarop het bewijs betrekking
      heeft, in het bezit te zijn van het produktschap.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel101e
  - number: 101e.5.b
    text: |-
      De in het tweede lid bedoelde bewijsdocumenten, het levenrantiebewijs, als bedoeld in
      [artikel 100, vijfde lid][ref1], en alle andere vereiste bewijsstukken terzake van de voorgeschreven bestemming
      dienen zich, om in aanmerking te worden genomen, binnen 12 maanden na uitslag uit het bevoorradingsdepot
      van de goederen waarop het bewijs betrekking heeft in de administratie van de depothouder, als bedoeld in
      [artikel 101b][ref2], te bevinden.


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel100
      [ref2]: https://wetten.overheid.nl/BWBR0003381#Artikel101b
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel101e
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '100'
        hoofdstuk: V
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0003381
        artikel: 101b
        hoofdstuk: V
        paragraaf: '3'
  - number: 101e.6.a
    text: |-
      Wanneer het in het vierde lid bedoelde controle-exemplaar T 5 als gevolg van omstandigheden welke niet aan de
      depothouder zijn toe te rekenen, niet binnen een termijn van drie maanden na afgifte bij het produktschap is
      terugontvangen, kan de depothouder bij het produktschap een met redenen omkleed en van bewijsstukken vergezeld
      verzoek indienen, om een verklaring van het voor de controle op de betrokken bestemming bevoegde douanekantoor,
      waaruit blijkt dat aan de voorwaarden voor visering van het controle-exemplaar is voldaan, als gelijkwaardig
      bewijsstuk te erkennen. Betreft het een controle-exemplaar T 5 dat betrekking heeft op leveringen vanuit een
      bevoorradingsdepot hier te lande voor rechtstreekse proviandering van zeeschepen buiten de Gemeenschap via een
      andere Lid-Staat, dan kan in afwijking van het voorgaande slechts het vervoerdocument met het bewijs bedoeld in
      [artikel 101, derde lid, eerste gedachtenstreepje][ref1], als gelijkwaardig bewijsstuk worden erkend.


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel101
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel101e
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '101'
        hoofdstuk: V
        paragraaf: '3'
  - number: 101e.6.b
    text: |-
      Wanneer het in het [artikel 101, derde lid, eerste gedachtenstreepje][ref1] bedoelde bewijs niet kan worden
      overgelegd, kan de depothouder bij het bevoegde produktschap een met redenen omkleed verzoek indienen om het in
      [artikel 45, derde lid, onderdeel c][ref2], van genoemde verordening bedoelde bewijs, als gelijkwaardig bewijsstuk
      te erkennen.


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel101
      [ref2]: https://wetten.overheid.nl/BWBR0003381#Artikel45
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel101e
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '101'
        hoofdstuk: V
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0003381
        artikel: '45'
        hoofdstuk: III
        paragraaf: '2'
  - number: 101e.7
    text: |-
      Wanneer het in het vierde lid bedoelde controle-exemplaar T 5 dan wel het in het zesde lid, onder a, bedoelde
      gelijkwaardige bewijsstuk niet binnen de in het vijfde lid bedoelde termijn wordt overgelegd, kunnen de exporteur,
      wanneer hij zich de nodige moeite heeft gegeven om de documenten binnen die termijn te verkrijgen, door het
      bevoegde produktschap bijkomende termijnen worden toegekend. Het verzoek daartoe moet binnen de in het vijfde lid
      bedoelde termijn worden ingediend.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel101e
  - number: 101e.8
    text: |-
      Terzake van de erkenning van gelijkwaardige bewijsstukken, als bedoeld in het zesde lid en terzake van de
      toekenning van aanvullende termijnen, als bedoeld in het zevende lid, wordt het in het vierde lid bedoelde
      gewestelijke kantoor van de Algemene Inspectiedienst door het betrokken produktschap geïnformeerd.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel101e
  - number: '103.1'
    text: |-
      Naast het stellen van een zekerheid ter verzekering van de voldoening van een landbouwheffing bij uitvoer bij en
      ten genoegen van de inspecteur van de rijksbelastingdienst, bevoegd inzake de douane, kan die zekerheid bij en ten
      genoegen van het produktschap worden gesteld.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel103
  - number: '103.2'
    text: |-
      In afwijking van het eerste lid kan de zekerheid niet bij en ten genoegen van het produktschap worden gesteld in
      de gevallen:
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel103
  - number: 103.2.a
    text: |-
      dat de goederen vallen onder [verordening (EG) nr. 2201/96](31996R2201) van de Raad van de Europese Unie van 28
      oktober 1996 houdende een gemeenschappelijke ordening der markten in de sector verwerkte produkten op basis van
      groenten en fruit (PbEG L 297) en
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel103
  - number: 103.2.b
    text: |-
      dat de inspecteur van de rijksbelastingdienst, bevoegd inzake de douane, de voorwaardelijke vrijstelling van de
      landbouwheffing bij uitvoer toekent;
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel103
  - number: '103.3'
    text: |-
      In afwijking van het eerste lid kan de zekerheid uitsluitend bij en ten genoegen van het produktschap worden
      gesteld in de gevallen:
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel103
  - number: 103.3.a
    text: |-
      dat op goederen [artikel 20, eerste lid][ref1], betrekking heeft;


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel20
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel103
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '20'
        hoofdstuk: II
        paragraaf: '2'
  - number: 103.3.b
    text: |-
      dat het durumtarwe met GN-code 1001 1000, zachte tarwe en spelt met GN-code 1001 9099, meel van zachte tarwe en
      spelt met GN-code 1101 0015, meel van mengkoren met de GN-code 1101 0090 en gries en griesmeel van zachte tarwe en
      spelt met GN-code 1103 1190 betreft en
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel103
  - number: 103.3.c
    text: dat het produktschap de voorwaardelijke vrijstelling van de landbouwheffing bij uitvoer toekent.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel103
  - number: '104'
    text: |-
      Naast de vormen van zekerheid die zijn toegestaan in artikel 193 van het Communautair douanewetboek kunnen als
      vormen van zekerheid worden aanvaard: - storting van geld, niet zijnde Nederlands geld, of deponering van de door
      de ontvanger als betaalmiddel erkende cheques of andere waardepapieren, welke niet luiden in Nederlandse valuta;
        - hypotheek en
        - verpanding van goederen, waardepapieren of vorderingen.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel104
  - number: '105'
    text: |-
      Van het stellen van de zekerheid, bedoeld in [artikel 103][ref1], bij het produktschap wordt door de aangever aan
      de inspecteur van de rijksbelastingdienst, bevoegd inzake de douane, mededeling gedaan door overlegging van een op
      beide exemplaren van het formulier L, bedoeld in [artikel 39][ref2] van de Douaneregeling dan wel op het formulier
      zekerheidstelling, gestelde verklaring van het produktschap houdende vermelding van de hoeveelheid en de soort van
      het goed waarop de zekerheid betrekking heeft en zo nodig de tijdsduur waarvoor zij geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel103
      [ref2]: https://wetten.overheid.nl/BWBR0003381#Artikel39
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel105
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '103'
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0003381
        artikel: '39'
        hoofdstuk: III
        paragraaf: '1'
  - number: '106.1'
    text: |-
      De mededeling, bedoeld in artikel 221, eerste lid, van het Communautair douanewetboek, van het bedrag aan
      landbouwheffingen bij uitvoer dat voortvloeit uit een douaneschuld geschiedt door het vaststellen van een
      uitnodiging tot betaling door het produktschap voor ieder van de heffingen afzonderlijk, indien ter verzekering van
      de voldoening van een dergelijke heffing de zekerheid bij het produktschap is gesteld.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel106
  - number: '106.2'
    text: |-
      In afwijking van het eerste lid geschiedt de mededeling door de inspecteur van de rijksbelastingdienst, bevoegd
      inzake de douane, in alle gevallen waarin:
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel106
  - number: 106.2.a
    text: de aangever tot onmiddellijke betaling van de douaneschuld wenst over te gaan;
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel106
  - number: 106.2.b
    text: |-
      blijkens de aan de inspecteur van de rijksbelastingdienst, bevoegd inzake de douane, verstrekte mededelingen,
      bedoeld in [artikel 105][ref1], en met inachtneming van de aangifte ten uitvoer en van hetgeen bij verificatie
      is bevonden, aangenomen moet worden dat bij het produktschap geen of onvoldoende zekerheid is gesteld voor de
      voldoening van de verschuldigde landbouwheffing bij uitvoer;


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel105
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel106
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '105'
        hoofdstuk: VI
  - number: 106.2.c
    text: |-
      een douaneschuld is ontstaan, bedoeld in de artikelen 210, eerste lid en 211, eerste lid, van het Communautair
      douanewetboek en
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel106
  - number: 106.2.d
    text: met betrekking tot enig in dit lid bedoeld geval tot boeking achteraf wordt overgegaan.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel106
  - number: '107'
    text: |-
      De beschikking tot terugbetaling of kwijtschelding van landbouwheffingen bij uitvoer, bedoeld in artikel 886 van de
      toepassingsverordening Communautair douanewetboek, wordt door het produktschap gegeven voor ieder van de heffingen
      afzonderlijk in de gevallen, waarbij het produktschap de mededeling, bedoeld in artikel 221, eerste lid, van het
      Communautair douanewetboek, doet.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel107
  - number: '108'
    text: |-
      Het produktschap is belast met de invordering van de landbouwheffingen bij uitvoer in de gevallen, waarbij het
      produktschap de mededeling, bedoeld in artikel 221, eerste lid, van het Communautair douanewetboek, doet.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel108
  - number: '109.1'
    text: |-
      Het bepaalde in [artikel 104][ref1] is niet van toepassing op leveranties van goederen voor de bevoorrading
      binnen de Gemeenschap van een zeeschip of luchtvaartuig, in gebruik voor het verkeer op een internationale lijn,
      op situaties vermeld in [Verordening (EEG) nr. 120/89](31989R0120) (Pb. EG nr. L 16) voor zover daarbij aan de
      overige vereisten van [Verordening (EEG) nr. 120/89](31989R0120) is voldaan, alsmede voor de bevoorrading van
      marine- en hulpschepen onderscheidenlijk boor- of produktieplatforms voor zover de aard en de hoeveelheden van
      deze leveranties naar het oordeel van de ambtenaar der invoerrechten en accijnzen in overeenstemming zijn met het
      normaal gebruik en mits daarenboven:


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel104
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel109
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '104'
        hoofdstuk: VI
  - number: 109.1.a
    text: |-
      is voldaan aan hetgeen ten aanzien van deze leveranties in de [artikelen 94][ref1] tot en met [98][ref2], alsmede
      [artikel 100, eerste lid][ref3], is bepaald met het oog op het verkrijgen van restitutie of van afboeking in
      veredelingsverkeer, en


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel94
      [ref2]: https://wetten.overheid.nl/BWBR0003381#Artikel98
      [ref3]: https://wetten.overheid.nl/BWBR0003381#Artikel100
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel109
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '94'
        hoofdstuk: V
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0003381
        artikel: '98'
        hoofdstuk: V
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0003381
        artikel: '100'
        hoofdstuk: V
        paragraaf: '3'
  - number: 109.1.b
    text: |-
      de belanghebbende tegenover de met de inning van de heffing belaste instantie schriftelijk heeft verklaard, dat
      hij bij niet-naleving van het in dit lid bepaalde, zal zorg dragen voor stipte betaling van de alsdan verschuldigde
      heffing. Hetgeen in [artikel 99][ref1] en [artikel 100, tweede lid][ref2], alsmede in [artikel 4][ref3] is
      bepaald met het oog op het verkrijgen van restitutie of van afboeking in veredelingsverkeer is van overeenkomstige
      toepassing ten aanzien van het niet verschuldigd zijn van de heffing ter zake van de in de aanhef van dit lid
      bedoelde leveranties. Leveranties via een douane entrepot aan ambassades en consulaten hier te lande en voor de
      bevoorrading hier te lande van tot de Rijnvaart behorende schepen volgens de regelen bedoeld in [artikel 95][ref4],
      worden voor de toepassing van dit lid gelijkgesteld met de in de aanhef van dit lid omschreven leveranties.


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel99
      [ref2]: https://wetten.overheid.nl/BWBR0003381#Artikel100
      [ref3]: https://wetten.overheid.nl/BWBR0003381#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0003381#Artikel95
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel109
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '99'
        hoofdstuk: V
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0003381
        artikel: '100'
        hoofdstuk: V
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0003381
        artikel: '4'
        hoofdstuk: I
      - id: ref4
        bwb_id: BWBR0003381
        artikel: '95'
        hoofdstuk: V
        paragraaf: '3'
  - number: '109.2'
    text: |-
      Op aanvrage wordt geheel of gedeeltelijk ontheffing verleend van de heffing in de gevallen of groepen van
      gevallen waarin en onder de voorwaarden en beperkingen volgens welke overeenkomstig het bepaalde bij of krachtens
      Communautair douanewetboek terugbetaling of kwijtschelding kan worden toegestaan.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel109
  - number: '112.1'
    text: |-
      In het geval waarin dit door een basisverordening of uitvoeringsbepaling wordt voorgeschreven, kan voor de goederen
      die vallen onder de basisverordeningen, aangewezen in kolom 1 van bijlage 1, ter zake van hun invoer een subsidie
      worden verleend.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel112
  - number: '112.2'
    text: De subsidie wordt verleend aan de importeur.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel112
  - number: '112.3'
    text: |-
      Als importeur wordt aangemerkt degene die de aangifte ten invoer heeft gedaan dan wel, indien de aangifte is gedaan
      in opdracht van een ander, degene die op het formulier L, bedoeld in [artikel 37][ref1] van de Douaneregeling als
      importeur is aangeduid.


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel37
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '37'
        hoofdstuk: III
        paragraaf: '1'
  - number: '112.4'
    text: |-
      De subsidie kan eerst worden toegekend nadat aan alle in de communautaire regelingen voor de toekenning gestelde
      voorwaarden is voldaan en de in de communautaire regeling voorgeschreven bescheiden zijn overgelegd. Het
      [tweede lid van artikel 81][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel81
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '81'
        hoofdstuk: V
        paragraaf: '1'
  - number: '114'
    text: |-
      Van douanegoederen, welke ten invoer zijn aangegeven, wordt de subsidie berekend overeenkomstig de gedane aangifte
      ten invoer, en met inachtneming van hetgeen bij de verificatie van die aangifte of van het daarop afgegeven
      document, bij een ingesteld nader onderzoek van zodanige aangifte, van zodanig document, dan wel ingevolge andere
      wettelijke bepalingen is bevonden of vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel114
  - number: '115.1'
    text: De toekenning alsmede de betaling van de subsidie vindt plaats door het produktschap.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel115
  - number: '115.2'
    text: De betaling van de subsidie geschiedt met inachtneming van het ter zake in de communautaire regelen bepaalde.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel115
  - number: '116.1'
    text: |-
      Indien ingevolge het bepaalde bij of krachtens [verordening (EG) nr. 1254/1999](31999R1254) van de Raad van de
      Europese Unie van 17 mei 1999 houdende een gemeenschappelijke ordening der markten in de sector rundvlees (PbEG
      L 160) het bedrag van de aldaar bedoelde heffing voor jonge mannelijke runderen met een levend gewicht van ten
      hoogste 300 kg en voor goederen, vallend onder de posten 0202 2030 of 0202 30, afhankelijk is van de vervulling
      of nakoming van voorwaarden of bepalingen die ten aanzien van het betreffende goed in genoemde verordening of haar
      uitvoeringsvoorschriften zijn voorgeschreven, is de importeur van dat goed gehouden tot het naleven van de door het
      produktschap met inachtneming van het bepaalde in die Verordening en haar uitvoeringsvoorschriften, ter verzekering
      van die heffing gestelde regelen.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel116
  - number: '116.2'
    text: |-
      De in het vorige lid bedoelde regelen kunnen betrekking hebben op het trekken van monsters, het voeren van een
      administratie en het verstrekken van gegevens, nodig voor de oplegging van de heffing.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel116
  - number: '116.3'
    text: |-
      Het produktschap stelt regelen volgens welke het vrijstelling verleent aan landbouwheffingen bij invoer, ten belope
      van het jaarlijks door de Raad toegekende en aan Nederland toevallende aandeel in het in het kader van het General
      Agreement on Tariffs and Trade (G.A.T.T.) geopende tariefcontingent voor de invoer uit landen of gebieden die geen
      deel uitmaken van de Gemeenschap van bevroren rundvlees van post 0202 van de gecombineerde nomenclatuur.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel116
  - number: 116a
    text: |-
      Het productschap kan regels stellen op grond waarvan het vrijstelling verleent van de landbouwheffingen bij invoer
      in het kader van:
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel116a
  - number: 116a.a
    text: |-
      [verordening (EG) nr. 1143/98](31998R1143) van de Commissie van de Europese Gemeenschappen van 2 juni 1998 tot
      vaststelling van de uitvoeringsbepalingen voor een tariefcontingent voor niet voor de slacht bestemde koeien en
      vaarzen van bepaalde bergrassen, van oorsprong uit bepaalde derde landen, en tot wijziging van [verordening (EG)
      nr. 1012/98](31998R1012) (PbEG L 159) en,
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel116a
  - number: 116a.b
    text: |-
      verordening (EG) nr. 1081 1999 van de Commissie van de Europese Gemeenschappen van 26 mei 1999 betreffende de
      opening en de wijze van beheer van communautaire tariefcontingenten voor stieren, koeien en vaarzen, niet bestemd
      voor de slacht, van bepaalde bergrassen, houdende intrekking van [verordening (EG) nr. 1012/98](31998R1012) en
      houdende wijziging van [verordening (EG) nr. 1143/98](31998R1143) (PbEG L 131).
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel116a
  - number: 116b.1
    text: |-
      De hoge restitutie voor de uitvoer van vrouwelijke raszuivere fokrunderen van GN code 0102 1000 wordt, onverminderd
      het bepaalde in Hoofdstuk V, slechts verleend indien:
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel116b
  - number: 116b.1.a
    text: |-
      de uitvoer van de runderen vergezeld gaat van een door of namens de exporteur volledig en naar waarheid ingevuld en
      ondertekend goed leesbaar formulier L, bedoeld in [artikel 39][ref1] van de Douaneregeling, dat bij de uitvoer moet
      worden overgelegd aan de ambtenaar der invoerrechten en accijnzen;


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel39
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel116b
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '39'
        hoofdstuk: III
        paragraaf: '1'
  - number: 116b.1.b
    text: |-
      de ouders en grootouders zijn ingeschreven of geregistreerd in het stamboek voor hetzelfde ras van een erkende
      stamboekvereniging en de runderen zelf in dat stamboek staan ingeschreven dan wel geregistreerd en geschikt zijn om
      erin te worden ingeschreven en niet ouder dan 5 jaar zijn;
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel116b
  - number: 116b.1.c
    text: |-
      bij de aangifte ten uitvoer voor ieder rund afzonderlijk een origineel alsmede een kopie-exemplaar aan de
      ambtenaar der invoerrechten en accijnzen wordt overgelegd van: - een door een erkende stamboekvereniging afgegeven
      stamboekcertificaat waaruit blijkt dat aan het in onderdeel b bepaalde is voldaan en waarop in elk geval met
      betrekking tot het rund, de ouders en grootouders de resultaten van het prestatie-onderzoek alsmede, onder opgave
      van de oorsprong, de resultaten van de beoordeling van de genetische waarde staan vermeld;
        - een op grond van [artikel 77 van de Gezondheids- en welzijnswet voor dieren][ref1] afgegeven
      gezondheidscertificaat voor fok- en gebruiksdieren.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel77
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel116b
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '77'
  - number: 116b.2
    text: |-
      In afwijking van het in het eerste lid, onderdeel c bepaalde, mogen de resultaten van de beoordeling van de
      genetische waarde alsmede de resultaten van het prestatie-onderzoek op een door de in het eerste lid, onderdeel b,
      bedoelde stamboekvereniging afgegeven stamboomdocument worden vermeld.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel116b
  - number: 116b.3
    text: |-
      De Belastingdienst zendt de kopie-exemplaren van de in het eerste lid, onderdeel c, vermelde certificaten
      gewaarmerkt en gehecht aan het formulier L, bedoeld in [artikel 39][ref1] van de Douaneregeling toe aan het
      produktschap.


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel39
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel116b
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '39'
        hoofdstuk: III
        paragraaf: '1'
  - number: 117a.1
    text: |-
      Degene die aanspraak maakt op een restitutie als bedoeld in [verordening (EG) nr. 1222/94](31994R1222)
      van de Commissie van de Europese Gemeenschappen van 30 mei 1994 tot vaststelling van de gemeenschappelijke
      uitvoeringsbepalingen voor de regeling aangaande de toekenning van restituties bij uitvoer en de criteria voor de
      vaststelling van het restitutiebedrag betreffende bepaalde landbouwprodukten, uitgevoerd in de vorm van goederen
      die niet onder [bijlage II][ref1] van het Verdrag vallen (PbEG L 136), stelt in het geval waarin artikel 20
      van deze regeling buiten toepassing is gelaten, de productie van de uit te voeren goederen onder toezicht, ter
      vaststelling van de verwerkte hoeveelheden van de basisproducten.


      [ref1]: https://wetten.overheid.nl/BWBR0003381
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel117a
    references:
      - id: ref1
        bwb_id: BWBR0003381
  - number: 117a.2
    text: |-
      Het verzoek tot de onder toezichtstelling als bedoeld in het eerste lid, dient schriftelijk te worden ingediend bij
      het produktschap. Ter zake van de te verlenen toestemming is [artikel 20, tweede tot en met zesde lid][ref1], van
      overeenkomstige toepassing, met dien verstande dat in afwijking van het vierde lid, tot wederopzeggens voorlopige
      toestemming kan worden verleend. Op het formulier L, bedoeld in [artikel 39][ref2] van de Douaneregeling, worden de
      datum en nummer van de toestemming of voorlopige toestemming vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0003381#Artikel39
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel117a
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '20'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0003381
        artikel: '39'
        hoofdstuk: III
        paragraaf: '1'
  - number: 117b
    text: |-
      De importeurs en exporteurs van zaaizaad van elke soort en van elke rassengroep waarvoor steun is vastgesteld en
      van elke maïshybridensoort en sorghohybridensoort geven jaarlijks in het kalenderjaar volgend op het oogstjaar,
      als bedoeld in [verordening (EEG) nr. 3083/73](31973R3083) van de Commissie van de Europese Gemeenschappen van
      14 november 1973 betreffende het verstrekken van de nodige gegevens voor de toepassing van [verordening (EEG) nr.
      2358/71](31971R2358) houdende een gemeenschappelijke ordening der markten in de sector zaaizaad (PbEG L 314), voor
      1 september de door hun ingevoerde hoeveelheden uit en uitgevoerde hoeveelheden naar de in voorgenoemde verordening
      bedoelde derde landen door aan het produktschap.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel117b
  - number: 117d
    text: |-
      Als plaatsen van uitgang als bedoeld in artikel 2, eerste lid, tweede gedachtenstreepje, van [Verordening 615/98/
      EG](31998R0615) worden aangewezen de [Bijlage X][ref1], [onderdeel B][ref2], genoemde plaatsen.


      [ref1]: https://wetten.overheid.nl/BWBR0003381
      [ref2]: https://wetten.overheid.nl/BWBR0003381
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel117d
    references:
      - id: ref1
        bwb_id: BWBR0003381
      - id: ref2
        bwb_id: BWBR0003381
  - number: 117e.1
    text: |-
      De controles als bedoeld in artikel 2 van [Verordening 615/98/EG](31998R0615) worden uitgevoerd door vervangen
      door: de keuringsdierenarts van de Voedsel en Waren Autoriteit.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel117e
  - number: 117e.2
    text: |-
      Certificaten en verklaringen als bedoeld in artikel 2 van [Verordening 615/98/EG](31998R0615) worden afgegeven door
      de Minister.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel117e
  - number: 117f
    text: |-
      Degene die voornemens is dieren voor een controle als bedoeld in artikel 2 van [verordening 615/98/EG](31998R0615)
      aan te bieden doet daarvan een voorafgaande melding overeenkomstig het bepaalde in [bijlage X][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003381
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel117f
    references:
      - id: ref1
        bwb_id: BWBR0003381
  - number: '118.1'
    text: |-
      De bevoegdheden, die in de vorige artikelen, met uitzondering van [artikel 38][ref1], aan de produktschappen
      zijn toegekend, alsmede de bevoegdheid tot het verlenen van vrijstelling van de heffing ter uitvoering van
      de [Regeling passief veredelingsverkeer landbouwgoederen][ref2] (Stcrt. 1991, 81), onderscheidenlijk de
      Beschikking actief veredelingsverkeer landbouwgoederen 1986, zoals in die beschikking voorzien, zijn krachtens
      artikel 11, van de wet, en voor wat betreft de bevoegdheid in [artikel 85][ref3] in voorkomend geval krachtens
      [artikel 23 van de Landbouwwet][ref4], overgedragen aan het bestuur van het in kolom 2 van [bijlage I][ref5] als
      bevoegde instantie aangemerkte produktschap.


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0005060
      [ref3]: https://wetten.overheid.nl/BWBR0003381#Artikel85
      [ref4]: https://wetten.overheid.nl/BWBR0002252#Artikel23
      [ref5]: https://wetten.overheid.nl/BWBR0003381
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel118
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '38'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005060
      - id: ref3
        bwb_id: BWBR0003381
        artikel: '85'
        hoofdstuk: V
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0002252
        artikel: '23'
      - id: ref5
        bwb_id: BWBR0003381
  - number: '118.2'
    text: |-
      Onder de bevoegdheid tot het verlenen van restituties ingevolge [artikel 85][ref1], is begrepen de bevoegdheid een
      restitutie op de voet van het bepaalde in artikel 9 van de wet in te trekken en deze op de voet van het bepaalde in
      Hoofdstuk V, paragraaf 2, te verlenen bij wijze van vooruitbetaling.


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel85
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel118
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '85'
        hoofdstuk: V
        paragraaf: '1'
  - number: '119'
    text: |-
      De in [artikel 38][ref1] aan de produktschappen toegekende bevoegdheden zijn krachtens artikel 11 van de wet
      overgedragen aan het bestuur van het in kolom 1, van [bijlage II][ref2], als bevoegde instantie aangemerkte
      produktschap.


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0003381
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel119
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '38'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0003381
  - number: '120.1'
    text: |-
      Het bestuur van het productschap is gehouden bij het uitoefenen van de toegekende bevoegdheid ten aanzien van de
      goederen welke behoren tot het werkterrein van een ander produktschap de dienaangaande door het bestuur van dat
      produktschap genomen besluiten in acht te nemen. Indien het in de vorige alinea bedoelde geval zich voordoet in
      dier voege, dat het bestuur zijn bevoegdheid uitoefent ten aanzien van een goed dat behoort tot het werkterrein
      van een niet in kolom 2 van bijlage I vermeld produktschap, neemt het daarbij de besluiten van het bestuur van dat
      produktschap in acht.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel120
  - number: '120.2'
    text: |-
      De bij die uitoefening krachtens een verordening, als bedoeld in artikel 11, tweede lid, van de wet, of artikel 23,
      tweede lid, van de Landbouwwet vast te stellen nadere regelen en daarbij te nemen besluiten van algemene gelding
      behoeven de goedkeuring van de Minister van Landbouw, Natuurbeheer en Visserij.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel120
  - number: '121'
    text: |-
      Indien door een productschap op grond van het bepaalde in de [artikelen 35][ref1] en [38][ref2] een
      invoervergunning wordt verleend als bedoeld in [artikel 2 van het Invoerbesluit landen 1981][ref3], wordt het model
      van bijlage IIIC gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0003381#Artikel38
      [ref3]: https://wetten.overheid.nl/BWBR0003448#Artikel2
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel121
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '35'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0003381
        artikel: '38'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0003448
        artikel: '2'
  - number: '122'
    text: |-
      Het uitoefenen van de bevoegdheden waartoe de Belastingdienst in deze beschikking bevoegd wordt verklaard en het
      verrichten van de handelingen die de rijksbelastingdienst voor de toepassing van deze beschikking moet verrichten,
      zijn aan deze dienst opgedragen op de voet van het bepaalde in de artikelen 5, vierde lid, 6, vierde lid, 8, derde
      lid en 13, tweede lid, van het besluit.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel122
  - number: '123'
    text: |-
      Met inachtneming van het bepaalde in het eerste lid van het volgende artikel, worden de volgende beschikkingen
      ingetrokken: '- de Overdrachtsbeschikking [In- en uitvoerwet][ref1] 1968;'
        - de Heffingsbeschikking invoer agrarische alcohol 1976;
        - de Beschikking landbouw-uitvoerheffingen 1979;
        - de Uitvoeringsbeschikking landbouwheffingen- en -restitutieregime 1968;
        - de Beschikking Landbouwheffingen- en -restitutieregime 1968–II;
        - de Modellenbeschikking in- en uitvoerdocumenten 1968;
        - de Modellenbeschikking in- en uitvoerdocumenten landbouwgoederen 1963 I;
        - de Vrijstellingsbeschikking landbouwgoederen 1963–I;
        - de Vrijstellingsbeschikking landbouwgoederen E.E.G. 1968 I;
        - de Vrijstellingsbeschikking landbouwgoederen BENELUX 1970;
        - de Vrijstellingsbeschikking scheepsleveranciers-entrepot landbouwgoederen 1963–I;
        - de Restitutiebeschikking fokvee 1975;
        - de Vrijstellingsbeschikking landbouwgoederen 1977 (landen).


      [ref1]: https://wetten.overheid.nl/BWBR0002376
