---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.5.2/schema.json
$id: regeling_in_en_uitvoer_landbouwgoederen
regulatory_layer: WET
publication_date: '2008-07-30'
valid_from: '2003-01-01'
bwb_id: BWBR0003381
url: https://wetten.overheid.nl/BWBR0003381/2003-01-01
preamble:
  text: |-
    Overwegende, dat, onder intrekking van het In- en uitvoerbesluit landbouwgoederen 1963, een nieuw besluit
    houdende regelen ten aanzien van de in- en uitvoer van bepaalde landbouwgoederen tot stand is gebracht (In- en
    uitvoerbesluit landbouwgoederen 1980 (Stb. 758);

    Overwegende, dat derhalve de op het besluit gebaseerde bestaande uitvoeringsvoorschriften ter zake van die in- en
    uitvoer opnieuw dienen te worden vastgesteld en in bepaalde opzichten te worden herzien;

    Gelet op artikel 2 tot en met 11, 13, 17 en 19 van het In- en uitvoerbesluit landbouwgoederen 1980, alsmede op de
    artikelen 2, 4 en 5 van de Invoerbeschikking landen 1981 onderscheidenlijk het Invoerbesluit landen 1981;

    Mede gelet op artikel 11 van de In- en uitvoerwet en op de artikelen 15 en 23 van de Landbouwwet;

    In overeenstemming met de Staatssecretaris van Financiën,

    Besluit:
  url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Voor de toepassing van het bij of krachtens deze regeling bepaalde wordt voor zover van toepassing overgenomen de
      terminologie van de [Douanewet][ref1] en wordt voorts verstaan onder:

            a
            productschap:

              het productschap of hoofdproductschap dat in kolom 2 van [bijlage I][ref2] en in kolom 2 van
      [bijlage II][ref3] ten aanzien van het in kolom 1 vermelde goed of ten aanzien van de desbetreffende handeling met
      betrekking tot dat goed als bevoegde instantie is aangemerkt;



            b
            lidstaten:

              lidstaten van de Gemeenschap;



            c
            Algemene Inspectiedienst:

              Algemene Inspectiedienst van het ministerie van Landbouw, Natuurbeheer en Visserij;



            d
            basisverordeningen:

              de verordeningen opgenomen in [bijlage I][ref4], eerste kolom;



            e
            uitvoeringsbepalingen:

              de door de Raad van de Europese Unie of de Commissie van de Europese Gemeenschappen voor de toepassing
      van de basisverordeningen vastgestelde in het Publicatieblad van de Gemeenschap bekendgemaakte verordeningen of
      besluiten;



            f

              [verordening 800/1999](31999R0800)


              : [verordening (EG) nr. 800/1999](31999R0800) van de Commissie van de Europese Gemeenschappen van 15
      april 1999 houdende gemeenschappelijke uitvoeringsbepalingen van het stelsel van restituties bij uitvoer voor
      landbouwproducten (PbEG L 102);



            g
            producten, basisproducten, verwerkte producten, goederen, rechten bij invoer, lidstaat van uitvoer,
      vaststelling vooraf van de restitutie, gedifferentieerde restitutie, gedifferentieerd gedeelte van de restitutie,
      uitvoer, controle-exemplaar T5, exporteur, voorschot op de restitutie, voorfinanciering van de restitutie, in het
      kader van een inschrijving vastgestelde restitutie, restitutienomenclatuur, uitvoercertificaat:

              hetgeen voor de toepassing van [verordening 800/1999](31999R0800) daaronder wordt verstaan;



            h

              [Verordening 615/98/EG](31998R0615):

              [verordening (EG) nr. 615/98](31998R0615) van de Commissie van de Europese Gemeenschappen van 18 maart 1998
      houdende bijzondere uitvoeringsbepalingen voor het stelsel van uitvoerrestituties met betrekking tot het welzijn
      van levende runderen tijdens het vervoer ervan (PbEG L 82).


      [ref1]: https://wetten.overheid.nl/BWBR0007632
      [ref2]: https://wetten.overheid.nl/BWBR0003381
      [ref3]: https://wetten.overheid.nl/BWBR0003381
      [ref4]: https://wetten.overheid.nl/BWBR0003381
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007632
      - id: ref2
        bwb_id: BWBR0003381
      - id: ref3
        bwb_id: BWBR0003381
      - id: ref4
        bwb_id: BWBR0003381
  - number: '2.1'
    text: |-
      Tenzij uit deze regeling het tegendeel blijkt is het bepaalde bij of krachtens de [Douanewet][ref1] inzake de
      grondige opneming van goederen, de verificatie van aangiften en documenten, de monsterneming, de verzegeling
      of bewaking van goederen, de door belanghebbende te verlenen medewerking, de overige verplichtingen van de
      belanghebbende en de bevoegdheden van de Belastingdienst, van overeenkomstige toepassing ter verzekering en
      regeling van de volgens deze regeling toe te passen maatregelen.


      [ref1]: https://wetten.overheid.nl/BWBR0007632
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0007632
  - number: '2.2'
    text: |-
      De uitoefening van de in het vorige lid bedoelde bevoegdheden en het verrichten van de aldaar bedoelde handelingen
      geschieden door de directeur, inspecteur, ontvanger of andere ambtenaar die inzake invoerrechten en accijnzen in
      overeenkomstige gevallen optreedt.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel2
  - number: '3'
    text: |-
      De Belastingdienst is belast met de verificatie van de in deze regeling voorgeschreven aangiften, documenten, bij
      die aangiften overgelegde formulieren en overige bescheiden, het nader onderzoek ter zake, de grondige opneming van
      de goederen en schatting van gegevens, tenzij ter zake anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel3
  - number: '4.1'
    text: |-
      Tot het verrichten van een nader onderzoek, als bedoeld in de [artikelen 82][ref1] en [90][ref2], is mede bevoegd
      de Algemene Inspectiedienst.


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel82
      [ref2]: https://wetten.overheid.nl/BWBR0003381#Artikel90
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '82'
        hoofdstuk: V
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0003381
        artikel: '90'
        hoofdstuk: V
        paragraaf: '2'
  - number: '4.2'
    text: De Algemene Inspectiedienst stelt het nader onderzoek in op verzoek van de Belastingdienst.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel4
  - number: '6'
    text: |-
      Uitvoer van goederen waarvoor aanspraak wordt gemaakt op restitutie of waarvoor ontheffing van de invoerheffing is
      verleend of aangevraagd, wordt voor de toepassing van de [Douanewet][ref1] aangemerkt als uitvoer van goederen met
      teruggaaf van belasting.


      [ref1]: https://wetten.overheid.nl/BWBR0007632
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0007632
  - number: '7.1'
    text: |-
      Voor de toepassing van de regelen gesteld bij of krachtens het besluit onderscheidenlijk het
      [Invoerbesluit landen 1981][ref1] wordt als dag waarop de invoer plaatsvindt aangemerkt:


      [ref1]: https://wetten.overheid.nl/BWBR0003448
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0003448
  - number: 7.1.a
    text: |-
      voor douanegoederen welke ten invoer worden aangegeven: - de dag waarop volgens de ter zake geldende voorschriften
      de aangifte door de Belastingdienst is aanvaard;
        - met betrekking tot goederen, welke ten invoer zijn aangegeven op de voet van een krachtens de Douaneregeling
      verleende vergunning, wordt het voldoen aan de bij of krachtens die regeling gestelde voorwaarden en bepalingen, zo
      nodig, steeds toegerekend aan de eerst ingevoerde, daarvoor in aanmerking komende goederen;
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel7
  - number: 7.1.b
    text: |-
      voor goederen, andere dan die onder a bedoeld, waarvoor te zuiveren documenten zijn afgegeven die niet of
      gedeeltelijk worden gezuiverd: de dag waarop zich een omstandigheid voordoet welke de niet-zuivering of de
      gedeeltelijke zuivering van het document tot gevolg heeft; indien deze dag niet kan worden vastgesteld wordt als de
      dag waarop de invoer plaatsvindt aangemerkt de laatste dag van de geldigheidsduur van het document, of, indien dit
      eerder is, het vroegste tijdstip waarvan wordt vastgesteld dat de bedoelde omstandigheid zich had voorgedaan;
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel7
  - number: 7.1.c
    text: |-
      voor goederen, andere dan die onder b bedoeld, waarvoor vrijstelling van de heffing is verleend en ten aanzien
      waarvan hetzij van de vrijstelling is afgezien, hetzij deze wegens misbruik of niet nakoming van de gestelde
      voorwaarden is vervallen: de in de [Vrijstellingsbeschikking klein grensverkeer landbouwgoederen 1981][ref1],
      de [Regeling passief veredelingsverkeer landbouwgoederen][ref2] (Stcrt. 1991, 81), danwel de Beschikking actief
      veredelingsverkeer landbouwgoederen 1986 (Stcrt. 252) daartoe aangewezen dag.


      [ref1]: https://wetten.overheid.nl/BWBR0005060
      [ref2]: https://wetten.overheid.nl/BWBR0005060
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005060
      - id: ref2
        bwb_id: BWBR0005060
  - number: 7.1.d
    text: |-
      voor goederen waarvan in een douane-entrepot waarin ingevolge het bepaalde bij of krachtens de [Douanewet][ref1]
      voorraadscontrole wordt uitgeoefend, vermis wordt vastgesteld: de dag waarop het vermis is ontstaan; indien deze
      dag met kan worden vastgesteld wordt als de dag waarop de invoer plaatsvindt aangemerkt de dag van bevinding van
      het vermis, of indien dit eerder is, het vroegste tijdstip waarvan wordt vastgesteld dat het vermis reeds bestond;


      [ref1]: https://wetten.overheid.nl/BWBR0007632
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0007632
  - number: 7.1.e
    text: |-
      voor goederen die op onregelmatige wijze het Rijk zijn binnengebracht of uit douane-entrepot zijn uitgeslagen: de
      aan de hand van de bekende gegevens zonodig door schatting te bepalen dag waarop de goederen zijn binnengebracht of
      uit het entrepot zijn uitgeslagen.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel7
  - number: '7.2'
    text: |-
      De volgens het eerste lid aangemerkte dag waarop de invoer plaatsvindt, wordt op het formulier L aangegeven in vak
      A en voorzien van een handtekening van de ambtenaar der invoerrechten en accijnzen.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel7
  - number: '9.1'
    text: |-
      In geval voor de toepassing van deze regeling bewezen dient te worden dat goederen, of bestanddelen daarvan
      herkomstig zijn uit het vrije verkeer van de Gemeenschap dient de herkomst te worden aangetoond met inachtneming
      van de bij of krachtens het Communautair douanewetboek gestelde regelen.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel9
  - number: '9.2'
    text: |-
      In geval voor de toepassing van deze regeling bewezen dient te worden dat goederen van oorsprong of herkomst zijn
      uit een bepaald land of gebied dat geen deel uitmaakt van de Gemeenschap, dient deze oorsprong of herkomst te
      worden aangetoond met inachtneming van de regelen die daartoe door de Raad of de Commissie of in internationale
      overeenkomsten met of met betrekking tot die landen of gebieden zijn gesteld.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel9
  - number: '9.3'
    text: |-
      De exporteur geeft op het formulier L de verklaringen, bedoeld in artikel 11, van [verordening 800/1999]
      (31999R0800) aan.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel9
  - number: '11'
    text: |-
      De in deze regeling voor de toepassing van het [Invoerbesluit landen 1981][ref1] gestelde regelen hebben slechts
      betrekking op de goederen aangewezen in de bij het besluit behorende bijlage.


      [ref1]: https://wetten.overheid.nl/BWBR0003448
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0003448
  - number: '12'
    text: |-
      [Bijlage I][ref1] en [bijlage II][ref2] kunnen bij regeling van de Minister buiten overeenstemming met de Minister
      van Financiën worden gewijzigd.


      [ref1]: https://wetten.overheid.nl/BWBR0003381
      [ref2]: https://wetten.overheid.nl/BWBR0003381
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0003381
      - id: ref2
        bwb_id: BWBR0003381
  - number: '13.1'
    text: |-
      Als model van de invoervergunning, als bedoeld in artikel 2 van het besluit, wordt vastgesteld het model vervat
      in [bijlage III A][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003381
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003381
  - number: '13.2'
    text: |-
      Als model van de uitvoervergunning, als bedoeld in artikel 3 van het besluit, vastgesteld het model vervat in
      [bijlage III B][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003381
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003381
  - number: '13.3'
    text: |-
      Als model van de invoervergunning, als bedoeld in [artikel 2][ref1] van de Invoerbeschikking landen
      1981 onderscheidenlijk het [Invoerbesluit landen 1981][ref2], wordt vastgesteld het model vervat in
      [bijlage III C][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003448
      [ref3]: https://wetten.overheid.nl/BWBR0003381
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '2'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0003448
      - id: ref3
        bwb_id: BWBR0003381
  - number: '15'
    text: |-
      Artikel 20, eerste lid, van [verordening 800/1999](31999R0800), wordt niet toegepast in het in het eerste lid,
      onder b, van het in dat artikel genoemde geval, indien het restitutiebedrag voor de betrokken aangifte niet hoger
      is dan 500 EURO.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel15
  - number: '18'
    text: |-
      Als de procedure van de depotregeling, bedoeld in [artikel 45][ref1], wordt gevolgd, behoeft het
      voorfixatiecertificaat niet te worden overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel45
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '45'
        hoofdstuk: III
        paragraaf: '2'
  - number: '20.1'
    text: |-
      Bij de aangifte ten uitvoer en de aangifte tot plaatsing onder het stelsel van douane-entrepots voor goederen met
      voorfinanciering, als bedoeld in artikel 530, eerste lid, van de Toepassingsverordening communautair douanewetboek,
      kan de vermelding van gehalte, samenstelling of hoedanigheid van de uit te voeren goederen achterwege blijven,
      indien het produktschap daartoe schriftelijk toestemming heeft verleend aan de exporteur, die de aangifte indient
      of doet indienen.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel20
  - number: '20.2'
    text: |-
      In de te verlenen toestemming wordt de soort goederen, waarvoor zij geldt, nauwkeurig omschreven en voorts worden
      aan de toestemming alle voorwaarden verbonden, die nodig zijn voor het verkrijgen langs andere weg van de voor de
      berekening van de restitutie of de bepaling van de aanspraak op vrijstelling van heffing bij veredelingsverkeer
      vereiste gegevens en voor het uitoefenen van controle op de juistheid daarvan.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel20
  - number: '20.3'
    text: |-
      Degene, die de goederen aangeeft als bedoeld in het eerste lid, vermeldt in de aangifte en in voorkomend geval
      op het formulier L, bedoeld in [artikel 39][ref1] van de Douaneregeling datum en nummer van toestemming, op grond
      waarvan vermelding van gehalte, samenstelling of hoedanigheid van het goed achterwege is gelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel39
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '39'
        hoofdstuk: III
        paragraaf: '1'
  - number: '20.4'
    text: |-
      De toestemming wordt door het produktschap slechts verleend in overeenstemming met de rijksbelastingdienst en de
      Algemene Inspectiedienst en indien aan de te stellen voorwaarden, als bedoeld in het tweede lid, ten volle kan
      worden voldaan, hetzij door middel van een deugdelijke voorraads en verwerkingsadministratie, hetzij door andere
      middelen.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel20
  - number: '20.5'
    text: |-
      De toestemming wordt tot wederopzeggens verleend. Zij wordt ingetrokken zodra blijkt, dat een of meer van de
      gestelde voorwaarden niet zijn nagekomen.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel20
  - number: '20.6'
    text: De in het tweede lid bedoelde controle wordt uitgeoefend door de Algemene Inspectiedienst.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel20
  - number: '21'
    text: 'Bij de toepassing van paragraaf 2 van Hoofdstuk V wordt:'
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel21
  - number: 21.a
    text: |-
      op de aangifte tot plaatsing onder het stelsel van douane-entrepots als bedoeld in artikel 530, eerste lid, van de
      Toepassingsverordening communautair douanewetboek, vermeld dat vooruitbetaling van restitutie wordt verzocht;
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel21
  - number: 21.b
    text: |-
      het exemplaar nr. 0 van de aangifte als bedoeld onder a terstond na de aanvaarding van de aangifte door de
      Belastingdienst aan het betreffende produktschap toegezonden;
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel21
  - number: 21.c
    text: |-
      in het geval entreposering heeft plaatsgevonden, op het formulier L, bedoeld in [artikel 39][ref1] van de
      Douaneregeling, vermeld dat vooruitbetaling van restitutie heeft plaatsgevonden, zulks met verwijzing naar de
      aangifte als bedoeld onder a;


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel39
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '39'
        hoofdstuk: III
        paragraaf: '1'
  - number: 21.d
    text: |-
      in het geval onder douanecontrole is geplaatst, op het formulier L als bedoeld in [artikel 19][ref1], vermeld
      dat vooruitbetaling van restitutie heeft plaatsgevonden, zulks met verwijzing naar datum en nummer van het bij de
      ondercontrolestelling overgelegde aanmeldingsformulier als bedoeld in [artikel 32][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0003381#Artikel32
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '19'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0003381
        artikel: '32'
        hoofdstuk: II
        paragraaf: '3'
  - number: 22a
    text: |-
      Uit de aangifte als bedoeld in [artikel 21, onder a][ref1], dan wel uit begeleidende of nagezonden stukken blijkt
      in geval bij de aangifte een uitvoer- of voorfixatiecertificaat wordt overgelegd, dat niet hier te lande is
      afgegeven, de instantie die het certificaat heeft afgegeven alsmede het nummer van het betrokken certificaat,
      terwijl bovendien een fotokopie daarvan moet worden meegezonden naar het betreffende produktschap.


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel21
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel22a
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '21'
        hoofdstuk: II
        paragraaf: '2'
  - number: '23'
    text: |-
      De rijksbelastingdienst stelt van de aangifte ten uitvoer of van de aangifte ten doorvoer onderscheidenlijk het
      vervullen van de formaliteiten ter zake van:
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel23
  - number: 23.a
    text: |-
      het bereiken van bijzondere bestemmingen, als bedoeld in [artikel 79][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel79
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '79'
        hoofdstuk: V
        paragraaf: '1'
  - number: 23.b
    text: |-
      b. het onder douanecontrole plaatsen van basisprodukten, bedoeld in [artikel 86a][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel86a
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: 86a
        hoofdstuk: V
        paragraaf: '2'
  - number: 23.c
    text: |-
      het entreposeren van goederen in de zin van het bepaalde in [artikel 86][ref1], overeenkomstig de
      uitvoeringsbepalingen en met inachtneming van de gebruiksaanwijzing in voorkomend geval aantekening op het
      overgelegde certificaat.


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel86
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '86'
        hoofdstuk: V
        paragraaf: '2'
  - number: '31.1'
    text: |-
      Van het hier te lande bereiken van een bijzondere bestemming, als bedoeld in [artikel 79][ref1], met aanspraak
      op restitutie en/of met toepassing van de [Regeling actief veredelingsverkeer landbouwgoederen 1986][ref2] wordt
      aangifte gedaan als bij of krachtens de [Douanewet][ref3] ter zake van de uitvoer is voorgeschreven. Het in de
      onderhavige regeling met betrekking tot de aangifte ten uitvoer in paragraaf 2, onder A, bepaalde is met betrekking
      tot die aangifte van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel79
      [ref2]: https://wetten.overheid.nl/BWBR0004088
      [ref3]: https://wetten.overheid.nl/BWBR0007632
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '79'
        hoofdstuk: V
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0004088
      - id: ref3
        bwb_id: BWBR0007632
  - number: '31.2'
    text: |-
      Van afleveringen voor een bijzondere bestemming als bedoeld in [artikel 79][ref1],
      in België en Luxemburg, met aanspraak op restitutie en/of met toepassing van de
      [Regeling actief veredelingsverkeer landbouwgoederen 1986][ref2], wordt aangifte gedaan als bij of krachtens de
      [Douanewet][ref3] ter zake van de uitvoer is voorgeschreven. Het in de onderhavige regeling met betrekking tot
      de aangifte ten uitvoer in paragraaf 2, onder A, bepaalde is met betrekking tot die aangifte van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel79
      [ref2]: https://wetten.overheid.nl/BWBR0004088
      [ref3]: https://wetten.overheid.nl/BWBR0007632
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '79'
        hoofdstuk: V
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0004088
      - id: ref3
        bwb_id: BWBR0007632
  - number: 31a
    text: |-
      Van - entreposering hier te lande van goederen met het oog op het verkrijgen van vooruitbetaling van restitutie, of
        - de opslag van goederen in een zich hier te lande bevindend erkend bevoorradingsdepot als bedoeld in
      [artikel 97][ref1] met het oog op toekenning van restitutie bij wijze van voorschot wordt, ook indien het
      douanegoederen betreft, aangifte gedaan als bij of krachtens de [Douanewet][ref2] ter zake van de uitvoer is
      voorgeschreven. Het in de onderhavige regeling met betrekking tot de aangifte ten uitvoer in paragraaf 2, onder A,
      bepaalde is met betrekking tot die aangifte van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel97
      [ref2]: https://wetten.overheid.nl/BWBR0007632
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel31a
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '97'
        hoofdstuk: V
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0007632
  - number: '32.1'
    text: |-
      De betalingsaangifte, bedoeld in artikel 26, eerste lid, van [verordening 800/1999](31999R0800), wordt door de
      exporteur gedaan bij de inspecteur van de rijksbelastingdienst, bevoegd inzake douane, in het douanedistrict waar
      de hoofdadministratie van die exporteur is gevestigd of bij de inspecteur van de rijksbelastingdienst, bevoegd
      inzake douane, in het douanedistrict waar de basisprodukten worden verwerkt.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel32
  - number: '32.2'
    text: |-
      De exporteur doet de betalingsaangifte, bedoeld in artikel 26, eerste lid, van [verordening 800/1999](31999R0800),
      voor het onder douanecontrole plaatsen van de basisprodukten bij de in het eerste lid bedoelde inspecteur.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel32
  - number: '34.1'
    text: |-
      Het produktschap kan op grond van artikel 26, derde lid, van [verordening 800/1999](31999R0800), indien het van
      mening is dat de omstandigheden dat rechtvaardigen, op verzoek van de exporteur hem toestaan om voorlopige gegevens
      over de uit de basisprodukten te vervaardigen goederen en/of produkten te geven.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel34
  - number: '34.2'
    text: |-
      De in het eerste lid bedoelde toestemming wordt slechts na raadpleging van de inspecteur, bedoeld in
      [artikel 32][ref1], verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel32
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '32'
        hoofdstuk: II
        paragraaf: '3'
  - number: 34a
    text: |-
      De betalingsaangifte voor het plaatsen van basisprodukten onder douanecontrole wordt gedaan door een volledig
      en naar waarheid ingevuld formulier, overeenkomstig het in [bijlage VII][ref1] opgenomen model, in drievoud te
      overleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0003381
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel34a
    references:
      - id: ref1
        bwb_id: BWBR0003381
  - number: 34b
    text: |-
      De betalingsaangifte voor het plaatsen van basisprodukten onder douanecontrole gaat vergezeld van de voorraadstaat
      van de dag voor de dag van de overlegging van de betalingsaangifte. De voorraadstaat bevat per opslaglocatie waar
      de basisprodukten onder douanecontrole worden geplaatst de volgende gegevens:
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel34b
  - number: 34b.a
    text: |-
      de totale voorraad van basisprodukten van dezelfde GN-code, als de basisprodukten die onder douanecontrole worden
      geplaatst, op die locatie aanwezig en
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel34b
  - number: 34b.b
    text: |-
      de voorraad van aanwezige basisprodukten van vorenbedoelde GN-code waarvoor verplichtingen uit eerdere onder
      douanecontrole plaatsingen gelden.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel34b
  - number: 34c.1
    text: |-
      De inspecteur, bedoeld in [artikel 32][ref1], zendt terstond na de beëindiging van de verificatie het eerste
      exemplaar van de betalingsaangifte, bedoeld in [artikel 34a][ref2], toe aan het produktschap, na daarop aantekening
      te hebben gesteld van zijn bevindingen omtrent: - soort en hoeveelheid van de onder douanecontrole geplaatste
      basisprodukten;
        - soort en hoeveelheid van de volgens de aangifte en met in achtneming van de in artikel 26, tweede lid, van
      [verordening 800/1999](31999R0800) bedoelde rendement of soortgelijke gegevens van later uit te voeren goederen en/
      of produkten en
        - de dag waarop de aangifte is aanvaard.


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0003381#Artikel34a
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel34c
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '32'
        hoofdstuk: II
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0003381
        artikel: 34a
        hoofdstuk: II
        paragraaf: '3'
  - number: 34c.2
    text: |-
      De inspecteur, bedoeld in [artikel 32][ref1], geeft het tweede exemplaar van de betalingsaangifte voorzien van de
      in het eerste lid bedoelde aantekening terug aan belanghebbende.


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel32
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel34c
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '32'
        hoofdstuk: II
        paragraaf: '3'
  - number: '35.1'
    text: |-
      Met betrekking tot de in kolom 1 van [bijlage I][ref1] aangewezen goederen is het produktschap bevoegd:


      [ref1]: https://wetten.overheid.nl/BWBR0003381
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0003381
  - number: 35.1.a
    text: |-
      tot het afgeven van de invoer- en uitvoercertificaten en uittreksels daarvan die in de gevallen waarin dit in een
      basisverordening of in de uitvoeringsbepalingen voor een zodanig goed wordt vereist, bij de invoer of de uitvoer
      van dat goed moeten worden overgelegd en, behoudens het bepaalde in het tweede lid alsmede de bepalingen in
      [paragraaf 4][ref1] van dit hoofdstuk, daarbij gelden als een vergunning en


      [ref1]: https://wetten.overheid.nl/BWBR0003381#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0003381
        hoofdstuk: III
        paragraaf: '4'
  - number: 35.1.b
    text: |-
      tot het verlenen van invoer- en uitvoervergunningen als bedoeld in de artikelen 2 en 3 van het besluit,
      alsmede invoervergunningen als bedoeld in [artikel 2 van het Invoerbesluit landen 1981][ref1] voor wat betreft
      landbouwgoederen, welke vergunningen – behoudens het bepaalde in [artikel 48][ref2] – bij de invoer of uitvoer van
      dat goed moeten worden overgelegd in de gevallen waarin een basisverordening of de uitvoeringsbepalingen daarvan
      onderscheidenlijk een handelspolitieke maatregel de invoer of de uitvoer van een zodanig goed naar hoeveelheid
      beperken.


      [ref1]: https://wetten.overheid.nl/BWBR0003448#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003381#Artikel48
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0003448
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0003381
        artikel: '48'
        hoofdstuk: III
        paragraaf: '3'
  - number: '35.2'
    text: |-
      In de gevallen waarin, ingevolge een basisverordening of uitvoeringsbepaling, de invoer in de Gemeenschap
      onderscheidenlijk uitvoer uit de Gemeenschap van een goed aan bijzondere voorwaarden dan wel voorschriften is
      onderworpen, geldt het in het eerste lid, onder a, bedoelde certificaat slechts onder zodanige voorwaarden of met
      zodanige daaraan verbonden voorschriften als vergunning dat aan het gestelde in de communautaire regeling wordt
      voldaan, een en ander met inachtneming van de daarin voorgeschreven procedures.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel35
  - number: '35.3'
    text: |-
      Voor andere dan in het eerste lid, onder b, bedoelde gevallen worden met betrekking tot de aldaar in de aanhef
      bedoelde goederen geen vergunningen verleend.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel35
  - number: '36'
    text: |-
      Onverminderd het bepaalde in [paragraaf 4][ref1] van dit hoofdstuk is van het verbod tot invoer of
      uitvoer zonder vergunning als bedoeld in de [artikelen 2][ref2], juncto [artikel 14][ref3], en 3 juncto
      de artikelen 15 en 16, van het besluit, alsmede van het verbod tot invoer zonder vergunning als bedoeld in
      [artikel 2 van het Invoerbesluit landen 1981][ref4] voor wat betreft landbouwgoederen in de zin van dat besluit,
      vrijgesteld:


      [ref1]: https://wetten.overheid.nl/BWBR0003381#HoofdstukIII
      [ref2]: https://wetten.overheid.nl/BWBR0003381#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0003381#Artikel14
      [ref4]: https://wetten.overheid.nl/BWBR0003448#Artikel2
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0003381
        hoofdstuk: III
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0003381
        artikel: '2'
        hoofdstuk: I
      - id: ref3
        bwb_id: BWBR0003381
        artikel: '14'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0003448
        artikel: '2'
  - number: 36.a
    text: |-
      de invoer uit het vrije verkeer van andere Lid-Staten niet zijnde België of Luxemburg alsmede de uitvoer naar
      zodanige Lid-Staten van goederen die vallen onder de in kolom 1 van bijlage 1 genoemde basisverordeningen;
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel36
  - number: 36.b
    text: |-
      de invoer met voorwaardelijke vrijstelling van heffing in actief veredelingsverkeer van goederen welke zijn
      aangewezen in kolom 3 van [bijlage I][ref1], alsmede de uitvoer van goederen ter zuivering van bovengenoemde
      voorwaardelijke vrijstelling voor actief veredelingsverkeer, voor zover aan de voorwaarden die door de
      uitvoeringsbepalingen aan de vrijstelling worden gesteld, met inachtneming van het bepaalde in de Beschikking
      actief veredelingsverkeer landbouwgoederen 1986, is voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0003381
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0003381
  - number: 36.c
    text: |-
      de invoer anders dan uit het vrije verkeer van de Gemeenschap onderscheidenlijk de uitvoer of doorvoer naar
      landen of gebieden die geen deel uitmaken van de Gemeenschap van de onder a bedoelde verordeningen vallende
      goederen, waarvoor bij zodanige invoer, uitvoer of doorvoer ingevolge die verordeningen geen invoercertificaat
      onderscheidenlijk geen uitvoercertificaat behoeft te worden overgelegd.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel36
  - number: '38'
    text: |-
      Met betrekking tot de in kolom 1 van [bijlage II][ref1] aangewezen goederen is het in kolom 2 vermelde produktschap
      bevoegd tot:


      [ref1]: https://wetten.overheid.nl/BWBR0003381
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0003381
  - number: 38.a
    text: |-
      het verlenen van invoer- en uitvoervergunningen als bedoeld in de [artikel 2][ref1] en 3 van het besluit,
      alsmede invoervergunningen als bedoeld in [artikel 2][ref2] van het het Invoerbesluit landen voor wat betreft
      landbouwgoederen;


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003381#Artikel2
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '2'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0003381
        artikel: '2'
        hoofdstuk: I
  - number: 38.b
    text: |-
      het verlenen van vrijstelling of ontheffing als bedoeld in artikel 13 van het besluit van het verbod tot invoer
      onderscheidenlijk uitvoer zonder vergunning;
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel38
  - number: 38.c
    text: |-
      het verbinden van vergunningen, vrijstellingen of ontheffingen als bedoeld in evengenoemd artikel van voorschriften
      of beperkingen als bedoeld in artikel 5 van de wet;
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel38
  - number: 38.d
    text: |-
      het bepalen van de in artikel 4 van de wet bedoelde gegevens die bij het aanvragen van zodanige vergunningen of
      ontheffingen dienen te worden verstrekt, en
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel38
  - number: 38.e
    text: het intrekken van zodanige vergunningen of ontheffingen op de voet van het bepaalde van artikel 9 van de wet.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel38
  - number: '39'
    text: |-
      Het bepaalde in [artikel 36 en in artikel 38][ref1], geldt onverminderd het bepaalde in: - de
      [Vrijstellingsbeschikking klein grensverkeer landbouwgoederen 1981][ref2];
        - de Vrijstellingsbeschikking militaire zendingen (landbouwgoederen) 1981.


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0002417
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '38'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002417
  - number: '40.1'
    text: |-
      Aanvragen van certificaten worden bij het produktschap ingediend met gebruikmaking van het aanvraagformulier
      waarvan het model is opgenomen in bijlage I van [Verordening (EEG) nr. 3719/88](31988R3719) (Pb.E.G. nr. L 331), of
      per schriftelijk telecommunicatiebericht.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel40
  - number: '40.2'
    text: |-
      Het produktschap neemt een aanvraag per schriftelijk telecommunicatiebericht slechts in behandeling indien deze
      alle gegevens bevat die op het aanvraagformulier, als bedoeld in het eerste lid, hadden moeten voorkomen. Bovendien
      kan het produktschap eisen dat een overeenkomstig de desbetreffende uitvoeringsbepalingen per telegram of telex
      gedane aanvraag voor een certificaat door een schriftelijke aanvraag als bedoeld in het eerste lid wordt gevolgd.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel40
  - number: '40.3'
    text: |-
      Het produktschap is bevoegd de aanvragen in te trekken alsmede de afgegeven certificaten te annuleren in de
      gevallen voorzien in [Verordening (EEG) nr. 120/89](31989R0120) (Pb.E.G. nr. L 16). In een dergelijk geval wordt de
      gestelde zekerheid vrijgegeven.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel40
  - number: '41.1'
    text: |-
      Het produktschap geeft de in [artikel 35, eerste lid, onder a][ref1], bedoelde certificaten en uittreksels van deze
      certificaten eerst af, nadat:


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel35
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '35'
        hoofdstuk: III
        paragraaf: '1'
  - number: 41.1.a
    text: |-
      aan alle in de basisverordening of uitvoeringsbepalingen voor de afgifte gestelde voorwaarden is voldaan en de
      daarin voorgeschreven bescheiden zijn overgelegd;
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel41
  - number: 41.1.b
    text: |-
      de aanvrager zich tegenover het produktschap heeft verbonden tot: - nakoming van alle verplichtingen die voor hem
      uit het aan hem af te geven certificaat of uittreksel voortvloeien, en
        - betaling als boete aan het produktschap van een bedrag dat overeenstemt met het geheel of een evenredig
      gedeelte van de door hem gestelde of te stellen zekerheid, indien of voor zover niet op de wijze als in de
      uitvoeringsbepalingen is voorgeschreven het bewijs wordt geleverd, dat binnen de gestelde termijn volledig aan al
      deze verplichtingen is voldaan. Door de afgifte van het certificaat wordt het produktschap geacht-deze verbintenis
      te hebben aanvaard.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel41
  - number: '41.2'
    text: |-
      Indien het certificaat onder beperkingen is verleend onderscheidenlijk aan de verlening van het certificaat
      voorschriften zijn verbonden, wordt daarvan, indien dit voor de goede uitvoering van de basisverordening of
      uitvoeringsbepalingen is voorgeschreven c.q. wenselijk wordt geacht, melding gemaakt op het certificaat.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel41
  - number: '41.3'
    text: |-
      Alle door het produktschap afgegeven certificaten worden in het Nederlands gesteld en alle bedragen daarop worden
      in Nederlands courant vermeld.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel41
  - number: '41.4'
    text: |-
      In afwijking van het vorige lid, worden, ingevolge [Verordening (EEG) Nr. 653/92](31992R0653) (Pb EG Nr. L 70), de
      bedragen van de in het kader van een inschrijving aanvaarde offertes, op het certificaat in ecu vermeld.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel41
  - number: 41A.1
    text: |-
      Het produktschap is bevoegd tot afgifte van een vervangingscertificaat, onderscheidenlijk vervangingsuittreksel, in
      de gevallen voorzien in [Verordening (EEG) nr. 3719/88](31988R3719), een en ander met inachtneming van het daarin
      bepaalde.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel41A
  - number: 41A.2
    text: |-
      In geval van verlies van het vervangingscertificaat, onderscheidenlijk vervangingsuittreksel, wordt daarvoor geen
      vervangingsexemplaar verstrekt.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel41A
  - number: 41A.3
    text: |-
      Indien de beschikbare hoeveelheid vermeld op het teruggevonden oorspronkelijke certificaat, onderscheidenlijk
      uittreksel, groter is dan die waarvoor het vervangingscertificaat, onderscheidenlijk vervangingsuittreksel, is
      afgegeven, is het produktschap bevoegd voor de hoeveelheid die overeenkomt met dit verschil een uittreksel af te
      geven.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel41A
  - number: 41A.4
    text: |-
      Van elke gebruikmaking van de bevoegdheid vermeld in het eerste lid, geeft het produktschap periodiek, dat wil
      zeggen om de drie maanden, kennis aan de minister.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel41A
  - number: '42.1'
    text: |-
      Het stellen van de in de basisverordeningen of uitvoeringsbepalingen voorgeschreven zekerheid als garantie dat
      binnen de geldigheidsduur van het certificaat zal worden voldaan aan de daaraan verbonden verplichting tot invoer
      uit of uitvoer naar een land of gebied dat geen deel uitmaakt van de Gemeenschap dan wel dat een met zodanige
      uitvoer gelijkgestelde levering zal worden verricht, geschiedt bij het produktschap.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel42
  - number: '42.2'
    text: |-
      Wanneer het stellen van de zekerheid niet in contanten geschiedt, kan als garantie slechts worden aanvaard een
      garantieverklaring, afgegeven door een in afdeling I of II van het register der kredietinstellingen, als bedoeld
      in artikel 1 van de Wet toezicht kredietwezen, ingeschreven kredietinstelling, alsmede door een instelling die door
      de Minister van Financiën is toegelaten tot het stellen van zakelijke zekerheid voor de nakoming van verplichtingen
      inzake invoerrechten en accijnzen, welke zij als borg op zich neemt.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel42
  - number: '42.3'
    text: |-
      Ingeval de invoer of uitvoer ten gevolge van overmacht niet tijdens de geldigheidsduur van het certificaat
      kan geschieden, is het produktschap, met inachtneming van de bepalingen van [Verordening (EEG) nr. 3719/88]
      (31988R3719), bevoegd te beslissen, hetzij dat de verplichting tot invoer of uitvoer wordt opgeheven, hetzij dat
      de geldigheidsduur van het certificaat wordt verlengd. Het Produktschap is eveneens bevoegd hierbij aanvragen tot
      afgifte van een tweede certificaat in behandeling te nemen, met inachtneming van de daarvoor geldende bepalingen
      van de hiervoor aangehaalde verordening. Van elk gebruik maken van deze bevoegdheid geeft het produktschap
      periodiek kennis aan de minister.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel42
  - number: '42.4'
    text: |-
      Indien aan de verplichting tot invoer of uitvoer met, niet tijdig of niet volledig is voldaan, gaat het produktschap
      over tot invordering van het bedrag, bedoeld in [artikel 41, eerste lid, onder b, tweede gedachtenstreepje][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel41
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '41'
        hoofdstuk: III
        paragraaf: '2'
  - number: '42.5'
    text: |-
      Onverminderd het bepaalde in het vorige lid kan het produktschap indien de belanghebbende in
      het in de uitvoeringsbepalingen voorziene geval en onder de daarin opgenomen voorwaarden tijdig
      zorgdraagt voor vervangende invoer, voorshands afzien van de invordering van het bedrag bedoeld in
      [artikel 41, eerste lid, onder b, tweede gedachtenstreepje][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel41
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '41'
        hoofdstuk: III
        paragraaf: '2'
  - number: '43.1'
    text: |-
      Het produktschap geeft de zekerheid vrij in gevallen voorzien in de uitvoeringsbepalingen, alsmede bij de
      toepassing van Hoofdstuk V, paragraaf 2.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel43
  - number: '43.2'
    text: |-
      Het voor de vrijgave vereiste bewijs wordt geleverd door het terug ontvangen controle-exemplaar T 5, indien dit
      ingevolge de uitvoeringsbepalingen van de nodige aantekeningen is voorzien.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel43
  - number: '43.3'
    text: Het produktschap is bevoegd overeenkomstig de uitvoeringsbepalingen
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel43
  - number: 43.3.a
    text: tot gedeeltelijke vrijgave van de zekerheid over te gaan;
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel43
  - number: 43.3.b
    text: tot het zo nodig terugboeken van een verrichte afschrijving op de certificaten;
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel43
  - number: 43.3.c
    text: tot het opnieuw laten stellen van de zekerheid;
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel43
  - number: 43.3.d
    text: |-
      tot vrijgave van de zekerheid over te gaan nadat op tijdig verzoek andere bewijsstukken dan het controle-exemplaar
      T 5 overeenkomstig het bepaalde in [artikel 80, vierde lid][ref1], als gelijkwaardig zijn erkend.


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel80
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '80'
        hoofdstuk: V
        paragraaf: '1'
  - number: '44.1'
    text: |-
      Het bepaalde in deze paragraaf alsmede in [artikel 35, eerste lid, onder a][ref1], is met betrekking tot in
      een basisverordening of uitvoeringsbepaling voorziene voorfixatiecertificaten met behulp waarvan een heffing of
      restitutie vooraf kan worden vastgesteld, van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel35
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '35'
        hoofdstuk: III
        paragraaf: '1'
  - number: '44.2'
    text: |-
      Voor de toepassing van het bepaalde in de [artikelen 41, derde lid][ref1],
      [42, eerste, tweede, vierde en vijfde lid][ref2], [43, tweede lid][ref3], [45][ref4], [63][ref5] en
      [artikel 83, eerste lid][ref6], wordt een overeenkomstig de uitvoeringsbepalingen afgegeven uittreksel van een
      certificaat als certificaat beschouwd.


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel41
      [ref2]: https://wetten.overheid.nl/BWBR0003381#Artikel42
      [ref3]: https://wetten.overheid.nl/BWBR0003381#Artikel43
      [ref4]: https://wetten.overheid.nl/BWBR0003381#Artikel45
      [ref5]: https://wetten.overheid.nl/BWBR0003381#Artikel63
      [ref6]: https://wetten.overheid.nl/BWBR0003381#Artikel83
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel44
    references:
