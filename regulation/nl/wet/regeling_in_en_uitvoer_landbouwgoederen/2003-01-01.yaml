  - number: '46.1'
    text: |-
      Bij het aanvragen van een vergunning dienen de gegevens te worden verstrekt en de bewijsstukken te worden
      overgelegd die naar het oordeel van het produktschap nodig zijn in verband met de voor de desbetreffende invoer of
      uitvoer dan wel doorvoer in de basisverordeningen of uitvoeringsbepalingen gestelde voorschriften
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel46
  - number: '46.2'
    text: |-
      Indien de basisverordeningen of uitvoeringsbepalingen dit vorderen, dan wel een juiste toepassing van deze
      verordeningen en bepalingen dit met zich brengt verleent het produktschap de vergunning onder beperkingen of
      verbindt daaraan voorschriften.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel46
  - number: '46.3'
    text: |-
      Het produktschap kan, indien een juiste toepassing van de in de vorige leden genoemde communautaire voorschriften
      die met zich brengt, ontheffing verlenen van het in de vorige leden bepaalde dan wel de verleende ontheffing of
      vergunning intrekken.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel46
  - number: '47.1'
    text: |-
      In de gevallen waarin, ingevolge een basisverordening of uitvoeringsbepaling, de invoer in de Gemeenschap
      onderscheidenlijk de uitvoer uit de Gemeenschap van een goed naar hoeveelheid is beperkt of aan bijzondere
      voorwaarden dan wel voorschriften is onderworpen, worden door het produktschap voor dat goed vergunningen niet
      of slechts voor zodanige hoeveelheden, onder zodanige voorwaarden of met zodanige daaraan verbonden voorschriften
      verleend, dat aan het gestelde in de communautaire regeling is voldaan, een en ander met inachtneming van de daarin
      voorgeschreven procedures.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel47
  - number: '47.2'
    text: |-
      Indien de vergunning onder beperkingen is verleend onderscheidenlijk daaraan voorschriften zijn verbonden, wordt
      daarvan indien dit is voorgeschreven c.q voor de goede uitvoering van de communautaire regeling wenselijk wordt
      geacht, melding gemaakt op de vergunning.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel47
  - number: '48.1'
    text: |-
      In de gevallen, waarin ingevolge een basisverordening of uitvoeringsbepaling de invoer, onderscheidenlijk de
      uitvoer of doorvoer is gebonden aan een bijzondere voorwaarde, die inhoudt dat ter verzekering van de nakoming
      van een verplichting een waarborg dient te worden gesteld, is voor die invoer, onderscheidenlijk die uitvoer of
      doorvoer geen vergunning vereist, doch de overlegging van een verklaring waaruit blijkt dat de voorgeschreven
      waarborg is gesteld.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel48
  - number: '48.2'
    text: |-
      De waarborg wordt gesteld bij het produktschap. [Artikel 42, tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel42
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '42'
        hoofdstuk: III
        paragraaf: '2'
  - number: '48.3'
    text: |-
      Het produktschap stelt de verklaring op het bij de aangifte ten invoer, ten uitvoer of ten doorvoer over te leggen
      formulier L, bedoeld in [artikel 37][ref1] van de Douaneregeling, onderscheidenlijk in [artikel 39][ref2] van de
      Douaneregeling, dan wel op het formulier zekerheidstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0003381#Artikel39
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '37'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0003381
        artikel: '39'
        hoofdstuk: III
        paragraaf: '1'
  - number: '48.4'
    text: |-
      Het produktschap geeft de gestelde waarborg vrij in de gevallen en op de wijze als voorzien in de in het eerste lid
      bedoelde communautaire voorschriften.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel48
  - number: 49a
    text: |-
      In afwijking van de [artikelen 40][ref1] tot en met [45][ref2] geeft het productschap de in
      [artikel 35, eerste lid, onder a][ref3], bedoelde invoercertificaten en uittreksels daarvan slechts af voor:


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0003381#Artikel45
      [ref3]: https://wetten.overheid.nl/BWBR0003381#Artikel35
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel49a
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '40'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0003381
        artikel: '45'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0003381
        artikel: '35'
        hoofdstuk: III
        paragraaf: '1'
  - number: 49a.1
    text: |-
      ruwe hennep van post 53 02 10 00 van de gecombineerde nomenclatuur indien deze voldoet aan de voorwaarden van
      [artikel 5][ref1] bis van [Verordening (EG) nr. 1251/1999](31999R1251) (PbEG L 160);


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel5
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel49a
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '5'
        hoofdstuk: I
  - number: 49a.2
    text: |-
      zaaizaad voor de inzaai van henneprassen van post 1207 99 20 van de gecombineerde nomenclatuur indien deze
      vergezeld gaat van het bewijs dat het gehalte aan tetrahydrocannabinol niet hoger is dan het in [artikel 5][ref1]
      bis van [Verordening (EG) nr. 1251/1999](31999R1251) vastgestelde gehalte;


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel5
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel49a
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '5'
        hoofdstuk: I
  - number: 49a.3
    text: 'niet voor inzaai bestemd hennepzaad van de post 1207 99 91 van de gecombineerde nomenclatuur indien:'
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel49a
  - number: 49a.3.a
    text: de importeur door het productschap is erkend;
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel49a
  - number: 49a.3.b
    text: |-
      de importeur zich ertoe verbindt zorg te dragen voor de verstrekking aan het productschap van de in
      [artikel 17][ref1] bis van [Verordening (EG) 245/2001](32001R0245) (PbEG L 35) bedoelde verklaringen binnen de
      aldaar gestelde termijn en onder de door het productschap gestelde voorwaarden;


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel17
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel49a
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '17'
        hoofdstuk: II
        paragraaf: '1'
  - number: 49a.3.c
    text: de administratie van de importeur voldoet aan de door het productschap gestelde eisen;
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel49a
  - number: 49a.3.d
    text: |-
      de importeur toelaat dat, indien zulks de Algemene Inspectiedienst of het productschap nodig voorkomt, wordt
      overgegaan tot controle op de naleving van hetgeen bij of krachtens [Verordening 1673/2000](32000R1673) (PbEG L
      193) is bepaald; en
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel49a
  - number: 49a.3.e
    text: de importeur zodanige maatregelen treft dat ook zijn afnemers aan het onder c en d gestelde voldoen.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel49a
  - number: 49b
    text: |-
      In de gevallen waarin ten aanzien van producten waarop aanduidingen voorkomen die verwijzen naar de biologische
      productiemethode als bedoeld in artikel 1 van [Verordening (EEG) nr. 2092/91](31991R2092) (PbEG L 198), een
      controlecertificaat als bedoeld in [artikel 11, eerste lid, onder b][ref1] van voornoemde verordening is
      voorgeschreven, geldt in afwijking van [artikel 35, eerste lid, onder a][ref2], het invoercertificaat dat in
      voorkomend geval ingevolge de basisverordening of de uitvoeringsbepalingen bij de invoer moet worden overgelegd
      slechts als vergunning indien bij het doen van de aangifte ten invoer, naast het certificaat tevens het
      bovengenoemde controlecertificaat, ingevuld en afgegeven overeenkomstig het bepaalde in [Verordening (EG) nr.
      1788/2001](32001R1788) (PbEG L 243), wordt overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0003381#Artikel35
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel49b
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '11'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0003381
        artikel: '35'
        hoofdstuk: III
        paragraaf: '1'
  - number: '50.1'
    text: |-
      De in [artikel 36, onder c][ref1], bedoelde vrijstelling geldt voor wat betreft olijfolie van post 1509 en 1510 van
      de gecombineerde nomenclatuur die in het vrije verkeer wordt gebracht, slechts


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel36
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '36'
        hoofdstuk: III
        paragraaf: '1'
  - number: 50.1.a
    text: |-
      indien bij en ten genoege van het produktschap overeenkomstig artikel 17 van [Verordening (EEG) nr. 2677/85]
      (31985R2677) (PbEG nr. L 254) een waarborg is gesteld als garantie dat het goed niet in aanmerking wordt gebracht
      voor steun als bedoeld in artikel 11 van [Verordening nr. 136/66/EEG](31966R0136) (Pb. E.G. nr. 172);
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel50
  - number: 50.1.b
    text: |-
      indien op de verpakking de ingevolge [Verordening (EEG) nr. 2677/85](31985R2677) voorgeschreven aanduiding is
      aangebracht.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel50
  - number: '50.2'
    text: |-
      In afwijking van [artikel 35, eerste lid, onder a][ref1], gelden de certificaten die in voorkomend geval ingevolge
      de basisverordeningen of uitvoeringsbepalingen bij de invoer van de in het eerste lid bedoelde olijfolie dienen te
      worden overgelegd slechts als vergunning indien bij en ten genoege van het produktschap overeenkomstig het in het
      eerste lid bepaalde de aldaar bedoelde waarborg is gesteld. Het gestelde in het eerste lid is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel35
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '35'
        hoofdstuk: III
        paragraaf: '1'
  - number: 50a.1
    text: |-
      De in [artikel 36, onder c][ref1], bedoelde vrijstelling geldt voor wat betreft olijven van de posten 0709 9031,
      0709 9039, 0711 2010 en 0711 2090 van de Gecombineerde Nomenclatuur, met uitzondering van olijven in verpakkingen
      met een netto-inhoud per onmiddellijke verpakking van niet meer dan 5 kilogram, die in het vrije verkeer worden
      gebracht, slechts indien bij en ten genoegen van het produktschap overeenkomstig [Verordening (EEG) nr. 104/91]
      (31991R0104) (Pb EG nr. L 12) een zekerheid is gesteld als garantie dat de olie die uit in de Gemeenschap in het
      vrije verkeer gebrachte olijven is verkregen niet in aanmerking wordt gebracht voor de produktie en consumptiesteun
      als bedoeld in [Verordening (EEG) nr. 136/66](31966R0136) (Pb EG nr. L 172)


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel36
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel50a
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '36'
        hoofdstuk: III
        paragraaf: '1'
  - number: 50a.2
    text: |-
      Ter zake van het stellen van de zekerheid is [artikel 42, tweede lid][ref1], van overeenkomstig toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel42
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel50a
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '42'
        hoofdstuk: III
        paragraaf: '2'
  - number: 50a.3
    text: |-
      Van het stellen van de in het tweede lid bedoelde zekerheid wordt door het produktschap aantekening gesteld op
      beide exemplaren van hethet formulier L, bedoeld in [artikel 37][ref1] van de Douaneregeling, houdende vermelding
      van de hoeveelheid en soort alsmede het bedrag waarvoor zekerheid is gesteld en zonodig de tijdsduur waarvoor zij
      geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel37
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel50a
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '37'
        hoofdstuk: III
        paragraaf: '1'
  - number: 50a.4
    text: |-
      Het produktschap geeft de zekerheid met inachtneming van het bepaalde in [Verordening (EEG) nr. 104/91](31991R0104)
      vrij.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel50a
  - number: '52.1'
    text: |-
      De in [artikel 36, onderdeel c][ref1], bedoelde vrijstelling geldt voor wat betreft de invoer van levende runderen
      zijnde fokdieren van zuiver ras van GN code 0102 1000 slechts indien:


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel36
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '36'
        hoofdstuk: III
        paragraaf: '1'
  - number: 52.1.a
    text: |-
      de ouders en de grootouders zijn ingeschreven of geregistreerd in het stamboek voor hetzelfde ras en de runderen
      zelf in dat stamboek staan ingeschreven dan wel geregistreerd en geschikt zijn om erin te worden ingeschreven en
      voor zover het vrouwelijke dieren betreft niet ouder dan 6 jaar zijn;
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel52
  - number: 52.1.b
    text: |-
      bij de aangifte ten invoer voor ieder rund afzonderlijk een stamboekcertificaat waarin de in onderdeel a vermelde
      gegevens zijn opgenomen en een voor fokdieren van zuiver ras opgesteld gezondheidscertificaat worden overgelegd
      alsmede een op afschrift gestelde verklaring van de importeur dat de runderen waarvoor de aangifte ten invoer wordt
      gedaan, behoudens in geval van overmacht, niet binnen een termijn van 12 maanden nadat de aangifte ten invoer heeft
      plaatsgevonden zullen worden geslacht;
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel52
  - number: 52.1.c
    text: |-
      de importeur uiterlijk aan het einde van de 15e maand volgende op die waarin de runderen in het vrije verkeer zijn
      gebracht bij de douane een verklaring overlegt van: - een in Nederland erkende stamboekvereniging dat de runderen
      niet binnen de in onderdeel b bedoelde termijn zijn geslacht en staan ingeschreven dan wel geregistreerd in het
      stamboek van deze stamboekvereniging, of
        - de Voedsel en Waren Autoriteit, dan wel van een dierenarts dat de runderen binnen de in onderdeel b genoemde
      termijn om gezondheidsredenen zijn geslacht dan wel als gevolg van een ziekte of ongeval zijn gestorven.
      TRCJZ/2002/12082
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel52
  - number: '52.2'
    text: |-
      Voor fokdieren van zuiver ras van oorsprong en herkomstig uit Oostenrijk, Finland, IJsland, Noorwegen, Zweden en
      Zwitserland gelden evenwel niet de in het eerste lid, onderdeel a, bedoelde leeftijdsgrens en de in het eerste
      lid, onderdeel b, bedoelde aanhoudverplichting van een termijn van 12 maanden alsmede de daaraan verbonden
      bewijslast. Wel dienen de in de eerste volzin bedoelde ten invoer aangeboden runderen te worden ingeschreven dan
      wel geregistreerd in het stamboek van een in het eerste lid, onderdeel c bedoelde stamboekvereniging.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel52
  - number: '52.3'
    text: |-
      In geval van wederinvoer in de Gemeenschap alsmede ingeval dat uit het in het eerste lid, onderdeel b, bedoelde
      stamboekcertificaat blijkt dat de fokker is gevestigd binnen de Gemeenschap geldt, onverminderd het in het eerste
      lid, de onderdelen a, b en c bepaalde, de in het eerste lid vermelde vrijstelling slechts indien de importeur
      bij de aangifte ten invoer aan de hand van een verklaring van het produktschap het bewijs levert dat bij de
      voorafgaande uitvoer van de runderen uit de Gemeenschap geen restitutie is verleend, dan wel dat de toegekende
      restitutie is terugbetaald, of dat de nodige maatregelen zijn genomen om ervoor te zorgen dat de restitutie niet
      zal worden uitgekeerd.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel52
  - number: '52.4'
    text: |-
      Indien in geval van wederinvoer blijkt dat de fokker binnen de Gemeenschap is gevestigd en de importeur niet
      het in het derde lid genoemde bewijs levert, dan wel wanneer uit dat bewijs niet blijkt welk bedrag bij de
      voorafgaande uitvoer uit de Gemeenschap van de runderen aan restitutie is uitbetaald geldt, onverminderd het
      in het eerste lid, de onderdelen a, b en c bepaalde, de in het eerste lid vermelde vrijstelling slechts indien
      een verklaring van het produktschap wordt overgelegd waaruit blijkt dat aan het produktschap een bedrag is
      bepaald gelijk aan de hoogste heffing die op de dag van wederinvoer geldt voor runderen van Gn code 01.02.90
      of dat voor de betaling daarvan bij en ten genoegen van het produktschap zekerheid is gesteld; het gestelde in
      [artikel 62, tweede lid, tweede volzin, en vijfde lid][ref1], alsmede in [artikel 64, eerste lid][ref2], aanhef en
      onderdeel b II, is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel62
      [ref2]: https://wetten.overheid.nl/BWBR0003381#Artikel64
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '62'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0003381
        artikel: '64'
        hoofdstuk: IV
  - number: '52.5'
    text: |-
      Indien de invoer hier te lande is vooraf gegaan door een uitvoer uit een andere Lid-Staat geeft het produktschap
      de in het derde lid bedoelde verklaring slechts af nadat aan het produktschap een door de bevoegde autoriteit van
      die Lid-Staat afgegeven verklaring is overgelegd, waaruit blijkt dat de ingevolge genoemde verordening toegekende
      restitutie is terugbetaald, dan wel dat de nodige maatregelen zijn genomen om ervoor te zorgen dat deze niet zal
      worden uitgekeerd.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel52
  - number: '53'
    text: |-
      In de gevallen waarin het transport binnen Nederland van de goederen bedoeld in artikel 1, tweede lid, van
      [Verordening (EEG) nr. 822/87](31987R0822) (Pb.E.G. nr. L 84), vergezeld moet gaan van een handelsdocument of
      een erkend handelsdocument, als bedoeld in [artikel 2, eerste lid, onderdeel d][ref1] juncto onderdeel e van
      [verordening (EEG) nr. 2238/93](31993R2238) van de Commissie van de Europese Gemeenschappen van 26 juli 1993
      betreffende de begeleidende documenten voor het vervoer van wijnbouwprodukten en de in de wijnsector bij te houden
      registers (PbEG L 200), is al naar het geval het gestelde onder a of b van toepassing:


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel2
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '2'
        hoofdstuk: I
  - number: 53.a
    text: |-
      de in [artikel 36, onder a][ref1], onderscheidenlijk [artikel 36, onder c][ref2], bedoelde vrijstelling
      geldt slechts ingeval bij het doen van aangifte ten invoer het in de aanhef genoemd handelsdocument of erkend
      handelsdocument wordt overgelegd;


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0003381#Artikel36
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '36'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0003381
        artikel: '36'
        hoofdstuk: III
        paragraaf: '1'
  - number: 53.b
    text: |-
      in afwijking van [artikel 35, eerste lid, onder a][ref1], geldt het certificaat dat in voorkomend geval ingevolge
      de basisverordening of uitvoeringsbepalingen bij de invoer van de in de aanhef bedoelde goederen moet worden
      overgelegd slechts als vergunning, indien bij het doen van aangifte ten invoer naast het certificaat tevens het in
      de aanhef genoemde handelsdocument of erkend handelsdocument wordt overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel35
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '35'
        hoofdstuk: III
        paragraaf: '1'
  - number: '54'
    text: |-
      In de gevallen waarin ten aanzien van goederen als bedoeld in artikel 70, eerste lid, eerste volzin van
      [Verordening (EEG) nr. 822/87](31987R0822) (Pb.E.G. nr. L 84) een document als bedoeld in artikel 2 van
      [Verordening (EEG) nr. 3590/85](31985R3590) (Pb.E.G. nr. L 343) is voorgeschreven, geldt in afwijking
      van [artikel 35, eerste lid, onder a][ref1], het invoercertificaat dat in voorkomend geval ingevolge de
      basisverordening of de uitvoeringsbepalingen bij de invoer moet worden overgelegd slechts als vergunning indien
      bij het doen van de aangifte ten invoer naast het certificaat tevens het bovengenoemde document, ingevuld
      overeenkomstig het bepaalde in [Verordening (EEG) nr. 3590/85](31985R3590), wordt overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel35
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '35'
        hoofdstuk: III
        paragraaf: '1'
  - number: '55.1'
    text: |-
      In afwijking van [artikel 35, eerste lid, onder a][ref1], geldt het certificaat dat in voorkomend geval ingevolge
      de basisverordening of uitvoeringsbepalingen bij de invoer van de in [artikel 1, tweede lid][ref2], van erordening
      (EEG) nr. 822/87 (Pb.E.G. nr. L 84) genoemde goederen moet worden overgelegd niet als vergunning voor de invoer
      van de genoemde goederen waaraan alcohol is toegevoegd, tenzij het betreft likeurwijn of distillatiewijn, dan
      wel, overeenkomstig het in [Verordening (EEG) nr. 351/79](31979R0351) (Pb. E.G. nr. L 54) bepaalde, een van de in
      artikel 1 van deze verordening genoemde goederen. Voor de in de vorige volzin eerstbedoelde goederen worden geen
      vergunningen afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0003381#Artikel1
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '35'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0003381
        artikel: '1'
        hoofdstuk: I
  - number: '55.2'
    text: |-
      Ingeval van invoer van goederen bedoeld in artikel 1 van [Verordening (EEG) nr. 351/79](31979R0351) (Pb. nr. L
      54) dienen op de aangifte ten invoer en op het formulier L, bedoeld in [artikel 37][ref1] van de Douaneregeling de
      volgende gegevens te worden vermeld: - de soort en de hoeveelheid toegevoegde alcohol, alsmede indien het betreft
      goederen aangeduid [onder 3 en 4 van artikel 1][ref2] van genoemde verordening;
        - de aldaar bedoelde produkten, ter bereiding waarvan die goederen bestemd zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0003381#Artikel1
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '37'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0003381
        artikel: '1'
        hoofdstuk: I
  - number: '56'
    text: |-
      De in [artikel 36, onder a][ref1], bedoelde vrijstellingen gelden voor wat betreft de in artikel 2 van [verordening
      (EEG) nr. 1679/71](31971R1679) van de Raad van de Europese Gemeenschappen van 26 juli 1971, houdende een
      gemeenschappelijke ordening der markten in de sector hop (PbEG L 175). genoemde produkten slechts indien en
      voor zover bij het doen van de aangifte ten invoer wordt overgelegd, al naar gelang van het bij of krachtens die
      verordening bepaalde, hetzij een certificaat als bedoeld in artikel 3 van die verordening, hetzij een factuur als
      bedoeld in artikel 7 van [Verordening (EEG) nr. 3076/78](31978R3076) (Pb. E.G. nr. L 367).


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel36
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '36'
        hoofdstuk: III
        paragraaf: '1'
  - number: '57'
    text: |-
      De in [artikel 36, onder c][ref1], bedoelde vrijstelling geldt


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel36
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0003381
        artikel: '36'
        hoofdstuk: III
        paragraaf: '1'
  - number: 57.a
    text: |-
      voor wat betreft hopbellen van post ex 1210 van de gecombineerde nomenclatuur slechts indien en voor zover bij het
      doen van de aangifte ten invoer wordt overgelegd hetzij een gelijkwaardigheidsverklaring of een uittreksel daarvan,
      als bedoeld in artikel 2 van [Verordening (EEG) nr. 3076/78](31978R3076), hetzij een verklaring als bedoeld in
      artikel 4 van die verordening.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel57
  - number: 57.b
    text: |-
      voor wat betreft andere produkten van post ex 1210 van de gecombineerde nomenclatuur dan onder a, genoemd,
      alsmede voor wat betreft plantesappen en plantenextracten van hop van post 1302 1300 van de gecombineerde
      nomenclatuur slechts indien en voor zover bij het doen van de aangifte ten invoer wordt overgelegd een
      gelijkwaardigheidsverklaring of een uittreksel daarvan, als bedoeld in artikel 2 van [Verordening (EEG) nr.
      3076/78](31978R3076). De onder a, laatstgenoemde verklaring wordt afgegeven door het produktschap. De verklaring
      wordt eerst afgegeven nadat uit een monsteronderzoek is gebleken, dat de onder a, genoemde produkten voldoen aan
      de bij en krachtens artikel 2 van [Verordening (EEG) nr. 1696/71](31971R1696) vastgestelde milieukwaliteitseisen.
      Het monsteronderzoek geschiedt door het Rijkskwaliteitsinstituut voor Landen Tuinbouwprodukten te Wageningen; dit
      instituut brengt de uitslag van het onderzoek ter kennis van het produktschap.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel57
  - number: '59.1'
    text: |-
      Van het verbod tot invoer zonder vergunning van de minister, bedoeld in artikel 2 van het besluit, wordt voor
      pootaardappelen van post 0701 1000 vrijstelling verleend.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel59
  - number: '59.2'
    text: |-
      Van het verbod tot uitvoer zonder vergunning van de minister, als bedoeld in artikel 3 van het besluit, wordt
      voor pootaardappelen van post 0701 1000 vrijstelling verleend indien bij uitvoer voldaan wordt aan de voorwaarde
      dat de betrokken partij is voorzien van een door de Stichting Nederlandse Algemene Keuringsdienst voor zaaizaad
      en pootgoed van landbouwgewassen (Stichting N.A.K.) afgegeven etiket of een ander door deze Stichting afgegeven
      bewijsstuk, dan wel van een etiket, als bedoeld in artikel 10 van de [Richtlijn 66/403](31966L0403) van de Raad
      (Pb. EG L 125) betreffende het in de handel brengen van pootaardappelen.
    url: https://wetten.overheid.nl/BWBR0003381/2003-01-01#Artikel59
  - number: 59b.1
    text: |-
      De in [artikel 36, onderdeel a][ref1], bedoelde vrijstelling bij uitvoer geldt voor de hierna te noemen granen,
      slechts indien bij het doen van de aangifte ten uitvoer een door of namens de exporteur volledig en naar waarheid
      ingevuld en ondertekend goed leesbaar formulier L, bedoeld in [artikel 39][ref2] van de Douaneregeling, wordt
      overgelegd, houdende een van de vermeldingen als bedoeld in het tweede lid.




