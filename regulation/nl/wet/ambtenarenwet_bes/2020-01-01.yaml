  - number: '1'
    text: |-
      1 Ambtenaar in de zin van deze wet en de daarop berustende bepalingen is degene die door het bevoegde
      gezag is aan gesteld om in openbare dienst op Bonaire, Sint Eustatius of Saba werkzaam te zijn en op wie
      [artikel 3 van de Ambtenarenwet 2017][ref1] niet van toepassing is.

      2 Tot de openbare dienst behoren alle diensten en bedrijven door de staat en de openbare lichamen Bonaire, Sint
      Eustatius en Saba beheerd, met inbegrip van het van overheidswege gegeven openbare onderwijs.

      3 Zij met wie een arbeidsovereenkomst is gesloten naar burgerlijk recht zijn geen ambtenaren in de zin van deze wet
      en de daarop berustende bepalingen.

      4 In deze wet en de daarop berustende bepalingen wordt onder openbaar lichaam verstaan: openbaar lichaam Bonaire,
      Sint Eustatius of Saba.


      [ref1]: https://wetten.overheid.nl/BWBR0001947#Artikel3
    url: https://wetten.overheid.nl/BWBR0028215/2020-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001947
        artikel: '3'
  - number: '2'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt, tenzij anders is bepaald, niet onder ambtenaren verstaan:

      a. de Rijksvertegenwoordiger voor de openbare lichamen Bonaire, Sint Eustatius en Saba;

      b. krachtens de [Grondwet][ref1] of de wet voor het leven benoemde ambtenaren;

      c. de gezaghebber en de gedeputeerden;

      d. leden van het College financieel toezicht;

      e. onbezoldigde ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0028215/2020-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0001840
  - number: '3'
    text: |-
      De bepalingen van deze wet en de uit kracht daarvan gegeven voorschriften vinden slechts toepassing voor zover niet
      bij een wet of uit kracht daarvan gegeven voorschriften anders is of wordt bepaald.
    url: https://wetten.overheid.nl/BWBR0028215/2020-01-01#Artikel3
  - number: '4'
    text: |-
      Voor de toepassing van deze wet en de daarop berustende bepalingen wordt verstaan onder:

        - *Overheid:* a. de staat, indien de ambtenaar in dienst van deze rechtspersoon is aangesteld; b. het openbaar
      lichaam, indien de ambtenaar in dienst van deze rechtspersoon is aangesteld.
        - *Bevoegd gezag:* a. Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties, voor wat betreft de ambtenaren
      in dienst van de staat, niet zijnde personeel van het Bureau van de Rijksvertegenwoordiger voor de openbare
      lichamen Bonaire, Sint Eustatius en Saba; b. het bestuurscollege, voor wat betreft de ambtenaren in dienst van
      het openbare lichaam met inachtneming van sub c; c. de eilandsraad, voor wat betreft de eilandgriffier en de op
      de griffie werkzame ambtenaren; d. de Rijksvertegenwoordiger voor de openbare lichamen Bonaire, Sint Eustatius
      en Saba, voor wat betreft het personeel van het Bureau van de Rijksvertegenwoordiger voor de openbare lichamen
      Bonaire, Sint Eustatius en Saba.
    url: https://wetten.overheid.nl/BWBR0028215/2020-01-01#Artikel4
  - number: 6A
    text: |-
      1 Voor de vervulling van een vertrouwensfunctie komt slechts in aanmerking degene die Nederlander is. Degene die
      geen Nederlander is, kan niettemin voor de vervulling van een vertrouwensfunctie in aanmerking komen wanneer het
      dienstbelang dat bepaaldelijk vordert.

      2 Aan een ambtenaar kan eervol ontslag worden verleend, indien hij op grond van [artikel 5, derde lid][ref1], of
      [artikel 10, tweede lid, van de Wet veiligheidsonderzoeken][ref2] uit een vertrouwensfunctie moet worden ontheven.

      3 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld ter zake van het bepaalde in
      dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0008277#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0008277#Artikel10
    url: https://wetten.overheid.nl/BWBR0028215/2020-01-01#Artikel6A
    references:
      - id: ref1
        bwb_id: BWBR0008277
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0008277
        artikel: '10'
  - number: '13'
    text: |-
      Aanstelling en bevordering geschieden overeenkomstig de regels, vastgesteld bij of krachtens algemene maatregel van
      bestuur, waarbij onderscheid kan worden gemaakt tussen ambtenaren in dienst van de staat en ambtenaren in dienst
      van de openbare lichamen.
    url: https://wetten.overheid.nl/BWBR0028215/2020-01-01#Artikel13
  - number: '15'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur worden regels gesteld aangaande het beoordelen van ambtenaren.

      2 Bij ministeriële regeling wordt een leidraad inzake het houden van functioneringsgesprekken vastgesteld voor de
      ambtenaren in dienst van de staat.

      3 Bij besluit van het bestuurscollege van een openbaar lichaam wordt een leidraad inzake het houden van
      functioneringsgesprekken vastgesteld voor de ambtenaren in dienst van dat openbaar lichaam.
    url: https://wetten.overheid.nl/BWBR0028215/2020-01-01#Artikel15
  - number: 15a
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld aangaande de inrichting en het
      bijhouden van een ranglijst, waarbij onderscheid kan worden gemaakt tussen ambtenaren in dienst van de staat en
      ambtenaren in dienst van de openbare lichamen.
    url: https://wetten.overheid.nl/BWBR0028215/2020-01-01#Artikel15a
  - number: '17'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent de bezoldiging van de ambtenaren,
      waarbij onderscheid kan worden gemaakt tussen ambtenaren in dienst van de staat en ambtenaren in dienst van de
      openbare lichamen.
    url: https://wetten.overheid.nl/BWBR0028215/2020-01-01#Artikel17
  - number: '41'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028215/2020-01-01#Artikel41
  - number: '42'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels vastgesteld met betrekking tot dienst- en werktijden,
      waarbij onderscheid kan worden gemaakt tussen ambtenaren in dienst van de staat en ambtenaren in dienst van de
      openbare lichamen.
    url: https://wetten.overheid.nl/BWBR0028215/2020-01-01#Artikel42
  - number: '43'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur worden voor ambtenaren regels gesteld over verlening van verlof,
      het toekennen van verlofsbezoldiging en aanspraken bij ziekte.

      2 Met inachtneming van de regels, bedoeld in het eerste lid, kunnen voor ambtenaren in dienst van een openbaar
      lichaam nadere regels worden gesteld bij eilandbesluit, houdende algemene maatregelen, over de verlening van verlof
      en het toekennen van verlofsbezoldiging.
    url: https://wetten.overheid.nl/BWBR0028215/2020-01-01#Artikel43
  - number: '46'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent de verplichte aflegging van de eed of
      belofte door de ambtenaar bij zijn aanstelling.
    url: https://wetten.overheid.nl/BWBR0028215/2020-01-01#Artikel46
  - number: '47'
    text: |-
      1 De ambtenaar is verplicht zich als een goed ambtenaar te gedragen.

      2 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot het
      verrichten van de arbeid.
    url: https://wetten.overheid.nl/BWBR0028215/2020-01-01#Artikel47
  - number: '54'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld voor ambtenaren betreffende het bekleden van
      een andere functie bij de staat of een openbaar lichaam.
    url: https://wetten.overheid.nl/BWBR0028215/2020-01-01#Artikel54
  - number: '55'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld betreffende het aanvaarden van
      nevenbetrekkingen en het verrichten van nevenwerkzaamheden, waarbij onderscheid kan worden gemaakt tussen
      ambtenaren in dienst van de staat en ambtenaren in dienst van de openbare lichamen.
    url: https://wetten.overheid.nl/BWBR0028215/2020-01-01#Artikel55
  - number: 61a
    text: |-
      1 De ambtenaar dient zich te onthouden van het openbaren van gedachten of gevoelens of van de uitoefening van
      het recht tot vereniging, tot vergadering en tot betoging, indien door de uitoefening van deze rechten de goede
      vervulling van zijn functie of de goede functionering van de openbare dienst, voor zover deze in verband staat met
      zijn functievervulling, niet in redelijkheid zou zijn verzekerd.

      2 Het eerste lid is, voor wat betreft het recht van vereniging, niet van toepassing op het lidmaatschap van:

      a. een politieke groepering, waarvan de aanduiding is ingeschreven overeenkomstig de [Kieswet][ref1] of

      b. een vakvereniging.


      [ref1]: https://wetten.overheid.nl/BWBR0004627
    url: https://wetten.overheid.nl/BWBR0028215/2020-01-01#Artikel61a
    references:
      - id: ref1
        bwb_id: BWBR0004627
  - number: 61b
    text: |-
      De ambtenaar is verplicht tijdens het verblijf op zijn werk zich te onderwerpen aan een in het belang van de dienst
      door het bevoegde gezag gelast onderzoek aan zijn lichaam of aan zijn kleding of van zijn daar aanwezige goederen.
      Het bevoegd gezag, op wiens last het onderzoek plaatsheeft, neemt de nodige maatregelen ten einde daarbij een
      onredelijke of onbehoorlijke bejegening te voorkomen.
    url: https://wetten.overheid.nl/BWBR0028215/2020-01-01#Artikel61b
  - number: '62'
    text: |-
      1 De ambtenaar is verplicht tot geheimhouding van hetgeen hem in zijn ambt is ter kennis gekomen, voor zover die
      verplichting uit de aard der zaak volgt of hem uitdrukkelijk is opgelegd.

      2 De in het vorige lid bedoelde verplichting bestaat niet tegenover hen, aan wie de ambtenaar onmiddellijk of
      middellijk ondergeschikt is, noch in zover hij door een boven hem gestelde van de verplichting tot geheimhouding
      is ontheven.

      3 De ambtenaar die opzettelijk handelt in strijd met regels, die betrekking hebben op de geheimhouding van
      inlichtingen en stukken, wordt gestraft met een gevangenisstraf van ten hoogste 6 maanden of een geldboete van de
      derde categorie.

      4 De ambtenaar aan wiens schuld het handelen in strijd met regels, die betrekking hebben op de geheimhouding
      van inlichtingen en stukken, te wijten is, wordt gestraft met een hechtenis van ten hoogste drie maanden of een
      geldboete van de tweede categorie.

      5 Geen vervolging van de ambtenaar, bedoeld in het derde en vierde lid, heeft plaats dan op klachte van hem, te
      wiens aanzien de geheimhouding is geschonden.

      6 De in het derde en vierde lid bedoelde strafbare feiten zijn misdrijven.
    url: https://wetten.overheid.nl/BWBR0028215/2020-01-01#Artikel62
  - number: '63'
    text: Het is de ambtenaar verboden misbruik te maken van hetgeen hij in zijn ambt heeft vernomen.
    url: https://wetten.overheid.nl/BWBR0028215/2020-01-01#Artikel63
  - number: '81'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld betreffende overige rechten en verplichtingen
      van ambtenaren, waarbij onderscheid kan worden gemaakt tussen ambtenaren in dienst van de staat en ambtenaren in
      dienst van de openbare lichamen.
    url: https://wetten.overheid.nl/BWBR0028215/2020-01-01#Artikel81
  - number: '82'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld betreffende disciplinaire straffen, met dien
      verstande dat een boete dan wel een inhouding of korting op de bezoldiging ten hoogste gelijk is aan het bedrag van
      het salaris van de ambtenaar over een maand.
    url: https://wetten.overheid.nl/BWBR0028215/2020-01-01#Artikel82
  - number: '87'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld betreffende schorsing en ontslag van
      ambtenaren.
    url: https://wetten.overheid.nl/BWBR0028215/2020-01-01#Artikel87
  - number: '99'
    text: Bij of krachtens algemene maatregel van bestuur worden regels gesteld inzake de toekenning van wachtgeld.
    url: https://wetten.overheid.nl/BWBR0028215/2020-01-01#Artikel99
  - number: '100'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld inzake de toekenning van een geldsom of van
      investeringsfaciliteiten aan personen die op eigen verzoek, doch gevolg gevend aan een uitnodiging van het bevoegd
      gezag tot het doen van dat verzoek, zijn ontslagen.
    url: https://wetten.overheid.nl/BWBR0028215/2020-01-01#Artikel100
  - number: '101'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld inzake de structuur van het overleg inzake
      aangelegenheden van algemeen belang betreffende de rechtstoestand van ambtenaren.
    url: https://wetten.overheid.nl/BWBR0028215/2020-01-01#Artikel101
  - number: 101 t/m 109
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028215/2020-01-01#Artikel101_tm_109
  - number: '110'
    text: |-
      1 Onder bezoldiging wordt in dit hoofdstuk verstaan het geldsbedrag, dat een ambtenaar tijdens zijn ambtsbetrekking
      ter beloning van de door hem bewezen diensten, onder welke benaming ook, geniet, na aftrek van hetgeen hem in
      mindering wordt gebracht voor verhaal van pensioenbijdragen.

      2 Onder bezoldiging is in dit hoofdstuk wachtgeld begrepen.

      3 Voor de toepassing van de bepalingen van dit hoofdstuk wordt een ter beschikking van een openbaar lichaam
      gestelde ambtenaar in dienst van de staat geacht in dienst van dat openbaar lichaam te zijn.
    url: https://wetten.overheid.nl/BWBR0028215/2020-01-01#Artikel110
  - number: '111'
    text: |-
      1 Op de door de overheid en de openbare lichamen verschuldigde bezoldigingen kan worden ingehouden, hetgeen de
      ambtenaar aan hen zelf verschuldigd is.

      2 Belastingen en retributies worden geacht ten deze tevens verschuldigd te zijn aan het lichaam, met de invordering
      belast.
    url: https://wetten.overheid.nl/BWBR0028215/2020-01-01#Artikel111
  - number: '112'
    text: Ten aanzien van een op een bezoldiging gelegd beslag, gelden de bepalingen van het gemene recht.
    url: https://wetten.overheid.nl/BWBR0028215/2020-01-01#Artikel112
  - number: '113'
    text: |-
      1 De overheid kan op de door haar verschuldigde bezoldigingen ten behoeve van schuldeisers van de ambtenaar
      kortingen toepassen voor vorderingen mits deze door de ambtenaar, naar aanleiding van het verzoek om de korting toe
      te passen, schriftelijk worden erkend.

      2 Als door de ambtenaar erkend gelden mede de vorderingen, waarvan het bestaan blijkt uit een in kracht van
      gewijsde gegane rechterlijke uitspraak of van een authentieke akte in executoriale vorm.
    url: https://wetten.overheid.nl/BWBR0028215/2020-01-01#Artikel113
  - number: '114'
    text: |-
      1 Bezoldigingen zijn voor inhouden, beslag of korting vatbaar voor één derde gedeelte.

      2 Deze beperking geldt evenwel niet ten aanzien van inhouding, beslag of korting:

      a. tot verhaal van onderhoudsgelden waarvan de verplichting tot betaling bij rechterlijke uitspraak is opgelegd;

      b. terzake van een disciplinaire strafoplegging;

      c. tot verhaal van een boete door de strafrechter of een bijzonder gerecht opgelegd;

      d. tot verhaal van vergoeding van schade, door de ambtenaar in verband met de uitoefening van de dienst aan de
      overheid toegebracht door onrechtmatige handelingen of door het nalaten van de zorg waartoe hij gehouden is.

      3 Bezoldigingen zijn tot de helft vatbaar voor inhouding, beslag en korting, tot verhaal van hetgeen op de
      bezoldiging is vooruitbetaald, voorgeschoten of te veel betaald.
    url: https://wetten.overheid.nl/BWBR0028215/2020-01-01#Artikel114
  - number: '115'
    text: |-
      1 In geval van faillissement van de ambtenaar wordt het gedeelte van de bezoldiging, hetwelk ingevolge beschikking
      van de rechter-commissaris niet aan de gefailleerde behoeft te worden uitgekeerd, gekort ten behoeve van de
      curator, voor zover daarop geen inhouding heeft plaats gehad.

      2 Faillissement van de ambtenaar en hem verleende surséance van betaling sluiten overigens korting uit.
    url: https://wetten.overheid.nl/BWBR0028215/2020-01-01#Artikel115
  - number: '116'
    text: |-
      In geval van samenloop van inhouding, beslag en korting, zal, ongeacht in welke tijdsorde zij plaats hebben, het
      vatbare gedeelte van de bezoldiging eerst worden ingehouden; van het overblijvende zal ten hoogste één vierde
      geacht worden beslagen te zijn en van het alsdan overblijvende zal ten hoogste één vierde kunnen worden gekort.
    url: https://wetten.overheid.nl/BWBR0028215/2020-01-01#Artikel116
  - number: '117'
    text: |-
      1 Indien een ingehouden, in beslag genomen of gekort bedrag tussen meer dan een schuldeiser moet worden verdeeld,
      geschiedt de verdeling naar evenredigheid der vorderingen, voorzover niet de ene schuldeiser voorrang heeft boven
      de andere.

      2 Indien naast vorderingen, voor welke de beperkingen van [artikel 114, eerste lid][ref1] niet gelden, ook andere
      in de verdeling moeten worden begrepen, wordt eerst het in artikel 114, eerste lid, bepaalde deel van dit bedrag
      onder alle schuldeisers zonder onderscheid verdeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0028215#Artikel114
    url: https://wetten.overheid.nl/BWBR0028215/2020-01-01#Artikel117
    references:
      - id: ref1
        bwb_id: BWBR0028215
        artikel: '114'
        hoofdstuk: IV
        paragraaf: '5'
  - number: '118'
    text: |-
      1 Overdracht of inpandgeving, waardoor de ambtenaar enig recht op bezoldiging aan een derde toekent, is slechts
      geldig, indien zij geschiedt met goedkeuring van de overheid, die hem de bezoldiging toegekend heeft.

      2 Zij is slechts geldig tot ten hoogste één derde gedeelte van de bezoldiging.

      3 Zij kan slechts geschieden bij hetzij authentieke akte, hetzij onderhandse in tweevoud opgemaakte akte, mits
      deze laatste geregistreerd is en geheel geschreven is met de hand van de ambtenaar die zelve ondertekend heeft of
      daaronder door deze geschreven is een goedkeuring, houdende voluitgeschreven in letters het overgedragen of in pand
      gegeven bedrag of gedeelte van zijn bezoldiging.

      4 Een afschrift van de authentieke akte dan wel een der dubbelen van de onderhandse akte moet bij de in het eerste
      lid bedoelde overheid worden ingeleverd.
    url: https://wetten.overheid.nl/BWBR0028215/2020-01-01#Artikel118
  - number: 118a
    text: |-
      Tenzij in bijzondere wetgeving anders is bepaald, verjaren rechtsvorderingen ter zake van bezoldiging, pensioenen
      en andere geldelijke aanspraken, verschuldigd krachtens een rechtsverhouding waarop dit hoofdstuk van toepassing of
      van overeenkomstige toepassing is, door verloop van vijf jaren na de aanvang van de dag, volgend op die waarop de
      vordering opeisbaar is geworden. De [artikelen 316 tot en met 323 van Boek 3 van het Burgerlijk Wetboek BES][ref1]
      zijn van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028745#Artikel316
    url: https://wetten.overheid.nl/BWBR0028215/2020-01-01#Artikel118a
    references:
      - id: ref1
        bwb_id: BWBR0028745
        artikel: '316'
  - number: 120a
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld betreffende opleidingen en
      opleidingseisen, waarbij onderscheid kan worden gemaakt tussen ambtenaren in dienst van de staat en ambtenaren in
      dienst van de openbare lichamen.
    url: https://wetten.overheid.nl/BWBR0028215/2020-01-01#Artikel120a
  - number: 124b
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot voor het tijdstip van inwerkingtreding van
      __REF000___________________________________________________________________________________________________________
      _____ door ambtenaren in hun hoedanigheid van ambtenaar in de zin van de Landsverordening Materieel
      Ambtenarenrecht opgebouwde of verworven rechten en aanspraken.


      [ref1]: https://wetten.overheid.nl/BWBR0028249#ArtikelI
    url: https://wetten.overheid.nl/BWBR0028215/2020-01-01#Artikel124b
    references:
      - id: ref1
        bwb_id: BWBR0028249
        artikel: I
