  - number: 120a.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de competentiegerichte eindtermen voor
      het onderwijs van ambtenaren van politie op de kwalificatieniveaus:
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel120a
  - number: 120a.1.a
    text: VSBO/MBO;
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel120a
  - number: 120a.1.b
    text: HBO, en
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel120a
  - number: 120a.1.c
    text: WO.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel120a
  - number: 120a.2
    text: |-
      Met inachtneming van de regels, bedoeld in het eerste lid, worden bij of krachtens algemene maatregel van bestuur
      regels gesteld over de opleidingen voor ambtenaren van politie, gericht op de voorbereiding van de uitoefening
      van algemene politietaken, alsmede over opleidingen voor ambtenaren van politie of andere door Onze Minister in
      overeenstemming met Onze Minister van Justitie aan te wijzen categorieën van personen, gericht op de voorbereiding
      van de uitoefening van specialistische en leidinggevende politietaken, alsmede over de instantie die in ieder geval
      wordt belast met het ontwikkelen en de verzorging van deze opleidingen en het examineren van de studenten die deze
      opleidingen hebben gevolgd.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel120a
  - number: '121'
    text: |-
      Deze landsverordening treedt in werking op een bij landsbesluit te bepalen tijdstip, dat voor de onderscheiden
      artikelen of onderdelen daarvan verschillend kan zijn.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel121
  - number: '122.1'
    text: |-
      Alle op het tijdstip van inwerkingtreding van deze landsverordening bestaande besluiten en beschikkingen houdende
      algemeen verbindende voorschriften in de zin van artikel 35, lid 1 van de Regeling Ambtenarenrechtspraak 1951
      (P.B. 1951, no. 134) blijven, voor zover zij of daarin voorkomende bepalingen niet in strijd zijn met deze
      landsverordening, van kracht totdat zij overeenkomstig de voorschriften van deze landsverordening zijn vervangen.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel122
  - number: '122.2'
    text: |-
      De op het tijdstip van inwerkingtreding van deze landsverordening bestaande toestemmingen en vergunningen aan
      ambtenaren en verleende kortingen blijven gehandhaafd totdat zij ingetrokken worden door de autoriteit, die
      ingevolge deze landsverordening en de uit kracht daarvan gegeven voorschriften zodanige toestemmingen, vergunningen
      of kortingen kan verlenen.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel122
  - number: '122.3'
    text: 'Op het tijdstip van inwerkingtreding van deze landsverordening vervallen:'
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel122
  - number: 122.3.a
    text: de Beschikking Richtlijnen Ambtenaren 1948 (P.B. 1948, no. 63);
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel122
  - number: 122.3.b
    text: |-
      de Beschikking van de 16de januari 1951 no. 2756 (P.B. 1951, no. 18) ter uitvoering van de artikelen 30, leden 1 en
      2 en 31, lid 2 van de Beschikking Richtlijnen Ambtenaren 1948 (P.B. 1948, no. 63);
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel122
  - number: 122.3.c
    text: |-
      de Beschikking van de 4de oktober 1946 no. 870, betreffende georganiseerd overleg in ambtenarenzaken (P.B. 1946,
      no. 149);
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel122
  - number: 122.3.d
    text: |-
      het Koninklijk Besluit van 29 juli 1911 no. 43, waarbij een regeling is vastgesteld nopens de korting op de van
      landswege genoten wordende inkomsten van koloniale landsdienaren of gewezen koloniale landsdienaren ten behoeve van
      hun echtgenote of gescheiden echtgenote en hun kinderen (P.B. 1911, no. 43);
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel122
  - number: 122.3.e
    text: artikel 5a van de Overgangsregeling Rechtspositie Personeel (P.B. 1953, no. 12);
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel122
  - number: 122.3.f
    text: het Tuchtreglement politie en gevangenispersoneel (P.B. 1959, no. 95).
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel122
  - number: '122.4'
    text: |-
      Op gedragingen als bedoeld in [artikel 82][ref1], gepleegd vóór de dag van inwerkingtreding van deze
      landsverordening blijven van toepassing de algemeen verbindende voorschriften, welke ten tijde van die gedragingen
      golden.


      [ref1]: https://wetten.overheid.nl/BWBR0028215#Artikel82
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel122
    references:
      - id: ref1
        bwb_id: BWBR0028215
        artikel: '82'
        hoofdstuk: VIII
  - number: '123'
    text: |-
      De ambtenaren die op het tijdstip van inwerkingtreding van dit artikel in vaste niet pensioengerechtigde dienst
      zijn benoemd, worden, tenzij bedoelde benoeming heeft plaats gevonden wegens het niet voldoen aan de in de
      Pensioenverordening Burgerlijke Landsdienaren 1938 (P.B. 1949, no. 125) voor een benoeming in vaste dienst gestelde
      eisen, binnen een jaar na vorengenoemd tijdstip, als ambtenaar in de zin van gemelde Pensioenverordening benoemd,
      mits zij alsdan voldoen aan de voor een benoeming in vaste dienst in de zin van meergemelde pensioenverordening
      gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel123
  - number: '124'
    text: |-
      De omvang van de werking van het Koninklijk Besluit van 2 augustus 1915 no. 74, houdende verbod van beslaglegging
      onder publieke administratiën en van kortingen op traktementen en pensioenen in de kolonie Curaçao (P.B. 1915, no.
      57) en van artikel 48 van de Pensioenverordening Burgerlijke Landsdienaren 1938 (P.B. 1949, no. 125) wordt slechts
      in zoverre beperkt als noodzakelijk is voor de uitvoering van de voorschriften nopens inhouding, beslag en korting
      als bedoeld in hoofdstuk XI van deze landsverordening.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel124
  - number: 124a.1
    text: |-
      De [artikelen 18][ref1], [20][ref2], [25][ref3] en [75][ref4] van deze wet blijven op de door de Koning benoemde
      ambtenaren van toepassing zoals zij luidden voordat de wet van de 23ste december 1997 (P.B. 1997, 310), waarbij
      deze artikelen gewijzigd of vervallen verklaard zijn, in werking was getreden.


      [ref1]: https://wetten.overheid.nl/BWBR0028215#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0028215#Artikel20
      [ref3]: https://wetten.overheid.nl/BWBR0028215#Artikel25
      [ref4]: https://wetten.overheid.nl/BWBR0028215#Artikel75
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel124a
