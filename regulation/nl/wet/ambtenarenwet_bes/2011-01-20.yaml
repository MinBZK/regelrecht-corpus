  - number: 124a.2
    text: |-
      Onverminderd het bepaalde in [artikel 120][ref1] blijven de [artikelen 21][ref2], [22][ref3] en [23][ref4] van deze
      wet op de in het voorgaande lid bedoelde ambtenaren tevens van toepassing in de vorm die zij hadden, voordat zij
      bij de genoemde wet gewijzigd of vervallen verklaard werden.


      [ref1]: https://wetten.overheid.nl/BWBR0028215#Artikel120
      [ref2]: https://wetten.overheid.nl/BWBR0028215#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0028215#Artikel22
      [ref4]: https://wetten.overheid.nl/BWBR0028215#Artikel23
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel124a
