        paragraaf: '1'
  - number: 124a.3
    text: |-
      Op deze ambtenaren blijft eveneens het bij de genoemde wet vervallen verklaarde [artikel 24][ref1] van toepassing,
      met dien verstande dat in de beschikking waarbij de bezoldiging wordt toegekend tevens het tijdstip wordt vermeld
      waarop de eerste periodieke verhoging zal ingaan.


      [ref1]: https://wetten.overheid.nl/BWBR0028215#Artikel24
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel124a
    references:
      - id: ref1
