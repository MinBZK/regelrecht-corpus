$id: ambtenarenwet_bes
regulatory_layer: WET
publication_date: '2019-05-16'
valid_from: '2011-01-20'
bwb_id: BWBR0028215
url: https://wetten.overheid.nl/BWBR0028215/2011-01-20
articles:
  - number: '1.1'
    text: |-
      Ambtenaar in de zin van deze wet en de daarop berustende bepalingen is degene die door het bevoegde gezag is aan
      gesteld om in openbare dienst op Bonaire, Sint Eustatius of Saba werkzaam te zijn en niet is aangesteld op grond
      van de [Ambtenarenwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001947
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001947
  - number: '1.2'
    text: |-
      Tot de openbare dienst behoren alle diensten en bedrijven door de staat en de openbare lichamen Bonaire, Sint
      Eustatius en Saba beheerd, met inbegrip van het van overheidswege gegeven openbare onderwijs.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel1
  - number: '1.3'
    text: 'Niet zijn ambtenaren in de zin van deze wet en de uit kracht daarvan gegeven voorschriften:'
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel1
  - number: 1.3.a
    text: zij met wie een arbeidsovereenkomst naar burgerlijk recht is gesloten;
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel1
  - number: 1.3.b
    text: de werklieden.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel1
  - number: '1.4'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt onder openbaar lichaam verstaan: openbaar lichaam Bonaire,
      Sint Eustatius of Saba.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel1
  - number: '2.1'
    text: 'In deze wet en de daarop berustende bepalingen wordt, tenzij anders is bepaald, niet onder ambtenaren verstaan:'
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel2
  - number: 2.1.a
    text: de Rijksvertegenwoordiger voor de openbare lichamen Bonaire, Sint Eustatius en Saba;
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel2
  - number: 2.1.b
    text: |-
      krachtens de [Grondwet][ref1] of de wet voor het leven benoemde ambtenaren;


      [ref1]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0001840
  - number: 2.1.c
    text: de gezaghebber en de gedeputeerden;
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel2
  - number: 2.1.d
    text: leden van het College financieel toezicht;
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel2
  - number: 2.1.e
    text: onbezoldigde ambtenaren.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel2
  - number: '2.2'
    text: |-
      De [hoofdstukken IV][ref1], [V][ref2] en [VI][ref3] zijn niet van toepassing op ambtenaren die niet regelmatig
      dienst doen. Ten aanzien van deze ambtenaren kunnen onderwerpen welke in de genoemde hoofdstukken geregeld zijn,
      naarmate zulks met betrekking tot elke dienst of elk bedrijf waarin zij te werk zijn gesteld noodzakelijk blijkt,
      worden geregeld: bij algemene maatregel van bestuur, indien het de openbare dienst van de staat betreft, en bij
      eilandsbesluit, houdende algemene maatregelen, indien het de openbare dienst van een openbaar lichaam betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0028215#HoofdstukIV
      [ref2]: https://wetten.overheid.nl/BWBR0028215#HoofdstukV
      [ref3]: https://wetten.overheid.nl/BWBR0028215#HoofdstukVI
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0028215
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0028215
        hoofdstuk: V
      - id: ref3
        bwb_id: BWBR0028215
        hoofdstuk: VI
  - number: '3'
    text: |-
      De bepalingen van deze wet en de uit kracht daarvan gegeven voorschriften vinden slechts toepassing voor zover niet
      bij een wet of uit kracht daarvan gegeven voorschriften anders is of wordt bepaald.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel3
  - number: '4'
    text: |-
      Voor de toepassing van deze wet en de daarop berustende bepalingen wordt verstaan onder: - *Overheid:* a. de staat,
      indien de ambtenaar in dienst van deze rechtspersoon is aangesteld; b. het openbaar lichaam, indien de ambtenaar in
      dienst van deze rechtspersoon is aangesteld.
        - *Bevoegd gezag:* a. Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties, voor wat betreft de ambtenaren
      in dienst van de staat, niet zijnde personeel van het Bureau van de Rijksvertegenwoordiger voor de openbare
      lichamen Bonaire, Sint Eustatius en Saba; b. het bestuurscollege, voor wat betreft de ambtenaren in dienst van
      het openbare lichaam met inachtneming van sub c; c. de eilandsraad, voor wat betreft de eilandgriffier en de op
      de griffie werkzame ambtenaren; d. de Rijksvertegenwoordiger voor de openbare lichamen Bonaire, Sint Eustatius
      en Saba, voor wat betreft het personeel van het Bureau van de Rijksvertegenwoordiger voor de openbare lichamen
      Bonaire, Sint Eustatius en Saba.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel4
  - number: '5.1'
    text: Aanstelling geschiedt in vaste of in tijdelijke dienst.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel5
  - number: '5.2'
    text: Aan de aanstelling in vaste dienst gaat in de regel vooraf een aanstelling in tijdelijke dienst.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel5
  - number: '5.3'
    text: 'Aanstelling in tijdelijke dienst kan slecht plaats hebben:'
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel5
  - number: 5.3.a
    text: |-
      indien mag worden aangenomen, dat de werkzaamheden, waarmede de ambtenaar zal worden belast, van aflopende aard
      zijn. Wanneer werkzaamheden als in de vorige volzin bedoeld elkaar in een aaneensluitende reeks opvolgen, wordt
      de aanstelling in tijdelijke dienst van de ambtenaar, die met die werkzaamheden is belast, na vijf jaren door een
      aanstelling in vaste dienst vervangen, indien mag worden aangenomen, dat deze werkzaamheden ten minste nog vijf
      jaren zullen voortduren. De aanstelling in tijdelijke dienst wordt in elk geval na tien jaren dienst als zodanig
      door een aanstelling in vaste dienst vervangen;
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel5
  - number: 5.3.b
    text: indien een wijziging van de taak van de betrokken dienst is voorgenomen;
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel5
  - number: 5.3.c
    text: van personen, in dienst genomen ter vervanging van tijdelijk afwezig personeel;
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel5
  - number: 5.3.d
    text: van personen in opleiding;
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel5
  - number: 5.3.e
    text: |-
      van personen als bedoeld in [artikel 2, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0028215#Artikel2
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0028215
        artikel: '2'
        hoofdstuk: I
  - number: 5.3.f
    text: |-
      voor een proeftijd van niet langer dan één jaar, ten hoogste met nog één jaar te verlengen. In bijzondere gevallen
      kan op verzoek van de ambtenaar de proeftijd na twee jaren nog uiterlijk met één jaar worden verlengd;
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel5
  - number: 5.3.g
    text: |-
      van personen, met wie voor de aanstelling overeengekomen is dat zij voor een bepaaldelijk aangeduide tijd in dienst
      treden.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel5
  - number: '5.4'
    text: Een aanstelling in tijdelijke dienst als bedoeld in het derde lid onder b, c en d duurt niet langer dan vijf jaren.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel5
  - number: '5.5'
    text: |-
      De aanstelling van de ambtenaren kan geschieden onder de voorwaarde, dat ontslag zal worden verleend, indien niet
      binnen een daarvoor te stellen termijn een bepaald diploma of bepaalde diploma's zijn behaald.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel5
  - number: '6.1'
    text: |-
      Voor aanstelling tot ambtenaar kan, met inachtneming van de voor de bekleding van het ambt vast te stellen
      bepalingen, slechts in aanmerking komen hij die:
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel6
  - number: 6.1.a
    text: |-
      van goed zedelijk gedrag is, hetgeen dient te blijken uit een verklaring, afgegeven door de daartoe bevoegde
      instantie;
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel6
  - number: 6.1.b
    text: |-
      Nederlander is, tenzij bij wet dan wel bij eilandsverordening voor de benoeming in een bepaald ambt is afgeweken
      van het voorschrift dat geen vreemdeling benoembaar is;
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel6
  - number: 6.1.c
    text: |-
      op grond van de uitslag van een geneeskundig onderzoek, ingesteld door een of meer door het bevoegde gezag
      aangewezen geneeskundigen, geschikt is verklaard voor de vervulling van het ambt.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel6
  - number: '6.2'
    text: |-
      Een geneeskundig onderzoek behoeft in spoedeisende gevallen niet vooraf te worden ingesteld, indien de ambtenaar
      in tijdelijke dienst wordt aangesteld en zijn dienst, naar mag worden aangenomen, niet langer dan zes maanden zal
      duren.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel6
  - number: 6A.1
    text: |-
      Voor de vervulling van een vertrouwensfunctie komt slechts in aanmerking degene die Nederlander is. Degene die
      geen Nederlander is, kan niettemin voor de vervulling van een vertrouwensfunctie in aanmerking komen wanneer het
      dienstbelang dat bepaaldelijk vordert.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel6A
  - number: 6A.2
    text: |-
      Aan een ambtenaar kan eervol ontslag worden verleend, indien hij op grond van [artikel 5, derde lid][ref1], of
      [artikel 10, tweede lid, van de Wet veiligheidsonderzoeken][ref2] uit een vertrouwensfunctie moet worden ontheven.


      [ref1]: https://wetten.overheid.nl/BWBR0008277#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0008277#Artikel10
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel6A
    references:
      - id: ref1
        bwb_id: BWBR0008277
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0008277
        artikel: '10'
  - number: 6A.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld ter zake van het bepaalde in
      dit artikel.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel6A
  - number: '7.1'
    text: |-
      De uitslag van het geneeskundig onderzoek als bedoeld in het [vorige artikel][ref1] wordt aan de belanghebbende zo
      spoedig mogelijk medegedeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0028215#Artikel6
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0028215
        artikel: '6'
        hoofdstuk: II
  - number: '7.2'
    text: |-
      De kosten van het geneeskundig onderzoek alsmede de eventuele reis- en verblijfkosten terzake van dit onderzoek van
      belanghebbende komen ten laste van de overheid.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel7
  - number: '7.3'
    text: |-
      De belanghebbende kan tegen de uitslag van het geneeskundig onderzoek in lid 1 bedoeld in beroep komen volgens door
      het bevoegd gezag te stellen regelen.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel7
  - number: '8'
    text: |-
      In bijzondere gevallen kan hij, die bij het geneeskundig onderzoek niet geschikt bevonden is, desniettemin in het
      belang van de dienst tot ambtenaar in tijdelijke dienst worden aangesteld, mits de geneeskundige(n) als bedoeld
      in [artikel 6][ref1] verklaart (verklaren), dat tegen een aanstelling in tijdelijke dienst uit medisch oogpunt
      geen bezwaar bestaat. Aan de betrokkene wordt, alvorens hij wordt aangesteld, mededeling gedaan van de inhoud en
      strekking van artikel 6, eerste lid, van de Pensioenwet ambtenaren BES.


      [ref1]: https://wetten.overheid.nl/BWBR0028215#Artikel6
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0028215
        artikel: '6'
        hoofdstuk: II
  - number: '9.1'
    text: |-
      Bij overgang naar een ander ambt wordt een ambtenaar niet opnieuw gekeurd, tenzij voor dat ambt keuringseisen
      zijn vastgesteld of redelijkerwijze kunnen geacht worden te gelden, zwaarder dan die, welke zijn vastgesteld of
      redelijkerwijze geacht kunnen worden te gelden voor het ambt, dat hij tevoren bekleed heeft.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel9
  - number: '9.2'
    text: |-
      In het geval als bedoeld in het vorige lid vindt het bepaalde in de [artikelen 7][ref1] en [8][ref2]
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028215#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0028215#Artikel8
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0028215
        artikel: '7'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0028215
        artikel: '8'
        hoofdstuk: II
  - number: '10'
    text: |-
      De ambtenaar is, in geval van ziekte en wanneer het bevoegde gezag zulks in verband met zijn gezondheidstoestand
      nodig acht, verplicht zich te onderwerpen aan een onderzoek van een of meer geneeskundigen, daartoe door het
      bevoegde gezag aan te wijzen.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel10
  - number: '11.1'
    text: |-
      De ambtenaar ontvangt zo spoedig mogelijk een schriftelijke aanstelling, welke het ambt alsmede zijn naam,
      voornamen en geboortedatum vermeldt.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel11
  - number: '11.2'
    text: 'De aanstelling vermeldt voorts:'
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel11
  - number: 11.2.a
    text: |-
      of de ambtenaar in vaste of tijdelijke dienst wordt aangesteld. In het laatstbedoelde geval wordt tevens vermeld of
      de aanstelling voor een bepaalde tijd, voor een proeftijd, dan wel voor onbepaalde tijd geschiedt;
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel11
  - number: 11.2.b
    text: zo mogelijk de dag van ingang van de aanstelling;
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel11
  - number: 11.2.c
    text: de bezoldiging en de andere voordelen in geld, welke de ambtenaar worden toegekend;
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel11
  - number: 11.2.d
    text: |-
      in voorkomende gevallen, het feit dat artikel 6, eerste lid, van de Pensioenwet ambtenaren BES op hem van
      toepassing is alsmede de grond of gronden daarvan.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel11
  - number: '11.3'
    text: |-
      Alle wijzigingen, welke worden gebracht in de punten als in het tweede lid vermeld, worden de ambtenaar
      schriftelijk medegedeeld.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel11
  - number: '12.1'
    text: |-
      Een exemplaar van deze wet, het Besluit vakantie en vrijstelling van dienst ambtenaren BES, de Wet vergoeding
      behandelings- en verplegingskosten ambtenaren BES, het Besluit leeftijdsgrens ambtenaren BES, het Lumpsumbesluit
      ambtenaren BES, de Pensioenwet ambtenaren BES en de Wet ambtenarenrechtspraak 1951 BES en andere wettelijke
      regelingen die voor de rechtspositie van de ambtenaar van rechtstreeks belang zullen blijken te zijn, zo mogelijk
      in een overeenkomstig latere wijzigingen bijgewerkte vorm of anders onder toevoeging van de wettelijke regelingen
      waarin zulke wijzigingen zijn aangebracht, alsmede de uit kracht van een of meer van de genoemde wettelijke
      regelingen gegeven voorschriften liggen voor de ambtenaar bij de dienst waarbij hij werkzaam is op door het hoofd
      van de dienst te bepalen plaatsen en tijden ter inzage.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel12
  - number: '12.2'
    text: |-
      Het bepaalde in het voorgaande lid is van overeenkomstige toepassing met betrekking tot de onherroepelijke
      rechterlijke uitspraken in ambtenarenzaken.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel12
  - number: '13.1'
    text: |-
      Aanstelling en bevordering geschieden, voor zover daaromtrent regelen zijn vastgesteld, overeenkomstig deze
      regelen.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel13
  - number: '13.2'
    text: |-
      Ingeval ten aanzien van de aanstelling en de bevordering ontwikkelings- en andere eisen moeten worden vastgesteld,
      geschiedt zulks:
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel13
  - number: 13.2.a
    text: bij ministeriële regelingen, voor ambtenaren in dienst van de staat;
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel13
  - number: 13.2.b
    text: bij eilandsbesluit houdende algemene maatregelen, voor ambtenaren in dienst van een openbaar lichaam.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel13
  - number: '13.3'
    text: '[Vervallen.]'
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel13
  - number: '14.1'
    text: De ambtenaar is verplicht de Nederlandse taal te verstaan.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel14
  - number: '14.2'
    text: |-
      De ambtenaar, belast met een functie op Bonaire, dan wel op Sint Eustatius of Saba, die als zodanig geregeld met
      het publiek in aanraking komt, is verplicht de Papiamentse respectievelijk de Engelse taal te verstaan binnen een
      jaar, nadat hij met een zodanige functie wordt belast.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel14
  - number: '14.3'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel14
  - number: '14.4'
    text: |-
      Het bevoegd gezag bepaalt zo nodig of de ambtenaar is een ambtenaar als bedoeld in het tweede lid. Het bevoegd
      gezag kan de in dat lid genoemde verplichting ook aan andere categorieën van ambtenaren opleggen.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel14
  - number: '15.1'
    text: |-
      Aan de wijze waarop de ambtenaar zijn functie vervult wordt door of namens het bevoegde gezag geregeld aandacht
      besteed door functioneringsgesprekken met hem te houden en beoordelingen van zijn functioneren op te maken.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel15
  - number: '15.2'
    text: |-
      Een beoordeling wordt in elk geval opgemaakt, wanneer degene die door het bevoegde gezag als beoordelingsautoriteit
      is aangewezen dit wenselijk acht of de betrokken ambtenaar hierom op redelijke gronden verzoekt.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel15
  - number: '15.3'
    text: |-
      Alvorens een beoordeling wordt vastgesteld, wordt deze met de betrokken ambtenaar besproken; hem wordt de
      gelegenheid geboden zijn mening erover kenbaar te maken.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel15
  - number: '15.4'
    text: |-
      Het bevoegde gezag stelt nadere regels vast aangaande het beoordelen van ambtenaren. Deze regels worden
      vastgesteld:
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel15
  - number: 15.4.a
    text: bij algemene maatregel van bestuur, voor zover het de ambtenaren in dienst van de staat betreft, en
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel15
  - number: 15.4.b
    text: |-
      bij eilandsbesluit, houdende algemene maatregelen, voor zover het de ambtenaren in dienst van een openbaar lichaam
      betreft.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel15
  - number: '15.5'
    text: |-
      Indien ten aanzien van ambtenaren die bij een bepaald dienstvak zijn te werk gesteld of die tot een bepaalde groep
      van ambtenaren behoren voorschriften worden vereist welke afwijken van de in het voorgaande lid bedoelde regels
      of strekken ter aanvulling of uitwerking van die regels, worden deze voorschriften bij ministeriële regeling,
      onderscheidenlijk eilands-besluit, houdende algemene maatregelen vastgesteld.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel15
  - number: '15.6'
    text: 'Een leidraad inzake het houden van functioneringsgesprekken wordt opgesteld:'
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel15
  - number: 15.6.a
    text: bij ministeriële regeling, voor zover het betreft de ambtenaren in dienst van de staat, en
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel15
  - number: 15.6.b
    text: |-
      bij besluit van het Bestuurscollege van een openbaar lichaam, voor zover het betreft de ambtenaren in dienst van
      dat openbaar lichaam.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel15
  - number: 15a.1
    text: |-
      Het bevoegde gezag kan regels vaststellen aangaande de inrichting en het bijhouden van een ranglijst. Voor zover
      het de ambtenaren in dienst van de staat en van de openbare lichamen betreft, worden deze regels vastgesteld
      bij een wettelijk voorschrift als bedoeld in het [vierde lid van het voorgaande artikel][ref1], naar de in dat
      artikellid bedoelde onderscheidingen.


      [ref1]: https://wetten.overheid.nl/BWBR0028215#Artikel15
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0028215
        artikel: '15'
        hoofdstuk: III
  - number: 15a.2
    text: |-
      Bij de vaststelling van regels als bedoeld in het eerste lid wordt bepaald dat diensttijd, in een gelijkwaardige
      rang in dienst van de staat of van een openbaar lichaam doorgebracht en zonder onderbreking voorafgaande aan de
      betrekking in verband waarmede de ranglijst wordt opgemaakt, volledig meetelt voor het bepalen van de plaats van de
      betrokken ambtenaar op die ranglijst.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel15a
  - number: '16.1'
    text: |-
      De beoordeling, bedoeld in [artikel 15][ref1], de aantekening met betrekking tot een ambtenaar in de
      ranglijst, bedoeld in artikel 15a, aangebracht, en de weigering om een beoordeling te doen plaatsvinden of een
      aantekening in de ranglijst aan te brengen zijn beschikkingen als bedoeld in artikel 3, eerste lid, van de Wet
      ambtenarenrechtspraak 1951 BES.


      [ref1]: https://wetten.overheid.nl/BWBR0028215#Artikel15
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0028215
        artikel: '15'
        hoofdstuk: III
  - number: '16.2'
    text: |-
      In de wettelijke voorschriften, bedoeld in de [artikelen 15][ref1] en [15a][ref2], wordt in elk geval de
      mogelijkheid geopend van een administratief beroep tegen een beoordeling, een aantekening in de ranglijst of een
      weigering om een beoordeling te doen plaatsvinden of een aantekening aan te brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0028215#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0028215#Artikel15a
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0028215
        artikel: '15'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0028215
        artikel: 15a
        hoofdstuk: III
  - number: '16.3'
    text: |-
      Eveneens wordt de mogelijkheid van administratief beroep geopend tegen beschikkingen met betrekking tot verhogingen
      van een bezoldiging, toekenning van een toelage of beloning, en de weigering om een verhoging, een toelage of
      een beloning toe te kennen, voor zover de daartoe strekkende beschikkingen mede of uitsluitend op grond van een
      beoordeling als bedoeld in [artikel 15][ref1] zijn tot stand gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0028215#Artikel15
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0028215
        artikel: '15'
        hoofdstuk: III
  - number: '16.4'
    text: Op het administratief beroep wordt beslist door het bevoegde gezag.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel16
  - number: '17'
    text: |-
      Voor zover niet bij of krachtens de wet afwijkende voorschriften worden gegeven, geschiedt de bezoldiging van de
      ambtenaren overeenkomstig regels, vastgesteld:
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel17
  - number: 17.a
    text: bij of krachtens algemene maatregel van bestuur voor ambtenaren in dienst van de staat, en
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel17
  - number: 17.b
    text: bij eilandsbesluit, houdende algemene maatregelen voor ambtenaren in dienst van een openbaar lichaam.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel17
  - number: '18'
    text: |-
      Indien de bezoldiging geschiedt overeenkomstig een schaal die verschillende, naar de hoogte van de bedragen
      opstijgende bezoldigingstreden vertoont, kunnen de regels, bedoeld in het [voorgaande artikel][ref1], bepalen dat
      de toekenning van verhogingen van de bezoldiging mede of uitsluitend afhankelijk wordt gemaakt van de inhoud van
      een beoordeling als bedoeld in [artikel 15][ref2] en hieromtrent nadere voorschriften bevatten.


      [ref1]: https://wetten.overheid.nl/BWBR0028215#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0028215#Artikel15
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0028215
        artikel: '17'
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0028215
        artikel: '15'
        hoofdstuk: III
  - number: '19.1'
    text: |-
      Aan de gewone bezoldiging welke voor een ambtenaar geldt kunnen behalve de toelagen en vergoedingen, bedoeld in de
      [artikelen 26, tweede en derde lid][ref1], en [27, vijfde lid][ref2], ook bijzondere individuele vergoedingen en
      verhogingen of persoonlijke toelagen met een periodiek karakter worden verbonden. De gronden waarop een zodanige
      verhoging of toelage kunnen worden toegekend worden in de regels, bedoeld in het [eerste lid van artikel 17][ref3],
      bepaald; [artikel 18][ref4] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028215#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0028215#Artikel27
      [ref3]: https://wetten.overheid.nl/BWBR0028215#Artikel17
      [ref4]: https://wetten.overheid.nl/BWBR0028215#Artikel18
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0028215
        artikel: '26'
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0028215
        artikel: '27'
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0028215
        artikel: '17'
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0028215
        artikel: '18'
        hoofdstuk: IV
        paragraaf: '1'
  - number: '20.1'
    text: |-
      De laagste bezoldiging die ingevolge enige voor ambtenaren in dienst van de staat geldende regeling kan worden
      vastgesteld, is niet lager dan het in overeenkomstige gevallen en voor een overeenkomstig tijdvak van in
      loondienst verrichte arbeid krachtens de Wet minimumlonen BES voor enig openbaar lichaam vastgesteld bedrag van
      het minimumloon.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel20
  - number: '21'
    text: |-
      De bezoldiging van een ambtenaar voor wie de geldende werktijd korter is dan de voor zijn functie geldende
      gebruikelijke volledige werktijd, is gelijk aan de bezoldiging die hij in die functie zou hebben genoten,
      indien de voor hem geldende werktijd gelijk zou zijn aan de voor zijn functie gebruikelijke volledige werktijd,
      vermenigvuldigd met een breuk waarvan de teller bestaat uit de voor die ambtenaar geldende werktijd en de noemer
      uit de voor zijn functie geldende gebruikelijke volledige werktijd.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel21
  - number: '22'
    text: |-
      In het geval, bedoeld in het [voorgaande artikel][ref1], geldt voor de toepassing van de [artikelen 18][ref2],
      [19][ref3], [20][ref4] en [26, tweede en vierde lid][ref5], als bezoldiging voor die ambtenaar de bezoldiging
      die hij in die functie zou hebben genoten, indien de voor hem geldende werktijd gelijk zou zijn aan de voor zijn
      functie gebruikelijke volledige werktijd.


      [ref1]: https://wetten.overheid.nl/BWBR0028215#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0028215#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0028215#Artikel19
      [ref4]: https://wetten.overheid.nl/BWBR0028215#Artikel20
      [ref5]: https://wetten.overheid.nl/BWBR0028215#Artikel26
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0028215
        artikel: '21'
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0028215
        artikel: '18'
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0028215
        artikel: '19'
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0028215
        artikel: '20'
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref5
        bwb_id: BWBR0028215
        artikel: '26'
        hoofdstuk: IV
        paragraaf: '1'
  - number: '23'
    text: |-
      De ambtenaar ontvangt over de tijd gedurende welke hij in strijd met zijn verplichtingen en opzettelijk nalaat zijn
      dienst te verrichten geen bezoldiging en aan de bezoldiging eventueel verbonden toelagen en vergoedingen, tenzij
      hij, na daartoe door het hoofd van dienst in de gelegenheid te zijn gesteld, redenen kan aandragen die zijn verzuim
      rechtvaardigen.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel23
  - number: '24.1'
    text: |-
      Aanstelling tot een betrekking, aan welke periodieke verhogingen zijn verbonden, geschiedt als regel op de voor
      die betrekking vastgestelde laagste bezoldiging, doch in ieder geval op een bedrag, hetwelk in de desbetreffende
      schaal voorkomt.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel24
  - number: '24.2'
    text: |-
      Ten behoeve van de toekenning der (verdere) periodieke verhogingen kan door het bevoegde gezag een extra diensttijd
      worden toegekend.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel24
  - number: '24.3'
    text: |-
      Bij overgang naar een andere betrekking in dezelfde schaal van bezoldiging wordt de in de oude betrekking voor
      toekenning van periodieke verhogingen geldende diensttijd medegeteld voor het bepalen van de bezoldiging en de
      periodieke verhoging in de nieuwe betrekking.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel24
  - number: '24.4'
    text: |-
      Bij overgang naar een andere betrekking op een gelijke bezoldiging als in de tevoren beklede betrekking genoten,
      telt de tijd, gedurende welke in laatstbedoelde functie gelijke bezoldiging werd genoten, mede voor de toekenning
      van de eerstvolgende periodieke verhoging in de nieuwe betrekking.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel24
  - number: '24.5'
    text: |-
      Bij overgang naar een betrekking, aan welke een gelijke eindbezoldiging is verbonden, worden, indien in de vorige
      betrekking laatstelijk een hogere bezoldiging werd genoten dan de aanvangsbezoldiging van de nieuwe betrekking, al
      dadelijk zoveel verhogingen toegekend, dat betrokkene niet in bezoldiging achteruitgaat. Eventueel is het vierde
      lid van dit artikel van overeenkomstige toepassing. Indien een bezoldigingsvooruitgang wordt verkregen, kleiner dan
      het bedrag der eerstvolgende periodieke verhoging in de oude betrekking, dan telt de voor die verhoging vervulde
      diensttijd mede voor de toekenning van de eerstvolgende verhoging in de nieuwe betrekking.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel24
  - number: '24.6'
    text: |-
      Ingeval overgang geschiedt naar een betrekking, aan welke een hogere eindbezoldiging is verbonden, wordt
      de bezoldiging toegekend, welke onmiddellijk gelegen is boven het bedrag, laatstelijk in de lagere rang aan
      bezoldiging genoten. Indien een bezoldigingsvooruitgang wordt verkregen, gelijk aan het bedrag der eerstvolgende
      periodieke verhoging in de oude betrekking of minder, dan telt de voor die verhoging vervulde diensttijd mede voor
      de toekenning van de eerstvolgende verhoging in de nieuwe betrekking.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel24
  - number: '24.7'
    text: |-
      De krachtens de vorige leden toegekende bezoldiging wordt voor de toekenning van verdere periodieke verhogingen
      beschouwd als te zijn verkregen door gewone periodieke verhogingen, na de daarvoor gevorderde diensttijd.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel24
  - number: '24.8'
    text: In de aanstellingsbeschikking wordt de datum van de eerste periodieke verhoging bepaald.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel24
  - number: '24.9'
    text: |-
      De dagtekening van ingang van een aanstelling tot hogere rang kan worden gesteld op een tijdstip, voorafgaande aan
      de dagtekening van de beschikking van bevordering.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel24
  - number: '24.10'
    text: |-
      Voor gevallen, waarin de voorgaande leden van dit artikel niet of niet naar billijkheid voorzien, kan door het
      bevoegde gezag een bijzondere regeling getroffen worden.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel24
  - number: '25.1'
    text: |-
      Aan de ambtenaar, aan wie zodanige eisen gesteld worden dat zijn positie of taak een bijzonder karakter draagt, kan
      het bevoegd gezag een in ieder bijzonder geval vast te stellen toelage toekennen.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel25
  - number: '25.2'
    text: De toelage wordt bepaald op ten hoogste vijfentwintig ten honderd van de genoten bezoldiging.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel25
  - number: '26.1'
    text: |-
      Indien een wettelijke regeling continuïteit in de vervulling van een ambt veronderstelt en tot dat ambt niet
      meer ambtenaren zijn aangesteld, die het geheel of gedeeltelijk kunnen waarnemen, dan wel indien het belang van
      de dienst dit vordert wordt de daartoe in aanmerking komende ambtenaar door het bevoegde gezag met de tijdelijke
      waarneming van dat ambt belast, al dan niet met ontheffing uit zijn eigenlijke betrekking.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel26
  - number: '26.2'
    text: |-
      De ambtenaar die overeenkomstig het bepaalde in het vorige lid is belast met de tijdelijke waarneming van een ambt,
      dat in belangrijkheid en verantwoordelijkheid aanmerkelijk uitgaat boven het eigenlijke ambt van de ambtenaar,
      heeft over de tijd der waarneming aanspraak op toekenning door het bevoegd gezag van een toelage boven zijn
      eigen bezoldiging ten bedrage van het verschil tussen de bezoldiging, welke hij zou genieten, ware hij definitief
      benoemd in het ambt dat hij waarneemt, en zijn eigen bezoldiging, met inachtneming van de bepalingen betreffende
      persoonlijke toelage(n) indien de waarneming:
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel26
  - number: 26.2.a
    text: 30 dagen of langer onafgebroken heeft geduurd;
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel26
  - number: 26.2.b
    text: in een tijdvak van zes maanden in totaal gedurende 30 dagen of langer heeft geduurd;
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel26
  - number: 26.2.c
    text: in een tijdvak van twaalf maanden in totaal 60 dagen of langer heeft geduurd.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel26
  - number: '26.3'
    text: |-
      Bij tijdelijke waarneming krachtens benoeming van een ander ambt dan in het eerste lid bedoeld, zonder ontheffing
      uit zijn eigenlijke betrekking kan in bijzondere gevallen ter beoordeling van het bevoegd gezag, boven de toelage
      in het vorige lid bedoeld een tijdelijke toelage worden toegekend.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel26
  - number: '26.4'
    text: |-
      Indien de ambtenaar tijdens de waarneming voor een verhoging van de bezoldiging in aanmerking komt, wordt hem
      deze toegekend in zijn schaal. De toelage, bedoeld in het tweede lid, wordt alsdan bepaald op het verschil tussen
      de bezoldigingstrede die hij door deze verhoging bereikt en de bezoldigingstrede die hij in de bij het door
      hem waargenomen ambt behorende schaal bereikt zou hebben, indien hem de verhoging daarin zou zijn toegekend. De
      beoordeling van de betrokken ambtenaar tijdens de waarneming geschiedt naar de wijze van zijn functioneren in het
      door hem waargenomen ambt.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel26
  - number: '26.5'
    text: |-
      Indien uit de waarneming als in het eerste lid bedoeld voor de ambtenaar als zodanig direct aanwijsbare en op geld
      waardeerbare schade voortvloeit, wordt hem de geleden schade door het bevoegd gezag vergoed.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel26
  - number: '27.1'
    text: |-
      Indien het dienstbelang het onvermijdelijk maakt dat aan een ambtenaar werk wordt opgedragen buiten de vastgestelde
      werktijden, wordt hem op de in dit artikel bepaalde voet door het bevoegd gezag een beloning toegekend, met
      dien verstande, dat arbeid, welke gedurende korter dan vijftien minuten aansluitend op de normale werktijd wordt
      verricht, niet als overwerk wordt aangemerkt.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel27
  - number: '27.2'
    text: |-
      Bij het opdragen van overwerk wordt in acht genomen, dat de ambtenaar, behalve in de krachtens artikel 24 van de
      Arbeidswet 2000 BES aangewezen gevallen, slechts bij uitzondering arbeid mag verrichten langer dan gedurende het
      aantal uren en de tijdvakken, genoemd in artikel 14 van de Arbeidswet 2000 BES.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel27
  - number: '27.3'
    text: |-
      De vergoeding voor overwerk wordt in vrije tijd genoten en bestaat uit verlof, gelijk aan het aantal uren
      overschrijding van de per werkperiode vastgestelde arbeidsduur van een voltijds-werkende vermenigvuldigd met de
      factor:
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel27
  - number: 27.3.a
    text: |-
      2: voor overwerk, verricht op een dienstvrije dag, op een feestdag als bedoeld in het
      [vierde lid van artikel 42][ref1], en tussen zondagmorgen zes uur en maandagmorgen zes uur;


      [ref1]: https://wetten.overheid.nl/BWBR0028215#Artikel42
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0028215
        artikel: '42'
        hoofdstuk: V
  - number: 27.3.b
    text: '1½: voor overwerk, verricht op andere tijdstippen'
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel27
  - number: '27.4'
    text: |-
      Het verlof wordt zo spoedig mogelijk toegekend, doch in de regel niet later dan in de kalendermaand volgende op
      die, waarin de overschrijding plaats had, waarbij zoveel mogelijk rekening wordt gehouden met de wensen van de
      ambtenaar.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel27
  - number: '27.5'
    text: |-
      Indien naar het oordeel van het bevoegd gezag het dienstbelang zich bepaaldelijk verzet tegen het geheel of
      gedeeltelijk toekennen van verlof, wordt in plaats van verlof een vergoeding gedeeltelijk in vrije tijd en
      gedeeltelijk in geld of een vergoeding geheel in geld toegekend.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel27
  - number: '27.6'
    text: 'Een vergoeding gedeeltelijk in vrije tijd en gedeeltelijk in geld als bedoeld in het vijfde lid, bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel27
  - number: 27.6.a
    text: |-
      verlof, gelijk aan het aantal uren overschrijding van de per werkperiode vastgestelde arbeidsduur van een
      voltijdswerkende; en
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel27
  - number: 27.6.b
    text: |-
      een bedrag in geld, dat voor elk uur van de overschrijding, bedoeld onder a, een percentage van de voor de
      ambtenaar geldende inkomsten per uur bedraagt, te weten:
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel27
  - number: 27.6.b.1
    text: |-
      100%: voor overwerk, verricht op een dienstvrije dag, op een feestdag als bedoeld in het
      [vierde lid van artikel 42][ref1], en tussen zondagmorgen zes uur en maandagmorgen zes uur;


      [ref1]: https://wetten.overheid.nl/BWBR0028215#Artikel42
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0028215
        artikel: '42'
        hoofdstuk: V
  - number: 27.6.b.2
    text: '50%: voor overwerk, verricht op andere tijdstippen.'
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel27
  - number: '27.7'
    text: |-
      Een vergoeding geheel in geld bestaat uit een bedrag in geld, dat voor elk uur overschrijding van de per
      werkperiode vastgestelde arbeidsduur van een voltijdswerkende een percentage van de voor de ambtenaar geldende
      inkomsten per uur bedraagt, te weten:
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel27
  - number: 27.7.1
    text: |-
      100%: voor overwerk, verricht op een dienstvrije dag, op een feestdag als bedoeld in het
      [vierde lid van artikel 42][ref1], en tussen zondagmorgen zes uur en maandagmorgen zes uur;


      [ref1]: https://wetten.overheid.nl/BWBR0028215#Artikel42
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0028215
        artikel: '42'
        hoofdstuk: V
  - number: 27.7.2
    text: '50%: voor overwerk, verricht op andere tijdstippen.'
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel27
  - number: '27.8'
    text: |-
      De ambtenaar ontvangt voor dienst verricht ingevolge het voor hem geldende werkrooster op een feestdag als bedoeld
      in het derde lid voor elk uur dat hij volgens het werkrooster heeft gewerkt, naast zijn inkomen een toelage gelijk
      aan 100% van zijn uurloon.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel27
  - number: '27.9'
    text: |-
      Geen beloning voor overwerk, berekend per uur en geen toelage als bedoeld in het voorgaande lid worden genoten
      door ambtenaren:
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel27
  - number: 27.9.a
    text: |-
      die een betrekking bekleden, welke hoger wordt bezoldigd dan volgens schaal 9 van de algemene maatregel
      van bestuur, bedoeld in [artikel 17, onder a][ref1], of volgens daarmede in andere organieke regelingen der
      bezoldigingen voorkomende overeenkomstige bezoldigingsschalen danwel volgens de schalen, welke daarvoor eventueel
      in de plaats zullen treden;


      [ref1]: https://wetten.overheid.nl/BWBR0028215#Artikel17
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0028215
        artikel: '17'
        hoofdstuk: IV
        paragraaf: '1'
  - number: 27.9.b
    text: die met de leiding van een dienstvak of een onderdeel daarvan zijn belast of die zelfstandig overwerk verrichten;
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel27
  - number: 27.9.c
    text: |-
      die zijn belast met de uitoefening van een functie c.q. taak, welke met zich meebrengt, dat zij regelmatig overwerk
      moeten verrichten.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel27
  - number: '27.10'
    text: |-
      Als inkomsten, bedoeld in het zesde en zevende lid, worden aangemerkt de bezoldiging, vermeerderd met een eventuele
      kindertoelage, de bijzondere individuele vergoedingen en de verhogingen en persoonlijke toelagen met een periodiek
      karakter welke op grond van een organieke regeling van de bezoldiging en ingevolge de [artikelen 19][ref1] en
      [26][ref2] worden genoten, de continue-toelage en vergoedingen van onkosten daaronder niet begrepen.


      [ref1]: https://wetten.overheid.nl/BWBR0028215#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0028215#Artikel26
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0028215
        artikel: '19'
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0028215
        artikel: '26'
        hoofdstuk: IV
        paragraaf: '1'
  - number: '28'
    text: 'Nadere voorschriften kunnen worden vastgesteld betreffende de uitvoering van de bepalingen van deze paragraaf:'
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel28
  - number: 28.a
    text: bij ministeriële regeling voor ambtenaren in dienst van de staat, en
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel28
  - number: 28.b
    text: bij eilandsbesluit, houdende algemene maatregelen voor ambtenaren in dienst van een openbaar lichaam.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel28
  - number: '29.1'
    text: |-
      Boven en behalve de vastgestelde bezoldiging geniet de ambtenaar voor de ongehuwde kinderen tot wie hij in
      familierechtelijke betrekking staat beneden de leeftijd van achttien jaar en/of zijn ongehuwde stiefkinderen
      beneden de leeftijd van achttien jaar, laatstgenoemden voor zover zij geheel ten laste van de ambtenaar komen, een
      kindertoelage, welke wordt toegekend door of namens het bevoegde gezag.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel29
  - number: '29.2'
    text: |-
      Het vorige lid is eveneens van toepassing op kinderen beneden de leeftijd van achttien jaar, die deel uitmaken
      van het gezin van de ambtenaar, die hij geheel als eigen kinderen onderhoudt en opvoedt en die niet door de eigen
      ouders kunnen worden onderhouden en opgevoed, elk afzonderlijk geval door het bevoegde gezag te beoordelen.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel29
  - number: '29.3'
    text: 'Voor de toepassing van dit artikel worden met kinderen beneden de leeftijd van achttien jaren gelijkgesteld:'
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel29
  - number: 29.3.a
    text: |-
      kinderen van achttien tot vijf en twintig jaar, wier tijd behoudens in geval van ziekte of vakantie geheel of
      grotendeels in beslag wordt genomen door of in verband met het volgen van onderwijs;
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel29
  - number: 29.3.b
    text: |-
      kinderen van achttien tot vijf en twintig jaar, die naar het oordeel van het bevoegde gezag ten gevolge van ziekte
      of gebreken blijvend buiten staat zijn om met arbeid, die voor hun krachten is berekend, een derde te verdienen van
      hetgeen lichamelijk en geestelijk gezonde kinderen van gelijke leeftijd in staat zijn met arbeid te verdienen.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel29
  - number: '30'
    text: Aan de ambtenaar kan volgens vastgestelde regelen een standplaats- en een detacheringstoelage worden toegekend.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel30
  - number: '31'
    text: |-
      Nadere voorschriften ter uitvoering van het bepaalde in de [artikelen 29][ref1] en [30][ref2] worden vastgesteld:


      [ref1]: https://wetten.overheid.nl/BWBR0028215#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0028215#Artikel30
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0028215
        artikel: '29'
        hoofdstuk: IV
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0028215
        artikel: '30'
        hoofdstuk: IV
        paragraaf: '2'
  - number: 31.a
    text: bij ministeriële regeling, voor ambtenaren in dienst van de staat;
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel31
  - number: 31.b
    text: bij eilandsbesluit houdende algemene maatregelen, voor ambtenaren in dienst van een openbaar lichaam.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel31
  - number: '32'
    text: |-
      Ten aanzien van de ambtenaar voor wie de geldende werktijd korter is dan de voor zijn functie geldende
      gebruikelijke volledige werktijd wordt in de uitvoeringsvoorschriften, bedoeld in het [voorgaande artikel][ref1],
      indien en voor zover daarbij ter vaststelling van de kinder-, standplaats-, kostwinners- en detacheringstoelagen
      de bezoldiging het uitgangspunt vormt, de overeenkomstig [artikel 21][ref2] berekende bezoldiging in aanmerking
      genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0028215#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0028215#Artikel21
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0028215
        artikel: '31'
        hoofdstuk: IV
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0028215
        artikel: '21'
        hoofdstuk: IV
        paragraaf: '1'
  - number: '34'
    text: |-
      De ambtenaar, die als militair in werkelijke dienst is, wordt geacht in zijn burgerlijke betrekking van dienst
      vrijgesteld te zijn.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel34
  - number: '35'
    text: |-
      De ambtenaar, die ter vervulling van zijn dienstplicht voor eerste oefening onder de wapenen verblijft, geniet
      gedurende de daarvoor vastgestelde tijd de aan zijn ambt verbonden inkomsten, verminderd met zijn militaire
      beloning.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel35
  - number: '36'
    text: |-
      De ambtenaar die voor herhalingsoefeningen in werkelijke dienst is, behoudt over de tijd van deze dienst het volle
      genot van de aan zijn ambt verbonden inkomsten.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel36
  - number: '37.1'
    text: |-
      De ambtenaar, die in verband met oorlogsgevaar of andere buitengewone omstandigheden verplichte werkelijke dienst
      verricht, geniet gedurende dertig dagen de volle aan zijn ambt verbonden inkomsten en daarna hetgeen deze meer
      bedragen dan zijn militaire beloning.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel37
  - number: '37.2'
    text: |-
      Het eerste lid is eerst van toepassing nadat de militair, hetzij vóór, hetzij gedurende de buitengewone
      omstandigheden de eerste oefening heeft volbracht.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel37
  - number: '37.3'
    text: |-
      Het bepaalde in het tweede lid geldt niet ten aanzien van de buitengewone dienstplichten, die eerst in werkelijke
      dienst behoeven te komen na het jaar der lichting, waartoe zij behoren of naar hun leeftijd gerekend kunnen worden
      te behoren.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel37
  - number: '38'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel38
  - number: '39.1'
    text: |-
      Op de ambtenaar, die in tijdelijke dienst is aangesteld, zijn de bepalingen, vervat in de
      [artikelen 34 tot en met 37][ref1], slechts van toepassing tot en met de dag, waarop de burgerlijke betrekking zou
      zijn geëindigd indien hij daaraan niet door de militaire dienst zou zijn onttrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0028215#Artikel34
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0028215
        artikel: '34'
        hoofdstuk: IV
        paragraaf: '3'
  - number: '39.2'
    text: De bepalingen van deze paragraaf worden uitgevoerd door het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel39
  - number: '39.3'
    text: |-
      Ten aanzien van de ambtenaar voor wie de geldende werktijd korter is dan de voor zijn functie geldende
      gebruikelijke volledige werktijd wordt ter uitvoering van de bepalingen van deze paragraaf de overeenkomstig
      [artikel 20][ref1] berekende bezoldiging in aanmerking genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0028215#Artikel20
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0028215
        artikel: '20'
        hoofdstuk: IV
        paragraaf: '1'
  - number: '40.1'
    text: |-
      Zo spoedig mogelijk na het overlijden van de ambtenaar wordt door het bevoegd gezag aan de langstlevende echtgenoot
      een som uitgekeerd, gelijk aan drie maal het bedrag van de maandelijkse inkomsten op het tijdstip van overlijden.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel40
  - number: '40.2'
    text: |-
      Indien de overleden ambtenaar op het tijdstip van overlijden niet in actieve dienst is, wordt een bedrag uitgekeerd
      gelijk aan drie maal hetgeen hij als inkomsten zou hebben genoten, indien hij op de eerste der maand van het
      overlijden in activiteit was geweest.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel40
  - number: '40.3'
    text: |-
      Indien de overleden ambtenaar geen betrekking als bedoeld in het eerste lid nalaat, geschiedt de uitkering ten
      behoeve van de kinderen tot wie de ambtenaar in familierechtelijke betrekking stond die de leeftijd van een en
      twintig jaar nog niet hebben bereikt en niet gehuwd zijn of gehuwd geweest zijn. Ontbreken ook zodanige kinderen,
      dan geschiedt de uitkering, indien de overledene kostwinner was van ouders, broeders, zusters of overige kinderen,
      ten behoeve van deze betrekkingen.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel40
  - number: '40.4'
    text: |-
      Laat de overleden ambtenaar ook geen betrekkingen als in het vorige lid bedoeld na, dan kan het in het eerste
      lid bedoelde bedrag geheel of ten dele worden uitgekeerd voor de betaling van de kosten der laatste ziekte en der
      begrafenis, zo de nalatenschap van de overleden ambtenaar voor de betaling dier kosten ontoereikend is.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel40
  - number: '41'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel41
  - number: '42.1'
    text: |-
      Zoveel mogelijk wordt voor iedere dienst of bedrijf een regeling van de werktijd vastgesteld en bekend gemaakt, met
      inachtneming van het bepaalde bij of krachtens de wet, houdende bepalingen tot regeling van de arbeidsduur.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel42
  - number: '42.2'
    text: |-
      Bij de regeling van de werktijd wordt in acht genomen, dat deze in verband met de aard der werkzaamheden niet
      overmatig zij en behoorlijk door rusttijd wordt onderbroken, alsmede, dat op zondag alleen bij onvermijdelijkheid
      dienst wordt geëist.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel42
  - number: '42.3'
    text: |-
      Bij de regeling van de werktijd en bij haar toepassing wordt voorts ten aanzien van iedere ambtenaar zoveel
      mogelijk gezorgd, dat hij op zondag en de voor hem geldende kerkelijke feestdagen zijn kerk kan bezoeken en dat hij
      in zijn zondagrust zo weinig mogelijk wordt beperkt. Bij die regeling wordt ernaar gestreefd, dat van de ambtenaar
      op althans zesentwintig zondagen per jaar geen dienst wordt geëist.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel42
  - number: '42.4'
    text: |-
      Hetgeen in dit artikel ten aanzien van het verrichten van arbeid op zondag is bepaald, geldt mede voor het
      verrichten van arbeid op de Nieuwjaarsdag, de datum, vallende na de, op ieder openbaar lichaam afzonderlijk,
      gehouden carnavalsoptocht, de Goede Vrijdag, de Christelijke tweede Paasdag, de Hemelvaartsdag, de beide
      Kerstdagen, de dag waarop de verjaardag van de Koning officieel wordt gevierd, de dag waarop de dag van de arbeid
      (1 mei) officieel wordt gevierd, de datum 15 december als zijnde Koninkrijksdag, danwel Dia di Reino, danwel
      Kingdom Day; en iedere dag, die daarenboven bij of krachtens algemene maatregel van bestuur wordt aangewezen.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel42
  - number: '42.5'
    text: 'De in het eerste lid bedoelde regeling wordt vastgesteld:'
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel42
  - number: 42.5.a
    text: bij of krachtens algemene maatregel van bestuur, voor ambtenaren in dienst van de staat;
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel42
  - number: 42.5.b
    text: bij of krachtens algemene maatregel van bestuur, voor ambtenaren in dienst van een openbaar lichaam.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel42
  - number: '43.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden voor ambtenaren regels gesteld over verlening van verlof en
      toekennen van verlofsbezoldiging, waarbij onderscheid kan worden gemaakt tussen ambtenaren in dienst van de staat
      en ambtenaren in dienst van de openbare lichamen.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel43
  - number: '43.2'
    text: |-
      Met inachtneming van de algemene maatregel van bestuur of ministeriële regeling, bedoeld in het eerste lid, kunnen
      bij eilandsbesluit, houdende algemene maatregelen, voor ambtenaren in dienst van de openbare lichamen nadere regels
      worden gesteld over de verlening van verlof en toekennen van verlofsbezoldiging.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel43
  - number: '44'
    text: |-
      De aanspraken van ambtenaren op vrije geneeskundige behandeling en/of verpleging en, in verband daarmede, vrije
      overtocht, alsmede de bepaling van de categorie of categorieën van ambtenaren waaraan deze aanspraken toekomen,
      worden bij of krachtens wet geregeld.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel44
  - number: '45'
    text: |-
      Aan de ambtenaar, die voor zich zelf of voor zijn gezin terzake van geneeskundige behandeling en/of verpleging
      in onvermijdelijke uitgaven is vervallen, wordt een tegemoetkoming verleend overeenkomstig de regelen, bij of
      krachtens wet gesteld.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel45
  - number: 45A.1
    text: |-
      Aan de gewezen ambtenaar in vaste of in tijdelijke dienst, wiens dienstverband is geëindigd tijdens de
      verhindering om arbeid te verrichten door ziekte anders dan bedoeld in de volgende leden, doch vóór het
      verstrijken van een tijdvak van 12 maanden sedert de aanvang van de verhindering, wordt voor de verdere duur van
      de arbeidsongeschiktheid, doch uiterlijk tot het tijdstip van eindiging van voormeld tijdvak van 12 maanden, een
      uitkering toegekend overeenkomende met de verlofsbezoldiging die hij gedurende ziekteverlof zou hebben genoten
      indien zijn dienstverband niet was geëindigd.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel45A
  - number: 45A.2
    text: |-
      Aan de gewezen ambtenaar in vaste dienst, wiens dienstverband is geëindigd tijdens de verhindering om arbeid te
      verrichten door ziekte of gebreken, welke ontstaan zijn in en door de uitoefening van de dienst en niet aan de
      schuld of grove nalatigheid van de betrokken ambtenaar is te wijten, doch vóór het verstrijken van een tijdvak
      van 36 maanden sedert de aanvang van de verhindering, wordt voor de verdere duur van de arbeidsongeschiktheid,
      doch uiterlijk tot het tijdstip van eindiging van voormeld tijdvak van 36 maanden, een uitkering toegekend
      overeenkomende met de verlofsbezoldiging die hij gedurende ziekteverlof zou hebben genoten indien zijn
      dienstverband niet was geëindigd.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel45A
  - number: 45A.3
    text: |-
      De gewezen ambtenaar in tijdelijke dienst, wiens dienstverband is geëindigd tijdens de verhindering om arbeid
      te verrichten door ziekte of gebreken, welke ontstaan zijn in en door uitoefening van de dienst en niet aan de
      schuld of grove nalatigheid van de betrokken ambtenaar is te wijten, heeft voor de verdere duur van de gehele of
      gedeeltelijke arbeidsongeschiktheid, aanspraak op een maandelijkse uitkering in geld gelijk aan de maandelijkse
      uitkering in geld, welke op grond van de Wet ongevallenverzekering BES zou zijn genoten indien hij onder de werking
      van deze wet viel. Bij de vaststelling van de uitkering wordt echter geen rekening gehouden met de loongrenzen
      genoemd in bedoelde wet, terwijl ingeval van gehele arbeidsongeschiktheid gedurende het tijdvak bedoeld in het
      eerste lid deze uitkering niet op een lager bedrag mag worden gesteld dan dat, hetwelk zou zijn toegekend krachtens
      dat lid.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel45A
  - number: 45A.4
    text: |-
      De arbeidsongeschiktheid, bedoeld in het eerste, tweede en derde lid, dient te blijken uit een verklaring van de
      geneeskundige commissie of de geneeskundige, bedoeld in artikel 33 van het Besluit vakantie en vrijstelling van
      dienst ambtenaren BES, met overeenkomstige toepassing van de in het vierde, vijfde en zesde lid van dat artikel
      vastgestelde bepalingen.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel45A
  - number: 45A.5
    text: |-
      Op de uitkeringen, welke krachtens de leden 1 en 2 worden genoten, worden eventuele uitkeringen aan pensioen
      ten laste van het BES ambtenarenpensioenfonds, of bij wijze van pensioen op grond van het Besluit leeftijdgrens
      ambtenaren BES, vermeerderd met de daarop komende duurtetoeslag, in mindering gebracht.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel45A
  - number: 45A.6
    text: |-
      Het bepaalde in de Wet vergoeding behandelings- en verplegingskosten ambtenaren BES is, gedurende de tijd dat
      de in de vorige leden bedoelde uitkeringen worden genoten en voorts ingeval van een ongeval in de zin van de Wet
      ongevallenverzekering BES zolang de gevolgen van het ongeval dit noodzakelijk maken, van overeenkomstige toepassing
      op de hiervoor bedoelde gewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel45A
  - number: 45A.7
    text: |-
      Aan de nagelaten betrekkingen van de in het derde lid bedoelde gewezen ambtenaar worden de uitkeringen in geld
      toegekend, welke zouden zijn verleend indien betrokkene onder de werking van de Wet ongevallenverzekering BES viel,
      met dien verstande dat bij de vaststelling van de uitkering geen rekening wordt gehouden met de loongrenzen genoemd
      in bedoelde wet.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel45A
  - number: 45B
    text: |-
      Het bij of krachtens de [artikelen 44][ref1] en [45][ref2] verstrekte recht wordt verminderd met de vergoeding of
      uitkering welke de ambtenaar ontvangt krachtens een wettelijk voorgeschreven zorgverzekering.


      [ref1]: https://wetten.overheid.nl/BWBR0028215#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0028215#Artikel45
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel45B
    references:
      - id: ref1
        bwb_id: BWBR0028215
        artikel: '44'
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0028215
        artikel: '45'
        hoofdstuk: VI
  - number: 45C
    text: |-
      De bij of krachtens [artikel 45A][ref1] verstrekte uitkering wordt verminderd met de vergoeding of uitkering welke
      de ambtenaar ontvangt krachtens een wettelijk voorgeschreven verzekering ter zake van ziekte.


      [ref1]: https://wetten.overheid.nl/BWBR0028215#Artikel45A
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel45C
    references:
      - id: ref1
        bwb_id: BWBR0028215
        artikel: 45A
        hoofdstuk: VI
  - number: '46.1'
    text: |-
      De ambtenaar is verplicht bij de aanvaarding van zijn betrekking, bij aanstelling in een andere betrekking of
      indien hij met de tijdelijke waarneming van een ambt wordt belast, een eed of belofte van zuivering en een ambtseed
      of belofte af te leggen.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel46
  - number: '46.2'
    text: De eed of belofte wordt afgelegd in handen van het bevoegde gezag of van een door deze aangewezen hoofd van dienst.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel46
  - number: '47.1'
    text: |-
      De ambtenaar is gehouden de plichten uit zijn ambt voortvloeiende nauwgezet en ijverig te vervullen en zich te
      gedragen zoals een goed ambtenaar betaamt.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel47
  - number: '47.2'
    text: |-
      De ambtenaar dient de door het bevoegd gezag voor zijn werkzaamheid of zijn gedrag vastgestelde voorschriften na
      te komen.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel47
  - number: '47.3'
    text: Hij behoort zich te onthouden van het bezigen van vloeken en van ruwe of onzedelijke taal.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel47
  - number: '48.1'
    text: |-
      Aan de ambtenaar kan door of namens het bevoegd gezag de toegang tot de dienstlokalen, dienstgebouwen of het werk,
      dan wel het verblijf aldaar, worden ontzegd.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel48
  - number: '48.2'
    text: |-
      Hij is verplicht zich te gedragen naar de maatregelen van orde, welke ten aanzien van het verblijf aldaar door of
      namens het bevoegd gezag zijn gesteld.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel48
  - number: '49.1'
    text: |-
      De ambtenaar is verplicht de gehele voor hem geldende werktijd aan de zaken van de overheid te wijden. Het is hem
      verboden gedurende deze werktijd zich zonder geldige reden te verwijderen van de plaats waar de werkzaamheid moet
      worden verricht.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel49
  - number: '49.2'
    text: |-
      Het is de ambtenaar verboden gedurende de voor hem geldende werktijd zich bezig te houden met de behartiging van
      particuliere belangen van zichzelf of van derden.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel49
  - number: '49.3'
    text: |-
      Het is de ambtenaar verboden aan ambtenaren of ander personeel in dienst van de overheid op te dragen of te
      verzoeken gedurende de voor hen geldende werktijd werkzaamheden te verrichten anders dan ten behoeve van de
      overheid.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel49
  - number: '49.4'
    text: 'Het is de ambtenaar verboden:'
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel49
  - number: 49.4.a
    text: gedurende de voor hem geldende werktijd alcoholhoudende dranken te gebruiken of bij zich te hebben;
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel49
  - number: 49.4.b
    text: in de dienstlokalen, -voertuigen en -vaartuigen alcoholhoudende dranken te bewaren.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel49
  - number: '50'
    text: |-
      Indien de ambtenaar door ziekte of anderszins verhinderd is zijn dienst te verrichten, is hij verplicht daarvan,
      onder opgave van redenen, zo tijdig mogelijk mededeling te doen aan het hoofd van dienst of aan een door deze
      aangewezen ambtenaar, teneinde vertraging of hinder in de dienst zoveel doenlijk te voorkomen.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel50
  - number: '51.1'
    text: |-
      Indien een persoon, die hetzelfde perceel bewoont als de ambtenaar of ten hoogste veertien dagen tevoren bewoond
      heeft, lijdende is aan cholera, difterie, gele koorts, pest, pokken (variolae en varioloïdes), roodvonk, febris
      typhoidea en para-typhus, vlektyphus, of aan een andere bij of krachtens de Wet voor de volksgezondheid BES
      aangewezen ziekte, is het de ambtenaar verboden aan de dienst deel te nemen. De ambtenaar is verplicht bij het
      waarnemen in het perceel van een ziekte als bedoeld, hiervan ten spoedigste kennis te geven aan het hoofd van
      dienst.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel51
  - number: '51.2'
    text: |-
      Aan de ambtenaar kan door het hoofd van dienst in geval van ziekten, die voor de omgeving gevaar opleveren, de
      deelneming aan de dienst worden ontzegd.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel51
  - number: '51.3'
    text: Het verbod tot deelneming aan de dienst houdt tevens in het verbod tot betreden van dienstlokalen of terreinen.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel51
  - number: '51.4'
    text: |-
      De ambtenaar ontvangt over de tijd, gedurende welke het hem overeenkomstig het bepaalde in dit artikel verboden is
      aan de dienst deel te nemen, zijn inkomen.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel51
  - number: '52.1'
    text: |-
      De ambtenaar is verplicht zo nodig tijdelijk andere ambtelijke werkzaamheden te verrichten dan die welke hij
      gewoonlijk verricht.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel52
  - number: '52.2'
    text: |-
      Hij kan echter niet worden verplicht, indien bij enig particulier werkgever een staking is uitgebroken of een
      uitsluiting heeft plaats gehad, ter vervanging van stakers of uitgeslotenen werkzaamheden te verrichten, of
      werknemers bij het verrichten van werkzaamheden behulpzaam te zijn, tenzij en voorzover naar het oordeel van het
      bevoegde gezag zulks met het oog op de openbare veiligheid of gezondheid of voor de regelmatige functionering van
      de overheidsdienst noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel52
  - number: '52.3'
    text: De in het eerste lid bedoelde werkzaamheden worden de ambtenaar opgedragen door of namens het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel52
  - number: '53.1'
    text: |-
      Behoudens het bepaalde in het derde lid is de ambtenaar, wanneer het belang van de dienst zulks vordert, verplicht,
      al of niet in zijn dienstvak en al of niet op dezelfde standplaats, een andere betrekking of een andere werkkring
      te aanvaarden, welke hem in verband met zijn persoonlijkheid, zijn omstandigheden en de voor hem bestaande
      vooruitzichten redelijkerwijs kan worden opgedragen. Deze opdracht gaat uit van het bevoegde gezag.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel53
  - number: '53.2'
    text: |-
      Een andere betrekking of een andere werkkring wordt hem, tenzij in spoedeisende gevallen, niet opgedragen dan nadat
      hij is gehoord.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel53
  - number: '53.3'
    text: |-
      Aan de ambtenaar voor wie de geldende werktijd korter is dan de voor zijn functie geldende gebruikelijke volledige
      werktijd, kan niet zonder zijn instemming een standplaats buiten het eiland van zijn inwoning of arbeid buiten de
      voor hem geldende werktijd worden opgedragen.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel53
  - number: '54.1'
    text: |-
      Het is de ambtenaar in dienst van de staat verboden een ten laste van een openbaar lichaam bezoldigd ambt
      tegelijk met zijn ambt te bekleden anders dan met machtiging van de Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel54
  - number: '54.2'
    text: |-
      Het is de ambtenaar in dienst van een openbaar lichaam verboden een ten laste van de staat bezoldigd ambt tegelijk
      met zijn ambt te bekleden anders dan met machtiging van het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel54
  - number: '54.3'
    text: |-
      Het weigeren van een gevraagde of het intrekken van een reeds verleende machtiging wordt door de bevoegde
      autoriteit bij een met redenen omkleed besluit ter kennis van de betrokken ambtenaar gebracht.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel54
  - number: '54.4'
    text: |-
      Bij aanvaarding van een ambt als bedoeld in het eerste en tweede lid zonder de vereiste machtiging of voortgezette
      bekleding daarvan, nadat bedoelde machtiging is ingetrokken, wordt de ambtenaar geacht zijn ontslag te hebben
      gevraagd, indien aan een schriftelijke aanzegging om het ambt te laten varen geen gevolg wordt gegeven.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel54
  - number: '55.1'
    text: |-
      De ambtenaar is verplicht zich te gedragen naar hetgeen voor hem is bepaald ten aanzien van het aanvaarden van
      nevenbetrekkingen of het verrichten van nevenwerkzaamheden.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel55
  - number: '55.2'
    text: |-
      Zijn regelen in het belang van de dienst gesteld voor het drijven van nering of handel door de ambtenaar, dan is
      hij verplicht zich naar die regelen te gedragen.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel55
  - number: '55.3'
    text: |-
      Aan de ambtenaar zal in geen geval toestemming worden verleend een nevenbetrekking te aanvaarden of
      nevenwerkzaamheden te verrichten of nering dan wel handel te drijven, indien dit:
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel55
  - number: 55.3.a
    text: schadelijk kan zijn voor zijn dienstvervulling;
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel55
  - number: 55.3.b
    text: niet in overeenstemming is met het aanzien van zijn ambt.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel55
  - number: '55.4'
    text: 'De regelen overeenkomstig het bepaalde in de voorgaande leden van dit artikel worden vastgesteld:'
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel55
  - number: 55.4.a
    text: bij algemene maatregel van bestuur, voor ambtenaren in dienst van de staat;
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel55
  - number: 55.4.b
    text: bij eilandsbesluit houdende algemene maatregelen, voor ambtenaren in dienst van een openbaar lichaam.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel55
  - number: '56'
    text: |-
      Het is de ambtenaar verboden werken, leveringen of dienstverrichtingen welke direct dan wel indirect geheel of
      gedeeltelijk ten laste van de overheid komen, aan te nemen, zich daarvoor borg te stellen of daaraan, hetzij
      rechtstreeks, hetzij zijdelings deel te hebben.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel56
  - number: '57'
    text: |-
      Aan de ambtenaren of aan bepaalde groepen van ambtenaren van een bepaalde dienst kan door het bevoegde gezag
      worden verboden commissaris, bestuurder, vennoot, aandeelhouder of lid te zijn van nader te noemen vennootschappen,
      stichtingen of verenigingen, welke geregeld in aanraking komen of krachtens haar opzet kunnen komen met de
      betrokken dienst.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel57
  - number: 57A.1
    text: |-
      De ambtenaar, die een besturende, beherende dan wel toezichthoudende functie vervult in een naamloze vennootschap
      of ander rechtspersoonlijkheid bezittend lichaam, en voor de in die functie verrichte of te verrichten
      werkzaamheden, anders dan ten laste van de staat, indien hij ambtenaar in dienst van de staat is, of ten laste
      van het openbaar lichaam, indien hij ambtenaar in dienst van een openbaar lichaam is, een vergoeding ontvangt,
      is verplicht die vergoeding aan de staat, respectievelijk het openbaar lichaam te storten, indien de benoeming in
      die functie:
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel57A
  - number: 57A.1.a
    text: heeft plaats gehad door of vanwege het bevoegde gezag of
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel57A
  - number: 57A.1.b
    text: |-
      is voortgevloeid uit een wettelijk voorschrift dan wel uit een overeenkomst welke met instemming van het bevoegde
      gezag is tot stand gekomen.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel57A
  - number: 57A.2
    text: |-
      Het vorige lid van overeenkomstige toepassing ten aanzien van de ambtenaar, die een nevenfunctie vervult, welke
      verband houdt met het door hem beklede ambt en hem is opgedragen door het bevoegde gezag en voor de in die functie
      verrichte of te verrichten werkzaamheden, anders dan ten laste van de staat, respectievelijk aan het desbetreffende
      openbaar lichaam of de kas van een publiekrechtelijke instelling, een vergoeding ontvangt.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel57A
  - number: 57A.3
    text: |-
      Aan de ambtenaar die een functie als bedoeld in het eerste of tweede lid vervult, kan ten laste van de staat,
      respectievelijk het openbaar lichaam, een naar redelijkheid vast te stellen vergoeding worden toegekend.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel57A
  - number: '58.1'
    text: |-
      Het is de ambtenaar verboden overheidsgoederen te gebruiken ten bate van particuliere belangen van zichzelf of
      van derden.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel58
  - number: '58.2'
    text: |-
      De ambtenaar mag een vervoermiddel, hetwelk hem door de overheid ten behoeve van de dienst ter beschikking is
      gesteld, uitsluitend gebruiken voor het door de dienst vereiste vervoer.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel58
  - number: '58.3'
    text: |-
      Onder zodanig vervoer wordt niet verstaan het vervoer van de ambtenaar van en naar zijn woning en naar en van de
      plaats zijner werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel58
  - number: '58.4'
    text: |-
      In bijzondere omstandigheden kan het bevoegd gezag tijdelijk dispensatie verlenen van het bepaalde in het derde
      lid.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel58
  - number: '59.1'
    text: |-
      Het is de ambtenaar verboden een gift of een belofte daartoe van een derde aan te nemen, waarvan hij weet of
      redelijkerwijs moet vermoeden, dat deze gedaan wordt teneinde hem te bewegen in zijn bediening iets te doen of na
      te laten.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel59
  - number: '59.2'
    text: |-
      Het is de ambtenaar verboden een gift of een belofte daartoe van een derde te verzoeken, indien de derde uit de
      omstandigheden, waaronder het verzoek wordt gedaan, redelijkerwijze moet begrijpen, dat de ambtenaar zich zal laten
      bewegen in zijn bediening iets te doen of na te laten ingeval het verzoek wordt ingewilligd.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel59
  - number: '60.1'
    text: |-
      Onder gift wordt mede verstaan de kwijtschelding van een verplichting alsmede het nakomen van een overeenkomst,
      waardoor de ambtenaar klaarblijkelijk bevoordeeld wordt.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel60
  - number: '60.2'
    text: Onder belofte wordt mede verstaan verbintenis.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel60
  - number: '60.3'
    text: |-
      Een gift of belofte, gedaan aan de echtgenoot, kinderen of ouders van de ambtenaar, alsmede aan andere natuurlijke
      personen of rechtspersonen, waardoor de voor ambtenaar een rechtstreeks financieel voordeel te verwachten is, wordt
      gelijkgesteld met een gift of belofte aan de ambtenaar zelf.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel60
  - number: '61'
    text: |-
      De ambtenaar is verplicht terstond aan het bevoegd gezag mededeling te doen, indien door een derde pogingen zijn
      aangewend om hem door een gift of belofte te bewegen in zijn bediening iets te doen of na te laten.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel61
  - number: 61a.1
    text: |-
      De ambtenaar dient zich te onthouden van het openbaren van gedachten of gevoelens of van de uitoefening van
      het recht tot vereniging, tot vergadering en tot betoging, indien door de uitoefening van deze rechten de goede
      vervulling van zijn functie of de goede functionering van de openbare dienst, voor zover deze in verband staat met
      zijn functievervulling, niet in redelijkheid zou zijn verzekerd.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel61a
  - number: 61a.2
    text: 'Het eerste lid is, voor wat betreft het recht van vereniging, niet van toepassing op het lidmaatschap van:'
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel61a
  - number: 61a.2.a
    text: |-
      een politieke groepering, waarvan de aanduiding is ingeschreven overeenkomstig de [Kieswet][ref1] of


      [ref1]: https://wetten.overheid.nl/BWBR0004627
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel61a
    references:
      - id: ref1
        bwb_id: BWBR0004627
  - number: 61a.2.b
    text: een vakvereniging.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel61a
  - number: 61b
    text: |-
      De ambtenaar is verplicht tijdens het verblijf op zijn werk zich te onderwerpen aan een in het belang van de dienst
      door het bevoegde gezag gelast onderzoek aan zijn lichaam of aan zijn kleding of van zijn daar aanwezige goederen.
      Het bevoegd gezag, op wiens last het onderzoek plaatsheeft, neemt de nodige maatregelen ten einde daarbij een
      onredelijke of onbehoorlijke bejegening te voorkomen.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel61b
  - number: '62.1'
    text: |-
      De ambtenaar is verplicht tot geheimhouding van hetgeen hem in zijn ambt is ter kennis gekomen, voor zover die
      verplichting uit de aard der zaak volgt of hem uitdrukkelijk is opgelegd.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel62
  - number: '62.2'
    text: |-
      De in het vorige lid bedoelde verplichting bestaat niet tegenover hen, aan wie de ambtenaar onmiddellijk of
      middellijk ondergeschikt is, noch in zover hij door een boven hem gestelde van de verplichting tot geheimhouding
      is ontheven.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel62
  - number: '63'
    text: Het is de ambtenaar verboden misbruik te maken van hetgeen hij in zijn ambt heeft vernomen.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel63
  - number: '64.1'
    text: |-
      De ambtenaar is verplicht de dienstkleding en de onderscheidstekenen te dragen, indien en voor zover dat voor hem
      door het bevoegde gezag voorgeschreven is.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel64
  - number: '64.2'
    text: |-
      Het buiten dienst gekleed gaan in uniform is geoorloofd, behalve bij betogingen, optochten en openbare politieke
      vergaderingen, tenzij daarvoor door het bevoegd gezag bijzondere vergunning wordt gegeven. Voorts kan, indien
      daartoe termen aanwezig worden geacht, het dragen van een uniform buiten dienst voor bepaalde categorieën van
      ambtenaren door het bevoegd gezag worden verboden.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel64
  - number: '64.3'
    text: |-
      Het dragen van dienstkleding of onderscheidingstekenen buiten model is verboden, behoudens door het bevoegd gezag
      te verlenen ontheffing.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel64
  - number: '64.4'
    text: |-
      De verstrekking van dienstkleding of een vergoeding daarvoor geschiedt overeenkomstig de regelen, welke worden
      vastgesteld:
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel64
  - number: 64.4.a
    text: bij ministeriële regeling, voor ambtenaren in dienst van de staat;
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel64
  - number: 64.4.b
    text: bij eilandsbesluit houdende algemene maatregelen, voor ambtenaren in dienst van een openbaar lichaam.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel64
  - number: '65'
    text: |-
      Het is de ambtenaar verboden bij gekleed gaan in uniform insignes of andere onderscheidingstekenen of in
      dienst andere uniformkledingstukken te dragen dan die van overheidswege zijn verstrekt of voorgeschreven, en
      overigens insignes of andere onderscheidingstekenen te dragen, waarvan het dragen verboden is. Dit verbod is niet
      toepasselijk ten aanzien van vreemde ordetekenen tot het aannemen of dragen waarvan door het wettig gezag verlof
      is verleend.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel65
  - number: '66.1'
    text: |-
      De ambtenaar is verplicht, indien hem een ambts- of dienstwoning door of namens het bevoegd gezag ter bewoning is
      aangewezen, deze te betrekken en zich ter zake van de bewoning en het gebruik te gedragen naar de voorschriften,
      welke daaromtrent zijn gesteld.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel66
  - number: '66.2'
    text: |-
      Hij draagt de onderhoudskosten, welke volgens wettelijke regeling en het plaatselijk gebruik gemeenlijk voor
      rekening van de huurder zijn, tenzij door het bevoegde gezag terzake een afwijkende regeling is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel66
  - number: '66.3'
    text: |-
      De ambtenaar die een ambts- of dienstwoning bewoont, onthoudt zich van het uitsteken of hijsen van andere dan
      nationale of oranje vlaggen. Uit het uiterlijk aanzien van de ambt- of dienstwoning of van het daarbij behorende
      erf mag niet blijken van de politieke gezindheid van de ambtenaar of zijn huisgenoten.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel66
  - number: '67'
    text: Verplichting tot zekerheidsstelling wordt de ambtenaar niet opgelegd.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel67
  - number: '68.1'
    text: |-
      De ambtenaar, die als zodanig en zonder terzake rekenplichtig te zijn door onrechtmatige handelingen of door het
      nalaten van de zorg waartoe hij gehouden is, middellijk of onmiddellijk de overheid schade toebrengt, is verplicht
      die schade te vergoeden.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel68
  - number: '68.2'
    text: |-
      De vervolging van en het verhaal op de ambtenaar, zijn erfgenamen of rechtverkrijgenden, geschieden volgens
      regelen, bij wet vast te stellen.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel68
  - number: '69.1'
    text: |-
      De rekenplichtige ambtenaar wordt van de verplichting tot aanzuivering van een tekort geheel of gedeeltelijk
      ontheven naarmate hij het beheer nauwgezet heeft gevoerd en de nodige voorzorgen heeft genomen voor de bewaring van
      gelden en geldswaardige papieren.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel69
  - number: '69.2'
    text: |-
      Vloeit de verplichting tot aanzuivering van een tekort voort uit aansprakelijkheid voor ondergeschikten, dan wordt
      bovendien in aanmerking genomen in hoeverre hij op de handelingen van het personeel deugdelijk toezicht heeft
      gehouden.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel69
  - number: '70'
    text: |-
      De rekenplichtige ambtenaar is van zijn verantwoordelijkheid ontheven gedurende de tijd, dat hij door ziekte of
      wettige afwezigheid zijn beheer niet persoonlijk heeft gevoerd, indien gedurende die tijd zijn betrekking wordt
      waargenomen krachtens aanwijzing door het bevoegde gezag.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel70
  - number: '71'
    text: |-
      De artikelen van deze paragraaf vinden slechts toepassing voor zover de Wet financiën Bonaire, Sint Eustatius en
      Saba niet anders bepaalt.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel71
  - number: '72'
    text: |-
      Aan de ambtenaar, die door het bevoegde gezag naar een andere standplaats wordt overgeplaatst of in zijn
      standplaats ten behoeve van de dienst verplicht wordt van woning te veranderen, wordt een vergoeding verleend, met
      inachtneming van de daaromtrent gestelde regelen, welke worden vastgesteld:
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel72
  - number: 72.a
    text: bij algemene maatregel van bestuur, voor ambtenaren in dienst van de staat;
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel72
  - number: 72.b
    text: bij eilandsbesluit houdende algemene maatregelen, voor ambtenaren in dienst van een openbaar lichaam.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel72
  - number: '73.1'
    text: De ambtenaar heeft bij dienstreizen recht op vergoeding wegens reis- en verblijfkosten.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel73
  - number: '73.2'
    text: De vergoeding wegens reiskosten wordt niet genoten indien vrije overtocht is verleend.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel73
  - number: '73.3'
    text: |-
      Regelen betreffende toekenning van de in het eerste lid bedoelde vergoeding wegens verblijfkosten worden
      vastgesteld:
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel73
  - number: 73.3.a
    text: bij ministeriële regeling, voor ambtenaren in dienst van de staat;
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel73
  - number: 73.3.b
    text: bij eilandsbesluit houdende algemene maatregelen, voor ambtenaren in dienst van een openbaar lichaam.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel73
  - number: '73.4'
    text: |-
      De opdracht tot de dienstreis gaat uit van het bevoegde gezag of van de daartoe bevoegde functionarissen. De
      ambtenaar is verplicht een hem opgedragen dienstreis te aanvaarden.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel73
  - number: 73a.1
    text: |-
      De ambtenaar die in verband met verandering van standplaats of bij eerste vestiging op een standplaats buiten de
      woonplaats is verhuisd, heeft recht op vergoeding van verhuiskosten.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel73a
  - number: 73a.2
    text: 'Regelen betreffende toekenning van de in het eerste lid bedoelde vergoeding worden vastgesteld:'
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel73a
  - number: 73a.2.a
    text: bij ministeriële regeling, voor ambtenaren in dienst van de staat;
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel73a
  - number: 73a.2.b
    text: bij eilandsbesluit houdende algemene maatregelen, voor ambtenaren in dienst van een openbaar lichaam.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel73a
  - number: '74'
    text: |-
      Door het bevoegde gezag kan worden bepaald, in welke niet elders voorziene gevallen schadeloosstelling en
      vergoeding van kosten zal worden verleend.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel74
  - number: '75.1'
    text: |-
      De ambtenaar kan wegens buitengewone toewijding of bijzonder loffelijke dienstverrichting door het bevoegde gezag
      worden beloond.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel75
  - number: '75.2'
    text: 'De beloningen zijn:'
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel75
  - number: 75.2.a
    text: tevredenheidsbetuiging;
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel75
  - number: 75.2.b
    text: gratificatie;
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel75
  - number: 75.2.c
    text: bevordering;
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel75
  - number: 75.2.d
    text: eenvoudige geldelijke beloning.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel75
  - number: '75.3'
    text: 'De gratificatie bedraagt in een kalenderjaar niet meer dan een bedrag, vast te stellen:'
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel75
  - number: 75.3.a
    text: bij ministeriële regeling voor ambtenaren in dienst van de staat, en
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel75
  - number: 75.3.b
    text: bij eilandsbesluit, houdende algemene maatregelen voor ambtenaren in dienst van een openbaar lichaam.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel75
  - number: '75.4'
    text: |-
      De eenvoudige geldelijke beloning gaat een bedrag, gelijk aan tien procent (10%) van de aanvangsbezoldiging,
      behorende bij schaal 1 van een overzicht van bezoldigingsschalen zoals vastgesteld bij het bezoldigingsbesluit
      bedoeld in [artikel 17, eerste lid onder a][ref1], niet te boven en kan ten hoogste tweemaal per kalenderjaar aan
      dezelfde ambtenaar worden toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0028215#Artikel17
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0028215
        artikel: '17'
        hoofdstuk: IV
        paragraaf: '1'
  - number: '75.5'
    text: |-
      Ten aanzien van de ambtenaar voor wie de geldende werktijd korter is dan de voor zijn functie geldende
      gebruikelijke volledige werktijd wordt ter uitvoering van de bepalingen van dit artikel de bezoldiging in
      aanmerking genomen die hij in die functie zou hebben genoten, indien de voor hem geldende werktijd gelijk zou zijn
      aan de voor zijn functie gebruikelijke volledige werktijd.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel75
  - number: 75a
    text: |-
      Indien het naar het oordeel van het bevoegde gezag van groot algemeen belang is dat een bepaalde vacante betrekking
      zonder uitstel wordt bezet of dat een betrekking door de ambtenaar die haar bezet niet wordt opgegeven, kan een
      eenmalige uitkering worden toegekend aan de persoon die bereid is de bedoelde betrekking gedurende een bepaald, in
      de beschikking waarbij de uitkering wordt toegekend als voorwaarde voor de toekenning aan te duiden tijdvak te gaan
      bezetten, onderscheidenlijk niet op te geven. Aan de toekenning kunnen ook andere voorwaarden, verband houdende
      met de betreffende betrekking en de wijze waarop zij wordt uitgeoefend worden verbonden. Nadere regels aangaande
      de hoogte van de uitkering, de voorwaarden waaronder zij kan worden toegekend en de gevallen waarin zij geheel of
      gedeeltelijk niet wordt uitbetaald dan wel teruggevorderd, worden vastgesteld:
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel75a
  - number: 75a.a
    text: bij algemene maatregel van bestuur voor ambtenaren in dienst van de staat, en
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel75a
  - number: 75a.b
    text: bij eilandsbesluit, houdende algemene maatregelen voor ambtenaren in dienst van een openbaar lichaam.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel75a
  - number: '76.1'
    text: |-
      Aan de ambtenaar kan door het bevoegde gezag een studieopdracht naar het buitenland worden verstrekt. De ambtenaar
      die in volledige werktijd in zijn functie werkzaam is, is verplicht een studieopdracht van een duur van ten hoogste
      zes maanden te aanvaarden. Aan de ambtenaar voor wie de geldende werktijd korter is dan de voor zijn functie
      geldende gebruikelijke volledige werktijd, kan een dergelijke studieopdracht, en aan iedere ambtenaar kan een
      studieopdracht welke de duur van zes maanden overschrijdt niet zonder zijn instemming worden gegeven.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel76
  - number: '76.2'
    text: |-
      Gedurende een studieopdracht wordt de ambtenaar op non-activiteit gesteld. Hem worden zodanige inkomsten toegekend,
      dat hij gedurende de studieopdracht op dezelfde wijze in zijn levensonderhoud en dat van zijn gezin kan voorzien
      als ware hij in actieve dienst gebleven; voorts worden zodanige voorzieningen getroffen, dat de ambtenaar van
      bedoelde opdracht geen nadelen ondervindt. De ambtenaar voor wie de geldende werktijd korter is dan de voor
      zijn functie geldende gebruikelijke volledige werktijd, maar die met de verlening van een studie-opdracht heeft
      ingestemd, wordt voor de duur van die opdracht in volledige werktijd aangesteld; bij de toekenning van inkomsten
      als bedoeld in dit lid wordt een betrekking in volledige werktijd als uitgangspunt genomen.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel76
  - number: '76.3'
    text: |-
      In de beschikking, waarbij een studieopdracht wordt verleend, wordt bepaald of de tijd gedurende welke die opdracht
      wordt vervuld al dan niet:
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel76
  - number: 76.3.a
    text: |-
      volledig in aanmerking komt als diensttijd, zowel voor de beoordeling der pensioenaanspraken als voor de regelen
      van het pensioen;
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel76
  - number: 76.3.b
    text: |-
      aangemerkt wordt als tijd gedurende welke geen werkelijke dienst wordt verricht in de zin van artikel 10, eerste
      lid, van het Besluit vakantie en vrijstelling van dienst ambtenaren;.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel76
  - number: 76.3.c
    text: geldig is als diensttijd voor de toekenning van periodieke verhoging van bezoldiging.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel76
  - number: '77'
    text: |-
      Terzake van niet naleving van bepalingen, welke redelijkerwijs niet kunnen worden geacht de ambtenaar bekend te
      zijn, worden hem geen voordelen onthouden of nadelen toegebracht.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel77
  - number: '78'
    text: |-
      Indien schriftelijk klachten, de ambtenaar betreffende, bij het bevoegde gezag of het hoofd van dienst inkomen,
      wordt de ambtenaar zo spoedig mogelijk in de gelegenheid gesteld daarvan kennis te nemen en is hij desgevorderd
      verplicht, de desbetreffende stukken voor «gezien» te tekenen. Hij is bevoegd zijn oordeel over de inhoud daarvan
      zowel mondeling als schriftelijk te geven.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel78
  - number: '79.1'
    text: |-
      In strijd met een regeling, door het bevoegde gezag getroffen, worden de ambtenaar geen voordelen onthouden of
      nadelen toegebracht.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel79
  - number: '79.2'
    text: |-
      Het bevoegde gezag dat een algemene regeling vaststelde, is niet bevoegd voor een bepaald geval ten nadele van de
      ambtenaar daarvan af te wijken, tenzij de regeling afwijking voorbehoudt.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel79
  - number: '80'
    text: |-
      Het verlenen van overtocht ten laste van de overheid of het toekennen van vergoeding van overtochtskosten geschiedt
      overeenkomstig de daarvoor bij wet vastgestelde regelen.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel80
  - number: '81'
    text: 'Voorschriften betreffende de overige rechten en verplichtingen van de ambtenaar worden vastgesteld:'
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel81
  - number: 81.a
    text: bij ministeriële regeling, voor ambtenaren in dienst van de staat;
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel81
  - number: 81.b
    text: bij eilandsbesluit houdende algemene maatregelen, voor ambtenaren in dienst van een openbaar lichaam.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel81
  - number: '82.1'
    text: |-
      De ambtenaar, die de hem opgelegde verplichtingen niet nakomt, of zich overigens aan plichtsverzuim schuldig maakt,
      kan deswege door het bevoegde gezag disciplinair worden gestraft.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel82
  - number: '82.2'
    text: |-
      Plichtsverzuim omvat zowel het overtreden van enig voorschrift als het doen of nalaten van iets, hetwelk een goed
      ambtenaar in gelijke omstandigheden behoort na te laten of te doen.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel82
  - number: '82.3'
    text: |-
      Een strafvervolging wegens een feit dat mede een plichtsverzuim inhoudt, sluit een disciplinaire strafoplegging
      wegens datzelfde feit niet uit.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel82
  - number: '82.4'
    text: |-
      Tenzij door Ons of met Onze machtiging door Onze Minister anders is bepaald, wordt de straf opgelegd
      door het gezag dat bevoegd is tot aanstelling in het door de ambtenaar beklede ambt. Indien deze
      bevoegdheid bij Ons berust, geschiedt de bestraffing, behalve voor zover het betreft de straffen genoemd
      in [artikel 83, eerste lid, onder g tot en met i][ref1], door Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties.


      [ref1]: https://wetten.overheid.nl/BWBR0028215#Artikel83
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0028215
        artikel: '83'
        hoofdstuk: VIII
  - number: '83.1'
    text: 'De disciplinaire straffen, welke kunnen worden toegepast zijn:'
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel83
  - number: 83.1.a
    text: schriftelijke berisping;
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel83
  - number: 83.1.b
    text: |-
      buitengewone dienst op andere dagen dan de zondag en de voor de ambtenaar geldende kerkelijke feestdagen, zonder de
      ingevolge [artikel 27][ref1] voor overwerk toe te kennen beloning of tegen een lagere beloning dan deze;


      [ref1]: https://wetten.overheid.nl/BWBR0028215#Artikel27
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0028215
        artikel: '27'
        hoofdstuk: IV
        paragraaf: '1'
  - number: 83.1.c
    text: geldboete;
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel83
  - number: 83.1.d
    text: inhouding, geheel of gedeeltelijk, van inkomen;
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel83
  - number: 83.1.e
    text: terugzetting naar een lagere bezoldigingstrede;
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel83
  - number: 83.1.f
    text: uitsluiting van bevordering;
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel83
  - number: 83.1.g
    text: terugzetting in rang, al of niet voor een bepaalde tijd en met of zonder vermindering van bezoldiging;
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel83
  - number: 83.1.h
    text: schorsing voor een bepaalde tijd met inhouding, geheel of gedeeltelijk, van inkomen;
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel83
  - number: 83.1.i
    text: ontslag.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel83
  - number: '83.2'
    text: |-
      Ten aanzien van ambtenaren in dienst van de openbare lichamen kan bij eilandsbesluit, houdende algemene
      maatregelen, de bevoegdheid tot het opleggen van de in het eerste lid, onder a tot en met g, genoemde straffen aan
      in dat eilandsbesluit aangewezen functionarissen worden overgedragen.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel83
  - number: '83.3'
    text: |-
      De toepassing van de in het eerste lid onder b, c, d, e, f en g genoemde straffen geschiedt met inachtneming van
      het navolgende:
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel83
  - number: 83.3.1°
    text: |-
      buitengewone dienst wordt opgelegd voor ten hoogste zes uren met een maximum van drie uren per dag al of niet in
      aansluiting op de diensttijd;
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel83
  - number: 83.3.2°
    text: |-
      geldboete bedraagt ten minste vijf procent (5%) en ten hoogste vijftig procent (50%) van de aanvangsbezoldiging,
      behorende bij schaal 1 van een overzicht van bezoldigingsschalen zoals vastgesteld bij het bezoldigingslandsbesluit
      bedoeld in [artikel 17, eerste lid onder a][ref1], afgerond tot het naast-hogere bedrag in gehele dollars;


      [ref1]: https://wetten.overheid.nl/BWBR0028215#Artikel17
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0028215
        artikel: '17'
        hoofdstuk: IV
        paragraaf: '1'
  - number: 83.3.3°
    text: inhouding van inkomen geschiedt tot een bedrag van ten hoogste een maand inkomen;
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel83
  - number: 83.3.4°
    text: terugzetting in bezoldiging geschiedt voor ten hoogste twee bezoldigingstreden;
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel83
  - number: 83.3.5°
    text: uitsluiting van bevordering geschiedt voor niet langer dan vier jaren;
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel83
  - number: 83.3.6°
    text: |-
      terugzetting in rang bestaat in het overbrengen van de gestrafte naar de onmiddellijk lagere rang met of zonder
      vermindering van zijn bezoldiging tot de aan die rang verbonden bezoldiging;
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel83
  - number: 83.3.7°
    text: schorsing geschiedt voor ten hoogste zes maanden.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel83
  - number: '83.4'
    text: |-
      Bij het opleggen van een straf kan worden bepaald, dat zij niet ten uitvoer zal worden gelegd, indien betrokkene
      zich gedurende de bij het opleggen van de straf te bepalen termijn, welke die van twee jaren niet te boven mag
      gaan, niet schuldig maakt aan soortgelijk plichtsverzuim als waarvoor de bestraffing plaats vindt, noch aan enig
      ander ernstig plichtsverzuim en zich houdt aan bij het opleggen van de straf eventueel te stellen bijzondere
      voorwaarden. De voorwaarden mogen de godsdienstige of staatkundige vrijheid niet beperken.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel83
  - number: '83.5'
    text: |-
      Dezelfde functionaris, die over de voorwaardelijke strafopschorting bedoeld in het vorige lid heeft beslist, kan,
      indien betrokkene zich binnen de bepaalde proeftijd wederom aan een plichtsverzuim als in het vorige lid bedoeld
      schuldig maakt of zich niet houdt aan de eventueel gestelde bijzondere voorwaarden, gelasten dat de opgeschorte
      straf alsnog ten uitvoer wordt gelegd.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel83
  - number: '83.6'
    text: |-
      Ten aanzien van de ambtenaar voor wie de geldende werktijd korter is dan de voor zijn functie geldende
      gebruikelijke volledige werktijd wordt ter uitvoering van de bepalingen van dit artikel de bezoldiging in
      aanmerking genomen die hij in die functie zou hebben genoten, indien de voor hem geldende werktijd gelijk zou zijn
      aan de voor zijn functie gebruikelijke volledige werktijd.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel83
  - number: 83a.1
    text: |-
      De kennisgeving, bedoeld in artikel 95, eerste lid, van de Wet ambtenarenrechtspraak 1951 BES, wordt zo mogelijk in
      het dienstgebouw of de werkplaats waar de ambtenaar zijn dienst verricht tegen gedagtekend en door hem ondertekend
      ontvangstbewijs ter hand gesteld.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel83a
  - number: 83a.2
    text: |-
      Indien de ambtenaar niet in het dienstgebouw of op de werkplaats aanwezig is, wordt de mededeling aan zijn woon-
      of verblijfplaats tegen gedagtekend en door de ontvanger ondertekend ontvangstbewijs afgegeven aan de betrokkene of
      aan een van zijn huisgenoten. Indien degene die met de afgifte van de mededeling belast is noch de ambtenaar, noch
      iemand van diens huisgenoten aantreft, of indien degene die hij aantreft weigert het stuk in ontvangst te nemen of
      het ontvangstbewijs te ondertekenen, wordt het bij aangetekende post aan zijn woon- of verblijfplaats gezonden.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel83a
  - number: 83a.3
    text: |-
      In de gevallen, bedoeld in het tweede lid, wordt de betrokken ambtenaar geacht met de mededeling bekend te zijn
      geworden op de dag van de afgifte aan zijn woon- of verblijfplaats, onderscheidenlijk op de dag waarop het door de
      postdienst aan die woon- of verblijfplaats is bezorgd of aangeboden.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel83a
  - number: '84.1'
    text: |-
      De straf wordt niet opgelegd dan nadat de ambtenaar in de gelegenheid is gesteld zich, ter keuze van de tot het
      opleggen van straffen bevoegden, mondeling of schriftelijk, binnen zeven dagen tegenover deze te verantwoorden. Bij
      zijn verantwoording mag de ambtenaar van de hulp van anderen gebruik maken.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel84
  - number: '84.2'
    text: |-
      Geschiedt de verantwoording mondeling, dan wordt daarvan aanstonds proces-verbaal opgemaakt, dat na voorlezing
      wordt getekend door hem te wiens overstaan de verantwoording plaats heeft en door de ambtenaar. Weigert de
      ambtenaar de ondertekening, dan wordt daarvan in het proces-verbaal, zo mogelijk met vermelding der redenen,
      melding gemaakt.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel84
  - number: '84.3'
    text: |-
      Indien de ambtenaar zulks verlangt, worden hij en degene, van wiens hulp hij bij zijn verantwoording gebruik
      maakt, in de gelegenheid gesteld kennis te nemen van de ambtelijke rapporten of andere bescheiden, welke op de hem
      ten laste gelegde feiten betrekking hebben, met uitzondering echter van de stukken tegen welker kennisneming het
      openbaar belang zich bepaaldelijk verzet.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel84
  - number: '84.4'
    text: De strafoplegging moet schriftelijk geschieden en is met redenen omkleed.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel84
  - number: '84.5'
    text: |-
      De tot het opleggen van straffen bevoegden geven aan de gestrafte onverwijld kennis van de strafoplegging door
      toezending van een afschrift van het desbetreffend besluit. Het [tweede, derde en vierde lid van artikel 83a][ref1]
      zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028215#Artikel83a
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0028215
        artikel: 83a
        hoofdstuk: VIII
  - number: '84.6'
    text: |-
      Indien de strafoplegging plaats vindt door de krachtens het [tweede lid van artikel 83][ref1] aangewezenen, wordt
      in het besluit tot strafoplegging tevens medegedeeld, dat binnen veertien dagen na ontvangst daarvan bij het
      bevoegd gezag schriftelijk beroep van betrokkene onder aanvoering van gronden open staat, tenzij het bevoegd gezag
      ingevolge het tweede lid van artikel 83 is aangewezen. Het bevoegd gezag is verplicht binnen drie maanden na de dag
      waarop de ambtenaar in beroep is gekomen, deze een met redenen omklede beslissing toe te zenden.


      [ref1]: https://wetten.overheid.nl/BWBR0028215#Artikel83
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0028215
        artikel: '83'
        hoofdstuk: VIII
  - number: '85.1'
    text: |-
      De straf, behalve die van schriftelijke berisping, wordt niet ten uitvoer gelegd, zolang zij niet onherroepelijk
      is geworden, tenzij onmiddellijke tenuitvoerlegging naar het oordeel van de tot straffen bevoegden door het
      dienstbelang wordt gevorderd.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel85
  - number: '85.2'
    text: |-
      Indien tot onmiddellijke tenuitvoerlegging van de straf van buitengewone dienst is overgegaan en deze straf na
      ingesteld beroep niet wordt gehandhaafd, wordt de tijd, gedurende welke buitengewone dienst is verricht, aangemerkt
      als diensttijd gedurende welke opgedragen werk na de vastgestelde werktijden is verricht en wordt aan de hand van
      de terzake geldende voorschriften een beloning voor overwerk toegekend.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel85
  - number: '86.1'
    text: |-
      Terzake van een gedraging als bedoeld in [artikel 82][ref1] kan slechts één disciplinaire straf worden opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0028215#Artikel82
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0028215
        artikel: '82'
        hoofdstuk: VIII
  - number: '86.2'
    text: |-
      De ambtenaar die zich aan meerdere op zich zelf staande gedragingen als bedoeld in [artikel 82][ref1] schuldig
      maakt, kan terzake elk dier gedragingen afzonderlijk en zonder vermindering disciplinair worden gestraft.


      [ref1]: https://wetten.overheid.nl/BWBR0028215#Artikel82
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0028215
        artikel: '82'
        hoofdstuk: VIII
  - number: '87'
    text: |-
      Onverminderd het bepaalde in [artikel 82][ref1] kan de ambtenaar door het gezag dat bevoegd is tot aanstelling
      worden geschorst in zijn ambt:


      [ref1]: https://wetten.overheid.nl/BWBR0028215#Artikel82
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0028215
        artikel: '82'
        hoofdstuk: VIII
  - number: 87.a
    text: wanneer er een strafrechtelijke vervolging terzake van misdrijf tegen hem wordt ingesteld;
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel87
  - number: 87.b
    text: |-
      wanneer hem door het bevoegde gezag het voornemen tot bestraffing met onvoorwaardelijk ontslag is te kennen gegeven
      of hem van de oplegging van deze straf mededeling is gedaan;
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel87
  - number: 87.c
    text: |-
      in andere gevallen, waarin schorsing naar het oordeel van het daartoe bevoegde gezag wordt gevorderd door het
      belang van de dienst.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel87
  - number: '88.1'
    text: 'De ambtenaar is van rechtswege in zijn ambt geschorst, indien hij:'
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel88
  - number: 88.1.a
    text: zich in verzekerde bewaring bevindt;
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel88
  - number: 88.1.b
    text: in een krankzinnigengesticht wordt verpleegd.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel88
  - number: '88.2'
    text: |-
      Onverminderd het bepaalde in het vorige lid wordt de ambtenaar, die in een krankzinnigengesticht wordt verpleegd,
      ziekteverlof verleend krachtens de terzake bestaande regelingen.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel88
  - number: '89.1'
    text: |-
      Tijdens de schorsing ingevolge [artikel 87, onder a][ref1], of ingevolge [artikel 88, eerste lid onder a][ref2],
      wordt het inkomen voor één derde gedeelte ingehouden; na verloop van een termijn van zes weken kan een verdere
      inhouding, ook van het volle bedrag, plaatsvinden. Het niet ingehouden gedeelte van het inkomen kan aan anderen dan
      aan de ambtenaar worden uitbetaald.


      [ref1]: https://wetten.overheid.nl/BWBR0028215#Artikel87
      [ref2]: https://wetten.overheid.nl/BWBR0028215#Artikel88
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0028215
        artikel: '87'
        hoofdstuk: IX
      - id: ref2
        bwb_id: BWBR0028215
        artikel: '88'
        hoofdstuk: IX
  - number: '89.2'
    text: |-
      Tijdens de schorsing ingevolge [artikel 87, onder b][ref1], kan tot de in de strafaanzegging of -oplegging genoemde
      datum van ingang van het ontslag het inkomen geheel of gedeeltelijk worden ingehouden. Van bedoelde datum van
      ingang van het ontslag af wordt het inkomen geheel ingehouden. Het niet ingehouden gedeelte van het inkomen kan aan
      anderen dan aan de ambtenaar worden uitbetaald.


      [ref1]: https://wetten.overheid.nl/BWBR0028215#Artikel87
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0028215
        artikel: '87'
        hoofdstuk: IX
  - number: '89.3'
    text: |-
      Het ingevolge het eerste lid ingehouden inkomen wordt alsnog uitbetaald, indien de schorsing niet door een door
      de strafrechter opgelegde straf gevolgd of ook indien en in zoverre op andere gronden alsnog tot uitbetaling wordt
      besloten.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel89
  - number: '89.4'
    text: |-
      Het ingevolge het tweede lid ingehouden inkomen wordt alsnog uitbetaald, indien op de schorsing bestraffing van de
      ambtenaar met onvoorwaardelijk ontslag niet volgt.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel89
  - number: '90.1'
    text: |-
      Ontslag wordt gegeven door het tot het gezag dat bevoegd is tot aanstelling. Het wordt schriftelijk verleend. De
      ontslagbeschikking vermeldt de dag van ingang van het ontslag dan wel een aanduiding van die dag.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel90
  - number: '90.2'
    text: |-
      Bij ongevraagd ontslag wordt de ambtenaar, behoudens het bepaalde in [artikel 92][ref1], de reden van het ontslag
      schriftelijk medegedeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0028215#Artikel92
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0028215
        artikel: '92'
        hoofdstuk: IX
  - number: '91.1'
    text: Aan de ambtenaar wordt op zijn verzoek eervol ontslag verleend.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel91
  - number: '91.2'
    text: |-
      Tenzij overeenkomstig het verzoek van de ambtenaar zelf of om dringende redenen van openbaar belang, wordt dit
      ontslag niet verleend met ingang van een dag, vroeger dan één maand of later dan drie maanden na die dag, waarop
      het verzoek om ontslag is ingekomen.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel91
  - number: '91.3'
    text: |-
      Is een strafvervolging tegen de ambtenaar aanhangig of wordt overwogen hem in aanmerking te brengen voor een
      disciplinaire straf, dan kan het nemen van een beslissing op het verzoek om ontslag worden aangehouden totdat de
      uitspraak van de strafrechter of de beslissing inzake de disciplinaire straf onherroepelijk is geworden.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel91
  - number: '92.1'
    text: |-
      Aan de ambtenaar in tijdelijke dienst, die blijkens zijn benoeming voor een bepaalde tijd of voor een proeftijd is
      benoemd, wordt, tenzij het tegendeel blijkt, geacht eervol ontslag te zijn verleend, zodra die tijd is verstreken.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel92
  - number: '92.2'
    text: |-
      Aan de ambtenaar in tijdelijke dienst, die voor onbepaalde tijd is benoemd, kan eervol ontslag worden verleend,
      mits een opzeggingstermijn in acht wordt genomen:
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel92
  - number: 92.2.a
    text: |-
      van drie maanden ingeval de betrokkene bij het begin van de opzeggingstermijn laatstelijk ten minste twaalf maanden
      onafgebroken in dienst was;
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel92
  - number: 92.2.b
    text: |-
      van twee maanden ingeval de betrokkene bij het begin van de opzeggingstermijn laatstelijk zes maanden of langer,
      doch korter dan twaalf maanden, onafgebroken in dienst was;
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel92
  - number: 92.2.c
    text: |-
      van één maand ingeval de betrokkene bij het begin van de opzeggingstermijn laatstelijk korter dan zes maanden
      onafgebroken in dienst was.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel92
  - number: '92.3'
    text: |-
      Over de tijd, welke aan de in het tweede lid bedoelde opzeggingstermijn mocht ontbreken, heeft de betrokkene recht
      op doorbetaling van het inkomen.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel92
  - number: '92.4'
    text: 'Op doorbetaling van het inkomen bestaat niet langer aanspraak indien de ambtenaar:'
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel92
  - number: 92.4.a
    text: gedurende de opzeggingstermijn uit eigen beweging de actieve dienst verlaat;
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel92
  - number: 92.4.b
    text: gedurende de opzeggingstermijn zonder de vereiste toestemming een andere betrekking aanvaardt.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel92
  - number: '92.5'
    text: |-
      Aan de ambtenaar in tijdelijke dienst als bedoeld in het eerste lid kan eervol ontslag worden verleend met ingang
      van de dag, gelegen binnen de bepaalde tijd of de proeftijd. In dat geval vindt het bepaalde in het tweede, derde
      en vierde lid overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel92
  - number: '93'
    text: |-
      Aan de ambtenaar wordt wegens het bereiken van een bepaalde leeftijd eervol ontslag verleend overeenkomstig de
      regelen bij of krachtens algemene maatregel van bestuur gesteld.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel93
  - number: '94.1'
    text: |-
      Aan de ambtenaar kan eervol ontslag worden verleend wegens opheffing van zijn betrekking, wegens verandering in de
      inrichting van de dienst of het bedrijf, waar hij werkzaam is, hetzij van twee of meer diensten of bedrijven, of
      wegens verminderde behoefte aan arbeidskrachten.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel94
  - number: '94.2'
    text: |-
      In de gevallen, dat door het bevoegd gezag wordt overgegaan tot toepassing van het eerste lid, geschiedt het
      ontslag van de in vaste dienst aangestelde ambtenaar, met uitzondering van het ontslag wegens opheffing van de
      betrekking, zoveel mogelijk in de volgende rangorde:
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel94
  - number: 94.2.a
    text: zij die zulks wensen;
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel94
  - number: 94.2.b
    text: |-
      zij die pensioengerechtigd zijn, waarbij degenen die niet reeds gedurende zes maanden of langer kostwinner zijn van
      een gezin of van de betrekkingen, bedoeld in de [tweede volzin van artikel 40, derde lid][ref1], vóór degenen die
      dit wèl zijn, en binnen deze beide groepen ouderen in leeftijd vóór jongeren gaan;


      [ref1]: https://wetten.overheid.nl/BWBR0028215#Artikel40
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0028215
        artikel: '40'
        hoofdstuk: IV
        paragraaf: '4'
  - number: 94.2.c
    text: zij die op de voet van de bepalingen van het West-Indisch Detacheringsbesluit 1930 werden uitgezonden;
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel94
  - number: 94.2.d
    text: |-
      zij die de leeftijd van dertig jaren nog niet hebben overschreden en niet reeds gedurende zes maanden
      of langer kostwinner zijn van een gezin of van de betrekkingen, bedoeld in de tweede volzin van
      [artikel 40, derde lid][ref1], te beginnen met degenen die de minste dienstjaren hebben;


      [ref1]: https://wetten.overheid.nl/BWBR0028215#Artikel40
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0028215
        artikel: '40'
        hoofdstuk: IV
        paragraaf: '4'
  - number: 94.2.e
    text: zij die de minste dienstjaren hebben.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel94
  - number: '94.3'
    text: |-
      Wanneer het dienstbelang zulks vordert, kan bij verlening van ontslag worden afgeweken van de rangorde, genoemd in
      het vorige lid, met dien verstande dat, indien de omvang van de voorgenomen afvloeiing daartoe aanleiding geeft,
      deze geschiedt op basis van een door het bevoegd gezag vastgesteld plan, dat aan de betrokken ambtenaren kenbaar
      wordt gemaakt.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel94
  - number: '94.4'
    text: |-
      Wanneer krachtens het eerste lid ontslag wordt verleend aan een ambtenaar in tijdelijke dienst, die daaraan
      geen aanspraak op wachtgeld ontleent, wordt een opzeggingstermijn in acht genomen als aangegeven in het
      [tweede lid van artikel 92][ref1]. Het derde en vierde lid van evenbedoeld artikel zijn alsdan van toepassing. In
      alle andere gevallen, waarin krachtens het eerste lid ontslag wordt verleend, wordt een opzeggingstermijn van drie
      maanden in acht genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0028215#Artikel92
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0028215
        artikel: '92'
        hoofdstuk: IX
  - number: '95'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel95
  - number: '96'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel96
  - number: '97'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel97
  - number: '98.1'
    text: |-
      Buiten de gevallen, hiervoren of bij andere wettelijke regelingen bepaald, kan de ambtenaar slechts worden
      ontslagen op grond van:
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel98
  - number: 98.1.a
    text: |-
      verlies van een vereiste bij de aanstelling voor de benoembaarheid gesteld, tenzij het vereiste alleen bij de
      aanvaarding van het ambt geldt;
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel98
  - number: 98.1.b
    text: staat van curatele krachtens onherroepelijk geworden rechterlijke uitspraak;
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel98
  - number: 98.1.c
    text: toepassing van lijfsdwang wegens schulden, krachtens onherroepelijk geworden rechterlijke uitspraak;
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel98
  - number: 98.1.d
    text: onherroepelijk geworden veroordeling tot vrijheidsstraf wegens misdrijf;
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel98
  - number: 98.1.e
    text: blijvende ongeschiktheid voor de vervulling van zijn ambt als gevolg van een ziekte of gebrek;.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel98
  - number: 98.1.f
    text: onbekwaamheid of ongeschiktheid voor het door hem beklede ambt, anders dan op grond van ziels- of lichaamsgebreken;
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel98
  - number: 98.1.g
    text: |-
      het niet behaald hebben van het (de) diploma(’s) bedoeld in [artikel 5, vijfde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0028215#Artikel5
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel98
    references:
      - id: ref1
        bwb_id: BWBR0028215
        artikel: '5'
        hoofdstuk: II
  - number: 98.1.h
    text: het willekeurig verbreken van het dienstverband door de ambtenaar.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel98
  - number: '98.2'
    text: |-
      Behalve in het geval onder d van het eerste lid bedoeld wordt een ontslag op grond van dit artikel steeds eervol
      verleend. Het kan niet vroeger ingaan dan de dag, volgende op die, waarop de reden voor het ontslag voor het eerst
      geconstateerd en in de gevallen bedoeld in het eerste lid onder a, e, f en g tevens door of namens het bevoegde
      gezag aan de betrokkene is medegedeeld.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel98
  - number: '98.3'
    text: |-
      Het ontslag op de in onderdeel e van het eerste lid bedoelde grond wordt eerst verleend, nadat ter zake van de
      ongeschiktheid een geneeskundig onderzoek is ingesteld.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel98
  - number: '98.4'
    text: |-
      Het geneeskundig onderzoek, in het voorgaande lid voorgeschreven, geschiedt in de openbare lichamen door de
      geneeskundige commissie, bedoeld in artikel 14, derde lid, onderdeel a, van de Pensioenwet ambtenaren BES, en
      in andere gevallen door een of meer geneeskundigen, aan te wijzen door Onze Minister van Binnenlandse Zaken
      en Koninkrijksrelaties. De nadere regels, bedoeld in het vierde lid van het laatstgenoemde artikel, zijn van
      toepassing.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel98
  - number: '99.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld inzake de toekenning van wachtgeld of een
      geldsom aan ambtenaren.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel99
  - number: '99.2'
    text: |-
      Personen die opzettelijk handelen in strijd met regels krachtens het eerste lid, onder b, die betrekking hebben op
      de geheimhouding van inlichtingen en stukken, worden gestraft met een gevangenisstraf van ten hoogste 6 maanden of
      een geldboete van de derde categorie.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel99
  - number: '99.3'
    text: |-
      Personen aan wiens schuld het handelen in strijd met regels krachtens het eerste lid, onder b, die betrekking
      hebben op de geheimhouding van inlichtingen en stukken, te wijten is, wordt gestraft met een hechtenis van ten
      hoogste drie maanden of een geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel99
  - number: '99.4'
    text: |-
      Geen vervolging van personen, bedoeld in het tweede en derde lid, heeft plaats dan op klachte van hem, te wiens
      aanzien de geheimhouding is geschonden.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel99
  - number: '99.5'
    text: De in het tweede en derde lid bedoelde strafbare feiten zijn misdrijven.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel99
  - number: '100'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld inzake de toekenning van een geldsom of van
      investeringsfaciliteiten aan personen die op eigen verzoek, doch gevolg gevend aan een uitnodiging van het bevoegd
      gezag tot het doen van dat verzoek, zijn ontslagen.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel100
  - number: '101'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld inzake de structuur van het overleg inzake
      aangelegenheden van algemeen belang betreffende de rechtstoestand van ambtenaren.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel101
  - number: 101 t/m 109
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel101_tm_109
  - number: '110.1'
    text: |-
      Onder bezoldiging wordt in dit hoofdstuk verstaan het geldsbedrag, dat een ambtenaar tijdens zijn ambtsbetrekking
      ter beloning van de door hem bewezen diensten, onder welke benaming ook, geniet, na aftrek van hetgeen hem in
      mindering wordt gebracht voor verhaal van pensioenbijdragen.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel110
  - number: '110.2'
    text: Onder bezoldiging is in dit hoofdstuk wachtgeld begrepen.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel110
  - number: '110.3'
    text: |-
      Voor de toepassing van de bepalingen van dit hoofdstuk wordt een ter beschikking van een openbaar lichaam gestelde
      ambtenaar in dienst van de staat geacht in dienst van dat openbaar lichaam te zijn.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel110
  - number: '111.1'
    text: |-
      Op de door de overheid en de openbare lichamen verschuldigde bezoldigingen kan worden ingehouden, hetgeen de
      ambtenaar aan hen zelf verschuldigd is.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel111
  - number: '111.2'
    text: |-
      Belastingen en retributies worden geacht ten deze tevens verschuldigd te zijn aan het lichaam, met de invordering
      belast.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel111
  - number: '112'
    text: Ten aanzien van een op een bezoldiging gelegd beslag, gelden de bepalingen van het gemene recht.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel112
  - number: '113.1'
    text: |-
      De overheid kan op de door haar verschuldigde bezoldigingen ten behoeve van schuldeisers van de ambtenaar kortingen
      toepassen voor vorderingen mits deze door de ambtenaar, naar aanleiding van het verzoek om de korting toe te
      passen, schriftelijk worden erkend.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel113
  - number: '113.2'
    text: |-
      Als door de ambtenaar erkend gelden mede de vorderingen, waarvan het bestaan blijkt uit een in kracht van gewijsde
      gegane rechterlijke uitspraak of van een authentieke akte in executoriale vorm.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel113
  - number: '114.1'
    text: Bezoldigingen zijn voor inhouden, beslag of korting vatbaar voor één derde gedeelte.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel114
  - number: '114.2'
    text: 'Deze beperking geldt evenwel niet ten aanzien van inhouding, beslag of korting:'
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel114
  - number: 114.2.a
    text: tot verhaal van onderhoudsgelden waarvan de verplichting tot betaling bij rechterlijke uitspraak is opgelegd;
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel114
  - number: 114.2.b
    text: terzake van een disciplinaire strafoplegging;
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel114
  - number: 114.2.c
    text: tot verhaal van een boete door de strafrechter of een bijzonder gerecht opgelegd;
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel114
  - number: 114.2.d
    text: |-
      tot verhaal van vergoeding van schade, door de ambtenaar in verband met de uitoefening van de dienst aan de
      overheid toegebracht door onrechtmatige handelingen of door het nalaten van de zorg waartoe hij gehouden is.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel114
  - number: '114.3'
    text: |-
      Bezoldigingen zijn tot de helft vatbaar voor inhouding, beslag en korting, tot verhaal van hetgeen op de
      bezoldiging is vooruitbetaald, voorgeschoten of te veel betaald.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel114
  - number: '115.1'
    text: |-
      In geval van faillissement van de ambtenaar wordt het gedeelte van de bezoldiging, hetwelk ingevolge beschikking
      van de rechter-commissaris niet aan de gefailleerde behoeft te worden uitgekeerd, gekort ten behoeve van de
      curator, voor zover daarop geen inhouding heeft plaats gehad.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel115
  - number: '115.2'
    text: Faillissement van de ambtenaar en hem verleende surséance van betaling sluiten overigens korting uit.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel115
  - number: '116'
    text: |-
      In geval van samenloop van inhouding, beslag en korting, zal, ongeacht in welke tijdsorde zij plaats hebben, het
      vatbare gedeelte van de bezoldiging eerst worden ingehouden; van het overblijvende zal ten hoogste één vierde
      geacht worden beslagen te zijn en van het alsdan overblijvende zal ten hoogste één vierde kunnen worden gekort.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel116
  - number: '117.1'
    text: |-
      Indien een ingehouden, in beslag genomen of gekort bedrag tussen meer dan een schuldeiser moet worden verdeeld,
      geschiedt de verdeling naar evenredigheid der vorderingen, voorzover niet de ene schuldeiser voorrang heeft boven
      de andere.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel117
  - number: '117.2'
    text: |-
      Indien naast vorderingen, voor welke de beperkingen van [artikel 114, eerste lid][ref1] niet gelden, ook andere in
      de verdeling moeten worden begrepen, wordt eerst het in artikel 114, eerste lid, bepaalde deel van dit bedrag onder
      alle schuldeisers zonder onderscheid verdeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0028215#Artikel114
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel117
    references:
      - id: ref1
        bwb_id: BWBR0028215
        artikel: '114'
        hoofdstuk: XI
        paragraaf: '5'
  - number: '118.1'
    text: |-
      Overdracht of inpandgeving, waardoor de ambtenaar enig recht op bezoldiging aan een derde toekent, is slechts
      geldig, indien zij geschiedt met goedkeuring van de overheid, die hem de bezoldiging toegekend heeft.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel118
  - number: '118.2'
    text: Zij is slechts geldig tot ten hoogste één derde gedeelte van de bezoldiging.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel118
  - number: '118.3'
    text: |-
      Zij kan slechts geschieden bij hetzij authentieke akte, hetzij onderhandse in tweevoud opgemaakte akte, mits
      deze laatste geregistreerd is en geheel geschreven is met de hand van de ambtenaar die zelve ondertekend heeft of
      daaronder door deze geschreven is een goedkeuring, houdende voluitgeschreven in letters het overgedragen of in pand
      gegeven bedrag of gedeelte van zijn bezoldiging.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel118
  - number: '118.4'
    text: |-
      Een afschrift van de authentieke akte dan wel een der dubbelen van de onderhandse akte moet bij de in het eerste
      lid bedoelde overheid worden ingeleverd.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel118
  - number: 118a
    text: |-
      Tenzij in bijzondere wetgeving anders is bepaald, verjaren rechtsvorderingen ter zake van bezoldiging, pensioenen
      en andere geldelijke aanspraken, verschuldigd krachtens een rechtsverhouding waarop dit hoofdstuk van toepassing of
      van overeenkomstige toepassing is, door verloop van vijf jaren na de aanvang van de dag, volgend op die waarop de
      vordering opeisbaar is geworden. De [artikelen 316 tot en met 323 van Boek 3 van het Burgerlijk Wetboek BES][ref1]
      zijn van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028745#Artikel316
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel118a
    references:
      - id: ref1
        bwb_id: BWBR0028745
        artikel: '316'
  - number: '119.1'
    text: |-
      Aan een ambtenaar, die krachtens benoeming door Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties in
      openbare dienst hier te lande werkzaam zijnde, tot een door de Koning te begeven openbare betrekking hier te lande
      wordt benoemd, wordt door Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties met ingang van de dag van de
      aanvaarding van de nieuwe betrekking eervol ontslag verleend.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel119
  - number: '119.2'
    text: |-
      Aan een ambtenaar, die krachtens benoeming door de eilandsraad of het bestuurscollege in openbare dienst hier te
      lande werkzaam zijnde, tot een door de Koning te begeven openbare betrekking hier te lande wordt benoemd, wordt
      door de eilandsraad c.q. het bestuurscollege met ingang van de dag van de aanvaarding van de nieuwe betrekking
      eervol ontslag verleend.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel119
  - number: '120'
    text: |-
      Op de door de Koning benoemde ambtenaren zijn van toepassing de [artikelen 3][ref1], [4][ref2], [14][ref3],
      [17][ref4], [21][ref5], [22][ref6], [23][ref7], [29][ref8], [40][ref9], [41][ref10], [43][ref11], [45][ref12],
      [51][ref13], [66][ref14], [72][ref15], [73][ref16], [74][ref17], [80][ref18] en [119][ref19]. Mede zijn op deze
      ambtenaren van toepassing [paragraaf 9 van hoofdstuk VII][ref20], en de [hoofdstukken XI][ref21] en [XIII][ref22].
      De toepassing van de [artikelen 111, eerste lid][ref23], [113, eerste lid][ref24], [114, eerste lid][ref25], en
      [118, eerste lid][ref26], geschiedt door Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties.


