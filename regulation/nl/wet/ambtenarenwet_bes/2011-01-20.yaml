        artikel: '24'
        hoofdstuk: IV
        paragraaf: '1'
  - number: 124b
    text: |-
      Bij regeling van Onze Minister kunnen regels worden gesteld met betrekking tot voor het tijdstip van
      inwerkingtreding van artikel I, tweede lid, van de Rijkswet wijziging Statuut in verband met de opheffing van de
      Nederlandse Antillen door ambtenaren in hun hoedanigheid van ambtenaar in de zin van de Landsverordening Materieel
      Ambtenarenrecht opgebouwde of verworven rechten en aanspraken.
    url: https://wetten.overheid.nl/BWBR0028215/2011-01-20#Artikel124b
