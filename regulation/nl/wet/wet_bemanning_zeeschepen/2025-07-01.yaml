  - number: '38'
    text: |-
      1 Onze Minister geeft op aanvraag van de scheepsbeheerder een visserij-arbeidscertificaat af voor een
      vissersvaartuig dat gewoonlijk per reis meer dan drie dagen op zee verblijft en een lengte heeft van 24 meter
      of meer dan wel normaliter vaart op een afstand van meer dan 200 zeemijl tot de Nederlandse kustlijn, indien na
      onderzoek is gebleken dat het desbetreffende vissersvaartuig ten minste voldoet aan de eisen van het C188-verdrag.

      2 De scheepsbeheerder draagt er zorg voor dat de eisen voortkomend uit het C188-verdrag voortdurend worden
      nageleefd.

      3 Bij algemene maatregel van bestuur worden nadere regels gesteld over de wijze waarop voldaan moet worden aan de
      eisen van het C188-verdrag en de wijze waarop dat aan boord wordt bekendgemaakt.

      4 Bij ministeriële regeling worden regels gesteld met betrekking tot de eisen voor de verkrijging, geldigheid,
      verlenging en intrekking van een visserij-arbeidscertificaat.
    url: https://wetten.overheid.nl/BWBR0050681/2025-07-01#Artikel38
  - number: '39'
    text: |-
      1 Onze Minister wijst ambtenaren aan die worden belast met de behandeling van een aanvraag als bedoeld in
      [artikel 35, eerste lid][ref1], [37, eerste lid][ref2], of [38, eerste lid][ref3], en met het verrichten van het
      onderzoek als bedoeld in artikel 37, eerste, derde en vijfde lid, of 38, eerste lid. De behandeling van de aanvraag
      of het onderzoek kunnen tevens geheel of ten dele worden verricht door daartoe door Onze Minister aangewezen
      rechtspersonen.

      2 Aan een aanwijzing als bedoeld in het eerste lid kunnen voorschriften worden verbonden.

      3 Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de aanwijzing van natuurlijke
      personen of rechtspersonen krachtens het eerste lid.

      4 Onze Minister kan slechts door hem erkende natuurlijke personen of rechtspersonen aanwijzen. Bij ministeriële
      regeling worden regels gesteld met betrekking tot de wijze van erkenning, de voorwaarden voor erkenning, de
      intrekking van de erkenning indien niet meer aan deze voorwaarden wordt voldaan en de bekendmaking van een
      erkenning of intrekking van een erkenning.

      5 Bij ministeriële regeling worden regels gesteld met betrekking tot:

      a. onderzoeken waaraan een zeeschip wordt onderworpen ter verkrijging en verlenging van een certificaat maritieme
      arbeid, een verklaring naleving maritieme arbeid deel I of een visserij-arbeidscertificaat, alsmede de inhoud van
      die onderzoeken en de frequentie waarmee zij worden verricht;

      b. de registratie van de bij de inspectie verzamelde onderzoeksgegevens.


