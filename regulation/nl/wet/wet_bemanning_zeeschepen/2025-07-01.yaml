  - number: '45'
    text: |-
      De voorzitter, de plaatsvervangende voorzitters, de leden, de plaatsvervangende leden van het tuchtcollege
      ontvangen een bij ministeriële regeling vast te stellen vacatiegeld, alsmede een vergoeding van reis- en
      verblijfkosten en van verdere verschotten.
    url: https://wetten.overheid.nl/BWBR0050681/2025-07-01#Artikel45
  - number: '46'
    text: |-
      1 Het tuchtcollege heeft een secretaris en twee plaatsvervangende secretarissen.

      2 Bij algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot de ervaringseisen van de
      secretaris en de plaatsvervangende secretarissen.

      3 De secretaris en de plaatsvervangende secretarissen worden door Onze Minister benoemd, geschorst en ontslagen.
    url: https://wetten.overheid.nl/BWBR0050681/2025-07-01#Artikel46
  - number: '47'
    text: |-
      1 De voorzitter, de leden en de secretaris, alsmede hun plaatsvervangers, mogen zich niet op enige wijze inlaten
      met partijen of hun raadslieden of gemachtigden over enige zaak die bij het tuchtcollege voor de scheepvaart
      aanhangig is, of waarvan zij weten of kunnen vermoeden dat deze bij het tuchtcollege voor de scheepvaart aanhangig
      zal worden gemaakt.

      2 Zij zijn verplicht tot geheimhouding van de gegevens waarover zij bij de uitoefening van hun taak de beschikking
      krijgen en waarvan zij het vertrouwelijk karakter kennen of redelijkerwijs moeten vermoeden, behoudens voor zover
      enig wettelijk voorschrift hen tot mededeling verplicht of uit hun taak de noodzaak tot mededeling voortvloeit.

      3 Zij zijn verplicht tot geheimhouding van hetgeen in de raadkamer over aanhangige zaken is geuit.
    url: https://wetten.overheid.nl/BWBR0050681/2025-07-01#Artikel47
  - number: '48'
    text: |-
      1 Een zaak wordt in eerste aanleg bij het tuchtcollege aanhangig gemaakt op verzoek van Onze Minister of door een
      klacht van een belanghebbende.

      2 Bij algemene maatregel van bestuur worden nadere regels gesteld over de wijze waarop een zaak aanhangig wordt
      gemaakt en de procedure die gevolgd wordt bij het in behandeling nemen van een verzoek of klacht.

      3 Het tuchtcollege neemt een verzoek of een klacht niet in behandeling indien de gedraging waarop het verzoek of de
      klacht betrekking heeft meer dan twee jaren voor de indiening van het verzoek of de klacht heeft plaats gevonden.
    url: https://wetten.overheid.nl/BWBR0050681/2025-07-01#Artikel48
  - number: '49'
    text: |-
      1 De voorzitter kan een verzoek of een klacht na een summier onderzoek terstond afwijzen bij een met redenen
      omklede beslissing indien hij van oordeel is dat de klager kennelijk niet ontvankelijk is, dan wel het verzoek of
      de klacht kennelijk ongegrond is.

      2 De secretaris zendt onverwijld een afschrift van de schriftelijke beslissing van de voorzitter aan Onze Minister
      en aan de klager.

      3 Onze Minister en de klager kunnen binnen twee weken na de dag van verzending van de beslissing van de
      voorzitter tot afwijzing van een verzoek of een klacht hiertegen schriftelijk of elektronisch verzet doen bij het
      tuchtcollege. Ten gevolge van het verzet vervalt de beslissing van de voorzitter.

      4 Indien de voorzitter van oordeel is dat een verzoek of een klacht vatbaar is voor een minnelijke schikking, roept
      hij Onze Minister of de klager alsmede de betrokken kapitein of officier op teneinde een zodanige schikking te
      beproeven. Indien een minnelijke schikking is getroffen, wordt het verzoek of de klacht ingetrokken.

      5 De voorzitter brengt verzoeken en klachten die niet door hem zijn afgewezen of niet in der minne zijn geschikt,
      onverwijld ter kennis van het tuchtcollege.
    url: https://wetten.overheid.nl/BWBR0050681/2025-07-01#Artikel49
  - number: '50'
    text: |-
      1 Zodra het tuchtcollege een verzoek of een klacht in behandeling heeft genomen, deelt de secretaris dit
      schriftelijk mede aan de betrokken kapitein of officier en zendt de secretaris daarbij een afschrift van het
      verzoek of de klacht.

      2 De betrokken kapitein of officier kan binnen zes weken na de dag van verzending van de schriftelijke mededeling,
      bedoeld in het eerste lid, schriftelijk of elektronisch een verweerschrift indienen. De voorzitter kan deze termijn
      op grond van een gemotiveerd verzoek van de betrokken kapitein of officier verlengen.

      3 De secretaris zendt een afschrift van het verweerschrift aan degene die het verzoek of de klacht bij de
      voorzitter heeft ingediend.
    url: https://wetten.overheid.nl/BWBR0050681/2025-07-01#Artikel50
  - number: '51'
    text: |-
      1 De voorzitter kan ambtshalve of op gemotiveerd verzoek van Onze Minister, de klager of de betrokkene besluiten
      tot het instellen van een vooronderzoek, in welk geval hij de uitvoering van het vooronderzoek opdraagt aan
      een of meer leden of plaatsvervangende leden of aan de secretaris of een plaatsvervangende secretaris van het
      tuchtcollege.

      2 Degene die het vooronderzoek verricht is bevoegd:

      a. voor het verrichten van onderzoek ter plaatse elke plaats te betreden die hij noodzakelijk acht, zo nodig met
      behulp van de sterke arm, met uitzondering van een woning zonder toestemming van de bewoner;

      b. kennis te nemen van alle schriftelijke stukken en gegevens in geautomatiseerde werken die zich aan boord
      bevinden, waarvan hij kennisneming in het belang van het onderzoek acht, en daarvan afschriften te maken;

      c. de klager, alsmede de betrokken kapitein of officier te horen;

      d. getuigen en deskundigen te horen, waarbij het bepaalde in [artikel 55, vijfde, zesde en zevende lid][ref1], van
      overeenkomstige toepassing is;

      e. alle inlichtingen te vragen over een zaak als bedoeld in [artikel 48, eerste lid][ref2].

      3 Degene die het vooronderzoek heeft verricht neemt geen deel aan de behandeling van de zaak ter zitting van het
      tuchtcollege.

      4 Betrokkenen ontvangen van de secretaris een verslag van het vooronderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0050681#Artikel55
      [ref2]: https://wetten.overheid.nl/BWBR0050681#Artikel48
