  - number: '52'
    text: |-
      1 Aan de behandeling van een zaak ter zitting van het tuchtcollege nemen vijf leden deel, te weten de voorzitter of
      een van zijn plaatsvervangers, alsmede:

      a. de vier leden die gedurende de aan hun benoeming voorafgaande periode van tien jaren ten minste vijf jaren
      als kapitein of als officier aan boord van een ander zeeschip dan een vissersvaartuig hebben gevaren, indien
      het verzoek of de klacht betrekking heeft op de kapitein of een officier van een ander zeeschip dan een
      vissersvaartuig, met de mogelijkheid van plaatsvervanging, of

      b. de vier leden die gedurende de aan hun benoeming voorafgaande periode van tien jaren ten minste vijf jaren
      als schipper of als officier aan boord van een vissersvaartuig hebben gevaren, indien het verzoek of de klacht
      betrekking heeft op de schipper of een officier van een vissersvaartuig, met de mogelijkheid van plaatsvervanging.

      2 De voorzitter kan, indien de zaak het vereist, bepalen dat aan de behandeling van die zaak ter zitting van het
      tuchtcollege, een of twee plaatsvervangende leden deelnemen in plaats van de krachtens het eerste lid, aanhef en
      onder a of b voor behandeling aangewezen leden. In geval van staking van stemmen is de stem van de voorzitter of
      zijn plaatsvervanger beslissend.

      3 De voorzitter kan, indien een zaak hem daartoe geschikt voorkomt, bepalen dat aan de behandeling van die zaak
      ter zitting van het tuchtcollege, in afwijking van het bepaalde in het eerste lid, drie leden deelnemen, te weten
      de voorzitter of een van zijn plaatsvervangers, alsmede twee van de vier leden, bedoeld in het eerste lid, onder a
      of b.

      4 Bij de behandeling van een zaak ter zitting van het tuchtcollege na verzet als bedoeld in
      [artikel 49, derde lid][ref1], wordt de voorzitter vervangen door een van zijn plaatsvervangers.


      [ref1]: https://wetten.overheid.nl/BWBR0050681#Artikel49
