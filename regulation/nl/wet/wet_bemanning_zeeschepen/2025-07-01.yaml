  - number: '35'
    text: |-
      1 Onze Minister geeft op aanvraag van de scheepsbeheerder van een zeeschip van 500 GT of meer dat internationale
      reizen maakt, anders dan een vissersvaartuig, een verklaring naleving maritieme arbeid deel I af als bedoeld in het
      MLC-verdrag.

      2 Bij ministeriële regeling kunnen regels worden gesteld over de aanvraag, de inhoud en het model van de verklaring
      naleving maritieme arbeid deel I.
    url: https://wetten.overheid.nl/BWBR0050681/2025-07-01#Artikel35
  - number: '36'
    text: |-
      1 De scheepsbeheerder van een zeeschip van 500 GT of meer dat internationale reizen maakt, anders dan een
      vissersvaartuig, stelt een verklaring naleving maritieme arbeid deel II op waarin maatregelen zijn opgenomen om te
      waarborgen dat de voorschriften bedoeld in Aanhangsel A5-1 van het MLC-verdrag voortdurend worden nageleefd.

      2 De scheepsbeheerder draagt er zorg voor dat de maatregelen, bedoeld in het eerste lid, voortdurend worden
      nageleefd.

      3 Bij ministeriële regeling kunnen regels worden gesteld over de inhoud en het model van de verklaring naleving
      maritieme arbeid deel II.
    url: https://wetten.overheid.nl/BWBR0050681/2025-07-01#Artikel36
  - number: '37'
    text: |-
      1 Onze Minister geeft op aanvraag van de scheepbeheerder een certificaat maritieme arbeid af voor een zeeschip van
      500 GT of meer dat internationale reizen maakt, anders dan een vissersvaartuig, indien de door de scheepsbeheerder
      opgestelde verklaring naleving maritieme arbeid deel II ten minste voldoet aan het bepaalde krachtens
      [artikel 35][ref1] of [36][ref2] en na onderzoek is gebleken dat het desbetreffende zeeschip voldoet aan de eisen,
      bedoeld in aanhangsel A5-I van het MLC-verdrag.

      2 Bij algemene maatregel van bestuur worden nadere regels gesteld over de wijze waarop voldaan moet worden aan de
      eisen van het MLC-verdrag en de wijze waarop dat aan boord wordt bekendgemaakt.

      3 Onze Minister kan op verzoek van de scheepsbeheerder een voorlopig certificaat maritieme arbeid afgeven. De
      [artikelen 35][ref3] en [36][ref4] zijn niet van toepassing op dat verzoek.

      4 Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot de eisen voor de
      verkrijging, geldigheid, verlenging en intrekking van een certificaat maritieme arbeid, een verklaring naleving
      maritieme arbeid of een voorlopig certificaat maritieme arbeid.

      5 Op verzoek van de scheepsbeheerder geeft Onze Minister voor een zeeschip kleiner dan 500 GT, anders dan een
      vissersvaartuig, overeenkomstig het bepaalde bij of krachtens dit artikel een certificaat maritieme arbeid af. De
      [artikelen 35][ref5] en [36][ref6] zijn van overeenkomstige toepassing.


