  - number: '61'
    text: |-
      1 Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de ambtenaren van de
      Inspectie Leefomgeving en Transport, alsmede de bij besluit van Onze Minister aangewezen ambtenaren.

      2 Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.

      3 Onze Minister kan de aan een toezichthouder toekomende bevoegdheden als bedoeld in [artikel 63][ref1] beperken.


      [ref1]: https://wetten.overheid.nl/BWBR0050681#Artikel63
    url: https://wetten.overheid.nl/BWBR0050681/2025-07-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0050681
        artikel: '63'
        hoofdstuk: '6'
  - number: '62'
    text: |-
      Met het opsporen van feiten, die bij of krachtens deze wet strafbaar zijn gesteld, zijn belast:

      a. de bij of krachtens [artikel 141 Wetboek van Strafvordering][ref1] aangewezen personen;

      b. de opsporingsambtenaren van de Inspectie Leefomgeving en Transport.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0050681/2025-07-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
  - number: '63'
    text: |-
      1 De in [artikel 61, eerste lid][ref1], bedoelde toezichthouder is bevoegd zaken en zeeschepen te onderzoeken met
      betrekking waartoe hij een toezichthoudende taak heeft.

      2 Hij is bevoegd met het oog op de uitoefening van deze bevoegdheden, in geval van gegrond vermoeden dat in strijd
      wordt gehandeld met enige verplichting ingevolge deze wet, van de kapitein van een zeeschip te vorderen dat deze
      het zeeschip gaande houdt dan wel naar een door hem aangewezen veilige ligplaats of ankerplaats brengt.

      3 Hij is bevoegd ter uitoefening van zijn bevoegdheden ingevolge deze wet elke plaats te betreden, met inbegrip van
      woongedeelten van zeeschepen.


      [ref1]: https://wetten.overheid.nl/BWBR0050681#Artikel61
    url: https://wetten.overheid.nl/BWBR0050681/2025-07-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0050681
        artikel: '61'
        hoofdstuk: '6'
  - number: '64'
    text: |-
      1 De ambtenaar van de Inspectie Leefomgeving en Transport is bevoegd een zeeschip aan te houden, indien er
      voorafgaand aan het vertrek naar zee:

      a. geen bemanningscertificaat voor het zeeschip is afgegeven of het bemanningscertificaat ongeldig is;

      b. de door hem aangetroffen bemanning niet ten minste in overeenstemming is met het bemanningscertificaat;

      c. van het zeeschip kennelijk een ander gebruik wordt of zal worden gemaakt dan overeenkomstig de beperkingen of
      voorwaarden vermeld in het bemanningscertificaat;

      d. geen certificaat maritieme arbeid is afgegeven of het certificaat maritieme arbeid ongeldig is indien het
      brutotonnage van dat zeeschip 500 GT of meer, anders dan een vissersvaartuig bedraagt en internationale reizen
      maakt;

      e. geen visserij-arbeidscertificaat is afgegeven of het visserij-arbeidscertificaat ongeldig is van een
      vissersvaartuig indien dat gewoonlijk per reis meer dan drie dagen op zee verblijft en een lengte heeft van
      24 meter of meer dan wel normaliter vaart op een afstand van meer dan 200 zeemijl tot de Nederlandse kustlijn.

      f. er sprake is van een ernstige of herhaalde schending van het MLC-verdrag dan wel, voor een vissersvaartuig, het
      C188-verdrag; of

      g. er ernstig gevaar bestaat voor de veiligheid, gezondheid of beveiliging van de zeevarenden.

      2 De ambtenaar van de Inspectie Leefomgeving en Transport is eveneens bevoegd een
      zeeschip aan te houden, indien de toezichthouder dan wel de inspecteur, bedoeld in
      [artikel 1:3, eerste lid, onderdeel c, van de Algemene douanewet][ref1] de toegang tot het zeeschip wordt geweigerd
      of indien geen medewerking aan diens onderzoek wordt gegeven.

      3 De aanhouding wordt opgeheven, zodra de reden voor de aanhouding is komen te vervallen.


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel13
    url: https://wetten.overheid.nl/BWBR0050681/2025-07-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0023746
        artikel: 1:3
  - number: '65'
    text: |-
      1 De ambtenaar van de Inspectie Leefomgeving en Transport stelt Onze Minister onverwijld in kennis van de
      aanhouding en van de redenen voor de aanhouding.

      2 Van een besluit tot aanhouding van een zeeschip of tot opheffing van de aanhouding worden voorts de betrokken
      ambtenaar van de rijksbelastingdienst, bevoegd inzake douane en de havenmeester van de haven van aanhouding, in
      kennis gesteld.

      3 De in het tweede lid bedoelde ambtenaar verleent geen expeditie voor het betrokken zeeschip indien hij een
      mededeling van aanhouding heeft ontvangen en zolang hij geen mededeling van opheffing heeft ontvangen.
    url: https://wetten.overheid.nl/BWBR0050681/2025-07-01#Artikel65
  - number: '66'
    text: |-
      Tegen een op grond van deze wet genomen besluit van een ambtenaar van de Inspectie Leefomgeving en Transport tot
      aanhouding van een zeeschip, kan iedere belanghebbende administratief beroep instellen bij Onze Minister.
    url: https://wetten.overheid.nl/BWBR0050681/2025-07-01#Artikel66
  - number: '67'
    text: |-
      Het is verboden zeevarenden te straffen of op enige andere wijze te benadelen voor het indienen van een klacht als
      bedoeld in [artikel 6, eerste lid][ref1], of [40, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0050681#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0050681#Artikel40
