  - number: '8'
    text: |-
      De kapitein en de officieren gedragen zich aan boord ten opzichte van de opvarenden, het schip, de lading, het
      milieu en het scheepvaartverkeer zoals het een goed zeeman betaamt.
    url: https://wetten.overheid.nl/BWBR0050681/2025-07-01#Artikel8
  - number: '9'
    text: |-
      1 De kapitein draagt er zorg voor dat de bemanning van het zeeschip te allen tijde berekend is op het verrichten
      van de werkzaamheden aan boord gelet op de bedrijfsvoering van het zeeschip, de lading, het milieu of het
      scheepvaartverkeer en kan daartoe noodzakelijke maatregelen nemen, waaronder de maatregel om het schip niet te
      laten uitvaren.

      2 De kapitein draagt er zorg voor dat het wachtpersoneel de beginselen van een veilige wacht in acht neemt
      in overeenstemming met de voorschriften VIII/1 en VIII/2 van de bijlage bij het STCW-verdrag dan wel, voor
      vissersvaartuigen, de voorschriften voor een veilige wacht in overeenstemming met voorschrift 1 van hoofdstuk IV
      van de annex bij het STCW F-verdrag.

      3 De kapitein draagt er zorg voor dat een op grond van [hoofdstuk 3][ref1] vereist vaarbevoegdheidsbewijs,
      bekwaamheidsbewijs of schriftelijk bewijs aan boord aanwezig is.

      4 De kapitein organiseert de werkzaamheden en de wachtindeling zodanig dat het wachtpersoneel voldoende uitgerust
      en anderszins geschikt is om dienst te doen bij aanvang van de wacht.

      5 De kapitein verlaat het zeeschip niet gedurende de vaart of bij dreigend gevaar, tenzij zijn afwezigheid
      volstrekt noodzakelijk is of de zorg voor lijfsbehoud hem daartoe dwingt.

      6 Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de uitvoering van het eerste tot
      en met vierde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0050681#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0050681/2025-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0050681
        hoofdstuk: '3'
  - number: '10'
    text: |-
      1 De kapitein is belast met de handhaving van de openbare orde aan boord van het zeeschip en oefent aan boord
      over alle opvarenden disciplinair gezag uit. Hij kan tot handhaving van dit gezag de maatregelen nemen die
      redelijkerwijs nodig zijn.

      2 De opvarenden zijn verplicht de bevelen op te volgen die door de kapitein worden gegeven in het belang van de
      veiligheid of tot handhaving van de orde, met inbegrip van de openbare orde.
    url: https://wetten.overheid.nl/BWBR0050681/2025-07-01#Artikel10
  - number: '11'
    text: |-
      De kapitein belast een zeevarende met werkzaamheden aan boord waarvoor een vaarbevoegdheidsbewijs is vereist of
      andere beroepseisen zijn vastgesteld alleen voor zover die zeevarende beschikt over het daarvoor benodigde geldig
      vaarbevoegdheidsbewijs of voldoet aan de daarvoor benodigde beroepseisen.
    url: https://wetten.overheid.nl/BWBR0050681/2025-07-01#Artikel11
  - number: '12'
    text: |-
      1 Een opvarende verlaat het zeeschip niet zonder toestemming van de kapitein.

      2 Toestemming van de kapitein is niet nodig voor het in een haven verlaten van het zeeschip voor het, wanneer dit
      mogelijk is, onverwijld raadplegen van een arts of tandarts door een zeevarende.
    url: https://wetten.overheid.nl/BWBR0050681/2025-07-01#Artikel12
  - number: '13'
    text: |-
      De kapitein vermeldt een weigering van toestemming om het zeeschip te verlaten aan een zeevarende en de reden
      daarvoor in het scheepsdagboek en verstrekt desgevraagd aan de zeevarende binnen twaalf uur een schriftelijke
      bevestiging daarvan.
    url: https://wetten.overheid.nl/BWBR0050681/2025-07-01#Artikel13
  - number: '14'
    text: |-
      De kapitein oefent zijn gezag uit zodra hij aan boord is en het gezag heeft aanvaard of overgenomen, en zolang hij
      het gezag niet heeft overgedragen of de scheepsbeheerder hem het gezag niet heeft ontnomen.
    url: https://wetten.overheid.nl/BWBR0050681/2025-07-01#Artikel14
  - number: '15'
    text: |-
      1 In geval de kapitein aan boord van een zeeschip niet meer kan functioneren, treedt als kapitein op de eerste
      stuurman, onderscheidenlijk de eerste maritiem officier. Indien geen eerste stuurman of eerste maritiem officier
      aanwezig is, treedt als kapitein op een door de scheepsbeheerder aangewezen persoon.

      2 In geval de schipper aan boord van een vissersvaartuig niet meer kan functioneren, treedt als schipper op de
      plaatsvervangend schipper of, bij afwezigheid van een plaatsvervangend schipper, een door de scheepsbeheerder
      aangewezen persoon.
    url: https://wetten.overheid.nl/BWBR0050681/2025-07-01#Artikel15
  - number: '16'
    text: |-
      1 De kapitein is tegenover de scheepsbeheerder verplicht te handelen overeenkomstig de hem door de scheepsbeheerder
      gegeven orders, mits deze orders niet in strijd zijn met de verplichtingen, hem als kapitein door de wet opgelegd.

      2 De kapitein stelt de scheepsbeheerder in kennis van alles wat het zeeschip en de zaken aan boord betreft.

      3 Indien de omstandigheden daartoe aanleiding geven bij de toepassing van [artikel 9, eerste lid][ref1], verzoekt
      de kapitein de scheepsbeheerder gemotiveerd hem voor een bepaald tijdstip de benodigde aanvullende middelen te
      verschaffen. Een mondeling verzoek wordt zo spoedig mogelijk schriftelijk bevestigd.

      4 Indien de scheepsbeheerder niet tijdig of geen gevolg geeft aan het verzoek, bedoeld in het derde lid, stelt de
      kapitein Onze Minister daarvan in kennis.


      [ref1]: https://wetten.overheid.nl/BWBR0050681#Artikel9
    url: https://wetten.overheid.nl/BWBR0050681/2025-07-01#Artikel16
