  - number: '68'
    text: |-
      Het is verboden met een zeeschip naar zee te gaan, een zeeschip naar zee te doen gaan of op zee dan wel op buiten
      Nederland gelegen wateren die ter plaatse als binnenwater worden aangemerkt, te gebruiken of te doen gebruiken,
      zonder dat aan boord van het zeeschip een geldig bemanningscertificaat voorhanden is.
    url: https://wetten.overheid.nl/BWBR0050681/2025-07-01#Artikel68
  - number: '69'
    text: |-
      Het is verboden:

      a. een zeeschip te bemannen met minder bemanningsleden dan is aangegeven in het bemanningscertificaat, bedoeld
      in [artikel 20][ref1];

      b. een zeeschip zodanig te bemannen dat niet ten minste de op het bemanningscertificaat aangegeven functies worden
      vervuld door tot het vervullen van die functies bevoegde bemanningsleden, of

      c. het zeeschip te gebruiken in strijd met de voorwaarden van het bemanningscertificaat of de voorschriften van een
      ontheffing als bedoeld in [artikel 20, vijfde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0050681#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0050681#Artikel20
    url: https://wetten.overheid.nl/BWBR0050681/2025-07-01#Artikel69
