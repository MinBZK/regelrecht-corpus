    text: |-
      1 Het is verboden met een zeeschip, anders dan een vissersvaartuig als bedoeld in [artikel 37, eerste lid][ref1],
      een internationale reis te maken indien het zeeschip niet is voorzien van een geldig certificaat maritieme arbeid,
      een verklaring naleving maritieme arbeid en een geldend exemplaar van het MLC-verdrag.

      2 Het is verboden met een vissersvaartuig als bedoeld in [artikel 38, eerste lid][ref2], te varen indien het
      vaartuig niet is voorzien van een geldig visserij-arbeidscertificaat.


