  - number: '71'
    text: |-
      1 Het is verboden het houden van uitkijk, dan wel het optreden als verantwoordelijke voor de wacht op de brug of
      als verantwoordelijke voor de wacht in de machinekamer of machinekamers, op te dragen aan of te laten verrichten
      door bemanningsleden die tot het verrichten van die werkzaamheden niet bevoegd zijn.

      2 Het is verboden aan boord werkzaamheden waarvoor ingevolge [artikel 23, eerste of tweede lid][ref1],
      een vaarbevoegdheidsbewijs is vereist, te verrichten, indien men hiertoe niet door middel van een geldig
      vaarbevoegdheidsbewijs bevoegd is verklaard.

      3 Het is verboden aan boord werkzaamheden waarvoor ingevolge [artikel 24, eerste lid][ref2], of
      [25, eerste lid][ref3], een bekwaamheidsbewijs of een ander document is vereist, te verrichten, indien men hiertoe
      niet door middel van een geldig bekwaamheidsbewijs of document bevoegd is verklaard.


      [ref1]: https://wetten.overheid.nl/BWBR0050681#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0050681#Artikel24
