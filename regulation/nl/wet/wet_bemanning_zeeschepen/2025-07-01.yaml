preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben dat het wenselijk is de bepalingen ten aanzien van het bemannen van
    zeeschepen in de Wet zeevarenden te herzien en te moderniseren met het oogmerk de veiligheid van zeeschepen en
    de scheepvaart verder te bevorderen, het welzijn van de zeevarenden aan boord te waarborgen en ter uitvoering van
    het op 7 juli 1978 te Londen tot stand gekomen Verdrag betreffende de normen voor zeevarenden inzake opleiding,
    diplomering en wachtdienst, 1978 (Trb. 1981, 144), het op 7 juli 1995 te Londen tot stand gekomen Internationaal
    Verdrag betreffende de normen inzake opleiding, diplomering en wachtdienst van personeel van vissersschepen van de
    Internationale Maritieme Organisatie (Trb. 2013, 218), het op 23 februari 2006 te Genève tot stand gekomen Maritiem
    Arbeidsverdrag, 2006 (Trb. 2007, 93), het op 14 juni 2007 te Genève tot stand gekomen Verdrag betreffende werk in
    de visserijsector (Trb. 2011, 152) en de daarmee samenhangende Europese richtlijnen;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0050681/2025-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

        - *ambtenaren van de Inspectie Leefomgeving en Transport:* door Onze Minister aangewezen ambtenaren van de
      Inspectie Leefomgeving en Transport;
        - *bekwaamheidsbewijs:* geldig document, anders dan een vaarbevoegdheidsbewijs, afgegeven aan een zeevarende,
      waaruit blijkt dat een door Onze Minister erkende training met goed gevolg is afgesloten waarmee wordt voldaan aan
      een of meer beroepseisen;
        - *bemanning:* kapitein, de officieren, de gezellen en de overige zeevarenden;
        - *bemanningscertificaat:* door Onze Minister afgegeven certificaat, houdende het minimumaantal bemanningsleden met
      hun functies aan boord van het betrokken zeeschip;
        - *bemanningslijst:* bij het FAL-verdrag ingevoerde standaardverklaring die informatie bevat die betrekking heeft
      op de bemanningssamenstelling van een zeeschip;
        - *bemanningsplan:* voorstel van de scheepsbeheerder, houdende het aantal bemanningsleden met hun functies aan
      boord waarmee de scheepsbeheerder het betrokken zeeschip minimaal wenst te bemannen;
        - *beroepseisen:* krachtens deze wet gestelde eisen ten aanzien van de kennis, de vaardigheden, de diensttijd en de
      leeftijd voor een functie aan boord of voor werkzaamheden waarop deze wet van toepassing is;
        - *C188-verdrag:* het op 14 juni 2007 te Genève tot stand gekomen Verdrag betreffende werk in de visserijsector
      (Trb. 2011, 152);
        - *Caribisch-Nederlands zeeschip:* zeeschip dat op grond van de [Vaartuigenwet 1930 BES][ref1] is geregistreerd in
      de openbare lichamen Bonaire, Sint-Eustatius of Saba;
        - *certificaat maritieme arbeid:* certificaat, bedoeld in voorschrift 5.1.3, derde lid, van het MLC-verdrag;
        - *diensttijd:* dienstdoen aan boord van een zeeschip voor zover van belang voor de afgifte of vernieuwing van een
      vaarbevoegdheidsbewijs, een bekwaamheidsbewijs of een andere kwalificatie;
        - *FAL-verdrag:* op 9 april 1965 te Londen tot stand gekomen Verdrag inzake het vergemakkelijken van het
      internationale verkeer ter zee (Trb. 1966, 162);
        - *geneeskundige verklaring zeevaart:* verklaring als bedoeld in [artikel 31, eerste lid][ref2];
        - *GT:* maateenheid brutotonnage waarin de totale inhoud van een zeeschip, vastgesteld overeenkomstig het op
      23 juni 1969 te Londen tot stand gekomen Verdrag betreffende de meting van schepen (Trb. 1970, 122), wordt
      uitgedrukt;
        - *gezel:* lid van de bemanning, anders dan de kapitein of een officier die een functie uitoefent genoemd in het
      STCW-verdrag of STCW F-verdrag;
        - *IMO-nummer:* scheepsidentificatienummer, bedoeld in voorschrift XI-1/3 van het SOLAS-verdrag;
        - *kapitein:* gezagvoerder van een zeeschip;
        - *kennisbewijs:* bewijs van: 1° het met goed gevolg hebben afgesloten van een beroepsopleiding of een onderdeel
      daarvan als bedoeld in de [Wet educatie en beroepsonderwijs][ref3], of 2° het met goed gevolg hebben afgelegd van
      het afsluitend examen van een opleiding of een tentamen van een tot die opleiding behorende onderwijseenheid als
      bedoeld in de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref4];
        - *koud opgelegd zeeschip:* zeeschip zonder vaste bemanning dat gedurende langere tijd niet wordt geëxploiteerd;
        - *maand:* een kalendermaand of 30 dagen samengesteld uit perioden van minder dan een maand;
        - *MLC-verdrag:* op 23 februari 2006 te Genève tot stand gekomen Maritiem Arbeidsverdrag, 2006 (Trb. 2007, 93) en
      de bij dat verdrag behorende bindende protocollen en aanhangselen;
        - *monsterboekje:* door Onze Minister of een bevoegde buitenlandse maritieme autoriteit afgegeven document
      uitgereikt aan een zeevarende dat een overzicht bevat van zijn functie en opgedane diensttijd aan boord van een of
      meer schepen als bedoeld in het STCW-verdrag, het STCW F-verdrag, norm A2.1 van het MLC-verdrag of norm 3.10 van
      het FAL-verdrag;
        - *Onze Minister:* Onze Minister van Infrastructuur en Waterstaat;
        - *officier:* lid van de bemanning, niet zijnde de kapitein, die als zodanig is aangewezen bij of krachtens deze
      wet;
        - *opvarende:* eenieder die zich gedurende de vaart aan boord van het zeeschip bevindt;
        - *pleziervaartuig:* zeeschip dat uitsluitend bestemd is of gebruikt wordt voor sportbeoefening of
      vrijetijdsbesteding, voor zover geen vergoeding wordt betaald voor het vervoer van passagiers;
        - *richtlijn (EU) 2022/993:* [Richtlijn (EU)2022/993](32022L0993) van het Europees Parlement en de Raad van 8 juni
      2022 inzake het minimumopleidingsniveau van zeevarenden (PbEU 2022, L 169);
        - *richtlijn 92/29/EEG:* [Richtlijn 92/29/EEG](31992L0029) van de Raad van 31 maart 1992 betreffende de
      minimumvoorschriften inzake veiligheid en gezondheid ter bevordering van een betere medische hulpverlening aan
      boord van schepen (PbEG 1992, L 113);
        - *richtlijn 2009/13/EG:* [Richtlijn 2009/13/EG](32009L0013) van de Raad van 16 februari 2009 tot tenuitvoerlegging
      van de overeenkomst tussen de Associatie van reders van de Europese Gemeenschap (ECSA) en de Europese Federatie van
      vervoerswerknemers (ETF) inzake het verdrag betreffende maritieme arbeid van 2006 en tot wijziging van [Richtlijn
      1999/63/EG](31999L0063) (PbEU 2009, L 124);
        - *richtlijn (EU) 2017/ 159:* [Richtlijn (EU) 2017/159](32017L0159) van de Raad van 19 december 2016 tot
      uitvoering van de op 21 mei 2012 door het Algemeen Comité van de landbouwcoöperaties van de Europese Unie
      (COGECA), de Europese Federatie van vervoerswerknemers (EFT) en de Vereniging van de nationale organisaties van
      visserijondernemingen in de Europese Unie (Europêche) gesloten Overeenkomst betreffende de uitvoering van het
      Verdrag betreffende werk in de visserijsector van de Internationale Arbeidsorganisatie uit 2007 (PbEU 2016, L 25);
        - *scheepsbeheerder:* eigenaar of de rompbevrachter van een zeeschip, of een vennootschap als bedoeld in
      [artikel 194a van Boek 8 van het Burgerlijk Wetboek][ref5] aan wie de eigenaar de verantwoordelijkheid voor de
      exploitatie van het zeeschip heeft overgedragen, of indien het een vissersvaartuig betreft, de natuurlijke persoon
      of rechtspersoon aan wie de eigenaar de verantwoordelijkheid voor de exploitatie van het vissersvaartuig heeft
      overgedragen;
        - *scheepslengte:* tenzij anders bepaald, 96 procent van de totale lengte op een waterlijn op 85 procent van de
      kleinste holte gemeten vanaf de kiellijn, of de lengte van de voorzijde van de voorsteven tot de hartlijn van de
      roerkoning op die waterlijn, indien deze lengte groter is; bij vissersvaartuigen die met een stuurlast ontworpen
      zijn, moet de waterlijn waarop deze lengte gemeten wordt, evenwijdig aan de ontwerplastlijn worden genomen;
        - *schipper:* kapitein van een vissersvaartuig;
        - *schriftelijk bewijs:* bewijs, anders dan een vaarbevoegdheidsbewijs of een bekwaamheidsbewijs, dat door een
      zeevarende aan een beroepseis is voldaan;
        - *SCV-code:* de in februari 2001 onder auspiciën van de IMO opgestelde en bij circulaire SLS.14/Circ.396, als
      voor het Koninkrijk der Nederlanden geldende equivalente regeling, aangemelde Code voor de veiligheid van kleine
      commerciële schepen waarmee reizen worden ondernomen in het Caribisch gebied (Code of Safety for Small Commercial
      Vessels operating in the Caribbean);
        - *SOLAS-verdrag:* op 1 november 1974 te Londen tot stand gekomen Verdrag voor de beveiliging van mensenlevens op
      zee (Trb. 1976, 157) en de bij dat verdrag behorende bindende protocollen, aanhangsels en bijlagen;
        - *STCW-verdrag:* op 7 juli 1978 te Londen tot stand gekomen Verdrag betreffende de normen voor zeevarenden inzake
      opleiding, diplomering en wachtdienst, 1978 (Trb. 1981, 144) en de bij dat verdrag behorende bindende bijlagen;
        - *STCW F-verdrag:* op 7 juli 1995 te Londen tot stand gekomen Internationaal Verdrag betreffende de normen inzake
      opleiding, diplomering en wachtdienst van personeel van vissersschepen van de Internationale Maritieme Organisatie
      (Trb. 2013, 218);
        - *tuchtcollege:* tuchtcollege voor de scheepvaart als bedoeld in [artikel 41][ref6];
        - *vaarbevoegdheidsbewijs:* geldig document afgegeven door Onze Minister waaruit de bevoegdheid blijkt om in een
      of meer functies, waarvoor bij of krachtens deze wet beroepseisen zijn gesteld, aan boord van een zeeschip dienst
      te doen;
        - *verklaring naleving maritieme arbeid:* verklaring als bedoeld in norm A 5.1.3, tiende lid, van het MLC-verdrag,
      bestaande uit deel I en deel II;
        - *verwerking van persoonsgegevens:* het verwerken van persoonsgegevens als bedoeld in artikel 4, onderdelen 1 en
      2, van de Algemene verordening gegevensbescherming;
        - *visser:* zeevarende werkzaam op een vissersvaartuig;
        - *vissersvaartuig:* zeeschip dat bestemd is of gebezigd wordt voor het bedrijfsmatig vangen van vis of van andere
      levende rijkdommen van de zee;
        - *visserij-arbeidscertificaat:* document als bedoeld in artikel 41 van het C188-verdrag;
        - *zeeschip:* schip dat op grond van voor Nederland geldende rechtsregels gerechtigd is de vlag van het Koninkrijk
      te voeren;
        - *zeevarende:* natuurlijke persoon die in enige hoedanigheid werkzaamheden verricht aan boord van een zeeschip;
        - *zeilschip:* zeeschip dat bestemd en ingericht is om hoofdzakelijk door middel van zeilen te worden voortbewogen;
        - *zeilvaart:* bedrijfsmatige vaart met zeilschepen op zee.


