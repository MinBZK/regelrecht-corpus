  - number: '77'
    text: |-
      1 Er is een Centraal inspectieregister, waarin Onze Minister de inspectierapporten met betrekking tot de werk- en
      leefomstandigheden van zeevarenden aan boord registreert.

      2 Bij ministeriële regeling worden nadere regels gesteld met betrekking tot de registratie van gegevens in het
      register.
    url: https://wetten.overheid.nl/BWBR0050681/2025-07-01#Artikel77
  - number: '78'
    text: |-
      1 Er is een openbaar register van bemanningscertificaten, waarin Onze Minister de bemanningscertificaten van
      zeeschepen registreert.

      2 Er is een openbaar register van certificaten maritieme arbeid en visserij-arbeidscertificaten, waarin Onze
      Minister de certificaten maritieme arbeid en visserij-arbeidscertificaten van zeeschepen registreert.

      3 De in het eerste en tweede lid bedoelde registers kunnen door eenieder kosteloos worden geraadpleegd.

      4 Desgevraagd wordt tegen niet meer dan de kostprijs een afschrift verstrekt van een certificaat voor een bepaald
      zeeschip.
    url: https://wetten.overheid.nl/BWBR0050681/2025-07-01#Artikel78
  - number: '79'
    text: |-
      1 Bij ministeriële regeling worden tarieven vastgesteld voor:

      a. de afgifte van een bemanningscertificaat;

      b. de beoordeling van een bemanningsplan;

      c. de afgifte, vervanging of vernieuwing van een monsterboekje;

      d. de afgifte, vervanging of vernieuwing van een vaarbevoegdheidsbewijs;

      e. de afgifte, vervanging of vernieuwing van een bekwaamheidsbewijs;

      f. de afgifte van een bewijs van erkenning van een vaarbevoegdheidsbewijs of een bekwaamheidsbewijs;

      g. de behandeling van een aanvraag voor de erkenning van een training als bedoeld in de
      [artikelen 24, derde lid][ref1], en [25, vierde lid][ref2];

      h. het verlenen een ontheffing of een vrijstelling;

      i. afgifte van een geneeskundige verklaring zeevaart;

      j. aanwijzing of erkenning keuringsarts;

      k. de vergoeding van een gecommitteerde of een deskundige;

      l. de afgifte, vervanging of vernieuwing van een certificaat maritieme arbeid of een verklaring naleving maritieme
      arbeid;

      m. de afgifte, vervanging of vernieuwing van een visserij-arbeidscertificaat.

      2 Voor de beoordeling of afgifte van een op grond van het STCW-verdrag, het STCW F-verdrag, het MLC-verdrag,
      het C188-verdrag of het SOLAS-verdrag vereist document of erkenning, niet genoemd in het eerste lid, worden bij
      ministeriële regeling tarieven vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0050681#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0050681#Artikel25
