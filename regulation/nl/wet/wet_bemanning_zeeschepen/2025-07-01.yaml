  - number: '56'
    text: |-
      1 Het tuchtcollege kan, indien het van oordeel is dat een tegen een kapitein of een officier gerezen bezwaar
      gegrond is, een of meer van de volgende tuchtmaatregelen opleggen:

      a. waarschuwing;

      b. berisping;

      c. geldboete van ten hoogste het bedrag van de derde categorie, bedoeld in
      [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref1];

      d. schorsing van de vaarbevoegdheid voor een periode van ten hoogste twee jaren.

      2 Bij het opleggen van een of meer van de in het eerste lid genoemde tuchtmaatregelen kan het tuchtcollege tevens
      bepalen dat zijn beslissing, al dan niet met vermelding van de gronden waarop zij berust, in een of meer in de
      beslissing aangewezen tijdschriften of nieuwsbladen openbaar zal worden gemaakt.

      3 Bij het opleggen van een geldboete bepaalt het tuchtcollege de termijn of de termijnen, waarbinnen de geldboete
      moet worden voldaan. De te betalen geldsommen komen toe aan de Staat. Betaling van de geldsom geschiedt aan Onze
      Minister. Voor de toepassing van [titel 4.4 van de Algemene wet bestuursrecht][ref2] wordt de uitspraak van het
      tuchtcollege aangemerkt als een beschikking als bedoeld in [artikel 4:86 van die wet][ref3].

      4 Bij het opleggen van de tuchtmaatregelen, genoemd in het eerste lid, onder c en d, kan het tuchtcollege
      bepalen dat deze geheel of ten dele niet zullen worden ten uitvoer gelegd, tenzij het tuchtcollege bij een latere
      beslissing anders mocht bepalen op grond van het feit dat de betrokken kapitein of officier zich voor het einde van
      een bij die oplegging te bepalen proeftijd van ten hoogste twee jaren heeft gedragen in strijd met de zorg die hij
      als een goed zeeman in acht behoort te nemen ten opzichte van de opvarenden, het zeeschip, de lading, het milieu
      of het scheepvaartverkeer. Het tuchtcollege kan aan een voorwaardelijk op te leggen tuchtmaatregel een bijzondere
      voorwaarde verbinden. Indien de betrokken kapitein of officier gedurende de proeftijd de bijzondere voorwaarde niet
      nakomt, kan het tuchtcollege eveneens bepalen dat het voorwaardelijk deel van de maatregel alsnog ten uitvoer zal
      worden gelegd.

      5 De tuchtmaatregelen, genoemd in het eerste lid onder c en d, en de bijkomende maatregel van openbaarmaking,
      genoemd in het tweede lid, kunnen eerst worden ten uitvoer gelegd nadat de beslissing van het tuchtcollege
      onherroepelijk is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel23
