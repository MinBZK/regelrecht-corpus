  - number: '53'
    text: |-
      1 De voorzitter en de leden, alsmede hun plaatsvervangers, kunnen het tuchtcollege verzoeken zich te laten
      verschonen en kunnen worden gewraakt indien er te hunnen aanzien feiten of omstandigheden bestaan, waardoor de
      onpartijdigheid van het tuchtcollege schade zou kunnen lijden.

      2 De overige leden van het tuchtcollege die belast zijn met de behandeling van de zaak beslissen zo spoedig
      mogelijk over een verzoek tot verschoning of wraking van hun medelid. Bij staking van stemmen wordt het verzoek tot
      verschoning of wraking toegewezen.
    url: https://wetten.overheid.nl/BWBR0050681/2025-07-01#Artikel53
  - number: '54'
    text: |-
      1 De voorzitter bepaalt het tijdstip voor de mondelinge behandeling van de zaak ter zitting. De secretaris roept
      degene die het verzoek of de klacht heeft ingediend en de betrokken kapitein of officier ten minste vier weken
      van tevoren bij zowel aangetekende brief als niet-aangetekende brief op voor de zitting. De betrokken kapitein of
      officier is verplicht aan de oproeping gevolg te geven.

      2 Indien de betrokken kapitein of officier op de oproeping niet ter zitting verschijnt, kan het tuchtcollege de
      zaak ter zitting bij verstek behandelen of de officier van justitie verzoeken de betrokkene te dagvaarden. Hij is
      verplicht na dagvaarding te verschijnen.

      3 Indien de betrokken kapitein of officier op de dagvaarding niet ter zitting verschijnt, kan het
      tuchtcollege de officier van justitie verzoeken de betrokkene te dagvaarden, met bevel tot medebrenging.
      [Artikel 556 van het Wetboek van Strafvordering][ref1] is van overeenkomstige toepassing.

      4 Degene die het verzoek of de klacht heeft ingediend kan zich ter zitting door een daartoe gemachtigde doen
      vertegenwoordigen of zich door een raadsman doen bijstaan.

      5 De betrokken kapitein of officier kan zich door een raadsman doen bijstaan.

      6 Het tuchtcollege kan weigeren bepaalde personen die geen advocaat zijn, als raadsman of als gemachtigde ter
      zitting toe te laten. Bij een zodanige weigering houdt het tuchtcollege de zaak tot een volgende zitting aan.

      7 Het tuchtcollege behandelt de zaak in een openbare zitting. Het tuchtcollege kan om gewichtige redenen bepalen
      dat de behandeling geheel of gedeeltelijk met gesloten deuren zal plaats vinden.

      8 Het tuchtcollege kan om gewichtige redenen bepalen dat de mondelinge behandeling geheel of gedeeltelijk zal
      plaats vinden door middel van een tweezijdig elektronisch communicatiemiddel.

      9 In geval van behandeling door middel van een tweezijdig elektronisch communicatiemiddel draagt de voorzitter
      zorg voor passende algemeen aanvaarde beveiligingsmaatregelen ten einde ongeautoriseerde toegang te voorkomen en
      draagt zorg dat de toegang tot de beelden tussen aanvang van de verwerking en de vernietiging alleen kunnen worden
      ingezien door speciaal daartoe geautoriseerde personen.

      10 De secretaris maakt van het verhandelde ter zitting een proces-verbaal op dat door de voorzitter en de
      secretaris wordt ondertekend.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel556
    url: https://wetten.overheid.nl/BWBR0050681/2025-07-01#Artikel54
