  - number: '76'
    text: |-
      1 Er is een Centraal register bemanningsgegevens, waarin Onze Minister de gegevens omtrent de afgegeven
      vaarbevoegdheidsbewijzen, bekwaamheidsbewijzen en monsterboekjes, alsmede de ten aanzien van deze bewijzen gegeven
      vrijstellingen en ontheffingen registreert.

      2 Bij ministeriële regeling worden nadere regels gesteld met betrekking tot de registratie van gegevens in het
      register.

      3 Onze Minister is bevoegd aan de tot het verstrekken en ontvangen van informatie bevoegde autoriteit van
      een lidstaat van de Europese Unie, een andere staat die partij is bij de Overeenkomst betreffende de Europese
      Economische Ruimte of het STCW-verdrag, informatie te verstrekken en van deze te ontvangen omtrent de verlening van
      een vaarbevoegdheidsbewijs of een bekwaamheidsbewijs.

      4 Ter uitvoering van het eerste tot en met derde lid worden persoonsgegevens betreffende vaarbevoegdheidsbewijzen
      en bekwaamheidsbewijzen verwerkt. De verwerking van deze gegevens vindt plaats teneinde te kunnen
      beoordelen of de zeevarende, die aan boord van een zeeschip een functie vervult als bedoeld in de
      [artikelen 23, eerste en tweede lid][ref1], en [24, eerste lid][ref2], beschikt over het voor die functie vereiste
      vaarbevoegdheidsbewijs of bekwaamheidsbewijs. Onze Minister is verantwoordelijke voor deze verwerking.

      5 Persoonsgegevens bedoeld in het eerste lid worden zo spoedig mogelijk en in ieder geval binnen vier weken
      vernietigd nadat deze niet langer nodig zijn ten behoeve van het register.


      [ref1]: https://wetten.overheid.nl/BWBR0050681#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0050681#Artikel24
    url: https://wetten.overheid.nl/BWBR0050681/2025-07-01#Artikel76
