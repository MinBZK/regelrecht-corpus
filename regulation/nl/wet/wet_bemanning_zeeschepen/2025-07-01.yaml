  - number: '2'
    text: |-
      1 Het bepaalde bij of krachtens deze wet is van toepassing ten aanzien van zeeschepen, voor zover ten aanzien van
      vissersvaartuigen niet anders is bepaald en, in de bij of krachtens deze wet aangewezen gevallen, op Caribisch-
      Nederlandse zeeschepen.

      2 Deze wet is niet van toepassing ten aanzien van:

      a. zeeschepen die uitsluitend varen op Nederlandse binnenwateren of gebieden waar Nederlandse havenvoorschriften
      gelden;

      b. zeeschepen zonder vaste bemanning die niet van middelen tot werktuiglijke voortstuwing zijn voorzien;

      c. koud opgelegde zeeschepen;

      d. oorlogsschepen, marinehulpschepen of andere schepen in gebruik voor de uitvoering van de militaire taak;

      e. reddingsvaartuigen; en

      f. pleziervaartuigen.

      3 Bij ministeriële regeling kunnen na overleg met de betrokken organisaties van scheepsbeheerders en zeevarenden
      categorieën van zeeschepen worden aangewezen waarop het bepaalde bij of krachtens deze wet geheel of gedeeltelijk
      niet van toepassing is als bedoeld in artikel III van het STCW-verdrag en artikel II, vijfde lid, van het MLC-
      verdrag.

      4 Voor de toepassing van het derde lid kunnen bij ministeriële regeling nadere regels worden gesteld en kan
      nader worden bepaald welke categorieën van zeeschepen in ieder geval vallen onder de in het derde lid bedoelde
      uitzonderingen.

      5 Het bepaalde bij of krachtens de [artikelen 6][ref1], en [35 tot en met 40][ref2] is niet van toepassing op niet
      commercieel gebruikte zeeschepen.

      6 Bij ministeriële regeling kan na overleg met de betrokken organisaties van scheepsbeheerders en zeevarenden,
      voor categorieën zeeschepen van minder dan 200 GT die geen internationale reizen maken, worden bepaald dat van het
      bepaalde bij of krachtens deze wet onder daarbij te stellen regels vrijstelling wordt verleend indien deze niet
      praktisch uitvoerbaar of onredelijk zijn, als bedoeld in artikel II, zesde lid, van het MLC-verdrag.

      7 Bij ministeriële regeling kunnen, na overleg met de betrokken organisaties van scheepsbeheerders en zeevarenden,
      categorieën van personen worden aangewezen die in afwijking van [artikel 1][ref3] niet worden aangemerkt als
      zeevarenden, als bedoeld in artikel II, derde lid, van het MLC-verdrag.


