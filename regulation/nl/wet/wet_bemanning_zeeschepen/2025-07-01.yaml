  - number: '20'
    text: |-
      1 Een zeeschip is voorzien van een geldig bemanningscertificaat afgegeven door Onze Minister.

      2 Een zeeschip is ten minste bemand overeenkomstig het bemanningscertificaat.

      3 Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de minimaal voor de veiligheid
      benodigde bemanningssterkte als bedoeld in voorschrift 14 van hoofdstuk V van het SOLAS-verdrag of artikel
      14 van het C188-verdrag en de inhoud, de aanvraag, de afgifte, wijziging, intrekking of het model van een
      bemanningscertificaat.

      4 Bij of krachtens algemene maatregel van bestuur kunnen voorschriften worden gegeven met betrekking tot
      de samenstelling van de bemanning opgenomen op het bemanningscertificaat voor verschillende categorieën
      vissersvaartuigen.

      5 Van de in het tweede lid bedoelde verplichting kan in bijzondere gevallen en indien er geen risico is voor
      de veiligheid ten behoeve van een bepaald zeeschip en gedurende niet meer dan zes maanden door Onze Minister
      ontheffing worden verleend. Aan een besluit tot ontheffing kunnen ter waarborging van de veiligheid voorschriften
      worden verbonden.

      6 Bij ministeriële regeling kan onder het stellen van regels worden bepaald dat een bemanningscertificaat geheel of
      gedeeltelijk wordt vervangen door een geautomatiseerd bestand.
    url: https://wetten.overheid.nl/BWBR0050681/2025-07-01#Artikel20
  - number: '21'
    text: |-
      1 Een zeeschip is voorzien van een actuele bemanningslijst.

      2 De kapitein draagt zorg voor het opmaken van de bemanningslijst.

      3 Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de voorwaarden voor opname op de
      bemanningslijst en de inhoud, alsmede het opmaken, wijzigen en bewaren van de bemanningslijst.

      4 Onze Minister kan in bijzondere gevallen en indien er geen risico is voor de veiligheid van de verplichting,
      genoemd in het eerste lid, en van de bepalingen krachtens het derde lid ontheffing verlenen ten behoeve van een
      bepaald schip en gedurende een bepaalde periode. Aan deze ontheffing kunnen ter waarborging van de veiligheid
      beperkingen en voorwaarden worden verbonden.

      5 Bij ministeriële regeling kan onder het stellen van regels worden bepaald dat een bemanningslijst geheel of
      gedeeltelijk wordt vervangen door een geautomatiseerd bestand.
    url: https://wetten.overheid.nl/BWBR0050681/2025-07-01#Artikel21
  - number: '22'
    text: |-
      1 Een zeevarende, als bedoeld in [artikel 23, eerste of tweede lid][ref1], is in het bezit van een geldig
      monsterboekje.

      2 Het eerste lid is niet van toepassing op een zeevarende met een andere nationaliteit dan de Nederlandse, indien
      de zeevarende in het bezit is van een geldig monsterboekje dat ten minste in de Engelse taal is gesteld en is
      afgegeven door of namens de bevoegde autoriteit van het land van herkomst of van een ander land.

      3 Een zeevarende, anders dan een zeevarende als bedoeld in het eerste lid, is in het bezit van een geldig
      monsterboekje of een alternatieve diensttijdverklaring die door de kapitein wordt aangetekend dan wel uitgereikt.

      4 Bij ministeriële regeling worden regels gesteld over de inhoud, het aantekenen, de afgifte, wijziging of
      geldigheid, de bewaring en de teruggave van het monsterboekje en de alternatieve diensttijdverklaring.

      5 Bij ministeriële regeling kan onder het stellen van regels worden bepaald dat de inhoud van een monsterboekje of
      de alternatieve diensttijdverklaring geheel of gedeeltelijk wordt vervangen door een geautomatiseerd bestand.


      [ref1]: https://wetten.overheid.nl/BWBR0050681#Artikel23
    url: https://wetten.overheid.nl/BWBR0050681/2025-07-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0050681
        artikel: '23'
        hoofdstuk: '3'
  - number: '23'
    text: |-
      1 Een zeevarende die aan boord van een zeeschip een functie vervult van kapitein of officier als bedoeld in:

      a. de hoofdstukken II tot en met IV of VII van de bijlage bij het STCW-verdrag en de bijbehorende codes, of

      b. hoofdstuk II van de bijlage bij het STCW F-verdrag;

      is in het bezit van een vaarbevoegdheidsbewijs of door Onze Minister erkend buitenlands vaarbevoegdheidsbewijs voor
      die functie.

      2 Een zeevarende die aan boord van een zeeschip een functie van gezel vervult als bedoeld in de hoofdstukken II,
      III en VII van de bijlage bij het STCW-verdrag en de bijbehorende codes of hoofdstuk IV van het STCW F-verdrag is
      in het bezit van een vaarbevoegdheidsbewijs voor die functie.

      3 Bij algemene maatregel van bestuur worden normen gesteld met betrekking tot de minimumeisen voor een functie of
      taak als bedoeld in het eerste en tweede lid.

      4 Bij ministeriële regeling worden nadere regels gesteld met betrekking tot de invulling van de normen als bedoeld
      in het derde lid, en de benodigde kennisbewijzen, beroepseisen en eisen van medische geschiktheid van de zeevarende
      vereist voor de afgifte van een vaarbevoegdheidsbewijs voor de genoemde functies.

      5 Van de in het eerste lid bedoelde verplichting kan ten aanzien van een zeevarende, met inachtneming van bij
      algemene maatregel van bestuur te stellen regels, voor een bepaald zeeschip, een bepaalde functie of een bepaalde
      periode van niet meer dan zes maanden, door Onze Minister ontheffing worden verleend. Aan een besluit tot
      ontheffing kunnen ter waarborging van de veiligheid voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0050681/2025-07-01#Artikel23
  - number: '24'
    text: |-
      1 Een zeevarende die aan boord van een zeeschip een functie of taak vervult als bedoeld in hoofdstuk V van de
      bijlage bij het STCW-verdrag is in het bezit van een bekwaamheidsbewijs of schriftelijk bewijs voor die functie of
      taak en voldoet alvorens hij deze aanvangt aan de overige bijzondere eisen voor die functie of taak.

      2 Bij algemene maatregel van bestuur worden normen gesteld met betrekking tot de minimumeisen voor een functie of
      taak als bedoeld in het eerste lid.

      3 Bij ministeriële regeling worden nadere regels gesteld met betrekking tot de invulling van de normen als bedoeld
      in het tweede lid, de benodigde trainingen en beroepseisen vereist voor de afgifte van een bekwaamheidsbewijs voor
      de genoemde functie of taak en het schriftelijk bewijs om aan te tonen dat voldaan wordt aan de overige bijzondere
      eisen voor die functie of taak.

      4 De trainingen, bedoeld in het derde lid, worden op aanvraag door Onze Minister erkend.

      5 Bij ministeriële regeling worden regels gesteld met betrekking tot de aanvraag en de intrekking van een erkenning
      van een training als bedoeld in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0050681/2025-07-01#Artikel24
  - number: '25'
    text: |-
      1 Een zeevarende die aan boord van een zeeschip een functie of taak vervult als bedoeld in hoofdstuk VI van het
      STCW-verdrag, de hoofdstukken III en IV van het STCW F-verdrag, voorschrift 1.3, eerste en tweede lid, van de
      code bij het MLC-verdrag, artikel 31, onderdeel b, van het C188-verdrag of [richtlijn 92/29/EEG](31992L0029) is in
      het bezit van een bekwaamheidsbewijs of schriftelijk bewijs voor die functie of taak en voldoet alvorens hij deze
      aanvangt aan de overige aanvullende eisen voor die functie of taak.

      2 Bij algemene maatregel van bestuur worden normen gesteld met betrekking tot de minimumeisen voor een functie of
      taak als bedoeld in het eerste lid.

      3 Bij ministeriële regeling worden nadere regels gesteld met betrekking tot de invulling van de normen als bedoeld
      in het tweede lid en de benodigde trainingen en beroepseisen vereist voor de afgifte van een bekwaamheidsbewijs
      voor de genoemde functie of taak en het schriftelijk bewijs om aan te tonen dat voldaan wordt aan de overige
      aanvullende eisen voor die functie of taak.

      4 Bij ministeriële regeling kan worden bepaald voor welke bij internationale regeling aangewezen taak of functie
      het bezit van een bekwaamheidsbewijs of enig ander document voorgeschreven is, alsmede welke beroepsvereisten
      daarvoor gelden.

      5 De trainingen, bedoeld in het derde lid worden op aanvraag door Onze Minister erkend.

      6 Bij ministeriële regeling worden regels gesteld met betrekking tot de aanvraag en de intrekking van een erkenning
      van een training als bedoeld in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0050681/2025-07-01#Artikel25
  - number: '26'
    text: |-
      1 Bij algemene maatregel van bestuur worden regels gesteld met betrekking tot de geldigheid, de vernieuwing,
      ophoging, schorsing of intrekking van een vaarbevoegdheidsbewijs, een bekwaamheidsbewijs of schriftelijk bewijs.

      2 Bij ministeriële regeling worden regels gesteld met betrekking tot de benodigde gegevens voor de afgifte, het
      model van een vaarbevoegdheidsbewijs, bekwaamheidsbewijs of schriftelijk bewijs en de erkenning van trainingen
      of trainingsinstituten.

      3 Bij ministeriële regeling kan onder het stellen van regels worden bepaald dat een vaarbevoegdheidsbewijs, een
      bekwaamheidsbewijs of schriftelijk bewijs geheel of gedeeltelijk wordt vervangen door een geautomatiseerd bestand.
    url: https://wetten.overheid.nl/BWBR0050681/2025-07-01#Artikel26
  - number: '27'
    text: |-
      1 Onze Minister kan een vaarbevoegdheidsbewijs of bekwaamheidsbewijs als bedoeld in artikel 20 van [richtlijn (EU)
      2022/993](32022L0993) of een vaarbevoegdheidsbewijs als bedoeld in hoofdstuk II van de bijlage bij het STCW F-
      verdrag dat is afgegeven door of namens de bevoegde autoriteit van een staat die verdragspartij is bij het STCW-
      verdrag of het STCW F-verdrag erkennen.

      2 Bij algemene maatregel van bestuur worden regels gesteld met betrekking tot afgifte en intrekking van een
      erkenning als bedoeld in het eerste lid.

      3 Bij ministeriële regeling worden regels gesteld met betrekking tot de benodigde gegevens voor de afgifte van
      een erkenning.

      4 Een zeevarende die erkenning van zijn vaarbevoegdheidsbewijs of bekwaamheidsbewijs heeft aangevraagd kan,
      voor een periode van niet meer dan drie maanden volstaan met een door Onze Minister op aanvraag afgegeven bewijs
      van aanvraag om erkenning van een vaarbevoegdheidsbewijs of bekwaamheidsbewijs, tezamen met het te erkennen
      vaarbevoegdheidsbewijs of bekwaamheidsbewijs.

      5 Bij ministeriële regeling worden de voorwaarden vastgesteld waaronder een bewijs van aanvraag om erkenning van
      een vaarbevoegdheidsbewijs of bekwaamheidsbewijs wordt afgegeven.
    url: https://wetten.overheid.nl/BWBR0050681/2025-07-01#Artikel27
  - number: '28'
    text: |-
      Bij algemene maatregel van bestuur kunnen in overeenstemming met [richtlijn (EU) 2022/993](32022L0993) en het
      STCW-verdrag regels worden gesteld met betrekking tot de aanvaarding van een vaarbevoegdheidsbewijs of een
      bekwaamheidsbewijs dat is afgegeven door of namens de bevoegde autoriteit van een staat die verdragspartij
      is bij het STCW-verdrag, anders dan een vaarbevoegdheidsbewijs of bekwaamheidsbewijs als bedoeld in
      [artikel 27, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0050681#Artikel27
    url: https://wetten.overheid.nl/BWBR0050681/2025-07-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0050681
        artikel: '27'
        hoofdstuk: '3'
  - number: '29'
    text: |-
      Bij ministeriële regeling kan worden bepaald voor welke functies of werkzaamheden van zeevarenden aan boord van
      een Caribisch-Nederlands zeeschip het bezit van een bekwaamheidsbewijs of enig ander document inzake beroepseisen
      voorgeschreven is, alsmede welke beroepseisen daarvoor gelden.
    url: https://wetten.overheid.nl/BWBR0050681/2025-07-01#Artikel29
  - number: '30'
    text: |-
      1 Onze Minister kan een examencommissie aanwijzen bij welke gelegenheid wordt geboden examen af te leggen voor de
      hierna genoemde bekwaamheidsbewijzen:

      a. stuurman grote zeilvaart;

      b. stuurman kleine zeilvaart.

      2 Onze Minister kan gecommitteerden of deskundigen aanwijzen, die bevoegd zijn de examens bij te wonen die worden
      afgenomen ter verkrijging van een bekwaamheidsbewijs, bedoeld in het eerste lid.

      3 Bij krachtens algemene maatregel van bestuur worden de beroepseisen vastgesteld om in aanmerking te kunnen komen
      voor een in het eerste lid, onder a, genoemd bekwaamheidsbewijs.

      4 Bij ministeriële regeling worden de beroepseisen vastgesteld om in aanmerking te kunnen komen voor een in het
      eerste lid, onder b, genoemd bekwaamheidsbewijs.
    url: https://wetten.overheid.nl/BWBR0050681/2025-07-01#Artikel30
  - number: '31'
    text: |-
      1 Elke zeevarende is in het bezit van een geldige geneeskundige verklaring zeevaart waaruit blijkt dat hij voldoet
      aan de voor zijn functie vereiste medische geschiktheid.

      2 De geneeskundige verklaring zeevaart wordt afgegeven door een keuringsarts die daartoe door Onze Minister is
      aangewezen of erkend.

      3 Een geldige geneeskundige verklaring zeevaart afgegeven door een keuringsarts die door de bevoegde autoriteit
      van een andere lidstaat van de Europese Unie, een andere staat die partij is bij de Overeenkomst betreffende de
      Europese Economische Ruimte of Zwitserland of die onder de verantwoordelijkheid van een bevoegde autoriteit als
      bedoeld in [artikel 27, eerste lid][ref1], is aangewezen of erkend, wordt aanvaard als een geneeskundige verklaring
      als bedoeld in het eerste lid.

      4 Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot de eisen van medische
      geschiktheid, de wijze van keuren en het model, afgifte of geldigheid van een geneeskundige verklaring zeevaart.

      5 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot de aanwijzing en
      erkenning als keuringsarts alsmede de intrekking van deze aanwijzing en erkenning.

      6 Indien de geldigheid van een geneeskundige verklaring zeevaart gedurende een reis verstrijkt, kan de betrokken
      zeevarende zijn werkzaamheden verrichten tot aan de volgende aanloophaven waar een keuring voor medische
      geschiktheid kan worden verricht, maar niet meer dan voor een termijn van drie maanden na het verstrijken.

      7 Indien korte tijd voor vertrek van een schip de bemanning moet worden aangevuld, kan, indien dringende
      omstandigheden nopen tot het aanmonsteren van personen die niet in het bezit zijn van een geldige geneeskundige
      verklaring van geschiktheid voor de zeevaart, door Onze Minister aan een zeevarende die in het bezit is van een
      geneeskundige verklaring van geschiktheid voor de zeevaart waarvan de geldigheidsduur recentelijk is verstreken,
      ontheffing worden verleend van de in het eerste of tweede lid, bedoelde verplichting.

      8 De in zevende lid bedoelde ontheffing geldt tot aan de volgende aanloophaven waar een medische keuring door een
      keuringsarts als bedoeld in het eerste of tweede lid, kan worden verricht, maar niet meer dan voor een termijn van
      drie maanden.

      9 Bij ministeriële regeling kan onder het stellen van regels worden bepaald dat een geneeskundige verklaring
      zeevaart geheel of gedeeltelijk wordt vervangen door een geautomatiseerd bestand.


      [ref1]: https://wetten.overheid.nl/BWBR0050681#Artikel27
    url: https://wetten.overheid.nl/BWBR0050681/2025-07-01#Artikel31
