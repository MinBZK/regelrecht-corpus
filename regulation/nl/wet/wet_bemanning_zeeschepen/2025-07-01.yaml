  - number: '40'
    text: |-
      1 Elke zeevarende aan boord van een Nederlands zeeschip of zijn vertegenwoordiger kan een klacht betreffende de
      vermoedelijke schending van het MLC-verdrag of het C188-verdrag of een klacht betreffende een vermeend onrechtmatig
      bevel van de kapitein melden bij een daartoe aangewezen ambtenaar.

      2 Bij ministeriële regeling worden regels gesteld over de wijze van indiening, de procedure en ontvankelijkheid van
      een klacht.
    url: https://wetten.overheid.nl/BWBR0050681/2025-07-01#Artikel40
  - number: '41'
    text: |-
      1 De kapitein en de officieren zijn aan tuchtrechtspraak onderworpen ter zake van enig handelen of nalaten in
      strijd met de zorg die zij als een goed zeeman in acht behoren te nemen ten opzichte van de opvarenden, het
      zeeschip, de lading, het milieu of het scheepvaartverkeer.

      2 De tuchtrechtspraak in eerste aanleg wordt uitgeoefend door het tuchtcollege voor de scheepvaart. Het
      tuchtcollege voor de scheepvaart is gevestigd te Amsterdam.

      3 De tuchtrechtspraak in hoger beroep wordt uitgeoefend door het College van Beroep voor het bedrijfsleven. Het
      College van Beroep voor het bedrijfsleven beslist in hoogste ressort.
    url: https://wetten.overheid.nl/BWBR0050681/2025-07-01#Artikel41
  - number: '42'
    text: |-
      1 Het tuchtcollege bestaat uit een voorzitter, twee plaatsvervangende voorzitters, veertien leden en twintig
      plaatsvervangende leden. Zij worden door Onze Minister benoemd voor een periode van vier jaren en zijn terstond
      herbenoembaar.

      2 Bij algemene maatregel van bestuur worden met betrekking tot de benoeming van personen bedoeld in het eerst lid
      opleidings- en kenniseisen en ervaringseisen gesteld.

      3 Onze Minister verleent aan de voorzitter, een plaatsvervangend voorzitter, een lid of plaatsvervangend lid in elk
      geval ontslag met ingang van de maand, volgende op die waarin de betrokkene de leeftijd van zeventig jaren heeft
      bereikt, en op eigen verzoek tussentijds.
    url: https://wetten.overheid.nl/BWBR0050681/2025-07-01#Artikel42
  - number: '43'
    text: |-
      1 Tussen de voorzitter, de plaatsvervangende voorzitters, de leden, en de plaatsvervangende leden, de secretarissen
      en de plaatsvervangend secretarissen van het tuchtcollege mag geen nauwe persoonlijke of zakelijke betrekking
      bestaan.

      2 Voor de aanvang van hun werkzaamheden leggen zij in handen van de president van het College van Beroep voor
      het bedrijfsleven de eed of belofte af. Het formulier voor de eed of belofte wordt bij ministeriële regeling
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0050681/2025-07-01#Artikel43
  - number: '44'
    text: |-
      1 Het voor de leden van de rechterlijke macht bepaalde in de [artikelen 46c, onderdelen b en c][ref1],
      [46ca, eerste lid, onderdeel a en d][ref2], [46f][ref3], [46g, eerste en tweede lid][ref4],
      [46i, eerste lid, aanhef en onderdelen a en b, en tweede lid][ref5],
      [46l, eerste lid, aanhef en onderdeel a][ref6], [46m][ref7], [46o][ref8] en
      [46p, eerste tot en met vijfde lid, van de Wet rechtspositie rechterlijke ambtenaren][ref9] is van overeenkomstige
      toepassing ten aanzien van de voorzitter, de plaatsvervangende voorzitters, de leden en de plaatsvervangende leden
      van het tuchtcollege.

      2 De disciplinaire maatregel van ontslag wordt door de Hoge Raad opgelegd en de disciplinaire maatregel van
      schriftelijke berisping wordt door de voorzitter van het tuchtcollege opgelegd.

      3 De [artikelen 13a][ref10], [13b, uitgezonderd het eerste lid, onderdelen b en c, en vierde lid][ref11], en
      [13c tot en met 13g van de Wet op de rechterlijke organisatie][ref12], zijn van overeenkomstige toepassing ten
      aanzien van gedragingen van de voorzitter, de plaatsvervangende voorzitters, de leden en de plaatsvervangende leden
      van het tuchtcollege, met dien verstande dat:

      a. voor de overeenkomstige toepassing van die artikelen onder «het betrokken gerechtsbestuur» wordt verstaan: de
      voorzitter van het tuchtcollege; en

      b. de procureur-generaal niet verplicht is aan het verzoek, bedoeld in
      [artikel 13a van de Wet op de rechterlijke organisatie][ref13] te voldoen, indien de verzoeker redelijkerwijs
      onvoldoende belang heeft bij een onderzoek als bedoeld in datzelfde artikel.


