  - number: '17'
    text: |-
      De scheepsbeheerder draagt er zorg voor dat de kapitein vanwege de toepassing van [artikel 9, eerste lid][ref1],
      niet benadeeld wordt.


      [ref1]: https://wetten.overheid.nl/BWBR0050681#Artikel9
    url: https://wetten.overheid.nl/BWBR0050681/2025-07-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0050681
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '18'
    text: |-
      1 Op een zeeschip worden alleen personen als kapitein aangesteld die de nationaliteit bezitten van:

      a. het Koninkrijk der Nederlanden;

      b. een lidstaat van de Europese Unie of van een van de overige staten die partij zijn bij de Overeenkomst inzake
      de Europese Economische Ruimte, voor zover dat zeeschip geen vissersvaartuig is en Nederland met die staat een
      schriftelijke afspraak heeft gemaakt voor de erkenning van vaarbevoegdheidsbewijzen als bedoeld in voorschrift I/10
      van de Bijlage bij het STCW-verdrag;

      c. een andere staat die verdragspartij is bij het STCW-verdrag indien de betrokken kapitein in het bezit is van een
      schriftelijke toestemming ingevolge [artikel 19, vierde lid][ref1].

      2 Bij ministeriële regeling kan, onder het stellen van voorwaarden of beperkingen, ten behoeve van
      vissersvaartuigen vrijstelling worden verleend van het in het eerste lid bedoelde vereiste.


      [ref1]: https://wetten.overheid.nl/BWBR0050681#Artikel19
    url: https://wetten.overheid.nl/BWBR0050681/2025-07-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0050681
        artikel: '19'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '19'
    text: |-
      1 Aan personen die de nationaliteit bezitten van een andere staat dan genoemd in
      [artikel 18, eerste lid, onderdeel b][ref1], kan bij ministeriële regeling vrijstellingworden verleend van de
      nationaliteitseis, bedoeld in artikel 18, eerste lid, voor het dienstdoen op een zeeschip dat geen vissersvaartuig
      is.

      2 Een vrijstelling als bedoeld in het eerste lid, kan slechts worden verleend aan de houder van een
      vaarbevoegdheidsbewijs dat is erkend op grond van [artikel 27][ref2].

      3 Aan een vrijstelling als bedoeld in het eerste lid, kunnen beperkingen of nadere voorschriften worden verbonden.

      4 Door werkgevers- en werknemersorganisaties in de sector koopvaardij, respectievelijk de sector zeegaande
      waterbouw wordt, ter regulering van de arbeidsmarkt voor kapiteins met de Nederlandse nationaliteit,
      respectievelijk die van een staat als bedoeld [artikel 18, eerste lid, onderdeel c][ref3], voor hun sector een
      privaatrechtelijke regeling vastgesteld omtrent afgifte aan een scheepsbeheerder van een schriftelijke toestemming
      tot het aanstellen van een persoon met een andere nationaliteit in de functie van kapitein.

      5 Elk van de regelingen, bedoeld in het vierde lid, bevat bepalingen ten aanzien van de afgifte, respectievelijk
      de weigering van een schriftelijke toestemming, door een paritair samengestelde commissie, bestaande uit
      vertegenwoordigers van de werkgevers- en werknemersorganisaties in de sector koopvaardij, respectievelijk de sector
      zeegaande waterbouw.

      6 Bij of krachtens algemene maatregel van bestuur worden indien van belang voor een goede uitvoering, regels
      gesteld met betrekking tot de inhoud van de regelingen als bedoeld in het vierde lid.

      7 Bij regeling van Onze Minister worden regels gesteld met betrekking tot de vrijstelling van de eisen neergelegd
      in [artikel 18, eerste lid, onderdeel c][ref4], voor de gevallen waarin de privaatrechtelijke regeling is vervallen
      zonder dat door de werkgevers- en werknemersorganisaties in de desbetreffende sector is voorzien in vervanging van
      die regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0050681#Artikel18
