        artikel: '27'
        hoofdstuk: '3'
  - number: '32'
    text: |-
      1 Indien de keuringsarts na de keuring aan de gekeurde de vereiste geneeskundige verklaring zeevaart niet kan
      afgeven, heeft de gekeurde het recht zich te laten herkeuren door een door Onze Minister als scheidsrechter
      aangewezen keuringsarts.

      2 Het oordeel van de als scheidsrechter aangewezen keuringsarts is bindend.

      3 De gekeurde, aan wie geen geneeskundige verklaring zeevaart kon worden afgegeven, heeft het recht zich opnieuw
      door een scheidsrechter te laten onderzoeken, indien er medische feiten worden aangetoond, die veronderstellen dat
      de reden voor de eerdere afkeuring is vervallen.

      4 De gekeurde die tijdens het onderzoek aan de keuringsarts heeft meegedeeld dat hij van mening is dat hij op
      medische gronden ongeschikt voor de zeevaart moet worden bevonden, heeft het recht zich door een scheidsrechter
      te laten onderzoeken, indien de keuringsarts geen bezwaren heeft geconstateerd tegen afgifte aan hem van een
      geneeskundige verklaring zeevaart.

      5 Onze Minister kan voor een bepaalde periode ontheffing verlenen van de verplichting te voldoen aan de geldende
      medische normen, indien een als scheidsrechter aangewezen keuringsarts daartoe gemotiveerd adviseert.

      6 Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot:

      a. de herkeuring door een als scheidsrechter aangewezen keuringsarts;

      b. de aanwijzing en erkenning van een als scheidsrechter aangewezen keuringsarts, alsmede de intrekking van deze
      aanwijzing en erkenning.
    url: https://wetten.overheid.nl/BWBR0050681/2025-07-01#Artikel32
  - number: '33'
    text: |-
      1 Onze Minister onderzoekt schriftelijke verklaringen over of aanwijzingen van medische ongeschiktheid
      of onbekwaamheid tot het uitoefenen van een functie aan boord van houders van een vaarbevoegdheidsbewijs
      of bekwaamheidsbewijs als bedoeld in [artikel 23, eerste en tweede lid][ref1], [24, eerste lid][ref2] en
      [25, eerste lid][ref3].

      2 Onze Minister stelt de houder van een vaarbevoegdheidsbewijs of bekwaamheidsbewijs, ten aanzien van wie een
      gegrond vermoeden van medische ongeschiktheid of onbekwaamheid tot het uitoefenen van zijn functie aan boord
      bestaat, daarvan in kennis. De zeevarende is verplicht zich bij de eerste gelegenheid te onderwerpen aan een
      medisch onderzoek met inachtneming van door Onze Minister te geven aanwijzingen.

      3 Bij gegrond vermoeden van medische ongeschiktheid wordt het onderzoek, bedoeld in het tweede lid, ingesteld door
      een door Onze Minister aangewezen keuringsarts die onderzoekt of de betrokkene medisch geschikt is voor de functie
      die hij uitoefent.

      4 Indien bij een periodiek onderzoek of bij een in het tweede lid bedoeld onderzoek blijkt dat de houder van een
      vaarbevoegdheidsbewijs of bekwaamheidsbewijs niet voldoet aan de krachtens deze wet gestelde eisen voor medische
      geschiktheid, zal de keuringsarts geen nieuwe geneeskundige verklaring zeevaart afgeven. Onze Minister kan de
      desbetreffende geneeskundige verklaring zeevaart ongeldig verklaren.

      5 [Artikel 32][ref4] is van overeenkomstige toepassing.

      6 Bij gegrond vermoeden van onbekwaamheid tot het uitoefenen van een functie aan boord wordt het onderzoek, bedoeld
      in het tweede lid, ingesteld door een door Onze Minister aangewezen deskundige die onderzoekt of de houder voldoet
      aan de medische beroepseisen voor de functie die hij uitoefent.

      7 Indien bij een in het tweede lid bedoeld onderzoek blijkt dat de houder van een vaarbevoegdheidsbewijs of
      bekwaamheidsbewijs niet voldoet aan de krachtens deze wet gestelde medische beroepseisen voor de functie die hij
      uitoefent, verklaart Onze Minister het afgegeven vaarbevoegdheidsbewijs of bekwaamheidsbewijs ongeldig.

      8 Indien de houder van een vaarbevoegdheidsbewijs niet aan de in het tweede lid bedoelde verplichting voldoet
      zonder dat van een geldige reden daartoe blijkt, kan Onze Minister zonder nader onderzoek het afgegeven
      vaarbevoegdheidsbewijs of bekwaamheidsbewijs ongeldig verklaren.


      [ref1]: https://wetten.overheid.nl/BWBR0050681#Artikel23
