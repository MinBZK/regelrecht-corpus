  - number: '80'
    text: |-
      1 Een bemanningscertificaat afgegeven voor het tijdstip van inwerkingtreding van deze wet behoudt zijn geldigheid
      tot de daarop aangegeven einddatum.

      2 Op een aanvraag voor een bemanningscertificaat ingediend voor het tijdstip van inwerkingtreding van deze wet,
      blijft het recht van toepassing zoals dat gold onmiddellijk voorafgaand aan de inwerkingtreding van deze wet.
    url: https://wetten.overheid.nl/BWBR0050681/2025-07-01#Artikel80
  - number: '81'
    text: |-
      1 Een vaarbevoegdheidsbewijs, een bekwaamheidsbewijs, een geneeskundige verklaring of een schriftelijk bewijs,
      afgegeven aan een zeevarende voor het tijdstip van inwerkingtreding van deze wet behoudt zijn geldigheid tot de
      daarop aangegeven einddatum.

      2 Op een aanvraag voor een vaarbevoegdheidsbewijs of een bekwaamheidsbewijs die is ingediend voor het tijdstip
      van inwerkingtreding van deze wet, blijft het recht van toepassing zoals dat gold onmiddellijk voorafgaand aan de
      inwerkingtreding van deze wet.
    url: https://wetten.overheid.nl/BWBR0050681/2025-07-01#Artikel81
  - number: '82'
    text: |-
      1 Een certificaat maritieme arbeid of een visserij-arbeidscertificaat, afgegeven voor het tijdstip van
      inwerkingtreding van deze wet behoudt zijn geldigheid tot de daarop aangegeven einddatum.

      2 Op aanvragen voor een certificaat maritieme arbeid of een visserij-arbeidscertificaat die zijn ingediend voor het
      tijdstip van inwerkingtreding van deze wet, blijft het recht van toepassing zoals dat gold onmiddellijk voorafgaand
      aan de inwerkingtreding van deze wet.
    url: https://wetten.overheid.nl/BWBR0050681/2025-07-01#Artikel82
  - number: '83'
    text: |-
      Een privaatrechtelijke regeling als bedoeld in [artikel 30, vijfde lid, van de Wet zeevarenden][ref1] wordt gelezen
      als een privaatrechtelijke regeling als bedoeld in [artikel 19, vierde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0050681#Artikel19
    url: https://wetten.overheid.nl/BWBR0050681/2025-07-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '30'
      - id: ref2
        bwb_id: BWBR0050681
        artikel: '19'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '84'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen, ter uitvoering van verdragen of besluiten van
      volkenrechtelijke organisaties, regels worden gesteld ter waarborging van de veilige en milieuverantwoorde vaart
      alsmede de gezondheid, de veiligheid en behoorlijke leef- en werkomstandigheden van zeevarenden.
    url: https://wetten.overheid.nl/BWBR0050681/2025-07-01#Artikel84
  - number: '85'
    text: |-
      1 Een wijziging van [richtlijn (EU) 2022/993](32022L0993), [richtlijn 2009/13/EG](32009L0013) of [richtlijn (EU)
      2017/159](32017L0159), gaat voor de toepassing van deze wet gelden met ingang van de dag waarop aan de betrokken
      wijzigingsrichtlijn uitvoering moet zijn gegeven, tenzij bij ministerieel besluit, dat in de Staatscourant wordt
      bekendgemaakt, een ander tijdstip wordt vastgesteld.

      2 Een wijziging van de op grond van deze wet toepasselijke verdragen en codes gaat voor de toepassing van deze wet
      gelden met ingang van de dag waarop de betrokken wijziging door Nederland is aanvaard en internationaal in werking
      is getreden, tenzij bij ministerieel besluit, dat in de Staatscourant wordt bekendgemaakt, een ander tijdsstip
      wordt vastgesteld.

      3 Bij ministerieel besluit, dat in de Staatscourant wordt bekendgemaakt, kunnen de benaming van [richtlijn (EU)
      2022/993](32022L0993) en de verwijzing naar onderdelen daarvan worden gewijzigd.
    url: https://wetten.overheid.nl/BWBR0050681/2025-07-01#Artikel85
  - number: '86'
    text: |-
      Ingeval bij of krachtens deze wet regels worden gesteld ter uitvoering van het STCW-verdrag, het STCW F-verdrag,
      het MLC-verdrag, C188-verdrag, het SOLAS-verdrag of de SCV-code, kan overtreding van die regels ook als strafbaar
      feit worden aangemerkt dan wel worden bestraft met een bestuurlijke sanctie indien deze regels in de Engelse taal
      zijn gesteld en bekend gemaakt.
    url: https://wetten.overheid.nl/BWBR0050681/2025-07-01#Artikel86
  - number: '87'
    text: |-
      De [Wet zeevarenden][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0009124
    url: https://wetten.overheid.nl/BWBR0050681/2025-07-01#Artikel87
    references:
