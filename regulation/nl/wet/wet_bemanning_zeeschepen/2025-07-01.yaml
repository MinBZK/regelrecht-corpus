    text: 'Deze wet wordt aangehaald als: Wet bemanning zeeschepen.'
    url: https://wetten.overheid.nl/BWBR0050681/2025-07-01#Artikel95
  - number: '96'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
