  - number: '58'
    text: |-
      Tegen een beslissing van het tuchtcollege kan binnen zes weken na de dag van de verzending van de in
      [artikel 57, tweede lid][ref1], bedoelde beslissing hoger beroep worden ingesteld bij het College van Beroep voor
      het bedrijfsleven:

      a. door de betrokken kapitein of officier, indien het verzoek of de klacht geheel of ten dele gegrond is verklaard;

      b. door Onze Minister;

      c. door de klager, indien zijn klacht geheel of ten dele ongegrond is verklaard.


      [ref1]: https://wetten.overheid.nl/BWBR0050681#Artikel57
    url: https://wetten.overheid.nl/BWBR0050681/2025-07-01#Artikel58
