  - number: '4'
    text: |-
      1 De scheepsbeheerder draagt er zorg voor dat zijn zeeschip of zeeschepen zodanig zijn bemand dat redelijkerwijs
      alle werkzaamheden aan boord kunnen worden verricht gelet op de bedrijfsvoering, het voorkomen van oververmoeidheid
      van zeevarenden, zonder gevaar voor de opvarenden, het zeeschip, de lading, het milieu of het scheepvaartverkeer en
      met inachtneming van de geldende arbeids- en rusttijden.

      2 De scheepsbeheerder draagt er zorg voor dat elke zeevarende aan boord voldoet aan de bij of krachtens deze
      wet gestelde eisen ten aanzien van de opleiding, kennis, diensttijd, vakbekwaamheid en medische geschiktheid,
      in overeenstemming met de bepalingen opgenomen in [richtlijn (EU) 2022/993](32022L0993), [richtlijn 2009/13/EG]
      (32009L0013), [richtlijn (EU) 2017/159](32017L0159), het SOLAS-verdrag, het STCW-verdrag, STCW F-verdrag, het MLC-
      verdrag of het C188-verdrag.

      3 De scheepsbeheerder draagt zorg voor behoorlijke en veilige huisvesting, recreatieve voorzieningen en kosteloos
      drinkwater en voeding van voldoende hoeveelheid, kwaliteit, voedingswaarde en variëteit en rekening houdend
      met godsdienstige voorschriften en culturele gebruiken voor de zeevarenden aan boord van zijn zeeschip, met
      inachtneming van de daaraan bij ministeriële regeling, in overeenstemming met de in het MLC-verdrag of het C188-
      verdrag gestelde eisen.

      4 De scheepsbeheerder draagt zorg voor een schriftelijk beleid ten aanzien van de voorkoming van alcohol- en
      drugsmisbruik door zeevarenden die veiligheidstaken, beveiligingstaken of taken die verband houden met het mariene
      milieu uitvoeren. Hierbij wordt aandacht geschonken aan voorlichting omtrent de gevolgen van het gebruik van
      alcohol en drugs en aan het gebruik van alcohol en drugs door zeevarenden tijdens het werk.

      5 De scheepsbeheerder verschaft de kapitein de middelen die hem in staat stellen om aan zijn verplichtingen
      ingevolge deze wet te voldoen.

      6 Bij ministeriële regeling kunnen in het belang van een goede uitvoering nadere regels worden gesteld met
      betrekking tot de uitvoering van het gestelde in het eerste tot en met het vijfde lid.
    url: https://wetten.overheid.nl/BWBR0050681/2025-07-01#Artikel4
  - number: '5'
    text: |-
      1 De scheepsbeheerder houdt, ten behoeve van de met het toezicht op de naleving van deze wet belaste autoriteiten,
      per schip van elk daarop dienstdoend bemanningslid een overzicht bij van ten minste het volgende:

      a. opleiding;

      b. diensttijd;

      c. bijzondere- of aanvullende beroepseisen;

      d. medische geschiktheid.

      2 Ter uitvoering van de in het eerste lid, onderdelen a tot en met c, bedoelde verplichting worden persoonsgegevens
      verwerkt. De verwerking van deze gegevens vindt plaats ten einde te kunnen beoordelen of de bemanning van de door
      de scheepsbeheerder beheerde zeeschepen voldoet aan de wettelijke eisen betreffende de kennis en vaardigheden
      en ter uitvoering van verdragen of bindende EU-rechtshandelingen alleen of gezamenlijk. De scheepsbeheerder is
      verwerkingsverantwoordelijke voor deze verwerking.

      3 Ter uitvoering van de in het eerste lid, aanhef en onderdeel d, bedoelde verplichting worden persoonsgegevens
      over gezondheid als bedoeld in artikel 4, onderdeel 15, van de Algemene verordening gegevensbescherming verwerkt.
      De verwerking van deze gegevens vindt plaats ten einde te kunnen beoordelen of de bemanning van de door de
      scheepsbeheerder beheerde zeeschepen voldoet aan de wettelijke eisen betreffende de lichamelijke en geestelijke
      geschiktheid en ter uitvoering van verdragen of bindende EU-rechtshandelingen alleen of gezamenlijk. De
      scheepsbeheerder is verwerkingsverantwoordelijke voor deze verwerking.

      4 Persoonsgegevens bedoeld in het eerste lid worden zo spoedig mogelijk en in ieder geval binnen vier weken
      vernietigd nadat deze niet langer nodig zijn ten behoeve van de met het toezicht op de naleving van deze wet
      belaste autoriteiten.
    url: https://wetten.overheid.nl/BWBR0050681/2025-07-01#Artikel5
  - number: '6'
    text: |-
      1 De scheepsbeheerder van een zeeschip draagt zorg voor de afhandeling van klachten over schending of
      vermoedelijke schending van het MLC-verdrag of het C188-verdrag volgens een door de scheepsbeheerder vastgestelde
      klachtenprocedure als bedoeld in voorschrift 5.1.5 van het MLC-verdrag.

      2 Bij ministeriële regeling worden regels gesteld waaraan de in het eerste lid bedoelde klachtenprocedure moet
      voldoen.
    url: https://wetten.overheid.nl/BWBR0050681/2025-07-01#Artikel6
  - number: '7'
    text: |-
      1 De scheepsbeheerder van een zeeschip, anders dan een vissersvaartuig, draagt zorg voor de nakoming van
      zijn verplichtingen op grond van [Boek 7, Titel 10, Afdeling 12, van het Burgerlijk Wetboek][ref1] en handelt
      overeenkomstig de voor het desbetreffende zeeschip afgegeven verklaring naleving maritieme arbeid deel I.

      2 De scheepsbeheerder van een vissersvaartuig, draagt zorg voor de nakoming van zijn verplichtingen op grond van
      [Boek 7, Titel 10, Afdeling 12A][ref2] of [12B, van het Burgerlijk Wetboek][ref3].

      3 Bij ministeriële regeling worden nadere regels gesteld over wijze waarop een zeevarende informatie omtrent zijn
      arbeidsvoorwaarden kan verkrijgen met inbegrip van een afschrift van zijn arbeidsovereenkomst, als bedoeld in Norm
      A2.1, van de Code bij het MLC-verdrag of artikel 18 van het C188-verdrag.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Afdeling12
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Afdeling12A
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Afdeling12B
    url: https://wetten.overheid.nl/BWBR0050681/2025-07-01#Artikel7
