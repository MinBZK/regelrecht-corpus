  - number: '3'
    text: |-
      1 Indien er sprake is van aantoonbare technologische innovatie kan Onze Minister na overleg met de betrokken
      organisaties van scheepsbeheerders en zeevarenden en andere betrokken belangenorganisaties ten behoeve
      van de uitvoering van een experiment gedurende ten hoogste drie jaar ontheffing verlenen van het bepaalde
      in de [artikelen 9, tweede en zesde lid][ref1], [20][ref2], [23, eerste tot en met vierde lid][ref3],
      [24, eerste tot en met het derde lid][ref4], [25, eerste tot en met vierde lid][ref5], of [71][ref6] en de daarop
      berustende bepalingen. Aan deze ontheffing worden ter waarborging van de veiligheid beperkingen en voorwaarden
      verbonden.

      2 Een ontheffing als bedoeld in het eerste lid heeft tot doel om vooruitlopend op mogelijke aanpassing van
      regelgeving te kunnen experimenteren met:

      a. de bemanningssamenstelling van een specifiek zeeschip; of

      b. de beroepseisen van zeevarenden werkzaam aan boord van een specifiek zeeschip.

      3 Bij of krachtens algemene maatregel van bestuur worden ter waarborging van de veiligheid nadere regels gesteld
      met betrekking tot de beperkingen en voorwaarden die aan een ontheffing worden verbonden.

      4 Indien evaluatie van het experiment aanleiding geeft tot het aanpassen van regelgeving, kan Onze Minister
      eenmalig een ontheffing met ten hoogste drie jaar verlengen met het oog op het aanpassen van die regelgeving.


