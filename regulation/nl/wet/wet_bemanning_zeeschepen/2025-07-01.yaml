    text: |-
      1 Ter uitvoering van de [artikelen 23 tot en met 32][ref1] worden persoonsgegevens en persoonsgegevens betreffende
      de gezondheid verwerkt. De verwerking van deze gegevens vindt plaats teneinde te kunnen beoordelen of degene
      die aan boord van een zeeschip werkzaamheden verricht waarvoor het bezit van een vaarbevoegdheidsbewijs of
      bekwaamheidsbewijs is vereist, voldoet of niet meer voldoet aan de wettelijke eisen betreffende de medische
      geschiktheid in verband met de afgifte of het behoud van een vaarbevoegdheidsbewijs. Onze Minister is
      verantwoordelijk voor deze verwerking.

      2 Ter uitvoering van [artikel 33][ref2] worden persoonsgegevens en persoonsgegevens betreffende de gezondheid
      verwerkt teneinde te kunnen beoordelen of een zeevarende in het bezit van een geldige geneeskundige verklaring
      zeevaart, medisch ongeschikt of onbekwaam is. Onze Minister is verantwoordelijk voor deze verwerking.

      3 Persoonsgegevens bedoeld in de [artikelen 23 tot en met 33][ref3] worden zo spoedig mogelijk en in ieder geval
      binnen vier weken vernietigd nadat deze niet langer nodig zijn ten behoeve van het beoordelen van de medische
      geschiktheid.


