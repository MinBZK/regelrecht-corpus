      - id: ref1
        bwb_id: BWBR0050681
        artikel: '57'
        hoofdstuk: '5'
        paragraaf: '3'
  - number: '59'
    text: |-
      1 Het hoger beroep wordt ingesteld bij beroepschrift. Bij het beroepschrift wordt overgelegd een afschrift van de
      schriftelijke beslissing van het tuchtcollege, waartegen het hoger beroep is gericht.

      2 De griffier van het College van Beroep voor het bedrijfsleven zendt binnen een week na ontvangst van het
      beroepschrift een afschrift daarvan aan de betrokken kapitein of officier, aan Onze Minister en aan de klager, voor
      zover het hoger beroep niet door hen is ingesteld, alsmede aan het tuchtcollege, en indien het tuchtcollege in zijn
      uitspraak een schorsing van de vaarbevoegdheid heeft opgelegd, tevens ter registratie aan het Centraal register
      bemanningsgegevens.

      3 Het tuchtcollege zendt binnen drie weken na ontvangst van het afschrift van het beroepschrift alle stukken die op
      de zaak betrekking hebben aan de griffier van het College van Beroep voor het bedrijfsleven.

      4 Het College van Beroep voor het bedrijfsleven behandelt de zaak opnieuw in volle omvang. Op de behandeling
      in hoger beroep zijn de [artikelen 49, eerste, tweede en derde lid][ref1], [50][ref2], [53][ref3], en
      [54 tot en met 57][ref4] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0050681#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0050681#Artikel50
      [ref3]: https://wetten.overheid.nl/BWBR0050681#Artikel53
      [ref4]: https://wetten.overheid.nl/BWBR0050681#Artikel54
