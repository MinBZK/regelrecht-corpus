  - number: 9c.2
    text: |-
      Het gezamenlijk bedrag van kosten als bedoeld in [artikel 9, eerste lid][ref1], voor zover die verband houden met
      een hierna te noemen post, wordt, behalve voor zover de kosten ten laste komen van de winst uit bedrijf van de
      belastingplichtige, in aanmerking genomen met inachtneming van de daarbij gegeven normering:


      [ref1]: https://wetten.overheid.nl/BWBR0029281#Artikel9
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel9c
    references:
