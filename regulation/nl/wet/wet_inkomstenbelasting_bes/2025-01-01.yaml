  - number: 41a
    text: |-
      Als voorheffing op de inkomstenbelasting wordt aangemerkt de geheven belasting, daaronder niet begrepen de bij
      naheffing toegepaste verhoging, ingevolge de:
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel41a
  - number: 41a.a
    text: |-
      [Wet loonbelasting BES][ref1], met uitzondering van de als eindheffing geheven loonbelasting;


      [ref1]: https://wetten.overheid.nl/BWBR0029283
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel41a
    references:
      - id: ref1
        bwb_id: BWBR0029283
  - number: 41a.b
    text: |-
      Opbrengstbelasting als bedoeld in de [Belastingwet BES][ref1], met uitzondering van de opbrengstbelasting geheven
      op basis van [artikel 5.8 van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0029244
      [ref2]: https://wetten.overheid.nl/BWBR0029244#Artikel5
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel41a
    references:
      - id: ref1
        bwb_id: BWBR0029244
      - id: ref2
        bwb_id: BWBR0029244
        artikel: '5'
  - number: 41b.1
    text: 'Een aanslag wordt niet vastgesteld en verrekening van voorheffingen blijft achterwege tenzij:'
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel41b
  - number: 41b.1.a
    text: de verschuldigde belasting de totale voorheffingen met meer dan USD 168 te boven gaat;
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel41b
  - number: 41b.1.b
    text: de belastingplichtige binnen 18 maanden na afloop van het belastingjaar aangifte heeft gedaan.
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel41b
  - number: 41b.2
    text: |-
      In het geval, bedoeld in het eerste lid, onderdeel b, wordt de aanslag vastgesteld op nihil en blijft verrekening
      van voorheffingen achterwege indien het totaal van die voorheffingen de verschuldigde belasting niet of met niet
      meer dan USD 84 te boven gaat.
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel41b
  - number: '42'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel42
