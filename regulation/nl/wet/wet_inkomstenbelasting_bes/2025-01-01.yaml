  - number: 9c.1
    text: |-
      Op de opbrengst uit arbeid, bedrijf en beroep, komen niet in mindering de in [artikel 9, eerste lid][ref1],
      bedoelde kosten welke verband houden met de volgende posten:


      [ref1]: https://wetten.overheid.nl/BWBR0029281#Artikel9
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel9c
    references:
      - id: ref1
        bwb_id: BWBR0029281
        artikel: '9'
        hoofdstuk: II
  - number: 9c.1.a
    text: 'de werkruimte, de inrichting daaronder begrepen, in de woning van de belastingplichtige als:'
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel9c
  - number: 9c.1.a.1°
    text: |-
      ingeval hij tevens soortgelijke werkruimte buiten die woning ter beschikking heeft, hij het gezamenlijke bedrag
      van zijn opbrengst uit arbeid, bedrijf en beroep voor minder dan tweederde in de werkruimte in die woning verwerft
      dan wel,
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel9c
  - number: 9c.1.a.2°
    text: |-
      ingeval hij niet tevens soortgelijke werkruimte buiten die woning ter beschikking heeft, hij het gezamenlijke
      bedrag van zijn opbrengst uit arbeid, bedrijf en beroep voor minder dan tweederde in of vanuit de werkruimte in die
      woning verwerft;
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel9c
  - number: 9c.1.b
    text: woon-werkverkeer;
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel9c
  - number: 9c.1.c
    text: vaartuigen die worden gebruikt voor representatieve doeleinden;
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel9c
  - number: 9c.1.d
    text: kleding, met uitzondering van werkkleding;
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel9c
  - number: 9c.1.e
    text: literatuur, met uitzondering van vakliteratuur;
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel9c
  - number: 9c.1.f
    text: telefoonabonnementen en internetaansluitingen op naam van de belastingplichtige in privé;
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel9c
  - number: 9c.1.g
    text: persoonlijke verzorging;
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel9c
