      [ref6]: https://wetten.overheid.nl/BWBR0029281#Artikel9
      [ref7]: https://wetten.overheid.nl/BWBR0029281#Artikel9b
      [ref8]: https://wetten.overheid.nl/BWBR0029281#Artikel10
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel18
