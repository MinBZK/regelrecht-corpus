    text: |-
      ingeval het een auto betreft die niet behoort tot het bedrijfsvermogen van een ondernemer: tot een bedrag van
      USD 0,20 per kilometer;
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel9c
  - number: 9c.3.b
    text: |-
      ingeval het een aan belastingplichtige ter beschikking gestelde auto betreft: het bedrag van de door hem betaalde
      brandstofkosten.
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel9c
  - number: 9c.4
    text: |-
      Het bepaalde in het eerste lid, onderdelen h en i, en het tweede lid, onderdeel b, is , voor zover de aldaar
      bedoelde kosten ten laste komen van de winst uit bedrijf van de belastingplichtige, slechts van toepassing op
      20% van die kosten. Het voorgaande is niet van toepassing met betrekking tot die kosten en lasten voor zover de
      onderneming direct is gericht op het vervaardigen of het verhandelen van de aldaar bedoelde goederen dan wel op het
      verrichten van daarmee verband houdende diensten, en deze deel uitmaken van de omzet.
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel9c
  - number: 9c.5
    text: 'Voor de toepassing van het eerste lid, onderdeel d, wordt kleding als werkkleding aangemerkt ingeval het:'
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel9c
  - number: 9c.5.a
    text: uitsluitend of nagenoeg uitsluitend geschikt is om bij het verwerven van de inkomsten te dragen;
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel9c
  - number: 9c.5.b
    text: |-
      is voorzien van zodanige uiterlijke kenmerken dat daaruit blijkt dat deze uitsluitend is bestemd om bij het
      verwerven van de inkomsten te dragen. Onze Minister kan nadere regels geven om te bepalen wanneer dit het geval is.
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel9c
  - number: 9c.6
    text: |-
      Voor zover kosten en lasten die verband houden met een misdrijf bij het bepalen van de winst in aanmerking zijn
      genomen in een of meer van de vijf jaren voorafgaande aan het jaar waarin de veroordeling, bedoeld in het eerste
      lid, onderdeel k, onherroepelijk is geworden, dan wel waarin aan de gestelde voorwaarden, bedoeld in het eerste
      lid, onderdeel l, is voldaan, wordt het bedrag ter grootte van de som van deze kosten en lasten gerekend tot de
      positieve voordelen van de winst uit bedrijf van het laatstbedoelde jaar.
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel9c
  - number: 9c.7
    text: |-
      Voor de toepassing van het eerste lid, onderdelen k en l, wordt met de belastingplichtige gelijk gesteld degene die
      ten behoeve van de belastingplichtige opdracht heeft gegeven tot het misdrijf dan wel aan het misdrijf feitelijk
      leiding heeft gegeven.
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel9c
  - number: '10.1'
    text: |-
      Uitgaven voor aankoop, stichting, verbetering of verandering van gronden, gebouwen, werktuigen, gereedschappen
      en andere goederen, die voor de uitoefening van het bedrijf of beroep worden gebruikt, uitgaven voor overneming,
      uitbreiding, verbetering of verandering van het bedrijf of beroep en andere uitgaven van die aard, worden niet als
      bedrijfs- of beroepskosten beschouwd.
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel10
  - number: '10.2'
    text: 'Uitgezonderd zijn:'
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel10
  - number: 10.2.a
    text: de uitgaven nodig ter vervanging van goederen, waarop niet wordt afgeschreven, gebouwen niet daaronder begrepen;
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel10
  - number: 10.2.b
    text: |-
      de uitgaven tot aanschaffing van voorwerpen van geringe waarde, voor zover die uitgaven gewoonlijk tot de
      dagelijkse onkosten van het bedrijf of beroep worden gerekend.
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel10
  - number: '10.3'
    text: 'Voorts is geen aftrek toegelaten ter zake van:'
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel10
  - number: 10.3.a
    text: het vormen of vergroten van een reservefonds; en
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel10
  - number: 10.3.b
    text: interest van eigen kapitaal.
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel10
  - number: 10.3.c
    text: '[vervallen].'
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel10
  - number: '10.4'
    text: |-
      In afwijking van het bepaalde in de derde lid kan, ingeval vergoedingen wegens verlies of beschadiging van een
      niet in het tweede lid, letter b bedoeld bedrijfsmiddel of de opbrengst bij vervreemding van zodanig bedrijfsmiddel
      de boekwaarde van dat bedrijfsmiddel dan wel van het beschadigde gedeelte overtreffen, bij het bepalen van de
      in een kalenderjaar genoten winst in elk geval, indien en zolang het voornemen tot vervanging of herstel van het
      bedrijfsmiddel bestaat, het verschil gereserveerd worden en blijven tot vermindering van de in aanmerking te nemen
      kosten van vervanging of herstel. Het bepaalde in de vorige volzin vindt overeenkomstige toepassing ingeval aan
      het voornemen tot vervanging van het bedrijfsmiddel reeds vóór de vervreemding gevolg is gegeven. De reserve wordt,
      voor zover zij het verschil tussen de kosten van vervanging of herstel en de boekwaarde van het verlorengegane of
      vervreemde bedrijfsmiddel dan wel het beschadigde gedeelte daarvan overtreft, in de winst opgenomen.
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel10
  - number: '10.5'
    text: |-
      De op de voet van het vierde lid gevormde reserve wordt uiterlijk in het vierde kalenderjaar volgende op dat
      waarin de reserve is ontstaan, in de winst opgenomen, tenzij voor de vervanging of het herstel een langer tijdvak
      vereist is dan wel de vervanging of het herstel, mits daaraan een begin van uitvoering is gegeven, door bijzondere
      omstandigheden is vertraagd.
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel10
  - number: '10.6'
    text: |-
      Voor de toepassing van [artikel 9 vijfde lid][ref1], blijft de vermindering van de kosten van vervanging of herstel
      ingevolge het vierde lid buiten aanmerking; het bedrag van die vermindering wordt geacht naar gelang van de op de
      voet van artikel 9, vijfde lid, mogelijke afschrijvingen te zijn afgeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0029281#Artikel9
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0029281
        artikel: '9'
        hoofdstuk: II
  - number: '10.7'
    text: |-
      Bij het staken van een bedrijf of beroep dan wel bij overdracht of liquidatie van het gedeelte waartoe de
      in het vierde lid bedoelde reserve behoort, wordt deze reserve aangemerkt als een voordeel in de zin van
      [artikel 6, letter d][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0029281#Artikel6
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0029281
        artikel: '6'
        hoofdstuk: II
  - number: '11.1'
    text: |-
      Tot de bestanddelen van het in het [vierde lid van artikel 3][ref1] omschreven inkomen behoren mede:


      [ref1]: https://wetten.overheid.nl/BWBR0029281#Artikel3
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0029281
        artikel: '3'
        hoofdstuk: II
  - number: 11.1.1°
    text: 'Afkoopsommen, schadeloosstellingen en tegemoetkomingen welke toegekend zijn:'
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel11
  - number: 11.1.1°.a
    text: |-
      ter vervanging van gederfde of te derven beloningen, al dan niet ingegane periodieke uitkeringen en andere
      opbrengsten of inkomsten dan wel
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel11
  - number: 11.1.1°.b
    text: |-
      ter zake van het staken of niet verrichten van werkzaamheden in de ruimste zin, dan wel wegens het prijsgeven van
      een uitzicht op deelgerechtigdheid in een bedrijf of een zelfstandig uitgeoefend beroep;
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel11
  - number: 11.1.2°
    text: |-
      hetgeen bij vervreemding van aandelen in een vennootschap waarvan het kapitaal geheel of ten dele in aandelen is
      verdeeld en welke in liquidatie is getreden of waarschijnlijk binnenkort in liquidatie zal treden, ontvangen wordt
      boven het op de desbetreffende aandelen gestorte kapitaal; behoudens het bepaalde in het sub 3° van dit lid geldt
      deze bepaling niet, indien de nieuwe verkrijger een op de BES eilanden wonende belastingplichtige is, die bij de
      verkrijging niet in de uitoefening van een bedrijf of beroep heeft gehandeld;
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel11
  - number: 11.1.3°
    text: 'De winst uit aanmerkelijk belang, zijnde het gezamenlijke bedrag van:'
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel11
  - number: 11.1.3°.a
    text: |-
      voordelen welke worden getrokken uit tot een aanmerkelijk belang behorende aandelen of winstbewijzen verminderd met
      de aftrekbare kosten (reguliere voordelen);
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel11
  - number: 11.1.3°.b
    text: |-
      voordelen welke worden behaald bij de vervreemding van tot een aanmerkelijk belang behorende aandelen,
      winstbewijzen of schuldvorderingen, alsmede bij de vervreemding van een gedeelte van de daarin besloten liggende
      rechten (vervreemdingsvoordelen).
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel11
  - number: '11.2'
    text: |-
      Bestaat de afkoopsom, schadeloosstelling, tegemoetkoming dan wel het in het eerste lid onder 2° bedoelde bedrag
      in de toekenning van een recht, dat periodieke opbrengsten oplevert (zoals het recht op een lijfrente of op een
      winstaandeel) dan worden slechts deze periodieke opbrengsten, doch niet het eraan ten grondslag liggende recht
      (stamrecht), tot het inkomen gerekend, tenzij het stamrecht tot het loon behoort.
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel11
  - number: '11.3'
    text: 'De belastingplichtige heeft een aanmerkelijk belang indien hij al dan niet tezamen met zijn echtgenoot:'
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel11
  - number: 11.3.a
    text: |-
      voor ten minste 5% van het geplaatste kapitaal onmiddellijk of middellijk aandeelhouder is geweest in een
      vennootschap waarvan het kapitaal geheel of ten dele in aandelen is verdeeld;
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel11
  - number: 11.3.b
    text: rechten heeft om direct of indirect aandelen te verwerven tot ten minste 5% van het geplaatste aandelenkapitaal;
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel11
  - number: 11.3.c
    text: |-
      winstbewijzen heeft die betrekking hebben op ten minste 5% van de jaarwinst van een vennootschap dan wel op ten
      minste 5% van wat bij liquidatie wordt uitgekeerd.
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel11
  - number: '11.4'
    text: Voor de belastingplichtige behoren mede tot een aanmerkelijk belang;
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel11
  - number: 11.4.a
    text: 'indien hij een aanmerkelijk belang heeft: zijn overige winstbewijzen van en schuldvorderingen op die vennootschap;'
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel11
  - number: 11.4.b
    text: |-
      indien hij geen aanmerkelijk belang heeft: de tot zijn vermogen behorende aandelen in, winstbewijzen van en
      schuldvorderingen, alsmede daarop betrekking hebbende koopopties, op een vennootschap waarin hij geen, maar zijn
      echtgenoot of een van hun bloed- of aanverwanten in de rechte lijn wel een aanmerkelijk belang heeft.
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel11
  - number: '11.5'
    text: 'Onder vervreemding van aandelen, winstbewijzen of schuldvorderingen wordt mede begrepen:'
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel11
  - number: 11.5.a
    text: het inkopen van aandelen;
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel11
  - number: 11.5.b
    text: het afkopen en inkopen van winstbewijzen;
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel11
  - number: 11.5.c
    text: het betaalbaar stellen van liquidatie-uitkeringen;
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel11
  - number: 11.5.d
    text: het aflossen van schuldvorderingen;
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel11
  - number: 11.5.e
    text: het brengen in het vermogen van een onderneming;
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel11
  - number: 11.5.f
    text: het niet langer aanwezig zijn van een aanmerkelijk belang;
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel11
  - number: 11.5.g
    text: |-
      het anders dan door overlijden ophouden op de BES eilanden te wonen, hieronder begrepen de situatie waarin de
      belastingplichtige ingevolge het bepaalde in een verdrag of regeling ter voorkoming van dubbele belasting voor
      de toepassing van die regeling, onderscheidenlijk dat verdrag, geacht wordt geen inwoner van de BES eilanden meer
      te zijn.
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel11
  - number: '11.6'
    text: |-
      De vervreemdingsvoordelen worden gesteld op de overdrachtsprijs verminderd met de verkrijgingsprijs. Ingeval een
      overdrachtsprijs of verkrijgingsprijs ontbreekt of is bedongen bij een niet onder normale omstandigheden gesloten
      overeenkomst wordt als overdrachtsprijs, onderscheidenlijk verkrijgingsprijs, aangemerkt de waarde welke ten tijde
      van de vervreemding, onderscheidenlijk de verkrijging, in het economische verkeer aan de aandelen of winstbewijzen
      kan worden toegekend. Ten aanzien van aan het vermogen van een onderneming onttrokken aandelen of winstbewijzen
      geldt als verkrijgingsprijs de waarde welke daaraan ten tijde van de onttrekking in het economische verkeer kan
      worden toegekend. Ten aanzien van krachtens erfrecht of huwelijksvermogensrecht opgekomen aandelen of winstbewijzen
      geldt als verkrijgingsprijs die welke geldt voor de erflater, onderscheidenlijk degene van wiens zijde de aandelen
      in de gemeenschap zijn gevallen.
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel11
  - number: '11.7'
    text: |-
      Ingeval de belastingplichtige zich metterwoon op de BES eilanden vestigt en op dat tijdstip aandelen in of
      winstbewijzen van een vennootschap heeft, wordt de verkrijgingsprijs van die aandelen of winstbewijzen gesteld
      op de waarde welke op dat tijdstip in het economische verkeer aan die aandelen of winstbewijzen kan worden
      toegekend. De vorige volzin vindt geen toepassing ingeval de belastingplichtige zich metterwoon op de BES eilanden
      vestigt binnen tien jaren na deze metterwoon te hebben verlaten. Indien reeds een belastingaanslag is opgelegd
      bij vertrek van de belastingplichtige uit de BES eilanden, dan wordt deze belastingaanslag kwijtgescholden en
      wordt de verkrijgingsprijs gesteld op het bedrag van de verkrijgingsprijs voorafgaande aan zijn vertrek. De
      eerste volzin vindt voorts geen toepassing ingeval het aandelen of winstbewijzen van een op de BES eilanden
      gevestigde vennootschap betreft behoudens voor zover blijkt dat de belastingplichtige in verband met het metterwoon
      verlaten van een ander land belasting verschuldigd is over de waarde-aangroei van die aandelen, winstbewijzen of
      schuldvorderingen.
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel11
  - number: '11.8'
    text: |-
      Het vijfde lid, onderdeel g, vindt met betrekking tot een aanmerkelijk belang in een niet op de BES eilanden
      gevestigde vennootschap geen toepassing indien het in dat lid bedoelde ophouden op de BES eilanden te wonen
      plaatsvindt binnen acht jaren nadat de belastingplichtige zich metterwoon op de BES eilanden heeft gevestigd en hij
      sedert de laatste vijfentwintig jaren in totaal niet langer dan tien jaren op de BES eilanden heeft gewoond.
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel11
  - number: '11.9'
    text: 'Winst uit aanmerkelijk belang wordt beschouwd te zijn genoten ten aanzien van:'
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel11
  - number: 11.9.a
    text: |-
      reguliere voordelen: op het tijdstip bepaald overeenkomstig [artikel 16B][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0029281#Artikel16b
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0029281
        artikel: 16b
        hoofdstuk: II
  - number: 11.9.b
    text: |-
      vervreemdingsvoordelen: op het tijdstip van de vervreemding, met dien verstande dat in geval van het ophouden van
      de binnenlandse belastingplicht als tijdstip van genieten wordt aangemerkt het tijdstip dat onmiddellijk voorafgaat
      aan het ophouden van de binnenlandse belastingplicht.
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel11
  - number: '11.10'
    text: |-
      Het tweede lid is niet van toepassing op afkoop van pensioen, behoudens voor zover het betreft een overgang als
      bedoeld in [artikel 6B, tweede lid, tweede volzin, van de Wet loonbelasting BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0029283#Artikel6b
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0029283
        artikel: 6b
  - number: '11.11'
    text: |-
      Het tweede lid is voorts niet van toepassing op afkoop van een recht op lijfrente als bedoeld in
      [artikel 16, eerste lid, onderdeel e][ref1], behoudens voor zover het recht wordt omgezet in een ander recht op een
      soortgelijke lijfrente.


      [ref1]: https://wetten.overheid.nl/BWBR0029281#Artikel16
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0029281
        artikel: '16'
        hoofdstuk: II
  - number: '12.1'
    text: |-
      De belasting wordt geheven over de in enig kalenderjaar genoten belastbare som. Heeft de belastingplicht slechts
      gedurende een gedeelte van het kalenderjaar bestaan, dan treedt dit gedeelte (belastingtijdvak) daarvoor in
      de plaats. Ter berekening van de dan verschuldigde belasting wordt het in het belastingtijdvak genoten zuiver
      inkomen, met uitzondering van het inkomen, bedoeld in [artikel 11, tiende en elfde lid][ref1], herleid tot een
      voljaarsinkomen. Van de hierover volgens [artikel 24A][ref2] verschuldigde belasting, na vermindering van de
      in [artikel 24, tweede en derde lid][ref3], bedoelde bedragen, is zoveel driehonderdzestigsten verschuldigd
      als het aantal dagen bedraagt waarover in het kalenderjaar belastingplicht heeft bestaan. Bij de toepassing van
      het bovenstaande wordt iedere volle maand op dertig dagen en het jaar op 360 gesteld, terwijl de dag waarop een
      belastingtijdvak begint voor een volle dag wordt gerekend en de dag waarop een belastingtijdvak eindigt wordt
      verwaarloosd.


      [ref1]: https://wetten.overheid.nl/BWBR0029281#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0029281#Artikel24a
      [ref3]: https://wetten.overheid.nl/BWBR0029281#Artikel24
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0029281
        artikel: '11'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0029281
        artikel: 24a
        hoofdstuk: V
      - id: ref3
        bwb_id: BWBR0029281
        artikel: '24'
        hoofdstuk: V
  - number: '12.2'
    text: |-
      Indien het in het vorige lid bedoelde herleide voljaarinkomen hoger is dan het inkomen dat, had de belastingplicht
      het gehele kalenderjaar bestaan, naar schatting in dat jaar zou zijn genoten, dan kan belastingplichtige verzoeken
      dat de verschuldigde belasting wordt bepaald aan de hand van de formule:








                    verschuldigde bedrag =


                    belastbare som genoten in het belastingtijdvak


                    x


                    de belasting van het geschatte jaarinkomen





                    geschat jaarinkomen





           volgens het tarief als bedoeld in [artikel 24A][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0029281#Artikel24a
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0029281
        artikel: 24a
        hoofdstuk: V
  - number: '12.3'
    text: |-
      Bij de toepassing van dit artikel worden de bedragen, genoemd in de
      [artikelen 9, derde lid][ref1], [16, eerste lid, onderdelen c en h, en het vierde lid][ref2], en
      [artikel 16A, eerste lid, onderdeel e, tweede lid, onderdeel c, en het vijfde lid, onderdeel a][ref3], evenredig
      toegepast voor het belastingtijdvak waarover de belastingplicht heeft bestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0029281#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0029281#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0029281#Artikel16a
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0029281
        artikel: '9'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0029281
        artikel: '16'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0029281
        artikel: 16a
        hoofdstuk: II
  - number: '13.1'
    text: |-
      Aandelen in de opbrengst van een bedrijf of beroep, dat niet door de belastingplichtige zelve wordt uitgeoefend,
      worden beschouwd als baten van het kalenderjaar waarin hun bedrag wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel13
  - number: '13.2'
    text: |-
      Heeft die vaststelling plaats nadat de belastingplichtige de BES eilanden metterwoon heeft verlaten dan wel na
      diens overlijden, dan wordt deze geacht plaats te hebben gehad in het jaar waarin de belastingplichtige de BES
      eilanden verliet dan wel overleed, doch in ieder geval vóór dit vertrek of overlijden.
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel13
  - number: '14'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel14
  - number: '15.1'
    text: |-
      Indien de berekening van het zuiver inkomen leidt tot een negatief bedrag wordt dit aangemerkt als een verlies. Een
      verlies wordt verrekend met de zuivere inkomens van de volgende vijf belastingjaren, te beginnen bij het eerste van
      die jaren.
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel15
  - number: '15.2'
    text: |-
      Ingeval het huwelijk door overlijden van de belastingplichtige wordt ontbonden wordt diens verlies
      voor zover dat is voortgevloeid uit andere bestanddelen van het zuiver inkomen dan zijn bedoeld in
      [artikel 20, tweede en derde lid][ref1], verrekend met zuivere inkomens van de echtgenoot. De vorige volzin is
      slechts van toepassing indien zowel de belastingplichtige als zijn echtgenoot op het tijdstip van ontbinding van
      het huwelijk binnenlands belastingplichtig was.


      [ref1]: https://wetten.overheid.nl/BWBR0029281#Artikel20
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0029281
        artikel: '20'
        hoofdstuk: IV
  - number: '15.3'
    text: |-
      Ingeval het huwelijk wordt ontbonden anders dan door overlijden wordt het verlies van een belastingplichtige
      voor zover dit is voortgevloeid uit bestanddelen van zijn zuiver inkomen welke van de zijde van zijn echtgenoot
      zijn opgekomen en niet kan worden verrekend met zuiver inkomen van de jaren waarin het huwelijk heeft bestaan,
      uitsluitend verrekend met zuivere inkomens van de gewezen echtgenoot. Met ontbinding van een huwelijk wordt
      gelijkgesteld het duurzaam gescheiden gaan leven.
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel15
  - number: '16.1'
    text: 'Persoonlijke lasten zijn:'
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel16
  - number: 16.1.a
    text: |-
      lijfrenten en andere periodieke uitkeringen en verstrekkingen als bedoeld in [artikel 7][ref1], met dien verstande
      dat:


      [ref1]: https://wetten.overheid.nl/BWBR0029281#Artikel7
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0029281
        artikel: '7'
        hoofdstuk: II
  - number: 16.1.a.1°
    text: |-
      indien zij de tegenwaarde van een prestatie vormen zij slechts aftrekbaar zijn voor zover zij, tezamen met de ter
      zake van de desbetreffende verplichting reeds betaalde uitkeringen, de waarde van de prestatie te boven gaan;
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel16
  - number: 16.1.a.2°
    text: |-
      in de niet onder 1° bedoelde gevallen geen aftrek is toegestaan ter zake van uitgaven gedaan aan bloed- en
      aanverwanten in de rechte lijn of in de tweede graad van de zijlijn;
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel16
  - number: 16.1.b
    text: pensioenen;
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel16
  - number: 16.1.c
    text: |-
      de niet als kosten tot verwerving, inning, en behoud der opbrengst en op de opbrengst rustende lasten aan te merken
      renten van schulden en kosten van geldleningen tot een bedrag van USD 1.397;
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel16
  - number: 16.1.d
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel16
  - number: 16.1.e
    text: |-
      premies van levensverzekeringen, lijfrente of pensioenverzekering, met uitzondering van de premies als bedoeld
      onder d;
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel16
  - number: 16.1.f
    text: |-
      giften aan op de BES eilanden gevestigde kerkelijke, charitatieve, culturele, wetenschappelijke en het algemeen nut
      beogende instellingen, mits deze giften met schriftelijke bewijsstukken worden aangetoond, indien en voor zover zij
      in totaal een ten honderd van het inkomen en tevens USD 56 te boven gaan, met dien verstande dat het in mindering
      te brengen bedrag ten hoogste drie ten honderd van het inkomen beloopt;
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel16
  - number: 16.1.h
    text: |-
      de volgende kosten welke verband houden met de eigen woning die de belastingplichtige als hoofdverblijf ter
      beschikking staat:
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel16
  - number: 16.1.h.1°
    text: |-
      rente van schulden en kosten van geldlening aangegaan ter verkrijging, onderhoud of verbetering van de eigen
      woning, alsmede de premies voor een aan die lening verbonden met de looptijd dalende overlijdens-risicoverzekering,
      tot ten hoogste een bedrag van USD 15.364 alsmede het onbenut gebleven deel van het bedrag, genoemd in onderdeel c;
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel16
  - number: 16.1.h.2°
    text: |-
      kosten van onderhoud van de eigen woning tot een bedrag van 2% van de waarde van de woning voor de toepassing van
      de grondbelasting met een maximum van USD 1.676;
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel16
  - number: 16.1.h.3°
    text: |-
      kosten van onderhoud van de eigen woning die volgens een eilandelijke monumentenverordening is aangewezen tot
      beschermd monument;
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel16
  - number: 16.1.h.4°
    text: |-
      premies voor brand- en natuurrampenverzekeringen. Voor de toepassing van dit onderdeel wordt onder eigen woning,
      die de belastingplichtige als hoofdverblijf ter beschikking staat, mede begrepen andere eigen woningen, die de
      belastingplichtige ter beschikking staan.
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel16
  - number: '16.2'
    text: |-
      Voor de premiën, bedoeld onder letter e van het vorige lid, kan niet meer dan vijf ten honderd van
      het inkomen en niet meer dan USD 559 worden afgetrokken. Het bedrag, bedoeld in de eerste zin, met
      inachtneming van het derde lid, wordt verminderd, doch niet verder dan tot nihil, met de van de
      werknemer ingehouden verplichte bijdrage voor pensioenen en pensioenfondsen die met toepassing van
      [artikel 6, vijfde lid, onderdeel j, onder 1˚, van de Wet loonbelasting BES][ref1] op het loon in mindering zijn
      gebracht. Als giften worden voor de toepassing van het vorige lid onder f uitsluitend aangemerkt bevoordelingen uit
      vrijgevigheid en niet verplichte bijdragen, indien en voor zover aan deze bevoordelingen en bijdragen geen op geld
      waardeerbare aanspraak wordt ontleend, alsmede kerkelijke belastingen.


      [ref1]: https://wetten.overheid.nl/BWBR0029283#Artikel6
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0029283
        artikel: '6'
  - number: '16.3'
    text: |-
      Het maximum bedoeld in het eerste lid onder c en tweede lid van dit artikel en in het
      [3e en 6e lid van artikel 9][ref1] gelden voor een aanslag over een vol jaar; indien er sprake is van een
      belastingtijdvak, worden deze maxima naar evenredigheid verminderd naar gelang het aantal dagen van het
      belastingtijdvak.


      [ref1]: https://wetten.overheid.nl/BWBR0029281#Artikel9
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0029281
        artikel: '9'
        hoofdstuk: II
  - number: '16.4'
    text: |-
      In geval een woning aan twee of meer belastingplichtigen tegelijkertijd als hoofdverblijf ter beschikking staat,
      worden in afwijking van het eerste lid, onderdeel h, de aldaar genoemde maximale bedragen voor elk van hen naar
      evenredigheid toegepast.
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel16
  - number: '16.5'
    text: |-
      Ten aanzien van de belastingplichtige aan wie de in [artikel 20, tweede en derde lid][ref1], bedoelde bestanddelen
      van het inkomen van zijn echtgenoot worden toegerekend:


      [ref1]: https://wetten.overheid.nl/BWBR0029281#Artikel20
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0029281
        artikel: '20'
        hoofdstuk: IV
  - number: 16.5.1°
    text: wordt het bedrag, genoemd in het eerste lid, onderdeel c, verhoogd tot USD 2.794;
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel16
  - number: 16.5.2°
    text: |-
      geldt voor de toepassing van het eerste lid, onderdeel f, en het tweede lid, in plaats van het inkomen van de
      belastingplichtige het gezamenlijke bedrag van het inkomen van de belastingplichtige en dat van zijn echtgenoot.
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel16
  - number: 16a.1
    text: 'Buitengewone lasten zijn de op de belastingplichtige drukkende uitgaven:'
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel16a
  - number: 16a.1.a
    text: |-
      ter zake van ziekte, invaliditeit, bevalling en overlijden van de belastingplichtige, diens echtgenoot, diens eigen
      en aangehuwde kinderen en pleegkinderen en van diens bloed- of aanverwanten in de rechte linie of in de tweede
      graad van de zijlinie;
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel16a
  - number: 16a.1.b
    text: ter zake van opleiding of studie voor een beroep van hemzelf of zijn echtgenoot;
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel16a
  - number: 16a.1.c
    text: |-
      tot voorziening in het noodzakelijke levensonderhoud van eigen en aangehuwde kinderen en pleegkinderen die 27 jaar
      of ouder zijn en van andere bloed- of aanverwanten in de rechte linie of in de tweede graad van de zijlinie, voor
      zover die personen niet bij machte zijn zelf inkomsten ter voorziening in hun levensonderhoud te verwerven;
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel16a
  - number: 16a.1.d
    text: |-
      tot voorziening in het noodzakelijke levensonderhoud van kinderen tot 27 jaar die tengevolge van ziekte of gebreken
      buiten staat zijn om de helft te verdienen van hetgeen lichamelijk en geestelijk gezonde kinderen, voor zover die
      kinderen niet bij machte zijn zelf inkomsten ter voorziening in hun levensonderhoud te verwerven;
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel16a
  - number: 16a.1.e
    text: |-
      ter zake van de kosten van studie van een middelbaar beroeps-, hoger beroeps-, universitaire of daarmee
      vergelijkbare opleiding voor eigen kinderen, kinderen van de echtgenoot en pleegkinderen tot 27 jaar tot een bedrag
      van ten hoogste USD 5.587 per kind.
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel16a
  - number: 16a.2
    text: |-
      De gezamenlijke uitgaven voor zover verband houdend met een hierna te noemen post wordt in aanmerking genomen met
      inachtneming van de daarbij gegeven normering:
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel16a
  - number: 16a.2.a
    text: |-
      de met de in het eerste lid, onderdeel a, bedoelde uitgaven verband houdende kosten van vervoer per auto tot een
      bedrag van USD 0,20 per kilometer, of, indien het betreft een ter beschikking gestelde auto, de brandstofkosten;
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel16a
  - number: 16a.2.b
    text: |-
      de in het eerste lid, onderdeel b, bedoelde uitgaven: 75% van de kosten van verblijf buiten het eiland waar de
      belastingplichtige woont;
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel16a
  - number: 16a.2.c
    text: |-
      de in het eerste lid, onderdeel c, bedoelde uitgaven: ten hoogste USD 1.397 per ondersteunde met dien verstande dat
      het totaal in aanmerking te nemen bedrag niet meer beloopt dan 10% van het inkomen van de belastingplichtige.
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel16a
  - number: 16a.3
    text: 'Tot de buitengewone lasten worden niet gerekend:'
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel16a
  - number: 16a.3.a
    text: |-
      ter zake van studiekosten: andere kosten dan school- of collegegeld, kosten van boeken en ander verplicht
      lesmateriaal niet zijnde voorwerpen als omschreven in [artikel 9C, tweede lid, onderdeel a][ref1], alsmede kosten
      van interinsulair of internationaal vervoer, met dien verstande dat in geval van het eerste lid, onderdeel e, ten
      hoogste aftrekbaar is de met één reis per jaar per kind gemoeide kosten van vervoer;


      [ref1]: https://wetten.overheid.nl/BWBR0029281#Artikel9c
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel16a
    references:
      - id: ref1
        bwb_id: BWBR0029281
        artikel: 9c
        hoofdstuk: II
  - number: 16a.3.b
    text: |-
      de premie die verschuldigd is ingevolge de [Wet algemene verzekering bijzondere ziektekosten BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028294
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel16a
    references:
      - id: ref1
        bwb_id: BWBR0028294
  - number: 16a.4
    text: |-
      De in het eerste lid, onderdelen a, c en d, bedoelde uitgaven worden in aanmerking genomen voor zover zij
      gezamenlijk meer bedragen dan 5% van het inkomen, doch ten minste USD 838.
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel16a
  - number: 16a.5
    text: |-
      Ten aanzien van de belastingplichtige aan wie de in [artikel 20, tweede en derde lid][ref1], bedoelde bestanddelen
      van het inkomen van zijn echtgenoot worden toegerekend:


      [ref1]: https://wetten.overheid.nl/BWBR0029281#Artikel20
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel16a
    references:
      - id: ref1
        bwb_id: BWBR0029281
        artikel: '20'
        hoofdstuk: IV
  - number: 16a.5.a
    text: wordt het bedrag, genoemd in het eerste lid, onderdeel e, verhoogd tot USD 11.174;
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel16a
  - number: 16a.5.b
    text: |-
      geldt voor de toepassing van het tweede lid, onderdeel c, en het vierde lid in plaats van het inkomen van de
      belastingplichtige het gezamenlijke bedrag van het inkomen van de belastingplichtige en dat van zijn echtgenoot.
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel16a
  - number: 16a.6
    text: |-
      Onze Minister kan nadere regels stellen op grond waarvan ingeval van twee ongehuwde ouders het recht op aftrek,
      bedoeld in het derde lid, kan worden overgeheveld naar de andere ouder dan wel in geval van één-ouderschap de
      aftrek kan worden verdubbeld.
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel16a
  - number: 16b.1
    text: 'Opbrengsten, andere dan winst uit bedrijf of beroep, worden beschouwd te zijn genoten op het tijdstip waarop zij:'
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel16b
  - number: 16b.1.a
    text: |-
      ontvangen of verrekend zijn, ter beschikking van de belastingplichtige zijn gesteld of rentedragend zijn geworden;
      dan wel
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel16b
  - number: 16b.1.b
    text: vorderbaar en tevens inbaar zijn geworden.
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel16b
  - number: 16b.2
    text: |-
      Op die opbrengsten in mindering te brengen kosten en lasten, zomede de persoonlijke lasten en de buitengewone
      lasten, worden in aanmerking genomen op het tijdstip waarop zij betaald of verrekend zijn, door de
      belastingplichtige ter beschikking zijn gesteld of rentedragend zijn geworden.
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel16b
  - number: '17.1'
    text: |-
      De niet op de BES eilanden wonende personen bedoeld in [artikel 1, lid 3][ref1], zijn belastingplichtig naar hun
      gehele belastbaar inkomen genoten in het kalenderjaar of belastingtijdvak, voor zover dit werd verkregen uit de
      opbrengst van:


      [ref1]: https://wetten.overheid.nl/BWBR0029281#Artikel1
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0029281
        artikel: '1'
        hoofdstuk: I
  - number: 17.1.a
    text: '[vervallen];'
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel17
  - number: 17.1.b
    text: |-
      schuldvorderingen, welke, wat de hoofdsom betreft, verzekerd zijn door hypotheek, gevestigd op op de BES eilanden
      gelegen onroerende zaken of de rechten waaraan deze zijn onderworpen;
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel17
  - number: 17.1.c
    text: |-
      andere bestanddelen van het roerend kapitaal, geen effecten zijnde, welker opbrengst afhankelijk is hetzij van
      de opbrengst van een bedrijf of beroep, dat en voor zover het op de BES eilanden wordt uitgeoefend; hetzij van de
      hoeveelheid of de opbrengst van enig produkt, op de BES eilanden gewonnen, bewerkt of verwerkt;
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel17
  - number: 17.1.d
    text: |-
      bedrijven en beroepen (ambt, waardigheid, bediening en bestaande of vroegere dienstbetrekking door henzelf of
      door een ander vervuld daaronder begrepen), die en voor zover zij persoonlijk of door vaste vertegenwoordigers of
      gemachtigden op de BES eilanden worden uitgeoefend. Indien die uitoefening slechts tijdelijk geschiedt en korter
      dan drie maanden achtereen duurt, kan bij ministeriële regeling gehele of gedeeltelijke ontheffing van belasting
      worden verleend;
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel17
  - number: 17.1.e
    text: |-
      aandelen in, of winstbewijzen, obligaties of schuldvorderingen ten laste van een op de BES eilanden gevestigde
      vennootschap welker kapitaal geheel of ten dele in aandelen is verdeeld;
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel17
  - number: 17.1.f
    text: |-
      vervreemding van tot een aanmerkelijk belang behorende aandelen in of winstbewijzen van een vennootschap waarbij
      het kapitaal geheel of ten dele in aandelen is verdeeld;
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel17
  - number: 17.1.g
    text: |-
      een bestaande of vroegere dienstbetrekking door henzelf of door een ander vervuld als bestuurder of commissaris
      van een op de BES eilanden gevestigd lichaam, ook in het geval van beperking van de bevoegdheid tot buiten de BES
      eilanden gelegen gedeelten van de onderneming van dat lichaam;
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel17
  - number: 17.1.h
    text: |-
      uit de lands- of eilandskas bezoldigde ambten, terwijl de aan deze ambten verbonden werkzaamheden buiten de BES
      eilanden werden verricht.
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel17
  - number: '17.2'
    text: |-
      Het eerste lid, onderdelen e en f, is slechts van toepassing op niet op de BES eilanden wonende natuurlijke
      personen die in de loop van de laatste tien jaren voorafgaande aan het verkrijgen van de opbrengst uit de aandelen,
      winstbewijzen, obligaties en schuldvorderingen, bedoeld in onderdeel e van genoemd lid dan wel de vervreemding van
      de aandelen of winstbewijzen, bedoeld in onderdeel f van genoemd lid inwoner van de BES eilanden zijn geweest.
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel17
  - number: '17.3'
    text: |-
      Voor de toepassing van het eerste lid, onderdeel f, wordt de verkrijgingsprijs van aandelen en winstbewijzen welke
      tot een aanmerkelijk belang behoren en ter zake waarvan bij het door de belastingplichtige metterwoon verlaten van
      de BES eilanden vervreemdingsvoordelen in aanmerking zijn genomen, gesteld op de waarde in het economische verkeer
      waarvan is uitgegaan voor de berekening van die voordelen.
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel17
  - number: '17.4'
    text: |-
      Voor de toepassing van dit artikel wordt een lichaam waarvan de oprichting heeft plaatsgevonden naar het op de BES
      eilanden geldende recht steeds geacht op de BES eilanden te zijn gevestigd.
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel17
  - number: '18.1'
    text: |-
      De zuivere opbrengst van de in [artikel 17][ref1] genoemde bronnen van inkomen wordt bepaald met inachtneming van
      de beginselen van de [artikelen 4][ref2], [5][ref3], [6][ref4], [7][ref5], [9][ref6], [9B][ref7] en [10][ref8].


      [ref1]: https://wetten.overheid.nl/BWBR0029281#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0029281#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0029281#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0029281#Artikel6
