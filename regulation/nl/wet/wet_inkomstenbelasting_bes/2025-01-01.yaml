        artikel: '16'
        hoofdstuk: II
  - number: '18.3'
    text: '[vervallen].'
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel18
  - number: '18.4'
    text: |-
      [Artikel 16][ref1] is zijn niet op de in dit hoofdstuk bedoelde belastingplichtigen van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0029281#Artikel16
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0029281
        artikel: '16'
