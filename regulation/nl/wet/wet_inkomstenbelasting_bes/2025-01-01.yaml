        artikel: '8'
      - id: ref7
        bwb_id: BWBR0028395
        artikel: '8'
  - number: 20.3.c.3°
    text: verkregen in verband met invaliditeit, ziekte of ongeval;
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel20
  - number: 20.3.c.4°
    text: bedongen in rechtstreeks verband met of bij het staken van een onderneming;
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel20
  - number: 20.3.c.5°
    text: verkregen ter zake van echtscheiding of scheiding van tafel en bed.
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel20
  - number: '20.4'
    text: |-
      De persoonlijke verminderingen van het inkomen zijn de premies als bedoeld in
      [artikel 16, eerste lid, onderdeel e][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0029281#Artikel16
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0029281
        artikel: '16'
        hoofdstuk: II
  - number: '20.5'
    text: |-
      Bij de scheiding van goederen blijft op verzoek van een dan wel van beide echtgenoten het tweede lid buiten
      toepassing. In dat geval wordt de belasting berekend als ware het tweede lid wel van toepassing. Vervolgens wordt
      de door beide echtgenoten tezamen verschuldigde belasting omgeslagen in verhouding van ieders zuiver inkomen.
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel20
  - number: 20a.1
    text: |-
      Het persoonlijk inkomen van een minderjarig kind, alsmede de persoonlijke verminderingen van zijn inkomen, wordt
      aangemerkt als inkomen van dat kind.
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel20a
  - number: 20a.2
    text: |-
      Het zuiver inkomen van een minderjarig kind, anders dan dat bedoeld in het eerste lid, wordt, onverminderd het
      bepaalde in [artikel 20, tweede lid][ref1], aangemerkt als zuiver inkomen van de belastingplichtige die het gezag
      over dat kind uitoefent.


      [ref1]: https://wetten.overheid.nl/BWBR0029281#Artikel20
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel20a
    references:
      - id: ref1
        bwb_id: BWBR0029281
        artikel: '20'
        hoofdstuk: IV
  - number: '21'
    text: |-
      Indien ingevolge de [artikelen 20][ref1] en [20A][ref2] inkomensbestanddelen van een derde zijn toegerekend aan
      de belastingplichtige is die derde, onverminderd zijn aansprakelijkheid uit andere hoofde, aansprakelijk voor een
      evenredig deel van de verschuldigde belasting, bepaald naar verhouding van de zonder toepassing van dat artikel
      berekende belastbare inkomens.


      [ref1]: https://wetten.overheid.nl/BWBR0029281#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0029281#Artikel20a
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0029281
        artikel: '20'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0029281
        artikel: 20a
        hoofdstuk: IV
  - number: '22'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel22
  - number: '23'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel23
  - number: 23a
    text: '[vervallen]'
