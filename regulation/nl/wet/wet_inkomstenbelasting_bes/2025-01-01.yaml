  - number: 23e
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel23e
  - number: '24.1'
    text: 'Belastbare som is:'
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel24
  - number: 24.1.a
    text: 'ten aanzien van binnenlandse belastingplichtigen: het belastbare inkomen verminderd met:'
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel24
  - number: 24.1.a.1°
    text: |-
      het zuivere bedrag van de voordelen, bedoeld in [artikel 11, eerste lid, onder 3°][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0029281#Artikel11
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0029281
        artikel: '11'
        hoofdstuk: II
  - number: 24.1.a.2°
    text: de belastingvrije som, en;
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel24
  - number: 24.1.a.3°
    text: |-
      de ouderentoeslag indien de belastingplichtige bij de aanvang van het kalenderjaar de leeftijd heeft bereikt op
      grond waarvan hij ingevolge de [Wet algemene ouderdomsverzekering BES][ref1] in aanmerking zou komen voor een
      uitkering;


      [ref1]: https://wetten.overheid.nl/BWBR0028459
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0028459
  - number: 24.1.b
    text: |-
      ten aanzien van buitenlandse belastingplichtigen: het belastbare inkomen voor zover dit is verkregen uit de
      opbrengsten, bedoeld in [artikel 17, eerste lid, aanhef en onderdelen a, b, c, d, g en h][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0029281#Artikel17
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0029281
        artikel: '17'
        hoofdstuk: III
  - number: '24.2'
    text: De belastingvrije som bedraagt USD 21.373.
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel24
  - number: '24.3'
    text: De ouderentoeslag bedraagt USD 1.616.
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel24
  - number: '24.4'
    text: |-
      De belastingplichtige die niet op de BES eilanden woont, komt in een kalenderjaar waarin hij tevens als op de BES
      eilanden wonende persoon belastingplichtig is, voor zijn periode van buitenlandse belastingplicht, in afwijking in
      zoverre van het eerste lid, onderdeel b, in aanmerking voor de belastingvrije som voor zover deze in de periode van
      binnenlandse belastingplicht onbenut is gebleven.
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel24
  - number: '24.5'
    text: |-
      In afwijking van het eerste lid, onderdeel b, komt een niet op de BES eilanden woonachtige belastingplichtige
      die een uit de BES eilanden afkomstige pensioenuitkering geniet die op grond van de voor de BES eilanden
      geldende fiscale regels wordt belast, in aanmerking voor de in het eerste lid, onderdeel a, onder 2°, genoemde
      belastingvrije som, met dien verstande dat de belastingvrije som die deze belastingplichtige in aanmerking mag
      nemen maximaal wordt gesteld op het bedrag van de pensioenuitkering dat volgens de fiscale regels van de BES
      eilanden mag worden belast.
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel24
  - number: 24a.1
    text: |-
      Het bedrag van de over de belastbare som, bedoeld in [artikel 24][ref1], verschuldigde belasting wordt bepaald aan
      de hand van de navolgende tabel (tarieftabel):








                    Bij een belastbare som van meer dan


                    doch niet meer dan


                    bedraagt de belasting het in kolom III vermelde bedrag, vermeerderd met het bedrag berekend door het
      in kolom IV vermelde percentage te nemen van het gedeelte van de belastbare som dat het in kolom I vermelde bedrag
      te boven gaat




                    I


                    II


                    III


                    IV






                    –


                    USD 51.250


                    –


                    30,4%




                    USD 51.250


                    –


                    USD 15.580


                    35,4%


      [ref1]: https://wetten.overheid.nl/BWBR0029281#Artikel24
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel24a
    references:
      - id: ref1
        bwb_id: BWBR0029281
        artikel: '24'
        hoofdstuk: V
  - number: 24a.2
    text: |-
      Voor een belastingplichtige die premieplichtig is in de zin van de [Wet algemene ouderdomsverzekering BES][ref1],
      de [Wet algemene weduwen- en wezenverzekering BES][ref2] of ingevolge de bij of krachtens de in
      [artikel 18.4.1 van de Invoeringswet openbare lichamen Bonaire, Sint Eustatius en Saba][ref3] bedoelde algemene
      maatregel van bestuur inzake de Zorgverzekering BES gestelde regels, wordt het op basis van het eerste lid
      berekende bedrag verminderd met het bedrag van de heffingskorting.


      [ref1]: https://wetten.overheid.nl/BWBR0028459
      [ref2]: https://wetten.overheid.nl/BWBR0028387
      [ref3]: https://wetten.overheid.nl/BWBR0028063#Artikel18
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel24a
    references:
      - id: ref1
        bwb_id: BWBR0028459
      - id: ref2
        bwb_id: BWBR0028387
      - id: ref3
        bwb_id: BWBR0028063
        artikel: '18'
  - number: 24a.3
    text: |-
      De heffingskorting bestaat uit de ouderdomsverzekeringskorting, de weduwen- en wezenverzekeringskorting en de
      zorgverzekeringskorting.
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel24a
  - number: 24a.4
    text: |-
      De ouderdomsverzekeringskorting geldt voor de belastingplichtige die premieplichtig is in de
      zin van de [Wet algemene ouderdomsverzekering BES][ref1] en bedraagt het door Onze Minister
      van Sociale Zaken en Werkgelegenheid, in overeenstemming met Onze Minister, op basis van
      [artikel 27 van de Wet algemene ouderdomsverzekering BES][ref2] bij ministeriële regeling vastgestelde percentage
      vermenigvuldigd met de premiegrondslag waarover de belastingplichtige op grond van die wet premie verschuldigd is.


      [ref1]: https://wetten.overheid.nl/BWBR0028459
      [ref2]: https://wetten.overheid.nl/BWBR0028459#Artikel27
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel24a
    references:
      - id: ref1
        bwb_id: BWBR0028459
      - id: ref2
        bwb_id: BWBR0028459
        artikel: '27'
  - number: 24a.5
    text: |-
      De weduwen- en wezenverzekeringskorting geldt voor de belastingplichtige die premieplichtig is
      in de zin van de [Wet algemene weduwen en wezenverzekering BES][ref1] en bedraagt het door Onze
      Minister van Sociale Zaken en Werkgelegenheid, in overeenstemming met Onze Minister, op basis van
      [artikel 30 van de Wet algemene weduwen- en wezenverzekering BES][ref2] bij ministeriële regeling vastgestelde
      percentage vermenigvuldigd met de premiegrondslag waarover de belastingplichtige op grond van die wet premie
      verschuldigd is.


      [ref1]: https://wetten.overheid.nl/BWBR0028387
      [ref2]: https://wetten.overheid.nl/BWBR0028387#Artikel30
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel24a
    references:
      - id: ref1
        bwb_id: BWBR0028387
      - id: ref2
        bwb_id: BWBR0028387
        artikel: '30'
  - number: 24a.6
    text: |-
      De zorgverzekeringskorting geldt voor de belastingplichtige die premieplichtig is ingevolge de bij of krachtens
      de in [artikel 18.4.1 van de Invoeringswet openbare lichamen Bonaire, Sint Eustatius en Saba][ref1] bedoelde
      algemene maatregel van bestuur inzake de Zorgverzekering BES gestelde regels en bedraagt het door Onze Minister
      van Volksgezondheid, Welzijn en Sport, in overeenstemming met Onze Minister, op basis van die algemene maatregel
      van bestuur bij ministeriële regeling vastgestelde percentage vermenigvuldigd met de premiegrondslag waarover de
      belastingplichtige op grond van die algemene maatregel van bestuur premie verschuldigd is.


      [ref1]: https://wetten.overheid.nl/BWBR0028063#Artikel18
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel24a
    references:
      - id: ref1
        bwb_id: BWBR0028063
        artikel: '18'
  - number: 24a.7
    text: |-
      Voor de toepassing van het vierde, vijfde en zesde lid wordt als premiegrondslag ten hoogste een bedrag van USD
      36.984 in aanmerking genomen.
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel24a
  - number: 24a.8
    text: |-
      Indien in het belastbare inkomen persoonlijke lasten met betrekking tot een eigen woning als bedoeld in
      [artikel 16, eerste lid, onderdeel h, onder 1°][ref1], zijn begrepen en de belastbare som:


      [ref1]: https://wetten.overheid.nl/BWBR0029281#Artikel16
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel24a
    references:
      - id: ref1
        bwb_id: BWBR0029281
        artikel: '16'
        hoofdstuk: II
  - number: 24a.8.a
    text: meer bedraagt dan het in de eerste kolom van de tabel in het eerste lid, vermelde bedrag, of
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel24a
  - number: 24a.8.b
    text: |-
      niet meer bedraagt dan het in de eerste kolom van de tabel in het eerste lid vermelde bedrag maar meer zou
      bedragen dan dat bedrag indien daarin de persoonlijke lasten met betrekking tot een eigen woning, bedoeld in
      [artikel 16, eerste lid, onderdeel h, onder 1°][ref1], niet zouden zijn begrepen;


      [ref1]: https://wetten.overheid.nl/BWBR0029281#Artikel16
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel24a
    references:
      - id: ref1
        bwb_id: BWBR0029281
        artikel: '16'
        hoofdstuk: II
  - number: 24a.9
    text: |-
      In gevallen als bedoeld in het achtste lid, onderdeel a, bedraagt de belasting op het belastbare inkomen het met
      toepassing van het eerste lid bepaalde bedrag vermeerderd met 5% van de persoonlijke lasten met betrekking tot een
      eigen woning, bedoeld in [artikel 16, eerste lid, onderdeel h, onder 1°][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0029281#Artikel16
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel24a
    references:
      - id: ref1
        bwb_id: BWBR0029281
        artikel: '16'
        hoofdstuk: II
  - number: 24a.10
    text: |-
      In gevallen als bedoeld in het achtste lid, onderdeel b, bedraagt de belasting op het belastbare inkomen het met
      toepassing van het eerste lid bepaalde bedrag vermeerderd met 5% van het bedrag waarmee de belastbare som het in de
      eerste kolom van de tabel in het eerste lid vermelde bedrag te boven zou gaan indien daarin de persoonlijke lasten
      met betrekking tot een eigen woning, bedoeld in [artikel 16, eerste lid, onderdeel h, onder 1°][ref1], niet zouden
      zijn begrepen.


      [ref1]: https://wetten.overheid.nl/BWBR0029281#Artikel16
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel24a
    references:
      - id: ref1
        bwb_id: BWBR0029281
        artikel: '16'
        hoofdstuk: II
  - number: 24b
    text: |-
      Het zuivere bedrag van de voordelen, bedoeld in [artikel 11, eerste lid, onder 3°][ref1], alsmede de opbrengst,
      bedoeld in [artikel 17, eerste lid, onderdelen e en f][ref2], wordt belast naar een tarief van 7,5%.


      [ref1]: https://wetten.overheid.nl/BWBR0029281#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0029281#Artikel17
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel24b
    references:
      - id: ref1
        bwb_id: BWBR0029281
        artikel: '11'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0029281
        artikel: '17'
        hoofdstuk: III
  - number: 24c
    text: |-
      Indien de belastingplichtige ook premieplichtig is voor de algemene ouderdomsverzekering BES of de
      algemene weduwen- en wezenverzekering BES of inkomensafhankelijke premie verschuldigd is ingevolge
      [artikel 11 van het Besluit zorgverzekering BES][ref1], geschiedt de heffing van de belasting en premie door
      middel van één belastingaanslag en voor zover de heffing plaatsvindt bij wege van conserverende aanslag,
      door middel van één conserverende belastingaanslag. Hierbij zijn de regels die gelden voor de heffing
      en de invordering van de inkomstenbelasting van overeenkomstige toepassing. In dat geval wordt, indien
      [artikel 8.22 van de Belastingwet BES][ref2] toepassing vindt, die bepaling eenmaal toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0029404#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0029244#Artikel8
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel24c
    references:
      - id: ref1
        bwb_id: BWBR0029404
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0029244
        artikel: '8'
  - number: '25.1'
    text: |-
      Bij het begin van het kalenderjaar vervangt Onze Minister de in de [artikelen 24][ref1] en [24A][ref2] vermelde
      bedragen door andere. Het in artikel 24, tweede lid, vermelde bedrag wordt gesteld op het bedrag, genoemd in
      [artikel 9, eerste lid, van de Wet minimumlonen BES][ref3], op 1 januari van het kalenderjaar, vermenigvuldigd
      met 2.080 en verminderd met USD 280. Het in artikel 24, derde lid, vermelde bedrag en de in [artikel 24A][ref4]
      vermelde bedragen worden berekend door de te vervangen bedragen te vermenigvuldigen met de tabelcorrectiefactor en
      vervolgens de nodige geachte afrondingen aan te brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0029281#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0029281#Artikel24a
      [ref3]: https://wetten.overheid.nl/BWBR0028170#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0029281#Artikel24a
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0029281
        artikel: '24'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0029281
        artikel: 24a
        hoofdstuk: V
      - id: ref3
        bwb_id: BWBR0028170
        artikel: '9'
      - id: ref4
        bwb_id: BWBR0029281
        artikel: 24a
        hoofdstuk: V
  - number: '25.2'
    text: |-
      De tabelcorrectiefactor is één gedeeld door prijsindexverhouding. De prijsindexverhouding is de verhouding van
      het gemiddelde van de prijsindexcijfers van de gezinsconsumptie, zoals berekend door het Centraal Bureau voor de
      Statistiek, betrekking hebbende op de achttiende tot en met de zevende aan het kalenderjaar voorafgaande maand en
      het gemiddelde van die prijsindexcijfers, betrekking hebbende op de dertigste tot en met de negentiende aan het
      kalenderjaar voorafgaande maand. Voor de toepassing van de tweede volzin wordt onder prijsindexcijfers verstaan
      het aan de hand van het aantal inwoners gewogen gemiddelde van de prijsindexcijfers voor Bonaire, Sint Eustatius
      en Saba. Voor de toepassing van de derde volzin wordt het aantal inwoners van Bonaire gesteld op 25.133, het aantal
      inwoners van Sint Eustatius op 3.204 en het aantal inwoners van Saba op 2.060.
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel25
  - number: '26'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel26
  - number: '27'
    text: Het belastingjaar is het kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel27
  - number: '28'
    text: De belasting wordt geheven bij wege van aanslag.
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel28
  - number: '29'
    text: '[vervallen]'
