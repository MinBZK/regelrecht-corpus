  - number: '9.1'
    text: |-
      De opbrengst in de vorige artikelen omschreven wordt ter berekening van het zuiver bedrag verminderd met de
      kosten tot verwerving, inning, en behoud der opbrengst en met de op de opbrengst rustende lasten, zoals: de
      bedrijfs- en beroepskosten, waaronder worden verstaan de kosten nodig voor de uitoefening van een bedrijf of
      beroep of rechtstreeks daartoe betrekking hebbende, met inbegrip van kosten van onderhoud, verschuldigde renten
      en belastingen, die op de opbrengst van het bedrijf of beroep drukken; de volgende kosten, voor zover zij niet
      reeds als bedrijfs- of beroepskosten in aanmerking komen: renten van schulden alsmede kosten van geldlening, kosten
      vallende op de verzilvering van coupons en kosten van beheer.
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel9
  - number: '9.2'
    text: |-
      Uitgaven tot het voeren van een zekere staat worden niet als bedrijfs- en beroepskosten doch als particuliere
      uitgaven aangemerkt, ook dan wanneer zij tevens worden gedaan in het belang van het bedrijf, dan wel ter
      bevordering van de beroepsuitoefening of van enig andere werkzaamheid van de belastingplichtige.
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel9
  - number: '9.3'
    text: |-
      Het bedrag van de op de gezamenlijke opbrengst van dienstbetrekking en andere opbrengst uit arbeid buiten bedrijf
      betrekking hebbende aftrekbare kosten wordt gesteld op USD 280. In plaats daarvan kan de belastingplichtige de
      werkelijke kosten in mindering brengen voor zover deze meer bedragen dan USD 560. De aftrek bedraagt in beide
      gevallen echter niet meer dan de opbrengst.
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel9
  - number: '9.4'
    text: |-
      Van de onzuivere opbrengst van een bedrijf of beroep wordt bovendien afgetrokken hetgeen wegens vermindering van
      de gebruikswaarde moet worden afgeschreven op de aanschaffingskosten van zaken, die voor de uitoefening van het
      bedrijf of beroep worden gebezigd, op hetgeen bij overname van een bedrijf of beroep voor goodwill werd betaald,
      zomede hetgeen wegens onverhaalbaarheid moet worden afgeschreven op schuldvorderingen, die tot het bedrijf of
      beroep betrekking hebben, een en ander volgens goed koopmansgebruik.
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel9
  - number: 9.5.1e
    text: |-
      In afwijking van het bepaalde in het vierde lid kan een belastingplichtige, die opbrengst uit onderneming geniet,
      een derde van de aanschaffingskosten of voortbrengingskosten van bedrijfsmiddelen, die voor de uitoefening van een
      onderneming worden gebezigd, willekeurig, mits vervroegd, afschrijven.
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel9
  - number: 9.5.2e
    text: |-
      Met betrekking tot gebouwen, is deze afschrijving reeds mogelijk, zodra ter zake van de verwerving of de
      verbetering verplichtingen zijn aangegaan of voortbrengingskosten zijn gemaakt, met dien verstande dat voor
      ingebruikneming ter zake van aangegane verplichtingen niet meer vervroegd kan worden afgeschreven dan het bedrag
      dat ter zake van die verplichtingen is betaald.
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel9
  - number: 9.5.3e
    text: |-
      Onze Minister kan in overeenstemming met de Minister van Economische Zaken, de hiervoren genoemde afschrijving in
      het algemeen of voor bepaalde groepen van bedrijfsmiddelen beperken of buiten toepassing stellen.
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel9
  - number: '9.6'
    text: |-
      Bovendien komt voor aftrek in aanmerking de afschrijving welke nodig mocht zijn wegens het aflopen van een de
      belastingplichtige toekomend recht dat aan een termijn is gebonden.
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel9
  - number: '9.7'
    text: |-
      Behoudens ten aanzien van de opbrengst van bedrijf of beroep worden de kosten tot verwerving, inning en behoud van
      de opbrengst in aanmerking genomen tot en voor zover in een jaar tegenover die kosten positieve opbrengsten staan.
      De kosten tot verwerving, inning en behoud van de opbrengst die op grond van het bepaalde in de vorige volzin
      buiten aanmerking zijn gebleven, kunnen slechts met de positieve opbrengsten van de vijf volgende kalenderjaren
      worden verrekend en wel in de volgorde waarin ze zijn ontstaan.
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel9
  - number: 9a.1
    text: |-
      In geval in een kalenderjaar een bedrag van meer dan USD 2.794 wordt geïnvesteerd in bedrijfsmiddelen, wordt acht
      percent van het investeringsbedrag ten laste gebracht zowel van de winst van dat jaar als van de winst van het
      daaropvolgende jaar. Onder investeren wordt verstaan het aangaan van verplichtingen ter zake van de aanschaffing
      of de verbetering van de bedrijfsmiddelen, die voor de uitoefening van een onderneming op de BES eilanden worden
      gebezigd, zomede het maken van voortbrengingskosten daarvoor. Indien niet alle verplichtingen ter zake op de
      belastingplichtige drukken, wordt slechts het bedrag dat wel op de belastingplichtige drukt in aanmerking genomen.
      Voor zover in een kalenderjaar in nieuwe gebouwen – de verbetering van bestaande gebouwen daaronder begrepen –
      wordt geïnvesteerd wordt het percentage genoemd in de eerste zin van dit lid verhoogd tot twaalf percent van het
      investeringsbedrag.
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel9a
  - number: 9a.2
    text: |-
      Ingeval in een kalenderjaar goederen, waarop het vorige lid toepassing heeft gevonden, worden vervreemd, wordt
      van de overdrachtsprijzen een gelijk percentage als ter zake van de investering in die goederen op de voet van het
      eerste lid ten laste van de winst over de aldaar genoemde jaren kon worden gebracht, ten bate van zowel de winst
      van dat jaar als van de winst van het daarop volgende boekjaar gebracht. Bijtelling heeft slechts plaats voor
      zover de vervreemding plaats vindt binnen zes jaar – voor zover betreft gebouwen binnen 15 jaar – na de aanvang van
      het jaar waarin de investering heeft plaatsgevonden. Bijtelling heeft plaats tot ten hoogste het bedrag waarvoor
      destijds aftrek is verleend.
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel9a
  - number: 9a.3
    text: 'Tot de bedrijfsmiddelen worden niet gerekend:'
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel9a
  - number: 9a.3.a
    text: gronden, daaronder begrepen de ondergrond van gebouwen;
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel9a
  - number: 9a.3.b
    text: |-
      woonhuizen daaronder begrepen tot bewoning dienende gedeelten van bedrijfspanden, tenzij verhuur van deze
      woonhuizen ligt in de lijn van de normale bedrijfsuitoefening;
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel9a
  - number: 9a.3.c
    text: personenauto’s, tenzij deze zijn bestemd voor bedrijfsmatig personenvervoer over de weg;
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel9a
  - number: 9a.3.d
    text: pleziervaartuigen;
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel9a
  - number: 9a.3.e
    text: effecten, vorderingen en goodwill;
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel9a
  - number: 9a.3.f
    text: flessen, kisten en andere verpakkingsmiddelen;
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel9a
  - number: 9a.3.g
    text: |-
      voorwerpen van geringe waarde, omschreven in [artikel 10, tweede lid onder b.][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0029281#Artikel10
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0029281
        artikel: '10'
        hoofdstuk: II
  - number: 9a.3.h
    text: door de belastingplichtige aan te wijzen andere bedrijfsmiddelen.
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel9a
  - number: 9a.4
    text: 'Buiten aanmerking blijven, tenzij Onze Minister voor bepaalde gevallen het tegendeel bepaalt:'
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel9a
  - number: 9a.4.a
    text: verplichtingen aangegaan tussen bloed- en aanverwanten in de rechte linie en in de tweede graad van de zijlinie;
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel9a
  - number: 9a.4.b
    text: |-
      verplichtingen aangegaan tussen gerechtigden tot een nalatenschap of huwelijksgemeenschap waartoe het
      bedrijfsmiddel behoort;
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel9a
  - number: 9a.4.c
    text: |-
      verplichtingen aangegaan tussen degene die voor meer dan een vierde gedeelte van het nominaal gestorte kapitaal
      middellijk of onmiddellijk aandeelhouder is in een vennootschap welker kapitaal geheel of ten dele in aandelen is
      verdeeld en deze vennootschap.
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel9a
  - number: 9a.5
    text: |-
      Het onttrekken van een zaak aan de onderneming wordt met vervreemding gelijkgesteld, met dien verstande dat alsdan
      de verkoopwaarde of, indien deze niet is te bepalen, de geldswaarde, als overdrachtsprijs in aanmerking wordt
      genomen.
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel9a
  - number: 9a.6
    text: |-
      Ingeval een investering ongedaan wordt gemaakt dan wel met betrekking tot een investering een vermindering,
      teruggaaf of vergoeding wordt genoten, geldt zulks als vervreemding van een zaak en het bedrag van die investering,
      vermindering, teruggaaf of vergoeding als overdrachtprijs. Ingeval een vervreemding ongedaan wordt gemaakt, dan wel
      met betrekking tot een vervreemding, een vermindering, teruggaaf of vergoeding wordt verleend, geldt zulks als een
      investering en het bedrag van die vervreemding, vermindering, teruggaaf of vergoeding als investeringsbedrag.
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel9a
  - number: 9a.7
    text: 'Onze Minister kan in overeenstemming met de Minister van Economische Zaken:'
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel9a
  - number: 9a.7.a
    text: de verminderingen in het algemeen of voor bepaalde groepen van bedrijfsmiddelen beperken;
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel9a
  - number: 9a.7.b
    text: de verminderingen in het algemeen of voor bepaalde groepen van bedrijfsmiddelen buiten toepassing stellen.
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel9a
  - number: 9b
    text: |-
      Het bepaalde in [artikel 9, vijfde lid][ref1], [artikel 9A, eerste lid][ref2] en [artikel 10 vierde lid][ref3]
      vindt slechts toepassing, indien door de belastingplichtige een regelmatige boekhouding wordt gevoerd, met
      geregelde jaarlijkse afsluitingen. Houdt de belastingplichtige op aldus boek te houden dan wordt de reserve volgens
      artikel 10 lid 4 opgenomen in de winst van het laatste kalenderjaar met regelmatige boekhouding.


      [ref1]: https://wetten.overheid.nl/BWBR0029281#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0029281#Artikel9a
      [ref3]: https://wetten.overheid.nl/BWBR0029281#Artikel10
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel9b
