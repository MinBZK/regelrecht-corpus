  - number: '18.2'
    text: |-
      De [artikelen 11][ref1], [15][ref2] en [16 eerste lid letter f][ref3] zijn op de in dit hoofdstuk bedoelde
      belastingplichtigen van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0029281#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0029281#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0029281#Artikel16
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel18
    references:
