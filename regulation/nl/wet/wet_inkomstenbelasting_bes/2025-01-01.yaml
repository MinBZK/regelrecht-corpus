  - number: '19'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel19
  - number: '20.1'
    text: |-
      Dit artikel is van toepassing op een belastingplichtige die het gehele kalenderjaar gehuwd is geweest zonder
      duurzaam gescheiden te hebben geleefd, mits zowel de belastingplichtige als zijn echtgenoot op de BES eilanden
      woonde. Indien de belastingplichtige en zijn echtgenoot duurzaam gescheiden gaan leven en binnen zes maanden nadien
      de samenleving hervatten, worden zij voor de toepassing van dit artikel geacht niet duurzaam gescheiden te hebben
      geleefd.
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel20
  - number: '20.2'
    text: |-
      De bestanddelen van het zuiver inkomen van een belastingplichtige, anders dan het persoonlijk inkomen en de
      persoonlijke verminderingen, worden aangemerkt als zuiver inkomen van zijn echtgenoot indien:
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel20
  - number: 20.2.a
    text: zijn persoonlijk inkomen lager is dan dat van zijn echtgenoot;
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel20
  - number: 20.2.b
    text: de belastingplichtige niet, maar zijn echtgenoot wel persoonlijk inkomen geniet;
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel20
  - number: 20.2.c
    text: |-
      beider persoonlijk inkomen gelijk is of beiden geen persoonlijk inkomen genieten, en belastingplichtige jonger is
      dan zijn echtgenoot.
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel20
  - number: '20.3'
    text: 'Het persoonlijk inkomen bestaat uit het gezamenlijk bedrag van:'
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel20
  - number: 20.3.a
    text: zuivere opbrengst van een voor eigen rekening gedreven onderneming;
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel20
  - number: 20.3.b
    text: zuivere opbrengst van arbeid;
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel20
  - number: 20.3.c
    text: 'zuivere opbrengst van rechten op periodieke uitkeringen:'
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel20
  - number: 20.3.c.1°
    text: |-
      ingevolge de [Wet algemene ouderdomsverzekering BES][ref1] en de
      [Wet algemene weduwen- en wezenverzekering BES][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0028459
      [ref2]: https://wetten.overheid.nl/BWBR0028387
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0028459
      - id: ref2
        bwb_id: BWBR0028387
  - number: 20.3.c.2°
    text: |-
      genoten ter zake van studie tenzij het een uitkering betreft als bedoeld in
      de [artikelen 7.51 tot en met 7.51f][ref1], [7.51h][ref2], [7.51j][ref3] en
      [7.51k, eerste en tweede lid, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref4] of een
      uitkering of verstrekking als bedoeld in de a[rtikelen 8.1.6a tot en met 8.1.6d][ref5], [8.1.6f][ref6] en
      [8.1.6i, eerste en tweede lid, van de Wet educatie en beroepsonderwijs BES][ref7];


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref5]: https://wetten.overheid.nl/BWBR0028395#Artikel8
      [ref6]: https://wetten.overheid.nl/BWBR0028395#Artikel8
      [ref7]: https://wetten.overheid.nl/BWBR0028395#Artikel8
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
      - id: ref3
