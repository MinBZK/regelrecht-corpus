      alsmede excursies, studiereizen en dergelijke; een en ander met inbegrip van de desbetreffende reizen en het
      desbetreffende verblijf;
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel9c
  - number: 9c.1.i
    text: giften en relatiegeschenken;
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel9c
