  - number: '73'
    text: |-
      Met betrekking tot op 31 december 2024 bestaande aanspraken op periodieke uitkeringen ter vervanging van gederfd of
      te derven loon als bedoeld in [artikel 11, tweede lid][ref1], zoals dat op 31 december 2024 luidde, blijft artikel
      11, tweede lid, zoals dat op 31 december 2024 luidde, alsmede de daarop gebaseerde bepalingen, van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0029281#Artikel11
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel73
