      muziekinstrumenten, geluidsapparatuur, gereedschap, tekstverwerkers, schrijf- en rekenmachines, computers,
      faxmachines, apparatuur voor telefoongesprekken, andere dergelijke apparatuur, alsmede beeldapparatuur: voor zover
