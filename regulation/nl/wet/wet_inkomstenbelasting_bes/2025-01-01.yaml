---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht-mvp/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_inkomstenbelasting_bes
regulatory_layer: WET
publication_date: '2025-02-19'
valid_from: '2025-01-01'
bwb_id: BWBR0029281
url: https://wetten.overheid.nl/BWBR0029281/2025-01-01
articles:
  - number: A
    text: |-
      De [hoofdstukken I][ref1] en [VIII van de Belastingwet BES][ref2] zijn van overeenkomstige toepassing op deze wet
      en de daarop berustende bepalingen.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#HoofdstukI
      [ref2]: https://wetten.overheid.nl/BWBR0029244#HoofdstukVIII
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#ArtikelA
    references:
      - id: ref1
        bwb_id: BWBR0029244
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0029244
        hoofdstuk: VIII
  - number: '1.1'
    text: |-
      Onder de naam van «inkomstenbelasting» wordt een belasting geheven, waaraan onderworpen zijn, zij, die op de BES
      eilanden wonen (binnenlandse belastingplichtigen).
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel1
  - number: '1.2'
    text: |-
      In afwijking in zoverre van [artikel 1.5 van de Belastingwet BES][ref1] geldt dat:


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel1
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '1'
  - number: 1.2.a
    text: |-
      zij, die de BES eilanden tijdelijk verlaten, geacht worden nog op de BES eilanden te wonen, indien hun afwezigheid
      korter dan één jaar duurt;
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel1
  - number: 1.2.b
    text: |-
      zij, die de BES eilanden metterwoon verlaten, maar binnen één jaar zich aldaar weder metterwoon vestigen, geacht
      worden de BES eilanden tijdelijk te hebben verlaten, tenzij blijkt, dat zij tijdens hun afwezigheid op het
      grondgebied van Aruba, Curaçao, Sint Maarten, Nederland of van een vreemde staat hebben gewoond;
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel1
  - number: 1.2.c
    text: |-
      zij, die tijdelijk op de BES eilanden verblijven en hetzij in Aruba, Curaçao, Sint Maarten, Nederland wonen, hetzij
      aldaar geacht worden te wonen volgens de daar geldende wetgeving inzake de belasting naar het inkomen, als niet op
      de BES eilanden wonend worden beschouwd indien hun verblijf niet langer dan een jaar duurt.
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel1
  - number: '1.3'
    text: |-
      Aan de inkomstenbelasting zijn mede onderworpen de niet op de BES eilanden wonende personen, die binnenlandse
      bronnen van inkomen hebben als bedoeld in [artikel 17][ref1] (buitenlandse belastingplichtigen).


      [ref1]: https://wetten.overheid.nl/BWBR0029281#Artikel17
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0029281
        artikel: '17'
        hoofdstuk: III
  - number: '2'
    text: |-
      De volgende verrichtingen van niet op de BES eilanden wonende personen worden, ook voor zover zij plaatsvinden op
      de BES eilanden, niet aangemerkt als uitoefening van een bedrijf of beroep op de BES eilanden:
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel2
  - number: 2.a
    text: |-
      het vervoer te water of door de lucht van personen en goederen tussen Aruba, Curaçao, Sint Maarten, Nederland en
      het buitenland enerzijds en plaatsen op de BES eilanden anderzijds;
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel2
  - number: 2.b
    text: |-
      de werkzaamheden van personeel op vervoermiddelen, die het verkeer met Aruba, Curaçao, Sint Maarten, Nederland en
      het buitenland onderhouden.
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel2
  - number: '3.1'
    text: De op de BES eilanden wonende personen zijn belastingplichtig naar hun belastbaar inkomen.
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel3
  - number: '3.2'
    text: |-
      Belastbaar inkomen is het in een belastingjaar genoten zuiver inkomen verminderd met de op grond van
      [artikel 15][ref1] te verrekenen verliezen.


      [ref1]: https://wetten.overheid.nl/BWBR0029281#Artikel15
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0029281
        artikel: '15'
        hoofdstuk: II
  - number: '3.3'
    text: Zuiver inkomen is het inkomen verminderd met de persoonlijke lasten en de buitengewone lasten.
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel3
  - number: '3.4'
    text: |-
      Onder inkomen wordt verstaan het gezamenlijke bedrag van hetgeen de belastingplichtige zuiver geniet als opbrengst
      van:
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel3
  - number: 3.4.a
    text: roerend kapitaal;
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel3
  - number: 3.4.b
    text: onderneming en arbeid;
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel3
  - number: 3.4.c
    text: rechten op periodieke uitkeringen.
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel3
  - number: '4'
    text: |-
      Voor de toepassing van deze wet wordt onder eigen woning verstaan een woning die de belastingplichtige anders dan
      tijdelijk als hoofdverblijf ter beschikking staat en:
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel4
  - number: 4.a
    text: waarvan de belastingplichtige eigenaar is;
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel4
  - number: 4.b
    text: waarvan de belastingplichtige de grond in erfpacht of huur heeft;
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel4
  - number: 4.c
    text: die de belastingplichtige in vruchtgebruik heeft, dat verkregen is krachtens het erfrecht.
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel4
  - number: '5.1'
    text: |-
      Als opbrengst van roerend kapitaal worden beschouwd de vruchten van kapitaal, dat niet in onroerende zaken of de
      rechten waaraan deze zijn onderworpen of in een eigen bedrijf of beroep is belegd, zoals:
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel5
  - number: 5.1.a
    text: rente van inschrijvingen op de grootboeken der Nederlandse of andere schuld;
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel5
  - number: 5.1.b
    text: |-
      dividenden en rente van aandeelbewijzen, daaronder begrepen hetgeen wordt uitgedeeld door een stichting of
      doelvermogen;
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel5
  - number: 5.1.c
    text: obligatiën of andere effecten;
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel5
  - number: 5.1.d
    text: uitkeringen op geldschieting en commandite;
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel5
  - number: 5.1.e
    text: |-
      rente van andere schuldvorderingen, uit welken hoofde ook, onverschillig of van de schuld een bewijs is afgegeven
      en of de betaling door hypotheek of op andere wijze is verzekerd;
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel5
  - number: 5.1.f
    text: rente, begrepen in de aflossing van schuldvorderingen;
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel5
  - number: 5.1.g
    text: altijddurende rente;
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel5
  - number: 5.1.h
    text: |-
      liquidatieuitkeringen van vennootschappen, welker kapitaal geheel of ten dele in aandelen is verdeeld, voor zover
      zij het gestorte kapitaal te boven gaan.
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel5
  - number: '5.2'
    text: |-
      Aandeelbewijzen en obligatiën, die aan aandeelhouders anders dan tegen storting van de volle nominale waarde worden
      uitgereikt, worden als dividenden beschouwd tot het bedrag, ten aanzien waarvan niet blijkt, dat storting heeft
      plaats gevonden of zal plaats vinden. Bijschrijving op aandeelbewijzen wordt met uitreiking van zodanige bewijzen
      gelijkgesteld.
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel5
  - number: '5.3'
    text: |-
      Gehele of gedeeltelijke teruggave van hetgeen op aandelen is gestort wordt als dividenduitkering aangemerkt, indien
      en voor zover deze teruggave kan geschieden uit de zuivere winst, tenzij tevoren het maatschappelijk kapitaal van
      het lichaam dat de teruggave doet, door wijziging in de akte van oprichting, dienovereenkomstig is verminderd.
      [vervallen]
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel5
  - number: '6.1'
    text: |-
      De opbrengst van onderneming en arbeid omvat de niet onder [artikel 5][ref1] vallende voordelen, die als winst,
      honorarium, traktement, salaris, loon, vrije woning, vrije kost en inwoning, aandeel in winst of overwinst,
      tantième, gratificatie, vacatie- of presentiegeld of onder welke naam of vorm ook worden verkregen uit bedrijf of
      beroep (ambt, waardigheid, bediening en bestaande of vroegere dienstbetrekking door belastingplichtige zelf of door
      een ander vervuld daaronder begrepen) en uit handelingen, werkzaamheden en diensten van elke aard.


      [ref1]: https://wetten.overheid.nl/BWBR0029281#Artikel5
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0029281
        artikel: '5'
        hoofdstuk: II
  - number: '6.2'
    text: 'Onder die voordelen worden mede begrepen:'
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel6
  - number: 6.2.a
    text: |-
      het eigen gebruik van in het bedrijf voortgebrachte of verkregen vruchten in de ruimste zin of van waren die in het
      bedrijf worden vervaardigd, bewerkt of ten verkoop ingeslagen;
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel6
  - number: 6.2.b
    text: |-
      voordelen die verkregen worden uit vervreemding van in eigen bedrijf of beroep gebezigde goederen, die niet voor
      vervreemding bestemd waren, en in het algemeen elk met zodanige zaken verkregen voordeel;
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel6
  - number: 6.2.c
    text: |-
      verschillen tussen de verkoopwaarde of, indien deze niet is te bepalen, de geldswaarde en de fiscale boekwaarde
      van uit een bedrijfs- of beroepsvermogen naar het privé-vermogen van de belastingplichtige overgaande vermogens-
      bestanddelen;
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel6
  - number: 6.2.d
    text: voordelen, behaald met of bij het overdragen of liquideren van een bedrijf of beroep, of een gedeelte daarvan;
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel6
  - number: 6.2.e
    text: |-
      verschillen tussen de verkoopwaarde of, indien deze niet is te bepalen, de geldswaarde en de fiscale boekwaarde van
      tot het bedrijfs- of beroepsvermogen behorende goederen welke blijken bij overlijden van een belastingplichtige,
      met dien verstande dat deze geacht worden te behoren tot het inkomen van het laatste in [artikel 12][ref1] bedoelde
      jaar of tijdvak;


      [ref1]: https://wetten.overheid.nl/BWBR0029281#Artikel12
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0029281
        artikel: '12'
        hoofdstuk: II
  - number: 6.2.f
    text: |-
      de uitkeringen ontvangen bij uittreding uit een pensioenfonds of bij afkoop of beëindiging van pensioenaanspraken,
      voor zover de aanspraken worden ontleend aan onder het [zesde lid van artikel 9][ref1] of onder het
      [eerste lid van artikel 16, letter e][ref2], vallende bijdragen of premiën.


      [ref1]: https://wetten.overheid.nl/BWBR0029281#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0029281#Artikel16
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0029281
        artikel: '9'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0029281
        artikel: '16'
        hoofdstuk: II
  - number: '6.3'
    text: |-
      De in het vorige lid onder b, c, d en e bedoelde voordelen worden gesteld op het verschil tussen de verkoopwaarde
      of, indien deze niet is te bepalen, de geldswaarde van de overgaande bestanddelen en de laatste fiscale boekwaarde
      daarvan.
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel6
  - number: '6.4'
    text: 'In deze wet en de daarop berustende bepalingen:'
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel6
  - number: 6.4.a
    text: |-
      wordt onder loon verstaan: loon overeenkomstig de [Wet loonbelasting BES][ref1] met dien verstande dat fooien en
      dergelijke prestaties van derden als loon in aanmerking worden genomen voor het werkelijk genoten bedrag;


      [ref1]: https://wetten.overheid.nl/BWBR0029283
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0029283
  - number: 6.4.b
    text: |-
      wordt onder dienstbetrekking verstaan: dienstbetrekking overeenkomstig de [Wet loonbelasting BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0029283
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0029283
  - number: '6.5'
    text: |-
      Tot het loon behoren niet voordelen waarover de belasting op grond van
      [artikel 21 van de Wet loonbelasting BES][ref1] is verschuldigd door de inhoudingsplichtige, evenmin als een
      hierdoor voor de belastingplichtige ontstaan voordeel.


      [ref1]: https://wetten.overheid.nl/BWBR0029283#Artikel21
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0029283
        artikel: '21'
  - number: '6.6'
    text: |-
      Bij het bepalen van de winst uit onderneming worden de aan het houden van een personenauto of bestelauto
      verbonden kosten geacht tot een bedrag van ten minste 15% van de nieuwwaarde, met inbegrip van de algemene
      bestedingsbelasting en de invoerrechten, van die auto niet te zijn gemaakt ten behoeve van de onderneming, tenzij
      de ondernemer aantoont dat die auto niet voor privé doeleinden, waaronder woon-werkverkeer, wordt gebruikt.
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel6
  - number: '6.7'
    text: |-
      Ingeval aan een belastingplichtige in verband met het buiten dienstbetrekking verrichten van arbeid een
      personenauto of bestelauto ter beschikking is gesteld, wordt tot de inkomsten uit arbeid gerekend ten minste het
      bedrag waarmee 15% van de nieuwwaarde, met inbegrip van de algemene bestedingsbelasting en de invoerrechten, van
      die auto de vergoeding welke de belastingplichtige ter zake van het gebruik, anders dan ten behoeve van het buiten
      dienstbetrekking verrichten van arbeid, verschuldigd is, te boven gaat, tenzij de belastingplichtige aantoont dat
      die auto niet voor privé doeleinden, waaronder woon-werkverkeer, wordt gebruikt.
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel6
  - number: '6.8'
    text: |-
      Voor de toepassing van het vijfde en zesde lid en de daarop berustende bepalingen wordt een bestelauto die door
      aard of inrichting uitsluitend of nagenoeg uitsluitend geschikt blijkt te zijn voor vervoer van goederen niet als
      bestelauto aangemerkt.
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel6
  - number: '6.9'
    text: |-
      Voor de toepassing van dit artikel wordt met betrekking tot de personenauto, onderscheidenlijk de bestelauto,
      die voorafgaand aan de inwerkingtreding van deze wet in het kentekenregister is geregistreerd onder algemene
      bestedingsbelasting mede verstaan: omzetbelasting en invoerheffingen.
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel6
  - number: '7.1'
    text: |-
      De opbrengst van rechten op periodieke uitkeringen omvat onderstanden, lijfrenten, alsmede de verschuldigde
      verstrekkingen van levensonderhoud, huisvesting of andere zaken, in het algemeen, alle verschuldigde uitkeringen en
      verstrekkingen, niet aan een ambt of dienstbetrekking verbonden, die bij overlijden van de gerechtigde of van een
      derde eindigen.
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel7
  - number: '7.2'
    text: |-
      Periodieke uitkeringen en verstrekkingen die de tegenwaarde van een prestatie vormen, worden slechts belast
      voor zover zij, tezamen met op grond van het betreffende recht van de verzekeraar reeds ontvangen uitkeringen en
      verstrekkingen, de waarde van de prestatie te boven gaan. Tot de waarde van de prestatie worden niet gerekend de
      bedragen welke niet tot het inkomen zijn gerekend dan wel op het inkomen in mindering konden worden gebracht.
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel7
  - number: '8'
    text: 'Als inkomen of deel van het inkomen wordt niet beschouwd:'
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel8
  - number: 8.a
    text: |-
      periodieke uitkeringen en verstrekkingen als bedoeld in [artikel 7][ref1], gedaan aan bloed- en aanverwanten in de
      rechte linie of in de tweede graad van de zijlinie, tenzij zij de tegenwaarde van een prestatie vormen;


      [ref1]: https://wetten.overheid.nl/BWBR0029281#Artikel7
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0029281
        artikel: '7'
        hoofdstuk: II
  - number: 8.b
    text: |-
      het aandeel in de winst van coöperatieve verenigingen, dat door de leden naar de maatstaf van de door hen bestede
      som wordt genoten, mits het doel der vereniging niet met het bedrijf of beroep harer leden in verband staat;
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel8
  - number: 8.c
    text: winst ontstaan door speculatie in fondsen en goederen, anders dan in de uitoefening van een bedrijf;
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel8
  - number: 8.d
    text: winsten ontstaan door vervreemding van goederen anders dan in de uitoefening van een bedrijf of beroep;
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel8
  - number: 8.e
    text: |-
      hetgeen verkregen wordt uit erfenis of legaat, schenkingen en uitkeringen terzake van loterijen, voor zover niet
      vallende onder [artikel 7][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0029281#Artikel7
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0029281
        artikel: '7'
        hoofdstuk: II
  - number: 8.f
    text: |-
      hetgeen bij inbreng van de activa en passiva van een bedrijf in een naamloze vennootschap, firma, commanditaire
      vennootschap of maatschap voor de waarde waarvoor deze activa en passiva zijn opgenomen in de laatste fiscale
      winstbepalende balans van de inbrenger, de geldswaarde der verkregen aandelen of deelgerechtigdheid méér
      bedraagt dan het kapitaalsaldo volgens evengenoemde balans van de inbrenger, mits de naamloze vennootschap,
      firma, commanditaire vennootschap of maatschap zich verplicht de overgenomen activa en passiva met inbegrip
      van de goodwill der onderneming in haar openingsbalans te boek te stellen voor dezelfde waarden als waarvoor
      deze zijn opgenomen in de laatste fiscale winstbepalende balans van de inbrenger en de naamloze vennootschap,
      firma, commanditaire vennootschap of maatschap zich tevens tegenover de Inspecteur verplicht van het stelsel van
      waarderen, dat door de inbrenger werd toegepast, alleen af te wijken in de gevallen waarin goed koopmansgebruik ook
      aan de inbrenger zou toestaan van stelsel te veranderen;
    url: https://wetten.overheid.nl/BWBR0029281/2025-01-01#Artikel8
  - number: 8.g
    text: |-
      het voordeel bedoeld in [artikel 6 tweede lid onder e][ref1], mits de nieuwe verkrijger zich verplicht de verkregen
      activa en passiva met inbegrip van de goodwill in de openingsbalans te boek te stellen voor dezelfde waarden als
      waarvoor deze zijn opgenomen in de laatste fiscale winstbepalende balans van de overledene en de nieuwe verkrijger
      zich tevens tegenover de Inspecteur verplicht van het stelsel van waarderen, dat door de overledene werd toegepast,
      alleen af te wijken in de gevallen waarin goed koopmansgebruik ook aan de overledene zulks zou toestaan;


      [ref1]: https://wetten.overheid.nl/BWBR0029281#Artikel6
