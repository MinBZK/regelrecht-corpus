---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_tijdelijk_huisverbod
regulatory_layer: WET
publication_date: '2020-02-24'
valid_from: '2020-07-01'
bwb_id: BWBR0024649
url: https://wetten.overheid.nl/BWBR0024649/2020-07-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is om een maatregel in te voeren waarmee een persoon die
    een ernstig en onmiddellijk gevaar oplevert voor de veiligheid van één of meer personen met wie deze een huishouden
    deelt tijdelijk een huisverbod kan worden opgelegd teneinde de veiligheid van deze personen te waarborgen en een
    periode te creëren waarin maatregelen genomen kunnen worden om de dreiging van huiselijk geweld te doen wegnemen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0024649/2020-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0024649/2020-07-01#Artikel1
  - number: 1.a
    text: |-
      *ambtenaar van politie:* de ambtenaar van politie, bedoeld in [artikel 2, onder a, van de Politiewet 2012][ref1],
      en de ambtenaar van politie, bedoeld in artikel 2, onder c, van die wet, voor zover hij is belast met de uitvoering
      van de politietaak;


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel2
    url: https://wetten.overheid.nl/BWBR0024649/2020-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '2'
  - number: 1.b
    text: |-
      *huisverbod:* beschikking houdende een last tot het onmiddellijk verlaten van een bepaalde woning en een verbod tot
      het betreden van, zich ophouden bij of aanwezig zijn in die woning en een verbod om contact op te nemen met degenen
      die met de persoon tot wie de beschikking is gericht in dezelfde woning wonen of daarin anders dan incidenteel
      verblijven;
    url: https://wetten.overheid.nl/BWBR0024649/2020-07-01#Artikel1
  - number: 1.c
    text: '*uithuisgeplaatste:* degene aan wie een huisverbod is opgelegd.'
    url: https://wetten.overheid.nl/BWBR0024649/2020-07-01#Artikel1
  - number: '2.1'
    text: |-
      De burgemeester kan een huisverbod opleggen aan een persoon indien uit feiten of omstandigheden blijkt dat diens
      aanwezigheid in de woning ernstig en onmiddellijk gevaar oplevert voor de veiligheid van één of meer personen
      die met hem in de woning wonen of daarin anders dan incidenteel verblijven of indien op grond van feiten of
      omstandigheden een ernstig vermoeden van dit gevaar bestaat. Het verbod geldt voor een periode van tien dagen,
      behoudens verlenging overeenkomstig [artikel 9][ref1]. Bij of krachtens algemene maatregel van bestuur worden
      nadere regels gesteld over de aard van de feiten en omstandigheden die aanleiding kunnen geven om een huisverbod op
      te leggen.


      [ref1]: https://wetten.overheid.nl/BWBR0024649#Artikel9
    url: https://wetten.overheid.nl/BWBR0024649/2020-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0024649
        artikel: '9'
  - number: '2.2'
    text: Een huisverbod kan slechts worden opgelegd aan een meerderjarig persoon.
    url: https://wetten.overheid.nl/BWBR0024649/2020-07-01#Artikel2
  - number: '2.3'
    text: |-
      Indien de burgemeester voornemens is het huisverbod op te leggen wegens kindermishandeling of
      een ernstig vermoeden daarvan, neemt hij contact op met de Veilig Thuis-organisatie, bedoeld in
      [artikel 4.1.1 van de Wet maatschappelijke ondersteuning 2015][ref1] teneinde te overleggen over het voornemen om
      een huisverbod op te leggen.


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel4
    url: https://wetten.overheid.nl/BWBR0024649/2020-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '4'
  - number: '2.4'
    text: 'Het huisverbod bevat in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0024649/2020-07-01#Artikel2
  - number: 2.4.a
    text: een omschrijving van de plaats en de duur waarvoor het geldt;
    url: https://wetten.overheid.nl/BWBR0024649/2020-07-01#Artikel2
  - number: 2.4.b
    text: de feiten en omstandigheden die aanleiding hebben gegeven tot het opleggen van het huisverbod, en
    url: https://wetten.overheid.nl/BWBR0024649/2020-07-01#Artikel2
  - number: 2.4.c
    text: de namen van de personen ten aanzien van wie het verbod om contact op te nemen geldt.
    url: https://wetten.overheid.nl/BWBR0024649/2020-07-01#Artikel2
  - number: '2.5'
    text: Bij ministeriële regeling kunnen nadere regels worden gegeven met betrekking tot het huisverbod.
    url: https://wetten.overheid.nl/BWBR0024649/2020-07-01#Artikel2
  - number: '2.6'
    text: |-
      De uithuisgeplaatste geeft aan waar of op welke wijze hij bereikbaar is. Indien de uithuisgeplaatste dit niet
      terstond kan doorgeven, geeft hij dit binnen 24 uur nadat het huisverbod is opgelegd door aan de burgemeester.
    url: https://wetten.overheid.nl/BWBR0024649/2020-07-01#Artikel2
  - number: '2.7'
    text: |-
      Indien de situatie dermate spoedeisend is dat het huisverbod niet tevoren op schrift kan worden gesteld, kan
      het huisverbod mondeling worden aangezegd. De burgemeester draagt alsnog zorg voor spoedige opschriftstelling en
      bekendmaking. Indien de verblijfplaats van de uithuisgeplaatste niet bekend is, kan bekendmaking plaatsvinden door
      nederlegging van het huisverbod bij de gemeentesecretarie.
    url: https://wetten.overheid.nl/BWBR0024649/2020-07-01#Artikel2
  - number: '2.8'
    text: |-
      De burgemeester deelt onverwijld de inhoud van het huisverbod en de gevolgen van niet-naleving daarvan
      voor de uithuisgeplaatste mede aan degene met wie de uithuisgeplaatste een huishouden deelt. De
      burgemeester deelt de inhoud van het huisverbod ook mede aan de Veilig Thuis-organisatie, bedoeld in
      [artikel 4.1.1 van de Wet maatschappelijke ondersteuning 2015][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel4
    url: https://wetten.overheid.nl/BWBR0024649/2020-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '4'
  - number: '2.9'
    text: |-
      De burgemeester kan het huisverbod in ieder geval intrekken indien de uithuisgeplaatste een aanbod tot
      hulpverlening heeft aanvaard en dit door de instantie voor advies of hulpverlening, aangewezen ingevolge het
      achtste lid, is bevestigd, en deze aanvaarding tevens inhoudt dat de uithuisgeplaatste hulpverlening aan één of
      meer personen die met de uithuisgeplaatste in de woning wonen of daarin anders dan incidenteel verblijven niet zal
      belemmeren en zal meewerken indien dit van hem wordt gevraagd door de instantie voor advies of hulpverlening.
    url: https://wetten.overheid.nl/BWBR0024649/2020-07-01#Artikel2
  - number: '3.1'
    text: |-
      De burgemeester kan van de bevoegdheden en taken, bedoeld in
      [artikel 2, eerste, derde, zevende en achtste lid][ref1], en [artikel 5, eerste lid][ref2],
      mandaat onderscheidenlijk machtiging verlenen aan de hulpofficier van justitie.
      [Artikel 10:9, eerste lid, van de Algemene wet bestuursrecht][ref3] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0024649#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0024649#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel10
    url: https://wetten.overheid.nl/BWBR0024649/2020-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0024649
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0024649
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '10'
  - number: '3.2'
    text: De hulpofficier van justitie doet onverwijld mededeling van een door hem opgelegd huisverbod aan de burgemeester.
    url: https://wetten.overheid.nl/BWBR0024649/2020-07-01#Artikel3
  - number: '4.1'
    text: |-
      Indien het gevaar, bedoeld in [artikel 2, eerste lid][ref1], zich voordoet, is de burgemeester of een ambtenaar van
      politie met het oog op het opleggen van het huisverbod, bevoegd de woning zonder toestemming van de bewoner binnen
      te treden, voor zover dat redelijkerwijs voor de vervulling van diens taak nodig is.


      [ref1]: https://wetten.overheid.nl/BWBR0024649#Artikel2
    url: https://wetten.overheid.nl/BWBR0024649/2020-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0024649
        artikel: '2'
  - number: '4.2'
    text: |-
      De ambtenaar van politie vordert van de uithuisgeplaatste de huissleutel of huissleutels en is bevoegd deze zo
      nodig na de uithuisgeplaatste daartoe aan de kleding onderzocht te hebben, aan de uithuisgeplaatste te ontnemen
      tegen afgifte van een bewijs van ontvangst.
    url: https://wetten.overheid.nl/BWBR0024649/2020-07-01#Artikel4
  - number: '4.3'
    text: |-
      Voor de controle op de naleving van het huisverbod zijn ambtenaren van politie bevoegd elke plaats waar de
      uithuisgeplaatste zich op grond van het huisverbod niet mag bevinden, te betreden, met uitzondering van een woning
      zonder toestemming van de bewoner.
    url: https://wetten.overheid.nl/BWBR0024649/2020-07-01#Artikel4
  - number: '5.1'
    text: |-
      Indien de uithuisgeplaatste geen raadsman heeft, en desgevraagd rechtsbijstand wenst, stelt de burgemeester het
      bestuur van de raad voor rechtsbijstand daarvan in kennis, die voor de uithuisgeplaatste een raadsman aanwijst.
    url: https://wetten.overheid.nl/BWBR0024649/2020-07-01#Artikel5
  - number: '5.2'
    text: |-
      De [artikelen 28, eerste lid][ref1], [37][ref2], [38][ref3], [43][ref4], [44][ref5] en
      [51 van het Wetboek van Strafvordering][ref6] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel37
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel38
      [ref4]: https://wetten.overheid.nl/BWBR0001903#Artikel43
      [ref5]: https://wetten.overheid.nl/BWBR0001903#Artikel44
      [ref6]: https://wetten.overheid.nl/BWBR0001903#Artikel51
    url: https://wetten.overheid.nl/BWBR0024649/2020-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '37'
      - id: ref3
        bwb_id: BWBR0001903
        artikel: '38'
      - id: ref4
        bwb_id: BWBR0001903
        artikel: '43'
      - id: ref5
        bwb_id: BWBR0001903
        artikel: '44'
      - id: ref6
        bwb_id: BWBR0001903
        artikel: '51'
  - number: '6.1'
    text: |-
      Indien tegen het huisverbod een verzoek om voorlopige voorziening als bedoeld in
      [artikel 8:81 van de Algemene wet bestuursrecht][ref1], wordt gedaan:


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0024649/2020-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 6.1.a
    text: |-
      wordt, in afwijking van [artikel 8:83, eerste lid, van die wet][ref1], de uithuisgeplaatste binnen drie dagen door
      de voorzieningenrechter gehoord;


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0024649/2020-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 6.1.b
    text: |-
      doet de voorzieningenrechter in afwijking van [artikel 8:84, eerste lid, van die wet][ref1] onmiddellijk
      na het horen van partijen uitspraak tenzij er sprake is van bijzondere omstandigheden, in welk geval de
      voorzieningenrechter binnen 24 uur na de behandeling van de zaak uitspraak doet.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0024649/2020-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '6.2'
    text: |-
      De rechter betrekt bij de beoordeling van het huisverbod tevens de feiten en omstandigheden die zich hebben
      voorgedaan na het opleggen van het huisverbod.
    url: https://wetten.overheid.nl/BWBR0024649/2020-07-01#Artikel6
  - number: '6.3'
    text: |-
      In afwijking van de [artikelen 8:41, eerste lid][ref1], en
      [8:82, eerste lid, van de Algemene wet bestuursrecht][ref2] wordt door de griffier geen griffierecht geheven.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0024649/2020-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '7'
    text: |-
      De rechter stelt minderjarigen die tot het huishouden van de uithuisgeplaatste behoren en die de leeftijd van
      twaalf jaren hebben bereikt, in de gelegenheid hem hun mening kenbaar te maken, tenzij de spoedige behandeling van
      de zaak zich hiertegen verzet. Hij kan minderjarigen die de leeftijd van twaalf jaren nog niet hebben bereikt, in
      de gelegenheid stellen hem hun mening kenbaar te maken op een door hem te bepalen wijze.
    url: https://wetten.overheid.nl/BWBR0024649/2020-07-01#Artikel7
  - number: '8.1'
    text: |-
      De griffier zendt een afschrift van de uitspraak of van het proces-verbaal van de mondelinge uitspraak van de
      voorzieningenrechter onverwijld, en een afschrift van de uitspraak of van het proces-verbaal van de mondelinge
      uitspraak van de rechtbank binnen twee weken na dagtekening van de uitspraak kosteloos aan:
    url: https://wetten.overheid.nl/BWBR0024649/2020-07-01#Artikel8
  - number: 8.1.a
    text: |-
      de echtgenoot, geregistreerde partner, andere levensgezel of andere meerderjarige persoon met wie de
      uithuisgeplaatste het huishouden deelt;
    url: https://wetten.overheid.nl/BWBR0024649/2020-07-01#Artikel8
  - number: 8.1.b
    text: de politie van de gemeente waar het huisverbod is opgelegd;
    url: https://wetten.overheid.nl/BWBR0024649/2020-07-01#Artikel8
  - number: 8.1.c
    text: |-
      ingeval er minderjarigen betrokken zijn: de Veilig Thuis-organisatie, bedoeld in
      [artikel 4.1.1 van de Wet maatschappelijke ondersteuning 2015][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel4
    url: https://wetten.overheid.nl/BWBR0024649/2020-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '4'
  - number: '8.2'
    text: |-
      De griffier stelt de uithuisgeplaatste, de raadsman van de uithuisgeplaatste en de burgemeester onverwijld
      mondeling op de hoogte van de uitspraak. De burgemeester stelt de personen, bedoeld in het eerste lid, onder a,
      voor zover zij niet aanwezig waren ter zitting waarop de uitspraak werd gedaan, en de politie onverwijld mondeling
      op de hoogte van de uitspraak.
    url: https://wetten.overheid.nl/BWBR0024649/2020-07-01#Artikel8
  - number: '9.1'
    text: |-
      De burgemeester kan een huisverbod verlengen tot ten hoogste vier weken nadat het is opgelegd indien de dreiging
      van het gevaar, of het ernstige vermoeden daarvan, zich voortzet. De [artikelen 2, vierde lid][ref1], en
      [6 tot en met 8][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0024649#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0024649#Artikel6
    url: https://wetten.overheid.nl/BWBR0024649/2020-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0024649
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0024649
        artikel: '6'
  - number: '9.2'
    text: |-
      Het beroep of hoger beroep tegen het huisverbod heeft mede betrekking op een beschikking tot verlenging van het
      huisverbod als bedoeld in het eerste lid, voor zover de belanghebbende deze beschikking betwist.
    url: https://wetten.overheid.nl/BWBR0024649/2020-07-01#Artikel9
  - number: '9.3'
    text: In beroep of hoger beroep legt de belanghebbende zo mogelijk een afschrift over van de beschikking die hij betwist.
    url: https://wetten.overheid.nl/BWBR0024649/2020-07-01#Artikel9
  - number: '9.4'
    text: Het tweede en het derde lid zijn van overeenkomstige toepassing op een verzoek om voorlopige voorziening.
    url: https://wetten.overheid.nl/BWBR0024649/2020-07-01#Artikel9
  - number: '10.1'
    text: |-
      De beschikking waarbij het huisverbod met toepassing van [artikel 2, eerste lid][ref1], of [9, eerste lid][ref2],
      is opgelegd of verlengd, wordt gedurende vijf jaren ter gemeentesecretarie bewaard en vervolgens vernietigd. De
      gedurende deze termijn ontvangen stukken betreffende het huisverbod worden daarbij gevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0024649#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0024649#Artikel9
    url: https://wetten.overheid.nl/BWBR0024649/2020-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0024649
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0024649
        artikel: '9'
  - number: '10.2'
    text: |-
      De persoonsgegevens, opgenomen in de beschikkingen of in de andere stukken, bedoeld in het eerste lid, worden
      verwerkt met het oog op het opleggen, het verlengen en de controle op de naleving van het huisverbod.
    url: https://wetten.overheid.nl/BWBR0024649/2020-07-01#Artikel10
  - number: '11.1'
    text: |-
      De uithuisgeplaatste die handelt in strijd met een met toepassing van [artikel 2, eerste lid][ref1], of
      [artikel 9, eerste lid][ref2], gegeven huisverbod wordt gestraft met gevangenisstraf van ten hoogste twee jaren of
      een geldboete van de vierde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0024649#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0024649#Artikel9
    url: https://wetten.overheid.nl/BWBR0024649/2020-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0024649
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0024649
        artikel: '9'
  - number: '11.2'
    text: De in het eerste lid strafbaar gestelde feiten zijn misdrijven.
    url: https://wetten.overheid.nl/BWBR0024649/2020-07-01#Artikel11
  - number: '13'
    text: |-
      De [Algemene termijnenwet][ref1] is op de termijnen, bedoeld in de [artikelen 2, eerste lid][ref2], en
      [9, eerste lid][ref3], niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002448
      [ref2]: https://wetten.overheid.nl/BWBR0024649#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0024649#Artikel9
    url: https://wetten.overheid.nl/BWBR0024649/2020-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002448
      - id: ref2
        bwb_id: BWBR0024649
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0024649
        artikel: '9'
  - number: '15'
    text: |-
      Onze Minister van Veiligheid en Justitie zendt binnen vijf jaar na de inwerkingtreding van deze wet aan de Staten-
      Generaal een verslag over de doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0024649/2020-07-01#Artikel15
  - number: '16'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0024649/2020-07-01#Artikel16
  - number: '17'
    text: 'Deze wet wordt aangehaald als: Wet tijdelijk huisverbod.'
    url: https://wetten.overheid.nl/BWBR0024649/2020-07-01#Artikel17
