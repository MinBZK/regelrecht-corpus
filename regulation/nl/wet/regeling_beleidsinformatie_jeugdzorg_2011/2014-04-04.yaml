  text: |-
    Gelet op de artikelen 43 en 46, eerste lid, van de Wet op de jeugdzorg en de artikelen 21, 22 en 23 van het Besluit
    beleidsinformatie jeugdzorg 2011;

    Besluiten:
  url: https://wetten.overheid.nl/BWBR0030593/2014-04-04#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 De informatieverstrekking, bedoeld in de [artikelen 21][ref1] en
      [23 van het Besluit beleidsinformatie jeugdzorg 2011][ref2], geschiedt volgens het bij deze regeling in
      [bijlage I][ref3] gevoegde Informatieprotocol beleidsinformatie jeugdzorg 2011.

      2 De informatieverstrekking door de raad voor de kinderbescherming, bedoeld in
      [artikel 22 van het Besluit beleidsinformatie jeugdzorg 2011][ref4], geschiedt volgens het bij deze regeling in
      [bijlage II][ref5] gevoegde Informatieprotocol beleidsinformatie raad voor de kinderbescherming – provincies 2011.

      3 De informatieverstrekking door de aanvaarde rechtspersoon, bedoeld in
      [artikel 22 van het Besluit beleidsinformatie jeugdzorg 2011][ref6], geschiedt volgens het bij deze regeling in
      [bijlage III][ref7] gevoegde Informatieprotocol beleidsinformatie Nidos 2011.


