---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: algemene_kinderbijslagwet
regulatory_layer: WET
publication_date: '2020-07-08'
valid_from: '2013-01-01'
bwb_id: BWBR0002368
url: https://wetten.overheid.nl/BWBR0002368/2013-01-01
preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is regelen vast te stellen inzake een algemene, de gehele
    bevolking omvattende, verplichte kinderbijslagverzekering;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'Voor de toepassing van deze wet en van de tot haar uitvoering genomen besluiten wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel1
  - number: 1.a
    text: 'Onze Minister: Onze Minister van Sociale Zaken en Werkgelegenheid;'
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel1
  - number: 1.b
    text: |-
      lichamen: rechtspersonen, maat- en vennootschappen, samenwerkingsvormen zonder rechtspersoonlijkheid die met
      verenigingen maatschappelijk gelijk kunnen worden gesteld, ondernemingen van publiekrechtelijke rechtspersonen
      en doelvermogens;
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel1
  - number: 1.c
    text: |-
      vreemdeling: hetgeen daaronder wordt verstaan in de [Vreemdelingenwet 2000][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011823
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0011823
  - number: 1.d
    text: |-
      continentaal plat: de exclusieve economische zone van het Koninkrijk, bedoeld in
      [artikel 1 van de Rijkswet instelling exclusieve economische zone][ref1], voor zover deze grenst aan de
      territoriale zee van Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0010480#Artikel1
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0010480
        artikel: '1'
  - number: '2'
    text: Ingezetene in de zin van deze wet is degene, die in Nederland woont.
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel2
  - number: '3.1'
    text: Waar iemand woont en waar een lichaam gevestigd is, wordt naar de omstandigheden beoordeeld.
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel3
  - number: '3.2'
    text: |-
      Voor de toepassing van het eerste lid worden schepen welke in Nederland hun thuishaven hebben, ten opzichte van de
      bemanning als deel van Nederland beschouwd.
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel3
  - number: '3.3'
    text: |-
      Hij die Nederland metterwoon heeft verlaten en binnen een jaar nadien metterwoon terugkeert zonder inmiddels in
      Aruba, Curaçao, Sint Maarten, de openbare lichamen Bonaire, Sint Eustatius en Saba, of op het grondgebied van een
      andere Mogendheid te hebben gewoond, wordt ook voor de duur van zijn afwezigheid geacht in Nederland te hebben
      gewoond.
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel3
  - number: '4.1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder kind: eigen kind, aangehuwd kind of pleegkind.'
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel4
  - number: '4.2'
    text: Als eigen kind wordt beschouwd het kind
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel4
  - number: 4.2.a
    text: |-
      van de vrouw die op grond van [artikel 198 van Boek 1 van het Burgerlijk Wetboek][ref1] als zijn moeder wordt
      aangemerkt;


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel198
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '198'
  - number: 4.2.b
    text: |-
      van de man die op grond van [artikel 199 van Boek 1 van het Burgerlijk Wetboek][ref1] als zijn vader wordt
      aangemerkt;


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel199
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '199'
  - number: 4.2.c
    text: |-
      van de man die op grond van [artikel 394 van Boek 1 van het Burgerlijk Wetboek][ref1] verplicht
      is bij te dragen aan de kosten van verzorging en opvoeding, tenzij het kind reeds op grond van
      [artikel 199 van Boek 1 van het Burgerlijk Wetboek][ref2] als eigen kind van een andere man wordt aangemerkt;


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel394
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel199
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '394'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '199'
  - number: 4.2.d
    text: |-
      van de man wiens biologisch vaderschap door middel van DNA-onderzoek is vastgesteld, mits de man het kind feitelijk
      in relevante mate onderhoudt en het kind niet reeds tot een andere man in een familierechtelijke vaderschapsrelatie
      staat;
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel4
  - number: 4.2.e
    text: |-
      van de man die na toepassing van Nederlands internationaal privaatrecht tot het kind in een familierechtelijke
      vaderschapsrelatie staat.
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel4
  - number: '4.3'
    text: Als pleegkind wordt beschouwd het kind dat als eigen kind wordt onderhouden en opgevoed.
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel4
  - number: '4.4'
    text: Bij ministeriële regeling kan worden bepaald in welke gevallen een kind met een pleegkind wordt gelijkgesteld.
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel4
  - number: 5a
    text: |-
      Bij een besluit ingevolge de [artikelen 14, vierde lid][ref1], en [21][ref2] is mede belanghebbende het Landelijk
      Bureau Inning Onderhoudsbijdragen.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0002368#Artikel21
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '14'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002368
        artikel: '21'
        hoofdstuk: III
        paragraaf: '3'
  - number: '6.1'
    text: Verzekerd overeenkomstig de bepalingen van deze wet is degene, die
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel6
  - number: 6.1.a
    text: ingezetene is;
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel6
  - number: 6.1.b
    text: |-
      geen ingezetene is, doch ter zake van in Nederland of op het continentaal plat in dienstbetrekking verrichte arbeid
      aan de loonbelasting is onderworpen.
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel6
  - number: '6.2'
    text: |-
      Niet verzekerd is de vreemdeling die niet rechtmatig in Nederland verblijf houdt in de zin van
      [artikel 8, onder a tot en met e en l, van de Vreemdelingenwet 2000][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: '6.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan, in afwijking van het eerste en tweede lid, uitbreiding dan wel
      beperking worden gegeven aan de kring der verzekerden.
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel6
  - number: '6.4'
    text: |-
      Bij een maatregel, als bedoeld in het derde lid, kan worden bepaald dat bij een niet rechtmatig verblijf in
      Nederland in de zin van [artikel 8, onder a tot en met e en l][ref1], verzekerd zijn:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 6.4.a
    text: vreemdelingen die rechtmatig in Nederland arbeid verrichten, dan wel hebben verricht;
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel6
  - number: 6.4.b
    text: |-
      vreemdelingen die, na rechtmatig verblijf te hebben gehouden in de zin van
      [artikel 8, onder a tot en met e en l, van de Vreemdelingenwet 2000][ref1], rechtmatig in Nederland verblijf hebben
      als bedoeld in [artikel 8, onder g of h, van de Vreemdelingenwet 2000][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 6a
    text: |-
      Zo nodig in afwijking van [artikel 6][ref1] en de daarop berustende bepalingen:


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel6
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '6'
        hoofdstuk: II
  - number: 6a.a
    text: |-
      wordt als verzekerde aangemerkt de persoon van wie de verzekering op grond van deze wet voortvloeit uit de
      toepassing van bepalingen van een verdrag of van een besluit van een volkenrechtelijke organisatie;
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel6a
  - number: 6a.b
    text: |-
      wordt niet als verzekerde aangemerkt de persoon op wie op grond van een verdrag of een besluit van een
      volkenrechtelijke organisatie de wetgeving van een andere mogendheid van toepassing is.
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel6a
  - number: '7.1'
    text: 'De verzekerde heeft overeenkomstig de bepalingen van deze wet recht op kinderbijslag voor een kind dat:'
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel7
  - number: 7.1.a
    text: jonger is dan 16 jaar en tot zijn huishouden behoort, of
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel7
  - number: 7.1.b
    text: jonger is dan 18 jaar en door hem in belangrijke mate wordt onderhouden.
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel7
  - number: '7.2'
    text: 'De verzekerde heeft voor een kind van 16 of 17 jaar slechts recht op kinderbijslag indien:'
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel7
  - number: 7.2.a
    text: |-
      de verzekerde heeft voldaan aan de verplichtingen, bedoeld in de [artikelen 2, eerste lid][ref1], en
      [4a, eerste lid, van de Leerplichtwet 1969][ref2], dan wel daarvan op grond van [die wet][ref3] is vrijgesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002628#Artikel4a
      [ref3]: https://wetten.overheid.nl/BWBR0002628
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0002628
        artikel: 4a
      - id: ref3
        bwb_id: BWBR0002628
  - number: 7.2.b
    text: |-
      het kind na het behalen van een startkwalificatie als bedoeld in
      [artikel 1, onderdeel f, van de Leerplichtwet 1969][ref1] op lichamelijke of psychische
      gronden niet geschikt is om tot een school onderscheidenlijk een instelling te worden
      toegelaten dan wel een vervolgstudie volgt anders dan hoger onderwijs als bedoeld in
      [artikel 1.1, onderdeel b, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '1'
  - number: 7.2.c
    text: |-
      het kind als leerling of deelnemer van een met een school of instelling als bedoeld in
      [artikel 4a van de Leerplichtwet 1969][ref1] vergelijkbare inrichting van onderwijs buiten Nederland
      staat ingeschreven en deze inrichting geregeld bezoekt, dan wel met overeenkomstige toepassing van de
      vrijstellingsgronden van [die wet][ref2] van die verplichtingen is vrijgesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel4a
      [ref2]: https://wetten.overheid.nl/BWBR0002628
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: 4a
      - id: ref2
        bwb_id: BWBR0002628
  - number: 7.2.d
    text: het kind werkloos is.
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel7
  - number: '7.3'
    text: |-
      Een kind als bedoeld in het eerste lid, onderdeel b, wordt voor het vaststellen van het aantal kinderen voor
      wie recht op kinderbijslag bestaat voor twee kinderen geteld, indien het door de verzekerde grotendeels wordt
      onderhouden en
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel7
  - number: 7.3.a
    text: jonger is dan 16 jaar en
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel7
  - number: 7.3.a.1°
    text: |-
      door of in verband met het volgen van onderwijs of een beroepsopleiding niet tot het huishouden van de verzekerde
      noch als eigen kind, aangehuwd kind of pleegkind tot het huishouden van een ander behoort, of
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel7
  - number: 7.3.a.2°
    text: |-
      in verband met ziekte of gebreken niet tot het huishouden van de verzekerde noch als eigen kind, aangehuwd kind of
      pleegkind tot het huishouden van een ander behoort, of
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel7
  - number: 7.3.b
    text: |-
      16 of 17 jaar is en niet tot het huishouden van de verzekerde noch als eigen kind, aangehuwd kind of pleegkind tot
      het huishouden van een ander behoort.
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel7
  - number: '7.4'
    text: 'Voor het vaststellen van de mate waarin een kind door de verzekerde wordt onderhouden worden:'
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel7
  - number: 7.4.a
    text: het inkomen van het kind geacht te zijn aangewend voor het onderhoud van het kind, en
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel7
  - number: 7.4.b
    text: |-
      bijdragen in het onderhoud van het kind geleverd door degene met wie de verzekerde een huishouden vormt en degene
      met wie de verzekerde geen huishouden vormt, maar die krachtens overeenkomst of rechterlijke uitspraak verplicht
      is bijdragen te leveren voor levensonderhoud ten behoeve van dat kind, aangemerkt als door de verzekerde in het
      onderhoud van dat kind geleverde bijdragen.
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel7
  - number: '7.5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld naar welke wordt beoordeeld of een kind in
      belangrijke mate of grotendeels door de verzekerde wordt onderhouden.
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel7
  - number: '7.6'
    text: |-
      Voor de toepassing van dit artikel wordt het kind geacht de studie of beroepsopleiding eerst na de vakantie te
      hebben beëindigd, indien:
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel7
  - number: 7.6.a
    text: |-
      de studie of de beroepsopleiding wordt beëindigd tijdens een door de onderwijsinstelling vastgestelde vakantie,
      dan wel
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel7
  - number: 7.6.b
    text: |-
      de studie of de beroepsopleiding wordt afgesloten met een eindexamen, dat kort voor het begin van het laatste door
      de onderwijsinstelling vastgestelde vakantie van het desbetreffende schooljaar wordt afgelegd.
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel7
  - number: '7.7'
    text: 'Een kind als bedoeld in het tweede lid, onderdeel d, wordt als werkloos aangemerkt indien het:'
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel7
  - number: 7.7.a
    text: een startkwalificatie heeft behaald; en
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel7
  - number: 7.7.b
    text: als werkzoekende is geregistreerd bij het Uitvoeringsinstituut werknemersverzekeringen.
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel7
  - number: '7.8'
    text: |-
      Een in het buitenland woonachtig kind dat een startkwalificatie heeft behaald dan wel een vorm van onderwijs
      heeft afgerond die vergelijkbaar is met het behalen van een startkwalificatie wordt als werkloos aangemerkt indien
      het als werkzoekende is geregistreerd bij een met het Uitvoeringsinstituut werknemersverzekeringen vergelijkbare
      instelling dan wel bij het ontbreken van een dergelijke instelling aannemelijk kan maken dat het werkloos is en
      beschikbaar is voor de arbeidsmarkt.
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel7
  - number: '7.9'
    text: |-
      Een kind als bedoeld in het tweede lid, onderdeel d, wordt voor het recht op kinderbijslag meegerekend zolang het
      werkloos is.
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel7
  - number: '7.10'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot nadere invulling van het tweede
      lid, vierde lid, onderdeel a, zevende lid en achtste lid.
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel7
  - number: 7a.1
    text: |-
      De verzekerde heeft geen recht op kinderbijslag overeenkomstig de bepalingen van deze wet voor een kind,
      indien dat kind op de eerste dag van een kalenderkwartaal recht heeft op studiefinanciering op grond van de
      [Wet studiefinanciering 2000][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011453
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0011453
  - number: 7a.2
    text: |-
      Ook bestaat geen recht op kinderbijslag zolang op een verzoek tot het treffen van een voorlopige voorziening als
      bedoeld in [titel 8.3 van de Algemene wet bestuursrecht][ref1], ingediend door degene die studiefinanciering op
      grond van de [Wet studiefinanciering 2000][ref2] heeft aangevraagd, geen uitspraak is gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
      [ref2]: https://wetten.overheid.nl/BWBR0011453
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0005537
      - id: ref2
        bwb_id: BWBR0011453
  - number: 7b.1
    text: |-
      Geen recht op kinderbijslag heeft de verzekerde die op de eerste dag van een kalenderkwartaal niet in Nederland
      woont. Evenmin heeft de verzekerde recht op kinderbijslag ten behoeve van het kind, indien dat kind op de eerste
      dag van een kalenderkwartaal niet in Nederland woont.
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel7b
  - number: 7b.2
    text: |-
      Het eerste lid is niet van toepassing indien de verzekerde dan wel dat kind op de eerste dag van een
      kalenderkwartaal woont in een land waarin op grond van een verdrag of een besluit van een volkenrechtelijke
      organisatie recht op kinderbijslag kan bestaan.
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel7b
  - number: 7b.3
    text: |-
      Het eerste lid is niet van toepassing op de verzekerde indien hij dan wel het kind op de eerste dag van een
      kalenderkwartaal niet in Nederland woont doch langer dan drie maanden onafgebroken in Nederland verblijft.
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel7b
  - number: 7b.4
    text: 'Bij of krachtens algemene maatregel van bestuur kan worden bepaald dat recht bestaat op kinderbijslag voor:'
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel7b
  - number: 7b.4.a
    text: de verzekerde, die werkzaamheden verricht in het algemeen belang en niet in Nederland woont;
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel7b
  - number: 7b.4.b
    text: |-
      de verzekerde, die in Aruba, Curaçao, Sint Maarten of in de openbare lichamen Bonaire, Sint Eustatius en Saba
      woont; of
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel7b
  - number: 7b.4.c
    text: de gezinsleden van de in de onderdelen a of b bedoelde verzekerde.
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel7b
  - number: 7b.5
    text: |-
      Onze Minister deelt mede in welke landen op grond van een verdrag of een besluit van een volkenrechtelijke
      organisatie recht op kinderbijslag kan bestaan. In deze mededeling wordt tevens opgenomen:
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel7b
  - number: 7b.5.a
    text: de vindplaats van het desbetreffende verdrag of besluit, en
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel7b
  - number: 7b.5.b
    text: de eventueel in dat verdrag of besluit aanwezige beperkingen.
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel7b
  - number: 7c.1
    text: |-
      De persoon die tot op de dag voor inwerkingtreding van de wet van 22 december 2005 tot wijziging van enige
      socialeverzekeringswetten in verband met de beëindiging van de verzekeringsplicht van in het buitenland
      wonende uitkeringsgerechtigden (Stb. 718) voortgezet verzekerd was op grond van artikel 27, eerste lid, van het
      [Besluit uitbreiding en beperking kring verzekerden volksverzekeringen 1999][ref1], zoals dat artikellid op die dag
      luidde, en op die dag nog recht op kinderbijslag had, behoudt recht op kinderbijslag, zolang het jongste kind voor
      wie de betrokkene voor 31 december 1999 recht had op kinderbijslag de leeftijd van 18 jaar nog niet heeft bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0010182
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel7c
    references:
      - id: ref1
        bwb_id: BWBR0010182
  - number: 7c.2
    text: 'Het recht op kinderbijslag, bedoeld in het eerste lid, eindigt, indien hij:'
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel7c
  - number: 7c.2.a
    text: |-
      niet langer een uitkering, pensioen of toelage ontvangt als bedoeld in
      [artikel 26, eerste lid, van het Besluit uitbreiding en beperking kring verzekerden volksverzekeringen 1999][ref1],
      zoals dat artikellid op 31 december 1999 luidde;


      [ref1]: https://wetten.overheid.nl/BWBR0010182#Artikel26
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel7c
    references:
      - id: ref1
        bwb_id: BWBR0010182
        artikel: '26'
  - number: 7c.2.b
    text: buiten Nederland arbeid verricht;
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel7c
  - number: 7c.2.c
    text: een uitkering ontvangt krachtens een buitenlandse wettelijke regeling; of
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel7c
  - number: 7c.2.d
    text: op grond van deze wet geen recht op kinderbijslag meer bestaat.
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel7c
  - number: '11.1'
    text: |-
      Recht op kinderbijslag voor een of meer kinderen over een kalenderkwartaal ingevolge deze wet heeft slechts
      degene, die op de eerste dag van dat kalenderkwartaal verzekerd is dan wel voldoet aan de voorwaarden van
      [artikel 7c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel7c
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: 7c
        hoofdstuk: III
        paragraaf: '1'
  - number: '11.2'
    text: |-
      Voor het vaststellen van het aantal kinderen, waarvoor over een kalenderkwartaal recht op kinderbijslag bestaat,
      worden slechts in aanmerking genomen de kinderen te wier aanzien aan de voorwaarden, bedoeld in [artikel 7][ref1],
      is voldaan op de eerste dag van dat kwartaal.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel7
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '7'
        hoofdstuk: III
        paragraaf: '1'
  - number: '11.3'
    text: |-
      Wanneer bij het vaststellen van het aantal kinderen, waarvoor over een kalenderkwartaal recht op
      kinderbijslag bestaat, voor een of meer kinderen de mate waarin deze kinderen door de verzekerde worden
      onderhouden, hiervoor bepalend is, wordt het totaal eigen inkomen, vastgesteld met inachtneming van
      [artikel 7, vierde en vijfde lid][ref1], van deze kinderen over dat kalenderkwartaal in aanmerking genomen,
      ongeacht of ten aanzien van deze kinderen gedurende het gehele kwartaal aan de overige voorwaarden, bedoeld in
      [artikel 7][ref2] is voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002368#Artikel7
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '7'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002368
        artikel: '7'
        hoofdstuk: III
        paragraaf: '1'
  - number: '12.1'
    text: Het basiskinderbijslagbedrag over een kalenderkwartaal bedraagt € 268,26  per kind.
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel12
  - number: '12.2'
    text: |-
      Het basiskinderbijslagbedrag bedraagt voor een kind dat woont buiten Nederland, een van de andere lidstaten van
      de Europese Unie, een andere staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte en
      Zwitserland, een bij ministeriële regeling vastgesteld percentage van het bedrag, genoemd in het eerste lid. Het
      percentage wordt zo bepaald dat het een weergave is van de verhouding tussen het kostenniveau van het land waar het
      kind woonachtig is en dat van Nederland. Het percentage bedraagt maximaal 100.
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel12
  - number: '12.3'
    text: |-
      Het aan een verzekerde over een kalenderkwartaal te betalen bedrag aan kinderbijslag bedraagt voor een kind, dat op
      de eerste dag van dat kwartaal:
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel12
  - number: 12.3.a
    text: 'jonger is dan 6 jaar: 70%'
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel12
  - number: 12.3.b
    text: '6 jaar of ouder, maar jonger is dan 12 jaar: 85% en'
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel12
  - number: 12.3.c
    text: '12 jaar en ouder, maar jonger is dan 18 jaar: 100%'
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel12
  - number: '12.4'
    text: |-
      De kinderbijslag op grond van het derde lid, onderdelen b en c, wordt betaald zonder dat dit bij beschikking is
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel12
  - number: '13.1'
    text: |-
      Het bedrag, genoemd in [artikel 12, eerste lid][ref1], wordt al naar gelang de ontwikkeling van het algemene
      prijsniveau verhoogd of verlaagd.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel12
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '12'
        hoofdstuk: III
        paragraaf: '1'
  - number: '13.2'
    text: |-
      Het bedrag, genoemd in [artikel 12, eerste lid][ref1], wordt bij ministeriële regeling telkens herzien met ingang
      van 1 januari en 1 juli. Bij een herziening met ingang van 1 januari onderscheidenlijk 1 juli wordt dit bedrag
      verhoogd of verlaagd met hetzelfde percentage, als waarmede de consumentenprijsindex over de maand oktober daaraan
      voorafgaande onderscheidenlijk over de maand april daaraan voorafgaande, naar boven of naar beneden afwijkt van
      de consumentenprijsindex, waarop de laatste herziening is gebaseerd. In afwijking van de eerste volzin blijft
      herziening per 1 januari onderscheidenlijk per 1 juli achterwege, indien de consumentenprijsindex over de maand
      oktober onderscheidenlijk over de maand april daaraan voorafgaande geen afwijking vertoont ten opzichte van de
      consumentenprijsindex, waarop de laatste herziening is gebaseerd.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel12
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '12'
        hoofdstuk: III
        paragraaf: '1'
  - number: '13.3'
    text: |-
      Het overeenkomstig het tweede lid herziene bedrag treedt in de plaats van het bedrag, genoemd in
      [artikel 12, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel12
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '12'
        hoofdstuk: III
        paragraaf: '1'
  - number: '13.4'
    text: |-
      Indien daartoe naar Ons oordeel een bijzondere aanleiding bestaat, kan het bedrag, genoemd in
      [artikel 12, eerste lid][ref1], bij algemene maatregel van bestuur met ingang van een bij die algemene maatregel
      van bestuur aan te geven datum worden verhoogd. Het ingevolge de vorige zin verhoogde bedrag treedt in de plaats
      van het bedrag, genoemd in [artikel 12, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0002368#Artikel12
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '12'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002368
        artikel: '12'
        hoofdstuk: III
        paragraaf: '1'
  - number: '13.5'
    text: |-
      Indien een verhoging als bedoeld in het vierde lid, samenvalt met een herziening als bedoeld in het tweede lid,
      wordt het kinderbijslagbedrag voorafgaande aan de verhoging herzien en geschiedt de herziening, in afwijking van
      het tweede lid, bij de in het vierde lid bedoelde algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel13
  - number: '13.6'
    text: |-
      Hetgeen onder consumentenprijsindex, bedoeld in het tweede lid, wordt verstaan, wordt nader bij algemene maatregel
      van bestuur geregeld.
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel13
  - number: '13.7'
    text: |-
      Indien het bedrag, genoemd in [artikel 12, eerste lid][ref1], wordt gewijzigd, worden de uit de toepassing van
      artikel 12, derde lid, met betrekking tot dat bedrag voortvloeiende bedragen door Onze Minister bekendgemaakt in
      de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel12
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '12'
        hoofdstuk: III
        paragraaf: '1'
  - number: '13.8'
    text: |-
      Een herziening van de kinderbijslag op grond van dit artikel vindt plaats zonder dat dit bij beschikking is
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel13
  - number: '13.9'
    text: |-
      De Sociale verzekeringsbank betaalt de herziene kinderbijslag, bedoeld in het achtste lid, bij de eerstvolgende
      betaling van de kinderbijslag nadat de herziening, bedoeld in het tweede lid, heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel13
  - number: 13a.1
    text: |-
      In afwijking van [artikel 13, tweede lid][ref1], wordt het bedrag, genoemd in [artikel 12][ref2], met ingang van 1
      januari 2013 en 1 januari 2014, niet herzien.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0002368#Artikel12
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '13'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002368
        artikel: '12'
        hoofdstuk: III
        paragraaf: '1'
  - number: 13a.2
    text: |-
      Voor de herziening van het bedrag, met ingang van 1 juli 2013 respectievelijk 1 juli 2014, wordt voor de toepassing
      van [artikel 13, tweede lid][ref1], onder «de consumentenprijsindex, waarop de laatste herziening is gebaseerd»
      verstaan: de consumentenprijsindex over de maand oktober 2012 respectievelijk de maand oktober 2013.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel13
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '13'
        hoofdstuk: III
        paragraaf: '1'
  - number: 13a.3
    text: Dit artikel vervalt met ingang van 1 januari 2015.
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel13a
  - number: '14.1'
    text: De Sociale verzekeringsbank stelt op aanvraag vast of een recht op kinderbijslag bestaat.
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel14
  - number: '14.2'
    text: |-
      Een aanvraag wordt ingediend door middel van een door de Sociale verzekeringsbank beschikbaar gesteld
      aanvraagformulier.
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel14
  - number: '14.3'
    text: |-
      Het recht op kinderbijslag kan niet vroeger ingaan dan een jaar voorafgaand aan de eerste dag van het
      kalenderkwartaal tijdens welk de aanvraag om kinderbijslag werd ingediend. De Sociale verzekeringsbank is bevoegd
      in bijzondere gevallen af te wijken van het bepaalde in de vorige volzin.
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel14
  - number: '14.4'
    text: |-
      Indien de verzekerde nalaat een aanvraag om kinderbijslag in te dienen, kan deze aanvraag worden ingediend door het
      Landelijk Bureau Inning Onderhoudsbijdragen, dat tevens adviseert aan wie de kinderbijslag wordt betaald.
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel14
  - number: 14a.1
    text: |-
      Onverminderd het elders in deze wet bepaalde terzake van herziening of intrekking van een besluit tot toekenning
      van kinderbijslag en terzake van weigering van kinderbijslag, herziet de Sociale verzekeringsbank een dergelijk
      besluit of trekt zij dat in:
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel14a
  - number: 14a.1.a
    text: |-
      indien het niet of niet behoorlijk nakomen van een verplichting op grond van [artikel 15][ref1] of [16][ref2] heeft
      geleid tot het ten onrechte of tot een te hoog bedrag verlenen van kinderbijslag;


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002368#Artikel16
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '15'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002368
        artikel: '16'
        hoofdstuk: III
        paragraaf: '2'
  - number: 14a.1.b
    text: indien anderszins de kinderbijslag ten onrechte of tot een te hoog bedrag is verleend;
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel14a
  - number: 14a.1.c
    text: |-
      indien het niet of niet behoorlijk nakomen van een verplichting op grond van [artikel 15][ref1] of [16][ref2] ertoe
      leidt dat niet kan worden vastgesteld of nog recht op kinderbijslag bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002368#Artikel16
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '15'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002368
        artikel: '16'
        hoofdstuk: III
        paragraaf: '2'
  - number: 14a.2
    text: |-
      Indien daarvoor dringende redenen aanwezig zijn kan de Sociale verzekeringsbank besluiten geheel of gedeeltelijk
      van herziening of intrekking als bedoeld in het eerste lid af te zien.
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel14a
  - number: 14a.3
    text: |-
      Indien de verzekerde of de persoon aan wie of de instelling waaraan op grond van [artikel 21][ref1] kinderbijslag
      wordt betaald niet op grond van [artikel 15a][ref2] desgevraagd aantoont dat is voldaan aan artikel 15a, eerste
      lid, onderdelen a en b, en als gevolg hiervan niet kan worden vastgesteld tot wiens huishouden het kind behoort,
      wordt het recht op kinderbijslag vastgesteld, herzien of ingetrokken en het recht op kinderbijslag geldend gemaakt
      overeenkomstig [hoofdstuk III, paragraaf 1][ref3] en [2][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0002368#Artikel15a
      [ref3]: https://wetten.overheid.nl/BWBR0002368#HoofdstukIII
      [ref4]: https://wetten.overheid.nl/BWBR0002368#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '21'
        hoofdstuk: III
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0002368
        artikel: 15a
        hoofdstuk: III
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0002368
        hoofdstuk: III
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0002368
        hoofdstuk: III
        paragraaf: '2'
  - number: '15.1'
    text: |-
      De verzekerde, alsmede de persoon aan wie of de instelling waaraan op grond van [artikel 21][ref1] kinderbijslag
      wordt betaald, zijn verplicht aan de Sociale verzekeringsbank op haar verzoek of onverwijld uit eigen beweging alle
      feiten en omstandigheden mee te delen, waarvan hem of haar redelijkerwijs duidelijk moet zijn dat zij van invloed
      kunnen zijn op het recht op kinderbijslag, de hoogte van de kinderbijslag, het geldend maken van het recht op
      kinderbijslag of op het bedrag van de kinderbijslag, dat wordt betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel21
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '21'
        hoofdstuk: III
        paragraaf: '3'
  - number: '15.2'
    text: 'De verplichting van het eerste lid geldt niet indien:'
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel15
  - number: 15.2.a
    text: |-
      die feiten en omstandigheden door de Sociale verzekeringsbank kunnen worden vastgesteld op grond van bij wettelijk
      voorschrift als authentiek aangemerkte gegevens of kunnen worden verkregen uit bij ministeriële regeling aan te
      wijzen administraties. Bij ministeriële regeling wordt bepaald voor welke gegevens dit onderdeel van toepassing
      is, of
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel15
  - number: 15.2.b
    text: |-
      het kind voor wie kinderbijslag wordt betaald recht krijgt op studiefinanciering op grond van de
      [Wet studiefinanciering 2000][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011453
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0011453
  - number: 15a.1
    text: |-
      In aanvulling op [artikel 15][ref1] kan de Sociale verzekeringsbank de verzekerde of de persoon aan wie of de
      instelling waaraan op grond van [artikel 21][ref2] kinderbijslag wordt betaald verzoeken aan te tonen dat:


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002368#Artikel21
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '15'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002368
        artikel: '21'
        hoofdstuk: III
        paragraaf: '3'
  - number: 15a.1.a
    text: |-
      ten aanzien van een kind als bedoeld in [artikel 7, eerste lid, onderdeel a, en tweede lid][ref1], wordt voldaan
      aan de voorwaarden, gesteld in artikel 7, eerste lid, onderdeel a, en tweede lid, of


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel7
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '7'
        hoofdstuk: III
        paragraaf: '1'
  - number: 15a.1.b
    text: |-
      een kind als bedoeld in [artikel 7, derde lid][ref1], niet tot het huishouden van de verzekerde noch tot het
      huishouden van een ander behoort.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel7
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '7'
        hoofdstuk: III
        paragraaf: '1'
  - number: 15a.2
    text: |-
      Teneinde de verzekerde of de persoon aan wie of de instelling waaraan op grond van [artikel 21][ref1] kinderbijslag
      wordt betaald daartoe in de gelegenheid te stellen, kan de Sociale verzekeringsbank bij dit verzoek aanbieden
      met de toestemming van de verzekerde of de bewoner van de woning waar het kind woont, de woning van verzekerde
      onderscheidenlijk de woning waar het kind woont binnen te treden.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel21
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '21'
        hoofdstuk: III
        paragraaf: '3'
  - number: 15a.3
    text: |-
      Indien door het ontbreken van toestemming van de bewoner niet kan worden vastgesteld tot wiens huishouden het kind
      behoort, heeft dit gevolgen voor het recht op en het geldend maken van het recht op kinderbijslag.
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel15a
  - number: '16.1'
    text: |-
      De Sociale verzekeringsbank is bevoegd controlevoorschriften vast te stellen. Deze voorschriften mogen niet verder
      gaan dan strikt noodzakelijk is voor een juiste uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel16
  - number: '16.2'
    text: |-
      De verzekerde, alsmede de persoon aan wie of de instelling waaraan op grond van [artikel 21][ref1] kinderbijslag
      wordt betaald, zijn verplicht de voorschriften op te volgen en anderszins aan de Sociale verzekeringsbank
      desgevraagd de medewerking te verlenen die redelijkerwijs nodig is voor de uitvoering van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel21
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '21'
        hoofdstuk: III
        paragraaf: '3'
  - number: '17.1'
    text: |-
      De Sociale verzekeringsbank weigert de kinderbijslag tijdelijk of blijvend, geheel of gedeeltelijk
      indien de verzekerde of de persoon aan wie op grond van [artikel 21][ref1] kinderbijslag wordt
      betaald, een verplichting op grond van [artikel 16][ref2] opgelegd, of de verplichting, bedoeld in
      [artikel 55, tweede lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref3], niet of niet
      behoorlijk is nagekomen, dan wel de verplichting, bedoeld in [artikel 15][ref4] niet binnen de door de Sociale
      verzekeringsbank daarvoor vastgestelde termijn is nagekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0002368#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Artikel55
      [ref4]: https://wetten.overheid.nl/BWBR0002368#Artikel15
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '21'
        hoofdstuk: III
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0002368
        artikel: '16'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0013060
        artikel: '55'
      - id: ref4
        bwb_id: BWBR0002368
        artikel: '15'
        hoofdstuk: III
        paragraaf: '2'
  - number: '17.2'
    text: |-
      Een maatregel als bedoeld in het eerste lid wordt afgestemd op de ernst van de gedraging en de mate waarin de
      verzekerde dan wel de persoon aan wie op grond van [artikel 21][ref1] kinderbijslag wordt betaald, de gedraging
      verweten kan worden. Van het opleggen van een maatregel wordt in elk geval afgezien, indien elke vorm van
      verwijtbaarheid ontbreekt.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel21
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '21'
        hoofdstuk: III
        paragraaf: '3'
  - number: '17.3'
    text: |-
      De Sociale verzekeringsbank kan afzien van het opleggen van een maatregel als bedoeld in het eerste lid en volstaan
      met het geven van een schriftelijke waarschuwing ter zake van het niet tijdig nakomen van de verplichting, bedoeld
      in [artikel 15][ref1], indien het niet tijdig nakomen van de verplichting niet heeft geleid tot het ten onrechte of
      tot een te hoog bedrag verlenen van kinderbijslag, tenzij het niet tijdig nakomen van de verplichting plaatsvindt
      binnen een periode van twee jaar te rekenen vanaf de datum waarop eerder aan de verzekerde, of de persoon aan wie
      op grond van [artikel 21][ref2] kinderbijslag wordt betaald, een zodanige waarschuwing is gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002368#Artikel21
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '15'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002368
        artikel: '21'
        hoofdstuk: III
        paragraaf: '3'
  - number: '17.4'
    text: |-
      De Sociale verzekeringsbank kan afzien van het opleggen van een maatregel indien daarvoor dringende redenen
      aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel17
  - number: '17.5'
    text: |-
      Het opleggen van een maatregel blijft achterwege indien voor dezelfde gedraging een bestuurlijke boete als bedoeld
      in [artikel 17a][ref1] wordt opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel17a
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: 17a
        hoofdstuk: III
        paragraaf: '2'
  - number: '17.6'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot het eerste en
      tweede lid.
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel17
  - number: 17a.1
    text: |-
      De Sociale verzekeringsbank legt een bestuurlijke boete op van ten hoogste het benadelingsbedrag wegens het niet
      of niet behoorlijk nakomen door de verzekerde, of de persoon aan wie op grond van [artikel 21][ref1] kinderbijslag
      wordt betaald, van de verplichting, bedoeld in [artikel 15][ref2]. De bestuurlijke boete is niet lager dan de boete
      die op grond van het derde lid zou worden opgelegd indien er geen sprake was van een benadelingsbedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0002368#Artikel15
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '21'
        hoofdstuk: III
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0002368
        artikel: '15'
        hoofdstuk: III
        paragraaf: '2'
  - number: 17a.2
    text: |-
      In dit artikel wordt onder benadelingsbedrag verstaan het brutobedrag dat als gevolg van het niet of niet
      behoorlijk nakomen van de verplichting, bedoeld in [artikel 15][ref1], ten onrechte of tot een te hoog bedrag aan
      kinderbijslag is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel15
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '15'
        hoofdstuk: III
        paragraaf: '2'
  - number: 17a.3
    text: |-
      Indien het niet of niet behoorlijk nakomen door de verzekerde, of de persoon aan wie op grond van
      [artikel 21][ref1] kinderbijslag wordt betaald, van de verplichting, bedoeld in [artikel 15][ref2], niet heeft
      geleid tot een benadelingsbedrag, legt de Sociale verzekeringsbank een bestuurlijke boete op van ten hoogste het
      bedrag van de tweede categorie, bedoeld in [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0002368#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel23
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '21'
        hoofdstuk: III
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0002368
        artikel: '15'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0001854
        artikel: '23'
  - number: 17a.4
    text: |-
      De Sociale verzekeringsbank kan afzien van het opleggen van een bestuurlijke boete als bedoeld in het derde lid
      en volstaan met het geven van een schriftelijke waarschuwing wegens het niet of niet behoorlijk nakomen van de
      verplichting, bedoeld in [artikel 15][ref1], tenzij het niet of niet behoorlijk nakomen van de verplichting plaats
      vindt binnen een periode van twee jaar te rekenen vanaf de datum waarop eerder aan de verzekerde, of aan de persoon
      aan wie op grond van [artikel 21][ref2] kinderbijslag wordt betaald, een zodanige waarschuwing is gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002368#Artikel21
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '15'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002368
        artikel: '21'
        hoofdstuk: III
        paragraaf: '3'
  - number: 17a.5
    text: |-
      De Sociale verzekeringsbank legt een bestuurlijke boete op wegens het niet of niet behoorlijk nakomen door de
      verzekerde, of de persoon aan wie op grond van [artikel 21][ref1] kinderbijslag wordt betaald, van de verplichting,
      bedoeld in [artikel 15][ref2], als gevolg waarvan ten onrechte of tot een te hoog bedrag aan kinderbijslag
      is ontvangen, van ten hoogste 150 procent van het benadelingsbedrag indien binnen een tijdvak van vijf jaar
      voorafgaand aan de dag van het begaan van de overtreding een eerdere bestuurlijke boete of strafrechtelijke sanctie
      is opgelegd wegens een eerdere overtreding, bestaande uit eenzelfde gedraging, die onherroepelijk is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0002368#Artikel15
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '21'
        hoofdstuk: III
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0002368
        artikel: '15'
        hoofdstuk: III
        paragraaf: '2'
  - number: 17a.6
    text: |-
      In afwijking van het vijfde lid is het in dat lid genoemde tijdvak van vijf jaar tien jaar indien wegens de eerdere
      overtreding, bedoeld in het vijfde lid, de verzekerde, of de persoon aan wie op grond van [artikel 21][ref1]
      kinderbijslag wordt betaald, is gestraft met een onvoorwaardelijke gevangenisstraf.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel21
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '21'
        hoofdstuk: III
        paragraaf: '3'
  - number: 17a.7
    text: 'De Sociale verzekeringsbank kan:'
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel17a
  - number: 17a.7.a
    text: de bestuurlijke boete verlagen indien sprake is van verminderde verwijtbaarheid;
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel17a
  - number: 17a.7.b
    text: afzien van het opleggen van een bestuurlijke boete indien daarvoor dringende redenen aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel17a
  - number: 17a.8
    text: |-
      Degene aan wie een bestuurlijke boete is opgelegd, is verplicht desgevraagd aan de Sociale verzekeringsbank de
      inlichtingen te verstrekken die voor de tenuitvoerlegging van de bestuurlijke boete van belang zijn.
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel17a
  - number: 17a.9
    text: Bij algemene maatregel van bestuur worden nadere regels gesteld over de hoogte van de bestuurlijke boete.
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel17a
  - number: 17a.10
    text: |-
      In afwijking van [artikel 8:69 van de Algemene wet bestuursrecht][ref1] kan de rechter in beroep of hoger beroep
      het bedrag waarop de bestuurlijke boete is vastgesteld ook ten nadele van de verzekerde, dan wel de persoon aan wie
      op grond van [artikel 21][ref2] kinderbijslag wordt betaald, wijzigen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002368#Artikel21
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0002368
        artikel: '21'
        hoofdstuk: III
        paragraaf: '3'
  - number: 17c
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld omtrent de termijn waarvoor uitstel van
      betaling van de bestuurlijke boete kan worden verleend alsmede omtrent de hoogte van het op grond van
      [artikel 17g, eerste of tweede lid][ref1], te verrekenen bedrag en de termijn of termijnen waarbinnen deze
      verrekening plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel17g
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel17c
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: 17g
        hoofdstuk: III
        paragraaf: '2'
  - number: 17g.1
    text: |-
      De Sociale verzekeringsbank verrekent de bestuurlijke boete met kinderbijslag op grond van deze wet,
      ouderdomspensioen op grond van de [Algemene Ouderdomswet][ref1] of een uitkering op grond van de
      [Algemene nabestaandenwet][ref2], die degene aan wie een bestuurlijke boete is opgelegd, dan wel degene met wie hij
      een huishouden vormt, ontvangt.


      [ref1]: https://wetten.overheid.nl/BWBR0002221
      [ref2]: https://wetten.overheid.nl/BWBR0007795
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel17g
    references:
      - id: ref1
        bwb_id: BWBR0002221
      - id: ref2
        bwb_id: BWBR0007795
  - number: 17g.2
    text: |-
      Het college van burgemeester en wethouders van de betrokken gemeente, onderscheidenlijk het Uitvoeringsinstituut
      werknemersverzekeringen, betaalt het bedrag van de bestuurlijke boete, zonder dat daarvoor een machtiging nodig
      is, op haar verzoek aan de Sociale verzekeringsbank indien degene aan wie een bestuurlijke boete is opgelegd, dan
      wel degene met wie hij een huishouden vormt, een uitkering ontvangt op grond van de [Wet werk en bijstand][ref1],
      de [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref2],
      de [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref3],
      de [Wet inkomensvoorziening oudere werklozen][ref4], de [Werkloosheidswet][ref5], de
      [Ziektewet][ref6], de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref7], de
      [Wet werk en arbeidsondersteuning jonggehandicapten][ref8], de [Wet werk en inkomen naar arbeidsvermogen][ref9], de
      [Wet op de arbeidsongeschiktheidsverzekering][ref10] of de [Wet arbeid en zorg][ref11] of een toeslag op grond van
      de [Toeslagenwet][ref12].


      [ref1]: https://wetten.overheid.nl/BWBR0015703
      [ref2]: https://wetten.overheid.nl/BWBR0004044
      [ref3]: https://wetten.overheid.nl/BWBR0004163
      [ref4]: https://wetten.overheid.nl/BWBR0024394
      [ref5]: https://wetten.overheid.nl/BWBR0004045
      [ref6]: https://wetten.overheid.nl/BWBR0001888
      [ref7]: https://wetten.overheid.nl/BWBR0008656
      [ref8]: https://wetten.overheid.nl/BWBR0008657
      [ref9]: https://wetten.overheid.nl/BWBR0019057
      [ref10]: https://wetten.overheid.nl/BWBR0002524
      [ref11]: https://wetten.overheid.nl/BWBR0013008
      [ref12]: https://wetten.overheid.nl/BWBR0004043
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel17g
    references:
      - id: ref1
        bwb_id: BWBR0015703
      - id: ref2
        bwb_id: BWBR0004044
      - id: ref3
        bwb_id: BWBR0004163
      - id: ref4
        bwb_id: BWBR0024394
      - id: ref5
        bwb_id: BWBR0004045
      - id: ref6
        bwb_id: BWBR0001888
      - id: ref7
        bwb_id: BWBR0008656
      - id: ref8
        bwb_id: BWBR0008657
      - id: ref9
        bwb_id: BWBR0019057
      - id: ref10
        bwb_id: BWBR0002524
      - id: ref11
        bwb_id: BWBR0013008
      - id: ref12
        bwb_id: BWBR0004043
  - number: 17g.3
    text: |-
      De in [artikel 479g van het Wetboek van Burgerlijke Rechtsvordering][ref1] aan de raad voor de kinderbescherming
      toegekende bevoegdheid komt gelijkelijk toe aan de Sociale verzekeringsbank. Indien de Sociale verzekeringsbank
      gebruik maakt van deze bevoegdheid, geschiedt de bekendmaking van het dwangbevel, in afwijking van
      [artikel 4:123, eerste lid, van de Algemene wet bestuursrecht][ref2], door middel van toezending per post aan
      degene aan wie de boete is opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel479g
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel17g
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 479g
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 17g.4
    text: |-
      Zolang de verzekerde en degene met wie hij een huishouden vormt, dan wel de persoon aan wie op grond van
      [artikel 21][ref1] kinderbijslag wordt betaald, zijn verplichting als bedoeld in [artikel 17a, achtste lid][ref2],
      niet of niet behoorlijk nakomt:


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0002368#Artikel17a
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel17g
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '21'
        hoofdstuk: III
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0002368
        artikel: 17a
        hoofdstuk: III
        paragraaf: '2'
  - number: 17g.4.a
    text: |-
      is de Sociale verzekeringsbank, in afwijking van
      [artikel 4.93, vierde lid, van de Algemene wet bestuursrecht][ref1], bevoegd tot verrekening van de bestuurlijke
      boete voor zover beslag op de vordering van de schuldeiser nietig zou zijn;


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel17g
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 17g.4.b
    text: |-
      geldt de beslagvrije voet, bedoeld in de
      [artikelen 475c tot en met 475e van het Wetboek van Burgerlijke Rechtsvordering][ref1], in afwijking van
      [artikel 4:116 van de Algemene wet bestuursrecht][ref2], niet bij de invordering van een bestuurlijke boete bij
      dwangbevel.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel475c
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel17g
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 475c
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 17h.1
    text: |-
      Bij de verrekening, bedoeld in [artikel 17g, eerste lid][ref1], wordt de bestuurlijke boete,
      bedoeld in [artikel 17a, vijfde lid][ref2], door Sociale verzekeringsbank, in afwijking van
      [artikel 4:93, vierde lid, van de Algemene wet bestuursrecht][ref3], verrekend gedurende een tijdvak van ten
      hoogste vijf jaar vanaf het moment van de dagtekening waarop de bestuurlijke boete is opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel17g
      [ref2]: https://wetten.overheid.nl/BWBR0002368#Artikel17a
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel17h
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: 17g
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002368
        artikel: 17a
        hoofdstuk: III
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 17h.2
    text: |-
      [Artikel 17g, eerste lid][ref1], en het eerste lid zijn van overeenkomstige toepassing op de verrekening van de
      bestuurlijke boete, bedoeld in [artikel 17a, eerste lid][ref2], indien en voor zover op het moment van verrekening,
      bedoeld in het eerste lid, de bestuurlijke boete door de overtreder niet is betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel17g
      [ref2]: https://wetten.overheid.nl/BWBR0002368#Artikel17a
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel17h
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: 17g
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002368
        artikel: 17a
        hoofdstuk: III
        paragraaf: '2'
  - number: 17h.3
    text: |-
      De Sociale verzekeringsbank kan op verzoek van degene aan wie de bestuurlijke boete is opgelegd besluiten het
      eerste en tweede lid niet of niet meer toe te passen indien, gelet op bijzondere omstandigheden, dringende redenen
      daartoe noodzaken.
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel17h
  - number: 17h.4
    text: |-
      De voorgaande leden laten de verrekening van de bestuurlijke boete op grond van [artikel 17g, eerste][ref1], na het
      tijdvak, bedoeld in het eerste lid, onverlet.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel17g
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel17h
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: 17g
        hoofdstuk: III
        paragraaf: '2'
  - number: 17h.5
    text: |-
      Indien als gevolg van de verrekening, bedoeld in het eerste en tweede lid, algemene bijstand op grond van de
      [Wet werk en bijstand][ref1] wordt toegekend, wordt bij de verrekening een bij ministeriële regeling bepaald deel
      van de kinderbijslag op grond van deze wet vrijgelaten in verband met zorgkosten, woonkosten en de kosten van
      kinderen. Het vrij te laten deel van de kinderbijslag kan afhankelijk worden gesteld van de leefsituatie.


      [ref1]: https://wetten.overheid.nl/BWBR0015703
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel17h
    references:
      - id: ref1
        bwb_id: BWBR0015703
  - number: '18.1'
    text: |-
      De Sociale verzekeringsbank betaalt de kinderbijslag zo spoedig mogelijk, doch uiterlijk binnen drie maanden na
      afloop van het kwartaal waarover recht op kinderbijslag bestaat.
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel18
  - number: '18.2'
    text: |-
      Indien twee personen, die gezamenlijk een huishouden vormen, over eenzelfde tijdvak recht op kinderbijslag voor
      eenzelfde kind hebben, wordt de kinderbijslag uitbetaald aan degene van hen die zij gezamenlijk daartoe hebben
      aangewezen.
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel18
  - number: '18.3'
    text: |-
      Bij gebreke van een gezamenlijke aanwijzing als bedoeld in het tweede lid bepaalt de Sociale verzekeringsbank aan
      welke persoon de kinderbijslag wordt uitbetaald.
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel18
  - number: '18.4'
    text: |-
      Indien twee of meer personen waaronder één persoon tot wiens huishouden het kind behoort, over eenzelfde tijdvak
      recht op kinderbijslag voor eenzelfde kind hebben, wordt de kinderbijslag waarop degene recht heeft, tot wiens
      huishouden dit kind niet behoort, niet betaald.
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel18
  - number: '18.5'
    text: |-
      Indien twee of meer personen over eenzelfde tijdvak recht hebben op kinderbijslag voor eenzelfde kind, in andere
      situaties dan bedoeld in het tweede en vierde lid, wordt betaald de kinderbijslag waarop degene recht heeft die de
      hoogste bijdrage in het onderhoud van dit kind levert. Aan de andere personen wordt geen kinderbijslag uitbetaald.
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel18
  - number: '18.6'
    text: |-
      Bij algemene maatregel van bestuur kunnen met betrekking tot situaties van samenloop, bedoeld in het tweede, vierde
      en vijfde lid, nadere en aanvullende regels worden gesteld waarbij bepaald kan worden dat aan een ander persoon de
      kinderbijslag wordt uitbetaald dan de persoon, bedoeld in het vierde en vijfde lid.
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel18
  - number: '18.7'
    text: |-
      De kinderbijslag die op grond van het tweede tot en met zesde lid aan een verzekerde wordt betaald, kan op verzoek
      van die verzekerde in gedeelten aan meer verzekerden worden betaald.
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel18
  - number: '18.8'
    text: |-
      Indien de kinderbijslag in het buitenland wordt uitbetaald, geschiedt de betaling in afwijking van
      [artikel 4:89, derde lid, van de Algemene wet bestuursrecht][ref1] op het tijdstip waarop de rekening van de
      daartoe door de schuldeiser aangewezen bank wordt gecrediteerd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '19'
    text: |-
      De Sociale verzekeringsbank schort de betaling van de kinderbijslag op of schorst de betaling, indien zij op grond
      van duidelijke aanwijzingen van oordeel is of het gegronde vermoeden heeft, dat:
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel19
  - number: 19.a
    text: het recht op kinderbijslag niet of niet meer bestaat;
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel19
  - number: 19.b
    text: recht op een lagere kinderbijslag bestaat, of
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel19
  - number: 19.c
    text: |-
      de verzekerde, alsmede de persoon aan wie of de instelling aan welke op grond van [artikel 21][ref1] kinderbijslag
      wordt betaald, een verplichting hem of haar op grond van de [artikelen 15][ref2], [15a, eerste lid][ref3], en
      [16][ref4] opgelegd, niet is nagekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0002368#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0002368#Artikel15a
      [ref4]: https://wetten.overheid.nl/BWBR0002368#Artikel16
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '21'
        hoofdstuk: III
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0002368
        artikel: '15'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0002368
        artikel: 15a
        hoofdstuk: III
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0002368
        artikel: '16'
        hoofdstuk: III
        paragraaf: '2'
  - number: 19a.1
    text: |-
      De Sociale verzekeringsbank schort de betaling van de kinderbijslag op, indien blijkt dat het door de verzekerde
      verstrekte adres van hemzelf of van zijn kind afwijkt van het adres waaronder de verzekerde of het kind in de
      gemeentelijke basisadministratie persoonsgegevens staat ingeschreven.
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel19a
  - number: 19a.2
    text: 'Geen opschorting vindt plaats:'
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel19a
  - number: 19a.2.a
    text: indien de afwijking redelijkerwijs geen gevolgen kan hebben voor het recht op of de hoogte van de kinderbijslag;
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel19a
  - number: 19a.2.b
    text: indien de belanghebbende van de afwijking redelijkerwijs geen verwijt kan worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel19a
  - number: 19a.3
    text: De Sociale verzekeringsbank doet schriftelijk mededeling van de opschorting aan de verzekerde.
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel19a
  - number: 19a.4
    text: |-
      De opschorting wordt beëindigd zodra het aan de Sociale verzekeringsbank gebleken is dat de afwijking niet meer
      bestaat.
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel19a
  - number: '20'
    text: |-
      Indien voor hetzelfde kind kinderbijslag of een naar aard en strekking daarmee overeenkomende gezinsbijslag kan
      worden betaald ingevolge deze wet en ingevolge een rechtens geldende regeling, bestaande in een ander land, of
      ingevolge een regeling van een volkenrechtelijke organisatie, kunnen bij ministeriële regeling regels worden
      gesteld ter voorkoming of beperking van samenloop met dergelijke gezinsbijslagen of ter voorkoming van dubbele
      kinderbijslag.
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel20
  - number: '21'
    text: |-
      De Sociale verzekeringsbank is bevoegd, voor zover nodig na ingewonnen advies van het Landelijk Bureau Inning
      Onderhoudsbijdragen de kinderbijslag voor een kind te betalen aan een ander dan de rechthebbende.
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel21
  - number: 21a
    text: |-
      Voor zover bij of krachtens deze wet niet anders is bepaald, wordt een voorschot op de nog niet vastgestelde
      kinderbijslag beschouwd als kinderbijslag op grond van deze wet.
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel21a
  - number: '22'
    text: |-
      De kinderbijslag die niet in ontvangst is genomen of is ingevorderd binnen drie maanden na de dag van
      betaalbaarstelling, wordt niet meer betaald. De Sociale verzekeringsbank is bevoegd in bijzondere gevallen ten
      gunste van degene aan wie de kinderbijslag wordt betaald af te wijken van de in de eerste volzin genoemde drie
      maanden.
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel22
  - number: '23.1'
    text: 'De kinderbijslag is:'
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel23
  - number: 23.1.a
    text: onvervreemdbaar;
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel23
  - number: 23.1.b
    text: niet vatbaar voor verpanding of belening;
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel23
  - number: 23.1.c
    text: |-
      behoudens voor zoveel dit dient tot verhaal van een uitkering tot levensonderhoud van het kind, of tot
      terugvordering van onverschuldigd betaalde kinderbijslag als bedoeld in [artikel 24][ref1], niet vatbaar
      voor executoriaal of conservatoir beslag noch voor beslag ingevolge faillissement of toepassing van de
      schuldsaneringsregeling natuurlijke personen.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel24
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '24'
        hoofdstuk: III
        paragraaf: '3'
  - number: '23.2'
    text: |-
      Volmacht tot ontvangst van kinderbijslag, onder welke vorm of welke benaming ook door de verzekerde verleend, is
      steeds herroepelijk.
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel23
  - number: '23.3'
    text: Elk beding, strijdig met enige bepaling van dit artikel, is nietig.
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel23
  - number: '24.1'
    text: |-
      De kinderbijslag die als gevolg van een besluit als bedoeld in [artikel 14a][ref1] onverschuldigd is betaald,
      alsmede hetgeen anderszins onverschuldigd is betaald, wordt door de Sociale verzekeringsbank van de verzekerde, dan
      wel degene met wie hij een huishouding vormt, of de persoon aan wie op grond van [artikel 21][ref2] kinderbijslag
      wordt betaald, teruggevorderd.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel14a
      [ref2]: https://wetten.overheid.nl/BWBR0002368#Artikel21
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: 14a
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002368
        artikel: '21'
        hoofdstuk: III
        paragraaf: '3'
  - number: '24.2'
    text: |-
      In afwijking van het eerste lid kan de Sociale verzekeringsbank besluiten van terugvordering of van verdere
      terugvordering af te zien, indien de verzekerde, dan wel degene met wie hij een huishouding vormt, of de persoon
      aan wie op grond van [artikel 21][ref1] kinderbijslag wordt betaald:


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel21
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '21'
        hoofdstuk: III
        paragraaf: '3'
  - number: 24.2.a
    text: gedurende vijf jaar volledig aan zijn betalingsverplichtingen heeft voldaan;
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel24
  - number: 24.2.b
    text: |-
      gedurende vijf jaar niet volledig aan zijn betalingsverplichtingen heeft voldaan, maar het achterstallige bedrag
      over die periode, vermeerderd met de daarover verschuldigde wettelijke rente en de op de invordering betrekking
      hebbende kosten, alsnog heeft betaald;
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel24
  - number: 24.2.c
    text: |-
      gedurende vijf jaar geen betalingen heeft verricht en niet aannemelijk is dat hij deze op enig moment zal gaan
      verrichten; of
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel24
  - number: 24.2.d
    text: een bedrag, overeenkomend met ten minste 50% van de restsom in één keer aflost.
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel24
  - number: '24.3'
    text: |-
      De in het tweede lid, onderdelen a, b en c, genoemde termijn is tien jaar indien de terugvordering het gevolg is
      van het niet of niet behoorlijk nakomen van de verplichting, bedoeld in [artikel 15][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel15
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '15'
        hoofdstuk: III
        paragraaf: '2'
  - number: '24.4'
    text: 'De in het tweede lid, onder a en b, genoemde termijn is drie jaar indien:'
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel24
  - number: 24.4.a
    text: |-
      het gemiddeld inkomen van de belanghebbende in die periode de beslagvrije voet bedoeld in de [artikelen 475c][ref1]
      en [475d van het Wetboek van Burgerlijke Rechtsvordering][ref2] niet te boven is gegaan; en


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel475c
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel475d
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 475c
      - id: ref2
        bwb_id: BWBR0001827
        artikel: 475d
  - number: 24.4.b
    text: |-
      de terugvordering niet het gevolg is van het niet of niet behoorlijk nakomen van de verplichting, bedoeld in
      [artikel 15][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel15
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '15'
        hoofdstuk: III
        paragraaf: '2'
  - number: '24.5'
    text: |-
      Indien daarvoor dringende redenen aanwezig zijn kan de Sociale verzekeringsbank besluiten geheel of gedeeltelijk
      van terugvordering af te zien.
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel24
  - number: '24.6'
    text: |-
      Degene van wie wordt teruggevorderd is verplicht desgevraagd aan de Sociale verzekeringsbank de inlichtingen te
      verstrekken die voor de terugvordering van belang zijn.
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel24
  - number: '24.7'
    text: |-
      In afwijking van het eerste lid kan de Sociale verzekeringsbank, onder voorwaarden die Onze Minister kan stellen,
      besluiten van terugvordering af te zien indien het terug te vorderen bedrag een door Onze Minister vast te stellen
      bedrag niet te boven gaat.
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel24
  - number: 24a.1
    text: |-
      De Sociale verzekeringsbank kan de onverschuldigd betaalde kinderbijslag, bedoeld in
      [artikel 24, eerste lid][ref1], invorderen bij dwangbevel.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel24
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel24a
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '24'
        hoofdstuk: III
        paragraaf: '3'
  - number: 24a.2
    text: |-
      [Artikel 17g][ref1] is van overeenkomstige toepassing, met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel17g
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel24a
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: 17g
        hoofdstuk: III
        paragraaf: '2'
  - number: 24a.2.a
    text: |-
      indien het gemiddeld inkomen van de belanghebbende gedurende drie jaar de beslagvrije voet bedoeld in de
      [artikelen 475c][ref1] en [475d van het Wetboek van Burgerlijke Rechtsvordering][ref2] niet te boven is gegaan, de
      Sociale verzekeringsbank de aflossingsbedragen lager vaststelt; en


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel475c
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel475d
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel24a
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 475c
      - id: ref2
        bwb_id: BWBR0001827
        artikel: 475d
  - number: 24a.2.b
    text: |-
      indien degene van wie wordt teruggevorderd, dan wel degene met wie hij een huishouden vormt, kinderbijslag op grond
      van deze wet ontvangt, in afwijking van [artikel 17g, eerste lid][ref1], het besluit tot terugvordering ten uitvoer
      kan worden gelegd door verrekening met die bijslag.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel17g
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel24a
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: 17g
        hoofdstuk: III
        paragraaf: '2'
  - number: 24b
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de wijze van tenuitvoerlegging van de
      beschikking waarbij is vastgesteld dat onverschuldigd is betaald.
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel24b
  - number: 24c.1
    text: |-
      In afwijking van [artikel 24, eerste lid][ref1], kan de Sociale verzekeringsbank, op verzoek van de verzekerde,
      dan wel degene met wie hij een huishouding vormt, of de persoon aan wie op grond van de [artikelen 7c][ref2] of
      [21][ref3] kinderbijslag wordt betaald, besluiten gedeeltelijk van terugvordering of gedeeltelijk van verdere
      terugvordering af te zien bij medewerking aan een schuldregeling, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0002368#Artikel7c
      [ref3]: https://wetten.overheid.nl/BWBR0002368#Artikel21
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel24c
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '24'
        hoofdstuk: III
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0002368
        artikel: 7c
        hoofdstuk: III
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0002368
        artikel: '21'
        hoofdstuk: III
        paragraaf: '3'
  - number: 24c.1.a
    text: |-
      redelijkerwijs te voorzien is dat verzekerde, dan wel degene met wie hij een huishouding vormt, of de persoon aan
      wie op grond van de [artikelen 7c][ref1] of [21][ref2] kinderbijslag wordt betaald niet zal kunnen voortgaan met
      het betalen van zijn schulden of indien hij in de toestand verkeert dat hij heeft opgehouden te betalen;


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel7c
      [ref2]: https://wetten.overheid.nl/BWBR0002368#Artikel21
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel24c
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: 7c
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002368
        artikel: '21'
        hoofdstuk: III
        paragraaf: '3'
  - number: 24c.1.b
    text: |-
      redelijkerwijs te voorzien is dat een schuldregeling met betrekking tot alle vorderingen, behoudens de in het
      tweede lid bedoelde vorderingen, van de overige schuldeisers zonder een zodanig besluit niet tot stand zal komen;
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel24c
  - number: 24c.1.c
    text: |-
      de vordering van de Sociale verzekeringsbank wegens onverschuldigde betaling ten minste zal worden voldaan naar
      evenredigheid met de vorderingen van de schuldeisers van gelijke rang;
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel24c
  - number: 24c.1.d
    text: |-
      een naar het oordeel van de Sociale verzekeringsbank betrouwbaar voorstel voor een
      schuldregeling tot stand is gekomen door tussenkomst van een schuldhulpverlener als bedoeld in
      [artikel 48 van de Wet op het consumentenkrediet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004815#Artikel48
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel24c
    references:
      - id: ref1
        bwb_id: BWBR0004815
        artikel: '48'
  - number: 24c.1.e
    text: aannemelijk is dat medewerking aan een schuldregeling niet concurrentieverstorend werkt; en
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel24c
  - number: 24c.1.f
    text: |-
      uitdeling in het kader van de schuldregeling plaatsvindt overeenkomstig
      [artikel 349 van de Faillissementswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001860#Artikel349
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel24c
    references:
      - id: ref1
        bwb_id: BWBR0001860
        artikel: '349'
  - number: 24c.2
    text: |-
      Het eerste lid is niet van toepassing indien een vordering is ontstaan door het niet nakomen door de verzekerde,
      dan wel degene met wie hij een huishouding vormt, of de persoon aan wie op grond van [artikel 21][ref1]
      kinderbijslag wordt betaald, van de verplichting, bedoeld in [artikel 15][ref2], en hiervoor een boete als bedoeld
      in [artikel 17a][ref3] is opgelegd, dan wel met betrekking tot het niet naleven van die verplichting aangifte is
      gedaan op grond van het [Wetboek van Strafrecht][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0002368#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0002368#Artikel17a
      [ref4]: https://wetten.overheid.nl/BWBR0001854
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel24c
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '21'
        hoofdstuk: III
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0002368
        artikel: '15'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0002368
        artikel: 17a
        hoofdstuk: III
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0001854
  - number: 24c.3
    text: |-
      Het besluit tot het afzien van terugvordering of van verdere terugvordering wordt ingetrokken of ten nadele
      van de verzekerde, dan wel degene met wie hij een huishouding vormt, of de persoon aan wie op grond van de
      [artikelen 7c][ref1] of [21][ref2] kinderbijslag wordt betaald gewijzigd indien:


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel7c
      [ref2]: https://wetten.overheid.nl/BWBR0002368#Artikel21
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel24c
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: 7c
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002368
        artikel: '21'
        hoofdstuk: III
        paragraaf: '3'
  - number: 24c.3.a
    text: |-
      niet binnen twaalf maanden nadat dat besluit is bekendgemaakt, een schuldregeling tot stand is gekomen die voldoet
      aan de eisen, bedoeld in het eerste lid;
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel24c
  - number: 24c.3.b
    text: |-
      de verzekerde, dan wel degene met wie hij een huishouding vormt, of de persoon aan wie op grond van
      [artikel 21][ref1] kinderbijslag wordt betaald zijn schuld aan de Sociale verzekeringsbank niet overeenkomstig de
      schuldregeling voldoet; of


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel21
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel24c
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '21'
        hoofdstuk: III
        paragraaf: '3'
  - number: 24c.3.c
    text: |-
      onjuiste of onvolledige gegevens zijn verstrekt en de verstrekking van juiste of volledige gegevens tot een ander
      besluit zou hebben geleid.
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel24c
  - number: 24c.4
    text: |-
      Bij ministeriële regeling kunnen met betrekking tot dit artikel nadere regels worden gesteld ten aanzien van de
      bevoegdheid om mee te werken aan schuldregelingen.
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel24c
  - number: 24d
    text: |-
      Een vordering van de Sociale verzekeringsbank als bedoeld in de [artikelen 24][ref1] en [24c][ref2] is bevoorrecht
      en volgt onmiddellijk na de vorderingen, bedoeld in [artikel 288 van Boek 3 van het Burgerlijk Wetboek][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0002368#Artikel24c
      [ref3]: https://wetten.overheid.nl/BWBR0005291#Artikel288
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel24d
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '24'
        hoofdstuk: III
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0002368
        artikel: 24c
        hoofdstuk: III
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0005291
        artikel: '288'
  - number: '25.1'
    text: |-
      Indien over een tijdvak, waarover krachtens de [Wet studiefinanciering 2000][ref1] aan een kind studiefinanciering
      is verleend, naderhand ten behoeve van dat kind recht op kinderbijslag wordt vastgesteld, is de Sociale
      verzekeringsbank bevoegd die kinderbijslag over dat tijdvak en over latere tijdvakken, in plaats van aan degene
      aan wie de kinderbijslag zou dienen te worden betaald, zonder diens machtiging tot het bedrag van de betaalde
      studiefinanciering over dat tijdvak te betalen aan Onze Minister van Onderwijs, Cultuur en Wetenschap.


      [ref1]: https://wetten.overheid.nl/BWBR0011453
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0011453
  - number: '25.2'
    text: |-
      Van de in het eerste lid bedoelde bevoegdheid kan de Sociale verzekeringsbank gebruik maken tot en met twee
      kalenderjaren na de vaststelling van het recht op kinderbijslag.
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel25
  - number: '25.3'
    text: |-
      Hetgeen in het eerste en het tweede lid is bepaald ten aanzien van studiefinanciering, verleend
      krachtens de [Wet studiefinanciering 2000][ref1], is van overeenkomstige toepassing ten
      aanzien van een tegemoetkoming in de onderwijsbijdrage en de schoolkosten, verleend krachtens
      [hoofdstuk 4 van de Wet tegemoetkoming onderwijsbijdrage en schoolkosten][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011453
      [ref2]: https://wetten.overheid.nl/BWBR0012438#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0011453
      - id: ref2
        bwb_id: BWBR0012438
        hoofdstuk: '4'
  - number: '25.4'
    text: |-
      De Sociale verzekeringsbank kan aan een verzekerde ten onrechte betaalde kinderbijslag verrekenen met een
      tegemoetkoming waarop een verzekerde ten behoeve van hetzelfde kind op grond van [artikel 3, eerste lid][ref1],
      juncto [artikel 9, van de Kaderwet SZW-subsidies][ref2] en de daarop berustende bepalingen, aanspraak maakt.


      [ref1]: https://wetten.overheid.nl/BWBR0008754#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0008754#Artikel9
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0008754
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0008754
        artikel: '9'
  - number: 29a.1
    text: |-
      De Sociale verzekeringsbank beheert en administreert afzonderlijk de middelen tot dekking van de uitgaven, bedoeld
      in het derde lid, in de vorm van een Algemeen Kinderbijslagfonds dat deel uitmaakt van de Sociale verzekeringsbank,
      alsmede door de met toepassing van [artikel 17a][ref1] verkregen boeten.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel17a
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel29a
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: 17a
        hoofdstuk: III
        paragraaf: '2'
  - number: 29a.2
    text: |-
      In de middelen tot dekking van de uitgaven ten laste van het Algemeen Kinderbijslagfonds wordt voorzien
      door het Rijk, onderscheidenlijk de afdracht van de boeten, bedoeld in [artikel 17a][ref1], door de Sociale
      verzekeringsbank.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel17a
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel29a
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: 17a
        hoofdstuk: III
        paragraaf: '2'
  - number: 29a.3
    text: |-
      De ingevolge deze wet uit te keren kinderbijslagen en de aan de uitvoering van deze wet verbonden kosten komen ten
      laste van het Algemeen Kinderbijslagfonds.
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel29a
  - number: 29c.1
    text: |-
      Een beschikking op grond van deze wet en de daarop berustende bepalingen wordt gegeven binnen een redelijke termijn
      na ontvangst van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel29c
  - number: 29c.2
    text: |-
      De redelijke termijn is in ieder geval verstreken wanneer binnen acht weken na ontvangst van de aanvraag geen
      beschikking is gegeven, noch een kennisgeving als bedoeld in het derde lid is gedaan.
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel29c
  - number: 29c.3
    text: |-
      Indien een beschikking niet binnen de termijn van acht weken kan worden gegeven, wordt die termijn met een
      redelijke termijn verlengd en wordt de aanvrager daarvan schriftelijk in kennis gesteld.
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel29c
  - number: '30'
    text: |-
      In afwijking van [artikel 7:10, eerste lid, van de Algemene wet bestuursrecht][ref1] beslist de Sociale
      verzekeringsbank binnen dertien weken gerekend vanaf de dag na die waarop de termijn voor het indienen van het
      bezwaarschrift is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: '31.1'
    text: |-
      Tegen uitspraken van de Centrale Raad van Beroep kan ieder der partijen beroep in cassatie instellen ter zake van
      schending of verkeerde toepassing van het bepaalde bij of krachtens [artikel 2][ref1], [3][ref2] of [6][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002368#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0002368#Artikel6
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '2'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0002368
        artikel: '3'
        hoofdstuk: I
      - id: ref3
        bwb_id: BWBR0002368
        artikel: '6'
        hoofdstuk: II
  - number: '31.2'
    text: |-
      Op dit beroep zijn de voorschriften betreffende het beroep in cassatie tegen uitspraken van de gerechtshoven inzake
      beroepen in belastingzaken van overeenkomstige toepassing, waarbij de Centrale Raad van Beroep de plaats inneemt
      van een gerechtshof.
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel31
  - number: '36'
    text: |-
      Een gedraging die in strijd is met een krachtens deze wet uitgevaardigde algemene maatregel van bestuur, voor zover
      uitdrukkelijk als strafbaar feit in de zin van dit artikel aangeduid, wordt gestraft met hechtenis van ten hoogste
      een maand of geldboete van de tweede categorie. Het feit wordt beschouwd als een overtreding.
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel36
  - number: '41'
    text: Hetgeen nog ter uitvoering van deze wet nodig is, wordt geregeld bij ministeriële regeling.
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel41
  - number: 41a
    text: |-
      [Artikel 7][ref1], zoals dat artikel luidde op de dag voorafgaande aan de inwerkingtreding van artikel I, onderdeel
      C, van de Wet van 4 februari 2010 tot wijziging van de Algemene Kinderbijslagwet en de Algemene nabestaandenwet in
      verband met aanpassing aan de invoering van een kwalificatieplicht in de Leerplichtwet 1969 en het aanbrengen van
      een aantal vereenvoudigingen in de Algemene Kinderbijslagwet alsmede enkele andere aanpassingen van die wet (Stb.
      74) blijft van toepassing op het kind, dat op 1 oktober 2009 de leeftijd van 16 jaar heeft bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel7
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel41a
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '7'
        hoofdstuk: III
        paragraaf: '1'
  - number: 41b.1
    text: |-
      In afwijking van [artikel 12, eerste lid][ref1], geldt voor een kind dat is geboren vóór 1 januari 1995, artikel
      12, eerste tot en met vijfde lid, zoals dit op 31 december 1994 luidde.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel12
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel41b
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '12'
        hoofdstuk: III
        paragraaf: '1'
  - number: 41b.2
    text: |-
      [Artikel 13][ref1] is van overeenkomstige toepassing ten aanzien van de rangordebedragen, bedoeld in
      [artikel 12, vierde lid, onderdeel b, c en d][ref2], zoals dat artikel luidde op 31 december 1994.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0002368#Artikel12
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel41b
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '13'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002368
        artikel: '12'
        hoofdstuk: III
        paragraaf: '1'
  - number: 41b.3
    text: |-
      Bij de toepassing van het eerste lid is het rangordebedrag voor het eerste kind gelijk aan het bedrag, bedoeld in
      [artikel 12, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel12
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel41b
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '12'
        hoofdstuk: III
        paragraaf: '1'
  - number: '42'
    text: 'Deze wet kan worden aangehaald onder de titel: "Algemene Kinderbijslagwet".'
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel42
  - number: '43'
    text: |-
      De artikelen van deze wet treden in werking met ingang van een bij koninklijk besluit te bepalen tijdstip, dat voor
      de verschillende artikelen of onderdelen daarvan verschillend kan worden gesteld.
    url: https://wetten.overheid.nl/BWBR0002368/2013-01-01#Artikel43
