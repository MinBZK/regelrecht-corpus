preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is regelen vast te stellen inzake een algemene, de gehele
    bevolking omvattende, verplichte kinderbijslagverzekering;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#ArtikelAanhef
articles:
  - number: '1'
    text: 'Voor de toepassing van deze wet en van de tot haar uitvoering genomen besluiten wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel1
  - number: 1.a
    text: 'Onze Minister: Onze Minister van Sociale Zaken en Werkgelegenheid;'
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel1
  - number: 1.b
    text: |-
      lichamen: rechtspersonen, maat- en vennootschappen, samenwerkingsvormen zonder rechtspersoonlijkheid die met
      verenigingen maatschappelijk gelijk kunnen worden gesteld, ondernemingen van publiekrechtelijke rechtspersonen
      en doelvermogens;
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel1
  - number: 1.c
    text: |-
      vreemdeling: hetgeen daaronder wordt verstaan in de [Vreemdelingenwet 2000][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011823
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0011823
  - number: 1.d
    text: |-
      continentaal plat: de exclusieve economische zone van het Koninkrijk, bedoeld in
      [artikel 1 van de Rijkswet instelling exclusieve economische zone][ref1], voor zover deze grenst aan de
      territoriale zee van Nederland;


      [ref1]: https://wetten.overheid.nl/BWBR0010480#Artikel1
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0010480
        artikel: '1'
  - number: 1.e
    text: |-
      uitreiziger: persoon ten aanzien van wie op grond van een melding van de opsporingsdiensten of inlichtingen- en
      veiligheidsdiensten, gericht aan de Sociale verzekeringsbank, is gebleken dat het gegronde vermoeden bestaat dat
      deze persoon zich buiten Nederland bevindt met het doel om zich aan te sluiten bij een organisatie die is geplaatst
      op de lijst van organisaties, bedoeld in [artikel 14, vierde lid, van de Rijkswet op het Nederlanderschap][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003738#Artikel14
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003738
        artikel: '14'
  - number: '2'
    text: Ingezetene in de zin van deze wet is degene, die in Nederland woont.
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel2
  - number: '3.1'
    text: Waar iemand woont en waar een lichaam gevestigd is, wordt naar de omstandigheden beoordeeld.
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel3
  - number: '3.2'
    text: |-
      Voor de toepassing van het eerste lid worden schepen welke in Nederland hun thuishaven hebben, ten opzichte van de
      bemanning als deel van Nederland beschouwd.
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel3
  - number: '3.3'
    text: |-
      Hij die Nederland metterwoon heeft verlaten en binnen een jaar nadien metterwoon terugkeert zonder inmiddels in
      Aruba, Curaçao, Sint Maarten, de openbare lichamen Bonaire, Sint Eustatius en Saba, of op het grondgebied van een
      andere Mogendheid te hebben gewoond, wordt ook voor de duur van zijn afwezigheid geacht in Nederland te hebben
      gewoond.
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel3
  - number: '4.1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder kind: eigen kind, aangehuwd kind of pleegkind.'
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel4
  - number: '4.2'
    text: Als eigen kind wordt beschouwd het kind
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel4
  - number: 4.2.a
    text: |-
      van de vrouw die op grond van [artikel 198 van Boek 1 van het Burgerlijk Wetboek][ref1] als zijn moeder wordt
      aangemerkt;


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel198
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '198'
  - number: 4.2.b
    text: |-
      van de man die op grond van [artikel 199 van Boek 1 van het Burgerlijk Wetboek][ref1] als zijn vader wordt
      aangemerkt;


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel199
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '199'
  - number: 4.2.c
    text: |-
      van de man die op grond van [artikel 394 van Boek 1 van het Burgerlijk Wetboek][ref1] verplicht
      is bij te dragen aan de kosten van verzorging en opvoeding, tenzij het kind reeds op grond van
      [artikel 199 van Boek 1 van het Burgerlijk Wetboek][ref2] als eigen kind van een andere man wordt aangemerkt;


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel394
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel199
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '394'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '199'
  - number: 4.2.d
    text: |-
      van de man wiens biologisch vaderschap door middel van DNA-onderzoek is vastgesteld, mits de man het kind feitelijk
      in relevante mate onderhoudt en het kind niet reeds tot een andere man in een familierechtelijke vaderschapsrelatie
      staat;
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel4
  - number: 4.2.e
    text: |-
      van de man die na toepassing van Nederlands internationaal privaatrecht tot het kind in een familierechtelijke
      vaderschapsrelatie staat.
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel4
  - number: '4.3'
    text: Als pleegkind wordt beschouwd het kind dat als eigen kind wordt onderhouden en opgevoed.
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel4
  - number: '4.4'
    text: Bij ministeriële regeling kan worden bepaald in welke gevallen een kind met een pleegkind wordt gelijkgesteld.
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel4
  - number: 5a
    text: |-
      Bij een besluit ingevolge de [artikelen 14, vierde lid][ref1], en [21][ref2] is mede belanghebbende het Landelijk
      Bureau Inning Onderhoudsbijdragen.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0002368#Artikel21
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '14'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002368
        artikel: '21'
        hoofdstuk: III
        paragraaf: '3'
  - number: '6.1'
    text: Verzekerd overeenkomstig de bepalingen van deze wet is degene, die
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel6
  - number: 6.1.a
    text: ingezetene is;
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel6
  - number: 6.1.b
    text: |-
      geen ingezetene is, doch ter zake van in Nederland of op het continentaal plat in dienstbetrekking verrichte arbeid
      aan de loonbelasting is onderworpen.
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel6
  - number: '6.2'
    text: |-
      Niet verzekerd is de vreemdeling die niet rechtmatig in Nederland verblijf houdt in de zin van
      [artikel 8, onder a tot en met e en l, van de Vreemdelingenwet 2000][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: '6.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan, in afwijking van het eerste en tweede lid, uitbreiding dan wel
      beperking worden gegeven aan de kring der verzekerden.
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel6
  - number: '6.4'
    text: |-
      Bij een maatregel, als bedoeld in het derde lid, kan worden bepaald dat bij een niet rechtmatig verblijf in
      Nederland in de zin van [artikel 8, onder a tot en met e en l][ref1], verzekerd zijn:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 6.4.a
    text: vreemdelingen die rechtmatig in Nederland arbeid verrichten, dan wel hebben verricht;
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel6
  - number: 6.4.b
    text: |-
      vreemdelingen die, na rechtmatig verblijf te hebben gehouden in de zin van
      [artikel 8, onder a tot en met e en l, van de Vreemdelingenwet 2000][ref1], rechtmatig in Nederland verblijf hebben
      als bedoeld in [artikel 8, onder g of h, van de Vreemdelingenwet 2000][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 6a
    text: |-
      Zo nodig in afwijking van [artikel 6][ref1] en de daarop berustende bepalingen:


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel6
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '6'
        hoofdstuk: II
  - number: 6a.a
    text: |-
      wordt als verzekerde aangemerkt de persoon van wie de verzekering op grond van deze wet voortvloeit uit de
      toepassing van bepalingen van een verdrag of van een besluit van een volkenrechtelijke organisatie;
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel6a
  - number: 6a.b
    text: |-
      wordt voor de toepassing van [hoofdstuk 3][ref1] van deze wet onder verzekerde mede verstaan de niet-
      verzekerde persoon die recht op kinderbijslag heeft verkregen op grond van Verordening (EG) nr. 883/2004 van
      het Europees Parlement en de Raad van de Europese Unie van 29 april 2004 betreffende de coördinatie van de
      socialezekerheidsstelsels (PbEU 2004, L 166);


      [ref1]: https://wetten.overheid.nl/BWBR0002368#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0002368
        hoofdstuk: III
  - number: 6a.c
    text: |-
      wordt niet als verzekerde aangemerkt de persoon op wie op grond van een verdrag of een besluit van een
      volkenrechtelijke organisatie de wetgeving van een andere mogendheid van toepassing is.
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel6a
  - number: 6b
    text: |-
      Voor de toepassing van deze paragraaf wordt onder centrum voor topsport verstaan een voorziening waar een
      topsporter op tenminste toptalentniveau de mogelijkheid heeft op één locatie te trainen, wonen en studeren.
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel6b
  - number: '7.1'
    text: |-
      De verzekerde heeft overeenkomstig de bepalingen van deze wet recht op kinderbijslag voor een kind dat jonger is
      dan 18 jaar en dat:
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel7
  - number: 7.1.a
    text: tot zijn huishouden behoort, of
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel7
  - number: 7.1.b
    text: door hem wordt onderhouden.
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel7
  - number: '7.2'
    text: 'De verzekerde heeft voor een kind van 16 of 17 jaar slechts recht op kinderbijslag indien:'
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel7
  - number: 7.2.a
    text: |-
      de verzekerde heeft voldaan aan de verplichtingen, bedoeld in de [artikelen 2, eerste lid][ref1], en
      [4a, eerste lid, van de Leerplichtwet 1969][ref2], dan wel daarvan op grond van die wet is vrijgesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002628#Artikel4a
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0002628
        artikel: 4a
  - number: 7.2.b
    text: |-
      het kind als leerling, vavo-student of student als bedoeld in de [Wet educatie en beroepsonderwijs][ref1] van een
      met een school of instelling als bedoeld in [artikel 4a van de Leerplichtwet 1969][ref2] vergelijkbare inrichting
      van onderwijs buiten Nederland staat ingeschreven en deze inrichting geregeld bezoekt, dan wel met overeenkomstige
      toepassing van de vrijstellingsgronden van die wet van die verplichting is vrijgesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0007625
      [ref2]: https://wetten.overheid.nl/BWBR0002628#Artikel4a
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0007625
      - id: ref2
        bwb_id: BWBR0002628
        artikel: 4a
  - number: 7.2.c
    text: |-
      het kind een startkwalificatie als bedoeld in [artikel 1, onderdeel f, van de Leerplichtwet 1969][ref1] heeft
      behaald; of


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel1
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '1'
  - number: 7.2.d
    text: |-
      het kind een school of instelling als bedoeld in onderdeel b heeft afgerond op vergelijkbare wijze als bedoeld in
      onderdeel c.
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel7
  - number: '7.3'
    text: |-
      Het niet voldoen aan de verplichtingen, bedoeld in het tweede lid, onderdeel a, blijkt uit een daartoe strekkende
      mededeling van het college van burgemeester en wethouders van de gemeente waar het kind woont.
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel7
  - number: '7.4'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot het tweede en derde lid.
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel7
  - number: '7.6'
    text: |-
      Het bedrag aan kinderbijslag, bedoeld in [artikel 12, eerste en tweede lid][ref1], wordt verdubbeld indien de
      verzekerde per kalenderkwartaal een bijdrage levert aan het onderhoud van het kind die meer bedraagt dan een bij
      of krachtens algemene maatregel van bestuur te bepalen bedrag en het kind, bedoeld in het eerste lid, niet tot
      het huishouden van de verzekerde noch als eigen kind, aangehuwd kind of pleegkind tot het huishouden van een ander
      behoort:


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel12
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '12'
        hoofdstuk: III
        paragraaf: '1'
  - number: 7.6.a
    text: in verband met ziekte of gebreken van het kind; of
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel7
  - number: 7.6.b
    text: |-
      in verband met het volgen van onderwijs of een beroepsopleiding aan een school of instelling in de zin van
      [artikel 1, onder b of c, van de Leerplichtwet 1969][ref1] waar het kind staat ingeschreven of in verband met
      het volgen van onderwijs, genoemd in [artikel 4a, eerste lid, van de Leerplichtwet 1969][ref2] waar het kind
      overeenkomstig artikel 4a, eerste lid, van de Leerplichtwet 1969 staat ingeschreven of in verband met het volgen
      van onderwijs aan een vergelijkbare inrichting van onderwijs buiten Nederland waar het kind staat ingeschreven,
      waarbij:


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002628#Artikel4a
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002628
        artikel: 4a
  - number: 7.6.b.1°
    text: |-
      de verzekerde aantoont dat het kind een bij ministeriële regeling te bepalen beroepsopleiding volgt of als
      toptalent op het gebied van dans en muziek dan wel als topsporter op tenminste toptalentniveau een bij ministeriële
      regeling te bepalen school bezoekt voor het volgen van voortgezet onderwijs of een opleiding volgt in het
      voorbereidend beroepsonderwijs of in het beroepsonderwijs en als topsporter op tenminste toptalentniveau een
      opleiding bij een bij ministeriële regeling te bepalen centrum voor topsport volgt waardoor de afstand tussen het
      woonadres van de verzekerde of het woonadres van de ander tot wiens huishouden het kind laatstelijk behoorde en de
      dichtstbijzijnde instelling of school waar de beroepsopleiding of het voortgezet onderwijs wordt aangeboden meer
      bedraagt dan een bij ministeriële regeling te bepalen aantal kilometers; of
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel7
  - number: 7.6.b.2°
    text: de verzekerde een bij of krachtens algemene maatregel van bestuur te bepalen beroep uitoefent; of
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel7
  - number: 7.6.b.3°
    text: |-
      de verzekerde of de ander tot wiens huishouden het kind laatstelijk behoorde in een bij of krachtens algemene
      maatregel van bestuur te bepalen deel van Nederland woont, of de verzekerde aantoont dat hij of die ander in een
      gebied buiten Nederland woont waarbij niet verwacht kan worden dat het kind op basis van openbaar of eigen vervoer
      dagelijks heen en weer reist tussen school en het adres van de verzekerde of die ander; of
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel7
  - number: 7.6.b.4°
    text: |-
      het het kind betreft van de verzekerde, bedoeld in [artikel 7b, vierde lid, onderdelen a en b][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel7b
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: 7b
        hoofdstuk: III
        paragraaf: '1'
  - number: 7.6.b.5°
    text: |-
      de verzekerde aantoont dat het kind een bij ministeriële regeling te bepalen school bezoekt waarbij de afstand
      tussen het woonadres van de verzekerde of het woonadres van de ander tot wiens huishouden het kind laatstelijk
      behoorde en de dichtstbijzijnde school waar het onderwijs wordt aangeboden meer bedraagt dan een bij ministeriële
      regeling te bepalen aantal kilometers, met dien verstande dat de afstandseis niet geldt als het kind verplicht
      is gedurende het schooljaar meer dan drie nachten per kalenderweek op een aan de school gelieerde locatie te
      overnachten.
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel7
  - number: '7.7'
    text: |-
      Indien de beroepsopleiding of de school, bedoeld in het zesde lid, onderdeel b, onder 1°, niet langer is
      opgenomen in de ministeriële regeling, bedoeld in het zesde lid, onderdeel b, onder 1°, dan wel indien gedurende
      de beroepsopleiding of het voortgezet onderwijs, bedoeld in het zesde lid, onderdeel b, onder 1°, een gelijke
      opleiding of school in die ministeriële regeling wordt opgenomen die valt binnen de afstand, bedoeld in het zesde
      lid, onderdeel b, onder 1°, blijft de verdubbeling van de kinderbijslag, bedoeld in het zesde lid, van toepassing
      tot de dag waarop het kind de opleiding of het onderwijs, bedoeld in het zesde lid, onderdeel b, onder 1°, niet
      langer volgt.
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel7
  - number: '7.8'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot het eerste lid,
      onderdeel b, en het zesde lid.
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel7
  - number: '7.9'
    text: |-
      Voor de toepassing van dit artikel wordt het kind geacht het onderwijs of de beroepsopleiding eerst na de vakantie
      te hebben beëindigd, indien:
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel7
  - number: 7.9.a
    text: |-
      het onderwijs of de beroepsopleiding wordt beëindigd tijdens een door de Minister van Onderwijs, Cultuur en
      Wetenschap, de school of instelling vastgestelde vakantie, dan wel
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel7
  - number: 7.9.b
    text: |-
      het onderwijs of de beroepsopleiding wordt afgesloten met een eindexamen, dat kort voor het begin van de laatste
      door de Minister van Cultuur, Onderwijs en Wetenschap, de school of instelling vastgestelde vakantie van het
      desbetreffende schooljaar wordt afgelegd.
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel7
  - number: '7.10'
    text: 'In afwijking van het zesde lid, onderdeel b, sub 1°, is het woord «dichtstbijzijnde» niet van toepassing wanneer:'
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel7
  - number: 7.10.a
    text: |-
      het kind een beroepsopleiding volgt aan een niet uit ’s Rijks kas bekostigde instelling als bedoeld in
      [artikel 1.4.1 van de Wet educatie en beroepsonderwijs][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
  - number: 7.10.b
    text: |-
      het kind een beroepsopleiding volgt aan een uit ’s Rijks kas bekostigde instelling als bedoeld in
      [artikel 1.1.1 van de Wet educatie en beroepsonderwijs][ref1] en de dichtstbijzijnde instelling een niet uit ’s
      Rijks kas bekostigde instelling is als bedoeld in [artikel 1.4.1 van de Wet educatie en beroepsonderwijs][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '1'
  - number: 7a.1
    text: |-
      Een verzekerde heeft voor een tot zijn huishouden behorend kind dat drie jaar is of ouder, maar nog niet de
      leeftijd van 18 jaar heeft bereikt, recht op een verdubbeling van het bedrag aan kinderbijslag, genoemd in
      [artikel 12, eerste en tweede lid][ref1], indien het kind is aangewezen op een bij of krachtens algemene maatregel
      van bestuur te bepalen mate van intensieve zorg.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel12
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '12'
        hoofdstuk: III
        paragraaf: '1'
  - number: 7a.2
    text: |-
      Indien een verzekerde over een kalenderjaar tot uitbetaling gekomen recht heeft gehad op een verdubbeling van het
      bedrag aan kinderbijslag op grond van het eerste lid, en
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel7a
  - number: 7a.2.a
    text: |-
      met betrekking tot dat kalenderjaar, dan wel een gedeelte daarvan, geen partner heeft als bedoeld in
      [artikel 1.2 van de Wet inkomstenbelasting 2001][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel1
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '1'
  - number: 7a.2.b
    text: |-
      met betrekking tot dat kalenderjaar een partner heeft als bedoeld in
      [artikel 1.2 van de Wet inkomstenbelasting 2001][ref1] en de verzekerde of diens partner
      in dat kalenderjaar belastbare winst uit een of meer ondernemingen als bedoeld in
      [artikel 3.2 van de Wet inkomstenbelasting 2001][ref2], belastbaar loon als bedoeld in
      [artikel 3.80 van de Wet inkomstenbelasting 2001][ref3] of belastbaar resultaat uit een of meer werkzaamheden als
      bedoeld in [artikel 3.90 van de Wet inkomstenbelasting 2001][ref4] heeft genoten dat niet meer is dan het bedrag,
      genoemd in [artikel 8.14a, eerste lid, onderdeel a, van de Wet inkomstenbelasting 2001][ref5];


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0011353#Artikel8
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref5
        bwb_id: BWBR0011353
        artikel: '8'
  - number: 7a.3
    text: |-
      Indien een verzekerde of diens partner voldoet aan de voorwaarden, bedoeld in het tweede lid, en recht heeft op
      meer dan eenmaal de verdubbeling van de kinderbijslag, bedoeld in het eerste lid, heeft hij dan wel zijn partner
      recht op ten hoogste eenmaal het extra bedrag aan kinderbijslag, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel7a
  - number: 7a.4
    text: |-
      Indien twee personen die voor eenzelfde kind recht hebben op kinderbijslag als bedoeld in het eerste lid, dit
      kind op basis van een overeenkomst of rechterlijke beschikking overwegend in gelijke mate verzorgen en onderhouden
      zonder met elkaar een gemeenschappelijke huishouding te voeren, is voor de beoordeling van het recht op het extra
      bedrag aan kinderbijslag, bedoeld in het tweede lid, de situatie, bedoeld in het tweede lid, onderdeel a of b, van
      de ouder wiens recht op kinderbijslag wordt uitbetaald, bepalend.
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel7a
  - number: 7a.5
    text: |-
      Bij het uitvoeren van de verdubbeling van het bedrag aan kinderbijslag, bedoeld in het eerste lid, kan de Sociale
      verzekeringsbank gezondheidsgegevens uitwisselen en verwerken.
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel7a
  - number: 7a.6
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot het eerste, tweede
      en vijfde lid.
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel7a
  - number: 7b.1
    text: |-
      Geen recht op kinderbijslag heeft de verzekerde ten behoeve van het kind, indien dat kind op de eerste dag van een
      kalenderkwartaal niet in Nederland woont.
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel7b
  - number: 7b.2
    text: |-
      Het eerste lid is niet van toepassing indien dat kind op de eerste dag van een kalenderkwartaal woont in een land
      waarin ten behoeve van hem op grond van verordening (EG) nr. 883/2004 van het Europees Parlement en de Raad van
      29 april 2004 betreffende de coördinatie van de socialezekerheidsstelsels (PbEU L 166) recht op kinderbijslag
      bestaat.
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel7b
  - number: 7b.3
    text: |-
      Het eerste lid is niet van toepassing indien het kind op de eerste dag van een kalenderkwartaal niet in Nederland
      woont doch langer dan drie maanden onafgebroken in Nederland verblijft.
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel7b
  - number: 7b.4
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan worden bepaald dat ten behoeve van het kind dat op de eerste
      dag van een kalenderkwartaal niet in Nederland woont, recht bestaat op kinderbijslag voor:
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel7b
  - number: 7b.4.a
    text: de verzekerde, die werkzaamheden verricht in het algemeen belang en niet in Nederland woont;
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel7b
  - number: 7b.4.b
    text: |-
      de verzekerde, die in Aruba, Curaçao, Sint Maarten of in de openbare lichamen Bonaire, Sint Eustatius en Saba
      woont; of
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel7b
  - number: 7b.4.c
    text: de gezinsleden van de in de onderdelen a of b bedoelde verzekerde.
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel7b
  - number: 7d.1
    text: Geen recht op kinderbijslag overeenkomstig de bepalingen van deze wet heeft de verzekerde die een uitreiziger is.
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel7d
  - number: 7d.2
    text: |-
      De verzekerde heeft geen recht op kinderbijslag overeenkomstig de bepalingen van deze wet voor een kind dat een
      uitreiziger is.
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel7d
  - number: '11.1'
    text: |-
      Recht op kinderbijslag voor een kind ingevolge deze wet heeft slechts degene, die op de eerste dag van een
      kalenderkwartaal verzekerd is.
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel11
  - number: '11.2'
    text: |-
      Recht op kinderbijslag over een kalenderkwartaal voor een kind bestaat indien op de eerste dag van dat
      kalenderkwartaal is voldaan aan de voorwaarden, bedoeld in [artikel 7][ref1], en, indien van toepassing,
      [artikel 7a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002368#Artikel7a
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '7'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002368
        artikel: 7a
        hoofdstuk: III
        paragraaf: '1'
  - number: '11.3'
    text: |-
      Recht op kinderbijslag voor een kind ingevolge deze wet heeft slechts degene, die op de eerste dag van een
      kalenderkwartaal verzekerd is en na toepassing van [artikel 7d][ref1] niet langer het gegronde vermoeden bestaat
      dat hij of het kind zich buiten Nederland bevindt met het doel om zich aan te sluiten bij een organisatie als
      bedoeld in [artikel 1, onderdeel e][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel7d
      [ref2]: https://wetten.overheid.nl/BWBR0002368#Artikel1
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: 7d
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002368
        artikel: '1'
        hoofdstuk: I
  - number: '12.1'
    text: Het basiskinderbijslagbedrag over een kalenderkwartaal bedraagt € 399,27 per kind.
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel12
  - number: '12.2'
    text: |-
      Het basiskinderbijslagbedrag en het extra bedrag aan kinderbijslag, bedoeld in [artikel 7a, tweede lid][ref1],
      bedraagt voor een kind dat woont buiten Nederland, een van de andere lidstaten van de Europese Unie, een andere
      staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte en Zwitserland, een bij
      ministeriële regeling vastgesteld percentage van het bedrag, genoemd in het eerste lid, respectievelijk artikel 7a,
      tweede lid. Het percentage wordt zo bepaald dat het een weergave is van de verhouding tussen het kostenniveau van
      het land waar het kind woonachtig is en dat van Nederland. Het percentage bedraagt maximaal 100.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel7a
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: 7a
        hoofdstuk: III
        paragraaf: '1'
  - number: '12.3'
    text: |-
      Het aan een verzekerde over een kalenderkwartaal te betalen bedrag aan kinderbijslag bedraagt voor een kind, dat op
      de eerste dag van dat kwartaal:
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel12
  - number: 12.3.a
    text: 'jonger is dan 6 jaar: € 279,49'
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel12
  - number: 12.3.b
    text: '6 jaar of ouder, maar jonger is dan 12 jaar: € 339,38 en'
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel12
  - number: 12.3.c
    text: '12 jaar en ouder, maar jonger is dan 18 jaar: € 399,27'
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel12
  - number: '12.4'
    text: |-
      De kinderbijslag op grond van het derde lid, onderdelen b en c, wordt betaald zonder dat dit bij beschikking is
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel12
  - number: '12.5'
    text: |-
      Het tweede lid is niet van toepassing indien het kind op de eerste dag van een kalenderkwartaal niet in Nederland
      woont doch langer dan drie maanden onafgebroken in Nederland verblijft.
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel12
  - number: '13.1'
    text: |-
      De bedragen, genoemd in de [artikelen 7a, tweede lid][ref1], en [12, eerste lid][ref2], worden al naar gelang de
      ontwikkeling van het algemene prijsniveau verhoogd of verlaagd.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel7a
      [ref2]: https://wetten.overheid.nl/BWBR0002368#Artikel12
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: 7a
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002368
        artikel: '12'
        hoofdstuk: III
        paragraaf: '1'
  - number: '13.2'
    text: |-
      Het bedrag, genoemd in [artikel 7a, tweede lid][ref1], wordt telkens gewijzigd met ingang van 1 januari. Bij een
      wijziging met ingang van 1 januari wordt dit bedrag verhoogd of verlaagd met hetzelfde percentage, als waarmee
      de consumentenprijsindex over de maand oktober daaraan voorafgaande, naar boven of naar beneden afwijkt van de
      consumentenprijsindex, waarop de laatste wijziging is gebaseerd. Het gewijzigde bedrag wordt door of namens Onze
      Minister medegedeeld in de Staatscourant. In afwijking van de eerste zin blijft wijziging per 1 januari achterwege,
      indien de consumentenprijsindex over de maand oktober daaraan voorafgaande geen afwijking vertoont ten opzichte van
      de consumentenprijsindex, waarop de laatste wijziging is gebaseerd.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel7a
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: 7a
        hoofdstuk: III
        paragraaf: '1'
  - number: '13.3'
    text: |-
      Het bedrag, genoemd in [artikel 12, eerste lid][ref1], wordt telkens gewijzigd met ingang van 1 januari
      en 1 juli. Bij een wijziging met ingang van 1 januari onderscheidenlijk 1 juli wordt dit bedrag verhoogd
      of verlaagd met hetzelfde percentage, al waarmede de consumentenprijsindex over de maand oktober daaraan
      voorafgaande onderscheidenlijk over de maand april daaraan voorafgaande, naar boven of naar beneden afwijkt van
      de consumentenprijsindex, waarop de laatste wijziging is gebaseerd. Het gewijzigde bedrag wordt door of namens
      Onze Minister medegedeeld in de Staatscourant. In afwijking van de eerste zin blijft wijziging per 1 januari
      onderscheidenlijk per 1 juli achterwege, indien de consumentenprijsindex over de maand oktober onderscheidenlijk
      over de maand april daaraan voorafgaande geen afwijking vertoont ten opzichte van de consumentenprijsindex, waarop
      de laatste wijziging is gebaseerd.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel12
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '12'
        hoofdstuk: III
        paragraaf: '1'
  - number: '13.4'
    text: |-
      Het overeenkomstig het tweede lid en derde lid gewijzigde bedrag treedt in de plaats van het bedrag, genoemd in
      [artikel 7a, tweede][ref1], respectievelijk [artikel 12, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel7a
      [ref2]: https://wetten.overheid.nl/BWBR0002368#Artikel12
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: 7a
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002368
        artikel: '12'
        hoofdstuk: III
        paragraaf: '1'
  - number: '13.5'
    text: |-
      Indien daartoe naar Ons oordeel een bijzondere aanleiding bestaat, kan het bedrag, genoemd in
      [artikel 7a, tweede lid][ref1], of [artikel 12, eerste lid][ref2], bij algemene maatregel van bestuur met ingang
      van een bij die algemene maatregel van bestuur aan te geven datum worden verhoogd. De op grond van de vorige zin
      verhoogde bedragen treden in de plaats van de bedragen, genoemd in artikel 7a, tweede lid, respectievelijk artikel
      12, eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel7a
      [ref2]: https://wetten.overheid.nl/BWBR0002368#Artikel12
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: 7a
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002368
        artikel: '12'
        hoofdstuk: III
        paragraaf: '1'
  - number: '13.6'
    text: |-
      Indien een verhoging als bedoeld in het vijfde lid samenvalt met een wijziging als bedoeld in het tweede lid of het
      derde lid, wordt het bedrag voorafgaande aan de verhoging gewijzigd en geschiedt de wijziging, in afwijking van het
      tweede lid en derde lid, bij de in het vijfde lid bedoelde algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel13
  - number: '13.7'
    text: |-
      Hetgeen onder consumentenprijsindex als bedoeld in het tweede en derde lid wordt verstaan, wordt nader bij algemene
      maatregel van bestuur geregeld.
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel13
  - number: '13.8'
    text: |-
      Indien het bedrag, genoemd in [artikel 12, eerste lid][ref1], wordt gewijzigd, worden de uit de toepassing van
      artikel 12, derde lid, met betrekking tot dat bedrag voortvloeiende bedragen, samen met de dag waarop de wijziging
      ingaat, door of namens Onze Minister medegedeeld in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel12
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '12'
        hoofdstuk: III
        paragraaf: '1'
  - number: '13.9'
    text: |-
      Een wijziging van de kinderbijslag op grond van dit artikel vindt plaats zonder dat dit bij beschikking is
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel13
  - number: '13.10'
    text: |-
      De Sociale verzekeringsbank betaalt de gewijzigde kinderbijslag, bedoeld in het negende lid, bij de eerstvolgende
      betaling van de kinderbijslag nadat de wijziging, bedoeld in het tweede dan wel derde lid, heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel13
  - number: '14.1'
    text: |-
      De Sociale verzekeringsbank stelt op aanvraag vast of een recht op kinderbijslag bestaat. De aanvraag om het
      extra bedrag aan kinderbijslag, bedoeld in [artikel 7a, tweede lid][ref1], wordt ingediend voor 1 december van het
      kalenderjaar na het kalenderjaar waarover recht op het extra bedrag aan kinderbijslag bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel7a
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: 7a
        hoofdstuk: III
        paragraaf: '1'
  - number: '14.2'
    text: |-
      Een aanvraag wordt ingediend door middel van een door de Sociale verzekeringsbank beschikbaar gesteld
      aanvraagformulier. Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot
      de verder bij de aanvraag te verstrekken gegevens.
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel14
  - number: '14.3'
    text: |-
      Het recht op kinderbijslag kan niet vroeger ingaan dan een jaar voorafgaand aan de eerste dag van het
      kalenderkwartaal tijdens welk de aanvraag om kinderbijslag werd ingediend. Het recht op kinderbijslag, bedoeld in
      [artikel 7a, eerste lid][ref1], kan niet vroeger ingaan dan de eerste dag van het kalenderkwartaal tijdens welk de
      aanvraag om kinderbijslag als bedoeld in artikel 7a, eerste lid, werd ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel7a
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: 7a
        hoofdstuk: III
        paragraaf: '1'
  - number: '14.4'
    text: |-
      Indien de verzekerde nalaat een aanvraag om kinderbijslag in te dienen, kan deze aanvraag worden ingediend door het
      Landelijk Bureau Inning Onderhoudsbijdragen, dat tevens adviseert aan wie de kinderbijslag wordt betaald.
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel14
  - number: 14a.1
    text: |-
      Onverminderd het elders in deze wet bepaalde terzake van herziening of intrekking van een besluit tot toekenning
      van kinderbijslag en terzake van weigering van kinderbijslag, herziet de Sociale verzekeringsbank een dergelijk
      besluit of trekt zij dat in:
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel14a
  - number: 14a.1.a
    text: |-
      indien het niet of niet behoorlijk nakomen van een verplichting op grond van [artikel 15][ref1] of [16][ref2] heeft
      geleid tot het ten onrechte of tot een te hoog bedrag verlenen van kinderbijslag;


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002368#Artikel16
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '15'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002368
        artikel: '16'
        hoofdstuk: III
        paragraaf: '2'
  - number: 14a.1.b
    text: indien anderszins de kinderbijslag ten onrechte of tot een te hoog bedrag is verleend;
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel14a
  - number: 14a.1.c
    text: |-
      indien het niet of niet behoorlijk nakomen van een verplichting op grond van [artikel 15][ref1] of [16][ref2] ertoe
      leidt dat niet kan worden vastgesteld of nog recht op kinderbijslag bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002368#Artikel16
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '15'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002368
        artikel: '16'
        hoofdstuk: III
        paragraaf: '2'
  - number: 14a.2
    text: |-
      Indien daarvoor dringende redenen aanwezig zijn kan de Sociale verzekeringsbank besluiten geheel of gedeeltelijk
      van herziening of intrekking als bedoeld in het eerste lid af te zien.
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel14a
  - number: 14a.3
    text: |-
      Indien de verzekerde of de persoon aan wie of de instelling waaraan op grond van [artikel 21][ref1] kinderbijslag
      wordt betaald niet op grond van [artikel 15a][ref2] desgevraagd aantoont dat is voldaan aan artikel 15a, eerste
      lid, onderdelen a en b, en als gevolg hiervan niet kan worden vastgesteld tot wiens huishouden het kind behoort,
      wordt het recht op kinderbijslag vastgesteld, herzien of ingetrokken en het recht op kinderbijslag geldend gemaakt
      overeenkomstig [hoofdstuk III, paragraaf 1][ref3] en [2][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0002368#Artikel15a
      [ref3]: https://wetten.overheid.nl/BWBR0002368#HoofdstukIII
      [ref4]: https://wetten.overheid.nl/BWBR0002368#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '21'
        hoofdstuk: III
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0002368
        artikel: 15a
        hoofdstuk: III
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0002368
        hoofdstuk: III
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0002368
        hoofdstuk: III
        paragraaf: '2'
  - number: '15.1'
    text: |-
      De verzekerde, alsmede de persoon aan wie of de instelling waaraan op grond van [artikel 21][ref1] kinderbijslag
      wordt betaald, zijn verplicht aan de Sociale verzekeringsbank op haar verzoek of onverwijld uit eigen beweging alle
      feiten en omstandigheden mee te delen, waarvan hem of haar redelijkerwijs duidelijk moet zijn dat zij van invloed
      kunnen zijn op het recht op kinderbijslag, de hoogte van de kinderbijslag, het geldend maken van het recht op
      kinderbijslag of op het bedrag van de kinderbijslag, dat wordt betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel21
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '21'
        hoofdstuk: III
        paragraaf: '3'
  - number: '15.2'
    text: |-
      De verplichting van het eerste lid geldt niet indien: die feiten en omstandigheden door de Sociale verzekeringsbank
      kunnen worden vastgesteld op grond van bij wettelijk voorschrift als authentiek aangemerkte gegevens of kunnen
      worden verkregen uit bij ministeriële regeling aan te wijzen administraties. Bij ministeriële regeling wordt
      bepaald voor welke gegevens dit onderdeel van toepassing is.
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel15
  - number: 15a.1
    text: |-
      In aanvulling op [artikel 15][ref1] kan de Sociale verzekeringsbank de verzekerde of de persoon aan wie of de
      instelling waaraan op grond van [artikel 21][ref2] kinderbijslag wordt betaald verzoeken aan te tonen dat:


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002368#Artikel21
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '15'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002368
        artikel: '21'
        hoofdstuk: III
        paragraaf: '3'
  - number: 15a.1.a
    text: |-
      ten aanzien van een kind als bedoeld in [artikel 7, eerste lid, onderdeel a, en tweede lid][ref1], wordt voldaan
      aan de voorwaarden, gesteld in artikel 7, eerste lid, onderdeel a, en tweede lid, of


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel7
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '7'
        hoofdstuk: III
        paragraaf: '1'
  - number: 15a.1.b
    text: |-
      een kind als bedoeld in [artikel 7, zesde lid][ref1], niet tot het huishouden van de verzekerde noch tot het
      huishouden van een ander behoort.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel7
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '7'
        hoofdstuk: III
        paragraaf: '1'
  - number: 15a.2
    text: |-
      Teneinde de verzekerde of de persoon aan wie of de instelling waaraan op grond van [artikel 21][ref1] kinderbijslag
      wordt betaald daartoe in de gelegenheid te stellen, kan de Sociale verzekeringsbank bij dit verzoek aanbieden
      met de toestemming van de verzekerde of de bewoner van de woning waar het kind woont, de woning van verzekerde
      onderscheidenlijk de woning waar het kind woont binnen te treden.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel21
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '21'
        hoofdstuk: III
        paragraaf: '3'
  - number: 15a.3
    text: |-
      Indien door het ontbreken van toestemming van de bewoner niet kan worden vastgesteld tot wiens huishouden het kind
      behoort, heeft dit gevolgen voor het recht op en het geldend maken van het recht op kinderbijslag.
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel15a
  - number: '16.1'
    text: |-
      De Sociale verzekeringsbank is bevoegd controlevoorschriften vast te stellen. Deze voorschriften mogen niet verder
      gaan dan strikt noodzakelijk is voor een juiste uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel16
  - number: '16.2'
    text: |-
      De verzekerde, alsmede de persoon aan wie of de instelling waaraan op grond van [artikel 21][ref1] kinderbijslag
      wordt betaald, zijn verplicht de voorschriften op te volgen en anderszins aan de Sociale verzekeringsbank
      desgevraagd de medewerking te verlenen die redelijkerwijs nodig is voor de uitvoering van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel21
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '21'
        hoofdstuk: III
        paragraaf: '3'
  - number: '16.3'
    text: |-
      De verzekerde, alsmede de persoon aan wie op grond van [artikel 21][ref1] kinderbijslag wordt betaald, onthouden
      zich van zeer ernstige misdragingen jegens de met de uitvoering van deze wet belaste personen en instanties tijdens
      het verrichten van hun werkzaamheden.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel21
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '21'
        hoofdstuk: III
        paragraaf: '3'
  - number: '17.1'
    text: |-
      De Sociale verzekeringsbank weigert de kinderbijslag tijdelijk of blijvend, geheel of gedeeltelijk
      indien de verzekerde of de persoon aan wie op grond van [artikel 21][ref1] kinderbijslag wordt
      betaald, een verplichting op grond van [artikel 16][ref2] opgelegd, of de verplichting, bedoeld in
      [artikel 55, tweede lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref3], niet of niet
      behoorlijk is nagekomen, dan wel de verplichting, bedoeld in [artikel 15][ref4] niet binnen de door de Sociale
      verzekeringsbank daarvoor vastgestelde termijn is nagekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0002368#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Artikel55
      [ref4]: https://wetten.overheid.nl/BWBR0002368#Artikel15
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '21'
        hoofdstuk: III
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0002368
        artikel: '16'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0013060
        artikel: '55'
      - id: ref4
        bwb_id: BWBR0002368
        artikel: '15'
        hoofdstuk: III
        paragraaf: '2'
  - number: '17.2'
    text: |-
      Een maatregel als bedoeld in het eerste lid wordt afgestemd op de ernst van de gedraging en de mate waarin de
      verzekerde dan wel de persoon aan wie op grond van [artikel 21][ref1] kinderbijslag wordt betaald, de gedraging
      verweten kan worden. Van het opleggen van een maatregel wordt in elk geval afgezien, indien elke vorm van
      verwijtbaarheid ontbreekt.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel21
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '21'
        hoofdstuk: III
        paragraaf: '3'
  - number: '17.3'
    text: |-
      De Sociale verzekeringsbank kan afzien van het opleggen van een maatregel als bedoeld in het eerste lid en volstaan
      met het geven van een schriftelijke waarschuwing ter zake van het niet tijdig nakomen van de verplichting, bedoeld
      in [artikel 15][ref1], indien het niet tijdig nakomen van de verplichting niet heeft geleid tot het ten onrechte of
      tot een te hoog bedrag verlenen van kinderbijslag, tenzij het niet tijdig nakomen van de verplichting plaatsvindt
      binnen een periode van twee jaar te rekenen vanaf de datum waarop eerder aan de verzekerde, of de persoon aan wie
      op grond van [artikel 21][ref2] kinderbijslag wordt betaald, een zodanige waarschuwing is gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002368#Artikel21
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '15'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002368
        artikel: '21'
        hoofdstuk: III
        paragraaf: '3'
  - number: '17.4'
    text: |-
      De Sociale verzekeringsbank kan afzien van het opleggen van een maatregel indien daarvoor dringende redenen
      aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel17
  - number: '17.5'
    text: |-
      Het opleggen van een maatregel blijft achterwege indien voor dezelfde gedraging een bestuurlijke boete als bedoeld
      in [artikel 17a][ref1] wordt opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel17a
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: 17a
        hoofdstuk: III
        paragraaf: '2'
  - number: '17.6'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot het eerste en
      tweede lid.
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel17
  - number: 17a.1
    text: |-
      De Sociale verzekeringsbank legt een bestuurlijke boete op van ten hoogste het benadelingsbedrag wegens het
      niet of niet behoorlijk nakomen door de verzekerde, of de persoon aan wie op grond van [artikel 21][ref1]
      kinderbijslag wordt betaald, van de verplichting, bedoeld in [artikel 15][ref2]. Indien de feiten en
      omstandigheden, bedoeld in artikel 15, niet of niet behoorlijk zijn medegedeeld en deze overtreding opzettelijk
      is begaan, bedraagt de bestuurlijke boete ten hoogste het bedrag van de vijfde categorie, bedoeld in
      [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref3]. Indien de feiten en omstandigheden, bedoeld in
      artikel 15, niet of niet behoorlijk zijn medegedeeld en deze overtreding niet opzettelijk is begaan, bedraagt
      de bestuurlijke boete ten hoogste het bedrag van de derde categorie, bedoeld in artikel 23, vierde lid, van het
      Wetboek van Strafrecht.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0002368#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel23
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '21'
        hoofdstuk: III
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0002368
        artikel: '15'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0001854
        artikel: '23'
  - number: 17a.2
    text: |-
      In dit artikel wordt onder benadelingsbedrag verstaan het brutobedrag dat als gevolg van het niet of niet
      behoorlijk nakomen van de verplichting, bedoeld in [artikel 15][ref1], ten onrechte of tot een te hoog bedrag aan
      kinderbijslag is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel15
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '15'
        hoofdstuk: III
        paragraaf: '2'
  - number: 17a.3
    text: |-
      Indien het niet of niet behoorlijk nakomen door de verzekerde, of de persoon aan wie op grond van
      [artikel 21][ref1] kinderbijslag wordt betaald, van de verplichting, bedoeld in [artikel 15][ref2], niet heeft
      geleid tot een benadelingsbedrag, legt de Sociale verzekeringsbank een bestuurlijke boete op van ten hoogste het
      bedrag van de tweede categorie, bedoeld in [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0002368#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel23
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '21'
        hoofdstuk: III
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0002368
        artikel: '15'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0001854
        artikel: '23'
  - number: 17a.4
    text: |-
      De Sociale verzekeringsbank kan afzien van het opleggen van een bestuurlijke boete en volstaan met het geven
      van een schriftelijke waarschuwing wegens het niet of niet behoorlijk nakomen van de verplichting, bedoeld in
      [artikel 15][ref1], in situaties die bij algemene maatregel van bestuur worden bepaald, tenzij het niet of niet
      behoorlijk nakomen van de verplichting plaats vindt binnen een periode van twee jaar te rekenen vanaf de datum
      waarop eerder aan de verzekerde, of aan de persoon aan wie op grond van [artikel 21][ref2] kinderbijslag wordt
      betaald, een zodanige waarschuwing is gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002368#Artikel21
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '15'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002368
        artikel: '21'
        hoofdstuk: III
        paragraaf: '3'
  - number: 17a.5
    text: |-
      De Sociale verzekeringsbank legt een bestuurlijke boete op wegens het niet of niet behoorlijk nakomen door de
      verzekerde, of de persoon aan wie op grond van [artikel 21][ref1] kinderbijslag wordt betaald, van de verplichting,
      bedoeld in [artikel 15][ref2], als gevolg waarvan ten onrechte of tot een te hoog bedrag aan kinderbijslag is
      ontvangen, van ten hoogste 150 procent van het benadelingsbedrag, met overeenkomstige toepassing van het eerste
      lid, indien binnen een tijdvak van vijf jaar voorafgaand aan de dag van het begaan van de overtreding een eerdere
      bestuurlijke boete of strafrechtelijke sanctie is opgelegd wegens een eerdere overtreding, bestaande uit eenzelfde
      gedraging, die onherroepelijk is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0002368#Artikel15
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '21'
        hoofdstuk: III
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0002368
        artikel: '15'
        hoofdstuk: III
        paragraaf: '2'
  - number: 17a.6
    text: |-
      In afwijking van het vijfde lid is het in dat lid genoemde tijdvak van vijf jaar tien jaar indien wegens de eerdere
      overtreding, bedoeld in het vijfde lid, de verzekerde, of de persoon aan wie op grond van [artikel 21][ref1]
      kinderbijslag wordt betaald, is gestraft met een onvoorwaardelijke gevangenisstraf.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel21
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '21'
        hoofdstuk: III
        paragraaf: '3'
  - number: 17a.7
    text: |-
      De Sociale verzekeringsbank kan afzien van het opleggen van een bestuurlijke boete indien daarvoor dringende
      redenen aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel17a
  - number: 17a.8
    text: |-
      Degene aan wie een bestuurlijke boete is opgelegd, is verplicht desgevraagd aan de Sociale verzekeringsbank de
      inlichtingen te verstrekken die voor de tenuitvoerlegging van de bestuurlijke boete van belang zijn.
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel17a
  - number: 17a.9
    text: Bij algemene maatregel van bestuur worden nadere regels gesteld over de hoogte van de bestuurlijke boete.
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel17a
  - number: 17a.10
    text: |-
      In afwijking van [artikel 8:69 van de Algemene wet bestuursrecht][ref1] kan de rechter in beroep of hoger beroep
      het bedrag waarop de bestuurlijke boete is vastgesteld ook ten nadele van de verzekerde, dan wel de persoon aan wie
      op grond van [artikel 21][ref2] kinderbijslag wordt betaald, wijzigen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002368#Artikel21
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0002368
        artikel: '21'
        hoofdstuk: III
        paragraaf: '3'
  - number: 17a.11
    text: |-
      Indien ten aanzien van een overtreding waarvoor een bestuurlijke boete is opgelegd geen sprake is geweest van opzet
      of grove schuld, en voorts is gebleken dat binnen een jaar nadat de bestuurlijke boete is opgelegd niet nogmaals
      een overtreding wegens eenzelfde gedraging is begaan, is de Sociale verzekeringsbank bevoegd op verzoek van degene
      aan wie de bestuurlijke boete is opgelegd, de bestuurlijke boete geheel of gedeeltelijk kwijt te schelden bij
      medewerking aan een schuldregeling. [Artikel 24c, eerste, derde en vierde lid][ref1], is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel24c
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: 24c
        hoofdstuk: III
        paragraaf: '3'
  - number: 17a.12
    text: |-
      Het besluit tot kwijtschelding, bedoeld in het elfde lid, wordt ingetrokken of ten nadele van degene aan wie
      de bestuurlijke boete is opgelegd herzien indien binnen vijf jaar na het besluit tot kwijtschelding wederom een
      overtreding wegens eenzelfde gedraging is begaan.
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel17a
  - number: 17c
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld omtrent de termijn waarvoor uitstel van
      betaling van de bestuurlijke boete kan worden verleend alsmede omtrent de hoogte van het op grond van
      [artikel 17g, eerste of tweede lid][ref1], te verrekenen bedrag en de termijn of termijnen waarbinnen deze
      verrekening plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel17g
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel17c
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: 17g
        hoofdstuk: III
        paragraaf: '2'
  - number: 17g.1
    text: |-
      De Sociale verzekeringsbank verrekent de bestuurlijke boete en een eerdere bestuurlijke boete wegens
      eenzelfde gedraging als bedoeld in [artikel 17a, vijfde lid][ref1], met kinderbijslag op grond van deze
      wet, ouderdomspensioen op grond van de [Algemene Ouderdomswet][ref2] of een uitkering op grond van de
      [Algemene nabestaandenwet][ref3], die degene aan wie een bestuurlijke boete is opgelegd, dan wel degene met wie hij
      een huishouden vormt, ontvangt.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel17a
      [ref2]: https://wetten.overheid.nl/BWBR0002221
      [ref3]: https://wetten.overheid.nl/BWBR0007795
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel17g
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: 17a
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002221
      - id: ref3
        bwb_id: BWBR0007795
  - number: 17g.2
    text: |-
      Onverminderd het eerste lid kan de Sociale verzekeringsbank de bestuurlijke boete verrekenen met een vordering die
      degene aan wie de bestuurlijke boete is opgelegd op hem heeft.
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel17g
  - number: 17g.3
    text: |-
      Het college van burgemeester en wethouders van de betrokken gemeente, onderscheidenlijk het Uitvoeringsinstituut
      werknemersverzekeringen, betaalt het bedrag van de bestuurlijke boete, zonder dat daarvoor een machtiging nodig
      is, op haar verzoek aan de Sociale verzekeringsbank indien degene aan wie een bestuurlijke boete is opgelegd,
      dan wel degene met wie hij een huishouden vormt, een uitkering ontvangt op grond van de [Participatiewet][ref1],
      de [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref2],
      de [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref3],
      de [Wet inkomensvoorziening oudere werklozen][ref4], de [Werkloosheidswet][ref5], de
      [Ziektewet][ref6], de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref7], de Wet
      arbeidsongeschiktheidsvoorziening jonggehandicapten, de [Wet werk en inkomen naar arbeidsvermogen][ref8], de
      [Wet op de arbeidsongeschiktheidsverzekering][ref9] of de [Wet arbeid en zorg][ref10] of een toeslag op grond van
      de [Toeslagenwet][ref11].


      [ref1]: https://wetten.overheid.nl/BWBR0015703
      [ref2]: https://wetten.overheid.nl/BWBR0004044
      [ref3]: https://wetten.overheid.nl/BWBR0004163
      [ref4]: https://wetten.overheid.nl/BWBR0024394
      [ref5]: https://wetten.overheid.nl/BWBR0004045
      [ref6]: https://wetten.overheid.nl/BWBR0001888
      [ref7]: https://wetten.overheid.nl/BWBR0008656
      [ref8]: https://wetten.overheid.nl/BWBR0019057
      [ref9]: https://wetten.overheid.nl/BWBR0002524
      [ref10]: https://wetten.overheid.nl/BWBR0013008
      [ref11]: https://wetten.overheid.nl/BWBR0004043
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel17g
    references:
      - id: ref1
        bwb_id: BWBR0015703
      - id: ref2
        bwb_id: BWBR0004044
      - id: ref3
        bwb_id: BWBR0004163
      - id: ref4
        bwb_id: BWBR0024394
      - id: ref5
        bwb_id: BWBR0004045
      - id: ref6
        bwb_id: BWBR0001888
      - id: ref7
        bwb_id: BWBR0008656
      - id: ref8
        bwb_id: BWBR0019057
      - id: ref9
        bwb_id: BWBR0002524
      - id: ref10
        bwb_id: BWBR0013008
      - id: ref11
        bwb_id: BWBR0004043
  - number: 17g.4
    text: |-
      De in [artikel 479g van het Wetboek van Burgerlijke Rechtsvordering][ref1] aan de raad voor de kinderbescherming
      toegekende bevoegdheid komt gelijkelijk toe aan de Sociale verzekeringsbank. Indien de Sociale verzekeringsbank
      gebruik maakt van deze bevoegdheid, geschiedt de bekendmaking van het dwangbevel, in afwijking van
      [artikel 4:123, eerste lid, van de Algemene wet bestuursrecht][ref2], door middel van toezending per post aan
      degene aan wie de boete is opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel479g
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel17g
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 479g
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 17g.5
    text: |-
      Zolang de verzekerde en degene met wie hij een huishouden vormt, dan wel de persoon aan wie op grond van
      [artikel 21][ref1] kinderbijslag wordt betaald, zijn verplichting als bedoeld in [artikel 17a, achtste lid][ref2],
      niet of niet behoorlijk nakomt:


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0002368#Artikel17a
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel17g
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '21'
        hoofdstuk: III
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0002368
        artikel: 17a
        hoofdstuk: III
        paragraaf: '2'
  - number: 17g.5.a
    text: |-
      is de Sociale verzekeringsbank, in afwijking van
      [artikel 4:93, vierde lid, van de Algemene wet bestuursrecht][ref1], bevoegd tot verrekening van de bestuurlijke
      boete voor zover beslag op de vordering van de schuldeiser nietig zou zijn;


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel17g
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 17g.5.b
    text: |-
      geldt de beslagvrije voet, bedoeld in de
      [artikelen 475c tot en met 475e van het Wetboek van Burgerlijke Rechtsvordering][ref1], in afwijking van
      [artikel 4:116 van de Algemene wet bestuursrecht][ref2], niet bij de invordering van een bestuurlijke boete bij
      dwangbevel.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel475c
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel17g
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 475c
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '18.1'
    text: |-
      De Sociale verzekeringsbank betaalt de kinderbijslag en het extra bedrag aan kinderbijslag, bedoeld in
      [artikel 7a, tweede lid][ref1], zo spoedig mogelijk, doch uiterlijk binnen drie maanden na afloop van het kwartaal
      waarover recht op kinderbijslag bestaat, respectievelijk binnen drie maanden na indiening van de aanvraag, bedoeld
      in [artikel 14, eerste lid, tweede zin][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel7a
      [ref2]: https://wetten.overheid.nl/BWBR0002368#Artikel14
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: 7a
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002368
        artikel: '14'
        hoofdstuk: III
        paragraaf: '2'
  - number: '18.2'
    text: |-
      Indien twee personen, die gezamenlijk een huishouden vormen, over eenzelfde tijdvak recht op kinderbijslag voor
      eenzelfde kind hebben, wordt de kinderbijslag uitbetaald aan degene van hen die zij gezamenlijk daartoe hebben
      aangewezen.
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel18
  - number: '18.3'
    text: |-
      Bij gebreke van een gezamenlijke aanwijzing als bedoeld in het tweede lid bepaalt de Sociale verzekeringsbank aan
      welke persoon de kinderbijslag wordt uitbetaald.
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel18
  - number: '18.4'
    text: |-
      Indien twee of meer personen waaronder één persoon tot wiens huishouden het kind behoort, over eenzelfde tijdvak
      recht op kinderbijslag voor eenzelfde kind hebben, wordt de kinderbijslag waarop degene recht heeft, tot wiens
      huishouden dit kind niet behoort, niet betaald.
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel18
  - number: '18.5'
    text: |-
      Indien twee of meer personen over eenzelfde tijdvak recht hebben op kinderbijslag voor eenzelfde kind, in andere
      situaties dan bedoeld in het tweede en vierde lid, wordt betaald de kinderbijslag waarop degene recht heeft die de
      hoogste bijdrage in het onderhoud van dit kind levert. Aan de andere personen wordt geen kinderbijslag uitbetaald.
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel18
  - number: '18.6'
    text: |-
      Indien de persoon aan wie op grond van het vierde of vijfde lid kinderbijslag zou moeten worden betaald indien
      hij een aanvraag zou hebben ingediend, geen aanvraag heeft ingediend, wordt de kinderbijslag, in afwijking van
      het vierde en vijfde lid, betaald aan de persoon die daartoe wel een aanvraag heeft ingediend. Indien de persoon,
      bedoeld in de eerste zin, die geen aanvraag heeft ingediend, alsnog een aanvraag indient, wordt de kinderbijslag
      aan hem betaald na afloop van het kalenderkwartaal waarin de aanvraag is ingediend, mits de aanvraag in de eerste
      twee maanden van dat kalenderkwartaal is ingediend. Indien de aanvraag, bedoeld in de tweede zin, is ingediend
      in de laatste maand van een kalenderkwartaal dan wordt de kinderbijslag aan hem betaald na afloop van het
      kalenderkwartaal volgend op het kalenderkwartaal waarin de aanvraag is ingediend.
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel18
  - number: '18.7'
    text: |-
      Bij algemene maatregel van bestuur kunnen met betrekking tot situaties van samenloop, bedoeld in het tweede, vierde
      en vijfde lid, nadere en aanvullende regels worden gesteld waarbij bepaald kan worden dat aan een ander persoon de
      kinderbijslag wordt uitbetaald dan de persoon, bedoeld in het vierde en vijfde lid.
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel18
  - number: '18.8'
    text: |-
      De kinderbijslag die op grond van het tweede tot en met vijfde en zevende lid aan een verzekerde wordt betaald, kan
      op verzoek van die verzekerde in gedeelten aan meer verzekerden worden betaald.
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel18
  - number: '18.9'
    text: |-
      Indien de kinderbijslag in het buitenland wordt uitbetaald, geschiedt de betaling in afwijking van
      [artikel 4:89, derde lid, van de Algemene wet bestuursrecht][ref1] op het tijdstip waarop de rekening van de
      daartoe door de schuldeiser aangewezen bank wordt gecrediteerd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '19'
    text: |-
      De Sociale verzekeringsbank schort de betaling van de kinderbijslag op of schorst de betaling, indien zij op grond
      van duidelijke aanwijzingen van oordeel is of het gegronde vermoeden heeft, dat:
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel19
  - number: 19.a
    text: het recht op kinderbijslag niet of niet meer bestaat;
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel19
  - number: 19.b
    text: recht op een lagere kinderbijslag bestaat, of
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel19
  - number: 19.c
    text: |-
      de verzekerde, alsmede de persoon aan wie of de instelling aan welke op grond van [artikel 21][ref1] kinderbijslag
      wordt betaald, een verplichting hem of haar op grond van de [artikelen 15][ref2], [15a, eerste lid][ref3], en
      [16][ref4] opgelegd, niet is nagekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0002368#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0002368#Artikel15a
      [ref4]: https://wetten.overheid.nl/BWBR0002368#Artikel16
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '21'
        hoofdstuk: III
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0002368
        artikel: '15'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0002368
        artikel: 15a
        hoofdstuk: III
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0002368
        artikel: '16'
        hoofdstuk: III
        paragraaf: '2'
  - number: 19a.1
    text: |-
      De Sociale verzekeringsbank schort de betaling van de kinderbijslag op, indien blijkt dat het door de verzekerde
      verstrekte adres van hemzelf of van zijn kind afwijkt van het adres waaronder de verzekerde of het kind in de
      basisregistratie personen staat ingeschreven.
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel19a
  - number: 19a.2
    text: 'Geen opschorting vindt plaats:'
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel19a
  - number: 19a.2.a
    text: indien de afwijking redelijkerwijs geen gevolgen kan hebben voor het recht op of de hoogte van de kinderbijslag;
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel19a
  - number: 19a.2.b
    text: indien de belanghebbende van de afwijking redelijkerwijs geen verwijt kan worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel19a
  - number: 19a.3
    text: De Sociale verzekeringsbank doet schriftelijk mededeling van de opschorting aan de verzekerde.
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel19a
  - number: 19a.4
    text: |-
      De opschorting wordt beëindigd zodra het aan de Sociale verzekeringsbank gebleken is dat de afwijking niet meer
      bestaat.
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel19a
  - number: '20'
    text: |-
      Indien voor hetzelfde kind kinderbijslag of een naar aard en strekking daarmee overeenkomende gezinsbijslag is
      betaald, dan wel kan worden betaald ingevolge deze wet en ingevolge een rechtens geldende regeling, bestaande in
      een ander land, of ingevolge een regeling van een volkenrechtelijke organisatie, kunnen bij ministeriële regeling
      regels worden gesteld ter voorkoming, verrekening en beperking van samenloop met dergelijke gezinsbijslagen of ter
      voorkoming van dubbele kinderbijslag.
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel20
  - number: '21'
    text: |-
      De Sociale verzekeringsbank is bevoegd, voor zover nodig na ingewonnen advies van het Landelijk Bureau Inning
      Onderhoudsbijdragen de kinderbijslag voor een kind te betalen aan een ander dan de rechthebbende.
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel21
  - number: '22'
    text: |-
      De kinderbijslag die niet in ontvangst is genomen of is ingevorderd binnen drie maanden na de dag van
      betaalbaarstelling, wordt niet meer betaald. De Sociale verzekeringsbank is bevoegd in bijzondere gevallen ten
      gunste van degene aan wie de kinderbijslag wordt betaald af te wijken van de in de eerste volzin genoemde drie
      maanden.
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel22
  - number: '23.1'
    text: 'De kinderbijslag is:'
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel23
  - number: 23.1.a
    text: onvervreemdbaar;
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel23
  - number: 23.1.b
    text: niet vatbaar voor verpanding of belening;
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel23
  - number: 23.1.c
    text: |-
      behoudens voor zoveel dit dient tot verhaal van een uitkering tot levensonderhoud van het kind, of tot
      terugvordering van onverschuldigd betaalde kinderbijslag als bedoeld in [artikel 24][ref1], niet vatbaar
      voor executoriaal of conservatoir beslag noch voor beslag ingevolge faillissement of toepassing van de
      schuldsaneringsregeling natuurlijke personen.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel24
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '24'
        hoofdstuk: III
        paragraaf: '3'
  - number: '23.2'
    text: |-
      Volmacht tot ontvangst van kinderbijslag, onder welke vorm of welke benaming ook door de verzekerde verleend, is
      steeds herroepelijk.
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel23
  - number: '23.3'
    text: Elk beding, strijdig met enige bepaling van dit artikel, is nietig.
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel23
  - number: '24.1'
    text: |-
      De kinderbijslag die als gevolg van een besluit als bedoeld in [artikel 14a][ref1] onverschuldigd is betaald,
      alsmede hetgeen anderszins onverschuldigd is betaald, wordt door de Sociale verzekeringsbank van de verzekerde, dan
      wel degene met wie hij een huishouding vormt, of de persoon aan wie op grond van [artikel 21][ref2] kinderbijslag
      wordt betaald, teruggevorderd.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel14a
      [ref2]: https://wetten.overheid.nl/BWBR0002368#Artikel21
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: 14a
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002368
        artikel: '21'
        hoofdstuk: III
        paragraaf: '3'
  - number: '24.2'
    text: |-
      In afwijking van het eerste lid kan de Sociale verzekeringsbank besluiten van terugvordering of van verdere
      terugvordering af te zien, indien de verzekerde, dan wel degene met wie hij een huishouding vormt, of de persoon
      aan wie op grond van [artikel 21][ref1] kinderbijslag wordt betaald:


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel21
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '21'
        hoofdstuk: III
        paragraaf: '3'
  - number: 24.2.a
    text: gedurende vijf jaar volledig aan zijn betalingsverplichtingen heeft voldaan;
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel24
  - number: 24.2.b
    text: |-
      gedurende vijf jaar niet volledig aan zijn betalingsverplichtingen heeft voldaan, maar het achterstallige bedrag
      over die periode, vermeerderd met de daarover verschuldigde wettelijke rente en de op de invordering betrekking
      hebbende kosten, alsnog heeft betaald;
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel24
  - number: 24.2.c
    text: |-
      gedurende vijf jaar geen betalingen heeft verricht en niet aannemelijk is dat hij deze op enig moment zal gaan
      verrichten; of
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel24
  - number: 24.2.d
    text: een bedrag, overeenkomend met ten minste 50% van de restsom in één keer aflost.
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel24
  - number: '24.3'
    text: |-
      De in het tweede lid, onderdelen a, b en c, genoemde termijn is tien jaar indien de terugvordering het gevolg is
      van het niet of niet behoorlijk nakomen van de verplichting, bedoeld in [artikel 15][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel15
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '15'
        hoofdstuk: III
        paragraaf: '2'
  - number: '24.4'
    text: 'De in het tweede lid, onder a en b, genoemde termijn is drie jaar indien:'
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel24
  - number: 24.4.a
    text: |-
      het gemiddeld inkomen van de belanghebbende in die periode de beslagvrije voet bedoeld in de
      [artikelen 475c tot en met 475e van het Wetboek van Burgerlijke Rechtsvordering][ref1] niet te boven is gegaan; en


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel475c
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 475c
  - number: 24.4.b
    text: |-
      de terugvordering niet het gevolg is van het niet of niet behoorlijk nakomen van de verplichting, bedoeld in
      [artikel 15][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel15
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '15'
        hoofdstuk: III
        paragraaf: '2'
  - number: '24.5'
    text: |-
      Indien daarvoor dringende redenen aanwezig zijn kan de Sociale verzekeringsbank besluiten geheel of gedeeltelijk
      van terugvordering af te zien.
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel24
  - number: '24.6'
    text: |-
      Degene van wie wordt teruggevorderd is verplicht desgevraagd aan de Sociale verzekeringsbank de inlichtingen te
      verstrekken die voor de terugvordering van belang zijn.
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel24
  - number: '24.7'
    text: |-
      In afwijking van het eerste lid kan de Sociale verzekeringsbank, onder voorwaarden die Onze Minister kan stellen,
      besluiten van terugvordering af te zien indien het terug te vorderen bedrag een door Onze Minister vast te stellen
      bedrag niet te boven gaat.
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel24
  - number: 24a.1
    text: |-
      De Sociale verzekeringsbank kan de onverschuldigd betaalde kinderbijslag, bedoeld in
      [artikel 24, eerste lid][ref1], invorderen bij dwangbevel.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel24
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel24a
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '24'
        hoofdstuk: III
        paragraaf: '3'
  - number: 24a.2
    text: |-
      [Artikel 17g][ref1] is van overeenkomstige toepassing, met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel17g
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel24a
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: 17g
        hoofdstuk: III
        paragraaf: '2'
  - number: 24a.2.a
    text: |-
      indien het gemiddeld inkomen van de belanghebbende gedurende drie jaar de beslagvrije voet bedoeld in de
      [artikelen 475c tot en met 475e van het Wetboek van Burgerlijke Rechtsvordering][ref1] niet te boven is gegaan, de
      Sociale verzekeringsbank de aflossingsbedragen lager vaststelt; en


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel475c
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel24a
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 475c
  - number: 24a.2.b
    text: |-
      indien degene van wie wordt teruggevorderd, dan wel degene met wie hij een huishouden vormt, kinderbijslag op grond
      van deze wet ontvangt, in afwijking van [artikel 17g, eerste lid][ref1], het besluit tot terugvordering ten uitvoer
      kan worden gelegd door verrekening met die bijslag.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel17g
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel24a
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: 17g
        hoofdstuk: III
        paragraaf: '2'
  - number: 24b
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de wijze van tenuitvoerlegging van de
      beschikking waarbij is vastgesteld dat onverschuldigd is betaald.
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel24b
  - number: 24c.1
    text: |-
      In afwijking van [artikel 24, eerste lid][ref1], kan de Sociale verzekeringsbank, op verzoek van de verzekerde, dan
      wel degene met wie hij een huishouding vormt, of de persoon aan wie op grond van [artikel 21][ref2] kinderbijslag
      wordt betaald, besluiten gedeeltelijk van terugvordering of gedeeltelijk van verdere terugvordering af te zien bij
      medewerking aan een schuldregeling, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0002368#Artikel21
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel24c
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '24'
        hoofdstuk: III
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0002368
        artikel: '21'
        hoofdstuk: III
        paragraaf: '3'
  - number: 24c.1.a
    text: |-
      redelijkerwijs te voorzien is dat verzekerde, dan wel degene met wie hij een huishouding vormt, of de persoon aan
      wie op grond van [artikel 21][ref1] kinderbijslag wordt betaald niet zal kunnen voortgaan met het betalen van zijn
      schulden of indien hij in de toestand verkeert dat hij heeft opgehouden te betalen;


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel21
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel24c
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '21'
        hoofdstuk: III
        paragraaf: '3'
  - number: 24c.1.b
    text: |-
      redelijkerwijs te voorzien is dat een schuldregeling met betrekking tot alle vorderingen, behoudens de in het
      tweede lid bedoelde vorderingen, van de overige schuldeisers zonder een zodanig besluit niet tot stand zal komen;
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel24c
  - number: 24c.1.c
    text: |-
      een naar het oordeel van de Sociale verzekeringsbank betrouwbaar voorstel voor een
      schuldregeling tot stand is gekomen door tussenkomst van een schuldhulpverlener als bedoeld in
      [artikel 48 van de Wet op het consumentenkrediet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004815#Artikel48
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel24c
    references:
      - id: ref1
        bwb_id: BWBR0004815
        artikel: '48'
  - number: 24c.1.d
    text: aannemelijk is dat medewerking aan een schuldregeling niet concurrentieverstorend werkt; en
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel24c
  - number: 24c.1.e
    text: |-
      uitdeling in het kader van de schuldregeling plaatsvindt overeenkomstig
      [artikel 349 van de Faillissementswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001860#Artikel349
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel24c
    references:
      - id: ref1
        bwb_id: BWBR0001860
        artikel: '349'
  - number: 24c.2
    text: |-
      Het eerste lid is niet van toepassing indien een vordering is ontstaan door het opzettelijk of door grove schuld
      niet nakomen door de verzekerde, dan wel degene met wie hij een huishouding vormt, of de persoon aan wie op grond
      van [artikel 21][ref1] kinderbijslag wordt betaald, van de verplichting, bedoeld in [artikel 15][ref2], en hiervoor
      een boete als bedoeld in [artikel 17a][ref3] is opgelegd, dan wel met betrekking tot het niet naleven van die
      verplichting aangifte is gedaan op grond van het [Wetboek van Strafrecht][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0002368#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0002368#Artikel17a
      [ref4]: https://wetten.overheid.nl/BWBR0001854
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel24c
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '21'
        hoofdstuk: III
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0002368
        artikel: '15'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0002368
        artikel: 17a
        hoofdstuk: III
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0001854
  - number: 24c.3
    text: |-
      Het besluit tot het afzien van terugvordering of van verdere terugvordering wordt ingetrokken of ten nadele van de
      verzekerde, dan wel degene met wie hij een huishouding vormt, of de persoon aan wie op grond van [artikel 21][ref1]
      kinderbijslag wordt betaald gewijzigd indien:


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel21
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel24c
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '21'
        hoofdstuk: III
        paragraaf: '3'
  - number: 24c.3.a
    text: |-
      niet binnen twaalf maanden nadat dat besluit is bekendgemaakt, een schuldregeling tot stand is gekomen die voldoet
      aan de eisen, bedoeld in het eerste lid;
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel24c
  - number: 24c.3.b
    text: |-
      de verzekerde, dan wel degene met wie hij een huishouding vormt, of de persoon aan wie op grond van
      [artikel 21][ref1] kinderbijslag wordt betaald zijn schuld aan de Sociale verzekeringsbank niet overeenkomstig de
      schuldregeling voldoet; of


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel21
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel24c
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '21'
        hoofdstuk: III
        paragraaf: '3'
  - number: 24c.3.c
    text: |-
      onjuiste of onvolledige gegevens zijn verstrekt en de verstrekking van juiste of volledige gegevens tot een ander
      besluit zou hebben geleid.
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel24c
  - number: 24c.4
    text: |-
      Bij ministeriële regeling kunnen met betrekking tot dit artikel nadere regels worden gesteld ten aanzien van de
      bevoegdheid om mee te werken aan schuldregelingen.
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel24c
  - number: 24d
    text: |-
      Een vordering van de Sociale verzekeringsbank als bedoeld in de [artikelen 24][ref1] en [24c][ref2] is bevoorrecht
      en volgt onmiddellijk na de vorderingen, bedoeld in [artikel 288 van Boek 3 van het Burgerlijk Wetboek][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0002368#Artikel24c
      [ref3]: https://wetten.overheid.nl/BWBR0005291#Artikel288
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel24d
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '24'
        hoofdstuk: III
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0002368
        artikel: 24c
        hoofdstuk: III
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0005291
        artikel: '288'
  - number: 29a.1
    text: |-
      De Sociale verzekeringsbank beheert en administreert afzonderlijk de middelen tot dekking van de uitgaven, bedoeld
      in het derde lid, in de vorm van een Algemeen Kinderbijslagfonds dat deel uitmaakt van de Sociale verzekeringsbank,
      alsmede door de met toepassing van [artikel 17a][ref1] verkregen boeten.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel17a
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel29a
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: 17a
        hoofdstuk: III
        paragraaf: '2'
  - number: 29a.2
    text: |-
      In de middelen tot dekking van de uitgaven ten laste van het Algemeen Kinderbijslagfonds wordt voorzien
      door het Rijk, onderscheidenlijk de afdracht van de boeten, bedoeld in [artikel 17a][ref1], door de Sociale
      verzekeringsbank.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel17a
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel29a
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: 17a
        hoofdstuk: III
        paragraaf: '2'
  - number: 29a.3
    text: |-
      De ingevolge deze wet uit te keren kinderbijslagen en de aan de uitvoering van deze wet verbonden kosten komen ten
      laste van het Algemeen Kinderbijslagfonds.
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel29a
  - number: 29c.1
    text: |-
      Een beschikking op grond van deze wet en de daarop berustende bepalingen wordt gegeven binnen een redelijke termijn
      na ontvangst van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel29c
  - number: 29c.2
    text: |-
      De redelijke termijn is in ieder geval verstreken wanneer binnen acht weken na ontvangst van de aanvraag geen
      beschikking is gegeven, noch een kennisgeving als bedoeld in het derde lid is gedaan.
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel29c
  - number: 29c.3
    text: |-
      Indien een beschikking niet binnen de termijn van acht weken kan worden gegeven, wordt die termijn met een
      redelijke termijn verlengd en wordt de aanvrager daarvan schriftelijk in kennis gesteld.
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel29c
  - number: '30'
    text: |-
      In afwijking van [artikel 7:10, eerste lid, van de Algemene wet bestuursrecht][ref1] beslist de Sociale
      verzekeringsbank binnen dertien weken gerekend vanaf de dag na die waarop de termijn voor het indienen van het
      bezwaarschrift is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: '31.1'
    text: |-
      Tegen uitspraken van de Centrale Raad van Beroep kan ieder der partijen beroep in cassatie instellen ter zake van
      schending of verkeerde toepassing van het bepaalde bij of krachtens [artikel 2][ref1], [3][ref2] of [6][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002368#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0002368#Artikel6
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '2'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0002368
        artikel: '3'
        hoofdstuk: I
      - id: ref3
        bwb_id: BWBR0002368
        artikel: '6'
        hoofdstuk: II
  - number: '31.2'
    text: |-
      Op dit beroep zijn de voorschriften betreffende het beroep in cassatie tegen uitspraken van de gerechtshoven inzake
      beroepen in belastingzaken van overeenkomstige toepassing, waarbij de Centrale Raad van Beroep de plaats inneemt
      van een gerechtshof.
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel31
  - number: '36'
    text: |-
      Een gedraging die in strijd is met een krachtens deze wet uitgevaardigde algemene maatregel van
      bestuur, voor zover uitdrukkelijk als strafbaar feit in de zin van dit artikel aangeduid, wordt
      gestraft met hechtenis van ten hoogste een maand of geldboete van de tweede categorie, bedoeld in
      [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref1]. Het feit wordt beschouwd als een overtreding.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel23
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '23'
  - number: '41'
    text: Hetgeen nog ter uitvoering van deze wet nodig is, wordt geregeld bij ministeriële regeling.
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel41
  - number: 41a
    text: |-
      [Artikel 7a, tweede lid][ref1], zoals dat luidde op de dag voorafgaand aan de inwerkingtreding van
      [artikel I, onderdeel B, van de Verzamelwet SZW 2018][ref2], blijft van toepassing op een recht op een extra bedrag
      aan kinderbijslag over het kalenderjaar voorafgaand aan het kalenderjaar waarin artikel I, onderdeel B, van de
      Verzamelwet SZW 2018 in werking is getreden.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel7a
      [ref2]: https://wetten.overheid.nl/BWBR0040370#ArtikelI
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel41a
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: 7a
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0040370
        artikel: I
  - number: 41b.1
    text: |-
      Op de persoon die op grond van een verdrag, de voorlopige toepassing van een verdrag dan wel een daarmee gelijk te
      stellen situatie in afwijking van [artikel 7b][ref1] recht heeft op kinderbijslag en wiens recht op kinderbijslag
      uitsluitend zou eindigen als gevolg van de opzegging of wijziging van dat verdrag, de beëindiging van de voorlopige
      toepassing van dat verdrag dan wel de beëindiging van een daarmee gelijk te stellen situatie, blijft artikel 7b
      gedurende de eerste twee kalenderkwartalen vanaf de buitenwerkingtreding van het verdrag, de inwerkingtreding van
      de desbetreffende wijziging respectievelijk de beëindiging van de voorlopige toepassing of de beëindiging van de
      daarmee gelijk te stellen situatie buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel7b
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel41b
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: 7b
        hoofdstuk: III
        paragraaf: '1'
  - number: 41b.2
    text: |-
      Het eerste lid blijft van toepassing zolang het kind op de eerste dag van de in dat lid bedoelde kalenderkwartalen
      woont in hetzelfde land als waar hij op de eerste dag van het daaraan voorafgaande kalenderkwartaal woonde en de
      verzekerde blijft voldoen aan de overige voorwaarden voor het recht op kinderbijslag.
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel41b
  - number: 41b.3
    text: |-
      Onze Minister deelt mede ten aanzien van welk land, met inbegrip van de dag waarop, een verdrag als bedoeld in
      het eerste lid zodanig is gewijzigd dat niet langer in afwijking van [artikel 7b][ref1] recht op kinderbijslag
      kan bestaan, een verdrag als bedoeld in het eerste lid buitenwerking is getreden als gevolg van opzegging dan wel
      de voorlopige toepassing van een verdrag of een daarmee gelijk te stellen situatie als bedoeld in het eerste lid
      is beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel7b
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel41b
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: 7b
        hoofdstuk: III
        paragraaf: '1'
  - number: '42'
    text: 'Deze wet kan worden aangehaald onder de titel: "Algemene Kinderbijslagwet".'
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel42
  - number: '43'
    text: |-
      De artikelen van deze wet treden in werking met ingang van een bij koninklijk besluit te bepalen tijdstip, dat voor
      de verschillende artikelen of onderdelen daarvan verschillend kan worden gesteld.
    url: https://wetten.overheid.nl/BWBR0002368/2024-01-25#Artikel43
