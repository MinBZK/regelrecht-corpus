  - number: '14'
    text: |-
      1 De Sociale verzekeringsbank stelt:

      a. op aanvraag vast of een recht op kinderbijslag bestaat;

      b. op aanvraag of, indien informatie is verschaft door het Centrum Indicatiestelling zorg, als bedoeld in [artikel
      9.1.3a, eerste lid, van de Wet langdurige zorg](onbekend), ambtshalve op basis daarvan vast of een recht op een
      verdubbeling van het bedrag aan kinderbijslag als bedoeld in [artikel 7a, eerste lid][ref1], bestaat; en

      c. op aanvraag vast of een recht op het extra bedrag aan kinderbijslag, bedoeld in [artikel 7a, tweede lid][ref2],
      bestaat.

      2 Een aanvraag wordt ingediend door middel van een door de Sociale verzekeringsbank beschikbaar gesteld
      aanvraagformulier. Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot
      de verder bij de aanvraag te verstrekken gegevens.

      3 De aanvraag om het extra bedrag aan kinderbijslag, bedoeld in [artikel 7a, tweede lid][ref3], wordt ingediend
      voor 1 december van het kalenderjaar na het kalenderjaar waarover het recht op het extra bedrag aan kinderbijslag
      bestaat.

      4 Indien de verzekerde nalaat een aanvraag om kinderbijslag in te dienen, kan deze aanvraag worden ingediend door
      het Landelijk Bureau Inning Onderhoudsbijdragen, dat tevens adviseert aan wie de kinderbijslag wordt betaald.

      5 Het recht op kinderbijslag of een verdubbeling van het bedrag aan kinderbijslag, als bedoeld in
      [artikel 7a, eerste lid][ref4], gaat niet eerder in dan:

      a. indien het kinderbijslag betreft, een jaar voorafgaand aan de eerste dag van het kalenderkwartaal waarin de
      aanvraag om kinderbijslag werd ingediend; of

      b. indien het een verdubbeling van het bedrag aan kinderbijslag, als bedoeld in [artikel 7a, eerste lid][ref5],
      betreft, zes maanden voorafgaand aan de eerste dag van het kalenderkwartaal:

      1°. waarin de aanvraag om een verdubbeling van het bedrag aan kinderbijslag werd ingediend; of

      2°. waarin het recht op zorg aanvangt op grond van het indicatiebesluit, bedoeld in
      [artikel 3.2.3 van de Wet langdurige zorg][ref6], indien het recht op een verdubbeling van het bedrag aan
      kinderbijslag ambtshalve wordt vastgesteld op basis van de informatie, bedoeld in het eerste lid, onderdeel b.


