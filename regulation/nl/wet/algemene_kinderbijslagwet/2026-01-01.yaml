  - number: '12'
    text: |-
      1 Het basiskinderbijslagbedrag over een kalenderkwartaal bedraagt € 421,53 per kind.

      2 Het basiskinderbijslagbedrag en het extra bedrag aan kinderbijslag, bedoeld in [artikel 7a, tweede lid][ref1],
      bedraagt voor een kind dat woont buiten Nederland, een van de andere lidstaten van de Europese Unie, een andere
      staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte en Zwitserland, een bij
      ministeriële regeling vastgesteld percentage van het bedrag, genoemd in het eerste lid, respectievelijk artikel 7a,
      tweede lid. Het percentage wordt zo bepaald dat het een weergave is van de verhouding tussen het kostenniveau van
      het land waar het kind woonachtig is en dat van Nederland. Het percentage bedraagt maximaal 100.

      3 Het aan een verzekerde over een kalenderkwartaal te betalen bedrag aan kinderbijslag bedraagt voor een kind, dat
      op de eerste dag van dat kwartaal:

      a. jonger is dan 6 jaar: € 295,07

      b. 6 jaar of ouder, maar jonger is dan 12 jaar: € 358,30 en

      c. 12 jaar en ouder, maar jonger is dan 18 jaar: € 421,53

      van het op grond van het eerste en tweede lid vastgestelde basiskinderbijslagbedrag.

      4 De kinderbijslag op grond van het derde lid, onderdelen b en c, wordt betaald zonder dat dit bij beschikking
      is vastgesteld.

      5 Het tweede lid is niet van toepassing indien het kind op de eerste dag van een kalenderkwartaal niet in Nederland
      woont doch langer dan drie maanden onafgebroken in Nederland verblijft.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel7a
