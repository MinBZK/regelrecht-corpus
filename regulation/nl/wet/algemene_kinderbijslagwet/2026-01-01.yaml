  - number: 17g
    text: |-
      1 De Sociale verzekeringsbank verrekent de bestuurlijke boete en een eerdere bestuurlijke boete wegens
      eenzelfde gedraging als bedoeld in [artikel 17a, vijfde lid][ref1], met kinderbijslag op grond van deze
      wet, ouderdomspensioen op grond van de [Algemene Ouderdomswet][ref2] of een uitkering op grond van de
      [Algemene nabestaandenwet][ref3], die degene aan wie een bestuurlijke boete is opgelegd, dan wel degene met wie hij
      een huishouden vormt, ontvangt.

      2 Onverminderd het eerste lid kan de Sociale verzekeringsbank de bestuurlijke boete verrekenen met een vordering
      die degene aan wie de bestuurlijke boete is opgelegd op hem heeft.

      3 Het college van burgemeester en wethouders van de betrokken gemeente, onderscheidenlijk het Uitvoeringsinstituut
      werknemersverzekeringen, betaalt het bedrag van de bestuurlijke boete, zonder dat daarvoor een machtiging nodig
      is, op haar verzoek aan de Sociale verzekeringsbank indien degene aan wie een bestuurlijke boete is opgelegd,
      dan wel degene met wie hij een huishouden vormt, een uitkering ontvangt op grond van de [Participatiewet][ref4],
      de [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref5],
      de [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref6],
      de [Wet inkomensvoorziening oudere werklozen][ref7], de [Werkloosheidswet][ref8], de
      [Ziektewet][ref9], de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref10], de Wet
      arbeidsongeschiktheidsvoorziening jonggehandicapten, de [Wet werk en inkomen naar arbeidsvermogen][ref11], de
      [Wet op de arbeidsongeschiktheidsverzekering][ref12] of de [Wet arbeid en zorg][ref13] of een toeslag op grond van
      de [Toeslagenwet][ref14].

      4 De in [artikel 479g van het Wetboek van Burgerlijke Rechtsvordering][ref15] aan de raad voor de kinderbescherming
      toegekende bevoegdheid komt gelijkelijk toe aan de Sociale verzekeringsbank. Indien de Sociale verzekeringsbank
      gebruik maakt van deze bevoegdheid, geschiedt de bekendmaking van het dwangbevel, in afwijking van
      [artikel 4:123, eerste lid, van de Algemene wet bestuursrecht][ref16], door middel van toezending per post aan
      degene aan wie de boete is opgelegd.

      5 Zolang de verzekerde en degene met wie hij een huishouden vormt, dan wel de persoon aan wie
      op grond van [artikel 21][ref17] kinderbijslag wordt betaald, zijn verplichting als bedoeld in
      [artikel 17a, achtste lid][ref18], niet of niet behoorlijk nakomt:

      a. is de Sociale verzekeringsbank, in afwijking van
      [artikel 4:93, vierde lid, van de Algemene wet bestuursrecht][ref19], bevoegd tot verrekening van de bestuurlijke
      boete voor zover beslag op de vordering van de schuldeiser nietig zou zijn;

      b. geldt de beslagvrije voet, bedoeld in de
      [artikelen 475c tot en met 475e van het Wetboek van Burgerlijke Rechtsvordering][ref20], in afwijking van
      [artikel 4:116 van de Algemene wet bestuursrecht][ref21], niet bij de invordering van een bestuurlijke boete bij
      dwangbevel.


