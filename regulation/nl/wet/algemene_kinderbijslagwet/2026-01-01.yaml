  - number: 24b
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de wijze van tenuitvoerlegging van de
      beschikking waarbij is vastgesteld dat onverschuldigd is betaald.
    url: https://wetten.overheid.nl/BWBR0002368/2026-01-01#Artikel24b
  - number: 24c
    text: |-
      1 In afwijking van [artikel 24, eerste lid][ref1], kan de Sociale verzekeringsbank, op verzoek van de verzekerde,
      dan wel degene met wie hij een huishouding vormt, of de persoon aan wie op grond van [artikel 21][ref2]
      kinderbijslag wordt betaald, besluiten gedeeltelijk van terugvordering of gedeeltelijk van verdere terugvordering
      af te zien bij medewerking aan een schuldregeling, indien:

      a. redelijkerwijs te voorzien is dat verzekerde, dan wel degene met wie hij een huishouding vormt, of de persoon
      aan wie op grond van [artikel 21][ref3] kinderbijslag wordt betaald niet zal kunnen voortgaan met het betalen van
      zijn schulden of indien hij in de toestand verkeert dat hij heeft opgehouden te betalen;

      b. redelijkerwijs te voorzien is dat een schuldregeling met betrekking tot alle vorderingen, behoudens de in het
      tweede lid bedoelde vorderingen, van de overige schuldeisers zonder een zodanig besluit niet tot stand zal komen;

      c. een naar het oordeel van de Sociale verzekeringsbank betrouwbaar voorstel voor een
      schuldregeling tot stand is gekomen door tussenkomst van een schuldhulpverlener als bedoeld in
      [artikel 48 van de Wet op het consumentenkrediet][ref4];

      d. aannemelijk is dat medewerking aan een schuldregeling niet concurrentieverstorend werkt; en

      e. uitdeling in het kader van de schuldregeling plaatsvindt overeenkomstig
      [artikel 349 van de Faillissementswet][ref5].

      2 Het eerste lid is niet van toepassing indien een vordering is ontstaan door het opzettelijk of door grove schuld
      niet nakomen door de verzekerde, dan wel degene met wie hij een huishouding vormt, of de persoon aan wie op grond
      van [artikel 21][ref6] kinderbijslag wordt betaald, van de verplichting, bedoeld in [artikel 15][ref7], en hiervoor
      een boete als bedoeld in [artikel 17a][ref8] is opgelegd, dan wel met betrekking tot het niet naleven van die
      verplichting aangifte is gedaan op grond van het [Wetboek van Strafrecht][ref9].

      3 Het besluit tot het afzien van terugvordering of van verdere terugvordering wordt ingetrokken of ten nadele
      van de verzekerde, dan wel degene met wie hij een huishouding vormt, of de persoon aan wie op grond van
      [artikel 21][ref10] kinderbijslag wordt betaald gewijzigd indien:

      a. niet binnen twaalf maanden nadat dat besluit is bekendgemaakt, een schuldregeling tot stand is gekomen die
      voldoet aan de eisen, bedoeld in het eerste lid;

      b. de verzekerde, dan wel degene met wie hij een huishouding vormt, of de persoon aan wie op grond van
      [artikel 21][ref11] kinderbijslag wordt betaald zijn schuld aan de Sociale verzekeringsbank niet overeenkomstig de
      schuldregeling voldoet; of

      c. onjuiste of onvolledige gegevens zijn verstrekt en de verstrekking van juiste of volledige gegevens tot een
      ander besluit zou hebben geleid.

      4 Bij ministeriële regeling kunnen met betrekking tot dit artikel nadere regels worden gesteld ten aanzien van de
      bevoegdheid om mee te werken aan schuldregelingen.


