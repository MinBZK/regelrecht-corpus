  - number: 15a
    text: |-
      1 In aanvulling op [artikel 15][ref1] kan de Sociale verzekeringsbank de verzekerde of de persoon aan wie of de
      instelling waaraan op grond van [artikel 21][ref2] kinderbijslag wordt betaald verzoeken aan te tonen dat:

      a. ten aanzien van een kind als bedoeld in [artikel 7, eerste lid, onderdeel a, en tweede lid][ref3], wordt voldaan
      aan de voorwaarden, gesteld in artikel 7, eerste lid, onderdeel a, en tweede lid, of

      b. een kind als bedoeld in [artikel 7, zesde lid][ref4], niet tot het huishouden van de verzekerde noch tot het
      huishouden van een ander behoort.

      2 Teneinde de verzekerde of de persoon aan wie of de instelling waaraan op grond van [artikel 21][ref5]
      kinderbijslag wordt betaald daartoe in de gelegenheid te stellen, kan de Sociale verzekeringsbank bij dit verzoek
      aanbieden met de toestemming van de verzekerde of de bewoner van de woning waar het kind woont, de woning van
      verzekerde onderscheidenlijk de woning waar het kind woont binnen te treden.

      3 Indien door het ontbreken van toestemming van de bewoner niet kan worden vastgesteld tot wiens huishouden het
      kind behoort, heeft dit gevolgen voor het recht op en het geldend maken van het recht op kinderbijslag.


