  - number: '13'
    text: |-
      1 De bedragen, genoemd in de [artikelen 7a, tweede lid][ref1], en [12, eerste lid][ref2], worden al naar gelang de
      ontwikkeling van het algemene prijsniveau verhoogd of verlaagd.

      2 Het bedrag, genoemd in [artikel 7a, tweede lid, onderdeel b][ref3], wordt telkens gewijzigd met ingang van
      1 januari. Bij een wijziging met ingang van 1 januari wordt dit bedrag vermenigvuldigd met de tabelcorrectiefactor,
      bedoeld in [artikel 10.2 van de Wet inkomstenbelasting 2001][ref4], en vervolgens wordt de nodig geachte afronding
      aangebracht. Indien in het voorafgaande kalenderjaar een dergelijke afronding is toegepast, wordt bij de wijziging
      uitgegaan van het afgeronde bedrag. Het gewijzigde bedrag wordt door of namens Onze Minister medegedeeld in de
      Staatscourant.

      3 Het extra bedrag aan kinderbijslag, genoemd aan het slot van [artikel 7a, tweede lid][ref5], wordt telkens
      gewijzigd met ingang van 1 januari. Bij een wijziging met ingang van 1 januari wordt dit bedrag verhoogd of
      verlaagd met hetzelfde percentage, als waarmee de consumentenprijsindex over de maand oktober daaraan voorafgaande,
      naar boven of naar beneden afwijkt van de consumentenprijsindex, waarop de laatste wijziging is gebaseerd. Het
      gewijzigde bedrag wordt door of namens Onze Minister medegedeeld in de Staatscourant. In afwijking van de eerste
      zin blijft wijziging per 1 januari achterwege, indien de consumentenprijsindex over de maand oktober daaraan
      voorafgaande geen afwijking vertoont ten opzichte van de consumentenprijsindex, waarop de laatste wijziging is
      gebaseerd.

      4 Het bedrag, genoemd in [artikel 12, eerste lid][ref6], wordt telkens gewijzigd met ingang van 1 januari
      en 1 juli. Bij een wijziging met ingang van 1 januari onderscheidenlijk 1 juli wordt dit bedrag verhoogd
      of verlaagd met hetzelfde percentage, al waarmede de consumentenprijsindex over de maand oktober daaraan
      voorafgaande onderscheidenlijk over de maand april daaraan voorafgaande, naar boven of naar beneden afwijkt van
      de consumentenprijsindex, waarop de laatste wijziging is gebaseerd. Het gewijzigde bedrag wordt door of namens
      Onze Minister medegedeeld in de Staatscourant. In afwijking van de eerste zin blijft wijziging per 1 januari
      onderscheidenlijk per 1 juli achterwege, indien de consumentenprijsindex over de maand oktober onderscheidenlijk
      over de maand april daaraan voorafgaande geen afwijking vertoont ten opzichte van de consumentenprijsindex, waarop
      de laatste wijziging is gebaseerd.

      5 Het overeenkomstig het tweede, derde of vierde lid gewijzigde bedrag treedt in de plaats van het bedrag, genoemd
      in [artikel 7a, tweede lid, onderdeel b][ref7], het extra bedrag aan kinderbijslag, genoemd aan het slot van
      artikel 7a, tweede lid, onderscheidenlijk het bedrag, genoemd in [artikel 12, eerste lid][ref8].

      6 Indien daartoe naar Ons oordeel een bijzondere aanleiding bestaat, kan het extra bedrag aan
      kinderbijslag, genoemd aan het slot van [artikel 7a, tweede lid][ref9], of het bedrag, genoemd in
      [artikel 12, eerste lid][ref10], bij algemene maatregel van bestuur met ingang van een bij die algemene maatregel
      van bestuur aan te geven datum worden verhoogd. De op grond van de vorige zin verhoogde bedragen treden in de
      plaats van het extra bedrag aan kinderbijslag, genoemd aan het slot van artikel 7a, tweede lid, onderscheidenlijk
      het bedrag, genoemd in artikel 12, eerste lid.

      7 Indien een verhoging als bedoeld in het zesde lid samenvalt met een wijziging als bedoeld in het derde of het
      vierde lid, wordt het bedrag voorafgaande aan de verhoging gewijzigd en geschiedt de wijziging, in afwijking van
      het derde lid, onderscheidenlijk het vierde lid, bij de in het zesde lid bedoelde algemene maatregel van bestuur.

      8 Hetgeen onder consumentenprijsindex als bedoeld in het derde en vierde lid wordt verstaan, wordt nader bij
      algemene maatregel van bestuur geregeld.

      9 Indien het bedrag, genoemd in [artikel 12, eerste lid][ref11], wordt gewijzigd, worden de uit de toepassing van
      artikel 12, derde lid, met betrekking tot dat bedrag voortvloeiende bedragen, samen met de dag waarop de wijziging
      ingaat, door of namens Onze Minister medegedeeld in de Staatscourant.

      10 Een wijziging van de kinderbijslag op grond van dit artikel vindt plaats zonder dat dit bij beschikking is
      vastgesteld.

      11 De Sociale verzekeringsbank betaalt de gewijzigde kinderbijslag, bedoeld in het tiende lid, bij de eerstvolgende
      betaling van de kinderbijslag nadat de wijziging, bedoeld in het derde dan wel vierde lid, heeft plaatsgevonden.


