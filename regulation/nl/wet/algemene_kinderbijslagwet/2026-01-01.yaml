  - number: 29c
    text: |-
      1 Een beschikking op grond van deze wet en de daarop berustende bepalingen wordt gegeven binnen
      een redelijke termijn na ontvangst van de aanvraag of na ontvangst van de informatie, bedoeld in
      [artikel 14, eerste lid, onderdeel b][ref1].

      2 De redelijke termijn is in ieder geval verstreken wanneer binnen acht weken na ontvangst van de aanvraag of na
      ontvangst van de informatie, bedoeld in [artikel 14, eerste lid, onderdeel b][ref2], geen beschikking is gegeven,
      noch een kennisgeving als bedoeld in het derde lid is gedaan.

      3 Indien een beschikking niet binnen de termijn van acht weken kan worden gegeven, wordt die termijn met een
      redelijke termijn verlengd en wordt de aanvrager of, indien geen sprake is van een aanvrager, degene aan wie de
      kinderbijslag wordt uitbetaald daarvan schriftelijk in kennis gesteld.

      4 Indien ambtshalve op basis van de verschafte informatie bedoeld in [artikel 14, eerste lid, onderdeel b][ref3],
      niet wordt overgegaan tot vaststelling van een recht op een verdubbeling van het bedrag aan kinderbijslag, wordt
      hiervan binnen een redelijke termijn schriftelijk in kennis gesteld:

      a. degene aan wie de kinderbijslag wordt uitbetaald; of

      b. degene aan wie het indicatiebesluit, bedoeld in [artikel 3.2.3 van de Wet langdurige zorg][ref4], is gericht,
      als geen kinderbijslag wordt uitbetaald.


