  - number: 14a
    text: |-
      1 Onverminderd het elders in deze wet bepaalde terzake van herziening of intrekking van een besluit tot toekenning
      van kinderbijslag en terzake van weigering van kinderbijslag, herziet de Sociale verzekeringsbank een dergelijk
      besluit of trekt zij dat in:

      a. indien het niet of niet behoorlijk nakomen van een verplichting op grond van [artikel 15][ref1] of [16][ref2]
      heeft geleid tot het ten onrechte of tot een te hoog bedrag verlenen van kinderbijslag;

      b. indien anderszins de kinderbijslag ten onrechte of tot een te hoog bedrag is verleend;

      c. indien het niet of niet behoorlijk nakomen van een verplichting op grond van [artikel 15][ref3] of [16][ref4]
      ertoe leidt dat niet kan worden vastgesteld of nog recht op kinderbijslag bestaat.

      2 Indien daarvoor dringende redenen aanwezig zijn kan de Sociale verzekeringsbank besluiten geheel of gedeeltelijk
      van herziening of intrekking als bedoeld in het eerste lid af te zien.

      3 Indien de verzekerde of de persoon aan wie of de instelling waaraan op grond van [artikel 21][ref5] kinderbijslag
      wordt betaald niet op grond van [artikel 15a][ref6] desgevraagd aantoont dat is voldaan aan artikel 15a, eerste
      lid, onderdelen a en b, en als gevolg hiervan niet kan worden vastgesteld tot wiens huishouden het kind behoort,
      wordt het recht op kinderbijslag vastgesteld, herzien of ingetrokken en het recht op kinderbijslag geldend gemaakt
      overeenkomstig [hoofdstuk III, paragraaf 1][ref7] en [2][ref8].


