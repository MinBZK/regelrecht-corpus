  - number: 7a
    text: |-
      1 Een verzekerde heeft voor een tot zijn huishouden behorend kind dat drie jaar is of ouder, maar nog niet
      de leeftijd van 18 jaar heeft bereikt, recht op een verdubbeling van het bedrag aan kinderbijslag, genoemd in
      [artikel 12, eerste en tweede lid][ref1], indien het kind is aangewezen op een bij of krachtens algemene maatregel
      van bestuur te bepalen mate van intensieve zorg.

      2 Indien een verzekerde over een kalenderjaar tot uitbetaling gekomen recht heeft gehad op een verdubbeling van het
      bedrag aan kinderbijslag op grond van het eerste lid, en

      a. met betrekking tot dat kalenderjaar, dan wel een gedeelte daarvan, geen partner heeft als bedoeld in
      [artikel 1.2 van de Wet inkomstenbelasting 2001][ref2]; of

      b. met betrekking tot dat kalenderjaar een partner heeft als bedoeld in
      [artikel 1.2 van de Wet inkomstenbelasting 2001][ref3] en de verzekerde of diens partner
      in dat kalenderjaar belastbare winst uit een of meer ondernemingen als bedoeld in
      [artikel 3.2 van de Wet inkomstenbelasting 2001][ref4], belastbaar loon als bedoeld in
      [artikel 3.80 van de Wet inkomstenbelasting 2001][ref5] of belastbaar resultaat uit een of meer werkzaamheden als
      bedoeld in [artikel 3.90 van de Wet inkomstenbelasting 2001][ref6] heeft genoten dat niet meer is dan € 6.323;

      heeft de verzekerde recht op een extra bedrag aan kinderbijslag over dat kalenderjaar ten bedrage van € 2.783,46.

      3 Indien een verzekerde of diens partner voldoet aan de voorwaarden, bedoeld in het tweede lid, en recht heeft op
      meer dan eenmaal de verdubbeling van de kinderbijslag, bedoeld in het eerste lid, heeft hij dan wel zijn partner
      recht op ten hoogste eenmaal het extra bedrag aan kinderbijslag, bedoeld in het tweede lid.

      4 Indien twee personen die voor eenzelfde kind recht hebben op kinderbijslag als bedoeld in het eerste lid, dit
      kind op basis van een overeenkomst of rechterlijke beschikking overwegend in gelijke mate verzorgen en onderhouden
      zonder met elkaar een gemeenschappelijke huishouding te voeren, is voor de beoordeling van het recht op het extra
      bedrag aan kinderbijslag, bedoeld in het tweede lid, de situatie, bedoeld in het tweede lid, onderdeel a of b, van
      de ouder wiens recht op kinderbijslag wordt uitbetaald, bepalend.

      5 Bij het uitvoeren van de verdubbeling van het bedrag aan kinderbijslag, bedoeld in het eerste lid, kan de Sociale
      verzekeringsbank gezondheidsgegevens uitwisselen en verwerken.

      6 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot het eerste,
      tweede en vijfde lid.


