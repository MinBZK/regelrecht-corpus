  - number: '18'
    text: |-
      1 De Sociale verzekeringsbank betaalt:

      a. de kinderbijslag zo spoedig mogelijk, doch uiterlijk binnen drie maanden na afloop van het kwartaal waarover
      recht op kinderbijslag bestaat, respectievelijk binnen drie maanden na indiening van de aanvraag, bedoeld in
      [artikel 14, eerste lid, onderdeel a][ref1];

      b. de verdubbeling van het bedrag aan kinderbijslag, bedoeld in [artikel 7a, eerste lid][ref2], zo spoedig
      mogelijk, doch uiterlijk binnen drie maanden na indiening van de aanvraag of ontvangst van de informatie, bedoeld
      in [artikel 14, eerste lid, onderdeel b][ref3]; en

      c. het extra bedrag aan kinderbijslag, bedoeld in [artikel 7a, tweede lid][ref4], zo spoedig mogelijk, doch
      uiterlijk binnen drie maanden na indiening van de aanvraag, bedoeld in [artikel 14, eerste lid, onderdeel c][ref5].

      2 Indien twee personen, die gezamenlijk een huishouden vormen, over eenzelfde tijdvak recht op kinderbijslag voor
      eenzelfde kind hebben, wordt de kinderbijslag uitbetaald aan degene van hen die zij gezamenlijk daartoe hebben
      aangewezen.

      3 Bij gebreke van een gezamenlijke aanwijzing als bedoeld in het tweede lid bepaalt de Sociale verzekeringsbank aan
      welke persoon de kinderbijslag wordt uitbetaald.

      4 Indien twee of meer personen waaronder één persoon tot wiens huishouden het kind behoort, over eenzelfde tijdvak
      recht op kinderbijslag voor eenzelfde kind hebben, wordt de kinderbijslag waarop degene recht heeft, tot wiens
      huishouden dit kind niet behoort, niet betaald.

      5 Indien twee of meer personen over eenzelfde tijdvak recht hebben op kinderbijslag voor eenzelfde kind, in andere
      situaties dan bedoeld in het tweede en vierde lid, wordt betaald de kinderbijslag waarop degene recht heeft die de
      hoogste bijdrage in het onderhoud van dit kind levert. Aan de andere personen wordt geen kinderbijslag uitbetaald.

      6 Zolang de persoon aan wie op grond van het vierde of vijfde lid kinderbijslag zou moeten worden betaald geen
      aanvraag daartoe heeft ingediend, blijft de kinderbijslag, in afwijking van het vierde en vijfde lid, betaald
      worden aan de persoon die daartoe wel een aanvraag heeft ingediend. Indien de persoon die geen aanvraag heeft
      ingediend, alsnog een aanvraag indient, wordt de kinderbijslag aan die persoon betaald:

      a. na afloop van het kalenderkwartaal waarin de aanvraag is ingediend, indien deze is ingediend in de eerste twee
      maanden van dat kalenderkwartaal; of

      b. na afloop van het kalenderkwartaal volgend op het kalenderkwartaal waarin de aanvraag is ingediend, indien deze
      is ingediend in de laatste maand van dat kalenderkwartaal.

      7 Bij algemene maatregel van bestuur kunnen met betrekking tot situaties van samenloop, bedoeld in het tweede,
      vierde en vijfde lid, nadere en aanvullende regels worden gesteld waarbij bepaald kan worden dat aan een ander
      persoon de kinderbijslag wordt uitbetaald dan de persoon, bedoeld in het vierde en vijfde lid.

      8 De kinderbijslag die op grond van het tweede tot en met vijfde en zevende lid aan een verzekerde wordt betaald,
      kan op verzoek van die verzekerde in gedeelten aan meer verzekerden worden betaald.

      9 Indien de kinderbijslag in het buitenland wordt uitbetaald, geschiedt de betaling in afwijking van
      [artikel 4:89, derde lid, van de Algemene wet bestuursrecht][ref6] op het tijdstip waarop de rekening van de
      daartoe door de schuldeiser aangewezen bank wordt gecrediteerd.


