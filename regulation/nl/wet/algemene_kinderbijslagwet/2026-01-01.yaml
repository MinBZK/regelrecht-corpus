  - number: 19a
    text: |-
      1 De Sociale verzekeringsbank schort de betaling van de kinderbijslag op, indien blijkt dat het door de verzekerde
      verstrekte adres van hemzelf of van zijn kind afwijkt van het adres waaronder de verzekerde of het kind in de
      basisregistratie personen staat ingeschreven.

      2 Geen opschorting vindt plaats:

      a. indien de afwijking redelijkerwijs geen gevolgen kan hebben voor het recht op of de hoogte van de kinderbijslag;

      b. indien de belanghebbende van de afwijking redelijkerwijs geen verwijt kan worden gemaakt.

      3 De Sociale verzekeringsbank doet schriftelijk mededeling van de opschorting aan de verzekerde.

      4 De opschorting wordt beëindigd zodra het aan de Sociale verzekeringsbank gebleken is dat de afwijking niet meer
      bestaat.
    url: https://wetten.overheid.nl/BWBR0002368/2026-01-01#Artikel19a
  - number: '20'
    text: |-
      Indien voor hetzelfde kind kinderbijslag of een naar aard en strekking daarmee overeenkomende gezinsbijslag is
      betaald, dan wel kan worden betaald ingevolge deze wet en ingevolge een rechtens geldende regeling, bestaande in
      een ander land, of ingevolge een regeling van een volkenrechtelijke organisatie, kunnen bij ministeriële regeling
      regels worden gesteld ter voorkoming, verrekening en beperking van samenloop met dergelijke gezinsbijslagen of ter
      voorkoming van dubbele kinderbijslag.
    url: https://wetten.overheid.nl/BWBR0002368/2026-01-01#Artikel20
  - number: '21'
    text: |-
      De Sociale verzekeringsbank is bevoegd, voor zover nodig na ingewonnen advies van het Landelijk Bureau Inning
      Onderhoudsbijdragen de kinderbijslag voor een kind te betalen aan een ander dan de rechthebbende.
    url: https://wetten.overheid.nl/BWBR0002368/2026-01-01#Artikel21
  - number: '22'
    text: |-
      De kinderbijslag die niet in ontvangst is genomen of is ingevorderd binnen twee jaar na de dag van
      betaalbaarstelling, wordt niet meer betaald.
    url: https://wetten.overheid.nl/BWBR0002368/2026-01-01#Artikel22
  - number: '23'
    text: |-
      1 De kinderbijslag is:

      a. onvervreemdbaar;

      b. niet vatbaar voor verpanding of belening;

      c. behoudens voor zoveel dit dient tot verhaal van een uitkering tot levensonderhoud van het kind, of tot
      terugvordering van onverschuldigd betaalde kinderbijslag als bedoeld in [artikel 24][ref1], niet vatbaar
      voor executoriaal of conservatoir beslag noch voor beslag ingevolge faillissement of toepassing van de
      schuldsaneringsregeling natuurlijke personen.

      2 Volmacht tot ontvangst van kinderbijslag, onder welke vorm of welke benaming ook door de verzekerde verleend, is
      steeds herroepelijk.

      3 Elk beding, strijdig met enige bepaling van dit artikel, is nietig.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel24
    url: https://wetten.overheid.nl/BWBR0002368/2026-01-01#Artikel23
