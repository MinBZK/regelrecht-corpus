  - number: 6b
    text: |-
      Voor de toepassing van deze paragraaf wordt onder centrum voor topsport verstaan een voorziening waar een
      topsporter op tenminste toptalentniveau de mogelijkheid heeft op één locatie te trainen, wonen en studeren.
    url: https://wetten.overheid.nl/BWBR0002368/2026-01-01#Artikel6b
  - number: '7'
    text: |-
      1 De verzekerde heeft overeenkomstig de bepalingen van deze wet recht op kinderbijslag voor een kind dat jonger is
      dan 18 jaar en dat:

      a. tot zijn huishouden behoort, of

      b. door hem wordt onderhouden.

      2 De verzekerde heeft voor een kind van 16 of 17 jaar slechts recht op kinderbijslag indien:

      a. de verzekerde heeft voldaan aan de verplichtingen, bedoeld in de [artikelen 2, eerste lid][ref1], en
      [4a, eerste lid, van de Leerplichtwet 1969][ref2], dan wel daarvan op grond van die wet is vrijgesteld;

      b. het kind als leerling, vavo-student of student als bedoeld in de [Wet educatie en beroepsonderwijs][ref3]
      van een met een school of instelling als bedoeld in [artikel 4a van de Leerplichtwet 1969][ref4] vergelijkbare
      inrichting van onderwijs buiten Nederland staat ingeschreven en deze inrichting geregeld bezoekt, dan wel met
      overeenkomstige toepassing van de vrijstellingsgronden van die wet van die verplichting is vrijgesteld;

      c. het kind een startkwalificatie als bedoeld in [artikel 1, onderdeel f, van de Leerplichtwet 1969][ref5] heeft
      behaald; of

      d. het kind een school of instelling als bedoeld in onderdeel b heeft afgerond op vergelijkbare wijze als bedoeld
      in onderdeel c.

      3 Het niet voldoen aan de verplichtingen, bedoeld in het tweede lid, onderdeel a, blijkt uit een daartoe strekkende
      mededeling van het college van burgemeester en wethouders van de gemeente waar het kind woont.

      4 Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot het tweede en derde lid.

      5

      6 Het bedrag aan kinderbijslag, bedoeld in [artikel 12, eerste en tweede lid][ref6], wordt verdubbeld indien de
      verzekerde per kalenderkwartaal een bijdrage levert aan het onderhoud van het kind die meer bedraagt dan een bij
      of krachtens algemene maatregel van bestuur te bepalen bedrag en het kind, bedoeld in het eerste lid, niet tot
      het huishouden van de verzekerde noch als eigen kind, aangehuwd kind of pleegkind tot het huishouden van een ander
      behoort:

      a. in verband met ziekte of gebreken van het kind; of

      b. in verband met het volgen van onderwijs of een beroepsopleiding aan een school of instelling in de zin van
      [artikel 1, onder b of c, van de Leerplichtwet 1969][ref7] waar het kind staat ingeschreven of in verband met
      het volgen van onderwijs, genoemd in [artikel 4a, eerste lid, van de Leerplichtwet 1969][ref8] waar het kind
      overeenkomstig artikel 4a, eerste lid, van de Leerplichtwet 1969 staat ingeschreven of in verband met het volgen
      van onderwijs aan een vergelijkbare inrichting van onderwijs buiten Nederland waar het kind staat ingeschreven,
      waarbij:

      1°. de verzekerde aantoont dat het kind een bij ministeriële regeling te bepalen beroepsopleiding volgt of
      als toptalent op het gebied van dans en muziek dan wel als topsporter op tenminste toptalentniveau een bij
      ministeriële regeling te bepalen school bezoekt voor het volgen van voortgezet onderwijs of een opleiding volgt in
      het voorbereidend beroepsonderwijs of in het beroepsonderwijs en als topsporter op tenminste toptalentniveau een
      opleiding bij een bij ministeriële regeling te bepalen centrum voor topsport volgt waardoor de afstand tussen het
      woonadres van de verzekerde of het woonadres van de ander tot wiens huishouden het kind laatstelijk behoorde en de
      dichtstbijzijnde instelling of school waar de beroepsopleiding of het voortgezet onderwijs wordt aangeboden meer
      bedraagt dan een bij ministeriële regeling te bepalen aantal kilometers; of

      2°. de verzekerde een bij of krachtens algemene maatregel van bestuur te bepalen beroep uitoefent; of

      3°. de verzekerde of de ander tot wiens huishouden het kind laatstelijk behoorde in een bij of krachtens algemene
      maatregel van bestuur te bepalen deel van Nederland woont, of de verzekerde aantoont dat hij of die ander in een
      gebied buiten Nederland woont waarbij niet verwacht kan worden dat het kind op basis van openbaar of eigen vervoer
      dagelijks heen en weer reist tussen school en het adres van de verzekerde of die ander; of

      4°. het het kind betreft van de verzekerde, bedoeld in [artikel 7b, vierde lid, onderdelen a en b][ref9]; of

      5°. de verzekerde aantoont dat het kind een bij ministeriële regeling te bepalen school bezoekt waarbij de afstand
      tussen het woonadres van de verzekerde of het woonadres van de ander tot wiens huishouden het kind laatstelijk
      behoorde en de dichtstbijzijnde school waar het onderwijs wordt aangeboden meer bedraagt dan een bij ministeriële
      regeling te bepalen aantal kilometers, met dien verstande dat de afstandseis niet geldt als het kind verplicht
      is gedurende het schooljaar meer dan drie nachten per kalenderweek op een aan de school gelieerde locatie te
      overnachten.

      7 Indien de beroepsopleiding of de school, bedoeld in het zesde lid, onderdeel b, onder 1°, niet langer is
      opgenomen in de ministeriële regeling, bedoeld in het zesde lid, onderdeel b, onder 1°, dan wel indien gedurende
      de beroepsopleiding of het voortgezet onderwijs, bedoeld in het zesde lid, onderdeel b, onder 1°, een gelijke
      opleiding of school in die ministeriële regeling wordt opgenomen die valt binnen de afstand, bedoeld in het zesde
      lid, onderdeel b, onder 1°, blijft de verdubbeling van de kinderbijslag, bedoeld in het zesde lid, van toepassing
      tot de dag waarop het kind de opleiding of het onderwijs, bedoeld in het zesde lid, onderdeel b, onder 1°, niet
      langer volgt.

      8 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot het eerste lid,
      onderdeel b, en het zesde lid.

      9 Voor de toepassing van dit artikel wordt het kind geacht het onderwijs of de beroepsopleiding eerst na de
      vakantie te hebben beëindigd, indien:

      a. het onderwijs of de beroepsopleiding wordt beëindigd tijdens een door de Minister van Onderwijs, Cultuur en
      Wetenschap, de school of instelling vastgestelde vakantie, dan wel

      b. het onderwijs of de beroepsopleiding wordt afgesloten met een eindexamen, dat kort voor het begin van de laatste
      door de Minister van Cultuur, Onderwijs en Wetenschap, de school of instelling vastgestelde vakantie van het
      desbetreffende schooljaar wordt afgelegd.

      10 In afwijking van het zesde lid, onderdeel b, sub 1°, is het woord «dichtstbijzijnde» niet van toepassing
      wanneer:

      a. het kind een beroepsopleiding volgt aan een niet uit ’s Rijks kas bekostigde instelling als bedoeld in
      [artikel 1.4.1 van de Wet educatie en beroepsonderwijs][ref10]; of

      b. het kind een beroepsopleiding volgt aan een uit ’s Rijks kas bekostigde instelling als bedoeld in
      [artikel 1.1.1 van de Wet educatie en beroepsonderwijs][ref11] en de dichtstbijzijnde instelling een niet uit ’s
      Rijks kas bekostigde instelling is als bedoeld in [artikel 1.4.1 van de Wet educatie en beroepsonderwijs][ref12].


