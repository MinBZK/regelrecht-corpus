  - number: '19'
    text: |-
      De Sociale verzekeringsbank schort de betaling van de kinderbijslag op of schorst de betaling, indien zij op grond
      van duidelijke aanwijzingen van oordeel is of het gegronde vermoeden heeft, dat:

      a. het recht op kinderbijslag niet of niet meer bestaat;

      b. recht op een lagere kinderbijslag bestaat, of

      c. de verzekerde, alsmede de persoon aan wie of de instelling aan welke op grond van [artikel 21][ref1]
      kinderbijslag wordt betaald, een verplichting hem of haar op grond van de [artikelen 15][ref2],
      [15a, eerste lid][ref3], en [16][ref4] opgelegd, niet is nagekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel21
