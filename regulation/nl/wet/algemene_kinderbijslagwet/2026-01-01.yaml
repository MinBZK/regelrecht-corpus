  - number: '24'
    text: |-
      1 De kinderbijslag die als gevolg van een besluit als bedoeld in [artikel 14a][ref1] onverschuldigd is betaald,
      alsmede hetgeen anderszins onverschuldigd is betaald, wordt door de Sociale verzekeringsbank van de verzekerde, dan
      wel degene met wie hij een huishouding vormt, of de persoon aan wie op grond van [artikel 21][ref2] kinderbijslag
      wordt betaald, teruggevorderd.

      2 In afwijking van het eerste lid kan de Sociale verzekeringsbank besluiten van terugvordering of van verdere
      terugvordering af te zien, indien de verzekerde, dan wel degene met wie hij een huishouding vormt, of de persoon
      aan wie op grond van [artikel 21][ref3] kinderbijslag wordt betaald:

      a. gedurende vijf jaar volledig aan zijn betalingsverplichtingen heeft voldaan;

      b. gedurende vijf jaar niet volledig aan zijn betalingsverplichtingen heeft voldaan, maar het achterstallige bedrag
      over die periode, vermeerderd met de daarover verschuldigde wettelijke rente en de op de invordering betrekking
      hebbende kosten, alsnog heeft betaald;

      c. gedurende vijf jaar geen betalingen heeft verricht en niet aannemelijk is dat hij deze op enig moment zal gaan
      verrichten; of

      d. een bedrag, overeenkomend met ten minste 50% van de restsom in één keer aflost.

      3 De in het tweede lid, onderdelen a, b en c, genoemde termijn is tien jaar indien de terugvordering het gevolg is
      van het niet of niet behoorlijk nakomen van de verplichting, bedoeld in [artikel 15][ref4].

      4 De in het tweede lid, onder a en b, genoemde termijn is drie jaar indien:

      a. het gemiddeld inkomen van de belanghebbende in die periode de beslagvrije voet bedoeld in de
      [artikelen 475c tot en met 475e van het Wetboek van Burgerlijke Rechtsvordering][ref5] niet te boven is gegaan; en

      b. de terugvordering niet het gevolg is van het niet of niet behoorlijk nakomen van de verplichting, bedoeld in
      [artikel 15][ref6].

      5 Indien daarvoor dringende redenen aanwezig zijn kan de Sociale verzekeringsbank besluiten geheel of gedeeltelijk
      van terugvordering af te zien.

      6 Degene van wie wordt teruggevorderd is verplicht desgevraagd aan de Sociale verzekeringsbank de inlichtingen te
      verstrekken die voor de terugvordering van belang zijn.

      7 In afwijking van het eerste lid kan de Sociale verzekeringsbank, onder voorwaarden die Onze Minister kan stellen,
      besluiten van terugvordering af te zien indien het terug te vorderen bedrag een door Onze Minister vast te stellen
      bedrag niet te boven gaat.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel14a
