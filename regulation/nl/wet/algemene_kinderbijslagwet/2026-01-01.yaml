  - number: 7b
    text: |-
      1 Geen recht op kinderbijslag heeft de verzekerde ten behoeve van het kind, indien dat kind op de eerste dag van
      een kalenderkwartaal niet in Nederland woont.

      2 Het eerste lid is niet van toepassing indien dat kind op de eerste dag van een kalenderkwartaal woont in een
      land waarin ten behoeve van hem op grond van verordening (EG) nr. 883/2004 van het Europees Parlement en de Raad
      van 29 april 2004 betreffende de coördinatie van de socialezekerheidsstelsels (PbEU L 166) recht op kinderbijslag
      bestaat.

      3 Het eerste lid is niet van toepassing indien het kind op de eerste dag van een kalenderkwartaal niet in Nederland
      woont doch langer dan drie maanden onafgebroken in Nederland verblijft.

      4 Bij of krachtens algemene maatregel van bestuur kan worden bepaald dat ten behoeve van het kind dat op de eerste
      dag van een kalenderkwartaal niet in Nederland woont, recht bestaat op kinderbijslag voor:

      a. de verzekerde, die werkzaamheden verricht in het algemeen belang en niet in Nederland woont;

      b. de verzekerde, die in Aruba, Curaçao, Sint Maarten of in de openbare lichamen Bonaire, Sint Eustatius en Saba
      woont; of

      c. de gezinsleden van de in de onderdelen a of b bedoelde verzekerde.
    url: https://wetten.overheid.nl/BWBR0002368/2026-01-01#Artikel7b
  - number: 7d
    text: |-
      1 Geen recht op kinderbijslag overeenkomstig de bepalingen van deze wet heeft de verzekerde die een uitreiziger is.

      2 De verzekerde heeft geen recht op kinderbijslag overeenkomstig de bepalingen van deze wet voor een kind dat een
      uitreiziger is.
    url: https://wetten.overheid.nl/BWBR0002368/2026-01-01#Artikel7d
  - number: '11'
    text: |-
      1 Recht op kinderbijslag voor een kind ingevolge deze wet heeft slechts degene, die op de eerste dag van een
      kalenderkwartaal verzekerd is.

      2 Recht op kinderbijslag over een kalenderkwartaal voor een kind bestaat indien op de eerste dag van dat
      kalenderkwartaal is voldaan aan de voorwaarden, bedoeld in [artikel 7][ref1], en, indien van toepassing,
      [artikel 7a][ref2].

      3 Recht op kinderbijslag voor een kind ingevolge deze wet heeft slechts degene, die op de eerste dag van een
      kalenderkwartaal verzekerd is en na toepassing van [artikel 7d][ref3] niet langer het gegronde vermoeden bestaat
      dat hij of het kind zich buiten Nederland bevindt met het doel om zich aan te sluiten bij een organisatie als
      bedoeld in [artikel 1, onderdeel e][ref4].


