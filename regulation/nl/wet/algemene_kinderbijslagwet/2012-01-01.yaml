  - number: 29a
    text: |-
      1 De Sociale verzekeringsbank beheert en administreert afzonderlijk de middelen tot dekking van de uitgaven,
      bedoeld in het derde lid, in de vorm van een Algemeen Kinderbijslagfonds dat deel uitmaakt van de Sociale
      verzekeringsbank, alsmede door de met toepassing van [artikel 17a][ref1] verkregen boeten.

      2 In de middelen tot dekking van de uitgaven ten laste van het Algemeen Kinderbijslagfonds wordt voorzien
      door het Rijk, onderscheidenlijk de afdracht van de boeten, bedoeld in [artikel 17a][ref2], door de Sociale
      verzekeringsbank.

      3 De ingevolge deze wet uit te keren kinderbijslagen en de aan de uitvoering van deze wet verbonden kosten komen
      ten laste van het Algemeen Kinderbijslagfonds.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel17a
      [ref2]: https://wetten.overheid.nl/BWBR0002368#Artikel17a
