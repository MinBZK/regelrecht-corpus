  - number: '11'
    text: |-
      1 Recht op kinderbijslag voor een of meer kinderen over een kalenderkwartaal ingevolge deze wet heeft slechts
      degene, die op de eerste dag van dat kalenderkwartaal verzekerd is dan wel voldoet aan de voorwaarden van
      [artikel 7c][ref1].

      2 Voor het vaststellen van het aantal kinderen, waarvoor over een kalenderkwartaal recht op kinderbijslag bestaat,
      worden slechts in aanmerking genomen de kinderen te wier aanzien aan de voorwaarden, bedoeld in [artikel 7][ref2],
      is voldaan op de eerste dag van dat kwartaal.

      3 Wanneer bij het vaststellen van het aantal kinderen, waarvoor over een kalenderkwartaal recht op
      kinderbijslag bestaat, voor een of meer kinderen de mate waarin deze kinderen door de verzekerde worden
      onderhouden, hiervoor bepalend is, wordt het totaal eigen inkomen, vastgesteld met inachtneming van
      [artikel 7, vierde en vijfde lid][ref3], van deze kinderen over dat kalenderkwartaal in aanmerking genomen,
      ongeacht of ten aanzien van deze kinderen gedurende het gehele kwartaal aan de overige voorwaarden, bedoeld in
      [artikel 7][ref4] is voldaan.


