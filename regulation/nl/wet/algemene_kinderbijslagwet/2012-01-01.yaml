  - number: 24a
    text: |-
      1 De Sociale verzekeringsbank kan de onverschuldigd betaalde kinderbijslag, bedoeld in
      [artikel 24, eerste lid][ref1], invorderen bij dwangbevel.

      2 [Artikel 17g][ref2] is van overeenkomstige toepassing, met dien verstande dat:

      a. indien het gemiddeld inkomen van de belanghebbende gedurende drie jaar de beslagvrije voet bedoeld in de
      [artikelen 475c][ref3] en [475d van het Wetboek van Burgerlijke Rechtsvordering][ref4] niet te boven is gegaan, de
      Sociale verzekeringsbank de aflossingsbedragen lager vaststelt; en

      b. indien degene van wie wordt teruggevorderd, dan wel degene met wie hij een huishouden vormt, kinderbijslag op
      grond van deze wet ontvangt, in afwijking van [artikel 17g, eerste lid][ref5], het besluit tot terugvordering ten
      uitvoer kan worden gelegd door verrekening met die bijslag.


