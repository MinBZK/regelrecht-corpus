  - number: '15'
    text: |-
      1 De verzekerde, alsmede de persoon aan wie of de instelling waaraan op grond van [artikel 21][ref1] kinderbijslag
      wordt betaald, zijn verplicht aan de Sociale verzekeringsbank op haar verzoek of onverwijld uit eigen beweging alle
      feiten en omstandigheden mee te delen, waarvan hem of haar redelijkerwijs duidelijk moet zijn dat zij van invloed
      kunnen zijn op het recht op kinderbijslag, de hoogte van de kinderbijslag, het geldend maken van het recht op
      kinderbijslag of op het bedrag van de kinderbijslag, dat wordt betaald.

      2 De verplichting van het eerste lid geldt niet indien:

      a. die feiten en omstandigheden door de Sociale verzekeringsbank kunnen worden vastgesteld op grond van bij
      wettelijk voorschrift als authentiek aangemerkte gegevens of kunnen worden verkregen uit bij ministeriële regeling
      aan te wijzen administraties. Bij ministeriële regeling wordt bepaald voor welke gegevens dit onderdeel van
      toepassing is, of

      b. het kind voor wie kinderbijslag wordt betaald recht krijgt op studiefinanciering op grond van de
      [Wet studiefinanciering 2000][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0011453
