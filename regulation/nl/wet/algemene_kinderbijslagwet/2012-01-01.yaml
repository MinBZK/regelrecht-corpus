  - number: '12'
    text: |-
      1 Het basiskinderbijslagbedrag over een kalenderkwartaal bedraagt € 268,26  per kind.

      2 Het aan een verzekerde over een kalenderkwartaal te betalen bedrag aan kinderbijslag bedraagt voor een kind, dat
      op de eerste dag van dat kwartaal:

      a. jonger is dan 6 jaar: 70%

      b. 6 jaar of ouder, maar jonger is dan 12 jaar: 85% en

      c. 12 jaar en ouder, maar jonger is dan 18 jaar: 100%

      van het in het eerste lid vastgestelde basiskinderbijslagbedrag.

      3 De kinderbijslag op grond van het tweede lid, onderdelen b en c, wordt betaald zonder dat dit bij beschikking
      is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002368/2012-01-01#Artikel12
  - number: '13'
    text: |-
      1 De bedragen, genoemd in [artikel 12][ref1], worden al naar gelang de ontwikkeling van het algemene prijsniveau
      verhoogd of verlaagd.

      2 De bedragen, genoemd in [artikel 12][ref2], worden bij ministeriële regeling telkens herzien met ingang van
      1 januari en 1 juli. Bij een herziening met ingang van 1 januari onderscheidenlijk 1 juli worden deze bedragen
      verhoogd of verlaagd met hetzelfde percentage, als waarmede de consumentenprijsindex over de maand oktober daaraan
      voorafgaande onderscheidenlijk over de maand april daaraan voorafgaande, naar boven of naar beneden afwijkt van de
      consumentenprijsindex, waarop de laatste herziening is gebaseerd.

      In afwijking van de eerste volzin blijft herziening per 1 januari onderscheidenlijk per 1 juli achterwege, indien
      de consumentenprijsindex over de maand oktober onderscheidenlijk over de maand april daaraan voorafgaande geen
      afwijking vertoont ten opzichte van de consumentenprijsindex, waarop de laatste herziening is gebaseerd.

      3 De overeenkomstig de vorige leden herziene bedragen treden in de plaats van de bedragen, genoemd in
      [artikel 12][ref3].

      4 Indien daartoe naar Ons oordeel een bijzondere aanleiding bestaat, kunnen de bedragen, genoemd in
      [artikel 12][ref4], bij algemene maatregel van bestuur met ingang van een bij die algemene maatregel van bestuur
      aan te geven datum worden verhoogd. De ingevolge de vorige volzin verhoogde bedragen treden in de plaats van de
      bedragen, genoemd in [artikel 12][ref5].

      5 Indien een verhoging als bedoeld in het vierde lid, samenvalt met een herziening als bedoeld in het tweede lid,
      wordt het kinderbijslagbedrag voorafgaande aan de verhoging herzien en geschiedt de herziening, in afwijking van
      het tweede lid, bij de in het vierde lid bedoelde algemene maatregel van bestuur.

      6 Hetgeen onder consumentenprijsindex, bedoeld in het tweede lid, wordt verstaan, wordt nader bij algemene
      maatregel van bestuur geregeld.

      7 Indien de bedragen, genoemd in [artikel 12][ref6], worden gewijzigd, worden de uit de toepassing van
      [artikel 12, tweede lid][ref7], voortvloeiende bedragen door Onze Minister bekendgemaakt in de *Staatscourant*.

      8 Een herziening van de kinderbijslag op grond van dit artikel vindt plaats zonder dat dit bij beschikking is
      vastgesteld.

      9 De Sociale verzekeringsbank betaalt de herziene kinderbijslag, bedoeld in het achtste lid, bij de eerstvolgende
      betaling van de kinderbijslag nadat de herziening, bedoeld in het tweede lid, heeft plaatsgevonden.


