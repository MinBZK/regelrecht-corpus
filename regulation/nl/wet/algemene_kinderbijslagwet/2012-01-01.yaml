  - number: 24b
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de wijze van tenuitvoerlegging van de
      beschikking waarbij is vastgesteld dat onverschuldigd is betaald.
    url: https://wetten.overheid.nl/BWBR0002368/2012-01-01#Artikel24b
  - number: 24c
    text: |-
      1 In afwijking van [artikel 24, eerste lid][ref1], kan de Sociale verzekeringsbank, op verzoek van de verzekerde,
      dan wel degene met wie hij een huishouding vormt, of de persoon aan wie op grond van de [artikelen 7c][ref2] of
      [21][ref3] kinderbijslag wordt betaald, besluiten gedeeltelijk van terugvordering of gedeeltelijk van verdere
      terugvordering af te zien bij medewerking aan een schuldregeling, indien:

      a. redelijkerwijs te voorzien is dat verzekerde, dan wel degene met wie hij een huishouding vormt, of de persoon
      aan wie op grond van de [artikelen 7c][ref4] of [21][ref5] kinderbijslag wordt betaald niet zal kunnen voortgaan
      met het betalen van zijn schulden of indien hij in de toestand verkeert dat hij heeft opgehouden te betalen;

      b. redelijkerwijs te voorzien is dat een schuldregeling met betrekking tot alle vorderingen, behoudens de in het
      tweede lid bedoelde vorderingen, van de overige schuldeisers zonder een zodanig besluit niet tot stand zal komen;

      c. de vordering van de Sociale verzekeringsbank wegens onverschuldigde betaling ten minste zal worden voldaan naar
      evenredigheid met de vorderingen van de schuldeisers van gelijke rang;

      d. een naar het oordeel van de Sociale verzekeringsbank betrouwbaar voorstel voor een
      schuldregeling tot stand is gekomen door tussenkomst van een schuldhulpverlener als bedoeld in
      [artikel 48 van de Wet op het consumentenkrediet][ref6];

      e. aannemelijk is dat medewerking aan een schuldregeling niet concurrentieverstorend werkt; en

      f. uitdeling in het kader van de schuldregeling plaatsvindt overeenkomstig
      [artikel 349 van de Faillissementswet][ref7].

      2 Het eerste lid is niet van toepassing indien een vordering is ontstaan door het niet nakomen door de verzekerde,
      dan wel degene met wie hij een huishouding vormt, of de persoon aan wie op grond van [artikel 21][ref8]
      kinderbijslag wordt betaald, van de verplichting, bedoeld in [artikel 15][ref9], en hiervoor een boete als bedoeld
      in [artikel 17a][ref10] is opgelegd, dan wel met betrekking tot het niet naleven van die verplichting aangifte is
      gedaan op grond van het [Wetboek van Strafrecht][ref11].

      3 Het besluit tot het afzien van terugvordering of van verdere terugvordering wordt ingetrokken of ten nadele
      van de verzekerde, dan wel degene met wie hij een huishouding vormt, of de persoon aan wie op grond van de
      [artikelen 7c][ref12] of [21][ref13] kinderbijslag wordt betaald gewijzigd indien:

      a. niet binnen twaalf maanden nadat dat besluit is bekendgemaakt, een schuldregeling tot stand is gekomen die
      voldoet aan de eisen, bedoeld in het eerste lid;

      b. de verzekerde, dan wel degene met wie hij een huishouding vormt, of de persoon aan wie op grond van
      [artikel 21][ref14] kinderbijslag wordt betaald zijn schuld aan de Sociale verzekeringsbank niet overeenkomstig de
      schuldregeling voldoet; of

      c. onjuiste of onvolledige gegevens zijn verstrekt en de verstrekking van juiste of volledige gegevens tot een
      ander besluit zou hebben geleid.

      4 Bij ministeriële regeling kunnen met betrekking tot dit artikel nadere regels worden gesteld ten aanzien van de
      bevoegdheid om mee te werken aan schuldregelingen.


