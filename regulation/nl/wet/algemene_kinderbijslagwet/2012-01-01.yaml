  - number: 19a
    text: |-
      1 De Sociale verzekeringsbank schort de betaling van de kinderbijslag op, indien blijkt dat het door de verzekerde
      verstrekte adres van hemzelf of van zijn kind afwijkt van het adres waaronder de verzekerde of het kind in de
      gemeentelijke basisadministratie persoonsgegevens staat ingeschreven.

      2 Geen opschorting vindt plaats:

      a. indien de afwijking redelijkerwijs geen gevolgen kan hebben voor het recht op of de hoogte van de kinderbijslag;

      b. indien de belanghebbende van de afwijking redelijkerwijs geen verwijt kan worden gemaakt.

      3 De Sociale verzekeringsbank doet schriftelijk mededeling van de opschorting aan de verzekerde.

      4 De opschorting wordt beëindigd zodra het aan de Sociale verzekeringsbank gebleken is dat de afwijking niet meer
      bestaat.
    url: https://wetten.overheid.nl/BWBR0002368/2012-01-01#Artikel19a
  - number: '20'
    text: |-
      Indien voor hetzelfde kind kinderbijslag of een naar aard en strekking daarmee overeenkomende gezinsbijslag kan
      worden betaald ingevolge deze wet en ingevolge een rechtens geldende regeling, bestaande in een ander land, of
      ingevolge een regeling van een volkenrechtelijke organisatie, kunnen bij ministeriële regeling regels worden
      gesteld ter voorkoming of beperking van samenloop met dergelijke gezinsbijslagen of ter voorkoming van dubbele
      kinderbijslag.
    url: https://wetten.overheid.nl/BWBR0002368/2012-01-01#Artikel20
  - number: '21'
    text: |-
      De Sociale verzekeringsbank is bevoegd, voor zover nodig na ingewonnen advies van het Landelijk Bureau Inning
      Onderhoudsbijdragen de kinderbijslag voor een kind te betalen aan een ander dan de rechthebbende.
    url: https://wetten.overheid.nl/BWBR0002368/2012-01-01#Artikel21
  - number: 21a
    text: |-
      Voor zover bij of krachtens deze wet niet anders is bepaald, wordt een voorschot op de nog niet vastgestelde
      kinderbijslag beschouwd als kinderbijslag op grond van deze wet.
    url: https://wetten.overheid.nl/BWBR0002368/2012-01-01#Artikel21a
  - number: '22'
    text: |-
      De kinderbijslag die niet in ontvangst is genomen of is ingevorderd binnen drie maanden na de dag van
      betaalbaarstelling, wordt niet meer betaald. De Sociale verzekeringsbank is bevoegd in bijzondere gevallen ten
      gunste van degene aan wie de kinderbijslag wordt betaald af te wijken van de in de eerste volzin genoemde drie
      maanden.
    url: https://wetten.overheid.nl/BWBR0002368/2012-01-01#Artikel22
  - number: '23'
    text: |-
      1 De kinderbijslag is:

      a. onvervreemdbaar;

      b. niet vatbaar voor verpanding of belening;

      c. behoudens voor zoveel dit dient tot verhaal van een uitkering tot levensonderhoud van het kind, of tot
      terugvordering van onverschuldigd betaalde kinderbijslag als bedoeld in [artikel 24][ref1], niet vatbaar
      voor executoriaal of conservatoir beslag noch voor beslag ingevolge faillissement of toepassing van de
      schuldsaneringsregeling natuurlijke personen.

      2 Volmacht tot ontvangst van kinderbijslag, onder welke vorm of welke benaming ook door de verzekerde verleend, is
      steeds herroepelijk.

      3 Elk beding, strijdig met enige bepaling van dit artikel, is nietig.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel24
    url: https://wetten.overheid.nl/BWBR0002368/2012-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '24'
        hoofdstuk: III
        paragraaf: '3'
  - number: '24'
    text: |-
      1 De kinderbijslag die als gevolg van een besluit als bedoeld in [artikel 14a][ref1] onverschuldigd is betaald,
      alsmede hetgeen anderszins onverschuldigd is betaald, wordt door de Sociale verzekeringsbank van de verzekerde, dan
      wel degene met wie hij een huishouding vormt, of de persoon aan wie op grond van [artikel 21][ref2] kinderbijslag
      wordt betaald, teruggevorderd.

      2 In afwijking van het eerste lid kan de Sociale verzekeringsbank besluiten van terugvordering of van verdere
      terugvordering af te zien, indien de verzekerde, dan wel degene met wie hij een huishouding vormt, of de persoon
      aan wie op grond van [artikel 21][ref3] kinderbijslag wordt betaald:

      a. gedurende vijf jaar volledig aan zijn betalingsverplichtingen heeft voldaan;

      b. gedurende vijf jaar niet volledig aan zijn betalingsverplichtingen heeft voldaan, maar het achterstallige bedrag
      over die periode, vermeerderd met de daarover verschuldigde wettelijke rente en de op de invordering betrekking
      hebbende kosten, alsnog heeft betaald;

      c. gedurende vijf jaar geen betalingen heeft verricht en niet aannemelijk is dat hij deze op enig moment zal gaan
      verrichten; of

      d. een bedrag, overeenkomend met ten minste 50% van de restsom in één keer aflost.

      3 De in het tweede lid, onder a en b, genoemde termijn is drie jaar indien:

      a. het gemiddeld inkomen van de belanghebbende in die periode de beslagvrije voet bedoeld in de
      [artikelen 475c][ref4] en [475d van het Wetboek van Burgerlijke Rechtsvordering][ref5] niet te boven is gegaan; en

      b. de terugvordering niet het gevolg is van het niet of niet behoorlijk nakomen van de verplichting, bedoeld in
      [artikel 15][ref6].

      4 Indien daarvoor dringende redenen aanwezig zijn kan de Sociale verzekeringsbank besluiten geheel of gedeeltelijk
      van terugvordering af te zien.

      5 Degene van wie wordt teruggevorderd is verplicht desgevraagd aan de Sociale verzekeringsbank de inlichtingen te
      verstrekken die voor de terugvordering van belang zijn.

      6 In afwijking van het eerste lid kan de Sociale verzekeringsbank, onder voorwaarden die Onze Minister kan stellen,
      besluiten van terugvordering af te zien indien het terug te vorderen bedrag een door Onze Minister vast te stellen
      bedrag niet te boven gaat.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel14a
