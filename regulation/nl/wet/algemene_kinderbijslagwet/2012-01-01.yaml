  - number: '25'
    text: |-
      1 Indien over een tijdvak, waarover krachtens de [Wet studiefinanciering 2000][ref1] aan een kind
      studiefinanciering is verleend, naderhand ten behoeve van dat kind recht op kinderbijslag wordt vastgesteld, is
      de Sociale verzekeringsbank bevoegd die kinderbijslag over dat tijdvak en over latere tijdvakken, in plaats van
      aan degene aan wie de kinderbijslag zou dienen te worden betaald, zonder diens machtiging tot het bedrag van de
      betaalde studiefinanciering over dat tijdvak te betalen aan Onze Minister van Onderwijs, Cultuur en Wetenschap.

      2 Van de in het eerste lid bedoelde bevoegdheid kan de Sociale verzekeringsbank gebruik maken tot en met twee
      kalenderjaren na de vaststelling van het recht op kinderbijslag.

      3 Hetgeen in het eerste en het tweede lid is bepaald ten aanzien van studiefinanciering,
      verleend krachtens de [Wet studiefinanciering 2000][ref2], is van overeenkomstige toepassing ten
      aanzien van een tegemoetkoming in de onderwijsbijdrage en de schoolkosten, verleend krachtens
      [hoofdstuk 4 van de Wet tegemoetkoming onderwijsbijdrage en schoolkosten][ref3].

      4 De Sociale verzekeringsbank kan aan een verzekerde ten onrechte betaalde kinderbijslag verrekenen met een
      tegemoetkoming waarop een verzekerde ten behoeve van hetzelfde kind op grond van [artikel 3, eerste lid][ref4],
      juncto [artikel 9, van de Kaderwet SZW-subsidies][ref5] en de daarop berustende bepalingen, aanspraak maakt.


      [ref1]: https://wetten.overheid.nl/BWBR0011453
