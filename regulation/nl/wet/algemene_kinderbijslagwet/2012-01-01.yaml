    text: Ingezetene in de zin van deze wet is degene, die in Nederland woont.
    url: https://wetten.overheid.nl/BWBR0002368/2012-01-01#Artikel2
  - number: '3'
    text: |-
      1 Waar iemand woont en waar een lichaam gevestigd is, wordt naar de omstandigheden beoordeeld.

      2 Voor de toepassing van het eerste lid worden schepen welke in Nederland hun thuishaven hebben, ten opzichte van
      de bemanning als deel van Nederland beschouwd.

      3 Hij die Nederland metterwoon heeft verlaten en binnen een jaar nadien metterwoon terugkeert zonder inmiddels in
      Aruba, Curaçao, Sint Maarten, de openbare lichamen Bonaire, Sint Eustatius en Saba, of op het grondgebied van een
      andere Mogendheid te hebben gewoond, wordt ook voor de duur van zijn afwezigheid geacht in Nederland te hebben
      gewoond.
    url: https://wetten.overheid.nl/BWBR0002368/2012-01-01#Artikel3
  - number: '4'
    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt verstaan onder kind: eigen kind, aangehuwd kind of
      pleegkind.

      2 Als eigen kind wordt beschouwd het kind

      a. van de vrouw die op grond van [artikel 198 van Boek 1 van het Burgerlijk Wetboek][ref1] als zijn moeder wordt
      aangemerkt;

      b. van de man die op grond van [artikel 199 van Boek 1 van het Burgerlijk Wetboek][ref2] als zijn vader wordt
      aangemerkt;

      c. van de man die op grond van [artikel 394 van Boek 1 van het Burgerlijk Wetboek][ref3] verplicht
      is bij te dragen aan de kosten van verzorging en opvoeding, tenzij het kind reeds op grond van
      [artikel 199 van Boek 1 van het Burgerlijk Wetboek][ref4] als eigen kind van een andere man wordt aangemerkt;

      d. van de man wiens biologisch vaderschap door middel van DNA-onderzoek is vastgesteld, mits de man het kind
      feitelijk in relevante mate onderhoudt en het kind niet reeds tot een andere man in een familierechtelijke
      vaderschapsrelatie staat;

      e. van de man die na toepassing van Nederlands internationaal privaatrecht tot het kind in een familierechtelijke
      vaderschapsrelatie staat.

      3 Als pleegkind wordt beschouwd het kind dat als eigen kind wordt onderhouden en opgevoed.

      4 Bij ministeriële regeling kan worden bepaald in welke gevallen een kind met een pleegkind wordt gelijkgesteld.


