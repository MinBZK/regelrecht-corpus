        artikel: '7'
        hoofdstuk: III
        paragraaf: '1'
  - number: 41b
    text: |-
      1 In afwijking van [artikel 12, eerste lid][ref1], geldt voor een kind dat is geboren vóór 1 januari 1995, artikel
      12, eerste tot en met vijfde lid, zoals dit op 31 december 1994 luidde.

      2 [Artikel 13][ref2] is van overeenkomstige toepassing ten aanzien van de rangordebedragen, bedoeld in
      [artikel 12, vierde lid, onderdeel b, c en d][ref3], zoals dat artikel luidde op 31 december 1994.

      3 Bij de toepassing van het eerste lid is het rangordebedrag voor het eerste kind gelijk aan het bedrag, bedoeld in
      [artikel 12, eerste lid][ref4].


