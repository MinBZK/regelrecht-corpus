  - number: '18'
    text: |-
      1 De Sociale verzekeringsbank betaalt de kinderbijslag zo spoedig mogelijk, doch uiterlijk binnen drie maanden na
      afloop van het kwartaal waarover recht op kinderbijslag bestaat.

      2 Indien twee personen, die gezamenlijk een huishouden vormen, over eenzelfde tijdvak recht op kinderbijslag voor
      eenzelfde kind hebben, wordt de kinderbijslag uitbetaald aan degene van hen die zij gezamenlijk daartoe hebben
      aangewezen.

      3 Bij gebreke van een gezamenlijke aanwijzing als bedoeld in het tweede lid bepaalt de Sociale verzekeringsbank aan
      welke persoon de kinderbijslag wordt uitbetaald.

      4 Indien twee of meer personen waaronder één persoon tot wiens huishouden het kind behoort, over eenzelfde tijdvak
      recht op kinderbijslag voor eenzelfde kind hebben, wordt de kinderbijslag waarop degene recht heeft, tot wiens
      huishouden dit kind niet behoort, niet betaald.

      5 Indien twee of meer personen over eenzelfde tijdvak recht hebben op kinderbijslag voor eenzelfde kind, in andere
      situaties dan bedoeld in het tweede en vierde lid, wordt betaald de kinderbijslag waarop degene recht heeft die de
      hoogste bijdrage in het onderhoud van dit kind levert. Aan de andere personen wordt geen kinderbijslag uitbetaald.

      6 Bij algemene maatregel van bestuur kunnen met betrekking tot situaties van samenloop, bedoeld in het tweede,
      vierde en vijfde lid, nadere en aanvullende regels worden gesteld waarbij bepaald kan worden dat aan een ander
      persoon de kinderbijslag wordt uitbetaald dan de persoon, bedoeld in het vierde en vijfde lid.

      7 De kinderbijslag die op grond van het tweede tot en met zesde lid aan een verzekerde wordt betaald, kan op
      verzoek van die verzekerde in gedeelten aan meer verzekerden worden betaald.

      8 Indien de kinderbijslag in het buitenland wordt uitbetaald, geschiedt de betaling in afwijking van
      [artikel 4:89, derde lid, van de Algemene wet bestuursrecht][ref1] op het tijdstip waarop de rekening van de
      daartoe door de schuldeiser aangewezen bank wordt gecrediteerd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel489
    url: https://wetten.overheid.nl/BWBR0002368/2012-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:89
  - number: '19'
    text: |-
      De Sociale verzekeringsbank schort de betaling van de kinderbijslag op of schorst de betaling, indien zij op grond
      van duidelijke aanwijzingen van oordeel is of het gegronde vermoeden heeft, dat:

      a. het recht op kinderbijslag niet of niet meer bestaat;

      b. recht op een lagere kinderbijslag bestaat, of

      c. de verzekerde, alsmede de persoon aan wie of de instelling aan welke op grond van [artikel 21][ref1]
      kinderbijslag wordt betaald, een verplichting hem of haar op grond van de [artikelen 15][ref2] en [16][ref3]
      opgelegd, niet is nagekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0002368#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0002368#Artikel16
