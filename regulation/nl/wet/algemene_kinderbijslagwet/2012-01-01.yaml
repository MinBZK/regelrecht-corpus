  - number: '7'
    text: |-
      1 De verzekerde heeft overeenkomstig de bepalingen van deze wet recht op kinderbijslag voor een kind dat:

      a. jonger is dan 16 jaar en tot zijn huishouden behoort, of

      b. jonger is dan 18 jaar en door hem in belangrijke mate wordt onderhouden.

      2 De verzekerde heeft voor een kind van 16 of 17 jaar slechts recht op kinderbijslag indien:

      a. de verzekerde heeft voldaan aan de verplichtingen, bedoeld in de [artikelen 2, eerste lid][ref1], en
      [4a, eerste lid, van de Leerplichtwet 1969][ref2], dan wel daarvan op grond van [die wet][ref3] is vrijgesteld;

      b. het kind na het behalen van een startkwalificatie als bedoeld in
      [artikel 1, onderdeel f, van de Leerplichtwet 1969][ref4] op lichamelijke of psychische
      gronden niet geschikt is om tot een school onderscheidenlijk een instelling te worden
      toegelaten dan wel een vervolgstudie volgt anders dan hoger onderwijs als bedoeld in
      [artikel 1.1, onderdeel b, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref5];

      c. het kind als leerling of deelnemer van een met een school of instelling als bedoeld in
      [artikel 4a van de Leerplichtwet 1969][ref6] vergelijkbare inrichting van onderwijs buiten Nederland
      staat ingeschreven en deze inrichting geregeld bezoekt, dan wel met overeenkomstige toepassing van de
      vrijstellingsgronden van [die wet][ref7] van die verplichtingen is vrijgesteld;

      d. het kind werkloos is.

      3 Een kind als bedoeld in het eerste lid, onderdeel b, wordt voor het vaststellen van het aantal kinderen voor
      wie recht op kinderbijslag bestaat voor twee kinderen geteld, indien het door de verzekerde grotendeels wordt
      onderhouden en

      a. jonger is dan 16 jaar en

      1°. door of in verband met het volgen van onderwijs of een beroepsopleiding niet tot het huishouden van de
      verzekerde noch als eigen kind, aangehuwd kind of pleegkind tot het huishouden van een ander behoort, of

      2°. in verband met ziekte of gebreken niet tot het huishouden van de verzekerde noch als eigen kind, aangehuwd kind
      of pleegkind tot het huishouden van een ander behoort, of

      b. 16 of 17 jaar is en niet tot het huishouden van de verzekerde noch als eigen kind, aangehuwd kind of pleegkind
      tot het huishouden van een ander behoort.

      4 Voor het vaststellen van de mate waarin een kind door de verzekerde wordt onderhouden worden:

      a. het inkomen van het kind geacht te zijn aangewend voor het onderhoud van het kind, en

      b. bijdragen in het onderhoud van het kind geleverd door degene met wie de verzekerde een huishouden vormt en
      degene met wie de verzekerde geen huishouden vormt, maar die krachtens overeenkomst of rechterlijke uitspraak
      verplicht is bijdragen te leveren voor levensonderhoud ten behoeve van dat kind, aangemerkt als door de verzekerde
      in het onderhoud van dat kind geleverde bijdragen.

      5 Bij of krachtens algemene maatregel van bestuur worden regels gesteld naar welke wordt beoordeeld of een kind in
      belangrijke mate of grotendeels door de verzekerde wordt onderhouden.

      6 Voor de toepassing van dit artikel wordt het kind geacht de studie of beroepsopleiding eerst na de vakantie te
      hebben beëindigd, indien:

      a. de studie of de beroepsopleiding wordt beëindigd tijdens een door de onderwijsinstelling vastgestelde vakantie,
      dan wel

      b. de studie of de beroepsopleiding wordt afgesloten met een eindexamen, dat kort voor het begin van het laatste
      door de onderwijsinstelling vastgestelde vakantie van het desbetreffende schooljaar wordt afgelegd.

      7 Een kind als bedoeld in het tweede lid, onderdeel d, wordt als werkloos aangemerkt indien het:

      a. een startkwalificatie heeft behaald; en

      b. als werkzoekende is geregistreerd bij het Uitvoeringsinstituut werknemersverzekeringen.

      8 Een in het buitenland woonachtig kind dat een startkwalificatie heeft behaald dan wel een vorm van onderwijs
      heeft afgerond die vergelijkbaar is met het behalen van een startkwalificatie wordt als werkloos aangemerkt indien
      het als werkzoekende is geregistreerd bij een met het Uitvoeringsinstituut werknemersverzekeringen vergelijkbare
      instelling dan wel bij het ontbreken van een dergelijke instelling aannemelijk kan maken dat het werkloos is en
      beschikbaar is voor de arbeidsmarkt.

      9 Een kind als bedoeld in het tweede lid, onderdeel d, wordt voor het recht op kinderbijslag meegerekend zolang het
      werkloos is.

      10 Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot nadere invulling van het tweede
      lid, vierde lid, onderdeel a, zevende lid en achtste lid.


