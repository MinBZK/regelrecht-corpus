  - number: '14'
    text: |-
      1 De Sociale verzekeringsbank stelt op aanvraag vast of een recht op kinderbijslag bestaat.

      2 Een aanvraag wordt ingediend door middel van een door de Sociale verzekeringsbank beschikbaar gesteld
      aanvraagformulier.

      3 Het recht op kinderbijslag kan niet vroeger ingaan dan een jaar voorafgaand aan de eerste dag van het
      kalenderkwartaal tijdens welk de aanvraag om kinderbijslag werd ingediend. De Sociale verzekeringsbank is bevoegd
      in bijzondere gevallen af te wijken van het bepaalde in de vorige volzin.

      4 Indien de verzekerde nalaat een aanvraag om kinderbijslag in te dienen, kan deze aanvraag worden ingediend door
      het Landelijk Bureau Inning Onderhoudsbijdragen, dat tevens adviseert aan wie de kinderbijslag wordt betaald.
    url: https://wetten.overheid.nl/BWBR0002368/2012-01-01#Artikel14
  - number: 14a
    text: |-
      1 Onverminderd het elders in deze wet bepaalde terzake van herziening of intrekking van een besluit tot toekenning
      van kinderbijslag en terzake van weigering van kinderbijslag, herziet de Sociale verzekeringsbank een dergelijk
      besluit of trekt zij dat in:

      a. indien het niet of niet behoorlijk nakomen van een verplichting op grond van [artikel 15][ref1] of [16][ref2]
      heeft geleid tot het ten onrechte of tot een te hoog bedrag verlenen van kinderbijslag;

      b. indien anderszins de kinderbijslag ten onrechte of tot een te hoog bedrag is verleend;

      c. indien het niet of niet behoorlijk nakomen van een verplichting op grond van [artikel 15][ref3] of [16][ref4]
      ertoe leidt dat niet kan worden vastgesteld of nog recht op kinderbijslag bestaat.

      2 Indien daarvoor dringende redenen aanwezig zijn kan de Sociale verzekeringsbank besluiten geheel of gedeeltelijk
      van herziening of intrekking af te zien.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel15
