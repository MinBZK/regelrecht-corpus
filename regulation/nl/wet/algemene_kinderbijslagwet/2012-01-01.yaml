  - number: 17a
    text: |-
      1 De Sociale verzekeringsbank legt een bestuurlijke boete op van ten hoogste € 2 269 ter zake van het niet of niet
      behoorlijk nakomen door de verzekerde, of de persoon aan wie op grond van [artikel 21][ref1] kinderbijslag wordt
      betaald, van de verplichting, bedoeld in [artikel 15][ref2].

      2 De Sociale verzekeringsbank kan afzien van het opleggen van een bestuurlijke boete als bedoeld in het eerste lid
      en volstaan met het geven van een schriftelijke waarschuwing ter zake van het niet of niet behoorlijk nakomen van
      de verplichting, bedoeld in [artikel 15][ref3], indien dit niet heeft geleid tot het ten onrechte of tot een te
      hoog bedrag verlenen van kinderbijslag, tenzij het niet of niet behoorlijk nakomen van de verplichting plaatsvindt
      binnen een periode van twee jaar te rekenen vanaf de datum waarop eerder aan de verzekerde, of de persoon aan wie
      op grond van [artikel 21][ref4] kinderbijslag wordt betaald, een zodanige waarschuwing is gegeven.

      3 De Sociale verzekeringsbank kan afzien van het opleggen van een bestuurlijke boete indien daarvoor dringende
      redenen aanwezig zijn.

      4 Degene aan wie een bestuurlijke boete is opgelegd is verplicht desgevraagd aan de Sociale verzekeringsbank de
      inlichtingen te verstrekken die voor de tenuitvoerlegging van de bestuurlijke boete van belang zijn.

      5 Bij algemene maatregel van bestuur worden nadere regels gesteld over de hoogte van de bestuurlijke boete.


