  - number: 7b
    text: |-
      1 Geen recht op kinderbijslag heeft de verzekerde die op de eerste dag van een kalenderkwartaal niet in Nederland
      woont. Evenmin heeft de verzekerde recht op kinderbijslag ten behoeve van het kind, indien dat kind op de eerste
      dag van een kalenderkwartaal niet in Nederland woont.

      2 Het eerste lid is niet van toepassing indien de verzekerde dan wel dat kind op de eerste dag van een
      kalenderkwartaal woont in een land waarin op grond van een verdrag of een besluit van een volkenrechtelijke
      organisatie recht op kinderbijslag kan bestaan.

      3 Het eerste lid is niet van toepassing op de verzekerde indien hij dan wel het kind op de eerste dag van een
      kalenderkwartaal niet in Nederland woont doch langer dan drie maanden onafgebroken in Nederland verblijft.

      4 Bij of krachtens algemene maatregel van bestuur kan worden bepaald dat recht bestaat op kinderbijslag voor:

      a. de verzekerde, die werkzaamheden verricht in het algemeen belang en niet in Nederland woont;

      b. de verzekerde, die in Aruba, Curaçao, Sint Maarten of in de openbare lichamen Bonaire, Sint Eustatius en Saba
      woont; of

      c. de gezinsleden van de in de onderdelen a of b bedoelde verzekerde.

      5 Onze Minister deelt mede in welke landen op grond van een verdrag of een besluit van een volkenrechtelijke
      organisatie recht op kinderbijslag kan bestaan. In deze mededeling wordt tevens opgenomen:

      a. de vindplaats van het desbetreffende verdrag of besluit, en

      b. de eventueel in dat verdrag of besluit aanwezige beperkingen.
    url: https://wetten.overheid.nl/BWBR0002368/2012-01-01#Artikel7b
  - number: 7c
    text: |-
      1 De persoon die tot op de dag voor inwerkingtreding van de wet van 22 december 2005 tot wijziging van enige
      socialeverzekeringswetten in verband met de beëindiging van de verzekeringsplicht van in het buitenland
      wonende uitkeringsgerechtigden (Stb. 718) voortgezet verzekerd was op grond van artikel 27, eerste lid, van het
      [Besluit uitbreiding en beperking kring verzekerden volksverzekeringen 1999][ref1], zoals dat artikellid op die dag
      luidde, en op die dag nog recht op kinderbijslag had, behoudt recht op kinderbijslag, zolang het jongste kind voor
      wie de betrokkene voor 31 december 1999 recht had op kinderbijslag de leeftijd van 18 jaar nog niet heeft bereikt.

      2 Het recht op kinderbijslag, bedoeld in het eerste lid, eindigt, indien hij:

      a. niet langer een uitkering, pensioen of toelage ontvangt als bedoeld in
      [artikel 26, eerste lid, van het Besluit uitbreiding en beperking kring verzekerden volksverzekeringen 1999][ref2],
      zoals dat artikellid op 31 december 1999 luidde;

      b. buiten Nederland arbeid verricht;

      c. een uitkering ontvangt krachtens een buitenlandse wettelijke regeling; of

      d. op grond van deze wet geen recht op kinderbijslag meer bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0010182
      [ref2]: https://wetten.overheid.nl/BWBR0010182#Artikel26
