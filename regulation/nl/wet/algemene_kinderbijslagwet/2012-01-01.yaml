  - number: '17'
    text: |-
      1 De Sociale verzekeringsbank weigert de kinderbijslag tijdelijk of blijvend, geheel of gedeeltelijk
      indien de verzekerde of de persoon aan wie op grond van [artikel 21][ref1] kinderbijslag wordt
      betaald, een verplichting op grond van [artikel 16][ref2] opgelegd, of de verplichting, bedoeld in
      [artikel 55, tweede lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref3], niet of niet
      behoorlijk is nagekomen, dan wel de verplichting, bedoeld in [artikel 15][ref4] niet binnen de door de Sociale
      verzekeringsbank daarvoor vastgestelde termijn is nagekomen.

      2 Een maatregel als bedoeld in het eerste lid wordt afgestemd op de ernst van de gedraging en de mate waarin de
      verzekerde dan wel de persoon aan wie op grond van [artikel 21][ref5] kinderbijslag wordt betaald, de gedraging
      verweten kan worden. Van het opleggen van een maatregel wordt in elk geval afgezien, indien elke vorm van
      verwijtbaarheid ontbreekt.

      3 De Sociale verzekeringsbank kan afzien van het opleggen van een maatregel als bedoeld in het eerste lid en
      volstaan met het geven van een schriftelijke waarschuwing ter zake van het niet tijdig nakomen van de verplichting,
      bedoeld in [artikel 15][ref6], indien het niet tijdig nakomen van de verplichting niet heeft geleid tot het ten
      onrechte of tot een te hoog bedrag verlenen van kinderbijslag, tenzij het niet tijdig nakomen van de verplichting
      plaatsvindt binnen een periode van twee jaar te rekenen vanaf de datum waarop eerder aan de verzekerde, of de
      persoon aan wie op grond van [artikel 21][ref7] kinderbijslag wordt betaald, een zodanige waarschuwing is gegeven.

      4 De Sociale verzekeringsbank kan afzien van het opleggen van een maatregel indien daarvoor dringende redenen
      aanwezig zijn.

      5 Het opleggen van een maatregel blijft achterwege indien voor dezelfde gedraging een bestuurlijke boete als
      bedoeld in [artikel 17a][ref8] wordt opgelegd.

      6 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot het eerste en
      tweede lid.


