  - number: 29c
    text: |-
      1 Een beschikking op grond van deze wet en de daarop berustende bepalingen wordt gegeven binnen een redelijke
      termijn na ontvangst van de aanvraag.

      2 De redelijke termijn is in ieder geval verstreken wanneer binnen acht weken na ontvangst van de aanvraag geen
      beschikking is gegeven, noch een kennisgeving als bedoeld in het derde lid is gedaan.

      3 Indien een beschikking niet binnen de termijn van acht weken kan worden gegeven, wordt die termijn met een
      redelijke termijn verlengd en wordt de aanvrager daarvan schriftelijk in kennis gesteld.
    url: https://wetten.overheid.nl/BWBR0002368/2012-01-01#Artikel29c
  - number: 29d
    text: |-
      In afwijking van [artikel 7:3 van de Algemene wet bestuursrecht][ref1] kan van het horen van een belanghebbende
      worden afgezien indien de belanghebbende niet binnen een door de Sociale verzekeringsbank gestelde redelijke
      termijn, verklaart dat hij gebruik wil maken van het recht te worden gehoord.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel73
    url: https://wetten.overheid.nl/BWBR0002368/2012-01-01#Artikel29d
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 7:3
  - number: '30'
    text: |-
      In afwijking van [artikel 7:10, eerste lid, van de Algemene wet bestuursrecht][ref1] beslist de Sociale
      verzekeringsbank binnen dertien weken gerekend vanaf de dag na die waarop de termijn voor het indienen van het
      bezwaarschrift is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel710
    url: https://wetten.overheid.nl/BWBR0002368/2012-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 7:10
  - number: '31'
    text: |-
      1 Tegen uitspraken van de Centrale Raad van Beroep kan ieder der partijen beroep in cassatie instellen ter zake van
      schending of verkeerde toepassing van het bepaalde bij of krachtens [artikel 2][ref1], [3][ref2] of [6][ref3].

      2 Op dit beroep zijn de voorschriften betreffende het beroep in cassatie tegen uitspraken van de gerechtshoven
      inzake beroepen in belastingzaken van overeenkomstige toepassing, waarbij de Centrale Raad van Beroep de plaats
      inneemt van een gerechtshof.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002368#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0002368#Artikel6
    url: https://wetten.overheid.nl/BWBR0002368/2012-01-01#Artikel31
    references:
