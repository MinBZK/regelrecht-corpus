preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is regelen vast te stellen inzake een algemene, de gehele
    bevolking omvattende, verplichte kinderbijslagverzekering;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002368/2012-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Voor de toepassing van deze wet en van de tot haar uitvoering genomen besluiten wordt verstaan onder:

      a. Onze Minister: Onze Minister van Sociale Zaken en Werkgelegenheid;

      b. lichamen: rechtspersonen, maat- en vennootschappen, samenwerkingsvormen zonder rechtspersoonlijkheid die met
      verenigingen maatschappelijk gelijk kunnen worden gesteld, ondernemingen van publiekrechtelijke rechtspersonen
      en doelvermogens;

      c. vreemdeling: hetgeen daaronder wordt verstaan in de [Vreemdelingenwet 2000][ref1];

      d. continentaal plat: de exclusieve economische zone van het Koninkrijk, bedoeld in
      [artikel 1 van de Rijkswet instelling exclusieve economische zone][ref2], voor zover deze grenst aan de
      territoriale zee van Nederland.


