---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: algemene_kinderbijslagwet
regulatory_layer: WET
publication_date: '2020-07-08'
valid_from: '2004-03-01'
bwb_id: BWBR0002368
url: https://wetten.overheid.nl/BWBR0002368/2004-03-01
preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is regelen vast te stellen inzake een algemene, de gehele
    bevolking omvattende, verplichte kinderbijslagverzekering;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'Voor de toepassing van deze wet en van de tot haar uitvoering genomen besluiten wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel1
  - number: 1.a
    text: 'Onze Minister: Onze Minister van Sociale Zaken en Werkgelegenheid;'
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel1
  - number: 1.b
    text: |-
      lichamen: rechtspersonen, maat- en vennootschappen, samenwerkingsvormen zonder rechtspersoonlijkheid die met
      verenigingen maatschappelijk gelijk kunnen worden gesteld, ondernemingen van publiekrechtelijke rechtspersonen
      en doelvermogens;
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel1
  - number: 1.c
    text: |-
      vreemdeling: hetgeen daaronder wordt verstaan in de [Vreemdelingenwet 2000][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0011823
  - number: '2'
    text: Ingezetene in de zin van deze wet is degene, die in Nederland woont.
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel2
  - number: '3.1'
    text: Waar iemand woont en waar een lichaam gevestigd is, wordt naar de omstandigheden beoordeeld.
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel3
  - number: '3.2'
    text: |-
      Voor de toepassing van het eerste lid worden schepen en luchtvaartuigen welke in Nederland hun thuishaven hebben,
      ten opzichte van de bemanning als deel van Nederland beschouwd.
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel3
  - number: '3.3'
    text: |-
      Hij die Nederland metterwoon heeft verlaten en binnen een jaar nadien metterwoon terugkeert zonder inmiddels in de
      Nederlandse Antillen, Aruba of op het grondgebied van een andere Mogendheid te hebben gewoond, wordt ook voor de
      duur van zijn afwezigheid geacht in Nederland te hebben gewoond.
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel3
  - number: 5a
    text: |-
      Bij een besluit ingevolge de [artikelen 14, vierde lid][ref1], en [21][ref2] is mede belanghebbende het Landelijk
      Bureau Inning Onderhoudsbijdragen.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0002368#Artikel21
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '14'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002368
        artikel: '21'
        hoofdstuk: III
        paragraaf: '3'
  - number: '6.1'
    text: Verzekerd overeenkomstig de bepalingen van deze wet is degene, die
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel6
  - number: 6.1.a
    text: ingezetene is;
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel6
  - number: 6.1.b
    text: |-
      geen ingezetene is, doch ter zake van in Nederland in dienstbetrekking verrichte arbeid aan de loonbelasting is
      onderworpen.
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel6
  - number: '6.2'
    text: |-
      Niet verzekerd is de vreemdeling die niet rechtmatig in Nederland verblijf houdt in de zin van
      [artikel 8, onder a tot en met e en l, van de Vreemdelingenwet 2000][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: '6.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan, in afwijking van het eerste en tweede lid, uitbreiding dan wel
      beperking worden gegeven aan de kring der verzekerden.
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel6
  - number: '6.4'
    text: 'Bij een maatregel, als bedoeld in het derde lid, kan worden afgeweken van het tweede lid ten aanzien van:'
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel6
  - number: 6.4.a
    text: vreemdelingen die rechtmatig in Nederland arbeid verrichten, dan wel hebben verricht;
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel6
  - number: 6.4.b
    text: |-
      vreemdelingen die, na rechtmatig verblijf te hebben gehouden in de zin van
      [artikel 8, onder a tot en met e en l, van de Vreemdelingenwet 2000][ref1], rechtmatig in Nederland verblijf hebben
      als bedoeld in [artikel 8, onder g of h, van de Vreemdelingenwet 2000][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 6a
    text: |-
      Zo nodig in afwijking van [artikel 6][ref1] en de daarop berustende bepalingen:


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel6
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '6'
        hoofdstuk: II
  - number: 6a.a
    text: |-
      wordt als verzekerde aangemerkt de persoon van wie de verzekering op grond van deze wet voortvloeit uit de
      toepassing van bepalingen van een verdrag of van een besluit van een volkenrechtelijke organisatie;
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel6a
  - number: 6a.b
    text: |-
      wordt niet als verzekerde aangemerkt de persoon op wie op grond van een verdrag of een besluit van een
      volkenrechtelijke organisatie de wetgeving van een andere mogendheid van toepassing is.
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel6a
  - number: '7.1'
    text: |-
      De verzekerde heeft overeenkomstig de bepalingen van deze wet recht op kinderbijslag voor een eigen kind, een
      aangehuwd kind en een pleegkind dat
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel7
  - number: 7.1.a
    text: jonger is dan 16 jaar en tot zijn huishouden behoort, of
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel7
  - number: 7.1.b
    text: jonger is dan 18 jaar en door hem in belangrijke mate wordt onderhouden.
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel7
  - number: '7.2'
    text: De verzekerde heeft voor een kind van 16 of 17 jaar slechts recht op kinderbijslag indien het kind
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel7
  - number: 7.2.a
    text: |-
      in verband met onderwijs of een beroepsopleiding lessen of stages volgt gedurende gemiddeld tenminste 213 klokuren
      per kwartaal, of
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel7
  - number: 7.2.b
    text: |-
      als rechtstreeks en medisch vast te stellen gevolg van ziekte of gebreken buiten staat is om 55 percent te
      verdienen van hetgeen een lichamelijk en geestelijk gezond kind, dat overigens in gelijke omstandigheden verkeert,
      kan verdienen, en daartoe ook hetzij in het afgelopen jaar buiten staat is geweest hetzij vermoedelijk in het
      eerstkomende jaar buiten staat zal zijn, of
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel7
  - number: 7.2.c
    text: werkloos is.
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel7
  - number: '7.3'
    text: |-
      Een kind, bedoeld in het eerste lid, onderdeel b, wordt voor het vaststellen van het aantal kinderen voor wie recht
      op kinderbijslag bestaat voor twee kinderen geteld, indien het door de verzekerde grotendeels wordt onderhouden en
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel7
  - number: 7.3.a
    text: jonger is dan 16 jaar en
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel7
  - number: 7.3.a.i°
    text: |-
      door of in verband met het volgen van onderwijs of een beroepsopleiding niet tot het huishouden van de verzekerde
      noch als eigen kind, aangehuwd kind of pleegkind tot het huishouden van een ander behoort, of
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel7
  - number: 7.3.a.ii
    text: |-
      in verband met ziekte of gebreken niet tot het huishouden van de verzekerde behoort noch als eigen kind, aangehuwd
      of pleegkind tot het huishouden van een ander behoort, of
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel7
  - number: 7.3.b
    text: |-
      16 of 17 jaar is en niet tot het huishouden van de verzekerde behoort noch als eigen kind, aangehuwd kind of
      pleegkind tot het huishouden van een ander.
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel7
  - number: '7.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld naar welke wordt beoordeeld of een
      kind in belangrijke mate of grotendeels door de verzekerde wordt onderhouden.
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel7
  - number: '7.5'
    text: 'Voor de toepassing van dit artikel wordt indien:'
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel7
  - number: 7.5.a
    text: |-
      de studie of de beroepsopleiding wordt beëindigd tijdens of bij het begin van een door de onderwijsinstelling
      vastgestelde vakantie, dan wel
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel7
  - number: 7.5.b
    text: |-
      de studie of de beroepsopleiding wordt afgesloten met een eindexamen, dat kort voor het begin van de laatste door
      de onderwijsinstelling vastgestelde vakantie van het desbetreffende studiejaar wordt afgelegd, het kind geacht de
      studie of beroepsopleiding eerst na die vakantie te hebben beëindigd.
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel7
  - number: '7.6'
    text: |-
      Een in het tweede lid, onderdeel c, bedoeld kind wordt niet als werkloos aangemerkt, indien dat kind zijn
      voor werkzaamheden beschikbare tijd voor ten minste 19 uur per week besteedt aan het verrichten van arbeid in
      dienstbetrekking dan wel in de zelfstandige uitoefening van zijn beroep, of terzake van deze werkzaamheden een
      uitkering ontvangt ingevolge de [Werkloosheidswet][ref1] (Stb. 1987, 93). Een in het tweede lid, onderdeel c,
      bedoeld kind wordt voorts niet als werkloos aangemerkt, indien dat kind een passende dienstbetrekking als bedoeld
      in de vorige volzin niet heeft aanvaard of door eigen toedoen niet heeft verkregen of behouden.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0004045
  - number: '7.7'
    text: |-
      Een in het tweede lid, onderdeel c, bedoeld kind wordt slechts als werkloos aangemerkt, indien en zolang het bij
      de Centrale organisatie werk en inkomen als werkzoekende is geregistreerd. Deze inschrijving dient binnen een
      redelijke termijn plaats te vinden.
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel7
  - number: '7.8'
    text: |-
      Een in het tweede lid, onderdeel c, bedoeld kind wordt als werkloos aangemerkt indien en zolang het bij de Centrale
      organisatie werk en inkomen als werkzoekende is geregistreerd. Deze registratie dient binnen een redelijke termijn
      plaats te vinden. In geval dat kind wegens ziekte niet beschikbaar is om arbeid te aanvaarden wordt dat kind als
      werkloos aangemerkt zolang de ziekte voortduurt voor een periode van ten hoogste zes maanden.
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel7
  - number: '7.9'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de toepassing van de voorgaande
      leden.
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel7
  - number: '7.10'
    text: Een kind wordt als pleegkind beschouwd, indien het als een eigen kind wordt onderhouden en opgevoed.
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel7
  - number: '7.11'
    text: |-
      Bij ministeriële regeling kunnen nadere en zo nodig afwijkende regels worden gesteld met betrekking tot het tweede
      lid, onderdeel a.
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel7
  - number: 7a.1
    text: |-
      De verzekerde heeft geen recht op kinderbijslag overeenkomstig de bepalingen van deze wet voor een eigen kind,
      een aangehuwd kind of een pleegkind, indien dat kind op de eerste dag van een kalenderkwartaal recht heeft op
      studiefinanciering op grond van de [Wet studiefinanciering 2000][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011453
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0011453
  - number: 7a.2
    text: |-
      Ook bestaat geen recht op kinderbijslag zolang op een verzoek tot het treffen van een voorlopige voorziening als
      bedoeld in [titel 8.3 van de Algemene wet bestuursrecht][ref1], ingediend door degene die studiefinanciering op
      grond van de [Wet studiefinanciering 2000][ref2] heeft aangevraagd, geen uitspraak is gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
      [ref2]: https://wetten.overheid.nl/BWBR0011453
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0005537
      - id: ref2
        bwb_id: BWBR0011453
  - number: 7b.1
    text: |-
      Geen recht op kinderbijslag heeft de verzekerde die op de eerste dag van een kalenderkwartaal niet in Nederland
      woont. Evenmin heeft de verzekerde recht op kinderbijslag ten behoeve van het eigen kind, het aangehuwde kind of
      het pleegkind, indien dat kind op de eerste dag van een kalenderkwartaal niet in Nederland woont.
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel7b
  - number: 7b.2
    text: |-
      Het eerste lid is niet van toepassing indien de verzekerde dan wel dat kind op de eerste dag van een
      kalenderkwartaal woont in een land waarin op grond van een verdrag of een besluit van een volkenrechtelijke
      organisatie recht op kinderbijslag kan bestaan.
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel7b
  - number: 7b.3
    text: |-
      Het eerste lid is niet van toepassing op de verzekerde indien hij dan wel het eigen kind, het aangehuwde kind
      of het pleegkind op de eerste dag van een kalenderkwartaal niet in Nederland woont doch langer dan drie maanden
      onafgebroken in Nederland verblijft.
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel7b
  - number: 7b.4
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen ten aanzien van het eerste lid afwijkende regels worden
      gesteld ten gunste van:
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel7b
  - number: 7b.4.a
    text: de verzekerde, die werkzaamheden verricht in het algemeen belang en niet in Nederland woont;
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel7b
  - number: 7b.4.b
    text: de verzekerde, die in de Nederlandse Antillen of Aruba woont; of
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel7b
  - number: 7b.4.c
    text: de gezinsleden van de in de onderdelen a of b bedoelde verzekerde.
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel7b
  - number: 7b.5
    text: |-
      Onze Minister deelt mede in welke landen op grond van een verdrag of een besluit van een volkenrechtelijke
      organisatie recht op kinderbijslag kan bestaan. In deze mededeling wordt tevens opgenomen:
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel7b
  - number: 7b.5.a
    text: de vindplaats van het desbetreffende verdrag of besluit, en
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel7b
  - number: 7b.5.b
    text: de eventueel in dat verdrag of besluit aanwezige beperkingen.
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel7b
  - number: '8'
    text: 'Bij ministeriële regeling kan worden bepaald in welke gevallen:'
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel8
  - number: 8.a
    text: |-
      een kind, te wiens aanzien niet wordt voldaan aan het bepaalde in [artikel 7, tiende lid][ref1], nochtans met een
      pleegkind wordt gelijkgesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel7
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '7'
        hoofdstuk: III
        paragraaf: '1'
  - number: 8.b
    text: een verzekerde geacht wordt met een kind, bedoeld onder *a*, een huishouden te vormen.
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel8
  - number: '9.1'
    text: |-
      Voor het vaststellen van de mate, waarin een eigen kind, een aangehuwd kind, een pleegkind dan wel een met een
      pleegkind gelijkgesteld kind door de verzekerde wordt onderhouden, wordt het inkomen van het kind geacht te zijn
      aangewend voor het onderhoud van dat kind.
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel9
  - number: '9.2'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gegeven ter bepaling van het inkomen van het kind. Tevens kan
      in afwijking van het eerste lid bij ministeriële regeling worden bepaald dat uitkeringen, welke aan de verzekerde
      ten behoeve van het kind worden verstrekt, voor de toepassing van dat lid als inkomen van dat kind worden
      aangemerkt.
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel9
  - number: '10'
    text: |-
      Voor de toepassing van het bepaalde bij en krachtens de [artikelen 7][ref1], [8][ref2] en [9][ref3] worden voor
      het bepalen van de mate waarin een kind door de verzekerde wordt onderhouden, bijdragen in het onderhoud van dat
      kind, geleverd door:


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002368#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0002368#Artikel9
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '7'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002368
        artikel: '8'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0002368
        artikel: '9'
        hoofdstuk: III
        paragraaf: '1'
  - number: 10.a
    text: degene, met wie de verzekerde een huishouden vormt,
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel10
  - number: 10.b
    text: |-
      degene, met wie de verzekerde geen huishouden vormt, maar die krachtens overeenkomst of rechterlijke uitspraak
      verplicht is bijdragen te leveren voor levensonderhoud ten behoeve van dat kind, aangemerkt als door de verzekerde
      in het onderhoud van dat kind geleverde bijdragen.
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel10
  - number: '11.1'
    text: |-
      Recht op kinderbijslag voor een of meer kinderen over een kalenderkwartaal ingevolge deze wet heeft slechts degene,
      die op de eerste dag van dat kalenderkwartaal verzekerd is.
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel11
  - number: '11.2'
    text: |-
      Voor het vaststellen van het aantal kinderen, waarvoor over een kalenderkwartaal recht op kinderbijslag bestaat,
      worden slechts in aanmerking genomen de kinderen te wier aanzien aan de voorwaarden, bedoeld in [artikel 7][ref1],
      juncto [artikel 8][ref2], is voldaan op de eerste dag van dat kwartaal.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002368#Artikel8
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '7'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002368
        artikel: '8'
        hoofdstuk: III
        paragraaf: '1'
  - number: '11.3'
    text: |-
      Wanneer bij het vaststellen van het aantal kinderen, waarvoor over een kalenderkwartaal recht op kinderbijslag
      bestaat, voor een of meer kinderen de mate waarin deze kinderen door de verzekerde worden onderhouden, hiervoor
      bepalend is, wordt het totaal eigen inkomen, vastgesteld met inachtneming van het bepaalde bij of krachtens
      artikel 9, eerste en tweede lid, van deze kinderen over dat kalenderkwartaal in aanmerking genomen, ongeacht of ten
      aanzien van deze kinderen gedurende het gehele kwartaal aan de overige voorwaarden, bedoeld in [artikel 7][ref1] in
      verbinding met [artikel 8][ref2] is voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002368#Artikel8
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '7'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002368
        artikel: '8'
        hoofdstuk: III
        paragraaf: '1'
  - number: '12.1'
    text: Het basiskinderbijslagbedrag over een kalenderkwartaal bedraagt f 525,14 per kind.
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel12
  - number: '12.2'
    text: |-
      Het aan een verzekerde over een kalenderkwartaal te betalen bedrag aan kinderbijslag bedraagt voor een kind, dat op
      de eerste dag van dat kwartaal:
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel12
  - number: 12.2.a
    text: 'jonger is dan 6 jaar: 70%'
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel12
  - number: 12.2.b
    text: '6 jaar of ouder, maar jonger is dan 12 jaar: 85% en'
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel12
  - number: 12.2.c
    text: '12 jaar en ouder, maar jonger is dan 18 jaar: 100%'
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel12
  - number: '13.1'
    text: |-
      De bedragen, genoemd in [artikel 12][ref1], worden al naar gelang de ontwikkeling van het algemene prijsniveau
      verhoogd of verlaagd.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel12
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '12'
        hoofdstuk: III
        paragraaf: '1'
  - number: '13.2'
    text: |-
      De bedragen, genoemd in [artikel 12][ref1], worden bij ministeriële regeling telkens herzien met ingang van 1
      januari en 1 juli. Bij een herziening met ingang van 1 januari onderscheidenlijk 1 juli worden deze bedragen
      verhoogd of verlaagd met hetzelfde percentage, als waarmede het prijsindexcijfer van de gezinsconsumptie over de
      maand oktober daaraan voorafgaande onderscheidenlijk over de maand april daaraan voorafgaande, naar boven of naar
      beneden afwijkt van het prijsindexcijfer, waarop de laatste herziening is gebaseerd. In afwijking van de eerste
      volzin blijft herziening per 1 januari onderscheidenlijk per 1 juli achterwege, indien het prijsindexcijfer van de
      gezinsconsumptie over de maand oktober onderscheidenlijk over de maand april daaraan voorafgaande geen afwijking
      vertoont ten opzichte van het prijsindexcijfer, waarop de laatste herziening is gebaseerd.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel12
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '12'
        hoofdstuk: III
        paragraaf: '1'
  - number: '13.3'
    text: |-
      De overeenkomstig de vorige leden herziene bedragen treden in de plaats van de bedragen, genoemd in
      [artikel 12][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel12
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '12'
        hoofdstuk: III
        paragraaf: '1'
  - number: '13.4'
    text: |-
      Indien daartoe naar Ons oordeel een bijzondere aanleiding bestaat, kunnen de bedragen, genoemd in
      [artikel 12][ref1], bij algemene maatregel van bestuur met ingang van een bij die algemene maatregel van bestuur
      aan te geven datum worden verhoogd. De ingevolge de vorige volzin verhoogde bedragen treden in de plaats van de
      bedragen, genoemd in [artikel 12][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0002368#Artikel12
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '12'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002368
        artikel: '12'
        hoofdstuk: III
        paragraaf: '1'
  - number: '13.5'
    text: |-
      Indien een verhoging als bedoeld in het vierde lid, samenvalt met een herziening als bedoeld in het tweede lid,
      wordt het kinderbijslagbedrag voorafgaande aan de verhoging herzien en geschiedt de herziening, in afwijking van
      het tweede lid, bij de in het vierde lid bedoelde algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel13
  - number: '13.6'
    text: |-
      Hetgeen onder prijsindexcijfer van de gezinsconsumptie, bedoeld in het tweede lid, wordt verstaan, wordt nader bij
      algemene maatregel van bestuur geregeld.
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel13
  - number: '13.7'
    text: |-
      Indien de bedragen, genoemd in [artikel 12][ref1], worden gewijzigd, worden de uit de toepassing van
      [artikel 12, tweede lid][ref2], voortvloeiende bedragen door Onze Minister bekendgemaakt in de *Staatscourant*.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0002368#Artikel12
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '12'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002368
        artikel: '12'
        hoofdstuk: III
        paragraaf: '1'
  - number: '13.8'
    text: |-
      Op een beschikking als gevolg van een herziening van de kinderbijslag op grond van het bepaalde in dit artikel zijn
      de [artikelen 3:41][ref1] en [3:45 van de Algemene wet bestuursrecht][ref2] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '14.1'
    text: De Sociale verzekeringsbank stelt op aanvraag vast of een recht op kinderbijslag bestaat.
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel14
  - number: '14.2'
    text: |-
      Een aanvraag wordt ingediend door middel van een door de Sociale verzekeringsbank beschikbaar gesteld
      aanvraagformulier.
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel14
  - number: '14.3'
    text: |-
      Het recht op kinderbijslag kan niet vroeger ingaan dan een jaar voorafgaand aan de eerste dag van het
      kalenderkwartaal tijdens welk de aanvraag om kinderbijslag werd ingediend. De Sociale verzekeringsbank is bevoegd
      in bijzondere gevallen af te wijken van het bepaalde in de vorige volzin.
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel14
  - number: '14.4'
    text: |-
      Indien de verzekerde nalaat een aanvraag om kinderbijslag in te dienen, kan deze aanvraag worden ingediend door het
      Landelijk Bureau Inning Onderhoudsbijdragen, dat tevens adviseert aan wie de kinderbijslag wordt betaald.
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel14
  - number: 14a.1
    text: |-
      Onverminderd het elders in deze wet bepaalde terzake van herziening of intrekking van een besluit tot toekenning
      van kinderbijslag en terzake van weigering van kinderbijslag, herziet de Sociale verzekeringsbank een dergelijk
      besluit of trekt zij dat in:
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel14a
  - number: 14a.1.a
    text: |-
      indien het niet of niet behoorlijk nakomen van een verplichting op grond van [artikel 15][ref1] of [16][ref2] heeft
      geleid tot het ten onrechte of tot een te hoog bedrag verlenen van kinderbijslag;


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002368#Artikel16
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '15'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002368
        artikel: '16'
        hoofdstuk: III
        paragraaf: '2'
  - number: 14a.1.b
    text: indien anderszins de kinderbijslag ten onrechte of tot een te hoog bedrag is verleend;
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel14a
  - number: 14a.1.c
    text: |-
      indien het niet of niet behoorlijk nakomen van een verplichting op grond van [artikel 15][ref1] of [16][ref2] ertoe
      leidt dat niet kan worden vastgesteld of nog recht op kinderbijslag bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002368#Artikel16
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '15'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002368
        artikel: '16'
        hoofdstuk: III
        paragraaf: '2'
  - number: 14a.2
    text: |-
      Indien daarvoor dringende redenen aanwezig zijn kan de Sociale verzekeringsbank besluiten geheel of gedeeltelijk
      van herziening of intrekking af te zien.
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel14a
  - number: '15.1'
    text: |-
      De verzekerde, alsmede de persoon aan wie of de instelling waaraan op grond van [artikel 21][ref1] kinderbijslag
      wordt betaald, zijn verplicht aan de Sociale verzekeringsbank op haar verzoek of onverwijld uit eigen beweging alle
      feiten en omstandigheden mee te delen, waarvan hem of haar redelijkerwijs duidelijk moet zijn dat zij van invloed
      kunnen zijn op het recht op kinderbijslag, de hoogte van de kinderbijslag, het geldend maken van het recht op
      kinderbijslag of op het bedrag van de kinderbijslag, dat wordt betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel21
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '21'
        hoofdstuk: III
        paragraaf: '3'
  - number: '15.2'
    text: |-
      De verplichting van het eerste lid geldt niet ingeval het kind voor wie kinderbijslag wordt betaald recht krijgt op
      studiefinanciering op grond van de [Wet studiefinanciering 2000][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011453
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0011453
  - number: '16.1'
    text: |-
      De Sociale verzekeringsbank is bevoegd controlevoorschriften vast te stellen. Deze voorschriften mogen niet verder
      gaan dan strikt noodzakelijk is voor een juiste uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel16
  - number: '16.2'
    text: |-
      De verzekerde, alsmede de persoon aan wie op grond van [artikel 21][ref1] kinderbijslag wordt betaald, zijn
      verplicht de voorschriften op te volgen, die de Sociale verzekeringsbank ten behoeve van een doelmatige controle
      stelt.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel21
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '21'
        hoofdstuk: III
        paragraaf: '3'
  - number: '17.1'
    text: |-
      Indien de verzekerde of de persoon aan wie ingevolge [artikel 21][ref1] kinderbijslag wordt
      betaald, een verplichting op grond van [artikel 16][ref2] opgelegd, of de verplichting bedoeld in
      [artikel 55, tweede lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref3], niet of niet
      behoorlijk is nagekomen, dan wel de verplichting bedoeld in [artikel 15][ref4] niet binnen de door de Sociale
      verzekeringsbank daarvoor vastgestelde termijn is nagekomen, weigert de Sociale verzekeringsbank de kinderbijslag
      tijdelijk of blijvend, geheel of gedeeltelijk.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0002368#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Artikel55
      [ref4]: https://wetten.overheid.nl/BWBR0002368#Artikel15
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '21'
        hoofdstuk: III
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0002368
        artikel: '16'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0013060
        artikel: '55'
      - id: ref4
        bwb_id: BWBR0002368
        artikel: '15'
        hoofdstuk: III
        paragraaf: '2'
  - number: '17.2'
    text: |-
      Een maatregel als bedoeld in het eerste lid wordt afgestemd op de ernst van de gedraging en de mate waarin de
      verzekerde dan wel de persoon aan wie op grond van [artikel 21][ref1] kinderbijslag wordt betaald, de gedraging
      verweten kan worden. Van het opleggen van een maatregel wordt in elk geval afgezien, indien elke vorm van
      verwijtbaarheid ontbreekt.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel21
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '21'
        hoofdstuk: III
        paragraaf: '3'
  - number: '17.3'
    text: |-
      Indien het niet tijdig nakomen van de verplichting, bedoeld in [artikel 15][ref1], niet heeft geleid tot het
      ten onrechte of tot een te hoog bedrag verlenen van kinderbijslag kan de Sociale verzekeringsbank afzien van
      het opleggen van een maatregel als bedoeld in het eerste lid en volstaan met het geven van een schriftelijke
      waarschuwing ter zake van het niet tijdig nakomen van de verplichting, tenzij het niet tijdig nakomen van
      de verplichting plaatsvindt binnen een periode van twee jaar te rekenen vanaf de datum waarop eerder aan de
      verzekerde, of de persoon aan wie op grond van [artikel 21][ref2] kinderbijslag wordt betaald, een zodanige
      waarschuwing is gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002368#Artikel21
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '15'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002368
        artikel: '21'
        hoofdstuk: III
        paragraaf: '3'
  - number: '17.4'
    text: |-
      Indien daarvoor dringende redenen aanwezig zijn kan de Sociale verzekeringsbank besluiten van het opleggen van een
      maatregel af te zien.
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel17
  - number: '17.5'
    text: |-
      Het opleggen van een maatregel blijft achterwege indien voor dezelfde gedraging een boete als bedoeld in
      [artikel 17a][ref1] wordt opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel17a
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: 17a
        hoofdstuk: III
        paragraaf: '2'
  - number: '17.6'
    text: De Sociale verzekeringsbank stelt nadere regels met betrekking tot het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel17
  - number: 17a.1
    text: |-
      Indien de verzekerde, of de persoon aan wie op grond van [artikel 21][ref1] kinderbijslag wordt betaald de
      verplichting bedoeld in [artikel 15][ref2] niet of niet behoorlijk is nagekomen, legt de Sociale verzekeringsbank
      hem een boete op van ten hoogste € 2 269.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0002368#Artikel15
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '21'
        hoofdstuk: III
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0002368
        artikel: '15'
        hoofdstuk: III
        paragraaf: '2'
  - number: 17a.2
    text: |-
      De hoogte van de boete wordt afgestemd op de ernst van de gedraging, de mate waarin de verzekerde, dan wel de
      persoon aan wie op grond van [artikel 21][ref1] kinderbijslag wordt betaald, de gedraging verweten kan worden en
      de omstandigheden waarin hij verkeert. Van het opleggen van een boete wordt in elk geval afgezien, indien elke vorm
      van verwijtbaarheid ontbreekt.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel21
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '21'
        hoofdstuk: III
        paragraaf: '3'
  - number: 17a.3
    text: |-
      Indien het niet of niet behoorlijk nakomen van de verplichting, bedoeld in [artikel 15][ref1], niet heeft geleid
      tot het ten onrechte of tot een te hoog bedrag verlenen van kinderbijslag, kan de Sociale verzekeringsbank afzien
      van het opleggen van een boete als bedoeld in het eerste lid en volstaan met het geven van een schriftelijke
      waarschuwing ter zake van het niet of niet behoorlijk nakomen van de verplichting, tenzij het niet of niet
      behoorlijk nakomen van de verplichting plaatsvindt binnen een periode van twee jaar te rekenen vanaf de datum
      waarop eerder aan de verzekerde, of de persoon aan wie op grond van [artikel 21][ref2] kinderbijslag wordt betaald,
      een zodanige waarschuwing is gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002368#Artikel21
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '15'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002368
        artikel: '21'
        hoofdstuk: III
        paragraaf: '3'
  - number: 17a.4
    text: |-
      Indien daarvoor dringende redenen aanwezig zijn kan de Sociale verzekeringsbank besluiten van het opleggen van een
      boete af te zien.
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel17a
  - number: 17a.5
    text: |-
      Degene aan wie een boete is opgelegd is verplicht desgevraagd aan de Sociale verzekeringsbank de inlichtingen te
      verstrekken die voor de tenuitvoerlegging van de boete van belang zijn.
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel17a
  - number: 17a.6
    text: Voor zover de boete nog niet is geïnd vervalt zij door het overlijden van degene aan wie zij is opgelegd.
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel17a
  - number: 17a.7
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot het eerste en het
      tweede lid.
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel17a
  - number: 17b.1
    text: |-
      Indien de Sociale verzekeringsbank jegens de verzekerde, dan wel de persoon aan wie op grond van [artikel 21][ref1]
      kinderbijslag wordt betaald, een handeling verricht waaraan deze in redelijkheid de gevolgtrekking kan verbinden
      dat aan hem wegens een bepaalde gedraging een boete zal worden opgelegd, is de verzekerde, dan wel de betrokken
      persoon niet langer verplicht terzake van die gedraging enige verklaring af te leggen, voor zover het betreft de
      boeteoplegging. De verzekerde dan wel de betrokken persoon wordt hiervan in kennis gesteld alvorens hem mondeling
      om informatie wordt gevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel21
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel17b
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '21'
        hoofdstuk: III
        paragraaf: '3'
  - number: 17b.2
    text: |-
      Indien de Sociale verzekeringsbank voornemens is om aan de verzekerde, dan wel de betrokken persoon een boete op
      te leggen, wordt hiervan kennis gegeven aan de verzekerde, dan wel de betrokken persoon onder vermelding van de
      gronden waarop het voornemen berust. De kennisgeving is een handeling als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel17b
  - number: 17b.3
    text: |-
      Op verzoek van de verzekerde, dan wel de betrokken persoon die de in het vorige lid bedoelde kennisgeving wegens
      zijn gebrekkige kennis van de Nederlandse taal onvoldoende begrijpt, draagt de Sociale verzekeringsbank er zoveel
      mogelijk zorg voor dat de in die kennisgeving vermelde gronden aan de verzekerde, dan wel de betrokken persoon
      worden medegedeeld in een voor hem begrijpelijke taal.
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel17b
  - number: 17b.4
    text: |-
      In afwijking van [afdeling 4.1.2 van de Algemene wet bestuursrecht][ref1] stelt de Sociale verzekeringsbank de
      verzekerde, dan wel de betrokken persoon in de gelegenheid om naar keuze schriftelijk of mondeling zijn zienswijze
      naar voren te brengen voordat de boete wordt opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.1.2
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel17b
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 4.1.2
  - number: 17b.5
    text: |-
      Indien de verzekerde, dan wel de betrokken persoon zijn zienswijze mondeling naar voren brengt, draagt de Sociale
      verzekeringsbank er op verzoek van de verzekerde, dan wel de betrokken persoon die de Nederlandse taal onvoldoende
      begrijpt, zorg voor dat een tolk wordt benoemd die hem kan bijstaan, tenzij redelijkerwijs kan worden aangenomen
      dat daaraan geen behoefte bestaat.
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel17b
  - number: 17c.1
    text: |-
      Het besluit waarbij de boete wordt opgelegd vermeldt de termijn of de termijnen waarbinnen deze moet worden
      betaald, alsmede de wijze waarop het besluit bij gebreke van tijdige betaling, overeenkomstig [artikel 17g][ref1]
      zal worden tenuitvoergelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel17g
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel17c
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: 17g
        hoofdstuk: III
        paragraaf: '2'
  - number: 17c.2
    text: |-
      Op verzoek van de verzekerde, dan wel de persoon aan wie op grond van [artikel 21][ref1] kinderbijslag wordt
      betaald, die het in het eerste lid bedoelde besluit wegens zijn gebrekkige kennis van de Nederlandse taal
      onvoldoende begrijpt, draagt de Sociale verzekeringsbank er zoveel mogelijk zorg voor dat de in dat besluit
      vermelde informatie aan de verzekerde, dan wel de betrokken persoon, wordt meegedeeld in een voor hem begrijpelijke
      taal.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel21
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel17c
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '21'
        hoofdstuk: III
        paragraaf: '3'
  - number: 17c.3
    text: Bij ministeriële regeling worden nadere regels gesteld met betrekking tot het eerste lid.
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel17c
  - number: 17d.1
    text: Een boete wordt niet opgelegd zolang de gedraging wordt onderzocht door het openbaar ministerie.
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel17d
  - number: 17d.2
    text: |-
      De oplegging van een boete blijft definitief achterwege indien ter zake van de gedraging tegen de verzekerde,
      dan wel de persoon aan wie op grond van [artikel 21][ref1] kinderbijslag wordt betaald, een strafvervolging is
      ingesteld en het onderzoek ter terechtzitting een aanvang heeft genomen, dan wel het recht tot strafvordering is
      vervallen ingevolge [artikel 74 van het Wetboek van Strafrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel74
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel17d
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '21'
        hoofdstuk: III
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '74'
  - number: 17d.3
    text: |-
      Het openbaar ministerie doet van een omstandigheid als bedoeld in het eerste en het tweede lid mededeling aan de
      Sociale verzekeringsbank.
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel17d
  - number: 17e.1
    text: |-
      Een boete wordt opgelegd binnen een jaar nadat de Sociale verzekeringsbank de verzekerde, dan wel de persoon aan
      wie op grond van [artikel 21][ref1] kinderbijslag wordt betaald, overeenkomstig het bepaalde in [artikel 17][ref2],
      in de gelegenheid heeft gesteld zijn zienswijze naar voren te brengen. Indien terzake aangifte is gedaan of
      proces-verbaal is opgemaakt en ingezonden vangt de termijn van een jaar aan op de dag na die waarop het openbaar
      ministerie aan de Sociale verzekeringsbank heeft medegedeeld dat geen strafvervolging wordt ingesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0002368#Artikel17b
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel17e
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '21'
        hoofdstuk: III
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0002368
        artikel: 17b
        hoofdstuk: III
        paragraaf: '2'
  - number: 17e.2
    text: |-
      Een boete wordt in elk geval niet opgelegd na verloop van vijf jaren nadat de desbetreffende gedraging heeft
      plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel17e
  - number: 17f
    text: |-
      In afwijking van [artikel 8:69 van de Algemene wet bestuursrecht][ref1] kan de rechter in beroep of hoger beroep
      het bedrag waarop de boete is vastgesteld ook ten nadele van de verzekerde, dan wel de persoon aan wie op grond van
      [artikel 21][ref2] kinderbijslag wordt betaald, wijzigen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002368#Artikel21
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel17f
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0002368
        artikel: '21'
        hoofdstuk: III
        paragraaf: '3'
  - number: 17g.1
    text: |-
      Het besluit waarbij een boete is opgelegd levert een executoriale titel op in de zin van het
      [Tweede Boek van het Wetboek van Burgerlijke Rechtsvordering][ref1]. De titel heeft mede betrekking op de rente en
      kosten, bedoeld in het zesde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel17g
    references:
      - id: ref1
        bwb_id: BWBR0001827
  - number: 17g.2
    text: |-
      Indien degene aan wie een boete is opgelegd, dan wel degene met wie hij een huishouden vormt, kinderbijslag op
      grond van deze wet, ouderdomspensioen op grond van de [Algemene Ouderdomswet][ref1] of uitkering op grond van de
      [Algemene nabestaandenwet][ref2] ontvangt, wordt het besluit waarbij de boete is opgelegd tenuitvoergelegd door
      verrekening met die bijslag of die uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0002221
      [ref2]: https://wetten.overheid.nl/BWBR0007795
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel17g
    references:
      - id: ref1
        bwb_id: BWBR0002221
      - id: ref2
        bwb_id: BWBR0007795
  - number: 17g.3
    text: |-
      Indien degene aan wie een boete is opgelegd, dan wel degene met wie hij een huishouden
      vormt, een uitkering ontvangt op grond van de [Wet werk en bijstand][ref1], de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref2], de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref3],
      de [Wet inkomensvoorziening kunstenaars][ref4], de [Werkloosheidswet][ref5], de
      [Ziektewet][ref6], de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref7],
      de [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref8], de
      [Wet op de Arbeidsongeschiktheidsverzekering][ref9] of de [Wet arbeid en zorg][ref10] of een toeslag op grond
      van de [Toeslagenwet][ref11], betaalt de betrokken gemeente, onderscheidenlijk het Landelijk instituut sociale
      verzekeringen het bedrag van die boete, zonder dat daarvoor diens machtiging nodig is, op haar verzoek aan de
      Sociale verzekeringsbank.


      [ref1]: https://wetten.overheid.nl/BWBR0015703
      [ref2]: https://wetten.overheid.nl/BWBR0004044
      [ref3]: https://wetten.overheid.nl/BWBR0004163
      [ref4]: https://wetten.overheid.nl/BWBR0009344
      [ref5]: https://wetten.overheid.nl/BWBR0004045
      [ref6]: https://wetten.overheid.nl/BWBR0001888
      [ref7]: https://wetten.overheid.nl/BWBR0008656
      [ref8]: https://wetten.overheid.nl/BWBR0008657
      [ref9]: https://wetten.overheid.nl/BWBR0002524
      [ref10]: https://wetten.overheid.nl/BWBR0013008
      [ref11]: https://wetten.overheid.nl/BWBR0004043
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel17g
    references:
      - id: ref1
        bwb_id: BWBR0015703
      - id: ref2
        bwb_id: BWBR0004044
      - id: ref3
        bwb_id: BWBR0004163
      - id: ref4
        bwb_id: BWBR0009344
      - id: ref5
        bwb_id: BWBR0004045
      - id: ref6
        bwb_id: BWBR0001888
      - id: ref7
        bwb_id: BWBR0008656
      - id: ref8
        bwb_id: BWBR0008657
      - id: ref9
        bwb_id: BWBR0002524
      - id: ref10
        bwb_id: BWBR0013008
      - id: ref11
        bwb_id: BWBR0004043
  - number: 17g.4
    text: |-
      Indien degene aan wie een boete is opgelegd, dan wel degene met wie hij een huishouden vormt, geen bijslag,
      pensioen of uitkering als bedoeld in het tweede of derde lid ontvangt of meer ontvangt, dan wel ten aanzien van
      zodanige uitkering toepassing van het derde lid niet mogelijk is, wordt het besluit waarbij de boete is opgelegd
      bij gebreke van tijdige betaling met toepassing van het [Wetboek van Burgerlijke Rechtsvordering][ref1] op zijn
      kosten betekend en tenuitvoergelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel17g
    references:
      - id: ref1
        bwb_id: BWBR0001827
  - number: 17g.5
    text: |-
      De tenuitvoerlegging van een besluit waarbij een boete is opgelegd vindt plaats met toepassing van het tweede of
      derde lid, dan wel van het vierde lid, dan wel van het tweede of derde lid in combinatie met het vierde lid.
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel17g
  - number: 17g.6
    text: |-
      Bij gebreke van tijdige betaling wordt de verschuldigde boete verhoogd met de wettelijke rente en de op de
      invordering betrekking hebbende kosten.
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel17g
  - number: 17g.7
    text: |-
      Op het executoriaal beslag ingevolge dit artikel door de Sociale verzekeringsbank op loon, sociale uitkeringen
      of andere periodieke betalingen, welke derden verschuldigd zijn of worden aan degene aan wie een boete is
      opgelegd, zijn de [artikelen 479][ref1], behoudens [artikel 479][ref2] van overeenkomstige toepassing. De in
      [artikel 479][ref3] aan de raad voor de kinderbescherming toegekende bevoegdheid komt gelijkelijk toe aan de
      Sociale verzekeringsbank.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel479b
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel479e
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel479g
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel17g
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 479b
      - id: ref2
        bwb_id: BWBR0001827
        artikel: 479e
      - id: ref3
        bwb_id: BWBR0001827
        artikel: 479g
  - number: 17g.8
    text: |-
      De tenuitvoerlegging van een besluit met toepassing van dit artikel geschiedt zodanig dat de verzekerde en degene
      met wie hij een huishouden vormt, blijven beschikken over een inkomen gelijk aan de beslagvrije voet bedoeld in de
      [artikelen 475c tot en met 475e van het Wetboek van Burgerlijke Rechtsvordering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel475c
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel17g
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 475c
  - number: 17g.9
    text: |-
      Het achtste lid geldt niet, zolang de verzekerde en degene met wie hij een huishouden vormt, dan wel de persoon aan
      wie op grond van [artikel 21][ref1] kinderbijslag wordt betaald, zijn verplichting bedoeld in [artikel 17][ref2],
      niet of niet behoorlijk nakomt.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0002368#Artikel17a
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel17g
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '21'
        hoofdstuk: III
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0002368
        artikel: 17a
        hoofdstuk: III
        paragraaf: '2'
  - number: '18.1'
    text: |-
      De Sociale verzekeringsbank betaalt de kinderbijslag zo spoedig mogelijk, doch uiterlijk binnen drie maanden na
      afloop van het kwartaal waarover recht op kinderbijslag bestaat.
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel18
  - number: '18.2'
    text: |-
      Indien twee personen, die gezamenlijk een huishouden vormen, over eenzelfde tijdvak recht op kinderbijslag voor
      eenzelfde kind hebben, wordt de kinderbijslag uitbetaald aan degene van hen die zij gezamenlijk daartoe hebben
      aangewezen.
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel18
  - number: '18.3'
    text: |-
      Bij gebreke van een gezamenlijke aanwijzing als bedoeld in het tweede lid bepaalt de Sociale verzekeringsbank aan
      welke persoon de kinderbijslag wordt uitbetaald.
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel18
  - number: '18.4'
    text: |-
      Indien twee of meer personen waaronder één persoon tot wiens huishouden het kind behoort, over eenzelfde tijdvak
      recht op kinderbijslag voor eenzelfde kind hebben, wordt de kinderbijslag waarop degene recht heeft, tot wiens
      huishouden dit kind niet behoort, niet betaald.
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel18
  - number: '18.5'
    text: |-
      Indien twee of meer personen over eenzelfde tijdvak recht hebben op kinderbijslag voor eenzelfde kind, in andere
      situaties dan bedoeld in het tweede en vierde lid, wordt betaald de kinderbijslag waarop degene recht heeft die de
      hoogste bijdrage in het onderhoud van dit kind levert. Aan de andere personen wordt geen kinderbijslag uitbetaald.
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel18
  - number: '18.6'
    text: |-
      Bij algemene maatregel van bestuur kunnen met betrekking tot situaties van samenloop, bedoeld in het tweede,
      vierde en vijfde lid, nadere en aanvullende regels worden gesteld waarbij van het vierde en vijfde lid kan worden
      afgeweken.
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel18
  - number: '18.7'
    text: |-
      De kinderbijslag die op grond van het tweede tot en met zesde lid aan een verzekerde wordt betaald, kan op verzoek
      van die verzekerde in gedeelten aan meer verzekerden worden betaald.
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel18
  - number: '19'
    text: |-
      De Sociale verzekeringsbank schort de betaling van de kinderbijslag op of schorst de betaling, indien zij op grond
      van duidelijke aanwijzingen van oordeel is of het gegronde vermoeden heeft, dat:
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel19
  - number: 19.a
    text: het recht op kinderbijslag niet of niet meer bestaat;
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel19
  - number: 19.b
    text: recht op een lagere kinderbijslag bestaat, of
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel19
  - number: 19.c
    text: |-
      de verzekerde, alsmede de persoon aan wie of de instelling aan welke op grond van [artikel 21][ref1] kinderbijslag
      wordt betaald, een verplichting hem of haar op grond van de [artikelen 15][ref2] en [16][ref3] opgelegd, niet is
      nagekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0002368#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0002368#Artikel16
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '21'
        hoofdstuk: III
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0002368
        artikel: '15'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0002368
        artikel: '16'
        hoofdstuk: III
        paragraaf: '2'
  - number: 19a.1
    text: |-
      De Sociale verzekeringsbank schort de betaling van de kinderbijslag op, indien blijkt dat het door de verzekerde
      verstrekte adres van hemzelf of van zijn kind afwijkt van het adres waaronder de verzekerde of het kind in de
      gemeentelijke basisadministratie persoonsgegevens staat ingeschreven.
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel19a
  - number: 19a.2
    text: 'Geen opschorting vindt plaats:'
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel19a
  - number: 19a.2.a
    text: indien de afwijking redelijkerwijs geen gevolgen kan hebben voor het recht op of de hoogte van de kinderbijslag;
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel19a
  - number: 19a.2.b
    text: indien de belanghebbende van de afwijking redelijkerwijs geen verwijt kan worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel19a
  - number: 19a.3
    text: De Sociale verzekeringsbank doet schriftelijk mededeling van de opschorting aan de verzekerde.
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel19a
  - number: 19a.4
    text: |-
      De opschorting wordt beëindigd zodra het aan de Sociale verzekeringsbank gebleken is dat de afwijking niet meer
      bestaat.
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel19a
  - number: '20'
    text: |-
      Indien voor hetzelfde kind kinderbijslag kan worden betaald ingevolge deze wet en ingevolge een rechtens geldende
      regeling, bestaande in een ander land, of ingevolge een regeling van een volkenrechtelijke organisatie, kunnen bij
      ministeriële regeling nadere en zonodig afwijkende regels worden gesteld ter voorkoming van dubbele kinderbijslag.
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel20
  - number: '21'
    text: |-
      De Sociale verzekeringsbank is bevoegd, voor zover nodig na ingewonnen advies van het Landelijk Bureau Inning
      Onderhoudsbijdragen de kinderbijslag voor een kind te betalen aan een ander dan de rechthebbende.
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel21
  - number: 21a.1
    text: De Sociale verzekeringsbank is bevoegd een voorschot te betalen op de nog niet vastgestelde kinderbijslag.
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel21a
  - number: 21a.2
    text: |-
      Voorzover bij of krachtens deze wet niet anders is bepaald, wordt een voorschot als bedoeld in het eerste lid
      beschouwd als de kinderbijslag op grond van deze wet.
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel21a
  - number: '22'
    text: |-
      De kinderbijslag die niet in ontvangst is genomen of is ingevorderd binnen drie maanden na de dag van
      betaalbaarstelling, wordt niet meer betaald. De Sociale verzekeringsbank is bevoegd in bijzondere gevallen ten
      gunste van degene aan wie de kinderbijslag wordt betaald af te wijken van de in de eerste volzin genoemde drie
      maanden.
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel22
  - number: '23.1'
    text: 'De kinderbijslag is:'
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel23
  - number: 23.1.a
    text: onvervreemdbaar;
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel23
  - number: 23.1.b
    text: niet vatbaar voor verpanding of belening;
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel23
  - number: 23.1.c
    text: |-
      behoudens voor zoveel dit dient tot verhaal van een uitkering tot levensonderhoud van het kind, niet vatbaar
      voor executoriaal of conservatoir beslag noch voor beslag ingevolge faillissement of toepassing van de
      schuldsaneringsregeling natuurlijke personen.
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel23
  - number: '23.2'
    text: |-
      Volmacht tot ontvangst van kinderbijslag, onder welke vorm of welke benaming ook door de verzekerde verleend, is
      steeds herroepelijk.
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel23
  - number: '23.3'
    text: Elk beding, strijdig met enige bepaling van dit artikel, is nietig.
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel23
  - number: '24.1'
    text: |-
      De kinderbijslag die als gevolg van een besluit als bedoeld in [artikel 14a][ref1] onverschuldigd is betaald,
      alsmede hetgeen anderszins onverschuldigd is betaald, wordt door de Sociale verzekeringsbank van de verzekerde, dan
      wel degene met wie hij een huishouding vormt, of de persoon aan wie op grond van [artikel 21][ref2] kinderbijslag
      wordt betaald, teruggevorderd.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel14a
      [ref2]: https://wetten.overheid.nl/BWBR0002368#Artikel21
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: 14a
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002368
        artikel: '21'
        hoofdstuk: III
        paragraaf: '3'
  - number: '24.2'
    text: |-
      In afwijking van het eerste lid kan de Sociale verzekeringsbank besluiten van terugvordering of van verdere
      terugvordering af te zien, indien de verzekerde, dan wel degene met wie hij een huishouding vormt, of de persoon
      aan wie op grond van [artikel 21][ref1] kinderbijslag wordt betaald:


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel21
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '21'
        hoofdstuk: III
        paragraaf: '3'
  - number: 24.2.a
    text: gedurende vijf jaar volledig aan zijn betalingsverplichtingen heeft voldaan;
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel24
  - number: 24.2.b
    text: |-
      gedurende vijf jaar niet volledig aan zijn betalingsverplichtingen heeft voldaan, maar het achterstallige bedrag
      over die periode, vermeerderd met de daarover verschuldigde wettelijke rente en de op de invordering betrekking
      hebbende kosten, alsnog heeft betaald;
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel24
  - number: 24.2.c
    text: |-
      gedurende vijf jaar geen betalingen heeft verricht en niet aannemelijk is dat hij deze op enig moment zal gaan
      verrichten; of
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel24
  - number: 24.2.d
    text: een bedrag, overeenkomend met ten minste 50% van de restsom in één keer aflost.
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel24
  - number: '24.3'
    text: 'De in het tweede lid, onder a en b, genoemde termijn is drie jaar indien:'
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel24
  - number: 24.3.a
    text: |-
      het gemiddeld inkomen van de belanghebbende in die periode de beslagvrije voet bedoeld in de [artikelen 475c][ref1]
      en [475d van het Wetboek van Burgerlijke Rechtsvordering][ref2] niet te boven is gegaan; en


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel475c
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel475d
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 475c
      - id: ref2
        bwb_id: BWBR0001827
        artikel: 475d
  - number: 24.3.b
    text: |-
      de terugvordering niet het gevolg is van het niet of niet behoorlijk nakomen van de verplichting, bedoeld in
      [artikel 15][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel15
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '15'
        hoofdstuk: III
        paragraaf: '2'
  - number: '24.4'
    text: |-
      Indien daarvoor dringende redenen aanwezig zijn kan de Sociale verzekeringsbank besluiten geheel of gedeeltelijk
      van terugvordering af te zien.
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel24
  - number: '24.5'
    text: |-
      Het besluit tot terugvordering vermeldt hetgeen wordt teruggevorderd, de termijn of termijnen waarbinnen moet
      worden betaald, alsmede dat het besluit bij gebreke van tijdige betaling zal worden tenuitvoergelegd op de wijze
      als omschreven in [artikel 24a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel24a
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: 24a
        hoofdstuk: III
        paragraaf: '3'
  - number: '24.6'
    text: |-
      Degene van wie wordt teruggevorderd is verplicht desgevraagd aan de Sociale verzekeringsbank de inlichtingen te
      verstrekken die voor de terugvordering van belang zijn.
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel24
  - number: '24.7'
    text: |-
      In afwijking van het eerste lid kan de Sociale verzekeringsbank, onder voorwaarden die Onze Minister kan stellen,
      besluiten van terugvordering af te zien indien het terug te vorderen bedrag een door Onze Minister vast te stellen
      bedrag niet te boven gaat.
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel24
  - number: 24a.1
    text: |-
      Het besluit tot terugvordering levert een executoriale titel op in de zin van het [Tweede Boek van het Wetboek van
      Burgerlijke Rechtsvordering](onbekend).
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel24a
  - number: 24a.2
    text: |-
      [Artikel 17g][ref1] is van overeenkomstige toepassing, met dien verstande dat indien het gemiddeld inkomen
      van de belanghebbende gedurende drie jaar de beslagvrije voet bedoeld in de [artikelen 475c][ref2] en
      [475d van het Wetboek van Burgerlijke Rechtsvordering][ref3] niet te boven is gegaan, de Sociale verzekeringsbank
      de aflossingsbedragen lager vaststelt.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel17g
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel475c
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel475d
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel24a
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: 17g
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0001827
        artikel: 475c
      - id: ref3
        bwb_id: BWBR0001827
        artikel: 475d
  - number: 24b
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de
      [artikelen 24, eerste, tweede, derde, vierde, vijfde en zesde lid][ref1], en [24a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0002368#Artikel24a
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel24b
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '24'
        hoofdstuk: III
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0002368
        artikel: 24a
        hoofdstuk: III
        paragraaf: '3'
  - number: '25.1'
    text: |-
      Indien over een tijdvak, waarover krachtens de [Wet studiefinanciering 2000][ref1] aan een kind studiefinanciering
      is verleend, naderhand ten behoeve van dat kind recht op kinderbijslag wordt vastgesteld, is de Sociale
      verzekeringsbank bevoegd die kinderbijslag over dat tijdvak en over latere tijdvakken, in plaats van aan degene
      aan wie de kinderbijslag zou dienen te worden betaald, zonder diens machtiging tot het bedrag van de betaalde
      studiefinanciering over dat tijdvak te betalen aan de Informatie Beheer Groep.


      [ref1]: https://wetten.overheid.nl/BWBR0011453
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0011453
  - number: '25.2'
    text: |-
      Van de in het eerste lid bedoelde bevoegdheid kan de Sociale verzekeringsbank gebruik maken tot en met twee
      kalenderjaren na de vaststelling van het recht op kinderbijslag.
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel25
  - number: '25.3'
    text: |-
      Hetgeen in het eerste en het tweede lid is bepaald ten aanzien van studiefinanciering, verleend
      krachtens de [Wet studiefinanciering 2000][ref1], is van overeenkomstige toepassing ten
      aanzien van een tegemoetkoming in de onderwijsbijdrage en de schoolkosten, verleend krachtens
      [hoofdstuk 4 van de Wet tegemoetkoming onderwijsbijdrage en schoolkosten][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011453
      [ref2]: https://wetten.overheid.nl/BWBR0012438#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0011453
      - id: ref2
        bwb_id: BWBR0012438
        hoofdstuk: '4'
  - number: '25.4'
    text: |-
      De Sociale verzekeringsbank kan aan een verzekerde ten onrechte betaalde kinderbijslag verrekenen met een
      tegemoetkoming waarop een verzekerde ten behoeve van hetzelfde kind op grond van [artikel 3, eerste lid][ref1],
      juncto [artikel 9, van de Kaderwet SZW-subsidies][ref2] en de daarop berustende bepalingen, aanspraak maakt.


      [ref1]: https://wetten.overheid.nl/BWBR0008754#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0008754#Artikel9
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0008754
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0008754
        artikel: '9'
  - number: 29a.1
    text: |-
      De Sociale verzekeringsbank beheert en administreert afzonderlijk de middelen tot dekking van de uitgaven, bedoeld
      in het derde lid, in de vorm van een Algemeen Kinderbijslagfonds dat deel uitmaakt van de Sociale verzekeringsbank,
      alsmede door de met toepassing van [artikel 17a][ref1] verkregen boeten.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel17a
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel29a
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: 17a
        hoofdstuk: III
        paragraaf: '2'
  - number: 29a.2
    text: |-
      In de middelen tot dekking van de uitgaven ten laste van het Algemeen Kinderbijslagfonds wordt voorzien
      door het Rijk, onderscheidenlijk de afdracht van de boeten, bedoeld in [artikel 17a][ref1], door de Sociale
      verzekeringsbank.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel17a
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel29a
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: 17a
        hoofdstuk: III
        paragraaf: '2'
  - number: 29a.3
    text: |-
      De ingevolge deze wet uit te keren kinderbijslagen en de aan de uitvoering van deze wet verbonden kosten komen ten
      laste van het Algemeen Kinderbijslagfonds.
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel29a
  - number: 29c.1
    text: |-
      Een beschikking op grond van deze wet en de daarop berustende bepalingen wordt gegeven binnen een redelijke termijn
      na ontvangst van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel29c
  - number: 29c.2
    text: |-
      De redelijke termijn is in ieder geval verstreken wanneer binnen acht weken na ontvangst van de aanvraag geen
      beschikking is gegeven, noch een kennisgeving als bedoeld in het derde of vierde lid is gedaan.
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel29c
  - number: 29c.3
    text: |-
      Indien een beschikking niet binnen de termijn van acht weken kan worden gegeven, wordt die termijn met een
      redelijke termijn verlengd en wordt de aanvrager daarvan schriftelijk in kennis gesteld.
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel29c
  - number: 29c.4
    text: |-
      Indien in verband met het geven van een beschikking als bedoeld in het eerste lid informatie is gevraagd aan een
      persoon of instantie buiten Nederland en om die reden de beschikking niet binnen acht weken gegeven kan worden,
      wordt die termijn verlengd met ten hoogste zes maanden en wordt de aanvrager van deze verlenging schriftelijk in
      kennis gesteld.
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel29c
  - number: '30'
    text: |-
      In afwijking van [artikel 7:10, eerste lid, van de Algemene wet bestuursrecht][ref1] beslist de Sociale
      verzekeringsbank binnen dertien weken na ontvangst van het bezwaarschrift.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: '31.1'
    text: |-
      Tegen uitspraken van de Centrale Raad van Beroep kan ieder der partijen beroep in cassatie instellen ter zake van
      schending of verkeerde toepassing van het bepaalde bij of krachtens [artikel 2][ref1], [3][ref2] of [6][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002368#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0002368#Artikel6
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '2'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0002368
        artikel: '3'
        hoofdstuk: I
      - id: ref3
        bwb_id: BWBR0002368
        artikel: '6'
        hoofdstuk: II
  - number: '31.2'
    text: |-
      Op dit beroep zijn de voorschriften betreffende het beroep in cassatie tegen uitspraken van de gerechtshoven inzake
      beroepen in belastingzaken van overeenkomstige toepassing, waarbij de Centrale Raad van Beroep de plaats inneemt
      van een gerechtshof.
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel31
  - number: '36'
    text: |-
      Overtreding van bepalingen van een krachtens deze wet uitgevaardigde algemene maatregel van bestuur, voor zover
      uitdrukkelijk als strafbaar feit in de zin van dit artikel aangeduid, wordt gestraft met hechtenis van ten hoogste
      een maand of geldboete van de tweede categorie. Het feit wordt beschouwd als een overtreding.
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel36
  - number: '39'
    text: |-
      Het recht tot strafvordering vervalt indien de Sociale verzekeringsbank aan de belanghebbende ter zake van
      hetzelfde feit reeds een boete heeft opgelegd.
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel39
  - number: '41'
    text: Hetgeen nog ter uitvoering van deze wet nodig is, wordt geregeld bij ministeriële regeling.
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel41
  - number: '42'
    text: 'Deze wet kan worden aangehaald onder de titel: "Algemene Kinderbijslagwet".'
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel42
  - number: '43'
    text: |-
      De artikelen van deze wet treden in werking met ingang van een bij koninklijk besluit te bepalen tijdstip, dat voor
      de verschillende artikelen of onderdelen daarvan verschillend kan worden gesteld.
    url: https://wetten.overheid.nl/BWBR0002368/2004-03-01#Artikel43
