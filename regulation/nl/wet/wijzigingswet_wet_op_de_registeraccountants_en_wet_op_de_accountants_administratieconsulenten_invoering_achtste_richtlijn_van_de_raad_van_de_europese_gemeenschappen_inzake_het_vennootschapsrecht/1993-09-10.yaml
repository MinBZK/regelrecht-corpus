  - number: II.D
    text: |-
      Aanvragen om een vergunning als bedoeld in het bij deze wet vervallen
      [artikel 70b, eerste lid, onder b, van de Wet op de Registeraccountants][ref1], ten aanzien waarvan nog geen
      beslissing is genomen op het moment van inwerkingtreding van deze wet, worden behandeld met toepassing van
      het voor het tijdstip van inwerkingtreding van deze wet geldende recht, met dien verstande dat, wanneer de
      aanvrager voldoet aan de voor de vergunningverlening gestelde eisen, hij geen vergunning verkrijgt maar in het
      in [artikel 55 van de Wet op de Registeraccountants][ref2] bedoelde accountantsregister wordt ingeschreven. Het
      bestuur van de Orde draagt zorg voor de inschrijving en de opneming van de vereiste gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0002374#Artikel70b
      [ref2]: https://wetten.overheid.nl/BWBR0002374#Artikel55
