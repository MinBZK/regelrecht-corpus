  - number: V.1
    text: |-
      Onze Minister van Economische Zaken zendt binnen zes maanden na het verstrijken van zes jaar na het in werking
      treden van deze wet aan de Staten-Generaal een verslag omtrent de wijze waarop de accountantswetgeving in Nederland
      na de invoering van de Achtste EEG-Richtlijn (*PbEG* 1984 L126) en de Richtlijn algemeen stelsel van erkenning van
      hoger-onderwijsdiploma's (*PbEG* 1989 L19) heeft gefunctioneerd.
    url: https://wetten.overheid.nl/BWBR0006107/1993-09-10#ArtikelV
  - number: V.2
    text: |-
      Onze Minister van Economische Zaken stelt de inhoud van het in het eerste lid bedoelde verslag niet vast dan na de
      besturen van het NIVRA en de NOvAA daarover advies te hebben gevraagd.
    url: https://wetten.overheid.nl/BWBR0006107/1993-09-10#ArtikelV
  - number: VII.1
    text: |-
      De teksten van de [Wet op de Registeraccountants][ref1] en van de
      [Wet op de Accountants-Administratieconsulenten][ref2] worden na inwerkingtreding van deze wet door Onze Minister
      van Justitie in het *Staatsblad* geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0002374
      [ref2]: https://wetten.overheid.nl/BWBR0002856
    url: https://wetten.overheid.nl/BWBR0006107/1993-09-10#ArtikelVII
    references:
      - id: ref1
        bwb_id: BWBR0002374
      - id: ref2
        bwb_id: BWBR0002856
  - number: VII.2
    text: |-
      Deze wet treedt in werking met ingang van 1 januari 1993. Indien het *Staatsblad* waarin deze wet wordt geplaatst,
      wordt uitgegeven na 31 december 1992, treedt zij in werking met ingang van de dag na de datum van uitgifte van het
      *Staatsblad* waarin zij wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0006107/1993-09-10#ArtikelVII
