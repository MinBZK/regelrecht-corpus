  - number: IV
    text: |-
      A De op grond van [artikel 2 van de Wet op de Accountants-Administratieconsulenten][ref1], zoals dit artikel luidde
      voor het tijdstip van inwerkingtreding van deze wet, ingestelde Raad voor Accountants-Administratieconsulenten
      blijft, met toepassing van het vóór het tijdstip van inwerkingtreding van deze wet geldende recht, ten behoeve van
      de afhandeling van de bij de raad aanhangig zijnde adviesaanvragen, tot één jaar na de inwerkingtreding van deze
      wet in stand.

      B 1. Mits de aanvraag om inschrijving is ingediend binnen zes jaar na de datum van inwerkingtreding van deze
      wet kunnen, in afwijking van [artikel 38 van de Wet op de Accountants-Administratieconsulenten][ref2], in het
      accountantsregister tevens worden ingeschreven zij, die beschikken over een bewijsstuk waaruit blijkt dat zij
      uiterlijk binnen zes jaar na de datum van inwerkingtreding van deze wet met goed gevolg hebben afgelegd:

      a. het in artikel 9 bedoelde examen;

      b. het door de op 8 augustus 1991 opgerichte Stichting Realisatie Opleiding Overgangsregeling Accountants-
      Administratieconsulenten afgenomen accountantsexamen;

      c. het theoretische gedeelte van het in [artikel 80 van de Wet op de Accountants-Administratieconsulenten][ref3]
      bedoelde examen;

      d. een accountantsexamen ter zake waarvan een verklaring als bedoeld in
      [artikel 91, eerste lid, van de Wet op de Accountants-Administratieconsulenten][ref4] is afgegeven.

      2. Ten aanzien van degenen die op grond van het eerste lid in het in
      [artikel 36, eerste lid, van de Wet op de Accountants-Administratieconsulenten][ref5] bedoelde register worden
      ingeschreven wordt bij de inschrijving de in artikel 36, derde lid, van die wet bedoelde aantekening geplaatst.

      1. Degenen, die onmiddellijk voorafgaand aan het tijdstip van inwerkingtreding van deze wet ingevolge
      [artikel 7 van de Wet op de Accountants-Administratieconsulenten][ref6], zoals dit artikel luidde voor het tijdstip
      van inwerkingtreding van deze wet, als Accountant-Administratieconsulent stonden ingeschreven, worden aangemerkt
      als ingeschreven in het in [artikel 36, eerste lid, van de Wet op de Accountants-Administratieconsulenten][ref7]
      bedoelde register.

      2. De verzameling van inschrijvingen, bedoeld in
      [artikel 9 van de Wet op de Accountants-Administratieconsulenten][ref8], zoals dit artikel luidde voor het
      tijdstip van inwerkingtreding van deze wet, wordt gedurende zeventig jaar na die datum door de NOvAA bewaard. Deze
      verzameling is openbaar.

      Mits de aanvraag om inschrijving is ingediend binnen zes jaar na de datum van inwerkingtreding van deze wet
      kunnen, in afwijking van [artikel 38 van de Wet op de Accountants-Administratieconsulenten][ref9], tevens
      in het accountantsregister worden ingeschreven zij, die beschikken over een bewijsstuk als bedoeld in
      [artikel 10, a en d, van de Wet op de Accountants-Administratieconsulenten][ref10], zoals dit artikel luidde voor
      het tijdstip van inwerkingtreding van deze wet, waaruit blijkt dat zij het desbetreffende examen niet later dan zes
      jaar na de inwerkingtreding van deze wet met goed gevolg hebben afgelegd.

      Hij, die in het accountantsregister ingeschreven is geweest op grond van artikel 3 of artikel 4, wordt geacht te
      beschikken over een bewijsstuk als bedoeld in artikel 4.

      1. De ledenvergadering van de NOvAA stelt binnen drie maanden na de datum van inwerkingtreding van deze wet het in
      [artikel 45, eerste lid, van de Wet op de Accountants-Administratieconsulenten][ref11], bedoelde bedrag vast.

      2. Totdat het in het eerste lid bedoelde bedrag is goedgekeurd door Onze Minister geldt als dat bedrag
      het bedrag zoals dat laatstelijk voor de inwerkingtreding van deze wet was vastgesteld ingevolge
      [artikel 12, eerste lid, van de Wet op de Accountants-Administratieconsulenten][ref12], zoals dit artikel luidde
      voor het tijdstip van inwerkingtreding van deze wet.

      C 1. Er is een overgangsregeling voor Accountants-Administratieconsulenten, die ten doel heeft de bij deze
      accountants bestaande kennisdeficiënties in de vakken externe verslaggeving, administratieve organisatie en
      controleleer te overbruggen opdat zij de status van wettelijk controleur kunnen verwerven.

      2. De in het eerste lid bedoelde deficiënties kunnen gedeeltelijk worden gecompenseerd door verkregen
      beroepservaring op financieel, juridisch en boekhoudkundig gebied. Het aantal jaren beroepservaring bepaalt de mate
      waarin compensatie kan worden verkregen.

      3. Degenen, die op de datum van inwerkingtreding van deze wet ten minste elf jaar beroepservaring hebben als
      bedoeld in het tweede lid, leggen in het kader van de in het eerste lid bedoelde overgangsregeling een aanvullend
      examen af in het vak controleleer.

      4. Degenen, die op de datum van inwerkingtreding van deze wet minder dan elf jaar, maar ten minste zeven
      jaar beroepservaring hebben als bedoeld in het tweede lid, leggen in het kader van de in het eerste lid
      bedoelde overgangsregeling een aanvullend examen af in de vakken verdieping externe verslaggeving, verdieping
      administratieve organisatie en controleleer.

      5. Degenen, die op de datum van inwerkingtreding van deze wet minder dan zeven jaar beroepservaring hebben als
      bedoeld in het tweede lid, leggen in het kader van de in het eerste lid bedoelde overgangsregeling een aanvullend
      examen af in de in het vierde lid genoemde vakken, met dien verstande dat het examen in de vakken verdieping
      externe verslaggeving en verdieping administratieve organisatie uitgebreider is dan het in het vierde lid bedoelde
      examen.

      6. Het aantal jaren beroepservaring kan worden aangetoond door het bewijs van inschrijving als Accountant-
      Administratieconsulent ingevolge [artikel 7 van de Wet op de Accountants-Administratieconsulenten][ref13], zoals
      dat luidde voor het tijdstip van inwerkingtreding van deze wet, dan wel op andere gronden, zulks ten genoegen van
      het bestuur van de NOvAA.

      7. Aan de overgangsregeling kunnen slechts deelnemen Accountants-Administratieconsulenten die zich daarvoor voor
      de datum van inwerkingtreding van deze wet hebben aangemeld bij het bestuur van de privaatrechtelijke vereniging
      Nederlandse Orde van Accountants-Administratieconsulenten. Op het tijdstip van inwerkingtreding van deze wet worden
      deze aanmeldingen beschouwd als aanmeldingen bij het bestuur van de NOvAA.

      8. Het bestuur van de NOvAA bepaalt, aan welke van de in het derde, vierde en vijfde lid bedoelde examens
      de Accountant-Administratieconsulent, die zich ingevolge het zevende lid heeft aangemeld, moet deelnemen.
      [Artikel 98 van de Wet op de Accountants-Administratieconsulenten][ref14] is van toepassing op de door het bestuur
      genomen beslissingen.

      1. De ledenvergadering van de NOvAA stelt met inachtneming van artikel 7, tweede tot en met achtste lid bij
      verordening nadere regelen vast over de overgangsregeling bedoeld in artikel 7, eerste lid.

      2. Onze Minister van Economische Zaken kan de verordening bedoeld in het eerste lid, slechts vernietigen wegens
      strijd met het recht of het algemeen belang.

      1. Het examenbureau bedoeld in [artikel 85 van de Wet op de Accountants-Administratieconsulenten][ref15], is belast
      met de uitvoering van het examen waarmee de opleiding in het kader van de overgangsregeling wordt afgesloten.

      2. Het examen bedoeld in het eerste lid, wordt voor het laatst afgenomen uiterlijk op de laatste werkdag binnen zes
      jaar na de inwerkingtreding van deze wet.

      3. Het examenbureau benoemt de examinatoren en heeft de leiding van het examen.

      4. Het curatorium, bedoeld in [artikel 89 van de Wet op de Accountants-Administratieconsulenten][ref16], oefent
      toezicht uit op het examen bedoeld in het eerste lid.

      Zij, die aan de overgangsregeling bedoeld in artikel 7 wensen deel te nemen, worden daartoe niet toegelaten dan na
      betaling van een door de NOvAA vast te stellen opleidings- en examengeld, dat dient ter vergoeding van de aan de
      opleiding en aan het examen verbonden kosten.

      Zij, die het examen bedoeld in artikel 9 met goed gevolg hebben afgelegd, ontvangen een diploma.

      1. Het examen, bedoeld in [artikel 60 van de Wet op de Accountants-Administratieconsulenten][ref17], zoals dit
      artikel luidde voor de datum van inwerkingtreding van deze wet, wordt uiterlijk zes jaar na deze datum voor de
      laatste maal afgenomen.

      2. Na de datum van inwerkingtreding van deze wet kunnen slechts aan het in het eerste lid bedoelde examen deelnemen
      degenen die reeds voor die datum tot dat examen waren toegelaten.

      3. Het in het eerste lid bedoelde examen wordt afgenomen door het examenbureau, bedoeld in
      [artikel 85 van de Wet op de Accountants-Administratieconsulenten][ref18], met toepassing van het voor het tijdstip
      van inwerkingtreding van deze wet geldende recht.

      D 1. De ledenvergadering van de NOvAA stelt de in
      [artikel 24, tweede lid, van de Wet op de Accountants-Administratieconsulenten][ref19] bedoelde verordening vast
      binnen achttien maanden na de inwerkingtreding van deze wet.

      2. Het [Besluit regelen beroepsuitoefening Accountants-Administratieconsulenten](onbekend) (*Stb.* 1974, 17) blijft
      van toepassing totdat de in het eerste lid bedoelde verordening in werking is getreden. Tot dat tijdstip geldt
      [artikel 25, eerste lid, van de Wet op de Accountants-Administratieconsulenten][ref20] niet.

      3. Indien de ledenvergadering de in het eerste lid bedoelde verordening niet binnen achttien maanden na de
      inwerkingtreding van deze wet heeft vastgesteld, worden de in artikel 25, eerste lid, bedoelde voorschriften
      vastgesteld door Onze Minister, in overeenstemming met Onze Minister van Justitie. Deze voorschriften gelden totdat
      de in het eerste lid bedoelde verordening in werking is getreden.

      E 1. De op grond van [artikel 30 van de Wet op de Accountants-Administratieconsulenten][ref21], zoals dit artikel
      luidde voor het tijdstip van inwerkingtreding van deze wet, ingestelde raad van tucht blijft in stand, met
      toepassing van het voor dat tijdstip geldende recht, ten behoeve van de behandeling van op dat tijdstip bij die
      raad van tucht aanhangige bezwaren, totdat de beslissingen aangaande die bezwaren onherroepelijk zijn geworden.

      2. De behandeling van een op het tijdstip van inwerkingtreding van deze wet bij de in het eerste lid bedoelde raad
      van tucht aanhangig bezwaar tegen een Accountant-Administratieconsulent wordt voortgezet door die raad van tucht,
      met toepassing van het voor dat tijdstip geldende recht.

      De behandeling van een op het tijdstip van inwerkingtreding van deze wet bij het College van Beroep voor het
      bedrijfsleven bedoeld in [artikel 47 van de Wet op de Accountants-Administratieconsulenten][ref22], zoals dit
      artikel luidde voor het tijdstip van inwerkingtreding van deze wet, aanhangig beroep wordt voortgezet door het
      College van Beroep voor het bedrijfsleven, met toepassing van het vóór het tijdstip van inwerkingtreding van deze
      wet geldende recht.

      Ten aanzien van een in artikel 14 bedoelde beslissing is
      [artikel 47 van de Wet op de Accountants-Administratieconsulenten][ref23], zoals dit luidde voor het tijdstip van
      inwerkingtreding van deze wet, van toepassing. Het College van Beroep voor het bedrijfsleven behandelt het beroep
      overeenkomstig het in artikel 15 bepaalde.

      De tenuitvoerlegging van een maatregel als bedoeld in
      [artikel 32, van de Wet op de Accountants-Administratieconsulenten][ref24], zoals dit artikel luidde voor het
      tijdstip van inwerkingtreding van deze wet, ten aanzien waarvan de beslissing onherroepelijk is geworden, en die
      nog niet is uitgevoerd op het tijdstip van inwerkingtreding van deze wet, en van een maatregel die is opgelegd op
      grond van de artikelen 14 tot en met 16, geschiedt met toepassing van het voor het tijdstip van inwerkingtreding
      van deze wet geldende recht.

      F 1. In afwijking van [artikel 5 van de Wet op de Accountants-Administratieconsulenten][ref25] zal het bestuur
      van de privaatrechtelijke vereniging Nederlandse Orde van Accountants-Administratieconsulenten direct na de
      inwerkingtreding van deze wet het voorlopig bestuur vormen van de NOvAA.

      2. Binnen drie maanden na de inwerkingtreding van deze wet roept voornoemd bestuur de ledenvergadering bijeen die
      voor de eerste maal de leden van het bestuur, de voorzitter en de plaatsvervangend voorzitter van de NOvAA benoemt.

      3. In de ledenvergadering bedoeld in het tweede lid worden tevens de begroting van de NOvAA en de verordening
      bedoeld in [artikel 30 van de Wet op de Accountants-Administratieconsulenten][ref26] vastgesteld voor het lopende
      en eventueel voor het eerstvolgende boekjaar.

      4. Het voorlopig bestuur van de NOvAA, bedoeld in het eerste lid, is gemachtigd tot het doen van uitgaven die
      noodzakelijk zijn voor het goede functioneren van de NOvAA.

      1. Het bestuur kan bepalen dat, in afwijking van
      [artikel 27 van de Wet op de Accountants-Administratieconsulenten][ref27], het eerste boekjaar van de NOvAA
      aanvangt op de datum van inwerkingtreding van deze wet en eindigt op 31 december van het betreffende kalenderjaar.

      2. Onze Minister kan ten aanzien van het tijdstip van vaststelling van de eerste
      begroting van de inkomsten en uitgaven van de NOvAA regelen stellen, welke afwijken van
      [artikel 28, eerste volzin, van de Wet op de Accountants-Administratieconsulenten][ref28].

      3. Onze Minister kan bepalen, dat [artikel 81][ref29], derde lid, en
      [artikel 82, derde lid, van de Wet op de Accountants-Administratieconsulenten][ref30] gedurende het eerste
      boekjaar, alsook gedurende een of meer volgende boekjaren, geen toepassing vinden.


