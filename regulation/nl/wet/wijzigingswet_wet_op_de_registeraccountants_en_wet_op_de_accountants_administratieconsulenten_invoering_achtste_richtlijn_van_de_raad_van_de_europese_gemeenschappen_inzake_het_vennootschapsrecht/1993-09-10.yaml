articles:
  - number: II
    text: |-
      A Elke inschrijving in het accountantsregister krachtens de vervallen [artikelen 81][ref1] tot en met
      [102 van de Wet op de Registeraccountants][ref2] blijft geldig totdat deze op grond van de wet wordt doorgehaald.

      B Mits de aanvraag om inschrijving is ingediend binnen zes jaar na de datum van inwerkingtreding van deze wet
      kunnen, in afwijking van [artikel 58 van de Wet op de Registeraccountants][ref3], in het accountantsregister tevens
      worden ingeschreven zij, die beschikken over een bewijsstuk waaruit blijkt dat zij uiterlijk binnen zes jaar na de
      datum van inwerkingtreding van deze wet met goed gevolg hebben afgelegd:

      a. het accountantsexamen, bedoeld in [artikel 71 van de Wet op de Registeraccountants][ref4], zoals dat artikel
      luidde voor de datum van inwerkingtreding van deze wet;

      b. het accountantsexamen, bedoeld in [artikel 80a van de Wet op de Registeraccountants][ref5], zoals dat artikel
      luidde voor de datum van inwerkingtreding van deze wet;

      c. het accountantsexamen aan een universiteit in de zin van de Wet op het wetenschappelijk onderwijs of aan de in
      de Wet op de Open Universiteit geregelde Open Universiteit;

      d. het theoretische gedeelte van het in [artikel 71 van de Wet op de Registeraccountants][ref6] bedoelde
      accountantsexamen;

      e. een accountantsexamen, ter zake waarvan een verklaring als bedoeld in
      [artikel 79a, eerste of tweede lid, van de Wet op de Registeraccountants][ref7] is afgegeven.

      C Degenen, die op het tijdstip van inwerkingtreding van deze wet beschikken over een vergunning als bedoeld in
      het bij deze wet vervallen [artikel 70b, eerste lid, onder b, van de Wet op de Registeraccountants][ref8], worden
      aangemerkt als ingeschreven in het in artikel 55 van genoemde wet bedoelde accountantsregister. Het bestuur
      van de Orde draagt zorg voor de opneming van de op grond van het genoemde artikel 55 vereiste gegevens in het
      accountantsregister.

      D Aanvragen om een vergunning als bedoeld in het bij deze wet vervallen
      [artikel 70b, eerste lid, onder b, van de Wet op de Registeraccountants][ref9], ten aanzien waarvan nog geen
      beslissing is genomen op het moment van inwerkingtreding van deze wet, worden behandeld met toepassing van
      het voor het tijdstip van inwerkingtreding van deze wet geldende recht, met dien verstande dat, wanneer de
      aanvrager voldoet aan de voor de vergunningverlening gestelde eisen, hij geen vergunning verkrijgt maar in het
      in [artikel 55 van de Wet op de Registeraccountants][ref10] bedoelde accountantsregister wordt ingeschreven. Het
      bestuur van de Orde draagt zorg voor de inschrijving en de opneming van de vereiste gegevens.

      E Zolang de in [artikel 72, tweede lid, van de Wet op de Registeraccountants][ref11] bedoelde algemene maatregel
      van bestuur niet in werking is getreden, is van toepassing het Koninklijk Besluit van 24 januari 1974 (*Stb.* 58).

      F 1. De op grond van het vervallen [artikel 36 van de Wet op de Registeraccountants][ref12] ingestelde raad
      van tucht blijft in stand, met toepassing van het voor het tijdstip van inwerkingtreding van deze wet geldende
      recht, ten behoeve van de behandeling van op dat tijdstip bij die raad van tucht aanhangige bezwaren, totdat de
      beslissingen aangaande die bezwaren onherroepelijk zijn geworden.

      2. De op het moment van inwerkingtreding van deze wet in de raad van tucht zitting hebbende leden blijven, in
      afwijking van het aftredingsrooster, daarin zitting houden tot de raad wordt ontbonden.

      3. De behandeling van een op het tijdstip van inwerkingtreding van deze wet bij de in het eerste lid bedoelde raad
      van tucht aanhangig bezwaar tegen een registeraccountant wordt voortgezet door die raad van tucht, met toepassing
      van het voor het tijdstip van inwerkingtreding van deze wet geldende recht.

      4. Ten aanzien van een beslissing op een bezwaar als bedoeld in het derde lid is
      [artikel 52 van de Wet op de Registeraccountants][ref13], zoals dit luidde voor de inwerkingtreding van deze wet,
      van toepassing. De raad van beroep behandelt het beroep overeenkomstig het in onderdeel G, eerste lid, bepaalde.

      5. [Artikel 35 van de Wet op de Registeraccountants][ref14] is van toepassing op de door de raad van tucht gegeven
      beslissingen.

      G 1. De behandeling van een op het tijdstip van inwerkingtreding van deze wet bij de in het vervallen
      [artikel 46 van de Wet op de Registeraccountants][ref15] bedoelde raad van beroep aanhangig beroep wordt voortgezet
      door die raad van beroep, met toepassing van het voor dat tijdstip geldende recht.

      2. De raad van beroep blijft in stand, met toepassing van het voor het tijdstip van inwerkingtreding van deze wet
      geldende recht, totdat op alle ingestelde beroepen, daaronder begrepen beroepen ingesteld op grond van onderdeel F,
      vierde lid, onherroepelijk is beslist.

      3. De op het moment van inwerkingtreding van deze wet in de raad van beroep zitting hebbende leden, blijven in
      afwijking van het aftredingsrooster daarin zitting houden tot de raad wordt ontbonden.

      4. [Artikel 35 van de Wet op de Registeraccountants][ref16] is van toepassing op de door de raad van beroep gegeven
      beslissingen.

      H 1. Binnen achttien maanden na de datum van inwerkingtreding van deze wet stelt de ledenvergadering van
      de Orde een verordening inzake de gedrags- en beroepsregels voor registeraccountants vast, die voldoet aan
      [artikel 19a, eerste lid, van de Wet op de Registeraccountants][ref17].

      2. Totdat de in het eerste lid bedoelde verordening in werking is getreden, geldt het in dat lid genoemde artikel
      19*a*, eerste lid, niet.

      3. Indien de ledenvergadering de in het eerste lid bedoelde verordening niet binnen achttien maanden na de
      inwerkingtreding van deze wet heeft vastgesteld, worden de in artikel 19*a*, eerste lid, bedoelde voorschriften
      vastgesteld door Onze Minister van Economische Zaken, in overeenstemming met Onze Minister van Justitie. Deze
      voorschriften gelden totdat de in het eerste lid bedoelde verordening in werking is getreden.


