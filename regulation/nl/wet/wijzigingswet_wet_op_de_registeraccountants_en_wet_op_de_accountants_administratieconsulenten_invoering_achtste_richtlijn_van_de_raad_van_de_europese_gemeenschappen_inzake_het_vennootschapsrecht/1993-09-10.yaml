        artikel: '2'
  - number: IV.B
    text: |-
      1. Mits de aanvraag om inschrijving is ingediend binnen zes jaar na de datum van inwerkingtreding van deze
      wet kunnen, in afwijking van [artikel 38 van de Wet op de Accountants-Administratieconsulenten][ref1], in
      het accountantsregister tevens worden ingeschreven zij, die beschikken over een bewijsstuk waaruit blijkt
      dat zij uiterlijk binnen zes jaar na de datum van inwerkingtreding van deze wet met goed gevolg hebben
      afgelegd: a. het in artikel 9 bedoelde examen; b. het door de op 8 augustus 1991 opgerichte Stichting
      Realisatie Opleiding Overgangsregeling Accountants-Administratieconsulenten afgenomen accountantsexamen; c.
      het theoretische gedeelte van het in [artikel 80 van de Wet op de Accountants-Administratieconsulenten][ref2]
      bedoelde examen; d. een accountantsexamen ter zake waarvan een verklaring als bedoeld
      in [artikel 91, eerste lid, van de Wet op de Accountants-Administratieconsulenten][ref3]
      is afgegeven. 2. Ten aanzien van degenen die op grond van het eerste lid in het in
      [artikel 36, eerste lid, van de Wet op de Accountants-Administratieconsulenten][ref4] bedoelde register
      worden ingeschreven wordt bij de inschrijving de in artikel 36, derde lid, van die wet bedoelde
      aantekening geplaatst. 1. Degenen, die onmiddellijk voorafgaand aan het tijdstip van inwerkingtreding
      van deze wet ingevolge [artikel 7 van de Wet op de Accountants-Administratieconsulenten][ref5],
      zoals dit artikel luidde voor het tijdstip van inwerkingtreding van deze wet, als Accountant-
      Administratieconsulent stonden ingeschreven, worden aangemerkt als ingeschreven in het in
      [artikel 36, eerste lid, van de Wet op de Accountants-Administratieconsulenten][ref6] bedoelde register. 2. De
      verzameling van inschrijvingen, bedoeld in [artikel 9 van de Wet op de Accountants-Administratieconsulenten][ref7],
      zoals dit artikel luidde voor het tijdstip van inwerkingtreding van deze wet, wordt gedurende
      zeventig jaar na die datum door de NOvAA bewaard. Deze verzameling is openbaar. Mits de aanvraag om
      inschrijving is ingediend binnen zes jaar na de datum van inwerkingtreding van deze wet kunnen, in
      afwijking van [artikel 38 van de Wet op de Accountants-Administratieconsulenten][ref8], tevens in
      het accountantsregister worden ingeschreven zij, die beschikken over een bewijsstuk als bedoeld in
      [artikel 10, a en d, van de Wet op de Accountants-Administratieconsulenten][ref9], zoals dit artikel luidde voor
      het tijdstip van inwerkingtreding van deze wet, waaruit blijkt dat zij het desbetreffende examen niet later dan
      zes jaar na de inwerkingtreding van deze wet met goed gevolg hebben afgelegd. Hij, die in het accountantsregister
      ingeschreven is geweest op grond van artikel 3 of artikel 4, wordt geacht te beschikken over een bewijsstuk als
      bedoeld in artikel 4. 1. De ledenvergadering van de NOvAA stelt binnen drie maanden na de datum van inwerkingtreding
      van deze wet het in [artikel 45, eerste lid, van de Wet op de Accountants-Administratieconsulenten][ref10],
      bedoelde bedrag vast. 2. Totdat het in het eerste lid bedoelde bedrag is goedgekeurd door Onze Minister geldt
      als dat bedrag het bedrag zoals dat laatstelijk voor de inwerkingtreding van deze wet was vastgesteld ingevolge
      [artikel 12, eerste lid, van de Wet op de Accountants-Administratieconsulenten][ref11], zoals dit artikel luidde
      voor het tijdstip van inwerkingtreding van deze wet.


