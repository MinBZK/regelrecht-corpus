  - number: IV.C
    text: |-
      1. Er is een overgangsregeling voor Accountants-Administratieconsulenten, die ten doel heeft de bij deze
      accountants bestaande kennisdeficiënties in de vakken externe verslaggeving, administratieve organisatie en
      controleleer te overbruggen opdat zij de status van wettelijk controleur kunnen verwerven. 2. De in het eerste
      lid bedoelde deficiënties kunnen gedeeltelijk worden gecompenseerd door verkregen beroepservaring op financieel,
      juridisch en boekhoudkundig gebied. Het aantal jaren beroepservaring bepaalt de mate waarin compensatie kan worden
      verkregen. 3. Degenen, die op de datum van inwerkingtreding van deze wet ten minste elf jaar beroepservaring
      hebben als bedoeld in het tweede lid, leggen in het kader van de in het eerste lid bedoelde overgangsregeling
      een aanvullend examen af in het vak controleleer. 4. Degenen, die op de datum van inwerkingtreding van deze
      wet minder dan elf jaar, maar ten minste zeven jaar beroepservaring hebben als bedoeld in het tweede lid,
      leggen in het kader van de in het eerste lid bedoelde overgangsregeling een aanvullend examen af in de vakken
      verdieping externe verslaggeving, verdieping administratieve organisatie en controleleer. 5. Degenen, die op
      de datum van inwerkingtreding van deze wet minder dan zeven jaar beroepservaring hebben als bedoeld in het
      tweede lid, leggen in het kader van de in het eerste lid bedoelde overgangsregeling een aanvullend examen af
      in de in het vierde lid genoemde vakken, met dien verstande dat het examen in de vakken verdieping externe
      verslaggeving en verdieping administratieve organisatie uitgebreider is dan het in het vierde lid bedoelde
      examen. 6. Het aantal jaren beroepservaring kan worden aangetoond door het bewijs van inschrijving als Accountant-
      Administratieconsulent ingevolge [artikel 7 van de Wet op de Accountants-Administratieconsulenten][ref1],
      zoals dat luidde voor het tijdstip van inwerkingtreding van deze wet, dan wel op andere gronden, zulks ten
      genoegen van het bestuur van de NOvAA. 7. Aan de overgangsregeling kunnen slechts deelnemen Accountants-
      Administratieconsulenten die zich daarvoor voor de datum van inwerkingtreding van deze wet hebben aangemeld
      bij het bestuur van de privaatrechtelijke vereniging Nederlandse Orde van Accountants-Administratieconsulenten.
      Op het tijdstip van inwerkingtreding van deze wet worden deze aanmeldingen beschouwd als aanmeldingen bij het
      bestuur van de NOvAA. 8. Het bestuur van de NOvAA bepaalt, aan welke van de in het derde, vierde en vijfde
      lid bedoelde examens de Accountant-Administratieconsulent, die zich ingevolge het zevende lid heeft aangemeld,
      moet deelnemen. [Artikel 98 van de Wet op de Accountants-Administratieconsulenten][ref2] is van toepassing
      op de door het bestuur genomen beslissingen. 1. De ledenvergadering van de NOvAA stelt met inachtneming van
      artikel 7, tweede tot en met achtste lid bij verordening nadere regelen vast over de overgangsregeling bedoeld
      in artikel 7, eerste lid. 2. Onze Minister van Economische Zaken kan de verordening bedoeld in het eerste
      lid, slechts vernietigen wegens strijd met het recht of het algemeen belang. 1. Het examenbureau bedoeld in
      [artikel 85 van de Wet op de Accountants-Administratieconsulenten][ref3], is belast met de uitvoering van het
      examen waarmee de opleiding in het kader van de overgangsregeling wordt afgesloten. 2. Het examen bedoeld in het
      eerste lid, wordt voor het laatst afgenomen uiterlijk op de laatste werkdag binnen zes jaar na de inwerkingtreding
      van deze wet. 3. Het examenbureau benoemt de examinatoren en heeft de leiding van het examen. 4. Het curatorium,
      bedoeld in [artikel 89 van de Wet op de Accountants-Administratieconsulenten][ref4], oefent toezicht uit op
      het examen bedoeld in het eerste lid. Zij, die aan de overgangsregeling bedoeld in artikel 7 wensen deel te
      nemen, worden daartoe niet toegelaten dan na betaling van een door de NOvAA vast te stellen opleidings- en
      examengeld, dat dient ter vergoeding van de aan de opleiding en aan het examen verbonden kosten. Zij, die het
      examen bedoeld in artikel 9 met goed gevolg hebben afgelegd, ontvangen een diploma. 1. Het examen, bedoeld in
      [artikel 60 van de Wet op de Accountants-Administratieconsulenten][ref5], zoals dit artikel luidde voor de datum
      van inwerkingtreding van deze wet, wordt uiterlijk zes jaar na deze datum voor de laatste maal afgenomen. 2. Na de
      datum van inwerkingtreding van deze wet kunnen slechts aan het in het eerste lid bedoelde examen deelnemen degenen
      die reeds voor die datum tot dat examen waren toegelaten. 3. Het in het eerste lid bedoelde examen wordt afgenomen
      door het examenbureau, bedoeld in [artikel 85 van de Wet op de Accountants-Administratieconsulenten][ref6], met
      toepassing van het voor het tijdstip van inwerkingtreding van deze wet geldende recht.


      [ref1]: https://wetten.overheid.nl/BWBR0002856#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002856#Artikel98
