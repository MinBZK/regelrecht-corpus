  - number: IV.D.1
    text: |-
      De ledenvergadering van de NOvAA stelt de in
      [artikel 24, tweede lid, van de Wet op de Accountants-Administratieconsulenten][ref1] bedoelde verordening vast
      binnen achttien maanden na de inwerkingtreding van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002856#Artikel24
    url: https://wetten.overheid.nl/BWBR0006107/1993-09-10#ArtikelIV
    references:
      - id: ref1
        bwb_id: BWBR0002856
        artikel: '24'
  - number: IV.D.2
    text: |-
      Het [Besluit regelen beroepsuitoefening Accountants-Administratieconsulenten](onbekend) (*Stb.* 1974, 17) blijft
      van toepassing totdat de in het eerste lid bedoelde verordening in werking is getreden. Tot dat tijdstip geldt
      [artikel 25, eerste lid, van de Wet op de Accountants-Administratieconsulenten][ref1] niet.


      [ref1]: https://wetten.overheid.nl/BWBR0002856#Artikel25
    url: https://wetten.overheid.nl/BWBR0006107/1993-09-10#ArtikelIV
    references:
      - id: ref1
        bwb_id: BWBR0002856
        artikel: '25'
  - number: IV.D.3
    text: |-
      Indien de ledenvergadering de in het eerste lid bedoelde verordening niet binnen achttien maanden na de
      inwerkingtreding van deze wet heeft vastgesteld, worden de in artikel 25, eerste lid, bedoelde voorschriften
      vastgesteld door Onze Minister, in overeenstemming met Onze Minister van Justitie. Deze voorschriften gelden totdat
      de in het eerste lid bedoelde verordening in werking is getreden.
    url: https://wetten.overheid.nl/BWBR0006107/1993-09-10#ArtikelIV
  - number: IV.E.1
    text: |-
      De op grond van [artikel 30 van de Wet op de Accountants-Administratieconsulenten][ref1], zoals dit artikel luidde
      voor het tijdstip van inwerkingtreding van deze wet, ingestelde raad van tucht blijft in stand, met toepassing van
      het voor dat tijdstip geldende recht, ten behoeve van de behandeling van op dat tijdstip bij die raad van tucht
      aanhangige bezwaren, totdat de beslissingen aangaande die bezwaren onherroepelijk zijn geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0002856#Artikel30
    url: https://wetten.overheid.nl/BWBR0006107/1993-09-10#ArtikelIV
    references:
      - id: ref1
        bwb_id: BWBR0002856
        artikel: '30'
  - number: IV.E.2
    text: |-
      De behandeling van een op het tijdstip van inwerkingtreding van deze wet bij de in het eerste lid bedoelde raad van
      tucht aanhangig bezwaar tegen een Accountant-Administratieconsulent wordt voortgezet door die raad van tucht, met
      toepassing van het voor dat tijdstip geldende recht.
    url: https://wetten.overheid.nl/BWBR0006107/1993-09-10#ArtikelIV
  - number: IV.F
    text: |-
      1. In afwijking van [artikel 5 van de Wet op de Accountants-Administratieconsulenten][ref1] zal het bestuur
      van de privaatrechtelijke vereniging Nederlandse Orde van Accountants-Administratieconsulenten direct na
      de inwerkingtreding van deze wet het voorlopig bestuur vormen van de NOvAA. 2. Binnen drie maanden na de
      inwerkingtreding van deze wet roept voornoemd bestuur de ledenvergadering bijeen die voor de eerste maal
      de leden van het bestuur, de voorzitter en de plaatsvervangend voorzitter van de NOvAA benoemt. 3. In de
      ledenvergadering bedoeld in het tweede lid worden tevens de begroting van de NOvAA en de verordening bedoeld
      in [artikel 30 van de Wet op de Accountants-Administratieconsulenten][ref2] vastgesteld voor het lopende en
      eventueel voor het eerstvolgende boekjaar. 4. Het voorlopig bestuur van de NOvAA, bedoeld in het eerste lid,
      is gemachtigd tot het doen van uitgaven die noodzakelijk zijn voor het goede functioneren van de NOvAA. 1. Het
      bestuur kan bepalen dat, in afwijking van [artikel 27 van de Wet op de Accountants-Administratieconsulenten][ref3],
      het eerste boekjaar van de NOvAA aanvangt op de datum van inwerkingtreding van deze wet en eindigt op
      31 december van het betreffende kalenderjaar. 2. Onze Minister kan ten aanzien van het tijdstip van
      vaststelling van de eerste begroting van de inkomsten en uitgaven van de NOvAA regelen stellen, welke
      afwijken van [artikel 28, eerste volzin, van de Wet op de Accountants-Administratieconsulenten][ref4].
      3. Onze Minister kan bepalen, dat [artikel 81][ref5], derde lid, en
      [artikel 82, derde lid, van de Wet op de Accountants-Administratieconsulenten][ref6] gedurende het eerste boekjaar,
      alsook gedurende een of meer volgende boekjaren, geen toepassing vinden.


      [ref1]: https://wetten.overheid.nl/BWBR0002856#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0002856#Artikel30
      [ref3]: https://wetten.overheid.nl/BWBR0002856#Artikel27
      [ref4]: https://wetten.overheid.nl/BWBR0002856#Artikel28
      [ref5]: https://wetten.overheid.nl/BWBR0002856#Artikel81
      [ref6]: https://wetten.overheid.nl/BWBR0002856#Artikel82
    url: https://wetten.overheid.nl/BWBR0006107/1993-09-10#ArtikelIV
