  - number: II.C
    text: |-
      Degenen, die op het tijdstip van inwerkingtreding van deze wet beschikken over een vergunning als bedoeld in het
      bij deze wet vervallen [artikel 70b, eerste lid, onder b, van de Wet op de Registeraccountants][ref1], worden
      aangemerkt als ingeschreven in het in artikel 55 van genoemde wet bedoelde accountantsregister. Het bestuur
      van de Orde draagt zorg voor de opneming van de op grond van het genoemde artikel 55 vereiste gegevens in het
      accountantsregister.


