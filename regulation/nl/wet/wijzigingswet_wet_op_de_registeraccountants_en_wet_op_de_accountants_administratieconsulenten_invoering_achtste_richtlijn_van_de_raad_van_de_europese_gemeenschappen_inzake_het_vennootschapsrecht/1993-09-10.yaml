  - number: II.F.1
    text: |-
      De op grond van het vervallen [artikel 36 van de Wet op de Registeraccountants][ref1] ingestelde raad van tucht
      blijft in stand, met toepassing van het voor het tijdstip van inwerkingtreding van deze wet geldende recht, ten
      behoeve van de behandeling van op dat tijdstip bij die raad van tucht aanhangige bezwaren, totdat de beslissingen
      aangaande die bezwaren onherroepelijk zijn geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0002374#Artikel36
    url: https://wetten.overheid.nl/BWBR0006107/1993-09-10#ArtikelII
    references:
      - id: ref1
        bwb_id: BWBR0002374
        artikel: '36'
  - number: II.F.2
    text: |-
      De op het moment van inwerkingtreding van deze wet in de raad van tucht zitting hebbende leden blijven, in
      afwijking van het aftredingsrooster, daarin zitting houden tot de raad wordt ontbonden.
    url: https://wetten.overheid.nl/BWBR0006107/1993-09-10#ArtikelII
  - number: II.F.3
    text: |-
      De behandeling van een op het tijdstip van inwerkingtreding van deze wet bij de in het eerste lid bedoelde raad van
      tucht aanhangig bezwaar tegen een registeraccountant wordt voortgezet door die raad van tucht, met toepassing van
      het voor het tijdstip van inwerkingtreding van deze wet geldende recht.
    url: https://wetten.overheid.nl/BWBR0006107/1993-09-10#ArtikelII
  - number: II.F.4
    text: |-
      Ten aanzien van een beslissing op een bezwaar als bedoeld in het derde lid is
      [artikel 52 van de Wet op de Registeraccountants][ref1], zoals dit luidde voor de inwerkingtreding van deze wet,
      van toepassing. De raad van beroep behandelt het beroep overeenkomstig het in onderdeel G, eerste lid, bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0002374#Artikel52
    url: https://wetten.overheid.nl/BWBR0006107/1993-09-10#ArtikelII
    references:
      - id: ref1
        bwb_id: BWBR0002374
        artikel: '52'
  - number: II.F.5
    text: |-
      [Artikel 35 van de Wet op de Registeraccountants][ref1] is van toepassing op de door de raad van tucht gegeven
      beslissingen.


      [ref1]: https://wetten.overheid.nl/BWBR0002374#Artikel35
    url: https://wetten.overheid.nl/BWBR0006107/1993-09-10#ArtikelII
