      voorschriften gelden totdat de in het eerste lid bedoelde verordening in werking is getreden.
    url: https://wetten.overheid.nl/BWBR0006107/1993-09-10#ArtikelII
  - number: IV.A
    text: |-
      De op grond van [artikel 2 van de Wet op de Accountants-Administratieconsulenten][ref1], zoals dit artikel luidde
      voor het tijdstip van inwerkingtreding van deze wet, ingestelde Raad voor Accountants-Administratieconsulenten
      blijft, met toepassing van het vóór het tijdstip van inwerkingtreding van deze wet geldende recht, ten behoeve van
      de afhandeling van de bij de raad aanhangig zijnde adviesaanvragen, tot één jaar na de inwerkingtreding van deze
      wet in stand.


      [ref1]: https://wetten.overheid.nl/BWBR0002856#Artikel2
    url: https://wetten.overheid.nl/BWBR0006107/1993-09-10#ArtikelIV
