preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het ingevolge de achtste richtlijn van de Raad van de Europese
    Gemeenschappen inzake het vennootschapsrecht (PbEg 1984, L 126) en de richtlijn aan de Raad van de
    Europese Gemeenschappen betreffende een algemeen stelsel van erkenning van hoger-onderwijsdiploma's waarmee
    beroepsopleidingen van ten minste drie jaar worden afgesloten (PbEg 1989, L 19) noodzakelijk is wijzigingen aan te
    brengen in de wettelijke bepalingen inzake registeraccountants en accountants-administratieconsulenten en daarbij
    toepassing te geven aan artikel 134 van de Grondwet.

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0006107/1993-09-10#ArtikelAanhef
