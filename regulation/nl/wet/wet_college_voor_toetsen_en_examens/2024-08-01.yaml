  - number: 3a
    text: |-
      1 Het college is belast met de volgende taken op het gebied van toetsen in het basisonderwijs en het speciaal
      onderwijs:

      a. erkenning voor een periode van vier jaar van doorstroomtoetsen als doorstroomtoets,
      bedoeld in [artikel 45b, derde lid, van de Wet op het primair onderwijs][ref1],
      [artikel 48c, derde lid, van de Wet op de expertisecentra][ref2] en
      [artikel 51b, eerste lid, van de Wet primair onderwijs BES][ref3];

      b. jaarlijkse vaststelling of de in dat schooljaar aan te bieden erkende doorstroomtoets voldoet aan de criteria op
      basis waarvan de erkenning is verleend;

      c. erkenning voor een periode van tien jaar van toetsen als toets, bedoeld
      in [artikel 45b, eerste lid, van de Wet op het primair onderwijs][ref4],
      [artikel 48c, eerste lid, van de Wet op de expertisecentra][ref5] en
      [artikel 51a, eerste lid, van de Wet primair onderwijs BES][ref6];

      d. het doen van mededelingen van de erkenningen, bedoeld in onderdelen a en c, en jaarlijkse vaststellingen,
      bedoeld in onderdeel b, op elektronische wijze;

      e. het bij regeling vaststellen van de toetswijzer voor de verschillende niveaus overeenkomstig
      de kerndoelen met betrekking tot Nederlandse taal en rekenen en wiskunde, bedoeld in
      [artikel 9 van de Wet op het primair onderwijs][ref7] en [artikel 13 van de Wet op de expertisecentra][ref8]
      en met inachtneming van de referentieniveaus Nederlandse taal en de referentieniveaus rekenen, bedoeld in
      [artikel 2, tweede lid, aanhef en onderdeel b, van de Wet referentieniveaus Nederlandse taal en rekenen][ref9];

      f. het bij regeling vaststellen van de procedure om te komen tot de beoordelingsnormen van de doorstroomtoetsen; en

      g. het opstellen van een beoordelingskader voor de erkenning en jaarlijkse vaststelling, bedoeld in de onderdelen
      a tot en met c, waarin ten aanzien van de psychometrische, onderwijskundige en organisatorische aspecten van de
      toetsen de toepassing is vastgelegd van de regels, bedoeld in het tweede lid.

      2 Het college verleent een erkenning als bedoeld in het eerste lid, onderdelen a en c:

      a. voor een doorstroomtoets, indien deze toets voldoet aan de voorwaarden,
      genoemd in [artikel 45b, vierde lid, van de Wet op het primair onderwijs][ref10],
      [artikel 48c, vierde lid, van de Wet op de expertisecentra][ref11] of
      [artikel 51b, tweede lid, van de Wet primair onderwijs BES][ref12], en het eerste lid, onderdeel e;

      b. voor een toets verbonden aan een leerling- en onderwijsvolgsysteem, indien deze toets voldoet aan
      de voorwaarden, genoemd in [artikel 45b, tweede lid, van de Wet op het primair onderwijs][ref13],
      [artikel 48c, tweede lid, van de Wet op de expertisecentra][ref14] of
      [artikel 51a, tweede lid, van de Wet primair onderwijs BES][ref15]; en

      c. de toets, bedoeld in de onderdelen a of b, voldoet aan de bij of krachtens algemene maatregel van bestuur te
      stellen regels over de validiteit, betrouwbaarheid, deugdelijke normering, organisatorische aspecten en voor ouders
      en leerlingen inzichtelijke weergave van de resultaten.

      3 Het college beslist binnen vijftien weken na ontvangst van een aanvraag tot erkenning of jaarlijkse vaststelling
      als bedoeld in het eerste lid, onderdelen a tot en met c.

      4 Indien het college vaststelt dat een doorstroomtoets of een toets verbonden aan een leerling- en
      onderwijsvolgsysteem niet langer voldoet aan de criteria op basis waarvan de erkenning, bedoeld in het eerste lid,
      onderdelen a of c, is verleend, kan het college de erkenning intrekken.

      5 De voordracht voor een krachtens het tweede lid, onderdeel c, vast te stellen algemene maatregel van bestuur
      wordt niet eerder gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.

      6 De regeling en het beoordelingskader, bedoeld in het eerste lid, onderdelen f en g, treden slechts in werking
      na goedkeuring door Onze Minister. Onze Minister kan zijn goedkeuring onthouden wegens strijd met het recht of het
      algemeen belang.


