  - number: '2'
    text: |-
      1 Er is een College voor toetsen en examens.

      2 Het college is belast met de volgende taken op het gebied van de centrale examens,
      bedoeld in [hoofdstuk 2, paragraaf 5, van de Wet voortgezet onderwijs 2020][ref1],
      [artikel 7.4.11 van de Wet educatie en beroepsonderwijs][ref2] en
      [artikel 7.4.13 van de Wet educatie en beroepsonderwijs BES][ref3] en de daarop berustende bepalingen:

      a. het vaststellen van het aantal toetsen, de tijdsduur en de aard van de toetsen, overeenkomstig het
      examenprogramma;

      b. het vaststellen van het tijdstip van de toetsen, de wijze waarop en de vorm waarin de toetsen worden afgenomen;

      c. het tot stand brengen en vaststellen van de opgaven;

      d. het tot stand brengen en bij regeling vaststellen van de beoordelingsnormen en de daarbij behorende scores;

      e. het geven van regels voor de omzetting van de scores in cijfers;

      f. het tot stand brengen en bij regeling vaststellen van syllabi, overeenkomstig het examenprogramma; en

      g. het geven van regels met betrekking tot de hulpmiddelen die gebruikt mogen worden bij het maken van de opgaven.

      3 Het college is belast met de volgende taken op het gebied van de staatsexamens, bedoeld in
      [hoofdstuk 2, paragraaf 7, van de Wet voortgezet onderwijs 2020][ref4] en de daarop berustende bepalingen:

      a. het bij regeling vaststellen van het examenreglement;

      b. het organiseren, afnemen en beoordelen;

      c. de benoeming van examenfunctionarissen; en

      d. het vaststellen van de uitslag en het uitreiken van diploma’s, certificaten of cijferlijsten.

      4 Het college is belast met de volgende taken op het gebied van de college-examens van de staatsexamens, bedoeld in
      de [artikelen 2.75 tot en met 2.77 van de Wet voortgezet onderwijs 2020][ref5] en de op artikel 2.77, tweede lid,
      van die wet berustende bepalingen:

      a. het bij regeling vaststellen van het programma van toetsing en afsluiting;

      b. het tot stand brengen en vaststellen van de opgaven; en

      c. het tot stand brengen en bij regeling vaststellen van de beoordelingsnormen.

      5 Het college is belast met de volgende taken op het gebied van de staatsexamens, bedoeld in
      [artikel 2.72, derde lid, van de Wet voortgezet onderwijs 2020][ref6] en de op dat lid berustende bepalingen:

      a. het bij regeling vaststellen van het examenprogramma;

      b. het tot stand brengen en vaststellen van de opgaven; en

      c. het tot stand brengen en bij regeling vaststellen van de beoordelingsnormen.

      6 Het college is verder nog belast met de volgende taken:

      a. het afnemen van examens onder bijzondere omstandigheden;

      b. het bij regeling vaststellen welke vakken in een tijdvak met geheimhouding worden afgenomen, waarbij de
      geheimhouding betrekking heeft op de opgaven, de beoordelingsnormen en de daarbij behorende scores, bedoeld in het
      tweede lid, onderdelen c en d, vierde lid onderdelen b en c, en vijfde lid, onderdelen b en c; en

      c. het uitoefenen van andere door Onze Minister opgedragen taken.

      7 De regelingen, bedoeld in het tweede lid, onderdelen e en f, en vijfde lid, onderdeel a, treden slechts in
      werking na goedkeuring door Onze Minister. Onze Minister kan zijn goedkeuring onthouden wegens strijd met het recht
      of het algemeen belang.

      8 In afwijking van [artikel 5, aanhef en onder b, van de Bekendmakingswet][ref7] kan de bekendmaking van een
      regeling als bedoeld in het tweede lid, onderdeel d, vierde lid, onderdeel c, of vijfde lid, onderdeel c,
      geschieden op een andere geschikte, al dan niet elektronische, wijze.


