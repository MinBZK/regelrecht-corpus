    text: |-
      De archiefbescheiden van de centrale examencommissie vaststelling opgaven, bedoeld in
      [artikel 39, van het Eindexamenbesluit v.w.o.-h.a.v.o.-m.a.v.o.-v.b.o.][ref1], de staatsexamencommissie,
