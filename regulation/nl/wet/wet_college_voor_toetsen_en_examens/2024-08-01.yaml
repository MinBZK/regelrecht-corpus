  - number: '5'
    text: |-
      1 Het college heeft een bureau ter ondersteuning van zijn werkzaamheden bestaande uit een directeur en andere
      medewerkers.

      2 De directeur en de andere medewerkers zijn geen lid van het college.

      3 Onze Minister gaat arbeidsovereenkomsten aan en wijzigt en beëindigt deze namens de Staat met de directeur en de
      andere medewerkers na overleg met de voorzitter van het college.
    url: https://wetten.overheid.nl/BWBR0025364/2024-08-01#Artikel5
  - number: '6'
    text: De voorzitter vertegenwoordigt het college in en buiten rechte.
    url: https://wetten.overheid.nl/BWBR0025364/2024-08-01#Artikel6
  - number: '7'
    text: |-
      Het college stelt een bestuursreglement vast, waarin in elk geval regels over de werkwijze en procedures zijn
      opgenomen.
    url: https://wetten.overheid.nl/BWBR0025364/2024-08-01#Artikel7
  - number: '8'
    text: |-
      1 Het college zendt jaarlijks voor 1 april een werkprogramma voor het daaropvolgende kalenderjaar aan Onze
      Minister.

      2 Het werkprogramma omschrijft in elk geval:

      a. de voorgenomen activiteiten van het college;

      b. de voorstellen voor de uitvoerende werkzaamheden op het terrein van de centrale examens of op het terrein van
      de staatsexamens, bedoeld in [hoofdstuk 2, paragraaf 7, van de Wet voortgezet onderwijs 2020][ref1] en de daarop
      berustende bepalingen, waaronder in ieder geval de werkzaamheden van de Cito;

      c. de voorstellen voor de kosten van de werkzaamheden, bedoeld in onderdeel b.

      3 Het college kan, mits gemotiveerd, aan Onze Minister tussentijds een wijziging van het werkprogramma voorstellen.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Paragraaf7
    url: https://wetten.overheid.nl/BWBR0025364/2024-08-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0044212
        paragraaf: '7'
  - number: 9_bis
    text: |-
      Zolang een of meer van de in [artikel 2, zesde lid][ref1], genoemde artikelen van de
      [Wet op het primair onderwijs][ref2] en de [Wet op de expertisecentra][ref3] niet in werking is of zijn
      getreden, hebben de in het zesde lid beschreven taken van het college en het werkprogramma, bedoeld in
      [artikel 8, tweede lid][ref4], uitsluitend betrekking op de toetsen, bedoeld in de reeds in werking getreden
      artikelen van de Wet op het primair onderwijs en de Wet op de expertisecentra.


