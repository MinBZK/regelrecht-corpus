  - number: '12'
    text: |-
      De archiefbescheiden van de centrale examencommissie vaststelling opgaven, bedoeld in
      [artikel 39, van het Eindexamenbesluit v.w.o.-h.a.v.o.-m.a.v.o.-v.b.o.][ref1], de staatsexamencommissie,
      bedoeld in [artikel 60, eerste lid, van de Wet op het voortgezet onderwijs][ref2] en de commissie, bedoeld in
      [artikel 1, van het Staatsexamenbesluit Nederlands als tweede taal][ref3] zoals deze artikelen luidden op de dag
      voor de inwerkingtreding van [artikel 11][ref4] worden overgedragen aan het college.


