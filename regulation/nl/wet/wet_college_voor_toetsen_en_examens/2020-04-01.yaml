      en [artikel 13 van de Wet op de expertisecentra][ref2] en met inachtneming van
      de referentieniveaus Nederlandse taal en de referentieniveaus rekenen, bedoeld in
      [artikel 2, tweede lid, aanhef en onderdeel b, van de Wet referentieniveaus Nederlandse taal en rekenen][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel9
