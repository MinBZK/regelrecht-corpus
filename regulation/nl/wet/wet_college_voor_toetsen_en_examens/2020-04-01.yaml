    text: het geven van regels met betrekking tot de hulpmiddelen die gebruikt mogen worden bij het maken van de toets; en
    url: https://wetten.overheid.nl/BWBR0025364/2020-04-01#Artikel2
  - number: 2.6.g
    text: het opstellen van het leerlingrapport.
    url: https://wetten.overheid.nl/BWBR0025364/2020-04-01#Artikel2
  - number: '2.7'
    text: 'Het college is verder nog belast met de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0025364/2020-04-01#Artikel2
  - number: 2.7.a
    text: het afnemen van examens onder bijzondere omstandigheden;
    url: https://wetten.overheid.nl/BWBR0025364/2020-04-01#Artikel2
  - number: 2.7.b
    text: |-
      het bij regeling vaststellen welke vakken in een tijdvak met geheimhouding worden afgenomen, waarbij de
      geheimhouding betrekking heeft op de opgaven, de beoordelingsnormen en de daarbij behorende scores, bedoeld in het
      tweede lid, onderdelen c en d, vierde lid onderdelen b en c, en vijfde lid, onderdelen b en c; en
    url: https://wetten.overheid.nl/BWBR0025364/2020-04-01#Artikel2
  - number: 2.7.c
    text: het uitoefenen van andere door Onze Minister opgedragen taken.
    url: https://wetten.overheid.nl/BWBR0025364/2020-04-01#Artikel2
  - number: '2.8'
    text: |-
      De regelingen, bedoeld in het tweede lid, onderdelen e en f, en vijfde lid, onderdeel a, treden slechts in werking
      na goedkeuring door Onze Minister. Onze Minister kan zijn goedkeuring onthouden wegens strijd met het recht of het
      algemeen belang.
    url: https://wetten.overheid.nl/BWBR0025364/2020-04-01#Artikel2
  - number: '2.9'
    text: |-
      In afwijking van [artikel 4, eerste lid, onderdeel b, van de Bekendmakingswet][ref1] kan de bekendmaking van
      een regeling als bedoeld in het tweede lid, onderdeel d, vierde lid, onderdeel c, of vijfde lid, onderdeel c,
      geschieden op een andere geschikte, al dan niet elektronische, wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0004287#Artikel4
    url: https://wetten.overheid.nl/BWBR0025364/2020-04-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0004287
        artikel: '4'
  - number: '3'
    text: |-
      Het college is belast met bij algemene maatregel van bestuur aan te wijzen taken
      ten aanzien van de uitvoering van de centrale examinering in het beroepsonderwijs,
      bedoeld in [artikel 7.4.3a van de Wet educatie en beroepsonderwijs][ref1] en
      [artikel 7.4.4 van de Wet educatie en beroepsonderwijs BES][ref2], en de op dit artikel gebaseerde
      uitvoeringsvoorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0028395#Artikel7
    url: https://wetten.overheid.nl/BWBR0025364/2020-04-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0028395
        artikel: '7'
  - number: '4.1'
    text: Het college heeft ten minste zes leden en ten hoogste acht leden, onder wie een voorzitter.
    url: https://wetten.overheid.nl/BWBR0025364/2020-04-01#Artikel4
  - number: '4.2'
    text: |-
      Voor ieder lid van het college, de voorzitter uitgezonderd, zal Onze Minister één plaatsvervangend
      lid benoemen. Op de plaatsvervangende leden zijn de [artikelen 9][ref1], [12][ref2], [13][ref3] en
      [14 van de Kaderwet zelfstandige bestuursorganen][ref4] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0020495#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0020495#Artikel13
      [ref4]: https://wetten.overheid.nl/BWBR0020495#Artikel14
    url: https://wetten.overheid.nl/BWBR0025364/2020-04-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0020495
        artikel: '12'
      - id: ref3
        bwb_id: BWBR0020495
        artikel: '13'
      - id: ref4
        bwb_id: BWBR0020495
        artikel: '14'
  - number: '4.3'
    text: |-
      Onze Minister draagt bij de benoeming van de leden en de plaatsvervangende leden van het college zorg voor
      de onafhankelijkheid en deskundigheid van deze leden en voor voldoende draagvlak bij de representatieve
      onderwijsorganisaties voor hun benoeming.
    url: https://wetten.overheid.nl/BWBR0025364/2020-04-01#Artikel4
  - number: '4.4'
    text: |-
      De leden en de plaatsvervangende leden worden benoemd voor een periode van ten hoogste vier jaar. De leden en de
      plaatsvervangende leden kunnen éénmaal worden herbenoemd voor een periode van ten hoogste vier jaar.
    url: https://wetten.overheid.nl/BWBR0025364/2020-04-01#Artikel4
  - number: '5.1'
    text: |-
      Het college heeft een bureau ter ondersteuning van zijn werkzaamheden bestaande uit een directeur en andere
      medewerkers.
    url: https://wetten.overheid.nl/BWBR0025364/2020-04-01#Artikel5
  - number: '5.2'
    text: De directeur en de andere medewerkers zijn geen lid van het college.
    url: https://wetten.overheid.nl/BWBR0025364/2020-04-01#Artikel5
  - number: '5.3'
    text: |-
      Onze Minister gaat arbeidsovereenkomsten aan en wijzigt en beëindigt deze namens de Staat met de directeur en de
      andere medewerkers na overleg met de voorzitter van het college.
    url: https://wetten.overheid.nl/BWBR0025364/2020-04-01#Artikel5
  - number: '6'
    text: De voorzitter vertegenwoordigt het college in en buiten rechte.
    url: https://wetten.overheid.nl/BWBR0025364/2020-04-01#Artikel6
  - number: '7'
    text: |-
      Het college stelt een bestuursreglement vast, waarin in elk geval regels over de werkwijze en procedures zijn
      opgenomen.
    url: https://wetten.overheid.nl/BWBR0025364/2020-04-01#Artikel7
  - number: '8.1'
    text: Het college zendt jaarlijks voor 1 april een werkprogramma voor het daaropvolgende kalenderjaar aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0025364/2020-04-01#Artikel8
  - number: '8.2'
    text: 'Het werkprogramma omschrijft in elk geval:'
    url: https://wetten.overheid.nl/BWBR0025364/2020-04-01#Artikel8
  - number: 8.2.a
    text: de voorgenomen activiteiten van het college;
    url: https://wetten.overheid.nl/BWBR0025364/2020-04-01#Artikel8
  - number: 8.2.b
    text: |-
      de voorstellen voor de uitvoerende werkzaamheden op het terrein van de toetsen, bedoeld in
      [artikel 9b van de Wet op het primair onderwijs][ref1] en [artikel 18b van de Wet op de expertisecentra][ref2],
      de centrale examens of op het terrein van de staatsexamens, bedoeld in [artikel 60 van de WVO][ref3] en de daarop
      berustende bepalingen, waaronder in ieder geval de werkzaamheden van de Cito;


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel9b
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel18b
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel60
    url: https://wetten.overheid.nl/BWBR0025364/2020-04-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 9b
      - id: ref2
        bwb_id: BWBR0003549
        artikel: 18b
      - id: ref3
        bwb_id: BWBR0002399
        artikel: '60'
  - number: 8.2.c
    text: de voorstellen voor de kosten van de werkzaamheden, bedoeld in onderdeel b.
    url: https://wetten.overheid.nl/BWBR0025364/2020-04-01#Artikel8
  - number: '8.3'
    text: Het college kan, mits gemotiveerd, aan Onze Minister tussentijds een wijziging van het werkprogramma voorstellen.
    url: https://wetten.overheid.nl/BWBR0025364/2020-04-01#Artikel8
  - number: 9_bis
    text: |-
      Zolang een of meer van de in [artikel 2, zesde lid][ref1], genoemde artikelen van de
      [Wet op het primair onderwijs][ref2] en de [Wet op de expertisecentra][ref3] niet in werking is of zijn
      getreden, hebben de in het zesde lid beschreven taken van het college en het werkprogramma, bedoeld in
      [artikel 8, tweede lid][ref4], uitsluitend betrekking op de toetsen, bedoeld in de reeds in werking getreden
      artikelen van de Wet op het primair onderwijs en de Wet op de expertisecentra.


