    text: |-
      het tot stand brengen en vaststellen van de opgaven van de toets en het bij regeling
      vaststellen van de toetswijzer overeenkomstig de kerndoelen voor de kennisgebieden, genoemd
      in [artikel 9, tweede lid, onderdelen a, b en c, van de Wet op het primair onderwijs][ref1] en
      [artikel 13, derde lid, onderdelen a, b en c, van de Wet op de expertisecentra][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel9
