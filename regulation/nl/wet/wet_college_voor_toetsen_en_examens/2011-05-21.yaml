  - number: '5'
    text: |-
      1 Het college heeft een bureau ter ondersteuning van zijn werkzaamheden bestaande uit een directeur en andere
      medewerkers.

      2 De directeur en de andere medewerkers zijn geen lid van het college.

      3 Onze Minister benoemt, bevordert, schorst en ontslaat na overleg met de voorzitter, de directeur en de andere
      medewerkers.
    url: https://wetten.overheid.nl/BWBR0025364/2011-05-21#Artikel5
  - number: '6'
    text: De voorzitter vertegenwoordigt het college in en buiten rechte.
    url: https://wetten.overheid.nl/BWBR0025364/2011-05-21#Artikel6
  - number: '7'
    text: |-
      Het college stelt een bestuursreglement vast, waarin in elk geval regels over de werkwijze en procedures zijn
      opgenomen.
    url: https://wetten.overheid.nl/BWBR0025364/2011-05-21#Artikel7
  - number: '8'
    text: |-
      1 Het college zendt jaarlijks voor 1 april een werkprogramma voor het daaropvolgende kalenderjaar aan Onze
      Minister.

      2 Het werkprogramma omschrijft in elk geval:

      a. de voorgenomen activiteiten van het college;

      b. de voorstellen voor de uitvoerende werkzaamheden op het terrein van de centrale examens of op het terrein van
      de staatsexamens, bedoeld in [artikel 60 van de WVO][ref1] en de daarop berustende bepalingen, waaronder in ieder
      geval de werkzaamheden van de Cito;

      c. de voorstellen voor de kosten van de werkzaamheden, bedoeld in onderdeel b.

      3 Het college kan, mits gemotiveerd, aan Onze Minister tussentijds een wijziging van het werkprogramma voorstellen.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel60
    url: https://wetten.overheid.nl/BWBR0025364/2011-05-21#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '60'
  - number: '12'
    text: |-
      De archiefbescheiden van de centrale examencommissie vaststelling opgaven, bedoeld in
      [artikel 39, van het Eindexamenbesluit v.w.o.-h.a.v.o.-m.a.v.o.-v.b.o.][ref1], de staatsexamencommissie,
      bedoeld in [artikel 60, eerste lid, van de Wet op het voortgezet onderwijs][ref2] en de commissie, bedoeld in
      [artikel 1, van het Staatsexamenbesluit Nederlands als tweede taal][ref3] zoals deze artikelen luidden op de dag
      voor de inwerkingtreding van [artikel 11][ref4] worden overgedragen aan het college.


