        artikel: 7.4.4
  - number: '4'
    text: |-
      1 Het college heeft ten minste zes leden en ten hoogste acht leden, onder wie een voorzitter.

      2 Voor ieder lid van het college, de voorzitter uitgezonderd, zal Onze Minister één plaatsvervangend
      lid benoemen. Op de plaatsvervangende leden zijn de [artikelen 9][ref1], [12][ref2], [13][ref3] en
      [14 van de Kaderwet zelfstandige bestuursorganen][ref4] van overeenkomstige toepassing.

      3 Onze Minister draagt bij de benoeming van de leden en de plaatsvervangende leden van het college zorg
      voor de onafhankelijkheid en deskundigheid van deze leden en voor voldoende draagvlak bij de representatieve
      onderwijsorganisaties voor hun benoeming.

      4 De leden en de plaatsvervangende leden worden benoemd voor een periode van ten hoogste vier jaar. De leden en de
      plaatsvervangende leden kunnen éénmaal worden herbenoemd voor een periode van ten hoogste vier jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0020495#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0020495#Artikel13
