  - number: '3'
    text: |-
      Het college is belast met bij algemene maatregel van bestuur aan te wijzen taken
      ten aanzien van de uitvoering van de centrale examinering in het beroepsonderwijs,
      bedoeld in [artikel 7.4.3a van de Wet educatie en beroepsonderwijs][ref1] en
      [artikel 7.4.4 van de Wet educatie en beroepsonderwijs BES][ref2], en de op dit artikel gebaseerde
      uitvoeringsvoorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7.4.3a
      [ref2]: https://wetten.overheid.nl/BWBR0028395#Artikel7.4.4
