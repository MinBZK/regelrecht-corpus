preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is over te gaan tot externe verzelfstandiging van het
    dienstonderdeel de Centrale examencommissie vaststelling opgaven van het Ministerie van Onderwijs, Cultuur en
    Wetenschap, de Staatsexamencommissie en de Staatsexamencommissie Nederlands als tweede taal door instelling van
    een zelfstandig bestuursorgaan en in verband daarmee de Wet op het onderwijstoezicht en de Wet op het voortgezet
    onderwijs te wijzigen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0025364/2011-05-21#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet wordt verstaan onder:

        - *college:* College voor examens, genoemd in [artikel 2, eerste lid][ref1];
        - *Cito:* Stichting Cito Instituut voor Toetsontwikkeling, genoemd in
      [artikel 12 van de Wet subsidiëring landelijke ondersteunende activiteiten][ref2];
        - *Onze Minister:* Onze Minister van Onderwijs, Cultuur en Wetenschap en wat betreft het landbouwonderwijs, Onze
      Minister van Landbouw, Natuur en Voedselkwaliteit.


      [ref1]: https://wetten.overheid.nl/BWBR0025364#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0008725#Artikel12
    url: https://wetten.overheid.nl/BWBR0025364/2011-05-21#Artikel1
