preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is het Buitengewoon Besluit Werklozenzorg (Stb. 1944,
    E 79), waarop steunt de Sociale Voorziening (Stcrt. 1955, 77), in te trekken en in verband hiermede bij de wet
    regelen te stellen inzake uitkeringen aan werkloze werknemers;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002470/2008-08-01#ArtikelAanhef
