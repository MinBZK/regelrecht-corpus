  - number: '40.2'
    text: Onze Minister kan regelen stellen ter bepaling van de in het eerste lid onder *f* bedoelde kosten.
    url: https://wetten.overheid.nl/BWBR0002470/2008-08-01#Artikel40
  - number: '42.1'
    text: |-
      Indien uit de verantwoordingsinformatie, bedoeld in
      [artikel 17a, eerste lid, van de Financiële-verhoudingswet][ref1], blijkt dat uitgaven hetzij met de bepalingen
      van deze wet of de voor haar uitvoering gestelde regelen in strijd zijn, hetzij door het college van burgemeester
      en wethouders niet op bevredigende wijze zijn verantwoord, kan Onze Minister een vergoeding geheel of gedeeltelijk
      weigeren en een reeds uitbetaalde vergoeding geheel of gedeeltelijk terugvorderen dan wel verrekenen.


      [ref1]: https://wetten.overheid.nl/BWBR0008290#Artikel17a
    url: https://wetten.overheid.nl/BWBR0002470/2008-08-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0008290
        artikel: 17a
  - number: '42.2'
    text: |-
      Onze Minister doet binnen een jaar na ontvangst door Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties
      van de verantwoordingsinformatie mededeling van terugvordering aan het college van burgemeester en wethouders.
    url: https://wetten.overheid.nl/BWBR0002470/2008-08-01#Artikel42
  - number: '43'
    text: |-
      De werknemer is verplicht aan het college van burgemeester en wethouders, dat hem een uitkering heeft toegekend,
      onverwijld mededeling te doen van elke verandering van feiten en omstandigheden, waarvan hij weet of redelijkerwijs
      moet vermoeden, dat zij tot intrekking of verlaging van de uitkering aanleiding kan geven.
    url: https://wetten.overheid.nl/BWBR0002470/2008-08-01#Artikel43
  - number: '44.1'
    text: |-
      Ieder is verplicht aan het college van burgemeester en wethouders of een daartoe schriftelijk door het college van
      burgemeester en wethouders gemachtigde persoon de opgaven en inlichtingen te verstrekken, welke voor de uitvoering
      van deze wet van hem worden verlangd met betrekking tot degene, die in zijn dienst dan wel te zijnen behoeve werkt
      of gewerkt heeft.
    url: https://wetten.overheid.nl/BWBR0002470/2008-08-01#Artikel44
  - number: '44.2'
    text: |-
      De opgaven en inlichtingen moeten, indien dit wordt verzocht, schriftelijk worden verstrekt binnen een door het
      college van burgemeester en wethouders of de persoon, bedoeld in het eerste lid, schriftelijk te stellen termijn.
    url: https://wetten.overheid.nl/BWBR0002470/2008-08-01#Artikel44
  - number: '44.3'
    text: |-
      Ieder is verplicht aan het college van burgemeester en wethouders of een daartoe schriftelijk door het college van
      burgemeester en wethouders gemachtigde persoon ten behoeve van de uitvoering van deze wet desgevraagd inzage te
      geven in boeken, bescheiden en andere stukken, voor zover deze betrekking hebben op de arbeid en het loon van een
      persoon, die in zijn dienst dan wel te zijnen behoeve werkt of gewerkt heeft.
    url: https://wetten.overheid.nl/BWBR0002470/2008-08-01#Artikel44
  - number: '45'
    text: |-
      De uitvoeringsorganen van de sociale verzekeringswetten zijn verplicht aan het college van burgemeester en
      wethouders of aan een daartoe schriftelijk door het college van burgemeester en wethouders gemachtigde persoon
      desgevraagd de inlichtingen te verschaffen, welke dat bestuur, onderscheidenlijk die persoon, ten behoeve van de
      uitvoering van deze wet nodig acht.
    url: https://wetten.overheid.nl/BWBR0002470/2008-08-01#Artikel45
