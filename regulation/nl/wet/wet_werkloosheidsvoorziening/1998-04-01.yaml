  - number: '42'
    text: >-
      1 Onze Minister kan een vergoeding geheel of gedeeltelijk weigeren en een reeds uitbetaalde vergoeding geheel of
      gedeeltelijk terugvorderen dan wel verrekenen, indien zij betreft uitgaven welke:


      a. hetzij met de bepalingen van deze wet of de voor haar uitvoering gestelde regelen in strijd zijn;


      b. hetzij door het gemeentebestuur niet op bevredigende wijze zijn verantwoord.
    url: https://wetten.overheid.nl/BWBR0002470/1998-04-01#Artikel42
  - number: '43'
    text: >-
      De werknemer is verplicht aan het gemeentebestuur, dat hem een uitkering heeft toegekend, onverwijld mededeling te
      doen van elke verandering van feiten en omstandigheden, waarvan hij weet of redelijkerwijs moet vermoeden, dat zij
      tot intrekking of verlaging van de uitkering aanleiding kan geven.
    url: https://wetten.overheid.nl/BWBR0002470/1998-04-01#Artikel43
  - number: '44'
    text: >-
      1 Ieder is verplicht aan het gemeentebestuur of een daartoe schriftelijk door het gemeentebestuur gemachtigde
      persoon de opgaven en inlichtingen te verstrekken, welke voor de uitvoering van deze wet van hem worden verlangd
      met betrekking tot degene, die in zijn dienst dan wel te zijnen behoeve werkt of gewerkt heeft.


      2 De opgaven en inlichtingen moeten, indien dit wordt verzocht, schriftelijk worden verstrekt binnen een door het
      gemeentebestuur of de persoon, bedoeld in het eerste lid, schriftelijk te stellen termijn.


      3 Ieder is verplicht aan het gemeentebestuur of een daartoe schriftelijk door het gemeentebestuur gemachtigde
      persoon ten behoeve van de uitvoering van deze wet desgevraagd inzage te geven in boeken, bescheiden en andere
      stukken, voor zover deze betrekking hebben op de arbeid en het loon van een persoon, die in zijn dienst dan wel te
      zijnen behoeve werkt of gewerkt heeft.
    url: https://wetten.overheid.nl/BWBR0002470/1998-04-01#Artikel44
  - number: '45'
    text: >-
      De uitvoeringsorganen van de sociale verzekeringswetten zijn verplicht aan het gemeentebestuur of aan een daartoe
      schriftelijk door het gemeentebestuur gemachtigde persoon desgevraagd de inlichtingen te verschaffen, welke dat
      bestuur, onderscheidenlijk die persoon, ten behoeve van de uitvoering van deze wet nodig acht.
    url: https://wetten.overheid.nl/BWBR0002470/1998-04-01#Artikel45
