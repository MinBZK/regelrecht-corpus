preamble:
  text: >-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.


    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:


    Alzo Wij in overweging genomen hebben, dat het wenselijk is het Buitengewoon Besluit Werklozenzorg (Stb. 1944,
    E 79), waarop steunt de Sociale Voorziening (Stcrt. 1955, 77), in te trekken en in verband hiermede bij de wet
    regelen te stellen inzake uitkeringen aan werkloze werknemers;


    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002470/1998-04-01#ArtikelAanhef
articles:
  - number: '40'
    text: |-
      1 Het Rijk vergoedt aan de gemeente:

      a. de ingevolge deze wet aan de werknemers verstrekte netto- uitkeringen;

      b. de ter zake van de uitkeringen verschuldigde loonbelasting en premies ingevolge sociale verzekeringswetten;

      c. de op grond van [artikel 8][ref1] aan leden van de commissie toegekende vacatiegelden en vergoedingen voor reis-
      en verblijfkosten;

      d. de kosten van medisch advies in verband met het bepaalde in [artikel 13, eerste lid, onder ][ref2],
      [artikel 21, tweede lid][ref3], en [artikel 26, tweede lid][ref4],

      e. de kosten van terugvordering van ten onrechte verstrekte uitkeringen, voor zover deze wet zich niet tegen
      terugvordering verzet;

      f. de kosten van het in [artikel 21, eerste lid][ref5], en [artikel 26, eerste lid][ref6], bedoelde onderzoek;

      2 Onze Minister kan regelen stellen ter bepaling van de in het eerste lid onder *f* bedoelde kosten.


