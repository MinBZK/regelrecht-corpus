  - number: '41'
    text: |-
      1 Onze Minister stelt regelen inzake het declareren van de in [artikel 40][ref1] vermelde uitgaven, alsmede inzake
      het door het gemeentebestuur verstrekken van nadere gegevens, welke op deze uitgaven betrekking hebben, waaronder
      een verklaring van een of meer accountants, belast met de krachtens [artikel 213 van de Gemeentewet][ref2]
      voorgeschreven controle, omtrent de juistheid van de bedoelde gegevens.

      2 Indien de in het vorige lid bedoelde verklaring geen zekerheid omtrent de in [artikel 40][ref3] vermelde uitgaven
      van de gemeente biedt, kan Onze Minister van het gemeentebestuur de aanvullende gegevens verlangen, die hij voor de
      beoordeling van de gedeclareerde uitgaven behoeft.


      [ref1]: https://wetten.overheid.nl/BWBR0002470#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel213
      [ref3]: https://wetten.overheid.nl/BWBR0002470#Artikel40
