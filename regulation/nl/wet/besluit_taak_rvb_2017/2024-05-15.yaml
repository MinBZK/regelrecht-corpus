---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_taak_rvb_2017
regulatory_layer: WET
publication_date: '2024-05-14'
valid_from: '2024-05-15'
bwb_id: BWBR0040475
url: https://wetten.overheid.nl/BWBR0040475/2024-05-15
preamble:
  text: |-
    Handelend in overeenstemming met het gevoelen van de ministerraad;

    Gelet op artikel 3, tweede lid, van het Coördinatiebesluit organisatie en bedrijfsvoering rijksdienst 2011;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0040475/2024-05-15#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0040475/2024-05-15#Artikel1
  - number: 1.a)
    text: |-
      *Rijksvastgoedbedrijf:* het baten-lastenagentschap Rijksvastgoedbedrijf bedoeld in
      [artikel 8, derde lid, onder a, van het Organisatiebesluit BZK 2016][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0038547#Artikel8
    url: https://wetten.overheid.nl/BWBR0040475/2024-05-15#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0038547
        artikel: '8'
  - number: 1.b)
    text: '*andere ministers:* ministers niet zijnde de Minister van Binnenlandse Zaken en Koninkrijksrelaties;'
    url: https://wetten.overheid.nl/BWBR0040475/2024-05-15#Artikel1
  - number: 1.c)
    text: |-
      *materieelbeheer:* de zorg voor het onderhoud en de instandhouding van onroerende zaken vanaf het moment van
      inbeheer- of ingebruikneming tot aan het moment van afstoting;
    url: https://wetten.overheid.nl/BWBR0040475/2024-05-15#Artikel1
  - number: 1.d)
    text: |-
      *beperkt zakelijk recht:* recht van vruchtgebruik op onroerende zaak, mandeligheid, erfdienstbaarheid, erfpacht,
      opstal en appartementsrecht;
    url: https://wetten.overheid.nl/BWBR0040475/2024-05-15#Artikel1
  - number: 1.e)
    text: '*vaststellingsovereenkomst:* vaststellingsovereenkomst met betrekking tot onroerende zaak;'
    url: https://wetten.overheid.nl/BWBR0040475/2024-05-15#Artikel1
  - number: 1.f)
    text: |-
      *grondrente:* het recht om van de eigenaar van een onroerende zaak in diens hoedanigheid van eigenaar periodiek een
      vaste geldsom of een vaste waarde in de voortbrengselen te ontvangen;
    url: https://wetten.overheid.nl/BWBR0040475/2024-05-15#Artikel1
  - number: 1.g)
    text: '*grensregeling:* regeling met betrekking tot eigendomsgrenzen van een onroerende zaak;'
    url: https://wetten.overheid.nl/BWBR0040475/2024-05-15#Artikel1
  - number: 1.h)
    text: |-
      *zakelijke lasten:* belastingen en heffingen verschuldigd door de Staat als eigenaar van of beperkt zakelijke
      gerechtigde met betrekking tot een onroerende zaak;
    url: https://wetten.overheid.nl/BWBR0040475/2024-05-15#Artikel1
  - number: 1.i)
    text: '*ondersteuning van de verwezenlijking van nationale beleidsdoelen voor de fysieke leefomgeving:*'
    url: https://wetten.overheid.nl/BWBR0040475/2024-05-15#Artikel1
  - number: 1.i).1°
    text: |-
      het ondersteunen en uitvoeren van taken van de verantwoordelijke minister op het gebied van woningbouw en
      ruimtelijke ontwikkeling, en
    url: https://wetten.overheid.nl/BWBR0040475/2024-05-15#Artikel1
  - number: 1.i).2°
    text: |-
      het deelnemen, in voorkomend geval in overeenstemming met andere ministers die het aangaat, in processen gericht
      op het toedelen van een nieuwe functie aan een of meer locaties in een gebied en het realiseren van die functie, in
      gevallen waarin in een omgevingsvisie of programma van het Rijk als bedoeld in de [Omgevingswet][ref1] of een ander
      door een bestuursorgaan van het Rijk openbaar gemaakt document: - een nieuwe functie is toegedacht aan de betrokken
      locaties, of
        - een nationaal belang voor de fysieke leefomgeving is aangegeven dat met de toedeling en realisatie van de nieuwe
      functie is gediend en de Staat eigenaar is van benodigde gronden in het gebied.


      [ref1]: https://wetten.overheid.nl/BWBR0037885
    url: https://wetten.overheid.nl/BWBR0040475/2024-05-15#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0037885
  - number: '2.1'
    text: 'Het Rijksvastgoedbedrijf is belast met het in gebruik geven van onroerende zaken aan:'
    url: https://wetten.overheid.nl/BWBR0040475/2024-05-15#Artikel2
  - number: 2.1.a
    text: organen en organisaties die onderdeel uitmaken van rechtspersoon Staat, en
    url: https://wetten.overheid.nl/BWBR0040475/2024-05-15#Artikel2
  - number: 2.1.b
    text: |-
      organen en organisaties aan wie het in gebruik geven van onroerende zaken bij of krachtens wet aan de Staat is
      opgedragen,
    url: https://wetten.overheid.nl/BWBR0040475/2024-05-15#Artikel2
  - number: '2.2'
    text: |-
      Het Rijksvastgoedbedrijf is tevens belast met het in gebruik geven van onroerende zaken aan andere organisaties dan
      bedoeld in het eerste lid, op verzoek van een van de andere ministers, indien aan de nadere voorwaarden voor deze
      ingebruikgeving, gesteld door de Minister van Binnenlandse Zaken en Koninkrijksrelaties, is voldaan.
    url: https://wetten.overheid.nl/BWBR0040475/2024-05-15#Artikel2
  - number: '2.3'
    text: |-
      De taak, bedoeld in het eerste en tweede lid, omvat ook het zo nodig daarvoor in eigendom verwerven van, het
      verkrijgen van beperkt zakelijke rechten op, en het aanhuren van onroerende zaken, het bouwen, verbouwen en
      inrichten daarvan en het uitbrengen van adviezen met betrekking tot het in het eerste en tweede lid bedoelde in
      gebruik geven van onroerende zaken.
    url: https://wetten.overheid.nl/BWBR0040475/2024-05-15#Artikel2
  - number: '2.4'
    text: 'De taak, bedoeld in het eerste lid, omvat niet:'
    url: https://wetten.overheid.nl/BWBR0040475/2024-05-15#Artikel2
  - number: 2.4.a
    text: |-
      het in gebruik geven van specifieke onroerende zaken benodigd voor de uitvoering van de taken van de
      krijgsmachtdelen van het ministerie van Defensie;
    url: https://wetten.overheid.nl/BWBR0040475/2024-05-15#Artikel2
  - number: 2.4.b
    text: |-
      het in gebruik geven van specifieke onroerende zaken benodigd voor de uitvoering van de taken van de Minister van
      Infrastructuur en Waterstaat, en
    url: https://wetten.overheid.nl/BWBR0040475/2024-05-15#Artikel2
  - number: 2.4.c
    text: het in gebruik geven van onroerende zaken buiten Nederland.
    url: https://wetten.overheid.nl/BWBR0040475/2024-05-15#Artikel2
  - number: '3.1'
    text: |-
      Het Rijksvastgoedbedrijf is belast met het tot gebruik ter beschikking stellen van de paleizen, genoemd in
      [artikel 4, eerste lid, van de Wet financieel statuut van het Koninklijk Huis][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002845#Artikel4
    url: https://wetten.overheid.nl/BWBR0040475/2024-05-15#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002845
        artikel: '4'
  - number: '3.2'
    text: |-
      Het Rijksvastgoedbedrijf is belast met het tot gebruik ter beschikking stellen van onroerende zaken overeenkomstig
      [artikel 4, tweede, derde en vierde lid, van de Wet financieel statuut van het Koninklijk Huis][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002845#Artikel4
    url: https://wetten.overheid.nl/BWBR0040475/2024-05-15#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002845
        artikel: '4'
  - number: '3.3'
    text: |-
      De taak, bedoeld in het tweede lid, omvat ook het zo nodig daarvoor in eigendom verwerven van, het verkrijgen
      van beperkt zakelijke rechten met betrekking tot en het aanhuren van onroerende zaken als bedoeld in dit lid, het
      bouwen, verbouwen en inrichten daarvan en het adviseren hieromtrent.
    url: https://wetten.overheid.nl/BWBR0040475/2024-05-15#Artikel3
  - number: '4.1'
    text: 'Het Rijksvastgoedbedrijf is belast met het materieelbeheer van:'
    url: https://wetten.overheid.nl/BWBR0040475/2024-05-15#Artikel4
  - number: 4.1.a
    text: |-
      de onroerende zaken die het met het oog op uitvoering van de taken, bedoeld in de [artikelen 2][ref1] en
      [7][ref2], aanhoudt en in gebruik heeft gegeven;


      [ref1]: https://wetten.overheid.nl/BWBR0040475#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0040475#Artikel7
    url: https://wetten.overheid.nl/BWBR0040475/2024-05-15#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0040475
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0040475
        artikel: '7'
  - number: 4.1.b
    text: |-
      de onroerende zaken die het overeenkomstig [artikel 3][ref1] tot gebruik ter beschikking heeft gesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0040475#Artikel3
    url: https://wetten.overheid.nl/BWBR0040475/2024-05-15#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0040475
        artikel: '3'
  - number: 4.1.c
    text: Park Sorghvliet in Den Haag;
    url: https://wetten.overheid.nl/BWBR0040475/2024-05-15#Artikel4
  - number: 4.1.d
    text: het Staatsdomein bij het Loo;
    url: https://wetten.overheid.nl/BWBR0040475/2024-05-15#Artikel4
  - number: 4.1.e
    text: de agrarische Domeingronden;
    url: https://wetten.overheid.nl/BWBR0040475/2024-05-15#Artikel4
  - number: 4.1.f
    text: |-
      verbeurd verklaarde onroerende zaken en onroerende zaken die in gevolge een transactie met het Openbaar Ministerie
      eigendom van de Staat zijn geworden, en
    url: https://wetten.overheid.nl/BWBR0040475/2024-05-15#Artikel4
  - number: 4.1.g
    text: de overtollig gestelde onroerende zaken bij het Rijk,
    url: https://wetten.overheid.nl/BWBR0040475/2024-05-15#Artikel4
  - number: '4.2'
    text: |-
      De taak bedoeld in het eerste lid omvat mede het onderhoud, vernieuwen en aanvullen van de aan de
      Staat toebehorende roerende zaken die behoren tot de vaste inrichting van de paleizen, genoemd in
      [artikel 4, eerste lid, van de Wet financieel statuut van het Koninklijk Huis][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002845#Artikel4
    url: https://wetten.overheid.nl/BWBR0040475/2024-05-15#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002845
        artikel: '4'
  - number: '5'
    text: |-
      Het Rijksvastgoedbedrijf is belast met de bevordering en bewaking van de kwaliteit van de architectuur,
      van de stedenbouwkundige inpassing, van de beeldende kunst en van de duurzaamheid bij de uitvoering
      van de taken genoemd in de [artikelen 2, eerste en tweede lid][ref1], [3, eerste en tweede lid][ref2],
      [4, eerste lid, onderdelen a, b, c, d, e en g, en tweede lid][ref3], en [7][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0040475#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0040475#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0040475#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0040475#Artikel7
    url: https://wetten.overheid.nl/BWBR0040475/2024-05-15#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0040475
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0040475
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0040475
        artikel: '4'
      - id: ref4
        bwb_id: BWBR0040475
        artikel: '7'
  - number: '6'
    text: 'Het Rijksvastgoedbedrijf is belast met:'
    url: https://wetten.overheid.nl/BWBR0040475/2024-05-15#Artikel6
  - number: 6.a
    text: |-
      het vervreemden, belasten met beperkt zakelijke rechten, verpachten, verhuren en op andere wijze aan derden in
      gebruik geven van onroerende zaken;
    url: https://wetten.overheid.nl/BWBR0040475/2024-05-15#Artikel6
  - number: 6.b
    text: het vervreemden en belasten met beperkt zakelijke rechten van aan de Staat verleende beperkt zakelijke rechten;
    url: https://wetten.overheid.nl/BWBR0040475/2024-05-15#Artikel6
  - number: 6.c
    text: |-
      het aangaan van vaststellingsovereenkomsten en grensregelingen en het afkopen van grondrenten met betrekking tot
      onroerende zaken;
    url: https://wetten.overheid.nl/BWBR0040475/2024-05-15#Artikel6
  - number: 6.d
    text: de behandeling en betaling van zakelijke lasten met betrekking tot onroerende zaken;
    url: https://wetten.overheid.nl/BWBR0040475/2024-05-15#Artikel6
  - number: 6.e
    text: het nemen van maatregelen tegen inbreuken op het eigendomsrecht met betrekking tot onroerende zaken, en
    url: https://wetten.overheid.nl/BWBR0040475/2024-05-15#Artikel6
  - number: 6.f
    text: |-
      het verrichten van alle andere privaatrechtelijke rechtshandelingen die voortvloeien uit de positie van de Staat
      als eigenaar van onroerende zaken of als beperkt zakelijk gerechtigde,
    url: https://wetten.overheid.nl/BWBR0040475/2024-05-15#Artikel6
  - number: '7.1'
    text: |-
      Het Rijksvastgoedbedrijf is ter ondersteuning van de verwezenlijking van nationale beleidsdoelen voor de fysieke
      leefomgeving belast met:
    url: https://wetten.overheid.nl/BWBR0040475/2024-05-15#Artikel7
  - number: 7.1.a
    text: het in eigendom verwerven van onroerende zaken;
    url: https://wetten.overheid.nl/BWBR0040475/2024-05-15#Artikel7
  - number: 7.1.b
    text: het verwerven van beperkt zakelijke rechten op onroerende zaken;
    url: https://wetten.overheid.nl/BWBR0040475/2024-05-15#Artikel7
  - number: 7.1.c
    text: het aanhuren van onroerende zaken;
    url: https://wetten.overheid.nl/BWBR0040475/2024-05-15#Artikel7
  - number: 7.1.d
    text: het inrichten en bouwen of verbouwen van onroerende zaken;
    url: https://wetten.overheid.nl/BWBR0040475/2024-05-15#Artikel7
  - number: 7.1.e
    text: het onderhouden en in stand houden van onroerende zaken;
    url: https://wetten.overheid.nl/BWBR0040475/2024-05-15#Artikel7
  - number: 7.1.f
    text: |-
      de handelingen, bedoeld in [artikel 6, onderdelen a, b, c en f][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0040475#Artikel6
    url: https://wetten.overheid.nl/BWBR0040475/2024-05-15#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0040475
        artikel: '6'
  - number: '7.2'
    text: |-
      Het Rijksvastgoedbedrijf is in het kader van het deelnemen in processen ter ondersteuning
      van de verwezenlijking van nationale beleidsdoelen voor de fysieke leefomgeving, bedoeld in
      [artikel 1, onder i, aanhef en onder 2°][ref1], tevens belast met andere handelingen die voor het welslagen van
      de wijziging van de toedeling van functies aan locaties en het verzekeren van de realisatie van de nieuwe functie
      noodzakelijk zijn, daaronder in elk geval begrepen:


      [ref1]: https://wetten.overheid.nl/BWBR0040475#Artikel1
    url: https://wetten.overheid.nl/BWBR0040475/2024-05-15#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0040475
        artikel: '1'
  - number: 7.2.a
    text: het doen opstellen van ruimtelijke plannen;
    url: https://wetten.overheid.nl/BWBR0040475/2024-05-15#Artikel7
  - number: 7.2.b
    text: het sluiten van samenwerkings- en realisatieovereenkomsten;
    url: https://wetten.overheid.nl/BWBR0040475/2024-05-15#Artikel7
  - number: 7.2.c
    text: het investeren in het geschikt maken van onroerende zaken voor de nieuwe functie;
    url: https://wetten.overheid.nl/BWBR0040475/2024-05-15#Artikel7
  - number: 7.2.d
    text: het participeren in entiteiten die gericht zijn op realisatie van de nieuwe functie, en
    url: https://wetten.overheid.nl/BWBR0040475/2024-05-15#Artikel7
  - number: 7.2.e
    text: |-
      het vervreemden van onroerende zaken aan gemeenten of provincies naar aanleiding van een daartoe strekkend verzoek,
      voor zover aan de nadere voorwaarden voor deze vervreemding, gesteld door de Minister van Binnenlandse Zaken en
      Koninkrijksrelaties, is voldaan.
    url: https://wetten.overheid.nl/BWBR0040475/2024-05-15#Artikel7
  - number: '8'
    text: 'Het Rijksvastgoedbedrijf is belast met:'
    url: https://wetten.overheid.nl/BWBR0040475/2024-05-15#Artikel8
  - number: 8.a
    text: de vervreemding van de bodemmaterialen die uit de onroerende zaken van de Staat afkomstig zijn;
    url: https://wetten.overheid.nl/BWBR0040475/2024-05-15#Artikel8
  - number: 8.b
    text: |-
      het verrichten van alle privaatrechtelijke rechtshandelingen bij de bevordering van de afwikkeling van onbeheerde
      nalatenschappen en de afwikkeling van nalatenschappen waarvoor de Staat als erfgenaam is benoemd, en
    url: https://wetten.overheid.nl/BWBR0040475/2024-05-15#Artikel8
  - number: 8.c
    text: |-
      het verrichten van alle privaatrechtelijke rechtshandelingen die voortvloeien uit de positie van de Staat als
      eigenaar van de scheepswrakken en lading van de voormalige Verenigde Oost-Indische Compagnie, West-Indische
      Compagnie en Admiraliteit.
    url: https://wetten.overheid.nl/BWBR0040475/2024-05-15#Artikel8
  - number: '9'
    text: |-
      Het Rijksvastgoedbedrijf is belast met het op verzoek van een van de andere ministers, ondersteunen van
      organisaties als bedoeld in [artikel 2, tweede lid][ref1], bij:


      [ref1]: https://wetten.overheid.nl/BWBR0040475#Artikel2
    url: https://wetten.overheid.nl/BWBR0040475/2024-05-15#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0040475
        artikel: '2'
  - number: 9.a
    text: het in eigendom verwerven van onroerende zaken;
    url: https://wetten.overheid.nl/BWBR0040475/2024-05-15#Artikel9
  - number: 9.b
    text: het verwerven van beperkt zakelijke rechten op onroerende zaken;
    url: https://wetten.overheid.nl/BWBR0040475/2024-05-15#Artikel9
  - number: 9.c
    text: het aanhuren van onroerende zaken;
    url: https://wetten.overheid.nl/BWBR0040475/2024-05-15#Artikel9
  - number: 9.d
    text: het inrichten en (ver)bouwen van onroerende zaken;
    url: https://wetten.overheid.nl/BWBR0040475/2024-05-15#Artikel9
  - number: 9.e
    text: het onderhouden en in stand houden van onroerende zaken;
    url: https://wetten.overheid.nl/BWBR0040475/2024-05-15#Artikel9
  - number: 9.f
    text: |-
      het vervreemden, belasten met beperkt zakelijke rechten, verpachten, verhuren en op andere wijze in gebruik geven
      aan derden van onroerende zaken;
    url: https://wetten.overheid.nl/BWBR0040475/2024-05-15#Artikel9
  - number: 9.g
    text: het aangaan van vaststellingsovereenkomsten en grensregelingen en afkopen van grondrenten;
    url: https://wetten.overheid.nl/BWBR0040475/2024-05-15#Artikel9
  - number: 9.h
    text: het behandelen en betalen van zakelijke lasten;
    url: https://wetten.overheid.nl/BWBR0040475/2024-05-15#Artikel9
  - number: 9.i
    text: het nemen van maatregelen tegen inbreuken op het eigendomsrecht, en
    url: https://wetten.overheid.nl/BWBR0040475/2024-05-15#Artikel9
  - number: 9.j
    text: |-
      het verrichten van alle andere privaatrechtelijke rechtshandelingen die voortvloeien uit de positie van die
      organisaties als eigenaar van onroerende zaken of als beperkt zakelijk gerechtigde,
    url: https://wetten.overheid.nl/BWBR0040475/2024-05-15#Artikel9
  - number: '10'
    text: |-
      Het Rijksvastgoedbedrijf is belast met het op verzoek van een van de andere ministers in eigendom
      verwerven van onroerende zaken of verwerven van appartementsrechten van organisaties als bedoeld in
      [artikel 2, tweede lid][ref1], teneinde deze onroerende zaken of appartementsrechten vervolgens te vervreemden
      aan derden, indien aan de nadere voorwaarden voor deze verwerving en vervreemding, gesteld door de Minister van
      Binnenlandse Zaken en Koninkrijksrelaties, is voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0040475#Artikel2
    url: https://wetten.overheid.nl/BWBR0040475/2024-05-15#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0040475
        artikel: '2'
  - number: '11'
    text: Het Rijksvastgoedbedrijf kan op verzoek van andere ministers taken en bevoegdheden namens hen uitoefenen.
    url: https://wetten.overheid.nl/BWBR0040475/2024-05-15#Artikel11
  - number: '12'
    text: Dit besluit treedt in werking met ingang van 1 januari 2018.
    url: https://wetten.overheid.nl/BWBR0040475/2024-05-15#Artikel12
