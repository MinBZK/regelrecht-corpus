  - number: 2.6.8
    text: |-
      1 Het netto persoonsgebonden budget bedraagt het verschil tussen het bruto persoonsgebonden budget en de eigen
      bijdrage.

      2 Indien de verzekerde langer dan zes weken aaneengesloten per jaar in het buitenland verblijft, en in het
      buitenland zorgverleners contracteert die niet vallen onder de Nederlandse fiscale en sociale zekerheidswetgeving,
      wordt het bruto persoonsgebonden budget berekend overeenkomstig de volgende formule:

      waarbij wordt verstaan onder:

      A: het aantal weken dat de verzekerde in Nederland verblijft;

      B: het getal 52;

      C: het bruto persoonsgebonden budget waarvoor de verzekerde op grond van de vorige leden in aanmerking komt;

      D: het aantal weken dat de verzekerde in het buitenland verblijft;

      E: het voor het desbetreffende land door het College zorgverzekeringen vastgestelde aanvaardbaarheidspercentage.

      3 Indien de verzekerde onmiddellijk voorafgaande aan of aansluitend op de subsidieperiode een netto
      persoonsgebonden budget voor hetzelfde kalenderjaar werd of wordt verleend en dat budget niet volledig werd of
      wordt besteed, wordt het op grond van het eerste en tweede lid berekende netto persoonsgebonden budget verhoogd met
      een bedrag gelijk aan dit niet bestede deel.
    url: https://wetten.overheid.nl/BWBR0019161/2012-01-01#Artikel2.6.8
  - number: 2.6.9
    text: |-
      1 Bij de verlening van het netto persoonsgebonden budget worden de verzekerde de volgende verplichtingen opgelegd:

      a. de verzekerde gebruikt het budget uitsluitend voor betaling van zorg als bedoeld in
      [artikel 1.1.1, j of k][ref1], en de betaling van bemiddelingskosten onder de in onderdeel k opgenomen
      voorwaarden;

      b. de zorg die de verzekerde inkoopt, is kwalitatief verantwoord;

      c. de verzekerde sluit een schriftelijke overeenkomst met de zorgverlener of zorgverlenende instantie waarin ten
      minste de volgende afspraken zijn opgenomen:

      1°. declaraties voor verleende zorg worden niet betaald indien zij niet binnen zes weken na de maand waarin de zorg
      is verleend bij de verzekerde zijn ingediend,

      2°. een declaratie van een zorgverlener bevat een overzicht van de dagen waarop is gewerkt, het uurtarief, het
      aantal te betalen uren, het burgerservicenummer of, bij het ontbreken daarvan, het sociaal-fiscaal nummer en de
      naam van de zorgverlener, en wordt door de zorgverlener ondertekend,

      3°. een declaratie van een zorgverlenende instantie bevat het nummer waarmee die instantie staat ingeschreven bij
      de Kamer van Koophandel, een overzicht van de dagen waarop is gewerkt, het tarief, het aantal te betalen uren,
      dagdelen of etmalen, en de naam en het adres van de zorgverlenende instantie, en wordt namens de zorgverlenende
      instantie ondertekend;

      d. de verzekerde stelt, op verzoek van het zorgkantoor, de in onderdeel c bedoelde overeenkomsten en declaraties
      alsmede zijn rekeningafschrift op papier of op een andere duurzame drager, tot vijf jaar na de datum van de
      subsidievaststelling ter beschikking van het zorgkantoor. De rekeningafschriften bevatten in ieder geval de
      perioden waarop zij betrekking hebben, de datum en het bedrag van de door de verzekerde verrichte betalingen,
      bedoeld in onderdeel a, alsmede de rekeningnummers waarop deze betalingen zijn bijgeschreven;

      e. de verzekerde legt door middel van invulling en ondertekening van een daartoe door het zorgkantoor toegezonden
      formulier verantwoording af over de besteding van het verleende persoonsgebonden budget;

      f. bij de verantwoording over de laatste verantwoordingsperiode van een kalenderjaar voegt de verzekerde per
      zorgverlener of zorgverlenende instantie een formulier waarop hij naam, adres en burgerservicenummer of, bij het
      ontbreken daarvan, het sociaal-fiscaal nummer van de zorgverlener respectievelijk naam, adres en het nummer van
      de Kamer van Koophandel van de zorgverlenende instantie heeft aangetekend, alsmede het in dat kalenderjaar aan die
      zorgverlener of die zorgverlenende instantie betaalde bedrag;

      g. de verzekerde brengt gedurende de subsidieperiode voor de vormen van zorg waarvoor het budget is verleend niet
      tevens een AWBZ-aanspraak op zorg tot gelding;

      h. de verzekerde die geïndiceerd is voor verblijf, brengt gedurende de subsidieperiode zijn aanspraak op verblijf
      niet tot gelding;

      i. de verzekerde draagt er zorg voor dat een zorgverlener op wie het Arbeidstijdenbesluit niet van toepassing is
      niet meer dan veertig uur in één week voor hem werkzaamheden verricht;

      j. de verzekerde verricht uitsluitend girale betalingen aan de zorgverlener;

      k. de verzekerde besteedt het persoonsgebonden budget uitsluitend aan bemiddelingkosten indien aan de verzekerde
      een persoonsgebonden budget is verleend voor een subsidieperiode die eindigde op 31 december 2011 en de organisatie
      waaraan de verzekerde bemiddelingskosten betaalt beschikt over een door het Keurmerkinstituut vastgesteld keurmerk
      voor bemiddelingsbureaus;

      l. de verzekerde als bedoeld in [artikel 2.6.3, eerste lid][ref2], gebruikt de bankrekening waarop het zorgkantoor
      het persoonsgebonden budget uitbetaalt uitsluitend voor betalingen aan zorgverleners;

      m. de verzekerde deelt het zorgkantoor op diens verzoek of onverwijld uit eigen beweging alle feiten en
      omstandigheden mee waarvan hem redelijkerwijs duidelijk moet zijn dat zij van invloed kunnen zijn op de
      verstrekking van het persoonsgebonden budget.

      2 In afwijking van het eerste lid, onderdeel a, mag vervoer slechts worden betaald uit een budget verleend voor
      begeleiding groep inclusief vervoer.

      3 In afwijking van het eerste lid, onderdelen a en e, mag de verzekerde in een kalenderjaar maximaal 1,5% van het
      voor dat jaar beschikbare netto persoonsgebonden budget, maar ten minste € 250 en ten hoogste € 1 250, gebruiken
      voor andere betalingen dan betalingen bedoeld in onderdeel a, en geldt de verantwoordingsplicht, bedoeld in
      onderdeel e, niet voor dit deel van het budget.

      4 Indien een subsidieperiode met ingang van een andere dag dan 1 januari van een kalenderjaar aanvangt of op
      een andere dag dan 31 december eindigt, worden de bedragen, genoemd in het derde lid, voor dat kalenderjaar
      vermenigvuldigd met een breuk waarvan de teller bestaat uit het aantal dagen van de subsidieperiode in het
      desbetreffende kalenderjaar en de noemer uit het aantal dagen in dat kalenderjaar.

      5 Onderdeel f van het eerste lid is niet van toepassing indien de verzekerde verplicht is tot loonheffing.

      6 Voor de toepassing van het eerste lid, onderdeel g, worden begeleiding individueel en begeleiding groep
      aangemerkt als onderscheiden vormen van zorg.

      7 Het College zorgverzekeringen stelt standaardmodellen op voor de formulieren, bedoeld in het eerste lid,
      onderdelen e en f.

      8 De verantwoording, bedoeld in het eerste lid, onderdeel e, wordt aan het zorgkantoor afgelegd binnen zes weken
      na:

      a. afloop van de subsidieperiode, indien het tot een jaarbedrag herleide netto persoonsgebonden budget minder dan
      € 5000 bedraagt;

      b. het einde van de eerste helft van een kalenderjaar, en voorts na afloop van de subsidieperiode, indien het tot
      een jaarbedrag herleide netto persoonsgebonden budget € 5000 of meer bedraagt.

      9 In afwijking van het eerste lid, onderdeel a, mag de verzekerde die is geïndiceerd voor verblijf, het
      persoonsgebonden budget ook gebruiken voor betaling van huishoudelijke hulp.


