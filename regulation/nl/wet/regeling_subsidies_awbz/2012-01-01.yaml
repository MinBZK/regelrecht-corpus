    text: |-
      Onder huisvestingskosten wordt verstaan de kosten van huur, lease, hypothecaire leningen, erfpacht, energie en de
      afschrijving van gebouwen, inventaris, automatiseringsapparatuur en programmatuur, waarbij afschrijvingskosten in
      aanmerking worden genomen tot de volgende maximum percentages van de historische kosten:








                  a. gebouwen


                  2%;




                  b. verbouwingen


                  5%;




                  c. inventaris


                  10%;




                  d. automatiseringsapparatuur en programmatuur


                  20%.
    url: https://wetten.overheid.nl/BWBR0019161/2012-01-01#Artikel2.5.6
  - number: 2.5.6a
    text: |-
      1 De MEE-organisatie kan, ten laste van de subsidie voor collectieve en individuele cliëntondersteuning,
      uitsluitend de volgende voorzieningen vormen voor:

      a. onderhoud huisvesting gebaseerd op een door het bestuur van de MEE-organisatie goedgekeurd onderhoudsplan;

      b. financiering van een spaar/verlofovereenkomst overeenkomstig de CAO Gehandicaptenzorg ten behoeve van de opbouw
      van een doorbetaald langdurig verlof in een toekomstig jaar;

      c. loonkosten als gevolg van ziekte en arbeidsongeschiktheid overeenkomstig de CAO Gehandicaptenzorg waarvoor de
      MEE-organisatie niet verzekerd is;

      d. kosten van arbeidsrechtelijke geschillen, voor zover deze kosten voortvloeien uit een gerechtelijke uitspraak.

      2 Voor zover in de volgende leden niet anders is bepaald, is op deze voorzieningen
      [artikel 374 van boek 2 van het Burgerlijk Wetboek][ref1] van toepassing.

      3 Toevoeging aan de voorziening bedoeld in het eerste lid, onderdeel a, is slechts mogelijk
      voor zover de huisvestingskosten lager zijn dan 12,8% van de voor collectieve en individuele
      cliëntondersteuning verleende subsidie. Het maximum van de voorziening bedraagt 10% van de op grond van de
      [Wet waardering onroerende zaken][ref2] vastgestelde waarde van het pand.

      4 Toevoeging aan de voorziening bedoeld in het eerste lid, onderdeel c, is slechts mogelijk voor zover deze
      voorziening, inclusief de toevoeging, niet meer bedraagt dan 7,56% van de bruto salariskosten in het subsidiejaar.

      5 Kosten waarvoor een voorziening als bedoeld in de voorgaande leden is gevormd, worden ten laste van die
      voorziening gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel374
      [ref2]: https://wetten.overheid.nl/BWBR0007119
    url: https://wetten.overheid.nl/BWBR0019161/2012-01-01#Artikel2.5.6a
