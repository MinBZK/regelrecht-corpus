  - number: 2.6.15
    text: |-
      1 Indien aan de verzekerde op basis van een indicatiebesluit waaruit bleek dat de verzekerde geïndiceerd was voor
      verblijf een persoonsgebonden budget is verleend voor een subsidieperiode die eindigde op 31 december 2010, hoogt
      het zorgkantoor, indien de verzekerde beschikt over een indicatiebesluit waaruit blijkt dat de verzekerde is
      geïndiceerd voor verblijf, het bruto persoonsgebonden budget met een garantiebedrag op tot 102,25% van het bruto
      persoonsgebonden budget dat was verleend voor de subsidieperiode die eindigde op 31 december 2011.

      2 Voor de berekening van het in het voorgaande lid bedoelde garantiebedrag gaat het zorgkantoor er vanuit dat de
      verzekerde zowel voor de subsidieperiode die eindigde op 31 december 2010 als voor de subsidieperiode waarop de
      aanvraag betrekking heeft voor alle vormen van zorg als bedoeld in [artikel 1.1.1, onderdeel j of k][ref1] een
      persoonsgebonden budget is dan wel wordt verleend.

      3 Dit artikel is niet van toepassing indien het persoonsgebonden budget dat was verleend voor de
      subsidieperiode die eindigde op 31 december 2010 gebaseerd was op een indicatiebesluit waaruit
      bleek dat de verzekerde was geïndiceerd voor een zorgzwaartepakket VV 9 of VV 10 zoals bedoeld in
      [bijlage 2 van de Regeling zorgaanspraken AWBZ][ref2] en de aanvraag niet is gebaseerd op een indicatiebesluit
      waaruit blijkt dat de verzekerde voor een van deze zorgzwaartepakketten is geïndiceerd.

      4 Dit artikel is alleen van toepassing indien de subsidieperiode waarvoor een persoonsgebonden budget wordt
      aangevraagd:

      a. met een onderbreking van niet meer dan zeven kalenderdagen, aansluit op een eerdere subsidieperiode, of:

      b. aansluit op een periode waarin de verzekerde verbleef in een instelling als bedoeld in de [AWBZ][ref3] of
      [Zorgverzekeringswet][ref4] en dit verblijf aansloot op een eerdere subsidieperiode.


      [ref1]: https://wetten.overheid.nl/BWBR0019161#Artikel1.1.1
      [ref2]: https://wetten.overheid.nl/BWBR0014855
      [ref3]: https://wetten.overheid.nl/BWBR0002614
      [ref4]: https://wetten.overheid.nl/BWBR0018450
