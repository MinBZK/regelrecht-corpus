  - number: 2.5.6b
    text: |-
      1 In afwijking van [artikel 1.8.7, achtste lid][ref1], kan toevoeging aan de in artikel 1.8.7, eerste lid, bedoelde
      reservering niet plaatsvinden als de in artikel 1.8.7, eerste lid, bedoelde reservering reeds 8,7% of meer van de
      voor dat jaar verleende subsidie voor individuele en collectieve cliëntondersteuning betreft.

      2 [Artikel 1.8.7][ref2] is niet van toepassing op de subsidie voor de coördinatie van projecten integrale
      vroeghulp.


