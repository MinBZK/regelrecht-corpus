  - number: 2.5.7
    text: |-
      1 De aanvraag voor de subsidievaststelling gaat vergezeld van een overzicht van de aan de activiteiten, genoemd in
      [artikel 2.5.3, eerste lid][ref1], en de diensten, genoemd in [artikel 2.5.4, eerste lid][ref2], bestede tijd.

      2 De aanvraag tot subsidievaststelling wordt pas in behandeling genomen als het door het College zorgverzekeringen
      voor de betrokken MEE-organisatie aangewezen zorgkantoor schriftelijk met de aanvraag heeft ingestemd.

      3 Het College zorgverzekeringen kan bij de subsidievaststelling van enig jaar overheveling van onbenutte subsidie
      tussen MEE-organisaties toepassen. Deze overheveling is slechts mogelijk als de gezamenlijke waarde van de in
      het subsidiejaar gerealiseerde diensten, als bedoeld in [artikel 2.5.4, eerste lid][ref3], hoger is dan de voor
      individuele cliëntondersteuning verleende subsidie en kan slechts leiden tot een verhoging van maximaal 12,5% van
      de voor individuele cliëntondersteuning verleende subsidie.

      4 Indien er meer MEE-organisaties zijn met een overschrijding van de verleende subsidie en er onvoldoende onbenutte
      subsidiegelden binnen het subsidieplafond zijn, worden deze

      overschrijdingen naar rato toegekend overeenkomstig de volgende formule:

      waarbij wordt verstaan:

      A: de overschrijding per MEE-organisatie tot maximaal 12,5% van de verleende subsidie voor de individuele
      cliëntondersteuning;

      B: de overschrijding van alle MEE-organisaties samen met inachtneming van de maximering tot 12,5% van de verleende
      subsidie voor de individuele cliëntondersteuning;

      C: de onbenutte subsidiegelden binnen het subsidieplafond.


      [ref1]: https://wetten.overheid.nl/BWBR0019161#Artikel2.5.3
      [ref2]: https://wetten.overheid.nl/BWBR0019161#Artikel2.5.4
