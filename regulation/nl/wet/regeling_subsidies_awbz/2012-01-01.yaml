  - number: 2.7.2
    text: |-
      1 Een zorgkantoor verleent een verzekerde een vergoeding persoonlijke zorg voor zover:

      a. de verzekerde beschikt over een indicatiebesluit waaruit blijkt dat hij is aangewezen op één of meer van de
      vormen van zorg als bedoeld in [artikel 1.1.1, onderdeel j][ref1], en hij niet is aangewezen op verblijf;

      b. de verzekerde, door gebruikmaking van een door het zorgkantoor vastgesteld aanvraagformulier een vergoeding
      persoonlijke zorg heeft aangevraagd;

      c. de verzekerde:

      1°. blijkens het indicatiebesluit is aangewezen op tien of meer uren per week zorg als bedoeld in onderdeel a, of

      2°. aanspraak heeft op ADL-assistentie op grond van [artikel 34 van het Besluit zorgaanspraken AWBZ][ref2], en

      d. de verzekerde, blijkens het aanvraagformulier, voornemens is de geïndiceerde zorg voor tien of meer uren niet
      met het door het zorgkantoor gecontracteerde zorgaanbod tot gelding te brengen.

      2 Aan het vereiste van het eerste lid, onderdeel c, onder 1°, is tevens voldaan indien leden van een leefeenheid
      tezamen aanspraak hebben op tien of meer uren per week aan zorg als bedoeld in het eerste lid, onderdeel a.

      3 Het aantal geïndiceerde uren als bedoeld in het eerste lid, onderdeel c, onder 1°, en onderdeel
      d, wordt berekend door optelling van de gemiddelden van de geïndiceerde klassen, als genoemd in de
      [Beleidsregels indicatiestelling AWBZ 2012][ref3], waarbij voor begeleiding een dagdeel geldt als een uur.

      4 Het gemiddelde, bedoeld in het derde lid, wordt bepaald door op een decimaal achter de komma naar boven af te
      ronden.

      5 Het eerste lid, onderdeel d, is niet van toepassing op de verzekerde als bedoeld in het eerste lid, onderdeel c,
      onder 2°.


      [ref1]: https://wetten.overheid.nl/BWBR0019161#Artikel1.1.1
      [ref2]: https://wetten.overheid.nl/BWBR0014149#Artikel34
      [ref3]: https://wetten.overheid.nl/BWBR0030849
