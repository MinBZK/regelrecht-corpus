  - number: 2.6.2
    text: |-
      1 Het College zorgverzekeringen verleent aan zorgkantoren op aanvraag een subsidie die bestemd is voor het met
      inachtneming van de [artikelen 2.6.4 tot en met 2.6.15][ref1] verstrekken van netto persoonsgebonden budgetten.

      2 Het subsidieplafond voor de in het eerste lid bedoelde activiteiten bedraagt: voor het jaar 2012 € 2 689 000 000.

      3 Voor verleende persoonsgebonden budgetten als bedoeld in het eerste lid wordt voor het jaar 2012 een maximale
      subsidie in aanmerking genomen, die wordt berekend overeenkomstig de volgende formule:

      waarbij wordt verstaan onder:

      A: het bedrag dat het zorgkantoor op 31 augustus van het jaar voorafgaand aan het subsidiejaar aan subsidies heeft
      verstrekt;

      B: het bedrag dat het zorgkantoor op 31 augustus van het jaar voorafgaand aan het subsidiejaar heeft gereserveerd
      ten behoeve van de nog voor dat subsidiejaar te verlenen subsidies aan verzekerden aan wie op 31 augustus subsidie
      is verleend en waarvan de subsidieperiode vóór of op 31 december van het jaar voorafgaand aan het subsidiejaar
      eindigt.

      C: de som van de tellers voor alle zorgkantoren tezamen.

      4 voor het jaar 2012 wordt € 75 000 000 verdeeld met inachtneming van door het College zorgverzekeringen vast te
      stellen beleidsregels.

      5 Het zorgkantoor verleent slechts subsidie voor persoonsgebonden budgetten voor verzekerden woonachtig in zijn
      regio.

      6 [Artikel 1.1.3, eerste lid, onderdelen b en c][ref2], zijn niet van toepassing.

      7 Voor de toepassing van [hoofdstuk I][ref3] wordt de in het eerste lid bedoelde subsidie beschouwd
      als een projectsubsidie, met dien verstande dat de aanvraag van de subsidie in afwijking van
      [artikel 1.6.1, tweede lid][ref4], niet vergezeld gaat van een projectplan.


      [ref1]: https://wetten.overheid.nl/BWBR0019161#Artikel2.6.4
