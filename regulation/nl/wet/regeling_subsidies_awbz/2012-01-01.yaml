  - number: 2.6.5
    text: |-
      Het netto persoonsgebonden budget wordt verleend voor een subsidieperiode die:

      a. niet eerder aanvangt dan de dag met ingang waarvan de verzekerde volgens zijn indicatiebesluit op de zorg is
      aangewezen waarvoor het budget wordt verleend, en

      b. eindigt met ingang van de dag waarop het indicatiebesluit zijn geldigheidsduur verliest, doch uiterlijk op
      31 december 2012.
    url: https://wetten.overheid.nl/BWBR0019161/2012-01-01#Artikel2.6.5
  - number: 2.6.6
    text: |-
