  - number: 2.6.12
    text: |-
      1 Het zorgkantoor wijzigt de verleningsbeschikking of trekt deze in:

      a. met ingang van de dag gelegen na de dag waarop de verzekerde overlijdt;

      b. met ingang van de dag waarop de verzekerde langer dan twee maanden verblijft in een instelling als bedoeld in de
      [AWBZ][ref1] of de [Zorgverzekeringswet][ref2];

      c. met ingang van de dag vanaf welke de verzekerde schriftelijk heeft aangegeven geen prijs meer te stellen op
      het budget;

      d. met ingang van de dag waarop de verzekerde op grond van een wettelijk voorschrift, anders dan de AWBZ, recht
      heeft op de geïndiceerde zorg, of op een gehele of gedeeltelijke vergoeding van de kosten daarvan;

      e. met ingang van de dag waarop het zorgkantoor, op advies van een instelling voor maatschappelijk werk of de
      Raad voor de kinderbescherming, van oordeel is dat een ten behoeve van een minderjarige verzekerde aangevraagd
      budget in zodanige mate niet voor de inkoop van zorg ten behoeve van die verzekerde zal worden gebruikt, dat dit
      mishandeling, verwaarlozing of ernstige schade voor de opvoeding of ontwikkeling van die verzekerde tot gevolg
      zal hebben.

      2 De verleningsbeschikking kan worden ingetrokken of gewijzigd:

      a. met ingang van de dag waarop de verzekerde de bij of krachtens [artikel 2.6.9][ref3] opgelegde overige
      verplichtingen niet nakomt;

      b. met ingang van de dag waarop de verzekerde, of, indien de verzekerde jonger is dan achttien jaar, één van diens
      ouders of voogden, surseance van betaling heeft aangevraagd of failliet is verklaard;

      c. met ingang van de dag waarop ten aanzien van de verzekerde of, indien de verzekerde jonger is dan achttien jaar,
      ten aanzien van één van diens ouders of voogden, de schuldsaneringsregeling natuurlijke personen van toepassing is
      verklaard, dan wel een verzoek daartoe bij de rechtbank is ingediend;

      d. met ingang van de dag waarop de verzekerde blijkens de gemeentelijke basisadministratie niet beschikt over een
      woonadres.


      [ref1]: https://wetten.overheid.nl/BWBR0002614
      [ref2]: https://wetten.overheid.nl/BWBR0018450
      [ref3]: https://wetten.overheid.nl/BWBR0019161#Artikel2.6.9
