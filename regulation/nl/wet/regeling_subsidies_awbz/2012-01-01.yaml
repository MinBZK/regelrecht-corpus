    text: |-
      1 De MEE-organisatie verricht de activiteiten, bedoeld in [artikel 2.5.1][ref1], in samenwerking met de gemeenten
      in haar werkgebied.

      2 De MEE-organisatie doet uiterlijk drie maanden na afloop van het subsidiejaar verslag aan het College
      zorgverzekeringen volgens een door het College zorgverzekeringen voorgeschreven formulier.


