  - number: 2.6.10
    text: |-
      1 Het zorgkantoor bevoorschot de verzekerde het verleende netto persoonsgebonden budget:

      a. per jaar, indien het tot een jaarbedrag herleide budget € 2500 of minder bedraagt;

      b. per half jaar, indien het tot een jaarbedrag herleide budget € 5000 of minder, maar meer dan € 2500 bedraagt;

      c. per kwartaal, indien het tot een jaarbedrag herleide budget € 25.000 of minder, maar meer dan € 5000 bedraagt;

      d. per maand, indien het tot een jaarbedrag herleide budget meer dan € 25.000 bedraagt.

      2 Indien een subsidieperiode met ingang van een andere dag dan 1 januari van een kalenderjaar aanvangt of op een
      andere dag dan 31 december eindigt, wordt voor de toepassing van het eerste lid het voor dat jaar beschikbare
      budget tot een jaarbedrag herleid door het desbetreffende budget te vermenigvuldigen met een breuk waarvan de
      teller gelijk is aan het aantal dagen in het kalenderjaar en de noemer gelijk is aan het aantal dagen van de
      subsidieperiode in het kalenderjaar.

      3 Het zorgkantoor betaalt het voorschot uit op de bankrekening van de verzekerde.

      4 In afwijking van het derde lid betaalt het zorgkantoor het voorschot van de minderjarige verzekerde uit op de
      bankrekening van diens ouders of voogd, tenzij de ouder of voogd verzoekt om uitbetaling op de bankrekening van
      de minderjarige.

      5 In afwijking van het derde lid betaalt het zorgkantoor het voorschot van de verzekerde die onder curatele staat
      als bedoeld in [artikel 1:378 en volgende van het Burgerlijk Wetboek][ref1] of onder bewindvoering staat als
      bedoeld in [artikel 1:431 en volgende van die wet][ref2] uit op de door de curator of bewindvoerder ten name van de
      verzekerde geopende bankrekening.

      6 In afwijking van het derde lid betaalt het zorgkantoor, indien het zorgkantoor op grond van
      [artikel 2.6.4, vierde lid][ref3], het persoonsgebonden budget heeft verleend aan een organisatie die is belast
      met de ondertoezichtstelling op de verzekerde, het voorschot uit op de bankrekening van die organisatie.

      7 In afwijking van het derde lid betaalt het zorgkantoor, indien het zorgkantoor op grond
      van [artikel 2.6.4, vierde lid][ref4], het persoonsgebonden budget heeft verleend aan een
      organisatie die een reclasseringsmaatregel uitoefent krachtens een uitspraak van de rechter of
      het Openbaar Ministerie op grond van [artikel 14d][ref5], [artikel 15b, tweede lid][ref6], of
      [Boek I, Titel VIII A Bijzondere bepalingen voor jeugdige personen van het Wetboek van Strafrecht][ref7], het
      voorschot uit op de bankrekening van die organisatie.

      8 In afwijking van het derde lid betaalt het zorgkantoor het voorschot op verzoek van de verzekerde die verblijft
      in een klooster, uit op de bankrekening van dat klooster, indien de verzekerde op grond van kerkrechtelijke
      voorschriften niet over een eigen bankrekening mag beschikken.


