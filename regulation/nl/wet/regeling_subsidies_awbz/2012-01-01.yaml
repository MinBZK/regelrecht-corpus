articles:
  - number: 1.1.1
    text: |-
      In deze regeling wordt verstaan onder:

      a. instelling: een privaatrechtelijke rechtspersoon met volledige rechtsbevoegdheid, dan wel een rechtspersoon
      krachtens publiekrecht ingesteld;

      b. project: een activiteit met een incidenteel karakter;

      c. instellingssubsidie: een subsidie aan een instelling in de kosten van haar structurele activiteiten of een
      gedeelte daarvan;

      d. projectsubsidie: een subsidie in de kosten van een project;

      e. ondersteuningssubsidie: een instellingssubsidie van ten hoogste € 11.344,51 in een gering deel van de totale
      kosten van het algemeen functioneren van een instelling;

      f. algemeen fonds: het fonds, genoemd in [artikel 89 van de Wet financiering sociale verzekeringen][ref1];

      g. zorgkantoor: een verbindingskantoor als bedoeld in
      [artikel 1, onder c, van het Administratiebesluit Bijzondere Ziektekostenverzekering][ref2];

      h. regio: het werkgebied waarvoor het zorgkantoor als verbindingskantoor ingevolge het
      [Administratiebesluit Bijzondere Ziektekostenverzekering][ref3] door de Minister van Volksgezondheid, Welzijn en
      Sport is aangewezen;

      i. AWBZ: [Algemene Wet Bijzondere Ziektekosten][ref4];

      j. persoonlijke verzorging, verpleging, begeleiding en vervoer: hetgeen daaronder wordt verstaan in het
      [Besluit zorgaanspraken AWBZ][ref5];

      k. kortdurend verblijf: hetgeen daaronder wordt verstaan in het [Besluit zorgaanspraken AWBZ][ref6], gedurende niet
      meer dan twee etmalen per week, met dien verstande dat de desbetreffende zorg niet door een instelling hoeft te
      worden verleend;

      l. verblijf: hetgeen daaronder wordt verstaan in het [Besluit zorgaanspraken AWBZ][ref7];

      m. indicatiebesluit: een beschikking als bedoeld in
      [artikel 1, aanhef en onder d, van het Zorgindicatiebesluit][ref8];

      n. Keurmerkinstituut: het te Zoetermeer gevestigde Keurmerkinstituut B.V.;

      o. leefeenheid: een eenheid bestaande uit gehuwde verzekerden die al dan niet tezamen met een of meer ongehuwde
      minderjarige verzekerden duurzaam een huishouden voeren dan wel uit een meerderjarige ongehuwde verzekerde die met
      een of meer ongehuwde minderjarige verzekerden duurzaam een huishouden voert;

      p. persoongebonden budget: een subsidie waarmee de verzekerde onder de in [paragraaf 2.6][ref9] genoemde
      voorwaarden aan hem te verlenen zorg als bedoeld in onderdelen j en k kan inkopen;

      q. vergoeding persoonlijke zorg: een subsidie waarmee de verzekerde onder de in [paragraaf 2.7][ref10] genoemde
      voorwaarden aan hem te verlenen zorg als bedoeld in onderdelen j en k kan inkopen;

      r. bestedingsplan: een overzicht van de door de verzekerde voorgenomen besteding van het te verlenen
      persoonsgebonden budget of de te verlenen vergoeding voor persoonlijke zorg.


