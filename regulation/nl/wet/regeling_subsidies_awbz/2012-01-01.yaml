      1 De MEE-organisatie registreert op zorgvuldige wijze alle gegevens die naar het oordeel van het College
      zorgverzekeringen noodzakelijk zijn voor het verkrijgen van een goed inzicht in de gesubsidieerde taken.
      Bij de registratie wordt rekening gehouden met de bescherming van de persoonlijke levenssfeer en het medisch
      beroepsgeheim.

      2 De MEE-organisatie bewaart de in het eerste lid bedoelde gegevens gedurende minimaal vijf jaren.
