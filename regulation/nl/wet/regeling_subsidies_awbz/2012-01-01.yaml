        hoofdstuk: I
        paragraaf: '1.2'
  - number: 2.11.5
    text: |-
      1 De subsidieontvanger overlegt bij zijn aanvraag tot subsidievaststelling een overzicht van alle
      zwangerschapsafbrekingen, overtijdbehandelingen en consulten waarop geen zwangerschapsonderbreking of
      overtijdbehandeling volgt.

      2 Het overzicht is voorzien van een toelichting op het verschil met het aantal verrichtte behandelingen waarvoor de
      subsidievaststelling wordt aangevraagd.
    url: https://wetten.overheid.nl/BWBR0019161/2012-01-01#Artikel2.11.5
  - number: 2.11.7
    text: |-
      [Artikel 1.8.7][ref1] is niet van toepassing.


