  - number: 2.6.13
    text: |-
      1 Bij de verantwoording over de eerste helft van het kalenderjaar als bedoeld in
      [artikel 2.6.9, achtste lid, onderdeel b][ref1], besluit het zorgkantoor binnen zes weken na ontvangst van de
      desbetreffende verantwoording of het voorschot is gebruikt voor betalingen als bedoeld in het eerste lid, onderdeel
      a, van laatstgenoemd artikel. Het zorgkantoor kan in dat besluit het voorbehoud maken dat het opvragen van de in
      artikel 2.6.9, eerste lid, onderdeel d, bedoelde documenten tot een ander oordeel kan leiden.

      2 Na afloop van iedere subsidieperiode wordt de subsidie voor de desbetreffende subsidieperiode vastgesteld.

      3 Een bij het zorgkantoor ingediend verantwoordingsformulier over de laatste verantwoordingsperiode zoals bedoeld
      in [artikel 2.6.9, achtste lid][ref2], dient als aanvraag tot subsidievaststelling.

      4 Het zorgkantoor stelt het netto persoonsgebonden budget binnen zes weken na de aanvraag tot subsidievaststelling
      vast.

      5 Het persoonsgebonden budget wordt vastgesteld op de som van:

      a. 1,5% van het voor het kalenderjaar beschikbare netto persoonsgebonden budget, maar ten minste op € 250 en ten
      hoogste op € 1250, en

      b. het restant van het voor het kalenderjaar beschikbare netto persoonsgebonden budget:

      1°. voor zover er betalingen mee zijn verricht als bedoeld in [artikel 2.6.9, eerste lid, onderdeel a][ref3],

      2°. voor zover deze betalingen betrekking hebben op kosten die niet hoger zijn dan € 63 per uur, € 58 per dagdeel,
      of, voor zover het bemiddelingskosten betreft, € 250 per jaar indien het verleende bruto persoonsgebonden budget
      op jaarbasis € 25 000 of minder bedraagt en € 500 per jaar indien het verleende bruto persoonsgebonden budget op
      jaarbasis meer dan € 25 000 bedraagt, en

      3°. voor zover het aantal door de zorgverlener voor de verzekerde gewerkte uren niet afwijkt van het
      [Arbeidstijdenbesluit][ref4] dan wel [artikel 2.6.9, eerste lid, onderdeel i][ref5].

      6 In afwijking van het vijfde lid, onderdeel b, subonderdeel 2°, is voor zorg waarvoor de Nederlandse
      Zorgautoriteit op grond van de [Wet marktordening gezondheidszorg][ref6] een hoger tarief heeft vastgesteld dan
      € 63 per uur of € 58 per dagdeel dat hogere tarief van toepassing.

      7 Indien de verzekerde geen betalingen heeft gedaan als bedoeld in [artikel 2.6.9, eerste lid, onderdeel a][ref7],
      dan wordt de subsidie, in afwijking van het vijfde lid, vastgesteld op nihil.

      8 Indien een subsidieperiode met ingang van een andere dag dan 1 januari van een kalenderjaar aanvangt of op
      een andere dag dan 31 december eindigt, worden de bedragen, genoemd in het vijfde lid, voor dat kalenderjaar
      vermenigvuldigd met een breuk waarvan de teller bestaat uit het aantal dagen van de subsidieperiode in het
      desbetrefende kalenderjaar en de noemer uit het aantal dagen in dat kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0019161#Artikel2.6.9
      [ref2]: https://wetten.overheid.nl/BWBR0019161#Artikel2.6.9
