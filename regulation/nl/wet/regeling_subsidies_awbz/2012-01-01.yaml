  - number: 2.6.4
    text: |-
      1 Het zorgkantoor weigert verlening van een netto persoonsgebonden budget indien:

      a. de verzekerde geen volledig ingevuld bestedingsplan heeft overlegd volgens het door het College
      zorgverzekeringen vastgestelde model;

      b. de verzekerde het door het zorgkantoor vastgestelde aanvraagformulier niet volledig en juist heeft ingevuld:

      c. de verzekerde op de dag waarop de subsidieperiode zou aanvangen, anders dan terzake van kortdurend verblijf, in
      een instelling als bedoeld in de [AWBZ][ref1] of de [Zorgverzekeringswet][ref2] zal verblijven;

      d. de verzekerde op grond van een wettelijk voorschrift, anders dan de [AWBZ][ref3], recht heeft op de geïndiceerde
      zorg, of op een gehele of gedeeltelijke vergoeding van de kosten daarvan;

      e. het zorgkantoor, op advies van een instelling voor maatschappelijk werk of de Raad voor de kinderbescherming,
      van oordeel is dat een ten behoeve van een minderjarige verzekerde aangevraagd budget in zodanige mate niet voor de
      inkoop van zorg ten behoeve van die verzekerde zal worden gebruikt, dat dit mishandeling, verwaarlozing of ernstige
      schade voor de opvoeding of ontwikkeling van die verzekerde tot gevolg zal hebben;

      f. binnen de maximale subsidie als bedoeld in [artikel 2.6.2, derde lid][ref4], rekening houdend met een
      reservering ten behoeve van de uitvoering van het vijfde lid, geen ruimte voor verlening van een persoonsgebonden
      budget aanwezig is;

      g. de verzekerde, of, indien de verzekerde jonger is dan 18 jaar, één van diens ouders of voogden, surseance van
      betaling heeft aangevraagd of failliet is; verklaard;

      h. ten aanzien van de verzekerde of, indien de verzekerde jonger is dan 18 jaar, ten aanzien van één van diens
      ouders of voogden, de schuldsaneringsregeling natuurlijke personen van toepassing is verklaard, dan wel een verzoek
      daartoe bij de rechtbank is ingediend;

      i. de verzekerde blijkens de gemeentelijke basisadministratie niet beschikt over een woonadres;

      j. de verzekerde is geïndiceerd voor een zorgzwaartepakket 4 LVG, 5 LVG, 1 SGLVG, 1B GGZ, 2B GGZ, 3B GGZ, 4B GGZ,
      5B GGZ, 6B GGZ of 7B GGZ als bedoeld in [bijlage 2 van de Regeling zorgaanspraken AWBZ][ref5];

      k. de verzekerde het zorgkantoor geen toestemming geeft om zijn persoonsgegevens door te geven aan het CAK ten
      behoeve van de vaststelling van de op het bruto persoonsgebonden budget in mindering te brengen eigen bijdrage;

      l. indien de verzekerde zich niet heeft gehouden aan bij de verstrekking van een eerder persoonsgebonden budget
      opgelegde verplichtingen.

      2 Het eerste lid, onderdeel a, is niet van toepassing op een verzekerde als bedoeld in
      [artikel 2.6.3, tweede lid][ref6].

      3 Het eerste lid, onderdelen a, b en f, zijn niet van toepassing indien de subsidieperiode waarvoor een
      persoonsgebonden budget wordt aangevraagd:

      a. met een onderbreking van niet meer dan zeven kalenderdagen, aansluit op een eerdere subsidieperiode, of

      b. aansluit op een periode waarin de verzekerde verbleef in een instelling als bedoeld in de [AWBZ][ref7] of de
      [Zorgverzekeringswet][ref8] en dit verblijf aansloot op een eerdere subsidieperiode.

      4 In afwijking van het eerste lid, onderdeel c, kan het zorgkantoor een persoonsgebonden budget verlenen voor
      begeleiding groep indien de verzekerde verblijft in een instelling waar de dagbesteding geen onderdeel vormt van
      het door het zorgkantoor gecontracteerde verblijf.

      5 Bij de uitvoering van het eerste lid, onderdeel f, gaat het zorgkantoor uit van de ontvangstdatum van het in
      [artikel 2.6.3, derde lid][ref9], bedoelde aanvraagformulier of indien het aanvraagformulier is ontvangen voor de
      datum van het indicatiebesluit, de datum van het indicatiebesluit.

      6 Het eerste lid, onderdeel j, is niet van toepassing indien de subsidieperiode waarvoor een persoonsgebonden
      budget wordt aangevraagd:

      a. met een onderbreking van niet meer dan zeven kalenderdagen, aansluit op een eerdere subsidieperiode, of

      b. aansluit op een periode waarin de verzekerde verbleef in een instelling zoals bedoeld in de [AWBZ][ref10] of de
      [Zorgverzekeringswet][ref11] en dit verblijf aansloot op een eerdere subsidieperiode, en

      c. de verzekerde tijdens de voorgaande subsidieperiode was geïndiceerd voor een zorgzwaartepakket
      4 LVG, 5 LVG, 1 SGLVG, 1B GGZ, 2B GGZ, 3B GGZ, 4B GGZ, 5B GGZ, 6B GGZ of 7B GGZ als bedoeld in
      [bijlage 2 van de Regeling zorgaanspraken AWBZ][ref12].


