  - number: 2.11.10
    text: |-
      Het College zorgverzekeringen is bevoegd alle informatie met betrekking tot de subsidiëring ter beschikking te
      stellen aan de Nederlandse Zorgautoriteit.
    url: https://wetten.overheid.nl/BWBR0019161/2012-01-01#Artikel2.11.10
  - number: 2.11.12
    text: |-
      Zonder voorafgaande schriftelijke toestemming van het College zorgverzekeringen vindt geen wijziging plaats in de
      aard, omvang en plaats van de huisvesting van de abortuskliniek.
    url: https://wetten.overheid.nl/BWBR0019161/2012-01-01#Artikel2.11.12
  - number: 2.11.13
    text: |-
      1 Op een aanvraag voor nieuwbouw of verbouw van een abortuskliniek zijn de beleidsregels ‘Bouwvoorschriften College
      zorgverzekeringen abortusklinieken’ van toepassing.

      2 De subsidieontvanger dient bij het College zorgverzekeringen de volledige aanvraag in uiterlijk 26 weken vóór
      aanvang van de voorziene nieuwbouw of verbouw, waarop het College zorgverzekeringen een beslissing neemt.

      3 De aanvraag moet vergezeld gaan van een bouwplan, een onderbouwing van de bouwwerkzaamheden, bouwtekeningen
      van de bestaande en nieuwe situatie, een open begroting van het investeringsbedrag, een opgave van niet
      bouwgerelateerde kosten en een financieringsvoorstel dat binnen de exploitatie past van de abortuskliniek.
    url: https://wetten.overheid.nl/BWBR0019161/2012-01-01#Artikel2.11.13
  - number: 3.1.1
    text: |-
      Deze regeling is niet van toepassing op subsidies en uitkeringen die voor de inwerkingtreding van deze regeling
      zijn verleend of vastgesteld.
    url: https://wetten.overheid.nl/BWBR0019161/2012-01-01#Artikel3.1.1
  - number: 3.1.2
    text: Deze regeling treedt in werking met ingang van 1 januari 2006.
    url: https://wetten.overheid.nl/BWBR0019161/2012-01-01#Artikel3.1.2
  - number: 3.1.3
    text: 'Deze regeling wordt aangehaald als: Regeling subsidies AWBZ.'
    url: https://wetten.overheid.nl/BWBR0019161/2012-01-01#Artikel3.1.3
