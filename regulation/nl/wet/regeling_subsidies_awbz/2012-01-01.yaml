  - number: 2.6.3
    text: |-
      1 Het zorgkantoor verleent een verzekerde een persoonsgebonden budget indien de verzekerde beschikt over een
      indicatiebesluit waaruit blijkt dat hij is aangewezen op verblijf.

      2 Onverminderd het eerste lid verleent het zorgkantoor een verzekerde een persoonsgebonden budget indien:

      a. de verzekerde is aangewezen op een of meer van de vormen van zorg als bedoeld in
      [artikel 1.1.1, onderdelen j of k][ref1], en de subsidieperiode waarvoor een persoonsgebonden budget wordt
      aangevraagd:

      1°. met een onderbreking van niet meer dan zeven kalenderdagen, aansluit op een eerdere subsidieperiode, of

      2°. aansluit op een periode waarin de verzekerde verbleef in een instelling zoals bedoeld in de [AWBZ][ref2] of de
      [Zorgverzekeringswet][ref3] en dit verblijf aansloot op een eerdere subsidieperiode.

      b. de verzekerde:

      1°. voor 1 januari 2012 een indicatiebesluit heeft aangevraagd,

      2°. het indicatiebesluit na 1 januari 2012 is vastgesteld, en

      3°. de aanvraag voor een persoonsgebonden budget is ingediend binnen twee weken na de vaststelling van het
      indicatiebesluit;

      3 Het zorgkantoor verleent een verzekerde, die blijkens het eerste of tweede lid in aanmerking komt voor een
      persoonsgebonden budget, alleen een persoonsgebonden budget indien de verzekerde gebruik heeft gemaakt van een door
      het zorgkantoor vastgesteld aanvraagformulier.

      4 Het zorgkantoor verleent een verzekerde als bedoeld in het eerste lid alleen een persoonsgebonden budget indien
      de verzekerde beschikt over een bankrekening die uitsluitend is bestemd voor betalingen vanuit het persoonsgebonden
      budget.

      5 Op verzoek van de verzekerde die de leeftijd van 21 jaar nog niet heeft bereikt of diens wettelijk
      vertegenwoordiger, wordt een persoonsgebonden budget verleend aan een organisatie die belast is met de
      ondertoezichtstelling op de verzekerde of die een reclasseringsmaatregel uitoefent krachtens een uitspraak van
      de rechter of het Openbaar Ministerie op grond van [artikel 14d][ref4], [artikel 15b, tweede lid][ref5], of
      [Boek I, Titel VIII A Bijzondere bepalingen voor jeugdige personen van het Wetboek van Strafrecht][ref6].

      6 Het derde lid is niet van toepassing op de verzekerde als bedoeld in het tweede lid, onderdeel a.

      7 Het vierde lid en [artikel 2.6.9, zevende lid, onderdeel l][ref7], zijn niet van toepassing indien het
      persoonsgebonden budget wordt beheerd door een voogdij-instelling, door een organisatie die beschikt over een
      door het Keurmerkinstituut vastgesteld keurmerk voor bemiddelingsbureaus of door een organisatie als bedoeld in
      [artikel 2.6.10, vijfde tot en met achtste lid][ref8].

      8 Indien het indicatiebesluit ten nadele van de verzekerde wordt herzien als gevolg van bezwaar of beroep dan wordt
      het persoonsgebonden budget verlaagd met ingang van de dag waarop het besluit tot herziening wordt genomen.


