      f. kortdurend verblijf:

      € 101 per etmaal.

      2 Indien het bruto persoonsgebonden budget voor meer vormen van zorg wordt verleend, bedraagt het bruto
      persoonsgebonden budget maximaal de som van de met behulp van het eerste lid bepaalde bedragen.

      3 Indien de verzekerde beschikt over een indicatiebesluit waaruit blijkt dat hij is aangewezen op verblijf wordt
      het persoonsgebonden budget berekend door het zorgzwaartepakket met toepassing van de [bijlage 2][ref1] van
      deze regeling om te rekenen naar een of meer klassen, bedoeld in het eerste lid. Het zorgkantoor hoogt het bruto
      persoonsgebonden budget vervolgens op met € 10 562. Het zorgkantoor verhoogt het aldus opgehoogde persoonsgebonden
      budget vervolgens op met 5%.

      4 Indien de verzekerde is geïndiceerd voor een zorgzwaartepakket 5 VG, 7 VG, 8 VG, 5 LG, 7 LG, 3 ZG aud, 5 ZG aud
      of indien de verzekerde invasieve beademing ontvangt dan kan het College zorgverzekeringen aan het zorgkantoor, op
      verzoek van het zorgkantoor, toestemming geven om, in het voordeel van de verzekerde, af te wijken van het derde
      lid.

      5 Indien een subsidieperiode met ingang van een andere dag dan 1 januari van een kalenderjaar aanvangt of op een
      andere dag dan 31 december eindigt, wordt het maximum bruto persoonsgebonden budget vermenigvuldigd met een breuk
      waarvan de teller bestaat uit het aantal dagen van de subsidieperiode in het desbetreffende kalenderjaar en de
      noemer uit het aantal dagen in dat kalenderjaar.

      6 Indien toepassing van de voorgaande leden leidt tot een verlening van een bruto persoonsgebonden budget van meer
      dan € 300 per dag, beperkt het zorgkantoor de maximum verlening tot de kosten van verblijf, onder aftrek van de
      woonlasten, met een minimum van € 300 per dag.

      7 Indien het verleende bruto persoonsgebonden budget € 300 per dag of meer bedraagt dan meldt het zorgkantoor dit
      aan het College zorgverzekeringen volgens een door het College zorgverzekeringen vastgesteld model.


