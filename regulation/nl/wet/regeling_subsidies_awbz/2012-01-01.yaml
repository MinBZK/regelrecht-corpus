  - number: 1.8.8
    text: |-
      Op de balans worden de voorzieningen, gesplitst naar hun aard, en de reservering opgenomen. In de toelichting op de
      balans worden de toevoegingen en de onttrekkingen aan de voorzieningen en reservering toegelicht.
    url: https://wetten.overheid.nl/BWBR0019161/2012-01-01#Artikel1.8.8
  - number: 1.8.9
    text: |-
      1 De subsidieontvanger draagt er zorg voor dat, behoudens schriftelijke toestemming van het College
      zorgverzekeringen, publicatie of het anderszins openbaar maken op grond van deze regeling gesubsidieerd onderzoek,
      delen of samenvattingen daarvan, niet plaatsheeft binnen drie maanden nadat deze aan het College zorgverzekeringen
      zijn voorgelegd.

      2 Het College zorgverzekeringen is bevoegd om onderzoek, bedoeld in het eerste lid, desgewenst te voorzien van
      commentaar, één of meermalen te vermenigvuldigen of te publiceren of anderszins openbaar te maken of te doen
      openbaar maken, met vermelding van de bron, zonder dat hiervoor enige vergoeding is verschuldigd.

      3 De subsidieontvanger draagt er zorg voor dat de in het eerste lid bedoelde onderzoeksgegevens op verzoek van
      het College zorgverzekeringen onmiddellijk en kosteloos aan het College zorgverzekeringen of aan door het College
      zorgverzekeringen aangewezen natuurlijke personen of rechtspersonen beschikbaar worden gesteld.

      4 Indien een gesubsidieerde activiteit leidt tot een publicatie, kan het College zorgverzekeringen bepalen dat de
      subsidieontvanger er zorg voor draagt dat bij de publicatie wordt aangegeven wie de uitvoerder en subsidiënt van
      het project zijn geweest.

      5 Indien een subsidie gericht is of mede gericht is op de totstandkoming van een werk als bedoeld in
      [artikel 10, onder 1°, van de Auteurswet][ref1], draagt de subsidieontvanger er zorg voor auteursrechthebbende te
      zijn ter zake van dat werk.

      6 De subsidieontvanger vrijwaart de Staat der Nederlanden en het College zorgverzekeringen voor aanspraken van
      derden ter zake van alle schade die zij lijden ten gevolge van de door of vanwege de subsidieontvanger verrichte
      publicaties.


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel10
    url: https://wetten.overheid.nl/BWBR0019161/2012-01-01#Artikel1.8.9
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: '10'
  - number: 1.8.10
    text: |-
      Aan de subsidie kunnen verplichtingen als bedoeld in [artikel 4:39 van de Algemene wet bestuursrecht][ref1] worden
      verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel439
    url: https://wetten.overheid.nl/BWBR0019161/2012-01-01#Artikel1.8.10
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:39
  - number: 1.8.11
    text: |-
      1 De subsidieontvanger is in de gevallen, genoemd in
      [artikel 4:41, tweede lid, van de Algemene wet bestuursrecht][ref1], een vergoeding voor vermogensvorming
      verschuldigd.

      2 Bij de bepaling van de hoogte van de vergoeding wordt uitgegaan van de waarde van de goederen en andere
      vermogensbestanddelen op het tijdstip waarop de vergoeding verschuldigd wordt, met dien verstande dat in geval
      van ontvangst van schadevergoeding voor verlies of beschadiging van zaken, wordt uitgegaan van het bedrag dat
      als schadevergoeding door de instelling wordt ontvangen. Indien het onroerende zaken betreft, geschiedt de
      waardebepaling door één of drie onafhankelijke deskundigen.

      3 Toepassing van het eerste lid blijft achterwege indien de activiteiten van de subsidieontvanger, na toestemming
      van het College zorgverzekeringen, door een andere rechtspersoon worden voortgezet en de activa tegen boekwaarde
      aan die andere rechtspersoon in eigendom zijn overgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel441
    url: https://wetten.overheid.nl/BWBR0019161/2012-01-01#Artikel1.8.11
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:41
  - number: 1.8.12
    text: |-
      1 De vergoeding die de instelling betaalt aan een organisatie die zich de ondersteuning van één of meer
      gesubsidieerde instellingen ten doel stelt, voor door die organisatie aan de instelling ter beschikking gestelde
      goederen, is niet hoger dan het bedrag dat op grond van de verkrijgingsprijs of vervaardigingsprijs verminderd
      met de ontvangen investeringssubsidies en bestemmingsgiften berekend wordt, rekening houdend met de geldende
      afschrijvingspercentages.

      2 De vergoeding die de instelling betaalt aan een organisatie die zich de ondersteuning van één of meer
      gesubsidieerde instellingen ten doel stelt, voor door die organisatie aan de instelling geleverde diensten, is
      indien het diensten betreft die in het algemeen door soortgelijke instellingen in eigen beheer worden verricht,
      niet hoger dan het bedrag dat gelijk is aan de kosten die de instelling zou hebben gehad bij het verrichten van de
      diensten in eigen beheer.

      3 De vergoeding die de instelling betaalt aan een organisatie die zich de ondersteuning van één of meer
      gesubsidieerde instellingen ten doel stelt, voor door die organisatie aan de instelling geleverde diensten,
      andere dan de in het tweede lid bedoelde diensten, is niet hoger dan het bedrag dat voor het doen verrichten van
      dergelijke diensten door andere organisaties gebruikelijk kan worden geacht.
    url: https://wetten.overheid.nl/BWBR0019161/2012-01-01#Artikel1.8.12
  - number: 1.8.13
    text: |-
      De subsidieontvanger die aan derden goederen ter beschikking stelt of voor derden diensten verricht, brengt
      daarvoor een vergoeding in rekening die ten minste kostendekkend is, tenzij het derden betreft voor wie de
      gesubsidieerde activiteiten bestemd zijn.
    url: https://wetten.overheid.nl/BWBR0019161/2012-01-01#Artikel1.8.13
  - number: 1.8.14
    text: |-
      1 De subsidieontvanger verstrekt aan de door het College zorgverzekeringen aangewezen ambtenaren of andere personen
      op hun verzoek alle bescheiden en inlichtingen die noodzakelijk zijn voor een juiste vervulling van hun taak. De
      bescheiden worden op één adres getoond en de inlichtingen, op verzoek, schriftelijk verstrekt. Indien de instelling
      slechts kan voldoen aan deze verplichting door inbreuk te maken op het recht van enig persoon op bescherming van
      zijn persoonlijke levenssfeer, verstrekt de instelling de verlangde gegevens op zodanige wijze dat deze niet tot
      personen herleidbaar zijn.

      2 Ook anderszins wordt zoveel mogelijk medewerking verleend teneinde de door het College zorgverzekeringen
      aangewezen ambtenaren of andere personen in staat te stellen hun taak op een juiste wijze te vervullen.

      3 De subsidieontvanger werkt mee aan door of namens het College zorgverzekeringen ingestelde onderzoekingen die
      erop zijn gericht inlichtingen te verschaffen ten behoeve van de ontwikkeling van het beleid.

      4 De subsidieontvanger machtigt de in [artikel 1.9.4][ref1] bedoelde accountant overeenkomstig het eerste tot en
      met het derde lid te handelen.


      [ref1]: https://wetten.overheid.nl/BWBR0019161#Artikel1.9.4
    url: https://wetten.overheid.nl/BWBR0019161/2012-01-01#Artikel1.8.14
    references:
      - id: ref1
        bwb_id: BWBR0019161
        artikel: 1.9.4
        hoofdstuk: I
        paragraaf: '1.9'
  - number: 1.8.15
    text: |-
      Indien bij het College zorgverzekeringen het vermoeden is gerezen dat [artikel 1.8.12][ref1] niet is nageleefd,
      spant de subsidieontvanger zich desgevraagd in de jaarrekening van de desbetreffende organisatie over te leggen.


      [ref1]: https://wetten.overheid.nl/BWBR0019161#Artikel1.8.12
    url: https://wetten.overheid.nl/BWBR0019161/2012-01-01#Artikel1.8.15
    references:
      - id: ref1
        bwb_id: BWBR0019161
        artikel: 1.8.12
        hoofdstuk: I
        paragraaf: '1.8'
  - number: 1.9.1
    text: |-
      1 Binnen zes maanden na afloop van de periode of het project waarvoor subsidie is verleend, dient de
      subsidieontvanger een aanvraag in voor de subsidievaststelling.

      2 De aanvraag voor de subsidievaststelling gaat vergezeld van:

      a. het verslag, bedoeld in [artikel 1.8.6][ref1];

      b. de subsidiedeclaratie, bedoeld in [artikel 1.9.2][ref2];

      c. de jaarrekening, en

      d. indien de aanvraag is ondertekend door een of meer andere personen dan de personen die op grond van de statuten
      bevoegd zijn de instelling te vertegenwoordigen: een afschrift van de volmacht op grond waarvan de aanvraag door
      die andere persoon of personen is ondertekend.

      3 Een subsidiedeclaratie kan achterwege blijven indien de daarmee te verstrekken informatie reeds in de in te
      zenden jaarrekening is opgenomen.

      4 De jaarrekening behoeft niet te worden ingezonden, indien het gaat om:

      a. een projectsubsidie, of

      b. een subsidie aan een rechtspersoon krachtens publiekrecht ingesteld.

      5 Het College zorgverzekeringen kan ontheffing en vrijstelling verlenen van de in het eerste lid genoemde
      aanvraagtermijn.


      [ref1]: https://wetten.overheid.nl/BWBR0019161#Artikel1.8.6
      [ref2]: https://wetten.overheid.nl/BWBR0019161#Artikel1.9.2
    url: https://wetten.overheid.nl/BWBR0019161/2012-01-01#Artikel1.9.1
    references:
      - id: ref1
        bwb_id: BWBR0019161
        artikel: 1.8.6
        hoofdstuk: I
        paragraaf: '1.8'
      - id: ref2
        bwb_id: BWBR0019161
        artikel: 1.9.2
        hoofdstuk: I
        paragraaf: '1.9'
  - number: 1.9.2
    text: |-
      De subsidiedeclaratie geeft een zodanig inzicht dat een verantwoord oordeel kan worden gevormd omtrent de
      aanwending en de besteding van de subsidie door de instelling en geeft de nodige informatie om de subsidie
      vast te stellen. De subsidiedeclaratie sluit aan op de indeling van de bij de subsidieaanvraag ingediende
      begroting. Belangrijke verschillen tussen declaratie en begroting worden toegelicht. In de subsidiedeclaratie van
      instellingssubsidies wordt de aansluiting tussen de subsidiedeclaratie en de jaarrekening toegelicht.
    url: https://wetten.overheid.nl/BWBR0019161/2012-01-01#Artikel1.9.2
  - number: 1.9.3
    text: |-
      1 De [afdelingen 2 tot en met 8 van Titel 9 van Boek 2 van het Burgerlijk Wetboek][ref1] zijn van overeenkomstige
      toepassing op de jaarrekening, met dien verstande dat de winst- en verliesrekening vervangen wordt door een
      exploitatierekening; op deze rekening zijn de bepalingen omtrent de winst- en verliesrekening zoveel mogelijk
      van overeenkomstige toepassing. Bepalingen omtrent winst en verlies zijn van overeenkomstige toepassing op het
      exploitatiesaldo.

      2 De grondslag voor de waardering van activa en passiva is de verkrijgings- of vervaardigingsprijs verminderd met
      de ontvangen investeringssubsidies en bestemmingsgiften.

      3 Het College zorgverzekeringen kan bepalen dat bepalingen van de in [het eerste lid bedoelde Titel][ref2] of
      onderdelen daarvan niet van toepassing zijn op bepaalde instellingen.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Afdeling2
      [ref2]: https://wetten.overheid.nl/BWBR0003045
    url: https://wetten.overheid.nl/BWBR0019161/2012-01-01#Artikel1.9.3
    references:
      - id: ref1
        bwb_id: BWBR0003045
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0003045
  - number: 1.9.4
    text: |-
      1 De jaarrekening en de subsidiedeclaratie zijn ieder afzonderlijk voorzien van een verklaring van een accountant
      als bedoeld in [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1].

      2 De jaarrekening of de subsidiedeclaratie gaat vergezeld van een rapportage omtrent de naleving van de
      subsidiebepalingen door de subsidieontvanger, opgesteld door de accountant overeenkomstig een door het College
      zorgverzekeringen vast te stellen protocol.

      3 De subsidieontvanger draagt er zorg voor dat de accountant meewerkt aan door of namens het College
      zorgverzekeringen in te stellen onderzoeken naar de door de accountant verrichte werkzaamheden. Voor de aan dit
      onderzoek verbonden kosten wordt geen subsidie verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0019161/2012-01-01#Artikel1.9.4
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: 1.10.1
    text: |-
      Binnen zes maanden na ontvangst van de aanvraag, bedoeld in [artikel 1.9.1][ref1], geeft het College
      zorgverzekeringen een beschikking tot vaststelling van de subsidie.


      [ref1]: https://wetten.overheid.nl/BWBR0019161#Artikel1.9.1
    url: https://wetten.overheid.nl/BWBR0019161/2012-01-01#Artikel1.10.1
    references:
      - id: ref1
        bwb_id: BWBR0019161
        artikel: 1.9.1
        hoofdstuk: I
        paragraaf: '1.9'
  - number: 1.10.2
    text: |-
      Indien het College zorgverzekeringen bij de vaststelling van de subsidie rekening houdt met de ontwikkeling van
      het prijspeil of met de ontwikkeling in de kosten van de arbeidsvoorwaarden, en het bedrag aan subsidies dat alsdan
      op grond van een subsidieparagraaf vastgesteld zou worden het in die paragraaf genoemde subsidieplafond voor het
      desbetreffende jaar zou overschrijden, wordt dat plafond verhoogd met het verschil tussen het totaal door het
      College zorgverzekeringen op grond van die paragraaf aan subsidies vast te stellen bedrag en dat plafond.
    url: https://wetten.overheid.nl/BWBR0019161/2012-01-01#Artikel1.10.2
  - number: 1.10.3
    text: |-
      Bij de baten worden ook de rente-inkomsten in verband met de op de subsidie verleende voorschotten in aanmerking
      genomen.
    url: https://wetten.overheid.nl/BWBR0019161/2012-01-01#Artikel1.10.3
  - number: 2.5.1
    text: |-
      1 Aan door het College zorgverzekeringen, op basis van door het College zorgverzekeringen vast te stellen
      nadere regels inzake spreiding en behoefte, aangewezen MEE-organisaties worden op aanvraag per kalenderjaar
      instellingssubsidies verleend voor laagdrempelige, onafhankelijke en betrouwbare cliëntondersteuning ten behoeve
      van hun cliënten, zijnde verzekerden met een verstandelijke, lichamelijke of zintuiglijke handicap al da niet
      veroorzaakt door een chronische ziekte of een beperking uit het autistisch spectrum, hun ouders, andere verwanten,
      verzorgers of vertegenwoordigers.

      2 Een MEE-organisatie komt niet voor subsidie in aanmerking indien zij zorg verleent op grond van de AWBZ.

      3 Bij de subsidiëring worden de volgende activiteiten onderscheiden:

      a. collectieve cliëntondersteuning;

      b. individuele cliëntondersteuning, en

      c. coördinatie van projecten integrale vroeghulp.
    url: https://wetten.overheid.nl/BWBR0019161/2012-01-01#Artikel2.5.1
  - number: 2.5.2
    text: |-
      1 Het subsidieplafond voor collectieve en individuele cliëntondersteuning bedraagt voor het jaar 2012
      € 188 658 904.

      2 Het subsidieplafond voor de coördinatie van projecten integrale vroeghulp bedraagt voor het jaar 2012
      € 1 675 554.
    url: https://wetten.overheid.nl/BWBR0019161/2012-01-01#Artikel2.5.2
  - number: 2.5.3
    text: |-
      1 Subsidie voor collectieve cliëntondersteuning wordt slechts verleend indien de activiteiten van de MEE-
      organisatie op dit terrein bestaan uit:

      a. het vergaren en verstrekken van informatie en het geven van voorlichting aan cliënten;

      b. het signaleren van relevante ontwikkelingen en belemmeringen, en

      c. het scheppen van voorwaarden voor maatschappelijke activering en integratie door middel van het opbouwen en
      onderhouden van de sociale kaart en relevante netwerken.

      2 Subsidie wordt slechts verleend voor zover tussen de MEE-organisatie en het door het College zorgverzekeringen
      voor hem aangewezen zorgkantoor schriftelijk overeenstemming is bereikt over de omvang van de activiteiten bedoeld
      in het eerste lid.

      3 De subsidieverlening bedraagt in 2012 maximaal € 2 039 per 1000 inwoners, waarbij wordt uitgegaan van het aantal
      inwoners op 1 januari van het jaar voorafgaande aan het subsidiejaar.

      4 Indien het in 2011 verleende subsidiebedrag hoger is dan € 1 970 per 1000 inwoners, bedraagt de subsidieverlening
      per 1000 inwoners maximaal het in 2011 verleende subsidiebedrag per 1000 inwoners verhoogd met 3,5%, waarbij wordt
      uitgegaan van het aantal inwoners op 1 januari van het jaar voorafgaande aan het subsidiejaar.
    url: https://wetten.overheid.nl/BWBR0019161/2012-01-01#Artikel2.5.3
  - number: 2.5.4
    text: |-
      1 Subsidie voor individuele cliëntondersteuning wordt slechts verleend indien de activiteiten van de MEE-
      organisatie op dit terrein bestaan uit de volgende diensten:

      a. dienst A: informatieverstrekking en advisering;

      b. dienst B1: vraagverduidelijking;

      c. dienst B2: aanvragen en realiseren van externe dienstverlening en zorg;

      d. dienst B3: klacht en bezwaar en beroep waaronder ook het voorkomen daarvan;

      e. dienst B4: monitoring en evaluatie van externe dienstverlening en zorg;

      f. dienst B5: ondersteuning in een crisissituatie;

      g. dienst C: volledige beeldvorming;

      h. dienst D: kortdurende en kortcyclische ondersteuning, en

      i. dienst E: aanbieding van cursussen in groepen.

      2 De ten behoeve van 2012 te verlenen subsidie wordt berekend op basis van de volgende normbedragen:

      a. dienst A: € 281;

      b. dienst B1: € 1 043;

      c. dienst B2: € 1 444;

      d. dienst B3: € 1 204;

      e. dienst B4: € 682;

      f. dienst B5: € 883;

      g. dienst C: € 1 184;

      h. dienst D: € 1 685;

      i. dienst E: € 562.

      3 De normbedragen voor de diensten A tot en met D hebben betrekking op in het subsidiejaar afgesloten diensten. Het
      normbedrag voor dienst E heeft betrekking op in het subsidiejaar gegeven cursusbijeenkomsten.

      4 De subsidieverlening bedraagt het product van het aantal diensten en de in het tweede lid genoemde normbedragen.

      5 Subsidie wordt slechts verleend voor zover tussen de MEE-organisatie en het door het College zorgverzekeringen
      voor hem aangewezen zorgkantoor schriftelijk overeenstemming is bereikt over de omvang van de activiteiten bedoeld
      in het eerste lid.

      6 Indien de gezamenlijke aanvragen voor subsidieverlening voor individuele cliëntondersteuning hoger zijn dan het
      voor verlening uit hoofde van het subsidieplafond beschikbare budget, wordt subsidie verleend tot het bedrag van
      het in het voorgaande subsidiejaar voor individuele cliëntondersteuning met toepassing van [artikel 1.7.3][ref1]
      verleende subsidie, voor zover dat bedrag is aangevraagd. De subsidie wordt vervolgens verminderd met een
      efficiencykorting van 1,5% en verhoogd met een groeiruimte van 2,2%. Toepassing van het zevende lid blijft buiten
      beschouwing.

      7 Indien de gezamenlijke waarde van de in het subsidiejaar gerealiseerde diensten, als bedoeld in het eerste lid,
      lager is dan de verleende subsidie dan wordt de subsidieverlening dienovereenkomstig verlaagd, met dien verstande
      dat de aldus herziene subsidieverlening minimaal 90% bedraagt van de aanvankelijk verleende subsidie.

      8 Toepassing van het zevende lid leidt niet tot hernieuwde toepassing van het zesde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0019161#Artikel1.7.3
    url: https://wetten.overheid.nl/BWBR0019161/2012-01-01#Artikel2.5.4
    references:
      - id: ref1
        bwb_id: BWBR0019161
        artikel: 1.7.3
        hoofdstuk: I
        paragraaf: '1.7'
  - number: 2.5.4a
    text: |-
      1 De subsidies van de MEE-organisaties die meer dan het gemiddelde subsidiebedrag voor collectieve en individuele
      diensten per inwoner ontvangen, worden verminderd met maximaal 5% van het budget voor collectieve en individuele
      diensten tot een minimum van het gemiddelde subsidiebedrag voor collectieve en individuele diensten per inwoner.

      2 De na toepassing van het eerste lid beschikbaar zijnde middelen worden toegekend aan de MEE-organisaties die voor
      collectieve en individuele diensten het laagste gemiddelde subsidiebedrag per inwoner zouden ontvangen, uitgaande
      van het aantal inwoners op 1 januari van het jaar voorafgaand aan het subsidiejaar. Het gemiddelde subsidiebedrag
      voor collectieve en individuele diensten per inwoner van de MEE-organisaties wordt gelijkelijk verhoogd tot
      ten hoogste het gemiddelde subsidiebedrag per inwoner van de MEE-organisatie met het één na laagste gemiddelde
      subsidiebedrag voor collectieve en individuele diensten per inwoner. Dit wordt herhaald tot de middelen volledig
      verdeeld zijn of tot het gemiddelde subsidiebedrag voor collectieve en individuele diensten per inwoner gelijk is
      aan het gemiddelde subsidiebedrag voor collectieve en individuele diensten per inwoner.

      3 Het eerste lid is niet van toepassing op een MEE-organisatie waarvan de MEE-index, vermeld in [bijlage 1][ref1],
      lager is dan de Wmo-index, vermeld in bijlage 1.


      [ref1]: https://wetten.overheid.nl/BWBR0019161
    url: https://wetten.overheid.nl/BWBR0019161/2012-01-01#Artikel2.5.4a
    references:
      - id: ref1
        bwb_id: BWBR0019161
  - number: 2.5.5
    text: |-
      1 Subsidie voor de coördinatie van een project integrale vroeghulp wordt slechts verleend indien het project
      integrale vroeghulp:

      a. is gebaseerd op een samenwerkingsovereenkomst tussen de MEE-organisatie en ten minste de sector voor de
      kinderrevalidatie en de sector voor de zorg voor kinderen met een verstandelijke handicap;

      b. beschikt over een team integrale vroeghulp, bestaande uit vertegenwoordigers van een kinderrevalidatiecentrum
      of de revalidatieafdeling van een ziekenhuis, de subsidieontvanger en de kinderdagcentra voor kinderen met een
      verstandelijke handicap;

      c. een onafhankelijk aangestuurde coördinator heeft;

      d. een pool van deskundige casemanagers heeft;

      e. beschikt over een laagdrempelig aanmeldpunt, en

      f. beschikt over een projectplan dat de instemming heeft van de partijen die de samenwerkingsovereenkomst, bedoeld
      onder a, zijn aangegaan.

      2 De kosten die de MEE-organisatie maakt als samenwerkingspartner bij de uitvoering van projecten integrale
      vroeghulp vallen onder het subsidieplafond van [artikel 2.5.2, tweede lid][ref1]. De kosten van de overige
      samenwerkingspartners in een project integrale vroeghulp kunnen niet ten laste van deze subsidieparagraaf worden
      gebracht.

      3 Het subsidieplafond genoemd in [artikel 2.5.2, tweede lid][ref2], wordt in 2012 als volgt verdeeld:

      a. € 17 730 per MEE-organisatie;

      b. de vervolgens nog resterende subsidie wordt over de MEE-organisaties verdeeld op basis van het aantal inwoners,
      waarbij wordt uitgegaan van het aantal inwoners op 1 januari van het jaar voorafgaande aan het subsidiejaar.


      [ref1]: https://wetten.overheid.nl/BWBR0019161#Artikel2.5.2
      [ref2]: https://wetten.overheid.nl/BWBR0019161#Artikel2.5.2
