  - number: 2.7.3
    text: |-
      1 Het zorgkantoor weigert verlening van een vergoeding persoonlijke zorg indien:

      a. binnen de maximale subsidie als bedoeld in [artikel 2.7.1, derde lid][ref1], geen ruimte voor verlening van een
      vergoeding persoonlijke zorg aanwezig is;

      b. de verzekerde op de dag dat de subsidieperiode zou aanvangen recht heeft op een persoonsgebonden budget,

      c. de verzekerde in het aanvraagformulier heeft aangegeven dat hij zich niet heeft georiënteerd op het door het
      zorgkantoor gecontracteerde zorgaanbod, of

      d. de verzekerde in het aanvraagformulier heeft aangegeven dat hij voornemens is om de vergoeding uitsluitend te
      besteden aan de inkoop van zorg bij door het zorgkantoor gecontracteerde zorgverleners.

      2 [Artikel 2.6.4, tweede lid, onderdelen a, b, d, e, g tot en met i, en k][ref2], zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0019161#Artikel2.7.1
      [ref2]: https://wetten.overheid.nl/BWBR0019161#Artikel2.6.4
