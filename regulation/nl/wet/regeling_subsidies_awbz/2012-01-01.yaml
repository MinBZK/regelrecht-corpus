  - number: 2.7.1
    text: |-
      1 Het College zorgverzekeringen verleent op aanvraag per kalenderjaar aan zorgkantoren een subsidie die is bestemd
      voor het met inachtneming van deze paragraaf verstrekken van een vergoeding persoonlijke zorg.

      2 Het subsidieplafond voor de in het eerste lid bedoelde activiteiten bedraagt voor het jaar 2012 € 50 000 000.

      3 Het College zorgverzekeringen neemt voor verleende vergoedingen persoonlijke zorg als bedoeld in het eerste lid
      voor het jaar 2012 een maximale subsidie in aanmerking die hij berekent overeenkomstig de volgende formule:

      30 000/2 614 000 000 x het bedrag dat het College zorgverzekeringen aan de zorgkantoren verleent, op grond van
      [artikel 2.6.2, derde lid][ref1].

      4 Het College zorgverzekeringen verdeelt voor het jaar 2012 € 20 000 000 met inachtneming van door hem vast te
      stellen beleidsregels.

      5 De [artikelen 2.6.2, vijfde tot en met zevende lid][ref2], en [2.6.5][ref3] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0019161#Artikel2.6.2
      [ref2]: https://wetten.overheid.nl/BWBR0019161#Artikel2.6.2
      [ref3]: https://wetten.overheid.nl/BWBR0019161#Artikel2.6.5
