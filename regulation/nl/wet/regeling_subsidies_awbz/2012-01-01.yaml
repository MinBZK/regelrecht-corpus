  - number: 2.6.14
    text: |-
      1 Het zorgkantoor controleert, op basis van een door het College zorgverzekeringen op te stellen protocol of de
      formulieren, bedoeld in [artikel 2.6.9, eerste lid, onderdeel e][ref1], naar waarheid zijn ingevuld.

      2 Het College zorgverzekeringen bepaalt welke gegevens de zorgkantoren bij de uitvoering van deze paragraaf
      registreren.

      3 Het zorgkantoor bewaart de in het tweede lid bedoelde gegevens gedurende ten minste vijf jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0019161#Artikel2.6.9
