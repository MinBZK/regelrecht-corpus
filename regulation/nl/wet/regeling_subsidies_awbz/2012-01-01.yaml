  - number: 2.6.7
    text: |-
      1 De verzekerde van achttien jaar of ouder aan wie een persoongebonden budget is verleend is een bijdrage
      verschuldigd van:

      a. 33% van het bruto persoonsgebonden budget voor persoonlijke verzorging;

      b. 20% van het bruto persoonsgebonden budget voor verpleging;

      c. 27% van het bruto persoonsgebonden budget voor begeleiding.

      2 De bijdrage, bedoeld in het eerste lid, bedraagt in 2012 niet meer dan:

      a. voor de ongehuwde verzekerde jonger dan 65 jaar € 234,64, met dien verstande dat indien zijn inkomen meer
      bedraagt dan € 22 905 het bedrag van € 234,64 wordt verhoogd met 15% van het verschil tussen zijn inkomen en
      € 22 905;

      b. voor de ongehuwde verzekerde van 65 jaar of ouder € 234,64, met dien verstande dat indien zijn inkomen meer
      bedraagt dan € 16 007 het bedrag van € 234,64 wordt verhoogd met 15% van het verschil tussen zijn inkomen en
      € 16 007;

      c. voor de gehuwde verzekerden indien een van beiden jonger is dan 65 jaar of beiden jonger zijn dan 65 jaar
      € 336,32, met dien verstande dat indien hun gezamenlijke inkomen meer bedraagt dan € 28 306 het bedrag van € 336,32
      wordt verhoogd met 15% van het verschil tussen hun gezamenlijke inkomen en € 28 306;

      d. voor de gehuwde verzekerden die beiden 65 jaar of ouder zijn € 336,32, met dien verstande dat indien hun
      gezamenlijke inkomen meer bedraagt dan € 22 319 het bedrag van € 336,32 wordt verhoogd met 15% van het verschil
      tussen hun gezamenlijke inkomen en € 22 319.

      3 Bij de uitvoering van het tweede lid gaat het zorgkantoor uit van het verzamelinkomen in het kalenderjaar
      voorafgaande aan het peiljaar indien aan de verzekerde op 31 december van het voorgaande kalenderjaar een
      persoonsgebonden budget is verleend en het verzamelinkomen in het peiljaar op 1 maart van het kalenderjaar niet
      bekend is bij het zorgkantoor.

      4 Het zorgkantoor vermindert de bijdrage die de verzekerde op grond van het tweede en derde lid maximaal
      verschuldigd is met een eigen bijdrage die verschuldigd is ingevolge de [Wet maatschappelijke ondersteuning][ref1]
      en het aandeel van de kosten van maatschappelijke ondersteuning dat bij de toekenning van een financiële
      tegemoetkoming ingevolge [die wet][ref2] voor eigen rekening komt alsmede met een bijdrage die verschuldigd is op
      grond van [artikel 16d van het Bijdragebesluit zorg][ref3].

      5 Op de met toepassing van het eerste tot en met het vierde lid vastgestelde eigen bijdrage wordt een korting van
      33% toegepast.

      6 De [artikelen 1][ref4], [16d, zesde lid, onderdeel a][ref5] en [16e van het Bijdragebesluit zorg][ref6] zijn van
      overeenkomstige toepassing.


