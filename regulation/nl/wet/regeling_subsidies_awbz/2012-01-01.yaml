  - number: 2.11.1
    text: |-
      Voor de exploitatie van de navolgende abortusklinieken kan een instellingssubsidie worden verleend aan de daarbij
      vermelde rechtspersonen:

      a. Stimezo Alkmaar te Alkmaar, Stichting Stimezo Alkmaar;

      b. Sezoz te Amsterdam, Stichting Sexualiteit Zwangerschapsonderbreking Zorg;

      c. Casa Amsterdam te Amsterdam, Stichting Centrum voor Anticonceptie, Seksualiteit en Abortus;

      d. Mildredhuis te Arnhem, Stichting Mildredhuis, Centrum voor seksuele gezondheid Arnhem e.o.;

      e. CASA Den Haag te Den Haag, Stichting Centrum voor Anticonceptie, Seksualiteit en Abortus;

      f. Stichting RutgersStimezo Zuid Nederland, centrum voor seksuele gezondheid Eindhoven e.o.;

      g. Emma Kliniek te Enschede, Stichting ter bevordering van medisch verantwoorde zwangerschapsafbreking Enschede
      en omstreken;

      h. CASA Goes te Goes, Stichting Centrum voor Anticonceptie, Seksualiteit en Abortus;

      i. Stimezo Groningen te Groningen, Stichting Medisch Centrum voor Geboorteregeling Stimezo Groningen;

      j. Beahuis te Heemstede, Stichting Hulpverlening Zwangerschapsonderbreking Noord-Holland ‘STIZO’;

      k. CASA Leiden te Leiden, Stichting Centrum voor Anticonceptie, Seksualiteit en Abortus;

      l. CASA Maastricht te Maastricht, Stichting Centrum voor Anticonceptie, Seksualiteit en Abortus;

      m. CASA Rotterdam te Rotterdam, Stichting Centrum voor Anticonceptie, Seksualiteit en Abortus;

      n. Vrelinghuis te Utrecht, Stichting voor Hulpverlening bij Zwangerschapsonderbreking Utrecht en omgeving;

      o. Stimezo Zwolle te Zwolle, Stichting Stimezo Zwolle.
    url: https://wetten.overheid.nl/BWBR0019161/2012-01-01#Artikel2.11.1
  - number: 2.11.2
    text: |-
      1 De gesubsidieerde activiteiten bestaan uit zwangerschapsafbrekingen in de zin van
      [artikel 1, tweede lid, van de Wet afbreking zwangerschap][ref1], overtijdbehandelingen en de aan beide
      behandelingsvormen verbonden nazorg ten behoeve van verzekerden, voor zover deze hulp onder verantwoordelijkheid
      van de subsidieontvanger en met personeel in dienst van de subsidieontvanger plaats vindt in diens abortuskliniek.

      2 In afwijking van het eerste lid kan het College zorgverzekeringen onder door hem te stellen voorwaarden de
      subsidieontvanger toestemming verlenen werkzaamheden die rechtstreeks verband houden met de exploitatie van de
      abortuskliniek, door derden ten laste van de subsidiegelden te doen uitvoeren.


      [ref1]: https://wetten.overheid.nl/BWBR0003396#Artikel1
    url: https://wetten.overheid.nl/BWBR0019161/2012-01-01#Artikel2.11.2
    references:
      - id: ref1
        bwb_id: BWBR0003396
        artikel: '1'
  - number: 2.11.3
    text: |-
      De subsidieontvanger draagt er zorg voor dat geen betalingen van verzekerden worden gevraagd voor de gesubsidieerde
      activiteiten.
    url: https://wetten.overheid.nl/BWBR0019161/2012-01-01#Artikel2.11.3
  - number: 2.11.4
    text: |-
      1 In afwijking van [paragraaf 1.2.1][ref1] bestaat de subsidie uit:

      a. voor de eerste 1.000 zwangerschapsafbrekingen een bedrag van € 428,35 per behandeling en voor elke volgende
      zwangerschapsafbreking een bedrag van € 260,14 per behandeling;

      b. voor tweede trimesterbehandelingen een opslag van € 185,84 per behandeling;

      c. een opslag van € 109,49 voor eerste of tweede trimesterbehandelingen, verricht onder narcose bij een
      sedatiescore van vier of vijf, in overeenstemming met de door het centraal begeleidingsorgaan voor de
      Intercollegiale Toetsing vastgelegde consensus ‘Sedatie en/of analgesie door niet anesthesiologen’ en onder
      begeleiding van een tweede arts die daartoe bevoegd en bekwaam is;

      d. een extra opslag van € 325,56 per behandeling, bedoeld onder c, met prostaglandine;

      e. een bedrag van € 78,42 voor een consult waarop geen zwangerschapsonderbreking of overtijdbehandeling volgt.

      2 De subsidie wordt vermeerderd met de volgende toeslagen voor met de gesubsidieerde activiteiten samenhangende
      lasten:

      a. een toeslag voor huisvesting:

      1°. indien de huisvesting en de vaste installaties in eigendom is van de subsidieontvanger: rente en afschrijvingen
      bepaald op grond van de beleidsregels van de zorgautoriteit;

      2°. indien de huisvesting en de vaste installaties wordt gehuurd door de subsidieontvanger: huur van de huisvesting
      en de vaste installaties exclusief de servicekosten, voor zover de subsidieontvanger geen andere vergoeding voor
      deze huur ontvangt of kan ontvangen. De hoogte van de huur wordt bepaald door een huurcommissie bestaande uit één
      makelaar aan te wijzen door huurder, één makelaar aan te wijzen door verhuurder en één makelaar aan te wijzen door
      beide voornoemde makelaars.

      b. een toeslag voor overige kapitaallasten van:

      1°. € 24 108,44 indien het totale aantal verrichtte zwangerschapsafbrekingen en overtijdbehandelingen lager is dan
      1.500 of

      2°. € 29 572,29 indien het totale aantal verrichtte zwangerschapsafbrekingen en overtijdbehandelingen 1.500 of
      meer is.

      3 De subsidie wordt verleend op basis van een raming van het aantal zwangerschapsafbrekingen, overtijdbehandelingen
      en consulten waarop geen zwangerschapsonderbreking of overtijdbehandeling volgt, alsmede een begroting van de
      toeslagen voor huisvesting en kapitaallasten.

      4 De subsidie wordt vastgesteld op basis van het aantal verrichtte zwangerschapsafbrekingen, overtijdbehandelingen
      en consulten waarop geen zwangerschapsonderbreking of overtijdbehandeling volgt, alsmede de werkelijke
      huisvestings- en kapitaallasten.

      5 De bedragen, vermeld in het eerste en tweede lid, worden, rekening houdend met de beleidsregels van de
      zorgautoriteit, bijgesteld in verband met de ontwikkeling van de loonkosten en de materiële kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0019161#HoofdstukI
    url: https://wetten.overheid.nl/BWBR0019161/2012-01-01#Artikel2.11.4
    references:
      - id: ref1
