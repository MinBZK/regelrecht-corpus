  - number: 1.2.3
    text: |-
      Baten en lasten die door middel van interne doorberekeningen worden toegerekend, worden bepaald op
      bedrijfseconomische en maatschappelijk aanvaardbare grondslagen. Voorzover hierin lasten zijn begrepen van
      materiële vaste activa, worden deze lasten op basis van aanschaffingsprijzen van die activa berekend.
    url: https://wetten.overheid.nl/BWBR0019161/2012-01-01#Artikel1.2.3
  - number: 1.3.1
    text: |-
      Een projectsubsidie bestaat uit het verschil tussen de met de gesubsidieerde activiteiten samenhangende en met in
      achtneming van de ingevolge deze regeling in aanmerking komende werkelijke lasten, voorzover opgenomen in de door
      het College zorgverzekeringen goedgekeurde begroting, en de met de gesubsidieerde activiteiten samenhangende baten.
      De subsidie bedraagt niet meer dan het door het College zorgverzekeringen vastgestelde maximum.
    url: https://wetten.overheid.nl/BWBR0019161/2012-01-01#Artikel1.3.1
  - number: 1.4.1
    text: |-
      Het College zorgverzekeringen stelt voor de subsidies in deze regeling de volgende modellen en formulieren vast:

      a. een formulier voor de aanvraag van subsidie;

      b. een model voor het projectplan;

      c. een model voor de begroting;

      d. een model voor het activiteitenplan;

      e. een model voor het activiteitenverslag;

      f. een controleprotocol;

      g. een model accountantsverklaring, en

      h. een formulier voor de aanvraag van de vaststelling van de subsidie.
    url: https://wetten.overheid.nl/BWBR0019161/2012-01-01#Artikel1.4.1
  - number: 1.5.1
    text: |-
      1 De instelling die voor haar activiteiten of een gedeelte daarvan in een jaar een instellingssubsidie verlangt,
      dient uiterlijk vóór de aanvang van het desbetreffende jaar een subsidieaanvraag in. De aanvraag wordt onderbouwd
      met een activiteitenplan en een begroting en gaat, indien de liquiditeitsbehoefte niet regelmatig gespreid is over
      het jaar, vergezeld van een liquiditeitsprognose.

      2 In het activiteitenplan worden de aard en de omvang van de voorgenomen activiteiten beschreven. Daarbij wordt
      aangegeven welke doelstelling de instelling met de activiteiten nastreeft, op welke wijze zij zullen worden
      uitgevoerd en voor welke doelgroep zij zijn bestemd.

      3 De begroting geeft inzicht in de baten en lasten van de activiteiten van dat jaar. De begroting is voorzien
      van een postgewijze toelichting. Daarbij wordt uitgegaan van het prijspeil en van het niveau van de kosten van de
      arbeidsvoorwaarden op het moment van indiening van de aanvraag. In geval van een privaatrechtelijke rechtspersoon
      bevat de begroting tevens zowel de baten en lasten van de instelling als geheel als de baten en lasten van elk te
      onderscheiden onderdeel van de instelling.

      4 De liquiditeitsprognose geeft gemotiveerd inzicht in het verloop van de liquiditeitsbehoefte van de activiteiten
      per kalenderkwartaal.

      5 Het College zorgverzekeringen kan ontheffing verlenen van de in het eerste lid genoemde aanvraagtermijn.
    url: https://wetten.overheid.nl/BWBR0019161/2012-01-01#Artikel1.5.1
  - number: 1.5.2
    text: |-
      1 Bij de aanvraag van een instellingssubsidie door een privaatrechtelijke rechtspersoon worden tevens overgelegd:

      a. een afschrift van de oprichtingsakte of de statuten;

      b. een afschrift waaruit de inschrijving van de instelling in het geldende openbaar register blijkt;

      c. een volledig overzicht van de financiële toestand van de instelling op het tijdstip van de aanvraag, en

      d. indien de aanvraag is ondertekend door een of meer andere personen dan de personen die op grond van de statuten
      bevoegd zijn de instelling te vertegenwoordigen: een afschrift van de volmacht op grond waarvan de aanvraag door
      die andere persoon of personen is ondertekend.

      2 Voorzover de aanvrager voor dezelfde begrote uitgaven tevens subsidie of een andere financiële bijdrage
      heeft aangevraagd bij andere bestuursorganen of organisaties, doet hij daarvan mededeling in de aanvraag, onder
      vermelding van de stand van zaken met betrekking tot de beoordeling van die aanvraag of aanvragen.

      3 Overlegging van de in het eerste lid bedoelde afschriften kan achterwege blijven, indien de aanvrager er
      redelijkerwijs van uit kan gaan dat deze gegevens aan het College zorgverzekeringen bekend zijn.
    url: https://wetten.overheid.nl/BWBR0019161/2012-01-01#Artikel1.5.2
  - number: 1.6.1
    text: |-
      1 Het College zorgverzekeringen kan projectsubsidies verlenen die zich uitstrekken over meer dan een kalenderjaar.

      2 De natuurlijke persoon of rechtspersoon die subsidie voor een bepaald project verlangt, dient ten minste 13 weken
      vóór de aanvang van het project een aanvraag in. De aanvraag wordt onderbouwd met een projectplan en een begroting
      en gaat vergezeld van een liquiditeitsprognose.

      3 In het projectplan worden de aard en de omvang van de voorgenomen activiteiten beschreven. Daarbij wordt
      aangegeven welke doelstelling de aanvrager met de activiteiten nastreeft en op welke wijze die zullen worden
      uitgevoerd.

      4 De begroting geeft inzicht in de baten en lasten van het project. De begroting is voorzien van een postgewijze
      toelichting. Daarbij wordt uitgegaan van het prijspeil en van het niveau van de kosten van de arbeidsvoorwaarden op
      het moment van indiening van de aanvraag.

      5 De liquiditeitsprognose geeft gemotiveerd inzicht in het verloop van de liquiditeitsbehoefte van de activiteiten
      per maand. De liquiditeitsprognose kan achterwege blijven als de liquiditeitsbehoefte regelmatig gespreid is over
      de duur van het project.

      6 In afwijking van het tweede lid kan het College zorgverzekeringen bepalen dat aanvragen voor projecten op
      bepaalde terreinen vóór een of meer door hem vastgestelde data worden ingediend.

      7 Het College zorgverzekeringen kan ontheffing verlenen van de in het tweede of zesde lid bedoelde aanvraagtermijn.
    url: https://wetten.overheid.nl/BWBR0019161/2012-01-01#Artikel1.6.1
  - number: 1.6.2
    text: |-
      1 Bij de aanvraag van de subsidie door een privaatrechtelijke rechtspersoon worden tevens overgelegd:

      a. een afschrift van de oprichtingsakte of de statuten;

      b. een afschrift waaruit de inschrijving van de instelling in het geldende openbaar register blijkt, en

      c. indien de aanvraag is ondertekend door een of meer andere personen dan de personen die op grond van de statuten
      bevoegd zijn de instelling te vertegenwoordigen: een afschrift van de volmacht op grond waarvan de aanvraag door
      die andere persoon of personen is ondertekend.

      2 Voorzover de aanvrager voor dezelfde begrote uitgaven tevens subsidie of een andere financiële bijdrage heeft
      aangevraagd bij andere bestuursorganen, doet hij daarvan mededeling in de aanvraag, onder vermelding van de stand
      van zaken met betrekking tot de beoordeling van die aanvraag of aanvragen.

      3 Overlegging van in het eerste lid bedoelde afschriften kan achterwege blijven, indien de aanvrager er
      redelijkerwijs van uit kan gaan dat deze gegevens bij het College zorgverzekeringen bekend zijn.
    url: https://wetten.overheid.nl/BWBR0019161/2012-01-01#Artikel1.6.2
  - number: 1.6.3
    text: |-
      1 Het College zorgverzekeringen kan een aanvrager of een categorie aanvragers tevens verplichten tot het overleggen
      van een volledig overzicht van de financiële toestand van de instelling op het tijdstip van de aanvraag.

      2 Het eerste lid is niet van toepassing indien een rechtspersoon, krachtens publiekrecht ingesteld, een
      projectsubsidie aanvraagt.
    url: https://wetten.overheid.nl/BWBR0019161/2012-01-01#Artikel1.6.3
  - number: 1.7.1
    text: |-
      1 Het College zorgverzekeringen geeft een beschikking op een aanvraag voor een instellingssubsidie voor 1 april van
      het desbetreffende subsidiejaar.

      2 Het College zorgverzekeringen geeft een beschikking op een aanvraag voor een projectsubsidie binnen 13 weken na
      ontvangst van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0019161/2012-01-01#Artikel1.7.1
  - number: 1.7.2
    text: |-
      1 Nadat een subsidieaanvraag is ingediend, kan het College zorgverzekeringen voorschotten verlenen. Daarbij wordt
      rekening gehouden met de liquiditeitsbehoefte.

      2 Het College zorgverzekeringen verstrekt, indien de liquiditeitsbehoefte regelmatig is gespreid, de volgende
      voorschotten op een verleende instellingssubsidie: in januari 15%, februari 7%, maart 7%, april 7%, mei 15%, juni
      7%, juli 7%, augustus 7%, september 3%, oktober 11%, en november 14% van het voor het desbetreffende jaar verleende
      bedrag.

      3 Indien het College zorgverzekeringen voorschotten verstrekt voordat hij de beschikking tot subsidieverlening
      heeft gegeven, worden de percentages, bedoeld in het tweede lid, tot de datum van subsidieverlening, toegepast op
      het voor het voorgaande jaar verleende bedrag, in voorkomende gevallen bijgesteld overeenkomstig door het College
      zorgverzekeringen gegeven beschikkingen.
    url: https://wetten.overheid.nl/BWBR0019161/2012-01-01#Artikel1.7.2
  - number: 1.7.3
    text: |-
      1 Bij de verlening van een subsidie kan het College zorgverzekeringen bepalen dat het subsidiebedrag door hem
      wordt bijgesteld, rekeninghoudend met de ontwikkeling van het prijspeil of de ontwikkeling in de kosten van de
      arbeidsvoorwaarden.

      2 Met het oog op de toepassing van het eerste lid kan het College zorgverzekeringen bij de verlening van de
      subsidie tevens bepalen welk deel van het subsidiebedrag in aanmerking zal worden genomen voor een bijstelling in
      verband met de ontwikkeling van het prijspeil, onderscheidenlijk van de kosten van de arbeidsvoorwaarden.

      3 Indien een subsidie met toepassing van het eerste lid wordt bijgesteld, kan de bevoorschotting overeenkomstig
      worden gewijzigd.
    url: https://wetten.overheid.nl/BWBR0019161/2012-01-01#Artikel1.7.3
  - number: 1.8.1
    text: |-
      De subsidieontvanger zorgt ervoor dat:

      a. de doeleinden, gesteld in het activiteitenplan dan wel het projectplan, op doelmatige wijze worden nagestreefd;

      b. de werkzaamheden op een zodanige manier worden geregeld dat een goed beleid en beheer worden gevoerd, en

      c. de subsidie op doelmatige wijze wordt gebruikt voor de doeleinden waarvoor deze wordt verleend.
    url: https://wetten.overheid.nl/BWBR0019161/2012-01-01#Artikel1.8.1
  - number: 1.8.2
    text: |-
      De subsidieontvanger zorgt er voorts voor:

      a. dat de administratie op overzichtelijke en doelmatige wijze wordt gevoerd;

      b. dat de administratie een juist, volledig en actueel beeld geeft van het functioneren van de instelling, en

      c. dat van alle ontvangsten en uitgaven deugdelijke bewijsstukken aanwezig zijn waaruit de aard en de omvang van de
      geleverde goederen of van de verrichte diensten duidelijk blijken.
    url: https://wetten.overheid.nl/BWBR0019161/2012-01-01#Artikel1.8.2
  - number: 1.8.3
    text: Bij instellingen die een instellingssubsidie ontvangen, is het boekjaar gelijk aan het kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0019161/2012-01-01#Artikel1.8.3
  - number: 1.8.4
    text: |-
      1 De subsidieontvanger doet zo spoedig mogelijk schriftelijk mededeling aan het College zorgverzekeringen van
      omstandigheden die van belang kunnen zijn voor een beslissing tot wijziging, intrekking of vaststelling van de
      subsidie.

      2 Het eerste lid is van toepassing in de situatie dat de feitelijke liquiditeitsbehoefte lager is dan de verleende
      voorschotten.

      3 Bij een mededeling overeenkomstig dit artikel worden de relevante stukken overgelegd.
    url: https://wetten.overheid.nl/BWBR0019161/2012-01-01#Artikel1.8.4
  - number: 1.8.5
    text: |-
      1 De privaatrechtelijke rechtspersoon die een instellingssubsidie ontvangt, verzekert haar roerende en
      onroerende zaken op afdoende wijze tegen het risico van diefstal en brand alsmede tegen het risico van wettelijke
      aansprakelijkheid tegenover derden.

      2 De ontvanger van een instellingssubsidie verzekert voor vrijwilligers die werkzaamheden verrichten in het kader
      van de gesubsidieerde activiteiten, hun wettelijke aansprakelijkheid.

      3 Het College zorgverzekeringen kan op aanvraag ontheffing verlenen van het eerste of tweede lid.

      4 Het College zorgverzekeringen kan het eerste of tweede lid van overeenkomstige toepassing verklaren op de
      ontvanger van een projectsubsidie.
    url: https://wetten.overheid.nl/BWBR0019161/2012-01-01#Artikel1.8.5
  - number: 1.8.6
    text: |-
      De subsidieontvanger stelt na afloop van de periode of het project waarvoor subsidie is verleend een verslag
      vast dat inzicht geeft in de aard, duur en omvang van de in het kader van de subsidiëring verrichte activiteiten.
      Het verslag vergelijkt de verrichte activiteiten met de in het activiteitenplan, onderscheidenlijk projectplan,
      voorgenomen activiteiten.
    url: https://wetten.overheid.nl/BWBR0019161/2012-01-01#Artikel1.8.6
  - number: 1.8.7
    text: |-
      1 Voorzover het bedrag van de verleende instellingssubsidie, zonder toepassing van de in [artikel 1.2.2][ref1]
      bedoelde vermindering, na uitvoering van de gesubsidieerde activiteiten overeenkomstig de geldende verplichtingen,
      niet is besteed aan de doeleinden waarvoor het is verstrekt, wordt het gereserveerd.

      2 Voor de berekening van het in het eerste lid bedoelde te reserveren bedrag wordt het totaal van de met de
      gesubsidieerde activiteiten samenhangende baten, bestaande uit de verleende instellingssubsidie en de gerealiseerde
      overige baten, verminderd met de lasten van de gesubsidieerde activiteiten. Deze uitkomst wordt toegerekend naar
      rato van de verleende instellingssubsidie en de, in de ingediende begroting opgenomen, met de gesubsidieerde
      activiteiten samenhangende, overige baten. Het te reserveren bedrag is het aan de instellingssubsidie toegerekende
      deel.

      3 Toevoegingen aan voorzieningen als bedoeld in
      [artikel 374, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref2], die samenhangen met de gesubsidieerde
      activiteiten, worden gerekend tot de lasten van de gesubsidieerde activiteiten, bedoeld in het tweede lid.

      4 Indien in de ingediende begroting onder de met de gesubsidieerde activiteiten samenhangende baten een
      vrijgevallen voorziening is opgenomen, blijft deze buiten beschouwing bij de berekening van het te reserveren
      bedrag, bedoeld in het tweede lid.

      5 De verplichting, bedoeld in het eerste lid, geldt niet voor de ontvanger van een ondersteuningssubsidie.

      6 De in het eerste lid bedoelde reservering wordt uitsluitend besteed aan doeleinden waarvoor de subsidie werd
      verstrekt.

      7 Het totaal van de in het eerste lid bedoelde reservering in enig jaar bedraagt ten hoogste 10% van het bedrag van
      de voor dat jaar verleende subsidie, zonder toepassing van de in [artikel 1.2.2][ref3] bedoelde vermindering.

      8 Toevoeging aan de in het eerste lid bedoelde reservering kan niet plaatsvinden als de in het eerste lid bedoelde
      reservering reeds 10% of meer van het voor dat jaar verleende subsidie betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0019161#Artikel1.2.2
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel374
      [ref3]: https://wetten.overheid.nl/BWBR0019161#Artikel1.2.2
