  - number: 2.7.5
    text: |-
      1 [Artikel 2.6.9, eerste lid][ref1], met uitzondering van onderdeel h, en het tweede, vierde tot en met negende
      lid, is van overeenkomstige toepassing op de verplichtingen die aan de verzekerde worden opgelegd bij de verlening
      van een vergoeding voor persoonlijke zorg.

      2 Onverminderd het eerste lid legt het zorgkantoor aan de verzekerde, met uitzondering van de verzekerde als
      bedoeld in [artikel 2.7.2, eerste lid, onderdeel c, onder 2°][ref2], de verplichting op de geïndiceerde zorg
      voor ten minste tien uren met de vergoeding persoonlijke zorg tot gelding te brengen.


