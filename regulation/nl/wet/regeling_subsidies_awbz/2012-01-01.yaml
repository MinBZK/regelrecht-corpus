      2 De [artikelen 1][ref2], [16d, zesde lid, onderdeel a][ref3], en [16e van het Bijdragebesluit zorg][ref4]
      en [artikel 2.6.7, eerste, tweede, vierde en vijfde lid][ref5], zijn van overeenkomstige toepassing op de
