  - number: 1.1.2
    text: |-
      1 Het College zorgverzekeringen verstrekt op grond van deze regeling subsidies voor de in [hoofdstuk 2][ref1]
      aangegeven doeleinden. De subsidies in deze regeling komen ten laste van het algemeen fonds.

      2 Het aanvragen van de subsidie en de subsidievaststelling alsmede het nemen van besluiten met betrekking tot
      subsidies geschiedt overeenkomstig de in deze regeling gestelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0019161#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0019161/2012-01-01#Artikel1.1.2
    references:
      - id: ref1
        bwb_id: BWBR0019161
        hoofdstuk: II
  - number: 1.1.3
    text: |-
      1 Subsidie wordt slechts verstrekt indien:

      a. naar het oordeel van het College zorgverzekeringen mag worden verwacht dat de met de subsidiëring beoogde
      doeleinden zullen worden bereikt;

      b. de aanvrager naar het oordeel van het College zorgverzekeringen de behoefte aan subsidie heeft aangetoond, en

      c. de aanvrager aannemelijk heeft gemaakt dat de financiële middelen met inbegrip van subsidie voldoende zullen
      zijn om de voorgenomen activiteiten uit te voeren.

      2 Het eerste lid, onderdelen b en c, zijn niet van toepassing op rechtspersonen krachtens publiekrecht ingesteld.
    url: https://wetten.overheid.nl/BWBR0019161/2012-01-01#Artikel1.1.3
  - number: 1.2.1
    text: |-
      1 Een instellingssubsidie bestaat uit een door het College zorgverzekeringen vast te stellen bedrag voor
      overeenkomstig een door het College zorgverzekeringen goedgekeurd activiteitenplan uitgevoerde activiteiten.

      2 Onverminderd de overige bepalingen van deze regeling met betrekking tot onder meer de egalisatiereserve bestaat
      een instellingssubsidie uit het verschil tussen de met de gesubsidieerde activiteiten samenhangende en met in
      achtneming van de ingevolge deze regeling in aanmerking komende werkelijke lasten, voorzover opgenomen in de door
      het College zorgverzekeringen goedgekeurde begroting, en de met de gesubsidieerde activiteiten samenhangende baten.
      De subsidie bedraagt niet meer dan het door het College zorgverzekeringen vastgestelde maximum.
    url: https://wetten.overheid.nl/BWBR0019161/2012-01-01#Artikel1.2.1
  - number: 1.2.2
    text: |-
      1 Het bedrag, bedoeld in [artikel 1.2.1][ref1] wordt verlaagd met het bedrag waarmee het maximaal toegestane bedrag
      van de in [artikel 1.8.7][ref2] bedoelde reservering wordt overschreden.

      2 Het eerste lid is niet van toepassing op een ondersteuningssubsidie.


      [ref1]: https://wetten.overheid.nl/BWBR0019161#Artikel1.2.1
      [ref2]: https://wetten.overheid.nl/BWBR0019161#Artikel1.8.7
