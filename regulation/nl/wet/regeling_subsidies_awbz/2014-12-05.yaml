        bwb_id: BWBR0008253
        artikel: 16e
  - number: 2.6.7.4
    text: |-
      Het zorgkantoor vermindert de bijdrage die de verzekerde op grond van het tweede en derde lid maximaal verschuldigd
      is met een eigen bijdrage die verschuldigd is ingevolge de [Wet maatschappelijke ondersteuning][ref1] en het
      aandeel van de kosten van maatschappelijke ondersteuning dat bij de toekenning van een financiële tegemoetkoming
      ingevolge [die wet][ref2] voor eigen rekening komt alsmede met een bijdrage die verschuldigd is op grond van
      [artikel 16d van het Bijdragebesluit zorg][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0020031
