    text: 20% van het bruto persoonsgebonden budget voor verpleging;
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.7
  - number: 2.6.7.1.c
    text: 27% van het bruto persoonsgebonden budget voor begeleiding.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.7
  - number: 2.6.7.2
    text: 'De bijdrage, bedoeld in het eerste lid, bedraagt in 2014 niet meer dan:'
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.7
