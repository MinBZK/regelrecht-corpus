    text: |-
      Indien het bruto persoonsgebonden budget voor meer vormen van zorg wordt verleend, bedraagt het bruto
      persoonsgebonden budget maximaal de som van de met behulp van het eerste dan wel het tweede lid bepaalde bedragen.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.6
  - number: 2.6.6.4
    text: |-
      Indien de verzekerde beschikt over een indicatiebesluit waaruit blijkt dat hij is aangewezen op verblijf wordt
      het bruto persoonsgebonden budget berekend door het zorgzwaartepakket met toepassing van de [bijlage 2][ref1]
      van deze regeling om te rekenen naar een of meer klassen, bedoeld in het tweede lid. Indien de verzekerde niet in
      een instelling verblijft, hoogt het zorgkantoor het bruto persoonsgebonden budget vervolgens op met € 3 332. Het
      zorgkantoor verhoogt het aldus opgehoogde persoonsgebonden budget vervolgens op met € 4 000 voor een verzekerde
      die woont in een kleinschalig wooninitiatief en ten minste een persoonsgebonden budget ontvangt voor persoonlijke
      verzorging en begeleiding individueel.


      [ref1]: https://wetten.overheid.nl/BWBR0019161
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.6
    references:
      - id: ref1
        bwb_id: BWBR0019161
  - number: 2.6.6.5
    text: |-
      Het zorgkantoor kan onder daarbij te stellen voorwaarden in het voordeel van de
      verzekerde afwijken van het derde lid indien het, met overeenkomstige toepassing van
      [artikel 1a, tweede lid, van de Regeling zorgaanspraken AWBZ][ref1], oordeelt dat de verzekerde aanspraak heeft
      op meer zorg dan waarop hij op grond van het eerste lid van dat artikel aanspraak heeft. Het zorgkantoor meldt de
      toepassing van de eerste volzin onverwijld aan het Zorginstituut volgens een door het Zorginstituut vastgesteld
      model.


      [ref1]: https://wetten.overheid.nl/BWBR0014855#Artikel1a
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.6
    references:
      - id: ref1
        bwb_id: BWBR0014855
        artikel: 1a
  - number: 2.6.6.6
    text: |-
      Indien een subsidieperiode met ingang van een andere dag dan 1 januari van een kalenderjaar aanvangt of op een
      andere dag dan 31 december eindigt, wordt het maximum bruto persoonsgebonden budget vermenigvuldigd met een breuk
      waarvan de teller bestaat uit het aantal dagen van de subsidieperiode in het desbetreffende kalenderjaar en de
      noemer uit het aantal dagen in dat kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.6
  - number: 2.6.6.7
    text: |-
      Indien toepassing van de voorgaande leden leidt tot een verlening van een bruto persoonsgebonden budget van meer
      dan € 300 per dag, beperkt het zorgkantoor de maximum verlening tot de kosten van verblijf, onder aftrek van de
      woonlasten, met een minimum van € 300 per dag.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.6
  - number: 2.6.6.8
    text: |-
      Indien het verleende bruto persoonsgebonden budget € 300 per dag of meer bedraagt dan meldt het zorgkantoor dit aan
      het Zorginstituut volgens een door het Zorginstituut vastgesteld model.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.6
  - number: 2.6.6a.1
    text: |-
      Het zorgkantoor hoogt het bruto persoonsgebonden budget op tot een garantiebedrag ter hoogte van het bruto
      persoonsgebonden budget dat was verleend voor de subsidieperiode die eindigde op 31 december 2013, indien de
      verzekerde volgens het indicatiebesluit is aangewezen op verblijf, en
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.6a
  - number: 2.6.6a.1.a
    text: |-
      het persoonsgebonden budget bij de eerste verlening op basis van een indicatiebesluit waaruit bleek dat de
      verzekerde was aangewezen op een zorgzwaartepakket, op grond van een beleidsregel van het Zorginstituut of op grond
      van [artikel 2.6.15][ref1], zoals dat artikel luidde voor 1 januari 2013, was opgehoogd tot een garantiebedrag of;


      [ref1]: https://wetten.overheid.nl/BWBR0019161#Artikel2
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.6a
    references:
      - id: ref1
        bwb_id: BWBR0019161
        artikel: '2'
        hoofdstuk: II
        paragraaf: '2.6'
  - number: 2.6.6a.1.b
    text: |-
      aan de verzekerde in 2012 een persoonsgebonden budget is verleend op basis van een indicatiebesluit waaruit bleek
      dat de verzekerde aangewezen was op verblijf en de verzekerde vanaf 30 december 2012 ononderbroken woonachtig was
      in een kleinschalig wooninitiatief.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.6a
  - number: 2.6.6a.2
    text: |-
      Een verzekerde die inwoont bij ouders, voogden of pleegouders, als bedoeld in
      [artikel 1 van de Wet op de jeugdzorg][ref1], wordt niet aangemerkt als bewoner van een kleinschalig
      wooninitiatief.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel1
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.6a
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '1'
  - number: 2.6.6a.3
    text: |-
      Het zorgkantoor hoogt het bruto persoonsgebonden budget op tot een garantiebedrag ter hoogte van 90% van het bruto
      persoonsgebonden budget dat was verleend voor de subsidieperiode die eindigde op 31 december 2013, indien
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.6a
  - number: 2.6.6a.3.a
    text: |-
      dat persoonsgebonden budget was verleend op grond van een indicatiebesluit waaruit bleek dat de verzekerde
      aangewezen was op verblijf;
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.6a
  - number: 2.6.6a.3.b
    text: de verzekerde volgens het geldende indicatiebesluit is aangewezen op verblijf, en
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.6a
  - number: 2.6.6a.3.c
    text: het eerste lid niet op de verzekerde van toepassing is.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.6a
  - number: 2.6.6a.4
    text: |-
      Indien de aanvraag betrekking heeft op minder of andere vormen van zorg als bedoeld in
      [artikel 1.1.1, onderdelen j en k][ref1], dan het persoonsgebonden budget dat in 2013 is verleend, wordt een
      garantiebedrag als bedoeld in het eerste of derde lid verminderd met het verschil tussen de budgetten waartoe die
      vormen van zorg leiden.


      [ref1]: https://wetten.overheid.nl/BWBR0019161#Artikel1
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.6a
    references:
      - id: ref1
        bwb_id: BWBR0019161
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1.1'
  - number: 2.6.6a.5
    text: |-
      Indien de aanvraag voor een persoonsgebonden budget is gebaseerd op een ander indicatiebesluit dan de verlening
      van het persoonsgebonden budget in 2013 en de verzekerde volgens het indicatiebesluit is aangewezen op een
      zorgzwaartepakket dat leidt tot een lager bruto persoonsgebonden budget dan in 2013 is verleend, wordt een
      garantiebedrag als bedoeld in het eerste of derde lid verminderd met het verschil tussen de budgetten waartoe die
      zorgzwaartepakketten leiden.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.6a
  - number: 2.6.6a.6
    text: |-
      Het eerste lid, onder a, is alleen van toepassing indien aan de verzekerde, vanaf de eerste verlening van
      een persoonsgebonden budget op basis van een indicatiebesluit waaruit bleek dat hij was aangewezen op een
      zorgzwaartepakket, in ieder opvolgende subsidieperiode een persoonsgebonden budget is verleend, al dan niet na een
      onderbreking als bedoeld in het zevende lid, onder a of b.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.6a
  - number: 2.6.6a.7
    text: |-
      Het eerste lid, onder b, en derde lid zijn alleen van toepassing indien de subsidieperiode waarvoor een
      persoonsgebonden budget wordt aangevraagd:
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.6a
  - number: 2.6.6a.7.a
    text: met een onderbreking van niet meer dan zeven kalenderdagen, aansluit op een eerdere subsidieperiode, of
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.6a
  - number: 2.6.6a.7.b
    text: |-
      aansluit op een periode waarin de verzekerde verbleef in een instelling als bedoeld in de [AWBZ][ref1] of
      [Zorgverzekeringswet][ref2] en dit verblijf aansloot op een eerdere subsidieperiode.


      [ref1]: https://wetten.overheid.nl/BWBR0002614
      [ref2]: https://wetten.overheid.nl/BWBR0018450
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.6a
    references:
      - id: ref1
        bwb_id: BWBR0002614
      - id: ref2
        bwb_id: BWBR0018450
  - number: 2.6.7.1
    text: |-
      De verzekerde van achttien jaar of ouder aan wie een persoongebonden budget is verleend is een bijdrage
      verschuldigd van:
