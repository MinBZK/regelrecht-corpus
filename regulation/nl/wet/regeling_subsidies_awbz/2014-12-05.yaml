    text: |-
      voor de ongehuwde verzekerde die de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref1], nog niet heeft bereikt € 247,68, met dien verstande
      dat indien zijn bijdrageplichtige inkomen meer bedraagt dan € 23.295 het bedrag van € 247,68 wordt verhoogd met 15%
      van het verschil tussen dat inkomen en € 23.295;


