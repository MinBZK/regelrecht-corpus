    text: |-
      Bij de uitvoering van het tweede lid gaat het zorgkantoor uit van het bijdrageplichtige inkomen, bedoeld in
      [artikel 16e, eerste lid, van het Bijdragebesluit zorg][ref1], in het kalenderjaar voorafgaande aan het peiljaar
      indien aan de verzekerde op 31 december van het voorgaande kalenderjaar een persoonsgebonden budget is verleend en
      het bijdrageplichtige inkomen, bedoeld in artikel 16e, eerste lid, van het Bijdragebesluit zorg, in het peiljaar op
      1 maart van het kalenderjaar niet bekend is bij het zorgkantoor.


      [ref1]: https://wetten.overheid.nl/BWBR0008253#Artikel16e
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.7
    references:
