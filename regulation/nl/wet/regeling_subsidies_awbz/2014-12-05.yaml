      33% toegepast.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.7
  - number: 2.6.7.6
    text: |-
      De [artikelen 16d, zesde lid, onderdeel a][ref1], en
      [16e, tweede tot en met het vijfde lid van het Bijdragebesluit zorg][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008253#Artikel16d
      [ref2]: https://wetten.overheid.nl/BWBR0008253#Artikel16e
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.7
    references:
      - id: ref1
        bwb_id: BWBR0008253
        artikel: 16d
      - id: ref2
        bwb_id: BWBR0008253
        artikel: 16e
  - number: 2.6.8.1
    text: |-
      Het netto persoonsgebonden budget bedraagt het verschil tussen het bruto persoonsgebonden budget en de eigen
      bijdrage.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.8
  - number: 2.6.8.2
    text: |-
      Indien de verzekerde onmiddellijk voorafgaande aan of aansluitend op de subsidieperiode een netto persoonsgebonden
      budget voor hetzelfde kalenderjaar werd of wordt verleend en dat budget niet volledig werd of wordt besteed, wordt
      het op grond van het eerste lid berekende netto persoonsgebonden budget verhoogd met een bedrag gelijk aan dit niet
      bestede deel.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.8
  - number: 2.6.9.1
    text: 'Bij de verlening van het netto persoonsgebonden budget worden de verzekerde de volgende verplichtingen opgelegd:'
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.9
  - number: 2.6.9.1.a
    text: |-
      de verzekerde gebruikt het persoonsgebonden budget uitsluitend voor het betalen of, indien een
      trekkingsrecht is verleend, het door de Sociale verzekeringsbank doen betalen van zorg als bedoeld in
      [artikel 1.1.1, onderdeel j of k][ref1], of van bemiddelingskosten onder de in onderdeel k opgenomen voorwaarden;


      [ref1]: https://wetten.overheid.nl/BWBR0019161#Artikel1
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.9
    references:
      - id: ref1
        bwb_id: BWBR0019161
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1.1'
  - number: 2.6.9.1.b
    text: de zorg die de verzekerde inkoopt, is kwalitatief verantwoord;
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.9
  - number: 2.6.9.1.c
    text: |-
      de verzekerde sluit een schriftelijke overeenkomst met de zorgverlener of zorgverlenende instantie waarin ten
      minste de volgende afspraken zijn opgenomen:
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.9
  - number: 2.6.9.1.c.1°
    text: |-
      indien een trekkingsrecht is verleend: de wijze waarop de zorgverlener voorziet in de behoefte aan zorg van de
      verzekerde;
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.9
  - number: 2.6.9.1.c.2°
    text: |-
      declaraties voor verleende zorg worden niet betaald indien zij niet binnen zes weken na de maand waarin de zorg is
      verleend bij de verzekerde zijn ingediend,
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.9
  - number: 2.6.9.1.c.3°
    text: |-
      een declaratie van een zorgverlener bevat een overzicht van de dagen waarop is gewerkt, het uurtarief, het aantal
      te betalen uren, het burgerservicenummer en de naam van de zorgverlener, en wordt door de zorgverlener ondertekend,
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.9
  - number: 2.6.9.1.c.4°
    text: |-
      een declaratie van een zorgverlenende instantie bevat het nummer waarmee die instantie staat ingeschreven bij
      de Kamer van Koophandel, een overzicht van de dagen waarop is gewerkt, het tarief, het aantal te betalen uren,
      dagdelen of etmalen, en de naam en het adres van de zorgverlenende instantie, en wordt namens de zorgverlenende
      instantie ondertekend;
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.9
  - number: 2.6.9.1.d
    text: |-
      de verzekerde stelt, op verzoek van het zorgkantoor, de in onderdeel c bedoelde overeenkomsten en declaraties
      alsmede zijn rekeningafschrift op papier of op een andere duurzame drager, tot vijf jaar na de datum van de
      subsidievaststelling ter beschikking van het zorgkantoor. De rekeningafschriften bevatten in ieder geval de
      perioden waarop zij betrekking hebben, de datum en het bedrag van de door de verzekerde verrichte betalingen,
      bedoeld in onderdeel a, alsmede de rekeningnummers waarop deze betalingen zijn bijgeschreven;
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.9
  - number: 2.6.9.1.e
    text: |-
      de verzekerde legt door middel van invulling en ondertekening van een daartoe door het zorgkantoor toegezonden
      formulier verantwoording af over de besteding van het verleende persoonsgebonden budget;
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.9
  - number: 2.6.9.1.f
    text: |-
      tenzij een trekkingsrecht is verleend, voegt de verzekerde bij de verantwoording over de laatste
      verantwoordingsperiode van een kalenderjaar per zorgverlener of zorgverlenende instantie een formulier waarop hij
      naam, adres en burgerservicenummer van de zorgverlener respectievelijk naam, adres en het nummer van de Kamer van
      Koophandel van de zorgverlenende instantie heeft aangetekend, alsmede het in dat kalenderjaar aan die zorgverlener
      of die zorgverlenende instantie betaalde bedrag;
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.9
  - number: 2.6.9.1.g
    text: |-
      de verzekerde brengt gedurende de subsidieperiode voor de vormen van zorg waarvoor het budget is verleend niet
      tevens een AWBZ-aanspraak op zorg tot gelding;
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.9
  - number: 2.6.9.1.h
    text: |-
      de verzekerde die blijkens het indicatiebesluit is aangewezen op verblijf, brengt gedurende de subsidieperiode zijn
      aanspraak op verblijf niet tot gelding;
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.9
  - number: 2.6.9.1.i
    text: |-
      de verzekerde draagt er zorg voor dat een zorgverlener op wie het Arbeidstijdenbesluit niet van toepassing is niet
      meer dan veertig uur in één week voor hem werkzaamheden verricht;
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.9
  - number: 2.6.9.1.j
    text: |-
      de verzekerde verricht uitsluitend girale betalingen aan de zorgverlener of, indien een trekkingsrecht is verleend,
      laat de betalingen aan de zorgverlener verrichten door de Sociale verzekeringsbank;
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.9
  - number: 2.6.9.1.k
    text: |-
      de verzekerde besteedt het persoonsgebonden budget uitsluitend aan bemiddelingkosten indien aan de verzekerde een
      persoonsgebonden budget is verleend voor een subsidieperiode die eindigde op 31 december 2011 en de organisatie
      waaraan de verzekerde bemiddelingskosten betaalt beschikt over een door het Keurmerkinstituut vastgesteld keurmerk
      voor bemiddelingsbureaus;
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.9
  - number: 2.6.9.1.l
    text: 'de verzekerde waar een trekkingsrecht aan is verleend:'
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.9
  - number: 2.6.9.1.l.1°
    text: legt de overeenkomst, bedoeld in onderdeel c, ter goedkeuring voor aan het zorgkantoor;
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.9
  - number: 2.6.9.1.l.2°
    text: |-
      stelt de overeenkomsten en declaraties, bedoeld in onderdeel c, op papier of op een andere duurzame drager
      onverwijld ter beschikking van de Sociale verzekeringsbank;
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.9
  - number: 2.6.9.1.l.3°
    text: legt de verantwoording, bedoeld in onderdeel e, door tussenkomst van de Sociale verzekeringsbank af;
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.9
  - number: 2.6.9.1.m
    text: |-
      de verzekerde, niet zijnde een bestaande budgethouder, die blijkens het indicatiebesluit is aangewezen op
      respijtzorg besteedt het persoongebonden budget niet aan een huisgenoot, partner of ouder die feitelijk
      gebruikelijke zorg op zich dient te nemen, maar daartoe niet in staat is wegens overbelasting of dreigende
      overbelasting;
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.9
  - number: 2.6.9.1.n
    text: |-
      de verzekerde besteedt het persoonsgebonden budget niet aan kortdurend verblijf buiten de Europese Unie, tenzij het
      een bestaande budgethouder betreft;
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.9
  - number: 2.6.9.1.o
    text: |-
      de verzekerde deelt het zorgkantoor op diens verzoek of onverwijld uit eigen beweging alle feiten en omstandigheden
      mee waarvan hem redelijkerwijs duidelijk moet zijn dat zij van invloed kunnen zijn op de verstrekking van het
      persoonsgebonden budget.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.9
  - number: 2.6.9.2
    text: |-
      In afwijking van het eerste lid, onderdeel a, mag het budget slechts besteed worden aan kosten van vervoer voor het
      ontvangen van begeleiding groep indien een budget verleend is voor begeleiding groep inclusief vervoer of indien de
      verzekerde blijkens het indicatiebesluit is aangewezen op een zorgzwaartepakket VV.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.9
  - number: 2.6.9.3
    text: |-
      In afwijking van het eerste lid, onderdelen a en e, mag de verzekerde in een kalenderjaar maximaal 1,5% van het
      voor dat jaar beschikbare netto persoonsgebonden budget, maar ten minste € 250 en ten hoogste € 1 250, gebruiken
      voor andere betalingen dan betalingen bedoeld in onderdeel a, en geldt de verantwoordingsplicht, bedoeld in
      onderdeel e, niet voor dit deel van het budget.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.9
  - number: 2.6.9.4
    text: |-
      Indien een subsidieperiode met ingang van een andere dag dan 1 januari van een kalenderjaar aanvangt of op
      een andere dag dan 31 december eindigt, worden de bedragen, genoemd in het derde lid, voor dat kalenderjaar
      vermenigvuldigd met een breuk waarvan de teller bestaat uit het aantal dagen van de subsidieperiode in het
      desbetreffende kalenderjaar en de noemer uit het aantal dagen in dat kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.9
  - number: 2.6.9.5
    text: Onderdeel f van het eerste lid is niet van toepassing indien de verzekerde verplicht is tot loonheffing.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.9
  - number: 2.6.9.6
    text: |-
      Voor de toepassing van het eerste lid, onderdeel g, worden begeleiding individueel en begeleiding groep aangemerkt
      als onderscheiden vormen van zorg.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.9
  - number: 2.6.9.7
    text: Het Zorginstituut stelt standaardmodellen op voor de formulieren, bedoeld in het eerste lid, onderdelen e en f.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.9
  - number: 2.6.9.8
    text: 'De verantwoording, bedoeld in het eerste lid, onderdeel e, wordt aan het zorgkantoor afgelegd binnen zes weken na:'
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.9
  - number: 2.6.9.8.a
    text: afloop van de subsidieperiode;
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.9
  - number: 2.6.9.8.b
    text: |-
      het einde van de eerste helft van een kalenderjaar, indien het tot een jaarbedrag herleide netto persoonsgebonden
      budget € 5.000 of meer bedraagt en geen trekkingsrecht is verleend.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.9
  - number: 2.6.9.9
    text: |-
      In afwijking van het eerste lid, onderdeel a, mag de verzekerde die blijkens het indicatiebesluit is aangewezen op
      verblijf, het persoonsgebonden budget ook gebruiken voor betaling van huishoudelijke hulp.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.9
  - number: 2.6.9a.1
    text: |-
      De verzekerde kan het netto persoonsgebonden budget voor ten hoogste dertien weken per kalenderjaar
      tijdens verblijf buiten het Europese deel van Nederland gebruiken voor betaling van zorg als bedoeld in
      [artikel 1.1.1, onderdelen j en k][ref1], indien die zorg is verkregen als voortzetting van reeds binnen het
      Europese deel van Nederland aangevangen zorg.


      [ref1]: https://wetten.overheid.nl/BWBR0019161#Artikel1
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.9a
    references:
      - id: ref1
        bwb_id: BWBR0019161
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1.1'
  - number: 2.6.9a.2
    text: |-
      In afwijking van het eerste lid kan de verzekerde voor ten hoogste een jaar tijdens verblijf buiten het Europese
      deel van Nederland een netto persoonsgebonden budget gebruiken voor betaling van voortzetting van palliatief
      terminale zorg.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.9a
  - number: 2.6.9a.3
    text: |-
      Indien de verzekerde langer dan zes weken aaneengesloten buiten het Europese deel van Nederland verblijft en daar
      zorgverleners contracteert die niet vallen onder de Nederlandse fiscale en sociale zekerheidswetgeving, wordt het
      bruto persoonsgebonden budget berekend overeenkomstig de volgende formule: waarbij wordt verstaan onder: A: het
      aantal weken dat de verzekerde binnen het Europese deel van Nederland verblijft; B: het getal 52; C: het bruto
      persoonsgebonden budget waarvoor de verzekerde op grond van de vorige leden in aanmerking komt; D: het aantal weken
      dat de verzekerde buiten het Europese deel van Nederland verblijft; E: het voor het desbetreffende land door het
      Zorginstituut vastgestelde aanvaardbaarheidspercentage.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.9a
  - number: 2.6.9b
    text: |-
      Indien een trekkingsrecht is verleend, verricht de Sociale verzekeringsbank ten behoeve van de verzekerde
      uitsluitend betalingen uit het persoonsgebonden budget:
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.9b
  - number: 2.6.9b.a
    text: |-
      overeenkomstig de door de verzekerde met de zorgverlener gesloten, geldige overeenkomst die is goedgekeurd door
      het zorgkantoor;
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.9b
  - number: 2.6.9b.b
    text: tot afdracht van eventuele loonheffing;
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.9b
  - number: 2.6.9b.c
    text: |-
      ter verkrijging door de verzekerde van gelden voor het verrichten van betalingen als bedoeld in
      [artikel 2.6.9, derde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0019161#Artikel2
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.9b
    references:
      - id: ref1
        bwb_id: BWBR0019161
        artikel: '2'
        hoofdstuk: II
        paragraaf: '2.6'
  - number: 2.6.9b.d
    text: |-
      die ook overigens in overeenstemming zijn met deze regeling en met de beschikking tot verlening van het
      trekkingsrecht.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.9b
  - number: 2.6.10.1
    text: 'Het zorgkantoor bevoorschot de verzekerde het verleende netto persoonsgebonden budget:'
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.10
  - number: 2.6.10.1.a
    text: per kwartaal, indien het tot een jaarbudget herleide bedrag € 15.000 of minder bedraagt;
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.10
  - number: 2.6.10.1.b
    text: per maand, indien het tot een jaarbudget herleide bedrag meer dan € 15.000 bedraagt.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.10
  - number: 2.6.10.2
    text: |-
      Indien een subsidieperiode met ingang van een andere dag dan 1 januari van een kalenderjaar aanvangt of op een
      andere dag dan 31 december eindigt, wordt voor de toepassing van het eerste lid het voor dat jaar beschikbare
      budget tot een jaarbedrag herleid door het desbetreffende budget te vermenigvuldigen met een breuk waarvan de
      teller gelijk is aan het aantal dagen in het kalenderjaar en de noemer gelijk is aan het aantal dagen van de
      subsidieperiode in het kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.10
  - number: 2.6.10.3
    text: Het zorgkantoor betaalt het voorschot uit op de bankrekening van de verzekerde.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.10
  - number: 2.6.10.4
    text: |-
      In afwijking van het derde lid betaalt het zorgkantoor het voorschot van de minderjarige verzekerde uit op de
      bankrekening van diens ouders of voogd, tenzij de ouder of voogd verzoekt om uitbetaling op de bankrekening van
      de minderjarige.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.10
  - number: 2.6.10.5
    text: |-
      In afwijking van het derde lid betaalt het zorgkantoor het voorschot van de verzekerde die onder curatele staat als
      bedoeld in [artikel 1:378 en volgende van het Burgerlijk Wetboek][ref1] of onder bewindvoering staat als bedoeld in
      [artikel 1:431 en volgende van die wet][ref2] uit op de door de curator of bewindvoerder ten name van de verzekerde
      geopende bankrekening.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel378
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel431
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.10
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '378'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '431'
  - number: 2.6.10.6
    text: |-
      In afwijking van het derde lid betaalt het zorgkantoor, indien het zorgkantoor op grond van
      [artikel 2.6.3b, derde lid][ref1], het persoonsgebonden budget heeft verleend aan een organisatie die is belast
      met de ondertoezichtstelling op de verzekerde, het voorschot uit op de bankrekening van die organisatie.


      [ref1]: https://wetten.overheid.nl/BWBR0019161#Artikel2
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.10
    references:
      - id: ref1
        bwb_id: BWBR0019161
        artikel: '2'
        hoofdstuk: II
        paragraaf: '2.6'
  - number: 2.6.10.7
    text: |-
      In afwijking van het derde lid betaalt het zorgkantoor, indien het zorgkantoor op grond
      van [artikel 2.6.3b, derde lid][ref1], het persoonsgebonden budget heeft verleend aan een
      organisatie die een reclasseringsmaatregel uitoefent krachtens een uitspraak van de rechter of
      het Openbaar Ministerie op grond van [artikel 14d][ref2], [artikel 15b, tweede lid][ref3], of
      [Boek I, Titel VIII A Bijzondere bepalingen voor jeugdige personen van het Wetboek van Strafrecht][ref4], het
      voorschot uit op de bankrekening van die organisatie.


      [ref1]: https://wetten.overheid.nl/BWBR0019161#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel14d
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel15b
      [ref4]: https://wetten.overheid.nl/BWBR0001854
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.10
    references:
      - id: ref1
        bwb_id: BWBR0019161
        artikel: '2'
        hoofdstuk: II
        paragraaf: '2.6'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: 14d
      - id: ref3
        bwb_id: BWBR0001854
        artikel: 15b
      - id: ref4
        bwb_id: BWBR0001854
  - number: 2.6.10.8
    text: |-
      In afwijking van het derde lid betaalt het zorgkantoor het voorschot op verzoek van de verzekerde die verblijft
      in een klooster, uit op de bankrekening van dat klooster, indien de verzekerde op grond van kerkrechtelijke
      voorschriften niet over een eigen bankrekening mag beschikken.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.10
  - number: 2.6.10.9
    text: |-
      Indien een trekkingsrecht is verleend, wordt het voorschot in afwijking van het derde lid betaald aan de Sociale
      verzekeringsbank.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.10
  - number: 2.6.11
    text: 'De verleningsbeschikking van het zorgkantoor aan de verzekerde bevat ten minste de volgende gegevens:'
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.11
  - number: 2.6.11.a
    text: de subsidieperiode;
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.11
  - number: 2.6.11.b
    text: het verleende bruto persoonsgebonden budget en de wijze waarop dit budget is berekend;
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.11
  - number: 2.6.11.c
    text: de hoogte van de eigen bijdrage en de wijze waarop deze bijdrage is berekend;
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.11
  - number: 2.6.11.d
    text: het netto persoonsgebonden budget en de wijze waarop dit budget is berekend;
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.11
  - number: 2.6.11.e
    text: de wijze waarop het netto persoonsgebonden budget wordt bevoorschot;
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.11
  - number: 2.6.11.f
    text: de verplichtingen van de verzekerde;
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.11
  - number: 2.6.11.g
    text: de hoogte van het verantwoordingsvrije bedrag, en de wijze waarop dat bedrag is berekend;
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.11
  - number: 2.6.11.h
    text: |-
      indien van toepassing: het bedrag, bedoeld in [artikel 2.6.8, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0019161#Artikel2
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.11
    references:
      - id: ref1
        bwb_id: BWBR0019161
        artikel: '2'
        hoofdstuk: II
        paragraaf: '2.6'
  - number: 2.6.11.i
    text: |-
      de mededeling dat de in [artikel 2.6.9, eerste lid, onderdeel f][ref1], bedoelde formulieren door het zorgkantoor
      worden doorgezonden aan de belastingdienst.


      [ref1]: https://wetten.overheid.nl/BWBR0019161#Artikel2
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.11
    references:
      - id: ref1
        bwb_id: BWBR0019161
        artikel: '2'
        hoofdstuk: II
        paragraaf: '2.6'
  - number: 2.6.12.1
    text: 'Het zorgkantoor wijzigt de verleningsbeschikking of trekt deze in:'
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.12
  - number: 2.6.12.1.a
    text: met ingang van de dag gelegen na de dag waarop de verzekerde overlijdt;
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.12
  - number: 2.6.12.1.b
    text: |-
      met ingang van de dag waarop de verzekerde langer dan twee maanden verblijft in een instelling als bedoeld in de
      [AWBZ][ref1] of de [Zorgverzekeringswet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0002614
      [ref2]: https://wetten.overheid.nl/BWBR0018450
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.12
    references:
      - id: ref1
        bwb_id: BWBR0002614
      - id: ref2
        bwb_id: BWBR0018450
  - number: 2.6.12.1.c
    text: |-
      met ingang van de dag vanaf welke de verzekerde schriftelijk heeft aangegeven geen prijs meer te stellen op het
      budget;
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.12
  - number: 2.6.12.1.d
    text: |-
      met ingang van de dag waarop de verzekerde op grond van een wettelijk voorschrift, anders dan de AWBZ, recht heeft
      op de geïndiceerde zorg, of op een gehele of gedeeltelijke vergoeding van de kosten daarvan;
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.12
  - number: 2.6.12.1.e
    text: |-
      met ingang van de dag waarop het zorgkantoor, op advies van een instelling voor maatschappelijk werk of de
      Raad voor de kinderbescherming, van oordeel is dat een ten behoeve van een minderjarige verzekerde aangevraagd
      budget in zodanige mate niet voor de inkoop van zorg ten behoeve van die verzekerde zal worden gebruikt, dat dit
      mishandeling, verwaarlozing of ernstige schade voor de opvoeding of ontwikkeling van die verzekerde tot gevolg
      zal hebben;
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.12
  - number: 2.6.12.1.f
    text: |-
      met ingang van de dag waarop het indicatiebesluit ten nadele van de verzekerde wordt herzien als gevolg van bezwaar
      of beroep.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.12
  - number: 2.6.12.2
    text: 'De verleningsbeschikking kan worden ingetrokken of gewijzigd:'
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.12
  - number: 2.6.12.2.a
    text: |-
      met ingang van de dag waarop de verzekerde de bij of krachtens [artikel 2.6.9][ref1] opgelegde overige
      verplichtingen niet nakomt;


      [ref1]: https://wetten.overheid.nl/BWBR0019161#Artikel2
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.12
    references:
      - id: ref1
        bwb_id: BWBR0019161
        artikel: '2'
        hoofdstuk: II
        paragraaf: '2.6'
  - number: 2.6.12.2.b
    text: |-
      met ingang van de dag waarop de verzekerde, of, indien de verzekerde jonger is dan achttien jaar, één van diens
      ouders of voogden, surseance van betaling heeft aangevraagd of failliet is verklaard;
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.12
  - number: 2.6.12.2.c
    text: |-
      met ingang van de dag waarop ten aanzien van de verzekerde of, indien de verzekerde jonger is dan achttien jaar,
      ten aanzien van één van diens ouders of voogden, de schuldsaneringsregeling natuurlijke personen van toepassing is
      verklaard, dan wel een verzoek daartoe bij de rechtbank is ingediend;
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.12
  - number: 2.6.12.2.d
    text: met ingang van de dag waarop de verzekerde blijkens de basisregistratie personen niet beschikt over een woonadres.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.12
  - number: 2.6.13.1
    text: |-
      Bij de verantwoording over de eerste helft van het kalenderjaar als bedoeld in
      [artikel 2.6.9, achtste lid, onderdeel b][ref1], besluit het zorgkantoor binnen zes weken na ontvangst van de
      desbetreffende verantwoording of het voorschot is gebruikt voor betalingen als bedoeld in het eerste lid, onderdeel
      a, van laatstgenoemd artikel. Het zorgkantoor kan in dat besluit het voorbehoud maken dat het opvragen van de in
      artikel 2.6.9, eerste lid, onderdeel d, bedoelde documenten tot een ander oordeel kan leiden.


      [ref1]: https://wetten.overheid.nl/BWBR0019161#Artikel2
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.13
    references:
      - id: ref1
        bwb_id: BWBR0019161
        artikel: '2'
        hoofdstuk: II
        paragraaf: '2.6'
  - number: 2.6.13.2
    text: Na afloop van iedere subsidieperiode wordt de subsidie voor de desbetreffende subsidieperiode vastgesteld.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.13
  - number: 2.6.13.3
    text: |-
      Een bij het zorgkantoor ingediend verantwoordingsformulier over de laatste verantwoordingsperiode zoals bedoeld in
      [artikel 2.6.9, achtste lid][ref1], dient als aanvraag tot subsidievaststelling.


      [ref1]: https://wetten.overheid.nl/BWBR0019161#Artikel2
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.13
    references:
      - id: ref1
        bwb_id: BWBR0019161
        artikel: '2'
        hoofdstuk: II
        paragraaf: '2.6'
  - number: 2.6.13.4
    text: |-
      Het zorgkantoor stelt het netto persoonsgebonden budget binnen zes weken na de aanvraag tot subsidievaststelling
      vast.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.13
  - number: 2.6.13.5
    text: 'Het persoonsgebonden budget wordt vastgesteld op de som van:'
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.13
  - number: 2.6.13.5.a
    text: |-
      1,5% van het voor het kalenderjaar beschikbare netto persoonsgebonden budget, maar ten minste op € 250 en ten
      hoogste op € 1250, en
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.13
  - number: 2.6.13.5.b
    text: 'het restant van het voor het kalenderjaar beschikbare netto persoonsgebonden budget:'
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.13
  - number: 2.6.13.5.b.1°
    text: |-
      voor zover er betalingen mee zijn verricht met inachtneming van [artikel 2.6.9][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0019161#Artikel2
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.13
    references:
      - id: ref1
        bwb_id: BWBR0019161
        artikel: '2'
        hoofdstuk: II
        paragraaf: '2.6'
  - number: 2.6.13.5.b.2°
    text: |-
      voor zover deze betalingen betrekking hebben op kosten die niet hoger zijn dan: - hetzij € 63 per uur of € 58 per
      dagdeel, hetzij een door de Nederlandse Zorgautoriteit op grond van de [Wet marktordening gezondheidszorg][ref1]
      voor de desbetreffende zorg vastgesteld hoger tarief;
        - voor zover het bemiddelingskosten betreft, € 250 per jaar indien het verleende bruto persoonsgebonden budget
      op jaarbasis € 25.000 of minder bedraagt en € 500 per jaar indien het verleende bruto persoonsgebonden budget op
      jaarbasis meer dan € 25.000 bedraagt, en;


      [ref1]: https://wetten.overheid.nl/BWBR0020078
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.13
    references:
      - id: ref1
        bwb_id: BWBR0020078
  - number: 2.6.13.5.b.3°
    text: |-
      voor zover het aantal door de zorgverlener voor de verzekerde gewerkte uren niet afwijkt van het
      [Arbeidstijdenbesluit][ref1] dan wel [artikel 2.6.9, eerste lid, onderdeel i][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007687
      [ref2]: https://wetten.overheid.nl/BWBR0019161#Artikel2
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.13
    references:
      - id: ref1
        bwb_id: BWBR0007687
      - id: ref2
        bwb_id: BWBR0019161
        artikel: '2'
        hoofdstuk: II
        paragraaf: '2.6'
  - number: 2.6.13.6
    text: |-
      In afwijking van het vijfde lid, onderdeel b, subonderdeel 2°, is een tarief van ten hoogste € 20 per uur, € 20
      per dagdeel of, indien het kortdurend verblijf betreft, € 30 per etmaal van toepassing, tenzij het een bestaande
      budgethouder betreft of de verzekerde kan aantonen dat de zorg is verleend door:
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.13
  - number: 2.6.13.6.1°
    text: |-
      een onderneming als bedoeld in [artikel 5, onderdelen a, c, d of e, van de Handelsregisterwet 2007][ref1] waarvan
      de activiteiten blijkens de inschrijving in het handelsregister, bedoeld in [artikel 2 van die wet][ref2], geheel
      of gedeeltelijk bestaan uit het verlenen van zorg als bedoeld in [artikel 1.1.1, onderdeel j of k][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0021777#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0021777#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0019161#Artikel1
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.13
    references:
      - id: ref1
        bwb_id: BWBR0021777
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0021777
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0019161
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1.1'
  - number: 2.6.13.6.2°
    text: |-
      een onderneming als bedoeld in [artikel 5, onderdeel b, van de Handelsregisterwet 2007][ref1] waarvan de
      activiteiten blijkens de inschrijving in het handelsregister, bedoeld in [artikel 2 van die wet][ref2], geheel
      of gedeeltelijk bestaan uit het verlenen van zorg als bedoeld in [artikel 1.1.1, onderdeel j of k][ref3],
      en die toebehoort aan een zelfstandige zonder personeel waaraan een geldige beschikking als bedoeld in
      [artikel 3.156 van de Wet inkomstenbelasting 2001][ref4] is afgegeven;


      [ref1]: https://wetten.overheid.nl/BWBR0021777#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0021777#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0019161#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.13
    references:
      - id: ref1
        bwb_id: BWBR0021777
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0021777
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0019161
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1.1'
      - id: ref4
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 2.6.13.6.3°
    text: |-
      een persoon die is ingeschreven in het register, bedoeld in
      [artikel 3 van de Wet op de beroepen in de individuele gezondheidszorg][ref1], voor het uitoefenen van een beroep
      voor het verlenen van zorg als bedoeld in [artikel 1.1.1, onderdeel j of k][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0019161#Artikel1
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.13
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0019161
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1.1'
  - number: 2.6.13.7
    text: |-
      Het zesde lid, onderdeel b, subonderdeel 2o en 3o, is niet van toepassing indien de zorgverlener een bloed- of
      aanverwante in de eerste of tweede graad is van de verzekerde.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.13
  - number: 2.6.13.8
    text: |-
      Indien de verzekerde geen betalingen heeft gedaan als bedoeld in [artikel 2.6.9, eerste lid, onderdeel a][ref1],
      dan wordt de subsidie, in afwijking van het vijfde lid, vastgesteld op nihil.


      [ref1]: https://wetten.overheid.nl/BWBR0019161#Artikel2
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.13
    references:
      - id: ref1
        bwb_id: BWBR0019161
        artikel: '2'
        hoofdstuk: II
        paragraaf: '2.6'
  - number: 2.6.13.9
    text: |-
      Indien een subsidieperiode met ingang van een andere dag dan 1 januari van een kalenderjaar aanvangt of op
      een andere dag dan 31 december eindigt, worden de bedragen, genoemd in het vijfde lid, voor dat kalenderjaar
      vermenigvuldigd met een breuk waarvan de teller bestaat uit het aantal dagen van de subsidieperiode in het
      desbetreffende kalenderjaar en de noemer uit het aantal dagen in dat kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.13
  - number: 2.6.14.1
    text: |-
      Het zorgkantoor voert haar controle- en incassowerkzaamheden uit op basis van door het Zorginstituut op te stellen
      protocollen.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.14
  - number: 2.6.14.2
    text: Het Zorginstituut bepaalt welke gegevens de zorgkantoren bij de uitvoering van deze paragraaf registreren.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.14
  - number: 2.6.14.3
    text: Het zorgkantoor bewaart de in het tweede lid bedoelde gegevens gedurende ten minste vijf jaar.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.14
  - number: 2.6.15.1
    text: |-
      De Sociale verzekeringsbank heeft tot taak voorbereidingen te treffen voor de goede uitvoering van de wettelijke
      voorschriften waarvan is voorzien dat deze op 1 januari 2015 van toepassing zijn op het met medewerking van de
      Sociale verzekeringsbank verstrekken van persoonsgebonden budgetten voor het verkrijgen van langdurige zorg.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.15
  - number: 2.6.15.2
    text: |-
      Voor de goede uitvoering van de wettelijke voorschriften waarvan is voorzien dat deze op 1 januari 2015 van
      toepassing zijn op het persoonsgebonden budget, kunnen het zorgkantoor en de Sociale verzekeringsbank een
      schriftelijke overeenkomst van de verzekerde met de zorgverlener of zorgverlenende instantie goedkeuren.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.15
  - number: 2.6.15.3
    text: 'Door het zorgkantoor kan de goedkeuring slechts worden gegeven, indien:'
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.15
  - number: 2.6.15.3.a
    text: 'de overeenkomst ten minste de volgende elementen bevat:'
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.15
  - number: 2.6.15.3.a.1°
    text: de wijze waarop de zorgverlener voorziet in de behoefte aan zorg van de verzekerde;
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.15
  - number: 2.6.15.3.a.2°
    text: |-
      het beding dat declaraties voor verleende zorg niet worden betaald indien zij niet binnen zes weken na de maand
      waarin de zorg is verleend bij de verzekerde zijn ingediend,
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.15
  - number: 2.6.15.3.a.3°
    text: |-
      de verplichting dat een declaratie van een zorgverlener een overzicht bevat van de dagen waarop is gewerkt,
      het uurtarief, het aantal te betalen uren, het burgerservicenummer en de naam van de zorgverlener, en door de
      zorgverlener wordt ondertekend,
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.15
  - number: 2.6.15.3.a.4°
    text: |-
      de verplichting dat een declaratie van een zorgverlenende instantie het nummer bevat waarmee die instantie staat
      ingeschreven bij de Kamer van Koophandel, een overzicht van de dagen waarop is gewerkt, het tarief, het aantal te
      betalen uren, dagdelen of etmalen, en de naam en het adres van de zorgverlenende instantie, en dat het namens de
      zorgverlenende instantie wordt ondertekend, en
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.15
  - number: 2.6.15.3.b
    text: |-
      uit de omschrijving van de wijze waarop de zorgverlener voorziet in de behoefte aan zorg van de verzekerde, blijkt
      dat de overeenkomst strekt tot de inkoop van persoonlijke verzorging, verpleging, begeleiding, huishoudelijke hulp
      en vervoer naar een plaats waar de verzekerde gedurende een dagdeel begeleiding of behandeling ontvangt, of tot
      inkoop van kortdurend verblijf bij een instelling.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.15
  - number: 2.6.15.4
    text: |-
      Door de Sociale verzekeringsbank kan de goedkeuring, bedoeld in het tweede lid, slechts worden onthouden wegens
      strijd met het recht of het belang van een goede uitvoering van het persoonsgebonden budget door de Sociale
      verzekeringsbank.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.15
  - number: 2.11.1.1
    text: |-
      In de paragraaf wordt verstaan onder:

              a
              zwangerschapsafbreking:

                behandeling, gericht op het afbreken van zwangerschap, met inbegrip van de daaraan verbonden consulten
      en nazorg;



              b
              eerste trimesterbehandeling:

                zwangerschapsafbreking binnen een periode van 12 weken amenorroe;



              c
              tweede trimesterbehandeling:

                zwangerschapsafbreking na een periode van 12 weken amenorroe.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.11.1
  - number: 2.11.1.2
    text: Voor de toepassing van deze regeling wordt onder zwangerschapsafbreking tevens verstaan overtijdbehandeling.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.11.1
  - number: 2.11.2.1
    text: |-
      Het Zorginstituut kan aan de instelling die een abortuskliniek als bedoeld in
      [artikel 1 van de Wet afbreking zwangerschap][ref1] beheert een instellingssubsidie verlenen voor het verrichten
      van zwangerschapsafbrekingen.


      [ref1]: https://wetten.overheid.nl/BWBR0003396#Artikel1
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.11.2
    references:
      - id: ref1
        bwb_id: BWBR0003396
        artikel: '1'
  - number: 2.11.2.2
    text: |-
      De instellingssubsidie wordt slechts verstrekt ten behoeve van een abortuskliniek met een vergunning als bedoeld in
      [artikel 2 van de Wet afbreking zwangerschap][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003396#Artikel2
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.11.2
    references:
      - id: ref1
        bwb_id: BWBR0003396
        artikel: '2'
  - number: 2.11.2.3
    text: |-
      Zwangerschapsafbrekingen komen slechts voor subsidie in aanmerking indien deze worden verleend aan personen die
      overeenkomstig de [Algemene Wet Bijzondere Ziektekosten][ref1] zijn verzekerd.


      [ref1]: https://wetten.overheid.nl/BWBR0002614
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.11.2
    references:
      - id: ref1
        bwb_id: BWBR0002614
  - number: 2.11.2.4
    text: 'Zwangerschapsafbrekingen komen voorts slechts voor subsidie in aanmerking indien deze worden verricht:'
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.11.2
  - number: 2.11.2.4.a
    text: onder verantwoordelijkheid van de subsidieontvanger,
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.11.2
  - number: 2.11.2.4.b
    text: met personeel in dienst van de subsidieontvanger en
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.11.2
  - number: 2.11.2.4.c
    text: in de abortuskliniek van de subsidieontvanger ten behoeve waarvan de instellingssubsidie wordt verstrekt.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.11.2
  - number: 2.11.3
    text: |-
      De subsidieontvanger draagt er zorg voor dat geen betalingen van verzekerden worden gevraagd voor de gesubsidieerde
      activiteiten.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.11.3
  - number: 2.11.4
    text: |-
      In afwijking van [paragraaf 1.2][ref1] bestaat de subsidie uit:


      [ref1]: https://wetten.overheid.nl/BWBR0019161#HoofdstukI
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.11.4
    references:
      - id: ref1
        bwb_id: BWBR0019161
        hoofdstuk: I
        paragraaf: '1.2'
  - number: 2.11.4.a
    text: € 96,59 per consult waarna de zwangerschapsafbreking is gestaakt;
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.11.4
  - number: 2.11.4.b
    text: € 434,34 per eerste trimesterbehandeling;
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.11.4
  - number: 2.11.4.c
    text: € 549,46 per eerste trimesterbehandeling met diepe sedatie of algehele anesthesie;
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.11.4
  - number: 2.11.4.d
    text: € 776,62 per eerste trimesterbehandeling met prostaglandine;
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.11.4
  - number: 2.11.4.e
    text: € 891,74 per eerste trimesterbehandeling met zowel diepe sedatie of algehele anesthesie, als prostaglandine;
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.11.4
  - number: 2.11.4.f
    text: € 652,96 per tweede trimesterbehandeling;
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.11.4
  - number: 2.11.4.g
    text: € 768,08 per tweede trimesterbehandeling met diepe sedatie of algehele anesthesie;
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.11.4
  - number: 2.11.4.h
    text: € 995,24 per tweede trimesterbehandeling met prostaglandine;
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.11.4
  - number: 2.11.4.i
    text: € 1.110,36 per tweede trimesterbehandeling met zowel diepe sedatie of algehele anesthesie, als prostaglandine.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.11.4
  - number: 2.11.5.1
    text: |-
      De aanvraag tot verlening van de instellingssubsidie gaat vergezeld van een overzicht van het aantal te verrichten
      consulten en behandelingen, bedoeld in [artikel 2.11.4][ref1], waarvoor de instellingssubsidie wordt aangevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0019161#Artikel2
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.11.5
    references:
      - id: ref1
        bwb_id: BWBR0019161
        artikel: '2'
        hoofdstuk: II
        paragraaf: '2.11'
  - number: 2.11.5.2
    text: |-
      In afwijking van [artikel 1.5.1, eerste lid][ref1], wordt bij de aanvraag geen begroting verlangd.


      [ref1]: https://wetten.overheid.nl/BWBR0019161#Artikel1
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.11.5
    references:
      - id: ref1
        bwb_id: BWBR0019161
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1.5'
  - number: 2.11.5a
    text: 'Het Zorginstituut bepaalt bij het besluit tot verlening van de instellingssubsidie:'
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.11.5a
  - number: 2.11.5a.a
    text: |-
      voor welke consulten en behandelingen, bedoeld in [artikel 2.11.4][ref1], de subsidie wordt verleend,


      [ref1]: https://wetten.overheid.nl/BWBR0019161#Artikel2
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.11.5a
    references:
      - id: ref1
        bwb_id: BWBR0019161
        artikel: '2'
        hoofdstuk: II
        paragraaf: '2.11'
  - number: 2.11.5a.b
    text: |-
      het aantal consulten en behandelingen, bedoeld in [artikel 2.11.4][ref1], waarvoor subsidie wordt verleend,


      [ref1]: https://wetten.overheid.nl/BWBR0019161#Artikel2
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.11.5a
    references:
      - id: ref1
        bwb_id: BWBR0019161
        artikel: '2'
        hoofdstuk: II
        paragraaf: '2.11'
  - number: 2.11.5a.c
    text: |-
      op welke wijze de subsidieontvanger kan aantonen dat de consulten en behandelingen, bedoeld in
      [artikel 2.11.4][ref1], waarvoor de subsidie is verleend, zijn verricht en


      [ref1]: https://wetten.overheid.nl/BWBR0019161#Artikel2
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.11.5a
    references:
      - id: ref1
        bwb_id: BWBR0019161
        artikel: '2'
        hoofdstuk: II
        paragraaf: '2.11'
  - number: 2.11.5a.d
    text: |-
      op welke wijze de subsidieontvanger kan aantonen dat voldaan is aan de verplichtingen die verbonden zijn aan de
      verleende subsidie.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.11.5a
  - number: 2.11.7
    text: |-
      [Artikel 1.8.7][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0019161#Artikel1
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.11.7
    references:
      - id: ref1
        bwb_id: BWBR0019161
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1.8'
  - number: 2.11.7a.1
    text: |-
      De subsidieontvanger overlegt uiterlijk 1 augustus een overzicht van het aantal consulten en behandelingen, bedoeld
      in [artikel 2.11.4][ref1], die zijn verricht in de eerste zes maanden van het jaar waarvoor de instellingssubsidie
      is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0019161#Artikel2
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.11.7a
    references:
      - id: ref1
        bwb_id: BWBR0019161
        artikel: '2'
        hoofdstuk: II
        paragraaf: '2.11'
  - number: 2.11.7a.2
    text: |-
      Het overzicht wordt ondertekend door een persoon die bevoegd is of personen die gezamenlijk bevoegd zijn de
      subsidieontvanger te vertegenwoordigen.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.11.7a
  - number: 2.11.7b.1
    text: |-
      De aanvraag tot vaststelling van de instellingssubsidie gaat vergezeld van een overzicht van het aantal consulten
      en behandelingen, bedoeld in [artikel 2.11.4][ref1], die zijn verricht in het jaar waarvoor de instellingssubsidie
      is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0019161#Artikel2
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.11.7b
    references:
      - id: ref1
        bwb_id: BWBR0019161
        artikel: '2'
        hoofdstuk: II
        paragraaf: '2.11'
  - number: 2.11.7b.2
    text: |-
      Het overzicht is voorzien van een schriftelijke toelichting op eventuele verschillen met het aantal consulten en
      behandelingen waarvoor de instellingssubsidie is verleend.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.11.7b
  - number: 2.11.7b.3
    text: 'De aanvraag tot vaststelling van de instellingssubsidie gaat voorts vergezeld van:'
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.11.7b
  - number: 2.11.7b.3.a
    text: een assurancerapport van een accountant inzake het overzicht, bedoeld in het eerste lid;
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.11.7b
  - number: 2.11.7b.3.b
    text: |-
      een rapport van feitelijke bevindingen van een accountant omtrent de naleving van de aan de subsidie verbonden
      verplichtingen door de subsidieontvanger.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.11.7b
  - number: 2.11.7b.4
    text: |-
      In afwijking van [artikel 1.9.1, tweede lid][ref1], wordt bij de aanvraag geen subsidiedeclaratie verlangd.


      [ref1]: https://wetten.overheid.nl/BWBR0019161#Artikel1
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.11.7b
    references:
      - id: ref1
        bwb_id: BWBR0019161
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1.9'
  - number: 2.11.7c
    text: |-
      De instellingssubsidie wordt vastgesteld op de bedragen per consult en behandeling, bedoeld in
      [artikel 2.11.4][ref1], voor het aantal consulten en behandelingen die zijn verricht in het jaar waarvoor de
      instellingssubsidie is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0019161#Artikel2
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.11.7c
    references:
      - id: ref1
        bwb_id: BWBR0019161
        artikel: '2'
        hoofdstuk: II
        paragraaf: '2.11'
  - number: 2.11.10
    text: |-
      Het Zorginstituut is bevoegd alle informatie met betrekking tot de subsidiëring ter beschikking te stellen aan de
      Nederlandse Zorgautoriteit.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.11.10
  - number: 2.11.14.1
    text: |-
      Indien de instelling ten behoeve van een abortuskliniek voor het gehele voorafgaande jaar een instellingssubsidie
      heeft ontvangen die geheel of gedeeltelijk is berekend op een wijze overeenkomstig deze regeling zoals deze
      luidde op 31 december 2013 en de abortuskliniek op dezelfde locatie is gevestigd als op 31 december 2013, kan de
      instelling bij de aanvraag tot verlening van de instellingssubsidie voor de jaren 2014 tot en met 2018 verzoeken
      ten behoeve van de desbetreffende abortuskliniek een instellingssubsidie te verstrekken die in het desbetreffende
      jaar bestaat uit de volgende twee delen:
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.11.14
  - number: 2.11.14.1.a
    text: |-
      voor het jaar 2014 een deel ter grootte van 10% van de instellingssubsidie berekend op grond van deze regeling en
      een deel ter grootte van 90% van de instellingssubsidie berekend op grond van deze regeling zoals deze luidde op
      31 december 2013;
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.11.14
  - number: 2.11.14.1.b
    text: |-
      voor het jaar 2015 een deel ter grootte van 30% van de instellingssubsidie berekend op grond van deze regeling en
      een deel ter grootte van 70% van de instellingssubsidie berekend op grond van deze regeling zoals deze luidde op
      31 december 2013;
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.11.14
  - number: 2.11.14.1.c
    text: |-
      voor het jaar 2016 een deel ter grootte van 50% van de instellingssubsidie berekend op grond van deze regeling en
      een deel ter grootte van 50% van de instellingssubsidie berekend op grond van deze regeling zoals deze luidde op
      31 december 2013;
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.11.14
  - number: 2.11.14.1.d
    text: |-
      voor het jaar 2017 een deel ter grootte van 70% van de instellingssubsidie berekend op grond van deze regeling en
      een deel ter grootte van 30% van de instellingssubsidie berekend op grond van deze regeling zoals deze luidde op
      31 december 2013;
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.11.14
  - number: 2.11.14.1.e
    text: |-
      voor het jaar 2018 een deel ter grootte van 90% van de instellingssubsidie berekend op grond van deze regeling en
      een deel ter grootte van 10% van de instellingssubsidie berekend op grond van deze regeling zoals deze luidde op
      31 december 2013.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.11.14
  - number: 2.11.14.2
    text: |-
      In afwijking van het eerste lid, onderdelen a tot en met e, wordt bij de berekening van de instellingssubsidie
      op grond van deze regeling zoals deze luidde op 31 december 2013 voor de toeslag voor huisvesting en de vaste
      installaties uitsluitend uitgegaan van:
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.11.14
  - number: 2.11.14.2.a
    text: |-
      de huisvesting en de vaste installaties die bij de vaststelling van de instellingssubsidie ten behoeve van het jaar
      2013 in aanmerking zijn genomen;
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.11.14
  - number: 2.11.14.2.b
    text: |-
      de huisvesting en de vaste installaties die zijn gerealiseerd door verbouw of nieuwbouw waarvoor het Zorginstituut
      voor 31 december 2013 goedkeuring heeft gegeven op grond van [artikel 2.11.13][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019161#Artikel2
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.11.14
    references:
      - id: ref1
        bwb_id: BWBR0019161
        artikel: '2'
        hoofdstuk: II
        paragraaf: '2.11'
  - number: 2.11.14.3
    text: |-
      Het verzoek, bedoeld in het eerste lid, gaat vergezeld van een aanvraag overeenkomstig deze regeling zoals deze
      luidde op 31 december 2013.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.11.14
  - number: 3.1.1
    text: |-
      Deze regeling is niet van toepassing op subsidies en uitkeringen die voor de inwerkingtreding van deze regeling
      zijn verleend of vastgesteld.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel3.1.1
  - number: 3.1.2
    text: Deze regeling treedt in werking met ingang van 1 januari 2006.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel3.1.2
  - number: 3.1.3
    text: 'Deze regeling wordt aangehaald als: Regeling subsidies AWBZ.'
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel3.1.3
