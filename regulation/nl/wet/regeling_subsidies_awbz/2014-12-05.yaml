  - number: 1.1.2.1
    text: |-
      Het Zorginstituut verstrekt op grond van deze regeling subsidies voor de in [hoofdstuk 2][ref1] aangegeven
      doeleinden. De subsidies in deze regeling komen ten laste van het algemeen fonds.


      [ref1]: https://wetten.overheid.nl/BWBR0019161#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.1.2
    references:
      - id: ref1
        bwb_id: BWBR0019161
        hoofdstuk: II
  - number: 1.1.2.2
    text: |-
      Het aanvragen van de subsidie en de subsidievaststelling alsmede het nemen van besluiten met betrekking tot
      subsidies geschiedt overeenkomstig de in deze regeling gestelde regels.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.1.2
  - number: 1.1.3.1
    text: 'Subsidie wordt slechts verstrekt indien:'
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.1.3
  - number: 1.1.3.1.a
    text: |-
      naar het oordeel van het Zorginstituut mag worden verwacht dat de met de subsidiëring beoogde doeleinden zullen
      worden bereikt;
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.1.3
  - number: 1.1.3.1.b
    text: de aanvrager naar het oordeel van het Zorginstituut de behoefte aan subsidie heeft aangetoond, en
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.1.3
  - number: 1.1.3.1.c
    text: |-
      de aanvrager aannemelijk heeft gemaakt dat de financiële middelen met inbegrip van subsidie voldoende zullen zijn
      om de voorgenomen activiteiten uit te voeren.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.1.3
  - number: 1.1.3.2
    text: Het eerste lid, onderdelen b en c, zijn niet van toepassing op rechtspersonen krachtens publiekrecht ingesteld.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.1.3
  - number: 1.2.1.1
    text: |-
      Een instellingssubsidie bestaat uit een door het Zorginstituut vast te stellen bedrag voor overeenkomstig een door
      het Zorginstituut goedgekeurd activiteitenplan uitgevoerde activiteiten.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.2.1
  - number: 1.2.1.2
    text: |-
      Onverminderd de overige bepalingen van deze regeling met betrekking tot onder meer de egalisatiereserve bestaat
      een instellingssubsidie uit het verschil tussen de met de gesubsidieerde activiteiten samenhangende en met in
      achtneming van de ingevolge deze regeling in aanmerking komende werkelijke lasten, voorzover opgenomen in de door
      het Zorginstituut goedgekeurde begroting, en de met de gesubsidieerde activiteiten samenhangende baten. De subsidie
      bedraagt niet meer dan het door het Zorginstituut vastgestelde maximum.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.2.1
  - number: 1.2.2.1
    text: |-
      Het bedrag, bedoeld in [artikel 1.2.1][ref1] wordt verlaagd met het bedrag waarmee het maximaal toegestane bedrag
      van de in [artikel 1.8.7][ref2] bedoelde reservering wordt overschreden.


      [ref1]: https://wetten.overheid.nl/BWBR0019161#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0019161#Artikel1
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.2.2
    references:
      - id: ref1
        bwb_id: BWBR0019161
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1.2'
      - id: ref2
        bwb_id: BWBR0019161
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1.8'
  - number: 1.2.2.2
    text: Het eerste lid is niet van toepassing op een ondersteuningssubsidie.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.2.2
  - number: 1.2.3
    text: |-
      Baten en lasten die door middel van interne doorberekeningen worden toegerekend, worden bepaald op
      bedrijfseconomische en maatschappelijk aanvaardbare grondslagen. Voorzover hierin lasten zijn begrepen van
      materiële vaste activa, worden deze lasten op basis van aanschaffingsprijzen van die activa berekend.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.2.3
  - number: 1.3.1
    text: |-
      Een projectsubsidie bestaat uit het verschil tussen de met de gesubsidieerde activiteiten samenhangende en met in
      achtneming van de ingevolge deze regeling in aanmerking komende werkelijke lasten, voorzover opgenomen in de door
      het Zorginstituut goedgekeurde begroting, en de met de gesubsidieerde activiteiten samenhangende baten. De subsidie
      bedraagt niet meer dan het door het Zorginstituut vastgestelde maximum.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.3.1
  - number: 1.4.1
    text: 'Het Zorginstituut stelt voor de subsidies in deze regeling de volgende modellen en formulieren vast:'
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.4.1
  - number: 1.4.1.a
    text: een formulier voor de aanvraag van subsidie;
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.4.1
  - number: 1.4.1.b
    text: een model voor het projectplan;
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.4.1
  - number: 1.4.1.c
    text: een model voor de begroting;
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.4.1
  - number: 1.4.1.d
    text: een model voor het activiteitenplan;
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.4.1
  - number: 1.4.1.e
    text: een model voor het activiteitenverslag;
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.4.1
  - number: 1.4.1.f
    text: een controleprotocol;
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.4.1
  - number: 1.4.1.g
    text: een model accountantsverklaring, en
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.4.1
  - number: 1.4.1.h
    text: een formulier voor de aanvraag van de vaststelling van de subsidie.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.4.1
  - number: 1.5.1.1
    text: |-
      De instelling die voor haar activiteiten of een gedeelte daarvan in een jaar een instellingssubsidie verlangt,
      dient uiterlijk vóór de aanvang van het desbetreffende jaar een subsidieaanvraag in. De aanvraag wordt onderbouwd
      met een activiteitenplan en een begroting en gaat, indien de liquiditeitsbehoefte niet regelmatig gespreid is over
      het jaar, vergezeld van een liquiditeitsprognose.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.5.1
  - number: 1.5.1.2
    text: |-
      In het activiteitenplan worden de aard en de omvang van de voorgenomen activiteiten beschreven. Daarbij wordt
      aangegeven welke doelstelling de instelling met de activiteiten nastreeft, op welke wijze zij zullen worden
      uitgevoerd en voor welke doelgroep zij zijn bestemd.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.5.1
  - number: 1.5.1.3
    text: |-
      De begroting geeft inzicht in de baten en lasten van de activiteiten van dat jaar. De begroting is voorzien van
      een postgewijze toelichting. Daarbij wordt uitgegaan van het prijspeil en van het niveau van de kosten van de
      arbeidsvoorwaarden op het moment van indiening van de aanvraag. In geval van een privaatrechtelijke rechtspersoon
      bevat de begroting tevens zowel de baten en lasten van de instelling als geheel als de baten en lasten van elk te
      onderscheiden onderdeel van de instelling.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.5.1
  - number: 1.5.1.4
    text: |-
      De liquiditeitsprognose geeft gemotiveerd inzicht in het verloop van de liquiditeitsbehoefte van de activiteiten
      per kalenderkwartaal.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.5.1
  - number: 1.5.1.5
    text: Het Zorginstituut kan ontheffing verlenen van de in het eerste lid genoemde aanvraagtermijn.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.5.1
  - number: 1.5.2.1
    text: 'Bij de aanvraag van een instellingssubsidie door een privaatrechtelijke rechtspersoon worden tevens overgelegd:'
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.5.2
  - number: 1.5.2.1.a
    text: een afschrift van de oprichtingsakte of de statuten;
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.5.2
  - number: 1.5.2.1.b
    text: een afschrift waaruit de inschrijving van de instelling in het geldende openbaar register blijkt;
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.5.2
  - number: 1.5.2.1.c
    text: een volledig overzicht van de financiële toestand van de instelling op het tijdstip van de aanvraag, en
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.5.2
  - number: 1.5.2.1.d
    text: |-
      indien de aanvraag is ondertekend door een of meer andere personen dan de personen die op grond van de statuten
      bevoegd zijn de instelling te vertegenwoordigen: een afschrift van de volmacht op grond waarvan de aanvraag door
      die andere persoon of personen is ondertekend.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.5.2
  - number: 1.5.2.2
    text: |-
      Voorzover de aanvrager voor dezelfde begrote uitgaven tevens subsidie of een andere financiële bijdrage heeft
      aangevraagd bij andere bestuursorganen of organisaties, doet hij daarvan mededeling in de aanvraag, onder
      vermelding van de stand van zaken met betrekking tot de beoordeling van die aanvraag of aanvragen.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.5.2
  - number: 1.5.2.3
    text: |-
      Overlegging van de in het eerste lid bedoelde afschriften kan achterwege blijven, indien de aanvrager er
      redelijkerwijs van uit kan gaan dat deze gegevens aan het Zorginstituut bekend zijn.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.5.2
  - number: 1.6.1.1
    text: Het Zorginstituut kan projectsubsidies verlenen die zich uitstrekken over meer dan een kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.6.1
  - number: 1.6.1.2
    text: |-
      De natuurlijke persoon of rechtspersoon die subsidie voor een bepaald project verlangt, dient ten minste 13 weken
      vóór de aanvang van het project een aanvraag in. De aanvraag wordt onderbouwd met een projectplan en een begroting
      en gaat vergezeld van een liquiditeitsprognose.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.6.1
  - number: 1.6.1.3
    text: |-
      In het projectplan worden de aard en de omvang van de voorgenomen activiteiten beschreven. Daarbij wordt aangegeven
      welke doelstelling de aanvrager met de activiteiten nastreeft en op welke wijze die zullen worden uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.6.1
  - number: 1.6.1.4
    text: |-
      De begroting geeft inzicht in de baten en lasten van het project. De begroting is voorzien van een postgewijze
      toelichting. Daarbij wordt uitgegaan van het prijspeil en van het niveau van de kosten van de arbeidsvoorwaarden op
      het moment van indiening van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.6.1
  - number: 1.6.1.5
    text: |-
      De liquiditeitsprognose geeft gemotiveerd inzicht in het verloop van de liquiditeitsbehoefte van de activiteiten
      per maand. De liquiditeitsprognose kan achterwege blijven als de liquiditeitsbehoefte regelmatig gespreid is over
      de duur van het project.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.6.1
  - number: 1.6.1.6
    text: |-
      In afwijking van het tweede lid kan het Zorginstituut bepalen dat aanvragen voor projecten op bepaalde terreinen
      vóór een of meer door hem vastgestelde data worden ingediend.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.6.1
  - number: 1.6.1.7
    text: Het Zorginstituut kan ontheffing verlenen van de in het tweede of zesde lid bedoelde aanvraagtermijn.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.6.1
  - number: 1.6.2.1
    text: 'Bij de aanvraag van de subsidie door een privaatrechtelijke rechtspersoon worden tevens overgelegd:'
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.6.2
  - number: 1.6.2.1.a
    text: een afschrift van de oprichtingsakte of de statuten;
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.6.2
  - number: 1.6.2.1.b
    text: een afschrift waaruit de inschrijving van de instelling in het geldende openbaar register blijkt, en
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.6.2
  - number: 1.6.2.1.c
    text: |-
      indien de aanvraag is ondertekend door een of meer andere personen dan de personen die op grond van de statuten
      bevoegd zijn de instelling te vertegenwoordigen: een afschrift van de volmacht op grond waarvan de aanvraag door
      die andere persoon of personen is ondertekend.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.6.2
  - number: 1.6.2.2
    text: |-
      Voorzover de aanvrager voor dezelfde begrote uitgaven tevens subsidie of een andere financiële bijdrage heeft
      aangevraagd bij andere bestuursorganen, doet hij daarvan mededeling in de aanvraag, onder vermelding van de stand
      van zaken met betrekking tot de beoordeling van die aanvraag of aanvragen.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.6.2
  - number: 1.6.2.3
    text: |-
      Overlegging van in het eerste lid bedoelde afschriften kan achterwege blijven, indien de aanvrager er
      redelijkerwijs van uit kan gaan dat deze gegevens bij het Zorginstituut bekend zijn.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.6.2
  - number: 1.6.3.1
    text: |-
      Het Zorginstituut kan een aanvrager of een categorie aanvragers tevens verplichten tot het overleggen van een
      volledig overzicht van de financiële toestand van de instelling op het tijdstip van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.6.3
  - number: 1.6.3.2
    text: |-
      Het eerste lid is niet van toepassing indien een rechtspersoon, krachtens publiekrecht ingesteld, een
      projectsubsidie aanvraagt.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.6.3
  - number: 1.7.1.1
    text: |-
      Het Zorginstituut geeft een beschikking op een aanvraag voor een instellingssubsidie voor 1 april van het
      desbetreffende subsidiejaar.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.7.1
  - number: 1.7.1.2
    text: |-
      Het Zorginstituut geeft een beschikking op een aanvraag voor een projectsubsidie binnen 13 weken na ontvangst van
      de aanvraag.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.7.1
  - number: 1.7.2.1
    text: |-
      Nadat een subsidieaanvraag is ingediend, kan het Zorginstituut voorschotten verlenen. Daarbij wordt rekening
      gehouden met de liquiditeitsbehoefte.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.7.2
  - number: 1.7.2.2
    text: |-
      Het Zorginstituut verstrekt, indien de liquiditeitsbehoefte regelmatig is gespreid, de volgende voorschotten op een
      verleende instellingssubsidie: in januari 15%, februari 7%, maart 7%, april 7%, mei 15%, juni 7%, juli 7%, augustus
      7%, september 3%, oktober 11%, en november 14% van het voor het desbetreffende jaar verleende bedrag.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.7.2
  - number: 1.7.2.3
    text: |-
      Indien het Zorginstituut voorschotten verstrekt voordat hij de beschikking tot subsidieverlening heeft gegeven,
      worden de percentages, bedoeld in het tweede lid, tot de datum van subsidieverlening, toegepast op het voor het
      voorgaande jaar verleende bedrag, in voorkomende gevallen bijgesteld overeenkomstig door het Zorginstituut gegeven
      beschikkingen.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.7.2
  - number: 1.7.3.1
    text: |-
      Bij de verlening van een subsidie kan het Zorginstituut bepalen dat het subsidiebedrag door hem wordt bijgesteld,
      rekeninghoudend met de ontwikkeling van het prijspeil of de ontwikkeling in de kosten van de arbeidsvoorwaarden.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.7.3
  - number: 1.7.3.2
    text: |-
      Met het oog op de toepassing van het eerste lid kan het Zorginstituut bij de verlening van de subsidie tevens
      bepalen welk deel van het subsidiebedrag in aanmerking zal worden genomen voor een bijstelling in verband met de
      ontwikkeling van het prijspeil, onderscheidenlijk van de kosten van de arbeidsvoorwaarden.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.7.3
  - number: 1.7.3.3
    text: |-
      Indien een subsidie met toepassing van het eerste lid wordt bijgesteld, kan de bevoorschotting overeenkomstig
      worden gewijzigd.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.7.3
  - number: 1.8.1
    text: 'De subsidieontvanger zorgt ervoor dat:'
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.8.1
  - number: 1.8.1.a
    text: de doeleinden, gesteld in het activiteitenplan dan wel het projectplan, op doelmatige wijze worden nagestreefd;
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.8.1
  - number: 1.8.1.b
    text: de werkzaamheden op een zodanige manier worden geregeld dat een goed beleid en beheer worden gevoerd, en
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.8.1
  - number: 1.8.1.c
    text: de subsidie op doelmatige wijze wordt gebruikt voor de doeleinden waarvoor deze wordt verleend.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.8.1
  - number: 1.8.2
    text: 'De subsidieontvanger zorgt er voorts voor:'
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.8.2
  - number: 1.8.2.a
    text: dat de administratie op overzichtelijke en doelmatige wijze wordt gevoerd;
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.8.2
  - number: 1.8.2.b
    text: dat de administratie een juist, volledig en actueel beeld geeft van het functioneren van de instelling, en
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.8.2
  - number: 1.8.2.c
    text: |-
      dat van alle ontvangsten en uitgaven deugdelijke bewijsstukken aanwezig zijn waaruit de aard en de omvang van de
      geleverde goederen of van de verrichte diensten duidelijk blijken.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.8.2
  - number: 1.8.3
    text: Bij instellingen die een instellingssubsidie ontvangen, is het boekjaar gelijk aan het kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.8.3
  - number: 1.8.4.1
    text: |-
      De subsidieontvanger doet zo spoedig mogelijk schriftelijk mededeling aan het Zorginstituut van omstandigheden die
      van belang kunnen zijn voor een beslissing tot wijziging, intrekking of vaststelling van de subsidie.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.8.4
  - number: 1.8.4.2
    text: |-
      Het eerste lid is van toepassing in de situatie dat de feitelijke liquiditeitsbehoefte lager is dan de verleende
      voorschotten.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.8.4
  - number: 1.8.4.3
    text: Bij een mededeling overeenkomstig dit artikel worden de relevante stukken overgelegd.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.8.4
  - number: 1.8.5.1
    text: |-
      De privaatrechtelijke rechtspersoon die een instellingssubsidie ontvangt, verzekert haar roerende en onroerende
      zaken op afdoende wijze tegen het risico van diefstal en brand alsmede tegen het risico van wettelijke
      aansprakelijkheid tegenover derden.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.8.5
  - number: 1.8.5.2
    text: |-
      De ontvanger van een instellingssubsidie verzekert voor vrijwilligers die werkzaamheden verrichten in het kader van
      de gesubsidieerde activiteiten, hun wettelijke aansprakelijkheid.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.8.5
  - number: 1.8.5.3
    text: Het Zorginstituut kan op aanvraag ontheffing verlenen van het eerste of tweede lid.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.8.5
  - number: 1.8.5.4
    text: |-
      Het Zorginstituut kan het eerste of tweede lid van overeenkomstige toepassing verklaren op de ontvanger van een
      projectsubsidie.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.8.5
  - number: 1.8.6
    text: |-
      De subsidieontvanger stelt na afloop van de periode of het project waarvoor subsidie is verleend een verslag
      vast dat inzicht geeft in de aard, duur en omvang van de in het kader van de subsidiëring verrichte activiteiten.
      Het verslag vergelijkt de verrichte activiteiten met de in het activiteitenplan, onderscheidenlijk projectplan,
      voorgenomen activiteiten.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.8.6
  - number: 1.8.7.1
    text: |-
      Voorzover het bedrag van de verleende instellingssubsidie, zonder toepassing van de in [artikel 1.2.2][ref1]
      bedoelde vermindering, na uitvoering van de gesubsidieerde activiteiten overeenkomstig de geldende verplichtingen,
      niet is besteed aan de doeleinden waarvoor het is verstrekt, wordt het gereserveerd.


      [ref1]: https://wetten.overheid.nl/BWBR0019161#Artikel1
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.8.7
    references:
      - id: ref1
        bwb_id: BWBR0019161
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1.2'
  - number: 1.8.7.2
    text: |-
      Voor de berekening van het in het eerste lid bedoelde te reserveren bedrag wordt het totaal van de met de
      gesubsidieerde activiteiten samenhangende baten, bestaande uit de verleende instellingssubsidie en de gerealiseerde
      overige baten, verminderd met de lasten van de gesubsidieerde activiteiten. Deze uitkomst wordt toegerekend naar
      rato van de verleende instellingssubsidie en de, in de ingediende begroting opgenomen, met de gesubsidieerde
      activiteiten samenhangende, overige baten. Het te reserveren bedrag is het aan de instellingssubsidie toegerekende
      deel.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.8.7
  - number: 1.8.7.3
    text: |-
      Toevoegingen aan voorzieningen als bedoeld in
      [artikel 374, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1], die samenhangen met de gesubsidieerde
      activiteiten, worden gerekend tot de lasten van de gesubsidieerde activiteiten, bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel374
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.8.7
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '374'
  - number: 1.8.7.4
    text: |-
      Indien in de ingediende begroting onder de met de gesubsidieerde activiteiten samenhangende baten een vrijgevallen
      voorziening is opgenomen, blijft deze buiten beschouwing bij de berekening van het te reserveren bedrag, bedoeld in
      het tweede lid.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.8.7
  - number: 1.8.7.5
    text: De verplichting, bedoeld in het eerste lid, geldt niet voor de ontvanger van een ondersteuningssubsidie.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.8.7
  - number: 1.8.7.6
    text: |-
      De in het eerste lid bedoelde reservering wordt uitsluitend besteed aan doeleinden waarvoor de subsidie werd
      verstrekt.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.8.7
  - number: 1.8.7.7
    text: |-
      Het totaal van de in het eerste lid bedoelde reservering in enig jaar bedraagt ten hoogste 10% van het bedrag van
      de voor dat jaar verleende subsidie, zonder toepassing van de in [artikel 1.2.2][ref1] bedoelde vermindering.


      [ref1]: https://wetten.overheid.nl/BWBR0019161#Artikel1
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.8.7
    references:
      - id: ref1
        bwb_id: BWBR0019161
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1.2'
  - number: 1.8.7.8
    text: |-
      Toevoeging aan de in het eerste lid bedoelde reservering kan niet plaatsvinden als de in het eerste lid bedoelde
      reservering reeds 10% of meer van het voor dat jaar verleende subsidie betreft.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.8.7
  - number: 1.8.8
    text: |-
      Op de balans worden de voorzieningen, gesplitst naar hun aard, en de reservering opgenomen. In de toelichting op de
      balans worden de toevoegingen en de onttrekkingen aan de voorzieningen en reservering toegelicht.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.8.8
  - number: 1.8.9.1
    text: |-
      De subsidieontvanger draagt er zorg voor dat, behoudens schriftelijke toestemming van het Zorginstituut, publicatie
      of het anderszins openbaar maken op grond van deze regeling gesubsidieerd onderzoek, delen of samenvattingen
      daarvan, niet plaatsheeft binnen drie maanden nadat deze aan het Zorginstituut zijn voorgelegd.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.8.9
  - number: 1.8.9.2
    text: |-
      Het Zorginstituut is bevoegd om onderzoek, bedoeld in het eerste lid, desgewenst te voorzien van commentaar, één
      of meermalen te vermenigvuldigen of te publiceren of anderszins openbaar te maken of te doen openbaar maken, met
      vermelding van de bron, zonder dat hiervoor enige vergoeding is verschuldigd.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.8.9
  - number: 1.8.9.3
    text: |-
      De subsidieontvanger draagt er zorg voor dat de in het eerste lid bedoelde onderzoeksgegevens op verzoek van het
      Zorginstituut onmiddellijk en kosteloos aan het Zorginstituut of aan door het Zorginstituut aangewezen natuurlijke
      personen of rechtspersonen beschikbaar worden gesteld.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.8.9
  - number: 1.8.9.4
    text: |-
      Indien een gesubsidieerde activiteit leidt tot een publicatie, kan het Zorginstituut bepalen dat de
      subsidieontvanger er zorg voor draagt dat bij de publicatie wordt aangegeven wie de uitvoerder en subsidiënt van
      het project zijn geweest.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.8.9
  - number: 1.8.9.5
    text: |-
      Indien een subsidie gericht is of mede gericht is op de totstandkoming van een werk als bedoeld in
      [artikel 10, onder 1°, van de Auteurswet][ref1], draagt de subsidieontvanger er zorg voor auteursrechthebbende te
      zijn ter zake van dat werk.


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel10
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.8.9
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: '10'
  - number: 1.8.9.6
    text: |-
      De subsidieontvanger vrijwaart de Staat der Nederlanden en het Zorginstituut voor aanspraken van derden ter zake
      van alle schade die zij lijden ten gevolge van de door of vanwege de subsidieontvanger verrichte publicaties.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.8.9
  - number: 1.8.10
    text: |-
      Aan de subsidie kunnen verplichtingen als bedoeld in [artikel 4:39 van de Algemene wet bestuursrecht][ref1] worden
      verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.8.10
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 1.8.11.1
    text: |-
      In de gevallen, bedoeld in [artikel 4:41, tweede lid, van de Algemene wet bestuursrecht][ref1], is de
      subsidieontvanger aan het Zorginstituut een door het Zorginstituut te bepalen vergoeding verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.8.11
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 1.8.11.2
    text: |-
      De subsidieontvanger meldt meteen aan het Zorginstituut als zich een geval, bedoeld in
      [artikel 4:41, tweede lid, onder a, b, c of e, van de Algemene wet bestuursrecht][ref1], voordoet.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.8.11
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 1.8.11.3
    text: |-
      Bij de bepaling van de hoogte van de vergoeding wordt uitgegaan van de waarde van de goederen en andere
      vermogensbestanddelen, waaronder de egalisatiereserve, op het tijdstip waarop de vergoeding verschuldigd wordt, met
      dien verstande dat:
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.8.11
  - number: 1.8.11.3.a
    text: de waarde van de egalisatiereserve gelijk is aan het bedrag van de egalisatiereserve;
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.8.11
  - number: 1.8.11.3.b
    text: |-
      de waarde van een schadevergoeding voor verlies of beschadiging van zaken gelijk is aan het bedrag dat als
      schadevergoeding door de subsidieontvanger wordt ontvangen;
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.8.11
  - number: 1.8.11.3.c
    text: |-
      de waarde van onroerende zaken wordt bepaald door drie onafhankelijke deskundigen. Het Zorginstituut en de
      subsidieontvanger wijzen elk een deskundige aan, die in onderling overleg een derde deskundige aanwijzen.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.8.11
  - number: 1.8.11.4
    text: |-
      De vergoeding aan het Zorginstituut voor goederen en andere vermogensbestanddelen, waaronder de egalisatiereserve,
      die geheel zijn gevormd met de subsidie, is gelijk aan hun waarde. De vergoeding aan het Zorginstituut voor
      goederen en andere vermogensbestanddelen, die gedeeltelijk zijn gevormd met de subsidie, is gelijk aan de waarde
      waarmee de subsidiëring door het Zorginstituut in verhouding tot andere middelen aan de vorming van dat vermogen
      heeft bijgedragen.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.8.11
  - number: 1.8.11.5
    text: |-
      Na toestemming van de minister kan het Zorginstituut de vergoeding in afwijking van het vierde lid op een lager
      bedrag of op nihil bepalen.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.8.11
  - number: 1.8.12.1
    text: |-
      De vergoeding die de instelling betaalt aan een organisatie die zich de ondersteuning van één of meer
      gesubsidieerde instellingen ten doel stelt, voor door die organisatie aan de instelling ter beschikking gestelde
      goederen, is niet hoger dan het bedrag dat op grond van de verkrijgingsprijs of vervaardigingsprijs verminderd
      met de ontvangen investeringssubsidies en bestemmingsgiften berekend wordt, rekening houdend met de geldende
      afschrijvingspercentages.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.8.12
  - number: 1.8.12.2
    text: |-
      De vergoeding die de instelling betaalt aan een organisatie die zich de ondersteuning van één of meer
      gesubsidieerde instellingen ten doel stelt, voor door die organisatie aan de instelling geleverde diensten, is
      indien het diensten betreft die in het algemeen door soortgelijke instellingen in eigen beheer worden verricht,
      niet hoger dan het bedrag dat gelijk is aan de kosten die de instelling zou hebben gehad bij het verrichten van de
      diensten in eigen beheer.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.8.12
  - number: 1.8.12.3
    text: |-
      De vergoeding die de instelling betaalt aan een organisatie die zich de ondersteuning van één of meer
      gesubsidieerde instellingen ten doel stelt, voor door die organisatie aan de instelling geleverde diensten,
      andere dan de in het tweede lid bedoelde diensten, is niet hoger dan het bedrag dat voor het doen verrichten van
      dergelijke diensten door andere organisaties gebruikelijk kan worden geacht.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.8.12
  - number: 1.8.13
    text: |-
      De subsidieontvanger die aan derden goederen ter beschikking stelt of voor derden diensten verricht, brengt
      daarvoor een vergoeding in rekening die ten minste kostendekkend is, tenzij het derden betreft voor wie de
      gesubsidieerde activiteiten bestemd zijn.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.8.13
  - number: 1.8.14.1
    text: |-
      De subsidieontvanger verstrekt aan de door het Zorginstituut aangewezen ambtenaren of andere personen op hun
      verzoek alle bescheiden en inlichtingen die noodzakelijk zijn voor een juiste vervulling van hun taak. De
      bescheiden worden op één adres getoond en de inlichtingen, op verzoek, schriftelijk verstrekt. Indien de instelling
      slechts kan voldoen aan deze verplichting door inbreuk te maken op het recht van enig persoon op bescherming van
      zijn persoonlijke levenssfeer, verstrekt de instelling de verlangde gegevens op zodanige wijze dat deze niet tot
      personen herleidbaar zijn.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.8.14
  - number: 1.8.14.2
    text: |-
      Ook anderszins wordt zoveel mogelijk medewerking verleend teneinde de door het Zorginstituut aangewezen ambtenaren
      of andere personen in staat te stellen hun taak op een juiste wijze te vervullen.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.8.14
  - number: 1.8.14.3
    text: |-
      De subsidieontvanger werkt mee aan door of namens het Zorginstituut ingestelde onderzoekingen die erop zijn gericht
      inlichtingen te verschaffen ten behoeve van de ontwikkeling van het beleid.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.8.14
  - number: 1.8.14.4
    text: |-
      De subsidieontvanger machtigt de in [artikel 1.9.4][ref1] bedoelde accountant overeenkomstig het eerste tot en met
      het derde lid te handelen.


      [ref1]: https://wetten.overheid.nl/BWBR0019161#Artikel1
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.8.14
    references:
      - id: ref1
        bwb_id: BWBR0019161
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1.9'
  - number: 1.8.15
    text: |-
      Indien bij het Zorginstituut het vermoeden is gerezen dat [artikel 1.8.12][ref1] niet is nageleefd, spant de
      subsidieontvanger zich desgevraagd in de jaarrekening van de desbetreffende organisatie over te leggen.


      [ref1]: https://wetten.overheid.nl/BWBR0019161#Artikel1
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.8.15
    references:
      - id: ref1
        bwb_id: BWBR0019161
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1.8'
  - number: 1.9.1.1
    text: |-
      Binnen zes maanden na afloop van de periode of het project waarvoor subsidie is verleend, dient de
      subsidieontvanger een aanvraag in voor de subsidievaststelling.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.9.1
  - number: 1.9.1.2
    text: 'De aanvraag voor de subsidievaststelling gaat vergezeld van:'
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.9.1
  - number: 1.9.1.2.a
    text: |-
      het verslag, bedoeld in [artikel 1.8.6][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0019161#Artikel1
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.9.1
    references:
      - id: ref1
        bwb_id: BWBR0019161
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1.8'
  - number: 1.9.1.2.b
    text: |-
      de subsidiedeclaratie, bedoeld in [artikel 1.9.2][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0019161#Artikel1
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.9.1
    references:
      - id: ref1
        bwb_id: BWBR0019161
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1.9'
  - number: 1.9.1.2.c
    text: de jaarrekening, en
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.9.1
  - number: 1.9.1.2.d
    text: |-
      indien de aanvraag is ondertekend door een of meer andere personen dan de personen die op grond van de statuten
      bevoegd zijn de instelling te vertegenwoordigen: een afschrift van de volmacht op grond waarvan de aanvraag door
      die andere persoon of personen is ondertekend.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.9.1
  - number: 1.9.1.3
    text: |-
      Een subsidiedeclaratie kan achterwege blijven indien de daarmee te verstrekken informatie reeds in de in te zenden
      jaarrekening is opgenomen.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.9.1
  - number: 1.9.1.4
    text: 'De jaarrekening behoeft niet te worden ingezonden, indien het gaat om:'
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.9.1
  - number: 1.9.1.4.a
    text: een projectsubsidie, of
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.9.1
  - number: 1.9.1.4.b
    text: een subsidie aan een rechtspersoon krachtens publiekrecht ingesteld.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.9.1
  - number: 1.9.1.5
    text: Het Zorginstituut kan ontheffing en vrijstelling verlenen van de in het eerste lid genoemde aanvraagtermijn.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.9.1
  - number: 1.9.2
    text: |-
      De subsidiedeclaratie geeft een zodanig inzicht dat een verantwoord oordeel kan worden gevormd omtrent de
      aanwending en de besteding van de subsidie door de instelling en geeft de nodige informatie om de subsidie
      vast te stellen. De subsidiedeclaratie sluit aan op de indeling van de bij de subsidieaanvraag ingediende
      begroting. Belangrijke verschillen tussen declaratie en begroting worden toegelicht. In de subsidiedeclaratie van
      instellingssubsidies wordt de aansluiting tussen de subsidiedeclaratie en de jaarrekening toegelicht.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.9.2
  - number: 1.9.3.1
    text: |-
      De [afdelingen 2 tot en met 8 van Titel 9 van Boek 2 van het Burgerlijk Wetboek][ref1] zijn van overeenkomstige
      toepassing op de jaarrekening, met dien verstande dat de winst- en verliesrekening vervangen wordt door een
      exploitatierekening; op deze rekening zijn de bepalingen omtrent de winst- en verliesrekening zoveel mogelijk
      van overeenkomstige toepassing. Bepalingen omtrent winst en verlies zijn van overeenkomstige toepassing op het
      exploitatiesaldo.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Afdeling2
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.9.3
    references:
      - id: ref1
        bwb_id: BWBR0003045
        afdeling: '2'
  - number: 1.9.3.2
    text: |-
      De grondslag voor de waardering van activa en passiva is de verkrijgings- of vervaardigingsprijs verminderd met de
      ontvangen investeringssubsidies en bestemmingsgiften.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.9.3
  - number: 1.9.3.3
    text: |-
      Het Zorginstituut kan bepalen dat bepalingen van de in [het eerste lid bedoelde Titel][ref1] of onderdelen daarvan
      niet van toepassing zijn op bepaalde instellingen.


      [ref1]: https://wetten.overheid.nl/BWBR0003045
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.9.3
    references:
      - id: ref1
        bwb_id: BWBR0003045
  - number: 1.9.4.1
    text: |-
      De jaarrekening en de subsidiedeclaratie zijn ieder afzonderlijk voorzien van een verklaring van een accountant als
      bedoeld in [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.9.4
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: 1.9.4.2
    text: |-
      De jaarrekening of de subsidiedeclaratie gaat vergezeld van een rapportage omtrent de naleving van de
      subsidiebepalingen door de subsidieontvanger, opgesteld door de accountant overeenkomstig een door het
      Zorginstituut vast te stellen protocol.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.9.4
  - number: 1.9.4.3
    text: |-
      De subsidieontvanger draagt er zorg voor dat de accountant meewerkt aan door of namens het Zorginstituut in te
      stellen onderzoeken naar de door de accountant verrichte werkzaamheden. Voor de aan dit onderzoek verbonden kosten
      wordt geen subsidie verstrekt.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.9.4
  - number: 1.10.1
    text: |-
      Binnen zes maanden na ontvangst van de aanvraag, bedoeld in [artikel 1.9.1][ref1], geeft het Zorginstituut een
      beschikking tot vaststelling van de subsidie.


      [ref1]: https://wetten.overheid.nl/BWBR0019161#Artikel1
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.10.1
    references:
      - id: ref1
        bwb_id: BWBR0019161
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1.9'
  - number: 1.10.2
    text: |-
      Indien het Zorginstituut bij de vaststelling van de subsidie rekening houdt met de ontwikkeling van het prijspeil
      of met de ontwikkeling in de kosten van de arbeidsvoorwaarden, en het bedrag aan subsidies dat alsdan op grond van
      een subsidieparagraaf vastgesteld zou worden het in die paragraaf genoemde subsidieplafond voor het desbetreffende
      jaar zou overschrijden, wordt dat plafond verhoogd met het verschil tussen het totaal door het Zorginstituut op
      grond van die paragraaf aan subsidies vast te stellen bedrag en dat plafond.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.10.2
  - number: 1.10.3
    text: |-
      Bij de baten worden ook de rente-inkomsten in verband met de op de subsidie verleende voorschotten in aanmerking
      genomen.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel1.10.3
  - number: 2.5.1.1
    text: |-
      Aan door het Zorginstituut, op basis van door het Zorginstituut vast te stellen nadere
      regels inzake spreiding en behoefte, aangewezen MEE-organisaties, als bedoeld in
      [artikel 3.1.7 van de Invoerings- en aanpassingswet Zorgverzekeringswet][ref1], worden ten laatste ten behoeve
      van het jaar 2014 op aanvraag per kalenderjaar instellingssubsidies verleend voor laagdrempelige, onafhankelijke
      en betrouwbare cliëntondersteuning ten behoeve van hun cliënten, zijnde verzekerden met een verstandelijke,
      lichamelijke of zintuiglijke handicap al da niet veroorzaakt door een chronische ziekte of een beperking uit het
      autistisch spectrum, hun ouders, andere verwanten, verzorgers of vertegenwoordigers.


      [ref1]: https://wetten.overheid.nl/BWBR0018830#Artikel3
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.5.1
    references:
      - id: ref1
        bwb_id: BWBR0018830
        artikel: '3'
  - number: 2.5.1.2
    text: |-
      Een MEE-organisatie komt niet voor subsidie in aanmerking indien zij zorg verleent op grond van de [AWBZ][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002614
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.5.1
    references:
      - id: ref1
        bwb_id: BWBR0002614
  - number: 2.5.1.3
    text: 'Bij de subsidiëring worden de volgende activiteiten onderscheiden:'
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.5.1
  - number: 2.5.1.3.a
    text: collectieve cliëntondersteuning;
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.5.1
  - number: 2.5.1.3.b
    text: individuele cliëntondersteuning, en
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.5.1
  - number: 2.5.1.3.c
    text: coördinatie van projecten integrale vroeghulp.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.5.1
  - number: 2.5.2.1
    text: Het subsidieplafond voor collectieve en individuele cliëntondersteuning bedraagt voor het jaar 2014 € 178.669.217.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.5.2
  - number: 2.5.2.2
    text: Het subsidieplafond voor de coördinatie van projecten integrale vroeghulp bedraagt voor het jaar 2014 € 1.802.512.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.5.2
  - number: 2.5.3.1
    text: |-
      Subsidie voor collectieve cliëntondersteuning wordt slechts verleend indien de activiteiten van de MEE-organisatie
      op dit terrein bestaan uit:
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.5.3
  - number: 2.5.3.1.a
    text: het vergaren en verstrekken van informatie en het geven van voorlichting aan cliënten;
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.5.3
  - number: 2.5.3.1.b
    text: het signaleren van relevante ontwikkelingen en belemmeringen, en
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.5.3
  - number: 2.5.3.1.c
    text: |-
      het scheppen van voorwaarden voor maatschappelijke activering en integratie voor cliënten door onder meer
      samenwerking met gemeenten en lokale partijen.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.5.3
  - number: 2.5.3.2
    text: |-
      Subsidie wordt slechts verleend voor zover tussen de MEE-organisatie en het door het Zorginstituut voor hem
      aangewezen zorgkantoor schriftelijk overeenstemming is bereikt over de omvang van de activiteiten bedoeld in het
      eerste lid.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.5.3
  - number: 2.5.3.3
    text: |-
      De te verlenen subsidie bedraagt in 2014 maximaal € 4.259 per 1000 inwoners, waarbij wordt uitgegaan van het aantal
      inwoners op 1 januari van het jaar voorafgaande aan het subsidiejaar.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.5.3
  - number: 2.5.4.1
    text: |-
      Subsidie voor individuele cliëntondersteuning wordt slechts verleend indien de activiteiten van de MEE-organisatie
      op dit terrein bestaan uit de volgende diensten:
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.5.4
  - number: 2.5.4.1.a
    text: 'dienst A: informatieverstrekking en advisering;'
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.5.4
  - number: 2.5.4.1.b
    text: 'dienst B1: vraagverduidelijking;'
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.5.4
  - number: 2.5.4.1.c
    text: 'dienst B2: aanvragen en realiseren van externe dienstverlening en zorg;'
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.5.4
  - number: 2.5.4.1.d
    text: 'dienst B3: klacht en bezwaar en beroep waaronder ook het voorkomen daarvan;'
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.5.4
  - number: 2.5.4.1.e
    text: 'dienst B4: monitoring en evaluatie van externe dienstverlening en zorg;'
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.5.4
  - number: 2.5.4.1.f
    text: 'dienst B5: ondersteuning in een crisissituatie;'
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.5.4
  - number: 2.5.4.1.g
    text: 'dienst C: volledige beeldvorming;'
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.5.4
  - number: 2.5.4.1.h
    text: 'dienst D: kortdurende en kortcyclische ondersteuning, en'
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.5.4
  - number: 2.5.4.1.i
    text: 'dienst E: aanbieding van cursussen in groepen.'
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.5.4
  - number: 2.5.4.2
    text: |-
      De ten behoeve van 2014 te verlenen subsidie wordt berekend op basis van de volgende normbedragen:







                    a.


                    dienst A


                    € 287;




                    b.


                    dienst B1


                    € 1.066;




                    c.


                    dienst B2


                    € 1.476;




                    d.


                    dienst B3


                    € 1.230;




                    e.


                    dienst B4


                    € 697;




                    f.


                    dienst B5


                    € 902;




                    g.


                    dienst C


                    € 1.210;




                    h.


                    dienst D


                    € 1.722;




                    i.


                    dienst E


                    € 574.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.5.4
  - number: 2.5.4.3
    text: |-
      De normbedragen voor de diensten A tot en met D hebben betrekking op in het subsidiejaar afgesloten diensten. Het
      normbedrag voor dienst E heeft betrekking op in het subsidiejaar gegeven cursusbijeenkomsten.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.5.4
  - number: 2.5.4.4
    text: De te verlenen subsidie bedraagt het product van het aantal diensten en de in het tweede lid genoemde normbedragen.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.5.4
  - number: 2.5.4.5
    text: |-
      Subsidie wordt slechts verleend voor zover tussen de MEE-organisatie en het door het Zorginstituut voor hem
      aangewezen zorgkantoor schriftelijk overeenstemming is bereikt over de omvang van de activiteiten bedoeld in het
      eerste lid.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.5.4
  - number: 2.5.4.6
    text: |-
      Indien de gezamenlijke waarde van de in het subsidiejaar gerealiseerde diensten, als bedoeld in het eerste lid,
      lager is dan de verleende subsidie dan wordt de subsidieverlening dienovereenkomstig verlaagd, met dien verstande
      dat de aldus herziene subsidieverlening minimaal 90% bedraagt van de aanvankelijk verleende subsidie.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.5.4
  - number: 2.5.4.7
    text: |-
      Toepassing van het zesde lid leidt niet tot hernieuwde toepassing van [artikel 2.5.4a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019161#Artikel2
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.5.4
    references:
      - id: ref1
        bwb_id: BWBR0019161
        artikel: '2'
        hoofdstuk: II
        paragraaf: '2.5'
  - number: 2.5.4a
    text: |-
      Indien de gezamenlijke aanvragen voor subsidieverlening voor collectieve en individuele cliëntondersteuning hoger
      zijn dan het voor verlening uit hoofde van het subsidieplafond, bedoeld in [artikel 2.5.2, eerste lid][ref1],
      beschikbare budget, vindt verlening in 2014 plaats op basis van de volgende systematiek:


      [ref1]: https://wetten.overheid.nl/BWBR0019161#Artikel2
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.5.4a
    references:
      - id: ref1
        bwb_id: BWBR0019161
        artikel: '2'
        hoofdstuk: II
        paragraaf: '2.5'
  - number: 2.5.4a.a
    text: |-
      het totaal van de op basis van de [artikelen 2.5.3][ref1] en [2.5.4][ref2] te verlenen subsidie voor collectieve
      en individuele cliëntondersteuning bedraagt niet meer dan 103,82% van de totale subsidie voor collectieve en
      individuele cliëntondersteuning die zonder toepassing van [artikel 1.7.3][ref3] is verleend ten behoeve van 2013;


      [ref1]: https://wetten.overheid.nl/BWBR0019161#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0019161#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0019161#Artikel1
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.5.4a
    references:
      - id: ref1
        bwb_id: BWBR0019161
        artikel: '2'
        hoofdstuk: II
        paragraaf: '2.5'
      - id: ref2
        bwb_id: BWBR0019161
        artikel: '2'
        hoofdstuk: II
        paragraaf: '2.5'
      - id: ref3
        bwb_id: BWBR0019161
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1.7'
  - number: 2.5.4a.b
    text: |-
      de voor individuele cliëntondersteuning te verlenen subsidie is gelijk aan het in onderdeel a bedoelde maximum
      minus het op grond van [artikel 2.5.3][ref1] te verlenen bedrag voor collectieve cliëntondersteuning;


      [ref1]: https://wetten.overheid.nl/BWBR0019161#Artikel2
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.5.4a
    references:
      - id: ref1
        bwb_id: BWBR0019161
        artikel: '2'
        hoofdstuk: II
        paragraaf: '2.5'
  - number: 2.5.4a.c
    text: subsidie voor individuele cliëntondersteuning wordt verleend voor zover dat bedrag is aangevraagd;
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.5.4a
  - number: 2.5.4a.d
    text: |-
      de na toepassing van [artikel 2.5.3][ref1], [artikel 2.5.4][ref2] en de onderdelen a tot en met c nog resterende
      middelen worden verdeeld volgens de volgende formule: waarbij wordt verstaan onder: A: het nog resterende deel
      van de aanvraag voor individuele cliëntondersteuning van de MEE-organisatie; B: het totaal van de nog resterende
      delen van alle aanvragen voor individuele cliëntondersteuning van de MEE-organisaties; C: de na toepassing van
      [artikel 2.5.3][ref3], [artikel 2.5.4][ref4] en de onderdelen a tot en met c nog resterende middelen.


      [ref1]: https://wetten.overheid.nl/BWBR0019161#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0019161#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0019161#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0019161#Artikel2
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.5.4a
    references:
      - id: ref1
        bwb_id: BWBR0019161
        artikel: '2'
        hoofdstuk: II
        paragraaf: '2.5'
      - id: ref2
        bwb_id: BWBR0019161
        artikel: '2'
        hoofdstuk: II
        paragraaf: '2.5'
      - id: ref3
        bwb_id: BWBR0019161
        artikel: '2'
        hoofdstuk: II
        paragraaf: '2.5'
      - id: ref4
        bwb_id: BWBR0019161
        artikel: '2'
        hoofdstuk: II
        paragraaf: '2.5'
  - number: 2.5.4b.1
    text: |-
      De voor collectieve en individuele cliëntondersteuning ten behoeve van 2014 op grond van [artikel 2.5.4a][ref1]
      te verlenen subsidies van de MEE-organisaties die voor collectieve en individuele cliëntondersteuning per inwoner
      meer dan het landelijk gemiddelde subsidiebedrag voor collectieve en individuele cliëntondersteuning per inwoner
      zouden ontvangen, worden verlaagd met maximaal 5% tot ten laagste het bedrag waarbij het subsidiebedrag voor
      collectieve en individuele cliëntondersteuning per inwoner gelijk is aan het landelijk gemiddelde subsidiebedrag
      voor collectieve en individuele cliëntondersteuning per inwoner.


      [ref1]: https://wetten.overheid.nl/BWBR0019161#Artikel2
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.5.4b
    references:
      - id: ref1
        bwb_id: BWBR0019161
        artikel: '2'
        hoofdstuk: II
        paragraaf: '2.5'
  - number: 2.5.4b.2
    text: |-
      De na toepassing van het eerste lid beschikbaar zijnde middelen worden toegevoegd aan de voor collectieve en
      individuele cliëntondersteuning te verlenen subsidies van de MEE-organisaties die voor collectieve en individuele
      cliëntondersteuning het laagste subsidiebedrag per inwoner zouden ontvangen. De voor collectieve en individuele
      cliëntondersteuning te verlenen subsidie van de desbetreffende MEE-organisaties wordt gelijkelijk verhoogd ten
      hoogste tot het bedrag waarbij het subsidiebedrag per inwoner van de desbetreffende MEE-organisaties gelijk is aan
      het één na laagste te verlenen subsidiebedrag voor collectieve en individuele cliëntondersteuning per inwoner. Dit
      wordt herhaald tot de middelen volledig verdeeld zijn of tot het subsidiebedrag voor collectieve en individuele
      cliëntondersteuning per inwoner van de desbetreffende MEE-organisaties gelijk is aan het landelijk gemiddelde
      subsidiebedrag voor collectieve en individuele cliëntondersteuning per inwoner.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.5.4b
  - number: 2.5.4b.3
    text: |-
      Bij het bepalen van de subsidiebedragen per inwoner, bedoeld in het eerste en het tweede lid, wordt uitgegaan van
      het aantal inwoners op 1 januari van het jaar voorafgaand aan het subsidiejaar.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.5.4b
  - number: 2.5.4b.4
    text: |-
      Het eerste lid is niet van toepassing op een MEE-organisatie waarvan de MEE-index, vermeld in [bijlage 1][ref1],
      lager is dan de Wmo-index, vermeld in bijlage 1.


      [ref1]: https://wetten.overheid.nl/BWBR0019161
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.5.4b
    references:
      - id: ref1
        bwb_id: BWBR0019161
  - number: 2.5.5.1
    text: |-
      Subsidie voor de coördinatie van een project integrale vroeghulp wordt slechts verleend indien het project
      integrale vroeghulp:
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.5.5
  - number: 2.5.5.1.a
    text: |-
      is gebaseerd op een samenwerkingsovereenkomst tussen de MEE-organisatie en ten minste de sector voor de
      kinderrevalidatie en de sector voor de zorg voor kinderen met een verstandelijke handicap;
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.5.5
  - number: 2.5.5.1.b
    text: |-
      beschikt over een team integrale vroeghulp, bestaande uit vertegenwoordigers van een kinderrevalidatiecentrum
      of de revalidatieafdeling van een ziekenhuis, de subsidieontvanger en de kinderdagcentra voor kinderen met een
      verstandelijke handicap;
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.5.5
  - number: 2.5.5.1.c
    text: een onafhankelijk aangestuurde coördinator heeft;
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.5.5
  - number: 2.5.5.1.d
    text: een pool van deskundige casemanagers heeft;
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.5.5
  - number: 2.5.5.1.e
    text: beschikt over een laagdrempelig aanmeldpunt, en
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.5.5
  - number: 2.5.5.1.f
    text: |-
      beschikt over een projectplan dat de instemming heeft van de partijen die de samenwerkingsovereenkomst, bedoeld
      onder a, zijn aangegaan.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.5.5
  - number: 2.5.5.2
    text: |-
      De kosten die de MEE-organisatie maakt als samenwerkingspartner bij de uitvoering van projecten integrale
      vroeghulp vallen onder het subsidieplafond van [artikel 2.5.2, tweede lid][ref1]. De kosten van de overige
      samenwerkingspartners in een project integrale vroeghulp kunnen niet ten laste van deze subsidieparagraaf worden
      gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0019161#Artikel2
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.5.5
    references:
      - id: ref1
        bwb_id: BWBR0019161
        artikel: '2'
        hoofdstuk: II
        paragraaf: '2.5'
  - number: 2.5.5.3
    text: |-
      Het subsidieplafond genoemd in [artikel 2.5.2, tweede lid][ref1], wordt in 2014 als volgt verdeeld:


      [ref1]: https://wetten.overheid.nl/BWBR0019161#Artikel2
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.5.5
    references:
      - id: ref1
        bwb_id: BWBR0019161
        artikel: '2'
        hoofdstuk: II
        paragraaf: '2.5'
  - number: 2.5.5.3.a
    text: € 17.202 per MEE-organisatie;
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.5.5
  - number: 2.5.5.3.b
    text: |-
      de vervolgens nog resterende subsidie wordt over de MEE-organisaties verdeeld op basis van het aantal inwoners,
      waarbij wordt uitgegaan van het aantal inwoners op 1 januari van het jaar voorafgaande aan het subsidiejaar.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.5.5
  - number: 2.5.6.1
    text: 'Onder huisvestingskosten wordt verstaan de kosten van:'
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.5.6
  - number: 2.5.6.1.a
    text: huur;
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.5.6
  - number: 2.5.6.1.b
    text: lease;
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.5.6
  - number: 2.5.6.1.c
    text: hypothecaire leningen;
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.5.6
  - number: 2.5.6.1.d
    text: erfpacht;
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.5.6
  - number: 2.5.6.1.e
    text: energie;
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.5.6
  - number: 2.5.6.1.f
    text: afschrijving van gebouwen, inventaris, automatiseringsapparatuur en programmatuur.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.5.6
  - number: 2.5.6.2
    text: |-
      Voor afschrijving, bedoeld in het eerste lid, onder f, worden ten hoogste in aanmerking genomen de volgende
      percentages van de historische kosten:
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.5.6
  - number: 2.5.6.2.a
    text: 'gebouwen: 2%;'
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.5.6
  - number: 2.5.6.2.b
    text: 'verbouwingen: 5%;'
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.5.6
  - number: 2.5.6.2.c
    text: 'inventaris: 10%;'
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.5.6
  - number: 2.5.6.2.d
    text: 'automatiseringsapparatuur en programmatuur: 20%.'
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.5.6
  - number: 2.5.6a.1
    text: |-
      De MEE-organisatie kan, ten laste van de subsidie voor collectieve en individuele cliëntondersteuning, uitsluitend
      de volgende voorzieningen vormen voor:
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.5.6a
  - number: 2.5.6a.1.a
    text: onderhoud huisvesting gebaseerd op een door het bestuur van de MEE-organisatie goedgekeurd onderhoudsplan;
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.5.6a
  - number: 2.5.6a.1.b
    text: |-
      financiering van een spaar/verlofovereenkomst overeenkomstig de CAO Gehandicaptenzorg ten behoeve van de opbouw van
      een doorbetaald langdurig verlof in een toekomstig jaar;
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.5.6a
  - number: 2.5.6a.1.c
    text: |-
      loonkosten als gevolg van ziekte en arbeidsongeschiktheid overeenkomstig de CAO Gehandicaptenzorg waarvoor de MEE-
      organisatie niet verzekerd is;
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.5.6a
  - number: 2.5.6a.1.d
    text: kosten van arbeidsrechtelijke geschillen, voor zover deze kosten voortvloeien uit een gerechtelijke uitspraak;
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.5.6a
  - number: 2.5.6a.1.e
    text: wachtgelden die voortvloeien uit de toepasselijke collectieve arbeidsovereenkomst.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.5.6a
  - number: 2.5.6a.2
    text: |-
      Voor zover in de volgende leden niet anders is bepaald, is op deze voorzieningen
      [artikel 374 van boek 2 van het Burgerlijk Wetboek][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel374
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.5.6a
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '374'
  - number: 2.5.6a.3
    text: |-
      Toevoeging aan de voorziening bedoeld in het eerste lid, onderdeel a, is slechts mogelijk voor zover
      de huisvestingskosten lager zijn dan 12,8% van de voor collectieve en individuele cliëntondersteuning
      verleende subsidie en voor zover de voorziening niet meer bedraagt dan 10% van de op grond van de
      [Wet waardering onroerende zaken][ref1] vastgestelde waarde van het pand.


      [ref1]: https://wetten.overheid.nl/BWBR0007119
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.5.6a
    references:
      - id: ref1
        bwb_id: BWBR0007119
  - number: 2.5.6a.4
    text: |-
      Toevoeging aan de voorziening bedoeld in het eerste lid, onderdeel c, is slechts mogelijk voor zover deze
      voorziening, inclusief de toevoeging, niet meer bedraagt dan 7,56% van de bruto salariskosten in het subsidiejaar.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.5.6a
  - number: 2.5.6a.5
    text: |-
      Toevoeging aan de voorziening bedoeld in het eerste lid, onderdeel e, is slechts mogelijk voor zover deze
      voorziening, inclusief de toevoeging, niet meer bedraagt dan 10% van de subsidie die is verleend voor collectieve
      en individuele cliëntondersteuning.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.5.6a
  - number: 2.5.6a.6
    text: |-
      Kosten waarvoor een voorziening als bedoeld in de voorgaande leden is gevormd, worden ten laste van die voorziening
      gebracht.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.5.6a
  - number: 2.5.6b
    text: |-
      [Artikel 1.8.7][ref1] is niet van toepassing op de subsidie voor coördinatie van projecten integrale vroeghulp.


      [ref1]: https://wetten.overheid.nl/BWBR0019161#Artikel1
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.5.6b
    references:
      - id: ref1
        bwb_id: BWBR0019161
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1.8'
  - number: 2.5.7.1
    text: |-
      De aanvraag voor de subsidievaststelling gaat vergezeld van een overzicht van de aan de activiteiten, genoemd in
      [artikel 2.5.3, eerste lid][ref1], en de diensten, genoemd in [artikel 2.5.4, eerste lid][ref2], bestede tijd.


      [ref1]: https://wetten.overheid.nl/BWBR0019161#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0019161#Artikel2
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.5.7
    references:
      - id: ref1
        bwb_id: BWBR0019161
        artikel: '2'
        hoofdstuk: II
        paragraaf: '2.5'
      - id: ref2
        bwb_id: BWBR0019161
        artikel: '2'
        hoofdstuk: II
        paragraaf: '2.5'
  - number: 2.5.7.2
    text: |-
      De aanvraag tot subsidievaststelling wordt pas in behandeling genomen als het door het Zorginstituut voor de
      betrokken MEE-organisatie aangewezen zorgkantoor schriftelijk met de aanvraag heeft ingestemd.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.5.7
  - number: 2.5.8.1
    text: |-
      De MEE-organisatie registreert op zorgvuldige wijze alle gegevens die naar het oordeel van het Zorginstituut
      noodzakelijk zijn voor het verkrijgen van een goed inzicht in de gesubsidieerde taken. Bij de registratie wordt
      rekening gehouden met de bescherming van de persoonlijke levenssfeer en het medisch beroepsgeheim.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.5.8
  - number: 2.5.8.2
    text: De MEE-organisatie bewaart de in het eerste lid bedoelde gegevens gedurende minimaal vijf jaren.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.5.8
  - number: 2.5.9.1
    text: |-
      De MEE-organisatie verricht de activiteiten, bedoeld in [artikel 2.5.1][ref1], in samenwerking met de gemeenten in
      haar werkgebied en maakt daarover afspraken met die gemeenten.


      [ref1]: https://wetten.overheid.nl/BWBR0019161#Artikel2
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.5.9
    references:
      - id: ref1
        bwb_id: BWBR0019161
        artikel: '2'
        hoofdstuk: II
        paragraaf: '2.5'
  - number: 2.5.9.2
    text: |-
      De afspraken, bedoeld in het eerste lid, hebben in ieder geval betrekking op de voorbereiding op de
      verantwoordelijkheid van de gemeenten voor cliëntondersteuning met ingang van het jaar 2015, rekening houdend met
      de ontwikkelingen op het terrein van maatschappelijke ondersteuning, langdurige zorg, jeugdzorg en werk en inkomen;
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.5.9
  - number: 2.5.9.3
    text: De afspraken, bedoeld in het eerste lid, kunnen worden gemaakt met meerdere gemeenten tegelijk.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.5.9
  - number: 2.5.10
    text: |-
      [Artikel 1.8.11][ref1] is niet van toepassing op de beëindiging van de subsidie per 1 januari 2015.


      [ref1]: https://wetten.overheid.nl/BWBR0019161#Artikel1
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.5.10
    references:
      - id: ref1
        bwb_id: BWBR0019161
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1.8'
  - number: 2.6.2.1
    text: |-
      Het Zorginstituut verleent aan zorgkantoren op aanvraag een subsidie die bestemd is voor het met inachtneming
      van de [artikelen 2.6.3 tot en met 2.6.14][ref1] verstrekken van netto persoonsgebonden budgetten alsmede voor
      het verstrekken van de vergoedingen persoonlijke zorg die tot en met 2012 zijn verleend met inachtneming van deze
      regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0019161#Artikel2
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.2
    references:
      - id: ref1
        bwb_id: BWBR0019161
        artikel: '2'
        hoofdstuk: II
        paragraaf: '2.6'
  - number: 2.6.2.2
    text: 'Het subsidieplafond voor de in het eerste lid bedoelde activiteiten bedraagt: voor het jaar 2014 € 2.731.000.000.'
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.2
  - number: 2.6.2.3
    text: |-
      Voor verleende persoonsgebonden budgetten als bedoeld in het eerste lid wordt voor het jaar 2014 een maximale
      subsidie in aanmerking genomen, die wordt berekend overeenkomstig de volgende formule: waarbij wordt verstaan
      onder: 'A: het bedrag dat het zorgkantoor op 31 augustus van het jaar voorafgaand aan het subsidiejaar aan'
      subsidies heeft verstrekt voor persoonsgebonden budgetten en vergoedingen persoonlijke zorg; B: het bedrag dat het
      zorgkantoor op 31 augustus van het jaar voorafgaand aan het subsidiejaar heeft gereserveerd ten behoeve van de nog
      voor dat subsidiejaar te verlenen subsidies voor persoonsgebonden budgetten en vergoedingen persoonlijke zorg aan
      verzekerden aan wie op 31 augustus subsidie is verleend en waarvan de subsidieperiode vóór of op 31 december van
      het jaar voorafgaand aan het subsidiejaar eindigt. C: de som van de tellers voor alle zorgkantoren tezamen.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.2
  - number: 2.6.2.4
    text: |-
      voor het jaar 2014 wordt € 176.000.000 verdeeld met inachtneming van door het Zorginstituut vast te stellen
      beleidsregels.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.2
  - number: 2.6.2.5
    text: |-
      Het zorgkantoor verleent slechts subsidie voor persoonsgebonden budgetten voor verzekerden woonachtig in zijn
      regio.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.2
  - number: 2.6.2.6
    text: |-
      [Artikel 1.1.3, eerste lid, onderdelen b en c][ref1], zijn niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0019161#Artikel1
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.2
    references:
      - id: ref1
        bwb_id: BWBR0019161
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1.1'
  - number: 2.6.2.7
    text: |-
      Voor de toepassing van [hoofdstuk I][ref1] wordt de in het eerste lid bedoelde subsidie beschouwd
      als een projectsubsidie, met dien verstande dat de aanvraag van de subsidie in afwijking van
      [artikel 1.6.1, tweede lid][ref2], niet vergezeld gaat van een projectplan.


      [ref1]: https://wetten.overheid.nl/BWBR0019161#HoofdstukI
      [ref2]: https://wetten.overheid.nl/BWBR0019161#Artikel1
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.2
    references:
      - id: ref1
        bwb_id: BWBR0019161
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0019161
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1.6'
  - number: 2.6.3.1
    text: |-
      Het zorgkantoor verleent een verzekerde een persoonsgebonden budget indien de verzekerde beschikt over een
      indicatiebesluit waaruit blijkt dat hij is aangewezen op verblijf of op een of meer van de vormen van zorg als
      bedoeld in [artikel 1.1.1, eerste lid, onderdeel j][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019161#Artikel1
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.3
    references:
      - id: ref1
        bwb_id: BWBR0019161
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1.1'
  - number: 2.6.3.2
    text: |-
      In afwijking van het eerste lid verleent het zorgkantoor een verzekerde geen persoonsgebonden budget indien de
      verzekerde:
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.3
  - number: 2.6.3.2.a
    text: |-
      beschikt over een indicatiebesluit met een geldigheidsduur korter dan een jaar, tenzij sprake is van een langdurige
      zorgbehoefte,
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.3
  - number: 2.6.3.2.b
    text: |-
      uitsluitend is aangewezen op begeleiding, kortdurend verblijf of een combinatie van begeleiding en kortdurend
      verblijf, of
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.3
  - number: 2.6.3.2.c
    text: |-
      is aangewezen op een zorgzwaartepakket 9B VV, 4 LVG, 5 LVG, 1 SGLVG, 1B GGZ, 2B GGZ, 3B GGZ, 4B GGZ, 5B GGZ, 6B GGZ
      of 7B GGZ.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.3
  - number: 2.6.3.3
    text: 'Het tweede lid, onderdeel b, is niet van toepassing indien:'
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.3
  - number: 2.6.3.3.a
    text: de verzekerde blijkens het indicatiebesluit is aangewezen op tien of meer uren per week begeleiding,
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.3
  - number: 2.6.3.3.b
    text: |-
      leden van een leefeenheid tezamen, voor zover zij niet in een instelling verblijven als bedoeld in de [AWBZ][ref1]
      of de [Zorgverzekeringswet][ref2], aangewezen zijn op tien of meer uren per week begeleiding, of


      [ref1]: https://wetten.overheid.nl/BWBR0002614
      [ref2]: https://wetten.overheid.nl/BWBR0018450
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.3
    references:
      - id: ref1
        bwb_id: BWBR0002614
      - id: ref2
        bwb_id: BWBR0018450
  - number: 2.6.3.3.c
    text: |-
      de verzekerde lid is van een leefeenheid en een ander lid van die leefeenheid op grond van het eerste lid of
      [artikel 2.6.3a][ref1] een persoonsgebonden budget ontvangt.


      [ref1]: https://wetten.overheid.nl/BWBR0019161#Artikel2
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.3
    references:
      - id: ref1
        bwb_id: BWBR0019161
        artikel: '2'
        hoofdstuk: II
        paragraaf: '2.6'
  - number: 2.6.3.4
    text: |-
      Het aantal geïndiceerde uren als bedoeld in het derde lid, onder a en b, wordt berekend door optelling
      van de gemiddelden van de geïndiceerde klassen voor de functie begeleiding, als genoemd in de
      [Beleidsregels indicatiestelling AWBZ 2014][ref1], waarbij een dagdeel geldt als een uur.


      [ref1]: https://wetten.overheid.nl/BWBR0034547
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.3
    references:
      - id: ref1
        bwb_id: BWBR0034547
  - number: 2.6.3.5
    text: |-
      Het gemiddelde, bedoeld in het vierde lid, wordt bepaald door op een decimaal achter de komma naar boven af te
      ronden.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.3
  - number: 2.6.3a.1
    text: |-
      In afwijking van [artikel 2.6.3][ref1] verleent het zorgkantoor een verzekerde een persoonsgebonden budget indien
      de subsidieperiode waarvoor een persoonsgebonden budget wordt aangevraagd:


      [ref1]: https://wetten.overheid.nl/BWBR0019161#Artikel2
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.3a
    references:
      - id: ref1
        bwb_id: BWBR0019161
        artikel: '2'
        hoofdstuk: II
        paragraaf: '2.6'
  - number: 2.6.3a.1.a
    text: |-
      met een onderbreking van niet meer dan zeven kalenderdagen, aansluit op een eerdere subsidieperiode voor een
      persoonsgebonden budget of een vergoeding persoonlijke zorg, of
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.3a
  - number: 2.6.3a.1.b
    text: |-
      aansluit op een periode waarin de verzekerde verbleef in een instelling als bedoeld in de [AWBZ][ref1] of
      [Zorgverzekeringswet][ref2] en dit verblijf aansloot op een eerdere subsidieperiode voor een persoonsgebonden
      budget of een vergoeding persoonlijke zorg.


      [ref1]: https://wetten.overheid.nl/BWBR0002614
      [ref2]: https://wetten.overheid.nl/BWBR0018450
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.3a
    references:
      - id: ref1
        bwb_id: BWBR0002614
      - id: ref2
        bwb_id: BWBR0018450
  - number: 2.6.3a.2
    text: |-
      In afwijking van het eerste lid verleent het zorgkantoor een verzekerde die blijkens het indicatiebesluit is
      aangewezen op een zorgzwaartepakket 9B VV, 4 LVG, 5 LVG, 1 SGLVG, 1B GGZ, 2B GGZ, 3B GGZ, 4B GGZ, 5B GGZ, 6B GGZ of
      7B GGZ, alleen een persoonsgebonden budget indien de verzekerde in een eerdere subsidieperiode als bedoeld in het
      eerste lid, was aangewezen op hetzelfde zorgzwaartepakket.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.3a
  - number: 2.6.3b.1
    text: |-
      Het zorgkantoor verleent een verzekerde alleen een netto persoonsgebonden budget indien de verzekerde gebruik heeft
      gemaakt van een door het zorgkantoor vastgesteld aanvraagformulier en de aanvraag is vergezeld van een budgetplan
      dat is ingericht volgens het door het Zorginstituut vastgestelde model.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.3b
  - number: 2.6.3b.2
    text: |-
      Het eerste lid is niet van toepassing op een verzekerde als bedoeld in [artikel 2.6.3a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019161#Artikel2
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.3b
    references:
      - id: ref1
        bwb_id: BWBR0019161
        artikel: '2'
        hoofdstuk: II
        paragraaf: '2.6'
  - number: 2.6.3b.3
    text: |-
      Op verzoek van de verzekerde die de leeftijd van 21 jaar nog niet heeft bereikt of diens wettelijk
      vertegenwoordiger, wordt een persoonsgebonden budget verleend aan een organisatie die belast is met de
      ondertoezichtstelling op de verzekerde of die een reclasseringsmaatregel uitoefent krachtens een uitspraak van
      de rechter of het Openbaar Ministerie op grond van [artikel 14d][ref1], [artikel 15b, tweede lid][ref2], of
      [Boek I, Titel VIII A Bijzondere bepalingen voor jeugdige personen van het Wetboek van Strafrecht][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel14d
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel15b
      [ref3]: https://wetten.overheid.nl/BWBR0001854
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.3b
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 14d
      - id: ref2
        bwb_id: BWBR0001854
        artikel: 15b
      - id: ref3
        bwb_id: BWBR0001854
  - number: 2.6.3c.1
    text: |-
      Indien de verzekerde woonachtig is in een regio van de zorgkantoren OWM Zorgverzekeraar Zorg en Zekerheid U.A.,
      Zorgkantoor DSW B.V. of Salland Zorgkantoor B.V. wordt met ingang van 1 januari 2014 een verzekerde uitsluitend een
      trekkingsrecht verleend.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.3c
  - number: 2.6.3c.2
    text: Het eerste lid is niet van toepassing op een bestaande budgethouder.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.3c
  - number: 2.6.4.1
    text: 'Het zorgkantoor weigert verlening van een netto persoonsgebonden budget indien:'
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.4
  - number: 2.6.4.1.a
    text: |-
      de verzekerde geen volledig ingevuld budgetplan heeft overgelegd volgens het door het Zorginstituut vastgestelde
      model;
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.4
  - number: 2.6.4.1.b
    text: |-
      de verzekerde weigert het budgetplan desgevraagd met het zorgkantoor te bespreken of, na voor zulk een gesprek te
      zijn opgeroepen, zonder geldige reden niet verschijnt;
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.4
  - number: 2.6.4.1.c
    text: de verzekerde het door het zorgkantoor vastgestelde aanvraagformulier niet volledig en juist heeft ingevuld;
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.4
  - number: 2.6.4.1.d
    text: |-
      de verzekerde op de dag waarop de subsidieperiode zou aanvangen, anders dan terzake van kortdurend verblijf, in een
      instelling als bedoeld in de [AWBZ][ref1] of de [Zorgverzekeringswet][ref2] zal verblijven;


      [ref1]: https://wetten.overheid.nl/BWBR0002614
      [ref2]: https://wetten.overheid.nl/BWBR0018450
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.4
    references:
      - id: ref1
        bwb_id: BWBR0002614
      - id: ref2
        bwb_id: BWBR0018450
  - number: 2.6.4.1.e
    text: |-
      de verzekerde op grond van een wettelijk voorschrift, anders dan de [AWBZ][ref1], recht heeft op de zorg waarop hij
      blijkens het indicatiebesluit is aangewezen of op een gehele of gedeeltelijke vergoeding van de kosten daarvan;


      [ref1]: https://wetten.overheid.nl/BWBR0002614
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.4
    references:
      - id: ref1
        bwb_id: BWBR0002614
  - number: 2.6.4.1.f
    text: |-
      het zorgkantoor, op advies van een instelling voor maatschappelijk werk of de Raad voor de kinderbescherming, van
      oordeel is dat een ten behoeve van een minderjarige verzekerde aangevraagd budget in zodanige mate niet voor de
      inkoop van zorg ten behoeve van die verzekerde zal worden gebruikt, dat dit mishandeling, verwaarlozing of ernstige
      schade voor de opvoeding of ontwikkeling van die verzekerde tot gevolg zal hebben;
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.4
  - number: 2.6.4.1.g
    text: |-
      binnen de maximale subsidie als bedoeld in [artikel 2.6.2, derde lid][ref1], rekening houdend met een reservering
      ten behoeve van de uitvoering van het derde lid, geen ruimte voor verlening van een persoonsgebonden budget
      aanwezig is;


      [ref1]: https://wetten.overheid.nl/BWBR0019161#Artikel2
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.4
    references:
      - id: ref1
        bwb_id: BWBR0019161
        artikel: '2'
        hoofdstuk: II
        paragraaf: '2.6'
  - number: 2.6.4.1.h
    text: |-
      de verzekerde, of, indien de verzekerde jonger is dan 18 jaar, één van diens ouders of voogden, surseance van
      betaling heeft aangevraagd of failliet is; verklaard;
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.4
  - number: 2.6.4.1.i
    text: |-
      ten aanzien van de verzekerde of, indien de verzekerde jonger is dan 18 jaar, ten aanzien van één van diens ouders
      of voogden, de schuldsaneringsregeling natuurlijke personen van toepassing is verklaard, dan wel een verzoek
      daartoe bij de rechtbank is ingediend;
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.4
  - number: 2.6.4.1.j
    text: de verzekerde blijkens de basisregistratie personen niet beschikt over een woonadres;
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.4
  - number: 2.6.4.1.k
    text: |-
      de verzekerde het zorgkantoor geen toestemming geeft om zijn persoonsgegevens door te geven aan het CAK, genoemd in
      [artikel 48, eerste lid, van de AWBZ][ref1], ten behoeve van de vaststelling van de op het bruto persoonsgebonden
      budget in mindering te brengen eigen bijdrage en, voor het geval een trekkingsrecht wordt aangevraagd, de Sociale
      verzekeringsbank ten behoeve van het doen van de betalingen uit en de verantwoording over het persoonsgebonden
      budget;


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel48
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.4
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '48'
  - number: 2.6.4.1.l
    text: |-
      de verzekerde zich niet heeft gehouden aan bij de verstrekking van een eerder persoonsgebonden budget opgelegde
      verplichtingen;
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.4
  - number: 2.6.4.1.m
    text: |-
      de verzekerde zich, gelet op de door hem verstrekte gegevens of bescheiden, kennelijk onvoldoende heeft
      georiënteerd op het door het zorgkantoor gecontracteerde zorgaanbod;
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.4
  - number: 2.6.4.1.n
    text: |-
      de verzekerde, gelet op de door hem verstrekte gegevens of bescheiden, voornemens is om het persoonsgebonden budget
      uitsluitend te besteden aan de inkoop van zorg bij door het zorgkantoor gecontracteerde zorgverleners;
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.4
  - number: 2.6.4.1.o
    text: |-
      de verzekerde naar het oordeel van het zorgkantoor niet in staat is te achten op eigen kracht of met hulp van een
      vertegenwoordiger, gemachtigde of zaakwaarnemer de aan een persoonsgebonden budget verbonden verplichtingen op
      verantwoorde wijze uit te voeren;
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.4
  - number: 2.6.4.1.p
    text: |-
      de verzekerde naar het oordeel van het zorgkantoor niet in staat is te achten op eigen kracht of met hulp van
      een vertegenwoordiger, gemachtigde of zaakwaarnemer de door hem verkozen zorgverlener of zorgverlenende instantie
      op zodanige wijze aan te sturen en hun werkzaamheden op elkaar af te stemmen, dat sprake is of zal zijn van
      verantwoorde zorg;
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.4
  - number: 2.6.4.1.q
    text: |-
      naar het oordeel van het zorgkantoor onvoldoende aannemelijk is dat met het persoonsgebonden budget zal worden
      voorzien in toereikende zorg van goede kwaliteit.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.4
  - number: 2.6.4.2
    text: Het eerste lid, onderdelen a, b, c, g, m en n is niet van toepassing op een bestaande budgethouder.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.4
  - number: 2.6.4.3
    text: |-
      In afwijking van het eerste lid, onderdeel d, kan het zorgkantoor een persoonsgebonden budget verlenen voor
      begeleiding groep indien de verzekerde verblijft in een instelling waar de dagbesteding geen onderdeel vormt van
      het door het zorgkantoor gecontracteerde verblijf.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.4
  - number: 2.6.4.4
    text: |-
      Bij de uitvoering van het eerste lid, onderdeel g, gaat het zorgkantoor uit van de ontvangstdatum van het in
      [artikel 2.6.3b, eerste lid][ref1], bedoelde aanvraagformulier of indien het aanvraagformulier is ontvangen voor de
      datum van het indicatiebesluit, de datum van het indicatiebesluit.


      [ref1]: https://wetten.overheid.nl/BWBR0019161#Artikel2
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.4
    references:
      - id: ref1
        bwb_id: BWBR0019161
        artikel: '2'
        hoofdstuk: II
        paragraaf: '2.6'
  - number: 2.6.5.1
    text: 'Het netto persoonsgebonden budget wordt verleend voor een subsidieperiode die:'
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.5
  - number: 2.6.5.1.a
    text: |-
      niet eerder aanvangt dan de dag met ingang waarvan de verzekerde volgens zijn indicatiebesluit op de zorg is
      aangewezen waarvoor het budget wordt verleend, en
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.5
  - number: 2.6.5.1.b
    text: |-
      eindigt met ingang van de dag waarop het indicatiebesluit zijn geldigheidsduur verliest, doch uiterlijk op
      31 december 2014.
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.5
  - number: 2.6.5.2
    text: |-
      Het [Besluit wachttijd bijzondere ziektekostenverzekering][ref1] is van overeenkomstige toepassing op het
      persoonsgebonden budget.


      [ref1]: https://wetten.overheid.nl/BWBR0005337
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.5
    references:
      - id: ref1
        bwb_id: BWBR0005337
  - number: 2.6.6.1
    text: |-
      Indien de verzekerde beschikt over een indicatiebesluit waaruit blijkt dat hij uitsluitend is aangewezen op een
      of meer van de vormen van zorg als bedoeld in [artikel 1.1.1, eerste lid, onderdeel j][ref1], bedraagt het bruto
      persoonsgebonden budget in 2014 maximaal voor:


      [ref1]: https://wetten.overheid.nl/BWBR0019161#Artikel1
    url: https://wetten.overheid.nl/BWBR0019161/2014-12-05#Artikel2.6.6
    references:
      - id: ref1
        bwb_id: BWBR0019161
        artikel: '1'
        hoofdstuk: I
