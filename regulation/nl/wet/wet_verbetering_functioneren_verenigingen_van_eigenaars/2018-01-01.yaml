preamble:
  text: >-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.


    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:


    Alzo Wij in overweging genomen hebben, dat het noodzakelijk is aanvullende voorschriften neer te leggen in Boek
    5 van het Burgerlijk Wetboek ten behoeve van het verbeteren van het functioneren van verenigingen van eigenaars
    daaronder mede begrepen het verbeteren van mogelijkheden tot het aangaan van overeenkomsten van geldlening door
    verenigingen van eigenaars;


    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0039626/2018-01-01#ArtikelAanhef
articles:
  - number: III
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0039626/2018-01-01#ArtikelIII
  - number: IV
    text: 'Deze wet wordt aangehaald als: Wet verbetering functioneren verenigingen van eigenaars.'
    url: https://wetten.overheid.nl/BWBR0039626/2018-01-01#ArtikelIV
