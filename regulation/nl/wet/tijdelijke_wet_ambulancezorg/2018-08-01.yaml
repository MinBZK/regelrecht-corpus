  - number: '2'
    text: |-
      Voor de toepassing van deze wet is het grondgebied van Nederland verdeeld in regio’s overeenkomstig de verdeling,
      bedoeld in [artikel 8 van de Wet veiligheidsregio’s][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0027466#Artikel8
    url: https://wetten.overheid.nl/BWBR0031557/2018-08-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0027466
        artikel: '8'
  - number: '3'
    text: |-
      Bij regeling van Onze Minister worden de gebieden vastgesteld waarin een standplaats van een ambulance zou moeten
      zijn gevestigd.
    url: https://wetten.overheid.nl/BWBR0031557/2018-08-01#Artikel3
  - number: '4'
    text: |-
      1 Per regio is er een Regionale Ambulancevoorziening die is aangewezen bij of krachtens [artikel 6][ref1].

      2 De Regionale Ambulancevoorziening draagt zorg voor:

      a. het in stand houden van een meldkamer, en

      b. het verlenen of doen verlenen van ambulancezorg.

      3 Het is anderen dan de Regionale Ambulancevoorziening verboden ambulancezorg te verrichten.

      4 Het is verboden ambulancezorg te verlenen zonder opdracht van een meldkamer.

      5 Het derde lid geldt niet voor degenen die krachtens een overeenkomst met de Regionale Ambulancevoorziening
      ambulancezorg verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0031557#Artikel6
    url: https://wetten.overheid.nl/BWBR0031557/2018-08-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0031557
        artikel: '6'
        hoofdstuk: II
  - number: '5'
    text: |-
      1 Op elke aanvraag om ambulancezorg beslist de meldkamer van de regio waarbinnen de aangevraagde zorg aanvangt, of
      ambulancezorg nodig is, alsmede door wie en op welke wijze deze zal worden verleend.

      2 Indien de meldkamer besluit dat ambulancezorg wordt verleend door middel van een ambulance waarvan de standplaats
      zich in een andere regio bevindt, geeft de meldkamer na het verstrekken van de opdracht daarvan bericht aan de
      meldkamer van die regio.

      3 De meldkamer kan bij de hulpverlening aan zieken en gewonden andere vervoermiddelen inschakelen dan ambulances
      of speciaal daartoe uitgeruste en als zodanig herkenbaar andere motorvoertuigen, voor zover deze bij de meldkamer
      zijn geregistreerd.
    url: https://wetten.overheid.nl/BWBR0031557/2018-08-01#Artikel5
  - number: '6'
    text: |-
      1 Onze Minister wijst als Regionale Ambulancevoorziening aan de rechtspersoon die op 1 december 2011 in een regio:

      a. als enige vergunninghouder ambulancevervoer op grond van de [Wet ambulancevervoer][ref1] verleent, anders dan op
      grond van een vergunning voor buitenlandvervoer,

      b. is opgericht door de rechtspersonen die als vergunninghouders in diezelfde regio ambulancevervoer op grond van
      de [Wet ambulancevervoer][ref2] verlenen, anders dan op grond van een vergunning voor buitenlandvervoer, en die als
      enig doel heeft het verlenen van ambulancezorg in die regio, of

      c. als één van de vergunninghouders in diezelfde regio ambulancevervoer op grond van de
      [Wet ambulancevervoer][ref3] verleent, anders dan op grond van een vergunning voor buitenlandvervoer, en met
      de andere in die regio werkzame vergunninghouder of vergunninghouders over de gezamenlijke uitvoering van de
      ambulancezorg schriftelijke afspraken heeft gemaakt.

      2 Indien op 1 december 2011 in een regio het bepaalde in het eerste lid zich niet heeft voorgedaan, wijst Onze
      Minister voor die regio als Regionale Ambulancevoorziening aan:

      a. één van de rechtspersonen die per 1 december 2011 als vergunninghouders in diezelfde regio ambulancevervoer op
      grond van de [Wet ambulancevervoer][ref4] verlenen, anders dan op grond van een vergunning voor buitenlandvervoer,

      b. een per 1 december 2011 aan de regio grenzende Regionale Ambulancevoorziening, of

      c. een daartoe door Onze Minister opgerichte rechtspersoon.

      3 Onze Minister maakt vóór 1 oktober 2011 in de Staatscourant bekend welke beleidsregels worden gehanteerd ten
      behoeve van de aanwijzing, bedoeld in het eerste en tweede lid.

      4 Een rechtspersoon als bedoeld in het tweede lid, onder c, kan in overeenstemming met Onze Minister van
      Financiën en na overleg met de Algemene Rekenkamer door Onze Minister worden opgericht in afwijking van
      [artikel 4.7 van de Comptabiliteitswet 2016][ref5]. Onze Minister informeert de Staten-Generaal over de oprichting.

      5 Onze Minister doet in de Staatscourant mededeling welke rechtspersoon in een regio Regionale Ambulancevoorziening
      is.


      [ref1]: https://wetten.overheid.nl/BWBR0002757
      [ref2]: https://wetten.overheid.nl/BWBR0002757
      [ref3]: https://wetten.overheid.nl/BWBR0002757
      [ref4]: https://wetten.overheid.nl/BWBR0002757
      [ref5]: https://wetten.overheid.nl/BWBR0039429#Artikel4.7
