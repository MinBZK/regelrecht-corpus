  - number: '9'
    text: |-
      Onze Minister vergelijkt jaarlijks de Regionale Ambulancevoorzieningen onderling met betrekking tot de wijze waarop
      zij ambulancezorg verlenen en hoe zij aan de eisen, bedoeld in [artikel 7][ref1], voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0031557#Artikel7
    url: https://wetten.overheid.nl/BWBR0031557/2018-08-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0031557
        artikel: '7'
        hoofdstuk: II
  - number: '10'
    text: |-
      1 De Regionale Ambulancevoorziening verstrekt Onze Minister op verzoek gegevens over het verrichten van
      ambulancezorg, waaronder begrepen gegevens die nodig zijn voor het onderzoek, bedoeld in [artikel 9][ref1].

      2 Bij regeling van Onze Minister kunnen nadere eisen worden gesteld over de gegevens, bedoeld in het eerste lid,
      alsmede eisen worden gesteld over de wijze van verstrekking.


      [ref1]: https://wetten.overheid.nl/BWBR0031557#Artikel9
    url: https://wetten.overheid.nl/BWBR0031557/2018-08-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0031557
        artikel: '9'
        hoofdstuk: II
  - number: 10a
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld over de inschrijving in de registers, bedoeld in de
      [Wet op de beroepen in de individuele gezondheidszorg][ref1], dan wel de diploma’s of getuigschriften, waarover
      een ambulancezorgprofessional dient te beschikken. Hierbij kan onderscheid gemaakt worden voor verschillende
      categorieën ambulancezorg. De voordracht voor een krachtens dit artikel vast te stellen algemene maatregel
      van bestuur wordt niet eerder gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is
      overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0006251
    url: https://wetten.overheid.nl/BWBR0031557/2018-08-01#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0006251
  - number: '11'
    text: |-
      Bij regeling van Onze Minister kan, ten aanzien van bij de regeling aangewezen ambulancezorg en onder bij de
      regeling vast te stellen voorwaarden of eisen, vrijstelling worden verleend van bepalingen van deze wet.
    url: https://wetten.overheid.nl/BWBR0031557/2018-08-01#Artikel11
  - number: '12'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de ambtenaren van de
      Inspectie gezondheidszorg en jeugd.
    url: https://wetten.overheid.nl/BWBR0031557/2018-08-01#Artikel12
  - number: '13'
    text: |-
      Onze Minister is bevoegd tot het opleggen van een last onder dwangsom ter handhaving van het bepaalde bij of
      krachtens de [artikelen 4, tweede, derde en vierde lid][ref1], [7, eerste lid][ref2], [8, vijfde lid][ref3],
      [10][ref4] en [11][ref5].


