  - number: '7'
    text: |-
      1 Bij regeling van Onze Minister worden eisen vastgesteld waaraan de Regionale Ambulancevoorziening voldoet. De
      eisen kunnen per regio verschillen.

      2 Voor zover de eisen, bedoeld in het eerste lid, betrekking hebben op de meldkamer stelt Onze Minister
      deze vast overeenkomstig de eisen die de besturen van de veiligheidsregio’s hebben vastgesteld op grond van
      [artikel 35, vierde lid, van de Wet veiligheidsregio’s][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0027466#Artikel35
    url: https://wetten.overheid.nl/BWBR0031557/2018-08-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0027466
        artikel: '35'
  - number: '8'
    text: |-
      1 Indien een Regionale Ambulancevoorziening niet meer aan de krachtens [artikel 7][ref1] vastgestelde
      eisen voldoet, kan Onze Minister voor die regio, onder intrekking van de aanwijzing, bedoeld in
      [artikel 6, eerste of tweede lid][ref2], als Regionale Ambulancevoorziening aanwijzen:

      a. een aan die regio grenzende andere Regionale Ambulancevoorziening, of

      b. een daartoe door Onze Minister opgerichte rechtspersoon.

      2 [Artikel 6, derde lid][ref3], is van toepassing op het oprichten van een rechtspersoon als bedoeld in het eerste
      lid, onder b.

      3 Onze Minister doet in de Staatscourant mededeling van een besluit als bedoeld in het eerste lid.

      4 Voordat Onze Minister een besluit neemt als bedoeld in het eerste lid vraagt Onze Minister de in de regio
      werkzame zorgverzekeraars in de zin van de [Zorgverzekeringswet][ref4] en het bestuur van de veiligheidsregio om
      advies.

      5 Indien Onze Minister een besluit heeft genomen als bedoeld in het eerste lid draagt de rechtspersoon die als
      Regionale Ambulancevoorziening in gebreke is geweest, ervoor zorg dat hij:

      a. uitvoering blijft geven aan [artikel 4, tweede lid][ref5], in de overgangsperiode tot aan het moment dat
      de andere rechtspersoon krachtens de aanwijzing, bedoeld in het eerste lid, als Regionale Ambulancevoorziening
      functioneert,

      b. op verzoek van Onze Minister in de overgangsperiode, bedoeld onder a, aan de door Onze Minister aangewezen
      rechtspersoon alle informatie verschaft die deze nodig heeft om als Regionale Ambulancevoorziening voor die regio
      te functioneren.


      [ref1]: https://wetten.overheid.nl/BWBR0031557#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0031557#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0031557#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0018450
      [ref5]: https://wetten.overheid.nl/BWBR0031557#Artikel4
