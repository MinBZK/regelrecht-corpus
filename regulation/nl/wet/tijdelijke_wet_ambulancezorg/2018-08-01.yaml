  - number: '18'
    text: |-
      1 De [Wet ambulancevervoer][ref1] en de [Wet ambulancezorg][ref2] worden ingetrokken.

      2 [Artikel 12a van de Wet ambulancevervoer][ref3] zoals dat luidde onmiddellijk voor het tijdstip van
      inwerkingtreding van deze wet, blijft van toepassing op de afwikkeling van aanvragen om een subsidie als in dat
      artikel bedoeld, ingediend vóór bovenbedoeld tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0002757
