preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is nieuwe tijdelijke regels vast te stellen inzake de
    organisatie van de ambulancezorg;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0031557/2018-08-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt verstaan onder:

        - *Onze Minister:* Onze Minister van Volksgezondheid, Welzijn en Sport;
        - *ambulance:* een voor het vervoer van zieken of gewonden ingericht motorvoertuig, vaartuig of helikopter;
        - *ambulanceverpleegkundige:* verpleegkundige als bedoeld in
      [artikel 1, onderdeel b, van het Besluit functionele zelfstandigheid][ref1];
        - *ambulancezorgprofessional:* zorgprofessional als bedoeld in [artikel 10a][ref2];
        - *ambulancezorg:* zorg, erop gericht een zieke of gewonde ter zake van zijn aandoening of letsel: 1°. hulp te
      verlenen door een ambulancezorgprofessional of een ambulanceverpleegkundige, en in spoedeisende gevallen hulp
      te verlenen door een ambulanceverpleegkundige, en per ambulance te vervoeren, of 2°. hulp te verlenen door een
      ambulancezorgprofessional of een ambulanceverpleegkundige, en in spoedeisende gevallen hulp te verlenen door een
      ambulanceverpleegkundige, met een speciaal daartoe uitgerust en als zodanig herkenbaar voertuig;
        - *meldkamer:* de meldkamer voor ambulancezorg, onderdeel van de meldkamer, bedoeld in
      [artikel 35, eerste lid, van de Wet veiligheidsregio’s][ref3];
        - *regio:* een regio als bedoeld in [artikel 2][ref4];
        - *veiligheidsregio:* veiligheidsregio als bedoeld in [artikel 9 van de Wet veiligheidsregio’s][ref5];
        - *vergunning voor buitenlandvervoer:* op grond van de [Wet ambulancevervoer][ref6] verleende vergunning die
      uitsluitend strekt tot het op grond van [artikel 7, eerste lid, derde volzin, van de Wet ambulancevervoer][ref7]
      verrichten van ambulancevervoer vanuit het buitenland, met inbegrip van het ambulancevervoer vanaf de Nederlandse
      luchthavens van patiënten voor wie ambulancevervoer is aangewezen vanwege een in het buitenland opgelopen ziekte of
      ontstaan ongeval.

      2 Deze wet is niet van toepassing op ambulancezorg met gebruikmaking van militaire ambulances.


