  - number: '19'
    text: Deze wet wordt twee jaar na de inwerkingtreding geëvalueerd.
    url: https://wetten.overheid.nl/BWBR0031557/2018-08-01#Artikel19
  - number: '20'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip en vervalt maximaal acht jaar na het
      tijdstip van inwerkingtreding.
    url: https://wetten.overheid.nl/BWBR0031557/2018-08-01#Artikel20
