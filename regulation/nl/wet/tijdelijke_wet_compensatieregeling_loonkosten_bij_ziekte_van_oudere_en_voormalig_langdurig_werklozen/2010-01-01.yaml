preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is het mogelijk te maken om aan de werknemer, bedoeld in
    de Ziektewet, die op het tijdstip van inwerkingtreding van deze wet ouder is dan 55 jaar, in geval van ziekte in
    de vijf jaren na aanvang van de dienstbetrekking recht te geven op ziekengeld, indien er direct voorafgaand aan
    de dienstbetrekking sprake is geweest van werkloosheid van ten minste 52 weken en nadat dertien weken van ziekte
    zijn verstreken;

    Zo is het dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0026062/2010-01-01#ArtikelAanhef
articles:
  - number: V
    text: |-
      Deze wet wordt aangehaald als: Tijdelijke wet compensatieregeling loonkosten bij ziekte van oudere en voormalig
      langdurig werklozen.
    url: https://wetten.overheid.nl/BWBR0026062/2010-01-01#ArtikelV
  - number: VI
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0026062/2010-01-01#ArtikelVI
