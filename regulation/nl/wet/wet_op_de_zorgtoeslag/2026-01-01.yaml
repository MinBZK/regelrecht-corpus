    machine_readable:
      untranslatables:
        - construct: afronden drempelinkomen
          reason: Vermenigvuldiging 108% × 12 × WML-maandbedrag levert potentieel niet-geheel getal op; ROUND/CEIL/FLOOR ontbreken als engine-operaties
          legal_text_excerpt: "108% van het twaalfvoud van het voor de maand januari van het berekeningsjaar geldende ... bedrag per maand"
          accepted: false
      execution:
        parameters:
          - name: berekeningsjaar
            type: number
            required: true
            description: Kalenderjaar waarvoor de zorgtoeslag wordt berekend
        input:
          - name: wml_maand_januari
            type: amount
            source:
              regulation: wet_minimumloon_en_minimumvakantiebijslag
              output: minimumloon_per_maand
              parameters:
                jaar: $berekeningsjaar
            type_spec:
              unit: eurocent
            description: Bedrag per maand bedoeld in artikel 8, eerste lid, onderdeel b Wet minimumloon en minimumvakantiebijslag voor januari van het berekeningsjaar
        output:
          - name: drempelinkomen
            type: amount
