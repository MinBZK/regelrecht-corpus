        - construct: afronden standaardpremie verdragspersoon
          reason: Vermenigvuldiging standaardpremie × verhoudingsgetal levert potentieel niet-geheel getal op; ROUND ontbreekt
          legal_text_excerpt: "gelijk aan het met toepassing van dat artikel bepaalde bedrag, vermenigvuldigd met het getal"
          accepted: false
      execution:
