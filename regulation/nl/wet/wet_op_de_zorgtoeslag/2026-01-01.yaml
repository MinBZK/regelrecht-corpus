            required: true
            description: ISO-landcode van het woonland van de verdragspersoon (artikel 69 ZVW)
        input:
          - name: standaardpremie_basis
            type: amount
            source:
              output: standaardpremie
            type_spec:
              unit: eurocent
            description: Standaardpremie vastgesteld op grond van artikel 4
        output:
          - name: standaardpremie_verdragspersoon
            type: amount
            type_spec:
              unit: eurocent
            description: Standaardpremie voor een persoon als bedoeld in artikel 69 ZVW (lid 1)
        actions:
          - output: standaardpremie_verdragspersoon
            value:
              operation: MULTIPLY
              values:
                - $standaardpremie_basis
                - $verhoudingsgetal_land

  - number: '5'
    text: |-
      1 De Dienst Toeslagen is belast met de uitvoering van deze wet.

      2 In afwijking van [artikel 25, eerste lid, van de Algemene wet inkomensafhankelijke regelingen][ref1] betaalt de
      Dienst Toeslagen in opdracht van het CAK, genoemd in [artikel 6.1.1, eerste lid, van de Wet langdurige zorg][ref2],
      de zorgtoeslag of het voorschot op de zorgtoeslag als tegemoetkoming in de bestuursrechtelijke premie, bedoeld in
      [artikel 18d][ref3] of [18e van de Zorgverzekeringswet][ref4], aan het CAK uit.

      3 De persoon, bedoeld in [artikel 68b, vijfde lid, van de Zorgverzekeringswet][ref5], wordt geacht, zo nodig in
      afwijking van [artikel 15, eerste lid, van de Algemene wet inkomensafhankelijke regelingen][ref6], tijdig een
      aanvraag als bedoeld in laatstgenoemd artikel te hebben gedaan voor de berekeningsjaren in de periode gelegen
      tussen de ingangsdatum van de verzekeringsplicht voor de [Zorgverzekeringswet][ref7] en het moment waarop hij van
      het CAK een kennisgeving heeft ontvangen van de verplichting om een zorgverzekering af te sluiten.

      4 Voor de toepassing van [artikel 16, eerste lid, van de Algemene wet inkomensafhankelijke regelingen][ref8]
      wordt in het geval, bedoeld in het derde lid, de aanvraag geacht te zijn gedaan op het moment waarop
      de Belastingdienst/Toeslagen van het CAK een afschrift heeft ontvangen van de beschikking, bedoeld in
      [artikel 68b, zesde lid, van de Zorgverzekeringswet][ref9].

      5 De zorgtoeslag komt ten laste van het Rijk.


