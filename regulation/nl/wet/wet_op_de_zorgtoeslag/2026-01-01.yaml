  - number: '2'
    text: |-
      1 Indien de normpremie voor een verzekerde in het berekeningsjaar minder bedraagt dan de standaardpremie in dat
      jaar, heeft de verzekerde aanspraak op een zorgtoeslag ter grootte van dat verschil. Voor een verzekerde met een
      partner wordt daarbij tweemaal de standaardpremie in aanmerking genomen; in dat geval worden de verzekerde en zijn
      partner voor de toepassing van deze wet geacht gezamenlijk één aanspraak te hebben.

      2 De normpremie bedraagt een percentage van het drempelinkomen in het berekeningsjaar, vermeerderd met een
      percentage van het toetsingsinkomen van de verzekerde in dat jaar voorzover dat toetsingsinkomen het drempelinkomen
      te boven gaat. Voor een verzekerde met een partner wordt daarbij het gezamenlijke toetsingsinkomen in aanmerking
      genomen.

      3 De percentages worden voor verzekerden met een partner vastgesteld op 4,289% van het drempelinkomen, vermeerderd
      met 13,730% van het toetsingsinkomen voor zover dat boven het drempelinkomen uitgaat en voor een verzekerde zonder
      partner op 1,912% van het drempelinkomen, vermeerderd met 13,730% van het toetsingsinkomen voor zover dat boven het
      drempelinkomen uitgaat. Deze percentages kunnen bij algemene maatregel van bestuur worden gewijzigd.

      4 In afwijking van het eerste lid bedraagt de aanspraak op een zorgtoeslag voor een verzekerde met een partner die
      geen verzekerde is, vijftig procent van het op grond van het eerste lid berekende bedrag.

      5 De aanspraak op een zorgtoeslag wordt voor iedere kalendermaand afzonderlijk bepaald.

      6 Bij regeling van Onze Minister kunnen omtrent het bepaalde in het vijfde lid nadere regels worden gesteld.

      7 De voordracht voor een krachtens het derde lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan twee weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0018451/2026-01-01#Artikel2
    machine_readable:
      endpoint: zorgtoeslag
      definitions:
        PERCENTAGE_DREMPEL_MET_PARTNER:
          value: 0.04289
          description: "4,289% drempelinkomen voor verzekerden met partner (lid 3)"
        PERCENTAGE_DREMPEL_ZONDER_PARTNER:
          value: 0.01912
          description: "1,912% drempelinkomen voor verzekerden zonder partner (lid 3)"
        PERCENTAGE_BOVEN_DREMPEL:
          value: 0.13730
          description: "13,730% van het toetsingsinkomen boven het drempelinkomen (lid 3)"
      untranslatables:
        - construct: afronden normpremie en zorgtoeslag
          reason: Vermenigvuldiging van percentages met eurocenten levert niet-gehele getallen op; ROUND ontbreekt als engine-operatie
          legal_text_excerpt: "De normpremie bedraagt een percentage van het drempelinkomen in het berekeningsjaar"
          accepted: false
        - construct: maandelijkse bepaling aanspraak (lid 5)
          reason: De engine ondersteunt geen tijdreeksberekening per kalendermaand; de berekening geeft het jaarbedrag
          legal_text_excerpt: "De aanspraak op een zorgtoeslag wordt voor iedere kalendermaand afzonderlijk bepaald"
          accepted: false
      execution:
        produces:
          legal_character: BESCHIKKING
          decision_type: TOEKENNING
        parameters:
          - name: bsn
            type: string
            required: true
            description: Burgerservicenummer van de verzekerde
          - name: berekeningsjaar
            type: number
            required: true
            description: Kalenderjaar waarvoor de zorgtoeslag wordt berekend
          - name: partner_is_verzekerde
            type: boolean
            required: true
            description: Geeft aan of de partner een verzekerde is in de zin van artikel 1, onderdeel c (lid 4)
        input:
          - name: standaardpremie
            type: amount
            source:
              output: standaardpremie
            type_spec:
              unit: eurocent
            description: Standaardpremie vastgesteld op grond van artikel 4
          - name: drempelinkomen
            type: amount
            source:
              output: drempelinkomen
            type_spec:
              unit: eurocent
            description: Drempelinkomen berekend op grond van artikel 1, onderdeel f
          - name: toetsingsinkomen
            type: amount
            source:
              regulation: algemene_wet_inkomensafhankelijke_regelingen
              output: toetsingsinkomen
              parameters:
                bsn: $bsn
            type_spec:
              unit: eurocent
            description: Toetsingsinkomen van de verzekerde (AWIR)
          - name: gezamenlijk_toetsingsinkomen
            type: amount
            source:
              regulation: algemene_wet_inkomensafhankelijke_regelingen
              output: gezamenlijk_toetsingsinkomen
              parameters:
                bsn: $bsn
            type_spec:
              unit: eurocent
            description: Gezamenlijk toetsingsinkomen van verzekerde en partner (AWIR, lid 2)
          - name: heeft_toeslagpartner
            type: boolean
            source:
              regulation: algemene_wet_inkomensafhankelijke_regelingen
              output: heeft_toeslagpartner
              parameters:
                bsn: $bsn
            description: Of de verzekerde een toeslagpartner heeft in de zin van de AWIR
        output:
          - name: normpremie
            type: amount
            type_spec:
              unit: eurocent
            description: Normpremie berekend op basis van drempelinkomen en toetsingsinkomen (lid 2 en 3)
          - name: hoogte_zorgtoeslag
            type: amount
            type_spec:
              unit: eurocent
            description: Hoogte van de aanspraak op zorgtoeslag in eurocent per jaar (lid 1 en 4)
          - name: heeft_recht_op_zorgtoeslag
            type: boolean
            description: Of de verzekerde aanspraak heeft op zorgtoeslag op basis van het inkomensverschil (lid 1)
        actions:
          - output: relevant_toetsingsinkomen
            value:
              operation: IF
              cases:
                - when:
                    operation: EQUALS
                    subject: $heeft_toeslagpartner
                    value: true
                  then: $gezamenlijk_toetsingsinkomen
              default: $toetsingsinkomen
          - output: inkomen_boven_drempel
            value:
              operation: MAX
              values:
                - 0
                - operation: SUBTRACT
                  values:
                    - $relevant_toetsingsinkomen
                    - $drempelinkomen
          - output: normpremie
            value:
              operation: IF
              cases:
                - when:
                    operation: EQUALS
                    subject: $heeft_toeslagpartner
                    value: true
                  then:
                    operation: ADD
                    values:
                      - operation: MULTIPLY
                        values:
                          - $PERCENTAGE_DREMPEL_MET_PARTNER
                          - $drempelinkomen
                      - operation: MULTIPLY
                        values:
                          - $PERCENTAGE_BOVEN_DREMPEL
                          - $inkomen_boven_drempel
              default:
                operation: ADD
                values:
                  - operation: MULTIPLY
                    values:
                      - $PERCENTAGE_DREMPEL_ZONDER_PARTNER
                      - $drempelinkomen
                  - operation: MULTIPLY
                    values:
                      - $PERCENTAGE_BOVEN_DREMPEL
                      - $inkomen_boven_drempel
          - output: standaardpremie_totaal
            value:
              operation: IF
              cases:
                - when:
                    operation: EQUALS
                    subject: $heeft_toeslagpartner
                    value: true
                  then:
                    operation: MULTIPLY
                    values:
                      - 2
                      - $standaardpremie
              default: $standaardpremie
          - output: basis_zorgtoeslag
            value:
              operation: MAX
              values:
                - 0
                - operation: SUBTRACT
                  values:
                    - $standaardpremie_totaal
                    - $normpremie
          - output: hoogte_zorgtoeslag
            value:
              operation: IF
              cases:
                - when:
                    operation: AND
                    conditions:
                      - operation: EQUALS
                        subject: $heeft_toeslagpartner
                        value: true
                      - operation: EQUALS
                        subject: $partner_is_verzekerde
                        value: false
                  then:
                    operation: MULTIPLY
                    values:
                      - 0.5
                      - $basis_zorgtoeslag
              default: $basis_zorgtoeslag
          - output: heeft_recht_op_zorgtoeslag
            value:
              operation: GREATER_THAN
              subject: $hoogte_zorgtoeslag
              value: 0

  - number: '3'
    text: |-
      1 In afwijking van [artikel 7, derde lid, van de Algemene wet inkomensafhankelijke regelingen][ref1],
      bestaat geen aanspraak op een zorgtoeslag indien de rendementsgrondslag, bedoeld in
      [artikel 5.3 van de Wet inkomstenbelasting 2001][ref2], van de verzekerde aan het begin van het berekeningsjaar
      meer bedraagt dan € 146.011 of, indien de verzekerde het gehele berekeningsjaar dezelfde partner heeft, de
      gezamenlijke rendementsgrondslag, bedoeld in artikel 5.3, van de Wet inkomstenbelasting 2001, van de verzekerde
      en zijn partner aan het begin van het berekeningsjaar meer bedraagt dan € 184.633. Bij de bepaling van de
      rendementsgrondslag, bedoeld in de vorige zin, wordt geen rekening gehouden met de vrijstelling, bedoeld in
      [artikel 5.13 van de Wet inkomstenbelasting 2001][ref3].

      2 Bij het begin van het kalenderjaar worden de bedragen, bedoeld in het eerste lid,
      bij ministeriële regeling gewijzigd overeenkomstig de tabelcorrectiefactor, bedoeld in
      [artikel 10.2 van de Wet inkomstenbelasting 2001][ref4].

      3 Indien er aanleiding is om de bedragen, bedoeld in het eerste lid, te verhogen op een andere wijze dan op grond
      van het tweede lid, worden de bedragen vastgesteld bij algemene maatregel van bestuur.

      4 De overeenkomstig het tweede en derde lid aangepaste bedragen treden in de plaats van de bedragen, genoemd in het
      eerste lid.

      5 Indien een verhoging als bedoeld in het derde lid wordt toegepast, vindt deze verhoging plaats nadat het tweede
      lid toepassing heeft gevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0018472#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel5.3
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel5.13
      [ref4]: https://wetten.overheid.nl/BWBR0011353#Artikel10.2
    url: https://wetten.overheid.nl/BWBR0018451/2026-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0018472
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '5.3'
      - id: ref3
        bwb_id: BWBR0011353
        artikel: '5.13'
      - id: ref4
        bwb_id: BWBR0011353
        artikel: '10.2'
    machine_readable:
      definitions:
        VERMOGENSGRENS_ALLEENSTAAND:
          value: 14601100
          description: "€ 146.011 in eurocent — grens rendementsgrondslag alleenstaande (lid 1)"
        VERMOGENSGRENS_MET_PARTNER:
          value: 18463300
          description: "€ 184.633 in eurocent — grens gezamenlijke rendementsgrondslag bij hele-jaar-partner (lid 1)"
      execution:
        parameters:
          - name: bsn
            type: string
            required: true
            description: Burgerservicenummer van de verzekerde
          - name: heeft_heel_jaar_zelfde_partner
            type: boolean
            required: true
            description: Of de verzekerde het gehele berekeningsjaar dezelfde partner heeft (lid 1, tweede zin)
        input:
          - name: rendementsgrondslag
            type: amount
            source:
              regulation: wet_inkomstenbelasting_2001
              output: rendementsgrondslag
              parameters:
                bsn: $bsn
            type_spec:
              unit: eurocent
            description: Rendementsgrondslag bedoeld in artikel 5.3 Wet IB 2001 aan het begin van het berekeningsjaar, zonder vrijstelling art. 5.13
          - name: gezamenlijke_rendementsgrondslag
            type: amount
            source:
              regulation: wet_inkomstenbelasting_2001
              output: gezamenlijke_rendementsgrondslag
              parameters:
                bsn: $bsn
            type_spec:
              unit: eurocent
            description: Gezamenlijke rendementsgrondslag van verzekerde en partner (artikel 5.3 Wet IB 2001), zonder vrijstelling art. 5.13
        output:
          - name: geen_aanspraak_op_grond_van_vermogen
            type: boolean
            description: True als de rendementsgrondslag boven de toepasselijke grens uitkomt (lid 1)
        actions:
          - output: toepasselijke_grens
            value:
              operation: IF
              cases:
                - when:
                    operation: EQUALS
                    subject: $heeft_heel_jaar_zelfde_partner
                    value: true
                  then: $VERMOGENSGRENS_MET_PARTNER
              default: $VERMOGENSGRENS_ALLEENSTAAND
          - output: toepasselijk_vermogen
            value:
              operation: IF
              cases:
                - when:
                    operation: EQUALS
                    subject: $heeft_heel_jaar_zelfde_partner
                    value: true
                  then: $gezamenlijke_rendementsgrondslag
              default: $rendementsgrondslag
          - output: geen_aanspraak_op_grond_van_vermogen
            value:
              operation: GREATER_THAN
              subject: $toepasselijk_vermogen
              value: $toepasselijke_grens

  - number: '4'
    text: |-
      Onze Minister stelt uiterlijk 22 dagen voorafgaande aan het berekeningsjaar bij regeling de standaardpremie
      voor het berekeningsjaar vast die wordt gevormd door de geraamde gemiddelde premie voor een verzekerde voor een
      zorgverzekering in het berekeningsjaar te vermeerderen met het geraamde gemiddelde bedrag dat een verzekerde naar
      verwachting in dat jaar betaalt ingevolge [artikel 19 van de Zorgverzekeringswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel19
    url: https://wetten.overheid.nl/BWBR0018451/2026-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '19'
    machine_readable:
      open_terms:
        - id: standaardpremie
          type: amount
          required: true
          delegated_to: minister
          delegation_type: MINISTERIELE_REGELING
          legal_basis: artikel 4 Wet op de zorgtoeslag
      execution:
        output:
          - name: standaardpremie
            type: amount
            type_spec:
              unit: eurocent
            description: Geraamde gemiddelde premie inclusief gemiddeld verplicht eigen risico (artikel 19 ZVW)
        actions:
          - output: standaardpremie
            value: $standaardpremie

  - number: 4a
    text: |-
      1 De standaardpremie voor een persoon als bedoeld in [artikel 69 van de Zorgverzekeringswet][ref1] is, in afwijking
      van [artikel 4][ref2], gelijk aan het met toepassing van dat artikel bepaalde bedrag, vermenigvuldigd met het getal
      dat wordt berekend uit de verhouding tussen de gemiddelde uitgaven voor zorg voor een persoon ten laste van de
      sociale zorgverzekeringen in het woonland van deze persoon, en de gemiddelde uitgaven voor zorg voor een persoon
      ten laste van de sociale zorgverzekeringen in Nederland.

      2 Bij ministeriële regeling wordt jaarlijks uiterlijk in november per land het in het eerste lid bedoelde
      verhoudingsgetal vastgesteld.

      3 De aanspraak op een zorgtoeslag van een verzekerde met een partner die een persoon is als
      bedoeld in [artikel 69 van de Zorgverzekeringswet][ref3], wordt berekend met toepassing van
      [artikel 2, eerste lid, tweede zin][ref4], waarbij de standaardpremie, bedoeld in het eerste lid, in acht wordt
      genomen.

      4 De standaardpremie voor een partner van een persoon als bedoeld in [artikel 69 van de Zorgverzekeringswet][ref5]
      wordt overeenkomstig het eerste lid vastgesteld, tenzij deze partner een persoon is als bedoeld in
      [artikel 1, onderdeel f, van de Zorgverzekeringswet][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel69
      [ref2]: https://wetten.overheid.nl/BWBR0018451#Artikel4
