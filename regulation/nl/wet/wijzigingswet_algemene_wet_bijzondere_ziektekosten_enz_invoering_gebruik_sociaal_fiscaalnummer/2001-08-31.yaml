preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is bepalingen vast te stellen met betrekking tot
    de doelmatige uitvoering van de Algemene Wet Bijzondere Ziektekosten alsmede de bestrijding en het tegengaan
    van fraude op het terrein van de sociale zekerheid door het gebruik van het sociaal-fiscaalnummer in de
    verzekerdenadministratie van de organen die de Algemene Wet Bijzondere Ziektekosten uitvoeren, alsmede enige
    wijzigingen in de Ziekenfondswet aan te brengen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0012083/2001-08-31#ArtikelAanhef
articles:
  - number: III
    text: |-
      Binnen twee maanden na het tijdstip van inwerkingtreding van [artikel I][ref1] van deze wet verzoekt een
      uitvoeringsorgaan de verzekerden ingevolge de [Algemene Wet Bijzondere Ziektekosten][ref2] van wie het sociaal-
      fiscaalnummer nog niet bekend is, die bij dat uitvoeringsorgaan zijn ingeschreven, hun sociaal-fiscaalnummer binnen
      twee maanden na dat verzoek aan dat uitvoeringsorgaan mee te delen.


      [ref1]: https://wetten.overheid.nl/BWBR0012083#ArtikelI
      [ref2]: https://wetten.overheid.nl/BWBR0002614
    url: https://wetten.overheid.nl/BWBR0012083/2001-08-31#ArtikelIII
