  - number: VI
    text: |-
      [Artikel 3, eerste lid, onder b, van de Ziekenfondswet][ref1], zoals dat onderdeel luidde op
      de dag vóór inwerkingtreding van deze wet, blijft van toepassing op de verzekerde die direct
      voorafgaande aan de inwerkingtreding van deze wet verzekerd is op grond van het ontvangen van een
      halfwezenuitkering ingevolge [artikel 22 van de Algemene nabestaandenwet][ref2] in samenhang met
      [artikel 24, tweede lid, van die wet][ref3] zoals laatstgenoemd artikel luidt na inwerkingtreding van de
