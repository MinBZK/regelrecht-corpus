---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: regeling_rundersperma
regulatory_layer: WET
publication_date: '2021-04-16'
valid_from: '2019-12-14'
bwb_id: BWBR0012616
url: https://wetten.overheid.nl/BWBR0012616/2019-12-14
preamble:
  text: |-
    Gelet op Richtlijn nr. 88/407/EEG van de Raad van 14 juni 1988 tot vaststelling van de veterinairrechtelijke
    voorschriften van toepassing op het intracommunautaire handelsverkeer in sperma van runderen en de invoer daarvan
    (PbEG L 194);

    Gelet op de artikelen 9, 10 en 13 van het Besluit eisen dierlijk sperma en spermawincentra;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

            a

              *besluit:*


              [Besluit eisen dierlijk sperma en spermawincentra][ref1];



            b

              *Minister:*


              Minister van Economische Zaken, Landbouw en Innovatie;



            c

              *NVWA:*


              Nederlandse Voedsel- en Warenautoriteit;



            d

              *keuringsdierenarts:*


              dierenarts verbonden aan de NVWA;



            e

              *winning:*


              hoeveelheid sperma die op een bepaald moment van een donor is verkregen;



            f

              *dierenarts van het centrum:*


              dierenarts verbonden aan het erkende runderspermawincentrum;



            g

              *quarantaineruimte:*


              door de minister voor de toepassing van deze regeling erkende afzonderingsruimte waarin zich slechts
      runderen bevinden die tenminste dezelfde gezondheidsstatus bezitten.


      [ref1]: https://wetten.overheid.nl/BWBR0010619
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0010619
  - number: 1a
    text: |-
      Deze regeling berust mede op [artikel 107 van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel107
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '107'
  - number: '2.1'
    text: |-
      Ten behoeve van het toezicht, bedoeld in Bijlage A, Hoofdstuk II, punt 1, van [richtlijn 88/407/EEG](31988L0407),
      voorziet de eigenaar of exploitant van een runderspermawincentrum dan wel diens vertegenwoordiger in het opstellen
      van:
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel2
  - number: 2.1.a
    text: |-
      voorschriften inzake: - de reiniging en ontsmetting van de apparatuur die bij het verkrijgen en behandelen in
      contact komt met het sperma of met het donordier;
        - het winnen, bewerken en opslaan van sperma;
        - de reiniging en ontsmetting van de in [artikel 5][ref1] bedoelde ruimten en voorzieningen;
        - de toegang tot de in [artikel 5][ref2] bedoelde ruimten, en
        - de wijze van kleding van personeel en bezoekers;


      [ref1]: https://wetten.overheid.nl/BWBR0012616#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0012616#Artikel5
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0012616
        artikel: '5'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0012616
        artikel: '5'
        paragraaf: '2'
  - number: 2.1.b
    text: |-
      een productieprotocol, waarin voor de in [artikel 5][ref1] bedoelde ruimten en voorzieningen, de productieprocessen
      chronologisch en gedetailleerd beschreven zijn, en


      [ref1]: https://wetten.overheid.nl/BWBR0012616#Artikel5
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0012616
        artikel: '5'
        paragraaf: '2'
  - number: 2.1.c
    text: |-
      een kwaliteitsbeheersingsplan, waarin ter waarborging van een correcte uitvoering en registratie van de in
      onderdeel b bedoelde productieprocessen, de in acht te nemen werkwijzen chronologisch en gedetailleerd zijn
      vastgelegd.
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel2
  - number: '2.2'
    text: |-
      De eigenaar of exploitant van een runderspermawincentrum dan wel diens vertegenwoordiger zorgt dat het personeel
      zijn werkzaamheden verricht overeenkomstig de wettelijke bepalingen en de daarop gebaseerde interne procedures
      en voorschriften, draagt er zorg voor dat de dierenarts van het centrum toeziet op een correcte uitvoering van de
      werkzaamheden door het personeel en geeft de dierenarts van het centrum de hiervoor benodigde instructies.
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel2
  - number: '3'
    text: |-
      Van voortdurend toezicht van een dierenarts van het centrum als bedoeld in Bijlage A, Hoofdstuk I, punt 1,
      onderdeel a, van [richtlijn 88/407/EEG](31988L0407) is sprake, indien die dierenarts overeenkomstig de krachtens
      [artikel 2][ref1] vastgestelde procedures en protocollen erop toeziet dat de voorschriften van [richtlijn 88/407/
      EEG](31988L0407) in acht worden genomen en dat door betrokkenen de krachtens [artikel 2][ref2] vastgestelde
      procedures en protocollen correct worden uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0012616#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0012616#Artikel2
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0012616
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0012616
        artikel: '2'
        paragraaf: '2'
  - number: '4.1'
    text: 'Aan Bijlage A, Hoofdstuk I, punt 1, onderdeel c, van [richtlijn 88/407/EEG](31988L0407) is voldaan, indien:'
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel4
  - number: 4.1.a
    text: |-
      het runderspermawincentrum zodanig is omheind, dat vrije toegang tot het runderspermawincentrum niet mogelijk is,
      en
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel4
  - number: 4.1.b
    text: |-
      voor het personeel en de bezoekers op het runderspermawincentrum een hygiënesluis gesitueerd is, zodanig dat
      zij deze passeren alvorens zij in de in [artikel 5, eerste lid, onderdeel a, b, c, en g][ref1], bedoelde ruimten
      betreden. De hygiënesluis is voorzien van omkleed- en douchefaciliteiten en van een toilet. Schone bedrijfskleding
      en laarzen zijn in de hygiënesluis aanwezig.


      [ref1]: https://wetten.overheid.nl/BWBR0012616#Artikel5
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0012616
        artikel: '5'
        paragraaf: '2'
  - number: '4.2'
    text: |-
      De eigenaar of exploitant van een runderspermawincentrum dan wel diens vertegenwoordiger draagt ervoor zorg dat
      het personeel en de bezoekers zich douchen en zich kleden met schone bedrijfskleding en laarzen voordat zij de in
      [artikel 5, eerste lid, onderdeel a, b en c][ref1], bedoelde ruimten betreden.


      [ref1]: https://wetten.overheid.nl/BWBR0012616#Artikel5
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0012616
        artikel: '5'
        paragraaf: '2'
  - number: '5.1'
    text: |-
      Aan Bijlage A, Hoofdstuk I, punt 1, onderdeel b, d, e en f, van [richtlijn 88/407/EEG](31988L0407) is voldaan,
      indien het runderspermawincentrum binnen de kadastrale eenheden waarop het runderspermawincentrum is gesitueerd, de
      beschikking heeft over:
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel5
  - number: 5.1.a
    text: |-
      een stalruimte voor de dagelijkse huisvesting en verzorging van de runderen, die op efficiënte wijze fysiek is
      afgesloten van de overige ruimten binnen het runderspermawincentrum;
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel5
  - number: 5.1.b
    text: |-
      een stalruimte voor de tijdelijke afzondering van runderen die wegens veterinaire redenen van productie zijn
      uitgesloten, die op efficiënte wijze fysiek is afgesloten van de overige ruimten binnen het runderspermawincentrum;
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel5
  - number: 5.1.c
    text: |-
      een voor het winnen van sperma ingerichte ruimte, die zich bevindt in de in onderdeel a, bedoelde stalruimte dan
      wel in een afzonderlijke hiertoe bestemde ruimte, die op efficiënte wijze fysiek is afgesloten van de overige
      ruimten binnen het runderspermawincentrum en waarvan zich in de directe omgeving faciliteiten voor de reiniging en
      ontsmetting van de bij de spermaverkrijging te gebruiken voorzieningen bevinden;
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel5
  - number: 5.1.d
    text: een voorziening voor de reiniging en ontsmetting van de gebruikte materialen;
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel5
  - number: 5.1.e
    text: |-
      voor runderen ontoegankelijke voorzieningen voor de opslag van voer, kleding en medicijnen alsmede voor de bij de
      verkrijging, bewerking en opslag van sperma te gebruiken materialen;
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel5
  - number: 5.1.f
    text: |-
      een aan- en afvoervoorziening voor runderen, die op efficiënte wijze fysiek is afgesloten van de overige ruimten
      van het runderspermawincentrum en die uitsluitend wordt gebruikt ten behoeve van de aan- en afvoer van runderen;
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel5
  - number: 5.1.g
    text: |-
      een ruimte voor de behandeling van sperma, die op efficiënte wijze van de overige ruimten binnen het
      runderspermawincentrum is geïsoleerd, en
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel5
  - number: 5.1.h
    text: |-
      een ruimte voor de opslag en distributie van sperma, die op efficiënte wijze van de overige ruimten binnen het
      runderspermawincentrum is geïsoleerd.
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel5
  - number: '5.2'
    text: |-
      In afwijking van het eerste lid kunnen de onder g en h, bedoelde ruimten zich bevinden op een afzonderlijke
      kadastrale eenheid.
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel5
  - number: '5.3'
    text: |-
      In de in het tweede lid bedoelde situatie is [artikel 4][ref1] op deze ruimten van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0012616#Artikel4
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0012616
        artikel: '4'
        paragraaf: '2'
  - number: '6.1'
    text: |-
      Het runderspermawincentrum beschikt ten behoeve van het toezicht, bedoeld in Bijlage A, Hoofdstuk II, punt 1,
      onderdeel b, van [richtlijn 88/407/EEG](31988L0407), over een door de keuringsdierenarts vanuit één plaats op het
      runderspermawincentrum te raadplegen register dat dagelijks wordt bijgehouden en dat zodanig is ingericht, dat
      daaruit te allen tijde op eenvoudige wijze met betrekking tot elk rund kan worden afgeleid:
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel6
  - number: 6.1.a
    text: het ras;
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel6
  - number: 6.1.b
    text: de geboortedatum;
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel6
  - number: 6.1.c
    text: |-
      het krachtens het [Besluit identificatie en registratie van dieren][ref1] toegekende identificatienummer;


      [ref1]: https://wetten.overheid.nl/BWBR0009019
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0009019
  - number: 6.1.d
    text: gegevens inzake de uitgevoerde vaccinaties;
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel6
  - number: 6.1.e
    text: gegevens uit het ziekte/gezondheidsdossier;
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel6
  - number: 6.1.f
    text: de datum van toelating op het runderspermawincentrum;
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel6
  - number: 6.1.g
    text: de quarantaineruimte dan wel het runderspermawincentrum van waaruit het rund afkomstig is;
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel6
  - number: 6.1.h
    text: |-
      het beslag of bedrijf waar het rund voordat het in de in onderdeel g bedoelde ruimte werd binnengebracht, heeft
      verbleven, en
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel6
  - number: 6.1.i
    text: |-
      de gegevens, waaronder de laboratoriumuitslagen, onder vermelding van de datum, betreffende de in Bijlage B van
      [richtlijn 88/407/EEG](31988L0407) voorgeschreven tests.
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel6
  - number: '6.2'
    text: |-
      De in het eerste lid bedoelde gegevens worden bewaard gedurende de aanwezigheid van het betrokken rund
      op het runderspermawincentrum en tot drie jaar nadat het van het betrokken rund afkomstige sperma van het
      runderspermawincentrum is afgevoerd.
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel6
  - number: '6.3'
    text: |-
      Ten behoeve van het toezicht, bedoeld in Bijlage A, Hoofdstuk II, punt 1, onderdeel f, onder vii, van [richtlijn
      88/407/EEG](31988L0407), zijn op de verpakking van iedere dosis sperma onuitwisbaar de navolgende gegevens vermeld:
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel6
  - number: 6.3.a
    text: het identificatienummer van het betrokken sperma;
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel6
  - number: 6.3.b
    text: de datum waarop het sperma is verkregen;
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel6
  - number: 6.3.c
    text: |-
      het krachtens het [Besluit identificatie en registratie van dieren][ref1] aan de stier waarvan het sperma is
      gewonnen, toegekende identificatienummer, en


      [ref1]: https://wetten.overheid.nl/BWBR0009019
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0009019
  - number: 6.3.d
    text: het identificatienummer van het runderspermawincentrum.
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel6
  - number: '7'
    text: |-
      Een erkend laboratorium als bedoeld in bijlage B, hoofdstuk I, punt 2, en in bijlage B, hoofdstuk II,
      punt 2, van [richtlijn 88/407/EEG](31988L0407), is een laboratorium dat door de minister op grond van
      [artikel 2 van de Regeling erkenning en aanwijzing veterinaire laboratoria][ref1] is erkend.


      [ref1]: https://wetten.overheid.nl/BWBR0019575#Artikel2
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0019575
        artikel: '2'
  - number: '8.1'
    text: De op het runderspermawincentrum aanwezige runderen voldoen aan Bijlage B van [richtlijn 88/407/EEG](31988L0407).
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel8
  - number: '8.2'
    text: |-
      Ten aanzien van het op het runderspermawincentrum verkregen en opgeslagen sperma wordt voldaan aan Bijlage A,
      Hoofdstuk I, punt 1, en Hoofdstuk II, punt 1, en Bijlage C van [richtlijn 88/407/EEG](31988L0407).
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel8
  - number: '9.1'
    text: 'Bij de aanvraag om erkenning van een runderspermawincentrum worden de volgende gegevens verstrekt:'
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel9
  - number: 9.1.a
    text: de naam, het adres en de vestigingsplaats van het runderspermawincentrum;
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel9
  - number: 9.1.b
    text: |-
      het aan het runderspermawincentrum krachtens het [Besluit identificatie en registratie van dieren][ref1] uitgegeven
      uniek bedrijfsnummer;


      [ref1]: https://wetten.overheid.nl/BWBR0009019
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0009019
  - number: 9.1.c
    text: |-
      een plattegrond van kadastrale eenheden waarop het runderspermawincentrum is gesitueerd, waarbij is aangegeven: -
      de afscheiding ten opzichte van de directe omgeving;
        - de afstand en de aard van de omliggende bedrijven, en
        - de ligging van de in [artikel 5, eerste lid][ref1], van deze regeling bedoelde ruimten en voorzieningen;


      [ref1]: https://wetten.overheid.nl/BWBR0012616#Artikel5
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0012616
        artikel: '5'
        paragraaf: '2'
  - number: 9.1.d
    text: |-
      voor zover de in [artikel 5, eerste lid, onder g en h][ref1], bedoelde voorzieningen niet zijn gelegen op de
      kadastrale eenheden waarop het runderspermawincentrum is gesitueerd, de naam, het adres en de vestigingsplaats van
      deze voorzieningen, en


      [ref1]: https://wetten.overheid.nl/BWBR0012616#Artikel5
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0012616
        artikel: '5'
        paragraaf: '2'
  - number: 9.1.e
    text: de naam van de dierenarts van het centrum.
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel9
  - number: '9.2'
    text: |-
      De aanvraag, bedoeld in het eerste lid, gaat vergezeld van een aanvraag om erkenning als bedoeld in
      [artikel 15][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012616#Artikel15
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0012616
        artikel: '15'
        paragraaf: '3'
  - number: '10.1'
    text: |-
      De erkenning wordt door de minister verleend, nadat uit een door de keuringsdierenarts ingesteld onderzoek is
      gebleken, dat voldaan wordt aan de in [artikel 9, tweede lid, van het besluit][ref1] bedoelde voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0010619#Artikel9
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0010619
        artikel: '9'
  - number: '10.2'
    text: |-
      De minister neemt gelijktijdig met de verlening van de erkenning, bedoeld in het eerste lid, een besluit omtrent de
      aanvraag om erkenning, bedoeld in [artikel 15][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012616#Artikel15
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0012616
        artikel: '15'
        paragraaf: '3'
  - number: '11.1'
    text: |-
      De keuringsdierenarts is belast met de in Bijlage A, Hoofdstuk II, punt 1, onderdeel c, van [richtlijn 88/407/EEG]
      (31988L0407), bedoelde controle.
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel11
  - number: '11.2'
    text: |-
      De eigenaar of de exploitant van een runderspermawincentrum dan wel diens vertegenwoordiger draagt er zorg voor dat
      de keuringsdierenarts alle medewerking wordt verleend die deze redelijkerwijs voor de vervulling van zijn taken in
      het kader van de in het eerste lid bedoelde controle noodzakelijk acht en dat diens aanwijzingen terzake door de
      dierenarts en het personeel van het centrum worden opgevolgd.
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel11
  - number: '12.1'
    text: |-
      De minister trekt de verleende erkenning in, indien de keuringsdierenarts heeft geconstateerd dat de in
      [artikel 9, tweede lid][ref1], van het besluit bedoelde voorschriften niet worden nageleefd dan wel dat niet
      voldaan wordt aan [artikel 11 tweede lid][ref2], en [artikel 14][ref3], doch niet dan nadat gedurende een redelijke
      termijn gelegenheid is gegeven de voor het behoud van de erkenning noodzakelijke voorzieningen te treffen.


      [ref1]: https://wetten.overheid.nl/BWBR0010619#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0012616#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0012616#Artikel14
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0010619
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0012616
        artikel: '11'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0012616
        artikel: '14'
        paragraaf: '3'
  - number: '12.2'
    text: 'De minister schorst de verleende erkenning, indien:'
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel12
  - number: 12.2.a
    text: |-
      een of meer van de krachtens Bijlage B, Hoofdstuk II van [richtlijn 88/407/EEG](31988L0407) uit te voeren
      routinetests een positief resultaat heeft opgeleverd, of
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel12
  - number: 12.2.b
    text: |-
      het runderspermawincentrum is gelegen in een gebied waarvoor beperkingen gelden op grond van de communautaire
      regelgeving inzake besmettelijke ziekten bij runderen dan wel op grond van Hoofdstuk II, Afdeling 3, van de wet;
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel12
  - number: '12.3'
    text: 'De in het tweede lid bedoelde schorsing wordt opgeheven:'
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel12
  - number: 12.3.a
    text: |-
      voorzover deze het gevolg was van de in het tweede lid, onder a, bedoelde omstandigheid, indien de
      gezondheidsstatus van het runderspermawincentrum is hersteld, of
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel12
  - number: 12.3.b
    text: |-
      voorzover deze het gevolg was van de in het tweede lid, onder b, bedoelde omstandigheid, indien de in dat onderdeel
      bedoelde beperkingen zijn opgeheven.
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel12
  - number: '12.4'
    text: |-
      Indien de erkenning ingevolge dit artikel is ingetrokken of is geschorst, kan de minister gelasten dat het in de
      door hem vast te stellen periode direct voorafgaand aan de intrekking of schorsing aanwezige of gewonnen sperma,
      in tijdelijke afzondering wordt geplaatst dan wel wordt vernietigd, met inachtneming van diens aanwijzingen, zonder
      vergoeding van Staatswege en voor rekening van de exploitant van het runderspermawincentrum.
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel12
  - number: '12.5'
    text: |-
      Het vierde lid is van overeenkomstige toepassing op van andere runderspermawincentra afkomstig sperma dat
      is behandeld of opgeslagen in de in [artikel 5, eerste lid, onder g en h][ref1], bedoelde ruimten van het
      runderspermawincentrum waarvan de erkenning is geschorst of is ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0012616#Artikel5
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0012616
        artikel: '5'
        paragraaf: '2'
  - number: '12.6'
    text: |-
      Onverminderd het eerste lid wordt de erkenning ingetrokken indien niet voldaan wordt aan de krachtens het vierde
      lid gelaste maatregelen.
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel12
  - number: '13'
    text: |-
      Een runderspermawincentrum waarvan de erkenning werd ingetrokken of waarvan een aanvraag voor het opnieuw verlenen
      van de erkenning werd afgewezen en dat weer voor erkenning in aanmerking wenst te komen, moet opnieuw een aanvraag
      indienen, de gegevens, bedoeld in [artikel 9][ref1], opnieuw verstrekken en tevens kunnen aantonen, dat de
      omstandigheden welke tot de intrekking dan wel de afwijzing hebben geleid, zijn opgeheven.


      [ref1]: https://wetten.overheid.nl/BWBR0012616#Artikel9
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0012616
        artikel: '9'
        paragraaf: '3'
  - number: '14'
    text: |-
      Een erkend runderspermawincentrum stelt de minister in kennis van elke wijziging van de bij de oorspronkelijke
      aanvraag verstrekte gegevens.
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel14
  - number: '15.1'
    text: |-
      Een quarantaineruimte als bedoeld in Bijlage B, Hoofdstuk I, van [richtlijn 88/407/EEG](31988L0407) wordt na een
      daartoe strekkende aanvraag door de minister erkend, nadat uit een door de keuringsdierenarts ingesteld onderzoek
      is gebleken dat voldaan wordt aan [artikel 16][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012616#Artikel16
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0012616
        artikel: '16'
        paragraaf: '3'
  - number: '15.2'
    text: Aan een erkende quarantaineruimte wordt in verband met de erkenning een registratienummer toegekend.
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel15
  - number: '15.3'
    text: 'Bij de aanvraag om erkenning van een quarantaineruimte worden de volgende gegevens verstrekt:'
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel15
  - number: 15.3.a
    text: de naam, het adres en de vestigingsplaats van de quarantaineruimte;
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel15
  - number: 15.3.b
    text: |-
      het aan de quarantaineruimte krachtens het [Besluit identificatie en registratie van dieren][ref1] uitgegeven uniek
      bedrijfsnummer;


      [ref1]: https://wetten.overheid.nl/BWBR0009019
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0009019
  - number: 15.3.c
    text: |-
      een plattegrond van kadastrale eenheden waarop de quarantaineruimte is gesitueerd, waarbij is aangegeven: -
      afscheiding ten opzichte van de directe omgeving;
        - afstand en aard van de omliggende bedrijven, en
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel15
  - number: 15.3.d
    text: de naam van de aan de quarantaineruimte verbonden dierenarts.
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel15
  - number: '15.4'
    text: |-
      De minister trekt de verleende erkenning in, indien de keuringsdierenarts heeft geconstateerd dat de van toepassing
      zijnde voorschriften van [artikel 16][ref1] niet worden nageleefd, doch niet dan nadat gedurende een redelijke
      termijn gelegenheid is gegeven, de voor het behoud van de erkenning noodzakelijke voorzieningen te treffen.


      [ref1]: https://wetten.overheid.nl/BWBR0012616#Artikel16
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0012616
        artikel: '16'
        paragraaf: '3'
  - number: '16'
    text: 'Een erkende quarantaineruimte voldoet aan de volgende eisen:'
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel16
  - number: 16.a
    text: de quarantaineruimte is zodanig omheind, dat vrije toegang tot de quarantaineruimte niet mogelijk is;
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel16
  - number: 16.b
    text: |-
      voor het personeel en de bezoekers is een hygiënesluis aanwezig die zodanig gesitueerd is, dat zij deze passeren
      alvorens zij de quarantaineruimte betreden. De hygiënesluis is voorzien van omkleed- en douchefaciliteiten. Schone
      bedrijfskleding en laarzen zijn in de hygiënesluis aanwezig;
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel16
  - number: 16.c
    text: |-
      de quarantaineruimte beschikt over: - een stalruimte voor de dagelijkse huisvesting en verzorging van de runderen
      die op efficiënte wijze fysiek is afgesloten van de overige ruimten van de quarantaineruimte;
        - een voorziening voor de reiniging en ontsmetting van de gebruikte materialen, en
        - voor runderen ontoegankelijke ruimten voor de opslag van stro, voer, kleding en medicijnen;
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel16
  - number: 16.d
    text: |-
      de quarantaineruimte voldoet aan de relevante voorschriften van Bijlage B, hoofdstuk I, van [richtlijn 88/407/
      EEG](31988L0407);
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel16
  - number: 16.e
    text: |-
      de eigenaar of exploitant van de quarantaineruimte dan wel diens vertegenwoordiger draagt ervoor zorg dat het
      personeel en de bezoekers zich douchen en zich kleden met schone bedrijfskleding en laarzen voordat zij de
      quarantaineruimte betreden;
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel16
  - number: 16.f
    text: |-
      de quarantaineruimte beschikt over een door de keuringsdierenarts vanuit één plaats op de quarantaineruimte
      te raadplegen register dat dagelijks wordt bijgehouden en dat zodanig is ingericht, dat daaruit te
      allen tijde op eenvoudige wijze met betrekking tot elk rund kan worden afgeleid: - het krachtens het
      [Besluit identificatie en registratie van dieren][ref1] toegekende identificatienummer;
        - gegevens inzake de uitgevoerde vaccinaties;
        - gegevens uit het ziekte/gezondheidsdossier;
        - de datum van toelating op de quarantaineruimte;
        - het beslag of bedrijf van waaruit het rund afkomstig is, en
        - de gegevens, waaronder de laboratoriumuitslagen, onder vermelding van de datum, betreffende de in Bijlage B,
      Hoofdstuk I, punt 1, onderdeel d en e, van [richtlijn 88/407/EEG](31988L0407) voorgeschreven tests, en


      [ref1]: https://wetten.overheid.nl/BWBR0009019
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0009019
  - number: 16.g
    text: |-
      de keuringsdierenarts wordt in verband met het door hem uit te oefenen toezicht op de naleving van onderdeel a tot
      en met g, praktisch in de gelegenheid gesteld de werkzaamheden van de quarantaineruimte te controleren.
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel16
  - number: '17'
    text: |-
      De eigenaar of exploitant van een runderspermawincentrum dan wel diens vertegenwoordiger voorziet in een
      calamiteitenplan dat ten minste voorschriften bevat omtrent:
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel17
  - number: 17.a
    text: |-
      de onverwijlde interne melding aan de dierenarts van het centrum van afwijkingen van de wettelijke voorschriften en
      de daarop gebaseerde interne procedures;
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel17
  - number: 17.b
    text: |-
      het onverwijld melden aan de keuringsdierenarts van mogelijke verdenking van ingevolge artikel 15 van de wet
      aangewezen ziekten;
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel17
  - number: 17.c
    text: |-
      het uitoefenen van de interne controle op de naleving van de relevante wettelijke voorschriften en de daarop
      gebaseerde interne procedures, en
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel17
  - number: 17.d
    text: |-
      de wijze van optreden bij incidenten, ongevallen en afwijkingen van de geldende regels, alsmede de evaluatie en
      rapportage hierover aan de eigenaar of exploitant van het runderspermawincentrum dan wel diens vertegenwoordiger
      alsmede aan de dierenarts van het centrum.
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel17
  - number: '18.1'
    text: |-
      De eigenaar of exploitant van een runderspermawincentrum dan wel diens vertegenwoordiger beschikt over een door
      de keuringsdierenarts vanuit één plaats op het runderspermawincentrum te raadplegen register, dat dagelijks wordt
      bijgehouden en dat zodanig is ingericht, dat daaruit op elk moment op eenvoudige wijze met betrekking elke winning
      kan worden afgeleid:
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel18
  - number: 18.1.a
    text: het aan de winning toegekende identificatienummer;
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel18
  - number: 18.1.b
    text: de datum waarop het sperma is verkregen;
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel18
  - number: 18.1.c
    text: de lichaamstemperatuur en de status van de stier;
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel18
  - number: 18.1.d
    text: de eventuele calamiteiten die zich bij het verkrijgen van het sperma hebben voorgedaan;
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel18
  - number: 18.1.e
    text: |-
      het krachtens het [Besluit identificatie en registratie van dieren][ref1] aan de stier waarvan het sperma is
      gewonnen, toegekende identificatienummer, en


      [ref1]: https://wetten.overheid.nl/BWBR0009019
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0009019
  - number: 18.1.f
    text: de doses waarin de winning is verdeeld.
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel18
  - number: '18.2'
    text: |-
      De in het eerste lid bedoelde gegevens worden bewaard tot drie jaar nadat de laatste dosis van de betrokken winning
      van het runderspermawincentrum is afgevoerd.
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel18
  - number: '19'
    text: |-
      De eigenaar of exploitant van een runderspermawincentrum dan wel diens vertegenwoordiger beschikt over een
      administratie waarmee de keuringsdierenarts op elk moment een overzicht kan worden geboden van het sperma dat
      in het runderspermawincentrum gewonnen dan wel opgeslagen is, en die de tracering van contacten tussen het
      runderspermawincentrum met inseminatoren, dierenartsen, vervoerders, handelaren en gebruikers van het sperma
      inzichtelijk maakt.
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel19
  - number: '20.1'
    text: |-
      De in [artikel 19][ref1] bedoelde administratie is zodanig ingericht, dat daaruit op elk moment op eenvoudige wijze
      met betrekking tot elke transactie kan worden afgeleid:


      [ref1]: https://wetten.overheid.nl/BWBR0012616#Artikel19
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0012616
        artikel: '19'
        paragraaf: '4'
  - number: 20.1.a
    text: de datum van de transactie;
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel20
  - number: 20.1.b
    text: het identificatienummer van het betrokken sperma;
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel20
  - number: 20.1.c
    text: het ontvangen of afgeleverde aantal doses sperma;
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel20
  - number: 20.1.d
    text: de naam en het adres van de ontvanger of de leverancier,
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel20
  - number: 20.1.e
    text: het registratienummer van het runderspermawincentrum waar het sperma gewonnen is, en
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel20
  - number: 20.1.f
    text: |-
      indien het buiten Nederland gewonnen sperma betreft, het nummer van het gezondheidscertificaat, bedoeld in artikel
      9.5, onderdeel a, of in artikel 9.6, derde lid, onderdeel a, van de Regeling handel levende dieren en levende
      producten, alsmede de datum waarop dit sperma binnen Nederland is gebracht.
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel20
  - number: '20.2'
    text: |-
      De in het eerste lid bedoelde gegevens worden bewaard tot drie jaar nadat het betrokken sperma van het
      runderspermawincentrum is afgevoerd.
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel20
  - number: '21.1'
    text: |-
      Een partij sperma gaat bij afvoer van de kadastrale eenheid, waarop het runderspermawincentrum is gelegen,
      vergezeld van een geleidebiljet, waarop met betrekking tot de partij de volgende gegevens zijn vermeld:
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel21
  - number: 21.1.a
    text: de datum van afvoer;
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel21
  - number: 21.1.b
    text: het identificatienummer van het betrokken sperma;
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel21
  - number: 21.1.c
    text: |-
      het krachtens het [Besluit identificatie en registratie van dieren][ref1] aan de stier waarvan het sperma is
      gewonnen, toegekende identificatienummer;


      [ref1]: https://wetten.overheid.nl/BWBR0009019
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0009019
  - number: 21.1.d
    text: het aantal doses sperma;
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel21
  - number: 21.1.e
    text: de naam en het adres van de ontvanger, en
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel21
  - number: 21.1.f
    text: |-
      indien het buiten Nederland gewonnen sperma betreft, het nummer van het
      gezondheidscertificaat, bedoeld in [artikel 9.5, onderdeel a][ref1], of in
      [artikel 9.6, derde lid, onderdeel a, van de Regeling handel levende dieren en levende producten][ref2], alsmede de
      datum waarop dit sperma binnen Nederland is gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0007049#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0007049#Artikel9
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0007049
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0007049
        artikel: '9'
  - number: '21.2'
    text: |-
      In afwijking van het eerste lid gaat een partij sperma bij afvoer van de kadastrale eenheid, waarop het
      runderspermawincentrum is gelegen, vergezeld van:
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel21
  - number: 21.2.a
    text: |-
      een nationaal document, overeenkomstig de eisen op grond van artikel 6, eerste lid, van richtlijn 88/407/EEG,
      indien een partij sperma bestemd is om overeenkomstig de [Regeling handel levende dieren en levende producten][ref1]
      buiten Nederland te worden gebracht, en voorafgaand daaraan in Nederland vervoerd wordt naar een nationaal
      spermawincentrum of nationaal spermaopslagcentrum of meerdere spermawincentra of spermaopslagcentra, of


      [ref1]: https://wetten.overheid.nl/BWBR0007049
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0007049
  - number: 21.2.b
    text: |-
      een document als bedoeld in
      [artikel 9.2, onderdeel a, van de Regeling handel levende dieren en levende producten][ref1], indien een partij
      sperma overeenkomstig die regeling rechtstreeks buiten Nederland wordt gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0007049#Artikel9
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0007049
        artikel: '9'
  - number: '22'
    text: |-
      Het is de eigenaar of exploitant van een runderspermawincentrum dan wel diens vertegenwoordiger uitsluitend
      toegestaan rundersperma voorhanden te hebben, in voorraad te hebben, te bewaren, op te slaan, te
      gebruiken, te ontvangen of af te leveren indien op de verpakking van iedere dosis sperma onuitwisbaar de in
      [artikel 6, derde lid][ref1], bedoelde gegevens zijn vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0012616#Artikel6
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0012616
        artikel: '6'
        paragraaf: '2'
  - number: '23.1'
    text: |-
      Degene die rundersperma vervoert of verhandelt, beschikt over een administratie waarmee de keuringsdierenarts
      op elk moment een overzicht kan worden geboden van het sperma dat hij in voorraad heeft of heeft gehad en die
      de tracering van contacten met het runderspermawincentrum waar het sperma gewonnen is alsmede met inseminatoren,
      dierenartsen, vervoerders, handelaren en gebruikers van het sperma inzichtelijk maakt.
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel23
  - number: '23.2'
    text: |-
      [Artikel 20][ref1] is op de in het eerste lid bedoelde administratie van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0012616#Artikel20
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0012616
        artikel: '20'
        paragraaf: '4'
  - number: '24'
    text: |-
      Een partij sperma is gedurende het vervoer en de verhandeling voorzien van het document, bedoeld in
      [artikel 21, eerste of tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012616#Artikel21
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0012616
        artikel: '21'
        paragraaf: '4'
  - number: '25'
    text: |-
      Het is uitsluitend toegestaan rundersperma voorhanden te hebben, in voorraad te hebben, te bewaren, op te slaan,
      te gebruiken, te ontvangen of af te leveren indien op de verpakking ervan onuitwisbaar de navolgende gegevens zijn
      vermeld:
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel25
  - number: 25.a
    text: het identificatienummer van het betrokken sperma;
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel25
  - number: 25.b
    text: de datum waarop het sperma is verkregen;
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel25
  - number: 25.c
    text: |-
      het krachtens het [Besluit identificatie en registratie van dieren][ref1] aan de stier waarvan het sperma is
      gewonnen, toegekende identificatienummer, en


      [ref1]: https://wetten.overheid.nl/BWBR0009019
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0009019
  - number: 25.d
    text: het identificatienummer van het runderspermawincentrum.
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel25
  - number: 25a
    text: |-
      In afwijking van [artikel 11 van het besluit][ref1] is het toegestaan om rundersperma te vervoeren of te
      verhandelen, voor zover het rundersperma betreft dat is opgeslagen in een spermaopslagcentrum dat is erkend
      overeenkomstig [artikel 9.10a van de Regeling handel levende dieren en levende producten][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0010619#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0007049#Artikel9
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel25a
    references:
      - id: ref1
        bwb_id: BWBR0010619
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0007049
        artikel: '9'
  - number: '26.1'
    text: |-
      Degene die ingevolge deze regeling gegevens moet bijhouden of vermelden op daartoe bestemde bescheiden, doet dit
      volledig, juist en naar waarheid.
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel26
  - number: '26.2'
    text: |-
      Het bijhouden of vermelden van de in het eerste lid bedoelde gegevens geschiedt onverwijld nadat de gegevens bekend
      zijn bij degene die deze ingevolge deze regeling moet bijhouden of vermelden.
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel26
  - number: '27'
    text: |-
      Quarantaineruimten worden, onder de voorwaarde dat een daartoe strekkende volledige aanvraag als bedoeld in
      [artikel 15][ref1] binnen drie maanden na inwerkingtreding van deze regeling is ingediend, voor de duur van zes
      maanden na inwerkingtreding van deze regeling voorlopig erkend als quarantaineruimte of tot zoveel eerder als op
      die aanvraag onherroepelijk zal zijn besloten.


      [ref1]: https://wetten.overheid.nl/BWBR0012616#Artikel15
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0012616
        artikel: '15'
        paragraaf: '3'
  - number: '28'
    text: Deze regeling treedt in werking met ingang van 1 juli 2001.
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel28
  - number: '29'
    text: 'Deze regeling wordt aangehaald als: Regeling rundersperma.'
    url: https://wetten.overheid.nl/BWBR0012616/2019-12-14#Artikel29
