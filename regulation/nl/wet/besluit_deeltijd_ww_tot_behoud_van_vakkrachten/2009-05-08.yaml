      1 Dit besluit treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin dit
      wordt geplaatst, werkt terug tot en met 1 april 2009 en vervalt met ingang van 1 januari 2010.

      2 In afwijking van het eerste lid blijft dit besluit van toepassing op verkortingen van de werktijd waarbij
      voor 1 januari 2010 is voldaan aan [artikel 1, eerste lid][ref1], alsmede op de verlenging, bedoeld in
      [artikel 2][ref2], en de afwikkeling van de vergoedingen, bedoeld in [artikel 3][ref3].


