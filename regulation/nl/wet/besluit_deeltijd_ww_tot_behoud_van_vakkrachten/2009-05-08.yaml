  - number: '2'
    text: |-
      De periode van verkorting van de werktijd, bedoeld in [artikel 1, eerste lid][ref1], bedraagt ten hoogste 13
      aaneengesloten kalenderweken en kan twee maal aansluitend met een periode van ten hoogste 26 aaneengesloten
      kalenderweken worden verlengd. Verlenging is alleen toegestaan, indien daarbij wordt voldaan aan de voorwaarden,
      bedoeld in [artikel 1, eerste lid, aanhef en onderdelen a tot en met d][ref2]. Daarnaast geldt als voorwaarde voor
      verlenging dat de werkgever schriftelijk verslag doet van de uitvoering van de in de voorafgaande periode gemaakte
      afspraken, bedoeld in [artikel 1, eerste lid, onderdeel c][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0025609#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0025609#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0025609#Artikel1
