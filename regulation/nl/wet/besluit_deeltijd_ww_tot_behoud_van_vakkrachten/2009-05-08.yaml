  - number: '3'
    text: |-
      1 De vergoeding, bedoeld in [artikel 1, eerste lid, onderdeel d][ref1], is verschuldigd indien:

      a. in de periode van verkorting van de werktijd de werkloosheid uit de dienstbetrekking met de werkgever in een
      aaneengesloten periode van vier kalenderweken waarover uitkering op grond van de [Werkloosheidswet][ref2] wordt
      betaald gemiddeld meer bedraagt dan de omvang waarmee de werktijd is verkort op grond van [artikel 1][ref3];

      b. de werknemer in de periode van 13 weken onmiddellijk na afloop van de periode van verkorting van de werktijd
      geheel of gedeeltelijk werkloos blijft of wordt uit de dienstbetrekking met de werkgever en in verband daarmee
      recht houdt of krijgt op uitkering op grond van de [Werkloosheidswet][ref4].

      2 Voor de toepassing van het eerste lid, onderdeel b, geldt in plaats van een periode van 13 weken een periode
      overeenkomend met een derde van de schriftelijk vastgelegde periode van verkorting van de werktijd, indien dat
      laatste langer is.

      3 De vergoeding is niet verschuldigd indien de omstandigheid, bedoeld in het eerste lid, het gevolg is van:

      a. opzegging van de dienstbetrekking door de werkgever om een dringende reden in de zin van
      [artikel 678 van Boek 7 van het Burgerlijk Wetboek][ref5]; of

      b. opzegging van de dienstbetrekking door de werknemer dan wel ontbinding van de dienstbetrekking op diens verzoek.

      4 De vergoeding, bedoeld in [artikel 1, eerste lid, onderdeel d][ref6], bedraagt:

      a. in het geval, bedoeld in het eerste lid, onderdeel a, de helft van het bedrag van de bruto uitkering op grond
      van de [Werkloosheidswet][ref7], vermeerderd met de daarover door het Uitvoeringsinstituut werknemersverzekeringen
      verschuldigde premies en de vergoeding, bedoeld in [artikel 46 van de Zorgverzekeringswet][ref8], die het
      Uitvoeringsinstituut werknemersverzekeringen heeft uitbetaald over de periode voorafgaand aan de in het eerste lid,
      onderdeel a, bedoelde periode van vier weken;

      b. in het geval, bedoeld in het eerste lid, onderdeel b, de helft van het bedrag van de bruto uitkering op grond
      van de [Werkloosheidswet][ref9], vermeerderd met de daarover door het Uitvoeringsinstituut werknemersverzekeringen
      verschuldigde premies en de vergoeding, bedoeld in [artikel 46 van de Zorgverzekeringswet][ref10], die het
      Uitvoeringsinstituut werknemersverzekeringen heeft uitbetaald over de schriftelijk vastgelegde periode van
      verkorting van de werktijd.


