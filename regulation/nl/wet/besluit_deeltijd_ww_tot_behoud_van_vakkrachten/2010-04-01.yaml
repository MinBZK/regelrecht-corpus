  - number: '2'
    text: |-
      1 De periode van verkorting van de werktijd, bedoeld in [artikel 1, eerste lid][ref1], bedraagt 13 aaneengesloten
      kalenderweken en kan aansluitend telkens met een periode van 13 aaneengesloten kalenderweken worden verlengd.
      In afwijking van de eerste zin bedraagt de periode van verkorting van de werktijd, bedoeld in artikel 1, eerste
      lid, dan wel de periode van verlenging minder dan 13 aaneengesloten kalenderweken indien deze op grond van
      het vijfde lid eindigt voor ommekomst van die 13 weken. Verlenging is alleen toegestaan, indien daarbij wordt
      voldaan aan de voorwaarden, bedoeld in artikel 1, eerste lid, aanhef en onderdelen a tot en met d en h. Daarnaast
      geldt als voorwaarde voor verlenging dat uit een schriftelijk verslag van de werkgever en de desbetreffende
      vertegenwoordiging van werknemers blijkt dat uitvoering is gegeven aan de over de voorafgaande periode gemaakte
      afspraken, bedoeld in artikel 1, eerste lid, onderdeel c.

      2 De verlenging, bedoeld in het eerste lid, is niet toegestaan voor zover het werknemers betreft waarvan de
      verkorting van de werktijd in de voorafgaande periode gemiddeld niet ten minste 20% bedraagt.

      3 Het aantal verlengingen bedraagt:

      a. ten hoogste vier indien het aantal werknemers waarvan de werkgever de werktijd kan verkorten ten hoogste 30%
      bedraagt;

      b. ten hoogste drie indien het aantal werknemers waarvan de werkgever de werktijd kan verkorten meer bedraagt dan
      30% doch ten hoogste 60%;

      c. ten hoogste twee indien het aantal werknemers waarvan de werkgever de werktijd kan verkorten meer bedraagt dan
      60%.

      4 Het percentage werknemers waarvoor de werktijd kan worden verkort wordt bepaald door het aantal werknemers
      waarvan de werktijd in de eerste periode van 13 aaneengesloten kalenderweken kan worden verkort, te vergelijken met
      het totale aantal werknemers van de werkgever op 1 april 2009.

      5 Indien de periode van verkorting van de werktijd, bedoeld in [artikel 1, eerste lid][ref2], is aangevangen op of
      na 1 april 2010, eindigt die periode of de verlenging daarvan uiterlijk:

      a. op 1 juli 2011 indien het aantal werknemers waarvan de werkgever de werktijd kan verkorten ten hoogste 30%
      bedraagt;

      b. op 1 april 2011 indien het aantal werknemers waarvan de werkgever de werktijd kan verkorten meer bedraagt dan
      30% doch ten hoogste 60%;

      c. op 1 januari 2011 indien het aantal werknemers waarvan de werkgever de werktijd kan verkorten meer bedraagt
      dan 60%,

      indien die datum eerder is gelegen dan de eindigingsdatum op grond van het eerste tot en met vierde lid.


