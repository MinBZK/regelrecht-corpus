preamble:
  text: |-
    Gelet op artikel 8, derde lid, van het Buitengewoon Besluit Arbeidsverhoudingen 1945;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0025609/2010-04-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In afwijking van [artikel 8, eerste lid, van het Buitengewoon Besluit Arbeidsverhoudingen 1945][ref1] is het
      een werkgever toegestaan eenmalig de werktijd van een of meer van zijn werknemers gedurende een van tevoren
      schriftelijk vastgelegde periode over een periode van 13 weken gemiddeld met ten minste 20% en ten hoogste 50% te
      verkorten indien:

      a. de werkgever schriftelijk aantoont dat:

      1°. als het de verkorting van de werktijd van 20 of meer werknemers betreft, de belanghebbende verenigingen van
      werknemers, en bij gebreke daarvan een andere vertegenwoordiging van werknemers, met de verkorting instemmen,

      2°. als het de verkorting van de werktijd van minder dan 20 werknemers betreft, een vertegenwoordiging van zijn
      werknemers met de verkorting instemt;

      b. de werkgever met de desbetreffende vertegenwoordiging van werknemers schriftelijk afspraken heeft gemaakt om het
      loon door te betalen voor zover de betrokken werknemers op grond van de criteria van de [Werkloosheidswet][ref2]
      geen recht hebben op een uitkering op grond van die wet over de uren waarmee de werktijd is verkort;

      c. de werkgever met de desbetreffende vertegenwoordiging van werknemers schriftelijk afspraken heeft gemaakt om in
      de periode gedurende welke de werktijd wordt verkort:

      1°. door middel van scholing, die naar haar aard en omvang daartoe geschikt is, de inzetbaarheid van de werknemers
      van wie de werktijd wordt verkort in zijn bedrijf of in het bedrijf van een andere werkgever te behouden of te
      verbeteren,

      2°. het verrichten van arbeid door de werknemers waarvan de werktijd wordt verkort in het bedrijf van een andere
      werkgever mogelijk te maken;

      d. de werkgever zich jegens het Uitvoeringsinstituut werknemersverzekeringen schriftelijk heeft verplicht aan
      het Uitvoeringsinstituut werknemersverzekeringen een vergoeding te betalen als bedoeld in [artikel 3][ref3],
      overeenkomstig de modelovereenkomst die als [bijlage 1][ref4] bij deze regeling is gevoegd;

      e.

      f. ingeval de in de aanhef bedoelde periode aanvangt op of na 1 april 2010, de werkgever geen ontheffing heeft
      gehad op grond van de [Bijzondere beleidsregels ontheffing verbod op werktijdverkorting 2008][ref5] of de
      [Verlengde bijzondere beleidsregels ontheffing verbod op werktijdverkorting 2008][ref6];

      g. de werkgever met de desbetreffende vertegenwoordiging van werknemers schriftelijk het voornemen heeft
      afgesproken de verkorting van de werktijd na de eerste periode van 13 weken te verlengen met een periode van 13
      weken;

      h. de dienstbetrekking van een werknemer van wie de werktijd wordt verkort in de periode van werktijdverkorting
      niet zal eindigen.

      2 In de schriftelijke afspraken, bedoeld in het eerste lid, onderdeel c, 1°, wordt per werknemer vermeld om welke
      scholing het gaat.

      3 De schriftelijke afspraken, bedoeld in het eerste lid, onderdeel c, 1°, kunnen voor daarin benoemde werknemers
      inhouden dat, in afwijking van dat onderdeel en het tweede lid, die werknemers geen scholing volgen maar door
      middel van het geven van scholing de vakbekwaamheid verbeteren van werknemers die nog geen jaar in dienst zijn
      van de werkgever of die voor de werkgever werkzaam zijn op basis van een stage-overeenkomst. Het aantal werknemers
      dat scholing geeft mag daarbij in ieder geval niet groter zijn dan het aantal werknemers en stagiairs dat scholing
      ontvangt.

      4 Indien een vereniging van werknemers of vertegenwoordiging van werknemers als bedoeld in het eerste lid,
      onderdeel a, niet instemt met de verkorting van de werktijd en de weigering is gebaseerd op andere gronden
      dan met dit besluit worden beoogd, kan de werkgever dit schriftelijk melden aan het meldpunt, genoemd in
      [artikel 3a][ref7]. Evenzo kunnen een vereniging van werknemers of vertegenwoordiging van werknemers als bedoeld
      in het eerste lid, onderdeel a, indien er een verschil van mening bestaat met de werkgever dat een onoverkomelijke
      belemmering vormt voor de instemming, dit schriftelijk melden aan het meldpunt, genoemd in [artikel 3a][ref8].

      5 Bij de melding geeft de werkgever of de desbetreffende vereniging of vertegenwoordiging van werknemers
      informatie over de redenen van de melding en verstrekt de overige daarbij van belang zijnde gegevens. De werkgever
      onderscheidenlijk de desbetreffende vereniging of vertegenwoordiging van werknemers doen de andere partij bij het
      geschil onverwijld mededeling van de melding en de inhoud daarvan.

      6 Het is een werkgever niet langer toegestaan de werktijd op grond van het eerste lid te verkorten indien het
      Uitvoeringsinstituut werknemersverzekeringen hem heeft medegedeeld dat aan één of meer van zijn werknemers ten
      onrechte of tot een te hoog bedrag aan uitkering is betaald op grond van de [Werkloosheidswet][ref9] als gevolg van
      het niet nakomen van de verplichting, bedoeld in [artikel 25 van de Werkloosheidswet][ref10], met betrekking tot
      het voor de werkgever verrichte aantal uren arbeid. Het is een werkgever evenmin langer toegestaan de werktijd op
      grond van het eerste lid te verkorten indien het Uitvoeringsinstituut werknemersverzekeringen hem heeft medegedeeld
      dat hetgeen de werkgever en de desbetreffende vertegenwoordiging van werknemers in het schriftelijk verslag,
      bedoeld in [artikel 2, eerste lid][ref11], hebben verklaard, niet in overeenstemming met de waarheid is.


