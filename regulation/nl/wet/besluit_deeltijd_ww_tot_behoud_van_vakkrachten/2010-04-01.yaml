  - number: 3a
    text: |-
      1 Er is een Meldpunt deeltijd WW, ressorterend onder de Minister van Sociale Zaken en Werkgelegenheid.

      2 Het Meldpunt deeltijd WW stelt de daartoe door de centrale organisaties van werkgevers aangewezen
      vertegenwoordiger alsmede de daartoe door de centrale organisaties van werknemers aangewezen vertegenwoordiger in
      kennis van een melding met het verzoek om daarover informatie te geven en zo nodig tussen partijen te bemiddelen.

      3 De vertegenwoordigers, bedoeld in het tweede lid, brengen uiterlijk twee weken nadat zij de melding, bedoeld in
      het tweede lid, hebben ontvangen aan het Meldpunt deeltijd WW een gezamenlijk verslag uit met informatie over de
      melding en de resultaten van de bemiddeling.
    url: https://wetten.overheid.nl/BWBR0025609/2010-04-01#Artikel3a
  - number: 3b
    text: |-
      1 Het is de werkgever toegestaan eenmalig de werktijd van werknemers te verkorten met ten hoogste 50% gedurende een
      van te voren schriftelijk vastgelegde periode indien:

      a. de Minister van Sociale Zaken en Werkgelegenheid vaststelt dat:

      1°. er sprake is van een situatie als bedoeld in [artikel 1, vierde lid][ref1];

      2°. uit het schriftelijke verslag, bedoeld in [artikel 3a, derde lid][ref2], blijkt dat de bemiddeling niet tot
      instemming als bedoeld in [artikel 1, eerste lid, onderdeel a][ref3] heeft geleid dan wel het verslag niet binnen
      de in artikel 3a, derde lid, genoemde termijn is uitgebracht;

      b. de betrokken werknemers instemmen met de verkorting van de werktijd.

      2 De [artikelen 1, eerste lid, onderdelen b tot en met h, tweede, derde en zesde lid][ref4], [2][ref5] en
      [3][ref6] zijn van overeenkomstige toepassing.


