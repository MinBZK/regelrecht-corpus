  - number: '3'
    text: |-
      1 De vergoeding, bedoeld in [artikel 1, eerste lid, onderdeel d][ref1], bedraagt:

      a. het bedrag van de bruto uitkering aan een werknemer over de desbetreffende periode van 13 weken indien in een
      periode van 13 weken van verkorting van de werktijd de dienstbetrekking met een werknemer van wie de werktijd wordt
      verkort eindigt;

      b. het bedrag van de bruto uitkering aan een werknemer over de desbetreffende periode van 13 weken indien in een
      periode van 13 weken de verkorting van de werktijd meer bedraagt dan de omvang waarmee de werktijd mag worden
      verkort op grond van [artikel 1][ref2];

      c. de helft van het bedrag van de bruto uitkering aan een werknemer over de totale periode van verkorting van de
      werktijd indien de werknemer in de periode van 13 weken onmiddellijk na afloop van de periode van verkorting van
      de werktijd geheel of gedeeltelijk werkloos blijft dan wel wordt uit de dienstbetrekking met de werkgever en in
      verband daarmee recht houdt respectievelijk krijgt op uitkering op grond van de [Werkloosheidswet][ref3];

      d. het bedrag van de bruto uitkering over de totale periode van verkorting van de werktijd aan alle werknemers
      van de werkgever van wie de werktijd was verkort, met uitzondering van hetgeen onverschuldigd is betaald, indien
      aan één of meer werknemers van wie de werktijd was verkort ten onrechte of tot een te hoog bedrag aan uitkering
      is betaald op grond van de [Werkloosheidswet][ref4] als gevolg van het niet nakomen van de verplichting, bedoeld
      in [artikel 25 van de Werkloosheidswet][ref5], met betrekking tot het voor de werkgever verrichte aantal uren
      arbeid of indien het schriftelijk verslag, bedoeld in [artikel 2, eerste lid][ref6], niet in overeenstemming met de
      waarheid is;

      e. het bedrag van de bruto uitkering aan een werknemer over de desbetreffende periode van 13 weken indien in een
      periode van 13 weken de verkorting van de werktijd gemiddeld minder bedraagt dan 20%;

      f. het bedrag van de bruto uitkering aan een werknemer over de eerste periode indien de verkorting van de werktijd
      in afwijking van de afspraken, bedoeld in [artikel 1, eerste lid, onderdeel g][ref7], na de eerste periode niet met
      dertien weken wordt verlengd.

      2 Voor de toepassing van het eerste lid, onderdeel c, geldt in plaats van een periode van 13 weken onmiddellijk
      na afloop van de periode van verkorting van de werktijd een periode, onmiddellijk na afloop van de periode van
      verkorting van de werktijd, overeenkomend met een derde van de totale periode van verkorting van de werktijd,
      indien dat laatste langer is.

      3 De vergoeding, bedoeld in het eerste lid, onderdelen a en c, is niet verschuldigd indien de omstandigheid,
      bedoeld in die onderdelen, het gevolg is van:

      a. opzegging van de dienstbetrekking door de werkgever om een dringende reden in de zin van
      [artikel 678 van Boek 7 van het Burgerlijk Wetboek][ref8]; of

      b. opzegging van de dienstbetrekking door de werknemer dan wel ontbinding van de dienstbetrekking op diens verzoek.

      4 Onder het bedrag van de bruto uitkering wordt verstaan het bedrag van de bruto uitkering op grond van de
      [Werkloosheidswet][ref9], vermeerderd met de daarover door het Uitvoeringsinstituut werknemersverzekeringen
      verschuldigde premies en de vergoeding, bedoeld in [artikel 46 van de Zorgverzekeringswet][ref10], die het
      Uitvoeringsinstituut werknemersverzekeringen heeft uitbetaald.

      5 Indien op grond van [artikel 2, vijfde lid][ref11], een kortere periode dan 13 weken geldt, geldt voor de
      toepassing van het eerste lid, onderdelen a en b, die periode in plaats van een periode van 13 weken. De eerste
      zin is eveneens van toepassing met betrekking tot het eerste lid, onderdeel e, indien het een tweede of volgende
      verlenging betreft.


