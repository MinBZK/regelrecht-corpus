      1 Dit besluit treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin dit
      wordt geplaatst, werkt terug tot en met 1 april 2009 en vervalt met ingang van 1 juli 2011.

      2 In afwijking van het eerste lid blijft dit besluit van toepassing op de afwikkeling van de vergoedingen, bedoeld
      in [artikel 3][ref1], op en na 1 juli 2011.


