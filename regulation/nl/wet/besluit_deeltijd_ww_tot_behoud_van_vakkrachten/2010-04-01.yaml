  - number: 3c
    text: |-
      1 Indien door de werkgever aan de voorwaarden voor verkorting van de werktijd is voldaan voor 23 juni 2009
      blijft dit besluit, zoals dit luidde voor de inwerkingtreding van het Besluit wederopenstelling deeltijd WW,
      van toepassing op die werkgever tot de eerstvolgende verlenging na de datum van inwerkingtreding van het Besluit
      wederopenstelling deeltijd WW.

      2 In afwijking van het eerste lid geldt voor de daar bedoelde werkgever:

      a. [artikel 1, eerste lid, onderdeel g][ref1], niet;

      b. [artikel 1, derde en zesde lid][ref2], onmiddellijk;

      c. de termijn van 13 weken voor de verlenging, bedoeld in [artikel 2, eerste lid][ref3], onmiddellijk;

      d. [artikel 2, tweede lid][ref4], vanaf de tweede verlenging na de datum van inwerkingtreding van het Besluit
      wederopenstelling deeltijd WW;

      e. [artikel 3, eerste lid, onderdeel f][ref5], niet.

      3 Voor de werkgever, bedoeld in het eerste lid, wordt in afwijking van [artikel 2, vierde lid][ref6], het
      percentage werknemers waarvoor de werktijd kan worden verkort bepaald door het aantal werknemers waarvan de
      werktijd in de periode van de tweede verlenging kan worden verkort, te vergelijken met het totale aantal werknemers
      van de werkgever op 1 april 2009.

      4 De werkgever, bedoeld in het eerste lid, is geen vergoeding verschuldigd als bedoeld
      in [artikel 1, eerste lid, onderdeel d][ref7], indien de omstandigheid, bedoeld in
      [artikel 3, eerste lid, onderdeel c][ref8], het gevolg is van beëindiging van de dienstbetrekking met een werknemer
      wiens werktijd niet kan worden verkort in de periode van de tweede verlenging in verband met de aanpassing van het
      percentage werknemers waarvan de werkgever de werktijd kan verkorten.


