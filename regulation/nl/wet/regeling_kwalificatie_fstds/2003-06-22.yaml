  - number: '9'
    text: |-
      Het bewijs van kwalificatie van een STD, afgegeven op enig tijdstip voor inwerkingtreding van deze regeling,
      behoudt de termijn van geldigheid, die in dat bewijs is aangegeven.
    url: https://wetten.overheid.nl/BWBR0010764/2003-06-22#Artikel9
  - number: '10'
    text: |-
      1 In afwijking van [artikel 4, eerste lid][ref1], kan de minister een vluchtnabootser van een
      vleugelvliegtuig, gekwalificeerd of goedgekeurd vóór 1 april 1998 op basis van één van de in
      [artikel 1, onder a, onderdeel 4 en 5][ref2] genoemde documenten, op aanvraag van de eigenaar of houder, voor een
      aan JAR-STD 1A vergelijkbaar niveau kwalificeren.

      2 In afwijking van [artikel 4, eerste lid][ref3], kan de minister een FNPT, gekwalificeerd of goedgekeurd vóór 1
      juli 1999 op basis van het in [artikel 1, onder a][ref4], genoemde document, op aanvraag van de eigenaar of houder,
      voor een aan JAR-STD 3A vergelijkbaar niveau kwalificeren.

      3 In afwijking van [artikel 4, eerste lid][ref5], kan de minister voor een vluchtnabootser voor vliegtuigen of
      een FNPT die is gekwalificeerd of goedgekeurd vóór 1 juli 1999 respectievelijk vóór 1 oktober 1999 niet op basis
      van een document, bedoeld in [artikel 1, onder a][ref6], een bewijs van kwalificatie afgeven met een speciale
      categorie.

      4 In afwijking van [artikel 4, eerste lid][ref7], kan de minister voor een FTD die is gekwalificeerd of goedgekeurd
      vóór 1 augustus 2002 niet op basis van een document, bedoeld in [artikel 1, onder a][ref8] een bewijs van
      kwalificatie afgeven met een speciale categorie.

      5 In afwijking van [artikel 4, eerste lid][ref9], kan de minister voor een vluchtnabootser voor helikopters
      die is gekwalificeerd of goedgekeurd vóór 1 januari 2003 niet op basis van een document bedoeld in
      [artikel 1, onderdeel a][ref10], een bewijs van kwalificatie afgeven met een speciale categorie.

      6 In afwijking van [artikel 4, eerste lid][ref11], kan de minister een vluchtnabootser voor helikopters,
      gekwalificeerd of goedgekeurd vóór 1 januari 2003 op basis van een in [artikel 1, onderdeel a][ref12], genoemd
      document, op aanvraag van de eigenaar of houder, voor een JAR-STD 1H vergelijkbaar niveau kwalificeren.

      7 De kwalificatie, bedoeld in het tweede lid, en de kwalificatie met een speciale categorie voor FNPT’s, bedoeld in
      het derde lid, zijn ten hoogste geldig tot 1 oktober 2005.

      8 In afwijking van [artikel 4, eerste lid][ref13], kan de minister voor een FNPT voor helikopters die
      zijn gekwalificeerd of goedgekeurd vóór 1 juni 2003, niet op basis van een document als bedoeld in
      [artikel 1, onderdeel a][ref14], een bewijs van kwalificatie afgeven met een speciale categorie.

      9 De kwalificatie met een speciale categorie voor FNPT's, bedoeld in het achtste lid, is geldig tot uiterlijk 1
      januari 2009.


