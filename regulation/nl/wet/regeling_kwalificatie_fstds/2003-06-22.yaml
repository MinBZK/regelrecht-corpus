preamble:
  text: |-
    Gelet op artikel 13, tweede lid, van het Besluit bewijzen van bevoegdheid voor de luchtvaart;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0010764/2003-06-22#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:



            a
             kwalificatiedocumenten:





            b
             minister:

              Minister van Verkeer en Waterstaat;



            c
             vluchtnabootser:

              een flight simulator als bedoeld in de kwalificatiedocumenten, genoemd in onderdeel a, onder 1, 4, 5 en 6;



            d
             FNPT I:

              een vlieg- en navigatieprocedures trainer (Flight and Navigation Procedures Trainer) Type I als bedoeld in
      JAR-STD 3A;



            e
             FNPT II:

              een vlieg- en navigatieprocedures trainer (Flight and Navigation Procedures Trainer) Type II als bedoeld in
      JAR-STD 3A;



            f
             FNPT:

              een vlieg- en navigatieprocedures trainer als bedoeld in FAA AC 120-45 A;



            g
            FTD:

              een vliegtrainingsinstrument (Flight Training Device) als bedoeld in JAR-STD 2A;



            h
            BITD:

              een basis-instrumentvliegtrainingshulpmiddel (Basic Instrument Training Devices) als bedoeld in JAR-STD 4A;



            i
            Helikopter FNPT:

              een vlieg- en navigatieprocedures trainer voor helikopters (Helicopter Flight & Navigation Procedures
      Trainers) als bedoeld in JAR-STD 3H.
    url: https://wetten.overheid.nl/BWBR0010764/2003-06-22#Artikel1
  - number: '2'
    text: |-
      1 De aanvraag tot afgifte van een bewijs van kwalificatie wordt gesteld op een daartoe door de minister verstrekt
      aanvraagformulier.

      2 Afgifte en verlenging van een bewijs van kwalificatie geschiedt niet voordat de aanvrager de kosten heeft vergoed
      volgens de tarieven, genoemd in de Regeling Tarieven voor de luchtvaart.
    url: https://wetten.overheid.nl/BWBR0010764/2003-06-22#Artikel2
  - number: '3'
    text: |-
      1 Een STD is gekwalificeerd indien:

      a. de minister op basis van een onderzoek als bedoeld in [artikel 4][ref1] een bewijs van kwalificatie heeft
      afgegeven, of

      b. een daartoe bevoegde autoriteit van een JAA-land, genoemd in de bij deze regeling behorende bijlage, op basis
      van een onderzoek gebaseerd op JAR-STD 1A, 2A, 4A, 4A, 1H of 3H een bewijs van kwalificatie heeft afgegeven en de
      locatie van de STD binnen het betreffende JAA-land is.

      2 Wijzigingen van een van de in het eerste lid, onderdeel b, genoemde JAR's worden door de minister in de
      Staatscourant bekendgemaakt en gelden met ingang van een in die bekendmaking vervatte datum.

      3 Indien binnen twaalf maanden na het tijdstip van inwerkingtreding van een wijziging van een JAR-STD, een nieuwe
      STD ter kwalificatie krachtens de desbetreffende JAR-STD wordt aangeboden, kan die STD gekwalificeerd worden
      volgens die JAR-STD, zoals die gold voor het tijdstip van inwerkingtreding van die wijziging.


      [ref1]: https://wetten.overheid.nl/BWBR0010764#Artikel4
    url: https://wetten.overheid.nl/BWBR0010764/2003-06-22#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0010764
        artikel: '4'
  - number: '4'
    text: |-
      1 Op aanvraag van de eigenaar of houder van een STD kan de minister na onderzoek gebaseerd op JAR-STD 1A voor
      vluchtnabootsers van vleugelvliegtuigen, dan wel FAA AC 120-63 voor vluchtnabootsers van helicopters, JAR-STD
      2A voor FTD's, JAR-STD 3A voor FNPT I en FNPT II, JAR-STD 4A voor BITD's, JAR-STD 1H voor vluchtnabootsers van
      helikopters dan wel JAR-STD 3H voor FNPT's voor helikopters een STD voor een bepaald niveau kwalificeren.

      2 Indien uit het onderzoek blijkt dat een STD aan de eisen voor het gewenste niveau voldoet, wordt door de minister
      een bewijs van kwalificatie afgegeven voor het gewenste niveau.

      3 Indien uit het onderzoek blijkt dat een STD niet aan de eisen voor het gewenste niveau voldoet, maar wel voor een
      lager niveau van kwalificatie, wordt door de minister een bewijs van kwalificatie afgegeven voor dat niveau.

      4 Indien met een STD meer dan één type luchtvaartuig waarvoor verschillende typebevoegdverklaringen bestaan, kan
      worden nagebootst, wordt per afzonderlijk type een bewijs van kwalificatie afgegeven.

      5 Voor een FNPT I wordt een bewijs van kwalificatie afgegeven voor een klasse vliegtuigen overeenkomstig het tweede
      of derde lid.

      6 Voor een FNPT II wordt een bewijs van kwalificatie afgegeven voor een meermotorig type of klasse vliegtuigen
      overeenkomstig het tweede of derde lid.
    url: https://wetten.overheid.nl/BWBR0010764/2003-06-22#Artikel4
  - number: '5'
    text: |-
      1 Het bewijs van kwalificatie wordt voor ten hoogste twaalf maanden afgegeven.

      2 De eigenaar of houder van een STD dient ten minste drie maanden voor de datum, waarop afgifte van een bewijs van
      kwalificatie gewenst is, een aanvraag in voor afgifte van dit bewijs.

      3 De termijn, genoemd in het tweede lid kan op verzoek van de aanvrager worden verkort tot een maand voor zover het
      betreft een aanvraag tot afgifte van een bewijs van kwalificatie voor een FNPT I.
    url: https://wetten.overheid.nl/BWBR0010764/2003-06-22#Artikel5
  - number: '6'
    text: |-
      Het onderzoek, bedoeld in [artikel 4][ref1], vindt plaats:

      a. voor zover het betreft initiële afgifte van een bewijs van kwalificatie, uiterlijk twee weken voor de datum
      waarop de eigenaar of houder de STD in gebruik wenst te nemen;

      b. voor zover het betreft de verlenging van een bewijs van kwalificatie, tussen 60 dagen en twee weken voor het
      verlopen van de termijn van geldigheid, bedoeld in [artikel 5, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0010764#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0010764#Artikel5
