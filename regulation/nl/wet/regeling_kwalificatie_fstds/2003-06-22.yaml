  - number: '7'
    text: |-
      In geval van verlenging van een bewijs van kwalificatie verkrijgt dit bewijs zijn geldigheid op het moment dat de
      geldigheid van het voorafgaande bewijs van kwalificatie afloopt.
    url: https://wetten.overheid.nl/BWBR0010764/2003-06-22#Artikel7
  - number: '8'
    text: |-
      1 De minister kan een bewijs van kwalificatie voor een periode van ten hoogste drie maanden schorsen indien een
      ernstig vermoeden bestaat dat:

      a. het bewijs van kwalificatie op basis van onjuiste informatie is afgegeven, of

      b. de gekwalificeerde STD als gevolg van veroudering, schade of wijzigingen niet meer dezelfde eigenschappen bezit
      als tijdens het onderzoek, bedoeld in [artikel 4][ref1].

      2 De eigenaar of houder van een STD is verplicht zo spoedig mogelijk aan de minister melding te doen van overdracht
      van de STD aan een andere eigenaar, geplande wijzigingen of schade, ontstaan aan een STD, die van zodanige aard
      zijn dat het kwalificatieniveau kan worden beïnvloed.

      3 Een schorsing op grond van het eerste lid, onder b, wordt opgeheven indien de eigenaar of houder van de STD heeft
      aangetoond dat de STD wederom dezelfde eigenschappen bezit als tijdens het onderzoek, bedoeld in [artikel 4][ref2].

      4 De minister kan tussentijds een bewijs van kwalificatie intrekken of wijzigen:

      a. op één van de gronden, bedoeld in het eerste lid, onder a of b;

      b. indien de eigenaar of houder van een STD medewerking aan het vaststellen van de aanwezigheid van de gronden voor
      wijziging of intrekking, bedoeld in het eerste lid, onder a of b, weigert;

      c. indien het bewijs van kwalificatie ten minste drie maanden is geschorst; of

      d. op verzoek van de eigenaar of houder van een STD.

      5 Wijziging en schorsing zijn niet van invloed op de termijn van geldigheid van het bewijs van kwalificatie,
      bedoeld in [artikel 5, eerste lid][ref3].

      6 Indien een bewijs van kwalificatie is ingetrokken, is de houder van het bewijs verplicht dat bewijs onverwijld
      bij de minister in te leveren.


      [ref1]: https://wetten.overheid.nl/BWBR0010764#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0010764#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0010764#Artikel5
