preamble:
  text: |-
    Gelet op artikel 13, tweede lid, van het Besluit bewijzen van bevoegdheid voor de luchtvaart;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0010764/2009-03-12#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:



            a
            FSTD:

              vluchtnabootsings-trainingsinstrument als bedoeld in JAR-FSTD A.005 en JAR-FSTD H.005 (Flight Simulation
      Training Device);



            b
            JAR-FSTD A:

              Aeroplane Flight Simulation Training Devices, vastgesteld door de JAA en opgenomen in [bijlage 1][ref1] bij
      deze regeling;



            c
            JAR-FSTD H:

              Helicopter Flight Simulation Training Devices, vastgesteld door de JAA en opgenomen in [bijlage 2][ref2]
      bij deze regeling;



            d
            Minister:

              Minister van Verkeer en Waterstaat;



            e
            FSS:

              volledige vluchtnabootser als bedoeld in JAR-FSTD A.005 en JAR-FSTD H.005 (full flight simulator);



            f
            FTD:

              vliegtrainingsinstrument als bedoeld in JAR-FSTD A.005 en JAR-FSTD H.005 (Flight Training Device);



            g
            FNPT:

              vlieg- en navigatieprocedures trainer als bedoeld in JAR-FSTD A.005 en JAR-FSTD H.005 (Flight and
      Navigation Procedures Trainer);



            h
            BITD:

              basis-instrumentvliegtrainingshulpmiddel als bedoeld in JAR-FSTD A.005 (Basic Instrument Training Device);



            i
            OTD:

              trainingshulpmiddel als bedoeld in JAR-FSTD A.005 en JAR-FSTD H.005 (Other Training Device).


      [ref1]: https://wetten.overheid.nl/BWBR0010764
      [ref2]: https://wetten.overheid.nl/BWBR0010764
    url: https://wetten.overheid.nl/BWBR0010764/2009-03-12#Artikel1
    references:
      - id: ref1
