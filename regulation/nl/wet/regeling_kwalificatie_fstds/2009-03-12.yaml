  - number: '9'
    text: |-
      Het bewijs van kwalificatie van een FSTD, afgegeven op enig tijdstip voor inwerkingtreding van deze regeling,
      behoudt de termijn van geldigheid, die in dat bewijs is aangegeven.
    url: https://wetten.overheid.nl/BWBR0010764/2009-03-12#Artikel9
  - number: '10'
    text: |-
      JAR-FSTD A.031 tot en met A.036 en JAR-FSTD H.031 tot en met H.036 zijn van toepassing op de kwalificatie van een
      FSDT die heeft plaatsgevonden voor 1 augustus 2008.
    url: https://wetten.overheid.nl/BWBR0010764/2009-03-12#Artikel10
  - number: '11'
    text: De Regeling kwalificatie vluchtnabootsers wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0010764/2009-03-12#Artikel11
  - number: '12'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst en werkt terug tot en met 1 oktober 1999.
    url: https://wetten.overheid.nl/BWBR0010764/2009-03-12#Artikel12
