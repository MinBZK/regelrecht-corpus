      - id: ref2
        bwb_id: BWBR0010764
  - number: '2'
    text: |-
      1 De aanvraag tot afgifte van een bewijs van kwalificatie wordt gesteld op een daartoe door de minister verstrekt
      aanvraagformulier.

      2 Afgifte en verlenging van een bewijs van kwalificatie geschiedt niet voordat de aanvrager de kosten heeft vergoed
      volgens de tarieven, genoemd in de Regeling Tarieven voor de luchtvaart.
    url: https://wetten.overheid.nl/BWBR0010764/2009-03-12#Artikel2
  - number: '3'
    text: |-
      Een FSTD is gekwalificeerd, indien:

      a. de Minister op basis van een onderzoek als bedoeld in [artikel 4][ref1] een bewijs van kwalificatie heeft
      afgegeven, of

      b. een daartoe bevoegde autoriteit van een JAA-land, genoemd in de bij deze regeling behorende bijlage 3, op basis
      van een onderzoek gebaseerd op JAR-FSTD A of JAR-FSTD H een bewijs van kwalificatie heeft afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0010764#Artikel4
    url: https://wetten.overheid.nl/BWBR0010764/2009-03-12#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0010764
        artikel: '4'
  - number: '4'
    text: |-
      1 Op aanvraag van de eigenaar of houder van een FSTD kan de Minister na onderzoek, gebaseerd op JAR-FSTD A,
      respectievelijk JAR-FSTD H, een FSTD voor een bepaald niveau kwalificeren.

      2 Indien uit het onderzoek blijkt dat een FSTD aan de eisen voor het gewenste niveau voldoet, wordt door de
      minister een bewijs van kwalificatie afgegeven voor het gewenste niveau.

      3 Indien uit het onderzoek blijkt dat een FSTD niet aan de eisen voor het gewenste niveau voldoet, maar wel voor
      een lager niveau van kwalificatie, wordt door de minister een bewijs van kwalificatie afgegeven voor dat niveau.

      4 Indien met een FSTD meer dan één type luchtvaartuig waarvoor verschillende typebevoegdverklaringen bestaan, kan
      worden nagebootst, wordt per afzonderlijk type een bewijs van kwalificatie afgegeven.

      5 Voor een FNPT wordt een bewijs van kwalificatie afgegeven voor een type of klasse vliegtuigen overeenkomstig het
      tweede of derde lid.
    url: https://wetten.overheid.nl/BWBR0010764/2009-03-12#Artikel4
  - number: '5'
    text: |-
      1 Het bewijs van kwalificatie wordt voor ten hoogste twaalf maanden afgegeven of verlengd. In geval van een tweede
      of verdere verlenging van een bewijs van kwalificatie kan de minister dit bewijs voor ten hoogste 36 maanden
      verlengen.

      2 De eigenaar of houder van een FSTD dient ten minste drie maanden voor de datum, waarop afgifte van een bewijs van
      kwalificatie gewenst is, een aanvraag in voor afgifte van dit bewijs.

      3 De termijn, genoemd in het tweede lid kan op verzoek van de aanvrager worden verkort tot een maand voor zover het
      betreft een aanvraag tot afgifte van een bewijs van kwalificatie voor een FNPT.
    url: https://wetten.overheid.nl/BWBR0010764/2009-03-12#Artikel5
  - number: '6'
    text: |-
      Het onderzoek, bedoeld in [artikel 4][ref1], vindt plaats:

      a. voor zover het betreft initiële afgifte van een bewijs van kwalificatie, uiterlijk twee weken voor de datum
      waarop de eigenaar of houder de FSTD in gebruik wenst te nemen;

      b. voor zover het betreft de verlenging van een bewijs van kwalificatie, tussen 60 dagen en twee weken voor het
      verlopen van de termijn van geldigheid, bedoeld in [artikel 5, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0010764#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0010764#Artikel5
    url: https://wetten.overheid.nl/BWBR0010764/2009-03-12#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0010764
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0010764
        artikel: '5'
  - number: '7'
    text: |-
      In geval van verlenging van een bewijs van kwalificatie verkrijgt dit bewijs zijn geldigheid op het moment dat de
      geldigheid van het voorafgaande bewijs van kwalificatie afloopt.
    url: https://wetten.overheid.nl/BWBR0010764/2009-03-12#Artikel7
  - number: '8'
    text: |-
      1 De minister kan een bewijs van kwalificatie voor een periode van ten hoogste drie maanden schorsen indien een
      ernstig vermoeden bestaat dat:

      a. het bewijs van kwalificatie op basis van onjuiste informatie is afgegeven, of

      b. de gekwalificeerde FSTD als gevolg van veroudering, schade of wijzigingen niet meer dezelfde eigenschappen bezit
      als tijdens het onderzoek, bedoeld in [artikel 4][ref1].

      2 De eigenaar of houder van een FSTD is verplicht zo spoedig mogelijk aan de minister melding te doen van
      overdracht van de FSTD aan een andere eigenaar, geplande wijzigingen of schade, ontstaan aan een FSTD, die van
      zodanige aard zijn dat het kwalificatieniveau kan worden beïnvloed.

      3 Een schorsing op grond van het eerste lid, onder b, wordt opgeheven indien de eigenaar of houder van de
      FSTD heeft aangetoond dat de FSTD wederom dezelfde eigenschappen bezit als tijdens het onderzoek, bedoeld in
      [artikel 4][ref2].

      4 De minister kan tussentijds een bewijs van kwalificatie intrekken of wijzigen:

      a. op één van de gronden, bedoeld in het eerste lid, onder a of b;

      b. indien de eigenaar of houder van een FSTD medewerking aan het vaststellen van de aanwezigheid van de gronden
      voor wijziging of intrekking, bedoeld in het eerste lid, onder a of b, weigert;

      c. indien het bewijs van kwalificatie ten minste drie maanden is geschorst; of

      d. op verzoek van de eigenaar of houder van een FSTD.

      5 Wijziging en schorsing zijn niet van invloed op de termijn van geldigheid van het bewijs van kwalificatie,
      bedoeld in [artikel 5, eerste lid][ref3].

      6 Indien een bewijs van kwalificatie is ingetrokken, is de houder van het bewijs verplicht dat bewijs onverwijld
      bij de minister in te leveren.


      [ref1]: https://wetten.overheid.nl/BWBR0010764#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0010764#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0010764#Artikel5
    url: https://wetten.overheid.nl/BWBR0010764/2009-03-12#Artikel8
