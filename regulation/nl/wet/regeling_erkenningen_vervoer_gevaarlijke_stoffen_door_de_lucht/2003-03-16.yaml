preamble:
  text: |-
    Gelet op artikel 6.55, zesde lid, van de Wet luchtvaart en artikel 9, derde lid, van het Besluit vervoer
    gevaarlijke stoffen door de lucht.

    Besluit:
  url: https://wetten.overheid.nl/BWBR0014764/2003-03-16#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. *minister:* Minister van Verkeer en Waterstaat;

      b. *certificaat:* een door een erkende opleidingsinstelling als bedoeld in artikel 1, onderdeel a, van de Regeling
      erkenning opleidingsinstellingen en examinering voor het vervoer van gevaarlijke stoffen door de lucht afgegeven
      certificaat inzake het vervoer van gevaarlijke stoffen door de lucht als bedoeld in artikel 9 van die regeling.
    url: https://wetten.overheid.nl/BWBR0014764/2003-03-16#Artikel1
  - number: '2'
    text: |-
      De aanvraag voor verlening van een erkenning wordt ingediend door middel van een daartoe volledig ingevuld en
      ondertekend formulier, waarvan exemplaren kosteloos bij de minister zijn te verkrijgen.
    url: https://wetten.overheid.nl/BWBR0014764/2003-03-16#Artikel2
  - number: '3'
    text: |-
      De aanvraag voor verlening van een erkenning gaat vergezeld van:

      a. een verklaring waarin de aanvrager aangeeft dat de aangeleverde informatie juist is en dat aan [artikel 4][ref1]
      wordt voldaan;

      b. een overzicht van alle medewerkers die in het bezit zijn van een certificaat en per medewerker een afschrift van
      het geldige certificaat;

      c. een overzicht van alle andere medewerkers die zijn opgeleid in overeenstemming met de opleidingseisen van de
      categorieën, genoemd in de Technische Voorschriften;

      d. een curriculum vitae van het verantwoordelijke directielid, de aanvrager en de contactpersoon;

      e. een omschrijving van de taken en bevoegdheden van de onder c genoemde personen;

      f. een organigram van de aanvrager, inclusief een korte omschrijving;

      g. indien van toepassing de functionele plaats van de aanvrager in relatie tot de hoofdvestiging;

      h. een omschrijving van de handelingen die betrekking hebben op het vervoer van gevaarlijke stoffen door de lucht;

      i. indien van toepassing een afschrift van de vigerende vergunning ingevolge de Wet milieubeheer voor de op- en
      overslag van gevaarlijke stoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0014764#Artikel4
    url: https://wetten.overheid.nl/BWBR0014764/2003-03-16#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0014764
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '4'
    text: |-
      De minister verleent een erkenning als bedoeld in [artikel 6.55 van de wet][ref1] indien de aanvrager aantoont,
      dat hij:

      a. handelingen verricht verband houdend met het vervoer van gevaarlijke stoffen door de lucht als bedoeld in
      [artikel 6.51 van de wet][ref2];

      b. per vestiging voortdurend over tenminste één medewerker beschikt die in het bezit is van een geldig certificaat;

      c. er voor zorg draagt, dat de andere medewerkers dan genoemd onder b, zijn opgeleid in overeenstemming met de
      opleidingseisen van de categorieën, genoemd in de Technische Voorschriften;

      d. ook overigens voldoet aan de Technische Voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel6.55
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel6.51
    url: https://wetten.overheid.nl/BWBR0014764/2003-03-16#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '6.55'
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '6.51'
  - number: '5'
    text: |-
      1 Van de erkenning geeft de minister een bewijs af, waarop wordt aangegeven welke bevoegdheid aan de erkenning
      is verbonden.

      2 Het model van het bewijs van erkenning is opgenomen in de bij deze regeling behorende bijlage.
    url: https://wetten.overheid.nl/BWBR0014764/2003-03-16#Artikel5
  - number: '6'
    text: |-
      Wanneer de erkenning is verleend, worden in de Staatscourant de volgende gegevens gepubliceerd:

      a. de naam van de erkenninghouder;

      b. een omschrijving van de bevoegdheden die met de erkenning zijn verleend.
    url: https://wetten.overheid.nl/BWBR0014764/2003-03-16#Artikel6
  - number: '7'
    text: |-
      1 Een erkenning wordt gewijzigd, nadat de houder van de erkenning heeft aangetoond, dat hij voldoet aan de eisen,
      zoals die gelden voor de erkenning, nadat deze is gewijzigd.

      2 De [artikelen 2 tot en met 6][ref1] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014764#Artikel2
    url: https://wetten.overheid.nl/BWBR0014764/2003-03-16#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0014764
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '8'
    text: |-
      Indien de erkenninghouder voor behandeling van gevaarlijke stoffen voor vervoer door de lucht gebruik maakt van de
      diensten van derden dan wel aan derden gevaarlijke stoffen ter behandeling overdraagt, draagt de erkenninghouder
      er voor zorg, dat de behandeling van de desbetreffende gevaarlijke stoffen en de bijbehorende documenten aan de
      Technische Voorschriften blijven voldoen.
    url: https://wetten.overheid.nl/BWBR0014764/2003-03-16#Artikel8
  - number: '9'
    text: |-
      Handelen in strijd met de [artikel 8][ref1] vormt een strafbaar feit.


      [ref1]: https://wetten.overheid.nl/BWBR0014764#Artikel8
    url: https://wetten.overheid.nl/BWBR0014764/2003-03-16#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0014764
        artikel: '8'
        hoofdstuk: '3'
  - number: '10'
    text: Deze regeling treedt in werking met ingang van 16 maart 2003.
    url: https://wetten.overheid.nl/BWBR0014764/2003-03-16#Artikel10
