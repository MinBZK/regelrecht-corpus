  - number: '2'
    text: |-
      Een erkenning wordt aangevraagd door elektronische of schriftelijke indiening bij de minister van een volledig
      ingevuld en ondertekend aanvraagformulier.
    url: https://wetten.overheid.nl/BWBR0014764/2024-01-01#Artikel2
  - number: '3'
    text: |-
      1 De aanvraag voor verlening van een erkenning gaat vergezeld van:

      a. een verklaring waarin de aanvrager aangeeft dat de aangeleverde informatie juist is en dat aan [artikel 4][ref1]
      wordt voldaan;

      b. een overzicht van alle medewerkers die in het bezit zijn van een certificaat en per medewerker een afschrift van
      het geldige certificaat;

      c. een overzicht van alle andere medewerkers die zijn opgeleid in overeenstemming met de opleidingseisen genoemd in
      de Technische Voorschriften;

      d. een omschrijving van de taken en bevoegdheden van de onder c genoemde personen;

      e. een organigram van de aanvrager, inclusief een korte omschrijving;

      f. indien van toepassing de functionele plaats van de aanvrager in relatie tot de hoofdvestiging;

      g. een omschrijving van de handelingen die betrekking hebben op het vervoer van gevaarlijke stoffen door de lucht;

      i. indien van toepassing een afschrift van de vigerende omgevingsvergunning op grond van artikel 5.1, tweede lid,
      aanhef en onder b, van de Omgevingswet voor de opslag van gevaarlijke stoffen.

      2 Onverminderd het eerste lid, dient de aanvraag voor verlening van een E-erkenning vergezeld te gaan van een DGOM.

      3 Een DGOM bevat:

      a. een beschrijving van de inrichting, uitrusting en het veiligheidsmanagementsysteem van de aanvrager van een
      erkenning en van de wijze waarop dit systeem actueel wordt gehouden;

      b. algemene informatie over de bedrijfsprocessen, taken en verantwoordelijkheden van de aanvrager voor het
      behandelen dan wel afhandelen van gevaarlijke stoffen;

      c. een opsomming van alle diensten en werkzaamheden die door de aanvrager worden uitbesteed aan andere
      organisaties;

      d. een opsomming van leveranciers van de aanvrager voor zover het producten betreft die onder de erkenning vallen;

      e. een beschrijving van het interne auditprogramma van de aanvrager, alsmede van de wijze van uitvoering en de
      wijze waarop dit programma actueel wordt gehouden.

      4 Een veiligheidsmanagementsysteem bedoeld in het derde lid, onderdeel a, bevat een beschrijving van de wijze
      waarop de aanvrager de volgende aspecten heeft geregeld:

      a. veiligheidsbeleid;

      b. organisatiestructuur;

      c. taken, bevoegdheden en verantwoordelijkheden van medewerkers betrokken bij de behandeling van gevaarlijke
      stoffen;

      d. relevante bedrijfsprocessen, procedures of werkinstructies met betrekking tot de afhandeling van gevaarlijke
      stoffen;

      e. risico-inventarisatie en daaruit voortvloeiende beheersmaatregelen;

      f. opleidingen en trainingen;

      g. melding, registratie, analyse en afhandeling van ongevallen en interne- en externe incidenten;

      h. documentbeheer;

      i. met leveranciers en andere contractpartijen gemaakte afspraken inzake naleving van wettelijke voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0014764#Artikel4
