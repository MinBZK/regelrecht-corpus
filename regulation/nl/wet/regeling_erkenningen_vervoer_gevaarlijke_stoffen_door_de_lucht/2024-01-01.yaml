preamble:
  text: |-
    Gelet op artikel 6.55, zesde lid, van de Wet luchtvaart en artikel 9, derde lid, van het Besluit vervoer
    gevaarlijke stoffen door de lucht.

    Besluit:
  url: https://wetten.overheid.nl/BWBR0014764/2024-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

        - *certificaat:* een door een erkende opleidingsinstelling als bedoeld in
      __REF000___________________________________________________________________________________________________________
      ________ afgegeven certificaat inzake het vervoer van gevaarlijke stoffen door de lucht als bedoeld in
      [artikel 9 van die regeling][ref2];
        - *DGOM:* een door de aanvrager van een erkenning opgesteld bedrijfshandboek, Dangerous Goods Operations Manual;
        - *erkenning:* een erkenning als bedoeld in [artikel 6.55 van de Wet luchtvaart][ref3];
        - *minister:* Minister van Infrastructuur en Waterstaat.


