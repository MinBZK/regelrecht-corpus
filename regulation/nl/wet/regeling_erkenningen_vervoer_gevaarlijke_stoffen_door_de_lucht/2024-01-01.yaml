  - number: '4'
    text: |-
      1 De minister verleent een erkenning, indien voldaan wordt aan [artikel 2, eerste lid][ref1], en [artikel 3][ref2]
      en de aanvrager aantoont dat hij:

      a. handelingen verricht die verband houden met het vervoer van gevaarlijke stoffen door de lucht als bedoeld in
      [artikel 6.51 van de wet][ref3];

      b. per vestiging voortdurend feitelijk over ten minste één medewerker beschikt die in het bezit is van een geldig
      certificaat;

      c. er voor zorg draagt, dat de andere medewerkers dan genoemd onder b, zijn opgeleid in overeenstemming met de
      opleidingseisen genoemd in de Technische Voorschriften;

      d. ook voor het overige voldoet aan de Technische Voorschriften.

      2 Om te beoordelen of een erkenning kan worden verleend kan de minister een audit uitvoeren bij de aanvrager.


