  - number: '5'
    text: |-
      Van een erkenning geeft de minister een bewijs af waarop wordt aangegeven welke bevoegdheden aan de erkenning zijn
      verbonden.
    url: https://wetten.overheid.nl/BWBR0014764/2024-01-01#Artikel5
  - number: '6'
    text: |-
      Op de website van de Inspectie Leefomgeving en Transport wordt een overzicht van de verleende erkenningen
      gepubliceerd, met daarbij de volgende gegevens:

      a. de naam van de erkenninghouder, en

      b. een omschrijving van de bevoegdheden die aan de erkenning zijn verbonden.
    url: https://wetten.overheid.nl/BWBR0014764/2024-01-01#Artikel6
  - number: '7'
    text: |-
      1 Een erkenning wordt gewijzigd, nadat de houder van de erkenning heeft aangetoond, dat hij voldoet aan de eisen,
      zoals die gelden voor de erkenning, nadat deze is gewijzigd.

      2 De [artikelen 2 tot en met 6][ref1] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014764#Artikel2
    url: https://wetten.overheid.nl/BWBR0014764/2024-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0014764
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '8'
    text: |-
      Indien een erkenninghouder voor de behandeling van gevaarlijke stoffen ten behoeve van het vervoer daarvan door de
      lucht gebruik maakt van de diensten van derden, dan wel aan derden gevaarlijke stoffen ter behandeling overdraagt,
      draagt die erkenninghouder er voor zorg dat de behandeling van de desbetreffende gevaarlijke stoffen alsmede de
      bijbehorende documentatie aan de Technische Voorschriften blijven voldoen.
    url: https://wetten.overheid.nl/BWBR0014764/2024-01-01#Artikel8
  - number: '9'
    text: |-
      Handelen in strijd met [artikel 8][ref1] vormt een strafbaar feit.


