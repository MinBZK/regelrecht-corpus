  text: |-
    Gelet op artikel 6.55, zesde lid, van de Wet luchtvaart en artikel 9, derde lid, van het Besluit vervoer
    gevaarlijke stoffen door de lucht.

    Besluit:
  url: https://wetten.overheid.nl/BWBR0014764/2016-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. *minister:* Minister van Infrastructuur en Milieu;

      b. *certificaat:* een door een erkende opleidingsinstelling als bedoeld in
      __REF000___________________________________________________________________________________________________________
      ______________________ afgegeven certificaat inzake het vervoer van gevaarlijke stoffen door de lucht als bedoeld
      in [artikel 9 van die regeling][ref2];

      c. *DGOM:* door de aanvrager van een erkenning opgesteld bedrijfshandboek (Dangerous Goods Operations Manual);

      d. *erkenning:* erkenning als bedoeld in [artikel 6.55 van de wet][ref3];

      e. *E-erkenning:* erkenning als bedoeld in
      [artikel 9, eerste lid, onder 5°, van het Besluit vervoer gevaarlijke stoffen][ref4] door de lucht.


