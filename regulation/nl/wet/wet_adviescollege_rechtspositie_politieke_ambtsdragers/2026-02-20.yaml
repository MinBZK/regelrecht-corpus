preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is een adviescollege in te stellen dat de regering
    adviseert over de geldelijke aanspraken van politieke ambtsdragers en leden van de Hoge Colleges van Staat;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0045946/2026-02-20#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Er is een adviescollege rechtspositie politieke ambtsdragers.

      2 Het adviescollege bestaat, met inbegrip van de voorzitter, uit ten minste vijf leden.
    url: https://wetten.overheid.nl/BWBR0045946/2026-02-20#Artikel1
  - number: '2'
    text: |-
      1 Het adviescollege heeft tot taak de regering te adviseren over het beloningsniveau, de onderlinge
      beloningsverhoudingen en overige geldelijke aanspraken van:

        - de leden van de Eerste en Tweede Kamer der Staten-Generaal;
        - Onze ministers en staatssecretarissen;
        - de leden van de Raad van State;
        - de leden van de Algemene Rekenkamer;
        - de Nationale ombudsman en de substituut-ombudsmannen;
        - de leden van provinciale staten;
        - de leden van een commissie als bedoeld in de [artikelen 80][ref1], [81][ref2] en [82 van de Provinciewet][ref3],
      die niet tevens statenlid zijn of ambtenaren die als zodanig tot lid van een commissie zijn benoemd;
        - de commissarissen van de Koning en gedeputeerden;
        - de leden van gemeenteraden;
        - de leden van een commissie als bedoeld in de [artikelen 82][ref4], [83][ref5] en [84 van de Gemeentewet][ref6],
      die niet tevens raadslid zijn of ambtenaren die als zodanig tot lid van een commissie zijn benoemd;
        - de burgemeesters en wethouders;
        - de leden van het algemeen bestuur van waterschappen;
        - de voorzitters en leden van het dagelijks bestuur van waterschappen;
        - de leden van een commissie die door het algemeen bestuur van een waterschap bij verordening is ingesteld, die
      niet tevens lid van het algemeen bestuur zijn of ambtenaren die als zodanig tot lid van een commissie zijn benoemd;
        - de leden van de eilandsraden;
        - de gezaghebbers en de eilandgedeputeerden, en
        - de Rijksvertegenwoordiger BES.

      2 In aanvulling op het eerste lid heeft het adviescollege tot taak:

      a. een bewindspersoon of gewezen bewindspersoon te adviseren over de aanvaardbaarheid van het aangaan van een
      dienstverband als bedoeld in [artikel 2 van de Wet regels vervolgfuncties bewindspersonen][ref7];

      b. Onze Minister-President te adviseren over een ontheffing als bedoeld in de [artikelen 3, derde lid][ref8], en
      [4, vierde lid, van de Wet regels vervolgfuncties bewindspersonen][ref9], en

      c. de adviezen als bedoeld in [artikel 2, eerste lid][ref10], [3, derde lid][ref11], en
      [4, vierde lid, van de Wet regels vervolgfuncties bewindspersonen][ref12], alsmede de naam van een gewezen
      bewindspersoon en een aanvaard dienstverband, bedoeld in artikel 2, tiende lid, van die wet, openbaar te maken.


