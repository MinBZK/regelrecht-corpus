  - number: '3'
    text: |-
      1 De leden van het adviescollege hebben zitting zonder last.

      2 De leden van het adviescollege vervullen geen functies waarvan de uitoefening onverenigbaar is met de
      onafhankelijke taakvervulling van het adviescollege.

      3 Een lid van het adviescollege bekleedt geen functie, genoemd in [artikel 2][ref1], en heeft gedurende de twee
      jaar voorafgaand aan diens benoeming niet een in artikel 2, met uitzondering van de functies van lid van de Raad
      van State, lid van de Algemene Rekenkamer, Nationale ombudsman of substituut-ombudsman of Rijksvertegenwoordiger
      BES, genoemde functie bekleed.

      4 Een lid van het adviescollege bekleedt geen functie als topfunctionaris als bedoeld in
      [artikel 1.1, onderdeel b, van de Wet normering topinkomens][ref2], tenzij dit een functie als lid van een hoogste
      toezichthoudend orgaan van een rechtspersoon of instelling betreft.

      5 Alvorens hun lidmaatschap te aanvaarden, leggen de te benoemen voorzitter en leden een verklaring af dat zij tot
      het verkrijgen van hun benoeming rechtstreeks noch middellijk, onder welke naam of onder welk voorwendsel ook, aan
      iemand iets hebben gegeven of beloofd, alsmede dat zij om iets in hun ambt te doen of te laten rechtstreeks noch
      middellijk van iemand enig geschenk of enige belofte hebben aangenomen of zullen aannemen.

      6 De verklaring gaat vergezeld van een opgave van de functies die de te benoemen leden vervullen


