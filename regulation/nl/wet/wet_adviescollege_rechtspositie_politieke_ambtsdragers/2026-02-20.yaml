  - number: '4'
    text: |-
      1 Aanpassingen in het beloningsniveau, de onderlinge beloningsverhoudingen en overige geldelijke aanspraken
      van de leden van de Eerste respectievelijk Tweede Kamer der Staten-Generaal als gevolg van een advies van
      het adviescollege treden niet in werking dan nadat een nieuw gekozen Eerste respectievelijk Tweede Kamer is
      samengekomen na het tijdstip dat het advies gegeven is.

      2 Aanpassingen in het beloningsniveau, de onderlinge beloningsverhoudingen en overige geldelijke aanspraken van
      Onze ministers en staatssecretarissen als gevolg van een advies van het adviescollege treden niet in werking dan
      nadat nieuwe ministers en staatssecretarissen naar aanleiding van een nieuw gekozen Tweede Kamer beëdigd zijn na
      het tijdstip dat het advies gegeven is.
    url: https://wetten.overheid.nl/BWBR0045946/2026-02-20#Artikel4
