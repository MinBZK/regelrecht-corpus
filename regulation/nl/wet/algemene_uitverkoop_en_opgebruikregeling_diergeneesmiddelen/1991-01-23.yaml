preamble:
  text: |-
    Gelet op artikel 58, derde lid, van de Diergeneesmiddelenwet (Stb. 1985, 410);

    Besluit:
  url: https://wetten.overheid.nl/BWBR0004974/1991-01-23#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In afwijking van [artikel 2, eerste lid, van de Diergeneesmiddelenwet][ref1] (Stb. 1985, 410), en onverminderd
      het bepaalde in het tweede lid, onderdeel b, van dat artikel, is het toegestaan een diergeneesmiddel, waarvoor vóór
      1 mei 1987 een registratie is aangevraagd doch deze door de aanvrager schriftelijk werd ingetrokken of waarvan de
      beslissing tot het niet-ontvankelijk verklaren van de aanvraag dan wel tot afwijzing van de aanvraag onherroepelijk
      is geworden, te bereiden, voorhanden of in voorraad te hebben, af te leveren of bij dieren toe te passen, mits ten
      aanzien van vorenstaande gevallen niet uitdrukkellijk anders wordt beslist, gedurende de in het tweede lid gestelde
      periode.

      2 De in het eerste lid bedoelde periode bedraagt:

      a. zes maanden voor het bereiden, voorhanden of in voorraad hebben ten behoeve van het afleveren in het geval een
      aanvraag is ingetrokken dan wel de termijn waarbinnen beroep kon worden ingesteld is verstreken of de beslissing
      bedoeld in het eerste lid onherroepelijk is geworden:

      b. twaalf maanden voor het voorhanden of in voorraad hebben met het oog op het afleveren of het afleveren ingeval
      de aanvraag is ingetrokken dan wel de termijn waarop beroep kon worden ingesteld is verstreken of de beslissing
      bedoeld in het eerste lid onherroepelijk is geworden:

      c. twaalf maanden voor het voorhanden of in voorraad hebben met het oog op het toepassen of het toepassen bij
      dieren ingeval de aanvraag is ingetrokken dan wel de termijn waarbinnen beroep kan worden ingesteld is verstreken
      of de beslissing bedoeld in het eerste lid onherroepelijk is geworden.

      3 De in het tweede lid bedoelde periode is van overeenkomstige toepassing op het voorhanden of in voorraad
      hebben, afleveren en toepassen van een diergeneesmiddel, waarvoor een afgeleide registratie of een registratie als
      parallel-geîmporteerd diergeneesmiddel van het in het eerste lid bedoelde diergeneesmiddel, is aangevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel2
    url: https://wetten.overheid.nl/BWBR0004974/1991-01-23#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '2'
  - number: '2'
    text: |-
      Van een intrekking van een aanvraag of een beslissing als bedoeld in [artikel 1, eerste lid][ref1], wordt nadat
      de termijn van beroep is verstreken dan wel de beslissing onherroepelijk is geworden door het Bureau Registratie
      Diergeneesmiddelen (BRD) te Wageningen mededeling gedaan in de Staatscourant waarbij ook wordt vermeld op welk
      diergeneesmiddel, waarvoor een afgeleide registratie of een registratie als parallel-geîmporteerd diergeneesmiddel
      werd aangevraagd, de regeling toepassing vindt.


      [ref1]: https://wetten.overheid.nl/BWBR0004974#Artikel1
    url: https://wetten.overheid.nl/BWBR0004974/1991-01-23#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0004974
        artikel: '1'
  - number: '3'
    text: |-
      Het is slechts toegestaan een diergeneesmiddel waarvan de registratie-aanvraag is ingetrokken of een beslissing als
      bedoeld in [artikel 1, eerste lid][ref1], is genomen, gedurende de in het tweede lid, onderdeel c, van dat artikel
      bedoelde periode bij dieren toe te passen, voor zover de toepassing geschiedt overeenkomstig de bij de aanvraag tot
      registratie verstrekte gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0004974#Artikel1
    url: https://wetten.overheid.nl/BWBR0004974/1991-01-23#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0004974
        artikel: '1'
  - number: '4'
    text: |-
      Deze regeling is niet van toepassing op diergeneesmiddelen waarvoor vóór de bekendmaking van de onderhavige
      regeling in de Staatscourant een aparte voorziening is getroffen.
    url: https://wetten.overheid.nl/BWBR0004974/1991-01-23#Artikel4
  - number: '5'
    text: |-
      1 Deze regeling treedt in werking met ingang van de dag volgend op die van haar bekendmaking in de Staatscourant.

      2 Deze regeling kan worden aangehaald als: Algemene uitverkoop- en opgebruikregeling diergeneesmiddelen.
    url: https://wetten.overheid.nl/BWBR0004974/1991-01-23#Artikel5
