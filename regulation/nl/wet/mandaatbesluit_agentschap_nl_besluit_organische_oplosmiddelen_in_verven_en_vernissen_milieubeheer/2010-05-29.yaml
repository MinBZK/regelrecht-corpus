preamble:
  text: |-
    Gezien de schriftelijke instemming van de algemeen directeur van Agentschap NL van 26 april 2010, kenmerk
    ZJZ1024479;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0027674/2010-05-29#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Aan de algemeen directeur van Agentschap NL wordt mandaat verleend tot:

      a. het nemen van besluiten op aanvragen tot ontheffing ingevolge
      [artikel 9.2.2.7 van de Wet milieubeheer][ref1] van het verbod in
      [artikel 2, eerste lid, van het Besluit organische oplosmiddelen in verven en vernissen milieubeheer][ref2];

      b. het beslissen op bezwaarschriften tegen besluiten als bedoeld in onderdeel a, voor zover het besluit waartegen
      het bezwaar zich richt, niet door hem in mandaat is genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9.2.2.7
      [ref2]: https://wetten.overheid.nl/BWBR0019122#Artikel2
    url: https://wetten.overheid.nl/BWBR0027674/2010-05-29#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: 9.2.2.7
      - id: ref2
        bwb_id: BWBR0019122
        artikel: '2'
  - number: '2'
    text: |-
      Aan de algemeen directeur van Agentschap NL wordt volmacht en machtiging verleend tot het verrichten van alle
      benodigde werkzaamheden ter voorbereiding en ter uitvoering van de besluiten bedoeld in [artikel 1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0027674#Artikel1
    url: https://wetten.overheid.nl/BWBR0027674/2010-05-29#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0027674
        artikel: '1'
  - number: '3'
    text: |-
      De algemeen directeur van Agentschap NL kan met betrekking tot zijn bevoegdheden, bedoeld in de [artikelen 1][ref1]
      en [2][ref2], ondermandaat, volmacht en machtiging verlenen aan één of meer onder hem ressorterende
      functionarissen.


      [ref1]: https://wetten.overheid.nl/BWBR0027674#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0027674#Artikel2
    url: https://wetten.overheid.nl/BWBR0027674/2010-05-29#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0027674
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0027674
        artikel: '2'
  - number: '4'
    text: |-
      Indien uitvoering wordt gegeven aan de [artikelen 1][ref1] en [2][ref2] luidt de ondertekening:

      De Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer,

      voor deze:

      de algemeen directeur van Agentschap NL

      (gevolgd door de handtekening en de naam)


      [ref1]: https://wetten.overheid.nl/BWBR0027674#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0027674#Artikel2
    url: https://wetten.overheid.nl/BWBR0027674/2010-05-29#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0027674
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0027674
        artikel: '2'
  - number: '5'
    text: |-
      Indien uitvoering wordt gegeven aan [artikel 3][ref1] luidt de ondertekening:

      De Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer,

      voor deze:

      de algemeen directeur van Agentschap NL,

      op last:

      (gevolgd door de functieaanduiding, de handtekening en de naam van de betrokken functionaris aan wie ondermandaat
      is verleend)


      [ref1]: https://wetten.overheid.nl/BWBR0027674#Artikel3
