preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is enige arbeidsrechtelijke belemmeringen voor het werken
    na de AOW-gerechtigde leeftijd weg te nemen en tevens het risico op verdringing van nog niet AOW-gerechtigde
    werknemers en ambtenaren te beperken;

    Zo is het dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-Generaal,
    hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0037099/2023-01-01#ArtikelAanhef
articles:
  - number: VIIIa
    text: |-
      1 In afwijking van het in de [artikelen 629, lid 2][ref1], en
      [670, lid 1, onder a, van Boek 7 van het Burgerlijk Wetboek][ref2] genoemde tijdvak van 6 weken, geldt tot een bij
      koninklijk besluit te bepalen tijdstip een tijdvak van dertien weken voor de werknemer:

      a. die de in [artikel 7, onderdeel a, van de Algemene Ouderdomswet][ref3] bedoelde leeftijd heeft bereikt, en

      b. die geen werknemer als bedoeld in [artikel 629, lid 2, onderdeel a, van Boek 7 van het Burgerlijk Wetboek][ref4]
      is.

      2 Indien de ongeschiktheid wegens ziekte een aanvang heeft genomen voor de datum waarop de werknemer de in het
      eerste lid, onderdeel a, bedoelde leeftijd heeft bereikt, geldt vanaf die datum de in het eerste lid genoemde
      termijn, voor zover het totale tijdvak niet meer bedraagt dan 104 weken.

      3 In afwijking van het in [artikel 669, lid 3, onderdelen b en c, van Boek 7 van het Burgerlijk Wetboek][ref5]
      genoemde tijdvak van 6 weken, geldt tot een bij koninklijk besluit te bepalen tijdstip een tijdvak van dertien
      weken voor de werknemer die de in [artikel 7, onderdeel a, van de Algemene Ouderdomswet][ref6] bedoelde leeftijd
      heeft bereikt.

      4 Indien de ongeschiktheid tot het verrichten van arbeid wegens ziekte een aanvang heeft genomen voor het op grond
      van het eerste lid vast te stellen tijdstip blijft het in dat lid genoemde tijdvak van dertien weken gelden.

      5 Het tijdstip, bedoeld in het eerste en derde lid, wordt niet eerder vastgesteld, dan nadat:

      a. Onze Minister van Sociale Zaken en Werkgelegenheid een verslag over de doeltreffendheid en de effecten van
      de Wet werken na de AOW-gerechtigde leeftijd (Kamerstukken ) in de praktijk gedurende de eerste twee jaren na
      inwerkingtreding van die wet, aan de beide kamers der Staten-Generaal heeft gezonden; en

      b. acht weken zijn verstreken nadat het voornemen tot het vaststellen van dat tijdstip is meegedeeld aan de beide
      kamers der Staten-Generaal.


