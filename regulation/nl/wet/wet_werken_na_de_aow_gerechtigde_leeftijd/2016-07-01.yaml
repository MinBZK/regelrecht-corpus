valid_from: '2016-07-01'
bwb_id: BWBR0037099
url: https://wetten.overheid.nl/BWBR0037099/2016-07-01
preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is enige arbeidsrechtelijke belemmeringen voor het werken
    na de AOW-gerechtigde leeftijd weg te nemen en tevens het risico op verdringing van nog niet AOW-gerechtigde
    werknemers en ambtenaren te beperken;

    Zo is het dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-Generaal,
    hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0037099/2016-07-01#ArtikelAanhef
articles:
  - number: VIIIa.1
    text: |-
      In afwijking van het in de [artikelen 629, lid 2][ref1], en
      [670, lid 1, onder a, van Boek 7 van het Burgerlijk Wetboek][ref2] genoemde tijdvak van 6 weken, geldt tot een bij
      koninklijk besluit te bepalen tijdstip een tijdvak van dertien weken voor de werknemer:


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel629
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel670
    url: https://wetten.overheid.nl/BWBR0037099/2016-07-01#ArtikelVIIIa
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '629'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '670'
  - number: VIIIa.1.a
    text: |-
      die de in [artikel 7, onderdeel a, van de Algemene Ouderdomswet][ref1] bedoelde leeftijd heeft bereikt, en


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel7
    url: https://wetten.overheid.nl/BWBR0037099/2016-07-01#ArtikelVIIIa
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '7'
  - number: VIIIa.1.b
    text: |-
      die geen werknemer als bedoeld in [artikel 629, lid 2, onderdeel a, van Boek 7 van het Burgerlijk Wetboek][ref1]
      is.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel629
    url: https://wetten.overheid.nl/BWBR0037099/2016-07-01#ArtikelVIIIa
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '629'
  - number: VIIIa.2
    text: |-
      Indien de ongeschiktheid wegens ziekte een aanvang heeft genomen voor de datum waarop de werknemer de in het eerste
      lid, onderdeel a, bedoelde leeftijd heeft bereikt, geldt vanaf die datum de in het eerste lid genoemde termijn,
      voor zover het totale tijdvak niet meer bedraagt dan 104 weken.
    url: https://wetten.overheid.nl/BWBR0037099/2016-07-01#ArtikelVIIIa
  - number: VIIIa.3
    text: |-
      In afwijking van het in [artikel 669, lid 3, onderdelen b en c, van Boek 7 van het Burgerlijk Wetboek][ref1]
      genoemde tijdvak van 6 weken, geldt tot een bij koninklijk besluit te bepalen tijdstip een tijdvak van dertien
      weken voor de werknemer die de in [artikel 7, onderdeel a, van de Algemene Ouderdomswet][ref2] bedoelde leeftijd
      heeft bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel669
      [ref2]: https://wetten.overheid.nl/BWBR0002221#Artikel7
    url: https://wetten.overheid.nl/BWBR0037099/2016-07-01#ArtikelVIIIa
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '669'
      - id: ref2
        bwb_id: BWBR0002221
        artikel: '7'
  - number: VIIIa.4
    text: |-
      Met ingang van het tijdstip, bedoeld in het eerste lid, geldt de in de [artikelen 629, lid 2][ref1], en
      [670, lid 1, onder a, van Boek 7 van het Burgerlijk Wetboek][ref2] genoemde termijn van zes weken, voor zover het
      totale tijdvak niet meer bedraagt dan dertien weken.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel629
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel670
    url: https://wetten.overheid.nl/BWBR0037099/2016-07-01#ArtikelVIIIa
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '629'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '670'
  - number: VIIIa.5
    text: 'Het tijdstip, bedoeld in het eerste en derde lid, wordt niet eerder vastgesteld, dan nadat:'
    url: https://wetten.overheid.nl/BWBR0037099/2016-07-01#ArtikelVIIIa
  - number: VIIIa.5.a
    text: |-
      Onze Minister van Sociale Zaken en Werkgelegenheid een verslag over de doeltreffendheid en de effecten van
      de Wet werken na de AOW-gerechtigde leeftijd (Kamerstukken ) in de praktijk gedurende de eerste twee jaren na
      inwerkingtreding van die wet, aan de beide kamers der Staten-Generaal heeft gezonden; en
    url: https://wetten.overheid.nl/BWBR0037099/2016-07-01#ArtikelVIIIa
  - number: VIIIa.5.b
    text: |-
      acht weken zijn verstreken nadat het voornemen tot het vaststellen van dat tijdstip is meegedeeld aan de beide
      kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0037099/2016-07-01#ArtikelVIIIa
  - number: IX.1
    text: |-
      Het in [artikel 629, lid 1, van Boek 7 van het Burgerlijk Wetboek][ref1] genoemde tijdvak van 104 weken alsmede
      [artikel 670, lid 1, onder a, van Boek 7 van het Burgerlijk Wetboek][ref2], zoals deze bepaling luidde voor het
      tijdstip van inwerkingtreding van [artikel I, onderdeel F][ref3] van de Wet werken na de AOW-gerechtigde leeftijd,
      blijven gedurende zes maanden na dat tijdstip van toepassing op de werknemer:


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel629
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel670
      [ref3]: https://wetten.overheid.nl/BWBR0037099#ArtikelI
    url: https://wetten.overheid.nl/BWBR0037099/2016-07-01#ArtikelIX
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '629'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '670'
      - id: ref3
        bwb_id: BWBR0037099
        artikel: I
  - number: IX.1.a
    text: |-
      die op de dag voor het tijdstip van inwerkingtreding van [artikel I, onderdeel F][ref1], van de Wet werken na de
      AOW-gerechtigde leeftijd ten minste de in [artikel 7, onderdeel a, van de Algemene Ouderdomswet][ref2] bedoelde
      leeftijd heeft, dan wel binnen zes maanden na dat tijdstip deze leeftijd bereikt, en


      [ref1]: https://wetten.overheid.nl/BWBR0037099#ArtikelI
      [ref2]: https://wetten.overheid.nl/BWBR0002221#Artikel7
    url: https://wetten.overheid.nl/BWBR0037099/2016-07-01#ArtikelIX
    references:
      - id: ref1
        bwb_id: BWBR0037099
        artikel: I
      - id: ref2
        bwb_id: BWBR0002221
        artikel: '7'
  - number: IX.1.b
    text: |-
      die voor het in onderdeel a bedoelde tijdstip en tevens, al dan niet na een onderbreking gedurende minder dan vier
      weken, na die dag verhinderd is de bedongen arbeid te verrichten in verband met ongeschiktheid ten gevolge van
      ziekte, en
    url: https://wetten.overheid.nl/BWBR0037099/2016-07-01#ArtikelIX
  - number: IX.1.c
    text: |-
      op wie op die dag het in [artikel 629, lid 1, van Boek 7 van het Burgerlijk Wetboek][ref1] genoemde tijdvak van 104
      weken van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel629
    url: https://wetten.overheid.nl/BWBR0037099/2016-07-01#ArtikelIX
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '629'
  - number: IX.2
    text: |-
      Na afloop van de in lid 1 genoemde termijn van zes maanden, geldt de in [artikel VIIIA][ref1] genoemde termijn van
      dertien weken, voor zover het totale tijdvak niet meer bedraagt dan 104 weken.


      [ref1]: https://wetten.overheid.nl/BWBR0037099#ArtikelVIIIa
    url: https://wetten.overheid.nl/BWBR0037099/2016-07-01#ArtikelIX
    references:
      - id: ref1
        bwb_id: BWBR0037099
        artikel: VIIIa
  - number: Xc
    text: |-
      Onze Minister van Sociale Zaken en Werkgelegenheid zendt aan de Staten-Generaal een verslag over de
      doeltreffendheid en de effecten van deze wet in de praktijk gedurende de eerste twee jaren na inwerkingtreding.
    url: https://wetten.overheid.nl/BWBR0037099/2016-07-01#ArtikelXc
  - number: XI
    text: 'Deze wet wordt aangehaald als: Wet werken na de AOW-gerechtigde leeftijd.'
    url: https://wetten.overheid.nl/BWBR0037099/2016-07-01#ArtikelXI
  - number: XII.1
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen
      of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0037099/2016-07-01#ArtikelXII
  - number: XII.2
    text: |-
      Indien het bij geleidende brief van 16 november 2005 ingediende voorstel van wet van de leden Dubbelboer,
      Duyvendak en Van der Ham, houdende regels inzake het raadgevend referendum ([Wet raadgevend referendum][ref1])
      (Kamerstukken ) tot wet is verheven en deze wet is bekrachtigd op of na de datum waarop de Wet raadgevend
      referendum in werking is getreden, wordt in het in het eerste lid bedoelde besluit zo nodig toepassing gegeven aan
      [artikel 12 van de Wet raadgevend referendum][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0036443
      [ref2]: https://wetten.overheid.nl/BWBR0036443#Artikel12
    url: https://wetten.overheid.nl/BWBR0037099/2016-07-01#ArtikelXII
    references:
      - id: ref1
        bwb_id: BWBR0036443
      - id: ref2
        bwb_id: BWBR0036443
        artikel: '12'
