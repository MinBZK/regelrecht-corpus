articles:
  - number: '1'
    text: |-
      De kosten van het examen voor het Schippersdiploma Rivieren, Kanalen en Meren ter verkrijging van het groot
      vaarbewijs voor de vaart op rivieren, kanalen en meren, en de kosten van het examen voor het Schippersdiploma Alle
      Binnenwateren ter verkrijging van het groot vaarbewijs voor de vaart op alle binnenwateren, bedragen € 156.
    url: https://wetten.overheid.nl/BWBR0016317/2004-01-31#Artikel1
  - number: '2'
    text: |-
      De kosten van het herexamen voor het Schippersdiploma Rivieren, Kanalen en Meren ter verkrijging van het groot
      vaarbewijs voor de vaart op rivieren, kanalen en meren, en de kosten van het herexamen voor het Schippersdiploma
      Alle Binnenwateren ter verkrijging van het groot vaarbewijs voor de vaart op alle binnenwateren, bedragen per
      examenonderdeel € 55. Bij herexamen in meerdere examenonderdelen bedragen de kosten niet meer dan die genoemd in
      [artikel 1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0016317#Artikel1
    url: https://wetten.overheid.nl/BWBR0016317/2004-01-31#Artikel2
