---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/tags/schema-v0.5.4/schema/v0.5.4/schema.json
$id: regeling_tarieven_examens_groot_vaarbewijs_2004
regulatory_layer: WET
publication_date: '2004-12-27'
valid_from: '2004-01-31'
valid_to: '2004-12-31'
bwb_id: BWBR0016317
url: https://wetten.overheid.nl/BWBR0016317/2004-01-31
preamble:
  text: |-
    Gelet op artikel 26, derde lid, van de Binnenschepenwet;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0016317/2004-01-31#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      De kosten van het examen voor het Schippersdiploma Rivieren, Kanalen en Meren ter verkrijging van het groot
      vaarbewijs voor de vaart op rivieren, kanalen en meren, en de kosten van het examen voor het Schippersdiploma Alle
      Binnenwateren ter verkrijging van het groot vaarbewijs voor de vaart op alle binnenwateren, bedragen € 156.
    url: https://wetten.overheid.nl/BWBR0016317/2004-01-31#Artikel1
    machine_readable:
      output:
        name: examen_kosten
        type: amount
        type_spec:
          unit: eurocent
      actions:
        - operation: ASSIGN
          target: examen_kosten
          value: 15600
  - number: '2'
    text: |-
      De kosten van het herexamen voor het Schippersdiploma Rivieren, Kanalen en Meren ter verkrijging van het groot
      vaarbewijs voor de vaart op rivieren, kanalen en meren, en de kosten van het herexamen voor het Schippersdiploma
      Alle Binnenwateren ter verkrijging van het groot vaarbewijs voor de vaart op alle binnenwateren, bedragen per
      examenonderdeel € 55. Bij herexamen in meerdere examenonderdelen bedragen de kosten niet meer dan die genoemd in
      [artikel 1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0016317#Artikel1
    url: https://wetten.overheid.nl/BWBR0016317/2004-01-31#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0016317
        artikel: '1'
    machine_readable:
      parameters:
        - name: aantal_examenonderdelen
          type: number
      output:
        name: herexamen_kosten
        type: amount
        type_spec:
          unit: eurocent
      actions:
        - operation: ASSIGN
          target: totaal_kosten
          value:
            operation: MULTIPLY
            left: 5500
            right: $aantal_examenonderdelen
        - operation: ASSIGN
          target: herexamen_kosten
          value:
            operation: IF
            cases:
              - when:
                  operation: GREATER_THAN
                  subject: $totaal_kosten
                  value: 15600
                then: 15600
            default: $totaal_kosten
  - number: '3'
    text: De Regeling tarieven examens groot vaarbewijs 2003 wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0016317/2004-01-31#Artikel3
  - number: '4'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0016317/2004-01-31#Artikel4
  - number: '5'
    text: 'Deze regeling wordt aangehaald als: Regeling tarieven examens groot vaarbewijs 2004.'
    url: https://wetten.overheid.nl/BWBR0016317/2004-01-31#Artikel5
