  - number: '3'
    text: De Regeling tarieven examens groot vaarbewijs 2003 wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0016317/2004-01-31#Artikel3
  - number: '4'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0016317/2004-01-31#Artikel4
