        artikel: '8'
  - number: '6'
    text: |-
      1 [Dit artikel][ref1] is van toepassing op de verfijningsuitkeringen, bedoeld in de [artikelen 2.7.1][ref2],
      [2.7.4][ref3], [3.3.1][ref4] en [3.15.1 van het Besluit verfijningen algemene uitkering 1984][ref5].

      2 Een gemeente heeft over een uitkeringsjaar recht op een bedrag uit het gemeentefonds ter grootte van het bedrag
      van de verfijningsuitkering voor die gemeente.

      3 Voor zover voor de berekening van een verfijningsuitkering een bedrag per eenheid moet worden vastgesteld, wordt
      dit bedrag vastgesteld door Onze Ministers.

      4 De verplichtingen met betrekking tot de in het tweede lid bedoelde bedragen worden opgenomen in de vermelding,
      bedoeld in [artikel 5, eerste lid, van de Financiële-verhoudingswet][ref6]. Bij de bepaling van het recht, bedoeld
      in artikel 6, vierde lid, van die wet, worden deze verplichtingen in mindering gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0008291#Artikel6
