  - number: '7'
    text: |-
      Een algemene maatregel van bestuur op grond van artikel 38 van de Financiële-Verhoudingswet 1984 berust na de
      inwerkingtreding van deze wet op [artikel 13 van de Financiële-verhoudingswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008290#Artikel13
    url: https://wetten.overheid.nl/BWBR0008291/2005-12-29#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0008290
        artikel: '13'
  - number: '8'
    text: |-
      1 Een beschikking waarbij een aanvullende uitkering is verleend als bedoeld in artikel 12, zesde lid, van de
      Financiële-Verhoudingswet 1984, blijft van kracht.

      2 Een aanvullende uitkering als bedoeld in het eerste lid, wordt voor de toepassing van de
      [Financiële-verhoudingswet][ref1] beschouwd als een aanvullende uitkering als bedoeld in artikel 12 van die wet.

      3 Een verzoek van een gemeenteraad als bedoeld in artikel 12, eerste lid, van de Financiële-Verhoudingswet 1984,
      voor de uitkeringsjaren na de inwerkingtreding van deze wet, wordt beschouwd als een aanvraag als bedoeld in
      [artikel 12 van de Financiële-verhoudingswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008290
      [ref2]: https://wetten.overheid.nl/BWBR0008290#Artikel12
    url: https://wetten.overheid.nl/BWBR0008291/2005-12-29#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0008290
      - id: ref2
        bwb_id: BWBR0008290
        artikel: '12'
  - number: '9'
    text: |-
      1 De vaststelling van een uitkering uit het Gemeentefonds over de uitkeringsjaren voor de inwerkingtreding van
      deze wet en de rechtsgedingen die daarop betrekking hebben, geschieden volgens de bij of krachtens de Financiële-
      Verhoudingswet 1984 gestelde regels.

      2 Indien de over de uitkeringsjaren vóór de inwerkingtreding van deze wet verrichte betalingen aan een gemeente
      hoger of lager zijn dan de voor die uitkeringsjaren vastgestelde uitkeringen wordt het verschil teruggevorderd of
      uitbetaald. Het verschil komt ten goede aan of ten laste van het gemeentefonds.
    url: https://wetten.overheid.nl/BWBR0008291/2005-12-29#Artikel9
  - number: '10'
    text: |-
      1 Bij de vaststelling van de algemene uitkeringen uit het gemeentefonds over het uitkeringsjaar 1997 wordt op deze
      uitkeringen een bedrag van f 35 miljoen in mindering gebracht.

      2 De verdeling over de gemeenten van het in het eerste lid genoemde bedrag wordt bij algemene maatregel van
      bestuur bepaald. De verdeling wordt gebaseerd op de overdracht of de toekomstige overdracht op grond van
      [artikel 76][ref1], van bij een school behorende sportterreinen.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel76u
    url: https://wetten.overheid.nl/BWBR0008291/2005-12-29#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 76u
  - number: '11'
    text: |-
      In dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder:

      a. het CBS: het Centraal bureau voor de statistiek;

      b. rastervierkanten: vierkanten van 500 bij 500 meter, zoals deze worden gebruikt in het geografisch basisregister
      van het CBS;

      c. de uitkeringsfactor: het quotiënt van het voor de algemene uitkeringen beschikbare bedrag en de som van de
      uitkeringsbases.
    url: https://wetten.overheid.nl/BWBR0008291/2005-12-29#Artikel11
  - number: '12'
    text: |-
      Dit hoofdstuk bevat de bepaling en de vaststelling, bedoeld in [artikel 24 van de Financiële-verhoudingswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008290#Artikel24
    url: https://wetten.overheid.nl/BWBR0008291/2005-12-29#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0008290
        artikel: '24'
  - number: '13'
    text: |-
      1 Bij de verdeling van het voor de algemene uitkeringen beschikbare bedrag worden de verdeelmaatstaven gehanteerd
      die zijn omschreven in bijlage 2 bij deze wet.

      2 Bij de vaststelling van de algemene uitkering aan een gemeente stellen Onze Ministers zo nodig het aantal
      eenheden per verdeelmaatstaf voor de gemeente vast. Voor zover in bijlage 2 bij een verdeelmaatstaf een bron is
      vermeld, kunnen Onze Ministers het aantal eenheden ontlenen aan een opgave van het vermelde orgaan of de vermelde
      instantie.

      3 De vaststelling van het aantal eenheden per verdeelmaatstaf voor een gemeente geschiedt naar de toestand op 1
      januari van het uitkeringsjaar waarover het aantal wordt vastgesteld, tenzij in bijlage 2 een peildatum bij een
      verdeelmaatstaf is vermeld. In dat geval geschiedt de vaststelling naar de toestand op deze datum.

      4 Indien op grond van het derde lid een peildatum moet worden gehanteerd die ligt vóór de datum van instelling van
      de gemeente of vóór de datum waarop de grenzen van de gemeente zijn gewijzigd, stellen Onze Ministers het aantal
      eenheden vast op basis van een redelijke schatting van de toestand zoals die op de peildatum zou zijn geweest als
      de instelling of de wijziging op die datum reeds was ingegaan.
    url: https://wetten.overheid.nl/BWBR0008291/2005-12-29#Artikel13
  - number: '14'
    text: |-
      Onze Ministers kunnen nadere regels stellen omtrent:

      a. de toepassing van de in bijlage 2 en in [paragraaf 4.3][ref1] gehanteerde begrippen;

      b. de wijze van telling van het aantal eenheden per verdeelmaatstaf per gemeente.


      [ref1]: https://wetten.overheid.nl/BWBR0008291#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0008291/2005-12-29#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0008291
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: '15'
    text: |-
      Bij de bepaling van het gecorrigeerde totaal, bedoeld in de maatstaf die in bijlage 2, onder nummer 1, is
      vermeld, worden de waarden die op grond van [artikel 41 van de Wet waardering onroerende zaken][ref1] geacht
      worden de waarden per 1 januari 1995 te zijn en waarvan de peildatum ligt op 1 januari 1992 of op 1 januari 1993,
      vermenigvuldigd met respectievelijk 1,16 en 1,1.


      [ref1]: https://wetten.overheid.nl/BWBR0007119#Artikel41
    url: https://wetten.overheid.nl/BWBR0008291/2005-12-29#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0007119
        artikel: '41'
  - number: '16'
    text: De maatstaf vermeld in bijlage 2, onder nummer 8, vervalt met ingang van het uitkeringsjaar 1999.
    url: https://wetten.overheid.nl/BWBR0008291/2005-12-29#Artikel16
  - number: '17'
    text: |-
      1 Het gecorrigeerde aantal inwoners van een woonkern wordt toegedeeld aan die kern zelf en aan de kernen in de
      lokale omgeving van die kern. De aan een kern toegedeelde inwoners worden aangeduid als potentiële lokale klanten
      van de kern.

      2 Een woonkern bestaat uit de verzameling rastervierkanten die 25 of meer adressen omvatten en een zo groot
      mogelijk aaneengesloten gebied binnen een gemeente vormen.

      3 De woonkernen in de lokale omgeving van een kern zijn de kernen die liggen binnen een afstand van 20 kilometer
      tot de kern.

      4 Het gecorrigeerde aantal inwoners van een woonkern bestaat uit het aantal inwoners van de kern, vermeerderd met
      een aandeel van de in de gemeente waarbinnen de kern is gelegen, niet in enige kern wonende inwoners. Het aandeel
      is gelijk aan het aandeel van de inwoners van de kern in het totaal aantal in een kern binnen de gemeente wonende
      inwoners.

      5 De toedeling aan de woonkernen geschiedt evenredig aan het gecorrigeerde aantal inwoners van die kernen en
      omgekeerd evenredig aan het kwadraat van de afstand tot die kernen. Daarbij wordt de afstand van de kern tot
      zichzelf op 1 kilometer vastgesteld.
    url: https://wetten.overheid.nl/BWBR0008291/2005-12-29#Artikel17
  - number: '18'
    text: |-
      1 Het gecorrigeerde aantal inwoners van een woonkern wordt toegedeeld aan die kern zelf en aan de kernen in de
      regionale omgeving van die kern. De aan een kern toegedeelde inwoners worden aangeduid als potentiële regionale
      klanten van de kern.

      2 [Artikel 17][ref1] is van overeenkomstige toepassing, met dien verstande dat:

      a. de woonkernen in de regionale omgeving van een kern, de kernen zijn die liggen binnen een afstand van 60
      kilometer tot de kern;

      b. de toedeling aan de woonkernen evenredig geschiedt aan het kwadraat van het gecorrigeerde aantal inwoners van
      die kernen en omgekeerd evenredig aan het kwadraat van de afstand tot die kernen.


      [ref1]: https://wetten.overheid.nl/BWBR0008291#Artikel17
    url: https://wetten.overheid.nl/BWBR0008291/2005-12-29#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0008291
        artikel: '17'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: '19'
    text: |-
      1 Onze Ministers dragen zorg voor een kaart, waarop de ligging in de gemeenten is bepaald van:

      a. de in bijlage 3 aangeduide historische kernen;

      b. de in artikel 21 bedoelde bewoonde oorden en historische aantallen woningen in die oorden.

      2 Onze Ministers leggen de kaart ter inzage.
    url: https://wetten.overheid.nl/BWBR0008291/2005-12-29#Artikel19
  - number: '20'
    text: |-
      De lengte van de historische waterwegen in of rondom een historische kern wordt bepaald door het aantal meters
      historische waterweg in de kern te vermenigvuldigen met twee, dit produkt te vermeerderen met het aantal meters
      historische waterweg rondom de kern en deze som te verminderen met 1000. Een negatief aantal wordt op nul
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0008291/2005-12-29#Artikel20
  - number: '21'
    text: |-
      1 Bewoonde oorden zijn die oorden, welke in de in 1930 gehouden volkstelling zijn geregistreerd als een bewoond
      oord met 500 of meer woningen.

      2 Het historisch aantal woningen in een bewoond oord is het aantal woningen dat het oord omvatte overeenkomstig de
      gegevens van de in het eerste lid bedoelde volkstelling.
    url: https://wetten.overheid.nl/BWBR0008291/2005-12-29#Artikel21
  - number: '22'
    text: |-
      1 Onze Ministers stellen de omvang van een historische kern of van de lengte van de waterwegen in of rondom een
      historische kern over het uitkeringsjaar 1997 vast overeenkomstig de waarden zoals die bij de inwerkingtreding van
      deze wet golden op grond van [paragraaf 2.6 van het Besluit verfijningen algemene uitkering 1984][ref1].

      2 Onze Ministers wijzigen de vaststelling van de omvang van een historische kern of van de lengte van de waterwegen
      in of rondom een historische kern slechts indien zij dit wenselijk achten in verband met een aanmerkelijk verschil
      tussen de vastgestelde en de werkelijke waarden.

      3 Op de voorbereiding van een wijziging als bedoeld in het tweede lid, is
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref2] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003674#Paragraaf2.6
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0008291/2005-12-29#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0003674
        paragraaf: '2.6'
      - id: ref2
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: '23'
    text: |-
      1 De omgevingsadressendichtheid van een adres is het aantal adressen in de omgeving van het adres, gedeeld door het
      oppervlak in vierkante kilometers van de omgeving.

      2 De omgeving van een adres wordt gevormd door het rastervierkant, waarin het adres is gelegen en de twaalf meest
      nabij gelegen rastervierkanten.
    url: https://wetten.overheid.nl/BWBR0008291/2005-12-29#Artikel23
  - number: '24'
    text: |-
      De gecorrigeerde daling van de algemene uitkering van de gemeente waarvan de grenzen
      zijn gewijzigd wordt slechts bepaald indien [artikel 2.7.1][ref1], [2.7.3][ref2] of
      [2.7.4 van het Besluit verfijningen algemene uitkering 1984][ref3] niet op de gemeente van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0003674#Artikel2.7.1
      [ref2]: https://wetten.overheid.nl/BWBR0003674#Artikel2.7.3
      [ref3]: https://wetten.overheid.nl/BWBR0003674#Artikel2.7.4
    url: https://wetten.overheid.nl/BWBR0008291/2005-12-29#Artikel24
    references:
      - id: ref1
