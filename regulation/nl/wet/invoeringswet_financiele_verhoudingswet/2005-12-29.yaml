        bwb_id: BWBR0008291
      - id: ref2
        bwb_id: BWBR0008291
  - number: '30'
    text: De Financiële-Verhoudingswet 1984 wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0008291/2005-12-29#Artikel30
  - number: '33'
    text: |-
      Voor de plaatsing in het *Staatsblad* brengt Onze Minister van Binnenlandse Zaken de in deze wet voorkomende
      aanhalingen van artikelen uit de [Financiële-verhoudingswet][ref1] met de nieuwe nummering van die wet in
      overeenstemming.


      [ref1]: https://wetten.overheid.nl/BWBR0008290
    url: https://wetten.overheid.nl/BWBR0008291/2005-12-29#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0008290
  - number: '34'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0008291/2005-12-29#Artikel34
  - number: '35'
    text: 'Deze wet wordt aangehaald als: Invoeringswet Financiële-verhoudingswet.'
    url: https://wetten.overheid.nl/BWBR0008291/2005-12-29#Artikel35
