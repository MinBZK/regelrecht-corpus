  - number: '5'
    text: |-
      1 Dit artikel is van toepassing op de verfijningsuitkeringen, bedoeld in de [artikelen 2.1.1][ref1] en
      [2.7.3 van het Besluit verfijningen algemene uitkering 1984][ref2].

      2 Het bij de berekening van het bedrag van een verfijningsuitkering te hanteren bedrag per eenheid bedraagt één
      euro per eenheid.

      3 Het bedrag van een verfijningsuitkering is gelijk aan nul voor de gemeenten waarop de verfijningsuitkering niet
      van toepassing is.

      4 Het bedrag van een verfijningsuitkering strekt niet tot uitbetaling aan een gemeente.

      5 Bij de verdeling van het voor de algemene uitkeringen beschikbare bedrag voor een uitkeringsjaar,
      wordt naast de verdeelmaatstaven die zijn bepaald in [hoofdstuk 4][ref3] van deze wet of op grond van
      [artikel 8 van de Financiële-verhoudingswet][ref4], het bedrag van een verfijningsuitkering voor het
      uitkeringsjaar als verdeelmaatstaf gehanteerd.


      [ref1]: https://wetten.overheid.nl/BWBR0003674#Artikel2.1.1
      [ref2]: https://wetten.overheid.nl/BWBR0003674#Artikel2.7.3
      [ref3]: https://wetten.overheid.nl/BWBR0008291#Hoofdstuk4
      [ref4]: https://wetten.overheid.nl/BWBR0008290#Artikel8
    url: https://wetten.overheid.nl/BWBR0008291/2005-12-29#Artikel5
