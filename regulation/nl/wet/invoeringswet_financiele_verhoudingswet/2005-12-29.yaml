preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is regels te stellen inzake de invoering van de
    Financiële-verhoudingswet en in verband daarmee enige wetten te wijzigen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0008291/2005-12-29#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt onder «Onze Ministers» verstaan: Onze Minister van
      Binnenlandse Zaken en Onze Minister van Financiën.
    url: https://wetten.overheid.nl/BWBR0008291/2005-12-29#Artikel1
  - number: '2'
    text: |-
      1 De algemene uitkering over de jaren 1997 tot en met 2000, zoals deze voor een gemeente wordt vastgesteld
      overeenkomstig de [Financiële-verhoudingswet][ref1], wordt vermeerderd of verminderd met een bedrag overeenkomstig
      de tabel die als [bijlage 1][ref2] bij deze wet is gevoegd. Deze vermeerdering of vermindering komt ten laste van
      of ten goede aan het gemeentefonds.

      2 Indien een gemeente die is vermeld in [bijlage 1][ref3] is opgeheven, vindt de
      vermeerdering of de vermindering plaats ten aanzien van de algemene uitkering van de in
      [artikel 44, eerste lid, van de Wet algemene regels herindeling][ref4] bedoelde gemeente waar alle rechten en
      verplichtingen naar overgaan.

      3 Onze Ministers passen [bijlage 1][ref5] aan, zodra de gegevens over 1997 bekend zijn met betrekking tot de
      gecorrigeerde totalen, bedoeld in de maatstaf, vermeld in [bijlage 2][ref6], onder nummer 1. De aanpassing betreft
      uitsluitend wijzigingen die direct voortvloeien uit deze gegevens over de gecorrigeerde totalen.


      [ref1]: https://wetten.overheid.nl/BWBR0008290
