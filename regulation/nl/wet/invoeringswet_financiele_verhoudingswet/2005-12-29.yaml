        artikel: 2.7.1
      - id: ref2
        bwb_id: BWBR0003674
        artikel: 2.7.3
      - id: ref3
        bwb_id: BWBR0003674
        artikel: 2.7.4
  - number: '25'
    text: |-
      1 De bedragen per eenheid over het uitkeringsjaar 1997, die behoren bij de verdeelmaatstaven, bedoeld in artikel 5
      en in dit hoofdstuk, zijn vermeld in [bijlage 4][ref1] bij deze wet.

      2 Onze Ministers kunnen [bijlage 4][ref2] aanpassen in verband met wijzigingen ten aanzien van het fonds over de
      jaren 1996 en 1997, die door middel van wijzigingen in de bedragen per eenheid over de gemeenten verdeeld behoren
      te worden.


      [ref1]: https://wetten.overheid.nl/BWBR0008291
      [ref2]: https://wetten.overheid.nl/BWBR0008291
    url: https://wetten.overheid.nl/BWBR0008291/2005-12-29#Artikel25
    references:
