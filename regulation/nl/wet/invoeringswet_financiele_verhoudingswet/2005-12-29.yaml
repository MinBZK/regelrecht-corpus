  - number: '3'
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld omtrent het doorlopen en beëindigen na de inwerkingtreding
      van deze wet van verplichtingen op grond van de Financiële-Verhoudingswet 1984.
    url: https://wetten.overheid.nl/BWBR0008291/2005-12-29#Artikel3
  - number: '4'
    text: |-
      [Hoofdstuk 1][ref1] en de paragrafen 2.1, 2.7, 3.3 en 3.15 van het
      [Besluit verfijningen algemene uitkering 1984][ref2] berusten na de inwerkingtreding van
      [deze wet op artikel 3][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0008291#Hoofdstuk1
      [ref2]: https://wetten.overheid.nl/BWBR0003674
      [ref3]: https://wetten.overheid.nl/BWBR0008291#Artikel3
    url: https://wetten.overheid.nl/BWBR0008291/2005-12-29#Artikel4
    references:
