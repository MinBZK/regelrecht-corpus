        artikel: '9'
  - number: '2.4'
    text: |-
      Aan de verplichting, bedoeld in het eerste lid, is voldaan, indien de instelling voor de vaststelling van
      de identiteit van een cliënt gebruik maakt van de gegevens die zij bij een eerder aan die cliënt verleende
      dienst, overeenkomstig de bepalingen van deze wet of ingevolge de Wet identiteitsvaststelling bij financiële
      dienstverlening heeft vastgesteld. De eerste volzin is niet van toepassing indien het betreft een dienst ter
      zake van een transactie met een tegengestelde waarde of gezamenlijke tegenwaarde welke gelijk is aan dan wel meer
      bedraagt dan een bedrag van € 10 000 en deze dienst wordt verricht door een ander filiaal van de dienst dan het
      filiaal dat de identiteit van de cliënt heeft vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006330/2004-03-01#Artikel2
  - number: '2.5'
    text: 'Onze Minister kan vrijstelling verlenen van het eerste lid indien als cliënt optreedt:'
    url: https://wetten.overheid.nl/BWBR0006330/2004-03-01#Artikel2
  - number: 2.5.a
    text: |-
      een onderneming of dienst die hetzij geregistreerd is ingevolge
      [artikel 52 van de Wet toezicht kredietwezen 1992][ref1], [artikel 21 van de Wet toezicht effectenverkeer 1995][ref2]
      of [artikel 18 van de Wet toezicht beleggingsinstellingen][ref3], hetzij beschikt over een vergunning als bedoeld
      in [artikel 24, eerste lid, van de Wet toezicht verzekeringsbedrijf 1993][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel52
      [ref2]: https://wetten.overheid.nl/BWBR0007657#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0004809#Artikel18
      [ref4]: https://wetten.overheid.nl/BWBR0006509#Artikel24
    url: https://wetten.overheid.nl/BWBR0006330/2004-03-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005792
        artikel: '52'
      - id: ref2
        bwb_id: BWBR0007657
        artikel: '21'
      - id: ref3
        bwb_id: BWBR0004809
        artikel: '18'
      - id: ref4
        bwb_id: BWBR0006509
        artikel: '24'
  - number: 2.5.b
    text: |-
      een onderneming of instelling waaraan door de bevoegde autoriteiten in een andere staat een vergunning is verleend
      overeenkomstig [Richtlijn 85/611/EEG](31985L0611), [Richtlijn 92/49/EEG](31992L0049), [Richtlijn 92/96/EEG]
      (31992L0096) of [Richtlijn 2000/12/EG](32000L0012);
    url: https://wetten.overheid.nl/BWBR0006330/2004-03-01#Artikel2
  - number: 2.5.c
    text: een onderneming of dienst die behoort tot een door Onze Minister aan te wijzen categorie.
    url: https://wetten.overheid.nl/BWBR0006330/2004-03-01#Artikel2
  - number: '2.6'
    text: Onze Minister kan ontheffing verlenen van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0006330/2004-03-01#Artikel2
  - number: '2.7'
    text: |-
      Aan een vrijstelling als bedoeld in het vijfde lid en aan een ontheffing als bedoeld in het zesde lid kunnen
      beperkingen worden gesteld en voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0006330/2004-03-01#Artikel2
  - number: '3.1'
    text: |-
      Indien de cliënt een natuurlijke persoon is, wordt de identiteit vastgesteld met behulp van een van de volgende
      documenten:
    url: https://wetten.overheid.nl/BWBR0006330/2004-03-01#Artikel3
  - number: 3.1.a
    text: |-
      een geldig reisdocument in de zin van de [Paspoortwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005212
    url: https://wetten.overheid.nl/BWBR0006330/2004-03-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005212
  - number: 3.1.b
    text: |-
      een geldig rijbewijs dat is afgegeven op basis van de Wegenverkeerswet dan wel een geldig rijbewijs als bedoeld in
      [artikel 107 van de Wegenverkeerswet 1994][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel107
    url: https://wetten.overheid.nl/BWBR0006330/2004-03-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '107'
  - number: 3.1.c
    text: |-
      een document waarover een vreemdeling ingevolge de [Vreemdelingenwet 2000][ref1] moet beschikken ten bewijze van
      zijn identiteit en zijn verblijfsrechtelijke positie;


      [ref1]: https://wetten.overheid.nl/BWBR0011823
    url: https://wetten.overheid.nl/BWBR0006330/2004-03-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0011823
  - number: 3.1.d
    text: een document dat door Onze Minister is aangewezen.
    url: https://wetten.overheid.nl/BWBR0006330/2004-03-01#Artikel3
  - number: '3.2'
    text: |-
      Indien de cliënt een Nederlandse rechtspersoon is dan wel een buitenlandse rechtspersoon die in Nederland is
      gevestigd, wordt de identiteit vastgesteld met behulp van een gewaarmerkt uittreksel uit het register van de
      Kamer van Koophandel en Fabrieken waar die rechtspersoon is ingeschreven dan wel met behulp van een door een in
      Nederland gevestigde notaris opgemaakte akte. In dit uittreksel of deze akte zijn in elk geval de volgende gegevens
      opgenomen:
    url: https://wetten.overheid.nl/BWBR0006330/2004-03-01#Artikel3
  - number: 3.2.1°
    text: |-
      van de rechtspersoon: de rechtsvorm, de statutaire naam, de handelsnaam, het adres met huisnummer, de postcode,
      de plaats van vestiging, het land van statutaire zetel en, indien de rechtspersoon bij een Kamer van Koophandel
      is geregistreerd, het registratienummer bij de Kamer van Koophandel en Fabrieken en de plaats van vestiging van de
      Kamer van Koophandel en Fabrieken waar de rechtspersoon is ingeschreven;
    url: https://wetten.overheid.nl/BWBR0006330/2004-03-01#Artikel3
  - number: 3.2.2°
    text: |-
      van degenen die de rechtspersoon bij de instelling vertegenwoordigen: de geslachtsnaam, de voornamen, de
      geboortedatum en het document aan de hand waarvan hun identiteit is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006330/2004-03-01#Artikel3
  - number: '3.3'
    text: |-
      Indien de cliënt een buitenlandse rechtspersoon is die niet in Nederland is gevestigd, wordt de identiteit
      vastgesteld met behulp van een gewaarmerkt uittreksel uit het officiële handelsregister van de staat waar zich de
      statutaire zetel van die rechtspersoon bevindt, dan wel met behulp van een verklaring, afgegeven door een notaris
      of door een andere van de rechtspersoon onafhankelijke functionaris uit die staat, die de betrouwbaarheid van deze
      verklaring op grond van de aard van zijn functie voldoende kan waarborgen. In dit uittreksel of deze verklaring
      zijn, voor zover van toepassing, in elk geval de volgende gegevens opgenomen:
    url: https://wetten.overheid.nl/BWBR0006330/2004-03-01#Artikel3
  - number: 3.3.1°
    text: |-
      van de rechtspersoon: de rechtsvorm, de statutaire naam, de handelsnaam, het adres met huisnummer, de postcode, de
      plaats van vestiging, het land van statutaire zetel en het registratienummer bij het handelsregister en de plaats
      van vestiging van het handelsregister waar de rechtspersoon is ingeschreven;
    url: https://wetten.overheid.nl/BWBR0006330/2004-03-01#Artikel3
  - number: 3.3.2°
    text: |-
      van degenen die de rechtspersoon bij de instelling vertegenwoordigen: de geslachtsnaam, de voornamen, de
      geboortedatum en het document aan de hand waarvan hun identiteit is vastgesteld;
    url: https://wetten.overheid.nl/BWBR0006330/2004-03-01#Artikel3
  - number: 3.3.3°
    text: |-
      van de functionaris die de identiteit van de rechtspersoon vaststelt een verklaring dat hij onafhankelijk is van de
      te identificeren rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0006330/2004-03-01#Artikel3
  - number: '3.4'
    text: |-
      Indien de cliënt een publiekrechtelijke rechtspersoon is, kan de identiteit, onverminderd het tweede en derde lid,
      tevens worden vastgesteld door een verklaring van het bestuursorgaan, indien het een Nederlandse publiekrechtelijke
      rechtspersoon betreft, of een verklaring van het bevoegde gezag, indien het een buitenlandse publiekrechtelijke
      rechtspersoon betreft. In deze verklaring, die blijkens haar dagtekening niet langer dan een jaar tevoren mag zijn
      afgegeven, zijn, voor zover van toepassing, in elk geval de volgende gegevens opgenomen:
    url: https://wetten.overheid.nl/BWBR0006330/2004-03-01#Artikel3
  - number: 3.4.1°
    text: de datum van afgifte;
    url: https://wetten.overheid.nl/BWBR0006330/2004-03-01#Artikel3
  - number: 3.4.2°
    text: |-
      van de rechtspersoon: de naam, de wettelijke regeling of het besluit waaraan de publiekrechtelijke rechtspersoon
      zijn rechtspersoonlijkheid ontleent, het adres met huisnummer, de plaats van vestiging en het land van zetel;
    url: https://wetten.overheid.nl/BWBR0006330/2004-03-01#Artikel3
  - number: 3.4.3°
    text: |-
      van degenen die de rechtspersoon bij de instelling vertegenwoordigen: de geslachtsnaam, de voornamen, de
      geboortedatum, de functie, het document aan de hand waarvan hun identiteit is vastgesteld, alsmede het document op
      grond waarvan de bevoegdheid tot het vertegenwoordigen van de publiekrechtelijke rechtspersoon ten aanzien van de
      betreffende dienst bestaat;
    url: https://wetten.overheid.nl/BWBR0006330/2004-03-01#Artikel3
  - number: 3.4.4°
    text: |-
      van degene die de verklaring namens het bestuursorgaan dan wel het bevoegde gezag afgeeft: de geslachtsnaam, de
      voornamen, de geboortedatum en de functie.
    url: https://wetten.overheid.nl/BWBR0006330/2004-03-01#Artikel3
  - number: '3.5'
    text: |-
      De identiteit van kerkgenootschappen, zelfstandige onderdelen hiervan of lichamen waarin zij zijn verenigd kan,
      onverminderd het tweede en derde lid, tevens worden vastgesteld aan de hand van een verklaring van de organisatie
      waarvan het kerkgenootschap, het zelfstandig onderdeel of het lichaam deel uitmaakt. Indien het kerkgenootschap,
      zelfstandige onderdeel of het lichaam geen deel uitmaakt van een organisatie, kan de identiteit worden vastgesteld
      aan de hand van een eigen verklaring van het kerkgenootschap of het lichaam, welke verklaring blijkens haar
      dagtekening niet langer dan een jaar tevoren mag zijn afgegeven. In de verklaring zijn, voor zover van toepassing,
      in elk geval de volgende gegevens opgenomen:
    url: https://wetten.overheid.nl/BWBR0006330/2004-03-01#Artikel3
  - number: 3.5.1°
    text: de datum van afgifte;
    url: https://wetten.overheid.nl/BWBR0006330/2004-03-01#Artikel3
  - number: 3.5.2°
    text: |-
      van het kerkgenootschap, het zelfstandig onderdeel of het lichaam: de rechtsvorm, de naam, het adres met
      huisnummer, de plaats en het land van vestiging;
    url: https://wetten.overheid.nl/BWBR0006330/2004-03-01#Artikel3
  - number: 3.5.3°
    text: |-
      van degenen die het kerkgenootschap, het zelfstandig onderdeel of het lichaam bij de instelling vertegenwoordigen:
      de geslachtsnaam, de voornamen, de geboortedatum, de functie bij het kerkgenootschap, het zelfstandig onderdeel of
      het lichaam alsmede een vermelding van het type en nummer van het document aan de hand waarvan de identiteit door
      het kerkgenootschap, het zelfstandig onderdeel of het lichaam is vastgesteld;
    url: https://wetten.overheid.nl/BWBR0006330/2004-03-01#Artikel3
  - number: 3.5.4°
    text: 'van de organisatie die de verklaring afgeeft: de naam en plaats van vestiging;'
    url: https://wetten.overheid.nl/BWBR0006330/2004-03-01#Artikel3
  - number: 3.5.5°
    text: |-
      van degene die de verklaring namens de organisatie, het kerkgenootschap of het lichaam afgeeft: de geslachtsnaam,
      de voornamen, de geboortedatum en de functie.
    url: https://wetten.overheid.nl/BWBR0006330/2004-03-01#Artikel3
  - number: '4.1'
    text: |-
      In afwijking van [artikel 3][ref1] kan een instelling de identiteit van een cliënt die niet in persoon verschijnt,
      vaststellen door een afschrift van één van de in [artikel 3, eerste lid][ref2], genoemde documenten, dan wel het
      officiële nummer van dit document te verlangen, indien met de transactie geen contant geld gemoeid is en de eerste
      betaling die met de dienst verband houdt wordt gedaan ten gunste of ten laste van een rekening van de cliënt bij
      een instelling als bedoeld in [artikel 1, eerste lid, onderdeel a, onder 1° of 2°][ref3], met zetel in een van
      de lidstaten, die beschikt over een vergunning van de bevoegde autoriteit van die lidstaat om haar bedrijf te mogen
      uitoefenen, of in een staat die door Onze Minister is aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0006330#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0006330#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0006330#Artikel1
    url: https://wetten.overheid.nl/BWBR0006330/2004-03-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0006330
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0006330
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0006330
        artikel: '1'
  - number: '4.2'
    text: |-
      Indien de identiteit wordt vastgesteld op de in het vorige lid omschreven wijze, gaat de instelling na of de
      identiteit van de cliënt overeenkomt met de identiteit van de cliënt ten laste of ten gunste van wiens rekening de
      eerste betaling, bedoeld in het vorige lid, is gedaan.
    url: https://wetten.overheid.nl/BWBR0006330/2004-03-01#Artikel4
  - number: '4.3'
    text: 'In afwijking van het eerste lid is geen afschrift dan wel nummer van het document vereist:'
    url: https://wetten.overheid.nl/BWBR0006330/2004-03-01#Artikel4
  - number: 4.3.a
    text: |-
      indien met betrekking tot de dienst, bedoeld in [artikel 1, eerste lid, onderdeel b, onder 5° of 6°][ref1],
      de eerste premiebetaling wordt gedaan ten laste van de rekening van de cliënt bij een instelling als bedoeld in
      [artikel 1, eerste lid, onderdeel a, onder 1°of 2°][ref2], met zetel in een van de lidstaten, die beschikt over
      een vergunning van de bevoegde autoriteit van die lidstaat om haar bedrijf te mogen uitoefenen, dan wel indien
      de uitkering uit hoofde van de levensverzekeringsovereenkomst wordt betaald ten gunste van een rekening van een
      cliënt bij een instelling als hiervoor bedoeld, dan wel indien de betrokken assurantietussenpersoon, bedoeld in
      [artikel 1, eerste lid, onderdeel a, onder 5°][ref3], heeft voldaan aan de in [artikel 2, eerste lid][ref4],
      bedoelde verplichting;


      [ref1]: https://wetten.overheid.nl/BWBR0006330#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0006330#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0006330#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0006330#Artikel2
    url: https://wetten.overheid.nl/BWBR0006330/2004-03-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0006330
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0006330
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0006330
        artikel: '1'
      - id: ref4
        bwb_id: BWBR0006330
        artikel: '2'
  - number: 4.3.b
    text: |-
      indien met betrekking tot de dienst, bedoeld in [artikel 1, eerste lid, onderdeel b, onder 5° of 6°][ref1], de
      premiebetaling wordt gedaan ten laste van, dan wel de uitkering uit hoofde van de levensverzekeringsovereenkomst
      wordt betaald ten gunste van een rekening van de cliënt bij een instelling als bedoeld in
      [artikel 1, eerste lid, onderdeel a, onder 1° of 2°][ref2], met zetel in een staat, niet zijnde een lidstaat,
      die door Onze Minister is aangewezen, mits de instelling die de dienst verleent van die instelling bevestiging
      heeft verkregen dat de identiteitsvaststelling van de cliënt en de registratie daarvan op diens naam zijn
      uitgevoerd;


      [ref1]: https://wetten.overheid.nl/BWBR0006330#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0006330#Artikel1
    url: https://wetten.overheid.nl/BWBR0006330/2004-03-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0006330
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0006330
        artikel: '1'
  - number: 4.3.c
    text: |-
      indien met betrekking tot de dienst, bedoeld in
      [artikel 1, eerste lid, onderdeel b, onder 1°, 2°, 4° of 7°][ref1], voor zover verband houdende met de handel
      in effecten, de eerste betaling die met de dienst verband houdt door de cliënt wordt gedaan of indien een betaling
      die met de dienst verband houdt aan de cliënt wordt gedaan ten laste onderscheidenlijk ten gunste van een rekening
      van die cliënt bij een kredietinstelling met zetel in een van de lidstaten of in een staat die door Onze Minister
      is aangewezen. Indien deze rekening wordt aangehouden bij een kredietinstelling die niet is gevestigd in een
      lidstaat of indien de in de vorige volzin bedoelde betaling wordt gedaan aan de cliënt dient de instelling van de
      kredietinstelling bevestiging te hebben verkregen dat de identiteitsvaststelling van die cliënt en de registratie
      daarvan op diens naam zijn uitgevoerd;


      [ref1]: https://wetten.overheid.nl/BWBR0006330#Artikel1
    url: https://wetten.overheid.nl/BWBR0006330/2004-03-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0006330
        artikel: '1'
  - number: 4.3.d
    text: in door Onze Minister aan te wijzen gevallen.
    url: https://wetten.overheid.nl/BWBR0006330/2004-03-01#Artikel4
  - number: '4.4'
    text: |-
      Met uitzondering van het derde lid, onderdeel a, zijn het eerste en derde lid niet van toepassing
      indien de financiële dienst betrekking heeft op een transactie die als een ongebruikelijke transactie
      in de zin van de [Wet melding ongebruikelijke transacties][ref1] dient te worden aangemerkt, of indien
      [artikel 5, vierde lid][ref2], van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0006331
      [ref2]: https://wetten.overheid.nl/BWBR0006330#Artikel5
    url: https://wetten.overheid.nl/BWBR0006330/2004-03-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0006331
      - id: ref2
        bwb_id: BWBR0006330
        artikel: '5'
  - number: '4.5'
    text: |-
      Ten aanzien van de rekeningen, bedoeld in het eerste of derde lid, ten gunste of ten laste waarvan de eerste
      betaling die met de financiële dienst verband houdt wordt gedaan, dient identificatie te hebben plaatsgevonden
      overeenkomstig de bepalingen van deze wet of de Wet identiteitsvaststelling bij financiële dienstverlening.
    url: https://wetten.overheid.nl/BWBR0006330/2004-03-01#Artikel4
  - number: '5.1'
    text: |-
      De instelling is verplicht de identiteit van de natuurlijke persoon die namens een cliënt of namens een
      vertegenwoordiger van een cliënt bij haar verschijnt overeenkomstig de [artikelen 3][ref1] en [4][ref2] vast te
      stellen voordat zij de dienst verleent.


      [ref1]: https://wetten.overheid.nl/BWBR0006330#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0006330#Artikel4
    url: https://wetten.overheid.nl/BWBR0006330/2004-03-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0006330
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0006330
        artikel: '4'
  - number: '5.2'
    text: |-
      De instelling is verplicht na te gaan of de natuurlijke persoon die voor haar verschijnt voor zichzelf optreedt dan
      wel voor een derde.
    url: https://wetten.overheid.nl/BWBR0006330/2004-03-01#Artikel5
  - number: '5.3'
    text: |-
      Indien de natuurlijke persoon optreedt voor een derde is de instelling verplicht de identiteit van die derde vast
      te stellen met behulp van door de natuurlijke persoon over te leggen documenten, bedoeld in [artikel 3][ref1]
      tenzij [artikel 2, eerste lid, tweede volzin][ref2], van toepassing is. Indien de derde optreedt voor een andere
      derde is de instelling verplicht de identiteit van die andere derde op dezelfde wijze vast te stellen tenzij
      [artikel 2, eerste lid, tweede volzin][ref3], van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0006330#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0006330#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0006330#Artikel2
    url: https://wetten.overheid.nl/BWBR0006330/2004-03-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0006330
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0006330
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0006330
        artikel: '2'
  - number: '5.4'
    text: |-
      Indien de instelling weet of redelijkerwijs moet vermoeden dat de natuurlijke persoon die voor haar verschijnt
      niet voor zichzelf optreedt, dient zij redelijke maatregelen te treffen teneinde de identiteit van de cliënt voor
      wie hij optreedt en, ingeval van vertegenwoordiging van een cliënt door een derde van die vertegenwoordiger te
      achterhalen.
    url: https://wetten.overheid.nl/BWBR0006330/2004-03-01#Artikel5
  - number: '5.5'
    text: |-
      Het derde en vierde lid zijn niet van toepassing indien de natuurlijke persoon een instelling is dan wel optreedt
      namens een instelling waarop een vrijstelling als bedoeld in [artikel 2, vijfde lid][ref1], of een ontheffing als
      bedoeld in [artikel 2, zesde lid][ref2], van toepassing is, mits die instelling de identiteit van de derde voor
      wie zij optreedt overeenkomstig deze wet dan wel overeenkomstig de wet van een door Onze Minister aangewezen staat
      heeft vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0006330#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006330#Artikel2
    url: https://wetten.overheid.nl/BWBR0006330/2004-03-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0006330
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0006330
        artikel: '2'
  - number: '5.6'
    text: |-
      Onze Minister kan vrijstelling en, op verzoek, ontheffing verlenen van het derde en vierde lid. Aan een
      vrijstelling en aan een ontheffing kunnen beperkingen worden gesteld en voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0006330/2004-03-01#Artikel5
  - number: '6'
    text: 'De instelling is verplicht de volgende gegevens vast te leggen op een zodanige wijze dat deze toegankelijk zijn:'
    url: https://wetten.overheid.nl/BWBR0006330/2004-03-01#Artikel6
  - number: 6.a
    text: |-
      de geslachtsnaam, de voornamen, de geboortedatum, het adres en de woonplaats dan wel plaats van vestiging van
      de cliënt en van degene te wiens name het depot of de rekening wordt gesteld, van degene die toegang tot het
      safe-loket zal hebben of degene te wiens name een uitbetaling of transactie wordt verricht, alsmede van hun
      vertegenwoordigers;
    url: https://wetten.overheid.nl/BWBR0006330/2004-03-01#Artikel6
  - number: 6.b
    text: |-
      de aard, het nummer en de datum en plaats van uitgifte van het document met behulp waarvan de
      identiteitsvaststelling heeft plaatsgevonden, behoudens indien [artikel 4, derde lid][ref1], van toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0006330#Artikel4
    url: https://wetten.overheid.nl/BWBR0006330/2004-03-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0006330
        artikel: '4'
  - number: 6.c
    text: de aard van de dienst; en
    url: https://wetten.overheid.nl/BWBR0006330/2004-03-01#Artikel6
  - number: 6.d.1°
    text: |-
      in het geval van het in bewaring nemen van de in [artikel 1, eerste lid, onderdeel ][ref1], genoemde waarden:
      het desbetreffende depotnummer en de marktwaarde die deze waarden vertegenwoordigen op het tijdstip van de
      inbewaringneming, of bij ontstentenis van een marktwaarde het bedrag dat deze waarden vertegenwoordigen, berekend
      volgens andere in het maatschappelijk verkeer gebruikelijke waarderingsgrondslagen, of indien het bedrag dat
      deze waarden vertegenwoordigen in redelijkheid niet kan worden vastgesteld, een nauwkeurige omschrijving van die
      waarden;


      [ref1]: https://wetten.overheid.nl/BWBR0006330#Artikel1
    url: https://wetten.overheid.nl/BWBR0006330/2004-03-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0006330
        artikel: '1'
  - number: 6.d.2°
    text: |-
      in het geval van het openstellen van een rekening: een duidelijke omschrijving van de soort rekening en het aan die
      rekening toegekende nummer;
    url: https://wetten.overheid.nl/BWBR0006330/2004-03-01#Artikel6
  - number: 6.d.3°
    text: |-
      in het geval van verhuur van een safe-loket: het nummer of een andere onderscheidende aanduiding van het
      desbetreffende safe-loket;
    url: https://wetten.overheid.nl/BWBR0006330/2004-03-01#Artikel6
  - number: 6.d.4°
    text: |-
      in het geval van het verrichten van uitbetalingen ter zake van het verzilveren van coupons of vergelijkbare stukken
      van obligaties of vergelijkbare waardepapieren: het bedrag dat met de transactie is gemoeid en het desbetreffende
      rekeningnummer;
    url: https://wetten.overheid.nl/BWBR0006330/2004-03-01#Artikel6
  - number: 6.d.5°
    text: |-
      in het geval van het sluiten van een levensverzekeringsovereenkomst: het nummer van de rekening ten laste waarvan
      de eerste premiebetaling wordt gedaan;
    url: https://wetten.overheid.nl/BWBR0006330/2004-03-01#Artikel6
  - number: 6.d.6°
    text: |-
      in het geval van het doen van een uitkering uit hoofde van een levensverzekeringsovereenkomst: het nummer van de
      rekening ten gunste waarvan de uitkering wordt gedaan;
    url: https://wetten.overheid.nl/BWBR0006330/2004-03-01#Artikel6
  - number: 6.d.7°
    text: |-
      in het geval van een dienst als bedoeld in [artikel 1, eerste lid, onderdeel ][ref1]: het bedrag dat met de
      transactie is gemoeid en het desbetreffende rekeningnummer;


      [ref1]: https://wetten.overheid.nl/BWBR0006330#Artikel1
    url: https://wetten.overheid.nl/BWBR0006330/2004-03-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0006330
        artikel: '1'
  - number: 6.d.8°
    text: |-
      In het geval van een dienst als bedoeld in [artikel 1, eerste lid, onderdeel b, onder 8°][ref1]: een omschrijving
      van de desbetreffende zaken van grote waarde en de hoogte van het contante gedeelte van de betaling.


      [ref1]: https://wetten.overheid.nl/BWBR0006330#Artikel1
    url: https://wetten.overheid.nl/BWBR0006330/2004-03-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0006330
        artikel: '1'
  - number: 6.d.9°
    text: |-
      in het geval van een dienst als bedoeld in [artikel 1, eerste lid, onderdeel b, onder 9°][ref1]: de op die dienst
      betrekking hebbende gegevens die bij algemene maatregel van bestuur zijn aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0006330#Artikel1
    url: https://wetten.overheid.nl/BWBR0006330/2004-03-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0006330
        artikel: '1'
  - number: '7'
    text: |-
      De instelling bewaart de in [artikel 6][ref1] bedoelde gegevens op toegankelijke wijze tot vijf jaar na het
      beëindigen van de overeenkomst op grond waarvan de dienst is verleend of tot vijf jaar na het uitvoeren van een
      dienst als bedoeld in [artikel 1, eerste lid, onderdeel b, onder 4°, 7° of 8°][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006330#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0006330#Artikel1
    url: https://wetten.overheid.nl/BWBR0006330/2004-03-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0006330
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0006330
        artikel: '1'
  - number: '8'
    text: |-
      Het is de instelling verboden een dienst te verlenen indien de identiteit van de cliënt niet op de bij deze wet
      voorgeschreven wijze is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006330/2004-03-01#Artikel8
  - number: 8a.1
    text: |-
      Met het toezicht op de naleving van de [artikelen 7][ref1] en [8][ref2] kunnen worden belast de bij besluit van
      Onze Minister van Financiën aangewezen personen.


      [ref1]: https://wetten.overheid.nl/BWBR0006330#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0006330#Artikel8
    url: https://wetten.overheid.nl/BWBR0006330/2004-03-01#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0006330
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0006330
        artikel: '8'
  - number: 8a.2
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0006330/2004-03-01#Artikel8a
  - number: '10.1'
    text: De Wet identiteitsvaststelling bij financiële dienstverlening wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0006330/2004-03-01#Artikel10
  - number: '11'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0006330/2004-03-01#Artikel11
  - number: '12'
    text: 'Deze wet wordt aangehaald als: Wet identificatie bij dienstverlening.'
    url: https://wetten.overheid.nl/BWBR0006330/2004-03-01#Artikel12
