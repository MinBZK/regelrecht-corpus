  - number: '2.3'
    text: |-
      Het eerste lid is niet van toepassing met betrekking tot de dienst, bedoeld
      in [artikel 1, eerste lid, onderdeel ][ref1], voor zover het betreft een
      levensverzekeringsovereenkomst als bedoeld in [artikel 2][ref2], vierde lid, onder B en C, en
      [artikel 9, eerste lid, van de Pensioen- en spaarfondsenwet][ref3] en [artikel 2][ref4], tweede lid, onderdeel
      *b*, en [artikel 9, eerste lid, van de Wet betreffende verplichte deelneming in een beroepspensioenregeling][ref5],
      tenzij deze wordt afgekocht of als zekerheidsstelling dient.


      [ref1]: https://wetten.overheid.nl/BWBR0006330#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002089#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0002089#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0002830#Artikel2
      [ref5]: https://wetten.overheid.nl/BWBR0002830#Artikel9
    url: https://wetten.overheid.nl/BWBR0006330/2004-03-01#Artikel2
