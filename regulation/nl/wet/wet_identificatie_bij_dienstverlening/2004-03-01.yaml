  - number: 1.1.a.6°
    text: |-
      De beroeps- of bedrijfsmatig handelende verkoper, alsmede degene die beroeps- of bedrijfsmatig bemiddeling verleent
      bij verkoop, van voertuigen, schepen, kunstvoorwerpen, antiquiteiten, edelstenen, edele metalen, sieraden, juwelen,
      dan wel andere bij algemene maatregel van bestuur aan te wijzen zaken van grote waarde, voor zover betaling van
      deze zaken in contanten plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0006330/2004-03-01#Artikel1
  - number: 1.1.a.7°
    text: |-
      een natuurlijke persoon of rechtspersoon die behoort tot een bij algemene maatregel van bestuur aan te wijzen
      categorie beroepen, bedrijven of instellingen;
    url: https://wetten.overheid.nl/BWBR0006330/2004-03-01#Artikel1
  - number: 1.1.b
    text: 'dienst: het door een instelling in of vanuit Nederland:'
    url: https://wetten.overheid.nl/BWBR0006330/2004-03-01#Artikel1
  - number: 1.1.b.1°
    text: in bewaring nemen van effecten, bankbiljetten, munten, muntbiljetten, edele metalen en andere waarden;
    url: https://wetten.overheid.nl/BWBR0006330/2004-03-01#Artikel1
  - number: 1.1.b.2°
    text: |-
      openstellen van een rekening waarop een saldo in geld, effecten, edele metalen of andere waarden kan worden
      aangehouden;
    url: https://wetten.overheid.nl/BWBR0006330/2004-03-01#Artikel1
  - number: 1.1.b.3°
    text: verhuren van een safe-loket;
    url: https://wetten.overheid.nl/BWBR0006330/2004-03-01#Artikel1
  - number: 1.1.b.4°
    text: |-
      verrichten van een uitbetaling ter zake van het verzilveren van coupons of vergelijkbare stukken van obligaties of
      vergelijkbare waardepapieren;
    url: https://wetten.overheid.nl/BWBR0006330/2004-03-01#Artikel1
  - number: 1.1.b.5°
    text: |-
      sluiten van een levensverzekeringsovereenkomst als bedoeld in [artikel 1, eerste lid, onderdeel ][ref1] tegen een
      premie als bedoeld in [artikel 1, eerste lid, onderdeel ][ref2] boven een door Onze Minister te bepalen bedrag,
      alsmede het daarbij verlenen van bemiddeling;


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0006509#Artikel1
    url: https://wetten.overheid.nl/BWBR0006330/2004-03-01#Artikel1
