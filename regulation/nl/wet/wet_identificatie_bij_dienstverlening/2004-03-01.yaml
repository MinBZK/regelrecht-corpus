preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat de bestaande wetgeving met betrekking tot identiteitsvaststelling bij
    financiële dienstverlening aangepast dient te worden aan de richtlijn van de Raad van de Europese Gemeenschappen
    van 10 juni 1991 tot voorkoming van het gebruik van het financiële stelsel voor het witwassen van geld (91/308/
    EEG);

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0006330/2004-03-01#ArtikelAanhef
