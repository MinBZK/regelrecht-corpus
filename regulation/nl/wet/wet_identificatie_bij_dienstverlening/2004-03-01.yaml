    url: https://wetten.overheid.nl/BWBR0006330/2004-03-01#Artikel1
  - number: 1.1.b.7°
    text: |-
      verlenen van een dienst ter zake van een transactie of van kennelijk met elkaar samenhangende transacties, met een
      tegenwaarde of gezamenlijke tegenwaarde welke gelijk is aan dan wel meer bedraagt dan een door Onze Minister te
      bepalen bedrag, dat voor onderscheiden soorten van transacties verschillend kan zijn;
    url: https://wetten.overheid.nl/BWBR0006330/2004-03-01#Artikel1
  - number: 1.1.b.8°
    text: |-
      Verkopen, alsmede het verlenen van bemiddeling bij verkoop, van voertuigen, schepen, kunstvoorwerpen,
      antiquiteiten, edelstenen, edele metalen, sieraden, juwelen dan wel andere bij algemene maatregel van bestuur aan
      te wijzen zaken van grote waarde tegen geheel of gedeeltelijke contante betaling waarbij het contant te betalen
      gedeelte gelijk is aan dan wel meer bedraagt dan een door Onze Minister te bepalen bedrag, dat voor onderscheiden
      soorten van zaken verschillend kan zijn.
    url: https://wetten.overheid.nl/BWBR0006330/2004-03-01#Artikel1
  - number: 1.1.b.9°
    text: verlenen van andere bij algemene maatregel van bestuur aan te wijzen diensten;
    url: https://wetten.overheid.nl/BWBR0006330/2004-03-01#Artikel1
  - number: 1.1.c
    text: |-
      cliënt: de natuurlijke persoon of rechtspersoon aan wie een dienst wordt verleend, daaronder begrepen in geval van
      een dienst als bedoeld in onderdeel *b*, onder 5° en 6°, degene die de premie betaalt alsmede degene aan wie de
      uitkering wordt gedaan;
    url: https://wetten.overheid.nl/BWBR0006330/2004-03-01#Artikel1
  - number: 1.1.d
    text: |-
      lid-staat: een staat die lid is van de Europese Gemeenschappen alsmede een staat, niet zijnde een lid-staat van
      de Europese Gemeenschappen, die partij is bij de overeenkomst betreffende de Europese Economische Ruimte (*Trb.*
      1992, 132);
    url: https://wetten.overheid.nl/BWBR0006330/2004-03-01#Artikel1
  - number: 1.1.e
    text: 'Onze Minister: Onze Minister van Financiën.'
    url: https://wetten.overheid.nl/BWBR0006330/2004-03-01#Artikel1
  - number: '1.2'
    text: Het ingevolge het eerste lid, onderdeel *b*, onder 7°, te bepalen bedrag is ten hoogste € 18 151,21.
    url: https://wetten.overheid.nl/BWBR0006330/2004-03-01#Artikel1
  - number: '2.1'
    text: |-
      De instelling is verplicht de identiteit van een cliënt vast te stellen voordat zij aan die cliënt een dienst
      verleent. Indien de cliënt een natuurlijke persoon is die onbekwaam is de met de dienst verband houdende
      rechtshandeling te verrichten, kan de instelling volstaan met het vaststellen van de identiteit van degene die
      daarbij als de wettelijke vertegenwoordiger optreedt. Indien de instelling bij de vaststelling van de identiteit
      overeenkomstig de [artikelen 3][ref1] en [4][ref2] in redelijkheid kan twijfelen aan de juistheid van de
      verstrekte gegevens, verleent zij geen dienst dan nadat zij door het inwinnen van nadere informatie voldoende
      zekerheid heeft verkregen omtrent de identiteit van de cliënt.


      [ref1]: https://wetten.overheid.nl/BWBR0006330#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0006330#Artikel4
    url: https://wetten.overheid.nl/BWBR0006330/2004-03-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006330
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0006330
        artikel: '4'
  - number: '2.2'
    text: 'Het eerste lid is bovendien van toepassing indien:'
    url: https://wetten.overheid.nl/BWBR0006330/2004-03-01#Artikel2
  - number: 2.2.a
    text: |-
      bij het verlenen van de dienst, bedoeld in [artikel 1, eerste lid, onderdeel ][ref1], niet bekend is welk bedrag
      daarmee gemoeid zal zijn;


      [ref1]: https://wetten.overheid.nl/BWBR0006330#Artikel1
    url: https://wetten.overheid.nl/BWBR0006330/2004-03-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006330
        artikel: '1'
  - number: 2.2.b
    text: |-
      De premie, bedoeld in [artikel 1, eerste lid, onderdeel b, onder 5°][ref1], de uitkering, bedoeld
      in [artikel 1, eerste lid, onderdeel b, onder 6°][ref2], het bedrag van de transactie, bedoeld in
      [artikel 1, eerste lid, onderdeel b, onder 7°][ref3], of het contante gedeelte van de betaling, bedoeld
      in [artikel 1, eerste lid, onderdeel b, onder 8°][ref4], kleiner is dan het ingevolge die bepalingen
      vastgestelde bedrag, maar de dienst betrekking heeft op een transactie die aan de hand van de ingevolge
      [artikel 8 van de Wet melding ongebruikelijke transacties][ref5] vastgestelde indicatoren als een ongebruikelijke
      transactie als bedoeld in die wet dient te worden aangemerkt; of


      [ref1]: https://wetten.overheid.nl/BWBR0006330#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0006330#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0006330#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0006330#Artikel1
      [ref5]: https://wetten.overheid.nl/BWBR0006331#Artikel8
    url: https://wetten.overheid.nl/BWBR0006330/2004-03-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006330
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0006330
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0006330
        artikel: '1'
      - id: ref4
        bwb_id: BWBR0006330
        artikel: '1'
      - id: ref5
        bwb_id: BWBR0006331
        artikel: '8'
  - number: 2.2.c
    text: |-
      De premie, bedoeld in [artikel 1, eerste lid, onderdeel b, onder 5°][ref1], de uitkering, bedoeld
      in [artikel 1, eerste lid, onderdeel b, onder 6°][ref2], het bedrag van de transactie, bedoeld in
      [artikel 1, eerste lid, onderdeel b, onder 7°][ref3], of het contante gedeelte van de betaling, bedoeld in
      [artikel 1, eerste lid, onderdeel b, onder 8°][ref4], kleiner is dan het ingevolge die bepalingen vastgestelde
      bedrag, maar de instelling weet of redelijkerwijs moet vermoeden dat de transactie waarop de dienst betrekking
      heeft deel uitmaakt van een geheel van met elkaar samenhangende transacties, waarbij verschillende instellingen
      zijn betrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0006330#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0006330#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0006330#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0006330#Artikel1
    url: https://wetten.overheid.nl/BWBR0006330/2004-03-01#Artikel2
