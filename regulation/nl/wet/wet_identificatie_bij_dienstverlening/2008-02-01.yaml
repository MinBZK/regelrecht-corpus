  - number: 8a
    text: |-
      1 Bij besluit van Onze Minister kunnen een of meer rechtspersonen worden aangewezen, die belast zijn met
      het toezicht op de naleving door de instellingen van de [artikelen 2, eerste, tweede, en zevende lid][ref1],
      [4, eerste en tweede lid][ref2], [5][ref3], [6][ref4], [7][ref5] en [8][ref6] van deze wet.

      2 Ten aanzien van personen die door een op grond van het eerste lid aangewezen rechtspersoon belast
      zijn met het toezicht op de naleving van de artikelen, genoemd in het eerste lid, zijn de bepalingen van
      [hoofdstuk 5, afdeling 5.2, van de Algemene wet bestuursrecht][ref7] van overeenkomstige toepassing.

      3 Van een besluit tot aanwijzing op grond van het eerste lid wordt mededeling gedaan door plaatsing in de
      Staatscourant.


