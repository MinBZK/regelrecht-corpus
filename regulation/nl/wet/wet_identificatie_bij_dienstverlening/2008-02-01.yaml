  - number: 8p
    text: |-
      1 De bevoegdheid om op grond van [artikel 8l][ref1] een feit ter openbare kennis te brengen vervalt drie jaren na
      de dag waarop het feit heeft plaatsgehad.

      2 De termijn, bedoeld in het eerste lid, wordt gestuit door de bekendmaking van de beschikking waarbij het feit ter
      openbare kennis wordt gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0006330#Artikel8l
    url: https://wetten.overheid.nl/BWBR0006330/2008-02-01#Artikel8p
