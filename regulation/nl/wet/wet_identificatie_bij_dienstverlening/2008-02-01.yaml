        artikel: 8l
  - number: 8q
    text: |-
      De werkzaamheden in verband met het op grond van [artikel 8l][ref1] ter openbare kennis brengen van een feit worden
      verricht door personen die niet betrokken zijn geweest bij het vaststellen van het feit of het daaraan voorafgegane
      onderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0006330#Artikel8l
