        bwb_id: BWBR0005537
        artikel: 8:7
  - number: 8s
    text: |-
      1 De bevoegdheden die Onze Minister op grond van dit hoofdstuk heeft, kunnen bij algemene maatregel van bestuur
      worden overgedragen aan een of meer rechtspersonen die ingevolge [artikel 8a, eerste lid][ref1], zijn aangewezen.
      Alsdan gelden de verplichtingen op grond van dit hoofdstuk jegens Onze Minister als verplichtingen jegens de
      desbetreffende rechtspersoon.

      2 Aan de overdracht, bedoeld in het eerste lid, kunnen beperkingen worden gesteld en voorschriften worden
      verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0006330#Artikel8a
