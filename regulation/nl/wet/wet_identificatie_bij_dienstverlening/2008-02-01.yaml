  - number: 8o
    text: |-
      1 De bevoegdheid om op grond van [artikel 8l][ref1] een feit ter openbare kennis te brengen vervalt indien ter zake
      van het feit een strafvervolging is ingesteld en het onderzoek ter terechtzitting een aanvang heeft genomen, dan
      wel een strafbeschikking is uitgevaardigd.

      2 Het recht tot strafvervolging met betrekking tot een feit als bedoeld in [artikel 8l][ref2] vervalt, indien Onze
      Minister het feit reeds ter openbare kennis heeft gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0006330#Artikel8l
      [ref2]: https://wetten.overheid.nl/BWBR0006330#Artikel8l
    url: https://wetten.overheid.nl/BWBR0006330/2008-02-01#Artikel8o
