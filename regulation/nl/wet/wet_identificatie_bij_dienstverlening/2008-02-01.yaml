  - number: '4'
    text: |-
      1 In afwijking van [artikel 3][ref1] kan een instelling de identiteit van een cliënt die niet in persoon
      verschijnt, vaststellen door een afschrift van één van de in [artikel 3, eerste lid][ref2], genoemde documenten,
      dan wel het officiële nummer van dit document te verlangen, indien met de transactie geen contant geld gemoeid is
      en de eerste betaling die met de dienst verband houdt wordt gedaan ten gunste of ten laste van een rekening van de
      cliënt bij een instelling als bedoeld in [artikel 1, eerste lid, onderdeel a, onder 1° of 2°][ref3], met zetel in
      een van de lidstaten, die beschikt over een vergunning van de bevoegde autoriteit van die lidstaat om haar bedrijf
      te mogen uitoefenen, of in een staat die door Onze Minister is aangewezen.

      2 Indien de identiteit wordt vastgesteld op de in het vorige lid omschreven wijze, gaat de instelling na of de
      identiteit van de cliënt overeenkomt met de identiteit van de cliënt ten laste of ten gunste van wiens rekening de
      eerste betaling, bedoeld in het vorige lid, is gedaan.

      3 In afwijking van het eerste lid is geen afschrift dan wel nummer van het document vereist:

      a. indien met betrekking tot de dienst, bedoeld in [artikel 1, eerste lid, onderdeel b, onder 5° of 6°][ref4],
      de eerste premiebetaling wordt gedaan ten laste van de rekening van de cliënt bij een instelling als bedoeld in
      [artikel 1, eerste lid, onderdeel a, onder 1°of 2°][ref5], met zetel in een van de lidstaten, die beschikt over
      een vergunning van de bevoegde autoriteit van die lidstaat om haar bedrijf te mogen uitoefenen, dan wel indien
      de uitkering uit hoofde van de levensverzekeringsovereenkomst wordt betaald ten gunste van een rekening van een
      cliënt bij een instelling als hiervoor bedoeld, dan wel indien de betrokken assurantietussenpersoon, bedoeld in
      [artikel 1, eerste lid, onderdeel a, onder 5°][ref6], heeft voldaan aan de in [artikel 2, eerste lid][ref7],
      bedoelde verplichting;

      b. indien met betrekking tot de dienst, bedoeld in [artikel 1, eerste lid, onderdeel b, onder 5° of 6°][ref8],
      de premiebetaling wordt gedaan ten laste van, dan wel de uitkering uit hoofde van de levensverzekeringsovereenkomst
      wordt betaald ten gunste van een rekening van de cliënt bij een instelling als bedoeld in
      [artikel 1, eerste lid, onderdeel a, onder 1° of 2°][ref9], met zetel in een staat, niet zijnde een lidstaat,
      die door Onze Minister is aangewezen, mits de instelling die de dienst verleent van die instelling bevestiging
      heeft verkregen dat de identiteitsvaststelling van de cliënt en de registratie daarvan op diens naam zijn
      uitgevoerd;

      c. indien met betrekking tot de dienst, bedoeld in
      [artikel 1, eerste lid, onderdeel b, onder 1°, 2°, 4° of 7°][ref10], voor zover verband houdende met de handel
      in effecten, de eerste betaling die met de dienst verband houdt door de cliënt wordt gedaan of indien een betaling
      die met de dienst verband houdt aan de cliënt wordt gedaan ten laste onderscheidenlijk ten gunste van een rekening
      van die cliënt bij een kredietinstelling met zetel in een van de lidstaten of in een staat die door Onze Minister
      is aangewezen. Indien deze rekening wordt aangehouden bij een kredietinstelling die niet is gevestigd in een
      lidstaat of indien de in de vorige volzin bedoelde betaling wordt gedaan aan de cliënt dient de instelling van de
      kredietinstelling bevestiging te hebben verkregen dat de identiteitsvaststelling van die cliënt en de registratie
      daarvan op diens naam zijn uitgevoerd;

      d. in door Onze Minister aan te wijzen gevallen.

      4 Met uitzondering van het derde lid, onderdeel a, zijn het eerste en derde lid niet van toepassing
      indien de financiële dienst betrekking heeft op een transactie die als een ongebruikelijke transactie
      in de zin van de [Wet melding ongebruikelijke transacties][ref11] dient te worden aangemerkt, of indien
      [artikel 5, vierde lid][ref12], van toepassing is.

      5 Ten aanzien van de rekeningen, bedoeld in het eerste of derde lid, ten gunste of ten laste waarvan de eerste
      betaling die met de financiële dienst verband houdt wordt gedaan, dient identificatie te hebben plaatsgevonden
      overeenkomstig de bepalingen van deze wet of de Wet identiteitsvaststelling bij financiële dienstverlening.


