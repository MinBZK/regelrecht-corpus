  - number: 8d
    text: |-
      1 Het bedrag van de bestuurlijke boete wordt bepaald door vermenigvuldiging van het bedrag van € 5445 met de factor
      die van toepassing is op grond van de categorie-indeling in de bijlage.

      2 De bijlage kan bij algemene maatregel van bestuur worden gewijzigd.

      3 Onze Minister kan het bedrag van de bestuurlijke boete lager stellen dan in de bijlage is bepaald, indien het
      bedrag van de boete in een bepaald geval onevenredig hoog is.
    url: https://wetten.overheid.nl/BWBR0006330/2008-02-01#Artikel8d
  - number: 8e
    text: |-
      Degene jegens wie Onze Minister een handeling heeft verricht waaraan hij in redelijkheid de gevolgtrekking kan
      verbinden dat deze hem wegens een overtreding een bestuurlijke boete zal opleggen, is niet verplicht ter zake
      daarvan enige inlichting te verstrekken. Hij wordt hiervan door Onze Minister in kennis gesteld alvorens hem
      mondeling om informatie met betrekking tot de desbetreffende overtreding wordt gevraagd.
    url: https://wetten.overheid.nl/BWBR0006330/2008-02-01#Artikel8e
  - number: 8f
    text: |-
      1 Indien Onze Minister voornemens is een bestuurlijke boete op te leggen, geeft hij de betrokkene daarvan kennis
      onder vermelding van de gronden waarop het voornemen berust.

      2 In afwijking van [afdeling 4.1.2 van de Algemene wet bestuursrecht][ref1], stelt Onze Minister de betrokkene
      in de gelegenheid om naar keuze schriftelijk of mondeling zijn zienswijze naar voren te brengen voordat de
      bestuurlijke boete wordt opgelegd, tenzij het een overtreding betreft die in de bijlage is aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.1.2
    url: https://wetten.overheid.nl/BWBR0006330/2008-02-01#Artikel8f
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 4.1.2
  - number: 8g
    text: |-
      1 Onze Minister legt de bestuurlijke boete op bij beschikking.

      2 De beschikking vermeldt in ieder geval:

      a. het feit ter zake waarvan de bestuurlijke boete wordt opgelegd, alsmede het overtreden voorschrift;

      b. het bedrag van de bestuurlijke boete en de gegevens op basis waarvan dit bedrag is bepaald; en

      c. de termijn, bedoeld in [artikel 8h, eerste lid][ref1], waarbinnen de bestuurlijke boete moet worden betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0006330#Artikel8h
    url: https://wetten.overheid.nl/BWBR0006330/2008-02-01#Artikel8g
    references:
      - id: ref1
        bwb_id: BWBR0006330
        artikel: 8h
  - number: 8h
    text: |-
      1 De bestuurlijke boete wordt betaald binnen zes weken na de inwerkingtreding van de beschikking waarbij zij is
      opgelegd.

      2 De bestuurlijke boete wordt vermeerderd met de wettelijke rente, te rekenen vanaf de dag waarop sedert de
      bekendmaking van de beschikking zes weken zijn verstreken.

      3 Indien de bestuurlijke boete niet tijdig is betaald, stuurt Onze Minister schriftelijk een aanmaning om binnen
      twee weken de boete, verhoogd met de kosten van de aanmaning, alsnog te betalen. De aanmaning bevat de aanzegging
      dat de boete, voor zover deze niet binnen de gestelde termijn wordt betaald, overeenkomstig het vierde lid zal
      worden ingevorderd.

      4 Bij gebreke van tijdige betaling kan Onze Minister de bestuurlijke boete, verhoogd met de kosten van de aanmaning
      en van de invordering, bij dwangbevel invorderen.

      5 Het dwangbevel wordt op kosten van de overtreder bij deurwaardersexploit betekend en levert een executoriale
      titel op in de zin van het [Tweede Boek van het Wetboek van Burgerlijke Rechtsvordering][ref1].

      6 Gedurende zes weken na de dag van betekening staat verzet tegen het dwangbevel open door dagvaarding van de
      Staat.

      7 Het verzet schorst de tenuitvoerlegging niet, tenzij de voorzieningenrechter van de rechtbank in kort geding
      desgevraagd anders beslist.

      8 Het verzet kan niet worden gegrond op de stelling dat de bestuurlijke boete ten onrechte of op een te hoog bedrag
      is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0006330/2008-02-01#Artikel8h
    references:
      - id: ref1
        bwb_id: BWBR0001827
  - number: 8i
    text: |-
      1 De bevoegdheid tot het opleggen van een bestuurlijke boete vervalt indien ter zake van de overtreding op grond
      waarvan de boete kan worden opgelegd tegen de overtreder een strafvervolging is ingesteld en het onderzoek ter
      terechtzitting een aanvang heeft genomen, dan wel een strafbeschikking is uitgevaardigd.

      2 Het recht tot strafvervolging met betrekking tot een overtreding van de artikelen genoemd in [artikel 8c][ref1]
      vervalt, indien Onze Minister ter zake van die overtreding reeds een bestuurlijke boete heeft opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0006330#Artikel8c
    url: https://wetten.overheid.nl/BWBR0006330/2008-02-01#Artikel8i
    references:
      - id: ref1
        bwb_id: BWBR0006330
        artikel: 8c
  - number: 8j
    text: |-
      1 De bevoegdheid een bestuurlijke boete op te leggen vervalt drie jaren na de dag waarop de overtreding is begaan.

      2 De termijn, bedoeld in het eerste lid, wordt gestuit door de bekendmaking van de beschikking waarbij een boete
      wordt opgelegd.
    url: https://wetten.overheid.nl/BWBR0006330/2008-02-01#Artikel8j
  - number: 8k
    text: |-
      De werkzaamheden in verband met het opleggen van een dwangsom of van een bestuurlijke boete worden verricht
      door personen die niet betrokken zijn geweest bij het vaststellen van de overtreding of het daaraan voorafgegane
      onderzoek.
    url: https://wetten.overheid.nl/BWBR0006330/2008-02-01#Artikel8k
  - number: 8l
    text: |-
      Onze Minister kan het feit ter zake waarvan de last onder dwangsom of de bestuurlijke boete is opgelegd, het
      overtreden voorschrift, alsmede de naam, het adres en de woonplaats van degene aan wie de last onder dwangsom of de
      bestuurlijke boete is opgelegd, ter openbare kennis brengen zonodig onder vermelding van de overwegingen die tot de
      kennisgeving hebben geleid.
    url: https://wetten.overheid.nl/BWBR0006330/2008-02-01#Artikel8l
  - number: 8m
    text: |-
      Degene jegens wie door Onze Minister een handeling is verricht waaraan hij in redelijkheid de gevolgtrekking kan
      verbinden dat deze zijn handelen of nalaten op grond van [artikel 8l][ref1] ter openbare kennis zal brengen, is
      niet verplicht ter zake daarvan enige verklaring af te leggen. Hij wordt hiervan in kennis gesteld alvorens hem
      mondeling om informatie wordt gevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0006330#Artikel8l
    url: https://wetten.overheid.nl/BWBR0006330/2008-02-01#Artikel8m
    references:
      - id: ref1
        bwb_id: BWBR0006330
        artikel: 8l
  - number: 8n
    text: |-
      1 Onze Minister geeft, indien hij voornemens is op grond van [artikel 8l][ref1] een feit ter openbare kennis te
      brengen, de betrokkene daarvan kennis onder vermelding van de gronden waarop het voornemen berust.

      2 In aanvulling op [artikel 4:8 van de Algemene wet bestuursrecht][ref2] is Onze Minister niet gehouden de
      betrokkene in de gelegenheid te stellen om zijn zienswijze naar voren te brengen, indien van de betrokkene geen
      adres bekend is en het adres ook niet met een redelijke inspanning kan worden verkregen.

      3 De beschikking om op grond van [artikel 8l][ref3] een feit ter openbare kennis te brengen vermeldt in ieder
      geval:

      a. het feit dat ter openbare kennis wordt gebracht;

      b. de wijze waarop het feit ter openbare kennis wordt gebracht; en

      c. de termijn waarna het feit ter openbare kennis wordt gebracht.

      4 Tenzij de bevordering van de naleving van deze wet geen uitstel toelaat, wordt de werking van de beschikking
      om op grond van [artikel 8l][ref4] een feit ter openbare kennis te brengen opgeschort totdat de beroepstermijn is
      verstreken of, indien beroep is ingesteld, op het beroep is beslist.

      5 In afwijking van [artikel 3:40 van de Algemene wet bestuursrecht][ref5] treedt de beschikking in werking op de
      dag waarop het feit ter openbare kennis is gebracht zonder dat de werking voor de duur van de beroepstermijn of,
      indien beroep is ingesteld, van het beroep wordt opgeschort, indien van de betrokkene geen adres bekend is en het
      adres ook niet met een redelijke inspanning kan worden verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0006330#Artikel8l
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel48
      [ref3]: https://wetten.overheid.nl/BWBR0006330#Artikel8l
      [ref4]: https://wetten.overheid.nl/BWBR0006330#Artikel8l
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel340
