    text: |-
      1 Onze Minister kan een bestuurlijke boete opleggen ter zake van overtreding van voorschriften
      gesteld bij of krachtens de artikelen de [artikelen 2, eerste, tweede, en zevende lid][ref1],
      [4, eerste en tweede lid][ref2], [5][ref3], [6][ref4], [7][ref5] en [8][ref6] van deze wet en van
      [artikel 5:20 van de Algemene wet bestuursrecht][ref7].

      2 Het eerste lid is niet van toepassing op de degene die, in geval van bezwaren tegen diens handelen of nalaten in
      de beroepsuitoefening, onderworpen is aan tuchtrechtspraak.

      3 De bestuurlijke boete komt toe aan de Staat.


