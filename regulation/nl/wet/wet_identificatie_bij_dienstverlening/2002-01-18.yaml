  - number: '2'
    text: |-
      1 De instelling is verplicht de identiteit van een cliënt vast te stellen voordat zij aan die cliënt een dienst
      verleent.

      Indien de cliënt een natuurlijke persoon is die onbekwaam is de met de dienst verband houdende rechtshandeling
      te verrichten, kan de instelling volstaan met het vaststellen van de identiteit van degene die daarbij als de
      wettelijke vertegenwoordiger optreedt.

      Indien de instelling bij de vaststelling van de identiteit overeenkomstig de [artikelen 3][ref1] en [4][ref2] in
      redelijkheid kan twijfelen aan de juistheid van de verstrekte gegevens, verleent zij geen dienst dan nadat zij door
      het inwinnen van nadere informatie voldoende zekerheid heeft verkregen omtrent de identiteit van de cliënt.

      2 Het eerste lid is bovendien van toepassing indien:

      a. bij het verlenen van de dienst, bedoeld in [artikel 1, eerste lid, onderdeel ][ref3], niet bekend is welk bedrag
      daarmee gemoeid zal zijn;

      b. De premie, bedoeld in [artikel 1, eerste lid, onderdeel b, onder 5°][ref4], de uitkering, bedoeld
      in [artikel 1, eerste lid, onderdeel b, onder 6°][ref5], het bedrag van de transactie, bedoeld in
      [artikel 1, eerste lid, onderdeel b, onder 7°][ref6], of het contante gedeelte van de betaling, bedoeld
      in [artikel 1, eerste lid, onderdeel b, onder 8°][ref7], kleiner is dan het ingevolge die bepalingen
      vastgestelde bedrag, maar de dienst betrekking heeft op een transactie die aan de hand van de ingevolge
      [artikel 8 van de Wet melding ongebruikelijke transacties][ref8] vastgestelde indicatoren als een ongebruikelijke
      transactie als bedoeld in die wet dient te worden aangemerkt; of

      c. De premie, bedoeld in [artikel 1, eerste lid, onderdeel b, onder 5°][ref9], de uitkering, bedoeld
      in [artikel 1, eerste lid, onderdeel b, onder 6°][ref10], het bedrag van de transactie, bedoeld in
      [artikel 1, eerste lid, onderdeel b, onder 7°][ref11], of het contante gedeelte van de betaling, bedoeld in
      [artikel 1, eerste lid, onderdeel b, onder 8°][ref12], kleiner is dan het ingevolge die bepalingen vastgestelde
      bedrag, maar de instelling weet of redelijkerwijs moet vermoeden dat de transactie waarop de dienst betrekking
      heeft deel uitmaakt van een geheel van met elkaar samenhangende transacties, waarbij verschillende instellingen
      zijn betrokken.

      3 Het eerste lid is niet van toepassing met betrekking tot de dienst, bedoeld
      in [artikel 1, eerste lid, onderdeel ][ref13], voor zover het betreft een
      levensverzekeringsovereenkomst als bedoeld in [artikel 2][ref14], vierde lid, onder B en C, en
      [artikel 9, eerste lid, van de Pensioen- en spaarfondsenwet][ref15] en [artikel 2][ref16], tweede lid, onderdeel
      *b*, en [artikel 9, eerste lid, van de Wet betreffende verplichte deelneming in een beroepspensioenregeling][ref17],
      tenzij deze wordt afgekocht of als zekerheidsstelling dient.

      4 Aan de verplichting, bedoeld in het eerste lid, is voldaan, indien de instelling voor de vaststelling van de
      identiteit van een cliënt gebruik maakt van de gegevens die zij bij een eerder aan die cliënt verleende dienst,
      overeenkomstig de bepalingen van deze wet of ingevolge de Wet identiteitsvaststelling heeft vastgesteld. De eerste
      volzin is niet van toepassing indien het betreft een dienst ter zake van een transactie met een tegengestelde
      waarde of gezamenlijke tegenwaarde welke gelijk is aan dan wel meer bedraagt dan een bedrag van € 10 000 en deze
      dienst wordt verricht door een ander filiaal van de dienst dan het filiaal dat de identiteit van de cliënt heeft
      vastgesteld.

      Indien de eerder aan de cliënt verleende dienst, bedoeld in de eerste volzin, betreft het openstellen van een
      rekening waarop een saldo in geld, effecten, edele metalen of andere waarden kan worden aangehouden en deze
      rekening is geopend vóór 18 januari 1989, mag gebruik worden gemaakt van de gegevens die bij het opstellen van die
      rekening zijn vastgesteld.

      5 Onze Minister kan vrijstelling verlenen van het eerste lid indien als cliënt optreedt:

      a. een onderneming of dienst die hetzij geregistreerd is ingevolge
      [artikel 52 van de Wet toezicht kredietwezen 1992][ref18],
      [artikel 21 van de Wet toezicht effectenverkeer 1995][ref19] of
      [artikel 18 van de Wet toezicht beleggingsinstellingen][ref20], hetzij beschikt over een vergunning als bedoeld in
      [artikel 24, eerste lid, van de Wet toezicht verzekeringsbedrijf 1993][ref21];

      b. een onderneming of instelling waaraan door de bevoegde autoriteiten in een andere staat een vergunning is
      verleend overeenkomstig [Richtlijn 85/611/EEG](31985L0611), [Richtlijn 92/49/EEG](31992L0049), [Richtlijn 92/96/
      EEG](31992L0096) of [Richtlijn 2000/12/EG](32000L0012);

      c. een onderneming of dienst die behoort tot een door Onze Minister aan te wijzen categorie.

      6 Onze Minister kan ontheffing verlenen van het eerste lid.

      7 Aan een vrijstelling als bedoeld in het vierde lid en aan een ontheffing als bedoeld in het vijfde lid kunnen
      beperkingen worden gesteld en voorschriften worden verbonden.


