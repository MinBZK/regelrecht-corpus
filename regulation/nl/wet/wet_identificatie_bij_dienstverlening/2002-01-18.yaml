  - number: '8'
    text: >-
      Het is de instelling verboden een dienst te verlenen indien de identiteit van de cliënt niet op de bij deze wet
      voorgeschreven wijze is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006330/2002-01-18#Artikel8
