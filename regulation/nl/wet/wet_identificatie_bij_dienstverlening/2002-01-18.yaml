preamble:
  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:


    Alzo Wij in overweging genomen hebben, dat de bestaande wetgeving met betrekking tot identiteitsvaststelling bij
    financiële dienstverlening aangepast dient te worden aan de richtlijn van de Raad van de Europese Gemeenschappen
    van 10 juni 1991 tot voorkoming van het gebruik van het financiële stelsel voor het witwassen van geld (91/308/
    EEG);


    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0006330/2002-01-18#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. instelling:

      1°. een kredietinstelling als bedoeld in [artikel 1, eerste lid, onderdeel ][ref1];

      2°. een verzekeraar als bedoeld in [artikel 1, eerste lid, onderdeel ][ref2], behoudens voor zover artikel 13 van
      die wet van toepassing is;

      3°. een beleggingsinstelling als bedoeld in [artikel 1, onderdeel ][ref3];

      4°. een effecteninstelling als bedoeld in [artikel 1, onderdeel ][ref4];

      5°. een tussenpersoon als bedoeld in [artikel 1, onder ][ref5];

      6°. De beroeps- of bedrijfsmatig handelende verkoper, alsmede degene die beroeps- of bedrijfsmatig bemiddeling
      verleent bij verkoop, van voertuigen, schepen, kunstvoorwerpen, antiquiteiten, edelstenen, edele metalen, sieraden,
      juwelen, dan wel andere bij algemene maatregel van bestuur aan te wijzen zaken van grote waarde, voor zover
      betaling van deze zaken in contanten plaatsvindt.

      7°. een natuurlijke persoon of rechtspersoon die behoort tot een bij algemene maatregel van bestuur aan te wijzen
      categorie beroepen, bedrijven of instellingen;

      b. dienst: het door een instelling in of vanuit Nederland:

      1°. in bewaring nemen van effecten, bankbiljetten, munten, muntbiljetten, edele metalen en andere waarden;

      2°. openstellen van een rekening waarop een saldo in geld, effecten, edele metalen of andere waarden kan worden
      aangehouden;

      3°. verhuren van een safe-loket;

      4°. verrichten van een uitbetaling ter zake van het verzilveren van coupons of vergelijkbare stukken van obligaties
      of vergelijkbare waardepapieren;

      5°. sluiten van een levensverzekeringsovereenkomst als bedoeld in [artikel 1, eerste lid, onderdeel ][ref6] tegen
      een premie als bedoeld in [artikel 1, eerste lid, onderdeel ][ref7] boven een door Onze Minister te bepalen bedrag,
      alsmede het daarbij verlenen van bemiddeling;

      6°. doen van een uitkering uit hoofde van een levensverzekeringsovereenkomst als bedoeld onder 5° welke meer
      bedraagt dan een door Onze Minister te bepalen bedrag;

      7°. verlenen van een dienst ter zake van een transactie of van kennelijk met elkaar samenhangende transacties, met
      een tegenwaarde of gezamenlijke tegenwaarde welke gelijk is aan dan wel meer bedraagt dan een door Onze Minister te
      bepalen bedrag, dat voor onderscheiden soorten van transacties verschillend kan zijn;

      8°. Verkopen, alsmede het verlenen van bemiddeling bij verkoop, van voertuigen, schepen, kunstvoorwerpen,
      antiquiteiten, edelstenen, edele metalen, sieraden, juwelen dan wel andere bij algemene maatregel van bestuur aan
      te wijzen zaken van grote waarde tegen geheel of gedeeltelijke contante betaling waarbij het contant te betalen
      gedeelte gelijk is aan dan wel meer bedraagt dan een door Onze Minister te bepalen bedrag, dat voor onderscheiden
      soorten van zaken verschillend kan zijn.

      9°. verlenen van andere bij algemene maatregel van bestuur aan te wijzen diensten;

      c. cliënt: de natuurlijke persoon of rechtspersoon aan wie een dienst wordt verleend, daaronder begrepen in geval
      van een dienst als bedoeld in onderdeel *b*, onder 5° en 6°, degene die de premie betaalt alsmede degene aan wie de
      uitkering wordt gedaan;

      d. lid-staat: een staat die lid is van de Europese Gemeenschappen alsmede een staat, niet zijnde een lid-staat van
      de Europese Gemeenschappen, die partij is bij de overeenkomst betreffende de Europese Economische Ruimte (*Trb.*
      1992, 132);

      e. Onze Minister: Onze Minister van Financiën.

      2 Het ingevolge het eerste lid, onderdeel *b*, onder 7°, te bepalen bedrag is ten hoogste € 18 151,21.


