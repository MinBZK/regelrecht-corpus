  - number: '6'
    text: |-
      De instelling is verplicht de volgende gegevens vast te leggen op een zodanige wijze dat deze toegankelijk zijn:

      a. de geslachtsnaam, de voornamen, de geboortedatum, het adres en de woonplaats dan wel plaats van vestiging
      van de cliënt en van degene te wiens name het depot of de rekening wordt gesteld, van degene die toegang tot
      het safe-loket zal hebben of degene te wiens name een uitbetaling of transactie wordt verricht, alsmede van hun
      vertegenwoordigers;

      b. de aard, het nummer en de datum en plaats van uitgifte van het document met behulp waarvan de
      identiteitsvaststelling heeft plaatsgevonden, behoudens indien [artikel 4, derde lid][ref1], van toepassing is;

      c. de aard van de dienst; en

      d. 1°. in het geval van het in bewaring nemen van de in [artikel 1, eerste lid, onderdeel ][ref2], genoemde
      waarden: het desbetreffende depotnummer en de marktwaarde die deze waarden vertegenwoordigen op het tijdstip
      van de inbewaringneming, of bij ontstentenis van een marktwaarde het bedrag dat deze waarden vertegenwoordigen,
      berekend volgens andere in het maatschappelijk verkeer gebruikelijke waarderingsgrondslagen, of indien het bedrag
      dat deze waarden vertegenwoordigen in redelijkheid niet kan worden vastgesteld, een nauwkeurige omschrijving van
      die waarden;

      2°. in het geval van het openstellen van een rekening: een duidelijke omschrijving van de soort rekening en het aan
      die rekening toegekende nummer;

      3°. in het geval van verhuur van een safe-loket: het nummer of een andere onderscheidende aanduiding van het
      desbetreffende safe-loket;

      4°. in het geval van het verrichten van uitbetalingen ter zake van het verzilveren van coupons of vergelijkbare
      stukken van obligaties of vergelijkbare waardepapieren: het bedrag dat met de transactie is gemoeid en het
      desbetreffende rekeningnummer;

      5°. in het geval van het sluiten van een levensverzekeringsovereenkomst: het nummer van de rekening ten laste
      waarvan de eerste premiebetaling wordt gedaan;

      6°. in het geval van het doen van een uitkering uit hoofde van een levensverzekeringsovereenkomst: het nummer van
      de rekening ten gunste waarvan de uitkering wordt gedaan;

      7°. in het geval van een dienst als bedoeld in [artikel 1, eerste lid, onderdeel ][ref3]: het bedrag dat met de
      transactie is gemoeid en het desbetreffende rekeningnummer;

      8°. In het geval van een dienst als bedoeld in [artikel 1, eerste lid, onderdeel b, onder 8°][ref4]: een
      omschrijving van de desbetreffende zaken van grote waarde en de hoogte van het contante gedeelte van de betaling.

      9°. in het geval van een dienst als bedoeld in [artikel 1, eerste lid, onderdeel b, onder 9°][ref5]: de op die
      dienst betrekking hebbende gegevens die bij algemene maatregel van bestuur zijn aangewezen.


