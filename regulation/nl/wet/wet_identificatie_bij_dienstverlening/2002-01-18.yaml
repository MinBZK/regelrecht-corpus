  - number: '5'
    text: |-
      1 De instelling is verplicht de identiteit van de natuurlijke persoon die namens een cliënt of namens een
      vertegenwoordiger van een cliënt bij haar verschijnt overeenkomstig de [artikelen 3][ref1] en [4][ref2] vast te
      stellen voordat zij de dienst verleent.

      2 De instelling is verplicht na te gaan of de natuurlijke persoon die voor haar verschijnt voor zichzelf optreedt
      dan wel voor een derde.

      3 Indien de natuurlijke persoon optreedt voor een derde is de instelling verplicht de identiteit van die derde
      vast te stellen met behulp van door de natuurlijke persoon over te leggen documenten, bedoeld in [artikel 3][ref3]
      tenzij [artikel 2, eerste lid, tweede volzin][ref4], van toepassing is. Indien de derde optreedt voor een andere
      derde is de instelling verplicht de identiteit van die andere derde op dezelfde wijze vast te stellen tenzij
      [artikel 2, eerste lid, tweede volzin][ref5], van toepassing is.

      4 Indien de instelling weet of redelijkerwijs moet vermoeden dat de natuurlijke persoon die voor haar verschijnt
      niet voor zichzelf optreedt, dient zij redelijke maatregelen te treffen teneinde de identiteit van de cliënt voor
      wie hij optreedt en, ingeval van vertegenwoordiging van een cliënt door een derde van die vertegenwoordiger te
      achterhalen.

      5 Het derde en vierde lid zijn niet van toepassing indien de natuurlijke persoon een instelling is dan wel optreedt
      namens een instelling waarop een vrijstelling als bedoeld in [artikel 2, vijfde lid][ref6], of een ontheffing als
      bedoeld in [artikel 2, zesde lid][ref7], van toepassing is, mits die instelling de identiteit van de derde voor
      wie zij optreedt overeenkomstig deze wet dan wel overeenkomstig de wet van een door Onze Minister aangewezen staat
      heeft vastgesteld.

      6 Onze Minister kan vrijstelling en, op verzoek, ontheffing verlenen van het derde en vierde lid. Aan een
      vrijstelling en aan een ontheffing kunnen beperkingen worden gesteld en voorschriften worden verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0006330#Artikel3
