  - number: '3'
    text: |-
      1 Indien de cliënt een natuurlijke persoon is, wordt de identiteit vastgesteld met behulp van een van de volgende
      documenten:

      a. een geldig reisdocument in de zin van de [Paspoortwet][ref1];

      b. een geldig rijbewijs dat is afgegeven op basis van de Wegenverkeerswet dan wel een geldig rijbewijs als bedoeld
      in [artikel 107 van de Wegenverkeerswet 1994][ref2];

      c. een document waarover een vreemdeling ingevolge de [Vreemdelingenwet 2000][ref3] moet beschikken ten bewijze van
      zijn identiteit en zijn verblijfsrechtelijke positie;

      d. een document dat door Onze Minister is aangewezen.

      2 Indien de cliënt een Nederlandse rechtspersoon is dan wel een buitenlandse rechtspersoon die in Nederland is
      gevestigd, wordt de identiteit vastgesteld met behulp van een gewaarmerkt uittreksel uit het register van de
      Kamer van Koophandel en Fabrieken waar die rechtspersoon is ingeschreven dan wel met behulp van een door een in
      Nederland gevestigde notaris opgemaakte akte. In dit uittreksel of deze akte zijn in elk geval de volgende gegevens
      opgenomen:

      1°. van de rechtspersoon: de rechtsvorm, de statutaire naam, de handelsnaam, het adres met huisnummer, de postcode,
      de plaats van vestiging, het land van statutaire zetel en, indien de rechtspersoon bij een Kamer van Koophandel
      is geregistreerd, het registratienummer bij de Kamer van Koophandel en Fabrieken en de plaats van vestiging van de
      Kamer van Koophandel en Fabrieken waar de rechtspersoon is ingeschreven;

      2°. van degenen die de rechtspersoon bij de instelling vertegenwoordigen: de geslachtsnaam, de voornamen, de
      geboortedatum en het document aan de hand waarvan hun identiteit is vastgesteld.

      3 Indien de cliënt een buitenlandse rechtspersoon is die niet in Nederland is gevestigd, wordt de identiteit
      vastgesteld met behulp van een gewaarmerkt uittreksel uit het officiële handelsregister van de staat waar zich de
      statutaire zetel van die rechtspersoon bevindt, dan wel met behulp van een verklaring, afgegeven door een notaris
      of door een andere van de rechtspersoon onafhankelijke functionaris uit die staat, die de betrouwbaarheid van deze
      verklaring op grond van de aard van zijn functie voldoende kan waarborgen. In dit uittreksel of deze verklaring
      zijn, voor zover van toepassing, in elk geval de volgende gegevens opgenomen:

      1°. van de rechtspersoon: de rechtsvorm, de statutaire naam, de handelsnaam, het adres met huisnummer, de postcode,
      de plaats van vestiging, het land van statutaire zetel en het registratienummer bij het handelsregister en de
      plaats van vestiging van het handelsregister waar de rechtspersoon is ingeschreven;

      2°. van degenen die de rechtspersoon bij de instelling vertegenwoordigen: de geslachtsnaam, de voornamen, de
      geboortedatum en het document aan de hand waarvan hun identiteit is vastgesteld;

      3°. van de functionaris die de identiteit van de rechtspersoon vaststelt een verklaring dat hij onafhankelijk is
      van de te identificeren rechtspersoon.

      4 Indien de cliënt een publiekrechtelijke rechtspersoon is, kan de identiteit, onverminderd het tweede en
      derde lid, tevens worden vastgesteld door een verklaring van het bestuursorgaan, indien het een Nederlandse
      publiekrechtelijke rechtspersoon betreft, of een verklaring van het bevoegde gezag, indien het een buitenlandse
      publiekrechtelijke rechtspersoon betreft.

      In deze verklaring, die blijkens haar dagtekening niet langer dan een jaar tevoren mag zijn afgegeven, zijn, voor
      zover van toepassing, in elk geval de volgende gegevens opgenomen:

      1°. de datum van afgifte;

      2°. van de rechtspersoon: de naam, de wettelijke regeling of het besluit waaraan de publiekrechtelijke
      rechtspersoon zijn rechtspersoonlijkheid ontleent, het adres met huisnummer, de plaats van vestiging en het land
      van zetel;

      3°. van degenen die de rechtspersoon bij de instelling vertegenwoordigen: de geslachtsnaam, de voornamen, de
      geboortedatum, de functie, het document aan de hand waarvan hun identiteit is vastgesteld, alsmede het document op
      grond waarvan de bevoegdheid tot het vertegenwoordigen van de publiekrechtelijke rechtspersoon ten aanzien van de
      betreffende dienst bestaat;

      4°. van degene die de verklaring namens het bestuursorgaan dan wel het bevoegde gezag afgeeft: de geslachtsnaam, de
      voornamen, de geboortedatum en de functie.

      5 De identiteit van kerkgenootschappen, zelfstandige onderdelen hiervan of lichamen waarin zij zijn verenigd kan,
      onverminderd het tweede en derde lid, tevens worden vastgesteld aan de hand van een verklaring van de organisatie
      waarvan het kerkgenootschap, het zelfstandig onderdeel of het lichaam deel uitmaakt. Indien het kerkgenootschap,
      zelfstandige onderdeel of het lichaam geen deel uitmaakt van een organisatie, kan de identiteit worden vastgesteld
      aan de hand van een eigen verklaring van het kerkgenootschap of het lichaam, welke verklaring blijkens haar
      dagtekening niet langer dan een jaar tevoren mag zijn afgegeven.

      In de verklaring zijn, voor zover van toepassing, in elk geval de volgende gegevens opgenomen:

      1°. de datum van afgifte;

      2°. van het kerkgenootschap, het zelfstandig onderdeel of het lichaam: de rechtsvorm, de naam, het adres met
      huisnummer, de plaats en het land van vestiging;

      3°. van degenen die het kerkgenootschap, het zelfstandig onderdeel of het lichaam bij de instelling
      vertegenwoordigen: de geslachtsnaam, de voornamen, de geboortedatum, de functie bij het kerkgenootschap, het
      zelfstandig onderdeel of het lichaam alsmede een vermelding van het type en nummer van het document aan de hand
      waarvan de identiteit door het kerkgenootschap, het zelfstandig onderdeel of het lichaam is vastgesteld;

      4°. van de organisatie die de verklaring afgeeft: de naam en plaats van vestiging;

      5°. van degene die de verklaring namens de organisatie, het kerkgenootschap of het lichaam afgeeft: de
      geslachtsnaam, de voornamen, de geboortedatum en de functie.


