    text: |-
      1 Met het toezicht op de naleving van de [artikelen 7][ref1] en [8][ref2] kunnen worden belast de bij besluit van
      Onze Minister van Financiën aangewezen personen.

      2 Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.


