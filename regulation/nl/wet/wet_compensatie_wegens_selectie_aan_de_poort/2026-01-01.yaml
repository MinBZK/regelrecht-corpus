        hoofdstuk: V
  - number: '4'
    text: |-
      1 De compensatie, bedoeld in [artikel 2, eerste, tweede en derde lid][ref1], is gelijk aan het bedrag waarmee het
      verzamelinkomen bij de aanslag of navorderingsaanslag hoger is vastgesteld dan het verzamelinkomen dat volgt uit de
      aangifte, onderscheidenlijk de reeds opgelegde aanslag.

      2 Indien het bedrag waarmee het verzamelinkomen bij de aanslag of navorderingsaanslag hoger is vastgesteld dan
      het verzamelinkomen dat volgt uit de aangifte, onderscheidenlijk de reeds opgelegde aanslag, wordt bijgesteld naar
      aanleiding van een verzoek om ambtshalve vermindering, bezwaar dan wel een daaropvolgend beroep tegen de aanslag
      of navorderingsaanslag, is de compensatie gelijk aan het bedrag waarmee het bijgestelde verzamelinkomen hoger is
      dan het verzamelinkomen dat volgt uit de aangifte onderscheidenlijk reeds opgelegde aanslag. Als ten tijde van het
      vaststellen van de compensatie sprake is van een verzoek om ambtshalve vermindering, ingediend bezwaar, ingesteld
      beroep, hoger beroep en beroep in cassatie tegen de aanslag of navorderingsaanslag waarop nog niet is beslist,
      vindt de vaststelling van de compensatie pas plaats nadat op het verzoek om ambtshalve vermindering, bezwaar,
      beroep, hoger beroep en beroep in cassatie tegen de aanslag of navorderingsaanslag is beslist.

      3 De compensatie, bedoeld in [artikel 2, eerste, tweede en derde lid][ref2], wordt vermeerderd
      met een rentevergoeding die forfaitair wordt vastgesteld. De hoogte van de forfaitaire
      rentevergoeding wordt vastgesteld aan de hand van de percentages van de belastingrente, bedoeld in
      [hoofdstuk VA van de Algemene wet inzake rijksbelastingen][ref3], die voor de inkomstenbelasting van toepassing
      zijn geweest in de jaren vanaf het jaar waarin de aangifte of aanslag handmatig is beoordeeld en waarbij het
      verzamelinkomen niet is gevolgd, bedoeld in artikel 2, eerste, tweede of derde lid, tot en met 31 december 2023.


      [ref1]: https://wetten.overheid.nl/BWBR0049128#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0049128#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0002320#HoofdstukVA
