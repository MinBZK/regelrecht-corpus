  - number: '6'
    text: |-
      1 Uitbetaling van de compensatie, bedoeld in [artikel 2, eerste, tweede en derde lid][ref1], en uitbetaling van
      de aanvullende compensatie, bedoeld in [artikel 5, eerste lid][ref2], vindt plaats op het bankrekeningnummer dat
      ten aanzien van de belanghebbende bekend is bij de Belastingdienst ten behoeve van de fiscale verplichtingen van
      die belanghebbende.

      2 Bij de uitbetaling van de compensatie en aanvullende compensatie door de Belastingdienst is
      [artikel 24 van de Invorderingswet 1990][ref3] niet van overeenkomstige toepassing.

      3 De uitbetaling van de compensatie, bedoeld in [artikel 2, eerste, tweede en derde lid][ref4], aan een nabestaande
      vindt plaats op een daartoe door die nabestaande bestemde bankrekening die op diens naam staat, binnen zes
      weken nadat de compensatie is toegekend en het bankrekeningnummer van de nabestaande bij de inspecteur bekend
      is geworden. Indien de nabestaande minderjarig is, vindt de uitbetaling plaats op een bankrekening die daartoe
      is bestemd door diens wettelijke vertegenwoordiger en die op naam staat van de nabestaande of diens wettelijke
      vertegenwoordiger.

      4 De inspecteur betaalt de compensatie, bedoeld in [artikel 2, eerste, tweede en derde lid][ref5], niet uit aan een
      nabestaande als het bankrekeningnummer van de nabestaande niet binnen zes weken na toekenning van de compensatie
      aan deze nabestaande bij de inspecteur bekend is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0049128#Artikel2
