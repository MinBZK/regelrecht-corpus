  - number: '3'
    text: |-
      1 De compensatie, bedoeld in [artikel 2, eerste, tweede en derde lid][ref1], wordt vastgesteld bij voor bezwaar
      vatbare beschikking en meerdere compensaties aan een belanghebbende kunnen bij dezelfde voor bezwaar vatbare
      beschikking worden vastgesteld.

      2 Op het bezwaar, beroep, hoger beroep en beroep in cassatie inzake de in het eerste lid bedoelde beschikking is
      [hoofdstuk V van de Algemene wet inzake rijksbelastingen][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0049128#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002320#HoofdstukV
    url: https://wetten.overheid.nl/BWBR0049128/2026-01-01#Artikel3
