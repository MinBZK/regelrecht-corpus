  - number: '7'
    text: |-
      Indien een aangifte over de kalenderjaren 2012 tot en met 2019 is geselecteerd voor een handmatige beoordeling,
      bedoeld in [artikel 2, eerste lid, onderdeel a][ref1], en de selectienorm is toegepast, bedoeld in artikel 2,
      eerste lid, onderdeel b, en de aanslag niet is vastgesteld overeenkomstig het verzamelinkomen dat volgt uit de
      aangifte en hierdoor sprake is van een hoger verzamelinkomen dan dat volgt uit de aangifte, bedoeld in artikel 2,
      eerste lid, onderdeel c, en aan de belanghebbende op grond van deze wet geen compensatie wordt toegekend, wordt het
      niet toekennen van de compensatie bij voor bezwaar vatbare beschikking vastgesteld. [Artikel 3, eerste lid][ref2],
      is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0049128#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0049128#Artikel3
