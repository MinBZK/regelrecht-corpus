preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is een compensatie toe te kennen aan bepaalde burgers wier
    aangifte inkomstenbelasting en premie volksverzekeringen is geselecteerd voor handmatige beoordeling, zonder dat
    voor deze selectie een fiscale reden aannemelijk kan worden gemaakt, waardoor bij de vaststelling van de aanslag
    of navorderingsaanslag inkomstenbelasting en premie volksverzekeringen de aangifte, onderscheidenlijk de reeds
    opgelegde aanslag, met betrekking tot het verzamelinkomen niet is gevolgd;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0049128/2026-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet wordt verstaan onder:

        - *aanslag:* een aanslag als bedoeld in [artikel 11 van de Algemene wet inzake rijksbelastingen][ref1] voor de
      inkomstenbelasting en premie volksverzekeringen;
        - *inkomensafhankelijke regelingen:* bij of krachtens de wet vastgestelde regelingen die natuurlijke personen
      aanspraak geven op een financiële bijdrage van het Rijk in kosten of bijdrageverplichtingen, waarbij de hoogte van
      de bijdrage in die regelingen afhankelijk is gesteld van draagkracht;
        - *inspecteur:* de inspecteur, bedoeld in
      [artikel 2, derde lid, onderdeel b, van de Algemene wet inzake rijksbelastingen][ref2];
        - *nabestaande:* a. de partner, bedoeld in [artikel 5a van de Algemene wet inzake rijksbelastingen][ref3], van
      de belanghebbende op het moment dat die belanghebbende is komen te overlijden; b. bij ontstentenis van de onder a
      bedoelde persoon, het kind, zijnde bloedverwant of aanverwant in de neergaande lijn, van de belanghebbende;
        - *navorderingsaanslag:* een navorderingsaanslag als bedoeld in
      [artikel 16 van de Algemene wet inzake rijksbelastingen][ref4] ter zake van de inkomstenbelasting en premie
      volksverzekeringen;
        - *selectienorm:* het na de selectie opnemen van een Aanslagbelastingsysteem Klantinformatiecode 1043, 1044, 9044,
      of 9045 dan wel een 10-cijferige IT Service Management tijdsregistratiecode beginnend met 11 in het redenveld van
      een Uitworp Gewenst en een daaropvolgende registratie in de Fraude Signalering Voorziening van de Belastingdienst;
        - *verzamelinkomen:* het verzamelinkomen, bedoeld in [artikel 2.18 van de Wet inkomstenbelasting 2001][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0002320#Artikel5a
      [ref4]: https://wetten.overheid.nl/BWBR0002320#Artikel16
      [ref5]: https://wetten.overheid.nl/BWBR0011353#Artikel2.18
