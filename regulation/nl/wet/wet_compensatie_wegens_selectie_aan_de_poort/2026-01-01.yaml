  - number: '5'
    text: |-
      1 De inspecteur kent op verzoek een aanvullende compensatie toe aan de belanghebbende aan wie een compensatie
      als bedoeld in [artikel 2, eerste, tweede en derde lid][ref1], is toegekend en aannemelijk maakt dat die
      compensatie niet toereikend is om het directe nadeel te compenseren dat het gevolg is van de doorwerking van het
      door de inspecteur gecorrigeerde verzamelinkomen met betrekking tot de verschuldigde inkomstenbelasting en premie
      volksverzekeringen en de te ontvangen bedragen inzake inkomensafhankelijke regelingen.

      2 De aanvullende compensatie is gelijk aan het door de belanghebbende aannemelijk gemaakte bedrag van het directe
      nadeel voor zover dit bedrag het bedrag van de compensatie, bedoeld in [artikel 4, eerste en tweede lid][ref2], te
      boven gaat.

      3 Artikel 4, derde lid, is van overeenkomstige toepassing.

      4 Een verzoek voor een aanvullende compensatie wordt ingediend uiterlijk één jaar na de dagtekening van de
      beschikking tot toekenning van de compensatie, bedoeld in [artikel 2, eerste, tweede en derde lid][ref3]. Indien
      een verzoek na die termijn wordt ingediend zal de inspecteur het verzoek niet-ontvankelijk verklaren.

      5 De inspecteur beslist op het verzoek binnen een termijn van zes weken na ontvangst van het verzoek.
      [Artikel 3, eerste lid][ref4], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0049128#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0049128#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0049128#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0049128#Artikel3
