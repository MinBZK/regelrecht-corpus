  - number: '8'
    text: |-
      1 Indien noodzakelijk voor de vaststelling of aan [artikel 2, eerste lid][ref1], wordt voldaan, kan de inspecteur
      bijzondere categorieën van persoonsgegevens en gegevens van strafrechtelijke aard verwerken.

      2 Een verwerking van gegevens van strafrechtelijke aard als bedoeld in het eerste lid wordt voorzien van zodanige
      waarborgen dat de persoonlijke levenssfeer van de betrokkene niet onevenredig wordt geschaad.


      [ref1]: https://wetten.overheid.nl/BWBR0049128#Artikel2
