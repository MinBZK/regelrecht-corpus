  - number: '2'
    text: |-
      1 De inspecteur kent ambtshalve een compensatie toe aan een belanghebbende, indien hij vaststelt dat:

      a. een aangifte van de belanghebbende over de kalenderjaren 2012 tot en met 2019 na een
      geautomatiseerde zoekopdracht naar uitgaven voor specifieke zorgkosten als bedoeld in
      [artikel 6.17 van de Wet inkomstenbelasting 2001][ref1] of aftrekbare giften als bedoeld in
      [artikel 6.32 van die wet][ref2] is geselecteerd voor een handmatige beoordeling;

      b. de selectie, bedoeld in onderdeel a, heeft geleid tot intensief toezicht als gevolg van de selectienorm;

      c. de aanslag niet is vastgesteld overeenkomstig het verzamelinkomen dat volgt uit de aangifte en hierdoor sprake
      is van een hoger verzamelinkomen dan dat volgt uit de aangifte; en

      d. voor de selectie, bedoeld in onderdeel a, geldt dat niet aannemelijk is dat die heeft plaatsgevonden op grond
      van criteria die relevant, geschikt en objectief gerechtvaardigd zijn als het gaat om het heffen en invorderen
      van verschuldigde inkomstenbelasting en is gebleken dat de selectie voor de handmatige beoordeling niet ook zou
      hebben plaatsgevonden binnen de reguliere selectiemodule van de Belastingdienst op grond van een relevant risico
      op onjuistheden in de aangifte en hetgeen relevant, geschikt en objectief gerechtvaardigd is als het gaat om het
      heffen en invorderen van verschuldigde inkomstenbelasting.

      2 De inspecteur kent ambtshalve een compensatie toe aan een belanghebbende, indien als gevolg van de aanslag,
      bedoeld in het eerste lid, onderdeel c, een reeds opgelegde aanslag over een kalenderjaar na een handmatige
      beoordeling is gecorrigeerd door middel van een navorderingsaanslag waarbij het verzamelinkomen hoger is
      vastgesteld dan het verzamelinkomen dat volgt uit de reeds opgelegde aanslag en voor de handmatige beoordeling
      van de reeds opgelegde aanslag geen andere aanleiding is gebleken dan de eerdere selectie en correctie van het
      verzamelinkomen, bedoeld in het eerste lid.

      3 De inspecteur kent ambtshalve een compensatie toe aan een belanghebbende, indien als gevolg van de aanslag,
      bedoeld in het eerste lid, onderdeel c, bij een aanslag over een volgend belastingjaar na een handmatige
      beoordeling het verzamelinkomen hoger is vastgesteld dan het verzamelinkomen dat volgt uit de aangifte en voor de
      handmatige beoordeling van de aangifte geen andere aanleiding is gebleken dan de eerdere selectie en correctie van
      het verzamelinkomen, bedoeld in het eerste lid.

      4 De compensatie, bedoeld in het eerste, tweede en derde lid, wordt per beoordeelde aangifte onderscheidenlijk
      aanslag toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel6.17
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel6.32
