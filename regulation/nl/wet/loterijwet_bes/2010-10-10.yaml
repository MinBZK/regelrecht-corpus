  - number: '7'
    text: |-
      Overtreding van een der verbodsbepalingen van [artikel 2][ref1] of van [artikel 6][ref2] wordt gestraft met
      gevangenisstraf van ten hoogste zes maanden of een geldboete van de tweede categorie.

      Voorwerpen de veroordeelde toebehorende, welke door middel van het strafbaar feit zijn verkregen en aandelen in de
      loterij en andere voorwerpen, de veroordeelde toebehorende, waarmede het feit is gepleegd, kunnen worden verbeurd
      verklaard.

      De vernietiging van in beslag genomen aandelen in de loterij of van andere geschriften, waarmede het strafbaar feit
      is gepleegd, kan in het vonnis worden gelast.


      [ref1]: https://wetten.overheid.nl/BWBR0028260#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0028260#Artikel6
    url: https://wetten.overheid.nl/BWBR0028260/2010-10-10#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0028260
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0028260
        artikel: '6'
  - number: 7bis
    text: |-
      Indien een feit, bij deze wet strafbaar gesteld, wordt begaan door of vanwege een naamloze vennootschap, een
      coöperatieve of andere rechtspersoonlijkheid bezittende vereniging of een stichting, wordt de strafvervolging
      ingesteld en de straf uitgesproken tegen de leden van het bestuur of commissarissen.

      Geen straf wordt uitgesproken tegen de bestuurder of commissaris, van wien blijkt, dat het feit buiten zijn toedoen
      is begaan.
    url: https://wetten.overheid.nl/BWBR0028260/2010-10-10#Artikel7bis
  - number: '8'
    text: |-
      Hij die opzettelijk in strijd met de waarheid het vermoeden wekt, dat ingevolge de [artikelen 2 bis][ref1] en
      [3][ref2], toestemming tot het houden van een loterij is verleend, of dat aan de verleende toestemming geen
      voorwaarden of andere dan de gestelde of niet al de gestelde voorwaarden zijn verbonden, wordt gestraft met
      gevangenisstraf van ten hoogste een jaar of geldboete van de tweede categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0028260#Artikel2bis
      [ref2]: https://wetten.overheid.nl/BWBR0028260#Artikel3
    url: https://wetten.overheid.nl/BWBR0028260/2010-10-10#Artikel8
    references:
