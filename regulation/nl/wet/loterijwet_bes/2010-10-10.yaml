        artikel: 2bis
      - id: ref2
        bwb_id: BWBR0028260
        artikel: '3'
  - number: 8bis
    text: De in deze wet bedoelde strafbare feiten worden beschouwd als misdrijven.
    url: https://wetten.overheid.nl/BWBR0028260/2010-10-10#Artikel8bis
  - number: '9'
    text: |-
      De ambtenaren belast met het opsporen van de feiten bij deze wet strafbaar gesteld zijn te allen tijde bevoegd
      in beslag te nemen en ter inbeslagneming de uitlevering te vorderen van al hetgeen kan dienen tot bewijs, van
      al hetgeen redelijkerwijs vermoed kan worden bestemd te zijn geweest of gediend te hebben tot het plegen van een
      overtreding dezer wet zijn verkregen.

      Zij hebben te allen tijde vrije toegang tot alle plaatsen, waar redelijkerwijze vermoed kan worden, dat een
      overtreding dezer wet wordt gepleegd.

      Wordt hun de toegang geweigerd, dan verschaffen zij zich die desnoods met inroeping van de sterke arm.

      Is de plaats tevens een woning of alleen door een woning toegankelijk, dan
      treden zij deze tegen de wil der bewoners niet binnen dan met inachtneming van de
      [artikelen 155 tot en met 163 van het Wetboek van Strafvordering BES][ref1].

      Van dit binnentreden wordt door hen proces-verbaal opgemaakt, dat binnen tweemaal vierentwintig uren aan de
      ingezetene, wiens woning is binnengetreden, in afschrift wordt medegedeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel155
    url: https://wetten.overheid.nl/BWBR0028260/2010-10-10#Artikel9
    references:
