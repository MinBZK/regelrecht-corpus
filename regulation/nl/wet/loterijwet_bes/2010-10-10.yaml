  - number: '6'
    text: |-
      Het is verboden:

      1°. een loterij, tot het houden en aanleggen waarvan de bij deze wet vereiste toestemming is verleend zonder
      inachtneming van de voorschriften van een krachtens deze wet uitgevaardigd besluit of van enige ingevolge deze wet
      aan die toestemming verbonden voorwaarde aan te leggen of te houden;

      2°. aandelen in zodanige loterij te verkopen, te koop aan te bieden, af te leveren, uit te delen of ten verkoop
      of ter uitdeling in voorraad te hebben, of door middel of met behulp van aandelen of aankondigingen en andere voor
      openbaarmaking en verspreiding bestemde stukken, op enige andere wijze de deelneming in zodanige loterij open te
      stellen of openlijk te bevorderen, zonder dat de bepaling van het [tweede lid van artikel 5][ref1] ten opzichte
      van die aandelen, die aankondigingen en die voor openbaarmaking en verspreiding bestemde stukken, is of wordt
      nagekomen;

      3°. aandelen in zodanige loterij te verkopen, te koop aan te bieden, af te leveren, uit te delen of ten verkoop of
      ter uitdeling in voorraad te hebben of op enige andere wijze de deelneming in zodanige loterij open te stellen of
      openlijk te bevorderen, zonder dat door hem, die een der genoemde handelingen pleegt, alle voorwaarden, waaronder
      de toestemming tot het houden der loterij is verleend, zijn of worden nagekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0028260#Artikel5
    url: https://wetten.overheid.nl/BWBR0028260/2010-10-10#Artikel6
