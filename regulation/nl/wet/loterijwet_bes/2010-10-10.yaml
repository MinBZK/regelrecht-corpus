articles:
  - number: '1'
    text: |-
      Deze wet verstaat onder loterij, elke gelegenheid, door iemand opengesteld om, tegen voldoening aan zekere
      voorwaarde, mede te dingen naar prijzen of premiën in geld of goed, uitgeloofd ten behoeve van de deelnemers, die
      als winners worden aangewezen door het lot of enige andere kansbepaling, waarop zij geen overwegende invloed kunnen
      oefenen.

      Onder loterij in de zin dezer wet worden niet verstaan:

      1°. de kansovereenkomst van levensverzekering, mits zij is aangegaan met inachtneming van de wettelijke bepalingen,
      op het ogenblik van het sluiten der overeenkomst op het stuk van levensverzekering bestaande;

      2°. de tegen een niet hogere dan de parikoers door een publiekrechtelijk lichaam voor het publiek opengestelde
      werkelijke geldlening, die een jaarlijkse en jaarlijks ter beschikking te stellen rente geeft van ten minste
      drie ten honderd, terwijl aan de schuldbewijzen van die lening bijkomstig een kans op het winnen van premiën is
      verbonden.
    url: https://wetten.overheid.nl/BWBR0028260/2010-10-10#Artikel1
  - number: 1a
    text: |-
      Deze wet is niet van toepassing op loterijen welke door en ten behoeve van handelszaken of bedrijven ter
      stimulering van de verkoop of verhoging van de omzet worden aangelegd of gehouden, mits als voorwaarde tot
      deelneming niet gevraagd wordt voldoening van een geldsbedrag en mits daarbij de bij eilandsverordening te stellen
      voorwaarden en regelen in acht worden genomen.
    url: https://wetten.overheid.nl/BWBR0028260/2010-10-10#Artikel1a
  - number: '2'
    text: |-
      Het is verboden:

      1°. een andere loterij aan te leggen of te houden dan de zodanige tot het aanleggen en houden waarvan de bij deze
      wet vereiste toestemming is verleend;

      2°. aandelen in een andere loterij dan de zodanige tot het aanleggen en houden waarvan de bij deze wet vereiste
      toestemming is verleend, en aandelen in een loterij, die buiten het eilandgebied is aangelegd of wordt gehouden, te
      verkopen, te koop aan te bieden, af te leveren, uit de delen of ten verkoop of ter uitdeling in voorraad te hebben
      of op enige andere wijze de deelneming in zodanige loterij open te stellen of openlijk te bevorderen;

      3°. certificaten rechtgevende op de gedeeltelijke eigendom van een oorspronkelijk aandeel in een loterij of een
      premielening of op de aan zodanig aandeel verbonden winkans bij trekkingen, onder welke benaming ook, te verkopen,
      te koop aan te bieden, af te leveren, uit te delen of ten verkoop of ter uitdeling in voorraad te hebben of op
      enige andere wijze de deelneming door middel van zodanige certificaten in loterijen en premieleningen open te
      stellen of openlijk te bevorderen.
    url: https://wetten.overheid.nl/BWBR0028260/2010-10-10#Artikel2
  - number: 2bis
    text: |-
      Het bestuurscollege kan aan een naamloze vennootschap, een coöperatieve of andere, rechtspersoonlijkheid bezittende
      vereniging of een stichting toestemming verlenen tot het openstellen van een tegen een niet hogere dan de parikoers
      uit te geven werkelijke geldlening, welke een jaarlijkse en jaarlijks ter beschikking te stellen rente heeft van
      ten minste drie ten honderd, terwijl aan de schuldbewijzen van die lening bijkomstig een kans op het winnen van
      premiën is verbonden.
    url: https://wetten.overheid.nl/BWBR0028260/2010-10-10#Artikel2bis
  - number: '3'
    text: |-
      1 Tot het aanleggen en houden van een loterij, uitsluitend strekkende tot een liefdadig doel of ter bevordering van
      wetenschap, kunst of een ander algemeen belang, en waarin de prijzen of premiën niet in geld of geldswaardig papier
      bestaan, kan toestemming worden verleend door het bestuurscollege.

      2 Tot het aanleggen en houden van loterijen, waarin de prijzen op premiën in geld of geldswaardig papier bestaan,
      kan toestemming worden verleend uitsluitend aan rechtspersoonlijkheid bezittende op Bonaire, Sint Eustatius of
      Saba gevestigde instellingen, die ten doel hebben de bevordering van de sport op Bonaire, Sint Eustatius of Saba,
      voor zover deze loterijen uit sportprijsvragen bestaan. Onder sportprijsvragen worden verstaan prijsvragen, waarbij
      deelnemers de uitslagen van de tevoren aangekondigde sportwedstrijden moeten raden of voorspellen.

      De toestemming kan door het bestuurscollege worden verleend voor een door hem te bepalen tijd aan één
      rechtspersoonlijkheid bezittende instelling

      3 Bij eilandsverordening worden de voorwaarden geregeld, welke zullen worden verbonden aan de in het vorige lid
      bedoelde toestemming.

      Deze voorwaarden hebben onder meer betrekking op:

      a. het aantal te houden prijsvragen, met dien verstande, dat het aantal als regel ten hoogste één per week zal
      bedragen;

      b. de bestemming van de opbrengst van elke gehouden prijsvraag;

      c. de administratie en dekking van de daaraan verbonden kosten;

      d. de statuten en de reglementen van de instelling;

      e. de controle van overheidswege;

      f. de maximum inleggelden.

      Als voorwaarde dient in ieder geval te worden opgenomen de bestemming van de opbrengst van elke gehouden loterij
      met dien verstande, dat de netto opbrengsten uitsluiten ten goede mogen komen aan sportorganisaties op Bonaire,
      Sint Eustatius en Saba.
    url: https://wetten.overheid.nl/BWBR0028260/2010-10-10#Artikel3
  - number: '4'
    text: |-
      Op loterijen, tot het aanleggen en houden waarvan de toestemming van het bestuurscollege wordt vereist, wordt een
      vergunningsrecht geheven van tien ten honderd van het gezamenlijk bedrag der loten.
    url: https://wetten.overheid.nl/BWBR0028260/2010-10-10#Artikel4
  - number: '5'
    text: |-
      Bij eilandsverordening kunnen voorschriften worden gegeven met betrekking tot de wijze waarop en de middelen
      waarmede prijs- en premietrekkingen van loterijen en premieleningen moeten plaats hebben, alsook ten aanzien van de
      hoegrootheid van de waarde der gezamenlijk uit te geven aandelen in die loterijen en premieleningen.

      Aan elke toestemming, als in de [art. 2bis][ref1] en [3][ref2] bedoeld, is stilzwijgend de voorwaarde verbonden,
      dat op alle aandelen in de daarbij toegestane loterij en in alle andere aankondigingen en in andere voor
      openbaarmaking of verspreiding bestemde stukken, die loterij betreffende, wordt vermeld, dat het bestuurscollege
      toestemming heeft verleend, onder aanhaling van de dagtekening van de betrekkelijke beschikking.

      Bij verlening van een toestemming, als in [artikel 2 bis][ref3] bedoeld, kan het bestuurscollege waarborgen van de
      aanleggers van zulk een loterij verlangen, welke eventueel worden gesteld en verbeurd op een wijze en om redenen
      bij eilandsverordening te bepalen.


      [ref1]: https://wetten.overheid.nl/BWBR0028260#Artikel2bis
      [ref2]: https://wetten.overheid.nl/BWBR0028260#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0028260#Artikel2bis
    url: https://wetten.overheid.nl/BWBR0028260/2010-10-10#Artikel5
    references:
