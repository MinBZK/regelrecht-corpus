articles:
  - number: '1'
    text: |-
      De uit een oogpunt van volksgezondheid en goed landbouwkundig gebruik toelaatbare hoeveelheid van
      bestrijdingsmiddelen, bestanddelen daarvan of omzettingsproducten, aanwezig op of in:

      a. onbewerkte of bewerkte eet- of drinkwaren, met uitzondering van:

      1. specerijen, bedoeld in het [Warenwetbesluit Specerijen en kruiden][ref1];

      2. de waren, bedoeld in het [Warenwetbesluit Visserijproducten, slakken en kikkerbillen][ref2];

      3. de waren, bedoeld in de [Warenwetregeling Zuigelingenvoeding][ref3];

      4. de waren, bedoeld in de [Warenwetregeling Babyvoeding][ref4];

      voor zover de producten uit de genoemde productgroepen onder 1 en 2 niet met name in [Bijlage II][ref5] zijn
      genoemd, in welk geval het residugehalte niet hoger mag zijn dan in de desbetreffende bijlage met inachtneming van
      de daarbij gestelde aanwijzingen is aangegeven;

      b. bewerkte eet- of drinkwaren, waarvoor in [Bijlage II][ref6] geen afzonderlijk toegelaten gehalte is aangegeven,
      mag niet hoger zijn dan het in de voor onbewerkte eet- of drinkwaren vastgestelde gehalte, waarbij rekening
      gehouden wordt met de concentratie- of verdunningsfactor;

      c. samengestelde eet- of drinkwaren mag niet hoger zijn dan het volgens [Bijlage II][ref7], toegelaten gehalte van
      de afzonderlijke onbewerkte eet- of drinkwaren in het mengsel, waarbij rekening gehouden wordt met de relatieve
      concentraties van deze eet- of drinkwaren in het mengsel en met het gestelde onder b.


