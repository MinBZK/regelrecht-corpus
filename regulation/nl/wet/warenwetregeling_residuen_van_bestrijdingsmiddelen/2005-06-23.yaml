  - number: 1a
    text: |-
      In afwijking van [artikel 1][ref1] is een hoeveelheid van bestrijdingsmiddelen, bestanddelen daarvan of
      omzettingsproducten, aanwezig op of in een eetwaar op basis van een landbouwproduct, eveneens aanvaardbaar uit
      oogpunt van volksgezondheid en goed landbouwkundig gebruik, voor zover:

      a. het desbetreffende landbouwproduct in de handel is gebracht in een lidstaat van de Europese Unie die voor dat
      landbouwproduct een voorlopig maximum residugehalte heeft vastgesteld en die lidstaat dat voorlopig maximum heeft
      medegedeeld aan de Commissie van de Europese Unie overeenkomstig artikel 4, eerste lid, onder f, van richtlijn
      nr. 91/414/EEG van de Raad van de Europese Gemeenschappen van 15 juli 1991 betreffende het op de markt brengen van
      gewasbeschermingsmiddelen (PbEG L 414); en

      b. die hoeveelheid niet groter is dan het onder a bedoelde voorlopige maximum residugehalte.


      [ref1]: https://wetten.overheid.nl/BWBR0003658#Artikel1
