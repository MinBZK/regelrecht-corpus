preamble:
  text: |-
    Gelet op artikel 1 van het Residubesluit (Stb. 1964, 319)1Laatstelijk gewijzigd bij besluit van 23 april 1975
    (Stcrt. 250).,

    Gehoord de Bestrijdingsmiddelencommissie;

    Besluiten:
  url: https://wetten.overheid.nl/BWBR0003658/2016-07-20#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 De uit een oogpunt van volksgezondheid en goed landbouwkundig gebruik toelaatbare hoeveelheid van
      bestrijdingsmiddelen, bestanddelen daarvan of omzettingsproducten, aanwezig op of in:

      a. onbewerkte of bewerkte eet- of drinkwaren, met uitzondering van:

      1. specerijen, bedoeld in het [Warenwetbesluit Specerijen en kruiden][ref1];

      2. de waren, bedoeld in het [Warenwetbesluit Visserijproducten, slakken en kikkerbillen][ref2];

      3. volledige zuigelingenvoeding, opvolgzuigelingenvoeding, bewerkte levensmiddelen op basis van granen en
      babyvoeding, bedoeld in Verordening (EU) nr. 609/2013 van het Europees Parlement en de Raad van 12 juni 2013 inzake
      voor zuigelingen en peuters bedoelde levensmiddelen, voeding voor medisch gebruik en de dagelijkse voeding volledig
      vervangende producten voor gewichtsbeheersing, en tot intrekking van Richtlijn 92/52/EEG van de Raad, Richtlijnen
      96/8/EG, 1999/21/EG, 2006/125/EG en 2006/141/EG van de Commissie, Richtlijn 2009/39/EG van het Europees Parlement
      en de Raad en de Verordeningen (EG) nr. 41/2009 en (EG) nr. 953/2009 van de Commissie (PbEU 2013, L 181);

      voor zover de producten uit de genoemde productgroepen onder 1 en 2 niet met name in [Bijlage II][ref3] zijn
      genoemd, mag niet hoger zijn dan in de desbetreffende bijlage met inachtneming van de daarbij gestelde aanwijzingen
      is aangegeven;

      b. bewerkte eet- of drinkwaren, waarvoor in [Bijlage II][ref4] geen afzonderlijk toegelaten gehalte is aangegeven,
      mag niet hoger zijn dan het in de voor onbewerkte eet- of drinkwaren vastgestelde gehalte, waarbij rekening
      gehouden wordt met de concentratie- of verdunningsfactor;

      c. samengestelde eet- of drinkwaren mag niet hoger zijn dan het volgens [Bijlage II][ref5], toegelaten gehalte van
      de afzonderlijke onbewerkte eet- of drinkwaren in het mengsel, waarbij rekening gehouden wordt met de relatieve
      concentraties van deze eet- of drinkwaren in het mengsel en met het gestelde onder b.

      2 Deze regeling berust op
      [artikel 13a, derde lid, onder a, van het Warenwetbesluit Bereiding en behandeling van levensmiddelen][ref6].

      3 Deze regeling is niet van toepassing op bestrijdingsmiddelenresiduen die vallen onder de werkingssfeer van
      verordening (EG) 396/2005.


