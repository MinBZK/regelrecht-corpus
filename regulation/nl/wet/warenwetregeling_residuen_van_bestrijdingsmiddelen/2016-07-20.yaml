$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: warenwetregeling_residuen_van_bestrijdingsmiddelen
regulatory_layer: WET
publication_date: '2015-12-10'
valid_from: '2016-07-20'
bwb_id: BWBR0003658
url: https://wetten.overheid.nl/BWBR0003658/2016-07-20
preamble:
  text: |-
    Gelet op artikel 1 van het Residubesluit (Stb. 1964, 319)1Laatstelijk gewijzigd bij besluit van 23 april 1975
    (Stcrt. 250).,

    Gehoord de Bestrijdingsmiddelencommissie;

    Besluiten:
  url: https://wetten.overheid.nl/BWBR0003658/2016-07-20#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      De uit een oogpunt van volksgezondheid en goed landbouwkundig gebruik toelaatbare hoeveelheid van
      bestrijdingsmiddelen, bestanddelen daarvan of omzettingsproducten, aanwezig op of in:
    url: https://wetten.overheid.nl/BWBR0003658/2016-07-20#Artikel1
  - number: 1.1.a
    text: 'onbewerkte of bewerkte eet- of drinkwaren, met uitzondering van:'
    url: https://wetten.overheid.nl/BWBR0003658/2016-07-20#Artikel1
  - number: 1.1.a.1
    text: |-
      specerijen, bedoeld in het [Warenwetbesluit Specerijen en kruiden][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009540
    url: https://wetten.overheid.nl/BWBR0003658/2016-07-20#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009540
  - number: 1.1.a.2
    text: |-
      de waren, bedoeld in het [Warenwetbesluit Visserijproducten, slakken en kikkerbillen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007216
    url: https://wetten.overheid.nl/BWBR0003658/2016-07-20#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007216
  - number: 1.1.a.3
    text: |-
      volledige zuigelingenvoeding, opvolgzuigelingenvoeding, bewerkte levensmiddelen op basis van granen en babyvoeding,
      bedoeld in Verordening (EU) nr. 609/2013 van het Europees Parlement en de Raad van 12 juni 2013 inzake voor
      zuigelingen en peuters bedoelde levensmiddelen, voeding voor medisch gebruik en de dagelijkse voeding volledig
      vervangende producten voor gewichtsbeheersing, en tot intrekking van Richtlijn 92/52/EEG van de Raad, Richtlijnen
      96/8/EG, 1999/21/EG, 2006/125/EG en 2006/141/EG van de Commissie, Richtlijn 2009/39/EG van het Europees Parlement
      en de Raad en de Verordeningen (EG) nr. 41/2009 en (EG) nr. 953/2009 van de Commissie (PbEU 2013, L 181);
    url: https://wetten.overheid.nl/BWBR0003658/2016-07-20#Artikel1
  - number: 1.1.b
    text: |-
      bewerkte eet- of drinkwaren, waarvoor in [Bijlage II][ref1] geen afzonderlijk toegelaten gehalte is aangegeven, mag
      niet hoger zijn dan het in de voor onbewerkte eet- of drinkwaren vastgestelde gehalte, waarbij rekening gehouden
      wordt met de concentratie- of verdunningsfactor;


      [ref1]: https://wetten.overheid.nl/BWBR0003658
    url: https://wetten.overheid.nl/BWBR0003658/2016-07-20#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003658
  - number: 1.1.c
    text: |-
      samengestelde eet- of drinkwaren mag niet hoger zijn dan het volgens [Bijlage II][ref1], toegelaten gehalte van
      de afzonderlijke onbewerkte eet- of drinkwaren in het mengsel, waarbij rekening gehouden wordt met de relatieve
      concentraties van deze eet- of drinkwaren in het mengsel en met het gestelde onder b.


      [ref1]: https://wetten.overheid.nl/BWBR0003658
    url: https://wetten.overheid.nl/BWBR0003658/2016-07-20#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003658
  - number: '1.2'
    text: |-
      Deze regeling berust op
      [artikel 13a, derde lid, onder a, van het Warenwetbesluit Bereiding en behandeling van levensmiddelen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005758#Artikel13a
    url: https://wetten.overheid.nl/BWBR0003658/2016-07-20#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005758
        artikel: 13a
  - number: '1.3'
    text: |-
      Deze regeling is niet van toepassing op bestrijdingsmiddelenresiduen die vallen onder de werkingssfeer van
      verordening (EG) 396/2005.
    url: https://wetten.overheid.nl/BWBR0003658/2016-07-20#Artikel1
  - number: '2'
    text: |-
      Bij de vaststelling van het ingevolge [Bijlage II][ref1] toegelaten maximumgehalte dienen de bepalingen in
      [Bijlage I][ref2] in acht te worden genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0003658
      [ref2]: https://wetten.overheid.nl/BWBR0003658
    url: https://wetten.overheid.nl/BWBR0003658/2016-07-20#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003658
      - id: ref2
        bwb_id: BWBR0003658
  - number: '3'
    text: |-
      Producten, bedoeld in artikel 49, eerste lid, van verordening (EG) 396/2005, voldoen aan de Warenwetregeling
      residuen van bestrijdingsmiddelen zoals die onmiddellijk voor 1 september 2008 luidde.
    url: https://wetten.overheid.nl/BWBR0003658/2016-07-20#Artikel3
  - number: '4'
    text: 'Deze regeling wordt aangehaald als: Warenwetregeling residuen van bestrijdingsmiddelen.'
    url: https://wetten.overheid.nl/BWBR0003658/2016-07-20#Artikel4
