  - number: '13.0'
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties zendt binnen vijf jaar na de inwerkingtreding van deze
      wet aan de Staten-Generaal een verslag over de doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0043961/2024-01-01#Artikel13.0
  - number: 13.1a
    text: |-
      1 Voor in het Besluit elektronische publicaties opgenomen wijzigingen van bepalingen in andere besluiten geldt niet
      enig wettelijk voorschrift op grond waarvan:

      a. over het ontwerp van een regeling of het voornemen tot het treffen van een regeling advies moet worden gevraagd
      of extern overleg moet worden gevoerd,

      b. van het ontwerp van een regeling kennis moet worden gegeven,

      c. een regeling niet eerder in werking kan treden dan nadat sedert haar vaststelling of bekendmaking een bepaalde
      termijn is verstreken,

      d. een regeling bij de wet moet worden goedgekeurd,

      e. door of namens een van de Kamers van de Staten-Generaal of een aantal leden daarvan kan worden verlangd dat het
      onderwerp of de inwerkingtreding van de regeling bij de wet wordt geregeld, of

      f. de voordracht voor een algemene maatregel van bestuur moet worden gedaan door een andere Minister dan Onze
      Minister van Binnenlandse Zaken en Koninkrijksrelaties.

      2 Het eerste lid, aanhef en onderdeel a, is niet van toepassing op het horen als bedoeld in
      [artikel 17, eerste lid, aanhef en onderdeel b, van de Wet op de Raad van State][ref1], van de Afdeling advisering
      van de Raad van State.


      [ref1]: https://wetten.overheid.nl/BWBR0002367#Artikel17
