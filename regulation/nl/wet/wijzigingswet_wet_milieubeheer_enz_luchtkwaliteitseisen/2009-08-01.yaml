preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het noodzakelijk is bij wet regels te stellen ten aanzien van de
    luchtkwaliteit ter uitvoering van richtlijn nr. 96/62/EG van de Raad van de Europese Unie van 27 september 1996
    inzake de beoordeling en het beheer van de luchtkwaliteit (PbEG L 296), richtlijn nr. 1999/30/EG van de Raad van
    de Europese Unie van 22 april 1999, betreffende grenswaarden voor zwaveldioxide, stikstofdioxide en stikstofoxiden,
    zwevende deeltjes en lood in de lucht (PbEG L 163), richtlijn nr. 2000/69/EG van het Europees Parlement en de Raad
    van de Europese Unie van 16 november 2000 betreffende grenswaarden voor benzeen en koolmonoxide in de lucht (PbEG
    L 313), richtlijn nr. 2002/3/EG van het Europees Parlement en de Raad van de Europese Unie van 12 februari 2002
    betreffende ozon in de lucht (PbEG L 67), richtlijn nr. 2004/107/EG van het Europees Parlement en de Raad van 15
    december 2004 betreffende arseen, cadmium, kwik, nikkel en polycyclische aromatische koolwaterstoffen in de lucht
    (PbEG L 23) en richtlijn nr. 2003/35/EG van het Europees Parlement en de Raad van 26 mei 2003 tot voorziening
    in inspraak van het publiek in de opstelling van bepaalde plannen en programma’s betreffende het milieu en, met
    betrekking tot inspraak van het publiek en toegang tot de rechter, tot wijziging van de richtlijnen 85/337/EEG en
    96/61/EG van de Raad (PbEU L 156);

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0022750/2009-08-01#ArtikelAanhef
articles:
  - number: III
    text: |-
      1 Een plan, vastgesteld op grond van [artikel 9 van het Besluit luchtkwaliteit 2005][ref1], geldt
      met ingang van het tijdstip van inwerkingtreding van deze wet als een plan, vastgesteld op grond van
      [artikel 5.9 van de Wet milieubeheer][ref2].

      2 Een termijn als bedoeld in
      [artikel 9, vijfde lid, respectievelijk zesde lid, van het Besluit luchtkwaliteit 2005][ref3]
      geldt met ingang van het tijdstip van inwerkingtreding van deze wet als een termijn als bedoeld in
      [artikel 5.9, vierde lid, respectievelijk vijfde lid, van de Wet milieubeheer][ref4].


