  - number: V
    text: |-
      [Titel 5.2 van de Wet milieubeheer][ref1], [bijlage 2 van die wet][ref2] en de op [titel 5.2][ref3] berustende
      bepalingen zijn niet van toepassing op een vóór het tijdstip van inwerkingtreding van deze wet met toepassing van
      [artikel 7 van het Besluit luchtkwaliteit 2005][ref4] vastgesteld besluit of ontwerpbesluit, noch op ter uitvoering
      daarvan strekkende besluiten, overige rechtshandelingen en feitelijke handelingen. In een rechterlijke procedure
      ten aanzien van een besluit of een ter uitvoering daarvan strekkend besluit, overige rechtshandeling of feitelijke
      handeling als bedoeld in de eerste volzin kunnen uitsluitend gevolgen voor de luchtkwaliteit worden aangevoerd
      voor zover deze redelijkerwijs niet in een eerdere rechterlijke procedure aan de orde zijn of hadden kunnen worden
      gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003245
      [ref2]: https://wetten.overheid.nl/BWBR0003245
      [ref3]: https://wetten.overheid.nl/BWBR0003245
      [ref4]: https://wetten.overheid.nl/BWBR0018458#Artikel7
