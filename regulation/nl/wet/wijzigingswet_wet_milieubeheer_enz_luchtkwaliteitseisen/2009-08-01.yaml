  - number: VI
    text: |-
      Het [Besluit luchtkwaliteit 2005][ref1] wordt ingetrokken met ingang van het tijdstip van inwerkingtreding van
      deze wet, met dien verstande dat de artikelen van dat besluit, zoals dat luidde onmiddellijk voorafgaand aan dat
      tijdstip, van toepassing blijven op een vóór dat tijdstip met toepassing van [artikel 7 van dat besluit][ref2]
      vastgesteld besluit of ontwerpbesluit.


      [ref1]: https://wetten.overheid.nl/BWBR0018458
      [ref2]: https://wetten.overheid.nl/BWBR0018458#Artikel7
