  - number: VIII
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen, de onderdelen daarvan of de daarin opgenomen bepalingen verschillend kan worden
      vastgesteld.
