    text: |-
      1 Aan de verplichting, bedoeld in [artikel 5.12, eerste lid, van de Wet milieubeheer][ref1], wordt voor de
      eerste maal gevolg gegeven binnen ten hoogste 13 weken na het tijdstip waarop deze wet in werking treedt, tenzij
      bijzondere omstandigheden zich daartegen verzetten.

      2 Aan de verplichting, bedoeld in [artikel 5.14 van de Wet milieubeheer][ref2], wordt voor de eerste maal gevolg
      gegeven in het tweede kalenderjaar na het tijdstip waarop deze wet in werking treedt.


