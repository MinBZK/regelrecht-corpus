---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_gelijke_behandeling_van_mannen_en_vrouwen
regulatory_layer: WET
publication_date: '2023-06-30'
valid_from: '2026-01-01'
bwb_id: BWBR0003299
url: https://wetten.overheid.nl/BWBR0003299/2026-01-01
preamble:
  text: |-
    Wij Juliana, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het noodzakelijk is de Nederlandse wetgeving aan te passen met het oog
    op de richtlijn van de Raad van de Europese Gemeenschappen van 9 februari 1976 inzake de gelijke behandeling van
    mannen en vrouwen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0003299/2026-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In deze wet wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0003299/2026-01-01#Artikel1
  - number: 1.1.a
    text: 'onderscheid: direct en indirect onderscheid, alsmede de opdracht daartoe;'
    url: https://wetten.overheid.nl/BWBR0003299/2026-01-01#Artikel1
  - number: 1.1.b
    text: |-
      direct onderscheid: indien een persoon op grond van geslacht op een andere wijze wordt behandeld dan een ander in
      een vergelijkbare situatie wordt, is of zou worden behandeld;
    url: https://wetten.overheid.nl/BWBR0003299/2026-01-01#Artikel1
  - number: 1.1.c
    text: |-
      indirect onderscheid: indien een ogenschijnlijk neutrale bepaling, maatstaf of handelwijze personen van een bepaald
      geslacht in vergelijking met andere personen bijzonder treft.
    url: https://wetten.overheid.nl/BWBR0003299/2026-01-01#Artikel1
  - number: '1.2'
    text: Onder direct onderscheid wordt mede verstaan onderscheid op grond van zwangerschap, bevalling en moederschap.
    url: https://wetten.overheid.nl/BWBR0003299/2026-01-01#Artikel1
  - number: 1a.1
    text: |-
      Het in deze wet neergelegde verbod van direct onderscheid houdt mede in een verbod op intimidatie en een verbod op
      seksuele intimidatie.
    url: https://wetten.overheid.nl/BWBR0003299/2026-01-01#Artikel1a
  - number: 1a.2
    text: |-
      Onder intimidatie als bedoeld in het eerste lid wordt verstaan: gedrag dat met het geslacht van een persoon verband
      houdt en dat tot doel of gevolg heeft dat de waardigheid van de persoon wordt aangetast en dat een bedreigende,
      vijandige, beledigende, vernederende of kwetsende omgeving wordt gecreëerd.
    url: https://wetten.overheid.nl/BWBR0003299/2026-01-01#Artikel1a
  - number: 1a.3
    text: |-
      Onder seksuele intimidatie als bedoeld in het eerste lid wordt verstaan: enige vorm van verbaal, non-verbaal of
      fysiek gedrag met een seksuele connotatie dat als doel of gevolg heeft dat de waardigheid van de persoon wordt
      aangetast, in het bijzonder wanneer een bedreigende, vijandige, beledigende, vernederende of kwetsende situatie
      wordt gecreëerd.
    url: https://wetten.overheid.nl/BWBR0003299/2026-01-01#Artikel1a
  - number: 1a.4
    text: |-
      Het feit dat een persoon het in het tweede en derde lid bedoelde gedrag afwijst of lijdzaam ondergaat, mag niet ten
      grondslag liggen aan een beslissing die die persoon treft.
    url: https://wetten.overheid.nl/BWBR0003299/2026-01-01#Artikel1a
  - number: 1a.5
    text: |-
      De [artikelen 3, tweede lid][ref1], [4, tweede lid][ref2], en [5, eerste en tweede lid][ref3], zijn niet van
      toepassing op het verbod van intimidatie en seksuele intimidatie, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0003299#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003299#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0003299#Artikel5
    url: https://wetten.overheid.nl/BWBR0003299/2026-01-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0003299
        artikel: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0003299
        artikel: '4'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0003299
        artikel: '5'
        paragraaf: '1'
  - number: 1b.1
    text: |-
      In de openbare dienst mag het bevoegd gezag geen onderscheid maken bij de aanstelling tot ambtenaar
      of indienstneming op arbeidsovereenkomst naar burgerlijk recht, in de arbeidsvoorwaarden, bij de
      arbeidsomstandigheden, bij het verstrekken van onderricht, bij de bevordering en bij de beëindiging van het
      dienstverband.
    url: https://wetten.overheid.nl/BWBR0003299/2026-01-01#Artikel1b
  - number: 1b.2
    text: |-
      Tot de openbare dienst, bedoeld in het eerste lid, worden gerekend alle instellingen, diensten en bedrijven door de
      staat en de openbare lichamen beheerd. Waar in deze wet wordt gesproken over openbare dienst worden tevens openbare
      lichamen als bedoeld in [artikel 132a van de Grondwet][ref1] begrepen.


      [ref1]: https://wetten.overheid.nl/BWBR0001840#Artikel132a
    url: https://wetten.overheid.nl/BWBR0003299/2026-01-01#Artikel1b
    references:
      - id: ref1
        bwb_id: BWBR0001840
        artikel: 132a
  - number: 1b.3
    text: |-
      Van het in het eerste lid bepaalde mag worden afgeweken in de gevallen waarin het de bescherming van de vrouw
      betreft, met name in verband met zwangerschap en moederschap.
    url: https://wetten.overheid.nl/BWBR0003299/2026-01-01#Artikel1b
  - number: 1b.4
    text: |-
      Het bevoegd gezag mag het dienstverband van degene die krachtens aanstelling of arbeidsovereenkomst naar burgerlijk
      recht werkzaam is in de openbare dienst niet beëindigen of betrokkene niet anderszins benadelen wegens de
      omstandigheid dat deze in of buiten rechte een beroep heeft gedaan op het in het eerste lid bepaalde of terzake
      bijstand heeft verleend.
    url: https://wetten.overheid.nl/BWBR0003299/2026-01-01#Artikel1b
  - number: 1b.5
    text: |-
      In geval van een beëindiging van de arbeidsovereenkomst van degene die op arbeidsovereenkomst
      naar burgerlijk recht werkzaam is in openbare dienst door het bevoegd gezag in
      strijd met deze wet, is [artikel 681 van Boek 7 van het Burgerlijk Wetboek][ref1] of
      [artikel 1615s van Boek 7a van het Burgerlijk Wetboek BES][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel681
      [ref2]: https://wetten.overheid.nl/BWBR0028752#Artikel1615s
    url: https://wetten.overheid.nl/BWBR0003299/2026-01-01#Artikel1b
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '681'
      - id: ref2
        bwb_id: BWBR0028752
        artikel: 1615s
  - number: 1b.6
    text: Elk beding dat strijdig is met het in het eerste lid bepaalde is nietig.
    url: https://wetten.overheid.nl/BWBR0003299/2026-01-01#Artikel1b
  - number: 1c
    text: |-
      Ingeval een natuurlijke persoon, rechtspersoon of bevoegd gezag een ander onder zijn gezag arbeid laat
      verrichten, anders dan krachtens arbeidsovereenkomst naar burgerlijk recht of ambtelijke aanstelling, zijn de
      [artikelen 646][ref1] en [681 van Boek 7 van het Burgerlijk Wetboek][ref2] of de [artikelen 1614aa][ref3] en
      [1615s van Boek 7a van het Burgerlijk Wetboek BES][ref4] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel646
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel681
      [ref3]: https://wetten.overheid.nl/BWBR0028752#Artikel1614aa
      [ref4]: https://wetten.overheid.nl/BWBR0028752#Artikel1615s
    url: https://wetten.overheid.nl/BWBR0003299/2026-01-01#Artikel1c
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '646'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '681'
      - id: ref3
        bwb_id: BWBR0028752
        artikel: 1614aa
      - id: ref4
        bwb_id: BWBR0028752
        artikel: 1615s
  - number: '2.1'
    text: |-
      Het is niet toegelaten onderscheid te maken met betrekking tot de voorwaarden voor de toegang tot en de
      mogelijkheden tot uitoefening van en ontplooiing binnen het vrije beroep, alsmede wat betreft regelingen tussen
      beroepsgenoten inzake sociale zekerheid niet zijnde pensioenvoorzieningen als bedoeld in [artikel 12a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003299#Artikel12a
    url: https://wetten.overheid.nl/BWBR0003299/2026-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003299
        artikel: 12a
        paragraaf: '3'
  - number: '2.2'
    text: |-
      Indien een regeling als bedoeld in het eerste lid betrekking heeft op ziekte of arbeidsongeschiktheid mag daarin
      geen uitzondering worden gemaakt voor zwangerschap en bevalling, onverminderd de bevoegdheid bepalingen op te nemen
      ter voorkoming van misbruik en oneigenlijk gebruik.
    url: https://wetten.overheid.nl/BWBR0003299/2026-01-01#Artikel2
  - number: '2.3'
    text: |-
      Elke bepaling van een regeling als bedoeld in het eerste lid, die in strijd is met het in het eerste of tweede lid
      bepaalde is nietig.
    url: https://wetten.overheid.nl/BWBR0003299/2026-01-01#Artikel2
  - number: '3.1'
    text: |-
      Het is niet toegelaten onderscheid te maken bij de aanbieding van een betrekking, bij de behandeling bij de
      vervulling van een openstaande betrekking of bij arbeidsbemiddeling.
    url: https://wetten.overheid.nl/BWBR0003299/2026-01-01#Artikel3
  - number: '3.2'
    text: |-
      Van het in het eerste lid bepaalde mag worden afgeweken in die gevallen waarin ingevolge deze of enige andere
      wet bij het aanbieden van een betrekking onderscheid mag worden gemaakt en, voor zover het betreft een openlijke
      aanbieding van een betrekking, de grond voor dat onderscheid daarbij uitdrukkelijk wordt vermeld.
    url: https://wetten.overheid.nl/BWBR0003299/2026-01-01#Artikel3
  - number: '3.3'
    text: |-
      Het aanbieden van een betrekking, bedoeld in het eerste lid, geschiedt wat betreft tekst en vormgeving zodanig, dat
      duidelijk blijkt, dat zowel mannen als vrouwen in aanmerking komen.
    url: https://wetten.overheid.nl/BWBR0003299/2026-01-01#Artikel3
  - number: '3.4'
    text: |-
      Indien voor de aangeboden betrekking een functiebenaming wordt gebruikt, wordt of zowel de mannelijke als de
      vrouwelijke vorm gebruikt, of uitdrukkelijk vermeld, dat zowel vrouwen als mannen in aanmerking komen.
    url: https://wetten.overheid.nl/BWBR0003299/2026-01-01#Artikel3
  - number: '3.5'
    text: |-
      Wanneer iemand ter zake van een aanbieding in strijd met het in deze wet bepaalde uit onrechtmatige daad jegens een
      ander aansprakelijk is, kan de rechter hem op vordering van die ander ook veroordelen tot openbaarmaking van een
      rectificatie op een door de rechter aan te geven wijze.
    url: https://wetten.overheid.nl/BWBR0003299/2026-01-01#Artikel3
  - number: '4.1'
    text: |-
      De natuurlijke persoon of de rechtspersoon die een beroepsopleiding, voortgezette beroepsopleiding of cursus
      voor bijscholing of omscholing onder welke benaming dan ook in stand houdt, dan wel de natuurlijke persoon of
      rechtspersoon die een examen verband houdend met de hiervoor bedoelde opleidingen of cursussen afneemt, mag bij de
      toelating tot en de behandeling binnen de opleiding, dan wel bij het afnemen van het examen, geen onderscheid maken
      noch ten aanzien van de criteria noch ten aanzien van de niveaus.
    url: https://wetten.overheid.nl/BWBR0003299/2026-01-01#Artikel4
  - number: '4.2'
    text: |-
      Van het in het eerste lid van dit artikel bepaalde mag, behoudens voor wat betreft het afnemen van het examen en
      mits voor leerlingen van beide geslachten gelijkwaardige voorzieningen aanwezig zijn, worden afgeweken indien de
      eigen aard van een instelling voor bijzonder onderwijs zich tegen het in dat lid bepaalde verzet.
    url: https://wetten.overheid.nl/BWBR0003299/2026-01-01#Artikel4
  - number: '4.3'
    text: Iedere bepaling die strijdig is met het in het eerste lid bepaalde, is nietig.
    url: https://wetten.overheid.nl/BWBR0003299/2026-01-01#Artikel4
  - number: 4a.1
    text: |-
      Het is niet toegelaten onderscheid te maken bij het lidmaatschap van of de betrokkenheid bij een werknemers- of
      werkgeversorganisatie of een vereniging van beroepsgenoten, alsmede bij de voordelen die uit dat lidmaatschap of
      uit die betrokkenheid voortvloeien.
    url: https://wetten.overheid.nl/BWBR0003299/2026-01-01#Artikel4a
  - number: 4a.2
    text: Iedere bepaling die in strijd is met het eerste lid is nietig.
    url: https://wetten.overheid.nl/BWBR0003299/2026-01-01#Artikel4a
  - number: '5.1'
    text: |-
      Van het in de [artikelen 1b][ref1], [2][ref2], [3][ref3] en [4][ref4] bepaalde mag worden afgeweken indien het
      gemaakte onderscheid beoogt vrouwen in een bevoorrechte positie te plaatsen teneinde nadelen op te heffen of te
      verminderen en het onderscheid in een redelijke verhouding staat tot het beoogde doel.


      [ref1]: https://wetten.overheid.nl/BWBR0003299#Artikel1b
      [ref2]: https://wetten.overheid.nl/BWBR0003299#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0003299#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0003299#Artikel4
    url: https://wetten.overheid.nl/BWBR0003299/2026-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003299
        artikel: 1b
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0003299
        artikel: '2'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0003299
        artikel: '3'
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0003299
        artikel: '4'
        paragraaf: '1'
  - number: '5.2'
    text: |-
      Voor zover het betreft de toegang tot beroepsactiviteiten of de hiervoor noodzakelijke opleidingen mag van de
      [artikelen 1b][ref1], [2][ref2], [3][ref3] en [4][ref4] worden afgeweken indien het gemaakte onderscheid
      is gebaseerd op een kenmerk dat verband houdt met het geslacht en dat kenmerk wegens de aard van de betrokken
      specifieke beroepsactiviteiten of de context waarin deze worden uitgevoerd, een wezenlijk en bepalend
      beroepsvereiste is, mits het doel legitiem is en het vereiste evenredig aan dat doel is.


      [ref1]: https://wetten.overheid.nl/BWBR0003299#Artikel1b
      [ref2]: https://wetten.overheid.nl/BWBR0003299#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0003299#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0003299#Artikel4
    url: https://wetten.overheid.nl/BWBR0003299/2026-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003299
        artikel: 1b
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0003299
        artikel: '2'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0003299
        artikel: '3'
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0003299
        artikel: '4'
        paragraaf: '1'
  - number: '5.3'
    text: |-
      Als beroepsactiviteiten en hiervoor noodzakelijke opleidingen waarvoor een kenmerk als bedoeld in het tweede
      lid, een wezenlijk en bepalend beroepsvereiste is, worden slechts beschouwd die welke behoren tot respectievelijk
      opleiden voor geestelijke ambten dan wel beroepsactiviteiten die bij algemene maatregel van bestuur zijn
      aangewezen.
    url: https://wetten.overheid.nl/BWBR0003299/2026-01-01#Artikel5
  - number: '6'
    text: |-
      Het in deze wet neergelegde verbod van onderscheid geldt niet ten aanzien van indirect onderscheid, indien dat
      onderscheid objectief gerechtvaardigd wordt door een legitiem doel en de middelen voor het bereiken van dat doel
      passend en noodzakelijk zijn.
    url: https://wetten.overheid.nl/BWBR0003299/2026-01-01#Artikel6
  - number: 6a
    text: |-
      Indien degene die meent dat te zijnen nadeel een onderscheid is of wordt gemaakt als bedoeld in deze wet, in rechte
      feiten aanvoert die dat onderscheid kunnen doen vermoeden, dient de wederpartij te bewijzen dat niet in strijd met
      deze wet is gehandeld.
    url: https://wetten.overheid.nl/BWBR0003299/2026-01-01#Artikel6a
  - number: '7.1'
    text: |-
      Bij de toepassing van [artikel 646 van Boek 7 van het Burgerlijk Wetboek][ref1] wordt voor de vergelijking van de
      in [dat artikel][ref2] bedoelde arbeidsvoorwaarden met betrekking tot het loon uitgegaan van het loon dat in de
      onderneming waar de werknemer in wiens belang de loonvergelijking wordt gemaakt werkzaam is, door een werknemer
      van de andere kunne voor arbeid van gelijke waarde dan wel, bij gebreke daarvan, voor arbeid van nagenoeg gelijke
      waarde pleegt te worden ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel646
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel646
    url: https://wetten.overheid.nl/BWBR0003299/2026-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '646'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '646'
  - number: '7.2'
    text: |-
      Onder loon als bedoeld in het eerste lid wordt verstaan de vergoeding door de werkgever aan de werknemer
      verschuldigd terzake van diens arbeid.
    url: https://wetten.overheid.nl/BWBR0003299/2026-01-01#Artikel7
  - number: '8'
    text: |-
      Voor de toepassing van [artikel 7][ref1] wordt arbeid gewaardeerd volgens een deugdelijk stelsel van
      functiewaardering, waarbij zoveel mogelijk wordt aangesloten bij het stelsel dat gebruikelijk is in de onderneming
      waarin de belanghebbende werknemer werkzaam is. Bij gebreke van een zodanig stelsel wordt de arbeid, gelet op de
      beschikbare gegevens, naar billijkheid gewaardeerd.


      [ref1]: https://wetten.overheid.nl/BWBR0003299#Artikel7
    url: https://wetten.overheid.nl/BWBR0003299/2026-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003299
        artikel: '7'
        paragraaf: '2'
  - number: '9.1'
    text: |-
      Voor de toepassing van [artikel 7][ref1] wordt het loon van de belanghebbende werknemer geacht gelijk te zijn aan
      het loon dat een werknemer van de andere kunne voor arbeid van gelijke waarde pleegt te ontvangen, indien het is
      berekend op grondslag van gelijkwaardige maatstaven.


      [ref1]: https://wetten.overheid.nl/BWBR0003299#Artikel7
    url: https://wetten.overheid.nl/BWBR0003299/2026-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003299
        artikel: '7'
        paragraaf: '2'
  - number: '9.2'
    text: |-
      Voor de toepassing van [artikel 7][ref1] worden andere dan geldelijke loonbestanddelen in aanmerking genomen naar
      de waarde, welke daaraan in het economisch verkeer kan worden toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0003299#Artikel7
    url: https://wetten.overheid.nl/BWBR0003299/2026-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003299
        artikel: '7'
        paragraaf: '2'
  - number: '9.3'
    text: |-
      Ingeval een arbeidsduur is overeengekomen, welke korter is dan die welke in overeenkomstige arbeidsverhoudingen in
      de regel geacht wordt een volledige dienstbetrekking te vormen, wordt het loon, voorzover het naar tijdsduur wordt
      berekend, naar evenredigheid verminderd.
    url: https://wetten.overheid.nl/BWBR0003299/2026-01-01#Artikel9
  - number: '10'
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regelen worden gesteld omtrent het in de [artikelen 7][ref1],
      [8][ref2] en [9][ref3] bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0003299#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0003299#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0003299#Artikel9
    url: https://wetten.overheid.nl/BWBR0003299/2026-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003299
        artikel: '7'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0003299
        artikel: '8'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0003299
        artikel: '9'
        paragraaf: '2'
  - number: '12'
    text: |-
      Bij de toepassing van de [artikelen 1b][ref1] en [1c][ref2] van deze wet is deze paragraaf van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003299#Artikel1b
      [ref2]: https://wetten.overheid.nl/BWBR0003299#Artikel1c
    url: https://wetten.overheid.nl/BWBR0003299/2026-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0003299
        artikel: 1b
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0003299
        artikel: 1c
        paragraaf: '1'
  - number: 12a
    text: |-
      Voor de toepassing van het in deze paragraaf bepaalde wordt verstaan onder pensioenvoorziening: een
      pensioenvoorziening ten behoeve van een of meer personen, uitsluitend in verband met hun werkzaamheden in een
      onderneming, bedrijfstak, tak van beroep of openbare dienst, in aanvulling op een wettelijk stelsel van sociale
      zekerheid en, ingeval van een voorziening ten behoeve van een persoon, anders dan door die persoon zelf tot stand
      gebracht.
    url: https://wetten.overheid.nl/BWBR0003299/2026-01-01#Artikel12a
  - number: 12b.1
    text: |-
      Het is ook aan anderen dan de werkgever bedoeld in [artikel 646 van Boek 7 van het Burgerlijk Wetboek][ref1] of
      het bevoegd gezag bedoeld in [artikel 1b][ref2] niet toegestaan onderscheid te maken wat betreft de bepaling van de
      kring van personen voor wie een pensioenvoorziening tot stand wordt gebracht, wat betreft de bepaling van de inhoud
      van een pensioenvoorziening of wat betreft de wijze van uitvoering daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel646
      [ref2]: https://wetten.overheid.nl/BWBR0003299#Artikel1b
    url: https://wetten.overheid.nl/BWBR0003299/2026-01-01#Artikel12b
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '646'
      - id: ref2
        bwb_id: BWBR0003299
        artikel: 1b
        paragraaf: '1'
  - number: 12b.2
    text: |-
      Bepalingen krachtens welke de verwerving van pensioenaanspraken wordt onderbroken gedurende de periode van
      zwangerschaps- en bevallingsverlof op grond van een wettelijke bepaling of overeenkomst, worden voor de toepassing
      van [artikel 646 van Boek 7 van het Burgerlijk Wetboek][ref1], [artikel 1b][ref2] en het eerste lid beschouwd als
      strijdig met het verbod van ongelijke behandeling van mannen en vrouwen.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel646
      [ref2]: https://wetten.overheid.nl/BWBR0003299#Artikel1b
    url: https://wetten.overheid.nl/BWBR0003299/2026-01-01#Artikel12b
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '646'
      - id: ref2
        bwb_id: BWBR0003299
        artikel: 1b
        paragraaf: '1'
  - number: 12c.1
    text: |-
      In geval van een uitkeringsovereenkomst als bedoeld in [artikel 1 van de Pensioenwet][ref1],
      blijft de omvang van de geldelijke bijdrage van de werkgever voor de toepassing van
      [artikel 646 van Boek 7 van het Burgerlijk Wetboek][ref2] en van de [artikelen 1a][ref3] en [12b][ref4] buiten
      beschouwing, voor zover dat gerechtvaardigd is in verband met voor mannen en vrouwen verschillende actuariële
      berekeningselementen.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel646
      [ref3]: https://wetten.overheid.nl/BWBR0003299#Artikel1a
      [ref4]: https://wetten.overheid.nl/BWBR0003299#Artikel12b
    url: https://wetten.overheid.nl/BWBR0003299/2026-01-01#Artikel12c
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '646'
      - id: ref3
        bwb_id: BWBR0003299
        artikel: 1a
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0003299
        artikel: 12b
        paragraaf: '3'
  - number: 12c.2
    text: |-
      In geval van een premieovereenkomst als bedoeld in [artikel 1 van de Pensioenwet][ref1] of een kapitaalovereenkomst
      als bedoeld in [artikel 1 van de Pensioenwet][ref2] blijft de omvang van de geldelijke bijdrage van de werkgever
      voor de toepassing van [artikel 646 van Boek 7 van het Burgerlijk Wetboek][ref3] en van de [artikelen 1a][ref4] en
      [12b][ref5] buiten beschouwing en wordt:


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel646
      [ref4]: https://wetten.overheid.nl/BWBR0003299#Artikel1a
      [ref5]: https://wetten.overheid.nl/BWBR0003299#Artikel12b
    url: https://wetten.overheid.nl/BWBR0003299/2026-01-01#Artikel12c
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0005290
        artikel: '646'
      - id: ref4
        bwb_id: BWBR0003299
        artikel: 1a
        paragraaf: '1'
      - id: ref5
        bwb_id: BWBR0003299
        artikel: 12b
        paragraaf: '3'
  - number: 12c.2.a
    text: |-
      of de omvang van de uit de premieovereenkomst of kapitaaloverovereenkomst voortvloeiende periodieke
      pensioenuitkering voor mannen en vrouwen gelijk getrokken;
    url: https://wetten.overheid.nl/BWBR0003299/2026-01-01#Artikel12c
  - number: 12c.2.b
    text: |-
      of de door de werkgever beschikbaar gestelde premie respectievelijk de opbouw van aanspraak op kapitaal zodanig
      vastgesteld dat naar het inzicht op het tijdstip van vaststelling, de omvang van de pensioenen voor mannen en
      vrouwen gelijk wordt getrokken.
    url: https://wetten.overheid.nl/BWBR0003299/2026-01-01#Artikel12c
  - number: 12c.3
    text: |-
      In geval van een uitkeringsregeling als bedoeld in [artikel 1 van de Wet verplichte beroepspensioenregeling][ref1]
      blijft de omvang van de geldelijke bijdrage van de beroepsgenoot voor de toepassing van [artikel 12b][ref2] buiten
      beschouwing voor zover dat gerechtvaardigd is in verband met voor mannen en vrouwen verschillende actuariële
      berekeningselementen.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0003299#Artikel12b
    url: https://wetten.overheid.nl/BWBR0003299/2026-01-01#Artikel12c
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0003299
        artikel: 12b
        paragraaf: '3'
  - number: 12c.4
    text: |-
      In geval van een premieregeling of een aanspraak op kapitaal op basis van een kapitaalregeling als bedoeld in
      [artikel 1 van de Wet verplichte beroepspensioenregeling][ref1] wordt de omvang van het daaruit voortvloeiende
      pensioen voor mannen en vrouwen gelijk getrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel1
    url: https://wetten.overheid.nl/BWBR0003299/2026-01-01#Artikel12c
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '1'
  - number: 12c.5
    text: Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld omtrent het tweede en vierde lid.
    url: https://wetten.overheid.nl/BWBR0003299/2026-01-01#Artikel12c
  - number: 12d
    text: |-
      In afwijking van [artikel 12b][ref1] zijn toegestaan bepalingen die betrekking hebben op bescherming van de vrouw
      met name in verband met zwangerschap en moederschap.


      [ref1]: https://wetten.overheid.nl/BWBR0003299#Artikel12b
    url: https://wetten.overheid.nl/BWBR0003299/2026-01-01#Artikel12d
    references:
      - id: ref1
        bwb_id: BWBR0003299
        artikel: 12b
        paragraaf: '3'
  - number: 12e
    text: |-
      Iedere bepaling die strijdig is met het verbod van ongelijke behandeling van mannen en vrouwen bedoeld in
      [artikel 12b][ref1] is nietig.


      [ref1]: https://wetten.overheid.nl/BWBR0003299#Artikel12b
    url: https://wetten.overheid.nl/BWBR0003299/2026-01-01#Artikel12e
    references:
      - id: ref1
        bwb_id: BWBR0003299
        artikel: 12b
        paragraaf: '3'
  - number: 12f
    text: |-
      Het bepaalde in [artikel 681 van Boek 7 van het Burgerlijk Wetboek][ref1] of
      [artikel 1615s van Boek 7a van het Burgerlijk Wetboek BES][ref2] is van overeenkomstige toepassing bij beëindiging
      van de dienstbetrekking door de werkgever wegens de omstandigheid dat de werknemer in of buiten rechte een beroep
      heeft gedaan op het bepaalde in [artikel 12b][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel681
      [ref2]: https://wetten.overheid.nl/BWBR0028752#Artikel1615s
      [ref3]: https://wetten.overheid.nl/BWBR0003299#Artikel12b
    url: https://wetten.overheid.nl/BWBR0003299/2026-01-01#Artikel12f
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '681'
      - id: ref2
        bwb_id: BWBR0028752
        artikel: 1615s
      - id: ref3
        bwb_id: BWBR0003299
        artikel: 12b
        paragraaf: '3'
  - number: '21.1'
    text: |-
      Met het toezicht op de naleving van [artikel 646 van Boek 7 van het Burgerlijk Wetboek][ref1] en van het bepaalde
      bij of krachtens deze wet, zijn belast de bij besluit van Onze Minister van Sociale Zaken en Werkgelegenheid
      aangewezen ambtenaren. Onze Minister van Sociale Zaken en Werkgelegenheid kan ten behoeve van dit toezicht een
      onderzoek doen instellen door die ambtenaren. Voorzover het de openbare dienst betreft kan Onze Minister van
      Binnenlandse Zaken Onze Minister van Sociale Zaken en Werkgelegenheid verzoeken een onderzoek als bedoeld in de
      tweede volzin te doen instellen. Van een besluit als bedoeld in de eerste volzin wordt mededeling gedaan door
      plaatsing in de *Staatscourant*.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel646
    url: https://wetten.overheid.nl/BWBR0003299/2026-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '646'
  - number: '21.2'
    text: |-
      Indien uit een onderzoek blijkt dat een onderscheid is of wordt gemaakt als bedoeld in
      [artikel 646 van Boek 7 van het Burgerlijk Wetboek][ref1] of in deze wet doet Onze Minister van Sociale
      Zaken en Werkgelegenheid hiervan mededeling aan de natuurlijke persoon, rechtspersoon of het bevoegde
      gezag dat het onderscheid heeft gemaakt of maakt, en, indien het een onderscheid als bedoeld in
      [artikel 646 van Boek 7 van het Burgerlijk Wetboek][ref2] of [artikel 1b][ref3] of [artikel 1c][ref4] van deze
      wet betreft, aan de betrokken ondernemingsraad of het daarmee vergelijkbare medezeggenschapsorgaan, alsmede
      aan de daarvoor in aanmerking komende organisaties van werkgevers, van werknemers, uit het beroepsleven
      of van overheidspersoneel. De mededeling aan de betrokken ondernemingsraad of het daarmee vergelijkbare
      medezeggenschapsorgaan, alsmede aan de daarvoor in aanmerking komende organisaties van werkgevers, van werknemers,
      uit het beroepsleven of van overheidspersoneel bevat geen gegevens waaruit de identiteit van de in het onderzoek
      betrokken personen ten nadele van wie het onderscheid is of wordt gemaakt kan worden afgeleid.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel646
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel646
      [ref3]: https://wetten.overheid.nl/BWBR0003299#Artikel1b
      [ref4]: https://wetten.overheid.nl/BWBR0003299#Artikel1c
    url: https://wetten.overheid.nl/BWBR0003299/2026-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '646'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '646'
      - id: ref3
        bwb_id: BWBR0003299
        artikel: 1b
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0003299
        artikel: 1c
        paragraaf: '1'
  - number: '23'
    text: |-
      De voordracht tot wijziging van een algemene maatregel van bestuur als bedoeld in
      [artikel 5, derde lid, onderdeel c][ref1], en de voordracht voor een algemene maatregel van bestuur als bedoeld in
      [artikel 10][ref2] wordt niet gedaan dan nadat het ontwerp in de *Staatscourant* is bekendgemaakt en aan een ieder
      de gelegenheid is geboden om binnen vier weken na de dag waarop de bekendmaking is geschied, wensen en bedenkingen
      ter kennis van Onze minister te brengen. Gelijktijdig met de bekendmaking wordt het ontwerp aan de beide Kamers der
      Staten-Generaal overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0003299#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0003299#Artikel10
    url: https://wetten.overheid.nl/BWBR0003299/2026-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0003299
        artikel: '5'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0003299
        artikel: '10'
        paragraaf: '2'
  - number: 23a
    text: |-
      De [artikelen 1 tot en met 23][ref1] van deze wet zijn mede van toepassing in de openbare lichamen Bonaire, Sint
      Eustatius en Saba.


      [ref1]: https://wetten.overheid.nl/BWBR0003299#Artikel1
    url: https://wetten.overheid.nl/BWBR0003299/2026-01-01#Artikel23a
    references:
      - id: ref1
        bwb_id: BWBR0003299
        artikel: '1'
        paragraaf: '1'
  - number: '24.1'
    text: 'Deze wet kan worden aangehaald als: Wet gelijke behandeling van mannen en vrouwen.'
    url: https://wetten.overheid.nl/BWBR0003299/2026-01-01#Artikel24
  - number: '24.2'
    text: |-
      Deze wet treedt in werking met ingang van de tweede dag na de datum van uitgifte van het *Staatsblad* waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0003299/2026-01-01#Artikel24
