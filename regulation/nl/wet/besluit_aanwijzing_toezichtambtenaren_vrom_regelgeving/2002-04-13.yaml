  - number: '6'
    text: |-
      De ambtenaren van de rijksbelastingdienst, bevoegd inzake douane zijn, voor zover het toezicht kan worden
      uitgeoefend in samenhang met de werkzaamheden waartoe zij krachtens wettelijke bepalingen inzake de douane bevoegd
      zijn, mede belast met het toezicht op de naleving van het bepaalde bij of krachtens: - de [Wet milieubeheer][ref1]
      ten aanzien van gevaarlijke afvalstoffen;
        - artikel 3, eerste lid, van het Besluit verwijdering wit- en bruingoed;
        - de [verordening (EEG) nr. 259/93](31993R0259) van de Raad van de Europese Gemeenschappen van 1 februari 1993
      betreffende toezicht en controle op de overbrenging van afvalstoffen binnen, naar en uit de Europese Gemeenschappen
      (PbEG L 30);
        - [hoofdstuk II van de Wet geluidhinder][ref2];
        - [hoofdstuk 4][ref3], [paragraaf 1, van de Wet milieugevaarlijke stoffen][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0003245
      [ref2]: https://wetten.overheid.nl/BWBR0003227#HoofdstukII
      [ref3]: https://wetten.overheid.nl/BWBR0003892#Hoofdstuk4
      [ref4]: https://wetten.overheid.nl/BWBR0003892#Paragraaf1
    url: https://wetten.overheid.nl/BWBR0013195/2002-04-13#Artikel6
