  - number: '4'
    text: |-
      De ambtenaren van het Staatstoezicht op de Mijnen met de functies inspecteur-generaal der Mijnen, plaatsvervangend
      inspecteur-generaal der Mijnen, hoofd Nieuwbouw en Projecten, hoofdinspecteur en inspecteur zijn, voor zover het
      betreft mijnbouwactiviteiten, mede belast met het toezicht op de naleving van het bepaalde bij of krachtens: -
      de [Wet milieubeheer][ref1];
        - de [Wet geluidhinder][ref2];
        - de [Wet milieugevaarlijke stoffen][ref3];
        - de [Wet inzake de luchtverontreiniging][ref4];
        - de [Wet bodembescherming][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0003245
      [ref2]: https://wetten.overheid.nl/BWBR0003227
      [ref3]: https://wetten.overheid.nl/BWBR0003892
