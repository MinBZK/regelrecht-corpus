      - id: ref2
        bwb_id: BWBR0003245
      - id: ref3
        bwb_id: BWBR0003994
  - number: '5.2'
    text: |-
      De ambtenaren van de scheepvaartinspectie, bedoeld in [artikel 10 van de Schepenwet][ref1], zijn
      mede belast met het toezicht op de naleving van het bepaalde bij of krachtens [hoofdstuk 4][ref2],
      [paragraaf 1, van de Wet milieugevaarlijke stoffen][ref3], voor zover het betreft het
      [Besluit inzake stoffen die de ozonlaag aantasten 1995][ref4] aan boord van zeeschepen die
      gerechtigd zijn de Nederlandse vlag te voeren, met uitzondering van de schepen als bedoeld in
      [artikel 2, eerste lid, onder a, van de Schepenwet][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0001876#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0003892#Hoofdstuk4
      [ref3]: https://wetten.overheid.nl/BWBR0003892#Paragraaf1
      [ref4]: https://wetten.overheid.nl/BWBR0007617
      [ref5]: https://wetten.overheid.nl/BWBR0001876#Artikel2
