  - number: '5.3'
    text: |-
      De ambtenaren van de Rijksverkeersinspectie, die bij het [Besluit buitengewoon opsporingsambtenaar][ref1] RVI 1995
      zijn aangewezen als buitengewoon opsporingsambtenaar, zijn mede belast met het toezicht op de naleving van het
      bepaalde bij of krachtens: - de [Wet milieubeheer][ref2] ten aanzien van gevaarlijke afvalstoffen;
        - de [Wet milieubeheer][ref3] ten aanzien van inrichtingen die behoren tot categorieën die zijn genoemd in bijlage
      I, onder 2.1, onder a, 3, 4.1 onder a, 5 en 14.1, onder a, van het Inrichtingen- en vergunningenbesluit, voor zover
      het toezicht kan worden uitgeoefend in samenhang met de werkzaamheden waartoe zij krachtens wettelijke bepalingen
      inzake vervoer van stoffen en preparaten bevoegd zijn;
        - de [verordening (EEG) nr. 259/93](31993R0259) van de Raad van de Europese Gemeenschappen van 1 februari 1993
      betreffende toezicht en controle op de overbrenging van afvalstoffen binnen, naar en uit de Europese Gemeenschappen
      (PbEG L 30);
        - [hoofdstuk 4][ref4], [paragraaf 1, van de Wet milieugevaarlijke stoffen][ref5], voor zover het toezicht kan
      worden uitgeoefend in samenhang met de werkzaamheden waartoe zij krachtens wettelijke bepalingen inzake het vervoer
      van stoffen en preparaten bevoegd zijn;
        - [hoofdstuk 4][ref6], [paragraaf 2, van de Wet milieugevaarlijke stoffen][ref7];
        - de Interimwet bodemsanering, voor zover het betreft het toezicht bij het vervoer van stoffen die de bodem kunnen
      verontreinigen;
        - de [Wet bodembescherming][ref8], voor zover het betreft het toezicht bij het vervoer van stoffen die de bodem
      kunnen verontreinigen.


      [ref1]: https://wetten.overheid.nl/BWBR0007013
      [ref2]: https://wetten.overheid.nl/BWBR0003245
