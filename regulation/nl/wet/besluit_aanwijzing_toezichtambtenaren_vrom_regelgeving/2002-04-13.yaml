  - number: '10'
    text: |-
      De hoofdinspecteurs van de Keuringsdienst van Waren, alsmede de onder hun bevelen werkzame ambtenaren,
      met uitzondering van hen die meer in het bijzonder administratieve werkzaamheden uitoefenen, zijn mede
      belast met het toezicht op de naleving van het bepaalde bij of krachtens: - de [hoofdstukken 2][ref1]
      en [3 van de Wet milieugevaarlijke stoffen][ref2] bepaalde, voor zover het betreft het bij of krachtens
      [artikel 5 van de Wet milieugevaarlijke stoffen][ref3] bepaalde inzake goede laboratoriumpraktijk;
        - hoofdstuk 4, paragrafen 1 en 2, van de [Wet milieugevaarlijke stoffen][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0003892#Hoofdstuk3
      [ref3]: https://wetten.overheid.nl/BWBR0003892#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0003892
