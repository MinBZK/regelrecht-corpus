  - number: '7'
    text: |-
      De ambtenaren van de Algemene Inspectiedienst van het Ministerie van Landbouw, Natuurbeheer en Visserij zijn mede
      belast met het toezicht op de naleving van het bepaalde: - krachtens [artikel 1.2 van de Wet milieubeheer][ref1]
      ten aanzien van provinciale gebruiksregels voor meststoffen;
        - bij of krachtens [hoofdstuk 2 van de Wet milieugevaarlijke stoffen][ref2] bepaalde, voor zover het toezicht
      kan worden uitgeoefend in samenhang met de werkzaamheden waartoe zij krachtens wettelijke bepalingen inzake
      bestrijdingsmiddelen, diergeneesmiddelen en de landbouwkwaliteit bevoegd zijn;
        - bij of krachtens de [Wet bodembescherming][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0003892#Hoofdstuk2
      [ref3]: https://wetten.overheid.nl/BWBR0003994
    url: https://wetten.overheid.nl/BWBR0013195/2002-04-13#Artikel7
    references:
