  - number: '11'
    text: |-
      In afwijking van de artikelen 2 tot en met 7, 9 en 10 en [artikel 18.4, derde lid, van de Wet milieubeheer][ref1],
      zijn ten aanzien van inrichtingen die behoren tot categorieën die zijn genoemd in [bijlage II][ref2],
      [onder 1 tot en met 8, van het Inrichtingen- en vergunningenbesluit milieubeheer][ref3], en inrichtingen die zijn
      aangewezen krachtens [artikel 8.2, vierde lid, van de Wet milieubeheer][ref4], uitsluitend de aan de inspecteur-
      generaal VROM toegevoegde, door hem daartoe aangewezen ambtenaren belast met het toezicht op de naleving van het
      bepaalde bij of krachtens: - de [Wet milieubeheer][ref5];
        - de [Wet geluidhinder][ref6];
        - de [Wet milieugevaarlijke stoffen][ref7];
        - de [Wet inzake de luchtverontreiniging][ref8];
        - de Interimwet bodemsanering;
        - de [Wet bodembescherming][ref9].


