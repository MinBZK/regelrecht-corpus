articles:
  - number: '1'
    text: |-
      De inspecteur-generaal en de regionale inspecteurs van het Inspectoraat-Generaal VROM in de regio en de
      onder hun bevelen werkzame ambtenaren, met uitzondering van hen die meer in het bijzonder administratieve
      werkzaamheden uitoefenen, zijn belast met het toezicht op de uitvoering van het bepaalde bij of krachtens: - de
      [Woningwet][ref1];
        - de [Wet op de stads- en dorpsvernieuwing][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005181
      [ref2]: https://wetten.overheid.nl/BWBR0003709
    url: https://wetten.overheid.nl/BWBR0013195/2002-04-13#Artikel1
