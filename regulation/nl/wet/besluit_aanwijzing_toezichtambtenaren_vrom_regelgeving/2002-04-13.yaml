  text: |-
    Gelet op de artikelen 119 en 119a van de Woningwet, 25 van de Wet stedelijke vernieuwing, 55a van de Wet op
    de stads- en dorpsvernieuwing, 18.4, eerste en vierde lid, van de Wet milieubeheer, 15 van de Wet hygiëne en
    veiligheid badinrichtingen en zwemgelegenheden en 61 van de Waterleidingwet, alsmede op de artikelen 148, eerste
    lid, van de Wet geluidhinder, 64, eerste lid, van de Wet milieugevaarlijke stoffen, 90, eerste lid, van de Wet
