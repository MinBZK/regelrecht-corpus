  - number: '3'
    text: |-
      De ambtenaren, bedoeld in [artikel 141 van het Wetboek van Strafvordering][ref1] zijn mede belast met het toezicht
      op de naleving van het bepaalde bij of krachtens: - [titel 10.5A van de Wet milieubeheer][ref2];
        - de [verordening (EEG) nr. 259/93](31993R0259) van de Raad van de Europese Gemeenschappen van 1 februari 1993
      betreffende toezicht en controle op de overbrenging van afvalstoffen binnen, naar en uit de Europese Gemeenschappen
      (PbEG L 30).


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
