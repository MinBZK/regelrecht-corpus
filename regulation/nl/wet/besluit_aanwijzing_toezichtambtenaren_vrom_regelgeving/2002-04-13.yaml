    text: |-
      De inspecteur-generaal en de regionale inspecteurs van het Inspectoraat-Generaal VROM in de regio en de onder
      hun bevelen werkzame ambtenaren, met uitzondering van hen die meer in het bijzonder administratieve werkzaamheden
      uitoefenen, zijn belast met het toezicht op de naleving van het bepaalde bij of krachtens: - de [Woningwet][ref1];
        - de [Wet stedelijke vernieuwing][ref2];
        - de [Wet milieubeheer][ref3];
        - de [Wet inzake de luchtverontreiniging][ref4];
        - de [Wet geluidhinder][ref5];
        - de [Wet bodembescherming][ref6];
        - de [Wet milieugevaarlijke stoffen][ref7];
        - de Interimwet bodemsanering;
        - de [Wet hygiëne en veiligheid badinrichtingen en zwemgelegenheden][ref8];
        - de [Waterleidingwet][ref9];
        - de [Wet explosieven voor civiel gebruik][ref10]
        - de [verordening (EEG) nr. 259/93](31993R0259) van de Raad van de Europese Gemeenschappen van 1 februari 1993
      betreffende toezicht en controle op de overbrenging van afvalstoffen binnen, naar en uit de Europese Gemeenschappen
      (PbEG L 30).


