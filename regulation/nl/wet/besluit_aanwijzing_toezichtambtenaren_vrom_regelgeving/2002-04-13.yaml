  - number: '5.1'
    text: |-
      De ambtenaren, bij beschikking van de Minister van Verkeer en Waterstaat van 23 december 1993, nr.
      RJW 162891 (Stcrt. 1994, 12), aangewezen als ambtenaar, belast met het toezicht op de naleving van de
      [Wet verontreiniging oppervlaktewateren][ref1] zijn mede belast met het toezicht op de naleving van het bepaalde
      bij of krachtens: - de [Wet milieubeheer][ref2] ten aanzien van gevaarlijke afvalstoffen;
        - de [verordening (EEG) nr. 259/93](31993R0259) van de Raad van de Europese Gemeenschappen van 1 februari 1993
      betreffende toezicht en controle op de overbrenging van afvalstoffen binnen, naar en uit de Europese Gemeenschappen
      (PbEG L 30);
        - de [Wet bodembescherming][ref3], voor zover het betreft het bepaalde bij of krachtens hoofdstuk IV, paragrafen
      5.1, 5.3 en 5.4, met betrekking tot rijkswateren.


      [ref1]: https://wetten.overheid.nl/BWBR0002682
      [ref2]: https://wetten.overheid.nl/BWBR0003245
      [ref3]: https://wetten.overheid.nl/BWBR0003994
    url: https://wetten.overheid.nl/BWBR0013195/2002-04-13#Artikel5
    references:
      - id: ref1
