      - id: ref3
        bwb_id: BWBR0003994
  - number: '8'
    text: |-
      De commandant en de controleurs van het Korps militaire controleurs gevaarlijke stoffen zijn mede belaste
      met het toezicht op de naleving van het bepaalde bij of krachtens hoofdstuk 4, paragrafen 1 en 2, van de
      [Wet milieugevaarlijke stoffen][ref1], voor zover het toezicht kan worden uitgeoefend in samenhang met de
      werkzaamheden waartoe zij krachtens wettelijke bepalingen inzake het vervoer van stoffen en preparaten bevoegd
      zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0003892
    url: https://wetten.overheid.nl/BWBR0013195/2002-04-13#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003892
  - number: '9'
    text: |-
      De ambtenaren van de Arbeidsinspectie van het Ministerie van Sociale Zaken en Werkgelegenheid zijn mede belast
      met het toezicht op de naleving van het bepaalde bij of krachtens: - [hoofdstuk II van de Wet geluidhinder][ref1],
      voor zover het toezicht betrekking heeft op het voorkomen of beperken van schadelijk of hinderlijk geluid op de
      arbeidsplaats;
        - de [hoofdstukken 2][ref2], [3][ref3] en [4][ref4], [paragraaf 2, van de Wet milieugevaarlijke stoffen][ref5];
        - [hoofdstuk 4][ref6], [paragraaf 1, van de Wet milieugevaarlijke stoffen][ref7], voor zover de op grond van de
      [Wet milieugevaarlijke stoffen][ref8] uit te vaardigen maatregelen samenhang hebben met de doelstelling van de
      wetgeving inzake arbeidsomstandigheden.


