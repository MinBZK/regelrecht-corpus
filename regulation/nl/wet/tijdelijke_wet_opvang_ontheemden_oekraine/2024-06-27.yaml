  - number: '10'
    text: |-
      1 Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen
      daarvan verschillend kan worden vastgesteld.

      2 Deze wet vervalt op een bij koninklijk besluit te bepalen tijdstip. Dit tijdstip wordt niet later gesteld dan
      één jaar nadat de werking van Uitvoeringsbesluit (EU) 2022/382 van de Raad van 4 maart 2022 tot vaststelling
      van het bestaan van een massale toestroom van ontheemden uit Oekraïne in de zin van artikel 5 van [Richtlijn
      2001/55/EG](32001L0055), en tot invoering van tijdelijke bescherming naar aanleiding daarvan, of een verlenging
      daarvan, eindigt. Gedurende de hiervoor bedoelde periode van ten hoogste één jaar blijft deze wet van toepassing
      op vreemdelingen die tijdelijke bescherming genoten op de dag voorafgaand aan het eindigen van de tijdelijke
      bescherming.
    url: https://wetten.overheid.nl/BWBR0049876/2024-06-27#Artikel10
