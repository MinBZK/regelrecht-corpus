  - number: '4'
    text: |-
      Bij ministeriële regeling worden regels gesteld over een specifieke uitkering, als bedoeld in
      [artikel 17, eerste lid, van de Financiële-verhoudingswet][ref1], die Onze Minister aan gemeenten verstrekt ter
      bekostiging van de kosten die zij maken ter uitvoering van de taak, bedoeld in [artikel 2, eerste lid][ref2].


