  - number: '5'
    text: |-
      1 Na de inwerkingtreding van deze wet berust de [Regeling opvang ontheemden Oekraïne][ref1] op
      [artikel 3, eerste lid][ref2], van deze wet.

      2 Na de inwerkingtreding van deze wet berust de [Bekostigingsregeling opvang ontheemden Oekraïne][ref3] op
      [artikel 4][ref4] van deze wet.


