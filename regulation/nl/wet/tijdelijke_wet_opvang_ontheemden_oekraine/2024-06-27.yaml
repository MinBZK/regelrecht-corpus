preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is om te voorzien in een reguliere en tijdelijke
    wettelijke grondslag voor de opvang van ontheemden uit Oekraïne, zodat de artikelen 2c en 4 van de Wet verplaatsing
    bevolking buiten werking kunnen worden gesteld;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0049876/2024-06-27#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop rustende bepalingen wordt verstaan onder:

        - *ontheemde:* de vreemdeling die tijdelijke bescherming geniet als bedoeld in
      [artikel 1 van de Vreemdelingenwet 2000][ref1], omdat hij onder de reikwijdte valt van Uitvoeringsbesluit (EU)
      2022/382 van de Raad van 4 maart 2022 tot vaststelling van het bestaan van een massale toestroom van ontheemden
      uit Oekraïne in de zin van artikel 5 van [Richtlijn 2001/55/EG](32001L0055), en tot invoering van tijdelijke
      bescherming naar aanleiding daarvan, of een verlenging daarvan;
        - *Onze Minister:* Onze Minister van Justitie en Veiligheid.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel1
    url: https://wetten.overheid.nl/BWBR0049876/2024-06-27#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '1'
  - number: '2'
    text: |-
      1 Het college van burgemeester en wethouders draagt zorg voor de materiële en immateriële opvang van ontheemden.

      2 In afwijking van het eerste lid draagt Onze Minister zorg voor de dekking van de kosten van medische zorg aan
      ontheemden middels een daartoe door hem te treffen ziektekostenregeling, en voor de beschikbaarheid van medische
      zorg voor ontheemden.

      3 De daartoe door het college van burgemeester en wethouders aangewezen ambtenaren zijn bevoegd een
      opvangvoorziening te betreden en deze te ontruimen, daaronder begrepen een woning zonder toestemming van de
      bewoner, als de ontheemde aan wie deze opvangvoorziening eerder is toegewezen deze kennelijk heeft verlaten.
    url: https://wetten.overheid.nl/BWBR0049876/2024-06-27#Artikel2
  - number: '3'
    text: |-
      1 Bij ministeriële regeling worden regels gesteld over de wijze waarop het college van burgemeester en wethouders
      in de taak, bedoeld in [artikel 2, eerste lid][ref1], voorziet, waaronder regels over de te bieden verstrekkingen
      aan ontheemden en regels over de voorwaarden waaronder ontheemden die verstrekkingen ontvangen.

      2 In de regeling, bedoeld in het eerste lid, wordt in elk geval voorzien in regels over een verplichte eigen
      bijdrage van een ontheemde in de kosten van zijn verstrekkingen, zowel de opvang als ook andere materiële en
      financiële voorzieningen en de voorwaarden die voor deze eigen bijdrage gelden. De bijdrage is slechts verschuldigd
      indien de ontheemde inkomsten uit arbeid heeft en bedraagt ten hoogste de economische waarde van de aan de
      ontheemde geboden verstrekkingen. In de regeling wordt tevens opgenomen dat wanneer er voldoende inkomsten uit
      arbeid zijn geen financiële toelage meer wordt verstrekt.

      3 Bij ministeriële regeling kunnen regels worden gesteld over de wijze waarop Onze Minister in de taak, bedoeld in
      [artikel 2, tweede lid][ref2], voorziet.


      [ref1]: https://wetten.overheid.nl/BWBR0049876#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0049876#Artikel2
    url: https://wetten.overheid.nl/BWBR0049876/2024-06-27#Artikel3
