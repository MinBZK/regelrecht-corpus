  - number: '6'
    text: |-
      1 Het college van burgemeester en wethouders kan gegevens over gezondheid als bedoeld in artikel 9 van de Algemene
      verordening gegevensbescherming verwerken, voor zover dat noodzakelijk is ter uitvoering van de taak, bedoeld in
      [artikel 2, eerste lid][ref1].

      2 Onze Minister kan gegevens over gezondheid als bedoeld in artikel 9 van de Algemene verordening
      gegevensbescherming verwerken, voor zover dat noodzakelijk is ter uitvoering van zijn taak, bedoeld in
      [artikel 2, tweede lid][ref2].

      3 De persoonsgegevens die door het college van burgemeester en wethouders en Onze Minister worden verwerkt worden
      niet langer bewaard dan noodzakelijk is ter uitvoering van de taken, bedoeld in [artikel 2][ref3], en worden
      uiterlijk binnen vier jaar na de eerste verwerking verwijderd.

      4 Bij ministeriële regeling wordt voorzien in passende en specifieke waarborgen voor de verwerking van de
      persoonsgegevens, bedoeld in het eerste en tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0049876#Artikel2
