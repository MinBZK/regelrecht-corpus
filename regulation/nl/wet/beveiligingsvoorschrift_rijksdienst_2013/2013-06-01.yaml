  - number: '6.2'
    text: Dit besluit treedt in werking met ingang van 1 juni 2013.
    url: https://wetten.overheid.nl/BWBR0033512/2013-06-01#Artikel6
  - number: '6.3'
    text: Dit besluit wordt aangehaald als het Beveiligingsvoorschrift Rijksdienst 2013.
    url: https://wetten.overheid.nl/BWBR0033512/2013-06-01#Artikel6
  - number: '6.4'
    text: Dit besluit zal met toelichting in de Staatscourant worden geplaatst.
    url: https://wetten.overheid.nl/BWBR0033512/2013-06-01#Artikel6
