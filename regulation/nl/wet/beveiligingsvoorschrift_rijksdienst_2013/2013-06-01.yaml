preamble:
  text: |-
    De Minister-president, Minister van Algemene Zaken, handelend in overeenstemming met het gevoelen van de
    ministerraad;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0033512/2013-06-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0033512/2013-06-01#Artikel1
  - number: 1.a
    text: '*Lijnmanager:* het diensthoofd dat verantwoordelijk is voor een dienstonderdeel.'
    url: https://wetten.overheid.nl/BWBR0033512/2013-06-01#Artikel1
  - number: 1.b
    text: |-
      *Te beschermen belang:* belangen waarbij in geval van compromittering, of de mogelijkheid van compromittering,
      nadelige gevolgen, of een risico daarop, kan ontstaan voor de betrouwbaarheid en continuïteit van de primaire
      processen van de rijksoverheid, delen daarvan of voor andere belangen van de Staat, van zijn bondgenoten of van één
      of meer ministeries.
    url: https://wetten.overheid.nl/BWBR0033512/2013-06-01#Artikel1
  - number: 1.c
    text: |-
      *Integrale beveiliging:* het selecteren, implementeren en periodiek evalueren van een samenhangend stelsel van
      beveiligingsmaatregelen van de organisatie, medewerkers, materieel, informatiesystemen, gebouwen en overige
      objecten op basis van risicomanagement.
    url: https://wetten.overheid.nl/BWBR0033512/2013-06-01#Artikel1
  - number: 1.d
    text: |-
      *Risicomanagement:* inzichtelijk en systematisch inventariseren, beoordelen en – door het treffen van maatregelen
      – beheersbaar maken van risico’s en kansen, die het bereiken van de doelstellingen van de organisatie bedreigen dan
      wel bevorderen, op een zodanige wijze dat verantwoording kan worden afgelegd over de gemaakte keuzes.
    url: https://wetten.overheid.nl/BWBR0033512/2013-06-01#Artikel1
  - number: 1.e
    text: |-
      *Dienstonderdeel:* een onder de verantwoordelijkheid van de desbetreffende Minister ressorterende instelling,
      dienst of bedrijf.
    url: https://wetten.overheid.nl/BWBR0033512/2013-06-01#Artikel1
  - number: '2.1'
    text: |-
      Dit voorschrift geldt voor de Rijksdienst, waartoe gerekend worden de ministeries met de daaronder ressorterende
      diensten, bedrijven en instellingen.
    url: https://wetten.overheid.nl/BWBR0033512/2013-06-01#Artikel2
  - number: '2.2'
    text: Deze regeling is van toepassing op de integrale beveiliging van de Rijksdienst.
    url: https://wetten.overheid.nl/BWBR0033512/2013-06-01#Artikel2
  - number: '2.3'
    text: |-
      De departementale secretaris-generaal kan voor zijn eigen ministerie bepalen dat deze regeling op dienstonderdelen
      met een bijzondere taak of delen van die dienstonderdelen niet van toepassing is.
    url: https://wetten.overheid.nl/BWBR0033512/2013-06-01#Artikel2
  - number: '3.1'
    text: |-
      De minister die conform het besluit van het constituerend beraad of ministerraad belast is met de integrale
      beveiliging van de Rijksdienst, is beleidsverantwoordelijk voor de integrale beveiliging van de Rijksdienst,
      alsmede de inrichting en werking van de organisatie van de beveiliging van de Rijksdienst.
    url: https://wetten.overheid.nl/BWBR0033512/2013-06-01#Artikel3
  - number: '3.2'
    text: |-
      De secretaris-generaal van zijn ministerie wijst een rijksbeveiligingsambtenaar aan die belast is met het bewaken
      van het integrale karakter en de consistentie van de Rijksbrede kaders voor beveiliging alsmede het toezicht op de
      werking van de integrale beveiliging van de Rijksdienst.
    url: https://wetten.overheid.nl/BWBR0033512/2013-06-01#Artikel3
  - number: '3.3'
    text: |-
      De rijksbeveiligingsambtenaar is verantwoordelijk voor de realisatie van rijksbreed toezicht op de naleving van
      de Rijksbrede kaders. Hij bevordert een gezamenlijke aanpak van beveiligingsissues en -belangen wanneer deze bij
      meerdere departementen spelen.
    url: https://wetten.overheid.nl/BWBR0033512/2013-06-01#Artikel3
  - number: '3.4'
    text: |-
      De rijksbeveiligingsambtenaar kan namens zijn secretaris-generaal, gehoord en na instemming van de departementale
      secretaris-generaal, in het geval van een (mogelijke) ernstige inbreuk op de beveiliging van departement
      overstijgende systemen of diensten, of een risico daarop, aanwijzingen geven aan iedere ambtenaar teneinde
      eventuele gevolgen van een inbreuk op de beveiliging te beperken.
    url: https://wetten.overheid.nl/BWBR0033512/2013-06-01#Artikel3
  - number: '4.1'
    text: |-
      De departementale secretaris-generaal is eindverantwoordelijk voor de integrale beveiliging en de inrichting en
      werking van de departementale beveiligingsorganisatie.
    url: https://wetten.overheid.nl/BWBR0033512/2013-06-01#Artikel4
  - number: '4.2'
    text: |-
      De departementale secretaris-generaal stelt, binnen de rijksbrede kaders, het departementale integrale
      beveiligingsbeleid vast.
    url: https://wetten.overheid.nl/BWBR0033512/2013-06-01#Artikel4
  - number: '4.3'
    text: |-
      De departementale secretaris-generaal wijst een departementale beveiligingsambtenaar aan die zorg draagt voor het
      toezicht op de integrale beveiliging van het departement, hierover adviseert en ter zake hiervan incidenten laat
      onderzoeken alsmede zorg draagt voor het toezicht op de organisatie van de beveiliging van het departement. Er kan
      voor twee of meer ministeries één beveiligingsambtenaar wordt aangesteld.
    url: https://wetten.overheid.nl/BWBR0033512/2013-06-01#Artikel4
  - number: '4.4'
    text: De secretaris-generaal kan een beveiligingscoördinator aanstellen voor een dienstonderdeel.
    url: https://wetten.overheid.nl/BWBR0033512/2013-06-01#Artikel4
  - number: '4.5'
    text: De departementale beveiligingsambtenaar wordt functioneel aangestuurd door de rijksbeveiligingsambtenaar.
    url: https://wetten.overheid.nl/BWBR0033512/2013-06-01#Artikel4
  - number: '4.6'
    text: |-
      De beveiligingsambtenaar rapporteert periodiek over de stand van de departementale integrale beveiliging aan zijn
      secretaris-generaal en informeert hierover periodiek de rijksbeveiligingsambtenaar.
    url: https://wetten.overheid.nl/BWBR0033512/2013-06-01#Artikel4
  - number: '4.7'
    text: |-
      De departementale beveiligingsambtenaar kan namens de secretaris-generaal aanwijzingen geven aan iedere ambtenaar
      binnen zijn departement voor zover dat noodzakelijk is voor de uitvoering van het integrale beveiligingsbeleid en
      de naleving van de beveiligingsvoorschriften.
    url: https://wetten.overheid.nl/BWBR0033512/2013-06-01#Artikel4
  - number: '5.1'
    text: |-
      Binnen het geheel aan kaders is de lijnmanager verantwoordelijk voor de integrale beveiliging van zijn
      organisatie(onderdeel), de inrichting en werking van de organisatie daarvan, evenals de zorg voor en de beveiliging
      van het te beschermen belang die aan zijn onderdeel is toevertrouwd.
    url: https://wetten.overheid.nl/BWBR0033512/2013-06-01#Artikel5
  - number: '5.2'
    text: |-
      De lijnmanagemer is verantwoordelijk voor het treffen van maatregelen voor de integrale beveiliging van het te
      beschermen belang op basis van risicomanagement.
    url: https://wetten.overheid.nl/BWBR0033512/2013-06-01#Artikel5
  - number: '6.1'
    text: |-
      Het [Beveiligingsvoorschrift 2005][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0019196
    url: https://wetten.overheid.nl/BWBR0033512/2013-06-01#Artikel6
