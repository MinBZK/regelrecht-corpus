preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is nieuwe regels te stellen inzake de financiële
    verhouding tussen het Rijk en de gemeenten;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0008290/2005-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. Onze Ministers: Onze Minister van Binnenlandse Zaken en Onze Minister van Financiën;

      b. uitkeringsjaar: het kalenderjaar waarover het recht op uitkering ontstaat.
    url: https://wetten.overheid.nl/BWBR0008290/2005-07-01#Artikel1
  - number: '2'
    text: |-
      1 Indien beleidsvoornemens van het Rijk leiden tot een wijziging van de uitoefening van taken of activiteiten door
      provincies of gemeenten, wordt in een afzonderlijk onderdeel van de bijbehorende toelichting met redenen omkleed
      en met kwantitatieve gegevens gestaafd, welke de financiële gevolgen van deze wijziging voor de provincies of
      gemeenten zijn.

      2 In de toelichting wordt tevens aangegeven via welke bekostigingswijze de financiële gevolgen voor de provincies
      of gemeenten kunnen worden opgevangen.

      3 Over de toepassing van het eerste en tweede lid vindt tijdig overleg plaats met Onze Ministers.
    url: https://wetten.overheid.nl/BWBR0008290/2005-07-01#Artikel2
  - number: '3'
    text: |-
      1 Er is een provinciefonds en een gemeentefonds. De fondsen zijn begrotingsfondsen.

      2 Onze Ministers beheren de begroting van de fondsen.
    url: https://wetten.overheid.nl/BWBR0008290/2005-07-01#Artikel3
  - number: '4'
    text: |-
      1 Bij wet wordt ten aanzien van ieder uitkeringsjaar een bedrag aan middelen van het Rijk ten behoeve van elk van
      de fondsen afgezonderd.

      2 De uitgaven en de ontvangsten van de fondsen zijn over ieder uitkeringsjaar aan elkaar gelijk.
    url: https://wetten.overheid.nl/BWBR0008290/2005-07-01#Artikel4
  - number: '5'
    text: |-
      1 De begroting van het provinciefonds vermeldt het bedrag dat als verplichting geldt voor het totaal van de
      algemene uitkeringen. De begroting van het gemeentefonds vermeldt het bedrag dat als verplichting geldt voor het
      totaal van de algemene uitkeringen en de aanvullende uitkeringen.

      2 In de begroting van elk van de fondsen kunnen tijdelijk bedragen als verplichting worden opgenomen, om aan
      provincies of gemeenten te worden uitgekeerd op een andere wijze dan door middel van de algemene uitkering.

      3 In de begroting van elk van de fondsen kan een voorziening worden getroffen voor de uitbetaling van specifieke
      uitkeringen aan provincies of gemeenten waarbij meer dan één departement financieel is betrokken.
    url: https://wetten.overheid.nl/BWBR0008290/2005-07-01#Artikel5
  - number: '6'
    text: |-
      1 Een provincie heeft over ieder uitkeringsjaar recht op een algemene uitkering uit het provinciefonds. Een
      gemeente heeft over ieder uitkeringsjaar recht op een algemene uitkering uit het gemeentefonds.

      2 De uitkering komt ten goede aan de algemene middelen van de provincie of van de gemeente.

      3 De provincies hebben gezamenlijk over een uitkeringsjaar recht op het in de begroting van het provinciefonds
      vermelde bedrag, bedoeld in [artikel 5, eerste lid][ref1], voor dat jaar.

      4 De gemeenten hebben gezamenlijk over een uitkeringsjaar recht op het in de begroting van het gemeentefonds
      vermelde bedrag, bedoeld in [artikel 5, eerste lid][ref2], voor dat jaar, verminderd met het totaal aan
      verplichtingen voor aanvullende uitkeringen die over het uitkeringsjaar worden aangegaan.


      [ref1]: https://wetten.overheid.nl/BWBR0008290#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0008290#Artikel5
    url: https://wetten.overheid.nl/BWBR0008290/2005-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0008290
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0008290
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '7'
    text: |-
      De verdeling over de provincies en gemeenten van het voor de algemene uitkeringen beschikbare bedrag houdt rekening
      met de verschillen tussen de provincies onderling en de gemeenten onderling in het vermogen tot het voorzien in
      eigen inkomsten en met de verschillen in noodzakelijke uitgaven.
    url: https://wetten.overheid.nl/BWBR0008290/2005-07-01#Artikel7
  - number: '8'
    text: |-
      1 Ten behoeve van de verdeling van het provinciefonds en het gemeentefonds worden verdeelmaatstaven gehanteerd.
      De maatstaven hebben slechts betrekking op de kenmerken die zijn vermeld in de navolgende tabellen A en B. Bij een
      kenmerk worden ten minste de in de tabellen vermelde onderscheidingen aangebracht.



