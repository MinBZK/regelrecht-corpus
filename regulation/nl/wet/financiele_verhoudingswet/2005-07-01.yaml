      2 De belastingcapaciteit ter zake van woningen, bedoeld in tabel B onder a, wordt slechts voor 80% in de
      verdeelmaatstaf betrokken. De belastingcapaciteit ter zake van niet-woningen wordt slechts voor 70% in de
      verdeelmaatstaf betrokken.

      3 Bij algemene maatregel van bestuur wordt bepaald welke verdeelmaatstaven worden gehanteerd en hoe deze worden
      gehanteerd. Krachtens de maatregel kunnen nadere voorschriften worden gegeven omtrent de toepassing van de bij de
      bepaling gebruikte begrippen en omtrent de wijze van telling van het aantal eenheden per verdeelmaatstaf.

      4 Een krachtens het derde lid vastgestelde algemene maatregel van bestuur treedt niet eerder in werking dan acht
      weken na de datum van uitgifte van het *Staatsblad* waarin hij is geplaatst. Van de plaatsing wordt onverwijld
      mededeling gedaan aan de beide kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0008290/2005-07-01#Artikel8
  - number: '9'
    text: |-
      1 Ten behoeve van de verdeling stellen Onze Ministers over ieder uitkeringsjaar bedragen per eenheid vast die
      behoren bij de verdeelmaatstaven.

      2 Op de voorbereiding van de vaststelling is [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0008290/2005-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: '10'
    text: |-
      Onze Ministers stellen over ieder uitkeringsjaar de algemene uitkeringen aan de provincies en de gemeenten vast.
      Zij verdelen daartoe het voor de algemene uitkeringen in het provinciefonds beschikbare bedrag onder de provincies
      en het voor de algemene uitkeringen in het gemeentefonds beschikbare bedrag onder de gemeenten naar rato van de
      uitkeringsbases.
    url: https://wetten.overheid.nl/BWBR0008290/2005-07-01#Artikel10
  - number: '11'
    text: |-
      De in [artikel 10][ref1] bedoelde uitkeringsbasis voor een provincie of gemeente is de som van de produkten die
      worden verkregen door voor iedere verdeelmaatstaf het aantal eenheden van die maatstaf te vermenigvuldigen met het
      bij de maatstaf behorende bedrag per eenheid.


      [ref1]: https://wetten.overheid.nl/BWBR0008290#Artikel10
    url: https://wetten.overheid.nl/BWBR0008290/2005-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0008290
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '12'
    text: |-
      1 Onze Ministers kunnen, op aanvraag van een gemeente, aan de gemeente over een uitkeringsjaar een aanvullende
      uitkering verlenen.

      2 Een aanvullende uitkering wordt slechts verleend indien de algemene middelen van de gemeente aanmerkelijk en
      structureel tekort zullen schieten om in de noodzakelijke behoeften te voorzien, terwijl de eigen inkomsten van de
      gemeente zich op een redelijk peil bevinden.

      3 Onze Ministers kunnen voorschriften verbinden aan het besluit tot verlening van een aanvullende uitkering.

      4 Onze Ministers kunnen een verleende aanvullende uitkering verminderen of intrekken indien:

      a. de financiële positie van de gemeente verbetert;

      b. de gemeente in strijd handelt met een wettelijk voorschrift dat betrekking heeft op de aanvullende uitkering, of
      met een voorschrift dat aan het besluit tot verlening van de aanvullende uitkering is verbonden.

      5 De gemeente die een aanvullende uitkering heeft aangevraagd, of waaraan een aanvullende uitkering is verleend,
      neemt maatregelen ter verbetering van haar financiële positie.
    url: https://wetten.overheid.nl/BWBR0008290/2005-07-01#Artikel12
  - number: '13'
    text: |-
      1 De verdeling van de in [artikel 5, tweede lid][ref1], bedoelde bedragen wordt bij algemene maatregel van bestuur
      geregeld. Krachtens de maatregel kan de verdeling nader worden bepaald.

      2 De uitkering komt ten goede aan de algemene middelen van de provincie of gemeente.

      3 Bij de maatregel wordt bepaald binnen welke termijn de uitkering wordt opgenomen in de algemene uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0008290#Artikel5
    url: https://wetten.overheid.nl/BWBR0008290/2005-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0008290
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '14'
    text: |-
      De uitkeringen, bedoeld in [artikel 5, derde lid][ref1], worden vastgesteld door Onze Ministers wie het aangaat.


      [ref1]: https://wetten.overheid.nl/BWBR0008290#Artikel5
    url: https://wetten.overheid.nl/BWBR0008290/2005-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0008290
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '15'
    text: |-
      1 Onze Ministers doen betalingen uit de fondsen aan de provincies en de gemeenten, zo nodig vooruitlopend op de
      vaststelling van de uitkeringen over het uitkeringsjaar.

      2 Indien de over enig uitkeringsjaar verrichte betalingen aan een provincie of gemeente hoger of lager zijn dan
      de over dat jaar voor de provincie of gemeente vastgestelde uitkeringen, wordt het verschil teruggevorderd of
      uitbetaald.
    url: https://wetten.overheid.nl/BWBR0008290/2005-07-01#Artikel15
  - number: '16'
    text: |-
      1 Aan provincies en gemeenten kunnen uit ’s Rijks kas specifieke uitkeringen worden verstrekt voor de bestrijding
      van in de regeling van de uitkering aangeduide kosten van provincies en gemeenten.

      2 Specifieke uitkeringen worden slechts verstrekt als deze wijze van bekostiging van provinciale of gemeentelijke
      taken bijzonder aangewezen moet worden geacht.
    url: https://wetten.overheid.nl/BWBR0008290/2005-07-01#Artikel16
  - number: '17'
    text: |-
      1 Specifieke uitkeringen worden geregeld bij of krachtens de wet.

      2 Het eerste lid is niet van toepassing in de gevallen, bedoeld in
      [artikel 4:23, derde lid, van de Algemene wet bestuursrecht][ref1], met dien verstande dat in de gevallen, bedoeld
      in [artikel 4:23, derde lid, onderdeel a, van de Algemene wet bestuursrecht][ref2] de specifieke uitkering wordt
      geregeld bij ministeriële regeling.

      3 Tijdelijke specifieke uitkeringen kunnen worden geregeld bij algemene maatregel van bestuur. Krachtens de
      maatregel kan de verdeling van de uitkering nader worden bepaald.

      4 Een algemene maatregel van bestuur als bedoeld in het derde lid vervalt vier jaren nadat hij in werking is
      getreden, tenzij voor dat tijdstip een voorstel van wet bij de Staten-Generaal is ingediend waarin de specifieke
      uitkering wordt geregeld.

      5 Eenmalige specifieke uitkeringen kunnen worden geregeld bij ministeriële regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel423
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel423
    url: https://wetten.overheid.nl/BWBR0008290/2005-07-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:23
      - id: ref2
        bwb_id: BWBR0005537
        artikel: 4:23
  - number: '18'
    text: Omtrent een voorstel tot regeling van een specifieke uitkering vindt tijdig overleg plaats met Onze Ministers.
    url: https://wetten.overheid.nl/BWBR0008290/2005-07-01#Artikel18
  - number: '19'
    text: |-
      De [artikelen 117, eerste lid, van de Provinciewet][ref1] en 119, eerste lid, van de [Gemeentewet][ref2] zijn niet
      van toepassing op de regeling van de informatievoorziening ten aanzien van een specifieke uitkering als bedoeld in
      [artikel 17, derde en vijfde lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel117
      [ref2]: https://wetten.overheid.nl/BWBR0005416
      [ref3]: https://wetten.overheid.nl/BWBR0008290#Artikel17
    url: https://wetten.overheid.nl/BWBR0008290/2005-07-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '117'
      - id: ref2
        bwb_id: BWBR0005416
      - id: ref3
        bwb_id: BWBR0008290
        artikel: '17'
        hoofdstuk: '3'
  - number: '20'
    text: Onze Ministers publiceren jaarlijks voor 1 oktober een overzicht van de specifieke uitkeringen.
    url: https://wetten.overheid.nl/BWBR0008290/2005-07-01#Artikel20
  - number: '21'
    text: |-
      De [artikelen 16][ref1] en [18 tot en met 20][ref2] zijn van overeenkomstige toepassing op uitkeringen uit ’s Rijks
      kas aan derden, ter bekostiging van activiteiten van die derden, waarbij de verstrekking afhankelijk is van de
      verstrekking van een uitkering door provincies of gemeenten aan die derden.


      [ref1]: https://wetten.overheid.nl/BWBR0008290#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0008290#Artikel18
    url: https://wetten.overheid.nl/BWBR0008290/2005-07-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0008290
        artikel: '16'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0008290
        artikel: '18'
        hoofdstuk: '3'
  - number: '22'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent:

      a. de toepassing van de in deze wet gehanteerde begrippen;

      b. de procedure tot vaststelling en verstrekking van uitkeringen als bedoeld in deze wet;

      c. het verzamelen en vaststellen van gegevens ten behoeve van uitkeringen;

      d. het doen van mededelingen en het verschaffen van inlichtingen in verband met de vaststelling en verstrekking
      van uitkeringen.
    url: https://wetten.overheid.nl/BWBR0008290/2005-07-01#Artikel22
  - number: '23'
    text: Op een uitkering als bedoeld in deze wet kan geen beslag onder de Staat worden gelegd.
    url: https://wetten.overheid.nl/BWBR0008290/2005-07-01#Artikel23
  - number: '24'
    text: |-
      1 In afwijking van [artikel 8, derde lid][ref1], wordt voor de eerste maal bij wet bepaald welke verdeelmaatstaven
      worden gehanteerd en hoe deze worden gehanteerd. Krachtens die wet, bij regeling van Onze Ministers, kunnen nadere
      voorschriften worden gegeven omtrent de toepassing van de bij de bepaling gebruikte begrippen en omtrent de wijze
      van telling van het aantal eenheden per verdeelmaatstaf.

      2 In afwijking van [artikel 9, eerste lid][ref2], worden de bedragen per eenheid behorend bij de in het eerste
      lid bedoelde maatstaven, over het eerste uitkeringsjaar bij wet vastgesteld. Daarbij kan worden bepaald dat Onze
      Ministers deze bedragen aan kunnen passen in verband met wijzigingen ten aanzien van het fonds over de jaren 1996
      en 1997, die door middel van wijzigingen in de bedragen per eenheid over de gemeenten verdeeld behoren te worden.
      Artikel 9, tweede lid, blijft buiten toepassing bij de vaststelling van de bedragen per eenheid over het eerste
      uitkeringsjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0008290#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0008290#Artikel9
    url: https://wetten.overheid.nl/BWBR0008290/2005-07-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0008290
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0008290
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '25'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0008290/2005-07-01#Artikel25
  - number: '26'
    text: 'Deze wet wordt aangehaald als: Financiële-verhoudingswet.'
    url: https://wetten.overheid.nl/BWBR0008290/2005-07-01#Artikel26
