                    f Tijdelijke ondersteuning van gemeenten in verband met herindeling
    url: https://wetten.overheid.nl/BWBR0008290/2014-02-22#Artikel8
  - number: '8.2'
    text: |-
      De belastingcapaciteit ter zake van woningen, bedoeld in tabel B onder a, wordt slechts voor 80% in de
      verdeelmaatstaf betrokken. De belastingcapaciteit ter zake van niet-woningen wordt slechts voor 70% in de
      verdeelmaatstaf betrokken.
    url: https://wetten.overheid.nl/BWBR0008290/2014-02-22#Artikel8
  - number: '8.3'
    text: |-
      Bij algemene maatregel van bestuur wordt bepaald welke verdeelmaatstaven worden gehanteerd en hoe deze worden
      gehanteerd. Krachtens de maatregel kunnen nadere voorschriften worden gegeven omtrent de toepassing van de bij de
      bepaling gebruikte begrippen en omtrent de wijze van telling van het aantal eenheden per verdeelmaatstaf.
    url: https://wetten.overheid.nl/BWBR0008290/2014-02-22#Artikel8
  - number: '8.4'
    text: |-
      Een krachtens het derde lid vastgestelde algemene maatregel van bestuur treedt niet eerder in werking dan acht
      weken na de datum van uitgifte van het *Staatsblad* waarin hij is geplaatst. Van de plaatsing wordt onverwijld
      mededeling gedaan aan de beide kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0008290/2014-02-22#Artikel8
  - number: '9.1'
    text: |-
      Ten behoeve van de verdeling stellen Onze Ministers over ieder uitkeringsjaar bedragen per eenheid vast die behoren
      bij de verdeelmaatstaven.
    url: https://wetten.overheid.nl/BWBR0008290/2014-02-22#Artikel9
  - number: '9.2'
    text: |-
      Op de voorbereiding van de vaststelling is [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0008290/2014-02-22#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: '10'
    text: |-
      Onze Ministers stellen over ieder uitkeringsjaar de algemene uitkeringen aan de provincies en de gemeenten vast.
      Zij verdelen daartoe het voor de algemene uitkeringen in het provinciefonds beschikbare bedrag onder de provincies
      en het voor de algemene uitkeringen in het gemeentefonds beschikbare bedrag onder de gemeenten naar rato van de
      uitkeringsbases.
    url: https://wetten.overheid.nl/BWBR0008290/2014-02-22#Artikel10
  - number: '11'
    text: |-
      De in [artikel 10][ref1] bedoelde uitkeringsbasis voor een provincie of gemeente is de som van de produkten die
      worden verkregen door voor iedere verdeelmaatstaf het aantal eenheden van die maatstaf te vermenigvuldigen met het
      bij de maatstaf behorende bedrag per eenheid.


      [ref1]: https://wetten.overheid.nl/BWBR0008290#Artikel10
    url: https://wetten.overheid.nl/BWBR0008290/2014-02-22#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0008290
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '12.1'
    text: |-
      Onze Ministers kunnen op verzoek van de gemeenteraad de gemeente over een uitkeringsjaar een aanvullende uitkering
      verlenen.
    url: https://wetten.overheid.nl/BWBR0008290/2014-02-22#Artikel12
  - number: '12.2'
    text: |-
      Een aanvullende uitkering wordt slechts verleend indien de algemene middelen van de gemeente aanmerkelijk en
      structureel tekort zullen schieten om in de noodzakelijke behoeften te voorzien, terwijl de eigen inkomsten van de
      gemeente zich op een redelijk peil bevinden.
    url: https://wetten.overheid.nl/BWBR0008290/2014-02-22#Artikel12
  - number: '12.3'
    text: Onze Ministers kunnen voorschriften verbinden aan het besluit tot verlening van een aanvullende uitkering.
    url: https://wetten.overheid.nl/BWBR0008290/2014-02-22#Artikel12
  - number: '12.4'
    text: 'Onze Ministers kunnen een verleende aanvullende uitkering verminderen of intrekken indien:'
    url: https://wetten.overheid.nl/BWBR0008290/2014-02-22#Artikel12
  - number: 12.4.a
    text: de financiële positie van de gemeente verbetert;
    url: https://wetten.overheid.nl/BWBR0008290/2014-02-22#Artikel12
  - number: 12.4.b
    text: |-
      de gemeente in strijd handelt met een wettelijk voorschrift dat betrekking heeft op de aanvullende uitkering, of
      met een voorschrift dat aan het besluit tot verlening van de aanvullende uitkering is verbonden.
    url: https://wetten.overheid.nl/BWBR0008290/2014-02-22#Artikel12
  - number: '12.5'
    text: |-
      De gemeente die een aanvullende uitkering heeft aangevraagd, of waaraan een aanvullende uitkering is verleend,
      neemt maatregelen ter verbetering van haar financiële positie.
    url: https://wetten.overheid.nl/BWBR0008290/2014-02-22#Artikel12
  - number: '13.1'
    text: |-
      De verdeling van de in [artikel 5, tweede lid][ref1], bedoelde uitkeringen wordt bij algemene maatregel van bestuur
      geregeld. Krachtens de maatregel kunnen nadere regels worden gesteld over de wijze van verdeling en de wijze van
      vaststellen van het volume.


      [ref1]: https://wetten.overheid.nl/BWBR0008290#Artikel5
    url: https://wetten.overheid.nl/BWBR0008290/2014-02-22#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0008290
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '13.2'
    text: De uitkeringen, bedoeld in het eerste lid, komen ten goede aan de algemene middelen van de provincie of gemeente.
    url: https://wetten.overheid.nl/BWBR0008290/2014-02-22#Artikel13
  - number: '13.3'
    text: Integratie-uitkeringen worden binnen een bij de maatregel te bepalen termijn in de algemene uitkering opgenomen.
    url: https://wetten.overheid.nl/BWBR0008290/2014-02-22#Artikel13
  - number: '13.4'
    text: |-
      Een decentralisatie-uitkering is een uitkering waarbij geen termijn van de overgang van de uitkering naar de
      algemene uitkering is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0008290/2014-02-22#Artikel13
  - number: '13.5'
    text: |-
      Jaarlijks bezien Onze Ministers na overleg met Onze Ministers wie het aangaat of een decentralisatie-uitkering kan
      worden gewijzigd in een integratie-uitkering of een algemene uitkering en doen daarvan verslag in de toelichting op
      de begrotingen van het provinciefonds en van het gemeentefonds.
    url: https://wetten.overheid.nl/BWBR0008290/2014-02-22#Artikel13
  - number: '14'
    text: |-
      De uitkeringen, bedoeld in [artikel 5, derde lid][ref1], worden vastgesteld door Onze Ministers wie het aangaat.


      [ref1]: https://wetten.overheid.nl/BWBR0008290#Artikel5
    url: https://wetten.overheid.nl/BWBR0008290/2014-02-22#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0008290
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '15.1'
    text: |-
      Onze Ministers doen betalingen uit de fondsen aan de provincies en de gemeenten, zo nodig vooruitlopend op de
      vaststelling van de uitkeringen over het uitkeringsjaar.
    url: https://wetten.overheid.nl/BWBR0008290/2014-02-22#Artikel15
  - number: '15.2'
    text: |-
      Indien de over enig uitkeringsjaar verrichte betalingen aan een provincie of gemeente hoger of lager zijn dan
      de over dat jaar voor de provincie of gemeente vastgestelde uitkeringen, wordt het verschil teruggevorderd of
      uitbetaald.
    url: https://wetten.overheid.nl/BWBR0008290/2014-02-22#Artikel15
  - number: 15a.1
    text: |-
      Elke bijdrage uit ‘s Rijks kas die door of vanwege Onze Minister wie het aangaat onder voorwaarden ten behoeve van
      een bepaald openbaar belang aan provincies en gemeenten wordt verstrekt, is een specifieke uitkering.
    url: https://wetten.overheid.nl/BWBR0008290/2014-02-22#Artikel15a
  - number: 15a.2
    text: |-
      Indien provincies of gemeenten optreden als marktpartij of werkgever, of als eigenaar of huurder van een roerende
      of onroerende zaak, en onder dezelfde voorwaarden als andere natuurlijke personen en rechtspersonen, niet zijnde
      medeoverheden, voor een bijdrage uit ‘s Rijks kas in aanmerking komen, is die bijdrage geen specifieke uitkering.
    url: https://wetten.overheid.nl/BWBR0008290/2014-02-22#Artikel15a
  - number: 15a.3
    text: |-
      Bijdragen uit ‘s Rijks kas aan provincies en gemeenten ten behoeve van een bepaald openbaar belang waarvoor een
      bedrag beschikbaar is, dat lager is dan een bij algemene maatregel van bestuur op voordracht van Onze Minister van
      Binnenlandse Zaken en Koninkrijksrelaties vastgesteld bedrag, kunnen slechts worden verstrekt als onderdeel van
      een verzameluitkering.
    url: https://wetten.overheid.nl/BWBR0008290/2014-02-22#Artikel15a
  - number: '16.1'
    text: |-
      Specifieke uitkeringen kunnen worden verstrekt voor de bestrijding van in de regeling van de uitkering aangeduide
      kosten van de ontvangers.
    url: https://wetten.overheid.nl/BWBR0008290/2014-02-22#Artikel16
  - number: '16.2'
    text: |-
      Specifieke uitkeringen worden slechts verstrekt als deze wijze van bekostiging van provinciale of gemeentelijke
      taken bijzonder aangewezen moet worden geacht.
    url: https://wetten.overheid.nl/BWBR0008290/2014-02-22#Artikel16
  - number: 16a.1
    text: |-
      Een verzameluitkering is een specifieke uitkering aan provincies en gemeenten per ministerie waarin bedragen voor
      beleidsthema’s zijn opgenomen.
    url: https://wetten.overheid.nl/BWBR0008290/2014-02-22#Artikel16a
  - number: 16a.2
    text: |-
      Bedragen ten behoeve van een verzameluitkering worden opgenomen in het begrotingsartikel, genoemd in
      [artikel 6, eerste lid, onder a, van de Comptabiliteitswet 2001][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel6
    url: https://wetten.overheid.nl/BWBR0008290/2014-02-22#Artikel16a
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '6'
  - number: 16a.3
    text: |-
      Een begroting als bedoeld in [artikel 1, onderdelen a en b, van de Comptabiliteitswet 2001][ref1] bevat niet meer
      dan één verzameluitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel1
    url: https://wetten.overheid.nl/BWBR0008290/2014-02-22#Artikel16a
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '1'
  - number: 16a.4
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties is belast met de verstrekking, de verlening, de
      vaststelling en de terugvordering van de verzameluitkeringen. Bij de verstrekking van een verzameluitkering wordt
      vermeld ter zake van welke beleidsthema’s de uitkering wordt verstrekt, en wat de verdeling is per beleidsthema.
    url: https://wetten.overheid.nl/BWBR0008290/2014-02-22#Artikel16a
  - number: 16a.5
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties kan bij ministeriële regeling nadere regels stellen
      over de verstrekking, de verlening, waaronder de bevoorschotting, de vaststelling en de terugvordering van de
      verzameluitkeringen.
    url: https://wetten.overheid.nl/BWBR0008290/2014-02-22#Artikel16a
  - number: 16a.6
    text: |-
      De verzameluitkering wordt besteed binnen de doelstellingen van het ministerie, bedoeld in
      [artikel 5, eerste lid, onder a, van de Comptabiliteitswet 2001][ref1]. De informatie ten behoeve van de
      verantwoording betreft het totaal bestede bedrag per verzameluitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel5
    url: https://wetten.overheid.nl/BWBR0008290/2014-02-22#Artikel16a
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '5'
  - number: '17.1'
    text: Specifieke uitkeringen worden geregeld bij of krachtens de wet.
    url: https://wetten.overheid.nl/BWBR0008290/2014-02-22#Artikel17
  - number: '17.2'
    text: |-
      Het eerste lid is niet van toepassing in de gevallen, bedoeld in
      [artikel 4:23, derde lid, van de Algemene wet bestuursrecht][ref1], met dien verstande dat in de gevallen, bedoeld
      in [artikel 4:23, derde lid, onderdeel a, van de Algemene wet bestuursrecht][ref2] de specifieke uitkering wordt
      geregeld bij ministeriële regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0008290/2014-02-22#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '17.3'
    text: |-
      Tijdelijke specifieke uitkeringen kunnen worden geregeld bij algemene maatregel van bestuur. Krachtens de maatregel
      kan de verdeling van de uitkering nader worden bepaald.
    url: https://wetten.overheid.nl/BWBR0008290/2014-02-22#Artikel17
  - number: '17.4'
    text: |-
      Een algemene maatregel van bestuur als bedoeld in het derde lid vervalt vier jaren nadat hij in werking is
      getreden, tenzij voor dat tijdstip een voorstel van wet bij de Staten-Generaal is ingediend waarin de specifieke
      uitkering wordt geregeld.
    url: https://wetten.overheid.nl/BWBR0008290/2014-02-22#Artikel17
  - number: '17.5'
    text: Eenmalige specifieke uitkeringen kunnen worden geregeld bij ministeriële regeling.
    url: https://wetten.overheid.nl/BWBR0008290/2014-02-22#Artikel17
  - number: 17a.1
    text: |-
      Gedeputeerde staten en het college van burgemeester en wethouders zenden de informatie ten behoeve van de
      verantwoording over de uitvoering van de regeling van een specifieke uitkering uiterlijk 15 juli van het jaar
      volgend op het begrotingsjaar aan Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties in de vorm van:
    url: https://wetten.overheid.nl/BWBR0008290/2014-02-22#Artikel17a
  - number: 17a.1.a
    text: |-
      de jaarrekening en het jaarverslag, bedoeld in [artikel 202, eerste lid, van de Provinciewet][ref1],
      onderscheidenlijk [artikel 198, eerste lid, van de Gemeentewet][ref2], en


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel202
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel198
    url: https://wetten.overheid.nl/BWBR0008290/2014-02-22#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '202'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '198'
  - number: 17a.1.b
    text: |-
      de accountantsverklaring en het verslag van bevindingen, bedoeld in
      [artikel 217, derde en vierde lid, van de Provinciewet][ref1], onderscheidenlijk
      [artikel 213, derde en vierde lid, van de Gemeentewet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel217
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel213
    url: https://wetten.overheid.nl/BWBR0008290/2014-02-22#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '217'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '213'
  - number: 17a.2
    text: |-
      Indien provincies en gemeenten van elkaar middelen ontvangen die afkomstig zijn uit een specifieke uitkering,
      verstrekken zij de informatie, bedoeld in het eerste lid, aan Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties.
    url: https://wetten.overheid.nl/BWBR0008290/2014-02-22#Artikel17a
  - number: 17a.3
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties stelt bij ministeriële regeling nadere regels over het
      verstrekken van de in het eerste lid bedoelde informatie.
    url: https://wetten.overheid.nl/BWBR0008290/2014-02-22#Artikel17a
  - number: 17a.4
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties brengt de informatie betreffende de specifieke
      uitkeringen onverwijld ter kennis van Onze Ministers en de bestuursorganen wie het aangaat.
    url: https://wetten.overheid.nl/BWBR0008290/2014-02-22#Artikel17a
  - number: 17a.5
    text: |-
      Gedeputeerde staten en het college van burgemeester en wethouders verstrekken desgevraagd
      inlichtingen over de besteding van een specifieke uitkering aan de door Onze Minister
      wie het aangaat daartoe aangewezen ambtenaren van de accountantsdienst, bedoeld in
      [artikel 66, eerste lid, van de Comptabiliteitswet 2001][ref1]. De ambtenaren van de accountantsdienst kunnen
      tevens informatie inwinnen bij de in [artikel 217, tweede lid, van de Provinciewet][ref2] onderscheidenlijk
      [artikel 213, tweede lid, van de Gemeentewet][ref3] bedoelde accountants.


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel66
      [ref2]: https://wetten.overheid.nl/BWBR0005645#Artikel217
      [ref3]: https://wetten.overheid.nl/BWBR0005416#Artikel213
    url: https://wetten.overheid.nl/BWBR0008290/2014-02-22#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '66'
      - id: ref2
        bwb_id: BWBR0005645
        artikel: '217'
      - id: ref3
        bwb_id: BWBR0005416
        artikel: '213'
  - number: 17a.6
    text: 'Dit artikel is niet van toepassing:'
    url: https://wetten.overheid.nl/BWBR0008290/2014-02-22#Artikel17a
  - number: 17a.6.a
    text: |-
      indien de voorwaarden inzake het verstrekken van een Europese subsidie als bedoeld in
      [artikel 1, onderdeel f, van de Wet Naleving Europese regelgeving publieke entiteiten][ref1] anders verplichten,
      voor zover die subsidies worden verstrekt door tussenkomst van ’s Rijks kas;


      [ref1]: https://wetten.overheid.nl/BWBR0031640#Artikel1
    url: https://wetten.overheid.nl/BWBR0008290/2014-02-22#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0031640
        artikel: '1'
  - number: 17a.6.b
    text: |-
      indien de specifieke uitkering is verstrekt aan een gemeente in de hoedanigheid van bevoegd gezag van een openbare
      school;
    url: https://wetten.overheid.nl/BWBR0008290/2014-02-22#Artikel17a
  - number: 17a.6.c
    text: |-
      op het investeringsbudget, bedoeld in de [Wet inrichting landelijk gebied][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020748
    url: https://wetten.overheid.nl/BWBR0008290/2014-02-22#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0020748
  - number: 17a.6.d
    text: |-
      op cofinanciering door het Rijk als bedoeld in [artikel 1, onderdeel g, van de Uitvoeringswet EFRO][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0034784#Artikel1
    url: https://wetten.overheid.nl/BWBR0008290/2014-02-22#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0034784
        artikel: '1'
  - number: 17b.1
    text: |-
      Indien Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties vaststelt dat de informatie, bedoeld
      in [artikel 17a, eerste lid][ref1], niet is verstrekt op de wijze zoals voorgeschreven op grond van het
      [derde lid van artikel 17a][ref2], doet hij daarvan mededeling aan gedeputeerde staten of het college van
      burgemeester en wethouders.


      [ref1]: https://wetten.overheid.nl/BWBR0008290#Artikel17a
      [ref2]: https://wetten.overheid.nl/BWBR0008290#Artikel17a
    url: https://wetten.overheid.nl/BWBR0008290/2014-02-22#Artikel17b
    references:
      - id: ref1
        bwb_id: BWBR0008290
        artikel: 17a
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0008290
        artikel: 17a
        hoofdstuk: '3'
  - number: 17b.2
    text: |-
      Gedeputeerde staten en het college van burgemeester en wethouders kunnen voor 1 juli van het jaar volgend op het
      begrotingsjaar, schriftelijk en met redenen omkleed aan Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties
      verzoeken om uitstel van de toezending van de in [artikel 17a, eerste lid][ref1], bedoelde informatie. Hij beslist
      binnen twee weken op dat verzoek, na overleg met Onze Ministers wie het aangaat.


      [ref1]: https://wetten.overheid.nl/BWBR0008290#Artikel17a
    url: https://wetten.overheid.nl/BWBR0008290/2014-02-22#Artikel17b
    references:
      - id: ref1
        bwb_id: BWBR0008290
        artikel: 17a
        hoofdstuk: '3'
  - number: 17b.3
    text: |-
      Onze Ministers kunnen de betalingen op grond van [artikel 15, eerste lid][ref1], aan de betreffende provincie of
      gemeente geheel of gedeeltelijk opschorten gedurende ten hoogste zesentwintig weken indien:


      [ref1]: https://wetten.overheid.nl/BWBR0008290#Artikel15
    url: https://wetten.overheid.nl/BWBR0008290/2014-02-22#Artikel17b
    references:
      - id: ref1
        bwb_id: BWBR0008290
        artikel: '15'
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: 17b.3.a
    text: |-
      gedeputeerde staten en het college van burgemeester en wethouders nalaten de informatie, bedoeld in
      [artikel 17a, eerste lid][ref1], aan Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties te zenden binnen
      de in dat artikellid genoemde termijn, dan wel, als uitstel is verleend, binnen de termijn waarvoor uitstel is
      verleend, of


      [ref1]: https://wetten.overheid.nl/BWBR0008290#Artikel17a
    url: https://wetten.overheid.nl/BWBR0008290/2014-02-22#Artikel17b
    references:
      - id: ref1
        bwb_id: BWBR0008290
        artikel: 17a
        hoofdstuk: '3'
  - number: 17b.3.b
    text: |-
      de informatie, bedoeld in [artikel 17a, eerste lid][ref1], na het verstrijken van de voorgeschreven termijn, niet
      is verstrekt op de wijze zoals voorgeschreven krachtens het derde lid van dat artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0008290#Artikel17a
    url: https://wetten.overheid.nl/BWBR0008290/2014-02-22#Artikel17b
    references:
      - id: ref1
        bwb_id: BWBR0008290
        artikel: 17a
        hoofdstuk: '3'
  - number: 17b.4
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties doet terstond mededeling aan het desbetreffende
      bestuursorgaan van een besluit als bedoeld in het derde lid, met vermelding van de mate waarin en de periode
      waarvoor de betalingen ten hoogste geschorst worden. De betalingen worden hervat in de week nadat de informatie is
      verstrekt op de wijze zoals voorgeschreven krachtens het [derde lid van artikel 17a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008290#Artikel17a
    url: https://wetten.overheid.nl/BWBR0008290/2014-02-22#Artikel17b
    references:
      - id: ref1
        bwb_id: BWBR0008290
        artikel: 17a
        hoofdstuk: '3'
  - number: 17b.5
    text: |-
      Gedeputeerde staten en het college van burgemeester en wethouders kunnen na een besluit als bedoeld in het derde
      lid, indien bijzondere omstandigheden daartoe aanleiding geven, schriftelijk en met redenen omkleed aan Onze
      Minister van Binnenlandse Zaken en Koninkrijksrelaties verzoeken om de opschorting ongedaan te maken. Onze Minister
      van Binnenlandse Zaken en Koninkrijksrelaties beslist binnen twee weken op dat verzoek, na overleg met Onze
      Ministers wie het aangaat.
    url: https://wetten.overheid.nl/BWBR0008290/2014-02-22#Artikel17b
  - number: 17b.6
    text: |-
      Als gedeputeerde staten of het college van burgemeester en wethouders de gevraagde informatie binnen de in
      het vierde lid bedoelde periode niet hebben verstrekt of niet op de wijze zoals voorgeschreven krachtens het
      [derde lid van artikel 17a][ref1], doet Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties daarvan
      mededeling aan Onze Minister wie het aangaat.


      [ref1]: https://wetten.overheid.nl/BWBR0008290#Artikel17a
    url: https://wetten.overheid.nl/BWBR0008290/2014-02-22#Artikel17b
    references:
      - id: ref1
        bwb_id: BWBR0008290
        artikel: 17a
        hoofdstuk: '3'
  - number: '18.1'
    text: |-
      Over een voorstel tot regeling van een specifieke uitkering, niet zijnde een verzameluitkering als bedoeld in
      [artikel 16a][ref1], vindt tijdig overleg plaats met Onze Ministers.


      [ref1]: https://wetten.overheid.nl/BWBR0008290#Artikel16a
    url: https://wetten.overheid.nl/BWBR0008290/2014-02-22#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0008290
        artikel: 16a
        hoofdstuk: '3'
  - number: '18.2'
    text: |-
      Onze Ministers wie het aangaat melden zo nodig ter voorbereiding van de indiening van de ontwerp-begrotingen en de
      wijzigingen, bedoeld in [artikel 15, eerste tot en met derde lid, van de Comptabiliteitswet 2001][ref1], aan Onze
      Ministers welke beleidsthema’s door middel van een verzameluitkering worden bekostigd.


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel15
    url: https://wetten.overheid.nl/BWBR0008290/2014-02-22#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '15'
  - number: '19.1'
    text: |-
      De [artikelen 117, eerste lid, van de Provinciewet][ref1] en [119, eerste lid, van de Gemeentewet][ref2] zijn niet
      van toepassing op de regeling van de informatievoorziening ten aanzien van een specifieke uitkering als bedoeld in
      [artikel 17, derde en vijfde lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel117
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel119
      [ref3]: https://wetten.overheid.nl/BWBR0008290#Artikel17
    url: https://wetten.overheid.nl/BWBR0008290/2014-02-22#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '117'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '119'
      - id: ref3
        bwb_id: BWBR0008290
        artikel: '17'
        hoofdstuk: '3'
  - number: '19.2'
    text: |-
      Onze Minister wie het aangaat kan ten behoeve van de uitvoering van zijn beleid beleidsinformatie aan de ontvangers
      van bijdragen uit een verzameluitkering vragen:
    url: https://wetten.overheid.nl/BWBR0008290/2014-02-22#Artikel19
  - number: 19.2.a
    text: voor een meerjarige periode, van alle ontvangers of een selectie van de ontvangers;
    url: https://wetten.overheid.nl/BWBR0008290/2014-02-22#Artikel19
  - number: 19.2.b
    text: jaarlijks van een selectie van de ontvangers of
    url: https://wetten.overheid.nl/BWBR0008290/2014-02-22#Artikel19
  - number: 19.2.c
    text: |-
      na afloop van de looptijd van de regeling op grond waarvan de bijdrage voor het betreffende beleidsthema in de
      verzameluitkering is opgenomen van alle ontvangers of een selectie van de ontvangers.
    url: https://wetten.overheid.nl/BWBR0008290/2014-02-22#Artikel19
  - number: '19.3'
    text: |-
      Over de beleidsinformatie, bedoeld in het tweede lid, wordt geen verklaring of verslag van bevindingen van een
      accountant als bedoeld in [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1] overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0008290/2014-02-22#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '20'
    text: |-
      Uiterlijk op de derde woensdag van mei publiceren Onze Ministers een onderhoudsrapport over de specifieke
      uitkeringen over het voorafgaande jaar.
    url: https://wetten.overheid.nl/BWBR0008290/2014-02-22#Artikel20
  - number: '21'
    text: |-
      De [artikelen 16][ref1] en [18 tot en met 20][ref2] zijn van overeenkomstige toepassing op uitkeringen uit ’s Rijks
      kas aan derden, ter bekostiging van activiteiten van die derden, waarbij de verstrekking afhankelijk is van de
      verstrekking van een uitkering door provincies of gemeenten aan die derden.


      [ref1]: https://wetten.overheid.nl/BWBR0008290#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0008290#Artikel18
    url: https://wetten.overheid.nl/BWBR0008290/2014-02-22#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0008290
        artikel: '16'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0008290
        artikel: '18'
        hoofdstuk: '3'
  - number: '22'
    text: 'Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent:'
    url: https://wetten.overheid.nl/BWBR0008290/2014-02-22#Artikel22
  - number: 22.a
    text: de toepassing van de in deze wet gehanteerde begrippen;
    url: https://wetten.overheid.nl/BWBR0008290/2014-02-22#Artikel22
  - number: 22.b
    text: de procedure tot vaststelling en verstrekking van uitkeringen als bedoeld in deze wet;
    url: https://wetten.overheid.nl/BWBR0008290/2014-02-22#Artikel22
  - number: 22.c
    text: |-
      de betalingen, bedoeld in [artikel 15][ref1] en de opschorting daarvan, bedoeld in
      [artikel 17b, derde, vierde en vijfde lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0008290#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0008290#Artikel17b
    url: https://wetten.overheid.nl/BWBR0008290/2014-02-22#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0008290
        artikel: '15'
        hoofdstuk: '2'
        paragraaf: '2.5'
      - id: ref2
        bwb_id: BWBR0008290
        artikel: 17b
        hoofdstuk: '3'
  - number: 22.d
    text: het verzamelen en vaststellen van gegevens ten behoeve van uitkeringen;
    url: https://wetten.overheid.nl/BWBR0008290/2014-02-22#Artikel22
  - number: 22.e
    text: |-
      het doen van mededelingen en het verschaffen van inlichtingen in verband met de vaststelling en verstrekking van
      uitkeringen.
    url: https://wetten.overheid.nl/BWBR0008290/2014-02-22#Artikel22
  - number: '23'
    text: Op een uitkering als bedoeld in deze wet kan geen beslag onder de Staat worden gelegd.
    url: https://wetten.overheid.nl/BWBR0008290/2014-02-22#Artikel23
  - number: '24.1'
    text: |-
      In afwijking van [artikel 8, derde lid][ref1], wordt voor de eerste maal bij wet bepaald welke verdeelmaatstaven
      worden gehanteerd en hoe deze worden gehanteerd. Krachtens die wet, bij regeling van Onze Ministers, kunnen nadere
      voorschriften worden gegeven omtrent de toepassing van de bij de bepaling gebruikte begrippen en omtrent de wijze
      van telling van het aantal eenheden per verdeelmaatstaf.


      [ref1]: https://wetten.overheid.nl/BWBR0008290#Artikel8
    url: https://wetten.overheid.nl/BWBR0008290/2014-02-22#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0008290
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '24.2'
    text: |-
      In afwijking van [artikel 9, eerste lid][ref1], worden de bedragen per eenheid behorend bij de in het eerste
      lid bedoelde maatstaven, over het eerste uitkeringsjaar bij wet vastgesteld. Daarbij kan worden bepaald dat Onze
      Ministers deze bedragen aan kunnen passen in verband met wijzigingen ten aanzien van het fonds over de jaren 1996
      en 1997, die door middel van wijzigingen in de bedragen per eenheid over de gemeenten verdeeld behoren te worden.
      Artikel 9, tweede lid, blijft buiten toepassing bij de vaststelling van de bedragen per eenheid over het eerste
      uitkeringsjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0008290#Artikel9
    url: https://wetten.overheid.nl/BWBR0008290/2014-02-22#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0008290
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '25'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0008290/2014-02-22#Artikel25
  - number: '26'
    text: 'Deze wet wordt aangehaald als: Financiële-verhoudingswet.'
    url: https://wetten.overheid.nl/BWBR0008290/2014-02-22#Artikel26
