preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de Wet arbeid vreemdelingen op onderdelen te wijzigen,
    teneinde arbeidsmigranten meer bescherming te bieden en een toekomstbestendig beleid mogelijk te maken door middel
    van een verlenging van de duur van een tewerkstellingsvergunning en enkele andere wijzingen;

    Zo is het dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-Generaal,
    hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0045741/2022-01-01#ArtikelAanhef
articles:
  - number: III
    text: |-
      Ten aanzien van een aanvraag van een tewerkstellingsvergunning of gecombineerde vergunning die is ontvangen vóór
      het tijdstip van inwerkingtreding van [artikel I, onderdeel C][ref1], van deze wet, zijn de voorwaarden, genoemd
      in de onderdelen g en h uit het tweede lid van het in artikel I, onderdeel C, genoemde [artikel 9][ref2] van deze
      wet niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0045741#ArtikelI
      [ref2]: https://wetten.overheid.nl/BWBR0007149#Artikel9
    url: https://wetten.overheid.nl/BWBR0045741/2022-01-01#ArtikelIII
    references:
      - id: ref1
