  - number: 2.3.1
    text: |-
      De artikelen van de [Wet op de (re)integratie arbeidsgehandicapten][ref1] en de daarop berustende bepalingen, zoals
      deze luidden op de dag voorafgaand aan de dag waarop deze op grond van [artikel 2.10][ref2], vervallen, blijven
      van toepassing op de persoon, instelling of organisatie die op of voor die dag in aanmerking is gebracht voor een
      instrument op grond van die wet of een aanvraag daartoe heeft ingediend, zolang dat instrument in dezelfde vorm
      wordt verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0009565
      [ref2]: https://wetten.overheid.nl/BWBR0019058#Artikel2
    url: https://wetten.overheid.nl/BWBR0019058/2015-01-01#Artikel2.3
