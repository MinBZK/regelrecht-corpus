  - number: '2.8'
    text: |-
      Alle vermogenbestanddelen die door het Uitvoeringsinstituut werknemersverzekeringen,
      genoemd in [hoofdstuk 5, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1],
      afzonderlijk worden beheerd en geadministreerd in de vorm van het Reïntegratiefonds,
      bedoeld in [artikel 2.7c][ref2], zoals dat luidde op de dag voor de inwerkingtreding van
      [artikel XVI, onderdeel A, van de Wet harmonisatie en vereenvoudiging socialezekerheidswetgeving][ref3], gaan over
      op het Arbeidsongeschiktheidsfonds, bedoeld in [artikel 112 van de Wet financiering sociale verzekeringen][ref4],
      overeenkomstig door Onze Minister te stellen regels.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk5
