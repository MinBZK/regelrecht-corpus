  - number: '2.10'
    text: |-
      De [Wet op de (re)integratie arbeidsgehandicapten][ref1] wordt op een bij koninklijk besluit te bepalen tijdstip
      ingetrokken, waarbij het tijdstip waarop de verschillende artikelen of onderdelen daarvan vervallen, verschillend
      kan worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0009565
    url: https://wetten.overheid.nl/BWBR0019058/2015-01-01#Artikel2.10
