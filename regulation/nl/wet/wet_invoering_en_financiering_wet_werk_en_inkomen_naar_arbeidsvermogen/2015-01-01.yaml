  - number: 2.4.5
    text: |-
      [Titel 4.2 van de Algemene wet bestuursrecht][ref1] is niet van toepassing op aanspraken als bedoeld in dit
      artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
