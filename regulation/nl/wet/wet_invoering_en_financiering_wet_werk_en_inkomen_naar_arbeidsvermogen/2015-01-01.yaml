  - number: 2.6.1
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld op grond waarvan het Uitvoeringsinstituut
      werknemersverzekeringen, genoemd in [hoofdstuk 5 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1],
      aan de persoon die een arbeidsongeschiktheidsuitkering op grond van de
      [Wet op de arbeidsongeschiktheidsverzekering][ref2], de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref3]
      of de [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref4] dan wel een werkhervattingsuitkering op
      grond van de [Wet werk en inkomen naar arbeidsvermogen][ref5] van het Uitvoeringsinstituut werknemersverzekeringen
      ontvangt of recht heeft op arbeidsondersteuning op grond van de Wet arbeidsongeschiktheidsvoorziening
      jonggehandicapten, op aanvraag in plaats van bij die regeling vast te stellen re-integratie-
      instrumenten als bedoeld [hoofdstuk IIB van de Wet op de arbeidsongeschiktheidsverzekering][ref6],
      [hoofdstuk 3A van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref7], [afdeling 5 van hoofdstuk 2][ref8]
      of [afdeling 5 van hoofdstuk 3 van de Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref9] en
      [paragraaf 4.2 van de Wet werk en inkomen naar arbeidsvermogen][ref10], een subsidie verstrekt in de vorm van
      een op de arbeidsinschakeling gericht persoonsgebonden re-integratiebudget. In deze regeling kunnen regels worden
      gesteld omtrent de aard en de omvang van de activiteiten en de aan de subsidie te verbinden verplichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk5
