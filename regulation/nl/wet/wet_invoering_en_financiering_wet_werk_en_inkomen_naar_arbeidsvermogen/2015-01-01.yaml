  - number: '2.11'
    text: |-
      Tot het tijdstip van inwerkingtreding van
      [artikel 23 van de Invoeringswet Wet financiering sociale verzekeringen][ref1] wordt in het in
      [artikel 1.4, onderdeel X][ref2], voorgestelde [artikel 76a, eerste lid, van de Ziektewet][ref3] «het bedrag,
      bedoeld in [artikel 17, eerste lid, van de Wet financiering sociale verzekeringen][ref4]» gelezen: het maximum
      dagloon, bedoeld in [artikel 9, eerste lid, van de Coördinatiewet Sociale Verzekering][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0017747#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0019058#Artikel1
