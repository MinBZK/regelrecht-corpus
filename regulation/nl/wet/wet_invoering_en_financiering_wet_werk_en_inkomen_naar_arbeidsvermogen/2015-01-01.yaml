  - number: 2.7b
    text: |-
      [Artikel 2.7a][ref1] zoals dat luidde op de dag voorafgaand aan de dag van inwerkingtreding van de
      [Verzamelwet SZW-wetgeving 2009][ref2], blijft van toepassing op de werknemer aan wie subsidie is verstrekt
      in de vorm van een op zijn arbeidsinschakeling gericht persoonsgebonden re-integratiebudget als bedoeld in
      [artikel 2.7a][ref3] of ten behoeve van wie een overeenkomst die is gericht op zijn arbeidsinschakeling als bedoeld
      in [artikel 2.7a][ref4] is gesloten en op de werknemer die een aanvraag daartoe heeft ingediend voor de datum van
      inwerkingtreding van de [Verzamelwet SZW-wetgeving 2009][ref5].


