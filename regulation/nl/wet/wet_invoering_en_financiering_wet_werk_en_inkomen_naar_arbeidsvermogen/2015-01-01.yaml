  - number: 2.4.4
    text: |-
      Beschikkingen op grond van de artikelen 57 en 57a van de Algemene arbeidsongeschiktheidswet worden na
      het vervallen van [artikel 85, eerste lid, van de Wet op de (re)integratie arbeidsgehandicapten][ref1]
      als gevolg van de inwerkingtreding van [artikel 2.10][ref2], aangemerkt als beschikkingen op grond van de
      [Wet op de arbeidsongeschiktheidsverzekering][ref3], de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref4],
      de [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref5] of de
      [Wet werk en inkomen naar arbeidsvermogen][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel85
      [ref2]: https://wetten.overheid.nl/BWBR0019058#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0002524
