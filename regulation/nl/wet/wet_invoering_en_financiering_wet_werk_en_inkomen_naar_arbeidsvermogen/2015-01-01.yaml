  - number: '2.3'
    text: |-
      1 De artikelen van de [Wet op de (re)integratie arbeidsgehandicapten][ref1] en de daarop berustende bepalingen,
      zoals deze luidden op de dag voorafgaand aan de dag waarop deze op grond van [artikel 2.10][ref2], vervallen,
      blijven van toepassing op de persoon, instelling of organisatie die op of voor die dag in aanmerking is gebracht
      voor een instrument op grond van die wet of een aanvraag daartoe heeft ingediend, zolang dat instrument in dezelfde
      vorm wordt verstrekt.

      2 Het eerste lid is niet van toepassing indien het instrument waarvoor de persoon in aanmerking is gebracht:

      a. op grond van het artikel van de [Wet op de arbeidsongeschiktheidsverzekering][ref3] dat na inwerkingtreding van
      [artikel 1.1, onderdeel JJ][ref4], in de [Wet op de arbeidsongeschiktheidsverzekering][ref5] wordt ingevoegd,

      b. [artikel 98b van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref6],

      c. [artikel 8:3 van de Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref7],

      d. [artikel 129][ref8] of [132 van de Wet werk en inkomen naar arbeidsvermogen][ref9], of

      e. [artikel 2.7][ref10],

      wordt aangemerkt als instrument op grond van de desbetreffende wet.

      3 In afwijking van het eerste lid, kan bij of krachtens algemene maatregel van bestuur worden bepaald dat de
      artikelen van de [Wet op de (re)integratie arbeidsgehandicapten][ref11] en de daarop berustende bepalingen, zoals
      deze luidden op de dag voorafgaand aan de dag waarop deze vervallen niet meer van toepassing zijn op de persoon,
      instelling of organisatie, bedoeld in het eerste lid.


