  - number: 2.17.1
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen, genoemd in
      [hoofdstuk 5 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1], heeft
      tot taak te bevorderen dat belemmeringen worden weggenomen die de ingezetene, bedoeld in
      [artikel 3 van de Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref2], vanwege ziekte of gebrek
      ondervindt bij het volgen van onderwijs, indien het een persoon betreft die:


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0008657#Artikel3
    url: https://wetten.overheid.nl/BWBR0019058/2006-01-01#Artikel2.17
    references:
      - id: ref1
        bwb_id: BWBR0013060
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0008657
        artikel: '3'
  - number: 2.17.1.a
    text: jonger is dan 17 jaar;
    url: https://wetten.overheid.nl/BWBR0019058/2006-01-01#Artikel2.17
  - number: 2.17.1.b
    text: |-
      studerende is als bedoeld in [artikel 5 van de Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008657#Artikel5
    url: https://wetten.overheid.nl/BWBR0019058/2006-01-01#Artikel2.17
    references:
      - id: ref1
        bwb_id: BWBR0008657
        artikel: '5'
  - number: 2.17.1.c
    text: |-
      jonger is dan 30 jaar en uitsluitend vanwege zijn ziekte of gebrek niet kan worden aangemerkt als studerende als
      bedoeld in [artikel 5 van de Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008657#Artikel5
    url: https://wetten.overheid.nl/BWBR0019058/2006-01-01#Artikel2.17
    references:
      - id: ref1
        bwb_id: BWBR0008657
        artikel: '5'
  - number: 2.17.2
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan op aanvraag aan de persoon, bedoeld in het eerste lid,
      voorzieningen toekennen die hem in staat stellen onderwijs te volgen.
    url: https://wetten.overheid.nl/BWBR0019058/2006-01-01#Artikel2.17
  - number: 2.17.3
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan op aanvraag aan de persoon, bedoeld in het eerste lid,
      vervoersvoorzieningen toekennen die strekken tot verbetering van zijn leefomstandigheden en die deel uitmaken van
      danwel rechtstreeks samenhangen met voorzieningen als bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0019058/2006-01-01#Artikel2.17
  - number: 2.17.4
    text: |-
      Onder voorzieningen als bedoeld in het tweede lid wordt niet verstaan financiering van of kinderopvangtoeslag in de
      kosten van kinderopvang.
    url: https://wetten.overheid.nl/BWBR0019058/2006-01-01#Artikel2.17
  - number: 2.17.5
    text: |-
      Toekenningen van voorzieningen als bedoeld in het tweede lid komen ten laste van het Arbeidsongeschiktheidsfonds
      jonggehandicapten.
    url: https://wetten.overheid.nl/BWBR0019058/2006-01-01#Artikel2.17
  - number: 2.17.6
    text: |-
      De [artikelen 16][ref1], [33][ref2], [55][ref3], [56][ref4], [57][ref5], [58][ref6], [59][ref7] en
      [62 van de Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref8] zijn van overeenkomstige toepassing op de
      toekenning van voorzieningen als bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0008657#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0008657#Artikel33
      [ref3]: https://wetten.overheid.nl/BWBR0008657#Artikel55
      [ref4]: https://wetten.overheid.nl/BWBR0008657#Artikel56
      [ref5]: https://wetten.overheid.nl/BWBR0008657#Artikel57
      [ref6]: https://wetten.overheid.nl/BWBR0008657#Artikel58
      [ref7]: https://wetten.overheid.nl/BWBR0008657#Artikel59
      [ref8]: https://wetten.overheid.nl/BWBR0008657#Artikel62
    url: https://wetten.overheid.nl/BWBR0019058/2006-01-01#Artikel2.17
    references:
      - id: ref1
        bwb_id: BWBR0008657
        artikel: '16'
