        artikel: '2'
        hoofdstuk: '2'
  - number: 2.8.1
    text: 'De middelen tot dekking van de uitgaven ten laste van het Reïntegratiefonds worden verkregen uit:'
    url: https://wetten.overheid.nl/BWBR0019058/2006-01-01#Artikel2.8
  - number: 2.8.1.a
    text: |-
      bijdragen uit het Arbeidsongeschiktheidsfonds, genoemd in
      [artikel 112 van de Wet financiering sociale verzekeringen][ref1], het Algemeen Werkloosheidsfonds,
      genoemd in [artikel 93 van die wet][ref2], het Uitvoeringsfonds voor de overheid, genoemd in
      [artikel 106 van die wet][ref3] en het Arbeidsongeschiktheidsfonds jonggehandicapten, genoemd in
      [artikel 63 van de Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel112
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel93
      [ref3]: https://wetten.overheid.nl/BWBR0017745#Artikel106
      [ref4]: https://wetten.overheid.nl/BWBR0008657#Artikel63
    url: https://wetten.overheid.nl/BWBR0019058/2006-01-01#Artikel2.8
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '112'
      - id: ref2
        bwb_id: BWBR0017745
        artikel: '93'
      - id: ref3
