  - number: 2.3.3
    text: |-
      In afwijking van het eerste lid, kan bij of krachtens algemene maatregel van bestuur worden bepaald dat de
      artikelen van de [Wet op de (re)integratie arbeidsgehandicapten][ref1] en de daarop berustende bepalingen, zoals
      deze luidden op de dag voorafgaand aan de dag waarop deze vervallen niet meer van toepassing zijn op de persoon,
      instelling of organisatie, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0009565
    url: https://wetten.overheid.nl/BWBR0019058/2006-01-01#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0009565
  - number: 2.4.1
    text: |-
      Artikel 57 van de Algemene arbeidsongeschiktheidswet en de daarop berustende bepalingen, zoals deze luidden
      op de dag voorafgaand aan de inwerkingtreding van de [Wet op de (re)integratie arbeidsgehandicapten][ref1],
      blijven van toepassing op de persoon die voor die dag een aanvraag heeft ingediend of in aanmerking is
      gebracht voor een voorziening tot behoud, herstel of ter bevordering van de arbeidsgeschiktheid, zolang die
      voorziening verkeert in de staat waarin de voorziening verkeerde op de dag voorafgaande aan de dag waarop
      [artikel 75, eerste lid, van de Wet op de (re)integratie arbeidsgehandicapten][ref2] vervalt als gevolg van de
      inwerkingtreding van [artikel 2.10][ref3] of, indien op de aanvraag niet voor die dag is beslist, op de dag waarop
      de voorziening wordt verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0009565
      [ref2]: https://wetten.overheid.nl/BWBR0009565#Artikel75
      [ref3]: https://wetten.overheid.nl/BWBR0019058#Artikel2
    url: https://wetten.overheid.nl/BWBR0019058/2006-01-01#Artikel2.4
    references:
      - id: ref1
        bwb_id: BWBR0009565
      - id: ref2
        bwb_id: BWBR0009565
        artikel: '75'
      - id: ref3
        bwb_id: BWBR0019058
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.4.2
    text: |-
      Artikel 57a van de Algemene arbeidsongeschiktheidswet en de daarop berustende bepalingen, zoals deze luidden op de
      dag voorafgaand aan de inwerkingtreding van de [Wet op de (re)integratie arbeidsgehandicapten][ref1], blijven van
      toepassing op de persoon die voor de dag een aanvraag heeft ingediend of in aanmerking is gebracht voor vergoeding
      van kosten als bedoeld in dat artikel, zolang deze vergoeding niet daadwerkelijk geheel is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0009565
