        artikel: '106'
      - id: ref4
        bwb_id: BWBR0008657
        artikel: '63'
  - number: 2.8.1.b
    text: |-
      de gelden die het Uitvoeringsinstituut werknemersverzekeringen, genoemd in
      [hoofdstuk 5 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1], ontvangt door
      terugvordering van onverschuldigd verstrekte of betaalde voorzieningen, kosten van voorzieningen,
      subsidies, loonsuppletie en inkomenssuppletie waar [artikel 2.3][ref2] of [2.7][ref3] van
      deze wet, [artikel 98b van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref4],
      [artikel 76a van de Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref5] of
      [artikel 129 van de Wet werk en inkomen naar arbeidsvermogen][ref6] op van toepassing zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0019058#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0019058#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0002524#Artikel98b
      [ref5]: https://wetten.overheid.nl/BWBR0008657#Artikel76a
      [ref6]: https://wetten.overheid.nl/BWBR0019057#Artikel129
    url: https://wetten.overheid.nl/BWBR0019058/2006-01-01#Artikel2.8
    references:
      - id: ref1
        bwb_id: BWBR0013060
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0019058
        artikel: '2'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0019058
        artikel: '2'
