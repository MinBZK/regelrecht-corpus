  - number: 2.9.3
    text: Bij ministeriële regeling kunnen nadere regels met betrekking tot het eerste en tweede lid worden gesteld.
    url: https://wetten.overheid.nl/BWBR0019058/2006-01-01#Artikel2.9
  - number: '2.10'
    text: |-
      De [Wet op de (re)integratie arbeidsgehandicapten][ref1] wordt op een bij koninklijk besluit te bepalen tijdstip
      ingetrokken, waarbij het tijdstip waarop de verschillende artikelen of onderdelen daarvan vervallen, verschillend
      kan worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0009565
    url: https://wetten.overheid.nl/BWBR0019058/2006-01-01#Artikel2.10
    references:
      - id: ref1
        bwb_id: BWBR0009565
  - number: '2.11'
    text: |-
      Tot het tijdstip van inwerkingtreding van
      [artikel 23 van de Invoeringswet Wet financiering sociale verzekeringen][ref1] wordt in het in
      [artikel 1.4, onderdeel X][ref2], voorgestelde [artikel 76a, eerste lid, van de Ziektewet][ref3] «het bedrag,
      bedoeld in [artikel 17, eerste lid, van de Wet financiering sociale verzekeringen][ref4]» gelezen: het maximum
      dagloon, bedoeld in [artikel 9, eerste lid, van de Coördinatiewet Sociale Verzekering][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0017747#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0019058#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0001888#Artikel76a
      [ref4]: https://wetten.overheid.nl/BWBR0017745#Artikel17
      [ref5]: https://wetten.overheid.nl/BWBR0002126#Artikel9
    url: https://wetten.overheid.nl/BWBR0019058/2006-01-01#Artikel2.11
