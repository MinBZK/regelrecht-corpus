        artikel: 98b
      - id: ref5
        bwb_id: BWBR0008657
        artikel: 76a
      - id: ref6
        bwb_id: BWBR0019057
        artikel: '129'
  - number: 2.8.2
    text: |-
      Bij ministeriële regeling worden de bijdragen, bedoeld in het eerste lid, onderdeel a, en de onderlinge
      verhouding tussen de ten laste van de verschillende fondsen en de kas komende bijdragen, bedoeld in dat onderdeel,
      vastgesteld. Bij deze regeling kan worden bepaald dat in de middelen tot dekking van de uitgaven ten laste van het
      Reïntegratiefonds mede wordt voorzien door het Rijk en kunnen regels worden gesteld in verband met de besteding van
      die rijksbijdrage.
    url: https://wetten.overheid.nl/BWBR0019058/2006-01-01#Artikel2.8
  - number: 2.9.1
    text: |-
      Ten laste van het Reïntegratiefonds komen de door het Uitvoeringsinstituut werknemersverzekeringen, genoemd in
      [hoofdstuk 5 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1], verstrekte of toegekende:


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0019058/2006-01-01#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0013060
        hoofdstuk: '5'
  - number: 2.9.1.a
    text: |-
      subsidies, bedoeld in de [artikelen 16][ref1], [30][ref2], [33][ref3] en
      [33a van de Wet op de (re)integratie arbeidsgehandicapten][ref4] of overeenkomsten bedoeld in [artikel 33][ref5]
      dan wel [33a, eerste lid, onderdeel b, van de Wet op de (re)integratie arbeidsgehandicapten][ref6] zoals
      die artikelen luidden op de dag voor het vervallen van die artikelen als gevolg van de inwerkingtreding van
      [artikel 2.10][ref7];


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0009565#Artikel30
      [ref3]: https://wetten.overheid.nl/BWBR0009565#Artikel33
      [ref4]: https://wetten.overheid.nl/BWBR0009565#Artikel33a
      [ref5]: https://wetten.overheid.nl/BWBR0009565#Artikel33
      [ref6]: https://wetten.overheid.nl/BWBR0009565#Artikel33a
      [ref7]: https://wetten.overheid.nl/BWBR0019058#Artikel2
    url: https://wetten.overheid.nl/BWBR0019058/2006-01-01#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '16'
