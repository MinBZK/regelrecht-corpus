      [ref7]: https://wetten.overheid.nl/BWBR0008656#Hoofdstuk3A
      [ref8]: https://wetten.overheid.nl/BWBR0008657#Hoofdstuk2A
      [ref9]: https://wetten.overheid.nl/BWBR0019057#Paragraaf4.2
