  - number: 2.7.2
    text: |-
      De [Experimentele regeling subsidieverstrekking arbeidsgehandicapten][ref1] berust met ingang van de dag waarop
      [artikel 33 van de Wet op de (re)integratie arbeidsgehandicapten][ref2], op grond van [artikel 2.10][ref3] vervalt,
      op [artikel 2.6][ref4] van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0009957
      [ref2]: https://wetten.overheid.nl/BWBR0009565#Artikel33
      [ref3]: https://wetten.overheid.nl/BWBR0019058#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0019058#Artikel2
