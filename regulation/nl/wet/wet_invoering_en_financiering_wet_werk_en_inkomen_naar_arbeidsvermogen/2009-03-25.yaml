  - number: 2.7c
    text: |-
      1 Het Uitvoeringsinstituut werknemersverzekeringen beheert en administreert afzonderlijk de middelen tot
      dekking van de uitgaven in de vorm van een Reïntegratiefonds dat deel uitmaakt van het Uitvoeringsinstituut
      werknemersverzekeringen.

      2 Het Uitvoeringsinstituut werknemersverzekeringen kan de middelen voor het
      Reïntegratiefonds in een of meer rekeningen-courant houden bij Onze Minister van Financiën.
      [Artikel 120 van de Wet financiering sociale verzekeringen][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel120
    url: https://wetten.overheid.nl/BWBR0019058/2009-03-25#Artikel2.7c
