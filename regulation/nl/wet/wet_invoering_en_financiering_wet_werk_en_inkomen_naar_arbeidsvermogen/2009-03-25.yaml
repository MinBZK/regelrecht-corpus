  - number: '2.9'
    text: |-
      1 Ten laste van het Reïntegratiefonds komen de door het Uitvoeringsinstituut werknemersverzekeringen, genoemd in
      [hoofdstuk 5 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1], verstrekte of toegekende:

      a. subsidies, bedoeld in de [artikelen 16][ref2], [30][ref3], [33][ref4] en
      [33a van de Wet op de (re)integratie arbeidsgehandicapten][ref5] of overeenkomsten bedoeld in [artikel 33][ref6]
      dan wel [33a, eerste lid, onderdeel b, van de Wet op de (re)integratie arbeidsgehandicapten][ref7] zoals
      die artikelen luidden op de dag voor het vervallen van die artikelen als gevolg van de inwerkingtreding van
      [artikel 2.10][ref8];

      b. voorzieningen, bedoeld in [artikel 22][ref9] en [31 van de Wet op de (re)integratie arbeidsgehandicapten][ref10]
      zoals die artikelen luidden op de dag voor het vervallen van die artikelen als gevolg van de inwerkingtreding van
      [artikel 2.10][ref11];

      c. toelagen, bedoeld in [artikel 28 van de Wet op de (re)integratie arbeidsgehandicapten][ref12] zoals
      [dat artikel][ref13] luidde op de dag voor het vervallen van dat artikel als gevolg van de inwerkingtreding
      van [artikel 2.10][ref14], alsmede de op grond van enige wet over deze toelagen verschuldigde
      premies die niet op deze toelagen in mindering kunnen worden gebracht en de vergoeding, bedoeld in
      [artikel 46 van de Zorgverzekeringswet][ref15];

      d. inkomenssuppletie, bedoeld in [artikel 29 van de Wet op de (re)integratie arbeidsgehandicapten][ref16]
      zoals [dat artikel][ref17] luidde op de dag voor het vervallen van [dat artikel][ref18] als gevolg van de
      inwerkingtreding van [artikel 2.10][ref19], alsmede de op grond van enige wet over deze suppletie verschuldigde
      premies die niet op deze suppletie in mindering kunnen worden gebracht en de vergoeding, bedoeld in
      [artikel 46 van de Zorgverzekeringswet][ref20];

      e. loonsuppletie, bedoeld in [artikel 32 van de Wet op de (re)integratie arbeidsgehandicapten][ref21]
      zoals [dat artikel][ref22] luidde op de dag voor het vervallen van [dat artikel][ref23] als gevolg van de
      inwerkingtreding van [artikel 2.10][ref24], alsmede de op grond van enige wet over deze suppletie verschuldigde
      premies die niet op deze suppletie in mindering kunnen worden gebracht en de vergoeding, bedoeld in
      [artikel 46 van de Zorgverzekeringswet][ref25];

      f. uitkeringen, bedoeld in [artikel 29b van de Ziektewet][ref26] zoals [dat artikel][ref27] luidde op de dag voor
      inwerkingtreding van [artikel 1.4, onderdeel G][ref28], waardoor dat [artikel 29b][ref29] wijzigt, alsmede de op
      grond van enige wet over deze uitkeringen verschuldigde premies die niet op deze uitkeringen in mindering kunnen
      worden gebracht en de vergoeding, bedoeld in [artikel 46 van de Zorgverzekeringswet][ref30];

      doch voor de duur en hoogte van die verstrekking of toekenning.

      2 Tevens ten laste van het Reïntegratiefonds komen:

      a. de reïntegratie-instrumenten die op grond van
      [hoofdstuk IIB van de Wet op de arbeidsongeschiktheidsverzekering][ref31],
      [hoofdstuk 3A van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref32], of
      [hoofdstuk 4, paragraaf 2, van de Wet werk en inkomen naar arbeidsvermogen][ref33] na de dag van
      inwerkingtreding van [artikel 2.10][ref34] van deze wet en voor de dag van inwerkingtreding van
      [artikel 115 van de Wet financiering sociale verzekeringen][ref35] zijn verstrekt;

      b. het ziekengeld dat op grond van [artikel 29b van de Ziektewet][ref36] na de dag van
      inwerkingtreding van [artikel 2.10][ref37] van deze wet en voor de dag van inwerkingtreding van
      [artikel 100 van de Wet financiering sociale verzekeringen][ref38] is verstrekt; en

      c. vergoedingen aan gemeenten die worden overeengekomen ter uitvoering van
      [artikel 14, eerste lid, van de Wet op de (re)integratie arbeidsgehandicapten][ref39] zoals dit artikel luidde op
      de dag voor het vervallen van dat artikel als gevolg van de inwerkingtreding van [artikel 2.10][ref40];

      d. subsidies of de kosten van overeenkomsten als bedoeld in [artikel 2.7a][ref41].

      3 Bij ministeriële regeling kunnen nadere regels met betrekking tot het eerste en tweede lid worden gesteld.


