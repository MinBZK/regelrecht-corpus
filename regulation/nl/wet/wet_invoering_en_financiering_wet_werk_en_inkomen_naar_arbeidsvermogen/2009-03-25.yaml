  - number: '2.18'
    text: |-
      Bij ministeriële regeling kunnen met het oog op een goede invoering en werking van de
      [Wet werk en inkomen naar arbeidsvermogen][ref1] regels worden gesteld, waarbij zo nodig kan worden
      afgeweken van de genoemde wet, deze wet en in overeenstemming met Onze Minister van Financiën van de
      [Wet financiering sociale verzekeringen][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0019057
      [ref2]: https://wetten.overheid.nl/BWBR0017745
    url: https://wetten.overheid.nl/BWBR0019058/2009-03-25#Artikel2.18
    references:
      - id: ref1
        bwb_id: BWBR0019057
      - id: ref2
        bwb_id: BWBR0017745
  - number: '2.19'
    text: |-
      Voor de plaatsing van deze wet in het Staatsblad brengt Onze Minister de aanhalingen van de artikelen, paragrafen,
      afdelingen en hoofdstukken van de [Wet werk en inkomen naar arbeidsvermogen][ref1] die voorkomen in deze wet
      in overeenstemming met de op grond van [artikel 140 van de Wet werk en inkomen naar arbeidsvermogen][ref2]
      vastgestelde nummering van [die wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0019057
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel140
      [ref3]: https://wetten.overheid.nl/BWBR0019057
    url: https://wetten.overheid.nl/BWBR0019058/2009-03-25#Artikel2.19
    references:
      - id: ref1
        bwb_id: BWBR0019057
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '140'
      - id: ref3
        bwb_id: BWBR0019057
  - number: '2.20'
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0019058/2009-03-25#Artikel2.20
  - number: '2.21'
    text: 'Deze wet wordt aangehaald als: Wet Invoering en financiering Wet werk en inkomen naar arbeidsvermogen.'
    url: https://wetten.overheid.nl/BWBR0019058/2009-03-25#Artikel2.21
