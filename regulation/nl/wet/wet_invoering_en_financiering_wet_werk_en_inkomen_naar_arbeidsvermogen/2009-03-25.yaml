  - number: 2.7a
    text: |-
      1 Het Uitvoeringsinstituut werknemersverzekeringen kan op aanvraag van een werknemer die aanspraak heeft
      op loon als bedoeld in [artikel 7:629 van het Burgerlijk Wetboek][ref1] en van de persoon, bedoeld in
      [artikel 63, eerste lid, van de Ziektewet][ref2], aan wie de eigenrisicodrager ziekengeld moet betalen besluiten:

      a. aan de aanvrager subsidie te verstrekken in de vorm van een op zijn arbeidsinschakeling gericht persoonsgebonden
      reïntegratiebudget; of

      b. met een natuurlijke persoon of rechtspersoon die in het kader van de uitoefening van beroep of bedrijf
      de inschakeling van personen in de arbeid bevordert, een overeenkomst te sluiten die is gericht op de
      arbeidsinschakeling van deze aanvrager;

      indien de aanvrager in verband met ziekte of gebrek een belemmering heeft bij het verrichten van arbeid.

      2 Een subsidie als bedoeld in het eerste lid, onderdeel a, of een overeenkomst als bedoeld in het eerste lid,
      onderdeel b, kan het Uitvoeringsinstituut werknemersverzekeringen op aanvraag van een in het eerste lid bedoelde
      persoon uitsluitend verstrekken of sluiten, indien dit instituut van oordeel is dat in het bedrijf van zijn
      werkgever of een ander bedrijf geen passende arbeid aanwezig is die de betrokken persoon kan verrichten.

      3 De in het eerste lid bedoelde subsidie-ontvanger laat de werkzaamheden die zijn gericht op arbeidsinschakeling,
      bedoeld in het eerste lid, verrichten door een natuurlijke persoon dan wel rechtspersoon, die in het kader van de
      uitoefening van beroep of bedrijf de inschakeling van personen in de arbeid bevordert.

      4 De in het eerste lid bedoelde aanvrager verstrekt de gegevens, voorzover deze noodzakelijk zijn voor de
      uitvoering van de werkzaamheden die zijn gericht op arbeidsinschakeling, bedoeld in het eerste lid, alsmede
      zijn burgerservicenummer of, bij het ontbreken daarvan, zijn sociaal-fiscaalnummer aan de natuurlijke persoon of
      rechtspersoon, die in het kader van de uitoefening van beroep of bedrijf zijn inschakeling in de arbeid bevordert.

      5 De in het vierde lid bedoelde natuurlijke persoon of rechtspersoon verwerkt de in dat lid bedoelde gegevens
      slechts voorzover dat noodzakelijk is voor de werkzaamheden, bedoeld in het eerste lid, en gebruikt slechts met dat
      doel het burgerservicenummer of, bij het ontbreken daarvan, het sociaal-fiscaalnummer bij die verwerking.

      6 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent dit artikel, waarbij kan
      worden bepaald in welke situaties een deel van de subsidiekosten in rekening kan worden gebracht bij de werkgever.

      7 Een algemene maatregel van bestuur als bedoeld in het zesde lid treedt niet eerder in werking dan vier weken
      na de datum van uitgifte van het Staatsblad waarin hij is geplaatst. Van de plaatsing wordt onverwijld mededeling
      gedaan aan beide kamers der Staten-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel629
