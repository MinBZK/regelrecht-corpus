    text: |-
      1 Het persoonsgebonden reïntegratiebudget dat op de dag voorafgaand aan de dag waarop
      [artikel 33 van de Wet op de (re)integratie arbeidsgehandicapten][ref1], op grond van
      [artikel 2.10][ref2], vervalt op grond van de eerstgenoemde wet was toegekend, wordt voor de
      duur van het tijdvak waarvoor dat budget is toegekend, aangemerkt als een persoonsgebonden
      reïntegratiebudget als bedoeld in [artikel 2.6][ref3], met dien verstande dat personen die met
      toepassing van [artikel 77 van de Wet op de (re)integratie arbeidsgehandicapten][ref4] geacht werden
      verzekerd te zijn voor de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref5] ook na het
      vervallen van [artikel 77 van de Wet op de (re)integratie arbeidsgehandicapten][ref6] als gevolg
      van de inwerkingtreding van [artikel 2.10][ref7], voor de toepassing van [artikel 2.6][ref8] met
      betrekking tot en voor de duur van het tijdvak van de subsidie geacht worden verzekerd te zijn voor de
      [Wet op de arbeidsongeschiktheidsverzekering zelfstandigen][ref9].

      2 De [Experimentele regeling subsidieverstrekking arbeidsgehandicapten][ref10] berust met ingang van de dag waarop
      [artikel 33 van de Wet op de (re)integratie arbeidsgehandicapten][ref11], op grond van [artikel 2.10][ref12]
      vervalt, op [artikel 2.6][ref13] van deze wet.


