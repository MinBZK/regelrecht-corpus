  - number: '2.4'
    text: |-
      1 Artikel 57 van de Algemene arbeidsongeschiktheidswet en de daarop berustende bepalingen, zoals deze luidden
      op de dag voorafgaand aan de inwerkingtreding van de [Wet op de (re)integratie arbeidsgehandicapten][ref1],
      blijven van toepassing op de persoon die voor die dag een aanvraag heeft ingediend of in aanmerking is
      gebracht voor een voorziening tot behoud, herstel of ter bevordering van de arbeidsgeschiktheid, zolang die
      voorziening verkeert in de staat waarin de voorziening verkeerde op de dag voorafgaande aan de dag waarop
      [artikel 75, eerste lid, van de Wet op de (re)integratie arbeidsgehandicapten][ref2] vervalt als gevolg van de
      inwerkingtreding van [artikel 2.10][ref3] of, indien op de aanvraag niet voor die dag is beslist, op de dag waarop
      de voorziening wordt verstrekt.

      2 Artikel 57a van de Algemene arbeidsongeschiktheidswet en de daarop berustende bepalingen, zoals deze luidden op
      de dag voorafgaand aan de inwerkingtreding van de [Wet op de (re)integratie arbeidsgehandicapten][ref4], blijven
      van toepassing op de persoon die voor de dag een aanvraag heeft ingediend of in aanmerking is gebracht voor
      vergoeding van kosten als bedoeld in dat artikel, zolang deze vergoeding niet daadwerkelijk geheel is verleend.

      3 Na het vervallen van [artikel 79, eerste lid, van de Wet op de (re)integratie arbeidsgehandicapten][ref5] als
      gevolg van de inwerkingtreding van [artikel 2.10][ref6], komen ten laste van het Reïntegratiefonds, genoemd in
      [artikel 2.8][ref7]:

      a. de op grond van artikel 57 van de Algemene arbeidsongeschiktheidswet toegekende voorzieningen, bedoeld in het
      eerste lid;

      b. de op grond van artikel 57a van de Algemene arbeidsongeschiktheidswet toegekende vergoedingen, bedoeld in het
      tweede lid.

      4 Beschikkingen op grond van de artikelen 57 en 57a van de Algemene arbeidsongeschiktheidswet worden na
      het vervallen van [artikel 85, eerste lid, van de Wet op de (re)integratie arbeidsgehandicapten][ref8]
      als gevolg van de inwerkingtreding van [artikel 2.10][ref9], aangemerkt als
      beschikkingen op grond van de [Wet op de arbeidsongeschiktheidsverzekering][ref10],
      de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref11], de
      [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref12] of de
      [Wet werk en inkomen naar arbeidsvermogen][ref13].

      5 [Titel 4.2 van de Algemene wet bestuursrecht][ref14] is niet van toepassing op aanspraken als bedoeld in dit
      artikel.


