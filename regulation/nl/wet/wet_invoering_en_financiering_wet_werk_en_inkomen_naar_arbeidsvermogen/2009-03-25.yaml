        artikel: '120'
  - number: '2.8'
    text: |-
      1 De middelen tot dekking van de uitgaven ten laste van het Reïntegratiefonds worden verkregen uit:

      a. bijdragen uit het Arbeidsongeschiktheidsfonds, genoemd in
      [artikel 112 van de Wet financiering sociale verzekeringen][ref1], het Algemeen Werkloosheidsfonds,
      genoemd in [artikel 93 van die wet][ref2], het Uitvoeringsfonds voor de overheid, genoemd in
      [artikel 106 van die wet][ref3] en het Arbeidsongeschiktheidsfonds jonggehandicapten, genoemd in
      [artikel 63 van de Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref4];

      b. de gelden die het Uitvoeringsinstituut werknemersverzekeringen, genoemd in
      [hoofdstuk 5 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref5], ontvangt door
      terugvordering van onverschuldigd verstrekte of betaalde voorzieningen, kosten van voorzieningen,
      subsidies, loonsuppletie en inkomenssuppletie waar [artikel 2.3][ref6] of [2.7][ref7] van
      deze wet, [artikel 98b van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref8],
      [artikel 76a van de Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref9] of
      [artikel 129 van de Wet werk en inkomen naar arbeidsvermogen][ref10] op van toepassing zijn.

      2 Bij ministeriële regeling worden de bijdragen, bedoeld in het eerste lid, onderdeel a, en de onderlinge
      verhouding tussen de ten laste van de verschillende fondsen en de kas komende bijdragen, bedoeld in dat onderdeel,
      vastgesteld. Bij deze regeling kan worden bepaald dat in de middelen tot dekking van de uitgaven ten laste van het
      Reïntegratiefonds mede wordt voorzien door het Rijk en kunnen regels worden gesteld in verband met de besteding van
      die rijksbijdrage.


