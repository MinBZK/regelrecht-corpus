  - number: '31'
    text: |-
      1 Indien met betrekking tot personenauto’s en motorrijwielen die na 31 december 1992 worden geregistreerd vóór 1
      januari 1993 bijzondere verbruiksbelasting van personenauto’s of bijzondere verbruiksbelasting van motorrijwielen
      op de voet van [artikel 50][ref1] onderscheidenlijk van [artikel 50a van de Wet op de omzetbelasting 1968][ref2]
      verschuldigd is geworden, wordt die belasting verrekend met de belasting van personenauto’s en motorrijwielen.

      2 Met betrekking tot personenauto’s en motorrijwielen die vóór 1 januari 1993 zijn geregistreerd en die niet
      vóór die datum zijn ingevoerd of geleverd door de fabrikant in de zin van de [artikelen 50, eerste lid][ref3],
      en [50a, eerste lid, van de Wet op de omzetbelasting 1968][ref4] zoals deze luidden op 31 december 1992, wordt
      de belasting verschuldigd ter zake van de aanvang van het gebruik na 31 december 1992 met dat motorrijtuig in
      Nederland van de weg in de zin van de [Wegenverkeerswet 1994][ref5].

      3

      4 Indien vóór 1 januari 1993 geregistreerde motorrijtuigen als bedoeld
      in [artikel 50, tweede lid, onderdelen a, b, c en d, ][ref6] en
      [artikel 50a, tweede lid, onderdelen a en b, van de Wet op de omzetbelasting 1968][ref7], zoals die luidden op
      31 december 1992, in een zodanige staat worden gebracht dat zij een personenauto of een motorrijwiel worden in
      de zin van [artikel 50][ref8], onderscheidenlijk [artikel 50a van de Wet op de omzetbelasting 1968][ref9], zoals
      die luidden op 31 december 1992, is belasting van personenauto’s en motorrijwielen verschuldigd. De belasting is
      verschuldigd door degene op wiens naam het motorrijtuig is geregistreerd.

      5 Met betrekking tot personenauto’s en motorrijwielen waarvoor bijzondere verbruiksbelasting van personenauto’s
      of bijzondere verbruiksbelasting van motorrijwielen is verschuldigd geworden en die na 31 december 1992
      worden uitgevoerd in de zin van [artikel 50, elfde lid, van de Wet op de omzetbelasting 1968][ref10],
      zoals dat luidde op 31 december 1992, blijven in afwijking van [artikel 25, onderdeel B][ref11],
      na 31 december 1992 de [artikelen 50, elfde lid][ref12], onderscheidenlijk
      [artikel 50a, vierde lid, van de Wet op de omzetbelasting 1968][ref13] van toepassing, zoals die luidde op 31
      december 1992.

      6 Met betrekking tot een personenauto die vóór 1 januari 1993 is geregistreerd en die blijkens een
      ingevolge de [Wet personenvervoer 2000][ref14] geldige vergunning, dan wel vergunningbewijs, is bestemd om
      openbaar vervoer of taxivervoer te verrichten, wordt, in afwijking van [artikel 25, onderdeel B][ref15],
      teruggaaf verleend van de betaalde bijzondere verbruiksbelasting van personenauto’s op de voet van
      [artikel 50, twaalfde lid, van de Wet op de omzetbelasting 1968][ref16], zoals dat luidde op 31 december 1992.


