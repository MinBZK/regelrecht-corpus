  - number: 16aa
    text: |-
      1 In afwijking van [artikel 15, vierde lid][ref1], [artikel 15a, achtste en tiende lid][ref2], en
      [artikel 16, zesde lid][ref3], is het teruggegeven bedrag niet als belasting verschuldigd indien:

      a. de tenaamstelling van het kenteken in het in [artikel 1, tweede lid][ref4], bedoelde register wordt beëindigd
      omdat het motorrijtuig buiten Nederland wordt gebracht;

      b. de tenaamstelling van het kenteken in het in [artikel 1, tweede lid][ref5], bedoelde register wordt beëindigd
      omdat het motorrijtuig wordt gesloopt; of

      c. het motorrijtuig is gestolen en een melding van diefstal van het motorrijtuig is geplaatst in het in
      [artikel 1, tweede lid][ref6], bedoelde register.

      2 Het teruggegeven bedrag wordt, nadat dit is verminderd met overeenkomstige toepassing van
      [artikel 10, zesde lid][ref7], alsnog als belasting verschuldigd:

      a. op het moment van de tenaamstelling van het kenteken, indien na toepassing van het eerste lid, onderdeel a of b,
      het kenteken dat voor het motorrijtuig is opgegeven opnieuw wordt tenaamgesteld;

      b. op het moment van de hernieuwde aanvang van het gebruik met het motorrijtuig van de weg in de zin van de
      [Wegenverkeerswet 1994][ref8], indien na toepassing van het eerste lid, onderdeel a of b, het motorrijtuig
      feitelijk ter beschikking staat van een in Nederland wonende natuurlijke persoon of gevestigd lichaam, zonder dat
      het kenteken opnieuw te naam is gesteld;

      c. op het moment van de verwijdering van de melding van diefstal uit het register, indien na toepassing van het
      eerste lid, onderdeel c, het motorrijtuig wordt teruggevonden, met dien verstande dat geen belasting verschuldigd
      is als het kenteken op dat moment nog op naam staat van degene aan wie de teruggaaf is verleend en deze het
      teruggevonden motorrijtuig aansluitend opnieuw in gebruik neemt binnen de voorwaarden van de teruggaaf. In het
      laatste geval blijven de feiten die zich hebben voorgedaan in de periode dat het motorrijtuig was gestolen buiten
      beschouwing voor de vraag, of aan de voorwaarden en beperkingen van de teruggaaf wordt voldaan.

      3 Bij de toepassing van het tweede lid zijn de [artikelen 5][ref9], [6][ref10],
      [10, derde, vierde, vijfde en zevende lid][ref11], en [12b][ref12] van overeenkomstige toepassing, met dien
      verstande, dat bij de toepassing van het tweede lid, onderdeel c, de belasting wordt voldaan binnen een maand na de
      verwijdering van de melding van diefstal uit het register.

      4 Voor personenauto’s waarvoor de belasting is teruggegeven ingevolge [artikel 16][ref13], is het eerste lid,
      onderdeel a, slechts van toepassing, indien gedurende ten minste twaalf maanden is voldaan aan de voorwaarden en
      beperkingen, bedoeld in [artikel 16, eerste lid][ref14]. Voorts wordt het ingevolge het tweede lid verschuldigde
      bedrag met een derde deel verminderd voor ieder jaar, waarin voor de personenauto wordt voldaan aan de voorwaarden
      en beperkingen, bedoeld in [artikel 16, eerste lid][ref15].

      5 Bij ministeriële regeling kunnen nadere regels worden gesteld ter uitvoering van dit artikel.


