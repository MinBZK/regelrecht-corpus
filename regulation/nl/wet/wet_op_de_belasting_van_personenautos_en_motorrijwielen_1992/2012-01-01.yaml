  - number: 10b
    text: |-
      1 Indien het bedrag van de belasting op het tijdstip dat een gebruikte personenauto, een gebruikt motorrijwiel
      of een gebruikte bestelauto voor het eerst in gebruik is genomen, ingevolge de wettelijke bepalingen met
      betrekking tot de maatstaf van heffing en het tarief zoals die op dat tijdstip golden, lager is dan het bedrag
      van de belasting ingevolge [artikel 9][ref1], na toepassing van [artikel 9a][ref2], [artikel 9b][ref3] en
      [artikel 9c][ref4], wordt, in afwijking van [artikel 10, eerste lid][ref5], dat lagere bedrag aan belasting
      toegepast indien daarop een beroep wordt gedaan in de aangifte.

      2 Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.


