      1 In geval van een verhoging van de in [artikel 9][ref1] opgenomen tarieven wordt voor een personenauto,
      motorrijwiel of bestelauto waarvoor voorafgaande aan het tijdstip waarop de verhoging in werking treedt, een
      kentekenbewijs is afgegeven dat nog niet is tenaamgesteld, de belasting berekend op de voet van [artikel 9][ref2],
      zoals dat luidde voor de inwerkingtreding, mits de tenaamstelling van het kenteken plaatsvindt binnen twee maanden
      na de inwerkingtreding. Indien de tenaamstelling plaatsvindt nadat deze twee maanden zijn verstreken, wordt de
      belasting berekend op de voet van [artikel 9][ref3], zoals dat luidt nadat de verhoging in werking is getreden.

      2 In geval van een verlaging van de in [artikel 9][ref4] opgenomen tarieven wordt voor een personenauto,
      motorrijwiel of bestelauto waarvoor voorafgaande aan het tijdstip waarop de verlaging in werking treedt, een
      kentekenbewijs is afgegeven dat nog niet is tenaamgesteld, de belasting berekend op de voet van [artikel 9][ref5],
      zoals dat luidt nadat de verlaging in werking is getreden.

      3 Bij ministeriële regeling kunnen in overleg met Onze Minister van Infrastructuur en Milieu nadere regels worden
      gesteld ter uitvoering van dit artikel.


