  - number: '15'
    text: |-
      1 Teruggaaf van belasting wordt, onder bij algemene maatregel van bestuur te stellen voorwaarden en beperkingen, op
      aanvraag verleend voor personenauto's, motorrijwielen en bestelauto's die:

      a. zijn ingericht om te worden gebruikt door de politie en als zodanig uiterlijk kenbaar zijn;

      b. zijn ingericht om te worden gebruikt door de brandweer en als zodanig uiterlijk kenbaar zijn;

      c. kennelijk zijn ingericht om te worden gebruikt door een invalide en zijn uitgerust met een elektromotor dan wel
      met een verbrandingsmotor met een cylinderinhoud van ten hoogste 250 cm³;

      d. zijn ingericht voor het vervoer van zieken en gewonden en als zodanig uiterlijk kenbaar zijn;

      e. zijn ingericht voor het vervoer van stoffelijke overschotten en als zodanig uiterlijk kenbaar zijn;

      f. zijn ingericht voor het vervoer van gevangenen en als zodanig uiterlijk kenbaar zijn;

      g. zijn ingericht en uitsluitend worden gebruikt voor het vervoer van rolstoelgebruikers in groepsverband;

      h. zijn ingericht voor het vervoer van zieke of gewonde dieren en als zodanig uiterlijk kenbaar zijn;

      i. zijn ingericht voor geldtransport en als zodanig uiterlijk kenbaar zijn.

      2 De teruggaaf wordt verleend aan degene op wiens naam het kenteken is gesteld.

      3 De inspecteur beslist op de aanvraag bij voor bezwaar vatbare beschikking.

      4 In geval voor een personenauto, een motorrijwiel of, gedurende de eerste vijf jaren na inschrijving in het in
      [artikel 1, tweede lid][ref1], bedoelde register, een bestelauto, niet langer wordt voldaan aan de voorwaarden
      en beperkingen voor teruggaaf, wordt vanaf dat moment het teruggegeven bedrag, nadat dit is verminderd met
      overeenkomstige toepassing van [artikel 10, zesde lid][ref2], als belasting verschuldigd. Artikel 10, derde,
      vierde, vijfde, zevende en achtste lid, is van overeenkomstige toepassing. De verschuldigd geworden belasting wordt
      door degene aan wie de teruggaaf is verleend, op aangifte voldaan binnen een maand na het moment dat niet langer
      aan de voorwaarden en beperkingen wordt voldaan.

      5 Bij wijziging van de tenaamstelling van een personenauto, motorrijwiel of bestelauto blijven, op daartoe gedaan
      gezamenlijk verzoek van degene op wiens naam het kenteken wordt gesteld en degene op wiens naam het kenteken
      daarvoor was gesteld, het eerste en vierde lid buiten toepassing indien overigens voldaan blijft worden aan de
      voorwaarden en beperkingen waaronder de teruggaaf is verleend. Bij inwilliging van het verzoek treedt degene op
      wiens naam het kenteken wordt gesteld vanaf het moment van de wijziging van de tenaamstelling voor de toepassing
      van dit artikel in de plaats van degene op wiens naam het kenteken daarvoor was gesteld. De inspecteur beslist op
      het verzoek bij voor bezwaar vatbare beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0005806#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005806#Artikel10
