  - number: '7'
    text: |-
      1 Indien voor een personenauto of een motorrijwiel de aanvraag voor de opgave van een kenteken
      geschiedt door een ander dan degene op wiens naam het kenteken wordt gesteld, is, in afwijking van
      [artikel 19, derde lid, van de Algemene wet inzake rijksbelastingen][ref1], die ander gehouden de belasting op
      aangifte te voldoen namens degene op wiens naam het kenteken wordt gesteld.

      2 Degene die voor een personenauto, een motorrijwiel of een bestelauto een aanvraag doet voor de opgave
      van een kenteken, is gehouden daarbij voor dat motorrijtuig het bedrag aan belasting ingevolge de
      [artikelen 9 tot en met 9c][ref2] op te geven.


