preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het met het oog op de opheffing van de fiscale grenzen binnen de
    Europese Gemeenschap wenselijk is het stelsel van heffing van de bijzondere verbruiksbelastingen van personenauto’s
    en van motorrijwielen te herzien, alsmede om deze belastingen op te nemen in een afzonderlijke wet en voorts dat
    het gewenst is in het tarief te differentiëren naar een milieu- en een energiegrondslag en het begrip personenauto
    nader te definiëren;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0005806/2012-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Onder de naam 'belasting van personenauto’s en motorrijwielen' wordt een belasting geheven met betrekking tot
      personenauto's, motorrijwielen en bestelauto's.

      2 De belasting is verschuldigd ter zake van de registratie van een personenauto, een motorrijwiel of een bestelauto
      in het krachtens de [Wegenverkeerswet 1994][ref1] aangehouden register van opgegeven kentekens.

      3 Ingeval een geregistreerd motorrijtuig zodanig wordt veranderd dat het de hoedanigheid verkrijgt van een
      personenauto, een motorrijwiel of een bestelauto, is de belasting verschuldigd ter zake van de registratie als
      personenauto, als motorrijwiel of als bestelauto dan wel, indien geen nieuw kenteken wordt opgegeven, ter zake van
      de aanvang van het gebruik als personenauto, motorrijwiel of bestelauto in Nederland van de weg in de zin van de
      [Wegenverkeerswet 1994][ref2].

      4 Ingeval een motorrijtuig als bedoeld in [artikel 9c ][ref3] in een zodanige staat wordt gebracht dat deze
      niet meer voldoet aan de in dat artikel genoemde voorwaarden, is de belasting verschuldigd ter zake van de
      aanvang van het gebruik met dit motorrijtuig in gewijzigde staat in Nederland van de weg in de zin van de
      [Wegenverkeerswet 1994][ref4].

      5 Ingeval de motor van een personenauto waarvan de belasting is bepaald op grond van de tabel in
      [artikel 9, eerste lid][ref5], tijdens de eerste drie jaren na het tijdstip van inschrijving in het register in een
      zodanige staat is gebracht dat de CO-uitstoot meer bedraagt dan de CO-uitstoot waarover de belasting is betaald,
      is het verschil tussen deze belasting en de belasting die zou zijn verschuldigd bij deze hogere CO-uitstoot
      verschuldigd ter zake van de aanvang van het gebruik met deze personenauto in gewijzigde staat in Nederland van de
      weg in de zin van de [Wegenverkeerswet 1994][ref6].

      6 Ingeval een niet geregistreerde personenauto, een niet geregistreerd motorrijwiel of een niet geregistreerde
      bestelauto feitelijk ter beschikking staat van een in Nederland wonende natuurlijke persoon of gevestigd lichaam,
      is de belasting verschuldigd ter zake van de aanvang van het gebruik met dat motorrijtuig in Nederland van de weg
      in de zin van de [Wegenverkeerswet 1994][ref7].

      7 Ingeval het kenteken van een motorrijtuig waarvoor eerder teruggaaf van belasting is verleend op de voet van
      [artikel 14a, eerste lid][ref8], opnieuw wordt te naam gesteld in het register, bedoeld in het tweede lid, is de
      belasting verschuldigd ter zake van de tenaamstelling.

      8 Ingeval een motorrijtuig waarvoor eerder teruggaaf van belasting is verleend op de voet van
      [artikel 14a, eerste of tweede lid][ref9], feitelijk ter beschikking staat van een in Nederland wonende
      natuurlijke persoon of gevestigd lichaam, zonder dat het kenteken opnieuw is te naam gesteld of het
      motorrijtuig wordt geregistreerd in het register, bedoeld in het tweede lid, is de belasting verschuldigd ter
      zake van de hernieuwde aanvang van het gebruik met dat motorrijtuig in Nederland van de weg in de zin van de
      [Wegenverkeerswet 1994][ref10].


