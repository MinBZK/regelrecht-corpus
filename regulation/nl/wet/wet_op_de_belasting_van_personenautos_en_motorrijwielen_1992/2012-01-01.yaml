  - number: '10'
    text: |-
      1 Met betrekking tot gebruikte personenauto's, gebruikte motorrijwielen of gebruikte bestelauto's wordt
      het bij de personenauto, het motorrijwiel of de bestelauto behorende bedrag aan belasting, bedoeld in
      [artikel 9, eerste en tweede lid][ref1], na toepassing van [artikel 9b][ref2], berekend met inachtneming van een
      vermindering.

      2 De vermindering, bedoeld in het eerste lid, is de afschrijving, uitgedrukt in procenten van de inkoopwaarde in
      Nederland op het tijdstip waarop het motorrijtuig voor het eerst in gebruik is genomen. Bij ministeriële regeling
      kunnen nadere regels worden gesteld met betrekking tot de wijze waarop de inkoopwaarde in Nederland en de op deze
      waarde gebaseerde afschrijving kunnen worden vastgesteld.

      3 Indien na het tijdstip waarop een bestelauto voor het eerst in gebruik is genomen, een tijdsduur is verstreken
      van 5 jaar of meer, bedraagt in afwijking van het tweede lid het percentage van de vermindering 100.

      4 Indien na het tijdstip waarop de personenauto of het motorrijwiel voor het eerst in gebruik is genomen, een
      tijdsduur is verstreken van 25 jaar of meer, bedraagt in afwijking van het tweede lid het percentage van de
      vermindering 100.

      5 Indien het tijdstip waarop de personenauto, het motorrijwiel of de bestelauto voor het eerst in gebruik is
      genomen niet bekend is, treedt daarvoor in de plaats de laatste dag van het jaar waarin de personenauto, het
      motorrijwiel of de bestelauto is vervaardigd.

      6 In afwijking van het tweede lid wordt de vermindering vastgesteld aan de hand van een bij ministeriële regeling
      vast te stellen tabel, indien daarop een beroep wordt gedaan in het aangiftebiljet.

      7 Bij de aangifte wordt een opgaaf gedaan van de gegevens die bij de aangifte zijn gebruikt voor het vaststellen
      van de afschrijving, bedoeld in het tweede lid, dan wel voor de toepassing van de tabel, bedoeld in het zesde
      lid. Wanneer naar het oordeel van de inspecteur gegevens ontbreken die van belang kunnen zijn voor de vaststelling
      van de in het eerste lid bedoelde vermindering, worden de ontbrekende gegevens toegevoegd. Gegevens die niet bij
      de aangifte zijn gebruikt voor het vaststellen van de afschrijving, en evenmin op verzoek van de inspecteur zijn
      toegevoegd, kunnen door degene die gehouden is de belasting op aangifte te voldoen niet op een later tijdstip
      alsnog worden gebruikt om de bij de aangifte toegepaste afschrijving te wijzigen.

      8 Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
      Daarbij kan de vermindering, bedoeld in het tweede lid, worden verhoogd voor motorrijtuigen als bedoeld in
      [artikel 15, eerste lid, onderdelen a, b, en g][ref3]. Voorts kan daarbij een termijn worden vastgesteld waarbinnen
      het motorrijtuig in ongewijzigde staat beschikbaar wordt gehouden voor controle met het oog op een juiste
      vaststelling van de afschrijving, bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005806#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0005806#Artikel9b
      [ref3]: https://wetten.overheid.nl/BWBR0005806#Artikel15
