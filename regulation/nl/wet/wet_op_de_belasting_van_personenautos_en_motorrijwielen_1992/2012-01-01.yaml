  - number: 9b
    text: |-
      1 Voor een personenauto die wordt aangedreven door een motor met compressieontsteking wordt het bedrag aan
      belasting, bedoeld in [artikel 9, eerste lid][ref1], verminderd met € 1 000, indien de personenauto voldoet aan
      de grenswaarden, genoemd in tabel 2 van bijlage I van Verordening (EG) nr. 715/2007 van het Europees parlement
      en de Raad van de Europese Gemeenschappen van 20 juni 2007 betreffende de typegoedkeuring van motorvoertuigen met
      betrekking tot emissies van lichte personen- en bedrijfsvoertuigen (Euro 5 en Euro 6) en de toegang tot reparatie-
      en onderhoudsinformatie (PBEG L 171).

      2 Een wijziging van de in het eerste lid genoemde verordening gaat voor de toepassing van het eerste lid gelden
      met ingang van de dag waarop aan de betrokken wijziging van de verordening uitvoering moet zijn gegeven, tenzij bij
      ministeriële regeling, die in de Staatscourant wordt bekendgemaakt, een ander tijdstip wordt vastgesteld.

      3 Bij ministeriële regeling worden nadere regels gesteld ter uitvoering van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0005806#Artikel9
    url: https://wetten.overheid.nl/BWBR0005806/2012-01-01#Artikel9b
    references:
      - id: ref1
        bwb_id: BWBR0005806
        artikel: '9'
        hoofdstuk: III
        afdeling: '2'
  - number: 9c
    text: |-
      1 In afwijking van [artikel 9, eerste en tweede lid][ref1], bedraagt de belasting tot 1 januari 2018 nihil voor een
      motorrijtuig met een CO-uitstoot van 0 gram per kilometer.

      2 In afwijking van [artikel 9, eerste lid][ref2], bedraagt de belasting nihil voor een personenauto met een CO-
      uitstoot van niet meer dan 110 gram per kilometer of, in geval van een personenauto die wordt aangedreven door een
      motor met een compressie-ontsteking dan wel een personenauto waarvan de CO-uitstoot met aardgas als brandstofsoort
      is gemeten, een CO-uitstoot van niet meer dan 95 gram per kilometer.

      3 [Artikel 9, tiende tot en met twaalfde lid][ref3], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005806#Artikel9
