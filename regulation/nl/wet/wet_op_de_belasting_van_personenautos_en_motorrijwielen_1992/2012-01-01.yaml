  - number: 10c
    text: |-
      1 Indien voor een gebruikt geregistreerd motorrijtuig de belasting is verschuldigd ingevolge
      [artikel 1, derde lid][ref1], wordt, in afwijking van [artikel 10, tweede lid][ref2], de vermindering, bedoeld in
      artikel 10, eerste lid, vastgesteld met overeenkomstige toepassing van artikel 10, zesde lid.

      2 Ingeval voor een motorrijtuig waarvoor de belasting is verschuldigd ingevolge [artikel 1, derde lid][ref3], de
      belasting al eerder is betaald, wordt, onder bij ministeriële regeling te stellen voorwaarden en beperkingen, de
      verschuldigde belasting verminderd met een bedrag ter zake van de eerder betaalde belasting.

      3 Indien een niet geregistreerd motorrijtuig zodanig wordt veranderd dat het de hoedanigheid verkrijgt van
      een personenauto, een motorrijwiel of een bestelauto, terwijl voor dat motorrijtuig de belasting al eerder
      is betaald, wordt, onder bij ministeriële regeling te stellen voorwaarden en beperkingen, de ingevolge
      [artikel 1, zesde lid][ref4], voor dat motorrijtuig verschuldigde belasting verminderd met een bedrag ter zake van
      de eerder betaalde belasting.

      4 De vermindering, bedoeld in het tweede en derde lid, bedraagt ten hoogste het bedrag van de verschuldigde
      belasting. De vermindering wordt voor een gebruikt motorrijtuig berekend met overeenkomstige toepassing van
      [artikel 14a, vierde lid][ref5].

      5 Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.


