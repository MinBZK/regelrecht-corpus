  - number: 13b
    text: |-
      1 In afwijking van [artikel 13a, derde lid][ref1], is het bedrag waarvan vrijstelling is verleend niet als
      belasting verschuldigd indien:

      a. de tenaamstelling van het kenteken in het register, bedoeld in [artikel 1, tweede lid][ref2], wordt beëindigd
      omdat de bestelauto buiten Nederland wordt gebracht;

      b. de tenaamstelling van het kenteken in het register, bedoeld in [artikel 1, tweede lid][ref3], wordt beëindigd
      omdat de bestelauto wordt gesloopt; of

      c. de bestelauto is gestolen en een melding van diefstal van de bestelauto is geplaatst in het register, bedoeld in
      [artikel 1, tweede lid][ref4].

      2 Het bedrag waarvan vrijstelling is verleend wordt, nadat dit is verminderd met overeenkomstige toepassing van
      [artikel 10, zesde lid][ref5], alsnog als belasting verschuldigd:

      a. op het moment van de tenaamstelling van het kenteken, indien na toepassing van het eerste lid, onderdeel a of b,
      het kenteken dat voor de bestelauto is opgegeven opnieuw wordt tenaamgesteld;

      b. op het moment van de hernieuwde aanvang van het gebruik met de bestelauto van de weg in de zin van de
      [Wegenverkeerswet 1994][ref6], indien na toepassing van het eerste lid, onderdeel a of b, de bestelauto feitelijk
      ter beschikking staat van een in Nederland wonende natuurlijke persoon of gevestigd lichaam, zonder dat het
      kenteken opnieuw te naam is gesteld;

      c. op het moment van de verwijdering van de melding van diefstal uit het register, indien na toepassing van het
      eerste lid, onderdeel c, de bestelauto wordt teruggevonden, met dien verstande dat geen belasting verschuldigd
      is als het kenteken op dat moment nog op naam staat van degene aan wie de vrijstelling is verleend en deze de
      teruggevonden bestelauto aansluitend opnieuw in gebruik neemt binnen de voorwaarden van de vrijstelling. In het
      laatste geval blijven de feiten die zich hebben voorgedaan in de periode dat de bestelauto was gestolen buiten
      beschouwing voor de vraag, of aan de voorwaarden en beperkingen van de vrijstelling wordt voldaan.

      3 Bij de toepassing van het tweede lid zijn de [artikelen 5][ref7], [6][ref8],
      [10, derde, vierde, vijfde en zevende lid][ref9], en [12b][ref10] van overeenkomstige toepassing, met dien
      verstande, dat bij de toepassing van het tweede lid, onderdeel c, de belasting wordt voldaan binnen een maand na de
      verwijdering van de melding van diefstal uit het register.

      4 Bij ministeriële regeling kunnen nadere regels worden gesteld ter uitvoering van dit artikel.


