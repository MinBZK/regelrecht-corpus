  - number: 14b
    text: |-
      1 Voor een motorrijtuig dat is geregistreerd in een andere lidstaat van de Europese Unie of een staat die partij is
      bij de Overeenkomst betreffende de Europese Economische Ruimte, en dat voor een periode van ten hoogste vier jaren
      wordt verhuurd aan een inwoner van Nederland door een in die andere staat gevestigde ondernemer als bedoeld in
      [artikel 7 van de Wet op de omzetbelasting 1968][ref1], wordt, onder bij algemene maatregel van bestuur te stellen
      voorwaarden en beperkingen, op verzoek de ingevolge [artikel 1, zesde lid][ref2], te betalen belasting op voorhand
      verrekend met de teruggaaf die op de voet van [artikel 14a][ref3] kan worden verleend als het motorrijtuig na
      afloop van de overeengekomen huurperiode weer buiten Nederland wordt gebracht.

      2 Ingeval op een later tijdstip een andere huurperiode voor het motorrijtuig wordt overeengekomen dan de
      eerder overeengekomen huurperiode, wordt het te verrekenen bedrag van de teruggaaf, bedoeld in het eerste lid,
      overeenkomstig herzien, met dien verstande dat bij een verkorting van de huurperiode het teveel betaalde gedeelte
      van de verschuldigde belasting op verzoek wordt teruggegeven, en bij een verlenging van de huurperiode de teveel
      verrekende belasting op aangifte wordt voldaan binnen een maand na het tijdstip waarop de andere huurperiode is
      overeengekomen.

      3 Indien voor een motorrijtuig niet langer wordt voldaan aan de voorwaarden en beperkingen voor de verrekening,
      wordt het te verrekenen bedrag van de teruggaaf, bedoeld in het eerste lid, herzien, met dien verstande dat het
      volledige door de verrekening nog niet betaalde gedeelte van de verschuldigde belasting op aangifte wordt voldaan
      binnen een maand na het tijdstip waarop niet langer aan de voorwaarden en beperkingen voor de verrekening wordt
      voldaan. De eerste volzin is mede van toepassing ingeval door een verandering van de overeengekomen huurperiode als
      bedoeld in het tweede lid, de totale overeengekomen huurperiode meer bedraagt dan vier jaren.

      4 Indien de overeengekomen huurperiode wordt gewijzigd, dan wel niet langer wordt voldaan aan de voorwaarden en
      beperkingen voor de verrekening, wordt dit door de huurder van het motorrijtuig onverwijld schriftelijk ter kennis
      gebracht van de inspecteur.

      5 Het te verrekenen bedrag van de teruggaaf, bedoeld in het eerste lid, dan wel het terug te geven bedrag ingevolge
      het tweede lid, wordt door de inspecteur vastgesteld bij voor bezwaar vatbare beschikking.

      6 De verrekening van de teruggaaf, bedoeld in het eerste lid, dan wel een herziening van deze verrekening
      ingevolge het tweede of derde lid, wordt voor de toepassing van deze wet aangemerkt als een teruggaaf ingevolge
      [artikel 14a][ref4], respectievelijk als een herziening van deze teruggaaf.

      7 Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005806#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0005806#Artikel14a
      [ref4]: https://wetten.overheid.nl/BWBR0005806#Artikel14a
