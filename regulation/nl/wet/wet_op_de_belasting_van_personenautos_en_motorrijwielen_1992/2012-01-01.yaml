  - number: 13a
    text: |-
      1 Vrijstelling van belasting wordt verleend voor bestelauto’s die op naam worden gesteld van een ondernemer
      als bedoeld in [artikel 7 van de Wet op de omzetbelasting 1968][ref1], die de bestelauto meer dan bijkomstig
      gebruikt in het kader van zijn onderneming. De vrijstelling wordt niet verleend indien het ondernemerschap voor de
      omzetbelasting voortvloeit uit het bepaalde in [artikel 7, zesde lid, van de Wet op de omzetbelasting 1968][ref2].

      2 Voor een bestelauto die door een ondernemer als bedoeld in het eerste lid voor een langere dan een bij
      ministeriële regeling vast te stellen periode ter beschikking wordt gesteld aan een andere persoon, wordt de
      vrijstelling slechts verleend indien deze andere persoon, behoudens de tenaamstelling, voldoet aan de voorwaarden
      en beperkingen voor de vrijstelling.

      3 Indien tijdens de eerste vijf jaren na het tijdstip waarop de bestelauto is ingeschreven in het register,
      bedoeld in [artikel 1, tweede lid][ref3], niet of niet langer wordt voldaan aan de voorwaarden en beperkingen
      voor de vrijstelling, wordt vanaf dat moment het bedrag waarvan vrijstelling is verleend, nadat dit is verminderd
      met overeenkomstige toepassing van [artikel 10, zesde lid][ref4], als belasting verschuldigd. Artikel 10, derde,
      vierde, vijfde en zevende lid, is van overeenkomstige toepassing. De verschuldigd geworden belasting wordt door
      de ondernemer, bedoeld in het eerste lid, op aangifte voldaan binnen een maand na het tijdstip waarop niet of niet
      langer aan de voorwaarden en beperkingen voor de vrijstelling wordt voldaan.

      4 Indien bij wijziging van de tenaamstelling van de bestelauto overigens voldaan blijft worden aan de voorwaarden
      en beperkingen van de vrijstelling blijft, onder bij algemene maatregel van bestuur te stellen voorwaarden en
      beperkingen, het derde lid buiten toepassing. Alsdan treedt degene op wiens naam het kenteken wordt gesteld, vanaf
      het moment van de wijziging van de tenaamstelling voor de toepassing van dit artikel in de plaats van degene op
      wiens naam het kenteken daarvoor was gesteld.

      5 Ingeval een bestelauto waarvoor vrijstelling is verleend op de voet van dit artikel in een zodanige staat wordt
      gebracht dat het een personenauto is, zijn, in afwijking van het derde lid, de [artikelen 1, derde lid][ref5], en
      [12a][ref6] van overeenkomstige toepassing.

      6 Indien één of meer personen worden vervoerd in de laadruimte van een bestelauto, vormt dit een verzuim ter zake
      waarvan de inspecteur aan degene die de bestelauto feitelijk ter beschikking heeft, een bestuurlijke boete van €
      492 kan opleggen. De bevoegdheid tot het opleggen van de bestuurlijke boete vervalt door het verloop van een jaar
      na het constateren van het verzuim, bedoeld in de vorige volzin.

      7 [Artikel 67cb van de Algemene wet inzake rijksbelastingen][ref7] is van overeenkomstige toepassing op het bedrag
      van de boete, genoemd in het zesde lid.

      8 Het tweede tot en met zesde lid zijn van overeenkomstige toepassing ten aanzien van bestelauto’s waarvoor
      teruggaaf van belasting is verleend ingevolge [artikel 15b][ref8], zoals dat artikel luidde van 1 juli 2005 tot de
      datum van inwerkingtreding van dit artikel.


