  - number: '14'
    text: |-
      1 Bij algemene maatregel van bestuur kan, onder daarbij te stellen voorwaarden en beperkingen, vrijstelling van
      belasting worden verleend voor uit een ander land afkomstige personenauto's, motorrijwielen en bestelauto's die
      voor specifieke doeleinden, dan wel onder specifieke omstandigheden naar Nederland zijn gebracht.

      2 Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van de in het eerste
      lid bedoelde algemene maatregel van bestuur.

      3 [Paragraaf 4.1.3.3 van de Algemene wet bestuursrecht][ref1] is van toepassing op verzoeken aan de inspecteur tot
      vrijstelling voor specifieke doeleinden op grond van bepalingen krachtens het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0005806/2012-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: 14a
    text: |-
      1 Teruggaaf van belasting wordt, onder bij algemene maatregel van bestuur te stellen voorwaarden en beperkingen,
      op aanvraag verleend voor personenauto’s, motorrijwielen en bestelauto’s indien de tenaamstelling van het kenteken
      in het in [artikel 1, tweede lid][ref1], bedoelde register wordt beëindigd omdat het motorrijtuig buiten Nederland
      wordt gebracht, en het motorrijtuig wordt geregistreerd in een andere lidstaat van de Europese Unie of een staat
      die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte. De teruggaaf wordt verleend aan
      degene op wiens naam het kenteken was gesteld direct voorafgaand aan de beëindiging van de tenaamstelling in het
      register.

      2 Teruggaaf van belasting wordt, onder bij algemene maatregel van bestuur te stellen voorwaarden en beperkingen, op
      aanvraag verleend voor in een andere lidstaat van de Europese Unie of een staat die partij is bij de Overeenkomst
      betreffende de Europese Economische Ruimte geregistreerde personenauto’s, motorrijwielen en bestelauto’s waarvoor
      de belasting is geheven ter zake van de aanvang van het gebruik in Nederland met dat motorrijtuig van de weg door
      een in Nederland wonende natuurlijke persoon of gevestigd lichaam, indien het motorrijtuig niet langer feitelijk
      ter beschikking staat van de in Nederland wonende natuurlijke persoon of het in Nederland gevestigde lichaam en
      het motorrijtuig weer buiten Nederland is gebracht. De teruggaaf wordt verleend aan degene van wie de belasting
      ingevolge [artikel 5, tweede lid][ref2], is geheven.

      3 De teruggaaf, bedoeld in het eerste en tweede lid, wordt uitsluitend verleend indien de belasting is betaald
      ter zake van de registratie van het motorrijtuig of de tenaamstelling van het kenteken, dan wel de aanvang van het
      gebruik in Nederland met het motorrijtuig van de weg, op of na 16 oktober 2006.

      4 De teruggaaf bedraagt het belastingbedrag, nadat dit is verminderd overeenkomstig een bij ministeriële
      regeling vast te stellen tabel. Ingeval voor het motorrijtuig al eerder teruggaaf van de belasting is verleend,
      wordt de teruggaaf slechts verleend voorzover de eerder teruggegeven belasting op een later tijdstip alsnog als
      verschuldigde belasting is voldaan.

      5 Bedragen van minder dan € 50 worden niet teruggegeven.

      6 Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0005806#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005806#Artikel5
