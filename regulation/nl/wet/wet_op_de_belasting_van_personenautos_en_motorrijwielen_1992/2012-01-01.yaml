  - number: '8'
    text: |-
      In afwijking van [artikel 6, tweede lid, onderdeel ][ref1], kan de inspecteur, onder bij ministeriële regeling
      te stellen voorwaarden en beperkingen, een ondernemer die in het kader van zijn bedrijfsuitoefening regelmatig om
      opgave van een kenteken verzoekt voor personenauto’s of motorrijwielen waarvan het kenteken op naam van een ander
      wordt gesteld, op aanvraag bij voor bezwaar vatbare beschikking toestaan de belasting per tijdvak te voldoen.


