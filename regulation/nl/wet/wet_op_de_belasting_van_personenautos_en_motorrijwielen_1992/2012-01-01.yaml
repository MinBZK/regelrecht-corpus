  - number: '5'
    text: |-
      1 Met betrekking tot een geregistreerde personenauto, een geregistreerd motorrijwiel of een geregistreerde
      bestelauto wordt de belasting geheven van degene op wiens naam het kenteken wordt dan wel is gesteld.

      2 Met betrekking tot een niet geregistreerde personenauto, een niet geregistreerd motorrijwiel of een niet
      geregistreerde bestelauto wordt de belasting geheven van degene die het motorrijtuig feitelijk ter beschikking
      heeft.
    url: https://wetten.overheid.nl/BWBR0005806/2012-01-01#Artikel5
  - number: '6'
    text: |-
      1 De belasting moet op aangifte worden voldaan.

      2 In afwijking van [artikel 10, tweede lid][ref1], en
      [artikel 19, derde lid, van de Algemene wet inzake rijksbelastingen][ref2]:

      a. moet de belasting, indien deze verschuldigd is:

      1°. ter zake van de registratie van een personenauto of motorrijwiel, worden betaald voordat het kenteken op naam
      is gesteld;

      2°. ter zake van de registratie van een bestelauto, worden betaald binnen een maand na het tijdstip waarop het
      kenteken op naam is gesteld;

      3°. ter zake van de aanvang van het gebruik van de weg, worden betaald vóór de aanvang van dat gebruik;

      b. wordt de aangifte gelijktijdig met de betaling gedaan.

      3 In afwijking van het tweede lid, onderdeel a, onder 3°, behoeft, ingeval de eenheid van de Belastingdienst waar
      aangifte moet worden gedaan ter zake van de aanvang van het gebruik van de weg, gesloten is op de dag waarop dan
      wel op de dag vóórdat het gebruik aanvangt, de belasting pas te worden betaald op de eerste dag waarop die eenheid
      na de aanvang van het gebruik is geopend.

      4 Indien in een geval als bedoeld in het derde lid, degene die de feitelijke beschikking heeft over een
      niet geregistreerde personenauto, een niet geregistreerd motorrijwiel of een niet geregistreerde bestelauto
      bij controle door ambtenaren van de rijksbelastingdienst of door opsporingsambtenaren als bedoeld in
      [artikel 141 van het Wetboek van Strafvordering][ref3] niet aannemelijk maakt dat de belasting is betaald, dient de
      belasting terstond te worden betaald.

      5 Voor de toepassing van dit artikel wordt onder registratie mede verstaan de tenaamstelling van het kenteken
      in het register, bedoeld in [artikel 1, tweede lid][ref4], ingeval voor een eerder geregistreerd motorrijtuig de
      belasting verschuldigd wordt ter zake van het opnieuw te naam stellen van het kenteken.


