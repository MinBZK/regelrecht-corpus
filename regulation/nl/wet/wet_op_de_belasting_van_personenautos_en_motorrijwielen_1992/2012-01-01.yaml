  - number: '17'
    text: |-
      1 Degene, aan wie op de voet van [artikel 8][ref1] is toegestaan de belasting per tijdvak te voldoen, stelt
      zekerheid voor de belasting die hij verschuldigd is of kan worden.

      2 Het bedrag van de zekerheid wordt door de inspecteur vastgesteld bij voor bezwaar vatbare beschikking.

      3 Bij ministeriële regeling kunnen nadere regels worden gesteld voor de bepaling van de hoogte van het bedrag van
      de zekerheid.

      4 De zekerheid wordt gesteld bij de ontvanger.

      5 De ontvanger beslist of de vorm van zekerheid die wordt aangeboden, wordt aanvaard.

      6 De aan het stellen van zekerheid verbonden kosten komen ten laste van degene aan wie de vergunning is verleend.

      7 Ingeval de zekerheid wordt gesteld in geld wordt daarover een rente vergoed die gelijk is aan de
      herfinancieringsrente, te weten de minimale biedrente die de Europese Centrale Bank hanteert voor
      basisherfinancieringstransacties.

      8 Voor de toepassing van het zevende lid wordt het over een kalendermaand te vergoeden rentebedrag berekend naar de
      rente die geldt bij de aanvang van die maand.


      [ref1]: https://wetten.overheid.nl/BWBR0005806#Artikel8
