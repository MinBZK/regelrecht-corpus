      Voor de toepassing van de tabel wordt onder een personenauto die wordt aangedreven door een motor met compressie-
      ontsteking mede begrepen een personenauto waarvan de CO-uitstoot met aardgas als brandstofsoort is gemeten.

      Het bedrag van de belasting op grond van de tabel wordt verhoogd met 11,1 percent van de netto catalogusprijs en:

      a. verminderd met € 450;

      b. in geval van een personenauto waarvan de CO-uitstoot met aardgas als brandstof is gemeten, verminderd met €
      950; of

      c. in geval van een personenauto die wordt aangedreven door een motor met een compressieontsteking vermeerderd met
      € 1 900.

      In afwijking van de vorige volzinnen wordt onder personenauto niet verstaan een bijzondere personenauto als bedoeld
      in het twaalfde lid.

      2 De belasting bedraagt:

      a. voor een bestelauto of een bijzondere personenauto als bedoeld in het twaalfde lid 37,7 percent van de netto
      catalogusprijs, verminderd met € 1 283, dan wel, ingeval van een bestelauto of bijzondere personenauto die wordt
      aangedreven door een motor met een compressieontsteking 37,7 percent van de netto catalogusprijs, vermeerderd met
      € 273;

      b. voor een motorrijwiel:

      1°. met een netto catalogusprijs van niet meer dan € 2 133: 9,6 percent van de netto catalogusprijs;

      2°. met een netto catalogusprijs van meer dan € 2 133: 19,4 percent van de netto catalogusprijs, verminderd met
      € 210.

      3 Onder de netto catalogusprijs wordt verstaan de catalogusprijs verminderd met de daarin begrepen omzetbelasting.

      4 Onder catalogusprijs wordt verstaan de in Nederland door de fabrikant of importeur aan wederverkopers kenbaar
      gemaakte prijs welke naar zijn inzicht bij verkoop aan de uiteindelijke afnemer valt te berekenen. In die
      geadviseerde verkoopprijs is de belasting van personenauto’s en motorrijwielen zelf niet begrepen. Is een zodanige
      prijs niet bekend, dan wordt hij door vergelijking bepaald.

      5 Voor een nieuwe personenauto, een nieuw motorrijwiel of een nieuwe bestelauto geldt de catalogusprijs bij aanvang
      van de dag waarop aan de personenauto, het motorrijwiel of de bestelauto een kenteken wordt toegekend.

      6 Voor een gebruikte personenauto, een gebruikt motorrijwiel of een gebruikte bestelauto geldt de catalogusprijs
      van het tijdstip waarop de personenauto, het motorrijwiel of de bestelauto voor het eerst in gebruik is
      genomen. Indien dit tijdstip niet bekend is, treedt daarvoor in de plaats de laatste dag van het jaar waarin de
      personenauto, het motorrijwiel of de bestelauto is vervaardigd.

      7 Voor een ander motorrijtuig dan een personenauto, een motorrijwiel of een bestelauto, dat in een zodanige staat
      wordt gebracht dat het een personenauto, een motorrijwiel of een bestelauto is, geldt de catalogusprijs als ware
      het een personenauto, een motorrijwiel of een bestelauto van het tijdstip waarop het motorrijtuig voor het eerst
      in gebruik is genomen. Indien dit tijdstip niet bekend is, treedt daarvoor in de plaats de laatste dag van het jaar
      waarin het motorrijtuig is vervaardigd.

      8 Indien het tijdstip, bedoeld in het zesde en zevende lid, is gelegen voor 1 januari 1993, dan wordt uit de
      prijs, bedoeld in het vierde lid, de bijzondere verbruiksbelasting van personenauto’s dan wel de bijzondere
      verbruiksbelasting van motorrijwielen afgezonderd.

      9 Wanneer een personenauto, een motorrijwiel of een bestelauto een bijzondere uitvoering heeft of is voorzien van
      extra toebehoren, wordt de waarde daarvan in de catalogusprijs begrepen, uitgezonderd de waarde van voorzieningen
      die niet zijn aangebracht door of namens de fabrikant of de importeur.

      10 Voor de toepassing van dit artikel is de CO-uitstoot van een personenauto, de CO-uitstoot gemeten overeenkomstig
      richtlijn nr. 80/1268/EEG van de Raad van de Europese Gemeenschappen van 16 december 1980 betreffende de onderlinge
      aanpassing van de wetgevingen der Lid-Staten inzake het brandstofverbruik van motorvoertuigen (PbEG L 375). Indien
      de meting met LPG of aardgas als brandstof is uitgevoerd, wordt de CO-uitstoot van de auto met LPG of aardgas als
      brandstofsoort gehanteerd.

      11 Indien voor de toepassing van dit artikel de CO-uitstoot van een personenauto niet op een bij ministeriële
      regeling voorgeschreven wijze is aangetoond, wordt deze gesteld op 350 gram per kilometer respectievelijk 302 gram
      per kilometer voor een personenauto die wordt aangedreven door een motor met compressieontsteking.

      12 Voor de toepassing van dit artikel wordt onder bijzondere personenauto verstaan een personenauto die valt onder
      richtlijn 2002/24/EEG, alsmede een personenauto die een voertuig voor speciale doeleinden is zoals omschreven
      in Bijlage II, onderdeel A, punt 5, van richtlijn 2007/46/EG, waarbij voor de kampeerauto geldt dat deze voldoet
      aan de eisen gesteld in [artikel 23a van de Wet op de motorrijtuigenbelasting 1994][ref1] en de daarop berustende
      bepalingen.


      [ref1]: https://wetten.overheid.nl/BWBR0006324#Artikel23a
