  - number: 10a
    text: |-
      1 In afwijking van [artikel 10, tweede lid][ref1], wordt de vermindering, bedoeld in artikel 10, eerste lid,
      vastgesteld aan de hand van een bij ministeriële regeling vast te stellen tabel, indien met betrekking tot
      de gebruikte personenauto, het gebruikte motorrijwiel of de gebruikte bestelauto voorafgaand aan de heffing
      [artikel 14a][ref2] is toegepast en het toenmalige buiten Nederland brengen in de zin van artikel 14a, eerste of
      tweede lid, is gedaan met het oogmerk dat het motorrijtuig opnieuw wordt te naam gesteld in het register, bedoeld
      in [artikel 1, tweede lid][ref3], dan wel feitelijke ter beschikking komt te staan van een in Nederland wonende
      natuurlijke persoon of gevestigd lichaam, als bedoeld in artikel 1, achtste lid.

      2 Het oogmerk, bedoeld in het eerste lid, wordt geacht aanwezig te zijn geweest indien de belasting ingevolge
      [artikel 1, zevende of achtste lid][ref4], wordt verschuldigd binnen zes maanden na het tijdstip waarop de in
      [artikel 14a, eerste lid][ref5], bedoelde tenaamstelling is beëindigd dan wel het tijdstip waarop het motorrijtuig
      niet langer feitelijk ter beschikking staat als bedoeld in artikel 14a, tweede lid, en weer buiten Nederland
      is gebracht, tenzij degene van wie de belasting wordt geheven aannemelijk maakt dat dit oogmerk op dat tijdstip
      ontbrak.


