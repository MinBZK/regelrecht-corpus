  - number: 15a
    text: |-
      1 Teruggaaf van belasting wordt, onder bij algemene maatregel van bestuur te stellen voorwaarden en beperkingen, op
      aanvraag verleend voor bestelauto's die zijn ingericht om te worden gebruikt voor het vervoer van een gehandicapte
      persoon in de cabine en voor het gelijktijdige vervoer van een niet-opvouwbare rolstoel ten behoeve van die
      persoon.

      2 In afwijking van het eerste lid wordt de teruggaaf voorts verleend, indien de laadruimte van de bestelauto in
      afwijking van [artikel 3, derde lid][ref1], ten gevolge van aanpassing van de bestelauto in verband met de handicap
      van de in het eerste lid bedoelde persoon, niet langer van de bestuurdersplaats onderscheidenlijk de cabine is
      afgescheiden of niet in haar geheel is voorzien van een vlakke laadvloer.

      3 Indien de gehandicapte een ander is dan degene op wiens naam het kenteken is gesteld, is het eerste lid slechts
      van toepassing indien de aanvraag als bedoeld in het eerste lid wordt gedaan door die ander en de gehandicapte
      gezamenlijk.

      4 De teruggaaf wordt verleend aan degene op wiens naam het kenteken is gesteld.

      5 De inspecteur beslist op de aanvraag bij voor bezwaar vatbare beschikking.

      6 De aanspraak op teruggaaf ontstaat op het tijdstip waarop aan de voorwaarden en beperkingen voor teruggaaf als
      bedoeld in het eerste lid wordt voldaan.

      7 Indien het in het zesde lid bedoelde tijdstip is gelegen na het tijdstip waarop de bestelauto is ingeschreven
      in het in [artikel 1, tweede lid][ref2], bedoelde register, bedraagt de teruggaaf het belastingbedrag nadat dit is
      verminderd overeenkomstig een bij ministeriële regeling vast te stellen tabel, met dien verstande dat ingeval voor
      de bestelauto al eerder teruggaaf is verleend, de teruggaaf niet meer bedraagt dan dit belastingbedrag verminderd
      met de eerdere teruggaven, voor zover de eerder teruggegeven bedragen niet later alsnog als verschuldigde belasting
      zijn voldaan.

      8 Ingeval voor een bestelauto waarvoor teruggaaf is verleend, gedurende de eerste vijf jaren na registratie in het
      in [artikel 1, tweede lid][ref3], bedoelde register, niet langer wordt voldaan aan de voorwaarden en beperkingen
      voor de teruggaaf, is vanaf dat moment het teruggegeven bedrag, nadat dit is verminderd met overeenkomstige
      toepassing van [artikel 10, zesde lid][ref4], als belasting verschuldigd. Belasting is eveneens verschuldigd,
      met overeenkomstige toepassing van artikel 10, eerste en zesde lid, ingeval een bestelauto waarvoor teruggaaf is
      verleend in een zodanige staat wordt gebracht, anders dan door een aanpassing als bedoeld in het tweede lid, dat
      het een personenauto is. De verschuldigd geworden belasting wordt door degene aan wie de teruggaaf is verleend, op
      aangifte voldaan binnen een maand nadat niet meer aan de in de eerste volzin bedoelde voorwaarden en beperkingen
      wordt voldaan, onderscheidenlijk vóór aanvang van het gebruik van de weg met de in de tweede volzin bedoelde
      personenauto. De artikelen 10, derde, vierde, vijfde en zevende lid, en [12a][ref5] zijn van overeenkomstige
      toepassing.

      9 Bij wijziging van de tenaamstelling van een bestelauto blijven, op daartoe gedaan gezamenlijk verzoek van degene
      op wiens naam het kenteken wordt gesteld en degene op wiens naam het kenteken daarvoor was gesteld, het eerste en
      achtste lid buiten toepassing indien overigens voldaan blijft worden aan de voorwaarden en beperkingen waaronder
      de teruggaaf is verleend. Bij inwilliging van het verzoek treedt degene op wiens naam het kenteken wordt gesteld
      vanaf het moment van de wijziging van de tenaamstelling voor de toepassing van dit artikel in de plaats van degene
      op wiens naam het kenteken daarvoor was gesteld. De inspecteur beslist op het verzoek bij voor bezwaar vatbare
      beschikking.

      10 In geval niet meer wordt voldaan aan de voorwaarden en beperkingen voor de teruggaaf doordat de gehandicapte
      is overleden, wordt in afwijking van het achtste lid, het teruggegeven bedrag niet als belasting verschuldigd
      zolang de tenaamstelling van het kenteken niet wordt gewijzigd en de bestelauto uitsluitend wordt gebruikt voor het
      persoonlijk gebruik van degene op wiens naam het kenteken is gesteld, gebruik door inwonende gezinsleden daaronder
      begrepen. Indien de teruggaaf is verleend aan de gehandicapte en het kenteken na diens overlijden op naam wordt
      gesteld van een inwonend gezinslid van het gezin waartoe de gehandicapte behoorde, is de vorige volzin op daartoe
      gedaan verzoek van degene op wiens naam het kenteken wordt gesteld van overeenkomstige toepassing. De inspecteur
      beslist op het verzoek bij voor bezwaar vatbare beschikking. Bij inwilliging van het verzoek treedt vanaf de datum
      van de beschikking degene op wiens naam het kenteken is gesteld voor de toepassing van dit artikel in de plaats
      van degene aan wie de teruggaaf is verleend. Ingeval gedurende de eerste vijf jaren na registratie in het in
      [artikel 1, tweede lid][ref6], bedoelde register, niet langer wordt voldaan aan de in dit lid gestelde voorwaarden
      en beperkingen, wordt het teruggegeven bedrag alsnog als belasting verschuldigd. Het achtste en negende lid zijn
      van overeenkomstige toepassing.

      11 Indien een of meer personen worden vervoerd in de laadruimte van een bestelauto, vormt dit een verzuim ter zake
      waarvan de inspecteur aan degene die het motorrijtuig feitelijk ter beschikking heeft een bestuurlijke boete van
      ten hoogste € 492 kan opleggen. De bevoegdheid tot het opleggen van de bestuurlijke boete vervalt door verloop van
      een jaar na het constateren van het in de vorige volzin bedoelde verzuim.

      12 [Artikel 67cb van de Algemene wet inzake rijksbelastingen][ref7] is van overeenkomstige toepassing op het bedrag
      van de boete, genoemd in het elfde lid.

      13 Bij ministeriële regeling kunnen nadere regels worden gesteld ter uitvoering van dit artikel.


