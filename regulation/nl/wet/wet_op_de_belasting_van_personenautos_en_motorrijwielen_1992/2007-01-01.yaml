---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_op_de_belasting_van_personenautos_en_motorrijwielen_1992
regulatory_layer: WET
publication_date: '2024-12-24'
valid_from: '2007-01-01'
bwb_id: BWBR0005806
url: https://wetten.overheid.nl/BWBR0005806/2007-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het met het oog op de opheffing van de fiscale grenzen binnen de
    Europese Gemeenschap wenselijk is het stelsel van heffing van de bijzondere verbruiksbelastingen van personenauto’s
    en van motorrijwielen te herzien, alsmede om deze belastingen op te nemen in een afzonderlijke wet en voorts dat
    het gewenst is in het tarief te differentiëren naar een milieu- en een energiegrondslag en het begrip personenauto
    nader te definiëren;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      Onder de naam 'belasting van personenauto’s en motorrijwielen' wordt een belasting geheven met betrekking tot
      personenauto's, motorrijwielen en bestelauto's.
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel1
  - number: '1.2'
    text: |-
      De belasting is verschuldigd ter zake van de registratie van een personenauto, een motorrijwiel of een bestelauto
      in het krachtens de [Wegenverkeerswet 1994][ref1] aangehouden register van opgegeven kentekens.


      [ref1]: https://wetten.overheid.nl/BWBR0006622
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006622
  - number: '1.3'
    text: |-
      Ingeval een geregistreerd ander motorrijtuig dan een personenauto, een motorrijwiel of een bestelauto in een
      zodanige staat wordt gebracht dat het een personenauto, een motorrijwiel of een bestelauto is, is de belasting
      verschuldigd ter zake van de registratie als personenauto, als motorrijwiel of als bestelauto dan wel, indien
      geen nieuw kenteken wordt opgegeven, ter zake van de aanvang van het gebruik als personenauto, motorrijwiel of
      bestelauto in Nederland van de weg in de zin van de [Wegenverkeerswet 1994][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006622
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006622
  - number: '1.4'
    text: |-
      Ingeval een geregistreerde personenauto of een geregistreerde bestelauto als bedoeld in [artikel 9c ][ref1] in
      een zodanige staat wordt gebracht dat deze niet meer voldoet aan de in dat artikel genoemde voorwaarden, is de
      belasting verschuldigd ter zake van de aanvang van het gebruik met deze personenauto of met deze bestelauto in
      gewijzigde staat in Nederland van de weg in de zin van de [Wegenverkeerswet 1994][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005806#Artikel9c
      [ref2]: https://wetten.overheid.nl/BWBR0006622
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005806
        artikel: 9c
        hoofdstuk: III
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0006622
  - number: '1.5'
    text: |-
      Ingeval een niet geregistreerde personenauto, een niet geregistreerd motorrijwiel of een niet geregistreerde
      bestelauto feitelijk ter beschikking staat van een in Nederland wonende natuurlijke persoon of gevestigd lichaam,
      is de belasting verschuldigd ter zake van de aanvang van het gebruik met dat motorrijtuig in Nederland van de weg
      in de zin van de [Wegenverkeerswet 1994][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006622
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006622
  - number: '2'
    text: |-
      In deze wet en in de daarop gebaseerde regelingen wordt verstaan onder registreren of registratie het opnemen van
      de bij een motorrijtuig behorende gegevens in het krachtens de [Wegenverkeerswet 1994][ref1] aangehouden register
      van opgegeven kentekens.


      [ref1]: https://wetten.overheid.nl/BWBR0006622
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006622
  - number: '3.1'
    text: |-
      Onder personenauto wordt in deze wet en in de daarop gebaseerde regelingen verstaan een motorrijtuig op drie of
      meer wielen, zulks met uitzondering van:
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel3
  - number: 3.1.a
    text: autobussen;
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel3
  - number: 3.1.b
    text: bestelauto's;
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel3
  - number: 3.1.c
    text: |-
      motorrijtuigen, niet ingericht voor het vervoer van personen, met een toegestane maximum massa van meer dan 3500
      kg; en
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel3
  - number: 3.1.d
    text: |-
      bromfietsen in de zin van [artikel 1, eerste lid, onderdeel e, van de Wegenverkeerswet 1994][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel1
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '1'
  - number: '3.2'
    text: |-
      Onder autobus wordt verstaan een motorrijtuig, ingericht voor het vervoer van meer dan acht personen, de bestuurder
      daaronder niet begrepen.
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel3
  - number: '3.3'
    text: |-
      Onder bestelauto wordt verstaan een motorrijtuig met een laadruimte die in haar geheel is voorzien van een vlakke
      laadvloer en die:
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel3
  - number: 3.3.a
    text: |-
      een lengte heeft van ten minste 200 cm en over ten minste 200 cm van de lengte en over ten minste 20 cm van de
      breedte een hoogte heeft van ten minste 130 cm; dan wel
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel3
  - number: 3.3.b
    text: 'ingeval de laadruimte minder dan 25 cm hoger is dan de cabine:'
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel3
  - number: 3.3.b.1°
    text: |-
      een lengte heeft van ten minste 125 cm en over ten minste 125 cm van de lengte en over ten minste 20 cm van de
      breedte een hoogte heeft van ten minste 98 cm; en
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel3
  - number: 3.3.b.2°
    text: |-
      van de bestuurderszitplaats is afgescheiden door een vaste wand over ten minste de gehele breedte van de cabine,
      welke wand direct achter de zitplaats is aangebracht en ten minste dezelfde hoogte heeft als de bestuurderscabine;
      en
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel3
  - number: 3.3.b.3°
    text: |-
      niet is voorzien van zijruiten dan wel is voorzien van niet meer dan één aan de rechterzijde van de laadruimte
      aangebrachte zijruit; dan wel
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel3
  - number: 3.3.c
    text: 'ingeval de laadruimte ten minste 25 cm hoger is dan de cabine:'
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel3
  - number: 3.3.c.1°
    text: |-
      een lengte heeft van ten minste 125 cm en over ten minste 125 cm van de lengte en over ten minste 20 cm van de
      breedte een hoogte heeft van ten minste 98 cm; en
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel3
  - number: 3.3.c.2°
    text: |-
      van de bestuurderszitplaats is afgescheiden door een vaste wand over ten minste de gehele breedte van de cabine,
      welke wand direct achter de bestuurderszitplaats is aangebracht en een hoogte heeft van ten minste 30 cm; en
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel3
  - number: 3.3.c.3°
    text: |-
      niet is voorzien van zijruiten dan wel is voorzien van niet meer dan één aan de rechterzijde van de laadruimte
      aangebrachte zijruit; dan wel
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel3
  - number: 3.3.d
    text: |-
      ingeval het motorrijtuig een dubbele cabine heeft met zitruimte achter de bestuurder voor één rij naast elkaar in
      de rijrichting zittende personen:
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel3
  - number: 3.3.d.1°
    text: |-
      over ten minste 150 cm van de lengte en over ten minste 20 cm van de breedte een hoogte heeft van ten minste 130
      cm; en
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel3
  - number: 3.3.d.2°
    text: 'voor ten minste 40 percent van de lengte voor het hart van de achterste as is geplaatst en een lengte heeft van:'
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel3
  - number: 3.3.d.2°.I
    text: ten minste 150 cm; en
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel3
  - number: 3.3.d.2°.II
    text: |-
      ten minste twee derde van de lengte die de laadruimte zou hebben indien de zitruimte achter de bestuurder zou
      ontbreken; en
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel3
  - number: 3.3.d.2°.III
    text: ten minste twee maal die van de cabine, tenzij de cabine een hoogte heeft van ten minste 130 cm; en
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel3
  - number: 3.3.d.3°
    text: |-
      van de cabine is afgescheiden door een vaste wand over ten minste de gehele breedte van de cabine, welke wand
      direct achter de zitruimte is aangebracht en ten minste dezelfde hoogte heeft als de cabine; en
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel3
  - number: 3.3.d.4°
    text: |-
      niet is voorzien van zijruiten dan wel is voorzien van niet meer dan één aan de rechterzijde van de laadruimte
      aangebrachte zijruit.
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel3
  - number: '3.4'
    text: |-
      Onder toegestane maximum massa wordt verstaan de massa van het motorrijtuig in bedrijfsvaardige staat met inbegrip
      van de bedrijfsstoffen, reservedelen en gereedschappen die behoren tot de normale uitrusting, vermeerderd met de
      voor het motorrijtuig toegestane maximum massa aan lading.
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel3
  - number: '3.5'
    text: 'Bij ministeriële regeling worden regels gesteld met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel3
  - number: 3.5.a
    text: |-
      de wijze waarop de hoogte en de lengte van de laadruimte en van de cabine worden vastgesteld alsmede op welke wijze
      het verschil in hoogte tussen de cabine en de laadruimte wordt vastgesteld;
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel3
  - number: 3.5.b
    text: de constructie-technische afwerking van de laadruimte;
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel3
  - number: 3.5.c
    text: de hoogte, de plaats, de constructiewijze en de bevestigingswijze van de vaste wand.
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel3
  - number: '4.1'
    text: |-
      In deze wet en in de daarop gebaseerde regelingen wordt verstaan onder motorrijwiel een motorrijtuig op twee
      wielen, alsmede een dergelijk motorrijtuig dat is verbonden met een zijspanwagen. Onder motorrijwiel wordt niet
      verstaan een bromfiets in de zin van [artikel 1, eerste lid, onderdeel e, van de Wegenverkeerswet 1994][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel1
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '1'
  - number: '4.2'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld ingevolge welke met een motorrijwiel worden gelijkgesteld
      motorrijtuigen op meer dan twee wielen die uit hoofde van hun bouw overeenkomst vertonen met een motorrijwiel.
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel4
  - number: '5.1'
    text: |-
      Met betrekking tot een geregistreerde personenauto, een geregistreerd motorrijwiel of een geregistreerde bestelauto
      wordt de belasting geheven van degene op wiens naam het kenteken wordt dan wel is gesteld.
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel5
  - number: '5.2'
    text: |-
      Met betrekking tot een niet geregistreerde personenauto, een niet geregistreerd motorrijwiel of een niet
      geregistreerde bestelauto wordt de belasting geheven van degene die het motorrijtuig feitelijk ter beschikking
      heeft.
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel5
  - number: '6.1'
    text: De belasting moet op aangifte worden voldaan.
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel6
  - number: '6.2'
    text: |-
      In afwijking van [artikel 10, tweede lid][ref1], en
      [artikel 19, derde lid, van de Algemene wet inzake rijksbelastingen][ref2]:


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel19
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0002320
        artikel: '19'
  - number: 6.2.a
    text: 'moet de belasting, indien deze verschuldigd is:'
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel6
  - number: 6.2.a.1°
    text: |-
      ter zake van de registratie van een personenauto of motorrijwiel, worden betaald voordat het kenteken op naam is
      gesteld;
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel6
  - number: 6.2.a.2°
    text: |-
      ter zake van de registratie van een bestelauto, worden betaald binnen een maand na het tijdstip waarop het kenteken
      op naam is gesteld;
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel6
  - number: 6.2.a.3°
    text: ter zake van de aanvang van het gebruik van de weg, worden betaald vóór de aanvang van dat gebruik;
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel6
  - number: 6.2.b
    text: wordt de aangifte gelijktijdig met de betaling gedaan.
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel6
  - number: '6.3'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld ingevolge welke de belasting in afwijking van het tweede
      lid, onderdeel a, onder 3°, niet behoeft te worden betaald vóór de aanvang van het gebruik van de weg.
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel6
  - number: '6.4'
    text: |-
      Indien in een geval als bedoeld in het derde lid, degene die de feitelijke beschikking heeft over een niet
      geregistreerde personenauto, een niet geregistreerd motorrijwiel of een niet geregistreerde bestelauto
      bij controle door ambtenaren van de rijksbelastingdienst of door opsporingsambtenaren als bedoeld in
      [artikel 141 van het Wetboek van Strafvordering][ref1] niet aannemelijk maakt dat de belasting is betaald, dient de
      belasting terstond te worden betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
  - number: '7.1'
    text: |-
      Indien voor een personenauto of een motorrijwiel de aanvraag voor de opgave van een kenteken
      geschiedt door een ander dan degene op wiens naam het kenteken wordt gesteld, is, in afwijking van
      [artikel 19, derde lid, van de Algemene wet inzake rijksbelastingen][ref1], die ander gehouden de belasting op
      aangifte te voldoen namens degene op wiens naam het kenteken wordt gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel19
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '19'
  - number: '7.2'
    text: |-
      Degene die voor een personenauto, een motorrijwiel of een bestelauto een aanvraag doet voor de opgave
      van een kenteken, is gehouden daarbij voor dat motorrijtuig het bedrag aan belasting ingevolge de
      [artikelen 9 tot en met 9c][ref1] op te geven.


      [ref1]: https://wetten.overheid.nl/BWBR0005806#Artikel9
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005806
        artikel: '9'
        hoofdstuk: III
        afdeling: '2'
  - number: '8'
    text: |-
      In afwijking van [artikel 6, tweede lid, onderdeel ][ref1], kan de inspecteur een ondernemer die voldoet aan bij
      ministeriële regeling te stellen voorwaarden en die in het kader van zijn bedrijfsuitoefening regelmatig om opgave
      van een kenteken verzoekt voor personenauto’s of motorrijwielen waarvan het kenteken op naam van een ander wordt
      gesteld, op aanvraag bij voor bezwaar vatbare beschikking toestaan de belasting per tijdvak te voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0005806#Artikel6
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0005806
        artikel: '6'
        hoofdstuk: III
        afdeling: '1'
  - number: '9.1'
    text: |-
      De belasting bedraagt voor een personenauto of een bestelauto 45,2 percent van de netto catalogusprijs, verminderd
      met € 1 540, dan wel, in geval van een personenauto of een bestelauto die wordt aangedreven door een motor met een
      compressieontsteking 45,2 percent van de netto catalogusprijs, vermeerderd met € 328.
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel9
  - number: '9.2'
    text: De belasting bedraagt voor een motorrijwiel
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel9
  - number: 9.2.a
    text: 'met een netto catalogusprijs van niet meer dan € 2 133: 10,2 percent van de netto catalogusprijs;'
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel9
  - number: 9.2.b
    text: 'met een netto catalogusprijs van meer dan € 2 133: 20,7 percent van de netto catalogusprijs, verminderd met € 224.'
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel9
  - number: '9.3'
    text: Onder de netto catalogusprijs wordt verstaan de catalogusprijs verminderd met de daarin begrepen omzetbelasting.
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel9
  - number: '9.4'
    text: |-
      Onder catalogusprijs wordt verstaan de in Nederland door de fabrikant of importeur aan wederverkopers kenbaar
      gemaakte prijs welke naar zijn inzicht bij verkoop aan de uiteindelijke afnemer valt te berekenen. In die
      geadviseerde verkoopprijs is de belasting van personenauto’s en motorrijwielen zelf niet begrepen. Is een zodanige
      prijs niet bekend, dan wordt hij door vergelijking bepaald.
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel9
  - number: '9.5'
    text: |-
      Voor een nieuwe personenauto, een nieuw motorrijwiel of een nieuwe bestelauto geldt de catalogusprijs bij aanvang
      van de dag waarop aan de personenauto, het motorrijwiel of de bestelauto een kenteken wordt toegekend.
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel9
  - number: '9.6'
    text: |-
      Voor een gebruikte personenauto, een gebruikt motorrijwiel of een gebruikte bestelauto geldt de catalogusprijs van
      het tijdstip waarop de personenauto, het motorrijwiel of de bestelauto voor het eerst in gebruik is genomen. Indien
      dit tijdstip niet bekend is, treedt daarvoor in de plaats de laatste dag van het jaar waarin de personenauto, het
      motorrijwiel of de bestelauto is vervaardigd.
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel9
  - number: '9.7'
    text: |-
      Voor een ander motorrijtuig dan een personenauto, een motorrijwiel of een bestelauto, dat in een zodanige staat
      wordt gebracht dat het een personenauto, een motorrijwiel of een bestelauto is, geldt de catalogusprijs als ware
      het een personenauto, een motorrijwiel of een bestelauto van het tijdstip waarop het motorrijtuig voor het eerst
      in gebruik is genomen. Indien dit tijdstip niet bekend is, treedt daarvoor in de plaats de laatste dag van het jaar
      waarin het motorrijtuig is vervaardigd.
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel9
  - number: '9.8'
    text: |-
      Indien het tijdstip, bedoeld in het zesde en zevende lid, is gelegen voor 1 januari 1993, dan wordt uit de
      prijs, bedoeld in het vierde lid, de bijzondere verbruiksbelasting van personenauto’s dan wel de bijzondere
      verbruiksbelasting van motorrijwielen afgezonderd.
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel9
  - number: '9.9'
    text: |-
      Wanneer een personenauto, een motorrijwiel of een bestelauto een bijzondere uitvoering heeft of is voorzien van
      extra toebehoren, wordt de waarde daarvan in de catalogusprijs begrepen, uitgezonderd de waarde van voorzieningen
      die niet zijn aangebracht door of namens de fabrikant of de importeur.
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel9
  - number: 9a.1
    text: |-
      Indien de personenauto volgens de vermelding in het kentekenregister behoort tot een energie-efficiëntieklasse als
      bedoeld in [bijlage 4 bij het Besluit etikettering energiegebruik personenauto’s][ref1], wordt het bedrag aan
      belasting, bedoeld in [artikel 9, eerste lid][ref2], verlaagd of verhoogd met een bedrag dat wordt bepaald aan de
      hand van de volgende tabel.












                    Energie-efficiëntieklasse


                    A


                    B


                    C


                    D


                    E


                    F


                    G






                    verlaagd met:


                    € 1000


                    € 500


                    –








                    verhoogd met:




                    –


                    € 135


                    € 270


                    € 405


                    € 540


      [ref1]: https://wetten.overheid.nl/BWBR0011761
      [ref2]: https://wetten.overheid.nl/BWBR0005806#Artikel9
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0011761
      - id: ref2
        bwb_id: BWBR0005806
        artikel: '9'
        hoofdstuk: III
        afdeling: '2'
  - number: 9a.2
    text: |-
      Bij toepassing van het eerste lid wordt de energie-efficiëntieklasse in aanmerking genomen waartoe de personenauto
      behoort bij aanvang van de dag waarop aan het voertuig een kenteken wordt toegekend.
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel9a
  - number: 9a.3
    text: |-
      In afwijking in zoverre van het tweede lid wordt met betrekking tot gebruikte personenauto’s de energie-
      efficiëntieklasse in aanmerking genomen waartoe de personenauto behoorde op het tijdstip waarop deze voor het eerst
      in gebruik werd genomen.
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel9a
  - number: 9b.1
    text: |-
      Voor een personenauto of een bestelauto die wordt aangedreven door een motor met compressieontsteking wordt het
      bedrag aan belasting, bedoeld in [artikel 9, eerste lid][ref1], verminderd met € 600, indien de personenauto of de
      bestelauto voldoet aan de in het tweede lid vermelde voorwaarde.


      [ref1]: https://wetten.overheid.nl/BWBR0005806#Artikel9
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel9b
    references:
      - id: ref1
        bwb_id: BWBR0005806
        artikel: '9'
        hoofdstuk: III
        afdeling: '2'
  - number: 9b.2
    text: |-
      De personenauto of de bestelauto heeft geen grotere emissie van deeltjes dan 5 mg per kilometer, vastgesteld
      overeenkomstig bijlage I bij [richtlijn nr. 70/220/EEG](31970L0220) van de Raad van de Europese Gemeenschappen van
      20 maart 1970 inzake de onderlinge aanpassing van de wetgevingen der Lid-Staten met betrekking tot de maatregelen
      die moeten worden genomen tegen de luchtverontreiniging door gassen afkomstig van motoren met elektrische
      ontsteking in motorvoertuigen (PbEG L 76).
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel9b
  - number: 9b.3
    text: |-
      Een wijziging van [richtlijn 70/220/EEG](31970L0220) gaat voor de toepassing van het tweede lid gelden met ingang
      van de dag waarop aan de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven, tenzij bij ministerieel
      besluit, dat in de Staatscourant wordt bekendgemaakt, een ander tijdstip wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel9b
  - number: 9b.4
    text: Bij ministeriële regeling worden nadere regels gesteld ter uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel9b
  - number: 9c.1
    text: |-
      In afwijking van [artikel 9, eerste lid][ref1], bedraagt de belasting tot 1 juli 2008 nihil voor een personenauto
      of bestelauto die ingericht en bestemd is om uitsluitend te worden aangedreven door:


      [ref1]: https://wetten.overheid.nl/BWBR0005806#Artikel9
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel9c
    references:
      - id: ref1
        bwb_id: BWBR0005806
        artikel: '9'
        hoofdstuk: III
        afdeling: '2'
  - number: 9c.1.a
    text: |-
      een elektromotor, mits de elektrische energie uitsluitend door een batterij of door een brandstofcel wordt
      geleverd,
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel9c
  - number: 9c.1.b
    text: |-
      een combinatie van een elektromotor en een verbrandingsmotor, mits de aandrijving door de elektromotor zodanig is
      dat de elektrische energie voor een actieradius van ten minste 24 km aaneengesloten stadsverkeer uitsluitend door
      een batterij of door een brandstofcel kan worden geleverd, of
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel9c
  - number: 9c.1.c
    text: een verbrandingsmotor die kan worden gevoed met waterstof.
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel9c
  - number: 9c.2
    text: |-
      In afwijking in zoverre van [artikel 9a, eerste lid][ref1], wordt het bedrag aan belasting, bedoeld in
      [artikel 9, eerste lid][ref2], tot 1 juli 2008 verlaagd met € 6000 respectievelijk € 3000 voor een personenauto
      die ingericht en bestemd is om uitsluitend te worden aangedreven door een combinatie van een elektromotor en
      een verbrandingsmotor, mits het piekvermogen van de voor de aandrijving bestemde elektromotor ten minste 15%
      van het maximum vermogen van de verbrandingsmotor bedraagt en mits de personenauto volgens de vermelding in het
      kentekenregister behoort tot de energie-efficiëntieklasse A respectievelijk energie-efficiëntieklasse B.


      [ref1]: https://wetten.overheid.nl/BWBR0005806#Artikel9a
      [ref2]: https://wetten.overheid.nl/BWBR0005806#Artikel9
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel9c
    references:
      - id: ref1
        bwb_id: BWBR0005806
        artikel: 9a
        hoofdstuk: III
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005806
        artikel: '9'
        hoofdstuk: III
        afdeling: '2'
  - number: 9c.3
    text: |-
      [Artikel 9a, tweede en derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005806#Artikel9a
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel9c
    references:
      - id: ref1
        bwb_id: BWBR0005806
        artikel: 9a
        hoofdstuk: III
        afdeling: '2'
  - number: '10.1'
    text: |-
      Met betrekking tot gebruikte personenauto's, gebruikte motorrijwielen of gebruikte bestelauto's wordt
      het bij de personenauto, het motorrijwiel of de bestelauto behorende bedrag aan belasting, bedoeld in
      [artikel 9, eerste en tweede lid][ref1], na toepassing van [artikel 9a][ref2], [artikel 9b][ref3] en
      [artikel 9c, tweede lid][ref4] berekend met inachtneming van een vermindering.


      [ref1]: https://wetten.overheid.nl/BWBR0005806#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0005806#Artikel9a
      [ref3]: https://wetten.overheid.nl/BWBR0005806#Artikel9b
      [ref4]: https://wetten.overheid.nl/BWBR0005806#Artikel9c
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0005806
        artikel: '9'
        hoofdstuk: III
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005806
        artikel: 9a
        hoofdstuk: III
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0005806
        artikel: 9b
        hoofdstuk: III
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0005806
        artikel: 9c
        hoofdstuk: III
        afdeling: '2'
  - number: '10.2'
    text: |-
      De in het eerste lid bedoelde vermindering is een percentage van het bedrag aan belasting, welk percentage is
      aangegeven in de navolgende tabel.






                    Indien na het tijdstip waarop de personenauto, het motorrijwiel of de bestelauto voor het eerst in
      gebruik is genomen, een tijdsduur is verstreken van


                    bedraagt het percentage




                    minder dan een maand


                    4






                    een maand of meer, maar minder dan twee maanden


                    7




                    twee maanden of meer, maar minder dan drie maanden


                    10




                    drie maanden of meer, maar minder dan zes maanden


                    15




                    zes maanden of meer, maar minder dan 1 jaar


                    24




                    1 jaar of meer, maar minder dan 2 jaar


                    37




                    2 jaar of meer, maar minder dan 3 jaar


                    47




                    3 jaar of meer, maar minder dan 4 jaar


                    57




                    4 jaar of meer, maar minder dan 5 jaar


                    66




                    5 jaar of meer, maar minder dan 6 jaar


                    72




                    6 jaar of meer, maar minder dan 7 jaar


                    77




                    7 jaar of meer, maar minder dan 8 jaar


                    82




                    8 jaar of meer, maar minder dan 9 jaar


                    86




                    9 jaar of meer


                    90
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel10
  - number: '10.3'
    text: |-
      Indien na het tijdstip waarop een bestelauto voor het eerst in gebruik is genomen, een tijdsduur is verstreken van
      5 jaar of meer, bedraagt in afwijking van het tweede lid het percentage van de vermindering 100.
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel10
  - number: '10.4'
    text: |-
      Indien na het tijdstip waarop de personenauto of het motorrijwiel voor het eerst in gebruik is genomen, een
      tijdsduur is verstreken van 25 jaar of meer, bedraagt in afwijking van het tweede lid het percentage van de
      vermindering 100.
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel10
  - number: '10.5'
    text: |-
      Indien het tijdstip waarop de personenauto, het motorrijwiel of de bestelauto voor het eerst in gebruik is genomen
      niet bekend is, treedt daarvoor in de plaats de laatste dag van het jaar waarin de personenauto, het motorrijwiel
      of de bestelauto is vervaardigd.
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel10
  - number: '10.6'
    text: |-
      Indien blijkt dat de afschrijving, uitgedrukt in procenten van de som van de catalogusprijs en de belasting op het
      tijdstip waarop de personenauto, het motorrijwiel of de bestelauto voor het eerst in gebruik is genomen, meer is
      dan het percentage volgens de tabel in het tweede lid, is de vermindering, in afwijking van het tweede lid, de in
      dit lid bedoelde afschrijving.
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel10
  - number: '10.7'
    text: |-
      De in het zesde lid bedoelde afschrijving is slechts van toepassing, indien daarop een beroep wordt gedaan in het
      aangiftebiljet onder opgaaf van de gegevens die voor de toepassing van het zesde lid van belang zijn.
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel10
  - number: '10.8'
    text: |-
      Bij ministeriële regeling kan de vermindering ingevolge de tabellen in het tweede lid worden verhoogd voor
      personenauto's, motorrijwielen of bestelauto's als bedoeld in [artikel 15, eerste lid, onderdelen a, b en g][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005806#Artikel15
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0005806
        artikel: '15'
        hoofdstuk: IV
        afdeling: '2'
  - number: '11'
    text: |-
      Degene die ingevolge deze wet gehouden is de belasting namens een ander te voldoen, is bevoegd hetgeen van hem
      ingevolge de inwerkingtreding van een wijziging van deze wet of daarop gebaseerde regelgeving meer wordt gevorderd
      dan vóór die inwerkingtreding had kunnen geschieden, te vorderen van die ander. Hiermee strijdige bedingen zijn
      nietig.
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel11
  - number: '12'
    text: |-
      Degene, namens wie de belasting ingevolge deze wet door een ander wordt voldaan, is bevoegd hetgeen van die
      ander ingevolge de inwerkingtreding van een wijziging van deze wet of daarop gebaseerde regelgeving minder wordt
      gevorderd dan vóór die inwerkingtreding had kunnen geschieden, terug te vorderen van die ander. Hiermee strijdige
      bedingen zijn nietig.
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel12
  - number: 12a.1
    text: |-
      Ingeval van constatering van het gebruik van de weg met een personenauto, een motorrijwiel of
      een bestelauto waarvoor de belasting die is verschuldigd ter zake van een feit als bedoeld in
      [artikel 1, derde of vierde lid][ref1], niet is betaald, kan de belasting worden nageheven van degene op wiens naam
      het kenteken is gesteld op het moment van constatering. De aanvang van het gebruik van de weg wordt gesteld op het
      tijdstip van de hiervoor bedoelde tenaamstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0005806#Artikel1
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0005806
        artikel: '1'
        hoofdstuk: I
        afdeling: '1'
  - number: 12a.2
    text: |-
      Indien degene op wiens naam het kenteken is gesteld, aantoont op welk tijdstip na de tenaamstelling het
      motorrijtuig in een zodanige staat is gebracht dat het een personenauto, een motorrijwiel of een bestelauto is,
      onderscheidenlijk niet meer voldoet aan de in [artikel 9c][ref1] genoemde voorwaarden, wordt de aanvang van het
      gebruik van de weg gesteld op dat latere tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0005806#Artikel9c
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0005806
        artikel: 9c
        hoofdstuk: III
        afdeling: '2'
  - number: 12a.3
    text: |-
      Indien degene bij wie de belasting wordt nageheven aantoont dat de personenauto, het motorrijwiel of de bestelauto
      op het tijdstip van tenaamstelling reeds in een zodanige staat verkeerde dat het een personenauto, een motorrijwiel
      of een bestelauto was, onderscheidenlijk niet meer voldeed aan de in [artikel 9c][ref1] genoemde voorwaarden, en
      hij niet wist of behoorde te weten dat de belasting niet is betaald, kan de belasting worden nageheven van degene
      op wiens naam het kenteken daaraan voorafgaand was gesteld, waarbij de aanvang van het gebruik van de weg wordt
      gesteld op het tijdstip van de desbetreffende tenaamstelling. Het tweede lid is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005806#Artikel9c
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0005806
        artikel: 9c
        hoofdstuk: III
        afdeling: '2'
  - number: 12b
    text: |-
      Ingeval van constatering van het gebruik van de weg met een personenauto, een motorrijwiel of een bestelauto
      waarvoor de belasting die is verschuldigd ter zake van het in [artikel 1, vijfde lid][ref1], genoemde feit niet
      is betaald, kan de belasting worden nageheven van degene die het motorrijtuig feitelijk ter beschikking heeft. Het
      tijdstip van aanvang van het gebruik van de weg wordt daarbij gesteld op het tijdstip van constatering.


      [ref1]: https://wetten.overheid.nl/BWBR0005806#Artikel1
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel12b
    references:
      - id: ref1
        bwb_id: BWBR0005806
        artikel: '1'
        hoofdstuk: I
        afdeling: '1'
  - number: '13.1'
    text: |-
      Vrijstelling van belasting wordt in andere gevallen dan waarin vrijstelling van belasting wordt verleend
      krachtens [artikel 39 van de Algemene wet inzake rijksbelastingen][ref1], verleend voor personenauto's,
      motorrijwielen en bestelauto's waarvoor een kenteken als bedoeld in [artikel 37, derde lid][ref2], of
      [artikel 38, eerste lid, van de Wegenverkeerswet 1994][ref3] is of wordt opgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel37
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel38
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '39'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '37'
      - id: ref3
        bwb_id: BWBR0006622
        artikel: '38'
  - number: '13.2'
    text: |-
      Vrijstelling van belasting wordt verleend voor personenauto's, motorrijwielen en bestelauto's die op grond
      van artikel II van de Wet van 2 december 1982, houdende voorlopige voorzieningen in verband met de voorgenomen
      intrekking van het Koninklijk besluit van 10 april 1939 (*Stb.* 181) (*Stb.* 1982, 733) niet behoeven te worden
      geregistreerd in het in [artikel 1, tweede lid][ref1], bedoelde register.


      [ref1]: https://wetten.overheid.nl/BWBR0005806#Artikel1
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0005806
        artikel: '1'
        hoofdstuk: I
        afdeling: '1'
  - number: 13a.1
    text: |-
      Vrijstelling van belasting wordt verleend voor bestelauto’s die op naam worden gesteld van een ondernemer als
      bedoeld in [artikel 7 van de Wet op de omzetbelasting 1968][ref1], die de bestelauto meer dan bijkomstig gebruikt
      in het kader van zijn onderneming. De vrijstelling wordt niet verleend indien het ondernemerschap voor de
      omzetbelasting voortvloeit uit het bepaalde in [artikel 7, zesde lid, van de Wet op de omzetbelasting 1968][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel7
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0002629
        artikel: '7'
  - number: 13a.2
    text: |-
      Voor een bestelauto die door een ondernemer als bedoeld in het eerste lid voor een langere dan een bij ministeriële
      regeling vast te stellen periode ter beschikking wordt gesteld aan een andere persoon, wordt de vrijstelling
      slechts verleend indien deze andere persoon, behoudens de tenaamstelling, voldoet aan de voorwaarden en beperkingen
      voor de vrijstelling.
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel13a
  - number: 13a.3
    text: |-
      Indien tijdens de eerste vijf jaren na het tijdstip waarop de bestelauto is ingeschreven in het register, bedoeld
      in [artikel 1, tweede lid][ref1], niet of niet langer wordt voldaan aan de voorwaarden en beperkingen voor
      de vrijstelling, wordt vanaf dat moment het bedrag waarvan vrijstelling is verleend, nadat dit is verminderd
      overeenkomstig [artikel 10][ref2], als belasting verschuldigd. De verschuldigd geworden belasting wordt door de
      ondernemer, bedoeld in het eerste lid, op aangifte voldaan binnen een maand na het tijdstip waarop niet of niet
      langer aan de voorwaarden en beperkingen voor de vrijstelling wordt voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005806#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005806#Artikel10
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0005806
        artikel: '1'
        hoofdstuk: I
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005806
        artikel: '10'
        hoofdstuk: III
        afdeling: '2'
  - number: 13a.4
    text: |-
      Indien bij wijziging van de tenaamstelling van de bestelauto overigens voldaan blijft worden aan de voorwaarden
      en beperkingen van de vrijstelling blijft, onder bij algemene maatregel van bestuur te stellen voorwaarden en
      beperkingen, het derde lid buiten toepassing. Alsdan treedt degene op wiens naam het kenteken wordt gesteld, vanaf
      het moment van de wijziging van de tenaamstelling voor de toepassing van dit artikel in de plaats van degene op
      wiens naam het kenteken daarvoor was gesteld.
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel13a
  - number: 13a.5
    text: |-
      Ingeval een bestelauto waarvoor vrijstelling is verleend op de voet van dit artikel in een zodanige staat wordt
      gebracht dat het een personenauto is, zijn de [artikelen 1, derde lid][ref1], en [12a][ref2] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005806#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005806#Artikel12a
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0005806
        artikel: '1'
        hoofdstuk: I
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005806
        artikel: 12a
        hoofdstuk: III
        afdeling: '3'
  - number: 13a.6
    text: |-
      Indien één of meer personen worden vervoerd in de laadruimte van een bestelauto, vormt dit een verzuim ter zake
      waarvan de inspecteur aan degene die de bestelauto feitelijk ter beschikking heeft, een boete van € 453 kan
      opleggen. De bevoegdheid tot het opleggen van de boete vervalt door het verloop van een jaar na het constateren van
      het verzuim, bedoeld in de vorige volzin.
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel13a
  - number: 13a.7
    text: |-
      Het tweede tot en met zesde lid zijn van overeenkomstige toepassing ten aanzien van bestelauto’s waarvoor teruggaaf
      van belasting is verleend ingevolge [artikel 15b][ref1], zoals dat artikel luidde van 1 juli 2005 tot de datum van
      inwerkingtreding van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0005806#Artikel15b
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0005806
        artikel: 15b
        hoofdstuk: IV
        afdeling: '2'
  - number: 13b.1
    text: |-
      In afwijking van [artikel 13a, derde lid][ref1], is het bedrag waarvan vrijstelling is verleend niet als belasting
      verschuldigd indien:


      [ref1]: https://wetten.overheid.nl/BWBR0005806#Artikel13a
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel13b
    references:
      - id: ref1
        bwb_id: BWBR0005806
        artikel: 13a
        hoofdstuk: IV
        afdeling: '1'
  - number: 13b.1.a
    text: |-
      de tenaamstelling van het kenteken in het register, bedoeld in [artikel 1, tweede lid][ref1], wordt beëindigd omdat
      de bestelauto buiten Nederland wordt gebracht;


      [ref1]: https://wetten.overheid.nl/BWBR0005806#Artikel1
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel13b
    references:
      - id: ref1
        bwb_id: BWBR0005806
        artikel: '1'
        hoofdstuk: I
        afdeling: '1'
  - number: 13b.1.b
    text: |-
      de tenaamstelling van het kenteken in het register, bedoeld in [artikel 1, tweede lid][ref1], wordt beëindigd omdat
      de bestelauto wordt gesloopt; of


      [ref1]: https://wetten.overheid.nl/BWBR0005806#Artikel1
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel13b
    references:
      - id: ref1
        bwb_id: BWBR0005806
        artikel: '1'
        hoofdstuk: I
        afdeling: '1'
  - number: 13b.1.c
    text: |-
      de bestelauto is gestolen en een melding van diefstal van de bestelauto is geplaatst in het register, bedoeld in
      [artikel 1, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005806#Artikel1
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel13b
    references:
      - id: ref1
        bwb_id: BWBR0005806
        artikel: '1'
        hoofdstuk: I
        afdeling: '1'
  - number: 13b.2
    text: |-
      Het bedrag waarvan vrijstelling is verleend wordt, met overeenkomstige toepassing van [artikel 10][ref1], alsnog
      als belasting verschuldigd:


      [ref1]: https://wetten.overheid.nl/BWBR0005806#Artikel10
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel13b
    references:
      - id: ref1
        bwb_id: BWBR0005806
        artikel: '10'
        hoofdstuk: III
        afdeling: '2'
  - number: 13b.2.a
    text: |-
      op het moment van de tenaamstelling van het kenteken, indien na toepassing van het eerste lid, onderdeel a of b,
      het kenteken dat voor de bestelauto is opgegeven opnieuw wordt tenaamgesteld;
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel13b
  - number: 13b.2.b
    text: |-
      op het moment van de hernieuwde aanvang van het gebruik met de bestelauto van de weg in de zin van de
      [Wegenverkeerswet 1994][ref1], indien na toepassing van het eerste lid, onderdeel a of b, de bestelauto feitelijk
      ter beschikking staat van een in Nederland wonende natuurlijke persoon of gevestigd lichaam, zonder dat het
      kenteken opnieuw te naam is gesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0006622
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel13b
    references:
      - id: ref1
        bwb_id: BWBR0006622
  - number: 13b.2.c
    text: |-
      op het moment van de verwijdering van de melding van diefstal uit het register, indien na toepassing van het eerste
      lid, onderdeel c, de bestelauto wordt teruggevonden, met dien verstande dat geen belasting verschuldigd is als het
      kenteken op dat moment nog op naam staat van degene aan wie de vrijstelling is verleend en deze de teruggevonden
      bestelauto aansluitend opnieuw in gebruik neemt binnen de voorwaarden van de vrijstelling. In het laatste geval
      blijven de feiten die zich hebben voorgedaan in de periode dat de bestelauto was gestolen buiten beschouwing voor
      de vraag, of aan de voorwaarden en beperkingen van de vrijstelling wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel13b
  - number: 13b.3
    text: |-
      Bij de toepassing van het tweede lid zijn de [artikelen 5][ref1], [6][ref2], en [12b][ref3] van overeenkomstige
      toepassing, met dien verstande, dat bij de toepassing van het tweede lid, onderdeel c, de belasting wordt voldaan
      binnen een maand na de verwijdering van de melding van diefstal uit het register.


      [ref1]: https://wetten.overheid.nl/BWBR0005806#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005806#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0005806#Artikel12b
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel13b
    references:
      - id: ref1
        bwb_id: BWBR0005806
        artikel: '5'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0005806
        artikel: '6'
        hoofdstuk: III
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0005806
        artikel: 12b
        hoofdstuk: III
        afdeling: '3'
  - number: 13b.4
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ter uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel13b
  - number: '14.1'
    text: |-
      Bij algemene maatregel van bestuur kan, onder daarbij te stellen voorwaarden en beperkingen, vrijstelling van
      belasting worden verleend voor uit een ander land afkomstige personenauto's, motorrijwielen en bestelauto's die
      voor specifieke doeleinden, dan wel onder specifieke omstandigheden naar Nederland zijn gebracht.
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel14
  - number: '14.2'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van de in het eerste
      lid bedoelde algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel14
  - number: '15.1'
    text: |-
      Teruggaaf van belasting wordt, onder bij algemene maatregel van bestuur te stellen voorwaarden en beperkingen, op
      aanvraag verleend voor personenauto's, motorrijwielen en bestelauto's die:
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel15
  - number: 15.1.a
    text: zijn ingericht om te worden gebruikt door de politie en als zodanig uiterlijk kenbaar zijn;
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel15
  - number: 15.1.b
    text: zijn ingericht om te worden gebruikt door de brandweer en als zodanig uiterlijk kenbaar zijn;
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel15
  - number: 15.1.c
    text: |-
      kennelijk zijn ingericht om te worden gebruikt door een invalide en zijn uitgerust met een elektromotor dan wel met
      een verbrandingsmotor met een cylinderinhoud van ten hoogste 250 cm³;
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel15
  - number: 15.1.d
    text: zijn ingericht voor het vervoer van zieken en gewonden en als zodanig uiterlijk kenbaar zijn;
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel15
  - number: 15.1.e
    text: zijn ingericht voor het vervoer van stoffelijke overschotten en als zodanig uiterlijk kenbaar zijn;
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel15
  - number: 15.1.f
    text: zijn ingericht voor het vervoer van gevangenen en als zodanig uiterlijk kenbaar zijn;
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel15
  - number: 15.1.g
    text: zijn ingericht en uitsluitend worden gebruikt voor het vervoer van rolstoelgebruikers in groepsverband;
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel15
  - number: 15.1.h
    text: zijn ingericht voor het vervoer van zieke of gewonde dieren en als zodanig uiterlijk kenbaar zijn;
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel15
  - number: 15.1.i
    text: zijn ingericht voor geldtransport en als zodanig uiterlijk kenbaar zijn.
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel15
  - number: '15.2'
    text: De teruggaaf wordt verleend aan degene op wiens naam het kenteken is gesteld.
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel15
  - number: '15.3'
    text: De inspecteur beslist op de aanvraag bij voor bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel15
  - number: '15.4'
    text: |-
      In geval voor een personenauto, een motorrijwiel of, gedurende de eerste vijf jaren na inschrijving in het in
      [artikel 1, tweede lid][ref1], bedoelde register, een bestelauto, niet langer wordt voldaan aan de voorwaarden
      en beperkingen voor teruggaaf, wordt vanaf dat moment het teruggegeven bedrag, met overeenkomstige toepassing
      van [artikel 10][ref2], als belasting verschuldigd. Het zesde en zevende lid van [artikel 10][ref3] zijn niet van
      toepassing. De verschuldigd geworden belasting wordt door degene aan wie de teruggaaf is verleend, op aangifte
      voldaan binnen een maand na het moment dat niet langer aan de voorwaarden en beperkingen wordt voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005806#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005806#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0005806#Artikel10
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005806
        artikel: '1'
        hoofdstuk: I
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005806
        artikel: '10'
        hoofdstuk: III
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0005806
        artikel: '10'
        hoofdstuk: III
        afdeling: '2'
  - number: '15.5'
    text: |-
      Bij wijziging van de tenaamstelling van een personenauto, motorrijwiel of bestelauto blijven, op daartoe gedaan
      gezamenlijk verzoek van degene op wiens naam het kenteken wordt gesteld en degene op wiens naam het kenteken
      daarvoor was gesteld, het eerste en vierde lid buiten toepassing indien overigens voldaan blijft worden aan de
      voorwaarden en beperkingen waaronder de teruggaaf is verleend. Bij inwilliging van het verzoek treedt degene op
      wiens naam het kenteken wordt gesteld vanaf het moment van de wijziging van de tenaamstelling voor de toepassing
      van dit artikel in de plaats van degene op wiens naam het kenteken daarvoor was gesteld. De inspecteur beslist op
      het verzoek bij voor bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel15
  - number: 15a.1
    text: |-
      Teruggaaf van belasting wordt, onder bij algemene maatregel van bestuur te stellen voorwaarden en beperkingen, op
      aanvraag verleend voor bestelauto's die zijn ingericht om te worden gebruikt voor het vervoer van een gehandicapte
      persoon in de cabine en voor het gelijktijdige vervoer van een niet-opvouwbare rolstoel ten behoeve van die
      persoon.
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel15a
  - number: 15a.2
    text: |-
      In afwijking van het eerste lid wordt de teruggaaf voorts verleend, indien de laadruimte van de bestelauto in
      afwijking van [artikel 3, derde lid][ref1], ten gevolge van aanpassing van de bestelauto in verband met de handicap
      van de in het eerste lid bedoelde persoon, niet langer van de bestuurdersplaats onderscheidenlijk de cabine is
      afgescheiden of niet in haar geheel is voorzien van een vlakke laadvloer.


      [ref1]: https://wetten.overheid.nl/BWBR0005806#Artikel3
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0005806
        artikel: '3'
        hoofdstuk: I
        afdeling: '2'
  - number: 15a.3
    text: |-
      Indien de gehandicapte een ander is dan degene op wiens naam het kenteken is gesteld, is het eerste lid slechts
      van toepassing indien de aanvraag als bedoeld in het eerste lid wordt gedaan door die ander en de gehandicapte
      gezamenlijk.
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel15a
  - number: 15a.4
    text: De teruggaaf wordt verleend aan degene op wiens naam het kenteken is gesteld.
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel15a
  - number: 15a.5
    text: De inspecteur beslist op de aanvraag bij voor bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel15a
  - number: 15a.6
    text: |-
      De aanspraak op teruggaaf ontstaat op het tijdstip waarop aan de voorwaarden en beperkingen voor teruggaaf als
      bedoeld in het eerste lid wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel15a
  - number: 15a.7
    text: |-
      Indien het in het zesde lid bedoelde tijdstip is gelegen na het tijdstip waarop de bestelauto is ingeschreven
      in het in [artikel 1, tweede lid][ref1], bedoelde register, bedraagt de teruggaaf het belastingbedrag nadat dit
      is verminderd overeenkomstig [artikel 10, tweede lid of derde lid][ref2], met dien verstande dat ingeval voor de
      bestelauto al eerder teruggaaf is verleend, de teruggaaf niet meer bedraagt dan dit belastingbedrag verminderd met
      de eerdere teruggaven, voor zover de eerder teruggegeven bedragen niet later alsnog als verschuldigde belasting
      zijn voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005806#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005806#Artikel10
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0005806
        artikel: '1'
        hoofdstuk: I
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005806
        artikel: '10'
        hoofdstuk: III
        afdeling: '2'
  - number: 15a.8
    text: |-
      Ingeval voor een bestelauto waarvoor teruggaaf is verleend, gedurende de eerste vijf jaren na registratie in het
      in [artikel 1, tweede lid][ref1], bedoelde register, niet langer wordt voldaan aan de voorwaarden en beperkingen
      voor de teruggaaf, is vanaf dat moment het teruggegeven bedrag als belasting verschuldigd. Belasting is eveneens
      verschuldigd ingeval een bestelauto waarvoor teruggaaf is verleend in een zodanige staat wordt gebracht, anders dan
      door een aanpassing als bedoeld in het tweede lid, dat het een personenauto is. De verschuldigd geworden belasting
      wordt door degene aan wie de teruggaaf is verleend, op aangifte voldaan binnen een maand nadat niet meer aan de in
      de eerste volzin bedoelde voorwaarden en beperkingen wordt voldaan, onderscheidenlijk vóór aanvang van het gebruik
      van de weg met de in de tweede volzin bedoelde personenauto. De [artikelen 10][ref2] en [12a][ref3] zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005806#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005806#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0005806#Artikel12a
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0005806
        artikel: '1'
        hoofdstuk: I
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005806
        artikel: '10'
        hoofdstuk: III
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0005806
        artikel: 12a
        hoofdstuk: III
        afdeling: '3'
  - number: 15a.9
    text: |-
      Bij wijziging van de tenaamstelling van een bestelauto blijven, op daartoe gedaan gezamenlijk verzoek van degene
      op wiens naam het kenteken wordt gesteld en degene op wiens naam het kenteken daarvoor was gesteld, het eerste en
      achtste lid buiten toepassing indien overigens voldaan blijft worden aan de voorwaarden en beperkingen waaronder
      de teruggaaf is verleend. Bij inwilliging van het verzoek treedt degene op wiens naam het kenteken wordt gesteld
      vanaf het moment van de wijziging van de tenaamstelling voor de toepassing van dit artikel in de plaats van degene
      op wiens naam het kenteken daarvoor was gesteld. De inspecteur beslist op het verzoek bij voor bezwaar vatbare
      beschikking.
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel15a
  - number: 15a.10
    text: |-
      In geval niet meer wordt voldaan aan de voorwaarden en beperkingen voor de teruggaaf doordat de gehandicapte is
      overleden, wordt in afwijking van het achtste lid, het teruggegeven bedrag niet als belasting verschuldigd zolang
      de tenaamstelling van het kenteken niet wordt gewijzigd en de bestelauto uitsluitend wordt gebruikt voor het
      persoonlijk gebruik van degene op wiens naam het kenteken is gesteld, gebruik door inwonende gezinsleden daaronder
      begrepen. Indien de teruggaaf is verleend aan de gehandicapte en het kenteken na diens overlijden op naam wordt
      gesteld van een inwonend gezinslid van het gezin waartoe de gehandicapte behoorde, is de vorige volzin op daartoe
      gedaan verzoek van degene op wiens naam het kenteken wordt gesteld van overeenkomstige toepassing. De inspecteur
      beslist op het verzoek bij voor bezwaar vatbare beschikking. Bij inwilliging van het verzoek treedt vanaf de datum
      van de beschikking degene op wiens naam het kenteken is gesteld voor de toepassing van dit artikel in de plaats
      van degene aan wie de teruggaaf is verleend. Ingeval gedurende de eerste vijf jaren na registratie in het in
      [artikel 1, tweede lid][ref1], bedoelde register, niet langer wordt voldaan aan de in dit lid gestelde voorwaarden
      en beperkingen, wordt het teruggegeven bedrag alsnog als belasting verschuldigd. Het achtste en negende lid zijn
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005806#Artikel1
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0005806
        artikel: '1'
        hoofdstuk: I
        afdeling: '1'
  - number: 15a.11
    text: |-
      Indien een of meer personen worden vervoerd in de laadruimte van een bestelauto, vormt dit een verzuim ter zake
      waarvan de inspecteur aan degene die het motorrijtuig feitelijk ter beschikking heeft een boete van ten hoogste €
      453 kan opleggen. De bevoegdheid tot het opleggen van de boete vervalt door verloop van een jaar na het constateren
      van het in de vorige volzin bedoelde verzuim.
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel15a
  - number: 15a.12
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ter uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel15a
  - number: 15b.1
    text: |-
      Wanneer degene die gehouden is voor een bestelauto de belasting op aangifte te voldoen voor die bestelauto in
      aanmerking komt voor een teruggaaf van belasting op grond van [artikel 15][ref1] of [15a][ref2], wordt de teruggaaf
      niet verleend dan nadat de belasting op aangifte is voldaan, met dien verstande dat de belasting die op aangifte
      moet worden voldaan, kan worden verrekend met het bedrag van de teruggaaf indien daar in de aangifte om wordt
      verzocht.


      [ref1]: https://wetten.overheid.nl/BWBR0005806#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0005806#Artikel15a
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel15b
    references:
      - id: ref1
        bwb_id: BWBR0005806
        artikel: '15'
        hoofdstuk: IV
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005806
        artikel: 15a
        hoofdstuk: IV
        afdeling: '2'
  - number: 15b.2
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ter uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel15b
  - number: '16.1'
    text: |-
      Teruggaaf van belasting wordt, onder bij algemene maatregel van bestuur te stellen voorwaarden en beperkingen, op
      aanvraag verleend voor personenauto’s die zijn bestemd om geheel of nagenoeg geheel te worden gebruikt voor het
      verrichten van openbaar vervoer of taxivervoer in de zin van de [Wet personenvervoer 2000][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011470
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0011470
  - number: '16.2'
    text: De teruggaaf wordt verleend aan degene op wiens naam het kenteken is gesteld.
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel16
  - number: '16.3'
    text: De inspecteur beslist op de aanvraag bij voor bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel16
  - number: '16.4'
    text: |-
      De aanspraak op teruggaaf ontstaat op het tijdstip waarop aan de voorwaarden en beperkingen voor teruggaaf als
      bedoeld in het eerste lid wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel16
  - number: '16.5'
    text: |-
      Indien het in het vierde lid bedoelde tijdstip is gelegen na het tijdstip waarop de personenauto is ingeschreven
      in het in [artikel 1, tweede lid][ref1], bedoelde register, bedraagt de teruggaaf het belastingbedrag nadat dit
      is verminderd overeenkomstig [artikel 10, tweede of vierde lid][ref2], met dien verstande dat ingeval voor een
      personenauto al eerder teruggaaf is verleend, de teruggaaf niet meer bedraagt dan dit belastingbedrag verminderd
      met de eerdere teruggaven, voor zover de eerder teruggegeven bedragen niet later alsnog als verschuldigde belasting
      zijn voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005806#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005806#Artikel10
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0005806
        artikel: '1'
        hoofdstuk: I
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005806
        artikel: '10'
        hoofdstuk: III
        afdeling: '2'
  - number: '16.6'
    text: |-
      Indien in het eerste, tweede of derde jaar na het in het vierde lid bedoelde tijdstip niet langer aan de
      voorwaarden en beperkingen voor teruggaaf, bedoeld in het eerste lid wordt voldaan, wordt vanaf het moment
      dat hieraan niet langer wordt voldaan het teruggegeven bedrag voor de nog niet verstreken maanden van het
      desbetreffende jaar en de nog niet verstreken hele jaren van deze drie jaarsperiode naar tijdsevenredigheid als
      belasting verschuldigd. Indien voor de reeds verstreken periode van het desbetreffende jaar de personenauto niet
      geheel of nagenoeg geheel is gebruikt voor het in het eerste lid bedoelde vervoer wordt voor de tijdsevenredige
      berekening van de verschuldigde belasting ook dit jaar geheel in aanmerking genomen. De verschuldigd geworden
      belasting wordt op aangifte voldaan binnen een maand na het tijdstip waarop niet langer aan de voorwaarden en
      beperkingen voor teruggaaf, bedoeld in het eerste lid wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel16
  - number: '16.7'
    text: |-
      Indien over het eerste, tweede of derde jaar na het in het vierde lid bedoelde tijdstip bezien uitsluitend niet
      is voldaan aan de voorwaarde dat de personenauto geheel of nagenoeg geheel wordt gebruikt voor het in het eerste
      lid bedoelde vervoer, wordt telkens een derde deel van het teruggegeven bedrag als belasting verschuldigd. De
      verschuldigd geworden belasting wordt op aangifte voldaan binnen een maand na afloop van het desbetreffende jaar.
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel16
  - number: '16.8'
    text: |-
      Bij wijziging van de tenaamstelling van de personenauto blijven, op daartoe gedaan gezamenlijk verzoek van degene
      op wiens naam het kenteken wordt gesteld en degene op wiens naam het kenteken daarvoor was gesteld, het eerste
      en zesde lid buiten toepassing indien overigens voldaan blijft worden aan de voorwaarden en beperkingen waaronder
      de teruggaaf is verleend. Bij inwilliging van het verzoek treedt degene op wiens naam het kenteken wordt gesteld
      vanaf het moment van de wijziging van de tenaamstelling voor de toepassing van dit artikel in de plaats van degene
      op wiens naam het kenteken daarvoor was gesteld. De inspecteur beslist op het verzoek bij voor bezwaar vatbare
      beschikking.
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel16
  - number: 16aa.1
    text: |-
      In afwijking van [artikel 15, vierde lid][ref1], [artikel 15a, achtste en tiende lid][ref2], en
      [artikel 16, zesde lid][ref3], is het teruggegeven bedrag niet als belasting verschuldigd indien:


      [ref1]: https://wetten.overheid.nl/BWBR0005806#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0005806#Artikel15a
      [ref3]: https://wetten.overheid.nl/BWBR0005806#Artikel16
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel16aa
    references:
      - id: ref1
        bwb_id: BWBR0005806
        artikel: '15'
        hoofdstuk: IV
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005806
        artikel: 15a
        hoofdstuk: IV
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0005806
        artikel: '16'
        hoofdstuk: IV
        afdeling: '2'
  - number: 16aa.1.a
    text: |-
      de tenaamstelling van het kenteken in het in [artikel 1, tweede lid][ref1], bedoelde register wordt beëindigd omdat
      het motorrijtuig buiten Nederland wordt gebracht;


      [ref1]: https://wetten.overheid.nl/BWBR0005806#Artikel1
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel16aa
    references:
      - id: ref1
        bwb_id: BWBR0005806
        artikel: '1'
        hoofdstuk: I
        afdeling: '1'
  - number: 16aa.1.b
    text: |-
      de tenaamstelling van het kenteken in het in [artikel 1, tweede lid][ref1], bedoelde register wordt beëindigd omdat
      het motorrijtuig wordt gesloopt; of


      [ref1]: https://wetten.overheid.nl/BWBR0005806#Artikel1
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel16aa
    references:
      - id: ref1
        bwb_id: BWBR0005806
        artikel: '1'
        hoofdstuk: I
        afdeling: '1'
  - number: 16aa.1.c
    text: |-
      het motorrijtuig is gestolen en een melding van diefstal van het motorrijtuig is geplaatst in het in
      [artikel 1, tweede lid][ref1], bedoelde register.


      [ref1]: https://wetten.overheid.nl/BWBR0005806#Artikel1
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel16aa
    references:
      - id: ref1
        bwb_id: BWBR0005806
        artikel: '1'
        hoofdstuk: I
        afdeling: '1'
  - number: 16aa.2
    text: |-
      Het teruggegeven bedrag wordt, met overeenkomstige toepassing van [artikel 10][ref1], alsnog als belasting
      verschuldigd:


      [ref1]: https://wetten.overheid.nl/BWBR0005806#Artikel10
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel16aa
    references:
      - id: ref1
        bwb_id: BWBR0005806
        artikel: '10'
        hoofdstuk: III
        afdeling: '2'
  - number: 16aa.2.a
    text: |-
      op het moment van de tenaamstelling van het kenteken, indien na toepassing van het eerste lid, onderdeel a of b,
      het kenteken dat voor het motorrijtuig is opgegeven opnieuw wordt tenaamgesteld;
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel16aa
  - number: 16aa.2.b
    text: |-
      op het moment van de hernieuwde aanvang van het gebruik met het motorrijtuig van de weg in de zin van de
      [Wegenverkeerswet 1994][ref1], indien na toepassing van het eerste lid, onderdeel a of b, het motorrijtuig
      feitelijk ter beschikking staat van een in Nederland wonende natuurlijke persoon of gevestigd lichaam, zonder dat
      het kenteken opnieuw te naam is gesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0006622
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel16aa
    references:
      - id: ref1
        bwb_id: BWBR0006622
  - number: 16aa.2.c
    text: |-
      op het moment van de verwijdering van de melding van diefstal uit het register, indien na toepassing van het eerste
      lid, onderdeel c, het motorrijtuig wordt teruggevonden, met dien verstande dat geen belasting verschuldigd is als
      het kenteken op dat moment nog op naam staat van degene aan wie de teruggaaf is verleend en deze het teruggevonden
      motorrijtuig aansluitend opnieuw in gebruik neemt binnen de voorwaarden van de teruggaaf. In het laatste geval
      blijven de feiten die zich hebben voorgedaan in de periode dat het motorrijtuig was gestolen buiten beschouwing
      voor de vraag, of aan de voorwaarden en beperkingen van de teruggaaf wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel16aa
  - number: 16aa.3
    text: |-
      Bij de toepassing van het tweede lid zijn de [artikelen 5][ref1], [6][ref2], en [12b][ref3] van overeenkomstige
      toepassing, met dien verstande, dat bij de toepassing van het tweede lid, onderdeel c, de belasting wordt voldaan
      binnen een maand na de verwijdering van de melding van diefstal uit het register.


      [ref1]: https://wetten.overheid.nl/BWBR0005806#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005806#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0005806#Artikel12b
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel16aa
    references:
      - id: ref1
        bwb_id: BWBR0005806
        artikel: '5'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0005806
        artikel: '6'
        hoofdstuk: III
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0005806
        artikel: 12b
        hoofdstuk: III
        afdeling: '3'
  - number: 16aa.4
    text: |-
      Voor personenauto’s waarvoor de belasting is teruggegeven ingevolge [artikel 16][ref1], is het eerste lid,
      onderdeel a, slechts van toepassing, indien gedurende ten minste twaalf maanden is voldaan aan de voorwaarden en
      beperkingen, bedoeld in [artikel 16, eerste lid][ref2]. Voorts wordt het ingevolge het tweede lid verschuldigde
      bedrag met een derde deel verminderd voor ieder jaar, waarin voor de personenauto wordt voldaan aan de voorwaarden
      en beperkingen, bedoeld in [artikel 16, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005806#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0005806#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0005806#Artikel16
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel16aa
    references:
      - id: ref1
        bwb_id: BWBR0005806
        artikel: '16'
        hoofdstuk: IV
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005806
        artikel: '16'
        hoofdstuk: IV
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0005806
        artikel: '16'
        hoofdstuk: IV
        afdeling: '2'
  - number: 16aa.5
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ter uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel16aa
  - number: 16a.1
    text: |-
      In geval van een verhoging van de in [artikel 9][ref1] opgenomen tarieven wordt voor een personenauto, motorrijwiel
      of bestelauto waarvoor voorafgaande aan het tijdstip waarop de verhoging in werking treedt, een kentekenbewijs
      is afgegeven dat nog niet is tenaamgesteld, de belasting berekend op de voet van [artikel 9][ref2], zoals dat
      luidde voor de inwerkingtreding, mits de tenaamstelling van het kenteken plaatsvindt binnen twee maanden na de
      inwerkingtreding. Indien de tenaamstelling plaatsvindt nadat deze twee maanden zijn verstreken, wordt de belasting
      berekend op de voet van [artikel 9][ref3], zoals dat luidt nadat de verhoging in werking is getreden.


      [ref1]: https://wetten.overheid.nl/BWBR0005806#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0005806#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0005806#Artikel9
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel16a
    references:
      - id: ref1
        bwb_id: BWBR0005806
        artikel: '9'
        hoofdstuk: III
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005806
        artikel: '9'
        hoofdstuk: III
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0005806
        artikel: '9'
        hoofdstuk: III
        afdeling: '2'
  - number: 16a.2
    text: |-
      In geval van een verlaging van de in [artikel 9][ref1] opgenomen tarieven wordt voor een personenauto, motorrijwiel
      of bestelauto waarvoor voorafgaande aan het tijdstip waarop de verlaging in werking treedt, een kentekenbewijs is
      afgegeven dat nog niet is tenaamgesteld, de belasting berekend op de voet van [artikel 9][ref2], zoals dat luidt
      nadat de verlaging in werking is getreden.


      [ref1]: https://wetten.overheid.nl/BWBR0005806#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0005806#Artikel9
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel16a
    references:
      - id: ref1
        bwb_id: BWBR0005806
        artikel: '9'
        hoofdstuk: III
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005806
        artikel: '9'
        hoofdstuk: III
        afdeling: '2'
  - number: 16a.3
    text: |-
      Bij ministeriële regeling kunnen in overleg met Onze Minister van Verkeer en Waterstaat nadere regels worden
      gesteld ter uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel16a
  - number: '17.1'
    text: |-
      Degene, aan wie op de voet van [artikel 8][ref1] is toegestaan de belasting per tijdvak te voldoen, stelt zekerheid
      voor de belasting die hij verschuldigd is of kan worden.


      [ref1]: https://wetten.overheid.nl/BWBR0005806#Artikel8
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0005806
        artikel: '8'
        hoofdstuk: III
        afdeling: '1'
  - number: '17.2'
    text: Het bedrag van de zekerheid wordt door de inspecteur vastgesteld bij voor bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel17
  - number: '17.3'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld voor de bepaling van de hoogte van het bedrag van
      de zekerheid.
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel17
  - number: '17.4'
    text: De zekerheid wordt gesteld bij de ontvanger.
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel17
  - number: '17.5'
    text: De ontvanger beslist of de vorm van zekerheid die wordt aangeboden, wordt aanvaard.
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel17
  - number: '17.6'
    text: De aan het stellen van zekerheid verbonden kosten komen ten laste van degene aan wie de vergunning is verleend.
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel17
  - number: '17.7'
    text: |-
      Ingeval de zekerheid wordt gesteld in geld wordt daarover een rente vergoed die gelijk is aan de
      herfinancieringsrente, te weten de minimale biedrente die de Europese Centrale Bank hanteert voor
      basisherfinancieringstransacties.
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel17
  - number: '17.8'
    text: |-
      Voor de toepassing van het zevende lid wordt het over een kalendermaand te vergoeden rentebedrag berekend naar de
      rente die geldt bij de aanvang van die maand.
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel17
  - number: '18'
    text: |-
      Op eerste vordering van ambtenaren van de rijksbelastingdienst of van opsporingsambtenaren als bedoeld in
      [artikel 141 van het Wetboek van Strafvordering][ref1] is de bestuurder van een motorrijtuig verplicht dat te doen
      stilstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
  - number: '19'
    text: |-
      De in [artikel 18][ref1] bedoelde ambtenaren zijn bevoegd een motorrijtuig te onderwerpen aan een onderzoek en
      het daartoe te brengen of te doen brengen naar een nabij gelegen plaats. De bestuurder van het motorrijtuig en
      bij diens afwezigheid degene die het motorrijtuig houdt, is verplicht desgevorderd zijn voor het onderzoek en het
      vervoer noodzakelijke medewerking te verlenen en de ambtenaren met het motorrijtuig te vervoeren.


      [ref1]: https://wetten.overheid.nl/BWBR0005806#Artikel18
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0005806
        artikel: '18'
        hoofdstuk: V
        afdeling: '2'
  - number: '20.1'
    text: |-
      Bij algemene maatregel van bestuur kunnen ter verzekering van een juiste toepassing van de wet nadere regels worden
      gesteld ter aanvulling van de in deze wet geregelde onderwerpen.
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel20
  - number: '20.2'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van de in het eerste
      lid bedoelde algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel20
  - number: '31.1'
    text: |-
      Indien met betrekking tot personenauto’s en motorrijwielen die na 31 december 1992 worden geregistreerd vóór 1
      januari 1993 bijzondere verbruiksbelasting van personenauto’s of bijzondere verbruiksbelasting van motorrijwielen
      op de voet van [artikel 50][ref1] onderscheidenlijk van [artikel 50a van de Wet op de omzetbelasting 1968][ref2]
      verschuldigd is geworden, wordt die belasting verrekend met de belasting van personenauto’s en motorrijwielen.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel50
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel50a
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '50'
      - id: ref2
        bwb_id: BWBR0002629
        artikel: 50a
  - number: '31.2'
    text: |-
      Met betrekking tot personenauto’s en motorrijwielen die vóór 1 januari 1993 zijn geregistreerd en die niet vóór
      die datum zijn ingevoerd of geleverd door de fabrikant in de zin van de [artikelen 50, eerste lid][ref1], en
      [50a, eerste lid, van de Wet op de omzetbelasting 1968][ref2] zoals deze luidden op 31 december 1992, wordt
      de belasting verschuldigd ter zake van de aanvang van het gebruik na 31 december 1992 met dat motorrijtuig in
      Nederland van de weg in de zin van de [Wegenverkeerswet 1994][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel50
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel50a
      [ref3]: https://wetten.overheid.nl/BWBR0006622
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '50'
      - id: ref2
        bwb_id: BWBR0002629
        artikel: 50a
      - id: ref3
        bwb_id: BWBR0006622
  - number: '31.4'
    text: |-
      Indien vóór 1 januari 1993 geregistreerde motorrijtuigen als bedoeld
      in [artikel 50, tweede lid, onderdelen a, b, c en d, ][ref1] en
      [artikel 50a, tweede lid, onderdelen a en b, van de Wet op de omzetbelasting 1968][ref2], zoals die luidden op
      31 december 1992, in een zodanige staat worden gebracht dat zij een personenauto of een motorrijwiel worden in
      de zin van [artikel 50][ref3], onderscheidenlijk [artikel 50a van de Wet op de omzetbelasting 1968][ref4], zoals
      die luidden op 31 december 1992, is belasting van personenauto’s en motorrijwielen verschuldigd. De belasting is
      verschuldigd door degene op wiens naam het motorrijtuig is geregistreerd.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel50
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel50a
      [ref3]: https://wetten.overheid.nl/BWBR0002629#Artikel50
      [ref4]: https://wetten.overheid.nl/BWBR0002629#Artikel50a
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '50'
      - id: ref2
        bwb_id: BWBR0002629
        artikel: 50a
      - id: ref3
        bwb_id: BWBR0002629
        artikel: '50'
      - id: ref4
        bwb_id: BWBR0002629
        artikel: 50a
  - number: '31.5'
    text: |-
      Met betrekking tot personenauto’s en motorrijwielen waarvoor bijzondere verbruiksbelasting van personenauto’s
      of bijzondere verbruiksbelasting van motorrijwielen is verschuldigd geworden en die na 31 december 1992
      worden uitgevoerd in de zin van [artikel 50, elfde lid, van de Wet op de omzetbelasting 1968][ref1],
      zoals dat luidde op 31 december 1992, blijven in afwijking van [artikel 25, onderdeel B][ref2],
      na 31 december 1992 de [artikelen 50, elfde lid][ref3], onderscheidenlijk
      [artikel 50a, vierde lid, van de Wet op de omzetbelasting 1968][ref4] van toepassing, zoals die luidde op 31
      december 1992.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel50
      [ref2]: https://wetten.overheid.nl/BWBR0005806#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0002629#Artikel50
      [ref4]: https://wetten.overheid.nl/BWBR0002629#Artikel50a
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '50'
      - id: ref2
        bwb_id: BWBR0005806
        artikel: '25'
        hoofdstuk: Va
      - id: ref3
        bwb_id: BWBR0002629
        artikel: '50'
      - id: ref4
        bwb_id: BWBR0002629
        artikel: 50a
  - number: '31.6'
    text: |-
      Met betrekking tot een personenauto die vóór 1 januari 1993 is geregistreerd en die blijkens een
      ingevolge de [Wet personenvervoer 2000][ref1] geldige vergunning, dan wel vergunningbewijs, is bestemd om
      openbaar vervoer of taxivervoer te verrichten, wordt, in afwijking van [artikel 25, onderdeel B][ref2],
      teruggaaf verleend van de betaalde bijzondere verbruiksbelasting van personenauto’s op de voet van
      [artikel 50, twaalfde lid, van de Wet op de omzetbelasting 1968][ref3], zoals dat luidde op 31 december 1992.


      [ref1]: https://wetten.overheid.nl/BWBR0011470
      [ref2]: https://wetten.overheid.nl/BWBR0005806#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0002629#Artikel50
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0011470
      - id: ref2
        bwb_id: BWBR0005806
        artikel: '25'
        hoofdstuk: Va
      - id: ref3
        bwb_id: BWBR0002629
        artikel: '50'
  - number: '32.1'
    text: |-
      Ondernemers die op 31 december 1992 in het bezit zijn van een aanwijzing op grond van
      [artikel 23 van de Wet op de omzetbelasting 1968][ref1], juncto [artikel 18][ref2] (*Stcrt.* 1968, 169), dan wel
      zijn toegelaten tot de Algemene regeling versnelde afgifte kentekenbewijzen delen I, worden geacht op 1 januari
      1993 in het bezit te zijn van een vergunning als bedoeld in artikel 8 van de Wet op de belasting van personenauto’s
      en motorrijwielen 1992.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0002634#Artikel18a
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '23'
      - id: ref2
        bwb_id: BWBR0002634
        artikel: 18a
  - number: '32.2'
    text: |-
      De in het eerste lid bedoelde vergunningen zijn geldig tot aan het moment dat de inspecteur deze bij beschikking
      definitief vaststelt, wijzigt of intrekt, doch uiterlijk tot en met 31 december 1993.
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel32
  - number: '34'
    text: |-
      Bij ministeriële regeling kunnen nadere, zo nodig van de bepalingen van deze wet afwijkende regels worden
      gesteld die tot 1 juli 1993 de overgang van de krachtens de [Wet op de omzetbelasting 1968][ref1] geheven
      bijzondere verbruiksbelastingen van personenauto’s en motorrijwielen naar de krachtens deze wet geheven belasting
      vergemakkelijken.


      [ref1]: https://wetten.overheid.nl/BWBR0002629
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0002629
  - number: '35'
    text: |-
      Waar in deze wet de Wet op de belasting van personenauto’s en motorrijwielen 1992 is aangehaald met vermelding
      van het *Staatsblad* waarin die wet is geplaatst, wordt bij plaatsing van deze wet in het *Staatsblad* na '*Stb.*'
      ingevoegd het nummer van het *Staatsblad* waarin de Wet op de belasting van personenauto’s en motorrijwielen 1992
      is geplaatst.
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel35
  - number: '36'
    text: Deze wet treedt in werking met ingang van 1 januari 1993.
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel36
  - number: '37'
    text: Deze wet kan worden aangehaald als Wet op de belasting van personenauto’s en motorrijwielen 1992.
    url: https://wetten.overheid.nl/BWBR0005806/2007-01-01#Artikel37
