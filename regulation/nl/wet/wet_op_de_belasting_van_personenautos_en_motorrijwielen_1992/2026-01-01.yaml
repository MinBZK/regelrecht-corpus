  - number: '15'
    text: |-
      1 Teruggaaf van belasting wordt, onder bij algemene maatregel van bestuur te stellen voorwaarden en beperkingen, op
      aanvraag verleend voor personenauto's, motorrijwielen en bestelauto's die:

      a. zijn ingericht om te worden gebruikt door de politie en als zodanig uiterlijk kenbaar zijn;

      b. zijn ingericht om te worden gebruikt door de brandweer en als zodanig uiterlijk kenbaar zijn;

      c.

      d. zijn ingericht voor het vervoer van zieken en gewonden en als zodanig uiterlijk kenbaar zijn;

      e. zijn ingericht voor het vervoer van stoffelijke overschotten en als zodanig uiterlijk kenbaar zijn;

      f. zijn ingericht voor het vervoer van gevangenen en als zodanig uiterlijk kenbaar zijn;

      g. zijn ingericht en uitsluitend worden gebruikt voor het vervoer van rolstoelgebruikers in groepsverband;

      h. zijn ingericht voor het vervoer van zieke of gewonde dieren en als zodanig uiterlijk kenbaar zijn.

      2 De teruggaaf wordt verleend aan degene op wiens naam het motorrijtuig is gesteld.

      3 De inspecteur beslist op de aanvraag bij voor bezwaar vatbare beschikking.

      4 In geval niet langer wordt voldaan aan de voorwaarden en beperkingen voor teruggaaf, wordt vanaf dat moment het
      teruggegeven bedrag, nadat dit is verminderd met overeenkomstige toepassing van [artikel 10, vijfde lid][ref1],
      als belasting verschuldigd. Artikel 10, derde, vierde, achtste en negende lid, is van overeenkomstige toepassing.
      De verschuldigd geworden belasting wordt door degene aan wie de teruggaaf is verleend, op aangifte voldaan binnen
      een maand na het moment dat niet langer aan de voorwaarden en beperkingen wordt voldaan.

      5 Bij wijziging van de tenaamstelling van een personenauto, motorrijwiel of bestelauto blijven, op daartoe
      gedaan gezamenlijk verzoek van degene op wiens naam het motorrijtuig wordt gesteld en degene op wiens naam het
      motorrijtuig daarvoor was gesteld, het eerste en vierde lid buiten toepassing indien overigens voldaan blijft
      worden aan de voorwaarden en beperkingen waaronder de teruggaaf is verleend. Bij inwilliging van het verzoek treedt
      degene op wiens naam het motorrijtuig wordt gesteld vanaf het moment van de wijziging van de tenaamstelling voor
      de toepassing van dit artikel in de plaats van degene op wiens naam het motorrijtuig daarvoor was gesteld. De
      inspecteur beslist op het verzoek bij voor bezwaar vatbare beschikking.


