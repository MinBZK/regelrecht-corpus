        paragraaf: 4.1.3.3
  - number: 14a
    text: |-
      1 Teruggaaf van belasting wordt, onder bij algemene maatregel van bestuur te stellen voorwaarden en beperkingen, op
      aanvraag verleend voor personenauto’s, motorrijwielen en bestelauto’s indien de tenaamstelling van het motorrijtuig
      in het kentekenregister komt te vervallen omdat het motorrijtuig buiten Nederland wordt gebracht, het motorrijtuig
      overeenkomstig Richtlijn 1999/37/EG van de Raad van 29 april 1999 inzake de kentekenbewijzen van motorvoertuigen
      (PbEG 1999, L 138) wordt ingeschreven in een andere lidstaat van de Europese Unie of een staat die partij is bij
      de Overeenkomst betreffende de Europese Economische Ruimte en als bewijs van die inschrijving door de bevoegde
      autoriteit een kentekenbewijs wordt afgegeven, met uitzondering van een kentekenbewijs dat is afgegeven op basis
      van een tijdelijke inschrijving van het motorrijtuig als bedoeld in artikel 1 van die richtlijn. De teruggaaf
      wordt verleend aan degene op wiens naam het motorrijtuig was gesteld direct voorafgaand aan het vervallen van de
      tenaamstelling in het kentekenregister.

      2 Teruggaaf van belasting wordt, onder bij algemene maatregel van bestuur te stellen voorwaarden en beperkingen, op
      aanvraag verleend voor in een andere lidstaat van de Europese Unie of een staat die partij is bij de Overeenkomst
      betreffende de Europese Economische Ruimte ingeschreven personenauto’s, motorrijwielen en bestelauto’s waarvoor de
      belasting is geheven ter zake van de aanvang van het gebruik met dat motorrijtuig van de weg door een in Nederland
      wonende natuurlijke persoon of gevestigd lichaam, indien het motorrijtuig niet langer feitelijk ter beschikking
      staat van de in Nederland wonende natuurlijke persoon of het in Nederland gevestigde lichaam en het motorrijtuig
      weer buiten Nederland is gebracht. De teruggaaf wordt verleend aan degene van wie de belasting ingevolge
      [artikel 5, tweede lid][ref1], is geheven.

      3 De teruggaaf, bedoeld in het eerste en tweede lid, wordt uitsluitend verleend indien de belasting is betaald ter
      zake van de inschrijving of herinschrijving van het motorrijtuig, of indien de inschrijving heeft plaatsgevonden
      voor 1 januari 2022, ter zake van de registratie van het motorrijtuig of de tenaamstelling van het motorrijtuig of,
      indien de registratie heeft plaatsgevonden voor 1 januari 2014, het kenteken, dan wel de aanvang van het gebruik
      met het motorrijtuig van de weg, op of na 16 oktober 2006.

      4 De teruggaaf bedraagt het belastingbedrag, nadat dit is verminderd overeenkomstig bij ministeriële regeling
      vast te stellen regels. Ingeval voor het motorrijtuig al eerder teruggaaf van de belasting is verleend, wordt
      de teruggaaf slechts verleend voorzover de eerder teruggegeven belasting op een later tijdstip alsnog als
      verschuldigde belasting is voldaan.

      5 Bedragen van minder dan € 50 worden niet teruggegeven.

      6 Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0005806#Artikel5
