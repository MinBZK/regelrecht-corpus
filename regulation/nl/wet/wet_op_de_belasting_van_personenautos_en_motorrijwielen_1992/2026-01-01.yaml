      Degene die voor een personenauto, een motorrijwiel of een bestelauto een aanvraag doet voor de inschrijving,
      wijziging van de inschrijving of herinschrijving, is gehouden daarbij voor dat motorrijtuig het bedrag aan
      belasting ingevolge de [artikelen 9 tot en met 9c][ref1] op te geven.


