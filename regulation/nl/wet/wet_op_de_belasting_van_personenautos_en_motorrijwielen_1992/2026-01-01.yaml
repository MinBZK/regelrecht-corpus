  - number: '10'
    text: |-
      1 Met betrekking tot gebruikte personenauto's, gebruikte motorrijwielen of gebruikte bestelauto's wordt
      het bij de personenauto, het motorrijwiel of de bestelauto behorende bedrag aan belasting, bedoeld in
      [artikel 9, eerste, derde en twaalfde lid][ref1], berekend met inachtneming van een vermindering.

      2 De vermindering, bedoeld in het eerste lid, is de afschrijving, uitgedrukt in procenten van de som van de
      catalogusprijs, bedoeld in [artikel 9, vijfde lid][ref2], en de belasting van personenauto’s en motorrijwielen
      op het tijdstip waarop het motorrijtuig voor het eerst in gebruik is genomen. Ter zake van de inschrijving of
      herinschrijving is voor de hoogte van de vermindering en het tarief het tijdstip bepalend waarop het onderzoek
      door de Dienst Wegverkeer dat tot de inschrijving of herinschrijving leidt als geregeld bij en krachtens
      [artikel 47 Wegenverkeerswet 1994][ref3] is afgerond.

      3 Indien na het tijdstip waarop de personenauto, het motorrijwiel of de bestelauto voor het eerst in gebruik is
      genomen, een tijdsduur is verstreken van 25 jaar of meer, bedraagt in afwijking van het tweede lid het percentage
      van de vermindering 100.

      4 Indien het tijdstip waarop de personenauto, het motorrijwiel of de bestelauto voor het eerst in gebruik is
      genomen niet bekend is, treedt daarvoor in de plaats de laatste dag van het jaar waarin de personenauto, het
      motorrijwiel of de bestelauto is vervaardigd.

      5 In afwijking van het tweede lid wordt de vermindering, mits daartoe een verzoek bij de aangifte wordt gedaan,
      vastgesteld overeenkomstig bij ministeriële regeling vast te stellen regels.

      6 De afschrijving, bedoeld in het tweede lid, wordt, mits daartoe een verzoek bij de aangifte wordt gedaan, gesteld
      op de som van de catalogusprijs, bedoeld in [artikel 9, vijfde lid][ref4], en belasting van personenauto’s en
      motorrijwielen, op het tijdstip waarop het motorrijtuig voor het eerst in gebruik is genomen en zoals deze blijkt
      uit een in de handel algemeen toegepaste koerslijst voor de inkoop van gebruikte motorrijtuigen door wederverkopers
      in Nederland, verminderd met de handelsinkoopwaarde die voor dat motorrijtuig eveneens blijkt uit deze koerslijst.

      7 De afschrijving, bedoeld in het tweede lid, wordt, mits daartoe een verzoek bij de aangifte wordt gedaan, gesteld
      op de som van de catalogusprijs, bedoeld in [artikel 9, vijfde lid][ref5], en de belasting van personenauto’s
      en motorrijwielen op het tijdstip waarop het motorrijtuig voor het eerst in gebruik is genomen, verminderd met
      de taxatiewaarde vermeld in een taxatierapport dat voldoet aan bij ministeriële regeling te stellen voorwaarden,
      indien het motorrijtuig op het tijdstip dat bepalend is voor de hoogte van de vermindering:

      a. meer dan normale gebruiksschade heeft of niet als zodanig voorkomt op een in de handel algemeen toegepaste
      koerslijst voor de inkoop van gebruikte motorrijtuigen door wederverkopers in Nederland; en

      b. voldoet aan de bij of krachtens de [Wegenverkeerswet 1994](onbekend) vastgestelde eisen waardoor met dat
      motorrijtuig mag worden gereden op de weg.

      8 Bij de aangifte wordt een opgaaf gedaan van de gegevens die bij de aangifte zijn gebruikt voor het vaststellen
      van de afschrijving, bedoeld in het tweede lid, dan wel voor de toepassing van de regels, bedoeld in het vijfde
      lid. Wanneer naar het oordeel van de inspecteur gegevens ontbreken die van belang kunnen zijn voor de vaststelling
      van de in het eerste lid bedoelde vermindering, worden de ontbrekende gegevens toegevoegd. Gegevens die niet bij
      de aangifte zijn gebruikt voor het vaststellen van de afschrijving, en evenmin op verzoek van de inspecteur zijn
      toegevoegd, kunnen door degene die gehouden is de belasting op aangifte te voldoen niet op een later tijdstip
      alsnog worden gebruikt om de bij de aangifte toegepaste afschrijving te wijzigen.

      9 Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
      Daarbij kan de vermindering, bedoeld in het tweede lid, worden verhoogd voor motorrijtuigen als bedoeld in
      [artikel 15, eerste lid, onderdelen a, b, en g][ref6]. Voorts kan daarbij een termijn worden vastgesteld waarbinnen
      het motorrijtuig in ongewijzigde staat beschikbaar wordt gehouden voor controle met het oog op een juiste
      vaststelling van de afschrijving, bedoeld in het tweede lid. Voorts kunnen nadere voorwaarden worden gesteld over
      waar en op welk moment een aangifte met een verzoek als bedoeld het vijfde, zesde of zevende lid wordt gedaan.


