  - number: '8'
    text: |-
      In afwijking van [artikel 6, tweede lid, onderdeel a, onder 1°][ref1], kan de inspecteur, onder bij ministeriële
      regeling te stellen voorwaarden en beperkingen, een ondernemer die in het kader van zijn bedrijfsuitoefening
      regelmatig om inschrijving, wijziging van de inschrijving of herinschrijving verzoekt voor personenauto’s,
      motorrijwielen of bestelauto’s, op aanvraag bij voor bezwaar vatbare beschikking toestaan de belasting per tijdvak
      te voldoen.


