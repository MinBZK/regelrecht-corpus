      1 Vrijstelling van belasting wordt in andere gevallen dan waarin vrijstelling van belasting wordt verleend
      krachtens [artikel 39 van de Algemene wet inzake rijksbelastingen][ref1], verleend voor personenauto's,
      motorrijwielen en bestelauto's waarvoor een kenteken als bedoeld in [artikel 37, derde lid][ref2],
      is of wordt opgegeven en die niet zijn ingeschreven, dan wel een kenteken als bedoeld in
      [artikel 38, eerste lid, van de Wegenverkeerswet 1994][ref3] is of wordt opgegeven.

      2 Vrijstelling van belasting wordt verleend voor personenauto's, motorrijwielen en bestelauto's die bij of
      krachtens [artikel 4, eerste lid, onderdeel a, van de Wegenverkeerswet 1994][ref4] niet behoeven te worden
      ingeschreven in het kentekenregister.


