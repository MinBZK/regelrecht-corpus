  - number: 15b
    text: |-
      1 Wanneer degene die gehouden is voor een bestelauto de belasting op aangifte te voldoen voor die bestelauto in
      aanmerking komt voor een teruggaaf van belasting op grond van [artikel 15a][ref1], wordt de teruggaaf niet verleend
      dan nadat de belasting op aangifte is voldaan, met dien verstande dat de belasting die op aangifte moet worden
      voldaan, kan worden verrekend met het bedrag van de teruggaaf indien daar in de aangifte om wordt verzocht.

      2 Bij ministeriële regeling kunnen nadere regels worden gesteld ter uitvoering van dit artikel.


