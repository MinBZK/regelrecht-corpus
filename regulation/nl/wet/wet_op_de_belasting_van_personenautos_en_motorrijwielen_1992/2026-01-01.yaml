  - number: '34'
    text: |-
      Bij ministeriële regeling kunnen nadere, zo nodig van de bepalingen van deze wet afwijkende regels worden
      gesteld die tot 1 juli 1993 de overgang van de krachtens de [Wet op de omzetbelasting 1968][ref1] geheven
      bijzondere verbruiksbelastingen van personenauto’s en motorrijwielen naar de krachtens deze wet geheven belasting
      vergemakkelijken.


      [ref1]: https://wetten.overheid.nl/BWBR0002629
    url: https://wetten.overheid.nl/BWBR0005806/2026-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0002629
  - number: '35'
    text: |-
      Waar in deze wet de Wet op de belasting van personenauto’s en motorrijwielen 1992 is aangehaald met vermelding
      van het *Staatsblad* waarin die wet is geplaatst, wordt bij plaatsing van deze wet in het *Staatsblad* na '*Stb.*'
      ingevoegd het nummer van het *Staatsblad* waarin de Wet op de belasting van personenauto’s en motorrijwielen 1992
      is geplaatst.
    url: https://wetten.overheid.nl/BWBR0005806/2026-01-01#Artikel35
  - number: '36'
    text: Deze wet treedt in werking met ingang van 1 januari 1993.
    url: https://wetten.overheid.nl/BWBR0005806/2026-01-01#Artikel36
  - number: '37'
    text: Deze wet kan worden aangehaald als Wet op de belasting van personenauto’s en motorrijwielen 1992.
    url: https://wetten.overheid.nl/BWBR0005806/2026-01-01#Artikel37
