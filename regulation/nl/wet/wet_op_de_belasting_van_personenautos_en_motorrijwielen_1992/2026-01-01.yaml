      1 Ingeval voor een motorrijtuig waarvoor de belasting is verschuldigd de belasting al eerder is betaald, wordt,
      onder bij ministeriële regeling te stellen voorwaarden en beperkingen, de verschuldigde belasting verminderd met
      een bedrag ter zake van de eerder betaalde belasting.

      2 De vermindering bedraagt ten hoogste het bedrag van de verschuldigde belasting. De vermindering wordt voor een
      gebruikt motorrijtuig berekend met overeenkomstige toepassing van [artikel 14a, vierde lid][ref1].

      3 Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.


