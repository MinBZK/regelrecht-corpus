    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

        - *kentekenregister:* het register, genoemd in
      [artikel 1, eerste lid, onderdeel i, van de Wegenverkeerswet 1994][ref1];
        - *inschrijving:* inschrijving van een motorrijtuig in het kentekenregister als bedoeld in
      [artikel 47 van de Wegenverkeerswet 1994][ref2];
        - *herinschrijving:* beëindiging van de status in het kentekenregister dat een motorrijtuig voorgoed buiten
      Nederland is gebracht, dan wel dat in plaats daarvan voor dat motorrijtuig een hernieuwde inschrijving in het
      kentekenregister plaatsvindt;
        - *normale gebruiksschade:* slijtage en kleine beschadigingen die ontstaan door gebruik van een voertuig en die
      passen bij de leeftijd en kilometrage van het voertuig;
        - *weg:* weg als bedoeld in [artikel 1, eerste lid, onderdeel b, van de Wegenverkeerswet 1994][ref3] in
      Nederland.


