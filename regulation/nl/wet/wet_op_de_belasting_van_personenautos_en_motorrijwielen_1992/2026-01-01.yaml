preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het met het oog op de opheffing van de fiscale grenzen binnen de
    Europese Gemeenschap wenselijk is het stelsel van heffing van de bijzondere verbruiksbelastingen van personenauto’s
    en van motorrijwielen te herzien, alsmede om deze belastingen op te nemen in een afzonderlijke wet en voorts dat
    het gewenst is in het tarief te differentiëren naar een milieu- en een energiegrondslag en het begrip personenauto
    nader te definiëren;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0005806/2026-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Onder de naam 'belasting van personenauto’s en motorrijwielen' wordt een belasting geheven met betrekking tot
      personenauto's, motorrijwielen en bestelauto's.

      2 De belasting is verschuldigd ter zake van de inschrijving van een personenauto, een motorrijwiel of een
      bestelauto.

      3 Ingeval een ingeschreven motorrijtuig zodanig wordt veranderd dat het de hoedanigheid verkrijgt van een
      personenauto, een motorrijwiel of een bestelauto, is de belasting verschuldigd ter zake van de wijziging van de
      inschrijving in personenauto, motorrijwiel of bestelauto dan wel, indien de inschrijving niet wordt gewijzigd in
      personenauto, motorrijwiel of bestelauto, ter zake van de aanvang van het gebruik als personenauto, motorrijwiel of
      bestelauto van de weg.

      4 Ingeval een motorrijtuig als bedoeld in [artikel 9c][ref1] in een zodanige staat wordt gebracht dat deze niet
      meer voldoet aan de in dat artikel genoemde voorwaarden, is de belasting verschuldigd ter zake van de aanvang van
      het gebruik met dit motorrijtuig in gewijzigde staat van de weg.

      5 Ingeval de motor van een personenauto of een bestelauto waarvan de belasting is bepaald op grond van
      [artikel 9][ref2] tijdens de eerste drie jaren na het tijdstip van inschrijving in het kentekenregister in een
      zodanige staat is gebracht dat de CO-uitstoot meer bedraagt dan de CO-uitstoot waarover de belasting is betaald,
      is het verschil tussen deze belasting en de belasting die zou zijn verschuldigd bij deze hogere CO-uitstoot
      verschuldigd ter zake van de aanvang van het gebruik met deze personenauto of deze bestelauto in gewijzigde staat
      van de weg.

      6 Ingeval een niet-ingeschreven personenauto, motorrijwiel of bestelauto feitelijk ter beschikking staat van een
      in Nederland wonende natuurlijke persoon of gevestigd lichaam, is de belasting verschuldigd ter zake van de aanvang
      van het gebruik met dat motorrijtuig van de weg.

      7 Ingeval voor een motorrijtuig waarvoor een teruggaaf als bedoeld in [artikel 14a, eerste lid][ref3], of
      [artikel 16][ref4] is of kan worden verleend een herinschrijving plaatsvindt, is de belasting verschuldigd ter
      zake van die herinschrijving.

      8 Ingeval een motorrijtuig waarvoor een teruggaaf als bedoeld in [artikel 14a, eerste of tweede lid][ref5],
      of [artikel 16][ref6] is of kan worden verleend feitelijk ter beschikking staat van een in Nederland wonende
      natuurlijke persoon of gevestigd lichaam, zonder dat een herinschrijving van dat motorrijtuig heeft plaatsgevonden,
      is de belasting verschuldigd ter zake van de hernieuwde aanvang van het gebruik met dat motorrijtuig van de weg.


