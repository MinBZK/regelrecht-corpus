      1 Indien het bedrag van de belasting op enig tijdstip na twee maanden vóór de eerste ingebruikneming van een
      gebruikt motorrijtuig, ingevolge de wettelijke bepalingen met betrekking tot de maatstaf van heffing, de wijze
