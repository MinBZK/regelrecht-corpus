  - number: 12a
    text: |-
      1 Ingeval van constatering van het gebruik van de weg met een personenauto, een motorrijwiel of
      een bestelauto waarvoor de belasting die is verschuldigd ter zake van een feit als bedoeld in
      [artikel 1, derde tot en met vijfde lid][ref1], niet is betaald, kan de belasting worden nageheven van degene op
      wiens naam het motorrijtuig is gesteld op het moment van constatering. De aanvang van het gebruik van de weg wordt
      gesteld op het tijdstip van de hiervoor bedoelde tenaamstelling.

      2 Indien degene op wiens naam het motorrijtuig is gesteld, aantoont op welk tijdstip na de tenaamstelling het
      motorrijtuig in een zodanige staat is gebracht dat het een personenauto, een motorrijwiel of een bestelauto is,
      onderscheidenlijk niet meer voldoet aan de in [artikel 9c][ref2] genoemde voorwaarden, wordt de aanvang van het
      gebruik van de weg gesteld op dat latere tijdstip.

      3 Indien degene op wiens naam het motorrijtuig is gesteld, aantoont op welk tijdstip na de tenaamstelling de
      motor van een personenauto of een bestelauto in een zodanige staat is gebracht dat de CO2-uitstoot meer bedraagt
      dan de CO2-uitstoot waarover belasting is betaald, wordt de aanvang van het gebruik van de weg bedoeld in
      [artikel 1, vijfde lid][ref3], gesteld op dat latere tijdstip.

      4 Indien degene bij wie de belasting wordt nageheven aantoont dat de personenauto, het motorrijwiel of de
      bestelauto op het tijdstip van tenaamstelling reeds in een zodanige staat verkeerde dat het een personenauto,
      een motorrijwiel of een bestelauto was, onderscheidenlijk niet meer voldeed aan de in [artikel 9c][ref4] genoemde
      voorwaarden, en hij niet wist of behoorde te weten dat de belasting niet is betaald, kan de belasting worden
      nageheven van degene op wiens naam het motorrijtuig daaraan voorafgaand was gesteld, waarbij de aanvang van het
      gebruik van de weg wordt gesteld op het tijdstip van de desbetreffende tenaamstelling. Het tweede lid is van
      overeenkomstige toepassing.

      5 Indien degene bij wie de belasting wordt nageheven aantoont dat de motor van een personenauto of een bestelauto
      op het tijdstip van tenaamstelling reeds in een zodanige staat verkeerde dat de CO-uitstoot meer bedraagt dan
      de CO-uitstoot waarover belasting is betaald, en hij niet wist of behoorde te weten dat de meer verschuldigde
      belasting niet is betaald, kan de belasting worden nageheven van degene op wiens naam het motorrijtuig daaraan
      voorafgaand was gesteld, waarbij de aanvang van het gebruik van de weg bedoeld in [artikel 1, vijfde lid][ref5],
      wordt gesteld op het tijdstip van de desbetreffende tenaamstelling. Het vierde lid is van overeenkomstige
      toepassing.

      6 Naheffing van de belasting vindt plaats van degene die ten onrechte een teruggaafverklaring als bedoeld in
      [artikel 15a, vierde lid][ref6], aan de inschrijver heeft verstrekt.


