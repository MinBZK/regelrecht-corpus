      Het bedrag van de belasting op grond van de tabel wordt in geval van een personenauto die wordt aangedreven door
      een motor met een compressieontsteking die zijn kracht kan ontlenen aan diesel vermeerderd met een bedrag van
      € 114,83 per gram/km CO-uitstoot boven de 69 gram/km CO-uitstoot.

      2

      3 De belasting bedraagt:

      a. voor een bijzondere personenauto als bedoeld in het vijftiende lid 37,7 percent van de netto catalogusprijs,
      verminderd met € 1 283, dan wel, ingeval van een bijzondere personenauto die wordt aangedreven door een motor
      met een compressieontsteking die zijn kracht kan ontlenen aan diesel 37,7 percent van de netto catalogusprijs,
      vermeerderd met € 273;

      b. voor een motorrijwiel:

      1°. met een netto catalogusprijs van niet meer dan € 2 133: 9,6 percent van de netto catalogusprijs;

      2°. met een netto catalogusprijs van meer dan € 2 133: 19,4 percent van de netto catalogusprijs, verminderd met
      € 210;

      c. voor een bestelauto € 74,41 vermenigvuldigd met het aantal gram/km CO-uitstoot.

      4 Onder de netto catalogusprijs wordt verstaan de catalogusprijs verminderd met de daarin begrepen omzetbelasting.

      5 Onder catalogusprijs wordt verstaan de in Nederland door de fabrikant of importeur publiekelijk kenbaar gemaakte
      prijs welke naar zijn inzicht bij verkoop aan de uiteindelijke afnemer valt te berekenen. In die geadviseerde
      verkoopprijs is de belasting van personenauto’s en motorrijwielen zelf niet begrepen. Is een zodanige prijs niet
      bekend, dan wordt hij door vergelijking bepaald.

      6 Voor een nieuwe personenauto, een nieuw motorrijwiel of een nieuwe bestelauto geldt de catalogusprijs bij
      aanvang van de dag waarop aan de personenauto, het motorrijwiel of de bestelauto wordt ingeschreven in het
      kentekenregister.

      7 Voor een gebruikte personenauto, een gebruikt motorrijwiel of een gebruikte bestelauto geldt de catalogusprijs
      van het tijdstip waarop de personenauto, het motorrijwiel of de bestelauto voor het eerst in gebruik is
      genomen. Indien dit tijdstip niet bekend is, treedt daarvoor in de plaats de laatste dag van het jaar waarin de
      personenauto, het motorrijwiel of de bestelauto is vervaardigd.

      8 Voor een ander motorrijtuig dan een personenauto, een motorrijwiel of een bestelauto, dat in een zodanige staat
      wordt gebracht dat het een personenauto, een motorrijwiel of een bestelauto is, geldt de catalogusprijs als ware
      het een personenauto, een motorrijwiel of een bestelauto van het tijdstip waarop het motorrijtuig voor het eerst
      in gebruik is genomen. Indien dit tijdstip niet bekend is, treedt daarvoor in de plaats de laatste dag van het jaar
      waarin het motorrijtuig is vervaardigd.

      9 Indien het tijdstip, bedoeld in het zesde en zevende lid, is gelegen voor 1 januari 1993, dan wordt uit de
      prijs, bedoeld in het vierde lid, de bijzondere verbruiksbelasting van personenauto’s dan wel de bijzondere
      verbruiksbelasting van motorrijwielen afgezonderd.

      10 Wanneer een personenauto, een motorrijwiel of een bestelauto een bijzondere uitvoering heeft of is voorzien van
      extra toebehoren, wordt de waarde daarvan in de catalogusprijs begrepen, uitgezonderd de waarde van voorzieningen
      die niet zijn aangebracht door of namens de fabrikant of de importeur.

      11 Voor de toepassing van dit artikel is de CO-uitstoot van een personenauto of een bestelauto, de CO-uitstoot
      gemeten overeenkomstig bijlage XXI bij Verordening (EU) 2017/1151 van de Commissie van 1 juni 2017 tot aanvulling
      van Verordening (EG) nr. 715/2007 van het Europees Parlement en de Raad betreffende de typegoedkeuring van
      motorvoertuigen met betrekking tot emissies van lichte personen- en bedrijfsvoertuigen (Euro 5 en Euro 6) en
      de toegang tot reparatie- en onderhoudsinformatie, tot wijziging van [Richtlijn 2007/46/EG](32007L0046) van het
      Europees Parlement en de Raad, Verordening (EG) nr. 692/2008 van de Commissie en Verordening (EU) nr. 1230/2012
      van de Commissie en tot intrekking van Verordening (EG) nr. 692/2008 van de Commissie (PbEU 2017, L 175). Indien de
      meting mede met LPG, aardgas of biomethaan als brandstof is uitgevoerd, wordt de CO-uitstoot van de auto met LPG,
      aardgas, respectievelijk biomethaan als brandstofsoort gehanteerd.

      12 Indien de CO-uitstoot van een personenauto uitsluitend is gemeten overeenkomstig bijlage XII bij Verordening
      (EG) nr. 692/2008 van de Commissie van 18 juli 2008 tot uitvoering en wijziging van Verordening (EG) nr. 715/2007
      van het Europees Parlement en de Raad betreffende de typegoedkeuring van motorvoertuigen met betrekking
      tot emissies van lichte personen- en bedrijfsvoertuigen (Euro 5 en Euro 6) en de toegang tot reparatie- en
      onderhoudsinformatie (PbEU 2008, L 199) wordt het bedrag aan belasting bepaald op basis van de wettelijke
      bepalingen met betrekking tot de maatstaf van heffing en het tarief zoals die golden op 30 juni 2020.

      13 Indien voor de toepassing van dit artikel de CO-uitstoot van een personenauto niet op een bij ministeriële
      regeling voorgeschreven wijze is aangetoond, wordt deze gesteld op 550 gram per kilometer respectievelijk 395 gram
      per kilometer voor een personenauto die wordt aangedreven door een motor met compressieontsteking die zijn kracht
      kan ontlenen aan diesel.

      14 Indien voor de toepassing van dit artikel de CO-uitstoot van een bestelauto niet op een bij ministeriële
      regeling voorgeschreven wijze is aangetoond, wordt deze gesteld op 330 gram per kilometer.

      15 Voor de toepassing van dit artikel wordt onder bijzondere personenauto verstaan een personenauto die
      een voertuig voor speciale doeleinden is zoals omschreven in Bijlage I, deel A, punt 5, van [Verordening
      (EU) 2018/858](32018R0858) van het Europees Parlement en de Raad van 30 mei 2018 betreffende de
      goedkeuring van en het markttoezicht op motorvoertuigen en aanhangwagens daarvan en systemen, onderdelen
      en technische eenheden die voor dergelijke voertuigen zijn bestemd, tot wijziging van [Verordeningen (EG)
      nr. 715/2007](32007R0715) en [(EG) nr. 595/2009](32009R0595) en tot intrekking van [Richtlijn 2007/46/EG]
      (32007L0046) (PbEU 2018, L 151), waarbij voor de kampeerauto geldt dat deze voldoet aan de eisen gesteld in
      [artikel 23a van de Wet op de motorrijtuigenbelasting 1994][ref1] en de daarop berustende bepalingen.


