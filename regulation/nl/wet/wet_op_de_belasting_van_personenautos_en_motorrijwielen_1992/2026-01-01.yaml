  - number: 16a
    text: |-
      1 Indien de tarieven, bedoeld in [artikel 9][ref1], worden gewijzigd, is, ter zake van de inschrijving of
      herinschrijving van een nieuw motorrijtuig die plaatsvond voorafgaand aan die tariefswijziging, het nieuwe tarief
      van toepassing wanneer de eerste tenaamstelling van dat motorrijtuig twee maanden of later plaatsvindt na het
      tijdstip waarop die wijziging in werking treedt.

      2 Indien de tarieven, bedoeld in [artikel 9][ref2], worden gewijzigd, is, ter zake van de inschrijving of
      herinschrijving van een nieuw motorrijtuig die plaatsvond na die tariefswijziging, het oude tarief van toepassing
      wanneer:

      a. dat motorrijtuig voor die tariefswijziging in een kentekenregister van een andere lidstaat van de Europese Unie
      of een staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte was ingeschreven; en

      b. de eerste tenaamstelling van dat motorrijtuig in het kentekenregister binnen twee maanden plaatsvindt na het
      tijdstip waarop die tariefswijziging in werking treedt.

      3 Bij ministeriële regeling kunnen nadere regels worden gesteld ter uitvoering van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0005806#Artikel9
