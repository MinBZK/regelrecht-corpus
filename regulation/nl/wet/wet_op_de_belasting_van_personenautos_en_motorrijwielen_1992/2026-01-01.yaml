  - number: 16aa
    text: |-
      1 In afwijking van [artikel 15, vierde lid][ref1], en [artikel 15a, achtste en tiende lid][ref2], is het
      teruggegeven bedrag niet als belasting verschuldigd indien:

      a. de tenaamstelling van het motorrijtuig komt te vervallen omdat het motorrijtuig buiten Nederland wordt gebracht;

      b. de tenaamstelling van het motorrijtuig komt te vervallen omdat het motorrijtuig wordt gesloopt; of

      c. het motorrijtuig is gestolen en een melding van diefstal van het motorrijtuig is geplaatst in het
      kentekenregister.

      2 Het teruggegeven bedrag wordt, nadat dit is verminderd met overeenkomstige toepassing van
      [artikel 10, vijfde lid][ref3], alsnog als belasting verschuldigd:

      a. op het moment van de tenaamstelling van het motorrijtuig, indien na toepassing van het eerste lid, onderdeel a
      of b, het motorrijtuig opnieuw wordt tenaamgesteld;

      b. op het moment van de hernieuwde aanvang van het gebruik met het motorrijtuig van de weg, indien na toepassing
      van het eerste lid, onderdeel a of b, het motorrijtuig feitelijk ter beschikking staat van een in Nederland wonende
      natuurlijke persoon of gevestigd lichaam, zonder dat het motorrijtuig opnieuw te naam is gesteld;

      c. op het moment van de verwijdering van de melding van diefstal uit het kentekenregister, indien na toepassing
      van het eerste lid, onderdeel c, het motorrijtuig wordt teruggevonden, met dien verstande dat geen belasting
      verschuldigd is als het kenteken op dat moment nog op naam staat van degene aan wie de teruggaaf is verleend en
      deze het teruggevonden motorrijtuig aansluitend opnieuw in gebruik neemt binnen de voorwaarden van de teruggaaf.
      In het laatste geval blijven de feiten die zich hebben voorgedaan in de periode dat het motorrijtuig was gestolen
      buiten beschouwing voor de vraag, of aan de voorwaarden en beperkingen van de teruggaaf wordt voldaan.

      3 Bij de toepassing van het tweede lid zijn de [artikelen 5][ref4], [6][ref5],
      [10, derde, vierde, vijfde en negende lid][ref6], en [12b][ref7] van overeenkomstige toepassing, met dien
      verstande, dat bij de toepassing van het tweede lid, onderdeel c, de belasting wordt voldaan binnen een maand na de
      verwijdering van de melding van diefstal uit het kentekenregister.

      4 Bij ministeriële regeling kunnen nadere regels worden gesteld ter uitvoering van dit artikel.


