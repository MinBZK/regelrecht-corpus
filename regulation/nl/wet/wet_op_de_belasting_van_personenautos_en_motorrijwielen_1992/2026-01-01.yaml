  - number: '16'
    text: |-
      1 Teruggaaf van belasting wordt op aanvraag verleend voor motorrijtuigen waarmee geen gebruik is en wordt gemaakt
      van de weg.

      2 De teruggaaf wordt door de inspecteur bij voor bezwaar vatbare beschikking verleend.

      3 Bij of krachtens algemene maatregel van bestuur kunnen voorwaarden en beperkingen worden gesteld aan de teruggaaf
      en regels worden gesteld voor de uitvoering van dit artikel.
