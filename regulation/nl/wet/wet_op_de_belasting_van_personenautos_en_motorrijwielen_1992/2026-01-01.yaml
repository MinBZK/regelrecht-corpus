    text: |-
      1 Ter zake van de inschrijving, wijziging van de inschrijving of herinschrijving wordt de belasting geheven van
      degene die de inschrijving, wijziging van de inschrijving of herinschrijving aanvraagt.

      2 Ter zake van de aanvang van het gebruik met het motorrijtuig van de weg wordt de belasting geheven van degene op
      wiens naam het motorrijtuig is gesteld in het kentekenregister. Indien het motorrijtuig niet op naam is gesteld in
      het kentekenregister, wordt de belasting geheven van degene die het motorrijtuig feitelijk ter beschikking heeft.
    url: https://wetten.overheid.nl/BWBR0005806/2026-01-01#Artikel5
  - number: '6'
    text: |-
      1 De belasting moet op aangifte worden voldaan.

      2 In afwijking van [artikel 10, tweede lid][ref1], en
      [artikel 19, derde lid, van de Algemene wet inzake rijksbelastingen][ref2]:

      a. moet de belasting, indien deze verschuldigd is:

      1°. ter zake van de inschrijving van een personenauto, motorrijwiel of bestelauto, worden betaald voordat het
      motorrijtuig is ingeschreven;

      2°. ter zake van de aanvang van het gebruik van de weg, worden betaald vóór de aanvang van dat gebruik;

      b. wordt de aangifte gelijktijdig met de betaling gedaan.

      3 In afwijking van het tweede lid, onderdeel a, onder 2°, behoeft, ingeval de eenheid van de Belastingdienst waar
      aangifte moet worden gedaan ter zake van de aanvang van het gebruik van de weg, gesloten is op de dag waarop dan
      wel op de dag vóórdat het gebruik aanvangt, de belasting pas te worden betaald op de eerste dag waarop die eenheid
      na de aanvang van het gebruik is geopend.

      4 Indien in een geval als bedoeld in het derde lid, degene die de feitelijke beschikking heeft over een niet-
      ingeschreven personenauto, motorrijwiel of bestelauto bij controle door ambtenaren van de rijksbelastingdienst of
      door opsporingsambtenaren als bedoeld in [artikel 141 van het Wetboek van Strafvordering][ref3] niet aannemelijk
      maakt dat de belasting is betaald, dient de belasting terstond te worden betaald.

      5 Voor de toepassing van dit artikel wordt onder inschrijving mede verstaan de herinschrijving van het
      motorrijtuig.


