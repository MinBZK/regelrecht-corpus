  - number: 14b
    text: |-
      1 Voor een motorrijtuig dat is ingeschreven in een andere lidstaat van de Europese Unie of een staat die partij is
      bij de Overeenkomst betreffende de Europese Economische Ruimte, en dat voor een periode van ten hoogste vier jaren
      ter beschikking wordt gesteld aan een in Nederland wonende natuurlijke persoon of gevestigd lichaam door een in die
      andere staat wonende natuurlijke persoon of gevestigd lichaam, wordt, onder bij algemene maatregel van bestuur te
      stellen voorwaarden en beperkingen, op verzoek de ingevolge [artikel 1, zesde lid][ref1], te betalen belasting op
      voorhand verrekend met de teruggaaf die op de voet van [artikel 14a][ref2] kan worden verleend als het motorrijtuig
      na afloop van de overeengekomen periode van terbeschikkingstelling weer buiten Nederland wordt gebracht.

      2 Ingeval op een later tijdstip een andere periode van terbeschikkingstelling voor het motorrijtuig wordt
      overeengekomen dan de eerder overeengekomen huurperiode, wordt het te verrekenen bedrag van de teruggaaf,
      bedoeld in het eerste lid, overeenkomstig herzien, met dien verstande dat bij een verkorting van de periode van
      terbeschikkingstelling het teveel betaalde gedeelte van de verschuldigde belasting op verzoek wordt teruggegeven,
      en bij een verlenging van de periode van terbeschikkingstelling de teveel verrekende belasting op aangifte wordt
      voldaan binnen een maand na het tijdstip waarop de andere periode van terbeschikkingstelling is overeengekomen.

      3 Indien voor een motorrijtuig niet langer wordt voldaan aan de voorwaarden en beperkingen voor de verrekening,
      wordt het te verrekenen bedrag van de teruggaaf, bedoeld in het eerste lid, herzien, met dien verstande dat het
      volledige door de verrekening nog niet betaalde gedeelte van de verschuldigde belasting op aangifte wordt voldaan
      binnen een maand na het tijdstip waarop niet langer aan de voorwaarden en beperkingen voor de verrekening wordt
      voldaan. De eerste volzin is mede van toepassing ingeval door een verandering van de overeengekomen periode van
      terbeschikkingstelling als bedoeld in het tweede lid, de totale overeengekomen periode van terbeschikkingstelling
      meer bedraagt dan vier jaren.

      4 Indien de overeengekomen periode van terbeschikkingstelling wordt gewijzigd, dan wel niet langer wordt voldaan
      aan de voorwaarden en beperkingen voor de verrekening, wordt dit door degene aan wie het motorrijtuig ter
      beschikking is gesteld onverwijld schriftelijk ter kennis gebracht van de inspecteur.

      5 Het te verrekenen bedrag van de teruggaaf, bedoeld in het eerste lid, dan wel het terug te geven bedrag ingevolge
      het tweede lid, wordt door de inspecteur vastgesteld bij voor bezwaar vatbare beschikking.

      6 De verrekening van de teruggaaf, bedoeld in het eerste lid, dan wel een herziening van deze verrekening
      ingevolge het tweede of derde lid, wordt voor de toepassing van deze wet aangemerkt als een teruggaaf ingevolge
      [artikel 14a][ref3], respectievelijk als een herziening van deze teruggaaf.

      7 Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.


