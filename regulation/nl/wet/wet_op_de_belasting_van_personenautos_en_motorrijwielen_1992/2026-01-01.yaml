      belasting ingevolge [artikel 9][ref1] kan, in afwijking van [artikel 10, eerste lid][ref2], dat lagere bedrag aan
      belasting worden toegepast.

      2 Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.


