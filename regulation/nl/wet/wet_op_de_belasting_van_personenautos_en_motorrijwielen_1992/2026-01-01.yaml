  - number: '4'
    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt verstaan onder motorrijwiel een motorrijtuig op twee wielen,
      alsmede een dergelijk motorrijtuig dat is verbonden met een zijspanwagen. Onder motorrijwiel wordt niet verstaan:

      a. een bromfiets in de zin van [artikel 1, eerste lid, onderdeel e, van de Wegenverkeerswet 1994][ref1];

      b. een fiets met trapondersteuning als bedoeld in [artikel 1, eerste lid, onderdeel ea, van die wet][ref2]; of

      c. een motorrijtuig met beperkte snelheid dat of een mobiele machine die in het kentekenregister als zodanig is
      geregistreerd.

      2 Bij ministeriële regeling kunnen regels worden gesteld ingevolge welke met een motorrijwiel worden gelijkgesteld
      motorrijtuigen op meer dan twee wielen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel1
