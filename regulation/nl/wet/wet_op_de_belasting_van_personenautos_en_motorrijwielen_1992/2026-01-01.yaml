      1 In afwijking van [artikel 10, tweede lid][ref1], wordt de vermindering, bedoeld in artikel 10, eerste lid,
      vastgesteld overeenkomstig bij ministeriële regeling vast te stellen regels, indien voor het gebruikte motorrijtuig
      een teruggaaf als bedoeld in [artikel 14a, eerste of tweede lid][ref2], of [artikel 16][ref3] is of kan worden
      aangevraagd met het oogmerk dat voor het motorrijtuig een herinschrijving plaatsvindt dan wel het motorrijtuig
      feitelijk ter beschikking komt te staan van een in Nederland wonende natuurlijke persoon of gevestigd lichaam, als
      bedoeld in [artikel 1, achtste lid][ref4].

      2 Het oogmerk, bedoeld in het eerste lid, wordt geacht aanwezig te zijn geweest indien de belasting ingevolge
      [artikel 1, zevende of achtste lid][ref5], wordt verschuldigd binnen zes maanden na het tijdstip waarop de
      tenaamstelling is beëindigd dan wel het tijdstip waarop het motorrijtuig niet langer feitelijk ter beschikking
      staat, tenzij degene van wie de belasting wordt geheven aannemelijk maakt dat dit oogmerk op dat tijdstip ontbrak.


