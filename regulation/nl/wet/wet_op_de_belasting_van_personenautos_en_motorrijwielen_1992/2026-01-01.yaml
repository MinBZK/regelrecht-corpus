  - number: '18'
    text: |-
      Op eerste vordering van ambtenaren van de rijksbelastingdienst of van opsporingsambtenaren als bedoeld in
      [artikel 141 van het Wetboek van Strafvordering][ref1] is de bestuurder van een motorrijtuig verplicht dat te doen
      stilstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0005806/2026-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
  - number: '19'
    text: |-
      De in [artikel 18][ref1] bedoelde ambtenaren zijn bevoegd een motorrijtuig te onderwerpen aan een onderzoek en
      het daartoe te brengen of te doen brengen naar een nabij gelegen plaats. De bestuurder van het motorrijtuig en
      bij diens afwezigheid degene die het motorrijtuig houdt, is verplicht desgevorderd zijn voor het onderzoek en het
      vervoer noodzakelijke medewerking te verlenen en de ambtenaren met het motorrijtuig te vervoeren.


      [ref1]: https://wetten.overheid.nl/BWBR0005806#Artikel18
    url: https://wetten.overheid.nl/BWBR0005806/2026-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0005806
        artikel: '18'
        hoofdstuk: V
        afdeling: '2'
  - number: 19a
    text: |-
      1 Het bedrag dat strekt tot vergoeding van de kosten, bedoeld in
      [artikel 7:15, tweede lid, van de Algemene wet bestuursrecht][ref1], onder toepassing van de nadere regels
      gesteld krachtens het vierde lid van dat artikel, wordt, voor zover die kosten betrekking hebben op door een
      derde beroepsmatig verleende rechtsbijstand in het kader van het bezwaar tegen een besluit genomen op grond van
      het gestelde bij of krachtens deze wet of tegen een daarmee verband houdend besluit, vermenigvuldigd met 0,125.
      De eerste zin vindt geen toepassing in geval van bijzondere omstandigheden in de zin van de nadere regels gesteld
      krachtens artikel 7:15, vierde lid, van de Algemene wet bestuursrecht.

      2 In geval van een veroordeling in de kosten als bedoeld in
      [artikel 8:75, eerste lid, van de Algemene wet bestuursrecht][ref2], onder toepassing van de nadere regels
      gesteld krachtens de laatste zin van artikel 8:75, eerste lid, van die wet, of in geval van een veroordeling in de
      kosten waarbij artikel 8:75 van die wet van overeenkomstige toepassing is verklaard, wordt, voor zover die kosten
      betrekking hebben op door een derde beroepsmatig verleende rechtsbijstand in het kader van het beroep, hoger beroep
      of beroep in cassatie bij de bestuursrechter betreffende een besluit genomen op grond van het gestelde bij of
      krachtens deze wet of een daarmee verband houdend besluit, het bedrag dat strekt tot de vergoeding van die kosten
      vermenigvuldigd met:

      a. 0,25, indien het bestreden besluit wordt vernietigd of gewijzigd;

      b. 0,10 in alle overige gevallen.

      De eerste zin vindt geen toepassing in geval van bijzondere omstandigheden in de zin van de nadere regels gesteld
      krachtens [artikel 8:75, eerste lid, van de Algemene wet bestuursrecht][ref3].

      3 De bestuursrechter kent in het kader van het beroep, hoger beroep of beroep in cassatie betreffende een besluit
      genomen op grond van het gestelde bij of krachtens deze wet of een daarmee verband houdend besluit, uitsluitend op
      verzoek, bij overschrijding van de redelijke termijn een vergoeding van immateriële schade toe van € 50 per half
      jaar waarmee die termijn is overschreden, tenzij sprake is van bijzondere omstandigheden. Ingeval de procedure
      eveneens een boetebeschikking betreft, wordt daarnaast de boetebeschikking verminderd.

      4 Onverminderd de [artikelen 7:15, vijfde lid][ref4], en [8:75, tweede lid, van de Algemene wet bestuursrecht][ref5],
      al dan niet in samenhang met [artikel 8:108, eerste lid, van die wet][ref6] of de [artikelen 29][ref7]
      of [29f van de Algemene wet inzake rijksbelastingen][ref8], vinden uitbetalingen ingevolge een
      beslissing op bezwaar of uitspraak op beroep, hoger beroep of beroep in cassatie betreffende een besluit
      genomen op grond van het gestelde bij of krachtens deze wet of een daarmee verband houdend besluit,
      waaronder uitbetalingen van vergoedingen als bedoeld in de voorgaande leden, dwangsommen als bedoeld in
      [artikel 4:17, eerste lid, van de Algemene wet bestuursrecht][ref9] en vergoedingen van het betaalde griffierecht
      als bedoeld in [artikel 8:74 van die wet][ref10], uitsluitend plaats op een bankrekening die op naam staat van
      de belanghebbende.

      5 Vorderingen tot uitbetaling als bedoeld in het vierde lid zijn niet vatbaar voor vervreemding of verpanding.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel715
