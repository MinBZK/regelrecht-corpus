           Het bedrag van de belasting op grond van de tabel wordt in geval van een personenauto die mede wordt
      aangedreven door een motor met een compressieontsteking die zijn kracht kan ontlenen aan diesel vermeerderd met een
      bedrag van € 106,07 per gram/km CO-uitstoot boven de 71 gram/km CO-uitstoot.
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel9
  - number: '9.3'
    text: 'De belasting bedraagt:'
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel9
  - number: 9.3.a
    text: |-
      voor een bestelauto of een bijzondere personenauto als bedoeld in het veertiende lid 37,7 percent van de netto
      catalogusprijs, verminderd met € 1 283, dan wel, ingeval van een bestelauto of bijzondere personenauto die wordt
      aangedreven door een motor met een compressieontsteking die zijn kracht kan ontlenen aan diesel 37,7 percent van de
      netto catalogusprijs, vermeerderd met € 273;
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel9
  - number: 9.3.b
    text: 'voor een motorrijwiel:'
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel9
  - number: 9.3.b.1°
    text: 'met een netto catalogusprijs van niet meer dan € 2 133: 9,6 percent van de netto catalogusprijs;'
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel9
  - number: 9.3.b.2°
    text: 'met een netto catalogusprijs van meer dan € 2 133: 19,4 percent van de netto catalogusprijs, verminderd met € 210.'
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel9
  - number: '9.4'
    text: Onder de netto catalogusprijs wordt verstaan de catalogusprijs verminderd met de daarin begrepen omzetbelasting.
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel9
  - number: '9.5'
    text: |-
      Onder catalogusprijs wordt verstaan de in Nederland door de fabrikant of importeur publiekelijk kenbaar gemaakte
      prijs welke naar zijn inzicht bij verkoop aan de uiteindelijke afnemer valt te berekenen. In die geadviseerde
      verkoopprijs is de belasting van personenauto’s en motorrijwielen zelf niet begrepen. Is een zodanige prijs niet
      bekend, dan wordt hij door vergelijking bepaald.
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel9
  - number: '9.6'
    text: |-
      Voor een nieuwe personenauto, een nieuw motorrijwiel of een nieuwe bestelauto geldt de catalogusprijs bij
      aanvang van de dag waarop aan de personenauto, het motorrijwiel of de bestelauto wordt ingeschreven in het
      kentekenregister.
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel9
  - number: '9.7'
    text: |-
      Voor een gebruikte personenauto, een gebruikt motorrijwiel of een gebruikte bestelauto geldt de catalogusprijs van
      het tijdstip waarop de personenauto, het motorrijwiel of de bestelauto voor het eerst in gebruik is genomen. Indien
      dit tijdstip niet bekend is, treedt daarvoor in de plaats de laatste dag van het jaar waarin de personenauto, het
      motorrijwiel of de bestelauto is vervaardigd.
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel9
  - number: '9.8'
    text: |-
      Voor een ander motorrijtuig dan een personenauto, een motorrijwiel of een bestelauto, dat in een zodanige staat
      wordt gebracht dat het een personenauto, een motorrijwiel of een bestelauto is, geldt de catalogusprijs als ware
      het een personenauto, een motorrijwiel of een bestelauto van het tijdstip waarop het motorrijtuig voor het eerst
      in gebruik is genomen. Indien dit tijdstip niet bekend is, treedt daarvoor in de plaats de laatste dag van het jaar
      waarin het motorrijtuig is vervaardigd.
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel9
  - number: '9.9'
    text: |-
      Indien het tijdstip, bedoeld in het zesde en zevende lid, is gelegen voor 1 januari 1993, dan wordt uit de
      prijs, bedoeld in het vierde lid, de bijzondere verbruiksbelasting van personenauto’s dan wel de bijzondere
      verbruiksbelasting van motorrijwielen afgezonderd.
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel9
  - number: '9.10'
    text: |-
      Wanneer een personenauto, een motorrijwiel of een bestelauto een bijzondere uitvoering heeft of is voorzien van
      extra toebehoren, wordt de waarde daarvan in de catalogusprijs begrepen, uitgezonderd de waarde van voorzieningen
      die niet zijn aangebracht door of namens de fabrikant of de importeur.
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel9
  - number: '9.11'
    text: |-
      Voor de toepassing van dit artikel is de CO-uitstoot van een personenauto, de CO-uitstoot gemeten overeenkomstig
      bijlage XXI bij Verordening (EU) 2017/1151 van de Commissie van 1 juni 2017 tot aanvulling van Verordening
      (EG) nr. 715/2007 van het Europees Parlement en de Raad betreffende de typegoedkeuring van motorvoertuigen met
      betrekking tot emissies van lichte personen- en bedrijfsvoertuigen (Euro 5 en Euro 6) en de toegang tot reparatie-
      en onderhoudsinformatie, tot wijziging van [Richtlijn 2007/46/EG](32007L0046) van het Europees Parlement en
      de Raad, Verordening (EG) nr. 692/2008 van de Commissie en Verordening (EU) nr. 1230/2012 van de Commissie en
      tot intrekking van Verordening (EG) nr. 692/2008 van de Commissie (PbEU 2017, L 175). Indien de meting mede
      met LPG, aardgas of biomethaan als brandstof is uitgevoerd, wordt de CO-uitstoot van de auto met LPG, aardgas,
      respectievelijk biomethaan als brandstofsoort gehanteerd.
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel9
  - number: '9.12'
    text: |-
      Indien de CO-uitstoot uitsluitend is gemeten overeenkomstig bijlage XII bij Verordening (EG) nr. 692/2008 van de
      Commissie van 18 juli 2008 tot uitvoering en wijziging van Verordening (EG) nr. 715/2007 van het Europees Parlement
      en de Raad betreffende de typegoedkeuring van motorvoertuigen met betrekking tot emissies van lichte personen- en
      bedrijfsvoertuigen (Euro 5 en Euro 6) en de toegang tot reparatie- en onderhoudsinformatie (PbEU 2008, L 199) wordt
      het bedrag aan belasting bepaald op basis van de wettelijke bepalingen met betrekking tot de maatstaf van heffing
      en het tarief zoals die golden op 30 juni 2020.
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel9
  - number: '9.13'
    text: |-
      Indien voor de toepassing van dit artikel de CO-uitstoot van een personenauto niet op een bij ministeriële regeling
      voorgeschreven wijze is aangetoond, wordt deze gesteld op 550 gram per kilometer respectievelijk 395 gram per
      kilometer voor een personenauto die wordt aangedreven door een motor met compressieontsteking die zijn kracht kan
      ontlenen aan diesel.
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel9
  - number: '9.14'
    text: |-
      Voor de toepassing van dit artikel wordt onder bijzondere personenauto verstaan een personenauto
      die een voertuig voor speciale doeleinden is zoals omschreven in Bijlage I, onderdeel A, punt 5, van
      Verordening (EU) 2018/858, waarbij voor de kampeerauto geldt dat deze voldoet aan de eisen gesteld in
      [artikel 23a van de Wet op de motorrijtuigenbelasting 1994][ref1] en de daarop berustende bepalingen.


      [ref1]: https://wetten.overheid.nl/BWBR0006324#Artikel23a
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006324
        artikel: 23a
  - number: 9c
    text: |-
      In afwijking van [artikel 9, eerste tot en met het derde lid][ref1], bedraagt de belasting tot 1 januari 2025 nihil
      voor een motorrijtuig met een CO-uitstoot van 0 gram per kilometer.


      [ref1]: https://wetten.overheid.nl/BWBR0005806#Artikel9
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel9c
    references:
      - id: ref1
        bwb_id: BWBR0005806
        artikel: '9'
        hoofdstuk: III
        afdeling: '2'
  - number: '10.1'
    text: |-
      Met betrekking tot gebruikte personenauto's, gebruikte motorrijwielen of gebruikte bestelauto's wordt
      het bij de personenauto, het motorrijwiel of de bestelauto behorende bedrag aan belasting, bedoeld in
      [artikel 9, eerste tot en met derde lid en twaalfde lid][ref1], berekend met inachtneming van een vermindering.


      [ref1]: https://wetten.overheid.nl/BWBR0005806#Artikel9
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0005806
        artikel: '9'
        hoofdstuk: III
        afdeling: '2'
  - number: '10.2'
    text: |-
      De vermindering, bedoeld in het eerste lid, is de afschrijving, uitgedrukt in procenten van de som van de
      catalogusprijs, bedoeld in [artikel 9, vijfde lid][ref1], en de belasting van personenauto’s en motorrijwielen
      op het tijdstip waarop het motorrijtuig voor het eerst in gebruik is genomen. Ter zake van de inschrijving of
      herinschrijving is voor de hoogte van de vermindering en het tarief het tijdstip bepalend waarop het onderzoek
      door de Dienst Wegverkeer dat tot de inschrijving of herinschrijving leidt als geregeld bij en krachtens
      [artikel 47 Wegenverkeerswet 1994][ref2] is afgerond.


      [ref1]: https://wetten.overheid.nl/BWBR0005806#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel47
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0005806
        artikel: '9'
        hoofdstuk: III
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '47'
  - number: '10.3'
    text: |-
      Indien na het tijdstip waarop een bestelauto voor het eerst in gebruik is genomen, een tijdsduur is verstreken van
      5 jaar of meer, bedraagt in afwijking van het tweede lid het percentage van de vermindering 100.
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel10
  - number: '10.4'
    text: |-
      Indien na het tijdstip waarop de personenauto of het motorrijwiel voor het eerst in gebruik is genomen, een
      tijdsduur is verstreken van 25 jaar of meer, bedraagt in afwijking van het tweede lid het percentage van de
      vermindering 100.
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel10
  - number: '10.5'
    text: |-
      Indien het tijdstip waarop de personenauto, het motorrijwiel of de bestelauto voor het eerst in gebruik is genomen
      niet bekend is, treedt daarvoor in de plaats de laatste dag van het jaar waarin de personenauto, het motorrijwiel
      of de bestelauto is vervaardigd.
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel10
  - number: '10.6'
    text: |-
      In afwijking van het tweede lid wordt de vermindering, mits daartoe een verzoek bij de aangifte wordt gedaan,
      vastgesteld overeenkomstig bij ministeriële regeling vast te stellen regels.
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel10
  - number: '10.7'
    text: |-
      De afschrijving, bedoeld in het tweede lid, wordt, mits daartoe een verzoek bij de aangifte wordt gedaan, gesteld
      op de som van de catalogusprijs, bedoeld in [artikel 9, vijfde lid][ref1], en belasting van personenauto’s en
      motorrijwielen, op het tijdstip waarop het motorrijtuig voor het eerst in gebruik is genomen en zoals deze blijkt
      uit een in de handel algemeen toegepaste koerslijst voor de inkoop van gebruikte motorrijtuigen door wederverkopers
      in Nederland, verminderd met de handelsinkoopwaarde die voor dat motorrijtuig eveneens blijkt uit deze koerslijst.


      [ref1]: https://wetten.overheid.nl/BWBR0005806#Artikel9
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0005806
        artikel: '9'
        hoofdstuk: III
        afdeling: '2'
  - number: '10.8'
    text: |-
      De afschrijving, bedoeld in het tweede lid, wordt, mits daartoe een verzoek bij de aangifte wordt gedaan, gesteld
      op de som van de catalogusprijs, bedoeld in [artikel 9, vijfde lid][ref1], en de belasting van personenauto’s
      en motorrijwielen op het tijdstip waarop het motorrijtuig voor het eerst in gebruik is genomen, verminderd met
      de taxatiewaarde vermeld in een taxatierapport dat voldoet aan bij ministeriële regeling te stellen voorwaarden,
      indien het motorrijtuig op het tijdstip dat bepalend is voor de hoogte van de vermindering:


      [ref1]: https://wetten.overheid.nl/BWBR0005806#Artikel9
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0005806
        artikel: '9'
        hoofdstuk: III
        afdeling: '2'
  - number: 10.8.a
    text: |-
      meer dan normale gebruiksschade heeft of niet als zodanig voorkomt op een in de handel algemeen toegepaste
      koerslijst voor de inkoop van gebruikte motorrijtuigen door wederverkopers in Nederland; en
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel10
  - number: 10.8.b
    text: |-
      voldoet aan de bij of krachtens de [Wegenverkeerswet 1994](onbekend) vastgestelde eisen waardoor met dat
      motorrijtuig mag worden gereden op de weg.
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel10
  - number: '10.9'
    text: |-
      Bij de aangifte wordt een opgaaf gedaan van de gegevens die bij de aangifte zijn gebruikt voor het vaststellen
      van de afschrijving, bedoeld in het tweede lid, dan wel voor de toepassing van de regels, bedoeld in het zesde
      lid. Wanneer naar het oordeel van de inspecteur gegevens ontbreken die van belang kunnen zijn voor de vaststelling
      van de in het eerste lid bedoelde vermindering, worden de ontbrekende gegevens toegevoegd. Gegevens die niet bij
      de aangifte zijn gebruikt voor het vaststellen van de afschrijving, en evenmin op verzoek van de inspecteur zijn
      toegevoegd, kunnen door degene die gehouden is de belasting op aangifte te voldoen niet op een later tijdstip
      alsnog worden gebruikt om de bij de aangifte toegepaste afschrijving te wijzigen.
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel10
  - number: '10.10'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
      Daarbij kan de vermindering, bedoeld in het tweede lid, worden verhoogd voor motorrijtuigen als bedoeld in
      [artikel 15, eerste lid, onderdelen a, b, en g][ref1]. Voorts kan daarbij een termijn worden vastgesteld waarbinnen
      het motorrijtuig in ongewijzigde staat beschikbaar wordt gehouden voor controle met het oog op een juiste
      vaststelling van de afschrijving, bedoeld in het tweede lid. Voorts kunnen nadere voorwaarden worden gesteld over
      waar en op welk moment een aangifte met een verzoek als bedoeld het zesde, zevende of achtste lid wordt gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005806#Artikel15
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0005806
        artikel: '15'
        hoofdstuk: IV
        afdeling: '2'
  - number: 10a.1
    text: |-
      In afwijking van [artikel 10, tweede lid][ref1], wordt de vermindering, bedoeld in artikel 10, eerste lid,
      vastgesteld overeenkomstig bij ministeriële regeling vast te stellen regels, indien voor het gebruikte motorrijtuig
      een teruggaaf als bedoeld in [artikel 14a, eerste of tweede lid][ref2], of [artikel 16][ref3] is of kan worden
      aangevraagd met het oogmerk dat voor het motorrijtuig een herinschrijving plaatsvindt dan wel het motorrijtuig
      feitelijk ter beschikking komt te staan van een in Nederland wonende natuurlijke persoon of gevestigd lichaam, als
      bedoeld in [artikel 1, achtste lid][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0005806#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0005806#Artikel14a
      [ref3]: https://wetten.overheid.nl/BWBR0005806#Artikel16
      [ref4]: https://wetten.overheid.nl/BWBR0005806#Artikel1
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0005806
        artikel: '10'
        hoofdstuk: III
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005806
        artikel: 14a
        hoofdstuk: IV
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0005806
        artikel: '16'
        hoofdstuk: IV
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0005806
        artikel: '1'
        hoofdstuk: I
        afdeling: '1'
  - number: 10a.2
    text: |-
      Het oogmerk, bedoeld in het eerste lid, wordt geacht aanwezig te zijn geweest indien de belasting ingevolge
      [artikel 1, zevende of achtste lid][ref1], wordt verschuldigd binnen zes maanden na het tijdstip waarop de
      tenaamstelling is beëindigd dan wel het tijdstip waarop het motorrijtuig niet langer feitelijk ter beschikking
      staat, tenzij degene van wie de belasting wordt geheven aannemelijk maakt dat dit oogmerk op dat tijdstip ontbrak.


      [ref1]: https://wetten.overheid.nl/BWBR0005806#Artikel1
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0005806
        artikel: '1'
        hoofdstuk: I
        afdeling: '1'
  - number: 10b.1
    text: |-
      Indien het bedrag van de belasting op enig tijdstip na twee maanden vóór de eerste ingebruikneming van een gebruikt
      motorrijtuig, ingevolge de wettelijke bepalingen met betrekking tot de maatstaf van heffing, de wijze waarop die
      maatstaf wordt gemeten en het tarief zoals die op dat tijdstip golden, lager is dan het bedrag van de belasting
      ingevolge [artikel 9][ref1] kan, in afwijking van [artikel 10, eerste lid][ref2], dat lagere bedrag aan belasting
      worden toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0005806#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0005806#Artikel10
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel10b
    references:
      - id: ref1
        bwb_id: BWBR0005806
        artikel: '9'
        hoofdstuk: III
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005806
        artikel: '10'
        hoofdstuk: III
        afdeling: '2'
  - number: 10b.2
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel10b
  - number: 10c.1
    text: |-
      Ingeval voor een motorrijtuig waarvoor de belasting is verschuldigd de belasting al eerder is betaald, wordt, onder
      bij ministeriële regeling te stellen voorwaarden en beperkingen, de verschuldigde belasting verminderd met een
      bedrag ter zake van de eerder betaalde belasting.
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel10c
  - number: 10c.2
    text: |-
      De vermindering bedraagt ten hoogste het bedrag van de verschuldigde belasting. De vermindering wordt voor een
      gebruikt motorrijtuig berekend met overeenkomstige toepassing van [artikel 14a, vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005806#Artikel14a
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel10c
    references:
      - id: ref1
        bwb_id: BWBR0005806
        artikel: 14a
        hoofdstuk: IV
        afdeling: '2'
  - number: 10c.3
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel10c
  - number: 12a.1
    text: |-
      Ingeval van constatering van het gebruik van de weg met een personenauto, een motorrijwiel of
      een bestelauto waarvoor de belasting die is verschuldigd ter zake van een feit als bedoeld in
      [artikel 1, derde tot en met vijfde lid][ref1], niet is betaald, kan de belasting worden nageheven van degene op
      wiens naam het motorrijtuig is gesteld op het moment van constatering. De aanvang van het gebruik van de weg wordt
      gesteld op het tijdstip van de hiervoor bedoelde tenaamstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0005806#Artikel1
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0005806
        artikel: '1'
        hoofdstuk: I
        afdeling: '1'
  - number: 12a.2
    text: |-
      Indien degene op wiens naam het motorrijtuig is gesteld, aantoont op welk tijdstip na de tenaamstelling het
      motorrijtuig in een zodanige staat is gebracht dat het een personenauto, een motorrijwiel of een bestelauto is,
      onderscheidenlijk niet meer voldoet aan de in [artikel 9c][ref1] genoemde voorwaarden, wordt de aanvang van het
      gebruik van de weg gesteld op dat latere tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0005806#Artikel9c
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0005806
        artikel: 9c
        hoofdstuk: III
        afdeling: '2'
  - number: 12a.3
    text: |-
      Indien degene op wiens naam het motorrijtuig is gesteld, aantoont op welk tijdstip na de tenaamstelling
      de motor van een personenauto in een zodanige staat is gebracht dat de CO2-uitstoot meer bedraagt dan
      de CO2-uitstoot waarover belasting is betaald, wordt de aanvang van het gebruik van de weg bedoeld in
      [artikel 1, vijfde lid][ref1], gesteld op dat latere tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0005806#Artikel1
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0005806
        artikel: '1'
        hoofdstuk: I
        afdeling: '1'
  - number: 12a.4
    text: |-
      Indien degene bij wie de belasting wordt nageheven aantoont dat de personenauto, het motorrijwiel of de bestelauto
      op het tijdstip van tenaamstelling reeds in een zodanige staat verkeerde dat het een personenauto, een motorrijwiel
      of een bestelauto was, onderscheidenlijk niet meer voldeed aan de in [artikel 9c][ref1] genoemde voorwaarden, en
      hij niet wist of behoorde te weten dat de belasting niet is betaald, kan de belasting worden nageheven van degene
      op wiens naam het motorrijtuig daaraan voorafgaand was gesteld, waarbij de aanvang van het gebruik van de weg wordt
      gesteld op het tijdstip van de desbetreffende tenaamstelling. Het tweede lid is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005806#Artikel9c
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0005806
        artikel: 9c
        hoofdstuk: III
        afdeling: '2'
  - number: 12a.5
    text: |-
      Indien degene bij wie de belasting wordt nageheven aantoont dat de motor van een personenauto op het tijdstip van
      tenaamstelling reeds in een zodanige staat verkeerde dat de CO-uitstoot meer bedraagt dan de CO-uitstoot waarover
      belasting is betaald, en hij niet wist of behoorde te weten dat de meer verschuldigde belasting niet is betaald,
      kan de belasting worden nageheven van degene op wiens naam het motorrijtuig daaraan voorafgaand was gesteld,
      waarbij de aanvang van het gebruik van de weg bedoeld in [artikel 1, vijfde lid][ref1], wordt gesteld op het
      tijdstip van de desbetreffende tenaamstelling. Het vierde lid is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005806#Artikel1
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0005806
        artikel: '1'
        hoofdstuk: I
        afdeling: '1'
  - number: 12b
    text: |-
      Ingeval van constatering van het gebruik van de weg met een personenauto, een motorrijwiel of een bestelauto
      waarvoor de belasting die is verschuldigd ter zake van het in [artikel 1, vijfde, zesde of achtste lid][ref1]
      genoemde feit niet is betaald, kan de belasting worden nageheven van degene die het motorrijtuig
      feitelijk ter beschikking heeft. Het tijdstip van aanvang van het gebruik van de weg wordt
      daarbij gesteld op het tijdstip van constatering met dien verstande dat het tijdstip ter zake van
      het in artikel 1, zesde lid, genoemde feit wordt vastgesteld met overeenkomstige toepassing van
      [artikel 13, tweede lid, van de Wet op de motorrijtuigenbelasting 1994][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005806#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0006324#Artikel13
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel12b
    references:
      - id: ref1
        bwb_id: BWBR0005806
        artikel: '1'
        hoofdstuk: I
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0006324
        artikel: '13'
  - number: '13.1'
    text: |-
      Vrijstelling van belasting wordt in andere gevallen dan waarin vrijstelling van belasting wordt verleend krachtens
      [artikel 39 van de Algemene wet inzake rijksbelastingen][ref1], verleend voor personenauto's, motorrijwielen en
      bestelauto's waarvoor een kenteken als bedoeld in [artikel 37, derde lid][ref2], is of wordt opgegeven en die niet
      zijn ingeschreven, dan wel een kenteken als bedoeld in [artikel 38, eerste lid, van de Wegenverkeerswet 1994][ref3]
      is of wordt opgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel37
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel38
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '39'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '37'
      - id: ref3
        bwb_id: BWBR0006622
        artikel: '38'
  - number: '13.2'
    text: |-
      Vrijstelling van belasting wordt verleend voor personenauto's, motorrijwielen en bestelauto's die bij of krachtens
      [artikel 4, eerste lid, onderdeel a, van de Wegenverkeerswet 1994][ref1] niet behoeven te worden ingeschreven in
      het kentekenregister.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel4
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '4'
  - number: 13a.1
    text: |-
      Vrijstelling van belasting wordt verleend voor bestelauto’s die op naam worden gesteld van een ondernemer als
      bedoeld in [artikel 7 van de Wet op de omzetbelasting 1968][ref1], die de bestelauto meer dan bijkomstig gebruikt
      in het kader van zijn onderneming. De vrijstelling wordt niet verleend indien het ondernemerschap voor de
      omzetbelasting voortvloeit uit het bepaalde in [artikel 7, zesde lid, van de Wet op de omzetbelasting 1968][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel7
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0002629
        artikel: '7'
  - number: 13a.2
    text: |-
      Voor een bestelauto die door een ondernemer als bedoeld in het eerste lid voor een langere dan een bij ministeriële
      regeling vast te stellen periode ter beschikking wordt gesteld aan een andere persoon, wordt de vrijstelling
      slechts verleend indien deze andere persoon, behoudens de tenaamstelling, voldoet aan de voorwaarden en beperkingen
      voor de vrijstelling.
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel13a
  - number: 13a.3
    text: |-
      Indien tijdens de eerste vijf jaren na het tijdstip waarop de bestelauto is ingeschreven in het kentekenregister
      niet of niet langer wordt voldaan aan de voorwaarden en beperkingen voor de vrijstelling, is op dat
      moment de belasting verschuldigd als ware er sprake van een inschrijving van die bestelauto als bedoeld in
      [artikel 1, tweede lid][ref1]. In afwijking van [artikel 5, eerste lid][ref2], wordt de belasting geheven van de
      ondernemer, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005806#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005806#Artikel5
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0005806
        artikel: '1'
        hoofdstuk: I
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005806
        artikel: '5'
        hoofdstuk: II
  - number: 13a.4
    text: |-
      Indien bij wijziging van de tenaamstelling van de bestelauto overigens voldaan blijft worden aan de voorwaarden
      en beperkingen van de vrijstelling blijft, onder bij algemene maatregel van bestuur te stellen voorwaarden en
      beperkingen, het derde lid buiten toepassing. Alsdan treedt degene op wiens naam het motorrijtuig wordt gesteld,
      vanaf het moment van de wijziging van de tenaamstelling voor de toepassing van dit artikel in de plaats van degene
      op wiens naam het motorrijtuig daarvoor was gesteld.
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel13a
  - number: 13a.5
    text: |-
      Ingeval een bestelauto waarvoor vrijstelling is verleend op de voet van dit artikel in een zodanige staat wordt
      gebracht dat het een personenauto is, zijn, in afwijking van het derde lid, de [artikelen 1, derde lid][ref1], en
      [12a][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005806#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005806#Artikel12a
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0005806
        artikel: '1'
        hoofdstuk: I
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005806
        artikel: 12a
        hoofdstuk: III
        afdeling: '3'
  - number: 13a.6
    text: |-
      Indien één of meer personen worden vervoerd in de laadruimte van een bestelauto, vormt dit een verzuim ter zake
      waarvan de inspecteur aan degene die de bestelauto feitelijk ter beschikking heeft, een bestuurlijke boete van
      € 550 kan opleggen. De bevoegdheid tot het opleggen van de bestuurlijke boete vervalt door het verloop van een jaar
      na het constateren van het verzuim, bedoeld in de vorige volzin.
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel13a
  - number: 13a.7
    text: |-
      [Artikel 67cb van de Algemene wet inzake rijksbelastingen][ref1] is van overeenkomstige toepassing op het bedrag
      van de boete, genoemd in het zesde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel67cb
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 67cb
  - number: 13a.8
    text: |-
      Het tweede tot en met zesde lid zijn van overeenkomstige toepassing ten aanzien van bestelauto’s waarvoor teruggaaf
      van belasting is verleend ingevolge [artikel 15b][ref1], zoals dat artikel luidde van 1 juli 2005 tot de datum van
      inwerkingtreding van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0005806#Artikel15b
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0005806
        artikel: 15b
        hoofdstuk: IV
        afdeling: '2'
  - number: 13b.1
    text: |-
      In afwijking van [artikel 13a, derde lid][ref1], is het bedrag waarvan vrijstelling is verleend niet als belasting
      verschuldigd indien:


      [ref1]: https://wetten.overheid.nl/BWBR0005806#Artikel13a
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel13b
    references:
      - id: ref1
        bwb_id: BWBR0005806
        artikel: 13a
        hoofdstuk: IV
        afdeling: '1'
  - number: 13b.1.a
    text: |-
      de tenaamstelling van het motorrijtuig in het kentekenregister komt te vervallen omdat de bestelauto buiten
      Nederland wordt gebracht;
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel13b
  - number: 13b.1.b
    text: |-
      de tenaamstelling van het motorrijtuig in het kentekenregister komt te vervallen omdat de bestelauto wordt
      gesloopt; of
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel13b
  - number: 13b.1.c
    text: de bestelauto is gestolen en een melding van diefstal van de bestelauto is geplaatst in het kentekenregister.
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel13b
  - number: 13b.2
    text: |-
      Het bedrag waarvan vrijstelling is verleend wordt, nadat dit is verminderd met overeenkomstige toepassing van
      [artikel 10, zesde lid][ref1], alsnog als belasting verschuldigd:


      [ref1]: https://wetten.overheid.nl/BWBR0005806#Artikel10
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel13b
    references:
      - id: ref1
        bwb_id: BWBR0005806
        artikel: '10'
        hoofdstuk: III
        afdeling: '2'
  - number: 13b.2.a
    text: |-
      op het moment van de tenaamstelling van de bestelauto, indien na toepassing van het eerste lid, onderdeel a of b,
      de bestelauto opnieuw te naam wordt gesteld;
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel13b
  - number: 13b.2.b
    text: |-
      op het moment van de hernieuwde aanvang van het gebruik met de bestelauto van de weg, indien na toepassing van
      het eerste lid, onderdeel a of b, de bestelauto feitelijk ter beschikking staat van een in Nederland wonende
      natuurlijke persoon of gevestigd lichaam, zonder dat de bestelauto opnieuw te naam is gesteld;
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel13b
  - number: 13b.2.c
    text: |-
      op het moment van de verwijdering van de melding van diefstal uit het kentekenregister, indien na toepassing van
      het eerste lid, onderdeel c, de bestelauto wordt teruggevonden, met dien verstande dat geen belasting verschuldigd
      is als de bestelauto op dat moment nog op naam staat van degene aan wie de vrijstelling is verleend en deze de
      teruggevonden bestelauto aansluitend opnieuw in gebruik neemt binnen de voorwaarden van de vrijstelling. In het
      laatste geval blijven de feiten die zich hebben voorgedaan in de periode dat de bestelauto was gestolen buiten
      beschouwing voor de vraag, of aan de voorwaarden en beperkingen van de vrijstelling wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel13b
  - number: 13b.3
    text: |-
      Bij de toepassing van het tweede lid zijn de [artikelen 5][ref1], [6][ref2],
      [10, derde, vierde, vijfde en negende lid][ref3], en [12b][ref4] van overeenkomstige toepassing, met dien
      verstande, dat bij de toepassing van het tweede lid, onderdeel c, de belasting wordt voldaan binnen een maand na de
      verwijdering van de melding van diefstal uit het kentekenregister.


      [ref1]: https://wetten.overheid.nl/BWBR0005806#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005806#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0005806#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0005806#Artikel12b
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel13b
    references:
      - id: ref1
        bwb_id: BWBR0005806
        artikel: '5'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0005806
        artikel: '6'
        hoofdstuk: III
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0005806
        artikel: '10'
        hoofdstuk: III
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0005806
        artikel: 12b
        hoofdstuk: III
        afdeling: '3'
  - number: 13b.4
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ter uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel13b
  - number: '14.1'
    text: |-
      Bij algemene maatregel van bestuur kan, onder daarbij te stellen voorwaarden en beperkingen, vrijstelling van
      belasting worden verleend voor uit een ander land afkomstige personenauto's, motorrijwielen en bestelauto's die
      voor specifieke doeleinden, dan wel onder specifieke omstandigheden naar Nederland zijn gebracht.
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel14
  - number: '14.2'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van de in het eerste
      lid bedoelde algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel14
  - number: '14.3'
    text: |-
      [Paragraaf 4.1.3.3 van de Algemene wet bestuursrecht][ref1] is van toepassing op verzoeken aan de inspecteur tot
      vrijstelling voor specifieke doeleinden op grond van bepalingen krachtens het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: 14a.1
    text: |-
      Teruggaaf van belasting wordt, onder bij algemene maatregel van bestuur te stellen voorwaarden en beperkingen, op
      aanvraag verleend voor personenauto’s, motorrijwielen en bestelauto’s indien de tenaamstelling van het motorrijtuig
      in het kentekenregister komt te vervallen omdat het motorrijtuig buiten Nederland wordt gebracht, het motorrijtuig
      overeenkomstig Richtlijn 1999/37/EG van de Raad van 29 april 1999 inzake de kentekenbewijzen van motorvoertuigen
      (PbEG 1999, L 138) wordt ingeschreven in een andere lidstaat van de Europese Unie of een staat die partij is bij
      de Overeenkomst betreffende de Europese Economische Ruimte en als bewijs van die inschrijving door de bevoegde
      autoriteit een kentekenbewijs wordt afgegeven, met uitzondering van een kentekenbewijs dat is afgegeven op basis
      van een tijdelijke inschrijving van het motorrijtuig als bedoeld in artikel 1 van die richtlijn. De teruggaaf
      wordt verleend aan degene op wiens naam het motorrijtuig was gesteld direct voorafgaand aan het vervallen van de
      tenaamstelling in het kentekenregister.
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel14a
  - number: 14a.2
    text: |-
      Teruggaaf van belasting wordt, onder bij algemene maatregel van bestuur te stellen voorwaarden en beperkingen, op
      aanvraag verleend voor in een andere lidstaat van de Europese Unie of een staat die partij is bij de Overeenkomst
      betreffende de Europese Economische Ruimte ingeschreven personenauto’s, motorrijwielen en bestelauto’s waarvoor de
      belasting is geheven ter zake van de aanvang van het gebruik met dat motorrijtuig van de weg door een in Nederland
      wonende natuurlijke persoon of gevestigd lichaam, indien het motorrijtuig niet langer feitelijk ter beschikking
      staat van de in Nederland wonende natuurlijke persoon of het in Nederland gevestigde lichaam en het motorrijtuig
      weer buiten Nederland is gebracht. De teruggaaf wordt verleend aan degene van wie de belasting ingevolge
      [artikel 5, tweede lid][ref1], is geheven.


      [ref1]: https://wetten.overheid.nl/BWBR0005806#Artikel5
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0005806
        artikel: '5'
        hoofdstuk: II
  - number: 14a.3
    text: |-
      De teruggaaf, bedoeld in het eerste en tweede lid, wordt uitsluitend verleend indien de belasting is betaald ter
      zake van de inschrijving of herinschrijving van het motorrijtuig, of indien de inschrijving heeft plaatsgevonden
      voor 1 januari 2022, ter zake van de registratie van het motorrijtuig of de tenaamstelling van het motorrijtuig of,
      indien de registratie heeft plaatsgevonden voor 1 januari 2014, het kenteken, dan wel de aanvang van het gebruik
      met het motorrijtuig van de weg, op of na 16 oktober 2006.
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel14a
  - number: 14a.4
    text: |-
      De teruggaaf bedraagt het belastingbedrag, nadat dit is verminderd overeenkomstig bij ministeriële regeling vast te
      stellen regels. Ingeval voor het motorrijtuig al eerder teruggaaf van de belasting is verleend, wordt de teruggaaf
      slechts verleend voorzover de eerder teruggegeven belasting op een later tijdstip alsnog als verschuldigde
      belasting is voldaan.
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel14a
  - number: 14a.5
    text: Bedragen van minder dan € 50 worden niet teruggegeven.
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel14a
  - number: 14a.6
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel14a
  - number: 14b.1
    text: |-
      Voor een motorrijtuig dat is ingeschreven in een andere lidstaat van de Europese Unie of een staat die partij is
      bij de Overeenkomst betreffende de Europese Economische Ruimte, en dat voor een periode van ten hoogste vier jaren
      ter beschikking wordt gesteld aan een in Nederland wonende natuurlijke persoon of gevestigd lichaam door een in die
      andere staat wonende natuurlijke persoon of gevestigd lichaam, wordt, onder bij algemene maatregel van bestuur te
      stellen voorwaarden en beperkingen, op verzoek de ingevolge [artikel 1, zesde lid][ref1], te betalen belasting op
      voorhand verrekend met de teruggaaf die op de voet van [artikel 14a][ref2] kan worden verleend als het motorrijtuig
      na afloop van de overeengekomen periode van terbeschikkingstelling weer buiten Nederland wordt gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0005806#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005806#Artikel14a
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel14b
    references:
      - id: ref1
        bwb_id: BWBR0005806
        artikel: '1'
        hoofdstuk: I
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005806
        artikel: 14a
        hoofdstuk: IV
        afdeling: '2'
  - number: 14b.2
    text: |-
      Ingeval op een later tijdstip een andere periode van terbeschikkingstelling voor het motorrijtuig wordt
      overeengekomen dan de eerder overeengekomen huurperiode, wordt het te verrekenen bedrag van de teruggaaf,
      bedoeld in het eerste lid, overeenkomstig herzien, met dien verstande dat bij een verkorting van de periode van
      terbeschikkingstelling het teveel betaalde gedeelte van de verschuldigde belasting op verzoek wordt teruggegeven,
      en bij een verlenging van de periode van terbeschikkingstelling de teveel verrekende belasting op aangifte wordt
      voldaan binnen een maand na het tijdstip waarop de andere periode van terbeschikkingstelling is overeengekomen.
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel14b
  - number: 14b.3
    text: |-
      Indien voor een motorrijtuig niet langer wordt voldaan aan de voorwaarden en beperkingen voor de verrekening,
      wordt het te verrekenen bedrag van de teruggaaf, bedoeld in het eerste lid, herzien, met dien verstande dat het
      volledige door de verrekening nog niet betaalde gedeelte van de verschuldigde belasting op aangifte wordt voldaan
      binnen een maand na het tijdstip waarop niet langer aan de voorwaarden en beperkingen voor de verrekening wordt
      voldaan. De eerste volzin is mede van toepassing ingeval door een verandering van de overeengekomen periode van
      terbeschikkingstelling als bedoeld in het tweede lid, de totale overeengekomen periode van terbeschikkingstelling
      meer bedraagt dan vier jaren.
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel14b
  - number: 14b.4
    text: |-
      Indien de overeengekomen periode van terbeschikkingstelling wordt gewijzigd, dan wel niet langer wordt voldaan aan
      de voorwaarden en beperkingen voor de verrekening, wordt dit door degene aan wie het motorrijtuig ter beschikking
      is gesteld onverwijld schriftelijk ter kennis gebracht van de inspecteur.
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel14b
  - number: 14b.5
    text: |-
      Het te verrekenen bedrag van de teruggaaf, bedoeld in het eerste lid, dan wel het terug te geven bedrag ingevolge
      het tweede lid, wordt door de inspecteur vastgesteld bij voor bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel14b
  - number: 14b.6
    text: |-
      De verrekening van de teruggaaf, bedoeld in het eerste lid, dan wel een herziening van deze verrekening
      ingevolge het tweede of derde lid, wordt voor de toepassing van deze wet aangemerkt als een teruggaaf ingevolge
      [artikel 14a][ref1], respectievelijk als een herziening van deze teruggaaf.


      [ref1]: https://wetten.overheid.nl/BWBR0005806#Artikel14a
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel14b
    references:
      - id: ref1
        bwb_id: BWBR0005806
        artikel: 14a
        hoofdstuk: IV
        afdeling: '2'
  - number: 14b.7
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel14b
  - number: '15.1'
    text: |-
      Teruggaaf van belasting wordt, onder bij algemene maatregel van bestuur te stellen voorwaarden en beperkingen, op
      aanvraag verleend voor personenauto's, motorrijwielen en bestelauto's die:
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel15
  - number: 15.1.a
    text: zijn ingericht om te worden gebruikt door de politie en als zodanig uiterlijk kenbaar zijn;
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel15
  - number: 15.1.b
    text: zijn ingericht om te worden gebruikt door de brandweer en als zodanig uiterlijk kenbaar zijn;
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel15
  - number: 15.1.c
    text: |-
      kennelijk zijn ingericht om te worden gebruikt door een invalide en zijn uitgerust met een elektromotor dan wel met
      een verbrandingsmotor met een cylinderinhoud van ten hoogste 250 cm³;
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel15
  - number: 15.1.d
    text: zijn ingericht voor het vervoer van zieken en gewonden en als zodanig uiterlijk kenbaar zijn;
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel15
  - number: 15.1.e
    text: zijn ingericht voor het vervoer van stoffelijke overschotten en als zodanig uiterlijk kenbaar zijn;
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel15
  - number: 15.1.f
    text: zijn ingericht voor het vervoer van gevangenen en als zodanig uiterlijk kenbaar zijn;
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel15
  - number: 15.1.g
    text: zijn ingericht en uitsluitend worden gebruikt voor het vervoer van rolstoelgebruikers in groepsverband;
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel15
  - number: 15.1.h
    text: zijn ingericht voor het vervoer van zieke of gewonde dieren en als zodanig uiterlijk kenbaar zijn;
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel15
  - number: 15.1.i
    text: zijn ingericht voor geldtransport en als zodanig uiterlijk kenbaar zijn.
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel15
  - number: '15.2'
    text: De teruggaaf wordt verleend aan degene op wiens naam het motorrijtuig is gesteld.
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel15
  - number: '15.3'
    text: De inspecteur beslist op de aanvraag bij voor bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel15
  - number: '15.4'
    text: |-
      In geval voor een personenauto, een motorrijwiel of, gedurende de eerste vijf jaren na inschrijving in het
      kentekenregister, een bestelauto, niet langer wordt voldaan aan de voorwaarden en beperkingen voor teruggaaf,
      wordt vanaf dat moment het teruggegeven bedrag, nadat dit is verminderd met overeenkomstige toepassing van
      [artikel 10, zesde lid][ref1], als belasting verschuldigd. Artikel 10, derde, vierde, vijfde, negende en tiende
      lid, is van overeenkomstige toepassing. De verschuldigd geworden belasting wordt door degene aan wie de teruggaaf
      is verleend, op aangifte voldaan binnen een maand na het moment dat niet langer aan de voorwaarden en beperkingen
      wordt voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005806#Artikel10
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005806
        artikel: '10'
        hoofdstuk: III
        afdeling: '2'
  - number: '15.5'
    text: |-
      Bij wijziging van de tenaamstelling van een personenauto, motorrijwiel of bestelauto blijven, op daartoe
      gedaan gezamenlijk verzoek van degene op wiens naam het motorrijtuig wordt gesteld en degene op wiens naam het
      motorrijtuig daarvoor was gesteld, het eerste en vierde lid buiten toepassing indien overigens voldaan blijft
      worden aan de voorwaarden en beperkingen waaronder de teruggaaf is verleend. Bij inwilliging van het verzoek treedt
      degene op wiens naam het motorrijtuig wordt gesteld vanaf het moment van de wijziging van de tenaamstelling voor
      de toepassing van dit artikel in de plaats van degene op wiens naam het motorrijtuig daarvoor was gesteld. De
      inspecteur beslist op het verzoek bij voor bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel15
  - number: 15a.1
    text: |-
      Teruggaaf van belasting wordt, onder bij algemene maatregel van bestuur te stellen voorwaarden en beperkingen, op
      aanvraag verleend voor bestelauto's die zijn ingericht om te worden gebruikt voor het vervoer van een gehandicapte
      persoon in de cabine en voor het gelijktijdige vervoer van een niet-opvouwbare rolstoel ten behoeve van die
      persoon.
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel15a
  - number: 15a.2
    text: |-
      In afwijking van het eerste lid wordt de teruggaaf voorts verleend, indien de laadruimte van de bestelauto in
      afwijking van [artikel 3, derde lid][ref1], ten gevolge van aanpassing van de bestelauto in verband met de handicap
      van de in het eerste lid bedoelde persoon, niet langer van de bestuurdersplaats onderscheidenlijk de cabine is
      afgescheiden of niet in haar geheel is voorzien van een vlakke laadvloer.


      [ref1]: https://wetten.overheid.nl/BWBR0005806#Artikel3
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0005806
        artikel: '3'
        hoofdstuk: I
        afdeling: '2'
  - number: 15a.3
    text: |-
      Indien de gehandicapte een ander is dan degene op wiens naam de bestelauto is gesteld, is het eerste lid slechts
      van toepassing indien de aanvraag als bedoeld in het eerste lid wordt gedaan door die ander en de gehandicapte
      gezamenlijk.
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel15a
  - number: 15a.4
    text: De teruggaaf wordt verleend aan degene op wiens naam de bestelauto is gesteld.
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel15a
  - number: 15a.5
    text: De inspecteur beslist op de aanvraag bij voor bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel15a
  - number: 15a.6
    text: |-
      De aanspraak op teruggaaf ontstaat op het tijdstip waarop aan de voorwaarden en beperkingen voor teruggaaf als
      bedoeld in het eerste lid wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel15a
  - number: 15a.7
    text: |-
      Indien het in het zesde lid bedoelde tijdstip is gelegen na het tijdstip waarop de bestelauto is ingeschreven
      in het kentekenregister, bedraagt de teruggaaf het belastingbedrag nadat dit is verminderd overeenkomstig bij
      ministeriële regeling vast te stellen regels, met dien verstande dat ingeval voor de bestelauto al eerder teruggaaf
      is verleend, de teruggaaf niet meer bedraagt dan dit belastingbedrag verminderd met de eerdere teruggaven, voor
      zover de eerder teruggegeven bedragen niet later alsnog als verschuldigde belasting zijn voldaan.
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel15a
  - number: 15a.8
    text: |-
      Ingeval voor een bestelauto waarvoor teruggaaf is verleend, gedurende de eerste vijf jaren na de eerste
      tenaamstelling in het kentekenregister, niet langer wordt voldaan aan de voorwaarden en beperkingen voor de
      teruggaaf, is vanaf dat moment het teruggegeven bedrag, nadat dit is verminderd met overeenkomstige toepassing
      van [artikel 10, zesde lid][ref1], als belasting verschuldigd. Belasting is eveneens verschuldigd, met
      overeenkomstige toepassing van artikel 10, eerste en zesde lid, ingeval een bestelauto waarvoor teruggaaf is
      verleend in een zodanige staat wordt gebracht, anders dan door een aanpassing als bedoeld in het tweede lid, dat
      het een personenauto is. De verschuldigd geworden belasting wordt door degene aan wie de teruggaaf is verleend, op
      aangifte voldaan binnen een maand nadat niet meer aan de in de eerste volzin bedoelde voorwaarden en beperkingen
      wordt voldaan, onderscheidenlijk vóór aanvang van het gebruik van de weg met de in de tweede volzin bedoelde
      personenauto. De artikelen 10, derde, vierde, vijfde en negende lid, en [12a][ref2] zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005806#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0005806#Artikel12a
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0005806
        artikel: '10'
        hoofdstuk: III
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005806
        artikel: 12a
        hoofdstuk: III
        afdeling: '3'
  - number: 15a.9
    text: |-
      Bij wijziging van de tenaamstelling van een bestelauto blijven, op daartoe gedaan gezamenlijk verzoek van degene
      op wiens naam de bestelauto wordt gesteld en degene op wiens naam de bestelauto daarvoor was gesteld, het eerste
      en achtste lid buiten toepassing indien overigens voldaan blijft worden aan de voorwaarden en beperkingen waaronder
      de teruggaaf is verleend. Bij inwilliging van het verzoek treedt degene op wiens naam de bestelauto wordt gesteld
      vanaf het moment van de wijziging van de tenaamstelling voor de toepassing van dit artikel in de plaats van degene
      op wiens naam de bestelauto daarvoor was gesteld. De inspecteur beslist op het verzoek bij voor bezwaar vatbare
      beschikking.
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel15a
  - number: 15a.10
    text: |-
      In geval niet meer wordt voldaan aan de voorwaarden en beperkingen voor de teruggaaf doordat de gehandicapte is
      overleden, wordt in afwijking van het achtste lid, het teruggegeven bedrag niet als belasting verschuldigd zolang
      de tenaamstelling van de bestelauto niet wordt gewijzigd en de bestelauto uitsluitend wordt gebruikt voor het
      persoonlijk gebruik van degene op wiens naam de bestelauto is gesteld, gebruik door inwonende gezinsleden daaronder
      begrepen. Indien de teruggaaf is verleend aan de gehandicapte en de bestelauto na diens overlijden op naam wordt
      gesteld van een inwonend gezinslid van het gezin waartoe de gehandicapte behoorde, is de vorige volzin op daartoe
      gedaan verzoek van degene op wiens naam de bestelauto wordt gesteld van overeenkomstige toepassing. De inspecteur
      beslist op het verzoek bij voor bezwaar vatbare beschikking. Bij inwilliging van het verzoek treedt vanaf de datum
      van de beschikking degene op wiens naam de bestelauto is gesteld voor de toepassing van dit artikel in de plaats
      van degene aan wie de teruggaaf is verleend. Ingeval gedurende de eerste vijf jaren na de eerste tenaamstelling
      in het kentekenregister, niet langer wordt voldaan aan de in dit lid gestelde voorwaarden en beperkingen, wordt
      het teruggegeven bedrag alsnog als belasting verschuldigd. Het achtste en negende lid zijn van overeenkomstige
      toepassing.
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel15a
  - number: 15a.11
    text: |-
      Indien een of meer personen worden vervoerd in de laadruimte van een bestelauto, vormt dit een verzuim ter zake
      waarvan de inspecteur aan degene die het motorrijtuig feitelijk ter beschikking heeft een bestuurlijke boete van
      ten hoogste € 550 kan opleggen. De bevoegdheid tot het opleggen van de bestuurlijke boete vervalt door verloop van
      een jaar na het constateren van het in de vorige volzin bedoelde verzuim.
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel15a
  - number: 15a.12
    text: |-
      [Artikel 67cb van de Algemene wet inzake rijksbelastingen][ref1] is van overeenkomstige toepassing op het bedrag
      van de boete, genoemd in het elfde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel67cb
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 67cb
  - number: 15a.13
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ter uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel15a
  - number: 15b.1
    text: |-
      Wanneer degene die gehouden is voor een bestelauto de belasting op aangifte te voldoen voor die bestelauto in
      aanmerking komt voor een teruggaaf van belasting op grond van [artikel 15][ref1] of [15a][ref2], wordt de teruggaaf
      niet verleend dan nadat de belasting op aangifte is voldaan, met dien verstande dat de belasting die op aangifte
      moet worden voldaan, kan worden verrekend met het bedrag van de teruggaaf indien daar in de aangifte om wordt
      verzocht.


      [ref1]: https://wetten.overheid.nl/BWBR0005806#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0005806#Artikel15a
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel15b
    references:
      - id: ref1
        bwb_id: BWBR0005806
        artikel: '15'
        hoofdstuk: IV
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005806
        artikel: 15a
        hoofdstuk: IV
        afdeling: '2'
  - number: 15b.2
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ter uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel15b
  - number: '16.1'
    text: |-
      Teruggaaf van belasting wordt op aanvraag verleend voor motorrijtuigen waarmee geen gebruik is en wordt gemaakt van
      de weg.
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel16
  - number: '16.2'
    text: De teruggaaf wordt door de inspecteur bij voor bezwaar vatbare beschikking verleend.
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel16
  - number: '16.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voorwaarden en beperkingen worden gesteld aan de teruggaaf
      en regels worden gesteld voor de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel16
  - number: 16aa.1
    text: |-
      In afwijking van [artikel 15, vierde lid][ref1], en [artikel 15a, achtste en tiende lid][ref2], is het teruggegeven
      bedrag niet als belasting verschuldigd indien:


      [ref1]: https://wetten.overheid.nl/BWBR0005806#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0005806#Artikel15a
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel16aa
    references:
      - id: ref1
        bwb_id: BWBR0005806
        artikel: '15'
        hoofdstuk: IV
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005806
        artikel: 15a
        hoofdstuk: IV
        afdeling: '2'
  - number: 16aa.1.a
    text: de tenaamstelling van het motorrijtuig komt te vervallen omdat het motorrijtuig buiten Nederland wordt gebracht;
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel16aa
  - number: 16aa.1.b
    text: de tenaamstelling van het motorrijtuig komt te vervallen omdat het motorrijtuig wordt gesloopt; of
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel16aa
  - number: 16aa.1.c
    text: het motorrijtuig is gestolen en een melding van diefstal van het motorrijtuig is geplaatst in het kentekenregister.
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel16aa
  - number: 16aa.2
    text: |-
      Het teruggegeven bedrag wordt, nadat dit is verminderd met overeenkomstige toepassing van
      [artikel 10, zesde lid][ref1], alsnog als belasting verschuldigd:


      [ref1]: https://wetten.overheid.nl/BWBR0005806#Artikel10
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel16aa
    references:
      - id: ref1
        bwb_id: BWBR0005806
        artikel: '10'
        hoofdstuk: III
        afdeling: '2'
  - number: 16aa.2.a
    text: |-
      op het moment van de tenaamstelling van het motorrijtuig, indien na toepassing van het eerste lid, onderdeel a of
      b, het motorrijtuig opnieuw wordt tenaamgesteld;
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel16aa
  - number: 16aa.2.b
    text: |-
      op het moment van de hernieuwde aanvang van het gebruik met het motorrijtuig van de weg, indien na toepassing van
      het eerste lid, onderdeel a of b, het motorrijtuig feitelijk ter beschikking staat van een in Nederland wonende
      natuurlijke persoon of gevestigd lichaam, zonder dat het motorrijtuig opnieuw te naam is gesteld;
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel16aa
  - number: 16aa.2.c
    text: |-
      op het moment van de verwijdering van de melding van diefstal uit het kentekenregister, indien na toepassing
      van het eerste lid, onderdeel c, het motorrijtuig wordt teruggevonden, met dien verstande dat geen belasting
      verschuldigd is als het kenteken op dat moment nog op naam staat van degene aan wie de teruggaaf is verleend en
      deze het teruggevonden motorrijtuig aansluitend opnieuw in gebruik neemt binnen de voorwaarden van de teruggaaf.
      In het laatste geval blijven de feiten die zich hebben voorgedaan in de periode dat het motorrijtuig was gestolen
      buiten beschouwing voor de vraag, of aan de voorwaarden en beperkingen van de teruggaaf wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel16aa
  - number: 16aa.3
    text: |-
      Bij de toepassing van het tweede lid zijn de [artikelen 5][ref1], [6][ref2],
      [10, derde, vierde, vijfde en negende lid][ref3], en [12b][ref4] van overeenkomstige toepassing, met dien
      verstande, dat bij de toepassing van het tweede lid, onderdeel c, de belasting wordt voldaan binnen een maand na de
      verwijdering van de melding van diefstal uit het kentekenregister.


      [ref1]: https://wetten.overheid.nl/BWBR0005806#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005806#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0005806#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0005806#Artikel12b
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel16aa
    references:
      - id: ref1
        bwb_id: BWBR0005806
        artikel: '5'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0005806
        artikel: '6'
        hoofdstuk: III
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0005806
        artikel: '10'
        hoofdstuk: III
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0005806
        artikel: 12b
        hoofdstuk: III
        afdeling: '3'
  - number: 16aa.4
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ter uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel16aa
  - number: 16a.1
    text: |-
      Indien de tarieven, bedoeld in [artikel 9][ref1], worden gewijzigd, is, ter zake van de inschrijving of
      herinschrijving van een nieuw motorrijtuig die plaatsvond voorafgaand aan die tariefswijziging, het nieuwe tarief
      van toepassing wanneer de eerste tenaamstelling van dat motorrijtuig twee maanden of later plaatsvindt na het
      tijdstip waarop die wijziging in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0005806#Artikel9
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel16a
    references:
      - id: ref1
        bwb_id: BWBR0005806
        artikel: '9'
        hoofdstuk: III
        afdeling: '2'
  - number: 16a.2
    text: |-
      Indien de tarieven, bedoeld in [artikel 9][ref1], worden gewijzigd, is, ter zake van de inschrijving of
      herinschrijving van een nieuw motorrijtuig die plaatsvond na die tariefswijziging, het oude tarief van toepassing
      wanneer:


      [ref1]: https://wetten.overheid.nl/BWBR0005806#Artikel9
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel16a
    references:
      - id: ref1
        bwb_id: BWBR0005806
        artikel: '9'
        hoofdstuk: III
        afdeling: '2'
  - number: 16a.2.a
    text: |-
      dat motorrijtuig voor die tariefswijziging in een kentekenregister van een andere lidstaat van de Europese Unie of
      een staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte was ingeschreven; en
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel16a
  - number: 16a.2.b
    text: |-
      de eerste tenaamstelling van dat motorrijtuig in het kentekenregister binnen twee maanden plaatsvindt na het
      tijdstip waarop die tariefswijziging in werking treedt.
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel16a
  - number: 16a.3
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ter uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel16a
  - number: 16b.1
    text: |-
      De [artikelen 10.1][ref1] en [10.2 van de Wet inkomstenbelasting 2001][ref2] zijn van overeenkomstige toepassing
      op het eerste bedrag, genoemd in [artikel 9, eerste en tweede lid, in de derde kolom van de tabel][ref3], op de
      bedragen, genoemd in artikel 9, eerste en tweede lid, in de vierde kolom van de tabel en op het bedrag, genoemd in
      artikel 9, eerste lid, laatste volzin, en tweede lid, laatste volzin.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0005806#Artikel9
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel16b
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '10'
      - id: ref3
        bwb_id: BWBR0005806
        artikel: '9'
        hoofdstuk: III
        afdeling: '2'
  - number: 16b.2
    text: |-
      Bij ministeriële regeling worden, na toepassing van het eerste lid, de in [artikel 9, eerste en tweede lid][ref1],
      in de derde kolom van de tabellen vermelde bedragen dienovereenkomstig aangepast.


      [ref1]: https://wetten.overheid.nl/BWBR0005806#Artikel9
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel16b
    references:
      - id: ref1
        bwb_id: BWBR0005806
        artikel: '9'
        hoofdstuk: III
        afdeling: '2'
  - number: '17.1'
    text: |-
      Degene, aan wie op de voet van [artikel 8][ref1] is toegestaan de belasting per tijdvak te voldoen, stelt zekerheid
      voor de belasting die hij verschuldigd is of kan worden.


      [ref1]: https://wetten.overheid.nl/BWBR0005806#Artikel8
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0005806
        artikel: '8'
        hoofdstuk: III
        afdeling: '1'
  - number: '17.2'
    text: Het bedrag van de zekerheid wordt door de inspecteur vastgesteld bij voor bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel17
  - number: '17.3'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld voor de bepaling van de hoogte van het bedrag van
      de zekerheid.
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel17
  - number: '17.4'
    text: De zekerheid wordt gesteld bij de ontvanger.
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel17
  - number: '17.5'
    text: De ontvanger beslist of de vorm van zekerheid die wordt aangeboden, wordt aanvaard.
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel17
  - number: '17.6'
    text: De aan het stellen van zekerheid verbonden kosten komen ten laste van degene aan wie de vergunning is verleend.
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel17
  - number: '17.7'
    text: |-
      Ingeval de zekerheid wordt gesteld in geld wordt daarover een rente vergoed die gelijk is aan de
      herfinancieringsrente, te weten de minimale biedrente die de Europese Centrale Bank hanteert voor
      basisherfinancieringstransacties.
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel17
  - number: '17.8'
    text: |-
      Voor de toepassing van het zevende lid wordt het over een kalendermaand te vergoeden rentebedrag berekend naar de
      rente die geldt bij de aanvang van die maand.
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel17
  - number: '18'
    text: |-
      Op eerste vordering van ambtenaren van de rijksbelastingdienst of van opsporingsambtenaren als bedoeld in
      [artikel 141 van het Wetboek van Strafvordering][ref1] is de bestuurder van een motorrijtuig verplicht dat te doen
      stilstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
  - number: '19'
    text: |-
      De in [artikel 18][ref1] bedoelde ambtenaren zijn bevoegd een motorrijtuig te onderwerpen aan een onderzoek en
      het daartoe te brengen of te doen brengen naar een nabij gelegen plaats. De bestuurder van het motorrijtuig en
      bij diens afwezigheid degene die het motorrijtuig houdt, is verplicht desgevorderd zijn voor het onderzoek en het
      vervoer noodzakelijke medewerking te verlenen en de ambtenaren met het motorrijtuig te vervoeren.


      [ref1]: https://wetten.overheid.nl/BWBR0005806#Artikel18
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0005806
        artikel: '18'
        hoofdstuk: V
        afdeling: '2'
  - number: 19a.1
    text: |-
      Het bedrag dat strekt tot vergoeding van de kosten, bedoeld in
      [artikel 7:15, tweede lid, van de Algemene wet bestuursrecht][ref1], onder toepassing van de nadere regels
      gesteld krachtens het vierde lid van dat artikel, wordt, voor zover die kosten betrekking hebben op door een
      derde beroepsmatig verleende rechtsbijstand in het kader van het bezwaar tegen een besluit genomen op grond van
      het gestelde bij of krachtens deze wet of tegen een daarmee verband houdend besluit, vermenigvuldigd met 0,25.
      De eerste zin vindt geen toepassing in geval van bijzondere omstandigheden in de zin van de nadere regels gesteld
      krachtens artikel 7:15, vierde lid, van de Algemene wet bestuursrecht.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel19a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: 19a.2
    text: |-
      In geval van een veroordeling in de kosten als bedoeld in
      [artikel 8:75, eerste lid, van de Algemene wet bestuursrecht][ref1], onder toepassing van de nadere regels
      gesteld krachtens de laatste zin van artikel 8:75, eerste lid, van die wet, of in geval van een veroordeling in de
      kosten waarbij artikel 8:75 van die wet van overeenkomstige toepassing is verklaard, wordt, voor zover die kosten
      betrekking hebben op door een derde beroepsmatig verleende rechtsbijstand in het kader van het beroep, hoger beroep
      of beroep in cassatie bij de bestuursrechter betreffende een besluit genomen op grond van het gestelde bij of
      krachtens deze wet of een daarmee verband houdend besluit, het bedrag dat strekt tot de vergoeding van die kosten
      vermenigvuldigd met:


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel19a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 19a.2.a
    text: 0,25, indien het bestreden besluit wordt vernietigd of gewijzigd;
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel19a
  - number: 19a.2.b
    text: 0,10 in alle overige gevallen.
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel19a
  - number: 19a.3
    text: |-
      De bestuursrechter kent in het kader van het beroep, hoger beroep of beroep in cassatie betreffende een besluit
      genomen op grond van het gestelde bij of krachtens deze wet of een daarmee verband houdend besluit, uitsluitend op
      verzoek, bij overschrijding van de redelijke termijn een vergoeding van immateriële schade toe van € 50 per half
      jaar waarmee die termijn is overschreden, tenzij sprake is van bijzondere omstandigheden. Ingeval de procedure
      eveneens een boetebeschikking betreft, wordt daarnaast de boetebeschikking verminderd.
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel19a
  - number: 19a.4
    text: |-
      Onverminderd de [artikelen 7:15, vijfde lid][ref1], en [8:75, tweede lid, van de Algemene wet bestuursrecht][ref2],
      al dan niet in samenhang met [artikel 8:108, eerste lid, van die wet][ref3] of de [artikelen 29][ref4]
      of [29f van de Algemene wet inzake rijksbelastingen][ref5], vinden uitbetalingen ingevolge een
      beslissing op bezwaar of uitspraak op beroep, hoger beroep of beroep in cassatie betreffende een besluit
      genomen op grond van het gestelde bij of krachtens deze wet of een daarmee verband houdend besluit,
      waaronder uitbetalingen van vergoedingen als bedoeld in de voorgaande leden, dwangsommen als bedoeld in
      [artikel 4:17, eerste lid, van de Algemene wet bestuursrecht][ref6] en vergoedingen van het betaalde griffierecht
      als bedoeld in [artikel 8:74 van die wet][ref7], uitsluitend plaats op een bankrekening die op naam staat van de
      belanghebbende.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0002320#Artikel29
      [ref5]: https://wetten.overheid.nl/BWBR0002320#Artikel29f
      [ref6]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref7]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel19a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref4
        bwb_id: BWBR0002320
        artikel: '29'
      - id: ref5
        bwb_id: BWBR0002320
        artikel: 29f
      - id: ref6
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref7
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 19a.5
    text: Vorderingen tot uitbetaling als bedoeld in het vierde lid zijn niet vatbaar voor vervreemding of verpanding.
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel19a
  - number: '20.1'
    text: |-
      Bij algemene maatregel van bestuur kunnen ter verzekering van een juiste toepassing van de wet nadere regels worden
      gesteld ter aanvulling van de in deze wet geregelde onderwerpen.
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel20
  - number: '20.2'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van de in het eerste
      lid bedoelde algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel20
  - number: '21'
    text: |-
      De [artikelen 16][ref1] en [16aa][ref2], zoals die artikelen luidden op 31 december 2019, en de daarop berustende
      bepalingen blijven tot en met 31 december 2022 van toepassing op situaties waarbij aanspraken op teruggaaf van
      belasting uiterlijk op 31 december 2019 zijn ontstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005806#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0005806#Artikel16aa
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0005806
        artikel: '16'
        hoofdstuk: IV
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005806
        artikel: 16aa
        hoofdstuk: IV
        afdeling: '2'
  - number: '32.1'
    text: |-
      Ondernemers die op 31 december 1992 in het bezit zijn van een aanwijzing op grond van
      [artikel 23 van de Wet op de omzetbelasting 1968][ref1], juncto [artikel 18][ref2] (*Stcrt.* 1968, 169), dan wel
      zijn toegelaten tot de Algemene regeling versnelde afgifte kentekenbewijzen delen I, worden geacht op 1 januari
      1993 in het bezit te zijn van een vergunning als bedoeld in artikel 8 van de Wet op de belasting van personenauto’s
      en motorrijwielen 1992.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0002634#Artikel18a
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '23'
      - id: ref2
        bwb_id: BWBR0002634
        artikel: 18a
  - number: '32.2'
    text: |-
      De in het eerste lid bedoelde vergunningen zijn geldig tot aan het moment dat de inspecteur deze bij beschikking
      definitief vaststelt, wijzigt of intrekt, doch uiterlijk tot en met 31 december 1993.
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel32
  - number: '34'
    text: |-
      Bij ministeriële regeling kunnen nadere, zo nodig van de bepalingen van deze wet afwijkende regels worden
      gesteld die tot 1 juli 1993 de overgang van de krachtens de [Wet op de omzetbelasting 1968][ref1] geheven
      bijzondere verbruiksbelastingen van personenauto’s en motorrijwielen naar de krachtens deze wet geheven belasting
      vergemakkelijken.


      [ref1]: https://wetten.overheid.nl/BWBR0002629
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0002629
  - number: '35'
    text: |-
      Waar in deze wet de Wet op de belasting van personenauto’s en motorrijwielen 1992 is aangehaald met vermelding
      van het *Staatsblad* waarin die wet is geplaatst, wordt bij plaatsing van deze wet in het *Staatsblad* na '*Stb.*'
      ingevoegd het nummer van het *Staatsblad* waarin de Wet op de belasting van personenauto’s en motorrijwielen 1992
      is geplaatst.
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel35
  - number: '36'
    text: Deze wet treedt in werking met ingang van 1 januari 1993.
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel36
  - number: '37'
    text: Deze wet kan worden aangehaald als Wet op de belasting van personenauto’s en motorrijwielen 1992.
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel37
