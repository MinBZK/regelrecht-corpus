---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_op_de_belasting_van_personenautos_en_motorrijwielen_1992
regulatory_layer: WET
publication_date: '2024-12-24'
valid_from: '2024-01-01'
bwb_id: BWBR0005806
url: https://wetten.overheid.nl/BWBR0005806/2024-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het met het oog op de opheffing van de fiscale grenzen binnen de
    Europese Gemeenschap wenselijk is het stelsel van heffing van de bijzondere verbruiksbelastingen van personenauto’s
    en van motorrijwielen te herzien, alsmede om deze belastingen op te nemen in een afzonderlijke wet en voorts dat
    het gewenst is in het tarief te differentiëren naar een milieu- en een energiegrondslag en het begrip personenauto
    nader te definiëren;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      Onder de naam 'belasting van personenauto’s en motorrijwielen' wordt een belasting geheven met betrekking tot
      personenauto's, motorrijwielen en bestelauto's.
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel1
  - number: '1.2'
    text: De belasting is verschuldigd ter zake van de inschrijving van een personenauto, een motorrijwiel of een bestelauto.
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel1
  - number: '1.3'
    text: |-
      Ingeval een ingeschreven motorrijtuig zodanig wordt veranderd dat het de hoedanigheid verkrijgt van een
      personenauto, een motorrijwiel of een bestelauto, is de belasting verschuldigd ter zake van de wijziging van de
      inschrijving in personenauto, motorrijwiel of bestelauto dan wel, indien de inschrijving niet wordt gewijzigd in
      personenauto, motorrijwiel of bestelauto, ter zake van de aanvang van het gebruik als personenauto, motorrijwiel of
      bestelauto van de weg.
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel1
  - number: '1.4'
    text: |-
      Ingeval een motorrijtuig als bedoeld in [artikel 9c][ref1] in een zodanige staat wordt gebracht dat deze niet meer
      voldoet aan de in dat artikel genoemde voorwaarden, is de belasting verschuldigd ter zake van de aanvang van het
      gebruik met dit motorrijtuig in gewijzigde staat van de weg.


      [ref1]: https://wetten.overheid.nl/BWBR0005806#Artikel9c
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005806
        artikel: 9c
        hoofdstuk: III
        afdeling: '2'
  - number: '1.5'
    text: |-
      Ingeval de motor van een personenauto waarvan de belasting is bepaald op grond van de tabel in
      [artikel 9, eerste of tweede lid][ref1], tijdens de eerste drie jaren na het tijdstip van inschrijving in het
      kentekenregister in een zodanige staat is gebracht dat de CO-uitstoot meer bedraagt dan de CO-uitstoot waarover
      de belasting is betaald, is het verschil tussen deze belasting en de belasting die zou zijn verschuldigd bij deze
      hogere CO-uitstoot verschuldigd ter zake van de aanvang van het gebruik met deze personenauto in gewijzigde staat
      van de weg.


      [ref1]: https://wetten.overheid.nl/BWBR0005806#Artikel9
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005806
        artikel: '9'
        hoofdstuk: III
        afdeling: '2'
  - number: '1.6'
    text: |-
      Ingeval een niet-ingeschreven personenauto, motorrijwiel of bestelauto feitelijk ter beschikking staat van een in
      Nederland wonende natuurlijke persoon of gevestigd lichaam, is de belasting verschuldigd ter zake van de aanvang
      van het gebruik met dat motorrijtuig van de weg.
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel1
  - number: '1.7'
    text: |-
      Ingeval voor een motorrijtuig waarvoor een teruggaaf als bedoeld in [artikel 14a, eerste lid][ref1], of
      [artikel 16][ref2] is of kan worden verleend een herinschrijving plaatsvindt, is de belasting verschuldigd ter
      zake van die herinschrijving.


      [ref1]: https://wetten.overheid.nl/BWBR0005806#Artikel14a
      [ref2]: https://wetten.overheid.nl/BWBR0005806#Artikel16
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005806
        artikel: 14a
        hoofdstuk: IV
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005806
        artikel: '16'
        hoofdstuk: IV
        afdeling: '2'
  - number: '1.8'
    text: |-
      Ingeval een motorrijtuig waarvoor een teruggaaf als bedoeld in [artikel 14a, eerste of tweede lid][ref1],
      of [artikel 16][ref2] is of kan worden verleend feitelijk ter beschikking staat van een in Nederland wonende
      natuurlijke persoon of gevestigd lichaam, zonder dat een herinschrijving van dat motorrijtuig heeft plaatsgevonden,
      is de belasting verschuldigd ter zake van de hernieuwde aanvang van het gebruik met dat motorrijtuig van de weg.


      [ref1]: https://wetten.overheid.nl/BWBR0005806#Artikel14a
      [ref2]: https://wetten.overheid.nl/BWBR0005806#Artikel16
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005806
        artikel: 14a
        hoofdstuk: IV
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005806
        artikel: '16'
        hoofdstuk: IV
        afdeling: '2'
  - number: '2'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder: - *kentekenregister:* het register, genoemd in
      [artikel 1, eerste lid, onderdeel i, van de Wegenverkeerswet 1994][ref1];
        - *inschrijving:* inschrijving van een motorrijtuig in het kentekenregister als bedoeld in
      [artikel 47 van de Wegenverkeerswet 1994][ref2];
        - *herinschrijving:* beëindiging van de status in het kentekenregister dat een motorrijtuig voorgoed buiten
      Nederland is gebracht, dan wel dat in plaats daarvan voor dat motorrijtuig een hernieuwde inschrijving in het
      kentekenregister plaatsvindt;
        - *normale gebruiksschade:* slijtage en kleine beschadigingen die ontstaan door gebruik van een voertuig en die
      passen bij de leeftijd en kilometrage van het voertuig;
        - *weg:* weg als bedoeld in [artikel 1, eerste lid, onderdeel b, van de Wegenverkeerswet 1994][ref3] in
      Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel47
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel1
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '47'
      - id: ref3
        bwb_id: BWBR0006622
        artikel: '1'
  - number: '3.1'
    text: |-
      Onder personenauto wordt in deze wet en de daarop berustende bepalingen verstaan een motorrijtuig op drie of meer
      wielen, zulks met uitzondering van:
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel3
  - number: 3.1.a
    text: autobussen;
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel3
  - number: 3.1.b
    text: bestelauto's;
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel3
  - number: 3.1.c
    text: |-
      motorrijtuigen, niet ingericht voor het vervoer van personen, met een toegestane maximum massa van meer dan 3500
      kg;
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel3
  - number: 3.1.d
    text: |-
      bromfietsen in de zin van [artikel 1, eerste lid, onderdeel e, van de Wegenverkeerswet 1994][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel1
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '1'
  - number: 3.1.e
    text: |-
      landbouw- of bosbouwtrekkers, motorrijtuigen met beperkte snelheid of mobiele machines, die in het kentekenregister
      als zodanig zijn geregistreerd.
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel3
  - number: '3.2'
    text: |-
      Onder autobus wordt verstaan een motorrijtuig, ingericht voor het vervoer van meer dan acht personen, de bestuurder
      daaronder niet begrepen.
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel3
  - number: '3.3'
    text: |-
      Onder bestelauto wordt verstaan een motorrijtuig met een toegestane maximum massa van ten hoogste 3 500 kg,
      voorzien van een laadruimte die niet is ingericht voor het vervoer van personen, die in haar geheel is voorzien van
      een vlakke laadvloer en die:
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel3
  - number: 3.3.a
    text: |-
      een lengte heeft van ten minste 200 cm en over ten minste 200 cm van de lengte en over ten minste 20 cm van de
      breedte een hoogte heeft van ten minste 130 cm; dan wel
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel3
  - number: 3.3.b
    text: 'ingeval de laadruimte minder dan 25 cm hoger is dan de cabine:'
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel3
  - number: 3.3.b.1°
    text: |-
      een lengte heeft van ten minste 125 cm en over ten minste 125 cm van de lengte en over ten minste 20 cm van de
      breedte een hoogte heeft van ten minste 98 cm; en
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel3
  - number: 3.3.b.2°
    text: |-
      van de bestuurderszitplaats is afgescheiden door een vaste wand over ten minste de gehele breedte van de cabine,
      welke wand direct achter de zitplaats is aangebracht en ten minste dezelfde hoogte heeft als de bestuurderscabine;
      en
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel3
  - number: 3.3.b.3°
    text: |-
      niet is voorzien van zijruiten dan wel is voorzien van niet meer dan één aan de rechterzijde van de laadruimte
      aangebrachte zijruit; dan wel
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel3
  - number: 3.3.c
    text: 'ingeval de laadruimte ten minste 25 cm hoger is dan de cabine:'
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel3
  - number: 3.3.c.1°
    text: |-
      een lengte heeft van ten minste 125 cm en over ten minste 125 cm van de lengte en over ten minste 20 cm van de
      breedte een hoogte heeft van ten minste 98 cm; en
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel3
  - number: 3.3.c.2°
    text: |-
      van de bestuurderszitplaats is afgescheiden door een vaste wand over ten minste de gehele breedte van de cabine,
      welke wand direct achter de bestuurderszitplaats is aangebracht en een hoogte heeft van ten minste 30 cm; en
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel3
  - number: 3.3.c.3°
    text: |-
      niet is voorzien van zijruiten dan wel is voorzien van niet meer dan één aan de rechterzijde van de laadruimte
      aangebrachte zijruit; dan wel
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel3
  - number: 3.3.d
    text: |-
      ingeval het motorrijtuig een dubbele cabine heeft met zitruimte achter de bestuurder voor één rij naast elkaar in
      de rijrichting zittende personen:
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel3
  - number: 3.3.d.1°
    text: |-
      over ten minste 150 cm van de lengte en over ten minste 20 cm van de breedte een hoogte heeft van ten minste 130
      cm; en
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel3
  - number: 3.3.d.2°
    text: 'voor ten minste 40 percent van de lengte voor het hart van de achterste as is geplaatst en een lengte heeft van:'
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel3
  - number: 3.3.d.2°.I
    text: ten minste 150 cm; en
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel3
  - number: 3.3.d.2°.II
    text: |-
      ten minste twee derde van de lengte die de laadruimte zou hebben indien de zitruimte achter de bestuurder zou
      ontbreken; en
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel3
  - number: 3.3.d.2°.III
    text: ten minste twee maal die van de cabine, tenzij de cabine een hoogte heeft van ten minste 130 cm; en
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel3
  - number: 3.3.d.3°
    text: |-
      van de cabine is afgescheiden door een vaste wand over ten minste de gehele breedte van de cabine, welke wand
      direct achter de zitruimte is aangebracht en ten minste dezelfde hoogte heeft als de cabine; en
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel3
  - number: 3.3.d.4°
    text: |-
      niet is voorzien van zijruiten dan wel is voorzien van niet meer dan één aan de rechterzijde van de laadruimte
      aangebrachte zijruit.
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel3
  - number: '3.4'
    text: |-
      Onder toegestane maximum massa wordt verstaan de massa van het motorrijtuig in bedrijfsvaardige staat met inbegrip
      van de bedrijfsstoffen, reservedelen en gereedschappen die behoren tot de normale uitrusting, vermeerderd met de
      voor het motorrijtuig toegestane maximum massa aan lading.
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel3
  - number: '3.5'
    text: |-
      Voor de toepassing van het eerste lid, onderdeel c, wordt een motorrijtuig geacht niet te zijn ingericht voor het
      vervoer van personen indien de lengte van de ruimte tussen de vaste wand achter de achterste zitplaatsen of, indien
      geen vaste wand aanwezig is, tussen het achterste punt van de in de laatste stand geplaatste achterste zitplaatsen
      en het einde van de laadvloer groter is dan of gelijk is aan de lengte van de ruimte tussen het achterste punt
      van het stuurwiel en de vaste wand achter de achterste zitplaatsen, of, indien geen vaste wand aanwezig is, het
      achterste punt van de in de laatste stand geplaatste achterste zitplaatsen. De lengte wordt gemeten evenwijdig
      aan de lengteas van het betreffende motorrijtuig. Vaste bevestigingspunten die uitsluitend zijn bedoeld voor de
      bevestiging van zitplaatsen worden gelijkgesteld aan zitplaatsen, met dien verstande dat voor de bepaling van de
      lengtes het achterste punt van de in de laatste stand geplaatste achterste zitplaatsen vervangen wordt door dit
      vaste bevestigingspunt.
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel3
  - number: '3.6'
    text: 'Bij ministeriële regeling worden regels gesteld met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel3
  - number: 3.6.a
    text: |-
      de wijze waarop de hoogte en de lengte van de laadruimte en van de cabine worden vastgesteld alsmede op welke wijze
      het verschil in hoogte tussen de cabine en de laadruimte wordt vastgesteld;
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel3
  - number: 3.6.b
    text: de constructie-technische afwerking van de laadruimte;
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel3
  - number: 3.6.c
    text: de hoogte, de plaats, de constructiewijze en de bevestigingswijze van de vaste wand.
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel3
  - number: '4.1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder motorrijwiel een motorrijtuig op twee wielen,
      alsmede een dergelijk motorrijtuig dat is verbonden met een zijspanwagen. Onder motorrijwiel wordt niet verstaan:
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel4
  - number: 4.1.a
    text: |-
      een bromfiets in de zin van [artikel 1, eerste lid, onderdeel e, van de Wegenverkeerswet 1994][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel1
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '1'
  - number: 4.1.b
    text: |-
      een fiets met trapondersteuning als bedoeld in [artikel 1, eerste lid, onderdeel ea, van die wet][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel1
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '1'
  - number: 4.1.c
    text: |-
      een motorrijtuig met beperkte snelheid dat of een mobiele machine die in het kentekenregister als zodanig is
      geregistreerd.
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel4
  - number: '4.2'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld ingevolge welke met een motorrijwiel worden gelijkgesteld
      motorrijtuigen op meer dan twee wielen.
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel4
  - number: '5.1'
    text: |-
      Ter zake van de inschrijving, wijziging van de inschrijving of herinschrijving wordt de belasting geheven van
      degene die de inschrijving, wijziging van de inschrijving of herinschrijving aanvraagt. Voor een bestelauto wordt
      de belasting geheven van degene op wiens naam het motorrijtuig wordt of is gesteld in het kentekenregister.
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel5
  - number: '5.2'
    text: |-
      Ter zake van de aanvang van het gebruik met het motorrijtuig van de weg wordt de belasting geheven van degene op
      wiens naam het motorrijtuig is gesteld in het kentekenregister. Indien het motorrijtuig niet op naam is gesteld in
      het kentekenregister, wordt de belasting geheven van degene die het motorrijtuig feitelijk ter beschikking heeft.
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel5
  - number: '6.1'
    text: De belasting moet op aangifte worden voldaan.
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel6
  - number: '6.2'
    text: |-
      In afwijking van [artikel 10, tweede lid][ref1], en
      [artikel 19, derde lid, van de Algemene wet inzake rijksbelastingen][ref2]:


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel19
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0002320
        artikel: '19'
  - number: 6.2.a
    text: 'moet de belasting, indien deze verschuldigd is:'
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel6
  - number: 6.2.a.1°
    text: |-
      ter zake van de inschrijving van een personenauto of motorrijwiel, worden betaald voordat het motorrijtuig is
      ingeschreven;
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel6
  - number: 6.2.a.2°
    text: |-
      ter zake van de inschrijving van een bestelauto, worden betaald binnen een maand na het tijdstip waarop het
      motorrijtuig op naam is gesteld in het kentekenregister;
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel6
  - number: 6.2.a.3°
    text: ter zake van de aanvang van het gebruik van de weg, worden betaald vóór de aanvang van dat gebruik;
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel6
  - number: 6.2.b
    text: wordt de aangifte gelijktijdig met de betaling gedaan.
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel6
  - number: '6.3'
    text: |-
      In afwijking van het tweede lid, onderdeel a, onder 3°, behoeft, ingeval de eenheid van de Belastingdienst waar
      aangifte moet worden gedaan ter zake van de aanvang van het gebruik van de weg, gesloten is op de dag waarop dan
      wel op de dag vóórdat het gebruik aanvangt, de belasting pas te worden betaald op de eerste dag waarop die eenheid
      na de aanvang van het gebruik is geopend.
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel6
  - number: '6.4'
    text: |-
      Indien in een geval als bedoeld in het derde lid, degene die de feitelijke beschikking heeft over een niet-
      ingeschreven personenauto, motorrijwiel of bestelauto bij controle door ambtenaren van de rijksbelastingdienst of
      door opsporingsambtenaren als bedoeld in [artikel 141 van het Wetboek van Strafvordering][ref1] niet aannemelijk
      maakt dat de belasting is betaald, dient de belasting terstond te worden betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
  - number: '6.5'
    text: Voor de toepassing van dit artikel wordt onder inschrijving mede verstaan de herinschrijving van het motorrijtuig.
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel6
  - number: '7'
    text: |-
      Degene die voor een personenauto, een motorrijwiel of een bestelauto een aanvraag doet voor de inschrijving,
      wijziging van de inschrijving of herinschrijving, is gehouden daarbij voor dat motorrijtuig het bedrag aan
      belasting ingevolge de [artikelen 9 tot en met 9c][ref1] op te geven.


      [ref1]: https://wetten.overheid.nl/BWBR0005806#Artikel9
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005806
        artikel: '9'
        hoofdstuk: III
        afdeling: '2'
  - number: '8'
    text: |-
      In afwijking van [artikel 6, tweede lid, onderdeel a, onder 1°][ref1], kan de inspecteur, onder bij ministeriële
      regeling te stellen voorwaarden en beperkingen, een ondernemer die in het kader van zijn bedrijfsuitoefening
      regelmatig om inschrijving, wijziging van de inschrijving of herinschrijving verzoekt voor personenauto’s of
      motorrijwielen, op aanvraag bij voor bezwaar vatbare beschikking toestaan de belasting per tijdvak te voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0005806#Artikel6
    url: https://wetten.overheid.nl/BWBR0005806/2024-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0005806
        artikel: '6'
        hoofdstuk: III
        afdeling: '1'
  - number: '9.1'
    text: |-
