preamble:
  text: |-
    Gelet op de artikelen 24 en 25 van de Landbouwwet,

    Besluit:
  url: https://wetten.overheid.nl/BWBR0011274/2000-04-13#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

            a

              *minister:*


              Minister van Landbouw, Natuurbeheer en Visserij;



            b

              *LASER:*


              dienst Landelijke service bij regelingen van het Ministerie van Landbouw, Natuurbeheer en Visserij;



            c

              *beschrijvingsbiljet:*


              in [bijlage I][ref1] opgenomen modelformulier voor de periodieke inventarisatie in de land- en tuinbouw;



            d

              *opgaveplichtige:*


              persoon die, anders dan in het kader van de teelt van griendhout, riet en biezen, in de landbouw zijn
      hoofdbestaan of een gedeelte van zijn bestaan vindt, voor zover aan hem een beschrijvingsbiljet, bedoeld in
      onderdeel c, dan wel anderszins een oproep voor de landbouwtelling is uitgereikt of toegezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0011274
    url: https://wetten.overheid.nl/BWBR0011274/2000-04-13#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0011274
  - number: '2'
    text: |-
      In het tijdvak dat loopt van 1 april 2000 tot en met 23 juni 2000 wordt een landbouwtelling gehouden als bedoeld in
      de [artikelen 24][ref1] en [25 van de Landbouwwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002252#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0002252#Artikel25
    url: https://wetten.overheid.nl/BWBR0011274/2000-04-13#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002252
        artikel: '24'
      - id: ref2
        bwb_id: BWBR0002252
        artikel: '25'
  - number: '3.1'
    text: |-
      Ten behoeve van de telling, bedoeld in [artikel 2][ref1], wordt een beschrijvingsbiljet uitgereikt of verzonden
      door of vanwege de minister.


      [ref1]: https://wetten.overheid.nl/BWBR0011274#Artikel2
    url: https://wetten.overheid.nl/BWBR0011274/2000-04-13#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0011274
        artikel: '2'
  - number: '3.2'
    text: De opgaveplichtige verstrekt de ten aanzien van de veestapel gevraagde gegevens naar de toestand op 1 april 2000.
    url: https://wetten.overheid.nl/BWBR0011274/2000-04-13#Artikel3
  - number: '3.3'
    text: |-
      De opgaveplichtige verstrekt de ten aanzien van oppervlakten gevraagde gegevens naar de toestand op 1 april 2000.
      Indien een oppervlakte op 1 april nog niet is beteeld, wordt de eerstvolgende geplande teelt opgegeven.
    url: https://wetten.overheid.nl/BWBR0011274/2000-04-13#Artikel3
  - number: '3.4'
    text: |-
      Onverminderd het tweede en derde lid, verstrekt de opgaveplichtige de op het beschrijvingsbiljet gevraagde gegevens
      naar de toestand op de datum van ondertekening, tenzij op het biljet of door LASER anders is aangegeven, en neemt
      daarbij de overige op het biljet of door LASER gegeven aanwijzingen in acht.
    url: https://wetten.overheid.nl/BWBR0011274/2000-04-13#Artikel3
  - number: '3.5'
    text: |-
      De opgaveplichtige ondertekent het beschrijvingsbiljet en doet dat binnen 14 dagen na dagtekening van de aanbieding
      aan LASER toekomen.
    url: https://wetten.overheid.nl/BWBR0011274/2000-04-13#Artikel3
  - number: '3.6'
    text: |-
      Indien het beschrijvingsbiljet aangetekend aan de opgaveplichtige is toegezonden, doet deze dat binnen vijf dagen
      ingevuld en ondertekend aan LASER toekomen.
    url: https://wetten.overheid.nl/BWBR0011274/2000-04-13#Artikel3
  - number: '4.1'
    text: |-
      Voor de bepaling van de bedrijfsomvang geldt dat één Nederlandse grootte-eenheid gelijk is aan 1390 eenheden bruto
      standaardsaldo.
    url: https://wetten.overheid.nl/BWBR0011274/2000-04-13#Artikel4
  - number: '4.2'
    text: |-
      De bruto standaardsaldi respectievelijk de standaard-bedrijfseenheden worden vastgesteld als vermeld in
      [bijlage II][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011274
    url: https://wetten.overheid.nl/BWBR0011274/2000-04-13#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0011274
  - number: '4.3'
    text: |-
      Bruto-standaardsaldi worden overeenkomstig [bijlage II][ref1] omgerekend in Nederlandse grootte-eenheden.


      [ref1]: https://wetten.overheid.nl/BWBR0011274
    url: https://wetten.overheid.nl/BWBR0011274/2000-04-13#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0011274
  - number: '5.1'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na dagtekening van de Staatscourant waarin zij wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0011274/2000-04-13#Artikel5
  - number: '5.2'
    text: 'Deze regeling wordt aangehaald als: Regeling landbouwtelling 2000.'
    url: https://wetten.overheid.nl/BWBR0011274/2000-04-13#Artikel5
