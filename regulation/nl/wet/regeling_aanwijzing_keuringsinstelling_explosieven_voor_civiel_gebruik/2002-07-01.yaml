$id: regeling_aanwijzing_keuringsinstelling_explosieven_voor_civiel_gebruik
regulatory_layer: WET
publication_date: '2010-10-18'
valid_from: '2002-07-01'
bwb_id: BWBR0006963
url: https://wetten.overheid.nl/BWBR0006963/2002-07-01
preamble:
  text: |-
    Handelende in overeenstemming met de Ministers van Verkeer en Waterstaat en van Economische Zaken;

    Gelet op de artikelen 5, eerste lid, en 22, eerste lid, van de Wet explosieven voor civiel gebruik;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0006963/2002-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder de wet: de [Wet explosieven voor civiel gebruik][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006803
    url: https://wetten.overheid.nl/BWBR0006963/2002-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006803
  - number: '2'
    text: |-
      Als instelling, bedoeld in [artikel 5, eerste lid, van de wet][ref1] wordt aangewezen het Prins Maurits
      Laboratorium van de Nederlandse Organisatie voor Toegepast Natuurwetenschappelijk Onderzoek (TNO).


      [ref1]: https://wetten.overheid.nl/BWBR0006803#Artikel5
    url: https://wetten.overheid.nl/BWBR0006963/2002-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006803
        artikel: '5'
  - number: '4'
    text: |-
      Met het toezicht op de naleving van het bij of krachtens hoofdstuk III van de wet bepaalde zijn mede belast de
      ambtenaren van de divisie Vervoer van de Inspectie Verkeer en Waterstaat.
    url: https://wetten.overheid.nl/BWBR0006963/2002-07-01#Artikel4
  - number: '5'
    text: |-
      In afwijking van [artikel 4][ref1] zijn met het toezicht op de naleving van het bij of krachtens hoofdstuk III van
      de wet bepaalde belast de ambtenaren van het Staatstoezicht op de Mijnen van het Ministerie van Economische Zaken,
      indien de vergunning, bedoeld in artikel 10 van de wet, dan wel de erkenning, bedoeld in artikel 17 van de wet,
      wordt verleend door de Minister van Economische Zaken.


      [ref1]: https://wetten.overheid.nl/BWBR0006963#Artikel4
    url: https://wetten.overheid.nl/BWBR0006963/2002-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0006963
        artikel: '4'
  - number: '6'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst en werkt terug tot en met 1 oktober 1994.
    url: https://wetten.overheid.nl/BWBR0006963/2002-07-01#Artikel6
  - number: '7'
    text: |-
      Deze regeling wordt aangehaald als: Regeling aanwijzing keuringsinstelling en toezichthoudende ambtenaren Wet
      explosieven voor civiel gebruik. Deze regeling zal met de toelichting in de Staatscourant worden geplaatst.
    url: https://wetten.overheid.nl/BWBR0006963/2002-07-01#Artikel7
