        artikel: 3:42
  - number: '4'
    text: |-
      De managementautoriteit kan een formulier vaststellen voor de aanvraag. In voorkomend geval
      draagt de managementautoriteit zorg voor bekendmaking van het formulier met inachtneming van
      [artikel 3:42 van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel342
    url: https://wetten.overheid.nl/BWBR0022831/2011-11-03#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 3:42
  - number: '5'
    text: |-
      1 De managementautoriteit wijst de aanvraag af indien deze strekt tot het krachtens deze regeling subsidie
      verkrijgen ter hoogte van het geheel van de subsidiabele kosten van het project.

      2 De managementautoriteit verleent de subsidie zonodig onder de opschortende voorwaarde van tijdige
      toekenningsbeslissingen door de beoogde overige cofinanciers.

      3 De managementautoriteit kan de aanvraag geheel of gedeeltelijk afwijzen indien:

      a. blijkt dat de beoogde cofinanciering door de overige cofinanciers gedeeltelijk niet zal worden verleend, of

      b. het project naar het oordeel van de managementautoriteit volgens het Europees programma of volgens de
      beleidsregels, bedoeld in [artikel 6, tweede lid][ref1], in aanmerking komt voor een groter deel cofinanciering
      door een ander bestuursorgaan en blijkt dat deze cofinanciering niet of niet volledig zal worden verleend.

      4 De Minister kan ontheffing verlenen van het bepaalde in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0022831#Artikel6
    url: https://wetten.overheid.nl/BWBR0022831/2011-11-03#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0022831
        artikel: '6'
  - number: '6'
    text: |-
      1 De managementautoriteit beslist afwijzend op een aanvraag indien:

      a. de aanvraag niet voldoet aan de Kaderverordening, de EFRO-verordening, de Uitvoeringsverordening, het
      [Besluit EFRO programmaperiode 2007–2013][ref1] of deze regeling;

      b. het project niet past binnen het Europees Programma;

      c. de managementautoriteit door toewijzing niet zou voldoen aan één van de verplichtingen gesteld in artikelen 42,
      57, 60 en 90 van de Kaderverordening, dan wel artikelen 2, 3, 5 en 7 van de Uitvoeringsverordening.

      2 In aanvulling op het eerste lid maakt de managementautoriteit de criteria, bedoeld in artikel 65, onder a,
      van de Kaderverordening, als beleidsregel voor de toekenning van subsidie op grond van deze regeling bekend met
      inachtneming van [artikel 3:42 van de Algemene wet bestuursrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0022685
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel342
    url: https://wetten.overheid.nl/BWBR0022831/2011-11-03#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0022685
      - id: ref2
        bwb_id: BWBR0005537
        artikel: 3:42
  - number: '7'
    text: |-
      1 De managementautoriteit verdeelt het beschikbare bedrag aan rijkscofinanciering en middelen uit het Europees
      Fonds voor Regionale Ontwikkeling op volgorde van binnenkomst van de aanvraag, met dien verstande dat indien een
      aanvrager niet heeft voldaan aan enig wettelijk voorschrift voor het in behandeling nemen van de aanvraag en met
      toepassing van [artikel 4:5 van de Algemene wet bestuursrecht][ref1] de gelegenheid heeft gehad de aanvraag aan te
      vullen, de dag waarop de aanvraag voldoet aan de wettelijke voorschriften met betrekking tot de verdeling als datum
      van ontvangst geldt.

      2 In afwijking van het eerste lid kan de managementautoriteit de aanvragen rangschikken en het beschikbare bedrag
      verdelen in de volgorde van die rangschikking.

      3 Bij toepassing van het tweede lid maakt de managementautoriteit voorafgaand aan de aanvraagperiode
      de criteria die de rangschikking bepalen, de periode waarin de aanvraag kan worden ingediend
      en het voor die periode als deelplafond geldende subsidieplafond bekend met inachtneming van
      [artikel 3:42 van de Algemene wet bestuursrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel342
