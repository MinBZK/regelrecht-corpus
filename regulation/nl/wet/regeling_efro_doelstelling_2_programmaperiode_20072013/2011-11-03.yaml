preamble:
  text: |-
    Gelet op artikel 56, derde lid, van de Kaderverordening 1083/2006, artikelen 3, vijfde lid, en 8, eerste lid, van
    de Kaderwet EZ-subsidies en de artikelen 2 en 3 van het Besluit EFRO programmaperiode 2007–2013;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0022831/2011-11-03#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Als Europees Programma, bedoeld in [artikel 3, eerste lid][ref1] en
      [artikel 4 van het Besluit EFRO programmaperiode 2007–2013][ref2], wordt aangewezen:

      a. het Operationeel Programma voor Oost-Nederland (beschikkingsnummer C(2007)3724), op 27 juli 2007 goedgekeurd
      door de Europese Commissie;

      b. het Operationeel Programma voor Zuid-Nederland (beschikkingsnummer C(2007)2604), op 13 juni 2007 goedgekeurd
      door de Europese Commissie;

      c. het Operationeel Programma voor West-Nederland (beschikkingsnummer C(2007)3949), op 13 augustus 2007 goedgekeurd
      door de Europese Commissie;

      d. het Operationeel Programma voor Noord-Nederland (beschikkingsnummer C(2007)3725), op 27 juli 2007 goedgekeurd
      door de Europese Commissie.


      [ref1]: https://wetten.overheid.nl/BWBR0022685#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0022685#Artikel4
