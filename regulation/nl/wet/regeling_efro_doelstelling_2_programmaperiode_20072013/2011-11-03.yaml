  - number: '8'
    text: |-
      1 De subsidieontvanger voert het project uit overeenkomstig het projectplan waarop de subsidieverlening betrekking
      heeft en voltooit het uiterlijk op het bij de verlening bepaalde tijdstip, behoudens schriftelijke ontheffing van
      de managementautoriteit voor het vertragen, het essentieel wijzigen of het stopzetten van het project.

      2 De subsidieontvanger voert het project in Nederland uit, behoudens voorafgaande schriftelijke ontheffing van de
      managementautoriteit voor gedeeltelijke uitvoering buiten Nederland.

      3 De in artikel 57, eerste lid, van de Kaderverordening bedoelde termijn van vijf jaar wordt in geval van een MKB-
      ondernemer verkort tot drie jaar.

      4 Aan een ontheffing als bedoeld in het eerste of tweede lid kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0022831/2011-11-03#Artikel8
  - number: '9'
    text: |-
      1 De subsidieontvanger voert een administratie die zodanig is ingericht dat daaruit te allen tijde op eenvoudige
      en duidelijke wijze alle door hem gemaakte en betaalde kosten, aangegane verplichtingen en verrichte betalingen
      en de eventueel aan het project toe te rekenen opbrengsten kunnen worden afgelezen gespecificeerd overeenkomstig
      de in [artikel 10, eerste en tweede lid][ref1], onderscheiden kostensoorten, met dien verstande dat ter zake
      van de kosten bedoeld in artikel 10, eerste lid, onder a, onderdeel 1° en tweede lid, een door middel van een
      inzichtelijke tijdschrijving controleerbare urenverantwoording per werknemer aanwezig dient te zijn.

      2 De subsidie-ontvanger doet onverwijld mededeling aan de managementautoriteit van de indiening bij de rechtbank
      van een verzoek tot het op hem van toepassing verklaren van de schuldsaneringsregeling natuurlijke personen, tot
      verlening van surseance van betaling aan hem of tot faillietverklaring van hem.

      3 De subsidieontvanger zal, behoudens voorafgaande schriftelijke ontheffing van de managementautoriteit, niet:

      a. indien hij een rechtspersoon is, de rechtspersoon ontbinden of geheel of gedeeltelijk vervreemden;

      b. indien hij deelnemer is in een samenwerkingsverband in de vorm van een commanditaire vennootschap, een
      vennootschap onder firma of een maatschap, meewerken aan de ontbinding ervan of aan het uittreden van een of meer
      deelnemers ervan.

      4 Aan een ontheffing als bedoeld in het derde lid kunnen voorschriften worden verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0022831#Artikel10
    url: https://wetten.overheid.nl/BWBR0022831/2011-11-03#Artikel9
    references:
