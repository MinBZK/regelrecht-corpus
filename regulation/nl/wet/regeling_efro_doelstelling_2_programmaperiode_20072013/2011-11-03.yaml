  - number: '12'
    text: |-
      1 Als toezichthouder op deze regeling worden aangewezen:

      a. de ambtenaren van de Auditdienst van het Ministerie van Financiën;

      b. de bij besluit van de managementautoriteit aan te wijzen ambtenaren voor het in
      [artikel 5 van het Besluit EFRO programmaperiode 2007–2013][ref1] bij deze managementautoriteit bedoelde
      programma.

      2 De in het eerste lid aangewezen personen beschikken niet over de bevoegdheden genoemd in [artikelen 5:18][ref2]
      en [5:19 van de Algemene wet bestuursrecht][ref3].


