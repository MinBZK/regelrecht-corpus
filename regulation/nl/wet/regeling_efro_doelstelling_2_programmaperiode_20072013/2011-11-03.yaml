        bwb_id: BWBR0022831
        artikel: '10'
  - number: 9a
    text: |-
      Als procedure, bedoeld in artikel 19, vijfde lid, van de Uitvoeringsverordening, wordt vastgesteld de in de bij
      deze regeling behorende bijlage 1 opgenomen procedure.
    url: https://wetten.overheid.nl/BWBR0022831/2011-11-03#Artikel9a
  - number: '10'
    text: |-
      1 Als subsidiabele kosten worden uitsluitend de volgende rechtstreeks aan het project toe te rekenen kosten in
      aanmerking genomen:

      a. de volgende door de subsidieontvanger gemaakte en betaalde kosten:

      1°. loonkosten, voor de berekening waarvan de aanvrager bij de aanvraag kiest uit:

        - de loonkosten plus overhead systematiek, opgenomen in [artikel 10a, eerste lid][ref1],
        - de integraal uurtarief systematiek, opgenomen in [artikel 10a, tweede tot en met vierde lid][ref2];
        - forfaitaire kosten berekend door toepassing van van overheidswege gehanteerde standaardschalen van
      eenheidskosten;

      2°. kosten ten behoeve van promotie en publiciteit;

      3°. aankoop of inbreng van grond, gebaseerd op de objectief aangetoonde actuele marktwaarde, blijkend uit bij
      de aanvraag om subsidievaststelling gevoegde gegevens en bescheiden, tot een maximum van 10% van de subsidiabele
      projectkosten;

      4°. aankoop of inbreng van gebouwen en onroerende zaken, met inbegrip van de kosten voor aankoop, belastingen,
      leges en taxatiekosten, gebaseerd op de objectief aangetoonde actuele marktwaarde, blijkend uit bij de aanvraag om
      subsidievaststelling gevoegde gegevens en bescheiden;

      5°. kosten van de voor het project aangeschafte machines en apparatuur en productiemiddelen, gebaseerd op de
      objectief aangetoonde actuele marktwaarde, blijkend uit bij de aanvraag om subsidievaststelling gevoegde gegevens
      en bescheiden;

      6°. kosten van het gebruik voor het project van machines en apparatuur die in het bezit zijn van een deelnemer aan
      het kennisproject of van derden, gebaseerd op de objectief aangetoonde actuele marktwaarde, blijkend uit bij de
      aanvraag om subsidievaststelling gevoegde gegevens en bescheiden;

      7°. kosten van verbruikte materialen en hulpmiddelen, gebaseerd op historische aanschafprijzen;

      8°. kosten voor financiële transacties, financieel juridische diensten, patenten en bankkosten, met uitzondering
      van debetrente, boetes, financiële sancties en gerechtskosten;

      9°. reis- en verblijfskosten voor binnenlandse en buitenlandse reizen, voorzover deze niet inbegrepen zijn in het
      integrale uurtarief;

      10°. andere aan derden verschuldigde kosten;

      b. kosten voor bijdragen in fondsen of andere methoden op het gebied van financiële instrumentering als bedoeld in
      artikel 44 van de [kaderverordening 1083/2006](32006R1083).

      2 Indien geen loonkosten worden gemaakt als bedoeld in het eerste lid, onder a, onderdeel 1°, maar desniettemin
      als bijdrage in natura arbeid ten behoeve van het project wordt verricht, worden de subsidiabele kosten berekend
      door het aantal uren dat de deelnemers aan het project ten behoeve van deze activiteiten hebben gemaakt te
      vermenigvuldigen met een vast uurtarief van € 35.

      3 In afwijking van het eerste lid kunnen op aanvraag van de subsidieontvanger voor de subsidiabele kosten of een
      deel daarvan in de beschikking tot subsidieverlening vaste bedragen worden vermeld tot een totaalbedrag van ten
      hoogste € 50.000.

      4 De in het eerste, tweede en derde lid genoemde kosten zijn slechts toe te rekenen aan het project voor zover zij
      proportioneel en doelmatig zijn.

      5 De kosten worden in aanmerking genomen met inbegrip van omzetbelasting, indien de subsidieontvanger die de kosten
      heeft gemaakt, omzetbelasting niet in aftrek kan brengen of niet gecompenseerd wordt uit het BTW-compensatiefonds
      als genoemd in [artikel 2 van de Wet op het BTW-compensatiefonds][ref3].

      6 Indien ter zake van de projectkosten of een deel daarvan reeds door een ander bestuursorgaan of de Europese
      commissie subsidie is verstrekt, wordt slechts een zodanig bedrag aan subsidie verstrekt, dat het totale bedrag aan
      subsidies niet meer bedraagt dan de totale waarde van projectkosten die voor deze subsidie in aanmerking komen.


