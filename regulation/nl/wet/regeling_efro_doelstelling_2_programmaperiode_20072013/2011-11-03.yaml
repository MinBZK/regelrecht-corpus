  - number: '2'
    text: |-
      1 De bevoegdheid tot het nemen van besluiten op grond van deze regeling wordt gedelegeerd aan de
      managementautoriteit van het desbetreffende programma, genoemd in [artikel 1][ref1].

      2 De managementautoriteit van het programma, genoemd in [artikel 1][ref2], kan op aanvraag subsidie verlenen aan
      degene die een project tot stand brengt dat past in dat programma.


      [ref1]: https://wetten.overheid.nl/BWBR0022831#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0022831#Artikel1
