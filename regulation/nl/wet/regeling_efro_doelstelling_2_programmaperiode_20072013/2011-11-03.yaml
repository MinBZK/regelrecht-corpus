  - number: '11'
    text: |-
      1 De managementautoriteit kan voorwaarden verbinden aan de subsidie.

      2 Indien het project geheel of gedeeltelijk voorziet in het door de subsidieontvanger op zijn beurt bij
      wijze van subsidie of anderszins verstrekken van middelen aan derden, verbindt de managementautoriteit aan de
      subsidieverlening tenminste zodanige voorwaarden dat de voorschriften van de Kaderverordening, de EFRO-verordening,
      het [Besluit EFRO programmaperiode 2007–2013][ref1] en van deze regeling ook op die derde van toepassing zijn.

      3 De managementautoriteit verbindt zodanig voorwaarden aan de subsidie dat de subsidieontvanger de voor hun
      taakvervulling nodige medewerking verleent aan de certificeringsautoriteit en de auditautoriteit.


      [ref1]: https://wetten.overheid.nl/BWBR0022685
