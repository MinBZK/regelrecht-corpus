  - number: 10a
    text: |-
      1 Indien de subsidieontvanger kiest voor de loonkosten plus overhead systematiek, worden de volgende kosten in
      aanmerking genomen:

      a. loonkosten van het bij de uitvoering van het project direct betrokken personeel, berekend op basis van het
      brutoloon volgens de loonstaat van de betrokken medewerkers, verhoogd met de wettelijke dan wel op grond van een
      collectieve arbeidsovereenkomst verschuldigde opslagen voor sociale lasten, met dien verstande dat wordt uitgegaan
      van 1650 productieve uren per jaar bij een voltijds dienstverband van 40 uren;

      b. algemene indirecte kosten (overhead), gerelateerd aan de loonkosten en gebaseerd op de werkelijke kosten van de
      uitgevoerde activiteit, volgens een bij de aanvraag om subsidie overgelegde berekeningsmethodiek.

      2 Indien de subsidieontvanger kiest voor de integraal uurtarief systematiek worden de subsidiabele kosten
      berekend door het aantal door het direct bij de uitvoering van het project betrokken personeel gemaakte uren
      te vermenigvuldigen met het in het derde en vierde lid bedoelde integrale uurtarief dat de subsidieontvanger
      hanteert voor de functiecategorie van dat personeel, met dien verstande dat het aantal gemaakte uren per persoon
      op jaarbasis niet meer bedraagt dan het aantal uren dat voor de desbetreffende functiecategorie op jaarbasis is
      gehanteerd voor de berekening van het integrale uurtarief.

      3 De subsidieontvanger berekent het integrale uurtarief op basis van een bij de subsidieontvanger gebruikelijke en
      controleerbare methode, die is gebaseerd op bedrijfseconomische grondslagen en normen die in het maatschappelijk
      verkeer als aanvaardbaar worden beschouwd en die de subsidieontvanger stelselmatig toepast. Het integrale uurtarief
      is samengesteld uit de directe personeelskosten en de algemene indirecte kosten (overhead). Het integrale uurtarief
      betreft uitsluitend de kosten uit de gewone bedrijfsvoering en bevat geen winstopslag.

      4 De subsidieontvanger legt bij de aanvraag om subsidie en daarna jaarlijks een specificatie over van alle
      kostensoorten binnen het gehanteerde integrale uurtarief en het aantal uren per functiecategorie waarop het
      integrale uurtarief is gebaseerd.

      5 Bij toepassing van de integraal uurtarief systematiek is de tijdschrijving, bedoeld in
      [artikel 9, eerste lid][ref1], sluitend.


      [ref1]: https://wetten.overheid.nl/BWBR0022831#Artikel9
