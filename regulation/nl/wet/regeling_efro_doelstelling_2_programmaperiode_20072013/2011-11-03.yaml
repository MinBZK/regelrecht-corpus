  - number: '13'
    text: |-
      1 De managementautoriteit vermeldt in de subsidiebeschikking het bedrag dat krachtens deze regeling bij wijze van
      rijkscofinanciering wordt verleend.

      2 De managementautoriteit heeft aanspraak op vergoeding door de Minister van Economische Zaken van het bedrag,
      bedoeld in het eerste lid.

      3 Het tweede lid is van toepassing voor zover de certificeringsautoriteit de betrokken betaalaanvraag of
      betaalaanvragen heeft goedgekeurd.

      4 De aanspraak op vergoeding van rijkscofinanciering uit ’s Rijks kas bedraagt in totaal ten hoogste:

      a. voor de managementautoriteit van het programma Oost: € 37.191.000;

      b. voor de managementautoriteit van het programma Zuid: € 45.947.000;

      c. voor de managementautoriteit van het programma West: € 76.830.000;

      d. voor de managementautoriteit van het programma Noord: € 80.031.000.

      5 In aanvulling op het bedrag genoemd in het vierde lid, onder d, bedraagt de aanspraak op vergoeding van
      Rijkscofinanciering uit ’s Rijks kas voor de managementautoriteit van het programma Noord, € 38.600.000, voorzover
      deze middelen zijn ingezet in één van de vier centrale opgaven van het programma ‘Koers Noord: op weg naar pieken’.
    url: https://wetten.overheid.nl/BWBR0022831/2011-11-03#Artikel13
  - number: '14'
    text: |-
      De in [artikel 1][ref1] en [artikel 13, vijfde lid][ref2], genoemde programma's worden ter inzage gelegd bij het
      Informatiecentrum van het Ministerie van Economische Zaken, Bezuidenhoutseweg 30, kamer 0.23, te Den haag.


