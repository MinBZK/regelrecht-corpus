        artikel: '1'
  - number: '3'
    text: |-
      De managementautoriteit stelt de subsidieplafonds voor de rijkscofinanciering en Europese
      financiering voor de uitvoering van deze regeling vast en maakt deze bekend met inachtneming van
      [artikel 3:42 van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel342
    url: https://wetten.overheid.nl/BWBR0022831/2011-11-03#Artikel3
    references:
      - id: ref1
