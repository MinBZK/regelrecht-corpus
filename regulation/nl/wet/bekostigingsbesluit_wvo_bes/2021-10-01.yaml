  - number: 21a
    text: |-
      1 In geval van oprichting, verplaatsing of splitsing van een school kan Onze Minister afwijken van de teldatum
      en de op die afwijkende datum getelde leerlingen toerekenen aan de nieuwe scholen. Hij kan daarbij nadere
      voorschriften geven.

      2 Onze Minister kan in verband met de aanvang of de beëindiging van de bekostiging van een school, van
      een scholengemeenschap of van een profiel aan een school voor vbo afwijken van de [artikelen 7][ref1] en
      [7a, eerste en tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0029598#Artikel7
