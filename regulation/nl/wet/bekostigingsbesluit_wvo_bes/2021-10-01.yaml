  - number: '2'
    text: |-
      Het bevoegd gezag doet binnen twee weken na een besluit tot opheffing van de school daarvan mededeling aan Onze
      Minister, de inspectie, bedoeld in de Wet op het onderwijstoezicht, en indien het een bijzondere school betreft,
      eveneens aan het bestuurscollege van het openbaar lichaam waarin de school is gelegen.
    url: https://wetten.overheid.nl/BWBR0029598/2021-10-01#Artikel2
  - number: '3'
    text: |-
      1 Het bevoegd gezag van een school draagt er zorg voor dat een overzichtelijke administratie van de inschrijving,
      de uitschrijving en het verzuim van de leerlingen op de school beschikbaar is, alsmede van de gegevens van de
      leerlingen en hun ouders die noodzakelijk zijn voor de vaststelling van de bekostiging.

      2 Bij ministeriële regeling kunnen voorschriften worden gegeven omtrent de wijze waarop de leerlingenadministratie
      wordt ingericht.
    url: https://wetten.overheid.nl/BWBR0029598/2021-10-01#Artikel3
  - number: '4'
    text: |-
      1 De directeur of rector van een school schrijft een leerling slechts in na overlegging van:

      a. een bewijs van uitschrijving van de leerling van een andere school of een school voor ander onderwijs, welk
      bewijs op het moment van inschrijving niet ouder is dan zes maanden,

      b. een schriftelijke verklaring van de ouders van de leerling, of van de leerling die meerderjarig en
      handelingsbekwaam is, dat de leerling binnen een periode van zes maanden voorafgaand aan de inschrijving
      niet eerder op een andere school, een school voor ander onderwijs of een instelling als bedoeld in
      [artikel 1, onderdeel c, van de Leerplichtwet BES][ref1] was ingeschreven, of

      c. een schriftelijke verklaring van de ouders van de leerling, of van de leerling die meerderjarig en
      handelingsbekwaam is, dat de leerling voorafgaand aan de inschrijving op een instelling als bedoeld in
      [artikel 1, onderdeel c, van de Leerplichtwet BES][ref2] was ingeschreven en dat deze leerling daar is
      uitgeschreven.

      2 Het bewijs van uitschrijving dan wel de verklaring, bedoeld in het eerste lid, onderdeel b of c, wordt bewaard in
      de administratie van de school.

      3 De directeur of rector doet in het geval, bedoeld in het eerste lid, onderdeel a, dan wel in het geval, bedoeld
      in het eerste lid, onderdeel b, indien hem respectievelijk haar bekend is op welke andere school, school voor
      ander onderwijs of instelling als bedoeld in [artikel 1, onderdeel c, van de Leerplichtwet BES][ref3] de leerling
      was ingeschreven buiten de in het eerste lid, onderdeel b, bedoelde periode, dan wel in het geval, bedoeld in het
      eerste lid, onderdeel c, indien hem respectievelijk haar bekend is op welke instelling als bedoeld in artikel 1,
      onderdeel c, van de Leerplichtwet BES de leerling was ingeschreven, onder vermelding van de datum van inschrijving
      op zijn respectievelijk haar school, binnen één week schriftelijk mededeling van de inschrijving aan de directeur
      of rector directie van de school, de school voor ander onderwijs of de instelling, bedoeld in artikel 1, onderdeel
      c, van de Leerplichtwet BES, waarop de leerling voordien was ingeschreven.

      4 De directeur of rector schrijft de leerling in met ingang van de dag waarop de leerling de school voor het eerst
      bezoekt.

      5 In afwijking van het vierde lid, schrijft de directeur of rector de leerling die de school voor het eerst bezoekt
      op de eerste schooldag van het schooljaar, in met ingang van 1 augustus van dat schooljaar.


