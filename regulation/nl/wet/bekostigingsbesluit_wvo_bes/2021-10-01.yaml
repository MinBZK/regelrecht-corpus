  - number: '5'
    text: |-
      1 De directeur of rector van een school waarop de leerling staat ingeschreven, schrijft de leerling, indien deze
      de school verlaat, uit met ingang van de dag volgende op de dag waarop de leerling de school voor het laatst heeft
      bezocht en verstrekt de leerling een bewijs van uitschrijving.

      2 Indien de directeur of rector van een school waarop de leerling stond ingeschreven, binnen vier weken na de
      dag waarop de leerling de school voor het laatst heeft bezocht een mededeling ontvangt van de directeur of rector
      van een school of een school voor ander onderwijs, van de inschrijving van de leerling op laatstbedoelde scholen,
      wijzigt de directeur of rector de datum van uitschrijving, bedoeld in het eerste lid, alsnog in de datum van de dag
      voorafgaande aan de dag van inschrijving op de andere school of de school voor ander onderwijs.
    url: https://wetten.overheid.nl/BWBR0029598/2021-10-01#Artikel5
  - number: '6'
    text: |-
      De gegevens die in de leerlingenadministratie zijn opgenomen, blijven daarvan in ieder geval deel uitmaken
      gedurende 5 jaar nadat de desbetreffende leerling van de school is uitgeschreven.
    url: https://wetten.overheid.nl/BWBR0029598/2021-10-01#Artikel6
  - number: '7'
    text: |-
      1 Voor de toepassing van het bepaalde bij of krachtens de [wet][ref1] worden, onverminderd [artikel 5][ref2],
      [7a][ref3] en [14, vierde lid][ref4], de leerlingen meegeteld die:

      a. op de teldatum als werkelijk schoolgaand staan ingeschreven; of

      b. op de teldatum in bij ministeriële regeling te bepalen gevallen tijdelijk buiten de school waar zij staan
      ingeschreven zijn geplaatst.

      2 Een leerling telt voor één school mee voor de bekostiging.


