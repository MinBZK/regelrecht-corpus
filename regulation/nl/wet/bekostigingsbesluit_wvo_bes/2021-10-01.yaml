  - number: 7a
    text: |-
      1 Voor het bepalen van de hoogte van de bekostiging worden niet meegeteld:

      a. leerlingen die vanaf het begin van het schooljaar tot de teldatum meer dan de helft van het aantal schooldagen
      zonder geldige reden hebben verzuimd; en

      b. leerlingen die deelnemen aan het onderwijs in het kader van contractactiviteiten als bedoeld in
      [artikel 43, tweede lid, van de wet][ref1].

      2 Als geldige reden als bedoeld in het eerste lid, onderdeel a, voor verzuim wordt aangemerkt:

      a. ten aanzien van een leerplichtige leerling: een vrijstelling van geregeld schoolbezoek als bedoeld in de
      [Leerplichtwet BES][ref2]; of

      b. ten aanzien van een niet-leerplichtige leerling: dezelfde gronden als die welke leiden tot vrijstelling van
      geregeld schoolbezoek als bedoeld in onderdeel a.

      3 Bij het bepalen van het aantal leerlingen op de school, bedoeld in
      [artikel 9, eerste lid, onderdeel a, en tweede lid, onderdeel a][ref3], worden tevens ingeschreven studenten als
      bedoeld in de [Wet educatie en beroepsonderwijs BES][ref4] meegeteld.


