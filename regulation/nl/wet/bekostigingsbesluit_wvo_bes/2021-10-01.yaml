  - number: '8'
    text: |-
      1 Leerlingen als bedoeld in de [artikelen 2][ref1] en [3 van het Besluit samenwerking VO-BVE BES][ref2] worden
      aangemerkt als leerlingen die op de teldatum als werkelijk schoolgaand zijn ingeschreven, als bedoeld in
      [artikel 7, eerste lid][ref3]. Het bepaalde in artikel 7, eerste en tweede lid, over verzuim is van overeenkomstige
      toepassing.

      2 In afwijking van het eerste lid, eerste volzin, tellen leerlingen als bedoeld in
      [artikel 3, eerste lid, onderdeel c, van het Besluit samenwerking VO-BVE BES][ref4] op de teldatum voor 50% mee.


