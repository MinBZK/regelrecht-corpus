  - number: '13'
    text: |-
      1 Onze Minister maakt de in [artikel 9][ref1] bedoelde bekostiging bekend voorafgaand aan het
      kalenderjaar, waarop deze betrekking heeft. Indien de verklaring van de deskundige, bedoeld in
      [artikel 14, tweede lid, onderdeel c][ref2], daartoe aanleiding geeft, wijzigt Onze Minister de bekostiging of
      aanvullende bekostiging.

      2 De in [artikel 9][ref3] bedoelde bekostiging kan door Onze Minister worden gewijzigd wegens algemene
      salarismaatregelen of wegens andere al dan niet uit de rijksbegroting voortvloeiende maatregelen.


      [ref1]: https://wetten.overheid.nl/BWBR0029598#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0029598#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0029598#Artikel9
