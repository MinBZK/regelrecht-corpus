  - number: '15'
    text: |-
      1 De boekhouding van een school is zodanig ingericht dat op doelmatige wijze informatie kan worden verkregen
      omtrent het gevoerde financiële beheer.

      2 Het bevoegd gezag verstrekt op verzoek van Onze Minister nadere financiële informatie met betrekking tot de
      school. De wijze waarop deze informatie wordt verstrekt, kan bij ministeriële regeling worden geregeld.

      3 Het boekjaar is gelijk aan het kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0029598/2021-10-01#Artikel15
  - number: '16'
    text: |-
      1 Het bevoegd gezag stelt jaarlijks tijdig voor het komende begrotingsjaar een begroting vast voor de school.

      2 De begroting behelst een raming van de baten en lasten van de school en is sluitend. De in de begroting voorziene
      baten uit de van het Rijk te ontvangen bekostiging komen overeen met de voor het desbetreffende jaar door Onze
      Minister vastgestelde bekostiging.

      3 Het bevoegd gezag doet de noodzakelijke uitgaven binnen de grenzen van de begroting.

      4 Af- en overschrijving op de uitgavenposten van de begroting kunnen door het bevoegd gezag geschieden
      overeenkomstig door het bevoegd gezag vastgestelde regels.

      5 Indien Onze Minister het bevoegd gezag daarom verzoekt, wordt de vastgestelde begroting aan Onze Minister
      overgelegd.

      6 Bij ministeriële regeling kan een model voor de inrichting van de begroting worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0029598/2021-10-01#Artikel16
  - number: '17'
    text: |-
      1 Het bevoegd gezag stelt jaarlijks ten behoeve van de school een jaarrekening vast over het afgelopen jaar.

      2 In de jaarrekening legt het bevoegd gezag verantwoording af over het financieel beheer. Uit de jaarrekening
      blijkt dat sprake is van een rechtmatige aanwending van de rijksbekostiging. De jaarrekening omvat mede de gegevens
      die van belang zijn voor de verantwoording met betrekking tot de besteding van toegekende aanvullende bekostiging.

      3 Het bevoegd gezag dient de vastgestelde jaarrekening voor 1 juli van het jaar volgend op het boekjaar in bij Onze
      Minister. De jaarrekening gaat vergezeld van een verklaring omtrent de getrouwheid, afgegeven door een door het
      bevoegd gezag aangewezen deskundige. Bij de aanwijzing van de deskundige bedingt het bevoegd gezag dat aan Onze
      Minister op diens verzoek inzage wordt geboden in de controlerapporten en de controledossiers van de deskundige.

      4 Indien het bevoegd gezag meer dan één school in stand houdt, wordt voor deze scholen een gezamenlijke balans en
      een gezamenlijke exploitatierekening vastgesteld. Bij de jaarrekening is een bijlage gevoegd die inzicht biedt in
      het bestedingspatroon ten aanzien van de afzonderlijke scholen van het bevoegd gezag.

      5 Bij ministeriële regeling wordt een model voor de inrichting van de jaarrekening vastgesteld.

      6 Onze Minister kan een leidraad vaststellen met betrekking tot de inrichting en de uitvoering van de controle door
      de deskundige.
    url: https://wetten.overheid.nl/BWBR0029598/2021-10-01#Artikel17
  - number: '19'
    text: |-
      1 Indien aan het bevoegd gezag van een school een aanvullende bekostiging is verstrekt onder de voorwaarde dat deze
      bekostiging voor het bij de verstrekking aangegeven doel wordt besteed, blijkt uit de jaarrekening van de school in
      hoeverre deze bekostiging voor dat doel is besteed.

      2 Indien verrekening plaatsvindt of zal plaatsvinden van het daadwerkelijk bestede bedrag met de vastgestelde
      aanvullende bekostiging, maakt het bevoegd gezag in de desbetreffende jaarrekening melding van het daadwerkelijk
      bestede bedrag.
    url: https://wetten.overheid.nl/BWBR0029598/2021-10-01#Artikel19
  - number: '20'
    text: |-
      1 Onverminderd de bevoegdheid van de Inspectie van het onderwijs op grond van de
      [Wet op het onderwijstoezicht][ref1] kan Onze Minister een onderzoek instellen of doen instellen naar de
      jaarverslaggeving, naar de gegevens die noodzakelijk zijn voor de vaststelling van de bekostiging, naar de
      rechtmatigheid van de bestedingen en naar de doelmatigheid van het beheer van de school.

      2 Indien uit een op grond van het eerste lid ingesteld onderzoek blijkt dat de bekostiging voor een school onjuist
      is vastgesteld, kan Onze Minister correcties aanbrengen op de bekostiging. Onze Minister doet het bevoegd gezag
      schriftelijk mededeling van een besluit tot het aanbrengen van een correctie op de bekostiging.

      3 Indien uit de jaarverslaggeving, bedoeld in [artikel 175, eerste lid, van de wet][ref2], uit de verklaring
      van de deskundige, bedoeld in artikel 175, vierde lid, van de wet of uit een op grond van het eerste lid
      ingesteld onderzoek blijkt dat de bekostiging voor een school onrechtmatig is besteed of ondoelmatig is
      aangewend, kan Onze Minister bepalen dat het desbetreffende gedeelte van de bekostiging niet ten laste komt
      van het Rijk of dat de daarmee gemoeide bedragen in mindering worden gebracht op de bekostiging, onverminderd
      [artikel 4:49 van de Algemene wet bestuursrecht][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0013800
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel175
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel449
    url: https://wetten.overheid.nl/BWBR0029598/2021-10-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0013800
      - id: ref2
        bwb_id: BWBR0030284
        artikel: '175'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: 4:49
  - number: '21'
    text: |-
      Een in [artikel 20, tweede lid][ref1], bedoelde correctie wordt, indien de correctie strekt tot verhoging van de
      bekostiging, binnen acht weken na de mededeling, bedoeld in artikel 20, tweede lid, door Onze Minister betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0029598#Artikel20
    url: https://wetten.overheid.nl/BWBR0029598/2021-10-01#Artikel21
