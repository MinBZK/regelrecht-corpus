  - number: '12'
    text: |-
      1 Het Rijk verstrekt de bekostiging, bedoeld in [artikel 152 van de wet][ref1], met ingang van de eerste schooldag
      van een school waarvan het bekostigd onderwijs op grond van [afdeling I van titel III van de wet][ref2] een aanvang
      neemt.

      2 Onze Minister kan op verzoek van het bevoegd gezag een door hem te bepalen deel van de bekostiging,
      bedoeld in [artikel 152 van de wet][ref3], verstrekken gedurende een periode van ten hoogste vier
      maanden voorafgaand aan de eerste schooldag van een school waarvan het bekostigd onderwijs op grond van
      [afdeling I van titel III van de wet][ref4] een aanvang neemt.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel152
