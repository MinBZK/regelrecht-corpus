preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Onderwijs, Cultuur en Wetenschap van 21 september 2010, nr. WJZ/236436
    (3838), directie Wetgeving en Juridische Zaken, gedaan in overeenstemming met Onze Minister van Landbouw, Natuur en
    Voedselkwaliteit en mede namens de Staatssecretaris van Binnenlandse Zaken en Koninkrijksrelaties;

    Gelet op de artikelen 62, 64, 65, 168, 171, 187, 188, 190 en 209 van de Wet voortgezet onderwijs BES;

    De Afdeling advisering van de Raad van State gehoord (advies van 21 oktober 2010, no. W05.10.0456/I);

    Gezien het nader rapport van Onze Minister van Onderwijs, Cultuur en Wetenschap van 31 januari 2011, nr. WJZ
    256314 (3838), directie Wetgeving en Juridische Zaken, uitgebracht mede namens Onze Minister van Economische Zaken,
    Landbouw en Innovatie en Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0029598/2021-10-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

        - *aanvullende bekostiging:* aanvullende bekostiging als bedoeld in [artikel 155][ref1] of
      [artikel 157 van de wet][ref2];
        - *bevoegd gezag:* voor wat betreft: a. een openbare school: 1°. het bestuurscollege van het betreffende openbaar
      lichaam, voor zover de raad niet anders bepaalt, en, indien de raad dit besluit, met inachtneming van door hem te
      stellen regelen; 2°. de openbare rechtspersoon, bedoeld in [artikel 97 van de wet][ref3]; dan wel 3°. de stichting,
      bedoeld in [artikel 98][ref4] of artikel [109 van de wet][ref5]; b. een bijzondere school: de rechtspersoon,
      bedoeld in [artikel 105, eerste lid van de wet][ref6];
        - *bijzondere school:* een door een natuurlijke persoon of door een privaatrechtelijke rechtspersoon, niet zijnde
      een stichting als bedoeld in [artikel 98 van de wet][ref7], in stand gehouden school;
        - *CAPE:* Caribbean Advanced Proficiency Examination als bedoeld in
      [artikel 1 van het Besluit Saba Comprehensive School en Gwendoline van Puttenschool BES][ref8];
        - *CCSLC:* Caribbean Certificate of Secondary Level Competence als bedoeld in
      [artikel 1 van het Besluit Saba Comprehensive School en Gwendoline van Puttenschool BES][ref9];
        - *CSEC:* Caribbean Secondary Education Certificate als bedoeld in
      [artikel 1 van het Besluit Saba Comprehensive School en Gwendoline van Puttenschool BES][ref10];
        - *CVQ:* Caribbean Vocational Qualification als bedoeld in
      [artikel 1 van het Besluit Saba Comprehensive School en Gwendoline van Puttenschool BES][ref11];
        - *deskundige:* deskundige als bedoeld in [artikel 121, zesde lid, van Boek 2 van het Burgerlijk Wetboek BES][ref12];
        - *eerste schooldag:* 1 augustus of de dag waarop het onderwijs aan de school in enig schooljaar is aangevangen;
        - *havo:* hoger algemeen voortgezet onderwijs als bedoeld in [artikel 14 van de wet][ref13];
        - *ISK-leerlingen:* leerlingen in een internationale schakelklas op scholen op Bonaire;
        - *lower forms:* de eerste drie leerjaren van het voortgezet onderwijs aan scholen op Sint Eustatius en Saba, dat
      wordt ingevuld met CCSLC, eventueel aangevuld met vakken van CSEC en CVQ;
        - *mavo:* middelbaar algemeen voortgezet onderwijs als bedoeld in [artikel 15 van de wet][ref14];
        - *Onze Minister:* Onze Minister van Onderwijs, Cultuur en Wetenschap;
        - *openbaar lichaam:* openbaar lichaam Bonaire, Sint Eustatius of Saba;
        - *ouders:* ouders, voogden of verzorgers;
        - *praktijkonderwijs:* praktijkonderwijs als bedoeld in [artikel 31 van de wet][ref15];
        - *school:* een school voor voortgezet onderwijs, tenzij het tegendeel blijkt;
        - *schooljaar:* tijdvak van 1 augustus van enig kalenderjaar tot en met 31 juli daaraanvolgend;
        - *teldatum:* datum van 1 oktober, bedoeld in [artikel 154 van de wet][ref16];
        - *vbo:* voorbereidend beroepsonderwijs als bedoeld in [artikel 17 van de wet][ref17];
        - *vwo:* voorbereidend wetenschappelijk onderwijs als bedoeld in [artikel 13 van de wet][ref18];
        - *wet:* [Wet voortgezet onderwijs BES][ref19].


