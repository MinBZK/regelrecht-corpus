  - number: '11'
    text: |-
      1 Onze Minister stelt jaarlijks voor elke school of scholengemeenschap de hoogte van de bekostiging, bedoeld in
      [artikel 9][ref1] en in de [artikelen 155][ref2] en [156 van de wet][ref3] vast.

      2 Het Rijk betaalt elke maand van het kalenderjaar aan het bevoegd gezag van een school een gedeelte van de
      bekostiging, bedoeld in [artikel 9][ref4], waarop het over dat jaar recht heeft.

      3 De aanvullende bekostiging, bedoeld in de [artikelen 155][ref5] en [156 van de wet][ref6], wordt in een keer
      betaald, dan wel wordt betaald volgens een bij ministeriële regeling te bepalen betaalritme.


