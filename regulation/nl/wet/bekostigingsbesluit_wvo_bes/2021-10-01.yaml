  - number: '14'
    text: |-
      1 Ten behoeve van de vaststelling van de bekostiging, bedoeld in [artikel 9][ref1], doet het bevoegd gezag
      aan Onze Minister de gegevens over het aantal leerlingen op de teldatum dat bij de vaststelling van de
      bekostiging voor het daarop volgende kalenderjaar in aanmerking wordt genomen, toekomen overeenkomstig het
      [Besluit informatievoorziening WVO BES][ref2]

      2 Het bevoegd gezag dient jaarlijks voor 1 juli bij Onze Minister voor het daaropvolgende schooljaar in:

      a. een verklaring van het bevoegd gezag omtrent de juistheid van de gegevens, bedoeld in het eerste lid, of

      b. indien de onder a bedoelde gegevens naar het oordeel van het bevoegd gezag onjuist zijn, de door het bevoegd
      gezag gecorrigeerde gegevens, alsmede

      c. een verklaring van een deskundige omtrent de juistheid van de gegevens, bedoeld in onderdeel a of onderdeel b.

      3 Bij ministeriële regeling kan een model voor de in het tweede lid, onder a en c, bedoelde verklaringen worden
      vastgesteld. Onze Minister kan een leidraad vaststellen ten behoeve van de controle door de deskundige, bedoeld in
      het tweede lid, onder c.

      4 Indien voor 1 juli in enig jaar aanvullende bekostiging is vastgesteld, dient het bevoegd gezag voor die
      datum bij Onze Minister een verklaring in omtrent de juistheid van de in voorkomende gevallen met het oog op de
      vaststelling van de aanvullende bekostiging aan Onze Minister gemelde gegevens. Het tweede lid, onder b en c, en
      het derde lid, zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0029598#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0029594
    url: https://wetten.overheid.nl/BWBR0029598/2021-10-01#Artikel14
