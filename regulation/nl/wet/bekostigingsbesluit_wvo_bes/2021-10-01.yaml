  - number: '22'
    text: |-
      Bij samenvoeging van scholen of afsplitsing van een of meer scholen van een scholengemeenschap als bedoeld in
      [artikel 124, tweede lid, van de wet][ref1], op 1 augustus van enig kalenderjaar worden:

      a. de bekostiging op grond van [artikel 152 van de wet][ref2] en

      b. de aanvullende bekostiging op grond van de [artikelen 155][ref3] of [156 van de wet][ref4], van alle bij de
      samenvoeging betrokken scholen dan wel van de bij de afsplitsing betrokken scholengemeenschap gehandhaafd tot het
      einde van dat kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel124
