preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de Woningwet zodanig te wijzigen dat het zonder
    bouwvergunning mogen bouwen van bouwwerken in een beschermd stads- of dorpsgezicht wordt beperkt, en dat voorts
    enige juridische verbeteringen in die wet en in de Wet op de openluchtrecreatie worden aangebracht;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0009918/1999-01-01#ArtikelAanhef
articles:
  - number: III
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0009918/1999-01-01#ArtikelIII
  - number: IV
    text: |-
      1 Een aanzegging tot bestuursdwang ten aanzien van een bouwwerk als bedoeld in artikel 43, eerste lid, dat
      vóór de inwerkingtreding van deze wet is gebouwd in een beschermd stads- of dorpsgezicht als bedoeld in de
      [Monumentenwet 1988][ref1], alsmede enig bezwaar of beroep tegen het bouwen van zodanig bouwwerk of tegen de
      aanzegging tot bestuursdwang ten aanzien van zodanig bouwwerk worden afgedaan overeenkomstig de voorschriften,
      zoals die golden vóór de inwerkingtreding van deze wet.

      2 Bouwwerken als bedoeld in artikel 43, eerste lid, die vóór de inwerkingtreding van deze wet tot stand zijn
      gekomen in een beschermd stads- of dorpsgezicht als bedoeld in de [Monumentenwet 1988][ref2], zijn bouwwerken die
      zijn gebouwd overeenkomstig artikel 42.

      3 Indien voor het bouwen van een bouwwerk als bedoeld in [artikel 43, eerste lid, van de Woningwet,][ref3] zoals
      gewijzigd bij artikel I, onderdeel B, van deze wet, in een gebied dat geen beschermd stads- of dorpsgezicht
      is als bedoeld in de [Monumentenwet 1988][ref4], een aanvraag om bouwvergunning is ingediend, een aanzegging
      tot bestuursdwang is uitgevaardigd of tegen enig besluit ten aanzien van zodanig bouwwerk bezwaar of beroep is
      ingesteld, zijn van rechtswege ingetrokken.


