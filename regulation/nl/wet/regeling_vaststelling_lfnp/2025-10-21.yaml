---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: regeling_vaststelling_lfnp
regulatory_layer: WET
publication_date: '2024-04-10'
valid_from: '2025-10-21'
bwb_id: BWBR0033460
url: https://wetten.overheid.nl/BWBR0033460/2025-10-21
preamble:
  text: |-
    Gelet op artikel 6, tweede lid, van het Besluit bezoldiging politie;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0033460/2025-10-21#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze regeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0033460/2025-10-21#Artikel1
  - number: 1.a
    text: |-
      *ambtenaar:* ambtenaar als bedoeld in [artikel 1, eerste lid, van het Besluit algemene rechtspositie politie][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel1
    url: https://wetten.overheid.nl/BWBR0033460/2025-10-21#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '1'
  - number: 1.b
    text: |-
      *barema:* de som van de scores per niveau-indicator of specifiek waarderingsinstrument die na conversie is
      verkregen met toepassing van het waarderingsinstrument Fuwa-Pol LFNP;
    url: https://wetten.overheid.nl/BWBR0033460/2025-10-21#Artikel1
  - number: 1.c
    text: |-
      *bevoegd gezag:* bevoegd gezag als bedoeld in
      [artikel 1, eerste lid, van het Besluit algemene rechtspositie politie][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel1
    url: https://wetten.overheid.nl/BWBR0033460/2025-10-21#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '1'
  - number: 1.d
    text: |-
      *functie:* functie als bedoeld in [artikel 1, eerste lid, van het Besluit bezoldiging politie][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel1
    url: https://wetten.overheid.nl/BWBR0033460/2025-10-21#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006517
        artikel: '1'
  - number: 1.e
    text: '*functiebeschrijving:* de omschrijving van de ambtenaar opgedragen functie;'
    url: https://wetten.overheid.nl/BWBR0033460/2025-10-21#Artikel1
  - number: 1.f
    text: |-
      *het LFNP:* het Landelijk Functiegebouw Nederlandse Politie, bedoeld in
      [artikel 1, eerste lid, van het Besluit bezoldiging politie][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel1
    url: https://wetten.overheid.nl/BWBR0033460/2025-10-21#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006517
        artikel: '1'
  - number: 1.g
    text: '*de Minister:* de Minister van Justitie en Veiligheid.'
    url: https://wetten.overheid.nl/BWBR0033460/2025-10-21#Artikel1
  - number: '2'
    text: |-
      Het bevoegd gezag kan de Minister een voorstel doen tot wijziging van de bij de regeling behorende
      bijlagen. De Minister geeft ten behoeve hiervan de korpschef een aanwijzing als bedoeld in
      [artikel 31 van de Politiewet 2012][ref1] met het oog op het verplichte gebruik van het door hem aangewezen systeem
      om functies te beschrijven respectievelijk te waarderen.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel31
    url: https://wetten.overheid.nl/BWBR0033460/2025-10-21#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '31'
  - number: 2a.1
    text: |-
      Het bevoegd gezag kan tijdelijk aanvullende werkzaamheden opdragen aan de ambtenaar die geplaatst is in de Eenheid
      landelijke expertise en operaties of de Eenheid landelijke opsporing en interventies. Deze werkzaamheden kunnen
      bestaan uit:
    url: https://wetten.overheid.nl/BWBR0033460/2025-10-21#Artikel2a
  - number: 2a.1.a
    text: het aansturen van een groep aangewezen ambtenaren; en
    url: https://wetten.overheid.nl/BWBR0033460/2025-10-21#Artikel2a
  - number: 2a.1.b
    text: het dragen van de verantwoordelijkheid voor de personele zorg.
    url: https://wetten.overheid.nl/BWBR0033460/2025-10-21#Artikel2a
  - number: 2a.2
    text: |-
      Het bevoegd gezag kan aan de ambtenaar, bedoeld in het eerste lid, eerste zin, de werktitel van Operationeel Chef
      toekennen.
    url: https://wetten.overheid.nl/BWBR0033460/2025-10-21#Artikel2a
  - number: 2a.3
    text: |-
      Ten behoeve van het uitoefenen van de werkzaamheden, bedoeld in het eerste lid, onder b, kan de ambtenaar, bedoeld
      in het eerste lid, eerste zin, de volgende werkzaamheden uitvoeren:
    url: https://wetten.overheid.nl/BWBR0033460/2025-10-21#Artikel2a
  - number: 2a.3.a
    text: het toekennen of afwijzen van verlof;
    url: https://wetten.overheid.nl/BWBR0033460/2025-10-21#Artikel2a
  - number: 2a.3.b
    text: het accorderen of afwijzen van declaraties en reiskosten;
    url: https://wetten.overheid.nl/BWBR0033460/2025-10-21#Artikel2a
  - number: 2a.3.c
    text: het doen van ziekmeldingen;
    url: https://wetten.overheid.nl/BWBR0033460/2025-10-21#Artikel2a
  - number: 2a.3.d
    text: het fiatteren of afkeuren van uren;
    url: https://wetten.overheid.nl/BWBR0033460/2025-10-21#Artikel2a
  - number: 2a.3.e
    text: het verlenen van autorisaties;
    url: https://wetten.overheid.nl/BWBR0033460/2025-10-21#Artikel2a
  - number: 2a.3.f
    text: het vaststellen van het functioneringsverslag voor de aan hen toegewezen medewerkers; en
    url: https://wetten.overheid.nl/BWBR0033460/2025-10-21#Artikel2a
  - number: 2a.3.g
    text: het vaststellen van voorgenomen beoordelingen, re-integratieplannen en ontwikkelplannen.
    url: https://wetten.overheid.nl/BWBR0033460/2025-10-21#Artikel2a
  - number: '3.1'
    text: |-
      De aanduiding van de functies, onderverdeeld naar de domeinen leiding, uitvoering en ondersteuning en
      naar vakgebieden, met de daaraan gekoppelde barema’s zijn opgenomen in de bij deze regeling behorende
      [bijlage 1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0033460
    url: https://wetten.overheid.nl/BWBR0033460/2025-10-21#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0033460
  - number: '3.2'
    text: |-
      De koppeling van de functies, van punten naar barema’s, aan de salarisschalen is opgenomen in de bij deze regeling
      behorende [bijlage 2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0033460
    url: https://wetten.overheid.nl/BWBR0033460/2025-10-21#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0033460
  - number: '3.3'
    text: |-
      De bij de functies behorende functiebeschrijvingen zijn opgenomen in de bij deze regeling behorende
      [bijlage 3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0033460
    url: https://wetten.overheid.nl/BWBR0033460/2025-10-21#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0033460
  - number: '3.4'
    text: |-
      De aan de functiebeschrijvingen te koppelen werkterreinen, aandachtsgebieden en specifieke functionaliteiten zijn
      opgenomen in de bij deze regeling behorende [bijlage 4][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0033460
    url: https://wetten.overheid.nl/BWBR0033460/2025-10-21#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0033460
  - number: '3.5'
    text: |-
      De aan de functiebeschrijvingen te koppelen werktitels zijn opgenomen in de bij deze regeling behorende
      [bijlage 5][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0033460
    url: https://wetten.overheid.nl/BWBR0033460/2025-10-21#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0033460
  - number: 3a.1
    text: |-
      De ambtenaar van politie die is aangesteld voor de uitvoering van de politietaak die enkel een krachtens
      [artikel 2c, tweede lid, van het Besluit algemene rechtspositie politie][ref1] aangewezen politieopleiding heeft
      gevolgd, kan enkel worden geplaatst in een functie in het vakgebied Intelligence, Forensische Opsporing, met
      uitzondering van het werkterrein Speurhondengeleiding, Tactische Opsporing, met uitzondering van de functies
      van Senior Tactische Opsporing en Operationeel Expert Tactische Opsporing, of Operationeel Specialismen, zoals
      opgenomen in [bijlage 1][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel2c
      [ref2]: https://wetten.overheid.nl/BWBR0033460
    url: https://wetten.overheid.nl/BWBR0033460/2025-10-21#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: 2c
      - id: ref2
        bwb_id: BWBR0033460
  - number: 3a.2
    text: |-
      De ambtenaar, bedoeld in het eerste lid, die is geplaatst in een functie als bedoeld in het eerste lid is niet
      bewapend.
    url: https://wetten.overheid.nl/BWBR0033460/2025-10-21#Artikel3a
  - number: 3a.3
    text: |-
      De ambtenaar in opleiding, bedoeld in [artikel 1, eerste lid, van het Besluit algemene rechtspositie politie][ref1],
      die na het voltooien van een krachtens [artikel 2c, tweede lid, van dat Besluit][ref2] aangewezen politieopleiding
      wordt geplaatst in een functie als bedoeld in het eerste lid, is niet bewapend.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0006516#Artikel2c
    url: https://wetten.overheid.nl/BWBR0033460/2025-10-21#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0006516
        artikel: 2c
  - number: 3b
    text: |-
      De volgende activiteiten uit de in [bijlage 3][ref1] opgenomen functiebeschrijvingen van de
      functies in de vakgebieden Operationeel Specialismen en Tactische Opsporing zijn voorbehouden aan de
      ambtenaar van politie die is aangesteld voor de uitvoering van de politietaak en die een krachtens
      [artikel 2c, eerste lid, van het Besluit algemene rechtspositie politie][ref2] aangewezen politieopleiding heeft
      voltooid:


      [ref1]: https://wetten.overheid.nl/BWBR0033460
      [ref2]: https://wetten.overheid.nl/BWBR0006516#Artikel2c
    url: https://wetten.overheid.nl/BWBR0033460/2025-10-21#Artikel3b
    references:
      - id: ref1
        bwb_id: BWBR0033460
      - id: ref2
        bwb_id: BWBR0006516
        artikel: 2c
  - number: 3b.a
    text: de toepassing van dwangmiddelen in vooraf voorzienbare gevaarzettende situaties, en
    url: https://wetten.overheid.nl/BWBR0033460/2025-10-21#Artikel3b
  - number: 3b.b
    text: het voeren van functioneringsgesprekken in verband met organisatorische coördinatie.
    url: https://wetten.overheid.nl/BWBR0033460/2025-10-21#Artikel3b
  - number: '4.1'
    text: |-
      In het kader van het vaststellen van passende arbeid als bedoeld in
      [artikel 49b, eerste lid, van het Besluit algemene rechtspositie politie][ref1], stelt het bevoegd gezag zo nodig
      een functie samen uit een of meerdere functies opgenomen in de bij deze regeling behorende [bijlage 3][ref2]. Bij
      het samenstellen van deze functie wordt rekening gehouden met de resterende verdiencapaciteit van de desbetreffende
      ambtenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel49b
      [ref2]: https://wetten.overheid.nl/BWBR0033460
    url: https://wetten.overheid.nl/BWBR0033460/2025-10-21#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: 49b
      - id: ref2
        bwb_id: BWBR0033460
  - number: '4.2'
    text: |-
      Aan deze samengestelde functie wordt door het bevoegd gezag met inachtneming van [artikel 2, tweede volzin][ref1],
      een salaris gekoppeld.


      [ref1]: https://wetten.overheid.nl/BWBR0033460#Artikel2
    url: https://wetten.overheid.nl/BWBR0033460/2025-10-21#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0033460
        artikel: '2'
  - number: 4a
    text: |-
      Deze regeling berust op de [artikelen 1, eerste lid][ref1], voor zover het de definitie van
      LFNP betreft, en [2c, tweede lid, van het Besluit algemene rechtspositie politie][ref2],
      [artikel 20a van het Besluit bewapening en uitrusting politie][ref3] en de [artikelen 1, eerste lid][ref4], voor
      zover het de definitie van LFNP betreft, en [6, tweede lid, van het Besluit bezoldiging politie][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0006516#Artikel2c
      [ref3]: https://wetten.overheid.nl/BWBR0032136#Artikel20a
      [ref4]: https://wetten.overheid.nl/BWBR0006517#Artikel1
      [ref5]: https://wetten.overheid.nl/BWBR0006517#Artikel6
    url: https://wetten.overheid.nl/BWBR0033460/2025-10-21#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0006516
        artikel: 2c
      - id: ref3
        bwb_id: BWBR0032136
        artikel: 20a
      - id: ref4
        bwb_id: BWBR0006517
        artikel: '1'
      - id: ref5
        bwb_id: BWBR0006517
        artikel: '6'
  - number: '5'
    text: |-
      Deze regeling treedt in werking met ingang van de dag na de datum van uitgifte van de Staatscourant waarin zij
      wordt geplaatst en werkt terug tot en met 1 januari 2010.
    url: https://wetten.overheid.nl/BWBR0033460/2025-10-21#Artikel5
  - number: '6'
    text: 'Deze regeling wordt aangehaald als: Regeling vaststelling LFNP.'
    url: https://wetten.overheid.nl/BWBR0033460/2025-10-21#Artikel6
