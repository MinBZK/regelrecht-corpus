  - number: '2'
    text: |-
      Het bevoegd gezag kan de Minister een voorstel doen tot wijziging van de bij de regeling behorende
      bijlagen. De Minister geeft ten behoeve hiervan de korpschef een aanwijzing als bedoeld in
      [artikel 31 van de Politiewet 2012][ref1] met het oog op het verplichte gebruik van het door hem aangewezen systeem
      om functies te beschrijven respectievelijk te waarderen.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel31
    url: https://wetten.overheid.nl/BWBR0033460/2024-08-15#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '31'
  - number: 2a
    text: |-
      1 Het bevoegd gezag kan tijdelijk aanvullende werkzaamheden opdragen aan de ambtenaar die geplaatst is in de
      Eenheid landelijke expertise en operaties of de Eenheid landelijke opsporing en interventies. Deze werkzaamheden
      kunnen bestaan uit:

      a. het aansturen van een groep aangewezen ambtenaren; en

      b. het dragen van de verantwoordelijkheid voor de personele zorg.

      2 Het bevoegd gezag kan aan de ambtenaar, bedoeld in het eerste lid, eerste zin, de werktitel van Operationeel
      Chef toekennen.

      3 Ten behoeve van het uitoefenen van de werkzaamheden, bedoeld in het eerste lid, onder b, kan de ambtenaar,
      bedoeld in het eerste lid, eerste zin, de volgende werkzaamheden uitvoeren:

      a. het toekennen of afwijzen van verlof;

      b. het accorderen of afwijzen van declaraties en reiskosten;

      c. het doen van ziekmeldingen;

      d. het fiatteren of afkeuren van uren;

      e. het verlenen van autorisaties;

      f. het vaststellen van het functioneringsverslag voor de aan hen toegewezen medewerkers; en

      g. het vaststellen van voorgenomen beoordelingen, re-integratieplannen en ontwikkelplannen.
    url: https://wetten.overheid.nl/BWBR0033460/2024-08-15#Artikel2a
  - number: '3'
    text: |-
      1 De aanduiding van de functies, onderverdeeld naar de domeinen leiding, uitvoering en ondersteuning en
      naar vakgebieden, met de daaraan gekoppelde barema’s zijn opgenomen in de bij deze regeling behorende
      [bijlage 1][ref1].

      2 De koppeling van de functies, van punten naar barema’s, aan de salarisschalen is opgenomen in de bij deze
      regeling behorende [bijlage 2][ref2].

      3 De bij de functies behorende functiebeschrijvingen zijn opgenomen in de bij deze regeling behorende
      [bijlage 3][ref3].

      4 De aan de functiebeschrijvingen te koppelen werkterreinen, aandachtsgebieden en specifieke functionaliteiten zijn
      opgenomen in de bij deze regeling behorende [bijlage 4][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0033460
      [ref2]: https://wetten.overheid.nl/BWBR0033460
