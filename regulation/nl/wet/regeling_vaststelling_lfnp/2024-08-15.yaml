  - number: 3b
    text: |-
      De volgende activiteiten uit de in [bijlage 3][ref1] opgenomen functiebeschrijvingen van
      de functies in het vakgebied Operationeel Specialismen zijn voorbehouden aan de ambtenaar
      van politie die is aangesteld voor de uitvoering van de politietaak en die een krachtens
      [artikel 2c, eerste lid, van het Besluit algemene rechtspositie politie][ref2] aangewezen politieopleiding heeft
      voltooid:

      a. de toepassing van dwangmiddelen in vooraf voorzienbare gevaarzettende situaties, en

      b. het voeren van functioneringsgesprekken in verband met organisatorische coördinatie.


      [ref1]: https://wetten.overheid.nl/BWBR0033460
      [ref2]: https://wetten.overheid.nl/BWBR0006516#Artikel2c
