  - number: 3a
    text: |-
      1 De ambtenaar van politie die is aangesteld voor de uitvoering van de politietaak die enkel een krachtens
      [artikel 2c, tweede lid, van het Besluit algemene rechtspositie politie][ref1] aangewezen politieopleiding
      heeft gevolgd, kan enkel worden geplaatst in een functie in het vakgebied Intelligence, Forensische Opsporing,
      met uitzondering van het werkterrein Speurhondengeleiding, of Operationeel Specialismen, zoals opgenomen in
      [bijlage 1][ref2].

      2 De ambtenaar, bedoeld in het eerste lid, die is geplaatst in een functie als bedoeld in het eerste lid is niet
      bewapend.

      3 De ambtenaar in opleiding, bedoeld in
      [artikel 1, onderdeel c, van het Besluit algemene rechtspositie politie][ref3], die na het voltooien van een
      krachtens [artikel 2c, tweede lid, van dat Besluit][ref4] aangewezen politieopleiding wordt geplaatst in een
      functie als bedoeld in het eerste lid, is niet bewapend.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel2c
      [ref2]: https://wetten.overheid.nl/BWBR0033460
      [ref3]: https://wetten.overheid.nl/BWBR0006516#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0006516#Artikel2c
