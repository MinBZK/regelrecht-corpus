articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. *ambtenaar:* ambtenaar als bedoeld in
      [artikel 1, eerste lid, onderdeel i, van het Besluit algemene rechtspositie politie][ref1];

      b. *barema:* de som van de scores per niveau-indicator of specifiek waarderingsinstrument die na conversie is
      verkregen met toepassing van het waarderingsinstrument Fuwa-Pol LFNP;

      c. *bevoegd gezag:* bevoegd gezag als bedoeld in
      [artikel 1, eerste lid, onderdeel l, van het Besluit algemene rechtspositie politie][ref2];

      d. *functie:* functie als bedoeld in [artikel 1, eerste lid, onderdeel r, van het Besluit bezoldiging politie][ref3];

      e. *functiebeschrijving:* de omschrijving van de ambtenaar opgedragen functie;

      f. *het LFNP:* het Landelijk Functiegebouw Nederlandse Politie, bedoeld in
      [artikel 1, eerste lid, onderdeel vv, van het Besluit bezoldiging politie][ref4];

      g. *de Minister:* de Minister van Justitie en Veiligheid.


