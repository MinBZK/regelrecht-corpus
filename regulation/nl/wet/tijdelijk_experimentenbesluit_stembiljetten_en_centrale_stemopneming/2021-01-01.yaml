        artikel: E_4
  - number: 20a
    text: |-
      1 Bij de gecombineerde stemming voor de verkiezing van de leden van provinciale staten en de leden van een algemeen
      bestuur, bedoeld in [artikel A 1 van de Kieswet][ref1], stelt het college van burgemeester en wethouders een
      gemeentelijk stembureau voor de verkiezing van de leden van provinciale staten en een gemeentelijk stembureau voor
      de verkiezing van de leden van dat algemeen bestuur in.

      2 Indien een gemeente in het gebied van twee of meer waterschappen ligt, stelt het college van burgemeester en
      wethouders één of meer gemeentelijke stembureaus in die de stemopneming verrichten voor de verkiezing van één of
      meer waterschappen.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelA_1
    url: https://wetten.overheid.nl/BWBR0033989/2021-01-01#Artikel20a
    references:
