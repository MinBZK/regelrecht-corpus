        artikel: J_20
  - number: '13'
    text: |-
      1 Op het stembiljet en het overzicht van de kandidatenlijsten wordt het logo van een politieke groepering
      geplaatst, indien:

      a. dat logo is geregistreerd bij het centraal stembureau; en

      b. op het stembiljet en het overzicht van de kandidatenlijsten de aanduiding van die groepering wordt geplaatst.

      2 De logo’s van twee of meer politieke groeperingen worden gezamenlijk geplaatst, indien:

      a. die logo’s zijn geregistreerd bij het centraal stembureau; en

      b. op het stembiljet en het overzicht van de kandidatenlijsten een aanduiding staat, gevormd door samenvoeging van
      geregistreerde aanduidingen of afkortingen daarvan, van die politieke groeperingen.

      3 Indien op het stembiljet en het overzicht van de kandidatenlijsten een aanduiding staat, gevormd door
      samenvoeging van geregistreerde aanduidingen of afkortingen van twee of meer politieke groeperingen, en niet
      van al deze politieke groeperingen een logo is geregistreerd bij het centraal stembureau, wordt geen logo op het
      stembiljet en het overzicht van de kandidatenlijsten geplaatst.
    url: https://wetten.overheid.nl/BWBR0033989/2021-01-01#Artikel13
  - number: '14'
    text: |-
      1 Indien Onze Minister het stembiljet, bedoeld in [artikel 12, eerste lid, onder a][ref1], vaststelt, stemt de
      kiezer, in afwijking van [artikel M 7, eerste lid, van de Kieswet][ref2], door op het stembiljet:

      1°. een wit stipje, geplaatst vóór de lijst waartoe de kandidaat van zijn keuze behoort, rood, blauw, zwart of
      groen te maken; en vervolgens

      2°. een wit stipje, geplaatst vóór het kandidaatsnummer van de kandidaat van zijn keuze, rood, blauw, zwart of
      groen te maken.

      2 Indien Onze Minister het stembiljet, bedoeld in [artikel 12, eerste lid, onder b][ref3], vaststelt, stemt de
      kiezer, in afwijking van [artikel M 7, eerste lid, van de Kieswet][ref4], door op het stembiljet:

      1°. een wit stipje, geplaatst vóór de lijst waartoe de kandidaat van zijn keuze behoort, rood, blauw, zwart of
      groen te maken; en vervolgens

      2°. Het kandidaatsnummer van de kandidaat van zijn keuze te noteren in de daarvoor bestemde ruimte.


