  - number: '12'
    text: |-
      1 Onze Minister stelt voor een verkiezing een van de volgende stembiljetten vast:

      a. een stembiljet, op basis waarvan de kiezer stemt door op het stembiljet eerst de lijst te kiezen waartoe de
      kandidaat van zijn keuze behoort, en vervolgens het kandidaatsnummer van de kandidaat van zijn keuze te kiezen;

      b. een stembiljet, op basis waarvan de kiezer stemt door op het stembiljet eerst de lijst te kiezen waartoe de
      kandidaat van zijn keuze behoort, en vervolgens het kandidaatsnummer van de kandidaat van zijn keuze te noteren.

      2 [Artikel J 20, eerste lid, tweede zin, van de Kieswet][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelJ_20
