  - number: '44'
    text: |-
      Nadat is beslist over de toelating van de gekozenen, zijn burgemeester en wethouders bevoegd de pakken, bedoeld in
      de [artikelen N 2 van de Kieswet][ref1] of de [artikelen 34, derde lid][ref2], of [36, tweede lid][ref3], die niet
      naar het centraal stembureau of het vertegenwoordigend orgaan zijn overgebracht, te openen en deze pakken, alsmede
      de processen-verbaal van de stembureaus die niet naar het centraal stembureau of het vertegenwoordigend orgaan zijn
      overgebracht, over te dragen aan de officier van justitie ten dienste van een onderzoek naar enig strafbaar feit.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelN_2
