  - number: '17'
    text: |-
      1 Onder verantwoordelijkheid van Onze Minister vindt een evaluatie plaats van ieder experiment afzonderlijk.

      2 De evaluatie heeft tot doel inzicht te verkrijgen in de mate waarin het experiment heeft voldaan aan de volgende
      criteria:

      a. het stemmen met het nieuwe stembiljet en de mogelijkheid om het stembiljet per e-mail te ontvangen heeft voor
      de kiezer een meerwaarde boven het stemmen met het huidige stembiljet en het ontvangen van het stembiljet per post,
      gelet op onder andere:

        - de snelheid waarmee de kiezer de stembescheiden ontvangt;
        - de tijd die de kiezer heeft om zijn stem uit te brengen;
        - de effecten op de stemopneming;
        - het aantal ongeldige stemmen en de redenen daarvan;
        - de mate van voorlichting en ondersteuning en het gebruik daarvan door kiezers.

      b. de organisatorische consequenties en de financiële en administratieve lasten voor de uitvoerende instanties
      staan in verhouding tot de meerwaarde die het nieuwe stembiljet voor de kiezer in het buitenland heeft.

      3 Het evaluatierapport beschrijft ten minste:

      a. de ervaringen van kiezers, stembureauleden en de uitvoerende instanties bij het experiment;

      b. de kosten van het experiment;

      c. de organisatorische consequenties en de financiële en administratieve lasten bij het experiment.

      d. de conclusies omtrent de voortzetting van de experimenten, dan wel de invoering van de voorzieningen waarmee
      is geëxperimenteerd.
    url: https://wetten.overheid.nl/BWBR0033989/2021-01-01#Artikel17
  - number: '18'
    text: |-
      1 Burgemeester en wethouders van ’s-Gravenhage verstrekken zo spoedig mogelijk aan Onze Minister:

      a. de gegevens uit het bestand, bedoeld in de [artikel D 3c, eerste lid][ref1], en [artikel Y 2][ref2], juncto
      [artikel D 3c, eerste lid, van de Kieswet][ref3], ten behoeve van de voorlichting over het experiment;

      b. de gegevens van de kiezers die zich bij burgemeester en wethouders van ’s-Gravenhage hebben geregistreerd,
      ten behoeve van de evaluatie van het experiment en, indien van toepassing, voor het elektronisch verzenden van de
      stembiljetten en het beschikbaar stellen van de kandidatenlijsten.

      2 Bij ministeriële regeling kunnen nadere regels worden gesteld over het elektronisch verzenden van het stembiljet
      en het vervangend briefstembewijs, de registratie van logo’s, het beschikbaar stellen van een overzicht van de
      kandidatenlijsten, het briefstembewijs, het vervangend briefstembewijs, het register van briefstembewijzen alsmede
      de uittreksels, bedoeld in [artikel 8, derde lid][ref4], de werkwijze van het briefstembureau en de evaluatie van
      het experiment.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelD_3c
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelY_2
      [ref3]: https://wetten.overheid.nl/BWBR0004627#ArtikelD_3c
      [ref4]: https://wetten.overheid.nl/BWBR0033989#Artikel8
