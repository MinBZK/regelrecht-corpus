  - number: 10a
    text: |-
      In [artikel M 7, derde en vijfde lid, van de Kieswet][ref1] wordt in plaats van «het briefstembewijs» telkens
      gelezen: het briefstembewijs dan wel het vervangend briefstembewijs.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelM_7
    url: https://wetten.overheid.nl/BWBR0033989/2021-01-01#Artikel10a
    references:
