  - number: '15'
    text: |-
      1 Indien Onze Minister het stembiljet, bedoeld in [artikel 12, eerste lid, onder a][ref1], vaststelt, wordt in
      afwijking van [artikel N 16, derde en vierde lid, van de Kieswet][ref2], de geldigheid en de betekenis van een stem
      vastgesteld op basis van de volgende leden.

      2 Een stem is geldig die op een kandidaat of blanco is uitgebracht met een stembiljet dat bij of krachtens de
      [Experimentenwet][ref3] mag worden gebruikt en waarop geen bijvoegingen zijn geplaatst waardoor de kiezer kan
      worden geïdentificeerd.

      3 Een stem is op een kandidaat uitgebracht indien dat op ondubbelzinnige wijze is kenbaar gemaakt door het
      geheel of gedeeltelijk rood, blauw, zwart of groen maken van het witte stipje, geplaatst vóór de lijst waartoe de
      kandidaat behoort, en vóór het kandidaatsnummer van de kandidaat.

      4 Onverminderd het derde lid is een stem uitgebracht op de eerste kandidaat van een lijst indien:

        - de kiezer op ondubbelzinnige wijze kenbaar maakt dat de kandidaat van zijn keuze op die lijst staat door het
      geheel of gedeeltelijk rood, blauw, zwart of groen maken van het witte stipje, geplaatst vóór de lijst waartoe de
      kandidaat behoort, en geen wit stipje, geplaatst vóór de kandidaatsnummers, geheel of gedeeltelijk rood, blauw,
      zwart of groen is gemaakt; en
        - ondubbelzinnig blijkt dat de kiezer niet met bijschrijvingen op een andere kandidaat heeft willen stemmen.

      5 Een stem is blanco uitgebracht indien dat op ondubbelzinnige wijze is kenbaar gemaakt doordat geen wit stipje
      rood, blauw, zwart of groen is gemaakt.


