  - number: '19'
    text: |-
      1 Dit hoofdstuk is van toepassing op een experiment in een gemeente die daarvoor is aangewezen krachtens
      [artikel 2, tweede lid, van de Experimentenwet][ref1].

      2 Dit hoofdstuk, met uitzondering van [artikel 39][ref2], is niet van toepassing op briefstembureaus.


      [ref1]: https://wetten.overheid.nl/BWBR0033598#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0033989#Artikel39
