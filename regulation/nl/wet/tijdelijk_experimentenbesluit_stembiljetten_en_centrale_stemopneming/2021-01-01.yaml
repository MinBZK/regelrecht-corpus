  - number: '20'
    text: |-
      1 Burgemeester en wethouders stellen een gemeentelijk stembureau in.

      2 Het gemeentelijk stembureau bestaat uit een door burgemeester en wethouders vast te stellen aantal leden, van
      wie er één voorzitter en ten minste één plaatsvervangend voorzitter is, met dien verstande dat het aantal leden ten
      minste zo veel is dat voor elke locatie van de stemopneming ten minste vijf leden beschikbaar zijn, waaronder de
      voorzitter of een plaatsvervangend voorzitter.

      3 Indien bij het nemen van een beslissing door het gemeentelijk stembureau de stemmen staken, beslist de stem van
      de voorzitter.

      4 [Artikel E 4, eerste, tweede en vierde lid, van de Kieswet][ref1] is van overeenkomstige toepassing op leden en
      plaatsvervangende leden van het gemeentelijk stembureau.

      5 In afwijking van [artikel E 4, tweede lid, van de Kieswet][ref2] kan als lid van een stembureau tevens niet
      worden benoemd degene die als lid van het gemeentelijk stembureau voor de desbetreffende verkiezing is benoemd.

      6 Het lidmaatschap van het gemeentelijk stembureau eindigt van rechtswege nadat over de toelating van de gekozenen
      is beslist.

      7 Burgemeester en wethouders wijzen voor het gemeentelijk stembureau één of meer geschikte locaties aan voor de
      stemopneming en voor de zitting tot vaststelling van de uitslag voor de gemeente.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelE_4
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelE_4
    url: https://wetten.overheid.nl/BWBR0033989/2021-01-01#Artikel20
