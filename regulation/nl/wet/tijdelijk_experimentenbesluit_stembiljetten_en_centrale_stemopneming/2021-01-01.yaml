  - number: '40'
    text: |-
      De aanwezige personen kunnen mondeling bezwaren inbrengen. De bezwaren worden in het proces-verbaal van het
      gemeentelijk stembureau vermeld.
    url: https://wetten.overheid.nl/BWBR0033989/2021-01-01#Artikel40
  - number: '41'
    text: |-
      1 Nadat alle werkzaamheden zijn beëindigd, maakt het gemeentelijk stembureau daarvan proces-verbaal op dat alle
      aanwezige leden tekenen.

      2 Bij ministeriële regeling wordt voor het proces-verbaal een model vastgesteld. In het proces-verbaal is de
      verkiezingsuitslag voor ieder stembureau herleidbaar.
    url: https://wetten.overheid.nl/BWBR0033989/2021-01-01#Artikel41
  - number: '42'
    text: |-
      1 Het gemeentelijk stembureau maakt het proces-verbaal met weglating van de ondertekening onverwijld op een
      algemeen toegankelijke wijze elektronisch openbaar.

      2 Het gemeentelijk stembureau brengt onverwijld een afschrift van zijn proces-verbaal over naar het
      vertegenwoordigend orgaan en het hoofdstembureau.

      3 Het gemeentelijk stembureau draagt het proces-verbaal, bedoeld in
      [artikel N 10, eerste lid, van de Kieswet][ref1], of de pakken, bedoeld in [artikel N 2 van de Kieswet][ref2] of de
      [artikelen 34, derde lid][ref3], of [36, tweede lid][ref4], over aan burgemeester en wethouders.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelN_10
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelN_2
      [ref3]: https://wetten.overheid.nl/BWBR0033989#Artikel34
      [ref4]: https://wetten.overheid.nl/BWBR0033989#Artikel36
