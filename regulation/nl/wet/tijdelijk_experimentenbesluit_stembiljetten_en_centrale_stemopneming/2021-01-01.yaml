        artikel: A_1
  - number: '21'
    text: |-
      1 De [artikelen J 4a, derde lid][ref1], [J 35, eerste en tweede lid][ref2], [N 1, tweede lid, van de Kieswet][ref3]
      zijn van overeenkomstige toepassing op personen die geen kiezer zijn.

      2 De [artikelen N 6][ref4], [N 8 tot en met N 9][ref5] en [N 11 tot en met N 13 van de Kieswet][ref6] zijn niet
      van toepassing.

      3 Voor de toepassing van [artikel N 10 van de Kieswet][ref7] wordt voor «, in artikel N 9 vermeld,» gelezen: van
      het stembureau.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelJ_4a
