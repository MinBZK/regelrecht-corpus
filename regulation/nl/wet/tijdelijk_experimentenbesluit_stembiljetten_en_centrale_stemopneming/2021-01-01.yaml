  - number: '10'
    text: |-
      1 In afwijking van [artikel M 2, tweede lid, van de Kieswet][ref1] wordt aan de tot deelneming aan de stemming
      bevoegde kiezer wiens briefstembewijs in het ongerede is geraakt of die geen briefstembewijs heeft ontvangen, op
      zijn verzoek door de burgemeester van ’s-Gravenhage een nieuw briefstembewijs verstrekt. Dit is een vervangend
      briefstembewijs. Het voorgaande is van overeenkomstige toepassing op de kiezer wiens vervangend briefstembewijs in
      het ongerede is geraakt of die het vervangend briefstembewijs niet heeft ontvangen.

      2 De kiezer die zijn werkelijke woonplaats heeft in Aruba, Curaçao of Sint Maarten doet het verzoek schriftelijk
      of mondeling via de vertegenwoordiger van Nederland in het land waar hij op de dag van kandidaatstelling zijn
      werkelijke woonplaats heeft. De overige kiezers doen het verzoek schriftelijk of mondeling aan de burgemeester van
      ’s-Gravenhage.

      3 Het schriftelijk verzoek dient uiterlijk de twaalfde dag voor de stemming te zijn ontvangen. De kiezer legt bij
      zijn verzoek een kopie over van een document als bedoeld in [artikel 1 van de Wet op de identificatieplicht][ref2],
      van een verklaring over het bezit van het Nederlanderschap of van de documenten als bedoeld in
      [artikel J 24, tweede lid, van de Kieswet][ref3]. De kiezer vermeldt in het verzoekschrift of hij zijn vervangend
      briefstembewijs per post of per e-mail wil ontvangen. Op dit verzoek wordt zo spoedig mogelijk beslist.

      4 Het mondeling verzoek dient uiterlijk de negende dag voor de stemming om twaalf uur te zijn gedaan. De
      kiezer identificeert zich met een document als bedoeld in artikel 1 van de Wet op de identificatieplicht,
      met een verklaring over het bezit van het Nederlanderschap of met de documenten als bedoeld in
      [artikel J 24, tweede lid, van de Kieswet][ref4]. Op dit verzoek wordt terstond beslist.

      5 Aan de kiezer die zijn werkelijke woonplaats in Aruba, Curaçao of Sint Maarten heeft kan het vervangend
      briefstembewijs alleen per post worden toegezonden of in persoon worden uitgereikt.

      6 Op het vervangend briefstembewijs wordt een nummer vermeld.

      7 Bij ministeriële regeling wordt voor het vervangend briefstembewijs een model vastgesteld.


