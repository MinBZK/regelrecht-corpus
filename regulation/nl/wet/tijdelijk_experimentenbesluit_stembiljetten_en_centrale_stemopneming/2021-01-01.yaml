  - number: '22'
    text: |-
      1 Het stembureau telt voor iedere lijst het gezamenlijke aantal op de kandidaten uitgebrachte stemmen, de blanco
      stemmen en de ongeldige stemmen. De voorzitter deelt de aantallen mede.

      2 Door de aanwezige personen kunnen mondeling bezwaren worden ingebracht.
    url: https://wetten.overheid.nl/BWBR0033989/2021-01-01#Artikel22
  - number: '23'
    text: |-
      1 Het stembureau doet in één of meer afzonderlijke pakken:

      a. de stembiljetten met een stem op een kandidaat, lijstgewijs gerangschikt;

      b. de stembiljetten met een blanco stem;

      c. de stembiljetten met een ongeldige stem.

      2 De pakken worden verzegeld, voorzien van de naam van de gemeente, het nummer van het stembureau en een
      beschrijving van de inhoud.
    url: https://wetten.overheid.nl/BWBR0033989/2021-01-01#Artikel23
  - number: '24'
    text: |-
      1 De pakken, bedoeld in [artikel N 2, van de Kieswet][ref1], en [artikel 23, eerste lid][ref2], worden in een
      transportbox gedaan.

      2 De transportbox wordt afgesloten en verzegeld.

      3 Totdat het stembureau de transportbox overdraagt ten behoeve van het vervoer naar een locatie voor de
      stemopneming, draagt het stembureau er zorg voor dat de zegels op de transportbox en de pakken niet worden
      verbroken.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelN_2
      [ref2]: https://wetten.overheid.nl/BWBR0033989#Artikel23
    url: https://wetten.overheid.nl/BWBR0033989/2021-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: N_2
      - id: ref2
        bwb_id: BWBR0033989
        artikel: '23'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '25'
    text: |-
      1 Het proces-verbaal van het stembureau wordt overgedragen aan het gemeentelijk stembureau. Burgemeester en
      wethouders dragen er zorg voor dat de transportbox wordt vervoerd naar een locatie voor de stemopneming en wordt
      overgedragen aan het gemeentelijk stembureau.

      2 Indien de stemopneming op meer dan één locatie geschiedt, besluiten burgemeester en wethouders uiterlijk de
      zevende dag voor de stemming op welke locatie de stemopneming voor ieder stembureau plaatsvindt.

      3 Nadat de transportbox door het stembureau is overgedragen ten behoeve van het vervoer naar een locatie voor de
      stemopneming, dragen burgemeester en wethouders er zorg voor dat de zegels op de transportbox en de pakken niet
      worden verbroken totdat het gemeentelijk stembureau aanvangt met zijn werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0033989/2021-01-01#Artikel25
  - number: '26'
    text: |-
      1 Burgemeester en wethouders besluiten uiterlijk de zevende dag voor de stemming op welk moment het gemeentelijk
      stembureau in het openbaar de stemopneming verricht, met dien verstande dat de stemopneming uiterlijk de dag na de
      stemming aanvangt.

      2 In afwijking van het eerste lid vangt de stemopneming bij de verkiezing van de leden van het algemeen bestuur van
      een waterschap uiterlijk de tweede dag na de stemming aan.
    url: https://wetten.overheid.nl/BWBR0033989/2021-01-01#Artikel26
  - number: '27'
    text: |-
      Het gemeentelijk stembureau kan zich bij de stemopneming doen bijstaan door personen, daartoe door burgemeester en
      wethouders aan te wijzen.
    url: https://wetten.overheid.nl/BWBR0033989/2021-01-01#Artikel27
  - number: '28'
    text: |-
      Het gemeentelijk stembureau is belast met de handhaving van de orde tijdens de stemopneming. Het kan daartoe de
      burgemeester om bijstand verzoeken.
    url: https://wetten.overheid.nl/BWBR0033989/2021-01-01#Artikel28
  - number: '29'
    text: |-
      1 Indien zich naar het oordeel van het gemeentelijk stembureau omstandigheden voordoen in of bij de locatie van
      de stemopneming die de behoorlijke voortgang van de stemopneming onmogelijk maken, wordt dit door het gemeentelijk
      stembureau verklaard. De stemopneming wordt daarop geschorst. Het gemeentelijk stembureau doet hiervan terstond
      mededeling aan de burgemeester. De burgemeester bepaalt vervolgens wanneer en waar de zitting wordt hervat.

      2 Bij ministeriële regeling worden hieromtrent nadere regels gesteld.
    url: https://wetten.overheid.nl/BWBR0033989/2021-01-01#Artikel29
  - number: '30'
    text: |-
      1 Indien de stemopneming op meer dan één locatie geschiedt, zijn op elke locatie ten minste vijf leden van het
      gemeentelijk stembureau aanwezig, waaronder de voorzitter of een plaatsvervangend voorzitter.

      2 Indien de stemopneming op meer dan één locatie geschiedt, besluiten en handelen de aanwezige leden van het
      gemeentelijk stembureau namens het gemeentelijk stembureau. Indien bij het nemen van een beslissing door de
      aanwezige leden van het stembureau de stemmen staken, beslist de stem van de voorzitter of, indien de voorzitter
      niet aanwezig is, de plaatsvervangend voorzitter.
    url: https://wetten.overheid.nl/BWBR0033989/2021-01-01#Artikel30
  - number: '31'
    text: |-
      Het gemeentelijk stembureau verricht voor elk stembureau separaat de handelingen als bedoeld in de
      [artikelen 32 tot en met 36][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0033989#Artikel32
    url: https://wetten.overheid.nl/BWBR0033989/2021-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0033989
        artikel: '32'
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: '32'
    text: |-
      1 Het gemeentelijk stembureau opent de verzegelde transportbox en de verzegelde pakken met stembiljetten.

      2 Het gemeentelijk stembureau stelt ten aanzien van iedere lijst vast:

      a. het aantal op iedere kandidaat uitgebrachte stemmen;

      b. de som van de aantallen stemmen, bedoeld onder a.

      3 Daarnaast stelt het gemeentelijk stembureau vast:

      a. het aantal blanco stemmen;

      b. het aantal ongeldige stemmen.

      4 De som van de aantallen op kandidaten uitgebrachte stemmen, blanco stemmen en ongeldige stemmen is het aantal
      stemmen dat is geteld.
    url: https://wetten.overheid.nl/BWBR0033989/2021-01-01#Artikel32
  - number: '33'
    text: |-
      1 Het gemeentelijk stembureau beslist met inachtneming van [artikel N 7 van de Kieswet][ref1] over de geldigheid
      van het stembiljet.

      2 Het gemeentelijk stembureau maakt de reden van ongeldigverklaring en van twijfel over de geldigheid, alsmede de
      beslissing daaromtrent onmiddellijk bekend.

      3 Indien een van de aanwezige personen dit verlangt, moet het biljet worden getoond. De personen kunnen mondeling
      bezwaren tegen de genomen beslissing inbrengen.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelN_7
    url: https://wetten.overheid.nl/BWBR0033989/2021-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: N_7
  - number: '34'
    text: |-
      1 Indien er een verschil is tussen het aantal getelde stemmen en het aantal toegelaten kiezers, opent het
      gemeentelijk stembureau de verzegelde pakken, bedoeld in [artikel N 2, eerste lid, van de Kieswet][ref1] en stelt
      het de aantallen geldige stempassen, kiezerspassen en volmachtbewijzen voor het stembureau opnieuw vast.

      2 In afwijking van [artikel N 1, eerste lid, tweede zin, van de Kieswet][ref2], is de som van deze aantallen het
      aantal kiezers dat tot de stemming is toegelaten.

      3 [Artikel N 2 van de Kieswet][ref3] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelN_2
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelN_1
      [ref3]: https://wetten.overheid.nl/BWBR0004627#ArtikelN_2
    url: https://wetten.overheid.nl/BWBR0033989/2021-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: N_2
      - id: ref2
        bwb_id: BWBR0004627
        artikel: N_1
      - id: ref3
        bwb_id: BWBR0004627
        artikel: N_2
  - number: '35'
    text: |-
      Het gemeentelijk stembureau stelt vast het verschil tussen het aantal kiezers dat tot de stemming is toegelaten en
      het aantal stemmen dat is geteld. Voor zover mogelijk geeft het gemeentelijk stembureau hiervoor een verklaring.
    url: https://wetten.overheid.nl/BWBR0033989/2021-01-01#Artikel35
  - number: '36'
    text: |-
      1 Het gemeentelijk stembureau deelt de aantallen, bedoeld in de [artikelen 32][ref1], [34][ref2] en [35][ref3]
      en in [artikel N 1, eerste lid, van de Kieswet][ref4], mede. De aanwezige personen kunnen mondeling bezwaren
      inbrengen.

      2 Het gemeentelijk stembureau doet vervolgens in één of meer afzonderlijke pakken:

      a. de stembiljetten met een stem op een kandidaat, lijstgewijs gerangschikt;

      b. de stembiljetten met een blanco stem;

      c. de stembiljetten met een ongeldige stem.

      3 De pakken worden verzegeld, voorzien van de naam van de gemeente en het nummer van het stembureau.


      [ref1]: https://wetten.overheid.nl/BWBR0033989#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0033989#Artikel34
      [ref3]: https://wetten.overheid.nl/BWBR0033989#Artikel35
      [ref4]: https://wetten.overheid.nl/BWBR0004627#ArtikelN_1
    url: https://wetten.overheid.nl/BWBR0033989/2021-01-01#Artikel36
