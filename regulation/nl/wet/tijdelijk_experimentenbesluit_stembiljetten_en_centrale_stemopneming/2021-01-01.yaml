  - number: 42a
    text: |-
      In afwijking van [artikel O 1, eerste lid, van de Kieswet][ref1] kan het hoofdstembureau voor een verkiezing van de
      leden van een vertegenwoordigend orgaan met twee of meer kieskringen uiterlijk een week voor de stemming besluiten
      dat zijn zitting op de tweede dag na de stemming betreffende de vaststelling van de verkiezingsuitslag op een later
      tijdstip dan 10:00 uur plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelO_1
    url: https://wetten.overheid.nl/BWBR0033989/2021-01-01#Artikel42a
