  - number: '45'
    text: |-
      1 Onder verantwoordelijkheid van Onze Minister vindt een evaluatie plaats van ieder experiment afzonderlijk, dan
      wel gezamenlijk met een of meer andere, met elkaar samenhangende experimenten.

      2 De evaluatie heeft tot doel inzicht te verkrijgen in de mate waarin het experiment heeft voldaan aan de volgende
      criteria:

      a. de centrale stemopneming heeft voor de uitvoerende instanties, de kiezer en politieke partijen een meerwaarde
      boven de stemopneming in ieder stembureau, gelet op onder andere:

        - de tijd die het kost om de stemopneming te verrichten;
        - het aantal keer dat de stemmen meer dan één keer worden geteld;
        - hoeveel verschillen worden geconstateerd met de voorlopige telling door het stembureau; en
        - de bezwaren die door personen zijn ingediend en hoe daar mee is omgegaan.

      b. de organisatorische consequenties en de financiële en administratieve lasten voor de uitvoerende instanties
      staan in verhouding tot de meerwaarde die de centrale stemopneming heeft.

      3 Het evaluatierapport beschrijft ten minste:

      a. de ervaringen van kiezers, politieke partijen en de uitvoerende instanties bij het experiment;

      b. de kosten van het experiment;

      c. de organisatorische consequenties en de financiële en administratieve lasten bij het experiment.

      d. de conclusies omtrent de voortzetting van experimenten, dan wel de invoering van de voorzieningen waarmee is
      geëxperimenteerd.
    url: https://wetten.overheid.nl/BWBR0033989/2021-01-01#Artikel45
  - number: '46'
    text: |-
      Bij ministeriële regeling kunnen nadere regels gesteld worden over het vervoer van de stembescheiden en het proces-
      verbaal van het stembureau, de werkwijze van het gemeentelijk stembureau en de evaluatie van het experiment.
    url: https://wetten.overheid.nl/BWBR0033989/2021-01-01#Artikel46
  - number: '47'
    text: |-
      In afwijking van de [artikelen Y 2][ref1], [Y 22 tot en met Y 23][ref2], [Y 24][ref3] en
      [Y 39 van de Kieswet][ref4] is dit besluit van overeenkomstige toepassing op een experiment dat wordt gehouden bij
      de verkiezing van de Nederlandse leden van het Europees Parlement, met dien verstande dat:

      a. onverminderd [artikel 8, tweede lid][ref5], is ongeldig het briefstembewijs van de kiezer die in een andere
      lidstaat van de Europese Unie als kiezer voor de leden van het Europees Parlement is geregistreerd;

      b. in afwijking van [artikel 26][ref6] de stemopneming plaatsvindt op de eerste werkdag na de sluiting van de
      stembussen in de lidstaat waar de kiezers het laatst hun stem uitbrengen tijdens de stemmingsperiode, bedoeld in de
      Akte betreffende de rechtstreekse verkiezing van de leden van het Europees Parlement (Brussel, 20 september 1976,
      *Trb.* 1976, 175); en

      c. in afwijking van [artikel Y 2][ref7] juncto [artikel O 1, eerste lid, van de Kieswet][ref8], het hoofdstembureau
      op de dag na de dag van de stemopneming om tien uur een openbare zitting houdt.


