      2 De kiezer die zijn stembiljet per e-mail wil ontvangen, vermeldt het e-mailadres waarnaar het stembiljet moet
      worden verzonden.
    url: https://wetten.overheid.nl/BWBR0033989/2021-01-01#Artikel4
  - number: '5'
    text: |-
      1 Onverminderd [artikel M 6, eerste lid, van de Kieswet][ref1], wordt de kiezer een overzicht van de
