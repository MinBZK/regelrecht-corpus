  - number: '7'
    text: |-
      Op het briefstembewijs wordt een nummer vermeld. Onze Minister verstrekt tijdig voor de verkiezing aan de gemeente
      ’s-Gravenhage de informatie nodig voor het produceren van het briefstembewijs.
    url: https://wetten.overheid.nl/BWBR0033989/2021-01-01#Artikel7
  - number: '8'
    text: |-
      1 Er is een register van briefstembewijzen. Dit register wordt beheerd door de burgemeester van ’s-Gravenhage.

      2 Ongeldig is het briefstembewijs of het vervangend briefstembewijs:

      a. waarvoor krachtens [artikel 10][ref1] een vervangend briefstembewijs is verstrekt;

      b. van iemand die niet als kiezer behoort te zijn geregistreerd, dan wel voor het uitbrengen van zijn stem is
      overleden;

      c. waarvan is vastgesteld dat dit briefstembewijs of vervangend briefstembewijs is ontvreemd of anderszins
      onrechtmatig in omloop is.

      3 Uiterlijk op de achtste dag voor de dag van de stemming stelt de burgemeester van ’s-Gravenhage uit het
      register een uittreksel van ongeldige briefstembewijzen vast, dat hij aan alle briefstembureaus verstrekt. Voorts
      verstrekt de burgemeester aan elk briefstembureau waarvan het adres staat op de retourenveloppe, bedoeld in
      [artikel M 6, eerste lid, van de Kieswet][ref2] uit het register een uittreksel van geldige briefstembewijzen die
      vermoedelijk naar dat briefstembureau worden verstuurd.

      4 De burgemeester bewaart het register drie maanden nadat over de toelating van de gekozenen is beslist. Daarna
      vernietigt hij dit onmiddellijk. Van de vernietiging wordt proces-verbaal opgemaakt.

      5 De artikelen 16 en 18 van de Algemene verordening gegevensbescherming zijn niet van toepassing op verwerking van
      persoonsgegevens bij of krachtens dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0033989#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelM_6
