        artikel: M_7
  - number: '11'
    text: |-
      1 Onverminderd [artikel M 10, eerste lid, van de Kieswet][ref1], controleert het briefstembureau of het
      briefstembewijs echt is, of het nummer van het briefstembewijs dan wel het vervangend briefstembewijs voorkomt in
      het uittreksel van ongeldige briefstembewijzen en of er blijkens het uittreksel van geldige briefstembewijzen niet
      eerder al een briefstembewijs of een vervangend briefstembewijs met dit nummer is ontvangen.

      2 Het briefstembureau houdt in het uittreksel van geldige briefstembewijzen aantekening bij van de kiezers die tot
      de stemming zijn toegelaten op basis van een vervangend briefstembewijs.

      3 Indien het nummer van een briefstembewijs dan wel vervangend briefstembewijs niet voorkomt in het uittreksel,
      bedoeld in het tweede lid, neemt het briefstembureau contact op met de burgemeester van ’s-Gravenhage.

      4 Indien de burgemeester er blijk van geeft dat een briefstembewijs of vervangend briefstembewijs met dat nummer
      eerder is ontvangen door een ander briefstembureau, dan wordt [artikel M 11 van de Kieswet][ref2] toegepast. Heeft
      niet eerder een ander briefstembureau een briefstembewijs of vervangend briefstembewijs met dat nummer ontvangen,
      dan voegt het briefstembureau dat het briefstembewijs of vervangend briefstembewijs heeft ontvangen het nummer toe
      aan zijn uittreksel van geldige briefstembewijzen en tekent het briefstembureau in wiens uittreksel van geldige
      briefstembewijzen het nummer voorkomt, daarin aan dat het ontvangen is.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelM_10
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelM_11
