  - number: '43'
    text: |-
      1 Burgemeester en wethouders brengen het proces-verbaal, bedoeld in
      [artikel N 10, eerste lid, van de Kieswet][ref1], of de pakken, bedoeld in [artikel N 2 van de Kieswet][ref2]
      of de [artikelen 34, derde lid][ref3], of [36, tweede lid][ref4], op verzoek van het centraal stembureau of het
      vertegenwoordigend orgaan over naar het centraal stembureau respectievelijk het vertegenwoordigend orgaan.

      2 Burgemeester en wethouders bewaren de pakken, bedoeld in de [artikelen N 2 van de Kieswet][ref5] of de
      [artikelen 34, derde lid][ref6], of [36, tweede lid][ref7], en de processen-verbaal van de stembureaus die niet
      naar het centraal stembureau of het vertegenwoordigend orgaan zijn overgebracht, drie maanden nadat over de
      toelating van de gekozenen is beslist. Daarna vernietigt het deze stukken onmiddellijk, tenzij:

      a. de officier van justitie of de rechter-commissaris in het kader van een strafrechtelijk onderzoek een verzoek
      heeft gedaan tot overdracht van deze stukken, in welk geval de vernietiging plaatsvindt nadat dit onderzoek is
      afgerond;

      b. strafvervolging is ingesteld wegens een strafbaar gestelde gedraging in de [Kieswet][ref8] of de
      [artikelen 125 tot en met 129 van het Wetboek van Strafrecht][ref9], in welk geval de vernietiging plaatsvindt
      nadat er een onherroepelijke rechterlijke uitspraak is.

      2 Van de vernietiging wordt proces-verbaal opgemaakt.


