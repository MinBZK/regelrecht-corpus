  - number: '37'
    text: |-
      De aanwezige personen kunnen mondeling bezwaren inbrengen. De bezwaren worden in het proces-verbaal van het
      gemeentelijk stembureau vermeld.
    url: https://wetten.overheid.nl/BWBR0033989/2021-01-01#Artikel37
  - number: '38'
    text: |-
      1 Nadat de stemopneming is afgerond, stelt het gemeentelijk stembureau zo spoedig mogelijk in een openbare zitting
      voor de gemeente voor iedere lijst vast het aantal op iedere kandidaat uitgebrachte stemmen en de som van deze
      aantallen.

      2 Het gemeentelijk stembureau stelt voor de gemeente tevens vast:

      a. het aantal blanco stemmen;

      b. het aantal ongeldige stemmen;

      c. het aantal stemmen dat bij volmacht is uitgebracht; en

      d. het verschil tussen het aantal kiezers dat tot de stemming is toegelaten en het aantal stemmen dat is geteld.
      Voor zover mogelijk geeft het gemeentelijk stembureau hiervoor een verklaring.

      3 De voorzitter maakt de aldus verkregen uitkomsten bekend.

      4 Het gemeentelijk stembureau vermeldt in een verslag alle bezwaren die staan in de processen-verbaal van de
      stembureaus. Het verslag is onderdeel van het proces-verbaal van het gemeentelijk stembureau.
    url: https://wetten.overheid.nl/BWBR0033989/2021-01-01#Artikel38
  - number: '39'
    text: |-
      1 Indien een experiment wordt gehouden in de gemeente ’s-Gravenhage zijn de volgende leden van toepassing.

      2 In afwijking van [artikel N 20, tweede lid, van de Kieswet][ref1], wordt het proces-verbaal van een
      briefstembureau terstond langs elektronische weg ter kennis van het gemeentelijk stembureau van ’s-Gravenhage
      gebracht.

      3 In afwijking van [artikel N 20, derde lid, van de Kieswet][ref2], wordt het proces-verbaal van een
      briefstembureau met de in [artikelen M 8][ref3], [N 2][ref4] en [N 16 van de Kieswet][ref5], bedoelde verzegelde
      pakken zo spoedig mogelijk naar het gemeentelijk stembureau van ’s-Gravenhage overgebracht.

      4 In afwijking van [artikel N 21 van de Kieswet][ref6], vindt door het gemeentelijk stembureau van ’s-Gravenhage
      de vaststelling van de aantallen stemmen, bedoeld in [artikel 38, eerste lid][ref7], eerst plaats nadat hem tevens
      alle processen-verbaal van de briefstembureaus ter kennis zijn gebracht.

      5 Het gemeentelijk stembureau maakt bij de vaststelling van de aantallen stemmen, bedoeld in
      [artikel 38, eerste lid][ref8], apart melding van de stemmen die in de briefstembureaus zijn uitgebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelN_20
