preamble:
  text: |-
    Gelet op de artikelen 33e van het Algemeen Rijksambtenarenreglement (Stb. 1931, 248), 30g van het
    Arbeidsovereenkomstenbesluit (Stb. 1931, 354) en 61 van het Ambtenarenreglement Staten-Generaal (Stb. 1979, 123);

    Besluit:
  url: https://wetten.overheid.nl/BWBR0005221/2002-02-02#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Voor de toepassing van deze regeling wordt verstaan onder:



            a
            belanghebbende:

              de ambtenaar in de zin van het [Algemeen Rijksambtenarenreglement][ref1] en de ambtenaar in de zin van het
      [Ambtenarenreglement Staten-Generaal][ref2];



            b
            nevenwerk:

              werkzaamheden die de belanghebbende buiten zijn functie verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0001950
      [ref2]: https://wetten.overheid.nl/BWBR0003229
    url: https://wetten.overheid.nl/BWBR0005221/2002-02-02#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001950
      - id: ref2
        bwb_id: BWBR0003229
  - number: '2'
    text: |-
      Indien aan de belanghebbende buitengewoon verlof wordt verleend voor het verrichten van nevenwerk, wordt over de
      genoten verlofuren geen bezoldiging of loon genoten.
    url: https://wetten.overheid.nl/BWBR0005221/2002-02-02#Artikel2
  - number: '3'
    text: |-
      Indien het bevoegd gezag van oordeel is dat het nevenwerk overwegend in het algemeen belang wordt verricht, wordt
      de vermindering van bezoldiging of loon beperkt tot hetgeen de belanghebbende voor het nevenwerk aan geldelijke
      of op geld waardeerbare beloning ontvangt of geacht kan worden te ontvangen voor de met het verlof overeenkomende
      uren.
    url: https://wetten.overheid.nl/BWBR0005221/2002-02-02#Artikel3
  - number: '4'
    text: |-
      1 Deze regeling, waarvan afschrift zal worden gezonden aan de Algemene Rekenkamer, treedt in werking met ingang van
      de dag na de dagtekening van de Staatscourant waarin zij wordt geplaatst en werkt terug tot en met 1 januari 1991.

      2 Deze regeling kan aangehaald worden als de Regeling vermindering bezoldiging bij nevenwerk tijdens diensttijd.
    url: https://wetten.overheid.nl/BWBR0005221/2002-02-02#Artikel4
