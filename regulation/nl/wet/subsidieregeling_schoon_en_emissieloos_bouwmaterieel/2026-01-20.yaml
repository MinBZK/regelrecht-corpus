articles:
  - number: '1.1'
    text: |-
      In deze regeling wordt verstaan onder: - *aanschaf:* verkrijging van de eigendom, bedoeld in
      [artikel 3:84, eerste lid, van het Burgerlijk Wetboek][ref1] krachtens koop, of ‘financial leasing’, bedoeld in
      [paragraaf 3.2 van het besluit Omzetbelasting, leasing](onbekend) van 25 januari 2007, nr. CPP2006/2847M;
        - *aanvrager:* onderneming, niet zijnde een publiekrechtelijk zelfstandig bestuursorgaan met
      rechtspersoonlijkheid, een provincie, gemeente, waterschap of openbaar lichaam als bedoeld in de
      [Wet gemeenschappelijke regelingen][ref2], die is ingeschreven bij de Kamer van Koophandel, met een vestiging in
      Nederland en een subsidie aanvraagt op grond van deze regeling;
        - *Algemene groepsvrijstellingsverordening:* [Verordening (EU) nr. 651/2014](32014R0651) van de Commissie van
      17 juni 2014 waarbij bepaalde categorieën steun op grond van de artikelen 107 en 108 van het Verdrag met de interne
      markt verenigbaar worden verklaard (PbEU 2014, L 187);
        - *alternatieve energiedragers:* energiebronnen die dienen als vervanging van fossiele bronnen en die ertoe kunnen
      bijdragen dat de energievoorziening koolstofvrij wordt en de milieuprestaties van de bouwsector verbeteren;
        - *bouwsector:* sector van bedrijven, ingeschreven in het handelsregister onder de codes 39, 41, 42, 43, 49410,
      50 201, 77120, 77320, 77340 of 77390 van de Standaard Bedrijfsindeling, evenals de onderliggende codes gericht
      op de nieuwbouw, het onderhoud, de verbouw of het slopen en verwijderen van een onroerende zaak of een gedeelte
      daarvan;
        - *bouwmachine:* a. bouwwerktuig: 1°. mobiele machine; 2°. vervoerbare industriële uitrusting; of 3°.
      voertuig, niet bestemd voor personen- of goederenvervoer over de weg, of vaartuig; en 4°. welke genoemd is in
      [bijlage 1][ref3], onderdeel A; of b. hulpfunctie: 1°. machine die is gemonteerd op het chassis van een weg- of
      spoorvoertuig, een oplegger of een drijvend werktuig; en 2°. welke genoemd is in en voldoet aan de beschrijving
      in [bijlage 1][ref4], onderdeel B; of c. bouwvoertuig: 1°. voertuig dat op het moment van subsidievaststelling
      beschikt over de in het kentekenregister vastgelegde voertuigkwalificatie N3; en 2°. welke genoemd is in
      [bijlage 1][ref5], onderdeel C; en d. indien elektrisch aangedreven beschikkende over een continu elektrisch
      motorvermogen van 8 kilowatt of hoger; en e. bestemd is of in hoofdzaak wordt gebruikt voor het verrichten van
      bouwwerkzaamheden in de open lucht;
        - *CO2:* koolstofdioxide;
        - *emissieloos:* zonder uitlaatemissie van NO, roetdeeltjes en broeikasgassen, uitgezonderd CO die vrijkomt bij
      gebruik van niet fossiele waterstofdragers in een brandstofcel;
        - *emissiearm:* uitlaatemissies van NO en roetdeeltjes die voldoen aan emissielimieten zoals aangegeven in
      [bijlage 3][ref6];
        - *fijnstof:* vaste stofdeeltjes die kleiner zijn dan 10 micrometer doorsnee;
        - *groep:* groep, bedoeld in artikel 2:24b van het Burgerlijk Wetboek;
        - *hermotorisering:* 1°. inbouw van een nieuwe motor die voldoet aan de fase V emissienorm, als bedoeld in de NRMM-
      Verordening of op basis van de NRMM-Verordening als gelijkwaardig is erkend, in een in gebruik zijnd bouwwerktuig,
      of 2°. de inbouw van een nieuwe motor die voldoet aan de IMO MARPOL Tier III emissienorm, in een in gebruik zijnd
      zeegaand bouwvaartuig;
        - *IMO MARPOL Tier III emissienorm:* als bedoeld in voorschrift 13, paragraaf 5,1,1, bijlage VI, Hoofdstuk 3 van
      het Internationaal Verdrag ter voorkoming van verontreiniging door schepen, 1973, zoals gewijzigd door het Protocol
      van 1978 daarbij, Londen, 02-11-1973 en gepubliceerd in het Tractatenblad 1978, 187;
        - *in gebruik zijnd bouwwerktuig of zeegaand bouwvaartuig:* een bouwwerktuig of zeegaand bouwvaartuig dat door de
      huidige of vorige eigenaar al is ingezet voor bouwwerkzaamheden;
        - *Kaderbesluit:* [Kaderbesluit subsidies I en M][ref7];
        - *kleine of middelgrote onderneming:* kleine of middelgrote onderneming als bedoeld in artikel 2, onderdeel 2, van
      de Algemene groepsvrijstellingsverordening;
        - *netto investeringskosten:* investeringskosten voor de subsidiabele bouwmachine of het zeegaand bouwvaartuig
      exclusief omzetbelasting;
        - *netto referentiekosten:* investeringskosten voor de referentie-bouwmachine exclusief omzetbelasting;
        - *NOx:* stikstofoxiden;
        - *NH3:* ammoniak;
        - *NRMM-Verordening:* [verordening (EU) 2016/1628](33528R2016) van het Europees parlement en de Raad van
      14 september 2016 inzake voorschriften met betrekking tot emissiegrenswaarden voor verontreinigende gassen
      en deeltjes en typegoedkeuring voor in niet voor de weg bestemde mobiele machines gemonteerde interne
      verbrandingsmotoren, tot wijziging van [Verordeningen (EU) nr. 1024/2012](32012R1024) en [(EU) nr. 167/2013]
      (32013R0167), en tot wijziging en intrekking van [Richtlijn 97/68/EG](31997L0068);
        - *onderzoeksorganisatie:* organisatie voor onderzoek en kennisverspreiding als bedoeld in artikel 2, onderdeel 83,
      van de Algemene groepsvrijstellingsverordening;
        - *operational leasing:* leasevorm, bedoeld in [paragraaf 3.3 van het besluit Omzetbelasting, leasing](onbekend);
        - *overeenkomst:* schriftelijke overeenkomst tot koop, bedoeld in [artikel 7:1 van het Burgerlijk Wetboek][ref8] of
      een schriftelijke overeenkomst tot ‘financial leasing’, bedoeld in [paragraaf 3.2 van het besluit Omzetbelasting,
      leasing](onbekend), met de ontbindende voorwaarde dat subsidie wordt verleend;
        - *project experimentele ontwikkeling:* een project inhoudende experimentele ontwikkeling, bedoeld in artikel
      2, onderdeel 86, van de Algemene groepsvrijstellingsverordening waarbij sprake is van het verwerven, combineren,
      vormgeven en gebruiken van bestaande wetenschappelijke, technologische, zakelijke en andere relevante kennis en
      vaardigheden, gericht op het ontwikkelen van nieuwe of verbeterde producten, procedés of diensten;
        - *project haalbaarheidsstudie:* een project inhoudende een haalbaarheidsstudie als bedoeld in artikel 2,
      onderdeel 87, van de Algemene groepsvrijstellingsverordening, waarbij sprake is van een onderzoek of analyse van
      het potentieel van een project experimentele ontwikkeling, met als doel de besluitvorming te ondersteunen door
      objectief en rationeel de sterke en de zwakke punten van een project, de kansen en risico’s in kaart te brengen,
      waarbij ook wordt aangegeven welke middelen nodig zijn om het project te kunnen doorvoeren en wat de uiteindelijke
      slaagkansen zijn;
        - *referentie-bouwmachine:* bouwmachine met een verbrandingsmotor met dezelfde functie en prestatie als de te
      subsidiëren bouwmachine;
        - *roetdeeltjes:* stof die ontstaat bij een onvolledige verbranding van koolstofhoudende brandstoffen;
        - *SCR-katalysator:* nabehandelingssysteem voor selectieve katalytische reductie, dat overeenkomstig geldende
      standaarden op een motor van een bouwwerktuig kan worden geplaatst, teneinde emissies van NO significant te
      verminderen;
        - *RVO:* Rijksdienst voor Ondernemend Nederland;
        - *eerste inschrijving en tenaamstelling:* eerste inschrijving en tenaamstelling, bedoeld in
      [artikel 25 van het Kentekenreglement][ref9];
        - *verkoopprijs:* prijs van de emissieloze bouwmachine inclusief af-fabriekopties zoals vermeld op de overeenkomst
      verminderd met de daarin begrepen omzetbelasting;
        - *verstrekkingsvoorbehoud:* registratie als bedoeld in [artikel 25 van het Kentekenreglement][ref10], van de
      rechtspersoon of natuurlijk persoon die over de tenaamstellingscode van een voertuig in het kentekenregister kan
      beschikken;
        - *voertuigkwalificatie N3:* voertuigkwalificatie N3 als bedoeld in bijlage II, onderdeel A, van de [Verordening
      (EU) 2018/858](32758R2018) van het Europees parlement en de Raad van 30 mei 2018 betreffende de goedkeuring van en
      het markttoezicht op motorvoertuigen en aanhangwagens daarvan en systemen, onderdelen en technische eenheden die
      voor dergelijke voertuigen zijn bestemd, tot wijziging van [Verordeningen (EG) nr. 715/2007](32007R0715) en [(EG)
      nr. 595/2009](32009R0595) en tot intrekking van [Richtlijn 2007/46/EG](32007L0046) (PB L 151 van 14.6.2018, blz.
      1–218);
        - *zeegaand bouwvaartuig:* vaartuig dat mede wordt ingezet voor bouwwerkzaamheden in de
      Nederlandse exclusieve economische zone, waarvoor een geldig certificaat als bedoeld in de
      [artikelen 4 tot en met 6 van het Schepenbesluit 2004][ref11] vereist is, dat is genoemd in
      [bijlage 1, onderdeel D][ref12], bij deze regeling, niet zijnde een binnenvaartschip of drijvend werktuig als
      bedoeld in de artikelen 2 en 3 van de [Richtlijn (EU) 2016/1629](32016L1629) van het Europees parlement en de
      Raad van 14 september 2016 tot vaststelling van de technische voorschriften voor binnenschepen, tot wijziging van
      [Richtlijn 2009/100/EG](32009L0100) en tot intrekking van [Richtlijn 2006/87/EG](32006L0087);


