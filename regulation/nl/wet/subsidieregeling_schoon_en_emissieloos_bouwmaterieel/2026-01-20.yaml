        artikel: '3'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0046464
        artikel: '4'
        hoofdstuk: '4'
  - number: 2.3.3
    text: |-
      Indien het subsidieplafond, bedoeld in het eerste lid, onderdeel e, onder 1°, na 1 juni 2026 ontoereikend is
      om alle daarvoor in aanmerking komende aanvragen te kunnen toewijzen, kan het bedrag worden aangevuld met de
      onaangesproken middelen van artikel 2.3, eerste lid, onderdeel e, onder 2°, tot ten hoogste het bedrag dat
      is bestemd voor verwisselbare batterijpakketten behorende bij een emissieloos bouwwerktuig als bedoeld in
      [artikel 2.2, tweede lid, onderdeel d][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0046464#Artikel2
