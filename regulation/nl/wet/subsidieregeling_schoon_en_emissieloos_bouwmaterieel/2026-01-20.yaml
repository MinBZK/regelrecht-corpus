        hoofdstuk: '4'
  - number: 2.4.1
    text: |-
      De Minister kent de in de betreffende subsidieperiode beschikbare gelden voor subsidies op grond van dit hoofdstuk
      toe, overeenkomstig [artikel 8, lid 3 van het Kaderbesluit][ref1], op volgorde van ontvangst van de volledige
      aanvragen.


      [ref1]: https://wetten.overheid.nl/BWBR0036381#Artikel8
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel2.4
    references:
      - id: ref1
        bwb_id: BWBR0036381
        artikel: '8'
  - number: 2.4.2
    text: |-
      Indien een aanvrager niet heeft voldaan aan enig wettelijk voorschrift voor het in behandeling nemen van de
      aanvraag en met toepassing van [artikel 4:5 van de Algemene wet bestuursrecht][ref1] de gelegenheid heeft gehad
      de aanvraag aan te vullen, geldt de dag waarop de aanvraag voldoet aan deze wettelijke voorschriften als datum
      van ontvangst.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel2.4
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 2.4.3
    text: |-
      Indien de Minister op de dag waarop het subsidieplafond is bereikt, meerdere volledige aanvragen om
      subsidieverlening heeft ontvangen, stelt hij de onderlinge rangschikking vast door middel van loting.
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel2.4
  - number: 2.5.1
    text: |-
      Een aanvrager dient bij de Minister een aanvraag om subsidie op grond van dit hoofdstuk in door middel van een
      daartoe vastgesteld formulier dat beschikbaar is via de website van RVO.
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel2.5
  - number: 2.5.2
    text: Als tijdstip van indiening van een aanvraag geldt de datum van ontvangst van de volledige aanvraag.
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel2.5
  - number: 2.5.3
    text: 'Een aanvraag tot subsidieverlening op grond van dit hoofdstuk kan worden ingediend in de volgende perioden:'
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel2.5
  - number: 2.5.3.a
    text: 'in 2022 voor:'
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel2.5
  - number: 2.5.3.a.1°
    text: |-
      bouwwerktuigen en hulpfuncties als bedoeld in de begripsomschrijving van ‘bouwmachine’,
      [artikel 1.1, onderdelen a en b][ref1], van 9 mei 2022, 9.00 uur tot en met 30 december 2022, 12.00 uur;


      [ref1]: https://wetten.overheid.nl/BWBR0046464#Artikel1
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel2.5
    references:
