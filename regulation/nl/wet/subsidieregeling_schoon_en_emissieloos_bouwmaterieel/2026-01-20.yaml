  - number: 2.5.4
    text: |-
      Bij de aanvraag tot verlening van de subsidie op grond van dit hoofdstuk worden in elk geval de volgende gegevens
      verstrekt:
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel2.5
  - number: 2.5.4.a
    text: naam en adres van de aanvrager;
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel2.5
  - number: 2.5.4.b
    text: contactpersoon met contactgegevens van de aanvrager;
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel2.5
  - number: 2.5.4.c
    text: nummer Kamer van Koophandel;
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel2.5
  - number: 2.5.4.d
    text: BSN-nummer van de aanvrager indien een onderneming door een natuurlijk persoon wordt gedreven;
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel2.5
  - number: 2.5.4.e
    text: het IBAN-nummer van een bankrekening die op naam staat van de aanvrager;
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel2.5
  - number: 2.5.4.f
    text: 'de overeenkomst voor de aanschaf die:'
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel2.5
  - number: 2.5.4.f.1°
    text: die ten tijde van de aanvraag om subsidieverlening geen onherroepelijke verplichting mag bevatten, en
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel2.5
  - number: 2.5.4.f.2°
    text: |-
      waarin tenminste zijn vermeld het merk, type, de handelsbenaming en, indien van toepassing, tenminste de volgende
      technische specificaties van de emissieloze bouwmachine: accucapaciteit in kilowattuur, continu elektrisch
      motorvermogen in kilowatt en vermogen van de brandstofcel in kilowatt;
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel2.5
  - number: 2.5.4.g
    text: |-
      indien het een bouwmachine, bedoeld in [artikel 2.2, tweede lid, onderdeel c][ref1], betreft, een bewijs van minder
      dan drie maanden oud waaruit blijkt wat de netto referentiekosten zijn;


      [ref1]: https://wetten.overheid.nl/BWBR0046464#Artikel2
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel2.5
    references:
      - id: ref1
        bwb_id: BWBR0046464
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.5.4.h
    text: |-
      de code of codes verbonden aan de Standaard Bedrijfsindeling van het Centraal Bureau voor de Statistiek van de
      aanvrager op het moment van de aanvraag;
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel2.5
  - number: 2.5.4.i
    text: |-
      de aanduiding van de subsidieregeling en de hoogte van het bedrag van eventuele reeds aangevraagde of ontvangen
      subsidies of andere tegemoetkomingen van andere bestuursorganen of de Europese Commissie voor de aanschaf van de
      bouwmachine;
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel2.5
  - number: 2.5.4.j
    text: |-
      een getekende verklaring dat de bouwmachine gedurende de instandhoudingstermijn, bedoeld in
      [artikel 2.11, derde lid][ref1], hoofdzakelijk zal worden ingezet ten behoeve van de bouwsector in Nederland;


      [ref1]: https://wetten.overheid.nl/BWBR0046464#Artikel2
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel2.5
    references:
      - id: ref1
        bwb_id: BWBR0046464
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.5.4.k
    text: |-
      indien de aanvraag een aggregaat op waterstof of waterstofdrager als bedoeld in [bijlage 1][ref1], onderdeel A,
      nummer A2.3, of een mobiele waterstof tankvoorziening, als bedoeld in bijlage 1, onderdeel A, nummer A2.14 betreft,
      een bewijs dat voor het gebruiken van waterstof of waterstofdrager voor het aggregaat wordt voldaan aan artikel 2
      nummers 102 quater respectievelijk quinquies van de Algemene groepsvrijstellingsverordening;


      [ref1]: https://wetten.overheid.nl/BWBR0046464
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel2.5
    references:
      - id: ref1
        bwb_id: BWBR0046464
  - number: 2.5.4.l
    text: |-
      indien de aanvraag een batterijpakket voor off-grid stroomvoorziening vanaf 50 kWh op een bouwlocatie als bedoeld
      in [bijlage 1][ref1], onderdeel A, nummer A2.7 betreft, een bewijs dat voor het opladen van het batterijpakket,
      niet behorend tot een bouwwerktuig, wordt voldaan aan artikel 2 nummers 102 quater respectievelijk quinquies van de
      Algemene groepsvrijstellingsverordening;


      [ref1]: https://wetten.overheid.nl/BWBR0046464
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel2.5
    references:
      - id: ref1
        bwb_id: BWBR0046464
  - number: 2.5.4.m
    text: |-
      indien de aanvraag een bouwwerktuig of hulpfunctie betreft die werkt op waterstof of waterstofdrager, uitgezonderd
      een aggregaat op waterstof of waterstofdrager als bedoeld in [bijlage 1][ref1], onderdeel A, nummer A2.3, een
      bewijs dat wordt voldaan aan artikel 36 eerste lid ter van de Algemene groepsvrijstellingsverordening.


      [ref1]: https://wetten.overheid.nl/BWBR0046464
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel2.5
    references:
      - id: ref1
        bwb_id: BWBR0046464
  - number: '2.6'
    text: 'De Minister beslist in elk geval afwijzend op een aanvraag om subsidie op grond van dit hoofdstuk, indien:'
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel2.6
  - number: 2.6.a
    text: |-
      er sprake is van een onderneming in moeilijkheden als bedoeld in artikel 2, achttiende lid, van de Algemene
      groepsvrijstellingsverordening;
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel2.6
  - number: 2.6.b
    text: |-
      het een aanvrager betreft, tegen wie een bevel tot terugvordering uitstaat als bedoeld in artikel 1, zesde lid,
      onderdeel a, van de Algemene Groepsvrijstellingsverordening;
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel2.6
  - number: 2.6.c
    text: |-
      er sprake is van ongeoorloofde cumulatie van steun als bedoeld in artikel 8 van de Algemene
      groepsvrijstellingsverordening;
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel2.6
  - number: 2.6.d
    text: |-
      de subsidieverstrekking niet in overeenstemming is met enige andere bepaling van de Algemene
      groepsvrijstellingsverordening;
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel2.6
  - number: 2.6.e
    text: de energie voor de aandrijving van de bouwmachine wordt geleverd door een batterijpakket dat lood bevat;
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel2.6
  - number: 2.6.f
    text: |-
      de onderneming ten tijde van de aanvraag niet staat geregistreerd als onderneming in de bouwsector op basis van de
      Standaard Bedrijfsindeling van het Centraal Bureau voor de Statistiek;
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel2.6
  - number: 2.6.g
    text: |-
      de schriftelijke overeenkomst of overeenkomsten ten behoeve van de maatregelen bedoeld in [artikel 2.1][ref1] ten
      tijde van indiening van de aanvraag reeds is of zijn gesloten en geen contractuele mogelijkheid meer biedt om de
      overeenkomst rechtsgeldig te kunnen ontbinden;


      [ref1]: https://wetten.overheid.nl/BWBR0046464#Artikel2
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel2.6
    references:
      - id: ref1
        bwb_id: BWBR0046464
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.6.h
    text: |-
      de hulpfunctie geen gebruikstoestand kent waarbij de verbrandingsmotor automatisch wordt afgeschakeld als de
      elektromotor van de hulpfunctie wordt gebruikt, en het batterijpakket niet met een stekker oplaadbaar is;
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel2.6
  - number: 2.6.i
    text: |-
      de bouwmachine niet in de handel is gebracht met inachtneming van de voorschriften die bij of krachtens
      [hoofdstuk 3 van het Warenwetbesluit machines][ref1] zijn gesteld of de EG-verklaring van conformiteit of
      geschiktheid, bedoeld in [artikel 26a van de Spoorwegwet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0005577#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0015007#Artikel26a
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel2.6
    references:
      - id: ref1
        bwb_id: BWBR0005577
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0015007
        artikel: 26a
  - number: 2.6.j
    text: |-
      de hulpfunctie niet wordt gemonteerd op een voertuig met tenminste milieuklasse Euro VI of bouwwerktuig met ten
      minste milieuklasse fase V;
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel2.6
  - number: 2.6.k
    text: er al een subsidie is verstrekt voor dezelfde activiteit met betrekking tot dezelfde bouwmachine;
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel2.6
  - number: 2.6.l
    text: de aanvraag niet voldoet aan de in de regeling gestelde regels.
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel2.6
  - number: '2.7'
    text: |-
      De beschikking op een subsidieaanvraag wordt gegeven binnen 13 weken na de datum van ontvangst van de aanvraag.
      Indien de beschikking niet binnen 13 weken kan worden gegeven, kan deze termijn eenmaal met diezelfde termijn
      worden verlengd.
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel2.7
  - number: '2.8'
    text: De Minister verstrekt ambtshalve, gelijktijdig met de beschikking tot subsidieverlening, een voorschot van 70%.
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel2.8
  - number: 2.9.1
    text: |-
      De aanvraag tot vaststelling van de subsidie op grond van dit hoofdstuk wordt uiterlijk 12 maanden na de datum van
      verlening van de subsidie ingediend.
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel2.9
  - number: 2.9.2
    text: |-
      De aanvrager kan bij RVO een verzoek doen tot uitstel van maximaal 12 maanden van de indiening van de aanvraag,
      bedoeld in het eerste lid, indien hij kan aantonen dat de levertijd van de emissieloze bouwmachine langer is dan de
      periode genoemd in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel2.9
  - number: 2.9.3
    text: |-
      Een aanvraag tot subsidievaststelling wordt op grond van dit hoofdstuk ingediend door middel van een daartoe
      vastgesteld formulier dat beschikbaar is via de website van RVO.
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel2.9
  - number: 2.9.4
    text: 'Bij de aanvraag tot vaststelling van de subsidie worden in elk geval de volgende gegevens verstrekt:'
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel2.9
  - number: 2.9.4.a
    text: bijbehorende factuur, waarop het kenteken of serienummer vermeld staat, en het betaalbewijs van de bouwmachine;
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel2.9
  - number: 2.9.4.b
    text: indien van toepassing, het kenteken van de gesubsidieerde bouwmachine;
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel2.9
  - number: 2.9.4.c
    text: foto’s van de aangeschafte bouwmachine, inclusief kenteken of serienummer.
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel2.9
  - number: '2.10'
    text: |-
      Betalingen vinden plaats op een bankrekening die op naam staat van de aanvrager. Het resterende bedrag, na betaling
      van het voorschot, wordt gelijktijdig met de beschikking tot subsidievaststelling verstrekt.
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel2.10
  - number: 2.11.1
    text: |-
      De subsidieontvanger die een subsidie ontvangt op grond van dit hoofdstuk is overeenkomstig de [artikelen 17][ref1]
      en [18 van het Kaderbesluit][ref2] verplicht:


      [ref1]: https://wetten.overheid.nl/BWBR0036381#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0036381#Artikel18
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel2.11
    references:
      - id: ref1
        bwb_id: BWBR0036381
        artikel: '17'
      - id: ref2
        bwb_id: BWBR0036381
        artikel: '18'
  - number: 2.11.1.a
    text: |-
      onverwijld schriftelijk mededeling aan de Minister te doen van gewijzigde omstandigheden of wijziging van zijn
      gegevens die van belang zijn in verband met de subsidieverstrekking op grond van dit hoofdstuk;
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel2.11
  - number: 2.11.1.b
    text: |-
      om op verzoek van de Minister alle gevraagde medewerking te verlenen aan de uitvoering van de verplichtingen die
      zijn gesteld in deze regeling en de beschikkingen;
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel2.11
  - number: 2.11.1.c
    text: |-
      om op verzoek van de Minister alle gevraagde medewerking te verlenen aan een door de Minister ter zake van de
      toepassing en de effecten van deze regeling ingesteld evaluatieonderzoek, die de Minister redelijkerwijs nodig
      heeft voor de uitvoering van dat evaluatieonderzoek.
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel2.11
  - number: 2.11.2
    text: |-
      Zodra het redelijkerwijs aannemelijk is dat niet, niet tijdig of niet geheel aan de aan de subsidie op grond van
      dit hoofdstuk verbonden verplichtingen wordt of zal worden voldaan, doet de subsidieontvanger hiervan onverwijld
      mededeling aan de Minister.
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel2.11
  - number: 2.11.3
    text: |-
      De subsidieontvanger heeft gedurende 48 maanden na vaststelling van de subsidie de gesubsidieerde bouwmachine,
      zonder overdracht aan derden, in eigendom, en gebruikt deze hoofdzakelijk in de bouwsector. Gedurende 48 maanden
      na de vaststelling van de subsidie toont de subsidieontvanger desgevraagd aan dat de bouwmachine hoofdzakelijk in
      Nederland en hoofdzakelijk in de bouwsector is ingezet.
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel2.11
  - number: 2.11.4
    text: 'De subsidieontvanger is verplicht:'
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel2.11
  - number: 2.11.4.a
    text: de bouwmachines met een kentekenbewijs waarvoor subsidie is verstrekt op zijn naam te stellen;
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel2.11
  - number: 2.11.4.b
    text: |-
      indien van toepassing, er zorg voor te dragen dat de bouwmachine gedurende 48 maanden vanaf de eerste datum van
      inschrijving en tenaamstelling op zijn naam is gesteld, of bij operational leasing, een verstrekkingsvoorbehoud in
      het kentekenregister is geplaatst;
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel2.11
  - number: 2.11.4.c
    text: de overeenkomst tot aanschaf te overleggen.
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel2.11
  - number: 2.11.5
    text: |-
      De subsidieontvanger is verplicht medewerking te verlenen aan controles die kunnen worden verricht door de Minister
      om te onderzoeken of door de subsidieontvanger aan de verplichtingen uit dit hoofdstuk is of wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel2.11
  - number: 2.11.6
    text: |-
      De subsidieontvanger beschikt, indien van toepassing, over een geldig keuringsbewijs als bedoeld in
      [artikel 75, eerste lid, van de Wegenverkeerswet 1994][ref1] en is verplicht deze op verzoek van de Minister te
      overleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel75
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel2.11
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '75'
  - number: 2.11.7
    text: |-
      De Minister kan bij de beschikking tot verlening of vaststelling van de subsidie op grond van dit hoofdstuk nadere
      verplichtingen opleggen.
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel2.11
  - number: 2.12.1
    text: |-
      Indien niet is voldaan aan het bepaalde in [artikel 2.11][ref1] kan de Minister, onverminderd het bepaalde in de
      [artikelen 4:49][ref2] en [4:57 van de Algemene wet bestuursrecht][ref3], besluiten de vaststelling van de subsidie
      te wijzigen en het onverschuldigd betaalde deel van de subsidie terug te vorderen.


      [ref1]: https://wetten.overheid.nl/BWBR0046464#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel2.12
    references:
      - id: ref1
        bwb_id: BWBR0046464
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 2.12.2
    text: |-
      Het terug te vorderen bedrag wordt bepaald door de subsidie te verminderen met 1/48e van het verstrekte
      subsidiebedrag vermenigvuldigd met het aantal volledige maanden waarin niet is voldaan aan de verplichtingen,
      genoemd in [artikel 2.11. derde lid][ref1], inzake de verplichting om de bouwmachine in eigendom te houden en
      hoofdzakelijk te gebruiken in de bouwsector in Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0046464#Artikel2
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel2.12
    references:
      - id: ref1
        bwb_id: BWBR0046464
        artikel: '2'
        hoofdstuk: '2'
  - number: '3.1'
    text: |-
      De Minister kan, overeenkomstig het bepaalde bij dit hoofdstuk en [artikel 1.3][ref1], aan een aanvrager subsidie
      verstrekken voor:


      [ref1]: https://wetten.overheid.nl/BWBR0046464#Artikel1
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0046464
        artikel: '1'
        hoofdstuk: '1'
  - number: 3.1.a
    text: |-
      de ombouw van een bouwwerktuig, die beschikt over een motor met een vermogen groter of gelijk aan 19 kW en
      kleiner dan 56 kW waarvoor de fase V emissienorm, bedoeld in de bijlage bij de NRMM-verordening, geldt, tot een
      emissiearm bouwwerktuig door installatie van een SCR-katalysator die leidt tot een bouwwerktuig die voldoet aan de
      limietwaarden voor NO uit Tabel 1 in [bijlage 3][ref1] van deze regeling;


      [ref1]: https://wetten.overheid.nl/BWBR0046464
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0046464
  - number: 3.1.b
    text: |-
      de ombouw van een bouwwerktuig, die beschikt over een motor met een vermogen groter of gelijk aan 56 kW en kleiner
      of gelijk aan 560 kW waarvoor de fase II, fase III A of fase III B emissienormen, bedoeld in de bijlage bij de
      NRMM-verordening, gelden, tot een emissiearm bouwwerktuig door installatie van een SCR-katalysator, die leidt tot
      een bouwwerktuig dat voldoet aan de voor dat bouwwerktuig geldende fase V-emissienormen voor NO, bedoeld in de
      bijlage bij de NRMM-verordening;
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel3.1
  - number: 3.1.c
    text: |-
      de ombouw van een bouwwerktuig met een motorvermogen groter dan 560 kW tot emissiearm bouwwerktuig door installatie
      van een SCR-katalysator, die leidt tot een bouwwerktuig dat voldoet aan de limietwaarden voor NO uit Tabel 1 in
      [bijlage 3][ref1] van deze regeling;


      [ref1]: https://wetten.overheid.nl/BWBR0046464
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0046464
  - number: 3.1.d
    text: |-
      de ombouw van een in gebruik zijnd bouwwerktuig of hulpfunctie tot emissieloos bouwwerktuig of hulpfunctie
      door inbouw en installatie van een elektrische aandrijfmotor met een brandstofcel of een niet loodhoudend
      batterijpakket;
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel3.1
  - number: 3.1.e
    text: |-
      aanschaf en installatie van een nieuwe mono-fuel waterstofverbrandingsmotor vanaf 130 kW die voldoet aan
      emissienorm fase V als bedoeld in de NRMM-Verordening, of de aanschaf en installatie van een nieuwe mono-fuel
      waterstofverbrandingsmotor die op basis van die verordening als gelijkwaardig is erkend, voor een in gebruik
      zijnd bouwwerktuig met een verbrandingsmotor tot en met 560 kW met emissienorm fase IIIB of ouder, of met een
      ongereguleerde verbrandingsmotor vanaf 560 kW;
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel3.1
  - number: 3.1.f
    text: |-
      de aanschaf en installatie van een nieuwe verbrandingsmotor die aantoonbaar tenminste 25% van zijn energie haalt
      uit waterstof of ammonia en voldoet aan de IMO MARPOL Tier III emissienorm in een in gebruik zijnd zeegaand
      bouwvaartuig;
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel3.1
  - number: 3.1.g
    text: |-
      de ombouw van een bestaande verbrandingsmotor op een zeegaand bouwvaartuig zodat deze aantoonbaar tenminste 25% van
      zijn energie haalt uit waterstof of ammonia en voldoet aan de IMO MARPOL Tier III emissienorm;
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel3.1
  - number: 3.1.h
    text: |-
      de aanschaf en inbouw van een elektrische installatie op een zeegaand bouwvaartuig waardoor het vaartuig gebruik
      kan maken van stroom vanaf de wal en het aantoonbaar tenminste 25% van de energie op deze wijze verkrijgt.
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel3.1
  - number: 3.2.1
    text: 'De subsidie bedraagt:'
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel3.2
  - number: 3.2.1.a
    text: |-
      per bouwwerktuig of hulpfunctie, als bedoeld in [artikel 3.1, onderdelen a tot en met g][ref1], ten hoogste een
      percentage van de kosten van de maatregelen, tot een bedrag van ten hoogste € 300.000, waarbij dit percentage 30%
      voor kleine en middelgrote ondernemingen en 25% voor grote ondernemingen is;


      [ref1]: https://wetten.overheid.nl/BWBR0046464#Artikel3
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0046464
        artikel: '3'
        hoofdstuk: '3'
  - number: 3.2.1.b
    text: |-
      voor de maatregel, bedoeld in [artikel 3.1, onderdeel h][ref1], ten aanzien van een zeegaand bouwvaartuig ten
      hoogste 30% van de kosten van de maatregel tot een bedrag van ten hoogste € 300.000;


      [ref1]: https://wetten.overheid.nl/BWBR0046464#Artikel3
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0046464
        artikel: '3'
        hoofdstuk: '3'
  - number: 3.2.1.c
    text: |-
      in afwijking van de onderdelen a en b bedraagt het maximale subsidiebedrag voor een emissieloos bouwwerktuig,
      emissieloze hulpfunctie of elektrische installatie op een zeegaand bouwvaartuig met een continu elektrisch
      motorvermogen groter of gelijk aan 300 kW ten hoogste € 500.000;
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel3.2
  - number: 3.2.1.d
    text: |-
      in het geval van ombouw naar een emissieloos bouwwerktuig dat gebruik maakt van verwisselbare batterijpakketten
      wordt ten hoogste één verwisselbaar batterijpakket tot de netto investeringskosten gerekend, waarbij de subsidie
      voor aanvullende verwisselbare batterijpakketten als bedoeld in [bijlage 1][ref1], onderdeel A, nummer A2.7
      bedraagt:


      [ref1]: https://wetten.overheid.nl/BWBR0046464
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0046464
  - number: 3.2.1.d.a
    text: voor een grote onderneming € 60 per kWh opslag;
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel3.2
  - number: 3.2.1.d.b
    text: voor een kleine of middelgrote onderneming € 85 per kWh opslag.
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel3.2
  - number: 3.2.2
    text: |-
      De kosten per bouwwerktuig, hulpfunctie of zeegaand bouwvaartuig, bedoeld in het eerste lid, worden bepaald op
      basis van de netto investeringskosten die onder [artikel 3.1][ref1] subsidiabel zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0046464#Artikel3
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0046464
        artikel: '3'
        hoofdstuk: '3'
  - number: 3.2.3
    text: |-
      De steunintensiteit wordt per maatregel op een zeegaand bouwvaartuig met 15 procentpunten verhoogd voor subsidie
      aan een kleine of middelgrote onderneming.
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel3.2
  - number: 3.2.4
    text: |-
      [Artikel 2.2, zesde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0046464#Artikel2
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0046464
        artikel: '2'
        hoofdstuk: '2'
  - number: 3.3.1
    text: |-
      Het subsidieplafond voor de maatregelen, bedoeld in [artikel 3.1][ref1] bedraagt:


      [ref1]: https://wetten.overheid.nl/BWBR0046464#Artikel3
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0046464
        artikel: '3'
        hoofdstuk: '3'
  - number: 3.3.1.a
    text: 'voor 2022: € 7.000.000;'
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel3.3
  - number: 3.3.1.b
    text: 'voor 2023: € 14.000.000;'
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel3.3
  - number: 3.3.1.c
    text: 'voor 2024: € 10.000.000;'
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel3.3
  - number: 3.3.1.d
    text: 'voor 2025: € 7.000.000;'
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel3.3
  - number: 3.3.1.e
    text: 'voor 2026: € 3.000.000.'
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel3.3
  - number: 3.3.2
    text: |-
      Indien het subsidieplafond, bedoeld in het eerste lid, onderdeel e, na 1 juni 2026 ontoereikend is om
      alle daarvoor in aanmerking komende aanvragen te kunnen toewijzen, kan het bedrag worden aangevuld met de
      onaangesproken middelen gereserveerd op grond van [artikel 2.3, eerste lid, onderdeel e, onder 1°][ref1], of
      [artikel 4.3, eerste lid, onderdeel e][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0046464#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0046464#Artikel4
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0046464
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0046464
        artikel: '4'
        hoofdstuk: '4'
  - number: 3.3.3
    text: |-
      Indien na 1 juni 2026 budget voor subsidieaanvragen op grond van [hoofdstuk 3][ref1] deels onaangesproken is
      gebleven, kan dit budget gebruikt worden voor aanvragen op grond van [hoofdstuk 2][ref2] of [hoofdstuk 4][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0046464#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0046464#Hoofdstuk2
      [ref3]: https://wetten.overheid.nl/BWBR0046464#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0046464
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0046464
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0046464
        hoofdstuk: '4'
  - number: 3.4.1
    text: |-
      De Minister verdeelt de in de betreffende subsidieperiode beschikbare gelden op volgorde van ontvangst van de
      volledige aanvragen voor subsidies op grond van dit hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel3.4
  - number: 3.4.2
    text: |-
      [Artikel 2.4, tweede en derde lid][ref1], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0046464#Artikel2
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0046464
        artikel: '2'
        hoofdstuk: '2'
  - number: 3.5.1
    text: |-
      Een aanvraag tot subsidieverlening op grond van dit hoofdstuk kan worden ingediend door middel van een daartoe
      vastgesteld formulier dat beschikbaar is via de website van RVO.
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel3.5
  - number: 3.5.2
    text: |-
      Als tijdstip van indiening van een aanvraag geldt de datum van ontvangst van de volledige aanvraag, ingediend bij
      de Minister in de volgende perioden:
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel3.5
  - number: 3.5.2.a
    text: in 2022 9 mei 2022, 9.00 uur tot en met 30 december 2022, 12.00 uur;
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel3.5
  - number: 3.5.2.b
    text: in 2023 van 9 mei 2023, 9.00 uur tot en met 31 oktober 2023, 12.00 uur;
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel3.5
  - number: 3.5.2.c
    text: in 2024 van 5 maart 2024, 9.00 uur tot en met 31 oktober 2024, 12.00 uur;
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel3.5
  - number: 3.5.2.d
    text: in 2025 van 4 maart 2025, 9.00 uur tot en met 31 oktober 2025, 12.00 uur;
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel3.5
  - number: 3.5.2.e
    text: in 2026 van 3 maart 2026, 9.00 uur tot en met 30 oktober 2026, 17.00 uur.
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel3.5
  - number: 3.5.3
    text: |-
      Bij de aanvraag tot verlening van de subsidie op grond van dit hoofdstuk worden in elk geval de volgende gegevens
      verstrekt:
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel3.5
  - number: 3.5.3.a
    text: naam en adres van de aanvrager;
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel3.5
  - number: 3.5.3.b
    text: contactpersoon met contactgegevens van de aanvrager;
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel3.5
  - number: 3.5.3.c
    text: nummer van de Kamer van Koophandel;
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel3.5
  - number: 3.5.3.d
    text: BSN-nummer van de aanvrager indien een onderneming door een natuurlijke persoon wordt gedreven;
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel3.5
  - number: 3.5.3.e
    text: het IBAN-nummer van een bankrekening die op naam staat van de aanvrager;
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel3.5
  - number: 3.5.3.f
    text: |-
      de code of codes verbonden aan de Standaard Bedrijfsindeling van het Centraal Bureau voor de Statistiek van de
      aanvrager op het moment van de aanvraag;
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel3.5
  - number: 3.5.3.g
    text: |-
      een verklaring dat het bouwwerktuig gedurende de instandhoudingstermijn, bedoeld in
      [artikel 3.11, vierde en vijfde lid][ref1], hoofdzakelijk wordt ingezet in de bouwsector;


      [ref1]: https://wetten.overheid.nl/BWBR0046464#Artikel3
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0046464
        artikel: '3'
        hoofdstuk: '3'
  - number: 3.5.3.h
    text: |-
      de schriftelijke overeenkomst of overeenkomsten ten behoeve van het uitvoeren van de maatregelen, bedoeld in
      [artikel 3.1][ref1], ten tijde van de indiening van de aanvraag reeds is of zijn gesloten die ten tijde van de
      aanvraag om subsidieverlening geen onherroepelijke verplichtingen mag bevatten;


      [ref1]: https://wetten.overheid.nl/BWBR0046464#Artikel3
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0046464
        artikel: '3'
        hoofdstuk: '3'
  - number: 3.5.3.i
    text: |-
      indien het een zeegaand bouwvaartuig betreft, een afschrift van een certificaat, bedoeld in de
      [artikelen 4 tot en met 6 van het Schepenbesluit 2004][ref1], waarmee kan worden aangetoond dat het zeegaand
      bouwvaartuig werkzaamheden mag uitvoeren in de Nederlandse exclusieve economische zone;


      [ref1]: https://wetten.overheid.nl/BWBR0016880#Artikel4
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0016880
        artikel: '4'
  - number: 3.5.3.j
    text: indien er een typegoedkeuring is uitgevoerd van de SCR-katalysator, het betreffende bewijsstuk;
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel3.5
  - number: 3.5.3.k
    text: |-
      indien de aanvraag de inbouw van een brandstofcel in een in gebruik zijnd bouwwerktuig of hulpfunctie
      betreft en als het hermotorisering van een in gebruik zijnd bouwwerktuig of hulpfunctie met een mono-fuel
      waterstofverbrandingsmotor betreft, een bewijs dat wordt voldaan aan artikel 36, eerste lid, ter van de Algemene
      groepsvrijstellingsverordening;
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel3.5
  - number: 3.5.3.l
    text: |-
      als onderdeel van de overeenkomst van de maatregelen, bedoeld in [artikel 3.1][ref1], tenminste de volgende
      technische specificaties, indien van toepassing: merk, type, de handelsbenaming en motorvermogen van het bestaande
      bouwwerktuig, en accucapaciteit in kilowattuur, continu elektrisch motorvermogen in kilowatt, vermogen van de
      brandstofcel in kilowatt of vermogen van de nieuwe fase V of IMO MARPOL Tier III motor;


      [ref1]: https://wetten.overheid.nl/BWBR0046464#Artikel3
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0046464
        artikel: '3'
        hoofdstuk: '3'
  - number: 3.5.3.m
    text: |-
      indien het hermotorisering van een in gebruik zijnd bouwwerktuig, hulpfunctie of bouwvaartuig betreft,
      het typegoedkeuringsbewijs respectievelijk het internationaal certificaat betreffende voorkoming van
      luchtverontreiniging door motoren van de nieuwe motor;
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel3.5
  - number: 3.5.3.n
    text: |-
      als onderdeel van de overeenkomst van de maatregelen, bedoeld in [artikel 3.1][ref1], tenminste de volgende
      technische specificaties, indien van toepassing: merk, type, de handelsbenaming en motorvermogen van het bestaande
      bouwwerktuig, en accucapaciteit in kilowattuur, continu elektrisch motorvermogen in kilowatt, vermogen van de
      brandstofcel in kilowatt of vermogen van de nieuwe fase V mono-fuel waterstofverbrandingsmotor of IMO MARPOL Tier
      III motor die tenminste 25% van zijn energie haalt uit waterstof of ammonia;


      [ref1]: https://wetten.overheid.nl/BWBR0046464#Artikel3
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0046464
        artikel: '3'
        hoofdstuk: '3'
  - number: 3.5.3.o
    text: |-
      foto’s van het huidige bouwwerktuig of zeegaand bouwvaartuig, inclusief kenteken of serienummer, in de situatie
      voor de retrofit, waarop de onderdelen zichtbaar zijn waarop de retrofit wordt toegepast.
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel3.5
  - number: '3.6'
    text: |-
      Met toepassing van de in [artikel 12 van het Kaderbesluit][ref1] vermelde afwijzingsgronden, wordt de subsidie in
      ieder geval afgewezen, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0036381#Artikel12
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel3.6
    references:
      - id: ref1
        bwb_id: BWBR0036381
        artikel: '12'
  - number: 3.6.a
    text: er al een subsidie is verstrekt voor dezelfde activiteit met betrekking tot hetzelfde bouwwerktuig;
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel3.6
  - number: 3.6.b
    text: |-
      er sprake is van een onderneming in moeilijkheden als bedoeld in artikel 2, achttiende lid, van de Algemene
      groepsvrijstellingsverordening;
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel3.6
  - number: 3.6.c
    text: |-
      het een aanvrager betreft, tegen wie een bevel tot terugvordering uitstaat als bedoeld in artikel 1, zesde lid,
      onderdeel a, van de Algemene groepsvrijstellingsverordening;
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel3.6
  - number: 3.6.d
    text: |-
      er sprake is van ongeoorloofde cumulatie van steun als bedoeld in artikel 8 van de Algemene
      groepsvrijstellingsverordening;
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel3.6
  - number: 3.6.e
    text: |-
      de subsidieverstrekking niet in overeenstemming is met enige andere bepaling van de Algemene
      groepsvrijstellingsverordening;
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel3.6
  - number: 3.6.f
    text: |-
      de aanvraag betrekking heeft op hetgeen bedoeld is in [artikel 3.1, onderdeel d][ref1], de energie voor de
      aandrijving wordt geleverd door een batterijpakket dat lood bevat;


      [ref1]: https://wetten.overheid.nl/BWBR0046464#Artikel3
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel3.6
    references:
      - id: ref1
        bwb_id: BWBR0046464
        artikel: '3'
        hoofdstuk: '3'
  - number: 3.6.g
    text: |-
      de aanvrager niet staat geregistreerd als onderneming in de bouwsector op basis van de Standaard Bedrijfsindeling
      van het Centraal Bureau voor de Statistiek;
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel3.6
  - number: 3.6.h
    text: |-
      de schriftelijke overeenkomst of overeenkomsten ten behoeve van de maatregelen, bedoeld in [artikel 3.1][ref1], ten
      tijde van indiening van de aanvraag reeds is of zijn gesloten en geen contractuele mogelijkheid meer biedt om de
      overeenkomst rechtsgeldig te kunnen ontbinden;


      [ref1]: https://wetten.overheid.nl/BWBR0046464#Artikel3
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel3.6
    references:
      - id: ref1
        bwb_id: BWBR0046464
        artikel: '3'
        hoofdstuk: '3'
  - number: 3.6.i
    text: |-
      een typegoedkeuring van het nabehandelingssysteem ontbreekt zoals voorgeschreven in [bijlage 3][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0046464
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel3.6
    references:
      - id: ref1
        bwb_id: BWBR0046464
  - number: 3.6.j
    text: |-
      de aanvrager op grond van Europees recht al verplicht is om een maatregel zoals beschreven in [artikel 3.1][ref1]
      uit te voeren;


      [ref1]: https://wetten.overheid.nl/BWBR0046464#Artikel3
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel3.6
    references:
      - id: ref1
        bwb_id: BWBR0046464
        artikel: '3'
        hoofdstuk: '3'
  - number: 3.6.k
    text: |-
      het bouwwerktuig niet in de handel is gebracht met inachtneming van de voorschriften die bij of krachtens
      [hoofdstuk 3 van het Warenwetbesluit machines][ref1] zijn gesteld of zonder EG-verklaring van conformiteit of
      geschiktheid als bedoeld in [artikel 26a van de Spoorwegwet][ref2]; of


      [ref1]: https://wetten.overheid.nl/BWBR0005577#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0015007#Artikel26a
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel3.6
    references:
      - id: ref1
        bwb_id: BWBR0005577
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0015007
        artikel: 26a
  - number: 3.6.l
    text: de aanvraag niet voldoet aan de in de regeling gestelde regels;
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel3.6
  - number: 3.6.m
    text: |-
      de hulpfunctie geen gebruikstoestand kent waarbij de verbrandingsmotor automatisch wordt afgeschakeld als de
      elektromotor van de hulpfunctie wordt gebruikt en het batterijpakket niet met een stekker oplaadbaar is;
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel3.6
  - number: 3.6.n
    text: |-
      de hulpfunctie niet is gemonteerd op een voertuig met ten minste milieuklasse Euro VI of bouwwerktuig met ten
      minste milieuklasse fase V.
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel3.6
  - number: '3.7'
    text: |-
      De beschikking op een aanvraag wordt gegeven binnen 13 weken na de datum van ontvangst van de aanvraag. Indien
      de beschikking niet binnen 13 weken kan worden gegeven, kan deze termijn eenmaal met diezelfde termijn worden
      verlengd.
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel3.7
  - number: '3.8'
    text: De Minister verstrekt ambtshalve, gelijktijdig met de beschikking tot subsidieverlening, een voorschot van 70%.
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel3.8
  - number: 3.9.1
    text: |-
      De aanvraag tot vaststelling van de subsidie op grond van dit hoofdstuk wordt uiterlijk ingediend tot 8 maanden na
      de datum van verlening van de subsidie.
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel3.9
  - number: 3.9.2
    text: |-
      De aanvrager kan bij RVO een verzoek doen tot uitstel van maximaal 4 maanden van de indiening van de
      aanvraag, bedoeld in het eerste lid, indien hij kan aantonen dat de uitvoering van de maatregelen, bedoeld in
      [artikel 3.1][ref1], is vertraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0046464#Artikel3
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel3.9
    references:
      - id: ref1
        bwb_id: BWBR0046464
        artikel: '3'
        hoofdstuk: '3'
  - number: 3.9.3
    text: |-
      Een aanvraag tot subsidievaststelling op grond van dit hoofdstuk wordt ingediend door middel van een daartoe
      vastgesteld formulier dat beschikbaar is via de website van RVO.
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel3.9
  - number: 3.9.4
    text: |-
      De subsidiabele kosten worden gestaafd met bewijsstukken die duidelijk, gespecificeerd en actueel zijn, als bedoeld
      in artikel 7, eerste lid, van de Algemene groepsvrijstellingsverordening.
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel3.9
  - number: 3.9.5
    text: 'Bij de aanvraag tot vaststelling van de subsidie worden in elk geval de volgende gegevens verstrekt:'
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel3.9
  - number: 3.9.5.a
    text: |-
      bijbehorende factuur, waarop het kenteken of serienummer vermeld staat, en het betaalbewijs aangaande maatregelen
      als bedoeld in [artikel 3.1][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0046464#Artikel3
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel3.9
    references:
      - id: ref1
        bwb_id: BWBR0046464
        artikel: '3'
        hoofdstuk: '3'
  - number: 3.9.5.b
    text: indien van toepassing, het kenteken van het gesubsidieerde omgebouwde bouwwerktuig;
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel3.9
  - number: 3.9.5.c
    text: |-
      indien bij de aanvraag subsidieverlening voor een maatregel als bedoeld in
      [artikel 3.1, onderdelen a, b en c][ref1], geen rapport typegoedkeuring aanwezig was, een enkelstuksgoedkeuring
      afgegeven door een gecertificeerd meetbedrijf overeenkomstig ISO 9001, 9003,17020, 17025, VCA, NEN 14001 of daaraan
      gelijk, zoals voorgeschreven is in [bijlage 3][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0046464#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0046464
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel3.9
    references:
      - id: ref1
        bwb_id: BWBR0046464
        artikel: '3'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0046464
  - number: 3.9.5.d
    text: |-
      een verklaring dat het aangepaste bouwwerktuig in de handel is gebracht of in gebruik genomen met inachtneming van
      de voorschriften die bij of krachtens [hoofdstuk 3 van het Warenwetbesluit machines][ref1] zijn gesteld of met EG-
      verklaring van conformiteit of geschiktheid als bedoeld in [artikel 26a van de Spoorwegwet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0005577#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0015007#Artikel26a
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel3.9
    references:
      - id: ref1
        bwb_id: BWBR0005577
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0015007
        artikel: 26a
  - number: 3.9.5.e
    text: |-
      foto’s van het huidige bouwwerktuig, hulpfunctie of zeegaand bouwwerktuig, inclusief kenteken of serienummer, in de
      situatie na de retrofit, waarop de onderdelen zichtbaar zijn waarop de retrofit zijn toegepast.
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel3.9
  - number: '3.10'
    text: |-
      Betalingen vinden plaats op een bankrekening die op naam staat van de aanvrager. Het resterende bedrag, na betaling
      van het voorschot, wordt gelijktijdig met de beschikking tot subsidievaststelling betaald.
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel3.10
  - number: 3.11.1
    text: |-
      De subsidieontvanger die een subsidie ontvangt op grond van dit hoofdstuk is overeenkomstig de [artikelen 17][ref1]
      en [18 van het Kaderbesluit][ref2] verplicht:


      [ref1]: https://wetten.overheid.nl/BWBR0036381#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0036381#Artikel18
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel3.11
    references:
      - id: ref1
        bwb_id: BWBR0036381
        artikel: '17'
      - id: ref2
        bwb_id: BWBR0036381
        artikel: '18'
  - number: 3.11.1.a
    text: |-
      onverwijld schriftelijk mededeling aan de Minister te doen van gewijzigde omstandigheden of wijziging van zijn
      gegevens die van belang zijn in verband met de subsidieverstrekking op grond van op grond van dit hoofdstuk;
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel3.11
  - number: 3.11.1.b
    text: |-
      om op verzoek van de Minister alle gevraagde medewerking te verlenen aan de uitvoering van de verplichtingen die
      zijn gesteld in deze regeling en de beschikkingen;
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel3.11
  - number: 3.11.1.c
    text: |-
      om op verzoek van de Minister alle gevraagde medewerking te verlenen aan een door de Minister ter zake van de
      toepassing en de effecten van deze regeling ingesteld evaluatieonderzoek, die de Minister redelijkerwijs nodig
      heeft voor de uitvoering van dat evaluatieonderzoek.
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel3.11
  - number: 3.11.2
    text: |-
      De subsidieontvanger is verplicht, voor het bouwwerktuig dat met een retrofit-nabehandelingsysteem is uitgerust,
      om gedurende de instandhoudingstermijn jaarlijks, uiterlijk 2 maanden na een volledig jaar nadat de maatregel in
      gebruik is genomen, het verbruik van ureumoplossing, die overeenkomstig ISO 22241 is vervaardigd, te rapporteren.
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel3.11
  - number: 3.11.3
    text: |-
      Op verzoek van de Minister werkt de subsidieontvanger mee aan de monitoring van emissies van het gesubsidieerde
      bouwwerktuig of zeegaand bouwvaartuig overeenkomstig [bijlage 3][ref1] gedurende 48 maanden na vaststelling van
      de subsidie.


      [ref1]: https://wetten.overheid.nl/BWBR0046464
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel3.11
    references:
      - id: ref1
        bwb_id: BWBR0046464
  - number: 3.11.4
    text: |-
      De subsidieontvanger heeft gedurende 48 maanden na vaststelling van de gesubsidieerde ombouw van het bouwwerktuig,
      zonder overdracht aan derden, in eigendom, en gebruikt deze hoofdzakelijk in de bouwsector. Gedurende 48 maanden
      na de vaststelling van de subsidie toont de subsidieontvanger desgevraagd aan dat het bouwwerktuig hoofdzakelijk in
      Nederland en hoofdzakelijk in de bouwsector is ingezet.
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel3.11
  - number: 3.11.5
    text: |-
      De subsidieontvanger heeft gedurende 48 maanden na vaststelling van de subsidie het zeegaand bouwvaartuig, zonder
      overdracht aan derden, in eigendom. Gedurende 48 maanden na de vaststelling van de subsidie van het zeegaand
      bouwvaartuig toont de subsidieontvanger jaarlijks, uiterlijk 2 maanden na een volledig jaar nadat de maatregel
      in gebruik is genomen, met het *Supplytime Charter Agreement* of logboek het aantal dagen aan dat het vaartuig
      werkzaamheden heeft verricht in de Nederlandse exclusieve economische zone. De eis is ten minste gemiddeld 60 dagen
      per jaar gedurende de eerste 48 maanden na vaststelling van de subsidie.
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel3.11
  - number: 3.11.6
    text: |-
      De Minister kan bij de beschikking tot verlening of vaststelling van de subsidie op grond van dit hoofdstuk nadere
      verplichtingen opleggen.
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel3.11
  - number: 3.12.1
    text: |-
      Indien niet is voldaan aan het bepaalde in [artikel 3.11][ref1] kan de Minister, onverminderd het bepaalde in de
      [artikelen 4:49][ref2] en [4:57 van de Algemene wet bestuursrecht][ref3], besluiten de vaststelling van de subsidie
      te wijzigen en het onverschuldigd betaalde deel van de subsidie terug te vorderen.


      [ref1]: https://wetten.overheid.nl/BWBR0046464#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel3.12
    references:
      - id: ref1
        bwb_id: BWBR0046464
        artikel: '3'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 3.12.2
    text: |-
      Het terug te vorderen bedrag wordt bepaald door de subsidie te verminderen met 1/48e van het verstrekte
      subsidiebedrag vermenigvuldigd met het aantal volledige maanden waarin niet is voldaan aan de verplichtingen,
      genoemd in [artikel 3.11, vierde en vijfde lid][ref1], inzake de verplichting om het bouwwerktuig in eigendom te
      houden en hoofdzakelijk te gebruiken in de bouwsector in Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0046464#Artikel3
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel3.12
    references:
      - id: ref1
        bwb_id: BWBR0046464
        artikel: '3'
        hoofdstuk: '3'
  - number: '4.1'
    text: |-
      De Minister kan subsidie verstrekken voor activiteiten die in Nederland worden uitgevoerd en bijdragen aan het
      realiseren van de doelstelling van de regeling als bedoeld in [artikel 1.2, onderdeel c][ref1], in de vorm van:


      [ref1]: https://wetten.overheid.nl/BWBR0046464#Artikel1
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel4.1
    references:
