  - number: '1.2'
    text: |-
      Deze regeling heeft als hoofddoel om de emissie van NO in de bouwsector te verminderen en als nevendoel om de
      emissie van CO en fijnstof te verminderen, door:
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel1.2
  - number: 1.2.a
    text: |-
      de aanschaf van emissieloze bouwmachines en bouwmachines met mono-fuel waterstofverbrandingsmotor voor
      bouwwerkzaamheden door ondernemingen in de bouwsector te stimuleren;
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel1.2
  - number: 1.2.b
    text: |-
      de ombouw van bouwmachines en zeegaande bouwvaartuigen door middel van NO-reducerende maatregelen door
      ondernemingen in de bouwsector te stimuleren;
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel1.2
  - number: 1.2.c
    text: |-
      het ondersteunen van projecten gericht op technologie-, innovatie- en kennisontwikkeling in de pre-commerciële
      fase of aanschaf in het kader van een experimentele ontwikkeling, die een bijdrage leveren aan het bereiken van
      een reductie van met name de emissie van NO, alsmede de emissies van CO, en fijn stof, in de bouwsector, door het
      gebruik van bouwmachines zonder verbrandingsmotor of bouwmachines met mono-fuel waterstofverbrandingsmotor die in
      hun energiebehoefte worden voorzien door elektriciteit, waterstof of niet petrochemische waterstofdragers.
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel1.2
  - number: '1.3'
    text: |-
      Per aanvrager of groep wordt per kalenderjaar ten hoogste € 1.500.000 aan subsidie als bedoeld in de
      [artikelen 2.1][ref1] en [3.1][ref2] verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0046464#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0046464#Artikel3
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel1.3
    references:
      - id: ref1
        bwb_id: BWBR0046464
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0046464
        artikel: '3'
        hoofdstuk: '3'
  - number: '1.4'
    text: |-
      Een subsidie ten laste van een begroting die nog niet is vastgesteld, wordt verleend onder de voorwaarde, bedoeld
      in [artikel 4:34, eerste lid, van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel1.4
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '2.1'
    text: |-
      De Minister kan, overeenkomstig het bepaalde bij dit hoofdstuk en [artikel 1.3][ref1], aan een aanvrager subsidie
      verstrekken voor de aanschaf van één of meerdere emissieloze bouwmachines, of van één of meerdere bouwmachines met
      een mono-fuel waterstofverbrandingsmotor, die voor het eerst in gebruik worden genomen na productie dan wel die
      voor datum vaststelling subsidie voor het eerst zijn ingeschreven en tenaamgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0046464#Artikel1
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0046464
        artikel: '1'
        hoofdstuk: '1'
  - number: 2.2.1
    text: |-
      De subsidie bedraagt per emissieloos bouwwerktuig en emissieloze hulpfunctie ten hoogste een percentage van de
      meerkosten ten opzichte van een referentie-bouwwerktuig of hulpfunctie, tot een bedrag van ten hoogste € 300.000
      als het een emissieloos bouwwerktuig of emissieloze hulpfunctie betreft met een continu elektrisch motorvermogen
      tot 300 kW en ten hoogste € 500.000 als het een emissieloos bouwwerktuig of emissieloze hulpfunctie betreft met een
      continu elektrisch motorvermogen groter of gelijk aan 300 kW, waarbij dit percentage 30% voor kleine en middelgrote
      ondernemingen en 25% voor grote ondernemingen is.
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel2.2
  - number: 2.2.2
    text: 'De meerkosten, bedoeld in het eerste lid, worden per bouwwerktuig of hulpfunctie als volgt bepaald:'
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel2.2
  - number: 2.2.2.a
    text: |-
      in het geval van een emissieloos bouwwerktuig of emissieloze hulpfunctie met uitsluitend een batterijpakket als
      energiedrager, met een continu elektrisch motorvermogen tot 100 kW, door toepassing van de formule: A*kWh + M*kW
      + O, waarbij: A = € 700, kWh = accucapaciteit in kilowattuur, M = € 300, kW = continu elektrisch motorvermogen in
      kilowatt van op het bouwwerktuig of hulpfunctie beschikbare elektromotoren, O = € 7.000;
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel2.2
  - number: 2.2.2.b
    text: |-
      indien de hulpfunctie bedoeld in onderdeel a, energie krijgt van het batterijpakket dat dient voor aandrijving
      van het emissieloos voertuig waarop de hulpfunctie is aangebracht, wordt voor 'accucapaciteit in kilowattuur' nul
      gerekend;
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel2.2
  - number: 2.2.2.c
    text: |-
      in het geval van overige emissieloze bouwwerktuigen en hulpfuncties, op basis van de netto investeringskosten
      verminderd met de netto referentiekosten, waarbij ten hoogste twee verwisselbare batterijpakketten tot de
      subsidiabele meerkosten worden gerekend en de kosten voor extra verwisselbare uitrustingsstukken zijn uitgesloten,
      behalve uitrustingsstukken die alleen geschikt zijn voor de elektrische variant van het bouwwerktuig of de
      hulpfunctie;
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel2.2
  - number: 2.2.2.d
    text: |-
      in het geval een emissieloos bouwwerktuig gebruik maakt van verwisselbare batterijpakketten, door ten hoogste twee
      verwisselbare batterijpakketten tot de subsidiabele meerkosten te rekenen.
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel2.2
  - number: 2.2.3
    text: 'De subsidie bedraagt per emissieloos bouwvoertuig en bouwvoertuig met mono-fuel waterstofverbrandingsmotor:'
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel2.2
  - number: 2.2.3.a
    text: |-
      bij grote ondernemingen 11,1% van de verkoopprijs van het bakwagenchassis exclusief opbouw tot een maximum van
      € 43.900;
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel2.2
  - number: 2.2.3.b
    text: |-
      bij kleine of middelgrote onderneming 21% van de verkoopprijs van het bakwagenchassis exclusief opbouw tot een
      maximum van € 83.200.
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel2.2
  - number: 2.2.4
    text: |-
      In afwijking van het eerste lid bedraagt de subsidie als bedoeld in [bijlage 1][ref1], onderdeel A, nummers A2.2 en
      A2.7, tot een bedrag van ten hoogste € 300.000:


      [ref1]: https://wetten.overheid.nl/BWBR0046464
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0046464
  - number: 2.2.4.a
    text: voor een grote onderneming € 60 per kWh opslag;
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel2.2
  - number: 2.2.4.b
    text: voor een kleine of middelgrote onderneming € 85 per kWh opslag.
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel2.2
  - number: 2.2.5
    text: |-
      In afwijking van het eerste lid bedraagt de subsidie voor bouwmachines als bedoeld in [bijlage 1][ref1], onderdeel
      A, nummer A2.13, tot een bedrag van ten hoogste € 300.000:


      [ref1]: https://wetten.overheid.nl/BWBR0046464
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0046464
  - number: 2.2.5.a
    text: 'voor een grote onderneming 20% van de investeringskosten met een maximum van:'
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel2.2
  - number: 2.2.5.a.1°
    text: € 1.500 per DC laadstation met een vermogen vanaf 20 kW;
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel2.2
  - number: 2.2.5.a.2°
    text: € 3.700 per DC laadstation met een vermogen vanaf 50 kW;
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel2.2
  - number: 2.2.5.a.3°
    text: € 6.600 per DC laadstation met een vermogen vanaf 100 kW of tweemaal 50 kW;
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel2.2
  - number: 2.2.5.a.4°
    text: € 9.200 per DC laadstation met een vermogen vanaf 150 kW of tweemaal 75 kW;
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel2.2
  - number: 2.2.5.a.5°
    text: € 11.700 per DC laadstation met een vermogen vanaf 220 kW of tweemaal 110 kW;
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel2.2
  - number: 2.2.5.a.6°
    text: € 14.000 per DC laadstation met een vermogen vanaf 350 kW of tweemaal 175 kW;
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel2.2
  - number: 2.2.5.a.7°
    text: € 33.000 per DC laadstation met een vermogen vanaf 550 kW of tweemaal 275 kW.
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel2.2
  - number: 2.2.5.b
    text: 'voor een kleine of middelgrote onderneming 40% van de investeringskosten met een maximum van:'
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel2.2
  - number: 2.2.5.b.1°
    text: € 2.900 per DC laadstation met een vermogen vanaf 20 kW;
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel2.2
  - number: 2.2.5.b.2°
    text: € 7.300 per DC laadstation met een vermogen vanaf 50 kW;
