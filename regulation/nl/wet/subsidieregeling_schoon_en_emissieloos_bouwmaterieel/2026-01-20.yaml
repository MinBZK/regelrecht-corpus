  - number: 2.3.2
    text: |-
      Indien een of beide subsidieplafonds, bedoeld in het eerste lid, onderdeel e, na 1 juni 2026 ontoereikend
      zijn om alle daarvoor in aanmerking komende aanvragen te kunnen toewijzen, kunnen de bedragen worden
      aangevuld met de onaangesproken middelen van artikel 2.3, eerste lid, onderdeel e, onder 1° of 2°,
      [artikel 3.3, eerste lid, onderdeel e][ref1], of [artikel 4.3, eerste lid, onderdeel e][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0046464#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0046464#Artikel4
