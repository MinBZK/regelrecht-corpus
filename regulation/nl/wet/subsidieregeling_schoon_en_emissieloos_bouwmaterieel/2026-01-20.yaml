  - number: 2.3.4
    text: |-
      Indien na 1 juni 2026 budget voor subsidieaanvragen op grond van [hoofdstuk 2][ref1] deels onaangesproken is
      gebleven, kan dit budget gebruikt worden voor aanvragen op grond van [hoofdstuk 3][ref2] of [hoofdstuk 4][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0046464#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0046464#Hoofdstuk3
      [ref3]: https://wetten.overheid.nl/BWBR0046464#Hoofdstuk4
