        bwb_id: BWBR0046464
        artikel: '1'
        hoofdstuk: '1'
  - number: 4.1.a
    text: |-
      een project experimentele ontwikkeling dat bijdraagt aan het versnellen van de ontwikkeling van emissieloze
      bouwmachines of bouwmachines met mono-fuel waterstofverbrandingsmotor in de pre-commerciële fase, de uitrol of het
      gebruik van infrastructuur voor alternatieve energiedragers voor emissieloze bouwmachines of oplaadsystemen voor
      het laden al dan niet ontladen van accu’s van emissieloze bouwmachines met uitzondering van de energieopwekking ten
      behoeve van het opladen;
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel4.1
  - number: 4.1.b
    text: |-
      een project haalbaarheidsstudie aangaande de haalbaarheid van een project experimentele ontwikkeling als bedoeld in
      onderdeel a.
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel4.1
  - number: 4.2.1
    text: 'De maximale duur van projecten waarvoor subsidie kan worden verstrekt is:'
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel4.2
  - number: 4.2.1.a
    text: 'bij een project experimentele ontwikkeling: 2 jaar;'
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel4.2
  - number: 4.2.1.b
    text: 'bij een project haalbaarheidsstudie: 6 maanden.'
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel4.2
  - number: 4.2.2
    text: |-
      De aanvrager kan een verzoek doen tot verlenging van de maximale duur van een project, bedoeld in het eerste lid,
      van ten hoogste de helft van de oorspronkelijke looptijd, indien hij kan aantonen dat dit project vanwege overmacht
      is vertraagd.
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel4.2
  - number: 4.3.1
    text: 'Het subsidieplafond bedraagt:'
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel4.3
