  - number: 4.3.2
    text: |-
      Indien een of beide subsidieplafonds, bedoeld in het eerste lid, onderdeel e, na 1 juni 2026 ontoereikend zijn
      om alle daarvoor in aanmerking komende aanvragen te kunnen toewijzen, kunnen de bedragen worden aangevuld met
      de onaangesproken middelen gereserveerd op grond van [artikel 2.3, eerste lid, onderdeel e, onder 1°][ref1],
      [artikel 3.3, eerste lid, onderdeel e][ref2], of artikel 4.3, eerste lid, onderdeel e, onder 1° of 2°.


      [ref1]: https://wetten.overheid.nl/BWBR0046464#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0046464#Artikel3
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel4.3
    references:
      - id: ref1
        bwb_id: BWBR0046464
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0046464
        artikel: '3'
        hoofdstuk: '3'
  - number: 4.3.3
    text: |-
      Indien na 1 juni 2026 budget voor subsidieaanvragen op grond van [hoofdstuk 4][ref1] deels onaangesproken is
      gebleven, kan dit gebruikt worden voor aanvragen op grond van [hoofdstuk 2][ref2] of [hoofdstuk 3][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0046464#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0046464#Hoofdstuk2
      [ref3]: https://wetten.overheid.nl/BWBR0046464#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel4.3
    references:
      - id: ref1
        bwb_id: BWBR0046464
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0046464
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0046464
        hoofdstuk: '3'
  - number: 4.3.4
    text: |-
      Indien een goedgekeurde aanvraag voor een project haalbaarheidsstudie of een project experimentele ontwikkeling
      betrekking heeft op laadinfrastructuur kan budget van [artikel 2.3, eerste lid, onderdeel e, onder 2°][ref1],
      worden ingezet voor aanvragen onder [hoofdstuk 4][ref2] van deze regeling ter hoogte van het aangevraagde bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0046464#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0046464#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel4.3
    references:
      - id: ref1
        bwb_id: BWBR0046464
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0046464
        hoofdstuk: '4'
  - number: 4.4.1
    text: |-
      Een aanvraag tot subsidieverlening voor een project haalbaarheidsstudie kan worden ingediend bij de Minister in de
      volgende perioden:
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel4.4
  - number: 4.4.1.a
    text: in 2022 van 9 mei 2022, 9.00 uur tot en met 30 december 2022, 12.00 uur;
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel4.4
  - number: 4.4.1.b
    text: in 2023 van 9 mei 2023, 9.00 uur tot en met 31 oktober 2023, 12.00 uur;
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel4.4
  - number: 4.4.1.c
    text: in 2024 van 5 maart 2024, 9.00 uur tot en met 31 oktober 2024 12.00 uur;
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel4.4
  - number: 4.4.1.d
    text: in 2025 van 4 maart 2025, 9.00 uur tot en met 31 oktober 2025, 17.00 uur;
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel4.4
  - number: 4.4.1.e
    text: in 2026 van 3 maart 2026, 9.00 uur tot en met 30 oktober 2026, 17.00 uur.
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel4.4
  - number: 4.4.2
    text: |-
      Een aanvraag tot subsidieverlening voor een project experimentele ontwikkeling kan worden ingediend bij de Minister
      in de volgende perioden:
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel4.4
  - number: 4.4.2.a
    text: in 2022 van 31 mei 2022 tot en met 31 augustus 2022, 17.00 uur;
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel4.4
  - number: 4.4.2.b
    text: in 2023 van 9 mei 2023 tot en met 6 september 2023, 17.00 uur;
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel4.4
  - number: 4.4.2.c
    text: in 2024 van 5 maart 2024 tot en met 29 augustus 2024, 17.00 uur;
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel4.4
  - number: 4.4.2.d
    text: in 2025 van 4 maart 2025 tot en met 28 augustus 2025, 17.00 uur;
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel4.4
  - number: 4.4.2.e
    text: in 2026 van 12 mei 2026, 9.00 tot en met 30 oktober 2026, 17.00 uur.
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel4.4
  - number: 4.5.1
    text: |-
      Bij een project experimentele ontwikkeling en een project haalbaarheidsstudie kan, in afwijking van
      [artikel 1.1][ref1], een aanvraag voor subsidie op grond van dit hoofdstuk, worden ingediend door een onderneming
      met een vestiging in Nederland die in staat is de experimentele ontwikkeling, die onderwerp is van het project,
      uit te voeren waarbij het mogelijk is in een samenwerkingsverband van die ondernemingen of een niet-gouvernementele
      organisatie of een publiek-gefinancierde onderzoeksorganisatie uit te voeren, waarbij een van de daaraan
      deelnemende ondernemingen door het samenwerkingsverband is aangewezen als penvoerder.


      [ref1]: https://wetten.overheid.nl/BWBR0046464#Artikel1
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel4.5
    references:
      - id: ref1
        bwb_id: BWBR0046464
        artikel: '1'
        hoofdstuk: '1'
  - number: 4.5.2
    text: |-
      Op aanvragen van een samenwerkingsverband als bedoeld in het eerste lid, zijn [artikel 1][ref1] en
      [26 Kaderbesluit subsidies I en M][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0036381#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0036381#Artikel26
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel4.5
    references:
      - id: ref1
        bwb_id: BWBR0036381
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0036381
        artikel: '26'
  - number: 4.6.1
    text: |-
      Een aanvraag tot subsidieverlening wordt ingediend met gebruikmaking van een door de Minister beschikbaar gesteld
      formulier dat wordt geplaatst op de website van RVO.
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel4.6
  - number: 4.6.2
    text: |-
      Met overeenkomstige toepassing van [artikel 10, vierde lid, van het Kaderbesluit][ref1] bevat een aanvraag in ieder
      geval:


      [ref1]: https://wetten.overheid.nl/BWBR0036381#Artikel10
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel4.6
    references:
      - id: ref1
        bwb_id: BWBR0036381
        artikel: '10'
  - number: 4.6.2.a
    text: de gegevens, bedoeld in artikel 6, tweede lid, van de algemene groepsvrijstellingsverordening;
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel4.6
  - number: 4.6.2.b
    text: |-
      de gegevens, bedoeld in bijlage III van de Algemene groepsvrijstellingsverordening, indien het een aanvraag tot
      subsidieverlening betreft van meer dan € 100.000,-;
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel4.6
  - number: 4.6.2.c
    text: |-
      een onderbouwing van de wijze waarop het eigen aandeel in de projectkosten door de deelnemers van het
      samenwerkingsverband wordt gefinancierd, indien een aanvraag door een onderneming wordt ingediend;
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel4.6
  - number: 4.6.2.d
    text: |-
      een onderbouwing dat de experimentele ontwikkeling die onderwerp is van het haalbaarheidsproject, door de aanvrager
      uitgevoerd kan worden;
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel4.6
  - number: 4.6.2.e
    text: |-
      een onderbouwing van de wijze waarop het eigen aandeel in de projectkosten door de deelnemers van het
      samenwerkingsverband wordt gefinancierd, indien een aanvraag namens de deelnemers van een samenwerkingsverband
      wordt ingediend.
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel4.6
  - number: 4.7.1
    text: |-
      Voor een project haalbaarheidsstudie vindt de subsidieverdeling plaats op volgorde van binnenkomst van volledige
      aanvragen.
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel4.7
  - number: 4.7.2
    text: |-
      Voor een project experimentele ontwikkeling vindt de subsidieverdeling plaats op volgorde van binnenkomst
      van volledige aanvragen die tenminste 70 punten hebben behaald volgens de beoordelingscriteria en maximale
      puntentoedeling zoals vastgelegd in [bijlage 2][ref1] bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0046464
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel4.7
    references:
      - id: ref1
        bwb_id: BWBR0046464
  - number: 4.7.3
    text: |-
      Indien de Minister op de dag waarop het subsidieplafond voor projecten experimentele ontwikkeling is bereikt,
      meerdere volledige aanvragen om subsidieverlening heeft ontvangen, vindt de subsidieverdeling plaats aan de hand
      van een rangschikking, overeenkomstig [artikel 4.8][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0046464#Artikel4
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel4.7
    references:
      - id: ref1
        bwb_id: BWBR0046464
        artikel: '4'
        hoofdstuk: '4'
  - number: 4.7.4
    text: |-
      Indien op de dag waarop het subsidieplafond voor projecten experimentele ontwikkeling is bereikt, twee of meer
      aanvragen op dezelfde plaats in de rangschikking terechtkomen wordt door middel van loting de definitieve plaats in
      de rangschikking bepaald.
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel4.7
  - number: 4.7.5
    text: |-
      In afwijking van het eerste lid en tweede lid vindt, indien een gevraagde subsidie niet geheel doch voor ten minste
      70 procent kan worden verstrekt omdat het subsidieplafond, bedoeld in [4.3][ref1], bijna is bereikt, overleg plaats
      met de aanvrager over het al dan niet geven van een beschikking houdende een afwijking van het subsidiebedrag dat
      is aangevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0046464#Artikel4
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel4.7
    references:
      - id: ref1
        bwb_id: BWBR0046464
        artikel: '4'
        hoofdstuk: '4'
  - number: 4.7.6
    text: |-
      Aan de aanvrager van een subsidie voor een project experimentele ontwikkeling worden maximaal twee subsidies
      verstrekt per aanvraagperiode.
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel4.7
  - number: 4.7.7
    text: |-
      Aan de aanvrager van een subsidie voor een project haalbaarheidsstudie worden maximaal drie subsidies verstrekt
      per aanvraagperiode.
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel4.7
  - number: 4.7.8
    text: |-
      Op aanvragen als bedoeld in het eerste lid, is [artikel 2.4, tweede en derde lid][ref1], van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0046464#Artikel2
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel4.7
    references:
      - id: ref1
        bwb_id: BWBR0046464
        artikel: '2'
        hoofdstuk: '2'
  - number: 4.8.1
    text: |-
      De aanvragen voor projecten experimentele ontwikkeling worden beoordeeld en indien nodig gerangschikt, zoals
      vastgelegd in [bijlage 2][ref1] bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0046464
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel4.8
    references:
      - id: ref1
        bwb_id: BWBR0046464
  - number: 4.8.2
    text: Bij de beoordeling worden punten toegekend, met een maximum van 100 punten per aanvraag.
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel4.8
  - number: '4.9'
    text: |-
      Een subsidieaanvraag wordt, met toepassing van het bepaalde in [artikel 12 van het Kaderbesluit][ref1], in ieder
      geval afgewezen indien:


      [ref1]: https://wetten.overheid.nl/BWBR0036381#Artikel12
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel4.9
    references:
      - id: ref1
        bwb_id: BWBR0036381
        artikel: '12'
  - number: 4.9.a
    text: er al een subsidie is verstrekt op grond van dit hoofdstuk voor hetzelfde project;
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel4.9
  - number: 4.9.b
    text: |-
      er sprake is van ongeoorloofde cumulatie van steun als bedoeld in artikel 8 van de Algemene
      groepsvrijstellingsverordening die de maximale steunintensiteit overschrijdt;
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel4.9
  - number: 4.9.c
    text: |-
      er sprake is van een onderneming of organisatie, bedoeld in [artikel 4.5][ref1], in moeilijkheden als bedoeld in
      artikel 2, achttiende lid, van de Algemene groepsvrijstellingsverordening;


      [ref1]: https://wetten.overheid.nl/BWBR0046464#Artikel4
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel4.9
    references:
      - id: ref1
        bwb_id: BWBR0046464
        artikel: '4'
        hoofdstuk: '4'
  - number: 4.9.d
    text: |-
      de werkzaamheden aan het project reeds zijn aangevangen voordat de aanvraag voor dat project is ingediend en het
      stimulerend effect als bedoeld in artikel 6, tweede lid, van de Algemene groepsvrijstellingsverordening daardoor
      ontbreekt;
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel4.9
  - number: 4.9.e
    text: |-
      de subsidieverstrekking niet in overeenstemming is met enige andere bepaling in de Algemene
      groepsvrijstellingsverordening;
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel4.9
  - number: 4.9.f
    text: |-
      een project experimentele ontwikkeling minder dan 70 punten heeft behaald volgens de beoordelingscriteria en
      maximale puntentoedeling zoals vastgelegd in [bijlage 2 bij deze regeling][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0046464
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel4.9
    references:
      - id: ref1
        bwb_id: BWBR0046464
  - number: 4.9.g
    text: |-
      voor een projectaanvraag niet kan worden aangetoond dat er overleg is geweest of gedurende het project zal zijn
      over toelating met de Rijksdienst voor het Wegverkeer of Inspectie Leefomgeving en Transport, indien toelating tot
      weg, spoor of water essentieel is voor het project;
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel4.9
  - number: 4.9.h
    text: |-
      de aanvrager van een project haalbaarheidsstudie niet in staat wordt geacht om de resultaten daarvan zelf in een
      project experimentele ontwikkeling voort te zetten;
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel4.9
  - number: 4.9.i
    text: |-
      in geval van een project haalbaarheidsstudie de subsidiabele projectkosten voor meer dan 25% bestaan uit testkosten
      ter beantwoording van haalbaarheidsvragen; of
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel4.9
  - number: 4.9.j
    text: de aanvraag niet voldoet aan de in de regeling gestelde regels.
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel4.9
  - number: '4.10'
    text: |-
      De beschikking op een aanvraag wordt gegeven binnen 13 weken na de datum van ontvangst van de aanvraag. Indien
      de beschikking niet binnen 13 weken kan worden gegeven, kan deze termijn eenmaal met diezelfde termijn worden
      verlengd.
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel4.10
  - number: 4.11.1
    text: 'Het maximale subsidiepercentage en het maximale subsidiebedrag bedragen:'
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel4.11
  - number: 4.11.1.a
    text: |-
      bij een project experimentele ontwikkeling: 25% van de in aanmerking komende kosten voor emissieloze bouwmachines
      en infrastructuur voor emissieloze bouwmachines voor alternatieve energiedragers of oplaadsystemen voor het laden
      al dan niet ontladen van accu’s van emissieloze bouwmachines met uitzondering van de energieopwekking ten behoeve
      van het opladen, en maximaal € 1.500.000;
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel4.11
  - number: 4.11.1.b
    text: |-
      bij een project haalbaarheidsstudie: 50% van de in aanmerking komende kosten voor de haalbaarheidsstudie, en
      maximaal € 50.000.
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel4.11
  - number: 4.11.2
    text: |-
      Binnen de kaders van artikel 25, zesde lid onder a, en zevende lid, van de Algemene groepsvrijstellingsverordening,
      wordt de steunintensiteit met 10 procentpunten verhoogd voor subsidie aan middelgrote of kleine ondernemingen.
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel4.11
  - number: 4.11.3
    text: |-
      Conform artikel 25, zesde lid, onderdeel b, van de Algemene groepsvrijstellingsverordening, wordt de
      steunintensiteit met 15 procentpunten verhoogd, indien:
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel4.11
  - number: 4.11.3.a
    text: |-
      de projectresultaten ruim worden verspreid via conferenties, publicaties, open access-repositories, of gratis of
      opensource-software;
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel4.11
  - number: 4.11.3.b
    text: |-
      er sprake is van samenwerking tussen ondernemingen waarvan er ten minste één een kleine of middelgrote onderneming
      is, waarbij geen van de ondernemingen meer dan 70 procent van de in aanmerking komende kosten voor haar rekening
      neemt;
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel4.11
  - number: 4.11.3.c
    text: |-
      er sprake is van samenwerking tussen een onderneming en één of meer organisaties voor onderzoek en
      kennisverspreiding, waarbij deze organisaties ten minste 10% van de in aanmerking komende kosten dragen en het
      recht hebben hun eigen onderzoeksresultaten te publiceren.
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel4.11
  - number: 4.12.1
    text: 'Als subsidiabele kosten komen uitsluitend in aanmerking:'
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel4.12
  - number: 4.12.1.a
    text: |-
      bij een project experimentele ontwikkeling: de kosten als bedoeld in artikel 25, derde lid, van de Algemene
      groepsvrijstellingsverordening;
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel4.12
  - number: 4.12.1.b
    text: |-
      bij een project haalbaarheidsstudie: de kosten, bedoeld in artikel 25, vierde lid, van de Algemene
      groepsvrijstellingsordening.
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel4.12
  - number: 4.12.2
    text: 'Als standaardberekeningswijzen voor de berekening van uurtarieven kunnen worden gehanteerd:'
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel4.12
  - number: 4.12.2.a
    text: een berekening op basis van integrale kostensystematiek;
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel4.12
  - number: 4.12.2.b
    text: |-
      een berekening op basis van kosten per kostendrager vermeerderd met een forfaitair vastgestelde opslag voor
      indirecte kosten; of
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel4.12
  - number: 4.12.2.c
    text: een forfaitair vastgesteld uurtarief voor loonkosten.
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel4.12
  - number: 4.12.3
    text: |-
      De subsidiabele kosten worden gestaafd met bewijsstukken die duidelijk, gespecificeerd en actueel zijn, als bedoeld
      in artikel 7, eerste lid, van de Algemene groepsvrijstellingsverordening.
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel4.12
  - number: 4.13.1
    text: |-
      Bij het hanteren van uurtarieven die tot stand zijn gekomen met de standaardberekeningswijze worden de directe en
      indirecte kosten per kostendrager in een tarief per eenheid van deze kostendrager berekend.
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel4.13
  - number: 4.13.2
    text: |-
      De subsidiabele kosten worden berekend door het aantal eenheden van de kostendrager te vermenigvuldigen met het
      ingevolge het eerste lid berekende tarief, vermeerderd met de aan derden betaalde kosten voor zover deze geen deel
      uitmaken van het ingevolge het eerste lid vastgestelde tarief.
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel4.13
  - number: 4.14.1
    text: |-
      Bij het hanteren van uurtarieven die tot stand zijn gekomen met de standaardberekeningswijze bedoeld in
      [artikel 4.12, tweede lid, onderdeel b][ref1], worden de directe loonkosten per uur vermenigvuldigd met het aantal
      uren dat direct bij de subsidiabele activiteiten betrokken personen ten behoeve van deze activiteiten hebben
      gewerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0046464#Artikel4
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel4.14
    references:
      - id: ref1
        bwb_id: BWBR0046464
        artikel: '4'
        hoofdstuk: '4'
  - number: 4.14.2
    text: 'De subsidiabele kosten worden berekend door het ingevolge het eerste lid berekende bedrag te vermeerderen met:'
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel4.14
  - number: 4.14.2.a
    text: een vaste opslag voor indirecte kosten van 50 procent van de loonkosten;
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel4.14
  - number: 4.14.2.b
    text: |-
      kosten van het gebruik van apparatuur en de kosten van verbruikte materialen en hulpmiddelen indien deze in de
      administratie te onderscheiden zijn; en
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel4.14
  - number: 4.14.2.c
    text: aan derden betaalde kosten.
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel4.14
  - number: 4.14.3
    text: |-
      Voor zover er geen loonkosten worden gemaakt, maar niettemin arbeid wordt verricht, wordt voor de berekening van de
      kosten van de arbeid uitgegaan van € 60,– per uur.
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel4.14
  - number: 4.15.1
    text: |-
      Bij het hanteren van uurtarieven die tot stand zijn gekomen met de standaardberekeningswijze bedoeld in
      [artikel 4.12, tweede lid, onderdeel c][ref1], wordt een uurtarief gehanteerd van € 60,– per uur.


      [ref1]: https://wetten.overheid.nl/BWBR0046464#Artikel4
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel4.15
    references:
      - id: ref1
        bwb_id: BWBR0046464
        artikel: '4'
        hoofdstuk: '4'
  - number: 4.15.2
    text: |-
      De subsidiabele kosten worden berekend door het ingevolge het eerste lid gehanteerde bedrag te vermenigvuldigen met
      het aantal uren dat de direct bij de subsidiabele activiteiten betrokken personen ten behoeve van deze activiteiten
      hebben gewerkt en te vermeerderen met:
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel4.15
  - number: 4.15.2.a
    text: |-
      kosten van het gebruik van apparatuur en de kosten van verbruikte materialen en hulpmiddelen indien deze in de
      administratie te onderscheiden zijn; en
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel4.15
  - number: 4.15.2.b
    text: aan derden betaalde kosten.
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel4.15
  - number: 4.16.1
    text: |-
      De Minister verstrekt ambtshalve, gelijktijdig met de beschikking tot subsidieverlening, voorschotten van 90
      procent van het totaal verleende bedrag.
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel4.16
  - number: 4.16.2
    text: |-
      Bij subsidies op grond van dit hoofdstuk van meer dan € 200.000,– of waarvan de projectduur een jaar of meer is,
      geldt dat het eerste voorschot ambtshalve wordt verstrekt binnen twee weken na de datum van de beschikking tot
      subsidieverlening of binnen twee weken na de in het projectplan aangegeven startdatum, en:
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel4.16
  - number: 4.16.2.a
    text: |-
      de daaropvolgende voorschotten ambtshalve worden verstrekt binnen twee weken na 1 januari, 1 april, 1 juli en
      1 oktober; en
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel4.16
  - number: 4.16.2.b
    text: |-
      met in achtneming van het eerste lid, het voorschot wordt berekend door het totale voorschotbedrag te delen door
      het aantal kwartalen in de periode waarover de subsidie is verleend.
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel4.16
  - number: 4.16.3
    text: |-
      De voorschotverstrekking, bedoeld in het tweede lid, wordt opgeschort zolang de rapportage, bedoeld in
      [artikel 4.17][ref1], in strijd met dat artikel, niet is ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0046464#Artikel4
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel4.16
    references:
      - id: ref1
        bwb_id: BWBR0046464
        artikel: '4'
        hoofdstuk: '4'
  - number: 4.17.1
    text: |-
      De subsidieontvanger dient door middel van een jaarlijkse voortgangsrapportage tijdens de looptijd van het project
      en een eindrapport met een openbaar gedeelte verslag te doen van de mate waarin het project heeft bijgedragen aan
      de doelen van deze regeling zoals opgenomen in [artikel 1.2, onderdeel c][ref1], en [4.1][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0046464#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0046464#Artikel4
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel4.17
    references:
      - id: ref1
        bwb_id: BWBR0046464
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0046464
        artikel: '4'
        hoofdstuk: '4'
  - number: 4.17.2
    text: 'In het verslag, bedoeld in het eerste lid wordt in ieder geval opgenomen:'
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel4.17
  - number: 4.17.2.a
    text: de mate waarin technologische belemmeringen zijn opgelost;
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel4.17
  - number: 4.17.2.b
    text: de mate waarin organisatorische belemmeringen zijn opgelost;
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel4.17
  - number: 4.17.2.c
    text: de mate waarin wet- en regelgeving als belemmerend is ervaren;
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel4.17
  - number: 4.17.2.d
    text: |-
      de invloed die het project heeft gehad op energieverbruik, emissies, kostprijs en toepasbaarheid van de innovatieve
      techniek ten opzichte van het conventionele alternatief waarvoor deze in de plaats komt.
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel4.17
  - number: 4.17.3
    text: |-
      De [artikelen 17][ref1], [18][ref2], [19, eerste en tweede lid][ref3], en [21 van het Kaderbesluit][ref4] zijn
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0036381#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0036381#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0036381#Artikel19
      [ref4]: https://wetten.overheid.nl/BWBR0036381#Artikel21
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel4.17
    references:
      - id: ref1
        bwb_id: BWBR0036381
        artikel: '17'
      - id: ref2
        bwb_id: BWBR0036381
        artikel: '18'
      - id: ref3
        bwb_id: BWBR0036381
        artikel: '19'
      - id: ref4
        bwb_id: BWBR0036381
        artikel: '21'
  - number: 4.18.1
    text: |-
      De aanvraag tot vaststelling van de subsidie op grond van dit hoofdstuk wordt, onverminderd [artikel 4.2][ref1],
      uiterlijk ingediend tot 4 maanden nadat het project is voltooid.


      [ref1]: https://wetten.overheid.nl/BWBR0046464#Artikel4
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel4.18
    references:
      - id: ref1
        bwb_id: BWBR0046464
        artikel: '4'
        hoofdstuk: '4'
  - number: 4.18.2
    text: |-
      Een aanvraag tot subsidievaststelling op grond van dit hoofdstuk wordt ingediend door middel van een daartoe
      vastgesteld formulier dat beschikbaar is via de website van RVO.
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel4.18
  - number: 4.18.3
    text: |-
      Bij de aanvraag tot vaststelling van de subsidie wordt in ieder geval het eindrapport verstrekt en overige
      verplichte verantwoording krachtens [artikel 4.17][ref1], alsmede een overzicht van de gerealiseerde kosten en
      een toelichting op afwijkingen ten opzichte van de begroting, het totale bedrag van de gerealiseerde opbrengsten,
      inclusief bijdragen van derden en het totale bedrag van de gerealiseerde eigen bijdrage.


      [ref1]: https://wetten.overheid.nl/BWBR0046464#Artikel4
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel4.18
    references:
      - id: ref1
        bwb_id: BWBR0046464
        artikel: '4'
        hoofdstuk: '4'
  - number: 4.18.4
    text: 'De subsidieontvanger voegt bij de aanvraag tot subsidievaststelling voor een subsidie van € 125.000 of meer:'
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel4.18
  - number: 4.18.4.a
    text: een financiële verantwoording;
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel4.18
  - number: 4.18.4.b
    text: |-
      indien de gemaakte kosten 10% of meer afwijken van de onderbouwde begrotingspost van de aanvraag: een toelichting
      daarop; en
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel4.18
  - number: 4.18.4.c
    text: een controleverklaring.
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel4.18
  - number: '4.19'
    text: |-
      Betalingen van de Minister vinden plaats op een bankrekening die op naam staat van de aanvrager of, in het
      geval van een samenwerkingsverband, op naam staat van de penvoerder. Het resterende bedrag, na betaling van het
      voorschot, wordt gelijktijdig met de beschikking tot subsidievaststelling verstrekt.
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel4.19
  - number: '4.20'
    text: |-
      Indien niet is voldaan aan het bepaalde in [artikel 4.18][ref1] kan de Minister, onverminderd het bepaalde in de
      [artikelen 4:49][ref2] en [4:57 van de Algemene wet bestuursrecht][ref3], besluiten de vaststelling van de subsidie
      te wijzigen en het onverschuldigd betaalde deel van de subsidie terug te vorderen.


      [ref1]: https://wetten.overheid.nl/BWBR0046464#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel4.20
    references:
