      bouwvoertuigen als bedoeld in de begripsomschrijving van ‘bouwmachine’ [artikel 1.1, onderdeel c][ref1], van 9 mei
      2022, 9.00 uur tot en met 29 juli 2022;


      [ref1]: https://wetten.overheid.nl/BWBR0046464#Artikel1
    url: https://wetten.overheid.nl/BWBR0046464/2026-01-20#Artikel2.5
