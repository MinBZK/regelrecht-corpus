articles:
  - number: '1'
    text: |-
      De voorzitter, de plaatsvervangende voorzitters, de leden en de plaatsvervangende leden van het tuchtcollege voor
      de scheepvaart leggen voor de aanvang van hun werkzaamheden in handen van de president van het College van Beroep
      voor het bedrijfsleven de eed of belofte af overeenkomstig het volgende formulier:

      ‘Ik zweer/verklaar dat ik middellijk noch onmiddellijk, onder welke naam of voorwendsel ook, voor het verkrijgen
      van mijn benoeming tot voorzitter/plaatsvervangend voorzitter / lid/plaatsvervangend lid van het tuchtcollege voor
      de scheepvaart aan iemand iets heb gegeven of beloofd, noch zal geven of beloven;

      ik zweer/verklaar dat ik nimmer enige giften of geschenken hoegenaamd zal aannemen of ontvangen van enig persoon
      van wie ik weet of vermoed dat hij een zaak heeft of zal krijgen bij het tuchtcollege voor de scheepvaart;

      ik zweer/beloof dat ik mij niet op enige wijze zal inlaten met partijen of hun raadslieden of gemachtigden over
      enige zaak die bij het tuchtcollege voor de scheepvaart aanhangig is, of waarvan ik weet of kan vermoeden dat deze
      bij het tuchtcollege voor de scheepvaart aanhangig zal worden gemaakt;

      ik zweer/beloof dat ik geheim zal houden de gegevens waarover ik bij de uitoefening van mijn taak de beschikking
      krijg en waarvan ik het vertrouwelijk karakter ken of redelijkerwijs moet vermoeden, behoudens voorzover enig
      wettelijk voorschrift mij tot mededeling verplicht of uit mijn taak de noodzaak tot mededeling voortvloeit, alsmede
      al hetgeen in de raadkamer over aanhangige zaken is geuit;

      ik zweer/beloof dat ik mijn taak in het tuchtcollege voor de scheepvaart met eerlijkheid, nauwgezetheid en
      onpartijdigheid, zonder aanzien van personen, zal uitoefenen en dat ik niets zal doen dat het aanzien van het
      tuchtcollege voor de scheepvaart kan schaden.

      Zo waarlijk helpe mij God Almachtig! / Dat verklaar en beloof ik!’

      Op ……………………………… heeft ……….………………..………. (1) ten overstaan van de president van het College van Beroep voor het
      bedrijfsleven (2) te ……………………………. de bovenstaande eed/belofte afgelegd.

      (1) ……………………………………

      (2) ……………………………………
    url: https://wetten.overheid.nl/BWBR0016795/2013-08-20#Artikel1
  - number: '2'
    text: |-
      1 De leden en de plaatsvervangende leden ontvangen voor het bijwonen van een zitting van het tuchtcollege voor de
      scheepvaart een vacatiegeld van € 342.–.

      2 De voorzitter en de plaatsvervangende voorzitters ontvangen voor het voorbereiden van een zitting, het leiden
      van een zitting en het voorbereiden van een uitspraak na afloop van een zitting van het tuchtcollege voor de
      scheepvaart een vacatiegeld van € 684,– per activiteit.

      3 De voorzitter ontvangt voor het nemen van een beslissing als bedoeld in
      [artikel 55j, eerste lid, van de Wet zeevarenden][ref1], en voor het beproeven van een minnelijke schikking als
      bedoeld in [artikel 55j, vierde lid, van deze wet][ref2], een vacatiegeld van € 228.–.

      4 De voorzitter ontvangt voor werkzaamheden die verband houden met het algemene functioneren van het tuchtcollege
      een vacatiegeld van € 684,– per dag.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel55j
