preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is regelen te stellen met betrekking tot de opsporing van
    delfstoffen als bedoeld in artikel 2 van de wet van 21 april 1810 (Bulletin des Lois 285) door middel van boringen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002579/1998-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Voor de toepassing van het bij of krachtens deze wet bepaalde wordt verstaan onder:

      *delfstoffen:* delfstoffen als bedoeld in [artikel 2 van de wet van 21 april 1810 (Bulletin des Lois 285)][ref1];

      *Onze Minister:* Onze Minister van Economische Zaken.

      2 Voor de toepassing van het bij of krachtens deze wet bepaalde wordt onder boring uitsluitend verstaan een boring,
      door middel waarvan de aanwezigheid van delfstoffen kan worden aangetoond.


      [ref1]: https://wetten.overheid.nl/BWBR0001821#Artikel2
    url: https://wetten.overheid.nl/BWBR0002579/1998-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001821
        artikel: '2'
  - number: '2'
    text: |-
      1 Het is verboden zonder vergunning van Onze Minister binnen het gebied, waarop de
      [wet van 21 april 1810 (Bulletin des Lois 285)][ref1] van toepassing is, boringen te verrichten.

      2 Het eerste lid geldt niet ten aanzien van het verrichten van boringen door de houder van een krachtens de in dat
      lid genoemde wet verleende concessie in het gebied, waarvoor die concessie geldt, voor zover daarmede niet wordt
      beoogd het aantonen van de aanwezigheid van in de concessie niet vermelde delfstoffen.

      3 Het eerste lid geldt mede niet ten aanzien van het verrichten van boringen, waarmede niet wordt beoogd het
      aantonen van de aanwezigheid van delfstoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0001821
    url: https://wetten.overheid.nl/BWBR0002579/1998-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0001821
  - number: 2a
    text: |-
      Geen vergunning wordt verleend, voor zover dit voortvloeit uit de met betrekking tot de Waddenzee vastgestelde
      planologische kernbeslissing.
    url: https://wetten.overheid.nl/BWBR0002579/1998-01-01#Artikel2a
  - number: 2b
    text: |-
      1 Onverminderd de [artikelen 2][ref1] en [4][ref2] kan een vergunning slechts worden geweigerd:

      a. op grond van de technische of financiële mogelijkheden van de aanvrager,

      b. op grond van de manier waarop de aanvrager voornemens is de opsporing te verrichten in het gebied, waarvoor de
      vergunning wordt aangevraagd, of

      c. in het belang van een doelmatige en voortvarende opsporing en ontginning, indien een keuze moet worden gemaakt
      uit twee of meer aanvragen die bij een beoordeling op grond van de onderdelen *a* en *b* gelijkwaardig zijn
      gebleken.

      2 Onze Minister stelt met het oog op de toepassing van het eerste lid nadere regels vast, die hij bij zijn
      beslissing op een aanvraag om een vergunning voor koolwaterstoffen in acht zal nemen.

      3 Van de plaatsing in de Staatscourant van een besluit tot vaststelling van nadere regels als bedoeld in het tweede
      lid wordt mededeling gedaan in het Publikatieblad van de Europese Gemeenschappen. Een besluit tot wijziging van
      zodanige regels wordt mede bekendgemaakt in het Publikatieblad van de Europese Gemeenschappen.


      [ref1]: https://wetten.overheid.nl/BWBR0002579#Artikel2a
      [ref2]: https://wetten.overheid.nl/BWBR0002579#Artikel4
    url: https://wetten.overheid.nl/BWBR0002579/1998-01-01#Artikel2b
    references:
      - id: ref1
        bwb_id: BWBR0002579
        artikel: 2a
      - id: ref2
        bwb_id: BWBR0002579
        artikel: '4'
  - number: '3'
    text: |-
      1 In een vergunning wordt bepaald voor welke delfstof of voor welke delfstoffen zij geldt.

      2 In een vergunning wordt bepaald voor welk gebied zij geldt. Indien het een vergunning voor koolwaterstoffen
      betreft, geschiedt dit zodanig dat de uitoefening van de activiteiten uit technisch en economisch oogpunt op zo
      goed mogelijke wijze kan plaatsvinden. Onze Minister stelt nadere regels vast met het oog op de toepassing van de
      vorige volzin.

      3 In een vergunning wordt bepaald voor welk tijdvak zij geldt. Indien het een vergunning voor koolwaterstoffen
      betreft, geschiedt dit zodanig dat dit tijdvak niet langer is dan noodzakelijk om de activiteiten, waarvoor de
      vergunning wordt verleend, te verrichten.

      4 Een vergunning kan tevens onder andere beperkingen worden verleend dan die, bedoeld in het eerste, tweede en
      derde lid. Een vergunning voor koolwaterstoffen kan slechts onder andere beperkingen worden verleend, indien deze
      gerechtvaardigd worden door de veiligheid, de landsverdediging, de milieubescherming of een planmatig beheer van
      voorkomens van koolwaterstoffen. Met betrekking tot vergunningen voor koolwaterstoffen is [artikel 4][ref1], van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002579#Artikel4a
    url: https://wetten.overheid.nl/BWBR0002579/1998-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002579
        artikel: 4a
  - number: '4'
    text: |-
      In een vergunning worden ten aanzien van een gebied, waarvoor reeds een krachtens de
      [wet van 21 april 1810 (Bulletin des Lois 285)][ref1] verleende concessie of een vergunning geldt, geen delfstoffen
      vermeld, welke in die concessie of in die vergunning zijn vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0001821
    url: https://wetten.overheid.nl/BWBR0002579/1998-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0001821
  - number: 4a
    text: |-
      1 Aan een vergunning kunnen voorschriften worden verbonden.

      2 Indien het een vergunning voor koolwaterstoffen betreft, kunnen aan de vergunning slechts voorschriften worden
      verbonden indien zij gerechtvaardigd worden door de veiligheid, de landsverdediging, de milieubescherming of een
      planmatig beheer van koolwaterstoffen.

      3 In een vergunning kan worden bepaald dat Onze Minister daarbij omschreven bevoegdheden heeft ter uitvoering van
      daarbij aangewezen voorschriften.

      4 In een vergunning kan worden bepaald dat overtreding van daarbij aangewezen voorschriften een grond is voor
      intrekking van de vergunning.

      5 Bij ministeriële regeling worden nadere regels gesteld met betrekking tot de aan een vergunning voor
      koolwaterstoffen te verbinden voorschriften. Aan een vergunning kunnen geen andere voorschriften worden verbonden
      dan die welke voortvloeien uit de ministeriële regeling.
    url: https://wetten.overheid.nl/BWBR0002579/1998-01-01#Artikel4a
  - number: '5'
    text: |-
      1 Onze Minister stelt regels omtrent de wijze waarop de aanvraag om een vergunning dient te geschieden en
      betreffende de gegevens en de bescheiden, welke daarbij moeten worden overgelegd.

      2 Bij de aanvraag om een vergunning wordt in elk geval overgelegd een plan, volgens hetwelk de aanvrager voornemens
      is activiteiten te verrichten. Een dergelijk plan moet voldoen aan de bij de in het eerste lid bedoelde regels
      gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0002579/1998-01-01#Artikel5
  - number: 5a
    text: |-
      1 Indien een aanvraag om een vergunning wordt ingediend, worden anderen in de gelegenheid gesteld om aanvragen om
      een soortgelijke vergunning in te dienen voor hetzelfde gebied. Hiertoe plaatst Onze Minister een uitnodiging in
      de Staatscourant.

      2 Anderen kunnen aanvragen indienen gedurende dertien weken nadat de uitnodiging in de Staatscourant is geplaatst.

      3 Indien het een aanvraag om een vergunning voor koolwaterstoffen betreft, wordt de uitnodiging tevens geplaatst
      in het Publikatieblad van de Europese Gemeenschappen. In dat geval wordt de in het tweede lid bedoelde termijn
      gerekend vanaf deze plaatsing.

      4 Op de aanvragen wordt tegelijk beslist. De uitnodiging maakt melding van het bepaalde in [artikel 5][ref1].

      5 Het eerste tot en met het vierde lid gelden niet ingeval een aanvraag wordt ingediend binnen twee jaar na de
      indiening van een aanvraag om een vergunning voor dezelfde delfstof voor hetzelfde gebied, zonder dat op die
      aanvraag of op aanvragen van anderen als bedoeld in het tweede lid een vergunning is verleend. Onze Minister deelt
      in het Publikatieblad van de Europese Gemeenschappen mede op welke gebieden de eerste volzin van toepassing is met
      betrekking tot vergunningen voor koolwaterstoffen.

      6 Ten aanzien van overeenkomstig het tweede lid ingediende aanvragen wordt niet opnieuw toepassing gegeven aan het
      eerste tot en met het vierde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002579#Artikel5b
    url: https://wetten.overheid.nl/BWBR0002579/1998-01-01#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0002579
        artikel: 5b
  - number: 5b
    text: |-
      1 Onze Minister beslist op een aanvraag om een vergunning binnen zes maanden na de ontvangst daarvan dan wel,
      indien toepassing is gegeven aan [artikel 5][ref1], binnen zes maanden na afloop van de termijn, bedoeld in
      [artikel 5][ref2].

      2 Onze Minister kan de termijn, waarbinnen hij op een aanvraag dient te beslissen, eenmaal met ten hoogste drie
      maanden verlengen.


      [ref1]: https://wetten.overheid.nl/BWBR0002579#Artikel5a
      [ref2]: https://wetten.overheid.nl/BWBR0002579#Artikel5a
    url: https://wetten.overheid.nl/BWBR0002579/1998-01-01#Artikel5b
    references:
      - id: ref1
        bwb_id: BWBR0002579
        artikel: 5a
      - id: ref2
        bwb_id: BWBR0002579
        artikel: 5a
  - number: '6'
    text: |-
      De werking van een beschikking tot verlening van een vergunning wordt opgeschort totdat de beroepstermijn is
      verstreken of, indien beroep is ingesteld, op het beroep is beslist.
    url: https://wetten.overheid.nl/BWBR0002579/1998-01-01#Artikel6
  - number: '7'
    text: |-
      1 Onze Minister kan een vergunning op aanvraag van de houder wijzigen of intrekken. [Artikel 6][ref1] is van
      overeenkomstige toepassing.

      2 Indien een aanvraag als bedoeld in het eerste lid strekt tot verlenging van het tijdvak waarvoor een vergunning
      geldt, wordt deze slechts ingewilligd indien het in de vergunning vastgestelde tijdvak onvoldoende is om de
      activiteiten, waarvoor de vergunning geldt, te voltooien en deze activiteiten zijn verricht in overeenstemming met
      de vergunning.

      3 Onze Minister kan een vergunning anders dan op aanvraag intrekken, indien de houder een aan een vergunning
      verbonden voorschrift, waarbij is bepaald dat overtreding daarvan een grond is voor het intrekken van de
      vergunning, heeft overtreden, en, nadat Onze Minister hem schriftelijk heeft gewaarschuwd, zich voortdurend of
      opnieuw aan overtreding van dat voorschrift schuldig maakt of, zo het voorschrift een verplichting om te doen
      inhoudt, deze verplichting niet alsnog nakomt.

      4 Onze Minister kan een vergunning anders dan op aanvraag intrekken, indien de vergunning niet langer nodig is voor
      de goede uitvoering van de activiteiten waarvoor zij geldt. Hij doet dit onder de genoemde omstandigheden in elk
      geval, indien het een vergunning voor koolwaterstoffen betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0002579#Artikel6
    url: https://wetten.overheid.nl/BWBR0002579/1998-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002579
        artikel: '6'
  - number: '8'
    text: |-
      Met het aantonen van de aanwezigheid van delfstoffen door middel van een boring, waarmede een aanvang
      is gemaakt na 14 december 1965, wordt bij de toepassing van de [artikelen 16][ref1], tweede lid, en
      [46 van de wet van 21 april 1810 (Bulletin des Lois 285)][ref2] slechts rekening gehouden, indien de aanwezigheid
      van een delfstof is aangetoond door de houder van een vergunning, waarin die delfstof is vermeld, met gebruikmaking
      van die vergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0001821#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0001821#Artikel46
    url: https://wetten.overheid.nl/BWBR0002579/1998-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0001821
        artikel: '16'
      - id: ref2
        bwb_id: BWBR0001821
        artikel: '46'
  - number: '9'
    text: |-
      Onze Minister is bevoegd tot toepassing van bestuursdwang ingeval een boring wordt verricht in strijd met het
      bepaalde bij of krachtens deze wet.
    url: https://wetten.overheid.nl/BWBR0002579/1998-01-01#Artikel9
  - number: '12'
    text: 'Deze wet kan worden aangehaald als: Wet opsporing delfstoffen.'
    url: https://wetten.overheid.nl/BWBR0002579/1998-01-01#Artikel12
  - number: '13'
    text: |-
      Deze wet treedt in werking met ingang van de dag na de datum van uitgifte van het *Staatsblad,* waarin zij wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0002579/1998-01-01#Artikel13
