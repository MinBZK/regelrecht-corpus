---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: onderwijsregeling_inburgering_nieuwkomers_1998
regulatory_layer: WET
publication_date: '2004-12-22'
valid_from: '2003-12-01'
bwb_id: BWBR0009005
url: https://wetten.overheid.nl/BWBR0009005/2003-12-01
preamble:
  text: |-
    Gelet op de artikelen 2.3.1, eerste lid, derde volzin, en 12.3.48, tweede lid, van de Wet educatie en
    beroepsonderwijs,

    Besluit:
  url: https://wetten.overheid.nl/BWBR0009005/2003-12-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze regeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0009005/2003-12-01#Artikel1
  - number: 1.a
    text: 'minister: de minister van onderwijs, cultuur en wetenschappen;'
    url: https://wetten.overheid.nl/BWBR0009005/2003-12-01#Artikel1
  - number: 1.b
    text: 'wet: de Wet educatie en beroepsonderwijs;'
    url: https://wetten.overheid.nl/BWBR0009005/2003-12-01#Artikel1
  - number: 1.c
    text: 'bekostigingsbesluit: het Bekostigingsbesluit welzijnsbeleid;'
    url: https://wetten.overheid.nl/BWBR0009005/2003-12-01#Artikel1
  - number: 1.d
    text: 'welzijnsregeling: de Welzijnsregeling inburgering nieuwkomers;'
    url: https://wetten.overheid.nl/BWBR0009005/2003-12-01#Artikel1
  - number: 1.e
    text: |-
      educatieve component: de inburgering, bedoeld in artikel 2.3.1, eerste lid, derde volzin, van de wet, die wordt
      verzorgd door een instelling;
    url: https://wetten.overheid.nl/BWBR0009005/2003-12-01#Artikel1
  - number: 1.f
    text: |-
      welzijnscomponent: de welzijnscomponent van het inburgeringsprogramma, bedoeld in artikel 6 van de
      welzijnsregeling;
    url: https://wetten.overheid.nl/BWBR0009005/2003-12-01#Artikel1
  - number: 1.g
    text: 'instelling: een instelling als bedoeld in artikel 1.3.1, eerste lid, van de wet;'
    url: https://wetten.overheid.nl/BWBR0009005/2003-12-01#Artikel1
  - number: 1.h
    text: |-
      inburgeringsovereenkomst: een schriftelijk document als bedoeld in artikel 52, derde lid, onder b, van het
      bekostigingsbesluit;
    url: https://wetten.overheid.nl/BWBR0009005/2003-12-01#Artikel1
  - number: 1.i
    text: 'overeenkomst: een overeenkomst als bedoeld in artikel 4, eerste lid;'
    url: https://wetten.overheid.nl/BWBR0009005/2003-12-01#Artikel1
  - number: 1.j
    text: 'onderwijsovereenkomst: een overeenkomst als bedoeld in artikel 3, eerste lid;'
    url: https://wetten.overheid.nl/BWBR0009005/2003-12-01#Artikel1
  - number: 1.k
    text: |-
      nieuwkomer: de persoon die naar het oordeel van de gemeente van eerste huisvesting het risico loopt in een
      achterstandspositie te geraken en die behoort tot de groep personen:
    url: https://wetten.overheid.nl/BWBR0009005/2003-12-01#Artikel1
  - number: 1.k.1
    text: die met toepassing van artikel 15, eerste lid, van de Vreemdelingenwet als vluchteling zijn toegelaten;
    url: https://wetten.overheid.nl/BWBR0009005/2003-12-01#Artikel1
  - number: 1.k.2
    text: |-
      wier verzoek om toelating als vluchteling is afgewezen, onder verlening, gelijktijdig of nadien, van een
      vergunning tot verblijf op humanitaire gronden als bedoeld in artikel 9 van de Vreemdelingenwet, zonder dat daaraan
      beperkingen zijn verbonden;
    url: https://wetten.overheid.nl/BWBR0009005/2003-12-01#Artikel1
  - number: 1.k.3
    text: aan wie een voorwaardelijke vergunning tot verblijf als bedoeld in artikel 9a van de Vreemdelingenwet is verleend;
    url: https://wetten.overheid.nl/BWBR0009005/2003-12-01#Artikel1
  - number: 1.k.4
    text: |-
      die gezinshereniger of -vormer is als bedoeld in artikel 9 van de Vreemdelingenwet, of 5. die Nederlander en
      afkomstig van de Nederlandse Antillen of Aruba is;
    url: https://wetten.overheid.nl/BWBR0009005/2003-12-01#Artikel1
  - number: 1.l
    text: |-
      nieuwkomer-deelnemer: de nieuwkomer van 18 jaar of ouder, die deelnemer is als bedoeld in artikel 8.1.1, eerste
      juncto zesde lid, van de wet en die op grond van een overeenkomst binnen een termijn van uiterlijk 4 maanden
      na eerste huisvesting, in 1998 een onderwijsovereenkomst heeft gesloten, of, voor zover naar het oordeel van de
      gemeente van eerste huisvesting redelijkerwijs sprake is van zwaarwegende omstandigheden, gelegen in de persoon van
      de nieuwkomer, binnen een termijn van uiterlijk 10 maanden na eerste huisvesting, in 1998 een onderwijsovereenkomst
      heeft gesloten;
    url: https://wetten.overheid.nl/BWBR0009005/2003-12-01#Artikel1
  - number: 1.m
    text: 'toets: de in opdracht van de minister aangewezen toets, bedoeld in artikel 3, tweede lid, onder b;'
    url: https://wetten.overheid.nl/BWBR0009005/2003-12-01#Artikel1
  - number: 1.n
    text: |-
      examen: het examen, bedoeld in het Staatsexamenbesluit Nederlands als tweede taal, afgenomen volgens programma I of
      programma II;
    url: https://wetten.overheid.nl/BWBR0009005/2003-12-01#Artikel1
  - number: 1.o
    text: |-
      gemeente: een gemeente als bedoeld in artikel 2, eerste lid, dan wel de in artikel 2, derde lid, bedoelde gemeente
      of publiekrechtelijke rechtspersoon;
    url: https://wetten.overheid.nl/BWBR0009005/2003-12-01#Artikel1
  - number: 1.p
    text: |-
      geraamde aantal nieuwkomers: het in kolom a van de in de bijlage bij deze regeling opgenomen aantal nieuwkomers
      per gemeente;
    url: https://wetten.overheid.nl/BWBR0009005/2003-12-01#Artikel1
  - number: 1.q
    text: 'rijksbijdrage: de rijksbijdrage, bedoeld in artikel 2.3.1, eerste lid, derde volzin, van de wet;'
    url: https://wetten.overheid.nl/BWBR0009005/2003-12-01#Artikel1
  - number: 1.r
    text: 'welzijnsuitkering: de uitkering op grond van de welzijnsregeling.'
    url: https://wetten.overheid.nl/BWBR0009005/2003-12-01#Artikel1
  - number: '2.1'
    text: |-
      De minister maakt aan de gemeenten in november 1997 bekend welke rijksbijdrage voor de gemeenten voor het jaar 1998
      wordt verstrekt. De minister verstrekt de rijksbijdrage in 1998 aan de gemeenten, vermeld in de bijlage bij deze
      regeling, op grond van het geraamde aantal nieuwkomers van de gemeente. De rijksbijdrage wordt uitgekeerd volgens
      een door de minister te bepalen kasritme.
    url: https://wetten.overheid.nl/BWBR0009005/2003-12-01#Artikel2
  - number: '2.2'
    text: |-
      De rijksbijdrage bedraagt ƒ 8.185,24 voor elke geraamde nieuwkomer. De hoogte van de rijksbijdrage wordt in 1998
      aangepast in verband met de toepasselijke algemene salaris- en andere maatregelen en in verband met de opslag in
      verband met werkloosheidsuitkeringen.
    url: https://wetten.overheid.nl/BWBR0009005/2003-12-01#Artikel2
  - number: '2.3'
    text: |-
      De gemeente kan in het jaar 1998 samenwerken met één of meer andere gemeenten door het gehele bedrag van de
      rijksbijdrage tezamen met één of meer andere gemeenten te besteden, indien tevens voor het gehele bedrag van de
      welzijnsuitkering gezamenlijke besteding plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0009005/2003-12-01#Artikel2
  - number: '2.4'
    text: |-
      In geval van samenwerking als bedoeld in het derde lid, wijzen de samenwerkende gemeenten een gemeente aan die
      namens de samenwerkende gemeenten de rijksbijdrage ontvangt en verantwoordt. Deze gemeente draagt zorg voor de
      informatie, bedoeld in artikel 10.
    url: https://wetten.overheid.nl/BWBR0009005/2003-12-01#Artikel2
  - number: '2.5'
    text: |-
      In geval van samenwerking als bedoeld in het derde lid, ontvangt de minister uiterlijk op 1 december 1997 daarover
      een melding van de gemeenten die samenwerken, met inachtneming van het zesde en zevende lid.
    url: https://wetten.overheid.nl/BWBR0009005/2003-12-01#Artikel2
  - number: '2.6'
    text: 'De melding bevat van de betrokken gemeenten:'
    url: https://wetten.overheid.nl/BWBR0009005/2003-12-01#Artikel2
  - number: 2.6.a
    text: de namen van de gemeenten die samenwerken,
    url: https://wetten.overheid.nl/BWBR0009005/2003-12-01#Artikel2
  - number: 2.6.b
    text: de naam van de gemeente, bedoeld in het vierde lid, en
    url: https://wetten.overheid.nl/BWBR0009005/2003-12-01#Artikel2
  - number: 2.6.c
    text: |-
      een verklaring van burgemeester en wethouders van iedere gemeente houdende machtiging tot ontvangst en
      verantwoording van de rijksbijdrage door de gemeente, bedoeld in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0009005/2003-12-01#Artikel2
  - number: '2.7'
    text: |-
      Uitsluitend meldingen die voldoen aan de voorwaarden, bedoeld in het zesde lid, worden in behandeling genomen. In
      geval van een onvolledige melding stelt de minister de gemeente die de melding heeft verzorgd, in de gelegenheid
      het verzuim te herstellen.
    url: https://wetten.overheid.nl/BWBR0009005/2003-12-01#Artikel2
  - number: '2.8'
    text: |-
      De rijksbijdrage strekt tot vergoeding van de kosten van de educatieve component van de nieuwkomerdeelnemers van
      de gemeente in 1998, en kan voor zover deze niet wordt besteed aan de educatieve component, worden besteed aan
      de welzijnscomponent.
    url: https://wetten.overheid.nl/BWBR0009005/2003-12-01#Artikel2
  - number: '2.9'
    text: |-
      De rijksbijdrage kan, voorzover zij aantoonbaar niet kan worden besteed aan het aantal nieuwkomerdeelnemers van de
      gemeente in 1998, worden besteed aan educatie als bedoeld in artikel 2.3.1, eerste lid, tweede volzin, van de wet
      dan wel worden gereserveerd ten behoeve van een van de doeleinden, genoemd in het achtste lid.
    url: https://wetten.overheid.nl/BWBR0009005/2003-12-01#Artikel2
  - number: '2.10'
    text: |-
      De rijksbijdrage wordt verstrekt onder voorbehoud van goedkeuring van de beschikbare middelen door de
      begrotingswetgever.
    url: https://wetten.overheid.nl/BWBR0009005/2003-12-01#Artikel2
  - number: '3.1'
    text: |-
      De gemeente draagt er zorg voor dat de educatieve component voor de nieuwkomers van de gemeente beschikbaar is
      en draagt tevens zorg voor het totstandkomen van een onderwijsovereenkomst tussen de nieuwkomer-deelnemer en de
      instelling.
    url: https://wetten.overheid.nl/BWBR0009005/2003-12-01#Artikel3
  - number: '3.2'
    text: |-
      Op de onderwijsovereenkomst is artikel 8.1.3 van de wet van overeenkomstige toepassing. De onderwijsovereenkomst
      bevat voorts ten minste:
    url: https://wetten.overheid.nl/BWBR0009005/2003-12-01#Artikel3
  - number: 3.2.a
    text: de datum waarop de nieuwkomer-deelnemer door het bevoegd gezag van de instelling is ingeschreven;
    url: https://wetten.overheid.nl/BWBR0009005/2003-12-01#Artikel3
  - number: 3.2.b
    text: |-
      een verplichting tot het afleggen door de nieuwkomer-deelnemer en het afnemen door de instelling van een toets
      waaruit het door de nieuwkomer-deelnemer bereikte niveau en de mogelijkheden voor vervolgopleidingen kunnen worden
      afgeleid en waarbij het niveau van de nieuwkomer-deelnemer wordt gemeten in relatie tot het niveau van de opleiding
      Nederlands als tweede taal I en II, bedoeld in artikel 7.3.1, eerste lid, onderdeel c, van de wet;
    url: https://wetten.overheid.nl/BWBR0009005/2003-12-01#Artikel3
  - number: 3.2.c
    text: |-
      de verplichting tot het verstrekken door de instelling van een document aan de nieuwkomer-deelnemer en de gemeente
      waaruit het in onderdeel b bedoelde niveau, de mogelijkheden voor vervolgopleidingen en het aantal lesuren dat
      de nieuwkomer-deelnemer heeft deelgenomen aan een opleiding Nederlands als tweede taal I en II, bedoeld onder b,
      blijken;
    url: https://wetten.overheid.nl/BWBR0009005/2003-12-01#Artikel3
  - number: 3.2.d
    text: |-
      de verplichting van de nieuwkomer-deelnemer tot het volgen van het op grond van de overeenkomst tussen gemeente en
      instelling in de inburgeringsovereenkomst overeengekomen onderwijs, met dien verstande dat de nieuwkomer-deelnemer
      van deze verplichting is ontheven indien de nieuwkomer-deelnemer naar het oordeel van de instelling het niveau van
      het examen heeft bereikt.
    url: https://wetten.overheid.nl/BWBR0009005/2003-12-01#Artikel3
  - number: '4.1'
    text: |-
      De gemeente sluit ter uitvoering van de in artikel 3 bedoelde zorgplicht met één of meer instellingen een
      overeenkomst voor de educatieve activiteiten van de nieuwkomers die naar het oordeel van de gemeente in een
      achterstandssituatie dreigen te geraken.
    url: https://wetten.overheid.nl/BWBR0009005/2003-12-01#Artikel4
  - number: '4.2'
    text: |-
      Op de overeenkomst is artikel 2.3.4, tweede lid, van de wet van overeenkomstige toepassing. Uit de overeenkomst
      blijkt tevens:
    url: https://wetten.overheid.nl/BWBR0009005/2003-12-01#Artikel4
  - number: 4.2.a
    text: |-
      welk onderwijs de instelling ten behoeve van één of meer nieuwkomer-deelnemers verzorgt, met dien verstande dat dit
      onderwijs zal worden gebaseerd op een gemiddelde omvang van 600 uur per nieuwkomerdeelnemer;
    url: https://wetten.overheid.nl/BWBR0009005/2003-12-01#Artikel4
  - number: 4.2.b
    text: |-
      dat de instelling zich ertoe verplicht om de nieuwkomer-deelnemer binnen 1 jaar na de inschrijving in de
      gelegenheid te stellen de toets af te leggen;
    url: https://wetten.overheid.nl/BWBR0009005/2003-12-01#Artikel4
  - number: 4.2.c
    text: dat de instelling de gemeente zal informeren bij onvoldoende deelname van een nieuwkomer-deelnemer;
    url: https://wetten.overheid.nl/BWBR0009005/2003-12-01#Artikel4
  - number: 4.2.d
    text: de prijs van het tussen gemeente en instelling tevoren overeengekomen onderwijs;
    url: https://wetten.overheid.nl/BWBR0009005/2003-12-01#Artikel4
  - number: 4.2.e
    text: het aantal nieuwkomer-deelnemers waarmee een onderwijsovereenkomst kan worden gesloten;
    url: https://wetten.overheid.nl/BWBR0009005/2003-12-01#Artikel4
  - number: 4.2.f
    text: |-
      dat er sprake is van een verplichting tot registratie en informatie-uitwisseling tussen de instelling en
      de gemeente met betrekking tot de voor de goede uitvoering van deze regeling benodigde informatie over de
      inschrijving, de onderwijsovereenkomst, de studievoortgang, de aanwezigheid of onvoldoende deelname van de
      nieuwkomer-deelnemers, de door de nieuwkomerdeelnemers bij de instelling afgelegde toetsen, alsmede de behaalde
      examens.
    url: https://wetten.overheid.nl/BWBR0009005/2003-12-01#Artikel4
  - number: '10'
    text: |-
      Ten aanzien van de gemeente en ten aanzien van de instelling is het bij of krachtens artikel 2.3.6 van de wet
      bepaalde van toepassing.
    url: https://wetten.overheid.nl/BWBR0009005/2003-12-01#Artikel10
  - number: '11'
    text: |-
      De gemeente werkt mee aan de door of namens de minister in te stellen onderzoeken naar de effecten van deze
      regeling.
    url: https://wetten.overheid.nl/BWBR0009005/2003-12-01#Artikel11
  - number: '12'
    text: |-
      De gemeente verleent ten behoeve van het door de minister te voeren beleid met betrekking tot inburgering, aan de
      minister of een door hem aan te wijzen persoon volledige inzage in de boeken en bescheiden of informatie op andere
      informatiedragers, en geeft de minister of een door hem aan te wijzen persoon toegang tot de door de gemeente
      gebruikte plaatsen. Aan bedoelde persoon worden alle inlichtingen verstrekt die deze voor de uitvoering van zijn
      taak nodig oordeelt.
    url: https://wetten.overheid.nl/BWBR0009005/2003-12-01#Artikel12
  - number: '13'
    text: |-
      De gemeente bewaart de boeken, bescheiden en informatie op andere informatiedragers die verband houden met de
      toepassing van deze regeling, gedurende tenminste 5 jaar na de datum waarop die toepassing heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0009005/2003-12-01#Artikel13
  - number: '14'
    text: |-
      Deze regeling zal met de daarbij behorende toelichting in Uitleg OCenW-Regelingen worden geplaatst. Van deze
      plaatsing zal mededeling worden gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0009005/2003-12-01#Artikel14
  - number: '15'
    text: |-
      Deze regeling treedt in werking met ingang van 1 januari 1998, met uitzondering van artikel 2, eerste, vijfde
      en zevende lid, dat in werking treedt met ingang van de derde dag na de datum van uitgifte van Uitleg OCenW-
      Regelingen, waarin deze regeling is geplaatst.
    url: https://wetten.overheid.nl/BWBR0009005/2003-12-01#Artikel15
  - number: '16'
    text: 'Deze regeling wordt aangehaald als: Onderwijsregeling inburgering nieuwkomers 1998.'
    url: https://wetten.overheid.nl/BWBR0009005/2003-12-01#Artikel16
