preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het noodzakelijk is een tijdelijke regeling te treffen voor het
    insluiten van verdachten van en veroordeelden terzake van overtreding van bepalingen van de Opiumwet die betrekking
    hebben op het binnen of buiten het grondgebied van Nederland brengen van bij of krachtens de Opiumwet verboden
    middelen, zulks in afwijking van het bepaalde bij of krachtens de Penitentiaire beginselenwet en de Beginselenwet
    justitiële jeugdinrichtingen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#ArtikelAanhef
articles:
  - number: '1'
    text: 'Voor de toepassing van deze wet wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel1
  - number: 1.a
    text: 'Onze Minister: Onze Minister van Justitie;'
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel1
  - number: 1.b
    text: 'voorziening: een door Onze Minister aangewezen plaats als bedoeld in artikel 4, eerste lid;'
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel1
  - number: 1.c
    text: |-
      directeur: de persoon, bedoeld in artikel 4, derde lid, alsmede diens vervanger of vervangers, bedoeld in artikel
      4, vierde lid;
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel1
  - number: 1.d
    text: 'gedetineerde: een persoon als bedoeld in artikel 2;'
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel1
  - number: 1.e
    text: |-
      ambtenaar of medewerker: een persoon die een taak uitoefent in het kader van de tenuitvoerlegging van de
      inverzekeringstelling, voorlopige hechtenis of gevangenisstraf van de in artikel 2 bedoelde personen;
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel1
  - number: 1.f
    text: 'selectiefunctionaris: een persoon als bedoeld in artikel 6;'
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel1
  - number: 1.g
    text: |-
      rechtsbijstandverlener: de advocaat of de medewerker van de stichting, bedoeld in
      [artikel 22, eerste lid, van de Wet op de rechtsbijstand][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel22
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: '22'
  - number: 1.h
    text: 'Raad: de Raad voor strafrechtstoepassing en jeugdbescherming;'
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel1
  - number: 1.i
    text: 'commissie van toezicht: een commissie als bedoeld in artikel 5a;'
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel1
  - number: 1.j
    text: 'beroepscommissie: een commissie als bedoeld in artikel 41, eerste lid;'
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel1
  - number: 1.k
    text: 'beklagcommissie: een commissie als bedoeld in artikel 33;'
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel1
  - number: 1.l
    text: 'verblijfsruimte: de aan een gedetineerde door de directeur ingevolge artikel 8, eerste lid, toegewezen ruimte;'
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel1
  - number: 1.m
    text: 'huisregels: regels als bedoeld in artikel 5, eerste lid.'
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel1
  - number: '2'
    text: |-
      Deze wet is van toepassing op personen ten aanzien van wie, wegens overtreding, dan wel verdenking van overtreding,
      van [artikel 2, eerste lid, aanhef en onder A, van de Opiumwet][ref1], de inverzekeringstelling of de voorlopige
      hechtenis is bevolen of die wegens een dergelijke overtreding zijn veroordeeld en die zijn geplaatst in een
      voorziening als bedoeld in artikel 4, eerste lid, en die ten tijde van de plaatsing zestien jaar of ouder zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0001941#Artikel2
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0001941
        artikel: '2'
  - number: 2a
    text: |-
      Personen ten aanzien van wie vanaf 25 januari 2002 wegens verdenking van overtreding van
      [artikel 2, eerste lid, aanhef en onder A, van de Opiumwet][ref1] de inverzekeringstelling of de voorlopige
      hechtenis is bevolen en die in een inrichting als bedoeld in de [Penitentiaire beginselenwet][ref2] zijn geplaatst,
      kunnen worden overgeplaatst naar een voorziening als bedoeld in deze wet. Artikel 6 is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001941#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0009709
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0001941
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0009709
  - number: '3'
    text: |-
      De[ Penitentiaire beginselenwet][ref1] alsmede de [Beginselenwet justitiële jeugdinrichtingen][ref2] en de bij
      of krachtens die wetten vastgestelde regels zijn niet van toepassing op de insluiting van de personen, bedoeld in
      artikel 2, tenzij in deze wet anders is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0009709
      [ref2]: https://wetten.overheid.nl/BWBR0011756
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0009709
      - id: ref2
        bwb_id: BWBR0011756
  - number: '4.1'
    text: Onze Minister wijst de voorzieningen aan bestemd voor de insluiting van personen als bedoeld in artikel 2.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel4
  - number: '4.2'
    text: |-
      Het opperbeheer van de voorzieningen berust bij Onze Minister. Onze Minister kan mandaat verlenen inzake de
      uitvoering hiervan.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel4
  - number: '4.3'
    text: Het beheer van een voorziening berust bij de directeur, die als zodanig door Onze Minister wordt aangewezen.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel4
  - number: '4.4'
    text: Onze Minister wijst een of meer personen aan als plaatsvervanger van de directeur.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel4
  - number: '5.1'
    text: De directeur stelt, in aanvulling op de bij deze wet gegeven regels, huisregels voor de voorziening vast.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel5
  - number: '5.2'
    text: |-
      De directeur kan ambtenaren en medewerkers machtigen tot de uitoefening van hem bij of krachtens deze wet gegeven
      bevoegdheden en de naleving van zijn zorgplichten.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel5
  - number: '5.3'
    text: |-
      De directeur is, voor zover zulks noodzakelijk is in het belang van de handhaving van de orde of de veiligheid in
      de voorziening of een ongestoorde tenuitvoerlegging van de vrijheidsbeneming, bevoegd aan de gedetineerden bevelen
      te geven. De gedetineerden zijn verplicht deze bevelen op te volgen.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel5
  - number: 5a.1
    text: Bij elke voorziening wordt door Onze Minister een commissie van toezicht ingesteld.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel5a
  - number: 5a.2
    text: 'De commissie van toezicht heeft tot taak:'
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel5a
  - number: 5a.2.a
    text: toezicht te houden op de wijze van tenuitvoerlegging van de vrijheidsbeneming in de voorziening;
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel5a
  - number: 5a.2.b
    text: kennis te nemen van door de gedetineerden naar voren gebrachte grieven;
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel5a
  - number: 5a.2.c
    text: toezicht te houden op de behandeling van klaagschriften ingevolge het bepaalde in hoofdstuk IX;
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel5a
  - number: 5a.2.d
    text: aan Onze Minister, de Raad en de directeur advies en inlichtingen te geven omtrent het onder a gestelde.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel5a
  - number: 5a.3
    text: |-
      De commissie van toezicht stelt zich door persoonlijk contact met de gedetineerden regelmatig op de hoogte van
      onder hen levende wensen en gevoelens. Bij toerbeurt treedt één van haar leden hiertoe op als maandcommissaris.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel5a
  - number: 5a.4
    text: |-
      Ten aanzien van de bevoegdheden, de benoeming en het ontslag van de leden zijn de [artikelen 12][ref1], [13][ref2],
      [14][ref3], [15][ref4], [17][ref5], [18][ref6] en [20 van de Penitentiaire maatregel][ref7] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009398#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0009398#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0009398#Artikel14
      [ref4]: https://wetten.overheid.nl/BWBR0009398#Artikel15
      [ref5]: https://wetten.overheid.nl/BWBR0009398#Artikel17
      [ref6]: https://wetten.overheid.nl/BWBR0009398#Artikel18
      [ref7]: https://wetten.overheid.nl/BWBR0009398#Artikel20
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0009398
        artikel: '12'
      - id: ref2
        bwb_id: BWBR0009398
        artikel: '13'
      - id: ref3
        bwb_id: BWBR0009398
        artikel: '14'
      - id: ref4
        bwb_id: BWBR0009398
        artikel: '15'
      - id: ref5
        bwb_id: BWBR0009398
        artikel: '17'
      - id: ref6
        bwb_id: BWBR0009398
        artikel: '18'
      - id: ref7
        bwb_id: BWBR0009398
        artikel: '20'
  - number: '6'
    text: |-
      Met de plaatsing en overplaatsing van gedetineerden zijn door Onze Minister als zodanig aangewezen
      selectiefunctionarissen belast. Deze zijn bevoegd de overbrenging van gedetineerden te bevelen naar de voor hen
      bestemde voorziening. Zij kunnen de overbrenging doen geschieden door daartoe aangewezen ambtenaren of medewerkers.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel6
  - number: '7.1'
    text: |-
      De gedetineerden worden aan geen andere beperkingen onderworpen dan die welke voor het doel van de
      vrijheidsbeneming of in het belang van de handhaving van de orde of de veiligheid in de voorziening noodzakelijk
      zijn. De beslissingen die jegens de gedetineerde worden genomen zijn gericht op een humane bejegening en zoveel
      mogelijk gericht op de voorbereiding van de terugkeer van de gedetineerde in de maatschappij.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel7
  - number: '7.2'
    text: |-
      In het belang van de handhaving van de orde en de veiligheid in de voorziening dan wel van een ongestoorde
      tenuitvoerlegging van de vrijheidsbeneming, kunnen gedetineerden worden verplicht te dulden elektronische
      beveiligingsapparatuur aan het lichaam te dragen.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel7
  - number: '8.1'
    text: |-
      De directeur wijst de gedetineerde een verblijfsruimte toe. Deze ruimte is voor hem persoonlijk dan wel voor de
      gemeenschappelijke onderbrenging van gedetineerden bestemd.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel8
  - number: '8.2'
    text: Onveroordeelde en veroordeelde gedetineerden kunnen gemeenschappelijk worden ondergebracht.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel8
  - number: '8.3'
    text: |-
      Mannelijke en vrouwelijke gedetineerden onderscheidenlijk volwassen en minderjarige gedetineerden worden in de
      verblijfsruimten gescheiden.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel8
  - number: '9'
    text: |-
      De directeur stelt een gedetineerde in de gelegenheid onder door hem te stellen voorwaarden de voorziening te
      verlaten teneinde een gerechtelijke procedure bij te wonen:
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel9
  - number: 9.a
    text: |-
      indien de gedetineerde krachtens wettelijk voorschrift verplicht is voor een rechter of bestuursorgaan te
      verschijnen;
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel9
  - number: 9.b
    text: indien de gedetineerde ter zake van een misdrijf moet terechtstaan;
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel9
  - number: 9.c
    text: |-
      indien de gedetineerde bij het bijwonen van de procedure een aanmerkelijk belang heeft en tegen het verlaten van de
      voorziening hiertoe geen overwegend bezwaar bestaat.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel9
  - number: '10.1'
    text: 'De directeur kan een gedetineerde in afzondering plaatsen:'
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel10
  - number: 10.1.a
    text: |-
      indien dit in het belang van de handhaving van de orde of de veiligheid in de voorziening, dan wel voor een
      ongestoorde tenuitvoerlegging van de vrijheidsbeneming noodzakelijk is;
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel10
  - number: 10.1.b
    text: indien dit ter bescherming van de betrokken gedetineerde noodzakelijk is;
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel10
  - number: 10.1.c
    text: in geval van ziekmelding of ziekte van de betrokken gedetineerde;
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel10
  - number: 10.1.d
    text: indien de gedetineerde hierom verzoekt en de directeur dit verzoek redelijk en uitvoerbaar oordeelt.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel10
  - number: '10.2'
    text: |-
      De afzondering ingevolge het eerste lid, onder a of b, duurt ten hoogste twee weken. De directeur kan deze
      afzondering telkens voor ten hoogste twee weken verlengen, indien hij tot het oordeel is gekomen dat de noodzaak
      tot afzondering nog bestaat.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel10
  - number: '10.3'
    text: |-
      De afzondering wordt ten uitvoer gelegd in een afzonderingscel of in een andere verblijfsruimte. Gedurende het
      verblijf in afzondering neemt de gedetineerde niet deel aan activiteiten, voor zover de directeur niet anders
      bepaalt en behoudens het dagelijks verblijf in de buitenlucht. De directeur kan het recht van de gedetineerde om
      te telefoneren met, of het ontvangen van bezoek van persoonlijke relaties slechts beperken of uitsluiten indien het
      belang van de orde of de veiligheid in de voorziening, dan wel de gedragingen, lichamelijke of gemoedstoestand van
      de gedetineerde zulks noodzakelijk maken.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel10
  - number: '10.4'
    text: |-
      De directeur draagt zorg dat, ingeval de afzondering langer dan vierentwintig uren duurt en ten uitvoer wordt
      gelegd in een afzonderingscel, de commissie van toezicht en de aan de voorziening verbonden arts of diens vervanger
      terstond hiervan in kennis wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel10
  - number: '10.5'
    text: |-
      De directeur draagt zorg dat in geval van afzondering het nodige contact tussen ambtenaren en medewerkers van de
      voorziening en de gedetineerde wordt gewaarborgd en naar aard en frequentie op de situatie van de gedetineerde
      wordt afgestemd.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel10
  - number: '11.1'
    text: |-
      Indien de tenuitvoerlegging van de afzondering in de voorziening op ernstige bezwaren stuit, kan zij in een
      andere voorziening of in een inrichting of afdeling als bedoeld in de [Penitentiaire beginselenwet][ref1]
      worden ondergaan. Is de gedetineerde minderjarig dan kan de afzondering in een inrichting als bedoeld in de
      [Beginselenwet justitiële jeugdinrichtingen][ref2] worden ondergaan.


      [ref1]: https://wetten.overheid.nl/BWBR0009709
      [ref2]: https://wetten.overheid.nl/BWBR0011756
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0009709
      - id: ref2
        bwb_id: BWBR0011756
  - number: '11.2'
    text: |-
      Indien de directeur van oordeel is dat van de in het eerste lid bedoelde omstandigheid sprake is, plaatst hij in
      overeenstemming met de selectiefunctionaris de gedetineerde over.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel11
  - number: '11.3'
    text: |-
      Over de verlenging van de afzondering, waarvan de tenuitvoerlegging plaatsvindt in een andere voorziening
      of inrichting of afdeling, beslist de directeur van de voorziening waarin de afzondering was opgelegd, in
      overeenstemming met de selectiefunctionaris en gehoord de directeur van de voorziening of inrichting of afdeling
      waar de tenuitvoerlegging van de afzondering plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel11
  - number: '12'
    text: |-
      Het recht van de gedetineerde op onaantastbaarheid van zijn lichaam, zijn kleding en de van zijn lichaam
      afgescheiden stoffen en zijn verblijfsruimte kan overeenkomstig de bepalingen van dit hoofdstuk worden beperkt.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel12
  - number: '13.1'
    text: |-
      De directeur kan de gedetineerde verplichten een legitimatiebewijs bij zich te dragen en dit op verzoek van een
      ambtenaar of medewerker te tonen.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel13
  - number: '13.2'
    text: |-
      De gedetineerde is verplicht zijn medewerking te verlenen aan het vastleggen van zijn beeltenis, het nemen van een
      vingerafdruk of het afnemen van een handscan.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel13
  - number: '14.1'
    text: |-
      De directeur is bevoegd een gedetineerde bij binnenkomst of bij het verlaten van de voorziening, voorafgaand aan of
      na afloop van bezoek, dan wel indien dit anderszins noodzakelijk is in het belang van de handhaving van de orde of
      de veiligheid in de voorziening, aan zijn lichaam of aan zijn kleding te onderzoeken.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel14
  - number: '14.2'
    text: |-
      Het onderzoek aan het lichaam van de gedetineerde omvat mede het uitwendig schouwen van de openingen en holten van
      het lichaam van de gedetineerde. Het onderzoek aan de kleding van de gedetineerde omvat mede het onderzoek van de
      voorwerpen die de gedetineerde bij zich draagt of met zich meevoert.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel14
  - number: '14.3'
    text: |-
      Het onderzoek aan het lichaam van de gedetineerde wordt op een besloten plaats en, voor zover mogelijk, door
      personen van hetzelfde geslacht als de gedetineerde verricht.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel14
  - number: '14.4'
    text: |-
      Indien bij een onderzoek aan het lichaam of de kleding voorwerpen worden aangetroffen die niet in het bezit van de
      gedetineerde mogen zijn, en, voor zover het onderzoek betrekking heeft op de openingen of holten van het lichaam
      van de gedetineerde, deze voorwerpen zonder het gebruik van hulpmiddelen daaruit kunnen worden verwijderd, is
      de directeur bevoegd deze in beslag te nemen. Hij draagt zorg dat deze voorwerpen, hetzij onder afgifte van een
      bewijs van ontvangst ten behoeve van de gedetineerde op diens kosten worden bewaard, hetzij met toestemming van
      de gedetineerde worden vernietigd, hetzij aan een opsporingsambtenaar ter hand worden gesteld met het oog op de
      voorkoming of opsporing van strafbare feiten.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel14
  - number: '15.1'
    text: |-
      De directeur kan, indien dit noodzakelijk is in het belang van de handhaving van de orde of de veiligheid in de
      voorziening dan wel in verband met de beslissing tot overplaatsing, een gedetineerde verplichten urine af te staan
      ten behoeve van een onderzoek van die urine op aanwezigheid van gedragsbeïnvloedende middelen.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel15
  - number: '15.2'
    text: |-
      De Regeling urinecontrole penitentiaire inrichtingen is van toepassing. Artikel 14, derde lid, is van
      overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel15
  - number: '16.1'
    text: |-
      De directeur kan bepalen dat een gedetineerde in het lichaam wordt onderzocht, indien dit noodzakelijk is ter
      afwending van ernstig gevaar voor de handhaving van de orde of de veiligheid in de voorziening dan wel voor de
      gezondheid van de gedetineerde. Het onderzoek in het lichaam wordt verricht door een arts of, in diens opdracht,
      door een verpleegkundige.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel16
  - number: '16.2'
    text: |-
      Indien bij het onderzoek in het lichaam voorwerpen worden aangetroffen die niet in het bezit van de gedetineerde
      mogen zijn, en deze voorwerpen door de arts of verpleegkundige uit het lichaam kunnen worden verwijderd, is
      de directeur bevoegd deze in beslag te nemen. Artikel 14, vierde lid, laatste volzin, is van overeenkomstige
      toepassing.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel16
  - number: '17.1'
    text: |-
      De directeur kan een gedetineerde verplichten te gedogen dat ten aanzien van hem een bepaalde geneeskundige
      handeling wordt verricht, indien die handeling naar het oordeel van een arts noodzakelijk is ter afwending van
      ernstig gevaar voor de gezondheid of veiligheid van de gedetineerde of van anderen. De handeling wordt verricht
      door een arts of, in diens opdracht, door een verpleegkundige.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel17
  - number: '17.2'
    text: |-
      De [artikelen 21 tot en met 23 van de Penitentiaire maatregel][ref1] zijn van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009398#Artikel21
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0009398
        artikel: '21'
  - number: '18.1'
    text: |-
      De directeur kan bepalen dat een gedetineerde tijdens de afzondering door bevestiging van mechanische middelen
      aan zijn lichaam voor een periode van ten hoogste vierentwintig uren in zijn bewegingsvrijheid wordt beperkt,
      indien die beperking noodzakelijk is ter afwending van een van de gedetineerde uitgaand ernstig gevaar voor diens
      gezondheid of de veiligheid van anderen dan de gedetineerde. De directeur stelt de arts of diens vervanger en de
      commissie van toezicht van de bevestiging onverwijld in kennis.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel18
  - number: '18.2'
    text: |-
      De directeur kan de beslissing tot bevestiging van mechanische middelen aan het lichaam van de gedetineerde telkens
      met ten hoogste vierentwintig uren verlengen. De beslissing tot verlenging wordt genomen na overleg met de aan de
      voorziening verbonden arts of diens vervanger.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel18
  - number: '18.3'
    text: De Regeling mechanische middelen in penitentiaire inrichtingen is van toepassing.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel18
  - number: '19.1'
    text: |-
      De directeur is bevoegd de verblijfsruimten van de gedetineerden op de aanwezigheid van voorwerpen die niet in zijn
      bezit mogen zijn te onderzoeken:
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel19
  - number: 19.1.a
    text: |-
      indien dit onderzoek plaatsvindt in het kader van het algemeen toezicht op de aanwezigheid van verboden voorwerpen
      in de verblijfsruimten van gedetineerden;
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel19
  - number: 19.1.b
    text: |-
      indien dit anderszins noodzakelijk is in het belang van de handhaving van de orde of de veiligheid in de
      voorziening.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel19
  - number: '19.2'
    text: Artikel 14, vierde lid, is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel19
  - number: '20.1'
    text: |-
      De directeur is bevoegd jegens een gedetineerde geweld te gebruiken dan wel vrijheidsbeperkende middelen aan te
      wenden, voor zover dit noodzakelijk is met het oog op een van de volgende belangen:
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel20
  - number: 20.1.a
    text: de handhaving van de orde of de veiligheid in de voorziening;
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel20
  - number: 20.1.b
    text: de uitvoering van een door de directeur genomen beslissing;
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel20
  - number: 20.1.c
    text: de voorkoming van het zich onttrekken door de gedetineerde aan het op hem uitgeoefende toezicht.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel20
  - number: '20.2'
    text: |-
      De selectiefunctionaris of een daartoe door hem aangewezen ambtenaar of medewerker is bevoegd jegens een
      gedetineerde geweld te gebruiken of vrijheidsbeperkende middelen aan te wenden met het oog op een van de volgende
      belangen:
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel20
  - number: 20.2.a
    text: de uitvoering van een door hem genomen beslissing;
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel20
  - number: 20.2.b
    text: de voorkoming van het zich onttrekken van de gedetineerde aan het op hem uitgeoefende toezicht.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel20
  - number: '20.3'
    text: |-
      Aan het gebruik van geweld gaat zo mogelijk een waarschuwing vooraf. Degene die geweld heeft gebruikt maakt hiervan
      onverwijld een schriftelijk verslag en doet dit verslag onverwijld aan de directeur dan wel de selectiefunctionaris
      toekomen.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel20
  - number: '20.4'
    text: De Geweldsinstructie penitentiaire inrichtingen is van toepassing.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel20
  - number: '21.1'
    text: |-
      De gedetineerde heeft, behoudens de overeenkomstig het tweede tot en met het vierde lid te stellen beperkingen, het
      recht brieven en stukken per post te verzenden en te ontvangen.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel21
  - number: '21.2'
    text: |-
      De directeur is bevoegd enveloppen of andere poststukken, afkomstig van of bestemd voor gedetineerden, op de
      aanwezigheid van bijgesloten voorwerpen te onderzoeken en deze hiertoe te openen. Indien de enveloppen of andere
      poststukken afkomstig zijn van of bestemd zijn voor de in artikel 22, eerste of tweede lid, genoemde personen of
      instanties, geschiedt dit onderzoek zoveel mogelijk in aanwezigheid van de betrokken gedetineerde.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel21
  - number: '21.3'
    text: |-
      De directeur is bevoegd op de inhoud van brieven of andere poststukken afkomstig van of bestemd voor gedetineerden
      toezicht uit te oefenen. Dit toezicht kan omvatten het kopiëren van brieven of andere poststukken. Bij binnenkomst
      wordt de gedetineerde op de hoogte gesteld van de bevoegdheid van de directeur om dit toezicht uit te oefenen.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel21
  - number: '21.4'
    text: |-
      De directeur kan de verzending of uitreiking van bepaalde brieven of andere poststukken alsmede bijgesloten
      voorwerpen weigeren, indien dit noodzakelijk is met het oog op een van de volgende belangen:
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel21
  - number: 21.4.a
    text: de handhaving van de orde of de veiligheid in de voorziening;
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel21
  - number: 21.4.b
    text: de voorkoming of opsporing van strafbare feiten;
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel21
  - number: 21.4.c
    text: de bescherming van slachtoffers van of anderszins betrokkenen bij misdrijven.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel21
  - number: '21.5'
    text: |-
      De directeur draagt zorg dat de niet uitgereikte brieven of andere poststukken dan wel bijgesloten voorwerpen,
      hetzij worden teruggegeven aan de gedetineerde of voor diens rekening worden gezonden aan de verzender of
      een door de gedetineerde op te geven adres, hetzij onder afgifte van een bewijs van ontvangst ten behoeve van
      de gedetineerde worden bewaard, hetzij met toestemming van de gedetineerde worden vernietigd, hetzij aan een
      opsporingsambtenaar ter hand worden gesteld met het oog op de voorkoming of opsporing van strafbare feiten.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel21
  - number: '22.1'
    text: |-
      Artikel 21, derde en vierde lid, is niet van toepassing op brieven, door de gedetineerde gericht aan of afkomstig
      van:
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel22
  - number: 22.1.a
    text: leden van het Koninklijk Huis;
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel22
  - number: 22.1.b
    text: |-
      de Eerste of Tweede Kamer der Staten-Generaal, leden daarvan, de Nederlandse leden van het Europese Parlement of
      een commissie uit een van beide parlementen;
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel22
  - number: 22.1.c
    text: Onze Minister;
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel22
  - number: 22.1.d
    text: justitiële autoriteiten;
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel22
  - number: 22.1.e
    text: de Nationale ombudsman;
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel22
  - number: 22.1.f
    text: de geneeskundig inspecteurs van de volksgezondheid;
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel22
  - number: 22.1.g
    text: de Raad, een commissie daaruit of leden daarvan;
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel22
  - number: 22.1.h
    text: de commissie van toezicht of een beklagcommissie, of leden daarvan;
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel22
  - number: 22.1.i
    text: diens rechtsbijstandverlener;
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel22
  - number: 22.1.j
    text: diens reclasseringswerker;
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel22
  - number: 22.1.k
    text: andere door Onze Minister of de directeur aan te wijzen personen of instanties.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel22
  - number: '22.2'
    text: |-
      Voor de toepassing van het eerste lid, onder *d*, wordt onder justitiële autoriteiten mede begrepen: organen die
      krachtens een wettelijk voorschrift of een in Nederland geldend verdrag bevoegd zijn tot kennisneming van klachten
      of behandeling van met een klacht aangevangen zaken.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel22
  - number: '22.3'
    text: De Regeling geprivilegieerde post gedetineerden is van toepassing.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel22
  - number: '23.1'
    text: |-
      De gedetineerde heeft, voor zover de bouwkundige en personele omstandigheden dit toelaten, het recht gedurende ten
      hoogste één uur per week op in de huisregels vastgestelde tijden en plaatsen bezoek te ontvangen.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel23
  - number: '23.2'
    text: |-
      De directeur kan het aantal tegelijkertijd tot de gedetineerde toe te laten personen beperken, indien dit
      noodzakelijk is in het belang van de handhaving van de orde of de veiligheid in de voorziening.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel23
  - number: '23.3'
    text: |-
      De directeur kan de toelating tot de gedetineerde van een bepaald persoon of van bepaalde personen weigeren, indien
      dit noodzakelijk is met het oog op:
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel23
  - number: 23.3.a
    text: de handhaving van de orde of de veiligheid in de voorziening;
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel23
  - number: 23.3.b
    text: de voorkoming of opsporing van strafbare feiten;
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel23
  - number: 23.3.c
    text: de bescherming van slachtoffers van of anderszins betrokkenen bij misdrijven.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel23
  - number: '23.4'
    text: |-
      De directeur kan bepalen dat tijdens het bezoek toezicht wordt uitgeoefend, indien dit noodzakelijk is met het
      oog op een belang als bedoeld in het derde lid. Dit toezicht kan omvatten het beluisteren of opnemen van het
      gesprek tussen de bezoeker en de gedetineerde. Bij binnenkomst wordt de gedetineerde op de hoogte gesteld van de
      bevoegdheid van de directeur om dit toezicht uit te oefenen.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel23
  - number: '23.5'
    text: |-
      Iedere bezoeker dient zich bij binnenkomst op deugdelijke wijze te legitimeren. De directeur kan bepalen dat
      een bezoeker aan zijn kleding wordt onderzocht op de aanwezigheid van voorwerpen die een gevaar kunnen opleveren
      voor de orde of de veiligheid in de voorziening. Dit onderzoek kan ook betrekking hebben op door hem meegebrachte
      voorwerpen. De directeur is bevoegd dergelijke voorwerpen gedurende de duur van het bezoek onder zich te nemen
      tegen afgifte van een bewijs van ontvangst dan wel aan een opsporingsambtenaar ter hand te stellen met het oog op
      de voorkoming of opsporing van strafbare feiten.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel23
  - number: '23.6'
    text: |-
      De directeur kan het bezoek binnen de daarvoor bestemde tijd beëindigen en de bezoeker uit de voorziening doen
      verwijderen, indien dit noodzakelijk is met het oog op een belang als bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel23
  - number: '23.7'
    text: |-
      De in artikel 22, eerste lid, onder g en h, genoemde personen en instanties hebben te allen tijde toegang tot
      de gedetineerde. De overige in dat lid genoemde personen en instanties hebben toegang tot de gedetineerde op in
      de huisregels vastgestelde tijden en plaatsen. Tijdens dit bezoek kunnen zij zich vrijelijk met de gedetineerde
      onderhouden, behoudens ingeval de directeur, na overleg met de desbetreffende bezoeker, van mening is dat van de
      gedetineerde een ernstig gevaar uitgaat voor de veiligheid van de bezoeker. In dat geval laat de directeur voor
      het bezoek weten welke toezichthoudende maatregelen genomen worden om het onderhoud zo ongestoord mogelijk te laten
      verlopen. De toezichthoudende maatregelen mogen er niet toe leiden dat vertrouwelijke mededelingen in het onderhoud
      tussen de gedetineerde en diens rechtsbijstandverlener bij derden bekend kunnen worden.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel23
  - number: '24.1'
    text: |-
      De gedetineerde heeft, voor zover de bouwkundige en personele omstandigheden dit toelaten, het recht ten minste
      eenmaal per week op in de huisregels vastgestelde tijden en plaatsen en met behulp van een daartoe aangewezen
      toestel gedurende tien minuten een of meer telefoongesprekken te voeren met personen buiten de voorziening.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel24
  - number: '24.2'
    text: |-
      De directeur kan bepalen dat op de door of met de gedetineerde gevoerde telefoongesprekken toezicht wordt
      uitgeoefend, indien dit noodzakelijk is om de identiteit van de persoon met wie de gedetineerde een gesprek voert
      vast te stellen dan wel met het oog op een belang als bedoeld in artikel 23, derde lid. Dit toezicht kan omvatten
      het beluisteren of opnemen van het telefoongesprek. Bij binnenkomst wordt de gedetineerde op de hoogte gesteld van
      de bevoegdheid van de directeur om dit toezicht uit te oefenen.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel24
  - number: '24.3'
    text: |-
      De directeur kan de gelegenheid tot het voeren van een bepaald telefoongesprek of bepaalde telefoongesprekken
      weigeren of een telefoongesprek binnen de daarvoor bestemde tijd beëindigen, indien dit noodzakelijk is met het oog
      op een belang als bedoeld in artikel 23, derde lid. De beslissing tot het weigeren van een bepaald telefoongesprek
      of bepaalde telefoongesprekken geldt voor ten hoogste drie maanden.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel24
  - number: '24.4'
    text: |-
      De gedetineerde wordt in staat gesteld met de in artikel 22, eerste lid, genoemde personen en instanties
      telefonisch contact te hebben, indien hiervoor de noodzaak en de gelegenheid bestaat. Op deze gesprekken wordt
      geen ander toezicht uitgeoefend dan noodzakelijk is om de identiteit van de personen of instantie met wie de
      gedetineerde een telefoongesprek voert of wenst te voeren vast te stellen.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel24
  - number: 24a
    text: |-
      De directeur draagt, indien mogelijk, zorg dat in de inrichting geestelijke verzorging, die aansluit bij de
      godsdienst of levensovertuiging van de gedetineerden, beschikbaar is.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel24a
  - number: '25.1'
    text: De gedetineerde heeft recht op medische verzorging door een aan de inrichting verbonden arts of diens vervanger.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel25
  - number: '25.2'
    text: 'De directeur draagt zorg dat de aan de voorziening verbonden arts of diens vervanger:'
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel25
  - number: 25.2.a
    text: regelmatig beschikbaar is voor het houden van een spreekuur;
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel25
  - number: 25.2.b
    text: |-
      op andere tijdstippen beschikbaar is, indien dit in het belang van de gezondheid van de gedetineerde noodzakelijk
      is.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel25
  - number: '25.3'
    text: 'De directeur draagt zorg voor:'
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel25
  - number: 25.3.a
    text: |-
      de verstrekking van de door de aan de voorziening verbonden arts of diens vervanger voorgeschreven medicijnen en
      diëten;
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel25
  - number: 25.3.b
    text: de behandeling van de gedetineerde op aanwijzing van de aan de voorziening verbonden arts of diens vervanger;
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel25
  - number: 25.3.c
    text: |-
      de overbrenging van de gedetineerde naar een ziekenhuis dan wel andere instelling, indien de onder b bedoelde
      behandeling aldaar plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel25
  - number: '26.1'
    text: |-
      De gedetineerde heeft het recht zijn godsdienst of levensovertuiging, individueel of in gemeenschap met anderen,
      vrij te belijden en te beleven.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel26
  - number: '26.2'
    text: |-
      De directeur draagt zorg dat aan de gedetineerde voeding, noodzakelijke kleding en schoeisel worden verstrekt. Bij
      het verstrekken van voeding wordt, indien mogelijk, rekening gehouden met de godsdienst of levensovertuiging van
      de gedetineerde.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel26
  - number: '26.3'
    text: |-
      De gedetineerde heeft recht op het dragen van eigen kleding en schoeisel, tenzij die een gevaar kunnen opleveren
      voor de orde of de veiligheid in de voorziening.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel26
  - number: '26.4'
    text: |-
      De directeur draagt zorg dat de gedetineerde in staat gesteld wordt zijn uiterlijk en lichamelijke hygiëne naar
      behoren te verzorgen.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel26
  - number: '27'
    text: |-
      De directeur kan een gedetineerde toestemming geven hem toebehorende voorwerpen in zijn verblijfsruimte te plaatsen
      dan wel bij zich te hebben voor zover dit zich verdraagt met de volgende belangen:
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel27
  - number: 27.a
    text: de handhaving van de orde of de veiligheid in de voorziening;
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel27
  - number: 27.b
    text: de aansprakelijkheid van de directeur voor de voorwerpen.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel27
  - number: '28.1'
    text: De directeur draagt zorg dat de gedetineerden kennis kunnen nemen van het nieuws.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel28
  - number: '28.2'
    text: |-
      Indien de bouwkundige en personele omstandigheden dit toelaten draagt de directeur zorg voor een dagbesteding van
      de gedetineerden.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel28
  - number: '29'
    text: |-
      De gedetineerden worden in de gelegenheid gesteld gedurende ten minste één uur per dag in de buitenlucht te
      verblijven, tenzij de gezondheid van de gedetineerde daaraan in de weg staat.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel29
  - number: '30.1'
    text: |-
      De directeur draagt zorg dat de gedetineerde bij binnenkomst in de voorziening op de hoogte wordt gebracht van zijn
      rechten en plichten.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel30
  - number: '30.2'
    text: |-
      Een gedetineerde vreemdeling wordt bij binnenkomst in de voorziening geïnformeerd over zijn recht de consulaire
      vertegenwoordiging van zijn land van zijn detentie op de hoogte te stellen.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel30
  - number: '31.1'
    text: |-
      De directeur stelt de gedetineerde in de gelegenheid te worden gehoord, zoveel mogelijk in een voor hem
      begrijpelijke taal, alvorens hij beslist omtrent:
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel31
  - number: 31.1.a
    text: |-
      de plaatsing in afzondering en de verlenging hiervan, bedoeld in artikel 10, eerste lid, onder a of b,
      onderscheidenlijk artikel 10, tweede lid, en de toepassing van artikel 11;
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel31
  - number: 31.1.b
    text: het onderzoek in het lichaam, bedoeld in artikel 16;
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel31
  - number: 31.1.c
    text: het gedogen van een geneeskundige handeling, bedoeld in artikel 17;
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel31
  - number: 31.1.d
    text: |-
      de bevestiging door mechanische middelen en de verlenging daarvan, bedoeld in artikel 18, eerste onderscheidenlijk
      tweede lid.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel31
  - number: '31.2'
    text: Van het horen van de gedetineerde wordt aantekening gehouden.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel31
  - number: '31.3'
    text: 'Toepassing van het eerste lid kan achterwege blijven indien:'
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel31
  - number: 31.3.a
    text: de vereiste spoed zich daartegen verzet;
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel31
  - number: 31.3.b
    text: de gemoedstoestand van de gedetineerde daaraan in de weg staat.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel31
  - number: '32.1'
    text: |-
      De directeur geeft de gedetineerde van elke beslissing als bedoeld in artikel 31, eerste lid, onverwijld
      schriftelijk en zoveel mogelijk in een voor hem begrijpelijke taal een met redenen omklede, gedagtekende en
      ondertekende mededeling.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel32
  - number: '32.2'
    text: 'De directeur geeft de gedetineerde op de in het eerste lid omschreven wijze een mededeling omtrent:'
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel32
  - number: 32.2.a
    text: |-
      de weigering van verzending of uitreiking van een brief of ander poststuk dan wel van bijgesloten voorwerpen,
      bedoeld in artikel 21, vierde lid;
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel32
  - number: 32.2.b
    text: |-
      de weigering van de toelating tot de gedetineerde van een bepaald persoon of bepaalde personen, bedoeld in artikel
      23, derde lid;
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel32
  - number: 32.2.c
    text: |-
      het verbod van het voeren van een bepaald telefoongesprek of bepaalde telefoongesprekken, bedoeld in artikel 24,
      derde lid.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel32
  - number: '32.3'
    text: |-
      De gedetineerde wordt in de mededeling, bedoeld in het eerste en tweede lid, gewezen op de mogelijkheid van het
      instellen van beklag, bedoeld in hoofdstuk IX, de wijze waarop en de termijn waarbinnen zulks dient te geschieden.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel32
  - number: '33'
    text: De beklagcommissie draagt zorg voor de behandeling van klaagschriften ingevolge de bepalingen van dit hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel33
  - number: '34.1'
    text: |-
      Een gedetineerde kan bij de beklagcommissie beklag doen over een hem betreffende door of namens de directeur
      genomen beslissing die een beperking inhoudt van een recht, dat hem op grond van deze wet dan wel enig ander
      wettelijk voorschrift of een een ieder verbindende bepaling van een in Nederland geldend verdrag toekomt.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel34
  - number: '34.2'
    text: |-
      Met een beslissing als bedoeld in het eerste lid wordt gelijkgesteld een verzuim of weigering om te beslissen. Het
      nemen van een beslissing wordt geacht te zijn verzuimd of geweigerd, indien niet binnen de wettelijke of, bij het
      ontbreken daarvan, binnen een redelijke termijn een beslissing is genomen.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel34
  - number: '34.3'
    text: |-
      De directeur draagt zorg dat een gedetineerde die beklag wenst te doen daartoe zo spoedig mogelijk in de
      gelegenheid wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel34
  - number: '35.1'
    text: |-
      De gedetineerde doet beklag door de indiening van een klaagschrift bij de beklagcommissie bij de voorziening waar
      de beslissing waarover hij klaagt is genomen.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel35
  - number: '35.2'
    text: |-
      De indiening van het klaagschrift kan door tussenkomst van de directeur van de voorziening waar de gedetineerde
      verblijft geschieden. De directeur draagt in dat geval zorg dat het klaagschrift of, indien het klaagschrift zich
      in een envelop bevindt, de envelop van een dagtekening wordt voorzien, welke geldt als dag van indiening.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel35
  - number: '35.3'
    text: |-
      Het klaagschrift vermeldt zo nauwkeurig mogelijk de beslissing waarover wordt geklaagd en de redenen van het
      beklag.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel35
  - number: '35.4'
    text: |-
      Het klaagschrift wordt uiterlijk op de zevende dag na die waarop de gedetineerde kennis heeft gekregen van de
      beslissing waarover hij zich wenst te beklagen ingediend. Een na afloop van deze termijn ingediend klaagschrift is
      niettemin ontvankelijk, indien redelijkerwijs niet kan worden geoordeeld dat de gedetineerde in verzuim is geweest.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel35
  - number: '36.1'
    text: |-
      Het klaagschrift wordt behandeld door de door de commissie van toezicht benoemde beklagcommissie, bestaande uit
      drie leden, die wordt bijgestaan door een secretaris.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel36
  - number: '36.2'
    text: |-
      De voorzitter dan wel een door hem aangewezen lid van de beklagcommissie kan, indien hij het beklag van eenvoudige
      aard, dan wel kennelijk niet-ontvankelijk, kennelijk ongegrond of kennelijk gegrond acht, het klaagschrift
      enkelvoudig afdoen, met dien verstande dat hij tevens de bevoegdheden bezit die aan de voorzitter van de voltallige
      beklagcommissie toekomen.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel36
  - number: '36.3'
    text: |-
      De voorzitter, dan wel het door hem aangewezen lid, bedoeld in het tweede lid, kan de behandeling te allen tijde
      verwijzen naar de voltallige beklagcommissie.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel36
  - number: '36.4'
    text: |-
      De behandeling van het klaagschrift vindt niet in het openbaar plaats, behoudens ingeval de beklagcommissie van
      oordeel is dat de niet openbare behandeling niet verenigbaar is met enige een ieder verbindende bepaling van een in
      Nederland geldend verdrag.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel36
  - number: '37.1'
    text: De secretaris van de beklagcommissie zendt de directeur een afschrift van het klaagschrift toe.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel37
  - number: '37.2'
    text: |-
      De directeur geeft dienaangaande zo spoedig mogelijk schriftelijk de nodige inlichtingen aan de beklagcommissie,
      tenzij hij van oordeel is dat het klaagschrift kennelijk niet-ontvankelijk of kennelijk ongegrond is. Hij voegt
      daaraan de opmerkingen toe, waartoe het klaagschrift hem overigens aanleiding geeft.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel37
  - number: '37.3'
    text: |-
      Aan de klager geeft de secretaris van de beklagcommissie schriftelijk kennis van de inhoud van deze inlichtingen
      en opmerkingen.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel37
  - number: '37.4'
    text: |-
      De beklagcommissie kan het klaagschrift in handen stellen van het lid van de commissie van toezicht, bedoeld in
      artikel 5a, derde lid, teneinde deze in de gelegenheid te stellen terzake te bemiddelen. De secretaris doet hiervan
      mededeling aan de directeur.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel37
  - number: '38'
    text: |-
      De beklagcommissie stelt de klager en de directeur in de gelegenheid omtrent het klaagschrift mondeling opmerkingen
      te maken, tenzij zij het beklag aanstonds kennelijk niet-ontvankelijk, kennelijk ongegrond of kennelijk gegrond
      acht of de gedetineerde niet meer in de voorziening verblijft.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel38
  - number: '39.1'
    text: |-
      De klager heeft het recht zich te doen bijstaan door een rechtsbijstandverlener. Indien aan de klager een
      advocaat is toegevoegd, geschieden diens beloning en de vergoeding van de door hem gemaakte kosten volgens het
      [Besluit vergoedingen rechtsbijstand 2000][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011018
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0011018
  - number: '39.2'
    text: |-
      Indien de klager de Nederlandse taal niet voldoende beheerst, draagt de voorzitter zorg voor de bijstand van een
      tolk. De beloning van de tolk en de vergoeding van de door de tolk gemaakte kosten geschieden volgens het bepaalde
      bij of krachtens de [Wet tarieven in strafzaken][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002406
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0002406
  - number: '39.3'
    text: |-
      Tijdens de beklagprocedure staat de beklagcommissie aan de klager op diens verzoek toe van de gedingstukken kennis
      te nemen.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel39
  - number: '39.4'
    text: Van het horen van de betrokkenen maakt de secretaris een schriftelijk verslag.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel39
  - number: '40.1'
    text: |-
      De beklagcommissie doet zo spoedig mogelijk, doch in ieder geval binnen een termijn van vier weken te rekenen vanaf
      de datum waarop het klaagschrift is ontvangen, uitspraak.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel40
  - number: '40.2'
    text: |-
      De uitspraak is met redenen omkleed en gedagtekend. Zij bevat een verslag van het horen van personen door de
      beklagcommissie. Zij wordt door de voorzitter alsmede door de secretaris ondertekend. Bij verhindering van één van
      hen wordt de reden daarvan in de uitspraak vermeld. Aan de klager en de directeur wordt onverwijld en kosteloos
      een afschrift van de beslissing van de beklagcommissie toegezonden of uitgereikt. De datum van die toezending of
      uitreiking wordt op dit afschrift aangetekend.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel40
  - number: '40.3'
    text: |-
      Indien de klager de Nederlandse taal niet voldoende beheerst en in de voorziening niet op andere wijze in een
      vertaling kan worden voorzien, draagt de voorzitter van de beklagcommissie zorg voor een vertaling van de uitspraak
      en de mededeling, bedoeld in het tweede, onderscheidenlijk derde lid. De vergoeding van de voor de vertaling
      gemaakte kosten geschiedt volgens het bepaalde bij of krachtens de [Wet tarieven in strafzaken][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002406
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0002406
  - number: '40.4'
    text: |-
      De voorzitter van de beklagcommissie kan de uitspraak ook mondeling mededelen aan de klager en de directeur. Als
      dag van de uitspraak geldt de dag van het doen van deze mededeling. Indien mondeling uitspraak wordt gedaan, wordt
      deze uitspraak op het klaagschrift aangetekend.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel40
  - number: '40.5'
    text: |-
      Indien het vierde lid toepassing heeft gevonden en beroep wordt ingesteld als voorzien in artikel 42, eerste en
      tweede lid, vindt uitwerking van de beslissing van de beklagcommissie plaats op de wijze, bedoeld in het tweede
      lid. De secretaris van de beklagcommissie zendt een afschrift van deze uitspraak toe aan de directeur, de klager en
      de beroepscommissie.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel40
  - number: '40.6'
    text: |-
      De secretaris zendt van alle uitspraken van de beklagcommissie een afschrift naar Onze Minister. Een ieder heeft
      recht op kennisneming van deze uitspraken en het ontvangen van een afschrift daarvan. Onze Minister draagt zorg
      dat dit afschrift geen gegevens bevat waaruit de identiteit van de gedetineerde kan worden afgeleid. Met betrekking
      tot de kosten van het ontvangen van een afschrift is het bij of krachtens de [Wet tarieven in strafzaken][ref1]
      bepaalde van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002406
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0002406
  - number: '41.1'
    text: 'De uitspraak van de beklagcommissie strekt tot gehele of gedeeltelijke:'
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel41
  - number: 41.1.a
    text: niet-ontvankelijkverklaring van het beklag;
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel41
  - number: 41.1.b
    text: ongegrondverklaring van het beklag;
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel41
  - number: 41.1.c
    text: gegrondverklaring van het beklag.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel41
  - number: '41.2'
    text: 'Indien de beklagcommissie van oordeel is dat de beslissing waarover is geklaagd:'
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel41
  - number: 41.2.a
    text: |-
      in strijd is met een in de voorziening geldend wettelijk voorschrift of een een ieder verbindende bepaling van een
      in Nederland geldend verdrag, dan wel
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel41
  - number: 41.2.b
    text: |-
      bij afweging van alle in aanmerking komende belangen, onredelijk of onbillijk moet worden geacht, verklaart zij het
      beklag gegrond en vernietigt zij de beslissing geheel of gedeeltelijk.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel41
  - number: '41.3'
    text: 'Bij toepassing van het tweede lid kan de beklagcommissie:'
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel41
  - number: 41.3.a
    text: de directeur opdragen een nieuwe beslissing te nemen met inachtneming van haar uitspraak;
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel41
  - number: 41.3.b
    text: bepalen dat haar uitspraak in de plaats treedt van de vernietigde beslissing;
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel41
  - number: 41.3.c
    text: volstaan met de gehele of gedeeltelijke vernietiging.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel41
  - number: '41.4'
    text: Bij toepassing van het derde lid, onder a, kan de beklagcommissie in haar uitspraak een termijn stellen.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel41
  - number: '41.5'
    text: |-
      Indien het tweede lid toepassing vindt, worden de rechtsgevolgen van de vernietigde beslissing, voor zover
      mogelijk, door de directeur ongedaan gemaakt, dan wel in overeenstemming gebracht met de uitspraak van de
      beklagcommissie.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel41
  - number: '41.6'
    text: |-
      Voor zover de in het vijfde lid bedoelde gevolgen niet meer ongedaan te maken zijn, bepaalt de beklagcommissie dan
      wel de voorzitter, na de directeur te hebben gehoord, of enige tegemoetkoming aan de klager geboden is. Zij stelt
      de tegemoetkoming, die geldelijk van aard kan zijn, vast.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel41
  - number: '42.1'
    text: |-
      Tegen de uitspraak staat voor de klager en de directeur slechts beroep open voor zover de beklagcommissie in
      haar uitspraak heeft bepaald dat dit mogelijk is in verband met het principiële karakter van de klacht dan wel de
      eenheid van uitspraken.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel42
  - number: '42.2'
    text: |-
      Het met redenen omklede beroepschrift moet uiterlijk op de zevende dag na die van de ontvangst van het afschrift
      van de uitspraak onderscheidenlijk na die van de mondelinge mededeling van de uitspraak worden ingediend. Het
      beroep wordt ingediend bij en behandeld door een door de Raad benoemde beroepscommissie van drie leden, die wordt
      bijgestaan door een secretaris.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel42
  - number: '42.3'
    text: |-
      Ten aanzien van de behandeling van het beroepsschrift zijn de artikelen 34, derde lid, 36, vierde lid, 37, 38, 39
      van overeenkomstige toepassing, met dien verstande dat:
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel42
  - number: 42.3.a
    text: de directeur en de klager uitsluitend in de gelegenheid worden gesteld de klacht schriftelijk toe te lichten;
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel42
  - number: 42.3.b
    text: de mondelinge opmerkingen ten overstaan van een lid van de beroepscommissie kunnen worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel42
  - number: '43.1'
    text: |-
      Het indienen van een beroepschrift schorst de tenuitvoerlegging van de uitspraak van de beklagcommissie niet,
      behalve voor zover deze de toekenning van een tegemoetkoming als bedoeld in artikel 41, zesde lid, inhoudt.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel43
  - number: '43.2'
    text: De beroepscommissie doet zo spoedig mogelijk uitspraak.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel43
  - number: '43.3'
    text: 'De uitspraak van de beroepscommissie strekt tot gehele of gedeeltelijke:'
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel43
  - number: 43.3.a
    text: niet-ontvankelijkverklaring van het beroep;
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel43
  - number: 43.3.b
    text: bevestiging van de uitspraak van de beklagcommissie, hetzij met overneming, hetzij met verbetering van de gronden;
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel43
  - number: 43.3.c
    text: vernietiging van de uitspraak van de beklagcommissie.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel43
  - number: '43.4'
    text: |-
      Indien het derde lid, onder c toepassing vindt, doet de beroepscommissie hetgeen de beklagcommissie had behoren
      te doen.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel43
  - number: '43.5'
    text: |-
      Ten aanzien van de uitspraak van de beroepscommissie zijn de artikelen 40, tweede lid, eerste en derde tot en met
      vijfde volzin, en derde en zesde lid, van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel43
  - number: '44'
    text: 'Deze wet wordt aangehaald als: Tijdelijke wet noodcapaciteit drugskoeriers.'
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel44
  - number: '45'
    text: |-
      Onder toepassing van [artikel 16 van de Tijdelijke referendumwet][ref1] treedt deze wet in werking met ingang van
      de dag na de datum van uitgifte van het Staatsblad waarin zij wordt geplaatst. Zij vervalt een jaar na het tijdstip
      van inwerkingtreding.


      [ref1]: https://wetten.overheid.nl/BWBR0012701#Artikel16
    url: https://wetten.overheid.nl/BWBR0013488/2002-03-08#Artikel45
