  - number: '12'
    text: |-
      1 De aanvrager is:

      a. een privaatrechtelijke rechtspersoon naar Nederlands recht of het equivalent daarvan naar het recht van een
      van de overige lidstaten van de Europese Unie of een van de overige lidstaten die partij zijn bij de overeenkomst
      betreffende de Europese Economische Ruimte en heeft zijn statutaire zetel, zijn hoofdbestuur of zijn hoofdvestiging
      in een van deze lidstaten; of

      b. een meerderjarige natuurlijke persoon met werkelijke woonplaats binnen een van de lidstaten van de Europese Unie
      of een van de overige lidstaten die partij zijn bij de overeenkomst betreffende de Europese Economische ruimte.

      2 De aanvrager voldoet verder aan de volgende eisen:

      a. hij verkeert niet in staat van surseance van betaling, faillissement of liquidatie;

      b. er is geen beslag gelegd op goederen die samen een aanmerkelijk deel van zijn vermogen vormen;

      c. hij is handelingsbekwaam ter zake van het aanvragen van een vergunning en het verzorgen en uitzenden van
      radioprogramma’s;

      d. op hem is geen schuldsaneringsregeling natuurlijke personen van toepassing;

      e. hij is niet door onderbewindstelling van goederen het vrije beheer over zijn vermogen verloren;

      f. hij heeft een toestemming als bedoeld in [artikel 71a van de Mediawet][ref1] of levert deze uiterlijk op 21
      januari 2008, 14.00 uur, af op het adres, genoemd in [artikel 4, tweede lid][ref2].

      3 Met de eisen van het tweede lid, onderdelen a tot en met e, worden gelijkgesteld zodanige eisen volgens het
      recht van een van de andere lidstaten van de Europese Unie of een van de andere staten die partij zijn bij de
      Overeenkomst betreffende de Europese Economische Ruimte.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel71a
      [ref2]: https://wetten.overheid.nl/BWBR0022818#Artikel4
    url: https://wetten.overheid.nl/BWBR0022818/2009-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 71a
      - id: ref2
        bwb_id: BWBR0022818
        artikel: '4'
  - number: '13'
    text: |-
      De aanvrager:

      a. kan aantoonbaar beschikken over kennis en ervaring met betrekking tot de productie en exploitatie van een
      regionaal radioprogramma, inclusief nieuws- en informatievoorziening, als het om een kavel voor niet-landelijke
      commerciële radio-omroep gaat; of

      b. kan aantoonbaar beschikken over kennis en ervaring met betrekking tot de productie en exploitatie van een
      radioprogramma als het om een kavel voor commerciële radio-omroep middengolf gaat.
    url: https://wetten.overheid.nl/BWBR0022818/2009-07-01#Artikel13
  - number: '14'
    text: |-
      1 Vragen twee of meer aanvragers die als eenzelfde instelling als bedoeld in [artikel 82f van de Mediawet][ref1]
      worden beschouwd meerdere kavels voor niet-landelijke commerciële radio-omroep aan, dan krijgen deze aanvragers
      gedurende vijf werkdagen de gelegenheid hun voorkeuren voor de aangevraagde kavels volgens [artikel 8][ref2] aan te
      geven als betreft het één vergunningaanvraag.

      2 Vragen twee of meer aanvragers die als eenzelfde instelling als bedoeld in [artikel 82f van de Mediawet][ref3]
      worden beschouwd dezelfde kavels voor niet-landelijke commerciële radio-omroep aan, dan krijgen deze aanvragers
      gedurende vijf werkdagen de gelegenheid één of meer vergunningaanvragen geheel of gedeeltelijk in te trekken.

      3 Geven de aanvragers hun voorkeuren niet volgens het eerste lid op of trekken zij vergunningaanvragen niet volgens
      het tweede lid geheel of gedeeltelijk in, dan bepaalt de Minister via loting wat de voorkeuren voor de kavels zijn
      respectievelijk welke vergunningaanvragen geheel of gedeeltelijk in behandeling blijft.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel82f
      [ref2]: https://wetten.overheid.nl/BWBR0022818#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0004149#Artikel82f
    url: https://wetten.overheid.nl/BWBR0022818/2009-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 82f
      - id: ref2
        bwb_id: BWBR0022818
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0004149
        artikel: 82f
  - number: '15'
    text: |-
      1 Bij elke aanvrager die één of meer kavels voor niet-landelijke commerciële radio-
      omroep aanvraagt wordt getoetst in hoeverre hij op basis van zijn programmatische voornemens
      significant meer biedt dan andere aanvragers en hetgeen voor een kavel is voorgeschreven in
      __REF000___________________________________________________________________________________________________________
      ______________.

      2 Bij elke aanvrager die één of meer kavels voor commerciële radio-omroep middengolf aanvraagt wordt getoetst in
      hoeverre hij zich met zijn programmatische voornemens specifiek richt op een toepassing voor commerciële radio-
      omroep middengolf en in hoeverre hij op basis van zijn programmatische voornemens significant meer biedt dan andere
      aanvragers.


      [ref1]: https://wetten.overheid.nl/BWBR0014740#Artikel7
    url: https://wetten.overheid.nl/BWBR0022818/2009-07-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0014740
        artikel: '7'
  - number: '16'
    text: |-
      1 Bij de toetsing, bedoeld in [artikel 15][ref1], worden de programmatische voornemens per aangevraagd kavel
      gewaardeerd met een nul (0) of een plus (+).

      2 Vervolgens worden per kavel de aanvragers als volgt in een rangorde gezet:

      a. een aanvrager met een plus (+) is hoger in rangorde dan een aanvrager met een nul (0);

      b. als er meerdere aanvragers met een plus (+) zijn, bepaalt het financieel bod de rangorde tussen deze aanvragers,
      waarbij de aanvrager met het hoogste financieel bod het hoogste in rangorde is;

      c. als er meerdere aanvragers met een plus (+) zijn en het door hen uitgebrachte financieel bod gelijk is, bepaalt
      de Minister via loting wat de rangorde tussen deze aanvragers is;

      d. als er maar één aanvrager is, is deze de hoogste in rangorde.

      3 Als er meerdere aanvragers met een nul (0) zijn, is het tweede lid, onderdelen b en c, van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0022818#Artikel15
    url: https://wetten.overheid.nl/BWBR0022818/2009-07-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0022818
        artikel: '15'
  - number: '17'
    text: |-
      1 Bij de kavels voor niet-landelijke commerciële radio-omroep wordt telkens een kavel toegewezen aan de aanvrager
      die daarvoor de hoogste in rangorde is en waaraan hij ook zijn grootste voorkeur heeft gegeven.

      2 Een kavel wordt niet toegewezen als vergunningverlening voor die kavel aan de aanvrager in strijd komt met het
      bepaalde bij of krachtens de [Telecommunicatiewet][ref1].

      3 Telkens als aan een aanvrager geen kavels meer kunnen worden toegewezen, wordt de rangorde voor de overblijvende
      kavels opnieuw bepaald en worden deze kavels volgens het eerste lid toegewezen. Bij aanvragers aan wie al kavels
      zijn toegewezen wordt daarbij eerst gekeken naar de kavel waar de eerdere toewijzing is gestopt.


      [ref1]: https://wetten.overheid.nl/BWBR0009950
    url: https://wetten.overheid.nl/BWBR0022818/2009-07-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0009950
  - number: '18'
    text: |-
      Bij de kavels voor commerciële radio-omroep middengolf krijgt een aanvrager telkens de kavel toegewezen waarvoor
      hij de hoogste in rangorde is.
    url: https://wetten.overheid.nl/BWBR0022818/2009-07-01#Artikel18
  - number: '19'
    text: |-
      De Minister draagt de aanvragers aan wie de kavels zijn toegewezen voor het verlenen van een vergunning voor aan de
      Minister van Economische Zaken.
    url: https://wetten.overheid.nl/BWBR0022818/2009-07-01#Artikel19
  - number: '20'
    text: |-
      1 Voor de vergunningverlening binnen de bestemming niet-landelijke commerciële radio-omroep en de bestemming
      commerciële radio-omroep middengolf worden de [artikelen 15 tot en met 18][ref1] alleen toegepast als voor ten
      minste één kavel binnen de desbetreffende bestemming meerdere vergunningaanvragen in behandeling zijn gebleven die
      geheel of gedeeltelijk tot vergunningverlening kunnen leiden. De vergelijkende toets is dan op alle kavels binnen
      die bestemming van toepassing.

      2 Als twee of meer aanvragers als eenzelfde instelling als bedoeld in [artikel 82f van de Mediawet][ref2] worden
      beschouwd, worden zij voor de toepassing van dit artikel en de [artikelen 15 tot en met 18][ref3] behandeld als één
      aanvrager met één vergunningaanvraag.

      3 Als de [artikelen 15 tot en met 18][ref4] niet worden toegepast, vindt vergunningverlening aan een aanvrager
      plaats op volgorde van de voorkeuren die hij aan de aangevraagde kavels heeft gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0022818#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel82f
      [ref3]: https://wetten.overheid.nl/BWBR0022818#Artikel15
      [ref4]: https://wetten.overheid.nl/BWBR0022818#Artikel15
    url: https://wetten.overheid.nl/BWBR0022818/2009-07-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0022818
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0004149
        artikel: 82f
      - id: ref3
        bwb_id: BWBR0022818
        artikel: '15'
      - id: ref4
        bwb_id: BWBR0022818
        artikel: '15'
  - number: '21'
    text: |-
      De aanvrager die een vergunning krijgt:

      a. betaalt binnen tien werkdagen na de vergunningverlening eenderde gedeelte van het financieel bod door er voor
      te zorgen dat het desbetreffende bedrag binnen die termijn is ontvangen op bankrekeningnummer 19.23.23.792 van het
      Ministerie van Economische Zaken/Agentschap Telecom te Groningen; en

      b. betaalt de rest van het financieel bod in twee gelijke termijnen door er voor te zorgen dat de desbetreffende
      bedragen van de eerste en tweede termijn uiterlijk twee, respectievelijk drie jaar na de datum van de
      vergunningverlening zijn ontvangen op het onder a genoemde rekeningnummer.
    url: https://wetten.overheid.nl/BWBR0022818/2009-07-01#Artikel21
  - number: '22'
    text: |-
      1 Als een aanvrager door vergunningverlening beschikt over een combinatie van overlappende kavels als bedoeld in
      [bijlage 3][ref1], zendt hij een programmaonderdeel dat op de frequentie of frequenties van een van die kavels
      tussen 06.00 en 19.00 uur is uitgezonden, met uitzondering van nieuwsuitzendingen en reclameblokken, niet binnen 30
      minuten uit op de frequentie of frequenties van een van de andere kavels.

      2 Het eerste lid is van overeenkomstige toepassing als een vergunning wordt verleend aan een aanvrager voor
      commerciële radio-omroep middengolf die zodanig verbonden is met één of meer vergunninghouders voor landelijke
      commerciële radio-omroep, niet-landelijke commerciële radio-omroep of commerciële radio-omroep middengolf dat
      sprake is van eenzelfde instelling .

      3 Voor de bepaling of er sprake is van eenzelfde instelling als bedoeld in het tweede lid, is
      [artikel 53c, eerste lid, onderdelen a en b, van het Mediabesluit][ref2], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0022818
      [ref2]: https://wetten.overheid.nl/BWBR0004237#Artikel53c
    url: https://wetten.overheid.nl/BWBR0022818/2009-07-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0022818
      - id: ref2
        bwb_id: BWBR0004237
        artikel: 53c
  - number: '23'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0022818/2009-07-01#Artikel23
  - number: '24'
    text: |-
      Deze regeling wordt aangehaald als: Regeling aanvraag en vergelijkende toets vergunningen commerciële radio-omroep
      2007.
    url: https://wetten.overheid.nl/BWBR0022818/2009-07-01#Artikel24
