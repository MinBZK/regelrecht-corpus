  - number: '2'
    text: |-
      De beschikbare frequentieruimte voor niet-landelijke commerciële radio-omroep waarvoor een vergunningaanvraag kan
      worden ingediend is beschreven in [bijlage 1, tabel A][ref1], bij deze regeling, en is verdeeld in twaalf kavels
      genummerd B27 tot en met B38.


      [ref1]: https://wetten.overheid.nl/BWBR0022818
    url: https://wetten.overheid.nl/BWBR0022818/2009-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0022818
  - number: '3'
    text: |-
      De beschikbare frequentieruimte voor commerciële radio-omroep middengolf waarvoor een vergunningaanvraag kan worden
      ingediend is beschreven in [bijlage 1, tabel B][ref1], bij deze regeling, en is verdeeld in vijf kavels genummerd
      C4, C5, C8, C11 en C12.


      [ref1]: https://wetten.overheid.nl/BWBR0022818
    url: https://wetten.overheid.nl/BWBR0022818/2009-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0022818
  - number: '4'
    text: |-
      1 Elke aanvrager dient één vergunningaanvraag in.

      2 Een vergunningaanvraag kan alleen van 4 december 2007 tot en met 21 december 2007 en van 2 januari 2008 tot en
      met 4 januari 2008, op werkdagen tussen 9.00 uur en 17.30 uur en op 4 januari 2008 tussen 9.00 uur en 14.00 uur,
      worden ingediend door persoonlijke aflevering op het volgende adres:

      De Minister van Onderwijs, Cultuur en Wetenschap

      Rijnstraat 50

      2500 BJ Den Haag
    url: https://wetten.overheid.nl/BWBR0022818/2009-07-01#Artikel4
  - number: '5'
    text: |-
      1 De aanvrager gebruikt het model vergunningaanvraag van [bijlage 4][ref1] bij deze regeling.

      2 De vergunningaanvraag:

      a. bevat alle gevraagde gegevens en documenten;

      b. is in de Nederlandse taal gesteld; en

      c. bestaat uit een losbladig exemplaar, aangeduid als origineel, dat door de aanvrager is ondertekend en twee als
      zodanig aangeduide kopieën.

      3 In afwijking van het tweede lid, onderdeel b, kunnen gegevens en documenten die van anderen dan de aanvrager zelf
      afkomstig zijn in de Engelse taal gesteld zijn.

      4 Bij verschil tussen het originele exemplaar en de kopieën geldt het originele exemplaar.

      5 Met de gegevens en documenten van de model vergunningaanvraag worden gelijkgesteld zodanige gegevens en
      bescheiden krachtens het recht van een van de andere lidstaten van de Europese Unie of een van de andere staten die
      partij zijn bij de Overeenkomst betreffende de Europese Economische Ruimte.


      [ref1]: https://wetten.overheid.nl/BWBR0022818
    url: https://wetten.overheid.nl/BWBR0022818/2009-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0022818
  - number: '6'
    text: |-
      1 De aanvrager informeert de Minister per brief die naar het in [artikel 4, tweede lid][ref1], genoemde adres wordt
      gestuurd, onmiddellijk over wijzigingen in de gegevens en documenten van de vergunningaanvraag.

      2 In afwijking van het eerste lid kan een aanvrager de aangegeven voorkeuren, bedoeld in [artikel 8][ref2], het
      uitgebrachte financiële bod, bedoeld in [artikel 9][ref3], en de opgegeven programmatische voornemens, bedoeld in
      [bijlage 4, deel II][ref4], niet wijzigen.


      [ref1]: https://wetten.overheid.nl/BWBR0022818#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0022818#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0022818#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0022818
    url: https://wetten.overheid.nl/BWBR0022818/2009-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0022818
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0022818
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0022818
        artikel: '9'
      - id: ref4
        bwb_id: BWBR0022818
  - number: '7'
    text: |-
      De aanvrager verstrekt aan de Minister op diens verzoek en aanwijzingen nadere gegevens en documenten die hij voor
      de beslissing op een vergunningaanvraag nodig acht.
    url: https://wetten.overheid.nl/BWBR0022818/2009-07-01#Artikel7
  - number: '8'
    text: |-
      1 De aanvrager die meerdere kavels voor niet-landelijke commerciële radio-omroep aanvraagt geeft in de
      vergunningaanvraag per aangevraagd kavel aan welke voorkeur hij aan het verkrijgen van die kavel geeft.

      2 Hij geeft de voorkeuren aan door de kavels op basis van voorkeur oplopend te nummeren, beginnend met het getal
      één voor de kavel waarvoor zijn belangstelling het grootst is.
    url: https://wetten.overheid.nl/BWBR0022818/2009-07-01#Artikel8
  - number: '9'
    text: De aanvrager brengt op iedere kavel die hij aanvraagt een onvoorwaardelijk en onherroepelijk financieel bod uit.
    url: https://wetten.overheid.nl/BWBR0022818/2009-07-01#Artikel9
  - number: '10'
    text: |-
      Als niet is voldaan aan [artikel 4, tweede lid][ref1], wordt de vergunningaanvraag afgewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0022818#Artikel4
    url: https://wetten.overheid.nl/BWBR0022818/2009-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0022818
        artikel: '4'
  - number: '11'
    text: |-
      1 Als niet voldaan is aan de [artikelen 4, eerste lid][ref1], [5][ref2] of [8][ref3], krijgt de aanvrager
      gedurende vijf werkdagen de gelegenheid dit verzuim te herstellen.

      2 Als de aanvrager het verzuim niet op tijd herstelt, wordt de vergunningaanvraag niet in behandeling genomen.

      3 In afwijking van het tweede lid bepaalt de Minister via loting welke vergunningaanvraag in behandeling wordt
      genomen als het verzuim [artikel 4, eerste lid][ref4], betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0022818#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0022818#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0022818#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0022818#Artikel4
    url: https://wetten.overheid.nl/BWBR0022818/2009-07-01#Artikel11
