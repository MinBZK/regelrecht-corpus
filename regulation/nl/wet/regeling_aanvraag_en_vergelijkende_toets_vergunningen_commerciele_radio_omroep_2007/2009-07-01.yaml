  text: |-
    Gelet op artikel 3.3, vijfde lid, van de Telecommunicatiewet en de artikelen 4, 6, eerste lid, en 8, eerste lid,
    van het Frequentiebesluit;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0022818/2009-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. Minister: Minister van Onderwijs, Cultuur en Wetenschap;

      b. commerciële radio-omroep: radio-omroep als bedoeld in [artikel 1, onder e, van de Mediawet][ref1] door een
      commerciële omroepinstelling als bedoeld in [artikel 1, onder dd, van die wet][ref2];

      c. niet-landelijke commerciële radio-omroep: commerciële radio-omroep via FM- frequenties waarvoor op grond
      van [artikel 7 van de Regeling aanwijzing en gebruik frequentieruimte commerciële radio-omroep 2003][ref3]
      gebruiksvoorschriften gelden;

      d. commerciële radio-omroep middengolf: commerciële radio-omroep via middengolffrequenties;

      e. kavel: frequentie of samenstel van frequenties voor het gebruik waarvan een vergunning kan worden verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0014740#Artikel7
