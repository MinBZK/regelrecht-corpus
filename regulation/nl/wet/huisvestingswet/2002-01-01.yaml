        artikel: '182'
      - id: ref5
        bwb_id: BWBR0001854
        artikel: '184'
  - number: '88'
    text: |-
      De gemeenteraad stelt geen regels die leiden tot een algeheel verbod van het in gebruik nemen of geven van een
      woonschip op een ligplaats.
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel88
  - number: '89.1'
    text: |-
      De Woonruimtewet 1947 (*Stb.* H 291) wordt ingetrokken. In de [Woningwet 1962][ref1] vervallen de
      [artikelen 56][ref2] en [56a tot en met 56i][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002379
      [ref2]: https://wetten.overheid.nl/BWBR0002379#Artikel56
      [ref3]: https://wetten.overheid.nl/BWBR0002379#Artikel56a
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0002379
      - id: ref2
        bwb_id: BWBR0002379
        artikel: '56'
      - id: ref3
        bwb_id: BWBR0002379
        artikel: 56a
  - number: '91.1'
    text: |-
      [Artikel 4, tweede lid, tweede volzin][ref1], is niet van toepassing op overeenkomsten als bedoeld in
      [artikel 4, eerste lid][ref2], voor zover zij zijn totstandgekomen voor het tijdstip van in werking treden van
      de desbetreffende bepaling. Uiterlijk drie maanden na dat tijdstip verstrekken burgemeester en wethouders aan de
      gemeenteraad een overzicht van voor de gemeente verbindende overeenkomsten waarop het bepaalde in de vorige volzin
      van toepassing is, en van de wijze waarop zij voornemens zijn te bevorderen dat die overeenkomsten worden aangevuld
      met een bepaling als bedoeld in [artikel 4, tweede lid, tweede volzin][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005674#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0005674#Artikel4
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0005674
        artikel: '4'
        hoofdstuk: I
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0005674
        artikel: '4'
        hoofdstuk: I
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0005674
        artikel: '4'
        hoofdstuk: I
        paragraaf: '3'
  - number: '91.2'
    text: |-
      Een vergunning, voor het tijdstip van in werking treden van [hoofdstuk II][ref1] van deze wet verleend
      op grond van artikel 1, eerste lid, van de Woonruimtewet 1947 (*Stb.* H 291), wordt gelijkgesteld met een
      huisvestingsvergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0005674
        hoofdstuk: II
  - number: '91.3'
    text: |-
      Een woonruimte of gebouw of gedeelte daarvan, op het tijdstip van in werking treden van [hoofdstuk IV][ref1]
      van deze wet gevorderd op grond van artikel 7, eerste lid, van de Woonruimtewet 1947 (*Stb.* H 291), wordt
      gelijkgesteld met een woonruimte of gebouw of gedeelte daarvan, gevorderd op grond van [artikel 40][ref2], met dien
      verstande dat in plaats van de artikelen 46 tot en met 51 de artikelen 13 en 14 van de Woonruimtewet 1947 (*Stb.*
      H 291) van toepassing blijven. Een vordering als bedoeld in de eerste volzin, die voor onbepaalde tijd is gedaan,
      wordt gelijkgesteld met een vordering, gedaan op het tijdstip van in werking treden van [hoofdstuk IV][ref3] van
      deze wet voor een tijdsduur van tien jaar. Een vordering als bedoeld in de eerste volzin, die voor bepaalde tijd is
      gedaan, eindigt op het tijdstip dat in het besluit tot vordering is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#HoofdstukIV
      [ref2]: https://wetten.overheid.nl/BWBR0005674#Artikel40
      [ref3]: https://wetten.overheid.nl/BWBR0005674#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0005674
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0005674
        artikel: '40'
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0005674
        hoofdstuk: IV
  - number: '91.4'
    text: |-
      Een vergunning, voor het tijdstip van in werking treden van [hoofdstuk III][ref1] van deze wet verleend krachtens
      [artikel 56][ref2] of [56a van de Woningwet 1962][ref3] (*Stb.* 1964, 222), wordt voor zover nodig gelijkgesteld
      met een vergunning, verleend ingevolge [artikel 30, eerste lid][ref4], onderscheidenlijk [artikel 33][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0005674#HoofdstukIII
      [ref2]: https://wetten.overheid.nl/BWBR0002379#Artikel56
      [ref3]: https://wetten.overheid.nl/BWBR0002379#Artikel56a
      [ref4]: https://wetten.overheid.nl/BWBR0005674#Artikel30
      [ref5]: https://wetten.overheid.nl/BWBR0005674#Artikel33
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0005674
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0002379
        artikel: '56'
      - id: ref3
        bwb_id: BWBR0002379
        artikel: 56a
      - id: ref4
        bwb_id: BWBR0005674
        artikel: '30'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref5
        bwb_id: BWBR0005674
        artikel: '33'
        hoofdstuk: III
        paragraaf: '2'
  - number: '91.5'
    text: |-
      Aanvragen om vergunning, ingediend voor het in werking treden van de desbetreffende hoofdstukken van deze wet,
      worden voor zover nodig behandeld volgens het voordien geldende recht.
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel91
  - number: '91.6'
    text: |-
      [Artikel 86][ref1] is niet van toepassing op woningen en gebouwen waarvan de wederrechtelijke ingebruikneming heeft
      plaatsgevonden voor het tijdstip waarop [dat artikel][ref2] in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel86
      [ref2]: https://wetten.overheid.nl/BWBR0005674#Artikel86
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0005674
        artikel: '86'
        hoofdstuk: X
      - id: ref2
        bwb_id: BWBR0005674
        artikel: '86'
        hoofdstuk: X
  - number: '91.7'
    text: |-
      In hetgeen overigens met het oog op het in werking treden van deze wet regeling behoeft, wordt voorzien bij
      algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel91
  - number: '92.1'
    text: |-
      De verschillende bepalingen van deze wet of onderdelen daarvan treden in werking op bij koninklijk besluit te
      bepalen tijdstippen.
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel92
  - number: '92.2'
    text: Deze wet kan worden aangehaald als Huisvestingswet.
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel92
