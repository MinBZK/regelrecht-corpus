---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: huisvestingswet
regulatory_layer: WET
publication_date: '2015-04-16'
valid_from: '2002-01-01'
bwb_id: BWBR0005674
url: https://wetten.overheid.nl/BWBR0005674/2002-01-01
preamble:
  text: |-
    Wij Beatrix bij de Gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het ter bevordering van een evenwichtige en rechtvaardige verdeling van
    schaarse woonruimte en met het oog op de doorzichtigheid van de wetgeving wenselijk is nieuwe regelen te stellen
    met betrekking tot de verdeling van woonruimte en de samenstelling van de woonruimtevoorraad;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel1
  - number: 1.1.a
    text: 'Onze Minister: Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer;'
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel1
  - number: 1.1.b
    text: |-
      woonruimte: besloten ruimte die, al dan niet te zamen met een of meer andere ruimten, bestemd of geschikt is voor
      bewoning door een huishouden;
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel1
  - number: 1.1.c
    text: 'woonschip: schip dat uitsluitend of in hoofdzaak gebezigd wordt of bestemd is voor bewoning;'
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel1
  - number: 1.1.d
    text: 'ligplaats: plaats in het water, bestemd of aangewezen om door een woonschip bij verblijf te worden ingenomen;'
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel1
  - number: 1.1.e
    text: |-
      standplaats: een kavel, bestemd voor het plaatsen van een woonwagen, waarop voorzieningen aanwezig zijn die op het
      leidingnet van de openbare nutsbedrijven, andere instellingen of van gemeenten kunnen worden aangesloten;
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel1
  - number: 1.1.f
    text: |-
      woonwagen: voor bewoning bestemd gebouw dat is geplaatst op een standplaats en dat in zijn geheel of in delen kan
      worden verplaatst;
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel1
  - number: 1.1.g
    text: |-
      huisvestingsverordening: de verordening, bedoeld in [artikel 2][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel2
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005674
        artikel: '2'
        hoofdstuk: I
        paragraaf: '2'
  - number: 1.1.h
    text: |-
      huisvestingsvergunning: een vergunning als bedoeld in [artikel 7, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel7
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005674
        artikel: '7'
        hoofdstuk: II
        paragraaf: '1'
  - number: 1.1.i
    text: |-
      leegstaan; het niet of niet krachtens een zakelijk of persoonlijk recht in gebruik zijn, alsmede een gebruik dat de
      kennelijke strekking heeft afbreuk te doen aan de werking van deze wet;
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel1
  - number: 1.1.j
    text: |-
      huurprijs: de prijs die bij huur en verhuur is verschuldigd voor het enkele gebruik van een woonruimte, uitgedrukt
      in een bedrag per maand, dan wel, indien het betreft een standplaats voor een woonwagen of een ligplaats van
      een woonschip, het bedrag dat is verschuldigd voor het innemen van die standplaats, onderscheidenlijk ligplaats,
      uitgedrukt in een bedrag per maand;
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel1
  - number: 1.1.k
    text: 'koopprijs: de prijs die voor de enkele koop van een woonruimte daadwerkelijk is of zal worden betaald;'
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel1
  - number: 1.1.l
    text: |-
      economische binding aan een gebied: de binding van een persoon aan een gebied, daarin gelegen dat die persoon,
      met het oog op de voorziening in het bestaan, een redelijk belang heeft zich in dat gebied te vestigen, met
      dien verstande dat een economische binding in elk geval wordt aangenomen ten aanzien van personen die voor de
      voorziening in het bestaan zijn aangewezen op het duurzaam verrichten van arbeid binnen of vanuit dat gebied;
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel1
  - number: 1.1.m
    text: |-
      maatschappelijke binding aan een gebied: de binding van een persoon aan een gebied, daarin gelegen dat die persoon
      een redelijk, met de plaatselijke samenleving verband houdend belang heeft zich in dat gebied te vestigen, met dien
      verstande dat een maatschappelijke binding in elk geval wordt aangenomen ten aanzien van personen die ten minste
      zes jaar onafgebroken ingezetene zijn, dan wel gedurende de voorafgaande tien jaar ten minste zes jaar onafgebroken
      ingezetene zijn geweest van dat gebied;
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel1
  - number: 1.1.n
    text: |-
      regio: een gebied dat uit een oogpunt van het functioneren van de woonruimtemarkt als een samenhangend geheel kan
      worden beschouwd.
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel1
  - number: '1.2'
    text: |-
      Voor zover niet anders is bepaald, wordt in deze wet en de daarop berustende bepalingen onder eigenaar van een
      woonruimte of een gebouw verstaan: degene die bevoegd is tot het in gebruik geven van die woonruimte of dat gebouw.
      Onder "eigenaar in de zin van het Burgerlijk Wetboek" wordt in deze wet en de daarop berustende bepalingen mede
      verstaan: de erfpachter, vruchtgebruiker, gerechtigde tot een appartementsrecht als bedoeld in [artikel 106 van
      Boek 5 van het Burgerlijk Wetboek](onbekend), of degene aan wie door een rechtspersoon het gebruiksrecht van een
      woonruimte is verleend.
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel1
  - number: '1.3'
    text: 'In deze wet en de daarop berustende bepalingen worden onder woonruimte mede begrepen:'
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel1
  - number: 1.3.a
    text: een standplaats,
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel1
  - number: 1.3.b
    text: een ligplaats.
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel1
  - number: '1.4'
    text: |-
      Indien de huurprijs hoger is dan de maximale huurprijsgrens voor de desbetreffende woonruimte, vastgesteld
      overeenkomstig het bij of krachtens de [Huurprijzenwet woonruimte][ref1] (*Stb.* 1986, 331) daaromtrent bepaalde,
      dan wel indien een woonruimte niet verhuurd is en evenmin te huur wordt aangeboden, geldt voor de toepassing
      van deze wet en de daarop berustende bepalingen als huurprijs: de maximale huurprijsgrens, ongeacht of de
      [Huurprijzenwet woonruimte][ref2] op de betrokken overeenkomst van huur en verhuur wel of niet van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0003221
      [ref2]: https://wetten.overheid.nl/BWBR0003221
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003221
      - id: ref2
        bwb_id: BWBR0003221
  - number: '1.5'
    text: |-
      Indien voor een woonruimte die niet verhuurd is en evenmin te huur wordt aangeboden, niet een maximale
      huurprijsgrens kan worden bepaald als bedoeld in het vierde lid, geldt voor de toepassing van deze wet en de daarop
      berustende bepalingen als huurprijs: de huurprijs die bij huur en verhuur als woonruimte redelijkerwijs zou kunnen
      worden overeengekomen, gelet op de huurprijs die in het economisch verkeer voor vergelijkbare woonruimten wordt
      overeengekomen.
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel1
  - number: '2.1'
    text: |-
      Indien het naar het oordeel van de gemeenteraad noodzakelijk is regelen te stellen met betrekking tot het in
      gebruik nemen of geven van woonruimte als bedoeld in [hoofdstuk II][ref1], of met betrekking tot wijzigingen van de
      woonruimtevoorraad als bedoeld in [hoofdstuk III][ref2], stelt de gemeenteraad een huisvestingsverordening vast.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0005674#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005674
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0005674
        hoofdstuk: III
  - number: '2.2'
    text: |-
      Ten behoeve van de toepassing van het eerste lid gaat de gemeenteraad in elk geval na hoe met regelen als in dat
      lid bedoeld, kan worden bewerkstelligd dat bij het in gebruik geven van woonruimten met een verhoudingsgewijs lage
      prijs zoveel mogelijk voorrang wordt gegeven aan woningzoekenden die, gelet op hun inkomen, in het bijzonder op die
      woonruimten zijn aangewezen. Tevens gaat de gemeenteraad na op welke wijze kan worden bewerkstelligd dat bij het in
      gebruik nemen of geven van een standplaats voorrang wordt verleend aan woningzoekenden, die in een woonwagen wonen
      of hebben gewoond.
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel2
  - number: '2.3'
    text: |-
      Tot 1 januari 2003 geldt in afwijking van het eerste lid, dat een gemeenteraad van de in de bijlage genoemde
      betrokken gemeenten een huisvestingsverordening vaststelt voor het in gebruik nemen of geven van een standplaats.
      De in de eerste volzin bedoelde gemeenteraad bepaalt in zijn huisvestingsverordening dat bij het in gebruik nemen
      of geven van een standplaats voorrang wordt verleend aan woningzoekenden, die direct voorafgaand aan het tijdstip
      van intrekking van de Woonwagenwet ten minste een jaar in een woonwagen op een standplaats hebben gewoond, die is
      gelegen op een in de bijlage genoemd regionaal woonwagencentrum.
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel2
  - number: '2.4'
    text: |-
      Tot 1 januari 2003 geldt in afwijking van het eerste lid tevens, dat een gemeenteraad van een bij
      ministeriële regeling aan te wijzen gemeente waar zich een substantieel tekort aan standplaatsen voordoet, een
      huisvestingsverordening vaststelt voor het in gebruik nemen of geven van een standplaats. De in de eerste volzin
      bedoelde gemeenteraad bepaalt in zijn huisvestingsverordening dat bij het in gebruik nemen of geven van een
      standplaats voorrang wordt verleend aan woningzoekenden die in een woonwagen op een standplaats wonen of hebben
      gewoond in die gemeente of in een bij de in de eerste volzin bedoelde ministeriële regeling aan te duiden regio.
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel2
  - number: '2.5'
    text: |-
      Indien een van de gemeenten, bedoeld in het derde of vierde lid, gelegen is in een samenwerkingsgebied als
      bedoeld in [artikel 1, onder b, van de Kaderwet bestuur in verandering][ref1], stelt het algemeen bestuur van een
      regionaal openbaar lichaam als bedoeld in [hoofdstuk 2 van die wet][ref2], de in het derde of vierde lid bedoelde
      huisvestingsverordening vast.


      [ref1]: https://wetten.overheid.nl/BWBR0006620#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0006620#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006620
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0006620
        hoofdstuk: '2'
  - number: '3.1'
    text: |-
      Bij de voorbereiding van een besluit tot vaststelling of wijziging van een huisvestingsverordening plegen
      burgemeester en wethouders overleg met de in de gemeente werkzame, ingevolge [artikel 70, eerste lid][ref1], of
      [artikel 70j, eerste lid, van de Woningwet][ref2] (*Stb.* 1991, 439) toegelaten instellingen en met andere daarvoor
      naar hun oordeel in aanmerking komende organisaties die binnen de gemeente op het gebied van de woonruimteverdeling
      werkzaam zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel70
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel70j
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '70'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: 70j
  - number: '3.2'
    text: |-
      Burgemeester en wethouders zenden een besluit tot vaststelling of wijziging van een huisvestingsverordening toe aan
      gedeputeerde staten. Zij zenden een afschrift van een zodanig besluit toe aan de ter plaatse bevoegde inspecteur
      van de volkshuisvesting, bedoeld in [artikel 94 van de Woningwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel94
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '94'
  - number: '4.1'
    text: |-
      Indien een gemeente met een eigenaar van een of meer woonruimten een overeenkomst sluit over het in gebruik geven
      daarvan, is [artikel 2, tweede lid][ref1], van overeenkomstige toepassing op de in zodanige overeenkomst op te
      nemen bepalingen.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel2
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005674
        artikel: '2'
        hoofdstuk: I
        paragraaf: '2'
  - number: '4.2'
    text: |-
      Indien een gemeente een of meer overeenkomsten sluit, als bedoeld in het eerste lid, draagt zij er zorg voor, dat
      een belanghebbende bij een besluit ter uitvoering van zodanige overeenkomst, daarover zijn beklag kan doen bij een
      daartoe ingestelde commissie, die haar taak onafhankelijk van de gemeente en van de betrokken eigenaar of eigenaren
      van woonruimte verricht. Een overeenkomst als bedoeld in het eerste lid, dient een bepaling te bevatten, er toe
      strekkende dat de uitspraken van de in de eerste volzin bedoelde commissie, voor zover zij betrekking hebben op de
      uitvoering van die overeenkomst, partijen bij de overeenkomst tot bindend advies strekken.
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel4
  - number: '4.3'
    text: |-
      Bij de uitvoering van een overeenkomst als bedoeld in het eerste lid worden de ingevolge [artikel 61][ref1] ter
      zake van de woonruimteverdeling vastgestelde richtlijnen en de ingevolge [artikel 67][ref2] of [artikel 68][ref3]
      ter zake van de woonruimteverdeling gegeven aanwijzingen in acht genomen. Op de criteria die worden
      toegepast bij het in gebruik geven van woonruimten waarop de overeenkomst betrekking heeft, zijn de krachtens
      [artikel 13 ][ref4]en in de [artikelen 13a tot en met 13c][ref5] gestelde regels van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel61
      [ref2]: https://wetten.overheid.nl/BWBR0005674#Artikel67
      [ref3]: https://wetten.overheid.nl/BWBR0005674#Artikel68
      [ref4]: https://wetten.overheid.nl/BWBR0005674#Artikel13c
      [ref5]: https://wetten.overheid.nl/BWBR0005674#Artikel13a
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005674
        artikel: '61'
        hoofdstuk: V
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005674
        artikel: '67'
        hoofdstuk: V
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0005674
        artikel: '68'
        hoofdstuk: V
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0005674
        artikel: 13c
        hoofdstuk: II
        paragraaf: '3'
      - id: ref5
        bwb_id: BWBR0005674
        artikel: 13a
        hoofdstuk: II
        paragraaf: '3'
  - number: '5'
    text: |-
      De gemeenteraad kan, voor zover dat in het belang van een evenwichtige en rechtvaardige verdeling van woonruimte
      noodzakelijk is, in de huisvestingsverordening woonruimte aanwijzen die niet voor bewoning in gebruik mag worden
      genomen of gegeven, indien voor het in gebruik nemen daarvan geen huisvestingsvergunning is verleend. In afwijking
      van de eerste volzin is tot 1 januari 2003 in de in de bijlage genoemde betrokken gemeenten, alsmede in de
      krachtens [artikel 2, vierde lid][ref1], aangewezen gemeenten, voor het in gebruik nemen of geven van een woonwagen
      op een standplaats een huisvestingsvergunning voor een standplaats vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel2
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005674
        artikel: '2'
        hoofdstuk: I
        paragraaf: '2'
  - number: '6.1'
    text: |-
      Een aanwijzing als bedoeld in [artikel 5][ref1], kan niet betreffen:


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel5
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005674
        artikel: '5'
        hoofdstuk: II
        paragraaf: '1'
  - number: 6.1.a
    text: woonruimten, bestemd voor inwoning;
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel6
  - number: 6.1.b
    text: woonwagens;
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel6
  - number: 6.1.c
    text: woonschepen.
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel6
  - number: '6.2'
    text: |-
      Behoudens het bepaalde in het vierde lid, kan, indien de koopprijs onderscheidenlijk de huurprijs daarvan de ter
      zake in het derde lid gestelde grens te boven gaat, een aanwijzing evenmin betreffen:
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel6
  - number: 6.2.a
    text: |-
      woonruimten die in gebruik zullen worden genomen door de eigenaar ervan in de zin van het Burgerlijk Wetboek, en
      die hetzij niet eerder bewoond zijn geweest, hetzij sedert de eerste ingebruikname, dan wel gedurende ten minste
      de zes maanden waarin zij laatstelijk bewoond zijn geweest, bewoond werden door de eigenaar ervan in de zin van het
      Burgerlijk Wetboek, en
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel6
  - number: 6.2.b
    text: andere woonruimten dan bedoeld onder *a*.
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel6
  - number: '6.3'
    text: 'De grenzen bedoeld in het tweede lid, bedragen:'
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel6
  - number: 6.3.a
    text: |-
      voor de aanwijzing van woonruimten als bedoeld in dat lid, onder *a*: het in de betrokken gemeente geldende
      hoogste bedrag voor de koopsom van een woonruimte, voor het verkrijgen in eigendom waarvan aan degene die zodanige
      woonruimte als eigenaar zal bewonen, afhankelijk van de hoogte van diens inkomen, krachtens wettelijk voorschrift
      van overheidswege subsidie kan worden verstrekt;
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel6
  - number: 6.3.b
    text: |-
      voor de aanwijzing van woonruimten als bedoeld in dat lid, onder *b*: een twaalfde deel van het bedrag, op het
      tijdstip van de aanwijzing genoemd in artikel 16 van de Wet individuele huursubsidie (*Stb.* 1990, 394), dan wel
      het bedrag op het tijdstip van de aanwijzing genoemd in [artikel 13, eerste lid, onder ][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel13
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: '13'
  - number: '6.4'
    text: |-
      In afwijking van het bepaalde in het tweede lid, kunnen woonruimten als daar bedoeld worden aangewezen, voor zover
      zodanige aanwijzing in het belang van een evenwichtige en rechtvaardige verdeling van woonruimte noodzakelijk
      is in verband met uit bovengemeentelijk ruimtelijk beleid voortvloeiende geringe mogelijkheden tot uitbreiding
      van de woonruimtevoorraad in de betrokken gemeente of in een of meer kernen, behorend tot die gemeente. Zodanige
      aanwijzing behoeft de goedkeuring van gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel6
  - number: '7.1'
    text: |-
      Het is verboden zonder vergunning van burgemeester en wethouders een woonruimte, aangewezen overeenkomstig
      [artikel 5][ref1], in gebruik te nemen voor bewoning.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel5
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005674
        artikel: '5'
        hoofdstuk: II
        paragraaf: '1'
  - number: '7.2'
    text: |-
      Het is verboden een woonruimte, aangewezen overeenkomstig [artikel 5][ref1], voor bewoning in gebruik te geven aan
      een persoon die niet beschikt over een huisvestingsvergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel5
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005674
        artikel: '5'
        hoofdstuk: II
        paragraaf: '1'
  - number: '7.3'
    text: |-
      Voor de toepassing van het eerste en tweede lid, wordt het in gebruik nemen of geven van een woonwagen die op een
      standplaats staat, of van een woonschip dat op een ligplaats ligt, aangemerkt als het in gebruik nemen of geven van
      die standplaats onderscheidenlijk ligplaats.
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel7
  - number: '8'
    text: |-
      De gemeenteraad kan, voor zover dat in het belang van een evenwichtige en rechtvaardige verdeling van woonruimte
      noodzakelijk is, in de huisvestingsverordening bepalen dat de leegstand van woonruimten in daarbij aangegeven
      gevallen door de eigenaar aan burgemeester en wethouders dient te worden gemeld, zodra die leegstand langer duurt
      dan een daarbij aangegeven termijn van ten minste twee maanden.
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel8
  - number: '9.1'
    text: |-
      De gemeenteraad wijst in de huisvestingsverordening de categorieën van woningzoekenden aan die met het oog op een
      evenwichtige en rechtvaardige verdeling van de woonruimte, aangewezen overeenkomstig [artikel 5][ref1], voor het
      verkrijgen van een huisvestingsvergunning in aanmerking komen.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel5
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005674
        artikel: '5'
        hoofdstuk: II
        paragraaf: '1'
  - number: '9.2'
    text: 'Een huisvestingsvergunning wordt uitsluitend verleend aan personen die:'
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel9
  - number: 9.2.a
    text: de Nederlandse nationaliteit bezitten of op grond van een wettelijke bepaling als Nederlander worden behandeld, of
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel9
  - number: 9.2.b
    text: |-
      vreemdeling zijn en rechtmatig verblijf houden als bedoeld in
      [artikel 8, onder a tot en met e en l, van de Vreemdelingenwet 2000][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: '10'
    text: |-
      De gemeenteraad kan in de huisvestingsverordening voorts bepalen dat een of meer daarbij aan te wijzen categorieën
      van woonruimte, aangewezen overeenkomstig [artikel 5][ref1], met het oog op een evenwichtige en rechtvaardige
      verdeling van woonruimte, in verband met de aard, grootte of prijs van die woonruimte, slechts passend is voor een
      daarbij aangewezen gedeelte van de ingevolge [artikel 9][ref2] aangewezen categorieën van woningzoekenden.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005674#Artikel9
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0005674
        artikel: '5'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005674
        artikel: '9'
        hoofdstuk: II
        paragraaf: '3'
  - number: '11.1'
    text: |-
      De gemeenteraad kan, voor zover dat in het belang van een evenwichtige en rechtvaardige verdeling van woonruimte
      noodzakelijk is, in de huisvestingsverordening tevens bepalen dat voor daarbij aan te wijzen categorieën van
      woonruimte, aangewezen overeenkomstig [artikel 5][ref1], bij het verlenen van huisvestingsvergunningen voorrang
      wordt gegeven aan woningzoekenden waarvoor de voorziening in de behoefte aan woonruimte dringend noodzakelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel5
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0005674
        artikel: '5'
        hoofdstuk: II
        paragraaf: '1'
  - number: '11.2'
    text: |-
      Bij toepassing van het eerste lid stelt de gemeenteraad in de huisvestingsverordening tevens criteria vast volgens
      welke de woningzoekenden, bedoeld in [artikel 9][ref1], worden ingedeeld in urgentiecategorieën.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel9
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0005674
        artikel: '9'
        hoofdstuk: II
        paragraaf: '3'
  - number: '11.3'
    text: |-
      Tot de criteria, bedoeld in het tweede lid, kan mede behoren dat aan de woonruimte welke de woningzoekende verlaat,
      met het oog op een evenwichtige en rechtvaardige verdeling van woonruimte dringend behoefte bestaat.
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel11
  - number: '12.1'
    text: |-
      De gemeenteraad kan, voor zover dat in het belang van een evenwichtige en rechtvaardige verdeling van woonruimte
      noodzakelijk is, in de huisvestingsverordening bovendien bepalen dat voor daarbij aan te wijzen categorieën van
      woonruimte, aangewezen overeenkomstig [artikel 5][ref1], bij het verlenen van huisvestingsvergunningen voorrang
      wordt gegeven aan personen die zijn geplaatst op een door burgemeester en wethouders aan de eigenaar van de
      betrokken woonruimte gedane voordracht.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel5
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005674
        artikel: '5'
        hoofdstuk: II
        paragraaf: '1'
  - number: '12.2'
    text: |-
      Bij toepassing van het eerste lid stelt de gemeenteraad in de huisvestingsverordening tevens vast welke categorieën
      woningzoekenden in aanmerking komen om op een voordracht als bedoeld in het eerste lid te worden geplaatst en
      volgens welke criteria binnen die categorieën van woningzoekenden de rangorde naar urgentie wordt bepaald.
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel12
  - number: '12.3'
    text: |-
      Tot de criteria, bedoeld in het tweede lid, kan mede behoren dat aan de woonruimte welke de woningzoekende verlaat,
      met het oog op een evenwichtige en rechtvaardige verdeling van woonruimte dringend behoefte bestaat.
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel12
  - number: '13'
    text: |-
      Bij algemene maatregel van bestuur kunnen met het oog op de bescherming van daarbij aan te geven categorieën van
      woningzoekenden regels worden gesteld met betrekking tot de toepassing van [artikel 9, eerste lid][ref1], en de
      [artikelen 10 tot en met 12][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0005674#Artikel10
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0005674
        artikel: '9'
        hoofdstuk: II
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0005674
        artikel: '10'
        hoofdstuk: II
        paragraaf: '3'
  - number: 13a.1
    text: |-
      De gemeenteraad kan voor zover dit noodzakelijk is met het oog op een evenwichtige en rechtvaardige verdeling
      van woonruimte in de huisvestingsverordening criteria vaststellen voor de verlening van huisvestingsvergunningen,
      waarbij onderscheid kan worden gemaakt tussen woningzoekenden die al of niet een economische of maatschappelijke
      binding hebben aan een in die verordening aangeduide regio.
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel13a
  - number: 13a.2
    text: |-
      Indien de gemeenteraad toepassing geeft aan het eerste lid behoeft de vaststelling van die criteria voorafgaande
      toestemming van gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel13a
  - number: 13a.3
    text: 'Gedeputeerde staten kunnen hun toestemming slechts onthouden indien naar hun oordeel:'
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel13a
  - number: 13a.3.a
    text: |-
      het aangeduide gebied niet kan worden aangemerkt als een regio in de zin van
      [artikel 1, eerste lid, onderdeel n][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel1
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0005674
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
  - number: 13a.3.b
    text: |-
      het beoogde onderscheid onnodig belemmerend zou zijn voor de huisvestingsmogelijkheden van woningzoekenden die geen
      economische of maatschappelijke binding hebben met de regio, mede gelet op de huisvestingsmogelijkheden voor deze
      woningzoekenden in andere delen van de betrokken regio, of
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel13a
  - number: 13a.3.c
    text: |-
      het beoogde onderscheid onvoldoende is afgestemd op het bovengemeentelijke ruimtelijke beleid of op het
      huisvestingsbeleid van andere gemeenten.
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel13a
  - number: 13a.4
    text: |-
      Het tweede lid is niet van toepassing voor zover een onderscheid als bedoeld in het eerste lid, is voorgeschreven
      in, dan wel uitdrukkelijk is toegelaten bij een richtlijn als bedoeld in [artikel 61][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel61
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0005674
        artikel: '61'
        hoofdstuk: V
        paragraaf: '2'
  - number: 13b.1
    text: |-
      De gemeenteraad kan voor zover dit noodzakelijk is met het oog op een evenwichtige en rechtvaardige verdeling
      van woonruimte in verband met uit bovengemeentelijk ruimtelijk beleid voortvloeiende geringe mogelijkheden tot
      uitbreiding van de woonruimtevoorraad in de betrokken gemeente of kern, in de huisvestingsverordening criteria
      vaststellen voor de verlening van huisvestingsvergunningen, waarbij onderscheid kan worden gemaakt tussen
      woningzoekenden die al of niet een economische of maatschappelijke binding hebben aan de gemeente of aan een tot de
      gemeente behorende kern.
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel13b
  - number: 13b.2
    text: |-
      Indien de gemeenteraad toepassing geeft aan het eerste lid, behoeft de vaststelling van die criteria voorafgaande
      toestemming van gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel13b
  - number: 13b.3
    text: 'Gedeputeerde staten kunnen hun toestemming slechts onthouden, indien het beoogde onderscheid naar hun oordeel:'
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel13b
  - number: 13b.3.a
    text: |-
      onnodig belemmerend zou zijn voor de huisvestingsmogelijkheden van woningzoekenden die geen economische of
      maatschappelijke binding hebben met de gemeente of kern, mede gelet op de huisvestingsmogelijkheden voor deze
      woningzoekenden in andere delen van de betrokken regio, of
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel13b
  - number: 13b.3.b
    text: |-
      onvoldoende is afgestemd op het bovengemeentelijke ruimtelijke beleid of op het huisvestingsbeleid van andere
      gemeenten.
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel13b
  - number: 13b.4
    text: |-
      Het tweede lid is niet van toepassing voor zover een onderscheid als bedoeld in het eerste lid is voorgeschreven
      in, dan wel uitdrukkelijk is toegelaten bij een beleidsregel als bedoeld in [artikel 61][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel61
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel13b
    references:
      - id: ref1
        bwb_id: BWBR0005674
        artikel: '61'
        hoofdstuk: V
        paragraaf: '2'
  - number: 13c.1
    text: |-
      Behoudens het bepaalde in het tweede lid, wordt geen onderscheid naar economische of maatschappelijke binding
      gemaakt ten aanzien van woningzoekenden:
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel13c
  - number: 13c.1.a
    text: |-
      waarvan redelijkerwijs niet of niet meer verwacht kan worden dat zij door het duurzaam verrichten van arbeid in hun
      bestaan voorzien, zoals gepensioneerden, ernstig invaliden en langdurig werklozen;
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel13c
  - number: 13c.1.b
    text: |-
      die als remigrant wensen terug te keren naar Nederland of zijn teruggekeerd, doch nog niet over passende
      huisvesting beschikken;
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel13c
  - number: 13c.1.c
    text: |-
      die met toepassing van artikel 15, eerste lid, van de Vreemdelingenwet als vluchteling zijn toegelaten of van wie
      het verzoek om toelating als vluchteling is afgewezen, onder verlening, gelijktijdig of nadien, van een vergunning
      tot verblijf of humanitaire gronden, als bedoeld in artikel 9 van de Vreemdelingenwet, zonder dat daaraan
      beperkingen zijn verbonden, een en ander indien zij in verband met die omstandigheid woonruimte behoeven;
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel13c
  - number: 13c.1.d
    text: |-
      die na echtscheiding, scheiding van tafel en bed of ontbinding van het huwelijk na scheiding van tafel en bed, in
      verband met die omstandigheid dringend woonruimte behoeven, of
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel13c
  - number: 13c.1.e
    text: |-
      die een procedure tot echtscheiding, scheiding van tafel en bed of ontbinding van het huwelijk na scheiding
      van tafel en bed aanhangig hebben gemaakt en een voorlopige voorziening als bedoeld in [artikel 822][ref1] en
      [823 van het Wetboek van Burgerlijke Rechtsvordering][ref2] hebben verkregen, indien zij in verband met die
      omstandigheid dringend woonruimte behoeven.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel822
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel823
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel13c
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '822'
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '823'
  - number: 13c.2
    text: |-
      Voor zover dat in het belang van een evenwichtige en rechtvaardige verdeling van woonruimte noodzakelijk is in
      verband met uit bovengemeentelijk ruimtelijk beleid voortvloeiende geringe mogelijkheden tot uitbreiding van de
      woonruimtevoorraad in de gemeente of in een of meer kernen, behorend tot de gemeente, kunnen gedeputeerde staten
      bij het verlenen van toestemming als bedoeld in [artikel 13][ref1], onderscheidenlijk provinciale staten bij een
      beleidsregel als bedoeld in [artikel 61][ref2], toestaan dat wordt afgeweken van het bepaalde in het eerste lid,
      onder *a, b, d* en *e*.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel13b
      [ref2]: https://wetten.overheid.nl/BWBR0005674#Artikel61
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel13c
    references:
      - id: ref1
        bwb_id: BWBR0005674
        artikel: 13b
        hoofdstuk: II
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0005674
        artikel: '61'
        hoofdstuk: V
        paragraaf: '2'
  - number: '14.1'
    text: |-
      De gemeenteraad kan in het belang van een evenwichtige en rechtvaardige verdeling van woonruimte in de
      huisvestingsverordening bepalen dat door burgemeester en wethouders een register van woningzoekenden wordt
      bijgehouden.
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel14
  - number: '14.2'
    text: 'Ingeval toepassing wordt gegeven aan het eerste lid, wordt in de huisvestingsverordening tevens bepaald:'
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel14
  - number: 14.2.a
    text: welke woningzoekenden voor inschrijving in het register in aanmerking komen;
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel14
  - number: 14.2.b
    text: |-
      welke gegevens met het oog op een goede toepassing van de verordening bij een verzoek om inschrijving moeten worden
      overgelegd;
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel14
  - number: 14.2.c
    text: hoe lang een inschrijving geldig blijft;
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel14
  - number: 14.2.d
    text: welke gegevens op het bewijs van inschrijving moeten worden vermeld;
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel14
  - number: 14.2.e
    text: in welke gevallen een inschrijving door burgemeester en wethouders kan worden doorgehaald.
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel14
  - number: '14.3'
    text: |-
      Bij de bepaling welke woningzoekenden voor inschrijving in het register in aanmerking komen, worden slechts
      criteria vastgesteld, die ingevolge de huisvestingsverordening bij de verlening van de huisvestingsvergunning
      overeenkomstig [artikel 25][ref1] worden toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel25
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0005674
        artikel: '25'
        hoofdstuk: II
        paragraaf: '6'
  - number: '15'
    text: |-
      Ingeval de gemeenteraad toepassing geeft aan [artikel 11][ref1] of [12][ref2], geeft hij tevens toepassing aan
      [artikel 14][ref3]. In dat geval worden als woningzoekenden die voor inschrijving in het register in aanmerking
      komen, in elk geval aangewezen:


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0005674#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0005674#Artikel14
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005674
        artikel: '11'
        hoofdstuk: II
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0005674
        artikel: '12'
        hoofdstuk: II
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0005674
        artikel: '14'
        hoofdstuk: II
        paragraaf: '4'
  - number: 15.a
    text: |-
      bij toepassing van [artikel 11][ref1]: de woningzoekenden die kunnen worden ingedeeld in een andere dan de laagste
      urgentiecategorie;


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel11
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005674
        artikel: '11'
        hoofdstuk: II
        paragraaf: '3'
  - number: 15.b
    text: |-
      bij toepassing van [artikel 12][ref1]: de categorieën woningzoekenden die in aanmerking komen om op een voordracht
      als bedoeld in [artikel 12, eerste lid][ref2], te worden geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0005674#Artikel12
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005674
        artikel: '12'
        hoofdstuk: II
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0005674
        artikel: '12'
        hoofdstuk: II
        paragraaf: '3'
  - number: '17.1'
    text: |-
      De gemeenteraad kan in de huisvestingsverordening regels stellen met betrekking tot centrale registratie van
      woningzoekenden die daartegen geen bedenkingen hebben. De eigenaars van woonruimte die zelf een registratie van
      woningzoekenden bijhouden, zijn verplicht aan die centrale registratie medewerking te verlenen.
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel17
  - number: '17.2'
    text: |-
      Tenzij de huisvestingsverordening anders bepaalt, kunnen burgemeester en wethouders eigenaren van woonruimte
      machtigen een of meer van hun bevoegdheden krachtens deze paragraaf uit te oefenen.
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel17
  - number: '18.1'
    text: |-
      De eigenaar van een woonruimte die is aangewezen overeenkomstig [artikel 12, eerste lid][ref1], is verplicht het
      ter beschikking komen van die woonruimte onverwijld aan burgemeester en wethouders te melden.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel12
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0005674
        artikel: '12'
        hoofdstuk: II
        paragraaf: '3'
  - number: '18.2'
    text: |-
      Gelijktijdig met de melding, bedoeld in het eerste lid, kan de eigenaar aan burgemeester en wethouders een
      woningzoekende voordragen.
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel18
  - number: '18.3'
    text: |-
      Het eerste lid is niet van toepassing, indien de woonruimte zal worden bewoond door de eigenaar ervan in de zin
      van het Burgerlijk Wetboek, en de woonruimte gedurende ten minste de zes maanden waarin deze laatstelijk bewoond is
      geweest, bewoond werd door de eigenaar ervan in de zin van het Burgerlijk Wetboek.
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel18
  - number: '19.1'
    text: |-
      Tot uiterlijk twee weken nadat het ter beschikking komen van een woonruimte ingevolge
      [artikel 18, eerste lid][ref1], is gemeld, kunnen burgemeester en wethouders aan de eigenaar een of meer
      woningzoekenden voordragen die behoren tot de ingevolge [artikel 12, tweede lid][ref2], aangewezen categorieën.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0005674#Artikel12
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0005674
        artikel: '18'
        hoofdstuk: II
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0005674
        artikel: '12'
        hoofdstuk: II
        paragraaf: '3'
  - number: '19.2'
    text: |-
      Bij het opstellen van de voordracht slaan burgemeester en wethouders acht op de rangorde naar urgentie, zoals die
      ingevolge [artikel 12, tweede lid][ref1], is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel12
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0005674
        artikel: '12'
        hoofdstuk: II
        paragraaf: '3'
  - number: '20'
    text: |-
      In afwijking van [artikel 19, eerste lid][ref1], doen burgemeester en wethouders geen voordracht, indien aan
      de door de eigenaar voorgedragen woningzoekende op grond van de ingevolge de [artikelen 9][ref2], [10][ref3] en
      [11][ref4] geldende eisen een huisvestingsvergunning kan worden verleend en er voor het doen van een voordracht
      geen in aanmerking komende woningzoekenden zijn ingeschreven wier behoefte aan woonruimte urgenter is dan die van
      de door de eigenaar voorgedragen woningzoekende.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0005674#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0005674#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0005674#Artikel11
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0005674
        artikel: '19'
        hoofdstuk: II
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0005674
        artikel: '9'
        hoofdstuk: II
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0005674
        artikel: '10'
        hoofdstuk: II
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0005674
        artikel: '11'
        hoofdstuk: II
        paragraaf: '3'
  - number: '21.1'
    text: |-
      Burgemeester en wethouders kunnen de voordracht intrekken, indien de voordracht niet leidt tot de totstandkoming
      van een overeenkomst tussen de eigenaar en een der voorgedragen woningzoekenden, uit kracht waarvan die
      woningzoekende gerechtigd is de betrokken woonruimte voor bewoning in gebruik te nemen.
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel21
  - number: '21.2'
    text: |-
      Gelijktijdig met de intrekking van een voordracht overeenkomstig het eerste lid, kunnen burgemeester en
      wethouders aan de eigenaar opnieuw een of meer woningzoekenden voordragen die behoren tot de ingevolge
      [artikel 12, tweede lid][ref1], aangewezen categorieën. [Artikel 19, tweede lid][ref2], [artikel 20][ref3] en het
      eerste lid van dit artikel zijn van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0005674#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0005674#Artikel20
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0005674
        artikel: '12'
        hoofdstuk: II
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0005674
        artikel: '19'
        hoofdstuk: II
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0005674
        artikel: '20'
        hoofdstuk: II
        paragraaf: '5'
  - number: '21.3'
    text: |-
      In afwijking van het tweede lid kan geen nieuwe voordracht meer worden gedaan, zodra 10 weken zijn verstreken nadat
      het ter beschikking komen van de woonruimte ingevolge [artikel 18, eerste lid][ref1], is gemeld.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel18
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0005674
        artikel: '18'
        hoofdstuk: II
        paragraaf: '5'
  - number: '22'
    text: |-
      De gemeenteraad stelt in de huisvestingsverordening nadere regels met betrekking tot de toepassing van deze
      paragraaf. Daarbij regelt hij in ieder geval de wijze waarop een woningzoekende, behorende tot een krachtens
      [artikel 12, tweede lid][ref1], aangewezen categorie, desverzocht op de hoogte wordt gesteld van de toepassing die
      te zijnen aanzien is gegeven aan de bij of krachtens deze paragraaf gestelde voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel12
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0005674
        artikel: '12'
        hoofdstuk: II
        paragraaf: '3'
  - number: '23.1'
    text: 'De gemeenteraad stelt in de huisvestingsverordening regels met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel23
  - number: 23.1.a
    text: de wijze waarop een huisvestingsvergunning kan worden aangevraagd;
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel23
  - number: 23.1.b
    text: de gegevens die door de aanvrager moeten worden verstrekt met het oog op de beoordeling van de aanvraag;
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel23
  - number: 23.1.c
    text: de termijn waarbinnen door burgemeester en wethouders op de aanvraag moet worden beslist;
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel23
  - number: 23.1.d
    text: de gegevens die ten minste in de beschikking op de aanvraag moeten worden vermeld.
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel23
  - number: '23.2'
    text: |-
      De gemeenteraad kan in de huisvestingsverordening bepalen dat een aanvraag slechts in behandeling wordt genomen,
      indien de aanvrager aannemelijk kan maken dat hij, indien hij een huisvestingsvergunning voor de in de aanvraag
      aangegeven woonruimte krijgt, die woonruimte ook daadwerkelijk in gebruik zal kunnen nemen.
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel23
  - number: '23.3'
    text: |-
      Een bepaling als bedoeld in het tweede lid, blijft buiten toepassing, indien de aanvraag is gedaan met het oog op
      het bepaalde in artikel 1623, [1623][ref1], of [1623][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006000#Artikel1623i
      [ref2]: https://wetten.overheid.nl/BWBR0006000#Artikel1623j
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0006000
        artikel: 1623i
      - id: ref2
        bwb_id: BWBR0006000
        artikel: 1623j
  - number: '24'
    text: |-
      Indien de vergunning wordt verleend, vermelden burgemeester en wethouders in hun beschikking ten minste de termijn
      waarbinnen van de vergunning gebruik kan worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel24
  - number: '25.1'
    text: |-
      Een huisvestingsvergunning wordt verleend, indien de aanvrager behoort tot een van de ingevolge
      [artikel 9, eerste lid][ref1], aangewezen categorieën van woningzoekenden, voor zover wordt voldaan aan
      [artikel 9, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0005674#Artikel9
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0005674
        artikel: '9'
        hoofdstuk: II
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0005674
        artikel: '9'
        hoofdstuk: II
        paragraaf: '3'
  - number: '25.2'
    text: |-
      Ingeval voor de betrokken woonruimte toepassing is gegeven aan [artikel 10][ref1], dient de woonruimte voor de
      aanvrager tevens passend te zijn, gelet op de ingevolge dat artikel gestelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel10
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0005674
        artikel: '10'
        hoofdstuk: II
        paragraaf: '3'
  - number: '25.3'
    text: |-
      Ingeval voor de betrokken woonruimte toepassing is gegeven aan [artikel 11][ref1], kan de vergunning worden
      geweigerd, indien er in het register van woningzoekenden voldoende voor de betrokken woonruimte in aanmerking
      komende woningzoekenden zijn ingeschreven, die behoren tot een hogere urgentiecategorie dan de aanvrager.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel11
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0005674
        artikel: '11'
        hoofdstuk: II
        paragraaf: '3'
  - number: '25.4'
    text: |-
      Ingeval voor de betrokken woonruimte een voordracht is gedaan krachtens [artikel 19, eerste lid][ref1],
      of [artikel 21, tweede lid][ref2], en die voordracht niet is ingetrokken overeenkomstig
      [artikel 21, eerste lid][ref3], dient de aanvrager voorts te zijn vermeld op die voordracht. Ingeval een voordracht
      ingevolge [artikel 20][ref4] achterwege is gebleven, wordt de vergunning verleend aan de door de eigenaar
      voorgedragen woningzoekende.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0005674#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0005674#Artikel21
      [ref4]: https://wetten.overheid.nl/BWBR0005674#Artikel20
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0005674
        artikel: '19'
        hoofdstuk: II
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0005674
        artikel: '21'
        hoofdstuk: II
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0005674
        artikel: '21'
        hoofdstuk: II
        paragraaf: '5'
      - id: ref4
        bwb_id: BWBR0005674
        artikel: '20'
        hoofdstuk: II
        paragraaf: '5'
  - number: '25.5'
    text: |-
      Het bepaalde in het derde en vierde lid is niet van toepassing, indien de woonruimte zal worden bewoond door de
      eigenaar ervan in de zin van het Burgerlijk Wetboek en de woonruimte gedurende ten minste de zes maanden waarin
      deze laatstelijk bewoond is geweest, bewoond werd door de eigenaar ervan in de zin van het Burgerlijk Wetboek.
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel25
  - number: '26.1'
    text: |-
      Onverminderd [artikel 9, tweede lid][ref1], wordt een huisvestingsvergunning voorts aan iedere aanvrager verleend,
      indien de woonruimte door de eigenaar gedurende een door de gemeenteraad in de huisvestingsverordening te bepalen
      termijn van ten hoogste dertien weken vruchteloos is aangeboden aan de woningzoekenden die ingevolge het bepaalde
      krachtens de [artikelen 9][ref2], [10][ref3], [11][ref4] en [12][ref5] voor die woonruimte in aanmerking komen.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0005674#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0005674#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0005674#Artikel11
      [ref5]: https://wetten.overheid.nl/BWBR0005674#Artikel12
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0005674
        artikel: '9'
        hoofdstuk: II
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0005674
        artikel: '9'
        hoofdstuk: II
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0005674
        artikel: '10'
        hoofdstuk: II
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0005674
        artikel: '11'
        hoofdstuk: II
        paragraaf: '3'
      - id: ref5
        bwb_id: BWBR0005674
        artikel: '12'
        hoofdstuk: II
        paragraaf: '3'
  - number: '26.2'
    text: 'Het eerste lid is slechts van toepassing:'
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel26
  - number: 26.2.a
    text: |-
      ingeval de woonruimte te huur wordt aangeboden en de [Huurprijzenwet woonruimte][ref1] op die woonruimte van
      toepassing is: indien de gevraagde huurprijs niet hoger is dan de voor de betrokken woonruimte ingevolge die wet
      geldende maximale huurprijsgrens;


      [ref1]: https://wetten.overheid.nl/BWBR0003221
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0003221
  - number: 26.2.b
    text: |-
      ingeval de woonruimte te huur wordt aangeboden en de [Huurprijzenwet woonruimte][ref1] niet op die woonruimte
      van toepassing is: indien de gevraagde huurprijs niet hoger is dan redelijk is, gelet op de huurprijs die in het
      economisch verkeer voor vergelijkbare woonruimten wordt overeengekomen;


      [ref1]: https://wetten.overheid.nl/BWBR0003221
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0003221
  - number: 26.2.c
    text: |-
      ingeval de woonruimte te koop wordt aangeboden: indien de koopprijs niet hoger is dan redelijk is gelet op de
      waarde van de woonruimte in het economisch verkeer.
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel26
  - number: '26.3'
    text: |-
      De gemeenteraad stelt in de huisvestingsverordening regels met betrekking tot de wijze waarop de aanbieding
      dient plaats te vinden. De raad kan daarbij tevens regels stellen omtrent de wijze waarop aan burgemeester en
      wethouders moet worden aangetoond dat de aanbieding in overeenstemming met het bij en krachtens de wet bepaalde
      heeft plaatsgevonden, alsmede met betrekking tot de wijze waarop aan burgemeester en wethouders verslag moet worden
      uitgebracht over het verloop van de aanbiedingsprocedure.
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel26
  - number: '26.4'
    text: |-
      Het eerste lid is tot 1 januari 2003 niet van toepassing ten aanzien van een standplaats die is bestemd voor een
      woningzoekende die met een woonwagen op een standplaats staat die is gelegen op een van de in de bijlage genoemde
      regionale woonwagencentra.
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel26
  - number: '27'
    text: |-
      In bijzondere gevallen kunnen burgemeester en wethouders een huisvestingsvergunning verlenen aan
      andere woningzoekenden dan bedoeld in [artikel 9, eerste lid][ref1], voor zover wordt voldaan aan
      [artikel 9, tweede lid][ref2], zonder dat de betrokken woonruimte overeenkomstig het bij en krachtens
      [artikel 26, eerste en derde lid][ref3], bepaalde vruchteloos is aangeboden.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0005674#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0005674#Artikel26
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0005674
        artikel: '9'
        hoofdstuk: II
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0005674
        artikel: '9'
        hoofdstuk: II
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0005674
        artikel: '26'
        hoofdstuk: II
        paragraaf: '6'
  - number: '28'
    text: 'Burgemeester en wethouders kunnen een huisvestingsvergunning intrekken, indien:'
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel28
  - number: 28.a
    text: |-
      de vergunninghouder de erin vermelde woonruimte niet binnen de door burgemeester en wethouders bij de verlening van
      de vergunning gestelde termijn in gebruik heeft genomen;
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel28
  - number: 28.b
    text: |-
      de vergunning is verleend op grond van door de vergunninghouder verstrekte gegevens waarvan deze wist of
      redelijkerwijs moest vermoeden dat zij onjuist of onvolledig waren.
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel28
  - number: '29'
    text: |-
      Van de bevoegdheden krachtens deze paragraaf kunnen burgemeester en wethouders mandaat verlenen aan eigenaren van
      woonruimte, voor zover het die woonruimte betreft.
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel29
  - number: '30.1'
    text: |-
      Het is verboden een woonruimte die behoort tot een door de gemeenteraad in de huisvestingsverordening daartoe met
      het oog op het behoud of de samenstelling van de woonruimtevoorraad aangewezen categorie, zonder vergunning van
      burgemeester en wethouders:
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel30
  - number: 30.1.a
    text: |-
      aan de bestemming tot bewoning te onttrekken, of voor een zodanig gedeelte aan die bestemming te onttrekken, dat
      die woonruimte daardoor niet langer geschikt is voor bewoning door een huishouden van dezelfde omvang als waarvoor
      deze zonder zodanige onttrekking geschikt is;
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel30
  - number: 30.1.b
    text: met andere woonruimte samen te voegen;
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel30
  - number: 30.1.c
    text: van zelfstandige in onzelfstandige woonruimte om te zetten.
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel30
  - number: '30.2'
    text: |-
      Onder zelfstandige woonruimte als bedoeld in het eerste lid, onder *c*, wordt verstaan een woonruimte welke een
      eigen toegang heeft en welke door een huishouden kan worden bewoond zonder dat dit daarbij afhankelijk is van
      wezenlijke voorzieningen buiten die woonruimte.
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel30
  - number: '30.3'
    text: |-
      Woonruimte, aangewezen overeenkomstig [artikel 5][ref1], wordt tevens aangewezen overeenkomstig het eerste lid,
      tenzij een zodanige aanwijzing naar het oordeel van de gemeenteraad met het oog op het behoud of de samenstelling
      van de woonruimtevoorraad niet noodzakelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel5
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0005674
        artikel: '5'
        hoofdstuk: II
        paragraaf: '1'
  - number: '31'
    text: |-
      Een vergunning als bedoeld in [artikel 30, eerste lid][ref1], wordt verleend, tenzij het belang van het behoud
      of de samenstelling van de woonruimtevoorraad groter is dan het met het onttrekken aan de bestemming tot bewoning
      gediende belang en het belang van het behoud of de samenstelling van de woonruimtevoorraad niet door het stellen
      van voorwaarden en voorschriften voldoende kan worden gediend.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel30
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0005674
        artikel: '30'
        hoofdstuk: III
        paragraaf: '1'
  - number: '32'
    text: |-
      De gemeenteraad bepaalt in de huisvestingsverordening ten minste de voorwaarden en voorschriften die burgemeester
      en wethouders in het belang van de voorziening in de behoefte aan woonruimte aan de vergunning, bedoeld in
      [artikel 30, eerste lid][ref1], kunnen verbinden.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel30
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0005674
        artikel: '30'
        hoofdstuk: III
        paragraaf: '1'
  - number: '33.1'
    text: |-
      Het is verboden een recht op een gebouw dat behoort tot een door de gemeenteraad in de huisvestingsverordening
      daartoe aangewezen categorie, zonder vergunning van burgemeester en wethouders te splitsen in appartementsrechten
      als bedoeld in [artikel 106, eerste en derde lid, van Boek 5 van het Burgerlijk Wetboek][ref1], indien een of
      meer appartementsrechten de bevoegdheid omvatten tot het gebruik van een of meer gedeelten van het gebouw als
      woonruimte.


      [ref1]: https://wetten.overheid.nl/BWBR0005288#Artikel106
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0005288
        artikel: '106'
  - number: '33.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing op het verlenen van deelnemings- of lidmaatschapsrechten of het
      aangaan van een verbintenis daartoe door een rechtspersoon met betrekking tot een gebouw als bedoeld in het eerste
      lid.
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel33
  - number: '34.1'
    text: 'De gemeenteraad bepaalt in de huisvestingsverordening ten minste:'
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel34
  - number: 34.1.a
    text: |-
      de gronden die tot weigering van een vergunning als bedoeld in [artikel 33][ref1] kunnen leiden;


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel33
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0005674
        artikel: '33'
        hoofdstuk: III
        paragraaf: '2'
  - number: 34.1.b
    text: |-
      de categorieën van gevallen waarin de beslissing op de aanvraag om een vergunning door burgemeester en wethouders
      wordt aangehouden;
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel34
  - number: 34.1.c
    text: de voorwaarden en voorschriften die burgemeester en wethouders aan de vergunning kunnen verbinden.
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel34
  - number: '34.2'
    text: 'De gronden en regels, bedoeld in het eerste lid, kunnen slechts betrekking hebben op:'
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel34
  - number: 34.2.a
    text: de samenstelling van de woonruimtevoorraad;
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel34
  - number: 34.2.b
    text: het voorkomen van belemmering van de stadsvernieuwing;
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel34
  - number: 34.2.c
    text: |-
      het voorkomen van splitsing van rechten op gebouwen waarvan de toestand uit oogpunt van indeling of staat van
      onderhoud zich geheel of ten dele tegen splitsing in appartementsrechten of de verlening van deelnemings- of
      lidmaatschapsrechten verzet.
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel34
  - number: '34.3'
    text: |-
      Bij algemene maatregel van bestuur kunnen met betrekking tot de toepassing van het eerste lid nadere regels worden
      gesteld.
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel34
  - number: '35.1'
    text: 'De gemeenteraad stelt in de huisvestingsverordening regels met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel35
  - number: 35.1.a
    text: |-
      de wijze waarop een vergunning als bedoeld in [artikel 30, eerste lid][ref1], of [33][ref2], kan worden
      aangevraagd;


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0005674#Artikel33
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0005674
        artikel: '30'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005674
        artikel: '33'
        hoofdstuk: III
        paragraaf: '2'
  - number: 35.1.b
    text: de gegevens die door de aanvrager moeten worden verstrekt met het oog op de beoordeling van de aanvraag;
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel35
  - number: 35.1.c
    text: de termijn waarbinnen door burgemeester en wethouders op de aanvraag moet worden beslist;
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel35
  - number: 35.1.d
    text: de gegevens die ten minste in de beschikking op de aanvraag moeten worden vermeld.
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel35
  - number: '35.2'
    text: |-
      Ingeval van de vergunning slechts gebruik kan worden gemaakt na verlening van vrijstelling van een bestemmingsplan
      als bedoeld in [artikel 10 van de Wet op de Ruimtelijke Ordening][ref1], wordt de aanvraag mede aangemerkt als een
      verzoek om zodanige vrijstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel10
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0002375
        artikel: '10'
  - number: '36.1'
    text: |-
      Indien de aanvraag niet is gedaan door de gebruiker, onderscheidenlijk de eigenaar van de woonruimte of het gebouw,
      zenden burgemeester en wethouders onverwijld aan deze een afschrift van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel36
  - number: '36.2'
    text: |-
      Burgemeester en wethouders stellen de gebruiker, onderscheidenlijk de eigenaar op diens verzoek, voor zover zulks
      nodig is voor de beoordeling van de aanvraag, in de gelegenheid de bij de aanvraag overgelegde gegevens in te
      zien, totdat op de aanvraag onherroepelijk is beslist. Zij verschaffen hem desgevraagd een afschrift daarvan tegen
      betaling van de kosten.
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel36
  - number: '37.1'
    text: |-
      Gedurende vier weken nadat hem overeenkomstig [artikel 36, eerste lid][ref1], mededeling is gedaan, kan de
      gebruiker, onderscheidenlijk de eigenaar zijn zienswijze kenbaar maken aan burgemeester en wethouders.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel36
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0005674
        artikel: '36'
        hoofdstuk: III
        paragraaf: '3'
  - number: '37.2'
    text: Burgemeester en wethouders doen aan de aanvrager onverwijld mededeling van de kenbaar gemaakte zienswijzen.
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel37
  - number: '38'
    text: 'Burgemeester en wethouders kunnen een vergunning intrekken, indien:'
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel38
  - number: 38.a
    text: |-
      niet binnen een jaar nadat de beschikking onherroepelijk is geworden, is overgegaan tot onttrekking, samenvoeging
      of omzetting, onderscheidenlijk tot overschrijving in de openbare registers van de akte van splitsing in
      appartementsrechten, bedoeld in [artikel 109 van Boek 5 van het Burgerlijk Wetboek][ref1], of tot het verlenen van
      deelnemings- of lidmaatschapsrechten;


      [ref1]: https://wetten.overheid.nl/BWBR0005288#Artikel109
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0005288
        artikel: '109'
  - number: 38.b
    text: |-
      de vergunning is verleend op grond van door de vergunninghouder verstrekte gegevens waarvan deze wist of
      redelijkerwijs moest vermoeden dat zij onjuist of onvolledig waren.
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel38
  - number: '39'
    text: |-
      Inschrijving in de openbare registers van een akte als bedoeld in
      [artikel 109 van Boek 5 van het Burgerlijk Wetboek][ref1] vindt alleen plaats, indien onder de akte een
      notariële verklaring is opgenomen, dat ten tijde van het verlijden van de akte een vergunning als bedoeld in
      [artikel 33][ref2] niet is vereist, dan wel onherroepelijk is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0005288#Artikel109
      [ref2]: https://wetten.overheid.nl/BWBR0005674#Artikel33
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0005288
        artikel: '109'
      - id: ref2
        bwb_id: BWBR0005674
        artikel: '33'
        hoofdstuk: III
        paragraaf: '2'
  - number: '40.1'
    text: |-
      Burgemeester en wethouders kunnen, indien dat voor een evenwichtige en rechtvaardige verdeling van woonruimte
      noodzakelijk is, van de eigenaar van een in de gemeente aanwezige leegstaande woonruimte, een leegstaand gebouw,
      niet zijnde een of meer woonruimten, of een leegstaand gedeelte van een zodanig gebouw, dan wel van een woonruimte
      die in strijd met de bij of krachtens deze wet gegeven voorschriften zonder huisvestingsvergunning of vergunning
      ingevolge [artikel 30][ref1] in gebruik genomen is, het gebruik daarvan als woonruimte vorderen. De vordering
      vindt niet plaats dan na overleg met de eigenaar. De vordering kan mede betrekking hebben op het gebruik van bij
      de woonruimte of het gebouw behorende of voor de toegang daartoe noodzakelijke andere ruimten en van de daarbij
      behorende centrale en nutsvoorzieningen.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel30
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0005674
        artikel: '30'
        hoofdstuk: III
        paragraaf: '1'
  - number: '40.2'
    text: |-
      Ten aanzien van leegstaande woonruimte die laatstelijk door de eigenaar gedurende een termijn van ten minste een
      jaar onafgebroken als eigenaar is bewoond geweest, maken burgemeester en wethouders gedurende een termijn van
      een jaar na het tijdstip waarop de bewoning door de eigenaar een einde heeft genomen, geen gebruik van hun in het
      eerste lid omschreven bevoegdheid, tenzij er gewichtige redenen zijn om niettemin tot vordering over te gaan. Onder
      eigenaar wordt in dit lid degene verstaan, die eigenaar is in de zin van het Burgerlijk Wetboek.
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel40
  - number: '40.3'
    text: |-
      Ten aanzien van leegstaande woonruimte die nimmer is bewoond geweest, maken burgemeester en wethouders gedurende
      een termijn van een jaar na het tijdstip waarop de woonruimte voor bewoning is gereedgekomen, geen gebruik van
      hun in het eerste lid omschreven bevoegdheid, tenzij er gewichtige redenen zijn om niettemin tot vordering over
      te gaan.
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel40
  - number: '41'
    text: |-
      Een vordering als bedoeld in [artikel 40, eerste lid][ref1], vindt plaats voor een door burgemeester en wethouders
      bij hun besluit tot vordering bepaalde tijdsduur van ten hoogste tien jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel40
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0005674
        artikel: '40'
        hoofdstuk: IV
        paragraaf: '1'
  - number: '42'
    text: |-
      Tegelijkertijd met de bekendmaking van een last tot vordering wordt daarvan mededeling gedaan door aanplakking van
      een afschrift op of nabij de woonruimte, het gebouw of het gedeelte van een gebouw waarop de vordering betrekking
      heeft.
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel42
  - number: '43'
    text: 'De last bevat ten minste:'
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel43
  - number: 43.a
    text: |-
      een omschrijving van de woonruimte, het gebouw of het gedeelte van een gebouw waarvan het gebruik wordt gevorderd,
      en van de ruimten of voorzieningen op het gebruik waarvan de vordering mede betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel43
  - number: 43.b
    text: de datum waarop de last is gegeven;
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel43
  - number: 43.c
    text: de termijn waarbinnen aan de vordering moet worden voldaan;
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel43
  - number: 43.d
    text: de tijdsduur waarvoor gevorderd wordt.
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel43
  - number: '44.1'
    text: |-
      Tegen een besluit tot vordering als bedoeld in [artikel 40, eerste lid][ref1], kan een belanghebbende beroep
      instellen bij de Afdeling bestuursrechtspraak van de Raad van State.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel40
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0005674
        artikel: '40'
        hoofdstuk: IV
        paragraaf: '1'
  - number: '44.2'
    text: |-
      [Artikel 7:1][ref1] en [titel 8.3 van de Algemene wet bestuursrecht][ref2] blijven buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0005537
  - number: '44.3'
    text: |-
      De werking van het in het eerste lid bedoelde besluit wordt opgeschort totdat de beroepstermijn is verstreken of,
      indien beroep is ingesteld, op het beroep is beslist.
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel44
  - number: '44.4'
    text: |-
      De Afdeling behandelt de zaak met toepassing van [afdeling 8.2.3 van de Algemene wet bestuursrecht][ref1] en doet
      uiterlijk acht weken na de dag waarop het beroepschrift is ontvangen, uitspraak. Blijkt aan de Afdeling dat de zaak
      een gewone behandeling vordert, dan doet zij binnen dertien weken uitspraak.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling8.2.3
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 8.2.3
  - number: '45.1'
    text: |-
      De eigenaar van een woonruimte, een gebouw of een gedeelte van een gebouw, met betrekking waartoe toepassing is
      gegeven aan [artikel 40, eerste lid][ref1], is verplicht het gevorderde binnen de in de last aangegeven termijn ter
      beschikking van burgemeester en wethouders te stellen. Voor zover het gevorderde bestemd is om te worden gebruikt
      als woonruimte, wordt het, tenzij het in de voorafgaande periode eveneens gevorderd was, leeg aan burgemeester en
      wethouders ter beschikking gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel40
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0005674
        artikel: '40'
        hoofdstuk: IV
        paragraaf: '1'
  - number: '45.2'
    text: |-
      Het is een ieder verboden de uitvoering van de vordering van een woonruimte, een gebouw of een gedeelte van een
      gebouw te belemmeren. Indien de vordering betrekking heeft op een woonwagen of woonschip, is het een ieder verboden
      die woonwagen of dat woonschip te verplaatsen.
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel45
  - number: '45.3'
    text: |-
      Waar in het vervolg van dit hoofdstuk sprake is van de eigenaar van een overeenkomstig het eerste lid aan
      burgemeester en wethouders ter beschikking gestelde woonruimte of ter beschikking gesteld gebouw of gedeelte
      van een gebouw, wordt daaronder verstaan: degene die bevoegd zou zijn geweest tot het in gebruik geven van die
      woonruimte, dat gebouw of gedeelte van een gebouw, indien de vordering niet zou hebben plaats gevonden.
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel45
  - number: '46.1'
    text: |-
      Burgemeester en wethouders zijn bevoegd aan het gevorderde de voorzieningen uit te voeren die noodzakelijk zijn met
      het oog op het beoogde gebruik ervan als woonruimte.
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel46
  - number: '46.2'
    text: Zij plegen tevoren zo mogelijk overleg met de eigenaar.
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel46
  - number: '47.1'
    text: |-
      Bij hun besluit tot vordering bepalen burgemeester en wethouders de door de gemeente aan de eigenaar maandelijks
      verschuldigde vorderingsvergoeding.
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel47
  - number: '47.2'
    text: |-
      De vorderingsvergoeding wordt, met inachtneming van de geldende prijsvoorschriften, vastgesteld op een bedrag dat
      in het economisch verkeer redelijk is.
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel47
  - number: '47.3'
    text: |-
      Indien aan het gevorderde voorzieningen zijn uitgevoerd als bedoeld in [artikel 46][ref1], worden deze bij het
      vaststellen van de vorderingsvergoeding buiten beschouwing gelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel46
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0005674
        artikel: '46'
        hoofdstuk: IV
        paragraaf: '1'
  - number: '47.4'
    text: |-
      De gemeente vergoedt de eigenaar de kosten die deze redelijkerwijs heeft moeten maken met het oog op het leeg ter
      beschikking stellen van het gevorderde.
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel47
  - number: '48'
    text: |-
      Burgemeester en wethouders kunnen ambtshalve, dan wel op een daartoe strekkend verzoek van de eigenaar het bedrag
      van de vorderingsvergoeding wijzigen, teneinde de vergoeding in overeenstemming te brengen met een voor het in
      gebruik geven van het gevorderde redelijke prijs. [Artikel 47, tweede en derde lid][ref1], is met betrekking tot
      het in de eerste volzin bedoelde besluit van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel47
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0005674
        artikel: '47'
        hoofdstuk: IV
        paragraaf: '1'
  - number: '49.1'
    text: |-
      Een vordering ten behoeve van een of meer verblijfsgerechtigden als bedoeld in [artikel 60a, onder a][ref1],
      of een of meer woningzoekenden als bedoeld in [artikel 68, eerste lid][ref2], kan, in afwijking van
      [artikel 40, eerste lid, eerste volzin][ref3], betrekking hebben op een bij het vorderingsbesluit te bepalen aantal
      woonruimten, gebouwen, niet zijnde woonruimte, of gedeelten van zodanige gebouwen van dezelfde eigenaar, dat na het
      tijdstip waarop de vordering is gedaan, ter beschikking komt.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel60a
      [ref2]: https://wetten.overheid.nl/BWBR0005674#Artikel68
      [ref3]: https://wetten.overheid.nl/BWBR0005674#Artikel40
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0005674
        artikel: 60a
        hoofdstuk: V
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005674
        artikel: '68'
        hoofdstuk: V
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0005674
        artikel: '40'
        hoofdstuk: IV
        paragraaf: '1'
  - number: '49.2'
    text: |-
      Met betrekking tot een vordering als bedoeld in het eerste lid zijn de
      [artikelen 40, eerste lid, tweede en derde volzin, tweede en derde lid][ref1], [41][ref2],
      [43, aanhef en onder b en d][ref3], [44][ref4] en [45, eerste lid, tweede volzin, tweede en derde lid][ref5],
      [46][ref6] , [47, tweede tot en met vierde lid][ref7], en [48][ref8] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0005674#Artikel41
      [ref3]: https://wetten.overheid.nl/BWBR0005674#Artikel43
      [ref4]: https://wetten.overheid.nl/BWBR0005674#Artikel44
      [ref5]: https://wetten.overheid.nl/BWBR0005674#Artikel45
      [ref6]: https://wetten.overheid.nl/BWBR0005674#Artikel46
      [ref7]: https://wetten.overheid.nl/BWBR0005674#Artikel47
      [ref8]: https://wetten.overheid.nl/BWBR0005674#Artikel48
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel49
