  - number: '49.3'
    text: |-
      Tegelijkertijd met de bekendmaking van de last tot vordering wordt hiervan mededeling gedaan in een of meer in de
      gemeente verspreide dag-, nieuws- of huis-aan-huisbladen.
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel49
  - number: '49.4'
    text: |-
      De eigenaar is verplicht elke woonruimte, elk gebouw als bedoeld in het eerste lid of elk gedeelte daarvan op het
      tijdstip waarop het ter beschikking komt, ter beschikking van burgemeester en wethouders te stellen, totdat het
      gevorderde aantal is bereikt.
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel49
  - number: '49.5'
    text: |-
      Zodra een terbeschikkingstelling als bedoeld in het derde lid heeft plaatsgevonden, bepalen burgemeester en
      wethouders zo spoedig mogelijk de door de gemeente aan de eigenaar maandelijks verschuldigde vorderingsvergoeding
      voor het ter beschikking gestelde.
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel49
  - number: '50.1'
    text: |-
      Zo spoedig mogelijk nadat het gevorderde ter beschikking van burgemeester en wethouders is gekomen, wijzen zij het
      ter bewoning toe aan een of meer met name te noemen personen.
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel50
  - number: '50.2'
    text: |-
      Bij de toewijzing wijzen burgemeester en wethouders de gebruiker op zijn verplichting ingevolge [artikel 59][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel59
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0005674
        artikel: '59'
        hoofdstuk: IV
        paragraaf: '3'
  - number: '51.1'
    text: |-
      Bij de toepassing van [artikel 50, eerste lid][ref1], stellen burgemeester en wethouders de gebruiksvergoeding
      vast, die de gebruiker voor het enkele gebruik van de gevorderde woonruimte, het gevorderde gebouw of het
      gevorderde gedeelte van een gebouw, met de daarbij behorende onroerende aanhorigheden, aan de gemeente maandelijks
      is verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel50
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0005674
        artikel: '50'
        hoofdstuk: IV
        paragraaf: '2'
  - number: '51.2'
    text: |-
      De gebruiksvergoeding wordt vastgesteld met inachtneming van hetgeen krachtens
      [artikel 15 van de Huurprijzenwet woonruimte][ref1] met betrekking tot de redelijkheid van huurprijzen is bepaald.
      Voor zover dit niet mogelijk is, wordt de gebruiksvergoeding vastgesteld op een bedrag dat in het economisch
      verkeer redelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0003221#Artikel15
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0003221
        artikel: '15'
  - number: '51.3'
    text: |-
      Indien de vordering meer omvat dan het enkele gebruik van de woonruimte, het gebouw of het gedeelte van een gebouw,
      met de daarbij behorende onroerende aanhorigheden, kunnen burgemeester en wethouders bij hun besluit als bedoeld
      in het eerste lid tevens bepalen dat de gebruiker aan de gemeente een aanvullende vergoeding verschuldigd is ter
      dekking van de aan dat meerdere verbonden kosten.
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel51
  - number: '51.4'
    text: |-
      De [artikelen 12 tot en met 14 van de Huurprijzenwet woonruimte][ref1] zijn op een aanvullende vergoeding als
      bedoeld in het derde lid van overeenkomstige toepassing, met dien verstande dat voor huurder steeds gebruiker en
      voor verhuurder steeds burgemeester en wethouders wordt gelezen.


      [ref1]: https://wetten.overheid.nl/BWBR0003221#Artikel12
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0003221
        artikel: '12'
  - number: '51.5'
    text: |-
      Burgemeester en wethouders kunnen bepalen dat de gebruiker het door deze krachtens het eerste en derde lid
      verschuldigde bedrag, of een gedeelte daarvan, maandelijks betaalt aan de eigenaar van het gevorderde, ter gehele
      of gedeeltelijke betaling van de geldsommen die de gemeente krachtens [artikel 47, eerste lid][ref1], aan de
      eigenaar verschuldigd wordt.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel47
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0005674
        artikel: '47'
        hoofdstuk: IV
        paragraaf: '1'
  - number: '51.6'
    text: |-
      Tegelijkertijd met de bekendmaking doen burgemeester en wethouders aan de eigenaar van het gevorderde mededeling
      van een besluit als bedoeld in het vijfde lid.
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel51
  - number: '52.1'
    text: |-
      Burgemeester en wethouders kunnen ambtshalve, dan wel op daartoe strekkend verzoek van de gebruiker het bedrag
      van de gebruiksvergoeding of van de aanvullende vergoeding wijzigen teneinde die vergoeding in overeenstemming te
      brengen met een voor het betrokken gebruik redelijke prijs.
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel52
  - number: '52.2'
    text: |-
      Op een besluit tot wijziging van de gebruiksvergoeding is [artikel 51, tweede lid][ref1], van overeenkomstige
      toepassing. Op een besluit tot wijziging van de aanvullende vergoeding is [artikel 51, vierde lid][ref2], van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel51
      [ref2]: https://wetten.overheid.nl/BWBR0005674#Artikel51
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0005674
        artikel: '51'
        hoofdstuk: IV
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005674
        artikel: '51'
        hoofdstuk: IV
        paragraaf: '2'
  - number: '52.3'
    text: |-
      Op een besluit als bedoeld in het eerste lid zijn het [vijfde en zesde lid van artikel 51][ref1] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel51
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0005674
        artikel: '51'
        hoofdstuk: IV
        paragraaf: '2'
  - number: '53.1'
    text: De gebruiker is verplicht zich met betrekking tot het gevorderde te gedragen als ware hij een goed huurder.
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel53
  - number: '53.2'
    text: |-
      Indien de eigenaar van het gevorderde schade lijdt, doordat de gebruiker de ingevolge het eerste lid geldende
      verplichting niet nakomt, kan de eigenaar deze schade op de gemeente verhalen. Voor zover de schade het gevolg is
      van aan het gevorderde aangebrachte beschadigingen, kan de gemeente deze schade vergoeden door het ongedaan maken
      van die beschadigingen.
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel53
  - number: '53.3'
    text: |-
      De gebruiker is gehouden aan de gemeente de kosten te vergoeden die de gemeente heeft moeten maken voor de
      vergoeding van schade als bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel53
  - number: '54.1'
    text: |-
      Burgemeester en wethouders kunnen besluiten de toewijzing te beëindigen, indien de gebruiker de gebruiksvergoeding
      niet of niet tijdig betaalt of indien de gebruiker de ingevolge [artikel 53][ref1] geldende verplichtingen niet
      nakomt.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel53
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0005674
        artikel: '53'
        hoofdstuk: IV
        paragraaf: '2'
  - number: '54.2'
    text: |-
      De gebruiker is verplicht het gevorderde te ontruimen binnen één maand na de bekendmaking van het besluit tot
      beëindiging van de toewijzing.
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel54
  - number: '55.1'
    text: 'Burgemeester en wethouders beëindigen de vordering:'
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel55
  - number: 55.1.a
    text: indien tussen de gebruiker en de eigenaar een huurovereenkomst tot stand komt;
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel55
  - number: 55.1.b
    text: |-
      indien naar hun oordeel het belang van een evenwichtige en rechtvaardige verdeling van woonruimte het voortzetten
      van de vordering niet langer noodzakelijk maakt.
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel55
  - number: '55.2'
    text: |-
      Burgemeester en wethouders kunnen de vordering op verzoek van de eigenaar tevens beëindigen, indien de eigenaar het
      gevorderde zo dringend voor eigen gebruik - vervreemding niet daaronder begrepen - nodig heeft, dat bij afweging
      van zijn belang tegen het belang van een evenwichtige en rechtvaardige verdeling van woonruimte handhaving van de
      vordering redelijkerwijs niet aanvaardbaar is.
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel55
  - number: '55.3'
    text: |-
      Burgemeester en wethouders geven niet eerder toepassing aan het eerste of tweede lid, dan vier weken nadat zij de
      gebruiker van hun voornemen daartoe op de hoogte hebben gesteld. Zij stellen de gebruiker in de gelegenheid zijn
      zienswijze op het voornemen kenbaar te maken.
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel55
  - number: '56.1'
    text: |-
      Burgemeester en wethouders stellen in hun besluit tot beëindiging van de vordering het tijdstip vast waarop de
      vordering eindigt.
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel56
  - number: '56.2'
    text: |-
      Bij het bepalen van het tijdstip van beëindiging houden burgemeester en wethouders rekening met de tijd die de
      gebruiker redelijkerwijs nodig heeft om het gevorderde te ontruimen.
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel56
  - number: '58.1'
    text: |-
      Behoudens het bepaalde in het derde lid, eindigt de vordering van rechtswege door het verstrijken van de
      overeenkomstig [artikel 41][ref1] vastgestelde tijdsduur.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel41
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0005674
        artikel: '41'
        hoofdstuk: IV
        paragraaf: '1'
  - number: '58.2'
    text: |-
      De eigenaar van het gevorderde stelt de gebruiker ten minste drie maanden voor het verstrijken van de
      overeenkomstig [artikel 41][ref1] vastgestelde tijdsduur schriftelijk daarvan op de hoogte.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel41
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0005674
        artikel: '41'
        hoofdstuk: IV
        paragraaf: '1'
  - number: '58.3'
    text: |-
      Indien een schriftelijke mededeling als bedoeld in het tweede lid niet of niet tijdig voor het verstrijken van
      de daar genoemde tijdsduur is gedaan, eindigt de vordering met ingang van een door de eigenaar vast te stellen
      tijdstip, doch niet eerder dan drie maanden nadat hij dat tijdstip schriftelijk aan de gebruiker heeft medegedeeld.
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel58
  - number: '59'
    text: 'De gebruiker is verplicht het gevorderde onverwijld te ontruimen:'
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel59
  - number: 59.a
    text: |-
      zodra de vordering ingevolge het bepaalde in [artikel 58][ref1] is geëindigd, tenzij voordien een nieuw besluit tot
      vordering als bedoeld in [artikel 40][ref2] onherroepelijk is geworden;


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel58
      [ref2]: https://wetten.overheid.nl/BWBR0005674#Artikel40
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0005674
        artikel: '58'
        hoofdstuk: IV
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0005674
        artikel: '40'
        hoofdstuk: IV
        paragraaf: '1'
  - number: 59.b
    text: |-
      zodra de vordering ingevolge een besluit als bedoeld in [artikel 55, eerste lid, onder b, of tweede lid][ref1],
      is geëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel55
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0005674
        artikel: '55'
        hoofdstuk: IV
        paragraaf: '3'
  - number: '60.1'
    text: |-
      Ingeval de vordering wordt beëindigd met toepassing van [artikel 55, eerste lid, onder a, of tweede lid][ref1], is
      de eigenaar gehouden aan de gemeente de kosten te vergoeden van de overeenkomstig [artikel 46][ref2] uitgevoerde
      voorzieningen, voor zover daarin niet reeds door afschrijving of op andere wijze is voorzien.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel55
      [ref2]: https://wetten.overheid.nl/BWBR0005674#Artikel46
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0005674
        artikel: '55'
        hoofdstuk: IV
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0005674
        artikel: '46'
        hoofdstuk: IV
        paragraaf: '1'
  - number: '60.2'
    text: |-
      Ingeval de vordering is geëindigd ingevolge het bepaalde in [artikel 58][ref1] en voordien niet een nieuw besluit
      tot vordering als bedoeld in [artikel 40][ref2] onherroepelijk is geworden, dan wel ingeval de vordering wordt
      beëindigd met toepassing van [artikel 55, eerste lid, onder b][ref3], is de gemeente gehouden op verzoek van de
      eigenaar aan deze de kosten te vergoeden die hij redelijkerwijs moest maken met het oog op het herstel in de oude
      toestand en die hij ook daadwerkelijk heeft gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel58
      [ref2]: https://wetten.overheid.nl/BWBR0005674#Artikel40
      [ref3]: https://wetten.overheid.nl/BWBR0005674#Artikel55
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0005674
        artikel: '58'
        hoofdstuk: IV
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0005674
        artikel: '40'
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0005674
        artikel: '55'
        hoofdstuk: IV
        paragraaf: '3'
  - number: 60a
    text: 'Voor de toepassing van het in deze paragraaf bepaalde wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel60a
  - number: 60a.a
    text: |-
      verblijfsgerechtigden: vreemdelingen die in Nederland rechtmatig verblijf hebben op grond van
      [artikel 8, onder c, van de Vreemdelingenwet 2000][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel60a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 60a.b
    text: |-
      taakstelling: het aantal in opvangcentra of op gemeentelijke opvangplaatsen verkerende verblijfsgerechtigden in
      wier huisvesting per gemeente per kalenderhalfjaar dient te worden voorzien.
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel60a
  - number: 60b.1
    text: |-
      Burgemeester en wethouders dragen zorg voor de voorziening in de huisvesting van verblijfsgerechtigden in de
      gemeente overeenkomstig de voor de gemeente geldende taakstelling.
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel60b
  - number: 60b.2
    text: |-
      Behoudens toepassing van de bevoegdheid, bedoeld in [artikel 60][ref1], geldt als taakstelling de uitkomst van
      de toepassing van de formule (a:b) * c, waarin wordt voorgesteld: - met de letter a: het aantal inwoners van een
      gemeente volgens de door het Centraal Bureau voor de Statistiek openbaar gemaakte bevolkingscijfers per 1 januari
      van het jaar dat voorafgaat aan het jaar waartoe het kalenderhalfjaar, bedoeld bij de letter c, behoort, dan wel
      het in plaats daarvan op grond van het derde lid vastgestelde aantal;
        - met de letter b: het aantal inwoners van Nederland volgens de door het Centraal Bureau voor de Statistiek
      openbaar gemaakte bevolkingscijfer per 1 januari van het jaar dat voorafgaat aan het jaar waartoe het
      kalenderhalfjaar, bedoeld bij de letter c, behoort;
        - met de letter c: het door Onze Minister van Justitie in de *Staatscourant* bekendgemaakte totale aantal
      verblijfsgerechtigden in wier huisvesting in het bij die bekendmaking aan te geven kalenderhalfjaar naar
      verwachting zal dienen te worden voorzien.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel60c
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel60b
    references:
      - id: ref1
        bwb_id: BWBR0005674
        artikel: 60c
        hoofdstuk: V
        paragraaf: '1'
  - number: 60b.3
    text: |-
      Gedeputeerde staten van de betrokken provincie of de betrokken provincies zijn bevoegd het aantal inwoners van
      een gemeente per 1 januari van het jaar dat voorafgaat aan het jaar waartoe het kalenderhalfjaar, bedoeld in het
      tweede lid bij de letter c, behoort, vast te stellen voor de gemeenten die zijn betrokken bij een wijziging van
      de gemeentelijke indeling en waarvoor de datum van herindeling is gelegen op 1 januari van laatstbedoeld jaar. Bij
      deze vaststelling wordt zo veel mogelijk rekening gehouden met de inwonertallen van de samenstellende delen van de
      bij een wijziging van de gemeentelijke indeling betrokken gemeenten. Een vaststelling per 1 januari van het in de
      eerste volzin eerstbedoelde jaar wordt vóór 1 oktober van dat jaar bekendgemaakt in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel60b
  - number: 60b.4
    text: |-
      De bekendmaking, bedoeld in het tweede lid bij de letter c, geschiedt ten minste dertien weken voor de aanvang van
      het kalenderhalfjaar waarop zij betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel60b
  - number: 60b.5
    text: |-
      De met toepassing van de formule, bedoeld in het tweede lid, verkregen uitkomst wordt naar boven afgerond op een
      geheel getal.
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel60b
  - number: 60c.1
    text: |-
      Gedeputeerde staten zijn op verzoek van een of meer gemeenten bevoegd taakstellingen die volgen uit de
      toepassing van de formule, bedoeld in [artikel 60][ref1], te wijzigen, voor zover de verwezenlijking van het
      bovengemeentelijke ruimtelijke beleid of volkshuisvestingsbeleid of de samenhang tussen het door gemeenten gevoerde
      volkshuisvestingsbeleid dat vordert, met dien verstande dat de som van de aantallen verblijfsgerechtigden in wier
      huisvesting na die wijziging in de betrokken gemeenten te zamen dient te worden voorzien, niet afwijkt van de som
      van de aantallen die worden verkregen met toepassing van de formule, bedoeld in [artikel 60][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel60b
      [ref2]: https://wetten.overheid.nl/BWBR0005674#Artikel60b
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel60c
    references:
      - id: ref1
        bwb_id: BWBR0005674
        artikel: 60b
        hoofdstuk: V
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005674
        artikel: 60b
        hoofdstuk: V
        paragraaf: '1'
  - number: 60c.2
    text: |-
      Ingeval gedeputeerde staten van de in het eerste lid bedoelde bevoegdheid gebruik maken, wijzigen zij de
      taakstellingen ten minste zes weken voor de aanvang van het kalenderhalfjaar waarop de taakstellingen betrekking
      hebben.
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel60c
  - number: 60e.1
    text: |-
      Indien burgemeester en wethouders geheel of gedeeltelijk nalaten uitvoering te geven aan de verplichting, bedoeld
      in [artikel 60][ref1], voorzien gedeputeerde staten in de uitvoering namens burgemeester en wethouders en ten laste
      van de gemeente.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel60b
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel60e
    references:
      - id: ref1
        bwb_id: BWBR0005674
        artikel: 60b
        hoofdstuk: V
        paragraaf: '1'
  - number: 60e.2
    text: |-
      Alvorens toepassing te geven aan het eerste lid plegen gedeputeerde staten overleg met burgemeester en wethouders
      van de betrokken gemeente.
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel60e
  - number: 60e.3
    text: |-
      Gedeputeerde staten stellen, alvorens toepassing te geven aan het eerste lid, burgemeester en wethouders in elk
      geval een termijn, waarbinnen zij alsnog zelf in de uitvoering kunnen voorzien, tenzij de geboden spoed zich
      daartegen verzet.
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel60e
  - number: 60f
    text: |-
      Burgemeester en wethouders brengen acht weken voor het einde van het kalenderhalfjaar verslag uit over de voortgang
      van de uitvoering van de verplichting, bedoeld in [artikel 60][ref1], aan gedeputeerde staten met toezending van
      een afschrift daarvan aan Onze Minister van Binnenlandse Zaken. Burgemeester en wethouders verstrekken daarbij
      tevens inzicht in de maatregelen die worden voorbereid of zijn genomen teneinde geheel uitvoering te geven aan de
      bedoelde verplichting.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel60b
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel60f
    references:
      - id: ref1
        bwb_id: BWBR0005674
        artikel: 60b
        hoofdstuk: V
        paragraaf: '1'
  - number: 60g.1
    text: |-
      Het dagelijks bestuur van een regionaal openbaar lichaam als bedoeld in de [Kaderwet bestuur in verandering][ref1]
      treedt voor de toepassing van de [artikelen 60][ref2], [60][ref3] en [60][ref4] in de plaats van gedeputeerde
      staten.


      [ref1]: https://wetten.overheid.nl/BWBR0006620
      [ref2]: https://wetten.overheid.nl/BWBR0005674#Artikel60c
      [ref3]: https://wetten.overheid.nl/BWBR0005674#Artikel60e
      [ref4]: https://wetten.overheid.nl/BWBR0005674#Artikel60f
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel60g
    references:
      - id: ref1
        bwb_id: BWBR0006620
      - id: ref2
        bwb_id: BWBR0005674
        artikel: 60c
        hoofdstuk: V
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0005674
        artikel: 60e
        hoofdstuk: V
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0005674
        artikel: 60f
        hoofdstuk: V
        paragraaf: '1'
  - number: 60g.2
    text: |-
      [Artikel 27 van de Kaderwet bestuur in verandering][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006620#Artikel27
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel60g
    references:
      - id: ref1
        bwb_id: BWBR0006620
        artikel: '27'
  - number: '61'
    text: |-
      Provinciale staten kunnen, voor zover de verwezenlijking van het bovengemeentelijke ruimtelijke beleid of
      het gebrek aan samenhang tussen het door de gemeenten gevoerde huisvestingsbeleid dat vordert, beleidsregels
      vaststellen met betrekking tot de in de [hoofdstukken I][ref1], [II][ref2] en [III][ref3] geregelde onderwerpen.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#HoofdstukI
      [ref2]: https://wetten.overheid.nl/BWBR0005674#HoofdstukII
      [ref3]: https://wetten.overheid.nl/BWBR0005674#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0005674
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0005674
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0005674
        hoofdstuk: III
  - number: '62'
    text: |-
      Bij de voorbereiding van een beleidsregel als bedoeld in [artikel 61][ref1] plegen gedeputeerde staten overleg met
      de besturen van de gemeenten waarop de beleidsregel betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel61
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0005674
        artikel: '61'
        hoofdstuk: V
        paragraaf: '2'
  - number: '63'
    text: |-
      Tegelijkertijd met de bekendmaking van een beleidsregel doen gedeputeerde staten daarvan mededeling aan Onze
      Minister.
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel63
  - number: '64.1'
    text: |-
      Voor zover zulks ter verwezenlijking van een beleidsregel noodzakelijk is, kunnen gedeputeerde staten het bestuur
      van een gemeente waarop de beleidsregel betrekking heeft, een aanwijzing geven.
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel64
  - number: '64.2'
    text: |-
      Alvorens een aanwijzing te geven plegen gedeputeerde staten overleg met burgemeester en wethouders van de betrokken
      gemeente.
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel64
  - number: '65'
    text: |-
      Tegelijkertijd met de bekendmaking van een aanwijzing doen gedeputeerde staten daarvan mededeling aan provinciale
      staten en aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel65
  - number: '66'
    text: Het gemeentebestuur is verplicht aan een aanwijzing gevolg te geven.
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel66
  - number: '67'
    text: |-
      Indien in een gemeente bij het in gebruik geven van in die gemeente gelegen woonruimten met een verhoudingsgewijs
      lage prijs naar het oordeel van Onze Minister met het oog op een evenwichtige en rechtvaardige verdeling van
      woonruimte in onvoldoende mate voorrang wordt gegeven aan woningzoekenden die, gelet op hun inkomen, in het
      bijzonder op die woonruimten zijn aangewezen, kan hij het bestuur van die gemeente, zo nodig in afwijking
      van een beleidsregel als bedoeld in [artikel 61][ref1], een aanwijzing geven met betrekking tot de in de
      [hoofdstukken I][ref2], [II][ref3] en [III][ref4] geregelde onderwerpen.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel61
      [ref2]: https://wetten.overheid.nl/BWBR0005674#HoofdstukI
      [ref3]: https://wetten.overheid.nl/BWBR0005674#HoofdstukII
      [ref4]: https://wetten.overheid.nl/BWBR0005674#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0005674
        artikel: '61'
        hoofdstuk: V
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005674
        hoofdstuk: I
      - id: ref3
        bwb_id: BWBR0005674
        hoofdstuk: II
      - id: ref4
        bwb_id: BWBR0005674
        hoofdstuk: III
  - number: '68.1'
    text: |-
      Bij ministeriële regeling kunnen categorieën van woningzoekenden worden aangewezen, wier huisvesting bijzondere
      zorg van rijkswege behoeft.
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel68
  - number: '68.2'
    text: |-
      Voor zover zulks met het oog op de huisvesting van een of meer personen, behorende tot een krachtens het eerste
      lid aangewezen categorie, noodzakelijk is, kan Onze Minister aan burgemeester en wethouders van een gemeente een
      aanwijzing geven met betrekking tot de voorziening in de huisvesting van die persoon of personen.
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel68
  - number: '68.3'
    text: |-
      Onze Minister stelt een regeling als bedoeld in het eerste lid slechts vast, indien omstandigheden van bijzondere
      aard daartoe naar zijn oordeel aanleiding geven. De regeling geldt voor een daarbij aangegeven periode van ten
      hoogste twee jaar.
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel68
  - number: '69'
    text: |-
      Alvorens een aanwijzing te geven pleegt Onze Minister overleg met burgemeester en wethouders van de betrokken
      gemeente. Indien een aanwijzing als bedoeld in [artikel 67][ref1] afwijkt van een beleidsregel als bedoeld in
      [artikel 61][ref2], pleegt hij tevens vooraf overleg met gedeputeerde staten van de betrokken provincie.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel67
      [ref2]: https://wetten.overheid.nl/BWBR0005674#Artikel61
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0005674
        artikel: '67'
        hoofdstuk: V
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0005674
        artikel: '61'
        hoofdstuk: V
        paragraaf: '2'
  - number: '70'
    text: Het gemeentebestuur is verplicht aan een aanwijzing gevolg te geven.
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel70
  - number: '72.1'
    text: |-
      Binnen zes weken na verzending van een besluit tot vaststelling van een gebruiksvergoeding als bedoeld in
      [artikel 51, eerste lid][ref1], of tot wijziging van de gebruiksvergoeding, bedoeld in [artikel 52][ref2], kan
      degene aan wie de woonruimte in gebruik is gegeven, een uitspraak over de redelijkheid van dat besluit vragen aan
      de huurcommissie, bedoeld in [artikel 2 van de Wet op de huurcommissies][ref3] (*Stb.* 1979, 16), in welker ressort
      de woonruimte is gelegen.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel51
      [ref2]: https://wetten.overheid.nl/BWBR0005674#Artikel52
      [ref3]: https://wetten.overheid.nl/BWBR0003222#Artikel2
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0005674
        artikel: '51'
        hoofdstuk: IV
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005674
        artikel: '52'
        hoofdstuk: IV
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0003222
        artikel: '2'
  - number: '72.2'
    text: |-
      Een verzoek als bedoeld in het eerste lid wordt schriftelijk ingediend. Onze Minister bepaalt aan welke voorwaarden
      het verzoek moet voldoen en welke gegevens daarbij moeten worden verstrekt of overgelegd.
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel72
  - number: '72.3'
    text: |-
      De huurcommissie doet binnen vier maanden na ontvangst van het verzoek bedoeld in het eerste lid, schriftelijk
      uitspraak. Zij kan deze termijn met ten hoogste twee maanden verlengen. Zij stelt partijen van de duur van de
      verlenging in kennis.
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel72
  - number: '72.4'
    text: |-
      De uitspraak van de huurcommissie is met redenen omkleed. De huurcommissie vermeldt in haar uitspraak de
      gebruiksvergoeding die zij redelijk acht.
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel72
  - number: '72.5'
    text: |-
      De huurcommissie zendt bij aangetekend schrijven een afschrift van haar uitspraak aan de verzoeker en aan
      burgemeester en wethouders. Zij wijst daarbij op de in [artikel 74, eerste lid][ref1], bedoelde mogelijkheid om de
      kantonrechter te verzoeken de gebruiksvergoeding vast te stellen, alsook op de vorm en de termijn die daarbij in
      acht moeten worden genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel74
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0005674
        artikel: '74'
        hoofdstuk: VI
  - number: '73.1'
    text: |-
      Indien noch de gebruiker, noch het college van burgemeester en wethouders binnen twee maanden na verzending van
      het in [artikel 72, vijfde lid][ref1], bedoelde afschrift een verzoek richt tot de kantonrechter, overeenkomstig
      [artikel 74, eerste lid][ref2], geldt als gebruiksvergoeding de vergoeding die de huurcommissie blijkens haar
      uitspraak redelijk acht.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel72
      [ref2]: https://wetten.overheid.nl/BWBR0005674#Artikel74
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0005674
        artikel: '72'
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0005674
        artikel: '74'
        hoofdstuk: VI
  - number: '73.2'
    text: |-
      Een ingevolge het eerste lid verschuldigde gebruiksvergoeding mag in rekening worden gebracht met ingang van
      de datum die was vermeld in het besluit van burgemeester en wethouders tot vaststelling of tot wijziging van de
      gebruiksvergoeding, of, indien de huurcommissie in haar uitspraak een latere datum heeft vermeld, met ingang van
      die latere datum.
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel73
  - number: '74.1'
    text: |-
      Gedurende twee maanden na verzending van een uitspraak van de huurcommissie als bedoeld in
      [artikel 72, eerste lid][ref1], kunnen de gebruiker en burgemeester en wethouders de kantonrechter van de
      rechtbank van het arrondissement waarin de woonruimte is gelegen, schriftelijk en met redenen omkleed verzoeken
      de gebruiksvergoeding vast te stellen. Indien het verzoek niet met redenen is omkleed, stelt de kantonrechter de
      verzoeker in de gelegenheid het verzuim binnen een door hem te bepalen termijn te herstellen.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel72
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0005674
        artikel: '72'
        hoofdstuk: VI
  - number: '74.2'
    text: Een afschrift van de uitspraak van de huurcommissie, bedoeld in het eerste lid, wordt bij het verzoek gevoegd.
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel74
  - number: '74.3'
    text: |-
      De kantonrechter beschikt op het verzoek met inachtneming van het bepaalde in [artikel 51, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel51
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0005674
        artikel: '51'
        hoofdstuk: IV
        paragraaf: '2'
  - number: '74.4'
    text: |-
      De beschikking wordt in het openbaar uitgesproken. De griffier zendt een afschrift van de beschikking aan de
      huurcommissie.
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel74
  - number: '74.5'
    text: |-
      Tegen deze beschikking staat hoger beroep noch beroep in cassatie open, met uitzondering van cassatie in het belang
      van de wet.
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel74
  - number: '74.6'
    text: |-
      [Artikel 73, tweede lid][ref1], is van overeenkomstige toepassing op de door de kantonrechter vastgestelde
      gebruiksvergoeding.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel73
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0005674
        artikel: '73'
        hoofdstuk: VI
  - number: '75.1'
    text: |-
      Met het toezicht op de naleving van het bij of krachtens deze wet bepaalde zijn belast de bij besluit van
      burgemeester en wethouders aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel75
  - number: '75.2'
    text: 'Met het toezicht op de naleving van het bij of krachtens deze wet bepaalde zijn tevens belast:'
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel75
  - number: 75.2.a
    text: |-
      de inspecteur-generaal van de volkshuisvesting, bedoeld in [artikel 94 van de Woningwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel94
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '94'
  - number: 75.2.b
    text: |-
      de inspecteurs van de volkshuisvesting, bedoeld in [artikel 94 van de Woningwet][ref1], en aan dezen toegevoegde
      ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel94
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '94'
  - number: '75.3'
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel75
  - number: '77'
    text: |-
      De toezichthouder is bevoegd, met medeneming van de benodigde apparatuur, een woning binnen te treden zonder
      toestemming van de bewoner.
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel77
  - number: '79'
    text: |-
      De gemeenteraad kan bepalen dat de toegelaten instellingen als bedoeld in
      [artikel 70, eerste lid, van de Woningwet][ref1], die eigenaar zijn van in de gemeente gelegen woonruimten, alsmede
      andere eigenaren van in de gemeente gelegen woonruimten, verslag uitbrengen aan de gemeenteraad over de huisvesting
      in die woonruimten van personen, behorende tot daarbij aangegeven categorieën van woningzoekenden die door andere
      omstandigheden dan hun inkomen moeilijkheden ondervinden bij het vinden van hun passende huisvesting.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel70
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '70'
  - number: '80.1'
    text: |-
      Onze Minister zendt telkens om de vijf jaar aan de Staten-Generaal een verslag over de wijze waarop deze wet is
      toegepast.
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel80
  - number: '80.2'
    text: |-
      In afwijking van het eerste lid zendt Onze Minister binnen twee jaar na de inwerkingtreding van de
      [artikelen 60a tot en met 60g][ref1] aan de Staten-Generaal een verslag over de doeltreffendheid en de effecten van
      die artikelen in de praktijk.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel60a
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0005674
        artikel: 60a
        hoofdstuk: V
        paragraaf: '1'
  - number: '81'
    text: |-
      Een algemene maatregel van bestuur, vastgesteld krachtens deze wet, treedt niet eerder in werking dan twee
      maanden na de datum van uitgifte van het *Staatsblad*, waarin hij is geplaatst. Van de plaatsing wordt onverwijld
      mededeling gedaan aan beide kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel81
  - number: '82.1'
    text: |-
      De besturen van de in de bijlage genoemde gemeenten waarin een regionaal woonwagencentrum is gelegen kunnen
      tot 1 januari 2003, ten aanzien van woningzoekenden van wie de standplaats voor een woonwagen op dat regionaal
      woonwagencentrum wordt opgeheven, de verlening van een huisvestingsvergunning als bedoeld in [artikel 5][ref1] en
      de intrekking van een verleende ontheffing als bedoeld in artikel 10 van de Woonwagenwet, alsmede de overige door
      hen te nemen besluiten voor het opheffen van de standplaats op het regionaal woonwagencentrum en het in gebruik
      nemen of geven van een woonwagen op een nieuwe standplaats, samenvoegen tot één besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel5
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0005674
        artikel: '5'
        hoofdstuk: II
        paragraaf: '1'
  - number: '82.2'
    text: |-
      Op de voorbereiding van een besluit als bedoeld in het eerste lid is de in
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] geregelde procedure van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: '82.3'
    text: Het ontwerp ligt gedurende vier weken voor belanghebbenden ter inzage.
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel82
  - number: '82.4'
    text: |-
      Ten aanzien van de tot één besluit als bedoeld in het eerste lid te bundelen besluiten zijn de in de afzonderlijke
      wetten opgenomen bepalingen inzake voorbereiding en bezwaar en beroep niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel82
  - number: '82.5'
    text: |-
      Dit artikel is niet van toepassing ten aanzien van besluiten op grond van de [Wet op de Ruimtelijke Ordening][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002375
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0002375
  - number: '83.1'
    text: |-
      Een gedraging in strijd met een voorschrift, verbonden aan een vergunning als bedoeld in
      [artikel 30, eerste lid][ref1], of [33][ref2], is verboden.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0005674#Artikel33
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0005674
        artikel: '30'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005674
        artikel: '33'
        hoofdstuk: III
        paragraaf: '2'
  - number: '83.2'
    text: |-
      Het is verboden een afschrift van een last die overeenkomstig [artikel 42][ref1] is aangeplakt, te verwijderen of
      onleesbaar te maken.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel42
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0005674
        artikel: '42'
        hoofdstuk: IV
        paragraaf: '1'
  - number: '84.1'
    text: |-
      Hij die handelt in strijd met het bepaalde bij of krachtens [artikel 45][ref1], [49, vierde lid][ref2], of
      [59][ref3], wordt gestraft met hechtenis van ten hoogste zes maanden of geldboete van de vierde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0005674#Artikel49
      [ref3]: https://wetten.overheid.nl/BWBR0005674#Artikel59
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0005674
        artikel: '45'
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005674
        artikel: '49'
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0005674
        artikel: '59'
        hoofdstuk: IV
        paragraaf: '3'
  - number: '84.2'
    text: |-
      Hij die handelt in strijd met het bepaalde bij of krachtens [artikel 7][ref1], [8][ref2], [17][ref3], [18][ref4],
      [30, eerste lid][ref5], [33][ref6] of [83][ref7] wordt gestraft met hechtenis van ten hoogste vier maanden of
      geldboete van de derde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005674#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0005674#Artikel17
      [ref4]: https://wetten.overheid.nl/BWBR0005674#Artikel18
