  - number: '84.3'
    text: De in het eerste en tweede lid strafbaar gestelde feiten zijn overtredingen.
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel84
  - number: '85'
    text: |-
      Met de opsporing van de bij deze wet strafbaar gestelde feiten zijn, onverminderd
      [artikel 141 van het Wetboek van Strafvordering][ref1], belast de bij of krachtens [artikel 75][ref2] aangewezen
      ambtenaren, voor zover zij tevens buitengewoon opsporingsambtenaar zijn. Deze ambtenaren zijn tevens belast
      met de opsporing van de feiten, strafbaar gesteld in de [artikelen 179][ref3] tot en met [182][ref4] en
      [184 van het Wetboek van Strafrecht][ref5], voor zover deze feiten betrekking hebben op een bevel, vordering of
      handeling, gedaan of ondernomen door henzelf.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
      [ref2]: https://wetten.overheid.nl/BWBR0005674#Artikel75
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel179
      [ref4]: https://wetten.overheid.nl/BWBR0001854#Artikel182
      [ref5]: https://wetten.overheid.nl/BWBR0001854#Artikel184
    url: https://wetten.overheid.nl/BWBR0005674/2002-01-01#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
      - id: ref2
