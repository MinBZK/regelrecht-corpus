        paragraaf: '3'
  - number: 13a
    text: |-
      1 De gemeenteraad kan voor zover dit noodzakelijk is met het oog op een evenwichtige en rechtvaardige verdeling
      van woonruimte in de huisvestingsverordening criteria vaststellen voor de verlening van huisvestingsvergunningen,
      waarbij onderscheid kan worden gemaakt tussen woningzoekenden die al of niet een economische of maatschappelijke
      binding hebben aan een in die verordening aangeduide regio.

      2 Indien de gemeenteraad toepassing geeft aan het eerste lid behoeft de vaststelling van die criteria voorafgaande
      toestemming van gedeputeerde staten.

      3 Gedeputeerde staten kunnen hun toestemming slechts onthouden indien naar hun oordeel:

      a. het aangeduide gebied niet kan worden aangemerkt als een regio in de zin van
      [artikel 1, eerste lid, onderdeel n][ref1];

      b. het beoogde onderscheid onnodig belemmerend zou zijn voor de huisvestingsmogelijkheden van woningzoekenden die
      geen economische of maatschappelijke binding hebben met de regio, mede gelet op de huisvestingsmogelijkheden voor
      deze woningzoekenden in andere delen van de betrokken regio, of

      c. het beoogde onderscheid onvoldoende is afgestemd op het bovengemeentelijke ruimtelijke beleid of op het
      huisvestingsbeleid van andere gemeenten.

      4 Het tweede lid is niet van toepassing voor zover een onderscheid als bedoeld in het eerste lid, is voorgeschreven
      in, dan wel uitdrukkelijk is toegelaten bij een beleidsregel als bedoeld in [artikel 61][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005674#Artikel61
    url: https://wetten.overheid.nl/BWBR0005674/2010-10-01#Artikel13a
