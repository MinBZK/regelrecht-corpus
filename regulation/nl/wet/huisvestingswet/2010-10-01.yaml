  - number: '5'
    text: |-
      De gemeenteraad kan, voor zover dat in het belang van een evenwichtige en rechtvaardige verdeling van woonruimte
      noodzakelijk is, in de huisvestingsverordening woonruimte aanwijzen die niet voor bewoning in gebruik mag worden
      genomen of gegeven, indien voor het in gebruik nemen daarvan geen huisvestingsvergunning is verleend. In afwijking
      van de eerste volzin is tot 1 januari 2003 in de in de bijlage genoemde betrokken gemeenten, alsmede in de
      krachtens [artikel 2, vierde lid][ref1], aangewezen gemeenten, voor het in gebruik nemen of geven van een woonwagen
      op een standplaats een huisvestingsvergunning voor een standplaats vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel2
    url: https://wetten.overheid.nl/BWBR0005674/2010-10-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005674
        artikel: '2'
        hoofdstuk: I
        paragraaf: '2'
  - number: '6'
    text: |-
      1 Een aanwijzing als bedoeld in [artikel 5][ref1], kan niet betreffen:

      a. woonruimten, bestemd voor inwoning;

      b. woonwagens;

      c. woonschepen.

      2 Behoudens het bepaalde in het vierde lid, kan, indien de koopprijs onderscheidenlijk de huurprijs daarvan de ter
      zake in het derde lid gestelde grens te boven gaat, een aanwijzing evenmin betreffen:

      a. woonruimten die in gebruik zullen worden genomen door de eigenaar ervan in de zin van het Burgerlijk Wetboek,
      en die hetzij niet eerder bewoond zijn geweest, hetzij sedert de eerste ingebruikname, dan wel gedurende ten minste
      de zes maanden waarin zij laatstelijk bewoond zijn geweest, bewoond werden door de eigenaar ervan in de zin van het
      Burgerlijk Wetboek, en

      b. andere woonruimten dan bedoeld onder *a*.

      3 De grenzen bedoeld in het tweede lid, bedragen:

      a. voor de aanwijzing van woonruimten als bedoeld in dat lid, onder *a*: het in de betrokken gemeente geldende
      hoogste bedrag voor de koopsom van een woonruimte, voor het verkrijgen in eigendom waarvan aan degene die zodanige
      woonruimte als eigenaar zal bewonen, afhankelijk van de hoogte van diens inkomen, krachtens wettelijk voorschrift
      van overheidswege subsidie kan worden verstrekt;

      b. voor de aanwijzing van woonruimten als bedoeld in dat lid, onder *b*: een twaalfde deel
      van het bedrag, op het tijdstip van de aanwijzing genoemd in artikel 16 van de Wet individuele
      huursubsidie (*Stb.* 1990, 394), dan wel het bedrag op het tijdstip van de aanwijzing genoemd in
      [artikel 13, eerste lid, onder a, van de Huursubsidiewet][ref2] dan wel de [Wet op de huurtoeslag][ref3].

      4 In afwijking van het bepaalde in het tweede lid, kunnen woonruimten als daar bedoeld worden aangewezen, voor
      zover zodanige aanwijzing in het belang van een evenwichtige en rechtvaardige verdeling van woonruimte noodzakelijk
      is in verband met uit bovengemeentelijk ruimtelijk beleid voortvloeiende geringe mogelijkheden tot uitbreiding
      van de woonruimtevoorraad in de betrokken gemeente of in een of meer kernen, behorend tot die gemeente. Zodanige
      aanwijzing behoeft de goedkeuring van gedeputeerde staten.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0008659#Artikel13
