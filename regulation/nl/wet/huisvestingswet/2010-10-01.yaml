  - number: '53'
    text: |-
      1 De gebruiker is verplicht zich met betrekking tot het gevorderde te gedragen als ware hij een goed huurder.

      2 Indien de eigenaar van het gevorderde schade lijdt, doordat de gebruiker de ingevolge het eerste lid geldende
      verplichting niet nakomt, kan de eigenaar deze schade op de gemeente verhalen. Voor zover de schade het gevolg is
      van aan het gevorderde aangebrachte beschadigingen, kan de gemeente deze schade vergoeden door het ongedaan maken
      van die beschadigingen.

      3 De gebruiker is gehouden aan de gemeente de kosten te vergoeden die de gemeente heeft moeten maken voor de
      vergoeding van schade als bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0005674/2010-10-01#Artikel53
  - number: '54'
    text: |-
      1 Burgemeester en wethouders kunnen besluiten de toewijzing te beëindigen, indien de gebruiker de
      gebruiksvergoeding niet of niet tijdig betaalt of indien de gebruiker de ingevolge [artikel 53][ref1] geldende
      verplichtingen niet nakomt.

      2 De gebruiker is verplicht het gevorderde te ontruimen binnen één maand na de bekendmaking van het besluit tot
      beëindiging van de toewijzing.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel53
    url: https://wetten.overheid.nl/BWBR0005674/2010-10-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0005674
        artikel: '53'
        hoofdstuk: IV
        paragraaf: '2'
  - number: '55'
    text: |-
      1 Burgemeester en wethouders beëindigen de vordering:

      a. indien tussen de gebruiker en de eigenaar een huurovereenkomst tot stand komt;

      b. indien naar hun oordeel het belang van een evenwichtige en rechtvaardige verdeling van woonruimte het
      voortzetten van de vordering niet langer noodzakelijk maakt.

      2 Burgemeester en wethouders kunnen de vordering op verzoek van de eigenaar tevens beëindigen, indien de eigenaar
      het gevorderde zo dringend voor eigen gebruik - vervreemding niet daaronder begrepen - nodig heeft, dat bij
      afweging van zijn belang tegen het belang van een evenwichtige en rechtvaardige verdeling van woonruimte handhaving
      van de vordering redelijkerwijs niet aanvaardbaar is.

      3 Burgemeester en wethouders geven niet eerder toepassing aan het eerste of tweede lid, dan vier weken nadat zij
      de gebruiker van hun voornemen daartoe op de hoogte hebben gesteld. Zij stellen de gebruiker in de gelegenheid zijn
      zienswijze op het voornemen kenbaar te maken.
    url: https://wetten.overheid.nl/BWBR0005674/2010-10-01#Artikel55
  - number: '56'
    text: |-
      1 Burgemeester en wethouders stellen in hun besluit tot beëindiging van de vordering het tijdstip vast waarop de
      vordering eindigt.

      2 Bij het bepalen van het tijdstip van beëindiging houden burgemeester en wethouders rekening met de tijd die de
      gebruiker redelijkerwijs nodig heeft om het gevorderde te ontruimen.
    url: https://wetten.overheid.nl/BWBR0005674/2010-10-01#Artikel56
  - number: '58'
    text: |-
      1 Behoudens het bepaalde in het derde lid, eindigt de vordering van rechtswege door het verstrijken van de
      overeenkomstig [artikel 41][ref1] vastgestelde tijdsduur.

      2 De eigenaar van het gevorderde stelt de gebruiker ten minste drie maanden voor het verstrijken van de
      overeenkomstig [artikel 41][ref2] vastgestelde tijdsduur schriftelijk daarvan op de hoogte.

      3 Indien een schriftelijke mededeling als bedoeld in het tweede lid niet of niet tijdig voor het verstrijken van
      de daar genoemde tijdsduur is gedaan, eindigt de vordering met ingang van een door de eigenaar vast te stellen
      tijdstip, doch niet eerder dan drie maanden nadat hij dat tijdstip schriftelijk aan de gebruiker heeft medegedeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel41
      [ref2]: https://wetten.overheid.nl/BWBR0005674#Artikel41
    url: https://wetten.overheid.nl/BWBR0005674/2010-10-01#Artikel58
