      Een algemene maatregel van bestuur, vastgesteld krachtens deze wet, treedt niet eerder in werking dan twee
      maanden na de datum van uitgifte van het *Staatsblad*, waarin hij is geplaatst. Van de plaatsing wordt onverwijld
      mededeling gedaan aan beide kamers der Staten-Generaal.
