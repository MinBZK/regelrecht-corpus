  - number: '24'
    text: |-
      Indien de vergunning wordt verleend, vermelden burgemeester en wethouders in hun beschikking ten minste de termijn
      waarbinnen van de vergunning gebruik kan worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0005674/2010-10-01#Artikel24
  - number: '25'
    text: |-
      1 Een huisvestingsvergunning wordt verleend, indien de aanvrager behoort tot een van de ingevolge
      [artikel 9, eerste lid][ref1], aangewezen categorieën van woningzoekenden, voor zover wordt voldaan aan
      [artikel 9, tweede lid][ref2].

      2 Ingeval voor de betrokken woonruimte toepassing is gegeven aan [artikel 10][ref3], dient de woonruimte voor de
      aanvrager tevens passend te zijn, gelet op de ingevolge dat artikel gestelde regels.

      3 Ingeval voor de betrokken woonruimte toepassing is gegeven aan [artikel 11][ref4], kan de vergunning worden
      geweigerd, indien er in het register van woningzoekenden voldoende voor de betrokken woonruimte in aanmerking
      komende woningzoekenden zijn ingeschreven, die behoren tot een hogere urgentiecategorie dan de aanvrager.

      4 Ingeval voor de betrokken woonruimte een voordracht is gedaan krachtens [artikel 19, eerste lid][ref5],
      of [artikel 21, tweede lid][ref6], en die voordracht niet is ingetrokken overeenkomstig
      [artikel 21, eerste lid][ref7], dient de aanvrager voorts te zijn vermeld op die voordracht. Ingeval een voordracht
      ingevolge [artikel 20][ref8] achterwege is gebleven, wordt de vergunning verleend aan de door de eigenaar
      voorgedragen woningzoekende.

      5 Het bepaalde in het derde en vierde lid is niet van toepassing, indien de woonruimte zal worden bewoond door de
      eigenaar ervan in de zin van het Burgerlijk Wetboek en de woonruimte gedurende ten minste de zes maanden waarin
      deze laatstelijk bewoond is geweest, bewoond werd door de eigenaar ervan in de zin van het Burgerlijk Wetboek.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel9
