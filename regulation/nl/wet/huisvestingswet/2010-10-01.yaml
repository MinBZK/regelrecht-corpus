preamble:
  text: |-
    Wij Beatrix bij de Gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het ter bevordering van een evenwichtige en rechtvaardige verdeling van
    schaarse woonruimte en met het oog op de doorzichtigheid van de wetgeving wenselijk is nieuwe regelen te stellen
    met betrekking tot de verdeling van woonruimte en de samenstelling van de woonruimtevoorraad;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0005674/2010-10-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. Onze Minister: Onze Minister voor Wonen, Wijken en Integratie;

      b. woonruimte: besloten ruimte die, al dan niet te zamen met een of meer andere ruimten, bestemd of geschikt is
      voor bewoning door een huishouden;

      c. woonschip: schip dat uitsluitend of in hoofdzaak gebezigd wordt of bestemd is voor bewoning;

      d. ligplaats: plaats in het water, bestemd of aangewezen om door een woonschip bij verblijf te worden ingenomen;

      e. standplaats: een kavel, bestemd voor het plaatsen van een woonwagen, waarop voorzieningen aanwezig zijn die op
      het leidingnet van de openbare nutsbedrijven, andere instellingen of van gemeenten kunnen worden aangesloten;

      f. woonwagen: voor bewoning bestemd gebouw dat is geplaatst op een standplaats en dat in zijn geheel of in delen
      kan worden verplaatst;

      g. huisvestingsverordening: de verordening, bedoeld in [artikel 2][ref1];

      h. huisvestingsvergunning: een vergunning als bedoeld in [artikel 7, eerste lid][ref2];

      i. leegstaan; het niet of niet krachtens een zakelijk of persoonlijk recht in gebruik zijn, alsmede een gebruik dat
      de kennelijke strekking heeft afbreuk te doen aan de werking van deze wet;

      j. huurprijs: de prijs die bij huur en verhuur is verschuldigd voor het enkele gebruik van een woonruimte,
      uitgedrukt in een bedrag per maand, dan wel, indien het betreft een standplaats voor een woonwagen of een
      ligplaats van een woonschip, het bedrag dat is verschuldigd voor het innemen van die standplaats, onderscheidenlijk
      ligplaats, uitgedrukt in een bedrag per maand;

      k. koopprijs: de prijs die voor de enkele koop van een woonruimte daadwerkelijk is of zal worden betaald;

      l. economische binding aan een gebied: de binding van een persoon aan een gebied, daarin gelegen dat die persoon,
      met het oog op de voorziening in het bestaan, een redelijk belang heeft zich in dat gebied te vestigen, met
      dien verstande dat een economische binding in elk geval wordt aangenomen ten aanzien van personen die voor de
      voorziening in het bestaan zijn aangewezen op het duurzaam verrichten van arbeid binnen of vanuit dat gebied;

      m. maatschappelijke binding aan een gebied: de binding van een persoon aan een gebied, daarin gelegen dat die
      persoon een redelijk, met de plaatselijke samenleving verband houdend belang heeft zich in dat gebied te vestigen,
      met dien verstande dat een maatschappelijke binding in elk geval wordt aangenomen ten aanzien van personen die
      ten minste zes jaar onafgebroken ingezetene zijn, dan wel gedurende de voorafgaande tien jaar ten minste zes jaar
      onafgebroken ingezetene zijn geweest van dat gebied;

      n. regio: een gebied dat uit een oogpunt van het functioneren van de woonruimtemarkt als een samenhangend geheel
      kan worden beschouwd.

      2 Voor zover niet anders is bepaald, wordt in deze wet en de daarop berustende bepalingen onder eigenaar van
      een woonruimte of een gebouw verstaan: degene die bevoegd is tot het in gebruik geven van die woonruimte of
      dat gebouw. Onder "eigenaar in de zin van het Burgerlijk Wetboek" wordt in deze wet en de daarop berustende
      bepalingen mede verstaan: de erfpachter, vruchtgebruiker, gerechtigde tot een appartementsrecht als bedoeld
      in [artikel 106 van Boek 5 van het Burgerlijk Wetboek][ref3], of degene aan wie door een rechtspersoon het
      gebruiksrecht van een woonruimte is verleend.

      3 In deze wet en de daarop berustende bepalingen worden onder woonruimte mede begrepen:

      a. een standplaats,

      b. een ligplaats.

      4 Indien de huurprijs hoger is dan de maximale huurprijsgrens voor de
      desbetreffende woonruimte, vastgesteld overeenkomstig het bij of krachtens de
      [onderafdeling 2 van afdeling 5 van titel 4 van Boek 7 van het Burgerlijk Wetboek][ref4] daaromtrent bepaalde,
      dan wel indien een woonruimte niet verhuurd is en evenmin te huur wordt aangeboden, geldt voor de toepassing
      van deze wet en de daarop berustende bepalingen als huurprijs: de maximale huurprijsgrens, ongeacht of
      [onderafdeling 2 van afdeling 5 van titel 4 van Boek 7 van het Burgerlijk Wetboek][ref5] op de betrokken
      overeenkomst van huur en verhuur wel of niet van toepassing is.

      5 Indien voor een woonruimte die niet verhuurd is en evenmin te huur wordt aangeboden, niet een maximale
      huurprijsgrens kan worden bepaald als bedoeld in het vierde lid, geldt voor de toepassing van deze wet en de daarop
      berustende bepalingen als huurprijs: de huurprijs die bij huur en verhuur als woonruimte redelijkerwijs zou kunnen
      worden overeengekomen, gelet op de huurprijs die in het economisch verkeer voor vergelijkbare woonruimten wordt
      overeengekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005674#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0005288#Artikel106
      [ref4]: https://wetten.overheid.nl/BWBR0005290#ParagraafOnderafdeling_2
      [ref5]: https://wetten.overheid.nl/BWBR0005290#ParagraafOnderafdeling_2
