        paragraaf: '6'
  - number: '28'
    text: |-
      Burgemeester en wethouders kunnen een huisvestingsvergunning intrekken, indien:

      a. de vergunninghouder de erin vermelde woonruimte niet binnen de door burgemeester en wethouders bij de verlening
      van de vergunning gestelde termijn in gebruik heeft genomen;

      b. de vergunning is verleend op grond van door de vergunninghouder verstrekte gegevens waarvan deze wist of
      redelijkerwijs moest vermoeden dat zij onjuist of onvolledig waren.
    url: https://wetten.overheid.nl/BWBR0005674/2010-10-01#Artikel28
  - number: '29'
    text: |-
      Van de bevoegdheden krachtens deze paragraaf kunnen burgemeester en wethouders mandaat verlenen aan eigenaren van
      woonruimte, voor zover het die woonruimte betreft.
    url: https://wetten.overheid.nl/BWBR0005674/2010-10-01#Artikel29
  - number: '30'
    text: |-
      1 Het is verboden een woonruimte die behoort tot een door de gemeenteraad in de huisvestingsverordening daartoe
      met het oog op het behoud of de samenstelling van de woonruimtevoorraad aangewezen categorie, zonder vergunning van
      burgemeester en wethouders:

      a. aan de bestemming tot bewoning te onttrekken, of voor een zodanig gedeelte aan die bestemming te onttrekken, dat
      die woonruimte daardoor niet langer geschikt is voor bewoning door een huishouden van dezelfde omvang als waarvoor
      deze zonder zodanige onttrekking geschikt is;

      b. met andere woonruimte samen te voegen;

      c. van zelfstandige in onzelfstandige woonruimte om te zetten.

      2 Onder zelfstandige woonruimte als bedoeld in het eerste lid, onder *c*, wordt verstaan een woonruimte welke
      een eigen toegang heeft en welke door een huishouden kan worden bewoond zonder dat dit daarbij afhankelijk is van
      wezenlijke voorzieningen buiten die woonruimte.

      3 Woonruimte, aangewezen overeenkomstig [artikel 5][ref1], wordt tevens aangewezen overeenkomstig het eerste lid,
      tenzij een zodanige aanwijzing naar het oordeel van de gemeenteraad met het oog op het behoud of de samenstelling
      van de woonruimtevoorraad niet noodzakelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel5
    url: https://wetten.overheid.nl/BWBR0005674/2010-10-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0005674
        artikel: '5'
        hoofdstuk: II
        paragraaf: '1'
  - number: '31'
    text: |-
      Een vergunning als bedoeld in [artikel 30, eerste lid][ref1], wordt verleend, tenzij het belang van het behoud
      of de samenstelling van de woonruimtevoorraad groter is dan het met het onttrekken aan de bestemming tot bewoning
      gediende belang en het belang van het behoud of de samenstelling van de woonruimtevoorraad niet door het stellen
      van voorwaarden en voorschriften voldoende kan worden gediend.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel30
    url: https://wetten.overheid.nl/BWBR0005674/2010-10-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0005674
        artikel: '30'
        hoofdstuk: III
        paragraaf: '1'
  - number: '32'
    text: |-
      De gemeenteraad bepaalt in de huisvestingsverordening ten minste de voorwaarden en voorschriften die burgemeester
      en wethouders in het belang van de voorziening in de behoefte aan woonruimte aan de vergunning, bedoeld in
      [artikel 30, eerste lid][ref1], kunnen verbinden.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel30
    url: https://wetten.overheid.nl/BWBR0005674/2010-10-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0005674
        artikel: '30'
        hoofdstuk: III
        paragraaf: '1'
  - number: '33'
    text: |-
      1 Het is verboden een recht op een gebouw dat behoort tot een door de gemeenteraad in de huisvestingsverordening
      daartoe aangewezen categorie, zonder vergunning van burgemeester en wethouders te splitsen in appartementsrechten
      als bedoeld in [artikel 106, eerste en vierde lid, van Boek 5 van het Burgerlijk Wetboek][ref1], indien een of
      meer appartementsrechten de bevoegdheid omvatten tot het gebruik van een of meer gedeelten van het gebouw als
      woonruimte.

      2 Het eerste lid is van overeenkomstige toepassing op het verlenen van deelnemings- of lidmaatschapsrechten of het
      aangaan van een verbintenis daartoe door een rechtspersoon met betrekking tot een gebouw als bedoeld in het eerste
      lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005288#Artikel106
    url: https://wetten.overheid.nl/BWBR0005674/2010-10-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0005288
        artikel: '106'
  - number: '34'
    text: |-
      1 De gemeenteraad bepaalt in de huisvestingsverordening ten minste:

      a. de gronden die tot weigering van een vergunning als bedoeld in [artikel 33][ref1] kunnen leiden;

      b. de categorieën van gevallen waarin de beslissing op de aanvraag om een vergunning door burgemeester en
      wethouders wordt aangehouden;

      c. de voorwaarden en voorschriften die burgemeester en wethouders aan de vergunning kunnen verbinden.

      2 De gronden en regels, bedoeld in het eerste lid, kunnen slechts betrekking hebben op:

      a. de samenstelling van de woonruimtevoorraad;

      b. het voorkomen van belemmering van de stadsvernieuwing;

      c. het voorkomen van splitsing van rechten op gebouwen waarvan de toestand uit oogpunt van indeling of staat
      van onderhoud zich geheel of ten dele tegen splitsing in appartementsrechten of de verlening van deelnemings- of
      lidmaatschapsrechten verzet.

      3 Bij algemene maatregel van bestuur kunnen met betrekking tot de toepassing van het eerste lid nadere regels
      worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel33
    url: https://wetten.overheid.nl/BWBR0005674/2010-10-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0005674
        artikel: '33'
        hoofdstuk: III
        paragraaf: '2'
  - number: '35'
    text: |-
      1 De gemeenteraad stelt in de huisvestingsverordening regels met betrekking tot:

      a. de wijze waarop een vergunning als bedoeld in [artikel 30, eerste lid][ref1], of [33][ref2], kan worden
      aangevraagd;

      b. de gegevens die door de aanvrager moeten worden verstrekt met het oog op de beoordeling van de aanvraag;

      c. de termijn waarbinnen door burgemeester en wethouders op de aanvraag moet worden beslist;

      d. de gegevens die ten minste in de beschikking op de aanvraag moeten worden vermeld.

      2 Indien van de vergunning slechts gebruik kan worden gemaakt na verlening van een omgevingsvergunning voor een
      activiteit als bedoeld in [artikel 2.1, eerste lid, onder c, van de Wet algemene bepalingen omgevingsrecht][ref3],
      wordt de aanvraag mede aangemerkt als een verzoek om zodanige omgevingsvergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0005674#Artikel33
      [ref3]: https://wetten.overheid.nl/BWBR0024779#Artikel2.1
    url: https://wetten.overheid.nl/BWBR0005674/2010-10-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0005674
        artikel: '30'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005674
        artikel: '33'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0024779
        artikel: '2.1'
  - number: '36'
    text: |-
      1 Indien de aanvraag niet is gedaan door de gebruiker, onderscheidenlijk de eigenaar van de woonruimte of het
      gebouw, zenden burgemeester en wethouders onverwijld aan deze een afschrift van de aanvraag.

      2 Burgemeester en wethouders stellen de gebruiker, onderscheidenlijk de eigenaar op diens verzoek, voor zover
      zulks nodig is voor de beoordeling van de aanvraag, in de gelegenheid de bij de aanvraag overgelegde gegevens in te
      zien, totdat op de aanvraag onherroepelijk is beslist. Zij verschaffen hem desgevraagd een afschrift daarvan tegen
      betaling van de kosten.
    url: https://wetten.overheid.nl/BWBR0005674/2010-10-01#Artikel36
  - number: '37'
    text: |-
      1 Gedurende vier weken nadat hem overeenkomstig [artikel 36, eerste lid][ref1], mededeling is gedaan, kan de
      gebruiker, onderscheidenlijk de eigenaar zijn zienswijze kenbaar maken aan burgemeester en wethouders.

      2 Burgemeester en wethouders doen aan de aanvrager onverwijld mededeling van de kenbaar gemaakte zienswijzen.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel36
    url: https://wetten.overheid.nl/BWBR0005674/2010-10-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0005674
        artikel: '36'
        hoofdstuk: III
        paragraaf: '3'
  - number: '38'
    text: |-
      Burgemeester en wethouders kunnen een vergunning intrekken, indien:

      a. niet binnen een jaar nadat de beschikking onherroepelijk is geworden, is overgegaan tot onttrekking,
      samenvoeging of omzetting, onderscheidenlijk tot overschrijving in de openbare registers van de akte van splitsing
      in appartementsrechten, bedoeld in [artikel 109 van Boek 5 van het Burgerlijk Wetboek][ref1], of tot het verlenen
      van deelnemings- of lidmaatschapsrechten;

      b. de vergunning is verleend op grond van door de vergunninghouder verstrekte gegevens waarvan deze wist of
      redelijkerwijs moest vermoeden dat zij onjuist of onvolledig waren.


      [ref1]: https://wetten.overheid.nl/BWBR0005288#Artikel109
    url: https://wetten.overheid.nl/BWBR0005674/2010-10-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0005288
        artikel: '109'
  - number: '39'
    text: |-
      Inschrijving in de openbare registers van een akte als bedoeld in
      [artikel 109 van Boek 5 van het Burgerlijk Wetboek][ref1] vindt alleen plaats, indien onder de akte een
      notariële verklaring is opgenomen, dat ten tijde van het verlijden van de akte een vergunning als bedoeld in
      [artikel 33][ref2] niet is vereist, dan wel onherroepelijk is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0005288#Artikel109
      [ref2]: https://wetten.overheid.nl/BWBR0005674#Artikel33
    url: https://wetten.overheid.nl/BWBR0005674/2010-10-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0005288
        artikel: '109'
      - id: ref2
        bwb_id: BWBR0005674
        artikel: '33'
        hoofdstuk: III
        paragraaf: '2'
  - number: '40'
    text: |-
      1 Burgemeester en wethouders kunnen, indien dat voor een evenwichtige en rechtvaardige verdeling van woonruimte
      noodzakelijk is, van de eigenaar van een in de gemeente aanwezige leegstaande woonruimte, een leegstaand gebouw,
      niet zijnde een of meer woonruimten, of een leegstaand gedeelte van een zodanig gebouw, dan wel van een woonruimte
      die in strijd met de bij of krachtens deze wet gegeven voorschriften zonder huisvestingsvergunning of vergunning
      ingevolge [artikel 30][ref1] in gebruik genomen is, het gebruik daarvan als woonruimte vorderen. De vordering
      vindt niet plaats dan na overleg met de eigenaar. De vordering kan mede betrekking hebben op het gebruik van bij
      de woonruimte of het gebouw behorende of voor de toegang daartoe noodzakelijke andere ruimten en van de daarbij
      behorende centrale en nutsvoorzieningen.

      2 Ten aanzien van leegstaande woonruimte die laatstelijk door de eigenaar gedurende een termijn van ten minste
      een jaar onafgebroken als eigenaar is bewoond geweest, maken burgemeester en wethouders gedurende een termijn van
      een jaar na het tijdstip waarop de bewoning door de eigenaar een einde heeft genomen, geen gebruik van hun in het
      eerste lid omschreven bevoegdheid, tenzij er gewichtige redenen zijn om niettemin tot vordering over te gaan. Onder
      eigenaar wordt in dit lid degene verstaan, die eigenaar is in de zin van het Burgerlijk Wetboek.

      3 Ten aanzien van leegstaande woonruimte die nimmer is bewoond geweest, maken burgemeester en wethouders gedurende
      een termijn van een jaar na het tijdstip waarop de woonruimte voor bewoning is gereedgekomen, geen gebruik van
      hun in het eerste lid omschreven bevoegdheid, tenzij er gewichtige redenen zijn om niettemin tot vordering over
      te gaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel30
    url: https://wetten.overheid.nl/BWBR0005674/2010-10-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0005674
        artikel: '30'
        hoofdstuk: III
        paragraaf: '1'
  - number: '41'
    text: |-
      Een vordering als bedoeld in [artikel 40, eerste lid][ref1], vindt plaats voor een door burgemeester en wethouders
      bij hun besluit tot vordering bepaalde tijdsduur van ten hoogste tien jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel40
    url: https://wetten.overheid.nl/BWBR0005674/2010-10-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0005674
        artikel: '40'
        hoofdstuk: IV
        paragraaf: '1'
  - number: '42'
    text: |-
      Tegelijkertijd met de bekendmaking van een last tot vordering wordt daarvan mededeling gedaan door aanplakking van
      een afschrift op of nabij de woonruimte, het gebouw of het gedeelte van een gebouw waarop de vordering betrekking
      heeft.
    url: https://wetten.overheid.nl/BWBR0005674/2010-10-01#Artikel42
  - number: '43'
    text: |-
      De last bevat ten minste:

      a. een omschrijving van de woonruimte, het gebouw of het gedeelte van een gebouw waarvan het gebruik wordt
      gevorderd, en van de ruimten of voorzieningen op het gebruik waarvan de vordering mede betrekking heeft;

      b. de datum waarop de last is gegeven;

      c. de termijn waarbinnen aan de vordering moet worden voldaan;

      d. de tijdsduur waarvoor gevorderd wordt.
    url: https://wetten.overheid.nl/BWBR0005674/2010-10-01#Artikel43
  - number: '44'
    text: |-
      1 Tegen een besluit tot vordering als bedoeld in [artikel 40, eerste lid][ref1], kan een belanghebbende beroep
      instellen bij de Afdeling bestuursrechtspraak van de Raad van State.

      2 [Artikel 7:1][ref2] en [titel 8.3 van de Algemene wet bestuursrecht][ref3] blijven buiten toepassing.

      3 De werking van het in het eerste lid bedoelde besluit wordt opgeschort totdat de beroepstermijn is verstreken of,
      indien beroep is ingesteld, op het beroep is beslist.

      4 De Afdeling behandelt de zaak met toepassing van [afdeling 8.2.3 van de Algemene wet bestuursrecht][ref4] en doet
      uiterlijk acht weken na de dag waarop het beroepschrift is ontvangen, uitspraak. Blijkt aan de Afdeling dat de zaak
      een gewone behandeling vordert, dan doet zij binnen dertien weken uitspraak.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel71
      [ref3]: https://wetten.overheid.nl/BWBR0005537
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Afdeling8.2.3
    url: https://wetten.overheid.nl/BWBR0005674/2010-10-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0005674
        artikel: '40'
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: 7:1
      - id: ref3
