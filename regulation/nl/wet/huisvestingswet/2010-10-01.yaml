  - number: '8'
    text: |-
      De gemeenteraad kan, voor zover dat in het belang van een evenwichtige en rechtvaardige verdeling van woonruimte
      noodzakelijk is, in de huisvestingsverordening bepalen dat de leegstand van woonruimten in daarbij aangegeven
      gevallen door de eigenaar aan burgemeester en wethouders dient te worden gemeld, zodra die leegstand langer duurt
      dan een daarbij aangegeven termijn van ten minste twee maanden.
    url: https://wetten.overheid.nl/BWBR0005674/2010-10-01#Artikel8
  - number: '9'
    text: |-
      1 De gemeenteraad wijst in de huisvestingsverordening de categorieën van woningzoekenden aan die met het oog op een
      evenwichtige en rechtvaardige verdeling van de woonruimte, aangewezen overeenkomstig [artikel 5][ref1], voor het
      verkrijgen van een huisvestingsvergunning in aanmerking komen.

      2 Een huisvestingsvergunning wordt uitsluitend verleend aan personen die:

      a. de Nederlandse nationaliteit bezitten of op grond van een wettelijke bepaling als Nederlander worden behandeld,
      of

      b. vreemdeling zijn en rechtmatig verblijf houden als bedoeld in
      [artikel 8, onder a tot en met e en l, van de Vreemdelingenwet 2000][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0005674/2010-10-01#Artikel9
    references:
