  - number: '61'
    text: |-
      Provinciale staten kunnen, voor zover de verwezenlijking van het bovengemeentelijke ruimtelijke beleid of
      het gebrek aan samenhang tussen het door de gemeenten gevoerde huisvestingsbeleid dat vordert, beleidsregels
      vaststellen met betrekking tot de in de [hoofdstukken I][ref1], [II][ref2] en [III][ref3] geregelde onderwerpen.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#HoofdstukI
      [ref2]: https://wetten.overheid.nl/BWBR0005674#HoofdstukII
      [ref3]: https://wetten.overheid.nl/BWBR0005674#HoofdstukIII
