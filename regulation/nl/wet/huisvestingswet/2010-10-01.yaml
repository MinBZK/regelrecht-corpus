  - number: '45'
    text: |-
      1 De eigenaar van een woonruimte, een gebouw of een gedeelte van een gebouw, met betrekking waartoe toepassing is
      gegeven aan [artikel 40, eerste lid][ref1], is verplicht het gevorderde binnen de in de last aangegeven termijn ter
      beschikking van burgemeester en wethouders te stellen. Voor zover het gevorderde bestemd is om te worden gebruikt
      als woonruimte, wordt het, tenzij het in de voorafgaande periode eveneens gevorderd was, leeg aan burgemeester en
      wethouders ter beschikking gesteld.

      2 Het is een ieder verboden de uitvoering van de vordering van een woonruimte, een gebouw of een gedeelte van een
      gebouw te belemmeren. Indien de vordering betrekking heeft op een woonwagen of woonschip, is het een ieder verboden
      die woonwagen of dat woonschip te verplaatsen.

      3 Waar in het vervolg van dit hoofdstuk sprake is van de eigenaar van een overeenkomstig het eerste lid aan
      burgemeester en wethouders ter beschikking gestelde woonruimte of ter beschikking gesteld gebouw of gedeelte
      van een gebouw, wordt daaronder verstaan: degene die bevoegd zou zijn geweest tot het in gebruik geven van die
      woonruimte, dat gebouw of gedeelte van een gebouw, indien de vordering niet zou hebben plaats gevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel40
    url: https://wetten.overheid.nl/BWBR0005674/2010-10-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0005674
        artikel: '40'
        hoofdstuk: IV
        paragraaf: '1'
  - number: '46'
    text: |-
      1 Burgemeester en wethouders zijn bevoegd aan het gevorderde de voorzieningen uit te voeren die noodzakelijk zijn
      met het oog op het beoogde gebruik ervan als woonruimte.

      2 Zij plegen tevoren zo mogelijk overleg met de eigenaar.
    url: https://wetten.overheid.nl/BWBR0005674/2010-10-01#Artikel46
  - number: '47'
    text: |-
      1 Bij hun besluit tot vordering bepalen burgemeester en wethouders de door de gemeente aan de eigenaar maandelijks
      verschuldigde vorderingsvergoeding.

      2 De vorderingsvergoeding wordt, met inachtneming van de geldende prijsvoorschriften, vastgesteld op een bedrag dat
      in het economisch verkeer redelijk is.

      3 Indien aan het gevorderde voorzieningen zijn uitgevoerd als bedoeld in [artikel 46][ref1], worden deze bij het
      vaststellen van de vorderingsvergoeding buiten beschouwing gelaten.

      4 De gemeente vergoedt de eigenaar de kosten die deze redelijkerwijs heeft moeten maken met het oog op het leeg ter
      beschikking stellen van het gevorderde.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel46
    url: https://wetten.overheid.nl/BWBR0005674/2010-10-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0005674
        artikel: '46'
        hoofdstuk: IV
        paragraaf: '1'
  - number: '48'
    text: |-
      Burgemeester en wethouders kunnen ambtshalve, dan wel op een daartoe strekkend verzoek van de eigenaar het bedrag
      van de vorderingsvergoeding wijzigen, teneinde de vergoeding in overeenstemming te brengen met een voor het in
      gebruik geven van het gevorderde redelijke prijs. [Artikel 47, tweede en derde lid][ref1], is met betrekking tot
      het in de eerste volzin bedoelde besluit van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel47
    url: https://wetten.overheid.nl/BWBR0005674/2010-10-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0005674
        artikel: '47'
        hoofdstuk: IV
        paragraaf: '1'
  - number: '49'
    text: |-
      1 Een vordering ten behoeve van een of meer verblijfsgerechtigden als bedoeld in [artikel 60a, onder a][ref1],
      of een of meer woningzoekenden als bedoeld in [artikel 68, eerste lid][ref2], kan, in afwijking van
      [artikel 40, eerste lid, eerste volzin][ref3], betrekking hebben op een bij het vorderingsbesluit te bepalen aantal
      woonruimten, gebouwen, niet zijnde woonruimte, of gedeelten van zodanige gebouwen van dezelfde eigenaar, dat na het
      tijdstip waarop de vordering is gedaan, ter beschikking komt.

      2 Met betrekking tot een vordering als bedoeld in het eerste lid zijn de
      [artikelen 40, eerste lid, tweede en derde volzin, tweede en derde lid][ref4], [41][ref5],
      [43, aanhef en onder b en d][ref6], [44][ref7] en [45, eerste lid, tweede volzin, tweede en derde lid][ref8],
      [46][ref9] , [47, tweede tot en met vierde lid][ref10], en [48][ref11] van toepassing.

      3 Tegelijkertijd met de bekendmaking van de last tot vordering wordt hiervan mededeling gedaan in een of meer in de
      gemeente verspreide dag-, nieuws- of huis-aan-huisbladen.

      4 De eigenaar is verplicht elke woonruimte, elk gebouw als bedoeld in het eerste lid of elk gedeelte daarvan op
      het tijdstip waarop het ter beschikking komt, ter beschikking van burgemeester en wethouders te stellen, totdat het
      gevorderde aantal is bereikt.

      5 Zodra een terbeschikkingstelling als bedoeld in het derde lid heeft plaatsgevonden, bepalen burgemeester en
      wethouders zo spoedig mogelijk de door de gemeente aan de eigenaar maandelijks verschuldigde vorderingsvergoeding
      voor het ter beschikking gestelde.


