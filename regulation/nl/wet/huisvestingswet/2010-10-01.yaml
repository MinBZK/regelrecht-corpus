  - number: '63'
    text: |-
      Tegelijkertijd met de bekendmaking van een beleidsregel doen gedeputeerde staten daarvan mededeling aan Onze
      Minister.
    url: https://wetten.overheid.nl/BWBR0005674/2010-10-01#Artikel63
  - number: '64'
    text: |-
      1 Voor zover zulks ter verwezenlijking van een beleidsregel noodzakelijk is, kunnen gedeputeerde staten de
      gemeenteraad respectievelijk het college van burgemeester en wethouders waarop de beleidsregel betrekking heeft,
      een aanwijzing geven.

      2 Alvorens een aanwijzing te geven plegen gedeputeerde staten overleg met burgemeester en wethouders van de
      betrokken gemeente.
    url: https://wetten.overheid.nl/BWBR0005674/2010-10-01#Artikel64
  - number: '65'
    text: |-
      Tegelijkertijd met de bekendmaking van een aanwijzing doen gedeputeerde staten daarvan mededeling aan provinciale
      staten en aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0005674/2010-10-01#Artikel65
  - number: '66'
    text: |-
      De gemeenteraad respectievelijk het college van burgemeester en wethouders is verplicht aan een aanwijzing gevolg
      te geven.
    url: https://wetten.overheid.nl/BWBR0005674/2010-10-01#Artikel66
  - number: '67'
    text: |-
      Indien in een gemeente bij het in gebruik geven van in die gemeente gelegen woonruimten met een verhoudingsgewijs
      lage prijs naar het oordeel van Onze Minister met het oog op een evenwichtige en rechtvaardige verdeling van
      woonruimte in onvoldoende mate voorrang wordt gegeven aan woningzoekenden die, gelet op hun inkomen, in het
      bijzonder op die woonruimten zijn aangewezen, kan hij het bestuur van die gemeente, zo nodig in afwijking
      van een beleidsregel als bedoeld in [artikel 61][ref1], een aanwijzing geven met betrekking tot de in de
      [hoofdstukken I][ref2], [II][ref3] en [III][ref4] geregelde onderwerpen.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel61
      [ref2]: https://wetten.overheid.nl/BWBR0005674#HoofdstukI
      [ref3]: https://wetten.overheid.nl/BWBR0005674#HoofdstukII
      [ref4]: https://wetten.overheid.nl/BWBR0005674#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0005674/2010-10-01#Artikel67
    references:
      - id: ref1
