  - number: '26'
    text: |-
      1 Onverminderd [artikel 9, tweede lid][ref1], wordt een huisvestingsvergunning voorts aan iedere aanvrager
      verleend, indien de woonruimte door de eigenaar gedurende een door de gemeenteraad in de huisvestingsverordening
      te bepalen termijn van ten hoogste dertien weken vruchteloos is aangeboden aan de woningzoekenden die ingevolge het
      bepaalde krachtens de [artikelen 9][ref2], [10][ref3], [11][ref4] en [12][ref5] voor die woonruimte in aanmerking
      komen.

      2 Het eerste lid is slechts van toepassing:

      a. ingeval de woonruimte te huur wordt aangeboden en
      [onderafdeling 2 van afdeling 5 van titel 4 van Boek 7 van het Burgerlijk Wetboek][ref6] op die woonruimte van
      toepassing is: indien de gevraagde huurprijs niet hoger is dan de voor de betrokken woonruimte ingevolge die
      onderafdeling geldende maximale huurprijsgrens;

      b. ingeval de woonruimte te huur wordt aangeboden en
      [onderafdeling 2 van afdeling 5 van titel 4 van Boek 7 van het Burgerlijk Wetboek][ref7] niet op die woonruimte
      van toepassing is: indien de gevraagde huurprijs niet hoger is dan redelijk is, gelet op de huurprijs die in het
      economisch verkeer voor vergelijkbare woonruimten wordt overeengekomen;

      c. ingeval de woonruimte te koop wordt aangeboden: indien de koopprijs niet hoger is dan redelijk is gelet op de
      waarde van de woonruimte in het economisch verkeer.

      3 De gemeenteraad stelt in de huisvestingsverordening regels met betrekking tot de wijze waarop de aanbieding
      dient plaats te vinden. De raad kan daarbij tevens regels stellen omtrent de wijze waarop aan burgemeester en
      wethouders moet worden aangetoond dat de aanbieding in overeenstemming met het bij en krachtens de wet bepaalde
      heeft plaatsgevonden, alsmede met betrekking tot de wijze waarop aan burgemeester en wethouders verslag moet worden
      uitgebracht over het verloop van de aanbiedingsprocedure.

      4 Het eerste lid is tot 1 januari 2003 niet van toepassing ten aanzien van een standplaats die is bestemd voor een
      woningzoekende die met een woonwagen op een standplaats staat die is gelegen op een van de in de bijlage genoemde
      regionale woonwagencentra.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0005674#Artikel9
