  - number: '14'
    text: |-
      1 De gemeenteraad kan in het belang van een evenwichtige en rechtvaardige verdeling van woonruimte in de
      huisvestingsverordening bepalen dat door burgemeester en wethouders een register van woningzoekenden wordt
      bijgehouden.

      2 Ingeval toepassing wordt gegeven aan het eerste lid, wordt in de huisvestingsverordening tevens bepaald:

      a. welke woningzoekenden voor inschrijving in het register in aanmerking komen;

      b. welke gegevens met het oog op een goede toepassing van de verordening bij een verzoek om inschrijving moeten
      worden overgelegd;

      c. hoe lang een inschrijving geldig blijft;

      d. welke gegevens op het bewijs van inschrijving moeten worden vermeld;

      e. in welke gevallen een inschrijving door burgemeester en wethouders kan worden doorgehaald.

      3 Bij de bepaling welke woningzoekenden voor inschrijving in het register in aanmerking komen, worden slechts
      criteria vastgesteld, die ingevolge de huisvestingsverordening bij de verlening van de huisvestingsvergunning
      overeenkomstig [artikel 25][ref1] worden toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel25
    url: https://wetten.overheid.nl/BWBR0005674/2010-10-01#Artikel14
    references:
      - id: ref1
