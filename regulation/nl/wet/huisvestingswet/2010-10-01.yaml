  - number: '62'
    text: |-
      Bij de voorbereiding van een beleidsregel als bedoeld in [artikel 61][ref1] plegen gedeputeerde staten overleg met
      de besturen van de gemeenten waarop de beleidsregel betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel61
    url: https://wetten.overheid.nl/BWBR0005674/2010-10-01#Artikel62
