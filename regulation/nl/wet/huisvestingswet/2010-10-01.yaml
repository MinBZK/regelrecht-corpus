  - number: 60a
    text: |-
      Voor de toepassing van het in deze paragraaf bepaalde wordt verstaan onder:

      a. verblijfsgerechtigden: vreemdelingen die in Nederland op grond van een asielverzoek rechtmatig verblijf hebben
      als bedoeld in [artikel 8, onderdelen a tot en met d, van de Vreemdelingenwet 2000][ref1];

      b. taakstelling: het aantal in opvangcentra of op gemeentelijke opvangplaatsen verkerende verblijfsgerechtigden in
      wier huisvesting per gemeente per kalenderhalfjaar dient te worden voorzien.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0005674/2010-10-01#Artikel60a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 60b
    text: |-
      1 Burgemeester en wethouders dragen zorg voor de voorziening in de huisvesting van verblijfsgerechtigden in de
      gemeente overeenkomstig de voor de gemeente geldende taakstelling.

      2 Behoudens toepassing van de bevoegdheid, bedoeld in [artikel 60c, eerste lid][ref1], geldt als taakstelling de
      uitkomst van de toepassing van de formule (a:b) * c, waarin wordt voorgesteld:

        - met de letter a: het aantal inwoners van een gemeente volgens de door het Centraal Bureau voor de Statistiek
      openbaar gemaakte bevolkingscijfers per 1 januari van het jaar dat voorafgaat aan het jaar waartoe het
      kalenderhalfjaar, bedoeld bij de letter c, behoort, dan wel het in plaats daarvan op grond van het derde lid
      vastgestelde aantal;
        - met de letter b: het aantal inwoners van Nederland volgens de door het Centraal Bureau voor de Statistiek
      openbaar gemaakte bevolkingscijfer per 1 januari van het jaar dat voorafgaat aan het jaar waartoe het
      kalenderhalfjaar, bedoeld bij de letter c, behoort;
        - met de letter c: het door Onze Minister van Justitie in de *Staatscourant* bekendgemaakte totale aantal
      verblijfsgerechtigden in wier huisvesting in het bij die bekendmaking aan te geven kalenderhalfjaar naar
      verwachting zal dienen te worden voorzien.

      3 Gedeputeerde staten van de betrokken provincie of de betrokken provincies zijn bevoegd het aantal inwoners van
      een gemeente per 1 januari van het jaar dat voorafgaat aan het jaar waartoe het kalenderhalfjaar, bedoeld in het
      tweede lid bij de letter c, behoort, vast te stellen voor de gemeenten die zijn betrokken bij een wijziging van
      de gemeentelijke indeling en waarvoor de datum van herindeling is gelegen op 1 januari van laatstbedoeld jaar. Bij
      deze vaststelling wordt zo veel mogelijk rekening gehouden met de inwonertallen van de samenstellende delen van de
      bij een wijziging van de gemeentelijke indeling betrokken gemeenten. Een vaststelling per 1 januari van het in de
      eerste volzin eerstbedoelde jaar wordt vóór 1 oktober van dat jaar bekendgemaakt in de *Staatscourant*.

      4 De bekendmaking, bedoeld in het tweede lid bij de letter c, geschiedt ten minste dertien weken voor de aanvang
      van het kalenderhalfjaar waarop zij betrekking heeft.

      5 De met toepassing van de formule, bedoeld in het tweede lid, verkregen uitkomst wordt naar boven afgerond op een
      geheel getal.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel60c
    url: https://wetten.overheid.nl/BWBR0005674/2010-10-01#Artikel60b
