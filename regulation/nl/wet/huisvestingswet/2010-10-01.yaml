  - number: '12'
    text: |-
      1 De gemeenteraad kan, voor zover dat in het belang van een evenwichtige en rechtvaardige verdeling van woonruimte
      noodzakelijk is, in de huisvestingsverordening bovendien bepalen dat voor daarbij aan te wijzen categorieën van
      woonruimte, aangewezen overeenkomstig [artikel 5][ref1], bij het verlenen van huisvestingsvergunningen voorrang
      wordt gegeven aan personen die zijn geplaatst op een door burgemeester en wethouders aan de eigenaar van de
      betrokken woonruimte gedane voordracht.

      2 Bij toepassing van het eerste lid stelt de gemeenteraad in de huisvestingsverordening tevens vast welke
      categorieën woningzoekenden in aanmerking komen om op een voordracht als bedoeld in het eerste lid te worden
      geplaatst en volgens welke criteria binnen die categorieën van woningzoekenden de rangorde naar urgentie wordt
      bepaald.

      3 Tot de criteria, bedoeld in het tweede lid, kan mede behoren dat aan de woonruimte welke de woningzoekende
      verlaat, met het oog op een evenwichtige en rechtvaardige verdeling van woonruimte dringend behoefte bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel5
    url: https://wetten.overheid.nl/BWBR0005674/2010-10-01#Artikel12
    references:
      - id: ref1
