    text: |-
      Met de opsporing van de bij deze wet strafbaar gestelde feiten zijn, onverminderd
      [artikel 141 van het Wetboek van Strafvordering][ref1], belast de bij of krachtens [artikel 75][ref2] aangewezen
      ambtenaren, voor zover zij tevens buitengewoon opsporingsambtenaar zijn. Deze ambtenaren zijn tevens belast
      met de opsporing van de feiten, strafbaar gesteld in de [artikelen 179][ref3] tot en met [182][ref4] en
      [184 van het Wetboek van Strafrecht][ref5], voor zover deze feiten betrekking hebben op een bevel, vordering of
      handeling, gedaan of ondernomen door henzelf.


