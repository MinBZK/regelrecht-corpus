    text: |-
      1 Indien het naar het oordeel van de gemeenteraad noodzakelijk is regelen te stellen met betrekking tot het in
      gebruik nemen of geven van woonruimte als bedoeld in [hoofdstuk II][ref1], of met betrekking tot wijzigingen van de
      woonruimtevoorraad als bedoeld in [hoofdstuk III][ref2], stelt de gemeenteraad een huisvestingsverordening vast.

      2 Ten behoeve van de toepassing van het eerste lid gaat de gemeenteraad in elk geval na hoe met regelen als in dat
      lid bedoeld, kan worden bewerkstelligd dat bij het in gebruik geven van woonruimten met een verhoudingsgewijs lage
      prijs zoveel mogelijk voorrang wordt gegeven aan woningzoekenden die, gelet op hun inkomen, in het bijzonder op die
      woonruimten zijn aangewezen. Tevens gaat de gemeenteraad na op welke wijze kan worden bewerkstelligd dat bij het in
      gebruik nemen of geven van een standplaats voorrang wordt verleend aan woningzoekenden, die in een woonwagen wonen
      of hebben gewoond.

      3 In afwijking van het eerste en tweede lid treedt het algemeen bestuur van een plusregio als bedoeld in
      [artikel 104 van de Wet gemeenschappelijke regelingen][ref3] voor de toepassing van die leden in de plaats van
      de gemeenteraad.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0005674#HoofdstukIII
      [ref3]: https://wetten.overheid.nl/BWBR0003740#Artikel104
