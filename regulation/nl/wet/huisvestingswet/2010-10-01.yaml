  - number: '4'
    text: |-
      1 Indien een gemeente met een eigenaar van een of meer woonruimten een overeenkomst sluit over het in gebruik geven
      daarvan, is [artikel 2, tweede lid][ref1], van overeenkomstige toepassing op de in zodanige overeenkomst op te
      nemen bepalingen.

      2 Indien een gemeente een of meer overeenkomsten sluit, als bedoeld in het eerste lid, draagt zij er zorg voor, dat
      een belanghebbende bij een besluit ter uitvoering van zodanige overeenkomst, daarover zijn beklag kan doen bij een
      daartoe door burgemeester en wethouders ingestelde commissie, die haar taak onafhankelijk van de gemeente en van
      de betrokken eigenaar of eigenaren van woonruimte verricht. Een overeenkomst als bedoeld in het eerste lid, dient
      een bepaling te bevatten, er toe strekkende dat de uitspraken van de in de eerste volzin bedoelde commissie, voor
      zover zij betrekking hebben op de uitvoering van die overeenkomst, partijen bij de overeenkomst tot bindend advies
      strekken.

      3 Bij de uitvoering van een overeenkomst als bedoeld in het eerste lid worden de ingevolge [artikel 61][ref2] ter
      zake van de woonruimteverdeling vastgestelde richtlijnen en de ingevolge [artikel 67][ref3] of [artikel 68][ref4]
      ter zake van de woonruimteverdeling gegeven aanwijzingen in acht genomen. Op de criteria die worden
      toegepast bij het in gebruik geven van woonruimten waarop de overeenkomst betrekking heeft, zijn de krachtens
      [artikel 13 ][ref5]en in de [artikelen 13a tot en met 13c][ref6] gestelde regels van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel2
