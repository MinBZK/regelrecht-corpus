  - number: '52'
    text: |-
      1 Burgemeester en wethouders kunnen ambtshalve, dan wel op daartoe strekkend verzoek van de gebruiker het bedrag
      van de gebruiksvergoeding of van de aanvullende vergoeding wijzigen teneinde die vergoeding in overeenstemming te
      brengen met een voor het betrokken gebruik redelijke prijs.

      2 Op een besluit tot wijziging van de gebruiksvergoeding is [artikel 51, tweede lid][ref1], van overeenkomstige
      toepassing. Op een besluit tot wijziging van de aanvullende vergoeding is [artikel 51, vierde lid][ref2], van
      overeenkomstige toepassing.

      3 Op een besluit als bedoeld in het eerste lid zijn het [vijfde en zesde lid van artikel 51][ref3] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel51
      [ref2]: https://wetten.overheid.nl/BWBR0005674#Artikel51
      [ref3]: https://wetten.overheid.nl/BWBR0005674#Artikel51
