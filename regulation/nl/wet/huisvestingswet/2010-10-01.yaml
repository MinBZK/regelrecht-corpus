  - number: '60'
    text: |-
      1 Ingeval de vordering wordt beëindigd met toepassing van [artikel 55, eerste lid, onder a, of tweede lid][ref1],
      is de eigenaar gehouden aan de gemeente de kosten te vergoeden van de overeenkomstig [artikel 46][ref2] uitgevoerde
      voorzieningen, voor zover daarin niet reeds door afschrijving of op andere wijze is voorzien.

      2 Ingeval de vordering is geëindigd ingevolge het bepaalde in [artikel 58][ref3] en voordien niet een nieuw besluit
      tot vordering als bedoeld in [artikel 40][ref4] onherroepelijk is geworden, dan wel ingeval de vordering wordt
      beëindigd met toepassing van [artikel 55, eerste lid, onder b][ref5], is de gemeente gehouden op verzoek van de
      eigenaar aan deze de kosten te vergoeden die hij redelijkerwijs moest maken met het oog op het herstel in de oude
      toestand en die hij ook daadwerkelijk heeft gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel55
