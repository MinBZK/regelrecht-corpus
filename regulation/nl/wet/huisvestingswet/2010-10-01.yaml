      is toegepast.

      2 In afwijking van het eerste lid zendt Onze Minister binnen twee jaar na de inwerkingtreding van de
      [artikelen 60a tot en met 60g][ref1] aan de Staten-Generaal een verslag over de doeltreffendheid en de effecten van
      die artikelen in de praktijk.


