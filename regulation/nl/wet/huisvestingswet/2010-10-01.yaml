      - id: ref2
        bwb_id: BWBR0005674
        artikel: 60b
        hoofdstuk: V
        paragraaf: '1'
  - number: 60e
    text: |-
      1 Indien burgemeester en wethouders geheel of gedeeltelijk nalaten uitvoering te geven aan de verplichting, bedoeld
      in [artikel 60b, eerste lid][ref1], voorzien gedeputeerde staten in de uitvoering namens burgemeester en wethouders
      en ten laste van de gemeente.

      2 Alvorens toepassing te geven aan het eerste lid plegen gedeputeerde staten overleg met burgemeester en wethouders
      van de betrokken gemeente en stellen zij burgemeester en wethouders een termijn, waarbinnen zij alsnog zelf in
      de uitvoering van de verplichting, bedoeld in [artikel 60b, eerste lid][ref2], kunnen voorzien, tenzij de geboden
      spoed zich daartegen verzet. De termijn, bedoeld in de eerste volzin, bedraagt ten hoogste zes maanden gerekend
      vanaf het einde van het kalenderhalfjaar waarop die verplichting van toepassing was.

      3 Indien gedeputeerde staten geheel of gedeeltelijk nalaten uitvoering te geven aan de verplichting, bedoeld in
      [artikel 60b, eerste lid][ref3], voorziet Onze Minister in de uitvoering van die verplichting namens gedeputeerde
      staten en ten laste van de provincie.

      4 Alvorens toepassing te geven aan het derde lid pleegt Onze Minister overleg met gedeputeerde staten en stelt
      hij gedeputeerde staten een termijn, waarbinnen zij alsnog in de uitvoering van die verplichting kunnen voorzien,
      tenzij de geboden spoed zich daartegen verzet. Het tweede lid is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel60b
      [ref2]: https://wetten.overheid.nl/BWBR0005674#Artikel60b
      [ref3]: https://wetten.overheid.nl/BWBR0005674#Artikel60b
