        hoofdstuk: V
        paragraaf: '2'
  - number: 13b
    text: |-
      1 De gemeenteraad kan voor zover dit noodzakelijk is met het oog op een evenwichtige en rechtvaardige verdeling
      van woonruimte in verband met uit bovengemeentelijk ruimtelijk beleid voortvloeiende geringe mogelijkheden tot
      uitbreiding van de woonruimtevoorraad in de betrokken gemeente of kern, in de huisvestingsverordening criteria
      vaststellen voor de verlening van huisvestingsvergunningen, waarbij onderscheid kan worden gemaakt tussen
      woningzoekenden die al of niet een economische of maatschappelijke binding hebben aan de gemeente of aan een tot de
      gemeente behorende kern.

      2 Indien de gemeenteraad toepassing geeft aan het eerste lid, behoeft de vaststelling van die criteria voorafgaande
      toestemming van gedeputeerde staten.

      3 Gedeputeerde staten kunnen hun toestemming slechts onthouden, indien het beoogde onderscheid naar hun oordeel:

      a. onnodig belemmerend zou zijn voor de huisvestingsmogelijkheden van woningzoekenden die geen economische of
      maatschappelijke binding hebben met de gemeente of kern, mede gelet op de huisvestingsmogelijkheden voor deze
      woningzoekenden in andere delen van de betrokken regio, of

      b. onvoldoende is afgestemd op het bovengemeentelijke ruimtelijke beleid of op het huisvestingsbeleid van andere
      gemeenten.

      4 Het tweede lid is niet van toepassing voor zover een onderscheid als bedoeld in het eerste lid is voorgeschreven
      in, dan wel uitdrukkelijk is toegelaten bij een beleidsregel als bedoeld in [artikel 61][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel61
    url: https://wetten.overheid.nl/BWBR0005674/2010-10-01#Artikel13b
