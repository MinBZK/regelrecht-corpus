        artikel: '72'
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0005674
        artikel: '51'
        hoofdstuk: IV
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0005674
        artikel: '73'
        hoofdstuk: VI
  - number: '75'
    text: |-
      1 Met het toezicht op de naleving van het bij of krachtens deze wet bepaalde zijn belast de bij besluit van
      burgemeester en wethouders aangewezen ambtenaren.

      2 Met het toezicht op de naleving van het bij of krachtens deze wet bepaalde zijn tevens belast de bij besluit van
      Onze Minister aangewezen ambtenaren.

      3 Van een besluit als bedoeld in het eerste of tweede lid wordt mededeling gedaan door plaatsing in de
      Staatscourant.
    url: https://wetten.overheid.nl/BWBR0005674/2010-10-01#Artikel75
  - number: '77'
    text: |-
      De toezichthouder is bevoegd, met medeneming van de benodigde apparatuur, een woning binnen te treden zonder
      toestemming van de bewoner.
    url: https://wetten.overheid.nl/BWBR0005674/2010-10-01#Artikel77
  - number: '78'
    text: |-
      1 Met het toezicht op de uitvoering en de handhaving van het bij of krachtens deze wet bepaalde zijn belast de bij
      besluit van Onze Minister aangewezen ambtenaren.

      2 De [artikelen 5:13][ref1], [5:15][ref2], [5:16][ref3], [5:17][ref4] en
      [5:20 van de Algemene wet bestuursrecht][ref5] zijn van overeenkomstige toepassing.

      3 Onze Minister kan bij ministeriële regeling bepalen dat bestuursorganen die met de uitvoering of de handhaving
      van het bij of krachtens deze wet bepaalde zijn belast, daarbij aan te geven gegevens verstrekken aan de krachtens
      het eerste lid aangewezen ambtenaren. Bij de regeling kunnen regels worden gesteld met betrekking tot het tijdstip
      waarop, de frequentie waarmee en de vorm waarin de gegevens worden verstrekt. Tevens kan bij de regeling worden
      bepaald dat daarbij gestelde regels slechts gelden in daarbij aangegeven gevallen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel513
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel515
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel516
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel517
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel520
    url: https://wetten.overheid.nl/BWBR0005674/2010-10-01#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 5:13
      - id: ref2
        bwb_id: BWBR0005537
        artikel: 5:15
      - id: ref3
        bwb_id: BWBR0005537
        artikel: 5:16
      - id: ref4
        bwb_id: BWBR0005537
        artikel: 5:17
      - id: ref5
        bwb_id: BWBR0005537
        artikel: 5:20
  - number: '79'
    text: |-
      Burgemeester en wethouders kunnen bepalen dat de toegelaten instellingen als bedoeld in
      [artikel 70, eerste lid, van de Woningwet][ref1], die eigenaar zijn van in de gemeente gelegen woonruimten,
      alsmede andere eigenaren van in de gemeente gelegen woonruimten, aan hen verslag uitbrengen over de huisvesting
      in die woonruimten van personen, behorende tot daarbij aangegeven categorieën van woningzoekenden die door andere
      omstandigheden dan hun inkomen moeilijkheden ondervinden bij het vinden van hun passende huisvesting.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel70
