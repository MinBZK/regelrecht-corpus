        paragraaf: '1'
  - number: 60c
    text: |-
      Gedeputeerde staten zijn bevoegd taakstellingen die volgen uit de toepassing van de formule, bedoeld in
      [artikel 60b, tweede lid][ref1], te wijzigen, voor zover de verwezenlijking van het bovengemeentelijke ruimtelijke
      beleid of volkshuisvestingsbeleid of de samenhang tussen het door gemeenten gevoerde volkshuisvestingsbeleid dat
      vordert, met dien verstande dat de som van de aantallen verblijfsgerechtigden in wier huisvesting na die wijziging
      in de betrokken gemeenten te zamen dient te worden voorzien, niet afwijkt van de som van de aantallen die worden
      verkregen met toepassing van de formule, bedoeld in [artikel 60b, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel60b
      [ref2]: https://wetten.overheid.nl/BWBR0005674#Artikel60b
    url: https://wetten.overheid.nl/BWBR0005674/2010-10-01#Artikel60c
