  - number: '27'
    text: |-
      In bijzondere gevallen kunnen burgemeester en wethouders een huisvestingsvergunning verlenen aan
      andere woningzoekenden dan bedoeld in [artikel 9, eerste lid][ref1], voor zover wordt voldaan aan
      [artikel 9, tweede lid][ref2], zonder dat de betrokken woonruimte overeenkomstig het bij en krachtens
      [artikel 26, eerste en derde lid][ref3], bepaalde vruchteloos is aangeboden.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0005674#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0005674#Artikel26
    url: https://wetten.overheid.nl/BWBR0005674/2010-10-01#Artikel27
