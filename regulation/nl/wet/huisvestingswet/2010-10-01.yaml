  - number: '59'
    text: |-
      De gebruiker is verplicht het gevorderde onverwijld te ontruimen:

      a. zodra de vordering ingevolge het bepaalde in [artikel 58][ref1] is geëindigd, tenzij voordien een nieuw besluit
      tot vordering als bedoeld in [artikel 40][ref2] onherroepelijk is geworden;

      b. zodra de vordering ingevolge een besluit als bedoeld in [artikel 55, eerste lid, onder b, of tweede lid][ref3],
      is geëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel58
      [ref2]: https://wetten.overheid.nl/BWBR0005674#Artikel40
      [ref3]: https://wetten.overheid.nl/BWBR0005674#Artikel55
