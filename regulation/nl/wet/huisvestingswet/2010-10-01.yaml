        artikel: '5'
        hoofdstuk: II
        paragraaf: '1'
  - number: '13'
    text: |-
      Bij algemene maatregel van bestuur kunnen met het oog op de bescherming van daarbij aan te geven categorieën van
      woningzoekenden regels worden gesteld met betrekking tot de toepassing van [artikel 9, eerste lid][ref1], en de
      [artikelen 10 tot en met 12][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0005674#Artikel10
