  - number: '70'
    text: |-
      De gemeenteraad respectievelijk het college van burgemeester en wethouders is verplicht aan een aanwijzing gevolg
      te geven.
    url: https://wetten.overheid.nl/BWBR0005674/2010-10-01#Artikel70
  - number: '72'
    text: |-
      1 Binnen zes weken na verzending van een besluit tot vaststelling van een gebruiksvergoeding als bedoeld in
      [artikel 51, eerste lid][ref1], of tot wijziging van de gebruiksvergoeding, bedoeld in [artikel 52][ref2], kan
      degene aan wie de woonruimte in gebruik is gegeven, een uitspraak over de redelijkheid van dat besluit vragen aan
      de huurcommissie, bedoeld in [artikel 3a van de Uitvoeringswet huurprijzen woonruimte][ref3].

      2 Een verzoek als bedoeld in het eerste lid wordt schriftelijk ingediend. Onze Minister bepaalt aan welke
      voorwaarden het verzoek moet voldoen en welke gegevens daarbij moeten worden verstrekt of overgelegd.

      3 De huurcommissie doet binnen vier maanden na ontvangst van het verzoek bedoeld in het eerste lid, schriftelijk
      uitspraak. Zij kan deze termijn met ten hoogste twee maanden verlengen. Zij stelt partijen van de duur van de
      verlenging in kennis.

      4 De uitspraak van de huurcommissie is met redenen omkleed. De huurcommissie vermeldt in haar uitspraak de
      gebruiksvergoeding die zij redelijk acht.

      5 De huurcommissie zendt bij aangetekend schrijven een afschrift van haar uitspraak aan de verzoeker en aan
      burgemeester en wethouders. Zij wijst daarbij op de in [artikel 74, eerste lid][ref4], bedoelde mogelijkheid om de
      kantonrechter te verzoeken de gebruiksvergoeding vast te stellen, alsook op de vorm en de termijn die daarbij in
      acht moeten worden genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel51
      [ref2]: https://wetten.overheid.nl/BWBR0005674#Artikel52
      [ref3]: https://wetten.overheid.nl/BWBR0014315#Artikel3a
      [ref4]: https://wetten.overheid.nl/BWBR0005674#Artikel74
    url: https://wetten.overheid.nl/BWBR0005674/2010-10-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0005674
        artikel: '51'
        hoofdstuk: IV
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005674
        artikel: '52'
        hoofdstuk: IV
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0014315
        artikel: 3a
      - id: ref4
        bwb_id: BWBR0005674
        artikel: '74'
        hoofdstuk: VI
  - number: '73'
    text: |-
      1 Indien noch de gebruiker, noch het college van burgemeester en wethouders binnen twee maanden na verzending van
      het in [artikel 72, vijfde lid][ref1], bedoelde afschrift een verzoek richt tot de kantonrechter, overeenkomstig
      [artikel 74, eerste lid][ref2], geldt als gebruiksvergoeding de vergoeding die de huurcommissie blijkens haar
      uitspraak redelijk acht.

      2 Een ingevolge het eerste lid verschuldigde gebruiksvergoeding mag in rekening worden gebracht met ingang van
      de datum die was vermeld in het besluit van burgemeester en wethouders tot vaststelling of tot wijziging van de
      gebruiksvergoeding, of, indien de huurcommissie in haar uitspraak een latere datum heeft vermeld, met ingang van
      die latere datum.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel72
      [ref2]: https://wetten.overheid.nl/BWBR0005674#Artikel74
    url: https://wetten.overheid.nl/BWBR0005674/2010-10-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0005674
        artikel: '72'
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0005674
        artikel: '74'
        hoofdstuk: VI
  - number: '74'
    text: |-
      1 Gedurende twee maanden na verzending van een uitspraak van de huurcommissie als bedoeld in
      [artikel 72, eerste lid][ref1], kunnen de gebruiker en burgemeester en wethouders de kantonrechter van de
      rechtbank van het arrondissement waarin de woonruimte is gelegen, schriftelijk en met redenen omkleed verzoeken
      de gebruiksvergoeding vast te stellen. Indien het verzoek niet met redenen is omkleed, stelt de kantonrechter de
      verzoeker in de gelegenheid het verzuim binnen een door hem te bepalen termijn te herstellen.

      2 Een afschrift van de uitspraak van de huurcommissie, bedoeld in het eerste lid, wordt bij het verzoek gevoegd.

      3 De kantonrechter beschikt op het verzoek met inachtneming van het bepaalde in [artikel 51, tweede lid][ref2].

      4 De beschikking wordt in het openbaar uitgesproken. De griffier zendt een afschrift van de beschikking aan de
      huurcommissie.

      5 Tegen deze beschikking staat hoger beroep noch beroep in cassatie open, met uitzondering van cassatie in het
      belang van de wet.

      6 [Artikel 73, tweede lid][ref3], is van overeenkomstige toepassing op de door de kantonrechter vastgestelde
      gebruiksvergoeding.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel72
      [ref2]: https://wetten.overheid.nl/BWBR0005674#Artikel51
      [ref3]: https://wetten.overheid.nl/BWBR0005674#Artikel73
    url: https://wetten.overheid.nl/BWBR0005674/2010-10-01#Artikel74
    references:
