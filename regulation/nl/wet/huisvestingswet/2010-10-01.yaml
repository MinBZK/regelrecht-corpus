  - number: '50'
    text: |-
      1 Zo spoedig mogelijk nadat het gevorderde ter beschikking van burgemeester en wethouders is gekomen, wijzen zij
      het ter bewoning toe aan een of meer met name te noemen personen.

      2 Bij de toewijzing wijzen burgemeester en wethouders de gebruiker op zijn verplichting ingevolge
      [artikel 59][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel59
    url: https://wetten.overheid.nl/BWBR0005674/2010-10-01#Artikel50
