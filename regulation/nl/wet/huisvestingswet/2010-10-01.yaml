  - number: '17'
    text: |-
      1 De gemeenteraad kan in de huisvestingsverordening regels stellen met betrekking tot centrale registratie van
      woningzoekenden die daartegen geen bedenkingen hebben. De eigenaars van woonruimte die zelf een registratie van
      woningzoekenden bijhouden, zijn verplicht aan die centrale registratie medewerking te verlenen.

      2 Tenzij de huisvestingsverordening anders bepaalt, kunnen burgemeester en wethouders eigenaren van woonruimte
      machtigen een of meer van hun bevoegdheden krachtens deze paragraaf uit te oefenen.
    url: https://wetten.overheid.nl/BWBR0005674/2010-10-01#Artikel17
  - number: '18'
    text: |-
      1 De eigenaar van een woonruimte die is aangewezen overeenkomstig [artikel 12, eerste lid][ref1], is verplicht het
      ter beschikking komen van die woonruimte onverwijld aan burgemeester en wethouders te melden.

      2 Gelijktijdig met de melding, bedoeld in het eerste lid, kan de eigenaar aan burgemeester en wethouders een
      woningzoekende voordragen.

      3 Het eerste lid is niet van toepassing, indien de woonruimte zal worden bewoond door de eigenaar ervan in de zin
      van het Burgerlijk Wetboek, en de woonruimte gedurende ten minste de zes maanden waarin deze laatstelijk bewoond is
      geweest, bewoond werd door de eigenaar ervan in de zin van het Burgerlijk Wetboek.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel12
    url: https://wetten.overheid.nl/BWBR0005674/2010-10-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0005674
        artikel: '12'
        hoofdstuk: II
        paragraaf: '3'
  - number: '19'
    text: |-
      1 Tot uiterlijk twee weken nadat het ter beschikking komen van een woonruimte ingevolge
      [artikel 18, eerste lid][ref1], is gemeld, kunnen burgemeester en wethouders aan de eigenaar een of meer
      woningzoekenden voordragen die behoren tot de ingevolge [artikel 12, tweede lid][ref2], aangewezen categorieën.

      2 Bij het opstellen van de voordracht slaan burgemeester en wethouders acht op de rangorde naar urgentie, zoals die
      ingevolge [artikel 12, tweede lid][ref3], is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0005674#Artikel12
