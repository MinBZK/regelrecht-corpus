  - number: '7'
    text: |-
      1 Het is verboden zonder vergunning van burgemeester en wethouders een woonruimte, aangewezen overeenkomstig
      [artikel 5][ref1], in gebruik te nemen voor bewoning.

      2 Het is verboden een woonruimte, aangewezen overeenkomstig [artikel 5][ref2], voor bewoning in gebruik te geven
      aan een persoon die niet beschikt over een huisvestingsvergunning.

      3 Voor de toepassing van het eerste en tweede lid, wordt het in gebruik nemen of geven van een woonwagen die op een
      standplaats staat, of van een woonschip dat op een ligplaats ligt, aangemerkt als het in gebruik nemen of geven van
      die standplaats onderscheidenlijk ligplaats.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005674#Artikel5
