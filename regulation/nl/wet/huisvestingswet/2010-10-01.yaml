        hoofdstuk: II
        paragraaf: '6'
  - number: '15'
    text: |-
      Ingeval de gemeenteraad toepassing geeft aan [artikel 11][ref1] of [12][ref2], geeft hij tevens toepassing aan
      [artikel 14][ref3]. In dat geval worden als woningzoekenden die voor inschrijving in het register in aanmerking
      komen, in elk geval aangewezen:

      a. bij toepassing van [artikel 11][ref4]: de woningzoekenden die kunnen worden ingedeeld in een andere dan de
      laagste urgentiecategorie;

      b. bij toepassing van [artikel 12][ref5]: de categorieën woningzoekenden die in aanmerking komen om op een
      voordracht als bedoeld in [artikel 12, eerste lid][ref6], te worden geplaatst.


