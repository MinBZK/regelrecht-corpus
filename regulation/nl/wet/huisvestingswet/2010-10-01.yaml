  - number: '21'
    text: |-
      1 Burgemeester en wethouders kunnen de voordracht intrekken, indien de voordracht niet leidt tot de totstandkoming
      van een overeenkomst tussen de eigenaar en een der voorgedragen woningzoekenden, uit kracht waarvan die
      woningzoekende gerechtigd is de betrokken woonruimte voor bewoning in gebruik te nemen.

      2 Gelijktijdig met de intrekking van een voordracht overeenkomstig het eerste lid, kunnen burgemeester
      en wethouders aan de eigenaar opnieuw een of meer woningzoekenden voordragen die behoren tot de ingevolge
      [artikel 12, tweede lid][ref1], aangewezen categorieën. [Artikel 19, tweede lid][ref2], [artikel 20][ref3] en het
      eerste lid van dit artikel zijn van toepassing.

      3 In afwijking van het tweede lid kan geen nieuwe voordracht meer worden gedaan, zodra 10 weken zijn verstreken
      nadat het ter beschikking komen van de woonruimte ingevolge [artikel 18, eerste lid][ref4], is gemeld.


