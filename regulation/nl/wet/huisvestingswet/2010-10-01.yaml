  - number: '23'
    text: |-
      1 De gemeenteraad stelt in de huisvestingsverordening regels met betrekking tot:

      a. de wijze waarop een huisvestingsvergunning kan worden aangevraagd;

      b. de gegevens die door de aanvrager moeten worden verstrekt met het oog op de beoordeling van de aanvraag;

      c. de termijn waarbinnen door burgemeester en wethouders op de aanvraag moet worden beslist;

      d. de gegevens die ten minste in de beschikking op de aanvraag moeten worden vermeld.

      2 De gemeenteraad kan in de huisvestingsverordening bepalen dat een aanvraag slechts in behandeling wordt genomen,
      indien de aanvrager aannemelijk kan maken dat hij, indien hij een huisvestingsvergunning voor de in de aanvraag
      aangegeven woonruimte krijgt, die woonruimte ook daadwerkelijk in gebruik zal kunnen nemen.

      3 Een bepaling als bedoeld in het tweede lid, blijft buiten toepassing, indien de aanvraag
      is gedaan met het oog op het bepaalde in de [artikelen 267 lid 6][ref1], [268 lid 3][ref2]
      of [270 lid 1 van Boek 7 van het Burgerlijk Wetboek][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel267
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel268
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel270
    url: https://wetten.overheid.nl/BWBR0005674/2010-10-01#Artikel23
