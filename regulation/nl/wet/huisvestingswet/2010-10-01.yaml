  - number: '11'
    text: |-
      1 De gemeenteraad kan, voor zover dat in het belang van een evenwichtige en rechtvaardige verdeling van woonruimte
      noodzakelijk is, in de huisvestingsverordening tevens bepalen dat voor daarbij aan te wijzen categorieën van
      woonruimte, aangewezen overeenkomstig [artikel 5][ref1], bij het verlenen van huisvestingsvergunningen voorrang
      wordt gegeven aan woningzoekenden waarvoor de voorziening in de behoefte aan woonruimte dringend noodzakelijk is.

      2 Bij toepassing van het eerste lid stelt de gemeenteraad in de huisvestingsverordening tevens criteria vast
      volgens welke de woningzoekenden, bedoeld in [artikel 9][ref2], worden ingedeeld in urgentiecategorieën.

      3 Tot de criteria, bedoeld in het tweede lid, kan mede behoren dat aan de woonruimte welke de woningzoekende
      verlaat, met het oog op een evenwichtige en rechtvaardige verdeling van woonruimte dringend behoefte bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005674#Artikel9
