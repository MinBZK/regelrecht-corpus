  - number: '22'
    text: |-
      De gemeenteraad stelt in de huisvestingsverordening nadere regels met betrekking tot de toepassing van deze
      paragraaf. Daarbij regelt hij in ieder geval de wijze waarop een woningzoekende, behorende tot een krachtens
      [artikel 12, tweede lid][ref1], aangewezen categorie, desverzocht op de hoogte wordt gesteld van de toepassing die
      te zijnen aanzien is gegeven aan de bij of krachtens deze paragraaf gestelde voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel12
