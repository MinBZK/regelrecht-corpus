        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '8'
  - number: '10'
    text: |-
      De gemeenteraad kan in de huisvestingsverordening voorts bepalen dat een of meer daarbij aan te wijzen categorieën
      van woonruimte, aangewezen overeenkomstig [artikel 5][ref1], met het oog op een evenwichtige en rechtvaardige
      verdeling van woonruimte, in verband met de aard, grootte of prijs van die woonruimte, slechts passend is voor een
      daarbij aangewezen gedeelte van de ingevolge [artikel 9][ref2] aangewezen categorieën van woningzoekenden.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005674#Artikel9
