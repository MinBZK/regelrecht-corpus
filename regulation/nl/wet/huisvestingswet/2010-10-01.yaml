  - number: 60f
    text: |-
      1 Burgemeester en wethouders brengen binnen vier weken na afloop van het kalenderhalfjaar aan gedeputeerde staten
      verslag uit over de voortgang van de uitvoering van de verplichting, bedoeld in [artikel 60b, eerste lid][ref1],
      met toezending van een afschrift van dat verslag aan Onze Minister van Justitie. Burgemeester en wethouders
      verstrekken daarbij tevens inzicht in de maatregelen die worden voorbereid of zijn genomen teneinde geheel
      uitvoering te geven aan de bedoelde verplichting.

      2 Gedeputeerde staten brengen binnen acht weken na afloop van het kalenderhalfjaar aan Onze Minister gemotiveerd
      verslag uit over het al dan niet toepassen van [artikel 60c][ref2] of [artikel 60e, eerste en tweede lid][ref3],
      met toezending van een afschrift van dat verslag aan Onze Minister van Justitie.


