  - number: '91'
    text: |-
      1 [Artikel 4, tweede lid, tweede volzin][ref1], is niet van toepassing op overeenkomsten als bedoeld in
      [artikel 4, eerste lid][ref2], voor zover zij zijn totstandgekomen voor het tijdstip van in werking treden van
      de desbetreffende bepaling. Uiterlijk drie maanden na dat tijdstip verstrekken burgemeester en wethouders aan de
      gemeenteraad een overzicht van voor de gemeente verbindende overeenkomsten waarop het bepaalde in de vorige volzin
      van toepassing is, en van de wijze waarop zij voornemens zijn te bevorderen dat die overeenkomsten worden aangevuld
      met een bepaling als bedoeld in [artikel 4, tweede lid, tweede volzin][ref3].

      2 Een vergunning, voor het tijdstip van in werking treden van [hoofdstuk II][ref4] van deze wet verleend
      op grond van artikel 1, eerste lid, van de Woonruimtewet 1947 (*Stb.* H 291), wordt gelijkgesteld met een
      huisvestingsvergunning.

      3 Een woonruimte of gebouw of gedeelte daarvan, op het tijdstip van in werking treden van [hoofdstuk IV][ref5]
      van deze wet gevorderd op grond van artikel 7, eerste lid, van de Woonruimtewet 1947 (*Stb.* H 291), wordt
      gelijkgesteld met een woonruimte of gebouw of gedeelte daarvan, gevorderd op grond van [artikel 40][ref6], met dien
      verstande dat in plaats van de artikelen 46 tot en met 51 de artikelen 13 en 14 van de Woonruimtewet 1947 (*Stb.*
      H 291) van toepassing blijven. Een vordering als bedoeld in de eerste volzin, die voor onbepaalde tijd is gedaan,
      wordt gelijkgesteld met een vordering, gedaan op het tijdstip van in werking treden van [hoofdstuk IV][ref7] van
      deze wet voor een tijdsduur van tien jaar. Een vordering als bedoeld in de eerste volzin, die voor bepaalde tijd is
      gedaan, eindigt op het tijdstip dat in het besluit tot vordering is bepaald.

      4 Een vergunning, voor het tijdstip van in werking treden van [hoofdstuk III][ref8] van deze wet verleend krachtens
      [artikel 56][ref9] of [56a van de Woningwet 1962][ref10] (*Stb.* 1964, 222), wordt voor zover nodig gelijkgesteld
      met een vergunning, verleend ingevolge [artikel 30, eerste lid][ref11], onderscheidenlijk [artikel 33][ref12].

      5 Aanvragen om vergunning, ingediend voor het in werking treden van de desbetreffende hoofdstukken van deze wet,
      worden voor zover nodig behandeld volgens het voordien geldende recht.

      6 [Artikel 86][ref13] is niet van toepassing op woningen en gebouwen waarvan de wederrechtelijke ingebruikneming
      heeft plaatsgevonden voor het tijdstip waarop [dat artikel][ref14] in werking treedt.

      7 In hetgeen overigens met het oog op het in werking treden van deze wet regeling behoeft, wordt voorzien bij
      algemene maatregel van bestuur.


