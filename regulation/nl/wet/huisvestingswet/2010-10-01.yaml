        artikel: '61'
        hoofdstuk: V
        paragraaf: '2'
  - number: 13c
    text: |-
      1 Behoudens het bepaalde in het tweede lid, wordt geen onderscheid naar economische of maatschappelijke binding
      gemaakt ten aanzien van woningzoekenden:

      a. waarvan redelijkerwijs niet of niet meer verwacht kan worden dat zij door het duurzaam verrichten van arbeid in
      hun bestaan voorzien, zoals gepensioneerden, ernstig invaliden en langdurig werklozen;

      b. die als remigrant wensen terug te keren naar Nederland of zijn teruggekeerd, doch nog niet over passende
      huisvesting beschikken;

      c. aan wie op grond van een asielverzoek een van de verblijfsvergunningen, bedoeld in
      [artikel 8, onderdelen a tot en met d, van de Vreemdelingenwet 2000][ref1] is verleend, indien zij na die verlening
      voor de eerste maal woonruimte zoeken;

      d. die na echtscheiding, scheiding van tafel en bed of ontbinding van het huwelijk na scheiding van tafel en bed,
      in verband met die omstandigheid dringend woonruimte behoeven, of

      e. die een procedure tot echtscheiding, scheiding van tafel en bed of ontbinding van het huwelijk na scheiding
      van tafel en bed aanhangig hebben gemaakt en een voorlopige voorziening als bedoeld in [artikel 822][ref2] en
      [823 van het Wetboek van Burgerlijke Rechtsvordering][ref3] hebben verkregen, indien zij in verband met die
      omstandigheid dringend woonruimte behoeven.

      2 Voor zover dat in het belang van een evenwichtige en rechtvaardige verdeling van woonruimte noodzakelijk is in
      verband met uit bovengemeentelijk ruimtelijk beleid voortvloeiende geringe mogelijkheden tot uitbreiding van de
      woonruimtevoorraad in de gemeente of in een of meer kernen, behorend tot de gemeente, kunnen gedeputeerde staten
      bij het verlenen van toestemming als bedoeld in [artikel 13b, tweede lid][ref4], onderscheidenlijk provinciale
      staten bij een beleidsregel als bedoeld in [artikel 61][ref5], toestaan dat wordt afgeweken van het bepaalde in het
      eerste lid, onder *a, b, d* en *e*.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel822
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel823
      [ref4]: https://wetten.overheid.nl/BWBR0005674#Artikel13b
      [ref5]: https://wetten.overheid.nl/BWBR0005674#Artikel61
