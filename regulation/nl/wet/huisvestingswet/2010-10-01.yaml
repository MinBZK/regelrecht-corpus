  - number: '3'
    text: |-
      1 Bij de voorbereiding van een besluit tot vaststelling of wijziging van een huisvestingsverordening plegen
      burgemeester en wethouders overleg met de in de gemeente werkzame, ingevolge [artikel 70, eerste lid][ref1], of
      [artikel 70j, eerste lid, van de Woningwet][ref2] (*Stb.* 1991, 439) toegelaten instellingen en met andere daarvoor
      naar hun oordeel in aanmerking komende organisaties die binnen de gemeente op het gebied van de woonruimteverdeling
      werkzaam zijn.

      2 Burgemeester en wethouders zenden een besluit tot vaststelling of wijziging van een huisvestingsverordening
      toe aan gedeputeerde staten. Zij zenden een afschrift van een zodanig besluit toe aan de inspecteur, bedoeld in
      [artikel 1, eerste lid, van de Woningwet][ref3].

      3 In afwijking van het eerste en tweede lid treedt het dagelijks bestuur van een plusregio als bedoeld in
      [artikel 104 van de Wet gemeenschappelijke regelingen][ref4] voor de toepassing van die leden in de plaats van
      burgemeester en wethouders.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel70
