        hoofdstuk: IV
        paragraaf: '3'
  - number: '51'
    text: |-
      1 Bij de toepassing van [artikel 50, eerste lid][ref1], stellen burgemeester en wethouders de gebruiksvergoeding
      vast, die de gebruiker voor het enkele gebruik van de gevorderde woonruimte, het gevorderde gebouw of het
      gevorderde gedeelte van een gebouw, met de daarbij behorende onroerende aanhorigheden, aan de gemeente maandelijks
      is verschuldigd.

      2 De gebruiksvergoeding wordt vastgesteld met inachtneming van hetgeen krachtens de
      [artikelen 10, eerste lid][ref2], en [12, tweede lid, van de Uitvoeringswet huurprijzen woonruimte][ref3]
      met betrekking tot de redelijkheid van huurprijzen is bepaald. Voor zover dit niet mogelijk is, wordt de
      gebruiksvergoeding vastgesteld op een bedrag dat in het economisch verkeer redelijk is.

      3 Indien de vordering meer omvat dan het enkele gebruik van de woonruimte, het gebouw of het gedeelte van een
      gebouw, met de daarbij behorende onroerende aanhorigheden, kunnen burgemeester en wethouders bij hun besluit als
      bedoeld in het eerste lid tevens bepalen dat de gebruiker aan de gemeente een aanvullende vergoeding verschuldigd
      is ter dekking van de aan dat meerdere verbonden kosten.

      4 De [artikelen 259 tot en met 262 van Boek 7 van het Burgerlijk Wetboek][ref4] zijn op een aanvullende vergoeding
      als bedoeld in het derde lid van overeenkomstige toepassing, met dien verstande dat voor huurder steeds gebruiker
      en voor verhuurder steeds burgemeester en wethouders wordt gelezen.

      5 Burgemeester en wethouders kunnen bepalen dat de gebruiker het door deze krachtens het eerste en derde lid
      verschuldigde bedrag, of een gedeelte daarvan, maandelijks betaalt aan de eigenaar van het gevorderde, ter gehele
      of gedeeltelijke betaling van de geldsommen die de gemeente krachtens [artikel 47, eerste lid][ref5], aan de
      eigenaar verschuldigd wordt.

      6 Tegelijkertijd met de bekendmaking doen burgemeester en wethouders aan de eigenaar van het gevorderde mededeling
      van een besluit als bedoeld in het vijfde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel50
      [ref2]: https://wetten.overheid.nl/BWBR0014315#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0014315#Artikel12
      [ref4]: https://wetten.overheid.nl/BWBR0005290#Artikel259
      [ref5]: https://wetten.overheid.nl/BWBR0005674#Artikel47
