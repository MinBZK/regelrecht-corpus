  - number: 85a
    text: |-
      1 De gemeenteraad kan bij verordening bepalen dat een bestuurlijke boete kan worden opgelegd ter zake van
      de overtreding van de [artikelen 7, eerste en tweede lid][ref1], [8][ref2], [18, eerste lid][ref3], en
      [30, eerste lid][ref4]. Burgemeester en wethouders zijn bevoegd tot het opleggen van een bestuurlijke boete.

      2 De bestuurlijke boete kan niet hoger zijn dan:

      a. € 340 voor overtreding van [artikel 7, eerste lid][ref5];

      b. € 7 500 voor overtreding van de [artikelen 8][ref6], en [18, eerste lid][ref7], en

      c. € 18 500 voor overtreding van de [artikelen 7, tweede lid][ref8], en [30, eerste lid][ref9].

      3 De gemeenteraad stelt bij verordening het bedrag vast van de bestuurlijke boete die voor de verschillende
      overtredingen kan worden opgelegd.

      4 In afwijking van het eerste en derde lid treedt het algemeen bestuur van een plusregio als bedoeld in
      [artikel 104 van de Wet gemeenschappelijke regelingen][ref10] voor de toepassing van die leden in de plaats van
      de gemeenteraad.


