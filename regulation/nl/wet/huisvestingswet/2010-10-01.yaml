  - number: '20'
    text: |-
      In afwijking van [artikel 19, eerste lid][ref1], doen burgemeester en wethouders geen voordracht, indien aan
      de door de eigenaar voorgedragen woningzoekende op grond van de ingevolge de [artikelen 9][ref2], [10][ref3] en
      [11][ref4] geldende eisen een huisvestingsvergunning kan worden verleend en er voor het doen van een voordracht
      geen in aanmerking komende woningzoekenden zijn ingeschreven wier behoefte aan woonruimte urgenter is dan die van
      de door de eigenaar voorgedragen woningzoekende.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel19
