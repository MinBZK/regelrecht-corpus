  - number: 7.18c
    text: |-
      De aanvrager die voor de afgifte van een kwalificatiecertificaat voor matroos in aanmerking wil komen:

      a. is ten minste 17 jaar oud, heeft een goedgekeurd opleidingsprogramma van minstens twee jaar afgerond dat
      gebaseerd is op de competentienormen en onderwerpen genoemd in [artikel 7.16, tweede lid][ref1], heeft een vaartijd
      van ten minste 90 dagen opgebouwd als onderdeel van het opleidingsprogramma en is als gevolg van het voltooien van
      dat opleidingsprogramma in bezit van:

      1°. Het diploma matroos binnenvaart, zoals opgenomen in de Registratie instellingen en opleidingen met
      opleidingscodes 25610 en 25970;

      2°. Het diploma kapitein binnenvaart, schipper binnenvaart of bootman, zoals opgenomen in de Registratie
      instellingen en opleidingen onder de respectieve opleidingscodes 25612, 25972, 25611, 25971, 25635 en 25973;

      3°. Het diploma VMBO Rijn-, en binnen- en kustvaart van het Scheepvaart en Transport College te Rotterdam,
      het Maritiem College te IJmuiden, of de Maritieme Academie Harlingen, waarbij voor de met ingang van 1 juli
      2017 behaalde diploma’s de beroepsgerichte keuzevakken met de vakcodes 2105 tot en met 2108 op de bijbehorende
      cijferlijst moeten zijn vermeld en de toets matroosvaardigheden voldoende moet zijn afgesloten; dan wel

      4°. Een erkenning van beroepskwalificaties als bedoeld in de [Algemene wet erkenning EU-beroepskwalificaties][ref2];

      b. is ten minste 18 jaar oud, beschikt over een verklaring als bedoeld in [artikel 7.17][ref3] en heeft een
      vaartijd van ten minste 360 dagen opgebouwd, waarbij ook kan worden volstaan met een vaartijd van ten minste 180
      dagen indien in aanvulling daarop ook ten minste 250 dagen werkervaring als dekbemanningslid op een zeeschip zijn
      opgebouwd; of

      c. heeft een door het CBR gecertificeerd opleidingsprogramma van minstens 9 maanden afgerond dat gebaseerd is
      op de competentienormen en onderwerpen genoemd in [artikel 7.16, tweede lid][ref4], heeft een vaartijd van ten
      minste 90 dagen opgebouwd als onderdeel van het opleidingsprogramma, is als gevolg van het voltooien van het
      opleidingsprogramma in bezit van een CBR-verklaring matroos en heeft voorafgaand aan de inschrijving voor dit
      opleidingsprogramma vijf jaar werkervaring opgebouwd, ten minste 500 dagen werkervaring als lid van de dekbemanning
      op een zeeschip opgebouwd of een beroepsopleiding van ten minste drie jaar voltooid.


