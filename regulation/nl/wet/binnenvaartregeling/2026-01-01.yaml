  - number: '6.1'
    text: |-
      In dit hoofdstuk wordt verstaan onder:

        - *aanvrager:* degene die in aanmerking wenst te komen voor de afgifte van: a. een vaarbewijs als bedoeld in
      [artikel 25, eerste lid, van de wet][ref1] met inbegrip van een CCR-kwalificatiecertificaat schipper als bedoeld
      in [artikel 11.01, eerste lid, van het Rsp][ref2] of een patent als bedoeld in [artikel 11.02 van het Rsp][ref3],
      b. een dienstboekje als bedoeld in respectievelijk [artikel 5.11, eerste lid][ref4], of de [artikelen 4.01][ref5]
      en [4.02 Rsp][ref6]; c. een kwalificatiecertificaat schipper open rondvaartboot beperkt vaargebied; d. een
      kwalificatiecertificaat schipper rondvaartboot van het Amsterdamse grachtentype beperkt vaargebied als bedoeld in
      [artikel 7.6][ref7]; of e. een zeilbewijs als bedoeld in [artikel 7.9][ref8];
        - *arts:* deskundige, bedoeld in [artikel 28, eerste lid, van de wet][ref9] en
      [artikel 4.01, tweede lid, van het Rsp][ref10];
        - *scheidsrechter:* deskundige, bedoeld in [artikel 28, derde lid, van de Wet][ref11];
        - *medisch adviseur scheepvaart:* medisch adviseur scheepvaart van de Minister, of diens plaatsvervanger;
        - *geneeskundig onderzoek:* onderzoek, bedoeld in [artikel 6.4][ref12], ter verkrijging van:
      a. een vaarbewijs als bedoeld in [artikel 25, eerste lid, van de wet][ref13] of een Rijnpatent
      als bedoeld in [artikel 11.02 van het Rsp][ref14], b. een dienstboekje als bedoeld in
      respectievelijk[ artikel 5.11, eerste lid][ref15], alsmede de [artikelen 4.01][ref16] en [4.02 Rsp][ref17];
        - *gezondheidsverklaring:* verklaring, bedoeld in [artikel 26, eerste lid, van het besluit][ref18].


