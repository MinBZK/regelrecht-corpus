  - number: 7.18d
    text: |-
      De aanvrager die voor de afgifte van een kwalificatiecertificaat voor lichtmatroos in aanmerking wil komen:

      a. is ten minste 15 jaar, en in het bezit van een schriftelijk bewijs van inschrijving, afgegeven door het
      opleidingsinstituut dat de desbetreffende opleiding verzorgt, voor het door middel van schoolbezoek volgen van een
      opleiding voor matroos binnenvaart, schipper binnenvaart, kapitein binnenvaart of bootman, zoals opgenomen in de
      Registratie instellingen en opleidingen onder de respectieve opleidingscodes: 25509, 25610, 25970, 25510, 25611,
      25971, 25511, 25612, 25972, 25564, 25635 en 25973; of

      b. is ten minste 15 jaar en in het bezit van een schriftelijk bewijs van inschrijving, afgegeven door het
      opleidingsinstituut dat de opleiding verzorgt voor deelname aan het Praktijkexamen matroos binnenvaart van het CBR.
    url: https://wetten.overheid.nl/BWBR0025958/2026-01-01#Artikel7.18d
  - number: 7.18e
    text: |-
      De aanvrager die voor de afgifte van een kwalificatiecertificaat voor deksman in aanmerking wil komen is ten minste
      16 jaar oud en:

      a. heeft een door het CBR gecertificeerde basisopleiding veiligheid, genoemd in [artikel 7.16, derde lid][ref1],
      voltooid;

      b. heeft een basisopleiding veiligheid, genoemd in [artikel 7.16, derde lid][ref2], voltooid als onderdeel van een
      van de opleidingen genoemd in [artikel 7.18d, onderdeel a][ref3];

      c. heeft een bewijs van voltooiing van een basisopleiding veiligheid dat is afgegeven in een van de Rijnoeverstaten
      of België; of

      d. heeft een bekwaamheidsbewijs basisveiligheid als bedoeld in [artikel 3.5.1 van de Regeling bemanning zeeschepen]
      (onbekend).


