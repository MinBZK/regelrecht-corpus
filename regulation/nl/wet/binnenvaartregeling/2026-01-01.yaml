  - number: '4.18'
    text: |-
      Een meetbrief, afgegeven door een bureau van meting van een andere staat, aangesloten bij de Overeenkomst, wordt
      gelijkgesteld aan een meetbrief afgegeven door de minister overeenkomstig de bepalingen van dit hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0025958/2026-01-01#Artikel4.18
  - number: '4.19'
    text: |-
      1 In geval van wijziging van de naam van een binnenschip wordt op verzoek van de belanghebbende de nieuwe naam op
      de meetbrief aangetekend.

      2 De minister maakt van deze aantekening melding in de ligger.

      3 Indien het een binnenschip betreft dat in het buitenland is gemeten, geeft de minister aan de bevoegde autoriteit
      van de andere staat van deze aantekening kennis.

      4 De in het eerste lid van dit artikel bedoelde aantekening wordt door de minister geautoriseerd.
    url: https://wetten.overheid.nl/BWBR0025958/2026-01-01#Artikel4.19
  - number: '4.20'
    text: |-
      1 Onverminderd het in [artikel 4.16, eerste lid][ref1], bepaalde, kunnen veranderingen ten aanzien van het vaartuig
      anders dan bedoeld in [artikel 4.17][ref2], op de meetbrief worden aangetekend. De aantekening geschiedt op
      aanvraag van de belanghebbende door de minister.

      2 Indien het een binnenschip betreft dat in het buitenland is gemeten, is een schriftelijke machtiging van de
      bevoegde autoriteit die de meetbrief heeft afgegeven nodig voor het aanbrengen van een zodanige aantekening.

      3 Zonder de in het tweede lid bedoelde schriftelijke machtiging is een aantekening in de meetbrief ook mogelijk met
      een geldigheid van niet meer dan drie maanden.

      4 Een aantekening als bedoeld in het tweede of derde lid wordt in de daarvoor bestemde rubriek in de meetbrief
      gewaarmerkt, waarbij tevens de duur van de voorlopige geldigheid wordt vermeld.

      5 De minister geeft de bevoegde autoriteit van de andere staat van de aantekening kennis.


      [ref1]: https://wetten.overheid.nl/BWBR0025958#Artikel4.16
      [ref2]: https://wetten.overheid.nl/BWBR0025958#Artikel4.17
    url: https://wetten.overheid.nl/BWBR0025958/2026-01-01#Artikel4.20
