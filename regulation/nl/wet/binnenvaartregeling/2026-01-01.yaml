  - number: '5.12'
    text: |-
      1 Ten aanzien van het vaartijdenboek is [artikel 5.11, tweede en derde lid][ref1], alsmede de
      [artikelen 18.04][ref2] en [20.02 van het Rsp][ref3] van overeenkomstige toepassing, met dien verstande dat:

      a. als autoriteit de voorzitter van de commissie van deskundigen wordt aangewezen;

      b. onder schipper de gezagvoerder wordt verstaan; en

      c. de uitzondering voor sleep- en duwboten die slechts in havens verkeren niet van toepassing is.

      2 Wanneer bij de overdracht van een schip de overdragende partij het bij het schip behorende vaartijdenboek
      niet levert, kan dit bewijs van aangifte worden vervangen door een door de koper en de minister te ondertekenen
      verklaring.

      3 Indien het volgnummer, bedoeld in [artikel 18.04, tweede lid, van het Rsp][ref4], van het te vervangen
      vaartijdenboek onbekend is bij de Inspectie Leefomgeving en Transport wordt het nieuwe vaartijdenboek voorzien van
      het volgnummer 1.


      [ref1]: https://wetten.overheid.nl/BWBR0025958#Artikel5.11
      [ref2]: https://wetten.overheid.nl/BWBR0030215#Artikel18.04
      [ref3]: https://wetten.overheid.nl/BWBR0030215#Artikel20.02
