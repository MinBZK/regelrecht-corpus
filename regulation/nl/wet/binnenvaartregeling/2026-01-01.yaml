  - number: '1.15'
    text: |-
      Typen van radarapparatuur die voor de Rijnvaart zijn goedgekeurd met inachtneming van de resolutie van de Centrale
      Commissie voor de Rijnvaart van 23 april 1969 (protocol 1969-II-18) zijn met ingang van 1 januari 2000 niet meer
      in een schip ingebouwd. Is de goedkeuring geschied voor 1 januari 1990, dan is het gebruik van deze radarapparatuur
      tot 1 januari 2010 aan boord van een schip toegestaan indien een geldige verklaring omtrent inbouw en functioneren
      daarvan aanwezig is.
    url: https://wetten.overheid.nl/BWBR0025958/2026-01-01#Artikel1.15
  - number: '1.16'
    text: |-
      Typen van bochtaanwijzers die voor de Rijnvaart zijn goedgekeurd met inachtneming van de resolutie van de Centrale
      Commissie voor de Rijnvaart van 23 april 1969 (protocol 1969-II-18) zijn met ingang van 1 januari 2000 niet meer
      in een schip ingebouwd. Is de goedkeuring geschied voor 1 januari 1990, dan is het gebruik van deze bochtaanwijzers
      tot 1 januari 2010 aan boord van een schip toegestaan indien een geldige verklaring omtrent inbouw en functioneren
      daarvan aanwezig is.
    url: https://wetten.overheid.nl/BWBR0025958/2026-01-01#Artikel1.16
  - number: '1.17'
    text: |-
      1 De inbouw of vervanging, alsmede de reparatie en het onderhoud van radarinstallaties en bochtaanwijzers mogen
      slechts worden uitgevoerd door bedrijven, die door de bevoegde autoriteit zijn erkend.

      2 De erkenning kan aan een door de bevoegde autoriteit te bepalen termijn worden verbonden en kan door deze worden
      ingetrokken indien de keuringsvoorwaarden bedoeld in bijlage 5, onderdelen I en II, van ES-TRIN niet langer vervuld
      zijn.

      3 De bevoegde autoriteit deelt per omgaande aan de Centrale Commissie voor de Rijnvaart mee welke bedrijven zijn
      erkend.
    url: https://wetten.overheid.nl/BWBR0025958/2026-01-01#Artikel1.17
  - number: 1.17a
    text: |-
      Het Inland ECDIS-apparaat in de informatiemodus, het daarmee vergelijkbare visualiseringssysteem en de
      elektronische binnenvaartkaarten moeten aan de in [bijlage 1.10][ref1] opgenomen minimumeisen voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0025958
    url: https://wetten.overheid.nl/BWBR0025958/2026-01-01#Artikel1.17a
    references:
      - id: ref1
        bwb_id: BWBR0025958
  - number: '1.18'
    text: |-
      1 De bevoegde autoriteit in de zin van de in de [artikelen 1.6][ref1] en [1.9][ref2] bedoelde reglementen is de
      minister.

      2 In afwijking van het eerste lid is de bevoegde autoriteit:

      a. de directeur-generaal Luchtvaart en Maritieme Zaken in [artikel 2.18 van het RosR][ref3];

      b. de voorzitter van de commissie van deskundigen in de [artikelen 2.11, eerste lid][ref4],
      [2.12, tweede lid][ref5], [2.20, eerste, tweede en derde lid][ref6], en
      [2.21, eerste, tweede, derde en vierde lid van het RosR][ref7] en de artikelen 9.00, tweede lid, 9.01, vijfde lid,
      9.05, 9.06, 9.07, 9.08 en artikel 9.09, tweede lid, onderdeel b, en 25.01, tweede lid, onderdeel h, van ES-TRIN;

      c. de hoofdingenieurs-directeuren van het directoraat-generaal Rijkswaterstaat Oost-Nederland en Zuid-Holland,
      ieder voor zover het zijn ambtsgebied betreft, in de [artikel 2.11, eerste lid, van het RosR][ref8] en de artikelen
      5.03, eerste lid en 23.01 van ES-TRIN;

      d. de ambtenaren, bedoeld in [artikel 141 van het Wetboek van Strafvordering][ref9] in de
      [artikelen 2.11, eerste lid][ref10].

      3 In afwijking van het eerste lid is de bevoegde autoriteit in het [Rsp][ref11]:

      a. de inspecteur-generaal van de Inspectie Leefomgeving en Transport in de [artikelen 2.01][ref12],
      [3.03][ref13], [4.01, tweede lid][ref14], [4.02, derde lid][ref15], [5.01, derde lid][ref16], [8.01][ref17],
      [8.02, tweede, derde, vierde, vijfde, zesde en zevende lid][ref18], [8.03, eerste en derde lid][ref19],
      [18.04, eerste, tweede en vierde lid][ref20] en [20.01, tweede lid][ref21];

      b. de in artikel 10.2 aangewezen ambtenaren alsmede de ambtenaren van politie, bedoeld in
      [artikel 2, onderdeel a, van de Politiewet 2012][ref22] in [artikel 8.03, eerste lid][ref23];

      c. de voorzitter van de commissie van deskundigen in [artikel 18.04, eerste, tweede en vierde lid][ref24];

      d. de Dienst wegverkeer in bijlage 5, onderdeel V, artikel 3, punt 1, van ES-TRIN;

      e. de ambtenaren, bedoeld in [artikel 45 van de wet][ref25] in [artikel 8.01][ref26];

      f. het CBR in [artikelen 1.05, tweede en derde lid][ref27], [1.06, eerste en tweede lid][ref28], [2.01][ref29],
      [4.01, tweede lid][ref30], [4.02, derde lid][ref31], [6.01, eerste, derde, vierde en vijfde lid][ref32],
      [7.03, eerste lid][ref33], [8.01][ref34], [8.02][ref35], [8.03][ref36], [12.01, vierde lid][ref37],
      [12.02, derde lid][ref38], [12.03, derde lid][ref39], [12.04, eerste lid][ref40], [12.06][ref41],
      [12.07][ref42], [12.08][ref43], [13.02, derde en vierde lid][ref44], [13.03, vierde, vijfde en zesde lid][ref45],
      [13.04, derde lid][ref46], [13.06, tweede lid][ref47], [15.04][ref48], [15.05, eerste en derde lid][ref49],
      [15.06, tweede lid][ref50], [16.02][ref51], [16.03][ref52], [16.04][ref53], [16.05][ref54],
      [16.06, eerste en derde lid][ref55], [16.10][ref56] en [20.03, tweede en derde lid][ref57],
      [20.10, tweede lid][ref58];

      g. de SAB in [artikel 2.01][ref59].

      4 De in het eerste en derde lid bedoelde bevoegde autoriteiten voeren het [Rsp][ref60] uit overeenkomstig de
      dienstinstructies van de Centrale Commissie voor de Rijnvaart betreffende de toepassing van dat reglement.

      5 De minister maakt de in het vierde lid bedoelde dienstinstructies bekend in de Staatscourant.


