        artikel: '29'
  - number: '7.15'
    text: |-
      1 Het examen ter verkrijging van het klein vaarbewijs I heeft betrekking op de volgende onderwerpen:

      a. de wettelijke bepalingen, voor zover deze van belang zijn voor de veiligheid van de vaart op rivieren, kanalen
      en meren;

      b. de behandeling van de voortstuwingswerktuigen;

      c. de veiligheidsmaatregelen;

      d. de waterwegen, de omstandigheden van het vaarwater en elementaire meteorologie;

      e. het varen, manoeuvreren en de onder bijzondere omstandigheden te nemen maatregelen.

      2 Het examen ter verkrijging van het klein vaarbewijs II heeft betrekking op de in het eerste lid genoemde
      onderwerpen alsmede op:

      a. de wettelijke bepalingen, voor zover deze van belang zijn voor de veiligheid van de vaart op de Westerschelde,
      de Eems en de Dollard;

      b. het gebruik van nautische bescheiden;

      c. de koers- en plaatsbepaling;

      d. meteorologie.
    url: https://wetten.overheid.nl/BWBR0025958/2026-01-01#Artikel7.15
  - number: '7.16'
    text: |-
      1 Het examen ter verkrijging van het kwalificatiecertificaat voor schipper heeft betrekking op de onderwerpen en
      competentienormen, genoemd in onderdeel 2 van bijlage II en rubriek 2 van tabel B van bijlage IV van [richtlijn
      (EU) 2017/2397](32017L2397) en genoemd in onderdeel II van bijlage I van gedelegeerde [richtlijn (EU) 2020/12]
      (32020L0012) en omvat een praktijkexamen.

      2 Het examen ter verkrijging van het kwalificatiecertificaat voor stuurman, volmatroos of matroos heeft betrekking
      op de onderwerpen en competentienormen, genoemd in onderdeel 1 van bijlage II en rubriek 1 van tabel B van bijlage
      IV van [richtlijn (EU) 2017/2397](32017L2397) en genoemd in onderdeel I van bijlage I van gedelegeerde [richtlijn
      (EU) 2020/12](32020L0012).

      3 De basisopleiding veiligheid deksman is gebaseerd op de Standaarden voor de basisopleiding veiligheid voor
      deksmannen, vastgesteld door het Europees Comité voor de opstelling van standaarden voor de binnenvaart in het
      besluit CESNI 2021-I-1.

      4 Het examen ter verkrijging van een specifieke vergunning voor het varen op binnenwateren van maritieme aard
      heeft betrekking op de onderwerpen en competentienormen, genoemd in onderdeel 3.1 van bijlage II en rubriek 3.1
      van tabel B van bijlage IV van [richtlijn (EU) 2017/2397](32017L2397) en genoemd in onderdeel III van bijlage I van
      gedelegeerde [richtlijn (EU) 2020/12](32020L0012).

      5 Het examen ter verkrijging van de specifieke vergunning voor het varen op een waterweg die is ingedeeld als
      binnenwatertraject met specifieke risico’s omvat de examenonderdelen die door de EU-lidstaat die de binnenwateren
      met specifieke risico’s heeft aangewezen verplicht worden gesteld en heeft betrekking op de onderwerpen en
      competentienormen die die lidstaat heeft vastgesteld.

      6 Het examen ter verkrijging van een specifieke vergunning voor radarvaart heeft betrekking op de onderwerpen en
      competentienormen, genoemd in onderdeel 3.2 van bijlage II en rubriek 3.2 van tabel B van bijlage IV van [richtlijn
      (EU) 2017/2397](32017L2397) en omvat een praktijkexamen en genoemd in onderdeel IV van bijlage I van gedelegeerde
      [richtlijn (EU) 2020/12](32020L0012).

      7 Het examen ter verkrijging van het kwalificatiecertificaat voor deskundige voor de passagiersvaart heeft
      betrekking op de onderwerpen en competentienormen, genoemd in onderdeel 4.1 van bijlage II en rubriek 4.1 van
      tabel B van bijlage IV van [richtlijn (EU) 2017/2397](32017L2397) en genoemd in onderdeel V van bijlage I van
      gedelegeerde [richtlijn (EU) 2020/12](32020L0012) en omvat een praktijkexamen.

      8 Het examen ter verkrijging van het kwalificatiecertificaat voor deskundige op het gebied van vloeibaar aardgas
      (LNG) heeft betrekking op de onderwerpen en competentienormen, genoemd in onderdeel 4.2 van bijlage II en rubriek
      4.2 van tabel B van bijlage IV van [richtlijn (EU) 2017/2397](32017L2397) en genoemd in onderdeel VI van bijlage I
      van gedelegeerde [richtlijn (EU) 2020/12](32020L0012) en omvat een praktijkexamen.

      9 Een wijziging van bijlage II of bijlage IV van [richtlijn (EU) 2017/2397](32017L2397) of bijlage I van
      gedelegeerde [richtlijn (EU) 2020/12](32020L0012) gaat voor de toepassing van dit artikel gelden met ingang van de
      dag waarop aan de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven.
    url: https://wetten.overheid.nl/BWBR0025958/2026-01-01#Artikel7.16
  - number: 7.16a
    text: |-
      1 De praktijkexamens bedoeld in artikel 7.16 vinden plaats overeenkomstig de toepasselijke voorschriften genoemd in
      tabel A van bijlage IV van [richtlijn (EU) 2017/2397](32017L2397) en bijlage III van gedelegeerde [richtlijn (EU)
      2020/12](32020L0012).

      2 De praktijkexamens bedoeld in het eerste, zesde en achtste lid van [artikel 7.16][ref1] kunnen worden afgenomen
      met behulp van een gecertificeerde simulator.

      3 Een simulator bedoeld in het tweede lid wordt goedgekeurd voor het betreffende praktijkexamen door het CBR
      op grond van de toepasselijke voorschriften genoemd in tabel A van bijlage IV van [richtlijn (EU) 2017/2397]
      (32017L2397) en bijlage III van gedelegeerde [richtlijn (EU) 2020/12](32020L0012) of is goedgekeurd door een
      bevoegde autoriteit van een andere EU-lidstaat.


      [ref1]: https://wetten.overheid.nl/BWBR0025958#Artikel7.16
