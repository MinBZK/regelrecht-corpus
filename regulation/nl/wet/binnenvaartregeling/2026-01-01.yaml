    text: |-
      Binnenwateren zijn de wateren die in Nederland zijn gelegen binnen de langs de Nederlandse kust gaande lijn, die
      loopt van:

        - het snijpunt van de breedtecirkel 53°26'.5 N met de Duitse kust ter plaatse van Upleward,
        - vandaar naar het punt met de coördinaten 53°26'.5 N en 006°55'.9 E,
        - vandaar naar een punt gelegen 25 meter westelijk van de kop van de strekdam van Borkum,
        - vandaar via de noordelijkste punten van Rottumeroog, Rottumerplaat en de zandplaat Simonszand, naar het
      oostelijkste punt van Schiermonnikoog, en voorts langs de noordelijke kust naar het westelijkste punt van
      Schiermonnikoog,
        - vandaar naar het noordelijkste punt van de zandplaat Het Rif,
        - vandaar naar het oostelijkste punt van Ameland en voorts langs de noordelijke kust naar het westelijkste punt van
      dit eiland,
        - vandaar naar het oostelijkste punt van Terschelling en voorts langs de noordelijke kustlijn naar het westelijkste
      punt van dit eiland,
        - vandaar naar het noordelijkste punt van Vlieland en voorts langs de noordelijke kust naar het westelijkste punt
      van dit eiland,
        - vandaar naar het noordelijkste punt van Texel en voorts langs de westelijke kust tot het snijpunt van de kustlijn
      en de lijn tussen het Loodsmansduin te Texel, met de coördinaten 53°01'.3 N en 004°43'.7 E, en het punt met de
      coördinaten 52°58'.4 N en 004°39'.4 E op het eiland Noorderhaaks,
        - vandaar naar het punt met de coördinaten 52°58'.4 N en 004°39'.4 E,
        - vandaar naar de Noord-Hollandse kust ter hoogte van de vuurtoren Kijkduin bij Den Helder en voorts langs de kust
      van Noord- en Zuid-Holland, waarbinnen zijn begrepen de hoofden van IJmuiden, Scheveningen en Hoek van Holland, tot
      aan de Haringvlietdam,
        - vandaar langs de zeezijde van deze dam en de zeezijde van de buitenhaven van Stellendam, naar Goeree en voorts
      langs de westelijke kust hiervan naar de Brouwersdam,
        - vandaar langs de zeezijde van deze dam naar Schouwen en voorts langs de westelijke kust hiervan naar de
      afsluiting in de Oosterschelde,
        - vandaar langs de zeezijde van deze afsluiting, over de havenhoofden van de vluchthaven Neeltje Jans en de
      Noordland Buitenhaven (Roompotsluis), naar Noord-Beveland en voorts langs de kustlijn hiervan naar de Veersedam,
        - vandaar langs de zeezijde van deze dam naar Walcheren en voorts langs de westelijke kust hiervan naar de
      lichtopstand de Nolle, met de coördinaten 51°26'.9 N en 003°33'.1 E, bij Vlissingen,
        - vandaar naar de lichtopstand Nieuwe Sluis, met de coördinaten 51°24'.4 N en 003°31'.3 E, in Zeeuws-Vlaanderen
      en voorts langs de noordwestelijke kust hiervan over de hoofden van de haven van Cadzand-Bad naar het punt van
      grensovergang tussen Nederland en België.
    url: https://wetten.overheid.nl/BWBR0025958/2026-01-01#Artikel1.2
  - number: '1.3'
    text: |-
      De zones, bedoeld in [artikel 2, eerste lid, van de wet][ref1] zijn:

      a. de zones 2, 3 en 4 genoemd in bijlage I van richtlijn (EU) 2016/1629;

      b. de zone R, die de binnenwateren omvat, bedoeld in onderdeel a, waarvoor een certificaat wordt afgegeven
      overeenkomstig artikel 22 van de Herziene Rijnvaartakte, volgens de bewoordingen van dat artikel bij het in werking
      treden van de [wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0023009#Artikel2
