  - number: '3.1'
    text: |-
      In dit hoofdstuk en de daarbij behorende bijlagen wordt verstaan onder:

        - *Amsterdamse dekschuit:* sleepvrachtschip dat uitsluitend geschikt is om door middel van kruisdraden op korte
      afstand achter een slepend schip te worden voortbewogen, of om langszij gekoppeld meegevoerd te worden, en dat: a.
      aan de bovenzijde door een doorlopend waterdicht dek is afgesloten, b. een lengte heeft van ten hoogste 40 m, en c.
      niet is voorzien van verblijven, machinekamers of ketelruimen;
        - *niet-vrijvarende veerpont:* veerpont die tijdens de vaart door kabels, kettingen of anderszins aan een bepaalde
      vaarweg is gebonden;
        - *skûtsje:* zeilend passagiersschip: a. met een lengte van ten hoogste 22 m en een breedte van ten hoogste 4 m,
      b. dat is gebouwd voor 1950, en c. dat de kenmerken van de eerdere bestemming als vrachtschip heeft behouden en
      waarvan het laadvermogen niet meer bedroeg dan 55 ton.
    url: https://wetten.overheid.nl/BWBR0025958/2026-01-01#Artikel3.1
  - number: '3.2'
    text: |-
      1 Binnenschepen als bedoeld in [artikel 6 van het besluit][ref1] die worden gebruikt op de zones 2, 3 en 4, voldoen
      aan de technische voorschriften van ES-TRIN.

      2 Bij de toepassing van dit artikel handelt de minister overeenkomstig de Instructies voor de toepassing van ES-
      TRIN zijn vastgesteld.


