        artikel: '10'
  - number: '3.11'
    text: |-
      1 De geldigheidsduur van het Uniebinnenvaartcertificaat, het aanvullend Uniebinnenvaartcertificaat en het
      certificaat van onderzoek bedraagt voor nieuwe schepen:

      a. vijf jaar voor passagiersschepen en snelle schepen;

      b. tien jaar voor andere binnenschepen.

      2 De geldigheidsduur wordt in de in het eerste lid bedoelde certificaten aangetekend.

      3 Voor binnenschepen die reeds vóór het onderzoek in bedrijf waren, stelt minister de geldigheidsduur van het
      certificaat voor elk geval afzonderlijk vast, afhankelijk van de uitkomsten van het onderzoek, doch niet langer dan
      in het eerste lid bepaald.
    url: https://wetten.overheid.nl/BWBR0025958/2026-01-01#Artikel3.11
  - number: '3.12'
    text: |-
      De minister houdt overeenkomstig deel I, bijlage 3, onderdeel VI, van ES-TRIN een register bij van alle door hem op
      grond van deze paragraaf afgegeven certificaten van onderzoek.
    url: https://wetten.overheid.nl/BWBR0025958/2026-01-01#Artikel3.12
  - number: '3.13'
    text: |-
      1 Het certificaat van onderzoek vermeldt het uniek Europees scheepsidentificatienummer dat is toegekend door de
      bevoegde autoriteit van de lidstaat waarin de plaats van teboekstelling of de thuishaven van het binnenschip is
      gelegen.

      2 Aan binnenschepen die niet uit een der lidstaten van de Europese Unie afkomstig zijn, kent de minister het uniek
      Europees scheepsidentificatienummer toe.

      3 De eigenaar van het binnenschip brengt het in het certificaat van onderzoek vermelde scheepsidentificatienummer
      op het binnenschip aan en verwijdert dit zodra het ongeldig is geworden.

      4 Dit artikel is niet van toepassing op pleziervaartuigen.
    url: https://wetten.overheid.nl/BWBR0025958/2026-01-01#Artikel3.13
  - number: '3.14'
    text: |-
      1 Een te onderzoeken binnenschip wordt onbeladen, gereinigd en voorzien van de voorgeschreven uitrusting
      aangeboden.

      2 De commissie van deskundigen bezichtigt het binnenschip bij een eerste onderzoek op het droge. Dit kan achterwege
      blijven indien een verklaring van een erkend classificatiebureau, volgens welke de bouw voldoet aan de daardoor
      gehanteerde voorschriften, wordt overgelegd, of indien een certificaat wordt overgelegd waaruit blijkt dat de
      minister al voor andere doeleinden een bezichtiging op het droge heeft verricht. Bij periodieke onderzoeken of
      onderzoeken overeenkomstig [artikel 3.16][ref1] kan de commissie van deskundigen een bezichtiging op het droge
      verlangen.

      3 Bij het eerste onderzoek van motorschepen en samenstellen alsmede bij essentiële veranderingen in de
      voortstuwingsinstallatie of de stuurinrichting, doet de commissie van deskundigen een proefvaart plaatsvinden.

      4 De commissie van deskundigen kan, eveneens tijdens de bouw, extra bezichtigingen en proefvaarten doen
      plaatsvinden en nadere bewijzen verlangen.

      5 De eigenaar van het binnenschip verleent verdere medewerking aan het onderzoek, onder meer door de toegang te
      vergemakkelijken tot de delen van de romp en tot de installaties, die niet of moeilijk toegankelijk of zichtbaar
      zijn, door personeel beschikbaar te stellen of door proefvaarten te houden.


      [ref1]: https://wetten.overheid.nl/BWBR0025958#Artikel3.16
    url: https://wetten.overheid.nl/BWBR0025958/2026-01-01#Artikel3.14
    references:
      - id: ref1
        bwb_id: BWBR0025958
        artikel: '3.16'
        hoofdstuk: '3'
        paragraaf: '5'
  - number: '3.15'
    text: |-
      1 Voor de beoordeling van de stabiliteit van een passagiersschip, een veerboot of een zeilend passagiersschip wordt
      het schip, indien het een eerste onderzoek betreft, aan een hellingproef onderworpen.

      2 Indien de uitkomsten van de hellingproef van een zusterschip van een passagiersschip, een veerboot of een zeilend
      passagiersschip beschikbaar zijn en daaraan voldoende stabiliteitsgegevens kunnen worden ontleend, kan de minister
      toestaan dat een hellingproef achterwege blijft.

      3 Voor de beoordeling van de stabiliteit van andere schepen dan in het eerste lid genoemd, kan de minister
      bepalen dat een hellingproef wordt gehouden indien de inrichting of de bijzondere bestemming van het schip daartoe
      aanleiding geeft.

      4 De hellingproef wordt, behalve bij schepen met een lengte op de waterlijn van ten hoogste 25 meter, door of
      namens de eigenaar gehouden in aanwezigheid van de commissie van deskundigen.

      5 Bij passagiersschepen met een lengte op de waterlijn van ten hoogste 25 meter kan voldoende stabiliteit worden
      aangetoond door het uitvoeren van een stabiliteitsproef met het gewicht van de helft van het toegestane aantal
      personen, bij de ongunstigste vullingsgraad van de brandstof- en drinkwatertanks.

      6 Bij de in het vijfde lid bedoeld stabiliteitsproef wordt het gewicht van de helft van het toegestane aantal
      personen zodanig op het voor passagiers bestemde gedeelte van het dek naar de zijde van het schip verplaatst, dat
      aldaar een dichtheid van 3,75 personen per vierkante meter, overeenkomend met 285 kg per vierkante meter, wordt
      verkregen.

      7 Bij de in het zesde lid bedoelde gewichtsverplaatsing mag de slagzij na het verplaatsen niet meer dan 7 graden
      bedragen. Het resterende vrijboord en de resterende veiligheidsafstand mogen niet kleiner zijn dan respectievelijk
      0,05 maal de breedte op de waterlijn plus 0,20 meter en 0,05 maal de breedte op de waterlijn plus 0,10 meter.
    url: https://wetten.overheid.nl/BWBR0025958/2026-01-01#Artikel3.15
  - number: '3.16'
    text: |-
      1 Indien naar aanleiding van omstandigheden als in bedoeld in [artikel 15, eerste lid, van de wet][ref1] een
      onderzoek plaatsvindt als bedoeld in [dat artikel][ref2] omvat dit een onderzoek van de constructie, de werktuigen
      en uitrusting van het binnenschip, voor zover deze betrokken zijn bij de schade, de herstelling, de verbouwing, de
      wijziging of de gebreken. Tevens kan de stabiliteit worden beoordeeld.

      2 Indien het een onderzoek van een passagiersschip, een veerboot of een zeilend passagiersschip betreft kan de
      minister bepalen dat een hellingproef wordt gehouden.

      3 Indien het onderzoek andere schepen dan de in het tweede lid genoemde betreft is [artikel 3.15, derde lid][ref3],
      van overeenkomstige toepassing.

      4 Indien na een onderzoek als bedoeld in het eerste lid, het binnenschip aan de bij of krachtens
      [artikel 8 van de wet][ref4] gestelde voorschriften voldoet, geeft de minister een nieuw certificaat van onderzoek
      af of verlengt de geldigheidsduur van het certificaat.


      [ref1]: https://wetten.overheid.nl/BWBR0023009#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0023009#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0025958#Artikel3.15
      [ref4]: https://wetten.overheid.nl/BWBR0023009#Artikel8
    url: https://wetten.overheid.nl/BWBR0025958/2026-01-01#Artikel3.16
