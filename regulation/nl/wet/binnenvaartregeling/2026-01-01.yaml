  - number: '7.7'
    text: |-
      1 [Artikel 14, eerste lid, van het besluit][ref1], is niet van toepassing op gierponten, kabelponten en andere
      niet-vrijvarende veerponten op de rivieren, kanalen en meren indien de schipper in het bezit is van een klein
      vaarbewijs, en:

      a. de veerpont is uitgerust met een marifooninstallatie en de schipper in het bezit is van een
      bedieningscertificaat; of

      b. de veerpont is uitgerust met een radarinstallatie en de schipper in het bezit is van het certificaat
      Radaropleiding voor objectenpersoneel van de vakopleiding Transport en Logistiek, van de Maritieme academie, van
      het Scheepvaart- en Transportcollege STC of een getuigschrift van een andere door de Minister aangewezen of erkende
      opleiding.

      2 [Artikel 14, eerste lid, van het besluit][ref2], is niet van toepassing op schepen die in het kader van
      hulpverlening op zee of op de binnenwateren, dan wel in het kader van het oefenen voor die hulpverlening:

      a. worden bestuurd door medewerkers van een reddingmaatschappij; of

      b. dienen als sleepduwboot voor schepen met een lengte van meer dan 20 meter of schepen waarvoor het product van
      lengte, breedte en diepgang in meters ten minste 100 m3 bedraagt.

      3 [Artikel 14, eerste lid, onderdeel e, van het besluit][ref3] is niet van toepassing op het voeren van sleepboten,
      duwboten of sleepduwboten met een lengte van minder dan 20 meter of het daarmee slepen, langszij vastgemaakt
      meevoeren of duwen van een schip met een lengte van minder dan 20 meter indien de schipper in het bezit is van een
      klein vaarbewijs.


      [ref1]: https://wetten.overheid.nl/BWBR0025631#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0025631#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0025631#Artikel14
