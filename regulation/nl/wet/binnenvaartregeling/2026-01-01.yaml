      1 Voor de Rijn in Nederland met inbegrip van de Waal en de Lek voldoen de kleur, de sterkte van de lichten, alsmede
      de goedkeuring van de navigatielantaarns aan de eisen van richtlijn (EU) 2016/1629.

      2 Navigatielantaarns die zijn goedgekeurd met inachtneming van de in artikel 5, eerste lid, van het Besluit
      Rijnvaartpolitiereglement 1983 (Stb. 389), bedoelde voorschriften worden geacht te zijn goedgekeurd met
      inachtneming van de in het eerste lid van dit artikel bedoelde voorschriften.
