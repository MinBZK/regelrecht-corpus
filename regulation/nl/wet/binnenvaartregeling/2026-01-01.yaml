  - number: '3.6'
    text: |-
      1 Voor binnenschepen waarvan de kiel op 30 december 2008 of later is gelegd, verstrekt de minister het certificaat
      van onderzoek, indien hem na technisch onderzoek voor de ingebruikneming van het binnenschip is gebleken dat het
      voldoet aan de voorschriften van ES-TRIN.

      2 Voor binnenschepen waarvan de kiel voor 30 december 2008 is gelegd, wordt het certificaat van onderzoek door de
      minister afgegeven als het voldoet aan de voorschriften van ES-TRIN, met inachtneming van de voor het binnenschip
      geldende overgangsbepalingen.

      3 Bij het in het eerste en tweede lid bedoelde technisch onderzoek of bij een in opdracht van de
      eigenaar uitgevoerd technisch onderzoek wordt in voorkomend geval nagegaan of het binnenschip voldoet aan
      [artikel 3.4][ref1].

      4 Indien uit een door een erkend classificatiebureau afgegeven verklaring blijkt, dat een binnenschip geheel of ten
      dele voldoet aan de voorschriften, opgenomen in ES-TRIN of in de overige bij deze regeling behorende bijlagen, kan
      de minister van een onderzoek geheel of gedeeltelijk afzien.


      [ref1]: https://wetten.overheid.nl/BWBR0025958#Artikel3.4
