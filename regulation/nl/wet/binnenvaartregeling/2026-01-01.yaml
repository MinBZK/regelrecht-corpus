      - id: ref2
        bwb_id: BWBR0025958
  - number: '8.3'
    text: |-
      1 De Minister verstrekt een bewijs van toelating, bedoeld in
      [artikel 2, tweede lid, onderdeel b, van het besluit][ref1], indien wordt voldaan aan het bepaalde in artikel 4,
      tweede lid, van de herziene Rijnvaartakte.

      2 Het bewijs van toelating wordt vastgesteld overeenkomstig het model opgenomen in [bijlage 8.3][ref2] bij deze
      regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0025631#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0025958
