  - number: '12.5'
    text: |-
      De tot 1 juli 2009 door de Stichting Commissie Watersport Opleidingen te Nieuwegein afgegeven diploma’s CWO
      groot motorschip alsook het door Scouting Nederland afgegeven diploma Machtiging voor bootleiding (MBL) M3
      en het tot 1 januari 2020 door de Stichting VAMEX afgegeven diploma CWO groot motorschip gelden als het in
      [artikel 7.8, derde lid, onderdeel a][ref1], bedoelde door het CBR afgegeven diploma.


      [ref1]: https://wetten.overheid.nl/BWBR0025958#Artikel7.8
    url: https://wetten.overheid.nl/BWBR0025958/2026-01-01#Artikel12.5
