  - number: '7.14'
    text: |-
      In deze paragraaf wordt onder examinator verstaan de instellingen of personen bedoeld in
      [artikel 29, eerste lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0023009#Artikel29
    url: https://wetten.overheid.nl/BWBR0025958/2026-01-01#Artikel7.14
