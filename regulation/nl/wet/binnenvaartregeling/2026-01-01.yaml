  - number: '4.21'
    text: |-
      1 Indien een afschrift van de meetbrief wordt afgegeven omdat het origineel niet meer aanwezig is, bevat dit
      afschrift aan het hoofd de volgende zin: Dit afschrift treedt in plaats van het origineel, dat is verloren geraakt.

      2 De Minister kan een afschrift van de meetbrief verstrekken, indien dat moet worden gedeponeerd op een buitenlands
      hypotheekkantoor waar het schip is of zal worden ingeschreven. Dit wordt voor eensluidend afschrift ondertekend en
      bevat aan het hoofd de volgende zin: ‘Afschrift, bestemd voor nederlegging ten hypotheekkantore te .....’.

      3 De minister kan uittreksels van meetbrieven verstrekken.
    url: https://wetten.overheid.nl/BWBR0025958/2026-01-01#Artikel4.21
  - number: '4.22'
    text: |-
      De belanghebbende levert bij verloren gaan, slopen of blijvend ongeschikt worden voor de vaart van een gemeten
      binnenschip de meetbrief in bij de minister.
    url: https://wetten.overheid.nl/BWBR0025958/2026-01-01#Artikel4.22
  - number: '4.23'
    text: |-
      Binnenschepen, bestemd of gebruikt voor het vervoer van goederen, kunnen bij meting of hermeting van ijkschalen
      worden voorzien, indien de belanghebbende dit verzoekt.
    url: https://wetten.overheid.nl/BWBR0025958/2026-01-01#Artikel4.23
  - number: '4.24'
    text: |-
      1 De ijkmerken of de ijkplaten worden door de belanghebbende zodanig onderhouden, dat zij steeds duidelijk
      zichtbaar zijn. De ijkmerken worden in lichte kleur op donkere achtergrond of in donkere kleur op lichte
      achtergrond aangebracht.

      2 Zijn één of meer ijkmerken of ijkplaten verloren geraakt, versleten of onzichtbaar geworden, dan worden deze,
      mits de meetbrief nog geldig is, op verzoek van belanghebbende door de minister door nieuwe vervangen.
    url: https://wetten.overheid.nl/BWBR0025958/2026-01-01#Artikel4.24
  - number: '5.1'
    text: |-
      Behoudens [paragraaf 5][ref1] is dit hoofdstuk van toepassing op de in [artikel 1.2][ref2] bedoelde binnenwateren
      uitgezonderd de Rijn, met inbegrip van de Waal en de Lek.


      [ref1]: https://wetten.overheid.nl/BWBR0025958#Hoofdstuk5
