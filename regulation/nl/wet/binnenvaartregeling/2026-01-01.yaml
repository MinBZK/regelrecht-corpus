        hoofdstuk: '7'
        paragraaf: '1'
  - number: 12.5a
    text: |-
      1 Een bemanningslid als bedoeld in [artikel 2.9, eerste lid][ref1], dat volledig voldeed aan de eisen van ten
      minste één van de functies genoemd in de artikelen 2.9 en 2.10 op 22 februari 2022, of op een bemanningslid als
      bedoeld in [artikel 2.10, eerste lid][ref2], zoals dat artikel luidde op 31 maart 2023, dat volledig voldeed aan de
      eisen van ten minste één van de functies genoemd in de artikelen 2.9 en 2.10 op 31 maart 2023, voldoet tot en met
      17 januari 2032 aan de eisen voor die desbetreffende functie zoals die gesteld zijn in de artikelen 2.9 of 2.10 en
      in het [Reglement betreffende het scheepvaartpersoneel op de Rijn][ref3].

      2 Een bemanningslid dat op 31 maart 2023 voldeed aan de eisen van matroos bedoeld in
      [artikel 2.10, zesde lid][ref4], of lichtmatroos bedoeld in artikel 2.10, zevende lid, zoals die
      luidden op 31 maart 2023, voldoet tot en met 17 januari 2032 aan de eisen van deksman bedoeld in
      [artikel 2.9, achtste lid][ref5].

      3 Wanneer een bemanningslid dat op 31 maart 2023 volledig voldeed aan de eisen van ten minste één van
      de functies genoemd in de [artikelen 2.9][ref6] en [2.10][ref7] voor de eerste keer een dienstboekje met
      kwalificatiecertificaat bedoeld in [artikel 5.01 van het Rsp][ref8] aanvraagt kan er ongeacht de functie van dat
      bemanningslid een dienstboekje worden afgegeven voor:

      a. matroos indien er een vaartijd wordt aangetoond van 540 dagen waarvan minstens 180 dagen in de binnenvaart;

      b. volmatroos indien er een vaartijd wordt aangetoond van 900 dagen waarvan minstens 540 dagen in de binnenvaart;

      c. stuurman indien er een vaartijd wordt aangetoond van 1.080 dagen waarvan minstens 720 dagen in de binnenvaart;

      waarbij de vereiste vaartijd met ten hoogste 360 dagen kan worden verminderd met de duur van een
      opleidingsprogramma bedoeld in [artikel 7.18, zesde lid][ref9] in het geval dat opleidingsprogramma praktijkstages
      bevat.

      Het aantonen van de vaartijd bedoeld in dit artikellid kan geschieden door middel van het dienstboekje, bedoeld in
      [artikel 5.11][ref10], indien nodig aangevuld met het vaartijdenboek, bedoeld in [artikel 5.12][ref11], of andere
      stukken.

      4 Op een persoon die met uitzondering van de vaartijdeis volledig voldeed aan de eisen van ten minste één van
      de functies genoemd in de [artikelen 2.9][ref12], [2.10][ref13] of [7.18][ref14] op de dag voorafgaand aan
      de inwerkingtreding van artikel I van de Regeling gedeeltelijke implementatie richtlijn beroepskwalificaties
      binnenvaart, blijven de eisen in de artikelen 2.9, 2.10 en 7.18 zoals die luidden op de dag voorafgaand aan de
      inwerkingtreding van die regeling van toepassing.

      5 Op een persoon die volledig voldeed aan de eisen voor afgifte van een beperkt groot of een groot vaarbewijs zoals
      bepaald in [artikel 7.18][ref15], eerste lid, op de dag voorafgaand aan de inwerkingtreding van artikel I van de
      Regeling gedeeltelijke implementatie richtlijn beroepskwalificaties binnenvaart maar aan wie nog geen afgifte heeft
      plaatsgevonden, blijft artikel 7.18 zoals die luidde op de dag voorafgaand aan de inwerkingtreding van die regeling
      van toepassing.

      6 Een bemanningslid dat voldeed aan de eisen voor eerste machinist of tweede machinist bedoeld in
      [artikel 2.10][ref16], zoals die luidden op het moment voor inwerkingtreding van de wet van 7 juni 2023 tot
      wijziging van de [Binnenvaartwet][ref17] in verband met de implementatie van [Richtlijn (EU) 2017/2397](32017L2397)
      van het Europees Parlement en de Raad betreffende de erkenning van beroepskwalificaties in de binnenvaart en tot
      intrekking van de [richtlijnen 91/672/EEG](31991L0672) en [96/50/EG](31996L0050) van de Raad, voldoet aan de eisen
      voor die desbetreffende functie, bedoeld in [artikel 2.10, derde en vierde lid][ref18].

      7 Onder een activiteit die op het binnenwater aan het begin of het eind van een reis in het kader van zeevervoer
      wordt uitgevoerd, bedoeld in [artikel 42 van het besluit][ref19], wordt onder andere begrepen het verhalen van
      zeeschepen binnen een havengebied.

      8 In aanvulling op het [vijfde lid van artikel 7.8][ref20] kan bij de afgifte van een groot pleziervaartbewijs I
      tot en met 17 januari 2032 worden volstaan met een geldig groot vaarbewijs B, een geldig beperkt groot vaarbewijs
      B of een van deze documenten die ongeldig is geworden op geen andere wijze dan door het verstrijken van de
      geldigheidsduur en wanneer uit een gezondheidsverklaring van de aanvrager blijkt dat deze lichamelijk en geestelijk
      voldoende geschikt is voor het voeren van een binnenschip.

      9 In aanvulling op het [zesde lid van artikel 7.8][ref21] kan bij de afgifte van een groot pleziervaartbewijs II
      tot en met 17 januari 2032 worden volstaan met een geldig groot vaarbewijs A, een geldig beperkt groot vaarbewijs
      A, een geldig groot patent of een van deze documenten die ongeldig is geworden op geen andere wijze dan door
      het verstrijken van de geldigheidsduur en wanneer uit een gezondheidsverklaring van de aanvrager blijkt dat deze
      lichamelijk en geestelijk voldoende geschikt is voor het voeren van een binnenschip.

      10 Tot en met drie jaar na het tijdstip waarop de wet van 7 juni 2023 tot wijziging van de [Binnenvaartwet][ref22]
      in verband met de implementatie van [Richtlijn (EU) 2017/2397](32017L2397) van het Europees Parlement en de Raad
      betreffende de erkenning van beroepskwalificaties in de binnenvaart en tot intrekking van de [richtlijnen 91/672/
      EEG](31991L0672) en [96/50/EG](31996L0050) van de Raad in werking treedt is in afwijking van [artikel 7.5][ref23]
      een kwalificatiecertificaat open rondvaartboot beperkt vaargebied niet vereist, behoudens voor zover het betreft
      schepen als bedoeld in [artikel 16, eerste lid, onderdeel d, van het besluit][ref24], voor open rondvaartboten
      als bedoeld in [artikel 1.1][ref25], bestemd of gebezigd voor het bedrijfsmatig vervoer van meer dan twaalf
      personen buiten de bemanning, met een lengte gemeten op het vlak van de grootste inzinking van minder dan 20 meter,
      voor zover de schipper in het bezit is van een klein vaarbewijs of een kwalificatiecertificaat als bedoeld in
      [artikel 7.6, eerste lid, onderdeel a][ref26], en indien het schip vaart op de binnenwateren van zone 4, dan wel op
      de Beulakerwijde of de Belterwijde.

      11 In plaats van een kwalificatiecertificaat schipper rondvaartboot van het Amsterdamse grachtentype
      beperkt vaargebied bedoeld in [artikel 7.6, eerste lid, onderdeel a][ref27], kan worden volstaan met een
      vrijstellingsbewijs schipper rondvaartboot van het Amsterdamse grachtentype.

      12 Tot en met zes maanden na het tijdstip waarop de wet van 7 juni 2023 tot wijziging van de
      [Binnenvaartwet][ref28] in verband met de implementatie van [Richtlijn (EU) 2017/2397](32017L2397) van het Europees
      Parlement en de Raad betreffende de erkenning van beroepskwalificaties in de binnenvaart en tot intrekking van de
      [richtlijnen 91/672/EEG](31991L0672) en [96/50/EG](31996L0050) van de Raad in werking treedt volstaat in afwijking
      van [artikel 7.6, derde lid][ref29], het beschikken over een klein vaarbewijs om deel te kunnen nemen aan de
      praktijktoetsen bedoeld in dat artikellid.


