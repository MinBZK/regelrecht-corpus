    text: |-
      1 In afwijking van [artikel 3.2, eerste lid][ref1], bedraagt voor duwstellen met een lengte van ten hoogste 86
      meter de minimaal te behalen snelheid ten opzichte van het water ten minste:

      a. 11 km/h op zone 3-wateren;

      b. 10 km/h op zone 4-wateren, tenzij daar een maximumsnelheid van minder dan 10 km/h geldt. In dat geval stelt de
      minister voor het betreffende duwstel een andere minimaal te behalen snelheid vast.

      2 In afwijking van [artikel 3.2, eerste lid][ref2], is het toegestaan om een duwstel, met een lengte van ten
      hoogste 86 meter en van een duwsteven voorzien, op de zones drie en vier zonder hekankers te gebruiken en te
      volstaan met de in artikel 13.01, eerste lid, van ES-TRIN, bedoelde boegankers.

      3 [Artikel 3.2][ref3] is niet van toepassing op:

      a. Amsterdamse dekschuiten, mits zij voldoen aan de technische voorschriften van [bijlage 3.2][ref4];

      b. rondvaartboten van het Amsterdamse grachtentype, mits zij voldoen aan de technische voorschriften van
      [bijlage 3.3][ref5];

      c. open rondvaartboten, mits zij voldoen aan de technische voorschriften van [bijlage 3.4][ref6];

      d. skûtsjes, mits zij voldoen aan de technische voorschriften van [bijlage 3.5][ref7];

      e. veerponten, mits zij voldoen aan de technische voorschriften van [bijlage 3.6][ref8];

      f. veerboten en passagiersschepen die een openbaar vervoersdienst onderhouden tussen plaatsen gelegen aan de
      Dollard, de Eems, de Waddenzee met inbegrip van de verbindingen met de Noordzee, of de Westerschelde en de
      zeemonding daarvan, mits zij voldoen aan de technische voorschriften van [bijlage 3.7][ref9];

      g. bunkerstations, mits zij voldoen aan de technische voorschriften van [bijlage 3.8][ref10];

      h. patrouillevaartuigen, mits zij voldoen aan de technische voorschriften van [bijlage 3.9][ref11];

      i. kleine drijvende werktuigen, mits zij voldoen aan de technische voorschriften van [bijlage 3.12][ref12].


