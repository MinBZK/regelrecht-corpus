  - number: '3.10'
    text: |-
      Het voorlopig Uniebinnenvaartcertificaat bedoeld in [artikel 10 van het besluit][ref1], wordt afgegeven wanneer
      de deugdelijkheid van het binnenschip, de drijvende inrichting of het drijvende voorwerp voor de vaart voldoende
      gewaarborgd wordt geacht.


      [ref1]: https://wetten.overheid.nl/BWBR0025631#Artikel10
    url: https://wetten.overheid.nl/BWBR0025958/2026-01-01#Artikel3.10
