  - number: '6.7'
    text: |-
      De arts die na het volledige geneeskundig onderzoek van oordeel is dat de aanvrager tijdelijk ongeschikt is,
      deelt dit de aanvrager mee. De arts overhandigt de aanvrager een verklaring van tijdelijke ongeschiktheid. In
      afwijking van [artikel 6.6][ref1], eerste lid, deelt de arts de aanvrager tevens mee dat een heronderzoek kan
      worden aangevraagd bij dezelfde arts die de aanvrager tijdelijk geschikt heeft bevonden, dan wel diens opvolger of
      waarnemer, tenzij de medisch adviseur scheepvaart instemt met keuring door een andere arts.


      [ref1]: https://wetten.overheid.nl/BWBR0025958#Artikel6.6
    url: https://wetten.overheid.nl/BWBR0025958/2026-01-01#Artikel6.7
