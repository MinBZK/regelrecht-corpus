  - number: '7.25'
    text: |-
      De instantie die het klein vaarbewijs afgeeft verstrekt op aanvraag, namens de minister, aan de houder van
      onderscheidenlijk een geldig klein vaarbewijs I of II, een geldig groot pleziervaartbewijs I of II, een certificaat
      Theoretische Kustnavigatie van het Koninklijk Nederlands Watersportverbond of een diploma als bedoeld in
      [bijlage 7.2, § 3][ref1], onderscheidenlijk het:

      a. gecombineerde klein vaarbewijs I / ICC inland;

      b. gecombineerde klein vaarbewijs II / ICC inland + coastal;

      c. gecombineerde groot pleziervaartbewijs I / ICC inland;

      d. gecombineerde groot pleziervaartbewijs II / ICC inland + coastal;

      e. ICC coastal.


      [ref1]: https://wetten.overheid.nl/BWBR0025958
    url: https://wetten.overheid.nl/BWBR0025958/2026-01-01#Artikel7.25
