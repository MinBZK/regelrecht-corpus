  - number: 7.18a
    text: |-
      De aanvrager die voor de afgifte van een kwalificatiecertificaat voor stuurman in aanmerking wil komen:

      a. voldoet aan de eisen van volmatroos, heeft als volmatroos ten minste 180 dagen vaartijd opgebouwd en is
      houder van een basiscertificaat marifonie, het beperkte certificaat maritieme radiocommunicatie of het algemeen
      certificaat maritieme radiocommunicatie zoals bedoeld in de [Examenregeling frequentiegebruik 2008][ref1];

      b. heeft een goedgekeurd opleidingsprogramma van minstens drie jaar afgerond dat gebaseerd is op de
      competentienormen en onderwerpen genoemd in [artikel 7.16, tweede lid][ref2], heeft een vaartijd van ten minste
      360 dagen opgebouwd als onderdeel van het opleidingsprogramma en is houder van een basiscertificaat marifonie,
      het beperkte certificaat maritieme radiocommunicatie of het algemeen certificaat maritieme radiocommunicatie zoals
      bedoeld in de [Examenregeling frequentiegebruik 2008][ref3]; of

      c. heeft als kapitein zoals bedoeld in [artikel 1 van de Wet bemanning zeeschepen][ref4] een werkervaring
      opgebouwd van ten minste 500 dagen, beschikt over een verklaring als bedoeld in [artikel 7.17][ref5] en is
      houder van een basiscertificaat marifonie, het beperkte certificaat maritieme radiocommunicatie of het algemeen
      certificaat maritieme radiocommunicatie zoals bedoeld in de [Examenregeling frequentiegebruik 2008][ref6].


