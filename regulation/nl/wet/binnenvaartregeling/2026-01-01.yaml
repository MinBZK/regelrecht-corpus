  - number: '7.17'
    text: |-
      1 Nadat het examen ter verkrijging van een vaarbewijs, kwalificatiecertificaat of specifieke vergunning
      met gunstig gevolg is afgelegd, wordt de verklaring bedoeld in [artikel 26, eerste lid][ref1], of
      [artikel 26a, vierde lid, van de wet][ref2], afgegeven door de instantie die het examen heeft afgenomen.

      2 De verklaring vermeldt voor welk vaarbewijs, kwalificatiecertificaat of specifieke vergunning het examen is
      afgelegd.

      3 Een verklaring met betrekking tot het succesvol afleggen van een praktijkexamen op een simulator die voldoet aan
      artikel 21 van [richtlijn (EU) 2017/2397](32017L2397), afgegeven in een andere EU-lidstaat, zijn geldig in plaats
      van de vergelijkbare verklaring bedoeld in het eerste lid.


