  - number: '7.5'
    text: |-
      1 [Artikel 14, eerste lid, aanhef en onderdeel b van het besluit][ref1], is indien het schip vaart op de
      binnenwateren van zone 4, dan wel op de Beulakerwijde of de Belterwijde en behoudens schepen als bedoeld in
      [artikel 16, onderdeel d, van het besluit][ref2], niet van toepassing voor open rondvaartboten als bedoeld in
      [artikel 1.1][ref3], bestemd of gebezigd voor het bedrijfsmatig vervoer van meer dan twaalf personen buiten
      de bemanning, met een lengte gemeten op het vlak van de grootste inzinking van minder dan 20 meter, voor zover
      de schipper in het bezit is van het kwalificatiecertificaat schipper open rondvaartboot beperkt vaargebied
      overeenkomstig het model opgenomen in [bijlage 7.4][ref4].

      2 Het in het eerste lid bedoelde kwalificatiecertificaat wordt door de minister afgegeven na overlegging van:

      a. CBR diploma theorie rondvaartboot;

      b. CBR verklaring praktijkexamen schipper open rondvaartboot beperkt vaargebied;

      c. een geneeskundige verklaring als bedoeld in [artikel 28, eerste lid, van de wet][ref5], niet ouder dan drie
      maanden; en

      d. een bewijs als resultaat van de beoordeling bedoeld in [artikel 7.1, derde lid][ref6], waaruit blijkt dat de
      aanvrager ten minste 30 vaardagen heeft gemaakt op een open rondvaartboot.

      3 De praktijktoetsen ter verkrijging van de verklaring praktijkexamen, bedoeld in het tweede lid, onder b, en het
      examen ter verkrijging van het CBR diploma theorie rondvaartboot, bedoeld in het tweede lid, onderdeel a, worden
      afgenomen met inachtneming van examenreglementen en examenprogramma’s die zijn goedgekeurd door de minister.

      4 Op de aanvragen van het in het eerste lid bedoelde kwalificatiecertificaat is [artikel 1.4][ref7] van
      overeenkomstige toepassing.

      5 Op het in het eerste lid bedoelde kwalificatiecertificaat is [artikel 27, eerste lid][ref8], en
      [artikel 30 van de wet][ref9] van overeenkomstige toepassing.

      6 Met betrekking tot het aantonen van zijn lichamelijke en geestelijke geschiktheid is op het in het eerste lid
      bedoelde kwalificatiecertificaat [artikel 22 van het besluit][ref10] van overeenkomstige toepassing.

      7 Het kwalificatiecertificaat, bedoeld in het eerste lid, is aan boord van het schip aanwezig.


