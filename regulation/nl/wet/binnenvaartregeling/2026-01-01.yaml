  - number: 12.5b
    text: |-
      1 In plaats van de specifieke vergunning voor het varen met behulp van een radar, bedoeld in
      [artikel 7.11b, lid 1, onderdeel c][ref1], kan worden volstaan met een radarpatent, bedoeld in
      [artikel 20.09 van het Rsp][ref2].

      2 In plaats van de specifieke vergunning voor het varen met vloeibaar aardgas als brandstof, bedoeld in
      [artikel 7.11b, lid 1, onderdeel d][ref3], kan worden volstaan met een verklaring van deskundigheid aangaande het
      gebruik van vloeibaar aardgas (LNG) als brandstof, bedoeld in [artikel 20.10 van het Rsp][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0025958#Artikel7.11b
