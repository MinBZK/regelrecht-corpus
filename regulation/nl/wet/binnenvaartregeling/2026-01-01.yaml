  - number: '8.1'
    text: |-
      De Minister verstrekt een Rijnvaartverklaring, bedoeld in
      [artikel 2, tweede lid, onderdeel a van het besluit][ref1], indien wordt voldaan aan het bepaalde in de artikelen
      3 tot en met 5 van de bijlage bij [verordening (EEG) 2919/85](31985R2919).


      [ref1]: https://wetten.overheid.nl/BWBR0025631#Artikel2
    url: https://wetten.overheid.nl/BWBR0025958/2026-01-01#Artikel8.1
    references:
      - id: ref1
        bwb_id: BWBR0025631
        artikel: '2'
  - number: '8.2'
    text: |-
      1 De Rijnvaartverklaring wordt vastgesteld overeenkomstig het model opgenomen in [bijlage 8.1][ref1] bij deze
      regeling.

      2 De verklaring bedoeld in artikel 5, tweede lid, van de bijlage bij [verordening (EEG) 2919/85](31985R2919) wordt
      vastgesteld overeenkomstig het model opgenomen in [bijlage 8.2][ref2] bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0025958
      [ref2]: https://wetten.overheid.nl/BWBR0025958
    url: https://wetten.overheid.nl/BWBR0025958/2026-01-01#Artikel8.2
