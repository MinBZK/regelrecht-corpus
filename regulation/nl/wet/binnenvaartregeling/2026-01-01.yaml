  - number: '10.1'
    text: |-
      Als ambtenaren in de zin van [artikel 40, eerste lid, onderdeel b, van de wet][ref1] worden aangewezen de
      ambtenaren van de Inspectie Leefomgeving en Transport die belast zijn met toezicht en opsporing.


      [ref1]: https://wetten.overheid.nl/BWBR0023009#Artikel40
    url: https://wetten.overheid.nl/BWBR0025958/2026-01-01#Artikel10.1
    references:
      - id: ref1
