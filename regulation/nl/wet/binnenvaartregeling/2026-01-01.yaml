      De minister kan een vaarbewijs gelijkwaardig aan een klein vaarbewijs als bedoeld in
      [artikel 16 van het besluit][ref1] erkennen voor de vaart op rivieren, kanalen en meren of voor de vaart op alle
      binnenwateren, voor zover het bewijs naar zijn oordeel voldoende waarborg biedt voor het veilig voeren van een
      schip op de betrokken wateren.


      [ref1]: https://wetten.overheid.nl/BWBR0025631#Artikel16
