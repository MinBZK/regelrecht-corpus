      1 Passagiersschepen die in de exploitatiewijze A1 varen, zijn vrijgesteld van de ingevolge
      [artikel 5.6, vierde lid][ref1], voorgeschreven minimumbemanning, mits voldaan wordt aan de volgende voorschriften:

      a. de minimumbemanning bestaat uit:

      1°. voor de passagiersschepen uit groep 4 die ten hoogste 600 passagiers aan boord hebben: de minimumbemanning uit
      groep 3 voor de exploitatiewijze A1;

      2°. voor de passagiersschepen uit groep 3 die ten hoogste 250 passagiers aan boord hebben: de minimumbemanning uit
      groep 2 voor de exploitatiewijze A1;

      3°. voor de passagiersschepen uit groep 2 die ten hoogste 75 passagiers aan boord hebben: de minimumbemanning uit
      groep 1 voor de exploitatiewijze A1; en

      b. voor het begin van de vaart en telkens na elke onderbreking van de vaart wanneer passagiers embarkeren of
      debarkeren legt de schipper het aantal passagiers dat aan boord is schriftelijk vast.

      2 Passagiersschepen uit groep 1, met een lengte van maximaal 45 meter, die ten hoogste 40 personen aan boord
      hebben en in de exploitatiewijze A1 varen, zijn vrijgesteld van de ingevolge [artikel 5.6, vierde lid][ref2],
      voorgeschreven minimumbemanning, mits voldaan wordt aan de volgende voorschriften:

      a. de minimumbemanning bestaat uit een schipper en een lichtmatroos of een deksman van ten minste 18 jaar;

      b. het schip onderbreekt de vaart gedurende een periode van ten minste 16 uur, waarin de periode van 22.00 uur tot
      06.00 uur is gelegen: en

      c. voor het begin van de vaart en telkens na elke onderbreking van de vaart wanneer passagiers embarkeren of
      debarkeren legt de schipper het aantal passagiers dat aan boord is schriftelijk vast.

      3 Ten aanzien van de in het tweede lid bedoelde passagierschepen is in geval van vaart zonder passagiers
      [artikel 5.15, eerste lid, onderdeel a, en tweede lid][ref3], van overeenkomstige toepassing, onder voorwaarde dat
      het schip beschikt over vrij toegankelijke gangboorden die voldoen aan de in artikel 14.02, van ES-TRIN gestelde
      eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0025958#Artikel5.6
      [ref2]: https://wetten.overheid.nl/BWBR0025958#Artikel5.6
      [ref3]: https://wetten.overheid.nl/BWBR0025958#Artikel5.15
