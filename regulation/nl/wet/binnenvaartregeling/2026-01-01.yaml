        artikel: '6.6'
        hoofdstuk: '6'
  - number: '6.8'
    text: |-
      Indien nog geen heronderzoek heeft plaatsgevonden, is een geneeskundige verklaring, waarop is aangegeven dat de
      aanvrager geschikt is en die is afgegeven nadat hij door een andere arts ongeschikt is bevonden, ongeldig.
    url: https://wetten.overheid.nl/BWBR0025958/2026-01-01#Artikel6.8
  - number: '6.9'
    text: |-
      De aanvrager van een klein vaarbewijs of een groot pleziervaartbewijs die met toepassing van
      [artikel 26, eerste lid, van het besluit][ref1], een gezondheidsverklaring overlegt aan het CBR, zoals bedoeld in
      [artikel 6.10, derde lid][ref2], maakt daartoe gebruik van het door het CBR vastgesteld model.


      [ref1]: https://wetten.overheid.nl/BWBR0025631#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0025958#Artikel6.10
    url: https://wetten.overheid.nl/BWBR0025958/2026-01-01#Artikel6.9
    references:
      - id: ref1
        bwb_id: BWBR0025631
        artikel: '26'
      - id: ref2
        bwb_id: BWBR0025958
        artikel: '6.10'
        hoofdstuk: '6'
  - number: '6.10'
    text: |-
      1 Indien alle vragen van de gezondheidsverklaring met ‘nee’ zijn beantwoord, stuurt de aanvrager de ingevulde en
      ondertekende gezondheidsverklaring samen met de aanvraag voor het vaardocument naar de instantie die belast is met
      de afgifte van het vaarbewijs dat hij aanvraagt.

      2 Indien ten minste een van de vragen van de gezondheidsverklaring met ‘ja’ is beantwoord wordt deze voorzien van
      een aantekening van een arts naar eigen keuze waaruit de aard en de ernst van de afwijking blijkt.

      3 De aanvrager zendt de gezondheidsverklaring ter beoordeling aan het CBR.
    url: https://wetten.overheid.nl/BWBR0025958/2026-01-01#Artikel6.10
  - number: '6.11'
    text: |-
      1 In het geval, bedoeld in [artikel 6.10, eerste lid][ref1], verklaart de beoordelaar de aanvrager geschikt. In het
      geval, bedoeld in artikel 6.10, tweede lid, wordt de aanvrager door de beoordelaar opgeroepen voor nader onderzoek.
      In geval van twijfel kan de beoordelaar de aanvrager oproepen voor een nader onderzoek. Indien nodig kan de
      beoordelaar de aanvrager doorverwijzen voor een deelonderzoek naar een specialist.

      2 De aanvrager is geschikt als hij naar het oordeel van de beoordelaar voldoet aan de keuringseisen en
      keuringsaanwijzingen, opgenomen in [bijlage 6.1][ref2]. In dat geval verstrekt de beoordelaar de aanvrager een
      geneeskundige verklaring, die is vastgesteld volgens het model, opgenomen in [bijlage 6.2][ref3].

      3 De aanvrager is ongeschikt als hij niet voldoet aan de keuringseisen, opgenomen in [bijlage 6.1][ref4]. In het
      geval, dat de beoordelaar de aanvrager ongeschikt verklaart, zendt de beoordelaar de aanvrager een verklaring van
      medische ongeschiktheid, onder mededeling van de mogelijkheid van heronderzoek.

      4 In het geval, bedoeld in het derde lid, zendt de beoordelaar de medisch adviseur scheepvaart nog dezelfde dag de
      verklaring van medische ongeschiktheid, waarin de reden of redenen tot afkeuring zijn vermeld.

      5 De aanvrager die ongeschikt is verklaard en een heronderzoek wenst, wendt zich tot een scheidsrechter die
      niet reeds bij de beoordeling van de gezondheidsverklaring was betrokken. Ten aanzien van het heronderzoek is
      [artikel 6.4, eerste tot en met vierde lid][ref5], van overeenkomstige toepassing, met dien verstande, dat het
      heronderzoek kan bestaan uit het uitsluitend beoordelen van de ter beschikking staande gegevens.

      6 De medisch adviseur scheepvaart doet mededeling van de afkeuring aan de instanties die belast zijn met de afgifte
      van onderscheidenlijk vaarbewijzen, Rijnpatenten, zeilbewijzen, vrijstellingsbewijzen of dienstboekjes.


      [ref1]: https://wetten.overheid.nl/BWBR0025958#Artikel6.10
      [ref2]: https://wetten.overheid.nl/BWBR0025958
      [ref3]: https://wetten.overheid.nl/BWBR0025958
      [ref4]: https://wetten.overheid.nl/BWBR0025958
      [ref5]: https://wetten.overheid.nl/BWBR0025958#Artikel6.4
