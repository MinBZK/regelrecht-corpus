  - number: '7.22'
    text: |-
      1 Een aanvraag tot afgifte van een duplicaat wordt door de houder van het klein vaarbewijs ingediend bij de
      instantie die door de minister is belast met de afgifte van het klein vaarbewijs, onder vermelding van de reden.

      2 De aanvrager wiens eerder uitgereikt klein vaarbewijs verloren is geraakt of teniet is gegaan, legt hieromtrent
      bij het indienen van zijn aanvraag een schriftelijke verklaring af.

      3 Voor zover het klein vaarbewijs nog aanwezig is, wordt dit tegelijk met de aanvraag overgelegd.

      4 Indien de houder van een verloren geraakt klein vaarbewijs dit weer tot zijn beschikking heeft gekregen, levert
      hij dit klein vaarbewijs onverwijld in bij de instantie die door de minister is belast met de afgifte van het klein
      vaarbewijs.
    url: https://wetten.overheid.nl/BWBR0025958/2026-01-01#Artikel7.22
  - number: '7.23'
    text: |-
      1 Bij naamswijziging van de houder van het vaarbewijs, het kwalificatiecertificaat of de specifieke vergunning,
      en indien de geldigheidsduur van het vaarbewijs, het kwalificatiecertificaat of de specifieke vergunning
      niet langer dan een jaar verstreken is, kan onder handhaving van de oorspronkelijke geldigheidsduur een
      vaarbewijs, kwalificatiecertificaat of specifieke vergunning voorzien van de gewijzigde gegevens worden afgegeven.

      2 Bij verlies van het vaarbewijs, het kwalificatiecertificaat of de specifieke vergunning kan onder handhaving van
      de oorspronkelijke geldigheidsduur een vervangend document worden afgegeven, indien de betreffende kwalificatie
      vermeld staat in het register kwalificatiecertificaten, dienstboekjes, vaartijdenboeken en overige vaardocumenten
      bedoeld in [artikel 33a van het Binnenvaartbesluit][ref1].

      3 Een aanvraag tot afgifte van een vaarbewijs, kwalificatiecertificaat of specifieke vergunning als bedoeld
      in het eerste lid wordt door de houder van het vaarbewijs, het kwalificatiecertificaat of de specifieke
      vergunning ingediend bij de instantie die door de minister is belast met de afgifte van het vaarbewijs, het
      kwalificatiecertificaat of de specifieke vergunning, onder vermelding van de reden.

      4 Bij de aanvraag wordt het te vervangen vaarbewijs, het te vervangen kwalificatiecertificaat of de te vervangen
      specifieke vergunning indien mogelijk ingeleverd.


      [ref1]: https://wetten.overheid.nl/BWBR0025631#Artikel33a
    url: https://wetten.overheid.nl/BWBR0025958/2026-01-01#Artikel7.23
    references:
      - id: ref1
        bwb_id: BWBR0025631
        artikel: 33a
  - number: '7.24'
    text: |-
      1 De instanties die belast zijn met de afgifte van vaarbewijzen, kwalificatiecertificaten of specifieke
      vergunningen stellen de Dienst infrastructuur van de Eenheid landelijke expertise en operaties van de politie
      alsmede de dienst Zeehavenpolitie van de regionale eenheid Rotterdam onverwijld schriftelijk in kennis van:

      a. de ongeldigverklaring voor de gehele of gedeeltelijke geldigheidsduur van een
      vaarbewijs, kwalificatiecertificaat of specifieke vergunning;

      b. de ongeldigverklaring van een groot pleziervaartbewijs als bedoeld in [artikel 7.8][ref1];

      c. de ongeldigverklaring van een zeilbewijs als bedoeld in [artikel 7.9][ref2];

      d. de ongeldigverklaring van een vrijstellingsbewijs als bedoeld in [artikel 7.6][ref3].

      2 Van de in het eerste lid bedoelde in kennis stelling wordt gelijktijdig mededeling gedaan aan de houder van het
      vaarbewijs, het kwalificatiecertificaat of de specifieke vergunning.

      3 Een registratie in het register kwalificatiecertificaten, dienstboekjes, vaartijdenboeken en overige
      vaardocumenten bedoeld in [artikel 33a van het Binnenvaartbesluit][ref4] geldt als een schriftelijke in
      kennisstelling bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0025958#Artikel7.8
      [ref2]: https://wetten.overheid.nl/BWBR0025958#Artikel7.9
      [ref3]: https://wetten.overheid.nl/BWBR0025958#Artikel7.6
      [ref4]: https://wetten.overheid.nl/BWBR0025631#Artikel33a
    url: https://wetten.overheid.nl/BWBR0025958/2026-01-01#Artikel7.24
