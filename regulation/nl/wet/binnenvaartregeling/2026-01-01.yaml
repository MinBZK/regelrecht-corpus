  - number: '6.3'
    text: |-
      1 De aanvrager wendt zich voor een geneeskundig onderzoek tot een arts, niet zijnde de behandelend arts van de
      aanvrager.

      2 De arts gaat niet tot een geneeskundig onderzoek over dan nadat de aanvrager zich heeft gelegitimeerd en de
      arts heeft kunnen vaststellen dat hij gezien de eerdere uitslagen of aantekeningen gerechtigd is de keuring te
      verrichten.
    url: https://wetten.overheid.nl/BWBR0025958/2026-01-01#Artikel6.3
  - number: '6.4'
    text: |-
      1 De arts verricht het geneeskundig onderzoek op basis van de keuringseisen en keuringsaanwijzingen, opgenomen
      in [bijlage 6.1][ref1].

      2 Indien ingevolge [bijlage 6.I][ref2] een medisch rapport is voorgeschreven, dan wel bij twijfel of de aanvrager
      voldoet aan de keuringseisen, vraagt de arts de benodigde geneeskundige informatie op bij de behandelend arts.
      Bij het ontbreken van voldoende informatie verwijst de arts de aanvrager voor een deelonderzoek door naar een
      specialist.

      3 Het geneeskundig onderzoek wordt door de arts afgerond na ontvangst van de informatie van de behandelend arts of
      de uitslag van het specialistisch deelonderzoek.

      4 De arts maakt uitsluitend gebruik van het keuringsformulier en de formulieren voor de geneeskundige verklaring en
      het bericht van afkeuring die hem door de medisch adviseur scheepvaart kosteloos worden verstrekt.

      5 De arts bewaart het keuringsformulier en eventuele andere stukken betrekking hebbende op het onderzoek, gedurende
      vijftien jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0025958
      [ref2]: https://wetten.overheid.nl/BWBR0025958
    url: https://wetten.overheid.nl/BWBR0025958/2026-01-01#Artikel6.4
    references:
      - id: ref1
        bwb_id: BWBR0025958
      - id: ref2
        bwb_id: BWBR0025958
  - number: '6.5'
    text: |-
      1 De aanvrager is geschikt als hij voldoet aan de keuringseisen, opgenomen in [bijlage 6.1][ref1]. De arts vermeldt
      bij geschiktheid van de aanvrager de uitslag van het geneeskundig onderzoek op de geneeskundige verklaring, die
      is vastgesteld volgens het model, opgenomen in [bijlage 6.2][ref2] en verstrekt de geneeskundige verklaring aan
      de aanvrager.

      2 Bij tijdelijke geschiktheid van de aanvrager verstrekt de arts de aanvrager een geneeskundige verklaring van
      tijdelijke geschiktheid.

      3 In het geval, bedoeld in het tweede lid, vindt een volgende keuring plaats door dezelfde arts die de aanvrager
      tijdelijk geschikt heeft bevonden, dan wel diens opvolger of waarnemer, tenzij de medisch adviseur scheepvaart
      instemt met keuring door een andere arts.


      [ref1]: https://wetten.overheid.nl/BWBR0025958
      [ref2]: https://wetten.overheid.nl/BWBR0025958
    url: https://wetten.overheid.nl/BWBR0025958/2026-01-01#Artikel6.5
    references:
      - id: ref1
        bwb_id: BWBR0025958
      - id: ref2
        bwb_id: BWBR0025958
  - number: '6.6'
    text: |-
      1 De aanvrager is ongeschikt als hij niet voldoet aan de keuringseisen, opgenomen in [bijlage 6.1][ref1]. De arts
      die na het volledige geneeskundig onderzoek van oordeel is dat de aanvrager ongeschikt is, deelt dit de aanvrager
      mee. De arts overhandigt de aanvrager een verklaring van medische ongeschiktheid, dat is vastgesteld volgens het
      model, opgenomen in [bijlage 6.3][ref2]. De arts deelt de aanvrager tevens mee dat een heronderzoek kan worden
      aangevraagd bij een scheidsrechter.

      2 In het geval, bedoeld in het eerste lid, verzendt de arts nog dezelfde dag de verklaring van medische
      ongeschiktheid, waarin de reden of redenen tot afkeuring zijn vermeld, aan de medisch adviseur scheepvaart.
      De medisch adviseur scheepvaart doet mededeling van de afkeuring aan de instanties die belast zijn met
      onderscheidenlijk de afgifte van vaarbewijzen, Rijnpatenten, zeilbewijzen, vrijstellingsbewijzen of dienstboekjes.

      3 De aanvrager die een heronderzoek wenst, richt zich daarvoor tot een scheidsrechter onder toezending van de
      verklaring van medische ongeschiktheid.

      4 Ten aanzien van het heronderzoek zijn de [artikelen 6.3, tweede lid][ref3], en [6.4][ref4] van overeenkomstige
      toepassing, met dien verstande dat reeds door de arts in orde bevonden onderdelen van de keuring niet behoeven te
      worden herhaald, tenzij over de uitslag twijfel bestaat bij de scheidsrechter. Het heronderzoek kan bestaan uit het
      uitsluitend beoordelen van de reeds ter beschikking staande gegevens.

      5 Indien de scheidsrechter na het heronderzoek van oordeel is dat de aanvrager medisch ongeschikt is, doet de
      medisch adviseur scheepvaart na ontvangst van de verklaring van medische ongeschiktheid hiervan mededeling aan de
      instanties die belast zijn met onderscheidenlijk de afgifte van vaarbewijzen, Rijnpatenten, vrijstellingsbewijzen
      of dienstboekjes.


      [ref1]: https://wetten.overheid.nl/BWBR0025958
      [ref2]: https://wetten.overheid.nl/BWBR0025958
      [ref3]: https://wetten.overheid.nl/BWBR0025958#Artikel6.3
      [ref4]: https://wetten.overheid.nl/BWBR0025958#Artikel6.4
    url: https://wetten.overheid.nl/BWBR0025958/2026-01-01#Artikel6.6
    references:
