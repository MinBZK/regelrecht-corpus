  - number: '12.4'
    text: |-
      Ambtenaren die op het moment voor inwerkingtreding van de wet krachtens aanwijzing door de Minister bevoegd
      waren tot toezicht op de naleving of tot opsporing van het bepaalde bij of krachtens de [Binnenschepenwet][ref1],
      de [Wet vaartijden en bemanningssterkte binnenvaart][ref2], de [Wet vervoer binnenvaart][ref3] of de
      Herziene Rijnvaartakte, behouden die bevoegdheid tot 31 december 2009 of zoveel eerder als zij ingevolge
      [hoofdstuk 10][ref4] worden aangewezen onderscheidenlijk van hun bevoegdheid tot toezicht of opsporing worden
      ontheven.


      [ref1]: https://wetten.overheid.nl/BWBR0003443
      [ref2]: https://wetten.overheid.nl/BWBR0006029
      [ref3]: https://wetten.overheid.nl/BWBR0005319
      [ref4]: https://wetten.overheid.nl/BWBR0025958#Hoofdstuk10
    url: https://wetten.overheid.nl/BWBR0025958/2026-01-01#Artikel12.4
    references:
