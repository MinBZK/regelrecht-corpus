  - number: '11.1'
    text: |-
      1 De bedragen van de bestuurlijke boete op overtredingen als bedoeld in de [artikelen 5, eerste lid][ref1],
      [6, eerste lid en zesde lid][ref2], [7, eerste lid][ref3], [8, derde lid][ref4], [10, tweede lid][ref5],
      [11][ref6], [12][ref7], [13, vierde lid][ref8], [21, eerste lid][ref9], [22, negende lid][ref10],
      [23, eerste lid][ref11], [25, vierde lid en vijfde lid][ref12], [28, zevende lid][ref13], [31, vierde lid][ref14],
      [33, tweede lid][ref15], [36, vierde lid][ref16], [37, tweede lid][ref17], [43, tweede lid][ref18], en
      [46, tweede lid, van de wet][ref19] zijn opgenomen in tabel 1 in [bijlage 11.1][ref20] bij deze regeling.

      2 De bedragen van de bestuurlijke boete op overtredingen als bedoeld in de [artikelen 39c, derde lid][ref21], en
      [39e, van de wet][ref22] zijn opgenomen in tabel 2 in [bijlage 11.1][ref23] bij deze regeling.


