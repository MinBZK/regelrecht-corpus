  - number: '7.1'
    text: |-
      1 Waar in dit hoofdstuk wordt gesproken over een vereiste vaartijd dan dient het aantonen daarvan te geschieden
      door middel van het dienstboekje, bedoeld in [artikel 5.11][ref1], indien nodig aangevuld met het vaartijdenboek,
      bedoeld in [artikel 5.12][ref2], of andere stukken.

      2 In afwijking van het eerste lid kan het aantonen van vaartijd voor het verkrijgen van een kwalificatiecertificaat
