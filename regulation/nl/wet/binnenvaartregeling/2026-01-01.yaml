  - number: '7.8'
    text: |-
      1 [Artikel 14, eerste lid, onderdeel a, van het besluit][ref1] is niet van toepassing op pleziervaartuigen met een
      lengte van 25 tot 40 meter, indien de schipper in het bezit is van:

      a. een groot pleziervaartbewijs I of II, overeenkomstig het model opgenomen in [bijlage 7.4][ref2]; of

      b. een vaarbewijs als bedoeld in [bijlage 7.1][ref3], onderdelen 1.3 of 1.4, mits behaald vóór 1 juli 2011.

      2 [Artikel 14, eerste lid, onderdeel a, van het besluit][ref4] is niet van toepassing voor pleziervaartuigen met
      een lengte van ten minste 40 meter, indien de schipper in het bezit is van:

      a. een groot pleziervaartbewijs I of II, overeenkomstig het model opgenomen in [bijlage 7.4][ref5], voorzien van de
      aantekening ‘40 meter plus’; of

      b. een vaarbewijs als bedoeld in [bijlage 7.1, onderdelen 1.3 of 1.4][ref6], mits behaald vóór 1 juli 2011.

      3 Het in het eerste lid bedoelde groot pleziervaartbewijs wordt, na overlegging van een geldig klein vaarbewijs,
      door de minister afgegeven aan:

      a. degene die geslaagd is voor het examen groot motorschip van het CBR;

      b. de houder van een ander hiertoe door de minister erkend diploma;

      c. degene die aantoont dat hij bij het in werking treden van de wet eigenaar was van een pleziervaartuig met een
      lengte van 25 tot 40 meter, alsmede in het bezit was van een klein vaarbewijs, onderscheidenlijk aan zijn partner
      en gezinsleden die op het tijdstip van inwerkingtreding van de [Binnenvaartwet][ref7] in het bezit waren van een
      klein vaarbewijs; of

      d. degene die bij het in werking treden van de wet in het bezit was van een klein vaarbewijs en een verklaring kan
      tonen van de organisatie die, als eigenaar van een pleziervaartuig van 25 tot 40 meter lengte, verklaart dat hij
      bij het in werking treden van de wet mocht varen met dat vaartuig.

      4 Het in het tweede lid bedoelde groot pleziervaartbewijs wordt, na overlegging van een geldig klein vaarbewijs,
      door de minister afgegeven aan:

      a. degene die aantoont dat hij bij het in werking treden van de wet eigenaar was van een pleziervaartuig met een
      lengte van meer dan 40 meter, alsmede in het bezit was van een klein vaarbewijs, onderscheidenlijk aan zijn partner
      en gezinsleden die bij het in werking treden van de wet in het bezit waren van een klein vaarbewijs; of

      b. aan degene die bij het in werking treden van de wet in het bezit was van een klein vaarbewijs en een verklaring
      kan tonen van de organisatie die, als eigenaar van een pleziervaartuig van meer dan 40 meter lengte, verklaart dat
      hij bij het in werking treden van de wet mocht varen met dat vaartuig.

      5 In afwijking van het derde en vierde lid worden de in het eerste en tweede lid bedoelde groot
      pleziervaartbewijzen I afgegeven aan de houder van:

      a. een geldig kwalificatiecertificaat schipper;

      b. een geldig CCR-kwalificatiecertificaat schipper; of

      c. een kwalificatiecertificaat schipper of een CCR-kwalificatiecertificaat schipper dat ongeldig is geworden op
      geen andere wijze dan door het verstrijken van de geldigheidsduur en wanneer uit een gezondheidsverklaring van de
      aanvrager blijkt dat deze lichamelijk en geestelijk voldoende geschikt is voor het voeren van een binnenschip.

      6 In afwijking van het derde en vierde lid worden de in het eerste en tweede lid bedoelde groot
      pleziervaartbewijzen II afgegeven aan de houder van:

      a. een geldig kwalificatiecertificaat schipper met een specifieke vergunning voor het varen op wateren
      geclassificeerd als binnenwater van maritieme aard;

      b. een geldig CCR-kwalificatiecertificaat schipper met een specifieke vergunning voor het varen op wateren
      geclassificeerd als binnenwater van maritieme aard;

      c. een geldig zeilbewijs;

      d. een geldig klein patent; of

      e. een van de onder a tot en met d genoemde documenten die ongeldig is geworden op geen andere wijze dan door
      het verstrijken van de geldigheidsduur en wanneer uit een gezondheidsverklaring van de aanvrager blijkt dat deze
      lichamelijk en geestelijk voldoende geschikt is voor het voeren van een binnenschip.

      7 De houder van een groot pleziervaartbewijs I die tevens in het bezit is van een klein vaarbewijs II komt in
      aanmerking voor het groot pleziervaartbewijs II.

      8 De in het derde lid, onderdelen a en b, bedoelde diploma’s worden verkregen na het behalen van een door de
      minister goedgekeurd examen.

      9 Op het groot pleziervaartbewijs zijn [artikel 30 van de wet][ref8] alsmede [artikel 1.4][ref9] van
      overeenkomstige toepassing.

      10 Met betrekking tot het aantonen van zijn lichamelijke en geestelijke geschiktheid is op de houder van het groot
      pleziervaartbewijs [artikel 26 van het besluit][ref10] en de nadere regels die van toepassing zijn op het klein
      vaarbewijs van overeenkomstige toepassing.

      11 Het groot pleziervaartbewijs is tijdens de vaart aan boord van het schip aanwezig.


