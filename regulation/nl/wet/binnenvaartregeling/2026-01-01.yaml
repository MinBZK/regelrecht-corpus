    text: |-
      1 De [artikelen 14, eerste lid, onderdelen a, b, c en d, onder 1°][ref1], en [16 van het besluit][ref2], zijn
      niet van toepassing op schepen, bestemd of gebruikt voor bedrijfsmatig vervoer van personen en ingericht om
      hoofdzakelijk door middel van zeilen te worden voortbewogen, indien de schipper in het bezit is van een zeilbewijs
      overeenkomstig het model opgenomen in [bijlage 7.4][ref3] en zolang er niet wordt gevaren op de wateren genoemd in
      [artikel 2, eerste lid, van het vaststellingsbesluit Binnenvaartpolitiereglement][ref4].

      2 Van [artikel 16 van het besluit][ref5] zijn vrijgesteld de gezagvoerders van schepen, voor zover zij zijn
      voorzien van het in het eerste lid bedoelde zeilbewijs.

      3 Het zeilbewijs wordt door de minister afgegeven na overlegging van:

      a. het diploma Schipper zeilvaart van het CBR dan wel het diploma Stuurman Kleine Zeilvaart van de Enkhuizer
      zeevaartschool;

      b. een geneeskundige verklaring als bedoeld in [artikel 28, eerste lid, van de wet][ref6], niet ouder dan drie
      maanden; en

      c. een dienstboekje als bedoeld in [artikel 5.11][ref7], waaruit blijkt dat de aanvrager een vaartijd van twee jaar
      als lid van de dekbemanning aan boord van zeilschepen heeft doorlopen.

      4 Het in het derde lid, onderdeel a, bedoelde diploma wordt verkregen na het behalen van een door de minister
      goedgekeurd examen.

      5 Op de aanvraag van het zeilbewijs is [artikel 1.4][ref8] van overeenkomstige toepassing.

      6 Op het zeilbewijs zijn [artikel 27, eerste lid][ref9], en [artikel 30 van de wet][ref10] van overeenkomstige
      toepassing.

      7 Met betrekking tot het aantonen van zijn lichamelijke en geestelijke geschiktheid is op de houder van het
      zeilbewijs [artikel 22 van het besluit][ref11] van overeenkomstige toepassing.

      8 Het eerste, zesde en zevende lid zijn van overeenkomstige toepassing op zeilbewijzen afgegeven door de Stichting
      Koninklijk OnderwijsFonds voor de Scheepvaart.

      9 Het zeilbewijs is aan boord van het schip.


