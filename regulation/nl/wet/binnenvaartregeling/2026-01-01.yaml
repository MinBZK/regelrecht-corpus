  - number: '5.2'
    text: |-
      In dit hoofdstuk wordt verstaan onder:

        - *bilgeboot:* schip dat langszij andere schepen gaat in havens of gedurende de vaart, met als doel
      scheepsbedrijfsafval, als bedoeld in [artikel 15.01, tweede lid, van het Rijnvaartpolitiereglement 1995][ref1], van
      deze schepen in te nemen;
        - *bunkerschip:* schip dat langszij andere schepen gaat in havens of gedurende de vaart, met als doel deze schepen
      te bevoorraden;
        - *exploitatiewijze A1:* exploitatiewijze waarbij de vaartijd van een schip per 24 uur, blijkens de op die periode
      betrekking hebbende aantekening in het vaartijdenboek, bedoeld in [artikel 5.3, tweede lid][ref2], ten hoogste 14
      uur dan wel overeenkomstig [artikel 5.4, eerste lid][ref3], 16 uur bedraagt;
        - *exploitatiewijze A2:* exploitatiewijze waarbij de vaartijd van een schip per 24 uur, blijkens de op die periode
      betrekking hebbende aantekening in het vaartijdenboek, bedoeld in [artikel 5.3, tweede lid][ref4], ten hoogste 18
      uur bedraagt;
        - *exploitatiewijze B:* exploitatiewijze waarbij de vaartijd van een schip per 24 uur, blijkens de op die periode
      betrekking hebbende aantekening in het vaartijdenboek, bedoeld in [artikel 5.3, tweede lid][ref5], meer dan 18
      uur bedraagt;
        - *hotelschip:* passagiersschip waarop zich hutten bevinden voor overnachting van passagiers;
        - *motorschip:* schip dat is bestemd voor het vervoer van goederen en gebouwd om door middel van eigen mechanische
      voortstuwingsmiddelen zelfstandig te varen;
        - *pompoverslagboot:* schip dat langszij andere schepen of installaties gaat, met als doel droge bulkgoederen uit
      die schepen of installaties te zuigen;
        - *rusttijd:* de tijd waarin een bemanningslid geen taak verricht noch daartoe verplicht is. De bewaking en het
      toezicht op een stilliggend schip worden niet beschouwd als taak in de zin van deze definitie;
        - *sleepschip:* schip dat is bestemd voor het vervoer van goederen, gebouwd om te worden gesleept en dat: 1°. niet
      is voorzien van eigen mechanische voortstuwingsmiddelen; onderscheidenlijk 2°. is voorzien van eigen mechanische
      voortstuwingsmiddelen die slechts voor verplaatsing over kleine afstanden geschikt zijn;
        - *S1 en S2:* standaarden S1 en S2 met betrekking tot uitrustingsvoorschriften voor schepen die met een
      minimumbemanning worden geëxploiteerd als bedoeld in [19.01, eerste lid, van het Rsp][ref6];
        - *tachograaf:* een registratieapparaat ter controle van de naleving van bij of krachtens de wet gegeven
      voorschriften met betrekking tot de vaartijden van het schip, van een door de minister goedgekeurd model.


      [ref1]: https://wetten.overheid.nl/BWBR0006923#Artikel15.01
      [ref2]: https://wetten.overheid.nl/BWBR0025958#Artikel5.3
      [ref3]: https://wetten.overheid.nl/BWBR0025958#Artikel5.4
      [ref4]: https://wetten.overheid.nl/BWBR0025958#Artikel5.3
      [ref5]: https://wetten.overheid.nl/BWBR0025958#Artikel5.3
      [ref6]: https://wetten.overheid.nl/BWBR0030215#Artikel19.01
