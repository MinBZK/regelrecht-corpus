  - number: '6.2'
    text: |-
      1 Een arts is de geneeskundige die bij beschikking op grond van
      [artikel 31, eerste lid, van de Wet bemanning zeeschepen][ref1] is aangewezen of de instelling die bij beschikking
      op grond van [artikel 28, eerste lid, van de Binnenvaartwet][ref2] is aangewezen.

      2 Een scheidsrechter is de geneeskundige die bij beschikking op grond van
      [artikel 32, eerste lid, van de Wet bemanning zeeschepen][ref3] is aangewezen. De scheidsrechter is niet degene
      door wie het eerste onderzoek is verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0050681#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0023009#Artikel28
