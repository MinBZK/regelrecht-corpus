      1 Een vaarbewijs is niet vereist, behoudens voor zover het betreft schepen als bedoeld in
      [artikel 16, onderdeel d, van het besluit][ref1], voor schepen gebezigd ten behoeve van reiniging van grachten en
      soortgelijke wateren.

      2 Een vaarbewijs is niet vereist, behoudens voor zover het betreft schepen als bedoeld in
      [artikel 16, onderdelen c en d, van het besluit][ref2], voor Belgische redeboten op de Westerschelde en in de
      daarmee in open verbinding staande havens en voorhavens.

      3 Een vaarbewijs is niet vereist voor schepen als bedoeld in [artikel 16, onderdelen b en d, van het besluit][ref3],
      die deelnemen aan wedstrijden op binnenwateren die voor het openbaar scheepvaartverkeer niet toegankelijk zijn.


