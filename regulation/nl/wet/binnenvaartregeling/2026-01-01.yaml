  - number: 7.18b
    text: |-
      De aanvrager die voor de afgifte van een kwalificatiecertificaat voor volmatroos in aanmerking wil komen:

      a. voldoet aan de eisen van matroos en heeft als matroos ten minste 180 dagen vaartijd opgebouwd; of

      b. heeft een goedgekeurd opleidingsprogramma van minstens drie jaar afgerond dat gebaseerd is op de
      competentienormen en onderwerpen genoemd in [artikel 7.16, tweede lid][ref1] en heeft een vaartijd van ten minste
      270 dagen opgebouwd als onderdeel van het opleidingsprogramma.


      [ref1]: https://wetten.overheid.nl/BWBR0025958#Artikel7.16
