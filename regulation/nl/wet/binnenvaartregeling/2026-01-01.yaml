  - number: '7.6'
    text: |-
      1 [Artikel 14, eerste lid, aanhef en onderdeel b van het besluit][ref1], is niet van toepassing voor rondvaartboten
      van het Amsterdamse grachtentype, als bedoeld in [artikel 1.1][ref2] voor zover varend op de binnenwateren van zone
      4 of met toestemming van de vaarwegbeheerder op zone 3, en voor zover de schipper in het bezit is van:

      a. het kwalificatiecertificaat schipper rondvaartboot van het Amsterdamse grachtentype beperkt vaargebied
      overeenkomstig het model opgenomen in [bijlage 7.4][ref3]; en

      b. een verklaring van de vaarwegbeheerder houdende de vermelding voor welke
      wateren, behorende tot zone 3 met uitzondering van de wateren genoemd in
      [artikel 2, eerste lid van het vaststellingsbesluit Binnenvaartpolitiereglement][ref4] voor zover die behoren tot
      zone 3 en de Maas voor wat betreft de gedeelten die behoren tot zone 3, het kwalificatiecertificaat rondvaartboot
      van het Amsterdamse grachtentype geldt alsmede de door de vaarwegbeheerder opgelegde voorwaarden waaronder op deze
      wateren mag worden gevaren.

      2 Het in het eerste lid, onderdeel a, bedoelde kwalificatiecertificaat wordt door de minister afgegeven na
      overlegging van een geneeskundige verklaring als bedoeld in [artikel 28, eerste lid, van de wet][ref5], niet ouder
      dan drie maanden, en:

      a. het diploma Schipper rondvaartboot beperkt vaargebied, zoals opgenomen in de Registratie instellingen en
      opleidingen met de opleidingscodes 95050 of 25385, 23277 of 25676, en een bewijs als resultaat van de beoordeling
      bedoeld in [artikel 7.1, derde lid][ref6], waaruit blijkt dat de aanvrager een vaartijd van ten minste 180
      vaardagen heeft opgebouwd; of

      b. de CBR verklaring praktijkexamen schipper rondvaartboot Amsterdamse grachtentype beperkt vaargebied ten
      bewijze dat het Praktijkexamen schipper rondvaartboot van het Amsterdamse grachtentype beperkt vaargebied met
      goed gevolg is afgelegd en een bewijs als resultaat van de beoordeling bedoeld in [artikel 7.1, derde lid][ref7],
      waaruit blijkt dat de aanvrager ten minste 90 vaardagen heeft opgebouwd op een rondvaartboot van het Amsterdamse
      grachtentype tijdens het praktijkexamentraject.

      3 De praktijktoetsen ter verkrijging van de verklaring praktijkexamen, bedoeld in het tweede lid, onderdeel
      b, worden slechts afgenomen wanneer de kandidaat beschikt over het CBR diploma theorie rondvaartboot, bedoeld
      in [artikel 7.5, tweede lid, onderdeel a][ref8], en worden afgenomen met inachtneming van examenreglementen en
      examenprogramma’s die zijn goedgekeurd door de minister.

      4 Op de aanvragen van het in het eerste lid, onderdeel a, bedoelde kwalificatiecertificaat is [artikel 1.4][ref9]
      van overeenkomstige toepassing.

      5 Op het in het eerste lid, onderdeel a, bedoelde kwalificatiecertificaat zijn de
      [artikelen 27, eerste lid][ref10], en [30 van de wet][ref11] van overeenkomstige toepassing.

      6 Met betrekking tot het aantonen van zijn lichamelijke en geestelijke geschiktheid is op de houder van het in het
      eerste lid, onderdeel a, bedoelde kwalificatiecertificaat [artikel 22 van het besluit][ref12] van overeenkomstige
      toepassing.

      7 Het kwalificatiecertificaat en de verklaring van de vaarwegbeheerder, bedoeld in het eerste lid, zijn aan boord
      van het schip aanwezig.


