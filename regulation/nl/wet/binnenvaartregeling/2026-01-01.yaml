  - number: '9.3'
    text: |-
      De SAB is aangewezen als het centraal contactpunt, bedoeld in artikel 8.1 van bijlage I bij Gedelegeerde
      [Verordening (EU) 2020/473](32020R0473), voor het register kwalificatiecertificaten, dienstboekjes,
