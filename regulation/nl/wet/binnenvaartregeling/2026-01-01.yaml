      1 Het radarpatent, bedoeld in [artikel 20.09, eerste lid, van het Rsp][ref1] en de specifieke
      vergunningen op met behulp van radar te mogen varen, bedoeld in [artikel 13.02 van het Rsp][ref2] en
      [artikel 7.11b, eerste lid, onderdeel c][ref3], zijn gelijkwaardig aan elkaar en worden tevens tot en met
      17 januari 2032 gelijkgesteld met:

      a. het radardiploma voor de Rijn, afgegeven krachtens het Besluit reglement radarpatenten zoals dit gold tot de
      inwerkingtreding van het [Besluit Patentreglement Rijn][ref4];

      b. het radardiploma voor de Rijn, afgegeven krachtens het koninklijk besluit van 29 december 1965, houdende
      het van kracht zijn voor de Rijn in Nederland van het Reglement betreffende het verlenen van diploma’s voor het
      voeren van een vaartuig met behulp van radar op de Rijn (Stb. 660), zoals dit gold tot de inwerkingtreding van het
      [Besluit Reglement radarpatenten][ref5];

      c. het radardiploma binnenvaart, afgegeven krachtens de Regeling radardiploma binnenvaart, zoals deze gold tot de
      inwerkingtreding van de [Regeling radarpatent binnenvaart][ref6];

      d. het radardiploma Rijn- en binnenvaart, bedoeld in artikel 17, onderdeel b, van de Regeling radardiploma
      binnenvaart, zoals deze gold tot de inwerkingtreding van de [Regeling radarpatent binnenvaart][ref7];

      e. het radarbrevet, afgegeven krachtens het koninklijk besluit tot instelling van een radarbrevet en tot wijziging
      van het koninklijk besluit van 22 april 1988 betreffende het brevet van schipper ter baggervaart en van het brevet
      van stuurman voor de baggervaart van 15 oktober 1993 (Belgisch Staatsblad, 2757).

      2 In plaats van met het radarpatent, bedoeld in [artikel 20.09, eerste lid, van het Rsp][ref8] en de
      specifieke vergunningen op met behulp van radar te mogen varen, bedoeld in [artikel 13.02 van het Rsp][ref9]
      en [artikel 7.11b, eerste lid, onderdeel c][ref10], kan voor de vaart op de scheepvaartwegen, bedoeld in
      [artikel 4.06, derde en vierde lid, van het Binnenvaartpolitiereglement][ref11], tot en met 17 januari 2032 worden
      volstaan met:

      a. de stuurliedendiploma’s, afgegeven krachtens de Wet op de zeevaartdiploma’s, met uitzondering van het diploma
      stuurman kustsleepvaart en het diploma stuurman beperkte kleine handelsvaart;

      b. het bewijs van bevoegdheid van radarwaarnemer en het bewijs van bevoegdheid van radarnavigator, ter verkrijging
      van het diploma, bedoeld in onderdeel a;

      c. het bewijs van bevoegdheid, afgegeven krachtens annex II/2, II/3 en II/4 van het op 7 juli 1978 te Londen tot
      stand gekomen Verdrag inzake de normen voor zeevarenden inzake opleiding, diplomering en wachtdienst (Trb. 1981,
      144);

      d. het radardiploma ruime wateren, afgegeven door de Stichting Koninklijk OnderwijsFonds voor de Scheepvaart.


