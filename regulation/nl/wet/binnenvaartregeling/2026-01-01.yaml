    text: |-
      Schepen, bestemd of gebruikt voor het bedrijfsmatig vervoer van meer dan 12 personen buiten de bemanning en
      ingericht om hoofdzakelijk door middel van zeilen te worden voortbewogen, voor zover zij in exploitatiewijze
      A1 varen, zijn vrijgesteld van [artikel 5.4][ref1] en van de ingevolge [artikel 5.6, vierde lid][ref2], in
      [bijlage 5.2][ref3] onderscheidenlijk [bijlage 5.4][ref4] voorgeschreven minimumbemanning, mits de bemanning
      bestaat uit:

      a. een schipper, en

      b. een lichtmatroos of deksman, die ten minste 18 jaar is.


