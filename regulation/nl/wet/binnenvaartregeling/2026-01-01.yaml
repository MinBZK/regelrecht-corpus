  - number: '2.11'
    text: |-
      De bekwaamheid voor een functie aan boord kan te allen tijde worden aangetoond:

      a. door de schipper door middel van het vaarbewijs;

      b. door de overige leden van de bemanning door middel van het dienstboekje bedoeld in [artikel 5.11][ref1] waarin
      het kwalificatiecertificaat voor de betreffende functie is opgenomen;

      c. door de deskundigen voor de passagiersvaart en deskundigen op het gebied van vloeibaar aardgas door middel van
      het in [artikel 2.10a][ref2] voorgeschreven bewijs; of

      d. door de schipper aan wie een specifieke vergunning is verleend door middel van het kwalificatiecertificaat
      waar deze specifieke vergunningen op zijn aangetekend overeenkomstig [artikel 7.19, zesde lid][ref3],
      of voor de specifieke vergunning voor het varen met vloeibaar aardgas als brandstof door middel van
      het kwalificatiecertificaat voor deskundigen op het gebied van vloeibaar aardgas (LNG) als bedoeld in
      [artikel 2.10a, tweede lid][ref4].


