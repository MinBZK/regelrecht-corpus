      1 Voor de Rijn in Nederland met inbegrip van de Waal en de Lek is van kracht het [RosR ][ref1] met de daarbij
      behorende bijlagen, dat is opgenomen in [bijlage 1.1][ref2] bij deze regeling en wordt aangehaald als: Reglement
      onderzoek schepen op de Rijn.

      2 Bij de toepassing van het bepaalde in het eerste lid handelt de commissie van deskundigen, bedoeld in
      [artikel 1.19][ref3], overeenkomstig de dienstinstructies van de Centrale Commissie voor de Rijnvaart betreffende
      de toepassing van het [RosR][ref4].

      3 De minister maakt de dienstinstructies, bedoeld in het tweede lid, bekend in de Staatscourant.


