    text: |-
      In plaats van de patenten, bedoeld in [artikel 11.01, tweede lid, van het Rsp][ref1], volstaat voor de vaart op de
      Rijn benedenstrooms van het Spijksche Veer, met inbegrip van de Waal en de Lek:

      a. een klein vaarbewijs;

      b. een ingevolge [artikel 7.11][ref2] erkend bewijs van vaarbekwaamheid; of

      c. een Militair vaarbewijs, geldig voor het besturen van een klein legervaartuig op rivieren, kanalen en meren,
      afgegeven door het Genie opleidingscentrum.


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Artikel11.01
