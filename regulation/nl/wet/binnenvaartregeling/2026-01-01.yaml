  - number: '5.7'
    text: |-
      1 Op motorschepen, duwboten, duwstellen en passagiersschepen, indien zij met een minimumbemanning worden
      geëxploiteerd, is [artikel 19.01][ref1] onderscheidenlijk [artikel 19.05 van het Rsp][ref2] van overeenkomstige
      toepassing.

      2 Het voldoen of niet voldoen aan de voorschriften bedoeld in het eerste lid wordt door de minister in een
      verklaring vastgelegd.

      3 De verklaring, bedoeld in [artikel 19.01, tweede lid, van het Rsp][ref3] wordt met de in het tweede lid bedoelde
      verklaring gelijkgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Artikel19.01
      [ref2]: https://wetten.overheid.nl/BWBR0030215#Artikel19.05
      [ref3]: https://wetten.overheid.nl/BWBR0030215#Artikel19.01
