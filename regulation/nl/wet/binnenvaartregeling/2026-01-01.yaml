  - number: 7.19a
    text: |-
      1 De aanvrager die voor de afgifte van een kwalificatiecertificaat voor deskundigen voor de passagiersvaart
      in aanmerking wil komen is ten minste 18 jaar oud en heeft een door het CBR gecertificeerd opleidingsprogramma
      afgerond dat gebaseerd is op de onderwerpen en competentienormen, genoemd in [artikel 7.16, zevende lid][ref1].

      2 Het kwalificatiecertificaat voor deskundigen voor de passagiersvaart is vijf jaar geldig en kan verlengd worden
      door het tonen van een nieuwe relevante verklaring zoals bedoeld in [artikel 7.17][ref2].

      3 De aanvrager die voor de afgifte van een kwalificatiecertificaat voor deskundigen op het gebied van vloeibaar
      aardgas (LNG) in aanmerking wil komen heeft een door het CBR gecertificeerd opleidingsprogramma afgerond dat
      gebaseerd is op de onderwerpen en competentienormen, genoemd in onderdeel 4.2 van bijlage II en rubriek 4.2 van
      tabel B van bijlage IV van [richtlijn (EU) 2017/2397](32017L2397) en beschikt over een relevante verklaring,
      bedoeld in [artikel 7.17][ref3].

      4 Het kwalificatiecertificaat voor deskundigen op het gebied van vloeibaar aardgas (LNG) is vijf jaar geldig en kan
      verlengd worden door het tonen van een nieuwe relevante verklaring zoals bedoeld in [artikel 7.17][ref4] of door
      het aantonen van opgebouwde vaartijd op een schip dat vloeibaar aardgas (LNG) als brandstof gebruikt van 180 dagen
      in de afgelopen vijf jaar of 90 dagen in het afgelopen jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0025958#Artikel7.16
      [ref2]: https://wetten.overheid.nl/BWBR0025958#Artikel7.17
      [ref3]: https://wetten.overheid.nl/BWBR0025958#Artikel7.17
      [ref4]: https://wetten.overheid.nl/BWBR0025958#Artikel7.17
