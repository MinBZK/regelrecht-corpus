preamble:
  text: |-
    Gelet op de Herziene Rijnvaartakte met bijbehorende protocollen, alsmede op verordening (EEG) nr. 1017/68 van de
    Raad van de Europese Gemeenschappen van 19 juli 1968 houdende de toepassing van mededingingsregels op het gebied
    van het vervoer per spoor, over de weg en over de binnenwateren (PbEG L 175); richtlijn nr. 76/135/EEG van de
    Raad van de Europese Gemeenschappen van 20 januari 1976 inzake wederzijdse erkenning van scheepsattesten voor
    binnenschepen (PbEG L 021); verordening (EEG ) nr. 2919/85/ van de Raad van de Europese Gemeenschappen van 17
    oktober 1985 houdende vaststelling van de voorwaarden waaraan moet worden voldaan om in aanmerking te komen voor
    het regime dat door de Herziene Rijnvaartakte wordt gereserveerd voor de vaartuigen die tot de Rijnvaart behoren
    (PbEG L 280); richtlijn nr. 87/540/EEG van de Raad van de Europese Gemeenschappen van 9 november 1987 betreffende
    de toegang tot het beroep van ondernemer van nationaal en internationaal goederenvervoer over de binnenwateren en
    inzake de onderlinge erkenning van dit beroep betreffende diploma’s, certificaten en andere titels (PbEG L 322);
    verordening (EEG) nr. 3921/91 van de Raad van de Europese Gemeenschappen van 16 december 1991 tot vaststelling van
    de voorwaarden waaronder vervoersondernemers worden toegelaten tot binnenlands goederen- en personenvervoer over
    de binnenwateren in een Lid-Staat waar zij niet gevestigd zijn (PbEG L 373); richtlijn nr. 91/672/EEG van de Raad
    van de Europese Gemeenschappen van 16 december 1991 inzake wederzijdse erkenning van de nationale vaarbewijzen
    voor het besturen van schepen in het goederen- en personenvervoer over de binnenwateren (PbEG L 373); verordening
    (EEG) nr. 3912/92 van de Raad van de Europese Gemeenschappen van 17 december 1992 inzake in de Gemeenschap in het
    wegvervoer en de binnenvaart uitgevoerde controles van in een derde land ingeschreven of tot het verkeer toegelaten
    vervoermiddelen (PbEG L 395); verordening (EEG) nr. 1356/96 van de Raad van de Europese Unie van 8 juli 1996 tot
    vaststelling van gemeenschappelijke voorschriften voor het vervoer van goederen of personen over de binnenwateren,
    tussen Lid-Staten, om voor dit vervoer het vrij verrichten van diensten te verzekeren (PbEU L 175); richtlijn
    nr. 96/50/EG van de Raad van de Europese Unie van 23 juli 1996 betreffende de harmonisatie van voorwaarden voor
    de afgifte van nationale vaarbewijzen voor binnenvaartuigen welke bij het goederen- en personenvervoer in de
    Gemeenschap gebruikt worden (PbEU L 235); richtlijn nr. 2005/36/EG van het Europees Parlement en de Raad van de
    Europese Unie van 7 september 2005 betreffende de erkenning van beroepskwalificaties (PbEU L 255); verordening
    (EG) nr. 1365/2006 van het Europees Parlement en de Raad van de Europese Unie van 6 september 2006 betreffende
    de statistiek van het goederenvervoer over de binnenwateren en houdende intrekking van richtlijn nr. 80/1119/EEG
    van de Raad van de Europese Unie (PbEU L 264); richtlijn nr. 2006/87/EG van het Europees Parlement en de Raad van
    de Europese Unie van 12 december 2006 tot vaststelling van de technische voorschriften voor binnenschepen en tot
    intrekking van Richtlijn nr. 82/714/EEG van de Raad (PbEU L 389); verordening (EG) nr. 425/2007 van de Commissie
    van de Europese Gemeenschappen van 19 april 2007 tot uitvoering van verordening (EG) nr. 1365/2006 van het Europees
    Parlement en de Raad van de Europese Unie betreffende de statistiek van het goederenvervoer over de binnenwateren
    (PbEU L 103);

    alsmede gelet op de artikelen 1, eerste lid, 2, 6, tweede, derde en vijfde lid, 8, eerste en tweede lid, 9, tweede
    lid, 13, eerste lid, 14 eerste en tweede lid, 19, eerste lid, 21, tweede lid, 22, eerste en vierde lid, 24, derde
    lid, 29, tweede lid, onderdeel c, 31, eerste lid, 32, eerste en tweede lid, 33, eerste lid, 40, tweede lid, 43,
    eerste lid, en 48, vierde lid, van de Binnenvaartwet en 33, eerste en tweede lid, van de Algemene wet erkenning
    EG-beroepskwalificaties;

    alsmede gelet op de artikelen 2, tweede lid, onderdeel c, 3, eerste lid, 5, 7, onderdeel c, onder 3°, 11, eerste
    en tweede lid, 12, tweede lid, onderdeel e, 17, tweede en derde lid, 18, eerste lid, 19, 20, eerste en vijfde lid,
    onderdeel b, 23, derde lid, 24, 25, tweede lid, 26, zesde lid, 29, eerste en tweede lid, 30, tweede lid, 31, 32 en
    33, eerste lid, van het Binnenvaartbesluit;

    In overeenstemming met de colleges van gedeputeerde staten van Fryslân, Groningen en Overijssel voor artikel 10.4,
    eerste lid;

    alsmede in overeenstemming met de colleges van burgemeester en wethouders van Aalsmeer en Amsterdam voor artikel
    10.4, tweede lid;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0025958/2026-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In deze regeling wordt verstaan onder:

        - *bevoegde autoriteit:* autoriteit als bedoeld in artikel 6, derde lid, van richtlijn (EU) 2016/1629 of bedoeld
      in [artikel 1.18][ref1];
        - *besluit:* [Binnenvaartbesluit][ref2];
        - *CBR:* Centraal Bureau Rijvaardigheidsbewijzen te Rijswijk (Z-H);
        - *competentieverklaring dekbemanningslid:* door een bevoegde autoriteit afgegeven verklaring waarin wordt
      verklaard dat een matroos, volmatroos of stuurman voldoet aan de competentienormen van het operationele niveau van
      [Richtlijn 2017/2397](32017L2397);
        - *dienstboekje:* persoonlijk register waarin de gegevens met betrekking tot het arbeidsverleden van een
      bemanningslid staan genoteerd, met name de vaartijden en de gemaakte reizen;
        - *duwbak:* schip dat is bestemd voor het vervoer van goederen, geschikt om te worden geduwd en dat: 1°. niet
      is voorzien van eigen mechanische voortstuwingsmiddelen; onderscheidenlijk 2°. is voorzien van eigen mechanische
      voortstuwingsmiddelen die slechts voor verplaatsing over kleine afstanden geschikt zijn;
        - *duwstel:* hecht samenstel van schepen, waarvan ten minste één is geplaatst voor het schip met motoraandrijving
      dat dient voor het voortbewegen van het samenstel, dan wel voor de beide schepen met motoraandrijving die dienen
      voor het voortbewegen van het samenstel. Hieronder wordt ook verstaan een duwstel dat is samengesteld uit een
      duwend en een geduwd schip waarvan de koppelingen een beheerst knikken mogelijk maken;
        - *ES-QIN:* Europese standaard voor kwalificaties in de binnenvaart, editie 2019, vastgesteld door het Europees
      Comité voor de opstelling van standaarden voor de binnenvaart, ingesteld door de Centrale Commissie voor de
      Rijnvaart bij plenaire zitting in juni 2015 en raadpleegbaar op: [https://www.cesni.eu/wp-content/uploads/2020/03/
      ES-QIN_2019_nl.pdf](https://www.cesni.eu/wp-content/uploads/2020/03/ES-QIN_2019_nl.pdf);
        - *ES-TRIN:* Europese standaard tot vaststelling van de technische voorschriften voor binnenschepen, editie 2025/1,
      vastgesteld door het Europees Comité voor de opstelling van standaarden voor de binnenvaart, ingesteld door de
      Centrale Commissie voor de Rijnvaart bij plenaire zitting in juni 2015 en raadpleegbaar op: [https://www.cesni.eu/
      wp-content/uploads/2024/11/ES_TRIN_2025_signed_nl.pdf](https://www.cesni.eu/wp-content/uploads/2024/11/
      ES_TRIN_2025_signed_nl.pdf);
        - *Gedelegeerde Richtlijn (EU) 2020/12:* Gedelegeerde [Richtlijn (EU) 2020/12](32020L0012) van de Commissie van
      2 augustus 2019 tot aanvulling van [Richtlijn (EU) 2017/2397](32017L2397) van het Europees Parlement en de Raad
      wat betreft normen betreffende competenties en de overeenkomstige kennis en vaardigheden voor praktijkexamens, de
      goedkeuring van simulatoren en medische geschiktheid;
        - *Gedelegeerde Verordening (EU) 2020/473:* Gedelegeerde [Verordening (EU) 2020/473](32020R0473) van de Commissie
      van 20 januari 2020 tot aanvulling van [Richtlijn (EU) 2017/2397](32017L2397) van het Europees Parlement en de Raad
      met betrekking tot de normen voor gegevensbanken voor EU-kwalificatiecertificaten, dienstboekjes en logboeken;
        - *gekoppeld samenstel:* samenstelling van langszijde van elkaar vastgemaakte schepen, waarvan er geen is geplaatst
      vóór het schip met motoraandrijving dat dient voor het voortbewegen van het samenstel;
        - *groot konvooi:* een duwstel waarbij het product van de totale lengte en de totale breedte van het geduwde
      vaartuig 7.000 vierkante meter of meer bedraagt;
        - *groot pleziervaartbewijs I:* groot pleziervaartbewijs voor de vaart op rivieren, kanalen en meren;
        - *groot pleziervaartbewijs II:* groot pleziervaartbewijs voor de vaart op alle binnenwateren;
        - *hecht samenstel:* een duwstel of een gekoppeld samenstel;
        - *ICC:* internationaal certificaat van competentie als bedoeld in resolutie 40, nr. TRANS/SC.3/147, van de Working
      Party on Inland Transport van de Economische Commissie voor Europa van de Verenigde Naties, van 16 oktober 1998,
      overeenkomstig [bijlage 7.5][ref3] bij deze regeling;
        - *klein vaarbewijs I:* klein vaarbewijs voor de vaart op rivieren, kanalen en meren;
        - *klein vaarbewijs II:* klein vaarbewijs voor de vaart op alle binnenwateren;
        - *kwalificatiecertificaat:* door een bevoegde autoriteit afgegeven certificaat waarin wordt verklaard dat een
      dekbemanningslid aan de voorschriften van [Richtlijn 2017/2397](32017L2397) voldoet;
        - *kwalificatiecertificaat deksman:* een kwalificatiecertificaat voor dekbemanningsleden waarmee wordt aangetoond
      dat aan de competentievereisten wordt voldaan die op grond van [richtlijn 2017/2397](32017L2397) worden gesteld aan
      de deksman;
        - *kwalificatiecertificaat lichtmatroos:* een kwalificatiecertificaat voor dekbemanningsleden waarmee wordt
      aangetoond dat aan de competentievereisten wordt voldaan die op grond van [richtlijn 2017/2397](32017L2397) worden
      gesteld aan de lichtmatroos;
        - *kwalificatiecertificaat matroos:* een kwalificatiecertificaat voor dekbemanningsleden waarmee wordt aangetoond
      dat aan de competentievereisten wordt voldaan die op grond van [richtlijn 2017/2397](32017L2397) worden gesteld aan
      de matroos;
        - *kwalificatiecertificaat schipper:* door een bevoegde autoriteit afgegeven certificaat zoals bedoeld in
      [artikel 25, eerste lid, van de wet][ref4] waarin wordt verklaard dat een schipper een vaarbevoegdheid bezit en aan
      de voorschriften van [Richtlijn 2017/2397](32017L2397) wordt voldaan;
        - *kwalificatiecertificaat stuurman:* een kwalificatiecertificaat voor dekbemanningsleden waarmee wordt aangetoond
      dat aan de competentievereisten wordt voldaan die op grond van [richtlijn 2017/2397](32017L2397) worden gesteld aan
      de stuurman;
        - *kwalificatiecertificaat volmatroos:* een kwalificatiecertificaat voor dekbemanningsleden waarmee wordt
      aangetoond dat aan de competentievereisten wordt voldaan die op grond van [richtlijn 2017/2397](32017L2397) worden
      gesteld aan de volmatroos;
        - *minister:* Minister van Infrastructuur en Waterstaat;
        - *open rondvaartboot:* passagiersschip met een lengte op de waterlijn van minder dan 20 meter en dat: a. is
      ingericht en bestemd uitsluitend voor rondvaarten met een niet-onderbroken vaarduur van ten hoogste twee uren, b.
      geen gesloten opbouw heeft, c. geen doorlopend dek heeft, en d. is bestemd voor gebruik op de binnenwateren van
      zones 3 of 4;
        - *patrouillevaartuig:* schip voor zover ingezet voor de uitoefening van een publiekrechtelijke taak;
        - *richtlijn 87/540/EEG:* [richtlijn nr. 87/540/EEG](31987L0540) van de Raad van de Europese Gemeenschappen
      van 9 november 1987 betreffende de toegang tot het beroep van ondernemer van nationaal en internationaal
      goederenvervoer over de binnenwateren en inzake de onderlinge erkenning van dit beroep betreffende diploma’s,
      certificaten en andere titels (PbEG L 322);
        - *richtlijn 96/50/EG:* [richtlijn nr. 96/50/EG](31996L0050) van de Raad van de Europese Unie van 23 juli 1996
      betreffende de harmonisatie van de voorwaarden voor de afgifte van nationale vaarbewijzen voor binnenvaartuigen
      welke bij het goederen- en personenvervoer in de Gemeenschap gebruikt worden (PbEU L 235);
        - *Richtlijn 2017/2397:* [Richtlijn (EU) 2017/2397](32017L2397) van het Europees Parlement en de Raad van
      12 december 2017 betreffende de erkenning van beroepskwalificaties in de binnenvaart en tot intrekking van de
      [richtlijnen 91/672/EEG](31991L0672) en [96/50/EG](31996L0050) van de Raad (PbEU 2017, L 345);
        - *rondvaartboot van het Amsterdamse grachtentype:* passagiersschip met een lengte op de waterlijn van minder dan
      25 meter, zoals ontwikkeld voor de rondvaarten in Amsterdam, en dat: a. één laag passagiersaccommodatie heeft,
      deels verzonken tot beneden het gangboord, b. is voorzien van een grotendeels doorgaande opbouw met grote ramen,
      c. een tot beneden het gangboord verzonken open kuip kan hebben van ten hoogste 25% van de lengte op de waterlijn,
      d. een stuurstand heeft aan de voorzijde van de passagiersaccommodatie, en e. is bestemd voor gebruik op de
      binnenwateren van zones 3 of 4;
        - *RosR:* het door de Centrale Commissie voor de Rijnvaart vastgestelde Reglement onderzoek schepen op de Rijn,
      zoals opgenomen in [bijlage 1.1][ref5];
        - *Rsp:* bij resolutie van 8 december 2022 (protocol 2022-II-9) van de Centrale Commissie voor de Rijnvaart
      vastgesteld [Reglement betreffende het scheepvaartpersoneel op de Rijn][ref6];
        - *SAB:* Stichting Afvalstoffen & Vaardocumenten Binnenvaart;
        - *schipper:* dekbemanningslid dat gekwalificeerd is om een vaartuig op de binnenwateren te besturen en om aan
      boord de algemene verantwoordelijkheid te dragen, ook voor de bemanning, de passagiers en de lading;
        - *specifieke vergunning:* een door een bevoegde autoriteit afgegeven aantekening op het kwalificatiecertificaat
      schipper waarmee wordt aangegeven dat de schipper aan aanvullende voorschriften van [Richtlijn 2017/2397]
      (32017L2397) voldoet;
        - *vaarbewijs:* bewijs van vaarbevoegdheid;
        - *vaartijd:* tijd, uitgedrukt in dagen, die dekbemanningsleden aan boord hebben doorgebracht tijdens een door de
      bevoegde autoriteit gevalideerde reis met een vaartuig op binnenwateren, met inbegrip van laad- en losactiviteiten
      die actieve scheepvaartoperaties vereisen;
        - *verordening (EEG) 2919/85:* [verordening (EEG) nr. 2919/85](31985R2919) van de Raad van de Europese
      Gemeenschappen van 17 oktober 1985 houdende vaststelling van de voorwaarden waaraan moet worden voldaan om in
      aanmerking te komen voor het regime dat door de Herziene Rijnvaartakte wordt gereserveerd voor de vaartuigen die
      tot de Rijnvaart behoren (PbEG L 280);
        - *verordening (EU) 2016/1628:* [verordening (EU) 2016/1628](33528R2016) van het Europees Parlement en de
      Raad van 14 september 2016 inzake voorschriften met betrekking tot emissiegrenswaarden voor verontreinigende
      gassen en deeltjes en typegoedkeuring voor in niet voor de weg bestemde mobiele machines gemonteerde interne
      verbrandingsmotoren, tot wijziging van [Verordeningen (EU) nr. 1024/2012](32012R1024) en [(EU) nr. 167/2013]
      (32013R0167), en tot wijziging en intrekking van [Richtlijn 97/68/EG](31997L0068) (PbEU 2016, L 252).


