  - number: '5.3'
    text: |-
      1 Voor de toepassing van dit hoofdstuk wordt rekening gehouden met de rust- en vaartijden, vervuld gedurende
      een tijdvak van 48 uur, onmiddellijk voorafgaand aan het tijdstip waarop het schip de binnenwateren, bedoeld in
      [artikel 1.2][ref1] is binnengevaren.

      2 Een schip dat de in [artikel 1.2][ref2] bedoelde binnenwateren binnenvaart is voorzien van een vaartijdenboek
      als bedoeld in [artikel 18.04 van het Rsp][ref3] of een ander document, waaruit blijkt op welke wijze de rusttijden
      van elk der bemanningsleden alsmede de vaartijden van het schip gedurende de in het eerste lid bedoelde periode
      zijn vervuld.


      [ref1]: https://wetten.overheid.nl/BWBR0025958#Artikel1.2
      [ref2]: https://wetten.overheid.nl/BWBR0025958#Artikel1.2
      [ref3]: https://wetten.overheid.nl/BWBR0030215#Artikel18.04
