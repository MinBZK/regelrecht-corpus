      Van de [artikelen 5.6, vierde lid][ref1], en [5.7, eerste lid][ref2], zijn vrijgesteld schepen die:

      a. een minimumbemanning hebben van één schipper;

      b. zijn bestemd of gebruikt voor het bedrijfsmatig vervoer van meer dan 12 personen buiten de bemanning;

      c. zijn bestemd of gebruikt voor de sportvisserij en varen op, dan wel op weg zijn van of naar, de binnenwateren
