  - number: '3.7'
    text: |-
      Voor de binnenschepen, bedoeld in [artikel 6, onderdelen a tot en met d, g en j, van het besluit][ref1] wordt het
      certificaat van onderzoek afgegeven als Uniebinnenvaartcertificaat.


      [ref1]: https://wetten.overheid.nl/BWBR0025631#Artikel6
    url: https://wetten.overheid.nl/BWBR0025958/2026-01-01#Artikel3.7
    references:
      - id: ref1
        bwb_id: BWBR0025631
        artikel: '6'
  - number: '3.8'
    text: |-
      1 De aanvraag van een certificaat van onderzoek wordt ingediend door de eigenaar van het binnenschip.

      2 Bij de aanvraag worden de tekeningen van bouw en inrichting van het binnenschip alsmede, indien hiertoe naar het
      oordeel van de minister bijzondere redenen bestaan, het rekenkundig bewijs van de sterkte van de romp overgelegd.

      3 Indien het binnenschip is onderzocht door of is gebouwd onder toezicht van een op basis van
      [artikel 14 van de wet][ref1] aangewezen classificatiebureau, wordt ook de verklaring van dat bureau inzake het
      onderzoek of de bouw overgelegd.

      4 Indien ingevolge de [artikelen 3.14][ref2] of [3.15][ref3] een hellingproef is vereist, worden de uitkomsten
      van die proef overgelegd alsmede de gegevens over de stabiliteit van het binnenschip bij verschillende
      beladingstoestanden.


      [ref1]: https://wetten.overheid.nl/BWBR0023009#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0025958#Artikel3.14
      [ref3]: https://wetten.overheid.nl/BWBR0025958#Artikel3.15
