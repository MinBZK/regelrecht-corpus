  - number: '1.19'
    text: |-
      1 Er is een commissie van deskundigen.

      2 Van deze commissie maken deel uit:

      a. als deskundigen: de ambtenaren van de Inspectie Leefomgeving en Transport die zijn belast met het onderzoek van
      schepen en de afgifte van certificaten van onderzoek, alsmede de hoofdingenieur-directeur van de directie Oost-
      Nederland van het directoraat-generaal Rijkswaterstaat;

      b. als deskundige, uitsluitend belast met de afgifte van vaartijdenboeken voor de Rijnvaart en de daarbij behorende
      verklaringen: de hoofdinspecteur Toezichtseenheid Binnenvaart van de Inspectie Leefomgeving en Transport;

      c. als voorzitter: de inspecteur-generaal van de Inspectie Leefomgeving en Transport;

      d. als plaatsvervangend voorzitter: de plaatsvervangend inspecteur-generaal van de Inspectie Leefomgeving en
      Transport.

      3 Een besluit genomen door de voorzitter of een deskundige van de commissie wordt gelijkgesteld met een besluit
      genomen door de commissie van deskundigen.
    url: https://wetten.overheid.nl/BWBR0025958/2026-01-01#Artikel1.19
  - number: '1.20'
    text: |-
      1 Er is voor de duur van vijf jaar een technische commissie.

      2 Van deze commissie maken als lid deel uit:

      a. vertegenwoordigers van de classificatiebureau’s die als zodanig door de Commissie van de Europese Gemeenschappen
      of de Centrale Commissie voor de Rijnvaart zijn erkend;

      b. vertegenwoordigers van de overige keuringsinstanties die in opdracht van de minister onderzoek van schepen
      verrichten;

      c. een vertegenwoordiger van het Deelorgaan Binnenvaart van de Overlegorganen Verkeer en Waterstaat.

      3 Deze commissie staat onder voorzitterschap van de Inspecteur-Generaal van de Inspectie Leefomgeving en Transport.

      4 De werkwijze van deze Commissie is nader geregeld in een door de minister goedgekeurd reglement van orde.
    url: https://wetten.overheid.nl/BWBR0025958/2026-01-01#Artikel1.20
  - number: '1.21'
    text: |-
      Bij bedrijfsmatig vervoer van goederen en personen tussen twee punten gelegen aan de binnenwateren,
      bedoeld in artikel 4, eerste lid, van de Herziene Rijnvaartakte, bevindt de Rijnvaartverklaring, bedoeld in
      [artikel 2, eerste lid, van het besluit][ref1] of een gewaarmerkt afschrift daarvan zich aan boord van het schip
      waarvoor het is afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0025631#Artikel2
    url: https://wetten.overheid.nl/BWBR0025958/2026-01-01#Artikel1.21
    references:
      - id: ref1
        bwb_id: BWBR0025631
        artikel: '2'
  - number: '1.22'
    text: |-
      Een wijziging van richtlijn (EU) 2016/1629 gaat voor de toepassing van deze regeling gelden met ingang van de dag
      waarop aan de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven, tenzij bij ministerieel besluit dat in de
      Staatscourant wordt bekendgemaakt, een ander tijdstip wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0025958/2026-01-01#Artikel1.22
  - number: '2.1'
    text: |-
      [Artikel 6, eerste lid, van de wet][ref1] is niet van toepassing op:

      a. vervoer met binnenschepen waarvan het laadvermogen niet meer dan 200 metrieke ton bedraagt;

      b. vervoer van:

      1°. bagage van reizigers met binnenschepen die worden gebruikt voor het beroepsvervoer van personen;

      2°. goederen, behorende tot de uitrusting of inrichting van het binnenschip, waarmede zij worden vervoerd; of

      3°. aan de vervoerder toebehorende goederen, mits het totale gewicht van die goederen 25 000 kg niet te boven gaat
      en de goederen voor eigen gebruik bestemd zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0023009#Artikel6
    url: https://wetten.overheid.nl/BWBR0025958/2026-01-01#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0023009
        artikel: '6'
  - number: '2.2'
    text: |-
      De vakbekwaamheid, bedoeld in [artikel 6, eerste lid, van de wet][ref1], wordt aangetoond door middel van:

      a. de volgende diploma’s:

      1°. het vakdiploma Ondernemer in de binnenvaart van het CBR,

      2°. het diploma MBO Rijn- en Binnenvaart,

      3°. het diploma Kapitein binnenvaart niveau 3 of niveau 4, zoals opgenomen in de Registratie instellingen en
      opleidingen met de opleidingscodes 10650, 25511, 25612, 93110 of 95640;

      b. een op grond van [artikel 11, eerste lid, van de Wet vervoer binnenvaart][ref2] afgegeven vergunning voor het
      beroepsvervoer van goederen; of

      c. het bewijsstuk, bedoeld in [artikel 2.4, tweede lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0023009#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005319#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0025958#Artikel2.4
    url: https://wetten.overheid.nl/BWBR0025958/2026-01-01#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0023009
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0005319
        artikel: '11'
      - id: ref3
        bwb_id: BWBR0025958
        artikel: '2.4'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '2.3'
    text: |-
      Voor de examens ter verkrijging van een diploma als bedoeld in [artikel 2.2, onderdeel a][ref1], is een door de
      minister goedgekeurd examenreglement van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0025958#Artikel2.2
    url: https://wetten.overheid.nl/BWBR0025958/2026-01-01#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0025958
        artikel: '2.2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '2.4'
    text: |-
      1 Natuurlijke personen die bewijzen dat zij voor het tijdstip, bedoeld in artikel 5 van [Richtlijn 87/540/EEG]
      (31987L0540), in een lidstaat of een andere staat die partij is bij de Overeenkomst betreffende de Europese
      Economische Ruimte het beroep van ondernemer van nationaal of internationaal goederenvervoer over de binnenwateren
      wettelijk hebben uitgeoefend, voldoen aan de eis van vakbekwaamheid en ontvangen van de minister op aanvraag een
      desbetreffend bewijsstuk.

      2 Als bewijsstuk van vakbekwaamheid, bedoeld in het eerste lid, wordt vastgesteld het document overeenkomstig het
      model opgenomen in [bijlage 2.1][ref1] bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0025958
    url: https://wetten.overheid.nl/BWBR0025958/2026-01-01#Artikel2.4
    references:
      - id: ref1
        bwb_id: BWBR0025958
  - number: '2.5'
    text: |-
      1 Aan de eis van vakbekwaamheid als bedoeld in [artikel 6, eerste lid, van de wet][ref1], behoeft gedurende een
      jaar niet te worden voldaan door:

      a. de erfgenaam of, indien er meer erfgenamen zijn, gezamenlijke erfgenamen van de overleden houder van een bewijs
      van vakbekwaamheid;

      b. een, door of namens de houder van een bewijs van vakbekwaamheid, gemachtigde in geval van lichamelijke
      ongeschiktheid of wettelijke onbekwaamheid van de houder van een bewijs van vakbekwaamheid.

      2 De termijn, bedoeld in de aanhef van het eerste lid, gaat in op de dag van het plaatshebben van een omstandigheid
      als bedoeld in het eerste lid, onder a of b. De minister kan op aanvraag in bijzondere gevallen deze termijn met
      ten hoogste 26 weken verlengen.


      [ref1]: https://wetten.overheid.nl/BWBR0023009#Artikel6
    url: https://wetten.overheid.nl/BWBR0025958/2026-01-01#Artikel2.5
    references:
      - id: ref1
        bwb_id: BWBR0023009
        artikel: '6'
  - number: '2.6'
    text: |-
      De minister kan op aanvraag een ontheffing als bedoeld in artikel 6, vijfde lid, van de wet, verlenen aan een
      persoon die aantoonbaar beschikt over een praktijkervaring van ten minste drie jaar in het dagelijks beheer van
      de betrokken onderneming, indien sprake is van een bijzonder geval als bedoeld in artikel 4, tweede lid, van
      [richtlijn 87/540/EEG](31987L0540).
    url: https://wetten.overheid.nl/BWBR0025958/2026-01-01#Artikel2.6
  - number: '2.7'
    text: |-
      De houder van een bewijs van vakbekwaamheid draagt er zorg voor dat dit bewijs op één van de volgende wijzen kan
      worden gecontroleerd:

      a. ten kantore van de eigenaar of de exploitant van het binnenschip; of

      b. aan de hand van de gegevens uit het handelsregister bedoeld in [artikel 2 van de Handelsregisterwet 2007][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0021777#Artikel2
    url: https://wetten.overheid.nl/BWBR0025958/2026-01-01#Artikel2.7
    references:
      - id: ref1
        bwb_id: BWBR0021777
        artikel: '2'
  - number: '2.8'
    text: |-
      Een wijziging van [richtlijn 87/540/EEG](31987L0540) gaat voor de toepassing van de [artikelen 2.4][ref1] en
      [2.6][ref2] gelden met ingang van de dag waarop aan de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven,
      tenzij bij ministerieel besluit dat in de Staatscourant wordt bekendgemaakt, een ander tijdstip wordt vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0025958#Artikel2.4
      [ref2]: https://wetten.overheid.nl/BWBR0025958#Artikel2.4
