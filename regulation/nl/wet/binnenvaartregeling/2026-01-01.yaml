  - number: '7.20'
    text: |-
      1 De examinator biedt ten minste eenmaal per jaar de mogelijkheid examens af te leggen. Hij maakt tijdig bekend
      voor welk tijdstip en bij wie aanmelding voor een examen dient te geschieden. Hij vermeldt tevens welke vergoeding
      voor het afleggen van het examen verschuldigd is, alsmede de wijze van betaling.

      2 De examinator zorgt dat de examens worden afgenomen in daartoe geschikte locaties. Hij zorgt voor toezicht en een
      goede gang van zaken bij het examen. Onder meer worden maatregelen getroffen om bedrog te voorkomen.

      3 Indien zich tijdens het examen onregelmatigheden hebben voorgedaan stelt de examinator zo spoedig mogelijk een
      verslag op omtrent het voorgevallene.

      4 De examinator bewaart het verslag en de examenbescheiden gedurende een jaar na afloop van het examen.
    url: https://wetten.overheid.nl/BWBR0025958/2026-01-01#Artikel7.20
  - number: '7.21'
    text: |-
      1 De examens, bedoeld in de [artikelen 7.15][ref1] en [7.16][ref2] en het examen ter verkrijging van een verklaring
      praktijkexamen machinist worden afgenomen met inachtneming van een examenreglement en een examenprogramma die zijn
      goedgekeurd door de minister.

      2 De minister keurt het examenreglement en het examenprogramma slechts goed indien deze naar zijn oordeel voldoende
      waarborgen bevatten dat de vereiste kennis en bekwaamheid van de kandidaat naar behoren worden onderzocht.


      [ref1]: https://wetten.overheid.nl/BWBR0025958#Artikel7.15
      [ref2]: https://wetten.overheid.nl/BWBR0025958#Artikel7.16
