  - number: '1.4'
    text: |-
      Onverminderd het bepaalde in het [Rsp][ref1] ten aanzien van het aanvragen van Rijnpatenten,
      kwalificatiecertificaten en specifieke vergunningen wordt voor het aanvragen van een krachtens de [wet][ref2]
      vereist document de wijze van aanvragen toegepast die de afgevende instantie voorschrijft.


      [ref1]: https://wetten.overheid.nl/BWBR0030215
      [ref2]: https://wetten.overheid.nl/BWBR0023009
