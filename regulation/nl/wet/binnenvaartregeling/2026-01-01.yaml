  - number: '5.6'
    text: |-
      1 De minimumbemanning van de navolgende categorieën van schepen wordt vastgesteld overeenkomstig
      [artikel 19.02 van het Rsp][ref1], met dien verstande dat de stuurman in voetnoot 3 de bekwaamheid van schipper
      bezit bedoeld in [artikel 2.9, tweede lid][ref2]:

      a. motorschepen;

      b. duwboten;

      c. passagiersschepen, niet zijnde stoomschepen, die zonder passagiers aan boord varen;

      d. drijvende werktuigen die zelfvarend zijn tijdens transport;

      e. bunkerschepen;

      f. bilgeboten;

      g. pompoverslagboten.

      2 In afwijking van het eerste lid mag de minimumbemanning van bunkerschepen, bilgeboten en pompoverslagboten die
      volgens exploitatiewijze A2 varen worden vervangen door de bemanning die is voorgeschreven voor exploitatiewijze
      A1, mits voldaan wordt aan de volgende voorschriften voor:

      a. de rusttijd van een bemanningslid bedraagt ten minste 12 uur, waarvan ten minste 6 uur ononderbroken in elke
      periode van 24 uur, te rekenen vanaf het einde van de voorafgaande ononderbroken rusttijd van 6 uur. De volgende
      periode dient uiterlijk om 00.00 uur aan te vangen;

      b. de resterende rusttijd wordt opgenomen in ononderbroken blokken van tenminste 1 uur;

      c. de rusttijd is buiten de vaartijd gelegen;

      d. het schip is uitgerust met een goed werkende tachograaf die voortdurend in werking is gesteld.

      3 Voor bunkerschepen, bilgeboten en pompoverslagboten met een lengte van minder dan 35 meter die zijn ingezet
      op Nederlandse binnenwateren met uitzondering van de Westerschelde, geldt tevens dat de bemanning die is
      voorgeschreven voor exploitatiewijze A1 kan worden vervangen door:

      a. hetzij een schipper mits wordt voldaan aan de volgende voorschriften:

      1°. de maximale vaartijd van het schip bedraagt 12 uur per dag en 50 uur per week;

      2°. het schip is uitgerust met een goed werkende tachograaf die voortdurend in werking is gesteld;

      3°. het vervoer van gevaarlijke stoffen, waarvoor op grond van [artikel 3.14 van het BPR][ref3] en [RPR][ref4] een
      teken moet worden gevoerd is niet toegestaan;

      4°. het bepaalde in [artikel 6.30][ref5] en [6.32 van het Binnenvaartpolitiereglement][ref6] respectievelijk het
      [Rijnvaartpolitiereglement][ref7] blijft onverkort van kracht;

      5°. De afstand tot de plaats van waaruit bunkeractiviteiten wordt bedreven bedraagt niet meer dan 30 km, gemeten
      over de vaarweg. De plaats van waaruit de bunkeractiviteiten wordt bedreven staat vermeld op het certificaat van
      onderzoek.

      b. hetzij een schipper en een lichtmatroos mits de voorschriften, bedoeld in onderdeel a, onder ten derde, in acht
      worden genomen.

      4 De minimumbemanning van hechte samenstellen, schepen voor dagtochten, stoomschepen voor dagtochten, hotelschepen,
      veerboten en sleepschepen wordt onderscheidenlijk vastgesteld overeenkomstig de bij deze regeling behorende
      [bijlagen 5.1 tot en met 5.6][ref8].

      5 De minimumbemanning van sleepboten en sleepboten die havendiensten verrichten wordt vastgesteld overeenkomstig de
      bij deze regeling behorende [bijlage 5.7][ref9].

      6 De minimumbemanning van snelle veerponten wordt vastgesteld overeenkomstig de bij deze regeling behorende
      [bijlage 5.8][ref10]. De schipper is in het bezit van een specifieke vergunning voor het varen met behulp van
      radar, als bedoeld in [artikel 7.11b, eerste lid, onderdeel c][ref11].

      7 In afwijking van de krachtens dit artikel gestelde minimumbemanning wordt aan de voorgeschreven minimumbemanning
      voor een bepaalde exploitatiewijze en uitrustingsstandaard op een bepaald schip ook volstaan met de
      minimumbemanning die is voorgeschreven op hetzelfde schip voor een exploitatiewijze met een langere vaartijd of
      voor een hogere uitrustingsstandaard.


