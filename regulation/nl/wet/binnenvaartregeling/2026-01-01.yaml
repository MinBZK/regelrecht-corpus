  - number: '13.1'
    text: |-
      Deze regeling treedt gelijktijdig in werking met de [Binnenvaartwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0023009
    url: https://wetten.overheid.nl/BWBR0025958/2026-01-01#Artikel13.1
    references:
      - id: ref1
        bwb_id: BWBR0023009
  - number: '13.2'
    text: 'Deze regeling wordt aangehaald als: Binnenvaartregeling.'
    url: https://wetten.overheid.nl/BWBR0025958/2026-01-01#Artikel13.2
  - number: B1.4:1
    text: |-
      1. De Dienst Wegverkeer beslist op een verzoek om typegoedkeuring van een tachograaf.

      2. De Dienst Wegverkeer brengt de goedgekeurde typen tachografen onmiddellijk ter kennis van het secretariaat van
      de Centrale Commissie voor de Rijnvaart.
    url: https://wetten.overheid.nl/BWBR0025958/2026-01-01#Artikel1
  - number: B1.4:2
    text: |-
      De typegoedkeuring kan worden verleend indien de tachograaf voldoet aan de voorschriften van de [bijlage 5,
      onderdeel V, van ES-TRIN](onbekend).
    url: https://wetten.overheid.nl/BWBR0025958/2026-01-01#Artikel2
  - number: B1.4:3
    text: |-
      De tachograaf wordt zodanig op het schip geïnstalleerd, dat alle met de tachograaf verband houdende bestanddelen
      deugdelijk tegen beschadiging zijn beschermd.
    url: https://wetten.overheid.nl/BWBR0025958/2026-01-01#Artikel3
  - number: B1.4:4
    text: |-
      1. De Dienst Wegverkeer beslist op een verzoek om:

      a. erkenning als installateur van tachografen;

      b. erkenning als reparateur van tachografen.

      2. Een verzoek om erkenning wordt ingediend bij de Dienst Wegverkeer.
    url: https://wetten.overheid.nl/BWBR0025958/2026-01-01#Artikel4
  - number: B1.4:5
    text: |-
      1. Een erkenning wordt verleend aan in Nederland gevestigde fabrikanten of importeurs van tachografen.

      2. Als importeur wordt aangemerkt de door de fabrikant van tachografen contractueel erkende importeur.
    url: https://wetten.overheid.nl/BWBR0025958/2026-01-01#Artikel5
  - number: B1.4:6
    text: |-
      De Dienst Wegverkeer kan een erkenning als installateur of reparateur intrekken als aan de voorschriften in deze
      regeling of in het [Rsp][ref1] niet wordt voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0030215
    url: https://wetten.overheid.nl/BWBR0025958/2026-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0030215
  - number: B1.4:7
    text: |-
      1. Een aan een fabrikant of importeur van tachografen verleende erkenning als installateur of reparateur van
      tachografen geldt tevens voor de door hem op verzoek gemachtigde installateurs en reparateurs.

      2. Een machtiging mag eerst worden verleend als door deze installateurs en reparateurs wordt voldaan aan de
      voorschriften bedoeld in artikel 9.
    url: https://wetten.overheid.nl/BWBR0025958/2026-01-01#Artikel7
  - number: B1.4:8
    text: |-
      1. De machtiging wordt door de erkende fabrikant of importeur ingetrokken indien blijkt dat aan de voorschriften
      bedoeld in artikel 9 niet wordt voldaan of de voorschriften bedoeld in artikel 3, dan wel de verplichting opgenomen
      in artikel 11 niet wordt nageleefd.

      2. Bij intrekking van de machtiging doet de fabrikant of importeur van tachografen daarvan onmiddellijk mededeling
      aan de Dienst Wegverkeer.
    url: https://wetten.overheid.nl/BWBR0025958/2026-01-01#Artikel8
  - number: B1.4:9
    text: |-
      1. De installatie, het onderzoek of de reparatie van tachografen mag slechts geschieden door installateurs
      respectievelijk reparateurs die zijn voorzien van:

      a. een verzegelinrichting voorzien van een verzegelnummer;

      b. door de fabrikant of importeur van tachografen voorgeschreven gereedschap en testapparatuur.

      2. Het voor de installatie, het onderzoek of de reparatie van de tachograaf aangewezen personeel dient met
      goed gevolg een door de fabrikant of importeur van tachografen georganiseerde cursus te hebben gevolgd inzake
      constructie, functioneren, installatie, onderzoek en reparatie van tachografen.

      3. Het personeel volgt vervolgens tenminste eenmaal in de drie jaren een herhalingscursus.

      4. Een door de fabrikant of importeur afgegeven bewijs van deelname aan de cursus is in het bedrijf bij de
      installateur respectievelijk reparateur aanwezig.
    url: https://wetten.overheid.nl/BWBR0025958/2026-01-01#Artikel9
  - number: B1.4:10
    text: |-
      De fabrikant of importeur van tachografen die in het bezit is van een erkenning als installateur of reparateur van
      tachografen is verplicht zorg te dragen dat:

      a. aan de hem gemachtigde installateurs en reparateurs een verzegelnummer wordt toegekend;

      b. aan de Dienst Wegverkeer een opgave wordt verstrekt van de door hem gemachtigde installateurs en reparateurs
      alsmede van het door hem gebezigde verzegelnummer of de door hem aan de gemachtigde installateurs en reparateurs
      toegekende verzegelnummers;

      c. aan de minister van de door hem aangebrachte wijzigingen van het bepaalde in onderdeel *b* onmiddellijk
      mededeling wordt gedaan;

      d. de door hem gemachtigde installateurs en reparateurs in het bezit zijn van:

      1°. de voorschriften bedoeld in artikel 3,

      2°. door hem uitgevaardigde technische instructies, werkaanwijzingen en mededelingen; en

      e. door hem wordt toegezien op de naleving van de voorschriften door de door hem gemachtigde installateurs en
      reparateurs.
    url: https://wetten.overheid.nl/BWBR0025958/2026-01-01#Artikel10
  - number: B1.4:11
    text: |-
      Van de verklaring bedoeld in de [bijlage 5, onderdeel V, artikel 3, van ES-TRIN](onbekend) bewaart de installateur
      een afschrift gedurende zeven jaren na dagtekening daarvan.
    url: https://wetten.overheid.nl/BWBR0025958/2026-01-01#Artikel11
