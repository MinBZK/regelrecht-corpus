  - number: '5.15'
    text: |-
      1 Motorschepen en zelfvarende drijvende werktuigen met een lengte van minder dan 55 meter zijn vrijgesteld van
      de ingevolge [artikel 5.6, eerste lid][ref1], voorgeschreven minimumbemanning, mits voldaan wordt aan de volgende
      voorschriften:

      a. hetzij:

      1°. de minimumbemanning bestaat uit een schipper;

      2°. de maximale vaartijd van het schip bedraagt 12 uur per dag en 50 uur per kalenderweek;

      3°. de minimale dagelijkse ononderbroken rusttijd van de schipper bedraagt ten minste 12 uur in elke periode van 24
      uur, te rekenen vanaf het einde van iedere rustperiode van ten minste 12 uur;

      4°. het schip onderbreekt de vaart gedurende een periode van 12 uur waarin de periode van 22.00 uur tot 06.00 uur
      is gelegen;

      5°. er is een vanuit het stuurhuis bedienbaar reserve-toplicht aanwezig;

      6°. het schip is uitgerust met een goed functionerende tachograaf die in werking is gesteld vanaf het begin van de
      voorafgaande ten minste 8 aaneengesloten uren durende onderbreking van de vaart en waarvan de gegevens gedurende
      ten minste zes maanden na de laatste aantekening daarop in chronologische volgorde aan boord worden bewaard;

      7°. vervoer van stoffen waarvoor op grond van het ADN een certificaat van goedkeuring als bedoeld in
      [bijlage 1 bij de Regeling vervoer over de binnenwateren van gevaarlijke stoffen][ref2] is vereist, is niet
      toegestaan;

      8°. er wordt niet gevaren op de Westerschelde;

      9°. het schip voldoet aan [artikel 5.7][ref3], en

      10°. voor zover het motorschip een lengte heeft van meer dan 33 meter, is actieve boegbesturing bedienbaar vanuit
      het stuurhuis aanwezig;

      b. hetzij:

      1°. de minimumbemanning bestaat uit een schipper en een lichtmatroos of deksman;

      2°. er wordt slechts tussen 22.00 en 06.00 gevaren indien de onder 1° bedoelde lichtmatroos of deksman 18 jaar of
      ouder is; en

      3°. de voorschriften, bedoeld in onderdeel a, onder 7° tot en met 10°, worden in acht genomen.

      2 Een wisseling van de vaart met gebruikmaking van de vrijstelling onder de voorschriften van het eerste lid,
      onderdeel a, naar de exploitatiewijze A1, A2 of B, is slechts toegestaan indien:

      a. de schipper is afgelost, of

      b. bij controle kan worden aangetoond dat het voor de exploitatiewijze A1, A2 of B bestemde bemanningslid dat niet
      is afgelost, onmiddellijk voor de wisseling een onafgebroken rusttijd van 8 uur buiten de vaartijd in acht heeft
      genomen, en de voor deze exploitatiewijzen voorgeschreven minimumbemanning zich aan boord bevindt.

      3 Van de exploitatiewijze A1, A2 of B mag slechts naar de vaart met gebruikmaking van de vrijstelling onder de
      voorschriften van het eerste lid, onderdeel a, worden overgegaan, indien de voor de vaart onder de in het eerste
      lid, onderdeel a, bedoelde vrijstelling voorgeschreven schipper onmiddellijk voor de wisseling geen deel heeft
      uitgemaakt van de bemanning van het schip, dan wel bij controle kan worden aangetoond dat de schipper, indien deze
      niet is afgelost, onmiddellijk voor de wisseling een rusttijd van 12 uur buiten de vaartijd van het schip in acht
      heeft genomen.

      4 Een schip kan onmiddellijk in aansluiting op de vaart met gebruikmaking van de vrijstelling onder de
      voorschriften van het eerste lid, onderdeel a, voor een identieke vaart worden ingezet indien de schipper wordt
      vervangen door een andere schipper.

      5 Het aantonen van de rusttijd, bedoeld in het eerste lid, onderdeel a, onder 3°, derde en vierde lid, geschiedt
      door middel van het vaartijdenboek van het schip.

      6 Zelfvarende drijvende werktuigen met een lengte van minder dan 20 meter zijn vrijgesteld van de ingevolge
      [artikel 5.6, eerste lid][ref4], voorgeschreven minimumbemanning, indien wordt voldaan aan de voorschriften,
      bedoeld in het eerste lid, onder a, onderdelen 1° tot en met 4° en 7° tot en met 10°.


      [ref1]: https://wetten.overheid.nl/BWBR0025958#Artikel5.6
      [ref2]: https://wetten.overheid.nl/BWBR0010115
      [ref3]: https://wetten.overheid.nl/BWBR0025958#Artikel5.7
      [ref4]: https://wetten.overheid.nl/BWBR0025958#Artikel5.6
    url: https://wetten.overheid.nl/BWBR0025958/2026-01-01#Artikel5.15
