  - number: '3.17'
    text: |-
      Indien een certificaat van onderzoek door de minister is afgegeven, deelt de eigenaar elke verandering van naam,
      overgang van de eigendom, iedere hermeting van een binnenschip alsmede elke wijziging van het uniek Europees
      scheepsidentificatienummer, van de teboekstelling of van de thuishaven aan de minister mee. Hij legt daarbij het
      certificaat van onderzoek ter wijziging voor.
    url: https://wetten.overheid.nl/BWBR0025958/2026-01-01#Artikel3.17
  - number: '3.18'
    text: |-
      1 Voor afloop van de geldigheidsduur van het certificaat van onderzoek kan een binnenschip aan een periodiek
      onderzoek worden onderworpen.

      2 Afhankelijk van de resultaten van het onderzoek, bedoeld in het eerste lid, wordt de nieuwe geldigheidsduur van
      het certificaat van onderzoek vastgesteld. De geldigheidsduur wordt aangetekend in het certificaat en wordt ter
      kennis gebracht van de bevoegde autoriteit die het heeft afgegeven.

      3 Indien in plaats van verlenging van de geldigheidsduur, als bedoeld in het tweede lid, het certificaat van
      onderzoek door een nieuw wordt vervangen, wordt het oude certificaat teruggezonden aan de bevoegde autoriteit die
      het heeft afgegeven.

      4 In uitzonderingsgevallen kan de minister op een met redenen omkleed verzoek besluiten de geldigheidsduur van
      het door hem afgegeven certificaat van onderzoek zonder onderzoek met ten hoogste zes maanden te verlengen. Deze
      verlenging wordt in het certificaat vermeld.
    url: https://wetten.overheid.nl/BWBR0025958/2026-01-01#Artikel3.18
  - number: '3.19'
    text: |-
      1 De minister onderzoekt ook schepen die niet onder de reikwijdte van richtlijn (EU) 2016/1629 of van het
      [RosR][ref1] vallen, indien zij ter onderzoek worden aangeboden.

      2 Als uit het in het eerste lid bedoelde onderzoek blijkt dat het schip voldoet aan richtlijn (EU) 2016/1629 of aan
      het [RosR][ref2], geeft de minister een certificaat van onderzoek af.


      [ref1]: https://wetten.overheid.nl/BWBR0025973
      [ref2]: https://wetten.overheid.nl/BWBR0025973
    url: https://wetten.overheid.nl/BWBR0025958/2026-01-01#Artikel3.19
    references:
      - id: ref1
        bwb_id: BWBR0025973
      - id: ref2
        bwb_id: BWBR0025973
  - number: '3.20'
    text: |-
      1 Als ES-TRIN bepaalt dat op een binnenschip bepaalde materialen, inrichtingen of uitrustingsstukken moeten
      worden gebruikt of aan boord moeten zijn, of dat bepaalde bouwkundige maatregelen moeten worden getroffen of
      bepaalde opstellingen moeten worden aangehouden, kan de minister de toepassing of de aanwezigheid aan boord van
      dit binnenschip van andere materialen, inrichtingen of uitrustingsstukken toestaan, dan wel toestaan dat andere
      bouwkundige maatregelen worden getroffen of dat andere opstellingen worden aangehouden, mits deze volgens de
      procedure van artikel 33, tweede lid, van richtlijn (EU) 2016/1629 als gelijkwaardig zijn erkend.

      2 Zolang het comité, bedoeld in artikel 33, eerste lid, van richtlijn (EU) 2016/1629, in het kader van de procedure
      van artikel 33, tweede lid, van die richtlijn, nog geen aanbeveling inzake gelijkwaardigheid overeenkomstig het
      eerste lid heeft gedaan, kan de minister een voorlopig Uniebinnenvaartcertificaat afgeven.

      3 Binnen een maand na afgifte van het voorlopig Uniebinnenvaartcertificaat, overeenkomstig artikel 9, onder g, van
      richtlijn (EU) 2016/1629, stelt de minister, volgens de procedure van artikel 33, tweede lid, van die richtlijn,
      met opgave van de naam en het unieke Europees scheepsidentificatienummer van het binnenschip, het comité, bedoeld
      in het tweede lid, in kennis van de aard van de afwijking en van het land waar het binnenschip is te boek gesteld
      of waarin zijn thuishaven is gelegen.

      4 Bij wijze van proef en voor een beperkte tijdsduur kan de minister op grond van een aanbeveling van het comité,
      bedoeld in het tweede lid, volgens de procedure van artikel 33, tweede lid, van richtlijn (EU) 2016/1629, voor een
      binnenschip met nieuwe technische voorzieningen die afwijken van de bepalingen van bijlage II bij die richtlijn,
      een Uniebinnenvaartcertificaat afgeven, voor zover deze nieuwe voorzieningen een gelijkwaardige veiligheid bieden.
    url: https://wetten.overheid.nl/BWBR0025958/2026-01-01#Artikel3.20
  - number: '3.21'
    text: |-
      1 Voor passagiersschepen en zeilende passagiersschepen voor de in Nederland gelegen zone 2, erkent de minister
      voor de toepassing van [artikel 7, onderdeel c, van het besluit][ref1], scheepsattesten afgegeven op grond
      van [richtlijn 2009/100/EG](32009L0100) van het Europees Parlement en de Raad van 16 september 2009 inzake de
      wederzijdse erkenning van scheepsattesten voor binnenschepen (Pb L 259), indien het schip tevens voldoet aan de
      desbetreffende regels voor zone 2.

      2 Het eerste lid is van overeenkomstige toepassing op veerboten, met dien verstande dat de erkenning voor zone 2
      slechts geldt indien de veerboot tevens voldoet aan de voorschriften van [bijlage 3.7][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0025631#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0025958
    url: https://wetten.overheid.nl/BWBR0025958/2026-01-01#Artikel3.21
    references:
      - id: ref1
        bwb_id: BWBR0025631
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0025958
  - number: '3.22'
    text: |-
      1 De minister kan voor de toepassing van [artikel 7, onderdeel c, van het besluit][ref1], een document erkennen
      dat door een bevoegde autoriteit van een andere staat, niet zijnde een lidstaat van de Europese Unie of een van
      de overige staten die partij zijn bij de Overeenkomst betreffende de Europese Economische Ruimte, is afgegeven ten
      bewijze van de deugdelijkheid van een aldaar teboekstaand schip.

      2 Erkenning van het in het eerste lid bedoelde document van deugdelijkheid vindt plaats indien het naar het oordeel
      van de minister voldoende waarborg biedt voor de deugdelijkheid van het schip.

      3 Het document van deugdelijkheid wordt erkend voor de in Nederland gelegen binnenwateren van de zones 2, 3 of 4
      indien het document naar het oordeel van de minister voldoende waarborg biedt voor de veiligheid van de vaart op
      die wateren.

      4 De erkenning kan betrekking hebben op een enkel document van deugdelijkheid of op een groep gelijke documenten.


      [ref1]: https://wetten.overheid.nl/BWBR0025631#Artikel7
    url: https://wetten.overheid.nl/BWBR0025958/2026-01-01#Artikel3.22
    references:
      - id: ref1
        bwb_id: BWBR0025631
        artikel: '7'
  - number: '3.23'
    text: |-
      Met het certificaat voor passagiersschepen, veerboten, patrouillevaartuigen, zeilende passagiersschepen
      of bunkerstations wordt gelijkgesteld een document van deugdelijkheid afgegeven door een onafhankelijke
      keuringsinstelling in een andere lidstaat in de Europese Unie dan wel in een staat die partij is bij de
      Overeenkomst betreffende de Europese Economische Ruimte, welk document is afgegeven op basis van onderzoekingen die
      ten minste aan gelijkwaardige eisen voldoen.
    url: https://wetten.overheid.nl/BWBR0025958/2026-01-01#Artikel3.23
  - number: '3.24'
    text: |-
      In deze paragraaf wordt verstaan onder:

        - *keuringsinstantie:* krachtens [artikel 14, eerste lid, van de Binnenvaartwet][ref1] voor het verrichten van
      onderzoek aangewezen rechtspersoon;
        - *NEN-EN-ISO/IEC 17020 (2004):* de met de desbetreffende aanduiding overeenkomende norm, uitgegeven door het
      Nederlands Normalisatie-instituut te Delft;
        - *onderzoek:* onderzoek ten behoeve van de certificering van binnenschepen als bedoeld in
      [artikel 9, eerste lid, van de Binnenvaartwe][ref2]t.


      [ref1]: https://wetten.overheid.nl/BWBR0023009#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0023009#Artikel9
    url: https://wetten.overheid.nl/BWBR0025958/2026-01-01#Artikel3.24
    references:
      - id: ref1
        bwb_id: BWBR0023009
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0023009
        artikel: '9'
  - number: '3.25'
    text: |-
      1 De minister wijst als keuringsinstantie aan rechtspersonen, die:

      a. naar zijn oordeel in staat zijn het onderzoek, waar dan ook in Nederland, te verrichten;

      b. zijn ingeschreven in het handelsregister bij de Kamer van Koophandel;

      c. beschikken over een vestiging of vertegenwoordiging in Nederland; en

      d. beschikken over een accreditatieverklaring, afgegeven door de Raad voor Accreditatie of een andere accreditatie-
      instelling die erkend is in een lidstaat van de Europese Unie, waaruit blijkt dat de werkzaamheden bedoeld in
      [artikel 3.27][ref1], conform NEN-EN-ISO/IEC 17020 (2004) worden uitgevoerd.

      2 Rechtspersonen die nog niet aan het eerste lid, onderdeel d, voldoen, kunnen voorlopig worden aangewezen, indien
      zij de aanvraag voor accreditatie hebben ingediend bij de Raad voor Accreditatie en blijkens een verklaring van
      de Raad redelijkerwijs kan worden aangenomen dat de desbetreffende rechtspersoon zal voldoen aan de voorwaarden,
      bedoeld in het eerste lid, onderdeel d. Een voorlopige aanwijzing is ten hoogste een jaar geldig.


      [ref1]: https://wetten.overheid.nl/BWBR0025958#Artikel3.27
    url: https://wetten.overheid.nl/BWBR0025958/2026-01-01#Artikel3.25
    references:
      - id: ref1
        bwb_id: BWBR0025958
        artikel: '3.27'
        hoofdstuk: '3'
        paragraaf: '7'
  - number: '3.26'
    text: |-
      Een keuringsinstantie wordt aangewezen voor het onderzoek van een of meer in de [bijlage 3.11][ref1] opgenomen
      pakketten van scheepstypen.


      [ref1]: https://wetten.overheid.nl/BWBR0025958
    url: https://wetten.overheid.nl/BWBR0025958/2026-01-01#Artikel3.26
    references:
      - id: ref1
        bwb_id: BWBR0025958
  - number: '3.27'
    text: |-
      De aangewezen keuringsinstantie is belast met het volledige onderzoek, onverminderd haar bevoegdheid om met
      inachtneming van de voorwaarden voor accreditatie, onderdelen van het onderzoek uit te besteden aan derden.
    url: https://wetten.overheid.nl/BWBR0025958/2026-01-01#Artikel3.27
  - number: '3.28'
    text: |-
      De aangewezen keuringsinstantie voert het onderzoek uit met inachtneming van de voorschriften ingevolge de
      [Binnenvaartwet][ref1] en, indien van toepassing, de [Wet vervoer gevaarlijke stoffen][ref2], alsmede de
      beleidsregels, bedoeld in [artikel 14, derde lid, van de wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0023009
      [ref2]: https://wetten.overheid.nl/BWBR0007606
      [ref3]: https://wetten.overheid.nl/BWBR0023009#Artikel14
    url: https://wetten.overheid.nl/BWBR0025958/2026-01-01#Artikel3.28
    references:
      - id: ref1
        bwb_id: BWBR0023009
      - id: ref2
        bwb_id: BWBR0007606
      - id: ref3
        bwb_id: BWBR0023009
        artikel: '14'
  - number: '3.29'
    text: |-
      De aangewezen keuringsinstantie meldt ernstige mankementen die aan een schip worden geconstateerd onverwijld aan de
      minister, indien de eigenaar niet bereid is deze onverwijld te herstellen.
    url: https://wetten.overheid.nl/BWBR0025958/2026-01-01#Artikel3.29
  - number: '3.30'
    text: |-
      1 De aangewezen keuringsinstantie neemt deel in de commissie, bedoeld in [artikel 1.20][ref1].

      2 De keuringsinstantie verstrekt de minister onvoorwaardelijk en kosteloos informatie, benodigd voor het uitoefenen
      van toezicht. Deze omvat in ieder geval de door de accrediterende instelling opgestelde auditrapporten.

      3 De keuringsinstantie verleent de minister onvoorwaardelijk medewerking aan audits en steekproeven.

      4 De keuringsinstantie verstrekt de minister jaarlijks voor 1 maart een schriftelijke rapportage, overeenkomstig
      de daarvoor door de minister te stellen voorschriften of aanwijzingen, over de in het voorgaande kalenderjaar
      verrichtte onderzoeken.


      [ref1]: https://wetten.overheid.nl/BWBR0025958#Artikel1.20
    url: https://wetten.overheid.nl/BWBR0025958/2026-01-01#Artikel3.30
    references:
      - id: ref1
        bwb_id: BWBR0025958
        artikel: '1.20'
        hoofdstuk: '1'
        paragraaf: '5'
  - number: '3.31'
    text: |-
      1 De aangewezen keuringsinstantie stelt de minister tenminste dertien weken voor de voorgenomen datum van
      beëindiging van haar werkzaamheden van dit voornemen in kennis.

      2 De keuringsinstantie stelt de minister onverwijld in kennis van:

      a. wijzigingen van het ter zake van de keuringsinstantie in het handelsregister ingeschrevene met betrekking tot
      haar naam en adresgegevens;

      b. wijziging, voornemen tot schorsing, schorsing of beëindiging van haar accreditatie.
    url: https://wetten.overheid.nl/BWBR0025958/2026-01-01#Artikel3.31
  - number: '3.32'
    text: |-
      De minister kan de aanwijzing van een keuringsinstantie intrekken, indien:

      a. de betrokken keuringsinstantie niet meer voldoet aan de [artikelen 3.25][ref1] of [3.30][ref2];

      b. de betrokken keuringsinstantie in strijd handelt met deze regeling; of

      c. de betrokken keuringsinstantie door handelen of nalaten te handelen naar het oordeel van de minister gevaar voor
      de veiligheid of het milieu veroorzaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0025958#Artikel3.25
      [ref2]: https://wetten.overheid.nl/BWBR0025958#Artikel3.30
    url: https://wetten.overheid.nl/BWBR0025958/2026-01-01#Artikel3.32
