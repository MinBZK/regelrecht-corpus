      1 Onverminderd [artikel 2.9][ref1], zijn ten aanzien van het dienstboekje de [artikelen 3.02][ref2], [5.01][ref3]
      en [20.01 van het Rsp][ref4], alsmede de op grond van [artikel 1.04 van dat reglement][ref5] vastgestelde
      dienstinstructies van overeenkomstige toepassing met dien verstande dat:

      a. als plaatselijk bevoegde autoriteit, bedoeld in [artikel 5.01, derde lid][ref6], de inspecteur-generaal van de
      Inspectie Leefomgeving en Transport wordt aangewezen;

      b. onder schipper de gezagvoerder wordt verstaan.

      2 Een vervangend exemplaar treedt in de plaats van een eerder afgegeven dienstboekje en wordt niet eerder afgegeven
      dan nadat het geheel of ten dele onleesbaar geworden exemplaar, waarvoor het wordt afgegeven, is ingeleverd bij
      de minister.

      3 De aanvrager wiens eerder uitgereikt dienstboekje verloren is geraakt of teniet is gegaan, legt hieromtrent bij
      het indienen van zijn aanvraag een schriftelijke verklaring af. Op bladzijde 1 van het vervangende exemplaar van
      het dienstboekje wordt aangetekend dat de hiervoor bedoelde verklaring is afgelegd.


