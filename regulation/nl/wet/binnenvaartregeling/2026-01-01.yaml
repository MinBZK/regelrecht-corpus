  - number: '2.10'
    text: |-
      1 In afwijking van [artikel 2.9][ref1] maar onverminderd het negende lid van dat artikel, is op de schippers en
      machinisten op veerboten dit artikel van toepassing.

      2 Een schipper:

      a. voldoet aan de vereisten die op grond van [artikel 2.9, tweede lid, onderdeel a tot en met c][ref2], worden
      gesteld aan een schipper; en

      b. is in het bezit van een getuigschrift waaruit blijkt dat met goed gevolg de opleiding Zoute Veren, nautische
      Module is gevolgd.

      3 Een eerste machinist is ten minste 21 jaar en is in het bezit van:

      a. een getuigschrift waaruit blijkt dat met goed gevolg is gevolgd:

      1°. de zeevaartopleiding Maritiem Officier op MBO-4 of HBO niveau met een technische uitstroomrichting;

      2°. de opleiding Maritiem Officier Kleine Schepen of Koopvaardij Officier Kleine Schepen, op ten minste MBO-
      3 niveau, met een technische of nautische uitstroomrichting, aangevuld met de opleiding Zoute Veren, technische
      module; of

      3°. een technische opleiding op MBO-4 of HBO niveau aangevuld met de opleiding Zoute Veren, technische Module;

      4°. een andere door de minister erkende opleiding;

      b. een door de minister erkend buitenlands getuigschrift waaruit blijkt dat hij een gelijkwaardige opleiding heeft
      gevolgd; of

      c. een erkenning van beroepskwalificaties als bedoeld in [artikel 2.12][ref3].

      4 Een tweede machinist is ten minste 19 jaar en is in het bezit van:

      a. een getuigschrift waaruit blijkt dat met goed gevolg is gevolgd:

      1°. de opleiding Maritiem Officier Kleine Schepen of Koopvaardij Officier Kleine Schepen, op MBO-3 niveau, met een
      technische of nautische uitstroomrichting;

      2°. een technische opleiding op MBO-4 niveau; of

      3°. een andere door de minister erkende opleiding;

      b. een door de minister erkend buitenlands getuigschrift waaruit blijkt dat hij een gelijkwaardige opleiding heeft
      gevolgd; of

      c. een erkenning van beroepskwalificaties als bedoeld in [artikel 2.12][ref4].

      5 Voor de examens ter verkrijging van de diploma’s Zoute Veren Nautische Module of Technische Module, bedoeld in
      het tweede lid, onderdeel b, en het derde lid, onderdeel a, onder 2° en 3°, is een door de minister goedgekeurd
      examenreglement en examenprogramma van toepassing.

      6 Een eerste machinist mag ook de functie tweede machinist uitoefenen.

      7 Dekbemanningsleden die houder zijn van een kwalificatiecertificaat afgegeven door de bevoegde autoriteit in het
      buitenland overeenkomstig [Richtlijn 2017/2397](32017L2397) voor een functie genoemd in dit artikel voldoen aan de
      eisen voor die desbetreffende functie.


