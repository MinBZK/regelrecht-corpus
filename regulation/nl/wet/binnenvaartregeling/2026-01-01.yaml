  - number: '7.18'
    text: |-
      1 Om voor de afgifte van een kwalificatiecertificaat schipper in aanmerking te komen:

      a. heeft de aanvrager van ten minste 18 jaar oud een goedgekeurd opleidingsprogramma van ten minste drie jaar
      afgerond dat gebaseerd is op de competentienormen en onderwerpen genoemd in [artikel 7.16, eerste lid][ref1], heeft
      de aanvrager een vaartijd van ten minste 360 dagen opgebouwd als onderdeel van het opleidingsprogramma of na afloop
      daarvan en is deze houder van een basiscertificaat marifonie, het beperkte certificaat maritieme radiocommunicatie
      of het algemeen certificaat maritieme radiocommunicatie zoals bedoeld in de Examenregeling frequentiegebruik 2008;

      b. beschikt de aanvrager van ten minste 18 jaar oud over de relevante verklaring, bedoeld in [artikel 7.17][ref2],
      toont deze daarnaast aan dat een vaartijd is opgebouwd van ten minste 180 dagen in de functie stuurman en is de
      aanvrager houder van een basiscertificaat marifonie, het beperkte certificaat maritieme radiocommunicatie of het
      algemeen certificaat maritieme radiocommunicatie zoals bedoeld in de [Examenregeling frequentiegebruik 2008][ref3];

      c. beschikt de aanvrager van ten minste 18 jaar oud over de relevante verklaring, bedoeld in [artikel 7.17][ref4],
      toont deze daarnaast aan dat een vaartijd is opgebouwd van ten minste 540 dagen, die verminderd worden tot 180
      dagen indien de aanvrager 500 dagen werkervaring aan boord van een zeeschip kan aantonen, en is de aanvrager
      houder van een basiscertificaat marifonie, het beperkte certificaat maritieme radiocommunicatie of het algemeen
      certificaat maritieme radiocommunicatie zoals bedoeld in de [Examenregeling frequentiegebruik 2008][ref5]; of

      d. heeft de aanvrager een door het CBR gecertificeerd opleidingsprogramma van ten minste anderhalf jaar afgerond
      dat gebaseerd is op de competentienormen en onderwerpen genoemd in [artikel 7.16, eerste lid][ref6], heeft
      de aanvrager een vaartijd van ten minste 180 dagen opgebouwd als onderdeel van het opleidingsprogramma en ten
      minste 180 dagen na afloop daarvan, is de aanvrager houder van een basiscertificaat marifonie, het beperkte
      certificaat maritieme radiocommunicatie of het algemeen certificaat maritieme radiocommunicatie zoals bedoeld in
      de [Examenregeling frequentiegebruik 2008][ref7] en heeft de aanvrager voorafgaand aan de inschrijving voor het
      opleidingsprogramma vijf jaar werkervaring opgebouwd, 500 dagen werkervaring als dekbemanningslid op een zeeschip
      opgebouwd of een beroepsopleiding voltooid van ten minste drie jaar.

      2 De volgende vaarbewijzen zijn tot en met 17 januari 2032 gelijkwaardige documenten zoals bedoeld in
      [artikel 21 van het besluit][ref8]:

      a. het beperkt groot vaarbewijs A en het groot vaarbewijs A voor de afgifte van het kwalificatiecertificaat
      schipper met de specifieke vergunning voor het varen op wateren van maritieme aard;

      b. het beperkt groot vaarbewijs B en het groot vaarbewijs B voor de afgifte van het kwalificatiecertificaat
      schipper.

      3 De opleidingsprogramma’s die gebaseerd zijn op de competentienormen en onderwerpen zoals genoemd in onderdeel
      2 van bijlage II en rubriek 2 van tabel B van bijlage IV van [Richtlijn 2017/2397](32017L2397) zijn de
      opleidingsprogramma’s die resulteren in het diploma kapitein binnenvaart, schipper binnenvaart of bootman, zoals
      opgenomen in het Centraal Register Beroepsopleidingen onder de respectieve nummers 25612, 25611 en 25635.


