      1 Voor de Rijn in Nederland met inbegrip van de Waal en de Lek is van kracht het [Rsp][ref1], met inbegrip van de
      daarbij behorende bijlagen, dat is opgenomen in [bijlage 1.9][ref2].

      2 Onverminderd het eerste lid is op de Rijn in Nederland, met inbegrip van de Waal en de Lek, van toepassing:

      a. [hoofdstuk 7, paragrafen 1][ref3] en [2][ref4];

      b. mits tijdens de vaart de Duits-Nederlandse grens in de ene of de andere richting niet wordt overschreden:

      1°. de bekwaamheidseisen, bedoeld in [artikel 2.9][ref5];

      2°. de omschrijving van zeeschepen in [artikel 5.10][ref6];

      3°. de vrijstellingen, bedoeld in [hoofdstuk 5, paragraaf 5][ref7];

      4°. de rusttijden bedoeld in het [Arbeidstijdenbesluit vervoer, hoofdstuk 5][ref8] Binnenvaart.


