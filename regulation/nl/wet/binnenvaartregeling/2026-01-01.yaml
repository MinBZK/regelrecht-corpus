  - number: '4.1'
    text: |-
      In dit hoofdstuk wordt verstaan onder:

        - *belanghebbende:* eigenaar van het binnenschip of degene die namens de eigenaar optreedt;
        - *ligger:* register waarin de minister elke meetbrief inschrijft die hij uitreikt, alsmede de datum van de
      uitreiking, de naam en het Europese scheepidentificatienummer van het binnenschip of andere gegevens waardoor een
      binnenschip kan worden geïdentificeerd;
        - *maximum toelaatbare waterverplaatsing:* in kubieke meters uitgedrukte waterverplaatsing van een binnenschip tot
      het vlak van de grootste toegelaten diepgang;
        - *meetbrief:* meetbrief, afgegeven door de minister overeenkomstig de bepalingen van dit hoofdstuk, dan wel
      afgegeven door de bevoegde autoriteit van een andere staat, aangesloten bij de Overeenkomst;
        - *Overeenkomst:* op 15 februari 1966 te Genève ondertekende en op 14 september 1967 goedgekeurde Overeenkomst
      nopens de meting van binnenvaartuigen, met Bijlage en Protocol van Ondertekening (*Trb.* 1967, 43);
        - *verplaatsing:* in kubieke meters uitgedrukte waterverplaatsing van een binnenschip tussen het vlak van inzinking
      van het lege binnenschip in zoet water en het vlak van de grootste toegelaten diepgang.
    url: https://wetten.overheid.nl/BWBR0025958/2026-01-01#Artikel4.1
  - number: '4.2'
    text: |-
      De meting van binnenschepen heeft tot doel:

      a. de verplaatsing vast te stellen, evenals, indien nodig, een deel van de verplaatsing in samenhang met de
      inzinking;

      b. indien het binnenschip bestemd is of gebruikt wordt voor het vervoer van goederen: het mogelijk te maken het
      gewicht van de lading volgens de inzinking te bepalen;

      c. indien het binnenschip niet bestemd is of gebruikt wordt voor het vervoer van goederen: de maximum toelaatbare
      waterverplaatsing en de waterverplaatsing in lege toestand te bepalen.
    url: https://wetten.overheid.nl/BWBR0025958/2026-01-01#Artikel4.2
  - number: '4.3'
    text: |-
      1 De minister onderhoudt een ligger tot inschrijving van de gemeten binnenschepen.

      2 De minister houdt van de afgifte, de verlenging en de intrekking van de meetbrief en van de hermeting aantekening
      in de ligger.

      3 De minister maakt van de aantekeningen als bedoeld in [artikelen 4.19, eerste lid][ref1], en
      [4.20, eerste lid][ref2], melding in de ligger.


      [ref1]: https://wetten.overheid.nl/BWBR0025958#Artikel4.19
      [ref2]: https://wetten.overheid.nl/BWBR0025958#Artikel4.20
    url: https://wetten.overheid.nl/BWBR0025958/2026-01-01#Artikel4.3
    references:
      - id: ref1
        bwb_id: BWBR0025958
        artikel: '4.19'
        hoofdstuk: '4'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0025958
        artikel: '4.20'
        hoofdstuk: '4'
        paragraaf: '5'
  - number: '4.4'
    text: |-
      1 De meting, hermeting of controle-meting wordt uitgevoerd op aanvraag van de belanghebbende door de minister of de
      daartoe door de minister aangewezen natuurlijke personen of rechtspersonen.

      2 Degene die de meting heeft aangevraagd, volgt gedurende de meting alle voorschriften op van de minister met
      betrekking tot de ligging van het vaartuig op het vlak van inzinking van het lege vaartuig en de eventuele
      verplaatsing van losse voorwerpen en verschaft de nodige hulp bij de meting en bij het aanbrengen van de ijkmerken
      of de ijkplaten en stelt daartoe een deugdelijke roeiboot met ten minste twee personen beschikbaar.
    url: https://wetten.overheid.nl/BWBR0025958/2026-01-01#Artikel4.4
  - number: '4.5'
    text: |-
      1 De ligplaats van het te meten binnenschip of van het binnenschip waarvan de meting gecontroleerd wordt, is in
      stil, bij voorkeur zoet water en zodanig, dat het vaartuig van alle zijden toegankelijk is.

      2 Indien in brak of zout water wordt gemeten, wordt de lege diepgang gecorrigeerd.

      3 Het water in stoomketels van schepen zonder voortstuwingswerktuig behoort tot de uitrusting van het vaartuig.

      4 Zaken die niet behoren tot die, welke volgens het derde lid en volgens [artikel 4.7][ref1] aanwezig zijn,
      bevinden zich niet aan boord.

      5 Is de uitrusting niet volledig, dan wordt zij voor de meting aangevuld.

      6 Het schip is voor de meting behoorlijk schoon; op de bodem is geen water aanwezig.

      7 Het vaartuig ligt gedurende de meting zoveel mogelijk dwarsscheeps horizontaal en stil.

      8 Zolang niet aan de dit artikel bedoelde voorwaarden is voldaan, wordt de meting niet verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0025958#Artikel4.7
    url: https://wetten.overheid.nl/BWBR0025958/2026-01-01#Artikel4.5
    references:
      - id: ref1
        bwb_id: BWBR0025958
        artikel: '4.7'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: '4.6'
    text: |-
      1 Voor de meting van een binnenschip worden de maten aan het vaartuig zelf gemeten. Het te meten deel van het
      binnenschip is het deel dat begrepen is tussen het vlak van de grootste toegelaten diepgang en het vlak van
      inzinking van het lege vaartuig.

      2 Bij het meten van lengten en breedten worden de onderdelen van centimeters rekenkundig afgerond.

      3 Bij het meten van hoogten worden de onderdelen van centimeters tot op millimeters in aanmerking genomen.

      4 Bij de berekening worden breuken van duizendste delen, rekenkundig afgerond tot duizendsten.

      5 Bij de eindberekening van de verplaatsing worden onderdelen van een kubieke decimeter verwaarloosd.
    url: https://wetten.overheid.nl/BWBR0025958/2026-01-01#Artikel4.6
  - number: '4.7'
    text: |-
      1 Het vlak van inzinking van het lege vaartuig, is het vlak overeenkomende met het wateroppervlak, indien:

      a. het binnenschip geen brandstof of verplaatsbare ballast aan boord heeft maar slechts de uitrusting, de proviand
      en de bemanning die normaal aan boord zijn als het vaartuig vaart; alsmede water dat niet door gebruikelijke
      middelen uit het ruim kan worden verwijderd en de drinkwatervoorraad, die 0,5% van de grootste verplaatsing van het
      vaartuig niet aanzienlijk mag overschrijden;

      b. de werktuigen, ketels, pijpleidingen en installaties, nodig voor de voortstuwing, voor de noodzakelijke
      hulpwerktuigen, of voor verwarming of koeling, water, olie of andere vloeistoffen bevatten waarvan zij in gewone
      omstandigheden worden voorzien om dienst te kunnen doen;

      c. het binnenschip zich in zoet water bevindt met een soortelijk gewicht gelijk aan 1.

      2 Indien het binnenschip zich bij de meting niet in de toestand, bedoeld in het eerste lid bevindt, of niet in
      omstandigheden die leiden tot dezelfde inzinking en ongeveer dezelfde trimligging, worden het verschil in belasting
      en het verschil in soortelijk gewicht van het water in aanmerking genomen bij het maken van de berekeningen.

      3 De gewichten aan boord die behoren bij de lege inzinking worden in de meetbrief vermeld.
    url: https://wetten.overheid.nl/BWBR0025958/2026-01-01#Artikel4.7
  - number: '4.8'
    text: |-
      1 Het vlak van de grootste toegelaten diepgang wordt vastgesteld overeenkomstig de voor dat binnenschip geldende
      regels van artikel 4.03, tweede lid, van ES-TRIN.

      2 Voor binnenschepen die bestemd of gebruikt zijn voor het vervoer van goederen kan op verzoek van de
      belanghebbende het vlak van de grootste toegelaten diepgang ten hoogste tien procent van de gemiddelde laadhoogte
      lager worden gesteld dan in het eerste lid bepaald.

      3 In bijzondere gevallen kan op verzoek van de belanghebbende het vlak van de grootste toegelaten diepgang meer
      dan tien procent van de gemiddelde laadhoogte lager worden gesteld, mits aan de minister wordt aangetoond dat de
      grootste diepgang waarop het schip zal kunnen varen geringer is dan de diepgang, bepaald volgens het tweede lid.

      4 Voor binnenschepen die niet zijn bestemd of gebruikt voor het vervoer van goederen kan op verzoek van de
      belanghebbende het vlak van de grootste toegelaten diepgang lager worden gesteld dan overeenkomstig het eerste
      lid bepaald.
    url: https://wetten.overheid.nl/BWBR0025958/2026-01-01#Artikel4.8
  - number: '4.9'
    text: |-
      Op de meting is [bijlage 4.1][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0025958
    url: https://wetten.overheid.nl/BWBR0025958/2026-01-01#Artikel4.9
    references:
      - id: ref1
        bwb_id: BWBR0025958
  - number: '4.10'
    text: |-
      1 De belanghebbende kan binnen zesentwintig weken na de afgifte van de meetbrief bij de minister hermeting
      verzoeken. De hermeting is beslissend.

      2 De hermeting en zonodig de vernieuwing van de ijkmerken of de ijkplaten geschieden kosteloos, indien het verschil
      met de eerste meting meer bedraagt dan:

      a. 1 procent voor de verplaatsingscijfers van maximaal 500 kubieke meter;

      b. 5 kubieke meter voor de verplaatsingscijfers van meer dan 500 kubieke meter tot maximaal 2000 kubieke meter;

      c. 0,25 procent voor de verplaatsingscijfers van meer dan 2000 kubieke meter.

      Het verschil wordt bepaald over een zelfde laadhoogte.

      3 De minister geeft in de in het tweede lid genoemde gevallen een nieuwe meetbrief af, waarin de
      onderscheidingstekenen en het volgnummer van inschrijving in de ligger van de eerste meetbrief worden overgenomen.

      4 Is het verschil met de eerste meting gelijk aan of minder dan de percentages of het aantal kubieke meters,
      vermeld in het tweede lid, dan wordt de eerste meting als juist aangemerkt en is de belanghebbende voor de
      hermeting de voor de meting gestelde vergoeding verschuldigd.
    url: https://wetten.overheid.nl/BWBR0025958/2026-01-01#Artikel4.10
  - number: '4.11'
    text: |-
      1 De belanghebbende geeft bij hermeting de bij de vorige meting behorende meetbrief aan de minister af.

      2 Indien het een meetbrief betreft die in het buitenland is afgegeven, geeft de minister de bevoegde autoriteit in
      de andere staat hiervan kennis onder bijvoeging van de ingetrokken meetbrief.
    url: https://wetten.overheid.nl/BWBR0025958/2026-01-01#Artikel4.11
  - number: '4.12'
    text: |-
      Op de hermeting is [bijlage 4.1][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0025958
    url: https://wetten.overheid.nl/BWBR0025958/2026-01-01#Artikel4.12
    references:
      - id: ref1
        bwb_id: BWBR0025958
  - number: '4.13'
    text: |-
      1 De minister verstrekt de meetbrief uiterlijk zeven werkdagen na de meting.

      2 De meetbrief wordt vastgesteld overeenkomstig het model in de Overeenkomst.

      3 Op de meetbrief worden de zones als bedoeld in [artikel 1.3][ref1], waarin het binnenschip bestemd is te varen,
      vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0025958#Artikel1.3
    url: https://wetten.overheid.nl/BWBR0025958/2026-01-01#Artikel4.13
    references:
      - id: ref1
        bwb_id: BWBR0025958
        artikel: '1.3'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: '4.14'
    text: |-
      1 De geldigheidsduur van een meetbrief is ten hoogste vijftien jaar, te rekenen van de datum van afgifte.

      2 De vervaldatum wordt op de meetbrief vermeld.
    url: https://wetten.overheid.nl/BWBR0025958/2026-01-01#Artikel4.14
  - number: '4.15'
    text: |-
      1 De geldigheidsduur van een meetbrief wordt op verzoek van de belanghebbende verlengd, indien bij een
      controlemeting blijkt dat de gegevens van de meetbrief nog juist zijn. Daartoe worden de volgende afmetingen van
      het binnenschip gecontroleerd:

      a. de lengte en de breedte, alsmede de inzinking van het lege vaartuig ter plaatse van elk ijkmerk;

      b. ingeval het vaartuig blijvende vervormingen heeft: enkele breedten aan de hand van de laatste meting, om na te
      gaan of de vervormingen vóór of na de laatste meting zijn ontstaan.

      2 De geldigheidsduur van de meetbrief kan overeenkomstig het eerste lid worden verlengd:

      a. indien het een binnenschip betreft dat bestemd of gebruikt is voor het vervoer van goederen: voor een periode
      van ten hoogste tien jaar;

      b. indien het een ander binnenschip betreft dan bedoeld in onderdeel a: voor een periode van ten hoogste vijftien
      jaar.

      3 Van de uitkomst van de controle en van de datum waarop de geldigheidsduur van de meetbrief is verlengd, houdt de
      minister aantekening in de ligger.

      4 Tenzij de betreffende bij de Overeenkomst aangesloten staat zulks niet toestaat, kan de geldigheidsduur van een
      door een van zijn bureaus van meting afgegeven meetbrief voor een vaartuig, bestemd of gebruikt voor het vervoer
      van goederen, worden verlengd, overeenkomstig het bepaalde in dit hoofdstuk.

      5 Van de uitkomst van de controle van een in het buitenland gemeten binnenschip alsmede van de datum waarop de
      geldigheidsduur van een dergelijke meetbrief is verlengd, wordt kennis gegeven aan de minister. Laatstgenoemde
      geeft daarna aan zijn ambtgenoot in het andere land hiervan kennis.
    url: https://wetten.overheid.nl/BWBR0025958/2026-01-01#Artikel4.15
  - number: '4.16'
    text: |-
      1 De meetbrief vervalt:

      a. door het verstrijken van de geldigheidsduur;

      b. wanneer het binnenschip een verbouwing ondergaat die van invloed is op de ligging van het vlak van inzinking van
      het lege vaartuig, op de verplaatsing dan wel op de in de meetbrief vermelde afmetingen;

      c. wanneer het binnenschip, een andere bestemming krijgt of anders gebruikt wordt dan waarvoor de meetbrief is
      afgegeven;

      d. wanneer de meetbrief is gewijzigd door daartoe niet bevoegde personen;

      e. wanneer aan het binnenschip andere veranderingen dan wel blijvende beschadigingen zijn aangebracht, waardoor de
      omschrijving in de meetbrief niet meer juist is;

      f. wanneer de meetbrief niet meer volledig is.

      2 Als een verbouwing, bedoeld in het eerste lid, onderdeel b, wordt onder meer aangemerkt: het verlengen van het
      schip, het verhogen van het gangboord, het wijzigen van de positie van een of meer lichtranden of patrijspoorten
      onmiddellijk boven de lastlijn, alle in- en uitwendige verbouwingen aan de romp, laadhoofden en de bovenbouw van
      het schip en het plaatsen, verwijderen of veranderen van machines, ketels of de inventaris, voor zover daardoor het
      vlak van inzinking van het lege vaartuig of het vlak van de grootste toegelaten diepgang is verplaatst.

      3 Indien een geval als bedoeld in het eerste lid, onderdelen d en e, zich voordoet, wordt de afgegeven meetbrief
      voor zover nodig vervangen of gewijzigd.
    url: https://wetten.overheid.nl/BWBR0025958/2026-01-01#Artikel4.16
  - number: '4.17'
    text: |-
      1 Indien de minister constateert, dat zich ten aanzien van een in Nederland geregistreerd binnenschip één der
      gevallen, genoemd in [artikel 4.16, eerste lid][ref1], voordoet trekt hij de meetbrief in.

      2 Indien één der gevallen, genoemd in [artikel 4.16, eerste lid][ref2], zich voordoet ten aanzien van een in
      het buitenland geregistreerd binnenschip, informeert de minister de bevoegde autoriteit in het land waar het
      binnenschip is geregistreerd. In de meetbrief van het desbetreffende binnenschip wordt een verklaring gehecht als
      vastgesteld door de minister.


      [ref1]: https://wetten.overheid.nl/BWBR0025958#Artikel4.16
      [ref2]: https://wetten.overheid.nl/BWBR0025958#Artikel4.16
