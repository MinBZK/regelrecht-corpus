      1 De gezagvoerder van een schip dat de Rijn bevaart is verantwoordelijk voor de naleving
      van de [artikelen 1.03 tot en met 1.05][ref1], en [hoofdstuk 8a van het RosR][ref2], van de
      [hoofdstukken 3 tot en met 31][ref3], met uitzondering van de [artikelen 8.07, derde lid][ref4],
      [10.07, derde lid][ref5], [15.01, derde en vierde lid][ref6], [17.15, tweede en derde lid][ref7],
      [19.05, eerste lid][ref8], en [21.06, eerste lid, van ES-TRIN][ref9] en van de [artikelen 3.01][ref10],
      [3.02, eerste lid, onderdeel a][ref11], [4.01][ref12], [4.02][ref13], [5.01, eerste, derde en zesde lid][ref14],
      [10.01][ref15], [11.01][ref16], [17.01, eerste lid, tweede lid, derde alinea, derde lid en vierde lid][ref17],
      [18.01][ref18], [18.02, eerste, tweede en derde lid][ref19], [18.03][ref20],
      [18.04, eerste, derde, vierde en vijfde lid, van het Rsp][ref21].

      2 De eigenaar van een schip dat de Rijn bevaart is verantwoordelijk voor de naleving van de
      [artikelen 1.03 tot en met 1.05][ref22], [2.08, eerste lid][ref23], [2.09, eerste lid][ref24], en
      [hoofdstuk 8a van het RosR][ref25] en van de hoofdstukken 3 tot en met 31, met uitzondering van de artikelen 8.07,
      derde lid, 10.07, derde lid, 15.01, derde en vierde lid, 17.15, tweede en derde lid, 19.05, eerste lid, en 21.06,
      eerste lid, van ES-TRIN en van [artikel 19.01, eerste lid, van het Rsp][ref26].

      3 De werkgever van de bemanning van een schip dat de Rijn bevaart is verantwoordelijk
      voor de naleving van de [artikelen 3.01][ref27], [3.02, eerste lid, onderdeel a][ref28],
      [4.01][ref29], [4.02][ref30], [5.01, eerste, derde en zesde lid][ref31], [10.01][ref32],
      [11.01][ref33], [17.01, eerste lid, tweede lid, derde alinea, derde lid en vierde lid][ref34],
      [18.01][ref35], [18.02, eerste tot en met derde lid][ref36], [18.03][ref37] en
      [18.04, eerste, derde, vierde en vijfde lid, van het Rsp][ref38].

      4 Een lid van de bemanning van een schip dat de Rijn bevaart, niet zijnde de gezagvoerder, is
      verantwoordelijk voor de naleving van de [artikelen 3.05, eerste lid, onderdeel b][ref39], [4.02][ref40], en
      [5.01, eerste, derde en vijfde lid, van het Rsp][ref41].

      5 Het in het eerste tot en met vierde lid bepaalde is van overeenkomstige toepassing op de krachtens
      [artikel 1.06, eerste lid, van het RosR][ref42] of [artikel 1.03 van het Rsp][ref43] aangebrachte tijdelijke
      afwijkingen.


