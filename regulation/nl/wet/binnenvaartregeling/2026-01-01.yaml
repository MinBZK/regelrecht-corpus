        artikel: '40'
  - number: '10.2'
    text: |-
      Als ambtenaren in de zin van [artikel 40, tweede lid, van de wet][ref1] worden aangewezen de ambtenaren,
      onderscheidenlijk medewerkers, van:

      a. de divisie Havenmeester van Havenbedrijf Amsterdam N.V.;

      b. het directoraat-generaal Rijkswaterstaat van het Ministerie van Infrastructuur en Waterstaat;

      c. de divisie Havenmeester van Havenbedrijf Rotterdam N.V.;

      d. de Arbeidsinspectie.


      [ref1]: https://wetten.overheid.nl/BWBR0023009#Artikel40
    url: https://wetten.overheid.nl/BWBR0025958/2026-01-01#Artikel10.2
    references:
      - id: ref1
        bwb_id: BWBR0023009
        artikel: '40'
  - number: '10.3'
    text: |-
      1 Als ambtenaren in de zin van [artikel 40, tweede lid, van de wet][ref1] worden aangewezen de ambtenaren van de
      in [artikel 10.4][ref2] genoemde provincies, gemeenten onderscheidenlijk waterschappen die daartoe door het college
      van gedeputeerde staten, het college van burgemeester en wethouders onderscheidenlijk het dagelijks bestuur als
      zodanig zijn aangesteld.

      2 Het college van gedeputeerde staten, het college van burgemeester en wethouders onderscheidenlijk het dagelijks
      bestuur stelt slechts ambtenaren aan die naar zijn oordeel voldoende bekwaam zijn ter zake van de [wet][ref3] en
      van toezicht of opsporing.


      [ref1]: https://wetten.overheid.nl/BWBR0023009#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0025958#Artikel10.4
      [ref3]: https://wetten.overheid.nl/BWBR0023009
