  - number: '2.9'
    text: |-
      1 Dit artikel is van toepassing op de bemanningsleden van schepen als bedoeld in
      [artikel 12 van het besluit][ref1], varend op de in [artikel 1.2][ref2] bedoelde binnenwateren.

      2 Een schipper is:

      a. in het bezit van een CCR-kwalificatiecertificaat schipper als bedoeld in
      [artikel 11.01, eerste lid, van het Rsp][ref3] of een krachtens [artikel 20.03, eerste lid][ref4], van dat
      reglement geldig Rijnschipperspatent;

      b. in het bezit van een kwalificatiecertificaat schipper of ander vaarbewijs als bedoeld in
      [artikel 25, eerste lid, van de wet][ref5]; of

      c. in het bezit van een document als bedoeld in [artikel 25, derde lid, van de wet][ref6].

      3 Een stuurman is:

      a. in het bezit van een kwalificatiecertificaat stuurman als bedoeld in [artikel 26a van de wet][ref7]; of

      b. in het bezit van een CCR-kwalificatiecertificaat stuurman als bedoeld in
      [artikel 3.02, eerste lid, onderdeel b, van het Rsp][ref8].

      4 Een machinist is:

      a. ten minste 18 jaar en in het bezit van een maritiem diploma zoals opgenomen in de Registratie instellingen en
      opleidingen onder de opleidingscodes 25677, 25679, 25680, 25683, 91943, 91941, 91931 of 91932, dan wel in het bezit
      van een erkenning van beroepskwalificaties als bedoeld in [artikel 2.12][ref9];

      b. ten minste 18 jaar en in het bezit van de verklaring praktijkexamen machinist, ten bewijze dat het
      praktijkexamen machinist binnenvaart van het CBR met goed gevolg is afgelegd bij een daartoe door het CBR erkend
      opleidingsinstituut;

      c. ten minste 19 jaar en heeft een beroepservaring van ten minste 2 jaar als volmatroos op een schip met
      mechanische voortstuwingsmiddelen; of

      d. in het bezit van een CCR-kwalificatiecertificaat machinist als bedoeld in
      [artikel 3.02, eerste lid, onderdeel b, van het Rsp][ref10].

      5 Een volmatroos is:

      a. in het bezit van een kwalificatiecertificaat volmatroos als bedoeld in [artikel 26a van de wet][ref11]; of

      b. in het bezit van een CCR-kwalificatiecertificaat volmatroos als bedoeld in
      [artikel 3.02, eerste lid, onderdeel b, van het Rsp][ref12].

      6 Een matroos is:

      a. in het bezit van een kwalificatiecertificaat matroos als bedoeld in [artikel 26a van de wet][ref13]; of

      b. in het bezit van een CCR-kwalificatiecertificaat matroos als bedoeld in
      [artikel 3.02, eerste lid, onderdeel b, van het Rsp][ref14].

      7 Een lichtmatroos is:

      a. in het bezit van een kwalificatiecertificaat lichtmatroos als bedoeld in [artikel 26a van de wet][ref15]; of

      b. in het bezit van een CCR-kwalificatiecertificaat lichtmatroos als bedoeld in
      [artikel 3.02, eerste lid, onderdeel b, van het Rsp][ref16].

      8 Een deksman is:

      a. in het bezit van een kwalificatiecertificaat deksman als bedoeld in [artikel 26a van de wet][ref17]; of

      b. in het bezit van een CCR-kwalificatiecertificaat deksman als bedoeld in
      [artikel 3.02, eerste lid, onderdeel b, van het Rsp][ref18].

      9 Een schipper mag ook de functies stuurman, volmatroos, matroos en deksman uitoefenen. Een stuurman mag ook
      de functies volmatroos, matroos en deksman uitoefenen. Een volmatroos mag ook de functies matroos en deksman
      uitoefenen. Een matroos mag ook de functie deksman uitoefenen.


