  - number: '5.5'
    text: |-
      Bij wisseling en herhaling van exploitatiewijzen is [artikel 18.03 van het Rsp][ref1] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Artikel18.03
