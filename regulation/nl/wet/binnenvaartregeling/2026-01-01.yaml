      in [artikel 7.6, eerste lid][ref3], het zeilbewijs, bedoeld in [artikel 7.9, eerste lid][ref4], een erkend
      buitenlands bewijs van vaarbekwaamheid als bedoeld in [artikel 7.11][ref5], en de specifieke vergunningen, bedoeld
      in [artikel 7.11b][ref6].

