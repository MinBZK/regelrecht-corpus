    text: |-
      Voor de toepassing van deze paragraaf is
      [artikel 17.01, eerste en tweede lid, met uitzondering van de derde alinea, van het Rsp][ref1] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Artikel17.01
