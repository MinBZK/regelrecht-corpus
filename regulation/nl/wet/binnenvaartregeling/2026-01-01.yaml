      1 Als vaarbewijs als bedoeld in [artikel 35b, eerste lid, onderdeel b, van de Scheepvaartverkeerswet][ref1],
      worden aangewezen het kwalificatiecertificaat schipper, het klein vaarbewijs I, het klein vaarbewijs II, het
      kwalificatiecertificaat schipper open rondvaartboot beperkt vaargebied, bedoeld in [artikel 7.5, eerste lid][ref2],
