  - number: '3.9'
    text: |-
      1 Het certificaat van onderzoek, het voorlopig certificaat van onderzoek, het Uniebinnenvaartcertificaat, het
      voorlopig Uniebinnenvaartcertificaat, alsmede het aanvullende Uniebinnenvaartcertificaat in samenhang met een
      certificaat van onderzoek als bedoeld in de Herziene Rijnvaartakte zijn geldig voor de bestemming en voor de zones
      waarvoor het schip blijkens het certificaat geschikt is bevonden.

      2 Het Uniebinnenvaartcertificaat, bedoeld in [artikel 8 van het besluit][ref1], wordt door de minister afgegeven
      volgens het model van deel I, bijlage 3, onderdeel I, van ES-TRIN.

      3 Het aanvullende Uniebinnenvaartcertificaat, bedoeld in [artikel 9 van het besluit][ref2] wordt door de minister
      afgegeven volgens het model van deel I, bijlage 3, onderdeel III, van ES-TRIN.

      4 Het voorlopig certificaat van onderzoek, bedoeld in [artikel 10 van het besluit][ref3], wordt door de minister
      afgegeven volgens het model van deel I, bijlage 3, onderdeel II, van ES-TRIN.

      5 Het certificaat van onderzoek, bedoeld in [artikel 7 van de wet][ref4], wordt, voor de schepen bedoeld in
      [artikel 3.4][ref5], door de minister afgegeven volgens het model van deel I, bijlage 3, onderdeel I, van ES-TRIN.

      6 Het certificaat van onderzoek, bedoeld in [artikel 7 van de wet][ref6], wordt voor bunkerstations door de
      minister afgegeven volgens het model, opgenomen in de bij deze regeling behorende [bijlage 3.10][ref7].

      7 Het certificaat van onderzoek als bedoeld in de Herziene Rijnvaartakte, wordt door de minister afgegeven volgens
      het model van [bijlage B bij het RosR 1995][ref8].


