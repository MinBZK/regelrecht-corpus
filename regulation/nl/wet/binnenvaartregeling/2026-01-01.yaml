  - number: '5.13'
    text: |-
      1 Het vaartijdenboek is niet vereist met betrekking tot veerboten, veerponten en open rondvaartboten.

      2 De gezagvoerder van een veerboot of een veerpont, onderscheidenlijk van een open rondvaartboot draagt er zorg
      voor dat aan boord een scheepsjournaal aanwezig is, onderscheidenlijk ten kantore een scheepsjournaal aanwezig is,
      waarin de volgende gegevens worden vermeld:

      a. de naam van het schip;

      b. het begin en einde van de veerdienst van het schip;

      c. het merk van de teboekstelling of het officiële scheepsnummer;

      d. de leden van de bemanning bij het begin van de dagelijkse veerdienst van het schip met vermelding van naam en
      functie, en vervolgens telkens wanneer deze van samenstelling verandert.
    url: https://wetten.overheid.nl/BWBR0025958/2026-01-01#Artikel5.13
  - number: '5.14'
    text: |-
      1 Bij uitvoering van exploitatiewijze A1 of A2 met een tachograaf is [bijlage 5, onderdeel V, van ES-TRIN]
      (onbekend) van toepassing, alsmede [bijlage 1.4][ref1].

      2 Indien gebruik wordt gemaakt van een tachograaf bewaart de gezagvoerder de registraties van de tachograaf
      gedurende ten minste zes maanden na de laatste aantekening daarop in chronologische volgorde aan boord.


      [ref1]: https://wetten.overheid.nl/BWBR0025958
    url: https://wetten.overheid.nl/BWBR0025958/2026-01-01#Artikel5.14
