  - number: '9.2'
    text: |-
      Degene die daadwerkelijk en bij voortduring leiding geeft aan de vervoersactiviteit van een onderneming bestaande
      uit het bedrijfsmatig vervoer van goederen, anders dan bestemd voor of afkomstig van de eigen onderneming, met
      vaartuigen met een laadvermogen van 50 ton of meer, alsmede de personen bedoeld in [artikel 2.5, eerste lid][ref1],
      zijn verstrekken periodiek over één of meer door het Centraal Bureau voor de Statistiek nader vast te stellen
      tijdvakken en uiterlijk binnen veertien dagen na afloop daarvan aan het Centraal Bureau voor de Statistiek een
      opgave van:

      a. de datum van het vervoer;

      b. de soorten van vervoer;

      c. de scheepsgegevens;

      d. het land, de regio of het gebied en de plaats van lading en lossing, respectievelijk het land, de regio of het
      gebied en plaats van vertrek en aankomst bij leegvaart;

      e. de afstand tussen de plaats of plaatsen van lading en de plaats of plaatsen van lossing, respectievelijk de
      afstand tussen de plaats van vertrek en aankomst bij leegvaart;

      f. het gewicht, uitgedrukt in tonnen, van de vervoerde goederen;

      g. de aard van de vervoerde goederen;

      h. het aantal beladen en lege containers naar grootte;

      i. het identificatienummer, klasse en cijfer van de vervoerde stof in geval van vervoer van gevaarlijke stoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0025958#Artikel2.5
    url: https://wetten.overheid.nl/BWBR0025958/2026-01-01#Artikel9.2
    references:
