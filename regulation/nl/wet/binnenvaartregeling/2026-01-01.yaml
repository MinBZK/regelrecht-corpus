  - number: '5.4'
    text: |-
      1 Bij de exploitatiewijzen A1 en A2 zijn [artikel 18.01, tweede en derde lid, van het Rsp][ref1] en
      [artikel 18.04, vijfde lid, van het Rsp][ref2] van overeenkomstige toepassing.

      2 Ten aanzien van een sleepschip dat niet zelfstandig vaart, en een schip waarvan de
      voortstuwing in een hecht samenstel door een schip of meer andere schepen wordt verzorgd, is
      [artikel 18.01, tweede en derde lid, van het Rsp][ref3] van overeenkomstige toepassing, indien het eerste lid in
      acht wordt genomen op het schip of de schepen die zorg dragen voor de voortstuwing van het hecht samenstel of het
      sleepschip.


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Artikel18.01
      [ref2]: https://wetten.overheid.nl/BWBR0030215#Artikel18.04
