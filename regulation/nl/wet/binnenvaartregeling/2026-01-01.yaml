  - number: '5.21'
    text: |-
      1 Onverminderd [artikel 5.15][ref1] wordt ten aanzien van motorschepen die in exploitatiewijze A2 varen,
      vrijstelling verleend van de ingevolge [artikel 5.6, eerste lid][ref2], voor groep 1 voorgeschreven
      minimumbemanning, mits voldaan wordt aan de volgende voorschriften:

      a. de minimumbemanning bestaat uit een schipper en een stuurman;

      b. het schip is voorzien van de optische hulpmiddelen om te kunnen voldoen aan
      [artikel 1.09, vierde lid, van het Binnenvaartpolitiereglement][ref3];

      c. het schip is bij het begin van de vaart vaarklaar en tijdens de vaart worden geen werkzaamheden verricht die
      betrekking hebben op het laad- of losklaar maken van het schip; en

      d. het schip voldoet blijkens een verklaring van de minister aan de eisen van de Standaard S2.

      2 Ten aanzien van motorschepen die in exploitatiewijze A1 varen, wordt vrijstelling verleend van de ingevolge
      [artikel 5.6, eerste lid][ref4], voor groep 2 voorgeschreven minimumbemanning, mits voldaan wordt aan de volgende
      voorschriften:

      a. de minimumbemanning bestaat uit een schipper en een matroos;

      b. het schip is voorzien van de optische hulpmiddelen om te kunnen voldoen aan
      [artikel 1.09, vierde lid, van het Binnenvaartpolitiereglement][ref5];

      c. het schip is bij het begin van de vaart vaarklaar en tijdens de vaart worden geen werkzaamheden verricht die
      betrekking hebben op het laad- of losklaar maken van het schip; en

      d. het schip voldoet blijkens een verklaring van de minister aan de eisen van de Standaard S2.

      3 Ten aanzien van motorschepen die in exploitatiewijze A2 varen, wordt vrijstelling verleend van de ingevolge
      [artikel 5.6, eerste lid][ref6], voor groep 2 voorgeschreven minimumbemanning, mits voldaan wordt aan de volgende
      voorschriften:

      a. de minimumbemanning bestaat uit een schipper, een stuurman en een lichtmatroos; en

      b. het schip voldoet blijkens een verklaring van de minister aan de eisen van de Standaard S2.

      4 Ten aanzien van motorschepen die in exploitatiewijze A1 varen, wordt vrijstelling verleend van de ingevolge
      [artikel 5.6, eerste lid][ref7], voor groep 3 voorgeschreven minimumbemanning, mits voldaan wordt aan de volgende
      voorschriften:

      a. de minimumbemanning bestaat uit een schipper en een stuurman;

      b. het schip onderbreekt de vaart gedurende de periode tussen 22.00 uur en 06.00 uur;

      c. het schip is bij het begin van de vaart vaarklaar en tijdens de vaart worden geen werkzaamheden verricht die
      betrekking hebben op het laad- of losklaar maken van het schip;

      d. het schip is voorzien van de optische hulpmiddelen om te kunnen voldoen aan
      [artikel 1.09, vierde lid, van het Binnenvaartpolitiereglement][ref8];

      e. het schip is uitgerust met een eenmansstuurstelling voor het varen op radar en voldoet aan artikel 7.13, van ES-
      TRIN; en

      f. het schip voldoet blijkens een verklaring van de minister aan de eisen van de Standaard S2.

      5 Ten aanzien van motorschepen die in exploitatiewijze A2 varen, wordt vrijstelling verleend van de ingevolge
      [artikel 5.6, eerste lid][ref9], voor groep 3 voorgeschreven minimumbemanning, mits voldaan wordt aan de volgende
      voorschriften:

      a. de minimumbemanning bestaat uit twee schippers en één matroos; en

      b. de voorschriften, bedoeld in het vierde lid onder e en f.

      6 Ten aanzien van hechte samenstellen die in exploitatiewijze A2 varen, wordt vrijstelling verleend van de
      ingevolge [artikel 5.6, vierde lid][ref10], voor groep 1 voorgeschreven minimumbemanning, mits voldaan wordt aan
      de volgende voorschriften:

      a. de minimumbemanning bestaat uit een schipper en een stuurman;

      b. het schip is voorzien van de optische hulpmiddelen om te kunnen voldoen aan
      [artikel 1.09, vierde lid, van het Binnenvaartpolitiereglement][ref11];

      c. het schip is bij het begin van de vaart vaarklaar en tijdens de vaart worden geen werkzaamheden verricht die
      betrekking hebben op het laad- of losklaar maken van het schip; en

      d. het schip voldoet blijkens een verklaring van de minister aan de eisen van de Standaard S2.

      7 Ten aanzien van hechte samenstellen die in exploitatiewijze A1 varen, wordt vrijstelling verleend van de
      ingevolge [artikel 5.6, vierde lid][ref12], voor groep 2 voorgeschreven minimumbemanning, mits voldaan wordt aan
      de volgende voorschriften:

      a. de minimumbemanning bestaat uit een schipper en een matroos;

      b. het schip is voorzien van de optische hulpmiddelen om te kunnen voldoen aan
      [artikel 1.09, vierde lid, van het Binnenvaartpolitiereglement][ref13];

      c. het schip is bij het begin van de vaart vaarklaar en tijdens de vaart worden geen werkzaamheden verricht die
      betrekking hebben op het laad- of losklaar maken van het schip; en

      d. het schip voldoet blijkens een verklaring van de minister aan de eisen van de Standaard S2.

      8 Ten aanzien van hechte samenstellen die in exploitatiewijze A2 varen, wordt vrijstelling verleend van de
      ingevolge [artikel 5.6, vierde lid][ref14], voor groep 2 voorgeschreven minimumbemanning, mits voldaan wordt aan
      de volgende voorschriften:

      a. de minimumbemanning bestaat uit een schipper, een stuurman en een lichtmatroos; en

      b. het schip voldoet blijkens een verklaring van de minister aan de eisen van de Standaard S2.

      9 Ten aanzien van hechte samenstellen die in exploitatiewijze A1 varen, wordt vrijstelling verleend van de
      ingevolge [artikel 5.6, vierde lid][ref15], voor groep 3 voorgeschreven minimumbemanning, mits voldaan wordt aan de
      volgende voorschriften:

      a. de minimumbemanning bestaat uit een schipper en een stuurman;

      b. de voorschriften, bedoeld in het vierde lid, onder b tot en met e; en

      c. het schip voldoet blijkens een verklaring van de minister aan de eisen van de Standaard S2.

      10 Ten aanzien van hechte samenstellen die in exploitatiewijze A2 varen, wordt vrijstelling verleend van de
      ingevolge [artikel 5.6, vierde lid][ref16], voor groep 3 voorgeschreven minimumbemanning, mits voldaan wordt aan de
      volgende voorschriften:

      a. de minimumbemanning bestaat uit twee schippers en een matroos; en

      b. de voorschriften, bedoeld in het vierde lid, onder e en f.

      11 Ten aanzien van hechte samenstellen die in exploitatiewijze A1 varen, wordt vrijstelling verleend van de
      ingevolge [artikel 5.6, vierde lid][ref17], voor groep 4 voorgeschreven minimumbemanning, mits voldaan wordt aan de
      volgende voorschriften:

      a. de minimumbemanning bestaat uit een schipper, een stuurman en een matroos; en

      b. de voorschriften, bedoeld in het het vierde lid, onder e en f.

      12 Ten aanzien van hechte samenstellen die in exploitatiewijze A2 varen, wordt vrijstelling verleend van de
      ingevolge [artikel 5.6, vierde lid][ref18], voor groep 4 voorgeschreven minimumbemanning, mits wordt voldaan aan de
      volgende voorschriften:

      a. de minimumbemanning bestaat uit twee schippers en twee matrozen; en

      b. de voorschriften, bedoeld in het vierde lid, onder e en f.


