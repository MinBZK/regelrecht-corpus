  - number: 7.11b
    text: |-
      1 De schipper aan boord van een schip waarvoor een kwalificatiecertificaat schipper vereist is, beschikt over de
      betreffende specifieke vergunning indien het schip vaart:

      a. op wateren die zijn geclassificeerd als binnenwateren van maritieme aard;

      b. op waterwegen die zijn ingedeeld als binnenwatertrajecten met specifieke risico’s;

      c. met behulp van een radar;

      d. met vloeibaar aardgas als brandstof;

      e. met grote konvooien.

      2 De wateren van maritieme aard, bedoeld in [artikel 2, tweede lid, van de wet][ref1], zijn de Westerschelde, de
      Oosterschelde, de Waddenzee, de Eems, de Dollard, het IJsselmeer, het IJmeer en het Markermeer met uitzondering van
      de Gouwzee.


      [ref1]: https://wetten.overheid.nl/BWBR0023009#Artikel2
    url: https://wetten.overheid.nl/BWBR0025958/2026-01-01#Artikel7.11b
