  - number: '12.1'
    text: |-
      1 Op binnenschepen die niet onder het toepassingsbereik van [richtlijn nr. 82/714/EEG](31982L0714) van de Raad
      van de Europese Gemeenschappen van 4 oktober 1982 tot het vaststellen van de technische voorschriften voor
      binnenschepen (PbEG L 301) vielen, maar wel onder het toepassingsbereik van de richtlijn vallen, is artikel 29,
      tweede, derde en vierde lid, van richtlijn (EU) 2016/1629 van toepassing.

      2 Als tekortkomingen die geen klaarblijkelijk gevaar opleveren als bedoeld in artikel 29, tweede lid, tweede
      alinea, van richtlijn (EU) 2016/1629 worden in ieder geval de tekortkomingen gerekend die voor binnenschepen
      als bedoeld in het eerste lid voortvloeien uit de tot het in werking treden van de [wet][ref1] toegepaste
      overgangsbepalingen van het [Binnenschepenbesluit][ref2] zoals dat op dat moment luidde.


      [ref1]: https://wetten.overheid.nl/BWBR0023009
      [ref2]: https://wetten.overheid.nl/BWBR0004196
    url: https://wetten.overheid.nl/BWBR0025958/2026-01-01#Artikel12.1
    references:
      - id: ref1
        bwb_id: BWBR0023009
      - id: ref2
        bwb_id: BWBR0004196
  - number: '12.2'
    text: |-
      Ten aanzien van een binnenschip waarvan het vlak van de grootste toegelaten diepgang bij de laatste
      meting is vastgesteld volgens [artikel 5 van het Metingsbesluit Binnenvaartuigen 1978][ref1],
      zoals dit luidde voor de inwerkingtreding van het
      [besluit van 23 maart 1998, houdende wijziging van het Metingsbesluit Binnenvaartuigen 1978][ref2], kan bij
      hermeting het vlak van de grootste toegelaten diepgang op verzoek van de belanghebbende worden vastgesteld met
      toepassing van dat artikel, mits het vaartuig sinds de laatste meting geen verbouwing heeft ondergaan die van
      invloed kan zijn op de vaststelling van dat vlak.


      [ref1]: https://wetten.overheid.nl/BWBR0003246#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0009497
    url: https://wetten.overheid.nl/BWBR0025958/2026-01-01#Artikel12.2
    references:
      - id: ref1
        bwb_id: BWBR0003246
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0009497
  - number: '12.3'
    text: |-
      1 Klein vaarbewijzen en groot pleziervaartbewijzen, afgegeven krachtens deze regeling tot 1 januari 2020 blijven
      geldig totdat hun geldigheid is verstreken.

      2 Dienstboekjes, vaartijdenboeken, Rijnpatenten, attesten en andere documenten, afgegeven vóór 1 juli
      2011 op grond van [hoofdstuk 23 van het RosR 1995][ref1], het [Patentreglement Rijn][ref2] of het
      [Reglement betreffende veiligheidspersoneel aan boord van passagiersschepen][ref3], blijven geldig totdat hun
      geldigheid is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0025973
      [ref2]: https://wetten.overheid.nl/BWBR0026045
      [ref3]: https://wetten.overheid.nl/BWBR0025994
