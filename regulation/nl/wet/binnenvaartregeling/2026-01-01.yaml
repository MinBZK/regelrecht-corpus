  - number: 2.10a
    text: |-
      1 De schipper en de bij de bunkerprocedure betrokken bemanningsleden van schepen die vloeibaar aardgas (LNG)
      als brandstof gebruiken, moeten over een deskundigheid aangaande het gebruik van vloeibaar aardgas als brandstof
      beschikken.

      2 De deskundigheid aangaande het gebruik van vloeibaar aardgas als brandstof kan worden aangetoond door het
      beschikken over:

      a. een kwalificatiecertificaat voor deskundigen op het gebied van vloeibaar aardgas (LNG) als bedoeld in
      [artikel 7.19a, derde lid][ref1];

      b. een CCR-kwalificatiecertificaat voor deskundigen op het gebied van vloeibaar aardgas (LNG) als bedoeld in
      [artikel 15.02, eerste lid, van het Rsp][ref2]; of

      c. een verklaring van deskundigheid aangaande het gebruik van vloeibaar aardgas (LNG) als brandstof, bedoeld in
      [artikel 20.10 van het Rsp][ref3].


