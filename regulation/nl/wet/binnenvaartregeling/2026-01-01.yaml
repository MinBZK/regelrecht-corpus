        bwb_id: BWBR0025958
  - number: 8.3a
    text: |-
      Van de verplichting bedoeld in [artikel 2, tweede lid, van het Binnenvaartbesluit][ref1], zijn vrijgesteld
      veerponten die de stroom dwars oversteken.


      [ref1]: https://wetten.overheid.nl/BWBR0025631#Artikel2
    url: https://wetten.overheid.nl/BWBR0025958/2026-01-01#Artikel8.3a
    references:
      - id: ref1
        bwb_id: BWBR0025631
        artikel: '2'
  - number: '8.4'
    text: |-
      Als geëigend document, bedoeld in [artikel 2, tweede lid, onderdeel c, van het besluit][ref1], zijn aangewezen
      de attesten, bedoeld in artikel 2, derde lid, van [Verordening (EEG) nr. 3921/91](31991R3921) van de Raad van
      de Europese Gemeenschappen van16 december 1991 tot vaststelling van de voorwaarden waaronder vervoersondernemers
      worden toegelaten tot binnenlands goederen- en personenvervoer over de binnenwateren in een Lid-Staat waar zij niet
      gevestigd zijn (PbEG L 373).


      [ref1]: https://wetten.overheid.nl/BWBR0025631#Artikel2
    url: https://wetten.overheid.nl/BWBR0025958/2026-01-01#Artikel8.4
    references:
      - id: ref1
        bwb_id: BWBR0025631
        artikel: '2'
  - number: '8.5'
    text: |-
      De houder van een document van toelating draagt er zorg voor dat dit document op een van de volgende wijzen kan
      worden gecontroleerd:

      a. aan boord van het binnenschip, waarvoor het document is afgegeven; of

      b. ten kantore van de eigenaar of de exploitant van dat binnenschip.
    url: https://wetten.overheid.nl/BWBR0025958/2026-01-01#Artikel8.5
  - number: '9.1'
    text: |-
      Het registratienummer, bedoeld in [artikel 30 van het besluit][ref1], wordt op het binnenschip aangebracht op de
      plaats en wijze, bedoeld in [artikel 2.01, eerste lid, onder a, van het Rijnvaartpolitiereglement 1995][ref2] met
      inachtneming van het bepaalde in [artikel 2.01, derde lid, van dat reglement][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0025631#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0006923#Artikel2.01
      [ref3]: https://wetten.overheid.nl/BWBR0006923#Artikel2.01
