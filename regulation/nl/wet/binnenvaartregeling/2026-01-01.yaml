  - number: '1.5'
    text: |-
      1 De verplichting tot het aan boord hebben van documenten, afgegeven ingevolge of krachtens de [wet][ref1], geldt
      niet voor de volgende vaartuigen:

      a. bokken;

      b. kranen;

      c. baggermolens;

      d. hopperzuigers;

      e. elevatoren;

      f. schepen zonder verblijven, zoals duwbakken, dekschuiten, pontons;

      g. open rondvaartboten, behalve ten aanzien van de verplichting met betrekking tot het vaarbewijs en mits het
      certificaat van onderzoek ter plaatse waar de rondvaarten beginnen, aanwezig is;

      h. binnenschepen waarvoor ingevolge [artikel 785, tweede lid, van boek 8 van het Burgerlijk Wetboek][ref2]
      geen verplichting tot teboekstelling bestaat, behalve motorboten als bedoeld in
      [artikel 16, onderdeel d, van het besluit][ref3] ten aanzien van de verplichting met betrekking tot het vaarbewijs.

      2 De vrijstelling voor de in het eerste lid, onderdeel f, genoemde schepen geldt alleen indien:

      a. op het schip een metalen plaat is aangebracht waarop staan vermeld het certificaatnummer, de zone,
      onderscheidenlijk zones waarvoor het certificaat van onderzoek geldig is en de datum tot welke het certificaat
      geldig is;

      b. de vermeldingen, bedoeld in onderdeel a, in goed leesbare letters en cijfers met een diepte van ten minste 6 mm
      zijn ingehakt en de metalen plaat, bedoeld in onderdeel a, een hoogte van ten minste 60 mm en een lengte van ten
      minste 120 mm heeft en op het achterschip aan stuurboordzijde op een goed zichtbare plaats is bevestigd;

      c. de overeenstemming tussen de vermeldingen op de plaat en de aantekeningen in het certificaat is bevestigd
      door een ambtenaar van de Inspectie Leefomgeving en Transport door middel van het aanbrengen van een stempel op
      de plaat;

      d. bij gebruik van het schip op de in Nederland gelegen binnenwateren het certificaat bij de eigenaar van het schip
      in bewaring is; en

      e. bij grensoverschrijding het certificaat aan boord is van het schip dat het duwstel, gekoppeld samenstel of de
      sleep voortbeweegt.


      [ref1]: https://wetten.overheid.nl/BWBR0023009
