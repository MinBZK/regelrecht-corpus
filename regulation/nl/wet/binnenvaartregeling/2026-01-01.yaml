  - number: '3.5'
    text: |-
      1 Onverminderd [artikel 1.6, eerste lid][ref1], kunnen binnenschepen op de zone R eveneens voldoen aan de
      technische voorschriften, bedoeld in ES-TRIN, voor zover zij over een Uniebinnenvaartcertificaat beschikken, ten
      bewijze van de volledige conformiteit van het binnenschip met de in ES-TRIN en de in bijlage V bij richtlijn (EU)
      2016/1629 bedoelde technische voorschriften, waarvan de gelijkwaardigheid met de bij of krachtens de Herziene
      Rijnvaartakte bepaalde technische voorschriften is vastgesteld overeenkomstig de toepasselijke voorschriften en
      procedures.

      2 Bij de toepassing van het eerste lid is [paragraaf 2 van dit hoofdstuk][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0025958#Artikel1.6
