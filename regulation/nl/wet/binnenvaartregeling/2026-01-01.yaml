  - number: '7.19'
    text: |-
      1 De aanvrager die voor de afgifte van een specifieke vergunning voor het varen op binnenwateren van maritieme aard
      in aanmerking wil komen beschikt over verklaring als bedoeld in [artikel 7.17][ref1].

      2 De aanvrager die voor de afgifte van een specifieke vergunning voor het varen op waterwegen die zijn ingedeeld
      als binnenwatertrajecten met specifieke risico’s in aanmerking wil komen beschikt over de relevante verklaring,
      bedoeld in [artikel 7.17][ref2].

      3 De aanvrager die voor de afgifte van een specifieke vergunning voor radarvaart in aanmerking wil
      komen beschikt over een verklaring als bedoeld in [artikel 7.17][ref3], over een radarpatent, bedoeld in
      [artikel 20.09, van het Rsp][ref4], of kan aantonen dat het diploma kapitein binnenvaart of schipper binnenvaart
      zoals opgenomen in de Registratie instellingen en opleidingen onder de respectieve opleidingscodes 10650,
      25511, 25612, 93110, 95640, 25972, 10651, 25510, 25971, 25635, 91900, 95630 dan wel het onderdeel radar van die
      opleidingen is behaald.

      4 De afgifte van een specifieke vergunning voor het gebruik van vloeibaar aardgas als brandstof vindt plaats in
      de vorm van een kwalificatiecertificaat voor deskundigen op het gebied van vloeibaar aardgas (LNG), bedoeld in
      [artikel 7.19a, derde lid][ref5].

      5 De aanvrager die voor de afgifte van een specifieke vergunning voor het varen in grote konvooien in aanmerking
      wil komen heeft een vaartijd opgebouwd van ten minste 720 dagen, waarvan ten minste 540 dagen als schipper en ten
      minste 180 dagen als begeleider van een groot konvooi.

      6 De afgifte van de specifieke vergunningen zoals bedoeld in het eerste tot en met het derde lid en het vijfde lid
      vindt plaats door aantekening op het kwalificatiecertificaat schipper of het CCR-kwalificatiecertificaat schipper
      van de aanvrager en wordt bij een verlenging van het kwalificatiecertificaat opnieuw aangetekend.

      7 In afwijking van het zesde lid, wordt indien de aanvrager geen houder is van een kwalificatiecertificaat schipper
      of CCR-kwalificatiecertificaat schipper maar wel houder is van een als gelijkwaardig erkend vaarbewijs als bedoeld
      in [artikel 17, tweede lid, van het besluit][ref6], de specifieke vergunning als een losse verklaring afgegeven.


