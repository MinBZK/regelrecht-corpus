  - number: '7.11'
    text: |-
      1 De in [bijlage 7.1][ref1] genoemde buitenlandse bewijzen van vaarbekwaamheid worden erkend als bedoeld in
      [artikel 17, vierde lid, onderdeel a, van het besluit][ref2].

      2 Buitenlandse kwalificatiecertificaten, dienstboekjes, specifieke vergunningen en vaartijdenboeken die in een
      andere EU-lidstaat zijn afgegeven overeenkomstig de eisen gesteld in [richtlijn 2017/2397](32017L2397) zijn geldig
      in plaats van de vergelijkbare vaardocumenten die geldig zijn op grond van deze regeling.

      3 De in [artikel 17, tweede lid, van het besluit][ref3] bedoelde, krachtens de Herziene Rijnvaartakte afgegeven,
      bewijzen van vaarbevoegdheid zijn:

      a. een CCR-kwalificatiecertificaat schipper als bedoeld in [artikel 11.01, eerste lid, van het Rsp][ref4] of een
      krachtens [artikel 20.03, eerste lid, van dat reglement][ref5] geldig Rijnschipperspatent als gelijkwaardig aan het
      kwalificatiecertificaat schipper en het klein vaarbewijs;

      b. het sportpatent als bedoeld in [artikel 11.02, onder b, van het Rsp][ref6], als gelijkwaardig aan het klein
      vaarbewijs.

      4 Buitenlandse bewijzen van vaarbevoegdheid die zijn erkend op grond van artikel 10,
      derde lid, van [richtlijn 2017/2397](32017L2397) gelden als erkend zoals bedoeld in
      [artikel 17, vierde lid, onderdeel a, van het besluit][ref7].

      5 Buitenlandse bewijzen van kennis en bekwaamheid die zijn erkend op grond van artikel 10, derde lid, van
      [richtlijn 2017/2397](32017L2397) zijn geldig als vervanging van de vergelijkbare documenten die geldig zijn op
      grond van deze regeling.


