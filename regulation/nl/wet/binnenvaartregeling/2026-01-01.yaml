  - number: '5.9'
    text: |-
      Een vrouw, die krachtens arbeidsovereenkomst dan wel publiekrechtelijke aanstelling arbeid verricht, maakt geen
      deel uit van de minimumbemanning gedurende ten minste 14 weken rondom de vermoedelijke datum van haar bevalling,
      waarvan ten minste 6 weken vóór deze datum en ten minste 7 weken na de datum van de bevalling liggen.
    url: https://wetten.overheid.nl/BWBR0025958/2026-01-01#Artikel5.9
  - number: '5.10'
    text: |-
      Ten aanzien van zeeschepen die voldoen aan de bepalingen van Resolutie A. 890 (21) van de Internationale Maritieme
      Organisatie van 25 november 1999 en het op 7 juli 1978 te Londen tot stand gekomen Verdrag betreffende de normen
      van zeevarenden inzake opleiding, diplomering en wachtdienst, met bijlage, (Trb. 1981, 144 en 1992, 109) is
      [artikel 19.07 van het Rsp][ref1] van overeenkomstige toepassing, met dien verstande dat onder een persoon die
      houder is van een kwalificatiecertificaat schipper een persoon wordt verstaan die in het bezit is van een document
      als bedoeld in [artikel 2.9, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Artikel19.07
      [ref2]: https://wetten.overheid.nl/BWBR0025958#Artikel2.9
