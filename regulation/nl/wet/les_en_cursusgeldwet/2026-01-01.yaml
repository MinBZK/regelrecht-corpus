  - number: '7'
    text: Het toezicht op de naleving van het bij of krachtens deze wet bepaalde is opgedragen aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0004188/2026-01-01#Artikel7
  - number: '8'
    text: |-
      Indien het bevoegd gezag van een bijzondere of openbare instelling of cursus de bij of krachtens deze wet gegeven
      voorschriften niet nakomt, kan Onze Minister besluiten dat de vergoeding uit de openbare kas geheel of gedeeltelijk
      wordt ingehouden.
    url: https://wetten.overheid.nl/BWBR0004188/2026-01-01#Artikel8
  - number: '9'
    text: |-
      1 Degene die op de eerste dag van het studiejaar de leeftijd van 18 jaren heeft bereikt en uit de openbare
      kas bekostigd onderwijs volgt aan een instelling, maar niet is ingeschreven, is deswege aan Onze Minister een
      schadevergoeding verschuldigd gelijk aan het voor het desbetreffende studiejaar verschuldigde bedrag aan lesgeld.

      2 Degene die uit de openbare kas bekostigd onderwijs volgt aan een cursus, maar niet is ingeschreven, is deswege
      aan Onze Minister een schadevergoeding verschuldigd gelijk aan het voor het desbetreffende studiejaar ten hoogste
      verschuldigde bedrag voor het volgen van het onderwijs aan de desbetreffende cursus.
    url: https://wetten.overheid.nl/BWBR0004188/2026-01-01#Artikel9
  - number: 9a
    text: |-
      Onze Minister vaardigt een dwangbevel uit aan de nalatige, indien het bij of krachtens deze wet verschuldigde
      lesgeld geheel of gedeeltelijk niet tijdig is voldaan.
    url: https://wetten.overheid.nl/BWBR0004188/2026-01-01#Artikel9a
  - number: 9b
    text: |-
      Onze Minister kan voor bepaalde gevallen de wet en de daarop berustende bepalingen buiten toepassing laten of
      daarvan afwijken voor zover toepassing gelet op het belang dat deze wet beoogt te beschermen, zal leiden tot een
      onbillijkheid van overwegende aard.
    url: https://wetten.overheid.nl/BWBR0004188/2026-01-01#Artikel9b
  - number: '10'
    text: |-
      Het bedrag van het lesgeld, bedoeld in [artikel 5, tweede lid][ref1], wordt voor het cursusjaar 1987-1988
      vastgesteld op f 1030. De derde volzin van het derde lid van genoemd artikel vindt voor het eerst toepassing met
      betrekking tot het cursusjaar 1988-1989.


      [ref1]: https://wetten.overheid.nl/BWBR0004188#Artikel5
    url: https://wetten.overheid.nl/BWBR0004188/2026-01-01#Artikel10
