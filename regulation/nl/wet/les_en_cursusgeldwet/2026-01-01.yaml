preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het in verband met de toestand van ’s Rijks financiën alsmede in
    verband met ontwikkelingen op het gebied van de studiefinanciering wenselijk is over te gaan tot uitbreiding van de
    lesgeldregeling tot de groep van 16- tot 18-jarigen en voorts de Lesgeldwet voor boven 17-jarigen (Stb. 1986, 250)
    te vervangen en genoemde wet alsmede de School- en cursusgeldwet 1972 (Stb. 1983, 360) in te trekken;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0004188/2026-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt, voor zover niet anders bepaald, verstaan onder:

        - *bevoegd gezag:* orgaan dat als zodanig wordt aangeduid in de wettelijke regeling op grond waarvan de
      desbetreffende instelling of cursus wordt bekostigd;
        - *cursus:* 1°. cursus in de zin van de [Wet voortgezet onderwijs 2020][ref1]; 2°. onderwijs aan een instelling
      voor voortgezet onderwijs als bedoeld in [artikel 2.86 van de Wet voortgezet onderwijs 2020][ref2], voor zover
      het geen volledig onderwijs betreft; 3°. op grond van de [Experimentenwet onderwijs][ref3] uit de openbare kas
      bekostigde cursus, voor zover het voortgezet onderwijs betreft; 4°. beroepsopleiding of opleiding voortgezet
      algemeen volwassenenonderwijs als bedoeld in de [Wet educatie en beroepsonderwijs][ref4], die aan een regionaal
      opleidingencentrum of beroepscollege als bedoeld in de Wet educatie en beroepsonderwijs ten laste van ’s Rijks kas
      wordt verzorgd, niet gevolgd aan een instelling;
        - *instelling:* instelling als bedoeld in de [Wet educatie en beroepsonderwijs][ref5],
      voor zover het betreft een beroepsopleiding in de beroepsopleidende leerweg als bedoeld
      in die wet of een opleiding voortgezet algemeen volwassenenonderwijs die voldoet aan
      [artikel 2.17 van de Wet tegemoetkoming onderwijsbijdrage en schoolkosten][ref6];
        - *onderwijsdeelnemer:* degene die is toegelaten tot het onderwijs aan een instelling of cursus als bedoeld in
      [artikel 2][ref7];
        - *onderwijsnummer:* door Onze Minister uitgegeven persoonsgebonden nummer, toegekend aan een persoon aan wie niet
      van overheidswege een burgerservicenummer is verstrekt;
        - *Onze Minister:* Onze Minister van Onderwijs, Cultuur en Wetenschap;
        - *studiejaar:* het tijdvak van 1 augustus tot en met 31 juli daaropvolgend.


