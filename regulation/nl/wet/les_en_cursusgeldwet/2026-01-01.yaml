        artikel: '4'
  - number: '6'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur wordt bepaald voor welke uit de openbare kas bekostigde cursussen
      cursusgeld verschuldigd is.

      2 Degene die tot het onderwijs aan een cursus is toegelaten, dient zich om in een bepaald studiejaar onderwijs te
      kunnen volgen, te laten inschrijven.

      3 Tot de inschrijving wordt niet overgegaan dan nadat het bewijs is overgelegd dat het verschuldigde cursusgeld is
      of zal worden voldaan.

      4 De hoogte van het cursusgeld, bedoeld in het eerste lid, wordt bij algemene maatregel van bestuur vastgesteld.
      Bij of krachtens algemene maatregel van bestuur worden tevens voorschriften vastgesteld over de heffing en
      voldoening van het cursusgeld en de in het tweede lid bedoelde inschrijving.

      5 Bij of krachtens algemene maatregel van bestuur kunnen voorschriften worden vastgesteld met betrekking tot de
      vrijstelling, vermindering en terugbetaling van het cursusgeld.

      6 In aanvulling op het derde lid wordt niet overgegaan tot inschrijving als bedoeld in
      [artikel 8.1.1, eerste lid, van de Wet educatie en beroepsonderwijs][ref1], dan nadat een meerderjarige
      onderwijsdeelnemer die niet zelf het cursusgeld voldoet, schriftelijk heeft verklaard dat hij ermee instemt dat een
      in die verklaring vermelde derde namens hem het cursusgeld voldoet.

      7 Het bij algemene maatregel van bestuur vastgestelde bedrag, bedoeld in het vierde lid, wordt jaarlijks aan de
      hand van de consumentenprijsindex geïndexeerd, op de wijze bij of krachtens algemene maatregel van bestuur bepaald.
      Bij algemene maatregel van bestuur wordt tevens bepaald wat onder de consumentenprijsindex wordt verstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8.1.1
    url: https://wetten.overheid.nl/BWBR0004188/2026-01-01#Artikel6
