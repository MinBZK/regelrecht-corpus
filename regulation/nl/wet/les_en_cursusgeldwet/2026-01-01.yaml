  - number: '2'
    text: |-
      Ter zake van uit de openbare kas bekostigd onderwijs aan een instelling of uit de openbare kas bekostigde cursussen
      wordt lesgeld onderscheidenlijk cursusgeld geheven met inachtneming van de bepalingen van deze wet. Ter zake
      van het volgen van onderwijs in het kader van contractactiviteiten wordt geen lesgeld of cursusgeld volgens de
      bepalingen van deze wet geheven.
    url: https://wetten.overheid.nl/BWBR0004188/2026-01-01#Artikel2
  - number: '3'
    text: |-
      1 Lesgeld is verschuldigd ter zake van het door een onderwijsdeelnemer die op de eerste dag van het desbetreffende
      studiejaar de leeftijd van 18 jaren heeft bereikt, volgen van uit de openbare kas bekostigd onderwijs - daaronder
      begrepen de van het onderwijs deel uitmakende praktijktijd - aan een instelling.

      2 Het lesgeld is door de onderwijsdeelnemer verschuldigd per studiejaar en wordt voldaan aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0004188/2026-01-01#Artikel3
  - number: '4'
    text: |-
      1 Een onderwijsdeelnemer die op de eerste dag van een studiejaar de leeftijd van 18 jaren heeft bereikt, dient zich
      om in dat studiejaar onderwijs te kunnen volgen, te laten inschrijven.

      2 De inschrijving geschiedt door of namens het bevoegd gezag. Aan de desbetreffende onderwijsdeelnemer wordt een
      bewijs van inschrijving verstrekt.

      3 De onderwijsdeelnemer wordt ingeschreven voor het gehele studiejaar, voor zover niet bij of krachtens algemene
      maatregel van bestuur anders is bepaald.

      4 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot de inschrijving.
    url: https://wetten.overheid.nl/BWBR0004188/2026-01-01#Artikel4
  - number: '5'
    text: |-
      1 Zodra de student zich heeft ingeschreven ontstaat van rechtswege de verplichting tot betaling van het wettelijk
      lesgeld.

      2 De hoogte van het lesgeld wordt bij algemene maatregel van bestuur vastgesteld.

      3 Het bij algemene maatregel van bestuur vastgestelde bedrag, bedoeld in het tweede lid, wordt jaarlijks aan de
      hand van de consumentenprijsindex geïndexeerd, op de wijze bij of krachtens algemene maatregel van bestuur bepaald.
      Bij algemene maatregel van bestuur wordt tevens bepaald wat onder de consumentenprijsindex wordt verstaan.

      4 Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot de voldoening en de
      vrijstelling, vermindering en terugbetaling van het lesgeld, alsmede met betrekking tot de te verstrekken gegevens,
      waaronder het burgerservicenummer of onderwijsnummer.
    url: https://wetten.overheid.nl/BWBR0004188/2026-01-01#Artikel5
  - number: 5a
    text: |-
      Onze Minister gebruikt het burgerservicenummer of onderwijsnummer van de onderwijsdeelnemer ter zake van de
      uitvoering van deze wet als registratienummer slechts:

      a. in het verkeer met de onderwijsdeelnemer op wie het nummer betrekking heeft;

      b. in contacten met personen en instanties voor zover deze zelf gemachtigd zijn tot het opnemen van het
      burgerservicenummer of onderwijsnummer in een persoonsregistratie;

      c. teneinde de gegevens van de onderwijsdeelnemer te vergelijken met de gegevens die over hem zijn opgenomen in het
      register onderwijsdeelnemers, bedoeld in [artikel 4 van de Wet register onderwijsdeelnemers][ref1], voorzover dat
      noodzakelijk is voor de uitvoering van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0042012#Artikel4
    url: https://wetten.overheid.nl/BWBR0004188/2026-01-01#Artikel5a
    references:
