        hoofdstuk: II
  - number: '11'
    text: |-
      1 De Lesgeldwet voor boven 17-jarigen in het voortgezet onderwijs (*Stb.* 1986, 250) wordt ingetrokken.

      2 Het bepaalde bij of krachtens die wet blijft van toepassing voor zover het betreft lesgeld verschuldigd dan wel
      voldaan met betrekking tot het cursusjaar 1986-1987.

      3 Het Uitvoeringsbesluit Lesgeldwet (*Stb.* 1986, 421) strekt met ingang van de datum, bedoeld in
      [artikel 21, eerste lid][ref1], tot uitvoering van de [artikelen 4, derde en vierde lid][ref2], en
      [5, vierde lid][ref3], totdat bedoelde maatregelen krachtens deze wet zijn vastgesteld.


