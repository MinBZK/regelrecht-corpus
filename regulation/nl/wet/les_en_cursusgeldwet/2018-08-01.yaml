      - id: ref2
        bwb_id: BWBR0007625
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '1'
  - number: 1.g
    text: |-
      onderwijsnummer: het door Onze Minister uitgegeven persoonsgebonden nummer, toegekend aan een persoon aan wie niet
      van overheidswege een burgerservicenummer is verstrekt;
    url: https://wetten.overheid.nl/BWBR0004188/2018-08-01#Artikel1
  - number: 1.k
    text: 'school: een dagschool, als bedoeld in deze wet.'
    url: https://wetten.overheid.nl/BWBR0004188/2018-08-01#Artikel1
  - number: '2'
    text: |-
      Ter zake van uit de openbare kas bekostigd onderwijs aan een dagschool of uit de openbare kas bekostigde cursussen
      wordt lesgeld onderscheidenlijk cursusgeld geheven met inachtneming van de bepalingen van deze wet. Ter zake
      van het volgen van onderwijs in het kader van contractactiviteiten wordt geen lesgeld of cursusgeld volgens de
      bepalingen van deze wet geheven.
    url: https://wetten.overheid.nl/BWBR0004188/2018-08-01#Artikel2
  - number: '3.1'
    text: |-
      Lesgeld is verschuldigd ter zake van het door een leerling die op de eerste dag van het desbetreffende cursusjaar
      de leeftijd van 18 jaren heeft bereikt, volgen van uit de openbare kas bekostigd onderwijs - daaronder begrepen de
      van het onderwijs deel uitmakende praktijktijd - aan een dagschool.
    url: https://wetten.overheid.nl/BWBR0004188/2018-08-01#Artikel3
  - number: '3.2'
    text: Het lesgeld is door de leerling verschuldigd per cursusjaar en wordt voldaan aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0004188/2018-08-01#Artikel3
  - number: '4.1'
    text: |-
      Een leerling die op de eerste dag van een cursusjaar de leeftijd van 18 jaren heeft bereikt, dient zich om in dat
      cursusjaar onderwijs te kunnen volgen, te laten inschrijven.
    url: https://wetten.overheid.nl/BWBR0004188/2018-08-01#Artikel4
  - number: '4.2'
    text: |-
      De inschrijving geschiedt door of namens het bevoegd gezag. Aan de desbetreffende leerling wordt een bewijs van
      inschrijving verstrekt.
    url: https://wetten.overheid.nl/BWBR0004188/2018-08-01#Artikel4
  - number: '4.3'
    text: |-
      De leerling wordt ingeschreven voor het gehele cursusjaar, voor zover niet bij of krachtens algemene maatregel van
      bestuur anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0004188/2018-08-01#Artikel4
  - number: '4.4'
    text: Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot de inschrijving.
    url: https://wetten.overheid.nl/BWBR0004188/2018-08-01#Artikel4
  - number: '5.1'
    text: |-
      Tot de inschrijving wordt niet overgegaan dan nadat het bewijs is overgelegd dat het lesgeld wordt voldaan aan Onze
      Minister, met inachtneming van het bepaalde krachtens het vierde lid.
    url: https://wetten.overheid.nl/BWBR0004188/2018-08-01#Artikel5
  - number: '5.2'
    text: |-
      Het lesgeld bedraagt naar de maatstaf van 1 augustus 2004 € 936,– . Dit bedrag wordt jaarlijks geïndexeerd aan
      de hand van de consumentenprijsindex. Het bedrag wordt vastgesteld bij ministeriële regeling, waarin tevens wordt
      bepaald wat onder de consumentenprijsindex wordt verstaan. Het bedrag wordt afgerond op het naastbij gelegen gehele
      getal. Deze regeling wordt vastgesteld voor 1 oktober voorafgaand aan het cursusjaar waarop de herziening van het
      lesgeld betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0004188/2018-08-01#Artikel5
  - number: '5.3'
    text: |-
      De indexering wordt bepaald door de procentuele wijziging die het indexcijfer van de consumentenprijs over de maand
      april, voorafgaand aan de aanpassing, heeft ondergaan ten opzichte van de maand april van het daaraan voorafgaande
      jaar.
    url: https://wetten.overheid.nl/BWBR0004188/2018-08-01#Artikel5
  - number: '5.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot de voldoening en de
      vrijstelling, vermindering en terugbetaling van het lesgeld, alsmede met betrekking tot de te verstrekken gegevens,
      waaronder het burgerservicenummer of onderwijsnummer.
    url: https://wetten.overheid.nl/BWBR0004188/2018-08-01#Artikel5
  - number: 5a
    text: |-
      Onze Minister gebruikt het burgerservicenummer of onderwijsnummer van de leerling ter zake van de uitvoering van
      deze wet als registratienummer slechts:
    url: https://wetten.overheid.nl/BWBR0004188/2018-08-01#Artikel5a
  - number: 5a.a
    text: in het verkeer met de leerling op wie het nummer betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0004188/2018-08-01#Artikel5a
  - number: 5a.b
    text: |-
      in contacten met personen en instanties voor zover deze zelf gemachtigd zijn tot het opnemen van het
      burgerservicenummer of onderwijsnummer in een persoonsregistratie;
    url: https://wetten.overheid.nl/BWBR0004188/2018-08-01#Artikel5a
  - number: 5a.c
    text: |-
      teneinde de gegevens van de leerling te vergelijken met de gegevens die over hem zijn opgenomen in het
      basisregister onderwijs, bedoeld in [artikel 24b van de Wet op het onderwijstoezicht][ref1], voorzover dat
      noodzakelijk is voor de uitvoering van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel24b
    url: https://wetten.overheid.nl/BWBR0004188/2018-08-01#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: 24b
  - number: 5b
    text: |-
      Onze Minister kan aan onze minister ten behoeve van de bekostiging van instellingen gegevens verstrekken over
      het in [artikel 5, eerste lid][ref1], bedoelde bewijs voor zover het personen betreft die zijn opgenomen in het
      basisregister onderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0004188#Artikel5
    url: https://wetten.overheid.nl/BWBR0004188/2018-08-01#Artikel5b
    references:
      - id: ref1
        bwb_id: BWBR0004188
        artikel: '5'
        hoofdstuk: II
  - number: '6.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur wordt bepaald voor welke uit de openbare kas bekostigde cursussen
      cursusgeld verschuldigd is.
    url: https://wetten.overheid.nl/BWBR0004188/2018-08-01#Artikel6
  - number: '6.2'
    text: |-
      Degene die tot het onderwijs aan een cursus is toegelaten, dient zich om in een bepaald cursusjaar onderwijs te
      kunnen volgen, te laten inschrijven.
    url: https://wetten.overheid.nl/BWBR0004188/2018-08-01#Artikel6
  - number: '6.3'
    text: |-
      Tot de inschrijving wordt niet overgegaan dan nadat het bewijs is overgelegd dat het verschuldigde cursusgeld is of
      zal worden voldaan.
    url: https://wetten.overheid.nl/BWBR0004188/2018-08-01#Artikel6
  - number: '6.4'
    text: |-
      Het in het eerste lid bedoelde cursusgeld, alsmede de heffing en de voldoening daarvan, en de in het tweede lid
      bedoelde inschrijving worden geregeld bij of krachtens algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0004188/2018-08-01#Artikel6
  - number: '6.5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voorschriften worden vastgesteld met betrekking tot de
      vrijstelling, vermindering en terugbetaling van het cursusgeld.
    url: https://wetten.overheid.nl/BWBR0004188/2018-08-01#Artikel6
  - number: '6.6'
    text: |-
      In aanvulling op het derde lid wordt niet overgegaan tot inschrijving als bedoeld in
      [artikel 8.1.1, eerste lid, van de Wet educatie en beroepsonderwijs][ref1], dan nadat een meerderjarige leerling
      die niet zelf het cursusgeld voldoet, schriftelijk heeft verklaard dat hij ermee instemt dat een in die verklaring
      vermelde derde namens hem het cursusgeld voldoet.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8
    url: https://wetten.overheid.nl/BWBR0004188/2018-08-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '8'
  - number: '6.7'
    text: |-
      De algemene maatregel van bestuur, bedoeld in het vierde lid, wordt aan de Tweede Kamer der Staten-Generaal
      overgelegd. De maatregel treedt niet in werking dan nadat vier weken na de overlegging zijn verstreken, en
      gedurende die termijn niet door of namens de Kamer de wens wordt te kennen gegeven tot overleg over de maatregel.
      Het bepaalde in de vorige twee volzinnen blijft buiten toepassing, indien het ontwerp van de maatregel voordien aan
      de Kamer is voorgelegd en door of namens de Kamer te kennen is gegeven dat aan overlegging van de maatregel geen
      behoefte bestaat.
    url: https://wetten.overheid.nl/BWBR0004188/2018-08-01#Artikel6
  - number: '7.1'
    text: Het toezicht op de naleving van het bij of krachtens deze wet bepaalde is opgedragen aan Onze minister.
    url: https://wetten.overheid.nl/BWBR0004188/2018-08-01#Artikel7
  - number: '8'
    text: |-
      Indien het bevoegd gezag van een bijzondere of een gemeentelijke school of cursus de bij of krachtens deze wet
      gegeven voorschriften niet nakomt, kan Onze minister besluiten dat de vergoeding uit de openbare kas geheel of
      gedeeltelijk wordt ingehouden.
    url: https://wetten.overheid.nl/BWBR0004188/2018-08-01#Artikel8
  - number: '9.1'
    text: |-
      Degene die op de eerste dag van het cursusjaar de leeftijd van 18 jaren heeft bereikt en uit de openbare
      kas bekostigd onderwijs volgt aan een dagschool, maar niet is ingeschreven, is deswege aan Onze Minister een
      schadevergoeding verschuldigd gelijk aan het voor het desbetreffende cursusjaar verschuldigde bedrag aan lesgeld.
    url: https://wetten.overheid.nl/BWBR0004188/2018-08-01#Artikel9
  - number: '9.2'
    text: |-
      Degene die uit de openbare kas bekostigd onderwijs volgt aan een cursus, maar niet is ingeschreven, is deswege
      aan Onze Minister een schadevergoeding verschuldigd gelijk aan het voor het desbetreffende cursusjaar ten hoogste
      verschuldigde bedrag voor het volgen van het onderwijs aan de desbetreffende cursus.
    url: https://wetten.overheid.nl/BWBR0004188/2018-08-01#Artikel9
  - number: 9a
    text: |-
      Onze Minister vaardigt een dwangbevel uit aan de nalatige, indien het bij of krachtens deze wet verschuldigde
      lesgeld geheel of gedeeltelijk niet tijdig is voldaan.
    url: https://wetten.overheid.nl/BWBR0004188/2018-08-01#Artikel9a
  - number: 9b
    text: |-
      Onze Minister kan voor bepaalde gevallen de wet buiten toepassing laten of daarvan afwijken voorzover toepassing
      gelet op het belang dat deze wet beoogt te beschermen, zal leiden tot een onbillijkheid van overwegende aard.
    url: https://wetten.overheid.nl/BWBR0004188/2018-08-01#Artikel9b
  - number: '10'
    text: |-
      Het bedrag van het lesgeld, bedoeld in [artikel 5, tweede lid][ref1], wordt voor het cursusjaar 1987-1988
      vastgesteld op f 1030. De derde volzin van het derde lid van genoemd artikel vindt voor het eerst toepassing met
      betrekking tot het cursusjaar 1988-1989.


      [ref1]: https://wetten.overheid.nl/BWBR0004188#Artikel5
    url: https://wetten.overheid.nl/BWBR0004188/2018-08-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0004188
        artikel: '5'
        hoofdstuk: II
  - number: '11.1'
    text: De Lesgeldwet voor boven 17-jarigen in het voortgezet onderwijs (*Stb.* 1986, 250) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0004188/2018-08-01#Artikel11
  - number: '11.2'
    text: |-
      Het bepaalde bij of krachtens die wet blijft van toepassing voor zover het betreft lesgeld verschuldigd dan wel
      voldaan met betrekking tot het cursusjaar 1986-1987.
    url: https://wetten.overheid.nl/BWBR0004188/2018-08-01#Artikel11
  - number: '11.3'
    text: |-
      Het Uitvoeringsbesluit Lesgeldwet (*Stb.* 1986, 421) strekt met ingang van de datum, bedoeld in
      [artikel 21, eerste lid][ref1], tot uitvoering van de [artikelen 4, derde en vierde lid][ref2], en
      [5, vierde lid][ref3], totdat bedoelde maatregelen krachtens deze wet zijn vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004188#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0004188#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0004188#Artikel5
    url: https://wetten.overheid.nl/BWBR0004188/2018-08-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0004188
        artikel: '21'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0004188
        artikel: '4'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0004188
        artikel: '5'
        hoofdstuk: II
  - number: '12.1'
    text: De School- en cursusgeldwet 1972 (*Stb.* 1983, 360) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0004188/2018-08-01#Artikel12
  - number: '12.2'
    text: |-
      Het bepaalde bij of krachtens die wet blijft van toepassing met betrekking tot de heffing en invordering van
      school- en cursusgelden over schoolgeldjaren onderscheidenlijk cursusjaren voorafgaand aan het cursusjaar waarop
      deze wet voor het eerst van toepassing is.
    url: https://wetten.overheid.nl/BWBR0004188/2018-08-01#Artikel12
  - number: '12.3'
    text: |-
      Het Besluit cursusgeld voortgezet onderwijs (*Stb.* 1985, 431) strekt met ingang van de datum, bedoeld in
      [artikel 21, eerste lid][ref1], tot uitvoering van [artikel 6, vierde lid][ref2], totdat bedoelde maatregelen
      krachtens deze wet zijn vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004188#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0004188#Artikel6
    url: https://wetten.overheid.nl/BWBR0004188/2018-08-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0004188
        artikel: '21'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0004188
        artikel: '6'
        hoofdstuk: III
  - number: '21.1'
    text: |-
      Deze wet treedt in werking met ingang van de dag na de datum van uitgifte van het *Staatsblad* waarin zij is
      geplaatst, en vindt voor het eerst toepassing met betrekking tot het cursusjaar dat in 1987 aanvangt.
    url: https://wetten.overheid.nl/BWBR0004188/2018-08-01#Artikel21
  - number: '21.2'
    text: |-
      De [artikelen 17][ref1] en [19][ref2] vervallen met ingang van 1 augustus 1988.


      [ref1]: https://wetten.overheid.nl/BWBR0004188#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0004188#Artikel19
    url: https://wetten.overheid.nl/BWBR0004188/2018-08-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0004188
        artikel: '17'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0004188
        artikel: '19'
        hoofdstuk: V
  - number: '21.3'
    text: |-
      [Artikel 18][ref1] vervalt met ingang van 1 januari 1990.


      [ref1]: https://wetten.overheid.nl/BWBR0004188#Artikel18
    url: https://wetten.overheid.nl/BWBR0004188/2018-08-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0004188
        artikel: '18'
        hoofdstuk: V
  - number: '22'
    text: Deze wet kan worden aangehaald als "Les- en cursusgeldwet".
    url: https://wetten.overheid.nl/BWBR0004188/2018-08-01#Artikel22
