  - number: 1.f
    text: 'cursus:'
    url: https://wetten.overheid.nl/BWBR0004188/2018-08-01#Artikel1
  - number: 1.f.1°
    text: |-
      een cursus in de zin van de [Wet op het voortgezet onderwijs][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002399
    url: https://wetten.overheid.nl/BWBR0004188/2018-08-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002399
  - number: 1.f.2°
    text: |-
      onderwijs aan een inrichting voor voortgezet onderwijs als bedoeld in
      [artikel 61 van de Wet op het voortgezet onderwijs][ref1], voor zover het geen volledig onderwijs betreft;


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel61
    url: https://wetten.overheid.nl/BWBR0004188/2018-08-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '61'
  - number: 1.f.3°
    text: |-
      een op grond van de [Experimentenwet onderwijs][ref1] uit de openbare kas bekostigde cursus, voor zover het
      voortgezet onderwijs betreft;


      [ref1]: https://wetten.overheid.nl/BWBR0002718
    url: https://wetten.overheid.nl/BWBR0004188/2018-08-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002718
  - number: 1.f.4°
    text: |-
      een opleiding als bedoeld in [artikel 7.2.2, eerste lid][ref1], of
      [artikel 7.3.1, eerste lid, onder a, van de Wet educatie en beroepsonderwijs][ref2], anders dan bedoeld in
      onderdeel e, die aan een instelling als bedoeld in [artikel 1.1.1, onderdeel b, van die wet][ref3] ten laste van ’s
      Rijks kas wordt verzorgd;


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0004188/2018-08-01#Artikel1
    references:
