preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het in verband met de toestand van ’s Rijks financiën alsmede in
    verband met ontwikkelingen op het gebied van de studiefinanciering wenselijk is over te gaan tot uitbreiding van de
    lesgeldregeling tot de groep van 16- tot 18-jarigen en voorts de Lesgeldwet voor boven 17-jarigen (Stb. 1986, 250)
    te vervangen en genoemde wet alsmede de School- en cursusgeldwet 1972 (Stb. 1983, 360) in te trekken;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0004188/2018-08-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet en de daarop berustende bepalingen wordt, voor zover niet anders bepaald, verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0004188/2018-08-01#Artikel1
  - number: 1.a
    text: |-
      bevoegd gezag: het orgaan dat als zodanig wordt aangeduid in de wettelijke regeling op grond waarvan de
      desbetreffende school of cursus wordt bekostigd;
    url: https://wetten.overheid.nl/BWBR0004188/2018-08-01#Artikel1
  - number: 1.b
    text: |-
      leerling: degene die is toegelaten tot het onderwijs aan een school of cursus als bedoeld in [artikel 2][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004188#Artikel2
    url: https://wetten.overheid.nl/BWBR0004188/2018-08-01#Artikel1
    references:
      - id: ref1
