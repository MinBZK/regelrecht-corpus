        artikel: '2'
        hoofdstuk: I
  - number: 1.c
    text: 'cursusjaar: het tijdvak van 1 augustus tot en met 31 juli daaraanvolgend;'
    url: https://wetten.overheid.nl/BWBR0004188/2018-08-01#Artikel1
  - number: 1.d
    text: |-
      Onze minister: Onze Minister van Onderwijs, Cultuur en Wetenschap en, voor wat betreft het landbouwonderwijs, Onze
      Minister van Economische Zaken;
    url: https://wetten.overheid.nl/BWBR0004188/2018-08-01#Artikel1
  - number: 1.e
    text: |-
      dagschool: een instelling als bedoeld in [1.1.1, onderdeel b, van de Wet educatie en beroepsonderwijs][ref1],
      voor zover het betreft een opleiding als bedoeld in
      [artikel 7.2.7, derde lid, van de Wet educatie en beroepsonderwijs][ref2]
      of een opleiding voortgezet algemeen volwassenenonderwijs die voldoet aan
      [artikel 2.17 van de Wet tegemoetkoming onderwijsbijdrage en schoolkosten][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0012438#Artikel2
