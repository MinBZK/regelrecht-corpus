  - number: '97'
    text: |-
      De bevoegdheid tot het maken van gemeentelijke verordeningen blijft ten aanzien van het onderwerp waarin deze wet
      voorziet, gehandhaafd, voor zover deze verordeningen niet met deze wet in strijd zijn.
    url: https://wetten.overheid.nl/BWBR0002731/1998-04-22#Artikel97
  - number: '100.1'
    text: |-
      Deze wet is niet van toepassing op luchtverontreiniging welke kan ontstaan door het brengen van afvalstoffen,
      verontreinigende stoffen of schadelijke stoffen in oppervlaktewateren, voor zover geregeld bij of krachtens de
      [Wet verontreiniging oppervlaktewateren][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002682
    url: https://wetten.overheid.nl/BWBR0002731/1998-04-22#Artikel100
    references:
      - id: ref1
        bwb_id: BWBR0002682
  - number: '100.2'
    text: |-
      Deze wet is niet van toepassing op luchtverontreiniging door gevaarlijke stoffen, voor zover geregeld bij of
      krachtens de [Wet vervoer gevaarlijke stoffen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007606
    url: https://wetten.overheid.nl/BWBR0002731/1998-04-22#Artikel100
    references:
      - id: ref1
        bwb_id: BWBR0007606
  - number: '102'
    text: |-
      De wet van 13 juni 1963 (*Stb.* 319), houdende instelling van de Raad inzake de luchtverontreiniging, wordt
      ingetrokken.
    url: https://wetten.overheid.nl/BWBR0002731/1998-04-22#Artikel102
  - number: '103'
    text: 'Deze wet kan worden aangehaald als: Wet inzake de luchtverontreiniging.'
    url: https://wetten.overheid.nl/BWBR0002731/1998-04-22#Artikel103
  - number: '104'
    text: |-
      Deze wet treedt in werking op een door Ons te bepalen tijdstip, dat voor de onderscheidene artikelen of onderdelen
      daarvan verschillend kan worden gesteld.
    url: https://wetten.overheid.nl/BWBR0002731/1998-04-22#Artikel104
