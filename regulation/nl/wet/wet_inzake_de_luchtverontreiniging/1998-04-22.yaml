  - number: '96'
    text: |-
      Met de opsporing van overtredingen van de[ artikelen 91][ref1] en [92][ref2] zijn mede belast de krachtens
      [artikel 18.4 van de Wet milieubeheer][ref3] aangewezen ambtenaren, voor zover zij door Onze Minister van Justitie
      daartoe zijn aangewezen.


