---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_inzake_de_luchtverontreiniging
regulatory_layer: WET
publication_date: '2016-07-21'
valid_from: '1998-04-22'
bwb_id: BWBR0002731
url: https://wetten.overheid.nl/BWBR0002731/1998-04-22
preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben dat het wenselijk is regelen te stellen in het belang van het voorkomen of
    beperken van luchtverontreiniging;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002731/1998-04-22#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Voor de toepassing van het bij of krachtens deze wet bepaalde wordt verstaan onder: luchtverontreiniging:
      de aanwezigheid in de buitenlucht van verontreinigende stoffen; verontreinigende stoffen: vaste, vloeibare
      of gasvormige stoffen, niet zijnde splijtstoffen, ertsen of radio-actieve stoffen in de zin van de
      [Kernenergiewet][ref1] (*Stb.* 1963, 82), die in de lucht, op zichzelf dan wel tezamen of in verbinding met andere
      stoffen, hetzij nadeel voor de gezondheid van de mens of hinder voor de mens kunnen opleveren, hetzij schade
      kunnen toebrengen aan dieren, planten of goederen; brandstof: een stof - met inbegrip van alle daaraan toegevoegde
      stoffen - dienende voor verbranding met het doel de daarbij ontstane energie te benutten, bij welke verbranding
      verontreinigende stoffen in de buitenlucht kunnen geraken; toestel: een toestel of met een toestel uitgerust
      vervoermiddel van waaruit verontreinigende stoffen in de buitenlucht kunnen geraken, een en ander - voorzover
      dit bij algemene maatregel van bestuur is bepaald - met inbegrip van de daaraan verbonden uitlaatleidingen;
      vervoermiddel: 'een vaartuig, rij- of voertuig of luchtvaartuig; verontreinigende handeling: gedraging waardoor'
      één of meer verontreinigende stoffen in de buitenlucht kunnen geraken, die niet voortvloeit uit het normale
      gebruik van een toestel of brandstof en niet wordt verricht in een inrichting waarvoor een vergunning krachtens
      de [Wet milieubeheer][ref2] vereist is; Onze Minister: Onze Minister van Volkshuisvesting, Ruimtelijke Ordening
      en Milieubeheer; de Raad: de Raad voor het milieubeheer; de inspecteur: de ter plaatse bevoegde inspecteur van het
      Staatstoezicht op de volksgezondheid, die door Onze Minister is aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0002402
      [ref2]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0002731/1998-04-22#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002402
      - id: ref2
        bwb_id: BWBR0003245
  - number: '13.1'
    text: |-
      Bij algemene maatregel van bestuur kunnen in het belang van het voorkomen of beperken van luchtverontreiniging
      regelen worden gesteld met betrekking tot toestellen, brandstoffen en verontreinigende handelingen.
    url: https://wetten.overheid.nl/BWBR0002731/1998-04-22#Artikel13
  - number: '13.2'
    text: 'Hiertoe kunnen behoren regelen, inhoudende:'
    url: https://wetten.overheid.nl/BWBR0002731/1998-04-22#Artikel13
  - number: 13.2.a
    text: |-
      een verbod een toestel of brandstof, behorende tot een bij de maatregel aangewezen categorie, te gebruiken, te
      vervaardigen, in te voeren, ten verkoop in voorraad te hebben, ten verkoop aan te bieden, te verkopen, af te
      leveren of te vervoeren, voor zover naar Ons oordeel het nut van het aanwenden daarvan niet opweegt tegen de
      nadelen uit het oogpunt van luchtverontreiniging;
    url: https://wetten.overheid.nl/BWBR0002731/1998-04-22#Artikel13
  - number: 13.2.b
    text: een verbod zulks te doen zonder vergunning, verleend door een bij die maatregel aangewezen orgaan;
    url: https://wetten.overheid.nl/BWBR0002731/1998-04-22#Artikel13
  - number: 13.2.c
    text: een verbod zulks te doen indien het toestel of de brandstof niet voldoet aan de bij de maatregel gestelde eisen;
    url: https://wetten.overheid.nl/BWBR0002731/1998-04-22#Artikel13
  - number: 13.2.d
    text: |-
      een verbod zulks te doen indien het toestel niet behoort tot een type dat bij een keuring, verricht aan de hand van
      de bij of krachtens de maatregel daartoe vastgestelde voorschriften, is goedgekeurd;
    url: https://wetten.overheid.nl/BWBR0002731/1998-04-22#Artikel13
  - number: 13.2.e
    text: |-
      een verbod een toestel, behorende tot een bij de maatregel aangewezen categorie, te gebruiken indien niet het
      bewijs kan worden overgelegd dat het binnen een bij de maatregel bepaalde voorafgaande termijn bij een keuring,
      verricht aan de hand van de bij of krachtens de maatregel daartoe vastgestelde voorschriften, is goedgekeurd;
    url: https://wetten.overheid.nl/BWBR0002731/1998-04-22#Artikel13
  - number: 13.2.f
    text: |-
      een verbod een toestel dan wel een woning of ander gebouw te voorzien of te doen voorzien van een voor aanwending
      daarin bestemde brandstof, behorende tot een bij de maatregel aangewezen categorie;
    url: https://wetten.overheid.nl/BWBR0002731/1998-04-22#Artikel13
  - number: 13.2.g
    text: |-
      een verbod een toestel of brandstof, behorende tot een bij de maatregel aangewezen categorie, te gebruiken op
      de bij de maatregel aangegeven plaatsen, op de bij de maatregel aangegeven wijze of onder de bij de maatregel
      aangegeven omstandigheden;
    url: https://wetten.overheid.nl/BWBR0002731/1998-04-22#Artikel13
  - number: 13.2.h
    text: |-
      een verplichting voor de gebruiker van een toestel, behorende tot een bij de maatregel aangewezen categorie, de
      uitworp van verontreinigende stoffen uit dat toestel te meten op de bij of krachtens de maatregel aangegeven wijze;
    url: https://wetten.overheid.nl/BWBR0002731/1998-04-22#Artikel13
  - number: 13.2.i
    text: |-
      een verplichting van het gebruik van een toestel of brandstof in de bij de maatregel bepaalde gevallen en op de bij
      de maatregel bepaalde wijze aangifte te doen.
    url: https://wetten.overheid.nl/BWBR0002731/1998-04-22#Artikel13
  - number: '14'
    text: |-
      Een algemene maatregel van bestuur als bedoeld in [artikel 13][ref1] kan tevens de verplichting inhouden te
      voldoen aan door bestuursorganen die bij de maatregel zijn aangewezen, omtrent onderwerpen die in de maatregel
      zijn geregeld, aan de betrokkene gestelde nadere eisen. Bij het stellen van zodanige eis wordt tevens het tijdstip
      bepaald waarop ten aanzien van die eis de verplichting ingaat.


      [ref1]: https://wetten.overheid.nl/BWBR0002731#Artikel13
    url: https://wetten.overheid.nl/BWBR0002731/1998-04-22#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002731
        artikel: '13'
        hoofdstuk: III
  - number: 14a
    text: |-
      Bij een algemene maatregel van bestuur krachtens [artikel 13][ref1], waarbij regelen worden gesteld met betrekking
      tot toestellen of brandstoffen die kunnen worden gebruikt in inrichtingen waarvoor een vergunning krachtens de
      [Wet milieubeheer][ref2] vereist is, kan worden bepaald dat het bevoegd gezag bij het verlenen of wijzigen van
      de vergunning met betrekking tot daarbij aangegeven onderwerpen in de beperkingen waaronder de vergunning wordt
      verleend, of in de daaraan verbonden voorschriften van bij de maatregel gestelde regels kan afwijken. In dat geval
      wordt bij de maatregel aangegeven in hoeverre het bevoegd gezag van de regels kan afwijken. Bij de maatregel kan
      tevens worden bepaald dat de bevoegdheid tot afwijken slechts geldt in daarbij aangegeven categorieën van gevallen.


      [ref1]: https://wetten.overheid.nl/BWBR0002731#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0002731/1998-04-22#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0002731
        artikel: '13'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0003245
  - number: '15'
    text: |-
      In een algemene maatregel van bestuur waarbij regelen van de in [artikel 13, tweede lid, onder ][ref1], bedoelde
      strekking met betrekking tot toestellen werden gesteld, wordt tevens een termijn bepaald, eerst bij het verstrijken
      waarvan die regelen ten aanzien van toestellen die bij het in werking treden van de maatregel reeds vervaardigd en
      hier te lande aanwezig zijn, van toepassing worden.


      [ref1]: https://wetten.overheid.nl/BWBR0002731#Artikel13
    url: https://wetten.overheid.nl/BWBR0002731/1998-04-22#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002731
        artikel: '13'
        hoofdstuk: III
  - number: '16.1'
    text: |-
      Indien toepassing wordt gegeven aan [artikel 13, tweede lid, onder ][ref1], zijn
      de [paragrafen 3.5.2 tot en met 3.5.5 van de Algemene wet bestuursrecht][ref2] en
      [afdeling 13.2 van de Wet milieubeheer][ref3] van toepassing met betrekking tot de totstandkoming van de
      beschikking op de aanvraag om een vergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0002731#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Paragraaf3.5.2
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Afdeling13.2
    url: https://wetten.overheid.nl/BWBR0002731/1998-04-22#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0002731
        artikel: '13'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0005537
        paragraaf: 3.5.2
      - id: ref3
        bwb_id: BWBR0003245
        afdeling: '13.2'
  - number: '16.2'
    text: Een vergunning kan slechts worden geweigerd in het belang van het voorkomen of beperken van luchtverontreiniging.
    url: https://wetten.overheid.nl/BWBR0002731/1998-04-22#Artikel16
  - number: '16.3'
    text: |-
      Een vergunning kan onder beperkingen worden verleend. Aan een vergunning kunnen voorschriften worden verbonden.
      Hiertoe kan behoren het voorschrift, dat met betrekking tot in het voorschrift geregelde onderwerpen moet worden
      voldaan aan nadere eisen, die door bij het voorschrift aangewezen bestuursorganen worden gesteld.
    url: https://wetten.overheid.nl/BWBR0002731/1998-04-22#Artikel16
  - number: '16.4'
    text: |-
      Bij de betrokken algemene maatregel van bestuur kunnen categorieën van gevallen worden aangewezen, waarin het
      eerste lid niet van toepassing is. Zonodig worden bij een zodanige maatregel regels gesteld met betrekking tot de
      onderwerpen die zijn geregeld in de in het eerste lid genoemde paragrafen van de [Algemene wet bestuursrecht][ref1]
      en afdeling van de [Wet milieubeheer][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537
      [ref2]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0002731/1998-04-22#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0005537
      - id: ref2
        bwb_id: BWBR0003245
  - number: '16.5'
    text: |-
      Voor zover dat bij de betrokken maatregel is bepaald, kan de vergunning worden gewijzigd of ingetrokken. Bij de
      maatregel wordt bepaald welke paragrafen van [afdeling 3.5 van de Algemene wet bestuursrecht][ref1] van toepassing
      zijn met betrekking tot een zodanige wijziging of intrekking.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.5
    url: https://wetten.overheid.nl/BWBR0002731/1998-04-22#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.5'
  - number: '17'
    text: |-
      Indien toepassing wordt gegeven aan [artikel 13, tweede lid, onder ][ref1], wijzen Onze Minister en Onze Ministers
      wie het mede aangaat, tezamen de instanties aan, die de in die bepaling bedoelde keuringen verrichten, tenzij deze
      instanties bij of krachtens algemene maatregel van bestuur zijn aangewezen. Bij of krachtens algemene maatregel van
      bestuur worden regelen gesteld ten aanzien van de wijze waarop die keuringen plaatshebben.


      [ref1]: https://wetten.overheid.nl/BWBR0002731#Artikel13
    url: https://wetten.overheid.nl/BWBR0002731/1998-04-22#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0002731
        artikel: '13'
        hoofdstuk: III
  - number: '18.1'
    text: |-
      Bij een algemene maatregel van bestuur als bedoeld in [artikel 13][ref1] kunnen ter zake van de toepasselijkheid
      van daarbij gestelde regelen beperkingen worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002731#Artikel13
    url: https://wetten.overheid.nl/BWBR0002731/1998-04-22#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0002731
        artikel: '13'
        hoofdstuk: III
  - number: '18.2'
    text: 'Zodanige beperking kan onder meer inhouden:'
    url: https://wetten.overheid.nl/BWBR0002731/1998-04-22#Artikel18
  - number: 18.2.a
    text: dat de regel slechts geldt in de bij de maatregel aangewezen gebieden;
    url: https://wetten.overheid.nl/BWBR0002731/1998-04-22#Artikel18
  - number: 18.2.b
    text: |-
      dat de regel niet geldt met betrekking tot de inrichtingen - dan wel met betrekking tot bij de maatregel aangegeven
      groepen van inrichtingen - , waarvoor krachtens de Wet milieubeheer een vergunning vereist is van gedeputeerde
      staten of van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0002731/1998-04-22#Artikel18
  - number: '43.1'
    text: |-
      Onze commissaris in de provincie waar een inrichting geheel of in hoofdzaak is gelegen, een toestel zich bevindt
      of een verontreinigende handeling wordt verricht, kan, indien naar zijn oordeel door die inrichting, door een
      deel van die inrichting, door dat toestel of door die verontreinigende handeling de lucht zodanig is of dreigt te
      worden verontreinigd dat aanmerkelijk gevaar voor de gezondheid, onduldbare hinder of ernstige schade te duchten
      is, en het treffen van een andere voorziening niet kan worden afgewacht, de betrokkene bevelen de inrichting of
      het desbetreffende deel van de inrichting te sluiten, het toestel buiten werking te stellen, onderscheidenlijk de
      handeling te staken.
    url: https://wetten.overheid.nl/BWBR0002731/1998-04-22#Artikel43
  - number: '43.2'
    text: |-
      Bij het geven van een zodanig bevel wordt het tijdstip bepaald, waarop ten aanzien van dat bevel de verplichting
      ingaat.
    url: https://wetten.overheid.nl/BWBR0002731/1998-04-22#Artikel43
  - number: '43.3'
    text: |-
      Onze commissaris in de provincie geeft aan het eerste lid geen toepassing zonder aan de betrokkene de gelegenheid
      te hebben geboden binnen een daartoe te stellen termijn de oorzaak van de verontreiniging weg te nemen, tenzij naar
      zijn oordeel de geboden spoed zich daartegen verzet.
    url: https://wetten.overheid.nl/BWBR0002731/1998-04-22#Artikel43
  - number: '44'
    text: |-
      De burgemeester van een gemeente waar zich de luchtverontreiniging voordoet, en de inspecteur kunnen Onze
      commissaris in de provincie verzoeken aan [artikel 43, eerste lid][ref1], toepassing te geven.


      [ref1]: https://wetten.overheid.nl/BWBR0002731#Artikel43
    url: https://wetten.overheid.nl/BWBR0002731/1998-04-22#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0002731
        artikel: '43'
        hoofdstuk: V
  - number: '45.1'
    text: |-
      Onze commissaris in de provincie geeft - tenzij naar zijn oordeel de geboden spoed zich daartegen verzet - aan
      [artikel 43, eerste lid][ref1], geen toepassing en beslist niet op een verzoek als bedoeld in [artikel 44][ref2]
      zonder aan de burgemeester van de gemeente waar de inrichting geheel of gedeeltelijk is gelegen of het toestel zich
      bevindt, dan wel de verontreinigende handeling wordt verricht, en de inspecteur de gelegenheid te hebben geboden
      hem ter zake van advies te dienen.


      [ref1]: https://wetten.overheid.nl/BWBR0002731#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0002731#Artikel44
    url: https://wetten.overheid.nl/BWBR0002731/1998-04-22#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0002731
        artikel: '43'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0002731
        artikel: '44'
        hoofdstuk: V
  - number: '45.2'
    text: |-
      Indien een der in het eerste lid genoemde organen een verzoek als bedoeld in [artikel 44][ref1] heeft gedaan, geldt
      te zijnen aanzien het eerste lid niet.


      [ref1]: https://wetten.overheid.nl/BWBR0002731#Artikel44
    url: https://wetten.overheid.nl/BWBR0002731/1998-04-22#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0002731
        artikel: '44'
        hoofdstuk: V
  - number: '46.1'
    text: |-
      De inhoud van een krachtens [artikel 43, eerste lid][ref1], genomen besluit wordt onverwijld aan de betrokkene,
      alsmede aan de in [artikel 45, eerste lid][ref2], bedoelde burgemeester medegedeeld. Van het besluit wordt
      mededeling gedaan aan de burgemeester en aan de inspecteur.


      [ref1]: https://wetten.overheid.nl/BWBR0002731#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0002731#Artikel45
    url: https://wetten.overheid.nl/BWBR0002731/1998-04-22#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0002731
        artikel: '43'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0002731
        artikel: '45'
        hoofdstuk: V
  - number: '46.2'
    text: |-
      Van het besluit, houdende de beslissing op een verzoek als bedoeld in [artikel 44][ref1], wordt mededeling gedaan
      aan de in [artikel 44][ref2] genoemde organen die het verzoek niet hebben gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002731#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0002731#Artikel44
    url: https://wetten.overheid.nl/BWBR0002731/1998-04-22#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0002731
        artikel: '44'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0002731
        artikel: '44'
        hoofdstuk: V
  - number: '47.1'
    text: |-
      Een krachtens [artikel 43, eerste lid][ref1], genomen besluit vervalt twee weken na het tijdstip waarop het in
      werking is getreden.


      [ref1]: https://wetten.overheid.nl/BWBR0002731#Artikel43
    url: https://wetten.overheid.nl/BWBR0002731/1998-04-22#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0002731
        artikel: '43'
        hoofdstuk: V
  - number: '47.2'
    text: |-
      Onze commissaris in de provincie kan de in het eerste lid bedoelde termijn bekorten of telkens met ten hoogste een
      week verlengen.
    url: https://wetten.overheid.nl/BWBR0002731/1998-04-22#Artikel47
  - number: '47.3'
    text: |-
      Met betrekking tot een besluit krachtens het tweede lid is [artikel 46, eerste lid][ref1], van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002731#Artikel46
    url: https://wetten.overheid.nl/BWBR0002731/1998-04-22#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0002731
        artikel: '46'
        hoofdstuk: V
  - number: '48.1'
    text: |-
      In geval van bijzondere omstandigheden van tijdelijke aard, die naar zijn oordeel zodanige voorziening in het
      belang van de openbare gezondheid dringend noodzakelijk maken, kan Onze commissaris in de provincie algemene
      voorschriften geven met betrekking tot inrichtingen, toestellen, brandstoffen en verontreinigende handelingen.
    url: https://wetten.overheid.nl/BWBR0002731/1998-04-22#Artikel48
  - number: '48.2'
    text: 'Hiertoe kunnen behoren:'
    url: https://wetten.overheid.nl/BWBR0002731/1998-04-22#Artikel48
  - number: 48.2.a
    text: |-
      een geheel of gedeeltelijk verbod een inrichting, deel van een inrichting of toestel, behorende tot een bij het
      besluit aangewezen categorie, in werking te hebben;
    url: https://wetten.overheid.nl/BWBR0002731/1998-04-22#Artikel48
  - number: 48.2.b
    text: |-
      een geheel of gedeeltelijk verbod een brandstof, behorende tot een bij het besluit aangewezen categorie, te
      gebruiken.
    url: https://wetten.overheid.nl/BWBR0002731/1998-04-22#Artikel48
  - number: '48.3'
    text: |-
      Wanneer bijzondere omstandigheden als bedoeld in het eerste lid, op korte termijn zijn te verwachten en voorts
      wanneer deze zijn aangebroken, laat Onze commissaris hiervan mededeling doen door middel van radio en televisie
      of op een andere door gedeputeerde staten te bepalen wijze. Zonodig laat hij deze mededeling vergezeld gaan van
      aanbevelingen voor door veroorzakers van luchtverontreiniging of door de bevolking te nemen maatregelen.
    url: https://wetten.overheid.nl/BWBR0002731/1998-04-22#Artikel48
  - number: '49'
    text: |-
      De burgemeester van elk der betrokken gemeenten en de inspecteur kunnen Onze commissaris in de provincie verzoeken
      toepassing te geven aan [artikel 48, eerste en derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002731#Artikel48
    url: https://wetten.overheid.nl/BWBR0002731/1998-04-22#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0002731
        artikel: '48'
        hoofdstuk: V
  - number: '50.1'
    text: |-
      Onze commissaris in de provincie geeft aan [artikel 48, eerste of derde lid][ref1], geen toepassing zonder aan de
      inspecteur de gelegenheid te hebben geboden hem ter zake van advies te dienen, tenzij naar zijn oordeel de geboden
      spoed zich daartegen verzet.


      [ref1]: https://wetten.overheid.nl/BWBR0002731#Artikel48
    url: https://wetten.overheid.nl/BWBR0002731/1998-04-22#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0002731
        artikel: '48'
        hoofdstuk: V
  - number: '50.2'
    text: |-
      Het eerste lid geldt niet indien de inspecteur een verzoek als bedoeld in [artikel 49][ref1] heeft gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002731#Artikel49
    url: https://wetten.overheid.nl/BWBR0002731/1998-04-22#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0002731
        artikel: '49'
        hoofdstuk: V
  - number: '51.1'
    text: |-
      Een krachtens [artikel 48, eerste lid][ref1], vastgesteld besluit vervalt, behoudens eerdere intrekking, 48 uur na
      zijn in werking treden. Deze termijn kan door gedeputeerde staten telkens voor ten hoogste 48 uur worden verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0002731#Artikel48
    url: https://wetten.overheid.nl/BWBR0002731/1998-04-22#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0002731
        artikel: '48'
        hoofdstuk: V
  - number: '51.2'
    text: |-
      Zodra de omstandigheden op grond waarvan toepassing is gegeven aan [artikel 48, eerste lid][ref1], tussentijds
      hebben opgehouden te bestaan, trekt Onze commissaris in de provincie de krachtens dat lid gegeven voorschriften in.


      [ref1]: https://wetten.overheid.nl/BWBR0002731#Artikel48
    url: https://wetten.overheid.nl/BWBR0002731/1998-04-22#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0002731
        artikel: '48'
        hoofdstuk: V
  - number: '51.3'
    text: |-
      Ten aanzien van de verlenging en de intrekking, bedoeld in de voorgaande leden, zijn de[ artikelen 49][ref1] en
      [50][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002731#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0002731#Artikel50
    url: https://wetten.overheid.nl/BWBR0002731/1998-04-22#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0002731
        artikel: '49'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0002731
        artikel: '50'
        hoofdstuk: V
  - number: '52'
    text: |-
      Een krachtens [artikel 48, eerste lid][ref1], of [51, eerste of tweede lid][ref2], vastgesteld besluit wordt
      terstond door middel van radio en televisie bekend gemaakt en kan onmiddellijk daarna in werking treden. Van het
      besluit wordt vervolgens zo spoedig mogelijk mededeling gedaan in de *Staatscourant* en zo nodig in een of meer
      dag- of nieuwsbladen onder vermelding van het tijdstip van de bekendmaking daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0002731#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0002731#Artikel51
    url: https://wetten.overheid.nl/BWBR0002731/1998-04-22#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0002731
        artikel: '48'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0002731
        artikel: '51'
        hoofdstuk: V
  - number: '53'
    text: |-
      Bij algemene maatregel van bestuur kunnen omtrent de uitoefening van de in de[ artikelen 43][ref1] en
      [48 t/m 52][ref2] vervatte bevoegdheden nadere regelen worden gesteld. Tot deze regelen kunnen behoren regelen die
      aangeven hoe toepassing dient te worden gegeven aan [artikel 43][ref3] of [artikel 48][ref4] bij een overschrijding
      van alarmdrempels, gesteld krachtens [artikel 5.1, eerste lid, van de Wet milieubeheer][ref5] of bij een dreigende
      overschrijding daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0002731#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0002731#Artikel48
      [ref3]: https://wetten.overheid.nl/BWBR0002731#Artikel43
      [ref4]: https://wetten.overheid.nl/BWBR0002731#Artikel48
      [ref5]: https://wetten.overheid.nl/BWBR0003245#Artikel5
    url: https://wetten.overheid.nl/BWBR0002731/1998-04-22#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0002731
        artikel: '43'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0002731
        artikel: '48'
        hoofdstuk: V
      - id: ref3
        bwb_id: BWBR0002731
        artikel: '43'
        hoofdstuk: V
      - id: ref4
        bwb_id: BWBR0002731
        artikel: '48'
        hoofdstuk: V
      - id: ref5
        bwb_id: BWBR0003245
        artikel: '5'
  - number: '59.1'
    text: 'Bij algemene maatregel van bestuur kan worden bepaald:'
    url: https://wetten.overheid.nl/BWBR0002731/1998-04-22#Artikel59
  - number: 59.1.a
    text: |-
      dat bij het van overheidswege verrichten van metingen ter bepaling van de luchtverontreiniging de bij de maatregel
      gestelde regelen moeten worden in acht genomen;
    url: https://wetten.overheid.nl/BWBR0002731/1998-04-22#Artikel59
  - number: 59.1.b
    text: |-
      dat de bij de maatregel aangewezen besturen van provincies, gemeenten, rechtspersoonlijkheid bezittende lichamen
      als bedoeld in de [Wet gemeenschappelijke regelingen][ref1] (*Stb.* 1950, K 120) of andere openbare lichamen
      gehouden zijn in hun gezagsgebied met inachtneming van de bij de maatregel gestelde regelen metingen als bedoeld
      onder *a* te verrichten of mede te werken aan zodanige metingen die van Rijkswege worden verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0003740
    url: https://wetten.overheid.nl/BWBR0002731/1998-04-22#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0003740
  - number: '59.2'
    text: 'Regelen als bedoeld in het eerste lid, onder *a* en *b*, kunnen onder meer betrekking hebben op:'
    url: https://wetten.overheid.nl/BWBR0002731/1998-04-22#Artikel59
  - number: 59.2.a
    text: de dichtheid van het net van meetpunten;
    url: https://wetten.overheid.nl/BWBR0002731/1998-04-22#Artikel59
  - number: 59.2.b
    text: de frequentie van de metingen;
    url: https://wetten.overheid.nl/BWBR0002731/1998-04-22#Artikel59
  - number: 59.2.c
    text: de toe te passen meetmethoden;
    url: https://wetten.overheid.nl/BWBR0002731/1998-04-22#Artikel59
  - number: 59.2.d
    text: het doen van weerkundige waarnemingen;
    url: https://wetten.overheid.nl/BWBR0002731/1998-04-22#Artikel59
  - number: 59.2.e
    text: de verwerking en registratie van de uitkomsten van metingen;
    url: https://wetten.overheid.nl/BWBR0002731/1998-04-22#Artikel59
  - number: 59.2.f
    text: |-
      de terbeschikkingstelling van uitkomsten en de verstrekking van inlichtingen daaromtrent aan bij de maatregel
      aangewezen bestuursorganen.
    url: https://wetten.overheid.nl/BWBR0002731/1998-04-22#Artikel59
  - number: '59.3'
    text: |-
      De uitkomsten van de van Rijkswege verrichte metingen worden door Onze Minister, en de uitkomsten van de metingen,
      verricht op grond van het krachtens het eerste lid, onder *b*, bepaalde, worden door het bestuur van het lichaam
      dat die metingen heeft verricht, ter beschikking gesteld van de Raad. Onze Minister en de genoemde besturen
      verstrekken de Raad desgevraagd nadere inlichtingen omtrent die uitkomsten.
    url: https://wetten.overheid.nl/BWBR0002731/1998-04-22#Artikel59
  - number: '59.4'
    text: |-
      De uitkomsten van de van Rijkswege verrichte metingen worden door Onze Minister, en de uitkomsten van de metingen,
      verricht op grond van het krachtens het eerste lid, onder *b*, bepaalde, worden door het bestuur van het lichaam
      dat die metingen heeft verricht, overeenkomstig bij algemene maatregel van bestuur gestelde regelen voor ieder
      bereikbaar gemaakt.
    url: https://wetten.overheid.nl/BWBR0002731/1998-04-22#Artikel59
  - number: '59.5'
    text: Onze Minister kan omtrent het krachtens de voorgaande leden geregelde onderwerp nadere regelen stellen.
    url: https://wetten.overheid.nl/BWBR0002731/1998-04-22#Artikel59
  - number: '60.1'
    text: |-
      Wanneer door het Rijk, een provincie, een gemeente, een rechtspersoonlijkheid bezittend lichaam als bedoeld
      in de Wet gemeenschappelijke regelingen of een ander openbaar lichaam ten behoeve van het bepalen van
      luchtverontreiniging duurzaam of tijdelijk gebruik moet worden gemaakt van onroerende zaken, kan Onze Minister
      aan ieder die enig recht ten aanzien van die zaken heeft, doch met wie in voorafgaand overleg ter zake geen
      overeenstemming is bereikt, de verplichting opleggen bedoeld gebruik, behoudens recht op schadevergoeding, te
      gedogen, indien naar het oordeel van Onze Minister de belangen van de rechthebbenden redelijkerwijs onteigening
      niet vorderen en in hun gebruik van die zaken niet meer belemmering wordt gebracht dan redelijkerwijs nodig is.
    url: https://wetten.overheid.nl/BWBR0002731/1998-04-22#Artikel60
  - number: '60.2'
    text: |-
      Een krachtens het eerste lid opgelegde verplichting geldt zowel voor hem aan wie zij is opgelegd, als voor diens
      rechtverkrijgenden.
    url: https://wetten.overheid.nl/BWBR0002731/1998-04-22#Artikel60
  - number: '60.3'
    text: |-
      Het besluit tot het opleggen van een verplichting tot gedogen wordt bekendgemaakt aan de rechthebbenden ten aanzien
      van de onroerende zaak, voor zover dezen aan Onze Minister op dat tijdstip bekend kunnen zijn. Het besluit treedt
      in werking met ingang van de vijfde werkdag na de datum van bekendmaking.
    url: https://wetten.overheid.nl/BWBR0002731/1998-04-22#Artikel60
  - number: '61.1'
    text: |-
      Ieder die enig recht heeft ten aanzien van een onroerende zaak, ten aanzien waarvan met toepassing van
      [artikel 60][ref1] een verplichting tot gedogen is opgelegd, kan, binnen zes weken nadat het besluit tot het
      opleggen van de verplichting tot gedogen aan hem is bekendgemaakt of hij op andere wijze van het opleggen van de
      verplichting kennis had kunnen dragen, bij een met redenen omkleed verzoekschrift aan het Gerechtshof binnen welks
      rechtsgebied de onroerende zaak is gelegen, vernietiging verzoeken van de beslissing waarbij die verplichting is
      opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0002731#Artikel60
    url: https://wetten.overheid.nl/BWBR0002731/1998-04-22#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0002731
        artikel: '60'
        hoofdstuk: VII
  - number: '61.2'
    text: |-
      Deze vernietiging kan alleen worden verzocht op grond dat bij het opleggen der verplichting ten onrechte is
      geoordeeld:
    url: https://wetten.overheid.nl/BWBR0002731/1998-04-22#Artikel61
  - number: 61.2.a
    text: |-
      hetzij dat de belangen van de rechthebbenden ten aanzien van de onroerende zaak redelijkerwijs onteigening niet
      vorderen;
    url: https://wetten.overheid.nl/BWBR0002731/1998-04-22#Artikel61
  - number: 61.2.b
    text: |-
      hetzij dat in het gebruik van die zaak, gelet op de omstandigheden, niet meer belemmering wordt gebracht dan
      redelijkerwijs voor de aanleg, de instandhouding of het gebruik van het werk nodig is.
    url: https://wetten.overheid.nl/BWBR0002731/1998-04-22#Artikel61
  - number: '61.3'
    text: |-
      De beschikking van het Hof wordt met redenen omkleed en in het openbaar uitgesproken. Daartegen staat generlei
      voorziening open.
    url: https://wetten.overheid.nl/BWBR0002731/1998-04-22#Artikel61
  - number: '61.4'
    text: |-
      Indien de beslissing van Onze Minister door het Hof wordt vernietigd, zal voor zoveel van de betrokken onroerende
      zaak gebruik is gemaakt, alles zoveel mogelijk in de vorige staat worden teruggebracht, onverminderd het recht op
      schadevergoeding van de rechthebbenden ten aanzien van die zaak.
    url: https://wetten.overheid.nl/BWBR0002731/1998-04-22#Artikel61
  - number: '61.5'
    text: |-
      Indien de beslissing van Onze Minister door het Hof wordt vernietigd, omdat ten onrechte is geoordeeld dat de
      belangen van de rechthebbenden ten aanzien van die onroerende zaak redelijkerwijs onteigening niet vorderen, zal
      de verplichting te gedogen, behoudens recht op schadevergoeding, gehandhaafd blijven gedurende een door het Hof te
      bepalen termijn, welke zodanig zal worden gesteld dat redelijkerwijs binnen die termijn tot onteigening kan zijn
      overgegaan.
    url: https://wetten.overheid.nl/BWBR0002731/1998-04-22#Artikel61
  - number: '62.1'
    text: |-
      Tot het verkrijgen van schadevergoeding op grond van [artikel 60][ref1] kunnen rechthebbenden binnen zes maanden na
      het ontstaan van de schade een verzoekschrift indienen bij Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0002731#Artikel60
    url: https://wetten.overheid.nl/BWBR0002731/1998-04-22#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0002731
        artikel: '60'
        hoofdstuk: VII
  - number: '62.2'
    text: |-
      Binnen zes maanden nadat het verzoekschrift bij het betrokken ministerie is ontvangen, doet Onze Minister een
      voorstel tot vergoeding van de schade of bericht hij dat er naar zijn oordeel geen termen voor schadevergoeding
      aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0002731/1998-04-22#Artikel62
  - number: '62.3'
    text: |-
      Is binnen de in het vorige lid bedoelde termijn geen voorstel of bericht door de rechthebbenden ontvangen of
      stemmen zij niet met dit voorstel of bericht in, dan kunnen zij de kantonrechter verzoeken ten aanzien van de
      schadevergoeding een beslissing te nemen.
    url: https://wetten.overheid.nl/BWBR0002731/1998-04-22#Artikel62
  - number: '62.4'
    text: |-
      Wanneer de schade uiteindelijk groter blijkt te zijn dan bij het vaststellen daarvan was te voorzien, kunnen
      rechthebbenden een verzoek om aanvullende vergoeding indienen. De voorgaande leden van dit artikel zijn daarbij van
      overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0002731/1998-04-22#Artikel62
  - number: '69'
    text: |-
      Beroep op de administratieve rechter staat open overeenkomstig [hoofdstuk 20 van de Wet milieubeheer][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk20
    url: https://wetten.overheid.nl/BWBR0002731/1998-04-22#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0003245
        hoofdstuk: '20'
  - number: '84'
    text: |-
      Voor de toepassing van de[ artikelen 44][ref1] en [49][ref2] wordt onderscheidenlijk het gebied van een
      bovengemeentelijk openbaar lichaam met een gemeente, het bestuur van zodanig lichaam met burgemeester en wethouders
      en de voorzitter van het bestuur van zodanig lichaam met de burgemeester gelijk gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002731#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0002731#Artikel49
    url: https://wetten.overheid.nl/BWBR0002731/1998-04-22#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0002731
        artikel: '44'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0002731
        artikel: '49'
        hoofdstuk: V
  - number: '86.1'
    text: |-
      Wij kunnen in het belang van de landsverdediging van de krachtens [artikel 13, eerste lid][ref1], gestelde verboden
      en verplichtingen:


      [ref1]: https://wetten.overheid.nl/BWBR0002731#Artikel13
    url: https://wetten.overheid.nl/BWBR0002731/1998-04-22#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0002731
        artikel: '13'
        hoofdstuk: III
  - number: 86.1.a
    text: bij algemene maatregel van bestuur vrijstelling verlenen;
    url: https://wetten.overheid.nl/BWBR0002731/1998-04-22#Artikel86
  - number: 86.1.b
    text: op daartoe strekkend verzoek ontheffing verlenen.
    url: https://wetten.overheid.nl/BWBR0002731/1998-04-22#Artikel86
  - number: '86.2'
    text: |-
      Aan een vrijstelling of ontheffing worden de voorschriften verbonden, die naar Ons oordeel in het belang van het
      voorkomen of beperken van luchtverontreiniging nodig zijn.
    url: https://wetten.overheid.nl/BWBR0002731/1998-04-22#Artikel86
  - number: '88.1'
    text: |-
      Het ontwerp van een algemene maatregel van bestuur krachtens [artikel 13][ref1] wordt overgelegd aan de beide
      kamers der Staten-Generaal en in de *Staatscourant* bekendgemaakt. Aan een ieder wordt de gelegenheid geboden
      binnen een bij die bekendmaking vast te stellen termijn van ten minste vier weken opmerkingen over het ontwerp
      schriftelijk ter kennis van Onze Minister te brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0002731#Artikel13
    url: https://wetten.overheid.nl/BWBR0002731/1998-04-22#Artikel88
    references:
      - id: ref1
        bwb_id: BWBR0002731
        artikel: '13'
        hoofdstuk: III
  - number: '88.2'
    text: |-
      Een algemene maatregel van bestuur als bedoeld in het eerste lid wordt, nadat hij is vastgesteld, toegezonden aan
      beide Kamers der Staten-Generaal. Hij treedt niet eerder in werking dan vier weken na de datum van uitgifte van het
      *Staatsblad* waarin hij is geplaatst.
    url: https://wetten.overheid.nl/BWBR0002731/1998-04-22#Artikel88
  - number: 88a.1
    text: |-
      De inspecteur is bevoegd van een bestuursorgaan dat met de uitvoering of de handhaving van het bij of krachtens
      deze wet bepaalde is belast, daarover inlichtingen te vorderen.
    url: https://wetten.overheid.nl/BWBR0002731/1998-04-22#Artikel88a
  - number: 88a.2
    text: |-
      De [artikelen 5:13][ref1], [5:17][ref2] en [5:20 van de Algemene wet bestuursrecht][ref3] zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0002731/1998-04-22#Artikel88a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '89'
    text: |-
      Indien in deze wet geregelde onderwerpen in het belang van een goede uitvoering van de wet nadere regeling
      behoeven, kan deze geschieden bij algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0002731/1998-04-22#Artikel89
  - number: '90.1'
    text: |-
      Met betrekking tot de handhaving van het bij of krachtens deze wet bepaalde zijn
      de[ artikelen 18.3 tot en met 18.16 van de Wet milieubeheer][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel18
    url: https://wetten.overheid.nl/BWBR0002731/1998-04-22#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '18'
  - number: '90.2'
    text: |-
      Het in [artikel 18.2 van de Wet milieubeheer][ref1] bedoelde bestuursorgaan heeft tot taak zorg te dragen voor de
      bestuursrechtelijke handhaving van het ten aanzien van de betrokken inrichting bij of krachtens deze wet bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel18
    url: https://wetten.overheid.nl/BWBR0002731/1998-04-22#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '18'
  - number: '91'
    text: |-
      Het is verboden te handelen in strijd met een krachtens [artikel 43][ref1] gegeven bevel.


      [ref1]: https://wetten.overheid.nl/BWBR0002731#Artikel43
    url: https://wetten.overheid.nl/BWBR0002731/1998-04-22#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0002731
        artikel: '43'
        hoofdstuk: V
  - number: '92'
    text: Het is verboden te handelen in strijd met
    url: https://wetten.overheid.nl/BWBR0002731/1998-04-22#Artikel92
  - number: 92.a
    text: |-
      het bij of krachtens [artikel 13][ref1], [14][ref2], [48, eerste of tweede lid][ref3], dan wel
      [86, tweede lid][ref4] bepaalde,


      [ref1]: https://wetten.overheid.nl/BWBR0002731#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0002731#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0002731#Artikel48
