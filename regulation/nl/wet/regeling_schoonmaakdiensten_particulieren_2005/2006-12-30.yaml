---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: regeling_schoonmaakdiensten_particulieren_2005
regulatory_layer: WET
publication_date: '2006-11-10'
valid_from: '2006-12-30'
bwb_id: BWBR0018541
url: https://wetten.overheid.nl/BWBR0018541/2006-12-30
preamble:
  text: |-
    Gelet op de artikelen 3, eerste lid, 5 en 8, eerste lid, van de Kaderwet SZW-subsidies;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0018541/2006-12-30#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze regeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0018541/2006-12-30#Artikel1
  - number: 1.a
    text: 'de minister: de Minister van Sociale Zaken en Werkgelegenheid;'
    url: https://wetten.overheid.nl/BWBR0018541/2006-12-30#Artikel1
  - number: 1.b
    text: |-
      werkgever: de werkgever genoemd in [bijlage 1][ref1] als bedoeld in [artikel 3][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0018541
      [ref2]: https://wetten.overheid.nl/BWBR0018541#Artikel3
    url: https://wetten.overheid.nl/BWBR0018541/2006-12-30#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0018541
      - id: ref2
        bwb_id: BWBR0018541
        artikel: '3'
  - number: 1.c
    text: |-
      arbeidsovereenkomst: een schriftelijk aangegaine arbeidsovereenkomst als bedoeld in
      [artikel 610 van titel 7.10 van het Burgerlijk Wetboek][ref1] met de werkgever;


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel610
    url: https://wetten.overheid.nl/BWBR0018541/2006-12-30#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '610'
  - number: 1.d
    text: |-
      consumentencontract: een schriftelijke overeenkomst van de werkgever met een derde natuurlijke persoon tot het door
      zijn werknemer laten verrichten van een bepaald gevarieerd pakket van huishoudelijke diensten in de particuliere
      sfeer van die natuurlijke persoon over een bepaalde periode op een vastgesteld gemiddeld aantal uren per week en
      tegen een bedongen prijs;
    url: https://wetten.overheid.nl/BWBR0018541/2006-12-30#Artikel1
  - number: 1.e
    text: |-
      verklaring: een verklaring afgegeven door de Centrale organisatie werk en inkomen, genoemd in
      [hoofdstuk 4 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1], dat


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0018541/2006-12-30#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0013060
        hoofdstuk: '4'
  - number: 1.e.1°
    text: |-
      de werknemer met wie de werkgever vóór 1 januari 2003 een arbeidsovereenkomst heeft
      gesloten langdurig werkloze is, overeenkomstig het voor die datum bepaalde bij of krachtens
      [hoofdstuk IV van de Wet vermindering afdracht loonbelasting en premie voor de volksverzekering][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0007746#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0018541/2006-12-30#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007746
        hoofdstuk: IV
  - number: 1.e.2°
    text: |-
      de werknemer met wie de werkgever na 1 januari 2003 een arbeidsovereenkomst heeft gesloten, minimaal zes maanden
      als werkloos werkzoekend bij de Centrale organisatie werk en inkomen ingeschreven heeft gestaan dan wel naar haar
      oordeel in vergelijkbare omstandigheden heeft verkeerd;
    url: https://wetten.overheid.nl/BWBR0018541/2006-12-30#Artikel1
  - number: 1.f
    text: |-
      accountant: een accountant als bedoeld in [artikel 393, eerste lid, van boek 2 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0018541/2006-12-30#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '2.1'
    text: 'De minister verstrekt een subsidie aan de werkgever:'
    url: https://wetten.overheid.nl/BWBR0018541/2006-12-30#Artikel2
  - number: 2.1.a
    text: |-
      die een arbeidsovereenkomst heeft gesloten met een persoon, voor
      wie de Centrale organisatie werk en inkomen met inachtneming van
      [hoofdstuk IV van de Wet vermindering afdracht loonbelasting en premie voor de volksverzekeringen][ref1], zoals
      [deze wet][ref2] luidde voor 1 januari 2003, een verklaring als bedoeld in [artikel 1, onderdeel f, sub 1][ref3],
      heeft afgegeven; of


      [ref1]: https://wetten.overheid.nl/BWBR0007746#HoofdstukIV
      [ref2]: https://wetten.overheid.nl/BWBR0007746
      [ref3]: https://wetten.overheid.nl/BWBR0018541#Artikel1
    url: https://wetten.overheid.nl/BWBR0018541/2006-12-30#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0007746
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0007746
      - id: ref3
        bwb_id: BWBR0018541
        artikel: '1'
  - number: 2.1.b
    text: |-
      die een arbeidsovereenkomst met een overeengekomen gemiddelde arbeidsduur van ten minste 12 uur per week, berekend
      over een periode van 13 weken, heeft gesloten met een persoon voor wie de Centrale organisatie werk en inkomen een
      verklaring als bedoeld in [artikel 1, onderdeel f, sub 2][ref1], heeft afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0018541#Artikel1
    url: https://wetten.overheid.nl/BWBR0018541/2006-12-30#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0018541
        artikel: '1'
  - number: '2.2'
    text: |-
      Geen subsidie wordt verstrekt, indien een dienstbetrekking wordt aangegaan
      als bedoeld in de [Wet sociale werkvoorziening][ref1] of met toepassing van
      [artikel 7, eerste lid, onderdeel a, van de Wet werk en bijstand][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008903
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel7
    url: https://wetten.overheid.nl/BWBR0018541/2006-12-30#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0008903
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '7'
  - number: '2.3'
    text: |-
      Geen subsidie wordt verstrekt, indien de huishoudelijke diensten op basis van de
      consumentencontracten worden verleend in de vorm van zorg waarop aanspraak bestaat ingevolge
      [artikel 3 van het Besluit zorgaanspraken AWBZ][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014149#Artikel3
    url: https://wetten.overheid.nl/BWBR0018541/2006-12-30#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0014149
        artikel: '3'
  - number: '3.1'
    text: |-
      Het subsidieplafond per werkgever is van 1 juli 2005 tot 1 januari 2006 vastgesteld overeenkomstig
      [bijlage 1][ref1] bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0018541
    url: https://wetten.overheid.nl/BWBR0018541/2006-12-30#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0018541
  - number: '3.2'
    text: |-
      Het subsidieplafond per werkgever is van 1 januari 2006 tot 1 januari 2007 vastgesteld overeenkomstig
      [bijlage 1a][ref1] bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0018541
    url: https://wetten.overheid.nl/BWBR0018541/2006-12-30#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0018541
  - number: '4.1'
    text: |-
      De minister verleent de subsidie voor het in dienst hebben van personen als bedoeld in
      [artikel 2, eerste lid][ref1], rekening houdend met de omvang van de uitgevoerde werkzaamheden op die
      consumentencontracten.


      [ref1]: https://wetten.overheid.nl/BWBR0018541#Artikel2
    url: https://wetten.overheid.nl/BWBR0018541/2006-12-30#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0018541
        artikel: '2'
  - number: '4.2'
    text: |-
      De subsidie aan de werkgever wordt bepaald aan de hand van het aantal arbeidsuren dat in de arbeidsovereenkomsten,
      gesloten met personen als bedoeld in [artikel 2, eerste lid][ref1], is overeengekomen, waarbij:


      [ref1]: https://wetten.overheid.nl/BWBR0018541#Artikel2
    url: https://wetten.overheid.nl/BWBR0018541/2006-12-30#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0018541
        artikel: '2'
  - number: 4.2.a
    text: |-
      de subsidie ten hoogste € 10.340,– per kalenderjaar bedraagt bij een arbeidsovereenkomst met een overeengekomen
      arbeidsduur van 32 uur of meer uren per week en naar rato wordt verminderd naarmate de arbeidsovereenkomst minder
      dan een jaar heeft geduurd of een arbeidsduur heeft van minder dan 32 uur per week of naarmate het gemiddelde
      aantal arbeidsuren waarvoor de werkgever loon heeft betaald minder dan 32 uur per week bedraagt;
    url: https://wetten.overheid.nl/BWBR0018541/2006-12-30#Artikel4
  - number: 4.2.b
    text: |-
      op jaarbasis het aantal overeengekomen arbeidsuren in de bedoelde arbeidsovereenkomsten niet meer bedraagt dan het
      aantal uren vermenigvuldigd met 1,3, waarop werkzaamheden op consumentencontracten als bedoeld in het eerste lid
      zijn verricht;
    url: https://wetten.overheid.nl/BWBR0018541/2006-12-30#Artikel4
  - number: 4.2.c
    text: |-
      indien niet voldaan wordt aan onderdeel b, niet wordt uitgegaan van de overeengekomen arbeidsuren, maar van het
      aantal uren vermenigvuldigd met 1,3, waarop werkzaamheden op consumentencontracten als bedoeld in het eerste lid
      zijn verricht doch niet meer dan het aantal arbeidsuren waarvoor de werkgever loon heeft betaald.
    url: https://wetten.overheid.nl/BWBR0018541/2006-12-30#Artikel4
  - number: '4.3'
    text: |-
      Indien in de arbeidsovereenkomst geen vast aantal arbeidsuren is overeengekomen en de gemiddelde arbeidsduur,
      naar rato van de periode waarover in een jaar is gewerkt, voldoet aan [artikel 2, eerste lid][ref1], wordt bij
      de toepassing van het tweede lid het subsidiebedrag bepaald aan de hand van het aantal arbeidsuren waarvoor de
      werkgever loon heeft betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0018541#Artikel2
    url: https://wetten.overheid.nl/BWBR0018541/2006-12-30#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0018541
        artikel: '2'
  - number: '5.1'
    text: |-
      De subsidieontvanger draagt er zorg voor dat de administratie voor de uitvoering van deze regeling zodanig
      wordt ingericht, dat alle van belang zijnde vastleggingen en bewijsstukken ten behoeve van het besluitvormings-,
      uitvoerings-, controle- en verantwoordingsproces zichtbaar en controleerbaar zijn vastgelegd.
    url: https://wetten.overheid.nl/BWBR0018541/2006-12-30#Artikel5
  - number: '5.2'
    text: |-
      Van de administratie maken in ieder geval deel uit: de arbeidsovereenkomsten en de consumentencontracten en de
      daarbij behorende facturen.
    url: https://wetten.overheid.nl/BWBR0018541/2006-12-30#Artikel5
  - number: '5.3'
    text: |-
      De subsidieontvanger bewaart een afschrift van de verklaring bij de loonadministratie, zolang dat voor de
      subsidievaststelling noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0018541/2006-12-30#Artikel5
  - number: '6.1'
    text: |-
      Een beschikking tot subsidieverlening op grond van de [Regeling schoonmaakdiensten particulieren][ref1] wordt per 1
      juli 2005 geacht een beschikking tot subsidieverlening op grond van deze regeling te zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0009136
    url: https://wetten.overheid.nl/BWBR0018541/2006-12-30#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0009136
  - number: '6.2'
    text: |-
      De minister betaalt de subsidie bij wijze van voorschot per kwartaal aan de hand van de declaratie met opgave van
      de gegevens over arbeidsuren volgens de arbeidsovereenkomst, het aantal arbeidsuren waarvoor de werkgever loon
      heeft betaald en de gewerkte uren op consumentencontracten, die gefactureerd zijn.
    url: https://wetten.overheid.nl/BWBR0018541/2006-12-30#Artikel6
  - number: '6.3'
    text: |-
      De subsidieontvanger draagt er zorg voor dat de relevante gegevens over een kalenderkwartaal, opgenomen in een
      door hem ondertekende declaratie als bedoeld in het tweede lid, door de minister zijn ontvangen uiterlijk op de
      twintigste van de tweede maand volgende op het kwartaal waarop deze betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0018541/2006-12-30#Artikel6
  - number: '6.4'
    text: |-
      Het voorschot wordt betaald op of omstreeks de vijftiende van de maand volgend op de maand waarin de declaratie is
      ontvangen. Het voorschot wordt niet verleend, indien de minister van de subsidieontvanger de bescheiden, nodig voor
      de subsidievaststelling betreffende voorgaande subsidieverstrekkingen, niet heeft ontvangen.
    url: https://wetten.overheid.nl/BWBR0018541/2006-12-30#Artikel6
  - number: '6.5'
    text: |-
      De subsidieontvanger informeert de Minister schriftelijk binnen vier weken over het tijdstip van beëindiging
      van een arbeidsovereenkomst als bedoeld in [artikel 2, eerste lid][ref1], en over de beëindiging van
      consumentencontracten.


      [ref1]: https://wetten.overheid.nl/BWBR0018541#Artikel2
    url: https://wetten.overheid.nl/BWBR0018541/2006-12-30#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0018541
        artikel: '2'
  - number: '6.6'
    text: |-
      Indien vóór de subsidievaststelling een verzoek tot faillietverklaring van of verlening van surséance van betaling
      aan de subsidie-ontvanger is ingediend, vindt geen uitbetaling van voorschotten meer plaats.
    url: https://wetten.overheid.nl/BWBR0018541/2006-12-30#Artikel6
  - number: '7.1'
    text: |-
      De subsidieontvanger draagt er zorg voor dat de relevante gegevens over een kalenderjaar, opgenomen in een
      door hem ondertekende jaaropgave en, voor zover het daarin vermelde subsidiebedrag hoger is dan € 50.000,–, een
      daarop betrekking hebbende verklaring van een accountant door de minister zijn ontvangen binnen 6 maanden na het
      kalenderjaar waarop deze betrekking hebben.
    url: https://wetten.overheid.nl/BWBR0018541/2006-12-30#Artikel7
  - number: '7.2'
    text: De minister stelt de subsidie vast binnen 12 maanden na ontvangst van de jaaropgave.
    url: https://wetten.overheid.nl/BWBR0018541/2006-12-30#Artikel7
  - number: '7.3'
    text: |-
      Indien de bescheiden, genoemd in het eerste lid, niet zijn ontvangen binnen 6 maanden na het kalenderjaar waarop
      deze betrekking hebben kan de minister de subsidie over dat kalenderjaar ambtshalve vaststellen.
    url: https://wetten.overheid.nl/BWBR0018541/2006-12-30#Artikel7
  - number: '7.4'
    text: |-
      De vastgestelde subsidie kan van de bij wijze van voorschot betaalde subsidie afwijken indien de subsidieontvanger
      handelt in strijd met deze regeling.
    url: https://wetten.overheid.nl/BWBR0018541/2006-12-30#Artikel7
  - number: '7.5'
    text: |-
      Bij de toepassing van het eerste lid wordt met betrekking tot het kalenderjaar 2005 voor ‘€ 50.000,–’ gelezen:
      € 25.000.
    url: https://wetten.overheid.nl/BWBR0018541/2006-12-30#Artikel7
  - number: '8'
    text: |-
      De declaratie, bedoeld in [artikel 6, vierde lid][ref1], en de jaaropgave en de verklaring van de accountant,
      bedoeld in [artikel 7][ref2], zijn ingericht volgens de bij deze regeling behorende modellen. De verklaring
      is gebaseerd op een onderzoek, dat is uitgevoerd overeenkomstig het bij deze regeling behorende controle- en
      rapportageprotocol.


      [ref1]: https://wetten.overheid.nl/BWBR0018541#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0018541#Artikel7
    url: https://wetten.overheid.nl/BWBR0018541/2006-12-30#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0018541
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0018541
        artikel: '7'
  - number: '9.1'
    text: |-
      Met het toezicht op de naleving van de in deze regeling opgenomen verplichtingen zijn belast het Agentschap van het
      Ministerie van Sociale Zaken en Werkgelegenheid.
    url: https://wetten.overheid.nl/BWBR0018541/2006-12-30#Artikel9
  - number: '9.2'
    text: |-
      De subsidieontvanger verstrekt aan de minister desgevraagd kosteloos alle inlichtingen, die hij voor evaluatie,
      informatievoorziening en beleidsvorming met betrekking tot deze regeling nodig heeft en verleent daartoe inzage in
      ter zake van belang zijnde bescheiden.
    url: https://wetten.overheid.nl/BWBR0018541/2006-12-30#Artikel9
  - number: '10'
    text: |-
      Indien de ontwikkeling van het wettelijke minimumloon daartoe aanleiding geeft, maakt de minister een wijziging
      van het bedrag, genoemd in [artikel 4, tweede lid, onderdeel a][ref1], tijdig vóór de aanvang van een kalenderjaar
      bekend.


      [ref1]: https://wetten.overheid.nl/BWBR0018541#Artikel4
    url: https://wetten.overheid.nl/BWBR0018541/2006-12-30#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0018541
        artikel: '4'
  - number: '11'
    text: |-
      De [Algemene Regeling SZW-subsidies][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009211
    url: https://wetten.overheid.nl/BWBR0018541/2006-12-30#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0009211
  - number: '12.1'
    text: |-
      Bij de toepassing van [artikel 5, dertiende lid][ref1], juncto
      [artikel 10, eerste lid, van de Regeling schoonmaakdiensten particulieren][ref2] wordt met betrekking tot de
      subsidieontvanger die gebruik maakt van de [onderhavige regeling][ref3] voor ‘deze regeling’ gelezen: de Regeling
      schoonmaakdiensten particulieren 2005.


      [ref1]: https://wetten.overheid.nl/BWBR0009136#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0009136#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0009136
    url: https://wetten.overheid.nl/BWBR0018541/2006-12-30#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0009136
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0009136
        artikel: '10'
      - id: ref3
        bwb_id: BWBR0009136
  - number: '12.2'
    text: |-
      Bij de toepassing van [artikel 6a, tweede en derde lid][ref1], juncto
      [artikel 10, eerste lid, van de Regeling schoonmaakdiensten particulieren][ref2] wordt met betrekking tot de
      subsidieontvanger die gebruik maakt van de onderhavige regeling voor ‘1 januari 2006’ gelezen: 1 juli 2006.


      [ref1]: https://wetten.overheid.nl/BWBR0009136#Artikel6a
      [ref2]: https://wetten.overheid.nl/BWBR0009136#Artikel10
    url: https://wetten.overheid.nl/BWBR0018541/2006-12-30#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0009136
        artikel: 6a
      - id: ref2
        bwb_id: BWBR0009136
        artikel: '10'
  - number: 12a.1
    text: |-
      Met ingang van de datum waarop aan de subsidieaanvrager subsidie op grond van
      __REF000___________________________________________________________________________________________________________
      __________ wordt verleend, beëindigt de minister de subsidie op grond van [artikel 4][ref2] van deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0018726#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0018541#Artikel4
    url: https://wetten.overheid.nl/BWBR0018541/2006-12-30#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0018726
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0018541
        artikel: '4'
  - number: 12a.2
    text: |-
      Indien aan de subsidieaanvrager subsidie op grond van
      __REF000___________________________________________________________________________________________________________
      __________ wordt verleend, wordt een eenmalig voorschot als bedoeld in
      [artikel 5, achtste lid, van de Regeling schoonmaakdiensten particulieren][ref2], dan wel een eenmalig
      voorschot als bedoeld in [artikel 5, negende lid, van de Regeling schoonmaakdiensten particulieren][ref3]
      niet bij de subsidievaststelling op grond van [artikel 7][ref4] in
      aanmerking genomen, maar bij de subsidievaststelling op grond van
      [artikel 12 van de Tijdelijke subsidieregeling beëindiging subsidiëring schoonmaakdiensten particulieren][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0018726#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0009136#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0009136#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0018541#Artikel7
      [ref5]: https://wetten.overheid.nl/BWBR0018726#Artikel12
    url: https://wetten.overheid.nl/BWBR0018541/2006-12-30#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0018726
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0009136
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0009136
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0018541
        artikel: '7'
      - id: ref5
        bwb_id: BWBR0018726
        artikel: '12'
  - number: 12a.3
    text: |-
