    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel83
  - number: 8:3.2.a
    text: het verzorgen van de persvoorlichting;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel83
  - number: 8:3.2.b
    text: het leveren van communicatieadvies;
