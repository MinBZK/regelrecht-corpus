    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel82
  - number: 8:2.2.a
    text: |-
      het adviseren en rapporteren over en coördineren van afdelingoverstijgende zaken op het gebied van de
      bedrijfsvoering;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel82
  - number: 8:2.2.b
    text: het secretarieel ondersteunen van het management van de directie;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel82
  - number: 8:2.2.c
    text: het verzorgen van managementrapportages gericht op de in- en externe bedrijfsvoering;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel82
