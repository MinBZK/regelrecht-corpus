    text: De afdeling Protocol en Evenementen staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel88
  - number: 8:8.2
    text: 'De afdeling heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel88
  - number: 8:8.2.a
    text: het adviseren over en organiseren en regisseren van bestuurlijke representatie in de meest brede zin van het woord;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel88
  - number: 8:8.2.b
    text: |-
      het programmatisch voorbereiden en uitvoeren – zowel in- als extern – van de inkomende en uitgaande werkbezoeken
      van de bewindslieden in binnen- en buitenland;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel88
  - number: 8:8.2.c
    text: |-
      het adviseren over en organiseren en regisseren van voor BZK gezichtsbepalende nationale en internationale
      symposia, conferenties en congressen;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel88
  - number: 8:8.2.d
    text: |-
      het invullen van de commerciële randvoorwaarden om op een voor BZK kostenefficiënte wijze invulling te geven aan
      evenementen.
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel88
  - number: 9:1
    text: 'De directie Facilitaire Zaken bestaat uit de volgende onderdelen:'
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel91
  - number: 9:1.a
    text: het Directiesecretariaat (DS);
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel91
  - number: 9:1.b
    text: de afdeling Advies & Coördinatie (A&C);
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel91
  - number: 9:1.c
    text: de afdeling Dienstverlening (DV);
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel91
  - number: 9:1.d
    text: het Inkoop Diensten Centrum (IDC).
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel91
  - number: 9:2.1
    text: Het Directiesecretariaat staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel92
  - number: 9:2.2
    text: 'Het directiesecretariaat heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel92
  - number: 9:2.2.a
    text: het adviseren en ondersteunen van de directeur met betrekking tot de bedrijfsvoering;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel92
  - number: 9:2.2.b
    text: het bewaken van de planning en control cyclus van de directie;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel92
  - number: 9:2.2.c
    text: het bieden van beleidsondersteuning aan het management;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel92
  - number: 9:2.2.d
    text: het uitvoeren van de beheerstaken voor de directie;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel92
  - number: 9:2.2.e
    text: |-
      het zorgdragen voor de postregistratie en bewaken van de voortgang van afhandeling van stukken en voor het op de
      juiste wijze documenteren en archiveren;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel92
  - number: 9:2.2.f
    text: het verzorgen van vergaderingen en besprekingen;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel92
  - number: 9:2.2.g
    text: het voeren van het beheer van het facilitair management informatiesysteem en de veiligheidssystemen;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel92
  - number: 9:2.2.h
    text: het voeren van servicelevel-, account- en klachtenmanagement.
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel92
  - number: 9:3.1
    text: De afdeling Advies & Coördinatie staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel93
  - number: 9:3.2
    text: 'De afdeling heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel93
  - number: 9:3.2.a
    text: de advisering en coördinatie op het terrein van facilitaire inkoop en huisvesting voor het ministerie;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel93
  - number: 9:3.2.b
    text: het zorgdragen voor de coördinatie van en het toezien op de uitvoeringsprocedures op facilitair gebied;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel93
  - number: 9:3.2.c
    text: het ontwikkelen van een departementaal aanbestedingsbeleid;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel93
  - number: 9:3.2.d
    text: |-
      het bevorderen van de aanwending en uitwisseling van kennis en ervaring op het terrein van verwerving van goederen
      en diensten;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel93
  - number: 9:3.2.e
    text: het ontwikkelen van implementeren van het beleid op het gebied van bedrijfsinterne milieuzorg binnen BZK;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel93
  - number: 9:3.2.f
    text: het uitvoeren van het milieubeleid volgens ISO 14001;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel93
  - number: 9:3.2.g
    text: |-
      het verwerven van een gemeubileerde verblijfsvoorziening ten behoeve van bewindslieden en het verzorgen van
      voorzieningen op het huisadres van de bewindslieden.
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel93
  - number: 9:4.1
    text: De afdeling Dienstverlening staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel94
  - number: 9:4.2
    text: De afdeling bestaat uit
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel94
  - number: 9:4.2.a
    text: een bureau Services (S);
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel94
  - number: 9:4.2.b
    text: een bureau Veiligheid (V);
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel94
  - number: 9:4.2.c
    text: een bureau Bedrijfshulpverlening (BHV).
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel94
  - number: 9:4.3
    text: |-
      De afdeling Dienstverlening heeft met betrekking tot gebouwbeheer, gebouwonderhoud, catering, schoonmaak, receptie,
      beveiliging, bedrijfshulpverlening, telecommunicatie, vervoer buitenlandse dienstreizen en algemene dienstverlening
      de volgende taken:
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel94
  - number: 9:4.3.a
    text: |-
      Het adviseren, registreren, plannen, coördineren, bewaken van de voortgang en (doen) uitvoeren van alle facilitaire
      producten;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel94
  - number: 9:4.3.b
    text: |-
      het uitvoeren van het veiligheidsbeleid en de beveiligingstaken voor nader te bepalen panden die in gebruik zijn
      door de ministeries van Binnenlandse Zaken en Koninkrijksrelaties en Justitie.
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel94
  - number: 9:5.1
    text: Het Inkoop Diensten Centrum staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel95
  - number: 9:5.2
    text: 'De afdeling heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel95
  - number: 9:5.2.a
    text: |-
      het ondersteunen en adviseren in alle departementale EG-aanbestedingen en het beheren van deze afgesloten
      contracten;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel95
  - number: 9:5.2.b
    text: |-
      Het uitbreiden, afsluiten en het beheren van BZK-brede raamovereenkomsten en het aanleveren van
      managementinformatie over het gebruik van deze raamovereenkomsten;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel95
  - number: 9:5.2.c
    text: Het uitvoeren van de administratieve afhandelingen voor alle BZK-brede raamovereenkomsten;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel95
  - number: 9:5.2.d
    text: Toetsen van EG-aanbestedingen op verzoek van de Coördinerend Directeur Inkoop.
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel95
  - number: 10:1.1
    text: De plaatsvervangend secretaris-generaal is verantwoordelijk voor het beheer en de terinzagelegging van dit besluit.
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel101
  - number: 10:1.2
    text: |-
      Het beheer geschiedt met inachtneming van de desbetreffende (richtlijnen inzake) administratieve
      organisatiebeschrijvingen.
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel101
  - number: 10:2
    text: |-
      Wijziging van dit besluit is voorbehouden aan de secretaris-generaal en geschiedt op voordracht van de
      plaatsvervangend secretaris-generaal, na advisering door de directeur Personeel en Organisatie.
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel102
  - number: 11:1
    text: |-
      Dit besluit treedt in werking met ingang van de tweede dag na plaatsing van dit besluit in de Staatscourant en
      werkt terug tot en met 1 september 2004.
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel111
  - number: 11:2
    text: 'Dit besluit wordt aangehaald als: Organisatiebesluit Gemeenschappelijke Diensten (Organisatiebesluit GD).'
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel112
  - number: 11:3
    text: |-
      Met verwijzing naar [artikel 11:3 van het organisatiebesluit Concernstaven][ref1] wordt het
      [Organisatiebesluit Centrale Stafdiensten][ref2] van 17 september 2003 ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0017889#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0015583
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel113
    references:
      - id: ref1
        bwb_id: BWBR0017889
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0015583
