    text: het uitvoeren van periodieke controles en audits in lopende werkprocessen en projecten;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel87
  - number: 8:7.2.o
    text: het ontwikkelen en geven van modules/cursussen t.b.v kennisontwikkeling;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel87
  - number: 8:7.2.p
    text: het volgen van de ontwikkelingen op het terrein van de informatievoorziening;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel87
