    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel83
  - number: 8:4.1
    text: De afdeling Publicatie, Tekst en Web staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel84
