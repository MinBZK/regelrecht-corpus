    text: |-
      In dit besluit wordt verstaan onder: - ministerie: het Ministerie van Binnenlandse Zaken en Koninkrijksrelaties;
        - minister: de Minister van Binnenlandse Zaken en Koninkrijksrelaties.
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel1
  - number: '2'
    text: |-
      Dit besluit heeft betrekking op de Gemeenschappelijk Diensten, genoemd in het [Organisatiebesluit BZK 2004][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017563
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0017563
  - number: 3:1
    text: 'Het bureau Gemeenschappelijke Diensten heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel31
  - number: 3:1.a
    text: het coördineren van beleidsprocessen en het ondersteunen van de bestuursprocessen;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel31
  - number: 3:1.b
    text: het operationaliseren van de kaderstelling op het niveau van de Gemeenschappelijke Diensten;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel31
  - number: 3:1.c
    text: het uitoefenen van de integrale control functie voor de Gemeenschappelijke Diensten en de Concernstaven;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel31
  - number: 3:1.d
    text: |-
      het ondersteunen van de algemeen directeur Gemeenschappelijke Diensten in zijn rol als opdrachtgever van de
      onderdelen van de Gemeenschappelijke Diensten.
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel31
  - number: 4:1
    text: 'Het bureau Strategie en Innovatie heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel41
  - number: 4:1.a
    text: het initiëren en innoveren van de vraaggestuurde bedrijfsvoering van BZK;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel41
  - number: 4:1.b
    text: het adviseren over de koers van de Gemeenschappelijke Diensten op de (middel)lange termijn;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel41
  - number: 4:1.c
    text: |-
      het voeren van het accountmanagement ten behoeve van de opstelling en realisering van dienstverleningsafspraken
      en plusvarianten;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel41
  - number: 4:1.d
    text: het voeren van het secretariaat van het directeurenoverleg.
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel41
  - number: 5:1
    text: 'De directie Personeel en Organisatiebestaat uit de volgende onderdelen:'
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel51
  - number: 5:1.a
    text: het directiesecretariaat (DS);
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel51
  - number: 5:1.b
    text: de afdeling HRM-advies (HRM-advies);
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel51
  - number: 5:1.c
    text: de afdeling Management Development, Loopbaanbeleid en Opleidingen (MLO);
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel51
  - number: 5:1.d
    text: de afdeling HRM-beleid, Juridische Zaken en Overleg (HJO);
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel51
  - number: 5:1.e
    text: de afdeling Organisatieadvies (O-advies);
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel51
  - number: 5:1.f
    text: de Personeelsbeheer, Ondersteuning en Monitoring (POM).
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel51
  - number: 5:2.1
    text: Het Directiesecretariaat staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel52
  - number: 5:2.2
    text: 'Het directiesecretariaat heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel52
  - number: 5:2.2.a
    text: het adviseren en ondersteunen van de directeur P&O ten aanzien van beleidsprocessen en bedrijfsvoering;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel52
  - number: 5:2.2.b
    text: het uitvoeren van de financiële en P-beheerstaken voor de directie;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel52
  - number: 5:2.2.c
    text: |-
      het zorgdragen voor de management ondersteuning van directeur en afdelingshoofden, waaronder postregistratie en het
      bewaken van de voortgang van afhandeling van stukken en het documenteren en archiveren;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel52
  - number: 5:2.2.d
    text: het voeren van het secretariaat van de Personeelsvereniging.
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel52
  - number: 5:3.1
    text: De afdeling HRM-advies staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel53
  - number: 5:3.2
    text: 'De afdeling heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel53
  - number: 5:3.2.a
    text: het adviseren van het lijnmanagement over HRM-zaken;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel53
  - number: 5:3.2.b
    text: het adviseren van de medewerkers op het gebied van HRM-zaken;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel53
  - number: 5:3.2.c
    text: het bijdragen aan de ontwikkeling van het HRM-beleid en HRM-instrumenten en het zorgdragen voor implementatie.
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel53
  - number: 5:4.1
    text: De afdeling Management Development, Loopbaanbeleid en Opleidingen staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel54
  - number: 5:4.2
    text: 'De afdeling heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel54
  - number: 5:4.2.a
    text: |-
      het zorgdragen voor beleidsontwikkeling, -uitvoering en advisering op het terrein van management development/
      loopbaanbeleid voor functies vanaf schaal 14;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel54
  - number: 5:4.2.b
    text: het faciliteren van loopbaan- en opleidingsadvies;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel54
  - number: 5:4.2.c
    text: het ontwikkelen, bijstellen en realiseren van het opleiding-, mobiliteit- en diversiteitbeleid.
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel54
  - number: 5:4.2.d
    text: het verzorgen van het centrale introductieprogramma en uitvoeren van de BZK-academie;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel54
  - number: 5:4.2.e
    text: het verzorgen van de backoffice-functie bij werving en selectie;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel54
  - number: 5:4.2.f
    text: het coördineren van het herplaatsingsbeleid en zorg dragen voor de uitvoering hiervan;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel54
  - number: 5:4.2.g
    text: het coördineren, begeleiden en uitvoeren van het traineeprogramma BZK;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel54
  - number: 5:4.2.h
    text: |-
      het onderhouden en uitvoeren van arbeidsmarktcommunicatie-activiteiten en het ontwikkelen en implementeren van
      ondersteunende instrumenten.
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel54
  - number: 5:5.1
    text: De afdeling HRM-beleid, Juridische Zaken en Overleg staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel55
  - number: 5:5.2
    text: 'De afdeling heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel55
  - number: 5:5.2.a
    text: |-
      het zorgdragen voor de ontwikkeling, evaluatie en actualisatie van het departementale HRM- en ARBO-beleid, de
      regelgeving en de uitvoeringsvoorschriften en -procedures op het gebied van arbeidsvoorwaarden, rechtspositie en
      sociale zekerheid;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel55
  - number: 5:5.2.b
    text: het zorgdragen voor en onderhouden van de Organisatie- en de mandaat- en volmachtbesluiten;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel55
  - number: 5:5.2.c
    text: |-
      het adviseren en geven van voorlichting aan het lijnmanagement en personeelsfunctionarissen over complexe
      vraagstukken op genoemde gebieden;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel55
  - number: 5:5.2.d
    text: |-
      het organiseren van en adviseren over het overleg van de departementsleiding met het Georganiseerd Overleg en de
      medezeggenschap;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel55
  - number: 5:5.2.e
    text: |-
      het bijdragen aan de beslechting van personele conflicten door advisering, bemiddeling en het voeren van
      onderhandelingen;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel55
  - number: 5:5.2.f
    text: |-
      het behandelen van en het adviseren over bezwaar- en beroepszaken en het optreden als gemachtigde ter
      terechtzitting;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel55
  - number: 5:5.2.g
    text: |-
      het voeren van de secretariaten van bezwaren-, hoor- en klachtencommissies, de Groepsondernemingsraad en het
      Departementaal Georganiseerd Overleg;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel55
  - number: 5:5.2.h
    text: het vertalen in regelgeving en het uitvoeren en coördineren van het departementale integriteitbeleid;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel55
  - number: 5:5.2.i
    text: het zorgdragen voor de ontwikkeling van het reïntegratiebeleid en het coördineren van de uitvoering ervan;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel55
  - number: 5:5.2.j
    text: |-
      het zorgdragen voor de uitvoering/uitbesteding van kinderopvang, bedrijfsmaatschappelijk werk en Arbodienst en het
      afsluiten van contracten openbaar vervoer t.b.v. het woon/werkverkeer.
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel55
  - number: 5:6.1
    text: De afdeling Organisatieadvies staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel56
  - number: 5:6.2
    text: 'De afdeling heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel56
  - number: 5:6.2.a
    text: het signaleren en analyseren van organisatievraagstukken en veranderingsbehoeften binnen het departement;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel56
  - number: 5:6.2.b
    text: |-
      het adviseren van de departementsleiding en het lijnmanagement over vraagstukken met betrekking tot de
      organisatorische inrichting van het ministerie, bijbehorende verandertrajecten en formatieve vraagstukken;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel56
  - number: 5:6.2.c
    text: |-
      het coördineren van de uitvoering van omvangrijke en/of complexe projecten ter verbetering van de departementale
      organisatie of bedrijfsvoering;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel56
  - number: 5:6.2.d
    text: het opzetten en beheren van het virtueel adviesnetwerk binnen BZK;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel56
  - number: 5:6.2.e
    text: het ondersteunen van onderdelen van het ministerie bij verandering van de cultuur en de werkwijze;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel56
  - number: 5:6.2.f
    text: het jaarlijks uitvoeren van het medewerkers en stakeholders onderzoek.
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel56
  - number: 5:7.1
    text: De afdeling Personeelsbeheer, Ondersteuning en Monitoring staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel57
  - number: 5:7.2
    text: |-
      De afdeling bestaat uit de eenheden Personeels- en Salarisadministratie (PSA), Kwaliteitszorg, Administratieve
      Organisatie en Interne Controle (KAI), Ondersteuning (OND) en Monitoring en Personele Informatie (MPI).
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel57
  - number: 5:7.3
    text: 'De afdeling heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel57
  - number: 5:7.3.a
    text: |-
      het afhandelen van personeels- en salarismutaties voor het departement, het ministerie van Algemene Zaken en de
      Hoge Colleges van Staat;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel57
  - number: 5:7.3.b
    text: het zorg dragen voor de financiële afwikkeling rond de personeels- en salarisadministratie;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel57
  - number: 5:7.3.c
    text: |-
      het zorg dragen voor de interne controle en kwaliteitszorg op het terrein van de personeels- en
      salarisadministratie;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel57
  - number: 5:7.3.d
    text: het verstrekken van informatie over wet- en regelgeving op het gebied van personeelsbeheer;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel57
  - number: 5:7.3.e
    text: |-
      het zowel adviserend als beheersmatig bijdragen aan de ontwikkeling van de Administratieve Organisatie van de
      directie P&O;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel57
  - number: 5:7.3.f
    text: het leveren van ondersteuning bij de lange/korte uitzending;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel57
  - number: 5:7.3.g
    text: het voeren van de formatieadministratie;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel57
  - number: 5:7.3.h
    text: het beheren van de aan P&O gerelateerd systemen;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel57
  - number: 5:7.3.i
    text: het beheer en de ontwikkeling van Emplaza;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel57
  - number: 5:7.3.j
    text: het zorg dragen voor managementinformatie zowel structureel als ad hoc;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel57
  - number: 5:7.3.k
    text: het opstellen van het Sociaal jaarverslag;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel57
  - number: 5:7.3.l
    text: |-
      het doen van onderzoek en audits op het terrein van HRM, het analyseren van de resultaten en het rapporteren aan de
      opdrachtgevers dan wel dienstleiding met het oog op het monitoren van de effecten van het HRM-beleid;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel57
  - number: 5:7.3.m
    text: het ondersteunen van de HRM-teams en de specialistische teams;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel57
  - number: 5:7.3.n
    text: het beheer en onderhoud van de medewerkerpagina op intranet BZK.
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel57
  - number: 6:1
    text: 'De directie Financiële Bedrijfsvoering bestaat uit de volgende onderdelen:'
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel61
  - number: 6:1.a
    text: het directiesecretariaat (DS);
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel61
  - number: 6:1.b
    text: de afdeling Bedrijfsvoering en Onderzoek (B&O);
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel61
  - number: 6:1.c
    text: de afdeling Kwaliteitsmanagement, Processen en Systemen (KPS);
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel61
  - number: 6:1.d
    text: de afdeling Financiële Administratie (FA);
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel61
  - number: 6:1.e
    text: de afdeling Uitvoering Financiële Verhoudingen (UFV).
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel61
  - number: 6:2.1
    text: Het Directiesecretariaat bestaat uit een directiesecretaris en een directiesecretaresse.
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel62
  - number: 6:2.2
    text: 'Het directiesecretariaat heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel62
  - number: 6:2.2.a
    text: het adviseren en ondersteunen van de directeur FB ten aanzien van beleidsprocessen en bedrijfsvoering;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel62
  - number: 6:2.2.b
    text: het ondersteunen van het management van de directie;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel62
  - number: 6:2.2.c
    text: het uitvoeren van de financiële en P-beheerstaken voor de directie;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel62
  - number: 6:2.2.d
    text: het verzorgen van vergaderingen en besprekingen;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel62
  - number: 6:2.2.e
    text: het bewaken van relevante processen voor het directiesecretariaat;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel62
  - number: 6:2.2.f
    text: |-
      het zorgdragen voor de postregistratie en het bewaken van de voortgang van afhandeling van stukken en het
      documenteren en archiveren.
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel62
  - number: 6:3.1
    text: De afdeling Bedrijfsvoering en Onderzoek staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel63
  - number: 6:3.2
    text: 'De afdeling heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel63
  - number: 6:3.2.a
    text: het ontwikkelen van de visie op management control, waaronder VBTB, risicomanagement e.d.;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel63
  - number: 6:3.2.b
    text: |-
      het ondersteunen van de dienstonderdelen en directies bij het opzetten en onderhouden van het Management Control
      Systeem en de planning en controlcyclus van BZK;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel63
  - number: 6:3.2.c
    text: het opstellen van de mededeling over de bedrijfsvoering;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel63
  - number: 6:3.2.d
    text: |-
      het ontwikkelen van de visie op de aansturing en het toezicht op alle zelfstandige organisaties behorend bij BZK,
      en het coördineren van de toezichtarrangementen terzake;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel63
  - number: 6:3.2.e
    text: het voeren van het secretariaat van het Audit Committee;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel63
  - number: 6:3.2.f
    text: |-
      het omzetten van interdepartementale financiële bedrijfsvoeringkaders en normen naar departementale regelgeving en
      het zorgdragen voor en ondersteunen van de directies bij de implementatie van de financiële regelgeving binnen BZK;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel63
  - number: 6:3.2.g
    text: het uitvoeren van onderzoeken op de betreffende terreinen;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel63
  - number: 6:3.2.h
    text: Het ondersteunen van directies in de reguliere financiële processen.
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel63
  - number: 6:4.1
    text: De afdeling Kwaliteitsmanagement, Processen en Systemen staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel64
  - number: 6:4.2
    text: 'De afdeling heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel64
  - number: 6:4.2.a
    text: |-
      het inrichten, beheersen, verbeteren en beheren van bedrijfsprocessen, -informatievoorziening en aan begroting
      gerelateerde bedrijfsvoeringsystemen, administraties en producten en diensten;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel64
  - number: 6:4.2.b
    text: het faciliteren van ondersteunende processen ten behoeve van de budgethouders;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel64
  - number: 6:4.2.c
    text: het opstellen en toepassen van regelgeving voor het gebruik van de systeeminfrastructuur en de administratie;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel64
  - number: 6:4.2.d
    text: het toezicht houden op de naleving van de regelgeving;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel64
  - number: 6:4.2.e
    text: |-
      het afstemmen van de voortgang van en de gewenste ontwikkeling bij de beleidsvorming en inrichting van de
      managementinformatie, bedrijfsvoeringsystemen, gemeenschappelijke gegevens en financieel beheer met de integrale
      controlfunctie.
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel64
  - number: 6:5.1
    text: De afdeling Financiële Administratie staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel65
  - number: 6:5.2
    text: De afdeling bestaat uit het cluster Centraal Kasbeheer (CK) en het cluster Financieel Beheer (FB).
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel65
  - number: 6:5.3
    text: 'De afdeling heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel65
  - number: 6:5.3.a
    text: het voeren van de concernadministratie;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel65
  - number: 6:5.3.b
    text: het beheren van het relatiebestand;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel65
  - number: 6:5.3.c
    text: het voeren van de contractadministratie;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel65
  - number: 6:5.3.d
    text: het inrichten en uitvoeren van het betalingsverkeer van het departement;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel65
  - number: 6:5.3.e
    text: het adviseren en informeren omtrent de inrichting van het betalingsverkeer;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel65
  - number: 6:5.3.f
    text: het controleren en verwerken van de maandverantwoordingen van de kasbeheerders;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel65
  - number: 6:5.3.g
    text: het maken van grootboekrapportages;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel65
  - number: 6:5.3.h
    text: het registreren en verifiëren van facturen, vorderingen, verplichtingen en ontvangsten;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel65
  - number: 6:5.3.i
    text: Het adviseren over de wet- en regelgeving en procesgang in relatie tot de financiële administratie.
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel65
  - number: 6:6.1
    text: De afdeling Uitvoering Financiële Verhoudingen staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel66
  - number: 6:6.2
    text: 'De afdeling heeft met betrekking tot het gemeente- en het provinciefonds de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel66
  - number: 6:6.2.a
    text: het bijdragen aan de beleidsvoorbereiding en de juridische kaderstelling;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel66
  - number: 6:6.2.b
    text: |-
      het verzamelen, controleren, interpreteren, bewerken en verwerken van basismateriaal voor de berekening van de
      uitkeringen;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel66
  - number: 6:6.2.c
    text: het onderhouden van relaties (o.a. doormiddel van convenanten) met leveranciers van basismateriaal;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel66
  - number: 6:6.2.d
    text: het betaalbaarstellen van voorschotten en uitkeringen en het vaststellen van de algemene uitkering;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel66
  - number: 6:6.2.e
    text: het voorbereiden van aanwijzingen met betrekking tot specifieke verdeelmaatstaven;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel66
  - number: 6:6.2.f
    text: |-
      het verrichten van werkzaamheden in verband met bezwaar- en beroepszaken en het vertegenwoordigen van de minister
      in beroepszaken;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel66
  - number: 6:6.2.g
    text: het voeren van de financiële administraties;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel66
  - number: 6:6.2.h
    text: het inrichten en beheren van de administratieve organisatie en de bestuurlijke informatievoorziening;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel66
  - number: 6:6.2.i
    text: |-
      het uitvoeren van het [Besluit][ref1] en de
      [Regeling kostenverrekening en gegevensuitwisseling Wet waardering onroerende zaken][ref2] en het leveren van
      inhoudelijke bijdragen (evaluatie) over het juridisch kader hiervan;


      [ref1]: https://wetten.overheid.nl/BWBR0007230
      [ref2]: https://wetten.overheid.nl/BWBR0015059
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0007230
      - id: ref2
        bwb_id: BWBR0015059
  - number: 6:6.2.j
    text: |-
      het uitvoeren van de [Regeling subsidiëring Oorlogsgravenstichting][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008761
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0008761
  - number: 6:6.2.k
    text: |-
      het verzamelen van gegevens ten behoeve van de verrekening van de kosten van de waardering van onroerende zaken op
      voet van de [Wet waardering onroerende zaken][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007119
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0007119
  - number: 6:6.2.l
    text: het innen en betaalbaar stellen van gelden ten behoeve van de verrekening bedoeld onder k).
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel66
  - number: 7:1.1
    text: 'De directie Informatie en Communicatie Technologie bestaat uit de volgende onderdelen:'
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel71
  - number: 7:1.1.a
    text: de afdeling Architectuur en innovatie (A&I);
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel71
  - number: 7:1.1.b
    text: de afdeling ICT-Beheer (IB);
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel71
  - number: 7:1.1.c
    text: de afdeling ICT-Servicedesk (IS);
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel71
  - number: 7:1.1.d
    text: de afdeling ICT-Functioneel Applictiebeheer (FAB);
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel71
  - number: 7:1.1.e
    text: de afdeling Service en Kwaliteit (S&K).
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel71
  - number: 7:2.1
    text: De afdeling Architectuur en Innovatie staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel72
  - number: 7:2.2
    text: 'De afdeling heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel72
  - number: 7:2.2.a
    text: |-
      het voeren van de regie op de informatiearchitectuur uitmondend in voorschriften voor de ICT-infrastructuur en in
      kaderstelling voor de BZK informatiearchitectuur;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel72
  - number: 7:2.2.b
    text: |-
      het op aanvraag van andere directies adviseren over procesinrichting, informatieanalyse en de bijbehorende
      mogelijkheden van ICT-ondersteuning;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel72
  - number: 7:2.2.c
    text: het actueel houden van het architectuurplan voor de ICT binnen BZK;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel72
  - number: 7:2.2.d
    text: het volgen van ontwikkelingen in de ICT-markt en deze toepasbaar maken voor BZK;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel72
  - number: 7:2.2.e
    text: het zorgdragen voor het inpassen van nieuwe functionaliteiten in de ICT-infrastructuur;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel72
  - number: 7:2.2.f
    text: |-
      het zorgdragen voor een adequaat stelsel van informatiebeveiligingsplannen en -maatregelen voor de ICT-
      infrastructuur;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel72
  - number: 7:2.2.g
    text: het projectmatig zorgdragen voor de innovatie in en ontwikkeling van de geboden ICT-dienstverlening;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel72
  - number: 7:2.2.h
    text: het voorbereiden en uitbrengen van (beleids)adviezen op het gebied van ICT aan opdrachtgevers/afnemers;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel72
  - number: 7:2.2.i
    text: het onderhouden van nauwe contacten met de afdeling Strategie, Innovatie en Accountmanagement;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel72
  - number: 7:2.2.j
    text: het managen van en deelnemen in multidisciplinaire projecten en activiteiten;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel72
  - number: 7:2.2.k
    text: het managen van en participeren in interdepartementale trajecten en overlegorganen.
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel72
  - number: 7:3.1
    text: De afdeling ICT-Beheer staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel73
  - number: 7:3.2
    text: 'De afdeling heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel73
  - number: 7:3.2.a
    text: |-
      het voeren van het dagelijks beheer van het BZK-serverpark en bijbehorende randapparatuur, door middel van het
      uitvoeren van monitoring en tuning en backup- en restore-activiteiten;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel73
  - number: 7:3.2.b
    text: het uitvoeren van werkzaamheden op het gebied van de informatiebeveiliging van de infrastructuur;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel73
  - number: 7:3.2.c
    text: |-
      het zorgdragen voor de incidentbehandeling door het aanbrengen van aanpassingen in de infrastructuur of de
      verstoring op te lossen of door het coördineren van het proces van herstel;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel73
  - number: 7:3.2.d
    text: het projectmatig doorvoeren van vernieuwingen/aanpassingen in de ICT-infrastructuur;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel73
  - number: 7:3.2.e
    text: het beheren en beschikbaar houden van de beheerde databases;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel73
  - number: 7:3.2.f
    text: het beheren en inrichten van de ICT-werkplek (centraal);
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel73
  - number: 7:3.2.g
    text: het voorbereiden en aanbrengen van wijzigingen in en rond de werkplek (centraal);
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel73
  - number: 7:3.2.h
    text: het zorgdragen voor virus- en spambescherming voor de servers en de werkplekken;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel73
  - number: 7:3.2.i
    text: het (functioneel) beheren en beveiligen van de toegang tot Internet, intranet, WESTnet en BZKnet;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel73
  - number: 7:3.2.j
    text: het beheren van het locale netwerk (inclusief satellietlocaties) in het gebouw aan de Schedeldoekshaven;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel73
  - number: 7:3.2.k
    text: het zorgdragen voor de beveiliging van het interne netwerk.
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel73
  - number: 7:4.1
    text: De afdeling ICT-Servicedesk staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel74
  - number: 7:4.2
    text: 'De afdeling heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel74
  - number: 7:4.2.a
    text: |-
      het bieden van ondersteuning en dienstverlening aan gebruikers ten aanzien van de ICT-werkplek en de daarop
      werkende systeem-, generieke en specifieke toepassingen;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel74
  - number: 7:4.2.b
    text: het uitvoeren van werkzaamheden op het gebied van de informatiebeveiliging van de infrastructuur;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel74
  - number: 7:4.2.c
    text: |-
      het onderhouden van klantcontacten over het gebruik van de werkplek, inclusief de daarop geïnstalleerde
      applicaties;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel74
  - number: 7:4.2.d
    text: het be- en afhandelen van de aanvragen van accounts;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel74
  - number: 7:4.2.e
    text: het beheren van de uitleenservice voor hard- en software voor gebruik buiten het departement;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel74
  - number: 7:4.2.f
    text: |-
      het voeren van het incidentmanagement, door het invoeren, bewaken, analyseren en afhandelen van gemelde
      verstoringen van de (basis)dienstverlening of het coördineren van het proces van herstel;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel74
  - number: 7:4.2.g
    text: het voorbereiden en verzorgen van de inkoop van de hard- en software;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel74
  - number: 7:4.2.h
    text: het voorbereiden en aanbrengen van wijzigingen in en rond de werkplek (lokaal);
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel74
  - number: 7:4.2.i
    text: het aansturen van externe (ingehuurde) partijen die zich bezig houden met hardwarebeheer;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel74
  - number: 7:4.2.j
    text: het beheren en inrichten van de ICT-werkplek (lokaal);
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel74
  - number: 7:4.2.k
    text: |-
      het beheren en onderhouden van gegevens in de Configuration Management Database met betrekking tot hardware- en
      softwarecomponenten.
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel74
  - number: 7:5.1
    text: De afdeling Functioneel Applicatie Beheer staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel75
  - number: 7:5.2
    text: 'De afdeling heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel75
  - number: 7:5.2.a
    text: |-
      het inrichten en functioneel beheren van de centraal beheerde en specifieke applicaties opdat deze optimaal
      functioneren;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel75
  - number: 7:5.2.b
    text: het voeren van het autorisatiebeheer o.m. ter waarborging van vertrouwelijkheid van gegevens;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel75
  - number: 7:5.2.c
    text: het opstellen van (standaard) rapportages en overzichten;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel75
  - number: 7:5.2.d
    text: |-
      het ontwikkelen en aan de klant ter beschikking stellen van instrumenten waarmee de klant zélf de bevragingen kan
      uitvoeren;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel75
  - number: 7:5.2.e
    text: |-
      het opstellen en beheren van de regelgeving op het gebied van het gegevensbeheer (met name gericht op de
      integriteit van de gegevens);
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel75
  - number: 7:5.2.f
    text: het verhelpen van incidenten of andere verstoringen, o.m. door het coördineren van het proces van herstel.
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel75
  - number: 7:6.1
    text: De afdeling Service en Kwaliteit staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel76
  - number: 7:6.2
    text: 'De afdeling heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel76
  - number: 7:6.2.a
    text: het ontwikkelen en beheren van dienstverleningsafspraken;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel76
  - number: 7:6.2.b
    text: het adviseren, coördineren en afstemmen van de in- en externe bedrijfsvoering;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel76
  - number: 7:6.2.c
    text: |-
      het bijdragen aan de kwaliteitsborging door monitoring van de door de andere ICT-afdelingen uitgevoerde
      activiteiten en van de door hen geleverde producten en diensten;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel76
  - number: 7:6.2.d
    text: het verzorgen van managementrapportages gericht op de in- en externe bedrijfsvoering;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel76
  - number: 7:6.2.e
    text: het voeren van het contract- en leveranciersmanagement;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel76
  - number: 7:6.2.f
    text: het plannen, beheren, ondersteunen en bewaken van ITIL-werkprocessen;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel76
  - number: 7:6.2.g
    text: |-
      het onderhouden van relaties met het accountmanagement van de stafafdeling Strategie, Innovatie en
      Accountmanagement over gewenste en geleverde producten en (ondersteunende) diensten;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel76
  - number: 7:6.2.h
    text: het verzorgen van de secretariële ondersteuning en managementondersteuning voor de directie.
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel76
  - number: 8:1
    text: 'De directie Communicatie en Informatie bestaat uit de volgende onderdelen:'
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel81
  - number: 8:1.a
    text: het directiesecretariaat (DS);
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel81
  - number: 8:1.b
    text: de afdeling Communicatieadvies (CA);
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel81
  - number: 8:1.c
    text: de afdeling Publicatie Tekst en Web (PTW);
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel81
  - number: 8:1.d
    text: de afdeling Informatie- en Kennisdiensten (IKD);
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel81
  - number: 8:1.e
    text: de afdeling Documentdiensten (DD);
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel81
  - number: 8:1.f
    text: de afdeling Beleid en Innovatie (B&I);
