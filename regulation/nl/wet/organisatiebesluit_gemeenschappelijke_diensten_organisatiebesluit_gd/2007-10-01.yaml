    text: het zorg dragen voor het via het BZK-intranet kunnen benaderen van RYX;
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel84
  - number: 8:4.2.o
    text: het zorg dragen voor het kunnen benaderen van databanken via Intranet en/of RYX.
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel84
  - number: 8:5.1
    text: De afdeling Informatie- en Kennisdiensten staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0017985/2007-10-01#Artikel85
