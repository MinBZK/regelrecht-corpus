  - number: '3'
    text: |-
      De Minister verleent mandaat aan het hoofd van de Immigratie- en Naturalisatiedienst tot het vaststellen
      en bekendmaken van beleidsregels in het Voorschrift Vreemdelingen 2000, de Vreemdelingencirculaire
      2000 en in uitvoeringsinstructies voor de uitvoering van de [Vreemdelingenwet 2000][ref1] en de
      [Rijkswet op het Nederlanderschap][ref2]. Van deze bevoegdheid verleent het hoofd van de Immigratie- en
      Naturalisatiedienst geen ondermandaat dan aan een lid van zijn Hoofddirectie.


      [ref1]: https://wetten.overheid.nl/BWBR0011823
      [ref2]: https://wetten.overheid.nl/BWBR0003738
    url: https://wetten.overheid.nl/BWBR0013918/2002-07-27#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0011823
      - id: ref2
        bwb_id: BWBR0003738
  - number: '4'
    text: |-
      De Minister verleent geen mandaat tot het nemen van een besluit in een individueel geval dat contrair is aan het
      door de Adviescommissie voor vreemdelingenzaken met het oog op dat besluit uitgebrachte advies.
    url: https://wetten.overheid.nl/BWBR0013918/2002-07-27#Artikel4
  - number: '5'
    text: |-
      Het hoofd van de Immigratie- en Naturalisatiedienst is bevoegd met inachtneming van het bepaalde in dit besluit
      ondermandaat te verlenen van de onder [artikel 2][ref1] genoemde bevoegdheden aan de functionarissen werkzaam bij
      de Immigratie- en Naturalisatiedienst.


      [ref1]: https://wetten.overheid.nl/BWBR0013918#Artikel2
    url: https://wetten.overheid.nl/BWBR0013918/2002-07-27#Artikel5
