        artikel: '2'
  - number: '6'
    text: |-
      De Algemene machtigingsregeling IND (Stcrt. 1997, 247) en de Algemene machtigingsregeling IND 2001 (Stcrt. 2001,
      64) worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0013918/2002-07-27#Artikel6
  - number: '7'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst en werkt terug tot en met 22 juli 2002.
    url: https://wetten.overheid.nl/BWBR0013918/2002-07-27#Artikel7
