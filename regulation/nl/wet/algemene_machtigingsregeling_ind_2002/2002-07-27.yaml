  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:



            a

              *Immigratie- en Naturalisatiedienst:*


              de Immigratie- en Naturalisatiedienst bedoeld in [artikel 1][ref1] van het Instellingsbesluit Agentschap
      Immigratie- en Naturalisatiedienst binnen het Ministerie van Justitie;



            b

              *hoofd van de Immigratie- en Naturalisatiedienst:*


              de hoofddirecteur van het agentschap IND, aangesteld als hoofd van het dienstonderdeel Immigratie- en
      Naturalisatie van het Ministerie van Justitie;



            c

              *Minister:*


              de Minister voor Vreemdelingenzaken en Integratie.


      [ref1]: https://wetten.overheid.nl/BWBR0013918#Artikel1
    url: https://wetten.overheid.nl/BWBR0013918/2002-07-27#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0013918
        artikel: '1'
  - number: '2'
    text: |-
      1 De Minister verleent mandaat aan het hoofd van de Immigratie- en Naturalisatiedienst om namens hem
      alle beslissingen te nemen, alle stukken af te doen, alle uitgaande brieven te tekenen ten aanzien
      van alle aangelegenheden voortvloeiend uit de uitvoering van de [Vreemdelingenwet 2000][ref1] en de
      [Rijkswet op het Nederlanderschap][ref2], tenzij bij wettelijk voorschrift anders is bepaald of de aard van de
      bevoegdheid zich daartegen verzet.

      2 De Minister verleent volmacht aan het hoofd van de Immigratie- en Naturalisatiedienst om privaatrechtelijke
      rechtshandelingen te verrichten, voor zover deze handelingen verband houden met de uitvoering van de
      [Vreemdelingenwet 2000][ref3] of de [Rijkswet op het Nederlanderschap][ref4], tenzij bij wettelijk voorschrift
      anders is bepaald of de aard van de bevoegdheid zich daartegen verzet.

      3 De Minister machtigt het hoofd van de Immigratie- en Naturalisatiedienst om alle overige handelingen te
      verrichten, die noch een besluit, noch een privaatrechtelijke rechtshandeling zijn, en hem in rechte te
      vertegenwoordigen en rechtsmiddelen in te stellen, voor zover deze handelingen verband houden met de uitvoering
      van het bepaalde bij en krachtens de [Vreemdelingenwet 2000][ref5] of de [Rijkswet op het Nederlanderschap][ref6],
      tenzij bij wettelijk voorschrift anders is bepaald of de aard van de bevoegdheid zich daartegen verzet.

      4 De Minister machtigt het hoofd van de Immigratie- en Naturalisatiedienst om

      a. de korpschef en de bevelhebber van de Koninklijke marechaussee inlichtingen te vragen over de uitvoering
      van de Vreemdelingenwet 2000, het Vreemdelingenbesluit 2000, het Voorschrift Vreemdelingen 2000 en de
      Vreemdelingencirculaire 2000;

      b. aan de korpschef en de bevelhebber van de Koninklijke marechaussee aanwijzingen te geven over de uitvoering
      van de Vreemdelingenwet 2000, het Vreemdelingenbesluit 2000, het Voorschrift Vreemdelingen 2000 en de
      Vreemdelingencirculaire 2000 en aan de ambtenaren bedoeld in [artikel 47, eerste lid, Vreemdelingenwet 2000][ref7]
      individuele aanwijzingen te geven.


