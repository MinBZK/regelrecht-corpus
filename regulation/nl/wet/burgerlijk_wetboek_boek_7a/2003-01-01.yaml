        bwb_id: BWBR0006000
        artikel: 1623j
        afdeling: Vierde
      - id: ref10
        bwb_id: BWBR0006000
        artikel: 1623l
        afdeling: Vierde
      - id: ref11
        bwb_id: BWBR0006000
        artikel: 1623o
        afdeling: Vierde
      - id: ref12
        bwb_id: BWBR0006000
        artikel: 1623n
        afdeling: Vierde
