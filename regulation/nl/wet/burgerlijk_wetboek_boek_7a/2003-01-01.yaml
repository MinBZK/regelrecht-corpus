        bwb_id: BWBR0006000
        artikel: 1623b
        afdeling: Vierde
  - number: 1623a.2
    text: |-
      Onder woonruimte wordt verstaan een gebouwde onroerende zaak die als zelfstandige woning is verhuurd, of een als
      woning verhuurd gedeelte daarvan, dan wel een woonwagen of een standplaats, alsmede de onroerende aanhorigheden.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1623a
  - number: 1623a.3
    text: |-
      Onder zelfstandige woning wordt verstaan de woning welke een eigen toegang heeft en welke de bewoner kan bewonen
      zonder daarbij afhankelijk te zijn van wezenlijke voorzieningen buiten die woning.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1623a
  - number: 1623a.4
    text: |-
      Onder woonwagen wordt verstaan een voor bewoning bestemd gebouw dat is geplaatst op een standplaats en dat in zijn
      geheel of in delen kan worden verplaatst, met uitzondering van wagens die een eigen aandrijving hebben en wagens
      waarvoor voor het voortbewegen ervan over een weg geen ontheffing ingevolge de [Wegenverkeerswet 1994][ref1] van
      bij of krachtens die wet gegeven voorschriften met betrekking tot verkeersregels en verkeerstekens is vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0006622
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1623a
    references:
      - id: ref1
        bwb_id: BWBR0006622
  - number: 1623a.5
    text: |-
      Onder standplaats wordt verstaan een kavel, bestemd voor het plaatsen van een woonwagen, waarop voorzieningen
      aanwezig zijn die op het leidingnet van de openbare nutsbedrijven, andere instellingen of van gemeenten kunnen
      worden aangesloten.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1623a
  - number: 1623a.6
    text: |-
      Onder huurprijs wordt in deze afdeling verstaan het begrip huurprijs bedoeld in
      [artikel 1, onder e, van de Huurprijzenwet woonruimte][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003221#Artikel1
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1623a
    references:
      - id: ref1
        bwb_id: BWBR0003221
        artikel: '1'
  - number: 1623a.7
    text: |-
      Op de overeenkomst van huur en verhuur van woonruimte is [artikel 1612][ref1] niet van toepassing, voor zover het
      de verhuurder toestaat te bedingen dat de huur wordt verbroken door verkoop van het verhuurde.


      [ref1]: https://wetten.overheid.nl/BWBR0006000#Artikel1612
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1623a
    references:
      - id: ref1
        bwb_id: BWBR0006000
        artikel: '1612'
        afdeling: Tweede
  - number: 1623b.1
    text: |-
      Een overeenkomst, welke is aangegaan voor onbepaalde tijd, moet worden opgezegd tegen een voor de betaling van de
      huurprijs geldende dag.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1623b
  - number: 1623b.2
    text: |-
      In afwijking van [artikel 1606][ref1] houdt de bij geschrifte aangegane huurovereenkomst van woonruimte niet van
      rechtswege op, wanneer de bepaalde tijd verstreken is, doch moet zij worden opgezegd. Een voor bepaalde tijd,
      hetzij bij geschrift, hetzij zonder geschrift aangegane overeenkomst moet worden opgezegd tegen een voor de
      betaling van de huurprijs geldende dag, doch niet vallend voor het verstrijken van de bepaalde tijd.


      [ref1]: https://wetten.overheid.nl/BWBR0006000#Artikel1606
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1623b
    references:
      - id: ref1
        bwb_id: BWBR0006000
        artikel: '1606'
        afdeling: Tweede
  - number: 1623b.3
    text: |-
      De opzegging moet geschieden bij deurwaardersexploit of bij aangetekende brief. Is ingevolge het bepaalde in
      [artikel 1623][ref1], de echtgenoot van de huurder medehuurder, dan moet de opzegging aan beide echtgenoten
      afzonderlijk worden gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0006000#Artikel1623g
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1623b
    references:
      - id: ref1
        bwb_id: BWBR0006000
        artikel: 1623g
        afdeling: Vierde
  - number: 1623b.4
    text: |-
      De opzegging door de verhuurder moet op straffe van nietigheid de gronden vermelden die tot de opzegging hebben
      geleid. Een opzegging door de verhuurder op andere dan de in [artikel 1623][ref1], genoemde gronden is nietig. De
      huurder moet bij de opzegging worden gevraagd binnen zes weken schriftelijk aan de verhuurder mede te delen of hij
      al dan niet toestemt in de beëindiging van de overeenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0006000#Artikel1623e
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1623b
    references:
      - id: ref1
        bwb_id: BWBR0006000
        artikel: 1623e
        afdeling: Vierde
  - number: 1623b.5
    text: |-
      Bij de opzegging moeten, in afwijking in zoverre van de [artikelen 1607][ref1], [1609][ref2] en [1623][ref3], de
      hierna omschreven termijnen in acht worden genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0006000#Artikel1607
      [ref2]: https://wetten.overheid.nl/BWBR0006000#Artikel1609
      [ref3]: https://wetten.overheid.nl/BWBR0006000#Artikel1623
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1623b
    references:
      - id: ref1
        bwb_id: BWBR0006000
        artikel: '1607'
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0006000
        artikel: '1609'
        afdeling: Tweede
      - id: ref3
        bwb_id: BWBR0006000
        artikel: '1623'
        afdeling: Derde
  - number: 1623b.6
    text: |-
      Bij opzegging door de huurder is de termijn gelijk aan de tijd, welke tussen twee opvolgende voor betaling van de
      huurprijs overeengekomen dagen verstrijkt, doch niet korter dan een maand en niet langer dan drie maanden.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1623b
  - number: 1623b.7
    text: |-
      Bij opzegging door de verhuurder is de termijn niet korter dan drie maanden; voor elk jaar dat de huurder krachtens
      overeenkomst ononderbroken in het genot van het gehuurde is geweest wordt deze termijn van rechtswege met een maand
      verlengd, tot ten hoogste zes maanden.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1623b
  - number: 1623b.8
    text: |-
      Een opzegging, die in strijd met het eerste, tweede of zesde lid is gedaan en een opzegging die op kortere termijn
      is gedaan dan is voorgeschreven in het zevende lid, gelden niettemin als waren zij gedaan tegen de voorgeschreven
      dag en met inachtneming van de voorgeschreven termijn.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1623b
  - number: 1623b.9
    text: |-
      Elk beding, waarbij in strijd met het zesde lid een langere opzeggingstermijn of waarbij in strijd met het zevende
      lid een kortere opzeggingstermijn wordt overeengekomen of waarbij van andere bepalingen van dit artikel wordt
      afgeweken, is nietig.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1623b
  - number: 1623b.10
    text: |-
      De bepalingen van dit artikel gelden niet indien de beëindiging geschiedt met wederzijds goedvinden nadat de huur
      is ingegaan.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1623b
  - number: 1623c.1
    text: |-
      Een opgezegde huurovereenkomst blijft, tenzij de huurder de overeenkomst heeft opgezegd of na de opzegging door de
      verhuurder schriftelijk in de beëindiging ervan heeft toegestemd, na de datum waartegen rechtsgeldig is opgezegd
      van rechtswege van kracht, totdat de rechter onherroepelijk heeft beslist op een vordering van de verhuurder, als
      in het volgende lid bedoeld.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1623c
  - number: 1623c.2
    text: |-
      De verhuurder kan, indien hij zes weken na de opzegging geen schriftelijke mededeling van de huurder dat hij in de
      beëindiging van de huurovereenkomst toestemt, heeft ontvangen, op de gronden vermeld in de opzegging vorderen dat
      de kantonrechter het tijdstip zal vaststellen waarop de huurovereenkomst zal eindigen.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1623c
  - number: 1623c.3
    text: |-
      De verhuurder legt aan de kantonrechter een verklaring van de huurcommissie bedoeld in
      [artikel 2 van de Wet op de huurcommissies][ref1] over, inhoudende hetzij de vaststelling dat de huurder de
      woonruimte niet heeft onderverhuurd, hetzij de namen en woonplaatsen van de onderhuurders, zomede alle verdere
      gegevens betreffende de onderhuurders, welke naar het oordeel van de commissie ter kennis van de rechter behoren te
      worden gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0003222#Artikel2
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1623c
    references:
      - id: ref1
        bwb_id: BWBR0003222
        artikel: '2'
  - number: 1623c.4
    text: |-
      De verhuurder is in zijn vordering niet ontvankelijk indien hij niet de in het vorige lid bedoelde verklaring
      overlegt. De rechter spreekt de niet-ontvankelijkheid niet uit dan nadat hij de verhuurder in de gelegenheid heeft
      gesteld het gepleegde verzuim binnen een door hem te bepalen termijn te herstellen.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1623c
  - number: 1623c.5
    text: Elk met de bepalingen van dit artikel strijdig beding is nietig.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1623c
  - number: 1623d.1
    text: |-
      Bij zijn beslissing op de vordering bedoeld in [artikel 1623][ref1], neemt de rechter uitsluitend de in de
      opzegging vermelde gronden in aanmerking.


      [ref1]: https://wetten.overheid.nl/BWBR0006000#Artikel1623c
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1623d
    references:
      - id: ref1
        bwb_id: BWBR0006000
        artikel: 1623c
        afdeling: Vierde
  - number: 1623d.2
    text: |-
      Indien de rechter de vordering afwijst, wordt de overeenkomst van rechtswege verlengd. De rechter beslist of de
      overeenkomst voor onbepaalde of voor bepaalde tijd wordt voortgezet.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1623d
  - number: 1623d.3
    text: Indien de rechter de vordering toewijst, stelt hij tevens het tijdstip van de ontruiming vast.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1623d
  - number: 1623d.4
    text: Het vonnis levert een voor tenuitvoerlegging vatbare titel op.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1623d
  - number: 1623e.1
    text: 'De rechter kan de vordering slechts toewijzen:'
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1623e
  - number: 1623e.1.1°
    text: indien de huurder zich niet heeft gedragen zoals een goed huurder betaamt;
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1623e
  - number: 1623e.1.2°
    text: |-
      indien een verhuurder als bedoeld in het tweede lid een overeenkomst voor bepaalde tijd heeft aangegaan en hij
      uitdrukkelijk heeft bedongen, dat het gehuurde na de afloop van die termijn moet worden ontruimd, tenzij blijkt dat
      de verhuurder geen belang meer heeft bij de ontruiming;
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1623e
  - number: 1623e.1.3°
    text: |-
      indien de verhuurder aannemelijk maakt dat hij het verhuurde zo dringend nodig heeft voor eigen gebruik -
      vervreemding van de zaak niet daaronder begrepen - dat van hem, de belangen en behoeften van beide partijen en
      van onderhuurders naar billijkheid in aanmerking genomen, niet kan worden gevergd dat de huurovereenkomst wordt
      verlengd en mits blijkt, dat de huurder andere passende woonruimte kan verkrijgen;
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1623e
  - number: 1623e.1.4°
    text: |-
      indien de huurder niet toestemt in een redelijk aanbod tot het aangaan van een nieuwe huurovereenkomst met
      betrekking tot dezelfde woonruimte, voor zover, in het geval dat de [Huurprijzenwet woonruimte][ref1] op de
      opgezegde huurovereenkomst van toepassing is, dit aanbod niet een wijziging inhoudt van de huurprijs of van de
      kosten, bedoeld in [artikel 12, eerste lid, van genoemde wet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0003221
      [ref2]: https://wetten.overheid.nl/BWBR0003221#Artikel12
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1623e
    references:
      - id: ref1
        bwb_id: BWBR0003221
      - id: ref2
        bwb_id: BWBR0003221
        artikel: '12'
  - number: 1623e.1.5°
    text: |-
      indien de verhuurder een krachtens een geldend bestemmingsplan op het verhuurde liggende bestemming wil
      verwezenlijken;
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1623e
  - number: 1623e.1.6°
    text: |-
      indien de verhuurder, in geval van een huurovereenkomst als bedoeld in [artikel 1623][ref1], die niet binnen het
      in die zin genoemde tijdvak is opgezegd, aannemelijk maakt dat zijn belangen bij beëindiging van de overeenkomst
      zwaarder wegen dan de belangen van de huurder bij voortzetting daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0006000#Artikel1623a
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1623e
    references:
      - id: ref1
        bwb_id: BWBR0006000
        artikel: 1623a
        afdeling: Vierde
  - number: 1623e.2
    text: |-
      In het geval bedoeld in het vorige lid onder 2° kan het daarbedoelde beding slechts worden gemaakt door de
      verhuurder die de woonruimte niet zelf heeft bewoond, noch deze eerder heeft verhuurd en die na de afloop van de
      termijn waarvoor de huurovereenkomst wordt aangegaan de woonruimte zal betrekken, door de verhuurder die zelf de
      vorige bewoner van de woonruimte is en die na de afloop van de termijn waarvoor de huurovereenkomst wordt aangegaan
      de woonruimte weer zal betrekken of door de verhuurder, jegens wie de vorige huurder het recht heeft verkregen na
      de afloop van de termijn waarvoor de huurovereenkomst wordt aangegaan de woonruimte weer te betrekken.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1623e
  - number: 1623e.3
    text: |-
      De rechter houdt bij de beoordeling van de vraag of andere woonruimte voor de huurder passend is, geen rekening met
      de bijdragen uit ’s Rijks kas welke een huurder ter tegemoetkoming in de kosten, verbonden aan het genot van een
      woning, kan verkrijgen.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1623e
  - number: 1623e.4
    text: |-
      Voor de toewijzing van de vordering op de grond, vermeld in het eerste lid, onder 3e, is, indien ten aanzien van
      de woonruimte [hoofdstuk II van de Huisvestingswet][ref1] van toepassing is, voorts vereist dat de verhuurder een
      huisvestingsvergunning als bedoeld in [artikel 7, eerste lid, van die wet][ref2] overlegt.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0005674#Artikel7
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1623e
    references:
      - id: ref1
        bwb_id: BWBR0005674
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0005674
        artikel: '7'
  - number: 1623e.5
    text: |-
      Een opzegging door de verhuurder, die rechtsopvolger van een vorige verhuurder is, op de grond dat hij zelf
      het verhuurde in gebruik wil nemen, is nietig, indien deze geschiedt binnen drie jaar nadat de rechtsopvolging
      schriftelijk ter kennis van de huurder is gebracht.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1623e
  - number: 1623e.6
    text: |-
      De rechter kan in zijn beslissing tot toewijzing van de vordering tot beëindiging van de huurovereenkomst als
      bedoeld in het eerste lid, onder 3° en 5°, een bedrag vaststellen dat de verhuurder aan de huurder moet betalen ter
      tegemoetkoming in diens verhuis- en inrichtingskosten. Alvorens een beslissing te geven waarin een bedrag als in
      de vorige zin bedoeld wordt vastgesteld, brengt de rechter zijn voornemen ter kennis van partijen en stelt hij een
      termijn binnen welke de verhuurder de bevoegdheid heeft de opzegging in te trekken. Indien de verhuurder van die
      bevoegdheid gebruik maakt, zal de rechter alleen een beslissing geven omtrent de proceskosten.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1623e
  - number: 1623e.7
    text: |-
      Indien de verhuurder de overeenkomst heeft opgezegd op de grond dat hij zelf het verhuurde duurzaam in gebruik wil
      nemen en de vordering tot beëindiging van de huurovereenkomst is toegewezen, dan wel de huurder in de beëindiging
      van de overeenkomst heeft toegestemd, is de verhuurder jegens de huurder tot schadevergoeding gehouden, indien de
      wil om het verhuurde duurzaam in gebruik te nemen in werkelijkheid niet aanwezig is geweest. [Artikel 1628][ref1]
      is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006000#Artikel1628a
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1623e
    references:
      - id: ref1
        bwb_id: BWBR0006000
        artikel: 1628a
        afdeling: Vijfde
  - number: 1623e.8
    text: |-
      In de gevallen, bedoeld in het eerste lid, onder 1° en 4°, kan de rechter, alvorens de vordering toe te wijzen de
      huurder een termijn van ten hoogste een maand toestaan om alsnog aan zijn verplichtingen te voldoen of het aanbod
      te aanvaarden.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1623e
  - number: 1623f.1
    text: |-
      Indien de rechter de huurovereenkomst verlengd heeft, kan de verhuurder nadat hij de overeenkomst
      heeft opgezegd overeenkomstig [artikel 1623b][ref1], wederom vorderen dat de rechter het tijdstip zal
      vaststellen waarop de overeenkomst zal eindigen. Indien de overeenkomst krachtens een beslissing bedoeld in
      [artikel 1623d, tweede lid][ref2], voor onbepaalde tijd van kracht blijft, kan de verhuurder de overeenkomst op
      grond van dezelfde feiten niet opnieuw binnen drie jaren, nadat de beslissing onherroepelijk is geworden, opzeggen.
      Als de overeenkomst verlengd is voor bepaalde tijd, kan deze vordering telkens na het tijdstip dat drie maanden
      voor het eind van de termijn van verlenging ligt, worden ingesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0006000#Artikel1623b
      [ref2]: https://wetten.overheid.nl/BWBR0006000#Artikel1623d
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1623f
    references:
      - id: ref1
        bwb_id: BWBR0006000
        artikel: 1623b
        afdeling: Vierde
      - id: ref2
        bwb_id: BWBR0006000
        artikel: 1623d
        afdeling: Vierde
  - number: 1623f.2
    text: |-
      De [artikelen 1623c][ref1], [1623d][ref2] en [1623e][ref3] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006000#Artikel1623c
      [ref2]: https://wetten.overheid.nl/BWBR0006000#Artikel1623d
      [ref3]: https://wetten.overheid.nl/BWBR0006000#Artikel1623e
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1623f
    references:
      - id: ref1
        bwb_id: BWBR0006000
        artikel: 1623c
        afdeling: Vierde
      - id: ref2
        bwb_id: BWBR0006000
        artikel: 1623d
        afdeling: Vierde
      - id: ref3
        bwb_id: BWBR0006000
        artikel: 1623e
        afdeling: Vierde
  - number: 1623g.1
    text: |-
      De echtgenoot van een huurder is van rechtswege medehuurder, zolang de woonruimte de echtgenoot tot hoofdverblijf
      strekt, ongeacht of de huurovereenkomst vóór dan wel na het aangaan van het huwelijk is gesloten.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1623g
  - number: 1623g.2
    text: |-
      Voor de verplichtingen uit de huurovereenkomst, behalve voor zover deze reeds opeisbaar waren voordat de echtgenoot
      medehuurder werd, zijn de huurder en de medehuurder jegens de verhuurder hoofdelijk aansprakelijk.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1623g
  - number: 1623g.3
    text: Indien de huurovereenkomst ten aanzien van de huurder eindigt, wordt de medehuurder huurder.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1623g
  - number: 1623g.4
    text: |-
      Indien de in het eerste lid bedoelde echtgenoot, hetzij ingevolge een beschikking als bedoeld in de
      [artikel 826, eerste lid, onderdeel ][ref1], hetzij ingevolge onderlinge overeenstemming in verband met een verzoek
      tot echtscheiding of scheiding van tafel en bed, niet het gebruik heeft van de echtelijke woning, brengt dit voor
      de toepassing van dit artikel geen verandering in het hoofdverblijf.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel826
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1623g
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '826'
  - number: 1623g.5
    text: |-
      In geval van echtscheiding of scheiding van tafel en bed kan de rechter op verzoek van een echtgenoot bepalen wie
      van de echtgenoten huurder van de woonruimte zal zijn.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1623g
  - number: 1623g.6
    text: Met een echtgenoot wordt een geregistreerde partner gelijk gesteld.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1623g
  - number: 1623h.1
    text: |-
      Indien op het gezamenlijke verzoek van de huurder van woonruimte en van een andere persoon die in de woonruimte
      zijn hoofdverblijf heeft en met de huurder een duurzame gemeenschappelijke huishouding heeft, alsmede van een
      medehuurder wanneer die er is, de verhuurder niet binnen drie maanden schriftelijk heeft verklaard er mede in
      te stemmen dat die andere persoon medehuurder zal zijn, kunnen de huurder en die andere persoon, alsmede een
      medehuurder wanneer die er is, gezamenlijk vorderen dat de kantonrechter zal bepalen dat deze persoon met ingang
      van een in het vonnis te bepalen tijdstip medehuurder zal zijn.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1623h
  - number: 1623h.2
    text: |-
      Nadat een verzoek aan de verhuurder als bedoeld in het vorige lid is gedaan, kan een vordering tot ontbinding
      van de huurovereenkomst op de grond dat de huurder in strijd met hetgeen overeengekomen is, met een ander in de
      woonruimte een gemeenschappelijke huishouding heeft, niet meer worden toegewezen. Deze omstandigheid levert alsdan
      evenmin een grond voor opzegging van de huurovereenkomst op.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1623h
  - number: 1623h.3
    text: 'De kantonrechter wijst de vordering bedoeld in het eerste lid slechts af:'
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1623h
  - number: 1623h.3.a
    text: |-
      indien de persoon bedoeld in het eerste lid niet gedurende tenminste twee jaren in de woonruimte zijn hoofdverblijf
      heeft en met de huurder een duurzame gemeenschappelijke huishouding heeft;
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1623h
  - number: 1623h.3.b
    text: |-
      indien, mede gelet op hetgeen is komen vast te staan omtrent de gemeenschappelijke huishouding en de tijdsduur
      daarvan, de vordering kennelijk slechts de strekking heeft de persoon bedoeld in het eerste lid op korte termijn de
      positie van huurder te verschaffen;
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1623h
  - number: 1623h.3.c
    text: |-
      indien de persoon bedoeld in het eerste lid vanuit financieel oogpunt onvoldoende waarborg biedt voor een
      behoorlijke nakoming van de huurovereenkomst.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1623h
  - number: 1623h.4
    text: |-
      Voor de verplichtingen uit de huurovereenkomst zijn de persoon die de huurovereenkomst heeft aangegaan en ieder van
      de personen die op grond van dit artikel medehuurder of huurder is, hoofdelijk jegens de verhuurder aansprakelijk,
      met dien verstande dat een medehuurder niet aansprakelijk is voor verplichtingen die reeds opeisbaar waren voordat
      hij medehuurder werd.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1623h
  - number: 1623h.5
    text: |-
      De bepalingen omtrent het eindigen van de huurovereenkomst zijn op de personen bedoeld in het vorige lid
      afzonderlijk van toepassing, met dien verstande dat een persoon de hoedanigheid van medehuurder in ieder geval
      verliest, indien hij zijn hoofdverblijf niet langer in de woonruimte heeft. Indien de huurovereenkomst ten aanzien
      van de huurder eindigt, wordt de medehuurder huurder.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1623h
  - number: 1623h.6
    text: |-
      Is ten aanzien van de woonruimte [hoofdstuk II van de Huisvestingswet][ref1] van toepassing, dan zet de medehuurder
      in afwijking van het vorige lid de huurovereenkomst slechts voort, indien de kantonrechter dit heeft bepaald
      op een daartoe door die persoon binnen twee maanden na het tijdstip waarop hij huurder is geworden, ingestelde
      vordering en in elk geval zolang op deze vordering nog niet onherroepelijk is beslist. De kantonrechter wijst
      de vordering slechts af, indien de eiser niet een voor hem geldende huisvestingsvergunning als bedoeld in
      [artikel 7, eerste lid, van die wet][ref2] overlegt.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0005674#Artikel7
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1623h
    references:
      - id: ref1
        bwb_id: BWBR0005674
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0005674
        artikel: '7'
  - number: 1623h.7
    text: |-
      Ieder van de personen bedoeld in het vierde lid kan vorderen dat de kantonrechter zal bepalen dat een of meer
      van deze personen de huurovereenkomst met ingang van een in het vonnis te bepalen tijdstip niet langer zullen
      voortzetten. De kantonrechter wijst de vordering slechts toe, indien dit naar billijkheid, met inachtneming van de
      omstandigheden van het geval, geboden is, met dien verstande dat hij de vordering in ieder geval toewijst, indien
      de eiser aantoont dat de persoon waarop de vordering betrekking heeft, zijn positie van medehuurder heeft verkregen
      op grond van een niet mede door de eiser aan de verhuurder gedaan verzoek of van een door hem ingestelde vordering
      als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1623h
  - number: 1623i.1
    text: |-
      Bij het overlijden van de huurder van woonruimte zet de medehuurder de huurovereenkomst als huurder voort. Hij kan
      de huurovereenkomst binnen zes maanden na het overlijden bij deurwaardersexploit of aangetekende brief opzeggen met
      ingang van de eerste dag van de tweede maand na de opzegging.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1623i
  - number: 1623i.2
    text: |-
      De persoon die niet op grond van het vorige lid huurder wordt, doch wel in de woonruimte zijn hoofdverblijf heeft
      en met de overleden huurder een duurzame gemeenschappelijke huishouding heeft gehad, zet de huurovereenkomst voort
      gedurende zes maanden na het overlijden van de huurder; de tweede zin van het vorige lid is van toepassing. Hij zet
      de overeenkomst ook nadien voort, indien de kantonrechter dit heeft bepaald op een daartoe strekkende binnen die
      termijn ingestelde vordering, en in elk geval zolang op deze vordering nog niet onherroepelijk is beslist.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1623i
  - number: 1623i.3
    text: 'De kantonrechter wijst de vordering bedoeld in het vorige lid in ieder geval af:'
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1623i
  - number: 1623i.3.a
    text: indien de eiser niet aannemelijk heeft gemaakt dat hij aan de vereisten van het vorige lid voldoet;
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1623i
  - number: 1623i.3.b
    text: |-
      indien de eiser vanuit financieel oogpunt onvoldoende waarborg biedt voor een behoorlijke nakoming van de
      huurovereenkomst;
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1623i
  - number: 1623i.3.c
    text: |-
      indien het woonruimte betreft waarop [hoofdstuk II van de Huisvestingswet][ref1] van toepassing is, indien de eiser
      niet een huisvestingsvergunning als bedoeld in [artikel 7, eerste lid, van die wet][ref2] overlegt.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0005674#Artikel7
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1623i
    references:
      - id: ref1
        bwb_id: BWBR0005674
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0005674
        artikel: '7'
  - number: 1623i.4
    text: |-
      Het [vierde lid, de eerste zin van het vijfde lid en het zevende lid van artikel 1623][ref1] zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006000#Artikel1623
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1623i
    references:
      - id: ref1
        bwb_id: BWBR0006000
        artikel: '1623'
        afdeling: Derde
  - number: 1623i.5
    text: |-
      Komt vast te staan, dat een persoon ten onrechte een beroep op voortzetting van de huurovereenkomst krachtens
      dit artikel heeft gedaan, dan blijft hij over de tijd gedurende welke hij het genot van de woonruimte heeft gehad
      jegens de verhuurder aansprakelijk voor de nakoming van de huurovereenkomst die voor hem zou hebben bestaan als
      hij huurder was geweest. Heeft meer dan één persoon ten onrechte een beroep op voortzetting van de huurovereenkomst
      gedaan, dan is ieder van hen jegens de verhuurder hoofdelijk aansprakelijk.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1623i
  - number: 1623i.6
    text: |-
      Zijn er geen personen die krachtens dit artikel de huurovereenkomst voortzetten, dan eindigt deze aan het eind van
      de tweede maand na het overlijden van de huurder. De erfgenamen zijn bevoegd de huurovereenkomst tegen het eind van
      de eerste maand na het overlijden van de huurder te doen eindigen. Wanneer de nalatenschap van de huurder ingevolge
      [artikel 13 van Boek 4][ref1] wordt verdeeld, komt de bevoegdheid van de erfgenamen, bedoeld in de vorige zin, toe
      aan zijn echtgenoot of geregistreerde partner.


      [ref1]: https://wetten.overheid.nl/BWBR0002761#Artikel13
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1623i
    references:
      - id: ref1
        bwb_id: BWBR0002761
        artikel: '13'
  - number: 1623i.7
    text: |-
      Van dit artikel kan niet ten nadele van de personen aan wie dit artikel recht op voortzetting van de
      huurovereenkomst toekent en van de erfgenamen, onderscheidenlijk de echtgenoot of geregistreerde partner, bedoeld
      in het zesde lid, worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1623i
  - number: 1623i.8
    text: |-
      Van [artikel 1611][ref1] kan niet bij overeenkomst worden afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0006000#Artikel1611
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1623i
    references:
      - id: ref1
        bwb_id: BWBR0006000
        artikel: '1611'
        afdeling: Tweede
  - number: 1623j
    text: |-
      Indien de rechter ingevolge [artikel 299 van Boek 3][ref1] de huurder machtigt bepaalde onderhoudswerken of
      reparatiën ten koste van de verhuurder uit te voeren, kan hij tevens, ongeacht enig andersluidend beding, bepalen
      of en tot welk bedrag de huurder de gemaakte kosten met de huurprijs kan verrekenen.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel299
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1623j
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '299'
  - number: 1623k.1
    text: |-
      De onderhuurovereenkomst die betrekking heeft op een zelfstandige woning waar de onderhuurder zijn hoofdverblijf
      heeft, wordt in geval van beëindiging van de huurovereenkomst tussen huurder en verhuurder voortgezet door de
      verhuurder.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1623k
  - number: 1623k.2
    text: |-
      De verhuurder kan binnen een half jaar nadat hij op grond van het eerste lid de onderhuurovereenkomst heeft
      voortgezet vorderen dat de kantonrechter zal bepalen dat de overeenkomst met ingang van een in het vonnis te
      bepalen tijdstip zal eindigen op de grond dat:
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1623k
  - number: 1623k.2.a
    text: |-
      de wederpartij vanuit financieel oogpunt onvoldoende waarborg biedt voor een behoorlijke nakoming van de
      overeenkomst;
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1623k
  - number: 1623k.2.b
    text: |-
      de onderhuurovereenkomst is aangegaan met de kennelijke strekking de onderhuurder de positie van huurder te
      verschaffen;
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1623k
  - number: 1623k.2.c
    text: |-
      in de gegeven omstandigheden naar maatstaven van redelijkheid en billijkheid, mede gelet op de inhoud van
      huurovereenkomsten die betrekking hebben op soortgelijke woonruimte alsmede op de inhoud van de geëindigde
      overeenkomst tussen hem en de huurder, niet van hem kan worden gevergd dat hij de overeenkomst met de wederpartij
      voortzet.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1623k
  - number: 1623k.3
    text: |-
      Ingeval van onderverhuur van woonruimte, welke al dan niet een zelfstandige woning vormt, zet degene die op grond
      van de [artikelen 1623g][ref1], [1623h][ref2] of [1623i][ref3] huurder is geworden of de huurovereenkomst heeft
      voortgezet, als onderverhuurder de overeenkomst met de onderhuurder voort.


      [ref1]: https://wetten.overheid.nl/BWBR0006000#Artikel1623g
      [ref2]: https://wetten.overheid.nl/BWBR0006000#Artikel1623h
      [ref3]: https://wetten.overheid.nl/BWBR0006000#Artikel1623i
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1623k
    references:
      - id: ref1
        bwb_id: BWBR0006000
        artikel: 1623g
        afdeling: Vierde
      - id: ref2
        bwb_id: BWBR0006000
        artikel: 1623h
        afdeling: Vierde
      - id: ref3
        bwb_id: BWBR0006000
        artikel: 1623i
        afdeling: Vierde
  - number: 1623l.1
    text: |-
      De huurder van woonruimte die een ruil van woonruimte wenst te bewerkstelligen, kan vorderen dat de kantonrechter,
      ongeacht enig andersluidend beding, hem zal machtigen om een ander in zijn plaats als huurder te stellen. Indien op
      de woonruimte [hoofdstuk II van de Huisvestingswet][ref1] van toepassing is, moet de eiser een ten behoeve van de
      voorgestelde huurder afgegeven huisvestingsvergunning als bedoeld in [artikel 7, eerste lid, van die wet][ref2] met
      betrekking tot die woonruimte overleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0005674#Artikel7
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1623l
    references:
      - id: ref1
        bwb_id: BWBR0005674
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0005674
        artikel: '7'
  - number: 1623l.2
    text: |-
      De rechter beslist met inachtneming van de omstandigheden van het geval, met dien verstande dat hij de vordering
      slechts kan toewijzen, indien de huurder een zwaarwichtig belang bij de ruil van woonruimte heeft en dat hij deze
      steeds afwijst, indien de voorgestelde huurder vanuit financieel oogpunt niet voldoende waarborg biedt voor een
      behoorlijke nakoming van de huurovereenkomst. De rechter kan aan de machtiging voorwaarden verbinden of daarbij een
      last opleggen.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1623l
  - number: 1623n.1
    text: |-
      Ontbinding van de huurovereenkomst op de grond dat de huurder zijn verplichtingen niet nakomt, kan slechts door de
      rechter geschieden.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1623n
  - number: 1623n.2
    text: |-
      Alvorens de ontbinding van de huurovereenkomst uit te spreken, kan de rechter de huurder een termijn van ten
      hoogste een maand toestaan om alsnog aan zijn verplichtingen te voldoen.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1623n
  - number: 1623n.3
    text: |-
      Indien de huurovereenkomst overigens krachtens een bepaling in de overeenkomst zonder opzegging zou eindigen, moet
      zij niettemin worden opgezegd. De [artikelen 1623][ref1] vinden alsdan toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006000#Artikel1623b
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1623n
    references:
      - id: ref1
        bwb_id: BWBR0006000
        artikel: 1623b
        afdeling: Vierde
  - number: 1623n.4
    text: Elk met dit artikel strijdig beding is nietig.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1623n
  - number: 1623o.1
    text: |-
      Indien iemand door eigendomsovergang verhuurder van woonruimte in de zin van [artikel 1623][ref1] is geworden en
      een krachtens een geldend bestemmingsplan op het verhuurde liggende bestemming wil verwezenlijken, ontbindt de
      rechter op vordering van de verhuurder de huurovereenkomst met ingang van een door hem te bepalen datum.


      [ref1]: https://wetten.overheid.nl/BWBR0006000#Artikel1623a
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1623o
    references:
      - id: ref1
        bwb_id: BWBR0006000
        artikel: 1623a
        afdeling: Vierde
  - number: 1623o.2
    text: |-
      De huurder heeft recht op schadeloosstelling. Wanneer de huurtijd nog een of meer jaren moet duren, is de
      schadeloosstelling gelijk aan de huurprijs van twee jaren. Wanneer de huurtijd minder dan een jaar moet duren,
      is de schadeloosstelling gelijk aan de huurprijs van een jaar. Bij de berekening der schade wordt niet gelet op
      veranderingen, welke kennelijk zijn tot stand gebracht om de schadeloosstelling te verhogen.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1623o
  - number: '1624.1'
    text: |-
      De bepalingen van deze afdeling zijn bij uitsluiting van toepassing op huur en verhuur van bedrijfsruimte. Indien
      een overeenkomst de kenmerken bevat van huur en verhuur van bedrijfsruimte en tevens van enige andere soort van
      overeenkomst, zullen zowel de bepalingen betreffende de huur en verhuur van bedrijfsruimte als die betreffende die
      andere soort van overeenkomst van toepassing zijn; in geval van strijd tussen deze bepalingen zullen die omtrent de
      huur en verhuur van bedrijfsruimte van toepassing zijn.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1624
  - number: '1624.2'
    text: |-
      Onder bedrijfsruimte wordt verstaan een gebouwde onroerende zaak of een gedeelte daarvan, die krachtens
      overeenkomst van huur en verhuur is bestemd voor de uitoefening van een kleinhandelsbedrijf, van een restaurant-
      of cafébedrijf, van een afhaal- en besteldienst, of van een ambachtsbedrijf, een en ander indien in de
      verhuurde ruimte een voor het publiek toegankelijk lokaal voor rechtstreekse levering van roerende zaken of
      voor dienstverlening aanwezig is, dan wel krachtens zulk een overeenkomst is bestemd voor de uitoefening van een
      hotelbedrijf. Tot de bedrijfsruimte wordt ook gerekend de bij het een en ander behorende grond en de onzelfstandige
      woning. Als bedrijfsruimte wordt voorts aangemerkt een onroerende zaak die krachtens overeenkomst van huur en
      verhuur is bestemd voor uitoefening van een kampeerbedrijf. Bij algemene maatregel van bestuur kan het begrip
      kampeerbedrijf nader worden bepaald.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1624
  - number: '1624.3'
    text: |-
      De [artikelen 1606-1610][ref1], [1614-1616][ref2] en [1623][ref3] zijn niet van toepassing. [Artikel 1612][ref4] is
      niet van toepassing voor zover het de verhuurder toestaat te bedingen dat de huur wordt verbroken door verkoop van
      het verhuurde.


      [ref1]: https://wetten.overheid.nl/BWBR0006000#Artikel1606
      [ref2]: https://wetten.overheid.nl/BWBR0006000#Artikel1614
      [ref3]: https://wetten.overheid.nl/BWBR0006000#Artikel1623
      [ref4]: https://wetten.overheid.nl/BWBR0006000#Artikel1612
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1624
    references:
      - id: ref1
        bwb_id: BWBR0006000
        artikel: '1606'
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0006000
        artikel: '1614'
        afdeling: Tweede
      - id: ref3
        bwb_id: BWBR0006000
        artikel: '1623'
        afdeling: Derde
      - id: ref4
        bwb_id: BWBR0006000
        artikel: '1612'
        afdeling: Tweede
  - number: '1625'
    text: |-
      De huurovereenkomst geldt voor vijf jaar of, als een langere bepaalde duur is overeengekomen, voor die langere
      duur.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1625
  - number: '1626.1'
    text: |-
      De huurovereenkomst welke voor vijf jaar geldt, wordt na ommekomst van deze duur van rechtswege met vijf jaar
      verlengd. De overeenkomst die voor een langere termijn dan vijf jaar is aangegaan, wordt na ommekomst van die
      termijn van rechtswege verlengd met een tweede termijn die zoveel korter is dan vijf jaar als de eerste termijn
      langer is dan vijf jaar. Op de overeenkomst die voor tien jaar of langer is aangegaan, is dit artikel niet van
      toepassing.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1626
  - number: '1626.2'
    text: |-
      De in het vorige lid bedoelde verlenging van rechtswege vindt niet plaats als de overeenkomst met inachtneming van
      het in [artikel 1627, eerste lid][ref1], bepaalde is opgezegd. Zij vindt evenwel ook na zodanige opzegging plaats,
      indien de vordering bedoeld in [artikel 1627][ref2], wordt afgewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0006000#Artikel1627
      [ref2]: https://wetten.overheid.nl/BWBR0006000#Artikel1627a
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1626
    references:
      - id: ref1
        bwb_id: BWBR0006000
        artikel: '1627'
        afdeling: Vijfde
      - id: ref2
        bwb_id: BWBR0006000
        artikel: 1627a
        afdeling: Vijfde
  - number: '1626.3'
    text: |-
      Wanneer tussen de partijen geen overeenstemming bestaat over wijziging van de huurprijs in verband met de
      verlenging, stelt de kantonrechter op vordering van de meest gerede partij de huurprijs nader vast, indien deze
      niet overeenstemt met die van vergelijkbare bedrijfsruimte ter plaatse. Bij de nadere vaststelling van de huurprijs
      let de rechter op het gemiddelde van de huurprijzen van vergelijkbare bedrijfsruimte ter plaatse welke zich hebben
      voorgedaan in een tijdvak van vijf jaren voorafgaande aan de dag van het instellen van de vordering. Iedere aldus
      in de vergelijking te betrekken huurprijs wordt herleid volgens de algemene ontwikkeling van het prijspeil sinds
      de dag waarop die huurprijs gold tot aan die van het instellen van de vordering. De rechter zal een vordering tot
      verhoging van de huurprijs evenwel afwijzen voor zover deze is gegrond op verbeteringen van het gehuurde, die door
      de huurder zijn aangebracht. De vordering kan worden ingesteld tot uiterlijk drie maanden na de verlenging, dan
      wel na het onherroepelijk worden van de beslissing tot afwijzing van de vordering bedoeld in [artikel 1627][ref1],
      indien dat op een latere dag plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0006000#Artikel1627a
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1626
    references:
      - id: ref1
        bwb_id: BWBR0006000
        artikel: 1627a
        afdeling: Vijfde
  - number: '1627.1'
    text: |-
      De overeenkomst die voor vijf jaar geldt en de overeenkomst die is aangegaan voor een duur welke langer is dan
      vijf jaar maar korter dan tien jaar kunnen tegen het eind van de duur door ieder der partijen worden opgezegd. De
      opzegging geschiedt bij deurwaardersexploit of bij aangetekende brief. De termijn van opzegging bedraagt ten minste
      een jaar.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1627
  - number: '1627.2'
    text: 'Een opzegging door de verhuurder is nietig, indien:'
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1627
  - number: 1627.2.a
    text: de opzegging niet de gronden vermeldt die tot de opzegging hebben geleid;
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1627
  - number: 1627.2.b
    text: |-
      de opzegging geschiedt op de grond vermeld in [artikel 1628, eerste lid, onder a][ref1], door een verhuurder
      die rechtsopvolger van een vorige verhuurder is en niet is de echtgenoot, de geregistreerde partner, bloed-
      of aanverwant in de eerste graad of een pleegkind van die vorige verhuurder, binnen drie jaren nadat de
      rechtsopvolging schriftelijk ter kennis van de huurder is gebracht;


      [ref1]: https://wetten.overheid.nl/BWBR0006000#Artikel1628
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1627
    references:
      - id: ref1
        bwb_id: BWBR0006000
        artikel: '1628'
        afdeling: Vijfde
  - number: 1627.2.c
    text: |-
      bij de opzegging niet aan de huurder wordt gevraagd om binnen zes weken schriftelijk aan de verhuurder mede te
      delen of hij al dan niet toestemt in de beëindiging van de overeenkomst.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1627
  - number: '1627.3'
    text: |-
      Ieder der partijen kan reeds in de procedure tot beëindiging van de overeenkomst de nadere vaststelling van de
      huurprijs, als bedoeld in het derde lid van het vorige artikel, vorderen voor het geval de vordering bedoeld in
      [artikel 1627a, tweede lid][ref1], mocht worden afgewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0006000#Artikel1627a
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1627
    references:
      - id: ref1
        bwb_id: BWBR0006000
        artikel: 1627a
        afdeling: Vijfde
  - number: '1627.4'
    text: |-
      De overeenkomst loopt, indien haar geldigheidsduur tijdens de procedure verstrijkt, in elk geval voort tot het
      tijdstip waarop onherroepelijk op de vordering is beslist. Indien de rechter de vordering toewijst, stelt hij
      tevens het tijdstip van de ontruiming vast. Het vonnis levert een voor tenuitvoerlegging vatbare titel op. Indien
      de rechter de vordering afwijst, wordt de termijn van de verlenging geacht te zijn ingegaan bij het verstrijken van
      de geldigheidsduur van de overeenkomst.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1627
  - number: '1627.5'
    text: Onder pleegkind wordt verstaan hij die duurzaam als een eigen kind is verzorgd en opgevoed.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1627
  - number: 1627a.1
    text: |-
      Een door de verhuurder opgezegde overeenkomst blijft, tenzij de huurder na de opzegging door de verhuurder
      schriftelijk in de beëindiging ervan heeft toegestemd, na het tijdstip waartegen rechtsgeldig is opgezegd van
      rechtswege van kracht, totdat de beslissing op de vordering bedoeld in het volgende lid onherroepelijk is geworden.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1627a
  - number: 1627a.2
    text: |-
      De verhuurder kan, indien hij zes weken na de opzegging geen schriftelijke mededeling van de huurder dat hij in de
      beëindiging van de overeenkomst toestemt, heeft ontvangen, op de gronden vermeld in de opzegging vorderen dat de
      kantonrechter het tijdstip zal vaststellen waarop de overeenkomst zal eindigen.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1627a
  - number: '1628.1'
    text: 'De rechter kan de vordering slechts toewijzen, indien:'
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1628
  - number: 1628.1.a
    text: |-
      de verhuurder aannemelijk maakt dat hij of zijn echtgenoot, de geregistreerde partner, een bloed- of aanverwant
      in de eerste graad of een pleegkind als bedoeld in [artikel 1627, vijfde lid][ref1], het verhuurde persoonlijk
      in duurzaam gebruik wil nemen als bedrijfsruimte in de zin van [artikel 1624][ref2] en hij het verhuurde daartoe
      dringend nodig heeft; onder gebruik wordt vervreemding van de zaak niet begrepen;


      [ref1]: https://wetten.overheid.nl/BWBR0006000#Artikel1627
      [ref2]: https://wetten.overheid.nl/BWBR0006000#Artikel1624
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1628
    references:
      - id: ref1
        bwb_id: BWBR0006000
        artikel: '1627'
        afdeling: Vijfde
      - id: ref2
        bwb_id: BWBR0006000
        artikel: '1624'
        afdeling: Vijfde
  - number: 1628.1.b
    text: de bedrijfsvoering van de huurder niet is geweest zoals een goed huurder betaamt.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1628
  - number: '1628.2'
    text: |-
      De rechter kan in zijn beslissing tot toewijzing van de vordering op de grond vermeld in het vorige lid, onder
      *a*, een bedrag vaststellen dat de verhuurder aan de huurder moet betalen ter tegemoetkoming in diens verhuis-
      en inrichtingskosten. Alvorens een beslissing te geven waarin een bedrag als in de vorige zin bedoeld wordt
      vastgesteld, brengt de rechter zijn voornemen ter kennis van partijen en stelt hij een termijn binnen welke de
      verhuurder de bevoegdheid heeft de opzegging in te trekken. Indien de verhuurder van die bevoegdheid gebruik maakt,
      zal de rechter alleen een beslissing geven omtrent de proceskosten.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1628
  - number: 1628a.1
    text: |-
      In geval van toewijzing van de vordering op de grond vermeld in [artikel 1628, eerste lid, onder a][ref1], is de
      verhuurder jegens de huurder tot schadevergoeding gehouden, indien de wil om het verhuurde persoonlijk in duurzaam
      gebruik te nemen als bedrijfsruimte in de zin van [artikel 1624][ref2], in werkelijkheid niet aanwezig is geweest.
      De verhuurder is eveneens jegens de huurder tot schadevergoeding gehouden, wanneer hij de overeenkomst heeft
      opgezegd op de grond, genoemd in het eerste lid van het vorige artikel onder *a*, en de huurder in de beëindiging
      van de overeenkomst heeft toegestemd, indien de wil om het verhuurde persoonlijk in duurzaam gebruik te nemen als
      bedrijfsruimte in de zin van [artikel 1624][ref3] in werkelijkheid niet aanwezig is geweest.


      [ref1]: https://wetten.overheid.nl/BWBR0006000#Artikel1628
      [ref2]: https://wetten.overheid.nl/BWBR0006000#Artikel1624
      [ref3]: https://wetten.overheid.nl/BWBR0006000#Artikel1624
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1628a
    references:
      - id: ref1
        bwb_id: BWBR0006000
        artikel: '1628'
        afdeling: Vijfde
      - id: ref2
        bwb_id: BWBR0006000
        artikel: '1624'
        afdeling: Vijfde
      - id: ref3
        bwb_id: BWBR0006000
        artikel: '1624'
        afdeling: Vijfde
  - number: 1628a.2
    text: |-
      Behoudens tegenbewijs wordt die wil geacht niet aanwezig te zijn geweest, indien niet binnen één jaar na het einde
      van de huurovereenkomst het verhuurde door een persoon genoemd in het eerste lid van het vorige artikel onder *a*
      in duurzaam gebruik is genomen.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1628a
  - number: 1628a.3
    text: |-
      De rechter is bevoegd op vordering van de huurder of ambtshalve in een beslissing als bedoeld in het eerste lid,
      een bedrag te bepalen, dat de verhuurder aan de huurder moet betalen, ingeval later mocht blijken, dat die wil in
      werkelijkheid niet aanwezig is geweest, onverminderd het recht van de huurder op verdere schadevergoeding.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1628a
  - number: 1628a.4
    text: |-
      De vordering van de huurder tot schadevergoeding of tot betaling van het bedrag, bedoeld in het vorige lid, vervalt
      vijf jaren na het einde van de huurovereenkomst.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1628a
  - number: '1629.1'
    text: |-
      Behoudens het bepaalde in dit en het volgende artikel, zijn de [artikelen 1625-1628][ref1] van toepassing, al mocht
      ook door partijen anders zijn overeengekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0006000#Artikel1625
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1629
    references:
      - id: ref1
        bwb_id: BWBR0006000
        artikel: '1625'
        afdeling: Vijfde
  - number: '1629.2'
    text: |-
      Afwijkende bedingen in de huurovereenkomst, of in een overeenkomst tot wijziging van de huurovereenkomst, zijn
      slechts van kracht indien zij door de kantonrechter zijn goedgekeurd. Ieder der partijen kan de beslissing van de
      rechter verzoeken. Het verzoekschrift bevat de tekst van de goed te keuren bedingen alsmede een beknopte vermelding
      van de bijzondere omstandigheden die de goedkeuring wenselijk maken. De rechter verleent zijn goedkeuring alleen op
      grond van de bijzondere omstandigheden van het geval.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1629
  - number: '1629.3'
    text: |-
      De overeenkomst tot beëindiging van een huurovereenkomst, aangegaan nadat de huur is ingegaan, behoeft geen
      goedkeuring van de rechter.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1629
  - number: '1629.4'
    text: |-
      Een verzoek als bedoeld in het tweede lid moet worden ingediend ter griffie van de rechtbank van het arrondissement
      waarin de bedrijfsruimte is gelegen.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1629
  - number: '1630.1'
    text: |-
      Zonder goedkeuring van de rechter is geldig de overeenkomst voor een duur van twee jaar of korter. De
      [artikelen 1625-1629][ref1] zijn op die overeenkomst niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006000#Artikel1625
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1630
    references:
      - id: ref1
        bwb_id: BWBR0006000
        artikel: '1625'
        afdeling: Vijfde
  - number: '1630.2'
    text: |-
      Indien het genot aangevangen krachtens een overeenkomst als bedoeld in het eerste lid, langer dan twee jaar
      heeft geduurd, geldt van rechtswege een overeenkomst op de tussen partijen laatstelijk geldende voorwaarden,
      doch voor vijf jaar, waarop de reeds verstreken twee jaar in mindering komen. Op deze overeenkomst zijn de
      [artikelen 1625-1629][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006000#Artikel1625
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1630
    references:
      - id: ref1
        bwb_id: BWBR0006000
        artikel: '1625'
        afdeling: Vijfde
  - number: '1630.3'
    text: |-
      Het in het tweede lid omschreven rechtsgevolg treedt niet in, indien partijen vóór het verstrijken van de termijn
      van twee jaar een andere overeenkomst sluiten, vallende onder [artikel 1625][ref1], dan wel een daarvan afwijkende
      overeenkomst, mits de in [artikel 1629, tweede lid][ref2], bedoelde goedkeuring is verzocht vóór het verstrijken
      van de termijn van twee jaren. Indien de rechter afwijzend op het verzoek tot goedkeuring beslist, stelt hij tevens
      het tijdstip van de ontruiming vast. De beschikking levert een voor tenuitvoerlegging vatbare titel op.


      [ref1]: https://wetten.overheid.nl/BWBR0006000#Artikel1625
      [ref2]: https://wetten.overheid.nl/BWBR0006000#Artikel1629
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1630
    references:
      - id: ref1
        bwb_id: BWBR0006000
        artikel: '1625'
        afdeling: Vijfde
      - id: ref2
        bwb_id: BWBR0006000
        artikel: '1629'
        afdeling: Vijfde
  - number: '1630.4'
    text: |-
      Indien het intreden van het in het tweede lid omschreven rechtsgevolg daartoe aanleiding geeft, kan de huurprijs
      nader worden vastgesteld. Bij gebreke van overeenstemming geschiedt deze vaststelling door de kantonrechter op
      vordering van de meest gerede partij. Hij zal een vordering tot verhoging van de huurprijs evenwel afwijzen voor
      zover het is gegrond op verbeteringen van het gehuurde, die door de huurder zijn aangebracht. De vordering moet
      worden ingesteld uiterlijk drie maanden na het verstrijken van de termijn van twee jaar.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1630
  - number: '1631.1'
    text: |-
      De overeenkomst waarvan de oorspronkelijke ingevolge [artikel 1625][ref1] geldende duur krachtens
      [artikel 1626][ref2] is verlengd, houdt niet van rechtswege op wanneer de termijn van de verlenging is verstreken.
      Zij kan door ieder der partijen tegen het einde van die termijn worden opgezegd. De opzegging kan slechts bij
      deurwaardersexploit of bij aangetekende brief geschieden. De termijn van opzegging bedraagt ten minste een jaar.
      Een opzegging die is gedaan op kortere termijn, geldt niettemin als ware zij gedaan met inachtneming van de
      voorgeschreven termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0006000#Artikel1625
      [ref2]: https://wetten.overheid.nl/BWBR0006000#Artikel1626
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1631
    references:
      - id: ref1
        bwb_id: BWBR0006000
        artikel: '1625'
        afdeling: Vijfde
      - id: ref2
        bwb_id: BWBR0006000
        artikel: '1626'
        afdeling: Vijfde
  - number: '1631.2'
    text: 'Een opzegging door de verhuurder is nietig, indien:'
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1631
  - number: 1631.2.a
    text: de opzegging niet de gronden vermeldt die tot de opzegging hebben geleid;
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1631
  - number: 1631.2.b
    text: |-
      de opzegging geschiedt op de grond dat de verhuurder het verhuurde in gebruik wil nemen, door een verhuurder
      die rechtsopvolger van een vorige verhuurder is en niet is de echtgenoot, de geregistreerde partner, bloed- of
      aanverwant in de eerste graad of een pleegkind als bedoeld in artikel 1627, vijfde lid, van die vorige verhuurder,
      binnen drie jaren nadat de rechtsopvolging schriftelijk ter kennis van de huurder is gebracht;
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1631
  - number: 1631.2.c
    text: de opzegging ertoe strekt om een verhoging van de huurprijs te bewerkstelligen;
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1631
  - number: 1631.2.d
    text: |-
      bij de opzegging niet aan de huurder wordt gevraagd om binnen zes weken schriftelijk aan de verhuurder mede te
      delen of hij al dan niet toestemt in de beëindiging van de overeenkomst.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1631
  - number: '1631.3'
    text: |-
      [Artikel 1627][ref1] is van overeenkomstige toepassing. De rechter kan evenwel, indien het verweer van de huurder
      hem kennelijk ongegrond voorkomt, bepalen dat de overeenkomst in afwijking van het bepaalde in het eerste lid van
      dat artikel niet verder van kracht blijft en zijn toewijzend vonnis uitvoerbaar bij voorraad verklaren.


      [ref1]: https://wetten.overheid.nl/BWBR0006000#Artikel1627a
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1631
    references:
      - id: ref1
        bwb_id: BWBR0006000
        artikel: 1627a
        afdeling: Vijfde
  - number: '1631.4'
    text: Elk met de bepalingen van dit artikel strijdig beding is nietig.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1631
  - number: 1631a.1
    text: |-
      De rechter wijst de vordering af, indien van de huurder, bij redelijke afweging van zijn belangen bij verlenging
      van de overeenkomst tegen de belangen van de verhuurder bij beëindiging van de overeenkomst, niet kan worden
      gevergd dat hij het gehuurde ontruimt.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1631a
  - number: 1631a.2
    text: 'De rechter wijst de vordering in ieder geval toe:'
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1631a
  - number: 1631a.2.1°
    text: indien de bedrijfsvoering van de huurder niet is geweest zoals een goed huurder betaamt;
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1631a
  - number: 1631a.2.2°
    text: |-
      indien de verhuurder aannemelijk maakt dat hij of zijn echtgenoot, de geregistreerde partner, een bloed- of
      aanverwant in de eerste graad of een pleegkind als bedoeld in [artikel 1627, vijfde lid][ref1], het verhuurde
      persoonlijk in duurzaam gebruik wil nemen als bedrijfsruimte in de zin van [artikel 1624][ref2] en hij het
      verhuurde daartoe dringend nodig heeft; onder gebruik wordt vervreemding van de zaak niet begrepen;


      [ref1]: https://wetten.overheid.nl/BWBR0006000#Artikel1627
      [ref2]: https://wetten.overheid.nl/BWBR0006000#Artikel1624
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1631a
    references:
      - id: ref1
        bwb_id: BWBR0006000
        artikel: '1627'
        afdeling: Vijfde
      - id: ref2
        bwb_id: BWBR0006000
        artikel: '1624'
        afdeling: Vijfde
  - number: 1631a.2.3°
    text: |-
      indien de verhuurder een krachtens een geldend bestemmingsplan op het verhuurde liggende bestemming wil
      verwezenlijken;
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1631a
  - number: 1631a.2.4°
    text: |-
      indien de huurder niet toestemt in een redelijk aanbod tot het aangaan van een nieuwe overeenkomst met betrekking
      tot het gehuurde, voor zover dit aanbod niet een wijziging van de huurprijs inhoudt.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1631a
  - number: 1631a.3
    text: |-
      Ingeval de verhuurder de overeenkomst heeft opgezegd op de grond dat één of meer der in het vorige lid, onder
      2°, genoemde personen het gehuurde in gebruik willen nemen, kan de rechter in zijn beslissing tot toewijzing van
      de vordering op de grond vermeld in het eerste lid of in het vorige lid, onder 2°, een bedrag vaststellen dat
      de verhuurder aan de huurder moet betalen ter tegemoetkoming in diens verhuis- en inrichtingskosten. Alvorens
      een beslissing te geven waarin een bedrag als in de vorige zin bedoeld wordt vastgesteld, brengt de rechter
      zijn voornemen ter kennis van partijen en stelt hij een termijn binnen welke de verhuurder de bevoegdheid heeft
      de opzegging in te trekken. Indien de verhuurder van die bevoegdheid gebruik maakt, zal de rechter alleen een
      beslissing geven omtrent de proceskosten.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1631a
  - number: 1631a.4
    text: |-
      In geval van toewijzing van de vordering op de grond vermeld in het tweede lid, onder 2°, is de verhuurder jegens
      de huurder tot schadevergoeding gehouden, indien de wil om het verhuurde persoonlijk in duurzaam gebruik te nemen
      als bedrijfsruimte in de zin van [artikel 1624][ref1] in werkelijkheid niet aanwezig is geweest. De verhuurder
      is eveneens jegens de huurder tot schadevergoeding gehouden, wanneer hij de overeenkomst heeft opgezegd op de
      grond genoemd in het tweede lid, onder 2°, en de huurder in de beëindiging van de overeenkomst heeft toegestemd,
      indien de wil om het verhuurde persoonlijk in duurzaam gebruik te nemen als bedrijfsruimte in de zin van
      [artikel 1624][ref2] in werkelijkheid niet aanwezig is geweest. Indien de overeenkomst is opgezegd op de grond dat
      de in het tweede lid, onder 2°, genoemde personen het verhuurde persoonlijk in duurzaam gebruik willen nemen en
      de vordering is toegewezen op grond van het eerste lid, is de verhuurder tot schadevergoeding jegens de huurder
      gehouden, indien de wil om het verhuurde persoonlijk in duurzaam gebruik te nemen in werkelijkheid niet aanwezig is
      geweest. Het [tweede, derde en vierde lid van artikel 1628][ref3] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006000#Artikel1624
      [ref2]: https://wetten.overheid.nl/BWBR0006000#Artikel1624
      [ref3]: https://wetten.overheid.nl/BWBR0006000#Artikel1628a
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1631a
    references:
      - id: ref1
        bwb_id: BWBR0006000
        artikel: '1624'
        afdeling: Vijfde
      - id: ref2
        bwb_id: BWBR0006000
        artikel: '1624'
        afdeling: Vijfde
      - id: ref3
        bwb_id: BWBR0006000
        artikel: 1628a
        afdeling: Vijfde
  - number: 1631a.5
    text: |-
      In het geval bedoeld in het tweede lid, onder 4°, staat de rechter, alvorens over de vordering te beslissen, de
      huurder een termijn van ten hoogste een maand toe om alsnog het aanbod te aanvaarden.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1631a
  - number: 1631a.6
    text: Indien de rechter de vordering afwijst, bepaalt hij tevens het tijdstip tot hetwelk de overeenkomst wordt verlengd.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1631a
  - number: 1631a.7
    text: |-
      Indien de rechter de vordering toewijst, stelt hij tevens het tijdstip van de ontruiming vast. Het vonnis levert
      een voor tenuitvoerlegging vatbare titel op.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1631a
  - number: 1631a.8
    text: |-
      Wanneer tussen de partijen geen overeenstemming bestaat over wijziging van de huurprijs in verband met de
      verlenging, stelt de kantonrechter op vordering van de meest gerede partij de huurprijs nader vast, indien deze
      niet overeenstemt met die van vergelijkbare bedrijfsruimte ter plaatse. Bij de nadere vaststelling van de huurprijs
      let de rechter op het gemiddelde van de huurprijzen van vergelijkbare bedrijfsruimte ter plaatse welke zich hebben
      voorgedaan in een tijdvak van vijf jaren voorafgaande aan de dag van het instellen van de vordering. Iedere aldus
      in de vergelijking te betrekken huurprijs wordt herleid volgens de algemene ontwikkeling van het prijspeil sinds
      de dag waarop die huurprijs gold tot aan die van het instellen van de vordering. De rechter zal een vordering tot
      verhoging van de huurprijs evenwel afwijzen voor zover het is gegrond op verbeteringen van het gehuurde, die door
      de huurder zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1631a
  - number: 1631b.1
    text: |-
      Indien de rechter de overeenkomst verlengd heeft, kan de verhuurder, tenzij de termijn van verlenging niet meer dan
      een jaar bedraagt, na opzegging van de overeenkomst wederom vorderen dat de rechter het tijdstip zal vaststellen
      waarop de overeenkomst zal eindigen. Deze vordering kan niet eerder dan zes maanden voor het einde van de termijn
      van verlenging worden ingesteld.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1631b
  - number: 1631b.2
    text: |-
      De [artikelen 1631][ref1] en [1631][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006000#Artikel1631
      [ref2]: https://wetten.overheid.nl/BWBR0006000#Artikel1631a
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1631b
    references:
      - id: ref1
        bwb_id: BWBR0006000
        artikel: '1631'
        afdeling: Vijfde
      - id: ref2
        bwb_id: BWBR0006000
        artikel: 1631a
        afdeling: Vijfde
  - number: 1631c.1
    text: |-
      Vindt geen opzegging krachtens het [eerste lid van artikel 1631][ref1] plaats, dan loopt de overeenkomst voor
      onbepaalde tijd door, tenzij uit de overeenkomst een bepaalde tijd voortvloeit of partijen een bepaalde tijd
      overeenkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0006000#Artikel1631
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1631c
    references:
      - id: ref1
        bwb_id: BWBR0006000
        artikel: '1631'
        afdeling: Vijfde
  - number: 1631c.2
    text: |-
      [Artikel 1631][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006000#Artikel1631a
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1631c
    references:
      - id: ref1
        bwb_id: BWBR0006000
        artikel: 1631a
        afdeling: Vijfde
  - number: 1631d.1
    text: |-
      De in het vorige artikel bedoelde overeenkomst voor onbepaalde tijd moet met een termijn van ten minste een jaar
      worden opgezegd.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1631d
  - number: 1631d.2
    text: |-
      De in het vorige artikel bedoelde overeenkomst voor bepaalde tijd en de overeenkomst die voor een bepaalde tijd van
      tien jaar of langer is aangegaan, houden niet van rechtswege op wanneer de bepaalde tijd is verstreken. Zij kunnen
      door ieder der partijen tegen het einde van de bepaalde tijd worden opgezegd. De opzegging moet geschieden bij
      deurwaardersexploit of bij aangetekende brief. De termijn van opzegging bedraagt ten minste een jaar. Een opzegging
      die is gedaan op kortere termijn, geldt niettemin als ware zij gedaan met inachtneming van de voorgeschreven
      termijn.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1631d
  - number: 1631d.3
    text: |-
      De [artikelen 1631, tweede, derde, vierde en vijfde lid][ref1], [1631a ][ref2], [1631b ][ref3] en [1631c][ref4]
      zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006000#Artikel1631
      [ref2]: https://wetten.overheid.nl/BWBR0006000#Artikel1631a
      [ref3]: https://wetten.overheid.nl/BWBR0006000#Artikel1631b
      [ref4]: https://wetten.overheid.nl/BWBR0006000#Artikel1631c
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1631d
    references:
      - id: ref1
        bwb_id: BWBR0006000
        artikel: '1631'
        afdeling: Vijfde
      - id: ref2
        bwb_id: BWBR0006000
        artikel: 1631a
        afdeling: Vijfde
      - id: ref3
        bwb_id: BWBR0006000
        artikel: 1631b
        afdeling: Vijfde
      - id: ref4
        bwb_id: BWBR0006000
        artikel: 1631c
        afdeling: Vijfde
  - number: '1632'
    text: |-
      Indien bij een voor bepaalde tijd aangegane huurovereenkomst de erfgenamen van de huurder niet bevoegd zijn de
      bedrijfsruimte aan een ander in gebruik te geven, kunnen zij, onderscheidenlijk zijn echtgenoot of geregistreerde
      partner in het geval zijn nalatenschap overeenkomstig [artikel 13 van Boek 4][ref1] wordt verdeeld, ongeacht
      enig andersluidend beding gedurende zes maanden na het overlijden van hun erflater de overeenkomst opzeggen. De
      opzegging geschiedt bij deurwaardersexploit of aangetekende brief. De termijn van opzegging bedraagt zes maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0002761#Artikel13
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1632
    references:
      - id: ref1
        bwb_id: BWBR0002761
        artikel: '13'
  - number: 1632a.1
    text: |-
      Ongeacht enig andersluidend beding kan de verhuurder of de huurder vorderen dat de kantonrechter de huurprijs,
      ingeval deze niet overeenstemt met die van vergelijkbare bedrijfsruimte ter plaatse, nader vast zal stellen:
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1632a
  - number: 1632a.1.a
    text: indien de overeenkomst voor bepaalde tijd geldt, na afloop van de overeengekomen duur;
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1632a
  - number: 1632a.1.b
    text: |-
      indien de overeenkomst voor onbepaalde tijd geldt, telkens wanneer vijf jaren zijn verstreken sinds de datum met
      ingang waarvan de overeenkomst is aangegaan.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1632a
  - number: 1632a.2
    text: |-
      Bij de nadere vaststelling van de huurprijs let de rechter op het gemiddelde van de huurprijzen van vergelijkbare
      bedrijfsruimte ter plaatse welke zich hebben voorgedaan in een tijdvak van vijf jaren voorafgaande aan de dag van
      het instellen van de vordering. Iedere aldus in de vergelijking te betrekken huurprijs wordt herleid volgens de
      algemene ontwikkeling van het prijspeil sinds de dag waarop die huurprijs gold tot aan die van het instellen van de
      vordering. De rechter zal een vordering tot verhoging van de huurprijs evenwel afwijzen voor zover het is gegrond
      op verbeteringen van het gehuurde, die door de huurder zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1632a
  - number: '1633.1'
    text: |-
      De huurder is niet bevoegd de inrichting of gedaante van het gehuurde geheel of gedeeltelijk te veranderen dan na
      schriftelijke toestemming van de verhuurder.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1633
  - number: '1633.2'
    text: |-
      Indien de verhuurder de toestemming niet verleent, kan de huurder, ongeacht enig andersluidend beding, vorderen dat
      de kantonrechter hem zal machtigen tot het aanbrengen van de veranderingen. De verhuurder en de hypotheekhouder, zo
      die er is, worden gehoord, althans opgeroepen.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1633
  - number: '1633.3'
    text: |-
      De rechter wijst de vordering slechts toe, indien de veranderingen noodzakelijk zijn voor een doelmatige
      uitoefening van het bedrijf van de huurder en geen gewichtige bezwaren van de verhuurder zich tegen het aanbrengen
      daarvan verzetten.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1633
  - number: '1633.4'
    text: |-
      De rechter kan aan de machtiging voorwaarden verbinden of daarbij een last opleggen; hij kan op vordering van de
      meest gerede partij de huurprijs verhogen indien de veranderingen daartoe aanleiding geven.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1633
  - number: '1634'
    text: |-
      Indien de rechter ingevolge [artikel 299 van Boek 3][ref1] de huurder machtigt bepaalde onderhoudswerken of
      reparatiën ten koste van de verhuurder uit te voeren, kan hij tevens, ongeacht enig andersluidend beding, bepalen
      of en tot welk bedrag de huurder de gemaakte kosten met de huurprijs kan verrekenen.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel299
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1634
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '299'
  - number: '1635.1'
    text: |-
      De huurder die het in het gehuurde uitgeoefende bedrijf aan een ander wenst over te dragen, kan, ongeacht enig
      andersluidend beding, vorderen dat hij gemachtigd wordt om die ander in zijn plaats als huurder te stellen.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1635
  - number: '1635.2'
    text: |-
      De rechter beslist met inachtneming van de omstandigheden van het geval, met dien verstande dat hij de vordering
      slechts kan toewijzen, indien de huurder een zwaarwichtig belang heeft bij de overdracht van het bedrijf en dat hij
      haar steeds afwijst, indien de voorgestelde huurder niet voldoende waarborgen biedt voor een richtige nakoming van
      de huurovereenkomst en voor een behoorlijke bedrijfsvoering.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1635
  - number: '1635.3'
    text: De rechter kan aan de machtiging voorwaarden verbinden of daarbij een last opleggen.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1635
  - number: 1635a.1
    text: |-
      Indien de verhuurder, nadat de huurovereenkomst door opzegging zijnerzijds is geëindigd, voordeel geniet tengevolge
      van het feit dat het verhuurde vervolgens wordt gebezigd voor de uitoefening van een bedrijf, gelijksoortig aan
      het door de gewezen huurder aldaar uitgeoefende, kan de gewezen huurder van de verhuurder een naar billijkheid te
      berekenen vergoeding vorderen.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1635a
  - number: 1635a.2
    text: |-
      Voordeel, voortvloeiend uit de aard of de ligging van het verhuurde, of uit daaraan aangebrachte veranderingen,
      komt voor de toepassing van het vorige lid niet in aanmerking.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1635a
  - number: 1635a.3
    text: |-
      De vergoeding kan niet worden toegekend wanneer het verhuurde voor de uitoefening van het gelijksoortige bedrijf
      eerst wordt gebezigd nadat sedert het eindigen van de huurovereenkomst meer dan een jaar is verstreken.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1635a
  - number: 1635a.4
    text: Bedingen waarin ten nadele van de huurder wordt afgeweken van de bepalingen van dit artikel, zijn nietig.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1635a
  - number: '1636.1'
    text: |-
      Ontbinding van de overeenkomst op de grond dat de huurder zijn verplichtingen niet nakomt, kan slechts door de
      rechter geschieden.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1636
  - number: '1636.2'
    text: |-
      Alvorens te beslissen over een vordering tot ontbinding van de overeenkomst, kan de rechter de huurder een termijn
      toestaan om alsnog aan zijn verplichtingen te voldoen.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1636
  - number: '1636.3'
    text: |-
      Indien de overeenkomst overigens krachtens een bepaling in de overeenkomst zonder opzegging zou eindigen, moet zij
      niettemin met inachtneming van de bepalingen van deze afdeling worden opgezegd.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1636
  - number: '1636.4'
    text: Elk met dit artikel strijdig beding is nietig.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1636
  - number: 1636a.1
    text: |-
      De verhuurder die door eigendomsovergang van het verhuurde onder bijzondere titel verhuurder is geworden is, indien
      hij de huurovereenkomst door opzegging doet eindigen in verband met de omstandigheid dat het gebouwde met het oog
      op de uitvoering van werken in het algemeen belang zal worden afgebroken, aan de huurder en de onderhuurder aan wie
      voor de eigendomsovergang bevoegdelijk is onderverhuurd, een schadeloosstelling schuldig wegens het verlies van de
      kans, dat de huurverhouding zonder deze eigendomsovergang zou hebben voortgeduurd.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1636a
  - number: 1636a.2
    text: |-
      De verhuurder is de in het eerste lid bedoelde schadeloosstelling eveneens schuldig indien de eigendomsovergang
      is geschied nadat een vorige verhuurder de huurovereenkomst heeft opgezegd in verband met de omstandigheid dat
      na de eigendomsovergang het gebouwde met het oog op de uitvoering van werken in het algemeen belang zal worden
      afgebroken. Is de huurovereenkomst voor de eigendomsovergang geëindigd, dan is de schadeloosstelling verschuldigd
      door de eigenaar die tot de afbraak overgaat.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1636a
  - number: 1636a.3
    text: |-
      Een opzegging wordt vermoed in verband met de omstandigheid dat het gebouwde met het oog op de uitvoering van
      werken in het algemeen belang zal worden afgebroken, te zijn geschied, indien de afbraak aanvangt binnen zes jaren
      na de opzegging.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1636a
  - number: 1636a.4
    text: |-
      Werken tot verwezenlijking van een bestemmingsplan strekkende tot reconstructie van een bebouwde kom, worden in elk
      geval geacht in het algemeen belang te zijn.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1636a
  - number: 1636a.5
    text: |-
      Dit artikel is, behalve op bedrijfsruimte in de zin van [artikel 1624][ref1], ook van toepassing op een andere
      gebouwde onroerende zaak die voor de uitoefening van een bedrijf is verhuurd.


      [ref1]: https://wetten.overheid.nl/BWBR0006000#Artikel1624
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1636a
    references:
      - id: ref1
        bwb_id: BWBR0006000
        artikel: '1624'
        afdeling: Vijfde
  - number: 1636b.1
    text: |-
      Indien iemand door eigendomsovergang verhuurder is geworden en een krachtens een geldend bestemmingsplan op
      het verhuurde liggende bestemming wil verwezenlijken, ontbindt de rechter op vordering van de verhuurder de
      huurovereenkomst met ingang van een door hem te bepalen datum.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1636b
  - number: 1636b.2
    text: |-
      De huurder en de onderhuurder aan wie bevoegdelijk is onderverhuurd kunnen een schadeloosstelling vorderen. Bij de
      bepaling daarvan wordt rekening gehouden met de kans dat de huurverhouding zonder de eigendomsovergang zou hebben
      voortgeduurd.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1636b
  - number: '1639'
    text: |-
      De aanneming van werk is de overeenkomst waarbij de ene partij, de aannemer, zich verbindt voor de andere partij,
      de aanbesteder, tegen een bepaalde prijs een bepaald werk van stoffelijke aard tot stand te brengen.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1639
  - number: '1640'
    text: |-
      Bij aanneming van werk kan men overeenkomen dat de aannemer alleen arbeid verrigten, of wel dat hij ook de stof
      leveren zal.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1640
  - number: '1641'
    text: |-
      Ingeval de aannemer de stof moet leveren, en het werk, op welke wijze ook, vergaat, alvorens het geleverd is, komt
      het verlies voor zijne rekening, ten ware de aanbesteder nalatig zij geweest om het werk te ontvangen.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1641
  - number: '1642'
    text: |-
      Indien de aannemer alleen arbeid moet verrigten, en het werk vergaat, is hij slechts voor zijne schuld
      aansprakelijk.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1642
  - number: '1643'
    text: |-
      Indien het werk, in het geval bij het voorgaande artikel vermeld, buiten eenig pligtverzuim van den aannemer is
      verloren gegaan, voordat de levering geschied is, en zonder dat de aanbesteder nalatig is geweest om het werk op te
      nemen en goed te keuren, heeft de aannemer geene aanspraak op den bedongen prijs, ten ware de zaak door een gebrek
      in de stof zelve verloren ware gegaan.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1643
  - number: '1644'
    text: |-
      Indien een werk bij het stuk of bij de maat bearbeid wordt, kan hetzelve bij gedeelten worden opgenomen; die
      opneming wordt geacht geschied te zijn voor alle de betaalde gedeelten, wanneer de aanbesteder den aannemer telkens
      betaalt naar evenredigheid van hetgeen afgewerkt is.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1644
  - number: '1645'
    text: |-
      Indien een gebouw, voor eenen bepaalden prijs aangenomen en afgemaakt, geheel of gedeeltelijk vergaat door een
      gebrek in de zamenstelling, of zelfs uit hoofde van de ongeschiktheid van den grond, zijn de bouwmeesters en
      aannemers daarvoor, gedurende tien jaren, aansprakelijk.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1645
  - number: '1646'
    text: |-
      Indien een bouwmeester of aannemer op zich genomen heeft om een gebouw bij aanneming te maken, volgens een bestek,
      met den eigenaar van den grond beraamd en vastgesteld, kan hij geene vermeerdering van den prijs vorderen, noch
      onder voorwendsel van vermeerdering der arbeidsloonen of bouwstoffen, noch onder dat van gemaakte veranderingen of
      bijvoegselen die niet in het bestek begrepen zijn, indien die veranderingen of vergrootingen niet schriftelijk zijn
      ingewilligd, en over derzelver prijs met den eigenaar geene overeenkomst is getroffen.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1646
  - number: '1647'
    text: |-
      De aanbesteder kan, des goedvindende, de aanneming opzeggen, ofschoon het werk reeds begonnen zij, mits hij den
      aannemer, wegens alle deszelfs gemaakte kosten, arbeid en winstderving, volkomen schadeloos stelle.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1647
  - number: '1648.1'
    text: Aanneming van werk houdt op door den dood van den aannemer.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1648
  - number: '1648.2'
    text: |-
      Maar de aanbesteder is gehouden aan de erfgenamen van de aannemer, onderscheidenlijk aan diens echtgenoot of
      geregistreerde partner in het geval zijn nalatenschap overeenkomstig [artikel 13 van Boek 4][ref1] wordt verdeeld,
      naar evenredigheid van den bij de overeenkomst bedongen prijs, te betalen de waarde van het gedane werk en die der
      in gereedheid gebragte bouwstoffen, mits dat werk of die bouwstoffen hem tot eenig nut kunnen verstrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0002761#Artikel13
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1648
    references:
      - id: ref1
        bwb_id: BWBR0002761
        artikel: '13'
  - number: '1650'
    text: |-
      Metselaars, timmerlieden, smids en andere ambachtslieden, welke tot het zetten van een gebouw of het maken van
      eenig ander aangenomen werk gebezigd zijn, hebben geene regtsvordering tegen dengenen te wiens behoeve de werken
      gemaakt zijn, dan ten beloope van hetgene deze aan den aannemer schuldig is op het oogenblik waarop zij hunne
      regtsvordering aanleggen.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1650
  - number: '1651.1'
    text: |-
      Metselaars, timmerlieden, smids en andere ambachtslieden, die zelven onmiddellijk en voor eenen bepaalden prijs een
      werk op zich nemen, zijn gehouden aan de regelen in deze afdeeling voorgeschreven.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1651
  - number: '1651.2'
    text: Zij zijn aannemers in het vak waarin zij werkzaam zijn.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1651
  - number: '1655'
    text: |-
      Maatschap is eene overeenkomst, waarbij twee of meerdere personen zich verbinden om iets in gemeenschap te brengen,
      met het oogmerk om het daaruit ontstaande voordeel met elkander te deelen.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1655
  - number: '1657'
    text: Maatschappen zijn of algeheel, of bijzonder.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1657
  - number: '1658'
    text: |-
      De wet kent slechts de algeheele maatschap van winst. Zij verbiedt alle maatschappen, het zij van alle de goederen,
      het zij van een bepaald gedeelte van dezelve, onder eenen algemeenen titel; onverminderd de bepalingen, vastgesteld
      in den [zevenden][ref1] en [achtsten titel van het eerste boek van dit Wetboek][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002656
      [ref2]: https://wetten.overheid.nl/BWBR0002656
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1658
    references:
      - id: ref1
        bwb_id: BWBR0002656
      - id: ref2
        bwb_id: BWBR0002656
  - number: '1659'
    text: |-
      De algeheele maatschap van winst bevat slechts hetgeen partijen, onder welke benaming ook, gedurende den loop der
      maatschap door hare vlijt zullen verkrijgen.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1659
  - number: '1660'
    text: |-
      De bijzondere maatschap is de zoodanige welke slechts betrekking heeft tot zekere bepaalde goederen, of tot
      derzelver gebruik, of tot de vruchten die daarvan zullen getrokken worden, of tot eene bepaalde onderneming, of tot
      de uitoefening van eenig bedrijf of beroep.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1660
  - number: '1661'
    text: De maatschap begint van het oogenblik der overeenkomst, indien daarbij geen ander tijdstip bepaald is.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1661
  - number: '1662.1'
    text: De inbreng van de vennoot kan bestaan in geld, goederen, genot van goederen en arbeid.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1662
  - number: '1662.2'
    text: |-
      Op de inbreng van een goed zijn de bepalingen omtrent koop, op de inbreng van genot van een goed de
      [artikelen 1584-1623][ref1] van overeenkomstige toepassing, voor zover de aard van de rechtsverhouding zich
      daartegen niet verzet.


      [ref1]: https://wetten.overheid.nl/BWBR0006000#Artikel1584
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1662
    references:
      - id: ref1
        bwb_id: BWBR0006000
        artikel: '1584'
        afdeling: Eerste
  - number: '1665'
    text: |-
      Wanneer een der vennooten, voor zijne eigene rekening, eene opeischbare som te vorderen heeft van iemand die mede
      eene insgelijks opeischbare som verschuldigd is aan de maatschap, moet de betaling, welke hij ontvangt, op de
      inschuld der maatschap en op die van hemzelven, naar evenredigheid van beide die vorderingen, toegerekend worden,
      al ware het ook dat hij, bij de kwijting, alles in mindering of voldoening van zijne eigene inschuld mogt gebragt
      hebben; maar indien hij bij de kwijting bepaald heeft dat de geheele betaling zoude strekken voor de inschuld der
      maatschap, zal deze bepaling worden nagekomen.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1665
  - number: '1666'
    text: |-
      Indien een der vennooten zijn geheel aandeel in eene gemeene inschuld der maatschap ontvangen heeft, en de
      schuldenaar naderhand onvermogend is geworden, is die vennoot gehouden het ontvangene in de gemeene kas in te
      brengen, al had hij ook voor zijn aandeel kwijting gegeven.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1666
  - number: '1670.1'
    text: |-
      Indien bij de overeenkomst van maatschap het aandeel van ieder vennoot in de winsten en de verliezen niet is
      bepaald, is elks aandeel geëvenredigd aan hetgeen hij in de maatschap heeft ingebragt.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1670
  - number: '1670.2'
    text: |-
      Ten aanzien van degenen die slechts zijne nijverheid heeft ingebragt, wordt het aandeel in de winsten en de
      verliezen berekend gelijk te staan met het aandeel van dengenen der vennooten die het minst heeft ingebragt.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1670
  - number: '1671.1'
    text: |-
      De vennooten kunnen niet bedingen dat zij de regeling der hoegrootheid van hun aandeel aan een hunner of aan eenen
      derde zullen overlaten.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1671
  - number: '1671.2'
    text: |-
      Een zoodanig beding wordt voorondersteld niet geschreven te zijn, en zullen alzoo de verordeningen van het
      voorgaande artikel worden in acht genomen.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1671
  - number: '1672.1'
    text: Het beding, waarbij aan een der vennooten alle de voordeelen mogten toegezegd zijn, is nietig.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1672
  - number: '1672.2'
    text: |-
      Maar het is geoorloofd te bedingen dat alle de verliezen bij uitsluiting door een of meer der vennooten zullen
      gedragen worden.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1672
  - number: '1673.1'
    text: |-
      De vennoot die bij een bijzonder beding van de overeenkomst van maatschap met het beheer belast is, kan, zelfs in
      weerwil der overige vennooten, alle daden verrigten, welke tot zijn beheer betrekkelijk zijn.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1673
  - number: '1673.2'
    text: |-
      Deze magt kan, zoo lang de maatschap duurt, niet zonder gewichtige reden herroepen worden; maar indien dezelve
      niet bij de overeenkomst der maatschap, maar bij eene latere akte, is gegeven, is zij, even als eene eenvoudige
      lastgeving, herroepelijk.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1673
  - number: '1674'
    text: |-
      Indien verscheidene vennooten met het beheer belast zijn, zonder dat hunne bijzondere werkzaamheden bepaald zijn,
      of zonder beding dat de een buiten den anderen niets zoude mogen verrigten, is ieder van hen afzonderlijk tot alle
      handelingen, dat beheer betreffende, bevoegd.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1674
  - number: '1675'
    text: |-
      Indien er bedongen is dat een der beheerders niets buiten den anderen zoude mogen verrigten, vermag de eene, zonder
      eene nieuwe overeenkomst, niet te handelen zonder medewerking van den anderen, al mogt deze zich ook voor het
      oogenblik in de onmogelijkheid bevinden om aan de daden van het beheer deel te nemen.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1675
  - number: '1676'
    text: 'Bij gebreke van bijzondere bedingen omtrent de wijze van beheer, moeten de volgende regelen worden in acht genomen:'
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1676
  - number: 1676.1°
    text: |-
      De vennooten worden geacht zich over en weder de magt te hebben verleend om, de een voor den anderen, te beheeren.
      Hetgeen ieder van hen verrigt is ook verbindende voor het aandeel der overige vennooten, zonder dat hij hunne
      toestemming hebbe bekomen; onverminderd het regt van deze laatstgemelden, of van een hunner, om zich tegen de
      handeling, zoo lang die nog niet gesloten is, te verzetten;
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1676
  - number: 1676.2°
    text: |-
      Ieder der vennooten mag gebruik maken van de goederen aan de maatschap toebehoorende, mits hij dezelve tot
      zoodanige einden gebruike, als waartoe zij gewoonlijk bestemd zijn, en mits hij zich van dezelve niet bediene tegen
      het belang der maatschap of op zoodanige wijze, dat de overige vennooten daardoor verhinderd worden om van die
      goederen, volgens hun regt, mede gebruik te maken;
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1676
  - number: 1676.3°
    text: |-
      Ieder vennoot heeft de bevoegdheid om de overige vennooten te verpligten in de onkosten te dragen, welke tot behoud
      der aan de maatschap behoorende goederen noodzakelijk zijn;
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1676
  - number: 1676.4°
    text: |-
      Geen der vennooten kan, zonder toestemming der overige, eenige nieuwigheden daarstellen ten aanzien der onroerende
      zaken, welke tot de maatschap behooren, al beweerde hij ook dat dezelve voor de maatschap voordeelig waren.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1676
  - number: '1678'
    text: |-
      Elk der vennooten mag, zelfs zonder toestemming der overige, eenen derden persoon aannemen als deelgenoot in het
      aandeel hetwelk hij in de maatschap heeft; doch hij kan denzelven, zonder zoodanige toestemming, niet als medelid
      der maatschap toelaten, al mogt hij ook met het beheer der zaken van de maatschap belast zijn.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1678
  - number: '1679'
    text: |-
      De vennooten zijn niet ieder voor het geheel voor de schulden der maatschap verbonden; en een der vennooten kan de
      overige niet verbinden, indien deze hem daartoe geene volmagt gegeven hebben.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1679
  - number: '1680'
    text: |-
      De vennooten kunnen door den schuldeischer, met wien zij gehandeld hebben, aangesproken worden, ieder voor gelijke
      som en gelijk aandeel, al ware het dat het aandeel in de maatschap van den eenen minder dan dat van den anderen
      bedroeg; ten zij, bij het aangaan der schuld, derzelver verpligting, om in evenredigheid van het aandeel in de
      maatschap van elk vennoot te dragen, uitdrukkelijk zij bepaald.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1680
  - number: '1681'
    text: |-
      Het beding dat eene handeling voor rekening der maatschap is aangegaan, verbindt slechts den vennoot die dezelve
      aangegaan heeft, maar niet de overige, ten zij de laatstgenoemde hem daartoe volmagt hadden gegeven, of de zaak ten
      voordeele der maatschap gestrekt hebbe.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1681
  - number: '1682'
    text: |-
      Indien een der vennooten in naam der maatschap eene overeenkomst heeft aangegaan, kan de maatschap de uitvoering
      daarvan vorderen.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1682
  - number: '1683'
    text: 'Een maatschap wordt ontbonden:'
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1683
  - number: 1683.1°
    text: Door verloop van den tijd voor welken dezelve is aangegaan;
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1683
  - number: 1683.2°
    text: Door het tenietgaan van een goed of de volbrenging der handeling, die het onderwerp der maatschap uitmaakt;
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1683
  - number: 1683.3°
    text: Door opzegging van een vennoot aan de andere vennoten;
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1683
  - number: 1683.4°
    text: |-
      Door den dood of de curatele van één hunner, of indien hij in staat van faillissement is verklaard dan wel ten
      aanzien van hem de schuldsaneringsregeling natuurlijke personen van toepassing is verklaard.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1683
  - number: '1684.1'
    text: De rechter kan op vordering van ieder der vennoten de maatschap wegens gewichtige redenen ontbinden.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1684
  - number: '1684.2'
    text: |-
      Een zodanige ontbinding heeft geen terugwerkende kracht. De rechter kan de vordering toewijzen onder door
      hem te stellen voorwaarden en een partij die in de naleving van haar verplichtingen is tekortgeschoten, met
      overeenkomstige toepassing van [artikel 277 van Boek 6][ref1] tot schadevergoeding veroordelen.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel277
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1684
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '277'
  - number: '1684.3'
    text: |-
      De [artikelen 265-279 van Boek 6][ref1] zijn op een maatschap niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel265
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1684
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '265'
  - number: '1686.1'
    text: Een opzegging is vernietigbaar, indien zij in strijd met de redelijkheid en billijkheid is geschied.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1686
  - number: '1686.2'
    text: |-
      Een vennootschap voor bepaalde tijd of voor een bepaald werk aangegaan, kan niet worden opgezegd, tenzij dit is
      bedongen.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1686
  - number: '1688.1'
    text: |-
      Indien bedongen is, dat, in geval van overlijden van een der vennooten, de maatschap met deszelfs erfgenaam, of
      alleen tusschen de overblijvende vennooten, zoude voortduren, moet dat beding worden nagekomen.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1688
  - number: '1688.2'
    text: |-
      In het tweede geval, heeft de erfgenaam des overledenen geen verder regt dan op de verdeeling der maatschap,
      overeenkomstig de gesteldheid waarin dezelve zich ten tijde van dat overlijden bevond; doch hij deelt in de
      voordeelen en draagt in de verliezen, die de noodzakelijke gevolgen zijn van verrigtingen, welke vóór het
      overlijden van den vennoot, wiens erfgenaam hij is, hebben plaats gehad.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1688
  - number: '1777'
    text: |-
      Bruikleening is eene overeenkomst, waarbij de eene partij aan de andere eene zaak om niet ten gebruike geeft, onder
      voorwaarde dat degene die deze zaak ontvangt, dezelve, na daarvan gebruik te hebben gemaakt, of na eenen bepaalden
      tijd, zal terug geven.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1777
  - number: '1778'
    text: De uitleener blijft eigenaar van de geleende zaak.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1778
  - number: '1780.1'
    text: |-
      De verbintenissen, welke uit de bruiklening voortspruiten, gaan over op de erfgenamen van degene die ter leen
      geeft, onderscheidenlijk zijn echtgenoot of geregistreerde partner in het geval zijn nalatenschap overeenkomstig
      [artikel 13 van Boek 4][ref1] wordt verdeeld, en van hem die ter leen ontvangt.


      [ref1]: https://wetten.overheid.nl/BWBR0002761#Artikel13
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1780
    references:
      - id: ref1
        bwb_id: BWBR0002761
        artikel: '13'
  - number: '1780.2'
    text: |-
      Maar indien men de uitleening gedaan heeft alleen uit aanmerking van dengenen die ter leen ontvangt, en aan
      deszelfs persoon in het bijzonder, kunnen deszelfs erfgenamen het verder genot van de geleende zaak niet blijven
      behouden.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1780
  - number: '1781.1'
    text: |-
      Die iets ter leen ontvangt is gehouden, als een goed huisvader, voor de bewaring en het behoud van de geleende zaak
      te zorgen.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1781
  - number: '1781.2'
    text: |-
      Hij mag daarvan geen ander gebruik maken dan hetwelk de aard der zaak medebrengt, of bij de overeenkomst bepaald
      is.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1781
  - number: '1782'
    text: |-
      Indien de geleende zaak verloren gaat door een toeval, hetwelk degene die dezelve ter leen ontvangen heeft, door
      zijne eigene zaak te gebruiken, had kunnen voorkomen, of indien hij, slechts een van beide kunnende behouden, aan
      de zijne den voorrang heeft gegeven, is hij voor het verlies der andere zaak aansprakelijk.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1782
  - number: '1783'
    text: |-
      Indien de zaak bij het ter leen geven geschat is, komt het verlies van dezelve, al ontstond dat ook door toeval,
      ten laste van dengenen die de zaak ter leen ontvangen heeft, ten ware het tegendeel mogt bedongen zijn.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1783
  - number: '1784'
    text: |-
      Indien de zaak alleen tengevolge van het gebruik waartoe dezelve geleend is, en buiten schuld van den gebruiker, in
      waarde vermindert, is deze wegens die vermindering niet aansprakelijk.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1784
  - number: '1785'
    text: |-
      Indien de gebruiker, om van de geleende zaak gebruik te kunnen maken, eenige onkosten gemaakt heeft, kan hij
      dezelve niet terug vorderen.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1785
  - number: '1786'
    text: |-
      Indien een zaak in bruikleen is gegeven aan twee of meer personen tezamen, zijn zij hoofdelijk verbonden tot
      teruggave daarvan en tot vergoeding van de schade die het gevolg is van een tekortschieten in de nakoming van die
      verplichting, tenzij de tekortkoming aan geen van hen kan worden toegerekend.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1786
  - number: '1787'
    text: |-
      De uitleener kan de geleende zaak niet terug vorderen dan na verloop van den bepaalden tijd, of, bij gebreke eener
      dusdanige bepaling, nadat dezelve tot het gebruik waartoe zij was uitgeleend gediend heeft, of heeft kunnen dienen.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1787
  - number: '1788'
    text: |-
      Indien evenwel de uitleener, gedurende dat tijdsverloop, of voor dat de behoefte van den gebruiker opgehouden
      heeft, de geleende zaak, om dringende en onverwachts opkomende redenen, zelf benoodigd heeft, kan de regter, naar
      gelang der omstandigheden, den gebruiker noodzaken het geleende aan den uitleener terug te geven.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1788
  - number: '1789'
    text: |-
      Indien de gebruiker, gedurende de bruikleening tot behoud der zaak eenige buitengewone noodzakelijke onkosten heeft
      moeten maken, welke zoo dringende waren dat hij daarvan te voren aan den uitleener geene kennis heeft kunnen geven,
      is deze verpligt hem dezelve te vergoeden.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1789
  - number: '1790'
    text: |-
      Indien de ter leen gegevene zaak zoodanige gebreken heeft, dat daardoor aan dengenen die zich van dezelve bedient
      nadeel zoude kunnen worden toegebragt, is de uitleener, zoo hij die gebreken gekend, en daarvan aan den gebruiker
      geene kennis gegeven heeft, voor de gevolgen verantwoordelijk.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1790
  - number: '1791'
    text: |-
      Verbruikleening is eene overeenkomst, waarbij de eene partij aan de andere eene zekere hoeveelheid van verbruikbare
      goederen afgeeft, onder voorwaarde dat de laatstgemelde haar even zoo veel, van gelijke soort en hoedanigheid,
      terug geve.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1791
  - number: '1792'
    text: |-
      Uit krachte dezer verbruikleening, wordt degene die ter leen ontvangt rechthebbende op het geleende goed; en indien
      hetzelve, op welke wijze ook, vergaat, komt dat verlies voor zijne rekening.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1792
  - number: '1793'
    text: |-
      De schuld, uit leening van geld voortspruitende, bestaat alleen in de geldsom die bij de overeenkomst is
      uitgedrukt.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1793
  - number: '1796'
    text: |-
      De uitleener kan het ter leen gegevene niet terug eischen, voordat de tijd, bij de overeenkomst bepaald, verstreken
      is.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1796
  - number: '1797'
    text: |-
      Geene tijdsbepaling gemaakt zijnde, kan de regter, wanneer de uitleener de teruggave vordert, naar gelang der
      omstandigheden, aan dengenen die het goed ter leen ontvangen heeft, eenig uitstel toestaan.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1797
  - number: '1798'
    text: |-
      Indien men is overeengekomen dat hij die een goed ter leen heeft ontvangen dit zal terug geven, wanneer hij daartoe
      in staat zal zijn, zal de regter, naar gelang der omstandigheden, den tijd der teruggave bepalen.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1798
  - number: '1799'
    text: |-
      De bepaling van [artikel 1790][ref1] is op verbruikleening toepasselijk.


      [ref1]: https://wetten.overheid.nl/BWBR0006000#Artikel1790
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1799
    references:
      - id: ref1
        bwb_id: BWBR0006000
        artikel: '1790'
        afdeling: Derde
  - number: '1800'
    text: |-
      Die iets ter leen ontvangt is verpligt hetzelve, in gelijke hoeveelheid en hoedanigheid, en op den bepaalden tijd,
      terug te geven.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1800
  - number: '1801.1'
    text: |-
      Indien hij zich in de onmogelijkheid bevindt om hieraan te voldoen, is hij gehouden de waarde van het geleende te
      betalen, waarbij zal moeten in aanmerking genomen worden de tijd en de plaats, waarop het goed, ten gevolge der
      overeenkomst, had moeten worden terug gegeven.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1801
  - number: '1801.2'
    text: |-
      Indien deze tijd en plaats niet bepaald zijn, moet de voldoening geschieden overeenkomstig de waarde welke het
      geleende goed, ten tijde waarop en ter plaatse alwaar de leening geschied is, gehad heeft.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1801
  - number: '1804'
    text: De hoegrootheid der bij overeenkomst bedongene rente moet in geschrift worden bepaald.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1804
  - number: '1805'
    text: |-
      Indien de uitleener rente bedongen heeft, zonder dat het beloop daarvan bepaald zij, is degene die ter leen
      ontvangen heeft gehouden het beloop der wettelijke rente te voldoen.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1805
  - number: '1806'
    text: |-
      Het bewijs van de betaling der hoofdsom zonder voorbehoud van rente gegeven zijnde, doet de voldoening der rente
      vooronderstellen, en de schuldenaar wordt daarvan bevrijd.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1806
  - number: '1807'
    text: |-
      Het vestigen eener altijddurende rente is eene overeenkomst, waarbij de uitleener interessen bedingt, tegen
      betaling eener hoofdsom welke hij aanneemt niet terug te zullen vorderen.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1807
  - number: '1808.1'
    text: Deze rente is uit haren aard aflosbaar.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1808
  - number: '1808.2'
    text: |-
      Partijen kunnen alleenlijk overeenkomen dat de aflossing niet geschieden zal dan na verloop van eenen zekeren tijd,
      welke niet langer dan voor tien jaren mag gesteld worden, of zonder dat zij den schuldeischer vooraf verwittigd
      hebben op eenen zekeren, door hen bevorens vastgestelden termijn, welke echter den tijd van een jaar niet zal mogen
      te boven gaan.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1808
  - number: '1809'
    text: 'De schuldenaar eener altijddurende rente kan tot de aflossing genoodzaakt worden:'
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1809
  - number: 1809.1°
    text: Indien hij niets betaald heeft op de gedurende twee achtereenvolgende jaren verschuldigde renten;
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1809
  - number: 1809.2°
    text: Indien hij verzuimt aan den geldschieter de bij de overeenkomst beloofde zekerheid te bezorgen;
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1809
  - number: 1809.3°
    text: |-
      Indien hij in staat van faillissement is verklaard of ten aanzien van hem de schuldsaneringsregeling natuurlijke
      personen van toepassing is verklaard.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1809
  - number: '1810'
    text: |-
      In de twee eerste gevallen, bij het vorige artikel vermeld, kan de schuldenaar zich van de verpligting tot
      aflossing ontheffen, indien hij binnen de twintig dagen, te rekenen van de geregtelijke aanmaning, alle de
      verschenen termijnen betaalt of de beloofde zekerheid stelt.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1810
  - number: '1811.1'
    text: |-
      Eene kans-overeenkomst is eene handeling, waarvan de uitkomsten, met betrekking tot voordeel en nadeel, het zij
      voor alle de partijen, het zij voor eenige derzelve, van eene onzekere gebeurtenis afhangen.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1811
  - number: '1811.2'
    text: |-
      Van dien aard zijn: De overeenkomst van verzekering; Lijfrenten; Spel en weddingschap; Overeenkomsten tot
      verrekening van een koers- of prijsverschil.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1811
  - number: '1811.3'
    text: |-
      De eerste overeenkomst wordt bij het [Wetboek van Koophandel][ref1] geregeld.


      [ref1]: https://wetten.overheid.nl/BWBR0001838
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1811
    references:
      - id: ref1
        bwb_id: BWBR0001838
  - number: '1813'
    text: |-
      Lijfrente kan worden gevestigd, het zij op het lijf des geldschieters, of van hem wien men daarvan het genot geeft,
      het zij op dat van eenen derde, ofschoon deze daarvan geen genot hebbe.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1813
  - number: '1814'
    text: Dezelve kan gevestigd worden op het lijf van een of meer personen.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1814
  - number: '1817'
    text: Lijfrente kan tot zoodanig beloop van renten gesteld worden, als partijen goedvinden te bepalen.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1817
  - number: '1819'
    text: |-
      Indien de schuldenaar met betaling van verschenen lijfrente in verzuim is, kan de renteheffer vorderen dat
      zekerheid wordt gesteld over de te vervallen rente.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1819
  - number: '1822.1'
    text: |-
      De gerechtigde tot een lijfrente heeft slechts een verkregen regt op de lijfrente, naar evenredigheid van het getal
      der dagen welke degene geleefd heeft, op wiens lijf de rente is gevestigd.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1822
  - number: '1822.2'
    text: |-
      Indien echter de overeenkomst medebrengt dat de rente vooruit moet worden betaald, is het regt op den termijn die
      betaald had behooren te zijn verkregen van den dag waarop de betaling had moeten geschieden.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1822
  - number: '1824'
    text: |-
      De rentheffer kan de verschenen rente niet vorderen, dan door te doen blijken van het leven van hem op wien de
      lijfrente gevestigd is.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1824
  - number: '1825'
    text: De wet staat geene regtsvordering toe, ter zake van eene schuld uit spel of uit weddingschap voortgesproten.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1825
  - number: '1826.1'
    text: |-
      Onder de hier-boven staande bepaling zijn echter niet begrepen die spelen welke geschikt zijn tot
      ligchaamsoefening, als het schermen, wedloopen en dergelijke.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1826
  - number: '1826.2'
    text: Niettemin kan de regter den eisch ontzeggen of verminderen, wanneer hem de som overmatig toeschijnt.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1826
  - number: '1827'
    text: Van de vorige twee artikelen kan op generlei wijze worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1827
  - number: '1828'
    text: |-
      In geen geval, kan hij die het verlorene vrijwillig betaald heeft hetzelve terug eischen, ten ware, van den kant
      van dengenen die gewonnen heeft, bedrog, list of opligting hebbe plaats gehad.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1828
  - number: '2031.1'
    text: |-
      De [Algemene termijnenwet][ref1] is niet van toepassing op de termijnen, gesteld in de
      [artikelen 280, onder b][ref2], en [281, tweede lid van Boek 1][ref3] en [252 van Boek 3][ref4], alsmede in
      [titel 10 van Boek 7][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0002448
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel280
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel281
      [ref4]: https://wetten.overheid.nl/BWBR0005291#Artikel252
      [ref5]: https://wetten.overheid.nl/BWBR0005290
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel2031
    references:
      - id: ref1
        bwb_id: BWBR0002448
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '280'
      - id: ref3
        bwb_id: BWBR0002656
        artikel: '281'
      - id: ref4
        bwb_id: BWBR0005291
        artikel: '252'
      - id: ref5
        bwb_id: BWBR0005290
  - number: '2031.2'
    text: |-
      Onder algemeen erkende feestdagen worden in dit wetboek verstaan de in
      [artikel 3 van de Algemene termijnenwet][ref1] als zodanig genoemde en de bij of krachtens dat artikel daarmede
      gelijkgestelde dagen.


      [ref1]: https://wetten.overheid.nl/BWBR0002448#Artikel3
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel2031
    references:
      - id: ref1
        bwb_id: BWBR0002448
        artikel: '3'
