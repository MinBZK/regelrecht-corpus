bwb_id: BWBR0006000
url: https://wetten.overheid.nl/BWBR0006000/2003-01-01
articles:
  - number: '1576.1'
    text: |-
      Koop en verkoop op afbetaling is de koop en verkoop, waarbij partijen overeenkomen dat de koopprijs wordt betaald
      in termijnen, waarvan twee of meer verschijnen, nadat de verkochte zaak aan de koper is afgeleverd.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1576
  - number: '1576.2'
    text: De overeenkomst is niet van kracht voordat partijen de door de koper te betalen prijs hebben bepaald.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1576
  - number: '1576.3'
    text: |-
      Alle overeenkomsten, welke dezelfde strekking hebben, onder welke vorm of welke benaming ook aangegaan, worden als
      koop en verkoop op afbetaling aangemerkt.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1576
  - number: '1576.4'
    text: 'Koop en verkoop op afbetaling in de zin der wet zijn niet de overeenkomsten welke betrekking hebben op:'
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1576
  - number: 1576.4.a
    text: onroerende zaken,
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1576
  - number: 1576.4.b
    text: |-
      zeeschepen waarvan de bruto-inhoud tenminste twintig kubieke meters of de bruto-tonnage tenminste 6 bedraagt, die
      teboekstaan of die teboekgesteld kunnen worden in het in [artikel 193 van Boek 8][ref1] genoemde register,


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel193
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1576
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '193'
  - number: 1576.4.c
    text: |-
      binnenschepen die teboekstaan of die teboekgesteld moeten worden doch niet teboekstaan, in het in
      [artikel 783 van Boek 8][ref1] genoemde register,


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel783
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1576
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '783'
  - number: 1576.4.d
    text: |-
      luchtvaartuigen teboekstaand in het register genoemd in [titel 15 van Boek 8][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005034
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1576
    references:
      - id: ref1
        bwb_id: BWBR0005034
  - number: '1576.5'
    text: |-
      Het in deze titel bepaalde vindt overeenkomstige toepassing op vermogensrechten, niet zijnde registergoederen, voor
      zover dat in overeenstemming is met de aard van het recht.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1576
  - number: 1576a
    text: Van de bepalingen van deze titel mag slechts worden afgeweken, indien en voor zoover dit daaruit blijkt.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1576a
  - number: 1576b.1
    text: |-
      Bedingen, waarbij of krachtens welke den schuldenaar, voor het geval hij eenige verplichting uit de overeenkomst
      niet vervult, de betaling van zekere som als schadevergoeding of eenige straf wordt of kan worden opgelegd, kunnen
      alleen bij schriftelijk aangegane overeenkomst worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1576b
  - number: 1576b.2
    text: |-
      Indien de overeengekomen of opgelegde schadevergoeding of straf den rechter bovenmatig voorkomt, kan deze haar, ten
      aanzien van het hem voorgelegde geval, verminderen of opheffen.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1576b
  - number: 1576c.1
    text: |-
      Vervroegde opeischbaarheid, als straf wegens nalatigheid van den kooper in het betalen van termijnen, kan alleen
      bedongen worden voor het geval de achterstand bedraagt, ten aanzien van één termijn tenminste een tiende, of ten
      aanzien van meer termijnen gezamenlijk tenminste een twintigste deel van den geheelen koopprijs.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1576c
  - number: 1576c.2
    text: |-
      Onder geheelen koopprijs wordt verstaan de som van alle betalingen, waartoe de kooper bij regelmatige nakoming van
      de overeenkomst gehouden is.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1576c
  - number: 1576c.3
    text: |-
      Het [tweede lid van artikel 1576b][ref1] is hier niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006000#Artikel1576b
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1576c
    references:
      - id: ref1
        bwb_id: BWBR0006000
        artikel: 1576b
        afdeling: '1'
  - number: 1576d
    text: |-
      Op eenig beding, als bedoeld in de voorafgaande twee artikelen, kan wegens niet tijdige nakoming beroep alleen
      worden gedaan, indien de schuldenaar, na in gebreke te zijn gesteld, nalatig blijft om zijne verplichtingen na
      te komen.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1576d
  - number: 1576e.1
    text: De kooper is steeds bevoegd tot vervroegde betaling van één of meer eerstvolgende termijnen van den koopprijs.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1576e
  - number: 1576e.2
    text: |-
      In geval van vervroegde betaling ineens van het geheele nog verschuldigde bedrag heeft hij recht op een aftrek,
      berekend naar vijf ten honderd ’s jaars over elken daarbij vervroegd betaalden termijn.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1576e
  - number: 1576e.3
    text: Van de bepalingen van dit artikel kan ten voordeele van den kooper door partijen worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1576e
  - number: 1576f.1
    text: |-
      Overdracht, inpandgeving of elke andere handeling, waardoor de kooper aan den verkooper of aan een derde eenig
      recht toekent op zijn loon, pensioen of andere periodieke inkomsten wegens arbeidsovereenkomst, kan ter zake van
      koop en verkoop op afbetaling, behalve voor opeischbare verplichtingen, alleen geschieden voor betalingen, waartoe
      de kooper bij regelmatige nakoming van de overeenkomst zal gehouden zijn, en voor de kosten.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1576f
  - number: 1576f.2
    text: |-
      De handeling heeft alsdan geene werking dan naar gelang bedoelde termijnen verschijnen overeenkomstig een bij
      schriftelijke overeenkomst vastgelegd plan van regelmatige afbetaling of naar gelang er kosten vallen, telkens tot
      het beloop daarvan.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1576f
  - number: 1576f.3
    text: |-
      Bovendien is vereischt, dat de kooper, na in gebreke te zijn gesteld, nalatig is gebleven. Alleen de termijnen en
      kosten, waarover de ingebrekestelling is geschied, en die, welke daarna verschijnen, komen in aanmerking bij het
      bepalen van bedoelde werking.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1576f
  - number: 1576f.4
    text: |-
      Ten aanzien van hem, die de uitkeering wegens arbeidsovereenkomst verschuldigd is, heeft de handeling geen gevolg,
      alvorens de ingebrekestelling van den kooper en het plan van regelmatige afbetaling met opgave van hetgeen daarop
      voldaan is en van de gevorderde kosten schriftelijk te zijner kennis zijn gebracht, dan wel schriftelijk door hem
      zijn erkend. Betalingen, dienovereenkomstig te goeder trouw door hem gedaan, bevrijden hem tegenover den kooper.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1576f
  - number: 1576g
    text: |-
      Volmacht tot invordering van loon, pensioen of andere periodieke vorderingen ter zake van eene arbeidsovereenkomst,
      onder welken vorm of welke benaming ook, door den kooper verleend, is steeds herroepelijk.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1576g
  - number: 1576h.1
    text: |-
      Huurkoop is de koop en verkoop op afbetaling, waarbij partijen overeenkomen, dat de verkochte zaak niet door enkele
      aflevering in eigendom overgaat, maar pas door vervulling van de opschortende voorwaarde van algehele betaling van
      wat door de koper uit hoofde van de koopovereenkomst verschuldigd is.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1576h
  - number: 1576h.2
    text: |-
      Alle overeenkomsten, welke dezelfde strekking hebben, hetzij als huur en verhuur, hetzij onder anderen vorm of
      andere benaming aangegaan, worden als huurkoop aangemerkt.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1576h
  - number: 1576h.3
    text: |-
      Onder huurkoop is begrepen de overeenkomst, waarbij ter zake van een koop en verkoop een derde, die den eigendom
      der zaak verwerft, aan den kooper crediet verleent des dat het geheel van handelingen de strekking van huurkoop
      erlangt.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1576h
  - number: 1576i.1
    text: |-
      Huurkoop wordt aangegaan bij authentieke of onderhandsche akte, welke voldoet aan de bepalingen van
      [artikel 1576j][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006000#Artikel1576j
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1576i
    references:
      - id: ref1
        bwb_id: BWBR0006000
        artikel: 1576j
        afdeling: '2'
  - number: 1576i.2
    text: |-
      Hetzelfde geldt voor overeenkomsten, welke bestaande overeenkomsten zoodanig wijzigen of aanvullen, dat daardoor
      huurkoop zou ontstaan.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1576i
  - number: 1576i.3
    text: |-
      Wordt de overeenkomst aangegaan bij onderhandsche akte, dan moet deze, zoo de kooper dit verlangt, in dubbel worden
      opgemaakt.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1576i
  - number: 1576i.4
    text: |-
      Het dubbel, of zoo dit niet is opgemaakt, een authentiek of door den verkooper onderteekend afschrift, wordt zoo
      spoedig mogelijk na het sluiten van de overeenkomst door den verkooper aan den kooper verstrekt.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1576i
  - number: 1576i.5
    text: Verder afschrift kan de kooper te allen tijde tegen betaling van de kosten vorderen.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1576i
  - number: 1576j.1
    text: |-
      De akte van huurkoop moet duidelijk vermelden den geheelen koopprijs, als bedoeld in [artikel 1576c][ref1], het
      plan van regelmatige afbetaling, als bedoeld in [artikel 1576f][ref2], en de bedingen betreffende voorbehoud en
      overgang van eigendom.


      [ref1]: https://wetten.overheid.nl/BWBR0006000#Artikel1576c
      [ref2]: https://wetten.overheid.nl/BWBR0006000#Artikel1576f
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1576j
    references:
      - id: ref1
        bwb_id: BWBR0006000
        artikel: 1576c
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0006000
        artikel: 1576f
        afdeling: '1'
  - number: 1576j.2
    text: |-
      In de gevallen, bedoeld in het [tweede en het derde lid van artikel 1576h][ref1], treden de overeenkomstige
      gegevens hiervoor in de plaats.


      [ref1]: https://wetten.overheid.nl/BWBR0006000#Artikel1576h
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1576j
    references:
      - id: ref1
        bwb_id: BWBR0006000
        artikel: 1576h
        afdeling: '2'
  - number: 1576j.3
    text: |-
      Ontbreekt eene akte, welke voldoet aan genoemde voorwaarden, dan geldt de overeenkomst niet als huurkoop, doch
      wordt de koop en verkoop op afbetaling geacht te zijn gesloten zonder beding, dat de verkochte zaak niet door
      enkele aflevering aan den kooper overgaat.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1576j
  - number: 1576k
    text: |-
      Ter zake van huurkoop kan de koper, indien hij bij het aangaan van de overeenkomst werkelijke woonplaats in een
      gemeente in Nederland heeft, geen woonplaats kiezen, behalve voor het geval dat hij te eniger tijd geen bekende
      werkelijke woonplaats in die gemeente mocht hebben.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1576k
  - number: 1576l.1
    text: |-
      De verkoper is verplicht de verkochte zaak aan de koper te leveren door aan deze de macht over de zaak te
      verschaffen. Op zijn verdere verplichtingen zijn de bepalingen van de [eerste][ref1], [tweede][ref2] en
      [derde afdeling van titel 1 van Boek 7][ref3] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Afdeling1
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Afdeling2
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Afdeling3
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1576l
    references:
      - id: ref1
        bwb_id: BWBR0005290
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005290
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0005290
        afdeling: '3'
  - number: 1576l.2
    text: Vervreemding door den verkooper van de in huurkoop afgeleverde zaak werkt niet ten nadeele van den huurkooper.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1576l
  - number: 1576m.1
    text: |-
      De kooper heeft van de zaak, die hij krachtens huurkoop onder zich heeft, het genot, ook voordat hij den eigendom
      daarvan verkrijgt.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1576m
  - number: 1576m.2
    text: Hij mag de zaak gebruiken overeenkomstig hare bestemming.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1576m
  - number: 1576m.3
    text: Hare gedaante of inrichting mag hij niet veranderen, noch de zaak verhuren of zijn genot aan anderen afstaan.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1576m
  - number: 1576m.4
    text: |-
      De zaak is voor risico van de koper van de aflevering af. De [leden 2, 3 en 4 van artikel 10 van Boek 7][ref1] zijn
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel10
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1576m
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '10'
  - number: 1576m.5
    text: |-
      Van deze bepalingen kan bij overeenkomst worden afgeweken. Van lid 4 kan echter bij een consumentenkoop niet ten
      nadele van de koper worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1576m
  - number: 1576n.1
    text: |-
      De vruchten, welke de zaak tijdens het genot oplevert, behooren den kooper toe. Voorzoover bij de akte van huurkoop
      hiervan is afgeweken, heeft de kooper niettemin het genot der vruchten, indien niet anders is overeengekomen.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1576n
  - number: 1576n.2
    text: |-
      De burgerlijke vruchten worden, voor zoover niet anders is overeengekomen, gerekend van dag tot dag verkregen te
      worden en den kooper toe te behooren, naarmate zijn genot duurt, welk ook het tijdstip moge wezen, waarop dezelve
      betaalbaar zijn.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1576n
  - number: 1576n.3
    text: |-
      De verplichting tot teruggave van de in huurkoop afgeleverde zaak omvat die tot teruggave van de vruchten, welke
      den verkooper toebehooren.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1576n
  - number: 1576q
    text: |-
      Ontbinding van huurkoop, of teruggave van eene in huurkoop gehouden zaak krachtens daartoe gemaakt beding, kan,
      wegens niet tijdige nakoming door den kooper van zijne verplichtingen, niet worden ingeroepen of gevorderd, tenzij
      de kooper, na in gebreke te zijn gesteld, nalatig blijft om zijne verplichtingen na te komen.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1576q
  - number: 1576r
    text: |-
      Wanneer de verkoper ontbinding van de overeenkomst of teruggave van de in huurkoop afgeleverde zaak kan vorderen,
      kan de kantonrechter, indien de verkoper zulks verzoekt en daarbij redelijk belang heeft, bij voorlopige
      voorziening teruggave bij voorraad bevelen.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1576r
  - number: 1576s
    text: |-
      Indien, wegens het niet nakomen door den kooper van zijne verplichtingen, de in huurkoop afgeleverde zaak krachtens
      daartoe gemaakt beding wordt teruggenomen, heeft dit ontbinding van de overeenkomst tot gevolg, tenzij tusschen
      partijen anders overeengekomen is.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1576s
  - number: 1576t
    text: |-
      Indien bij ontbinding van de overeenkomst wegens het niet nakomen door den kooper van zijne verplichtingen
      de verkooper in beteren vermogenstoestand zou geraken dan bij het in stand blijven van de overeenkomst, vindt
      volledige verrekening plaats.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1576t
  - number: 1576u
    text: |-
      Indien bij ontbinding der overeenkomst de kooper recht mocht hebben op eenige terugbetaling, kan hij door den
      rechter worden gemachtigd de zaak, die hij terug moet geven, onder zich te houden, totdat het hem verschuldigde
      wordt betaald of de verkooper daarvoor voldoende zekerheid heeft gesteld.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1576u
  - number: 1576v.1
    text: |-
      Indien wegens niet betaling van verschenen termijnen de in huurkoop afgeleverde zaak is teruggenomen zonder
      voorafgaande rechterlijke tusschenkomst, kan de kooper gedurende veertien dagen na de terugneming de zaak inlossen,
      door betaling van de verschenen termijnen en de verschuldigde rente, boeten en kosten.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1576v
  - number: 1576v.2
    text: Mocht de overeenkomst zijn ontbonden, dan wordt dit door de inlossing ongedaan gemaakt.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1576v
  - number: 1576v.3
    text: |-
      Bij herhaling van het in het eerste lid genoemde geval heeft de kooper het recht van inlossing alleen onder
      volledige betaling.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1576v
  - number: 1576v.4
    text: |-
      Aan de vordering tot inlossing, anders dan onder volledige betaling, behoeft de verkooper niet te voldoen, indien
      omstandigheden aanwezig zijn, die tot toepassing van [artikel 1576r][ref1] aanleiding zouden geven.


      [ref1]: https://wetten.overheid.nl/BWBR0006000#Artikel1576r
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1576v
    references:
      - id: ref1
        bwb_id: BWBR0006000
        artikel: 1576r
        afdeling: '2'
  - number: 1576v.5
    text: Van de bepalingen van dit artikel kan ten voordeele van den kooper door partijen worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1576v
  - number: 1576w
    text: |-
      In het vonnis, waarbij de verplichting tot teruggave van eene in huurkoop afgeleverde zaak wordt vastgesteld of de
      overeenkomst wordt ontbonden, kan een bevel tot teruggave worden opgenomen.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1576w
  - number: 1576x.1
    text: |-
      Bij het vonnis, dat bevel tot teruggave uit kracht van huurkoop inhoudt, kan de geldswaarde der terug te geven zaak
      worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1576x
  - number: 1576x.2
    text: In dat geval kan de tenuitvoerlegging ook door uitwinning geschieden.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1576x
  - number: '1584.1'
    text: |-
      Huur en verhuur is eene overeenkomst, waarbij de eene partij zich verbindt om de andere het genot eener zaak te
      doen hebben, gedurende eenen bepaalden tijd en tegen eenen bepaalden prijs, welken de laatstgemelde aanneemt te
      betalen.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1584
  - number: '1584.2'
    text: Men kan allerlei soort van zaken, het zij onroerende, het zij roerende, verhuren.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1584
  - number: '1584.3'
    text: |-
      De pachtovereenkomst wordt niet onder de overeenkomst van huur en verhuur begrepen. Zij wordt bij afzonderlijke
      wet geregeld.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1584
  - number: '1585'
    text: |-
      De bepalingen van deze en de volgende afdeling zijn mede van toepassing op de huur van vermogensrechten, voor zover
      de strekking van die bepalingen of de aard van het recht zich daartegen niet verzet.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1585
  - number: '1586'
    text: |-
      De verhuurder is, door den aard van de overeenkomst, en zonder dat daartoe eenig bijzonder beding vereischt wordt,
      verpligt:
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1586
  - number: 1586.1°
    text: Om het verhuurde aan den huurder ter beschikking te stellen;
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1586
  - number: 1586.2°
    text: Om hetzelve te onderhouden in zoodanigen staat, dat het tot het gebruik waartoe het verhuurd is dienen kan;
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1586
  - number: 1586.3°
    text: Om den huurder het rustig genot daarvan te doen hebben, zoo lang de huur duurt.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1586
  - number: '1587.1'
    text: |-
      De verhuurder is gehouden de verhuurde zaak in alle opzichten in goede staat van onderhoud ter beschikking te
      stellen.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1587
  - number: '1587.2'
    text: |-
      Hij moet daaraan, gedurende den huurtijd, alle reparatien laten doen welke noodzakelijk mogten worden, met
      uitzondering van degene tot welke de huurder verpligt is.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1587
  - number: '1588.1'
    text: |-
      De verhuurder moet den huurder instaan voor alle gebreken van de verhuurde zaak, welke het gebruik daarvan
      verhinderen, al mogt ook de verhuurder dezelve tijdens het doen der verhuring niet gekend hebben.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1588
  - number: '1588.2'
    text: |-
      Indien door die gebreken eenig nadeel voor den huurder ontstaat, is de verhuurder gehouden hem deswege schadeloos
      te stellen.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1588
  - number: '1589'
    text: |-
      Indien, gedurende den huurtijd, de verhuurde zaak door eenig toeval geheel en al vergaan is, vervalt de huur-
      overeenkomst van regtswege. Indien de zaak slechts ten deele vergaan is, heeft de huurder de keus om, naar gelang
      der omstandigheden, of vermindering van de huurprijs te vorderen of de huurovereenkomst te ontbinden; doch hij kan,
      in geen dier beide gevallen, aanspraak op schadevergoeding maken.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1589
  - number: '1590'
    text: De verhuurder mag, gedurende den huurtijd, de gedaante of inrigting van de verhuurde zaak niet veranderen.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1590
  - number: '1591.1'
    text: |-
      Indien, gedurende den huurtijd, de verhuurde zaak dringende reparatien noodig heeft, welke niet tot na het eindigen
      der huur kunnen worden uitgesteld, moet de huurder dezelve gedoogen, welke ongemakken hem ook hierdoor worden
      veroorzaakt, en hoewel hij ook, gedurende het doen dier reparatien van een gedeelte van de verhuurde zaak verstoken
      zij.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1591
  - number: '1591.2'
    text: |-
      Doch indien deze reparatien langer dan veertig dagen duren, zal de huurprijs verminderd worden naar evenredigheid
      van den tijd, en van het gedeelte van de verhuurde zaak, waarvan de huurder zal zijn verstoken geweest.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1591
  - number: '1591.3'
    text: |-
      Indien de reparatien van dien aard zijn dat daardoor het gehuurde, hetgeen den huurder en zijn huisgezin ter
      bewoning noodzakelijk is, onbewoonbaar wordt, kan dezelve de huur doen verbreken.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1591
  - number: '1592'
    text: |-
      De verhuurder is niet verpligt den huurder te waarborgen tegen de belemmeringen welke hem derden, door
      feitelijkheden, in zijn genot toebrengen, zonder overigens eenig regt op het gehuurde te beweren; behoudens het
      regt van den huurder om dezelve uit eigen hoofde te vervolgen.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1592
  - number: '1593'
    text: |-
      Indien, daarentegen, de huurder in deszelfs genot is gestoord geworden, ten gevolge eener regtsvordering welke tot
      den eigendom van de zaak betrekking heeft, heeft hij het regt om eene geëvenredigde vermindering van den huurprijs
      te vorderen, mits van die stoornis of belemmering aan den eigenaar behoorlijk kennis gegeven zij.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1593
  - number: '1594'
    text: |-
      Indien degenen die de feitelijkheden gepleegd hebben enig recht ten aanzien van de verhuurde zaak beweren te
      hebben, of indien de huurder zelf in regten gedagvaard is om tot ontruiming van het geheel of van een gedeelte van
      de zaak verwezen te worden, of om de uitoefening van eenige erfdienstbaarheid of een ander recht ten aanzien van de
      zaak te gedoogen, moet hij den verhuurder daarvan beteekening doen, en hij kan denzelven tot vrijwaring oproepen.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1594
  - number: '1595.1'
    text: |-
      De huurder mag, indien hem dit vermogen niet is toegestaan, de zaak niet weder verhuren, noch zijne huur aan een
      ander afstaan.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1595
  - number: '1595.2'
    text: |-
      Indien het gehuurde in een huis of in eene woning bestaat, welke de huurder zelf bewoont, kan hij een gedeelte
      daarvan, onder zijne verantwoordelijkheid, aan een ander verhuren, indien hem dat vermogen niet bij de overeenkomst
      is ontzegd geworden.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1595
  - number: '1596'
    text: 'De huurder is tot twee hoofdverpligtingen gehouden:'
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1596
  - number: 1596.1°
    text: |-
      Om het gehuurde als een goed huurder te gebruiken, en overeenkomstig de bestemming welke daaraan bij de huur-
      overeenkomst gegeven is, of volgens die welke, bij gebreke van overeenkomst daaromtrent, naar gelang der
      omstandigheden voorondersteld wordt;
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1596
  - number: 1596.2°
    text: Om den huurprijs op de bepaalde termijnen te voldoen.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1596
  - number: '1597'
    text: |-
      De verhuurder kan de overeenkomst op de voet van [artikel 267 van Boek 6][ref1] ontbinden op de grond
      dat door gedragingen in het gehuurde de openbare orde is verstoord en het gehuurde deswege op grond van
      [artikel 174a van de Gemeentewet][ref2] dan wel op grond van een verordening als bedoeld in [artikel 174][ref3]
      van die wet is gesloten of door gedragingen in zodanig gebouw in strijd met [artikel 2 ][ref4]of
      [3 van de Opiumwet][ref5] is gehandeld en het desbetreffende gebouw deswege op grond van [artikel 13b][ref6] van
      die wet is gesloten. De [artikelen 1623n][ref7] en [1636][ref8] zijn niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel267
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel174a
      [ref3]: https://wetten.overheid.nl/BWBR0005416#Artikel174
      [ref4]: https://wetten.overheid.nl/BWBR0001941#Artikel2
      [ref5]: https://wetten.overheid.nl/BWBR0001941#Artikel3
      [ref6]: https://wetten.overheid.nl/BWBR0001941#Artikel13b
      [ref7]: https://wetten.overheid.nl/BWBR0006000#Artikel1623n
      [ref8]: https://wetten.overheid.nl/BWBR0006000#Artikel1636
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1597
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '267'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: 174a
      - id: ref3
        bwb_id: BWBR0005416
        artikel: '174'
      - id: ref4
        bwb_id: BWBR0001941
        artikel: '2'
      - id: ref5
        bwb_id: BWBR0001941
        artikel: '3'
      - id: ref6
        bwb_id: BWBR0001941
        artikel: 13b
      - id: ref7
        bwb_id: BWBR0006000
        artikel: 1623n
        afdeling: Vierde
      - id: ref8
        bwb_id: BWBR0006000
        artikel: '1636'
        afdeling: Vijfde
  - number: '1598'
    text: |-
      Indien tusschen den verhuurder en den huurder eene beschrijving van het verhuurde is opgemaakt, is laatstgemelde
      gehouden de zaak in dien staat weder op te leveren, waarin hij deze, volgens die beschrijving, heeft aanvaard; met
      uitzondering van hetgeen door ouderdom of door onvermijdelijke toevallen vergaan of van waarde verminderd is.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1598
  - number: '1599'
    text: |-
      Indien geene beschrijving is opgemaakt, wordt de huurder, ten aanzien van het onderhoud, hetwelk ten laste van
      huurders komt, behoudens tegenbewijs, voorondersteld het gehuurde in goeden staat te hebben aanvaard, en moet hij
      hetzelve in dien staat terug geven.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1599
  - number: '1600.1'
    text: |-
      De huurder is aansprakelijk voor schade aan de verhuurde zaak die is ontstaan door een hem toe te rekenen
      tekortschieten in de nakoming van een verplichting uit de huurovereenkomst.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1600
  - number: '1600.2'
    text: Alle schade behalve brandschade wordt vermoed daardoor te zijn ontstaan.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1600
  - number: '1602'
    text: |-
      De huurder is jegens de verhuurder op gelijke wijze als voor eigen gedragingen aansprakelijk voor de gedragingen
      van hen die met zijn goedvinden het gehuurde gebruiken of zich met zijn goedvinden daarop bevinden.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1602
  - number: '1603'
    text: |-
      De huurder mag, bij ontruiming van de verhuurde zaak, afbreken en naar zich nemen al hetgeen hij daaraan, op zijne
      kosten, heeft doen maken, mits zulks gedaan worde zonder beschadiging van de zaak.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1603
  - number: '1605'
    text: |-
      Wanneer er geschil ontstaat over den prijs eener verhuring, bij monde aangegaan, waarvan de uitvoering begonnen
      is, en er geene kwijting aanwezig is, moet de verhuurder op zijnen eed geloofd worden, ten ware de huurder mogt
      verkiezen den huurprijs door deskundigen te doen begrooten.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1605
  - number: '1606'
    text: |-
      Indien de huur bij geschrift is aangegaan, houdt dezelve van regtswege op, wanneer de bepaalde tijd verstreken is,
      zonder dat daartoe eene opzegging vereischt worde.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1606
  - number: '1607'
    text: |-
      Indien de huur zonder geschrift is aangegaan, houdt dezelve op den bepaalden tijd niet op, dan voor zoo verre de
      eene partij aan de andere de huur heeft opgezegd, met inachtneming der termijnen welke het plaatselijk gebruik
      medebrengt.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1607
  - number: '1608'
    text: |-
      Wanneer de eene partij aan de andere eene opzegging van huur heeft beteekend, kan de huurder, hoewel in het genot
      blijvende, zich niet beroepen op eene stilzwijgende wederinhuring.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1608
  - number: '1609'
    text: |-
      Indien, na het eindigen van eene verhuring bij geschrifte aangegaan, de huurder in het genot is gebleven en
      gelaten, ontstaat daardoor eene nieuwe huur, waarvan de gevolgen geregeld worden bij de artikelen, tot mondelinge
      verhuringen betrekkelijk.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1609
  - number: '1610'
    text: |-
      In het geval der twee voorgaande artikelen, strekt zich de borgtogt, voor de huur gesteld, niet uit tot de
      verpligtingen die uit de verlenging der huur ontstaan.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1610
  - number: '1611'
    text: De huur-overeenkomst gaat geenszins te niet door den dood van den verhuurder, noch door dien van den huurder.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1611
  - number: '1612.1'
    text: |-
      Door verkoop van het verhuurde wordt eene te voren aangegane huur niet verbroken, ten ware dit bij de verhuring
      mogt voorbehouden zijn.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1612
  - number: '1612.2'
    text: |-
      Bij zoodanig voorbehoud, kan de huurder, zonder uitdrukkelijk beding geene aanspraak op vergoeding maken, maar met
      dat laatste beding, is hij niet tot ontruiming van het gehuurde verpligt, zoo lang de verschuldigde vergoeding niet
      is gekweten.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1612
  - number: '1614'
    text: |-
      Een kooper die gebruik wil maken van de bevoegdheid, bij de huur- overeenkomst voorbehouden om, ingeval van
      verkoop, den huurder tot de ontruiming van het gehuurde te noodzaken, is verpligt den huurder zoodanigen tijd te
      voren te waarschuwen, als het plaatselijk gebruik tot het doen van opzeggingen medebrengt.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1614
  - number: '1615'
    text: |-
      De verhuurder kan de huur niet doen ophouden door te verklaren dat hij de gehuurde zaak zelf wil betrekken, ten
      ware het tegendeel mogt bedongen zijn.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1615
  - number: '1616'
    text: |-
      Indien men bij de huur-overeenkomst is overeengekomen dat de verhuurder de bevoegdheid zoude hebben om het
      verhuurde huis of andere onroerende zaak zelf te betrekken, is hij verpligt vooraf eene opzegging te doen
      beteekenen, zoo veel tijd te voren, als bij [artikel 1614][ref1] is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0006000#Artikel1614
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1616
    references:
      - id: ref1
        bwb_id: BWBR0006000
        artikel: '1614'
        afdeling: Tweede
  - number: '1619.1'
    text: Geringe en dagelijksche reparatien zijn voor rekening van den huurder.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1619
  - number: '1619.2'
    text: |-
      Bij gebreke van overeenkomst, worden als zoodanig aangemerkt reparatien aan winkelkasten, de sluiting der luiken
      of blinden, de binnensloten, de vensterglazen, zoo binnen als buiten ’s huis, en al hetgeen verder door het
      plaatselijk gebruik daaronder begrepen wordt.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1619
  - number: '1619.3'
    text: |-
      Niettemin komen die reparatien ten laste van den verhuurder, indien zij door den vervallen toestand van het
      verhuurde of door overmagt zijn noodzakelijk geworden.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1619
  - number: '1620.1'
    text: |-
      Het schoonhouden van putten, regenbakken en sekreten komt ten laste van den verhuurder, indien het tegendeel niet
      bedongen is.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1620
  - number: '1620.2'
    text: Het schoonhouden der schoorsteenen komt, bij gebreke van beding, ten laste van den huurder.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1620
  - number: '1621'
    text: |-
      De huur van meubelen, om een geheel huis, eene geheele woning, een winkel, of eenig ander vertrek, daarmede te
      stofferen, wordt gehouden voor zoo lang te zijn aangegaan, als de huizen, woningen, winkels of vertrekken, volgens
      plaatselijk gebruik, doorgaans verhuurd worden.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1621
  - number: '1622.1'
    text: |-
      De huur van gestoffeerde kamers wordt gehouden bij het jaar te zijn aangegaan, wanneer dezelve is aangegaan voor
      eene zekere som in het jaar; Bij de maand, wanneer dezelve is aangegaan tegen eene bepaalde som in de maand; Bij
      den dag, wanneer dezelve is aangegaan tegen eene bepaalde som voor iederen dag.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1622
  - number: '1622.2'
    text: |-
      Indien niet blijkt dat de huur voor eene zekere som bij het jaar, bij de maand, of voor iederen dag, is aangegaan,
      wordt dezelve geacht volgens plaatselijk gebruik te zijn gesloten.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1622
  - number: '1623'
    text: |-
      Indien de huurder van een huis of vertrek, na het eindigen van den huurtijd, bij schriftelijke overeenkomst
      bepaald, in het bezit van het gehuurde blijft, zonder dat zich de verhuurder daartegen verzet, wordt hij geacht het
      verhuurde op dezelfde voorwaarden te blijven behouden, voor den tijd welken het plaatselijk gebruik medebrengt, en
      kan hij het verhuurde niet verlaten, noch daaruit gezet worden, dan na eene tijdige opzegging, overeenkomstig het
      plaatselijk gebruik gedaan.
    url: https://wetten.overheid.nl/BWBR0006000/2003-01-01#Artikel1623
  - number: 1623a.1
    text: |-
      De volgende bepalingen van deze afdeling zijn uitsluitend van toepassing op de overeenkomst van huur en verhuur
      van woonruimte, met uitzondering van die, welke een gebruik van woonruimte betreft dat naar zijn aard slechts
      van korte duur is. De [artikelen 1623b-1623f][ref1], [1623j][ref2], [1623k, eerste en tweede lid][ref3],
      [1623l][ref4], [1623n, derde lid][ref5] en [1623o][ref6] zijn voorts niet van toepassing op de huur en verhuur
      van woonruimte in gebouwen, welke aan een gemeente toebehoren en ten tijde van het aangaan van de overeenkomst
      voor afbraak bestemd zijn. Op de huur en verhuur van woonruimte die niet een zelfstandige woning vormt en deel
      uitmaakt van een woning waarin de verhuurder zijn hoofdverblijf heeft en waarin niet eerder aan dezelfde huurder
      deze of andere woonruimte is verhuurd geweest, zijn gedurende negen maanden na het ingaan van de overeenkomst
      de [artikelen 1623b, vierde lid][ref7], [1623c tot en met 1623f ][ref8], [1623j][ref9], [1623l][ref10] en
      [1623o][ref11] niet van toepassing en is [artikel 1623n, derde lid][ref12], in zoverre van toepassing dat de in dat
      lid bedoelde opzegging uitsluitend wordt beheerst door [artikel 1623b, met uitzondering van het vierde lid][ref13]
      van dat artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0006000#Artikel1623f
