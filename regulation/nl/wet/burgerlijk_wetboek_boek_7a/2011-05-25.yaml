  - number: 1576k
    text: |-
      Ter zake van huurkoop kan de koper, indien hij bij het aangaan van de overeenkomst werkelijke woonplaats in een
      gemeente in Nederland heeft, geen woonplaats kiezen, behalve voor het geval dat hij te eniger tijd geen bekende
      werkelijke woonplaats in die gemeente mocht hebben.
    url: https://wetten.overheid.nl/BWBR0006000/2011-05-25#Artikel1576k
  - number: 1576l
    text: |-
      1 De verkoper is verplicht de verkochte zaak aan de koper te leveren door aan deze de macht over de zaak
      te verschaffen. Op zijn verdere verplichtingen zijn de bepalingen van de [eerste][ref1], [tweede][ref2] en
      [derde afdeling van titel 1 van Boek 7][ref3] van toepassing.

      2 Vervreemding door den verkooper van de in huurkoop afgeleverde zaak werkt niet ten nadeele van den huurkooper.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Afdeling1
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Afdeling2
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Afdeling3
    url: https://wetten.overheid.nl/BWBR0006000/2011-05-25#Artikel1576l
    references:
      - id: ref1
        bwb_id: BWBR0005290
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005290
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0005290
        afdeling: '3'
  - number: 1576m
    text: |-
      1 De kooper heeft van de zaak, die hij krachtens huurkoop onder zich heeft, het genot, ook voordat hij den eigendom
      daarvan verkrijgt.

      2 Hij mag de zaak gebruiken overeenkomstig hare bestemming.

      3 Hare gedaante of inrichting mag hij niet veranderen, noch de zaak verhuren of zijn genot aan anderen afstaan.

      4 De zaak is voor risico van de koper van de aflevering af. De [leden 2, 3 en 4 van artikel 10 van Boek 7][ref1]
      zijn van toepassing.

      5 Van deze bepalingen kan bij overeenkomst worden afgeweken. Van lid 4 kan echter bij een consumentenkoop niet ten
      nadele van de koper worden afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel10
    url: https://wetten.overheid.nl/BWBR0006000/2011-05-25#Artikel1576m
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '10'
  - number: 1576n
    text: |-
      1 De vruchten, welke de zaak tijdens het genot oplevert, behooren den kooper toe. Voorzoover bij de akte
      van huurkoop hiervan is afgeweken, heeft de kooper niettemin het genot der vruchten, indien niet anders is
      overeengekomen.

      2 De burgerlijke vruchten worden, voor zoover niet anders is overeengekomen, gerekend van dag tot dag verkregen te
      worden en den kooper toe te behooren, naarmate zijn genot duurt, welk ook het tijdstip moge wezen, waarop dezelve
      betaalbaar zijn.

      3 De verplichting tot teruggave van de in huurkoop afgeleverde zaak omvat die tot teruggave van de vruchten, welke
      den verkooper toebehooren.
    url: https://wetten.overheid.nl/BWBR0006000/2011-05-25#Artikel1576n
  - number: 1576q
    text: |-
      Ontbinding van huurkoop, of teruggave van eene in huurkoop gehouden zaak krachtens daartoe gemaakt beding, kan,
      wegens niet tijdige nakoming door den kooper van zijne verplichtingen, niet worden ingeroepen of gevorderd, tenzij
      de kooper, na in gebreke te zijn gesteld, nalatig blijft om zijne verplichtingen na te komen.
    url: https://wetten.overheid.nl/BWBR0006000/2011-05-25#Artikel1576q
  - number: 1576r
    text: |-
      Wanneer de verkoper ontbinding van de overeenkomst of teruggave van de in huurkoop afgeleverde zaak kan vorderen,
      kan de kantonrechter, indien de verkoper zulks verzoekt en daarbij redelijk belang heeft, bij voorlopige
      voorziening teruggave bij voorraad bevelen.
    url: https://wetten.overheid.nl/BWBR0006000/2011-05-25#Artikel1576r
  - number: 1576s
    text: |-
      Indien, wegens het niet nakomen door den kooper van zijne verplichtingen, de in huurkoop afgeleverde zaak krachtens
      daartoe gemaakt beding wordt teruggenomen, heeft dit ontbinding van de overeenkomst tot gevolg, tenzij tusschen
      partijen anders overeengekomen is.
    url: https://wetten.overheid.nl/BWBR0006000/2011-05-25#Artikel1576s
  - number: 1576t
    text: |-
      Indien bij ontbinding van de overeenkomst wegens het niet nakomen door den kooper van zijne verplichtingen
      de verkooper in beteren vermogenstoestand zou geraken dan bij het in stand blijven van de overeenkomst, vindt
      volledige verrekening plaats.
    url: https://wetten.overheid.nl/BWBR0006000/2011-05-25#Artikel1576t
  - number: 1576u
    text: |-
      Indien bij ontbinding der overeenkomst de kooper recht mocht hebben op eenige terugbetaling, kan hij door den
      rechter worden gemachtigd de zaak, die hij terug moet geven, onder zich te houden, totdat het hem verschuldigde
      wordt betaald of de verkooper daarvoor voldoende zekerheid heeft gesteld.
    url: https://wetten.overheid.nl/BWBR0006000/2011-05-25#Artikel1576u
  - number: 1576v
    text: |-
      1 Indien wegens niet betaling van verschenen termijnen de in huurkoop afgeleverde zaak is teruggenomen zonder
      voorafgaande rechterlijke tusschenkomst, kan de kooper gedurende veertien dagen na de terugneming de zaak inlossen,
      door betaling van de verschenen termijnen en de verschuldigde rente, boeten en kosten.

      2 Mocht de overeenkomst zijn ontbonden, dan wordt dit door de inlossing ongedaan gemaakt.

      3 Bij herhaling van het in het eerste lid genoemde geval heeft de kooper het recht van inlossing alleen onder
      volledige betaling.

      4 Aan de vordering tot inlossing, anders dan onder volledige betaling, behoeft de verkooper niet te voldoen, indien
      omstandigheden aanwezig zijn, die tot toepassing van [artikel 1576r][ref1] aanleiding zouden geven.

      5 Van de bepalingen van dit artikel kan ten voordeele van den kooper door partijen worden afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0006000#Artikel1576r
    url: https://wetten.overheid.nl/BWBR0006000/2011-05-25#Artikel1576v
    references:
      - id: ref1
        bwb_id: BWBR0006000
        artikel: 1576r
        afdeling: '2'
  - number: 1576w
    text: |-
      In het vonnis, waarbij de verplichting tot teruggave van eene in huurkoop afgeleverde zaak wordt vastgesteld of de
      overeenkomst wordt ontbonden, kan een bevel tot teruggave worden opgenomen.
    url: https://wetten.overheid.nl/BWBR0006000/2011-05-25#Artikel1576w
  - number: 1576x
    text: |-
      1 Bij het vonnis, dat bevel tot teruggave uit kracht van huurkoop inhoudt, kan de geldswaarde der terug te geven
      zaak worden vastgesteld.

      2 In dat geval kan de tenuitvoerlegging ook door uitwinning geschieden.
    url: https://wetten.overheid.nl/BWBR0006000/2011-05-25#Artikel1576x
  - number: '1655'
    text: |-
      Maatschap is eene overeenkomst, waarbij twee of meerdere personen zich verbinden om iets in gemeenschap te brengen,
      met het oogmerk om het daaruit ontstaande voordeel met elkander te deelen.
    url: https://wetten.overheid.nl/BWBR0006000/2011-05-25#Artikel1655
  - number: '1657'
    text: Maatschappen zijn of algeheel, of bijzonder.
    url: https://wetten.overheid.nl/BWBR0006000/2011-05-25#Artikel1657
  - number: '1658'
    text: |-
      De wet kent slechts de algeheele maatschap van winst. Zij verbiedt alle maatschappen, het zij van alle de goederen,
      het zij van een bepaald gedeelte van dezelve, onder eenen algemeenen titel; onverminderd de bepalingen, vastgesteld
      in den [zevenden][ref1] en [achtsten titel van het eerste boek van dit Wetboek][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002656
      [ref2]: https://wetten.overheid.nl/BWBR0002656
    url: https://wetten.overheid.nl/BWBR0006000/2011-05-25#Artikel1658
    references:
      - id: ref1
        bwb_id: BWBR0002656
      - id: ref2
        bwb_id: BWBR0002656
  - number: '1659'
    text: |-
      De algeheele maatschap van winst bevat slechts hetgeen partijen, onder welke benaming ook, gedurende den loop der
      maatschap door hare vlijt zullen verkrijgen.
    url: https://wetten.overheid.nl/BWBR0006000/2011-05-25#Artikel1659
  - number: '1660'
    text: |-
      De bijzondere maatschap is de zoodanige welke slechts betrekking heeft tot zekere bepaalde goederen, of tot
      derzelver gebruik, of tot de vruchten die daarvan zullen getrokken worden, of tot eene bepaalde onderneming, of tot
      de uitoefening van eenig bedrijf of beroep.
    url: https://wetten.overheid.nl/BWBR0006000/2011-05-25#Artikel1660
  - number: '1661'
    text: De maatschap begint van het oogenblik der overeenkomst, indien daarbij geen ander tijdstip bepaald is.
    url: https://wetten.overheid.nl/BWBR0006000/2011-05-25#Artikel1661
  - number: '1662'
    text: |-
      1 De inbreng van de vennoot kan bestaan in geld, goederen, genot van goederen en arbeid.

      2 Op de inbreng van een goed zijn de bepalingen omtrent koop, op de inbreng van genot van een goed de
      [artikelen 1584-1623][ref1] van overeenkomstige toepassing, voor zover de aard van de rechtsverhouding zich
      daartegen niet verzet.


      [ref1]: https://wetten.overheid.nl/BWBR0006000#Artikel1584
    url: https://wetten.overheid.nl/BWBR0006000/2011-05-25#Artikel1662
    references:
      - id: ref1
        bwb_id: BWBR0006000
        artikel: '1584'
        afdeling: Eerste
  - number: '1665'
    text: |-
      Wanneer een der vennooten, voor zijne eigene rekening, eene opeischbare som te vorderen heeft van iemand die mede
      eene insgelijks opeischbare som verschuldigd is aan de maatschap, moet de betaling, welke hij ontvangt, op de
      inschuld der maatschap en op die van hemzelven, naar evenredigheid van beide die vorderingen, toegerekend worden,
      al ware het ook dat hij, bij de kwijting, alles in mindering of voldoening van zijne eigene inschuld mogt gebragt
      hebben; maar indien hij bij de kwijting bepaald heeft dat de geheele betaling zoude strekken voor de inschuld der
      maatschap, zal deze bepaling worden nagekomen.
    url: https://wetten.overheid.nl/BWBR0006000/2011-05-25#Artikel1665
  - number: '1666'
    text: |-
      Indien een der vennooten zijn geheel aandeel in eene gemeene inschuld der maatschap ontvangen heeft, en de
      schuldenaar naderhand onvermogend is geworden, is die vennoot gehouden het ontvangene in de gemeene kas in te
      brengen, al had hij ook voor zijn aandeel kwijting gegeven.
    url: https://wetten.overheid.nl/BWBR0006000/2011-05-25#Artikel1666
  - number: '1670'
    text: |-
      1 Indien bij de overeenkomst van maatschap het aandeel van ieder vennoot in de winsten en de verliezen niet is
      bepaald, is elks aandeel geëvenredigd aan hetgeen hij in de maatschap heeft ingebragt.

      2 Ten aanzien van degenen die slechts zijne nijverheid heeft ingebragt, wordt het aandeel in de winsten en de
      verliezen berekend gelijk te staan met het aandeel van dengenen der vennooten die het minst heeft ingebragt.
    url: https://wetten.overheid.nl/BWBR0006000/2011-05-25#Artikel1670
  - number: '1671'
    text: |-
      1 De vennooten kunnen niet bedingen dat zij de regeling der hoegrootheid van hun aandeel aan een hunner of aan
      eenen derde zullen overlaten.

      2 Een zoodanig beding wordt voorondersteld niet geschreven te zijn, en zullen alzoo de verordeningen van het
      voorgaande artikel worden in acht genomen.
    url: https://wetten.overheid.nl/BWBR0006000/2011-05-25#Artikel1671
  - number: '1672'
    text: |-
      1 Het beding, waarbij aan een der vennooten alle de voordeelen mogten toegezegd zijn, is nietig.

      2 Maar het is geoorloofd te bedingen dat alle de verliezen bij uitsluiting door een of meer der vennooten zullen
      gedragen worden.
    url: https://wetten.overheid.nl/BWBR0006000/2011-05-25#Artikel1672
  - number: '1673'
    text: |-
      1 De vennoot die bij een bijzonder beding van de overeenkomst van maatschap met het beheer belast is, kan, zelfs in
      weerwil der overige vennooten, alle daden verrigten, welke tot zijn beheer betrekkelijk zijn.

      2 Deze magt kan, zoo lang de maatschap duurt, niet zonder gewichtige reden herroepen worden; maar indien dezelve
      niet bij de overeenkomst der maatschap, maar bij eene latere akte, is gegeven, is zij, even als eene eenvoudige
      lastgeving, herroepelijk.
    url: https://wetten.overheid.nl/BWBR0006000/2011-05-25#Artikel1673
  - number: '1674'
    text: |-
      Indien verscheidene vennooten met het beheer belast zijn, zonder dat hunne bijzondere werkzaamheden bepaald zijn,
      of zonder beding dat de een buiten den anderen niets zoude mogen verrigten, is ieder van hen afzonderlijk tot alle
      handelingen, dat beheer betreffende, bevoegd.
    url: https://wetten.overheid.nl/BWBR0006000/2011-05-25#Artikel1674
  - number: '1675'
    text: |-
      Indien er bedongen is dat een der beheerders niets buiten den anderen zoude mogen verrigten, vermag de eene, zonder
      eene nieuwe overeenkomst, niet te handelen zonder medewerking van den anderen, al mogt deze zich ook voor het
      oogenblik in de onmogelijkheid bevinden om aan de daden van het beheer deel te nemen.
    url: https://wetten.overheid.nl/BWBR0006000/2011-05-25#Artikel1675
  - number: '1676'
    text: |-
      Bij gebreke van bijzondere bedingen omtrent de wijze van beheer, moeten de volgende regelen worden in acht genomen:

      1°. De vennooten worden geacht zich over en weder de magt te hebben verleend om, de een voor den anderen, te
      beheeren.

      Hetgeen ieder van hen verrigt is ook verbindende voor het aandeel der overige vennooten, zonder dat hij hunne
      toestemming hebbe bekomen; onverminderd het regt van deze laatstgemelden, of van een hunner, om zich tegen de
      handeling, zoo lang die nog niet gesloten is, te verzetten;

      2°. Ieder der vennooten mag gebruik maken van de goederen aan de maatschap toebehoorende, mits hij dezelve tot
      zoodanige einden gebruike, als waartoe zij gewoonlijk bestemd zijn, en mits hij zich van dezelve niet bediene tegen
      het belang der maatschap of op zoodanige wijze, dat de overige vennooten daardoor verhinderd worden om van die
      goederen, volgens hun regt, mede gebruik te maken;

      3°. Ieder vennoot heeft de bevoegdheid om de overige vennooten te verpligten in de onkosten te dragen, welke tot
      behoud der aan de maatschap behoorende goederen noodzakelijk zijn;

      4°. Geen der vennooten kan, zonder toestemming der overige, eenige nieuwigheden daarstellen ten aanzien der
      onroerende zaken, welke tot de maatschap behooren, al beweerde hij ook dat dezelve voor de maatschap voordeelig
      waren.
    url: https://wetten.overheid.nl/BWBR0006000/2011-05-25#Artikel1676
  - number: '1678'
    text: |-
      Elk der vennooten mag, zelfs zonder toestemming der overige, eenen derden persoon aannemen als deelgenoot in het
      aandeel hetwelk hij in de maatschap heeft; doch hij kan denzelven, zonder zoodanige toestemming, niet als medelid
      der maatschap toelaten, al mogt hij ook met het beheer der zaken van de maatschap belast zijn.
    url: https://wetten.overheid.nl/BWBR0006000/2011-05-25#Artikel1678
  - number: '1679'
    text: |-
      De vennooten zijn niet ieder voor het geheel voor de schulden der maatschap verbonden; en een der vennooten kan de
      overige niet verbinden, indien deze hem daartoe geene volmagt gegeven hebben.
    url: https://wetten.overheid.nl/BWBR0006000/2011-05-25#Artikel1679
  - number: '1680'
    text: |-
      De vennooten kunnen door den schuldeischer, met wien zij gehandeld hebben, aangesproken worden, ieder voor gelijke
      som en gelijk aandeel, al ware het dat het aandeel in de maatschap van den eenen minder dan dat van den anderen
      bedroeg; ten zij, bij het aangaan der schuld, derzelver verpligting, om in evenredigheid van het aandeel in de
      maatschap van elk vennoot te dragen, uitdrukkelijk zij bepaald.
    url: https://wetten.overheid.nl/BWBR0006000/2011-05-25#Artikel1680
  - number: '1681'
    text: |-
      Het beding dat eene handeling voor rekening der maatschap is aangegaan, verbindt slechts den vennoot die dezelve
      aangegaan heeft, maar niet de overige, ten zij de laatstgenoemde hem daartoe volmagt hadden gegeven, of de zaak ten
      voordeele der maatschap gestrekt hebbe.
    url: https://wetten.overheid.nl/BWBR0006000/2011-05-25#Artikel1681
  - number: '1682'
    text: |-
      Indien een der vennooten in naam der maatschap eene overeenkomst heeft aangegaan, kan de maatschap de uitvoering
      daarvan vorderen.
    url: https://wetten.overheid.nl/BWBR0006000/2011-05-25#Artikel1682
  - number: '1683'
    text: |-
      Een maatschap wordt ontbonden:

      1°. Door verloop van den tijd voor welken dezelve is aangegaan;

      2°. Door het tenietgaan van een goed of de volbrenging der handeling, die het onderwerp der maatschap uitmaakt;

      3°. Door opzegging van een vennoot aan de andere vennoten;

      4°. Door den dood of de curatele van één hunner, of indien hij in staat van faillissement is verklaard dan wel ten
      aanzien van hem de schuldsaneringsregeling natuurlijke personen van toepassing is verklaard.
    url: https://wetten.overheid.nl/BWBR0006000/2011-05-25#Artikel1683
  - number: '1684'
    text: |-
      1 De rechter kan op vordering van ieder der vennoten de maatschap wegens gewichtige redenen ontbinden.

      2 Een zodanige ontbinding heeft geen terugwerkende kracht. De rechter kan de vordering toewijzen onder door
      hem te stellen voorwaarden en een partij die in de naleving van haar verplichtingen is tekortgeschoten, met
      overeenkomstige toepassing van [artikel 277 van Boek 6][ref1] tot schadevergoeding veroordelen.

      3 De [artikelen 265-279 van Boek 6][ref2] zijn op een maatschap niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel277
      [ref2]: https://wetten.overheid.nl/BWBR0005289#Artikel265
    url: https://wetten.overheid.nl/BWBR0006000/2011-05-25#Artikel1684
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '277'
      - id: ref2
        bwb_id: BWBR0005289
        artikel: '265'
  - number: '1686'
    text: |-
      1 Een opzegging is vernietigbaar, indien zij in strijd met de redelijkheid en billijkheid is geschied.

      2 Een vennootschap voor bepaalde tijd of voor een bepaald werk aangegaan, kan niet worden opgezegd, tenzij dit
      is bedongen.
    url: https://wetten.overheid.nl/BWBR0006000/2011-05-25#Artikel1686
  - number: '1688'
    text: |-
      1 Indien bedongen is, dat, in geval van overlijden van een der vennooten, de maatschap met deszelfs erfgenaam, of
      alleen tusschen de overblijvende vennooten, zoude voortduren, moet dat beding worden nagekomen.

      2 In het tweede geval, heeft de erfgenaam des overledenen geen verder regt dan op de verdeeling der maatschap,
      overeenkomstig de gesteldheid waarin dezelve zich ten tijde van dat overlijden bevond; doch hij deelt in de
      voordeelen en draagt in de verliezen, die de noodzakelijke gevolgen zijn van verrigtingen, welke vóór het
      overlijden van den vennoot, wiens erfgenaam hij is, hebben plaats gehad.
    url: https://wetten.overheid.nl/BWBR0006000/2011-05-25#Artikel1688
  - number: '1777'
    text: |-
      Bruikleening is eene overeenkomst, waarbij de eene partij aan de andere eene zaak om niet ten gebruike geeft, onder
      voorwaarde dat degene die deze zaak ontvangt, dezelve, na daarvan gebruik te hebben gemaakt, of na eenen bepaalden
      tijd, zal terug geven.
    url: https://wetten.overheid.nl/BWBR0006000/2011-05-25#Artikel1777
  - number: '1778'
    text: De uitleener blijft eigenaar van de geleende zaak.
    url: https://wetten.overheid.nl/BWBR0006000/2011-05-25#Artikel1778
  - number: '1780'
    text: |-
      1 De verbintenissen, welke uit de bruiklening voortspruiten, gaan over op de erfgenamen van degene die ter leen
      geeft, onderscheidenlijk zijn echtgenoot of geregistreerde partner in het geval zijn nalatenschap overeenkomstig
      [artikel 13 van Boek 4][ref1] wordt verdeeld, en van hem die ter leen ontvangt.

      2 Maar indien men de uitleening gedaan heeft alleen uit aanmerking van dengenen die ter leen ontvangt, en aan
      deszelfs persoon in het bijzonder, kunnen deszelfs erfgenamen het verder genot van de geleende zaak niet blijven
      behouden.


      [ref1]: https://wetten.overheid.nl/BWBR0002761#Artikel13
    url: https://wetten.overheid.nl/BWBR0006000/2011-05-25#Artikel1780
    references:
      - id: ref1
        bwb_id: BWBR0002761
        artikel: '13'
  - number: '1781'
    text: |-
      1 Die iets ter leen ontvangt is gehouden, als een goed huisvader, voor de bewaring en het behoud van de geleende
      zaak te zorgen.

      2 Hij mag daarvan geen ander gebruik maken dan hetwelk de aard der zaak medebrengt, of bij de overeenkomst bepaald
      is.
    url: https://wetten.overheid.nl/BWBR0006000/2011-05-25#Artikel1781
  - number: '1782'
    text: |-
      Indien de geleende zaak verloren gaat door een toeval, hetwelk degene die dezelve ter leen ontvangen heeft, door
      zijne eigene zaak te gebruiken, had kunnen voorkomen, of indien hij, slechts een van beide kunnende behouden, aan
      de zijne den voorrang heeft gegeven, is hij voor het verlies der andere zaak aansprakelijk.
    url: https://wetten.overheid.nl/BWBR0006000/2011-05-25#Artikel1782
  - number: '1783'
    text: |-
      Indien de zaak bij het ter leen geven geschat is, komt het verlies van dezelve, al ontstond dat ook door toeval,
      ten laste van dengenen die de zaak ter leen ontvangen heeft, ten ware het tegendeel mogt bedongen zijn.
    url: https://wetten.overheid.nl/BWBR0006000/2011-05-25#Artikel1783
  - number: '1784'
    text: |-
      Indien de zaak alleen tengevolge van het gebruik waartoe dezelve geleend is, en buiten schuld van den gebruiker, in
      waarde vermindert, is deze wegens die vermindering niet aansprakelijk.
    url: https://wetten.overheid.nl/BWBR0006000/2011-05-25#Artikel1784
  - number: '1785'
    text: |-
      Indien de gebruiker, om van de geleende zaak gebruik te kunnen maken, eenige onkosten gemaakt heeft, kan hij
      dezelve niet terug vorderen.
    url: https://wetten.overheid.nl/BWBR0006000/2011-05-25#Artikel1785
  - number: '1786'
    text: |-
      Indien een zaak in bruikleen is gegeven aan twee of meer personen tezamen, zijn zij hoofdelijk verbonden tot
      teruggave daarvan en tot vergoeding van de schade die het gevolg is van een tekortschieten in de nakoming van die
      verplichting, tenzij de tekortkoming aan geen van hen kan worden toegerekend.
    url: https://wetten.overheid.nl/BWBR0006000/2011-05-25#Artikel1786
  - number: '1787'
    text: |-
      De uitleener kan de geleende zaak niet terug vorderen dan na verloop van den bepaalden tijd, of, bij gebreke eener
      dusdanige bepaling, nadat dezelve tot het gebruik waartoe zij was uitgeleend gediend heeft, of heeft kunnen dienen.
    url: https://wetten.overheid.nl/BWBR0006000/2011-05-25#Artikel1787
  - number: '1788'
    text: |-
      Indien evenwel de uitleener, gedurende dat tijdsverloop, of voor dat de behoefte van den gebruiker opgehouden
      heeft, de geleende zaak, om dringende en onverwachts opkomende redenen, zelf benoodigd heeft, kan de regter, naar
      gelang der omstandigheden, den gebruiker noodzaken het geleende aan den uitleener terug te geven.
    url: https://wetten.overheid.nl/BWBR0006000/2011-05-25#Artikel1788
  - number: '1789'
    text: |-
      Indien de gebruiker, gedurende de bruikleening tot behoud der zaak eenige buitengewone noodzakelijke onkosten heeft
      moeten maken, welke zoo dringende waren dat hij daarvan te voren aan den uitleener geene kennis heeft kunnen geven,
      is deze verpligt hem dezelve te vergoeden.
    url: https://wetten.overheid.nl/BWBR0006000/2011-05-25#Artikel1789
  - number: '1790'
    text: |-
      Indien de ter leen gegevene zaak zoodanige gebreken heeft, dat daardoor aan dengenen die zich van dezelve bedient
      nadeel zoude kunnen worden toegebragt, is de uitleener, zoo hij die gebreken gekend, en daarvan aan den gebruiker
      geene kennis gegeven heeft, voor de gevolgen verantwoordelijk.
    url: https://wetten.overheid.nl/BWBR0006000/2011-05-25#Artikel1790
  - number: '1791'
    text: |-
      Verbruikleening is eene overeenkomst, waarbij de eene partij aan de andere eene zekere hoeveelheid van verbruikbare
      goederen afgeeft, onder voorwaarde dat de laatstgemelde haar even zoo veel, van gelijke soort en hoedanigheid,
      terug geve.
    url: https://wetten.overheid.nl/BWBR0006000/2011-05-25#Artikel1791
  - number: '1792'
    text: |-
      Uit krachte dezer verbruikleening, wordt degene die ter leen ontvangt rechthebbende op het geleende goed; en indien
      hetzelve, op welke wijze ook, vergaat, komt dat verlies voor zijne rekening.
    url: https://wetten.overheid.nl/BWBR0006000/2011-05-25#Artikel1792
  - number: '1793'
    text: |-
      De schuld, uit leening van geld voortspruitende, bestaat alleen in de geldsom die bij de overeenkomst is
      uitgedrukt.
    url: https://wetten.overheid.nl/BWBR0006000/2011-05-25#Artikel1793
  - number: '1796'
    text: |-
      De uitleener kan het ter leen gegevene niet terug eischen, voordat de tijd, bij de overeenkomst bepaald, verstreken
      is.
    url: https://wetten.overheid.nl/BWBR0006000/2011-05-25#Artikel1796
  - number: '1797'
    text: |-
      Geene tijdsbepaling gemaakt zijnde, kan de regter, wanneer de uitleener de teruggave vordert, naar gelang der
      omstandigheden, aan dengenen die het goed ter leen ontvangen heeft, eenig uitstel toestaan.
    url: https://wetten.overheid.nl/BWBR0006000/2011-05-25#Artikel1797
  - number: '1798'
    text: |-
      Indien men is overeengekomen dat hij die een goed ter leen heeft ontvangen dit zal terug geven, wanneer hij daartoe
      in staat zal zijn, zal de regter, naar gelang der omstandigheden, den tijd der teruggave bepalen.
    url: https://wetten.overheid.nl/BWBR0006000/2011-05-25#Artikel1798
  - number: '1799'
    text: |-
      De bepaling van [artikel 1790][ref1] is op verbruikleening toepasselijk.


      [ref1]: https://wetten.overheid.nl/BWBR0006000#Artikel1790
    url: https://wetten.overheid.nl/BWBR0006000/2011-05-25#Artikel1799
    references:
      - id: ref1
        bwb_id: BWBR0006000
        artikel: '1790'
        afdeling: Derde
  - number: '1800'
    text: |-
      Die iets ter leen ontvangt is verpligt hetzelve, in gelijke hoeveelheid en hoedanigheid, en op den bepaalden tijd,
      terug te geven.
    url: https://wetten.overheid.nl/BWBR0006000/2011-05-25#Artikel1800
  - number: '1801'
    text: |-
      1 Indien hij zich in de onmogelijkheid bevindt om hieraan te voldoen, is hij gehouden de waarde van het geleende
      te betalen, waarbij zal moeten in aanmerking genomen worden de tijd en de plaats, waarop het goed, ten gevolge der
      overeenkomst, had moeten worden terug gegeven.

      2 Indien deze tijd en plaats niet bepaald zijn, moet de voldoening geschieden overeenkomstig de waarde welke het
      geleende goed, ten tijde waarop en ter plaatse alwaar de leening geschied is, gehad heeft.
    url: https://wetten.overheid.nl/BWBR0006000/2011-05-25#Artikel1801
  - number: '1804'
    text: De hoegrootheid der bij overeenkomst bedongene rente moet in geschrift worden bepaald.
    url: https://wetten.overheid.nl/BWBR0006000/2011-05-25#Artikel1804
  - number: '1805'
    text: |-
      Indien de uitleener rente bedongen heeft, zonder dat het beloop daarvan bepaald zij, is degene die ter leen
      ontvangen heeft gehouden het beloop der wettelijke rente te voldoen.
    url: https://wetten.overheid.nl/BWBR0006000/2011-05-25#Artikel1805
  - number: '1806'
    text: |-
      Het bewijs van de betaling der hoofdsom zonder voorbehoud van rente gegeven zijnde, doet de voldoening der rente
      vooronderstellen, en de schuldenaar wordt daarvan bevrijd.
    url: https://wetten.overheid.nl/BWBR0006000/2011-05-25#Artikel1806
  - number: '1807'
    text: |-
      Het vestigen eener altijddurende rente is eene overeenkomst, waarbij de uitleener interessen bedingt, tegen
      betaling eener hoofdsom welke hij aanneemt niet terug te zullen vorderen.
    url: https://wetten.overheid.nl/BWBR0006000/2011-05-25#Artikel1807
  - number: '1808'
    text: |-
      1 Deze rente is uit haren aard aflosbaar.

      2 Partijen kunnen alleenlijk overeenkomen dat de aflossing niet geschieden zal dan na verloop van eenen zekeren
      tijd, welke niet langer dan voor tien jaren mag gesteld worden, of zonder dat zij den schuldeischer vooraf
      verwittigd hebben op eenen zekeren, door hen bevorens vastgestelden termijn, welke echter den tijd van een jaar
      niet zal mogen te boven gaan.
    url: https://wetten.overheid.nl/BWBR0006000/2011-05-25#Artikel1808
  - number: '1809'
    text: |-
      De schuldenaar eener altijddurende rente kan tot de aflossing genoodzaakt worden:

      1°. Indien hij niets betaald heeft op de gedurende twee achtereenvolgende jaren verschuldigde renten;

      2°. Indien hij verzuimt aan den geldschieter de bij de overeenkomst beloofde zekerheid te bezorgen;

      3°. Indien hij in staat van faillissement is verklaard of ten aanzien van hem de schuldsaneringsregeling
      natuurlijke personen van toepassing is verklaard.
    url: https://wetten.overheid.nl/BWBR0006000/2011-05-25#Artikel1809
  - number: '1810'
    text: |-
      In de twee eerste gevallen, bij het vorige artikel vermeld, kan de schuldenaar zich van de verpligting tot
      aflossing ontheffen, indien hij binnen de twintig dagen, te rekenen van de geregtelijke aanmaning, alle de
      verschenen termijnen betaalt of de beloofde zekerheid stelt.
    url: https://wetten.overheid.nl/BWBR0006000/2011-05-25#Artikel1810
  - number: '1825'
    text: De wet staat geene regtsvordering toe, ter zake van eene schuld uit spel of uit weddingschap voortgesproten.
    url: https://wetten.overheid.nl/BWBR0006000/2011-05-25#Artikel1825
  - number: '1826'
    text: |-
      1 Onder de hier-boven staande bepaling zijn echter niet begrepen die spelen welke geschikt zijn tot
      ligchaamsoefening, als het schermen, wedloopen en dergelijke.

      2 Niettemin kan de regter den eisch ontzeggen of verminderen, wanneer hem de som overmatig toeschijnt.
    url: https://wetten.overheid.nl/BWBR0006000/2011-05-25#Artikel1826
  - number: '1827'
    text: Van de vorige twee artikelen kan op generlei wijze worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0006000/2011-05-25#Artikel1827
  - number: '1828'
    text: |-
      In geen geval, kan hij die het verlorene vrijwillig betaald heeft hetzelve terug eischen, ten ware, van den kant
      van dengenen die gewonnen heeft, bedrog, list of opligting hebbe plaats gehad.
    url: https://wetten.overheid.nl/BWBR0006000/2011-05-25#Artikel1828
  - number: '2031'
    text: |-
      1 De [Algemene termijnenwet][ref1] is niet van toepassing op de termijnen, gesteld in de
      [artikelen 280, onder b][ref2], en [281, tweede lid van Boek 1][ref3] en [252 van Boek 3][ref4], alsmede in
      [titel 10 van Boek 7][ref5].

      2 Onder algemeen erkende feestdagen worden in dit wetboek verstaan de in
      [artikel 3 van de Algemene termijnenwet][ref6] als zodanig genoemde en de bij of krachtens dat artikel daarmede
      gelijkgestelde dagen.


      [ref1]: https://wetten.overheid.nl/BWBR0002448
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel280
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel281
      [ref4]: https://wetten.overheid.nl/BWBR0005291#Artikel252
      [ref5]: https://wetten.overheid.nl/BWBR0005290
      [ref6]: https://wetten.overheid.nl/BWBR0002448#Artikel3
    url: https://wetten.overheid.nl/BWBR0006000/2011-05-25#Artikel2031
