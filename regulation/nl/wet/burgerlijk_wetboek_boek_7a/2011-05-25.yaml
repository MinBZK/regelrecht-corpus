  - number: '1576'
    text: |-
      1 Koop en verkoop op afbetaling is de koop en verkoop, waarbij partijen overeenkomen dat de koopprijs wordt betaald
      in termijnen, waarvan twee of meer verschijnen, nadat de verkochte zaak aan de koper is afgeleverd.

      2 De overeenkomst is niet van kracht voordat partijen de door de koper te betalen prijs hebben bepaald.

      3 Alle overeenkomsten, welke dezelfde strekking hebben, onder welke vorm of welke benaming ook aangegaan, worden
      als koop en verkoop op afbetaling aangemerkt.

      4 Koop en verkoop op afbetaling in de zin der wet zijn niet de overeenkomsten welke betrekking hebben op:

      a. onroerende zaken,

      b. zeeschepen waarvan de bruto-inhoud tenminste twintig kubieke meters of de bruto-tonnage tenminste 6
      bedraagt, die te boek staan of die te boek gesteld kunnen worden in de openbare registers, bedoeld in
      [afdeling 2 van titel 1 van Boek 3][ref1],

      c. binnenschepen die te boek staan of die te boek gesteld moeten worden doch niet te boek staan in de openbare
      registers, bedoeld in [afdeling 2 van titel 1 van Boek 3][ref2],

      d. luchtvaartuigen die te boek staan in de openbare registers, bedoeld in [afdeling 2 van titel 1 van Boek 3][ref3].

      5 Het in deze titel bepaalde vindt overeenkomstige toepassing op vermogensrechten, niet zijnde registergoederen,
      voor zover dat in overeenstemming is met de aard van het recht.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Afdeling2
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Afdeling2
      [ref3]: https://wetten.overheid.nl/BWBR0005291#Afdeling2
