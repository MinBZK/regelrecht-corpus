  - number: 1576a
    text: Van de bepalingen van deze titel mag slechts worden afgeweken, indien en voor zoover dit daaruit blijkt.
    url: https://wetten.overheid.nl/BWBR0006000/2011-05-25#Artikel1576a
  - number: 1576b
    text: |-
      1 Bedingen, waarbij of krachtens welke den schuldenaar, voor het geval hij eenige verplichting uit de overeenkomst
      niet vervult, de betaling van zekere som als schadevergoeding of eenige straf wordt of kan worden opgelegd, kunnen
      alleen bij schriftelijk aangegane overeenkomst worden gemaakt.

      2 Indien de overeengekomen of opgelegde schadevergoeding of straf den rechter bovenmatig voorkomt, kan deze haar,
      ten aanzien van het hem voorgelegde geval, verminderen of opheffen.
    url: https://wetten.overheid.nl/BWBR0006000/2011-05-25#Artikel1576b
  - number: 1576c
    text: |-
      1 Vervroegde opeischbaarheid, als straf wegens nalatigheid van den kooper in het betalen van termijnen, kan alleen
      bedongen worden voor het geval de achterstand bedraagt, ten aanzien van één termijn tenminste een tiende, of ten
      aanzien van meer termijnen gezamenlijk tenminste een twintigste deel van den geheelen koopprijs.

      2 Onder geheelen koopprijs wordt verstaan de som van alle betalingen, waartoe de kooper bij regelmatige nakoming
      van de overeenkomst gehouden is.

      3 Het [tweede lid van artikel 1576b][ref1] is hier niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006000#Artikel1576b
    url: https://wetten.overheid.nl/BWBR0006000/2011-05-25#Artikel1576c
    references:
      - id: ref1
        bwb_id: BWBR0006000
        artikel: 1576b
        afdeling: '1'
  - number: 1576d
    text: |-
      Op eenig beding, als bedoeld in de voorafgaande twee artikelen, kan wegens niet tijdige nakoming beroep alleen
      worden gedaan, indien de schuldenaar, na in gebreke te zijn gesteld, nalatig blijft om zijne verplichtingen na
      te komen.
    url: https://wetten.overheid.nl/BWBR0006000/2011-05-25#Artikel1576d
  - number: 1576f
    text: |-
      1 Overdracht, inpandgeving of elke andere handeling, waardoor de kooper aan den verkooper of aan een derde eenig
      recht toekent op zijn loon, pensioen of andere periodieke inkomsten wegens arbeidsovereenkomst, kan ter zake van
      koop en verkoop op afbetaling, behalve voor opeischbare verplichtingen, alleen geschieden voor betalingen, waartoe
      de kooper bij regelmatige nakoming van de overeenkomst zal gehouden zijn, en voor de kosten.

      2 De handeling heeft alsdan geene werking dan naar gelang bedoelde termijnen verschijnen overeenkomstig een bij
      schriftelijke overeenkomst vastgelegd plan van regelmatige afbetaling of naar gelang er kosten vallen, telkens tot
      het beloop daarvan.

      3 Bovendien is vereischt, dat de kooper, na in gebreke te zijn gesteld, nalatig is gebleven. Alleen de termijnen
      en kosten, waarover de ingebrekestelling is geschied, en die, welke daarna verschijnen, komen in aanmerking bij het
      bepalen van bedoelde werking.

      4 Ten aanzien van hem, die de uitkeering wegens arbeidsovereenkomst verschuldigd is, heeft de handeling geen
      gevolg, alvorens de ingebrekestelling van den kooper en het plan van regelmatige afbetaling met opgave van hetgeen
      daarop voldaan is en van de gevorderde kosten schriftelijk te zijner kennis zijn gebracht, dan wel schriftelijk
      door hem zijn erkend. Betalingen, dienovereenkomstig te goeder trouw door hem gedaan, bevrijden hem tegenover den
      kooper.
    url: https://wetten.overheid.nl/BWBR0006000/2011-05-25#Artikel1576f
  - number: 1576g
    text: |-
      Volmacht tot invordering van loon, pensioen of andere periodieke vorderingen ter zake van eene arbeidsovereenkomst,
      onder welken vorm of welke benaming ook, door den kooper verleend, is steeds herroepelijk.
    url: https://wetten.overheid.nl/BWBR0006000/2011-05-25#Artikel1576g
  - number: 1576h
    text: |-
      1 Huurkoop is de koop en verkoop op afbetaling, waarbij partijen overeenkomen, dat de verkochte zaak niet door
      enkele aflevering in eigendom overgaat, maar pas door vervulling van de opschortende voorwaarde van algehele
      betaling van wat door de koper uit hoofde van de koopovereenkomst verschuldigd is.

      2 Alle overeenkomsten, welke dezelfde strekking hebben, hetzij als huur en verhuur, hetzij onder anderen vorm of
      andere benaming aangegaan, worden als huurkoop aangemerkt.

      3 Onder huurkoop is begrepen de overeenkomst, waarbij ter zake van een koop en verkoop een derde, die den eigendom
      der zaak verwerft, aan den kooper crediet verleent des dat het geheel van handelingen de strekking van huurkoop
      erlangt.
    url: https://wetten.overheid.nl/BWBR0006000/2011-05-25#Artikel1576h
  - number: 1576i
    text: |-
      1 Huurkoop wordt aangegaan bij authentieke of onderhandsche akte, welke voldoet aan de bepalingen van
      [artikel 1576j][ref1].

      2 Hetzelfde geldt voor overeenkomsten, welke bestaande overeenkomsten zoodanig wijzigen of aanvullen, dat daardoor
      huurkoop zou ontstaan.

      3 Wordt de overeenkomst aangegaan bij onderhandsche akte, dan moet deze, zoo de kooper dit verlangt, in dubbel
      worden opgemaakt.

      4 Het dubbel, of zoo dit niet is opgemaakt, een authentiek of door den verkooper onderteekend afschrift, wordt zoo
      spoedig mogelijk na het sluiten van de overeenkomst door den verkooper aan den kooper verstrekt.

      5 Verder afschrift kan de kooper te allen tijde tegen betaling van de kosten vorderen.


      [ref1]: https://wetten.overheid.nl/BWBR0006000#Artikel1576j
    url: https://wetten.overheid.nl/BWBR0006000/2011-05-25#Artikel1576i
    references:
      - id: ref1
        bwb_id: BWBR0006000
        artikel: 1576j
        afdeling: '2'
  - number: 1576j
    text: |-
      1 De akte van huurkoop moet duidelijk vermelden den geheelen koopprijs, als bedoeld in [artikel 1576c][ref1], het
      plan van regelmatige afbetaling, als bedoeld in [artikel 1576f][ref2], en de bedingen betreffende voorbehoud en
      overgang van eigendom.

      2 In de gevallen, bedoeld in het [tweede en het derde lid van artikel 1576h][ref3], treden de overeenkomstige
      gegevens hiervoor in de plaats.

      3 Ontbreekt eene akte, welke voldoet aan genoemde voorwaarden, dan geldt de overeenkomst niet als huurkoop, doch
      wordt de koop en verkoop op afbetaling geacht te zijn gesloten zonder beding, dat de verkochte zaak niet door
      enkele aflevering aan den kooper overgaat.


      [ref1]: https://wetten.overheid.nl/BWBR0006000#Artikel1576c
      [ref2]: https://wetten.overheid.nl/BWBR0006000#Artikel1576f
      [ref3]: https://wetten.overheid.nl/BWBR0006000#Artikel1576h
