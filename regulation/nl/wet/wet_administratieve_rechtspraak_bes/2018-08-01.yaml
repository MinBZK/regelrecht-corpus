        paragraaf: '9'
  - number: '50'
    text: |-
      1 De uitspraak van het Gerecht strekt tot:

      a. onbevoegdverklaring van het Gerecht;

      b. niet-ontvankelijkverklaring van het beroep;

      c. ongegrondverklaring van het beroep; of

      d. gegrondverklaring van het beroep.

      2 Voor zover uitsluitend een vordering bij de burgerlijke rechter kan worden ingesteld, wordt dat in de uitspraak
      vermeld. De burgerlijke rechter is aan die uitspraak gebonden.

      3 Indien het Gerecht het beroep gegrond verklaart, vernietigt het de beschikking geheel of gedeeltelijk.
      Vernietiging van de beschikking of een deel daarvan brengt vernietiging van de rechtsgevolgen van die beschikking
      of het vernietigde deel daarvan mee. Het Gerecht kan bepalen dat de rechtsgevolgen van de vernietigde beschikking
      of het vernietigde deel daarvan geheel of gedeeltelijk in stand blijven.

      4 Indien het Gerecht het beroep gegrond verklaart, kan het bestuursorgaan opdragen een nieuwe beschikking te nemen
      of een andere handeling te verrichten met inachtneming van de uitspraak, dan wel kan het bepalen dat de uitspraak
      in de plaats treedt van de vernietigde beschikking of het vernietigde deel daarvan. Het Gerecht kan een termijn
      stellen voor het nemen van een nieuwe beschikking of het verrichten van een andere handeling.

      5 Indien het Gerecht het beroep gegrond verklaart, kan het, indien daarvoor gronden zijn, bepalen dat een
      vergoeding wordt toegekend ten laste van het bij de uitspraak aangewezen over lichaam. Wordt de vergoeding
      toegekend op verzoek van de partij zelf, dan wordt deze geacht daarmee afstand te hebben gedaan van het recht om op
      grond van andere wettelijke voorschriften schadevergoeding te vragen.

      6 Indien het Gerecht de omvang van de schadevergoeding bij de uitspraak niet of niet volledig kan vaststellen,
      bepaalt het in de uitspraak, dat ter voorbereiding van een nadere uitspraak het onderzoek daarover wordt heropend
      en bepaalt het daarbij hoe het onderzoek wordt voortgezet.

      7 Het Gerecht kan bepalen dat een voorlopige voorziening op een later tijdstip dan het tijdstip waarop het
      uitspraak heeft gedaan, vervalt.

      8 Het Gerecht kan bepalen dat indien en zolang het bestuursorgaan niet voldoet aan de uitspraak, het door het
      Gerecht aangewezen overheidslichaam aan een door het Gerecht aangewezen partij een bij de uitspraak vast te stellen
      dwangsom verbeurt. Het [Wetboek van Burgerlijke Rechtsvordering BES][ref1] is van overeenkomstige toepassing.

      9 Het Gerecht is bij uitsluiting bevoegd een partij te veroordelen in de kosten die een andere partij in
      verband met de behandeling van het beroep en in voorkomend geval het bezwaar redelijkerwijs heeft moeten maken.
      [Artikel 58, tweede lid, eerste volzin, derde en vierde lid][ref2], is van toepassing. Een natuurlijke persoon
      kan slechts in de kosten worden veroordeeld, in geval van een kennelijk onredelijk gebruik van procesrecht. Bij
      of krachtens algemene maatregel van bestuur worden nadere regels gesteld omtrent de kosten waarop de veroordeling,
      bedoeld in de eerste volzin, uitsluitend betrekking kan hebben, en omtrent de wijze waarop in de uitspraak het
      bedrag van de kosten wordt vastgesteld.

      10 In geval van intrekking van het beroep omdat het bestuursorgaan geheel of gedeeltelijk aan de betreffende partij
      is tegemoet gekomen, kan het betrokken overheidslichaam op verzoek van die partij bij afzonderlijke uitspraak in de
      kosten, bedoeld in het negende lid, worden veroordeeld. Het verzoek wordt gedaan tegelijk met de intrekking van het
      beroep. Indien aan dit vereiste niet is voldaan, wordt de verzoeker niet-ontvankelijk verklaard.

      11 Het Gerecht stelt de partij, bedoeld in het tiende lid, zo nodig in de gelegenheid het verzoek schriftelijk
      toe te lichten en stelt het bestuursorgaan in de gelegenheid een verweerschrift in te dienen. Het stelt hiervoor
      termijnen. Indien het verzoek mondeling wordt gedaan, kan het Gerecht bepalen, dat het toelichten en het voeren van
      verweer onmiddellijk mondeling geschieden. Indien het toelichten en het voeren van verweer mondeling zijn geschied,
      sluit het Gerecht het onderzoek. In de overige gevallen zijn de [hoofdstukken 3, § 7][ref3], en [6, § 1][ref4],
      van overeenkomstige toepassing.

      12 Voor zover de uitspraak verplicht tot betaling van een geldbedrag, kan zij worden ten uitvoer
      gelegd overeenkomstig het [Wetboek van Burgerlijke Rechtsvordering BES][ref5]. In geval van een
      vergoeding van de kosten ten behoeve van een partij aan wie een toevoeging is verleend krachtens de
      [Wet kosteloze rechtskundige bijstand BES][ref6] wordt het bedrag van de kosten betaald aan de griffier.


      [ref1]: https://wetten.overheid.nl/BWBR0028496
      [ref2]: https://wetten.overheid.nl/BWBR0028455#Artikel58
      [ref3]: https://wetten.overheid.nl/BWBR0028455#Hoofdstuk3
      [ref4]: https://wetten.overheid.nl/BWBR0028455#Hoofdstuk6
      [ref5]: https://wetten.overheid.nl/BWBR0028496
      [ref6]: https://wetten.overheid.nl/BWBR0028200
    url: https://wetten.overheid.nl/BWBR0028455/2018-08-01#Artikel50
