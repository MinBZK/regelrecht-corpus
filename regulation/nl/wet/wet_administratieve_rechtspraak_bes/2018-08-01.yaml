  - number: '12'
    text: |-
      1 De bijzondere rechters bedoeld in [artikel 11, tweede lid][ref1], worden bij koninklijk besluit benoemd en
      ontslagen. De benoeming geschiedt voor een tijdvak van zes jaren. Op hun verzoek wordt aan hen bij koninklijk
      besluit voor de afloop van voornoemd tijdvak ontslag verleend.

      2 Benoembaar tot bijzondere rechter is iedere Nederlander.

      3 Niet benoembaar zijn:

      a. [vervallen]

      b. de actief dienende of op non-activiteit gestelde ambtenaren alsmede hun levenspartners, met uitzondering van de
      voor het leven benoemde ambtenaren.

      4 Indien ten aanzien van een bijzondere rechter zich na zijn benoeming een van de gevallen voordoet die grond zijn
      voor niet-benoembaarheid, wordt hij bij koninklijk besluit uit zijn ambt ontslagen.

      5 Op met redenen omkleed voorstel van het Hof kan de bijzondere rechter worden ontslagen:

      1°. wanneer zij de leeftijd van vijfenzestig jaren hebben bereikt;

      2°. indien zij uit hoofde van ziekte of gebreken blijvend ongeschikt zijn om hun functies te vervullen;

      3°. bij het verlies van het Nederlanderschap;

      4°. wanneer zij bij onherroepelijk geworden rechterlijke uitspraak wegens misdrijf zijn veroordeeld, dan wel bij
      zulk een uitspraak een maatregel is opgelegd, die vrijheidsbeneming tot gevolg heeft;

      5°. wanneer zij bij een onherroepelijk geworden rechterlijke uitspraak onder curatele zijn gesteld, in staat van
      faillissement zijn verklaard, surseance van betaling hebben verkregen of wegens schulden zijn gegijzeld;

      6°. wegens handelen of nalaten, dat ernstig nadeel toebrengt aan de goede gang van zaken bij de rechtspraak of aan
      het in haar te stellen vertrouwen;

      7°. wanneer zij, na eerder wegens gelijke overtreding te zijn gewaarschuwd, de bepalingen overtreden waarbij hun:

      a. het uitoefenen van enig beroep wordt verboden;

      b. een vast en voortdurend verblijf wordt aangewezen;

      c. verboden wordt zich in enig onderhoud of gesprek in te laten met partijen of haar advocaten, procureurs of
      gemachtigden, of enige bijzondere inlichting of schriftelijk stuk van hen aan te nemen;

      d. de verplichting wordt opgelegd een geheim te bewaren.

      6 In geval van tussentijds ontslag of overlijden wordt een nieuwe bijzondere rechter benoemd.

      7 Bij algemene maatregel van bestuur, worden regels gegeven omtrent de aan de bijzondere rechters toekomende
      vergoedingen.


