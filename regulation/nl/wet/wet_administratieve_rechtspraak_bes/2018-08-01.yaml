  - number: '55'
    text: |-
      De personen, bedoeld in [artikel 7, eerste lid][ref1], zijn bevoegd een bezwaarschrift in te dienen bij het
      bestuursorgaan dat de beschikking heeft genomen, en het beroep bedoeld in artikel 7, eerste lid, pas in te stellen
      nadat het bestuursorgaan op het bezwaarschrift heeft beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0028455#Artikel7
    url: https://wetten.overheid.nl/BWBR0028455/2018-08-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0028455
        artikel: '7'
        hoofdstuk: '2'
  - number: '56'
    text: |-
      1 Het bezwaarschrift wordt ingediend binnen zes weken na de dag waarop de beschikking is gegeven of geldt als
      geweigerd.

      2 De dag waarop de beschikking is verzonden of uitgereikt, geldt als de dag waarop deze is gegeven.

      3 Wanneer het bezwaarschrift na afloop van de daarvoor gestelde termijn is ingediend, blijft niet-ontvankelijkheid
      op grond daarvan achterwege, indien de bezwaarde aantoont dat de termijnoverschrijding het gevolg is van hem
      niet toe te rekenen bijzondere omstandigheden en dat hij het bezwaarschrift heeft ingediend zo spoedig als dit
      redelijkerwijs kon worden verlangd.

      4 Het bestuursorgaan doet bij zijn beschikking mededeling van de mogelijkheid van het indienen van bezwaar bij het
      bestuursorgaan en de beroepstermijn.
    url: https://wetten.overheid.nl/BWBR0028455/2018-08-01#Artikel56
  - number: '57'
    text: |-
      1 Het bezwaarschrift wordt ingediend door de bezwaarde of een door deze aangewezen gemachtigde.

      2 De machtiging wordt bij het bezwaarschrift overgelegd. Een advocaat behoeft geen machtiging over te leggen.

      3 Als woonplaats van de bezwaarde die zich door een gemachtigde doet vertegenwoordigen, wordt aangemerkt de
      woonplaats van die gemachtigde.

      4 Het bezwaarschrift houdt in:

      a. de naam, voornamen en de woonplaats van de bezwaarde en, indien het door een gemachtigde wordt ingediend, tevens
      de naam, voornamen en woonplaats van de gemachtigde;

      b. een duidelijke omschrijving van de beschikking waartegen het bezwaarschrift zich richt;

      c. de gronden waarop het bezwaar berust, waaronder het belang dat de bezwaarde bij de beschikking heeft;

      d. een aanduiding van hetgeen wordt gevorderd;

      e. de ondertekening door de bezwaarde of zijn gemachtigde;

      f. de keuze van een woonplaats op Bonaire, Sint Eustatius of Saba, indien de bezwaarde geen woonplaats heeft op
      Bonaire, Sint Eustatius of Saba.

      5 Bij het bezwaarschrift worden zo mogelijk een kopie van de beschikking en de overige op de beschikking betrekking
      hebbende stukken overgelegd.
    url: https://wetten.overheid.nl/BWBR0028455/2018-08-01#Artikel57
  - number: '58'
    text: |-
      1 Voor het indienen van een bezwaarschrift zijn geen rechten verschuldigd.

      2 De kosten die een partij in verband met de behandeling van het bezwaar redelijkerwijs heeft moeten maken, worden
      door het betrokken overheidslichaam uitsluitend vergoed op verzoek van die partij voor zover de beschikking door
      ernstige onzorgvuldigheid in strijd met het recht is genomen. In geval van een vergoeding van de kosten ten behoeve
      van een partij aan wie een toevoeging is verleend krachtens de [Wet kosteloze rechtskundige bijstand BES][ref1],
      wordt het bedrag van de kosten betaald aan de raadsman.

      3 Het verzoek wordt gedaan voordat het bestuursorgaan op het bezwaar heeft beslist. Het bestuursorgaan beslist op
      het verzoek bij de beslissing op het bezwaar.

      4 Bij algemene maatregel van bestuur worden nadere regels gesteld over de kosten, waarop de vergoeding uitsluitend
      betrekking kan hebben, en over de wijze waarop het bedrag van de kosten wordt vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0028200
    url: https://wetten.overheid.nl/BWBR0028455/2018-08-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0028200
  - number: '59'
    text: |-
      1 Het bestuursorgaan geeft bezwaarden kosteloos een bewijs van ontvangst van het bezwaarschrift af en doet daarbij
      schriftelijk mededeling van de verdere behandeling.

      2 Is het bezwaarschrift ingediend bij een onbevoegd bestuursorgaan, dan zendt dat bestuursorgaan het bezwaarschrift
      naar het bevoegde bestuursorgaan. De dag waarop het bij het onbevoegde bestuursorgaan is ingediend, geldt als de
      dag waarop het is ontvangen.
    url: https://wetten.overheid.nl/BWBR0028455/2018-08-01#Artikel59
  - number: '60'
    text: |-
      1 Indien een bezwaarschrift niet voldoet aan de eisen, gesteld in [artikel 57, vierde lid][ref1], stelt het
      bestuursorgaan de bezwaarde in de gelegenheid de gebreken te herstellen. Daarbij wordt vermeld de termijn, die
      minimaal veertien dagen bedraagt, waarbinnen het herstel van de gebreken dient te geschieden.

      2 Indien de gebreken niet binnen de gestelde termijn zijn hersteld, kan het bestuursorgaan de bezwaarde niet-
      ontvankelijk verklaren.


      [ref1]: https://wetten.overheid.nl/BWBR0028455#Artikel57
    url: https://wetten.overheid.nl/BWBR0028455/2018-08-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0028455
        artikel: '57'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '61'
    text: |-
      1 Indien de bezwaarde niet de persoon is tot wie de beschikking is gericht, zendt het bestuursorgaan onverwijld een
      afschrift van het bezwaarschrift aan degene tot wie de beschikking is gericht. Deze wordt als mede-belanghebbende,
      desgewenst, aangemerkt als partij bij de behandeling van het bezwaarschrift.

      2 Indien er naar het vermoeden van het bestuursorgaan derde-belanghebbenden zijn, kan het bestuursorgaan dezen in
      kennis stellen van het indienen van het bezwaarschrift door middel van een publicatie in de Staatscourant.

      3 De belanghebbenden, bedoeld in het eerste en tweede lid, zijn bevoegd om binnen een termijn van vier weken na de
      datum van verzending van het afschrift, bedoeld in het eerste lid, onderscheidenlijk de publicatie, bedoeld in het
      tweede lid, schrifturen en bewijsstukken, die zij voor de behandeling van het bezwaarschrift dienstig achten, bij
      het bestuursorgaan in te dienen.

      4 Bij overschrijding van de termijn, bedoeld in het derde lid, worden de schrifturen en bewijsstukken niet in
      behandeling genomen. [Artikel 56, vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028455#Artikel56
    url: https://wetten.overheid.nl/BWBR0028455/2018-08-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0028455
        artikel: '56'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '62'
    text: |-
      Het bestuursorgaan stelt het bezwaarschrift en in voorkomend geval de schrifturen en bewijsstukken, bedoeld
      in [artikel 61, derde lid][ref1], voor commentaar in handen van de afdeling of dienst van het betrokken
      overheidslichaam die de bestreden beschikking voorbereid heeft. Het bestuursorgaan stelt daarbij een termijn van
      maximaal dertig dagen.


      [ref1]: https://wetten.overheid.nl/BWBR0028455#Artikel61
    url: https://wetten.overheid.nl/BWBR0028455/2018-08-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0028455
        artikel: '61'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '63'
    text: |-
      1 Het bestuursorgaan legt het bezwaarschrift, de eventuele schrifturen en bewijsstukken, bedoeld in
      [artikel 61, derde lid][ref1], en het commentaar, bedoeld in [artikel 62][ref2], binnen veertien dagen na afloop
      van de termijn, bedoeld in artikel 62, gedurende veertien dagen voor de bezwaarde en andere partijen ter inzage
      op een door het bestuursorgaan te bepalen toegankelijke plaats. Hiervan doet het bestuursorgaan te voren aan de
      bezwaarde en andere partijen schriftelijk mededeling. [Artikel 32][ref3] is van overeenkomstige toepassing.

      2 De bezwaarde en andere partijen kunnen van de ter inzage liggende stukken eenmaal kosteloos kopieën verkrijgen
      van het bestuursorgaan.


      [ref1]: https://wetten.overheid.nl/BWBR0028455#Artikel61
      [ref2]: https://wetten.overheid.nl/BWBR0028455#Artikel62
      [ref3]: https://wetten.overheid.nl/BWBR0028455#Artikel32
    url: https://wetten.overheid.nl/BWBR0028455/2018-08-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0028455
        artikel: '61'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0028455
        artikel: '62'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0028455
        artikel: '32'
        hoofdstuk: '3'
        paragraaf: '6'
  - number: '64'
    text: |-
      1 Het bestuursorgaan nodigt de bezwaarde en andere partijen binnen veertien dagen na afloop van de inzagetermijn,
      bedoeld in [artikel 63, eerste lid][ref1], uit voor een hoorzitting waar zij zich in persoon of bij gemachtigde
      kunnen doen horen. Zij worden in elkaars aanwezigheid gehoord.

      2 Gemachtigden, niet zijnde advocaten, zijn om te kunnen worden gehoord voorzien van een schriftelijke machtiging,
      tenzij zij verschijnen in gezelschap van degene die zij vertegenwoordigen.

      3 Tijdens de hoorzitting is voor het verstrekken van inlichtingen tenminste één vertegenwoordiger van de afdeling
      of dienst van het betrokken overheidslichaam die de bestreden beschikking heeft voorbereid, aanwezig.

      4 Tijdens de hoorzitting kunnen de bezwaarde, de andere partijen, hun gemachtigden en de vertegenwoordiger, bedoeld
      in het derde lid, het woord voeren en vragen beantwoorden.

      5 Tijdens de hoorzitting worden geen nieuwe stukken overgelegd, indien de andere partijen of hun gemachtigden
      daartegen bezwaar maken.

      6 Het bestuursorgaan kan om gewichtige redenen besluiten dat de hoorzitting geheel of gedeeltelijk met gesloten
      deuren wordt gehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0028455#Artikel63
    url: https://wetten.overheid.nl/BWBR0028455/2018-08-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0028455
        artikel: '63'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '65'
    text: |-
      1 Het bestuursorgaan is bevoegd voorafgaand aan of tijdens de hoorzitting, hetzij ambtshalve hetzij op verzoek van
      de bezwaarde, de andere partijen of hun gemachtigden, getuigen, deskundigen en tolken voor de hoorzitting uit te
      nodigen. Indien noodzakelijk, wordt binnen een termijn van veertien dagen een nieuwe hoorzitting belegd.

      2 Getuigen, deskundigen en tolken, ambtshalve door het bestuursorgaan uitgenodigd, kunnen op verzoek een vergoeding
      ten laste van het betrokken overheidslichaam ontvangen. Het [Besluit tarieven in burgerlijke zaken BES][ref1] is
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028448
    url: https://wetten.overheid.nl/BWBR0028455/2018-08-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0028448
  - number: '66'
    text: |-
      Het verslag van de hoorzitting wordt ter kennisneming gezonden aan de bezwaarde, de andere partijen of hun
      gemachtigden, alsmede, indien van de bevoegdheid, bedoeld in [artikel 65, eerste lid][ref1], gebruik is gemaakt, de
      getuigen, deskundigen en tolken.


      [ref1]: https://wetten.overheid.nl/BWBR0028455#Artikel65
    url: https://wetten.overheid.nl/BWBR0028455/2018-08-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0028455
        artikel: '65'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '67'
    text: |-
      Van het houden van een hoorzitting kan worden afgezien, indien:

      a. het bezwaarschrift kennelijk niet-ontvankelijk is;

      b. het bezwaarschrift kennelijk ongegrond is;

      c. de bezwaarde en de andere partijen schriftelijk hebben verklaard geen gebruik te willen maken van het recht om
      te worden gehoord; of

      d. aan het bezwaar volledig tegemoet wordt gekomen en de andere partijen daardoor niet in hun belangen kunnen
      worden geschaad.
    url: https://wetten.overheid.nl/BWBR0028455/2018-08-01#Artikel67
  - number: '68'
    text: |-
      1 Het bestuursorgaan grondt de beschikking in heroverweging op het bezwaarschrift, in voorkomend geval op de
      stukken, bedoeld in [artikel 61, derde lid][ref1], het commentaar, bedoeld in [artikel 62][ref2], en hetgeen
      blijkens het verslag tijdens de hoorzitting naar voren is gebracht.

      2 De beschikking bevat de gronden waarop zij berust, en neemt de plaats in van de bestreden beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0028455#Artikel61
      [ref2]: https://wetten.overheid.nl/BWBR0028455#Artikel62
    url: https://wetten.overheid.nl/BWBR0028455/2018-08-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0028455
        artikel: '61'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0028455
        artikel: '62'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '69'
    text: |-
      1 Het bestuursorgaan beslist uiterlijk vier maanden na de datum van indiening van het bezwaarschrift. Deze termijn
      kan, onder kennisgeving aan de bezwaarde en de andere partijen, eenmaal met ten hoogste dertig dagen worden
      verlengd.

      2 Het bestuursorgaan zendt de beschikking onverwijld aan de bezwaarde en de andere partijen.

      3 [Artikel 16, vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028455#Artikel16
    url: https://wetten.overheid.nl/BWBR0028455/2018-08-01#Artikel69
    references:
      - id: ref1
