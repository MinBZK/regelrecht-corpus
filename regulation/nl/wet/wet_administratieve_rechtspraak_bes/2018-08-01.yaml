  - number: '49'
    text: |-
      1 Het Gerecht doet, behoudens [artikel 52][ref1], schriftelijk uitspraak. De uitspraak bevat de gronden waarop
      zij berust.

      2 De uitspraak vermeldt wanneer en door welke rechter of rechters zij is vastgesteld.

      3 De uitspraak wordt door de rechter of de voorzitter van de meervoudige kamer en de griffier ondertekend. Bij
      verhindering van één van hen wordt de reden daarvan in de uitspraak vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0028455#Artikel52
    url: https://wetten.overheid.nl/BWBR0028455/2018-08-01#Artikel49
