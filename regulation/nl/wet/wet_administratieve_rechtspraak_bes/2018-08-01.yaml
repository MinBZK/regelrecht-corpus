      1 Alle voorgeschreven toezendingen, kennisgevingen en oproepingen vanwege de griffier, het Gerecht of het Hof
      geschieden bij aangetekende brief.

      2 Als dagtekening van de aangetekende brief geldt de dag, waarop de toezending, kennisgeving of oproeping heeft
      plaats gehad.
    url: https://wetten.overheid.nl/BWBR0028455/2018-08-01#Artikel5
