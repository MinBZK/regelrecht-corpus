  - number: '30'
    text: |-
      1 Indien naar zijn oordeel de feiten of omstandigheden nog niet voldoende tot klaarheid zijn gebracht, kan het
      Gerecht een voorbereidend onderzoek gelasten.

      2 Het Gerecht kan bepalen dat het voorbereidend onderzoek wordt verricht door een lid of plaatsvervangend lid van
      het Hof dan wel door een rechter-plaatsvervanger in eerste aanleg, als rechter-commissaris.

      3 De rechter-commissaris is bevoegd:

      a. de door het Gerecht als getuige of deskundige opgegeven personen of anderen wier verhoor hem ter uitvoering van
      zijn opdracht wenselijk voorkomt, op te roepen om te verschijnen op de plaats bij die oproeping bepaald;

      b. aan deskundigen op te dragen schriftelijk verslag en advies uit te brengen binnen een door hem te bepalen
      termijn;

      c. vergezeld van de door hem voor het onderzoek dringend noodzakelijke getuigen en deskundigen binnen te treden in
      alle plaatsen;

      d. aanvullende ambtsberichten in te winnen als bedoeld in [artikel 28][ref1];

      e. schriftelijke inlichtingen in te winnen als bedoeld in [artikel 29][ref2];

      f. een comparitie van partijen te bevelen.

      4 Van het binnentreden wordt een proces-verbaal opgemaakt dat binnen tweemaal 24 uur aan de bewoner in afschrift
      wordt uitgereikt of toegezonden.

      5 Tijd en plaats van een voorgenomen plaatselijk onderzoek of een verhoor van getuigen en deskundigen worden
      door de rechter-commissaris, zo mogelijk, tijdig vooraf ter kennis van alle partijen gebracht. Deze kunnen bij
      het plaatselijk onderzoek en het verhoor van getuigen en deskundigen aanwezig zijn en verzoeken, dat door hen
      meegebrachte personen als getuige en deskundige zullen worden gehoord. De rechter-commissaris kan bevelen, dat dit
      geheel of gedeeltelijk zal plaats hebben buiten tegenwoordigheid van een partij. Van een plaatselijk onderzoek of
      verhoor wordt een proces-verbaal opgemaakt.

      6 De rechter-commissaris handhaaft de orde ter plaatse, waar hij zijn ambtsverrichtingen vervult. Hij heeft daarbij
      de bevoegdheden in [artikel 41][ref3] aan het Gerecht verleend voor het handhaven van de orde ter terechtzitting.

      7 De uitkomsten van het voorbereidend onderzoek worden door de rechter-commissaris geconstateerd bij proces-
      verbaal. Na afloop van het onderzoek zendt de rechter-commissaris de door het Gerecht in zijn handen gestelde
      stukken van de behandeling terug. Hij voegt daarbij het opgemaakte proces-verbaal.

      8 De rechter-commissaris wordt in zijn ambtsverrichtingen bijgestaan door de griffier, die hem bij het
      voorbereidend onderzoek vergezelt, de vereiste processen-verbaal opstelt, deze met hem ondertekent en namens hem
      getuigen en deskundigen oproept. [Artikel 46, zesde lid][ref4], is van overeenkomstige toepassing.

      9 Indien het Gerecht of de rechter-commissaris bezichtiging ter plaatse nodig oordeelt, verlenen
      overheidsinstanties desgevraagd de medewerking die in het belang van het onderzoek vereist is. De
      [artikelen 23][ref5] en [24][ref6] zijn van overeenkomstige toepassing.

      10 [Artikel 44][ref7] is van overeenkomstige toepassing op het voorbereidend onderzoek.


