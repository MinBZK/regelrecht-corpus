  - number: '29'
    text: |-
      1 Het Gerecht kan de indiener van het beroepschrift, de andere partijen en andere natuurlijke of privaatrechtelijke
      rechtspersonen verzoeken binnen een door het Gerecht te stellen termijn schriftelijk inlichtingen te verschaffen
      en onder hen berustende of te hunner beschikking staande stukken over te leggen. Degene aan wie het Gerecht het
      verzoek richt, is verplicht tot het verschaffen van de gevraagde inlichtingen en het overleggen van de gevraagde
      stukken.

      2 Het Gerecht is bevoegd deskundigen op te dragen om binnen een door het Gerecht te bepalen termijn schriftelijk
      verslag en advies uit te brengen. Van de opdracht aan de deskundige geeft de griffier aan alle partijen kennis.
      Partijen kunnen binnen zeven dagen na de dag van verzending van het verslag aan hen schriftelijk hun zienswijze ter
      zake naar voren brengen. Het Gerecht kan deze termijn verlengen.

      3 [Artikel 24][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028455#Artikel24
