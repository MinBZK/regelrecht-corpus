      Het Gerecht doet uitspraak op beroepschriften ingevolge [artikel 9 van de Cessantiawet BES][ref1] en
      beroepschriften inzake sociale en volksverzekeringen, voor zover in de daarop betrekking hebbende wetten beroep op
      het Gerecht is opengesteld. Alsdan is deze wet van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028304#Artikel9
