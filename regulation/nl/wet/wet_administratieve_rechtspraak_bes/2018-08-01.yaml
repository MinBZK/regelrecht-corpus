  - number: '51'
    text: |-
      1 De uitspraak van het Gerecht wordt zo spoedig mogelijk openbaar gemaakt door mededeling daarvan in een openbare
      zitting van het Gerecht. Het Gerecht kan bepalen dat de mededeling plaatsvindt in een ander eilandgebied dan waar
      de behandeling heeft plaats gevonden.

      2 Van de uitspraak van het Gerecht zendt de griffier onverwijld na de openbaarmaking daarvan kosteloos een door hem
      getekend afschrift aan partijen.
    url: https://wetten.overheid.nl/BWBR0028455/2018-08-01#Artikel51
  - number: '52'
    text: |-
      1 Het Gerecht kan aan het slot van de zitting mondeling uitspraak doen, indien de behandeling van het beroepschrift
      zich daartoe leent. De uitspraak kan met het oog daarop voor ten hoogste veertien dagen worden verdaagd onder
      aanzegging aan de op de zitting verschenen partijen van dag en uur van de uitspraak. De mondelinge uitspraak
      bestaat uit een opgave van de beslissing van het Gerecht en van de daarvoor gebezigde gronden.

      2 Van de mondelinge uitspraak wordt proces-verbaal opgemaakt. Het proces-verbaal wordt door de rechter of, wanneer
      toepassing is gegeven aan [artikel 11, tweede lid][ref1], door de voorzitter van de meervoudige kamer en de
      griffier ondertekend. [Artikel 46, zesde lid][ref2], is van overeenkomstige toepassing.

      3 Met betrekking tot het proces-verbaal, bedoeld in het tweede lid, is [artikel 51, tweede lid][ref3], van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028455#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0028455#Artikel46
      [ref3]: https://wetten.overheid.nl/BWBR0028455#Artikel51
