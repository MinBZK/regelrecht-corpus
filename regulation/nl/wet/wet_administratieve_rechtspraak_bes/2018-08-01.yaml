        artikel: '37'
        hoofdstuk: '3'
        paragraaf: '7'
  - number: '40'
    text: |-
      1 Getuigen, deskundigen en tolken, op last van het Gerecht opgeroepen, kunnen op hun verzoek een vergoeding
      ten laste van de Staat ontvangen. Het [Besluit tarieven in burgerlijke zaken BES][ref1] is van overeenkomstige
      toepassing.

      2 Personen aangesteld in openbare dienst, ontvangen geen vergoeding indien zij in verband met hun taak zijn
      opgeroepen.

      3 Getuigen en deskundigen door partijen meegebracht of opgeroepen, ontvangen van dezen een vergoeding, indien zij
      daarom verzoeken. Het [Besluit tarieven in burgerlijke zaken BES][ref2] is van overeenkomstige toepassing.

      4 Het Gerecht begroot de ingevolge dit artikel verschuldigde vergoeding. De begroting is op de minuut uitvoerbaar
      overeenkomstig het [Wetboek van Burgerlijke Rechtsvordering BES][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0028448
      [ref2]: https://wetten.overheid.nl/BWBR0028448
      [ref3]: https://wetten.overheid.nl/BWBR0028496
