  - number: '91'
    text: |-
      De schorsing en voorlopige voorziening vervallen zodra door het Gerecht op het beroepschrift uitspraak is gedaan,
      voor zover in de beslissing van het Gerecht geen eerder tijdstip is aangegeven.
    url: https://wetten.overheid.nl/BWBR0028455/2018-08-01#Artikel91
  - number: '92'
    text: |-
      1 De schorsing van een beschikking ten aanzien waarvan bij wettelijk voorschrift openbare bekendmaking is
      voorgeschreven, zomede de wijziging en opheffing van een dergelijke schorsing worden door het tot die bekendmaking
      bevoegde gezag op gelijke wijze bekend gemaakt.

      2 Ten aanzien van een voorlopige voorziening handelt het bevoegde gezag zoveel mogelijk overeenkomstig het eerste
      lid.
    url: https://wetten.overheid.nl/BWBR0028455/2018-08-01#Artikel92
  - number: '93'
    text: |-
      Een afschrift van de beslissing met betrekking tot een schorsing, voorlopige voorziening of oplegging van een
      dwangsom, alsmede van die met betrekking tot de opheffing of wijziging daarvan wordt onverwijld aan alle partijen
      gezonden.
    url: https://wetten.overheid.nl/BWBR0028455/2018-08-01#Artikel93
  - number: '94'
    text: |-
      1 Een verzoek als bedoeld in [artikel 85, eerste lid][ref1], kan ook worden ingediend in het kader van het in
      [artikel 8][ref2] bedoelde beroep. Alsdan worden de bevoegdheden van het Gerecht, bedoeld in deze paragraaf,
      uitgeoefend door de voorzitter van de meervoudige kamer van het Gerecht.

      2 Een verzoek als bedoeld in [artikel 85, eerste lid][ref3], kan ook worden gedaan in het kader van het in
      [artikel 75][ref4] bedoelde het hoger beroep. Alsdan worden de bevoegdheden van het Gerecht, bedoeld in deze
      paragraaf, uitgeoefend door de voorzitter van het Hof.


      [ref1]: https://wetten.overheid.nl/BWBR0028455#Artikel85
      [ref2]: https://wetten.overheid.nl/BWBR0028455#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0028455#Artikel85
      [ref4]: https://wetten.overheid.nl/BWBR0028455#Artikel75
