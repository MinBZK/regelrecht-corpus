      1 In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. *Hof:* het Gemeenschappelijk Hof van Justitie van Aruba, Curaçao, Sint Maarten en van Bonaire, Sint Eustatius
      en Saba;

      b. *Gerecht:* het Gerecht in eerste aanleg van Bonaire, Sint Eustatius en Saba;

      c. *griffier:* de griffier van het Hof onderscheidenlijk van het Gerecht.

      2 De algemene maatregel van rijksbestuur bedoeld in
      [artikel 39 van de Rijkswet Gemeenschappelijk Hof van Justitie][ref1] is van toepassing op de administratieve
      rechtspraak, tenzij in deze wet anders is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0028070#Artikel39
