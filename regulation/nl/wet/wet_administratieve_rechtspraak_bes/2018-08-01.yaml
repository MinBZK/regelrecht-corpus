        artikel: '33'
        hoofdstuk: '3'
        paragraaf: '7'
  - number: '28'
    text: |-
      1 Het Gerecht kan aanvullende ambtsberichten inwinnen. Het kan deze ambtsberichten ook inwinnen bij andere
      overheidsinstanties dan het betrokken bestuursorgaan.

      2 De overheidsinstantie waaraan een ambtsbericht is gevraagd, zendt dit onder bijvoeging van alle zich onder zijn
      berusting bevindende, op het beroepschrift betrekking hebbende, stukken toe aan het Gerecht.

      3 Het Gerecht kan een termijn stellen waarbinnen het ambtsbericht moet worden uitgebracht.

      4 De [artikelen 23][ref1] en [24][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028455#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0028455#Artikel24
