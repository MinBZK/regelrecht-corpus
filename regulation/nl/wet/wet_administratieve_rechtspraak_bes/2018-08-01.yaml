  - number: '13'
    text: |-
      1 De bijzondere rechters leggen de volgende eed of belofte af:

      «Ik zweer (beloof) getrouwheid aan de Koning, gehoorzaamheid aan de wettelijke regelingen, eerbied voor de
      rechterlijke autoriteiten, en dat ik geen zaak zal aanraden of verdedigen, die ik in gemoede niet gelove
      rechtvaardig te zijn.»

      2 Alvorens tot die eed of belofte te worden toegelaten, leggen zij de volgende eed (verklaring en belofte) van
      zuivering af: «Ik zweer (verklaar), dat ik middellijk noch onmiddellijk, onder welke naam of voorwendsel ook,
      tot het verkrijgen van mijn aanstelling, aan iemand wie hij ook zij, iets heb gegeven of beloofd, noch zal
      geven. Ik zweer (beloof), dat ik nimmer enige giften of geschenken hoe ook genaamd, zal aannemen of ontvangen
      van enig persoon van wie ik weet of vermoed dat hij in een rechtszaak is of zal worden betrokken, waarin mijn
      ambtsverrichtingen te pas zouden kunnen komen. Zo waarlijk helpe mij God Almachtig (Dat beloof ik)».

      3 De eedsaflegging (verklaring en belofte) van de bijzondere rechters geschiedt ten overstaan van de president van
      het Hof of een door deze aangewezen ambtenaar.
    url: https://wetten.overheid.nl/BWBR0028455/2018-08-01#Artikel13
  - number: '14'
    text: |-
      Bij de beraadslaging over rechtszaken maken eerst de bijzondere rechters, van de jongstbenoemde tot de oudste,
      en als laatste de voorzitter hun gevoelen kenbaar. In diezelfde volgorde heeft, zo nodig, de stemming plaats. Er
      wordt beslist bij meerderheid van stemmen. Een rechter, die niet bij de beraadslaging aanwezig kan zijn, kan zijn
      gevoelen niet schriftelijk kenbaar maken of door een van zijn mederechters doen voordragen.
    url: https://wetten.overheid.nl/BWBR0028455/2018-08-01#Artikel14
  - number: '15'
    text: |-
      1 Het beroep wordt aanhangig gemaakt met een aan het Gerecht gericht beroepschrift, dat in tweevoud wordt ingediend
      bij de griffie van het Gerecht dat zijn zittingsplaats heeft in het eilandgebied waar de indiener zijn woonplaats
      heeft.

      2 Het beroepschrift kan worden ingediend door degene die tot het beroep gerechtigd is, of door een door deze
      aangewezen gemachtigde. De machtiging wordt schriftelijk gegeven en bij het beroepschrift overgelegd.

      3 In afwijking van het tweede lid behoeft een advocaat geen machtiging over te leggen.

      4 Als woonplaats van de indiener die zich door een gemachtigde doet vertegenwoordigen, wordt aangemerkt de
      woonplaats van die gemachtigde.

      5 Het beroepschrift houdt in:

      a. de naam, voornamen en woonplaats van de indiener van het beroepschrift en, indien het door een gemachtigde wordt
      ingediend, tevens de naam, voornamen en woonplaats van die gemachtigde;

      b. een duidelijke omschrijving van de beschikking waartegen het beroep is gericht;

      c. de gronden waarop het beroep berust, waaronder het belang dat de indiener bij het beroep heeft;

      d. een aanduiding van hetgeen gevorderd wordt;

      e. de ondertekening door de indiener of zijn gemachtigde;

      f. de keuze van een domicilie op Bonaire, Sint Eustatius of Saba, indien de indiener geen woonplaats heeft op
      Bonaire, Sint Eustatius of Saba;

      g. de dagtekening.

      6 Bij het beroepschrift worden zo mogelijk de beschikking waarop het beroepschrift betrekking heeft, en de overige
      op de beschikking betrekking hebbende stukken overgelegd.
    url: https://wetten.overheid.nl/BWBR0028455/2018-08-01#Artikel15
  - number: '16'
    text: |-
      1 Het beroepschrift wordt ingediend binnen zes weken na de dag waarop de beschikking is gegeven, of geldt als
      geweigerd.

      2 De dag waarop de beschikking is verzonden of uitgereikt, geldt als de dag waarop deze is gegeven.

      3 Wanneer het beroepschrift na afloop van de daarvoor gestelde termijn is ingediend, blijft niet-
      ontvankelijkverklaring op grond daarvan achterwege, indien de indiener aantoont dat de termijnoverschrijding
      het gevolg is van niet aan hem toe te rekenen bijzondere omstandigheden en dat hij het beroep heeft ingesteld zo
      spoedig als dit redelijkerwijs verlangd kon worden.

      4 Het bestuursorgaan doet bij zijn beschikking mededeling van de mogelijkheid van het indienen van beroep en de
      termijn, waarbinnen het beroepschrift moet worden ingediend. In de oorspronkelijke beschikking wordt gewezen op
      de mogelijkheid van het indienen van een bezwaarschrift en de termijn waarbinnen het bezwaarschrift moet worden
      ingediend.
    url: https://wetten.overheid.nl/BWBR0028455/2018-08-01#Artikel16
  - number: '17'
    text: |-
      1 Voor het indienen van een beroepschrift wordt van de indiener door de griffier een griffierecht geheven van USD
      84,–, met uitzondering van beroepschriften als bedoeld in [artikel 8][ref1], waarvoor een griffiegeld wordt geheven
      van USD 28,–. Indien twee of meer personen gezamenlijk een beroepschrift indienen terzake van eenzelfde beschikking
      is slechts éénmaal bedoeld recht verschuldigd. Het griffierecht kan worden gewijzigd bij algemene maatregel van
      bestuur.

      2 Een natuurlijke persoon kan vrijstelling van betaling van het recht, bedoeld in het eerste
      lid, vragen. Hij legt daartoe aan het Gerecht over een bewijs van onvermogen, bedoeld in
      [artikel 878, tweede lid, van het Wetboek van Burgerlijke Rechtsvordering BES][ref2].

      3 Aan de natuurlijke persoon die vrijstelling van het recht, bedoeld in het eerste lid, vraagt, maar die niet in
      staat is tijdig een bewijs van onvermogen over te leggen, kan het Gerecht voorlopige vrijstelling verlenen.

      4 Indien voorlopige vrijstelling wordt geweigerd, dient de indiener het volle griffierecht te storten. Zodra het
      bewijs van onvermogen alsnog door de indiener is overgelegd en hem op grond daarvan vrijstelling is verleend, wordt
      het gestorte bedrag zo spoedig mogelijk door de griffier aan hem terugbetaald.

      5 Het beroepschrift wordt niet in behandeling genomen voordat het verschuldigde griffierecht ter griffie is
      ontvangen. Indien het verschuldigde recht niet is gestort binnen vier weken na de dag van verzending van een
      mededeling waarin de griffier de indiener van het beroepschrift op de verschuldigdheid van het bedrag heeft
      gewezen, wordt de indiener door het Gerecht niet-ontvankelijk verklaard.

      6 Aan de indiener van het beroepschrift wordt, bij intrekking ervan om redenen dat het bestuursorgaan geheel of
      gedeeltelijk aan zijn bezwaren is tegemoetgekomen, het door hem gestorte griffierecht vergoed door dat orgaan. In
      de overige gevallen heeft het bestuursorgaan bij intrekking van het beroepschrift de bevoegdheid het gestorte recht
      geheel of gedeeltelijk te vergoeden.

      7 Bij gegrondverklaring van het beroepschrift houdt de uitspraak van het Gerecht tevens in dat aan de indiener van
      het beroepschrift het door hem gestorte griffierecht wordt vergoed ten laste van het bij de uitspraak aangewezen
      overheidslichaam.

      8 Het gestorte griffierecht wordt terugbetaald door het Gerecht, indien [artikel 54, derde lid][ref3], van
      toepassing is


