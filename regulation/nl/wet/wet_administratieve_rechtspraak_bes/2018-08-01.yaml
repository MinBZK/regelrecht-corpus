        bwb_id: BWBR0028455
        artikel: '31'
        hoofdstuk: '3'
        paragraaf: '6'
  - number: '34'
    text: |-
      1 Voor aanvang van de openbare behandeling van een beroepschrift door het Gerecht kan de zittende rechter of,
      indien het een beroepschrift betreft als bedoeld in [artikel 8][ref1], elk der zittende leden, door partijen worden
      gewraakt op grond van feiten en omstandigheden die het vormen van een onpartijdig oordeel zouden belemmeren.

      2 Een rechter wiens wraking is verzocht, kan in de wraking berusten.

      3 Omtrent de wraking beslist het Hof.

      4 Indien een rechter berust in de wraking of de wraking wordt toegestaan, wijst de President van het Hof een andere
      rechter aan.


      [ref1]: https://wetten.overheid.nl/BWBR0028455#Artikel8
    url: https://wetten.overheid.nl/BWBR0028455/2018-08-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0028455
        artikel: '8'
        hoofdstuk: '2'
  - number: '35'
    text: |-
      De behandeling van een beroepschrift in een openbare zitting kan met toestemming van alle partijen achterwege
      blijven.
    url: https://wetten.overheid.nl/BWBR0028455/2018-08-01#Artikel35
  - number: '36'
    text: |-
      Een gemachtigde niet zijnde advocaat, moet voorzien zijn van een schriftelijke machtiging, tenzij de gemachtigde
      verschijnt in gezelschap van de betrokken partij.
    url: https://wetten.overheid.nl/BWBR0028455/2018-08-01#Artikel36
  - number: '37'
    text: |-
      1 Het Gerecht kan een partij schriftelijk doen oproepen om in een openbare zitting persoonlijk te verschijnen tot
      het geven van inlichtingen.

      2 Geldt de oproeping een privaatrechtelijke rechtspersoon of een overheidsinstantie, dan verschijnt een der
      bestuursleden onderscheidenlijk een der bestuurders, tenzij de oproeping een of meer bepaalde bestuursleden
      onderscheidenlijk een of meer bepaalde bestuurders aanwijst.
    url: https://wetten.overheid.nl/BWBR0028455/2018-08-01#Artikel37
  - number: '38'
    text: |-
      1 Het Gerecht is bevoegd, hetzij ambtshalve hetzij op verzoek van partijen of hun gemachtigden, getuigen,
      deskundigen en tolken schriftelijk te doen oproepen.

      2 Namen en woonplaatsen van de getuigen, deskundigen en tolken worden bij de oproeping, bedoeld in het eerste lid,
      aan alle partijen en hun gemachtigden zoveel mogelijk meegedeeld.

      3 Partijen of hun gemachtigden kunnen getuigen en deskundigen, wier verhoor zij wenselijk achten, meebrengen of bij
      deurwaardersexploot oproepen, mits daarvan tijdig aan het Gerecht is kennis gegeven, onder opgave van hun namen en
      woonplaatsen. Van een en ander wordt door de Griffier aan de andere partijen en hun gemachtigden mededeling gedaan.

      4 Zij die ingevolge dit artikel als getuige, deskundige of tolk zijn opgeroepen, zijn verplicht aan die oproeping
      gevolg te geven.
    url: https://wetten.overheid.nl/BWBR0028455/2018-08-01#Artikel38
  - number: '39'
    text: |-
      Het Gerecht kan bevelen dat getuigen, deskundigen en tolken die, hoewel wettelijk opgeroepen, niet zijn verschenen,
      en partijen die aan een oproeping, bedoeld in [artikel 37][ref1], geen gevolg hebben gegeven, door de sterke arm
      voor hem worden gebracht om aan hun verplichting te voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0028455#Artikel37
    url: https://wetten.overheid.nl/BWBR0028455/2018-08-01#Artikel39
