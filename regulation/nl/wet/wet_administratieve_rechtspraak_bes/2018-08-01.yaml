  - number: '80'
    text: |-
      1 Tegen een uitspraak, bedoeld in [artikel 79][ref1], kunnen alle partijen binnen twee weken na de
      dag van verzending schriftelijk verzet doen bij het Gerecht. De indiener van het verzetschrift dient
      gemotiveerd aan te geven met welke overwegingen in de uitspraak hij zich niet kan verenigen. De
      [artikelen 15, eerste tot en met derde lid][ref2], [20][ref3] en [22][ref4] zijn van overeenkomstige toepassing.

      2 Alvorens uitspraak te doen op het verzet stelt het Gerecht de indiener van het verzetschrift die daarom vraagt,
      in de gelegenheid om in een openbare zitting te worden gehoord en de schrifturen, ambtsberichten en bewijsstukken
      in te zien, tenzij het aanstonds van oordeel is dat het verzet gegrond is. De [artikelen 41][ref5], [42][ref6] en
      [46][ref7] zijn van overeenkomstige toepassing.

      3 Is het Gerecht van oordeel dat het verzet gegrond is, dan vervalt de uitspraak, bedoeld in [artikel 79][ref8], en
      wordt het beroepschrift in verdere behandeling genomen door het Gerecht.

      4 Op de uitspraak zijn de [artikelen 49 tot en met 53][ref9] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028455#Artikel79
      [ref2]: https://wetten.overheid.nl/BWBR0028455#Artikel15
