  - number: '85'
    text: |-
      1 Een beschikking waartegen een beroepschrift bij het Gerecht is ingediend, of waaromtrent een bestuurlijke
      heroverweging plaatsvindt als bedoeld in [hoofdstuk 4][ref1], kan op verzoek van de indiener van het beroepschrift
      onderscheidenlijk de bezwaarde geheel of gedeeltelijk door het Gerecht worden geschorst op grond dat de uitvoering
      van de beschikking voor hem een onevenredig nadeel met zich mee zal brengen in verhouding tot het door een
      onmiddellijke uitvoering van de beschikking te dienen belang. Ook kan op zijn verzoek een voorlopige voorziening
      worden getroffen ter voorkoming van onevenredig nadeel als in de eerste volzin bedoeld.

      2 Het verzoek, bedoeld in het eerste lid, wordt gericht tot het Gerecht, bedoeld in [artikel 15][ref2].

      3 De [artikelen 15, eerste tot en met derde lid][ref3], [20][ref4] en [22][ref5] zijn van overeenkomstige
      toepassing op het verzoek. [Artikel 17][ref6] is van overeenkomstige toepassing, indien het betreft een
      verzoek terzake van een beschikking waaromtrent een bestuurlijke heroverweging plaatsvindt als bedoeld in
      [hoofdstuk 4][ref7].


