        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '70'
    text: |-
      1 Het bestuursorgaan is bevoegd de behandeling van bezwaarschriften, waaronder begrepen het houden van de
      hoorzitting, bedoeld in [artikel 64][ref1], op te dragen aan een adviescommissie. Die adviescommissie adviseert het
      bestuursorgaan omtrent de in heroverweging te nemen beschikking.

      2 Het bestuursorgaan kan, indien het zich verenigt met het advies van de adviescommissie, het advies met de gronden
      waarop het berust, tot zijn standpunt maken en opnemen in de beschikking.

      3 Indien het bestuursorgaan afwijkt van het advies van de adviescommissie, geeft het in zijn beschikking de redenen
      daarvoor aan.

      4 Indien het derde lid van toepassing is, zendt het bestuursorgaan het advies van de adviescommissie met de
      beschikking aan de bezwaarde en de andere partijen.


      [ref1]: https://wetten.overheid.nl/BWBR0028455#Artikel64
    url: https://wetten.overheid.nl/BWBR0028455/2018-08-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0028455
        artikel: '64'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '71'
    text: |-
      1 Het bestuursorgaan wijst een oneven aantal en tenminste drie personen aan als lid van de adviescommissie. Het
      bestuursorgaan wijst uit hun midden een voorzitter aan.

      2 De leden van de adviescommissie mogen niet inhoudelijk betrokken zijn geweest bij de totstandkoming van de
      bestreden beschikking.

      3 De adviescommissie wordt terzijde gestaan door een door het bestuursorgaan aan te wijzen secretaris, afkomstig
      uit de afdeling of dienst van het betrokken overheidslichaam, die belast is met juridische aangelegenheden.
    url: https://wetten.overheid.nl/BWBR0028455/2018-08-01#Artikel71
  - number: '72'
    text: |-
      Het bestuursorgaan stelt de adviescommissie voor het uitoefenen van haar taak de benodigde faciliteiten
      beschikbaar.
    url: https://wetten.overheid.nl/BWBR0028455/2018-08-01#Artikel72
  - number: '73'
    text: |-
      De voorzitter van de adviescommissie oefent de bevoegdheden uit, bedoeld in de [artikelen 59][ref1],
      [60, eerste lid][ref2], [61][ref3], [62][ref4], [63][ref5], [64, eerste en zesde lid][ref6], en [65][ref7], en
      regelt de orde van de hoorzitting, bedoeld in artikel 64. Hij wordt bij de uitoefening van zijn bevoegdheden
      terzijde gestaan door de secretaris.


      [ref1]: https://wetten.overheid.nl/BWBR0028455#Artikel59
      [ref2]: https://wetten.overheid.nl/BWBR0028455#Artikel60
