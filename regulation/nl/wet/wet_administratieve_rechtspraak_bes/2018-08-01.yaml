      [artikel 81, eerste lid][ref2], onmiddellijk afwijzen indien dit kennelijk niet-ontvankelijk dan wel kennelijk
      ongegrond is. De [artikelen 49 tot en met 53][ref3] zijn van overeenkomstige toepassing op deze uitspraak.


