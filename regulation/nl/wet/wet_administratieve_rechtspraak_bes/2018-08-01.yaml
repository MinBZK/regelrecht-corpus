  - number: '53'
    text: |-
      De griffier is bevoegd afschriften en uittreksels van uitspraken van het Gerecht te verstrekken. Aan de verzoeker
      worden in rekening gebracht de kosten ten behoeve van het maken van deze afschriften en uitreksels.
    url: https://wetten.overheid.nl/BWBR0028455/2018-08-01#Artikel53
  - number: '54'
    text: |-
      1 Het Gerecht kan, indien nog geen gebruik is gemaakt van [artikel 55][ref1], in elke fase voorafgaand aan de
      openbare behandeling van het beroepschrift het beroepschrift toezenden aan het bestuursorgaan dat de bestreden
      beschikking heeft gegeven, met het gemotiveerde verzoek om binnen een door het Gerecht te stellen termijn te
      verklaren of het bereid is de beschikking in heroverweging te nemen.

      2 Luidt het antwoord op het verzoek, bedoeld in het eerste lid, ontkennend of blijft dit binnen de gestelde termijn
      achterwege, dan wordt het beroepschrift door het Gerecht in behandeling genomen.

      3 Luidt het antwoord op het verzoek, bedoeld in het eerste lid, bevestigend, dan wordt het beroepschrift niet door
      het Gerecht in behandeling genomen. De [artikelen 59, eerste lid][ref2], en [61 tot en met 74][ref3] zijn alsdan
      van toepassing.

      4 Indien het Gerecht een beroepschrift niet in behandeling neemt om de reden, genoemd in het derde lid, dan geeft
      het daarvan onverwijld kennis aan de indiener van het beroepschrift.


      [ref1]: https://wetten.overheid.nl/BWBR0028455#Artikel55
      [ref2]: https://wetten.overheid.nl/BWBR0028455#Artikel59
      [ref3]: https://wetten.overheid.nl/BWBR0028455#Artikel61
