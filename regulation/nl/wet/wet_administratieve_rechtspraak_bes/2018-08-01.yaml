      1 In deze wet en de daarop berustende bepalingen wordt onder bestuursorgaan verstaan een persoon of een college met
      enig openbaar gezag bekleed, met uitzondering van:

      a. de kamers en de verenigde vergadering van de Staten-Generaal;

      b. de eilandsraden en de kiescolleges voor de Eerste Kamer, tenzij het betreft het nemen van beschikkingen, bedoeld
      in [artikel 3][ref1];

      c. onafhankelijke, bij wet of rijkswet ingestelde, organen die met rechtspraak zijn belast;

      d. de hoofdstembureaus en stembureaus, bedoeld in de [Kieswet][ref2].

      2 Onder de organen, bedoeld in het eerste lid, zijn begrepen de voorzitters, de leden, de commissies uit hun
      midden, de griffiers en de secretarissen.


