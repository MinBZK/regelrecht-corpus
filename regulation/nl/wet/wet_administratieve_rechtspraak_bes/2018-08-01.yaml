  - number: '100'
    text: |-
      Een ieder die betrokken is bij de uitvoering van deze wet en daarbij de beschikking krijgt over gegevens waarvan
      hij het vertrouwelijke karakter kent of redelijkerwijs moet vermoeden, en voor wie niet reeds uit hoofde van
      ambt, beroep of wettelijk voorschrift ter zake van die gegevens een geheimhoudingsplicht geldt, is verplicht tot
      geheimhouding daarvan, behoudens voor zover enig wettelijk voorschrift hem tot bekendmaking verplicht of uit zijn
      taak bij de uitvoering van deze wet de noodzaak tot bekendmaking voortvloeit.
    url: https://wetten.overheid.nl/BWBR0028455/2018-08-01#Artikel100
  - number: '101'
    text: |-
      1 Met de straf, bedoeld in de [artikelen 198][ref1] en [463 het Wetboek van Strafrecht BES][ref2], wordt bedreigd
      degene die als getuige, deskundige of tolk, ingevolge deze wet ter zitting verschenen, een in deze wet omschreven
      verplichting niet nakomt.

      2 Met dezelfde straf wordt bedreigd degene die opzettelijk of wederrechtelijk weigert de gevraagde medewerking,
      bedoeld in [artikel 29, eerste lid][ref3], te verlenen.

      3 Met dezelfde straf wordt bedreigd degene die opzettelijk of wederrechtelijk niet voldoet aan de in
      [artikel 100][ref4] opgenomen verplichting.


