  - number: '79'
    text: |-
      1 Het Gerecht kan onmiddellijk uitspraak doen indien het kennelijk onbevoegd is, het beroep kennelijk niet
      ontvankelijk is, dan wel het beroep kennelijk niet-ontvankelijk, dan wel verdere behandeling van het beroepschrift
      hem niet nodig voorkomt, omdat:

      a. het verzoek kennelijk ongegrond is;

      b. de bestreden beschikking kennelijk niet in stand kan blijven;

      c. de bestreden beschikking door het bevoegde bestuursorgaan is ingetrokken of gewijzigd, en daarmee kennelijk aan
      de bezwaren van de indiener van het beroepschrift is tegemoet gekomen.

      2 Op de uitspraak, bedoeld in het eerste lid, zijn de [artikelen 49 tot en met 53][ref1] van overeenkomstige
      toepassing. Partijen wordt gewezen op [artikel 80, eerste lid][ref2].

      3 Indien het betreft een beroep, bedoeld in [artikel 8][ref3], wordt de in het eerste lid bedoelde bevoegdheid
      uitgeoefend door de voorzitter van de meervoudige kamer van het Gerecht.

      4 Het eerste, tweede en derde lid alsmede [artikel 80][ref4] zijn van overeenkomstige toepassing in het kader van
      hoger beroep, bedoeld in [artikel 75][ref5]. Alsdan wordt de in het eerste lid bedoelde bevoegdheid uitgeoefend
      door de voorzitter van het Hof.


      [ref1]: https://wetten.overheid.nl/BWBR0028455#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0028455#Artikel80
