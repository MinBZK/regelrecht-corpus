  - number: '31'
    text: |-
      1 Het beroepschrift en de daarop betrekking hebbende schrifturen en bewijsstukken, bij het Gerecht aanwezig,
      worden, onverminderd de [artikelen 23][ref1], [24][ref2], [28][ref3], [29][ref4] en [30][ref5], neergelegd ter
      griffie of op een andere door het Gerecht te bepalen plaats. Hiervan wordt aan alle partijen mededeling gedaan.

      2 Partijen kunnen de schrifturen en bewijsstukken binnen een door het Gerecht bepaalde en aan hen meegedeelde
      termijn, welke in de regel ten minste zeven dagen beloopt, inzien en daarvan afschriften of uittreksels vragen.

      3 Aan partijen worden de kosten van deze afschriften en uittreksels in rekening gebracht, uitgezonderd de indiener
      van een beroepschrift die is vrijgesteld van het betalen van het recht, bedoeld in [artikel 17, eerste lid][ref6].


