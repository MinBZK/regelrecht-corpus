  - number: '76'
    text: |-
      Het hoger beroep wordt binnen zes weken na de datum waarop van de uitspraak van het Gerecht kennis is gegeven
      op de wijze, bedoeld in de [artikelen 51, tweede lid][ref1], en [52, derde lid][ref2], aanhangig gemaakt middels
      een aan het Hof gericht beroepschrift, dat ingediend wordt ter griffie van het Gerecht waarvan de uitspraak wordt
      aangevochten.


      [ref1]: https://wetten.overheid.nl/BWBR0028455#Artikel51
      [ref2]: https://wetten.overheid.nl/BWBR0028455#Artikel52
