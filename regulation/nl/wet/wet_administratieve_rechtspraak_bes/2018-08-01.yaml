      1 De [Wet kosteloze rechtskundige bijstand BES][ref1] is van overeenkomstige toepassing op de behandeling van
      beroepschriften, bedoeld in deze wet.

      2 Stukken opgemaakt ter voldoening aan de bepalingen van deze wet zijn vrij van zegel en worden, voor zover zulks
      vereist wordt, kosteloos geregistreerd.


      [ref1]: https://wetten.overheid.nl/BWBR0028200
