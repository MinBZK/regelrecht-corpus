  - number: '78'
    text: |-
      1 Het Hof bevestigt de uitspraak, hetzij met overneming hetzij met verbetering van de gronden, of doet, met gehele
      of gedeeltelijke vernietiging van de uitspraak, hetgeen het Gerecht had behoren te doen.

      2 Wanneer het Gerecht de niet-ontvankelijkheid heeft uitgesproken en het Hof deze uitspraak vernietigt met een
      ontvankelijkverklaring, wordt het beroepschrift naar het Gerecht terugverwezen om te worden hervat in de stand
      waarin de behandeling zich bevond. [Hoofdstuk 3][ref1] is van toepassing. Tegen de nieuwe uitspraak van het Gerecht
      staat binnen de in [artikel 76][ref2] genoemde termijn hoger beroep open op het Hof.

      3 Het Hof kan de terugverwijzing, bedoeld in het tweede lid, achterwege laten indien het beroepschrift kennelijk
      gegrond of kennelijk ongegrond is.


      [ref1]: https://wetten.overheid.nl/BWBR0028455#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0028455#Artikel76
    url: https://wetten.overheid.nl/BWBR0028455/2018-08-01#Artikel78
