  - number: '45'
    text: |-
      Na afloop van het verhoor worden partijen of hun gemachtigden in de gelegenheid gesteld, naar aanleiding van
      hetgeen door de getuigen en deskundigen is verklaard, het woord te voeren.
    url: https://wetten.overheid.nl/BWBR0028455/2018-08-01#Artikel45
  - number: '46'
    text: |-
      1 De griffier maakt proces-verbaal op van de zitting.

      2 Het proces-verbaal vermeldt het volgnummer van het beroepschrift, de datum van de zitting, de naam van de rechter
      of rechters, de naam van de griffier, de namen van de partijen en hun gemachtigden die ter zitting zijn verschenen,
      alsmede de namen van de ter zitting verschenen getuigen, deskundigen en tolken.

      3 Het proces-verbaal houdt verder een korte vermelding in van hetgeen ter zitting met betrekking tot het
      beroepschrift voorvalt.

      4 Het proces-verbaal wordt door de rechter of de voorzitter van de meervoudige kamer en de griffier ondertekend.
      Bij verhindering van één van hen wordt de reden daarvan in het proces-verbaal vermeld.

      5 Het Gerecht kan, ambtshalve of op verzoek van een partij bepalen dat de verklaring van een partij, getuige of
      deskundige geheel in het proces-verbaal van de zitting zal worden opgenomen. In dat geval wordt de verklaring
      terstond op schrift gesteld, aan die partij, getuige of deskundige voorgelezen en door deze met het Gerecht en
      de griffier medeondertekend. Heeft geen ondertekening plaats, dan wordt de reden daarvan in het proces-verbaal
      vermeld.

      6 De rechter kan bepalen dat geen griffier aanwezig zal zijn ter zitting. In dat geval wordt het proces-verbaal
      door hem opgemaakt en slechts door hem ondertekend.
    url: https://wetten.overheid.nl/BWBR0028455/2018-08-01#Artikel46
  - number: '47'
    text: |-
      1 Het Gerecht beraadslaagt en beslist in raadkamer en grondt de uitspraak uitsluitend op hetgeen ter zitting te
      berde is gebracht en op de stukken, bedoeld in [§ 6][ref1] van dit hoofdstuk.

      2 Het Gerecht vult ambtshalve de rechtsgronden aan. Het Gerecht kan ambtshalve de feiten aanvullen.


      [ref1]: https://wetten.overheid.nl/BWBR0028455#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0028455/2018-08-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0028455
        hoofdstuk: '3'
        paragraaf: '6'
  - number: '48'
    text: |-
      1 Blijkt tijdens de behandeling in raadkamer dat het onderzoek niet volledig is geweest, dan kan de behandeling van
      het beroepschrift worden hervat. Van een hervatting wordt terstond door de griffier schriftelijk mededeling gedaan
      aan alle partijen.

      2 [§ 5][ref1] van dit hoofdstuk is van overeenkomstige toepassing op de voortgezette behandeling van het
      beroepschrift.

      3 Indien nieuwe schrifturen of bewijsstukken aan het procesdossier worden toegevoegd, wordt opnieuw toepassing
      gegeven aan [§ 6][ref2] van dit hoofdstuk.

      4 Alvorens opnieuw in raadkamer te beraadslagen en te beslissen, vindt wederom een openbare behandeling plaats met
      inachtneming van [§ 7][ref3] van dit hoofdstuk.


      [ref1]: https://wetten.overheid.nl/BWBR0028455#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0028455#Hoofdstuk3
      [ref3]: https://wetten.overheid.nl/BWBR0028455#Hoofdstuk3
