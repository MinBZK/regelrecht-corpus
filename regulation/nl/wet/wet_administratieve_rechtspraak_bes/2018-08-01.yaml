  - number: '97'
    text: |-
      1 Indien een bestuursorgaan aan een onherroepelijke uitspraak van het Gerecht, bedoeld in de [artikelen 49][ref1],
      [53][ref2], [79][ref3], [80][ref4] of [95][ref5], voor zover deze niet verplicht tot betaling van een bepaald
      geldbedrag, naar zijn oordeel geen of geen volledig gevolg kan geven binnen de bij die uitspraak gestelde termijn
      of – bij het ontbreken van zulk een termijn – binnen redelijke tijd, geeft het daarvan kennis aan de andere
      partijen. Indien het niet of niet volledig gevolg geven zijn oorzaak vindt in nieuwe feiten of omstandigheden
      die zich hebben voorgedaan nadat de beschikking waarop de uitspraak betrekking heeft, is gegeven, doet het
      bestuursorgaan daarvan gelijktijdig mededeling.

      2 Indien een mededeling als bedoeld in het eerste lid, tweede volzin, is gedaan, kunnen de andere partijen zich
      met een verzoek om voorziening wenden tot het Gerecht. Op dit verzoek is [hoofdstuk 3][ref6], met uitzondering van
      [artikel 17][ref7], van overeenkomstige toepassing.


