  - number: '41'
    text: |-
      Het Gerecht zorgt tijdens de zitting voor de handhaving van de orde en is bevoegd wanneer de orde op enige wijze
      door een aanwezige wordt verstoord, degene die dit doet of alle aanwezigen te doen vertrekken.
    url: https://wetten.overheid.nl/BWBR0028455/2018-08-01#Artikel41
  - number: '42'
    text: |-
      Om gewichtige, in het proces-verbaal van de zitting te vermelden, redenen kan het Gerecht besluiten dat de
      behandeling van het beroepschrift geheel of gedeeltelijk zal plaatsvinden in een zitting met gesloten deuren.
    url: https://wetten.overheid.nl/BWBR0028455/2018-08-01#Artikel42
  - number: '43'
    text: |-
      1 Ter zitting verschenen partijen of hun gemachtigden worden in de gelegenheid gesteld het woord te voeren.

      2 Het Gerecht is bevoegd aan partijen en hun gemachtigden vragen te stellen.
    url: https://wetten.overheid.nl/BWBR0028455/2018-08-01#Artikel43
  - number: '44'
    text: |-
      1 De getuigen zijn verplicht getuigenis af te leggen, de deskundigen en tolken hun diensten als
      zodanig te verlenen, een en ander behoudens geldige redenen van verschoning of overeenkomstig het
      [Wetboek van Strafvordering BES][ref1].

      2 Het Gerecht kan bevelen dat getuigen niet worden gehoord en tolken niet tot de uitoefening van hun taak worden
      toegelaten dan na het afleggen van een eed of belofte. Zij leggen in dat geval de eed of belofte af in handen van
      het Gerecht.

      3 De formule van de eed of belofte luidt voor de getuigen: dat zij zullen zeggen de gehele waarheid en niets dan de
      waarheid; voor de tolken: dat zij hun plichten als tolk met nauwgezetheid zullen vervullen.

      4 Het Gerecht ondervraagt de getuigen en deskundigen. Partijen of hun gemachtigden kunnen met toestemming van het
      Gerecht en door zijn tussenkomst aan getuigen en deskundigen vragen stellen.

      5 Getuigen en deskundigen, overeenkomstig [artikel 38][ref2] ter zitting meegebracht of opgeroepen, kunnen ook bij
      verzuim van de daar vermelde kennisgeving worden gehoord, tenzij de andere partijen of hun gemachtigden daartegen
      bezwaar maken.

      5 De volgorde waarin de getuigen en deskundigen worden gehoord, alsmede de met het oog op hun onbevangenheid ter
      zitting te nemen maatregelen worden door het Gerecht bepaald.

      6 Getuigen, deskundigen en tolken mogen zich niet verwijderen dan nadat het Gerecht hun daartoe verlof heeft
      gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0028681
      [ref2]: https://wetten.overheid.nl/BWBR0028455#Artikel38
    url: https://wetten.overheid.nl/BWBR0028455/2018-08-01#Artikel44
