  - number: '7'
    text: |-
      1 Natuurlijke personen of rechtspersonen, die door een beschikking rechtstreeks in hun belang zijn getroffen,
      kunnen daartegen beroep instellen bij het Gerecht. Ten aanzien van bestuursorganen worden de hun toevertrouwde
      belangen als hun belangen beschouwd. Ten aanzien van rechtspersonen worden mede als hun belangen beschouwd de
      belangen die zij krachtens hun doelstellingen en blijkens hun feitelijke werkzaamheden behartigen.

      2 Geen beroep staat open tegen een beschikking:

      a. houdende intrekking of vaststelling van de inwerkingtreding van een algemeen verbindend voorschrift;

      b. houdende goedkeuring van een in onderdeel a bedoelde beschikking;

      c. die aan goedkeuring onderworpen is;

      d. houdende schorsing of vernietiging van een besluit van een ander bestuursorgaan;

      e. inzake de procedure ter voorbereiding van een besluit, tenzij deze beschikking de belanghebbende los van het
      voor te bereiden besluit rechtstreeks in zijn belang treft;

      f. ter voorbereiding van een privaatrechtelijke rechtshandeling, met uitzondering van een beschikking houdende
      weigering van de goedkeuring van een dergelijke beschikking;

      g. waartegen beroep bij een andere administratieve rechter kan of kon worden ingesteld;

      h. waarover krachtens wet de rechterlijke macht is of moet worden gehoord;

      i. die is gegeven op grond van bepalingen van strafrechtelijke aard;

      j. houdende de beoordeling van het kennen of kunnen van iemand die te dier zake is geëxamineerd of op andere wijze
      is getoetst;

      k. inhoudende een technische beoordeling van een voertuig, vaartuig of luchtvaartuig en de daarop of daarin
      aanwezige apparatuur alsmede een meetmiddel, een onderdeel daaraan of een hulpinrichting daarvoor;

      l. op grond van een in een wettelijk voorschrift voor het geval van buitengewone omstandigheden toegekende
      bevoegdheid of opgelegde verplichting in deze omstandigheden genomen;

      m. op grond van een wettelijk voorschrift ter beveiliging van de militaire belangen van het Koninkrijk of diens
      bondgenoten genomen;

      o. op grond van een wettelijk voorschrift inzake de militaire dienst genomen, voor zover het betreft de inlijving,
      werkelijke dienst, groot verlof of ontslag, tenzij de beschikking betrekking heeft op verlenging van werkelijke
      dienst, kostwinnersvergoeding of vrijstelling van militaire dienst;

      p. inzake de nummering van kandidaatlijsten, de geldigheid van lijstverbindingen, het verloop van de stemming, de
      stemopneming, de vaststelling van de uitslag bij de verkiezing van de leden van vertegenwoordigende organen, de
      benoemdverklaring in opengevallen plaatsen, de toelating van nieuwe leden van de eilandsraad, alsmede de verlening
      van tijdelijk ontslag wegens zwangerschap en bevalling of ziekte;

      q. beschikkingen gegeven op grond van de [Wet beëindiging arbeidsovereenkomsten BES][ref1].


