  - number: '82'
    text: |-
      1 Na ontvangst van een verzoek, bedoeld in [artikel 81, eerste lid][ref1], bepaalt het Gerecht zo spoedig mogelijk
      plaats, dag en uur, waarop de openbare zitting zal plaatsvinden en doet daarvan onverwijld mededeling aan partijen.
      Aan het bestuursorgaan dat de beschikking waartegen beroep wordt ingesteld, heeft genomen, wordt een afschrift van
      de ingediende stukken gezonden.

      2 Het bestuursorgaan is bevoegd tot zeven dagen voor de zitting schrifturen en bewijsstukken in te dienen ter
      griffie, tenzij het Gerecht anders bepaalt. De griffier zendt een afschrift van deze stukken aan de andere
      partijen.

      3 Blijkt het Gerecht ter zitting dat het beroepschrift niet voldoende spoedeisend is om een versnelde behandeling
      te rechtvaardigen, of dat een versnelde behandeling van het beroepschrift een onevenredig nadeel met zich mee
      zal brengen in verhouding tot de daarmee te dienen belangen, dan bepaalt het Gerecht dat alsnog toepassing wordt
      gegeven aan de [artikelen 23 tot en met 32][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0028455#Artikel81
      [ref2]: https://wetten.overheid.nl/BWBR0028455#Artikel23
