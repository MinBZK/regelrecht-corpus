  - number: '81'
    text: |-
      1 Indien het belang van een partij een onverwijlde uitspraak vordert, kan deze het Gerecht gemotiveerd verzoeken
      het beroepschrift versneld te behandelen, zonder toepassing van de [artikelen 23 tot en met 32][ref1].

      2 In afwijking van [artikel 17, vijfde lid][ref2], wordt een beroep waarbij een verzoek als bedoeld in het eerste
      lid, is gedaan, ook in behandeling genomen voordat ter griffie het verschuldigde recht is ontvangen en wordt
      de indiener niet-ontvankelijk verklaard indien ter griffie het verschuldigde recht niet is ontvangen binnen de
      termijn, bedoeld in artikel 17, vijfde lid. Het Gerecht kan een kortere termijn stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0028455#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0028455#Artikel17
