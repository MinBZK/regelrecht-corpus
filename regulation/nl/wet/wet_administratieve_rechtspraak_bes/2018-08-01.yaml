  - number: '98'
    text: |-
      1 Indien een kennisgeving zonder mededeling of geen kennisgeving als bedoeld in [artikel 97, eerste lid][ref1], is
      gedaan, kunnen de andere partijen zich tot het Gerecht wenden met het verzoek om toekenning van een vergoeding dan
      wel om te bepalen dat het bestuursorgaan alsnog aan de uitspraak van het Gerecht gevolg geeft.

      2 Het verzoek, bedoeld in het eerste lid, wordt gedaan binnen zes weken na verzending van de kennisgeving,
      of indien geen kennisgeving is gedaan, binnen zes weken na het einde van het tijdsverloop, bedoeld in
      [artikel 97, eerste lid][ref2].

      3 Indien de grief, dat niet of niet volledig aan de uitspraak van het Gerecht gevolg is gegeven, gegrond wordt
      bevonden, kan het Gerecht uitspreken dat de partijen, bedoeld in het eerste lid, ten laste van het bij zijn
      uitspraak aangewezen overheidslichaam een bij die uitspraak vast te stellen vergoeding wordt toegekend, dan wel
      dat het bestuursorgaan alsnog binnen een door het Gerecht te stellen termijn aan de uitspraak van het Gerecht
      gevolg dient te geven. In het laatste geval bepaalt het Gerecht tevens dat indien en zolang of zo dikwijls het
      bestuursorgaan aan de uitspraak geen of geen volledig gevolg geeft, het door hem aan te wijzen overheidslichaam
      aan de partijen, bedoeld in het eerste lid, een door het Gerecht vast te stellen dwangsom verbeurt.
      [Artikel 23, tweede lid][ref3], is van overeenkomstige toepassing.

      4 Op de uitspraak, bedoeld in het derde lid, zijn de [artikelen 49 tot en met 53][ref4] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028455#Artikel97
