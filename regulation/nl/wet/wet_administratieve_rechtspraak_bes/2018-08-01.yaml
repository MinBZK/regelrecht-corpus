    text: |-
      1 Beroep kan worden ingesteld ter zake dat de beschikking in strijd is met:

      a. een algemeen verbindend voorschrift;

      b. een algemeen rechtsbeginsel.

      2 Indien het eerste lid, onderdeel b, toepassing heeft gevonden, wordt in de uitspraak aangegeven welk algemeen
      rechtsbeginsel geschonden is geoordeeld.
