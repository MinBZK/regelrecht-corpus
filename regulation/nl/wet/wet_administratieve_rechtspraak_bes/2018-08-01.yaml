  - number: '88'
    text: Schorsing stuit onmiddellijk de werking van de bestreden beschikking.
    url: https://wetten.overheid.nl/BWBR0028455/2018-08-01#Artikel88
  - number: '89'
    text: |-
      1 Het Gerecht kan in zijn beslissing bepalen dat indien of zolang het bestuursorgaan aan de schorsing of
      voorlopige voorziening niet of niet volledig gevolg heeft gegeven, het door hem bij die beslissing aan te wijzen
      overheidslichaam aan de indiener van het beroepschrift een dwangsom verbeurt. [Artikel 23, tweede lid][ref1], is
      van overeenkomstige toepassing.

      2 Zonodig kan het Gerecht bij nadere beslissing bepalen dat een dwangsom als in het eerste lid bedoeld, verbeurd
      wordt. Het kan daaraan ook zijn eerdere beslissing, bedoeld in [artikel 86][ref2], aanpassen. Het Gerecht
      beslist na verhoor, althans na behoorlijke schriftelijke oproeping daartoe, van partijen of hun gemachtigden.
      De [artikelen 33, tweede lid][ref3], [37][ref4], [23, tweede lid][ref5], en [87][ref6] zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028455#Artikel23
