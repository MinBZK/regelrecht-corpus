  - number: '95'
    text: |-
      1 Indien een verzoek als bedoeld in [artikel 85, eerste lid][ref1], is gedaan en het Gerecht oordeelt dat de feiten
      geen nader onderzoek vergen en mits met schriftelijke toestemming van alle partijen, dan wel indien het Gerecht
      oordeelt dat de behandeling van het beroepschrift zelf moet leiden tot de uitspraak dat het beroep kennelijk niet-
      ontvankelijk, kennelijk ongegrond of kennelijk gegrond is, kan het onmiddellijk uitspraak op het beroepschrift
      doen.

      2 Op de uitspraak, bedoeld in het eerste lid, zijn de [artikelen 49 tot en met 53][ref2] van overeenkomstige
      toepassing. Indien het Gerecht kennelijk onbevoegd is, dan wel het beroep kennelijk niet-ontvankelijk, kennelijk
      ongegrond of kennelijk gegrond is, is [artikel 80][ref3] van overeenkomstige toepassing.

      3 Indien het betreft een beroep als bedoeld in [artikel 8][ref4], wordt de in het eerste lid bedoelde bevoegdheid
      uitgeoefend door de voorzitter van de meervoudige kamer van het Gerecht.


