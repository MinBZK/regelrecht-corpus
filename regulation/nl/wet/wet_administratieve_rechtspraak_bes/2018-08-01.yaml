  - number: '32'
    text: |-
      Het Gerecht kan in het belang van de geestelijke of lichamelijke gezondheid van een partij, ambtshalve of op
      verzoek van het betrokken bestuursorgaan, bepalen dat het inzien van geneeskundige of psychologische rapporten niet
      is toegestaan aan een partij persoonlijk, maar uitsluitend aan een gemachtigde die hetzij geneeskundige, hetzij
      advocaat, hetzij academisch gevormd psycholoog is, dan wel van het Gerecht bijzondere toestemming heeft verkregen.
    url: https://wetten.overheid.nl/BWBR0028455/2018-08-01#Artikel32
  - number: '33'
    text: |-
      1 Alle partijen en hun gemachtigden worden opgeroepen om na afloop van de in [artikel 31, tweede lid][ref1],
      genoemde termijn in een openbare zitting van het Gerecht te verschijnen, ten einde desgewenst hun standpunt toe
      te lichten.

      2 Het Gerecht bepaalt plaats en tijdstip van de zitting.


      [ref1]: https://wetten.overheid.nl/BWBR0028455#Artikel31
    url: https://wetten.overheid.nl/BWBR0028455/2018-08-01#Artikel33
