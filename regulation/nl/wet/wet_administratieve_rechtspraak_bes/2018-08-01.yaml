  - number: '87'
    text: |-
      1 Het Gerecht is bevoegd, hetzij ambtshalve hetzij op verzoek van partijen of hun gemachtigden, getuigen,
      deskundigen en tolken te doen oproepen. Partijen kunnen getuigen en deskundigen, wier verhoor zij wenselijk
      achten, meebrengen ter zitting, mits zij voor aanvang van de zitting het Gerecht kennis geven van de namen en
      woonplaatsen van deze personen. De [artikelen 40][ref1] en [44][ref2] zijn van overeenkomstige toepassing. De
      [artikelen 38, derde en vierde lid][ref3], en [39][ref4] zijn van overeenkomstige toepassing indien de oproeping
      schriftelijk geschiedt.

      2 Het horen geschiedt in het openbaar. De [artikelen 41][ref5], [42][ref6] en [46][ref7] zijn van overeenkomstige
      toepassing.

      3 Indien het Gerecht van oordeel is dat partijen er niet door in hun belangen worden geschaad, kan het op het
      verzoek beslissen met terzijdestelling van [artikel 86 en het eerste en tweede lid][ref8].


