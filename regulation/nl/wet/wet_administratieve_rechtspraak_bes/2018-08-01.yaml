  - number: '74'
    text: |-
      1 De adviescommissie beraadslaagt aansluitend aan de hoorzitting in raadkamer over het aan het bestuursorgaan uit
      te brengen advies. Het advies wordt ondertekend door de voorzitter en de secretaris en met stukken, bedoeld in
      [artikel 68, eerste lid][ref1], ter beslissing aangeboden aan het bestuursorgaan.

      2 Het bestuursorgaan is niet bevoegd nader advies te vragen inzake het advies van de adviescommissie.


