  - number: '18'
    text: |-
      De griffier houdt een algemeen register bij, waarin alle bij het Gerecht aanhangige beroepschriften, elk
      beroepschrift onder een afzonderlijk nummer, worden ingeschreven met de namen van de indieners en andere partijen
      en hun woonplaatsen, alsmede, zo zij die hebben, van hun gemachtigden en hun woonplaatsen. In het register wordt,
      met vermelding van de dagtekening, tevens kort aantekening gehouden van het voorgevallene en de terzake gedane
      uitspraken. Het register is openbaar.
    url: https://wetten.overheid.nl/BWBR0028455/2018-08-01#Artikel18
  - number: '19'
    text: |-
      De griffier is verplicht naar vermogen en kosteloos aan de indieners van een beroepschrift en de andere partijen
      de inlichtingen te verschaffen, die zij voor het aanhangig maken en de behandeling van een beroepschrift bij het
      Gerecht nodig hebben.
    url: https://wetten.overheid.nl/BWBR0028455/2018-08-01#Artikel19
  - number: '20'
    text: |-
      1 De griffier tekent op het beroepschrift de datum van ontvangst aan en geeft op verzoek van de indiener of zijn
      gemachtigde kosteloos een bewijs van ontvangst af.

      2 Is het beroepschrift ingediend bij een onbevoegd Gerecht of het Hof, dan zendt het Gerecht of het Hof het
      beroepschrift naar de bevogde rechter of het bevoegde bestuursorgaan. De dag waarop het bij het eerste Gerecht of
      het Hof is ingediend, geldt als de dag waarop het is ontvangen.
    url: https://wetten.overheid.nl/BWBR0028455/2018-08-01#Artikel20
  - number: '21'
    text: Het Gerecht is bevoegd samenhangende beroepschriften te voegen en gevoegde beroepschriften te splitsen.
    url: https://wetten.overheid.nl/BWBR0028455/2018-08-01#Artikel21
  - number: '22'
    text: |-
      1 Een beroepschrift dat niet aan de bij [artikel 15][ref1] gestelde eisen voldoet, wordt door de griffier aan de
      indiener in persoon of, indien een gemachtigde is aangewezen, aan die gemachtigde met mondelinge of schriftelijke
      opgave van redenen ter verbetering of aanvulling dan wel ter bijvoeging van de machtiging of andere bescheiden
      teruggegeven of teruggezonden. Daarbij wordt vermeld de termijn waarbinnen de verbetering of aanvulling van het
      beroepschrift dan wel de bijvoeging van de machtiging of andere bescheiden dient te geschieden.

      2 Indien binnen de vastgestelde termijn het beroepschrift niet is verbeterd of aangevuld, dan wel de machtiging
      of andere bescheiden niet zijn bijgevoegd, kan het Gerecht de indiener van het beroepschrift niet-ontvankelijk
      verklaren.


      [ref1]: https://wetten.overheid.nl/BWBR0028455#Artikel15
    url: https://wetten.overheid.nl/BWBR0028455/2018-08-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0028455
        artikel: '15'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '23'
    text: |-
      1 De griffier zendt onverwijld een afschrift van het beroepschrift en van de daarbij behorende bescheiden aan het
      bestuursorgaan. Daarbij wordt een bevelschrift van het Gerecht gevoegd tot het onverwijld overleggen van alle op
      het beroepschrift betrekking hebbende stukken. Indien het bestuursorgaan weigert op het beroepschrift betrekking
      hebbende stukken over te leggen, kan het Gerecht bepalen dat het door hem aan te wijzen overheidslichaam aan de
      indiener een door hem vast te stellen dwangsom verbeurt voor elke dag, dat het orgaan in gebreke blijft.

      2 Het in het [Wetboek van Burgerlijke Rechtsvordering BES][ref1] omtrent de dwangsom bepaalde is van
      overeenkomstige toepassing.

      3 Bij de toezending van het beroepschrift aan het bestuursorgaan wordt vermeld de termijn waarbinnen een
      verweerschrift kan worden ingediend. Deze termijn kan het Gerecht verlengen zo dikwijls het belang van de
      behandeling van het beroepschrift dat vordert. Bij het indienen van het verweerschrift wordt een afschrift daarvan
      bijgevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0028496
    url: https://wetten.overheid.nl/BWBR0028455/2018-08-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0028496
  - number: '24'
    text: |-
      1 Het bestuursorgaan kan, voorzover gewichtige redenen daartoe aanleiding geven, het verstrekken van inlichtingen
      of stukken weigeren dan wel meedelen dat uitsluitend het Gerecht kennis mag nemen van de verstrekte inlichtingen
      of stukken.

      2 Van gewichtige redenen is in ieder geval geen sprake, voorzover ingevolge de
      [Wet openbaarheid van bestuur BES][ref1] de verplichting bestaat om een verzoek om informatie, vervat in de te
      verstrekken stukken, in te willigen.

      3 Het Gerecht beslist terzake van de gerechtvaardigdheid van een weigering of beperking, bedoeld in het eerste lid.

      4 Indien het Gerecht beslist dat een weigering, bedoeld in het eerste lid, gerechtvaardigd is, vervalt de
      verplichting, bedoeld in [artikel 23][ref2].

      5 Indien het Gerecht beslist dat een beperking, bedoeld in het eerste lid, gerechtvaardigd is, kan het slechts met
      toestemming van de andere partijen mede op grondslag van de in dat lid bedoelde inlichtingen of stukken uitspraak
      doen.


      [ref1]: https://wetten.overheid.nl/BWBR0028154
      [ref2]: https://wetten.overheid.nl/BWBR0028455#Artikel23
    url: https://wetten.overheid.nl/BWBR0028455/2018-08-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0028154
      - id: ref2
        bwb_id: BWBR0028455
        artikel: '23'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: '25'
    text: |-
      De griffier zendt een afschrift van het verweerschrift onverwijld aan de indiener van het beroepschrift of diens
      gemachtigde.
    url: https://wetten.overheid.nl/BWBR0028455/2018-08-01#Artikel25
  - number: '26'
    text: |-
      1 Degene die door het Gerecht als mede- of derde-belanghebbende wordt aangemerkt, wordt partij in de behandeling.
      De griffier zendt onverwijld een afschrift van het beroepschrift en het verweerschrift aan deze partij.

      2 De griffier deelt de belanghebbende, bedoeld in het eerste lid, mee dat hij binnen een termijn van vier weken
      schrifturen en bewijsstukken, die hij voor de behandeling van het beroepschrift dienstig acht, kan indienen. Deze
      termijn kan door het Gerecht worden verlengd zo dikwijls het belang van de behandeling van het beroepschrift dat
      naar zijn oordeel vordert.

      3 Indien er naar het vermoeden van het Gerecht onbekende derde-belanghebbenden zijn, kan het Gerecht de griffier
      opdragen dat de mededeling, bedoeld in het tweede lid, tevens wordt gedaan door aankondiging in de Staatscourant.
      De laatste volzin van het tweede lid is van overeenkomstige toepassing.

      4 De schrifturen moeten door de belanghebbende, bedoeld in het eerste lid, of zijn gemachtigde worden ondertekend.
      [Artikel 15][ref1] is van overeenkomstige toepassing, met dien verstande dat twee afschriften van de schrifturen
      moeten worden bijgevoegd.

      5 De griffier tekent op de schrifturen de dag van ontvangst aan en zendt onverwijld een afschrift daarvan aan de
      indiener van het beroepschrift en het bestuursorgaan.


      [ref1]: https://wetten.overheid.nl/BWBR0028455#Artikel15
    url: https://wetten.overheid.nl/BWBR0028455/2018-08-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0028455
        artikel: '15'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '27'
    text: |-
      1 Op grond van bijzondere omstandigheden kan het Gerecht de indiener van het beroepschrift toestaan om binnen een
      door het Gerecht te bepalen termijn een conclusie van repliek in te dienen. In dat geval wordt het bestuursorgaan
      toegestaan een conclusie van dupliek in te dienen, nadat het kennis heeft kunnen nemen van de conclusie van
      repliek. Het Gerecht stelt daarvoor eenzelfde termijn als is gesteld aan de indiening van de conclusie van repliek.

      2 Het Gerecht kan de termijn, bedoeld in het eerste lid, op verzoek van de betreffende partij verlengen of
      verkorten.

      3 De conclusies van repliek en dupliek, bedoeld in het eerste lid, worden door de griffier onverwijld toegezonden
      aan de andere partijen. Aan dezen wordt toegestaan een aanvullende schriftuur in te dienen binnen eenzelfde termijn
      als gegund is aan de indiener en het bestuursorgaan.

      4 Partijen kunnen tot zeven dagen voor de zitting, bedoeld in [artikel 33][ref1], nadere stukken indienen. Op deze
      bevoegdheid wordt gewezen in de oproeping voor de zitting.


      [ref1]: https://wetten.overheid.nl/BWBR0028455#Artikel33
    url: https://wetten.overheid.nl/BWBR0028455/2018-08-01#Artikel27
