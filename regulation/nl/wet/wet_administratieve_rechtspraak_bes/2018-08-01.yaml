      1 De behandeling van het beroep en de uitspraak geschieden door het Gerecht.

      2 Wanneer [artikel 8][ref1] van toepassing is, geschieden de behandeling en de uitspraak door een meervoudige kamer
      van het Gerecht, bestaande uit een lid van het Hof als voorzitter en twee bijzondere rechters.

      3 De bevoegdheden die in de [artikelen 17, tweede, derde en vierde lid][ref2], [21][ref3], [23][ref4],
      [26 tot en met 32][ref5], [37 tot en met 40][ref6], [44, tweede, derde, zesde en zevende lid][ref7], [48][ref8] en
      [54][ref9] zijn toegekend aan het Gerecht, worden in geval van behandeling door een meervoudige kamer uitgeoefend
      door de voorzitter.


