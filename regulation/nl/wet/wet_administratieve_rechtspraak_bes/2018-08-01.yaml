  - number: '96'
    text: |-
      1 Herziening van een onherroepelijke uitspraak van het Gerecht, bedoeld in de [artikelen 49][ref1], [53][ref2],
      [79][ref3], [80][ref4] en [95][ref5], en van het Hof, bedoeld in de [artikelen 78][ref6], 79, 80 en [84][ref7]
      kan op verzoek van een partij plaatsvinden op grond van nader gebleken feiten of omstandigheden die hebben
      plaatsgevonden vóór de uitspraak, die de verzoekende partij redelijkerwijs niet bekend konden zijn, en die waren
      zij eerder bekend geweest, tot een andere uitspraak zouden hebben kunnen leiden.

      2 Op het verzoek om herziening zijn de [hoofdstukken 3][ref8] en [6, paragrafen 1 tot en met 3][ref9], zoveel nodig
      van overeenkomstige toepassing.


