      1 In deze wet en de daarop berustende bepalingen wordt verstaan onder beschikking: een schriftelijk besluit van een
      bestuursorgaan inhoudende een publiekrechtelijke rechtshandeling die niet van algemene strekking is.

      2 Met een beschikking wordt een weigering om een beschikking te geven gelijk gesteld.

      3 Wanneer de wettelijk gestelde termijn voor het geven van een beschikking is verstreken zonder dat een beschikking
      is gegeven of – bij het ontbreken van zulk een termijn – wanneer niet binnen redelijke tijd een beschikking is
      gegeven, geldt dat als het weigeren van het geven van een beschikking.
    url: https://wetten.overheid.nl/BWBR0028455/2018-08-01#Artikel3
