  - number: '86'
    text: |-
      Het Gerecht beslist in raadkamer met spoed op het verzoek, na het horen, althans na behoorlijke schriftelijke
      oproeping daartoe, van alle partijen of hun gemachtigden. De [artikelen 33, tweede lid][ref1], en [37][ref2] zijn
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028455#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0028455#Artikel37
