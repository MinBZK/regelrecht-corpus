    text: |-
      De schorsing, voorlopige voorziening en beslissing tot oplegging van een dwangsom kunnen worden opgeheven
      of gewijzigd door het Gerecht nadat het partijen of hun gemachtigden heeft gehoord, althans na behoorlijke
