  - number: '84'
    text: |-
      1 Een verzoek als bedoeld in [artikel 81, eerste lid][ref1], kan ook worden gedaan in het kader van een beroep,
      als bedoeld in [artikel 8][ref2]. Alsdan worden de bevoegdheden van het Gerecht, bedoeld in de artikelen 81, tweede
      lid, [82][ref3] en [83][ref4], uitgeoefend door de voorzitter van de meervoudige kamer van het Gerecht.

      2 Een verzoek als bedoeld in [artikel 81, eerste lid][ref5], kan ook worden gedaan in het kader van het hoger
      beroep, bedoeld in [artikel 75][ref6]. Alsdan worden de bevoegdheden van het Gerecht, bedoeld in de artikelen 81,
      tweede lid, [82][ref7] en [83][ref8], uitgeoefend door de voorzitter van het Hof.


