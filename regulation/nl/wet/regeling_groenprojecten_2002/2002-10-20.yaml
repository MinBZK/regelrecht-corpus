  - number: '4'
    text: |-
      1 Een verklaring kan slechts worden aangevraagd door en afgegeven aan:

      a. een kredietinstelling als bedoeld in
      [artikel 1, eerste lid, onderdeel a, onder 1°, van de Wet toezicht kredietwezen 1992][ref1] die is ingeschreven in
      het register, bedoeld in artikel 52 van die wet, of

      b. een beleggingsinstelling die is ingeschreven in het register, bedoeld in
      [artikel 18 van de Wet toezicht beleggingsinstellingen][ref2].

      2 De aanvraag voor projecten bedoeld in [artikel 2, onderdelen a tot en met f][ref3], dient te worden ingediend bij
      het Ministerie van Landbouw, Natuurbeheer en Visserij en voor de overige projecten bij de Nederlandse onderneming
      voor energie en milieu bv.

      3 Voor projecten als bedoeld in [artikel 2, onderdeel h][ref4], kan een verklaring slechts worden aangevraagd
      indien op de dag van indiening van een aanvraag tot afgifte van een verklaring nog geen aanvang met de uitvoering
      van de werkzaamheden is gemaakt.

      4 Voor projecten waarvoor reeds eerder een verklaring is afgegeven kan een nieuwe aanvraag eerst drie jaar voor de
      afloop van de geldende verklaring worden ingediend.

      5 De aanvraag wordt ingediend met gebruikmaking van een formulier dat door de Minister van Volkshuisvesting,
      Ruimtelijke Ordening en Milieubeheer op aanvraag beschikbaar wordt gesteld.

      6 Aan een aanvrager kan worden verzocht nadere gegevens te verstrekken die van belang kunnen zijn voor de
      beoordeling van het project.

      7 Aan een aanvrager kan worden verzocht een accountantsverklaring te overleggen, waaruit de juistheid of
      aannemelijkheid van de in de aanvraag vermelde gegevens blijkt.


