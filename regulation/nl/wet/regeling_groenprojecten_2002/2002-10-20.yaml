    text: |-
      1 Deze regeling geeft uitvoering aan
      [artikel 5.14, derde lid, onderdeel a, en zesde lid, van de Wet inkomstenbelasting 2001][ref1] met betrekking tot
      de aanwijzing van en verklaring voor projecten welke in Nederland zijn gelegen.

      2 In deze regeling wordt verstaan onder:



              a

                *project:*


                in Nederland gelegen technisch, functioneel en in de tijd samenhangend geheel van activa en
      werkzaamheden;



              b

                *bestaand project:*


                project als bedoeld in [artikel 2][ref2], niet zijnde een project als bedoeld in onderdeel e, onder 1° of
      2°, van dat artikel, dat zes maanden voor de dag waarop de aanvraag tot afgifte van een verklaring wordt ingediend,
      voldeed aan een van de projectomschrijvingen van dat artikel, of waarvoor zes maanden voor die dag een begin met de
      uitvoering van de fysieke werkzaamheden is gemaakt;



              c

                *projectbeheerder:*


                degene voor wiens rekening en risico het project wordt ontwikkeld en in stand gehouden;



              d

                *projectvermogen:*


                vermogen dat nodig is voor de financiering van activa en werkzaamheden die noodzakelijk zijn voor en
      uitsluitend dienstbaar zijn aan de uitvoering van een project;



              e

                *verklaring:*


                schriftelijk besluit van de Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer als
      bedoeld in [artikel 5.14, derde lid, onderdeel a, van de Wet inkomstenbelasting 2001][ref3], waarin wordt verklaard
      dat een project in het belang is van de bescherming van het milieu, waaronder natuur en bos;



              f

                *accountantsverklaring:*


                verklaring, afgegeven door een registeraccountant of een accountant-administratieconsulent;



              g

                *Groen Label Kas Niveau II 2002:*


                tuinbouwkas die bestemd is voor het bedrijfsmatig telen van tuinbouwgewassen en terzake waarvan door
      middel van een certificaat, afgegeven door een bij de Raad voor de Accreditatie erkende organisatie, is aangetoond
      dat deze kas voldoet aan de basiseisen, zoals die voor de desbetreffende teelt zijn gesteld in [bijlage 2][ref4] en
      minimaal het in die bijlage voor de desbetreffende teelt vermelde aantal punten behaalt volgens de aldaar vermelde
      systematiek.




      3 Tot het projectvermogen voor woningen als bedoeld in [artikel 2, onderdeel h][ref5], worden niet gerekend:

      1º het vermogen dat nodig is voor de financiering van de grond waarop de desbetreffende woningen zijn gelegen;

      2º het vermogen dat bedoeld is voor de financiering van onderhoud, instandhouding of verbetering van woningen als
      bedoeld in [artikel 2, onderdeel h, onder 1° of 2°][ref6], en

      3º het vermogen dat nodig is voor de financiering van onderhoud van woningen als bedoeld in
      [artikel 2, onderdeel h, onder 3°][ref7].

      4 Tot het projectvermogen voor een Groen Label Kas als bedoeld in [artikel 2, onderdeel g][ref8] wordt niet
      gerekend het vermogen dat nodig is voor de financiering van de grond, kosten voor goederen waarop niet wordt
      afgeschreven, tuinbouwgewassen, transportsystemen en kosten voor onderhoud.


