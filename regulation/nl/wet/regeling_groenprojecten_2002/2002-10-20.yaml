  - number: '5'
    text: |-
      1 De Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer beslist, in overeenstemming met de
      Minister van Financiën en na overleg met de Minister van Landbouw, Natuurbeheer en Visserij en de Minister van
      Verkeer en Waterstaat, op een aanvraag binnen acht weken na de indiening ervan.

      2 Een afschrift van het besluit wordt gezonden aan de projectbeheerder.
    url: https://wetten.overheid.nl/BWBR0013274/2002-10-20#Artikel5
  - number: '6'
    text: |-
      1 De verklaring kan maximaal negen maanden na afgifte van de verklaring in werking treden en niet langer gelden dan
      de verwachte levensduur van het project en dan een duur van ten hoogste:

      a. tien jaren;

      b. dertig jaren, indien:

      1º het een project betreft als bedoeld in [artikel 2, onderdelen a, b, c, of d][ref1], en

      2º het een project betreft waarvoor na 31 december 1997 een aanvraag tot afgifte van een verklaring is ingediend.

      2 De verklaring vermeldt de aard van het project, het projectvermogen, de datum waarop de verklaring in werking
      treedt en de periode waarvoor de verklaring geldt.

      3 Voor de toepassing van deze regeling komt voor een woning als bedoeld in [artikel 2, onderdeel h][ref2], ten
      hoogste een bedrag van € 34.034 voor een verklaring in aanmerking.

      4 Voor de toepassing van deze regeling komt ter zake van een project als bedoeld in
      [artikel 2, onderdeel d, onder 5° en 6°][ref3], voor een verklaring in aanmerking een bedrag van:

      1º ten hoogste € 2.268 per hectare indien het project betrekking heeft op passief beheer;

      2º ten hoogste € 4.538 per hectare indien het project betrekking heeft op licht beheer;

      3º ten hoogste € 6.808 per hectare indien het project betrekking heeft op zwaar beheer.

      5 Voor de toepassing van deze regeling komt ter zake van een project als bedoeld in
      [artikel 2, onderdeel d, onder 2°][ref4], voor een verklaring in aanmerking een bedrag van:

      1º ten hoogste € 2.268 per hectare voor projecten als bedoeld in bijlage 19 tot en met 22 en bijlage 31 van de
      Subsidieregeling agrarisch natuurbeheer;

      2º ten hoogste € 4.538 per hectare voor projecten als bedoeld in bijlage 15 tot en met 17, bijlage 24 tot en met
      30, bijlage 32 tot en met 35, bijlage 37, en bijlage 45 van de Subsidieregeling agrarisch natuurbeheer;

      3º ten hoogste € 6.808 per hectare voor projecten als bedoeld in bijlage 6 tot en met 14; bijlagen 18, 23 en
      bijlagen 41 tot en met 43 van de Subsidieregeling agrarisch natuurbeheer.

      6 Voor de toepassing van deze regeling kan het projectvermogen indien het meer bedraagt dan € 34.033.516 tot dat
      bedrag worden beperkt.

      7 De verklaring voor een project als bedoeld in [artikel 2, onderdeel e, onder 3°, f, g, h, i, of j][ref5],
      vervalt indien binnen 2 jaar na de dag van afgifte van een verklaring, geen aanvang is gemaakt met de uitvoering
      der werkzaamheden.

      8 In de verklaring kunnen nadere voorwaarden worden opgenomen.


