      1 Een verklaring wordt niet afgegeven op aanvragen voor:

      a. een bestaand project;

      b. een project waarvan het projectvermogen minder bedraagt dan € 22.689;

      c. een project waarvan het niet aannemelijk is dat het enig eigen rendement, subsidies van overheden en
      convenantsmiddelen daaronder begrepen, heeft;

      d. een project waarvan het te verwachten economisch rendement in verhouding tot het risico en het milieubelang
      zodanig is dat het zonder toepassing van deze regeling tot stand kan komen;

      e. een project als bedoeld in [artikel 2, onderdeel h, onder 1° of 2°][ref1], indien per kalenderjaar reeds voor
      5000 woningen een verklaring is afgegeven;

      f. een project als bedoeld in [artikel 2, onderdeel h, onder 3°][ref2], indien per kalenderjaar reeds voor 5000
      woningen een verklaring is afgegeven;

      g. een project betreffende een woning als bedoeld in [artikel 2, onderdeel h, onder 1° of 2°][ref3], waarvan de
      totale kosten van het verkrijgen in eigendom meer dan € 272.268 bedragen.

      2 Het eerste lid, onderdeel c, is niet van toepassing met betrekking tot de in [artikel 2, onderdeel i][ref4],
      bedoelde projecten.


