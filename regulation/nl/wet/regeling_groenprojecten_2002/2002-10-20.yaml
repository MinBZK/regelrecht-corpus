      1 De Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer kan, in overeenstemming met de Minister
      van Financiën en na overleg met de Minister van Landbouw, Natuurbeheer en Visserij, de Minister van Verkeer en
      Waterstaat en de Minister van Economische Zaken, een verklaring afgeven voor:

      a. projecten, bestaande uit aaneengesloten gebieden met een oppervlakte van ten minste vijf hectare, die gericht
      zijn op de ontwikkeling en de instandhouding van bos en andere houtopstanden, met uitzondering van vruchtbomen,
      windsingels, wegbeplantingen en bomen die bestemd zijn om te dienen als kerstbomen en kweekgoed;

      b. projecten die zijn gericht op de ontwikkeling en de instandhouding van natuur- en landschappelijke waarden in:

      1º gebieden die als beschermd natuurmonument of als staatsnatuurmonument zijn aangewezen op grond van de
      [Natuurbeschermingswet][ref1], of

      2º gebieden die in het Structuurschema Groene Ruimte zijn aangemerkt als gebieden behoud en herstel bestaande
      landschapskwaliteit en waarvoor een gebiedsperspectief waardevol cultuurlandschap geldt;

      c. projecten die zijn gericht op de ontwikkeling en instandhouding van:

      1º natuur- en landschappelijke waarden van landgoederen die als zodanig zijn aangemerkt krachtens
      [artikel 2 van de Natuurschoonwet 1928][ref2], of

      2º natuur- en landschappelijke waarden blijkens een landinrichtingsplan als bedoeld
      in de [Landinrichtingswet][ref3], een plan van voorzieningen als bedoeld in de
      [Reconstructiewet Midden-Delfland][ref4] of een herinrichtingsplan als bedoeld in de
      [Herinrichtingswet Oost-Groningen en de Gronings-Drentse Veenkoloniën][ref5];

      d. projecten:

      1º in een natuurgebied die zijn gericht op de ontwikkeling en de instandhouding van nieuwe natuur- en
      landschappelijke waarden en in aanmerking zijn gekomen voor subsidie op grond van de Subsidieregeling natuurbeheer
      2000 en voor wat betreft bos en houtopstanden tevens voldoen aan de projectomschrijving van onderdeel a;

      2º in een beheers-, probleem-, natuur- of landschapsgebied die zijn gericht op de ontwikkeling en de instandhouding
      van nieuwe natuur- en landschappelijke waarden en in aanmerking zijn gekomen voor subsidie op grond van
      de Subsidieregeling agrarisch natuurbeheer en voor wat betreft bos en houtopstanden tevens voldoen aan de
      projectomschrijving van onderdeel a;

      3º van publiekrechtelijke rechtspersonen of van instellingen als bedoeld in de Regeling bijdragen particuliere
      terreinbeherende natuurbeschermingsorganisaties die zijn gericht op de ontwikkeling en de instandhouding van nieuwe
      natuur- en landschappelijke waarden in gebieden waarvoor een begrenzingenplan is vastgesteld als bedoeld in de
      Regeling beheersovereenkomsten en natuurontwikkeling;

      4º die zijn gericht op de ontwikkeling en de instandhouding van nieuwe natuur- en landschappelijke waarden en in
      aanmerking zijn gekomen voor subsidie op grond van de Tijdelijke regeling particulier natuurbeheer;

      5º in een beheers- of reservaatgebied die zijn gericht op de ontwikkeling en de instandhouding van nieuwe
      natuur- en landschappelijke waarden en waarvoor een beheersovereenkomst is gesloten als bedoeld in de Regeling
      beheersovereenkomsten en natuurontwikkeling, of

      6º in een probleemgebied die zijn gericht op de ontwikkeling en de instandhouding van nieuwe natuur-
      en landschappelijke waarden en waarvoor een beheersovereenkomst is gesloten als bedoeld in de Regeling
      beheersovereenkomsten en natuurontwikkeling;

      e. projecten die zijn gericht op:

      1º het produceren of verwerken van plantaardige landbouwproducten volgens de voorschriften van het
      Landbouwkwaliteitsbesluit biologische productiemethode;

      2º het produceren of verwerken van dierlijke landbouwproducten volgens de voorschriften van het
      Landbouwkwaliteitsbesluit biologische productiemethode, of

      3º het bedrijfsmatig telen van gewassen in een Groen Label Kas Niveau II 2002;

      f. projecten die zijn gericht op de industriële verwerking van landbouwgrondstoffen tot producten die niet geschikt
      zijn voor menselijke of dierlijke consumptie, indien die producten in Nederland nog niet gangbaar zijn en die
      projecten leiden tot een vermindering van de aantasting van het milieu;

      g. projecten die zijn gericht op:

      1º het opwekken van elektriciteit uit hout en energierijke gewassen;

      2º het opwekken van elektrische energie door middel van een windturbine die - voor zover deze normen daarop van
      toepassing zijn - is gecertificeerd volgens NEN 6096/2 indien certificatie heeft plaatsgevonden voor 1 april 2000,
      of volgens NVN 11400-0, indien certificatie heeft plaatsgevonden op of na 1 april 2000;

      3º het opwekken van elektrische energie met behulp van fotovoltaïsche cellen;

      4º het gebruik van thermische zonne-energie door middel van zonnecollectoren;

      5º het winnen van aardwarmte;

      6º het opwekken van elektrische energie uit waterkracht;

      7º het met behulp van warmtepompen met een Seasonal Performance Factor van ten minste 1,2 opwaarderen van
      laagwaardige warmte naar hoogwaardige warmte op een zodanige wijze dat de hoogwaardige warmte nuttig wordt
      aangewend;

      8º warmte-, onderscheidenlijk koudeopslag, in een aquifer gedurende ten minste een maand, of;

      9º het aanleggen van warmtedistributienetten en het bouwen van centrale bijstookketels en warmtebuffers ten behoeve
      van stadsverwarmingsprojecten en de verwarming van tuinbouwkassen die thermische energie benutten van energie van
      elektriciteitsopwekkingsinstallaties;

      h. projecten die zijn gericht op:

      1º het realiseren van nieuw te bouwen woningen die voortdurend als hoofdverblijf ter beschikking zullen staan aan
      een of meer natuurlijke personen en die voldoen aan de basiseisen, zoals die zijn gesteld in [bijlage 1a][ref6] en
      tevens minimaal 150 punten behalen volgens de in die bijlage vermelde systematiek;

      2º het door herbestemming van niet-woningen realiseren van nieuwe woningen die voortdurend als hoofdverblijf ter
      beschikking zullen staan aan een of meer natuurlijke personen en die voldoen aan de basiseisen, zoals die zijn
      gesteld in [bijlage 1a][ref7] en tevens minimaal 150 punten behalen volgens de in die bijlage vermelde systematiek,
      of

      3º het renoveren van bestaande woningen die zijn gebouwd voor 1980 en die voortdurend als hoofdverblijf ter
      beschikking zullen staan aan een of meer natuurlijke personen en die voldoen aan de basiseisen zoals die
      zijn gesteld in [bijlage 1b][ref8], en tevens minimaal 125 punten behalen volgens de in die bijlage vermelde
      systematiek;

      i. projecten die zijn gericht op de realisatie van vrijgelegen dan wel verhoogde fietspaden die verhard zijn met
      asfalt en die:

      1º de directe verbinding vormen tussen woonkernen met meer dan 50.000 inwoners en de direct omringende woonkernen,
      gelegen zijn buiten de bebouwde kom en reistijd verminderend zijn;

      2º de directe verbinding vormen tussen Vinex-locaties en de direct omringende woonkernen en gelegen zijn buiten de
      bebouwde kom;

      3º de directe bereikbaarheid van transferia bevorderen, of

      4º knelpunten opheffen in het recreatieve landelijk fietsroutenet als aangegeven in het Structuurschema Groene
      Ruimte en die gelegen zijn buiten de bebouwde kom, dan wel buiten de bebouwde kom gelegen zijn en de directe
      verbinding vormen tussen een woonkern, waaronder begrepen een verblijfsrecreatieconcentratie, en dat landelijk net;

      j. projecten die zijn gericht op het vrijwillig saneren van verontreinigde (water)bodems ter zake waarvan
      overeenkomstig artikel 29 van de Wet op de bodembescherming is beslist dat er sprake is van een geval van ernstige
      verontreiniging en overeenkomstig artikel 39, tweede lid, van die wet goedkeuring is gegeven aan het saneringsplan
      en waaraan naar zijn oordeel voorrang moet worden verleend;

      k. andere projecten die naar zijn oordeel in het belang zijn van de bescherming van het milieu, waaronder natuur
      en bos.

      2 De in het eerste lid, onderdeel g, onder 2°, gegeven verwijzing naar NVN-norm 11400-0, onderscheidenlijk NEN-norm
      6096/2, heeft betrekking op de laatst uitgegeven NVN-norm, onderscheidenlijk NEN-norm, met de daarop uitgegeven
      aanvullingen en correctiebladen. Een uitgegeven aanvulling, onderscheidenlijk correctieblad, wordt eerst van
      toepassing op 1 januari van het jaar volgende op dat waarin de uitgifte heeft plaatsgevonden.


