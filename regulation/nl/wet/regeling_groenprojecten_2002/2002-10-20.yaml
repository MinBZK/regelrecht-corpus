  - number: '7'
    text: |-
      1 De Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer kan, in overeenstemming met de Minister
      van Financiën en na overleg met de Minister van Landbouw, Natuurbeheer en Visserij, de Minister van Verkeer en
      Waterstaat en de Minister van Economische Zaken, de verklaring intrekken indien:

      a. de ter zake verstrekte gegevens zodanig onjuist of onvolledig blijken, dat op de aanvraag een andere beslissing
      zou zijn genomen als bij de beoordeling daarvan de juiste of volledige gegevens bekend waren geweest;

      b. blijkt dat de uitvoering van het project in aanzienlijke mate afwijkt van het project op grond waarvan de
      verklaring is afgegeven;

      c. blijkt dat de projectbeheerder de vermogenstoestand van het project niet afzonderlijk administreert;

      d. niet wordt voldaan aan de voorwaarden die in de verklaring zijn opgenomen;

      e. de melding bedoeld in [artikel 8][ref1] niet onverwijld is geschied.

      2 Het besluit tot intrekking kan terugwerkende kracht hebben.

      3 Het besluit tot intrekking wordt gezonden aan de aanvrager die ingevolge [artikel 4, eerste lid][ref2], een
      aanvraag heeft ingediend.

      4 Een afschrift van het besluit wordt gezonden aan de projectbeheerder en aan de inspecteur.


      [ref1]: https://wetten.overheid.nl/BWBR0013274#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0013274#Artikel4
    url: https://wetten.overheid.nl/BWBR0013274/2002-10-20#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0013274
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0013274
        artikel: '4'
  - number: '8'
    text: |-
      Indien de uitvoering van een project wordt gewijzigd doet de instelling die kapitaal verschaft ten behoeve van
      een project waarvoor een verklaring is afgegeven, daarvan onverwijld melding aan de Minister van Volkshuisvesting,
      Ruimtelijke Ordening en Milieubeheer.
    url: https://wetten.overheid.nl/BWBR0013274/2002-10-20#Artikel8
  - number: '9'
    text: |-
      Ten behoeve van de vaststelling van een verklaring en van de daar toe van belang zijnde gegevens en van de
      daar aan verbonden rechten en plichten is ten aanzien van de kredietinstelling of de beleggingsinstelling,
      bedoeld in [artikel 5.14, tweede lid, van de Wet inkomstenbelasting 2001][ref1], en de projectbeheerder
      [Hoofdstuk VIII][ref2], [afdeling 2, van de Algemene wet inzake rijksbelastingen][ref3] van overeenkomstige
      toepassing, waarbij de aldaar jegens de inspecteur opgelegde verplichtingen mede gelden jegens de door de Minister
      van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer aangewezen personen.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel5.14
      [ref2]: https://wetten.overheid.nl/BWBR0002320#HoofdstukVIII
      [ref3]: https://wetten.overheid.nl/BWBR0002320#Afdeling2
    url: https://wetten.overheid.nl/BWBR0013274/2002-10-20#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '5.14'
      - id: ref2
        bwb_id: BWBR0002320
        hoofdstuk: VIII
      - id: ref3
        bwb_id: BWBR0002320
        afdeling: '2'
  - number: '10'
    text: |-
      Met de in deze regeling bedoelde normen, meetvoorschriften, tests, verklaringen en certificaten, worden
      gelijkgesteld normen, meetvoorschriften, tests, verklaringen en certificaten die worden toegepast in een andere
      staat en die ten minste een gelijkwaardig niveau waarborgen dan wel indien het verklaringen en certificaten
      betreft, deze zijn afgegeven op basis van onderzoekingen die aan ten minste gelijkwaardige eisen voldoen.
    url: https://wetten.overheid.nl/BWBR0013274/2002-10-20#Artikel10
  - number: '11'
    text: |-
      1 De Regeling groenprojecten 2001 wordt ingetrokken.

      2 De regeling, genoemd in het eerste lid, blijft van toepassing op projecten waarvoor voor 1 januari 2002 een
      aanvraag voor de afgifte van een verklaring is ingediend.

      3 Onverminderd [artikel 2][ref1] kan een verklaring worden afgegeven voor:

      a. projecten als bedoeld in artikel 2, onderdeel e, onder 3°, van de Regeling groenprojecten 2001, zoals die
      regeling luidde voor 1 januari 2002, die voldoen aan de eisen die in die regeling aan die projecten werden gesteld,
      indien een aanvraag daartoe voor 1 februari 2002 wordt ingediend;

      b. projecten als bedoeld in artikel 2, onderdeel h, van de Regeling groenprojecten 2001, zoals die regeling luidde
      voor 1 januari 2002, die voldoen aan de eisen die in die regeling aan die projecten werden gesteld, indien een
      aanvraag daartoe voor 1 april 2002 wordt ingediend.

      4 Aan een verklaring voor een project als bedoeld in het derde lid, onder a, wordt de voorwaarde verbonden dat voor
      1 juli 2002 een begin met de uitvoering van de fysieke werkzaamheden wordt gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0013274#Artikel2
    url: https://wetten.overheid.nl/BWBR0013274/2002-10-20#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0013274
        artikel: '2'
  - number: '12'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst, en werkt terug tot en met 1 januari 2002.
    url: https://wetten.overheid.nl/BWBR0013274/2002-10-20#Artikel12
  - number: '13'
    text: 'Deze regeling wordt aangehaald als: Regeling groenprojecten 2002.'
    url: https://wetten.overheid.nl/BWBR0013274/2002-10-20#Artikel13
