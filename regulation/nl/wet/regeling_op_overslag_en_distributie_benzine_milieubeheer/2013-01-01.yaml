---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/tags/schema-v0.5.4/schema/v0.5.4/schema.json
$id: regeling_op_overslag_en_distributie_benzine_milieubeheer
regulatory_layer: WET
publication_date: '2015-10-02'
valid_from: '2013-01-01'
valid_to: '2015-12-31'
bwb_id: BWBR0007806
url: https://wetten.overheid.nl/BWBR0007806/2013-01-01
preamble:
  text: |-
    Gelet op richtlijn nr. 94/63/EG van het Europees Parlement en de Raad van de Europese Unie van 20 december 1994
    betreffende de beheersing van de uitstoot van vluchtige organische stoffen (VOS) als gevolg van de opslag van
    benzine en de distributie van benzine vanaf terminals naar benzinestations (PbEG L 365), alsmede gelet op de
    artikelen 8.44, 8.45 en 21.6, zesde lid, van de Wet milieubeheer;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0007806/2013-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze regeling wordt verstaan onder:

      a. [richtlijn 94/63](31994L0063): [richtlijn nr. 94/63/EG](31994L0063) van het Europees Parlement en de Raad van
      de Europese Unie van 20 december 1994 betreffende de beheersing van de uitstoot van vluchtige organische stoffen
      (VOS) als gevolg van de opslag van benzine en de distributie van benzine vanaf terminals naar benzinestations (PbEG
      L 365);

      b. benzine: benzine als bedoeld in artikel 2, onderdeel a, van [richtlijn 94/63](31994L0063);

      c. ladingtank: mobiele tank, vast verbonden met een schip, waarvan de wanden hetzij door de scheepsromp zelf,
      hetzij door van de scheepsromp onafhankelijke wanden zijn gevormd;

      d. damp: damp als bedoeld in artikel 2, onderdeel b, van [richtlijn 94/63](31994L0063);

      e. benzinestation: inrichting of deel van een inrichting waar brandstoftanks van motorvoertuigen met benzine uit
      vaste opslagtanks worden gevuld;

      f. terminal: inrichting of deel van een inrichting voor de opslag van benzine of overslag van benzine in mobiele
      tanks;

      g. mobiele tank: mobiele tank als bedoeld in artikel 2, onderdeel f, van [richtlijn 94/63](31994L0063);

      h. opslaginstallatie: opslaginstallatie als bedoeld in artikel 2, onderdeel c, van [richtlijn 94/63](31994L0063);

      i. overslaginstallatie: overslaginstallatie als bedoeld in artikel 2, onderdeel n, van [richtlijn 94/63]
      (31994L0063);

      j. vul- en opslaginstallatie van een benzinestation: vaste tankinstallatie met de daarbij behorende leidingen en
      appendages op een benzinestation;

      k. laadportaal: laadportaal als bedoeld in artikel 2, onderdeel o, van [richtlijn 94/63](31994L0063);

      l. bestaande terminals, opslaginstallaties, overslaginstallaties en benzinestations: terminals, opslaginstallaties,
      overslaginstallaties en benzinestations die voor 31 december 1995 in werking waren of waarvoor voor 31 december
      1995 een vergunning krachtens [artikel 8.1 van de Wet milieubeheer][ref1] is verleend;

      m. nieuwe opslaginstallatie: opslaginstallatie die eerst na 30 december 1995 in werking is gebracht of
      waarvoor eerst na 30 december 1995 een vergunning krachtens [artikel 8.1 van de Wet milieubeheer][ref2] of een
      omgevingsvergunning is verleend;

      n. debiet: de in de drie voorgaande jaren gemeten grootste totale jaarlijkse hoeveelheid benzine die van een
      opslaginstallatie van een terminal is overgeslagen in mobiele tanks of vanuit mobiele tanks naar een benzinestation
      is overgeslagen;

      o. dampterugwinningseenheid: installatie voor de terugwinning van benzine uit damp of de omzetting naar elektrische
      energie of warmte uit damp, met inbegrip van eventuele buffertanksystemen van een terminal;

      p. voorlopige dampopslag: voorlopige dampopslag in een tank met vast dak op een terminal voor latere overbrenging
      naar en terugwinning op een andere terminal, daaronder niet begrepen de overbrenging van damp van de ene naar de
      andere opslaginstallatie op een terminal;

      q. schip: schip als bedoeld in artikel 2, onderdeel k, van [richtlijn 94/63](31994L0063);

      r. tankverhuurbedrijf: terminal die uitsluitend is bestemd voor het verhuren van tankcapaciteit aan derden en
      waarvan de opslaginstallaties mede zijn bedoeld voor het opslaan van andere stoffen, preparaten of producten dan
      benzine;

      s. stoffenlijst: verklaring als bedoeld in randnummer 7.2.2.8.3 van
      [bijlage 1 bij de Regeling vervoer over de binnenwateren van gevaarlijke stoffen][ref3];

      t. bevoegd gezag: het bestuursorgaan dat bevoegd is een omgevingsvergunning voor de betrokken inrichting te
      verlenen.

      2 Een wijziging van de richtlijn gaat voor de toepassing van het eerste lid, onderdelen b, d, g, h, i, k en q,
      gelden met ingang van de dag waarop aan de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven, tenzij bij
      ministerieel besluit, dat in de Staatscourant wordt bekendgemaakt, een ander tijdstip wordt vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8.1
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel8.1
      [ref3]: https://wetten.overheid.nl/BWBR0010115
    url: https://wetten.overheid.nl/BWBR0007806/2013-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8.1'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '8.1'
      - id: ref3
        bwb_id: BWBR0010115
  - number: 1a
    text: |-
      Deze regeling berust mede op [artikel 5.14 van het Besluit omgevingsrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0027464#Artikel5.14
    url: https://wetten.overheid.nl/BWBR0007806/2013-01-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0027464
        artikel: '5.14'
  - number: '2'
    text: |-
      Degene die een terminal drijft, voldoet, behalve aan de voorschriften die aan de vergunning zijn verbonden, wat
      een opslaginstallatie betreft, ook aan de voorschriften die zijn opgenomen in de bij deze regeling behorende
      [bijlage I][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007806
    url: https://wetten.overheid.nl/BWBR0007806/2013-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0007806
    machine_readable:
       execution:
         output:
           - name: opslaginstallatie_voldoet_aan_bijlage_I
             type: boolean
             description: Indicates whether the terminal's storage installation complies with the requirements of Bijlage I.
         inputs:
           - name: bijlage_I_voorschriften
             type: object
             description: The requirements specified in Bijlage I for storage installations.
             source:
               regulation: BWBR0007806
               output: bijlage_I
       actions:
         - output: opslaginstallatie_voldoet_aan_bijlage_I
           value: true
  - number: '3'
    text: |-
      1 Degene die een terminal drijft, voldoet, behalve aan de voorschriften die aan de vergunning zijn verbonden, wat
      een overslaginstallatie betreft, ook aan de voorschriften die zijn opgenomen in de bij deze regeling behorende
      [bijlage II][ref1], alsmede aan [artikel 4][ref2].

      2 Het eerste lid is niet van toepassing op bestaande terminals met een debiet van minder dan 10 000 ton per jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0007806
      [ref2]: https://wetten.overheid.nl/BWBR0007806#Artikel4
    url: https://wetten.overheid.nl/BWBR0007806/2013-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0007806
      - id: ref2
        bwb_id: BWBR0007806
        artikel: '4'
        paragraaf: '2'
    machine_readable:
      execution:
        output:
          - name: overslaginstallatie_voldoet_aan_bijlage_II_en_artikel_4
            type: boolean
            description: Indicates whether the terminal's transfer installation complies with Bijlage II and Article 4, unless exempted.
        inputs:
          - name: bijlage_II_voorschriften
            type: object
            description: The requirements specified in Bijlage II for transfer installations.
            source:
              regulation: BWBR0007806
              output: bijlage_II
          - name: artikel_4_voorschriften
            type: object
            description: The requirements specified in Article 4 for loading portals.
            source:
              regulation: BWBR0007806
              output: artikel_4
          - name: is_bestaande_terminal
            type: boolean
            description: Whether the terminal is a 'bestaande terminal' (in operation or permitted before 31 December 1995).
            untranslatable: true
          - name: debiet
            type: number
            description: The greatest total annual quantity of benzine transferred in the past three years, in metric tons.
            untranslatable: true
      actions:
           - output: overslaginstallatie_voldoet_aan_bijlage_II_en_artikel_4
             IF:
               cases:
                 - condition: AND(is_bestaande_terminal = true, debiet < 10000)
                   then: false
             default: true
  - number: '4'
    text: |-
      Laadportalen van overslaginstallaties voldoen aan de specificaties, bedoeld in de bij deze regeling behorende
      [bijlage III][ref1].


       [ref1]: https://wetten.overheid.nl/BWBR0007806
    url: https://wetten.overheid.nl/BWBR0007806/2013-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0007806
    machine_readable:
       execution:
         output:
           - name: laadportaal_voldoet_aan_bijlage_III
             type: boolean
             description: Indicates whether the loading portal of the transfer installation complies with the specifications of Bijlage III.
         inputs:
           - name: bijlage_III_specificaties
             type: object
             description: The specifications outlined in Bijlage III for loading portals.
             source:
               regulation: BWBR0007806
               output: bijlage_III
         actions:
            - output: laadportaal_voldoet_aan_bijlage_III
              value: true
  - number: 4a
    text: |-
       1 Het is degene die een terminal drijft, verboden een ladingtank te beladen waarin volgens de stoffenlijst benzine
       mag worden vervoerd.

       2 Het eerste lid geldt niet indien:

       a. de schipper aan degene die de terminal drijft, aantoont dat hij beschikt
       over een bijgewerkte reisregistratie overeenkomstig randnummer 7.2.4.12 van
       [bijlage 1 bij de Regeling vervoer over de binnenwateren van gevaarlijke stoffen][ref1], en

       b. [artikel 2 van de Regeling benzinevervoer in mobiele tanks 2006][ref2] van toepassing is of de
       schipper aan degene die de terminal drijft, aantoont dat de ladingtank is ontgast met toepassing van
       [artikel 4 van de Regeling benzinevervoer in mobiele tanks 2006][ref3].

       3 Het eerste lid geldt voorts niet indien tijdens het beladen van een ladingtank verplaatsingsdampen uit die tank
       door een dampdichte leiding worden teruggevoerd naar een dampverwerkingseenheid.


        [ref1]: https://wetten.overheid.nl/BWBR0010115
        [ref2]: https://wetten.overheid.nl/BWBR0018575#Artikel2
        [ref3]: https://wetten.overheid.nl/BWBR0018575#Artikel4
    url: https://wetten.overheid.nl/BWBR0007806/2013-01-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0010115
      - id: ref2
        bwb_id: BWBR0018575
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0018575
        artikel: '4'
    machine_readable:
       execution:
         output:
           - name: beladen_ladingtank_toegestaan
             type: boolean
             description: Indicates whether loading a ladingtank is allowed under the conditions of Article 4a.
         inputs:
           - name: has_reisregistratie
             type: boolean
             description: Indicates if the skipper has provided an updated travel registration as per bijlage 1, randnummer 7.2.4.12 of BWBR0010115.
             source:
               regulation: BWBR0010115
               output: bijlage_1/randnummer_7.2.4.12
           - name: artikel_2_BWBR0018575_toepasbaar
             type: boolean
             description: Indicates if Article 2 of BWBR0018575 (Regeling benzinevervoer in mobiele tanks 2006) applies.
             source:
               regulation: BWBR0018575
               output: artikel_2
           - name: artikel_4_BWBR0018575_toepasbaar
             type: boolean
             description: Indicates if Article 4 of BWBR0018575 (Regeling benzinevervoer in mobiele tanks 2006) applies.
             source:
               regulation: BWBR0018575
               output: artikel_4
           - name: heeft_dampdichte_leiding
             type: boolean
             description: Indicates if the ladingtank is connected to a vapor-tight pipeline for returning displacement vapors.
             untranslatable: true
       actions:
         - output: beladen_ladingtank_toegestaan
           IF:
             cases:
               - condition: OR(has_reisregistratie = true, artikel_2_BWBR0018575_toepasbaar = true, artikel_4_BWBR0018575_toepasbaar = true, heeft_dampdichte_leiding = true)
                 then: true
             default: false
  - number: '5'
    text: |-
      1 Degene die een benzinestation drijft, dient, behalve aan de voorschriften die aan de vergunning zijn verbonden,
      wat betreft een vul- en opslaginstallatie te voldoen aan de voorschriften zoals opgenomen in de bij deze regeling
      behorende [bijlage IV][ref1].

      2 Het eerste lid is niet van toepassing op:

      a. een benzinestation dat wordt aangemerkt als een tankstation voor het wegverkeer waarop het
      [Activiteitenbesluit milieubeheer][ref2] van toepassing is;

      b. een benzinestation met een debiet van minder dan 100 m3 per jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0007806
      [ref2]: https://wetten.overheid.nl/BWBR0022762
      url: https://wetten.overheid.nl/BWBR0007806/2013-01-01#Artikel5
      references:
        - id: ref1
          bwb_id: BWBR0007806
        - id: ref2
          bwb_id: BWBR0022762
      machine_readable:
        execution:
          output:
            - name: vul_en_opslaginstallatie_voldoet_aan_bijlage_IV
              type: boolean
              description: Indicates whether the filling and storage installation of a gas station complies with Bijlage IV, unless exempted.
          inputs:
            - name: bijlage_IV_voorschriften
              type: object
              description: The requirements specified in Bijlage IV for filling and storage installations.
              source:
                regulation: BWBR0007806
                output: bijlage_IV
            - name: is_activiteitenbesluit_toepasbaar
              type: boolean
              description: Indicates if the Activiteitenbesluit milieubeheer applies to the gas station.
              source:
                regulation: BWBR0022762
                output: toepasselijkheid
            - name: debiet
              type: number
              description: de in de drie voorgaande jaren gemeten grootste totale jaarlijkse hoeveelheid benzine (in m³/jaar).
              untranslatable: true
        actions:
          - output: vul_en_opslaginstallatie_voldoet_aan_bijlage_IV
            IF:
              cases:
                - condition: OR(is_activiteitenbesluit_toepasbaar = true, debiet < 100)
                  then: false
              default: true
  - number: '9'
    text: |-
      Indien voor het opslaan van benzine in een ondergrondse tank voorschriften krachtens het
      [Activiteitenbesluit milieubeheer][ref1] van toepassing zijn, gelden die voorschriften tenzij daarvoor krachtens
      deze regeling andere voorschriften van toepassing zijn.


        [ref1]: https://wetten.overheid.nl/BWBR0022762
    url: https://wetten.overheid.nl/BWBR0007806/2013-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0022762
  - number: '10'
    text: Deze regeling treedt in werking met ingang van 31 december 1995.
    url: https://wetten.overheid.nl/BWBR0007806/2013-01-01#Artikel10
  - number: '11'
    text: 'Deze regeling wird angehaald als: Regeling op-, overslag en distributie benzine milieubeheer.'
    url: https://wetten.overheid.nl/BWBR0007806/2013-01-01#Artikel11
