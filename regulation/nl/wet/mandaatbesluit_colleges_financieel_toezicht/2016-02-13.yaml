  - number: '2'
    text: |-
      Voor de toepassing van dit besluit en de daarop berustende bepalingen wordt met de verlening van mandaat
      gelijkgesteld de verlening van volmacht of machtiging.
    url: https://wetten.overheid.nl/BWBR0035717/2016-02-13#Artikel2
  - number: '3'
    text: |-
      1 Aan de voorzitter wordt mandaat verleend voor aangelegenheden op organisatorisch, personeel, financieel en
      materieel gebied.

      2 Het mandaat heeft geen betrekking op het aanstellen en het verlenen van ontslag dan wel het aangaan
      van detacheringsovereenkomsten ten aanzien van medewerkers die aan de secretaris worden toegevoegd en
      het nemen van besluiten met rechtspositionele gevolgen voor medewerkers met salarisschaal 14 of hoger
      van [Bijlage B van het Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref1]. Het mandaat voor deze
      aangelegenheden is voorbehouden aan de directeur-generaal Bestuur en Koninkrijksrelaties.

      3 De voorzitter is bevoegd ondermandaat te verlenen aan de secretaris.


      [ref1]: https://wetten.overheid.nl/BWBR0003630
    url: https://wetten.overheid.nl/BWBR0035717/2016-02-13#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003630
  - number: '4'
    text: |-
      1 Dit besluit treedt in werking met ingang van de dag na datum van uitgifte van de Staatscourant waarin het wordt
      geplaatst.

      2 Besluiten of handelingen van de voorzitter onderscheidenlijk de secretaris die zijn genomen of verricht in de
      periode van 1 december 2007 tot de datum van inwerkingtreding van dit besluit, zijn genomen of verricht namens de
      minister van Binnenlandse Zaken en Koninkrijksrelaties.

      3 Het Mandaatbesluit Colleges financieel toezicht van 30 juni 2014 wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0035717/2016-02-13#Artikel4
