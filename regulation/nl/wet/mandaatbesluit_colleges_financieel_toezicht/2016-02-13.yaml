articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. *het College:* het College financieel toezicht Curaçao en Sint Maarten, bedoeld in
      [artikel 2, eerste lid, van de Rijkswet financieel toezicht Curaçao en Sint Maarten][ref1],
      het College financieel toezicht Bonaire, Sint Eustatius en Saba, bedoeld in
      [artikel 2, eerste lid, van de Wet financiën openbare lichamen Bonaire, Sint Eustatius en Saba ][ref2]onderscheide
      nlijk het College Aruba financieel toezicht, bedoeld in artikel 2, eerste lid, van de Landsverordening Aruba
      financieel toezicht;

      b. *voorzitter:* voorzitter van het College;

      c. *secretaris:* secretaris als bedoeld in
      [artikel 6, eerste lid, van de Rijkswet financieel toezicht Curaçao en Sint Maarten][ref3],
      [artikel 6, eerste lid, van de Wet financiën openbare lichamen Bonaire, Sint Eustatius en Saba][ref4]
      onderscheidenlijk artikel 6, eerste lid, van de Landsverordening Aruba financieel toezicht.


