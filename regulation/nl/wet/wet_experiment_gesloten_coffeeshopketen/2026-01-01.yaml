  - number: '11'
    text: |-
      1 Er is een Begeleidings- en evaluatiecommissie experiment gesloten coffeeshopketen, die tot taak heeft het
      experiment en de uitvoering van de evaluatie te volgen en daarover verslag te doen aan Onze Ministers.

      2 Bij algemene maatregel van bestuur worden eisen gesteld aan het volgen en de evaluatie, in het bijzonder teneinde
      de onafhankelijkheid en wetenschappelijke kwaliteit daarvan te waarborgen.

      3 Uiterlijk acht maanden voor het tijdstip waarop de uitvoering van het experiment eindigt, rondt de commissie de
      evaluatie af met een verslag en zendt dit aan Onze Ministers.
    url: https://wetten.overheid.nl/BWBR0042818/2026-01-01#Artikel11
  - number: '12'
    text: |-
      Onze Ministers zenden binnen vier maanden na de ontvangst van het evaluatieverslag, het kabinetsstandpunt over
      dat verslag en de gevolgen die het daaraan wenst te verbinden, alsmede het verslag, aan de Staten-Generaal.
      [Artikel 24 van de Kaderwet adviescolleges][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008159#Artikel24
