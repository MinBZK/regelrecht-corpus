  - number: '17'
    text: |-
      1 Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen
      of onderdelen daarvan verschillend kan worden vastgesteld.

      2 Deze wet vervalt vier jaar en zes maanden na het tijdstip, bedoeld in [artikel 4, eerste lid][ref1], tenzij
      krachtens dat artikel bij algemene maatregel van bestuur anders wordt bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0042818#Artikel4
