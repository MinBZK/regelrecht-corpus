  - number: '4'
    text: |-
      1 De uitvoering van het experiment vangt aan op een bij besluit van Onze Ministers vastgesteld tijdstip en
      heeft een looptijd van vier jaar na de aanvangsdatum van de uitvoering van het experiment, waarna het experiment
      binnen ten hoogste zes maanden wordt afgebouwd, tenzij bij algemene maatregel van bestuur een andere looptijd
      wordt bepaald. Bij algemene maatregel van bestuur kan de looptijd met ten hoogste een jaar en zes maanden worden
      verlengd.

      2 Van het besluit, bedoeld in het eerste lid, wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0042818/2026-01-01#Artikel4
  - number: '5'
    text: |-
      1 In het kader en voor de duur van het experiment kunnen Onze Ministers op aanvraag een of meer telers aanwijzen
      die ten behoeve van het experiment hennep of hasjiesj telen. Onze Ministers kunnen een aanwijzing intrekken.

      2 Onze Ministers kunnen aan een aanwijzing of aan een verleende aanwijzing voorschriften verbinden. Een voorschrift
      kan worden gewijzigd of worden ingetrokken.

      3 Bij of krachtens algemene maatregel van bestuur worden regels gesteld over:

      a. de criteria en procedure voor het selecteren en aanwijzen van de telers;

      b. de aan een aanwijzing te verbinden voorschriften;

      c. de gronden voor afwijzing van een aanvraag;

      d. de gronden voor intrekking van een aanwijzing.

      4 Een aanvraag om een aanwijzing kan in elk geval worden afgewezen of een aanwijzing
      kan in elk geval worden ingetrokken in het geval en onder de voorwaarden, bedoeld in
      [artikel 3 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref1].

      5 Voordat toepassing wordt gegeven aan het vierde lid, kan het Bureau
      bevordering integriteitsbeoordelingen door het openbaar bestuur, bedoeld in
      [artikel 8 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref2], om een advies als
      bedoeld in [artikel 9 van die wet][ref3] worden gevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0013798#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0013798#Artikel9
    url: https://wetten.overheid.nl/BWBR0042818/2026-01-01#Artikel5
