preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is om te voorzien in wet- en regelgeving ten behoeve
    van een uniform experiment met het telen van hennep en hasjiesj voor recreatief gebruik met als doel om te bezien
    of en hoe op kwaliteit gecontroleerde hennep en hasjiesj gedecriminaliseerd aan de coffeeshops in een gesloten
    coffeeshopketen kunnen worden afgeleverd en wat de effecten daarvan zijn;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0042818/2026-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

        - *hennep:* hennep als bedoeld op lijst II bij de [Opiumwet][ref1];
        - *hasjiesj:* hasjiesj als bedoeld op lijst II bij de [Opiumwet][ref2];
        - *coffeeshop:* coffeeshop als bedoeld in [artikel 6a][ref3];
        - *gesloten coffeeshopketen:* een keten waarin de teelt van hennep of hasjiesj voor recreatief gebruik en de
      aflevering aan en verkoop daarvan in een coffeeshop, dan wel enige andere in dat verband verrichte handeling,
      bedoeld in [artikel 3, onderdelen B en C, van de Opiumwet][ref4], plaatsvindt;
        - *Onze Ministers:* Onze Minister van Volksgezondheid, Welzijn en Sport en Onze Minister van Justitie en
      Veiligheid.


      [ref1]: https://wetten.overheid.nl/BWBR0001941
      [ref2]: https://wetten.overheid.nl/BWBR0001941
      [ref3]: https://wetten.overheid.nl/BWBR0042818#Artikel6a
      [ref4]: https://wetten.overheid.nl/BWBR0001941#Artikel3
