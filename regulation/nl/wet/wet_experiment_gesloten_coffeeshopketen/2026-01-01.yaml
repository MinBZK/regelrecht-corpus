  - number: '8'
    text: |-
      1 Met het toezicht op de naleving van het bepaalde bij of krachtens [artikel 6][ref1] of [7][ref2] van deze wet
      zijn belast de bij besluit van Onze Ministers aangewezen personen. Bij dat besluit kunnen Onze Ministers bepalen
      dat de burgemeester van een gemeente als bedoeld in artikel 6, eerste lid, de personen aanwijst die belast zijn met
      het toezicht op de coffeeshops in die gemeente.

      2 Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0042818#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0042818#Artikel7
