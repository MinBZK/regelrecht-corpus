  - number: '2'
    text: |-
      Er vindt een experiment plaats met op kwaliteit gecontroleerde teelt van hennep en hasjiesj voor recreatief gebruik
      en de aflevering aan en verkoop daarvan in een coffeeshop in een gesloten coffeeshopketen, overeenkomstig de bij of
      krachtens deze wet gestelde regels, met als doel om te bezien of en hoe hennep en hasjiesj gedecriminaliseerd aan
      de coffeeshops kunnen worden afgeleverd en wat de effecten daarvan zijn.
    url: https://wetten.overheid.nl/BWBR0042818/2026-01-01#Artikel2
  - number: '3'
    text: |-
      1 Ten aanzien van de handelingen, bedoeld in [artikel 3, onderdelen B en C, van de Opiumwet][ref1], geldt het
      in die artikelonderdelen omschreven verbod niet, voor zover die handelingen worden verricht in het kader van de
      voorbereiding, uitvoering en afbouw van het experiment en in overeenstemming met de eisen die aan die handelingen
      bij of krachtens [artikel 6][ref2] of [7 van deze wet][ref3] worden gesteld.

      2 [Artikel 13b van de Opiumwet][ref4] is niet van toepassing voor zover de in het eerste lid van dat artikel
      genoemde handelingen worden verricht in het kader van de voorbereiding, uitvoering en afbouw van het experiment.


      [ref1]: https://wetten.overheid.nl/BWBR0001941#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0042818#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0042818#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0001941#Artikel13b
