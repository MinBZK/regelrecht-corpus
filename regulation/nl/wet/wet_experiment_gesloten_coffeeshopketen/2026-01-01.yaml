  - number: '6'
    text: |-
      1 De aflevering aan en verkoop in coffeeshops van hennep of hasjiesj vindt in het kader en voor de duur van het
      experiment plaats in maximaal tien bij algemene maatregel van bestuur aangewezen gemeenten.

      2 Ingeval van spoed kunnen Onze Ministers ter bescherming van de volksgezondheid of in het belang van de openbare
      orde en veiligheid een last tot onmiddellijke staking van de uitvoering van het experiment in een aangewezen
      gemeente opleggen. Van het opleggen van de last wordt mededeling gedaan in de Staatscourant. Na het onherroepelijk
      worden van het besluit tot oplegging van de last, wordt een voordracht voor een wijziging van de krachtens het
      eerste lid vastgestelde algemene maatregel van bestuur gedaan, waarbij de aanwijzing van de betreffende gemeente
      wordt beëindigd.

      3 Bij algemene maatregel van bestuur kan worden bepaald ten aanzien van welke eisen de burgemeester van een
      gemeente bevoegd is tot het stellen van nadere regels over de uitvoering van het experiment in die gemeente.
    url: https://wetten.overheid.nl/BWBR0042818/2026-01-01#Artikel6
  - number: 6a
    text: |-
      1 De burgemeester van een gemeente als bedoeld in [artikel 6, eerste lid][ref1], bepaalt hoeveel coffeeshops in
      zijn gemeente zijn toegestaan.

      2 Een coffeeshop wordt aangemerkt als toegestaan, indien daar de verkoop van hennep of hasjiesj mag plaatsvinden op
      grond van een expliciete verklaring of bestendige gedragslijn van de burgemeester.


      [ref1]: https://wetten.overheid.nl/BWBR0042818#Artikel6
    url: https://wetten.overheid.nl/BWBR0042818/2026-01-01#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0042818
        artikel: '6'
  - number: '7'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur worden regels gesteld over het experiment. Deze regels hebben in
      ieder geval betrekking op:

      a. eisen aan:

      1°. het telen van hennep of hasjiesj, het afleveren en het verkopen daarvan aan coffeeshops in de gemeenten,
      bedoeld in [artikel 6, eerste lid][ref1], dan wel enige andere in dat verband verrichte handeling, bedoeld in
      [artikel 3, onderdelen B en C, van de Opiumwet][ref2], de bedrijfsvoering, productinformatie en de veiligheid en
      kwaliteit van de geteelde hennep of hasjiesj;

      2°. de houders van een coffeeshop in de gemeenten, bedoeld in [artikel 6, eerste lid][ref3], waaronder eisen aan
      de deelname aan het experiment, bedrijfsvoering, het verkopen van hennep of hasjiesj, dan wel enige andere in dat
      verband verrichte handeling, bedoeld in [artikel 3, onderdelen B en C, van de Opiumwet][ref4], dan wel aan het
      niet-deelnemen aan het experiment;

      b. de ten behoeve van de evaluatie te registreren gegevens;

      c. de afbouw van het experiment, waarbij kan worden bepaald in welke gevallen de afbouw eerder plaatsvindt dan het
      tijdstip, bedoeld in [artikel 4, eerste lid][ref5].

      2 Bij ministeriële regeling kan worden bepaald dat het verstrekken van gegevens of bescheiden uit de door
      aangewezen telers en coffeeshops krachtens het eerste lid, onder a, bij te houden administratie uitsluitend op
      elektronische wijze plaatsvindt. Daarbij kunnen nadere eisen worden gesteld aan het gebruik van de elektronische
      weg.


      [ref1]: https://wetten.overheid.nl/BWBR0042818#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0001941#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0042818#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0001941#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0042818#Artikel4
