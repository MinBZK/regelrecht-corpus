  - number: 8a
    text: |-
      1 Bij algemene maatregel van bestuur wordt bepaald hoe lang de persoonsgegevens die Onze Ministers in verband met
      de uitoefening van hun taken op grond van deze wet verwerken, mogen worden bewaard.

      2 Bij algemene maatregel van bestuur worden regels gesteld over de verstrekking van gegevens, waaronder
      persoonsgegevens, die Onze Ministers, de burgemeesters van de gemeenten, bedoeld in [artikel 6, eerste lid][ref1],
      of de krachtens [artikel 8, eerste lid][ref2], aangewezen personen hebben verkregen of die nodig zijn in verband
      met de uitoefening van hun taken of bevoegdheden op grond van deze wet, en over de verdere verwerking van die
      gegevens in het kader van het experiment. Daarbij wordt in ieder geval bepaald aan wie welke persoonsgegevens mogen
      worden verstrekt en voor welk doel deze persoonsgegevens mogen worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0042818#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0042818#Artikel8
