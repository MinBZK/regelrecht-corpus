  - number: 5b
    text: |-
      Een corporatie die niet is een Nederlandse rechtspersoon en is vermeld in de lijst, bedoeld in artikel 2, derde
      lid, van [Verordening (EG) nr. 2580/2001](32001R2580) van de Raad van 27 december 2001 (PbEG L 344) of in Bijlage
      I van [Verordening (EG) nr. 881/2002](32002R0881) van de Raad van 27 mei 2002 (PbEG L 139) of is vermeld en met
      een ster aangemerkt in de Bijlage bij het Gemeenschappelijk Standpunt nr. 2001/931 van de Raad van 27 december 2001
      (PbEG L 344) is van rechtswege verboden en niet bevoegd tot het verrichten van rechtshandelingen.
    url: https://wetten.overheid.nl/BWBR0009192/2007-02-01#Artikel5b
  - number: '6'
    text: |-
      Deze wet laat onverlet hetgeen bepaald is bij de [Wet op de formeel buitenlandse vennootschappen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009191
