  - number: '7'
    text: |-
      De Wet van 25 juli 1959, Stb. 256 houdende uitvoering van het op 1 juni 1956 te 's-Gravenhage gesloten Verdrag
      nopens de erkenning van de rechtspersoonlijkheid van vreemde vennootschappen, verenigingen en stichtingen wordt
      hierbij ingetrokken.
    url: https://wetten.overheid.nl/BWBR0009192/2007-02-01#Artikel7
