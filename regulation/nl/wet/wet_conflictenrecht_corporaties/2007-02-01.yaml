  - number: '5'
    text: |-
      1 In afwijking in zoverre van het in de [artikelen 2][ref1] en [3][ref2] bepaalde zijn de artikelen 138 en 149
      van boek 2 van het Burgerlijk Wetboek van toepassing dan wel van overeenkomstige toepassing op de aansprakelijkheid
      van bestuurders en commissarissen van een ingevolge [artikel 2][ref3] of [artikel 4][ref4] door buitenlands
      recht beheerste corporatie die in Nederland aan de heffing van vennootschapsbelasting onderworpen is, indien de
      corporatie in Nederland failliet wordt verklaard. Als bestuurders zijn eveneens aansprakelijk degenen die met de
      leiding van de in Nederland verrichte werkzaamheden zijn belast.

      2 De rechtbank die het faillissement heeft uitgesproken is bevoegd tot de kennisneming van alle vorderingen uit
      hoofde van het bepaalde in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0009192#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0009192#Artikel3
