preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is bij de wet regels te stellen houdende internationaal
    privaatrecht met betrekking tot corporaties;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0009192/2007-02-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet wordt verstaan onder

      a. corporatie: vennootschappen, verenigingen, coöperaties, onderlinge waarborgmaatschappijen, stichtingen en andere
      als zelfstandige eenheid of organisatie naar buiten optredende lichamen en samenwerkingsverbanden;

      b. functionaris: hij die, zonder orgaan te zijn, krachtens het op de corporatie toepasselijke recht en haar
      statuten of samenwerkingsovereenkomst bevoegd is deze te vertegenwoordigen.
    url: https://wetten.overheid.nl/BWBR0009192/2007-02-01#Artikel1
  - number: '2'
    text: |-
      Een corporatie die ingevolge de oprichtingsovereenkomst of akte van oprichting haar zetel of, bij gebreke daarvan,
      haar centrum van optreden naar buiten ten tijde van de oprichting, heeft op het grondgebied van de Staat naar welks
      recht zij is opgericht, wordt beheerst door het recht van die Staat.
    url: https://wetten.overheid.nl/BWBR0009192/2007-02-01#Artikel2
  - number: '3'
    text: |-
      Het op een corporatie toepasselijke recht beheerst naast de oprichting in het bijzonder de volgende onderwerpen:

      a. het bezit van rechtspersoonlijkheid, of van de bevoegdheid drager te zijn van rechten en verplichtingen,
      rechtshandelingen te verrichten en in rechte op te treden;

      b. het inwendig bestel van de corporatie en alle daarmee verband houdende onderwerpen;

      c. de bevoegdheid van organen en functionarissen van de corporatie om haar te vertegenwoordigen;

      d. de aansprakelijkheid van bestuurders, commissarissen en andere functionarissen als zodanig jegens de corporatie;

      e. de vraag wie naast de corporatie, voor de handelingen waardoor de corporatie wordt verbonden aansprakelijk
      is uit hoofde van een bepaalde hoedanigheid zoals die van oprichter, vennoot, aandeelhouder, lid, bestuurder,
      commissaris of andere functionaris van de corporatie;

      f. de beëindiging van het bestaan van de corporatie.
    url: https://wetten.overheid.nl/BWBR0009192/2007-02-01#Artikel3
  - number: '4'
    text: |-
      Indien een rechtspersoonlijkheid bezittende corporatie haar statutaire zetel verplaatst naar een ander land en
      het recht van de Staat van de oorspronkelijke zetel en dat van de Staat van de nieuwe zetel op het tijdstip van
      de zetelverplaatsing het voortbestaan van de corporatie als rechtspersoon erkennen, wordt haar voortbestaan als
      rechtspersoon ook naar Nederlands recht erkend. Vanaf de zetelverplaatsing beheerst het recht van de Staat van de
      nieuwe zetel de in [artikel 3][ref1] bedoelde onderwerpen, behoudens indien ingevolge dat recht daarop het recht
      van de Staat van de oorspronkelijke zetel van toepassing blijft.


      [ref1]: https://wetten.overheid.nl/BWBR0009192#Artikel3
    url: https://wetten.overheid.nl/BWBR0009192/2007-02-01#Artikel4
    references:
      - id: ref1
