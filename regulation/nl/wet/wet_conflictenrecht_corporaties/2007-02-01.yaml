  - number: 5a
    text: |-
      1 Het openbaar ministerie kan de rechtbank te Utrecht verzoeken voor recht te verklaren dat
      het doel of de werkzaamheid van een corporatie in strijd is met de openbare orde als bedoeld in
      [artikel 20 van Boek 2 van het Burgerlijk Wetboek][ref1].

      2 De verklaring werkt voor en tegen een ieder met ingang van de eerste dag na de dag van de uitspraak.
      De verklaring wordt door de zorg van de griffier geplaatst in de Staatscourant. Is de corporatie in het
      handelsregister ingeschreven, dan wordt de verklaring aldaar eveneens ingeschreven.

      3 De rechter kan de in Nederland gelegen goederen van de corporatie desverlangd onder bewind stellen.
      [Artikel 22 van Boek 2 van het Burgerlijk Wetboek][ref2] is van overeenkomstige toepassing.

      4 De in Nederland gelegen goederen van een corporatie ten aanzien waarvan de rechter een verklaring voor recht als
      bedoeld in het eerste lid heeft gegeven, worden vereffend door een of meer door hem te benoemen vereffenaars. De
      [artikelen 23 tot en met 24 van Boek 2 van het Burgerlijk Wetboek][ref3] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Artikel23
