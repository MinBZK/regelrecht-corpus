  - number: '4.1'
    text: |-
      1 Volgens de [bijlagen IVe][ref1], [IVf][ref2] en [IVg][ref3] worden herberekend:

      a. de op het tijdstip van inwerkingtreding van de [Aanvullingswet geluid Omgevingswet][ref4] vastgestelde
      geluidproductieplafonds;

      b. de geluidproductieplafonds die onder de werking van [artikel 3.1, eerste lid, onder a en d][ref5], of
      [3.3, tweede lid, onder c, van de Aanvullingswet geluid Omgevingswet][ref6] vallen; en

      c. de geluidproductieplafonds die zijn opgenomen in een ontwerptracé-besluit dat op of na het tijdstip van
      inwerkingtreding van de [Aanvullingswet geluid Omgevingswet][ref7] ter inzage is gelegd.

      2 Bij het herberekenen van de geluidproductieplafonds, bedoeld in het eerste lid, onder a, worden
      de geluidbrongegevens, behorende bij het onmiddellijk voorafgaand aan de inwerkingtreding van de
      [Aanvullingswet geluid Omgevingswet][ref8] geldende geluidproductieplafond gebruikt.

      3 Bij het herberekenen van de geluidproductieplafonds, bedoeld in het eerste lid, onder b en c, worden de
      geluidbrongegevens gebruikt die horen bij de in die onderdelen genoemde geluidproductieplafonds.

      4 In afwijking van het tweede lid kunnen voor wegen, voor de situatie waarop het geluidproductieplafond als
      omgevingswaarde is gebaseerd:

      a. verschillende bronregisterlijnen uit het geluidregister worden gecombineerd tot één geluidbronregisterlijn,
      gelegen in het midden van de rijbaan; en

      b. geactualiseerde gegevens worden gebruikt voor de ligging van de geluidbronregisterlijnen
      die horen bij geluidproductieplafonds die zijn vastgesteld op basis van
      [artikel 11.45, eerste lid, van de Wet milieubeheer][ref9].

      5 Bij het herberekenen van het geluidproductieplafond van een spoorweg is het geluidproductieplafond als
      omgevingswaarde niet lager dan 52,0 dB, als:

      1°. het geluidproductieplafond na 1 juli 2012 niet is gewijzigd, anders dan om de redenen, bedoeld in
      [artikel 11.47, eerste lid, onder a en b, van de Wet milieubeheer][ref10]; en

      2°. er geen geluidbeperkend werk of bouwwerk aanwezig is dat is geplaatst om het geluid door de spoorweg op een
      geluidgevoelig gebouw te beperken.


