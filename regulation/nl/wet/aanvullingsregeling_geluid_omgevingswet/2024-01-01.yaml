  - number: 4.1.1
    text: |-
      Volgens de [bijlagen IVe][ref1], [IVf][ref2] en [IVg][ref3] worden herberekend:


      [ref1]: https://wetten.overheid.nl/BWBR0045528
      [ref2]: https://wetten.overheid.nl/BWBR0045528
      [ref3]: https://wetten.overheid.nl/BWBR0045528
    url: https://wetten.overheid.nl/BWBR0045504/2024-01-01#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0045528
      - id: ref2
        bwb_id: BWBR0045528
      - id: ref3
        bwb_id: BWBR0045528
  - number: 4.1.1.a
    text: |-
      de op het tijdstip van inwerkingtreding van de [Aanvullingswet geluid Omgevingswet][ref1] vastgestelde
      geluidproductieplafonds;


      [ref1]: https://wetten.overheid.nl/BWBR0043247
    url: https://wetten.overheid.nl/BWBR0045504/2024-01-01#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0043247
  - number: 4.1.1.b
    text: |-
      de geluidproductieplafonds die onder de werking van [artikel 3.1, eerste lid, onder a en d][ref1], of
      [3.3, tweede lid, onder c, van de Aanvullingswet geluid Omgevingswet][ref2] vallen; en


      [ref1]: https://wetten.overheid.nl/BWBR0043247#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0043247#Artikel3
    url: https://wetten.overheid.nl/BWBR0045504/2024-01-01#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0043247
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0043247
        artikel: '3'
  - number: 4.1.1.c
    text: |-
      de geluidproductieplafonds die zijn opgenomen in een ontwerptracé-besluit dat op of na het tijdstip van
      inwerkingtreding van de [Aanvullingswet geluid Omgevingswet][ref1] ter inzage is gelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0043247
    url: https://wetten.overheid.nl/BWBR0045504/2024-01-01#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0043247
  - number: 4.1.2
    text: |-
      Bij het herberekenen van de geluidproductieplafonds, bedoeld in het eerste lid, onder a, worden
      de geluidbrongegevens, behorende bij het onmiddellijk voorafgaand aan de inwerkingtreding van de
      [Aanvullingswet geluid Omgevingswet][ref1] geldende geluidproductieplafond gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0043247
    url: https://wetten.overheid.nl/BWBR0045504/2024-01-01#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0043247
  - number: 4.1.3
    text: |-
      Bij het herberekenen van de geluidproductieplafonds, bedoeld in het eerste lid, onder b en c, worden de
      geluidbrongegevens gebruikt die horen bij de in die onderdelen genoemde geluidproductieplafonds.
    url: https://wetten.overheid.nl/BWBR0045504/2024-01-01#Artikel4.1
  - number: 4.1.4
    text: |-
      In afwijking van het tweede lid kunnen voor wegen, voor de situatie waarop het geluidproductieplafond als
      omgevingswaarde is gebaseerd:
    url: https://wetten.overheid.nl/BWBR0045504/2024-01-01#Artikel4.1
  - number: 4.1.4.a
    text: |-
      verschillende bronregisterlijnen uit het geluidregister worden gecombineerd tot één geluidbronregisterlijn, gelegen
      in het midden van de rijbaan; en
    url: https://wetten.overheid.nl/BWBR0045504/2024-01-01#Artikel4.1
  - number: 4.1.4.b
    text: |-
      geactualiseerde gegevens worden gebruikt voor de ligging van de geluidbronregisterlijnen
      die horen bij geluidproductieplafonds die zijn vastgesteld op basis van
      [artikel 11.45, eerste lid, van de Wet milieubeheer][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel11
    url: https://wetten.overheid.nl/BWBR0045504/2024-01-01#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '11'
  - number: 4.1.5
    text: |-
      Bij het herberekenen van het geluidproductieplafond van een spoorweg is het geluidproductieplafond als
      omgevingswaarde niet lager dan 52,0 dB, als:
    url: https://wetten.overheid.nl/BWBR0045504/2024-01-01#Artikel4.1
  - number: 4.1.5.1°
    text: |-
      het geluidproductieplafond na 1 juli 2012 niet is gewijzigd, anders dan om de redenen, bedoeld in
      [artikel 11.47, eerste lid, onder a en b, van de Wet milieubeheer][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel11
    url: https://wetten.overheid.nl/BWBR0045504/2024-01-01#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '11'
  - number: 4.1.5.2°
    text: |-
      er geen geluidbeperkend werk of bouwwerk aanwezig is dat is geplaatst om het geluid door de spoorweg op een
      geluidgevoelig gebouw te beperken.
    url: https://wetten.overheid.nl/BWBR0045504/2024-01-01#Artikel4.1
  - number: '4.2'
    text: |-
      Als voor een industrieterrein nog geen geluidproductieplafond als omgevingswaarde is vastgesteld, wordt bij het
      bepalen van het gecumuleerde geluid als bedoeld in [artikel 3.25][ref1] en het gezamenlijke geluid als bedoeld
      in [artikel 3.26][ref2] uitgegaan van de op grond van de [Wet geluidhinder][ref3], zoals die gold onmiddellijk
      voorafgaand aan de inwerkingtreding van de [Aanvullingswet geluid Omgevingswet][ref4], ten hoogste toegestane
      geluidbelasting van het industrieterrein, uitgedrukt in L.


      [ref1]: https://wetten.overheid.nl/BWBR0045528#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0045528#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0003227
      [ref4]: https://wetten.overheid.nl/BWBR0043247
    url: https://wetten.overheid.nl/BWBR0045504/2024-01-01#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0045528
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0045528
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0003227
      - id: ref4
        bwb_id: BWBR0043247
  - number: 4.3.1
    text: |-
      Bij de toepassing van
      [artikel XI, eerste lid, aanhef en onder c, van het Aanvullingsbesluit geluid Omgevingswet][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0044679#ArtikelXI
    url: https://wetten.overheid.nl/BWBR0045504/2024-01-01#Artikel4.3
    references:
      - id: ref1
        bwb_id: BWBR0044679
        artikel: XI
  - number: 4.3.1.a
    text: |-
      blijft [artikel 3.29 van de Omgevingsregeling][ref1] buiten toepassing en wordt het aantal maatregelpunten bepaald
      volgens [bijlage I][ref2]; en


      [ref1]: https://wetten.overheid.nl/BWBR0045528#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0045504
    url: https://wetten.overheid.nl/BWBR0045504/2024-01-01#Artikel4.3
    references:
      - id: ref1
        bwb_id: BWBR0045528
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0045504
  - number: 4.3.1.b
    text: |-
      blijft [artikel 3.49, tweede lid, van het Besluit kwaliteit leefomgeving][ref1] buiten toepassing voor een
      diffractor die niet is geplaatst op een geluidscherm of geluidwal.


      [ref1]: https://wetten.overheid.nl/BWBR0041313#Artikel3
    url: https://wetten.overheid.nl/BWBR0045504/2024-01-01#Artikel4.3
    references:
      - id: ref1
        bwb_id: BWBR0041313
        artikel: '3'
  - number: 4.3.2
    text: |-
      De maatregelpunten omvatten het totaal van de maatregelpunten van bestaande en nieuw te treffen geluidbeperkende
      maatregelen waarvoor maatregelpunten gelden, ten opzichte van een weg of spoorweg in de situatie zonder
      maatregelen, bedoeld in [artikel 3.48 van het Besluit kwaliteit leefomgeving][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0041313#Artikel3
    url: https://wetten.overheid.nl/BWBR0045504/2024-01-01#Artikel4.3
    references:
      - id: ref1
        bwb_id: BWBR0041313
        artikel: '3'
  - number: 4.3.3
    text: |-
      Bij het toepassen van tabel 2 van [bijlage I][ref1] wordt de hoogte van een geluidscherm of geluidwal bepaald ten
      opzichte van de bovenkant van het spoor of de kantstreep van de weg aan de zijde van het scherm.


      [ref1]: https://wetten.overheid.nl/BWBR0045504
    url: https://wetten.overheid.nl/BWBR0045504/2024-01-01#Artikel4.3
    references:
      - id: ref1
        bwb_id: BWBR0045504
  - number: 4.3.4
    text: |-
      Voor de toepassing van [bijlage I][ref1] wordt verstaan onder: - *geluidgevoelig cluster:* geluidgevoelig cluster
      als bedoeld in [artikel XI, eerste lid, onder c, onder 3°, van het Aanvullingsbesluit geluid Omgevingswet][ref2];
        - *saneringsgebouw:* geluidgevoelig gebouw dat is vermeld op de lijst, bedoeld in
      [artikel 15.2 van het Omgevingsbesluit][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0045504
      [ref2]: https://wetten.overheid.nl/BWBR0044679#ArtikelXI
      [ref3]: https://wetten.overheid.nl/BWBR0041278#Artikel15
    url: https://wetten.overheid.nl/BWBR0045504/2024-01-01#Artikel4.3
    references:
      - id: ref1
        bwb_id: BWBR0045504
      - id: ref2
        bwb_id: BWBR0044679
        artikel: XI
      - id: ref3
        bwb_id: BWBR0041278
        artikel: '15'
  - number: '4.4'
    text: |-
      Totdat het omgevingsplan voor een industrieterrein onherroepelijk voorziet in een geluidaandachtsgebied
      dat is vastgesteld op grond van [artikel 3.31 van het Besluit kwaliteit leefomgeving][ref1], worden
      in afwijking van [artikel 12.78, aanhef en onder b, van de Omgevingsregeling][ref2], onverminderd
      de onderdelen a, c en d, van dat artikel, activiteiten op industrieterreinen als bedoeld in
      [artikel 11.50, eerste lid, onder c, onder 1°, van het Besluit kwaliteit leefomgeving][ref3], op geografische
      kaarten weergegeven door verbeelding van de zone rond het industrieterrein, vastgesteld op grond van
      [artikel 40 van de Wet geluidhinder][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0041313#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0045528#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0041313#Artikel11
      [ref4]: https://wetten.overheid.nl/BWBR0003227#Artikel40
    url: https://wetten.overheid.nl/BWBR0045504/2024-01-01#Artikel4.4
    references:
      - id: ref1
        bwb_id: BWBR0041313
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0045528
        artikel: '12'
      - id: ref3
        bwb_id: BWBR0041313
        artikel: '11'
      - id: ref4
        bwb_id: BWBR0003227
        artikel: '40'
  - number: 5.1.1
    text: |-
      Deze regeling treedt in werking op een bij ministerieel besluit te bepalen tijdstip, dat voor de verschillende
      artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0045504/2024-01-01#Artikel5.1
  - number: 5.1.2
    text: Een ministerieel besluit als bedoeld in het eerste lid wordt in de Staatscourant bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0045504/2024-01-01#Artikel5.1
  - number: '5.2'
    text: 'Deze regeling wordt aangehaald als: Aanvullingsregeling geluid Omgevingswet.'
    url: https://wetten.overheid.nl/BWBR0045504/2024-01-01#Artikel5.2
