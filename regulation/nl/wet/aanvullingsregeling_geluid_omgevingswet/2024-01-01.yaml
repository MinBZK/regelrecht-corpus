  - number: '4.3'
    text: |-
      1 Bij de toepassing van
      [artikel XI, eerste lid, aanhef en onder c, van het Aanvullingsbesluit geluid Omgevingswet][ref1]:

      a. blijft [artikel 3.29 van de Omgevingsregeling][ref2] buiten toepassing en wordt het aantal maatregelpunten
      bepaald volgens [bijlage I][ref3]; en

      b. blijft [artikel 3.49, tweede lid, van het Besluit kwaliteit leefomgeving][ref4] buiten toepassing voor een
      diffractor die niet is geplaatst op een geluidscherm of geluidwal.

      2 De maatregelpunten omvatten het totaal van de maatregelpunten van bestaande en nieuw te treffen geluidbeperkende
      maatregelen waarvoor maatregelpunten gelden, ten opzichte van een weg of spoorweg in de situatie zonder
      maatregelen, bedoeld in [artikel 3.48 van het Besluit kwaliteit leefomgeving][ref5].

      3 Bij het toepassen van tabel 2 van [bijlage I][ref6] wordt de hoogte van een geluidscherm of geluidwal bepaald ten
      opzichte van de bovenkant van het spoor of de kantstreep van de weg aan de zijde van het scherm.

      4 Voor de toepassing van [bijlage I][ref7] wordt verstaan onder:

        - *geluidgevoelig cluster:* geluidgevoelig cluster als bedoeld in
      [artikel XI, eerste lid, onder c, onder 3°, van het Aanvullingsbesluit geluid Omgevingswet][ref8];
        - *saneringsgebouw:* geluidgevoelig gebouw dat is vermeld op de lijst, bedoeld in
      [artikel 15.2 van het Omgevingsbesluit][ref9].


