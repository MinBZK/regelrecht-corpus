  - number: '3.1'
    text: |-
      De volgende regelingen worden ingetrokken:

      a. [Bijdrageregeling geluidhinder nieuwe woningen][ref1];

      b. [Regeling doelmatigheid geluidmaatregelen Wet geluidhinder][ref2];

      c. [Regeling geluid milieubeheer][ref3];

      d. [Regeling geluidplafondkaart milieubeheer][ref4];

      e. [Regeling saneringsprogramma industrielawaai][ref5];

      f. [Regeling zonekaart spoorwegen geluidhinder][ref6]; en

      g. [Reken- en meetvoorschrift geluid 2012][ref7].


