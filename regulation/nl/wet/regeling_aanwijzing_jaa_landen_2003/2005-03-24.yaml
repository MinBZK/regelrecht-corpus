  - number: '3'
    text: |-
      1 Onverminderd de bij of krachtens het [Besluit bewijzen van bevoegdheid voor de luchtvaart][ref1] gestelde
      bepalingen, worden de bewijzen van bevoegdheid en de bewijzen van erkenning van opleidingsinstellingen zonder
      formaliteiten erkend, indien zij zijn afgegeven in overeenstemming met de bepalingen van JAR-66 en JAR-147 door de
      bevoegde autoriteiten van de volgende staten:

      a. België;

      b. Denemarken;

      c. Duitsland;

      d. Finland;

      e. Frankrijk;

      f. Griekenland;

      g. Ierland;

      h. IJsland;

      i. Italië;

      j. Malta;

      k. Noorwegen;

      l. Oostenrijk;

      m. Roemenië;

      n. Tsjechische Republiek;

      o. het Verenigd Koninkrijk van Groot-Brittannië en Noord-Ierland;

      p. Zweden; en

      q. Zwitserland.

      2 Onverminderd de bij of krachtens het [Besluit bewijzen van bevoegdheid voor de luchtvaart][ref2] gestelde
      bepalingen, worden de certificaten van opleiding door Nederland zonder formaliteiten erkend, indien zij zijn
      afgegeven in overeenstemming met de bepalingen van JAR-66 en JAR-147 door opleidingsinstellingen, die volgens JAR-
      147 zijn erkend door de autoriteiten van de staten, genoemd in het eerste lid.


