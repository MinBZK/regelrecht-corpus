articles:
  - number: '1'
    text: |-
      Onverminderd de bij of krachtens het [Besluit bewijzen van bevoegdheid voor de luchtvaart][ref1] gestelde
      bepalingen, worden de bewijzen van bevoegdheid, bewijzen van gelijkstelling, bewijzen van kwalificatie of
      registratie van opleidingsinstellingen en medische verklaringen zonder formaliteiten erkend, indien zij zijn
      afgegeven in overeenstemming met de bepalingen van JAR-FCL 1 en 3 door de bevoegde autoriteiten van de volgende
      staten:

      a. België;

      b. Denemarken;

      c. Duitsland;

      d. Finland;

      e. Frankrijk;

      f. Griekenland;

      g. Ierland;

      h. IJsland;

      i. Malta;

      j. Noorwegen;

      k. Portugal;

      l. Roemenië;

      m. Slovenië;

      n. Spanje;

      o. Tsjechische Republiek;

      p. het Verenigd Koninkrijk van Groot-Brittannië en Noord-Ierland;

      q. Zweden; en

      r. Zwitserland.


