preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is maatregelen te treffen om de arbeidsparticipatie van
    ouderen te bevorderen door middel van aanpassing van de fiscale behandeling van VUT- en prepensioenregelingen
    in samenhang met het bevorderen van de combinatie van arbeid en andere activiteiten door middel van een
    levensloopregeling;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0018053/2006-01-01#ArtikelAanhef
articles:
  - number: XIII
    text: |-
      A

      B

      C Voorzover een egalisatiereserve als bedoeld in
      [artikel 3.53, eerste lid, onderdeel a, van de Wet inkomstenbelasting 2001][ref1] of een voorziening samenhangt
      met een regeling voor vervroegde uittreding waarop [artikel 38c van de Wet op de loonbelasting 1964][ref2]
      van toepassing is, blijft [artikel 8, zevende lid, van de Wet op de vennootschapsbelasting 1969][ref3] buiten
      toepassing.

      D In afwijking in zoverre van [artikel 19g, eerste lid, van de Wet op de loonbelasting 1964][ref4], zoals dat
      artikel op 1 januari 2006 luidt, kunnen voor werknemers die op 31 december 2005 de leeftijd van 51 jaar maar
      niet de leeftijd van 56 jaar hebben bereikt, in het kalenderjaar meer aanspraken ontstaan dan overeenkomt met 12
      procent van het loon van het jaar, voorzover de totale aanspraken aan het einde van het kalenderjaar door de in het
      kalenderjaar opgebouwde aanspraken een periode van extra verlof van 2,1 jaar niet te boven gaan.

      E In afwijking in zoverre van [artikel 19g, eerste lid, van de Wet op de loonbelasting 1964][ref5], zoals dat
      artikel op 1 januari 2006 luidt, kunnen voor werknemers die in een kalenderjaar pensioenaanspraken als bedoeld
      in [artikel 19b, vijfde lid][ref6], afkopen, in dat kalenderjaar meer aanspraken ontstaan dan overeenkomt met
      12 procent van het loon van het jaar, voorzover zulks het gevolg is van de aanwending van de afkoop van de
      pensioenaanspraken voor het opbouwen van een voorziening ingevolge een levensloopregeling met dien verstande dat de
      totale aanspraken aan het einde van het kalenderjaar door de in het kalenderjaar opgebouwde aanspraken een periode
      van extra verlof van 2,1 jaar niet te boven gaan.


