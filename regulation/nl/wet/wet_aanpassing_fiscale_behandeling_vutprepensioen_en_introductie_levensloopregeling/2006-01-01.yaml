  - number: XVI
    text: |-
      1 Onder toepassing van [artikel 16 van de Tijdelijke referendumwet][ref1] treedt deze wet in werking met ingang van
      1 januari 2005.

      2 [Artikel 10, vierde lid, van de Wet op de loonbelasting 1964][ref2], zoals dat komt te luiden ingevolge
      [artikel I, onderdeel A][ref3], werkt terug tot en met 16 september 2004 voor uitkeringen die worden genoten als
      gevolg van afkoop, vervreemding of het formeel of feitelijk onderwerp van zekerheid worden van de aanspraak, anders
      dan ten behoeve van uitstel van betaling op grond van [artikel 25, vijfde lid, van de Invorderingswet 1990][ref4].


