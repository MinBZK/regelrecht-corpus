      1 De verplichtingen op grond van het recht op pensioen dat de gepensioneerde onmiddellijk voorafgaande aan het
      tijdstip van transitie op grond van de Pensioenlandsverordening overheidsdienaren (P.B. 1997, no 312) gaan op dat
      tijdstip over op:

      a. indien de gepensioneerde op het moment van diens ontslag in dienst was van het eilandgebied Sint Maarten of in
      dienst was van het land Nederlandse Antillen met als laatste standplaats Sint Maarten of als de laatste werkgever
      van de gepensioneerde op Sint Maarten gevestigd was: het land Sint Maarten.

      b. indien de gepensioneerde op het moment van diens ontslag in dienst was van het eilandgebied Bonaire, het
      eilandgebied Sint Eustatius of het eilandgebied Saba of in dienst was van het land Nederlandse Antillen met als
      laatste standplaats een van de eilandgebieden Bonaire, Sint Eustatius of Saba of als de laatste werkgever van de
      gepensioneerde op het eilandgebied Bonaire, het eilandgebied Sint Eustatius dan wel het eilandgebied Saba gevestigd
      was: het land Nederland;

      c. in alle overige gevallen: het land Curaçao.

      2 Ten aanzien van de verplichtingen op grond van opgebouwde rechten die een gewezen overheidsdienaar of een actieve
      overheidsdienaar onmiddellijk voorafgaande aan het tijdstip van transitie ontleent aan de Pensioenlandsverordening
      overheidsdienaren (P.B. 1997, no 312) is het eerste lid van overeenkomstige toepassing. Ten aanzien van de actieve
      overheidsdienaar geldt daarbij in de plaats van het moment van ontslag, het moment van transitie.

      3 Het eerste lid is van overeenkomstige toepassing op de verplichtingen ten aanzien van het recht op
      nabestaanden- en wezenpensioen dat onmiddellijk voorafgaande aan het tijdstip van transitie wordt ontleend aan de
      Pensioenlandsverordening overheidsdienaren. Daarbij geldt in de plaats van het moment van ontslag, het moment van
      overlijden van degene aan wiens overlijden dat recht wordt ontleend.

      4 Voor de toepassing van het eerste en tweede lid is het Regionaal Service Centrum een op het eilandgebied Bonaire
      gevestigde werkgever.

      5 De overnemende landen zullen de noodzakelijke landelijke wetgeving tot stand brengen waarin het recht op
      pensioen, bedoeld in het eerste lid, en de verplichtingen op grond van opgebouwde rechten op pensioen, bedoeld in
      het tweede lid, en het recht op nabestaanden- en wezenpensioen, bedoeld in het derde lid, voorzover het opgebouwde
      recht tot aan transitiedatum betreft onverkort worden gegarandeerd.

      6 Op aanspraken ten laste van de landen Curaçao, Sint Maarten en Nederland is de wetgeving van het overnemende land
      van toepassing.

      7 De deelgenoten van het Werkliedenpensioenfonds, de verplichtingen jegens hen en het gereserveerde vermogen
      worden, tenzij anders wordt overeengekomen tussen partijen, op overeenkomstige wijze als hier ten aanzien van de
      deelgenoten in het Algemeen Pensioenfonds Nederlandse Antillen is bepaald, toegewezen aan de landen Sint Maarten,
      Nederland en Curaçao. Partijen maken uiterlijk voor 31 december 2011 nadere afspraken over de praktische uitwerking
      van deze bepaling. Tot dat moment blijven activa en passiva van dit fonds onverdeeld.

      8 Uiterlijk voor 31 december 2011 maken partijen nadere afspraken over de verdeling van lusten en lasten ten
      aanzien van de aan Curaçao toegewezen deelgenoten met als laatste standplaats Aruba.
