      Vóór het tijdstip van transitie bij de Algemeen Pensioenfonds van de Nederlandse Antillen respectievelijk het
      Werkliedenpensioenfonds ingediende aanvragen om een uitkering gaan, indien op de aanvraag nog geen beslissing is
      genomen, in de staat waarin zij zich bevinden, over naar het overnemende land.
    url: https://wetten.overheid.nl/BWBR0028963/2010-10-02#Artikel7
  - number: '8'
    text: |-
      1 Op het tijdstip van transitie bij de Algemeen Pensioenfonds van de Nederlandse Antillen respectievelijk
      het Werkliedenpensioenfonds aanhangige bezwaarschriften in verband met de toepassing van de in
      [artikel 1, eerste lid, onder h][ref1] genoemde regelingen zoals deze onmiddellijk voorafgaand aan het tijdstip van
      transitie luiden, gaan in de stand waarin zij zich bevinden, over naar het overnemende land.

      2 Indien op het tijdstip van transitie het Algemeen Pensioenfonds van de Nederlandse Antillen respectievelijk
      het Werkliedenpensioenfonds partij is in een geding betreffende de toepassing van een regeling als bedoeld in het
      eerste lid, treedt het overnemende land in de plaats van de Algemeen Pensioenfonds van de Nederlandse Antillen
      respectievelijk het Werkliedenpensioenfonds, met overneming van procureurstelling onderscheidenlijk aanwijzing van
      een gemachtigde.


