  - number: '13'
    text: |-
      Indien zich bij de uitvoering van deze onderlinge regeling geschillen voordoen
      dan kunnen deze worden voorgelegd aan een geschillencommissie zoals vermeld in
      [paragraaf 4 van de Onderlinge Regeling inzake regeling vereffening boedel Nederlandse Antillen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028964#Paragraaf4
