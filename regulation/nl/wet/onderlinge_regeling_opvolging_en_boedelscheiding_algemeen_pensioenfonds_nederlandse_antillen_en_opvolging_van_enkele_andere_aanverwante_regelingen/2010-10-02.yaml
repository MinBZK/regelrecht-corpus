  - number: '4'
    text: |-
      1 De verplichtingen ten aanzien van aanspraken op de door het Algemeen Pensioenfonds van de Nederlandse Antillen
      uitgevoerde Duurtetoeslagregeling pensioengerechtigden 1943 (P.B. 1943 no. 77), de landsverordening verhoging
      leeftijdsgrens ambtenaren (P.B. 1959 no. 126), de landsverordening verhoging leeftijdsgrens 1996 (P.B. 1995
      no 230), en de pensioenregeling politieke gezagsdragers (P.B. 2006, no 31), pensioenregeling ministers P.B.
      1969 no. 104; Pensioenregeling leden der Staten P.B. 1990 n. 82, voor zover van toepassing op personeel en
      voormalig personeel in dienst van het Land Nederlandse Antillen en de eilandgebieden Bonaire, Curaçao, Saba,
      St. Eustatius en St. Maarten, worden overgenomen door de landen Curaçao, Sint Maarten en Nederland via de in
      [artikel 2, vierde lid][ref1], bedoelde wetgeving.

      2 De wijze van verdeling geschiedt op dezelfde wijze als in [artikel 2][ref2] gebeurt t.a.v. de deelgenoten van het
      Pensioenfonds van de Nederlandse Antillen. Evenals bij de kapitaalgedekte pensioenen geschiedt de toedeling voor de
      aanspraken op duurtetoeslag, vut, uitkering bij wijze van pensioen voor actieven, uitkeringsgerechtigden en gewezen
      overheidsdienaren op basis van de laatste standplaats, dan wel de standplaats op het moment van transitie. Voor
      politieke gezagsdragers dragers geschiedt de toedeling op basis van het eilandgebied dat zij vertegenwoordig(d)en.

      3 Uitkerings- en pensioenaanspraken op grond van de Pensioenregeling politieke gezagdragers van gewezen leden
      der Staten, de gevolmachtigde minister, ministers, staatssecretarissen, gezaghebbers en hun nabestaanden worden
      overgenomen door de landen Curaçao, Sint Maarten en Nederland.

      4 Uitkerings- en/of pensioenaanspraken komen ten laste van het land Curaçao van gewezen gezaghebbers en hun
      nabestaanden van het eilandgebied Curaçao en van gewezen leden der Staten, ministers en staatssecretarissen en hun
      nabestaanden die namens een politieke partij van het eilandgebied Curaçao waren vertegenwoordigd in de Staten of
      benoemd als minister, staatssecretaris of gevolmachtigde minister. Uitkerings- en/of pensioenaanspraken komen ten
      laste van het land St. Maarten van gewezen gezaghebbers en hun nabestaanden van het eilandgebied St. Maarten en
      van gewezen leden der Staten, ministers en staatssecretarissen en hun nabestaanden die namens een politieke partij
      van het eilandgebied St. Maarten waren vertegenwoordigd in de Staten of benoemd als minister, staatssecretaris
      of gevolmachtigde minister. Uitkerings- en/of pensioenaanspraken komen ten laste van Nederland van gewezen
      gezaghebbers en hun nabestaanden van de eilandgebieden Bonaire, St. Eustatius en Saba en van gewezen leden der
      Staten, ministers en staatssecretarissen en hun nabestaanden die namens een politieke partij van de eilandgebieden
      Bonaire, St. Eustatius en Saba waren vertegenwoordigd in de Staten of benoemd als minister, staatssecretaris of
      gevolmachtigde minister.

      5 Stortingen door de overheid van de Nederlandse Antillen voor niet kapitaalgedekte uitkeringen
      bij het Algemeen Pensioenfonds van de Nederlandse Antillen, worden in dezelfde aandelen onder
      de landen Curaçao, Sint Maarten en Nederland verdeeld volgens de verdeelsleutel, genoemd in
      [artikel 3, eerste lid, van de Onderlinge regeling vereffening boedel Nederlandse Antillen][ref3]. De daaruit
      resulterende bedragen voor de landen Curaçao, Sint Maarten respectievelijk Nederland worden direct bij de
      voorschotverlening aan die landen ter beschikking gesteld of indien het moment van storting is gelegen na het
      moment van voorschotbetaling, direct per moment van datum van transitie.


