  - number: '9'
    text: |-
      1 Partijen komen overeen dat de uitvoeringsorganisatie van het land Curaçao op zich neemt om de archiefbescheiden
      ter zake overheidsdienaren en gewezen overheidsdienaren die met toepassing van de landsverordening vaststelling
      en verdeling van de boedel van het Algemeen Pensioenfonds van de Nederlandse Antillen respectievelijk het
      Werkliedenpensioenfonds aan Sint Maarten en Nederland ingaande het tijdstip van transitie worden toegedeeld, aan
      het overnemende land dan wel de namens dat land optredende uitvoeringsorganisatie, over te dragen.

      De pensioengerechtigden, gewezen overheidsdienaren en actieve deelgenoten worden tijdig over de gevolgen van de op
      het tijdstip van transitie nieuw ingaande situatie geïnformeerd. De informatievoorziening ter zake wordt tussen de
      vertegenwoordigers van de (toekomstige) landen onderling afgestemd.
    url: https://wetten.overheid.nl/BWBR0028963/2010-10-02#Artikel9
  - number: '10'
    text: |-
      1 De waardering van de activa en de passiva van het Algemeen Pensioenfonds van de Nederlandse Antillen
      respectievelijk het Werkliedenpensioenfonds wordt per tijdstip direct voorafgaand aan het tijdstip van transitie
      vastgesteld.

      2 Voor de waardering van de activa en de passiva van het Algemeen Pensioenfonds van de Nederlandse Antillen
      respectievelijk het Werkliedenpensioenfonds, vormt de waardevaststelling zoals opgenomen in de eindbalans
      van de jaarrekening per het tijdstip direct voorafgaand aan het tijdstip van transitie het uitgangspunt, met
      als voorwaarde dat alle activa, inclusief het vastgoed, en alle passiva, met uitzondering van de voorziening
      pensioenverplichting, tegen marktwaarde zijn gewaardeerd.

      3 De verdeling van de activa en de passiva minus voorziening pensioenverplichting tussen de landen Curaçao,
      Sint Maarten en Nederland geschiedt evenredig aan de relatieve aandelen (afgerond op 5 cijfers na de komma) in
      de voorziening pensioenverplichtingen incl eventuele excassoreserves, schadereserves, solvabiliteitsmarges en
      andere relevante voorzieningen op grond van. [artikel 2][ref1]. De aandelen van de landen Curaçao, Sint Maarten en
      Nederland in het totale van activa en passiva minus voorziening pensioenverplichting van het Algemeen Pensioenfonds
      van de Nederlandse Antillen respectievelijk het Werkliedenpensioenfonds is gelijk aan de verhouding van de som
      van de premiereserves (=voorziening pensioenverplichtingen incl. eventuele excassoreserves, schadereserves,
      solvabiliteitsmarges en andere relevante voorzieningen) op het moment direct voorafgaande aan de transitiedatum van
      de aan de landen Curaçao, Sint Maarten en Nederland toebedeelde deelgenoten en de totale premiereserves van alle
      deelgenoten in het Algemeen Pensioenfonds van de Nederlandse Antillen respectievelijk het Werkliedenpensioenfonds
      op het moment direct voorafgaande aan de transitiedatum

      4 De vereffeningcommissie genoemd in
      p[aragraaf 3 van de Onderlinge Regeling vereffening boedel Nederlandse Antillen][ref2], wordt onder
      verantwoordelijkheid van de landen belast met het doen opstellen van de gecontroleerde jaarrekening (inclusief
      balans) per transitiedatum.. Het land Curaçao dan wel de op grond van [artikel 1 lid 2][ref3] opgedragen
      uitvoeringsorganisatie van het land Curaçao verleent hiertoe alle medewerking.

      5 De in het voorgaande lid bedoelde vereffeningscommissie brengt een advies uit aan de landen waarin in ieder geval
      in extenso gedetailleerd verslag wordt gedaan van de in het derde lid bedoelde berekeningen van de aandelen, de
      waardering van de verschillende activa en passiva, de gecontroleerde jaarrekening en het accountantsverslag.

      6 De landen leggen vervolgens de verdeling definitief vast.

      7 In de verdeling van het totaal van activa en passiva minus voorziening pensioenverplichting van het Algemeen
      Pensioenfonds van de Nederlandse Antillen wordt het voorschot, bedoeld in [artikel 11][ref4], verrekend

      8 Indien naar het oordeel van een van de landen gerede twijfel bestaat omtrent de volledigheid of juistheid van de
      in het vijfde lid genoemde stukken, kan dat land vorderen dat ter verificatie een nader onderzoek wordt ingesteld
      door een door de gezamenlijke landen aan te wijzen accountant, niet zijnde de reguliere accountant bedoeld in het
      vierde lid. De kosten van een nader onderzoek als bedoeld in de eerste volzin worden ten laste van het te verdelen
      vermogen van de Algemeen Pensioenfonds van de Nederlandse Antillen respectievelijk het Werkliedenpensioenfonds
      gebracht.

      9 Verschillen van mening worden door de landen in goed overleg opgelost. Indien dit niet lukt, kan het geschil
      op verzoek van tenminste een van de landen worden voorgelegd aan de geschillencommissie zoals vermeld in
      [paragraaf 4 van de Onderlinge Regeling inzake regeling vereffening boedel Nederlandse Antillen][ref5].’

      10 De definitieve vermogensbepaling en verdeling is uiterlijk op 31 december 2011 afgerond.


