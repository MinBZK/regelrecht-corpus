  - number: '3'
    text: |-
      1 Aan de onmiddellijk voorafgaande aan het tijdstip van transitie bestaande deelgenoten in het Algemeen
      Pensioenfonds Nederlandse Antillen respectievelijk het Werkliedenpensioenfonds wordt individueel bericht wat
      voor hun de tot aan het tijdstip van transitie voor pensioen meetellende tijd is en de pensioengrondslag is of de
      pensioengrondslagen zijn. De in de vorige volzin bedoelde tijd en grondslag of grondslagen worden vastgesteld door
      het Algemeen Pensioenfonds van de Nederlandse Antillen respectievelijk het Werkliedenpensioenfonds dan wel, na het
      tijdstip van transitie, elk van de landen. Dit is een formele beschikking waartegen bezwaar en beroep mogelijk is.

      2 Het Algemeen pensioenfonds Nederlandse Antillen respectievelijk het Werkliedenpensioenfonds, dan wel het land
      Curaçao dan wel de op grond van [artikel 1 lid 2][ref1] opgedragen uitvoeringsorganisatie van het land Curaçao
      maakt de individuele dossiers zo spoedig mogelijk, doch uiterlijk op 31-12-2011 overdrachtsklaar en stelt deze ter
      beschikking van de overnemende landen dan wel de op grond van artikel 1 lid 2 opgedragen uitvoeringsorganisaties
      van die landen. Elektronische bestanden worden volgens de in [bijlage 1][ref2] opgenomen specificatie uiterlijk per
      transitiedatum of zoveel eerder als mogelijk overgedragen.

      3 Per transitiedatum gaan de pensioenverplichtingen conform de verdeling in [art 2][ref3] over op de landen
      Curaçao, St. Maarten respectievelijk Nederland. Uiterlijk tot het in lid 2 genoemde moment blijft het land
      Curaçao dan wel de door hem opgedragen uitvoeringsorganisatie op grond van [artikel 1 lid 2][ref4], de uitkering
      dan wel een hiermee naar aard en strekking overeenkomende voorziening als administratiekantoor uitvoeren ten
      behoeve van de landen Sint Maarten en Nederland, naar het recht van die landen tenzij in goed overleg anders
      wordt overeengekomen. Hiertoe sluiten de landen Sint Maarten en Nederland een overdrachtsovereenkomst met het
      Algemeen Pensioenfonds van de Nederlandse Antillen respectievelijk het Werkliedenpensioenfonds dan wel met het
      land Curaçao dan wel met de op grond van artikel 1, tweede lid opgedragen uitvoeringsorganisatie van het land
      Curaçao. Onderdeel van een dergelijke overeenkomst is dat deze uitvoerder de onmiddellijk voorafgaande aan het
      tijdstip van transitie bestaande deelgenoten in het Algemeen Pensioenfonds Nederlandse Antillen respectievelijk
      het Werkliedenpensioenfonds individueel bericht wat voor hun de tot aan het tijdstip van transitie voor pensioen
      meetellende tijd is en de pensioengrondslag is of de pensioengrondslagen zijn.

      4 Totdat partijen anders afspreken, blijft het Werkliedenpensioenfonds, dan wel met het land Curaçao dan wel met
      de op grond van [artikel 1, tweede lid][ref5] opgedragen uitvoeringsorganisatie van het land Curaçao, uitvoerder
      van de werkliedenverordening 1944 (PB 1978 no 376) en beheerder van de verplichtingen en het vermogen van de
      deelgenoten in het Werkliedenpensioenfonds. Zij legt over het gevoerde beleid en de stand van het fonds ten minste
      een keer per jaar verantwoording af aan de landen Curaçao, Sint Maarten en Nederland.


