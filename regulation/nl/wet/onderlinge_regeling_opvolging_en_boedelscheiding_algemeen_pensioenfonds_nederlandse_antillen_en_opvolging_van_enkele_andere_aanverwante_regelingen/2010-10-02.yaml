      1 Aan de onmiddellijk voorafgaande aan het tijdstip van transitie bestaande deelgenoten in het Algemeen
      Pensioenfonds Nederlandse Antillen wordt individueel bericht wat voor hun de tot aan het tijdstip van transitie
      voor pensioen meetellende tijd is en de pensioengrondslag is of de pensioengrondslagen zijn. De in de vorige volzin
      bedoelde tijd en grondslag of grondslagen worden vastgesteld door het Algemeen Pensioenfonds van de Nederlandse
      Antillen dan wel, na het tijdstip van transitie, elk van de landen. Dit is een formele beschikking waartegen
      bezwaar en beroep mogelijk is.

      2 Het Algemeen pensioenfonds Nederlandse Antillen maakt de individuele dossiers zo spoedig mogelijk, doch uiterlijk
      op 31-12-2011 overdrachtsklaar en stelt deze ter beschikking van de overnemende landen dan wel de op grond van
      artikel 1, tweede lid opgedragen uitvoeringsorganisaties van die landen. Elektronische bestanden worden volgens de
      in bijlage 1 opgenomen specificatie uiterlijk per transitiedatum of zoveel eerder als mogelijk overgedragen.

      3 Per transitiedatum gaan de pensioenverplichtingen conform de verdeling in [art. 2][ref1] over op de landen
      Curaçao, St. Maarten respectievelijk Nederland. Uiterlijk tot het in lid 2 genoemde moment blijft het land Curaçao
      dan wel de door hem opgedragen uitvoeringsorganisatie op grond van [artikel 1 lid 2][ref2], de uitkering dan wel
      een hiermee naar aard en strekking overeenkomende voorziening als administratiekantoor uitvoeren ten behoeve van de
      landen Sint Maarten en Nederland, naar het recht van die landen tenzij in goed overleg anders wordt overeengekomen.
      Hiertoe sluiten de landen Sint Maarten en Nederland een overdrachtsovereenkomst met het Algemeen Pensioenfonds van
      de Nederlandse Antillen dan wel met het land Curaçao dan wel met de op grond van artikel 1, tweede lid opgedragen
      uitvoeringsorganisatie van het land Curaçao. Onderdeel van een dergelijke overeenkomst is dat deze uitvoerder
      de onmiddellijk voorafgaande aan het tijdstip van transitie bestaande deelgenoten in het Algemeen Pensioenfonds
      Nederlandse Antillen individueel bericht wat voor hun de tot aan het tijdstip van transitie voor pensioen
      meetellende tijd is en de pensioengrondslag is of de pensioengrondslagen zijn.


