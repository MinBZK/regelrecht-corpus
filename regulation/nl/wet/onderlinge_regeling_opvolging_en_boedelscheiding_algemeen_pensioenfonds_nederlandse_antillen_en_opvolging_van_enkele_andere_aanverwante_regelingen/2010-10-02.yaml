  - number: '11'
    text: |-
      1 De landen Curaçao, Sint Maarten en de staat der Nederlanden ontvangen op grond van
      [artikel 9 van de AMvRB rechtsopvolging burgerlijke rechten en verplichtingen Nederlandse Antillen][ref1] een
      voorschot op de verdeling van de boedel van het Algemeen Pensioenfonds Nederlandse Antillen. Partijen in deze
      Onderlinge Regeling spreken af dat genoemde voorschot wordt betaald op de dag na datum van uitgifte van het
      Staatsblad waarin de [AMvRB rechtsopvolging burgerlijke rechten en verplichtingen Nederlandse Antillen][ref2] in
      het staatsblad is geplaatst.

      2 Voor de duur dat het in
      [art  9 van de AMvRB rechtsopvolging burgerlijke rechten en verplichtingen Nederlandse Antillen][ref3] genoemde
      voorschot voor Sint Maarten in beheer blijft van het Algemeen Pensioenfonds van de Nederlandse Antillen, of diens
      rechtsopvolger, worden de op het moment van uitbetaling nog bestaande betalingsachterstanden nog niet in mindering
      gebracht op dit voorschot, uiteraard onder gelijktijdige handhaving van die vordering op Sint Maarten. Op het
      moment dat Sint Maarten uitbetaling vordert van het voorschot is het Algemeen Pensioenfonds van Sint Maarten,
      op wie de vordering op de transitiedatum van rechtswege is overgegaan, gerechtigd het voorschot op dat moment te
      salderen met de op dat moment nog openstaande vorderingen of betalingsachterstanden. De gespecificeerde vorderingen
      en achterliggende dossiers worden dan door het pensioenfonds dat tot dan het beheer voert over het pensioenfonds
      van Sint Maarten overgedragen aan het pensioenfonds van Sint Maarten.

      3 Op het in [art 9 van de AMvRB rechtsopvolging burgerlijke rechten en verplichtingen Nederlandse Antillen][ref4]
      genoemde voorschot voor Nederland worden de op het moment van uitbetaling nog bestaande betalingsachterstanden
      van de eilandgebieden Bonaire, St. Eustatius en Saba in mindering gebracht onder gelijktijdige overdracht door het
      Algemeen Pensioenfonds van de Nederlandse Antillen van de gespecificeerde vorderingen en achterliggende dossiers
      aan Nederland.


