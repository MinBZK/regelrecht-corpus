      1 Beslissingen van het Algemeen Pensioenfonds van de Nederlandse Antillen respectievelijk
      het Werkliedenpensioenfonds in verband met de toepassing van een regeling als bedoeld in
      [artikel 1, eerste lid sub h][ref1], genomen vóór het tijdstip van transitie, worden door het overnemende
      land gelijkgesteld met beslissingen van het overnemende land, dan wel de door het land opgedragen
      uitvoeringsorganisatie.

      2 Meldingen en kennisgevingen aan de Algemeen Pensioenfonds van de Nederlandse Antillen respectievelijk het
      Werkliedenpensioenfonds, gedaan vóór het tijdstip van transitie ter voldoening aan een op grond van een regeling
      als bedoeld in [artikel 1, eerste lid, onder h][ref2] geldende verplichting, worden geacht te zijn ingediend bij
      het overnemende land, dan wel de door het land opgedragen uitvoeringsorganisatie.


      [ref1]: https://wetten.overheid.nl/BWBR0028963#Artikel1
