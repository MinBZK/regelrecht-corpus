    text: |-
      1 In deze regeling wordt verstaan onder:

      a. *land:* Curaçao, Sint Maarten of, met betrekking tot de BES, Nederland;

      b. *BES:* De openbare lichamen Bonaire, Sint Eustatius en Saba.

      c. *overnemende land:* het land dat ingevolge [artikel 2][ref1] of [4][ref2] de met een bepaalde aanspraak op een
      uitkering of verzekering corresponderende verplichting overneemt.

      d. *tijdstip van transitie:* het tijdstip waarop
      __REF000___________________________________________________________________________________________________________
      ____ in werking treedt;

      e. *actieve deelnemer:* degene die onmiddellijk voorafgaand aan het tijdstip van transitie overheidsdienaar is in
      de zin van de Pensioenlandsverordening overheidsdienaren (P.B. 1997, no. 312).

      f. *gepensioneerde:* degene die onmiddellijk voorafgaand aan het tijdstip van transitie gepensioneerd
      overheidsdienaar is in de zin van de Pensioenlandsverordening overheidsdienaren (P.B. 1997, no. 312) of de
      nagelaten betrekking van deze ambtenaar.

      g. *gewezen overheidsdienaar:* degene die onmiddellijk voorafgaand aan het tijdstip van transitie gewezen
      overheidsdienaar is in de zin van de Pensioenlandsverordening overheidsdienaren (P.B. 1997, no. 312).

      h. *uitkering:* een uitkering, verstrekking of tegemoetkoming op grond van:

      1°. De pensioenlandsverordening overheidsdienaren ( P.B. 1997, no. 312)

      2°. De Duurtetoeslagregeling pensioengerechtigden 1943 (P.B. 1943 no. 77)

      3°. De landsverordening verhoging leeftijdsgrens ambtenaren (P.B. 1959 no. 126) in samenhang met artikel VII van de
      Invoeringslandsverordening rechtspositionele regelingen 1998 (P.B. 1997, no. 313);

      4°. De landsverordening verhoging leeftijdsgrens 1996 (P.B. 1995 no 230)

      5° De landsverordening Pensioenregeling politieke gezagsdragers (P.B. 2006, no 31) ;

      6° De regeling uitkering bij wijze van pensioen. (P.B. 1959, no 126)

      7° De werkliedenverordening 1944 (P.B. 1978 no 376)

      i. *vermogen van het Algemeen Pensioenfonds van de Nederlandse Antillen:* het blijkens de eindbalans uit de op te
      stellen gecontroleerde jaarrekening, per tijdstip onmiddellijk voorafgaand aan het tijdstip van transitie, totale
      vermogen van het Algemeen Pensioenfonds van de Nederlandse Antillen.

      j. *Premiereserves = voorziening pensioenverplichting (netto vpv):* de contante waarde van de opgebouwde
      pensioenrechten op basis van reeds verstreken dienstjaren tot aan het tijdstip van transitie. Voorst is in de
      waardering opgenomen de contante waarde van de toekomstige uitbetalings- en beheerskosten. Bij de berekening van de
      contante waarde is een rekenrente gehanteerd van 4% en GBM/V 2000–2005 -1-2. De overige actuariële grondslagen en
      veronderstellingen zijn gelijk de wetenschappelijke balans 2008

      k. *Werklieden:* deelgenoten in het Werkliedenpensioenfonds die een uitkering of een opgebouwd recht hebben op
      basis van de Werkliedenverodening 1944 (P.B. 1978 no 376)

      l. Indien een land de bevoegdheid ter zake van de uitvoering van een uitkering dan wel een hiermee naar aard
      en strekking overeenkomende voorziening, rechtstreeks opdraagt aan een daartoe aangewezen rechtspersoonlijkheid
      bezittende uitvoeringsorganisatie, kan die uitvoeringsorganisatie voor de toepassing van deze regeling in de plaats
      van dat land treden.


