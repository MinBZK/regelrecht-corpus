        paragraaf: '4'
  - number: '14'
    text: |-
      De vereffeningcommissie is onder de verantwoordelijkheid van de landen belast met de aangelegenheden die verband
      houden met de definitieve afwikkeling en beëindiging van zaken na de splitsing van de Algemeen Pensioenfonds van de
      Nederlandse Antillen respectievelijk het Werkliedenpensioenfonds, tenzij anders wordt bepaald.
    url: https://wetten.overheid.nl/BWBR0028963/2010-10-02#Artikel14
  - number: '15'
    text: |-
      Met het oog op een goede uitvoering van of ter uitwerking van het bepaalde in deze regeling kunnen tussen de
      besturen van de uitvoeringsorganisaties dan wel pensioenfondsen nadere afspraken worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0028963/2010-10-02#Artikel15
  - number: '16'
    text: |-
      1 De partijen verplichten zich hetgeen in deze onderlinge regeling is bepaald, in het nationale recht waar nodig
      van een voldoende juridische basis te voorzien In ieder geval verplichten zij zich om de garantie van de vóór de
      datum van transitie opgebouwde pensioenaanspraken een wettelijke basis te geven.
    url: https://wetten.overheid.nl/BWBR0028963/2010-10-02#Artikel16
  - number: '17'
    text: |-
      1 Deze overeenkomst treedt in werking met ingang van de dag na dagtekening van de Staatscourant waarin deze wordt
      geplaatst. De overeenkomst wordt geplaatst in de Nederlandse Staatscourant en de Curaçaosche Courant.

      2 Deze overeenkomst kan worden aangehaald als ‘Onderlinge regeling opvolging en boedelscheiding Algemeen
      Pensioenfonds Nederlandse Antillen en opvolging van enkele andere aanverwante regelingen’.
