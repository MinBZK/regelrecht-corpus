  - number: '12'
    text: |-
      Op uitvoerend niveau wordt namens de partijen in gericht overleg voorzien met het oog op een adequate uitvoering
      van deze regeling. Na het tijdstip van de transitie wordt dit overleg op een wijze gericht op een adequate
      uitvoering van deze regeling door of vanwege de partijen voortgezet totdat de boedelverdeling zijn beslag heeft
      gekregen. Hiertoe wordt onder de verantwoordelijkheid van de vereffeningcommissie een stuurgroep ingericht
      die maandelijks overleg pleegt over de voortgang, die actiepunten kan benoemen en die rapporteert aan de
      vereffeningscommissie. Naast twee leden per land, neemt hier ook het Algemeen Pensioenfonds van de Nederlandse
      Antillen, dan wel de op grond van [artikel 1 lid 2][ref1] opgedragen uitvoeringsorganisatie van het land Curaçao
      aan deel.


      [ref1]: https://wetten.overheid.nl/BWBR0028963#Artikel1
