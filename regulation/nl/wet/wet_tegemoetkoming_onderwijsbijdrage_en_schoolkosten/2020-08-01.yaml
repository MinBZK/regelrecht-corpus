  - number: 5.11.1
    text: |-
      Onze Minister kent een tegemoetkoming toe aan de leerling die daartoe een aanvraag heeft ingediend en die voldoet
      aan de voorschriften gegeven bij of krachtens deze wet.
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel5.11
  - number: 5.11.2
    text: Een aanvraag om tegemoetkoming wordt jaarlijks voor het einde van het desbetreffende schooljaar gedaan.
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel5.11
  - number: 5.11.3
    text: 'Onze Minister besluit op een aanvraag om tegemoetkoming indien de aanvraag is ingediend:'
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel5.11
  - number: 5.11.3.a
    text: 'voor de aanvang van het desbetreffende schooljaar: binnen 8 weken na de aanvang van dat schooljaar, en'
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel5.11
  - number: 5.11.3.b
    text: 'gedurende het desbetreffende schooljaar: binnen 8 weken na de indiening van de aanvraag.'
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel5.11
  - number: '5.12'
    text: Tegemoetkoming wordt toegekend per schooljaar.
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel5.12
  - number: 6.1.1
    text: |-
      Ontvangst van een lening of omzetting in een lening als bedoeld in de artikelen 4.11, 4.12 en 4.13, of omzetting
      als bedoeld in artikel 6.2, verplicht degene die tegemoetkoming in de zin van hoofdstuk 4 heeft ontvangen tot
      terugbetaling van de lening vermeerderd met de volgens dit hoofdstuk berekende rente.
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel6.1
  - number: 6.2.1
    text: |-
      De schuld van een leerling in de zin van [hoofdstuk 4][ref1] van wie het recht op tegemoetkoming eindigt zonder dat
      over de maand volgend op de beëindiging reguliere studiefinanciering wordt verstrekt, wordt van rechtswege omgezet
      in lening. De in de vorige volzin bedoelde lening wordt rentedragend met ingang van het tijdstip van die omzetting.


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0012438
        hoofdstuk: '4'
  - number: 6.2.2
    text: |-
      De schuld, niet zijnde een schuld waarop [artikel 6.3][ref1] van toepassing is, van een leerling in de
      zin van [hoofdstuk 4][ref2] van wie het recht op tegemoetkoming eindigt en aan wie over de maand volgend
      op de beëindiging reguliere studiefinanciering wordt verstrekt, wordt aangemerkt als een schuld waarop
      [artikel 7.4 van die wet][ref3] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0012438#Hoofdstuk4
      [ref3]: https://wetten.overheid.nl/BWBR0011453#Artikel7
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0012438
        artikel: '6'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0012438
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0011453
        artikel: '7'
  - number: '6.3'
    text: |-
      De [artikelen 6.3 tot en met 6.16 WSF 2000][ref1] zijn van overeenkomstige toepassing op de bedragen aan lening die
      op grond van deze wet zijn opgebouwd waarbij de lening wordt aangemerkt als een lening beroepsonderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel6
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel6.3
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '6'
  - number: 7.1.1
    text: 'Onze Minister kan een beschikking herzien waarbij:'
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel7.1
  - number: 7.1.1.a
    text: tegemoetkoming is toegekend,
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel7.1
  - number: 7.1.1.b
    text: |-
      de hoogte van het toetsingsinkomen van de aanvrager of diens partner of van de TOS-ouder of diens partner wordt
      vastgesteld of gewijzigd, of
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel7.1
  - number: 7.1.1.c
    text: |-
      tegemoetkoming ingevolge [artikel 2.22b][ref1] is geweigerd of stopgezet.


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Artikel2
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel7.1
    references:
      - id: ref1
        bwb_id: BWBR0012438
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.6'
  - number: 7.1.2
    text: 'Herziening vindt plaats op grond van het feit dat:'
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel7.1
  - number: 7.1.2.a
    text: |-
      een beschikking genomen is waarvan de aanvrager of de TOS-ouder wist of redelijkerwijs had kunnen weten dat deze
      onjuist was,
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel7.1
  - number: 7.1.2.b
    text: |-
      de situatie, bedoeld in de [artikelen 5.9][ref1] of [5.10][ref2] zich voordoet,


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0012438#Artikel5
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel7.1
    references:
      - id: ref1
        bwb_id: BWBR0012438
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: 5.2.2
        afdeling: '5.2'
      - id: ref2
        bwb_id: BWBR0012438
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: 5.2.2
        afdeling: '5.2'
  - number: 7.1.2.c
    text: te veel of te weinig tegemoetkoming is toegekend op basis van onjuiste of onjuist verwerkte gegevens,
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel7.1
  - number: 7.1.2.d
    text: |-
      de hoogte van het inkomen van de aanvrager of diens partner of van de TOS-ouder of diens partner te hoog of te laag
      is vastgesteld op basis van onjuiste of onjuist verwerkte gegevens anders dan bedoeld onder a,
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel7.1
  - number: 7.1.2.e
    text: aanvrager of TOS-ouder heeft gehandeld in strijd met het bepaalde bij of krachtens deze wet,
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel7.1
  - number: 7.1.2.f
    text: |-
