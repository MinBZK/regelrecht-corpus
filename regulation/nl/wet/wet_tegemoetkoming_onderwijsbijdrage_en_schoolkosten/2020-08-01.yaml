        paragraaf: '2.5'
  - number: '9.5'
    text: |-
      Organen met een publiekrechtelijke taak zijn verplicht op een bij algemene maatregel van bestuur aan te geven wijze
      kosteloos inlichtingen te verstrekken, benodigd voor de uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel9.5
  - number: 9.5a.1
    text: |-
      Onze Minister verwerkt de persoonsgegevens die hij ontvangt of bezit ten behoeve van de toepassing van
      [artikel 2.22b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Artikel2
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel9.5a
    references:
      - id: ref1
        bwb_id: BWBR0012438
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.6'
  - number: 9.5a.2
    text: |-
      Bij de verwerking van gegevens op grond van het eerste lid kunnen bijzondere categorieën van persoonsgegevens
      en persoonsgegevens van strafrechtelijke aard als bedoeld in [paragraaf 3.1][ref1] onderscheidenlijk
      [paragraaf 3.2 van de Uitvoeringswet Algemene verordening gegevensbescherming][ref2] worden verwerkt, voor zover
      deze gegevens noodzakelijk zijn voor de toepassing van [artikel 2.22b][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.1
      [ref2]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.2
      [ref3]: https://wetten.overheid.nl/BWBR0012438#Artikel2
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel9.5a
    references:
      - id: ref1
        bwb_id: BWBR0040940
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0040940
        paragraaf: '3.2'
      - id: ref3
        bwb_id: BWBR0012438
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.6'
  - number: 9.5a.3
    text: |-
      Ten behoeve van de toepassing van [artikel 2.22b][ref1] verstrekt Onze Minister uitsluitend het gegeven of een
      persoon een tegemoetkoming heeft aangevraagd dan wel reeds ontvangt.


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Artikel2
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel9.5a
    references:
      - id: ref1
        bwb_id: BWBR0012438
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.6'
  - number: 9.5a.4
    text: |-
      [Artikel 1.7][ref1] is voor de gegevensverwerking, bedoeld in dit artikel, van overeenkomstige toepassing voor een
      persoon die een tegemoetkoming heeft aangevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Artikel1
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel9.5a
    references:
      - id: ref1
        bwb_id: BWBR0012438
        artikel: '1'
        hoofdstuk: '1'
  - number: 9.5a.5
    text: |-
      Bij ministeriële regeling worden regels gesteld ter waarborging van de persoonlijke levenssfeer. Daarbij worden in
      ieder geval regels gesteld over:
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel9.5a
  - number: 9.5a.5.a
    text: op welke wijze de gegevensverwerking bedoeld in dit artikel, plaatsvindt;
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel9.5a
  - number: 9.5a.5.b
    text: |-
      op welke wijze door passende technische en organisatorische maatregelen deze gegevens worden beveiligd tegen
      verlies of onrechtmatige verwerking;
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel9.5a
  - number: 9.5a.5.c
    text: |-
      op welke wijze wordt gewaarborgd dat de verwerkte persoonsgegevens slechts worden verwerkt voor het doel waarvoor
      zij zijn verzameld, alsmede hoe daarop wordt toegezien.
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel9.5a
  - number: '9.7'
    text: |-
      Indien een niet volledig en rechtstreeks uit de openbare kas bekostigde school als bedoeld in de
      [artikel 2.9, onderdelen b, c en d][ref1], op enig moment in een schooljaar niet een administratie als bedoeld in
      [artikel 4.14, eerste lid][ref2], voert of niet na afloop van de in artikel 4.14 bedoelde periodes van onafgebroken
      afwezigheid zonder geldige reden van een leerling als bedoeld in [hoofdstuk 4][ref3] aan Onze Minister de vereiste
      gegevens verstrekt, ontstaat er een vordering van Onze Minister op de school ter grootte van 15% van het bedrag van
      de tegemoetkomingen, bedoeld in [artikel 4.2][ref4], voorzover die als gift zijn toegekend aan de leerlingen aan
      die school in het schooljaar waarin deze school in gebreke was, is toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0012438#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0012438#Hoofdstuk4
      [ref4]: https://wetten.overheid.nl/BWBR0012438#Artikel4
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel9.7
    references:
