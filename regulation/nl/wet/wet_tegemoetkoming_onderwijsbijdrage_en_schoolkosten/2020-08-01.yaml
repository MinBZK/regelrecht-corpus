        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: '9.8'
    text: |-
      Indien een school als bedoeld in de [artikelen 2.9, onderdelen a tot en met c][ref1], en [2.10][ref2], niet
      uiterlijk 1 mei de gegevens, bedoeld in [artikel 9.4, tweede lid][ref3], heeft verstrekt, ontstaat er een vordering
      van Onze Minister op de school ter grootte van de tegemoetkomingen op grond van de [hoofdstukken 3][ref4] en
      [4][ref5] die ten behoeve van leerlingen aan die opleiding in het schooljaar waarin deze in gebreke was, is
      toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0012438#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0012438#Artikel9
