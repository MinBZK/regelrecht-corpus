      ingevolge [afdeling 5.1][ref2] mede in aanmerking een ho-student die is ingeschreven voor het volgen voor het
      volgen van een bacheloropleiding of masteropleiding voor het beroep van leraar aan een aangewezen instelling als
      bedoeld in de [artikelen 6.9][ref3] of [16.14 WHW][ref4], zoals die artikelen luidden op 31 augustus 2010.


