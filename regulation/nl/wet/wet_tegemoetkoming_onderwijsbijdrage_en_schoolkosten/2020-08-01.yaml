  - number: 7.1.2.j
    text: |-
      andere, nader gebleken feiten of omstandigheden, die, waren zij eerder bekend geweest, tot een andere beschikking
      zouden hebben geleid.
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel7.1
  - number: 7.1.3
    text: |-
      Behoudens in geval van bedrog, kan een herziening als bedoeld in het tweede lid, onderdelen c, e, h en i, slechts
      geschieden binnen 18 maanden na het einde van het desbetreffende tijdvak waar de toekenning van de tegemoetkoming
      betrekking op heeft.
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel7.1
  - number: 7.1.4
    text: |-
      Behoudens in geval van bedrog, kan een herziening als bedoeld in het tweede lid, onderdeel d, slechts geschieden
      binnen 3 jaren na het einde van het desbetreffende tijdvak waar de toekenning van de tegemoetkoming betrekking
      op heeft.
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel7.1
  - number: 7.1.5
    text: |-
      Behoudens in geval van bedrog, kan een herziening als bedoeld in het tweede lid, onderdelen a, b, f en g, slechts
      geschieden binnen 5 jaren na het einde van het desbetreffende tijdvak waar de toekenning van de tegemoetkoming
      betrekking op heeft.
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel7.1
  - number: 7.1a
    text: |-
      Indien een leerling of ho-student op grond van [artikel 2.22b][ref1] geen aanspraak meer heeft op een
      tegemoetkoming wordt de beschikking waarbij de tegemoetkoming is toegekend van rechtswege herzien.


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Artikel2
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel7.1a
    references:
      - id: ref1
        bwb_id: BWBR0012438
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.6'
  - number: '7.2'
    text: |-
      De [artikelen 7:2 tot en met 7:9 van de Algemene wet bestuursrecht][ref1] zijn niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel7.2
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: 7.3.1
    text: |-
      Indien een herzieningsbeschikking als bedoeld in [artikel 7.1, eerste en tweede lid][ref1], of een beslissing
      op bezwaar daartoe aanleiding geeft, wordt het bedrag van de tegemoetkoming dat teveel is uitbetaald, door de
      aanvrager terugbetaald of met hem verrekend.


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Artikel7
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel7.3
    references:
      - id: ref1
        bwb_id: BWBR0012438
        artikel: '7'
        hoofdstuk: '7'
  - number: 7.3.2
    text: |-
      Indien een herzieningsbeschikking als bedoeld in [artikel 7.1, eerste en tweede lid][ref1], of een beslissing
      op bezwaar daartoe aanleiding geeft, wordt voor zover het bedrag waarvoor het recht om een lening af te sluiten
      te hoog is toegekend, het deel dat te hoog is toegekend en uitbetaald door de betrokkene terugbetaald of met hem
      verrekend.


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Artikel7
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel7.3
    references:
      - id: ref1
        bwb_id: BWBR0012438
        artikel: '7'
        hoofdstuk: '7'
  - number: 7.3.3
    text: |-
      Indien na een voorlopige voorziening als bedoeld in [titel 8.3 van de Algemene wet bestuursrecht][ref1], de
      beslissing in hoofdzaak daartoe aanleiding geeft, wordt het bedrag dat op grond van de voorlopige voorziening
      teveel is uitbetaald, door de betrokkene terugbetaald of met hem verrekend.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel7.3
    references:
      - id: ref1
        bwb_id: BWBR0005537
  - number: 7.3.4
    text: |-
      De in het eerste tot en met derde lid bedoelde terugbetaling en verrekening geschieden overeenkomstig bij
      ministeriële regeling vast te stellen redelijke terugbetalingsregels.
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel7.3
  - number: 7.3.5
    text: |-
      [Artikel 4:93, vierde lid, van de Algemene wet bestuursrecht][ref1] is niet van toepassing op deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel7.3
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 8.1.1
    text: |-
      Met betrekking tot de uitbetaling van de tegemoetkoming en de verrekening van het toegekende bedrag aan
      tegemoetkoming met de aan Onze Minister verschuldigde onderwijsbijdrage, worden bij ministeriële regeling regels
      gesteld.
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel8.1
  - number: 8.1.2
    text: |-
      Indien een toegekend bedrag aan tegemoetkoming 12 maanden na het einde van het kalenderjaar waarin de
      desbetreffende beschikking is gegeven, niet kan worden uitbetaald als gevolg van nalatigheid van degene aan wie die
      beschikking is gericht, verrekent Onze Minister het toegekende bedrag aan tegemoetkoming met het niet uitbetaalde
      bedrag.
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel8.1
  - number: 8.1.3
    text: |-
      Indien een leerling in de loop van een schooljaar ophoudt leerling te zijn in de zin van hoofdstuk 4 en hij niet in
      de loop van datzelfde schooljaar leerling wordt aan een school waarvoor lesgeld verschuldigd is, wordt het restant
      van de in het eerste lid bedoelde tegemoetkoming in de onderwijsbijdrage niet teruggevorderd of verrekend.
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel8.1
  - number: '8.2'
    text: |-
      Onze Minister vaardigt een dwangbevel uit aan de nalatige, indien een bij of krachtens deze wet verschuldigd bedrag
      geheel of gedeeltelijk niet tijdig is voldaan.
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel8.2
  - number: '9.1'
    text: |-
      Het toezicht door de inspectie, bedoeld in de [Wet op het onderwijstoezicht][ref1], heeft mede betrekking op de
      vraag of de school of de opleiding voldoet aan de van toepassing zijnde voorwaarden, bedoeld in de artikelen 2.17,
      2.18 en 4.14, derde tot en met zesde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0013800
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel9.1
    references:
      - id: ref1
        bwb_id: BWBR0013800
  - number: 9.2.1
    text: |-
      Een ieder is verplicht aan Onze Minister of aan een daartoe door of vanwege Onze Minister aangewezen persoon of
      instantie desgevraagd de ten behoeve van de uitvoering van deze wet benodigde inlichtingen over zichzelf te geven.
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel9.2
  - number: 9.2.2
    text: |-
      De inlichtingen worden verstrekt binnen een door Onze Minister of door een in het eerste lid bedoelde persoon of
      instantie te stellen redelijke termijn.
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel9.2
  - number: 9.2.3
    text: |-
      Inlichtingen over zichzelf, voorzover zij kunnen leiden tot de toekenning van minder tegemoetkoming worden steeds
      ongevraagd en schriftelijk verstrekt door de aanvrager, onmiddellijk na het bekend worden van die gegevens.
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel9.2
  - number: 9.2.4
    text: |-
      Onze Minister kan bepalen dat de inlichtingen, bedoeld in het eerste tot en met het derde lid, worden verstrekt op
      een bij ministeriële regeling vast te stellen wijze.
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel9.2
  - number: '9.3'
    text: |-
      Een studentendecaan aan een op grond van de [WHW][ref1] uit 's Rijks kas bekostigde instelling voor hoger onderwijs
      kan zich, in afwijking van [artikel 5:17 van de Algemene wet bestuursrecht][ref2] bij de verplichting tot inzage
      van gegevens en bescheiden en het verstrekken van inlichtingen, verschonen betreffende hetgeen een leerling of ho-
      student aan hem heeft toevertrouwd.


      [ref1]: https://wetten.overheid.nl/BWBR0005682
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel9.3
    references:
      - id: ref1
        bwb_id: BWBR0005682
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 9.4.1
    text: |-
      De natuurlijke persoon van wie of het bestuur van de rechtspersoon waarvan een school uitgaat die onderwijs
      aanbiedt als bedoeld in de [paragrafen 2.3][ref1] en [2.4][ref2], is verplicht op een bij ministeriële regeling aan
      te geven wijze kosteloos inlichtingen te verstrekken, benodigd voor de uitvoering van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0012438#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel9.4
    references:
      - id: ref1
        bwb_id: BWBR0012438
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref2
        bwb_id: BWBR0012438
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: 9.4.2
    text: |-
      De natuurlijke persoon van wie of het bestuur van de rechtspersoon waarvan een school uitgaat die onderwijs
      aanbiedt als bedoeld in de [artikelen 2.9, onderdelen a tot en met d][ref1], en [2.10][ref2], is verplicht voor
      1 mei aan Onze Minister te melden indien onderwijs dat in dat schooljaar voldeed aan de voorwaarden, genoemd in
      [artikel 2.18][ref3], in het daaropvolgende schooljaar niet aan deze voorwaarde zal voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0012438#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0012438#Artikel2
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel9.4
    references:
