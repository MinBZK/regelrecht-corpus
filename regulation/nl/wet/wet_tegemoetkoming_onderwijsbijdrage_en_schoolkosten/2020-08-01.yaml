  - number: 2.2.1
    text: 'Op tegemoetkoming kan aanspraak bestaan indien de aanvrager:'
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel2.2
  - number: 2.2.1.a
    text: de Nederlandse nationaliteit bezit,
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel2.2
  - number: 2.2.1.b
    text: |-
      niet de Nederlandse nationaliteit bezit maar wel ingevolge een verdrag of een besluit van een volkenrechtelijke
      organisatie op het terrein van de tegemoetkoming met een Nederlander wordt gelijkgesteld, of
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel2.2
  - number: 2.2.1.c
    text: |-
      niet de Nederlandse nationaliteit bezit maar wel behoort tot een bij algemene maatregel van bestuur aangewezen
      groep van personen die op het terrein van de tegemoetkoming met Nederlanders worden gelijkgesteld.
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel2.2
  - number: 2.2.2
    text: |-
      Voor de toepassing van de [hoofdstukken 4][ref1] en [5][ref2] geldt in aanvulling op het eerste lid, onderdeel c,
      dat de aanvrager in Nederland woont, tenzij deze voorwaarde niet mag worden gesteld op grond van een verdrag of een
      besluit van een volkenrechtelijke organisatie. Bij of krachtens algemene maatregel van bestuur kunnen regels worden
      gesteld in verband met een goede uitvoering van dit lid.


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0012438#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0012438
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0012438
        hoofdstuk: '5'
  - number: 2.2.3
    text: |-
      Onverminderd het eerste lid, onderdeel b, kunnen bij algemene maatregel van bestuur groepen van personen worden
      aangewezen voor wie de gelijkstelling, bedoeld in het eerste lid, onderdeel b, slechts een tegemoetkoming in de
      kosten van de toegang tot het onderwijs betreft. Bij algemene maatregel van bestuur kunnen regels worden gesteld
      met betrekking tot de hoogte en de vorm van deze tegemoetkoming.
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel2.2
  - number: 2.2.4
    text: Bij algemene maatregel van bestuur kan ten gunste van de ho-student worden afgeweken van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel2.2
  - number: 2.3.1
    text: |-
      Op tegemoetkoming ingevolge [hoofdstuk 4][ref1] kan aanspraak bestaan met ingang van de eerste dag van het kwartaal
      volgend op het kwartaal waarin de leerling de leeftijd van 18 jaren heeft bereikt tot en met de maand waarin hij de
      leeftijd van 30 jaren heeft bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0012438
        hoofdstuk: '4'
  - number: 2.3.2
    text: |-
      Op tegemoetkoming ingevolge [afdeling 5.1][ref1] bestaat aanspraak ongeacht de leeftijd.


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0012438
        hoofdstuk: '5'
        afdeling: '5.1'
  - number: 2.3.3
    text: |-
      Op tegemoetkoming ingevolge [afdeling 5.2][ref1] kan aanspraak bestaan met ingang van de eerste dag van het
      kwartaal volgend op het kwartaal waarin de leerling de leeftijd van 18 jaren heeft bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0012438
        hoofdstuk: '5'
        afdeling: '5.2'
  - number: '2.9'
    text: |-
      Voor tegemoetkoming ingevolge [hoofdstuk 4][ref1] kan een scholier in aanmerking komen die is ingeschreven:


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0012438
        hoofdstuk: '4'
  - number: 2.9.a
    text: |-
      aan een school die op grond van de [WVO][ref1], de [WEC][ref2] of de [Experimentenwet onderwijs][ref3]
      volledig en rechtstreeks uit de openbare kas wordt bekostigd, waaronder het volgen van onderwijs in de vorm van
      contractactiviteiten niet is mede begrepen;


      [ref1]: https://wetten.overheid.nl/BWBR0002399
      [ref2]: https://wetten.overheid.nl/BWBR0003549
      [ref3]: https://wetten.overheid.nl/BWBR0002718
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0002399
      - id: ref2
        bwb_id: BWBR0003549
      - id: ref3
        bwb_id: BWBR0002718
  - number: 2.9.b
    text: |-
      aan een op grond van [artikel 56 WVO][ref1] aangewezen school;


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel56
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '56'
  - number: 2.9.c
    text: |-
      aan een school die is erkend op grond van de [Wet op de erkende onderwijsinstellingen][ref1] voor zover de gevolgde
      cursus onder de reikwijdte van die wet valt; of


      [ref1]: https://wetten.overheid.nl/BWBR0003821
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0003821
  - number: 2.9.d
    text: |-
      voor een cursus die wordt bekostigd op grond van [artikel 73 WVO][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel73
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '73'
  - number: '2.10'
    text: |-
      Voor tegemoetkoming ingevolge [hoofdstuk 4][ref1] kan een vavo-student in aanmerking komen die is ingeschreven aan
      een school als bedoeld in [artikel 1.1.1, onderdeel b][ref2], en [artikel 1.4a.1 WEB][ref3], voorzover het betreft
      een opleiding vavo.


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel2.10
    references:
      - id: ref1
        bwb_id: BWBR0012438
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '1'
  - number: 2.11.1
    text: |-
      Voor tegemoetkoming ingevolge [afdeling 5.1][ref1] kan een ho-student in aanmerking komen die is ingeschreven voor
      het volgen van een bacheloropleiding of masteropleiding voor het beroep van leraar bij een bekostigde universiteit
      of hogeschool, genoemd in de [bijlage van de WHW](onbekend), dan wel bij een rechtspersoon voor hoger onderwijs als
      bedoeld in [artikel 1.1, onderdeel aa, WHW][ref2], voor zover aan die opleiding accreditatie als bedoeld in artikel
      1.1, onderdeel q, WHW is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel2.11
    references:
      - id: ref1
        bwb_id: BWBR0012438
        hoofdstuk: '5'
        afdeling: '5.1'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '1'
  - number: 2.11.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing gedurende de termijn, bedoeld in de
      [artikelen 5.21, tweede en zesde lid][ref1], 5.33 en [6.5, tweede lid, WHW][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel6
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel2.11
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '6'
  - number: '2.12'
    text: |-
      Voor tegemoetkoming ingevolge [afdeling 5.1][ref1] kan een ho-student in aanmerking komen indien hij als leraar
      is benoemd of tewerkgesteld zonder benoeming vanwege het bezit van een geschiktheidsverklaring als bedoeld in
      [artikel 176b van de Wet op het primair onderwijs][ref2], [artikel 162e WEC][ref3], [artikel 118k WVO][ref4], of
      [artikel 4.2.4, WEB][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel176b
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel162e
      [ref4]: https://wetten.overheid.nl/BWBR0002399#Artikel118k
      [ref5]: https://wetten.overheid.nl/BWBR0007625#Artikel4
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel2.12
    references:
      - id: ref1
        bwb_id: BWBR0012438
        hoofdstuk: '5'
        afdeling: '5.1'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: 176b
      - id: ref3
        bwb_id: BWBR0003549
        artikel: 162e
      - id: ref4
        bwb_id: BWBR0002399
        artikel: 118k
      - id: ref5
        bwb_id: BWBR0007625
        artikel: '4'
  - number: '2.13'
    text: |-
      Voor tegemoetkoming ingevolge [afdeling 5.2][ref1] kan een leerling in aanmerking komen indien hij is ingeschreven
      voor:


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel2.13
    references:
      - id: ref1
        bwb_id: BWBR0012438
        hoofdstuk: '5'
        afdeling: '5.2'
  - number: 2.13.a
    text: |-
      een opleiding of een gedeelte daarvan aan een school als bedoeld in [artikel 1.1.1, onderdeel b][ref1], en
      [artikel 1.4a.1 WEB][ref2], voor zover het betreft een opleiding vavo,


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel2.13
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '1'
  - number: 2.13.b
    text: |-
      een opleiding of een gedeelte daarvan aan een school als bedoeld in [artikel 2.9, onderdelen a tot en met c][ref1],
      of


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Artikel2
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel2.13
    references:
      - id: ref1
        bwb_id: BWBR0012438
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 2.13.c
    text: |-
      een cursus als bedoeld in [artikel 2.9, onderdeel d][ref1], met dien verstande dat deze opleidingen of een gedeelte
      daarvan of die cursus die leiden tot het diploma:


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Artikel2
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel2.13
    references:
      - id: ref1
        bwb_id: BWBR0012438
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 2.13.c.1°
    text: voorbereidend wetenschappelijk onderwijs,
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel2.13
  - number: 2.13.c.2°
    text: hoger algemeen voortgezet onderwijs, of
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel2.13
  - number: 2.13.c.3°
    text: voortgezet middelbaar beroepsonderwijs voor zover het betreft de theoretische leerweg.
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel2.13
  - number: '2.14'
    text: |-
      Geen aanspraak op tegemoetkoming bestaat indien de leerling of ho-student is ingeschreven aan een opleiding waarvan
      de duur, daaronder begrepen ten hoogste 12 vakantieweken, korter is dan 1 jaar.
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel2.14
  - number: '2.15'
    text: |-
      De aanspraak op tegemoetkoming van een leerling die gedurende een aaneengesloten periode van 8 weken niet aan het
      onderwijs heeft deelgenomen, vervalt met ingang van de eerste dag van de maand volgend op die waarin de school
      de afwezigheid, bedoeld in [artikel 4.12][ref1] aan Onze Minister heeft medegedeeld. De periode van 8 weken wordt
      verlengd met de weken waarin vanwege vakantie geen onderwijs werd verzorgd.


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Artikel4
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel2.15
    references:
      - id: ref1
        bwb_id: BWBR0012438
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.4'
  - number: '2.16'
    text: |-
      Een ho-student heeft geen aanspraak op tegemoetkoming indien hij gedurende 24 maanden een tegemoetkoming in de zin
      van [afdeling 5.1][ref1] heeft ontvangen of indien 48 maanden zijn verlopen gerekend vanaf de maand waarover de
      tegemoetkoming voor het eerst is toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel2.16
    references:
      - id: ref1
        bwb_id: BWBR0012438
        hoofdstuk: '5'
        afdeling: '5.1'
  - number: '2.17'
    text: |-
      Een leerling die onderwijs volgt als bedoeld in de [artikelen 2.9, onderdelen b en c][ref1], of [2.10][ref2]
      heeft slechts aanspraak op tegemoetkoming indien de opleiding een studielast heeft van ten minste 850 klokuren per
      schooljaar die worden besteed aan het volgen van lessen of stages.


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0012438#Artikel2
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel2.17
    references:
      - id: ref1
        bwb_id: BWBR0012438
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref2
        bwb_id: BWBR0012438
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 2.19.1
    text: |-
      De aanspraak op tegemoetkoming ingevolge [hoofdstuk 4][ref1] vervalt met ingang van de maand die volgt op de dag
      waarop de leerling het laatste schooljaar met goed gevolg heeft afgesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel2.19
    references:
      - id: ref1
        bwb_id: BWBR0012438
        hoofdstuk: '4'
  - number: 2.19.2
    text: |-
      Indien de leerling aansluitend aan het schooljaar dat als laatste schooljaar was aangemerkt, opnieuw dat laatste
      schooljaar aanvangt, ontstaat aanspraak op tegemoetkoming voor het resterende gedeelte van het kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel2.19
  - number: 2.19.3
    text: |-
      Indien de leerling na zijn uitschrijving voor een opleiding binnen 4 maanden opnieuw een opleiding in de zin
      van deze wet of van de [WSF 2000][ref1] aanvangt, blijft, in afwijking van het eerste lid, op zijn aanvraag
      de aanspraak op tegemoetkoming in de tussen beide opleidingen liggende periode voor ten hoogste 4 maanden
      bestaan. Indien dit de maanden augustus, september, oktober of november betreft, heeft de leerling die op
      grond van [hoofdstuk 4][ref2] nog geen tegemoetkoming in de onderwijsbijdrage is toegekend en een opleiding
      als bedoeld in [artikel 2.9, onderdelen b tot en met d][ref3], of [2.10][ref4], of een opleiding waarvoor
      aanspraak op studiefinanciering bestaat, gaat volgen, over die maanden naast een tegemoetkoming in de zin van
      [hoofdstuk 4][ref5] ook aanspraak op een bedrag aan tegemoetkoming in de onderwijsbijdrage, ter grootte van
      eentwaalfde van het bedrag, bedoeld in [artikel 5, tweede lid, van de Les- en cursusgeldwet][ref6], per maand.
      Voor de vaststelling van de hoogte van de tegemoetkoming in die maanden wordt uitgegaan van de draagkracht, zoals
      die gold op 31 juli van het voorafgaande schooljaar. In afwijking van [artikel 4.10, tweede lid][ref7], wordt die
      aanvraag ingediend voor het einde van de periode van 4 maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0011453
      [ref2]: https://wetten.overheid.nl/BWBR0012438#Hoofdstuk4
      [ref3]: https://wetten.overheid.nl/BWBR0012438#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0012438#Artikel2
      [ref5]: https://wetten.overheid.nl/BWBR0012438#Hoofdstuk4
      [ref6]: https://wetten.overheid.nl/BWBR0004188#Artikel5
      [ref7]: https://wetten.overheid.nl/BWBR0012438#Artikel4
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel2.19
    references:
      - id: ref1
        bwb_id: BWBR0011453
      - id: ref2
        bwb_id: BWBR0012438
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0012438
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref4
        bwb_id: BWBR0012438
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref5
        bwb_id: BWBR0012438
        hoofdstuk: '4'
      - id: ref6
        bwb_id: BWBR0004188
        artikel: '5'
      - id: ref7
        bwb_id: BWBR0012438
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 2.19.4
    text: |-
      Het derde lid is niet van toepassing op personen die op grond van [artikel 2.12, onder b, c of d, WSF 2000][ref1]
      het levenlanglerenkrediet, bedoeld in de [WSF 2000][ref2], ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011453
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel2.19
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0011453
  - number: 2.21.1
    text: |-
      De scholier, bedoeld in [hoofdstuk 4][ref1], die tevens aanspraak heeft op reguliere studiefinanciering, heeft geen
      aanspraak op tegemoetkoming.


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel2.21
    references:
      - id: ref1
        bwb_id: BWBR0012438
        hoofdstuk: '4'
  - number: 2.21.2
    text: |-
      De vavo-student, bedoeld in [hoofdstuk 4][ref1], voor wie onderwijsbijdrage is verschuldigd en die tevens aanspraak
      heeft op reguliere studiefinanciering, heeft geen aanspraak op tegemoetkoming.


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel2.21
    references:
      - id: ref1
        bwb_id: BWBR0012438
        hoofdstuk: '4'
  - number: '2.22'
    text: |-
      De leerling heeft geen aanspraak op tegemoetkoming in de zin van [hoofdstuk 4][ref1], indien hij geen aanspraak
      meer heeft op prestatiebeurs in de zin van [hoofdstuk 5 WSF 2000][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel2.22
    references:
      - id: ref1
        bwb_id: BWBR0012438
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0011453
        hoofdstuk: '5'
  - number: 2.22a.1
    text: |-
      Een scholier of een vavo-student als bedoeld in [hoofdstuk 4][ref1] die voor
      ten minste één maand rechtens zijn vrijheid is ontnomen, heeft, behoudens in de
      gevallen, bedoeld in de [Wet verplichte geestelijke gezondheidszorg][ref2], in de
      [Wet zorg en dwang psychogeriatrische en verstandelijk gehandicapte cliënten][ref3] en in
      [artikel 2.3 van de Wet forensische zorg][ref4] en de gevallen, bedoeld in [hoofdstuk 6 van de Jeugdwet][ref5], met
      ingang van de eerste dag van de maand volgend op de maand waarin de vrijheidsontneming tenminste één maand heeft
      geduurd slechts aanspraak op een basistoelage voor een thuiswonende leerling.


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0040635
      [ref3]: https://wetten.overheid.nl/BWBR0040632
      [ref4]: https://wetten.overheid.nl/BWBR0040634#Artikel2
      [ref5]: https://wetten.overheid.nl/BWBR0034925#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel2.22a
    references:
      - id: ref1
        bwb_id: BWBR0012438
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0040635
      - id: ref3
        bwb_id: BWBR0040632
      - id: ref4
        bwb_id: BWBR0040634
        artikel: '2'
      - id: ref5
        bwb_id: BWBR0034925
        hoofdstuk: '6'
  - number: 2.22a.2
    text: |-
      Voor de toepassing van het eerste lid worden perioden van vrijheidsontneming samengeteld, indien zij elkaar met een
      onderbreking van minder dan vier weken opvolgen.
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel2.22a
  - number: 2.22a.3
    text: |-
      Het eerste en tweede lid zijn niet van toepassing op bij algemene maatregel van bestuur aan te wijzen groepen van
      personen waarbij tenuitvoerlegging van een vrijheidsstraf of vrijheidsbenemende maatregel buiten een justitiële
      inrichting plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel2.22a
  - number: 2.22b.1
    text: Een leerling of ho-student heeft geen aanspraak op tegemoetkoming indien hij een uitreiziger is.
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel2.22b
  - number: 2.22b.2
    text: |-
      Onze Minister kan besluiten dat een leerling of ho-student een uitreiziger is indien het betreft een persoon
      ten aanzien van wie uit een melding van de door de daartoe bevoegde opsporingsdiensten of inlichtingen- en
      veiligheidsdiensten, gericht aan Onze Minister, is gebleken dat het gegronde vermoeden bestaat dat de leerling
      of ho-student zich buiten het land Nederland bevindt met het doel zich aan te sluiten bij een organisatie die
      door Onze Minister van Veiligheid en Justitie, in overeenstemming met het gevoelen van de Rijksministerraad, is
      geplaatst op een lijst van organisaties die deelnemen aan een nationaal of internationaal gewapend conflict en een
      bedreiging vormen voor de nationale veiligheid.
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel2.22b
  - number: 2.22b.3
    text: |-
      In het besluit van Onze Minister dat een leerling of ho-student een uitreiziger is, wordt vermeld vanaf welk moment
      een leerling of ho-student als uitreiziger is aangemerkt.
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel2.22b
  - number: 2.23.1
    text: |-
      De tegemoetkoming in de onderwijsbijdrage en in de schoolkosten is afhankelijk van de hoogte van de op grond van
      [artikel 7, eerste lid, AWIR][ref1] berekende draagkracht.


      [ref1]: https://wetten.overheid.nl/BWBR0018472#Artikel7
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel2.23
    references:
      - id: ref1
        bwb_id: BWBR0018472
        artikel: '7'
  - number: 2.23.2
    text: |-
      Volledige tegemoetkoming ingevolge de [hoofdstukken 4][ref1] en [5][ref2] bestaat tot en met het grensbedrag van
      de draagkracht. Naar de maatstaf van het schooljaar of studiejaar 2012–2013 bedraagt het grensbedrag € 32 142,16 .


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0012438#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel2.23
    references:
      - id: ref1
        bwb_id: BWBR0012438
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0012438
        hoofdstuk: '5'
  - number: 2.23.3
    text: Indien het toe te kennen bedrag per aanvrager minder bedraagt dan € 10,–, wordt de tegemoetkoming op nihil gesteld.
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel2.23
  - number: 2.25.1
    text: |-
      De tegemoetkoming wordt verminderd met een ingevolge het derde lid en [artikel 2.27][ref1] berekende korting wegens
      overschrijding van het grensbedrag, bedoeld in [artikel 2.23, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0012438#Artikel2
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel2.25
    references:
      - id: ref1
        bwb_id: BWBR0012438
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.7'
      - id: ref2
        bwb_id: BWBR0012438
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.7'
  - number: 2.25.2
    text: |-
      De korting wordt niet toegepast op de basistoelage, bedoeld in [artikel 4.2, onderdeel a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Artikel4
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel2.25
    references:
      - id: ref1
        bwb_id: BWBR0012438
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 2.25.3
    text: |-
      De korting is 30% van het verschil tussen de draagkracht in het peiljaar en het grensbedrag, bedoeld in
      [artikel 2.23][ref1], tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Artikel2
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel2.25
    references:
      - id: ref1
        bwb_id: BWBR0012438
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.7'
  - number: 2.25.4
    text: Het kortingsbedrag voor een kalendermaand is de korting, bedoeld in het derde lid, gedeeld door 12.
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel2.25
  - number: 2.26.1
    text: |-
      In geval van korting op de tegemoetkoming is de verhouding tussen de gekorte tegemoetkoming in de onderwijsbijdrage
      en die in de schoolkosten overeenkomstig de verhouding tussen de normbedragen van deze tegemoetkomingen op 1
      augustus van het betreffende schooljaar. Deze verhouding wordt op 2 decimalen afgerond op het naastbij gelegen
      getal.
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel2.26
  - number: 2.26.2
    text: |-
      Indien de toegekende gekorte tegemoetkoming, bedoeld in het eerste lid, niet meer is dan de aan Onze Minister
      verschuldigde onderwijsbijdrage, vindt geen uitbetaling plaats. Onze Minister verrekent deze tegemoetkoming met
      die onderwijsbijdrage.
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel2.26
  - number: '2.27'
    text: |-
      Het kortingsbedrag, bedoeld in [artikel 2.25, derde lid][ref1], wordt verdeeld over het aantal telkinderen. Onder
      telkind wordt verstaan: iedere aanvrager die een TOS-ouder heeft waarbij die TOS-ouder of diens partner tevens de
      TOS-ouder is van een andere leerling die voor het desbetreffende schooljaar aanspraak heeft op tegemoetkoming in de
      zin van [hoofdstuk 4][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0012438#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel2.27
    references:
      - id: ref1
        bwb_id: BWBR0012438
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.7'
      - id: ref2
        bwb_id: BWBR0012438
        hoofdstuk: '4'
  - number: 2.28.1
    text: |-
      Op aanvraag van de aanvrager of diens partner of TOS-ouder of diens partner wordt bij toepassing van
      [artikel 1.8, onderdeel b][ref1], indien sprake is van een terugval in inkomen over het eerste of het tweede jaar
      na het peiljaar, uitgegaan van dat jaar. Deze aanvraag wordt gelijktijdig gedaan met de aanvraag ingevolge de
      [artikelen 5.5][ref2] of [5.11][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0012438#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0012438#Artikel5
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel2.28
    references:
      - id: ref1
        bwb_id: BWBR0012438
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0012438
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: 5.1.3
        afdeling: '5.1'
      - id: ref3
        bwb_id: BWBR0012438
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: 5.2.3
        afdeling: '5.2'
  - number: 2.28.2
    text: |-
      Voor de toepassing van het eerste lid wordt onder een terugval in inkomen verstaan een vermindering van de
      draagkracht met ten minste 15% ten opzichte van het peiljaar, met dien verstande dat:
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel2.28
  - number: 2.28.2.a
    text: |-
      de vermindering niet kan worden gerekend tot inkomensschommelingen die in het algemeen normaal kunnen worden geacht
      bij de gekozen wijze van inkomensverwerving, en
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel2.28
  - number: 2.28.2.b
    text: |-
      aannemelijk wordt gemaakt dat gedurende ten minste 3 kalenderjaren zal worden voldaan aan de vereisten genoemd in
      de aanhef alsmede in onderdeel a.
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel2.28
  - number: '2.29'
    text: |-
      Voor de toepassing van [artikel 1.8, onderdeel b][ref1], en [artikel 2.25][ref2] wordt zolang het toetsingsinkomen
      over het kalenderjaar waarover het toetsingsinkomen berekend wordt, het eerste of het tweede jaar na dat
      kalenderjaar nog niet is bepaald, door Onze Minister daarvoor in de plaats gesteld een bedrag dat het
      desbetreffende toetsingsinkomen zo goed mogelijk benadert.


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0012438#Artikel2
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel2.29
    references:
      - id: ref1
        bwb_id: BWBR0012438
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0012438
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.7'
  - number: '4.1'
    text: |-
      Dit hoofdstuk is van toepassing op scholieren en vavo-studenten die 18 jaren zijn of ouder en zijn ingeschreven aan
      een school als bedoeld in paragraaf 2.3.
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel4.1
  - number: 4.2.1
    text: 'De tegemoetkoming in de zin van dit hoofdstuk bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel4.2
  - number: 4.2.1.a
    text: basistoelage, en
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel4.2
  - number: 4.2.1.b
    text: tegemoetkoming in de schoolkosten.
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel4.2
  - number: 4.2.2
    text: |-
      Voor leerlingen als bedoeld in [artikel 2.9, onderdelen b, c en d][ref1], en voor vavo-studenten als bedoeld in
      [artikel 2.10][ref2] bestaat de tegemoetkoming eveneens uit een tegemoetkoming in de onderwijsbijdrage.


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0012438#Artikel2
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0012438
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref2
        bwb_id: BWBR0012438
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: '4.3'
    text: 'De basistoelage is naar de maatstaf van 1 januari 2001 per kalendermaand voor een:'
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel4.3
  - number: 4.3.a
    text: 'thuiswonende leerling:  € 84,59 , en'
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel4.3
  - number: 4.3.b
    text: 'uitwonende leerling:  € 197,21 .'
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel4.3
  - number: 4.4.1
    text: |-
      De tegemoetkoming in de onderwijsbijdrage voor een kalendermaand is eentwaalfde deel van het bedrag, bedoeld in
      [artikel 5, tweede lid, van de Les- en cursusgeldwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004188#Artikel5
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel4.4
    references:
      - id: ref1
        bwb_id: BWBR0004188
        artikel: '5'
  - number: 4.4.2
    text: |-
      In het schooljaar waarin een leerling de leeftijd van 18 jaren bereikt, wordt de tegemoetkoming in de
      onderwijsbijdrage voor dat schooljaar niet toegekend.
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel4.4
  - number: 4.5.1
    text: 'De hoogte van de tegemoetkoming in de schoolkosten voor een schooljaar is afhankelijk van:'
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel4.5
  - number: 4.5.1.a
    text: soort onderwijs, en
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel4.5
  - number: 4.5.1.b
    text: bovenbouw of overige leerjaren.
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel4.5
  - number: 4.5.2
    text: |-
      De bedragen van de onderscheiden tegemoetkomingen zijn opgenomen in [artikel 4.6][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Artikel4
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel4.5
    references:
      - id: ref1
        bwb_id: BWBR0012438
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: '4.6'
    text: |-
      De bedragen in onderstaand overzicht luiden per maand en zijn uitgedrukt in euro’s naar de maatstaf van 1 augustus
      2008.
          Overzicht. Bedragen tegemoetkoming schoolkosten






                  a. onderbouw volledig op grond van de [WVO][ref1] bekostigd onderwijs en onderbouw + bovenbouw volledig
      op grond van de [WEB][ref2] bekostigd voorbereidend beroepsonderwijs verzorgd in een agrarisch opleidingscentrum


                  €  70,25




                  b. bovenbouw volledig op grond van de [WVO][ref3] bekostigd onderwijs


                  €  76,93




                  c. onderbouw niet volledig en rechtstreeks bekostigd vo


                  €  96,20




                  d. bovenbouw niet volledig en rechtstreeks bekostigd vo


                  € 102,89




                  e. speciaal onderwijs en voortgezet speciaal onderwijs


                  €  46,67




                  f. vavo


                  € 102,89





