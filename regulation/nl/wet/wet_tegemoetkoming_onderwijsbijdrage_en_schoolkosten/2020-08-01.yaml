  - number: '9.10'
    text: |-
      Overtreding van bepalingen van een krachtens deze wet uitgevaardigde algemene maatregel van bestuur, voorzover
      uitdrukkelijk als strafbaar feit in de zin van dit artikel aangeduid, wordt gestraft met hechtenis van ten hoogste
      1 maand of geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel9.10
  - number: '9.11'
    text: De in de artikelen 9.9 en 9.10 strafbaar gestelde feiten zijn overtredingen.
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel9.11
  - number: 11.1.1
    text: |-
      Per 1 januari van ieder kalenderjaar wijzigt Onze Minister de bedragen, genoemd in de
      [artikelen 2.23, tweede lid][ref1], [4.3][ref2], [4.6][ref3], [5.4][ref4] en [5.10][ref5], op een bij of krachtens
      algemene maatregel van bestuur aan te geven wijze aan de hand van de loon- of prijsontwikkelingen in het tweede
      daaraan voorafgaande kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0012438#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0012438#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0012438#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0012438#Artikel5
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel11.1
