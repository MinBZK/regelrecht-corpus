  - number: 4.12.2
    text: |-
      In afwijking van het eerste lid kan bij ministeriële regeling worden bepaald dat voor soorten van voortgezet
      onderwijs of voor soorten van vavo het eerste lid van overeenkomstige toepassing is, indien een leerling in een of
      meer vakken zonder geldige reden niet aan het onderwijs heeft deelgenomen.
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel4.12
  - number: 4.12.3
    text: |-
      Uitsluitend de in [artikel 27a, negende lid, van de Wet op het voortgezet onderwijs][ref1] genoemde redenen voor
      afwezigheid zijn geldige redenen.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel27a
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel4.12
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 27a
  - number: '4.13'
    text: |-
      Artikel 4.12 is niet van toepassing met ingang van de eerste dag van de maand volgend op de maand waarin de
      leerling weer aan het onderwijs is gaan deelnemen, voorzover de tegemoetkoming niet reeds mede op grond van
      artikel 4.11 de vorm van lening had. Voorwaarde voor de toepassing van de vorige volzin is dat de leerling aan het
      onderwijs is gaan deelnemen binnen 8 weken na de aanvang van de periode van 5 weken. De periodes van 5 en 8 weken
      worden verlengd met de weken waarin vanwege vakantie geen onderwijs werd verzorgd.
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel4.13
  - number: 4.14.1
    text: |-
      Het bestuur van de rechtspersoon waarvan de school, bedoeld in de [artikelen 2.9, onderdelen b, c en d][ref1],
      of [2.10][ref2] voor zover het betreft een school als bedoeld in [artikel 1.4a.1 WEB][ref3], uitgaat of de
      natuurlijke persoon die deze school in stand houdt, stelt uiterlijk op de derde werkdag na afloop van een periode
      van afwezigheid van 4 weken de leerling in kennis dat daarvan in de administratie van de school een aantekening is
      gemaakt en verzoekt de leerling om opgaaf van de reden van de afwezigheid.


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0012438#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel4.14
    references:
      - id: ref1
        bwb_id: BWBR0012438
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref2
        bwb_id: BWBR0012438
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '1'
  - number: 4.14.2
    text: |-
      Uiterlijk op de vijfde werkdag na de periode van 8 weken stelt het bestuur van de rechtspersoon of de natuurlijke
      persoon vast:
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel4.14
  - number: 4.14.2.a
    text: |-
      of de reden die de leerling binnen 8 weken na de aanvang van de periode van 5 weken gaf voor zijn afwezigheid, een
      geldige reden als bedoeld in [artikel 27a, negende lid, van de Wet op het voortgezet onderwijs][ref1] is, of


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel27a
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel4.14
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 27a
  - number: 4.14.2.b
    text: |-
      dat de leerling binnen 8 weken na de aanvang van de periode van 5 weken geen reden heeft opgegeven voor zijn
      afwezigheid.
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel4.14
  - number: 4.14.3
    text: |-
      Het bestuur van de rechtspersoon of de natuurlijke persoon stelt tevens uiterlijk op de vijfde werkdag na afloop
      van de periode van 8 weken vast of de leerling voor het einde van die periode weer aan het onderwijs is gaan
      deelnemen.
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel4.14
  - number: 4.14.4
    text: |-
      Het bestuur van de rechtspersoon of de natuurlijke persoon meldt uiterlijk de vijfde werkdag na afloop van een
      periode van 8 weken aan Onze Minister dat de leerling die gedurende een aaneengesloten periode van ten minste
      5 weken zonder opgave van geldige reden niet aan het onderwijs heeft deelgenomen. Tevens meldt hij, indien die
      leerling voor het einde van die periode van 8 weken weer aan het onderwijs is gaan deelnemen, de datum daarvan.
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel4.14
  - number: 4.14.5
    text: De periodes van 5 en 8 weken worden verlengd met de weken waarin vanwege vakantie geen onderwijs werd verzorgd.
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel4.14
  - number: 4.14.6
    text: |-
      Het bestuur van de rechtspersoon of de natuurlijke persoon stuurt gelijktijdig met de mededelingen, bedoeld in
      het vierde lid, een afschrift van de gegevens die over de betrokkene aan Onze Minister zijn verstrekt, aan deze
      betrokkene en geeft daarbij tevens aan dat afwezigheid als bedoeld in [artikel 4.12][ref1], gevolgen heeft voor de
      tegemoetkoming van betrokkene, alsmede welke beroepsgang voor betrokkene open staat tegen de mededelingen, bedoeld
      in het vierde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Artikel4
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel4.14
    references:
      - id: ref1
        bwb_id: BWBR0012438
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.4'
  - number: '5.1'
    text: |-
      Deze afdeling is van toepassing op ho-studenten die als ho-student zijn ingeschreven aan een school als bedoeld in
      [artikel 2.11][ref1] of op degenen die onder de reikwijdte van [artikel 2.12][ref2] vallen en die geen aanspraak
      hebben op reguliere studiefinanciering.


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0012438#Artikel2
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel5.1
    references:
      - id: ref1
        bwb_id: BWBR0012438
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.4'
      - id: ref2
        bwb_id: BWBR0012438
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: '5.2'
    text: 'De tegemoetkoming in de zin van deze afdeling bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel5.2
  - number: 5.2.a
    text: tegemoetkoming in de onderwijsbijdrage, en
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel5.2
  - number: 5.2.b
    text: tegemoetkoming in de schoolkosten.
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel5.2
  - number: '5.3'
    text: De tegemoetkoming in de onderwijsbijdrage bedraagt € 567,23.
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel5.3
  - number: '5.4'
    text: De tegemoetkoming in de schoolkosten bedraagt naar de maatstaf van 1 januari 2008 € 647,16 .
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel5.4
  - number: 5.5.1
    text: |-
      Onze Minister kent een tegemoetkoming toe aan de ho-student die daartoe een aanvraag heeft ingediend en die voldoet
      aan de voorschriften gegeven bij of krachtens deze wet.
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel5.5
  - number: 5.5.2
    text: Een aanvraag om tegemoetkoming wordt jaarlijks voor het einde van het desbetreffende studiejaar gedaan.
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel5.5
  - number: 5.5.3
    text: 'Onze Minister besluit op een aanvraag om tegemoetkoming indien de aanvraag is ingediend:'
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel5.5
  - number: 5.5.3.a
    text: 'voor de aanvang van het desbetreffende studiejaar: binnen 8 weken na de aanvang van dat studiejaar, en'
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel5.5
  - number: 5.5.3.b
    text: 'gedurende het desbetreffende studiejaar: binnen 8 weken na de indiening van de aanvraag.'
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel5.5
  - number: 5.6.1
    text: |-
      Tegemoetkoming wordt toegekend per studiejaar en eenmaal per studiejaar uitbetaald op een bij ministeriële regeling
      te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel5.6
  - number: 5.6.2
    text: Tegemoetkoming wordt niet toegekend over de maanden waarin de ho-student niet is ingeschreven.
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel5.6
  - number: '5.7'
    text: |-
      Deze afdeling is van toepassing op leerlingen die zijn ingeschreven aan een opleiding als bedoeld in
      [artikel 2.13][ref1] en die geen aanspraak hebben op tegemoetkoming ingevolge de [hoofdstuk 4][ref2] of op
      reguliere studiefinanciering.


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0012438#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel5.7
    references:
      - id: ref1
        bwb_id: BWBR0012438
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.4'
      - id: ref2
        bwb_id: BWBR0012438
        hoofdstuk: '4'
  - number: '5.8'
    text: 'De tegemoetkoming in de zin van deze afdeling bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel5.8
  - number: 5.8.a
    text: tegemoetkoming in de onderwijsbijdrage, en
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel5.8
  - number: 5.8.b
    text: tegemoetkoming in de schoolkosten.
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel5.8
  - number: 5.9.1
    text: |-
      De hoogte van de tegemoetkoming is afhankelijk van de periode waarin en van het aantal minuten per week dat
      de leerling onderwijs volgt. De hoogte van de tegemoetkoming in de onderwijsbijdrage en in de schoolkosten is
      opgenomen in [artikel 5.10][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Artikel5
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel5.9
    references:
      - id: ref1
        bwb_id: BWBR0012438
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: 5.2.2
        afdeling: '5.2'
  - number: 5.9.2
    text: |-
      Indien de leerling zijn studie na 30 september wegens ziekte staakt, wordt de tegemoetkoming in de schoolkosten in
      afwijking van de overzichten 1 en 2, bedoeld in [artikel 5.10][ref1] niet verminderd.


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Artikel5
