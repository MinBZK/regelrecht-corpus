preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de Wet tegemoetkoming studiekosten te wijzigen als
    uitvloeisel van het regeerakkoord 1998 en van de nota «Meer voor meer»;

    dat het voorts wenselijk is de leesbaarheid van de Wet tegemoetkoming studiekosten te vergroten en aan te sluiten
    bij de terminologie van de Wet studiefinanciering 2000;

    dat het in verband met het grote aantal wijzigingen wenselijk is de Wet tegemoetkoming studiekosten in te trekken
    en te vervangen door een nieuwe wet;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#ArtikelAanhef
articles:
  - number: 1.1.1
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder: **achterstallige schuld**:
      achterstallige schuld als bedoeld in de [WSF 2000][ref1], berekend op grond van [artikel 6.3][ref2],
      **AWIR**: [Algemene wet inkomensafhankelijke regelingen][ref3], **bovenbouw**: a. voor havo: het vierde en
      vijfde leerjaar, of b. voor vwo: het vierde, vijfde en zesde leerjaar, **havo**: hoger algemeen voortgezet
      onderwijs als bedoeld in [artikel 8 WVO][ref4], **ho-student**: degene die hoger onderwijs volgt als
      bedoeld in de [artikelen 2.11][ref5] en [2.12][ref6], **leerling**: scholier of vavo-student, **lening**:
      rentedragende lening die niet kan worden omgezet in een gift, **onderbouw**: a. het voorbereidend middelbaar
      beroepsonderwijs, bedoeld in [artikel 21, eerste lid, WVO][ref7], alle leerjaren, b. het praktijkonderwijs,
      bedoeld in [artikel 10f WVO][ref8], alle leerjaren, c. voor havo: het eerste, tweede en derde leerjaar,
      of d. voor vwo: het eerste, tweede en derde leerjaar, **onderwijsbijdrage**: a. lesgeld als bedoeld in
      [artikel 5 van de Les- en cursusgeldwet][ref9], b. voor een niet uit 's Rijks kas bekostigde school de
      verschuldigde bijdrage aan de school, c. voor de toepassing van [afdeling 5.1][ref10], voorzover het een uit
      's Rijks kas bekostigde school betreft: het bedrag, bedoeld in [artikel 5.3][ref11], of d. voor de toepassing
      van [afdeling 5.2][ref12], voorzover het een uit 's Rijks kas bekostigde school betreft: de bedragen, bedoeld
      in [artikel 5.10][ref13], **onderwijsnummer**: door Onze Minister uitgegeven persoonsgebonden nummer, toegekend
      aan een persoon aan wie niet van overheidswege een burgerservicenummer is verstrekt, **Onze Minister**: Onze
      Minister van Onderwijs, Cultuur en Wetenschap, **partner**: degene die in het kalenderjaar waarin het school- of
      studiejaar aanvangt gedurende meer dan 6 maanden partner als bedoeld in [artikel 3 AWIR][ref14] van de aanvrager
      is, met dien verstande dat voor de toepassing van [hoofdstuk 4][ref15] voor «belanghebbende» gelezen wordt: TOS-
      ouder, **peiljaar**: tweede jaar voorafgaand aan het jaar waarin het schooljaar of studiejaar aanvangt, **reguliere
      studiefinanciering**: studiefinanciering als bedoeld in [artikel 3.1, eerste of tweede lid, WSF 2000][ref16],
      **scholier**: degene die voortgezet onderwijs volgt, **school**: school of instelling in de zin van de
      [Experimentenwet onderwijs][ref17], [Wet op de erkende onderwijsinstellingen][ref18], [WEC][ref19], [WHW][ref20]
      of [WVO][ref21], **schooljaar**: tijdvak dat aanvangt op 1 augustus van enig kalenderjaar en eindigt op 31 juli
      daaropvolgend, **studiejaar**: tijdvak dat aanvangt op 1 september van enig kalenderjaar en eindigt op 31 augustus
      daaropvolgend, **tegemoetkoming**: door Onze Minister verstrekte toekenning in verband met het volgen van een
      opleiding in het onderwijs waarop uitsluitend op grond van deze wet aanspraak bestaat, **termijnbetaling**:
      termijnbetaling als bedoeld in de [WSF 2000][ref22], berekend op grond van [artikel 6.3][ref23], **thuiswonende
      leerling**: scholier of vavo-student die woont op het adres van de TOS-ouder of partner van de TOS-ouder,
      **toetsingsinkomen**: inkomen als bedoeld in [artikel 8, eerste en tweede lid, AWIR][ref24], met dien verstande
      dat voor «berekeningsjaar» gelezen wordt: peiljaar, **TOS-ouder**: wettelijke vertegenwoordiger in het laatste
      kwartaal waarin de leerling nog 17 jaar was, **uitwonende leerling**: scholier of vavo-student die niet
      een thuiswonende leerling is, **vavo**: opleiding voortgezet algemeen volwassenenonderwijs als bedoeld in
      [artikel 7.3.1, eerste lid, onderdeel a, WEB][ref25], **vavo-student**: degene die vavo volgt als bedoeld in
      [artikel 2.10][ref26], **voortgezet onderwijs**: onderwijs in de zin van de [WVO][ref27], en, tenzij anders is
      bepaald, speciaal onderwijs en voortgezet speciaal onderwijs als bedoeld in de [WEC][ref28], **vreemdeling**:
      hetgeen daaronder wordt verstaan in de [Vreemdelingenwet 2000][ref29], **vwo**: voorbereidend wetenschappelijk
      onderwijs als bedoeld in [artikel 7 WVO][ref30], **WEB**: [Wet educatie en beroepsonderwijs][ref31], **WEC**:
      [Wet op de expertisecentra][ref32], **WHW**: [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref33],
      **WSF 2000**: [Wet studiefinanciering 2000][ref34], **WVO**: [Wet op het voortgezet onderwijs][ref35].


