  - number: 1.1.2
    text: |-
      In onderdeel b van de begripsbepaling «TOS-ouder» wordt, indien 2 natuurlijke personen voldoen aan het begrip
      wettelijke vertegenwoordiger, daaronder verstaan:
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel1.1
  - number: 1.1.2.a
    text: |-
      wettelijke vertegenwoordiger die over het tweede kwartaal van het jaar waarin het schooljaar aanvangt, ten behoeve
      van de leerling kinderbijslag als bedoeld in de [Algemene Kinderbijslagwet][ref1] heeft ontvangen,


      [ref1]: https://wetten.overheid.nl/BWBR0002368
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel1.1
    references:
      - id: ref1
        bwb_id: BWBR0002368
  - number: 1.1.2.b
    text: |-
      indien onderdeel a niet van toepassing is: wettelijke vertegenwoordiger bij wie de leerling op 1 augustus blijkens
      de basisregistratie personen woont, of
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel1.1
  - number: 1.1.2.c
    text: |-
      indien de onderdelen a en b niet van toepassing zijn: wettelijke vertegenwoordiger die de wettelijke
      vertegenwoordigers gezamenlijk daartoe hebben aangewezen.
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel1.1
  - number: '1.2'
    text: |-
      Voor de toepassing van het bepaalde bij of krachtens deze wet is bepalend de toestand op de eerste dag van de
      maand, tenzij anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel1.2
  - number: 1.3.1
    text: Een aanvraag kan worden gedaan door een leerling of ho-student.
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel1.3
  - number: 1.3.2
    text: |-
      Bij ministeriële regeling kan worden bepaald aan welke voorwaarden een aanvraag moet voldoen. In ieder geval wordt
      daarbij bepaald dat de aanvrager in de zin van [hoofdstuk 5][ref1] en zijn partner alsmede de TOS-ouder en zijn
      partner hun burgerservicenummer of onderwijsnummer verstrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel1.3
    references:
      - id: ref1
        bwb_id: BWBR0012438
        hoofdstuk: '5'
  - number: 1.5.1
    text: |-
      Indien bij controle door Onze Minister blijkt dat het door de scholier verstrekte adres afwijkt van het adres
      waarop hij in de basisregistratie personen staat ingeschreven, maakt Onze Minister dit aan hem bekend en stelt hem
      in de gelegenheid de afwijking te herstellen.
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel1.5
  - number: 1.5.2
    text: |-
      Indien een uitwonende scholier de afwijking niet binnen 4 weken na de bekendmaking herstelt, wordt met ingang van
      de maand waarin de afwijking is ontstaan, de aan hem toegekende basistoelage omgezet in een basistoelage voor een
      thuiswonende scholier, tenzij hem van de afwijking redelijkerwijs geen verwijt kan worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel1.5
  - number: 1.5.3
    text: |-
      Indien een uitwonende scholier de afwijking na de termijn van 4 weken alsnog herstelt, wordt met ingang van de
      maand daaropvolgend de basistoelage voor een thuiswonende scholier omgezet in een basistoelage voor een uitwonende
      scholier.
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel1.5
  - number: 1.7.1
    text: |-
      Onze Minister gebruikt het burgerservicenummer of onderwijsnummer van een leerling, ho-student of debiteur ter zake
      van de uitvoering van deze wet slechts:
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel1.7
  - number: 1.7.1.a
    text: in contacten met die leerling, ho-student of debiteur,
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel1.7
  - number: 1.7.1.b
    text: |-
      in contacten met personen en instanties voorzover deze zelf gemachtigd zijn tot het opnemen van het
      burgerservicenummer of onderwijsnummer in een persoonsregistratie, en
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel1.7
  - number: 1.7.1.c
    text: |-
      teneinde de gegevens van die leerling, ho-student of debiteur te vergelijken met de gegevens die over hem zijn
      opgenomen in het register onderwijsdeelnemers, bedoeld in [artikel 4 van de Wet register onderwijsdeelnemers][ref1],
      voorzover dat noodzakelijk is voor de uitvoering van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0042012#Artikel4
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel1.7
    references:
      - id: ref1
        bwb_id: BWBR0042012
        artikel: '4'
  - number: 1.7.2
    text: |-
      Het burgerservicenummer of onderwijsnummer van de partner van een leerling, ho-student of debiteur of van de TOS-
      ouder of diens partner kan ter zake van de uitvoering van deze wet slechts worden gebruikt in contacten met die
      partner of TOS-ouder of met de desbetreffende leerling, ho-student of debiteur, alsmede, voorzover het betreft de
      controle op de rechtmatigheid, in contacten met personen en instanties voorzover deze zelf gemachtigd zijn tot het
      opnemen van het burgerservicenummer of onderwijsnummer in een persoonsregistratie.
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel1.7
  - number: '1.8'
