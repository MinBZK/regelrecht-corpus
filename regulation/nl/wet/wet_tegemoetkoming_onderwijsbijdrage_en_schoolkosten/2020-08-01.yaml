      [ref1]: https://wetten.overheid.nl/BWBR0002399
      [ref2]: https://wetten.overheid.nl/BWBR0007625
      [ref3]: https://wetten.overheid.nl/BWBR0002399
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel4.6
    references:
      - id: ref1
        bwb_id: BWBR0002399
      - id: ref2
        bwb_id: BWBR0007625
      - id: ref3
        bwb_id: BWBR0002399
  - number: 4.7.1
    text: |-
      De tegemoetkoming in de onderwijsbijdrage over de maand augustus van enig kalenderjaar omvat in afwijking van
      artikel 4.4, eerste lid, tevens een voorschot op die tegemoetkoming over het schooljaar dat met die maand augustus
      aanvangt. Dit voorschot bedraagt ten hoogste de verschuldigde onderwijsbijdrage en wordt niet uitbetaald.
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel4.7
  - number: 4.7.2
    text: |-
      Indien de tegemoetkoming in de onderwijsbijdrage lager is dan de verschuldigde onderwijsbijdrage, omvat het
      voorschot, bedoeld in het eerste lid, tevens een voorschot op de tegemoetkoming in de schoolkosten. Het voorschot
      bedraagt ten hoogste de verschuldigde onderwijsbijdrage.
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel4.7
  - number: 4.8.1
    text: |-
      Onze Minister kent een tegemoetkoming toe aan de leerling die daartoe een aanvraag heeft ingediend en die voldoet
      aan de voorschriften gegeven bij of krachtens deze wet.
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel4.8
  - number: 4.8.2
    text: 'Onze Minister besluit op een aanvraag om tegemoetkoming indien de aanvraag is ingediend:'
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel4.8
  - number: 4.8.2.a
    text: |-
      vóór 1 november van het jaar voorafgaand aan het kalenderjaar waarop de tegemoetkoming betrekking heeft: vóór 31
      december van dat voorafgaande jaar, en
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel4.8
  - number: 4.8.2.b
    text: 'na het onder a bedoelde tijdstip: binnen 8 weken na de indiening van de aanvraag.'
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel4.8
  - number: '4.9'
    text: |-
      Indien het op basis van de verstrekte gegevens onmogelijk is de draagkracht vast te stellen, kent Onze Minister de
      basistoelage toe.
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel4.9
  - number: 4.10.1
    text: |-
      Tegemoetkoming wordt toegekend per kalenderjaar of een gedeelte daarvan, met dien verstande dat deze periode ten
      minste 1 kalendermaand is.
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel4.10
  - number: 4.10.2
    text: Tegemoetkoming wordt niet toegekend voor een periode die gelegen is voor de datum van indiening van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel4.10
  - number: 4.10.3
    text: |-
      Aan de leerling die reeds een tegemoetkoming ontvangt en een aanvraag heeft ingediend om in aanmerking te komen
      voor een verhoging van de basistoelage wordt, in afwijking van het tweede lid, de verhoging toegekend met ingang
      van de maand waarin de aanvraag tot verhoging is ingediend. Aan de leerling die reeds een tegemoetkoming ontvangt
      en een aanvraag heeft ingediend om in aanmerking te komen voor een tegemoetkoming in de onderwijsbijdrage of
      in de schoolkosten wordt, in afwijking van het tweede lid, de tegemoetkoming in de onderwijsbijdrage of in de
      schoolkosten toegekend met ingang van de maand waarvoor voor het eerst een tegemoetkoming is toegekend.
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel4.10
  - number: '4.11'
    text: |-
      Op aanvraag van een uitwonende leerling wordt het niet toe te kennen deel van de maximale tegemoetkoming in de
      onderwijsbijdrage en in de schoolkosten toegekend in de vorm van lening. Voorwaarde voor die toekenning is dat de
      leerling gelijktijdig met de aanvraag aan Onze Minister een door hemzelf ondertekende verklaring verstrekt dat zijn
      TOS-ouder en diens partner beide weigeren bij te dragen in zijn schoolkosten. Die verklaring wordt mede ondertekend
      door een schooldecaan ten blijke dat zij naar zijn kennis juist is.
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel4.11
  - number: 4.12.1
    text: |-
      De tegemoetkoming van de leerling die is ingeschreven aan een school als bedoeld in de
      [artikelen 2.9, onderdelen a, b en c][ref1], of [2.10][ref2], of ingeschreven voor een cursus als bedoeld in
      [artikel 2.9, onderdeel d][ref3], en die zonder geldige reden niet aan het onderwijs heeft deelgenomen gedurende
      een aaneengesloten periode van ten minste 5 weken, bestaat geheel uit lening met ingang van de eerste dag van de
      maand volgend op de maand waarin de afwezigheid zonder geldige reden aanving. De periode van 5 weken wordt verlengd
      met de weken waarin vanwege vakantie geen onderwijs werd verzorgd.


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0012438#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0012438#Artikel2
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel4.12
    references:
