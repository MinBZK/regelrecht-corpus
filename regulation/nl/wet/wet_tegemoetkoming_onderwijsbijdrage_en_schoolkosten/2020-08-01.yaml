    text: |-
      achteraf is gebleken van feiten of omstandigheden, die, waren zij eerder bekend geweest, niet tot toepassing van
      [artikel 2.22b][ref1] zouden hebben geleid, of


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Artikel2
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel7.1
    references:
