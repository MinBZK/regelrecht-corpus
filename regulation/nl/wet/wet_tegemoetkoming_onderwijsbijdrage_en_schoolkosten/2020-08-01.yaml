        afdeling: '5.2'
  - number: 11.1.2
    text: |-
      Bij algemene maatregel van bestuur kunnen de maatstaven, genoemd in de [artikelen 4.3][ref1], [4.6][ref2] en
      [5.10][ref3], alsmede de bedragen, genoemd in die artikelen, worden gewijzigd.


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0012438#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0012438#Artikel5
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel11.1
    references:
