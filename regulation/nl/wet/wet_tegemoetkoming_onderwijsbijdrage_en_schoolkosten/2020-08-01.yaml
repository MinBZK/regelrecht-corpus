  - number: 12.11.1
    text: |-
      Op besluiten met betrekking tot tegemoetkomingen voor het school- of studiejaar 2005–2006 zijn de bepalingen die
      golden voor de inwerkingtreding van de [Aanpassingswet Algemene wet inkomensafhankelijke regelingen][ref1] van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018471
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel12.11
    references:
      - id: ref1
        bwb_id: BWBR0018471
  - number: 12.11.2
    text: |-
      Op besluiten met betrekking tot tegemoetkomingen voor het
      school- of studiejaar 2006–2007 zijn de bepalingen, opgenomen in
      [hoofdstuk 1, afdeling C, artikel IV, van de Aanpassingswet Algemene wet inkomensafhankelijke regelingen][ref1]
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018471#ArtikelIV
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel12.11
    references:
      - id: ref1
        bwb_id: BWBR0018471
        artikel: IV
  - number: 12.11.3
    text: |-
      Op besluiten met betrekking tot tegemoetkomingen voor het
      school- of studiejaar 2007–2008 zijn de bepalingen, opgenomen in
      [hoofdstuk 1, afdeling C, artikel V, van de Aanpassingswet Algemene wet inkomensafhankelijke regelingen][ref1]
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018471#ArtikelV
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel12.11
    references:
      - id: ref1
        bwb_id: BWBR0018471
        artikel: V
  - number: 12.11.4
    text: |-
      Op besluiten met betrekking tot tegemoetkomingen voor het school-
      of studiejaar 2008–2009 en volgende zijn de bepalingen, opgenomen in
      [hoofdstuk 1, afdeling C, artikel VI, van de Aanpassingswet Algemene wet inkomensafhankelijke regelingen][ref1]
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018471#ArtikelVI
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel12.11
    references:
      - id: ref1
        bwb_id: BWBR0018471
        artikel: VI
  - number: '12.12'
    text: |-
      In afwijking van [artikel III van de Vierde tranche Algemene wet bestuursrecht][ref1]
      is de [Algemene wet bestuursrecht][ref2] zoals die geldt na inwerkingtreding van de
      [Vierde tranche Algemene wet bestuursrecht][ref3] van toepassing op alle betalingen op grond van de Wet
      tegemoetkomingen onderwijsbijdrage en schoolkosten.


      [ref1]: https://wetten.overheid.nl/BWBR0026016#ArtikelIII
      [ref2]: https://wetten.overheid.nl/BWBR0005537
      [ref3]: https://wetten.overheid.nl/BWBR0026016
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel12.12
    references:
      - id: ref1
        bwb_id: BWBR0026016
        artikel: III
      - id: ref2
        bwb_id: BWBR0005537
      - id: ref3
        bwb_id: BWBR0026016
  - number: 12.12a
    text: |-
      Een aanvrager die per 1 januari 2010 aanspraak heeft op een verhoging van het kindgebonden budget als
      bedoeld in de Wet van 18 juni 2009 tot wijziging van de Wet op het kindgebonden budget, de Wet tegemoetkoming
      onderwijsbijdrage en schoolkosten en de Wet studiefinanciering 2000 in verband met de integratie van hoofdstuk 3
      van de Wet tegemoetkoming onderwijsbijdrage en schoolkosten in de Wet op het kindgebonden budget (Stb. 331), kan
      voor het tijdvak tot 1 januari 2010 voor tegemoetkoming ingevolge [hoofdstuk 3][ref1] van de Wet tegemoetkoming
      onderwijsbijdrage en schoolkosten zoals deze luidde voor de datum van inwerkingtreding van voormelde wet van 18
      juni 2009, in aanmerking komen indien de scholier, de student als bedoeld in de [WEB][ref2] of de vavo-student
      op wie de aanvraag betrekking heeft, jonger is dan 18 jaren en is ingeschreven aan een school als bedoeld in
      [paragraaf 2.2][ref3] van de Wet tegemoetkoming onderwijsbijdrage en schoolkosten zoals deze luidde voor de
      inwerkingtreding van voormelde wet van 18 juni 2009.


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0007625
      [ref3]: https://wetten.overheid.nl/BWBR0012438#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel12.12a
    references:
      - id: ref1
        bwb_id: BWBR0012438
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0007625
      - id: ref3
        bwb_id: BWBR0012438
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 12.13.1
    text: |-
      Aanvragen op grond van de Wet tegemoetkoming studiekosten worden van rechtswege omgezet in een aanvraag op grond
      van deze wet.
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel12.13
  - number: 12.13.2
    text: |-
      Tegemoetkoming die op grond van de Wet tegemoetkoming studiekosten is toegekend, wordt van rechtswege omgezet in
      tegemoetkoming op grond van deze wet.
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel12.13
  - number: 12.13.3
    text: |-
      Verplichtingen die op grond van de Wet tegemoetkoming studiekosten bestaan, worden van rechtswege omgezet in
      verplichtingen op grond van deze wet.
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel12.13
  - number: 12.14.1
    text: |-
      Op bezwaar en beroep ingevolge de Wet tegemoetkoming studiekosten, ingesteld voor 1 augustus 2001, of tegen een
      besluit van voor deze datum ingesteld op of na deze datum, blijven de op 31 juli 2001 geldende voorschriften van
      toepassing.
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel12.14
  - number: 12.14.2
    text: |-
      Op bezwaar en beroep tegen een besluit ingevolge de Wet tegemoetkoming onderwijsbijdrage en schoolkosten, dat is
      genomen voor 1 januari 2010, blijven de op 31 december 2009 geldende voorschriften van toepassing.
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel12.14
  - number: '14.1'
    text: De Wet tegemoetkoming studiekosten wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel14.1
  - number: '14.2'
    text: 'Deze wet treedt in werking op 1 augustus 2001, met uitzondering van:'
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel14.2
  - number: 14.2.a
    text: artikel 1.5 dat in werking treedt op een bij koninklijk besluit te bepalen tijdstip,
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel14.2
  - number: 14.2.b
    text: artikel 13.5 dat in werking treedt met ingang van 1 januari 2002, en
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel14.2
  - number: 14.2.c
    text: |-
      de artikelen 13.12 en 13.14, onderdelen A, G en I, die in werking treden met ingang van de dag na de datum van
      uitgifte van het Staatsblad waarin deze wet wordt geplaatst, en terugwerken tot en met 1 september 2000.
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel14.2
  - number: '14.3'
    text: 'Deze wet wordt aangehaald als: Wet tegemoetkoming onderwijsbijdrage en schoolkosten.'
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel14.3
