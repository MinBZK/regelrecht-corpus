      voorwaarde genoemd in artikel 2.28, tweede lid, onderdeel b, en is gebleken dat gedurende 3 kalenderjaren is
      voldaan aan de voorwaarden genoemd in artikel 2.28, tweede lid, aanhef alsmede onderdeel a,


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Artikel2
