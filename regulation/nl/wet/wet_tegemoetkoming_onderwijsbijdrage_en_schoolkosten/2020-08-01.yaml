        artikel: '5'
        hoofdstuk: '5'
        paragraaf: 5.2.2
        afdeling: '5.2'
  - number: 11.1.3
    text: |-
      De voordracht voor een krachtens het tweede lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel11.1
  - number: '11.2'
    text: |-
      [Titel 4.2 van de Algemene wet bestuursrecht][ref1] is niet van toepassing op deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel11.2
    references:
      - id: ref1
        bwb_id: BWBR0005537
  - number: 11.3.1
    text: |-
      Tegemoetkoming is niet vatbaar voor vervreemding, verpanding, belening en beslag, waaronder begrepen beslag
      ingevolge faillissement of toepassing van de schuldsaneringsregeling natuurlijke personen.
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel11.3
  - number: 11.3.2
    text: Elk beding, strijdig met dit artikel, is nietig.
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel11.3
  - number: 11.4.1
    text: |-
      Onze Minister kan voor bepaalde gevallen de wet buiten toepassing laten of daarvan afwijken voorzover toepassing
      gelet op het belang dat deze wet beoogt te beschermen, zal leiden tot een onbillijkheid van overwegende aard.
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel11.4
  - number: 11.4.2
    text: 'Het eerste lid is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel11.4
  - number: 11.4.2.a
    text: het begrip partner,
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel11.4
  - number: 11.4.2.b
    text: het begrip toetsingsinkomen,
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel11.4
  - number: 11.4.2.c
    text: het begrip vreemdeling, en
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel11.4
  - number: 11.4.2.d
    text: |-
      [artikel 1.8][ref1].

      [ref1]: https://wetten.overheid.nl/BWBR0012438#Artikel1
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel11.4
    references:
      - id: ref1
        bwb_id: BWBR0012438
        artikel: '1'
        hoofdstuk: '1'
  - number: '12.3'
    text: |-
      Artikel 1.5 is niet van toepassing op scholieren die voor 1 augustus volgend op het tijdstip van inwerkingtreding
      van dat artikel, een basistoelage als bedoeld in artikel 4.3 of als bedoeld in artikel 26 van de Wet tegemoetkoming
      studiekosten ontvingen.
    url: https://wetten.overheid.nl/BWBR0012438/2020-08-01#Artikel12.3
  - number: 12.3a.1
    text: |-
      In afwijking van [artikel 2.11][ref1], komt tot een bij koninklijk besluit te bepalen tijdstip voor tegemoetkoming
      ingevolge [afdeling 5.1][ref2] mede in aanmerking een ho-student die is ingeschreven voor het volgen van een
      voltijdse opleiding als bedoeld in [artikel 18.64 WHW][ref3], voor zover aan die opleiding accreditatie als bedoeld
      in [artikel 1.1, onderdeel q, WHW][ref4] is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0012438#Hoofdstuk5
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel18
      [ref4]: https://wetten.overheid.nl/BWBR0005682#Artikel1
