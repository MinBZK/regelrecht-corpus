  - number: 7.1.2.c
    text: te veel of te weinig tegemoetkoming is toegekend op basis van onjuiste of onjuist verwerkte gegevens,
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel7.1
  - number: 7.1.2.d
    text: |-
      de hoogte van het inkomen van de aanvrager of diens partner of van de TOS-ouder of diens partner te hoog of te laag
      is vastgesteld op basis van onjuiste of onjuist verwerkte gegevens anders dan bedoeld onder a,
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel7.1
  - number: 7.1.2.e
    text: aanvrager of TOS-ouder heeft gehandeld in strijd met het bepaalde bij of krachtens deze wet,
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel7.1
  - number: 7.1.2.f
    text: |-
      geen gevolg is gegeven aan de aanvraag op grond van [artikel 2.28][ref1] omdat niet kon worden voldaan aan de
      voorwaarde genoemd in [artikel 2.28, tweede lid, onderdeel b][ref2], en is gebleken dat gedurende 2 kalenderjaren
      is voldaan aan de voorwaarden genoemd in [artikel 2.28, tweede lid, aanhef alsmede onderdeel a][ref3],


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0012438#Artikel2
