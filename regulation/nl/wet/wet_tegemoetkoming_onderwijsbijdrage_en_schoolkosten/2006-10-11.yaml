      een school als bedoeld in [artikel 1.1.1, onderdeel b, van de WEB][ref1], voorzover het een uit 's Rijks kas
      bekostigde beroepsopleiding betreft, of


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
