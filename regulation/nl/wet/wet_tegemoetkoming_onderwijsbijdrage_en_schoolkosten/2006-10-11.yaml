        artikel: 118k
  - number: '2.13'
    text: |-
      Voor tegemoetkoming ingevolge [afdeling 5.2][ref1] kan een leerling in aanmerking komen indien hij is ingeschreven
      voor een opleiding of een gedeelte daarvan aan een school als bedoeld in de [artikelen 2.4][ref2], [2.5][ref3],
      [2.6][ref4] en [2.8][ref5], die leidt tot het diploma:


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0012438#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0012438#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0012438#Artikel2
      [ref5]: https://wetten.overheid.nl/BWBR0012438#Artikel2
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel2.13
