        artikel: '56'
  - number: 2.6.1
    text: |-
      Voor tegemoetkoming ingevolge [hoofdstuk 3][ref1] kan een aanvrager in aanmerking komen indien de scholier is
      ingeschreven aan een school die is erkend op grond van de [Wet op de erkende onderwijsinstellingen][ref2] voorzover
      de gevolgde cursus onder de reikwijdte van die wet valt.


