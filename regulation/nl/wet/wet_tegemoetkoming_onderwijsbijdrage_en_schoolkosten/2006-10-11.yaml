    text: |-
      Voorzover het peiljaar een aan het kalenderjaar 2001 voorafgaand kalenderjaar is, wordt voor de toepassing van de
      artikelen 2.24, 2.29 en 10.6 onder:
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel12.5
  - number: 12.5.a
    text: '«de gecorrigeerde verzamelinkomens» in artikel 2.24 verstaan: de belastbare inkomens,'
