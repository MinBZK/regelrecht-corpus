    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel2.13
  - number: 2.13.b
    text: hoger algemeen voortgezet onderwijs, of
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel2.13
  - number: 2.13.c
    text: voortgezet middelbaar beroepsonderwijs voor zover het betreft de theoretische leerweg.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel2.13
  - number: '2.14'
    text: |-
      Geen aanspraak op tegemoetkoming bestaat indien de leerling of student is ingeschreven aan een opleiding waarvan de
      duur, daaronder begrepen ten hoogste 12 vakantieweken, korter is dan 1 jaar.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel2.14
  - number: '2.15'
    text: |-
      De aanspraak op tegemoetkoming van een leerling die gedurende een aaneengesloten periode van 8 weken niet aan het
      onderwijs heeft deelgenomen, vervalt met ingang van de eerste dag van de maand volgend op die waarin de school de
      afwezigheid, bedoeld in artikel 4.12 aan de IB-Groep heeft medegedeeld. De periode van 8 weken wordt verlengd met
      de weken waarin vanwege vakantie geen onderwijs werd verzorgd.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel2.15
  - number: 2.16.1
    text: |-
      Een student heeft geen aanspraak op tegemoetkoming indien hij binnen een periode van 48 maanden gedurende 24
      maanden een tegemoetkoming in de zin van afdeling 5.1 heeft genoten. Een student heeft tevens geen aanspraak indien
      hij een tegemoetkoming ontvangt in de zin van hoofdstuk 10.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel2.16
  - number: 2.16.2
    text: |-
      Een leerling heeft geen aanspraak op tegemoetkoming in de zin van afdeling 5.2, indien hij een tegemoetkoming
      ontvangt in de zin van hoofdstuk 10.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel2.16
  - number: '2.17'
    text: |-
      Een leerling die onderwijs volgt als bedoeld in de artikelen 2.5, 2.6, 2.7, 2.9 voorzover het een school betreft
      als bedoeld in de artikelen 2.5 en 2.6, eerste lid, en 2.10 heeft slechts aanspraak op tegemoetkoming indien
      de opleiding een studielast heeft van ten minste 850 klokuren per schooljaar die worden besteed aan het volgen
      van lessen, stages of beroepspraktijkvorming, overeenkomstig de onderwijs- en examenregeling of de daarmee
      overeenkomende regeling voor de desbetreffende opleiding.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel2.17
  - number: 2.18.1
    text: |-
      Indien Onze Minister heeft besloten dat een opleiding niet voldoet aan de voorwaarden, genoemd in artikel 2.17,
      maakt hij dit bekend aan de school. De bekendmaking heeft rechtsgevolg voor 2 opeenvolgende schooljaren. Indien
      de bekendmaking wordt gedaan voor 1 maart, voldoet de opleiding niet gedurende de 2 schooljaren die volgen op het
      tijdstip van de bekendmaking. Indien de bekendmaking is gedaan op of na 1 maart voldoet de opleiding niet gedurende
      het tweede en derde schooljaar die volgen op het tijdstip van de bekendmaking.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel2.18
  - number: 2.18.2
    text: |-
      Voor de leerling die over de maand waarin het besluit tot bekendmaking, bedoeld in het eerste lid, werd genomen,
      tegemoetkoming ontving voor het volgen van die opleiding, geldt in afwijking van de artikelen 2.14 en 2.17, dat hij
      zijn aanspraak op tegemoetkoming behoudt:
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel2.18
  - number: 2.18.2.a
    text: tot het einde van het kalenderjaar, indien de bekendmaking is gedaan voor 1 maart, en
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel2.18
  - number: 2.18.2.b
    text: |-
      tot het einde van het schooljaar dat volgt op het tijdstip van de bekendmaking, indien de bekendmaking is gedaan op
      of na 1 maart.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel2.18
  - number: 2.19.1
    text: |-
      De aanspraak op tegemoetkoming ingevolge [hoofdstuk 4][ref1] vervalt met ingang van de maand die volgt op de dag
      waarop de leerling het laatste schooljaar met goed gevolg heeft afgesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel2.19
    references:
      - id: ref1
        bwb_id: BWBR0012438
        hoofdstuk: '4'
  - number: 2.19.2
    text: |-
      Indien de leerling aansluitend aan het schooljaar dat als laatste schooljaar was aangemerkt, opnieuw dat laatste
      schooljaar aanvangt, ontstaat aanspraak op tegemoetkoming voor het resterende gedeelte van het kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel2.19
  - number: 2.19.3
    text: |-
      Indien de leerling na het afsluitend examen binnen 4 maanden een andere opleiding in de zin van deze wet of van
      de [Wet studiefinanciering 2000][ref1] gaat volgen, wordt, in afwijking van het eerste lid, op zijn aanvraag
      de aanspraak op tegemoetkoming met ten hoogste 4 maanden verlengd. Indien de verlenging de maanden augustus,
      september, oktober of november betreft, heeft de leerling die op grond van [hoofdstuk 4][ref2] nog geen
      tegemoetkoming in de onderwijsbijdrage is toegekend en een opleiding als bedoeld in de [artikelen 2.5][ref3],
      [2.6, eerste lid][ref4], [2.8][ref5] of [2.10][ref6], of een opleiding waarvoor aanspraak op studiefinanciering
      bestaat, gaat volgen, over die maanden naast een tegemoetkoming in de zin van [hoofdstuk 4][ref7] ook aanspraak
      op een bedrag aan tegemoetkoming in de onderwijsbijdrage, ter grootte van eentwaalfde van het bedrag, bedoeld
      in [artikel 5, tweede lid, van de Les- en cursusgeldwet][ref8], per maand. Voor de vaststelling van de hoogte
      van de tegemoetkoming in die maanden wordt uitgegaan van het toetsingsinkomen, zoals dat gold op 31 juli van het
      voorafgaande schooljaar. In afwijking van [artikel 4.10, tweede lid][ref9], wordt die aanvraag ingediend voor het
      einde van de periode van 4 maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0011453
      [ref2]: https://wetten.overheid.nl/BWBR0012438#Hoofdstuk4
      [ref3]: https://wetten.overheid.nl/BWBR0012438#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0012438#Artikel2
      [ref5]: https://wetten.overheid.nl/BWBR0012438#Artikel2
      [ref6]: https://wetten.overheid.nl/BWBR0012438#Artikel2
      [ref7]: https://wetten.overheid.nl/BWBR0012438#Hoofdstuk4
      [ref8]: https://wetten.overheid.nl/BWBR0004188#Artikel5
      [ref9]: https://wetten.overheid.nl/BWBR0012438#Artikel4
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel2.19
    references:
      - id: ref1
        bwb_id: BWBR0011453
      - id: ref2
        bwb_id: BWBR0012438
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0012438
        artikel: '2'
