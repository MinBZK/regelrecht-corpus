        hoofdstuk: '10'
      - id: ref2
        bwb_id: BWBR0018472
  - number: 1.8.a
    text: |-
      [artikel 6][ref1],

      [ref1]: https://wetten.overheid.nl/BWBR0018472#Artikel6
