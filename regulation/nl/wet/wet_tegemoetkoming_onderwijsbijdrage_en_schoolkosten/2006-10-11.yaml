        hoofdstuk: '3'
  - number: '2.1'
    text: 'Deze wet regelt de tegemoetkoming en is van toepassing indien wordt voldaan aan de voorwaarden inzake:'
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel2.1
  - number: 2.1.a
    text: nationaliteit als bedoeld in artikel 2.2,
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel2.1
  - number: 2.1.b
    text: leeftijd als bedoeld in artikel 2.3,
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel2.1
  - number: 2.1.c
    text: onderwijssoort als bedoeld in de paragrafen 2.2 tot en met 2.4, en
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel2.1
  - number: 2.1.d
    text: inkomen als bedoeld in paragraaf 2.7.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel2.1
  - number: 2.2.1
    text: 'Op tegemoetkoming kan aanspraak bestaan indien de aanvrager:'
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel2.2
  - number: 2.2.1.a
    text: de Nederlandse nationaliteit bezit,
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel2.2
  - number: 2.2.1.b
    text: |-
      niet de Nederlandse nationaliteit bezit maar wel ingevolge een verdrag of een besluit van een volkenrechtelijke
      organisatie op het terrein van de tegemoetkoming met een Nederlander wordt gelijkgesteld, of
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel2.2
  - number: 2.2.1.c
    text: |-
      niet de Nederlandse nationaliteit bezit maar wel behoort tot een bij algemene maatregel van bestuur aangewezen
      groep van personen die op het terrein van de tegemoetkoming met Nederlanders worden gelijkgesteld.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel2.2
  - number: 2.2.2
    text: |-
      Voor de toepassing van de [hoofdstukken 4][ref1] en [5][ref2] geldt in aanvulling op het eerste lid, onderdeel c,
      dat de aanvrager in Nederland woont, tenzij deze voorwaarde niet mag worden gesteld op grond van een verdrag of een
      besluit van een volkenrechtelijke organisatie. Bij of krachtens algemene maatregel van bestuur kunnen regels worden
      gesteld in verband met een goede uitvoering van dit lid.


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0012438#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0012438
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0012438
        hoofdstuk: '5'
  - number: 2.2.3
    text: |-
      Onverminderd het eerste lid, onderdeel b, kunnen bij algemene maatregel van bestuur groepen van personen worden
      aangewezen voor wie de gelijkstelling, bedoeld in het eerste lid, onderdeel b, slechts een tegemoetkoming in de
      kosten van de toegang tot het onderwijs betreft. Bij algemene maatregel van bestuur kunnen regels worden gesteld
      met betrekking tot de hoogte en de vorm van deze tegemoetkoming.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel2.2
  - number: 2.2.4
    text: Bij algemene maatregel van bestuur kan ten gunste van de student worden afgeweken van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel2.2
  - number: 2.3.1
    text: |-
      Op tegemoetkoming ingevolge hoofdstuk 3 kan aanspraak bestaan tot de maand volgend op het kwartaal waarin de
      leerling de leeftijd van 18 jaren heeft bereikt.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel2.3
  - number: 2.3.2
    text: |-
      Op tegemoetkoming ingevolge hoofdstuk 4 kan aanspraak bestaan met ingang van de eerste dag van het kwartaal
      volgend op het kwartaal waarin de leerling de leeftijd van 18 jaren heeft bereikt tot en met de maand waarin hij de
      leeftijd van 30 jaren heeft bereikt.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel2.3
  - number: 2.3.3
    text: Op tegemoetkoming ingevolge afdeling 5.1 bestaat aanspraak ongeacht de leeftijd.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel2.3
  - number: 2.3.4
    text: |-
      Op tegemoetkoming ingevolge afdeling 5.2 kan aanspraak bestaan met ingang van de eerste dag van het kwartaal
      volgend op het kwartaal waarin de leerling de leeftijd van 18 jaren heeft bereikt.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel2.3
  - number: '2.4'
    text: |-
      Voor tegemoetkoming ingevolge [hoofdstuk 3][ref1] kan een aanvrager in aanmerking komen indien de scholier
      is ingeschreven aan een school die op grond van de [WVO][ref2], de [WEB][ref3], de [WEC][ref4] of de
      [Experimentenwet onderwijs][ref5] volledig en rechtstreeks uit de openbare kas wordt bekostigd, waaronder het
      volgen van onderwijs in de vorm van contractactiviteiten niet is mede begrepen.


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0002399
      [ref3]: https://wetten.overheid.nl/BWBR0007625
      [ref4]: https://wetten.overheid.nl/BWBR0007625
      [ref5]: https://wetten.overheid.nl/BWBR0002718
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel2.4
    references:
      - id: ref1
        bwb_id: BWBR0012438
        hoofdstuk: '3'
