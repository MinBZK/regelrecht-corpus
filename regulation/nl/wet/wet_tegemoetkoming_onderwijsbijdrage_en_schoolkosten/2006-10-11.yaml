      - id: ref4
        bwb_id: BWBR0007625
      - id: ref5
        bwb_id: BWBR0002718
  - number: '2.5'
    text: |-
      Voor tegemoetkoming ingevolge hoofdstuk 3 kan een aanvrager in aanmerking komen indien de scholier is ingeschreven
      aan een op grond van [artikel 56 van de WVO][ref1] aangewezen school.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel56
