$id: wet_tegemoetkoming_onderwijsbijdrage_en_schoolkosten
regulatory_layer: WET
publication_date: '2021-08-31'
valid_from: '2006-10-11'
bwb_id: BWBR0012438
url: https://wetten.overheid.nl/BWBR0012438/2006-10-11
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de Wet tegemoetkoming studiekosten te wijzigen als
    uitvloeisel van het regeerakkoord 1998 en van de nota «Meer voor meer»;

    dat het voorts wenselijk is de leesbaarheid van de Wet tegemoetkoming studiekosten te vergroten en aan te sluiten
    bij de terminologie van de Wet studiefinanciering 2000;

    dat het in verband met het grote aantal wijzigingen wenselijk is de Wet tegemoetkoming studiekosten in te trekken
    en te vervangen door een nieuwe wet;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#ArtikelAanhef
articles:
  - number: 1.1.1
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder: **beroepsonderwijs**: beroepsopleiding
      als bedoeld in [artikel 7.2.2 van de Wet educatie en beroepsonderwijs][ref1], voorzover het betreft de
      beroepsopleidende leerweg, **bovenbouw**: a. voor havo: het vierde en vijfde leerjaar, en de daarmee
      overeenkomende leerjaren opleiding vavo, b. voor vwo: het vierde, vijfde en zesde leerjaar, en de daarmee
      overeenkomende leerjaren opleiding vavo, of c. een- of tweejarige opleiding vavo die opleidt tot het diploma
      vwo of havo, **deelnemer**: degene die beroepsonderwijs volgt, **deelnemer vavo**: degene die vavo volgt
      als bedoeld in de [artikelen 2.6, tweede lid][ref2], en [2.10][ref3], **gecorrigeerde belastbare loon**:
      belastbare loon als bedoeld in [artikel 9 van de Wet op de loonbelasting 1964][ref4], verminderd met twee
      derde van het hoogste van de uit de toepassing van de volgende onderdelen voortvloeiende bedragen: a. bij
      dat loon uit tegenwoordige dienstbetrekking: 12% van dat loon, maar niet minder dan € 119,– en niet meer
      dan € 1 605,–, b. bij dat loon uit vroegere dienstbetrekking: € 487,–, **gecorrigeerde verzamelinkomen**:
      verzamelinkomen als bedoeld in [artikel 2.18 van de Wet inkomstenbelasting 2001][ref5] verminderd met: a.
      indien in het kalenderjaar waarover het verzamelinkomen wordt berekend, de zelfstandigenaftrek, bedoeld in
      [artikel 3.76 van de Wet inkomstenbelasting 2001][ref6], is toegepast: € 903,–, b. indien in het kalenderjaar
      waarover het verzamelinkomen wordt berekend, loon in de zin van de [Wet inkomstenbelasting 2001][ref7] wordt
      genoten: 'twee derde van het hoogste van de uit de toepassing van de volgende onderdelen voortvloeiende bedragen:'
      1º. bij dat loon uit tegenwoordige dienstbetrekking: 12% van dat loon, maar niet minder dan € 119,– en niet
      meer dan € 1 605,–, 2º. bij dat loon uit vroegere dienstbetrekking: € 487,–, **havo**: hoger algemeen voortgezet
      onderwijs als bedoeld in [artikel 8 van de WVO][ref8], **IB-Groep**: Informatie Beheer Groep, genoemd in
      de [Wet verzelfstandiging Informatiseringsbank][ref9], **leerling**: scholier, deelnemer of deelnemer vavo,
      **lening**: rentedragende lening die niet kan worden omgezet in een gift, **onderwijsbijdrage**: a. lesgeld
      als bedoeld in [artikel 5 van de Les- en cursusgeldwet][ref10], b. voor een niet uit 's Rijks kas bekostigde
      school de verschuldigde bijdrage aan de school, c. voor de toepassing van [afdeling 5.1][ref11], voorzover
      het een uit 's Rijks kas bekostigde school betreft: het bedrag, bedoeld in [artikel 5.3][ref12], of d. voor
      de toepassing van [afdeling 5.2][ref13], voorzover het een uit 's Rijks kas bekostigde school betreft: de
      bedragen, bedoeld in [artikel 5.10][ref14], **onderwijsnummer**: door de IB-Groep uitgegeven persoonsgebonden
      nummer, toegekend aan een persoon aan wie niet van overheidswege een sociaal-fiscaalnummer is verstrekt, **Onze
      Minister**: Onze Minister van Onderwijs, Cultuur en Wetenschap, **partner**: degene die in het kalenderjaar
      waarin het school- of studiejaar aanvangt gedurende meer dan 6 maanden partner als bedoeld in artikel 3 van
      de Algemene wet inkomensafhankelijke regelingen van de aanvrager is, met dien verstande dat voor de toepassing
      van [hoofdstuk 4][ref15] voor «belanghebbende» gelezen wordt: TOS-ouder, **peiljaar**: tweede jaar voorafgaand
      aan het jaar waarin het schooljaar of studiejaar aanvangt, **scholier**: degene die voortgezet onderwijs volgt,
      **school**: school of instelling in de zin van: a. [Wet op het voortgezet onderwijs][ref16], hierna aangeduid als
      [WVO][ref17], b. [Experimentenwet onderwijs][ref18], c. [Wet op de expertisecentra][ref19], hierna aangeduid als
      [WEC][ref20], d. [Wet op de erkende onderwijsinstellingen][ref21], e. [Wet educatie en beroepsonderwijs][ref22],
      hierna aangeduid als [WEB][ref23], of f. [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref24], hierna
      aangeduid als [WHW][ref25], **schooljaar**: tijdvak dat aanvangt op 1 augustus van enig kalenderjaar en eindigt
      op 31 juli daaropvolgend, **student**: degene die hoger onderwijs volgt als bedoeld in de [artikelen 2.11][ref26]
      en [2.12][ref27], **studiejaar**: tijdvak dat aanvangt op 1 september van enig kalenderjaar en eindigt op 31
      augustus daaropvolgend, **tegemoetkoming**: door de IB-Groep verstrekte toekenning in verband met het volgen
      van een opleiding in het onderwijs waarop uitsluitend op grond van deze wet aanspraak bestaat, **thuiswonende
      leerling**: scholier of deelnemer vavo die woont op het adres van de TOS-ouder of partner van de TOS-ouder,
      **TOS-ouder**: a. ouder die als wettelijke vertegenwoordiger laatstelijk voordat de leerling meerderjarig
      werd, voor hem een tegemoetkoming op grond van [hoofdstuk 3][ref28] ontving, of b. indien geen wettelijke
      vertegenwoordiger de in onderdeel a bedoelde tegemoetkoming ontving: wettelijke vertegenwoordiger in het
      laatste kwartaal waarin de leerling nog 17 jaar was, **uitwonende leerling**: scholier of deelnemer vavo die
      niet een thuiswonende leerling is, **vavo**: opleiding voortgezet algemeen volwassenenonderwijs als bedoeld in
      [artikel 7.3.1, eerste lid, onderdeel a, van de WEB][ref29], **voortgezet onderwijs**: onderwijs in de zin van
      de [WVO][ref30], en, tenzij anders is bepaald, speciaal onderwijs en voortgezet speciaal onderwijs als bedoeld in
      de [WEC][ref31], **vreemdeling**: hetgeen daaronder wordt verstaan in de [Vreemdelingenwet 2000][ref32], **vwo**:
      voorbereidend wetenschappelijk onderwijs als bedoeld in [artikel 7 van de WVO][ref33].


