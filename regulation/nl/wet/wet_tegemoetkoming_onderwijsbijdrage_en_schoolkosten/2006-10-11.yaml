        paragraaf: '2.2'
      - id: ref4
        bwb_id: BWBR0012438
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref5
        bwb_id: BWBR0012438
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref6
        bwb_id: BWBR0012438
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref7
        bwb_id: BWBR0012438
        hoofdstuk: '4'
      - id: ref8
        bwb_id: BWBR0004188
