  - number: 12.11.1
    text: |-
      Op besluiten met betrekking tot tegemoetkomingen voor het school- of studiejaar 2005–2006 zijn de bepalingen die
      golden voor de inwerkingtreding van de [Aanpassingswet Algemene wet inkomensafhankelijke regelingen][ref1] van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018471
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel12.11
    references:
      - id: ref1
        bwb_id: BWBR0018471
  - number: 12.11.2
    text: |-
      Op besluiten met betrekking tot tegemoetkomingen voor het
      school- of studiejaar 2006–2007 zijn de bepalingen, opgenomen in
      [hoofdstuk 1, afdeling C, artikel IV, van de Aanpassingswet Algemene wet inkomensafhankelijke regelingen][ref1]
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018471#ArtikelIV
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel12.11
    references:
      - id: ref1
        bwb_id: BWBR0018471
        artikel: IV
  - number: 12.11.3
    text: |-
      Op besluiten met betrekking tot tegemoetkomingen voor het
      school- of studiejaar 2007–2008 zijn de bepalingen, opgenomen in
      [hoofdstuk 1, afdeling C, artikel V, van de Aanpassingswet Algemene wet inkomensafhankelijke regelingen][ref1]
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018471#ArtikelV
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel12.11
    references:
      - id: ref1
        bwb_id: BWBR0018471
        artikel: V
  - number: 12.11.4
    text: |-
      Op besluiten met betrekking tot tegemoetkomingen voor het school-
      of studiejaar 2008–2009 en volgende zijn de bepalingen, opgenomen in
      [hoofdstuk 1, afdeling C, artikel VI, van de Aanpassingswet Algemene wet inkomensafhankelijke regelingen][ref1]
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018471#ArtikelVI
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel12.11
    references:
      - id: ref1
        bwb_id: BWBR0018471
        artikel: VI
  - number: 12.13.1
    text: |-
      Aanvragen op grond van de Wet tegemoetkoming studiekosten worden van rechtswege omgezet in een aanvraag op grond
      van deze wet.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel12.13
  - number: 12.13.2
    text: |-
      Tegemoetkoming die op grond van de Wet tegemoetkoming studiekosten is toegekend, wordt van rechtswege omgezet in
      tegemoetkoming op grond van deze wet.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel12.13
  - number: 12.13.3
    text: |-
      Verplichtingen die op grond van de Wet tegemoetkoming studiekosten bestaan, worden van rechtswege omgezet in
      verplichtingen op grond van deze wet.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel12.13
  - number: '12.14'
    text: |-
      Op bezwaar en beroep ingevolge de Wet tegemoetkoming studiekosten, ingesteld voor 1 augustus 2001, of tegen een
      besluit van voor deze datum ingesteld op of na deze datum, blijven de op 31 juli 2001 geldende voorschriften van
      toepassing.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel12.14
  - number: '14.1'
    text: De Wet tegemoetkoming studiekosten wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel14.1
  - number: '14.2'
    text: 'Deze wet treedt in werking op 1 augustus 2001, met uitzondering van:'
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel14.2
  - number: 14.2.a
    text: artikel 1.5 dat in werking treedt op een bij koninklijk besluit te bepalen tijdstip,
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel14.2
  - number: 14.2.b
    text: artikel 13.5 dat in werking treedt met ingang van 1 januari 2002, en
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel14.2
  - number: 14.2.c
    text: |-
      de artikelen 13.12 en 13.14, onderdelen A, G en I, die in werking treden met ingang van de dag na de datum van
      uitgifte van het Staatsblad waarin deze wet wordt geplaatst, en terugwerken tot en met 1 september 2000.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel14.2
  - number: '14.3'
    text: 'Deze wet wordt aangehaald als: Wet tegemoetkoming onderwijsbijdrage en schoolkosten.'
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel14.3
