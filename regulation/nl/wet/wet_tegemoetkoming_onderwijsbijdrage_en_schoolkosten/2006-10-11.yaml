      - id: ref9
        bwb_id: BWBR0012438
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 2.21.1
    text: |-
      De scholier of deelnemer vavo, bedoeld in [hoofdstuk 3][ref1], die tevens deelnemer is in het beroepsonderwijs,
      bedoeld in dat hoofdstuk, heeft slechts aanspraak op tegemoetkoming voor het volgen van dat beroepsonderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel2.21
    references:
      - id: ref1
        bwb_id: BWBR0012438
        hoofdstuk: '3'
  - number: 2.21.2
    text: |-
      De scholier, bedoeld in [hoofdstuk 4][ref1], die tevens aanspraak heeft op studiefinanciering in de zin van de
      [Wet studiefinanciering 2000][ref2], heeft geen aanspraak op tegemoetkoming.


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0011453
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel2.21
    references:
      - id: ref1
        bwb_id: BWBR0012438
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0011453
  - number: 2.21.3
    text: |-
      De deelnemer die tevens aanspraak heeft op studiefinanciering in de zin van de [Wet studiefinanciering 2000][ref1],
      heeft geen aanspraak op tegemoetkoming.


      [ref1]: https://wetten.overheid.nl/BWBR0011453
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel2.21
    references:
      - id: ref1
        bwb_id: BWBR0011453
  - number: 2.21.4
    text: |-
      De deelnemer vavo, bedoeld in [hoofdstuk 4][ref1], voor wie onderwijsbijdrage is verschuldigd en die tevens
      aanspraak heeft op studiefinanciering in de zin van de [Wet studiefinanciering 2000][ref2], heeft geen aanspraak
      op tegemoetkoming.


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0011453
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel2.21
    references:
      - id: ref1
        bwb_id: BWBR0012438
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0011453
  - number: '2.22'
    text: |-
      De leerling heeft geen aanspraak op tegemoetkoming in de zin van [hoofdstuk 4][ref1], indien hij
      geen aanspraak meer heeft op prestatiebeurs of tempobeurs in de zin van de [hoofdstukken 5][ref2] of
      [10 van de Wet studiefinanciering 2000][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Hoofdstuk5
      [ref3]: https://wetten.overheid.nl/BWBR0011453#Hoofdstuk10
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel2.22
    references:
      - id: ref1
        bwb_id: BWBR0012438
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0011453
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0011453
        hoofdstuk: '10'
  - number: 2.23.1
    text: |-
      De tegemoetkoming in de onderwijsbijdrage en in de schoolkosten is afhankelijk van de hoogte van het
      toetsingsinkomen.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel2.23
  - number: 2.23.2
    text: |-
      Volledige tegemoetkoming ingevolge de [hoofdstukken 3][ref1], [4][ref2] en [5][ref3] bestaat tot en met het
      grensbedrag van het toetsingsinkomen. Naar de maatstaf van het schooljaar of studiejaar 2004–2005 bedraagt het
      grensbedrag € 28 616,26.


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0012438#Hoofdstuk4
      [ref3]: https://wetten.overheid.nl/BWBR0012438#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel2.23
    references:
      - id: ref1
        bwb_id: BWBR0012438
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0012438
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0012438
        hoofdstuk: '5'
  - number: 2.23.3
    text: |-
      Indien het toe te kennen bedrag per aanvrager minder bedraagt dan  € 10,–, wordt de tegemoetkoming op nihil
      gesteld.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel2.23
  - number: 2.24.1
    text: 'Het toetsingsinkomen is de som van de gecorrigeerde verzamelinkomens in het peiljaar van:'
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel2.24
  - number: 2.24.1.a
    text: de aanvrager en diens partner voor hoofdstuk 3,
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel2.24
  - number: 2.24.1.b
    text: de TOS-ouder en diens partner voor hoofdstuk 4, en
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel2.24
  - number: 2.24.1.c
    text: de aanvrager en diens partner voor hoofdstuk 5.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel2.24
  - number: 2.24.2
    text: |-
      Voorzover degenen, bedoeld in het eerste lid, niet binnenlandse belastingplichtige zijn in de zin van de
      [Wet inkomstenbelasting 2001][ref1], geldt als maatstaf het gecorrigeerde verzamelinkomen voor het geval zij voor
      al hun inkomensbestanddelen binnenlandse belastingplichtige waren geweest.


      [ref1]: https://wetten.overheid.nl/BWBR0011353
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel2.24
    references:
      - id: ref1
        bwb_id: BWBR0011353
  - number: 2.24.3
    text: |-
      Indien een gedeelte van het inkomen van Nederlandse inkomstenbelasting is vrijgesteld ingevolge bepalingen van
      internationaal recht geldt als maatstaf het gecorrigeerde verzamelinkomen voor het geval zij geen vrijstelling
      hadden verkregen.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel2.24
  - number: 2.24.4
    text: |-
      Indien ingevolge [artikel 9.4 van de Wet inkomstenbelasting 2001][ref1] geen aanslag wordt vastgesteld, of een
      aanslag wordt vastgesteld waarbij verrekening van de loonbelasting achterwege blijft, treedt het gecorrigeerde
      belastbare loon in de plaats van het gecorrigeerde verzamelinkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel9
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel2.24
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '9'
  - number: 2.25.1
    text: |-
      De tegemoetkoming wordt verminderd met een ingevolge het derde lid en [artikel 2.27][ref1] berekende korting wegens
      overschrijding van het grensbedrag, bedoeld in [artikel 2.23, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0012438#Artikel2
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel2.25
    references:
      - id: ref1
        bwb_id: BWBR0012438
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.7'
      - id: ref2
        bwb_id: BWBR0012438
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.7'
  - number: 2.25.2
    text: |-
      De korting wordt niet toegepast op de basistoelage, bedoeld in [artikel 4.2, onderdeel a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Artikel4
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel2.25
    references:
      - id: ref1
        bwb_id: BWBR0012438
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 2.25.3
    text: |-
      De korting is 30% van het verschil tussen het toetsingsinkomen in het peiljaar en het grensbedrag, bedoeld in
      [artikel 2.23, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Artikel2
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel2.25
    references:
      - id: ref1
        bwb_id: BWBR0012438
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.7'
  - number: 2.25.4
    text: Het kortingsbedrag voor een kalendermaand is de korting, bedoeld in het derde lid, gedeeld door 12.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel2.25
  - number: 2.26.1
    text: |-
      In geval van korting op de tegemoetkoming is de verhouding tussen de gekorte tegemoetkoming in de onderwijsbijdrage
      en die in de schoolkosten overeenkomstig de verhouding tussen de normbedragen van deze tegemoetkomingen op 1
      augustus van het betreffende schooljaar. Deze verhouding wordt op 2 decimalen afgerond op het naastbij gelegen
      getal.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel2.26
  - number: 2.26.2
    text: |-
      Indien de toegekende gekorte tegemoetkoming, bedoeld in het eerste lid, niet meer is dan de aan de IB-Groep
      verschuldigde onderwijsbijdrage, vindt geen uitbetaling plaats. Deze tegemoetkoming wordt verrekend met die
      onderwijsbijdrage.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel2.26
  - number: 2.27.1
    text: |-
      Het kortingsbedrag, bedoeld in artikel 2.25, derde lid, wordt verdeeld over het aantal telkinderen. Onder telkind
      wordt verstaan iedere leerling voor wie, met inachtneming van het tweede en derde lid, voor het desbetreffende
      schooljaar aanspraak op tegemoetkoming bestaat ingevolge de hoofdstukken 3 of 4.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel2.27
  - number: 2.27.2
    text: |-
      Voor een aanvrager in de zin van hoofdstuk 3 is sprake van een telkind, indien de leerling het kind is van de
      aanvrager of van diens partner, voor wie de aanvrager of diens partner:
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel2.27
  - number: 2.27.2.a
    text: in de zin van hoofdstuk 3 de wettelijke vertegenwoordiger is, of
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel2.27
  - number: 2.27.2.b
    text: TOS-ouder is voor het telkind dat aanspraak heeft op tegemoetkoming in de zin van hoofdstuk 4.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel2.27
  - number: 2.27.3
    text: |-
      Voor een aanvrager in de zin van hoofdstuk 4 is sprake van een telkind, indien deze aanvrager een TOS-ouder heeft
      waarbij die TOS-ouder of diens partner:
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel2.27
  - number: 2.27.3.a
    text: tevens de TOS-ouder is van een andere leerling die aanspraak heeft op tegemoetkoming in de zin van hoofdstuk 4, of
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel2.27
  - number: 2.27.3.b
    text: aanvrager is in de zin van hoofdstuk 3.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel2.27
  - number: 2.28.1
    text: |-
      Op aanvraag van de aanvrager of diens partner of TOS-ouder of diens partner wordt bij toepassing van
      [artikel 2.24][ref1], indien sprake is van een terugval in inkomen over het eerste of het tweede jaar na
      het peiljaar, uitgegaan van dat jaar. Deze aanvraag wordt gelijktijdig gedaan met de aanvraag ingevolge de
      [artikelen 3.8][ref2], [5.5][ref3] of [5.11][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0012438#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0012438#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0012438#Artikel5
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel2.28
    references:
      - id: ref1
        bwb_id: BWBR0012438
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.7'
      - id: ref2
        bwb_id: BWBR0012438
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.3'
      - id: ref3
        bwb_id: BWBR0012438
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: 5.1.3
        afdeling: '5.1'
      - id: ref4
        bwb_id: BWBR0012438
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: 5.2.3
        afdeling: '5.2'
  - number: 2.28.2
    text: |-
      Voor de toepassing van het eerste lid wordt onder een terugval in inkomen verstaan een vermindering van het
      toetsingsinkomen met ten minste 15% ten opzichte van het peiljaar, met dien verstande dat:
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel2.28
  - number: 2.28.2.a
    text: |-
      de vermindering niet kan worden gerekend tot inkomensschommelingen die in het algemeen normaal kunnen worden geacht
      bij de gekozen wijze van inkomensverwerving, en
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel2.28
  - number: 2.28.2.b
    text: |-
      aannemelijk wordt gemaakt dat gedurende ten minste 3 kalenderjaren zal worden voldaan aan de vereisten genoemd in
      de aanhef alsmede in onderdeel a.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel2.28
  - number: '2.29'
    text: |-
      Voor de toepassing van de [artikelen 2.24][ref1] en [2.25][ref2] wordt zolang het gecorrigeerde verzamelinkomen
      over het kalenderjaar waarover het verzamelinkomen berekend wordt, het eerste of het tweede jaar na dat
      kalenderjaar nog niet is vastgesteld of het gecorrigeerde belastbare loon over het desbetreffende kalenderjaar nog
      niet bekend is, door de IB-Groep daarvoor in de plaats gesteld een bedrag dat het vast te stellen gecorrigeerde
      verzamelinkomen of het gecorrigeerde belastbare loon zo goed mogelijk benadert.


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0012438#Artikel2
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel2.29
    references:
      - id: ref1
        bwb_id: BWBR0012438
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.7'
      - id: ref2
        bwb_id: BWBR0012438
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.7'
  - number: '3.1'
    text: |-
      Dit hoofdstuk is van toepassing op scholieren, deelnemers en deelnemers vavo die jonger zijn dan 18 jaren en die
      zijn ingeschreven aan een school als bedoeld in paragraaf 2.2.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel3.1
  - number: 3.2.1
    text: De tegemoetkoming in de zin van dit hoofdstuk bestaat uit een tegemoetkoming in de schoolkosten.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel3.2
  - number: 3.2.2
    text: De tegemoetkoming kan tevens bestaan uit een overbruggingstegemoetkoming.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel3.2
  - number: 3.2.3
    text: |-
      Voor leerlingen als bedoeld in de [artikelen 2.5][ref1], [2.6, eerste lid][ref2], [2.6, tweede lid][ref3],
      wat betreft de inschrijving aan een school als bedoeld in [artikel 1.4a.1 van de WEB][ref4], en
      [2.7, onderdeel b][ref5], die voor de aanvang van het schooljaar de leeftijd van 16 jaren hebben bereikt, bestaat
      de tegemoetkoming eveneens uit een tegemoetkoming in de onderwijsbijdrage.


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0012438#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0012438#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref5]: https://wetten.overheid.nl/BWBR0012438#Artikel2
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0012438
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0012438
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref3
        bwb_id: BWBR0012438
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref4
        bwb_id: BWBR0007625
        artikel: '1'
      - id: ref5
        bwb_id: BWBR0012438
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 3.2.4
    text: |-
      Voor deelnemers, die na 1 juli en voor 2 augustus van een kalenderjaar de leeftijd van 18 jaren bereiken, bestaat
      de tegemoetkoming eveneens uit een tegemoetkoming in de onderwijsbijdrage voor het schooljaar dat op 1 augustus van
      dat kalenderjaar aanvangt.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel3.2
  - number: 3.3.1
    text: |-
      De tegemoetkoming in de onderwijsbijdrage voor een schooljaar is voor een leerling als bedoeld in
      [artikel 3.2, derde lid][ref1], het bedrag, bedoeld in [artikel 5, tweede lid, van de Les- en cursusgeldwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0004188#Artikel5
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0012438
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0004188
        artikel: '5'
  - number: 3.3.2
    text: |-
      De tegemoetkoming in de onderwijsbijdrage voor een schooljaar is voor een deelnemer als bedoeld in
      [artikel 3.2, vierde lid][ref1], het bedrag, bedoeld in [artikel 5, tweede lid, van de Les- en cursusgeldwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0004188#Artikel5
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0012438
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0004188
        artikel: '5'
  - number: 3.4.1
    text: 'De hoogte van de tegemoetkoming in de schoolkosten voor een schooljaar is afhankelijk van:'
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel3.4
  - number: 3.4.1.a
    text: soort onderwijs, en
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel3.4
  - number: 3.4.1.b
    text: bovenbouw of overige leerjaren.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel3.4
  - number: 3.4.2
    text: De bedragen van de onderscheiden tegemoetkomingen zijn opgenomen in artikel 3.5, eerste lid.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel3.4
  - number: 3.5.1
    text: |-
      De bedragen in onderstaand overzicht luiden per schooljaar en zijn uitgedrukt in euro's naar de maatstaf van 1
      augustus 2001.

              **Overzicht. Bedragen tegemoetkoming schoolkosten**







                    bovenbouw


                    € 572,67,–




                    beroepsonderwijs


                    € 845,39,–




                    speciaal onderwijs


                    nihil




                    voortgezet speciaal onderwijs


                    nihil




                    overig onderwijs


                    € 504,60,–
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel3.5
  - number: 3.5.2
    text: |-
      Onder overig onderwijs, genoemd in het overzicht in het eerste lid, valt tevens het voortgezet speciaal onderwijs
      aan kinderen met leer- en opvoedingsmoeilijkheden en moeilijk lerende kinderen.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel3.5
  - number: '3.6'
    text: |-
      In afwijking van [paragraaf 2.2][ref1] en [artikel 3.4][ref2] heeft de aanvrager aanspraak op een
      overbruggingstegemoetkoming voor de maanden augustus en september ten behoeve van een leerling:


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0012438#Artikel3
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel3.6
    references:
      - id: ref1
        bwb_id: BWBR0012438
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0012438
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 3.6.a
    text: die op 1 juli van dat kalenderjaar jonger is dan 18 jaren,
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel3.6
  - number: 3.6.b
    text: |-
      die op 1 oktober van dat kalenderjaar als studerende in de zin van de [Wet studiefinanciering 2000][ref1] is
      ingeschreven voor het volgen van hoger onderwijs waarop die wet van toepassing is, en


      [ref1]: https://wetten.overheid.nl/BWBR0011453
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel3.6
    references:
      - id: ref1
        bwb_id: BWBR0011453
  - number: 3.6.c
    text: |-
      voor wie aan de aanvrager over het schooljaar dat aan de overbruggingsperiode vooraf ging, een tegemoetkoming als
      bedoeld in [artikel 3.4][ref1] is toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Artikel3
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel3.6
    references:
      - id: ref1
        bwb_id: BWBR0012438
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 3.7.1
    text: |-
      De overbruggingstegemoetkoming is voor een leerling tweetwaalfde deel van het bedrag van de tegemoetkoming voor een
      geheel schooljaar waarvoor op 31 juli daaraan voorafgaand aanspraak bestond.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel3.7
  - number: 3.7.2
    text: |-
      Voor leerlingen, anders dan bedoeld in [artikel 3.2, derde lid][ref1], wordt de
      overbruggingstegemoetkoming vermeerderd met tweetwaalfde van het bedrag, bedoeld in
      [artikel 5, tweede lid, van de Les- en cursusgeldwet][ref2], zoals dat bedrag gold op 31 juli voorafgaand aan de
      maanden waarover aanspraak op overbruggingstegemoetkoming bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0004188#Artikel5
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel3.7
    references:
      - id: ref1
        bwb_id: BWBR0012438
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0004188
        artikel: '5'
  - number: 3.8.1
    text: |-
      De IB-Groep kent een tegemoetkoming toe aan de aanvrager indien de aanvrager en de leerling voldoen aan de
      voorschriften gegeven bij of krachtens deze wet.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel3.8
  - number: 3.8.2
    text: |-
      Een aanvraag om tegemoetkoming wordt jaarlijks voor het einde van het desbetreffende schooljaar gedaan. Toekenning
      voor een leerling vindt slechts eenmaal per schooljaar plaats.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel3.8
  - number: 3.8.3
    text: 'De IB-Groep besluit op een aanvraag om tegemoetkoming indien de aanvraag is ingediend:'
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel3.8
  - number: 3.8.3.a
    text: 'voor de aanvang van het desbetreffende schooljaar: binnen 8 weken na de aanvang van dat schooljaar, en'
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel3.8
  - number: 3.8.3.b
    text: 'gedurende het desbetreffende schooljaar: binnen 8 weken na de indiening van de aanvraag.'
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel3.8
  - number: 3.9.1
    text: |-
      Ingeval de leerling op 1 oktober niet langer het soort onderwijs volgt waarvoor hij bij de aanvang van het
      schooljaar was ingeschreven, en een andere onderwijssoort genoemd in [paragraaf 2.2][ref1] volgt, omvat de
      toekenning van de tegemoetkoming het bedrag voor de onderwijssoort die op die datum wordt gevolgd. De vorige volzin
      is van overeenkomstige toepassing bij overgang van onderbouw naar bovenbouw of omgekeerd.


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel3.9
    references:
      - id: ref1
        bwb_id: BWBR0012438
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 3.9.2
    text: |-
      Ingeval de tegemoetkoming voor een onderwijssoort nihil is en een scholier tijdens het schooljaar een andere
      onderwijssoort gaat volgen, omvat de toekenning van de tegemoetkoming, in afwijking van het eerste lid, vanaf het
      tijdstip dat hij die andere onderwijssoort gaat volgen, het bedrag daarvoor.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel3.9
  - number: 3.9.3
    text: |-
      Ingeval een leerling voor wie nog geen tegemoetkoming in de onderwijsbijdrage is toegekend, tijdens het schooljaar
      een andere onderwijssoort, genoemd in [artikel 3.2, derde lid][ref1], gaat volgen, omvat de toekenning vanaf het
      tijdstip dat hij die andere onderwijssoort gaat volgen, eveneens de met betrekking tot die andere onderwijssoort
      bepaalde tegemoetkoming in de onderwijsbijdrage.


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Artikel3
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel3.9
    references:
      - id: ref1
        bwb_id: BWBR0012438
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 3.10.1
    text: Tegemoetkoming wordt toegekend per schooljaar.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel3.10
  - number: 3.10.2
    text: 'In afwijking van het eerste lid omvat de toekenning voor een leerling die:'
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel3.10
  - number: 3.10.2.a
    text: |-
      in de loop van het schooljaar 18 jaren wordt: wat betreft de tegemoetkoming in de schoolkosten het aantal maanden
      van dat schooljaar tot de eerste maand van het kwartaal volgend op de maand waarin de leerling de leeftijd van
      18 jaren heeft bereikt en wat betreft de tegemoetkoming in de onderwijsbijdrage, voor zover daar op grond van
      [artikel 3.2, derde of vierde lid][ref1], aanspraak op bestaat, het gehele schooljaar,


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Artikel3
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel3.10
    references:
      - id: ref1
        bwb_id: BWBR0012438
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 3.10.2.b
    text: |-
      is ingeschreven op een school als bedoeld in de [artikelen 2.4][ref1], [2.6][ref2], of [2.7][ref3], en die geen
      onderwijs meer volgt op 1 oktober, in afwijking van [artikel 3.5, eerste lid][ref4]: voor het gehele jaar niets,


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0012438#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0012438#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0012438#Artikel3
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel3.10
    references:
      - id: ref1
        bwb_id: BWBR0012438
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0012438
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref3
        bwb_id: BWBR0012438
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref4
        bwb_id: BWBR0012438
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 3.10.2.c
    text: |-
      op enig ogenblik tussen 1 oktober en een bij ministeriële regeling te bepalen datum geen onderwijs meer
      volgt, anders dan in geval van ernstige ziekte van de leerling: de helft van de tegemoetkoming, bedoeld
      in [artikel 3.2, eerste lid][ref1], alsmede, voor zover aanspraak bestaat op de tegemoetkoming bedoeld in
      [artikel 3.2, derde of vierde lid][ref2], vijftwaalfde deel van die tegemoetkoming, en


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0012438#Artikel3
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel3.10
    references:
      - id: ref1
        bwb_id: BWBR0012438
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0012438
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 3.10.2.d
    text: |-
      in de loop van het schooljaar na 31 december wordt ingeschreven: de helft van de tegemoetkoming, bedoeld
      in [artikel 3.2, eerste lid][ref1], alsmede, voor zover aanspraak bestaat op de tegemoetkoming bedoeld in
      [artikel 3.2, derde of vierde lid][ref2], zeventwaalfde deel van die tegemoetkoming.


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0012438#Artikel3
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel3.10
    references:
      - id: ref1
        bwb_id: BWBR0012438
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0012438
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '4.1'
    text: |-
      Dit hoofdstuk is van toepassing op scholieren en deelnemers vavo die 18 jaren zijn of ouder en zijn ingeschreven
      aan een school als bedoeld in paragraaf 2.3.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel4.1
  - number: 4.2.1
    text: 'De tegemoetkoming in de zin van dit hoofdstuk bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel4.2
  - number: 4.2.1.a
    text: basistoelage, en
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel4.2
  - number: 4.2.1.b
    text: tegemoetkoming in de schoolkosten.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel4.2
  - number: 4.2.2
    text: |-
      Voor leerlingen als bedoeld in [artikel 2.9][ref1], voor zover zij zijn ingeschreven aan een niet uit ’s Rijks kas
      bekostigde school of voor een cursus als bedoeld in [artikel 2.8][ref2], en voor deelnemers vavo als bedoeld in
      [artikel 2.10][ref3] bestaat de tegemoetkoming eveneens uit een tegemoetkoming in de onderwijsbijdrage.


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0012438#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0012438#Artikel2
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0012438
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref2
        bwb_id: BWBR0012438
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref3
        bwb_id: BWBR0012438
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: '4.3'
    text: 'De basistoelage is naar de maatstaf van 1 januari 2001 per kalendermaand voor een:'
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel4.3
  - number: 4.3.a
    text: 'thuiswonende leerling:  € 84,59 , en'
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel4.3
  - number: 4.3.b
    text: 'uitwonende leerling:  € 197,21 .'
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel4.3
  - number: 4.4.1
    text: |-
      De tegemoetkoming in de onderwijsbijdrage voor een kalendermaand is eentwaalfde deel van het bedrag, bedoeld in
      [artikel 5, tweede lid, van de Les- en cursusgeldwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004188#Artikel5
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel4.4
    references:
      - id: ref1
        bwb_id: BWBR0004188
        artikel: '5'
  - number: 4.4.2
    text: |-
      In het schooljaar waarin een leerling de leeftijd van 18 jaren bereikt, wordt de tegemoetkoming in de
      onderwijsbijdrage voor dat schooljaar niet toegekend.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel4.4
  - number: 4.5.1
    text: 'De hoogte van de tegemoetkoming in de schoolkosten voor een schooljaar is afhankelijk van:'
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel4.5
  - number: 4.5.1.a
    text: soort onderwijs, en
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel4.5
  - number: 4.5.1.b
    text: bovenbouw of overige leerjaren.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel4.5
  - number: 4.5.2
    text: De bedragen van de onderscheiden tegemoetkomingen zijn opgenomen in artikel 4.6, eerste lid.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel4.5
  - number: 4.6.1
    text: |-
      De bedragen in onderstaand overzicht luiden per maand en zijn uitgedrukt in euro's naar de maatstaf van 1 augustus
      2001.

              **Overzicht. Bedragen tegemoetkoming schoolkosten**







                    bovenbouw


                    € 47,72




                    speciaal onderwijs


                    nihil




                    voortgezet speciaal onderwijs


                    nihil




                    overig onderwijs


                    € 42,05
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel4.6
  - number: 4.6.2
    text: |-
      [Artikel 3.5, tweede lid][ref1], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Artikel3
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel4.6
    references:
      - id: ref1
        bwb_id: BWBR0012438
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 4.7.1
    text: |-
      De tegemoetkoming in de onderwijsbijdrage over de maand augustus van enig kalenderjaar omvat in afwijking van
      artikel 4.4, eerste lid, tevens een voorschot op die tegemoetkoming over het schooljaar dat met die maand augustus
      aanvangt. Dit voorschot bedraagt ten hoogste de verschuldigde onderwijsbijdrage en wordt niet uitbetaald.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel4.7
  - number: 4.7.2
    text: |-
      Indien de tegemoetkoming in de onderwijsbijdrage lager is dan de verschuldigde onderwijsbijdrage, omvat het
      voorschot, bedoeld in het eerste lid, tevens een voorschot op de tegemoetkoming in de schoolkosten. Het voorschot
      bedraagt ten hoogste de verschuldigde onderwijsbijdrage.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel4.7
  - number: 4.8.1
    text: |-
      De IB-Groep kent een tegemoetkoming toe aan de leerling die daartoe een aanvraag heeft ingediend en die voldoet aan
      de voorschriften gegeven bij of krachtens deze wet.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel4.8
  - number: 4.8.2
    text: 'De IB-Groep besluit op een aanvraag om tegemoetkoming indien de aanvraag is ingediend:'
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel4.8
  - number: 4.8.2.a
    text: |-
      vóór 1 november van het jaar voorafgaand aan het kalenderjaar waarop de tegemoetkoming betrekking heeft: vóór 31
      december van dat voorafgaande jaar, en
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel4.8
  - number: 4.8.2.b
    text: 'na het onder a bedoelde tijdstip: binnen 8 weken na de indiening van de aanvraag.'
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel4.8
  - number: '4.9'
    text: |-
      Indien het op basis van de verstrekte gegevens onmogelijk is het toetsingsinkomen vast te stellen, kent de IB-Groep
      de basistoelage toe.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel4.9
  - number: 4.10.1
    text: |-
      Tegemoetkoming wordt toegekend per kalenderjaar of een gedeelte daarvan, met dien verstande dat deze periode ten
      minste 1 kalendermaand is.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel4.10
  - number: 4.10.2
    text: Tegemoetkoming wordt niet toegekend voor een periode die gelegen is voor de datum van indiening van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel4.10
  - number: 4.10.3
    text: |-
      Aan de leerling die reeds een tegemoetkoming ontvangt en een aanvraag heeft ingediend om in aanmerking te komen
      voor een verhoging van de basistoelage wordt, in afwijking van het tweede lid, de verhoging toegekend met ingang
      van de maand waarin de aanvraag tot verhoging is ingediend. Aan de leerling die reeds een tegemoetkoming ontvangt
      en een aanvraag heeft ingediend om in aanmerking te komen voor een tegemoetkoming in de onderwijsbijdrage of
      in de schoolkosten wordt, in afwijking van het tweede lid, de tegemoetkoming in de onderwijsbijdrage of in de
      schoolkosten toegekend met ingang van de maand waarvoor voor het eerst een tegemoetkoming is toegekend.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel4.10
  - number: '4.11'
    text: |-
      Op aanvraag van een uitwonende leerling wordt het niet toe te kennen deel van de maximale tegemoetkoming in de
      onderwijsbijdrage en in de schoolkosten toegekend in de vorm van lening. Voorwaarde voor die toekenning is dat de
      leerling gelijktijdig met de aanvraag aan de IB-Groep een door hemzelf ondertekende verklaring verstrekt dat zijn
      TOS-ouder en diens partner beide weigeren bij te dragen in zijn schoolkosten. Die verklaring wordt mede ondertekend
      door een schooldecaan ten blijke dat zij naar zijn kennis juist is.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel4.11
  - number: 4.12.1
    text: |-
      De tegemoetkoming van de leerling die is ingeschreven aan een school als bedoeld in de artikelen 2.9 of 2.10, en
      die zonder geldige reden niet aan het onderwijs heeft deelgenomen gedurende een aaneengesloten periode van ten
      minste 5 weken, bestaat geheel uit lening met ingang van de eerste dag van de maand volgend op de maand waarin
      de afwezigheid zonder geldige reden aanving. De periode van 5 weken wordt verlengd met de weken waarin vanwege
      vakantie geen onderwijs werd verzorgd.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel4.12
  - number: 4.12.2
    text: |-
      In afwijking van het eerste lid kan bij ministeriële regeling worden bepaald dat voor soorten van voortgezet
      onderwijs of voor soorten van vavo het eerste lid van overeenkomstige toepassing is, indien een leerling in een of
      meer vakken zonder geldige reden niet aan het onderwijs heeft deelgenomen.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel4.12
  - number: 4.12.3
    text: |-
      Onder afwezigheid met geldige reden wordt uitsluitend verstaan afwezigheid wegens ziekte van de leerling, welke
      ziekte uitsluitend kan worden aangetoond door middel van een gedagtekende verklaring van een arts, of afwezigheid
      wegens bijzondere familieomstandigheden.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel4.12
  - number: '4.13'
    text: |-
      Artikel 4.12 is niet van toepassing met ingang van de eerste dag van de maand volgend op de maand waarin de
      leerling weer aan het onderwijs is gaan deelnemen, voorzover de tegemoetkoming niet reeds mede op grond van
      artikel 4.11 de vorm van lening had. Voorwaarde voor de toepassing van de vorige volzin is dat de leerling aan het
      onderwijs is gaan deelnemen binnen 8 weken na de aanvang van de periode van 5 weken. De periodes van 5 en 8 weken
      worden verlengd met de weken waarin vanwege vakantie geen onderwijs werd verzorgd.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel4.13
  - number: 4.14.1
    text: |-
      Het bestuur van de rechtspersoon waarvan de school, bedoeld in de artikelen 2.9 of 2.10 en niet zijnde een school
      als bedoeld in artikel 2.4, uitgaat of de natuurlijke persoon die deze school in stand houdt, stelt uiterlijk
      op de derde werkdag na afloop van een periode van afwezigheid van 5 weken de leerling in kennis dat daarvan in
      de administratie van de school een aantekening is gemaakt en verzoekt de leerling om opgaaf van de reden van de
      afwezigheid.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel4.14
  - number: 4.14.2
    text: |-
      Uiterlijk op de vijfde werkdag na de periode van 8 weken stelt het bestuur van de rechtspersoon of de natuurlijke
      persoon vast:
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel4.14
  - number: 4.14.2.a
    text: |-
      of de reden die de leerling binnen 8 weken na de aanvang van de periode van 5 weken gaf voor zijn afwezigheid, een
      geldige is, of
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel4.14
  - number: 4.14.2.b
    text: |-
      dat de leerling binnen 8 weken na de aanvang van de periode van 5 weken geen reden heeft opgegeven voor zijn
      afwezigheid.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel4.14
  - number: 4.14.3
    text: |-
      Het bestuur van de rechtspersoon of de natuurlijke persoon stelt tevens uiterlijk op de vijfde werkdag na afloop
      van de periode van 8 weken vast of de leerling voor het einde van die periode weer aan het onderwijs is gaan
      deelnemen.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel4.14
  - number: 4.14.4
    text: |-
      Het bestuur van de rechtspersoon of de natuurlijke persoon meldt uiterlijk de vijfde werkdag na afloop van een
      periode van 8 weken aan de IB-Groep dat de leerling die gedurende een aaneengesloten periode van ten minste 5 weken
      zonder opgave van geldige reden niet aan het onderwijs heeft deelgenomen. Tevens meldt hij, indien die leerling
      voor het einde van die periode van 8 weken weer aan het onderwijs is gaan deelnemen, de datum daarvan.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel4.14
  - number: 4.14.5
    text: De periodes van 5 en 8 weken worden verlengd met de weken waarin vanwege vakantie geen onderwijs werd verzorgd.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel4.14
  - number: 4.14.6
    text: |-
      Het bestuur van de rechtspersoon of de natuurlijke persoon stuurt gelijktijdig met de mededelingen, bedoeld in
      het vierde lid, een afschrift van de gegevens die over de betrokkene aan de IB-Groep zijn verstrekt, aan deze
      betrokkene en geeft daarbij tevens aan dat afwezigheid als bedoeld in artikel 4.12, gevolgen heeft voor de
      tegemoetkoming van betrokkene, alsmede welke beroepsgang voor betrokkene open staat tegen de mededelingen, bedoeld
      in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel4.14
  - number: '5.1'
    text: |-
      Deze afdeling is van toepassing op studenten die als student zijn ingeschreven aan een school als bedoeld in
      artikel 2.11 of op degenen die onder de reikwijdte van artikel 2.12 vallen en die geen aanspraak hebben op
      studiefinanciering ingevolge de [Wet studiefinanciering 2000][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011453
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel5.1
    references:
      - id: ref1
        bwb_id: BWBR0011453
  - number: '5.2'
    text: 'De tegemoetkoming in de zin van deze afdeling bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel5.2
  - number: 5.2.a
    text: tegemoetkoming in de onderwijsbijdrage, en
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel5.2
  - number: 5.2.b
    text: tegemoetkoming in de schoolkosten.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel5.2
  - number: '5.3'
    text: |-
      De tegemoetkoming in de onderwijsbijdrage bedraagt het bedrag, genoemd in [artikel 7.44 van de WHW][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel5.3
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
  - number: '5.4'
    text: |-
      De tegemoetkoming in de schoolkosten bedraagt 12 maal het normbedrag voor boeken en leermiddelen voor het hoger
      onderwijs, bedoeld in [artikel 3.18 van de Wet studiefinanciering 2000][ref1], zoals dat geldt op de eerste dag van
      het school- of studiejaar.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel3
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel5.4
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '3'
  - number: 5.5.1
    text: |-
      De IB-Groep kent een tegemoetkoming toe aan de student die daartoe een aanvraag heeft ingediend en die voldoet aan
      de voorschriften gegeven bij of krachtens deze wet.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel5.5
  - number: 5.5.2
    text: Een aanvraag om tegemoetkoming wordt jaarlijks voor het einde van het desbetreffende studiejaar gedaan.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel5.5
  - number: 5.5.3
    text: 'De IB-Groep besluit op een aanvraag om tegemoetkoming indien de aanvraag is ingediend:'
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel5.5
  - number: 5.5.3.a
    text: 'voor de aanvang van het desbetreffende studiejaar: binnen 8 weken na de aanvang van dat studiejaar, en'
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel5.5
  - number: 5.5.3.b
    text: 'gedurende het desbetreffende studiejaar: binnen 8 weken na de indiening van de aanvraag.'
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel5.5
  - number: 5.6.1
    text: |-
      Tegemoetkoming wordt toegekend per studiejaar en eenmaal per studiejaar uitbetaald op een bij ministeriële regeling
      te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel5.6
  - number: 5.6.2
    text: Tegemoetkoming wordt niet toegekend over de maanden waarin de student niet is ingeschreven.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel5.6
  - number: '5.7'
    text: |-
      Deze afdeling is van toepassing op leerlingen die zijn ingeschreven aan een opleiding als bedoeld in artikel
      2.13 en die geen aanspraak hebben op tegemoetkoming ingevolge de hoofdstukken 3, 4 of 10 of op studiefinanciering
      ingevolge de [Wet studiefinanciering 2000][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011453
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel5.7
    references:
      - id: ref1
        bwb_id: BWBR0011453
  - number: '5.8'
    text: 'De tegemoetkoming in de zin van deze afdeling bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel5.8
  - number: 5.8.a
    text: tegemoetkoming in de onderwijsbijdrage, en
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel5.8
  - number: 5.8.b
    text: tegemoetkoming in de schoolkosten.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel5.8
  - number: 5.9.1
    text: |-
      De hoogte van de tegemoetkoming is afhankelijk van de periode waarin en van het aantal minuten per week dat
      de leerling onderwijs volgt. De hoogte van de tegemoetkoming in de onderwijsbijdrage en in de schoolkosten is
      opgenomen in [artikel 5.10][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Artikel5
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel5.9
    references:
      - id: ref1
        bwb_id: BWBR0012438
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: 5.2.2
        afdeling: '5.2'
  - number: 5.9.2
    text: |-
      Indien de leerling zijn studie na 30 september wegens ziekte staakt, wordt de tegemoetkoming in de schoolkosten in
      afwijking van de overzichten 1 en 2, bedoeld in [artikel 5.10][ref1] niet verminderd.


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Artikel5
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel5.9
    references:
      - id: ref1
        bwb_id: BWBR0012438
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: 5.2.2
        afdeling: '5.2'
