  - number: 1.1.2
    text: |-
      In onderdeel b van de begripsbepaling «TOS-ouder» wordt, indien 2 natuurlijke personen voldoen aan het begrip
      wettelijke vertegenwoordiger, daaronder verstaan:
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel1.1
  - number: 1.1.2.a
    text: |-
      wettelijke vertegenwoordiger die over het tweede kwartaal van het jaar waarin het schooljaar aanvangt, ten behoeve
      van de leerling kinderbijslag als bedoeld in de [Algemene Kinderbijslagwet][ref1] heeft ontvangen,


      [ref1]: https://wetten.overheid.nl/BWBR0002368
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel1.1
    references:
      - id: ref1
        bwb_id: BWBR0002368
  - number: 1.1.2.b
    text: |-
      indien onderdeel a niet van toepassing is: wettelijke vertegenwoordiger bij wie de leerling op 1 augustus blijkens
      de gemeentelijke basisadministratie persoonsgegevens woont, of
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel1.1
  - number: 1.1.2.c
    text: |-
      indien de onderdelen a en b niet van toepassing zijn: wettelijke vertegenwoordiger die de wettelijke
      vertegenwoordigers gezamenlijk daartoe hebben aangewezen.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel1.1
  - number: 1.1.3
    text: 'Met loon uit tegenwoordige dienstbetrekking wordt gelijkgesteld:'
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel1.1
  - number: 1.1.3.a
    text: |-
      loon genoten wegens tijdelijke arbeidsongeschiktheid, anders dan ingevolge de
      [Wet werk en inkomen naar arbeidsvermogen][ref1], de [Wet op de arbeidsongeschiktheidsverzekering][ref2], de
      [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref3] behoudens uitkeringen in verband met bevalling, en de
      [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref4], en


      [ref1]: https://wetten.overheid.nl/BWBR0019057
      [ref2]: https://wetten.overheid.nl/BWBR0002524
      [ref3]: https://wetten.overheid.nl/BWBR0008656
      [ref4]: https://wetten.overheid.nl/BWBR0008657
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel1.1
    references:
      - id: ref1
        bwb_id: BWBR0019057
      - id: ref2
        bwb_id: BWBR0002524
      - id: ref3
        bwb_id: BWBR0008656
      - id: ref4
        bwb_id: BWBR0008657
  - number: 1.1.3.b
    text: |-
      loon in de vorm van uitkeringen ingevolge de Wet financiering loopbaanonderbreking en aanvullingen daarop door
      degene tot wie de belastingplichtige in dienstbetrekking staat.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel1.1
  - number: '1.2'
    text: |-
      Voor de toepassing van het bepaalde bij of krachtens deze wet is bepalend de toestand op de eerste dag van de
      maand, tenzij anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel1.2
  - number: 1.3.1
    text: 'Een aanvraag kan worden gedaan:'
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel1.3
  - number: 1.3.1.a
    text: 'in de zin van hoofdstuk 3 door een:'
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel1.3
  - number: 1.3.1.a.1°
    text: natuurlijke persoon die de wettelijke vertegenwoordiger is van de minderjarige leerling,
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel1.3
  - number: 1.3.1.a.2°
    text: minderjarige leerling zonder wettelijke vertegenwoordiger, of
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel1.3
  - number: 1.3.1.a.3°
    text: gehuwde leerling die de leeftijd van 18 jaren nog niet heeft bereikt, en
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel1.3
  - number: 1.3.1.b
    text: in de zin van de overige hoofdstukken door een leerling of student.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel1.3
  - number: 1.3.2
    text: Artikel 1.1, tweede lid, is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel1.3
  - number: 1.3.3
    text: |-
      Aan welke voorwaarden een aanvraag moet voldoen, kan bij ministeriële regeling worden bepaald. In ieder geval wordt
      daarbij bepaald dat de aanvrager in de zin van de hoofdstukken 3 en 5 en zijn partner alsmede de TOS-ouder en zijn
      partner hun sociaal-fiscaalnummer of onderwijsnummer verstrekken.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel1.3
  - number: 1.5.1
    text: |-
      Indien bij controle door de IB-Groep blijkt dat het door de scholier verstrekte adres afwijkt van het adres waarop
      hij in de gemeentelijke basisadministratie persoonsgegevens staat ingeschreven, maakt de IB-Groep dit aan hem
      bekend en stelt hem in de gelegenheid de afwijking te herstellen.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel1.5
  - number: 1.5.2
    text: |-
      Indien een uitwonende scholier de afwijking niet binnen 4 weken na de bekendmaking herstelt, wordt met ingang van
      de maand waarin de afwijking is ontstaan, de aan hem toegekende basistoelage omgezet in een basistoelage voor een
      thuiswonende scholier, tenzij hem van de afwijking redelijkerwijs geen verwijt kan worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel1.5
  - number: 1.5.3
    text: |-
      Indien een uitwonende scholier de afwijking na de termijn van 4 weken alsnog herstelt, wordt met ingang van de
      maand daaropvolgend de basistoelage voor een thuiswonende scholier omgezet in een basistoelage voor een uitwonende
      scholier.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel1.5
  - number: '1.6'
    text: |-
      De inspecteur, onder wie de aanvrager, partner van de aanvrager, TOS-ouder of partner van de TOS-ouder krachtens
      [artikel 3, tweede lid, van de Algemene wet inzake rijksbelastingen][ref1] ressorteert voor de heffing van de
      inkomstenbelasting, bepaalt op verzoek van de IB-Groep het gecorrigeerde verzamelinkomen of het gecorrigeerde
      belastbare loon van de desbetreffende aanvrager, partner van de aanvrager, TOS-ouder of partner van de TOS-ouder.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel3
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel1.6
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '3'
  - number: 1.7.1
    text: |-
      De IB-Groep gebruikt het sociaal-fiscaalnummer of onderwijsnummer van een leerling, student of debiteur ter zake
      van de uitvoering van deze wet slechts:
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel1.7
  - number: 1.7.1.a
    text: in contacten met die leerling, student of debiteur,
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel1.7
  - number: 1.7.1.b
    text: |-
      in contacten met personen en instanties voorzover deze zelf gemachtigd zijn tot het opnemen van het sociaal-
      fiscaalnummer of onderwijsnummer in een persoonsregistratie, en
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel1.7
  - number: 1.7.1.c
    text: |-
      teneinde de gegevens van die leerling, student of debiteur te vergelijken met de
      gegevens die over hem zijn opgenomen in het basisregister onderwijs, bedoeld in
      [artikel 9a van de Wet verzelfstandiging Informatiseringsbank][ref1], voorzover dat noodzakelijk is voor de
      uitvoering van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0006320#Artikel9a
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel1.7
    references:
      - id: ref1
        bwb_id: BWBR0006320
        artikel: 9a
  - number: 1.7.2
    text: |-
      Het sociaal-fiscaalnummer of onderwijsnummer van de partner van een leerling, student of debiteur of van de TOS-
      ouder of diens partner kan ter zake van de uitvoering van deze wet slechts worden gebruikt in contacten met die
      partner of TOS-ouder of met de desbetreffende leerling, student of debiteur, alsmede, voorzover het betreft de
      controle op de rechtmatigheid, in contacten met personen en instanties voorzover deze zelf gemachtigd zijn tot het
      opnemen van het sociaal-fiscaalnummer of onderwijsnummer in een persoonsregistratie.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel1.7
  - number: '1.8'
    text: |-
      Op deze wet, met uitzondering van [hoofdstuk 10][ref1], zijn van toepassing van de
      [Algemene wet inkomensafhankelijke regelingen][ref2]:


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Hoofdstuk10
      [ref2]: https://wetten.overheid.nl/BWBR0018472
