  - number: 7.1.2.h
    text: |-
      de situatie van langdurige afwezigheid, bedoeld in [artikel 4.12, eerste lid][ref1], zich niet heeft voorgedaan, of


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Artikel4
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel7.1
    references:
      - id: ref1
        bwb_id: BWBR0012438
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.4'
  - number: 7.1.2.i
    text: |-
      andere, nader gebleken feiten of omstandigheden, die, waren zij eerder bekend geweest, tot een andere beschikking
      zouden hebben geleid.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel7.1
  - number: 7.1.3
    text: |-
      Behoudens in geval van bedrog, kan een herziening als bedoeld in het tweede lid, onderdelen c, e, h en i, slechts
      geschieden binnen 18 maanden na het einde van het desbetreffende tijdvak waar de toekenning van de tegemoetkoming
      betrekking op heeft.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel7.1
  - number: 7.1.4
    text: |-
      Behoudens in geval van bedrog, kan een herziening als bedoeld in het tweede lid, onderdeel d, slechts geschieden
      binnen 3 jaren na het einde van het desbetreffende tijdvak waar de toekenning van de tegemoetkoming betrekking
      op heeft.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel7.1
  - number: 7.1.5
    text: |-
      Behoudens in geval van bedrog, kan een herziening als bedoeld in het tweede lid, onderdelen a, b, f en g, slechts
      geschieden binnen 5 jaren na het einde van het desbetreffende tijdvak waar de toekenning van de tegemoetkoming
      betrekking op heeft.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel7.1
  - number: '7.2'
    text: |-
      De [artikelen 7:2 tot en met 7:9 van de Algemene wet bestuursrecht][ref1] zijn niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel7.2
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: 7.3.1
    text: |-
      Indien een herzieningsbeschikking als bedoeld in [artikel 7.1, eerste en tweede lid][ref1], of een beslissing
      op bezwaar daartoe aanleiding geeft, wordt het bedrag van de tegemoetkoming dat teveel is uitbetaald, door de
      aanvrager terugbetaald of met hem verrekend.


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Artikel7
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel7.3
    references:
      - id: ref1
        bwb_id: BWBR0012438
        artikel: '7'
        hoofdstuk: '7'
  - number: 7.3.2
    text: |-
      Indien een herzieningsbeschikking als bedoeld in [artikel 7.1, eerste en tweede lid][ref1], of een beslissing op
      bezwaar daartoe aanleiding geeft, wordt voorzover het bedrag waarvoor het recht om een lening af te sluiten te hoog
      is toegekend, het deel dat te hoog is toegekend en uitbetaald door de betrokkene terugbetaald of met hem verrekend.


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Artikel7
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel7.3
    references:
      - id: ref1
        bwb_id: BWBR0012438
        artikel: '7'
        hoofdstuk: '7'
  - number: 7.3.3
    text: |-
      Indien na een voorlopige voorziening als bedoeld in [titel 8.3 van de Algemene wet bestuursrecht][ref1], de
      beslissing in hoofdzaak daartoe aanleiding geeft, wordt het bedrag dat op grond van de voorlopige voorziening
      teveel is uitbetaald, door de betrokkene terugbetaald of met hem verrekend.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel7.3
    references:
      - id: ref1
        bwb_id: BWBR0005537
  - number: 7.3.4
    text: |-
      De in het eerste tot en met derde lid bedoelde terugbetaling en verrekening geschieden overeenkomstig bij
      ministeriële regeling vast te stellen redelijke terugbetalingsregels.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel7.3
  - number: 8.1.1
    text: |-
      Met betrekking tot de uitbetaling van de tegemoetkoming en de verrekening van het toegekende bedrag aan
      tegemoetkoming met de aan de IB-Groep verschuldigde onderwijsbijdrage, worden bij ministeriële regeling regels
      gesteld.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel8.1
  - number: 8.1.2
    text: |-
      Indien een toegekend bedrag aan tegemoetkoming 12 maanden na het einde van het kalenderjaar waarin de
      desbetreffende beschikking is gegeven, niet kan worden uitbetaald als gevolg van nalatigheid van degene aan wie die
      beschikking is gericht, wordt het toegekende bedrag aan tegemoetkoming verlaagd met het niet uitbetaalde bedrag.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel8.1
  - number: 8.1.3
    text: |-
      Indien een leerling in de loop van een schooljaar ophoudt leerling te zijn in de zin van hoofdstuk 4 en hij niet in
      de loop van datzelfde schooljaar leerling wordt aan een school waarvoor lesgeld verschuldigd is, wordt het restant
      van de in het eerste lid bedoelde tegemoetkoming in de onderwijsbijdrage niet teruggevorderd of verrekend.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel8.1
  - number: 8.2.1
    text: |-
      Is een bij of krachtens deze wet verschuldigd bedrag voor het geheel of een deel niet tijdig voldaan, dan maant de
      IB-Groep de nalatige bij brief aan om alsnog binnen 2 weken na ontvangst van die brief het daarin vermelde bedrag
      aan hem te doen toekomen. Volgt op deze aanmaning de betaling binnen de gestelde termijn niet, dan vaardigt de IB-
      Groep een dwangbevel uit. Het dwangbevel levert een executoriale titel op, die met toepassing van de voorschriften
      van het [Wetboek van Burgerlijke Rechtsvordering][ref1] in het land kan worden tenuitvoergelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel8.2
    references:
      - id: ref1
        bwb_id: BWBR0001827
  - number: 8.2.2
    text: |-
      Bij de toepassing van het eerste lid worden naast de achterstallige schuld eveneens het bedrag van de gerechtelijke
      of buitengerechtelijke kosten en de wettelijke rente ingevorderd.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel8.2
  - number: 8.2.3
    text: |-
      Binnen 4 weken na de betekening staat verzet tegen het dwangbevel, bedoeld in het eerste lid, open door dagvaarding
      van de IB-Groep, gevestigd te Groningen. Het verzet stuit de aanvang of de voortzetting van de tenuitvoerlegging
      niet, behoudens de bevoegdheid van de geëxecuteerde die het verzet heeft gedaan, om hieromtrent een voorziening bij
      voorraad uit te lokken.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel8.2
  - number: '9.1'
    text: |-
      Het toezicht door de inspectie, bedoeld in de [Wet op het onderwijstoezicht][ref1], heeft mede betrekking op de
      vraag of de school of de opleiding voldoet aan de van toepassing zijnde voorwaarden, bedoeld in de artikelen 2.17,
      2.18 en 4.14, derde tot en met zesde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0013800
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel9.1
    references:
      - id: ref1
        bwb_id: BWBR0013800
  - number: 9.2.1
    text: |-
      Een ieder is verplicht aan de IB-Groep of aan een daartoe door of vanwege de IB-Groep aangewezen persoon of
      instantie desgevraagd de ten behoeve van de uitvoering van deze wet benodigde inlichtingen over zichzelf te geven.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel9.2
  - number: 9.2.2
    text: |-
      De inlichtingen worden verstrekt binnen een door de IB-Groep of door een in het eerste lid bedoelde persoon of
      instantie te stellen redelijke termijn.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel9.2
  - number: 9.2.3
    text: |-
      Inlichtingen over zichzelf, voorzover zij kunnen leiden tot de toekenning van minder tegemoetkoming worden steeds
      ongevraagd en schriftelijk verstrekt door de aanvrager, onmiddellijk na het bekend worden van die gegevens.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel9.2
  - number: 9.2.4
    text: |-
      Onze Minister kan bepalen dat de inlichtingen, bedoeld in het eerste tot en met het derde lid, worden verstrekt op
      een bij ministeriële regeling vast te stellen wijze.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel9.2
  - number: '9.3'
    text: |-
      Een studentendecaan aan een op grond van de [WHW][ref1] uit 's Rijks kas bekostigde instelling voor hoger onderwijs
      kan zich, in afwijking van [artikel 5:17 van de Algemene wet bestuursrecht][ref2] bij de verplichting tot inzage
      van gegevens en bescheiden en het verstrekken van inlichtingen, verschonen betreffende hetgeen een leerling of
      student aan hem heeft toevertrouwd.


      [ref1]: https://wetten.overheid.nl/BWBR0005682
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel9.3
    references:
      - id: ref1
        bwb_id: BWBR0005682
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 9.4.1
    text: |-
      De natuurlijke persoon van wie of het bestuur van de rechtspersoon waarvan een school als bedoeld in de paragrafen
      2.2, 2.3 en 2.4 uitgaat, is verplicht op een bij ministeriële regeling aan te geven wijze kosteloos inlichtingen te
      verstrekken, benodigd voor de uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel9.4
  - number: 9.4.2
    text: |-
      De natuurlijke persoon van wie of het bestuur van de rechtspersoon waarvan een school als bedoeld in artikel
      2.7 uitgaat, is verplicht voor 1 mei aan de IB-Groep te melden welke opleidingstrajecten als bedoeld in
      [artikel 7.4.8, eerste lid, onderdeel f, van de WEB][ref1], in het eerstvolgende schooljaar door de school worden
      verzorgd.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel9.4
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
  - number: 9.4.3
    text: |-
      De natuurlijke persoon van wie of het bestuur van de rechtspersoon waarvan een school als bedoeld in de artikelen
      2.4 tot en met 2.10 uitgaat, is verplicht voor 1 mei aan Onze Minister te melden indien onderwijs dat in dat
      schooljaar voldeed aan de voorwaarden, genoemd in artikel 2.18, in het daaropvolgende schooljaar niet aan deze
      voorwaarde zal voldoen.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel9.4
  - number: '9.5'
    text: |-
      Organen met een publiekrechtelijke taak zijn verplicht op een bij algemene maatregel van bestuur aan te geven wijze
      kosteloos inlichtingen te verstrekken, benodigd voor de uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel9.5
  - number: '9.6'
    text: |-
      De inspecteur, bedoeld in [artikel 1.6][ref1], verstrekt de gegevens inzake het gecorrigeerde verzamelinkomen
      of het gecorrigeerde belastbare loon aan de IB-Groep volgens bij of krachtens algemene maatregel van bestuur te
      stellen regels.


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Artikel1
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel9.6
    references:
      - id: ref1
        bwb_id: BWBR0012438
        artikel: '1'
        hoofdstuk: '1'
  - number: '9.7'
    text: |-
      Indien een niet volledig en rechtstreeks uit de openbare kas bekostigde school als bedoeld in de
      [artikelen 2.5][ref1], [2.6, eerste lid][ref2], [2.8][ref3] en [2.9][ref4], op enig moment in een schooljaar
      niet een administratie als bedoeld in [artikel 4.14, eerste lid][ref5], voert of niet na afloop van de in
      [artikel 4.14][ref6] bedoelde periodes van onafgebroken afwezigheid zonder geldige reden van een leerling als
      bedoeld in [hoofdstuk 4][ref7] aan de IB-Groep de vereiste gegevens verstrekt, ontstaat er een vordering van de
      IB-Groep op de school ter grootte van 15% van het bedrag van de tegemoetkomingen, bedoeld in [artikel 4.2][ref8],
      voorzover die als gift zijn toegekend aan de leerlingen aan die school in het schooljaar waarin deze school in
      gebreke was, is toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0012438#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0012438#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0012438#Artikel2
      [ref5]: https://wetten.overheid.nl/BWBR0012438#Artikel4
      [ref6]: https://wetten.overheid.nl/BWBR0012438#Artikel4
      [ref7]: https://wetten.overheid.nl/BWBR0012438#Hoofdstuk4
      [ref8]: https://wetten.overheid.nl/BWBR0012438#Artikel4
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel9.7
    references:
      - id: ref1
        bwb_id: BWBR0012438
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0012438
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref3
        bwb_id: BWBR0012438
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref4
        bwb_id: BWBR0012438
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref5
        bwb_id: BWBR0012438
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.4'
      - id: ref6
        bwb_id: BWBR0012438
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.4'
      - id: ref7
        bwb_id: BWBR0012438
        hoofdstuk: '4'
      - id: ref8
        bwb_id: BWBR0012438
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 9.8.1
    text: |-
      Indien een school als bedoeld in de artikelen 2.4 tot en met 2.10, niet uiterlijk 1 mei de gegevens, bedoeld in
      artikel 9.4, derde lid, heeft verstrekt, ontstaat er een vordering van de IB-Groep op de school ter grootte van
      de tegemoetkomingen op grond van de hoofdstukken 3 en 4 die ten behoeve van leerlingen aan die opleiding in het
      schooljaar waarin deze in gebreke was, is toegekend.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel9.8
  - number: 9.8.2
    text: |-
      Indien een school als bedoeld in artikel 2.7, ten onrechte op grond van
      [artikel 7.4.8, eerste lid, onderdeel f, van de WEB][ref1] heeft vastgesteld dat een opleidingstraject voldoet
      aan hoofdstuk 3 of ten onrechte aan de IB-Groep de melding, bedoeld in artikel 9.4, tweede lid, heeft gedaan,
      ontstaat er een vordering van de IB-Groep op de school ter grootte van het bedrag van de tegemoetkomingen dat ten
      behoeve van de deelnemers aan dat opleidingstraject in de studiejaren waarop de vaststelling betrekking heeft,
      is toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel9.8
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
  - number: '9.9'
    text: |-
      Hij die niet voldoet aan een van de verplichtingen, bedoeld in [artikel 9.4][ref1], wordt gestraft met hechtenis
      van ten hoogste 6 maanden of geldboete van de derde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Artikel9
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel9.9
    references:
      - id: ref1
        bwb_id: BWBR0012438
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '9.2'
  - number: '9.10'
    text: |-
      Overtreding van bepalingen van een krachtens deze wet uitgevaardigde algemene maatregel van bestuur, voorzover
      uitdrukkelijk als strafbaar feit in de zin van dit artikel aangeduid, wordt gestraft met hechtenis van ten hoogste
      1 maand of geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel9.10
  - number: '9.11'
    text: De in de artikelen 9.9 en 9.10 strafbaar gestelde feiten zijn overtredingen.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel9.11
  - number: 10.1.1
    text: |-
      Dit hoofdstuk is uitsluitend van toepassing op leerlingen en studenten die op 31 juli 2001 tegemoetkoming ontvingen
      op grond van hoofdstuk IV van de Wet tegemoetkoming studiekosten.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel10.1
  - number: 10.1.2
    text: |-
      In dit hoofdstuk wordt verstaan onder: **leerling:** degene die onderwijs volgt als bedoeld in artikel 10.2,
      **student:** degene die hoger onderwijs volgt als bedoeld in artikel 10.3, en **tegemoetkoming:** tegemoetkoming in
      de onderwijsbijdrage en in de schoolkosten.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel10.1
  - number: 10.1.3
    text: De artikelen 2.1, 2.2, eerste, derde en vierde lid, en 2.3, derde lid, zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel10.1
  - number: '10.2'
    text: |-
      Voor tegemoetkoming kan een leerling in aanmerking komen die is ingeschreven voor een opleiding of een gedeelte
      daarvan aan een school als bedoeld in de artikelen 2.4, 2.5, 2.6 en 2.8, die leidt tot het diploma:
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel10.2
  - number: 10.2.a
    text: voorbereidend wetenschappelijk onderwijs,
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel10.2
  - number: 10.2.b
    text: hoger algemeen voortgezet onderwijs, of
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel10.2
  - number: 10.2.c
    text: middelbaar algemeen voortgezet onderwijs.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel10.2
  - number: '10.3'
    text: |-
      Voor tegemoetkoming kan een student in aanmerking komen die als student is ingeschreven aan een instelling als
      bedoeld in [artikel 2.11][ref1] voor een lerarenopleiding in vakken waarin een tekort aan leraren bestaat. Het
      betreft de vakken die bij ministeriële regeling op grond van hoofdstuk IV van de Wet tegemoetkoming studiekosten op
      31 juli 2001 zijn aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Artikel2
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel10.3
    references:
      - id: ref1
        bwb_id: BWBR0012438
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: 10.4.1
    text: |-
      Een aanvrager heeft geen aanspraak op tegemoetkoming indien hij aanspraak heeft op
      tegemoetkoming ingevolge de hoofdstukken 3 of 4 van deze wet of op studiefinanciering ingevolge
      [hoofdstuk 2 van de Wet studiefinanciering 2000][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel10.4
    references:
      - id: ref1
        bwb_id: BWBR0011453
        hoofdstuk: '2'
  - number: 10.4.2
    text: Een aanvrager heeft geen aanspraak op tegemoetkoming indien hij tegemoetkoming ontvangt ingevolge hoofdstuk 5.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel10.4
  - number: 10.5.1
    text: |-
      Voor tegemoetkoming kan aanspraak bestaan afhankelijk van de hoogte van het toetsingsinkomen en van de
      onderwijssoort.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel10.5
  - number: 10.5.2
    text: |-
      Geen aanspraak op een tegemoetkoming bestaat bij een toetsingsinkomen naar de maatstaf van 1 januari 2001 van meer
      dan € 2 858,-.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel10.5
  - number: 10.6.1
    text: 'Onder toetsingsinkomen wordt verstaan het totaal van de volgende inkomsten:'
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel10.6
  - number: 10.6.1.a
    text: |-
      het door de leerling of student gedurende de maanden mei, juni en juli voorafgaande aan de aanvang van het
      schooljaar of studiejaar genoten loon in de zin van de [Wet op de loonbelasting 1964][ref1] verminderd met het
      vakantiegeld, de ingehouden loonbelasting, de ingehouden premies volksverzekeringen en de inkomensafhankelijke
      bijdrage, bedoeld in [artikel 41 van de Zorgverzekeringswet][ref2], en


      [ref1]: https://wetten.overheid.nl/BWBR0002471
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel41
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel10.6
    references:
      - id: ref1
        bwb_id: BWBR0002471
      - id: ref2
        bwb_id: BWBR0018450
        artikel: '41'
  - number: 10.6.1.b
    text: |-
      een vierde deel van de winst uit een of meer ondernemingen, bedoeld in
      [artikel 3.8 van de Wet inkomstenbelasting 2001][ref1], door de leerling of student genoten in het kalenderjaar
      voorafgaande aan het jaar waarin het schooljaar of studiejaar aanvangt.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel10.6
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 10.6.2
    text: |-
      Voorzover de leerling of student niet binnenlandse belastingplichtige is in de zin van de
      [Wet inkomstenbelasting 2001][ref1], geldt als maatstaf het toetsingsinkomen voor het geval hij voor al zijn
      inkomensbestanddelen binnenlandse belastingplichtige was geweest.


      [ref1]: https://wetten.overheid.nl/BWBR0011353
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel10.6
    references:
      - id: ref1
        bwb_id: BWBR0011353
  - number: 10.6.3
    text: |-
      Indien een gedeelte van het inkomen van Nederlandse inkomstenbelasting is vrijgesteld ingevolge bepalingen van
      internationaal recht geldt als maatstaf het toetsingsinkomen voor het geval hij geen vrijstelling had verkregen.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel10.6
  - number: 10.7.1
    text: 'De tegemoetkoming bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel10.7
  - number: 10.7.1.a
    text: tegemoetkoming in de onderwijsbijdrage, en
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel10.7
  - number: 10.7.1.b
    text: tegemoetkoming in de schoolkosten.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel10.7
  - number: 10.7.2
    text: 'De tegemoetkoming in de onderwijsbijdrage is voor een leerling of student in het:'
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel10.7
  - number: 10.7.2.1°
    text: |-
      hoger onderwijs: het desbetreffende in [artikel 7.44, van de WHW][ref1] genoemde collegegeld,


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel10.7
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
  - number: 10.7.2.2°
    text: |-
      voortgezet onderwijs die per week 540 minuten of meer onderwijs volgt: het bij of krachtens de
      [Les- en cursusgeldwet][ref1] verschuldigde cursusgeld voor een schooljaar voor 540 minuten onderwijs, afgerond op
      het naastbij gelegen, gehele getal,


      [ref1]: https://wetten.overheid.nl/BWBR0004188
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel10.7
    references:
      - id: ref1
        bwb_id: BWBR0004188
  - number: 10.7.2.3°
    text: |-
      voortgezet onderwijs die per week ten minste 270 minuten en minder dan 540 minuten onderwijs volgt: het bij of
      krachtens de [Les- en cursusgeldwet][ref1] verschuldigde cursusgeld voor een schooljaar voor 360 minuten onderwijs,
      afgerond op het naastbij gelegen, gehele getal, of


      [ref1]: https://wetten.overheid.nl/BWBR0004188
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel10.7
    references:
      - id: ref1
        bwb_id: BWBR0004188
  - number: 10.7.2.4°
    text: 'voortgezet onderwijs die per week minder dan 270 minuten onderwijs volgt: nihil.'
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel10.7
  - number: 10.7.3
    text: |-
      De tegemoetkoming in de schoolkosten voor een schooljaar of studiejaar bedraagt naar de maatstaf van 1 augustus
      2000 onderscheidenlijk 1 september 2000 voor een leerling of student in het:
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel10.7
  - number: 10.7.3.a
    text: |-
      hoger onderwijs: 12 maal het normbedrag voor boeken en leermiddelen voor het hoger onderwijs, bedoeld in
      [artikel 3.18 van de Wet studiefinanciering 2000][ref1], zoals dat geldt op de eerste dag van het studiejaar en
      afgerond op het naastbij gelegen, gehele getal,


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel3
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel10.7
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '3'
  - number: 10.7.3.b
    text: 'voortgezet onderwijs die per week 540 minuten of meer onderwijs volgt: € 226,-,'
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel10.7
  - number: 10.7.3.c
    text: 'voortgezet onderwijs die per week ten minste 270 minuten en minder dan 540 minuten onderwijs volgt:  € 152,- ,'
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel10.7
  - number: 10.7.3.d
    text: 'voortgezet onderwijs die per week minder dan 270 minuten onderwijs volgt: nihil.'
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel10.7
  - number: 10.7.4
    text: |-
      Bij algemene maatregel van bestuur kunnen de maatstaf genoemd in de aanhef van het derde lid, alsmede de bedragen
      genoemd in het derde lid, de onderdelen a tot en met c, worden gewijzigd.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel10.7
  - number: 10.7.5
    text: |-
      De voordracht voor een krachtens het vierde lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel10.7
  - number: 10.8.1
    text: |-
      De IB-Groep kent een tegemoetkoming toe aan de leerling of student die daartoe een aanvraag heeft ingediend en die
      voldoet aan de voorschriften gegeven bij of krachtens dit hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel10.8
  - number: 10.8.2
    text: |-
      Een aanvraag om tegemoetkoming wordt jaarlijks voor 1 september na het einde van het desbetreffende schooljaar of
      studiejaar gedaan.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel10.8
  - number: 10.8.3
    text: 'De IB-Groep besluit op een aanvraag om tegemoetkoming indien de aanvraag is ingediend:'
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel10.8
  - number: 10.8.3.a
    text: |-
      voor de aanvang van het desbetreffende schooljaar of studiejaar: binnen 8 weken na de aanvang van dat school- of
      studiejaar, en
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel10.8
  - number: 10.8.3.b
    text: 'gedurende het desbetreffende schooljaar of studiejaar: binnen 8 weken na de indiening van de aanvraag.'
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel10.8
  - number: 10.9.1
    text: Behoudens het tweede tot en met vijfde lid, wordt tegemoetkoming toegekend per schooljaar of studiejaar.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel10.9
  - number: 10.9.2
    text: |-
      Indien de leerling of student is ingeschreven aan een school als bedoeld in artikel 10.2, voorzover het betreft
      de artikelen 2.4 en 2.8, en artikel 10.3, en hij geen onderwijs meer volgt op een tijdstip waarop de gehele
      onderwijsbijdrage nog kan worden teruggevorderd, wordt de toekenning op de tegemoetkoming voor het gehele
      schooljaar of studiejaar op nihil gesteld.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel10.9
  - number: 10.9.3
    text: |-
      Indien de student is ingeschreven aan een school als bedoeld in artikel 10.3, en hij op enig ogenblik in de periode
      gelegen tussen het tijdstip, bedoeld in het tweede lid, en een bij ministeriële regeling te bepalen datum geen
      onderwijs meer volgt, omvat de toekenning van de tegemoetkoming het bedrag, bedoeld in artikel 10.7, eerste lid,
      onderdeel a, alsmede de helft van de tegemoetkoming, bedoeld in artikel 10.7, eerste lid, onderdeel b, afgerond op
      het naastbij gelegen, gehele getal.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel10.9
  - number: 10.9.4
    text: |-
      Indien de leerling is ingeschreven aan een school als bedoeld in artikel 10.2, voorzover het betreft de artikelen
      2.4 en 2.8, en hij op enig ogenblik in de periode gelegen tussen het tijdstip, bedoeld in het tweede lid, en een
      bij ministeriële regeling te bepalen datum geen onderwijs meer volgt, omvat de toekenning van de tegemoetkoming
      de helft van het bedrag bedoeld in artikel 10.7, eerste lid, onderdeel a, afgerond op het naastbij gelegen, gehele
      getal, alsmede de helft van de tegemoetkoming, bedoeld in artikel 10.7, eerste lid, onderdeel b, afgerond op het
      naastbij gelegen, gehele getal.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel10.9
  - number: 10.9.5
    text: Het derde en vierde lid zijn niet van toepassing indien de leerling of student wegens ziekte zijn studie staakt.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel10.9
  - number: 10.9.6
    text: |-
      Het tweede tot en met het vijfde lid zijn van overeenkomstige toepassing indien de leerling of student het
      onderwijs, bedoeld in artikel 10.2, voorzover het betreft de artikelen 2.5 en 2.6, en artikel 10.3, volgt, met
      dien verstande dat als onderwijsbijdrage geldt de onderwijsbijdrage die verschuldigd zou zijn wanneer voltijds uit
      de openbare kas bekostigd onderwijs zou worden gevolgd, en dat als tijdstip tot waarop de onderwijsbijdrage niet
      kan worden teruggevorderd geldt het tijdstip tot waarop de onderwijsbijdrage in het uit de openbare kas bekostigd
      onderwijs niet geheel kan worden teruggevorderd.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel10.9
  - number: 10.9.7
    text: |-
      Indien de leerling in het voortgezet onderwijs per week 540 minuten of meer onderwijs volgt en hij op enig ogenblik
      voor een bij ministeriële regeling te bepalen tijdstip ten minste 270 minuten en minder dan 540 minuten onderwijs
      per week volgt omvat de toekenning van de tegemoetkoming de helft van het bedrag bedoeld in artikel 10.7, eerste
      lid, onderdeel a, afgerond op het naastbij gelegen, gehele getal, en de tegemoetkoming, bedoeld in artikel 10.7,
      eerste lid, onderdeel b, alsmede de helft van het bedrag bedoeld in artikel 10.7, eerste lid, onderdeel a, afgerond
      op het naastbij gelegen, gehele getal, en de tegemoetkoming, bedoeld in artikel 10.7, eerste lid, onderdeel b, naar
      rato van het aantal minuten dat onderwijs wordt gevolgd.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel10.9
  - number: 10.9.8
    text: |-
      Indien de leerling in het voortgezet onderwijs per week ten minste 270 minuten en minder dan 540 minuten onderwijs
      volgt en hij op enig ogenblik voor een bij ministeriële regeling te bepalen tijdstip minder dan 270 minuten
      onderwijs per week volgt, omvat de toekenning van de tegemoetkoming de helft van het bedrag bedoeld in artikel
      10.7, eerste lid, onderdeel a, afgerond op het naastbij gelegen, gehele getal, en de tegemoetkoming, bedoeld
      in artikel 10.7, eerste lid, onderdeel b, alsmede de helft van het bedrag bedoeld in artikel 10.7, eerste lid,
      onderdeel a, afgerond op het naastbij gelegen, gehele getal, en de tegemoetkoming, bedoeld in artikel 10.7, eerste
      lid, onderdeel b, naar rato van het aantal minuten dat onderwijs wordt gevolgd.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel10.9
  - number: 11.1.1
    text: |-
      Per 1 januari van ieder kalenderjaar past Onze Minister de bedragen, genoemd in de artikelen 2.23, tweede lid, 3.5,
      4.3, 4.6, 5.10, 10.5, tweede lid, en 10.7, derde lid, aan op een bij of krachtens algemene maatregel van bestuur
      aan te geven wijze aan de hand van de loon- of prijsontwikkelingen in het tweede daaraan voorafgaande kalenderjaar.
      De aangepaste bedragen treden in de plaats van de in de eerste volzin bedoelde bedragen.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel11.1
  - number: 11.1.2
    text: |-
      Bij algemene maatregel van bestuur kunnen de maatstaven, genoemd in de artikelen 3.5, 4.3, 4.6 en 5.10, alsmede de
      bedragen, genoemd in die artikelen, worden gewijzigd.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel11.1
  - number: 11.1.3
    text: |-
      De voordracht voor een krachtens het tweede lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel11.1
  - number: '11.2'
    text: |-
      [Titel 4.2 van de Algemene wet bestuursrecht][ref1] is niet van toepassing op deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel11.2
    references:
      - id: ref1
        bwb_id: BWBR0005537
  - number: 11.3.1
    text: |-
      Tegemoetkoming is niet vatbaar voor vervreemding, verpanding, belening en beslag, waaronder begrepen beslag
      ingevolge faillissement of toepassing van de schuldsaneringsregeling natuurlijke personen.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel11.3
  - number: 11.3.2
    text: Elk beding, strijdig met dit artikel, is nietig.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel11.3
  - number: 11.4.1
    text: |-
      De IB-Groep kan voor bepaalde gevallen de wet buiten toepassing laten of daarvan afwijken voorzover toepassing
      gelet op het belang dat deze wet beoogt te beschermen, zal leiden tot een onbillijkheid van overwegende aard.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel11.4
  - number: 11.4.2
    text: 'Het eerste lid is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel11.4
  - number: 11.4.2.a
    text: het begrip partner,
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel11.4
  - number: 11.4.2.b
    text: het begrip vreemdeling, en
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel11.4
  - number: 11.4.2.c
    text: |-
      [artikel 1.8][ref1].

      [ref1]: https://wetten.overheid.nl/BWBR0012438#Artikel1
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel11.4
    references:
      - id: ref1
        bwb_id: BWBR0012438
        artikel: '1'
        hoofdstuk: '1'
  - number: '12.3'
    text: |-
      Artikel 1.5 is niet van toepassing op scholieren die voor 1 augustus volgend op het tijdstip van inwerkingtreding
      van dat artikel, een basistoelage als bedoeld in artikel 4.3 of als bedoeld in artikel 26 van de Wet tegemoetkoming
      studiekosten ontvingen.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel12.3
  - number: 12.3a.1
    text: |-
      In afwijking van [artikel 2.11][ref1] komt tot een bij koninklijk besluit te bepalen tijdstip voor tegemoetkoming
      ingevolge [afdeling 5.1][ref2] mede in aanmerking een student die is ingeschreven voor het volgen van:


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0012438#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel12.3a
    references:
      - id: ref1
        bwb_id: BWBR0012438
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.4'
      - id: ref2
        bwb_id: BWBR0012438
        hoofdstuk: '5'
        afdeling: '5.1'
  - number: 12.3a.1.a
    text: |-
      een voltijdse opleiding als bedoeld in de [artikelen 18.14][ref1], [18.15][ref2] of [18.16 van de WHW][ref3],
      voorzover het een opleiding voor het beroep van leraar betreft en voorzover die opleiding is geaccrediteerd
