  - number: 5.11.1
    text: |-
      De IB-Groep kent een tegemoetkoming toe aan de leerling die daartoe een aanvraag heeft ingediend en die voldoet aan
      de voorschriften gegeven bij of krachtens deze wet.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel5.11
  - number: 5.11.2
    text: Een aanvraag om tegemoetkoming wordt jaarlijks voor het einde van het desbetreffende schooljaar gedaan.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel5.11
  - number: 5.11.3
    text: 'De IB-Groep besluit op een aanvraag om tegemoetkoming indien de aanvraag is ingediend:'
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel5.11
  - number: 5.11.3.a
    text: 'voor de aanvang van het desbetreffende schooljaar: binnen 8 weken na de aanvang van dat schooljaar, en'
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel5.11
  - number: 5.11.3.b
    text: 'gedurende het desbetreffende schooljaar: binnen 8 weken na de indiening van de aanvraag.'
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel5.11
  - number: '5.12'
    text: Tegemoetkoming wordt toegekend per schooljaar.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel5.12
  - number: 6.1.1
    text: |-
      Ontvangst van een lening of omzetting in een lening als bedoeld in de artikelen 4.11, 4.12 en 4.13, of omzetting
      als bedoeld in artikel 6.2, verplicht degene die tegemoetkoming in de zin van hoofdstuk 4 heeft ontvangen tot
      terugbetaling van de lening vermeerderd met de volgens dit hoofdstuk berekende rente.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel6.1
  - number: 6.2.1
    text: |-
      De schuld van een leerling in de zin van hoofdstuk 4 van wie het recht op tegemoetkoming eindigt zonder dat over
      de maand volgend op de beëindiging studiefinanciering op grond van de [Wet studiefinanciering 2000][ref1] wordt
      verstrekt, wordt van rechtswege omgezet in lening. De in de vorige volzin bedoelde lening wordt rentedragend met
      ingang van het tijdstip van die omzetting.


      [ref1]: https://wetten.overheid.nl/BWBR0011453
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0011453
  - number: 6.2.2
    text: |-
      De schuld, niet zijnde een schuld waarop artikel 6.3 van toepassing is, van een leerling in de zin van hoofdstuk 4
      van wie het recht op tegemoetkoming eindigt en aan wie over de maand volgend op de beëindiging studiefinanciering
      op grond van de [Wet studiefinanciering 2000][ref1] wordt verstrekt, wordt aangemerkt als een schuld waarop
      [artikel 7.4 van die wet][ref2] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0011453
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel7
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0011453
      - id: ref2
        bwb_id: BWBR0011453
        artikel: '7'
  - number: '6.3'
    text: |-
      De [artikelen 6.3 tot en met 6.18 van de Wet studiefinanciering 2000][ref1] zijn van overeenkomstige toepassing op
      de bedragen aan lening die op grond van deze wet zijn opgebouwd.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel6
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel6.3
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '6'
  - number: 7.1.1
    text: 'De IB-Groep kan een beschikking herzien waarbij:'
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel7.1
  - number: 7.1.1.a
    text: tegemoetkoming is toegekend, of
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel7.1
  - number: 7.1.1.b
    text: |-
      de hoogte van het toetsingsinkomen van de aanvrager of diens partner of van de TOS-ouder of diens partner wordt
      vastgesteld of gewijzigd.
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel7.1
  - number: 7.1.2
    text: 'Herziening vindt plaats op grond van het feit dat:'
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel7.1
  - number: 7.1.2.a
    text: |-
      een beschikking genomen is waarvan de aanvrager of de TOS-ouder wist of redelijkerwijs had kunnen weten dat deze
      onjuist was,
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel7.1
