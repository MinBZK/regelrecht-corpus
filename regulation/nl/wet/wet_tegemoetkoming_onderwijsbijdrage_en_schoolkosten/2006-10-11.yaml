        bwb_id: BWBR0012438
        hoofdstuk: '3'
  - number: 1.8.c
    text: |-
      [artikel 10][ref1], met dien verstande dat deze bepaling niet van toepassing is op [hoofdstuk 3][ref2] van deze
      wet.


      [ref1]: https://wetten.overheid.nl/BWBR0018472#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0012438#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0012438/2006-10-11#Artikel1.8
