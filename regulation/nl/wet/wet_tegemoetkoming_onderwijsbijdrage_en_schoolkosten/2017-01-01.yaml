  - number: 12.12_bis
    text: |-
      Een aanvrager die per 1 januari 2010 aanspraak heeft op een verhoging van het kindgebonden budget als
      bedoeld in de Wet van 18 juni 2009 tot wijziging van de Wet op het kindgebonden budget, de Wet tegemoetkoming
      onderwijsbijdrage en schoolkosten en de Wet studiefinanciering 2000 in verband met de integratie van hoofdstuk 3
      van de Wet tegemoetkoming onderwijsbijdrage en schoolkosten in de Wet op het kindgebonden budget (Stb. 331), kan
      voor het tijdvak tot 1 januari 2010 voor tegemoetkoming ingevolge [hoofdstuk 3][ref1] van de Wet tegemoetkoming
      onderwijsbijdrage en schoolkosten zoals deze luidde voor de datum van inwerkingtreding van voormelde wet van
      18 juni 2009, in aanmerking komen indien de scholier, deelnemer of deelnemer vavo op wie de aanvraag betrekking
      heeft, jonger is dan 18 jaren en is ingeschreven aan een school als bedoeld in [paragraaf 2.2][ref2] van de Wet
      tegemoetkoming onderwijsbijdrage en schoolkosten zoals deze luidde voor de inwerkingtreding van voormelde wet van
      18 juni 2009.


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0012438#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0012438/2017-01-01#Artikel12.12
    references:
      - id: ref1
        bwb_id: BWBR0012438
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0012438
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '12.13'
    text: |-
      1 Aanvragen op grond van de Wet tegemoetkoming studiekosten worden van rechtswege omgezet in een aanvraag op grond
      van deze wet.

      2 Tegemoetkoming die op grond van de Wet tegemoetkoming studiekosten is toegekend, wordt van rechtswege omgezet in
      tegemoetkoming op grond van deze wet.

      3 Verplichtingen die op grond van de Wet tegemoetkoming studiekosten bestaan, worden van rechtswege omgezet in
      verplichtingen op grond van deze wet.
    url: https://wetten.overheid.nl/BWBR0012438/2017-01-01#Artikel12.13
  - number: '12.14'
    text: |-
      1 Op bezwaar en beroep ingevolge de Wet tegemoetkoming studiekosten, ingesteld voor 1 augustus 2001, of tegen een
      besluit van voor deze datum ingesteld op of na deze datum, blijven de op 31 juli 2001 geldende voorschriften van
      toepassing.

      2 Op bezwaar en beroep tegen een besluit ingevolge de Wet tegemoetkoming onderwijsbijdrage en schoolkosten, dat is
      genomen voor 1 januari 2010, blijven de op 31 december 2009 geldende voorschriften van toepassing.
    url: https://wetten.overheid.nl/BWBR0012438/2017-01-01#Artikel12.14
  - number: '14.1'
    text: De Wet tegemoetkoming studiekosten wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0012438/2017-01-01#Artikel14.1
  - number: '14.2'
    text: |-
      Deze wet treedt in werking op 1 augustus 2001, met uitzondering van:

      a. artikel 1.5 dat in werking treedt op een bij koninklijk besluit te bepalen tijdstip,

      b. artikel 13.5 dat in werking treedt met ingang van 1 januari 2002, en

      c. de artikelen 13.12 en 13.14, onderdelen A, G en I, die in werking treden met ingang van de dag na de datum van
      uitgifte van het Staatsblad waarin deze wet wordt geplaatst, en terugwerken tot en met 1 september 2000.
    url: https://wetten.overheid.nl/BWBR0012438/2017-01-01#Artikel14.2
  - number: '14.3'
    text: 'Deze wet wordt aangehaald als: Wet tegemoetkoming onderwijsbijdrage en schoolkosten.'
    url: https://wetten.overheid.nl/BWBR0012438/2017-01-01#Artikel14.3
