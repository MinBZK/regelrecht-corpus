  - number: '2.21'
    text: |-
      1 De scholier, bedoeld in [hoofdstuk 4][ref1], die tevens aanspraak heeft op studiefinanciering in de zin van de
      [Wet studiefinanciering 2000][ref2], heeft geen aanspraak op tegemoetkoming.

      2 De deelnemer vavo, bedoeld in [hoofdstuk 4][ref3], voor wie onderwijsbijdrage is verschuldigd en die tevens
      aanspraak heeft op studiefinanciering in de zin van de [Wet studiefinanciering 2000][ref4], heeft geen aanspraak
      op tegemoetkoming.


