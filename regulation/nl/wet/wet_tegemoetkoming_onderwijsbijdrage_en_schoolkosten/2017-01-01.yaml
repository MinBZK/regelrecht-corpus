  - number: '10.4'
    text: |-
      1 Een aanvrager heeft geen aanspraak op tegemoetkoming indien hij aanspraak heeft op
      tegemoetkoming ingevolge de hoofdstukken 3 of 4 van deze wet of op studiefinanciering ingevolge
      [hoofdstuk 2 van de Wet studiefinanciering 2000][ref1].

      2 Een aanvrager heeft geen aanspraak op tegemoetkoming indien hij tegemoetkoming ontvangt ingevolge hoofdstuk 5.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0012438/2017-01-01#Artikel10.4
