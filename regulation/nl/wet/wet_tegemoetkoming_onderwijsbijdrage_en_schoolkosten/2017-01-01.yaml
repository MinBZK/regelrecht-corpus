  - number: '12.4'
    text: |-
      Voor een scholier of deelnemer vavo als bedoeld in [hoofdstuk 4][ref1] die reeds voor de inwerkingtreding van
      [artikel 2.22a][ref2] tegemoetkoming onderwijsbijdrage en schoolkosten ontving en wiens vrijheid op de dag
      voorafgaande aan de inwerkingtreding van [artikel 2.22a][ref3] rechtens was ontnomen wordt voor de toepassing
      van [dat artikel][ref4] als eerste dag waarop de vrijheidsontneming plaatsvindt, aangemerkt de dag van
      inwerkingtreding van [artikel 2.22a][ref5] en eindigt de aanspraak op basistoelage voor uitwonenden in afwijking
      van [artikel 2.22a, eerste lid][ref6], vanaf de dag dat deze vrijheidsontneming zes maanden heeft geduurd. De
      beëindiging gaat in op de eerste dag van de maand volgend op de maand waarin de vrijheidsontneming als bedoeld in
      de eerste zin zes maanden heeft geduurd.


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Hoofdstuk4
