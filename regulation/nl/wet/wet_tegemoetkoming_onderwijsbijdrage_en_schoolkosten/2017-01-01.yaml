  - number: '2.12'
    text: |-
      Voor tegemoetkoming ingevolge afdeling 5.1 kan een student in aanmerking komen indien hij als leraar is benoemd of
      tewerkgesteld zonder benoeming vanwege het bezit van een geschiktheidsverklaring als bedoeld in artikel 176b van
      de Wet op het primair onderwijs, artikel 162e van de WEC, [artikel 118k van de WVO][ref1], of artikel 4.2.4, van
      de WEB.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel118k
