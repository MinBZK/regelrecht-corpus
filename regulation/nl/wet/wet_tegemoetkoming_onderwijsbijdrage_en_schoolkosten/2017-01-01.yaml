        hoofdstuk: '2'
  - number: '10.5'
    text: |-
      1 Voor tegemoetkoming kan aanspraak bestaan afhankelijk van de hoogte van het toetsingsinkomen en van de
      onderwijssoort.

      2 Geen aanspraak op een tegemoetkoming bestaat bij een toetsingsinkomen naar de maatstaf van 1 januari 2001 van
      meer dan € 2 858,- .
    url: https://wetten.overheid.nl/BWBR0012438/2017-01-01#Artikel10.5
  - number: '10.6'
    text: |-
      1 Onder toetsingsinkomen wordt verstaan het totaal van de volgende inkomsten:

      a. het door de leerling of student gedurende de maanden mei, juni en juli voorafgaande aan de aanvang van het
      schooljaar of studiejaar genoten loon in de zin van de [Wet op de loonbelasting 1964][ref1] verminderd met het
      vakantiegeld, de ingehouden loonbelasting, de ingehouden premies volksverzekeringen en de inkomensafhankelijke
      bijdrage, bedoeld in [artikel 43 van de Zorgverzekeringswet][ref2], en

      b. een vierde deel van de winst uit een of meer ondernemingen, bedoeld in
      [artikel 3.8 van de Wet inkomstenbelasting 2001][ref3], door de leerling of student genoten in het kalenderjaar
      voorafgaande aan het jaar waarin het schooljaar of studiejaar aanvangt.

      2 Voorzover de leerling of student niet binnenlandse belastingplichtige is in de zin van de
      [Wet inkomstenbelasting 2001][ref4], geldt als maatstaf het toetsingsinkomen voor het geval hij voor al zijn
      inkomensbestanddelen binnenlandse belastingplichtige was geweest.

      3 Indien een gedeelte van het inkomen van Nederlandse inkomstenbelasting is vrijgesteld ingevolge bepalingen van
      internationaal recht geldt als maatstaf het toetsingsinkomen voor het geval hij geen vrijstelling had verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0002471
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel43
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel3.8
      [ref4]: https://wetten.overheid.nl/BWBR0011353
    url: https://wetten.overheid.nl/BWBR0012438/2017-01-01#Artikel10.6
