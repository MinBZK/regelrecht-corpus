  - number: '2.14'
    text: |-
      Geen aanspraak op tegemoetkoming bestaat indien de leerling of student is ingeschreven aan een opleiding waarvan de
      duur, daaronder begrepen ten hoogste 12 vakantieweken, korter is dan 1 jaar.
    url: https://wetten.overheid.nl/BWBR0012438/2017-01-01#Artikel2.14
  - number: '2.15'
    text: |-
      De aanspraak op tegemoetkoming van een leerling die gedurende een aaneengesloten periode van 8 weken niet aan het
      onderwijs heeft deelgenomen, vervalt met ingang van de eerste dag van de maand volgend op die waarin de school
      de afwezigheid, bedoeld in [artikel 4.12][ref1] aan Onze Minister heeft medegedeeld. De periode van 8 weken wordt
      verlengd met de weken waarin vanwege vakantie geen onderwijs werd verzorgd.


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Artikel4.12
    url: https://wetten.overheid.nl/BWBR0012438/2017-01-01#Artikel2.15
    references:
