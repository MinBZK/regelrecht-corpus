  - number: '2.28'
    text: |-
      1 Op aanvraag van de aanvrager of diens partner of TOS-ouder of diens partner wordt bij toepassing van
      [artikel 1.8, onderdeel b][ref1], indien sprake is van een terugval in inkomen over het eerste of het tweede jaar
      na het peiljaar, uitgegaan van dat jaar. Deze aanvraag wordt gelijktijdig gedaan met de aanvraag ingevolge de
      [artikelen 5.5][ref2] of [5.11][ref3].

      2 Voor de toepassing van het eerste lid wordt onder een terugval in inkomen verstaan een vermindering van de
      draagkracht met ten minste 15% ten opzichte van het peiljaar, met dien verstande dat:

      a. de vermindering niet kan worden gerekend tot inkomensschommelingen die in het algemeen normaal kunnen worden
      geacht bij de gekozen wijze van inkomensverwerving, en

      b. aannemelijk wordt gemaakt dat gedurende ten minste 3 kalenderjaren zal worden voldaan aan de vereisten genoemd
      in de aanhef alsmede in onderdeel a.


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Artikel1.8
      [ref2]: https://wetten.overheid.nl/BWBR0012438#Artikel5.5
      [ref3]: https://wetten.overheid.nl/BWBR0012438#Artikel5.11
