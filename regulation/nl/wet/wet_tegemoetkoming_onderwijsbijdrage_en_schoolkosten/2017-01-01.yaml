  - number: 2.22a
    text: |-
      1 Een scholier of een deelnemer vavo als bedoeld in [hoofdstuk 4][ref1] die voor ten
      minste één maand rechtens zijn vrijheid is ontnomen, heeft, behoudens in de gevallen,
      bedoeld in de [Wet bijzondere opnemingen in psychiatrische ziekenhuizen][ref2] en in
      [artikel 37, eerste lid, van het Wetboek van Strafrecht][ref3] en de gevallen, bedoeld in
      [hoofdstuk 6 van de Jeugdwet][ref4], met ingang van de eerste dag van de maand volgend op de maand waarin de
      vrijheidsontneming tenminste één maand heeft geduurd slechts aanspraak op een basistoelage voor een thuiswonende
      leerling.

      2 Voor de toepassing van het eerste lid worden perioden van vrijheidsontneming samengeteld, indien zij elkaar met
      een onderbreking van minder dan vier weken opvolgen.

      3 Het eerste en tweede lid zijn niet van toepassing op bij algemene maatregel van bestuur aan te wijzen groepen
      van personen waarbij tenuitvoerlegging van een vrijheidsstraf of vrijheidsbenemende maatregel buiten een justitiële
      inrichting plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0005700
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel37
      [ref4]: https://wetten.overheid.nl/BWBR0034925#Hoofdstuk6
