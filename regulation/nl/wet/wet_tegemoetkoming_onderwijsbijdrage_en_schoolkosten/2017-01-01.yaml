  - number: '4.1'
    text: |-
      Dit hoofdstuk is van toepassing op scholieren en deelnemers vavo die 18 jaren zijn of ouder en zijn ingeschreven
      aan een school als bedoeld in paragraaf 2.3.
    url: https://wetten.overheid.nl/BWBR0012438/2017-01-01#Artikel4.1
  - number: '4.2'
    text: |-
      1 De tegemoetkoming in de zin van dit hoofdstuk bestaat uit:

      a. basistoelage, en

      b. tegemoetkoming in de schoolkosten.

      2 Voor leerlingen als bedoeld in [artikel 2.9, onderdelen b, c en d][ref1], en voor deelnemers vavo als bedoeld in
      [artikel 2.10][ref2] bestaat de tegemoetkoming eveneens uit een tegemoetkoming in de onderwijsbijdrage.


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Artikel2.9
      [ref2]: https://wetten.overheid.nl/BWBR0012438#Artikel2.10
    url: https://wetten.overheid.nl/BWBR0012438/2017-01-01#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0012438
        artikel: '2.9'
