  - number: '2.2'
    text: |-
      1 Op tegemoetkoming kan aanspraak bestaan indien de aanvrager:

      a. de Nederlandse nationaliteit bezit,

      b. niet de Nederlandse nationaliteit bezit maar wel ingevolge een verdrag of een besluit van een volkenrechtelijke
      organisatie op het terrein van de tegemoetkoming met een Nederlander wordt gelijkgesteld, of

      c. niet de Nederlandse nationaliteit bezit maar wel behoort tot een bij algemene maatregel van bestuur aangewezen
      groep van personen die op het terrein van de tegemoetkoming met Nederlanders worden gelijkgesteld.

      2 Voor de toepassing van de [hoofdstukken 4][ref1] en [5][ref2] geldt in aanvulling op het eerste lid, onderdeel
      c, dat de aanvrager in Nederland woont, tenzij deze voorwaarde niet mag worden gesteld op grond van een verdrag of
      een besluit van een volkenrechtelijke organisatie. Bij of krachtens algemene maatregel van bestuur kunnen regels
      worden gesteld in verband met een goede uitvoering van dit lid.

      3 Onverminderd het eerste lid, onderdeel b, kunnen bij algemene maatregel van bestuur groepen van personen worden
      aangewezen voor wie de gelijkstelling, bedoeld in het eerste lid, onderdeel b, slechts een tegemoetkoming in de
      kosten van de toegang tot het onderwijs betreft. Bij algemene maatregel van bestuur kunnen regels worden gesteld
      met betrekking tot de hoogte en de vorm van deze tegemoetkoming.

      4 Bij algemene maatregel van bestuur kan ten gunste van de student worden afgeweken van het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0012438#Hoofdstuk5
