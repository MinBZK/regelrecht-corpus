  - number: '2.11'
    text: |-
      1 Voor tegemoetkoming ingevolge [afdeling 5.1][ref1] kan een student in aanmerking komen die als student is
      ingeschreven voor het volgen van een bacheloropleiding of masteropleiding voor het beroep van leraar aan een
      bekostigde universiteit of hogeschool, genoemd in de [bijlage van de WHW](onbekend):

      a. voorzover die opleiding is geaccrediteerd als bedoeld in [artikel 1.1, onderdeel s, van de WHW][ref2] of
      de toets nieuwe opleiding, bedoeld in [artikel 1.1, onderdeel t, van de WHW][ref3], met positief gevolg heeft
      ondergaan, of

      b. gedurende de termijn, bedoeld in de [artikelen 5a.12, eerste, vierde en vijfde lid][ref4],
      [5a.12a, eerste lid][ref5], [5a.15][ref6], of [6.5, tweede lid, van de WHW][ref7].

      2 Voor tegemoetkoming ingevolge [afdeling 5.1][ref8] kan een student in aanmerking komen die als student is
      ingeschreven voor het volgen van een bacheloropleiding of masteropleiding voor het beroep van leraar aan een
      aangewezen instelling als bedoeld in de [artikelen 6.9][ref9] of [16.14 van de WHW][ref10] zoals die artikelen
      luidden op de dag voorafgaand aan de inwerkingtreding van de wet van 4 februari 2010 (Stb. 119), of verzorgd door
      een rechtspersoon met volledige rechtsbevoegdheid als bedoeld in [artikel 1.2, onderdeel b, van de WHW][ref11]
      zoals dat artikel luidt met ingang van de inwerkingtreding van de genoemde wet van 4 februari 2010 (Stb. 119):

      a. voorzover die opleiding is geaccrediteerd als bedoeld in [artikel 1.1, onderdeel s, van de WHW][ref12] of
      de toets nieuwe opleiding, bedoeld in [artikel 1.1, onderdeel t, van de WHW][ref13], met positief gevolg heeft
      ondergaan, of

      b. gedurende de termijn, bedoeld in de [artikelen 5a.12, eerste, vierde en vijfde lid][ref14],
      [5a.12a, eerste lid][ref15], [5a.15][ref16], of [6.10, derde lid, van de WHW][ref17].


