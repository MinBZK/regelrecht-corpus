  - number: '10.8'
    text: |-
      1 Onze Minister kent een tegemoetkoming toe aan de leerling of student die daartoe een aanvraag heeft ingediend en
      die voldoet aan de voorschriften gegeven bij of krachtens dit hoofdstuk.

      2 Een aanvraag om tegemoetkoming wordt jaarlijks voor 1 september na het einde van het desbetreffende schooljaar of
      studiejaar gedaan.

      3 Onze Minister besluit op een aanvraag om tegemoetkoming indien de aanvraag is ingediend:

      a. voor de aanvang van het desbetreffende schooljaar of studiejaar: binnen 8 weken na de aanvang van dat school- of
      studiejaar, en

      b. gedurende het desbetreffende schooljaar of studiejaar: binnen 8 weken na de indiening van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0012438/2017-01-01#Artikel10.8
  - number: '10.9'
    text: |-
      1 Behoudens het tweede tot en met vijfde lid, wordt tegemoetkoming toegekend per schooljaar of studiejaar.

      2 Indien de leerling of student is ingeschreven aan een school of voor een cursus als bedoeld in
      [artikel 10.2][ref1], voorzover het betreft [artikel 2.9, onderdelen a en d][ref2], en [artikel 10.3][ref3], en hij
      geen onderwijs meer volgt op een tijdstip waarop de gehele onderwijsbijdrage nog kan worden teruggevorderd, wordt
      de toekenning op de tegemoetkoming voor het gehele schooljaar of studiejaar op nihil gesteld.

      3 Indien de student is ingeschreven aan een school als bedoeld in [artikel 10.3][ref4], en hij op enig
      ogenblik in de periode gelegen tussen het tijdstip, bedoeld in het tweede lid, en een bij ministeriële
      regeling te bepalen datum geen onderwijs meer volgt, omvat de toekenning van de tegemoetkoming het bedrag,
      bedoeld in [artikel 10.7, eerste lid][ref5], onderdeel a, alsmede de helft van de tegemoetkoming, bedoeld in
      [artikel 10.7, eerste lid, onderdeel b][ref6], afgerond op het naastbij gelegen, gehele getal.

      4 Indien de leerling is ingeschreven aan een school of voor een cursus als bedoeld in [artikel 10.2][ref7],
      voorzover het betreft [artikel 2.9, onderdelen a en d][ref8], en hij op enig ogenblik in de periode
      gelegen tussen het tijdstip, bedoeld in het tweede lid, en een bij ministeriële regeling te bepalen datum
      geen onderwijs meer volgt, omvat de toekenning van de tegemoetkoming de helft van het bedrag bedoeld in
      [artikel 10.7, eerste lid, onderdeel a][ref9], afgerond op het naastbij gelegen, gehele getal, alsmede de helft
      van de tegemoetkoming, bedoeld in [artikel 10.7, eerste lid, onderdeel b][ref10], afgerond op het naastbij gelegen,
      gehele getal.

      5 Het derde en vierde lid zijn niet van toepassing indien de leerling of student wegens ziekte zijn studie staakt.

      6 Het tweede tot en met het vijfde lid zijn van overeenkomstige toepassing indien de leerling of student het
      onderwijs, bedoeld in [artikel 10.2][ref11], voorzover het betreft de [artikelen 2.5][ref12] en [2.6][ref13],
      en [artikel 10.3][ref14], volgt, met dien verstande dat als onderwijsbijdrage geldt de onderwijsbijdrage die
      verschuldigd zou zijn wanneer voltijds uit de openbare kas bekostigd onderwijs zou worden gevolgd, en dat
      als tijdstip tot waarop de onderwijsbijdrage niet kan worden teruggevorderd geldt het tijdstip tot waarop de
      onderwijsbijdrage in het uit de openbare kas bekostigd onderwijs niet geheel kan worden teruggevorderd.

      7 Indien de leerling in het voortgezet onderwijs per week 540 minuten of meer onderwijs volgt en hij op enig
      ogenblik voor een bij ministeriële regeling te bepalen tijdstip ten minste 270 minuten en minder dan 540
      minuten onderwijs per week volgt omvat de toekenning van de tegemoetkoming de helft van het bedrag bedoeld
      in [artikel 10.7, eerste lid, onderdeel a][ref15], afgerond op het naastbij gelegen, gehele getal, en de
      tegemoetkoming, bedoeld in [artikel 10.7, eerste lid, onderdeel b][ref16], alsmede de helft van het bedrag
      bedoeld in [artikel 10.7, eerste lid, onderdeel a][ref17], afgerond op het naastbij gelegen, gehele getal, en de
      tegemoetkoming, bedoeld in [artikel 10.7, eerste lid, onderdeel b][ref18], naar rato van het aantal minuten dat
      onderwijs wordt gevolgd.

      8 Indien de leerling in het voortgezet onderwijs per week ten minste 270 minuten en minder dan 540 minuten
      onderwijs volgt en hij op enig ogenblik voor een bij ministeriële regeling te bepalen tijdstip minder dan 270
      minuten onderwijs per week volgt, omvat de toekenning van de tegemoetkoming de helft van het bedrag bedoeld
      in [artikel 10.7, eerste lid, onderdeel a][ref19], afgerond op het naastbij gelegen, gehele getal, en de
      tegemoetkoming, bedoeld in [artikel 10.7, eerste lid, onderdeel b][ref20], alsmede de helft van het bedrag
      bedoeld in [artikel 10.7, eerste lid, onderdeel a][ref21], afgerond op het naastbij gelegen, gehele getal, en de
      tegemoetkoming, bedoeld in [artikel 10.7, eerste lid, onderdeel b][ref22], naar rato van het aantal minuten dat
      onderwijs wordt gevolgd.


