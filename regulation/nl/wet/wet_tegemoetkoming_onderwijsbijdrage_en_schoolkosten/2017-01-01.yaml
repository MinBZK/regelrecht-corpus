  - number: '2.17'
    text: |-
      Een leerling die onderwijs volgt als bedoeld in de [artikelen 2.9, onderdelen b en c][ref1], of [2.10][ref2]
      heeft slechts aanspraak op tegemoetkoming indien de opleiding een studielast heeft van ten minste 850 klokuren per
      schooljaar die worden besteed aan het volgen van lessen of stages.


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Artikel2.9
      [ref2]: https://wetten.overheid.nl/BWBR0012438#Artikel2.10
