  - number: '1.2'
    text: |-
      Voor de toepassing van het bepaalde bij of krachtens deze wet is bepalend de toestand op de eerste dag van de
      maand, tenzij anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0012438/2017-01-01#Artikel1.2
  - number: '1.3'
    text: |-
      1 Een aanvraag kan worden gedaan door een leerling of student.

      2 Bij ministeriële regeling kan worden bepaald aan welke voorwaarden een aanvraag moet voldoen. In ieder geval
      wordt daarbij bepaald dat de aanvrager in de zin van [hoofdstuk 5][ref1] en zijn partner alsmede de TOS-ouder en
      zijn partner hun burgerservicenummer of onderwijsnummer verstrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0012438/2017-01-01#Artikel1.3
    references:
      - id: ref1
        bwb_id: BWBR0012438
        hoofdstuk: '5'
  - number: '1.5'
    text: |-
      1 Indien bij controle door Onze Minister blijkt dat het door de scholier verstrekte adres afwijkt van het adres
      waarop hij in de basisregistratie personen staat ingeschreven, maakt Onze Minister dit aan hem bekend en stelt hem
      in de gelegenheid de afwijking te herstellen.

      2 Indien een uitwonende scholier de afwijking niet binnen 4 weken na de bekendmaking herstelt, wordt met ingang van
      de maand waarin de afwijking is ontstaan, de aan hem toegekende basistoelage omgezet in een basistoelage voor een
      thuiswonende scholier, tenzij hem van de afwijking redelijkerwijs geen verwijt kan worden gemaakt.

      3 Indien een uitwonende scholier de afwijking na de termijn van 4 weken alsnog herstelt, wordt met ingang van de
      maand daaropvolgend de basistoelage voor een thuiswonende scholier omgezet in een basistoelage voor een uitwonende
      scholier.
    url: https://wetten.overheid.nl/BWBR0012438/2017-01-01#Artikel1.5
  - number: '1.7'
    text: |-
      1 Onze Minister gebruikt het burgerservicenummer of onderwijsnummer van een leerling, student of debiteur ter zake
      van de uitvoering van deze wet slechts:

      a. in contacten met die leerling, student of debiteur,

      b. in contacten met personen en instanties voorzover deze zelf gemachtigd zijn tot het opnemen van het
      burgerservicenummer of onderwijsnummer in een persoonsregistratie, en

      c. teneinde de gegevens van die leerling, student of debiteur te vergelijken met de gegevens die over hem zijn
      opgenomen in het basisregister onderwijs, bedoeld in [artikel 24b van de Wet op het onderwijstoezicht][ref1],
      voorzover dat noodzakelijk is voor de uitvoering van deze wet.

      2 Het burgerservicenummer of onderwijsnummer van de partner van een leerling, student of debiteur of van de TOS-
      ouder of diens partner kan ter zake van de uitvoering van deze wet slechts worden gebruikt in contacten met die
      partner of TOS-ouder of met de desbetreffende leerling, student of debiteur, alsmede, voorzover het betreft de
      controle op de rechtmatigheid, in contacten met personen en instanties voorzover deze zelf gemachtigd zijn tot het
      opnemen van het burgerservicenummer of onderwijsnummer in een persoonsregistratie.


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel24b
    url: https://wetten.overheid.nl/BWBR0012438/2017-01-01#Artikel1.7
