preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de Wet tegemoetkoming studiekosten te wijzigen als
    uitvloeisel van het regeerakkoord 1998 en van de nota «Meer voor meer»;

    dat het voorts wenselijk is de leesbaarheid van de Wet tegemoetkoming studiekosten te vergroten en aan te sluiten
    bij de terminologie van de Wet studiefinanciering 2000;

    dat het in verband met het grote aantal wijzigingen wenselijk is de Wet tegemoetkoming studiekosten in te trekken
    en te vervangen door een nieuwe wet;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0012438/2017-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      **bovenbouw**:

      a. voor havo: het vierde en vijfde leerjaar, of

      b. voor vwo: het vierde, vijfde en zesde leerjaar,

      **deelnemer vavo**: degene die vavo volgt als bedoeld in [artikel 2.10][ref1],

      **havo**: hoger algemeen voortgezet onderwijs als bedoeld in [artikel 8 van de WVO][ref2],

      **leerling**: scholier of deelnemer vavo,

      **lening**: rentedragende lening die niet kan worden omgezet in een gift,

      **onderbouw:**

      a. het voorbereidend middelbaar beroepsonderwijs, bedoeld in [artikel 21, eerste lid, van de WVO][ref3], alle
      leerjaren,

      b. het praktijkonderwijs, bedoeld in [artikel 10f van de WVO][ref4], alle leerjaren,

      c. voor havo: het eerste, tweede en derde leerjaar, of

      d. voor vwo: het eerste, tweede en derde leerjaar,

      **onderwijsbijdrage**:

      a. lesgeld als bedoeld in [artikel 5 van de Les- en cursusgeldwet][ref5],

      b. voor een niet uit 's Rijks kas bekostigde school de verschuldigde bijdrage aan de school,

      c. voor de toepassing van [afdeling 5.1][ref6], voorzover het een uit 's Rijks kas bekostigde school betreft: het
      bedrag, bedoeld in [artikel 5.3][ref7], of

      d. voor de toepassing van [afdeling 5.2][ref8], voorzover het een uit 's Rijks kas bekostigde school betreft: de
      bedragen, bedoeld in [artikel 5.10][ref9],

      **onderwijsnummer**: door Onze Minister uitgegeven persoonsgebonden nummer, toegekend aan een persoon aan wie niet
      van overheidswege een burgerservicenummer is verstrekt,

      **Onze Minister**: Onze Minister van Onderwijs, Cultuur en Wetenschap,

      **partner**: degene die in het kalenderjaar waarin het school- of studiejaar aanvangt gedurende meer dan 6 maanden
      partner als bedoeld in [artikel 3 van de Algemene wet inkomensafhankelijke regelingen][ref10] van de aanvrager is,
      met dien verstande dat voor de toepassing van [hoofdstuk 4][ref11] voor «belanghebbende» gelezen wordt: TOS-ouder,

      **peiljaar**: tweede jaar voorafgaand aan het jaar waarin het schooljaar of studiejaar aanvangt,

      **scholier**: degene die voortgezet onderwijs volgt,

      **school**: school of instelling in de zin van:

      a. [Wet op het voortgezet onderwijs][ref12], hierna aangeduid als [WVO][ref13],

      b. [Experimentenwet onderwijs][ref14],

      c. [Wet op de expertisecentra][ref15], hierna aangeduid als [WEC][ref16],

      d. [Wet op de erkende onderwijsinstellingen][ref17], of

      e. [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref18], hierna aangeduid als [WHW][ref19],

      **schooljaar**: tijdvak dat aanvangt op 1 augustus van enig kalenderjaar en eindigt op 31 juli daaropvolgend,

      **student**: degene die hoger onderwijs volgt als bedoeld in de [artikelen 2.11][ref20] en [2.12][ref21],

      **studiejaar**: tijdvak dat aanvangt op 1 september van enig kalenderjaar en eindigt op 31 augustus daaropvolgend,

      **tegemoetkoming**: door Onze Minister verstrekte toekenning in verband met het volgen van een opleiding in het
      onderwijs waarop uitsluitend op grond van deze wet aanspraak bestaat,

      **thuiswonende leerling**: scholier of deelnemer vavo die woont op het adres van de TOS-ouder of partner van de
      TOS-ouder,

      **toetsingsinkomen**: inkomen als bedoeld in
      [artikel 8, eerste en tweede lid, van de Algemene wet inkomensafhankelijke regelingen][ref22], met dien verstande
      dat voor «berekeningsjaar» gelezen wordt: peiljaar,

      **TOS-ouder:** wettelijke vertegenwoordiger in het laatste kwartaal waarin de leerling nog 17 jaar was,

      **uitwonende leerling**: scholier of deelnemer vavo die niet een thuiswonende leerling is,

      **vavo**: opleiding voortgezet algemeen volwassenenonderwijs als bedoeld in
      [artikel 7.3.1, eerste lid, onderdeel a, van de Wet educatie en beroepsonderwijs][ref23],

      **voortgezet onderwijs**: onderwijs in de zin van de [WVO][ref24], en, tenzij anders is bepaald, speciaal onderwijs
      en voortgezet speciaal onderwijs als bedoeld in de [WEC][ref25],

      **vreemdeling**: hetgeen daaronder wordt verstaan in de [Vreemdelingenwet 2000][ref26],

      **vwo**: voorbereidend wetenschappelijk onderwijs als bedoeld in [artikel 7 van de WVO][ref27].

      2 In onderdeel b van de begripsbepaling «TOS-ouder» wordt, indien 2 natuurlijke personen voldoen aan het begrip
      wettelijke vertegenwoordiger, daaronder verstaan:

      a. wettelijke vertegenwoordiger die over het tweede kwartaal van het jaar waarin het schooljaar aanvangt, ten
      behoeve van de leerling kinderbijslag als bedoeld in de [Algemene Kinderbijslagwet][ref28] heeft ontvangen,

      b. indien onderdeel a niet van toepassing is: wettelijke vertegenwoordiger bij wie de leerling op 1 augustus
      blijkens de basisregistratie personen woont, of

      c. indien de onderdelen a en b niet van toepassing zijn: wettelijke vertegenwoordiger die de wettelijke
      vertegenwoordigers gezamenlijk daartoe hebben aangewezen.


