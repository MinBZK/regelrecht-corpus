  - number: '11.3'
    text: |-
      1 Tegemoetkoming is niet vatbaar voor vervreemding, verpanding, belening en beslag, waaronder begrepen beslag
      ingevolge faillissement of toepassing van de schuldsaneringsregeling natuurlijke personen.

      2 Elk beding, strijdig met dit artikel, is nietig.
    url: https://wetten.overheid.nl/BWBR0012438/2017-01-01#Artikel11.3
  - number: '11.4'
    text: |-
      1 Onze Minister kan voor bepaalde gevallen de wet buiten toepassing laten of daarvan afwijken voorzover toepassing
      gelet op het belang dat deze wet beoogt te beschermen, zal leiden tot een onbillijkheid van overwegende aard.

      2 Het eerste lid is niet van toepassing op:

      a. het begrip partner,

      b. het begrip toetsingsinkomen,

      c. het begrip vreemdeling, en

      d. [artikel 1.8][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Artikel1.8
    url: https://wetten.overheid.nl/BWBR0012438/2017-01-01#Artikel11.4
    references:
