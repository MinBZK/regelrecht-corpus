    text: |-
      De leerling heeft geen aanspraak op tegemoetkoming in de zin van [hoofdstuk 4][ref1], indien hij geen aanspraak
      meer heeft op prestatiebeurs in de zin van [hoofdstuk 5 van de Wet studiefinanciering 2000][ref2].


