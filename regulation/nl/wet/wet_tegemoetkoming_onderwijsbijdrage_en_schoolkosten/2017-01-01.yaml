        bwb_id: BWBR0002399
        artikel: 118k
  - number: '2.13'
    text: |-
      Voor tegemoetkoming ingevolge [afdeling 5.2][ref1] kan een leerling in aanmerking komen indien hij is ingeschreven
      voor:

      a. een opleiding of een gedeelte daarvan aan een school als bedoeld in [artikel 1.1.1, onderdeel b][ref2], en
      [artikel 1.4a.1 van de WEB][ref3], voor zover het betreft een opleiding vavo,

      b. een opleiding of een gedeelte daarvan aan een school als bedoeld in
      [artikel 2.9, onderdelen a tot en met c][ref4], of

      c. een cursus als bedoeld in [artikel 2.9, onderdeel d][ref5], met dien verstande dat deze opleidingen of een
      gedeelte daarvan of die cursus die leiden tot het diploma:

      1°. voorbereidend wetenschappelijk onderwijs,

      2°. hoger algemeen voortgezet onderwijs, of

      3°. voortgezet middelbaar beroepsonderwijs voor zover het betreft de theoretische leerweg.


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel1.1.1
