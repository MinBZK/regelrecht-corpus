  - number: '10.7'
    text: |-
      1 De tegemoetkoming bestaat uit:

      a. tegemoetkoming in de onderwijsbijdrage, en

      b. tegemoetkoming in de schoolkosten.

      2 De tegemoetkoming in de onderwijsbijdrage is voor een leerling of student in het:

      1°. hoger onderwijs: het desbetreffende in [artikel 7.44 van de WHW][ref1] zoals dat artikel luidde op de dag
      voorafgaand aan de inwerkingtreding van de wet van 4 februari 2010 (Stb. 119), genoemde collegegeld,

      2°. voortgezet onderwijs die per week 540 minuten of meer onderwijs volgt: het bij of krachtens de
      [Les- en cursusgeldwet][ref2] verschuldigde cursusgeld voor een schooljaar voor 540 minuten onderwijs, afgerond op
      het naastbij gelegen, gehele getal,

      3°. voortgezet onderwijs die per week ten minste 270 minuten en minder dan 540 minuten onderwijs volgt: het bij of
      krachtens de [Les- en cursusgeldwet][ref3] verschuldigde cursusgeld voor een schooljaar voor 360 minuten onderwijs,
      afgerond op het naastbij gelegen, gehele getal, of

      4°. voortgezet onderwijs die per week minder dan 270 minuten onderwijs volgt: nihil.

      3 De tegemoetkoming in de schoolkosten voor een schooljaar of studiejaar bedraagt naar de maatstaf van 1 augustus
      2008 onderscheidenlijk 1 september 2008 voor een leerling of student in het:

      a. hoger onderwijs: € 647,– ,

      b. voortgezet onderwijs die per week 540 minuten of meer onderwijs volgt: € 276,90 ,

      c. voortgezet onderwijs die per week ten minste 270 minuten en minder dan 540 minuten onderwijs volgt: € 186,54 ,

      d. voortgezet onderwijs die per week minder dan 270 minuten onderwijs volgt: nihil.

      4 Bij algemene maatregel van bestuur kunnen de maatstaf genoemd in de aanhef van het derde lid, alsmede de bedragen
      genoemd in het derde lid, de onderdelen a tot en met c, worden gewijzigd.

      5 De voordracht voor een krachtens het vierde lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7.44
      [ref2]: https://wetten.overheid.nl/BWBR0004188
      [ref3]: https://wetten.overheid.nl/BWBR0004188
    url: https://wetten.overheid.nl/BWBR0012438/2017-01-01#Artikel10.7
