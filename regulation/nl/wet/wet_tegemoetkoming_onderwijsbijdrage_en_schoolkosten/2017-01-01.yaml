  - number: '7.1'
    text: |-
      1 Onze Minister kan een beschikking herzien waarbij:

      a. tegemoetkoming is toegekend, of

      b. de hoogte van het toetsingsinkomen van de aanvrager of diens partner of van de TOS-ouder of diens partner wordt
      vastgesteld of gewijzigd.

      2 Herziening vindt plaats op grond van het feit dat:

      a. een beschikking genomen is waarvan de aanvrager of de TOS-ouder wist of redelijkerwijs had kunnen weten dat deze
      onjuist was,

      b. de situatie, bedoeld in de [artikelen 5.9][ref1], [5.10][ref2] en
      [10.9, tweede tot en met vierde en zesde tot en met achtste lid][ref3], zich voordoet,

      c. te veel of te weinig tegemoetkoming is toegekend op basis van onjuiste of onjuist verwerkte gegevens,

      d. de hoogte van het inkomen van de aanvrager of diens partner of van de TOS-ouder of diens partner te hoog of te
      laag is vastgesteld op basis van onjuiste of onjuist verwerkte gegevens anders dan bedoeld onder a,

      e. aanvrager of TOS-ouder heeft gehandeld in strijd met het bepaalde bij of krachtens deze wet,

      f. geen gevolg is gegeven aan de aanvraag op grond van [artikel 2.28][ref4] omdat niet kon worden voldaan aan
      de voorwaarde genoemd in artikel 2.28, tweede lid, onderdeel b, en is gebleken dat gedurende 3 kalenderjaren is
      voldaan aan de voorwaarden genoemd in artikel 2.28, tweede lid, aanhef alsmede onderdeel a,

      g. gevolg is gegeven aan de aanvraag op grond van [artikel 2.28][ref5], en is gebleken dat niet gedurende 3
      kalenderjaren is voldaan aan de voorwaarden genoemd in artikel 2.28, tweede lid, aanhef alsmede onderdeel a,

      h. de situatie van langdurige afwezigheid, bedoeld in [artikel 4.12, eerste lid][ref6], zich niet heeft voorgedaan,
      of

      i. andere, nader gebleken feiten of omstandigheden, die, waren zij eerder bekend geweest, tot een andere
      beschikking zouden hebben geleid.

      3 Behoudens in geval van bedrog, kan een herziening als bedoeld in het tweede lid, onderdelen c, e, h en i, slechts
      geschieden binnen 18 maanden na het einde van het desbetreffende tijdvak waar de toekenning van de tegemoetkoming
      betrekking op heeft.

      4 Behoudens in geval van bedrog, kan een herziening als bedoeld in het tweede lid, onderdeel d, slechts geschieden
      binnen 3 jaren na het einde van het desbetreffende tijdvak waar de toekenning van de tegemoetkoming betrekking
      op heeft.

      5 Behoudens in geval van bedrog, kan een herziening als bedoeld in het tweede lid, onderdelen a, b, f en g, slechts
      geschieden binnen 5 jaren na het einde van het desbetreffende tijdvak waar de toekenning van de tegemoetkoming
      betrekking op heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Artikel5.9
      [ref2]: https://wetten.overheid.nl/BWBR0012438#Artikel5.10
      [ref3]: https://wetten.overheid.nl/BWBR0012438#Artikel10.9
