  - number: '12.11'
    text: |-
      1 Op besluiten met betrekking tot tegemoetkomingen voor het school- of studiejaar 2005–2006 zijn de bepalingen
      die golden voor de inwerkingtreding van de [Aanpassingswet Algemene wet inkomensafhankelijke regelingen][ref1]
      van toepassing.

      2 Op besluiten met betrekking tot tegemoetkomingen voor het
      school- of studiejaar 2006–2007 zijn de bepalingen, opgenomen in
      [hoofdstuk 1, afdeling C, artikel IV, van de Aanpassingswet Algemene wet inkomensafhankelijke regelingen][ref2]
      van toepassing.

      3 Op besluiten met betrekking tot tegemoetkomingen voor het
      school- of studiejaar 2007–2008 zijn de bepalingen, opgenomen in
      [hoofdstuk 1, afdeling C, artikel V, van de Aanpassingswet Algemene wet inkomensafhankelijke regelingen][ref3]
      van toepassing.

      4 Op besluiten met betrekking tot tegemoetkomingen voor het school-
      of studiejaar 2008–2009 en volgende zijn de bepalingen, opgenomen in
      [hoofdstuk 1, afdeling C, artikel VI, van de Aanpassingswet Algemene wet inkomensafhankelijke regelingen][ref4]
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018471
      [ref2]: https://wetten.overheid.nl/BWBR0018471#ArtikelIV
      [ref3]: https://wetten.overheid.nl/BWBR0018471#ArtikelV
