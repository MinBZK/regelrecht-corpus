  - number: '2.23'
    text: |-
      1 De tegemoetkoming in de onderwijsbijdrage en in de schoolkosten is afhankelijk van de hoogte van de op grond van
      [artikel 7, eerste lid, van de Algemene wet inkomensafhankelijke regelingen][ref1] berekende draagkracht.

      2 Volledige tegemoetkoming ingevolge de [hoofdstukken 4][ref2] en [5][ref3] bestaat tot en met het grensbedrag van
      de draagkracht. Naar de maatstaf van het schooljaar of studiejaar 2012–2013 bedraagt het grensbedrag € 32 142,16 .

      3 Indien het toe te kennen bedrag per aanvrager minder bedraagt dan € 10,–, wordt de tegemoetkoming op nihil
      gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0018472#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0012438#Hoofdstuk4
      [ref3]: https://wetten.overheid.nl/BWBR0012438#Hoofdstuk5
