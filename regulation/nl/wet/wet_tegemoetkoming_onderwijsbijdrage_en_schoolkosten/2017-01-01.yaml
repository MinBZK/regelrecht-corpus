  - number: '2.10'
    text: |-
      Voor tegemoetkoming ingevolge [hoofdstuk 4][ref1] kan een deelnemer vavo in aanmerking komen die is ingeschreven
      aan een school als bedoeld in [artikel 1.1.1, onderdeel b][ref2], en [artikel 1.4a.1 van de WEB][ref3], voorzover
      het betreft een opleiding vavo.


