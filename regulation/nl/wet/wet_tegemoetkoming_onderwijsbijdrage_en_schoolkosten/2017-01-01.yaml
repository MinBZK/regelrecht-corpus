  - number: '4.7'
    text: |-
      1 De tegemoetkoming in de onderwijsbijdrage over de maand augustus van enig kalenderjaar omvat in afwijking van
      artikel 4.4, eerste lid, tevens een voorschot op die tegemoetkoming over het schooljaar dat met die maand augustus
      aanvangt. Dit voorschot bedraagt ten hoogste de verschuldigde onderwijsbijdrage en wordt niet uitbetaald.

      2 Indien de tegemoetkoming in de onderwijsbijdrage lager is dan de verschuldigde onderwijsbijdrage, omvat het
      voorschot, bedoeld in het eerste lid, tevens een voorschot op de tegemoetkoming in de schoolkosten. Het voorschot
      bedraagt ten hoogste de verschuldigde onderwijsbijdrage.
    url: https://wetten.overheid.nl/BWBR0012438/2017-01-01#Artikel4.7
  - number: '4.8'
    text: |-
      1 Onze Minister kent een tegemoetkoming toe aan de leerling die daartoe een aanvraag heeft ingediend en die voldoet
      aan de voorschriften gegeven bij of krachtens deze wet.

      2 Onze Minister besluit op een aanvraag om tegemoetkoming indien de aanvraag is ingediend:

      a. vóór 1 november van het jaar voorafgaand aan het kalenderjaar waarop de tegemoetkoming betrekking heeft: vóór 31
      december van dat voorafgaande jaar, en

      b. na het onder a bedoelde tijdstip: binnen 8 weken na de indiening van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0012438/2017-01-01#Artikel4.8
  - number: '4.9'
    text: |-
      Indien het op basis van de verstrekte gegevens onmogelijk is de draagkracht vast te stellen, kent Onze Minister de
      basistoelage toe.
    url: https://wetten.overheid.nl/BWBR0012438/2017-01-01#Artikel4.9
  - number: '4.10'
    text: |-
      1 Tegemoetkoming wordt toegekend per kalenderjaar of een gedeelte daarvan, met dien verstande dat deze periode ten
      minste 1 kalendermaand is.

      2 Tegemoetkoming wordt niet toegekend voor een periode die gelegen is voor de datum van indiening van de aanvraag.

      3 Aan de leerling die reeds een tegemoetkoming ontvangt en een aanvraag heeft ingediend om in aanmerking te komen
      voor een verhoging van de basistoelage wordt, in afwijking van het tweede lid, de verhoging toegekend met ingang
      van de maand waarin de aanvraag tot verhoging is ingediend. Aan de leerling die reeds een tegemoetkoming ontvangt
      en een aanvraag heeft ingediend om in aanmerking te komen voor een tegemoetkoming in de onderwijsbijdrage of
      in de schoolkosten wordt, in afwijking van het tweede lid, de tegemoetkoming in de onderwijsbijdrage of in de
      schoolkosten toegekend met ingang van de maand waarvoor voor het eerst een tegemoetkoming is toegekend.
    url: https://wetten.overheid.nl/BWBR0012438/2017-01-01#Artikel4.10
  - number: '4.11'
    text: |-
      Op aanvraag van een uitwonende leerling wordt het niet toe te kennen deel van de maximale tegemoetkoming in de
      onderwijsbijdrage en in de schoolkosten toegekend in de vorm van lening. Voorwaarde voor die toekenning is dat de
      leerling gelijktijdig met de aanvraag aan Onze Minister een door hemzelf ondertekende verklaring verstrekt dat zijn
      TOS-ouder en diens partner beide weigeren bij te dragen in zijn schoolkosten. Die verklaring wordt mede ondertekend
      door een schooldecaan ten blijke dat zij naar zijn kennis juist is.
    url: https://wetten.overheid.nl/BWBR0012438/2017-01-01#Artikel4.11
  - number: '4.12'
    text: |-
      1 De tegemoetkoming van de leerling die is ingeschreven aan een school als bedoeld in de
      [artikelen 2.9, onderdelen a, b en c][ref1], of [2.10][ref2], of ingeschreven voor een cursus als bedoeld in
      [artikel 2.9, onderdeel d][ref3], en die zonder geldige reden niet aan het onderwijs heeft deelgenomen gedurende
      een aaneengesloten periode van ten minste 5 weken, bestaat geheel uit lening met ingang van de eerste dag van de
      maand volgend op de maand waarin de afwezigheid zonder geldige reden aanving. De periode van 5 weken wordt verlengd
      met de weken waarin vanwege vakantie geen onderwijs werd verzorgd.

      2 In afwijking van het eerste lid kan bij ministeriële regeling worden bepaald dat voor soorten van voortgezet
      onderwijs of voor soorten van vavo het eerste lid van overeenkomstige toepassing is, indien een leerling in een of
      meer vakken zonder geldige reden niet aan het onderwijs heeft deelgenomen.

      3 Onder afwezigheid met geldige reden wordt uitsluitend verstaan afwezigheid wegens ziekte van de leerling, welke
      ziekte uitsluitend kan worden aangetoond door middel van een gedagtekende verklaring van een arts, of afwezigheid
      wegens bijzondere familieomstandigheden.


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Artikel2.9
      [ref2]: https://wetten.overheid.nl/BWBR0012438#Artikel2.10
      [ref3]: https://wetten.overheid.nl/BWBR0012438#Artikel2.9
    url: https://wetten.overheid.nl/BWBR0012438/2017-01-01#Artikel4.12
    references:
      - id: ref1
        bwb_id: BWBR0012438
        artikel: '2.9'
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref2
        bwb_id: BWBR0012438
        artikel: '2.10'
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref3
        bwb_id: BWBR0012438
        artikel: '2.9'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: '4.13'
    text: |-
      Artikel 4.12 is niet van toepassing met ingang van de eerste dag van de maand volgend op de maand waarin de
      leerling weer aan het onderwijs is gaan deelnemen, voorzover de tegemoetkoming niet reeds mede op grond van
      artikel 4.11 de vorm van lening had. Voorwaarde voor de toepassing van de vorige volzin is dat de leerling aan het
      onderwijs is gaan deelnemen binnen 8 weken na de aanvang van de periode van 5 weken. De periodes van 5 en 8 weken
      worden verlengd met de weken waarin vanwege vakantie geen onderwijs werd verzorgd.
    url: https://wetten.overheid.nl/BWBR0012438/2017-01-01#Artikel4.13
  - number: '4.14'
    text: |-
      1 Het bestuur van de rechtspersoon waarvan de school, bedoeld in de [artikelen 2.9, onderdelen b, c en d][ref1],
      of [2.10][ref2] voor zover het betreft een school als bedoeld in [artikel 1.4a.1 van de WEB][ref3], uitgaat of de
      natuurlijke persoon die deze school in stand houdt, stelt uiterlijk op de derde werkdag na afloop van een periode
      van afwezigheid van 4 weken de leerling in kennis dat daarvan in de administratie van de school een aantekening is
      gemaakt en verzoekt de leerling om opgaaf van de reden van de afwezigheid.

      2 Uiterlijk op de vijfde werkdag na de periode van 8 weken stelt het bestuur van de rechtspersoon of de natuurlijke
      persoon vast:

      a. of de reden die de leerling binnen 8 weken na de aanvang van de periode van 5 weken gaf voor zijn afwezigheid,
      een geldige is, of

      b. dat de leerling binnen 8 weken na de aanvang van de periode van 5 weken geen reden heeft opgegeven voor zijn
      afwezigheid.

      3 Het bestuur van de rechtspersoon of de natuurlijke persoon stelt tevens uiterlijk op de vijfde werkdag na afloop
      van de periode van 8 weken vast of de leerling voor het einde van die periode weer aan het onderwijs is gaan
      deelnemen.

      4 Het bestuur van de rechtspersoon of de natuurlijke persoon meldt uiterlijk de vijfde werkdag na afloop van een
      periode van 8 weken aan Onze Minister dat de leerling die gedurende een aaneengesloten periode van ten minste
      5 weken zonder opgave van geldige reden niet aan het onderwijs heeft deelgenomen. Tevens meldt hij, indien die
      leerling voor het einde van die periode van 8 weken weer aan het onderwijs is gaan deelnemen, de datum daarvan.

      5 De periodes van 5 en 8 weken worden verlengd met de weken waarin vanwege vakantie geen onderwijs werd verzorgd.

      6 Het bestuur van de rechtspersoon of de natuurlijke persoon stuurt gelijktijdig met de mededelingen, bedoeld in
      het vierde lid, een afschrift van de gegevens die over de betrokkene aan Onze Minister zijn verstrekt, aan deze
      betrokkene en geeft daarbij tevens aan dat afwezigheid als bedoeld in [artikel 4.12][ref4], gevolgen heeft voor de
      tegemoetkoming van betrokkene, alsmede welke beroepsgang voor betrokkene open staat tegen de mededelingen, bedoeld
      in het vierde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Artikel2.9
      [ref2]: https://wetten.overheid.nl/BWBR0012438#Artikel2.10
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel1.4a.1
      [ref4]: https://wetten.overheid.nl/BWBR0012438#Artikel4.12
    url: https://wetten.overheid.nl/BWBR0012438/2017-01-01#Artikel4.14
    references:
