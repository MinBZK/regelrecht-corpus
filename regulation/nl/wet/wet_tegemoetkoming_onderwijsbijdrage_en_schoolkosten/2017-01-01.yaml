  - number: '9.4'
    text: |-
      1 De natuurlijke persoon van wie of het bestuur van de rechtspersoon waarvan een school als bedoeld in de
      [paragrafen 2.3][ref1] en [2.4][ref2] uitgaat, is verplicht op een bij ministeriële regeling aan te geven wijze
      kosteloos inlichtingen te verstrekken, benodigd voor de uitvoering van deze wet.

      2 De natuurlijke persoon van wie of het bestuur van de rechtspersoon waarvan een school als bedoeld in
      de [artikelen 2.9, onderdelen a tot en met d][ref3], en [2.10][ref4] uitgaat, is verplicht voor 1 mei
      aan Onze Minister te melden indien onderwijs dat in dat schooljaar voldeed aan de voorwaarden, genoemd in
      [artikel 2.18][ref5], in het daaropvolgende schooljaar niet aan deze voorwaarde zal voldoen.


