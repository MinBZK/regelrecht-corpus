  - number: '1.8'
    text: |-
      Op deze wet, met uitzondering van [hoofdstuk 10][ref1], zijn van toepassing van de
      [Algemene wet inkomensafhankelijke regelingen][ref2]:

      a. [artikel 6][ref3],

      b. [ artikel 7, eerste lid][ref4], met dien verstande dat voor de toepassing van [hoofdstuk 4][ref5] voor
      «belanghebbende» gelezen wordt: TOS-ouder,

      c. [artikel 9, eerste en tweede lid][ref6], en

      d. [artikel 10, eerste lid][ref7].


