  - number: '11.1'
    text: |-
      1 Per 1 januari van ieder kalenderjaar past Onze Minister de bedragen, genoemd in de
      [artikelen 2.23, tweede lid][ref1], [4.3][ref2], [4.6][ref3], [5.4][ref4], [5.10][ref5], [10.5, tweede lid][ref6],
      en [10.7, derde lid][ref7], aan op een bij of krachtens algemene maatregel van bestuur aan te geven wijze aan de
      hand van de loon- of prijsontwikkelingen in het tweede daaraan voorafgaande kalenderjaar. De aangepaste bedragen
      treden in de plaats van de in de eerste volzin bedoelde bedragen.

      2 Bij algemene maatregel van bestuur kunnen de maatstaven, genoemd in de [artikelen 4.3][ref8], [4.6][ref9] en
      [5.10][ref10], alsmede de bedragen, genoemd in die artikelen, worden gewijzigd.

      3 De voordracht voor een krachtens het tweede lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.


