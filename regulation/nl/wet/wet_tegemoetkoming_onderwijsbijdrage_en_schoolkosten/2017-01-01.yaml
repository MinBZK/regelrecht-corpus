  - number: '5.1'
    text: |-
      Deze afdeling is van toepassing op studenten die als student zijn ingeschreven aan een school als bedoeld in
      artikel 2.11 of op degenen die onder de reikwijdte van artikel 2.12 vallen en die geen aanspraak hebben op
      studiefinanciering ingevolge de [Wet studiefinanciering 2000][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011453
    url: https://wetten.overheid.nl/BWBR0012438/2017-01-01#Artikel5.1
    references:
      - id: ref1
        bwb_id: BWBR0011453
  - number: '5.2'
    text: |-
      De tegemoetkoming in de zin van deze afdeling bestaat uit:

      a. tegemoetkoming in de onderwijsbijdrage, en

      b. tegemoetkoming in de schoolkosten.
    url: https://wetten.overheid.nl/BWBR0012438/2017-01-01#Artikel5.2
  - number: '5.3'
    text: De tegemoetkoming in de onderwijsbijdrage bedraagt € 567,23.
    url: https://wetten.overheid.nl/BWBR0012438/2017-01-01#Artikel5.3
  - number: '5.4'
    text: De tegemoetkoming in de schoolkosten bedraagt naar de maatstaf van 1 januari 2008 € 647,16 .
    url: https://wetten.overheid.nl/BWBR0012438/2017-01-01#Artikel5.4
  - number: '5.5'
    text: |-
      1 Onze Minister kent een tegemoetkoming toe aan de student die daartoe een aanvraag heeft ingediend en die voldoet
      aan de voorschriften gegeven bij of krachtens deze wet.

      2 Een aanvraag om tegemoetkoming wordt jaarlijks voor het einde van het desbetreffende studiejaar gedaan.

      3 Onze Minister besluit op een aanvraag om tegemoetkoming indien de aanvraag is ingediend:

      a. voor de aanvang van het desbetreffende studiejaar: binnen 8 weken na de aanvang van dat studiejaar, en

      b. gedurende het desbetreffende studiejaar: binnen 8 weken na de indiening van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0012438/2017-01-01#Artikel5.5
  - number: '5.6'
    text: |-
      1 Tegemoetkoming wordt toegekend per studiejaar en eenmaal per studiejaar uitbetaald op een bij ministeriële
      regeling te bepalen tijdstip.

      2 Tegemoetkoming wordt niet toegekend over de maanden waarin de student niet is ingeschreven.
    url: https://wetten.overheid.nl/BWBR0012438/2017-01-01#Artikel5.6
  - number: '5.7'
    text: |-
      Deze afdeling is van toepassing op leerlingen die zijn ingeschreven aan een opleiding als bedoeld in
      [artikel 2.13][ref1] en die geen aanspraak hebben op tegemoetkoming ingevolge de [hoofdstukken 4][ref2] of
      [10][ref3] of op studiefinanciering ingevolge de [Wet studiefinanciering 2000][ref4].


