  - number: '2.9'
    text: |-
      Voor tegemoetkoming ingevolge [hoofdstuk 4][ref1] kan een scholier in aanmerking komen die is ingeschreven:

      a. aan een school die op grond van de [WVO][ref2], de [WEC][ref3] of de [Experimentenwet onderwijs][ref4]
      volledig en rechtstreeks uit de openbare kas wordt bekostigd, waaronder het volgen van onderwijs in de vorm van
      contractactiviteiten niet is mede begrepen;

      b. aan een op grond van [artikel 56 van de WVO][ref5] aangewezen school;

      c. aan een school die is erkend op grond van de [Wet op de erkende onderwijsinstellingen][ref6] voor zover de
      gevolgde cursus onder de reikwijdte van die wet valt; of

      d. voor een cursus die wordt bekostigd op grond van [artikel 73 van de WVO][ref7].


