  - number: '5.8'
    text: |-
      De tegemoetkoming in de zin van deze afdeling bestaat uit:

      a. tegemoetkoming in de onderwijsbijdrage, en

      b. tegemoetkoming in de schoolkosten.
    url: https://wetten.overheid.nl/BWBR0012438/2017-01-01#Artikel5.8
  - number: '5.9'
    text: |-
      1 De hoogte van de tegemoetkoming is afhankelijk van de periode waarin en van het aantal minuten per week dat
      de leerling onderwijs volgt. De hoogte van de tegemoetkoming in de onderwijsbijdrage en in de schoolkosten is
      opgenomen in [artikel 5.10][ref1].

      2 Indien de leerling zijn studie na 30 september wegens ziekte staakt, wordt de tegemoetkoming in de schoolkosten
      in afwijking van de overzichten 1 en 2, bedoeld in [artikel 5.10][ref2] niet verminderd.


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Artikel5.10
