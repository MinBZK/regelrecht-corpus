  - number: '8.1'
    text: |-
      1 Met betrekking tot de uitbetaling van de tegemoetkoming en de verrekening van het toegekende bedrag aan
      tegemoetkoming met de aan Onze Minister verschuldigde onderwijsbijdrage, worden bij ministeriële regeling regels
      gesteld.

      2 Indien een toegekend bedrag aan tegemoetkoming 12 maanden na het einde van het kalenderjaar waarin de
      desbetreffende beschikking is gegeven, niet kan worden uitbetaald als gevolg van nalatigheid van degene aan wie die
      beschikking is gericht, verrekent Onze Minister het toegekende bedrag aan tegemoetkoming met het niet uitbetaalde
      bedrag.

      3 Indien een leerling in de loop van een schooljaar ophoudt leerling te zijn in de zin van hoofdstuk 4 en hij
      niet in de loop van datzelfde schooljaar leerling wordt aan een school waarvoor lesgeld verschuldigd is, wordt het
      restant van de in het eerste lid bedoelde tegemoetkoming in de onderwijsbijdrage niet teruggevorderd of verrekend.
    url: https://wetten.overheid.nl/BWBR0012438/2017-01-01#Artikel8.1
  - number: '8.2'
    text: |-
      Onze Minister vaardigt een dwangbevel uit aan de nalatige, indien een bij of krachtens deze wet verschuldigd bedrag
      geheel of gedeeltelijk niet tijdig is voldaan.
    url: https://wetten.overheid.nl/BWBR0012438/2017-01-01#Artikel8.2
  - number: '9.1'
    text: |-
      Het toezicht door de inspectie, bedoeld in de [Wet op het onderwijstoezicht][ref1], heeft mede betrekking op de
      vraag of de school of de opleiding voldoet aan de van toepassing zijnde voorwaarden, bedoeld in de artikelen 2.17,
      2.18 en 4.14, derde tot en met zesde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0013800
    url: https://wetten.overheid.nl/BWBR0012438/2017-01-01#Artikel9.1
    references:
      - id: ref1
        bwb_id: BWBR0013800
  - number: '9.2'
    text: |-
      1 Een ieder is verplicht aan Onze Minister of aan een daartoe door of vanwege Onze Minister aangewezen persoon of
      instantie desgevraagd de ten behoeve van de uitvoering van deze wet benodigde inlichtingen over zichzelf te geven.

      2 De inlichtingen worden verstrekt binnen een door Onze Minister of door een in het eerste lid bedoelde persoon of
      instantie te stellen redelijke termijn.

      3 Inlichtingen over zichzelf, voorzover zij kunnen leiden tot de toekenning van minder tegemoetkoming worden steeds
      ongevraagd en schriftelijk verstrekt door de aanvrager, onmiddellijk na het bekend worden van die gegevens.

      4 Onze Minister kan bepalen dat de inlichtingen, bedoeld in het eerste tot en met het derde lid, worden verstrekt
      op een bij ministeriële regeling vast te stellen wijze.
    url: https://wetten.overheid.nl/BWBR0012438/2017-01-01#Artikel9.2
  - number: '9.3'
    text: |-
      Een studentendecaan aan een op grond van de [WHW][ref1] uit 's Rijks kas bekostigde instelling voor hoger onderwijs
      kan zich, in afwijking van [artikel 5:17 van de Algemene wet bestuursrecht][ref2] bij de verplichting tot inzage
      van gegevens en bescheiden en het verstrekken van inlichtingen, verschonen betreffende hetgeen een leerling of
      student aan hem heeft toevertrouwd.


      [ref1]: https://wetten.overheid.nl/BWBR0005682
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel517
