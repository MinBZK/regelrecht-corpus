  - number: '10.3'
    text: |-
      Voor tegemoetkoming kan een student in aanmerking komen die als student is ingeschreven aan een instelling als
      bedoeld in [artikel 2.11][ref1] voor een lerarenopleiding in vakken waarin een tekort aan leraren bestaat. Het
      betreft de vakken die bij ministeriële regeling op grond van hoofdstuk IV van de Wet tegemoetkoming studiekosten op
      31 juli 2001 zijn aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Artikel2.11
