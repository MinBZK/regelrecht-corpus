      Indien een school als bedoeld in de [artikelen 2.9, onderdelen a tot en met c][ref1], en [2.10][ref2], niet
      uiterlijk 1 mei de gegevens, bedoeld in [artikel 9.4, tweede lid][ref3], heeft verstrekt, ontstaat er een vordering
