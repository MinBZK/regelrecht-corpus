  - number: '12.12'
    text: |-
      In afwijking van [artikel III van de Vierde tranche Algemene wet bestuursrecht][ref1]
      is de [Algemene wet bestuursrecht][ref2] zoals die geldt na inwerkingtreding van de
      [Vierde tranche Algemene wet bestuursrecht][ref3] van toepassing op alle betalingen op grond van de Wet
      tegemoetkomingen onderwijsbijdrage en schoolkosten.


