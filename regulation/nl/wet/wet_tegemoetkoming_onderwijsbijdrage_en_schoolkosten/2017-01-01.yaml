  - number: '7.3'
    text: |-
      1 Indien een herzieningsbeschikking als bedoeld in [artikel 7.1, eerste en tweede lid][ref1], of een beslissing
      op bezwaar daartoe aanleiding geeft, wordt het bedrag van de tegemoetkoming dat teveel is uitbetaald, door de
      aanvrager terugbetaald of met hem verrekend.

      2 Indien een herzieningsbeschikking als bedoeld in [artikel 7.1, eerste en tweede lid][ref2], of een beslissing op
      bezwaar daartoe aanleiding geeft, wordt voorzover het bedrag waarvoor het recht om een lening af te sluiten te hoog
      is toegekend, het deel dat te hoog is toegekend en uitbetaald door de betrokkene terugbetaald of met hem verrekend.

      3 Indien na een voorlopige voorziening als bedoeld in [titel 8.3 van de Algemene wet bestuursrecht][ref3], de
      beslissing in hoofdzaak daartoe aanleiding geeft, wordt het bedrag dat op grond van de voorlopige voorziening
      teveel is uitbetaald, door de betrokkene terugbetaald of met hem verrekend.

      4 De in het eerste tot en met derde lid bedoelde terugbetaling en verrekening geschieden overeenkomstig bij
      ministeriële regeling vast te stellen redelijke terugbetalingsregels.

      5 [Artikel 4:93, vierde lid, van de Algemene wet bestuursrecht][ref4] is niet van toepassing op deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Artikel7.1
      [ref2]: https://wetten.overheid.nl/BWBR0012438#Artikel7.1
