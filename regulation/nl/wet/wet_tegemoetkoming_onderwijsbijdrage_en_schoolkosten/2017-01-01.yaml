        hoofdstuk: '2'
        paragraaf: '2.7'
  - number: '2.26'
    text: |-
      1 In geval van korting op de tegemoetkoming is de verhouding tussen de gekorte tegemoetkoming in de
      onderwijsbijdrage en die in de schoolkosten overeenkomstig de verhouding tussen de normbedragen van deze
      tegemoetkomingen op 1 augustus van het betreffende schooljaar. Deze verhouding wordt op 2 decimalen afgerond op het
      naastbij gelegen getal.

      2 Indien de toegekende gekorte tegemoetkoming, bedoeld in het eerste lid, niet meer is dan de aan Onze Minister
      verschuldigde onderwijsbijdrage, vindt geen uitbetaling plaats. Onze Minister verrekent deze tegemoetkoming met
      die onderwijsbijdrage.
    url: https://wetten.overheid.nl/BWBR0012438/2017-01-01#Artikel2.26
  - number: '2.27'
    text: |-
      Het kortingsbedrag, bedoeld in [artikel 2.25, derde lid][ref1], wordt verdeeld over het aantal telkinderen. Onder
      telkind wordt verstaan: iedere aanvrager die een TOS-ouder heeft waarbij die TOS-ouder of diens partner tevens de
      TOS-ouder is van een andere leerling die voor het desbetreffende schooljaar aanspraak heeft op tegemoetkoming in de
      zin van [hoofdstuk 4][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Artikel2.25
      [ref2]: https://wetten.overheid.nl/BWBR0012438#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0012438/2017-01-01#Artikel2.27
