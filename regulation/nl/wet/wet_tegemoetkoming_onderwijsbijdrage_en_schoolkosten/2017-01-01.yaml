        artikel: '1.8'
        hoofdstuk: '1'
  - number: '12.3'
    text: |-
      Artikel 1.5 is niet van toepassing op scholieren die voor 1 augustus volgend op het tijdstip van inwerkingtreding
      van dat artikel, een basistoelage als bedoeld in artikel 4.3 of als bedoeld in artikel 26 van de Wet tegemoetkoming
      studiekosten ontvingen.
    url: https://wetten.overheid.nl/BWBR0012438/2017-01-01#Artikel12.3
  - number: 12.3a
    text: |-
      In afwijking van [artikel 2.11][ref1] komt tot een bij koninklijk besluit te bepalen tijdstip voor tegemoetkoming
      ingevolge [afdeling 5.1][ref2] mede in aanmerking een student die is ingeschreven voor het volgen van een
      voltijdse opleiding als bedoeld in [artikel 18.64 van de WHW][ref3], voorzover die opleiding is geaccrediteerd
      als bedoeld in [artikel 1.1, onderdeel s, van de WHW][ref4] of de toets nieuwe opleiding, bedoeld in
      [artikel 1.1, onderdeel t, van de WHW][ref5], met positief gevolg heeft ondergaan.


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Artikel2.11
