      - id: ref2
        bwb_id: BWBR0012438
        artikel: '2.10'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: '4.3'
    text: |-
      De basistoelage is naar de maatstaf van 1 januari 2001 per kalendermaand voor een:

      a. thuiswonende leerling:  € 84,59 , en

      b. uitwonende leerling:  € 197,21 .
    url: https://wetten.overheid.nl/BWBR0012438/2017-01-01#Artikel4.3
  - number: '4.4'
    text: |-
      1 De tegemoetkoming in de onderwijsbijdrage voor een kalendermaand is eentwaalfde deel van het bedrag, bedoeld in
      [artikel 5, tweede lid, van de Les- en cursusgeldwet][ref1].

      2 In het schooljaar waarin een leerling de leeftijd van 18 jaren bereikt, wordt de tegemoetkoming in de
      onderwijsbijdrage voor dat schooljaar niet toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0004188#Artikel5
    url: https://wetten.overheid.nl/BWBR0012438/2017-01-01#Artikel4.4
    references:
      - id: ref1
        bwb_id: BWBR0004188
        artikel: '5'
  - number: '4.5'
    text: |-
      1 De hoogte van de tegemoetkoming in de schoolkosten voor een schooljaar is afhankelijk van:

      a. soort onderwijs, en

      b. bovenbouw of overige leerjaren.

      2 De bedragen van de onderscheiden tegemoetkomingen zijn opgenomen in [artikel 4.6][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Artikel4.6
