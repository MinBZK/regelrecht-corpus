  - number: '2.29'
    text: |-
      Voor de toepassing van [artikel 1.8, onderdeel b][ref1], en [artikel 2.25][ref2] wordt zolang het toetsingsinkomen
      over het kalenderjaar waarover het toetsingsinkomen berekend wordt, het eerste of het tweede jaar na dat
      kalenderjaar nog niet is bepaald, door Onze Minister daarvoor in de plaats gesteld een bedrag dat het
      desbetreffende toetsingsinkomen zo goed mogelijk benadert.


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Artikel1.8
      [ref2]: https://wetten.overheid.nl/BWBR0012438#Artikel2.25
