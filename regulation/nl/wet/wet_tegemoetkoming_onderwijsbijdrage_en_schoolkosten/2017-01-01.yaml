    text: |-
      De [artikelen 6.3 tot en met 6.16 van de Wet studiefinanciering 2000][ref1] zijn van overeenkomstige toepassing op
      de bedragen aan lening die op grond van deze wet zijn opgebouwd waarbij de lening wordt aangemerkt als een lening
      beroepsonderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel6.10
