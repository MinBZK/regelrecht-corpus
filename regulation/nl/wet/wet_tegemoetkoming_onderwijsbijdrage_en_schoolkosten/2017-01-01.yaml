  - number: '2.3'
    text: |-
      1 Op tegemoetkoming ingevolge [hoofdstuk 4][ref1] kan aanspraak bestaan met ingang van de eerste dag van het
      kwartaal volgend op het kwartaal waarin de leerling de leeftijd van 18 jaren heeft bereikt tot en met de maand
      waarin hij de leeftijd van 30 jaren heeft bereikt.

      2 Op tegemoetkoming ingevolge [afdeling 5.1][ref2] bestaat aanspraak ongeacht de leeftijd.

      3 Op tegemoetkoming ingevolge [afdeling 5.2][ref3] kan aanspraak bestaan met ingang van de eerste dag van het
      kwartaal volgend op het kwartaal waarin de leerling de leeftijd van 18 jaren heeft bereikt.


