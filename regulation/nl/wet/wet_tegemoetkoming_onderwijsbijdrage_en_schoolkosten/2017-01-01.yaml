  - number: '2.25'
    text: |-
      1 De tegemoetkoming wordt verminderd met een ingevolge het derde lid en [artikel 2.27][ref1] berekende korting
      wegens overschrijding van het grensbedrag, bedoeld in [artikel 2.23, tweede lid][ref2].

      2 De korting wordt niet toegepast op de basistoelage, bedoeld in [artikel 4.2, onderdeel a][ref3].

      3 De korting is 30% van het verschil tussen de draagkracht in het peiljaar en het grensbedrag, bedoeld in
      [artikel 2.23][ref4], tweede lid.

      4 Het kortingsbedrag voor een kalendermaand is de korting, bedoeld in het derde lid, gedeeld door 12.


