        bwb_id: BWBR0012438
        artikel: '4.12'
        hoofdstuk: '4'
        paragraaf: '4.4'
  - number: '2.16'
    text: |-
      1 Een student heeft geen aanspraak op tegemoetkoming indien hij gedurende 24 maanden een tegemoetkoming in de zin
      van [afdeling 5.1][ref1] heeft ontvangen of indien 48 maanden zijn verlopen gerekend vanaf de maand waarover de
      tegemoetkoming voor het eerst is toegekend. Een student heeft tevens geen aanspraak indien hij een tegemoetkoming
      ontvangt in de zin van [hoofdstuk 10][ref2].

      2 Een leerling heeft geen aanspraak op tegemoetkoming in de zin van [afdeling 5.2][ref3], indien hij een
      tegemoetkoming ontvangt in de zin van [hoofdstuk 10][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0012438#Hoofdstuk10
