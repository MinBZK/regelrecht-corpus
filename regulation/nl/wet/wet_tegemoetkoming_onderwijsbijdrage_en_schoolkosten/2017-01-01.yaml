  - number: '2.19'
    text: |-
      1 De aanspraak op tegemoetkoming ingevolge [hoofdstuk 4][ref1] vervalt met ingang van de maand die volgt op de dag
      waarop de leerling het laatste schooljaar met goed gevolg heeft afgesloten.

      2 Indien de leerling aansluitend aan het schooljaar dat als laatste schooljaar was aangemerkt, opnieuw dat laatste
      schooljaar aanvangt, ontstaat aanspraak op tegemoetkoming voor het resterende gedeelte van het kalenderjaar.

      3 Indien de leerling na zijn uitschrijving voor een opleiding binnen 4 maanden opnieuw een opleiding in de zin
      van deze wet of van de [Wet studiefinanciering 2000][ref2] aanvangt, blijft, in afwijking van het eerste lid, op
      zijn aanvraag de aanspraak op tegemoetkoming in de tussen beide opleidingen liggende periode voor ten hoogste 4
      maanden bestaan. Indien dit de maanden augustus, september, oktober of november betreft, heeft de leerling die
      op grond van [hoofdstuk 4][ref3] nog geen tegemoetkoming in de onderwijsbijdrage is toegekend en een opleiding
      als bedoeld in [artikel 2.9, onderdelen b tot en met d][ref4], of [2.10][ref5], of een opleiding waarvoor
      aanspraak op studiefinanciering bestaat, gaat volgen, over die maanden naast een tegemoetkoming in de zin van
      [hoofdstuk 4][ref6] ook aanspraak op een bedrag aan tegemoetkoming in de onderwijsbijdrage, ter grootte van
      eentwaalfde van het bedrag, bedoeld in [artikel 5, tweede lid, van de Les- en cursusgeldwet][ref7], per maand.
      Voor de vaststelling van de hoogte van de tegemoetkoming in die maanden wordt uitgegaan van de draagkracht, zoals
      die gold op 31 juli van het voorafgaande schooljaar. In afwijking van [artikel 4.10, tweede lid][ref8], wordt die
      aanvraag ingediend voor het einde van de periode van 4 maanden.


