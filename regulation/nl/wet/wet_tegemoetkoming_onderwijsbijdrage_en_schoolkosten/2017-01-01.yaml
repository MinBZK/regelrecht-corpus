  - number: '12.5'
    text: |-
      Voorzover het peiljaar een aan het kalenderjaar 2001 voorafgaand kalenderjaar is, wordt voor de toepassing van de
      artikelen 2.24, 2.29 en 10.6 onder:

      a. «de gecorrigeerde verzamelinkomens» in artikel 2.24 verstaan: de belastbare inkomens,

      b. «artikel 9.4» in artikel 2.24 verstaan: artikel 64,

      c. «het gecorrigeerde verzamelinkomen» in de artikelen 2.24 en 2.29 verstaan: het belastbare inkomen in de zin van
      de Wet op de inkomstenbelasting 1964,

      e. «het gecorrigeerde belastbare loon» in de artikelen 2.24 en 2.29 verstaan: het zuivere loon, bedoeld in
      [artikel 9 van de Wet op de loonbelasting 1964][ref1],

      f. «de [Wet inkomstenbelasting 2001][ref2]» in de artikelen 2.24 en 10.6, tweede lid, verstaan: de Wet op de
      inkomstenbelasting 1964, en

      g. «de winst uit een of meer ondernemingen, bedoeld in [artikel 3.8 van de Wet inkomstenbelasting 2001][ref3]»
      in artikel 10.6 verstaan: de winst uit onderneming, bedoeld in afdeling 2 van hoofdstuk II van de Wet op de
      inkomstenbelasting 1964.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0011353
