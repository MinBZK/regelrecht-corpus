  - number: '2.1'
    text: |-
      Deze wet regelt de tegemoetkoming en is van toepassing indien wordt voldaan aan de voorwaarden inzake:

      a. nationaliteit als bedoeld in [artikel 2.2][ref1],

      b. leeftijd als bedoeld in [artikel 2.3][ref2],

      c. onderwijssoort als bedoeld in de [paragrafen 2.3][ref3] en [2.4][ref4], en

      d. inkomen als bedoeld in [paragraaf 2.7][ref5].


