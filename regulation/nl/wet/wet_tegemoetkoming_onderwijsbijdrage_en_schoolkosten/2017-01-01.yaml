  - number: '5.11'
    text: |-
      1 Onze Minister kent een tegemoetkoming toe aan de leerling die daartoe een aanvraag heeft ingediend en die voldoet
      aan de voorschriften gegeven bij of krachtens deze wet.

      2 Een aanvraag om tegemoetkoming wordt jaarlijks voor het einde van het desbetreffende schooljaar gedaan.

      3 Onze Minister besluit op een aanvraag om tegemoetkoming indien de aanvraag is ingediend:

      a. voor de aanvang van het desbetreffende schooljaar: binnen 8 weken na de aanvang van dat schooljaar, en

      b. gedurende het desbetreffende schooljaar: binnen 8 weken na de indiening van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0012438/2017-01-01#Artikel5.11
  - number: '5.12'
    text: Tegemoetkoming wordt toegekend per schooljaar.
    url: https://wetten.overheid.nl/BWBR0012438/2017-01-01#Artikel5.12
  - number: '6.1'
    text: |-
      1 Ontvangst van een lening of omzetting in een lening als bedoeld in de artikelen 4.11, 4.12 en 4.13, of omzetting
      als bedoeld in artikel 6.2, verplicht degene die tegemoetkoming in de zin van hoofdstuk 4 heeft ontvangen tot
      terugbetaling van de lening vermeerderd met de volgens dit hoofdstuk berekende rente.
    url: https://wetten.overheid.nl/BWBR0012438/2017-01-01#Artikel6.1
  - number: '6.2'
    text: |-
      1 De schuld van een leerling in de zin van hoofdstuk 4 van wie het recht op tegemoetkoming eindigt zonder dat over
      de maand volgend op de beëindiging studiefinanciering op grond van de [Wet studiefinanciering 2000][ref1] wordt
      verstrekt, wordt van rechtswege omgezet in lening. De in de vorige volzin bedoelde lening wordt rentedragend met
      ingang van het tijdstip van die omzetting.

      2 De schuld, niet zijnde een schuld waarop artikel 6.3 van toepassing is, van een leerling in de zin van hoofdstuk
      4 van wie het recht op tegemoetkoming eindigt en aan wie over de maand volgend op de beëindiging studiefinanciering
      op grond van de [Wet studiefinanciering 2000][ref2] wordt verstrekt, wordt aangemerkt als een schuld waarop
      [artikel 7.4 van die wet][ref3] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0011453
      [ref2]: https://wetten.overheid.nl/BWBR0011453
      [ref3]: https://wetten.overheid.nl/BWBR0011453#Artikel7.4
    url: https://wetten.overheid.nl/BWBR0012438/2017-01-01#Artikel6.2
