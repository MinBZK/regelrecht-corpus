        paragraaf: '9.2'
  - number: '9.10'
    text: |-
      Overtreding van bepalingen van een krachtens deze wet uitgevaardigde algemene maatregel van bestuur, voorzover
      uitdrukkelijk als strafbaar feit in de zin van dit artikel aangeduid, wordt gestraft met hechtenis van ten hoogste
      1 maand of geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0012438/2017-01-01#Artikel9.10
  - number: '9.11'
    text: De in de artikelen 9.9 en 9.10 strafbaar gestelde feiten zijn overtredingen.
    url: https://wetten.overheid.nl/BWBR0012438/2017-01-01#Artikel9.11
  - number: '10.1'
    text: |-
      1 Dit hoofdstuk is uitsluitend van toepassing op leerlingen en studenten die op 31 juli 2001 tegemoetkoming
      ontvingen op grond van hoofdstuk IV van de Wet tegemoetkoming studiekosten.

      2 In dit hoofdstuk wordt verstaan onder:

      **leerling:** degene die onderwijs volgt als bedoeld in artikel 10.2,

      **student:** degene die hoger onderwijs volgt als bedoeld in artikel 10.3, en

      **tegemoetkoming:** tegemoetkoming in de onderwijsbijdrage en in de schoolkosten.

      3 De artikelen 2.1, 2.2, eerste, derde en vierde lid, en 2.3, derde lid, zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0012438/2017-01-01#Artikel10.1
  - number: '10.2'
    text: |-
      Voor tegemoetkoming kan een leerling in aanmerking komen die is ingeschreven voor een opleiding of een gedeelte
      daarvan aan een school als bedoeld in de [artikelen 2.5][ref1], [2.6][ref2] en [2.9, onderdeel a][ref3], of voor
      een cursus als bedoeld in [artikel 2.9, onderdeel d][ref4], die leiden tot het diploma:

      a. voorbereidend wetenschappelijk onderwijs,

      b. hoger algemeen voortgezet onderwijs, of

      c. middelbaar algemeen voortgezet onderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Artikel2.5
      [ref2]: https://wetten.overheid.nl/BWBR0012438#Artikel2.6
      [ref3]: https://wetten.overheid.nl/BWBR0012438#Artikel2.9
      [ref4]: https://wetten.overheid.nl/BWBR0012438#Artikel2.9
    url: https://wetten.overheid.nl/BWBR0012438/2017-01-01#Artikel10.2
