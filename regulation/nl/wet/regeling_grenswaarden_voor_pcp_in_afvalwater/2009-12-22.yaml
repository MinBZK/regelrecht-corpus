---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/tags/schema-v0.5.4/schema/v0.5.4/schema.json
$id: regeling_grenswaarden_voor_pcp_in_afvalwater
regulatory_layer: WET
publication_date: '2020-12-03'
valid_from: '2009-12-22'
valid_to: '2023-12-31'
bwb_id: BWBR0005479
url: https://wetten.overheid.nl/BWBR0005479/2009-12-22
preamble:
  text: |-
    Overwegende, dat het noodzakelijk is grenswaarden vast te stellen voor PCP voorkomend in afvalwater dat in
    oppervlaktewateren wordt gebracht ter uitvoering van de richtlijn van de Raad van de Europese Gemeenschappen van
    12 juni 1986 betreffende grenswaarden en kwaliteitsdoelstellingen voor lozingen van bepaalde onder lijst I van de
    bijlage van Richtlijn 76/464/EEG vallende gevaarlijke stoffen 86/280/EEG (PbEG L 181);

    Gelet op artikel 1a, derde lid, van de Wet verontreiniging oppervlaktewateren (Stb. 1981, 573);

    Besluit:
  url: https://wetten.overheid.nl/BWBR0005479/2009-12-22#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:



            a
            . PCP:

              de chemische verbinding 2,3,4,5,6-pentachloor-1-hydroxybenzeen en haar zouten (Cas nr. 87-86-5);



            b
            verwerken van PCP:

              elk industrieel proces waarbij PCP of PCP bevattende stoffen worden geproduceerd, omgezet of gebruikt, of
      waarbij PCP of PCP bevattende stoffen vrijkomen;



            c
            bestaand bedrijf:

              bedrijf dat PCP verwerkt, dat op 16 juni 1987 in werking is en waarvan de capaciteit voor het verwerken van
      PCP na 16 juni 1987 niet aanzienlijk is uitgebreid;



            d
            nieuw bedrijf:

              bedrijf dat PCP verwerkt en geen bestaand bedrijf is;



            e
            bijlage I:

              bij deze regeling behorende [bijlage I][ref1];



            f
            bijlage II:

              bij deze regeling behorende [bijlage II][ref2];



            g
            lozen:

              brengen van:
              stoffen in een oppervlaktewaterlichaam;
      afvalwater of andere afvalstoffen in een openbaar hemelwaterstelsel, een openbaar ontwateringstelsel, een openbaar
      vuilwaterriool of een andere voorziening voor de inzameling en het transport van afvalwater, of
      stoffen op een zuiveringtechnisch werk met behulp van een werk niet zijnde een voorziening voor de inzameling en
      het transport van afvalwater.


      [ref1]: https://wetten.overheid.nl/BWBR0005479
      [ref2]: https://wetten.overheid.nl/BWBR0005479
    url: https://wetten.overheid.nl/BWBR0005479/2009-12-22#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005479
      - id: ref2
        bwb_id: BWBR0005479
  - number: 1a
    text: |-
      Deze regeling berust op [artikel 6.3 van het Waterbesluit][ref1] en [artikel 8.40, eerste lid][ref2], in samenhang
      met [artikel 21.6, zesde lid, van de Wet milieubeheer][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0026872#Artikel6.3
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel8.40
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel21.6

      url: https://wetten.overheid.nl/BWBR0005479/2009-12-22#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0026872
        artikel: '6.3'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '8.40'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '21.6'
  - number: '2'
    text: |-
      Voor een nieuw bedrijf gelden, als de hoogst toelaatbare gewichtshoeveelheid en concentratie PCP voorkomend in
      afvalwater dat wordt geloosd, de grenswaarden die overeenkomen met de waarden die het resultaat zijn van toepassing
      van de beste bestaande technieken, met dien verstande dat voor een nieuw bedrijf behorende tot een van de in
      [bijlage I][ref1] genoemde bedrijfstakken, die gewichtshoeveelheid en concentratie in ieder geval niet hoger is dan
      de in die bijlage opgenomen grenswaarde die op de betrokken bedrijfstak van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0005479
    url: https://wetten.overheid.nl/BWBR0005479/2009-12-22#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005479
    machine_readable:
       open_terms:
         - id: bijlage_I_grenswaarden
           type: object
           required: true
           delegated_to: minister
           delegation_type: MINISTERIELE_REGELING
           legal_basis: artikel 2 Regeling grenswaarden voor PCP in afvalwater
           description: Grenswaarden voor PCP per bedrijfstak zoals opgenomen in bijlage I
       execution:
         parameters:
           - name: bedrijfstak
             type: string
             required: true
             description: Bedrijfstak waartoe het nieuwe bedrijf behoort
           - name: is_nieuw_bedrijf
             type: boolean
             required: true
             description: is het bedrijf een nieuw bedrijf (zoals gedefinieerd in artikel 1d)
         input:
           - name: beste_bestaande_technieken_grenswaarde
             type: object
             description: Grenswaarden afgeleid van beste bestaande technieken
             source:
               description: Extern te bepalen op basis van beste beschikbare technieken
         output:
           - name: maximaal_toegestane_gewichtshoeveelheid
             type: number
             type_spec:
               unit: kilogram
             description: Maximale toegestane gewichtshoeveelheid PCP in afvalwater
           - name: maximaal_toegestane_concentratie
             type: number
             type_spec:
               unit: milligram_per_liter
             description: Maximale toegestane concentratie PCP in afvalwater
         actions:
           - output: maximaal_toegestane_gewichtshoeveelheid
             value:
               operation: IF
               cases:
                 - when:
                     operation: IN
                     subject: $bedrijfstak
                     value: $bijlage_I_grenswaarden.bedrijfstakken
                   then: $bijlage_I_grenswaarden.grenswaarden[$bedrijfstak].gewichtshoeveelheid
               default: $beste_bestaande_technieken_grenswaarde.gewichtshoeveelheid
           - output: maximaal_toegestane_concentratie
             value:
               operation: IF
               cases:
                 - when:
                     operation: IN
                     subject: $bedrijfstak
                     value: $bijlage_I_grenswaarden.bedrijfstakken
                   then: $bijlage_I_grenswaarden.grenswaarden[$bedrijfstak].concentratie
               default: $beste_bestaande_technieken_grenswaarde.concentratie
  - number: '3'
    text: |-
      Voor een bestaand bedrijf gelden als de hoogst toelaatbare gewichtshoeveelheid en concentratie PCP voorkomend in
      afvalwater dat wordt geloosd:

      a. indien dat bedrijf behoort tot een van de in [bijlage I][ref1] genoemde bedrijfstakken: de in die bijlage voor
      die bedrijfstak opgenomen grenswaarde;

      b. indien dat bedrijf niet behoort tot een in [bijlage I][ref2] genoemde bedrijfstak: de grenswaarden die op
      31 december 1987 overeenkomen met de waarden die het resultaat zijn van de toepassing van de beste bestaande
      technieken.


      [ref1]: https://wetten.overheid.nl/BWBR0005479
      [ref2]: https://wetten.overheid.nl/BWBR0005479
    url: https://wetten.overheid.nl/BWBR0005479/2009-12-22#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005479
      - id: ref2
        bwb_id: BWBR0005479
    machine_readable:
       open_terms:
         - id: bijlage_I_grenswaarden
           type: object
           required: true
           delegated_to: minister
           delegation_type: MINISTERIELE_REGELING
           legal_basis: artikel 3 Regeling grenswaarden voor PCP in afvalwater
           description: Grenswaarden voor PCP per bedrijfstak zoals opgenomen in bijlage I
       execution:
         parameters:
           - name: bedrijfstak
             type: string
             required: true
             description: Bedrijfstak waartoe het bestaande bedrijf behoort
           - name: is_bestaand_bedrijf
             type: boolean
             required: true
             description: is het bedrijf een bestaand bedrijf (zoals gedefinieerd in artikel 1c)
         input:
           - name: beste_bestaande_technieken_1987_grenswaarde
             type: object
             description: Grenswaarden afgeleid van beste bestaande technieken per 31 december 1987
             source:
               description: Extern te bepalen op basis van beste beschikbare technieken per 31 december 1987
         output:
           - name: maximaal_toegestane_gewichtshoeveelheid
             type: number
             type_spec:
               unit: kilogram
             description: Maximale toegestane gewichtshoeveelheid PCP in afvalwater voor bestaand bedrijf
           - name: maximaal_toegestane_concentratie
             type: number
             type_spec:
               unit: milligram_per_liter
             description: Maximale toegestane concentratie PCP in afvalwater voor bestaand bedrijf
         actions:
           - output: maximaal_toegestane_gewichtshoeveelheid
             value:
               operation: IF
               cases:
                 - when:
                     operation: IN
                     subject: $bedrijfstak
                     value: $bijlage_I_grenswaarden.bedrijfstakken
                   then: $bijlage_I_grenswaarden.grenswaarden[$bedrijfstak].gewichtshoeveelheid
               default: $beste_bestaande_technieken_1987_grenswaarde.gewichtshoeveelheid
           - output: maximaal_toegestane_concentratie
             value:
               operation: IF
               cases:
                 - when:
                     operation: IN
                     subject: $bedrijfstak
                     value: $bijlage_I_grenswaarden.bedrijfstakken
                   then: $bijlage_I_grenswaarden.grenswaarden[$bedrijfstak].concentratie
               default: $beste_bestaande_technieken_1987_grenswaarde.concentratie
  - number: '4'
    text: |-
      De wijze van meting van de gewichtshoeveelheid en concentratie PCP, bedoeld in de artikelen 2 en 3, dient ten
      minste te voldoen aan de in bijlage II daaraan gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0005479/2009-12-22#Artikel4
    machine_readable:
       open_terms:
         - id: bijlage_II_metingseisen
           type: object
           required: true
           delegated_to: minister
           delegation_type: MINISTERIELE_REGELING
           legal_basis: artikel 4 Regeling grenswaarden voor PCP in afvalwater
           description: Metingseisen voor PCP zoals opgenomen in bijlage II
       execution:
         parameters:
           - name: meetmethode
             type: string
             required: true
             description: Gekozen meetmethode voor PCP meting
         input:
           - name: geselecteerde_meetmethode
             type: object
             description: De meetmethode die wordt toegepast
             source:
               description: Extern te bepalen meetmethode
         output:
           - name: voldoet_aan_minimale_eisen
             type: boolean
             description: Indicatie of de meetmethode voldoet aan bijlage II eisen
         actions:
           - output: voldoet_aan_minimale_eisen
             value:
               operation: INCLUDES
               subject: $bijlage_II_metingseisen.eisen
               value: $geselecteerde_meetmethode.eigenschappen
  - number: '5'
    text: |-
      De Regeling van de Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 14 december 1987,
      houdende regelen met betrekking tot grenswaarden voor pentachloorfenol (Stb. 589) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0005479/2009-12-22#Artikel5
  - number: '6'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de datum van uitgifte van het Staatsblad waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0005479/2009-12-22#Artikel6
  - number: '7'
    text: 'Deze regeling kan worden aangehaald als: Regeling grenswaarden voor PCP in afvalwater.'
    url: https://wetten.overheid.nl/BWBR0005479/2009-12-22#Artikel7
