preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de Verklaring arbeidsrelatie af te schaffen met het
    oog op de bevordering van deregulering, verbetering van de balans tussen de verantwoordelijkheid van opdrachtgevers
    en opdrachtnemers voor de presentatie van hun onderlinge arbeidsrelatie richting de Belastingdienst en verbetering
    van de handhaafbaarheid van de gevolgen van het onderscheid tussen de verschillende vormen van inkomen uit
    tegenwoordige arbeid;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0037602/2016-05-01#ArtikelAanhef
articles:
  - number: VII
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0037602/2016-05-01#ArtikelVII
  - number: VIII
    text: |-
      De op grond van de [artikelen 3.156][ref1] en [3.157 van de Wet inkomstenbelasting 2001][ref2] gegeven
      beschikkingen die betrekking hebben op een periode die na 31 december 2013 is aangevangen, gelden in afwijking
      van artikel 3.156, vierde lid, van de Wet inkomstenbelasting 2001 ten hoogste tot het tijdstip, bedoeld in
      [artikel IX, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3.156
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3.157
