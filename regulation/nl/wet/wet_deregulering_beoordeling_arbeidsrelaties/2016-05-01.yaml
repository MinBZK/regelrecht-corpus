  - number: VIIIa
    text: |-
      Onze Minister van Financiën zendt binnen drie jaar na de inwerkingtreding van deze wet aan de Staten-Generaal een
      verslag over de doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0037602/2016-05-01#ArtikelVIIIa
  - number: IX
    text: |-
      1 Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.

      2 In afwijking van het eerste lid treedt [artikel VIII][ref1] in werking op de dag na de datum van uitgifte van het
      Staatsblad waarin deze wet wordt geplaatst.


