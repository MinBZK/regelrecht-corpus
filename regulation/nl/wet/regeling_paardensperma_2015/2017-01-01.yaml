---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: regeling_paardensperma_2015
regulatory_layer: WET
publication_date: '2021-04-16'
valid_from: '2017-01-01'
bwb_id: BWBR0035708
url: https://wetten.overheid.nl/BWBR0035708/2017-01-01
preamble:
  text: |-
    Gelet op de artikelen 15 en 18 van het Besluit eisen dierlijk sperma en spermawincentra;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder: - *besluit:* [Besluit eisen dierlijk sperma en spermawincentra][ref1];
        - *bokmerrie:* geslachtsrijpe paardachtige van het vrouwelijk geslacht die op het spermawincentrum verblijft om de
      hengsten te stimuleren tot springen in de winningsruimte;
        - *CEM:* Contagieuze Equine Metritis;
        - *dierenarts van het centrum:* dierenarts-practicus verbonden aan het paardenspermawincentrum;
        - *EVA:* Equine Virus Artritis;
        - *hengst:* geslachtsrijpe paardachtige van het mannelijk geslacht die kennelijk bestemd is voor de fokkerij;
        - *KI-station:* station voor kunstmatige inseminatie;
        - *keuringsdierenarts:* officiële dierenarts verbonden aan de NVWA;
        - *NVWA:* Nederlandse Voedsel- en Warenautoriteit;
        - *richtlijn 92/65/EEG:* [Richtlijn 92/65/EEG](31992L0065) van de Raad van Europese Gemeenschappen van 13 juli 1992
      tot vaststelling van de veterinairrechtelijke voorschriften voor het handelsverkeer en de invoer in de Gemeenschap
      van dieren, sperma, eicellen en embryo's waarvoor ten aanzien van de veterinairrechtelijke voorschriften geen
      specifieke communautaire regelgeving als bedoeld in bijlage A, onder I, van [Richtlijn 90/425/EEG](31990L0425)
      geldt (PbEG L 268);
        - *richtlijn 2009/156/EG:* [Richtlijn 2009/156/EG](32009L0156) van de Raad van 30 november 2009 tot vaststelling
      van veterinairrechtelijke voorschriften voor het verkeer van paardachtigen en de invoer van paardachtigen uit derde
      landen (PbEU L 192);
        - *seizoensgebonden fokkerij:* het winnen van vers sperma gedurende het seizoen lopend van 1 januari tot en met
      15 augustus;
        - *winning:* hoeveelheid sperma die op een bepaald moment van een donor is verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0010619
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0010619
  - number: '2.1'
    text: |-
      Degene die ingevolge deze regeling gegevens bijhoudt of vermeldt op daartoe bestemde bescheiden, doet dit volledig,
      juist en naar waarheid.
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel2
  - number: '2.2'
    text: |-
      Het bijhouden of vermelden van de in het eerste lid bedoelde gegevens geschiedt onverwijld nadat de gegevens bekend
      zijn bij degene die deze ingevolge deze regeling bijhoudt of vermeldt.
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel2
  - number: '3.1'
    text: |-
      De eigenaar of de exploitant van een paardenspermawincentrum dan wel diens vertegenwoordiger beschikt over een
      vanuit één plaats op het paardenspermawincentrum te raadplegen register, dat zodanig is ingericht, dat daaruit op
      elk moment op eenvoudige wijze met betrekking tot elke winning kan worden afgeleid:
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel3
  - number: 3.1.a
    text: het aan de winning toegekende identificatienummer;
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel3
  - number: 3.1.b
    text: de datum van de winning en behandeling;
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel3
  - number: 3.1.c
    text: de eventuele calamiteiten die zich bij de winning hebben voorgedaan;
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel3
  - number: 3.1.d
    text: het identificatienummer van de hengst waarvan het sperma is gewonnen, en
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel3
  - number: 3.1.e
    text: het aantal doses waarin de winning is verdeeld.
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel3
  - number: '3.2'
    text: |-
      De in het eerste lid bedoelde gegevens worden bewaard tot drie jaar nadat de laatste dosis van de betrokken winning
      van het paardenspermawincentrum is afgevoerd.
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel3
  - number: '4'
    text: |-
      De eigenaar of de exploitant van een paardenspermawincentrum dan wel diens vertegenwoordiger beschikt over een
      administratie waarmee de keuringsdierenarts op elk moment een overzicht kan worden geboden van het sperma dat
      in het paardenspermawincentrum gewonnen dan wel opgeslagen is, en die de tracering van contacten tussen het
      paardenspermawincentrum met inseminatoren, dierenartsen, vervoerders, handelaren en gebruikers van het sperma
      inzichtelijk maakt.
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel4
  - number: '5.1'
    text: |-
      De in [artikel 4][ref1] bedoelde administratie is zodanig ingericht, dat daaruit op elk moment op eenvoudige wijze
      met betrekking tot elke relevante transactie kan worden afgeleid:


      [ref1]: https://wetten.overheid.nl/BWBR0035708#Artikel4
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0035708
        artikel: '4'
        paragraaf: '1'
  - number: 5.1.a
    text: de datum van de transactie;
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel5
  - number: 5.1.b
    text: het identificatienummer van het betrokken sperma;
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel5
  - number: 5.1.c
    text: het ontvangen of afgeleverde aantal doses sperma;
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel5
  - number: 5.1.d
    text: naam en adres van de ontvanger of de leverancier;
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel5
  - number: 5.1.e
    text: het paardenspermawincentrum waar het sperma gewonnen is, en
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel5
  - number: 5.1.f
    text: |-
      indien het buiten Nederland gewonnen sperma betreft, het nummer van het
      gezondheidscertificaat, bedoeld in [artikel 9.5, eerste lid, onderdeel c][ref1], of in
      [artikel 9.6, derde lid, onderdeel c, van de Regeling handel levende dieren en levende producten][ref2], alsmede de
      datum waarop dit sperma binnen Nederland is gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0007049#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0007049#Artikel9
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007049
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0007049
        artikel: '9'
  - number: '5.2'
    text: |-
      De in het eerste lid bedoelde gegevens worden bewaard tot drie jaar nadat het betrokken sperma van het
      paardenspermawincentrum is afgevoerd.
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel5
  - number: '6.1'
    text: |-
      Voor zover het sperma bij merries wordt geïnsemineerd die zich op een KI-station bevinden welke zich op
      dezelfde kadastrale eenheid bevindt als het paardenspermawincentrum, houdt de eigenaar of de exploitant van een
      paardenspermawincentrum dan wel diens vertegenwoordiger tevens de administratie bij inzake:
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel6
  - number: 6.1.a
    text: de datum van de inseminatie;
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel6
  - number: 6.1.b
    text: het identificatienummer van het betrokken sperma, en
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel6
  - number: 6.1.c
    text: het identificatienummer van het geïnsemineerde dier.
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel6
  - number: '6.2'
    text: |-
      De in het eerste lid bedoelde gegevens worden bewaard tot drie jaar nadat het betrokken sperma van het
      paardenspermawincentrum op het KI-station bij het paardenspermawincentrum is geïnsemineerd.
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel6
  - number: '7'
    text: |-
      Een partij sperma is gedurende het vervoer en de verhandeling voorzien van een document, bedoeld in
      [artikel 17, eerste of tweede lid][ref1], of als bedoeld in [artikel 29][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0035708#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0035708#Artikel29
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0035708
        artikel: '17'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0035708
        artikel: '29'
        paragraaf: '3'
  - number: '8'
    text: |-
      Dit hoofdstuk is van toepassing op paardenspermawincentra die niet enkel sperma winnen voor de nationale markt,
      maar tevens voor het intracommunautaire handelsverkeer en het handelsverkeer naar derde landen.
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel8
  - number: '9'
    text: Het paardenspermawincentrum voldoet aan Bijlage D, hoofdstuk I, van [richtlijn 92/65/EEG](31992L0065).
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel9
  - number: '10.1'
    text: |-
      De op het paardenspermawincentrum aanwezige hengsten voldoen aan Bijlage D, Hoofdstuk II, onderdeel I van
      [richtlijn 92/65/EEG](31992L0065).
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel10
  - number: '10.2'
    text: |-
      De op het paardenspermawincentrum aanwezige overige dan in het eerste lid bedoelde paardachtigen voldoen aan
      Bijlage D, Hoofdstuk II, onderdeel I, subonderdeel 1, punt 1.1, punt 1.2, punt 1.3, punt 1.4 en punt 1.5 van
      [richtlijn 92/65/EEG](31992L0065).
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel10
  - number: '11'
    text: |-
      Het winnen, bewerken en opslaan van paardensperma geschiedt voor zover van toepassing overeenkomstig Bijlage D,
      hoofdstuk III, van [richtlijn 92/65/EEG](31992L0065).
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel11
  - number: '12.1'
    text: |-
      Ten behoeve van het toezicht, bedoeld in Bijlage D, Hoofdstuk I, van [richtlijn 92/65/EEG](31992L0065), heeft de
      eigenaar of de exploitant van een paardenspermawincentrum dan wel diens vertegenwoordiger voorzien in het opstellen
      van:
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel12
  - number: 12.1.a
    text: |-
      voorschriften inzake: - de reiniging en ontsmetting van de apparatuur die bij het verkrijgen en behandelen in
      contact komt met het sperma of met het donordier;
        - het winnen, bewerken en opslaan van sperma;
        - de reiniging en ontsmetting van de in Bijlage D, Hoofdstuk I, onderdeel 1, punt 1.2, van [richtlijn 92/65/EEG]
      (31992L0065) bedoelde ruimten en voorzieningen;
        - de toegang tot de in Bijlage D, Hoofdstuk I, onderdeel 1, punt 1.2, van [richtlijn 92/65/EEG](31992L0065)
      bedoelde werkruimten, en
        - de wijze van kleding van personeel en bezoekers;
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel12
  - number: 12.1.b
    text: |-
      een productieprotocol, waarin voor de in Bijlage D, Hoofdstuk I, onderdeel 1, punt 1.2, van [richtlijn 92/65/EEG]
      (31992L0065), bedoelde ruimten en voorzieningen, de productieprocessen chronologisch en gedetailleerd beschreven
      zijn, en
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel12
  - number: 12.1.c
    text: |-
      een kwaliteitsbeheersingsplan, waarin ter waarborging van een correcte uitvoering en registratie van de in
      onderdeel b bedoelde productieprocessen, de in acht te nemen werkwijzen chronologisch en gedetailleerd zijn
      vastgelegd.
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel12
  - number: '12.2'
    text: |-
      De eigenaar of de exploitant van een paardenspermawincentrum dan wel diens vertegenwoordiger zorgt dat het
      personeel zijn werkzaamheden verricht overeenkomstig de wettelijke bepalingen en daarop gebaseerde interne
      procedures en voorschriften, draagt er zorg voor dat de dierenarts van het centrum toeziet op een correcte
      uitvoering van de werkzaamheden door het personeel en geeft de dierenarts van het centrum de hiervoor benodigde
      instructies.
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel12
  - number: '12.3'
    text: |-
      De in het eerste lid bedoelde voorschriften, procedures en protocollen en de wijzigingen daarvan, behoeven de
      goedkeuring van de minister.
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel12
  - number: '13'
    text: |-
      Van toezicht van een dierenarts van het centrum als bedoeld in Bijlage D, Hoofdstuk I, onderdeel I, subonderdeel
      1, punt 1.1, van [richtlijn 92/65/EEG](31992L0065) is sprake, indien die dierenarts overeenkomstig de
      krachtens [artikel 12][ref1] vastgestelde procedures en protocollen erop toeziet dat de voorschriften bedoeld
      in [artikel 9][ref2], [10][ref3] en [11][ref4] in acht worden genomen en dat door betrokkenen de krachtens
      [artikel 12][ref5] vastgestelde procedures en protocollen correct worden uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0035708#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0035708#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0035708#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0035708#Artikel11
      [ref5]: https://wetten.overheid.nl/BWBR0035708#Artikel12
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0035708
        artikel: '12'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0035708
        artikel: '9'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0035708
        artikel: '10'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0035708
        artikel: '11'
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0035708
        artikel: '12'
        paragraaf: '2'
  - number: '14.1'
    text: |-
      Het paardenspermawincentrum beschikt ten behoeve van het toezicht, bedoeld in Bijlage D, Hoofdstuk I, onderdeel II,
      subonderdeel 1, punt 1.2, onderdeel a, van [richtlijn 92/65/EEG](31992L0065), over een door de keuringsdierenarts
      vanuit één plaats op het paardenspermawincentrum te raadplegen register dat dagelijks wordt bijgehouden en dat
      zodanig is ingericht, dat daaruit te allen tijde op eenvoudige wijze met betrekking tot elk dier kan worden
      afgeleid:
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel14
  - number: 14.1.a
    text: het ras;
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel14
  - number: 14.1.b
    text: de geboortedatum;
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel14
  - number: 14.1.c
    text: het identificatienummer;
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel14
  - number: 14.1.d
    text: de gegevens inzake de uitgevoerde vaccinaties;
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel14
  - number: 14.1.e
    text: de gegevens uit het ziekte/gezondheidsdossier;
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel14
  - number: 14.1.f
    text: de datum van toelating op het paardenspermawincentrum;
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel14
  - number: 14.1.g
    text: het beslag of het bedrijf van herkomst;
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel14
  - number: 14.1.h
    text: de verplaatsingen, onder vermelding van de datum van aankomst in of vertrek uit het paardenspermawincentrum, en
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel14
  - number: 14.1.i
    text: |-
      de gegevens, waaronder de laboratoriumuitslagen, onder vermelding van de datum, betreffende in Bijlage D, Hoofdstuk
      II, onderdeel I, subonderdeel 1, van [richtlijn 92/65/EEG](31992L0065) voorgeschreven tests.
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel14
  - number: '14.2'
    text: De in het eerste lid bedoelde gegevens worden tot drie jaar bewaard.
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel14
  - number: '14.3'
    text: |-
      Aan Bijlage D, Hoofdstuk I, onderdeel II, subonderdeel 1, punt 1.2, onderdeel h, van [richtlijn 92/65/EEG]
      (31992L0065) is voldaan, indien op de verpakking van iedere dosis sperma onuitwisbaar de navolgende gegevens zijn
      vermeld:
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel14
  - number: 14.3.a
    text: het identificatienummer van het betrokken sperma;
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel14
  - number: 14.3.b
    text: de datum waarop het sperma is verkregen;
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel14
  - number: 14.3.c
    text: de identiteit van de hengst waarvan het sperma is gewonnen, en
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel14
  - number: 14.3.d
    text: het identificatienummer van het paardenspermawincentrum.
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel14
  - number: '14.4'
    text: |-
      Het is uitsluitend toegestaan paardensperma voorhanden te hebben, in voorraad te hebben, te bewaren, op te slaan,
      te gebruiken, te ontvangen, of af te leveren indien op de verpakking van iedere dosis sperma onuitwisbaar de in het
      derde lid bedoelde gegevens zijn vermeld.
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel14
  - number: '15'
    text: |-
      Als laboratorium, bedoeld in Bijlage D, Hoofdstuk II, onderdeel I, subonderdeel 1, punt 1.5, van [richtlijn 92/65/
      EEG](31992L0065), wordt begrepen een conform de [Regeling erkenning en aanwijzing veterinaire laboratoria][ref1]
      erkend laboratorium dan wel een aan een erkend laboratorium gelijkgesteld laboratorium.


      [ref1]: https://wetten.overheid.nl/BWBR0019575
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0019575
  - number: '16'
    text: |-
      De eigenaar of de exploitant van een paardenspermawincentrum dan wel diens vertegenwoordiger laat ten minste
      eenmaal per jaar in het geval van seizoensgebonden fokkerij en tweemaal per jaar in het geval van niet
      seizoensgebonden fokkerij door de keuringsdierenarts een inspectie verrichten waaruit blijkt in hoeverre op het
      paardenspermawincentrum wordt voldaan aan de ingevolge deze regeling geldende voorschriften en welke voorzieningen
      eventueel moeten worden getroffen, indien het paardenspermawincentrum niet of niet volledig aan die voorschriften
      voldoet.
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel16
  - number: '17.1'
    text: |-
      Een partij sperma gaat bij afvoer van de kadastrale eenheid, waarop het paardenspermawincentrum is gelegen,
      vergezeld van een geleidebiljet, waarop met betrekking tot de partij de volgende gegevens zijn vermeld:
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel17
  - number: 17.1.a
    text: naam, adres en identificatienummer verzender;
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel17
  - number: 17.1.b
    text: de datum van afvoer;
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel17
  - number: 17.1.c
    text: het identificatienummer van het betrokken sperma;
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel17
  - number: 17.1.d
    text: het identificatienummer van de hengst waarvan het sperma is gewonnen;
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel17
  - number: 17.1.e
    text: het aantal doses sperma;
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel17
  - number: 17.1.f
    text: de naam en het adres en eventueel identificatienummer van de ontvanger, en
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel17
  - number: 17.1.g
    text: |-
      indien het buiten Nederland gewonnen sperma betreft, het nummer van het
      gezondheidscertificaat, bedoeld in [artikel 9.5, eerste lid, onderdeel c][ref1], of in
      [artikel 9.6, derde lid, onderdeel c, van de Regeling handel levende dieren en levende producten][ref2], alsmede de
      datum waarop dit sperma binnen Nederland is gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0007049#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0007049#Artikel9
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0007049
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0007049
        artikel: '9'
  - number: '17.2'
    text: |-
      In afwijking van het eerste lid gaat een partij sperma bij afvoer van de kadastrale eenheid, waarop het
      paardenspermawincentrum is gelegen, vergezeld van:
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel17
  - number: 17.2.a
    text: |-
      een nationaal document, overeenkomstig de eisen op grond van artikel 11, tweede lid, vierde gedachtestreepje,
      van [richtlijn 92/65/EEG](31992L0065), indien een partij sperma bestemd is om, overeenkomstig de
      [Regeling handel levende dieren en levende producten][ref1], buiten Nederland te worden gebracht, en voorafgaand
      daaraan in Nederland vervoerd wordt naar één of meerdere krachtens [richtlijn 92/65/EEG](31992L0065) erkende
      spermawincentra of spermaopslagcentra binnen Nederland; of


      [ref1]: https://wetten.overheid.nl/BWBR0007049
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0007049
  - number: 17.2.b
    text: |-
      een document als bedoeld in
      [artikel 9.2, onderdeel c, van de Regeling handel levende dieren en levende producten][ref1], indien een partij
      sperma overeenkomstig die regeling rechtstreeks buiten Nederland in het intracommunautaire handelsverkeer wordt
      gebracht; of


      [ref1]: https://wetten.overheid.nl/BWBR0007049#Artikel9
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0007049
        artikel: '9'
  - number: 17.2.c
    text: |-
      een document als bedoeld in
      __REF000___________________________________________________________________________________________________________
      ______, indien een partij sperma overeenkomstig die regeling rechtstreeks buiten Nederland naar een derde land
      wordt gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0007049#Artikel2
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0007049
        artikel: '2'
  - number: '18.1'
    text: |-
      Degene die paardensperma vervoert of verhandelt beschikt over een administratie waarmee de keuringsdierenarts op
      elk moment een overzicht kan worden geboden van het sperma dat diegene in voorraad heeft en heeft gehad en die
      de tracering van contacten met het paardenspermawincentrum waar het sperma is gewonnen alsmede met inseminatoren,
      dierenartsen, vervoerders, handelaren en gebruikers van het sperma inzichtelijk maakt.
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel18
  - number: '18.2'
    text: |-
      [Artikel 5][ref1] is op de in het eerste lid bedoelde administratie van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0035708#Artikel5
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0035708
        artikel: '5'
        paragraaf: '1'
  - number: '19'
    text: |-
      Een wijziging van een of meer onderdelen van [richtlijn 92/65/EEG](31992L0065) gaat voor de toepassing van de
      artikelen van deze regeling, waarin naar die onderdelen wordt verwezen, gelden met ingang van de dag waarop
      aan de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven, tenzij bij ministerieel besluit, dat in de
      Staatscourant wordt bekend gemaakt, een ander tijdstip wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel19
  - number: '20'
    text: |-
      Dit hoofdstuk is van toepassing op paardenspermawincentra die uitsluitend sperma winnen voor de nationale markt ten
      behoeve van kunstmatige inseminatie.
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel20
  - number: '21'
    text: 'De eigenaar of de exploitant van een paardenspermawincentrum dan wel diens vertegenwoordiger:'
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel21
  - number: 21.a
    text: meldt het paardenspermawincentrum aan bij de NVWA;
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel21
  - number: 21.b
    text: |-
      zorgt dat het personeel en de dierenarts van het centrum de werkzaamheden verrichten overeenkomstig opgestelde
      interne procedures en voorschriften;
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel21
  - number: 21.c
    text: geeft de dierenarts van het centrum de hiervoor benodigde instructies, en
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel21
  - number: 21.d
    text: |-
      zorgt ervoor dat het personeel een toereikende opleiding heeft gekregen inzake ontsmettingsprocedures en
      hygiënetechnieken van met name de apparatuur die bij het verkrijgen en het behandelen van sperma wordt gebruikt om
      verspreiding van ziekten tegen te gaan.
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel21
  - number: '22.1'
    text: |-
      De eigenaar of de exploitant van een paardenspermawincentrum dan wel diens vertegenwoordiger beschikt over een
      protocol waarin de werkzaamheden gedetailleerd en chronologisch beschreven staan, en werkt volgens dit protocol.
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel22
  - number: '22.2'
    text: 'Dit protocol bevat voorschriften inzake:'
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel22
  - number: 22.2.a
    text: |-
      de reiniging en ontsmetting van de apparatuur die bij het verkrijgen en behandelen in contact komt met het sperma
      of met het donordier;
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel22
  - number: 22.2.b
    text: het winnen, bewerken en opslaan van sperma;
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel22
  - number: 22.2.c
    text: |-
      de reiniging en ontsmetting van de bij de winning, behandeling, opslag en verzending van het sperma bedoelde
      ruimten en voorzieningen;
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel22
  - number: 22.2.d
    text: de toegang tot de werkruimten, en
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel22
  - number: 22.2.e
    text: de wijze van kleding van personeel en bezoekers.
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel22
  - number: '23.1'
    text: |-
      Voor zover op de kadastrale eenheid, waarop het paardenspermawincentrum zich bevindt, zich eveneens een KI-
      station of een station voor natuurlijke dekking bevindt, worden het sperma en de instrumenten en apparatuur voor
      kunstmatige inseminatie strikt gescheiden gehouden van de instrumenten en apparatuur die in contact komen met
      donordieren of andere dieren op het paardenspermawincentrum.
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel23
  - number: '23.2'
    text: |-
      Het paardenspermawincentrum is zo gebouwd dat het gehele bedrijf, met uitzondering van de kantoorruimten en de
      bewegingsruimte, gereinigd en ontsmet kunnen worden.
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel23
  - number: '23.3'
    text: |-
      Binnen de kadastrale eenheden waarop het paardenspermawincentrum is gelegen, is er beschikking over een ruimte en
      voorzieningen voor de reiniging en ontsmetting van de gebruikte materialen.
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel23
  - number: '23.4'
    text: |-
      Ieder stuk gereedschap dat op welke wijze dan ook gebruikt wordt bij het winnen, behandelen, bewaren, invriezen dan
      wel vervoeren van het sperma:
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel23
  - number: 23.4.a
    text: wordt voor gebruik ontsmet of gesteriliseerd, of
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel23
  - number: 23.4.b
    text: is niet eerder gebruikt.
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel23
  - number: '24.1'
    text: |-
      Op het paardenspermawincentrum is een ruimte voor de behandeling van sperma met een voorziening voor de verwerking
      en opslag van het sperma aanwezig. Deze ruimte bevindt zich separaat van de winruimte.
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel24
  - number: '24.2'
    text: |-
      De eigenaar of de exploitant van een paardenspermawincentrum dan wel diens vertegenwoordiger ziet erop toe dat het
      behandelen en opslaan van sperma alleen geschiedt in de daarvoor bestemde ruimte.
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel24
  - number: '24.3'
    text: |-
      De eigenaar of de exploitant van een paardenspermawincentrum dan wel diens vertegenwoordiger zorgt ervoor dat op
      elke dosis sperma een onuitwisbare identificatie wordt aangebracht, die de volgende gegevens bevat:
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel24
  - number: 24.3.a
    text: de lidstaat van oorsprong;
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel24
  - number: 24.3.b
    text: |-
      het identificatienummer van het betrokken sperma, dat tenminste de postcode en het huisnummer van het
      paardenspermawincentrum bevat;
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel24
  - number: 24.3.c
    text: de datum waarop het sperma is verkregen;
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel24
  - number: 24.3.d
    text: de identiteit van de hengst waarvan het sperma is gewonnen, en
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel24
  - number: 24.3.e
    text: een codering dat het sperma enkel voor de nationale markt bestemd is.
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel24
  - number: '24.4'
    text: |-
      Het is de eigenaar of de exploitant van een paardenspermawincentrum dan wel diens vertegenwoordiger uitsluitend
      toegestaan paardensperma voorhanden te hebben, in voorraad te hebben, te bewaren, op te slaan, te gebruiken,
      te ontvangen of af te leveren indien op de verpakking van iedere dosis sperma onuitwisbaar de in het derde lid
      genoemde gegevens zijn vermeld.
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel24
  - number: '24.5'
    text: |-
      De eigenaar of de exploitant van een paardenspermawincentrum dan wel diens vertegenwoordiger ziet erop toe dat de
      producten van dierlijke oorsprong die bij de behandeling van sperma worden gebruikt, zoals verdunningsmiddelen,
      additieven of aanlengmiddelen, geen gevaar voor de gezondheid van de dieren opleveren of voor gebruik zo zijn
      behandeld dat zij geen gevaar meer kunnen opleveren.
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel24
  - number: '24.6'
    text: 'Sperma moet worden bewaard in steriele inseminatiedoses, die:'
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel24
  - number: 24.6.a
    text: voorzien zijn van een identificatie als bedoeld in het derde lid;
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel24
  - number: 24.6.b
    text: alleen sperma bevatten dat van eenzelfde hengst afkomstig is, en
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel24
  - number: 24.6.c
    text: onmiddellijk na het vullen worden afgesloten.
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel24
  - number: '25.1'
    text: |-
      De dierenarts van het centrum draagt zorg voor de veterinaire begeleiding van de hengsten en de merries die zich in
      het paardenspermawincentrum bevinden.
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel25
  - number: '25.2'
    text: |-
      Wanneer op de kadastrale eenheid van het paardenspermawincentrum naast winning ook geïnsemineerd wordt of
      natuurlijk gedekt wordt, worden merries, schouwhengsten en overige paardachtigen toegelaten voor zover zij voldoen
      aan de volgende voorwaarden:
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel25
  - number: 25.2.a
    text: bij de toelating en op de dag van de inseminatie of dekking vertonen zij geen tekenen van besmettelijke ziekten;
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel25
  - number: 25.2.b
    text: |-
      wanneer zij afkomstig zijn van buiten Nederland, beschikken zij over een EU-gezondheidscertificaat dat is
      afgegeven door de veterinaire autoriteit van het betreffende land, zoals is omschreven in [richtlijn 2009/156/
      EG](32009L0156).
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel25
  - number: '25.3'
    text: De in het tweede lid bedoelde gegevens zijn geregistreerd en worden tot drie jaar bewaard.
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel25
  - number: '26.1'
    text: |-
      Voor het winnen van sperma worden slechts hengsten gebruikt waarvan de dierenarts van het centrum heeft
      geconstateerd dat zij aan de volgende voorwaarden voldoen:
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel26
  - number: 26.1.a
    text: bij de toelating vertonen zij geen tekenen van besmettelijke ziekten;
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel26
  - number: 26.1.b
    text: |-
      wanneer zij afkomstig zijn van buiten Nederland beschikken zij over een EU-gezondheidscertificaat dat is
      afgegeven door de veterinaire autoriteit van het betreffende land, zoals is omschreven in [richtlijn 2009/156/EG]
      (32009L0156), en
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel26
  - number: 26.1.c
    text: |-
      de laatste 30 dagen voor de spermawinning en gedurende de winningsperiode worden zij niet gebruikt voor natuurlijke
      dekking.
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel26
  - number: '26.2'
    text: Op de dag van spermawinning vertonen de hengsten geen tekenen van besmettelijke ziekten.
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel26
  - number: '26.3'
    text: De in het eerste en tweede lid bedoelde gegevens zijn geregistreerd en worden tot drie jaar bewaard.
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel26
  - number: '27.1'
    text: |-
      De eigenaar of de exploitant van een paardenspermawincentrum dan wel diens vertegenwoordiger laat ieder jaar
      voorafgaande aan het dekseizoen van elke hengst op het spermawincentrum monsters nemen van het geslachtsapparaat.
      Deze monsters worden onderzocht op CEM en EVA. De wijze van monstername en onderzoek vindt plaats overeenkomstig de
      gedragslijn vastgelegd in [bijlage 1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0035708
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0035708
  - number: '27.2'
    text: |-
      Indien op het paardenspermawincentrum gebruik wordt gemaakt van een bokmerrie laat de eigenaar of de exploitant van
      een paardenspermawincentrum dan wel diens vertegenwoordiger ieder jaar, ten minste dertig dagen voorafgaande aan
      het dekseizoen van elke bokmerrie op het paardenspermawincentrum een monster nemen. Dit monster wordt onderzocht op
      CEM en EVA. De wijze van monstername en onderzoek vindt plaats overeenkomstig de gedragslijn in [bijlage 1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0035708
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0035708
  - number: '27.3'
    text: |-
      De monsters worden onderzocht door een conform de [Regeling erkenning en aanwijzing veterinaire laboratoria][ref1]
      erkend laboratorium dan wel een aan een erkend laboratorium gelijkgesteld laboratorium.


      [ref1]: https://wetten.overheid.nl/BWBR0019575
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0019575
  - number: '27.4'
    text: |-
      Indien het CEM-onderzoek positief uitvalt, wordt de betrokken hengst dan wel bokmerrie afgezonderd of verwijderd
      van het centrum en mag het sinds de laatste negatieve test gewonnen sperma dan wel diepvriessperma niet in de
      handel worden gebracht. Dit geldt ook voor het, sinds de datum waarop de positieve test werd uitgevoerd, gewonnen
      sperma van de andere voor deze ziekte vatbare dieren die op het paardenspermawincentrum verblijven. Het sperma
      mag pas weer in het handelsverkeer worden gebracht wanneer de gezondheidsstatus van het paardenspermawincentrum
      is hersteld. De procedure na een positieve testuitslag vindt plaats overeenkomstig de gedragslijn vastgelegd in
      [bijlage 1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0035708
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0035708
  - number: '27.5'
    text: |-
      Indien het EVA-onderzoek van de betrokken hengst positief uitvalt, is het vierde lid van overeenkomstige
      toepassing.
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel27
  - number: '27.6'
    text: |-
      Indien het EVA-onderzoek van de betrokken bokmerrie negatief uitvalt, wordt de betrokken bokmerrie van het
      wincentrum verwijderd.
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel27
  - number: '28'
    text: |-
      Het paardenspermawincentrum beschikt ten behoeve van de controle over een register dat vanuit één plaats op het
      centrum door een inspecteur van de NVWA te raadplegen is. Uit het register kan te allen tijde met betrekking tot
      elke aanwezige hengst of bokmerrie op eenvoudige wijze worden afgeleid:
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel28
  - number: 28.a
    text: de naam;
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel28
  - number: 28.b
    text: het ras;
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel28
  - number: 28.c
    text: de geboortedatum;
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel28
  - number: 28.d
    text: het identificatienummer;
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel28
  - number: 28.e
    text: de gegevens inzake de uitgevoerde vaccinaties;
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel28
  - number: 28.f
    text: de gegevens inzake veterinaire bevindingen en handelingen;
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel28
  - number: 28.g
    text: |-
      de uitslag en datum van de CEM- en EVA-onderzoeken, bedoeld in [artikel 27][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0035708#Artikel27
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0035708
        artikel: '27'
        paragraaf: '3'
  - number: 28.h
    text: het laatste verblijfadres, en
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel28
  - number: 28.i
    text: |-
      alle verplaatsingen, onder vermelding van de datum van aankomst op of vertrek van het paardenspermawincentrum
      of eventueel de vaste dagen waarop de hengst het paardenspermawincentrum bezoekt voor spermawinning en eventuele
      uitzonderingen op deze bezoekdata.
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel28
  - number: '29'
    text: |-
      Een partij sperma gaat bij afvoer van de kadastrale eenheid, waarop het paardenspermawincentrum is gelegen,
      vergezeld van een geleidebiljet, waarop met betrekking tot de partij de volgende gegevens zijn vermeld:
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel29
  - number: 29.a
    text: het herkomstadres met het identificatienummer;
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel29
  - number: 29.b
    text: de datum van afvoer;
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel29
  - number: 29.c
    text: het identificatienummer van het betrokken sperma;
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel29
  - number: 29.d
    text: het identificatienummer van de hengst waarvan het sperma is gewonnen;
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel29
  - number: 29.e
    text: het aantal doses sperma;
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel29
  - number: 29.f
    text: de naam, het adres, en indien van toepassing het identificatienummer van de ontvanger;
    url: https://wetten.overheid.nl/BWBR0035708/2017-01-01#Artikel29
  - number: 29.g
    text: een codering dat het sperma enkel voor de nationale markt bestemd is, en
