  - number: '2'
    text: De loonwaarde wordt vastgelegd overeenkomstig het model opgenomen in de bijlage bij deze regeling.
    url: https://wetten.overheid.nl/BWBR0044901/2021-07-01#Artikel2
  - number: '3'
    text: |-
      1 De loonwaardedeskundige:

      a. is in het bezit van een getuigschrift van met goed gevolg
      afgelegd afsluitend examen van een relevante opleiding, bedoeld in
      [artikel 7.3a, eerste of tweede lid, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1], of
      aantoonbare naar het oordeel van het college daaraan gelijkwaardige kwalificaties;

      b. heeft twee jaar of meer werkervaring met betrekking tot re-integratiebegeleiding,
      arbeidsongeschiktheidsvaststelling, of loonwaardebepaling;

      c. heeft voldoende aantoonbare kennis van de toepasselijke wet- en regelgeving met betrekking tot de
      loonwaardebepaling; en

      d. heeft voor de loonwaardebepaling relevante kennis van de arbeidsmarkt.

      2 De loonwaardedeskundige houdt aantoonbaar de kennis en vaardigheden bij die noodzakelijk zijn voor het uitvoeren
      van de loonwaardebepaling.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7.3a
