$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.5.2/schema.json
$id: besluit_versterking_natuur_en_bosbeheer_bij_bos_en_landgoedeigenaren
regulatory_layer: WET
publication_date: '2007-02-15'
valid_from: '2005-12-24'
bwb_id: BWBR0010404
url: https://wetten.overheid.nl/BWBR0010404/2005-12-24
preamble:
  text: |-
    Gelet op artikel 3 van de Kaderregeling subsidiëring natuurprojecten;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0010404/2005-12-24#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. bosgroep: regionaal samenwerkingsverband van eigenaren van bos en van landgoedeigenaren, dat ten doel heeft het
      bevorderen van de rentabiliteit van het bos van de deelnemende eigenaren door het verrichten of doen verrichten van
      daarop gerichte gemeenschappelijke activiteiten ten behoeve van de exploitatie van het bos;

      b. Dienst Regelingen: Dienst Regelingen van het Ministerie van Landbouw, Natuur en Voedselkwaliteit.
    url: https://wetten.overheid.nl/BWBR0010404/2005-12-24#Artikel1
  - number: '2'
    text: |-
      Aanvragen tot subsidieverlening voor projecten, bedoeld in
      [artikel 2 van de Kaderregeling subsidiëring natuurprojecten][ref1], kunnen worden ingediend voor het thema
      ’Versterking natuur- en bosbeheer bij bos- en landgoedeigenaren’.


      [ref1]: https://wetten.overheid.nl/BWBR0009851#Artikel2
    url: https://wetten.overheid.nl/BWBR0010404/2005-12-24#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0009851
        artikel: '2'
  - number: '4'
    text: |-
      Subsidie kan worden verstrekt voor projecten die een bijdrage leveren aan rendementsverbetering binnen de
      bosbouwsector alsmede aan verbetering van de kwaliteit van het bos.
    url: https://wetten.overheid.nl/BWBR0010404/2005-12-24#Artikel4
  - number: '5'
    text: |-
      Voor subsidieverlening komen in aanmerking projecten die tenminste één van de volgende activiteiten betreffen:

      a. verbeteren van de structuur van de bosgroepen en van de Unie van Bosgroepen;

      b. opzetten van een houtwinkel, een houtbank en een houtveiling;

      c. verbeteren van advisering en opleiding;

      d. opzetten van certificering;

      e. verbeteren van de automatisering;

      f. productvernieuwing;

      g. opstellen van aanvragen als bedoeld in [artikel 20a van de Subsidieregeling natuurbeheer 2000][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010999#Artikel20a
    url: https://wetten.overheid.nl/BWBR0010404/2005-12-24#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0010999
        artikel: 20a
  - number: '6'
    text: De subsidie wordt verleend aan de coöperatieve vereniging Unie van Bosgroepen U.A.
    url: https://wetten.overheid.nl/BWBR0010404/2005-12-24#Artikel6
  - number: '7'
    text: |-
      1 Een subsidie voor projecten als bedoeld in [artikel 2][ref1] kan worden verleend voor de volgende met het project
      verband houdende kosten:

      a. loonkosten van het betrokken personeel in dienst van de aanvrager en de bij de aanvrager aangesloten bosgroepen;

      b. huisvestingskosten;

      c. kosten van verbruikte materialen of hulpmiddelen;

      d. aan derden verschuldigde kosten;

      e. reis- en verblijfkosten;

      f. de voor de vaststelling van de subsidie benodigde accountantsverklaring.

      2 De kosten, bedoeld in het eerste lid, worden in aanmerking genomen met inbegrip van de verschuldigde
      omzetbelasting indien de aanvrager de omzetbelasting niet kan verrekenen met de door hem af te dragen
      omzetbelasting.


      [ref1]: https://wetten.overheid.nl/BWBR0010404#Artikel2
    url: https://wetten.overheid.nl/BWBR0010404/2005-12-24#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0010404
        artikel: '2'
  - number: '8'
    text: |-
      De subsidie bedraagt ten hoogste 100% van de in [artikel 7][ref1] genoemde kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0010404#Artikel7
    url: https://wetten.overheid.nl/BWBR0010404/2005-12-24#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0010404
        artikel: '7'
  - number: '9'
    text: |-
      1 Indien voor een project waarvoor op grond van dit besluit subsidie is verleend, andere subsidies door de
      rijksoverheid worden verstrekt, wordt slechts een zodanig bedrag op grond van dit besluit verstrekt, dat de som van
      de subsidies het in [artikel 8][ref1] genoemde percentage niet overschrijdt.

      2 Indien voor een project waarvoor op grond van dit besluit subsidie is verleend, subsidies door anderen dan de
      rijksoverheid dan wel financiële middelen door niet-bestuursorganen worden verstrekt, wordt slechts een zodanig
      bedrag op grond van dit besluit verstrekt, dat de som van de subsidies dan wel de financiële middelen niet meer
      bedraagt dan 100% van de totale kosten van het project.


      [ref1]: https://wetten.overheid.nl/BWBR0010404#Artikel8
    url: https://wetten.overheid.nl/BWBR0010404/2005-12-24#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0010404
        artikel: '8'
  - number: '10'
    text: Aanvragen tot subsidieverlening worden ingediend vóór 1 juli van het jaar waarop de subsidie betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0010404/2005-12-24#Artikel10
  - number: '11'
    text: Een aanvraag tot subsidieverlening wordt gericht aan de minister en ingediend bij Dienst Regelingen.
    url: https://wetten.overheid.nl/BWBR0010404/2005-12-24#Artikel11
  - number: '12'
    text: |-
      Beslissingen op grond van dit besluit worden genomen onder het voorbehoud dat de Commissie van de Europese
      Gemeenschappen de vereiste goedkeuring voor dit besluit verleent.
    url: https://wetten.overheid.nl/BWBR0010404/2005-12-24#Artikel12
  - number: '13'
    text: De Bijdrageregeling beheer samenwerking bos 1993 wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0010404/2005-12-24#Artikel13
  - number: '14'
    text: |-
      Dit besluit treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin het wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0010404/2005-12-24#Artikel14
  - number: '15'
    text: 'Dit besluit wordt aangehaald als: Besluit versterking natuur- en bosbeheer bij bos- en landgoedeigenaren.'
    url: https://wetten.overheid.nl/BWBR0010404/2005-12-24#Artikel15
