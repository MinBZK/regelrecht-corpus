  - number: '13'
    text: |-
      De door het productschap uit hoofde van deze verordening verkregen gegevens worden in handen gesteld van de
      voorzitter en worden, behoudens bij of krachtens de wet te bepalen gevallen, niet aan derden verstrekt. De
      verkregen gegevens kunnen geanonimiseerd worden verwerkt in algemene, periodieke rapportages waarin feiten en
      statistieken worden weergegeven.
    url: https://wetten.overheid.nl/BWBR0031282/2014-03-02#Artikel13
  - number: '14'
    text: |-
      1 De ondernemer laat zich ten minste één maal per kalenderjaar op eigen kosten door een erkende controle-instantie
      controleren op de naleving van het bepaalde bij of krachtens deze verordening.

      2 De controle-instantie kan op aanvraag worden erkend door de voorzitter indien zij voldoet aan door het bestuur
      bij besluit vastgestelde erkenningsvoorwaarden, welke strekken tot waarborg van de onafhankelijkheid en expertise
      van de controle-instantie.

      3 De voorzitter kan aan een erkenning nadere voorschriften en voorwaarden verbinden. De voorzitter kan de erkenning
      intrekken indien is vastgesteld dat niet langer aan de erkenningsvoorwaarden of de aan de erkenning verbonden
      nadere voorschriften en voorwaarden wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0031282/2014-03-02#Artikel14
  - number: '15'
    text: |-
      1 Het toezicht op de naleving van het bij of krachtens de [artikelen 2][ref1], [3][ref2], [4][ref3], [6][ref4],
      [8][ref5], [11][ref6] en [12][ref7] bepaalde wordt namens het productschap uitgeoefend door toezichthouders die
      hiervoor door het bestuur bij besluit zijn aangewezen.

      2 De ondernemer is verplicht:

      a) Aan de door het bestuur aangewezen toezichthouders al die gegevens te verstrekken of te doen verstrekken, die
      nodig zijn voor de vervulling van hun taak;

      b) Aan de door het bestuur aangewezen toezichthouders inzage te geven of te doen geven van die boeken en
      bescheiden, die nodig zijn voor de vervulling van hun taak;

      c) Aan de door het bestuur aangewezen toezichthouders te allen tijde toegang te geven of te doen geven tot de
      bedrijfsruimten en tot die plaatsen of vervoermiddelen, waar of waarin voorraden die tot het bedrijf van de
      ondernemer behoren, zijn opgeslagen of worden vervoerd;

      d) Te gedogen dat de door het bestuur aangewezen toezichthouders monsters nemen uit de voorraden, waaronder
      begrepen verpakkingsmateriaal, van het bedrijf van de ondernemer, ongeacht de plaats waar of waarin zich die
      voorraden bevinden en alsdan de van hem gevorderde medewerking verlenen overeenkomstig de aanwijzingen en het
      toezicht van die toezichthouders;

      e) Voor het overige alle medewerking te verlenen ter vervulling van de aan de toezichthouders opgedragen taak.

      3 De in het eerste lid bedoelde toezichthouders zijn bevoegd om berechtingsrapporten op te maken ten behoeve
      van tuchtrechtelijke afhandeling van overtredingen van het bij of krachtens de [artikelen 2][ref8], [3][ref9],
      [4][ref10], [6][ref11], [8][ref12], [11][ref13] en [12][ref14] bepaalde.


