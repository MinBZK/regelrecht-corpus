  - number: '11'
    text: |-
      1 De ondernemer houdt een deugdelijke administratie bij inzake iedere aanvoer van pluimvee naar, en afvoer van
      eindproducten van zijn onderneming, inzake de monsters die hij heeft genomen, inzake de uitslagen van de detectie,
      de serotypering en inzake facturen als gevolg van verplichtingen vastgelegd bij of krachtens deze verordening.

      2 De administratie is zodanig ingericht dat deze te allen tijde aan een door het bestuur aangewezen toezichthouder
      het benodigde inzicht kan verschaffen over de naleving van de bij of krachtens deze verordening vastgelegde
      voorschriften en verplichtingen.

      3 De ondernemer bewaart de uitslag van de detectie als bedoeld in [artikel 2][ref1] alsmede de uitslagen van de
      detectie en serotypering als bedoeld in de [artikelen 6][ref2] en [8][ref3] gedurende ten minste twee jaren na
      ontvangst van het erkende laboratorium.

      4 De ondernemer bewaart de schriftelijke uitslagen van het Salmonellaonderzoek van de pluimveehouder als bedoeld in
      [artikel 4][ref4] gedurende ten minste twee jaren na ontvangst van het pluimveebedrijf.


      [ref1]: https://wetten.overheid.nl/BWBR0031282#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0031282#Artikel6
