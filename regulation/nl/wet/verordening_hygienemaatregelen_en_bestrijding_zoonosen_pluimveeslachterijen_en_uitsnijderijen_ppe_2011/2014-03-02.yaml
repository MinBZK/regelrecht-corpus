preamble:
  text: |-
    Gelet op de artikelen 93, eerste lid, 95, 102 en 104 van de Wet op de bedrijfsorganisatie, en de artikelen 6 en 7
    van het Instellingsbesluit Productschap Pluimvee en Eieren;

    Gelet op de artikelen 3 en 3a van het Besluit bescherming tegen bepaalde zoönosen en bestrijding besmettelijke
    dierziekten en de artikelen 95 en 96 van de Regeling preventie, bestrijding en monitoring van besmettelijke
    dierziekten en zoönosen en TSE's;

    Gezien Richtlijn 2003/99/EG van het Europees Parlement en de Raad van 17 november 2003 inzake de bewaking van
    zoönoses en zoönoseverwekkers en houdende wijziging van Beschikking 90/424/EEG van de Raad en intrekking van
    Richtlijn 92/117/EEG van de Raad (PbEU L 325), en Verordening (EG) nr. 2160/2003 van het Europees Parlement en
    de Raad van 17 november 2003 inzake de bestrijding van Salmonella en andere specifieke door voedsel overgedragen
    zoönoseverwekkers (PbEU L 325) en;

    Gezien de Verordening hygiënemaatregelen en bestrijding zoönosen in pluimveebedrijven en kuikenbroederijen (PPE)
    2011;

    Gezien de Wet tuchtrechtspraak bedrijfsorganisatie 2004;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0031282/2014-03-02#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze Verordening en de daarop rustende besluiten wordt verstaan onder:









                  1. ondernemer


                  :


                  een natuurlijk persoon of rechtspersoon die een onderneming uitoefent waarin pluimvee wordt geslacht of
      het vlees van pluimvee wordt uitgebeend, uitgesneden, versneden, verpakt of opgeslagen;




                  2. onderneming


                  :


                  tot de onderneming behoren alle inrichtingen waarin pluimvee wordt geslacht of het vlees van pluimvee
      wordt bewerkt of verwerkt en die voor ten minste 51% eigendom zijn van de ondernemer;




                  3. slachterij


                  :


                  een inrichting waar pluimvee wordt geslacht en die voldoet aan de in Verordening (EG) Nr. 853/2004
      gestelde eisen en als zodanig is erkend;




                  4. slachtkoppel


                  :


                  een aan de slachterij aaneengesloten geleverde hoeveelheid pluimvee dat afkomstig is van één stal
      en dat bestemd is om te worden geslacht of een door de ondernemer geslachte aaneengesloten geleverde hoeveelheid
      pluimvee dat afkomstig is van één stal;




                  5. slachtuitlaadkoppel


                  :


                  een aan de slachterij aaneengesloten geleverde hoeveelheid pluimvee dat afkomstig is van één
      pluimveebedrijf en dat bestemd is om te worden geslacht of een door de ondernemer geslachte aaneengesloten
      geleverde hoeveelheid pluimvee dat afkomstig is van één pluimveebedrijf. Voor slachtuitlaadkoppels geldt:
                  dat het gaat om het deel van het stalkoppel dat als eerste wordt geslacht;
      dat de in de
      __REF000___________________________________________________________________________________________________________
      __ bedoelde onderzoeken naar Salmonella een negatieve uitslag hebben opgeleverd voor Salmonella Typhimurium en
      Salmonella Enteritidis.




                  6. uitsnijderij


                  :


                  een inrichting waarin vlees van pluimvee wordt uitgebeend, uitgesneden of versneden, verpakt of
      opgeslagen en die voldoet aan de in Verordening (EG) Nr. 853/2004 gestelde eisen en als zodanig erkend is.




                  7. nuchter pluimvee


                  :


                  pluimvee waarvan de krop leeg is;




                  8. eindproduct van de slachterij


                  :


                  filet of vel van de borstkap van geslacht pluimvee;




                  9. eindproduct van de uitsnijderij


                  :


                  vel van de borstkap, filet, poten of vleugels van geslacht pluimvee;




                  10. Verordening (EG) Nr. 853/2004


                  :


                  Verordening (EG) Nr. 853/2004 van het Europees Parlement en de Raad van 29 april 2004 houdende
      vaststelling van specifieke hygiënevoorschriften voor levensmiddelen van dierlijke oorsprong.






      Voor het overige worden de begripsbepalingen overgenomen van de
      __REF000___________________________________________________________________________________________________________
      __.


