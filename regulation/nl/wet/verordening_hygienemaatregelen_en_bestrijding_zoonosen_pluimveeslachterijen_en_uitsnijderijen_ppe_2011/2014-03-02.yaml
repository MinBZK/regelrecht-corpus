  - number: '2'
    text: |-
      1 Nadat het pluimvee is uitgeladen uit de transportmiddelen waarmee en de kratten en containers waarin, het is
      aangevoerd in de slachterij, reinigt en ontsmet de ondernemer deze transportmiddelen en kratten en containers
      onverwijld en zodanig dat deze visueel schoon zijn.

      2 De ondernemer neemt dagelijks monsters van de gereinigde kratten en containers waarin het pluimvee in
      de slachterij zijn aangevoerd. De ondernemer draagt er zorg voor dat een onderzoek van deze monsters op de
      aanwezigheid van Salmonella plaatsvindt door middel van detectie door een voor detectie van Salmonella erkend
      laboratorium.
    url: https://wetten.overheid.nl/BWBR0031282/2014-03-02#Artikel2
  - number: '3'
    text: |-
      1 De ondernemer houdt tijdens het slachtproces alle slachtkoppels op stalniveau en slachtuitlaadkoppels op
      bedrijfsniveau fysiek van elkaar gescheiden.

      2 De ondernemer hangt slechts nuchter pluimvee aan de slachtlijn.

      3 De looprichting en de gereguleerde luchtstroom zijn tegengesteld aan de richting die het aangevoerde product
      doorloopt.

      4 De ondernemer reinigt en ontsmet al het tijdens de slacht en voor het uitbenen, het uitsnijden, het versnijden,
      het verpakken en het opslaan gebruikte materiaal.
    url: https://wetten.overheid.nl/BWBR0031282/2014-03-02#Artikel3
  - number: '4'
    text: |-
      1 De ondernemer mag alleen pluimvee slachten indien hij uiterlijk 24 uur vóór de slacht in het bezit is van
      de schriftelijke uitslagen van het Salmonellaonderzoek dat in de stal waaruit het pluimvee afkomstig is, is
      uitgevoerd.

      2 De schriftelijke uitslagen van het in het eerste lid bedoelde Salmonellaonderzoek omvatten de uitslagen van de
      detectie, in voorkomend geval de serotypering en in voorkomend geval het verificatieonderzoek, als bedoeld in de
      artikelen:

      a) [artikel 4][ref1] (opfokbedrijf, fokbedrijf en vermeerderingsbedrijf),

      b) [artikel 10][ref2] (opfokleghennenbedrijf, en leghennenbedrijf),

      c) [artikel 13][ref3] (vleeskuikenbedrijven) en

      d) [artikel 15][ref4] (Salmonellaonderzoek op initiatief van de voorzitter),

      van de
      __REF000___________________________________________________________________________________________________________
      __ en de daarop gebaseerde besluiten.

      3 De ondernemer is verplicht om dagelijks al het pluimvee in onderstaande volgorde te slachten:

      a) Als eerste al het pluimvee waarvan het Salmonellaonderzoek in het pluimveebedrijf geen Salmonella heeft
      aangetoond;

      b) Vervolgens al het pluimvee waarvan het Salmonellaonderzoek in het pluimveebedrijf Salmonella van een ander
      serotype dan Salmonella Enteritidis of Salmonella Typhimurium heeft aangetoond;

      c) Als laatste al het pluimvee waarvan het Salmonellaonderzoek in het pluimveebedrijf Salmonella Enteritidis of
      Salmonella Typhimurium heeft aangetoond.


