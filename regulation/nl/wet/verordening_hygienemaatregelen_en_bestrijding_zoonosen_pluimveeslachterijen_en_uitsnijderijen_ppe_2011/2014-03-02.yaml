  - number: '6'
    text: |-
      1 De ondernemer neemt dagelijks van elk slachtkoppel blindedarmmonsters en monsters van het eindproduct van de
      slachterij.

      2 De ondernemer zorgt ervoor dat een onderzoek van de in het eerste lid bedoelde monsters naar de aanwezigheid
      van Salmonella plaatsvindt door middel van detectie door een voor detectie van Salmonella erkend laboratorium
      en, in geval van de aanwezigheid van Salmonella in de monsters, serotypering door een voor serotypering erkend
      laboratorium.

      3 De ondernemer verstrekt tijdig de monsters aan het voor detectie van Salmonella erkende laboratorium, en in geval
      van de aanwezigheid van Salmonella in het monster, aan het voor serotypering erkende laboratorium.
    url: https://wetten.overheid.nl/BWBR0031282/2014-03-02#Artikel6
  - number: '8'
    text: |-
      1 De ondernemer die per week ten minste 3.000 kilogram vlees van pluimvee uitbeent, uitsnijdt, versnijdt, opslaat
      of verpakt, neemt dagelijks monsters van het eindproduct van de uitsnijderij.

      2 De ondernemer zorgt ervoor dat een onderzoek van de monsters naar de aanwezigheid van Salmonella plaatsvindt door
      middel van detectie door een voor detectie van Salmonella erkend laboratorium, en in geval van de aanwezigheid van
      Salmonella in de monsters, serotypering door een voor serotypering erkend laboratorium.

      3 De ondernemer verstrekt tijdig de monsters aan het voor detectie van Salmonella erkende laboratorium, en in geval
      van de aanwezigheid van Salmonella in het monster, aan het voor serotypering erkende laboratorium.
    url: https://wetten.overheid.nl/BWBR0031282/2014-03-02#Artikel8
  - number: '9'
    text: |-
      De voorzitter is belast met de erkenning van de laboratoria als bedoeld in de [artikelen 2][ref1], [6][ref2]
      en [8][ref3]. Het bestuur stelt bij besluit nadere regels vast ten aanzien van de erkenningsvoorwaarden van
      laboratoria.


      [ref1]: https://wetten.overheid.nl/BWBR0031282#Artikel2
