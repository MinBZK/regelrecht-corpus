  - number: '12'
    text: |-
      1 De ondernemer meldt tijdig de schriftelijke uitslag van het Salmonellaonderzoek als bedoeld in [artikel 4][ref1]
      aan de voorzitter.

      2 De ondernemer meldt tijdig de uitslagen van de detectie en de serotypering als bedoeld in de [artikelen 6][ref2]
      en [8][ref3] aan de voorzitter.

      3 De ondernemer meldt tijdig de uitslagen van de detectie en de serotypering als bedoeld in de [artikelen 6][ref4]
      en [8][ref5] aan de pluimveehouder die het pluimvee heeft geleverd waarvan de blindedarm monsters en de monsters
      van het eindproduct van de slachterij en de uitsnijderij zijn genomen. Ook indien het pluimvee door een ander dan
      de pluimveehouder is geleverd zorgt de ondernemer ervoor dat de pluimveehouder de uitslagen ontvangt.

      4 Het bestuur stelt bij besluit nadere regels vast ten aanzien van de wijze waarop, het tijdstip waarop en de
      frequentie waarmee de ondernemer de in het eerste, tweede en derde lid bedoelde uitslagen meldt.


