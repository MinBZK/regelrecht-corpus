  - number: '10'
    text: |-
      1 Het bestuur stelt bij besluit nadere regels vast over de wijze waarop, het tijdstip waarop en de frequentie
      waarmee de monsters als bedoeld in [artikel 2][ref1] worden genomen, alsmede over het aantal monsters en over de
      detectie van deze monsters.

      2 Het bestuur kan bij besluit nadere regels stellen over de wijze waarop de ondernemer de slachtkoppels en
      slachtuitlaadkoppels fysiek van elkaar gescheiden dient te houden, als bedoeld in [artikel 3][ref2].

      3 Het bestuur stelt bij besluit nadere regels vast over de wijze waarop, het tijdstip waarop en de frequentie
      waarmee de monsters als bedoeld in [artikel 6][ref3] worden genomen, over het aantal monsters, over de detectie en
      de serotypering van deze monsters en over de tijdige melding van de laboratoriumuitslagen van deze monsters.

      4 Het bestuur kan bij besluit nadere regels vaststellen over de consequenties die kunnen worden verbonden aan de
      laboratoriumuitslagen van de monsters als bedoeld in [artikel 6][ref4].

      5 Het bestuur stelt bij besluit nadere regels vast over de wijze waarop, het tijdstip waarop en de frequentie
      waarmee de monsters als bedoeld in [artikel 8][ref5] worden genomen, over het aantal monsters, over de detectie en
      de serotypering van deze monsters en over de tijdige melding van de laboratoriumuitslagen van deze monsters.


