  - number: '6'
    text: |-
      1 Het hoofd DSI heeft de algehele leiding over het optreden van de bijzondere bijstandseenheden en de daarbij aan
      de bijzondere bijstandseenheden toegevoegde eenheden.

      2 Het hoofd DSI is belast met de uitvoering van de door of vanwege het bevoegd gezag gegeven aanwijzingen,
      opdrachten en ingediende verzoeken.

      3 Het hoofd DSI draagt zorg voor de chronologische verslaglegging van het feitelijk optreden.
    url: https://wetten.overheid.nl/BWBR0011952/2007-01-01#Artikel6
  - number: '7'
    text: |-
      1 De commandant van de betrokken bijzondere bijstandseenheid is de operationeel commandant interventie en heeft
      de feitelijke leiding over de eigen eenheid en de eenheden die ten behoeve van de interventie worden ingezet. Deze
      commandant staat onder direct bevel van het hoofd DSI.

      2 Indien er verschillende bijstandseenheden worden ingezet, wijst het hoofd DSI de operationeel commandant van de
      algehele inzet aan.

      3 De operationeel commandant interventie draagt zorg voor de verbindingen met de onder hem gestelde commandanten.
      Hij is belast met verslaglegging van het feitelijk optreden.
    url: https://wetten.overheid.nl/BWBR0011952/2007-01-01#Artikel7
  - number: '9'
    text: |-
      1 De lange afstand precisieschutters van de UE&OO hebben voldaan aan de eindtermen van de door de Ministers van
      Justitie en van Binnenlandse Zaken en Koninkrijksrelaties aan te wijzen vervolgopleiding voor precisieschutter.

      2 De korpsbeheerder draagt ervoor zorg dat de kennis en de vaardigheden van de in het eerste lid genoemde
      ambtenaren ten minste op het niveau van de in het eerste lid bedoelde eindtermen blijven.
    url: https://wetten.overheid.nl/BWBR0011952/2007-01-01#Artikel9
