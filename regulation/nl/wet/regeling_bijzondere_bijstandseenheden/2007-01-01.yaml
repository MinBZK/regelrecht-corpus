  - number: '5'
    text: |-
      De voorzitter van het College van procureurs-generaal beslist namens de Minister van Justitie op een verzoek tot
      inzet van een bijzondere bijstandseenheid, afgezien van die situaties:

      a. waarin de UIM op basis van de criteria, genoemd in [artikel 4, derde lid][ref1], de aangewezen eenheid is om te
      worden ingezet;

      b. waarin zich meerdere incidenten op verschillende locaties tegelijkertijd voordoen, waartussen vermoedelijk een
      verband bestaat;

      c. waarin op enige andere wijze een groot nationaal belang in het geding is;

      d. waarvoor geen vooraf vastgesteld standaard inzetscenario als bedoeld in [artikel 4, vierde lid][ref2],
      voorhanden is.


