  - number: '2'
    text: |-
      1 Er is een Dienst Speciale Interventies (DSI).

      2 De DSI heeft tot taak het bestrijden van alle voorkomende vormen van grof geweld dan wel terrorisme over het
      gehele geweldsspectrum, alsmede het uitvoeren van specifiek door de Minister van Justitie opgedragen taken.

      3 De DSI bestaat uit de volgende onderdelen:

      a. de Unit Interventie (UI), zijnde een bijzondere bijstandseenheid van het Korps landelijke politiediensten
      bestaande uit krijgsmacht- en politiepersoneel;

      b. de Unit Expertise & Operationele Ondersteuning (UE&OO), zijnde een bijzondere bijstandseenheid van het Korps
      landelijke politiediensten welke is belast met de technische ondersteuning van de DSI waaronder mede begrepen het
      geven van lange afstand precisievuur ter ondersteuning van de UI, de UIM en de AOE’s;

      c. een stafafdeling.

      4 Het beheer van de DSI berust bij het Korps landelijke politiediensten.
    url: https://wetten.overheid.nl/BWBR0011952/2007-01-01#Artikel2
  - number: '4'
    text: |-
      1 Behoeft een politiekorps of de Koninklijke marechaussee bijstand van een bijzondere bijstandseenheid dan richt
      het College van procureurs-generaal, op aanvraag van de officier van justitie, een verzoek daartoe aan de Minister
      van Justitie. Dit verzoek gaat vergezeld van een plan van inzet.

      2 De daadwerkelijke inzet van bijzondere bijstandseenheden vindt plaats na goedkeuring van het plan van inzet van
      deze eenheid, eenheden of onderdelen daarvan door de Minister van Justitie.

      3 Het plan van inzet bevat een voorstel aangaande welke bijstandseenheid zou moeten worden ingezet. Dit voorstel
      wordt door de officier van justitie gemaakt op basis van de volgende criteria:

      a. de mate van het te verwachten geweld;

      b. de situatie van de dreiging;

      c. de flexibiliteit van de eenheden.

      4 Indien het plan van inzet betrekking heeft op de UIM, consulteert de Minister van Justitie de Minister van
      Defensie, alvorens over het plan van inzet te beslissen.

      5 De Minister van Justitie stelt in overeenstemming met de Ministers van Binnenlandse Zaken en Koninkrijksrelaties
      en van Defensie standaard inzetscenario’s vast.

      6 Indien voor de inzet geen vooraf vastgesteld standaard inzetscenario voorhanden is, consulteert de Minister van
      Justitie zo mogelijk de Ministers van Binnenlandse Zaken en Koninkrijksrelaties en van Defensie, alvorens over het
      plan van inzet te beslissen.

      7 De Minister van Justitie laat zich in een nationale situatie adviseren door het Beleidsteam DSI, alvorens over
      het plan van inzet genoemd in [artikel 4, eerste lid][ref1], te beslissen.

      8 De Ministers van Defensie, van Binnenlandse Zaken en Koninkrijksrelaties en van Algemene Zaken worden door de
      Minister van Justitie onverwijld in kennis gesteld van een besluit tot inzet van een bijzondere bijstandseenheid.
      Dit geschiedt zo mogelijk voorafgaand aan de daadwerkelijke inzet.


      [ref1]: https://wetten.overheid.nl/BWBR0011952#Artikel4
