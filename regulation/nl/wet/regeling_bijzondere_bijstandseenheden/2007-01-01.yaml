articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. Bijzondere bijstandseenheid: bijstandseenheid als bedoeld in
      [artikel 60, eerste lid, van de Politiewet 1993][ref1];

      b. Aanhoudings- en Ondersteuningseenheden (AOE’s): aanhoudings- en ondersteuningseenheden van de regionale
      politiekorpsen als bedoeld in [artikel 8 van het Besluit beheer regionale politiekorpsen][ref2] en de aanhoudings-
      en ondersteuningseenheid van de Brigade Speciale beveiligingsopdrachten van de Koninklijke marechaussee;

      c. Unit Interventie Mariniers (UIM): bijzondere bijstandseenheid van het Korps Mariniers van het Commando
      Zeestrijdkrachten;

      d. Afstemmingsoverleg stelsel van speciale eenheden: ingevolge de [instellingsregeling][ref3] van de Ministers van
      Justitie, van Binnenlandse Zaken en Koninkrijksrelaties en van Defensie d.d. 28 juni 2006 als zodanig aangewezen
      Afstemmingsoverleg stelsel voor speciale eenheden;

      e. Beleidsteam DSI: ingevolge de [instellingsregeling][ref4] van de Ministers van Justitie, van Binnenlandse Zaken
      en Koninkrijksrelaties en van Defensie d.d. 28 juni 2006 als zodanig aangewezen Beleidsteam DSI.


