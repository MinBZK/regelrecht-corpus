      2 Met het in werking treden van deze regeling komt de regeling van 29 maart 1994 kenmerken 430240/594/GBJ en EA94/U
      892 te vervallen.
    url: https://wetten.overheid.nl/BWBR0011952/2000-12-31#Artikel12
