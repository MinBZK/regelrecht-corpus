  text: |-
    gehoord hebbende de BELCOM-BBE en handelende in overeenstemming met de Minister van Defensie,

    Gelet op artikel 59, tweede lid en artikel 60, tweede lid van de Politiewet 1993 en artikel 9 vierde lid en artikel
    12 eerste lid van het Besluit beheer regionale politiekorpsen (BBRP),

    Besluiten:
  url: https://wetten.overheid.nl/BWBR0011952/2000-12-31#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

        - *BBE-politie:* de bijzondere bijstandseenheid bedoeld in
      [artikel 9, eerste lid van het Besluit beheer regionale politiekorpsen][ref1] (BBRP), dan wel een onderdeel
      daarvan;
        - *BBE-defensie:* de bijzondere bijstandseenheden van het ministerie van Defensie, bedoeld in de
      [Instellingsregeling bijzondere bijstandseenheden Defensie][ref2]1, dan wel een onderdeel daarvan;
        - *Bijzondere bijstandseenheid:* de BBE-politie of de BBE-defensie, danwel een onderdeel daarvan;
        - *Belcom-bbe:* De ingevolge de instellingsregeling van de Minister van Justitie d.d. 17 januari 2000 kenmerk R
      45/99 als zodanig aangewezen Begeleidingscommissie van de Bijzondere Bijstandseenheden.


      [ref1]: https://wetten.overheid.nl/BWBR0006560#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0006571
    url: https://wetten.overheid.nl/BWBR0011952/2000-12-31#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006560
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0006571
  - number: '2'
    text: |-
      1 Behoeft een regionaal politiekorps bijstand van de BBE-defensie, dan richt de korpsbeheerder op aanvraag van de
      officier van justitie een verzoek daartoe aan het College van procureurs-generaal.

      2 Behoeft het Korps landelijke politiediensten bijstand van de BBE-defensie dan richt de Minister van Binnenlandse
      Zaken en Koninkrijksrelaties op aanvraag van de officier van justitie een verzoek daartoe aan het College van
      procureurs-generaal.

      3 Behoeft de Koninklijke Marechaussee bij de uitoefening van de politietaak bijstand van de BBE-defensie dan wel
      van de BBE-politie dan richt de officier van justitie een verzoek daartoe aan het College van procureurs-generaal.

      4 Indien het College van procureurs-generaal de inzet van de BBE-defensie dan wel de inzet van de BBE-politie
      ingevolge het eerste onderscheidenlijk het tweede of derde lid, noodzakelijk acht, dan richt het College, na
      overleg met de commissaris van de Koningin, een verzoek daartoe tot de Minister van Justitie.
    url: https://wetten.overheid.nl/BWBR0011952/2000-12-31#Artikel2
  - number: '3'
    text: De Minister van Justitie beslist over een verzoek om bijstand van een bijzondere bijstandseenheid.
    url: https://wetten.overheid.nl/BWBR0011952/2000-12-31#Artikel3
  - number: '4'
    text: |-
      1 De alarmering van bijzondere bijstandseenheden geschiedt op last van de Minister van Justitie door de Korpschef
      van het Korps landelijke politiediensten.

      2 Van de alarmering van de BBE-defensie wordt de Minister van Defensie zo spoedig mogelijk door de zorg van de
      Minister van Justitie in kennis gesteld.

      Van de alarmering van de BBE-politie wordt de Minister van Binnenlandse Zaken en Koninkrijksrelaties zo spoedig
      mogelijk door de zorg van de Minister van Justitie in kennis gesteld.

      3 De korpschef van het Korps landelijke politiediensten stelt een door hem aangewezen coördinator danwel
      coördinatoren BBE ter beschikking van het bevoegd gezag.

      4 Bij een alarmering van BBE-defensie danwel bij een behoeftestelling van defensie-expertise of -middelen wordt
      door de Minister van Defensie desgewenst voorzien in het ter beschikking stellen voor coördinerende doeleinden aan
      het bevoegde gezag van een door hem als zodanig aangewezen defensie-coördinator.
    url: https://wetten.overheid.nl/BWBR0011952/2000-12-31#Artikel4
  - number: '5'
    text: |-
      1 De daadwerkelijke inzet van bijzondere bijstandseenheden vindt slechts plaats na goedkeuring van een plan tot
      inzet van deze eenheid, eenheden of onderdelen daarvan door de Minister van Justitie.

      2 Het plan tot inzet van de BBE-defensie, danwel van de BBE-politie als deze als volledige eenheid wordt ingezet,
      wordt met een advies van de Belcom-bbe ter zake aan de Minister van Justitie voorgelegd.

      3 Alvorens het plan van inzet genoemd onder punt 2 van dit artikel goed te keuren, danwel wanneer een eenheid van
      de BBE volledig wordt ingezet, voert de Minister van Justitie overleg met de Minister-President, de Minister van
      Algemene Zaken, de Minister van Binnenlandse Zaken en Koninkrijksrelaties, de Minister van Defensie en eventueel
      met andere betrokken ministers.
    url: https://wetten.overheid.nl/BWBR0011952/2000-12-31#Artikel5
  - number: '6'
    text: |-
      1 Het bevoegd gezag, in de zin zoals is vermeld in [hoofdstuk IV van de Politiewet 1993][ref1], wijst een algemeen
      commandant aan, die de algehele leiding heeft over het optreden van de bijzondere bijstandseenheid alsmede de leden
      hiervan en de daarbij eventueel aan de BBE toegevoegde andere ondersteunende eenheden.

      2 De algemeen commandant is belast met de uitvoering van de door of vanwege het bevoegd gezag gegeven aanwijzingen,
      verzoeken en opdrachten en stelt in overleg met de in [artikel 4 lid 3][ref2] vermelde coördinator(en) BBE plannen
      op ter beëindiging van het zeer ernstige misdrijf, waarbij sprake is van direct levensbedreigende omstandigheden.

      3 De algemeen commandant draagt zorg voor de chronologische verslaglegging van het feitelijk optreden.


      [ref1]: https://wetten.overheid.nl/BWBR0006299#HoofdstukIV
      [ref2]: https://wetten.overheid.nl/BWBR0011952#Artikel4
    url: https://wetten.overheid.nl/BWBR0011952/2000-12-31#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0006299
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0011952
        artikel: '4'
        paragraaf: '3'
  - number: '7'
    text: |-
      1 Het bevoegd gezag kan een operationeel commandant aanwijzen, die onder direct bevel van de algemeen commandant
      staat. Hij heeft de feitelijke leiding over alle bij de operatie betrokken bijzondere bijstandseenheden.

      2 De operationeel commandant draagt zorg voor de verbindingen met de onder hem gestelde commandanten. Hij kan
      worden belast met verslaglegging van het feitelijk optreden.
    url: https://wetten.overheid.nl/BWBR0011952/2000-12-31#Artikel7
  - number: '8'
    text: |-
      1 De commandant van de bijzondere bijstandseenheid staat bij de uitvoering van de door het bevoegd gezag
      geaccordeerde inzetplannen onder direct bevel van de algemeen commandant dan wel van de operationeel commandant.
      Hij heeft de feitelijke leiding over zijn bijzondere bijstandseenheid alsmede in voorkomend geval over de aan die
      bijzondere bijstandseenheid toegevoegde personen.

      2 De commandant van de bijzondere bijstandseenheid draagt met betrekking tot zijn bijzondere bijstandseenheid zorg
      voor de ontwikkeling en voorbereiding van plannen ter beëindiging van het zeer ernstige misdrijf, waarbij sprake is
      van direct levensbedreigende omstandigheden en rapporteert over het optreden van de bijzondere bijstandseenheid, na
      overleg hierover met de coördinator BBE, aan de boven hem gestelde commandant.
    url: https://wetten.overheid.nl/BWBR0011952/2000-12-31#Artikel8
  - number: '9'
    text: |-
      1 De ambtenaar van politie, die ter beschikking wordt gehouden ten behoeve van de BBE-politie, heeft voldaan aan
      de eindtermen van de door de Ministers van Justitie en Binnenlandse Zaken en Koninkrijkrelaties aan te wijzen
      vervolgopleiding voor precisieschutter van de bijzondere bijstandseenheid

      2 De korpsbeheerder draagt er zorg voor dat de kennis en de vaardigheden van de in het eerste lid genoemde
      ambtenaar worden onderhouden op minimaal het niveau van de in het eerste lid bedoelde eindtermen.

      3 De precisie-schutters, welke zijn ingedeeld bij de BBE-krijgsmacht en ter beschikking worden gehouden voor deze
      bijzondere bijstandseenheid dienen eveneens voldaan te hebben aan de eindtermen zoals bedoeld in het eerste lid van
      dit artikel.

      4 De korpsbeheerder van de in lid 3 vermelde precisieschutters draagt er zorg voor dat de kennis en de vaardigheden
      van de in het derde lid genoemde precisieschutters worden onderhouden op minimaal het niveau van de in het eerste
      lid bedoelde eindtermen.
    url: https://wetten.overheid.nl/BWBR0011952/2000-12-31#Artikel9
  - number: '10'
    text: |-
      1 De kosten, die door de korpsbeheerder van een regionaal politiekorps of door ambtenaren van politie, in verband
      met hun indeling in de BBE-Politie worden gemaakt voor opleiding en bijzondere uitrusting, alsmede de daarmee
      samenhangende reis- en verblijfkosten komen ten laste van het budget dat hiertoe door het Ministerie van Justitie
      aan het Korps landelijke politiediensten wordt verstrekt.

      2 De overige kosten, die worden gemaakt ten behoeve van ambtenaren van politie die door een regionaal politiekorps
      beschikbaar worden gesteld voor de BBE-politie, komen ten laste van dat regionale politiekorps.
    url: https://wetten.overheid.nl/BWBR0011952/2000-12-31#Artikel10
  - number: '11'
    text: |-
      1 De volgende kosten van de BBE-defensie komen ten laste van het budget van het Korps Landelijke Politiediensten:

      a. de kosten voor opleiding, voor zover die opleiding niet door of vanwege het Ministerie van Defensie worden
      verzorgd;

      b. de kosten voor bijzondere uitrusting, materialen, bewapening en munitie voor zover deze uitrusting, materialen,
      bewapening en munitie niet door of vanwege het Ministerie van Defensie worden gevoerd;

      c. de reis- en verblijfkosten.

      2 De overige kosten, die worden gemaakt ten behoeve van militairen, die door de Minister van Defensie beschikbaar
      worden gesteld voor de BBE-defensie, komen ten laste van het ministerie van Defensie.
    url: https://wetten.overheid.nl/BWBR0011952/2000-12-31#Artikel11
  - number: '12'
    text: |-
      1 Deze regeling treedt in werking met ingang van de tweede dag na dagtekening van de Staatscourant waarin zij wordt
