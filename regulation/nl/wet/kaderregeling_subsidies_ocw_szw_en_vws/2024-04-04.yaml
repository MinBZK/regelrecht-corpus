  - number: '1.3'
    text: |-
      De minister kan in een ministeriële regeling of in een beleidsregel de activiteiten waarvoor en de voorwaarden
      waaronder subsidie kan worden verstrekt, nader bepalen.
    url: https://wetten.overheid.nl/BWBR0037603/2024-04-04#Artikel1.3
  - number: '1.4'
    text: |-
      Een subsidie ten laste van een begroting die nog niet is vastgesteld, wordt verleend onder de voorwaarde dat
      voldoende gelden ter beschikking worden gesteld.
    url: https://wetten.overheid.nl/BWBR0037603/2024-04-04#Artikel1.4
  - number: '1.5'
    text: |-
      De minister verstrekt uitsluitend:

      a. indien de subsidie minder dan € 25.000 bedraagt:

      1°. een subsidie die zonder voorafgaande verlening direct wordt vastgesteld op een bedrag waarvan de hoogte door de
      minister bij de vaststelling wordt genoemd, of

      2°. een subsidie die ambtshalve wordt vastgesteld tot ten hoogste het bedrag waarvan de hoogte door de minister bij
      de verlening is genoemd,

      b. indien de subsidie € 25.000 of meer bedraagt en de te subsidiëren activiteiten uit meetbare prestatie-eenheden
      bestaan:

      een subsidie die wordt vastgesteld op een bedrag per gerealiseerde prestatie-eenheid waarvan de hoogte door de
      minister bij de verlening is genoemd, voor ten hoogste het maximum aantal prestatie-eenheden dat door de minister
      bij de verlening is genoemd,

      c. indien de subsidie € 25.000 of meer bedraagt, doch minder dan € 125.000, en de te subsidiëren activiteiten niet
      uit meetbare prestatie-eenheden bestaan:

      1°. indien naar het oordeel van de minister voldoende zekerheid bestaat over de kosten en opbrengsten:

      een subsidie waarbij op basis van een activiteitenverslag wordt aangetoond dat de te subsidiëren activiteiten
      hebben plaatsgevonden overeenkomstig de aan de verleende subsidie verbonden verplichtingen,

      2°. indien naar het oordeel van de minister onvoldoende zekerheid bestaat over de kosten en opbrengsten:

      een subsidie waarbij op basis van een verklaring inzake werkelijke kosten en opbrengsten wordt aangetoond dat
      de te subsidiëren activiteiten hebben plaatsgevonden overeenkomstig de aan de verleende subsidie verbonden
      verplichtingen,

      d. indien de subsidie € 125.000 of meer bedraagt, en de te subsidiëren activiteiten niet uit meetbare prestatie-
      eenheden bestaan:

      een subsidie waarbij wordt aangetoond dat de te subsidiëren activiteiten hebben plaatsgevonden overeenkomstig de
      aan de verleende subsidie verbonden verplichtingen, en waarbij tevens rekening en verantwoording wordt afgelegd
      omtrent de met de gesubsidieerde activiteiten samenhangende kosten en opbrengsten.
    url: https://wetten.overheid.nl/BWBR0037603/2024-04-04#Artikel1.5
  - number: '1.6'
    text: |-
      In bijzondere gevallen kan bij beschikking worden afgeweken van de bedragen en de wijze van verstrekking, bedoeld
      in [artikel 1.5][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037603#Artikel1.5
    url: https://wetten.overheid.nl/BWBR0037603/2024-04-04#Artikel1.6
    references:
      - id: ref1
        bwb_id: BWBR0037603
        artikel: '1.5'
        hoofdstuk: '1'
  - number: '1.7'
    text: |-
      1 De kosten worden berekend op basis van een controleerbare methode, die is gebaseerd op bedrijfseconomische
      grondslagen en normen die in het maatschappelijk verkeer als aanvaardbaar worden beschouwd en die door de
      subsidieontvanger stelselmatig worden toegepast.

      2 De afschrijving van materiële vaste activa wordt berekend op basis van historische aanschafprijzen, tenzij door
      de minister anders is bepaald.

      3 Toevoegingen aan voorzieningen en reserveringen komen niet in aanmerking voor subsidie, tenzij de minister met
      deze toevoegingen schriftelijk heeft ingestemd.
    url: https://wetten.overheid.nl/BWBR0037603/2024-04-04#Artikel1.7
  - number: '1.8'
    text: |-
      Bij terugvordering van ten onrechte betaalde subsidiebedragen of voorschotten kan de minister de subsidieontvanger
      verplichten de met de terugvordering verband houdende kosten te voldoen. Daarbij kan de minister de verschuldigde
      wettelijke rente vorderen.
    url: https://wetten.overheid.nl/BWBR0037603/2024-04-04#Artikel1.8
  - number: '1.9'
    text: |-
      Op subsidieverstrekking aan subsidieontvangers in Caribisch Nederland is
      [Titel 4.2 van de Algemene wet bestuursrecht][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0037603/2024-04-04#Artikel1.9
    references:
      - id: ref1
        bwb_id: BWBR0005537
  - number: '1.10'
    text: Voor subsidieverstrekking wordt uitgegaan van de in het Europese deel van Nederland geldende tijd.
    url: https://wetten.overheid.nl/BWBR0037603/2024-04-04#Artikel1.10
  - number: '2.1'
    text: |-
      1 De minister kan een subsidieplafond vaststellen.

      2 Voor subsidies die worden verstrekt door de Minister van Sociale Zaken en Werkgelegenheid, wordt het
      subsidieplafond vastgesteld met inachtneming van [artikel 5 van de Kaderwet SZW-subsidies][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008754#Artikel5
    url: https://wetten.overheid.nl/BWBR0037603/2024-04-04#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0008754
        artikel: '5'
  - number: '2.2'
    text: |-
      De minister verdeelt het ingevolge het subsidieplafond beschikbare bedrag:

      a. op volgorde van binnenkomst van de aanvragen,

      b. na onderlinge afweging van de aanvragen,

      c. evenredig over de ingediende aanvragen, of

      d. op een in een ministeriële regeling of in een beleidsregel aangegeven andere wijze.
    url: https://wetten.overheid.nl/BWBR0037603/2024-04-04#Artikel2.2
  - number: '2.3'
    text: |-
      1 Indien het ingevolge het subsidieplafond beschikbare bedrag op volgorde van binnenkomst van de aanvragen wordt
      verdeeld:

      a. geldt, als de aanvraag krachtens [artikel 4:5 van de Algemene wet bestuursrecht][ref1] is aangevuld, bij de
      verdeling de dag waarop de volledig aangevulde aanvraag is ontvangen, als de datum van ontvangst, en

      b. stelt de minister, als het subsidieplafond wordt bereikt, de onderlinge rangschikking van aanvragen die op
      hetzelfde tijdstip zijn ontvangen, door middel van loting vast.

      2 Indien het ingevolge het subsidieplafond beschikbare bedrag na onderlinge afweging van de aanvragen wordt
      verdeeld, geeft de minister die aanvragen voorrang die naar verwachting meer geschikt zijn om bij te dragen aan de
      doelstellingen van de subsidieverstrekking.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel45
    url: https://wetten.overheid.nl/BWBR0037603/2024-04-04#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:5
  - number: '3.1'
    text: |-
      Voor een aanvraag tot verlening van een subsidie wordt een door de minister vastgesteld modelformulier gebruikt dat
      is bekend gemaakt op de website www.rijksoverheid.nl.
    url: https://wetten.overheid.nl/BWBR0037603/2024-04-04#Artikel3.1
  - number: '3.2'
    text: |-
      1 De minister kan bepalen dat aanvragen voor een door hem te bepalen datum of binnen een door hem te bepalen
      periode zijn ontvangen.

      2 Een aanvraag tot verlening van een subsidie wordt in ieder geval ingediend voor aanvang van de periode waarvoor
      subsidie wordt aangevraagd.
    url: https://wetten.overheid.nl/BWBR0037603/2024-04-04#Artikel3.2
  - number: '3.3'
    text: |-
      Een aanvraag tot verlening van een subsidie bestaat uit:

      a. een activiteitenplan, tenzij de minister daaraan geen behoefte heeft, en

      b. een begroting, tenzij deze naar het oordeel van de minister voor de berekening van het bedrag van de subsidie
      niet van belang is.
    url: https://wetten.overheid.nl/BWBR0037603/2024-04-04#Artikel3.3
  - number: '3.4'
    text: |-
      Het activiteitenplan:

      a. bevat een overzicht van de activiteiten waarvoor subsidie wordt aangevraagd,

      b. beschrijft aard, omvang, duur en wijze van uitvoering van de activiteiten, en

      c. beschrijft de met de activiteiten na te streven doelstellingen, resultaten of producten.
    url: https://wetten.overheid.nl/BWBR0037603/2024-04-04#Artikel3.4
  - number: '3.5'
    text: |-
      1 De begroting behelst per activiteit een overzicht van de geraamde kosten en opbrengsten van de aanvrager, voor
      zover deze betrekking hebben op de periode waarvoor subsidie wordt aangevraagd.

      2 De begrotingsposten worden ieder afzonderlijk van een toelichting voorzien.

      3 De begroting die bij de aanvraag wordt ingediend, is sluitend.
    url: https://wetten.overheid.nl/BWBR0037603/2024-04-04#Artikel3.5
  - number: '3.6'
    text: |-
      Voor zover de aanvrager voor dezelfde begrote kosten ook subsidie of een andere financiële bijdrage heeft
      aangevraagd bij een ander bestuursorgaan, doet hij daarvan mededeling in de aanvraag tot verlening van de subsidie,
      onder vermelding van de stand van zaken van de beoordeling van die andere aanvraag.
    url: https://wetten.overheid.nl/BWBR0037603/2024-04-04#Artikel3.6
  - number: '3.7'
    text: Op verzoek van de minister legt de aanvrager een volledig en recent overzicht van zijn financiële situatie over.
    url: https://wetten.overheid.nl/BWBR0037603/2024-04-04#Artikel3.7
  - number: '4.1'
    text: |-
      1 De minister besluit binnen 13 weken na ontvangst van de aanvraag tot subsidieverlening of binnen 13 weken na
      afloop van de periode waarin aanvragen kunnen worden ingediend.

      2 De termijn bedraagt 22 weken indien:

      a. sprake is van cofinanciering van een door de Raad van de Europese Unie, het Europees Parlement en die Raad
      gezamenlijk of de Europese Commissie goedgekeurd programma,

      b. de minister over de aanvraag extern advies inwint, of

      c. de minister een nader onderzoek naar de aanvraag instelt.

      3 De termijn bedraagt 40 weken indien de verlening afhankelijk is van het oordeel van een internationale commissie
      of van buitenlandse deskundigen.

      4 Indien een termijn als bedoeld in het tweede of derde lid van toepassing is en dit niet reeds volgt uit een
      ministeriële regeling of een beleidsregel, deelt de minister dat zo spoedig mogelijk mee aan de aanvrager.
    url: https://wetten.overheid.nl/BWBR0037603/2024-04-04#Artikel4.1
  - number: '4.2'
    text: |-
      1 Het besluit tot subsidieverlening vermeldt in ieder geval de activiteiten of de prestatie-eenheden waarvoor
      subsidie wordt verleend, het subsidiebedrag, de wijze van verantwoording, de periode waarvoor subsidie wordt
      verleend, de wijze waarop kan worden aangetoond dat de activiteiten zijn verricht of de prestatie-eenheden zijn
      gerealiseerd en indien sprake is van een subsidie als bedoeld in [artikel 1.5, onderdeel a, onder 2°][ref1], de
      datum waarop de activiteiten uiterlijk moeten zijn afgerond.

      2 Indien in het besluit tot verlening de begrote kosten van de te subsidiëren activiteiten zijn vermeld, zijn deze
      gelijk aan de som van de in dat besluit vermelde bijdragen van derden, begrote eigen bijdrage en de subsidie.


      [ref1]: https://wetten.overheid.nl/BWBR0037603#Artikel1.5
    url: https://wetten.overheid.nl/BWBR0037603/2024-04-04#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0037603
        artikel: '1.5'
        hoofdstuk: '1'
  - number: '4.3'
    text: |-
      1 De minister verleent een projectsubsidie slechts voor een periode die aanvangt na ontvangst van de aanvraag.

      2 Een projectsubsidie wordt voor ten hoogste 5 jaren verleend.
    url: https://wetten.overheid.nl/BWBR0037603/2024-04-04#Artikel4.3
  - number: '5.1'
    text: |-
      De subsidieontvanger zorgt ervoor dat:

      a. de activiteiten zodanig worden uitgevoerd dat de subsidie op doelmatige wijze wordt gebruikt voor de doeleinden
      waarvoor deze wordt verstrekt, en

      b. de voor de uitvoering van de gesubsidieerde activiteiten benodigde middelen op verantwoorde wijze worden
      beheerd.
    url: https://wetten.overheid.nl/BWBR0037603/2024-04-04#Artikel5.1
  - number: '5.2'
    text: |-
      1 De ontvanger van een subsidie als bedoeld in [artikel 1.5, onderdelen b, c onder 2°, en d][ref1], voert een
      administratie. De administratie is zodanig ingericht dat daaruit te allen tijde:

      a. indien een subsidie als bedoeld in [artikel 1.5, onderdeel b][ref2], is verleend: de voor de vaststelling van
      de subsidie van belang zijnde rechten en verplichtingen alsmede de gerealiseerde prestatie-eenheden kunnen worden
      nagegaan, of

      b. indien een subsidie als bedoeld in [artikel 1.5, onderdeel c, onder 2°, of d][ref3], is verleend: de voor de
      vaststelling van de subsidie van belang zijnde rechten en verplichtingen, betalingen en ontvangsten alsmede kosten
      en opbrengsten kunnen worden nagegaan.

      2 De administratie wordt op overzichtelijke, controleerbare en doelmatige wijze ingericht.

      3 De administratie en de daartoe behorende bescheiden worden gedurende 10 jaren na de vaststelling bewaard.


      [ref1]: https://wetten.overheid.nl/BWBR0037603#Artikel1.5
      [ref2]: https://wetten.overheid.nl/BWBR0037603#Artikel1.5
      [ref3]: https://wetten.overheid.nl/BWBR0037603#Artikel1.5
    url: https://wetten.overheid.nl/BWBR0037603/2024-04-04#Artikel5.2
    references:
      - id: ref1
        bwb_id: BWBR0037603
