    text: |-
      1 De minister kan subsidie verstrekken voor activiteiten die passen binnen het beleid op de terreinen, genoemd
      in [artikel 2 van de Wet overige OCW-subsidies][ref1], [artikel 2 van de Kaderwet SZW-subsidies][ref2] en
      [artikel 2 van de Kaderwet VWS-subsidies][ref3].

      2 Deze regeling is niet van toepassing op het verstrekken van financiële middelen, bedoeld in
      [artikel 9 van de Kaderwet SZW-subsidies][ref4].


