  - number: '7.1'
    text: |-
      Voor een aanvraag tot vaststelling van een subsidie wordt een door de minister vastgesteld modelformulier gebruikt
      dat is bekend gemaakt op de website www.rijksoverheid.nl.
    url: https://wetten.overheid.nl/BWBR0037603/2024-04-04#Artikel7.1
  - number: '7.2'
    text: |-
      1 Een aanvraag tot vaststelling van een subsidie als bedoeld in [artikel 1.5, onderdelen b, c en d][ref1] wordt
      ingediend:

      a. binnen 22 weken na de datum waarop de activiteiten waarvoor subsidie is verleend, uiterlijk moeten zijn
      verricht, of

      b. binnen 22 weken na afloop van het boekjaar waarvoor de subsidie is verleend.

      2 Een aanvraag voor een subsidie als bedoeld in [artikel 1.5, onderdeel a, onder 1°][ref2], wordt ingediend binnen
      22 weken nadat de activiteiten waarvoor subsidie wordt gevraagd, zijn verricht.

      3 De minister kan vrijstelling of ontheffing verlenen van de termijnen, bedoeld in het eerste en tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0037603#Artikel1.5
      [ref2]: https://wetten.overheid.nl/BWBR0037603#Artikel1.5
    url: https://wetten.overheid.nl/BWBR0037603/2024-04-04#Artikel7.2
    references:
      - id: ref1
        bwb_id: BWBR0037603
        artikel: '1.5'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0037603
        artikel: '1.5'
        hoofdstuk: '1'
  - number: '7.3'
    text: |-
      1 Subsidie als bedoeld in [artikel 1.5, onderdeel a, onder 1°][ref1], wordt niet verstrekt voorafgaand aan de
      periode waarvoor de subsidie wordt aangevraagd.

      2 De ontvanger van een subsidie als bedoeld in [artikel 1.5, onderdeel a, onder 1°][ref2], toont aan de hand van
      een activiteitenverslag en een opgave van het totaal van de kosten aan dat de activiteiten waarvoor de subsidie
      wordt aangevraagd, zijn verricht en dat is voldaan aan de aan de subsidie verbonden verplichtingen, tenzij de
      minister daaraan geen behoefte heeft.

      3 De [artikelen 3.6][ref3] en [3.7][ref4] zijn van overeenkomstige toepassing.

      4 De minister besluit binnen 13 weken op een aanvraag tot vaststelling.
      [Artikel 4.1, tweede tot en met vierde lid][ref5], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0037603#Artikel1.5
      [ref2]: https://wetten.overheid.nl/BWBR0037603#Artikel1.5
