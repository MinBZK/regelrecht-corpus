      - id: ref3
        bwb_id: BWBR0037603
        artikel: '1.5'
        hoofdstuk: '1'
  - number: '5.3'
    text: |-
      De subsidieontvanger die aan derden zaken ter beschikking stelt of voor derden diensten verricht, brengt daarvoor
      een vergoeding in rekening die ten minste kostendekkend is, tenzij het derden betreft voor wie de gesubsidieerde
      activiteiten bestemd zijn.
    url: https://wetten.overheid.nl/BWBR0037603/2024-04-04#Artikel5.3
  - number: '5.4'
    text: |-
      De subsidieontvanger werkt, onder meer door het verschaffen van de daartoe benodigde inlichtingen, gegevens en
      bescheiden, mee aan door of namens de minister ingesteld onderzoek dat erop is gericht de minister inlichtingen te
      verschaffen die van belang zijn voor:

      a. het nemen van een besluit over het verstrekken van de subsidie, of

      b. de ontwikkeling van het beleid van de minister.
    url: https://wetten.overheid.nl/BWBR0037603/2024-04-04#Artikel5.4
  - number: '5.5'
    text: |-
      1 Indien een subsidie als bedoeld in [artikel 1.5, onderdelen b, c en d][ref1], voor meer dan 12 maanden wordt
      verleend, kan de minister verlangen dat de subsidieontvanger eenmaal per 12 maanden verslag doet van de voortgang
      van de gesubsidieerde activiteiten.

      2 Het besluit tot verlening van de subsidie vermeldt op welke tijdstippen verslag wordt gedaan en waaruit het
      verslag bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0037603#Artikel1.5
    url: https://wetten.overheid.nl/BWBR0037603/2024-04-04#Artikel5.5
    references:
      - id: ref1
        bwb_id: BWBR0037603
        artikel: '1.5'
        hoofdstuk: '1'
  - number: '5.6'
    text: |-
      De minister kan bij de verstrekking van de subsidie verplichtingen opleggen als bedoeld in de
      [artikelen 4:38][ref1], [4:39][ref2] en [4:71, eerste lid, van de Algemene wet bestuursrecht][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel438
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel439
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel471
    url: https://wetten.overheid.nl/BWBR0037603/2024-04-04#Artikel5.6
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:38
      - id: ref2
        bwb_id: BWBR0005537
        artikel: 4:39
      - id: ref3
        bwb_id: BWBR0005537
        artikel: 4:71
  - number: '5.7'
    text: |-
      1 De subsidieontvanger meldt onverwijld schriftelijk aan de minister indien:

      a. aannemelijk is geworden dat de activiteiten waarvoor de subsidie is verstrekt niet, niet tijdig of niet geheel
      zullen worden verricht,

      b. aannemelijk is geworden dat niet, niet tijdig of niet geheel aan de subsidieverplichtingen zal worden voldaan,
      of

      c. zich andere omstandigheden voordoen of zullen voordoen die van belang kunnen zijn voor een beslissing tot
      wijziging, intrekking of vaststelling van de subsidie.

      2 De melding wordt voorzien van een toelichting. Bij de melding worden de relevante stukken overgelegd.
    url: https://wetten.overheid.nl/BWBR0037603/2024-04-04#Artikel5.7
  - number: '5.8'
    text: |-
      1 Indien een gesubsidieerde activiteit leidt tot een publicatie, zorgt de subsidieontvanger dat bij de publicatie
      wordt aangegeven wie de subsidieverstrekker van de activiteit is geweest.

      2 Indien de subsidie gericht is of mede gericht is op de totstandkoming van een werk als bedoeld in
      [artikel 10, onder 1°, van de Auteurswet][ref1], zorgt de subsidieontvanger ervoor auteursrechthebbende te zijn
      ter zake van dat werk.

      3 De subsidieontvanger vrijwaart de Staat der Nederlanden voor aanspraken van derden ter zake van alle schade die
      zij lijden ten gevolge van de door of vanwege de subsidieontvanger verrichte publicaties.


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel10
    url: https://wetten.overheid.nl/BWBR0037603/2024-04-04#Artikel5.8
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: '10'
  - number: '5.9'
    text: |-
      De subsidieontvanger werkt mee aan het tot stand komen van een overeenkomst indien het naar het oordeel van de
      minister noodzakelijk is om rechten met betrekking tot intellectuele eigendom ter zake van de gesubsidieerde
      activiteiten aan de minister over te dragen.
    url: https://wetten.overheid.nl/BWBR0037603/2024-04-04#Artikel5.9
  - number: '5.10'
    text: |-
      1 In de gevallen, bedoeld in [artikel 4:41, tweede lid, van de Algemene wet bestuursrecht][ref1], is de
      subsidieontvanger aan de minister een door de minister te bepalen vergoeding verschuldigd.

      2 Bij de bepaling van de hoogte van de vergoeding wordt uitgegaan van de waarde van de zaken en andere
      vermogensbestanddelen, waaronder de egalisatiereserve, op het tijdstip waarop de vergoeding verschuldigd wordt, met
      dien verstande dat:

      a. de waarde van de egalisatiereserve gelijk is aan het bedrag van de egalisatiereserve,

      b. de waarde van een schadevergoeding voor verlies of beschadiging van zaken gelijk is aan het bedrag dat als
      schadevergoeding door de subsidieontvanger wordt ontvangen, en

      c. de waarde van onroerende zaken wordt bepaald door drie onafhankelijke deskundigen. De minister en de
      subsidieontvanger wijzen elk een deskundige aan, die in onderling overleg een derde deskundige aanwijzen.

      3 De vergoeding aan de minister voor zaken en andere vermogensbestanddelen, waaronder de egalisatiereserve,
      die geheel zijn gevormd met de subsidie, is gelijk aan hun waarde. De vergoeding aan de minister voor zaken en
      andere vermogensbestanddelen die gedeeltelijk zijn gevormd met de subsidie, is gelijk aan de waarde waarmee de
      subsidiëring door de minister in verhouding tot andere middelen aan de vorming van dat vermogen heeft bijgedragen.

      4 De minister kan de vergoeding in afwijking van het derde lid op een lager bedrag bepalen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel441
    url: https://wetten.overheid.nl/BWBR0037603/2024-04-04#Artikel5.10
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:41
  - number: '5.11'
    text: |-
      Indien de activiteiten waarvoor de subsidie is verstrekt, geheel of gedeeltelijk worden beëindigd of indien
      de subsidie wordt beëindigd, verstrekt de subsidieontvanger aan de minister op diens verzoek alle gegevens,
      bescheiden, informatie, medewerking of gebruiksrechten op auteursrechten die redelijkerwijs verlangd kunnen worden
      voor de continuïteit van de activiteiten waarvoor de subsidie is verstrekt.
    url: https://wetten.overheid.nl/BWBR0037603/2024-04-04#Artikel5.11
  - number: '6.1'
    text: |-
      1 De minister kan bij het besluit tot subsidieverlening ambtshalve voorschotten verlenen.

      2 De voorschotten worden gelijkmatig betaald over het aantal maanden waarvoor de subsidie wordt verleend.

      3 Bij beschikking kan van het tweede lid worden afgeweken.

      4 De minister betaalt het bedrag van een subsidie als bedoeld in [artikel 1.5, onderdeel a, onder 1°][ref1], in
      een keer.

      5 Indien de minister een subsidie als bedoeld in [artikel 1.5, onderdeel a, onder 2°][ref2], verleent, verleent
      hij daarbij een voorschot van 100%.


      [ref1]: https://wetten.overheid.nl/BWBR0037603#Artikel1.5
      [ref2]: https://wetten.overheid.nl/BWBR0037603#Artikel1.5
    url: https://wetten.overheid.nl/BWBR0037603/2024-04-04#Artikel6.1
    references:
