  - number: '11.3'
    text: |-
      1 De [Kaderregeling VWS-subsidies][ref1] wordt ingetrokken.

      2 De [Kaderregeling VWS-subsidies][ref2] blijft voor zover niet anders is bepaald van toepassing op:

      a. de verstrekking van subsidies waarvan de aanvraag is ontvangen voor 1 april 2016, en

      b. subsidies die voor inwerkingtreding van deze regeling zijn verleend of vastgesteld op grond van de
      [Kaderregeling VWS-subsidies][ref3].

      3 Na inwerkingtreding van deze regeling berusten het Beleidskader sportevenementen, het Beleidskader
      eerstelijnscentra in grootschalige nieuwbouwlocaties, het Beleidskader voor subsidiëring van patiënten-
      en gehandicaptenorganisaties, het [Beleidskader subsidiëring anonieme e-mental health][ref4],
      de [Beleidsregels subsidieverstrekking bijzondere transitiekosten Jeugdwet][ref5], het
      [Beleidskader Sinti en Roma][ref6] en het Beoordelingskader TOETS op [artikel 1.3][ref7].

      4 Voor de uitvoering van het [Beleidskader subsidieverstrekking bijzondere transitiekosten Jeugdwet][ref8] blijven
      [artikel 6, tweede en derde lid][ref9], en [artikel 16 van de Kaderregeling VWS-subsidies][ref10] van toepassing.


