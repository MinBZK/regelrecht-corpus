      3 Na inwerkingtreding van deze regeling is deze regeling van toepassing op regelingen met betrekking
      tot subsidieverstrekking, vastgesteld voor de inwerkingtreding van deze regeling, voor zover de
      [Regeling OCW-subsidies][ref4] daarop van toepassing was.

