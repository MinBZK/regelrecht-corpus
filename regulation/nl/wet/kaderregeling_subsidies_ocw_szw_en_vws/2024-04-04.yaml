      1 De [Algemene regeling SZW-subsidies][ref1] wordt ingetrokken.

      2 De [Algemene regeling SZW-subsidies][ref2] blijft voor zover niet anders is bepaald van toepassing op:

      a. de verstrekking van subsidies waarvan de aanvraag is ontvangen voor 1 april 2016,

