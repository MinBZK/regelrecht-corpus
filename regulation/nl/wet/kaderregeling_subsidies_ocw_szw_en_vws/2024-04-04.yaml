      [artikelen 3.2, tweede lid][ref5], en [4.3, eerste lid][ref6], niet van toepassing tot 1 januari 2017.

      7 Op regelingen met betrekking tot subsidieverstrekking, vastgesteld voor de inwerkingtreding van deze regeling,
      zijn de [artikelen 3.1][ref7] en [7.1][ref8] niet van toepassing.


