    text: |-
      1 Subsidies van minder dan € 125.000 worden niet verleend of zonder voorafgaande verlening vastgesteld.

      2 Het eerste lid geldt niet voor:

      a. subsidies met betrekking tot oorlogsgetroffenen en herinnering Wereldoorlog II,

      b. subsidies aan organisaties als bedoeld in
      [artikel 14 van de Wet op de beroepen in de individuele gezondheidszorg][ref1] voor activiteiten met betrekking tot
      specialistenregisters van wettelijk erkende specialistentitels,

      c. subsidies ten behoeve van activiteiten die het leren gebruiken van uitkomstinformatie voor Samen beslissen
      bewerkstelligen of bevorderen,

      d. subsidies ten behoeve van de donorwerving in ziekenhuizen,

      e. subsidies uit hoofde van het
      [Beleidskader subsidiëring Versnellingsprogramma Informatie-uitwisseling Patiënt en Professional][ref2],

      f. subsidies uit hoofde van de
      [Beleidsregels subsidiëring Versnellingsprogramma Informatie-uitwisseling Patiënt en Professional fase 2][ref3],

      g. subsidies uit hoofde van de
      [Beleidsregels subsidiëring Versnellingsprogramma Informatie-uitwisseling Patiënt en Professional fase 3][ref4],

      h. subsidies uit hoofde van de [Subsidieregeling topsportevenementen 2024–2028][ref5].


