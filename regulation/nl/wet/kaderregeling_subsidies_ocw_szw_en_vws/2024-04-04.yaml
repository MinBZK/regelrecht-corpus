      [Algemene regeling SZW-subsidies][ref3] van toepassing was,

      c. regelingen met betrekking tot subsidieverstrekking, vastgesteld voor de inwerkingtreding van deze regeling, voor
      zover de [Algemene regeling SZW-subsidies][ref4] daarop van toepassing was, en

      d. beschikkingen op grond van regelingen als bedoeld in onderdeel c.

      3 Indien in een regeling als bedoeld in het tweede lid, onderdeel c, of in een besluit tot subsidieverstrekking
      de [Algemene regeling SZW-subsidies][ref5] buiten toepassing is verklaard, is deze regeling daarop en op de daarop
      gebaseerde beschikkingen in verband met subsidieverstrekking eveneens niet van toepassing.


