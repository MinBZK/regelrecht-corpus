  - number: '7.4'
    text: |-
      1 De ontvanger van een subsidie als bedoeld in [artikel 1.5, onderdeel a, onder 2°][ref1], toont op verzoek van
      de minister op de in de beschikking aangegeven wijze aan dat de activiteiten waarvoor de subsidie is verleend, zijn
      verricht en dat is voldaan aan de aan de verleende subsidie verbonden verplichtingen.

      2 De minister neemt binnen 22 weken na afloop van de datum waarop de activiteiten waarvoor de subsidie wordt
      verleend, zijn verricht, ambtshalve een besluit over de vaststelling van de subsidie.

      3 De subsidie wordt vastgesteld op een bedrag tot ten hoogste het in de verleningsbeschikking genoemde bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0037603#Artikel1.5
    url: https://wetten.overheid.nl/BWBR0037603/2024-04-04#Artikel7.4
    references:
      - id: ref1
        bwb_id: BWBR0037603
        artikel: '1.5'
        hoofdstuk: '1'
  - number: '7.5'
    text: |-
      1 De ontvanger van een subsidie als bedoeld in [artikel 1.5, onderdeel b][ref1], toont op de bij het besluit tot
      verlening van de subsidie bepaalde wijze aan dat de activiteiten waarvoor de subsidie is verleend, zijn verricht en
      dat is voldaan aan de aan de verleende subsidie verbonden verplichtingen.

      2 Indien de subsidie € 125.000 of meer bedraagt, legt de subsidieontvanger tevens verantwoording af door het
      overleggen van een assurancerapport.

      3 De minister kan de subsidieontvanger verplichten om het assurancerapport vergezeld te doen gaan van een
      rapport van feitelijke bevindingen omtrent de naleving van de aan de subsidie verbonden verplichtingen door de
      subsidieontvanger.

      4 De in het tweede en derde lid bedoelde rapporten zijn opgesteld door een accountant overeenkomstig een door
      de minister vastgesteld model met inachtneming van een door de minister vastgesteld accountantsprotocol, bekend
      gemaakt op de website www.rijksoverheid.nl.

      5 De subsidie wordt vastgesteld op een bedrag per gerealiseerde prestatie-eenheid waarvan de hoogte door de
      minister bij de verlening is genoemd, voor ten hoogste het maximum aantal subsidiabele prestatie-eenheden dat door
      de minister bij de verlening is genoemd.

      6 De minister besluit binnen 22 weken op een aanvraag tot vaststelling.


      [ref1]: https://wetten.overheid.nl/BWBR0037603#Artikel1.5
    url: https://wetten.overheid.nl/BWBR0037603/2024-04-04#Artikel7.5
    references:
      - id: ref1
        bwb_id: BWBR0037603
        artikel: '1.5'
        hoofdstuk: '1'
  - number: '7.6'
    text: |-
      1 De ontvanger van een subsidie als bedoeld in [artikel 1.5, onderdeel c, onder 1°][ref1], toont aan de hand van
      een activiteitenverslag aan dat de activiteiten waarvoor de subsidie is verleend, zijn verricht en dat is voldaan
      aan de aan de subsidie verbonden verplichtingen, tenzij de minister daaraan geen behoefte heeft.

      2 Indien de activiteiten waarvoor de subsidie is verleend geheel zijn verricht en volledig is voldaan aan de
      verplichtingen die verbonden zijn aan de verleende subsidie, wordt de subsidie vastgesteld op het bedrag waarvan de
      hoogte door de minister bij de verlening is genoemd.

      3 De minister besluit binnen 22 weken op een aanvraag tot vaststelling.


      [ref1]: https://wetten.overheid.nl/BWBR0037603#Artikel1.5
    url: https://wetten.overheid.nl/BWBR0037603/2024-04-04#Artikel7.6
    references:
      - id: ref1
        bwb_id: BWBR0037603
        artikel: '1.5'
        hoofdstuk: '1'
  - number: '7.7'
    text: |-
      1 De ontvanger van een subsidie als bedoeld in [artikel 1.5, onderdeel c, onder 2°][ref1], toont aan de hand van
      een verklaring inzake werkelijke kosten en opbrengsten aan dat de activiteiten zijn verricht en dat is voldaan aan
      de aan de verleende subsidie verbonden verplichtingen.

      2 Indien de activiteiten waarvoor de subsidie is verleend geheel zijn verricht en volledig is voldaan aan de
      verplichtingen die verbonden zijn aan de verleende subsidie, wordt de subsidie vastgesteld op het bedrag dat
      bestaat uit de totale gerealiseerde kosten verminderd met de totale gerealiseerde bijdragen van derden en de
      begrote eigen bijdrage of de gerealiseerde eigen bijdrage indien deze hoger is dan de begrote eigen bijdrage tot
      ten hoogste het in de verleningsbeschikking genoemde bedrag.

      3 De minister besluit binnen 22 weken op een aanvraag tot vaststelling.


      [ref1]: https://wetten.overheid.nl/BWBR0037603#Artikel1.5
    url: https://wetten.overheid.nl/BWBR0037603/2024-04-04#Artikel7.7
    references:
      - id: ref1
        bwb_id: BWBR0037603
        artikel: '1.5'
        hoofdstuk: '1'
  - number: '7.8'
    text: |-
      1 De ontvanger van een subsidie als bedoeld in [artikel 1.5, onderdeel d][ref1], legt rekening en verantwoording af
      aan de hand van een activiteitenverslag en een financieel verslag, tenzij dit voor de berekening van het bedrag van
      de subsidie niet van belang is.

      2 De minister kan de subsidieontvanger verplichten om het financieel verslag vergezeld te doen gaan van een
      rapport van feitelijke bevindingen omtrent de naleving van de aan de subsidie verbonden verplichtingen door de
      subsidieontvanger.

      3 Een verschil tussen het financieel verslag en de begroting van ten minste 20% van een afzonderlijke
      begrotingspost wordt toegelicht, tenzij het verschil met die begrotingspost lager is dan € 25.000.

      4 Indien de activiteiten waarvoor de subsidie is verleend geheel zijn verricht en volledig is voldaan aan de
      verplichtingen die verbonden zijn aan de verleende subsidie, wordt de subsidie vastgesteld op het bedrag dat
      bestaat uit de gerealiseerde kosten verminderd met de gerealiseerde bijdragen van derden en de begrote eigen
      bijdrage of de gerealiseerde eigen bijdrage indien deze hoger is dan de begrote eigen bijdrage tot ten hoogste het
      in de verleningsbeschikking genoemde bedrag.

      5 De minister besluit binnen 22 weken op een aanvraag tot vaststelling.


      [ref1]: https://wetten.overheid.nl/BWBR0037603#Artikel1.5
    url: https://wetten.overheid.nl/BWBR0037603/2024-04-04#Artikel7.8
    references:
      - id: ref1
        bwb_id: BWBR0037603
        artikel: '1.5'
        hoofdstuk: '1'
  - number: '8.1'
    text: |-
      1 Een instellingssubsidie wordt per boekjaar verleend en per boekjaar vastgesteld.

      2 De subsidieontvanger stelt het boekjaar gelijk aan het kalenderjaar, tenzij bij de subsidieverlening anders is
      bepaald.
    url: https://wetten.overheid.nl/BWBR0037603/2024-04-04#Artikel8.1
  - number: '8.2'
    text: |-
      1 In afwijking van [artikel 3.2, tweede lid][ref1], wordt een aanvraag tot verlening van een instellingssubsidie
      ingediend uiterlijk 13 weken voor de aanvang van het boekjaar waarvoor de instellingssubsidie wordt aangevraagd.

      2 De minister kan vrijstelling of ontheffing verlenen voor de termijn, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0037603#Artikel3.2
    url: https://wetten.overheid.nl/BWBR0037603/2024-04-04#Artikel8.2
    references:
      - id: ref1
        bwb_id: BWBR0037603
        artikel: '3.2'
        hoofdstuk: '3'
  - number: '8.3'
    text: |-
      1 Indien de aanvraag tot verlening van de instellingssubsidie wordt ingediend door een privaatrechtelijke
      rechtspersoon waaraan de minister geen instellingssubsidie heeft verstrekt ten behoeve van het boekjaar voorafgaand
      aan het boekjaar waarvoor de instellingssubsidie wordt aangevraagd, gaat de aanvraag vergezeld van:

      a. een afschrift van de oprichtingsakte van de rechtspersoon dan wel van de statuten zoals deze laatstelijk zijn
      gewijzigd, en

      b. de laatst opgemaakte jaarrekening dan wel de balans en de staat van baten en lasten en de toelichting daarop.

      2 De in het eerste lid, onderdeel b, bedoelde bescheiden zijn voorzien van een controleverklaring van een
      accountant.

      3 De minister kan vrijstelling en ontheffing verlenen van het eerste of tweede lid.
    url: https://wetten.overheid.nl/BWBR0037603/2024-04-04#Artikel8.3
  - number: '8.4'
    text: |-
      1 In afwijking van [artikel 6.1][ref1] verleent de minister bij het besluit tot subsidieverlening ambtshalve de
      volgende voorschotten: in januari 8%, februari 8%, maart 8%, april 7%, mei 16%, juni 7%, juli 8%, augustus 8%,
      september 7%, oktober 8%, november 8% en december 7% van het bedrag van de verleende instellingssubsidie.

      2 De voorschotten worden betaald overeenkomstig de voorschotverlening, bedoeld in het eerste lid.

      3 Bij beschikking kan van het eerste en tweede lid worden afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0037603#Artikel6.1
    url: https://wetten.overheid.nl/BWBR0037603/2024-04-04#Artikel8.4
    references:
      - id: ref1
        bwb_id: BWBR0037603
        artikel: '6.1'
        hoofdstuk: '6'
  - number: '8.5'
    text: |-
      1 Indien een instellingssubsidie is verleend, verzekert de subsidieontvanger haar roerende en onroerende zaken op
      afdoende wijze tegen het risico van diefstal en brand alsmede tegen het risico van wettelijke aansprakelijkheid
      tegenover derden.

      2 Indien een instellingssubsidie is verleend, verzekert de subsidieontvanger de wettelijke aansprakelijkheid van
      vrijwilligers die werkzaamheden verrichten in het kader van de gesubsidieerde activiteiten.

      3 De minister kan vrijstelling of ontheffing verlenen van het eerste of tweede lid.
    url: https://wetten.overheid.nl/BWBR0037603/2024-04-04#Artikel8.5
  - number: '8.6'
    text: |-
      Indien de activiteiten waarvoor de subsidie is verleend geheel zijn verricht en volledig is voldaan
      aan de verplichtingen die verbonden zijn aan de verleende subsidie, wordt de subsidie in afwijking van
      [artikel 7.8, vierde lid][ref1], vastgesteld op het bedrag waarvan de hoogte bij de verlening is genoemd,
      verminderd met de eventuele overschrijding van de maximaal toegestane toevoeging aan de egalisatiereserve.


      [ref1]: https://wetten.overheid.nl/BWBR0037603#Artikel7.8
    url: https://wetten.overheid.nl/BWBR0037603/2024-04-04#Artikel8.6
    references:
      - id: ref1
        bwb_id: BWBR0037603
        artikel: '7.8'
        hoofdstuk: '7'
        paragraaf: '7.2'
  - number: '8.7'
    text: |-
      1 De ontvanger van een subsidie als bedoeld in [artikel 1.5, onderdeel d][ref1], voor zover het een
      instellingssubsidie betreft, vormt een egalisatiereserve.

      2 De egalisatiereserve bedraagt ten minste € 0 en ten hoogste 10% van het bij het besluit tot verlening bepaalde
      bedrag van de instellingssubsidie dan wel ten hoogste een lager percentage dat door de minister bij de beschikking
      tot verlening is bepaald.

      3 Indien de instellingssubsidie wordt verlaagd wegens het niet of niet geheel verrichten van de activiteiten
      waarvoor de instellingssubsidie is verleend, wordt de maximaal toegestane egalisatiereserve berekend op basis van
      de verlaagde instellingssubsidie.


      [ref1]: https://wetten.overheid.nl/BWBR0037603#Artikel1.5
    url: https://wetten.overheid.nl/BWBR0037603/2024-04-04#Artikel8.7
    references:
      - id: ref1
        bwb_id: BWBR0037603
        artikel: '1.5'
        hoofdstuk: '1'
  - number: '8.8'
    text: |-
      1 De egalisatiereserve wordt in een boekjaar uitsluitend besteed aan activiteiten waarvoor de instellingssubsidie
      in dat boekjaar is verleend en die niet kunnen worden bekostigd uit de instellingssubsidie die is verleend ten
      behoeve van dat boekjaar.

      2 De besteding van de egalisatiereserve wordt verantwoord met het activiteitenverslag en het financieel verslag.
    url: https://wetten.overheid.nl/BWBR0037603/2024-04-04#Artikel8.8
  - number: '8.9'
    text: |-
      1 De egalisatiereserve wordt gevormd door een toevoeging bij een positief exploitatieresultaat en een onttrekking
      bij een negatief exploitatieresultaat. Het exploitatieresultaat is de som van de gerealiseerde bijdragen van
      derden, de in het besluit tot verlening vermelde begrote eigen bijdrage of de gerealiseerde eigen bijdrage als deze
      hoger is dan de begrote eigen bijdrage en de verleende instellingssubsidie verminderd met de gerealiseerde kosten.

      2 De maximale toevoeging aan de egalisatiereserve is het bedrag dat aan de egalisatiereserve kan worden toegevoegd
      zonder de maximale omvang daarvan te overschrijden. De maximale onttrekking aan de egalisatiereserve is het bedrag
      van de egalisatiereserve.

      3 De toevoeging of onttrekking is gelijk aan het exploitatieresultaat vermenigvuldigd met de verleende
      instellingssubsidie gedeeld door de som van de in het besluit tot verlening vermelde begrote eigen bijdrage en de
      verleende instellingssubsidie.

      4 Voor zover het voor de toevoeging beschikbare bedrag hoger is dan de maximale toevoeging, wordt dat bedrag bij de
      vaststelling in mindering gebracht op de instellingssubsidie.

      5 Voor de toepassing van de vorige leden worden uitsluitend in aanmerking genomen de kosten, de bijdragen van
      derden en de instellingssubsidie met betrekking tot activiteiten waarvoor de instellingssubsidie is verleend en die
      werkelijk zijn verricht.
    url: https://wetten.overheid.nl/BWBR0037603/2024-04-04#Artikel8.9
  - number: '9.1'
    text: |-
      1 Op bekostigde onderwijsinstellingen waarop de [Regeling jaarverslaggeving onderwijs][ref1] onderscheidenlijk de
      [Regeling jaarverslaglegging onderwijs BES][ref2] van toepassing is, zijn de [hoofdstukken 7][ref3] en [8][ref4]
      niet van toepassing.

      2 De verantwoording van subsidie door bekostigde onderwijsinstellingen waarop de
      [Regeling jaarverslaggeving onderwijs][ref5] onderscheidenlijk de [Regeling jaarverslaglegging onderwijs BES][ref6]
      van toepassing is, geschiedt in de jaarverslaggeving overeenkomstig de voorschriften, bedoeld in de Regeling
      jaarverslaggeving onderwijs onderscheidenlijk de Regeling jaarverslaglegging onderwijs BES.

      3 Bij subsidie aan bekostigde onderwijsinstellingen wordt onderscheid gemaakt tussen:

      a. subsidie waarbij het eventueel niet aangewende deel van de subsidie, mits de activiteiten volledig zijn
      uitgevoerd, kan worden besteed aan andere activiteiten waarvoor bekostiging wordt verstrekt,

      b. subsidie die uitsluitend mag worden aangewend voor het doel waarvoor de subsidie is verstrekt en waarbij niet
      bestede middelen worden teruggevorderd, en

      c. subsidie die ook kan worden besteed aan andere activiteiten waarvoor bekostiging wordt verstrekt.

      4 In afwijking van [artikel 1.5][ref7] wordt subsidie aan bekostigde onderwijsinstellingen op de volgende wijze
      verstrekt:

      a. subsidie als bedoeld in het derde lid, onderdeel a, wordt direct vastgesteld,

      b. subsidie als bedoeld in het derde lid, onderdeel b, bedraagt € 125.000 of meer en wordt verleend en vastgesteld,
      en

      c. subsidie als bedoeld in het derde lid, onderdeel c, wordt direct vastgesteld.

      5 Subsidie aan bekostigde onderwijsinstellingen wordt op de volgende wijze verantwoord:

      a. subsidie als bedoeld in het derde lid, onderdeel a, wordt in ieder geval verantwoord in model G, onderdeel 1,
      zoals bedoeld in richtlijn 660 van de Raad voor de Jaarverslaggeving,

      b. subsidie als bedoeld in het derde lid, onderdeel b, wordt in ieder geval verantwoord in model G, onderdeel 2,
      zoals bedoeld in richtlijn 660 van de Raad voor de Jaarverslaggeving.


