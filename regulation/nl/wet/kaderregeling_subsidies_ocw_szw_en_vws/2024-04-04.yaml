articles:
  - number: '1.1'
    text: |-
      In deze regeling wordt verstaan onder:

        - *accountant:* accountant als bedoeld in [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1]
      onderscheidenlijk de deskundige, bedoeld in
      [artikel 121, zesde lid, van Boek 2 van het Burgerlijk Wetboek BES][ref2],
        - *activiteitenplan:* activiteitenplan als bedoeld in [artikel 3.4][ref3],
        - *activiteitenverslag:* verslag waarvan de inrichting voor zover van toepassing overeenkomt met de inrichting
      van het activiteitenplan en dat: a. een overzicht bevat van de gerealiseerde activiteiten waarvoor subsidie is
      verstrekt, b. de aard, omvang, duur en wijze van uitvoering beschrijft van de gerealiseerde activiteiten waarvoor
      subsidie is verstrekt, c. de met de activiteiten gerealiseerde doelstellingen, resultaten of producten beschrijft,
      d. voor zover van toepassing, beschrijft in hoeverre is voldaan aan de aan de subsidie verbonden verplichtingen, en
      e. voor zover van toepassing, een vergelijking bevat van de gerealiseerde activiteiten en doelstellingen en de in
      het activiteitenplan voorgenomen activiteiten en nagestreefde doelstellingen en een toelichting op de verschillen
      geeft,
        - *bijdragen van derden:* bijdragen die de subsidieontvanger van een ander dan de minister voor de te subsidiëren
      of gesubsidieerde activiteit ontvangt en die de subsidieontvanger aanwendt voor de te subsidiëren of gesubsidieerde
      activiteit,
        - *egalisatiereserve:* egalisatiereserve als bedoeld in [paragraaf 8.5][ref4],
        - *eigen bijdrage:* bijdrage van de subsidieontvanger zelf voor de te subsidiëren of gesubsidieerde activiteit,
        - *financieel verslag:* verslag dat: a. volgens normen die in het maatschappelijk verkeer als aanvaardbaar
      worden beschouwd, een zodanig inzicht geeft dat een verantwoord oordeel kan worden gevormd omtrent de kosten
      en opbrengsten per gerealiseerde activiteit waarvoor de subsidie is verleend en die werkelijk zijn verricht, b.
      aansluit bij de begroting en de nodige informatie geeft om de subsidie vast te stellen, c. per post is voorzien
      van een toelichting, en d. vergezeld gaat van een controleverklaring, opgesteld door een accountant overeenkomstig
      een door de minister vastgesteld model met inachtneming van een door de minister vastgesteld accountantsprotocol,
      bekend gemaakt op de website www.rijksoverheid.nl,
        - *instelling* :privaatrechtelijke rechtspersoon met volledige rechtsbevoegdheid of een rechtspersoon die krachtens
      publiekrecht is ingesteld,
        - *instellingssubsidie:* subsidie voor dezelfde of in hoofdzaak dezelfde voortdurende, structurele activiteiten van
      een instelling,
        - *jaarrekening:* jaarrekening als bedoeld in [artikel 361 van Boek 2 van het Burgerlijk Wetboek][ref5]
      onderscheidenlijk [artikel 120 van Boek 2 van het Burgerlijk Wetboek BES][ref6],
        - *kosten:* kosten van de subsidieontvanger voor zover die samenhangen met de te subsidiëren of gesubsidieerde
      activiteit,
        - *minister:* Minister van Onderwijs, Cultuur en Wetenschap onderscheidenlijk Minister van Sociale Zaken en
      Werkgelegenheid onderscheidenlijk Minister van Volksgezondheid, Welzijn en Sport, ieder voor zover het betreft het
      beleidsterrein waarvoor hij verantwoordelijk is, met dien verstande dat voor de toepassing van [hoofdstuk 9][ref7]
      onder minister wordt verstaan: Minister van Onderwijs, Cultuur en Wetenschap, en dat voor de toepassing van
      [hoofdstuk 10][ref8] onder minister wordt verstaan: Minister van Volksgezondheid, Welzijn en Sport,
        - *opbrengsten:* eigen bijdrage en bijdragen van derden, voor zover die samenhangen met de te subsidiëren of
      gesubsidieerde activiteiten alsmede de aangevraagde of verleende subsidie,
        - *projectsubsidie:* subsidie voor activiteiten aan een instelling of een natuurlijk persoon die anders dan als
      instellingssubsidie wordt verstrekt,
        - *subsidie:* instellingssubsidie of projectsubsidie,
        - *verklaring inzake werkelijke kosten en opbrengsten:* de verklaring waarin de subsidieontvanger aantoont: a. dat
      de activiteiten waarvoor de subsidie is verstrekt zijn verricht, voorzien van een korte toelichting, b. dat aan de
      aan de verleende subsidie verbonden verplichtingen is voldaan, c. wat het totale bedrag van de gerealiseerde kosten
      van de activiteiten waarvoor de subsidie is verleend en die werkelijk verricht zijn is, d. wat het totale bedrag
      van de gerealiseerde opbrengsten is, en e. wat het totale bedrag van de gerealiseerde eigen bijdrage is.


