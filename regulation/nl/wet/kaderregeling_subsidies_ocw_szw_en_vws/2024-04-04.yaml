  - number: '11.4'
    text: |-
      1 De minister kan een of meer bepalingen van deze regeling buiten toepassing laten of daarvan afwijken voor
      zover toepassing gelet op het belang dat de desbetreffende bepaling beoogt te beschermen, zal leiden tot een
      onbillijkheid van overwegende aard.

      2 De minister kan ambtshalve of op aanvraag een subsidie verstrekken uit hoofde van
      [artikel 4:51 van de Algemene wet bestuursrecht][ref1] en daarbij een of meer bepalingen van deze regeling buiten
      toepassing laten of daarvan afwijken.


