        paragraaf: '1'
  - number: '42'
    text: |-
      1 De eigenaar van een drinkwaterbedrijf verstrekt de in [artikel 40, eerste lid, onderdeel d][ref1], bedoelde
      gegevens binnen de daarvoor gestelde termijn aan de met de uitvoering van de prestatievergelijking belaste
      instantie.

      2 Indien niet of niet tijdig aan de in het eerste lid bedoelde verplichting wordt voldaan, of indien onvoldoende,
      onjuiste of onvolledige gegevens worden aangeleverd, meldt die instantie dat onverwijld aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0026338#Artikel40
    url: https://wetten.overheid.nl/BWBR0026338/2024-01-01#Artikel42
