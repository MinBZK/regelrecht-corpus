  - number: '5'
    text: |-
      1 Onze Minister stelt voor elk drinkwaterbedrijf een distributiegebied vast, waarbinnen de eigenaar van het
      betreffende drinkwaterbedrijf de exclusieve bevoegdheid en plicht, overeenkomstig [artikel 8][ref1], tot het
      leveren van drinkwater heeft.

      2 Het is de eigenaar van een drinkwaterbedrijf verboden om door middel van een watervoorzieningswerk water, niet
      zijnde drinkwater, te leveren buiten het voor dat drinkwaterbedrijf vastgestelde distributiegebied.

      3 Het verbod, bedoeld in het tweede lid, geldt niet voor de levering van water aan een ander drinkwaterbedrijf en
      voor de levering van nooddrinkwater aan consumenten of andere afnemers.

      4 Bij het besluit, bedoeld in het eerste lid, kan Onze Minister distributiegebieden wijzigen ter vergroting van de
      doelmatigheid van de openbare drinkwatervoorziening.

      5 Alvorens tot een wijziging als bedoeld in het vierde lid over te gaan, legt Onze Minister zijn voornemen aan
      de betrokken eigenaars voor, onder opgave van redenen. Binnen zes weken kunnen belanghebbenden hun zienswijze
      schriftelijk of mondeling bij Onze Minister kenbaar maken.

      6 De eigenaren van drinkwaterbedrijven die het aangaat kunnen gezamenlijk, onverminderd de
      [artikelen 14 tot en met 16][ref2], Onze Minister verzoeken om wijziging van het voor hun bedrijf vastgestelde
      distributiegebied.

      7 Onze Minister kan besluiten geen gevolg te geven aan een verzoek als bedoeld in het zesde lid, indien de
      gevraagde wijziging naar zijn oordeel in strijd is met het belang van de openbare drinkwatervoorziening. Binnen zes
      weken kunnen belanghebbenden hun zienswijze schriftelijk of mondeling bij Onze Minister kenbaar maken.

      8 In geval van een wijziging van het voor hun drinkwaterbedrijf vastgestelde distributiegebied als bedoeld in het
      vierde lid, is de eigenaar van het betrokken drinkwaterbedrijf gehouden binnen een bij die wijziging aangegeven
      periode medewerking te geven aan de uitvoering van die wijziging, met inbegrip van een eventuele overdracht van
      de eigendom of het beheer van de betreffende watervoorzieningswerken, voor zover deze ten gevolge van de wijziging
      komen te liggen in een voor een ander drinkwaterbedrijf vastgesteld distributiegebied.


      [ref1]: https://wetten.overheid.nl/BWBR0026338#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0026338#Artikel14
