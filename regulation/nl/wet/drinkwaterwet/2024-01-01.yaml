    text: |-
      1 In het belang van de openbare drinkwatervoorziening worden bij of krachtens algemene maatregel van bestuur nadere
      regels gesteld met betrekking tot:

      a. de kosten die ten grondslag liggen aan het tarief, bedoeld in [artikel 11][ref1];

      b. de elementen en wijze van berekening van de tarieven, bedoeld in [artikel 12][ref2].

      2 Indien niet wordt voldaan aan [artikel 11][ref3] of [12][ref4] of nadere regels als bedoeld in het eerste lid kan
      Onze Minister een aanwijzing geven aan de eigenaar van een drinkwaterbedrijf. Bij de aanwijzing wordt aangegeven
      op welke gronden niet wordt voldaan aan [artikel 11][ref5] of [12][ref6] of de bedoelde regels en welke wijzigingen
      met het oog daarop in het tarief vereist zijn. Bij de aanwijzing wordt een termijn gesteld waarbinnen aan de
      aanwijzing voldaan moet worden.


