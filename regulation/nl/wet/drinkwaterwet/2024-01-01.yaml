  - number: '21'
    text: |-
      1 De eigenaar van een drinkwaterbedrijf draagt er zorg voor dat het drinkwater dat hij aan consumenten of andere
      afnemers ter beschikking stelt, geen organismen, parasieten of stoffen bevat, in aantallen per volume-eenheid of
      concentraties, die nadelige gevolgen voor de volksgezondheid kunnen hebben.

      2 De eigenaar van een drinkwaterbedrijf draagt er tevens zorg voor dat het ontwerp en de staat van de van
      dat drinkwaterbedrijf deel uitmakende watervoorzieningswerken, toestellen en leidingnetten geen gevaar kunnen
      opleveren voor verontreiniging van de daarop aangesloten collectieve watervoorzieningen, collectieve leidingnetten,
      woninginstallaties en andere installaties en van het aan de betreffende eigenaars of consumenten ter beschikking
      gestelde drinkwater.

      3 Bij of krachtens algemene maatregel van bestuur worden, onverminderd het eerste lid, in het belang van de
      volksgezondheid eisen gesteld met betrekking tot:

      a. de hoedanigheid van het drinkwater na de bereiding en op het punt waar het ter beschikking komt voor gebruik,
      alsmede het nemen en analyseren van monsters en het verrichten van onderzoek teneinde die hoedanigheid vast te
      stellen. De eisen met betrekking tot de hoedanigheid van het drinkwater hebben in elk geval betrekking op:

      1°. microbiologische en chemische parameters;

      2°. indicatorparameters waaronder signaleringsparameters voor het signaleren van mogelijke verontreiniging van
      het drinkwater;

      b. het toezicht, door of vanwege de eigenaar van een drinkwaterbedrijf te houden op de toestand en de werking van
      het bedrijf, alsmede op de hoedanigheid van het in dat bedrijf bereide drinkwater;

      c. de door de eigenaar van een drinkwaterbedrijf bij de winning, de bereiding, de opslag en de distributie van
      drinkwater te gebruiken materialen en chemicaliën en de wijze waarop deze daarbij worden toegepast, met dien
      verstande dat de eisen met betrekking tot bij de distributie te gebruiken materialen slechts betrekking hebben op
      materialen die geen deel uitmaken van een gebouw als bedoeld in [artikel 1, eerste lid, van de Woningwet][ref1];

      d. het onderzoek dat de eigenaar van een drinkwaterbedrijf verricht naar oorzaak en mogelijke nadelige gevolgen
      voor de volksgezondheid en de door hem te nemen herstelmaatregelen in geval niet wordt voldaan aan de eisen met
      betrekking tot de hoedanigheid van het drinkwater, bedoeld in onderdeel a, waarbij:

      1°. in geval van het niet voldoen aan een microbiologische of chemische parameter steeds herstelmaatregelen zijn
      vereist, gericht op het voldoen aan de eisen;

      2°. in geval van het niet voldoen aan een indicatorparameter, herstelmaatregelen zijn vereist, gericht op het
      voldoen aan de eisen, tenzij er naar het oordeel van de toezichthouder geen gevaar is voor de volksgezondheid;

      e. de informatie die de eigenaar van een drinkwaterbedrijf verstrekt:

      1°. aan consumenten en andere afnemers: over de kwaliteit van het geleverde drinkwater;

      2°. aan consumenten en andere afnemers: indien de levering van drinkwater gevaar kan opleveren voor de
      volksgezondheid;

      3°. aan de eigenaars van percelen waaraan de eigenaar drinkwater levert, en aan de betreffende consumenten en
      andere afnemers: over door hen te nemen voorzorgs- of herstelmaatregelen, indien door een omstandigheid, te wijten
      aan een collectief leidingnet of een woninginstallatie, het drinkwater niet voldoet aan de eisen, bedoeld in de
      aanhef en onder a, of indien de deugdelijkheid van het drinkwater anderszins wordt aangetast;

      4°. aan de toezichthouder: over de kwaliteit van het geleverde drinkwater en de maatregelen die zijn of worden
      genomen om deze kwaliteit te waarborgen;

      f. de kwaliteit van het water waaruit warm tapwater wordt bereid.

      4 Bij of krachtens algemene maatregel van bestuur kunnen voorts in het belang van de volksgezondheid eisen worden
      gesteld met betrekking tot:

      a. de inrichting van de bedrijfsonderdelen van drinkwaterbedrijven;

      b. het verrichten van werkzaamheden in drinkwaterbedrijven;

      c. de vakbekwaamheid van het personeel van drinkwaterbedrijven;

      d. de voorlichting in hygiënisch opzicht van het personeel van drinkwaterbedrijven.

      5 Onze Minister of, in geval van kortdurende overschrijdingen zonder nadelige gevolgen, de toezichthouder, kan,
      indien het belang van de volksgezondheid zich daar niet tegen verzet, gedurende een daarbij vast te stellen
      periode ontheffing verlenen van eisen voor chemische parameters als bedoeld in het derde lid, aanhef en onderdeel
      a, onderdeel 1°. Hij kan aan een ontheffing voorschriften en beperkingen verbinden, deze wijzigen of intrekken
      en een ontheffing intrekken. Bij of krachtens de algemene maatregel van bestuur, bedoeld in het derde lid, worden
      hieromtrent nadere regels gesteld. Van een besluit inzake een ontheffing doet Onze Minister mededeling in de
      Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel1
