  - number: '66'
    text: |-
      Het [Besluit bescherming waterleidingbedrijven 1989][ref1] wordt ingetrokken op het tijdstip waarop deze wet in
      werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0004603
    url: https://wetten.overheid.nl/BWBR0026338/2024-01-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0004603
  - number: '67'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0026338/2024-01-01#Artikel67
  - number: '68'
    text: 'Deze wet wordt aangehaald als: Drinkwaterwet.'
    url: https://wetten.overheid.nl/BWBR0026338/2024-01-01#Artikel68
