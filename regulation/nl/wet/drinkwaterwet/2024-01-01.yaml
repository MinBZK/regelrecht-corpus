  - number: '49'
    text: |-
      De eigenaar van een drinkwaterbedrijf, respectievelijk collectieve watervoorziening of collectief leidingnet, geeft
      onmiddellijk kennis aan de inspecteur, respectievelijk de voor die watervoorziening of dat leidingnet krachtens
      [artikel 48][ref1] aangewezen andere toezichthouder, van omstandigheden in verband met zijn drinkwaterbedrijf,
      respectievelijk collectieve watervoorziening of collectief leidingnet die, naar hij redelijkerwijze kan weten of
      vermoeden, gevaar of beletsel voor de naleving van [artikel 21][ref2], [22][ref3] of [23][ref4], respectievelijk
      [25][ref5] of [26][ref6] dan wel [27][ref7], [28][ref8], [29][ref9] of [30][ref10] of van de daarop berustende
      bepalingen kunnen vormen.


