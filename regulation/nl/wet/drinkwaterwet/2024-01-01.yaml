        paragraaf: '2'
  - number: '4'
    text: |-
      1 Het is aan andere personen dan de eigenaar van een drinkwaterbedrijf verboden om:

      a. drinkwater te produceren voor consumenten of andere afnemers,

      b. drinkwater te distribueren aan consumenten of andere afnemers.

      2 De verboden, bedoeld in het eerste lid, gelden niet voor de eigenaar van een collectieve
      watervoorziening of een collectief leidingnet die in het kader van de verrichting van een
      milieubelastende activiteit waarvoor bij algemene maatregel van bestuur regels zijn gesteld krachtens
      [artikel 4.3, eerste lid, aanhef en onder b, van de Omgevingswet][ref1] of die bij algemene maatregel van bestuur
      is aangewezen krachtens [artikel 5.1, tweede lid, aanhef en onder b, van die wet][ref2], drinkwater produceert
      voor, of distribueert aan:

      a. consumenten of andere afnemers in het gebouw of op het terrein waar de productie of distributie plaatsvindt,

      b. consumenten of andere afnemers buiten het gebouw of het terrein waar de productie of distributie plaatsvindt,
      voor zover dat gebouw of terrein:

      1°. voorheen deel uitmaakte van het in onderdeel a bedoelde gebouw of terrein, of

      2°. voor 25 februari 2005 was aangesloten op de collectieve watervoorziening van de eigenaar, bedoeld in de aanhef.

      3 De verboden, bedoeld in het eerste lid, gelden voorts niet voor de eigenaar van een voorziening voor de productie
      of distributie van water op een binnen het Nederlandse territoir of het Nederlandse deel van het continentale
      plat gelegen mijnbouwinstallatie als bedoeld in [artikel 1, onderdeel o, van de Mijnbouwwet][ref3], welk water als
      drinkwater aan consumenten binnen die mijnbouwinstallatie ter beschikking wordt gesteld.

      4 Het verbod, bedoeld in het eerste lid, aanhef en onderdeel b, geldt voorts niet voor de eigenaar van een
      collectief leidingnet,

      a. voor zover dat leidingnet deel uitmaakt van:

      1°. een gebouw als bedoeld in [artikel 1, eerste lid, van de Woningwet][ref4];

      2°. een terrein of plaats, geheel of gedeeltelijk ingericht, en blijkens die inrichting bestemd, om daarop
      ten behoeve van recreatief nachtverblijf gelegenheid te geven tot het plaatsen of geplaatst houden van tenten,
      tentwagens, kampeerauto’s of voertuigen of gewezen voertuigen of gedeelten daarvan, voor zover geen bouwwerk
      zijnde, waarvoor een omgevingsvergunning voor een bouwactiviteit als bedoeld in de [Omgevingswet][ref5] is vereist;
      een en ander voor zover deze onderkomens of voertuigen geheel of ten dele blijvend zijn bestemd of opgericht dan
      wel worden of kunnen worden gebruikt voor recreatief nachtverblijf;

      3°. een bungalowpark;

      4°. een volkstuincomplex;

      5°. een bedrijfsterrein;

      b. voor zover op dat leidingnet, al dan niet tijdelijk, een of meer tappunten zijn aangesloten in openbare of voor
      het publiek of andere personen toegankelijke terreinen of ruimten.

      5 Op een daartoe strekkende aanvraag kan Onze Minister aan de eigenaar van een collectieve
      watervoorziening of een collectief leidingnet ontheffing verlenen van een verbod als bedoeld in het
      eerste lid, voor het zover het betreft het produceren voor, of het distribueren aan, consumenten
      of andere afnemers in een of meer gebouwen of op een of meer terreinen waar milieubelastende
      activiteiten worden verricht waarvoor bij algemene maatregel van bestuur regels zijn gesteld krachtens
      [artikel 4.3, eerste lid, aanhef en onder b, van de Omgevingswet][ref6] of die bij algemene maatregel van bestuur
      zijn aangewezen krachtens [artikel 5.1, tweede lid, aanhef en onder b, van die wet][ref7], indien:

      a. de aansluiting van dat gebouw of die gebouwen of van dat terrein of die terreinen op het leidingnet van een
      drinkwaterbedrijf naar het oordeel van Onze Minister in strijd is, of zou komen, met het belang van een doelmatige
      openbare drinkwatervoorziening, en

      b. het belang van de volksgezondheid zich daartegen niet verzet.

      6 Onze Minister kan aan een ontheffing, bedoeld in het vijfde lid, voorschriften en beperkingen verbinden en deze
      wijzigen of intrekken.

      7 Onze Minister kan een ontheffing intrekken, indien:

      a. bij de aanvraag onjuiste of onvolledige gegevens zijn verstrekt en de verstrekking van juiste en volledige
      gegevens tot een andere beschikking op de aanvraag zou hebben geleid;

      b. de aan de ontheffing verbonden voorschriften of beperkingen niet worden nageleefd;

      c. geen grond voor verlening van de ontheffing meer aanwezig is.

      8 [Afdeling 3.4 van de Algemene wet bestuursrecht][ref8] is van toepassing op de totstandkoming van de beschikking
      op aanvraag, bedoeld in het vijfde lid, en de beschikking inzake het intrekken van de ontheffing, bedoeld in het
      zevende lid.


