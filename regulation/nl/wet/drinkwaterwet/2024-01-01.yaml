preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het in het belang van een duurzame veiligstelling van de openbare
    drinkwatervoorziening en in het belang van de volksgezondheid wenselijk is de bepalingen van de Waterleidingwet
    inzake de productie en distributie van drinkwater en de organisatie van de openbare drinkwatervoorziening aan te
    vullen, te verbeteren en te moderniseren en deze in een nieuwe wet onder te brengen, met inachtneming van richtlijn
    nr. 98/83/EG van de Raad van de Europese Unie van 3 november 1998 betreffende de kwaliteit van voor menselijke
    consumptie bestemd water (PbEG L 330), en enige andere wetten in verband daarmee te wijzigen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0026338/2024-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt verstaan onder:

        - *bereiding:* iedere behandeling van grondwater, oppervlaktewater, zeewater of een andere grondstof met het oog op
      de productie van drinkwater, tot aan het punt waar het drinkwater voor consumptie beschikbaar komt;
        - *collectief leidingnet:* samenstel van leidingen, fittingen en toestellen dat tijdelijk, doch niet ten behoeve
      van bevoorrading, dan wel permanent, is aangesloten op het distributienet van een drinkwaterbedrijf of collectieve
      watervoorziening, en door middel waarvan drinkwater of warm tapwater ter beschikking wordt gesteld aan consumenten
      of andere afnemers;
        - *collectieve watervoorziening:* a. landgebonden voorziening, niet zijnde een drinkwaterbedrijf, voor de
      productie of distributie van water dat met behulp van een leiding of distributienet aan consumenten of andere
      afnemers als drinkwater of warm tapwater ter beschikking wordt gesteld; b. voorziening voor de productie
      of distributie van water op een binnen het Nederlandse territoir gelegen mijnbouwinstallatie als bedoeld in
      [artikel 1, onderdeel o, van de Mijnbouwwet][ref1], welk water als drinkwater of warm tapwater aan consumenten
      binnen die mijnbouwinstallatie ter beschikking wordt gesteld;
        - *distributie:* transport en levering;
        - *distributiegebied:* gebied waarbinnen de eigenaar van een drinkwaterbedrijf bevoegd en verplicht is tot levering
      van drinkwater aan consumenten of andere afnemers;
        - *distributienet:* samenstel van leidingen en daarmee verbonden koppelingen, kleppen en andere technische
      voorzieningen voor het transport en de levering van drinkwater, niet zijnde een collectief leidingnet;
        - *drinkwater:* water bestemd of mede bestemd om te drinken, te koken of voedsel te bereiden dan wel voor andere
      huishoudelijke doeleinden, met uitzondering van warm tapwater, dat door middel van leidingen ter beschikking wordt
      gesteld aan consumenten of andere afnemers;
        - *drinkwaterbedrijf:* a. bedrijf uitsluitend of mede bestemd tot openbare drinkwatervoorziening door levering
      van drinkwater aan consumenten of andere afnemers, of b. bedrijf uitsluitend of mede bestemd tot levering van
      drinkwater aan een bedrijf of bedrijven als bedoeld onder a;
        - *Drinkwaterrichtlijn:* [Richtlijn (EU) 2020/2184](32020L2184) van het Europees Parlement en de Raad van
      16 december 2020, betreffende de kwaliteit van voor menselijke consumptie bestemd water (herschikking);
        - *eigenaar:* juridische eigenaar;
        - *gewogen gemiddelde vermogenskostenvoet:* gewogen gemiddelde van de kostenvoet van vreemd vermogen en eigen
      vermogen, waarbij het aandeel van deze vermogenstypen in het totale vermogen als wegingsfactor wordt gehanteerd;
        - *gekwalificeerde rechtspersoon:* a. publiekrechtelijke rechtspersoon, zijnde de Staat, een provincie, gemeente,
      waterschap of gemeenschappelijke regeling in de zin van de Wet gemeenschappelijke regelingen; b. naamloze of
      besloten vennootschap die voldoet aan de volgende voorwaarden: 1°. in de statuten is bepaald dat de aandelen
      in zijn kapitaal uitsluitend middellijk of onmiddellijk worden gehouden door publiekrechtelijke rechtspersonen,
      en 2°. de vennootschap heeft zich niet verbonden de zeggenschap over het drinkwaterbedrijf dat haar toebehoort
      of zal toebehoren, geheel of gedeeltelijk uit te oefenen of te doen uitoefenen tezamen met anderen dan een
      publiekrechtelijke rechtspersoon of een vennootschap als bedoeld in dit onderdeel; c. coöperatie waarvan de
      leden voldoen aan de voorwaarden, bedoeld in onderdeel b; d. stichting ten aanzien waarvan bij besluit van Onze
      Minister is vastgesteld dat in haar statuten en in de tussen de stichting en de publiekrechtelijke rechtspersoon of
      rechtspersonen, die haar hebben opgericht, van kracht zijnde overeenkomsten zodanige bepalingen zijn opgenomen dat
      gewaarborgd wordt dat de volledige zeggenschap over het betreffende drinkwaterbedrijf wordt uitgeoefend door een of
      meer publiekrechtelijke rechtspersonen;
        - *indicatorparameters:* indicatorparameters als bedoeld in artikel 5, eerste lid, juncto tweede lid, tweede
      volzin, en bijlage I, deel C, van de Drinkwaterrichtlijn;
        - *inspecteur:* inspecteur als bedoeld in [artikel 48, eerste lid][ref2];
        - *installatie:* samenstel van leidingen, fittingen en toestellen dat middellijk of onmiddellijk is aangesloten op
      het distributienet van een drinkwaterbedrijf;
        - *kleine collectieve watervoorziening:* collectieve watervoorziening die per dag gemiddeld tussen 10 kubieke meter
      en 100 kubieke meter drinkwater levert of die tussen 50 en 500 personen per dag bedient;
        - *kleinverbruiker:* consument of andere afnemer met een aansluiting waarbij de volumestroom van de levering van
      water niet meer bedraagt dan vijf kubieke meter per uur;
        - *microbiologische of chemische parameters:* microbiologische of chemische parameters als bedoeld in artikel 5,
      eerste lid juncto tweede lid, eerste volzin, en bijlage I, deel A, B en D, van de Drinkwaterrichtlijn;
        - *nooddrinkwater:* water bestemd of mede bestemd om te drinken, te koken of voedsel te bereiden, dan wel voor
      andere huishoudelijke doeleinden, dat bij een verstoring anders dan door middel van een distributienet wordt
      geleverd aan consumenten of andere afnemers;
        - *noodwater:* water, uitsluitend bestemd voor sanitaire doeleinden, dat bij een verstoring door middel van een
      distributienet wordt geleverd aan consumenten of andere afnemers;
        - *Onze Minister:* Onze Minister van Infrastructuur en Milieu;
        - *openbare drinkwatervoorziening:* productie en distributie van drinkwater door drinkwaterbedrijven;
        - *opslag:* opslag van water in reservoirs of bekkens in verband met de productie of distributie van drinkwater;
        - *prestatievergelijking:* periodieke, systematische vergelijking van de prestaties van drinkwaterbedrijven;
        - *productie:* winning, bereiding en daarmee verband houdende opslag van drinkwater;
        - *toezichthouder:* inspecteur of andere krachtens [artikel 48][ref3] aangewezen toezichthouder;
        - *verstoring:* uitval of aantasting van watervoorzieningswerken, waardoor de continuïteit van de levering van
      deugdelijk drinkwater wordt verbroken of in gevaar komt;
        - *warm tapwater:* water bestemd of mede bestemd om te drinken, te koken of voedsel te bereiden dan wel voor andere
      huishoudelijke doeleinden, dat wordt verwarmd voordat het voor die toepassingen ter beschikking wordt gesteld;
        - *watervoorzieningswerken:* werken ten behoeve van de productie en distributie van drinkwater en daarmee
      rechtstreeks verband houdende werken en beschermingsvoorzieningen ten dienste van drinkwaterbedrijven;
        - *winning:* onttrekking van grondwater, oppervlaktewater of zeewater ten behoeve van de bereiding van drinkwater;
        - *woninginstallatie:* van een woning deel uitmakend samenstel van leidingen, fittingen en toestellen, aangesloten
      op het leidingnet van een drinkwaterbedrijf of een collectieve watervoorziening dan wel op een collectief
      leidingnet;
        - *zeer kleine collectieve watervoorziening:* collectieve watervoorziening die gemiddeld minder dan 10 kubieke
      meter per dag drinkwater levert of minder dan 50 personen per dag bedient.

      2 Bij algemene maatregel van bestuur kan worden bepaald dat een of meer daarbij aan te geven artikelen van deze wet
      niet van toepassing zijn op water dat uitsluitend bestemd is voor bij die maatregel aangegeven doeleinden, waarbij
      de kwaliteit van het water niet van invloed is op de gezondheid van de betrokken consumenten. Bij of krachtens die
      maatregel kunnen nadere eisen worden gesteld aan de productie, distributie en het gebruik van dit water.

      3 Voor de uitvoering en naleving van deze wet en de daarop berustende bepalingen wordt met de eigenaar van een
      drinkwaterbedrijf, collectieve watervoorziening of collectief leidingnet, indien deze niet zelf dat bedrijf,
      die voorziening of dat leidingnet exploiteert, gelijkgesteld de exploitant daarvan, voor zover het betreft de
      uitvoering van maatregelen of de naleving van verplichtingen die, naar gebruikelijk is, behoren tot de bevoegdheid
      van een exploitant.

      4 Onze Minister kan een of meer bedrijven aanwijzen die voor de toepassing van [hoofdstuk II][ref4], met
      uitzondering van de [artikelen 5, tweede lid][ref5], en [8][ref6], met een drinkwaterbedrijf worden gelijkgesteld.

      5 De artikelen van deze wet en de daarop berustende bepalingen, voor zover betrekking hebbend op collectieve
      watervoorzieningen, zijn mede van toepassing op voorzieningen voor de winning, behandeling of distributie van
      water op een binnen het Nederlandse deel van het continentale plat gelegen mijnbouwinstallatie als bedoeld
      in [artikel 1, onderdeel o, van de Mijnbouwwet][ref7], welk water als drinkwater aan consumenten binnen die
      mijnbouwinstallatie ter beschikking wordt gesteld.

      6 In geval van levering van warm tapwater aan consumenten of andere afnemers zijn de artikelen van de
      [hoofdstukken III][ref8], [VI][ref9], [VII][ref10] en [VIII][ref11] en de daarop berustende bepalingen van
      overeenkomstige toepassing.

      7 De voordracht voor een krachtens deze wet vast te stellen algemene maatregel van bestuur wordt niet eerder gedaan
      dan vier weken nadat het ontwerp aan beide Kamers der Staten-Generaal is overgelegd.


