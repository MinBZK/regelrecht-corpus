  - number: '50'
    text: |-
      1 Onze Minister is bevoegd tot toepassing van bestuursdwang ter handhaving van deze wet en de daarop berustende
      bepalingen.

      2 In afwijking van het eerste lid is Onze Minister van Economische Zaken bevoegd tot toepassing van
      bestuursdwang ter handhaving van deze wet en de daarop berustende bepalingen voor zover het betreft
      voorzieningen voor de winning, behandeling of distributie van water op een binnen het Nederlandse
      territoir of het Nederlandse deel van het continentale plat gelegen mijnbouwinstallatie als bedoeld in
      [artikel 1, onderdeel o, van de Mijnbouwwet][ref1], welk water als drinkwater aan consumenten binnen die
      mijnbouwinstallatie ter beschikking wordt gesteld.

      3 In afwijking van het eerste lid is, ingeval van overtreding van
      [artikel 7, derde lid, eerste of tweede volzin][ref2], [artikel 70a van de Mededingingswet][ref3] van
      overeenkomstige toepassing en is [artikel 82 van die wet][ref4] van toepassing.


