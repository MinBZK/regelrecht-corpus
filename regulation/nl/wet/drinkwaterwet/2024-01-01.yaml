  - number: '24'
    text: |-
      1 De eigenaar van een drinkwaterbedrijf controleert de middellijk of onmiddellijk op het leidingnet van zijn
      bedrijf aangesloten woninginstallaties, collectieve watervoorzieningen, collectieve leidingnetten en overige
      installaties op gevaar voor verontreiniging van het leidingnet van zijn bedrijf.

      2 De eigenaar van een drinkwaterbedrijf controleert tevens de middellijk of onmiddellijk op het leidingnet van zijn
      bedrijf aangesloten collectieve watervoorzieningen en collectieve leidingnetten op gevaar voor verontreiniging van
      het door middel van deze voorzieningen en leidingnetten aan consumenten of andere afnemers ter beschikking gestelde
      drinkwater.

      3 Indien bij een controle als bedoeld in het tweede lid blijkt dat niet wordt voldaan aan
      [artikel 21, eerste of derde lid][ref1], de daarop berustende bepalingen of een ministeriële regeling van die
      strekking als bedoeld in [artikel 23][ref2], dan wel dat gevaar bestaat dat daar niet aan voldaan wordt, informeert
      de eigenaar van het drinkwaterbedrijf terstond de toezichthouder en de desbetreffende eigenaar van een op zijn
      leidingnet aangesloten collectieve watervoorziening of collectief leidingnet.

      4 De eigenaar van een middellijk of onmiddellijk op het leidingnet van een drinkwaterbedrijf aangesloten
      collectieve watervoorziening, collectief leidingnet, woninginstallatie of andere installatie, dan wel de huurder
      van het betreffende gebouw of de betreffende woning, is verplicht medewerking te verlenen aan de in het eerste en
      tweede lid bedoelde controles.


      [ref1]: https://wetten.overheid.nl/BWBR0026338#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0026338#Artikel23
