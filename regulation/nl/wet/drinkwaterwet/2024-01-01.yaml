  - number: '22'
    text: |-
      1 De eigenaar van een drinkwaterbedrijf verricht overeenkomstig bij of krachtens algemene maatregel van bestuur
      te stellen regels onderzoek naar de hoedanigheid van het water dat door hem gebruikt wordt voor de bereiding van
      drinkwater.

      2 Bij of krachtens algemene maatregel van bestuur worden eisen gesteld met betrekking tot de hoedanigheid van het
      oppervlaktewater dat wordt gebruikt voor de bereiding van drinkwater. Deze eisen omvatten in elk geval eisen voor:

      1°. microbiologische en chemische parameters;

      2°. signaleringsparameters voor het signaleren van mogelijke verontreiniging van het oppervlaktewater.

      3 Het is verboden drinkwater te bereiden uit oppervlaktewater, dat niet voldoet aan de bij of krachtens algemene
      maatregel van bestuur gestelde eisen voor microbiologische of chemische parameters, bedoeld in het tweede lid,
      aanhef en onderdeel 1. Bij of krachtens die maatregel kan worden bepaald dat het verbod niet geldt indien het
      water tevoren op een daarbij vastgestelde wijze is behandeld, waarbij voor water van verschillende hoedanigheid
      verschillende wijzen van behandeling kunnen worden vastgesteld.

      4 In bij of krachtens de algemene maatregel van bestuur, bedoeld in het tweede lid, aan te wijzen categorieën
      van gevallen kan Onze Minister, indien het belang van de bescherming van de volksgezondheid zich daar niet tegen
      verzet, gedurende een daarbij aan te geven periode ontheffing verlenen van het verbod, bedoeld in dat lid, eerste
      volzin, dan wel van de bij of krachtens die maatregel gestelde eisen voor microbiologische of chemische parameters
      of van de daarbij vastgestelde wijze of wijzen van behandeling.

      5 Onze Minister kan aan een ontheffing voorschriften en beperkingen verbinden, deze wijzigen of intrekken
      en een ontheffing intrekken. Bij of krachtens de algemene maatregel van bestuur, bedoeld in het tweede lid,
      worden hieromtrent nadere regels gesteld. Van een besluit inzake een ontheffing wordt mededeling gedaan in de
      Staatscourant.

      6 Voor de toepassing van het eerste tot en met vijfde lid wordt:

      a. met een drinkwaterbedrijf gelijkgesteld een bedrijf dat water uit oppervlaktewater inneemt teneinde dit aan een
      drinkwaterbedrijf te leveren, en

      b. met de bereiding van drinkwater gelijkgesteld het leveren van water aan een drinkwaterbedrijf ten behoeve van de
      bereiding van drinkwater door dat bedrijf.

      7 Voor de toepassing van het tweede tot en met zesde lid wordt onder oppervlaktewater niet verstaan zout en
      brak water alsmede water dat, alvorens voor de bereiding van drinkwater te worden gebruikt, in de bodem wordt
      geïnfiltreerd.

      8 Bij of krachtens algemene maatregel van bestuur kan worden bepaald dat het verboden is drinkwater te bereiden
      uit water, niet zijnde oppervlaktewater, dat niet aan de bij of krachtens die maatregel gestelde eisen voldoet.
      Daarbij kan worden bepaald dat het verbod niet geldt indien het water tevoren op een bij of krachtens de maatregel
      vastgestelde wijze is behandeld, waarbij voor water van verschillende hoedanigheid verschillende wijzen van
      behandeling kunnen worden vastgesteld. Het vierde tot en met zesde lid, onderdeel b, zijn van overeenkomstige
      toepassing.
    url: https://wetten.overheid.nl/BWBR0026338/2024-01-01#Artikel22
  - number: '23'
    text: |-
      Onze Minister kan, indien naar zijn oordeel ter voorkoming of beperking van ernstig gevaar voor de volksgezondheid
      een onverwijlde voorziening noodzakelijk is, na overleg met Onze Minister van Volksgezondheid, Welzijn en Sport,
      een regeling vaststellen van de in [artikel 21, derde of vierde lid][ref1], [27][ref2], [28][ref3] of [29][ref4]
      bedoelde strekking. Een zodanige regeling vervalt een jaar nadat deze in werking is getreden, of, indien binnen die
      periode een algemene maatregel van bestuur ter vervanging van die regeling in werking is getreden, op het tijdstip
      waarop die maatregel in werking treedt. Bij ministeriële regeling kan de geldigheidsduur van de regeling eenmaal
      met ten hoogste een jaar worden verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0026338#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0026338#Artikel27
      [ref3]: https://wetten.overheid.nl/BWBR0026338#Artikel28
      [ref4]: https://wetten.overheid.nl/BWBR0026338#Artikel29
