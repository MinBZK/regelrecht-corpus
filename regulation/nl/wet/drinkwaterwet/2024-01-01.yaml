  - number: '25'
    text: |-
      1 In geval van levering door een collectieve watervoorziening van drinkwater aan consumenten of andere afnemers,
      zijn de [artikelen 21, eerste lid en derde tot en met vijfde lid][ref1], [22][ref2] en [23][ref3] en de daarop
      berustende bepalingen van overeenkomstige toepassing.

      2 Bij algemene maatregel van bestuur kan worden bepaald dat [hoofdstuk III][ref4] of een of meer daarbij aan te
      wijzen artikelen van deze wet niet van toepassing zijn op een zeer kleine collectieve watervoorziening:

      a. die geen drinkwater levert in het kader van een commerciële of openbare activiteit, waarbij in elk geval wordt
      voldaan aan artikel 3, vierde lid, van de Drinkwaterrichtlijn, of

      b. die drinkwater levert in het kader van een commerciële of openbare activiteit, waarbij in elk geval wordt
      voldaan aan artikel 3, zesde lid, van de Drinkwaterrichtlijn.

      3 Bij algemene maatregel van bestuur kan worden bepaald dat een of meer daarbij krachtens
      [artikel 21, derde lid, aanhef en onder b][ref5], gestelde eisen niet van toepassing zijn op een kleine collectieve
      watervoorziening, waarbij in elk geval wordt voldaan aan artikel 9, zesde lid, van de Drinkwaterrichtlijn.


