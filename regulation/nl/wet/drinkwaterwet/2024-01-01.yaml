  - number: '26'
    text: |-
      De eigenaar van een collectieve watervoorziening draagt er zorg voor dat het ontwerp en de staat van die
      collectieve watervoorziening alsmede de toestellen en leidingen die daarvan deel uitmaken en die middellijk
      of onmiddellijk zijn aangesloten op het leidingnet van een drinkwaterbedrijf of van een andere collectieve
      watervoorziening, dan wel op een collectief leidingnet, geen gevaar voor verontreiniging van dat leidingnet en
      van het door middel van die leidingen en toestellen aan consumenten of andere afnemers ter beschikking gestelde
      drinkwater kunnen opleveren.
    url: https://wetten.overheid.nl/BWBR0026338/2024-01-01#Artikel26
  - number: '27'
    text: |-
      De eigenaar van een collectief leidingnet verstrekt de daarop aangesloten consumenten en andere afnemers
      overeenkomstig bij of krachtens algemene maatregel van bestuur te stellen regels informatie over maatregelen die
      zij moeten treffen ingeval het gebruik van het door hem geleverde water een gevaar voor de volksgezondheid kan
      opleveren.
    url: https://wetten.overheid.nl/BWBR0026338/2024-01-01#Artikel27
  - number: '28'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot het door de eigenaren
      van daarbij aangewezen categorieën van collectieve leidingnetten verrichten van metingen ten aanzien van de
      kwaliteit van het door hen aan consumenten of andere afnemers ter beschikking gestelde drinkwater. Deze regels
      hebben in ieder geval betrekking op de frequentie van de metingen, de te hanteren parameters, de monstername en de
      te verrichten analyses.

      2 De eigenaren, bedoeld in het eerste lid, houden de resultaten van de metingen gedurende vijf jaren ter
      beschikking van de toezichthouder.

      3 Indien uit de metingen blijkt dat niet wordt voldaan aan de krachtens
      [artikel 21, derde lid, aanhef en onder a][ref1], of [artikel 23][ref2] juncto voornoemde bepaling gestelde eisen,
      dan wel dat anderszins de deugdelijkheid van het drinkwater wordt aangetast, geven de eigenaren, bedoeld in het
      eerste lid, daarvan onmiddellijk, overeenkomstig [artikel 27][ref3], kennis aan de betreffende consumenten en
      treden zij onmiddellijk in overleg met de toezichthouder.


      [ref1]: https://wetten.overheid.nl/BWBR0026338#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0026338#Artikel23
      [ref3]: https://wetten.overheid.nl/BWBR0026338#Artikel27
