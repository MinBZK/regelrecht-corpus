  - number: '30'
    text: |-
      De eigenaar van een collectief leidingnet draagt er zorg voor dat het ontwerp en de staat van dat collectieve
      leidingnet alsmede de toestellen en leidingen die daarvan deel uitmaken en die middellijk of onmiddellijk zijn
      aangesloten op het leidingnet van een drinkwaterbedrijf of collectieve watervoorziening, dan wel op een ander
      collectief leidingnet, geen gevaar kunnen opleveren voor verontreiniging van dat andere leidingnet en van het
      door middel van de bedoelde toestellen en leidingen aan consumenten of andere afnemers ter beschikking gestelde
      drinkwater.
    url: https://wetten.overheid.nl/BWBR0026338/2024-01-01#Artikel30
  - number: '31'
    text: |-
      De eigenaar van een woninginstallatie of andere installatie, niet zijnde een collectieve watervoorziening of
      collectief leidingnet, draagt er zorg voor dat de staat van die installatie en van de toestellen en leidingen
      die daarvan deel uitmaken en die middellijk of onmiddellijk zijn aangesloten op het leidingnet van een
      drinkwaterbedrijf of een collectieve watervoorziening, dan wel op een collectief leidingnet, geen gevaar kunnen
      opleveren voor verontreiniging van dat leidingnet of collectieve leidingnet en van het door middel van de bedoelde
      leidingen en toestellen aan consumenten en andere afnemers ter beschikking gestelde drinkwater.
    url: https://wetten.overheid.nl/BWBR0026338/2024-01-01#Artikel31
  - number: '32'
    text: |-
      1 De eigenaar van een drinkwaterbedrijf draagt er zorg voor dat de levering van deugdelijk drinkwater aan
      consumenten en andere afnemers in het voor zijn drinkwaterbedrijf vastgestelde distributiegebied gewaarborgd is in
      een zodanige hoeveelheid en onder een zodanige druk als in het belang van de volksgezondheid vereist is.

      2 De eigenaar van een drinkwaterbedrijf neemt alle passende maatregelen om te kunnen voorzien in de toekomstige
      behoefte aan drinkwater in het voor zijn drinkwaterbedrijf vastgestelde distributiegebied.
    url: https://wetten.overheid.nl/BWBR0026338/2024-01-01#Artikel32
  - number: '33'
    text: |-
      De eigenaar van een drinkwaterbedrijf draagt zorg voor de uitvoering van een analyse met betrekking tot het risico
      op verstoringen alsmede voor het actueel houden van die analyse.
    url: https://wetten.overheid.nl/BWBR0026338/2024-01-01#Artikel33
  - number: '34'
    text: |-
      1 De eigenaar van een drinkwaterbedrijf neemt op basis van de uitkomsten van de in [artikel 33][ref1] bedoelde
      analyse passende maatregelen om verstoringen zo veel mogelijk te voorkomen.

      2 De eigenaar van een drinkwaterbedrijf legt de uitkomsten van de analyse, alsmede de maatregelen, bedoeld in het
      eerste lid, vast in het leveringsplan, bedoeld in [artikel 37][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0026338#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0026338#Artikel37
    url: https://wetten.overheid.nl/BWBR0026338/2024-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0026338
        artikel: '33'
        hoofdstuk: IV
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0026338
        artikel: '37'
        hoofdstuk: IV
        paragraaf: '5'
  - number: '35'
    text: |-
      1 Indien een verstoring optreedt neemt de eigenaar van het betreffende drinkwaterbedrijf onmiddellijk alle
      maatregelen die noodzakelijk zijn om die verstoring zo spoedig mogelijk op te heffen.

      2 Indien de verstoring naar redelijke verwachting kan leiden of al heeft geleid tot een onderbreking in de levering
      van deugdelijk drinkwater gedurende een periode langer dan 24 uur, dan wel indien tengevolge van die verstoring
      sprake is van een gevaar voor de volksgezondheid, treedt de eigenaar, bedoeld in het eerste lid, onmiddellijk in
      overleg met de inspecteur.

      3 De eigenaar van het betreffende drinkwaterbedrijf draagt, indien als gevolg van de verstoring, naar het oordeel
      van de inspecteur, de levering van drinkwater niet meer mogelijk is of onaanvaardbaar vanuit het oogpunt van
      volksgezondheid, binnen een door de inspecteur vast te stellen termijn zorg voor de levering van nooddrinkwater.

      4 In het geval, bedoeld in het derde lid, verzorgt de eigenaar, voor zover dit technisch mogelijk is en er naar
      het oordeel van de inspecteur geen onaanvaardbare risico’s voor de volksgezondheid optreden, tevens de levering
      van noodwater.
    url: https://wetten.overheid.nl/BWBR0026338/2024-01-01#Artikel35
  - number: '36'
    text: |-
      1 Zo spoedig mogelijk, doch uiterlijk binnen zes maanden na beëindiging van de levering van het nooddrinkwater of
      het noodwater, rapporteert de eigenaar van het betreffende drinkwaterbedrijf schriftelijk aan de inspecteur omtrent
      de wijze waarop die levering is uitgevoerd.

      2 Op verzoek van de inspecteur en binnen een door de inspecteur te stellen termijn stelt de eigenaar van het
      drinkwaterbedrijf na een verstoring een evaluatierapport op en zendt hij dit aan de inspecteur.
    url: https://wetten.overheid.nl/BWBR0026338/2024-01-01#Artikel36
  - number: '37'
    text: |-
      1 De eigenaar van een drinkwaterbedrijf stelt een leveringsplan op, waarin wordt aangegeven op welke wijze aan de
      uitvoering van de op grond van de [artikelen 32 tot en met 35][ref1] voor hem geldende verplichtingen ten aanzien
      van de leveringszekerheid, de dekking van de toekomstige behoefte aan drinkwater en de levering van nooddrinkwater
      en noodwater, wordt voldaan.

      2 Bij het opstellen van het leveringsplan wordt rekening gehouden met de beleidsnota inzake de openbare
      drinkwatervoorziening, bedoeld in [artikel 6][ref2].

      3 Het leveringsplan behoeft de goedkeuring van de inspecteur en wordt daartoe aan hem overgelegd.

      4 De in het leveringsplan opgenomen gegevens, die betrekking hebben op het voorkomen van een verstoring, de
      voorbereiding op een verstoring dan wel het optreden in geval van een verstoring, zijn informatie als bedoeld in
      [artikel 5.1, eerste lid, aanhef en onderdeel b, van de Wet open overheid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0026338#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0026338#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0045754#Artikel5.1
    url: https://wetten.overheid.nl/BWBR0026338/2024-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0026338
        artikel: '32'
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0026338
        artikel: '6'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0045754
        artikel: '5.1'
  - number: '38'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere eisen gesteld ten aanzien van:

      a. de leveringszekerheid van drinkwater;

      b. de levering van nooddrinkwater;

      c. de levering van noodwater;

      d. de wijze waarop de in [artikel 33][ref1] bedoelde analyse wordt uitgevoerd en actueel wordt gehouden en de aard
      van de op grond van de uitkomsten van die analyse te treffen maatregelen, en

      e. de opzet, inhoud, wijze van totstandkoming, wijziging en herziening van een leveringsplan als bedoeld in
      [artikel 37][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0026338#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0026338#Artikel37
    url: https://wetten.overheid.nl/BWBR0026338/2024-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0026338
        artikel: '33'
        hoofdstuk: IV
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0026338
        artikel: '37'
        hoofdstuk: IV
        paragraaf: '5'
  - number: '39'
    text: |-
      1 Onze Minister wijst een instantie aan die belast is met de uitvoering van een prestatievergelijking die
      betrekking heeft op de kwaliteit van het geleverde water, de milieuaspecten van de drinkwatervoorziening,
      klantenservice, kostenefficiëntie, onderzoek en ontwikkeling.

      2 De prestatievergelijking wordt uitgevoerd volgens een bij of krachtens algemene maatregel van bestuur te bepalen
      frequentie en heeft betrekking op het kalenderjaar dat voorafgaat aan het jaar waarin de prestatievergelijking
      wordt uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0026338/2024-01-01#Artikel39
  - number: '40'
    text: |-
      1 De in [artikel 39, eerste lid][ref1], bedoelde instantie stelt ten behoeve van de uitvoering van een
      prestatievergelijking uiterlijk op 1 maart van het jaar, waarin die prestatievergelijking wordt uitgevoerd, een
      protocol vast, inhoudend:

      a. een uitwerking van de in dat lid genoemde categorieën van prestaties waarop de vergelijking betrekking heeft;

      b. de wijze waarop de prestatievergelijking wordt uitgevoerd;

      c. de aanwijzing van de drinkwaterbedrijven waarmee de prestatievergelijking wordt uitgevoerd, daaronder begrepen
      zo mogelijk een substantieel aantal buitenlandse drinkwaterbedrijven;

      d. een aanduiding van de door de eigenaren van de drinkwaterbedrijven te verstrekken gegevens die noodzakelijk
      zijn voor de uitvoering van de prestatievergelijking, de wijze waarop en de termijn waarbinnen deze gegevens worden
      verstrekt en de wijze waarop deze worden verwerkt door de eerdergenoemde instantie.

      2 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot de opzet en
      inhoud van een protocol als bedoeld in het eerste lid.

      3 Het protocol behoeft de goedkeuring van Onze Minister.

      4 De goedkeuring, bedoeld in het derde lid, kan geheel of gedeeltelijk worden onthouden voor zover een protocol:

      a. niet voldoet aan de daaraan op grond van deze wet gestelde eisen;

      b. een of meer voor een goede uitvoering van de prestatievergelijking noodzakelijke elementen mist, of

      c. anderszins in strijd is met het belang van de volksgezondheid of het belang van de doelmatigheid van de openbare
      drinkwatervoorziening.

      5 Van een goedgekeurd protocol doet Onze Minister mededeling in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0026338#Artikel39
    url: https://wetten.overheid.nl/BWBR0026338/2024-01-01#Artikel40
