  - number: '6'
    text: |-
      1 Onze Minister stelt ten minste eenmaal in de zes jaar een beleidsnota inzake de openbare drinkwatervoorziening
      vast.

      2 De beleidsnota bevat in elk geval:

      a. de hoofdlijnen en beginselen van het beleid, ter uitvoering van deze wet, met betrekking tot de productie en
      distributie van deugdelijk drinkwater en de duurzame veiligstelling van de openbare drinkwatervoorziening;

      b. de hoofdlijnen van het beleid ter uitvoering van voor Nederland bindende besluiten van instellingen van de
      Europese Unie met betrekking tot de productie en het ter beschikking stellen van drinkwater, en

      c. de hoofdlijnen van het beleid met betrekking tot de bescherming van bij de bereiding van drinkwater te gebruiken
      grondstoffen.

      3 Onze Minister betrekt bij het opstellen van de beleidsnota de zienswijzen van belanghebbenden.

      4 Zodra de beleidsnota is vastgesteld, zendt Onze Minister deze aan beide Kamers der Staten-Generaal en doet
      hij mededeling van de beleidsnota in de Staatscourant. Tevens zendt hij de beleidsnota aan de bestuursorganen,
      instellingen en overige organisaties die betrokken waren bij de voorbereiding ervan.

      5 De beleidsnota kan tussentijds worden gewijzigd. Het derde en vierde lid zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0026338/2024-01-01#Artikel6
  - number: '7'
    text: |-
      1 De eigenaar van een drinkwaterbedrijf heeft tot taak:

      a. het tot stand brengen en in stand houden van een duurzame en doelmatige openbare drinkwatervoorziening in het
      voor zijn bedrijf vastgestelde distributiegebied;

      b. het tot stand brengen en in stand houden van de infrastructuur die noodzakelijk is voor de productie en
      distributie van drinkwater in dat distributiegebied;

      c. het overeenkomstig artikel 8 leveren van drinkwater binnen het voor zijn bedrijf vastgestelde distributiegebied,
      en

      d. het borgen van de kwaliteit en duurzaamheid van het productie- en distributieproces en het geleverde drinkwater.

      2 De eigenaar van een drinkwaterbedrijf heeft voorts tot taak:

      a. het bijdragen aan de bescherming van de bronnen voor de drinkwatervoorziening in zijn distributiegebied tegen
      verontreiniging, waaronder in elk geval wordt begrepen:

      1°. het verrichten van onderzoek naar de kwaliteit van deze bronnen;

      2°. het beheren of medebeheren van terreinen rondom deze bronnen gericht op het voorkomen of beperken van
      verontreiniging van deze bronnen;

      b. het bijdragen aan het uit een oogpunt van volksgezondheid verantwoord omgaan met drinkwater door eigenaars,
      consumenten en andere afnemers tussen het punt van levering en het punt waar het drinkwater voor consumptie ter
      beschikking komt, waaronder in elk geval wordt begrepen:

      1°. het geven van voorlichting aan consumenten;

      2°. het opstellen van technische eisen ten aanzien van de op zijn distributienet aan te sluiten en aangesloten
      installaties;

      3°. het overeenkomstig [artikel 24][ref1] uitvoeren van controles ten aanzien van bedoelde installaties.

      3 Indien de eigenaar van een drinkwaterbedrijf baten die zijn verkregen ter uitvoering van een taak of taken
      als bedoeld in het eerste of tweede lid aanwendt voor het verrichten van economische activiteiten, geschiedt
      de aanwending van die baten tegen condities die in het normale handelsverkeer gebruikelijk zijn voor de
      financiering van de desbetreffende economische activiteiten. De [artikelen 25a, aanhef en onderdeel d][ref2], en
      [25b van de Mededingingswet][ref3] zijn van overeenkomstige toepassing op de eigenaren van drinkwaterbedrijven.


      [ref1]: https://wetten.overheid.nl/BWBR0026338#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0008691#Artikel25a
      [ref3]: https://wetten.overheid.nl/BWBR0008691#Artikel25b
