    text: |-
      1 De [Waterleidingwet][ref1] wordt ingetrokken op het tijdstip waarop deze wet in werking treedt,
      met dien verstande dat [hoofdstuk III van die wet][ref2], zoals die onmiddellijk voorafgaand aan dat
      tijdstip luidt, ook na dat tijdstip van toepassing blijft op plannen tot reorganisatie van de openbare
      drinkwatervoorziening in gevallen waarbij op dat tijdstip de overgang van een distributiegebied als bedoeld in
      [artikel 21, tweede lid, van die wet][ref3], nog niet is voltooid.

      2 In afwijking van de [artikelen 3][ref4] en [15][ref5] van deze wet kan, voor de periode gedurende welke dat nodig
      is voor de uitvoering van een plan tot reorganisatie als bedoeld in [hoofdstuk III van de Waterleidingwet][ref6],
      een distributiegebied worden toegewezen aan een drinkwaterbedrijf dat niet of niet geheel voldoet aan
      de voorwaarden, bedoeld in onderdeel b van de definitie van gekwalificeerde rechtspersoon, opgenomen in
      [artikel 1, eerste lid][ref7], van deze wet.

      3 Met ingang van het tijdstip van de inwerkingtreding van deze wet berust de
      [Regeling distributiegebieden waterleidingbedrijven][ref8] op [artikel 5, eerste lid][ref9].

      4 Met ingang van het tijdstip van de inwerkingtreding van deze wet berust het
      [Besluit aanwijzing ambtenaren VROM-regelgeving][ref10], voor zover dat onmiddellijk voorafgaand aan dat tijdstip
      berustte op de [Waterleidingwet][ref11], op [artikel 48, eerste lid][ref12].


