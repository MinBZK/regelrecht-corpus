  - number: '63'
    text: |-
      1 De bevoegdheid, de gemeenteraad toekomend ingevolge [artikel 149 van de Gemeentewet][ref1], blijft ten aanzien
      van een onderwerp, waarin deze wet of de daarop berustende bepalingen voorzien, gehandhaafd voor zover de door hem
      te maken verordeningen niet met deze wet in strijd zijn.

      2 In afwijking van de [artikelen 119 van de Provinciewet][ref2] en [122 van de Gemeentewet][ref3] heeft de
      inwerkingtreding van deze wet slechts ten aanzien van de gevallen, waarin strijd met deze wet of de daarop
      berustende bepalingen zou ontstaan, tot gevolg, dat de verordeningen van provinciale staten en van gemeenteraden
      betreffende de onderwerpen, waarin deze wet of de daarop berustende bepalingen voorzien, van rechtswege ophouden
      te gelden.


