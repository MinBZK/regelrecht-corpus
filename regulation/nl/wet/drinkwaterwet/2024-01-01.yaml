  - number: '12'
    text: |-
      1 Uit de begroting van het drinkwaterbedrijf blijkt op welke wijze de kosten, waaronder de vermogenskosten die ten
      hoogste mogen worden gehanteerd, in het tarief zijn verwerkt.

      2 De eigenaar van een drinkwaterbedrijf brengt jaarlijks voor 1 oktober aan Onze Minister een verslag uit dat
      inzicht verschaft in de kosten, waaronder de vermogenskosten, die in het voorafgaande kalenderjaar zijn gehanteerd
      bij het vaststellen van de tarieven voor de levering van drinkwater en het gerealiseerde bedrijfsresultaat over dat
      jaar. Het verslag dient voorzien te zijn van een goedkeurende verklaring van een registeraccountant. Onze Minister
      zendt dit verslag voor het einde van het kalenderjaar aan de beide Kamers der Staten-Generaal.

      3 Indien uit het verslag, bedoeld in het tweede lid, blijkt dat het gerealiseerde bedrijfsresultaat de voor dat
      jaar op basis van [artikel 11, tweede lid][ref1], bepaalde vermogenskosten overschrijdt, draagt de eigenaar van een
      drinkwaterbedrijf er zorg voor dat die overschrijding wordt gecompenseerd uiterlijk in de tariefstelling voor het
      daaropvolgende kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0026338#Artikel11
