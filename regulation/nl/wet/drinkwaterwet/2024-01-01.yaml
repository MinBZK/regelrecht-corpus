  - number: '29'
    text: |-
      1 De eigenaar van een collectief leidingnet draagt er zorg voor dat het ontwerp en de staat van dat collectieve
      leidingnet en de daarin toe te passen materialen zodanig zijn dat deze geen omstandigheid opleveren waardoor niet
      voldaan wordt aan de krachtens [artikel 21, derde lid, aanhef en onder a][ref1], of [artikel 23][ref2] juncto
      voornoemde bepaling gestelde eisen, alsmede dat dat ontwerp, die staat of die materialen niet de deugdelijkheid van
      het drinkwater aantasten.

      2 Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent de aanleg, uitbreiding of
      wijziging van, dan wel herstelling aan, een collectief leidingnet, voor zover dat leidingnet geen deel uitmaakt
      van een gebouw als bedoeld in [artikel 1, eerste lid, van de Woningwet][ref3], alsmede aan de in dat leidingnet te
      gebruiken materialen.

      3 Bij of krachtens algemene maatregel van bestuur kunnen categorieën van leidingnetten worden aangewezen, waarop
      het eerste lid of de krachtens het tweede lid gestelde regels niet van toepassing zijn. Een zodanige aanwijzing
      betreft slechts leidingnetten met behulp waarvan het drinkwater niet in het kader van een commerciële of openbare
      activiteit ter beschikking wordt gesteld aan consumenten of andere afnemers.


      [ref1]: https://wetten.overheid.nl/BWBR0026338#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0026338#Artikel23
      [ref3]: https://wetten.overheid.nl/BWBR0005181#Artikel1
