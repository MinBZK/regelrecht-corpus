  - number: '51'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen in het belang van de volksgezondheid gegevens worden
      aangewezen die door de eigenaar van een drinkwaterbedrijf op een bij of krachtens die maatregel aangegeven wijze
      worden verstrekt aan de inspecteur.
    url: https://wetten.overheid.nl/BWBR0026338/2024-01-01#Artikel51
  - number: '52'
    text: |-
      Indien de levering van drinkwater aan consumenten of andere afnemers naar het oordeel van de inspecteur gevaar voor
      de volksgezondheid kan opleveren, kan hij die levering verbieden of slechts toestaan voor gebruik in door hem aan
      te geven gevallen, op een daarbij aan te geven wijze.
    url: https://wetten.overheid.nl/BWBR0026338/2024-01-01#Artikel52
  - number: '53'
    text: |-
      Hetgeen ten aanzien van de inspecteur of de eigenaar van een drinkwaterbedrijf is bepaald in de
      [artikelen 51][ref1] en [52][ref2] en de daarop berustende bepalingen, is van overeenkomstige toepassing ten
      aanzien van een op grond van [artikel 48][ref3] aangewezen andere toezichthouder, respectievelijk de eigenaar
      van een collectieve watervoorziening of collectief leidingnet, voor zover daarmee drinkwater wordt geleverd aan
      consumenten of andere afnemers.


      [ref1]: https://wetten.overheid.nl/BWBR0026338#Artikel51
      [ref2]: https://wetten.overheid.nl/BWBR0026338#Artikel52
      [ref3]: https://wetten.overheid.nl/BWBR0026338#Artikel48
    url: https://wetten.overheid.nl/BWBR0026338/2024-01-01#Artikel53
    references:
