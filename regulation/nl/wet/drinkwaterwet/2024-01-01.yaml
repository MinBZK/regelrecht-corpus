      1 Indien er naar het oordeel van Onze Minister sprake is van een rechtshandeling als bedoeld in [artikel 15][ref1],
      geeft hij een aanwijzing aan de daarbij betrokken personen tot het binnen een daarbij te stellen termijn beëindigen
      van die handeling, dan wel, voor zover die handeling reeds is voltooid, tot het binnen die termijn ongedaan maken
      van de gevolgen van die handeling.

      2 Degene tot wie een aanwijzing als bedoeld in het eerste lid wordt gericht, is verplicht daaraan gevolg te geven.

      3 Van een aanwijzing doet Onze Minister mededeling in de Staatscourant.


