        artikel: '40'
        hoofdstuk: V
        paragraaf: '1'
  - number: '43'
    text: |-
      1 De met de uitvoering van de prestatievergelijking belaste instantie draagt er zorg voor dat uiterlijk op
      31 december van het kalenderjaar, waarin een prestatievergelijking is uitgevoerd, een verslag houdende de
      resultaten van die prestatievergelijking is opgesteld ten behoeve van de eigenaren van drinkwaterbedrijven en aan
      hen wordt toegezonden.

      2 Het in het eerste lid bedoelde verslag wordt gelijktijdig toegezonden aan Onze Minister.

      3 Onze Minister zendt het verslag aan beide Kamers der Staten-Generaal en doet van het verslag mededeling in de
      Staatscourant.

      4 Bij of krachtens algemene maatregel van bestuur worden nadere eisen gesteld ten aanzien van de opzet en inhoud
      van het in het eerste lid bedoelde verslag.
    url: https://wetten.overheid.nl/BWBR0026338/2024-01-01#Artikel43
  - number: '44'
    text: |-
      1 De eigenaar van een drinkwaterbedrijf maakt binnen zes maanden na het uitbrengen van een verslag als bedoeld in
      [artikel 43, eerste lid][ref1], de voornemens ter verbetering van de prestaties van zijn drinkwaterbedrijf, alsmede
      de termijn of termijnen waarbinnen deze gerealiseerd zullen worden, schriftelijk kenbaar aan Onze Minister.

      2 Onze Minister informeert de beide Kamers der Staten-Generaal omtrent de voornemens, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0026338#Artikel43
    url: https://wetten.overheid.nl/BWBR0026338/2024-01-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0026338
        artikel: '43'
        hoofdstuk: V
        paragraaf: '2'
  - number: '45'
    text: |-
      1 Onze Minister stelt uiterlijk op 31 december van elk kalenderjaar een verslag op met betrekking tot de kwaliteit
      van het drinkwater gedurende het aan dat jaar voorafgaande kalenderjaar.

      2 Onze Minister zendt het verslag, bedoeld in het eerste lid, aan beide Kamers der Staten-Generaal en doet van het
      verslag mededeling in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0026338/2024-01-01#Artikel45
  - number: '46'
    text: |-
      Het verslag, bedoeld in [artikel 45][ref1], bevat ten minste gegevens over de kwaliteit van het drinkwater
      afkomstig van de voorzieningen die gemiddeld meer dan 1000 m3 drinkwater per dag leveren aan consumenten of andere
      afnemers of waarvan, gemeten over een periode van een jaar, gemiddeld meer dan 5000 personen per dag gebruik maken.


      [ref1]: https://wetten.overheid.nl/BWBR0026338#Artikel45
    url: https://wetten.overheid.nl/BWBR0026338/2024-01-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0026338
        artikel: '45'
        hoofdstuk: VI
  - number: '47'
    text: |-
      Ten behoeve van het verslag, bedoeld in [artikel 45][ref1], verstrekken de eigenaren van drinkwaterbedrijven,
      collectieve watervoorzieningen en collectieve leidingnetten, voor zover daarmee drinkwater wordt geleverd aan
      consumenten of andere afnemers, aan Onze Minister op zijn verzoek de hun ter beschikking staande inlichtingen en
      gegevens, die Onze Minister voor het opstellen van dat verslag noodzakelijk acht.


      [ref1]: https://wetten.overheid.nl/BWBR0026338#Artikel45
    url: https://wetten.overheid.nl/BWBR0026338/2024-01-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0026338
        artikel: '45'
        hoofdstuk: VI
  - number: '48'
    text: |-
      1 Met het toezicht op de naleving van deze wet en de daarop berustende bepalingen zijn belast de door Onze Minister
      als zodanig aangewezen inspecteur en de overige daartoe aangewezen ambtenaren.

      2 In afwijking van het eerste lid zijn met het toezicht op de naleving van deze wet en de daarop berustende
      bepalingen belast de door Onze Minister van Economische Zaken daartoe aangewezen ambtenaren, voor zover het
      betreft voorzieningen voor de winning, behandeling of distributie van water op een binnen het Nederlandse
      territoir of het Nederlandse deel van het continentale plat gelegen mijnbouwinstallatie als bedoeld in
      [artikel 1, onderdeel o, van de Mijnbouwwet][ref1], welk water als drinkwater aan consumenten binnen die
      mijnbouwinstallatie ter beschikking wordt gesteld.

      3 Van een besluit als bedoeld in het eerste of tweede lid wordt mededeling gedaan door plaatsing in de
      Staatscourant.

      4 In afwijking van het eerste en tweede lid is de Autoriteit Consument en Markt, genoemd in
      [artikel 2, eerste lid, van de Instellingswet Autoriteit Consument en Markt][ref2], belast met het toezicht op de
      naleving van [artikel 7, derde lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0033043#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0026338#Artikel7
