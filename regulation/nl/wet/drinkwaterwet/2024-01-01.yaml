  - number: '8'
    text: |-
      1 De eigenaar van een drinkwaterbedrijf is verplicht, binnen het voor zijn bedrijf vastgestelde distributiegebied,
      aan degene, die daarom verzoekt, een aanbod te doen om die persoon te voorzien van een aansluiting op het door hem
      beheerde leidingnet.

      2 De eigenaar van een drinkwaterbedrijf is voorts verplicht, binnen het voor zijn bedrijf vastgestelde
      distributiegebied, aan degene, die daarom verzoekt, een aanbod te doen om met gebruikmaking van het door hem
      beheerde leidingnet aan die persoon drinkwater te leveren.

      3 De eigenaar van een drinkwaterbedrijf hanteert voorwaarden die redelijk, transparant en niet discriminerend zijn.

      4 In het belang van de openbare drinkwatervoorziening kunnen bij of krachtens algemene maatregel van bestuur regels
      worden gesteld met betrekking tot de toepassing van het eerste tot en met derde lid.
    url: https://wetten.overheid.nl/BWBR0026338/2024-01-01#Artikel8
  - number: '9'
    text: |-
      1 De eigenaar van een drinkwaterbedrijf voert een beleid, gericht op het voorkomen van het afsluiten van een
      kleinverbruiker.

      2 Bij ministeriële regeling worden regels gesteld over het beëindigen van de levering van drinkwater aan een
      kleinverbruiker, alsmede over preventieve maatregelen om de afsluiting van kleinverbruikers zoveel mogelijk te
      voorkomen.

      3 De in het tweede lid bedoelde preventieve maatregelen kunnen tevens inhouden dat in bij de regeling, bedoeld
      in dat lid, omschreven gevallen met daarbij aangeduide instanties overleg wordt gepleegd alsmede dat in die
      gevallen aan de desbetreffende instantie de in die regeling omschreven gegevens omtrent een kleinverbruiker worden
      verstrekt.

      4 De ministeriële regeling, bedoeld in het tweede lid, wordt niet eerder vastgesteld dan nadat de gezamenlijke
      drinkwaterbedrijven, de consumentenorganisaties en de Nederlandse Vereniging voor Volkskrediet in de gelegenheid
      zijn gesteld hun zienswijze te geven over de inhoud van de regeling.
    url: https://wetten.overheid.nl/BWBR0026338/2024-01-01#Artikel9
  - number: '10'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur wordt een algemeen aanvaarde bedrijfseconomische methode
      vastgesteld volgens welke de gewogen gemiddelde vermogenskostenvoet en het aandeel eigen vermogen in het totale
      vermogen worden bepaald.

      2 Onze Minister stelt driejaarlijks voor 1 november, ten behoeve van de bepaling van de tarieven voor de daarop
      volgende drie kalenderjaren, het maximaal toegestane aandeel vast van het eigen vermogen in het totale vermogen.
      Bij of krachtens algemene maatregel van bestuur wordt vastgesteld volgens welke criteria en tot welk niveau Onze
      Minister op een daartoe strekkend verzoek van de eigenaar van een drinkwaterbedrijf van dit in de vorige volzin
      bedoelde maximale aandeel kan afwijken.

      3 Onze Minister stelt driejaarlijks voor 1 november, ten behoeve van de bepaling van de tarieven voor de daarop
      volgende drie kalenderjaren, de gewogen gemiddelde vermogenskostenvoet vast volgens de methode, bedoeld in het
      eerste lid. Onze Minister kan een besluit houdende vaststelling van de gewogen gemiddelde vermogenskostenvoet een
      maal verlengen met ten hoogste drie kalenderjaren, indien noodzakelijk met het oog op de continuïteit of veiligheid
      van de openbare drinkwatervoorziening en onder met het oog daarop te stellen voorwaarden. Tegen de vaststelling is
      geen bezwaar of beroep mogelijk.
    url: https://wetten.overheid.nl/BWBR0026338/2024-01-01#Artikel10
  - number: '11'
    text: |-
      1 De eigenaar van een drinkwaterbedrijf hanteert tarieven die kostendekkend, transparant en niet discriminerend
      zijn.

      2 De eigenaar van een drinkwaterbedrijf hanteert bij de bepaling van de vermogenskosten die in het tarief
      mogen worden doorberekend ten hoogste de geldende gewogen gemiddelde vermogenskostenvoet, vastgesteld krachtens
      [artikel 10, derde lid][ref1].

      3 De toerekening van de kosten van materiële vaste activa vindt plaats op basis van afschrijvingsmethoden en
      afschrijvingstermijnen die volgens algemeen aanvaarde bedrijfseconomische principes zijn bepaald.

      4 Als grondslag voor het bepalen van de vermogenskosten, die in het tarief mogen worden doorberekend, geldt de
      activawaarde, waarbij de materiële vaste activa gewaardeerd worden tegen historische kostprijs.


      [ref1]: https://wetten.overheid.nl/BWBR0026338#Artikel10
