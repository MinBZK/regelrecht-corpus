  - number: '2'
    text: |-
      1 Bestuursorganen dragen zorg voor de duurzame veiligstelling van de openbare drinkwatervoorziening.

      2 Bij de uitoefening van bevoegdheden en toepassing van wettelijke voorschriften door bestuursorganen geldt de
      duurzame veiligstelling van de openbare drinkwatervoorziening als een dwingende reden van groot openbaar belang.
    url: https://wetten.overheid.nl/BWBR0026338/2024-01-01#Artikel2
  - number: '3'
    text: |-
      De zorg, overeenkomstig deze wet en de daarop berustende bepalingen, voor een voldoende en duurzame uitvoering van
      de openbare drinkwatervoorziening binnen een distributiegebied berust bij de eigenaar van het drinkwaterbedrijf die
      bevoegd en, overeenkomstig [artikel 8][ref1], verplicht is tot levering van drinkwater in dat gebied.


      [ref1]: https://wetten.overheid.nl/BWBR0026338#Artikel8
    url: https://wetten.overheid.nl/BWBR0026338/2024-01-01#Artikel3
