        bwb_id: BWBR0026338
        artikel: '52'
        hoofdstuk: VIII
      - id: ref3
        bwb_id: BWBR0026338
        artikel: '48'
        hoofdstuk: VII
  - number: '54'
    text: |-
      Onze Minister kan in geval van buitengewone omstandigheden, zo mogelijk na overleg met de eigenaar van een
      drinkwaterbedrijf en zo lang als die omstandigheden dat vereisen, regels stellen of maatregelen treffen die hij
      redelijkerwijs nodig acht in het belang van de veiligstelling van de openbare drinkwatervoorziening.
    url: https://wetten.overheid.nl/BWBR0026338/2024-01-01#Artikel54
  - number: 54a
    text: |-
      Bij algemene maatregel van bestuur of, indien strekkend tot een goede uitvoering, bij regeling van Onze Minister,
      kunnen ter implementatie van internationale verplichtingen nadere regels worden gesteld omtrent de in deze wet
      geregelde onderwerpen.
    url: https://wetten.overheid.nl/BWBR0026338/2024-01-01#Artikel54a
  - number: '60'
    text: |-
      Onze Minister zendt binnen vijf jaar na de inwerkingtreding van deze wet aan de Staten-Generaal een verslag over de
      doeltreffendheid en de effecten van [hoofdstuk V][ref1] in de praktijk.


      [ref1]: https://wetten.overheid.nl/BWBR0026338#HoofdstukV
    url: https://wetten.overheid.nl/BWBR0026338/2024-01-01#Artikel60
