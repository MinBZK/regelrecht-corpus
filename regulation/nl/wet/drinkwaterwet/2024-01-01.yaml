        artikel: '39'
        hoofdstuk: V
        paragraaf: '1'
  - number: '41'
    text: |-
      1 De uitvoering van een prestatievergelijking geschiedt overeenkomstig het daartoe vastgestelde en krachtens
      [artikel 40, derde lid][ref1], goedgekeurde protocol.

      2 Indien het betreffende protocol niet of niet tijdig wordt vastgesteld, dan wel indien daaraan geheel of
      gedeeltelijk goedkeuring wordt onthouden, kan Onze Minister, ter gehele of gedeeltelijke vervanging van
      dat protocol, die regels stellen die naar zijn oordeel noodzakelijk zijn voor een goede uitvoering van de
      prestatievergelijking.

      3 De in het tweede lid bedoelde regels kunnen in elk geval betrekking hebben op de in
      [artikel 40, eerste lid, onder a tot en met d][ref2], genoemde onderwerpen.

      4 Op grond van het tweede lid gestelde regels treden voor de toepassing van dit hoofdstuk geheel of gedeeltelijk in
      de plaats van het protocol.


      [ref1]: https://wetten.overheid.nl/BWBR0026338#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0026338#Artikel40
    url: https://wetten.overheid.nl/BWBR0026338/2024-01-01#Artikel41
