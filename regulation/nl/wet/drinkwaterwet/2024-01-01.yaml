      1 De eigenaar van een drinkwaterbedrijf meldt de volgende rechtshandelingen, voordat deze rechtsgevolg krijgen, aan
      Onze Minister:

      a. het wijzigen van de statuten;

      b. het uitgeven van aandelen in het kapitaal van het drinkwaterbedrijf;

      c. het overdragen van de eigendom van een of meer watervoorzieningswerken of werken ten behoeve van de productie
      van drinkwater;

      d. het belasten van een of meer watervoorzieningswerken of werken ten behoeve van de productie van drinkwater met
      enig zakelijk of persoonlijk recht;

      e. het belasten van de winst met enig zakelijk of persoonlijk recht;

      f. het sluiten van een overeenkomst waardoor de zeggenschap over het drinkwaterbedrijf geheel of gedeeltelijk door
      of tezamen met derden wordt uitgeoefend, dan wel waardoor deze daartoe feitelijk in de gelegenheid worden gesteld.

      2 Bij de melding geeft de eigenaar van het betreffende drinkwaterbedrijf aan of sprake is van een overdracht als
      bedoeld in [artikel 5, achtste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0026338#Artikel5
