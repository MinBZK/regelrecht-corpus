  - number: '15'
    text: |-
      Het is verboden een rechtshandeling te verrichten, die tot gevolg heeft dat middellijk of onmiddellijk, alleen of
      tezamen met derden, door anderen dan een gekwalificeerde rechtspersoon geheel of gedeeltelijk zeggenschap wordt
      verkregen over een drinkwaterbedrijf of een deel daarvan, dan wel over de bedrijfsvoering van een drinkwaterbedrijf
      of een deel van die bedrijfsvoering.
    url: https://wetten.overheid.nl/BWBR0026338/2024-01-01#Artikel15
  - number: '16'
    text: |-
      Tot de rechtshandelingen, bedoeld in [artikel 15][ref1], behoren in elk geval:

      a. het wijzigen van de bepalingen in de statuten van een drinkwaterbedrijf, zodanig dat daardoor de mogelijkheid
      wordt geboden dat een derde, niet zijnde een gekwalificeerde rechtspersoon, houder wordt van aandelen in het
      kapitaal van dat drinkwaterbedrijf;

      b. het overdragen van aandelen in het kapitaal van een drinkwaterbedrijf aan een derde als bedoeld in onderdeel a;

      c. het overdragen aan een derde als bedoeld in onderdeel a van de eigendom van een of meer watervoorzieningswerken;

      d. het belasten of bezwaren van een of meer watervoorzieningswerken ten behoeve van een derde als bedoeld
      in onderdeel a met enig zakelijk of persoonlijk recht, indien als gevolg daarvan de gehele of gedeeltelijke
      zeggenschap over het drinkwaterbedrijf feitelijk niet meer zelfstandig wordt uitgeoefend door een gekwalificeerde
      rechtspersoon;

      e. het belasten of bezwaren van de winst van een drinkwaterbedrijf ten behoeve van een derde als bedoeld in
      onderdeel a met enig zakelijk of persoonlijk recht;

      f. het aangaan van een overeenkomst waardoor de zeggenschap over een drinkwaterbedrijf geheel of gedeeltelijk door,
      of tezamen met, een derde als bedoeld in onderdeel a wordt uitgeoefend, dan wel waardoor deze daartoe feitelijk in
      de gelegenheid wordt gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0026338#Artikel15
