---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: kwaliteitswet_zorginstellingen
regulatory_layer: WET
publication_date: '2015-11-11'
valid_from: '2009-07-01'
bwb_id: BWBR0007850
url: https://wetten.overheid.nl/BWBR0007850/2009-07-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is om de wijze waarop de kwaliteit van zorg, verleend
    door instellingen, van overheidswege wordt gewaarborgd, ingrijpend te wijzigen en dat derhalve nieuwe regels moeten
    worden gesteld;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0007850/2009-07-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0007850/2009-07-01#Artikel1
  - number: 1.1.a
    text: |-
      zorg: zorg als omschreven bij of krachtens de [Zorgverzekeringswet][ref1] en de
      [Algemene Wet Bijzondere Ziektekosten][ref2], met uitzondering van bij algemene maatregel van bestuur aangewezen
      zorg;


      [ref1]: https://wetten.overheid.nl/BWBR0018450
      [ref2]: https://wetten.overheid.nl/BWBR0002614
    url: https://wetten.overheid.nl/BWBR0007850/2009-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0018450
      - id: ref2
        bwb_id: BWBR0002614
  - number: 1.1.b
    text: 'instelling: het organisatorisch verband dat strekt tot de verlening van zorg;'
    url: https://wetten.overheid.nl/BWBR0007850/2009-07-01#Artikel1
  - number: 1.1.c
    text: 'zorgaanbieder:'
    url: https://wetten.overheid.nl/BWBR0007850/2009-07-01#Artikel1
  - number: 1.1.c.1°
    text: de natuurlijke persoon of de rechtspersoon, die een instelling in stand houdt;
    url: https://wetten.overheid.nl/BWBR0007850/2009-07-01#Artikel1
  - number: 1.1.c.2°
    text: de natuurlijke personen of rechtspersonen, die gezamenlijk een instelling vormen;
    url: https://wetten.overheid.nl/BWBR0007850/2009-07-01#Artikel1
  - number: 1.1.d
    text: 'Onze Minister: Onze Minister van Volksgezondheid, Welzijn en Sport.'
    url: https://wetten.overheid.nl/BWBR0007850/2009-07-01#Artikel1
  - number: '1.2'
    text: |-
      Bij algemene maatregel van bestuur kan, indien het belang van de bevordering van de kwaliteit van zorg dit vereist,
      een vorm van hulp worden aangewezen als zorg in de zin van deze wet.
    url: https://wetten.overheid.nl/BWBR0007850/2009-07-01#Artikel1
  - number: '1.3'
    text: |-
      Niet als instelling wordt beschouwd het organisatorisch verband waarbinnen in het kader van de binnen een ander
      organisatorisch verband verleende zorg, een deel van die zorg wordt verleend.
    url: https://wetten.overheid.nl/BWBR0007850/2009-07-01#Artikel1
  - number: '1.4'
    text: |-
      Indien het betreft een zorgaanbieder als bedoeld in het eerste lid, onder *c*, 2°, richten de uit deze wet
      voortvloeiende verplichtingen zich tot ieder van de in dat onderdeel bedoelde personen.
    url: https://wetten.overheid.nl/BWBR0007850/2009-07-01#Artikel1
  - number: '2'
    text: |-
      De zorgaanbieder biedt verantwoorde zorg aan. Onder verantwoorde zorg wordt verstaan zorg van goed niveau, die in
      ieder geval doeltreffend, doelmatig en patiëntgericht wordt verleend en die afgestemd is op de reële behoefte van
      de patiënt.
    url: https://wetten.overheid.nl/BWBR0007850/2009-07-01#Artikel2
  - number: '3'
    text: |-
      De zorgaanbieder organiseert de zorgverlening op zodanige wijze, voorziet de instelling zowel kwalitatief als
      kwantitatief zodanig van personeel en materieel, en draagt zorg voor een zodanige verantwoordelijkheidstoedeling,
      dat een en ander leidt of redelijkerwijs moet leiden tot een verantwoorde zorg. Hierbij betrekt hij de resultaten
      van overleg tussen zorgaanbieders, zorgverzekeraars en patiënten/consumentenorganisaties. Voor zover het betreft
      zorgverlening die verblijf van de patiënt of cliënt in de instelling gedurende tenminste het etmaal met zich
      brengt, draagt de zorgaanbieder er tevens zorg voor dat in de instelling geestelijke verzorging beschikbaar is, die
      zoveel mogelijk aansluit bij de godsdienst of levensovertuiging van de patiënten of cliënten.
    url: https://wetten.overheid.nl/BWBR0007850/2009-07-01#Artikel3
  - number: '4.1'
    text: |-
      Het uitvoeren van [artikel 3][ref1] omvat mede de systematische bewaking, beheersing en verbetering van de
      kwaliteit van de zorg.


      [ref1]: https://wetten.overheid.nl/BWBR0007850#Artikel3
    url: https://wetten.overheid.nl/BWBR0007850/2009-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0007850
        artikel: '3'
        hoofdstuk: II
  - number: '4.2'
    text: |-
      Ter uitvoering van het eerste lid draagt de zorgaanbieder, afgestemd op de aard en omvang van de instelling, zorg
      voor:
    url: https://wetten.overheid.nl/BWBR0007850/2009-07-01#Artikel4
  - number: 4.2.a
    text: het op systematische wijze verzamelen en registreren van gegevens betreffende de kwaliteit van de zorg;
    url: https://wetten.overheid.nl/BWBR0007850/2009-07-01#Artikel4
  - number: 4.2.b
    text: |-
      het aan de hand van de gegevens, bedoeld onder *a*, op systematische wijze toetsen in hoeverre de wijze van
      uitvoering van [artikel 3][ref1] leidt tot een verantwoorde zorgverlening;


      [ref1]: https://wetten.overheid.nl/BWBR0007850#Artikel3
    url: https://wetten.overheid.nl/BWBR0007850/2009-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0007850
        artikel: '3'
        hoofdstuk: II
  - number: 4.2.c
    text: |-
      het op basis van de uitkomst van de toetsing, bedoeld onder *b*, zonodig veranderen van de wijze waarop
      [artikel 3][ref1] wordt uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0007850#Artikel3
    url: https://wetten.overheid.nl/BWBR0007850/2009-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0007850
        artikel: '3'
        hoofdstuk: II
  - number: 4a.1
    text: |-
      De zorgaanbieder meldt aan de ingevolge [artikel 8][ref1] met het toezicht belaste ambtenaar onverwijld:


      [ref1]: https://wetten.overheid.nl/BWBR0007850#Artikel8
    url: https://wetten.overheid.nl/BWBR0007850/2009-07-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0007850
        artikel: '8'
        hoofdstuk: IV
  - number: 4a.1.a
    text: iedere calamiteit die in de instelling heeft plaatsgevonden;
    url: https://wetten.overheid.nl/BWBR0007850/2009-07-01#Artikel4a
  - number: 4a.1.b
    text: |-
      seksueel misbruik waarbij een patiënt of cliënt dan wel hulpverlener van de instelling is betrokken, uitgezonderd
      seksueel misbruik van hulpverleners onderling.
    url: https://wetten.overheid.nl/BWBR0007850/2009-07-01#Artikel4a
  - number: 4a.2
    text: |-
      Onder calamiteit wordt verstaan een niet-beoogde of onverwachte gebeurtenis, die betrekking heeft op de kwaliteit
      van de zorg en die tot de dood van of een ernstig schadelijk gevolg voor een patiënt of cliënt van de instelling
      heeft geleid.
    url: https://wetten.overheid.nl/BWBR0007850/2009-07-01#Artikel4a
  - number: 4a.3
    text: |-
      Onder seksueel misbruik wordt verstaan grensoverschrijdend seksueel gedrag waarbij sprake is van lichamelijk,
      geestelijk of relationeel overwicht.
    url: https://wetten.overheid.nl/BWBR0007850/2009-07-01#Artikel4a
  - number: 4a.4
    text: Onder hulpverlener wordt verstaan iedere medewerker van een instelling.
    url: https://wetten.overheid.nl/BWBR0007850/2009-07-01#Artikel4a
  - number: '5.1'
    text: |-
      De zorgaanbieder legt jaarlijks vóór 1 juni per instelling een verslag ter openbare inzage, waarin hij
      verantwoording aflegt van het beleid dat hij in het afgelopen kalenderjaar heeft gevoerd ter uitvoering van de
      [artikelen 2][ref1], [3][ref2] en [4][ref3] en van de kwaliteit van de zorg die hij in dat jaar heeft verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0007850#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007850#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0007850#Artikel4
    url: https://wetten.overheid.nl/BWBR0007850/2009-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007850
        artikel: '2'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0007850
        artikel: '3'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0007850
        artikel: '4'
        hoofdstuk: II
  - number: '5.2'
    text: 'In dat verslag geeft de zorgaanbieder daartoe onder meer aan:'
    url: https://wetten.overheid.nl/BWBR0007850/2009-07-01#Artikel5
  - number: 5.2.a
    text: of en, zo ja, op welke wijze hij patiënten of consumenten bij zijn kwaliteitsbeleid heeft betrokken;
    url: https://wetten.overheid.nl/BWBR0007850/2009-07-01#Artikel5
  - number: 5.2.b
    text: |-
      de frequentie waarmee en de wijze waarop binnen de instelling kwaliteitsbeoordeling plaatsvond en het resultaat
      daarvan;
    url: https://wetten.overheid.nl/BWBR0007850/2009-07-01#Artikel5
  - number: 5.2.c
    text: welk gevolg hij heeft gegeven aan klachten en meldingen over de kwaliteit van de verleende zorg.
    url: https://wetten.overheid.nl/BWBR0007850/2009-07-01#Artikel5
  - number: '5.3'
    text: Bij ministeriële regeling kunnen nadere regels worden vastgesteld met betrekking tot het verslag.
    url: https://wetten.overheid.nl/BWBR0007850/2009-07-01#Artikel5
  - number: '5.4'
    text: |-
      De zorgaanbieder zendt een afschrift van het verslag aan Onze Minister en aan de regionale inspecteur van het
      staatstoezicht op de volksgezondheid, alsmede aan de organisatie die in de regio de belangen van de patiënten in
      algemene zin behartigt.
    url: https://wetten.overheid.nl/BWBR0007850/2009-07-01#Artikel5
  - number: '6.1'
    text: |-
      Bij algemene maatregel van bestuur kunnen, indien het niveau van de zorg, verleend in een bij de maatregel
      aangewezen categorie van instellingen, dit vereist, regels worden gesteld met betrekking tot de uitvoering van de
      [artikelen 3][ref1] en [4][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007850#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0007850#Artikel4
    url: https://wetten.overheid.nl/BWBR0007850/2009-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0007850
        artikel: '3'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0007850
        artikel: '4'
        hoofdstuk: II
  - number: '6.2'
    text: |-
      Indien uitvoering van de [artikelen 3][ref1] en [4][ref2] overeenkomstig de op grond van het eerste lid gestelde
      regels niet blijkt te leiden tot verantwoorde zorg, kunnen bij algemene maatregel van bestuur tevens nadere regels
      worden gesteld met betrekking tot [artikel 2][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0007850#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0007850#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0007850#Artikel2
    url: https://wetten.overheid.nl/BWBR0007850/2009-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0007850
        artikel: '3'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0007850
        artikel: '4'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0007850
        artikel: '2'
        hoofdstuk: II
  - number: '7.1'
    text: |-
      Indien Onze Minister van oordeel is dat de [artikelen 2][ref1], [3][ref2], [4][ref3] of [5][ref4] niet of in
      onvoldoende mate of op onjuiste wijze worden nageleefd, kan hij de zorgaanbieder een schriftelijke aanwijzing
      geven.


      [ref1]: https://wetten.overheid.nl/BWBR0007850#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007850#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0007850#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0007850#Artikel5
    url: https://wetten.overheid.nl/BWBR0007850/2009-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0007850
        artikel: '2'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0007850
        artikel: '3'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0007850
        artikel: '4'
        hoofdstuk: II
      - id: ref4
        bwb_id: BWBR0007850
        artikel: '5'
        hoofdstuk: II
  - number: '7.2'
    text: |-
      In de aanwijzing geeft Onze Minister met redenen omkleed aan op welke punten de [artikelen 2][ref1], [3][ref2],
      [4][ref3] of [5][ref4] niet of in onvoldoende mate of op onjuiste wijze worden nageleefd, alsmede de in verband
      daarmee te nemen maatregelen.


      [ref1]: https://wetten.overheid.nl/BWBR0007850#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007850#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0007850#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0007850#Artikel5
    url: https://wetten.overheid.nl/BWBR0007850/2009-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0007850
        artikel: '2'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0007850
        artikel: '3'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0007850
        artikel: '4'
        hoofdstuk: II
      - id: ref4
        bwb_id: BWBR0007850
        artikel: '5'
        hoofdstuk: II
  - number: '7.3'
    text: Een aanwijzing bevat de termijn waarbinnen de zorgaanbieder er aan moet voldoen.
    url: https://wetten.overheid.nl/BWBR0007850/2009-07-01#Artikel7
  - number: '7.4'
    text: |-
      Indien het nemen van maatregelen in verband met gevaar voor de veiligheid of de gezondheid redelijkerwijs geen
      uitstel kan lijden, kan de ingevolge [artikel 8][ref1] met het toezicht belaste ambtenaar een schriftelijk bevel
      geven. Het bevel heeft een geldigheidsduur van zeven dagen, welke door Onze Minister kan worden verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0007850#Artikel8
    url: https://wetten.overheid.nl/BWBR0007850/2009-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0007850
        artikel: '8'
        hoofdstuk: IV
  - number: '7.5'
    text: |-
      De zorgaanbieder is verplicht binnen de daarbij gestelde termijn aan de aanwijzing onderscheidenlijk onmiddellijk
      aan het bevel te voldoen.
    url: https://wetten.overheid.nl/BWBR0007850/2009-07-01#Artikel7
  - number: 7a.1
    text: |-
      Het niet naleven van [artikel 4a, eerste lid][ref1], wordt gestraft met hechtenis van ten hoogste zes maanden of
      geldboete van de vierde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0007850#Artikel4a
    url: https://wetten.overheid.nl/BWBR0007850/2009-07-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0007850
        artikel: 4a
        hoofdstuk: II
  - number: 7a.2
    text: Het in het eerste lid strafbaar gestelde feit is een overtreding.
    url: https://wetten.overheid.nl/BWBR0007850/2009-07-01#Artikel7a
  - number: '8.1'
    text: |-
      Met het toezicht op de naleving van de bij de [artikelen 2][ref1], [3][ref2], [4][ref3], [4a][ref4] en [5][ref5]
      gestelde eisen onderscheidenlijk de krachtens [artikel 7][ref6] gegeven aanwijzingen of bevelen zijn belast
      de hoofdinspecteurs, de inspecteurs en de onder hun bevelen werkzame ambtenaren van het staatstoezicht op de
      volksgezondheid.


      [ref1]: https://wetten.overheid.nl/BWBR0007850#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007850#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0007850#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0007850#Artikel4a
      [ref5]: https://wetten.overheid.nl/BWBR0007850#Artikel5
      [ref6]: https://wetten.overheid.nl/BWBR0007850#Artikel7
    url: https://wetten.overheid.nl/BWBR0007850/2009-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0007850
        artikel: '2'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0007850
        artikel: '3'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0007850
        artikel: '4'
        hoofdstuk: II
      - id: ref4
        bwb_id: BWBR0007850
        artikel: 4a
        hoofdstuk: II
      - id: ref5
        bwb_id: BWBR0007850
        artikel: '5'
        hoofdstuk: II
      - id: ref6
        bwb_id: BWBR0007850
        artikel: '7'
        hoofdstuk: III
  - number: '8.2'
    text: |-
      De met het toezicht belaste ambtenaren zijn bevoegd, met medeneming van de benodigde apparatuur, een woning binnen
      te treden zonder toestemming van de bewoner, voor zover de woning deel uitmaakt van een instelling.
    url: https://wetten.overheid.nl/BWBR0007850/2009-07-01#Artikel8
  - number: '14'
    text: |-
      Onze Minister is bevoegd tot oplegging van een last onder bestuursdwang ter handhaving van de uit een krachtens
      [artikel 7, eerste of vierde lid][ref1], gegeven aanwijzing onderscheidenlijk bevel voortvloeiende verplichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0007850#Artikel7
    url: https://wetten.overheid.nl/BWBR0007850/2009-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0007850
        artikel: '7'
        hoofdstuk: III
  - number: '16'
    text: De Wet op de tandheelkundige inrichtingen wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0007850/2009-07-01#Artikel16
  - number: '17'
    text: De Wet tandheelkundige inrichtingen 1986 wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0007850/2009-07-01#Artikel17
  - number: '26'
    text: |-
      Onze Minister zendt binnen vijf jaar na de inwerkingtreding van deze wet aan de Staten-Generaal een verslag over de
      doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0007850/2009-07-01#Artikel26
  - number: '27'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de onderscheidene artikelen
      of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0007850/2009-07-01#Artikel27
  - number: '28'
    text: 'Deze wet wordt aangehaald als: Kwaliteitswet zorginstellingen.'
    url: https://wetten.overheid.nl/BWBR0007850/2009-07-01#Artikel28
