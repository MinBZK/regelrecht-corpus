  - number: 4b
    text: |-
      1 Onze Minister houdt een openbaar register bij van:

      a. instellingen waarin zorg wordt verleend als bedoeld in [artikel 1, eerste lid, onder a, 2°][ref1], en

      b. verpleeghuizen en verzorgingshuizen,

      een en ander voor zover zij niet zijn toegelaten ingevolge de [Wet toelating zorginstellingen][ref2].

      2 Een zorgaanbieder die een instelling exploiteert als bedoeld in het eerste lid, dient zich als zodanig te hebben
      gemeld bij Onze Minister voor inschrijving in het register. Onze Minister stelt regels over de wijze van melding.


      [ref1]: https://wetten.overheid.nl/BWBR0007850#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0018906
