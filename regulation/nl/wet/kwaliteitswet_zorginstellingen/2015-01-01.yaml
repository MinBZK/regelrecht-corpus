  - number: '5'
    text: |-
      1 De zorgaanbieder legt jaarlijks vóór 1 juni per instelling een verslag ter openbare inzage, waarin hij
      verantwoording aflegt van het beleid dat hij in het afgelopen kalenderjaar heeft gevoerd ter uitvoering van de
      [artikelen 2][ref1], [3][ref2] en [4][ref3] en van de kwaliteit van de zorg die hij in dat jaar heeft verleend.

      2 In dat verslag geeft de zorgaanbieder daartoe onder meer aan:

      a. of en, zo ja, op welke wijze hij patiënten of consumenten bij zijn kwaliteitsbeleid heeft betrokken;

      b. de frequentie waarmee en de wijze waarop binnen de instelling kwaliteitsbeoordeling plaatsvond en het resultaat
      daarvan;

      c. welk gevolg hij heeft gegeven aan klachten en meldingen over de kwaliteit van de verleende zorg.

      3 Bij ministeriële regeling kunnen nadere regels worden vastgesteld met betrekking tot het verslag.

      4 De zorgaanbieder zendt een afschrift van het verslag aan Onze Minister en aan de regionale inspecteur van het
      staatstoezicht op de volksgezondheid, alsmede aan de organisatie die in de regio de belangen van de patiënten in
      algemene zin behartigt.


      [ref1]: https://wetten.overheid.nl/BWBR0007850#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007850#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0007850#Artikel4
