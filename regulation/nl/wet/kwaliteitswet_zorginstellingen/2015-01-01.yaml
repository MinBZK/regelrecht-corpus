preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is om de wijze waarop de kwaliteit van zorg, verleend
    door instellingen, van overheidswege wordt gewaarborgd, ingrijpend te wijzigen en dat derhalve nieuwe regels moeten
    worden gesteld;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0007850/2015-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. zorg:

      1°. zorg als omschreven bij of krachtens de [Zorgverzekeringswet][ref1] en de [Wet langdurige zorg][ref2];

      2°. hulp waarbij handelingen worden verricht als bedoeld in
      [artikel 36 van de Wet op de beroepen in de individuele gezondheidszorg][ref3], die niet vallen onder zorg als
      bedoeld onder 1°;

      een en ander met uitzondering van bij algemene maatregel van bestuur aangewezen zorg;

      b. instelling: het organisatorisch verband dat strekt tot de verlening van zorg;

      c. zorgaanbieder:

      1°. de natuurlijke persoon of de rechtspersoon, die een instelling in stand houdt;

      2°. de natuurlijke personen of rechtspersonen, die gezamenlijk een instelling vormen;

      d. Onze Minister: Onze Minister van Volksgezondheid, Welzijn en Sport.

      2 Bij algemene maatregel van bestuur kan, indien het belang van de bevordering van de kwaliteit van zorg dit
      vereist, een vorm van hulp worden aangewezen als zorg in de zin van deze wet, met uitzondering van voorzieningen
      waarop de [Wet maatschappelijke ondersteuning 2015][ref4] van toepassing is.

      3 Niet als instelling wordt beschouwd het organisatorisch verband waarbinnen in het kader van de binnen een ander
      organisatorisch verband verleende zorg, een deel van die zorg wordt verleend.

      4 Indien het betreft een zorgaanbieder als bedoeld in het eerste lid, onder *c*, 2°, richten de uit deze wet
      voortvloeiende verplichtingen zich tot ieder van de in dat onderdeel bedoelde personen.


      [ref1]: https://wetten.overheid.nl/BWBR0018450
      [ref2]: https://wetten.overheid.nl/BWBR0035917
      [ref3]: https://wetten.overheid.nl/BWBR0006251#Artikel36
      [ref4]: https://wetten.overheid.nl/BWBR0035362
