    text: |-
      1 De zorgaanbieder biedt verantwoorde zorg aan. Onder verantwoorde zorg wordt verstaan zorg van goed niveau, die in
      ieder geval doeltreffend, doelmatig en patiëntgericht wordt verleend en die afgestemd is op de reële behoefte van
      de patiënt.

      2 Personen die de zorg verlenen handelen in overeenstemming met de op hen rustende verantwoordelijkheid,
      voortvloeiende uit de voor hen geldende professionele standaard, waaronder de overeenkomstig
      [artikel 66b van de Zorgverzekeringswet][ref1] in het openbaar register opgenomen voor hen geldende professionele
      standaard.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel66b
    url: https://wetten.overheid.nl/BWBR0007850/2015-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: 66b
  - number: '3'
    text: |-
      De zorgaanbieder organiseert de zorgverlening op zodanige wijze, voorziet de instelling zowel kwalitatief als
      kwantitatief zodanig van personeel en materieel, en draagt zorg voor een zodanige verantwoordelijkheidstoedeling,
      dat een en ander leidt of redelijkerwijs moet leiden tot een verantwoorde zorg. Hierbij betrekt hij de resultaten
      van overleg tussen zorgaanbieders, zorgverzekeraars en patiënten/consumentenorganisaties. Voor zover het betreft
      zorgverlening die verblijf van de patiënt of cliënt in de instelling gedurende tenminste het etmaal met zich
      brengt, draagt de zorgaanbieder er tevens zorg voor dat in de instelling geestelijke verzorging beschikbaar is, die
      zoveel mogelijk aansluit bij de godsdienst of levensovertuiging van de patiënten of cliënten.
    url: https://wetten.overheid.nl/BWBR0007850/2015-01-01#Artikel3
  - number: 3a
    text: |-
      1 De zorgaanbieder stelt voor zijn medewerkers een meldcode vast waarin stapsgewijs wordt aangegeven hoe met
      signalen van huiselijk geweld of kindermishandeling wordt omgegaan en die er redelijkerwijs aan bijdraagt dat zo
      snel en adequaat mogelijk hulp kan worden geboden.

      2 Onder huiselijk geweld wordt verstaan: huiselijk geweld als bedoeld in
      [artikel 1.1.1 van de Wet maatschappelijke ondersteuning 2015][ref1].

      3 Onder kindermishandeling wordt verstaan: kindermishandeling als bedoeld in [artikel 1.1 van de Jeugdwet][ref2].

      4 De zorgaanbieder bevordert de kennis en het gebruik van de meldcode.

      5 Bij of krachtens algemene maatregel van bestuur wordt vastgesteld uit welke elementen een meldcode in ieder geval
      bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel1.1.1
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel1.1
    url: https://wetten.overheid.nl/BWBR0007850/2015-01-01#Artikel3a
