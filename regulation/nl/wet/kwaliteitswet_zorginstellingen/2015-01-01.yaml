  - number: '9'
    text: |-
      1 Onze Minister is bevoegd een bestuurlijke boete van ten hoogste € 33 500,– op te leggen ter zake van een
      gedraging die in strijd is met het bepaalde bij of krachtens [artikel 4a][ref1], [4b, tweede lid][ref2], of
      [5][ref3].

      2 Een gedraging in strijd met [artikel 4a][ref4] is een strafbaar feit indien:

      a. in de daaraan voorafgaande 24 maanden tweemaal een bestuurlijke boete ter zake van een zelfde gedraging
      onherroepelijk is opgelegd; of

      b. de opzettelijke of roekeloze gedraging een direct gevaar voor de gezondheid of veiligheid van de mens tot gevolg
      heeft.

      3 Met hechtenis van ten hoogste zes maanden of geldboete van de vierde categorie wordt gestraft degene die een
      strafbaar feit pleegt als bedoeld in het tweede lid.

      4 Een strafbaar feit als bedoeld in het tweede lid is een overtreding.

      5 Onze Minister is bevoegd een last onder dwangsom op te leggen aan de betrokken beroepsbeoefenaar die geen
      medewerking verleent aan de inzage van patiëntendossiers, bedoeld in [artikel 7, derde lid][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0007850#Artikel4a
