  - number: '4'
    text: |-
      1 Het uitvoeren van [artikel 3][ref1] omvat mede de systematische bewaking, beheersing en verbetering van de
      kwaliteit van de zorg.

      2 Ter uitvoering van het eerste lid draagt de zorgaanbieder, afgestemd op de aard en omvang van de instelling,
      zorg voor:

      a. het op systematische wijze verzamelen en registreren van gegevens betreffende de kwaliteit van de zorg;

      b. het op een zodanige wijze registeren en verzamelen van de gegevens, bedoeld onder a, dat de gegevens voor
      eenieder vergelijkbaar zijn met gegevens van andere zorgaanbieders van dezelfde categorie;

      c. het aan de hand van de gegevens, bedoeld onder *a*, op systematische wijze toetsen in hoeverre de wijze van
      uitvoering van [artikel 3][ref2] leidt tot een verantwoorde zorgverlening;

      d. het op basis van de uitkomst van de toetsing, bedoeld onder c, zonodig veranderen van de wijze waarop
      [artikel 3][ref3] wordt uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0007850#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0007850#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0007850#Artikel3
