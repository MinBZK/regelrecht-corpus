  - number: 4a
    text: |-
      1 De zorgaanbieder meldt aan de ingevolge [artikel 8][ref1] met het toezicht belaste ambtenaar onverwijld:

      a. iedere calamiteit die in de instelling heeft plaatsgevonden;

      b. seksueel misbruik waarbij een patiënt of cliënt dan wel hulpverlener van de instelling is betrokken,
      uitgezonderd seksueel misbruik van hulpverleners onderling.

      2 Onder calamiteit wordt verstaan een niet-beoogde of onverwachte gebeurtenis, die betrekking heeft op de kwaliteit
      van de zorg en die tot de dood van of een ernstig schadelijk gevolg voor een patiënt of cliënt van de instelling
      heeft geleid.

      3 Onder seksueel misbruik wordt verstaan grensoverschrijdend seksueel gedrag waarbij sprake is van lichamelijk,
      geestelijk of relationeel overwicht.

      4 Onder hulpverlener wordt verstaan iedere medewerker van een instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0007850#Artikel8
