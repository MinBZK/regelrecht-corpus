  - number: '6'
    text: |-
      1 Bij algemene maatregel van bestuur kunnen, indien het niveau van de zorg, verleend in een bij de maatregel
      aangewezen categorie van instellingen, dit vereist, regels worden gesteld met betrekking tot de uitvoering van de
      [artikelen 3][ref1] en [4][ref2].

      2 Indien uitvoering van de [artikelen 3][ref3] en [4][ref4] overeenkomstig de op grond van het eerste lid gestelde
      regels niet blijkt te leiden tot verantwoorde zorg, kunnen bij algemene maatregel van bestuur tevens nadere regels
      worden gesteld met betrekking tot [artikel 2][ref5].


