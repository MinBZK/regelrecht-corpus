  - number: '10'
    text: |-
      Onze Minister is bevoegd een last onder bestuursdwang op te leggen ter zake van een gedraging die in strijd is met
      een krachtens de [artikelen 8][ref1] of [8a][ref2] gegeven aanwijzing of bevel.


