  - number: '7'
    text: |-
      1 Met het toezicht op de naleving van de bij of krachtens de [artikelen 2][ref1], [3][ref2], [3a][ref3],
      [4][ref4], [4a][ref5], [4b, tweede lid][ref6], en [5][ref7] gestelde eisen en een krachtens [artikel 8][ref8]
      gegeven aanwijzing of bevel zijn belast de ambtenaren van het Staatstoezicht op de volksgezondheid.

      2 De met het toezicht belaste ambtenaren zijn bevoegd, met medeneming van de benodigde apparatuur, een woning
      binnen te treden zonder toestemming van de bewoner, voor zover de woning deel uitmaakt van een instelling.

      3 De met het toezicht belaste ambtenaren zijn, voor zover dat voor de vervulling van hun taak noodzakelijk is en
      in afwijking van [artikel 5:20, tweede lid, van de Algemene wet bestuursrecht][ref9], bevoegd tot inzage van de
      patiëntendossiers. Voor zover de betrokken beroepsbeoefenaar uit hoofde van zijn beroep tot geheimhouding van het
      dossier verplicht is, geldt gelijke verplichting voor de betrokken ambtenaar.


