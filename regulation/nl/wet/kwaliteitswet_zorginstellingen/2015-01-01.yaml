  - number: '8'
    text: |-
      1 Indien Onze Minister van oordeel is dat [artikel 2][ref1], [3][ref2], [3a][ref3] of [4][ref4] niet of in
      onvoldoende mate of op onjuiste wijze wordt nageleefd, kan hij de zorgaanbieder een schriftelijke aanwijzing geven.

      2 In de aanwijzing geeft Onze Minister met redenen omkleed aan welke maatregelen de zorgaanbieder moet nemen met
      het oog op de naleving van [artikel 2][ref5], [3][ref6], [3a][ref7] of [4][ref8].

      3 De aanwijzing bevat de termijn waarbinnen de zorgaanbieder eraan moet voldoen.

      4 Indien het nemen van maatregelen in verband met gevaar voor de veiligheid of de gezondheid redelijkerwijs geen
      uitstel kan lijden, kan de ingevolge [artikel 7][ref9] met het toezicht belaste ambtenaar een schriftelijk bevel
      geven. Het bevel heeft een geldigheidsduur van zeven dagen, welke door Onze Minister kan worden verlengd.

      5 De zorgaanbieder is verplicht binnen de daarbij gestelde termijn aan de aanwijzing onderscheidenlijk onmiddellijk
      aan het bevel te voldoen.

      6 Mandaat tot het verlengen van de geldigheidsduur van een bevel wordt niet verleend aan een ambtenaar van het
      Staatstoezicht op de volksgezondheid.


