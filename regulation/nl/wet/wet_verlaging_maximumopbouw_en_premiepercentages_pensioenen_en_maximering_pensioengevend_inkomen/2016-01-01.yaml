preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is het fiscale kader voor pensioenen zodanig aan te
    passen dat bij 40 dienstjaren ten hoogste een ouderdomspensioen kan worden bereikt van 70% van het gemiddelde
    pensioengevend inkomen, met overeenkomstige aanpassing van het fiscale kader voor partner- en wezenpensioen, en
    voorts het pensioengevend inkomen te maximeren op € 100.000 alsmede het fiscale kader voor inkomensvoorzieningen in
    de inkomstenbelasting op overeenkomstige wijze aan te passen en bijbehorende aanpassingen in de Pensioenwet, de Wet
    verplichte beroepspensioenregeling en de Invoerings- en aanpassingswet Pensioenwet door te voeren;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0035183/2016-01-01#ArtikelAanhef
articles:
  - number: VI
    text: |-
      Het in [artikel I, onderdeel B, onder 1][ref1], laatstgenoemde bedrag wordt per 1 januari 2015 bij
      ministeriële regeling vervangen door een ander bedrag. Dit bedrag wordt berekend door het per 1 januari 2015 in
      [artikel 3.127, derde lid, van de Wet inkomstenbelasting 2001][ref2] eerstgenoemde bedrag, verminderd met het
      na toepassing van [artikel 10.1 van die wet][ref3] per 1 januari 2015 in artikel 3.127, derde lid, van die wet
      laatstgenoemde bedrag, te vermenigvuldigen met het na toepassing van [artikel 3.68, vierde lid, van die wet][ref4]
      per 1 januari 2015 in artikel 3.68, eerste lid, van die wet genoemde percentage en vervolgens de nodig geachte
      afronding aan te brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0035183#ArtikelI
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3.127
