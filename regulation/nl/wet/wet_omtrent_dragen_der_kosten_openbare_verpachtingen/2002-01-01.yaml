preamble:
  text: |-
    Wij WILHELMINA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of hooren lezen, salut! doen te weten:

    Alzoo Wij in overweging genomen hebben, dat het in het algemeen belang wenschelijk is, eene regeling vast
    te stellen omtrent het dragen der kosten van openbare verpachtingen en het uitloven van premiën bij openbare
    verkoopingen en verpachtingen;

    Zoo is het, dat Wij, den Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0001920/2002-01-01#ArtikelAanhef
articles:
  - number: '2'
    text: |-
      1 Het is verboden, bij eene openbare verkooping of openbare verpachting eenigerlei premie uit te loven of uit te
      keeren; met uitzondering van - voorzoover betreft eene openbare verkooping - strijkgeld. Onder strijkgeld wordt
      verstaan de premie in geld, welke wordt uitgeloofd voor dengeen, die bij eene openbare verkooping, in twee of meer
      zittingen of instantiën gehouden, bij de eerste zitting of instantie het hoogste bod voor een goed doet.

      2 Overtreding van dit verbod wordt gestraft met hechtenis van ten hoogste ééne maand of geldboete van de eerste
      categorie.

      3 Het strafbaar gestelde feit wordt beschouwd als eene overtreding.
    url: https://wetten.overheid.nl/BWBR0001920/2002-01-01#Artikel2
  - number: '3'
    text: Deze wet treedt in werking op een door Ons te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0001920/2002-01-01#Artikel3
