preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat met de eilandgebieden Bonaire, Sint Eustatius en Saba is overeengekomen
    dat zij een staatsrechtelijke positie krijgen binnen het Nederlandse staatsbestel en het in verband hiermee
    wenselijk is wetten en de Nederlands-Antilliaanse regelingen, die ingevolge de Invoeringswet BES als wet van
    toepassing blijven in de openbare lichamen Bonaire, Sint Eustatius en Saba, die nog niet zijn meegenomen in het
    voorstel voor de Aanpassingswet openbare lichamen Bonaire, Sint Eustatius en Saba (Kamerstukken II, 2008/09, 31
    959, nr. 2), aan te passen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0029250/2011-01-01#ArtikelAanhef
articles:
  - number: XIX
    text: |-
      1 Geneesmiddelen welke zijn ingeschreven in het register, bedoeld in
      [artikel 5, tweede lid, van de Wet op de geneesmiddelenvoorziening BES][ref1], zoals dat artikel
      luidde voor de inwerkingtreding van deze wet en die niet zijn vermeld in het register, bedoeld in
      [artikel 53 van de Geneesmiddelenwet][ref2], zijn uitgezonderd van het verbod in artikel 5, eerste lid, van de Wet
      op de geneesmiddelenvoorziening BES, zoals dat luidt na inwerkingtreding van deze wet.

      2 De uitzondering bedoeld in het eerste lid geldt tot het moment waarop de inschrijving zou
      moeten worden verlengd, maar maximaal tot vijf jaar na inwerkingtreding van het verbod in
      [artikel 5, eerste lid, van de Wet op de geneesmiddelenvoorziening BES][ref3], zoals dat luidt na inwerkingtreding
      van deze wet.

      3 Geneesmiddelen als bedoeld in het eerste lid en die ingevolge het tweede lid van
      [artikel 16 van de Wet op de geneesmiddelenvoorziening BES][ref4] zijn aangewezen, mogen niet anders dan op recept
      worden afgeleverd.


