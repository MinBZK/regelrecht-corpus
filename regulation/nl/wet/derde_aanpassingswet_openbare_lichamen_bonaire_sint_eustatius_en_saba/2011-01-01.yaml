  - number: XX
    text: |-
      1 Dit artikel is van toepassing in de openbare lichamen Bonaire, Sint Eustatius en Saba en verstaat onder:

      a. tijdstip van transitie: het tijdstip waarop
      __REF000___________________________________________________________________________________________________________
      _____ in werking treedt;

      b. het tijdstip van inwerkingtreding: het tijdstip waarop
      [artikel 18.4.1 van de Invoeringswet openbare lichamen Bonaire, Sint Eustatius en Saba][ref2] in werking treedt;

      c. overgangsperiode: de periode vanaf het tijdstip van transitie tot het tijdstip van inwerkingtreding.

      2 Tijdens de overgangsperiode worden de volgende wetten en daarop berustende bepalingen, zonodig in afwijking van
      wat op dat punt in die wetten en bepalingen is geregeld, uitgevoerd onder de verantwoordelijkheid van Onze Minister
      van Volksgezondheid, Welzijn en Sport:

      a. de [Wet ongevallenverzekering BES][ref3], voor zover het betreft de bepalingen inzake geneeskundige behandeling
      en verpleging;

      b. de [Wet ziekteverzekering BES][ref4], voor zover het betreft de bepalingen inzake geneeskundige behandeling
      en verpleging;

      c. de [Wet algemene verzekering bijzondere ziektekosten BES][ref5].

      3 Voor de toepassing van het tweede lid worden in de in dat lid genoemde wetten tijdens de overgangsperiode voor
      «de Minister van Volksgezondheid en Milieuhygiëne» gelezen «Onze Minister van Volksgezondheid, Welzijn en Sport».

      4 Indien noodzakelijk voor een goede uitvoering van de in het tweede lid genoemde wetten tijdens de
      overgangsperiode, wordt de tekst daarvan gelezen in het licht van de tekst van het Besluit zorgverzekering BES
      die genoemde wetten zal vervangen. De toepassing van de eerste zin leidt niet tot een uitkomst ten nadele van de
      belanghebbende.

      5 Bij ministeriële regeling kunnen nadere regels worden gesteld.


