    text: |-
      1 De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.

      2 [Artikel I, onderdelen DD, EE en FF][ref1], [artikel II, onderdelen A, B en C][ref2],
      en de [artikelen III][ref3], [V][ref4], [VII][ref5], [VIII][ref6], [IX][ref7],
      [XV][ref8], [XVI][ref9] en [XVII][ref10] werken terug tot het tijdstip waarop
