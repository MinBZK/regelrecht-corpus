preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het, in het licht van de maatschappelijke ontwikkelingen met betrekking
    tot onderhoudsvoorzieningen en spaarvormen, wenselijk is te komen tot een herziening van de belastingheffing ter
    zake van lijfrenten en kapitaalverzekeringen en voorts dat het wenselijk is te komen tot een herziening van het
    fiscale regime voor de instellingen waarbij dergelijke voorzieningen worden ondergebracht;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0005318/2004-01-01#ArtikelAanhef
articles:
  - number: III
    text: A. De Wet Belastingherziening 1950 (*Stb.* K423) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0005318/2004-01-01#ArtikelIII
  - number: VII
    text: |-
      1 Hetgeen is voldaan ter verkrijging van een stamrecht en heeft geleid tot een afneming als bedoeld in artikel
      44*f,* eerste lid, onderdeel *c*, van de Wet op de inkomstenbelasting 1964, zoals dat artikel luidde op 31 december
      1991, komt voor de toepassing van die wet niet in aanmerking als persoonlijke verplichtingen.

      2 Verzekeringen welke zijn gesloten na 31 december 1991 doch voor 1 juli 1992 en die niet aanstonds voldoen aan
      de voorwaarden welke zijn gesteld in de Wet op de inkomstenbelasting 1964, worden geacht vanaf de aanvang van de
      verzekering aan die voorwaarden te voldoen indien de verzekeringsovereenkomst voor 1 juli 1992, voor zover nodig
      met terugwerkende kracht tot het aangaan van de overeenkomst, alsnog aan die voorwaarden voldoet.
    url: https://wetten.overheid.nl/BWBR0005318/2004-01-01#ArtikelVII
  - number: VIIA
    text: |-
      1 Indien een lichaam ingevolge [artikel 5, onderdeel ][ref1] met ingang van 1 januari 1992 belastingplichtig is
      geworden voor de vennootschapsbelasting worden de verplichtingen die voortvloeien uit pensioenregelingen en de
      andere soortgelijke verplichtingen op de openingsbalans te boek gesteld voor de waarde in het economische verkeer.

      2 Indien de aanslag in de vennootschapsbelasting over 1992 reeds is vastgesteld, wordt het verschil tussen de
      waarde in het economische verkeer van de in het eerste lid bedoelde verplichtingen bij de aanvang van het eerste
      jaar van de belastingplicht van het lichaam en de waarde waarvoor deze verplichtingen op de openingsbalans te boek
      zijn gesteld, toegevoegd aan de winst van het oudste nog openstaande jaar. Tevens worden deze verplichtingen bij de
      aanvang van het oudste nog openstaande jaar te boek gesteld voor de waarde in het economische verkeer. Ingeval deze
      waarde afwijkt van de waarde op de balans aan het einde van het voorafgaande jaar wordt het verschil in aanmerking
      genomen bij het bepalen van de winst van het oudste nog openstaande jaar.

      3 Indien van het lichaam de vennootschapsbelasting na 31 december 1991 wordt geheven met toepassing van
      [artikel 15][ref2] of [15][ref3], zijn het eerste en tweede lid van overeenkomstige toepassing op de fiscale
      eenheid waartoe het lichaam behoort.

      4 Indien van het lichaam de vennootschapsbelasting na 31 december 1991 is geheven met toepassing van
      [artikel 15][ref4] of [15][ref5] en bij de aanvang van het oudste nog openstaande jaar die fiscale eenheid is
      verbroken met betrekking tot dat lichaam of met betrekking tot een lichaam waaraan binnen die fiscale eenheid
      verplichtingen als bedoeld in het eerste lid zijn overgedragen, is het tweede lid van overeenkomstige toepassing op
      het lichaam tot het vermogen waarvan de verplichtingen voor de verbreking het laatst hebben behoord.

      5 Indien het lichaam na 31 december 1991 op de voet van artikel 18 van Boek 2 van het Burgerlijk Wetboek is omgezet
      in een andere rechtsvorm of het vermogen van het lichaam als gevolg van een fusie op de voet van artikel 309 van
      Boek 2 van het Burgerlijk Wetboek onder algemene titel is overgegaan op een andere rechtspersoon, zijn de vorige
      leden van overeenkomstige toepassing op de andere rechtsvorm onderscheidenlijk de andere rechtspersoon.

      6 Hoofdstuk VA van de [Algemene wet inzake rijksbelastingen][ref6] vindt, voor wat betreft het in rekening brengen
      van heffingsrente, geen toepassing over het ingevolge dit artikel te betalen bedrag aan belasting.


