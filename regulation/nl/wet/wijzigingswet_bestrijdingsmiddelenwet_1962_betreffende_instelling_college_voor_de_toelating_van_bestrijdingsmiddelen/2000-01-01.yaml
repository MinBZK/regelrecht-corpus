preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die dit zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de Bestrijdingsmiddelenwet 1962 te wijzigen teneinde te
    voorzien in de instelling van een zelfstandig College voor de toelating van bestrijdingsmiddelen, dat zal beslissen
    omtrent de toelating van bestrijdingsmiddelen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0010004/2000-01-01#ArtikelAanhef
articles:
  - number: II
    text: |-
      1 Met ingang van de datum van inwerkingtreding van deze wet zijn de personeelsleden van het Ministerie van
      Landbouw, Natuurbeheer en Visserij, dienstonderdeel secretariaat van het college, van wie naam en functie zijn
      vermeld op een door Onze Minister van Landbouw, Natuurbeheer en Visserij vastgestelde lijst, van rechtswege
      ontslagen en aangesteld als ambtenaar in dienst van het college.

      2 De overgang van de in het eerste lid bedoelde personeelsleden vindt plaats in een rechtspositie die als geheel
      ten minste gelijkwaardig is aan die welke voor elk van hen gold bij het Ministerie van Landbouw, Natuurbeheer en
      Visserij.

      3 De aanspraken die een ambtenaar op wie het eerste lid van toepassing is, toekomen krachtens
      [artikel 24 van het Algemeen Rijksambtenarenreglement][ref1] vervallen op het tijdstip van inwerkingtreding van
      deze wet.

      4 De personen die op het tijdstip van inwerkingtreding van deze wet krachtens een arbeidsovereenkomst
      naar burgerlijk recht behoren tot het personeel van het Ministerie van Landbouw, Natuurbeheer en Visserij,
      dienstonderdeel secretariaat van het college, waarvan naam en functie zijn vermeld op een door Onze Minister van
      Landbouw, Natuurbeheer en Visserij vastgestelde lijst, zijn met ingang van dat tijdstip van rechtswege ontslagen en
      aangesteld in dienst van het college met een rechtspositie die als geheel ten minste gelijkwaardig is aan die welke
      voor elk van hen gold bij het Ministerie van Landbouw, Natuurbeheer en Visserij.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel24
    url: https://wetten.overheid.nl/BWBR0010004/2000-01-01#ArtikelII
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '24'
  - number: III
    text: |-
      1 Bezittingen, rechten en verplichtingen van de Staat der Nederlanden, die kennelijk zijn verworven,
      onderscheidenlijk aangegaan in verband met hetgeen het college tot taak verkrijgt, gaan voor zover zij zijn
      opgenomen in een door Onze Minister in overeenstemming met het college op te stellen lijst en voor zover nodig
      voorzien van in die lijst op te nemen garanties, vanaf de datum van inwerkingtreding van deze wet over op het
      college zonder dat daarvoor een nadere akte of betekening wordt gevorderd.

      2 Het college verkrijgt de door de Staat der Nederlanden aan haar toegescheiden bezittingen om niet.
    url: https://wetten.overheid.nl/BWBR0010004/2000-01-01#ArtikelIII
  - number: IV
    text: Bij de eerste samenstelling van het college geschiedt de benoeming van twee leden voor een periode van twee jaren.
    url: https://wetten.overheid.nl/BWBR0010004/2000-01-01#ArtikelIV
  - number: V
    text: |-
      Totdat de bedragen, gelden en vergoedingen zijn vastgesteld overeenkomstig [artikel 4b, eerste lid][ref1], blijven
      de door Onze betrokken Ministers vastgestelde bedragen, gelden en vergoedingen van kracht.


      [ref1]: https://wetten.overheid.nl/BWBR0002380#Artikel4b
    url: https://wetten.overheid.nl/BWBR0010004/2000-01-01#ArtikelV
    references:
      - id: ref1
        bwb_id: BWBR0002380
        artikel: 4b
  - number: VI
    text: |-
      Wettelijke procedures of rechtsgedingen waarbij Onze betrokken Minister dan wel de Staat optreedt in het kader
      van de uitvoering van de bij deze wet aan het college opgedragen taken, worden met ingang van de datum van
      inwerkingtreding van deze wet door het college overgenomen.
    url: https://wetten.overheid.nl/BWBR0010004/2000-01-01#ArtikelVI
  - number: VII
    text: |-
      Onze Minister zendt binnen drie jaar na inwerkingtreding van deze wet, en vervolgens telkens na vier jaar aan de
      Staten-Generaal een verslag over de doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0010004/2000-01-01#ArtikelVII
  - number: VIII
    text: |-
      Archiefbescheiden van het dienstonderdeel secretariaat van het college gaan met ingang van de datum van
      inwerkingtreding van deze wet over naar het college, voor zover zij niet overeenkomstig de [Archiefwet 1995][ref1]
      zijn overgebracht naar een archiefbewaarplaats.


      [ref1]: https://wetten.overheid.nl/BWBR0007376
    url: https://wetten.overheid.nl/BWBR0010004/2000-01-01#ArtikelVIII
    references:
      - id: ref1
        bwb_id: BWBR0007376
  - number: X
    text: |-
      De tekst van de [Bestrijdingsmiddelenwet 1962][ref1] wordt door Onze Minister van Justitie in het Staatsblad
      geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0002380
    url: https://wetten.overheid.nl/BWBR0010004/2000-01-01#ArtikelX
    references:
      - id: ref1
        bwb_id: BWBR0002380
  - number: XI
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen
      of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0010004/2000-01-01#ArtikelXI
