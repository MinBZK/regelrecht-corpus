  - number: '4.9'
    text: |-
      1 De subsidieontvanger dient vanaf de datum waarop de waterstofproductie-installatie in gebruik is genomen tot aan
      de subsidievaststelling, telkens één keer per twee kalenderjaren een voortgangsverslag in bij de Minister over de
      voortgang van de productie van de waterstof.

      2 Een voorgangsverslag bevat:

      a. een beschrijving van de ervaringen met het produceren van waterstof met de waterstofproductie-installatie;

      b. gegevens over de hernieuwbaarheid van de elektriciteit die is ingezet voor het produceren van waterstof;

      c. monitorgegevens over de productie van waterstof en over het onderhoud en de eventuele uitval van de
      waterstofproductie-installatie.
    url: https://wetten.overheid.nl/BWBR0048664/2024-01-01#Artikel4.9
  - number: '4.10'
    text: |-
      De Minister kan de voortgangsverslagen, bedoeld in de [artikelen 4.6][ref1] en [4.9][ref2], en het eindverslag,
      bedoeld in [artikel 4.7][ref3], gebruiken voor openbare, brede verspreiding van de niet-bedrijfsgevoelige kennis en
      informatie die zijn opgedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0048664#Artikel4.6
      [ref2]: https://wetten.overheid.nl/BWBR0048664#Artikel4.9
      [ref3]: https://wetten.overheid.nl/BWBR0048664#Artikel4.7
