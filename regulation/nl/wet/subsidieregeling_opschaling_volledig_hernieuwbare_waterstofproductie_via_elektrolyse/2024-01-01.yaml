        artikel: '2.4'
        paragraaf: '2'
  - number: '3.11'
    text: |-
      1 De Minister beslist afwijzend op een aanvraag voor subsidie indien:

      a. de aanvraag niet voldoet aan de bij deze regeling gestelde bepalingen;

      b. de elektrolyser al eerder in gebruik is geweest;

      c. de aangevraagde periode die het exploitatiesubsidiedeel zal beslaan, korter is dan zeven of langer dan vijftien
      achtereenvolgende, hele jaren;

      d. het onaannemelijk is dat de waterstofproductie-installatie in gebruik wordt genomen binnen vier jaar na
      subsidieverlening;

      e. het onaannemelijk is dat de waterstofproductie-installatie in de hele periode die het exploitatiesubsidiedeel
      beslaat, in gebruik is;

      f. het onaannemelijk is dat de realisatie of exploitatie van de waterstofproductie-installatie:

      1°. uitvoerbaar is;

      2°. technisch haalbaar is;

      3°. financieel haalbaar is;

      4°. economisch haalbaar is;

      g. het onaannemelijk is dat zal worden voldaan aan de eisen die gelden om waterstof als volledig hernieuwbaar aan
      te merken, bedoeld in [artikel 2.3][ref1];

      h. het onaannemelijk is dat de broeikasgasemissiereductie van het totaal aan de geproduceerde hernieuwbare
      waterstof en waterstof die niet volledig hernieuwbaar is samen ten minste 70% bedraagt gedurende de periode die het
      exploitatiesubsidiedeel beslaat, in het geval ook waterstof zal worden geproduceerd die niet volledig hernieuwbaar
      is;

      i. één of meer vergunningen die zijn vereist op grond van [artikel 3.5][ref2] niet zijn verleend;

      j. onomkeerbare investeringsverplichtingen voor de realisatie van de waterstofproductie-installatie zijn aangegaan
      voor de datum waarop de aanvraag is ingediend;

      k. met de in het projectplan opgenomen activiteiten is gestart voor de datum waarop de aanvraag is ingediend;

      l. het aannemelijk is dat realisatie of exploitatie van de waterstofproductie-installatie ook zonder belangrijke
      vertraging zouden worden verricht zonder de subsidie;

      m. de financiële haalbaarheid van de realisatie of exploitatie van de waterstofproductie-installatie afhankelijk is
      van andere, nog te verkrijgen subsidies;

      n. op grond van het [Besluit stimulering duurzame energieproductie en klimaattransitie][ref3] al subsidie is
      verstrekt voor de productie van waterstof met de waterstofproductie-installatie;

      o. het aangevraagde subsidiebedrag in € per kg te produceren volledig hernieuwbare waterstof hoger is dan € 9/kg.

      2 Het aangevraagde subsidiebedrag in € per kg te produceren volledig hernieuwbare waterstof, bedoeld in het eerste
      lid, onderdeel o, wordt berekend met de formule:

      aangevraagd subsidiebedrag = (aangevraagde investeringssubsidiebedrag in € : aangevraagde totale hoeveelheid te
      produceren volledig hernieuwbare waterstof in kg in de periode die het exploitatiesubsidiedeel zal beslaan) +
      (aangevraagde productieprijs van volledig hernieuwbare waterstof in € per kg – € 1,7600 per kg waterstof).


      [ref1]: https://wetten.overheid.nl/BWBR0048664#Artikel2.3
      [ref2]: https://wetten.overheid.nl/BWBR0048664#Artikel3.5
      [ref3]: https://wetten.overheid.nl/BWBR0022735
