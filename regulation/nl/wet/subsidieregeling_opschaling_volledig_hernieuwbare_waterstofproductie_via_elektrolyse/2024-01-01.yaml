        bwb_id: BWBR0032573
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002629
        artikel: '1'
  - number: '4.8'
    text: |-
      1 De subsidieontvanger zendt de Minister binnen een jaar na de datum waarop de waterstofproductie-installatie
      in gebruik is genomen of op verzoek van de Minister, voor het bepalen of de totale verleende overheidssteun meer
      bedraagt dan is toegestaan op grond van de verplichtingen die voor de Staat gelden krachtens een verdrag, bedoeld
      in [artikel 3.12][ref1]:

      a. een opgave van de gemaakte kosten van de realisatie van de waterstofproductie-installatie;

      b. een overzicht van de al ontvangen inkomsten, waaronder de al verstrekte subsidies op grond van een
      andere regeling dan op grond van deze regeling en overige steun, voor de realisatie of de exploitatie van de
      waterstofproductie-installatie;

      c. een overzicht van de nog te ontvangen inkomsten, waaronder nog te verstrekken subsidies op grond van een
      andere regeling dan op grond van deze regeling en overige steun, voor de realisatie of de exploitatie van de
      waterstofproductie-installatie;

      d. een overzicht van de overige kosten en baten van de exploitatie van de waterstofproductie-installatie;

      e. een nader vast te stellen product van een accountant als bedoeld in
      [artikel 1 van de Wet op het accountantsberoep][ref2].

      2 De gegevens, bedoeld in het eerste lid, worden verstrekt met gebruikmaking van een middel dat door de
      Minister beschikbaar wordt gesteld, waarbij het nader vast te stellen product, bedoeld in onderdeel e,
      wordt opgesteld met gebruikmaking van een model dat door de Minister ter beschikking wordt gesteld, en
      dat in ieder geval een opgave van de investeringskosten die zijn gemaakt en betaald, een opgave van de
      verstrekte overige subsidies en steun en informatie over de in aftrek te brengen omzetbelasting, bedoeld in
      [artikel 1 van de Wet op de omzetbelasting 1968][ref3] bevat.

      3 De Minister kan de termijn van een jaar, bedoeld in het eerste lid, op verzoek van de subsidieontvanger één keer
      verlengen met ten minste zes weken en ten hoogste drie maanden.

      4 De subsidieontvanger meldt wijzigingen van de al ontvangen en de nog te ontvangen inkomsten, bedoeld in het
      eerste lid, onderdelen b en c, die van invloed kunnen zijn op hoogte van de totale verleende overheidssteun, aan
      de Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0048664#Artikel3.12
      [ref2]: https://wetten.overheid.nl/BWBR0032573#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0002629#Artikel1
    url: https://wetten.overheid.nl/BWBR0048664/2024-01-01#Artikel4.8
