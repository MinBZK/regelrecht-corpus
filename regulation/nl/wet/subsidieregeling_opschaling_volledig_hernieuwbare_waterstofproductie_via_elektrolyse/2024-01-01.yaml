  - number: '3.4'
    text: |-
      1 Bij een aanvraag voor subsidie wordt vermeld:

      a. het nominale elektrische inputvermogen van de elektrolyser;

      b. het investeringssubsidiebedrag;

      c. het maximum exploitatiesubsidiebedrag;

      d. de totale hoeveelheid te produceren volledig hernieuwbare waterstof in kg in de periode die het
      exploitatiesubsidiedeel zal beslaan;

      e. de totale hoeveelheid te produceren waterstof die niet volledig hernieuwbaar is in kg in de periode die het
      exploitatiesubsidiedeel zal beslaan;

      f. de productieprijs van volledig hernieuwbare waterstof.

      2 De aanvraag gaat vergezeld van de technische specificatie van de leverancier van de elektrolyser waarop het
      nominale elektrische inputvermogen van de elektrolyser is aangegeven.
    url: https://wetten.overheid.nl/BWBR0048664/2024-01-01#Artikel3.4
  - number: '3.5'
    text: |-
      1 De aanvraag voor subsidie gaat vergezeld van de vergunningen die krachtens de [Omgevingswet][ref1] noodzakelijk
      zijn voor de waterstofproductie-installatie.

      2 Indien sprake is van een direct gekoppelde waterstofproductie-installatie of dubbelgekoppelde waterstofproductie-
      installatie, gaat de aanvraag vergezeld van de vergunning die voor een productie-installatie voor de productie van
      hernieuwbare elektriciteit uit wind- of zonne-energie krachtens de [Omgevingswet][ref2] noodzakelijk is, tenzij die
      productie-installatie al gebouwd is op de datum waarop de aanvraag is ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0037885
      [ref2]: https://wetten.overheid.nl/BWBR0037885
    url: https://wetten.overheid.nl/BWBR0048664/2024-01-01#Artikel3.5
    references:
