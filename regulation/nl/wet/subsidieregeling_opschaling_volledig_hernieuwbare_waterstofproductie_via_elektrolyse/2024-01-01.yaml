  - number: '3.12'
    text: |-
      De Minister kan al ontvangen of genoten overheidssteun of in de toekomst te ontvangen of te genieten overheidssteun
      voor de realisatie van de waterstofproductie-installatie of voor de productie van volledig hernieuwbare waterstof
      in mindering brengen op de subsidie die op grond van deze regeling wordt verstrekt, indien die steun er toe leidt
      dat de totale voor de waterstofproductie-installatie verleende overheidssteun meer bedraagt dan is toegestaan op
      grond van de verplichtingen die voor de Staat gelden krachtens een verdrag.
    url: https://wetten.overheid.nl/BWBR0048664/2024-01-01#Artikel3.12
  - number: '3.13'
    text: |-
      De Minister maakt binnen zes maanden na de subsidieverlening de informatie bekend over de steunverlening, bedoeld
      in paragraaf 3.2.1.14, onderdeel 58, aanhef en subonderdeel b, van de Richtsnoeren staatssteun ten behoeve van
      klimaat, milieubescherming en energie 2022 (PbEU 2022/C 80/01).
    url: https://wetten.overheid.nl/BWBR0048664/2024-01-01#Artikel3.13
  - number: '4.1'
    text: |-
      1 De subsidieontvanger is vanaf de datum van ingebruikname van de waterstofproductie-installatie tot aan de datum
      van de beschikking tot subsidievaststelling in het bezit van een geldig certificaat dat aantoont dat:

      a. de waterstofproductie-installatie zodanig is ontworpen en de elektriciteits- en waterstofstromen zodanig worden
      gemeten en geadministreerd dat aantoonbaar volledig hernieuwbare waterstof kan worden geproduceerd;

      b. de te produceren waterstof als volledig hernieuwbaar kan worden aangemerkt als bedoeld in [artikel 2.3][ref1];
      en

      c. indien met de waterstofproductie-installatie ook waterstof die niet volledig hernieuwbaar is zal
      worden geproduceerd, de broeikasgasemissiereductie van het totaal aan te produceren volledig hernieuwbare
      waterstof en waterstof die niet volledig hernieuwbaar is samen tenminste 70% is overeenkomstig
      [artikel 2.2, eerste lid, onderdeel c][ref2].

      2 Indien door de Europese Commissie twee of meer vrijwillige nationale of internationale systemen voor hernieuwbare
      brandstoffen van niet-biologische oorsprong zijn erkend op basis van artikel 30, vierde lid, van [richtlijn (EU)
      2018/2001](32018L2001), is het certificaat opgesteld met een van deze vrijwillige nationale of internationale
      systemen.

      3 Indien door de Europese Commissie minder dan twee vrijwillige nationale of internationale systemen voor
      hernieuwbare brandstoffen van niet-biologische oorsprong zijn erkend op basis van artikel 30, vierde lid, van
      [richtlijn (EU) 2018/2001](32018L2001), is het certificaat opgesteld met een erkend vrijwillig nationaal of
      internationaal systeem voor hernieuwbare gasvormige brandstoffen van niet-biologische oorsprong of met een
      vrijwillig nationaal of internationaal systeem voor hernieuwbare brandstoffen van niet-biologische oorsprong dat de
      vaststellingsprocedure door de Europese Commissie, bedoeld in artikel 30, vierde en vijfde lid, van die richtlijn
      doorloopt.


      [ref1]: https://wetten.overheid.nl/BWBR0048664#Artikel2.3
      [ref2]: https://wetten.overheid.nl/BWBR0048664#Artikel2.2
    url: https://wetten.overheid.nl/BWBR0048664/2024-01-01#Artikel4.1
