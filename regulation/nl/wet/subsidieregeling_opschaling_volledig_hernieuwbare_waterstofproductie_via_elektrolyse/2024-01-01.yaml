  - number: '2.1'
    text: |-
      De Minister verstrekt op aanvraag aan een onderneming subsidie bestaande uit:

      a. een subsidiedeel voor de realisatie van een waterstofproductie-installatie; en

      b. een subsidiedeel voor de productie van volledig hernieuwbare waterstof met die waterstofproductie-installatie.
    url: https://wetten.overheid.nl/BWBR0048664/2024-01-01#Artikel2.1
  - number: '2.2'
    text: |-
      1 De subsidie wordt uitsluitend verstrekt indien:

      a. het nominale elektrische inputvermogen van de elektrolyser minimaal 0,5 MW en maximaal 50 MW is;

      b. de volledig hernieuwbare waterstof wordt geproduceerd door elektrolyse van water tot zuurstof en waterstof;

      c. de broeikasgasemissiereductie van het totaal aan de geproduceerde volledig hernieuwbare waterstof en waterstof
      die niet volledig hernieuwbaar is samen ten minste 70% is gedurende de periode die het exploitatiesubsidiedeel
      beslaat in het geval ook waterstof die niet volledig hernieuwbaar is, wordt geproduceerd; en

      d. de waterstofproductie-installatie:

      1°. met een directe lijn is gekoppeld aan een productie-installatie voor de productie van hernieuwbare
      elektriciteit uit wind- of zonne-energie;

      2°. met een aansluiting is gekoppeld aan het elektriciteitsnet; of

      3°. zowel met een directe lijn is gekoppeld aan een productie-installatie voor de productie van hernieuwbare
      elektriciteit uit wind- of zonne-energie als met een aansluiting is gekoppeld aan het elektriciteitsnet.

      2 Bij het aantonen dat wordt voldaan aan het eerste lid, onderdeel c, is voor de subsidieontvanger gedelegeerde
      [verordening (EU) 2023/1185](33085R2023) van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0048664/2024-01-01#Artikel2.2
  - number: '2.3'
    text: |-
      1 Indien de subsidie wordt verstrekt voor een direct gekoppelde waterstofproductie-installatie, wordt de
      geproduceerde waterstof voor de toepassing van deze regeling als volledig hernieuwbaar aangemerkt indien de
      subsidieontvanger voldoet aan de artikelen 3 en 8 van gedelegeerde [verordening (EU) 2023/1184](33084R2023).

      2 Indien de subsidie wordt verstrekt voor een netgekoppelde waterstofproductie-installatie, wordt de geproduceerde
      waterstof voor de toepassing van deze regeling als volledig hernieuwbaar aangemerkt indien de subsidieontvanger:

      a. voldoet aan de artikelen 4 tot en met 8, 10 en 11 van gedelegeerde [verordening (EU) 2023/1184](33084R2023),
      waarbij de hernieuwbare stroomafnameovereenkomsten, bedoeld in de artikelen 5, 6 en 7, van die verordening
      betrekking hebben op de levering van hernieuwbare elektriciteit uit wind- of zonne-energie; en

      b. beschikt over het bewijs van afboeking van garanties van oorsprong voor duurzame elektriciteit.

      3 Indien de subsidie wordt verstrekt voor een dubbelgekoppelde waterstofproductie-installatie, wordt de
      geproduceerde waterstof voor de toepassing van deze regeling als volledig hernieuwbaar aangemerkt indien de
      subsidieontvanger:

      a. voldoet aan de artikelen 3 tot en 8, 10 en 11 van gedelegeerde [verordening (EU) 2023/1184](33084R2023), waarbij
      de hernieuwbare stroomafnameovereenkomsten, bedoeld in de artikelen 5, 6 en 7, van die verordening betrekking
      hebben op de levering van hernieuwbare elektriciteit uit wind- of zonne-energie; en

      b. beschikt over het bewijs van afboeking van garanties van oorsprong voor duurzame elektriciteit.

      4 De garanties van oorsprong voor duurzame elektriciteit, bedoeld in het tweede lid, onderdeel b, en derde lid,
      onderdeel b, zijn uitgegeven voor productie-installaties voor de productie van hernieuwbare elektriciteit uit wind-
      of zonne-energie waarvoor hernieuwbare stroomafnameovereenkomsten als bedoeld in het tweede lid, onderdeel a, en
      derde lid, onderdeel a, zijn getekend.
    url: https://wetten.overheid.nl/BWBR0048664/2024-01-01#Artikel2.3
  - number: '2.4'
    text: |-
      1 Het subsidieplafond bedraagt € 245.600.000.

      2 Een aanvraag voor subsidie kan worden ingediend in de periode van donderdag 30 november 2023, 9:00 uur, tot
      donderdag 14 december 2023, 17:00 uur.

      3 Per adres, of bij het ontbreken daarvan per kadastrale aanduiding, waarop de waterstofproductie-installatie wordt
      geplaatst, kan in de periode, bedoeld in het tweede lid, ten hoogste één aanvraag voor subsidie worden ingediend.
    url: https://wetten.overheid.nl/BWBR0048664/2024-01-01#Artikel2.4
  - number: '3.1'
    text: |-
      1 De Minister verdeelt het subsidieplafond in de volgorde van rangschikking van de aanvragen voor subsidie waarop
      niet met toepassing van [artikel 3.11][ref1] afwijzend wordt beslist.

      2 De rangschikking vindt plaats op rangschikkingsbedrag waarbij geldt dat hoe lager het rangschikkingsbedrag van
      een aanvraag is, hoe hoger de aanvraag wordt gerangschikt, met inachtneming van het derde tot en met zesde lid.

      3 Indien de hoogst gerangschikte aanvraag een direct gekoppelde waterstofproductie-installatie of een
      dubbelgekoppelde waterstofproductie-installatie betreft, is de tweede aanvraag in de rangschikking de aanvraag die
      het laagste rangschikkingsbedrag heeft van de aanvragen voor netgekoppelde waterstofproductie-installaties.

      4 Indien de hoogst gerangschikte aanvraag een netgekoppelde waterstofproductie-installatie betreft, is de tweede
      aanvraag in de rangschikking de aanvraag die het laagste rangschikkingsbedrag heeft van alle aanvragen voor direct
      gekoppelde waterstofproductie-installaties en alle aanvragen voor dubbelgekoppelde waterstofproductie-installaties.

      5 Indien blijkt dat twee of meer aanvragen in aanmerking komen als eerste of tweede in de rangschikking, bedoeld in
      het derde of vierde lid, stelt de Minister de onderlinge rangschikking van deze aanvragen vast met loting.

      6 Op het moment dat het subsidieplafond zou worden overschreden door honorering van twee of meer aanvragen met
      hetzelfde rangschikkingsbedrag, stelt de Minister de onderlinge rangschikking van deze aanvragen vast met loting.


      [ref1]: https://wetten.overheid.nl/BWBR0048664#Artikel3.11
    url: https://wetten.overheid.nl/BWBR0048664/2024-01-01#Artikel3.1
