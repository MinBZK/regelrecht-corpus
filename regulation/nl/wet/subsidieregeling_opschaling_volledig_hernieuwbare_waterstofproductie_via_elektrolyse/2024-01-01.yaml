  - number: '3.10'
    text: |-
      1 De Minister beslist op een aanvraag voor subsidie binnen dertien weken na de laatste dag van de periode voor het
      aanvragen van de subsidie, genoemd in [artikel 2.4, tweede lid][ref1].

      2 De termijn van dertien weken kan eenmaal met ten hoogste dertien weken worden verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0048664#Artikel2.4
    url: https://wetten.overheid.nl/BWBR0048664/2024-01-01#Artikel3.10
