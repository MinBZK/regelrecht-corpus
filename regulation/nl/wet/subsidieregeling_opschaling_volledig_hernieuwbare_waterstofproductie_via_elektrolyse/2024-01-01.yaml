  - number: '3.2'
    text: |-
      1 Het rangschikkingsbedrag, bedoeld in [artikel 3.1][ref1], is het aangevraagde subsidiebedrag in € per MW nominaal
      elektrisch inputvermogen van de elektrolyser.

      2 Het rangschikkingsbedrag wordt berekend met de formule:

      rangschikkingsbedrag = (investeringssubsidiebedrag in € + het maximum exploitatiesubsidiebedrag in €) : nominaal
      elektrisch inputvermogen van de elektrolyser.

      3 Bij het bepalen van het investeringssubsidiebedrag, bedoeld in het tweede lid, blijft een eventuele verhoging
      voor een kleine of middelgrote onderneming als bedoeld in [artikel 5.3, derde lid][ref2], buiten beschouwing.


      [ref1]: https://wetten.overheid.nl/BWBR0048664#Artikel3.1
      [ref2]: https://wetten.overheid.nl/BWBR0048664#Artikel5.3
