  text: |-
    Gelet op de artikelen 2, eerste lid, aanhef en onderdelen a, b en h, en 3 van de Kaderwet EZK- en LNV-subsidies;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0048664/2024-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In deze regeling wordt verstaan onder:

        - *aansluiting:* aansluiting als bedoeld in
      [artikel 1, eerste lid, onderdeel b, van de Elektriciteitswet 1998][ref1];
        - *directe lijn:* directe lijn als bedoeld in
      [artikel 1, eerste lid, onderdeel ar, van de Elektriciteitswet 1998][ref2];
        - *direct gekoppelde waterstofproductie-installatie:* waterstofproductie-installatie als bedoeld in
      [artikel 2.2, eerste lid, onderdeel d, subonderdeel 1°][ref3];
        - *dubbelgekoppelde waterstofproductie-installatie:* waterstofproductie als bedoeld in
      [artikel 2.2, eerste lid, onderdeel d, subonderdeel 3°][ref4];
        - *elektriciteitsnet:* net als bedoeld in [artikel 1, eerste lid, onderdeel i, van de Elektriciteitswet 1998][ref5];
        - *exploitatiesubsidiebedrag:* bedrag van het exploitatiesubsidiedeel overeenkomstig [artikel 6.4][ref6];
        - *exploitatiesubsidiedeel:* subsidiedeel als bedoeld [artikel 2.1, onderdeel b][ref7];
        - *garantie van oorsprong voor duurzame elektriciteit:* garantie van oorsprong voor duurzame elektriciteit als
      bedoeld in [artikel 1, eerste lid, onderdeel x, van de Elektriciteitswet 1998][ref8];
        - *garantie van oorsprong voor hernieuwbare waterstof:* garantie van oorsprong
      voor ander gas uit hernieuwbare bronnen, zijnde waterstof, als bedoeld in
      __REF008___________________________________________________________________________________________________________
      ___;
        - *investeringssubsidiebedrag:* bedrag van het investeringssubsidiedeel overeenkomstig de [artikelen 5.2][ref10]
      en [5.3][ref11];
        - *investeringssubsidiedeel:* subsidiedeel als bedoeld in [artikel 2.1, onderdeel a][ref12];
        - *kleine onderneming:* kleine onderneming als bedoeld in bijlage I bij [Verordening (EU) nr. 651/2014](32014R0651)
      van de Europese Commissie van 17 juni 2014 waarbij bepaalde categorieën steun op grond van de artikelen 107 en 108
      van het Verdrag met de interne markt verenigbaar worden verklaard;
        - *middelgrote onderneming:* middelgrote onderneming als bedoeld in bijlage I bij [Verordening (EU) nr. 651/2014]
      (32014R0651) van de Europese Commissie van 17 juni 2014 waarbij bepaalde categorieën steun op grond van de
      artikelen 107 en 108 van het Verdrag met de interne markt verenigbaar worden verklaard;
        - *Minister:* Minister voor Klimaat en Energie;
        - *netbeheerder:* netbeheerder als bedoeld in
      [artikel 1, eerste lid, onderdeel k, van de Elektriciteitswet 1998][ref13];
        - *netgekoppelde waterstofproductie-installatie:* waterstofproductie-installatie als bedoeld in
      [artikel 2.2, eerste lid, onderdeel d, subonderdeel 2°][ref14];
        - *nominaal elektrisch inputvermogen van de elektrolyser:* door de leverancier aangegeven maximale elektrische
      vermogen in MW van de elektrolyser dat onder nominale condities kan worden benut voor de productie van waterstof
      bij continu gebruik;
        - *onderneming:* iedere eenheid, ongeacht haar rechtsvorm of wijze van financiering, die een economische activiteit
      uitoefent;
        - *productieprijs van volledig hernieuwbare waterstof:* productieprijs van volledig hernieuwbare waterstof
      overeenkomstig [artikel 6.11][ref15];
        - *richtlijn (EU) 2018/2001:* [richtlijn (EU) 2018/2001](32018L2001) van het Europees Parlement en de Raad van
      11 december 2018 ter bevordering van het gebruik van energie uit hernieuwbare bronnen (PbEU 2018, L 328);
        - *gedelegeerde verordening (EU) 2023/1184:* gedelegeerde [verordening (EU) 2023/1184](33084R2023) van de Commissie
      van 10 februari 2023 ter aanvulling van [Richtlijn (EU) 2018/2001](32018L2001) van het Europees Parlement en
      de Raad door de bepaling van een gemeenschappelijke Uniemethode die voorziet in gedetailleerde regels voor de
      productie van hernieuwbare vloeibare en gasvormige transportbrandstoffen van niet-biologische oorsprong (PbEU
      L 157/11);
        - *gedelegeerde verordening (EU) 2023/1185:* gedelegeerde [verordening (EU) 2023/1185](33085R2023) van de Commissie
      van 10 februari 2023 tot aanvulling van [Richtlijn (EU) 2018/2001](32018L2001) van het Europees Parlement en de
      Raad door de vaststelling van een minimumdrempel voor broeikasgasemissiereducties door brandstoffen op basis van
      hergebruikte koolstof en door de methode te specificeren voor de beoordeling van broeikasgasemissiereducties door
      hernieuwbare vloeibare en gasvormige transportbrandstoffen van niet-biologische oorsprong en door brandstoffen op
      basis van hergebruikte koolstof (PbEU L 157/20);
        - *waterstofproductie-installatie:* productie-installatie voor het produceren van waterstof, bestaande uit een
      elektrolyser en de voor de productie van waterstof benodigde randapparatuur.


