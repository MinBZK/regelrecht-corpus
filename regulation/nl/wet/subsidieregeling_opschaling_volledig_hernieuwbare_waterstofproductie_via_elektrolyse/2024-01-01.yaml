  - number: '5.4'
    text: |-
      1 Als subsidiabele kosten komen uitsluitend de kosten in aanmerking die nodig zijn voor de realisatie van de
      waterstofproductie-installatie.

      2 Kosten die in ieder geval in aanmerking kunnen komen, zijn kosten van investeringen in:

      a. gronden en gebouwen;

      b. machines en apparatuur, waaronder batterijen met een maximaal vermogen van 1 MW per MW nominaal elektrisch
      inputvermogen van de elektrolyser en een maximale opslagcapaciteit van 2 MWh per MW nominaal elektrisch
      inputvermogen van de elektrolyser;

      c. een opslagvoorziening van de hoeveelheid waterstof in kg die de waterstofproductie-installatie in een periode
      van 24 uur kan produceren;

      d. materialen of hulpmiddelen;

      e. immateriële activa;

      f. aanleg van infrastructuur voor de verbinding van de waterstofproductie-installatie met het elektriciteitsnet en
      de waterstoftransportleidingen.

      3 De volgende kosten komen niet in aanmerking:

      a. kosten van omzetbelasting die de subsidieaanvrager in aftrek kan brengen;

      b. kosten die de subsidieaanvrager heeft gemaakt voordat de aanvraag voor subsidie is ingediend.
    url: https://wetten.overheid.nl/BWBR0048664/2024-01-01#Artikel5.4
  - number: '5.5'
    text: |-
      1 De kosten van realisatie van een stoommethaanreforminstallatie in € worden berekend met de formule:

      kosten stoommethaanreforminstallatie = (€ 327.500 x nominaal elektrisch inputvermogen van de elektrolyser) x
      (gemiddeld aantal verwachte jaarlijkse vollasturen voor volledig hernieuwbare waterstof van de waterstofproductie-
      installatie : 8.000)

      2 Het gemiddeld aantal verwachte jaarlijkse vollasturen, bedoeld in het eerste lid, wordt berekend met de formule:

      gemiddeld aantal verwachte jaarlijkse vollasturen = verwacht gemiddeld jaarlijks elektriciteitsverbruik van de
      elektrolyser in de periode die het exploitatiesubsidiedeel zal beslaan : nominaal elektrisch inputvermogen van
      de elektrolyser.
    url: https://wetten.overheid.nl/BWBR0048664/2024-01-01#Artikel5.5
  - number: '5.6'
    text: |-
      1 De Minister verstrekt ambtshalve voorschotten.

      2 De voorschotten worden telkens per kwartaal verstrekt voor de te maken kosten in dat kwartaal, waarbij:

      a. het eerste voorschot binnen twee weken na de start van de activiteiten wordt verstrekt; en

      b. de daaropvolgende voorschotten telkens binnen twee weken na de eerste dag van het kwartaal worden verstrekt.

      3 Als de start van de activiteiten, bedoeld in het tweede lid, onderdeel a, geldt:

      a. indien op de geplande startdatum, bedoeld in [3.3, tweede lid, onderdeel d, subonderdeel 1°][ref1], de
      beschikking tot subsidieverlening al is verzonden: de startdatum in het projectplan;

      b. indien op de geplande startdatum de beschikking tot subsidieverlening nog niet is verzonden: de dag na
      verzending van de beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0048664#Artikel3.3
    url: https://wetten.overheid.nl/BWBR0048664/2024-01-01#Artikel5.6
    references:
      - id: ref1
        bwb_id: BWBR0048664
        artikel: '3.3'
        paragraaf: '3'
  - number: '5.7'
    text: |-
      1 Een voorschot bedraagt 90% van het investeringssubsidiebedrag dat in het kwartaal voor subsidie in aanmerking
      komt en wordt berekend volgens de in de bijlage opgenomen werkwijze.

      2 Indien de gemaakte subsidiabele kosten tussen twee mijlpalen meer dan 25% afwijken van subsidiabele kosten die
      zijn opgenomen in de begroting, meldt de subsidieontvanger dit onverwijld aan de Minister.
    url: https://wetten.overheid.nl/BWBR0048664/2024-01-01#Artikel5.7
  - number: '5.8'
    text: |-
      1 Binnen dertien weken na ontvangst van het eindverslag, bedoeld in [artikel 4.7][ref1], stelt de Minister het
      geheel van verstrekte voorschotten bij aan de hand van het eindverslag.

      2 Indien blijkt dat het geheel van verstrekte voorschotten minder bedraagt dan 100% van de het
      investeringssubsidiebedrag, betaalt de Minister het te weinig betaalde bedrag binnen zes weken na de beschikking
      tot bijstelling van het voorschot aan de subsidieontvanger.

      3 Indien blijkt dat het geheel van verstrekte voorschotten meer bedraagt dan 100% van het
      investeringssubsidiebedrag, vordert de Minister het teveel betaalde voorschot terug.


      [ref1]: https://wetten.overheid.nl/BWBR0048664#Artikel4.7
    url: https://wetten.overheid.nl/BWBR0048664/2024-01-01#Artikel5.8
    references:
      - id: ref1
        bwb_id: BWBR0048664
        artikel: '4.7'
        paragraaf: '4'
  - number: '6.1'
    text: Deze paragraaf is van toepassing op het exploitatiesubsidiedeel.
    url: https://wetten.overheid.nl/BWBR0048664/2024-01-01#Artikel6.1
  - number: '6.2'
    text: |-
      In de beschikking tot subsidieverlening wordt in ieder geval opgenomen:

      a. de periode die het exploitatiesubsidiedeel beslaat;

      b. de productieprijs van volledig hernieuwbare waterstof;

      c. de totale hoeveelheid te produceren volledig hernieuwbare waterstof in kg in de periode die het
      exploitatiesubsidiedeel beslaat;

      d. de jaarlijkse gemiddelde hoeveelheid te produceren volledig hernieuwbare waterstof in kg, berekend met de
      formule:

      jaarlijkse gemiddelde hoeveelheid te produceren volledig hernieuwbare waterstof = totale hoeveelheid te produceren
      volledig hernieuwbare waterstof in kg, bedoeld in onderdeel c : periode die het exploitatiesubsidiedeel beslaat
      in kalenderjaren;

      e. de maandelijkse gemiddelde hoeveelheid te produceren volledig hernieuwbare waterstof in kg, berekend met de
      formule:

      maandelijkse gemiddelde hoeveelheid te produceren volledig hernieuwbare waterstof = jaarlijkse gemiddelde
      hoeveelheid te produceren volledig hernieuwbare waterstof, bedoeld in onderdeel d : 12.
    url: https://wetten.overheid.nl/BWBR0048664/2024-01-01#Artikel6.2
  - number: '6.3'
    text: |-
      De periode die het exploitatiesubsidiedeel beslaat, start op de datum van ingebruikname van de waterstofproductie-
      installatie.
    url: https://wetten.overheid.nl/BWBR0048664/2024-01-01#Artikel6.3
  - number: '6.4'
    text: |-
      1 Met het bedrag van het exploitatiesubsidiedeel wordt het verschil tussen de productieprijs van
      volledig hernieuwbare waterstof en de gemiddelde kosten van het produceren van waterstof met een
      stoommethaanreforminstallatie geheel of gedeeltelijk gecompenseerd.

      2 Het bedrag van het exploitatiesubsidiedeel is de som van de bedragen per kalenderjaar berekend over de periode
      die het exploitatiesubsidiedeel beslaat.

      3 Het bedrag per kalenderjaar, bedoeld in het eerste lid, wordt berekend volgens de formule:

      bedrag per kalenderjaar = (hoeveelheid geproduceerde volledig hernieuwbare waterstof in kg in dat kalenderjaar,
      inclusief de op grond van [artikel 6.7][ref1] aangemerkte volledig hernieuwbare waterstof uit een eerder
      kalenderjaar, tot ten hoogste de jaarlijkse gemiddelde hoeveelheid te produceren volledig hernieuwbare waterstof,
      inclusief de op grond van [artikel 6.6][ref2] toegevoegde te produceren volledig hernieuwbare waterstof) x
      (productieprijs van volledig hernieuwbare waterstof – definitieve correctiebedrag voor dat kalenderjaar).

      4 Indien de productieprijs van volledig hernieuwbare waterstof in een kalenderjaar lager is dan het voor dat
      kalenderjaar vastgestelde definitieve correctiebedrag, wordt voor dat kalenderjaar uitgegaan van een bedrag van
      € 0,00.

      5 Indien de periode die het exploitatiesubsidiedeel beslaat, start op een latere datum dan 1 januari of
      eindigt op een eerdere datum dan 31 december, bedraagt het bedrag per kalenderjaar voor het eerste kalenderjaar
      respectievelijk het laatste kalenderjaar van die periode een evenredig deel van dat kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0048664#Artikel6.7
      [ref2]: https://wetten.overheid.nl/BWBR0048664#Artikel6.6
    url: https://wetten.overheid.nl/BWBR0048664/2024-01-01#Artikel6.4
    references:
      - id: ref1
        bwb_id: BWBR0048664
        artikel: '6.7'
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0048664
        artikel: '6.6'
        paragraaf: '6'
  - number: '6.5'
    text: |-
      Het maximum exploitatiesubsidiebedrag wordt berekend volgens de formule:

      de totale hoeveelheid te produceren volledig hernieuwbare waterstof in kg in de periode die het
      exploitatiesubsidiedeel beslaat x (productieprijs van volledig hernieuwbare waterstof – € 1,7600 per kg waterstof).
    url: https://wetten.overheid.nl/BWBR0048664/2024-01-01#Artikel6.5
  - number: '6.6'
    text: |-
      1 Indien in een kalenderjaar minder kg volledig hernieuwbare waterstof is geproduceerd dan de jaarlijkse gemiddelde
      hoeveelheid te produceren volledig hernieuwbare waterstof, wordt de niet-geproduceerde kg volledig hernieuwbare
      waterstof toegevoegd aan de jaarlijkse gemiddelde hoeveelheid te produceren volledig hernieuwbare waterstof in een
      volgend kalenderjaar, om daarin het productietekort van volledig hernieuwbare waterstof en de gemiste subsidie in
      te halen.

      2 Indien de periode die het exploitatiedeel beslaat, start op een latere datum dan 1 januari, wordt voor het
      eerste kalenderjaar de niet-geproduceerde kg volledig hernieuwbare waterstof voor een evenredig deel van het eerste
      kalenderjaar toegevoegd aan de jaarlijkse gemiddelde hoeveelheid te produceren volledig hernieuwbare waterstof in
      een volgend kalenderjaar.

      3 Indien aannemelijk is dat na afloop van de periode die het exploitatiedeel van de subsidie beslaat minder kg
      volledig hernieuwbare waterstof zal zijn geproduceerd dan de totale hoeveelheid te produceren volledig hernieuwbare
      waterstof, verlengt de Minister, voordat de periode afloopt, op voorafgaand verzoek van de subsidieontvanger de
      periode met ten hoogste één jaar.

      4 De verlenging, bedoeld in het derde lid, eindigt na afloop van de verlenging of, indien dat eerder is, op het
      moment dat de totale hoeveelheid te produceren volledig hernieuwbare waterstof is geproduceerd.
    url: https://wetten.overheid.nl/BWBR0048664/2024-01-01#Artikel6.6
  - number: '6.7'
    text: |-
      Indien in een kalenderjaar meer kg volledig hernieuwbare waterstof is geproduceerd dan de jaarlijkse gemiddelde
      hoeveelheid te produceren volledig hernieuwbare waterstof, wordt die te veel geproduceerde kg tot een hoeveelheid
      van ten hoogste 25% van de jaarlijkse gemiddelde hoeveelheid te produceren volledig hernieuwbare waterstof
      aangemerkt als zijnde geproduceerd in een volgend kalenderjaar, indien in dat volgende kalenderjaar de hoeveelheid
      geproduceerde volledig hernieuwbare waterstof in kg lager is dan de jaarlijkse gemiddelde hoeveelheid te produceren
      volledig hernieuwbare waterstof, inclusief de op grond van [artikel 6.6][ref1] toegevoegde te produceren volledig
      hernieuwbare waterstof.


      [ref1]: https://wetten.overheid.nl/BWBR0048664#Artikel6.6
    url: https://wetten.overheid.nl/BWBR0048664/2024-01-01#Artikel6.7
    references:
      - id: ref1
        bwb_id: BWBR0048664
        artikel: '6.6'
        paragraaf: '6'
  - number: '6.8'
    text: |-
      1 De Minister verstrekt ambtshalve één keer per jaar een voorschot.

      2 Het voorschot wordt berekend met de volgende formule:

      voorschot = 100% x (jaarlijkse gemiddelde hoeveelheid te produceren volledig hernieuwbare waterstof) x
      (productieprijs van volledig hernieuwbare waterstof – voorlopig correctiebedrag voor dat kalenderjaar).

      3 Op verzoek van de subsidieontvanger kan de in een voorgaand kalenderjaar niet-geproduceerde kg volledig
      hernieuwbare waterstof, bedoeld in [artikel 6.6][ref1] worden toegevoegd aan de jaarlijkse gemiddelde hoeveelheid
      te produceren volledig hernieuwbare waterstof, bedoeld in het tweede lid.

      4 Indien de periode die het exploitatiesubsidiedeel beslaat, start op een latere datum dan 1 januari of eindigt op
      een eerdere datum dan 31 december, bedraagt het voorlopige voorschot voor het eerste kalenderjaar respectievelijk
      het laatste kalenderjaar van die periode een evenredig deel van dat kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0048664#Artikel6.6
    url: https://wetten.overheid.nl/BWBR0048664/2024-01-01#Artikel6.8
    references:
      - id: ref1
        bwb_id: BWBR0048664
        artikel: '6.6'
        paragraaf: '6'
  - number: '6.9'
    text: |-
      1 Het voorschot wordt in maandelijkse bedragen uitbetaald.

      2 Het maandelijkse bedrag wordt berekend volgens de formule:

      maandelijkse bedrag = 80% x (jaarlijkse gemiddelde hoeveelheid te produceren volledig hernieuwbare waterstof) x
      (productieprijs van volledig hernieuwbare waterstof – voorlopig correctiebedrag voor dat kalenderjaar)) : 12.

      3 Op verzoek van de subsidieontvanger kan de in een voorgaand kalenderjaar niet-geproduceerde kg volledig
      hernieuwbare waterstof, bedoeld in [artikel 6.6][ref1], worden toegevoegd aan de jaarlijkse gemiddelde hoeveelheid
      te produceren volledig hernieuwbare waterstof, bedoeld in het tweede lid.

      4 Indien de periode die het exploitatiesubsidiedeel beslaat, start op een latere datum dan 1 januari of eindigt op
      een eerdere datum dan 31 december, bedraagt het maandelijkse bedrag voor het eerste kalenderjaar respectievelijk
      het laatste kalenderjaar van die periode een evenredig deel van dat kalenderjaar.

      5 De Minister kan het maandelijkse bedrag herberekenen, indien:

      a. de subsidieontvanger een verzoek tot ontheffing bij essentiële wijzigingen als bedoeld in
      [artikel 4.4, tweede lid][ref2], heeft ingediend;

      b. de subsidieontvanger niet heeft voldaan aan de verplichting om gegevens te zenden voor het bepalen of totale
      verleende overheidssteun meer bedraagt dan is toegestaan op grond van de verplichtingen die voor de Staat gelden
      krachtens een verdrag, bedoeld in [artikel 4.8][ref3];

      c. gedurende twee maanden of meer tenminste 50% minder volledig hernieuwbare waterstof is of zal worden
      geproduceerd dan de maandelijkse gemiddelde hoeveelheid te produceren volledig hernieuwbare waterstof;

      d. in een kalenderjaar tenminste 20% minder volledig hernieuwbare waterstof is of zal worden geproduceerd dan de
      jaarlijkse gemiddelde hoeveelheid te produceren volledig hernieuwbare waterstof;

      e. de Minister na verlening van het eerste maandelijkse bedrag langer dan een maand geen meetgegevens, bedoeld in
      [artikel 5][ref4] of [artikel 9 van de Regeling garanties van oorsprong en certificaten van oorsprong][ref5], heeft
      ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0048664#Artikel6.6
      [ref2]: https://wetten.overheid.nl/BWBR0048664#Artikel4.4
