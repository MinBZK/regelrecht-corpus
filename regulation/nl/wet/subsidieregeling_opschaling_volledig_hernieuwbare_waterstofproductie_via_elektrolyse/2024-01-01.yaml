      - id: ref2
        bwb_id: BWBR0037885
  - number: '3.6'
    text: |-
      1 Een aanvraag voor subsidie gaat vergezeld van een haalbaarheidsstudie.

      2 De haalbaarheidsstudie bevat in ieder geval:

      a. een omschrijving van de waterstofproductie-installatie;

      b. een waterstofopbrengstberekening met de verwachte hoeveelheid te produceren volledig hernieuwbare en de
      verwachte hoeveelheid waterstof die niet volledig hernieuwbaar is per kalenderjaar in de periode die het
      exploitatiesubsidiedeel beslaat;

      c. een financieringsplan voor de investering in de waterstofproductie-installatie;

      d. inzicht in het eigen vermogen van de subsidieaanvrager;

      e. een exploitatieberekening met de verwachte kosten en opbrengsten van de waterstofproductie-installatie;

      f. een intentieverklaring van een financier voor de financiering van de investering in de waterstofproductie-
      installatie, indien:

      1°. het eigen vermogen, anders dan het aangevraagde investeringssubsidiedeel, minder dan 20% van de kosten van de
      investering in de waterstofproductie-installatie bedraagt; of

      2°. de subsidieaanvrager meer dan één aanvraag heeft ingediend in de periode voor het aanvragen van
      subsidie, genoemd in [artikel 2.4, tweede lid][ref1], en het eigen vermogen, anders dan het aangevraagde
      investeringssubsidiedeel, minder dan 20% van de totale kosten van de investeringen in de waterstofproductie-
      installaties bedraagt.

      3 De exploitatieberekening, bedoeld in het tweede lid, onderdeel e, bevat:

      a. een specificatie van de investeringskosten per component van de waterstofproductie-installatie;

      b. een overzicht van de kosten en baten van de exploitatie van de waterstofproductie-installatie, waarbij gedurende
      de periode die het exploitatiesubsidiedeel zal beslaan geen rekening wordt gehouden met toekomstige inkomsten uit
      hernieuwbare brandstofeenheden als bedoeld in [artikel 9.7.3.1, eerste lid, van de Wet milieubeheer][ref2];

      c. een berekening van het financiële rendement van de investering gedurende de levensduur van de
      waterstofproductie-installatie, waarbij wordt uitgegaan van een levensduur van ten hoogste vijftien jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0048664#Artikel2.4
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel9.7.3.1
