  - number: '4.5'
    text: |-
      De waterstofproductie-installatie wordt in stand gehouden in Nederland, de territoriale zee of binnen de
      Nederlandse exclusieve economische zone.
    url: https://wetten.overheid.nl/BWBR0048664/2024-01-01#Artikel4.5
  - number: '4.6'
    text: |-
      1 De subsidieontvanger dient tot de datum dat de waterstofproductie-installatie is gerealiseerd, telkens één
      keer per kalenderjaar een voortgangsverslag in bij de Minister over de voortgang van de realisatie van de
      waterstofproductie-installatie.

      2 Het voortgangsverslag bevat:

      a. een beschrijving van de ervaringen met de realisatie van de productie-installatie van waterstof;

      b. gegevens over de voortgang van de in het projectplan opgenomen activiteiten, inclusief de realisatie van de
      mijlpalen en het tijdschema.
    url: https://wetten.overheid.nl/BWBR0048664/2024-01-01#Artikel4.6
  - number: '4.7'
    text: |-
      1 De subsidieontvanger dient binnen dertien weken na de datum waarop de waterstofproductie-installatie in gebruik
      is genomen, een eindverslag in over de realisatie van de waterstofproductie-installatie.

      2 Het eindverslag gaat vergezeld van:

      a. een beschrijving van de ervaringen met de realisatie van de waterproductie-installatie;

      b. een gespecificeerde opgave van de gemaakte en betaalde subsidiabele kosten per component als opgenomen in de
      begroting, waarbij deze kosten zijn berekend en gestaafd met bewijsstukken;

      c. een overzicht van de ontvangen inkomsten, waaronder al verstrekte subsidies op grond van een andere regeling dan
      op grond van deze regeling en overige steun voor de realisatie van de waterstofproductie-installatie;

      d. een nader vast te stellen product van een accountant als bedoeld in
      [artikel 1 van de Wet op het accountantsberoep][ref1].

      3 Het nader vast te stellen product, bedoeld in het tweede lid, onderdeel d, wordt opgesteld met
      gebruikmaking van een model dat door de Minister ter beschikking wordt gesteld, en dat in ieder
      geval een opgave van de investeringskosten die zijn gemaakt en betaald, een opgave van de verstrekte
      overige subsidies en steun en informatie over de in aftrek te brengen omzetbelasting, bedoeld in
      [artikel 1 van de Wet op de omzetbelasting 1968][ref2] bevat.

      4 Indien het een directgekoppelde waterstofproductie-installatie of een dubbelgekoppelde waterstofproductie-
      installatie betreft, gaat het eindverslag vergezeld van hernieuwbare stroomafnameovereenkomsten voor wind- of
      zonne-energie voor de elektriciteit die gedurende de eerste vijf jaar zal worden gebruikt voor de productie van
      volledig hernieuwbare waterstof.

      5 Het eindverslag wordt ingediend met gebruikmaking van een middel dat door de Minister beschikbaar wordt gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0032573#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel1
    url: https://wetten.overheid.nl/BWBR0048664/2024-01-01#Artikel4.7
    references:
