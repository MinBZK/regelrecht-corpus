  - number: '6.11'
    text: |-
      1 De productieprijs van volledig hernieuwbare waterstof bestaat uit de som van de subsidiabele kosten van de
      realisatie van de waterstofproductie-installatie waarvoor geen subsidie is aangevraagd en de kosten van het
      produceren van volledig hernieuwbare waterstof.

      2 De productieprijs van volledig hernieuwbare waterstof bedraagt ten hoogste de uitkomst van de berekening volgens
      de formule:

      productieprijs van volledig hernieuwbare waterstof in € per kg = (subsidiabele kosten in € voor de realisatie van
      de waterstofproductie-installatie waarvoor geen investeringssubsidiedeel is verstrekt + kosten van het produceren
      van volledig hernieuwbare waterstof in € in de periode die het exploitatiedeel beslaat) : totale hoeveelheid te
      produceren volledig hernieuwbare waterstof in kg in de periode die het exploitatiesubsidiedeel beslaat.
    url: https://wetten.overheid.nl/BWBR0048664/2024-01-01#Artikel6.11
  - number: '6.12'
    text: |-
      1 De Minister stelt jaarlijks voor 1 april het definitieve correctiebedrag voor het voorgaande kalenderjaar vast.

      2 Het definitieve correctiebedrag bedraagt de som van:

      a. de gemiddelde kosten van het produceren van waterstof met een stoommethaanreforminstallatie over het voorgaande
      kalenderjaar;

      b. de waarde van de garanties van oorsprong voor hernieuwbare waterstof, omgerekend naar € per kg waterstof met de
      omrekenfactor 0,03932 MWh/kg; en

      c. de opbrengsten of vermeden kosten die voor de subsidieontvanger voortvloeien uit het systeem van verhandelbare
      broeikasgasemissierechten, bedoeld in [titel 16.2 van de Wet milieubeheer][ref1].

      3 Indien het definitieve correctiebedrag, bedoeld in het tweede lid, onderdeel a, lager is dan een bedrag van
      € 1,7600 per kg waterstof, wordt gerekend met dat bedrag in plaats van met de gemiddelde kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0048664/2024-01-01#Artikel6.12
    references:
      - id: ref1
        bwb_id: BWBR0003245
  - number: '6.13'
    text: |-
      1 De Minister stelt jaarlijks voor 1 november het voorlopige correctiebedrag vast voor het daaropvolgende
      kalenderjaar.

      2 Het voorlopige correctiebedrag bedraagt de som van:

      a. de gemiddelde kosten van het produceren van waterstof met een stoommethaanreforminstallatie in de periode van
      1 september tot en met 31 augustus voorafgaand aan het kalenderjaar waarvoor het voorlopige correctiebedrag wordt
      vastgesteld;

      b. de waarde van de garanties van oorsprong voor hernieuwbare waterstof, omgerekend naar € per kg waterstof met de
      omrekenfactor 0,03932 MWh/kg; en

      c. de opbrengsten of vermeden kosten die voor de subsidieontvanger voortvloeien uit het systeem van verhandelbare
      broeikasgasemissierechten, bedoeld in [titel 16.2 van de Wet milieubeheer][ref1].

      3 Indien het definitieve correctiebedrag, bedoeld in het tweede lid, onderdeel a, lager is dan een bedrag van
      € 1,7600 per kg waterstof, wordt gerekend met dat bedrag in plaats van met de gemiddelde kosten.

      4 Voor 2023 wordt het voorlopige correctiebedrag vastgesteld op:

      a. € 3,9895/kg waterstof voor gemiddelde kosten voor het produceren van waterstof met een
      stoommethaanreforminstallatie, bedoeld in het tweede lid, onderdeel a;

      b. € 0,0000/kg waterstof voor de waarde van de garanties van oorsprong voor hernieuwbare waterstof, bedoeld in het
      tweede lid, onderdeel b;

      c. € 0,0000/kg waterstof voor de opbrengsten of vermeden kosten die voor de subsidieontvanger voortvloeien uit het
      systeem van verhandelbare broeikasgasemissierechten, bedoeld in het tweede lid, onderdeel c.


