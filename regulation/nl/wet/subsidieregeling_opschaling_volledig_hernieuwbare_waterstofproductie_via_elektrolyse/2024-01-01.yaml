  - number: '5.3'
    text: |-
      1 Indien sprake is van een waterstofproductie-installatie waarvan het nominale elektrische inputvermogen van de
      elektrolyser groter is dan 0,5 MW en kleiner is dan 30 MW, bedraagt het investeringssubsidiebedrag:

      a. ten hoogste 40% van de som van de subsidiabele kosten van realisatie van de waterstofproductie-installatie,
      bedoeld in [artikel 5.2, eerste lid][ref1];

      b. indien voor de realisatie van de waterstofproductie-installatie al een subsidie is verstrekt op grond van
      een andere regeling dan op grond van deze regeling, ten hoogste 40% van de som van de subsidiabele kosten van
      realisatie van de waterstofproductie-installatie, bedoeld in [artikel 5.2, eerste lid][ref2], verminderd met
      de al verstrekte subsidie, met dien verstande dat in het geval de uitkomst van deze berekening negatief is, als
      investeringssubsidiebedrag € 0,00 wordt aangehouden.

      2 Indien sprake is van een waterstofproductie-installatie waarvan het nominale elektrische inputvermogen
      van de elektrolyser gelijk aan of groter is dan 30 MW en niet groter is dan 50 MW, bedraagt het
      investeringssubsidiebedrag:

      a. ten hoogste 40% van het verschil tussen de som van subsidiabele kosten van realisatie van de
      waterstofproductie-installatie en de kosten van realisatie van een stoommethaanreforminstallatie, bedoeld in
      [artikel 5.2, tweede lid][ref3];

      b. indien voor de realisatie van de waterstofproductie-installatie al een subsidie is verstrekt op grond van een
      andere regeling dan op grond van deze regeling, ten hoogste het verschil tussen:

      1°. 40% van het verschil tussen de som van subsidiabele kosten van realisatie van de waterstofproductie-installatie
      en de kosten van realisatie van een stoommethaanreforminstallatie, bedoeld in [artikel 5.2, tweede lid][ref4]; en

      2°. de al verstrekte subsidie, met dien verstande dat in het geval de uitkomst van deze berekening negatief is, als
      investeringssubsidiebedrag € 0,00 wordt aangehouden.

      3 Het percentage van 40%, genoemd in het eerste en tweede lid, wordt verhoogd met:

      a. 20 procentpunten indien de subsidieaanvrager een kleine onderneming is;

      b. 10 procentpunten indien de subsidieaanvrager een middelgrote onderneming is.


      [ref1]: https://wetten.overheid.nl/BWBR0048664#Artikel5.2
      [ref2]: https://wetten.overheid.nl/BWBR0048664#Artikel5.2
      [ref3]: https://wetten.overheid.nl/BWBR0048664#Artikel5.2
      [ref4]: https://wetten.overheid.nl/BWBR0048664#Artikel5.2
