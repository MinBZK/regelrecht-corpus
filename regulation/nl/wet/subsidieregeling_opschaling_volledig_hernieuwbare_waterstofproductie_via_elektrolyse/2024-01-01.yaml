  - number: '4.11'
    text: |-
      1 De subsidieontvanger deelt onverwijld de indiening bij de rechtbank van een verzoek tot faillietverklaring van
      hem, tot verlening van surseance van betaling aan hem of tot toepassing van de schuldsaneringsregeling natuurlijke
      personen over hem schriftelijk mee aan de Minister.

      2 De subsidieontvanger deelt onverwijld schriftelijk aan de Minister mee zodra het aannemelijk is dat niet, niet
      tijdig of niet geheel zal worden voldaan aan verplichtingen die aan de subsidie zijn verbonden.

      3 Indien voor de subsidieaanvrager opbrengsten of vermeden kosten gaan voortvloeien of niet meer voortvloeien uit
      het systeem van verhandelbare broeikasgasemissierechten, bedoeld in [titel 16.2 van de Wet milieubeheer][ref1],
      meldt hij dit onverwijld schriftelijk aan de Minister.

      4 De subsidieontvanger verstrekt op verzoek aan de Minister alle overige bescheiden, gegevens of inlichtingen die
      nodig zijn voor een beslissing over de subsidie.


      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0048664/2024-01-01#Artikel4.11
    references:
