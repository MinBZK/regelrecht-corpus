        bwb_id: BWBR0003245
  - number: '4.12'
    text: |-
      De subsidieontvanger verleent tot en met vijf jaar na de beschikking tot subsidievaststelling medewerking aan
      een evaluatie door de Minister van de doeltreffendheid en de effecten van de subsidie, voor zover medewerking
      redelijkerwijs van hem kan worden verlangd.
    url: https://wetten.overheid.nl/BWBR0048664/2024-01-01#Artikel4.12
  - number: '5.1'
    text: Deze paragraaf is van toepassing op het investeringssubsidiedeel.
    url: https://wetten.overheid.nl/BWBR0048664/2024-01-01#Artikel5.1
  - number: '5.2'
    text: |-
      1 Indien sprake is van een waterstofproductie-installatie waarvan het nominale elektrische inputvermogen van de
      elektrolyser groter is dan 0,5 MW en kleiner is dan 30 MW, is het bedrag van het investeringssubsidiedeel de som
      van de subsidiabele kosten van realisatie van de waterstofproductie-installatie, bedoeld in [artikel 5.4][ref1].

      2 Indien sprake is van een waterstofproductie-installatie waarvan het nominale elektrische inputvermogen
      van de elektrolyser gelijk aan of groter is dan 30 MW en niet groter is dan 50 MW, is het bedrag van
      het investeringssubsidiedeel het verschil tussen de som van subsidiabele kosten van realisatie van de
      waterstofproductie-installatie, bedoeld in [artikel 5.4][ref2], en de kosten van realisatie van een
      stoommethaanreforminstallatie, bedoeld in [artikel 5.5][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0048664#Artikel5.4
      [ref2]: https://wetten.overheid.nl/BWBR0048664#Artikel5.4
      [ref3]: https://wetten.overheid.nl/BWBR0048664#Artikel5.5
    url: https://wetten.overheid.nl/BWBR0048664/2024-01-01#Artikel5.2
    references:
