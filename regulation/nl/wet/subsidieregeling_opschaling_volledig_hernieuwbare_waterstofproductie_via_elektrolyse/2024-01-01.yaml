  - number: '3.7'
    text: |-
      1 Indien een aanvraag voor subsidie betrekking heeft op een waterstofproductie-installatie op een locatie waarvan
      de subsidieaanvrager niet de eigenaar is, gaat de aanvraag vergezeld van de toestemming van de eigenaar of
      eigenaren voor het plaatsen en in gebruik hebben van de waterstofproductie-installatie op die locatie gedurende de
      periode waarvoor subsidie wordt aangevraagd.

      2 De toestemming van de eigenaar of eigenaren wordt overgelegd met gebruikmaking van een middel dat door de
      Minister beschikbaar wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0048664/2024-01-01#Artikel3.7
  - number: '3.8'
    text: |-
      1 Een aanvraag voor subsidie voor een netgekoppelde waterstofproductie-installatie of een dubbelgekoppelde
      waterstofproductie-installatie gaat vergezeld van een verklaring van een netbeheerder over de beschikbaarheid van
      transportcapaciteit voor de waterstofproductie-installatie.

      2 De verklaring wordt overgelegd met gebruikmaking van een middel dat door de Minister beschikbaar wordt gesteld.

      3 De verklaring is niet langer dan drie maanden voorafgaand aan het indienen van de aanvraag afgegeven.
    url: https://wetten.overheid.nl/BWBR0048664/2024-01-01#Artikel3.8
  - number: '3.9'
    text: |-
      1 Een aanvraag gaat vergezeld van een verklaring dat de subsidieaanvrager ermee instemt dat de informatie over de
      waterstofproductie-installatie die hij bij de aanvraag heeft verstrekt en de informatie over de waterstofproductie-
      installatie die in de beschikking tot subsidieverlening is opgenomen, door de Minister wordt verstrekt aan:

      a. de door de Minister op grond van [artikel 74 van de Elektriciteitswet 1998][ref1] gemandateerde niet-
      ondergeschikte; en

      b. de op grond van
      __REF000___________________________________________________________________________________________________________
      ___ gemandateerde niet-ondergeschikte.

      2 De aanvraag gaat vergezeld van een verklaring dat de subsidieaanvrager ermee instemt
      dat de aan de Minister verstrekte meetgegevens, bedoeld in [artikel 5][ref3] of
      [artikel 9 van de Regeling garanties van oorsprong en certificaten van oorsprong][ref4], door de Minister worden
      gebruikt voor de berekeningen op grond van deze regeling.


