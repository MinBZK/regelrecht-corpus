  - number: '3.3'
    text: |-
      1 Een aanvraag voor subsidie wordt ingediend bij de Minister met gebruikmaking van een middel dat door de Minister
      beschikbaar wordt gesteld.

      2 De aanvraag bevat in ieder geval:

      a. de naam, het adres en het rekeningnummer van de subsidieaanvrager;

      b. het adres, of bij het ontbreken daarvan de kadastrale aanduiding, waarop de waterstofproductie-installatie wordt
      geplaatst;

      c. de periode die het exploitatiesubsidiedeel zal beslaan, bestaande uit ten minste zeven en ten hoogste vijftien
      achtereenvolgende, hele jaren;

      d. een projectplan waarin is opgenomen:

      1°. de activiteiten ter realisatie van de waterstofproductie-installatie met ten minste drie mijlpalen en een
      tijdschema met de geplande startdatum van de activiteiten en de geplande datum waarop de waterstofproductie-
      installatie zal zijn gerealiseerd;

      2°. een begroting, per component, van de subsidiabele kosten, bedoeld in [artikel 5.4][ref1];

      e. indien van toepassing: gegevens waarmee de subsidieaanvrager kan aantonen dat hij een kleine of middelgrote
      onderneming is.

      3 Bij de aanvraag vermeldt de subsidieaanvrager of voor hem opbrengsten of vermeden kosten voortvloeien uit het
      systeem van verhandelbare broeikasgasemissierechten, bedoeld in [titel 16.2 van de Wet milieubeheer][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0048664#Artikel5.4
      [ref2]: https://wetten.overheid.nl/BWBR0003245
