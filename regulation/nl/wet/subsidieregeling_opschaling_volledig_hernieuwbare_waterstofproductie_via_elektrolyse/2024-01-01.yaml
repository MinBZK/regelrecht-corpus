  - number: '6.10'
    text: |-
      1 Binnen zeven maanden na afloop van het kalenderjaar stelt de Minister het voorschot bij volgens de
      berekeningswijze, bedoeld in [artikel 6.4, derde, vierde en vijfde lid][ref1], aan de hand van:

      a. de hoeveelheid geproduceerde volledig hernieuwbare waterstof in dat kalenderjaar, bepaald volgens de
      berekeningswijze, bedoeld in [artikel 6.4, derde en vijfde lid][ref2]:

      1°. waarvoor garanties van oorsprong voor hernieuwbare waterstof zijn afgegeven, die zijn omgerekend naar kg
      waterstof met de omrekenfactor 0,03932 MWh/kg; en

      2°. waarvoor aan de hand van de verklaring, bedoeld in [artikel 4.2][ref3], is vastgesteld dat de waterstof
      volledig hernieuwbaar is; en

      b. het voor dat kalenderjaar vastgestelde definitieve correctiebedrag.

      2 Indien blijkt dat het geheel van verstrekte maandelijkse bedragen in een kalenderjaar minder bedraagt dan het
      bijgestelde voorschot voor dat kalenderjaar, verstrekt de Minister het te weinig betaalde bedrag binnen zes weken
      na de beschikking tot bijstelling van het voorschot aan de subsidieontvanger.

      3 Indien blijkt dat het geheel van verstrekte maandelijkse bedragen in een kalenderjaar meer bedraagt dan het
      bijgestelde voorschot in dat kalenderjaar, brengt de Minister het te veel betaalde bedrag in mindering op het
      eerstvolgende te verstrekken maandelijkse bedrag en vervolgens op zoveel maandelijkse bedragen als nodig is om
      het teveel betaalde voorschot volledig te verrekenen. Indien er geen maandelijkse bedragen meer verschuldigd zijn,
      wordt het teveel betaalde bedrag teruggevorderd.


