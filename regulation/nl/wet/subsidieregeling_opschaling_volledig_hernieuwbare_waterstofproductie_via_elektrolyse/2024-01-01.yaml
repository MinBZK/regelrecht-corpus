  - number: '4.3'
    text: |-
      1 De subsidieontvanger realiseert de waterstofproductie-installatie zo spoedig mogelijk na de beschikking tot
      subsidieverlening en neemt de waterstofproductie-installatie in gebruik zo spoedig mogelijk na realisatie maar
      uiterlijk binnen vier jaar na de beschikking tot subsidieverlening.

      2 De subsidieontvanger realiseert de waterstofproductie-installatie in overeenstemming met het in de aanvraag
      opgenomen projectplan.

      3 De subsidieontvanger heeft de waterstofproductie-installatie in gebruik volgens de gegevens, die zijn opgenomen
      in de aanvraag voor subsidie, tot aan de datum van de beschikking tot subsidievaststelling.

      4 De subsidieontvanger stelt de Minister onverwijld op de hoogte van de datum dat hij waterstofproductie-
      installatie in gebruik neemt.

      5 Zodra aannemelijk is dat vertraging in de realisatie of ingebruikname van de waterstofproductie-installatie zal
      optreden, stelt de subsidieontvanger de Minister hiervan onverwijld op de hoogte.
    url: https://wetten.overheid.nl/BWBR0048664/2024-01-01#Artikel4.3
  - number: '4.4'
    text: |-
      1 De Minister kan op voorafgaand verzoek van de subsidieontvanger bij vertraging een ontheffing voor ten hoogste
      één jaar verlenen van de verplichting om de waterstofproductie-installatie binnen vier jaar na de beschikking tot
      subsidieverlening te realiseren of in gebruik te nemen, bedoeld in [artikel 4.3, eerste lid][ref1].

      2 De Minister kan op voorafgaand verzoek van de subsidieontvanger bij essentiële wijzigingen van de realisatie van
      waterstofproductie-installatie ten opzichte van het projectplan of van de ingebruikname van de waterstofproductie-
      installatie ten opzichte van de gegevens, die zijn opgenomen in de aanvraag voor subsidie, een ontheffing verlenen
      van de verplichting, bedoeld in [artikel 4.3, tweede of derde lid][ref2].

      3 Aan de ontheffing kunnen voorschriften worden verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0048664#Artikel4.3
      [ref2]: https://wetten.overheid.nl/BWBR0048664#Artikel4.3
