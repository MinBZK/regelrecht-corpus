        artikel: '5'
  - number: '8'
    text: |-
      1 De minister neemt een elektronisch verzonden formulier dat niet overeenkomstig deze regeling is ingediend niet
      in behandeling.

      2 De minister neemt een elektronisch verzonden bericht waarvan de betrouwbaarheid of vertrouwelijkheid onvoldoende
      is gewaarborgd, gelet op de aard en de inhoud van het bericht en het doel waarvoor het wordt gebruikt, niet in
      behandeling.

      3 De minister informeert degene die het elektronisch verzonden formulier heeft ondertekend zo spoedig mogelijk over
      een besluit als bedoeld in het eerste of het tweede lid.
    url: https://wetten.overheid.nl/BWBR0039257/2017-03-02#Artikel8
  - number: '9'
    text: |-
      1 De minister kan ontheffing verlenen van de verplichting, bedoeld in artikel 6, om het formulier langs
      elektronische weg in te vullen, in te dienen en te ondertekenen.

      2 Ontheffing als bedoeld in het eerste lid kan worden verleend in geval de opgaveplichtige, respectievelijk de
      houder, aantoont:

      a. te behoren tot een geloofsgemeenschap die het gebruik van de elektronische weg in zijn geheel afwijst, of

      b. niet te beschikken over een computer met internetverbinding en niet eerder langs elektronische weg contact te
      hebben gelegd met RVO.nl of de rijksoverheid.

      3 Een ontheffing wordt uiterlijk 15 maart 2017 aangevraagd.
    url: https://wetten.overheid.nl/BWBR0039257/2017-03-02#Artikel9
