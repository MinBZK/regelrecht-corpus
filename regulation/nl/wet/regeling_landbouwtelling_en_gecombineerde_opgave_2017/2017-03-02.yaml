  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

        - *besmettelijke dierziekten:* op grond van
      [artikel 15, tweede lid, van de Gezondheids- en welzijnswet voor dieren][ref1] aangewezen besmettelijke dierziekten
      en zoönosen als bedoeld in [artikel 4 van het Besluit zoönosen][ref2];
        - *Diergezondheidsfonds:* fonds als bedoeld in [artikel 95a van de Gezondheids- en welzijnswet voor dieren][ref3];
        - *formulier;* formulier als bedoeld in de bijlage bij deze regeling;
        - *houder:* houder als bedoeld in [artikel 1, eerste lid, van de Gezondheids- en welzijnswet voor dieren][ref4];
        - *minister:* Minister van Economische Zaken;
        - *opgaveplichtige:* degene aan wie de minister het formulier langs schriftelijke of elektronische weg heeft
      toegezonden;
        - *staatssteunrichtsnoeren:* richtsnoeren van de Europese Unie voor staatssteun in de landbouw- en de bosbouwsector
      en in plattelandsgebieden 2014–2020 (PbEU 2014, C 204);
        - *Verordening (EU) nr. 1305/2013:* Verordening (EU) nr. 1305/2013 van het Europees Parlement en de Raad van 17
      december 2013 inzake steun voor plattelandsontwikkeling uit het Europees Landbouwfonds voor plattelandsontwikkeling
      (ELFPO) en tot intrekking van Verordening (EG) nr 1698/2005 van de Raad (PbEU 2013, L347);
        - *Verordening (EU) nr. 1306/2013:* Verordening (EU) nr. 1306/2013 van het Europees Parlement en de Raad van 17
      december 2013 inzake de financiering, het beheer en de monitoring van het gemeenschappelijk landbouwbeleid en
      tot intrekking van Verordeningen (EEG) nr 352/78, (EG) nr 165/94 (EG), nr. 2799/98, (EG) nr. 814/2000, (EG) nr.
      1290/2005 en (EG) nr. 485/2008 van de Raad (PbEU 2013 L 347);
        - *Verordening (EU) nr. 1307/2013:* Verordening (EU) nr. 1307/2013 van het Europees Parlement en de Raad van 17
      december 2013 tot vaststelling van voorschriften voor rechtstreekse betalingen aan landbouwers in het kader van de
      steunregelingen van het gemeenschappelijk landbouwbeleid en tot intrekking van Verordening (EG) nr. 637/2008 van de
      Raad en Verordening (EG) nr 73/2009 van de Raad (PbEU 2013, L347).


