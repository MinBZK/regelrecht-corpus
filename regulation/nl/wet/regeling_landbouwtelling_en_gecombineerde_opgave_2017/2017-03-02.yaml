  - number: '2'
    text: |-
      1 Het formulier is een beschrijvingsbiljet als bedoeld in [artikel 24, eerste lid, van de Landbouwwet][ref1].

      2 Een landbouwer verstrekt door middel van het formulier gegevens en statistische informatie als bedoeld in:

      a. [artikel 26, eerste lid, van het Uitvoeringsbesluit Meststoffenwet][ref2];

      b. [artikel 3 van de Regeling kostenverevening reductie CO][ref3].

      3 Ter uitvoering van de artikelen 28 en 36, eerste lid, onderdeel a, van Verordening (EU) nr. 1305/2013, artikel 72
      van Verordening (EU) nr 1306/2013 en de artikelen 12, 24, 30, 32 en 33 van Verordening (EU) nr. 1307/2013 dient het
      formulier voor:

      a. het doen van de aanvragen, bedoeld in de [artikelen 4.2, eerste lid][ref4], en
      [4.4, eerste lid, van de Uitvoeringsregeling rechtstreekse betalingen GLB][ref5];

      b. het verstrekken van informatie of het indienen van een betaalverzoek als bedoeld in een Subsidieverordening
      natuur- en landschapsbeheer van een provincie;

      c. het doen van de aanvraag, bedoeld in [artikel 4.1.2, tweede lid, van de Regeling Europese EZ-subsidies][ref6].

      4 Degene aan wie de minister een beschrijvingsbiljet langs schriftelijke of elektronische weg heeft toegezonden
      dient dit uiterlijk op 15 mei 2017 ingevuld en ondertekend bij de minister in.

      5 In afwijking van het vierde lid kan het onderdeel van het beschrijvingsbiljet dat betrekking heeft op de
      gegevens, bedoeld in het tweede lid, aanhef en onderdeel b, uiterlijk op 1 juli 2017 ingevuld en ondertekend bij de
      minister worden ingediend.


