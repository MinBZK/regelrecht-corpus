  - number: '29'
    text: |-
      1 Op vordering van de officier van justitie kan de rechtbank ter zitting de gevangenneming van de veroordeelde
      bevelen in gevallen waarin overeenkomstig [artikel 8][ref1] voorlopige aanhouding mogelijk is.

      2 Voordat het onderzoek ter zitting wordt gesloten, beslist de rechtbank ambtshalve over de gevangenhouding van de
      veroordeelde die krachtens deze wet voorlopig van zijn vrijheid is beroofd.

      3 Een krachtens een der vorige leden bevolen vrijheidsbeneming blijft na de uitspraak van de rechtbank van kracht
      totdat deze uitspraak in kracht van gewijsde is gegaan.

      4 Zij wordt, behoudens de mogelijkheid van verdere vrijheidsbeneming uit anderen hoofde, beëindigd:

      a. zodra zulks door de rechtbank of door de officier van justitie ambtshalve of op verzoek van de veroordeelde of
      diens raadsman, dan wel door de Hoge Raad bij zijn beslissing op een beroep in cassatie, wordt gelast:

      b. indien de duur van die vrijheidsbeneming gelijk is geworden aan de duur van de door de Nederlandse rechter
      opgelegde straf of maatregel.


      [ref1]: https://wetten.overheid.nl/BWBR0004028#Artikel8
    url: https://wetten.overheid.nl/BWBR0004028/2025-07-01#Artikel29
