  - number: 43b
    text: |-
      1 De bijzondere kamer van het gerechtshof Arnhem-Leeuwarden beoordeelt met inachtneming van het toepasselijke
      verdrag:

      a. of de tenuitvoerlegging in Nederland op grond van de [artikelen 2][ref1], [3][ref2], [4][ref3], [6][ref4] of
      [7][ref5] niet kan plaatshebben;

      b. welk strafbaar feit naar Nederlands recht het feit dat aan de buitenlandse veroordeling ten grondslag ligt,
      oplevert;

      c. tot welke aanpassing van de opgelegde vrijheidsbenemende sanctie, het tweede en derde lid aanleiding geven.

      2 Indien de opgelegde vrijheidsbenemende sanctie een langere duur heeft dan het voor het desbetreffende feit naar
      Nederlands recht toepasselijke strafmaximum, wordt de duur van de vrijheidsbenemende sanctie tot dat strafmaximum
      verlaagd.

      3 Indien de aard van de opgelegde vrijheidsbenemende sanctie onverenigbaar is met het Nederlandse recht, wordt de
      vrijheidsbenemende sanctie gewijzigd in een straf of maatregel waarin het Nederlandse recht voorziet en die zoveel
      mogelijk overeenstemt met de in de vreemde staat opgelegde vrijheidsbenemende sanctie.

      4 De aanpassing op grond van het tweede en derde lid houdt in geen geval een verzwaring van de opgelegde
      vrijheidsbenemende sanctie in.

      5 De bijzondere kamer van het gerechtshof Arnhem-Leeuwarden doet zijn oordeel op grond van het eerste lid,
      schriftelijk en met redenen omkleed aan Onze Minister toekomen, binnen een termijn van zes weken nadat het verzoek
      en de daarbij behorende stukken zijn ontvangen.

      6 Onze Minister beslist op het verzoek tot tenuitvoerlegging. Voor zover de bijzondere kamer van het gerechtshof
      Arnhem-Leeuwarden heeft geoordeeld dat het verzoek niet kan worden ingewilligd, wijst Onze Minister het verzoek af.


      [ref1]: https://wetten.overheid.nl/BWBR0004028#Artikel2
