        artikel: '52'
        hoofdstuk: IV
        afdeling: A
  - number: '58'
    text: |-
      Bij algemene maatregel van bestuur worden voorschriften vastgesteld omtrent de procedure volgens welke een
      verklaring van of namens een zich in Nederland bevindende veroordeelde, houdende instemming met de overdracht van
      de tenuitvoerlegging van een hem opgelegde tot vrijheidsbeneming strekkende sanctie, dient te worden afgelegd.
    url: https://wetten.overheid.nl/BWBR0004028/2025-07-01#Artikel58
  - number: '59'
    text: |-
      1 Overdracht van de tenuitvoerlegging van rechterlijke beslissingen ingevolge dit Hoofdstuk geschiedt slechts onder
      het algemene beding, dat de door de Nederlandse rechter opgelegde straf, maatregel of voorwaarden niet ten nadele
      van de veroordeelde worden gewijzigd en dat daarbij met het reeds hier te lande ten uitvoer gelegde gedeelte van
      die straf of maatregel rekening wordt gehouden.

      2 Een veroordeelde die in Nederland een tot vrijheidsbeneming strekkende sanctie ondergaat of nog zal moeten
      ondergaan wordt, wanneer met een vreemde staat overeenstemming is bereikt omtrent de verdere tenuitvoerlegging van
      deze sanctie, zo spoedig mogelijk ter beschikking gesteld van de autoriteiten van die staat, zulks op een door Onze
      Minister, na overleg met die autoriteiten, te bepalen tijd en plaats.

      3 De overbrenging van een veroordeelde, die niet heeft verklaard met de overdracht van de tenuitvoerlegging in
      te stemmen, geschiedt niet dan onder het algemene beding, dat hij alleen met uitdrukkelijke toestemming van Onze
      Minister:

      a. zal worden vervolgd, gestraft of op enige wijze in zijn persoonlijke vrijheid beperkt ter zake van feiten, die
      voor het tijdstip van zijn overbrenging zijn begaan en ter zake waarvan de tenuitvoerlegging niet is overgedragen;
      en

      b. ter beschikking zal worden gesteld van de autoriteiten van een derde staat ter zake van feiten, die voor
      het tijdstip van zijn overbrenging zijn begaan, tenzij de veroordeelde nadien de gelegenheid heeft gehad het
      grondgebied van de staat naar welke hij is overgebracht te verlaten.

      4 Op het moment dat een veroordeelde ter beschikking van de in het tweede lid bedoelde autoriteiten wordt gesteld,
      wordt de tenuitvoerlegging in Nederland van de hem opgelegde sanctie van rechtswege geschorst.

      5 In geval van hervatting van het recht tot tenuitvoerlegging van de sanctie wordt het in het buitenland reeds ten
      uitvoer gelegde gedeelte daarop in mindering gebracht.
    url: https://wetten.overheid.nl/BWBR0004028/2025-07-01#Artikel59
  - number: '60'
    text: |-
      Waar in deze wet bepalingen van het [Wetboek van Strafvordering][ref1] van overeenkomstige toepassing zijn
      verklaard zijn deze bepalingen, voor zover zij betrekking hebben op de verdachte, van overeenkomstige toepassing op
      de veroordeelde.


      [ref1]: https://wetten.overheid.nl/BWBR0001903
    url: https://wetten.overheid.nl/BWBR0004028/2025-07-01#Artikel60
    references:
