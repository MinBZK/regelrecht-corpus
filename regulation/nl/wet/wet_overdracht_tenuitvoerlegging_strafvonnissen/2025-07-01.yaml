  - number: 13a
    text: |-
      1 Voor zover een verdrag daarin voorziet kunnen op verzoek van een vreemde staat voorwerpen in beslag worden
      genomen:

      a. ten aanzien waarvan naar het recht van de vreemde staat een tot verbeurdverklaring strekkende sanctie kan worden
      opgelegd,

      b. tot bewaring van het recht tot verhaal voor een tot ontneming van wederrechtelijk verkregen voordeel strekkende
      verplichting tot betaling van een geldbedrag welke naar het recht van de vreemde staat kan worden opgelegd, of

      c. die kunnen dienen om wederrechtelijk verkregen voordeel aan te tonen.

      2 Inbeslagneming, als bedoeld in het eerste lid, onder *a* en *b*, kan slechts plaatsvinden indien blijkens de door
      de vreemde staat bij zijn verzoek verstrekte inlichtingen, door de bevoegde autoriteiten van die staat een bevel
      tot inbeslagneming is gegeven of zou zijn gegeven indien de desbetreffende voorwerpen zich binnen zijn grondgebied
      zouden bevinden, en inbeslagneming naar Nederlands recht is toegestaan.

      3 Voor de toepassing van het tweede lid is inbeslagneming naar Nederlands recht toegestaan, indien zulks ook
      mogelijk zou zijn geweest wanneer het feit of de feiten naar aanleiding waarvan de inbeslagneming door de vreemde
      staat wordt verzocht in Nederland zou of zouden zijn begaan.

      4 Inbeslagneming van voorwerpen, als bedoeld in het eerste lid, onder *a* en *b*, kan voorts slechts plaatsvinden,
      indien gegronde redenen bestaan voor de verwachting dat te dier aanzien vanwege de verzoekende vreemde staat een
      verzoek tot tenuitvoerlegging van een verbeurdverklaring of van een tot ontneming van wederrechtelijk verkregen
      voordeel strekkende sanctie zal worden gedaan.
    url: https://wetten.overheid.nl/BWBR0004028/2025-07-01#Artikel13a
  - number: 13b
    text: |-
      1 Voor zover een verdrag daarin voorziet kunnen voorwerpen, ten aanzien waarvan door een rechter van een vreemde
      staat een bevel is gegeven van vergelijkbare strekking als verbeurdverklaring of ontneming als wederrechtelijk
      verkregen voordeel, op verzoek van de vreemde staat in beslag worden genomen.

      2 Inbeslagneming overeenkomstig het eerste lid kan slechts plaatsvinden in gevallen, waarin gegronde redenen
      bestaan voor de verwachting dat het in dat lid bedoelde bevel op korte termijn in Nederland zal worden
      tenuitvoergelegd.
    url: https://wetten.overheid.nl/BWBR0004028/2025-07-01#Artikel13b
  - number: 13c
    text: |-
      1 Het bepaalde in het [derde lid van artikel 13][ref1] en in het [vierde lid van artikel 13a][ref2] staat er
      niet aan in de weg, dat inbeslaggenomen voorwerpen desverzocht worden overgeleverd aan de verzoekende vreemde
      staat met het oog op de oplegging en tenuitvoerlegging van een verbeurdverklaring of van een tot ontneming van
      wederrechtelijk verkregen voordeel strekkende sanctie. Daartoe worden inbeslaggenomen voorwerpen ter beschikking
      van de officier van justitie gesteld, voor zover de rechtbank, met inachtneming van het toepasselijke verdrag,
      daartoe verlof verleent.

      2 Het krachtens het eerste lid vereiste verlof wordt slechts verleend onder het voorbehoud, dat bij de afgifte aan
      de buitenlandse autoriteiten wordt bedongen, dat de voorwerpen worden teruggezonden, ook wanneer deze zijn verbeurd
      verklaard of als wederrechtelijk verkregen voordeel ontnomen, in welk geval zij in eigendom aan de Nederlandse
      staat worden overgedragen, dan wel dat de verzoekende staat een door Onze Minister te bepalen geldbedrag,
      overeenkomende met het geheel of een deel van de waarde van de voorwerpen, aan de Nederlandse staat doet overmaken.
      Onze Minister kan besluiten af te zien van de aanspraak op overmaking van het bedongen geldbedrag, indien de
      verzoekende staat aantoont dat de afgegeven voorwerpen zijn overgedragen aan derden rechthebbenden.

      3 De behandeling van een verzoek of vordering tot verlening van verlof door de raadkamer geschiedt in het openbaar.
      Op de behandeling is het bepaalde in de [zesde afdeling van Titel I van Boek I van het Wetboek van Strafvordering]
      (onbekend) van overeenkomstige toepassing.

      4 Beroep in cassatie kan door het openbaar ministerie worden ingesteld binnen veertien dagen na de dagtekening der
      beschikking en door de overige procesdeelnemers binnen veertien dagen na de dagtekening van de brief waarmee de
      beschikking is toegezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0004028#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0004028#Artikel13a
