        bwb_id: BWBR0001903
  - number: '61'
    text: |-
      Krachtens deze wet gegeven bevelen tot inverzekeringstelling, bewaring of gevangenneming, dan wel tot verlenging
      van een termijn van vrijheidsbeneming, worden gedagtekend en ondertekend. De grond voor uitvaardiging wordt in
      het bevel vermeld. Aan de veroordeelde op wie het bevel betrekking heeft, wordt onverwijld een afschrift daarvan
      uitgereikt.
    url: https://wetten.overheid.nl/BWBR0004028/2025-07-01#Artikel61
  - number: '62'
    text: |-
      De bevelen tot vrijheidsbeneming, bedoeld in het voorgaande artikel, zijn dadelijk uitvoerbaar. Bevoegd tot het ten
      uitvoer leggen van bevelen tot vrijheidsbeneming zijn de in [artikel 141 van het Wetboek van Strafvordering][ref1]
      genoemde ambtenaren. Op de tenuitvoerlegging en de last daartoe zijn de [artikelen 6:1:6][ref2], [6:1:7][ref3],
      [6:1:9][ref4], [6:1:15][ref5] en [6:2:1 van het Wetboek van Strafvordering][ref6] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel616
