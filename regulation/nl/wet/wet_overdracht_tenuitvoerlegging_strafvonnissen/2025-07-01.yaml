  - number: '41'
    text: |-
      1 Van iedere ernstige overtreding van de voorwaarden geeft de officier van justitie onverwijld kennis aan Onze
      Minister.

      2 Zodra de proeftijd is verstreken brengt de officier van justitie aan Onze Minister rapport uit omtrent de
      naleving van de voorwaarden.
    url: https://wetten.overheid.nl/BWBR0004028/2025-07-01#Artikel41
  - number: '42'
    text: |-
      De officier van justitie draagt, behoudens het bepaalde in [artikel 16][ref1], zorg dat overeenkomstig
      [afdeling C][ref2] van dit hoofdstuk wordt gehandeld, indien hij een verzoek heeft ontvangen tot toepassing van
      een beslissing van een buitenlandse autoriteit, op grond waarvan voorwaarden gelden waarvan overtreding kan of moet
      leiden tot tenuitvoerlegging van een rechterlijke beslissing in een strafzaak.


      [ref1]: https://wetten.overheid.nl/BWBR0004028#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0004028#HoofdstukIII
