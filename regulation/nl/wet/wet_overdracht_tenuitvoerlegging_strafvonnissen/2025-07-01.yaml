  - number: '70'
    text: |-
      Waar in deze wet de bevoegdheid wordt gegeven tot het horen van personen, is
      [artikel 131a van het Wetboek van Strafvordering][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel131a
    url: https://wetten.overheid.nl/BWBR0004028/2025-07-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 131a
  - number: '75'
    text: |-
      De bepalingen van de voorgaande hoofdstukken zijn niet van toepassing op de tenuitvoerlegging van door buitenlandse
      rechterlijke autoriteiten opgelegde vrijheidsstraf, ingevolge [artikel 6 van de Wet van 7 augustus 1953 (][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002118#Artikel6
    url: https://wetten.overheid.nl/BWBR0004028/2025-07-01#Artikel75
    references:
