  - number: '69'
    text: |-
      Op verzoeken om doorvoer over Nederlands grondgebied van personen die ten behoeve van de tenuitvoerlegging van
      een rechterlijke beslissing door de autoriteiten van een vreemde staat ter beschikking van de autoriteiten van een
      andere staat worden gesteld, zijn de [artikelen 48][ref1] en [50 van de Uitleveringswet][ref2] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002559#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0002559#Artikel50
    url: https://wetten.overheid.nl/BWBR0004028/2025-07-01#Artikel69
