  - number: 31a
    text: |-
      1 Verlof tot tenuitvoerlegging van een in de vreemde staat opgelegde sanctie strekkende tot ontneming van
      wederrechtelijk verkregen voordeel kan worden beperkt tot de tenuitvoerlegging van de verplichting tot betaling van
      een geldbedrag aan de staat, dat in omvang slechts een gedeelte van dat voordeel vertegenwoordigt.

      2 Indien de in de vreemde staat opgelegde sanctie strekt tot de ontneming van wederrechtelijk verkregen voordeel,
      spreekt de rechtbank, indien de vreemde staat uitdrukkelijk heeft verzocht die sanctie slechts ten uitvoer te
      leggen op voorwerpen die dat voordeel vertegenwoordigen, de verbeurdverklaring daarvan uit.

      3 Op uitspraken, houdende een verbeurdverklaring, is het bepaalde in de [artikelen 552b][ref1], [552d][ref2],
      [552e][ref3] en [552g van het Wetboek van Strafvordering][ref4] van overeenkomstige toepassing.

      4 Op uitspraken, houdende de oplegging van een verplichting tot betaling van een geldbedrag aan de staat
      ter ontneming van wederrechtelijk verkregen voordeel, is het bepaalde in de [artikelen 6:4:9][ref5] en
      [6:6:26 van het Wetboek van Strafvordering][ref6] van overeenkomstige toepassing.

      5 [Artikel 13e][ref7] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel552b
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel552d
