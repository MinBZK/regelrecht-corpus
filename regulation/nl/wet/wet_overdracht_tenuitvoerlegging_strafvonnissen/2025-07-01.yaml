      - id: ref3
        bwb_id: BWBR0001903
  - number: '56'
    text: |-
      Tenzij Onze Minister reeds aanstonds van oordeel is dat het verzoek van een buitenlandse autoriteit tot overdracht
      van de tenuitvoerlegging van een in Nederland opgelegde sanctie moet worden afgewezen, wint hij omtrent de vraag of
      het belang van een goede rechtsbedeling zich tegen inwilliging van het verzoek verzet het advies in van het gerecht
      dat in hoogste feitelijke instantie de sanctie heeft opgelegd en van het openbaar ministerie.
    url: https://wetten.overheid.nl/BWBR0004028/2025-07-01#Artikel56
  - number: '57'
    text: |-
      1 Zo spoedig mogelijk na de ontvangst van de in het vorige artikel bedoelde adviezen beslist Onze Minister over het
      gevolg, te geven aan het in dat artikel bedoelde verzoek. [Artikel 52][ref1] is van overeenkomstige toepassing.

      2 Van zijn beslissing geeft Onze Minister onverwijld kennis aan het gerecht en aan het openbaar ministerie die
      terzake advies hebben uitgebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0004028#Artikel52
    url: https://wetten.overheid.nl/BWBR0004028/2025-07-01#Artikel57
    references:
