  - number: '27'
    text: |-
      1 De behandeling van de vordering heeft plaats in tegenwoordigheid van de officier van justitie. De veroordeelde
      wordt in de gelegenheid gesteld daarbij aanwezig te zijn en kan zich door zijn raadsman doen bijstaan.

      2 De behandeling van de vordering geschiedt in het openbaar, tenzij de rechtbank op verzoek van de veroordeelde of
      om gewichtige, in het proces-verbaal der zitting te vermelden, redenen sluiting der deuren beveelt.
    url: https://wetten.overheid.nl/BWBR0004028/2025-07-01#Artikel27
  - number: '28'
    text: |-
      1 De rechtbank onderzoekt de identiteit van de veroordeelde op de wijze, bedoeld in
      [artikel 27a, eerste lid, eerste volzin, van het Wetboek van Strafvordering][ref1], alsmede de ontvankelijkheid
      van de officier van justitie, de mogelijkheid van tenuitvoerlegging in Nederland van de in het buitenland gewezen
      rechterlijke beslissing en de feiten en omstandigheden die voor haar beslissing van belang zijn. De rechtbank is
      tevens bevoegd de identiteit van de veroordeelde vast te stellen op de wijze, bedoeld in artikel 27a, tweede lid,
      van dat wetboek, indien over zijn identiteit twijfel bestaat. [Artikel 29c, tweede lid, van dat wetboek][ref2] is
      van overeenkomstige toepassing.

      2 De officier van justitie en de veroordeelde en diens raadsman worden in de gelegenheid gesteld ter terechtzitting
      van de rechtbank te worden gehoord.

      3 De rechtbank is gebonden aan de vaststelling van de feiten die de buitenlandse rechter kennelijk aan zijn
      beslissing ten grondslag heeft gelegd. Zij treedt niet in een nieuw onderzoek naar deze feiten.

      4 De [artikelen 260, eerste lid][ref3], [268][ref4], [269, vijfde lid][ref5], [271, eerste lid][ref6],
      [272][ref7], [273, derde lid][ref8], [274 tot en met 277][ref9], [278, tweede lid][ref10], [280][ref11],
      [281][ref12], [286, eerste, vierde, vijfde en zesde lid][ref13], [293][ref14], [299][ref15], [300][ref16],
      [301, eerste, tweede, vierde en vijfde lid][ref17], [310][ref18], [311, tweede tot en met vierde lid][ref19],
      [315 tot en met 317][ref20], [319][ref21], [320][ref22], [322, eerste en tweede lid][ref23], [324][ref24] en
      [326 tot en met 331 van het Wetboek van Strafvordering][ref25] vinden overeenkomstige toepassing.

      5 Indien getuigen zijn opgeroepen ter verkrijging van inlichtingen omtrent de persoonlijkheid van de
      veroordeelde of indien de rechtbank het noodzakelijk acht feiten te onderzoeken ter beoordeling van het bestaan
      van gronden die naar Nederlands recht, doch niet naar dat van de vreemde staat, de strafbaarheid van het
      feit of de dader uitsluiten, vinden voorts de [artikelen 287, tweede lid][ref26], [288, vierde lid][ref27],
      [289, eerste tot en met derde lid][ref28], [290 tot en met 292][ref29], [294 tot en met 297][ref30],
      [301, derde lid][ref31], en [311, vijfde lid, van het Wetboek van Strafvordering][ref32] overeenkomstige
      toepassing.

      6 Indien de officier van justitie overeenkomstig [artikel 26, tweede lid][ref33], heeft geweigerd een getuige
      te doen oproepen kan de veroordeelde de rechtbank verzoeken alsnog de oproeping van de getuige te bevelen. De
      rechtbank gaat hiertoe over indien zij van oordeel is dat de officier van justitie in redelijkheid niet tot zijn
      beslissing heeft kunnen komen.

      7 De in het derde en het vijfde lid genoemde artikelen vinden geen toepassing voor zover deze betrekking hebben op
      een getuige wiens identiteit niet of slechts ten dele blijkt.

      8 De officier van justitie legt, na voorlezing, een conclusie aan de rechtbank over. Indien de conclusie strekt tot
      bewilliging in de tenuitvoerlegging, omschrijft zij de straf of maatregel welke naar het oordeel van de officier
      van justitie in plaats van de buitenlandse sanctie behoort te worden opgelegd. Tevens vermeldt de officier van
      justitie in dat geval met welk strafbaar feit naar Nederlands recht het feit op grond waarvan de veroordeelde aan
      een buitenlandse sanctie is onderworpen, overeenkomt.


