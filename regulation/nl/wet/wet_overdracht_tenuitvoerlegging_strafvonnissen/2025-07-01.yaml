  - number: '66'
    text: |-
      Op bevelen tot beëindiging van voorlopige vrijheidsbeneming krachtens deze wet gegeven en tot tenuitvoerlegging van
      zodanige bevelen zijn de [artikelen 73][ref1], [79][ref2] en [6:2:5 van het Wetboek van Strafvordering][ref3] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel73
