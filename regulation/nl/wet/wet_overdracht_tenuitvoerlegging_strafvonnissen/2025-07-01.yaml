  - number: 13e
    text: |-
      1 Bij de overeenkomstige toepassing van de [artikelen 552a][ref1], onderscheidenlijk
      [552c van het Wetboek van Strafvordering][ref2] treedt de rechter niet in een nieuw onderzoek naar de rechten van
      belanghebbenden, indien daaromtrent door de buitenlandse rechter een uitspraak is gedaan. De rechter kan echter wel
      in een dergelijk nieuw onderzoek treden indien:

      a. die uitspraak betrekking heeft op rechten terzake van in Nederland gelegen onroerende goederen of in Nederland
      te boek gestelde registergoederen;

      b. die uitspraak betreft de geldigheid, de nietigheid of de ontbinding van in Nederland gevestigde rechtspersonen
      of de besluiten van hun organen;

      c. die uitspraak is gedaan, zonder dat de belanghebbende, tegen wie verstek werd verleend, zo tijdig tevoren als
      met het oog op zijn verdediging redelijkerwijs nodig was van het geding officieel in kennis was gesteld;

      d. die uitspraak onverenigbaar is met een ter zake eerder in Nederland gewezen rechterlijke beslissing;

      e. erkenning van die uitspraak onverenigbaar zou zijn met de Nederlandse openbare orde.

      2 Indien en zolang ter zake van de rechten van een belanghebbende een procedure voor de rechter van de vezoekende
      vreemde staat aanhangig is, is deze in zijn klaagschrift of vordering niet ontvankelijk.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel552a
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel552c
