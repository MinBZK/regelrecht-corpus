  - number: '14'
    text: |-
      Indien de door de vreemde staat overgelegde stukken naar het oordeel van Onze Minister onvoldoende zijn om op
      een verzoek tot tenuitvoerlegging een beslissing te nemen, biedt hij de autoriteiten van de verzoekende staat de
      gelegenheid binnen een door hem te stellen redelijke termijn aanvullende stukken of inlichtingen te verschaffen.
    url: https://wetten.overheid.nl/BWBR0004028/2025-07-01#Artikel14
  - number: '15'
    text: |-
      1 Tenzij Onze Minister reeds aanstonds van oordeel is dat het verzoek om tenuitvoerlegging moet worden afgewezen,
      stelt hij het met de daarbij behorende stukken in handen van de officier van justitie in wiens rechtsgebied de
      veroordeelde zijn woonplaats heeft of zich bevindt.

      2 Wanneer een verzoek om voorlopige aanhouding is voorafgegaan worden de stukken toegezonden aan de officier van
      justitie die in verband met dat verzoek reeds bij de zaak betrokken is geweest.

      3 Indien tegen de veroordeelde in Nederland een vervolging gaande is kunnen, in afwijking van het voorgaande, de
      stukken worden toegezonden aan de officier van justitie die met deze vervolging is belast.

      4 Is de veroordeelde een in [artikel 2 van de Wet militaire strafrechtspraak][ref1] bedoelde persoon, dan zendt
      Onze Minister de stukken toe aan de officier van justitie in het arrondissement waarin de rechtbank is gelegen die
      ingevolge [die wet][ref2] bevoegd is over die persoon rechtsmacht uit te oefenen.

      5 Betreft het verzoek de tenuitvoerlegging van een vermogenssanctie en is de veroordeelde een natuurlijke persoon
      zonder vaste woon- of verblijfplaats in Nederland of een rechtspersoon waarvan het bestuur geen zitting of kantoor
      houdt in Nederland, of waarvan het hoofd van het bestuur geen vaste woonplaats in Nederland heeft, dan worden de
      stukken toegezonden aan de officier van justitie in wiens rechtsgebied voorwerpen aanwezig zijn waarop de sanctie
      tenuitvoer kan worden gelegd. Wanneer een verzoek om inbeslagneming is voorafgegaan worden de stukken toegezonden
      aan de officier van justitie die dat verzoek in behandeling heeft genomen.

      6 Is op grond van de voorgaande leden voorshands geen bevoegde officier van justitie aan te wijzen, dan zendt Onze
      Minister de stukken toe aan de officier van justitie bij het arrondissementsparket Amsterdam.


      [ref1]: https://wetten.overheid.nl/BWBR0004789#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0004789
    url: https://wetten.overheid.nl/BWBR0004028/2025-07-01#Artikel15
