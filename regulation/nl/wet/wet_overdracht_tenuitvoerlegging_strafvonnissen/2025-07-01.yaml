  - number: '65'
    text: |-
      1 In gevallen waarin krachtens deze wet een beslissing omtrent de voorlopige vrijheidsbeneming van een veroordeelde
      kan of moet worden genomen, kan worden bevolen dat die vrijheidsbeneming voorwaardelijk wordt opgeschort of
      geschorst.

      2 Op bevelen krachtens het vorige lid gegeven door de rechtbank, dan wel door de rechter-commissaris zijn de
      [artikelen 80-88 van het Wetboek van Strafvordering][ref1] van overeenkomstige toepassing.

      3 De termijn, genoemd in [artikel 11, tweede lid, onder b][ref2], loopt niet gedurende de tijd dat de veroordeelde
      zich aan de verdere tenuitvoerlegging van de gelaste bewaring heeft onttrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel80
      [ref2]: https://wetten.overheid.nl/BWBR0004028#Artikel11
