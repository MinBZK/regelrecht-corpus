  - number: '34'
    text: |-
      1 Indien de in de vreemde staat opgelegde sanctie uitsluitend strekt tot de betaling van een geldboete, eventueel
      onder bedreiging met een vervangende tot vrijheidsbeneming strekkende sanctie, wordt deze ten uitvoer gelegd
      krachtens een beslissing van de officier van justitie.

      2 Alvorens een beslissing te nemen ingevolge het vorige lid stelt de officier van justitie de veroordeelde in de
      gelegenheid te worden gehoord.

      3 De officier van justitie drukt overeenkomstig het bepaalde in het toepasselijke verdrag het bedrag van de
      geldboete uit in Nederlandse valuta. Indien het verdrag daaromtrent geen voorschriften bevat bepaalt de officier
      van justitie de hoogte van het bedrag volgens de wisselkoers die gold op het tijdstip van veroordeling in de
      vreemde staat. Als wisselkoers geldt de middenkoers van de op de koopmansbeurs te Amsterdam tot stand gekomen
      notering.

      4 Voor valuta waarvan de wisselkoers niet dagelijks op de koopmansbeurs te Amsterdam wordt genoteerd geldt de
      wisselkoers die wordt verkregen uit de waarde in speciale trekkingsrechten van de desbetreffende valuta op de
      laatste werkdag van de maand waarin de ten uitvoer te leggen sanctie in de vreemde staat werd opgelegd.
    url: https://wetten.overheid.nl/BWBR0004028/2025-07-01#Artikel34
  - number: '35'
    text: |-
      1 De ingevolge [artikel 34][ref1] genomen beslissing en de dag waarop het daarbij vastgestelde bedrag moet worden
      voldaan worden vanwege de officier van justitie zo spoedig mogelijk aan de veroordeelde ter kennis gebracht.

      2 Tegen de beslissing van de officier van justitie kan de veroordeelde binnen veertien dagen nadat zich een
      omstandigheid heeft voorgedaan, waaruit voortvloeit dat de beslissing hem bekend is, een bezwaarschrift indienen
      bij de rechtbank, indien de opgelegde geldboete het bedrag van € 22,50 overschrijdt.

      3 Het bezwaarschrift wordt behandeld door de politierechter. Indien de politierechter oordeelt dat het
      bezwaarschrift door een meervoudige kamer van de rechtbank moet worden behandeld, verwijst hij de zaak daar heen.

      4 Is het bezwaarschrift ingediend door een in [artikel 2 van de Wet militaire strafrechtspraak][ref2] bedoelde
      persoon, dan wordt het behandeld door de militaire politierechter. Indien de militaire politierechter oordeelt dat
      het bezwaarschrift door een meervoudige kamer van de rechtbank moet worden behandeld, dan verwijst hij de zaak naar
      de militaire kamer.

      5 Op de wijze van indiening en intrekking van een bezwaarschrift zijn de artikelen [449, derde lid][ref3], en
      [450-454 van het Wetboek van Strafvordering][ref4] van overeenkomstige toepassing.

      6 Op de behandeling van het bezwaarschrift zijn de[ artikelen 25][ref5], [26][ref6], [27][ref7], [28][ref8] en
      [30][ref9] van deze wet van overeenkomstige toepassing.

      7 Verklaart de rechtbank het bezwaar gegrond, dan vernietigt zij de beslissing van de officier van justitie
      of vult deze aan met inachtneming van het bepaalde in [artikel 24][ref10]. Acht zij, ondanks vernietiging de
      tenuitvoerlegging wel toelaatbaar, dan doet zij wat de officier van justitie had behoren te doen. In alle gevallen
      dat de rechtbank de tenuitvoerlegging van een geldboete toelaatbaar verklaart, bepaalt zij tevens de duur van de
      vervangende hechtenis.

      8 De[ artikelen 32][ref11] en [33][ref12] van deze wet zijn toepasselijk.


