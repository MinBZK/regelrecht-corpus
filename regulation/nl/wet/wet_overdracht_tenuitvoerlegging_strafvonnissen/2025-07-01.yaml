  - number: '36'
    text: |-
      1 Beslissingen als bedoeld in [artikel 34][ref1] kunnen zodra zij zijn genomen worden ten uitvoer gelegd, tenzij
      het toepasselijke verdrag anders bepaalt. Door het indienen van een bezwaarschrift binnen de daarvoor gestelde
      termijn wordt de tenuitvoerlegging opgeschort.

      2 Beslissingen genomen krachtens [artikel 34][ref2] worden ten uitvoer gelegd met inachtneming van het bij
      of krachtens het [Wetboek van Strafvordering][ref3] omtrent de tenuitvoerlegging van geldboeten bepaalde, met
      uitzondering van het [derde lid van artikel 6:4:5 van dat Wetboek][ref4].


