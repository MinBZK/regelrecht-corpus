  - number: '68'
    text: |-
      Op betekeningen, kennisgevingen en oproepingen gedaan krachtens deze wet zijn de
      [artikelen 36b tot en met 36e][ref1], [36h][ref2] en [36n van het Wetboek van Strafvordering][ref3] van
      overeenkomstige toepassing, tenzij deze wet anders bepaalt.


