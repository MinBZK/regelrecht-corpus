  - number: '13'
    text: |-
      1 Naar aanleiding van een op een verdrag gegrond verzoek van een vreemde staat kan in Nederland
      een strafrechtelijk financieel onderzoek worden ingesteld, overeenkomstig de bepalingen van
      [de negende afdeling van Titel IV van Boek I van het Wetboek van Strafvordering][ref1], gericht op de bepaling van
      hier te lande aanwezig of verworven wederrechtelijk verkregen voordeel van een persoon die in de verzoekende staat
      aan strafrechtelijk onderzoek is onderworpen.

      2 Het strafrechtelijk financieel onderzoek kan slechts worden ingesteld, indien zulks ook mogelijk zou zijn geweest
      wanneer het feit of de feiten ter zake waarvan de persoon in de verzoekende staat wordt verdacht in Nederland
      zouden zijn begaan.

      3 Tijdens het strafrechtelijk financieel onderzoek kan inbeslagneming van voorwerpen overeenkomstig
      [artikel 94, tweede lid][ref2], en [artikel 94][ref3] slechts plaatsvinden, indien gegronde redenen bestaan voor
      de verwachting dat te dier aanzien vanwege de verzoekende vreemde staat een verzoek tot tenuitvoerlegging van een
      verbeurdverklaring of van een tot ontneming van wederrechtelijk verkregen voordeel strekkende sanctie zal worden
      gedaan.

      4 De officier van justitie zendt van zijn beschikking tot sluiting van een strafrechtelijk financieel onderzoek
      onverwijld een afschrift aan Onze Minister. Daarbij doet hij tevens mededeling van alle voor de verzoekende vreemde
      staat dienstige inlichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#AfdelingNegende
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel94
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel94a
