  - number: '16'
    text: |-
      Indien de officier van justitie, die het verzoek tot tenuitvoerlegging heeft ontvangen, van oordeel is dat het niet
      voor inwilliging vatbaar is of dat aanleiding bestaat gebruik te maken van een der in het toepasselijke verdrag
      omschreven gronden tot weigering van de tenuitvoerlegging, brengt hij dit oordeel onverwijld vergezeld van zijn
      advies ter kennis van Onze Minister, die daaromtrent beslist. De officier van justitie deelt de veroordeelde, die
      krachtens deze wet van zijn vrijheid is beroofd, onverwijld mede op welke dag hij zijn advies aan Onze Minister
      heeft uitgebracht.
    url: https://wetten.overheid.nl/BWBR0004028/2025-07-01#Artikel16
  - number: '17'
    text: |-
      1 Wanneer een vreemde staat heeft bewilligd in de tenuitvoerlegging van een door deze opgelegde sanctie in
      Nederland, stelt Onze Minister de door de autoriteiten van die staat overgelegde stukken in handen van de officier
      van justitie in het arrondissement waarin de veroordeelde zijn vaste woon- of verblijfplaats heeft, of bij gebreke
      daarvan in die van de officier van justitie bij het arrondissementsparket Amsterdam.

      2 Is de veroordeelde een in [artikel 2 van de Wet militaire strafrechtspraak][ref1] bedoelde persoon, dan zendt
      Onze Minister de stukken toe aan de officier van justitie in het arrondissement waarin de rechtbank is gelegen die
      ingevolge [die wet][ref2] bevoegd is over die persoon rechtsmacht uit te oefenen.


      [ref1]: https://wetten.overheid.nl/BWBR0004789#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0004789
    url: https://wetten.overheid.nl/BWBR0004028/2025-07-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0004789
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0004789
  - number: '18'
    text: |-
      1 De officier van justitie vordert binnen twee weken na de dag waarop hij de in [artikel 15][ref1] of [17][ref2]
      bedoelde stukken heeft ontvangen, schriftelijk, dat de rechtbank verlof verleent tot tenuitvoerlegging. Bij zijn
      vordering legt de officier van justitie de stukken aan de rechtbank over. Een afschrift van de vordering wordt
      aan de veroordeelde betekend. Bij zijn vordering legt de officier van justitie tevens een lijst van voorwerpen of
      vorderingen over, die ingevolge [afdeling B van Hoofdstuk II][ref3] zijn in beslag genomen.

      2 De in het eerste lid gestelde termijn wordt geschorst van het tijdstip waarop de officier van justitie
      overeenkomstig [artikel 16][ref4] adviseert aan Onze Minister tot het tijdstip waarop de officier van justitie van
      Onze Minister bericht ontvangt dat de tenuitvoerlegging dient te worden gevorderd.

      3 Indien de veroordeelde ingevolge deze wet van zijn vrijheid is beroofd, eindigt de schorsing in elk geval na
      veertien dagen.

      4 Het in de vorige leden bepaalde is niet van toepassing indien de ten uitvoer te leggen sanctie uitsluitend
      bestaat uit een geldboete.


      [ref1]: https://wetten.overheid.nl/BWBR0004028#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0004028#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0004028#HoofdstukII
      [ref4]: https://wetten.overheid.nl/BWBR0004028#Artikel16
