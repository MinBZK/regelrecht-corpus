  - number: '47'
    text: |-
      1 Aan de veroordeelde die overeenkomstig [artikel 45][ref1] rechtsgeldig verzet heeft gedaan met het oog op een
      behandeling daarvan in Nederland wordt zo spoedig mogelijk een dagvaarding om ter terechtzitting van het in die
      dagvaarding aangeduide gerecht te verschijnen bij aangetekend schrijven toegezonden of in persoon betekend.

      2 Verschijnt hij ten dienenden dage niet in rechte, dan wordt het verzet vervallen verklaard en vindt
      [afdeling C][ref2], onderscheidenlijk [afdeling D][ref3], toepassing, tenzij de rechter, bij niet-verschijning van
      de veroordeelde, schorsing van het onderzoek heeft bevolen teneinde deze, indien hij verhinderd was het onderzoek
      bij te wonen, daartoe alsnog in de gelegenheid te stellen.

      3 Indien de veroordeelde die in verzet is gekomen ten dienenden dage verschijnt wordt voor de toepassing van het
      Nederlandse recht de buitenlandse rechterlijke beslissing als vervallen beschouwd en de zaak overeenkomstig het
      [Wetboek van Strafvordering][ref4] behandeld.


      [ref1]: https://wetten.overheid.nl/BWBR0004028#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0004028#HoofdstukIII
      [ref3]: https://wetten.overheid.nl/BWBR0004028#HoofdstukIII
      [ref4]: https://wetten.overheid.nl/BWBR0001903
