        artikel: 27a
  - number: '20'
    text: |-
      1 De in [artikel 18][ref1] bedoelde vordering wordt bij de politierechter aanhangig gemaakt, tenzij naar het
      aanvankelijk oordeel van de officier van justitie

      a. de zaak niet van eenvoudige aard is, bepaaldelijk ten aanzien van de beoordeling van de strafbaarheid van het
      feit of van de veroordeelde naar Nederlands recht, of

      b. door de rechtbank een vrijheidsstraf dient te worden opgelegd waarvan het alsnog in Nederland ten uitvoer te
      leggen gedeelte de duur van een jaar overschrijdt.

      2 De politierechter is bevoegd ingevolge deze wet vrijheidsstraf van meer dan een jaar op te leggen, mits het in
      Nederland ten uitvoer te leggen gedeelte van die straf de duur van een jaar niet overschrijdt.

      3 Indien de politierechter oordeelt, dat de zaak door een meervoudige kamer van de rechtbank moet worden behandeld,
      verwijst hij de zaak daar heen. De zaak wordt alsdan op de bestaande vordering door de meervoudige kamer verder
      behandeld.


      [ref1]: https://wetten.overheid.nl/BWBR0004028#Artikel18
    url: https://wetten.overheid.nl/BWBR0004028/2025-07-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0004028
        artikel: '18'
        hoofdstuk: III
        afdeling: C
  - number: '21'
    text: |-
      1 De in [artikel 18][ref1] bedoelde vordering wordt, indien de veroordeelde op dat tijdstip de leeftijd van
      achttien jaren nog niet heeft bereikt, bij de kinderrechter aanhangig gemaakt, tenzij naar het aanvankelijk oordeel
      van de officier van justitie en de kinderrechter

      a. de zaak niet van eenvoudige aard is, bepaaldelijk ten aanzien van de beoordeling van de strafbaarheid van het
      feit of van de veroordeelde naar Nederlands recht, of

      b. door de rechtbank een vrijheidsstraf dient te worden opgelegd waarvan het alsnog in Nederland ten uitvoer te
      leggen gedeelte de duur van zes maanden overschrijdt.

      Maakt de officier van justitie zijn vordering bij de meervoudige kamer aanhangig, dan neemt de kinderrechter aan
      het onderzoek ter terechtzitting deel.

      2 De kinderrechter is bevoegd ingevolge deze wet vrijheidsstraf van meer dan zes maanden op te leggen, mits het in
      Nederland ten uitvoer te leggen gedeelte van die straf de duur van zes maanden niet overschrijdt.

      3 Indien de kinderrechter oordeelt dat de zaak door een meervoudige kamer van de rechtbank moet worden behandeld,
      verwijst hij de zaak daar heen. De zaak wordt alsdan op de bestaande vordering door de meervoudige kamer verder
      behandeld. De kinderrechter neemt aan het onderzoek ter terechtzitting deel.


      [ref1]: https://wetten.overheid.nl/BWBR0004028#Artikel18
    url: https://wetten.overheid.nl/BWBR0004028/2025-07-01#Artikel21
    references:
