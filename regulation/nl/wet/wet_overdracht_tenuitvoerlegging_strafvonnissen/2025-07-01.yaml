  - number: '67'
    text: |-
      In gevallen waarin onherroepelijk is vastgesteld dat tenuitvoerlegging van een buitenlandse rechterlijke beslissing
      in Nederland niet behoort plaats te vinden kan de rechtbank, die de zaak heeft behandeld, op verzoek van de
      veroordeelde hem een vergoeding ten laste van de staat toekennen voor schade die hij heeft geleden en kosten die
      hij heeft gemaakt ten gevolge van voorlopige vrijheidsbeneming bevolen krachtens deze wet. Onder schade is begrepen
      het nadeel dat niet in vermogensschade bestaat.

      De [artikelen 533, derde, vierde en zesde lid][ref1], [529][ref2], [530][ref3],
      [534 tot en met 536 van het Wetboek van Strafvordering][ref4] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel533
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel529
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel530
