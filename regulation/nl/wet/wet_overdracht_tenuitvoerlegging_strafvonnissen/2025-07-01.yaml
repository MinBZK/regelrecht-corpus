        artikel: '18'
        hoofdstuk: III
        afdeling: C
  - number: '22'
    text: |-
      Betreft de in [artikel 18][ref1] bedoelde vordering een in [artikel 2 van de Wet militaire strafrechtspraak][ref2]
      bedoelde persoon, dan geschiedt de behandeling daarvan, overeenkomstig het bepaalde in [artikel 20][ref3], voor
      de militaire politierechter dan wel de militaire kamer van de rechtbank, die ingevolge die wet bevoegd is over die
      persoon rechtsmacht uit te oefenen.


      [ref1]: https://wetten.overheid.nl/BWBR0004028#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0004789#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0004028#Artikel20
    url: https://wetten.overheid.nl/BWBR0004028/2025-07-01#Artikel22
