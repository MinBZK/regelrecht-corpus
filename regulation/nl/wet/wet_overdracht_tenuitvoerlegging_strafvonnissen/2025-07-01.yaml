  - number: '32'
    text: |-
      1 Tegen de uitspraak van de rechtbank betreffende het verzoek tot tenuitvoerlegging kan zowel door de officier van
      justitie als door de veroordeelde beroep in cassatie worden ingesteld.

      2 Van verklaringen waarbij afstand wordt gedaan van het recht om beroep in cassatie in te stellen, of waarbij een
      zodanig beroep wordt ingetrokken, geeft de griffier van de rechtbank onverwijld kennis aan Onze Minister.

      3 De officier van justitie is, op straffe van niet-ontvankelijkheid, verplicht om binnen een maand nadat hij beroep
      in cassatie heeft ingesteld, bij de Hoge Raad een schriftuur in te dienen, houdende zijn middelen van cassatie.

      4 De veroordeelde die cassatieberoep heeft ingesteld, is op straffe van niet-ontvankelijkheid verplicht om vóór
      de dienende dag bij de Hoge Raad door zijn raadsman een schriftuur te doen indienen, houdende zijn middelen van
      cassatie.

      5 De voorzitter bepaalt na overleg met de procureur-generaal de rechtsdag. De procureur-generaal doet de dag
      voor de behandeling van het beroep bepaald ten minste acht dagen vóór de rechtsdag aanzeggen aan de veroordeelde.
      Deze termijn kan, met toestemming van de veroordeelde, worden bekort indien van die toestemming blijkt op
      overeenkomstige wijze als bepaald in [artikel 265, tweede lid, van het Wetboek van Strafvordering][ref1]. Bij
      gebreke van tijdige aanzegging wordt door de Hoge Raad de aanzegging van een nieuwe rechtsdag bevolen, tenzij voor
      de veroordeelde een raadsman is verschenen. In dat laatste geval kan op diens verzoek uitstel worden verleend.

      6 In de gevallen waarin op de zitting de behandeling van het beroep voor een bepaalde tijd wordt uitgesteld of
      geschorst, heeft geen nieuwe aanzegging aan de veroordeelde plaats.

      7 De [artikelen 431][ref2], [432][ref3], [432a][ref4], [434, eerste lid][ref5], [438][ref6], [439][ref7],
      [440, eerste lid][ref8], [441][ref9], [442][ref10], [443][ref11], [444][ref12], [449, eerste lid][ref13],
      [450][ref14], [451][ref15], [451a][ref16], [452][ref17], [453][ref18], [454, eerste, tweede en derde lid][ref19],
      [455, eerste lid][ref20], en [456 van het Wetboek van Strafvordering][ref21] zijn van overeenkomstige toepassing.

      8 Indien de uitspraak waartegen beroep is ingesteld is gedaan door een enkelvoudige kamer, wordt het beroep in
      cassatie behandeld door een uit drie raadsheren bestaande Kamer van de Hoge Raad.

      9 Indien de uitspraak van de rechtbank geheel of gedeeltelijk wordt vernietigd doet de Hoge Raad in geval dat
      mogelijk is zelf de zaak af. Indien de Hoge Raad de zaak niet zelf kan afdoen kan hij deze hetzij terugwijzen
      naar de rechtbank, wier uitspraak vernietigd is, hetzij verwijzen naar een andere rechtbank. Alsdan vinden de
      [artikelen 18-28][ref22], [29, tweede lid][ref23], [30][ref24] en [31][ref25] en de voorgaande leden van dit
      artikel wederom toepassing.

      10 De Hoge Raad zendt aan Onze Minister onverwijld een gewaarmerkt afschrift van zijn arrest toe.

      11 Indien de Hoge Raad de zaak verwijst naar een andere rechtbank blijft een krachtens [artikel 29][ref26] bevolen
      vrijheidsbeneming, onverminderd het bepaalde in het laatste lid van dat artikel, van kracht tot het tijdstip waarop
      die rechtbank over de gevangenhouding beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel265
