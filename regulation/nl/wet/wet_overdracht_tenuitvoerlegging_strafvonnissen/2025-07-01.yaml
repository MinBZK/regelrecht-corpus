  - number: '12'
    text: |-
      Van elke beslissing naar aanleiding van een verzoek van een autoriteit van een vreemde staat, genomen krachtens een
      der [artikelen 8][ref1]-[11][ref2], wordt onverwijld kennis gegeven aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0004028#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0004028#Artikel11
