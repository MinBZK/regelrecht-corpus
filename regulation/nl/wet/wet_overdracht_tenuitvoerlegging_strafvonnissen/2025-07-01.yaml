        artikel: '20'
        hoofdstuk: III
        afdeling: C
  - number: '23'
    text: |-
      De politierechter, de kinderrechter en de militaire politierechter bezitten elk de bevoegdheden die aan de
      voorzitter van een meervoudige kamer van de rechtbank toekomen.
    url: https://wetten.overheid.nl/BWBR0004028/2025-07-01#Artikel23
  - number: '24'
    text: |-
      1 Zo spoedig mogelijk na ontvangst van de in [artikel 18][ref1] bedoelde vordering bepaalt de voorzitter van de
      rechtbank het tijdstip waarop de rechtbank een aanvang zal maken met de behandeling van de vordering. Tussen de dag
      waarop de mededeling om ter terechtzitting te verschijnen aan de veroordeelde is betekend en die der terechtzitting
      moet een termijn van ten minste tien dagen verlopen.

      2 Met toestemming van de veroordeelde kan deze termijn worden verkort, mits van deze toestemming uit een
      schriftelijke verklaring blijkt.


      [ref1]: https://wetten.overheid.nl/BWBR0004028#Artikel18
    url: https://wetten.overheid.nl/BWBR0004028/2025-07-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0004028
        artikel: '18'
        hoofdstuk: III
        afdeling: C
  - number: '25'
    text: |-
      De griffier van de rechtbank doet onverwijld aan de officier van justitie en aan de veroordeelde mededeling van
      het tijdstip dat voor de behandeling van de vordering is bepaald. Daarbij wordt de veroordeelde die geen raadsman
      heeft, gewezen op het recht op bijstand van een raadsman en het recht op kennisneming van de processtukken, bedoeld
      in [artikel 64, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004028#Artikel64
    url: https://wetten.overheid.nl/BWBR0004028/2025-07-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0004028
        artikel: '64'
        hoofdstuk: V
  - number: '26'
    text: |-
      1 De officier van justitie en de veroordeelde zijn bevoegd ten behoeve van het onderzoek dat de rechtbank ingevolge
      deze wet heeft te verrichten en de beslissingen die zij heeft te nemen getuigen en deskundigen te doen oproepen.

      2 De officier van justitie kan bij met redenen omklede beslissing weigeren getuigen of deskundigen op te
      roepen, indien redelijkerwijs moet worden aangenomen dat deze door de veroordeelde zijn opgegeven ten einde ter
      terechtzitting verklaringen af te leggen ter betwisting van feiten, als bedoeld in [artikel 28, derde lid][ref1].
      De beslissing wordt onverwijld schriftelijk ter kennis van de veroordeelde gebracht. Hij wordt daarbij opmerkzaam
      gemaakt op het bepaalde in [artikel 28, zesde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004028#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0004028#Artikel28
