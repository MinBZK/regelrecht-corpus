  - number: '38'
    text: |-
      1 Indien de officier van justitie, aan wie op de voet van het bepaalde in [artikel 15][ref1] een verzoek in handen
      is gesteld tot overneming van de uitoefening van toezicht op de naleving van voorwaarden, in een vreemde staat
      aan de veroordeelde opgelegd, van oordeel is dat het geheel of gedeeltelijk niet voor inwilliging vatbaar is of
      dat aanleiding bestaat gebruik te maken van een der in het toepasselijke verdrag omschreven gronden tot weigering,
      brengt hij dit oordeel onverwijld vergezeld van zijn advies ter kennis van Onze Minister, die daaromtrent beslist.

      2 Indien aan het verzoek geheel of gedeeltelijk gevolg wordt gegeven, wordt de kennisgeving van dit besluit aan de
      veroordeelde in persoon betekend. Van zijn beslissing geeft de officier van justitie bericht aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0004028#Artikel15
    url: https://wetten.overheid.nl/BWBR0004028/2025-07-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0004028
        artikel: '15'
        hoofdstuk: III
        afdeling: A
  - number: '39'
    text: |-
      Indien de officier van justitie termen aanwezig acht om een opdracht te geven tot het verlenen van hulp en steun
      aan de veroordeelde, wijst hij de daarmee te belasten reclasseringsinstelling aan. Alvorens te beslissen wint hij
      het advies van deze instelling in.
    url: https://wetten.overheid.nl/BWBR0004028/2025-07-01#Artikel39
  - number: '40'
    text: |-
      1 Het te houden toezicht strekt zich niet uit over de naleving van bijzondere voorwaarden, gesteld bij de
      beslissing die aan het verzoek ten grondslag ligt, welke in strijd zijn met het Nederlandse recht.

      2 Het toezicht wordt uitgeoefend met inachtneming van het bij of krachtens de [artikelen 6:1:15][ref1],
      [6:1:18][ref2] en [6:3:14 van het Wetboek van Strafvordering][ref3] bepaalde.

      3 De aanvang en duur van de proeftijd worden bepaald naar het recht van de verzoekende staat. De proeftijd duurt in
      geen geval langer dan zij naar Nederlands recht had kunnen duren.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel6115
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel6118
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel6314
