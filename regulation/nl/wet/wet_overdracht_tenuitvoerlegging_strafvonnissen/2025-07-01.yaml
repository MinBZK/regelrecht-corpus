  - number: 43c
    text: |-
      1 Indien Onze Minister het verzoek tot tenuitvoerlegging heeft ingewilligd, geeft hij de aanwijzing tot
      tenuitvoerlegging of verdere tenuitvoerlegging van de in de vreemde staat opgelegde vrijheidsbenemende sanctie
      in Nederland.

      2 De tenuitvoerlegging van de in het eerste lid bedoelde sanctie geschiedt op last van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0004028/2025-07-01#Artikel43c
  - number: '44'
    text: |-
      Verzoeken, bedoeld in afdeling D, par. 2, die betrekking hebben op bij verstek gewezen rechterlijke beslissingen
      zijn niet voor inwilliging vatbaar, tenzij de beslissing in hoger beroep is gewezen en het rechtsmiddel van hoger
      beroep door de veroordeelde tegen een op tegenspraak gewezen vonnis werd ingesteld.
    url: https://wetten.overheid.nl/BWBR0004028/2025-07-01#Artikel44
  - number: '45'
    text: |-
      1 Een verzoek om tenuitvoerlegging van een in de verzoekende staat bij verstek gewezen rechterlijke beslissing
      kan niet in behandeling worden genomen dan nadat deze beslissing vanwege de officier van justitie, die het verzoek
      heeft ontvangen, aan de veroordeelde in persoon is betekend. Betekening vindt niet plaats indien het recht tot
      strafvervolging ter zake van het feit waarvoor de beslissing werd gewezen naar Nederlands recht zou zijn verjaard,
      met dien verstande, dat handelingen, verricht in de verzoekende staat, die de verjaring aldaar stuiten of schorsen,
      in Nederland dezelfde rechtskracht hebben. Van de betekening worden de autoriteiten van de staat, waarvan het
      verzoek is uitgegaan, schriftelijk in kennis gesteld.

      2 Voor zover een verdrag daarin voorziet, kan de veroordeelde tegen een bij verstek gewezen rechterlijke
      beslissing, als bedoeld in het vorige lid, verzet doen bij de rechtbank van het arrondissement waarin hij zijn
      woonplaats heeft of daadwerkelijk verblijft, gedurende een door het toepasselijke verdrag bepaalde termijn na de
      betekening. Is de veroordeelde een persoon als bedoeld in [artikel 2 van de Wet militaire strafrechtspraak][ref1]
      dan kan deze verzet doen bij de rechtbank, welke ingevolge die wet bevoegd is over die persoon rechtsmacht uit
      te oefenen.

      3 Verzet wordt gedaan door een verklaring, af te leggen door de veroordeelde op het parket van het openbaar
      ministerie bij de in het vorige lid bedoelde rechtbank of bij aangetekende brief aan dat parket, houdende - op
      straffe van niet-ontvankelijkheid - de vermelding van de woon- of verblijfplaats van de veroordeelde, alwaar
      gerechtelijke stukken aan hem kunnen worden uitgereikt. In geval van verzet bij aangetekende brief geldt als
      dag van verzet de dag van ontvangst van de brief ten parkette. De [artikelen 450][ref2] en [451][ref3] zijn van
      overeenkomstige toepassing.

      4 De officier van justitie stelt iedere tijdig afgelegde verklaring of ontvangen brief, bedoeld
      in het vorige lid, ter hand van de griffier, die daarmee handelt overeenkomstig het bepaalde in
      [artikel 451 van het Wetboek van Strafvordering][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0004789#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel450
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel451a
      [ref4]: https://wetten.overheid.nl/BWBR0001903#Artikel451
    url: https://wetten.overheid.nl/BWBR0004028/2025-07-01#Artikel45
