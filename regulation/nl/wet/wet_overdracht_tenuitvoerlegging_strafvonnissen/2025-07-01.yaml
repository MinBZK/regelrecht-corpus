  - number: 13f
    text: |-
      1 Tot het in behandeling nemen van verzoeken als bedoeld in deze afdeling is bevoegd de officier van justitie
      in het arrondissement waar de gevraagde handeling moet worden verricht. Indien handelingen in meer dan één
      arrondissement moeten worden verricht, is in elk van die arrondissementen de officier van justitie tot het in
      behandeling nemen van het gehele verzoek bevoegd. De officier van justitie die het gehele verzoek in behandeling
      heeft genomen roept voor de uitvoering ervan zo nodig de tussenkomst in van het openbaar ministerie in andere
      rechtsgebieden. In het belang van een doelmatige afdoening kan hij ook de behandeling van het verzoek overdragen
      aan zijn ambtgenoot in een ander arrondissement.

      2 Verzoeken als bedoeld in deze afdeling worden, zo zij niet tot een officier van justitie zijn gericht, door
      de geadresseerde onverwijld doorgezonden aan de officier van justitie in het arrondissement waar de gevraagde
      handeling moet worden verricht of waarin het verzoek is ontvangen.

      3 Klaagschriften als bedoeld in [artikel 552][ref1], alsmede rechtsgedingen als bedoeld in [artikel 552][ref2],
      dienen te worden aanhangig gemaakt bij de rechtbank van het arrondissement bij welke de officier van justitie is
      geplaatst bij wie het gehele verzoek in behandeling is.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel552a
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel552c
