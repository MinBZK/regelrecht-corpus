  - number: '19'
    text: |-
      1 De officier van justitie kan naar regelen te stellen bij algemene maatregel van bestuur de
      medewerking inroepen van personen en lichamen, welke op het gebied van de reclassering of op dergelijk
      gebied werkzaam zijn, en aan deze de nodige opdrachten geven. De personen of lichamen, belast met
      de uitvoering van de opdrachten, stellen de identiteit van de verdachte vast op de wijze, bedoeld in
      [artikel 27a, eerste lid, eerste volzin, en tweede lid, van het Wetboek van Strafvordering][ref1], tenzij de
      opdrachten in een inrichting worden uitgevoerd.

      2 Heeft de veroordeelde de leeftijd van achttien jaren nog niet bereikt, dan wint de officier van justitie omtrent
      diens persoonlijkheid en levensomstandigheden inlichtingen in bij de raad voor de kinderbescherming. De laatste
      volzin van het eerste lid is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel27a
    url: https://wetten.overheid.nl/BWBR0004028/2025-07-01#Artikel19
    references:
