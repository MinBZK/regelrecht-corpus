        afdeling: A
  - number: '10'
    text: |-
      1 De rechter-commissaris, belast met de behandeling van strafzaken in de rechtbank van het arrondissement waarin
      de veroordeelde overeenkomstig [artikel 9][ref1] in verzekering is gesteld, kan, op vordering van de officier van
      justitie bij die rechtbank, de bewaring van de veroordeelde bevelen.

      2 Alvorens een bevel ingevolge het vorige lid te geven, hoort de rechter-commissaris zo mogelijk de veroordeelde.


      [ref1]: https://wetten.overheid.nl/BWBR0004028#Artikel9
    url: https://wetten.overheid.nl/BWBR0004028/2025-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0004028
        artikel: '9'
        hoofdstuk: II
        afdeling: A
  - number: '11'
    text: |-
      1 De bewaring kan worden gelast voor een termijn van ten hoogste veertien dagen. Zij kan op vordering van de
      officier van justitie telkens met een termijn van ten hoogste dertig dagen worden verlengd, totdat de rechtbank
      ingevolge [artikel 29, tweede lid][ref1], over de gevangenhouding beslist.

      2 De veroordeelde wiens bewaring is gelast wordt, behoudens de mogelijkheid van vrijheidsbeneming uit anderen
      hoofde, in vrijheid gesteld:

      a. zodra zulks door de rechtbank, de rechter-commissaris of de officier van justitie ambtshalve of op verzoek van
      de veroordeelde of diens raadsman wordt gelast;

      b. zodra de bewaring veertien dagen heeft geduurd en de officier van justitie de in de[ artikelen 15][ref2] of
      [17][ref3] bedoelde stukken niet heeft ontvangen;

      c. indien de duur van de inverzekeringstelling en de bewaring die van het voor tenuitvoerlegging vatbare gedeelte
      van de in de vreemde staat opgelegde sanctie zou overtreffen.


      [ref1]: https://wetten.overheid.nl/BWBR0004028#Artikel29
