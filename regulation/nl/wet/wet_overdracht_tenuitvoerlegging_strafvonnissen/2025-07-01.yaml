  - number: '43'
    text: |-
      1 Voor zover een verdrag daarin uitdrukkelijk voorziet, kan op aanwijzing van Onze Minister de tenuitvoerlegging
      of verdere tenuitvoerlegging van een in een vreemde staat opgelegde vrijheidsbenemende sanctie in Nederland
      plaatsvinden buiten toepassing van de afdelingen A, B en C van dit hoofdstuk, maar met inachtneming van het
      bepaalde in deze paragraaf.

      2 De in het vorige lid bedoelde aanwijzing kan, voor zover het toepasselijke verdrag bepaalt dat de instemming
      van de veroordeelde of diens wettelijke vertegenwoordiger met zijn overbrenging naar Nederland met het oog op de
      tenuitvoerlegging of voortgezette tenuitvoerlegging is vereist, slechts worden gegeven indien die instemming uit
      een schriftelijk stuk blijkt.
    url: https://wetten.overheid.nl/BWBR0004028/2025-07-01#Artikel43
  - number: 43a
    text: |-
      1 Tenzij Onze Minister, met inachtneming van het toepasselijke verdrag, reeds aanstonds van oordeel is dat het
      verzoek om tenuitvoerlegging moet worden afgewezen, doet hij het verzoek met de daarbij behorende stukken toekomen
      aan de advocaat-generaal.

      2 Indien de door de vreemde staat overgelegde stukken naar het oordeel van Onze Minister onvoldoende zijn om op het
      verzoek een beslissing te nemen, biedt hij de autoriteiten van de verzoekende staat de gelegenheid binnen een door
      hem te stellen redelijke termijn aanvullende stukken of inlichtingen te verschaffen.

      3 De advocaat-generaal legt het verzoek met de daarbij behorende stukken onverwijld voor aan de bijzondere kamer
      van het gerechtshof Arnhem-Leeuwarden, bedoeld in [artikel 67 van de Wet op de rechterlijke organisatie][ref1]. De
      advocaat-generaal dient eventuele opmerkingen bij voornoemde stukken in binnen een termijn van veertien dagen nadat
      hij de stukken heeft voorgelegd aan de bijzondere kamer van het gerechtshof.

      4 Hangende de beslissing op het verzoek tot tenuitvoerlegging, kan de veroordeelde voorlopig worden aangehouden met
      toepassing van de [artikelen 8 tot en met 12][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel67
      [ref2]: https://wetten.overheid.nl/BWBR0004028#Artikel8
    url: https://wetten.overheid.nl/BWBR0004028/2025-07-01#Artikel43a
