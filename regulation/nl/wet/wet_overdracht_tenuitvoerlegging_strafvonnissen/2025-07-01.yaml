        artikel: 29c
  - number: '53'
    text: |-
      1 Onze Minister geeft het openbaar ministerie, dat een advies als bedoeld in [artikel 51][ref1] heeft uitgebracht,
      schriftelijk kennis van de beslissing die hij terzake heeft genomen alsmede van de door hem ontvangen mededelingen
      omtrent beslissingen van de autoriteiten van de vreemde staat naar aanleiding van het verzoek tot tenuitvoerlegging
      of tot overname van toezicht dat op advies van het openbaar ministerie is gedaan.

      2 Een aan de autoriteiten van een vreemde staat gedaan verzoek tot tenuitvoerlegging of tot overname van
      toezicht kan uiterlijk tot de ontvangst van een kennisgeving omtrent de daarop in die staat genomen beslissing
      worden ingetrokken, onverminderd het bepaalde in artikel 36, tweede lid, van het Benelux-verdrag inzake de
      tenuitvoerlegging van rechterlijke beslissingen in strafzaken.


      [ref1]: https://wetten.overheid.nl/BWBR0004028#Artikel51
    url: https://wetten.overheid.nl/BWBR0004028/2025-07-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0004028
        artikel: '51'
        hoofdstuk: IV
        afdeling: A
  - number: '54'
    text: |-
      Degene tegen wie in Nederland bij verstek uitspraak is gedaan, houdende de oplegging van een straf of maatregel of
      een gedeeltelijke beslissing als bedoeld in § 5 van Hoofdstuk I van het Benelux-verdrag inzake de tenuitvoerlegging
      van rechterlijke beslissingen in strafzaken, kan, wanneer een verzoek tot tenuitvoerlegging of aanvulling daarvan
      is gedaan aan de autoriteiten van een vreemde staat, ook als de einduitspraak reeds kracht van gewijsde heeft
      gekregen, tegen die uitspraak verzet doen tot het verstrijken van een door het toepasselijke verdrag bepaalde
      termijn nadat de uitspraak hem door de autoriteiten van die staat in persoon is betekend. Zulk verzet kan slechts
      worden gedaan op overeenkomstig de in de wetgeving van de aangezochte staat voorgeschreven wijze bij de bevoegde
      autoriteiten van die staat.
    url: https://wetten.overheid.nl/BWBR0004028/2025-07-01#Artikel54
  - number: '55'
    text: |-
      1 Zodra van de autoriteiten van de aangezochte staat de akte is ontvangen, waaruit blijkt van een rechtsgeldig
      gedaan verzet, wordt aan degene die in verzet is gekomen een dagvaarding om ter terechtzitting van het gerecht
      dat de uitspraak heeft gedaan te verschijnen in persoon betekend. Op straffe van nietigheid wordt tussen de dag
      waarop de dagvaarding is betekend en die ter terechtzitting een termijn van tenminste eenentwintig dagen of zoveel
      minder als het toepasselijke verdrag toelaat in acht genomen. Met toestemming van de gedagvaarde kan deze termijn
      worden verkort, mits van deze toestemming uit een schriftelijke verklaring blijkt. Vrijwillige verschijning op een
      dagvaarding betekend in strijd met de voorschriften van dit artikel dekt de nietigheid.

      2 Indien de gedagvaarde niet ten dienenden dage in rechte verschijnt wordt het verzet vervallen verklaard, tenzij
      de rechter bij niet-verschijning schorsing van het onderzoek heeft bevolen teneinde deze, indien hij verhinderd
      was het onderzoek bij te wonen, daartoe alsnog in de gelegenheid te stellen. Het openbaar ministerie geeft van een
      vervallen verklaard verzet zo spoedig mogelijk schriftelijk kennis aan de autoriteiten van de aangezochte staat en
      aan Onze Minister.

      3 Indien degene die in verzet is gekomen ter terechtzitting verschijnt wordt de zaak overeenkomstig
      [titel VI][ref1], [VII][ref2] of [VIII van het Tweede Boek van het Wetboek van Strafvordering][ref3] behandeld,
      als ware het rechtsgeding bij verstek niet voorafgegaan. De rechter bekrachtigt de bij verstek gewezen uitspraak of
      doet met gehele of gedeeltelijke vernietiging van die uitspraak opnieuw recht.


      [ref1]: https://wetten.overheid.nl/BWBR0001903
      [ref2]: https://wetten.overheid.nl/BWBR0001903
      [ref3]: https://wetten.overheid.nl/BWBR0001903
    url: https://wetten.overheid.nl/BWBR0004028/2025-07-01#Artikel55
