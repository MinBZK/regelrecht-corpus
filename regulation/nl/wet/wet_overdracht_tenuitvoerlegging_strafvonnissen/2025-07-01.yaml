  - number: '46'
    text: |-
      1 Indien de veroordeelde overeenkomstig [artikel 45][ref1] rechtsgeldig verzet heeft gedaan met het oog op een
      behandeling daarvan in de verzoekende staat, doet de griffier de akte van verzet onverwijld toekomen aan Onze
      Minister ter doorzending aan de verzoekende staat.

      2 Indien de veroordeelde overeenkomstig [artikel 45][ref2] rechtsgeldig verzet heeft gedaan met het oog op een
      behandeling daarvan in Nederland, wordt het verzoek om tenuitvoerlegging van het in de verzoekende staat bij
      verstek gewezen vonnis beschouwd als een door Onze Minister ingewilligd en op een verdrag gegrond verzoek tot
      strafvervolging.


      [ref1]: https://wetten.overheid.nl/BWBR0004028#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0004028#Artikel45
