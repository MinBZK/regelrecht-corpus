        afdeling: A
  - number: '30'
    text: |-
      1 Bevindt de rechtbank:

      a. dat de overgelegde stukken niet voldoen aan de door het toepasselijke verdrag gestelde eisen;

      b. dat de veroordeelde zich met vrucht op een grond, die naar Nederlands recht wel, doch naar het recht van
      de vreemde staat niet de strafbaarheid van het feit of de dader uitsluit, had kunnen beroepen, en dat hij geen
      gedwongen psychiatrische verpleging behoeft;

      c. dat de tenuitvoerlegging in Nederland op grond van het in een der in de[ artikelen 2][ref1], [3][ref2],
      [4][ref3], [6][ref4] of [7][ref5] bepaalde niet kan plaatshebben; of,

      d. in een geval waarin volgens het toepasselijke verdrag tenuitvoerlegging kan worden geweigerd, dat bij afweging
      van alle betrokken belangen een beslissing tot tenuitvoerlegging in Nederland in redelijkheid niet kan worden
      genomen;

      dan verklaart zij de tenuitvoerlegging ontoelaatbaar.

      2 De officier van justitie kan, zolang het onderzoek ter terechtzitting niet is gesloten, zijn vordering intrekken.
      Hij stelt de veroordeelde van het intrekken van de vordering terstond in kennis.

      3 In andere dan de in de vorige leden voorziene gevallen verklaart de rechtbank de
      tenuitvoerlegging toelaatbaar, zulks met vermelding van de toepasselijke wets- en
      verdragsbepalingen. De [artikelen 345, met uitzondering van het vierde lid][ref6], [346][ref7] en
      [347 van het Wetboek van Strafvordering][ref8] vinden overeenkomstige toepassing.

      4 Indien de vordering is behandeld door een enkelvoudige kamer van de rechtbank vinden de
      [artikelen 378-381 van het Wetboek van Strafvordering][ref9] overeenkomstige toepassing, behoudens voor zover
      deze artikelen betrekking hebben op een getuige wiens identiteit niet of slechts ten dele blijkt. Is de vordering
      behandeld door een meervoudige kamer, dan vindt [artikel 362][ref10] van dat Wetboek overeenkomstige toepassing.

      5 De [artikelen 363 tot en met 365, eerste tot en met vijfde lid, van het Wetboek van Strafvordering][ref11] zijn
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004028#Artikel2
