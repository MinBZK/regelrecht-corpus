  - number: '37'
    text: |-
      Indien tot tenuitvoerlegging van vervangende hechtenis moet worden overgegaan doet de officier van
      justitie met het oog daarop een vordering overeenkomstig [artikel 18][ref1], tenzij de rechtbank krachtens
      [artikel 35, zevende lid][ref2], de duur van de vervangende hechtenis reeds heeft bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0004028#Artikel18
