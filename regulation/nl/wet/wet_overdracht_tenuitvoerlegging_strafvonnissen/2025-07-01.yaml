  - number: '33'
    text: |-
      Zodra de rechterlijke uitspraak betreffende de toelaatbaarheid van de tenuitvoerlegging in kracht van gewijsde is
      gegaan, geeft de griffier van het gerecht dat de zaak het laatst heeft behandeld daarvan kennis aan Onze Minister.
      De tenuitvoerlegging van een op grond van [artikel 31][ref1] opgelegde straf of maatregel geschiedt op last van
      Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0004028#Artikel31
