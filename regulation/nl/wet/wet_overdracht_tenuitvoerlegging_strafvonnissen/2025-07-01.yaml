  - number: '31'
    text: |-
      1 De rechtbank, de tenuitvoerlegging toelaatbaar achtende, verleent verlof tot tenuitvoerlegging van de
      buitenlandse rechterlijke beslissing en legt, met inachtneming van het daaromtrent in het toepasselijke verdrag
      voorgeschrevene, de straf of maatregel op, welke op het overeenkomstige feit naar Nederlands recht is gesteld.
      De uitspraak van de rechtbank wordt met redenen omkleed. De uitspraak geeft voorts de bijzondere redenen op,
      die de straf hebben bepaald of tot de maatregel hebben geleid en voorts zoveel mogelijk de omstandigheden,
      waarop bij de vaststelling van de duur of de hoogte van de straf is gelet. De [artikelen 353][ref1] en
      [357 van het Wetboek van Strafvordering][ref2] zijn van overeenkomstige toepassing.

      2 Bij het opleggen van tijdelijke gevangenisstraf of hechtenis beveelt de rechtbank, dat de tijd gedurende welke
      de veroordeelde in de vreemde staat ter uitvoering van de hem aldaar opgelegde sanctie, met het oog op zijn
      overbrenging naar Nederland en uit hoofde van deze wet van zijn vrijheid beroofd is geweest, bij de uitvoering van
      die straf geheel in mindering zal worden gebracht. De rechtbank kan een overeenkomstig bevel geven bij het opleggen
      van een geldboete. Indien zij dit bevel geeft, bepaalt zij in haar uitspraak volgens welke maatstaf de aftrek zal
      geschieden.

      3 De rechtbank zendt aan Onze Minister onverwijld een gewaarmerkt afschrift van haar uitspraak toe.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel353
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel357
    url: https://wetten.overheid.nl/BWBR0004028/2025-07-01#Artikel31
