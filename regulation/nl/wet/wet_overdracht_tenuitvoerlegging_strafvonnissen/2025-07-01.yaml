  - number: '51'
    text: |-
      Indien het openbaar ministerie het in het belang van een goede rechtsbedeling gewenst acht, dat een vreemde staat
      een door de Nederlandse rechter opgelegde straf of maatregel ten uitvoer legt of verder ten uitvoer legt dan
      wel toezicht uitoefent op de naleving van door de Nederlandse rechter opgelegde voorwaarden, geeft het, onder
      overlegging van eventuele met het oog op de tenuitvoerlegging van belang zijnde stukken, aan Onze Minister een met
      redenen omkleed advies tot overdracht van de tenuitvoerlegging of het toezicht aan die staat.
    url: https://wetten.overheid.nl/BWBR0004028/2025-07-01#Artikel51
  - number: '52'
    text: |-
      1 Behoudens het bepaalde in het volgende lid beslist Onze Minister zo spoedig mogelijk na de ontvangst van een
      advies als bedoeld in het vorige artikel omtrent het daaraan te geven gevolg. Daarbij neemt hij, indien het verzoek
      tot tenuitvoerlegging of tot overname van toezicht op een verdrag kan worden gegrond, de bepalingen van dat verdrag
      in acht.

      2 Indien het advies van het openbaar ministerie betrekking heeft op een veroordeelde die zich in Nederland bevindt,
      aan wie een tot vrijheidsbeneming strekkende sanctie is opgelegd en die niet heeft verklaard met de overdracht van
      de tenuitvoerlegging van die sanctie in te stemmen, dan laat Onze Minister, zo hij voornemens is gevolg te geven
      aan dit advies, alvorens een beslissing te nemen de veroordeelde schriftelijk van dit advies in kennis stellen.
      Daarbij wordt de veroordeelde medegedeeld, dat hij binnen veertien dagen na ontvangst van de kennisgeving tegen het
      voornemen van Onze Minister een bezwaarschrift kan indienen bij het gerecht, dat in hoogste feitelijke instantie de
      tot vrijheidsbeneming strekkende sanctie heeft opgelegd.

      3 Zo spoedig mogelijk na ontvangst van een tijdig ingediend bezwaarschrift onderzoekt het in het vorige lid
      bedoelde gerecht of Onze Minister bij afweging van de betrokken belangen in redelijkheid tot de voorgenomen
      beslissing kan komen. De veroordeelde wordt bij het onderzoek gehoord, althans opgeroepen. Indien niet blijkt dat
      de veroordeelde reeds een raadsman heeft, geeft de voorzitter aan het bestuur van de raad voor rechtsbijstand last
      tot aanwijzing van een raadsman.

      4 De [artikelen 21–26][ref1] en [29c van het Wetboek van Strafvordering][ref2] zijn van overeenkomstige
      toepassing.

      5 Van zijn beslissing stelt het gerecht Onze Minister en de veroordeelde schriftelijk in kennis. Acht het gerecht
      het bezwaarschrift gegrond, dan geeft Onze Minister aan het advies van het openbaar ministerie tot overdracht van
      de tenuitvoerlegging geen gevolg.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel29c
    url: https://wetten.overheid.nl/BWBR0004028/2025-07-01#Artikel52
