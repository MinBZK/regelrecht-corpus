  - number: '63'
    text: |-
      Veroordeelden die overeenkomstig deze wet in verzekering of in bewaring zijn gesteld, of wier gevangenneming of
      gevangenhouding is bevolen, worden behandeld als verdachten die krachtens het [Wetboek van Strafvordering][ref1]
      aan een overeenkomstige maatregel zijn onderworpen.


      [ref1]: https://wetten.overheid.nl/BWBR0001903
    url: https://wetten.overheid.nl/BWBR0004028/2025-07-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0001903
  - number: 63a
    text: |-
      Bij de overbrenging van of naar Nederland is de bewaking van de veroordeelde opgedragen aan Nederlandse ambtenaren
      die bevoegd zijn alle dienstige maatregelen te nemen ter beveiliging van de veroordeelde en ter voorkoming van
      zijn ontvluchting.
    url: https://wetten.overheid.nl/BWBR0004028/2025-07-01#Artikel63a
  - number: '64'
    text: |-
      1 De veroordeelde heeft het recht zich door een raadsman te doen bijstaan. De [artikelen 28][ref1], [28a][ref2],
      [37][ref3], [38][ref4] en [43 tot en met 45][ref5] en [124 van het Wetboek van Strafvordering][ref6], alsmede
      het in dat wetboek bepaalde betreffende het optreden en de bevoegdheden van de raadsman en de kennisneming van
      processtukken, zijn van overeenkomstige toepassing.

      2 Indien een veroordeelde op grond van [artikel 9][ref7] wordt aangehouden, stelt de hulpofficier van
      justitie het bestuur van de raad voor rechtsbijstand hiervan in kennis, opdat het bestuur een raadsman
      aanwijst, dan wel stelt hij de door de opgeëiste persoon gekozen raadsman hiervan in kennis. De
      [artikelen 28b, eerste lid, tweede volzin][ref8], en [39 van het Wetboek van Strafvordering][ref9] zijn van
      overeenkomstige toepassing.

      3 Indien een persoon die geen raadsman heeft overeenkomstig deze wet zijn vrijheid wordt benomen – anders dan uit
      kracht van een bevel tot aanhouding, dan wel tot inverzekeringstelling of tot verlenging van de termijn daarvan
      – wijst het bestuur van de raad voor rechtsbijstand, na mededeling van de vrijheidsbeneming door het openbaar
      ministerie, een raadsman aan.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel28
