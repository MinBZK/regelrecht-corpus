preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het mede met het oog op de uitvoering door Nederland van het Benelux-
    verdrag inzake de tenuitvoerlegging van rechterlijke beslissingen in strafzaken van 26 september 1968 (Trb. 1969,
    9), het Europees Verdrag inzake de internationale geldigheid van strafvonnissen van 28 mei 1970 (Trb. 1971, 137),
    het Europees Verdrag inzake het toezicht op voorwaardelijk veroordeelden of voorwaardelijk in vrijheid gestelden
    van 30 november 1964 (Trb. 1965, 55) en het Verdrag inzake de overbrenging van gevonniste personen van 21 maart
    1983 (Trb. 1983, 74) wenselijk is te voorzien in een algemene regeling betreffende de overname en overdracht van
    de tenuitvoerlegging van strafrechtelijke beslissingen van en aan vreemde Staten, alsmede enkele wetten in verband
    daarmede te wijzigen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0004028/2025-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze wet wordt verstaan onder:

      Onze Minister: Onze Minister van Veiligheid en Justitie;

      Rechterlijke beslissing: een bij vonnis of arrest gewezen rechterlijke beslissing naar aanleiding van een strafbaar
      feit;

      Sanctie: elke bij rechterlijke beslissing opgelegde straf, met inbegrip van elke naast of in plaats van een straf
      opgelegde maatregel;

      Veroordeelde: degene aan wie een sanctie is opgelegd.

      2 Onder rechterlijke beslissing wordt mede begrepen een door een bestuurlijke autoriteit ter zake van een strafbaar
      feit genomen beslissing, houdende oplegging van een niet tot vrijheidsbeneming strekkende straf of maatregel,
      waartegen beroep op de rechter is opengesteld.
    url: https://wetten.overheid.nl/BWBR0004028/2025-07-01#Artikel1
  - number: '2'
    text: Tenuitvoerlegging in Nederland van buitenlandse rechterlijke beslissingen geschiedt niet dan krachtens een verdrag.
    url: https://wetten.overheid.nl/BWBR0004028/2025-07-01#Artikel2
  - number: '3'
    text: |-
      1 Een in een vreemde staat opgelegde sanctie kan in Nederland slechts worden ten uitvoer gelegd voor zover:

      a. de rechterlijke beslissing in die staat voor tenuitvoerlegging vatbaar is;

      b. de sanctie niet bestaat uit de betaling van proceskosten of uit een veroordeling tot schadevergoeding aan een
      benadeelde partij;

      c. de rechterlijke beslissing is gewezen ter zake van een feit dat naar Nederlands recht eveneens strafbaar is;

      d. in geval van veroordeling, de dader naar Nederlands recht eveneens strafbaar zou zijn geweest.

      2 Voor de toepassing van het vorige lid wordt een feit naar Nederlands recht strafbaar geacht, indien krachtens
      de Nederlandse wet eenzelfde inbreuk op de Nederlandse rechtsorde, als blijkens de in de vreemde staat gewezen
      rechterlijke beslissing op de rechtsorde van die staat is gemaakt, strafbaar is.
    url: https://wetten.overheid.nl/BWBR0004028/2025-07-01#Artikel3
  - number: '4'
    text: |-
      Een in een vreemde staat opgelegde sanctie kan in Nederland niet worden ten uitvoer gelegd indien deze betrekking
      heeft op een vreemdeling, die geen vaste woon- of verblijfplaats in Nederland heeft, of op een rechtspersoon
      waarvan het bestuur geen zitting of kantoor houdt in Nederland, of waarvan het hoofd van het bestuur geen
      vaste woonplaats in Nederland heeft. Deze voorwaarde is niet van toepassing voor zover de in de vreemde staat
      opgelegde sanctie strekt tot de betaling van een geldboete of tot een verbeurdverklaring of vermogensontneming van
      vergelijkbare strekking.
    url: https://wetten.overheid.nl/BWBR0004028/2025-07-01#Artikel4
  - number: '5'
    text: |-
      Een in een vreemde staat opgelegde sanctie kan in Nederland niet worden ten uitvoer gelegd indien naar het oordeel
      van Onze Minister een gegrond vermoeden bestaat dat de beslissing tot vervolging of de oplegging van de sanctie is
      ingegeven door overwegingen van ras, godsdienst, levensovertuiging, nationaliteit of politieke overtuiging van de
      veroordeelde of deswege ongunstig is beïnvloed.
    url: https://wetten.overheid.nl/BWBR0004028/2025-07-01#Artikel5
  - number: '6'
    text: |-
      1 Een in een vreemde staat opgelegde sanctie kan in Nederland niet worden ten uitvoer gelegd indien het recht tot
      uitvoering van de straf naar Nederlands recht zou zijn verjaard.

      2 Een in een vreemde staat opgelegde sanctie kan in Nederland niet worden ten uitvoer gelegd indien de veroordeelde
      ten tijde van het feit waarvoor de sanctie werd opgelegd de leeftijd van twaalf jaren nog niet had bereikt.
    url: https://wetten.overheid.nl/BWBR0004028/2025-07-01#Artikel6
  - number: '7'
    text: |-
      1 Een in een vreemde staat opgelegde sanctie kan in Nederland niet worden ten uitvoer gelegd voor zover de
      veroordeelde ter zake van het zelfde feit in Nederland wordt vervolgd.

      2 Een in een vreemde staat opgelegde sanctie kan in Nederland evenmin worden ten uitvoer gelegd voor zover een
      vervolging in Nederland onverenigbaar zou zijn met het aan [artikel 68 van het Wetboek van Strafrecht][ref1] en
      [artikel 255, eerste lid, van het Wetboek van Strafvordering][ref2] ten grondslag liggende beginsel.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel68
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel255
    url: https://wetten.overheid.nl/BWBR0004028/2025-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '68'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '255'
  - number: '8'
    text: |-
      Voor zover een verdrag daarin voorziet kan de veroordeelde die zich in Nederland bevindt en aan wie een tot
      vrijheidsbeneming strekkende sanctie is opgelegd, waarvan blijkens de in de vreemde staat uitgesproken rechterlijke
      beslissing nog ten minste drie maanden moeten worden ten uitvoer gelegd, voorlopig worden aangehouden, indien
      gegronde redenen bestaan voor de verwachting dat op korte termijn deze sanctie in Nederland zal worden ten uitvoer
      gelegd.
    url: https://wetten.overheid.nl/BWBR0004028/2025-07-01#Artikel8
  - number: '9'
    text: |-
      1 Iedere officier van justitie en hulpofficier is bevoegd de voorlopige aanhouding overeenkomstig [artikel 8][ref1]
      te bevelen.

      2 De veroordeelde wordt na zijn voorlopige aanhouding binnen vierentwintig uur geleid voor de officier van justitie
      of hulpofficier die het bevel tot de voorlopige aanhouding heeft gegeven.

      3 De officier van justitie of hulpofficier kan, na de veroordeelde te hebben gehoord, bevelen dat deze gedurende
      achtenveertig uur, te rekenen van het tijdstip van de voorlopige aanhouding, in verzekering gesteld zal blijven. De
      hulpofficier geeft van zijn bevel ten spoedigste schriftelijk kennis aan de officier van justitie.

      4 De termijn van inverzekeringstelling kan door de officier van justitie eenmaal met achtenveertig uur worden
      verlengd.

      5 De veroordeelde kan te allen tijde door de officier van justitie in vrijheid worden gesteld. Zolang de termijn
      van inverzekeringstelling nog niet is verlengd, komt deze bevoegdheid mede toe aan de hulpofficier die het bevel
      tot de voorlopige aanhouding heeft gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0004028#Artikel8
    url: https://wetten.overheid.nl/BWBR0004028/2025-07-01#Artikel9
