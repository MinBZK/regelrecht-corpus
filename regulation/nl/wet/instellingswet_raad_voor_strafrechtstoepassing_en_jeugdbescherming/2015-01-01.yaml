---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: instellingswet_raad_voor_strafrechtstoepassing_en_jeugdbescherming
regulatory_layer: WET
publication_date: '2001-01-11'
valid_from: '2015-01-01'
bwb_id: BWBR0011940
url: https://wetten.overheid.nl/BWBR0011940/2015-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de Centrale Raad voor Strafrechtstoepassing en het
    College van Advies voor de justitiële kinderbescherming samen te voegen tot een Raad voor strafrechtstoepassing
    en jeugdbescherming en aan de Raad tevens een toezichthoudende taak toe te kennen op het terrein van de
    tenuitvoerlegging van aan jeugdigen opgelegde straffen en maatregelen, en deswege het Wetboek van Strafrecht en
    enige andere wetten te wijzigen en de Beginselenwet gevangeniswezen in te trekken;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0011940/2015-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet en de daarop rustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0011940/2015-01-01#Artikel1
  - number: 1.a
    text: 'Onze Minister: Onze Minister van Justitie;'
    url: https://wetten.overheid.nl/BWBR0011940/2015-01-01#Artikel1
  - number: 1.b
    text: 'vrijheidsstraf: gevangenisstraf, (vervangende) hechtenis, militaire detentie en (vervangende) jeugddetentie;'
    url: https://wetten.overheid.nl/BWBR0011940/2015-01-01#Artikel1
  - number: 1.c
    text: 'vrijheidsbeperkende straf: voorwaardelijke vrijheidsstraf en taakstraf;'
    url: https://wetten.overheid.nl/BWBR0011940/2015-01-01#Artikel1
  - number: 1.d
    text: |-
      vrijheidsbenemende maatregel: voorlopige hechtenis, vreemdelingenbewaring, gijzeling, terbeschikkingstelling met
      bevel tot verpleging, plaatsing in een inrichting voor jeugdigen, plaatsing in een justitiële jeugdinrichting
      in verband met de tenuitvoerlegging van een machtiging als bedoeld in de [artikelen 6.1.2][ref1] en
      [6.1.3 van de Jeugdwet][ref2], plaatsing in een inrichting voor stelselmatige daders en vrijheidsbeneming die op
      andere gronden dan de in onderdeel b genoemde gronden plaatsvindt;


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel6
    url: https://wetten.overheid.nl/BWBR0011940/2015-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0034925
        artikel: '6'
  - number: 1.e
    text: 'vrijheidsbeperkende maatregel: voorwaardelijke vrijheidsbenemende maatregel;'
    url: https://wetten.overheid.nl/BWBR0011940/2015-01-01#Artikel1
  - number: 1.f
    text: |-
      de Raad: de Raad voor strafrechtstoepassing en jeugdbescherming, bedoeld in [artikel 2, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011940#Artikel2
    url: https://wetten.overheid.nl/BWBR0011940/2015-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0011940
        artikel: '2'
        hoofdstuk: I
  - number: '2.1'
    text: Er is een Raad voor strafrechtstoepassing en jeugdbescherming.
    url: https://wetten.overheid.nl/BWBR0011940/2015-01-01#Artikel2
  - number: '2.2'
    text: De Raad is gevestigd te 's-Gravenhage.
    url: https://wetten.overheid.nl/BWBR0011940/2015-01-01#Artikel2
  - number: '3.1'
    text: |-
      De Raad adviseert Onze Minister desgevraagd of uit eigen beweging over de toepassing en uitvoering van beleid en
      regelgeving op het terrein van de strafrechtstoepassing en omtrent jeugdigen, mede in het licht van de overige
      werkzaamheden hem bij of krachtens de wet opgedragen.
    url: https://wetten.overheid.nl/BWBR0011940/2015-01-01#Artikel3
  - number: '3.2'
    text: De Raad is belast met rechtspraak die hem bij de wet is opgedragen.
    url: https://wetten.overheid.nl/BWBR0011940/2015-01-01#Artikel3
  - number: '3.3'
    text: De Raad verricht voor het overige de werkzaamheden die hem bij of krachtens de wet worden opgedragen.
    url: https://wetten.overheid.nl/BWBR0011940/2015-01-01#Artikel3
  - number: '4.1'
    text: |-
      De Raad heeft een voorzitter en ten hoogste zestig overige leden. De Raad kan uit de overige leden ondervoorzitters
      aanwijzen.
    url: https://wetten.overheid.nl/BWBR0011940/2015-01-01#Artikel4
  - number: '4.2'
    text: |-
      De voorzitter en de overige leden worden, de Raad gehoord, op voordracht van Onze Minister bij koninklijk besluit
      benoemd.
    url: https://wetten.overheid.nl/BWBR0011940/2015-01-01#Artikel4
  - number: '4.3'
    text: |-
      De benoeming geschiedt voor een periode van ten hoogste zes jaren. Herbenoeming kan eenmaal en voor ten hoogste zes
      jaren plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0011940/2015-01-01#Artikel4
  - number: '4.4'
    text: Onze Minister draagt zorg voor openbaarmaking van een vacature in de Raad.
    url: https://wetten.overheid.nl/BWBR0011940/2015-01-01#Artikel4
  - number: '5.1'
    text: |-
      De leden van de Raad worden benoemd op grond van de deskundigheid die nodig is voor een goede vervulling van de in
      [artikel 3][ref1] genoemde taken alsmede op grond van maatschappelijke kennis en ervaring.


      [ref1]: https://wetten.overheid.nl/BWBR0011940#Artikel3
    url: https://wetten.overheid.nl/BWBR0011940/2015-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0011940
        artikel: '3'
        hoofdstuk: I
  - number: '5.2'
    text: 'Van de Raad maken in ieder geval deel uit:'
    url: https://wetten.overheid.nl/BWBR0011940/2015-01-01#Artikel5
  - number: 5.2.a
    text: met rechtspraak belaste leden van de rechterlijke macht,
    url: https://wetten.overheid.nl/BWBR0011940/2015-01-01#Artikel5
  - number: 5.2.b
    text: deskundigen uit de kring van het maatschappelijk werk,
    url: https://wetten.overheid.nl/BWBR0011940/2015-01-01#Artikel5
  - number: 5.2.c
    text: deskundigen op het gebied van de gedragswetenschappen,
    url: https://wetten.overheid.nl/BWBR0011940/2015-01-01#Artikel5
  - number: 5.2.d
    text: advocaten, en
    url: https://wetten.overheid.nl/BWBR0011940/2015-01-01#Artikel5
  - number: 5.2.e
    text: artsen.
    url: https://wetten.overheid.nl/BWBR0011940/2015-01-01#Artikel5
  - number: '5.3'
    text: 'Voor benoeming als lid of plaatsvervangend lid komen niet in aanmerking:'
    url: https://wetten.overheid.nl/BWBR0011940/2015-01-01#Artikel5
  - number: 5.3.a
    text: |-
      ambtenaren of andere personen, werkzaam onder de verantwoordelijkheid van Onze Minister op het terrein van de
      tenuitvoerlegging van vrijheidsbenemende of vrijheidsbeperkende straffen of maatregelen;
    url: https://wetten.overheid.nl/BWBR0011940/2015-01-01#Artikel5
  - number: 5.3.b
    text: |-
      personen, werkzaam onder de verantwoordelijkheid van Onze Minister, indien hun onafhankelijkheid of onpartijdigheid
      hetzij door hun positie, hetzij door de aard van hun werkzaamheden in het geding zou kunnen komen;
    url: https://wetten.overheid.nl/BWBR0011940/2015-01-01#Artikel5
  - number: 5.3.c
    text: |-
      bestuursleden, leden van een raad van toezicht, medewerkers of personeelsleden van een door Onze Minister
      gesubsidieerde instelling die werkzaam is op het terrein van de tenuitvoerlegging van vrijheidsbenemende of
      vrijheidsbeperkende straffen of maatregelen;
    url: https://wetten.overheid.nl/BWBR0011940/2015-01-01#Artikel5
  - number: 5.3.d
    text: |-
      bestuursleden, leden van een raad van toezicht, medewerkers of personeelsleden van een gecertificeerde instelling
      als bedoeld in [artikel 1.1 van de Jeugdwet][ref1], bij de uitvoering van de jeugdreclassering, bedoeld in artikel
      1.1 van de Jeugdwet;


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel1
    url: https://wetten.overheid.nl/BWBR0011940/2015-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '1'
  - number: 5.3.e
    text: |-
      personen die werkzaam zijn bij of deel uitmaken van een instantie die toezicht houdt op de tenuitvoerlegging van
      vrijheidsbenemende of vrijheidsbeperkende straffen of maatregelen of op de uitvoering van de jeugdreclassering,
      bedoeld in [artikel 1.1 van de Jeugdwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel1
    url: https://wetten.overheid.nl/BWBR0011940/2015-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '1'
  - number: 5.3.f
    text: |-
      personen tegen wie bezwaren bestaan voor wat betreft de vervulling van de functie, die blijken uit de
      justitiële gegevens, bedoeld in het [Besluit justitiële gegevens][ref1], of uit politiegegevens, bedoeld in
      [artikel 1, onder a, van de Wet politiegegevens][ref2]; de bezwaren hebben betrekking op het vertrouwelijk karakter
      van de functie alsmede de aan de functie verbonden bevoegdheden.


      [ref1]: https://wetten.overheid.nl/BWBR0016544
      [ref2]: https://wetten.overheid.nl/BWBR0022463#Artikel1
    url: https://wetten.overheid.nl/BWBR0011940/2015-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0016544
      - id: ref2
        bwb_id: BWBR0022463
        artikel: '1'
  - number: '5.4'
    text: |-
      Bij de samenstelling van de Raad wordt gestreefd naar evenredige deelneming van vrouwen en personen behorende tot
      etnische of culturele minderheidsgroepen.
    url: https://wetten.overheid.nl/BWBR0011940/2015-01-01#Artikel5
  - number: '6.1'
    text: De leden van de Raad worden op eigen aanvraag door Onze Minister ontslagen.
    url: https://wetten.overheid.nl/BWBR0011940/2015-01-01#Artikel6
  - number: '6.2'
    text: |-
      De leden kunnen voorts bij koninklijk besluit worden geschorst en ontslagen wegens ongeschiktheid, onbekwaamheid of
      op andere zwaarwegende gronden.
    url: https://wetten.overheid.nl/BWBR0011940/2015-01-01#Artikel6
  - number: '7'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden de vergoeding van reis- en verblijfkosten en verdere
      vergoedingen aan leden van de Raad vastgesteld.
    url: https://wetten.overheid.nl/BWBR0011940/2015-01-01#Artikel7
  - number: '8.1'
    text: In de Raad kunnen plaatsvervangende leden worden benoemd.
    url: https://wetten.overheid.nl/BWBR0011940/2015-01-01#Artikel8
  - number: '8.2'
    text: |-
      De [artikelen 4, tweede en derde lid][ref1], en [5][ref2] tot en met [7][ref3] zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011940#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0011940#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0011940#Artikel7
    url: https://wetten.overheid.nl/BWBR0011940/2015-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0011940
        artikel: '4'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0011940
        artikel: '5'
        hoofdstuk: I
      - id: ref3
        bwb_id: BWBR0011940
        artikel: '7'
        hoofdstuk: I
  - number: '8.3'
    text: De plaatsvervangende leden kunnen met bepaalde taken worden belast.
    url: https://wetten.overheid.nl/BWBR0011940/2015-01-01#Artikel8
  - number: '9.1'
    text: De Raad heeft een secretaris.
    url: https://wetten.overheid.nl/BWBR0011940/2015-01-01#Artikel9
  - number: '9.2'
    text: De secretaris is voor zijn werkzaamheden voor de Raad uitsluitend verantwoording schuldig aan de Raad.
    url: https://wetten.overheid.nl/BWBR0011940/2015-01-01#Artikel9
  - number: '9.3'
    text: Aan de secretaris kunnen andere medewerkers worden toegevoegd.
    url: https://wetten.overheid.nl/BWBR0011940/2015-01-01#Artikel9
  - number: '9.4'
    text: De secretaris en de andere medewerkers zijn geen lid van de Raad.
    url: https://wetten.overheid.nl/BWBR0011940/2015-01-01#Artikel9
  - number: '9.5'
    text: |-
      Onze Minister benoemt, bevordert, schorst en ontslaat, na overleg met de voorzitter van de Raad, de secretaris, en,
      na overleg met de secretaris, de andere medewerkers.
    url: https://wetten.overheid.nl/BWBR0011940/2015-01-01#Artikel9
  - number: '9.6'
    text: |-
      Onze Minister draagt, na overleg met de Raad, zorg voor de nodige voorzieningen ten behoeve van de werkzaamheden
      van de Raad.
    url: https://wetten.overheid.nl/BWBR0011940/2015-01-01#Artikel9
  - number: '10'
    text: De Raad wordt vertegenwoordigd door de voorzitter en de secretaris.
    url: https://wetten.overheid.nl/BWBR0011940/2015-01-01#Artikel10
  - number: '11'
    text: |-
      De Raad kan zich verdelen in secties en kan de uitoefening van bepaalde taken opdragen aan commissies uit zijn
      midden.
    url: https://wetten.overheid.nl/BWBR0011940/2015-01-01#Artikel11
  - number: '12.1'
    text: |-
      De Raad stelt een bestuursreglement vast. Dit bevat in ieder geval regels over werkwijzen en procedures met het
      oog op een goede en zorgvuldige uitoefening van de verschillende taken. Daarbij wordt voorzien in waarborgen tegen
      vermenging van de adviserende en rechtsprekende taak van de Raad.
    url: https://wetten.overheid.nl/BWBR0011940/2015-01-01#Artikel12
  - number: '12.2'
    text: |-
      Het reglement alsmede elke wijziging daarvan wordt zo spoedig mogelijk gezonden aan Onze Minister en behoeft diens
      goedkeuring.
    url: https://wetten.overheid.nl/BWBR0011940/2015-01-01#Artikel12
  - number: '13'
    text: De Raad kan zich voor het inwinnen van inlichtingen wenden tot daartoe door Onze Minister aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0011940/2015-01-01#Artikel13
  - number: '14.1'
    text: |-
      De Raad kan zich doen bijstaan door andere dan de in [artikel 13][ref1] bedoelde personen, voor zover dat voor de
      vervulling van zijn taken nodig is.


      [ref1]: https://wetten.overheid.nl/BWBR0011940#Artikel13
    url: https://wetten.overheid.nl/BWBR0011940/2015-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0011940
        artikel: '13'
        hoofdstuk: I
  - number: '14.2'
    text: |-
      [Artikel 7][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011940#Artikel7
    url: https://wetten.overheid.nl/BWBR0011940/2015-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0011940
        artikel: '7'
        hoofdstuk: I
  - number: '15.1'
    text: |-
      De leden van de Raad hebben te allen tijde toegang tot alle plaatsen in de inrichtingen en instellingen die
      onder verantwoordelijkheid van Onze Minister een taak uitoefenen in het kader van de tenuitvoerlegging van
      vrijheidsstraffen, vrijheidsbeperkende straffen, vrijheidsbenemende maatregelen en vrijheidsbeperkende maatregelen.
    url: https://wetten.overheid.nl/BWBR0011940/2015-01-01#Artikel15
  - number: '15.2'
    text: |-
      De leden van de Raad ontvangen van de directeur van de inrichting of de instelling die is belast met
      de tenuitvoerlegging van een vrijheidsstraf, een vrijheidsbeperkende straf of een vrijheidsbenemende of
      vrijheidsbeperkende maatregel, of van de personen, werkzaam bij die inrichting of instelling, alle door hen
      gewenste inlichtingen.
    url: https://wetten.overheid.nl/BWBR0011940/2015-01-01#Artikel15
  - number: '15.3'
    text: |-
      De leden van de Raad die bij de uitvoering van hun taak de beschikking krijgen over gegevens waarvan zij het
      vertrouwelijke karakter kennen of redelijkerwijs moeten vermoeden, zijn verplicht tot geheimhouding van die
      gegevens, behoudens voor zover enig wettelijk voorschrift hen tot bekendmaking verplicht of uit hun taak de
      noodzaak tot bekendmaking voortvloeit.
    url: https://wetten.overheid.nl/BWBR0011940/2015-01-01#Artikel15
  - number: '16'
    text: |-
      De Raad zendt jaarlijks voor 1 april aan Onze Minister een ontwerp voor de begroting voor het daaropvolgende
      kalenderjaar van de aan zijn taakvervulling verbonden uitgaven.
    url: https://wetten.overheid.nl/BWBR0011940/2015-01-01#Artikel16
  - number: '17.1'
    text: De Raad zendt Onze Minister jaarlijks voor 1 september een werkprogramma voor het komende kalenderjaar toe.
    url: https://wetten.overheid.nl/BWBR0011940/2015-01-01#Artikel17
  - number: '17.2'
    text: Onze Minister verstrekt de Raad tijdig een overzicht van de voornemens om advies te vragen.
    url: https://wetten.overheid.nl/BWBR0011940/2015-01-01#Artikel17
  - number: '18'
    text: |-
      De Raad houdt bij het vervullen van zijn taken zo veel mogelijk rekening met het werkprogramma. Onverminderd de
      [Comptabiliteitswet][ref1] vervult hij zijn taak met de middelen die ingevolge de desbetreffende begrotingswet ter
      beschikking zijn gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003075
    url: https://wetten.overheid.nl/BWBR0011940/2015-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0003075
  - number: '19'
    text: |-
      De Raad stelt jaarlijks voor 1 april een verslag op van de werkzaamheden, het gevoerde beleid in het algemeen
      en de doelmatigheid en de doeltreffendheid van zijn werkzaamheden en werkwijze in het bijzonder in het afgelopen
      kalenderjaar. Het verslag wordt aan Onze Minister toegezonden en algemeen verkrijgbaar gesteld.
    url: https://wetten.overheid.nl/BWBR0011940/2015-01-01#Artikel19
  - number: '20'
    text: |-
      De Raad verstrekt desgevraagd aan Onze Minister de voor de uitoefening van diens taak benodigde inlichtingen. Onze
      Minister kan inzage vorderen van zakelijke gegevens en bescheiden, voor zover dat voor de vervulling van zijn taak
      redelijkerwijs nodig is.
    url: https://wetten.overheid.nl/BWBR0011940/2015-01-01#Artikel20
  - number: '21.1'
    text: |-
      De Raad treedt in de plaats van de Centrale Raad voor Strafrechtstoepassing en het College van advies voor de
      justitiële kinderbescherming.
    url: https://wetten.overheid.nl/BWBR0011940/2015-01-01#Artikel21
  - number: '21.2'
    text: |-
      De leden van de Centrale Raad voor Strafrechtstoepassing en de leden van het College van advies voor de justitiële
      kinderbescherming zijn van rechtswege benoemd in de Raad.
    url: https://wetten.overheid.nl/BWBR0011940/2015-01-01#Artikel21
  - number: '21.3'
    text: |-
      De leden van de Centrale Raad voor Strafrechtstoepassing die voor het tijdstip van inwerkingtreding van deze wet
      voor de eerste maal zijn herbenoemd, kunnen op of na dat tijdstip worden herbenoemd voor ten hoogste zes jaren.
    url: https://wetten.overheid.nl/BWBR0011940/2015-01-01#Artikel21
  - number: '21.4'
    text: |-
      De leden van de Centrale Raad voor Strafrechtstoepassing die voor het tijdstip van inwerkingtreding van deze wet
      voor de tweede maal zijn herbenoemd, treden af na het verstrijken van hun derde ambtstermijn.
    url: https://wetten.overheid.nl/BWBR0011940/2015-01-01#Artikel21
  - number: '22'
    text: 'Deze wet wordt aangehaald als: Instellingswet Raad voor strafrechtstoepassing en jeugdbescherming.'
    url: https://wetten.overheid.nl/BWBR0011940/2015-01-01#Artikel22
