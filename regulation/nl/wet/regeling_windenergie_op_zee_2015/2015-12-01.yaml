preamble:
  text: |-
    Gelet op artikel 3, eerste en tweede lid, van de Kaderwet EZ-subsidies en de artikelen 2, tweede tot en met vierde
    en zesde lid, 6, derde lid, 7, 8, eerste lid, 19, tweede lid, 20, eerste lid, 22, vijfde lid, 23, derde tot en met
    vijfde lid, 56, eerste en derde lid, 60, tweede lid, 61, eerste en derde lid, en 63, tweede lid, van het Besluit
    stimulering duurzame energieproductie;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0036785/2015-12-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder: - *besluit:* [Besluit stimulering duurzame energieproductie][ref1];
        - *kavel:* kavel als bedoeld in [artikel 1 van de Wet windenergie op zee][ref2];
        - *kavel I:* kavel I van het windenergiegebied Borssele zoals aangewezen in het desbetreffende kavelbesluit;
        - *kavel II:* kavel II van het windenergiegebied Borssele zoals aangewezen in het desbetreffende kavelbesluit;
        - *kavelbesluit:* kavelbesluit als bedoeld in [artikel 1 van de Wet windenergie op zee][ref3];
        - *minister:* Minister van Economische Zaken;
        - *netto P50-waarde vollasturen:* het aantal vollasturen, waarbij de verwachte jaarlijkse energieproductie voor een
      gegeven combinatie van locatie en productie-installatie voor de productie van hernieuwbare elektriciteit met behulp
      van windenergie dient te zijn bepaald met een waarschijnlijkheid van 50%;
        - *nominaal vermogen:* maximale vermogen van de productie-installatie dat onder nominale condities benut kan worden
      voor de productie van hernieuwbare elektriciteit en dat door de leverancier gegarandeerd wordt bij continu gebruik;
        - *windenergiegebied Borssele:* windenergiegebied Borssele, aangewezen in het nationaal waterplan, bedoeld in
      [artikel 4.1 van de Waterwet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0022735
      [ref2]: https://wetten.overheid.nl/BWBR0036752#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0036752#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0025458#Artikel4
    url: https://wetten.overheid.nl/BWBR0036785/2015-12-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0022735
      - id: ref2
        bwb_id: BWBR0036752
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0036752
        artikel: '1'
      - id: ref4
        bwb_id: BWBR0025458
        artikel: '4'
  - number: '2'
    text: |-
      De minister verstrekt op aanvraag subsidie aan een producent van hernieuwbare elektriciteit geproduceerd door een
      productie-installatie voor de productie van hernieuwbare elektriciteit met behulp van windenergie op zee die is
      gelegen op kavel I of kavel II.
    url: https://wetten.overheid.nl/BWBR0036785/2015-12-01#Artikel2
  - number: '3'
    text: |-
      Het nominale vermogen van de productie-installatie, bedoeld in [artikel 2][ref1], bedraagt:


      [ref1]: https://wetten.overheid.nl/BWBR0036785#Artikel2
    url: https://wetten.overheid.nl/BWBR0036785/2015-12-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0036785
        artikel: '2'
        paragraaf: '2'
  - number: 3.a
    text: |-
      tenminste 351 MW per kavel verminderd met het aantal MW van de windmolen met het minste vermogen in de
      desbetreffende productie-installatie, en
    url: https://wetten.overheid.nl/BWBR0036785/2015-12-01#Artikel3
  - number: 3.b
    text: ten hoogste 380 MW per kavel.
    url: https://wetten.overheid.nl/BWBR0036785/2015-12-01#Artikel3
  - number: '4.1'
    text: |-
      Aanvragen om subsidie worden ontvangen in de periode van de dag na de datum van inwerkingtreding van deze regeling
      tot 31 maart 2016, 17:00 uur.
    url: https://wetten.overheid.nl/BWBR0036785/2015-12-01#Artikel4
  - number: '4.2'
    text: |-
      Indien deze regeling in werking treedt na 3 maart 2016 eindigt de periode, bedoeld in het eerste lid, op de vijfde
      donderdag na de datum van inwerkingtreding van deze regeling om 17:00 uur.
    url: https://wetten.overheid.nl/BWBR0036785/2015-12-01#Artikel4
  - number: '4.3'
    text: |-
      Productie-installaties als bedoeld in [artikel 2][ref1] worden aangewezen als productie-
      installaties waarvoor een gebundelde aanvraag kan worden ingediend als bedoeld in
      [artikel 56, eerste lid, tweede volzin, van het besluit][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0036785#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0022735#Artikel56
    url: https://wetten.overheid.nl/BWBR0036785/2015-12-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0036785
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0022735
        artikel: '56'
  - number: '4.4'
    text: |-
      Per aanvrager kan in de periode, genoemd in het eerste lid, ten hoogste één niet-gebundelde aanvraag per kavel en
      één gebundelde aanvraag voor beide kavels worden ingediend.
    url: https://wetten.overheid.nl/BWBR0036785/2015-12-01#Artikel4
  - number: '5.1'
    text: 'De minister beslist in ieder geval afwijzend op een aanvraag indien:'
    url: https://wetten.overheid.nl/BWBR0036785/2015-12-01#Artikel5
  - number: 5.1.a
    text: |-
      uit de financiële onderbouwing, bedoeld in [artikel 56, tweede lid, onderdeel e, van het besluit][ref1] blijkt
      dat de omvang van het eigen vermogen van de aanvrager kleiner is dan 10% van de totale investeringskosten voor de
      desbetreffende productie-installatie of, in geval van een gebundelde aanvraag, voor beide productie-installaties
      tezamen;


      [ref1]: https://wetten.overheid.nl/BWBR0022735#Artikel56
    url: https://wetten.overheid.nl/BWBR0036785/2015-12-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0022735
        artikel: '56'
  - number: 5.1.b
    text: |-
      niet tijdig een aanvraag is ingediend als bedoeld in [artikel 20, eerste lid, van de Wet windenergie op zee][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0036752#Artikel20
    url: https://wetten.overheid.nl/BWBR0036785/2015-12-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0036752
        artikel: '20'
  - number: 5.1.c
    text: |-
      de aanvraag niet voldoet aan de criteria, gesteld bij of krachtens
      [artikel 14, eerste lid, onderdeel d of f, of tweede lid van de Wet windenergie op zee][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0036752#Artikel14
    url: https://wetten.overheid.nl/BWBR0036785/2015-12-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0036752
        artikel: '14'
  - number: '5.2'
    text: |-
      Indien de subsidie-aanvrager een samenwerkingsverband is, is de omvang van het eigen vermogen, bedoeld in het
      eerste lid, onderdeel a, gelijk aan de omvang van de eigen vermogens van de deelnemers aan het samenwerkingsverband
      tezamen. Indien de subsidie-aanvrager een dochteronderneming is, is de omvang van het eigen vermogen, bedoeld
      in het eerste lid, onderdeel a, gelijk aan de omvang van de eigen vermogens van de moederonderneming en de
      dochteronderneming tezamen.
    url: https://wetten.overheid.nl/BWBR0036785/2015-12-01#Artikel5
  - number: '6.1'
    text: Het subsidieplafond bedraagt € 2.500.000.000 per kavel.
    url: https://wetten.overheid.nl/BWBR0036785/2015-12-01#Artikel6
  - number: '6.2'
    text: De minister verdeelt het bedrag, genoemd in het eerste lid, op volgorde van rangschikking van de aanvragen.
    url: https://wetten.overheid.nl/BWBR0036785/2015-12-01#Artikel6
  - number: '6.3'
    text: |-
      De criteria voor rangschikking, bedoeld in [artikel 60, eerste lid, onderdelen b en c, van het besluit][ref1] zijn
      niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0022735#Artikel60
    url: https://wetten.overheid.nl/BWBR0036785/2015-12-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0022735
        artikel: '60'
  - number: '6.4'
    text: Per kavel wordt aan ten hoogste één producent subsidie verleend.
    url: https://wetten.overheid.nl/BWBR0036785/2015-12-01#Artikel6
  - number: '6.5'
    text: De aanvragen worden gerangschikt per kavel op basis van het tenderbedrag voor die kavel.
    url: https://wetten.overheid.nl/BWBR0036785/2015-12-01#Artikel6
  - number: '6.6'
    text: |-
      Een gebundelde aanvraag komt slechts in aanmerking voor subsidie indien de aanvraag in de rangschikking van beide
      kavels ten minste even hoog is gerangschikt als de hoogst gerangschikte niet-gebundelde aanvraag.
    url: https://wetten.overheid.nl/BWBR0036785/2015-12-01#Artikel6
  - number: '6.7'
    text: |-
      Indien meerdere gebundelde aanvragen in de rangschikking van beide kavels hoger worden gerangschikt dan de hoogst
      gerangschikte niet-gebundelde aanvraag, wordt de onderlinge rangschikking van deze gebundelde aanvragen gebaseerd
      op het gemiddelde tenderbedrag per kWh van de desbetreffende aanvragen.
    url: https://wetten.overheid.nl/BWBR0036785/2015-12-01#Artikel6
  - number: '6.8'
    text: |-
      Indien in de rangschikking van beide kavels een niet-gebundelde aanvraag van dezelfde aanvrager het hoogst
      wordt gerangschikt en de omvang van het eigen vermogen van die aanvrager kleiner is dan 10% van de totale
      investeringskosten voor beide productie-installaties tezamen, komt van deze aanvrager slechts de aanvraag met het
      laagste tenderbedrag per kWh in aanmerking voor subsidie. Indien het tenderbedrag van beide aanvragen gelijk is
      stelt de minister door middel van loting vast welke van beide aanvragen in aanmerking komt voor subsidie.
    url: https://wetten.overheid.nl/BWBR0036785/2015-12-01#Artikel6
  - number: '6.9'
    text: |-
      Indien voor een kavel meerdere aanvragen als hoogst zijn gerangschikt, stelt de minister de onderlinge
      rangschikking van deze aanvragen vast door middel van loting.
    url: https://wetten.overheid.nl/BWBR0036785/2015-12-01#Artikel6
  - number: '7'
    text: Het tenderbedrag bedraagt ten hoogste € 0,124 per kWh.
    url: https://wetten.overheid.nl/BWBR0036785/2015-12-01#Artikel7
  - number: '8.1'
    text: |-
      De subsidie wordt verleend onder de opschortende voorwaarde dat binnen twee weken na de datum van de beschikking
      tot subsidieverlening een uitvoeringsovereenkomst tot stand is gekomen tussen de Staat en de subsidie-ontvanger
      overeenkomstig de overeenkomst opgenomen in de bijlage.
    url: https://wetten.overheid.nl/BWBR0036785/2015-12-01#Artikel8
  - number: '8.2'
    text: |-
      De subsidie wordt verleend onder de opschortende voorwaarde dat de subsidie-ontvanger binnen vier
      weken na de datum van de beschikking tot subsidieverlening aantoont dat een bankgarantie als bedoeld in
      [artikel 2, eerste lid][ref1], van de overeenkomst opgenomen in de bijlage is afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0036785#Artikel2
    url: https://wetten.overheid.nl/BWBR0036785/2015-12-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0036785
        artikel: '2'
        paragraaf: '2'
  - number: '8.3'
    text: |-
      Indien niet tijdig aan de voorwaarde, bedoeld in het eerste of tweede lid, is voldaan wordt subsidie voor de
      desbetreffende kavel verleend voor de eerstvolgende aanvraag in de rangschikking.
    url: https://wetten.overheid.nl/BWBR0036785/2015-12-01#Artikel8
  - number: '9.1'
    text: De subsidie wordt voor een periode van 15 jaar verstrekt.
    url: https://wetten.overheid.nl/BWBR0036785/2015-12-01#Artikel9
  - number: '9.2'
    text: |-
      Productie-installaties als bedoeld in [artikel 2][ref1] worden aangewezen als productie-installaties als bedoeld in
      [artikel 6, derde lid, van het besluit][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0036785#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0022735#Artikel6
    url: https://wetten.overheid.nl/BWBR0036785/2015-12-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0036785
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0022735
        artikel: '6'
  - number: '9.3'
    text: |-
      Productie-installaties als bedoeld in [artikel 2][ref1] worden aangewezen als productie-installaties als bedoeld in
      [artikel 23, derde en vierde lid, van het besluit][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0036785#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0022735#Artikel23
    url: https://wetten.overheid.nl/BWBR0036785/2015-12-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0036785
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0022735
        artikel: '23'
  - number: '10.1'
    text: |-
      De subsidie-ontvanger neemt de productie-installatie in gebruik binnen 5 jaar na de datum van de beschikking tot
      subsidieverlening.
    url: https://wetten.overheid.nl/BWBR0036785/2015-12-01#Artikel10
  - number: '10.2'
    text: |-
      Indien het desbetreffende kavelbesluit later onherroepelijk wordt dan de datum van de beschikking tot
      subsidieverlening, neemt de subsidie-ontvanger de productie-installatie in gebruik binnen 5 jaar na de datum waarop
      dat kavelbesluit onherroepelijk is geworden.
    url: https://wetten.overheid.nl/BWBR0036785/2015-12-01#Artikel10
  - number: '11.1'
    text: |-
      De basiselektriciteitsprijs, bedoeld in [artikel 20, eerste lid, van het besluit][ref1] bedraagt voor productie-
      installaties als bedoeld in [artikel 2][ref2] € 0,029 per kWh.


      [ref1]: https://wetten.overheid.nl/BWBR0022735#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0036785#Artikel2
    url: https://wetten.overheid.nl/BWBR0036785/2015-12-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0022735
        artikel: '20'
      - id: ref2
        bwb_id: BWBR0036785
        artikel: '2'
        paragraaf: '2'
  - number: '11.2'
    text: |-
      Het maximale aantal vollasturen, bedoeld in [artikel 23, vijfde lid, van het besluit][ref1] voor productie-
      installaties als bedoeld in [artikel 2][ref2] is gelijk aan de netto P50-waarde vollasturen die is opgenomen in
      de aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0022735#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0036785#Artikel2
    url: https://wetten.overheid.nl/BWBR0036785/2015-12-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0022735
        artikel: '23'
      - id: ref2
        bwb_id: BWBR0036785
        artikel: '2'
        paragraaf: '2'
  - number: '12.1'
    text: |-
      Voor de vaststelling van de correcties ten behoeve van de voorschotverlening voor 2016 wordt voor de
      elektriciteitsprijs de gemiddelde waarde in de periode 1 mei 2014 tot en met 30 april 2015 gehanteerd.
    url: https://wetten.overheid.nl/BWBR0036785/2015-12-01#Artikel12
  - number: '12.2'
    text: 'De correcties op het tenderbedrag ten behoeve van de voorschotverlening worden voor 2016 als volgt vastgesteld:'
    url: https://wetten.overheid.nl/BWBR0036785/2015-12-01#Artikel12
  - number: 12.2.a
    text: |-
      € 0,037681 per kWh voor wat betreft de elektriciteitsprijs, bedoeld in
      [artikel 22, eerste lid, onderdeel a, van het besluit][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0022735#Artikel22
    url: https://wetten.overheid.nl/BWBR0036785/2015-12-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0022735
        artikel: '22'
  - number: 12.2.b
    text: |-
      € 0 voor wat betreft de waarde van de garanties van oorsprong, bedoeld in
      [artikel 22, eerste lid, onderdeel b, van het besluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022735#Artikel22
    url: https://wetten.overheid.nl/BWBR0036785/2015-12-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0022735
        artikel: '22'
  - number: '14'
    text: |-
      Deze regeling treedt in werking met ingang van 1 december 2015. Indien het kavelbesluit betreffende kavel I
      of kavel II in werking treedt na 1 december 2015, treedt deze regeling in werking op het tijdstip waarop het
      kavelbesluit dat als laatste in werking treedt, in werking treedt.
    url: https://wetten.overheid.nl/BWBR0036785/2015-12-01#Artikel14
  - number: '15'
    text: 'Deze regeling wordt aangehaald als: Regeling windenergie op zee 2015.'
    url: https://wetten.overheid.nl/BWBR0036785/2015-12-01#Artikel15
