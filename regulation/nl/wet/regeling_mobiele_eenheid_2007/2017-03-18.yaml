---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: regeling_mobiele_eenheid_2007
regulatory_layer: WET
publication_date: '2025-04-14'
valid_from: '2017-03-18'
bwb_id: BWBR0021328
url: https://wetten.overheid.nl/BWBR0021328/2017-03-18
preamble:
  text: |-
    Gelet op de artikelen 48, eerste lid, en 48a van de Politiewet 1993 en de artikelen 6, tweede lid, en 17, tweede
    lid, van het Besluit beheer regionale politiekorpsen;

    Besluiten:
  url: https://wetten.overheid.nl/BWBR0021328/2017-03-18#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      De mobiele eenheid, bedoeld in [artikel 26 van het Besluit beheer politie][ref1], bestaat uit basiseenheden al dan
      niet met een bijzondere taak en bijzondere eenheden.


      [ref1]: https://wetten.overheid.nl/BWBR0036705#Artikel26
    url: https://wetten.overheid.nl/BWBR0021328/2017-03-18#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0036705
        artikel: '26'
  - number: '1.2'
    text: |-
      Bijzondere eenheden zijn verkenningseenheden, eenheden beredenen, eenheden hondengeleiders, eenheden met de
      waterwerper, aanhoudingseenheden, BRATRA-groepen en eenheden specialistische schutters.
    url: https://wetten.overheid.nl/BWBR0021328/2017-03-18#Artikel1
  - number: '2.1'
    text: Basiseenheden zijn organisatorisch opgebouwd uit een groep, sectie, peloton of compagnie.
    url: https://wetten.overheid.nl/BWBR0021328/2017-03-18#Artikel2
  - number: '2.2'
    text: Een groep bestaat uit elf leden, onder wie een groepscommandant en een voor zijn taak opgeleide chauffeur.
    url: https://wetten.overheid.nl/BWBR0021328/2017-03-18#Artikel2
  - number: '2.3'
    text: Een sectie bestaat uit een sectiecommandant en twee groepen.
    url: https://wetten.overheid.nl/BWBR0021328/2017-03-18#Artikel2
  - number: '2.4'
    text: Een peloton bestaat uit een pelotonscommandant en twee secties.
    url: https://wetten.overheid.nl/BWBR0021328/2017-03-18#Artikel2
  - number: '2.5'
    text: Een compagnie bestaat uit een compagniescommandant en twee of meer pelotons.
    url: https://wetten.overheid.nl/BWBR0021328/2017-03-18#Artikel2
  - number: '2.6'
    text: |-
      Indien een basiseenheid, anders dan in een groep, zelfstandig optreedt, dan heeft die de beschikking over een
      chauffeur voor het commandovoertuig en één of meer verbindingsspecialisten.
    url: https://wetten.overheid.nl/BWBR0021328/2017-03-18#Artikel2
  - number: '3.1'
    text: Eenheden te water zijn bekwaam om op of rond een vaartuig of een waterwerk op te treden.
    url: https://wetten.overheid.nl/BWBR0021328/2017-03-18#Artikel3
  - number: '3.2'
    text: |-
      [Artikel 2][ref1] is overeenkomstig van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0021328#Artikel2
    url: https://wetten.overheid.nl/BWBR0021328/2017-03-18#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0021328
        artikel: '2'
        paragraaf: '2'
  - number: '4.1'
    text: |-
      Een regionale eenheid kan beschikken, zelfstandig of samen met een of meer andere regionale eenheden, over een of
      meer verkenningseenheden.
    url: https://wetten.overheid.nl/BWBR0021328/2017-03-18#Artikel4
  - number: '4.2'
    text: |-
      Verkenningseenheden zijn organisatorisch opgebouwd uit een groep, bestaande uit vier tot twaalf leden, onder wie
      een groepscommandant.
    url: https://wetten.overheid.nl/BWBR0021328/2017-03-18#Artikel4
  - number: '5.1'
    text: |-
      Een regionale eenheid kan beschikken, zelfstandig of samen met een of meer andere regionale eenheden, over een of
      meer eenheden beredenen.
    url: https://wetten.overheid.nl/BWBR0021328/2017-03-18#Artikel5
  - number: '5.2'
    text: |-
      Eenheden beredenen zijn organisatorisch opgebouwd uit een groep bestaande uit zes ruiters, onder wie een
      groepscommandant.
    url: https://wetten.overheid.nl/BWBR0021328/2017-03-18#Artikel5
  - number: '6.1'
    text: |-
      Een regionale eenheid kan beschikken, zelfstandig of samen met een of meer andere regionale eenheden, over een of
      meer eenheden hondengeleiders.
    url: https://wetten.overheid.nl/BWBR0021328/2017-03-18#Artikel6
  - number: '6.2'
    text: |-
      Eenheden hondengeleiders zijn organisatorisch opgebouwd uit een groep bestaande uit zes leden, onder wie een
      groepscommandant, een voor zijn taak opgeleide chauffeur en vier hondengeleiders.
    url: https://wetten.overheid.nl/BWBR0021328/2017-03-18#Artikel6
  - number: '7.1'
    text: |-
      Bij de regionale eenheden, genoemd in [bijlage 3][ref1], zijn één of meer waterwerpers gestationeerd.


      [ref1]: https://wetten.overheid.nl/BWBR0021328
    url: https://wetten.overheid.nl/BWBR0021328/2017-03-18#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0021328
  - number: '7.2'
    text: De regionale eenheid, bedoeld in het eerste lid, beschikt over een bij de waterwerper behorende eenheid.
    url: https://wetten.overheid.nl/BWBR0021328/2017-03-18#Artikel7
  - number: '7.3'
    text: Een eenheid met de waterwerper bestaat uit een voor deze taak bekwame commandant, chauffeur en twee kanonniers.
    url: https://wetten.overheid.nl/BWBR0021328/2017-03-18#Artikel7
  - number: '8.1'
    text: |-
      Een regionale eenheid kan, zelfstandig of samen met een of meer andere regionale eenheden, beschikken over een of
      meer aanhoudingseenheden.
    url: https://wetten.overheid.nl/BWBR0021328/2017-03-18#Artikel8
  - number: '8.2'
    text: Aanhoudingseenheden zijn organisatorisch opgebouwd uit een groep of sectie.
    url: https://wetten.overheid.nl/BWBR0021328/2017-03-18#Artikel8
  - number: '8.3'
    text: Een groep bestaat uit acht leden, onder wie een groepscommandant en een voor zijn taak opgeleide chauffeur.
    url: https://wetten.overheid.nl/BWBR0021328/2017-03-18#Artikel8
  - number: '8.4'
    text: Een sectie bestaat uit een sectiecommandant en twee groepen.
    url: https://wetten.overheid.nl/BWBR0021328/2017-03-18#Artikel8
  - number: '9.1'
    text: |-
      Een regionale eenheid kan, zelfstandig of samen met een of meer andere regionale eenheden, beschikken over een of
      meer BRATRA-groepen.
    url: https://wetten.overheid.nl/BWBR0021328/2017-03-18#Artikel9
  - number: '9.2'
    text: |-
      De leden van een BRATRA-groep zijn bekwaam in het toegankelijk en vrij van obstakels maken van ruimten, wegen en
      gebieden, het bestrijden van kleine branden bij een optreden van de mobiele eenheid en verspreiding van CS-traangas
      al of niet met behulp van een vuurwapen.
    url: https://wetten.overheid.nl/BWBR0021328/2017-03-18#Artikel9
  - number: '9.3'
    text: De BRATRA-groep bestaat uit zes leden, onder wie een groepscommandant en een voor zijn taak opgeleide chauffeur.
    url: https://wetten.overheid.nl/BWBR0021328/2017-03-18#Artikel9
  - number: '10.1'
    text: |-
      Een regionale eenheid beschikt over een uit een peloton van de basiseenheid samengestelde eenheid of zelfstandige
      eenheden specialistische schutters, die geoefend zijn in het gebruik van een vuurwapen als bedoeld in
      [artikel 10 van het Besluit bewapening en uitrusting politie][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0032136#Artikel10
    url: https://wetten.overheid.nl/BWBR0021328/2017-03-18#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0032136
        artikel: '10'
  - number: '10.2'
    text: |-
      De in het eerste lid bedoelde schutters zijn daarnaast bekwaam in verspreiden van CS-traangas al of niet met behulp
      van een vuurwapen.
    url: https://wetten.overheid.nl/BWBR0021328/2017-03-18#Artikel10
  - number: '10.3'
    text: |-
      Het aantal eenheden minimaal gelijk is aan het aantal eenheden zoals vermeld in de [bijlage 3][ref1] van deze
      regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0021328
    url: https://wetten.overheid.nl/BWBR0021328/2017-03-18#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0021328
  - number: '10.4'
    text: |-
      Eenheden specialistische schutters zijn organisatorisch opgebouwd uit een groep, bestaande uit elf leden, onder wie
      een groepscommandant en een voor zijn taak opgeleide chauffeur.
    url: https://wetten.overheid.nl/BWBR0021328/2017-03-18#Artikel10
  - number: '11.1'
    text: |-
      Een ambtenaar van politie in de zin van [artikel 2, eerste lid, onder a, van de Politiewet 2012][ref1], kan deel
      uitmaken van een basiseenheid of een bijzondere eenheid, indien hij voldoet aan:


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel2
    url: https://wetten.overheid.nl/BWBR0021328/2017-03-18#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '2'
  - number: 11.1.a
    text: eindtermen zoals voorgeschreven voor de opleiding basispolitiemedewerker niveau 3;
    url: https://wetten.overheid.nl/BWBR0021328/2017-03-18#Artikel11
  - number: 11.1.b
    text: |-
      de eisen die op grond van de [Regeling toetsing geweldsbeheersing][ref1] politie aan hem worden gesteld; en


      [ref1]: https://wetten.overheid.nl/BWBR0013200
    url: https://wetten.overheid.nl/BWBR0021328/2017-03-18#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0013200
  - number: 11.1.c
    text: de voor die taak ontwikkelde en voorgeschreven eindtermen.
    url: https://wetten.overheid.nl/BWBR0021328/2017-03-18#Artikel11
  - number: '11.2'
    text: |-
      De opleiding voor de specifieke taak, bedoeld in het eerste lid, onder c, is met succes afgerond indien
      de deelnemer heeft voldaan aan de competentiegerichte eindtermen van de daartoe strekkende opleiding en is
      gecertificeerd door het Bureau examinering van de LSOP.
    url: https://wetten.overheid.nl/BWBR0021328/2017-03-18#Artikel11
  - number: '12'
    text: 'De korpschef draagt voor wat betreft opleiden en oefenen zorg voor dat:'
    url: https://wetten.overheid.nl/BWBR0021328/2017-03-18#Artikel12
  - number: '12.1'
    text: |-
      Elk in een basiseenheid of een bijzondere eenheid ingedeeld personeelslid van zijn korps jaarlijks, door middel
      van opleiding en oefening, blijft voldoen aan de geldende eindtermen, gesteld voor deze specifieke taak. Deze
      eindtermen omvatten minimaal 40 uur oefenen per jaar.
    url: https://wetten.overheid.nl/BWBR0021328/2017-03-18#Artikel12
  - number: '12.2'
    text: |-
      De basiseenheden en de bijzondere eenheden geoefend zijn en blijven in de samenwerking met relevante andere
      eenheden of organisatieonderdelen.
    url: https://wetten.overheid.nl/BWBR0021328/2017-03-18#Artikel12
  - number: '13'
    text: 'De korpschef draagt voor wat betreft het materieel zorg voor dat:'
    url: https://wetten.overheid.nl/BWBR0021328/2017-03-18#Artikel13
  - number: '13.1'
    text: |-
      De in deze regeling genoemde eenheden en BRATRA-groep de beschikking hebben over een voor de taak toegerust
      voertuig.
    url: https://wetten.overheid.nl/BWBR0021328/2017-03-18#Artikel13
  - number: '13.2'
    text: |-
      Een basiseenheid bij een zelfstandig optreden, anders dan een groep, de beschikking heeft over een
      commandovoertuig.
    url: https://wetten.overheid.nl/BWBR0021328/2017-03-18#Artikel13
  - number: '13.3'
    text: De ruiters de beschikking hebben over voor hun taak getrainde paarden.
    url: https://wetten.overheid.nl/BWBR0021328/2017-03-18#Artikel13
  - number: '13.4'
    text: |-
      Iedere hondengeleider de beschikking heeft over een gecertificeerde hond zoals voorgeschreven in de
      [Regeling politiehonden][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019728
    url: https://wetten.overheid.nl/BWBR0021328/2017-03-18#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0019728
  - number: '13.5'
    text: |-
      De leden van de in deze regeling genoemde eenheden en BRATRA-groep zijn uitgerust met adequate beschermings- en
      veiligheidsmiddelen.
    url: https://wetten.overheid.nl/BWBR0021328/2017-03-18#Artikel13
  - number: '13.6'
    text: |-
      De aangewezen leden van de in deze regeling genoemde eenheden en BRATRA-groep zijn uitgerust met een vuurwapen als
      bedoeld in [artikel 10 van het Besluit bewapening en uitrusting politie][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0032136#Artikel10
    url: https://wetten.overheid.nl/BWBR0021328/2017-03-18#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0032136
        artikel: '10'
  - number: '14'
    text: |-
      De korpschef draagt er zorg voor dat ten behoeve van de eenheden te water, als bedoeld in [artikel 3][ref1], kan
      worden beschikt over twee vaartuigen, een commandovaartuig en een reddingsvaartuig met een voor deze taak bekwame
      bemanning.


      [ref1]: https://wetten.overheid.nl/BWBR0021328#Artikel3
    url: https://wetten.overheid.nl/BWBR0021328/2017-03-18#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0021328
        artikel: '3'
        paragraaf: '3'
  - number: '15.1'
    text: |-
      De korpschef houdt het aantal basiseenheden uit de [bijlage 1][ref1] en [2][ref2] van deze regeling beschikbaar
      voor bijstand.


      [ref1]: https://wetten.overheid.nl/BWBR0021328
      [ref2]: https://wetten.overheid.nl/BWBR0021328
    url: https://wetten.overheid.nl/BWBR0021328/2017-03-18#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0021328
      - id: ref2
        bwb_id: BWBR0021328
  - number: '15.2'
    text: |-
      De korpschef houdt de bijzondere eenheden uit de [bijlage 3][ref1] van deze regeling beschikbaar voor bijstand.


      [ref1]: https://wetten.overheid.nl/BWBR0021328
    url: https://wetten.overheid.nl/BWBR0021328/2017-03-18#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0021328
  - number: '15.3'
    text: |-
      De korpschef draagt ervoor zorg dat basiseenheden, basiseenheden met een bijzondere taak en bijzondere eenheden
      zijn toegesneden op de behoefte in de regionale eenheid, dan wel in de samenwerkende regionale eenheden.
    url: https://wetten.overheid.nl/BWBR0021328/2017-03-18#Artikel15
  - number: '16.1'
    text: |-
      De korpschef draagt ervoor zorg dat in een regionale eenheid waarbinnen op basis van [bijlage 1][ref1] twee of
      meer pelotons basiseenheden voor bijstand beschikbaar moeten zijn, één peloton binnen anderhalf uur en een volgend
      peloton binnen vier uur gereed is voor vertrek.


      [ref1]: https://wetten.overheid.nl/BWBR0021328
    url: https://wetten.overheid.nl/BWBR0021328/2017-03-18#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0021328
  - number: '16.2'
    text: |-
      De korpschef draagt ervoor zorg dat in een regionale eenheid waarbinnen op basis van [bijlage 1][ref1] één peloton
      en één sectie basiseenheden voor bijstand beschikbaar moeten zijn, één sectie binnen anderhalf uur en één volgende
      sectie binnen vier uur gereed is voor vertrek.


      [ref1]: https://wetten.overheid.nl/BWBR0021328
    url: https://wetten.overheid.nl/BWBR0021328/2017-03-18#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0021328
  - number: '16.3'
    text: |-
      De korpschef draagt ervoor zorg dat in een regionale eenheid waarbinnen op basis van [bijlage 2][ref1] één peloton
      eenheden te water beschikbaar moet zijn, één sectie binnen anderhalf uur en de andere sectie binnen vier uur gereed
      is voor vertrek.


      [ref1]: https://wetten.overheid.nl/BWBR0021328
    url: https://wetten.overheid.nl/BWBR0021328/2017-03-18#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0021328
  - number: '16.4'
    text: |-
      De korpschef draagt ervoor zorg dat van de bijzondere eenheden die op basis van [bijlage 3][ref1] voor bijstand
      binnen een regionale eenheid beschikbaar moeten zijn, de helft, zijnde ten minste een groep of eenheid, binnen
      anderhalf uur gereed is voor vertrek, en de volgende groep of eenheid binnen vier uur gereed is voor vertrek.


      [ref1]: https://wetten.overheid.nl/BWBR0021328
    url: https://wetten.overheid.nl/BWBR0021328/2017-03-18#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0021328
  - number: '18.1'
    text: |-
      De korpschef draagt er zorg voor dat binnen elke regionale eenheid voldoende opvang en nazorg wordt aangeboden aan
      de ingezette leden tijdens en na een optreden van de mobiele eenheden.
    url: https://wetten.overheid.nl/BWBR0021328/2017-03-18#Artikel18
  - number: '18.2'
    text: |-
      De korpschef maakt, de gezagsverantwoordelijken gehoord hebbende, van elk grootschalig optreden waarbij sprake is
      geweest van ernstige verstoring van de openbare orde, een evaluatierapport op.
    url: https://wetten.overheid.nl/BWBR0021328/2017-03-18#Artikel18
  - number: '18.3'
    text: |-
      De korpschef verstrekt de Minister van Veiligheid en Justitie op diens verzoek een afschrift van het onder 2
      genoemde evaluatierapport.
    url: https://wetten.overheid.nl/BWBR0021328/2017-03-18#Artikel18
  - number: '19.1'
    text: |-
      De Minister kan de korpschef toestemming geven om voor bepaalde of onbepaalde tijd af te wijken van de bepalingen
      in deze regeling.
    url: https://wetten.overheid.nl/BWBR0021328/2017-03-18#Artikel19
  - number: '19.2'
    text: |-
      De Minister onthoudt zijn toestemming in gevallen de afwijking de [artikelen 3, eerste lid][ref1], [11][ref2],
      [12][ref3], [13][ref4], [14][ref5] en [18][ref6] en de rechtstoestand van het personeel raakt.


      [ref1]: https://wetten.overheid.nl/BWBR0021328#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0021328#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0021328#Artikel12
      [ref4]: https://wetten.overheid.nl/BWBR0021328#Artikel13
      [ref5]: https://wetten.overheid.nl/BWBR0021328#Artikel14
      [ref6]: https://wetten.overheid.nl/BWBR0021328#Artikel18
    url: https://wetten.overheid.nl/BWBR0021328/2017-03-18#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0021328
        artikel: '3'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0021328
        artikel: '11'
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0021328
        artikel: '12'
        paragraaf: '5'
      - id: ref4
        bwb_id: BWBR0021328
        artikel: '13'
        paragraaf: '5'
      - id: ref5
        bwb_id: BWBR0021328
        artikel: '14'
        paragraaf: '5'
      - id: ref6
        bwb_id: BWBR0021328
        artikel: '18'
        paragraaf: '8'
  - number: 19a
    text: |-
      Deze regeling berust op [artikel 44 van het Besluit beheer politie][ref1] en
      [artikel 28 van het Besluit bewapening en uitrusting politie][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0036705#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0032136#Artikel28
    url: https://wetten.overheid.nl/BWBR0021328/2017-03-18#Artikel19a
    references:
      - id: ref1
        bwb_id: BWBR0036705
        artikel: '44'
      - id: ref2
        bwb_id: BWBR0032136
        artikel: '28'
  - number: '20'
    text: |-
      De [Regeling mobiele eenheid][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0006554
    url: https://wetten.overheid.nl/BWBR0021328/2017-03-18#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0006554
  - number: '21.1'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van Staatscourant waarin zij wordt
      geplaatst en geldt voor de duur van twee jaar.
    url: https://wetten.overheid.nl/BWBR0021328/2017-03-18#Artikel21
  - number: '21.2'
    text: |-
      Deze regeling wordt automatisch verlengd voor onbepaalde tijd tenzij de leden van het Centraal Georganiseerd
      Overleg Politie met feiten aantonen dat uitvoering van de [artikelen 15][ref1] en [16][ref2] tot sociaal
      onaanvaardbare situaties leidt voor de leden van de mobiele eenheid in de regionale politiekorpsen.


      [ref1]: https://wetten.overheid.nl/BWBR0021328#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0021328#Artikel16
    url: https://wetten.overheid.nl/BWBR0021328/2017-03-18#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0021328
        artikel: '15'
        paragraaf: '6'
      - id: ref2
