---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: tijdelijke_regeling_eenmalige_uitkering_bestrijding_regionale_wateroverlast
regulatory_layer: WET
publication_date: '2004-02-27'
valid_from: '2004-04-01'
bwb_id: BWBR0016409
url: https://wetten.overheid.nl/BWBR0016409/2004-04-01
preamble:
  text: |-
    Gelet op artikel 17, vijfde lid, van de Financiële-verhoudingswet;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze regeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel1
  - number: 1.a
    text: '*Minister*: de Minister van Verkeer en Waterstaat;'
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel1
  - number: 1.b
    text: '*projectplan*: een plan voor een project met in ieder geval het oog op de bestrijding van regionale wateroverlast;'
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel1
  - number: 1.c
    text: '*uitvoeringsplan*: een plan ter uitvoering van één of meerdere projectplannen;'
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel1
  - number: 1.d
    text: |-
      *waterschap*: het waterschap dat voor het gebied waarop het in een uitvoeringsplan opgenomen projectplan betrekking
      heeft, belast is met in ieder geval het waterkwantiteitsbeheer, dan wel het beheer van waterkeringen;
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel1
  - number: 1.e
    text: '*gemeente*: de gemeente op wier grondgebied het in een uitvoeringsplan opgenomen projectplan betrekking heeft;'
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel1
  - number: 1.f
    text: |-
      *regionale wateroverlast*: overlast door een teveel aan water ten gevolge van in principe klimaatverandering,
      zeespiegelstijging, bodemdaling en verstedelijking in het systeem dat niet wordt beheerd door het Rijk;
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel1
  - number: 1.g
    text: |-
      *uitvoeringsorganisatie*: een door de Minister aan te wijzen organisatie belast met de uitvoering van deze
      regeling;
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel1
  - number: 1.h
    text: |-
      *stedelijk gebied*: bebouwde gedeelten van het gemeentelijk grondgebied zoals bedoeld in
      [artikel 1, eerste lid, van de Wet op de stads- en dorpsvernieuwing][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003709#Artikel1
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003709
        artikel: '1'
  - number: 1.i
    text: '*landelijk gebied*: gebied dat niet tot het stedelijk gebied behoort.'
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel1
  - number: '2.1'
    text: |-
      Ter stimulering van de uitvoering van activiteiten met het oog op de bestrijding van regionale wateroverlast,
      kunnen waterschappen en gemeenten een eenmalige specifieke uitkering verkrijgen als tegemoetkoming in de kosten
      van een uitvoeringsplan. Zij kunnen aanvragen voor een uitkering indienen bij een door de Minister aangewezen
      uitvoeringsorganisatie.
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel2
  - number: '2.2'
    text: |-
      Indien een waterschap of een gemeente in aanmerking wil komen voor een uitkering, dient een uitvoeringsplan aan de
      volgende criteria te voldoen:
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel2
  - number: 2.2.a
    text: |-
      de in het uitvoeringsplan opgenomen projecten dragen in ieder geval bij aan de bestrijding van regionale
      wateroverlast;
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel2
  - number: 2.2.b
    text: |-
      de in het uitvoeringsplan opgenomen projecten zijn niet strijdig met de door het provinciaal bestuur vastgestelde
      deelstroomgebiedsvisie geldend voor de provincie op wier grondgebied de projecten zullen worden uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel2
  - number: 2.2.c
    text: |-
      de in het uitvoeringsplan opgenomen projecten zijn uitgewerkt volgens de drietrapsstrategie vasthouden–bergen–
      afvoeren;
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel2
  - number: 2.2.d
    text: |-
      de in het uitvoeringsplan opgenomen projecten zijn afgestemd met de provincie, de gemeente en het waterschap,
      dan wel de provincies, de gemeenten en de waterschappen, op wier grondgebied de in het uitvoeringsplan opgenomen
      projecten zullen worden uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel2
  - number: 2.2.e
    text: de in het uitvoeringsplan opgenomen projecten zijn niet strijdig met het vigerend provinciaal ruimtelijk beleid;
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel2
  - number: 2.2.f
    text: |-
      een in een uitvoeringsplan opgenomen project dat betrekking heeft op landelijk gebied heeft voor wat betreft het
      aandeel dat ziet op de bestrijding van regionale wateroverlast een omvang van ten minste € 150.000;
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel2
  - number: 2.2.g
    text: |-
      een in een uitvoeringsplan opgenomen project dat betrekking heeft op stedelijk gebied heeft voor wat betreft het
      aandeel dat ziet op de bestrijding van regionale wateroverlast een omvang van ten minste € 50.000;
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel2
  - number: 2.2.h
    text: de in een uitvoeringsplan opgenomen projecten hebben een uitvoeringstermijn van niet langer dan vier jaar.
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel2
  - number: '3.1'
    text: |-
      Het totale bedrag van de op grond van deze regeling te verlenen uitkeringen bedraagt € 97 miljoen. Dit bedrag is
      inclusief eventueel verschuldigde BTW.
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel3
  - number: '3.2'
    text: |-
      Van het beschikbare bedrag zal, gedurende de eerste negen maanden vanaf het moment waarop de regeling in werking is
      getreden, ten minste 30% beschikbaar zijn voor uitvoeringsplannen die projecten in het stedelijk gebied betreffen,
      en zal ten minste 30% beschikbaar zijn voor uitvoeringsplannen die projecten in het landelijk gebied betreffen.
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel3
  - number: '3.3'
    text: Op de aanvragen wordt in volgorde van ontvangst beslist.
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel3
  - number: '4.1'
    text: |-
      De uitkering bedraagt per project maximaal 30% van de kosten die rechtstreeks zijn toe te rekenen aan de uitvoering
      van activiteiten ter bestrijding van regionale wateroverlast, doch per uitvoeringsplan niet meer dan € 4 miljoen.
      Dit bedrag is inclusief eventueel verschuldigde BTW.
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel4
  - number: '4.2'
    text: 'Tot de kosten, bedoeld in het eerste lid, behoren:'
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel4
  - number: 4.2.a
    text: |-
      kosten van de voor de uitvoering van de projecten gesloten overeenkomsten van aanneming en overeenkomsten tot
      levering van diensten en materialen;
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel4
  - number: 4.2.b
    text: |-
      kosten voor de verwerving van de voor de uitvoering van de projecten benodigde onroerende zaken, mits aannemelijk
      gemaakt wordt dat de verwerving een kostenefficiënte oplossing biedt voor de uitvoering van projecten.
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel4
  - number: '4.3'
    text: 'Tot de kosten, bedoeld in het eerste lid, behoren niet:'
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel4
  - number: 4.3.a
    text: kosten van algemene bestuurlijke aard;
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel4
  - number: 4.3.b
    text: exploitatiekosten, waaronder begrepen de kosten voor regulier beheer en onderhoud;
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel4
  - number: 4.3.c
    text: |-
      de kosten van werkzaamheden die tot de reguliere taken van de aanvrager behoren, welke kosten worden gemaakt ter
      uitvoering van een projectplan uit het uitvoeringsplan;
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel4
  - number: 4.3.d
    text: kosten die voortkomen uit achterstallig onderhoud;
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel4
  - number: 4.3.e
    text: overheadkosten, inclusief directiekosten;
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel4
  - number: 4.3.f
    text: de kosten van voorbereiding ten behoeve van projectplannen, inclusief bestekskosten;
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel4
  - number: 4.3.g
    text: de kosten van voorbereiding ten behoeve van het uitvoeringsplan;
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel4
  - number: 4.3.h
    text: onderzoekskosten;
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel4
  - number: 4.3.i
    text: de kosten van voorlichtingsactiviteiten;
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel4
  - number: 4.3.j
    text: |-
      fiscale kosten en BTW, tenzij de aanvrager kan aantonen dat er geen recht bestaat op een bijdrage uit het BTW-
      compensatiefonds;
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel4
  - number: 4.3.k
    text: |-
      de kosten die reeds op grond van een andere regeling voor een financiële bijdrage van het Rijk of de Europese Unie
      in aanmerking komen, dan wel kosten die door derde partijen worden gefinancierd;
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel4
  - number: 4.3.l
    text: |-
      de kosten voor schadevergoeding aan derden voorzover de beheerder daartoe rechtens is gehouden, anders dan uit
      hoofde van het in het tweede lid, onder b, bepaalde.
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel4
  - number: 4.3.m
    text: de kosten gemaakt in verband met het verkrijgen van een accountantsverklaring.
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel4
  - number: '5.1'
    text: |-
      De aanvraag voor een uitkering wordt door een waterschap dan wel een gemeente ingediend bij de
      uitvoeringsorganisatie met behulp van het door de Minister vastgestelde aanvraagformulier. Het aanvraagformulier is
      ondertekend door het bestuur van het waterschap, dan wel het bestuur van de gemeente.
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel5
  - number: '5.2'
    text: |-
      Een aanvraag kan door een waterschap of gemeente mede namens een ander waterschap of een andere gemeente worden
      ingediend. In dat geval gaat de aanvraag tevens vergezeld van een verklaring waaruit blijkt dat de aanvrager de
      aanvraag mede namens het andere waterschap of de andere gemeente indient en dat de aanvrager daartoe is gemachtigd
      door het andere waterschap of de andere gemeente. Tevens treedt in dit geval de aanvrager mede namens het andere
      waterschap of de andere gemeente op bij de verdere uitvoering van deze regeling.
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel5
  - number: '5.3'
    text: 'De aanvraag gaat vergezeld van:'
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel5
  - number: 5.3.a
    text: het uitvoeringsplan, opgesteld met behulp van het door de Minister vastgestelde formulier;
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel5
  - number: 5.3.b
    text: het projectplan of de projectplannen waarop het uitvoeringsplan betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel5
  - number: 5.3.c
    text: per project de begroting (uitgesplitst naar hoofdposten);
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel5
  - number: 5.3.d
    text: |-
      een afschrift van de adviesaanvraag, bedoeld in [artikel 6, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0016409#Artikel6
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0016409
        artikel: '6'
        paragraaf: '3'
  - number: 5.3.e
    text: een overzicht van de financierende partijen die de begroting dekken.
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel5
  - number: '5.4'
    text: 'Per project uit het uitvoeringsplan wordt aangegeven:'
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel5
  - number: 5.4.a
    text: de projectnaam en de projectlocatie;
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel5
  - number: 5.4.b
    text: de beoogde start- en einddatum;
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel5
  - number: 5.4.c
    text: de beoogde doelstelling (ten aanzien van de bestrijding van regionale wateroverlast en andere doelstellingen);
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel5
  - number: 5.4.d
    text: |-
      een specificatie van de begrote kosten, indien van toepassing dient het onderdeel bestrijding regionale
      wateroverlast naast overige doelen uitgesplitst te worden;
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel5
  - number: 5.4.e
    text: |-
      de financiële bijdragen voor het project die op grond van een andere regeling zijn aangevraagd of toegekend en die
      nodig zijn voor de uitvoering van de projecten;
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel5
  - number: 5.4.f
    text: |-
      een overzicht van de voor de uitvoering van het project benodigde besluiten die reeds zijn verkregen, dan wel,
      indien deze nog niet zijn verkregen, de ingediende aanvragen, dan wel de nog in te dienen aanvragen daartoe;
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel5
  - number: 5.4.g
    text: een overzicht van de voor de uitvoering van de projecten verworven, dan wel nog te verwerven gronden;
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel5
  - number: 5.4.h
    text: een specificatie van de begrote kosten volgens het kasritme van het uitvoeringsplan.
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel5
  - number: '5.5'
    text: 'Het uitvoeringsplan bevat:'
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel5
  - number: 5.5.a
    text: één of meerdere kaarten met een schaal van 1:10.000 waarop zijn aangegeven de geplande projecten,
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel5
  - number: 5.5.b
    text: |-
      een omschrijving van de in het aanvraagformulier opgenomen indicatoren waarop verantwoording dient plaats te
      vinden.
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel5
  - number: '5.6'
    text: Aanvragen kunnen worden ingediend tot uiterlijk 31 december 2005.
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel5
  - number: '6.1'
    text: |-
      Het waterschap dat, dan wel de gemeente die op grond van deze regeling in aanmerking wil komen voor een uitkering,
      vraagt tegelijk met het indienen van de aanvraag voor een uitkering, een advies aan de provincie op wier
      grondgebied de in het uitvoeringsplan opgenomen projecten zijn gelegen.
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel6
  - number: '6.2'
    text: |-
      In gevallen waarin het uitvoeringsplan zich uitstrekt over het grondgebied van meer dan één provincie, wordt het
      advies gevraagd aan de provincie op wier grondgebied door de uitvoering van de projecten in het uitvoeringsplan
      het meeste beslag wordt gelegd. Deze provincie overlegt over het uit te brengen advies met de overige betrokken
      provincies.
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel6
  - number: '6.3'
    text: |-
      De provincie stelt het advies op met behulp van het door de Minister vastgestelde adviesformulier en stuurt
      het binnen vier weken na ontvangst van de adviesaanvraag aan de uitvoeringsorganisatie. De provincie stuurt een
      afschrift van het advies aan de aanvrager van de uitkering.
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel6
  - number: '6.4'
    text: |-
      Indien het advies niet binnen vier weken kan worden gegeven, stelt de provincie de uitvoeringsorganisatie en de
      aanvrager daarvan in kennis en noemt zij daarbij een termijn waarbinnen het advies wel tegemoet kan worden gezien.
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel6
  - number: '6.5'
    text: 'Het advies heeft betrekking op de vraag of:'
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel6
  - number: 6.5.a
    text: de in het uitvoeringsplan opgenomen projecten bijdragen aan de bestrijding van regionale wateroverlast;
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel6
  - number: 6.5.b
    text: |-
      de in het uitvoeringsplan opgenomen projecten niet strijdig zijn met de door het provinciaal bestuur vastgestelde
      deelstroomgebiedsvisie geldend voor de provincie op wier grondgebied de projecten zullen worden uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel6
  - number: 6.5.c
    text: |-
      de in het uitvoeringsplan opgenomen projecten zijn uitgewerkt volgens de drietrapsstrategie vasthouden–bergen–
      afvoeren;
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel6
  - number: 6.5.d
    text: |-
      de in het uitvoeringsplan opgenomen projecten zijn afgestemd met de provincie, de gemeente en het waterschap, dan
      wel provincies, gemeenten en waterschappen, op wier grondgebied de projecten zullen worden uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel6
  - number: 6.5.e
    text: de in het uitvoeringsplan opgenomen projecten niet strijdig zijn met het vigerend provinciaal ruimtelijk beleid.
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel6
  - number: '7.1'
    text: |-
      De Minister betrekt bij de beoordeling van de aanvraag het advies bedoeld in [artikel 6][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0016409#Artikel6
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0016409
        artikel: '6'
        paragraaf: '3'
  - number: '7.2'
    text: 'De uitkering wordt niet verleend indien:'
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel7
  - number: 7.2.a
    text: |-
      het advies, bedoeld in [artikel 6][ref1], niet is ontvangen;


      [ref1]: https://wetten.overheid.nl/BWBR0016409#Artikel6
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0016409
        artikel: '6'
        paragraaf: '3'
  - number: 7.2.b
    text: |-
      de aanvraag niet voldoet aan de criteria als genoemd in [artikel 2, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0016409#Artikel2
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0016409
        artikel: '2'
        paragraaf: '2'
  - number: 7.2.c
    text: |-
      uit het uitvoeringsplan niet blijkt dat de uitvoering van het uitvoeringsplan zal worden gestart binnen zes maanden
      na de dag waarop de uitkering is verleend;
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel7
  - number: 7.2.d
    text: |-
      uit het uitvoeringsplan niet blijkt dat de werkzaamheden aan een project kunnen zijn afgerond binnen vier jaren
      nadat met de uitvoering van het project is gestart;
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel7
  - number: 7.2.e
    text: |-
      uit het uitvoeringsplan niet blijkt dat alle werkzaamheden ter uitvoering van het uitvoeringsplan in elk geval
      uiterlijk op 1 juli 2010 zijn afgerond;
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel7
  - number: 7.2.f
    text: de werkzaamheden al voor 1 januari 2004 zijn gestart;
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel7
  - number: 7.2.g
    text: |-
      er een gegronde reden bestaat om aan te nemen dat betrokkenen de uitvoering van het project dan wel de projecten,
      opgenomen in het uitvoeringsplan, niet kunnen financieren;
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel7
  - number: 7.2.h
    text: |-
      er een gegronde reden bestaat om aan te nemen dat de voor de uitvoering van het project benodigde besluiten niet
      zullen worden verkregen.
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel7
  - number: '7.3'
    text: |-
      [Artikel 4:35 van de Algemene wet bestuursrecht][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '8.1'
    text: |-
      Door de Minister wordt op de aanvragen in volgorde van ontvangst beslist, met dien verstande dat wanneer de
      aanvrager krachtens [artikel 4:5 van de Algemene wet bestuursrecht][ref1] de gelegenheid heeft gehad de aanvraag
      aan te vullen, de datum waarop de aanvraag is aangevuld geldt als datum van ontvangst.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '8.2'
    text: De Minister beslist binnen 13 weken na ontvangst van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel8
  - number: '8.3'
    text: |-
      Indien de beslissing niet binnen 13 weken kan worden gegeven, stelt de Minister de aanvrager daarvan in kennis en
      noemt hij daarbij een redelijke termijn waarbinnen de beschikking wel tegemoet kan worden gezien.
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel8
  - number: '8.4'
    text: |-
      [Artikel 4:48 van de Algemene wet bestuursrecht][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '8.5'
    text: |-
      Verlening van de uitkering geschiedt onder het voorbehoud van goedkeuring door de Staten-Generaal van de in de
      begroting van het Infrastructuurfonds opgenomen bedragen voor de uitkering voor het desbetreffende jaar.
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel8
  - number: '9.1'
    text: 'De beschikking tot de verlening van de uitkering bevat in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel9
  - number: 9.1.a
    text: een omschrijving van het doel waarvoor de uitkering wordt verleend;
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel9
  - number: 9.1.b
    text: het bedrag van de uitkering;
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel9
  - number: 9.1.c
    text: het deel van de uitkering dat voor ieder in het uitvoeringsplan opgenomen project is bedoeld;
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel9
  - number: 9.1.d
    text: de periode waarin het project, dan wel de projecten uit het uitvoeringsplan moet, dan wel moeten worden uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel9
  - number: 9.1.e
    text: het bedrag dat ten hoogste aan voorschotten kan worden verleend.
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel9
  - number: '9.2'
    text: |-
      De Minister kan bij de verlening van de uitkering een verplichting opleggen met betrekking tot het voor het Rijk
      beschikbaar, dan wel openbaar zijn van onderzoeksresultaten.
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel9
  - number: '9.3'
    text: |-
      [Artikel 4:37 van de Algemene wet bestuursrecht][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '10.1'
    text: |-
      Bij verlening van de uitkering wordt het bedrag aangegeven dat per kalenderjaar ten hoogste aan voorschotten
      kan worden verleend. Het totale bedrag dat aan voorschotten wordt verleend, bedraagt niet meer dan 80%, met een
      maximum van € 2 miljoen per jaar, van het bedrag van de verleende uitkering, voorzover de in de begroting van het
      Infrastructuurfonds opgenomen bedragen voor het desbetreffende jaar het toestaan.
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel10
  - number: '10.2'
    text: |-
      Voorschotten worden jaarlijks verleend op basis van in te dienen declaraties, die zijn afgestemd op de
      gerealiseerde voortgang van de activiteiten en die zijn onderbouwd met een (tussentijdse) voortgangsrapportage.
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel10
  - number: '10.3'
    text: |-
      De declaraties met de voortgangsrapportage worden na toekenning van de aanvraag in 2004 voor 1 oktober ingediend
      en in de daaropvolgende jaren steeds voor 1 september. Zes maanden na het einde van de looptijd van het
      uitvoeringsplan kunnen geen declaraties meer worden ingediend.
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel10
  - number: '10.4'
    text: |-
      De in het tweede lid bedoelde voortgangsrapportage bevat in ieder geval voor elk in het uitvoeringsplan opgenomen
      projectplan:
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel10
  - number: 10.4.a
    text: |-
      een overzicht van de gerealiseerde werkzaamheden in de periode tussen start van het project, dan wel het moment van
      de vorige declaratie, en het moment van indienen van de huidige declaratie;
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel10
  - number: 10.4.b
    text: |-
      een overzicht van alle voor het uitvoeringsplan gemaakte kosten, met een verbijzondering van de gemaakte kosten in
      de periode zoals bedoeld onder a, naar de kosten, bedoeld in [artikel 4, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0016409#Artikel4
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0016409
        artikel: '4'
        paragraaf: '2'
  - number: 10.4.c
    text: |-
      een geactualiseerde planning van de in het kader van het uitvoeringsplan nog te verrichten werkzaamheden, in het
      bijzonder in het eerstvolgende jaar;
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel10
  - number: 10.4.d
    text: |-
      een raming van alle voor het uitvoeringsplan nog te maken kosten, met een verbijzondering van de kosten voor het
      eerstvolgende jaar naar de kosten bedoeld in [artikel 4, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0016409#Artikel4
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0016409
        artikel: '4'
        paragraaf: '2'
  - number: 10.4.e
    text: |-
      een overzicht van de wijzigingen ten opzichte van het uitvoeringsplan, en specifiek ten aanzien van de daarin
      opgenomen indicatoren, zoals bedoeld in [artikel 5, vijfde lid, onder b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0016409#Artikel5
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0016409
        artikel: '5'
        paragraaf: '3'
  - number: '10.5'
    text: De voorschotten worden betaald binnen 8 weken na ontvangst van de declaratie met de voortgangsrapportage.
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel10
  - number: '10.6'
    text: |-
      Indien tijdens de uitvoering van een project uit het uitvoeringsplan aanzienlijke vertraging optreedt, kan de
      Minister met inachtneming van een redelijke termijn het moment van betaling van de voorschotten wijzigen en
      aanpassen aan de werkelijke voortgang van de uitvoering.
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel10
  - number: '11.1'
    text: |-
      Indien wijzigingen worden aangebracht in het uitvoeringsplan of in een projectplan die van belang zijn voor
      de doelstelling van de bestrijding van regionale wateroverlast, meldt de ontvanger van de uitkering zulks in
      schriftelijke vorm aan de uitvoeringsorganisatie, binnen een maand na de dag waarop de ontvanger op de hoogte
      was, dan wel had moeten zijn, van de desbetreffende wijziging. Bij deze melding worden aangegeven de aard van de
      wijziging, de reden van de wijziging en de gevolgen voor het uitvoeringsplan.
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel11
  - number: '11.2'
    text: |-
      Indien door onvoorziene omstandigheden een project uit het uitvoeringsplan niet of niet op de voorgenomen
      wijze kan worden uitgevoerd, heeft de ontvanger van de uitkering gedurende een maand de gelegenheid om
      het uitvoeringsplan aan te passen, mits de wijzigingen in overeenstemming zijn met de criteria, genoemd
      in [artikel 2, tweede lid][ref1]. De ontvanger van de uitkering dient het gewijzigde plan in bij de
      uitvoeringsorganisatie volgens het bepaalde in [artikel 5][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0016409#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0016409#Artikel5
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0016409
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0016409
        artikel: '5'
        paragraaf: '3'
  - number: '11.3'
    text: |-
      De Minister beoordeelt het gewijzigde uitvoeringsplan opnieuw. De [artikelen 4:48][ref1] en
      [4:50 van de Algemene wet bestuursrecht][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '11.4'
    text: |-
      De ontvanger van de uitkering voert het project, dan wel de projecten uit het uitvoeringsplan uit overeenkomstig
      het uitvoeringsplan of het gewijzigde uitvoeringsplan.
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel11
  - number: '12.1'
    text: |-
      De ontvanger van de uitkering dient binnen zes maanden na het einde van de looptijd van het uitvoeringsplan bij de
      uitvoeringsorganisatie een aanvraag in tot vaststelling van de uitkering.
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel12
  - number: '12.2'
    text: 'De aanvraag tot vaststelling van de uitkering gaat vergezeld van:'
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel12
  - number: 12.2.a
    text: |-
      een schriftelijk verslag van het verloop, de uitvoering en de reeds bekende resultaten van de uitgevoerde
      werkzaamheden;
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel12
  - number: 12.2.b
    text: |-
      een financieel eindverslag over de tijdens de looptijd van het uitvoeringsplan gemaakte kosten verbonden aan de
      activiteiten gericht op het bestrijden van regionale wateroverlast.
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel12
  - number: '12.3'
    text: |-
      Het financieel eindverslag, bedoeld in het tweede lid, onderdeel b, is voorzien van een verklaring, afgegeven door
      een accountant als bedoeld in [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1] en opgesteld
      overeenkomstig het door de Minister vastgestelde controleprotocol, verkrijgbaar bij de uitvoeringsorganisatie.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '12.4'
    text: |-
      Indien de verleende uitkering minder bedraagt dan € 100.000, kan, in afwijking van het derde lid, worden volstaan
      met een financieel eindverslag.
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel12
  - number: '12.5'
    text: |-
      Indien de aanvrager niet binnen de termijn, bedoeld in het eerste lid, een aanvraag tot vaststelling van de
      uitkering indient, stelt de Minister de uitkering ambtshalve vast.
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel12
  - number: '12.6'
    text: |-
      De [artikelen 4:46][ref1], [4:47][ref2] en [4:49 van de Algemene wet bestuursrecht][ref3] zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '13.1'
    text: De Minister neemt binnen 13 weken na ontvangst een beslissing op de aanvraag tot vaststelling van de uitkering.
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel13
  - number: '13.2'
    text: |-
      Indien de beslissing niet binnen 13 weken kan worden gegeven, stelt de Minister de aanvrager daarvan in kennis en
      noemt hij daarbij een redelijke termijn waarbinnen de beschikking wel tegemoet kan worden gezien.
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel13
  - number: '13.3'
    text: 'De beschikking tot vaststelling van de uitkering bevat in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel13
  - number: 13.3.a
    text: dagtekening en nummer van de beschikking tot vaststelling van de uitkering;
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel13
  - number: 13.3.b
    text: de berekeningswijze voor de vaststelling van het bedrag van de uitkering;
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel13
  - number: 13.3.c
    text: |-
      het bedrag van de vastgestelde uitkering, per project uitgesplitst overeenkomstig de in
      [artikel 4, tweede lid][ref1] genoemde kosten;


      [ref1]: https://wetten.overheid.nl/BWBR0016409#Artikel4
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0016409
        artikel: '4'
        paragraaf: '2'
  - number: 13.3.d
    text: de betaalde voorschotten;
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel13
  - number: 13.3.e
    text: het te betalen dan wel terug te vorderen bedrag.
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel13
  - number: '14.1'
    text: |-
      Het bedrag van de uitkering wordt overeenkomstig de vaststelling betaald, onder verrekening van de betaalde
      voorschotten.
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel14
  - number: '14.2'
    text: Het uitkeringsbedrag wordt binnen 4 weken na de vaststelling van de uitkering betaald.
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel14
  - number: '15'
    text: |-
      De Minister kan onverschuldigd betaalde uitkeringsbedragen en voorschotten terugvorderen voorzover na de betaling
      van de uitkering nog geen vijf jaren zijn verstreken.
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel15
  - number: '16.1'
    text: |-
      De ontvanger van de uitkering dient jaarlijks voor 31 januari een voortgangsrapportage in bij de
      uitvoeringsorganisatie.
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel16
  - number: '16.2'
    text: De voortgangsrapportage wordt voor de eerste maal uiterlijk op 31 januari 2005 ingediend.
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel16
  - number: '16.3'
    text: |-
      De in het eerste lid bedoelde voortgangsrapportage bevat in ieder geval voor elk in het uitvoeringsplan opgenomen
      projectplan:
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel16
  - number: 16.3.a
    text: een overzicht van de over het afgelopen jaar gerealiseerde werkzaamheden;
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel16
  - number: 16.3.b
    text: |-
      een overzicht van alle voor het uitvoeringsplan gemaakte kosten, met een verbijzondering van de over het afgelopen
      jaar gemaakte kosten naar de kosten, bedoeld in [artikel 4, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0016409#Artikel4
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0016409
        artikel: '4'
        paragraaf: '2'
  - number: 16.3.c
    text: |-
      een geactualiseerde planning van de in het kader van het uitvoeringsplan nog te verrichten werkzaamheden, in het
      bijzonder in het eerstvolgende jaar;
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel16
  - number: 16.3.d
    text: |-
      een raming van alle voor het uitvoeringsplan nog te maken kosten, met een verbijzondering van de kosten voor het
      eerstvolgende jaar naar de kosten bedoeld in [artikel 4, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0016409#Artikel4
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0016409
        artikel: '4'
        paragraaf: '2'
  - number: 16.3.e
    text: |-
      een overzicht van de wijzigingen ten opzichte van het uitvoeringsplan, en specifiek ten aanzien van de daarin
      opgenomen indicatoren, zoals bedoeld in [artikel 5, vijfde lid, onder b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0016409#Artikel5
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0016409
        artikel: '5'
        paragraaf: '3'
  - number: '16.4'
    text: |-
      [Artikel 4:48 van de Algemene wet bestuursrecht][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '17.1'
    text: |-
      De ontvanger van de uitkering verleent op verzoek van de Minister alle medewerking aan een door de Minister
      ingesteld evaluatieonderzoek, bedoeld om te beoordelen in welke mate de ontvanger van de uitkering met het
      uitvoeren van de in het uitvoeringsplan opgenomen projecten een bijdrage heeft geleverd aan de bestrijding van de
      regionale wateroverlast.
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel17
  - number: '17.2'
    text: |-
      De opgedane kennis en ervaring met betrekking tot de uitvoering van het uitvoeringsplan, stelt de ontvanger van de
      uitkering om niet ter beschikking aan de Minister voor gebruik ten algemenen nutte.
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel17
  - number: '17.3'
    text: |-
      De ontvanger van de uitkering verstrekt op verzoek van de Minister informatie ten behoeve van door de Minister te
      ondernemen communicatie- en voorlichtingsactiviteiten.
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel17
  - number: '18'
    text: |-
      Deze regeling treedt in werking met ingang van 1 april 2004 en vervalt met ingang van 1 januari 2008 met dien
      verstande dat zij van toepassing blijft op uitkeringen die voor die datum zijn verleend.
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel18
  - number: '19'
    text: 'Deze regeling wordt aangehaald als: Tijdelijke regeling eenmalige uitkering bestrijding regionale wateroverlast.'
    url: https://wetten.overheid.nl/BWBR0016409/2004-04-01#Artikel19
