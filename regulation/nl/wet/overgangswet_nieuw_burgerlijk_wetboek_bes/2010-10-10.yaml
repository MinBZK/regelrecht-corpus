  - number: '2'
    text: |-
      1 Van het tijdstip van haar in werking treden af is de wet van toepassing, indien op dat tijdstip is voldaan aan de
      door haar voor het intreden van een rechtsgevolg gestelde vereisten, tenzij uit de volgende artikelen iets anders
      voortvloeit.

      2 Voor zover en zolang op grond van de volgende artikelen de wet niet van toepassing is, blijft het vóór haar in
      werking treden geldende recht van toepassing.
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel2
  - number: '3'
    text: |-
      1 Wanneer de wet van toepassing wordt, heeft dat niet tot gevolg dat alsdan:

      a. iemand een vermogensrecht verliest dat hij onder het tevoren geldende recht had verkregen;

      b. een schuld op een ander overgaat;

      c. het bedrag van een vordering wordt gewijzigd;

      d. een goed met een beperkt recht wordt belast;

      e. een vorderingsrecht ontstaat, indien reeds voordien aan alle vereisten die de wet daartoe stelt, was voldaan.

      2 Bestaat op het tijdstip waarop de wet van toepassing wordt, een voortdurende toestand waaraan zij een
      vorderingsrecht verbindt, dan geldt zij daarvoor van dat tijdstip af voor het vervolg, tenzij uit de volgende
      artikelen iets anders voortvloeit.
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel3
  - number: '4'
    text: |-
      Tenzij anders is bepaald, wordt een rechtshandeling die is verricht voordat de wet van toepassing wordt, niet
      nietig of vernietigbaar ten gevolge van een omstandigheid die de wet, in tegenstelling tot het tevoren geldende
      recht, aanmerkt als een grond van nietigheid of vernietigbaarheid.
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel4
  - number: '5'
    text: |-
      1 Een rechtshandeling die vernietigbaar was tot aan het tijdstip waarop de wet van toepassing wordt, kan van dat
      tijdstip af niet langer worden vernietigd op grond van het gebrek dat haar tevoren aankleefde, indien de wet een
      zodanig gebrek niet aanmerkt als een grond van vernietigbaarheid.

      2 Een rechtshandeling als bedoeld in het eerste lid wordt op het daar genoemde tijdstip met terugwerkende kracht
      nietig, indien de wet een rechtshandeling met hetzelfde gebrek als nietig aanmerkt.
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel5
  - number: '6'
    text: |-
      1 Een nietige rechtshandeling wordt op het tijdstip waarop de wet van toepassing wordt, met terugwerkende
      kracht tot een onaantastbare bekrachtigd, indien zij heeft voldaan aan de vereisten die de wet voor een zodanige
      rechtshandeling stelt.

      2 Een tevoren nietige rechtshandeling geldt van dat tijdstip af als vernietigbaar, indien de wet het gebrek dat
      haar aankleeft, als grond van vernietigbaarheid aanmerkt.

      3 De vorige leden gelden slechts, indien alle onmiddellijk belanghebbenden die zich op de nietigheid hadden kunnen
      beroepen, de handeling voordien als geldig hebben aangemerkt. Inmiddels verkregen rechten van derden behoeven aan
      de bekrachtiging niet in de weg te staan, mits zij worden geëerbiedigd.
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel6
  - number: '7'
    text: |-
      1 Indien de wet een verjarings- of vervaltermijn op korter dan een jaar stelt, en die termijn overeenkomstig het
      in de wet bepaalde zou aanvangen vóór het tijdstip waarop zij van toepassing wordt, dan wordt deze aanvang naar dat
      tijdstip verschoven.

      2 Strekt de termijn tot vervanging van een termijn die door het tevoren geldende recht werd gesteld, dan eindigt de
      nieuwe termijn uiterlijk op het tijdstip waarop de vervangen termijn zou zijn voltooid.
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel7
  - number: '8'
    text: |-
      1 Indien de wet een verjarings- of vervaltermijn op een jaar of langer stelt, en die termijn overeenkomstig het
      in de wet bepaalde zou aanvangen vóór het tijdstip waarop zij van toepassing wordt, dan is het bepaalde omtrent
      aanvang, duur en aard van die termijn tot een jaar na dat tijdstip niet van toepassing.

      2 De nieuwe termijn wordt geacht niet vóór afloop van dat jaar te zijn voltooid.
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel8
  - number: '9'
    text: |-
      1 In afwijking van de [artikelen 7][ref1] en [8][ref2] kan een bevoegdheid die de wet toekent, niet meer worden
      uitgeoefend, indien de daarvoor bij de wet gestelde termijn reeds is verstreken vóór het tijdstip waarop zij
      van toepassing wordt, en een bevoegdheid van gelijke aard onder het tevoren geldende recht niet bestond. Evenwel
      kunnen rechtshandelingen die overeenkomstig [artikel 6, tweede lid][ref3], van deze wet vernietigbaar worden, nog
      gedurende een jaar na het tijdstip van het van toepassing worden der wet worden vernietigd, indien de door de wet
      gestelde termijn reeds op dat tijdstip was verstreken.

      2 Was de termijn waarbinnen volgens het tevoren geldende recht een recht of bevoegdheid moest zijn uitgeoefend,
      reeds verstreken op het in het eerste lid bedoelde tijdstip, dan brengt de wet die een recht of bevoegdheid van
      gelijke aard toekent, in het rechtsgevolg van de verjaring of het verval geen verandering.


      [ref1]: https://wetten.overheid.nl/BWBR0028466#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0028466#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0028466#Artikel6
