  - number: '37'
    text: |-
      Van het tijdstip van het in werking treden van de wet af wordt een curatele die is ingesteld op grond van het
      voordien geldende artikel 482, onder 1 (of 4), van het Burgerlijk Wetboek, aangemerkt als een curatele op grond van
      [artikel 378, onder a, van Boek 1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel378
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '378'
  - number: 37a
    text: |-
      [Artikel 2, eerste lid, van Boek 2][ref1] bepaalt mede de gevolgen van de daar genoemde gebreken in de oprichting
      van een rechtspersoon, welke voor het in werking treden van [Boek 2][ref2] is geschied. Het vierde lid geldt niet
      voor rechtspersonen die op voet van het derde lid zijn ontbonden en al voor het in werking treden van Boek 2 in een
      voorgewende rechtsvorm aan het verkeer deelnamen.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0028744
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel37a
    references:
      - id: ref1
        bwb_id: BWBR0028744
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0028744
  - number: 37b
    text: |-
      [Artikel 8, vierde tot en met zesde lid, van Boek 2][ref1] geldt alleen voor bestuurders en andere functionarissen
      die zijn benoemd of aangewezen na het in werking treden van [Boek 2][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0028744
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel37b
    references:
      - id: ref1
        bwb_id: BWBR0028744
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0028744
  - number: 37c
    text: |-
      De laatste volzin van [artikel 9, eerst lid, van Boek 2][ref1] geldt niet voor aandeelhoudersovereenkomsten die
      zijn gesloten voor het inwerking treden van [Boek 2][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0028744
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel37c
    references:
      - id: ref1
        bwb_id: BWBR0028744
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0028744
  - number: 37d
    text: |-
      [Artikel 15, tweede lid, Boek 2][ref1] geldt voor het eerst na afloop van het eerste boekjaar dat is aangevangen na
      het in werking treden van [Boek 2][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0028744
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel37d
    references:
      - id: ref1
        bwb_id: BWBR0028744
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0028744
  - number: 37e
    text: |-
      [Artikel 15, vijfde lid, van Boek 2][ref1] geldt voor rechtspersonen die bij het in werking treden van
      [Boek 2][ref2] bestaan en die geen besloten vennootschap zijn voor het eerst voor het kalenderjaar dat aanvangt
      nadat twee jaren na het in werking treden van Boek 2 zijn verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0028744
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel37e
    references:
      - id: ref1
        bwb_id: BWBR0028744
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0028744
  - number: 37f
    text: |-
      [Artikel 16 van Boek 2][ref1] geldt alleen voor het geval de faillissementstoestand onherroepelijk is ingetreden na
      het in werking treden van [Boek 2][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0028744
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel37f
    references:
      - id: ref1
        bwb_id: BWBR0028744
        artikel: '16'
      - id: ref2
        bwb_id: BWBR0028744
  - number: 37g
    text: |-
      Bij de toepassing van [artikel 16 van Boek 2][ref1] wordt slechts in aanmerking genomen het onbehoorlijk bestuur
      dat plaatsvond na het in werking treden van [Boek 2][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0028744
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel37g
    references:
      - id: ref1
        bwb_id: BWBR0028744
        artikel: '16'
      - id: ref2
        bwb_id: BWBR0028744
  - number: 37h
    text: |-
      Ten aanzien van commissarissen die zijn benoemd of aangewezen voor het in werking treden van [Boek 2][ref1] vindt
      het bepaalde in [artikel 19, derde lid, van Boek 2][ref2] eerst toepassing nadat twee jaren zijn verstreken sedert
      het in werking treden van Boek 2.


      [ref1]: https://wetten.overheid.nl/BWBR0028744
      [ref2]: https://wetten.overheid.nl/BWBR0028744#Artikel19
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel37h
    references:
      - id: ref1
        bwb_id: BWBR0028744
      - id: ref2
        bwb_id: BWBR0028744
        artikel: '19'
  - number: 37i
    text: |-
      De [artikelen 20 tot en met 23][ref1] gelden niet voor een besluit van een orgaan van een rechtspersoon dat voor
      het in werking treden van [ Boek 2][ref2] is genomen. Voor een dergelijk besluit blijft het toen geldende recht
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028466#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0028744
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel37i
    references:
      - id: ref1
        bwb_id: BWBR0028466
        artikel: '20'
      - id: ref2
        bwb_id: BWBR0028744
  - number: 37j
    text: |-
      [Artikel 24, negende lid, van Boek 2][ref1] geldt voor andere rechtspersonen dan de besloten vennootschap slechts
      indien de ontbindingsgrond na het in werking treden van [Boek 2][ref2] is ontstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0028744
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel37j
    references:
      - id: ref1
        bwb_id: BWBR0028744
        artikel: '24'
      - id: ref2
        bwb_id: BWBR0028744
  - number: 37k
    text: |-
      De [artikelen 29 tot en met 31 van Boek 2][ref1] zijn niet van toepassing op vereffeningen die zijn aangevangen
      voor het in werking treden van [Boek 2][ref2]. Op deze vereffeningen blijft het recht dat gold voor het in werking
      treden van Boek 2 van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0028744
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel37k
    references:
      - id: ref1
        bwb_id: BWBR0028744
        artikel: '29'
      - id: ref2
        bwb_id: BWBR0028744
  - number: 37l
    text: |-
      Het bepaalde in [artikel 36, tweede lid, van Boek 2][ref1] geldt voor rechtspersonen die reeds bestaan bij het in
      werking treden van [Boek 2][ref2] eerst nadat twee jaren na dat tijdstip zijn verstreken.Tot dat tijdstip blijft
      voor deze rechtspersonen het voordien geldend recht van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0028744
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel37l
    references:
      - id: ref1
        bwb_id: BWBR0028744
        artikel: '36'
      - id: ref2
        bwb_id: BWBR0028744
  - number: 37m
    text: |-
      Het bepaalde in [artikel 51, eerste lid, onder a][ref1], geldt voor de stichting particulier fonds die reeds
      bestaat bij het in werking treden van [Boek 2][ref2], eerst nadat twee jaren na dat tijdstip zijn verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0028466#Artikel51
      [ref2]: https://wetten.overheid.nl/BWBR0028744
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel37m
    references:
      - id: ref1
        bwb_id: BWBR0028466
        artikel: '51'
      - id: ref2
        bwb_id: BWBR0028744
  - number: 37n
    text: |-
      Bij de toepassing van [artikel 55, eerste lid, onder b][ref1], wordt slechts in aanmerking genomen het onbehoorlijk
      bestuur dat plaatsvond na het in werking treden van [Boek 2][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0028466#Artikel55
      [ref2]: https://wetten.overheid.nl/BWBR0028744
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel37n
    references:
      - id: ref1
        bwb_id: BWBR0028466
        artikel: '55'
      - id: ref2
        bwb_id: BWBR0028744
  - number: 37o
    text: |-
      1 [Artikel 73 van Boek 2][ref1] is niet van toepassing op een vereniging, een coöperatie of een onderlinge
      waarborgmaatschappij die op het tijdstip van het inwerkingtreden van [Boek 2][ref2] reeds rechtspersoonlijkheid
      bezat.

      2 Op een vereniging, coöperatie of onderlinge waarborgmaatschappij die op het tijdstip van het in werking treden
      van [Boek 2][ref3] bestaat, worden de [artikelen 79][ref4], [80][ref5], [81][ref6], [82][ref7], [85][ref8] en
      [91 van Boek 2][ref9] eerst van toepassing nadat twee jaren na dat tijdstip verstreken. Tot het verstrijken daarvan
      blijft het vóór dat tijdstip gegolden hebbende recht van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel73
      [ref2]: https://wetten.overheid.nl/BWBR0028744
      [ref3]: https://wetten.overheid.nl/BWBR0028744
      [ref4]: https://wetten.overheid.nl/BWBR0028744#Artikel79
      [ref5]: https://wetten.overheid.nl/BWBR0028744#Artikel80
      [ref6]: https://wetten.overheid.nl/BWBR0028744#Artikel81
      [ref7]: https://wetten.overheid.nl/BWBR0028744#Artikel82
      [ref8]: https://wetten.overheid.nl/BWBR0028744#Artikel85
      [ref9]: https://wetten.overheid.nl/BWBR0028744#Artikel91
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel37o
