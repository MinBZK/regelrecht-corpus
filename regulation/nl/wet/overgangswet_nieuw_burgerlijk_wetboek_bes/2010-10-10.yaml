  - number: '10'
    text: |-
      1 De bepalingen van de wet omtrent de rangorde waarin vorderingen uit de opbrengst van een goed moeten worden
      voldaan, gelden, behoudens het elders bepaalde, mede met betrekking tot vorderingen die op het tijdstip van het in
      werking treden van de wet bestaan.

      2 De wet is niet van toepassing op de rangorde bij de verdeling van de opbrengst van een goed dat op het tijdstip
      van haar in werking treden reeds ten behoeve van verhaal ter uitwinning is verkocht, noch op die bij de verdeling
      van hetgeen op een vordering op dat tijdstip reeds is geïnd.

      3 De wet is niet van toepassing op de rang van vorderingen die worden verhaald in iemands faillissement, indien zij
      in werking treedt nadat de rechter-commissaris overeenkomstig artikel 103 van het Faillissementsbesluit 1931 de dag
      heeft bepaald waarop die vorderingen uiterlijk ter verificatie moeten zijn ingediend.

      4 Het in werking treden van de wet heeft voor de dan bestaande vorderingen geen gevolg ten aanzien van de werking
      van een surséance van betaling, die voordien aan de schuldenaar voorlopig is verleend.
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel10
  - number: '11'
    text: |-
      Is voor de al dan niet toepasselijkheid van de bepalingen der wet omtrent aansprakelijkheid en schadevergoeding
      beslissend, of een schade vóór of na het in werking treden van de wet is ontstaan, en blijkt dat niet, dan is
      beslissend, of de schade vóór of na het in werking treden van de wet is bekend geworden.
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel11
  - number: '12'
    text: |-
      De aansprakelijkheid voor schade die is ontstaan of, bij toepassing van [artikel 11][ref1], bekend geworden na
      het in werking treden van de wet, wordt, ook met betrekking tot haar omvang, naar het tevoren geldende recht
      beoordeeld, indien die schade voortspruit uit dezelfde gebeurtenis of vóór het in werking treden van de wet bestaan
      hebbende toestand als een eerdere door de benadeelde geleden schade waarop dat recht van toepassing was. Hetzelfde
      geldt voor de aansprakelijkheid wegens iemands overlijden na het tijdstip van het in werking treden van de wet als
      gevolg van letsel dat vóór dat tijdstip is ontstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0028466#Artikel11
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0028466
        artikel: '11'
  - number: '13'
    text: |-
      Een beding dat naar een vóór het in werking treden van de wet geldend wetsartikel verwijst of de zakelijke inhoud
      van zo’n artikel weergeeft, wordt geacht een verwijzing naar of een weergave van de wet in te houden, tenzij zulks
      niet in overeenstemming met de strekking van het beding zou zijn.
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel13
  - number: '14'
    text: |-
      1 Het van toepassing worden van de wet heeft geen gevolg voor de bevoegdheid van de rechter voor wie voordien een
      geding is aangevangen, noch voor de aard van dat geding en voor de rechtsmiddelen tegen de uitspraak.

      2 Het tevoren geldende recht blijft van toepassing, indien een geding als bedoeld in het eerste lid in hoogste
      feitelijke instantie in staat van wijzen verkeert op het tijdstip waarop de wet van toepassing wordt, tenzij de
      rechter tot voortzetting van het geding beslist.

      3 In een geding ter zake van een cassatieberoep tegen een, vóór het van toepassing worden van de wet tot stand
      gekomen, uitspraak blijft het voordien geldende recht van toepassing. Dit geldt mede voor de verdere behandeling
      van de zaak door het gerecht waarnaar in cassatie is verwezen, tenzij de zaak als gevolg van cassatie door het
      gerecht in haar geheel opnieuw moet worden behandeld.

      4 In gedingen als bedoeld in het eerste lid bepaalt de rechter op verzoek van een der partijen of ambtshalve een
      termijn waarbinnen partijen de gelegenheid wordt geboden hun stellingen en conclusies voor zover nodig aan te
      passen aan de wet of aan deze of een der volgende titels. Stelt de rechter partijen tot een zodanige aanpassing
      in de gelegenheid, dan staat tegen die beslissing geen rechtsmiddel open; wijst de rechter een daartoe strekkend
      verzoek af, dan staat een rechtsmiddel daartegen gelijktijdig met de einduitspraak open.
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel14
  - number: '15'
    text: |-
      De in overgangsbepalingen vervatte verwijzing naar de regels van de wet of naar die van het tevoren geldende recht
      is in aan de rechter voorgelegde zaken niet van toepassing, indien de gelijkenis met elders in die bepalingen
      geregelde gevallen daartoe noopt of indien de toepassing onder de gegeven omstandigheden naar maatstaven van
      redelijkheid en billijkheid onaanvaardbaar zou zijn. De rechter beslist de zaak alsdan op de wijze die naar zijn
      oordeel in de gegeven omstandigheden het meest passend en billijk is.
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel15
  - number: '16'
    text: |-
      Een verzoek, gericht aan de Gouverneur, tot het verkrijgen van diens toestemming tot wijziging of vaststelling
      van een geslachtsnaam, dat vóór het tijdstip van het in werking treden van de wet is ingediend, doch waarop alsdan
      nog niet is beslist, wordt van dat tijdstip af aangemerkt en door hem behandeld als een verzoek tot wijziging of
      vaststelling van die geslachtsnaam overeenkomstig [artikel 7 van Boek 1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel7
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '7'
  - number: '17'
    text: |-
      1 [Artikel 31 van Boek 1][ref1] is niet van toepassing met betrekking tot een huwelijk dat vóór het tijdstip
      van het in werking treden van de wet reeds overeenkomstig het tevoren geldende artikel 101, 102 of 103 van het
      Burgerlijk Wetboek was afgekondigd.

      2 Op verzoeken tot het verlenen van dispensatie die vóór het tijdstip van het in werking treden van
      [artikel 31 van Boek 1][ref2] overeenkomstig het tevoren geldende artikel 78 van het Burgerlijk Wetboek bij de
      Gouverneur zijn ingediend, beslist deze met inachtneming van het ten tijde van zijn beslissing geldende recht;
      artikel 31, derde lid, van Boek 1 is in zulk een geval niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0028743#Artikel31
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '31'
      - id: ref2
        bwb_id: BWBR0028743
        artikel: '31'
  - number: '18'
    text: |-
      De stuiting van een huwelijk, aangevangen vóór het tijdstip van het in werking treden van
      [titel 5, afdeling 3, van Boek 1][ref1], vervalt op dat tijdstip, voor zover zij is geschied door een persoon die
      daartoe volgens die afdeling niet bevoegd is, of op een grond welke door die afdeling niet wordt gerechtvaardigd.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Afdeling3
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0028743
        afdeling: '3'
  - number: '19'
    text: |-
      Indien de aangifte van een huwelijk vóór het in werking treden van de wet is gedaan en de voltrekking daarvan
      nadien geschiedt, doet de ambtenaar van de burgerlijke stand, alvorens tot die voltrekking gelegenheid te geven,
      aan zich overleggen de bescheiden genoemd in [artikel 44 van Boek 1][ref1], met uitzondering van de in het eerste
      lid, onder h, van dat artikel bedoelde verklaring.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel44
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '44'
  - number: '20'
    text: |-
      Onverminderd het bepaalde in [artikel 14, tweede en derde lid][ref1], van
      deze wet, kan een huwelijk dat vóór het tijdstip van het in werking treden van
      [titel 5, afdeling 4, van Boek 1][ref2] is voltrokken, nadien slechts worden nietig verklaard, indien de
      [zesde afdeling van de vierde titel van het Eerste Boek van het Burgerlijk Wetboek][ref3], zoals deze vóór
      dat tijdstip gold, de mogelijkheid daartoe openstelde, en tevens [titel 5, afdeling 5, van Boek 1][ref4]
      nietigverklaring toelaat.


