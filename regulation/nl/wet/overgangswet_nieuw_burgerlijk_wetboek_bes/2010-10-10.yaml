        artikel: '97'
  - number: '24'
    text: |-
      1 Indien echtscheiding, scheiding van tafel en bed of ontbinding van het huwelijk na scheiding van tafel en bed
      is uitgesproken vóór het tijdstip van in werking treden van de wet of daarna doch met toepassing van het vóór dat
      tijdstip geldende recht, is ten aanzien van de vraag of op een der partijen de verplichting rust om uit dien hoofde
      aan de andere partij levensonderhoud te verschaffen, eveneens het vóór dat tijdstip geldende recht van toepassing.
      Wordt na het in werking treden van de wet een huwelijk ontbonden nadat de echtgenoten overeenkomstig het tevoren
      geldende recht van tafel en bed waren gescheiden, dan is met betrekking tot het recht op levensonderhoud het
      tevoren geldende artikel 255 van toepassing.

      2 In afwijking van het eerste lid zijn de [artikelen 158][ref1] en [159 van Boek 1][ref2] van toepassing, indien
      partijen na het tijdstip van het in werking treden van de wet bij overeenkomst bepalen of de een tegenover
      de ander tot een uitkering voor diens levensonderhoud is gehouden. 3. In afwijking van het eerste lid is
      [artikel 160 van Boek 1][ref3] van toepassing, indien de andere partij na het tijdstip van in werking treden van de
      wet opnieuw in het huwelijk treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel158
      [ref2]: https://wetten.overheid.nl/BWBR0028743#Artikel159
      [ref3]: https://wetten.overheid.nl/BWBR0028743#Artikel160
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel24
