  - number: '28'
    text: |-
      Een verzoek tot verlening van brieven van wettiging die vóór het tijdstip van het in werking treden van de wet tot
      de Gouverneur is gericht, vervalt op dat tijdstip, indien alsdan op dat verzoek nog niet is beslist.
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel28
  - number: '29'
    text: |-
      1 Indien vóór het tijdstip van het in werking treden van de wet een verzoek tot adoptie is ingediend overeenkomstig
      het tevoren geldende artikel 331a van het Burgerlijk Wetboek en een beslissing daaromtrent op dat tijdstip nog niet
      in kracht van gewijsde is gegaan, is in de plaats van de in [artikel 228, eerste lid, onder a, van Boek 1][ref1]
      gestelde voorwaarde van minderjarigheid van het kind, vereist dat het op de dag van het adoptieverzoek of het
      eerste adoptieverzoek de leeftijd van eenentwintig jaren nog niet had bereikt en niet gehuwd was of gehuwd was
      geweest.

      2 Indien het verzoek daartoe binnen twee jaren na het in werking treden van de wet is gedaan, kan adoptie worden
      uitgesproken van een kind dat op de dag van het verzoek meerderjarig is, doch niet is gehuwd of gehuwd geweest
      en de leeftijd van eenentwintig jaren nog niet heeft bereikt. Tegen toewijzing van het verzoek staat geen ander
      rechtsmiddel open dan beroep in cassatie in het belang der wet.

      3 De adoptie van een kind met toepassing van dit artikel kan niet worden herroepen.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel228
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '228'
  - number: '30'
    text: |-
      Indien een verzoek tot adoptie uitsluitend op de grond van het niet vervuld zijn van de voorwaarde bedoeld in het
      tevoren geldende artikel 331b, aanhef en onder d, eerste volzin, van het Burgerlijk Wetboek, is afgewezen, blijft
      de tweede volzin van het bedoelde onderdeel van toepassing.
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel30
  - number: '31'
    text: |-
      1 Wanneer in een overeenkomst die vóór het in werking treden van de wet is aangegaan of in een uiterste
      wilsbeschikking die voordien is gemaakt, de uitoefening van enig recht of de nakoming van enige verplichting
      afhankelijk is gesteld van het tijdstip waarop iemand de meerderjarigheid zal hebben bereikt, wordt dat tijdstip
      bepaald volgens het tevoren geldende artikel 332 van het Burgerlijk Wetboek.

      2 Wanneer echter in een overeenkomst die vóór het in werking treden van de wet is aangegaan of in een
      wilsbeschikking die voordien is gemaakt, de uitoefening van enig recht of de nakoming van enige verplichting
      afhankelijk is gesteld van de voorwaarde of de termijn waarop hetzij iemand de leeftijd van eenentwintig jaren
      zal hebben bereikt, hetzij eerder meerderjarig is geworden, wordt het tijdstip waarop de meerderjarigheid wordt
      bereikt, bepaald volgens [artikel 233 van Boek 1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel233
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '233'
  - number: '32'
    text: |-
      1 Een vóór het tijdstip van het in werking treden van de wet door de rechter getroffen regeling inzake
      de gezamenlijke ouderlijke macht na gerechtelijke ontbinding van het huwelijk of na scheiding van tafel
      en bed geldt met ingang van dat tijdstip als een regeling inzake het gezamenlijk gezag als bedoeld in
      [artikel 251, tweede lid, van Boek 1][ref1].

      2 Een vóór het tijdstip van het in werking treden van de wet door de rechter gegeven beslissing inzake de
      uitoefening van de ouderlijke macht door ongehuwde en nimmer met elkaar gehuwd geweest zijnde ouders die niet is
      aangetekend in het gezagsregister, blijft tot zes maanden na dat tijdstip van kracht. Indien binnen die termijn
      geen aantekening is gedaan als bedoeld in [artikel 252, eerste lid, van Boek 1][ref2], is van rechtswege de moeder
      alleen met het gezag over het kind belast.

      3 Een vóór het tijdstip van het in werking treden van de wet door de rechter gegeven beslissing inzake de
      uitoefening van de ouderlijke macht door één der ouders of inzake de uitoefening van de voogdij door een ouder
      geldt met ingang van dat tijdstip als een beslissing inzake de uitoefening van het ouderlijk gezag door een der
      ouders.

      4 De ouder die vóór het tijdstip van het in werking treden van de wet van rechtswege de voogdij had over zijn kind,
      heeft vanaf dat tijdstip van rechtswege alleen het ouderlijk gezag over het kind.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel251
      [ref2]: https://wetten.overheid.nl/BWBR0028743#Artikel252
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '251'
      - id: ref2
        bwb_id: BWBR0028743
        artikel: '252'
  - number: '33'
    text: |-
      1 De artikelen 416 en 417 van het Burgerlijk Wetboek en artikel 818 van het Wetboek van Burgerlijke
      Rechtsvordering, zoals die vóór het tijdstip van het in werking treden van de wet golden, zijn na dit tijdstip van
      toepassing op een voogdij die voordien is aangevangen.

      2 Heeft de rechter vóór het tijdstip van het in werking treden van de wet een gehuwde vrouw tot voogdes benoemd,
      en is de voogdij op dat tijdstip nog niet begonnen, dan zijn nadien artikel 373, tweede lid, onder 1(, van
      het Burgerlijk Wetboek en 810 van het Wetboek van Burgerlijke Rechtsvordering, zoals die voordien golden, van
      toepassing.
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel33
  - number: '34'
    text: |-
      Artikel 450, tweede lid, van het Burgerlijk Wetboek, zoals dat vóór het tijdstip van het in werking treden van de
      wet gold voor een voogd, blijft van toepassing op diens aanspraak op loon, zolang de rechter daaromtrent niet een
      beslissing op grond van [artikel 358 van Boek 1][ref1] heeft genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel358
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '358'
  - number: '35'
    text: |-
      Artikel 466 van het Burgerlijk Wetboek, zoals dat gold tot aan het tijdstip van het in werking treden van de wet,
      blijft van toepassing op hetgeen de minderjarige op dat tijdstip aan de voogd na het einde van diens bewind nog
      schuldig was gebleven.
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel35
  - number: '36'
    text: |-
      1 Een vóór het tijdstip van het in werking treden van de wet door de rechter getroffen regeling inzake de omgang
      tussen het kind en de niet met het gezag belaste ouder of, ingeval van gezamenlijke gezagsuitoefening, tussen het
      kind en de ouder bij wie het kind zijn gewone verblijfplaats niet heeft dan wel tussen het kind en een ander dan de
      ouder geldt met ingang van dat tijdstip als een regeling inzake de omgang als bedoeld in de [artikelen 377a][ref1],
      [377f][ref2] of [377h van Boek 1][ref3].

      2 Indien vóór het tijdstip van het in werking treden van de wet de rechter afwijzend heeft beslist op een vordering
      onderscheidenlijk een verzoek van beide ouders of van één van hen tot het treffen van een regeling inzake de omgang
      met het kind, geldt zodanige beslissing met ingang van dat tijdstip als een ontzegging van het recht op omgang als
      bedoeld in [artikel 377a, derde lid, van Boek 1][ref4].

      3 Een vóór het tijdstip van het in werking treden van de wet door de rechter getroffen regeling inzake het
      verschaffen van informatie betreffende de persoon van het kind of diens verzorging en opvoeding aan de niet
      met het gezag belaste ouder of, ingeval van gezamenlijke gezagsuitoefening, aan de ouder bij wie het kind zijn
      gewone verblijfplaats niet heeft, door de andere ouder dan wel door derden geldt met ingang van dat tijdstip
      als een regeling inzake het verschaffen van informatie als bedoeld in [artikel 377b, eerste lid][ref5],
      [onderscheidenlijk 377c][ref6] dan wel [377h van Boek 1][ref7].

      4 Indien in het geval, bedoel in [artikel 32, derde lid][ref8], van deze wet, de met het gezag belaste
      ouder binnen een maand na het tijdstip van het in werking treden van de wet een verzoek als bedoeld in
      [artikel 377b, tweede lid, van Boek 1][ref9] heeft gedaan, is artikel 377b, eerste lid, van Boek 1 in ieder geval
      niet van toepassing, zolang niet onherroepelijk op dat verzoek is beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel377a
      [ref2]: https://wetten.overheid.nl/BWBR0028743#Artikel377f
      [ref3]: https://wetten.overheid.nl/BWBR0028743#Artikel377h
      [ref4]: https://wetten.overheid.nl/BWBR0028743#Artikel377a
      [ref5]: https://wetten.overheid.nl/BWBR0028743#Artikel377b
      [ref6]: https://wetten.overheid.nl/BWBR0028743#Artikel377c
      [ref7]: https://wetten.overheid.nl/BWBR0028743#Artikel377h
      [ref8]: https://wetten.overheid.nl/BWBR0028466#Artikel32
      [ref9]: https://wetten.overheid.nl/BWBR0028743#Artikel377b
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel36
