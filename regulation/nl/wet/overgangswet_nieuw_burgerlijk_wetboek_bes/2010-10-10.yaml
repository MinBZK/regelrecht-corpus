  - number: '1'
    text: |-
      1 De in deze wet zonder nadere aanduiding aangehaalde bepalingen zijn de bepalingen van de ingevoerde boeken 1 en
      volgende van het Burgerlijk Wetboek.

      2 In de volgende artikelen worden onder «de wet» verstaan de in werking getreden bepalingen van de in het eerste
      lid bedoelde boeken.

      3 In deze wet wordt, voor zover nodig, mede verstaan onder:

      a. het Burgerlijk Wetboek: het Burgerlijk Wetboek BES;

      b. het Faillissementsbesluit 1931: de [Faillissementswet BES][ref1];

      c. het Wetboek van Burgerlijke Rechtsvordering: het [Wetboek van Burgerlijke Rechtsvordering BES][ref2];

      d. het Wetboek van Koophandel: het [Wetboek van Koophandel BES][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0028917
      [ref2]: https://wetten.overheid.nl/BWBR0028496
      [ref3]: https://wetten.overheid.nl/BWBR0028278
