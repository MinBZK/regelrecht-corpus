  - number: '22'
    text: |-
      Op rechtshandelingen die een echtgenoot vóór het in werking treden van de wet in strijd met het toen geldende
      artikel 169 van het Burgerlijk Wetboek heeft verricht, blijft het toen geldende artikel 170 van dat wetboek van
      toepassing.
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel22
  - number: '23'
    text: |-
      De tweede en de derde volzin van [artikel 97, eerste lid, van Boek 1][ref1] zijn van hun in werking treden af mede
      van toepassing op de goederen die reeds voordien in de gemeenschap waren gevallen.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel97
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel23
