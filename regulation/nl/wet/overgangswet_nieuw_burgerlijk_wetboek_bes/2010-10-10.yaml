  - number: '25'
    text: |-
      [Artikel 157, vierde tot en met zesde lid, van Boek 1][ref1] is slechts van toepassing op de uitkeringen tot
      levensonderhoud ter zake van de ontbinding door echtscheiding van huwelijken die na het in werking treden van die
      leden zijn voltrokken. Hetzelfde geldt voor de [artikelen 169, tweede lid][ref2], en [182 van dat Boek][ref3],
      voor zover deze de in de eerste volzin bedoelde leden van artikel 157 onder voorbehoud van nadere bepalingen van
      overeenkomstige toepassing verklaren.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel157
      [ref2]: https://wetten.overheid.nl/BWBR0028743#Artikel169
      [ref3]: https://wetten.overheid.nl/BWBR0028743#Artikel182
