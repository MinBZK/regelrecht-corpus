  - number: '26'
    text: |-
      Het tevoren geldende artikel 298 van het Burgerlijk Wetboek blijft van toepassing op de gevolgen van een verzoening
      van echtgenoten die van tafel en bed waren gescheiden, indien die verzoening vóór het in werking treden van de wet
      is geschied.
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel26
  - number: '27'
    text: |-
      1 Een meerderjarig kind aan wie op het moment van inwerkingtreding van de wet bekend is dat de man die hem erkend
      heeft vermoedelijk niet zijn biologische vader is, kan gedurende een termijn van vijf jaren te rekenen vanaf het
      tijdstip van inwerkingtreding van de wet een verzoek tot vernietiging van de erkenning doen overeenkomstig de
      bepalingen van de wet.

      2 Een meerderjarig kind aan wie op het moment van inwerkingtreding van de wet bekend is dat de man die op grond
      van huwelijk met zijn moeder zijn vader is, vermoedelijk niet zijn biologische vader is, kan gedurende een termijn
      van vijf jaren te rekenen vanaf het tijdstip van inwerkingtreding van de wet een verzoek tot ontkenning van het
      vaderschap doen overeenkomstig de bepalingen van de wet.

      3 Een op het tijdstip van inwerkingtreding van de wet lopende termijn voor de ontkenning van het vaderschap door
      de vader of door een afstammeling als bedoeld in [artikel 201, eerste lid, van Boek 1][ref1] wordt verlengd tot
      een jaar.

      4 Een op het tijdstip van inwerkingtreding van de wet lopende termijn voor de vernietiging van de erkenning door
      de vader of door een afstammeling als bedoeld in [artikel 201, eerste lid, van Boek 1][ref2] wordt verlengd tot
      een jaar.

      5 Indien de geboorte van een kind voor het tijdstip van inwerkingtreding van de wet heeft plaatsgevonden tijdens
      het huwelijk van zijn vader en moeder of binnen 306 dagen nadien, kan de moeder of haar afstammelingen als bedoeld
      in [artikel 201, eerste lid, van Boek 1][ref3] gedurende twee jaren vanaf het tijdstip van inwerkingtreding van de
      wet een verzoek tot ontkenning van het vaderschap doen overeenkomstig [artikel 200 van Boek 1][ref4]. De moeder kan
      dit verzoek slechts doen indien het kind op het tijdstip van de indiening van het verzoek de leeftijd van twaalf
      jaren nog niet heeft bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel201
      [ref2]: https://wetten.overheid.nl/BWBR0028743#Artikel201
      [ref3]: https://wetten.overheid.nl/BWBR0028743#Artikel201
      [ref4]: https://wetten.overheid.nl/BWBR0028743#Artikel200
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel27
