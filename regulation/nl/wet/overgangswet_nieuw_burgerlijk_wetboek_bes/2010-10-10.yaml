  - number: '176'
    text: |-
      Op aansprakelijkheid die voortvloeit uit een voorval dat vóór het in werking treden van [titel 7 van Boek 8][ref1]
      heeft plaatsgevonden, zijn de bepalingen van deze titel niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028753
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel176
    references:
