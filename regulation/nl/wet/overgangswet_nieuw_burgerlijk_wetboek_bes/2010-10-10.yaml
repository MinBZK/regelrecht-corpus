    text: |-
      Op rechtshandelingen die een echtgenoot vóór het in werking treden van de [artikelen 88][ref1] en
      [89 van Boek 1][ref2] heeft verricht, blijven de totdan geldende artikelen 158, 159 en 160 van het Burgerlijk
      Wetboek van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel88
      [ref2]: https://wetten.overheid.nl/BWBR0028743#Artikel89
