    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel177
  - number: '178'
    text: |-
      Op de verjaring en het verval van een rechtsvordering waarvan de termijn werd geregeld door het
      [Wetboek van Koophandel BES][ref1], zijn de bepalingen van[ titel 20, afdelingen 2 en volgende, van Boek 8][ref2]
      niet van toepassing, indien die termijn vóór het in werking treden van dat [Boek][ref3] reeds was aangevangen.


      [ref1]: https://wetten.overheid.nl/BWBR0028278
      [ref2]: https://wetten.overheid.nl/BWBR0028753#Afdeling2
