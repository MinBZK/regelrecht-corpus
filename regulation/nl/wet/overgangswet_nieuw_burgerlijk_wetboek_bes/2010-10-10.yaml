  - number: '144'
    text: |-
      De [artikelen 48a tot en met 48e][ref1] en [48g van Boek 7][ref2] zijn niet van toepassing op overeenkomsten die
      vóór het tijdstip van inwerkingtreding van deze artikelen zijn gesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0028751#Artikel48a
      [ref2]: https://wetten.overheid.nl/BWBR0028751#Artikel48g
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel144
    references:
      - id: ref1
        bwb_id: BWBR0028751
        artikel: 48a
      - id: ref2
        bwb_id: BWBR0028751
        artikel: 48g
  - number: '155'
    text: |-
      [Artikel 407, tweede lid, van Boek 7][ref1] is niet van toepassing op een overeenkomst van opdracht die vóór het in
      werking treden van de wet is gesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0028751#Artikel407
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel155
    references:
      - id: ref1
        bwb_id: BWBR0028751
        artikel: '407'
  - number: '156'
    text: |-
      1 [Titel 7, afdeling 4, van Boek 7][ref1] wordt twee jaren na het tijdstip van het in werking treden van de wet van
      toepassing op agentuurovereenkomsten die vóór dat tijdstip zijn gesloten.

      2 Bij de bepaling van de vergoeding bedoeld in [artikel 442 van Boek 7][ref2], wordt de hogere waarde die de
      handelsagent aan de principaal heeft verschaft in de periode voorafgaande aan zes jaren vóór het in het eerste lid
      bedoelde tijdstip, buiten beschouwing gelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0028751#Afdeling4
      [ref2]: https://wetten.overheid.nl/BWBR0028751#Artikel442
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel156
    references:
      - id: ref1
        bwb_id: BWBR0028751
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0028751
        artikel: '442'
  - number: '157'
    text: |-
      De bepalingen van [titel 7A van Boek 7][ref1] worden op reisovereenkomsten die vóór het tijdstip van het in werking
      treden van de wet zijn gesloten, een jaar na dat tijdstip voor het vervolg van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028751
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel157
    references:
      - id: ref1
        bwb_id: BWBR0028751
  - number: '167'
    text: |-
      1 [Titel 14, afdelingen 1][ref1] en [2, van Boek 7][ref2] zijn niet van toepassing op een borgtocht die ten tijde
      van het in werking treden van de wet reeds bestaat.

      2 [Titel 14, afdeling 3, van Boek 7][ref3] blijft buiten toepassing op de gevolgen van de borgtocht tussen de
      hoofdschuldenaar en de borg en tussen de borgen en voor de verbintenis aansprakelijke niet-schuldenaren onderling,
      indien vóór het in werking treden van de wet aan de schuldeiser is betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0028751#Afdeling1
      [ref2]: https://wetten.overheid.nl/BWBR0028751#Afdeling2
      [ref3]: https://wetten.overheid.nl/BWBR0028751#Afdeling3
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel167
    references:
      - id: ref1
        bwb_id: BWBR0028751
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0028751
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0028751
        afdeling: '3'
  - number: '168'
    text: |-
      [Artikel 904, eerste lid, van Boek 7][ref1] is niet van toepassing op een beslissing die vóór zijn in werking
      treden is tot stand gekomen. Het tweede lid van dat artikel geldt mede voor een beslissing als in de vorige volzin
      is bedoeld, indien een partij overeenkomstig de maatstaven van het tevoren geldende recht daaraan niet gebonden
      wordt geacht.


      [ref1]: https://wetten.overheid.nl/BWBR0028751#Artikel904
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel168
    references:
      - id: ref1
        bwb_id: BWBR0028751
        artikel: '904'
  - number: '170'
    text: |-
      Op zaken die als gevolg van het in werking treden van de [artikelen 1][ref1], [2][ref2] of [3a van Boek 8][ref3]
      schip, zeeschip, luchtvaartuig, dan wel bestanddeel daarvan of scheepstoebehoren worden, of ophouden dat te
      zijn, en die op het tijdstip van het in werking treden zijn begrepen in een beslag of executie, blijft tot aan
      de levering het tevoren geldend recht van kracht. De vorige volzin is van overeenkomstige toepassing, indien
      een zodanige verandering het gevolg is van een landsbesluit, houdende algemene maatregelen, als in die artikelen
      bedoeld.


      [ref1]: https://wetten.overheid.nl/BWBR0028753#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0028753#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0028753#Artikel3a
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel170
    references:
      - id: ref1
        bwb_id: BWBR0028753
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0028753
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0028753
        artikel: 3a
  - number: '171'
    text: |-
      1 Verhindert [artikel 3, aanhef en onder a][ref1], van deze wet dat een voortbewegingswerktuig of machinerie op het
      tijdstip van het in werking treden van de wet door natrekking eigendom van de reder van een schip wordt, dan treedt
      dat gevolg in op het tijdstip waarop het overeenkomstig het tevoren geldende recht zou geschieden.

      2 [Artikel 24, eerste lid, van Boek 3][ref2] wordt eerst drie maanden na het tijdstip van het in werking treden van
      [artikel 1 van Boek 8][ref3] van toepassing op een bestaand beding als bedoeld in het vijfde lid van dat artikel
      dat op dat tijdstip nog niet in de openbare registers is ingeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0028466#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0028745#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0028753#Artikel1
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel171
    references:
      - id: ref1
        bwb_id: BWBR0028466
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0028745
        artikel: '24'
      - id: ref3
        bwb_id: BWBR0028753
        artikel: '1'
  - number: '172'
    text: |-
      Op de overeenkomsten van vervoer en die tot het doen vervoeren van goederen, alsmede andere overeenkomsten tot
      het ter beschikking stellen van een schip, is [Boek 8][ref1] niet van toepassing, indien die overeenkomsten zijn
      gesloten vóór het tijdstip van het in werking treden van dit Boek. Hetzelfde geldt voor de wettelijke rechten en
      bevoegdheden die een derde aan een vervoersdocument kan ontlenen en de wettelijke verplichtingen die met betrekking
      daartoe op hem rusten, indien het document vóór dat tijdstip is uitgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0028753
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel172
    references:
      - id: ref1
        bwb_id: BWBR0028753
  - number: '173'
    text: |-
      [Titel 3, afdeling 1, van Boek 8][ref1] is gedurende drie maanden na het tijdstip van haar in werking treden niet
      van toepassing op een rederij als omschreven in het tevoren geldende artikel 411 van het Wetboek van Koophandel,
      welke niet voldoet aan de omschrijving van [artikel 160 van Boek 8][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0028753#Afdeling1
      [ref2]: https://wetten.overheid.nl/BWBR0028753#Artikel160
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel173
    references:
      - id: ref1
        bwb_id: BWBR0028753
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0028753
        artikel: '160'
  - number: '174'
    text: |-
      Op een aanvaring welke heeft plaats gehad vóór het in werking treden van [titel 6, afdeling 1, van Boek 8][ref1]
      zijn de bepalingen van die afdeling niet van toepassing. Hetzelfde geldt voor schade die door een schip vóór het in
      werking treden van die afdeling is gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0028753#Afdeling1
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel174
    references:
      - id: ref1
        bwb_id: BWBR0028753
        afdeling: '1'
  - number: '175'
    text: |-
      Op een hulpverlening die vóór het in werking treden van [titel 6, afdeling 2, van Boek 8][ref1] is
      aangevangen, zijn de bepalingen van die afdeling niet van toepassing, met uitzondering van het bepaalde in
      [artikel 571 van dat Boek][ref2]; de in dit artikel genoemde termijn wordt alsdan bepaald met inachtneming van de
      [artikelen 8][ref3] en [49][ref4] van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0028753#Afdeling2
      [ref2]: https://wetten.overheid.nl/BWBR0028753#Artikel571
      [ref3]: https://wetten.overheid.nl/BWBR0028466#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0028466#Artikel49
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel175
