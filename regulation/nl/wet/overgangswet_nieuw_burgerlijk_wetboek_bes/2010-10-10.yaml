  - number: 37p
    text: |-
      De [artikelen 89][ref1] en [94 van Boek 2][ref2] gelden voor het eerst voor het eerste boekjaar dat aanvangt na het
      in werking treden van [Boek 2][ref3]. Tot dat tijdstip blijft voor de betrokken rechtspersoon het voordien geldende
      recht van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel89
      [ref2]: https://wetten.overheid.nl/BWBR0028744#Artikel94
      [ref3]: https://wetten.overheid.nl/BWBR0028744
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel37p
    references:
      - id: ref1
        bwb_id: BWBR0028744
        artikel: '89'
      - id: ref2
        bwb_id: BWBR0028744
        artikel: '94'
      - id: ref3
        bwb_id: BWBR0028744
  - number: 37q
    text: |-
      De in de statuten als coöperatieve vereniging aangeduide rechtspersoon heeft vanaf het in werking treden van Boek
      2 als coöperatie te gelden. Is bij een coöperatieve vereniging, die bij het in werking treden van [Boek 2][ref1] in
      staat van vereffening verkeert, aansprakelijkheid ontstaan op grond van artikel 7, aanhef en ten 3e, in verbinding
      met artikel 19 van de Verordening van de 13de februari 1920 tot regeling der coöperatieve verenigingen (P.B. 1920,
      no. 9), dan komt deze aansprakelijkheid door het in werking treden van Boek 2 niet te vervallen.


      [ref1]: https://wetten.overheid.nl/BWBR0028744
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel37q
    references:
      - id: ref1
        bwb_id: BWBR0028744
  - number: 37r
    text: |-
      Het bepaalde in [artikel 97 onder d van Boek 2][ref1] geldt voor de coöperatie die reeds bestaat bij het in werking
      treden van [Boek 2][ref2] pas nadat twee jaren na dit tijdstip zijn verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel97
      [ref2]: https://wetten.overheid.nl/BWBR0028744
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel37r
    references:
      - id: ref1
        bwb_id: BWBR0028744
        artikel: '97'
      - id: ref2
        bwb_id: BWBR0028744
  - number: 37s
    text: |-
      1 Bepalingen waarin wordt verwezen naar het begrip «maatschappelijk kapitaal» worden met ingang van het in werking
      treden van [Boek 2][ref1] in zoverre voor niet geschreven gehouden.

      2 De term «geplaatst kapitaal» in statuten van een naamloze vennootschap of besloten vennootschap wordt met ingang
      van het in werking treden van [Boek 2][ref2] gelezen als «nominaal kapitaal».Waar sprake is van niet gestort
      kapitaal worden de bepalingen van Boek 2 aangaande de bijstortingsplicht zoveel mogelijk toegepast. Het bepaalde in
      de vorige zin geldt voor de vennootschap waarvan aandelen op een effectenbeurs worden verhandeld eerst nadat twee
      jaren zijn verstreken sinds het in werking treden van Boek 2.


      [ref1]: https://wetten.overheid.nl/BWBR0028744
      [ref2]: https://wetten.overheid.nl/BWBR0028744
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel37s
    references:
      - id: ref1
        bwb_id: BWBR0028744
      - id: ref2
        bwb_id: BWBR0028744
  - number: 37t
    text: |-
      De [artikelen 116 tot en met 126][ref1] gelden voor het eerste boekjaar dat aanvangt na het in werking treden van
      [Boek 2][ref2]. Tot dat tijdstip blijft voor de betrokken rechtspersoon het voordien geldende recht van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028466#Artikel116
      [ref2]: https://wetten.overheid.nl/BWBR0028744
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel37t
    references:
      - id: ref1
        bwb_id: BWBR0028466
        artikel: '116'
      - id: ref2
        bwb_id: BWBR0028744
  - number: 37u
    text: |-
      Bij de toepassing van [artikel 138][ref1] wordt slechts in aanmerking genomen het optreden als ware hij bestuurder
      en het bijdragen tot een instructie dat plaatsvond na het in werking treden van [Boek 2][ref2], voor zover althans
      het aanmerken als bestuurder niet kon geschieden op grond van de voordien geldende regels.


      [ref1]: https://wetten.overheid.nl/BWBR0028466#Artikel138
      [ref2]: https://wetten.overheid.nl/BWBR0028744
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel37u
    references:
      - id: ref1
        bwb_id: BWBR0028466
        artikel: '138'
      - id: ref2
        bwb_id: BWBR0028744
  - number: 37v
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel37v
  - number: 37w
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel37w
  - number: 37x
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel37x
  - number: 37y
    text: |-
      Zolang de op 19 november 2002 aan de Staten aangeboden ontwerplandsverordening houdende vaststelling van een Nieuw
      wetboek van Burgerlijk Rechtsvordering (Zitting 2002-2003-2709 (E-110)) niet tot landsverordening is verheven en
      in werking is getreden, worden aandelen op naam in een naamloze vennootschap of besloten vennootschap geacht zich
      onder de vennootschap te bevinden, ongeacht of aandeelbewijzen zijn uitgegeven.
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel37y
  - number: '38'
    text: |-
      Zaken die tot aan het tijdstip van het in werking treden van de wet onroerend door bestemming waren en als zodanig
      waren begrepen in een beslag of executie, blijven, indien de wet hen als roerend aanmerkt, ook nadien daaronder
      begrepen en gelden als onroerend zolang het beslag of de executie duurt, doch slechts tot aan de levering aan de
      koper.
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel38
  - number: '39'
    text: |-
      Op roerende zaken die tot aan het tijdstip van het in werking treden van de wet onroerend door bestemming waren
      en als zodanig aan hypotheek waren onderworpen, rust van dat tijdstip af een pandrecht. Het pandrecht komt van
      dat tijdstip mede te rusten op roerende zaken die als onroerend door bestemming onder het tevoren geldende recht
      aan die hypotheek zouden zijn onderworpen. Met betrekking tot de zaken, in de eerste en de tweede volzin genoemd,
      wordt geacht het in [artikel 254, eerste lid, van Boek 3][ref1] bedoelde beding te zijn gemaakt. Het pandrecht op
      de in de eerste volzin bedoelde zaken werkt tegen de, vóór het in werking treden van de wet ontstane, rechten en
      vorderingen waartegen de hypotheek kon worden ingeroepen; met betrekking tot de rangorde geldt het als gevestigd op
      het tijdstip waarop de zaak met hypotheek werd belast.


      [ref1]: https://wetten.overheid.nl/BWBR0028745#Artikel254
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0028745
        artikel: '254'
  - number: '40'
    text: |-
      De verplichting bedoeld in [artikel 15a van Boek 3][ref1] geldt voor degene die door dat artikel wordt aangewezen,
      voor het eerst met betrekking tot het eerste boekjaar dat na het in werking treden der wet aanvangt, indien een
      zodanige verplichting niet reeds krachtens het tevoren geldende recht op hem rustte.


      [ref1]: https://wetten.overheid.nl/BWBR0028745#Artikel15a
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0028745
        artikel: 15a
  - number: '41'
    text: |-
      1 Feiten die op het tijdstip van het in werking treden van de wet kenbaar zijn uit de openbare
      registers voor registergoederen uit een in- of overschrijving voordien of uit een voordien door de
      bewaarder geplaatste aantekening, gelden voor de toepassing van de wet als feiten die overeenkomstig
      [titel 1, afdeling 2, van Boek 3][ref1] zijn ingeschreven, tenzij die feiten nadien niet meer hadden kunnen worden
      ingeschreven.

      2 De [artikelen 24, eerste lid][ref2], [25][ref3] en [26 van Boek 3][ref4] worden eerst drie jaren na het tijdstip
      van het in werking treden van de wet van toepassing met betrekking tot een voor inschrijving vatbaar feit dat vóór
      dat tijdstip is geschied.

      3 [Artikel 21 van Boek 3][ref5] heeft geen invloed op de rangorde van rechten die reeds vóór het in werking treden
      der wet bestonden.


      [ref1]: https://wetten.overheid.nl/BWBR0028745#Afdeling2
      [ref2]: https://wetten.overheid.nl/BWBR0028745#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0028745#Artikel25
      [ref4]: https://wetten.overheid.nl/BWBR0028745#Artikel26
      [ref5]: https://wetten.overheid.nl/BWBR0028745#Artikel21
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0028745
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0028745
        artikel: '24'
      - id: ref3
        bwb_id: BWBR0028745
        artikel: '25'
      - id: ref4
        bwb_id: BWBR0028745
        artikel: '26'
      - id: ref5
        bwb_id: BWBR0028745
        artikel: '21'
  - number: '42'
    text: |-
      Voor de toepassing van [artikel 52, eerste lid, onder d, van Boek 3][ref1] wordt onder een bevoegdheid
      tot inroeping van een vernietigingsgrond begrepen de bevoegdheid tot het inroepen van een soortgelijke
      vernietigingsgrond, welke iemand reeds toekwam volgens het recht dat vóór het toepasselijk worden van de wet gold.


      [ref1]: https://wetten.overheid.nl/BWBR0028745#Artikel52
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0028745
        artikel: '52'
  - number: '43'
    text: |-
      [Artikel 62, tweede lid, van Boek 3][ref1] wordt een jaar na het tijdstip van het in werking treden van de wet van
      toepassing op een volmacht die op dat tijdstip bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0028745#Artikel62
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0028745
        artikel: '62'
  - number: '44'
    text: |-
      [Artikel 81, derde lid, van Boek 3][ref1] geldt mede ten aanzien van beperkte rechten die vóór het in werking
      treden van de wet reeds door afstand of vermenging waren tenietgegaan.


      [ref1]: https://wetten.overheid.nl/BWBR0028745#Artikel81
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0028745
        artikel: '81'
  - number: '45'
    text: |-
      Is vóór het tijdstip van het in werking treden van de wet een goed ter uitvoering van een voorwaardelijke
      verbintenis geleverd, dan geldt het als onder dezelfde voorwaarde verkregen.
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel45
  - number: '46'
    text: |-
      Op de rechtsverhouding tussen degene die op het tijdstip van het in werking treden van de wet nog voor een bepaalde
      tijd rechthebbende op een goed is, en hem die na hem verkrijgt, zijn de bepalingen omtrent verplichtingen en
      bevoegdheden welke uit vruchtgebruik voortvloeien, van overeenkomstige toepassing, voor zover de aard of inhoud van
      die rechtsverhouding zich daartegen niet verzet.
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel46
  - number: '47'
    text: |-
      1 [Artikel 86, derde lid, van Boek 3][ref1] geldt gedurende een jaar na het tijdstip van het in werking treden van
      de wet niet voor zaken welke vóór dat tijdstip waren ontvreemd en door een derde verkregen.

      2 Artikel 633 van het Burgerlijk Wetboek, zoals dat tot aan het in werking treden der wet gold, blijft van
      toepassing met betrekking tot een ontvreemde of verloren zaak die vóór dat tijdstip door een koper te goeder trouw
      op een jaar- of andere markt of op een openbare veiling is verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0028745#Artikel86
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0028745
        artikel: '86'
  - number: '48'
    text: |-
      Levering van een recht als bedoeld in artikel 662, eerste lid, van het Burgerlijk Wetboek, zoals dat vóór het
      tijdstip van het in werking treden van de wet gold, en voltooid vóór dat tijdstip, werkt jegens een persoon tegen
      wie het moet worden uitgeoefend en ten aanzien van wie vóór dat tijdstip volgens artikel 662, tweede lid, de
      overdracht nog geen gevolg had, slechts nadat zij hem overeenkomstig [artikel 94 van Boek 3][ref1] is medegedeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0028745#Artikel94
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0028745
        artikel: '94'
  - number: '49'
    text: |-
      [Artikel 104 van Boek 3][ref1] is mede van toepassing ten aanzien van een niet in het tevoren geldende artikel
      1982 van het Burgerlijk Wetboek genoemd goed, indien vóór het in werking treden der wet de verjaring van de
      rechtsvordering tot beëindiging van het bezit van dat goed is gestuit.


      [ref1]: https://wetten.overheid.nl/BWBR0028745#Artikel104
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0028745
        artikel: '104'
  - number: '50'
    text: |-
      [Artikel 105 van Boek 3][ref1] wordt op het tijdstip van het in werking treden van de wet van toepassing met
      betrekking tot degene die alsdan een goed bezit, indien de verjaring van de rechtsvordering tot beëindiging van dat
      bezit is voltooid; hij wordt geacht dat goed niet voordien te hebben verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0028745#Artikel105
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0028745
        artikel: '105'
  - number: '51'
    text: |-
      Indien een rechthebbende op het tijdstip van het in werking treden van de wet van zijn beperkte recht geen gebruik
      maakte en een termijn na afloop waarvan het dientengevolge krachtens het tevoren geldende recht geheel of ten dele
      teniet kan gaan, nog niet was verstreken, wordt [artikel 106 van Boek 3][ref1] op dat tijdstip van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028745#Artikel106
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0028745
        artikel: '106'
  - number: '52'
    text: |-
      [Artikel 122 van Boek 3][ref1] vindt mede toepassing met betrekking tot de vergoedingen welke de rechthebbende
      krachtens het tevoren geldende recht is verschuldigd geworden over het tijdvak dat aan het in werking treden van de
      wet is voorafgegaan.


      [ref1]: https://wetten.overheid.nl/BWBR0028745#Artikel122
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0028745
        artikel: '122'
  - number: '53'
    text: |-
      [Artikel 177, derde lid, van Boek 3][ref1] geldt niet voor een recht van pand of hypotheek dat vóór het in werking
      treden van de wet is gevestigd.


      [ref1]: https://wetten.overheid.nl/BWBR0028745#Artikel177
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0028745
        artikel: '177'
  - number: '54'
    text: |-
      Van het tijdstip van haar in werking treden af is de wet van toepassing op de handelingen met betrekking tot de
      verdeling van een gemeenschap, voor zover die nog niet is voltooid, en uitsluitend voor het vervolg, behalve indien
      dit zou nopen tot het ongedaan maken van alsdan reeds in overeenstemming met het voordien geldende recht getroffen
      maatregelen. De wet wordt niet van toepassing ten aanzien van onderwerpen waaromtrent vóór het in werking treden
      van de wet een rechterlijke uitspraak is gevraagd.
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel54
  - number: '55'
    text: |-
      Van het tijdstip van het in werking treden der wet af is [artikel 181 van Boek 3][ref1] van toepassing op een
      onzijdig persoon die is benoemd krachtens artikel 1097 van het Burgerlijk Wetboek, zoals dat voordien gold, evenwel
      met handhaving van de voor hem geldende beloning, zolang de rechter daaromtrent niet een beslissing overeenkomstig
      artikel 181, derde lid, van Boek 3 heeft genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0028745#Artikel181
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0028745
        artikel: '181'
  - number: '56'
    text: |-
      [Artikel 194, tweede lid, van Boek 3][ref1] is niet van toepassing op een in
      [artikel 189, tweede lid, van dat Boek][ref2] bedoelde gemeenschap die op het tijdstip van het in werking treden
      van de wet reeds bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0028745#Artikel194
      [ref2]: https://wetten.overheid.nl/BWBR0028745#Artikel189
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0028745
        artikel: '194'
      - id: ref2
        bwb_id: BWBR0028745
        artikel: '189'
  - number: '57'
    text: |-
      De hoofdgerechtigde op goederen waarop ten tijde van het in werking treden van [titel 8 van Boek 3][ref1] een
      vruchtgebruik rust, en de vruchtgebruiker kunnen na het in werking treden de regelingen omtrent bevoegdheden en
      verplichtingen treffen, welke de wet bij de vestiging van een vruchtgebruik toelaat.


      [ref1]: https://wetten.overheid.nl/BWBR0028745
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0028745
  - number: '58'
    text: |-
      Artikel 784 van het Burgerlijk Wetboek, zoals dat tot het in werking treden van de wet gold, blijft van toepassing
      met betrekking tot de verbruikbare zaken, die waren begrepen onder een voordien aangevangen vruchtgebruik.
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel58
  - number: '59'
    text: |-
      [Artikel 221 van Boek 3][ref1] is van toepassing op een vruchtgebruik dat op het tijdstip van het in werking treden
      van de wet bestaat, ook indien op dat tijdstip de vruchtgebruiker reeds in ernstige mate in de nakoming van zijn
      verplichtingen is tekortgeschoten.


      [ref1]: https://wetten.overheid.nl/BWBR0028745#Artikel221
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0028745
        artikel: '221'
  - number: '60'
    text: |-
      [Artikel 238, derde lid, van Boek 3][ref1] geldt gedurende een jaar na het tijdstip van het in werking treden van
      de wet niet ten aanzien van goederen welke vóór dat tijdstip waren ontvreemd en daarna, eveneens vóór dat tijdstip,
      in pand waren gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0028745#Artikel238
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0028745
        artikel: '238'
  - number: '61'
    text: |-
      [Artikel 248, eerste en derde lid, van Boek 3][ref1] is van overeenkomstige toepassing op verzuim van een pandgever
      die niet tevens de schuldenaar is, in de nakoming van de verplichtingen die hij vóór het in werking treden van de
      wet op zich heeft genomen, voor zover niet [artikel 233 van Boek 3][ref2] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0028745#Artikel248
      [ref2]: https://wetten.overheid.nl/BWBR0028745#Artikel233
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0028745
        artikel: '248'
      - id: ref2
        bwb_id: BWBR0028745
        artikel: '233'
  - number: '62'
    text: |-
      De [artikelen 249 tot en met 252 van Boek 3][ref1] zijn niet van toepassing op de uitwinning van een pand, indien
      vóór het tijdstip van het in werking treden van de wet aan de pandgever de uitwinning van het pand reeds was
      aangezegd. [Artikel 253 van Boek 3][ref2] is van toepassing, indien eerst na dat tijdstip het pand wordt verkocht
      of aan de pandhouder verblijft.


      [ref1]: https://wetten.overheid.nl/BWBR0028745#Artikel249
      [ref2]: https://wetten.overheid.nl/BWBR0028745#Artikel253
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0028745
        artikel: '249'
      - id: ref2
        bwb_id: BWBR0028745
        artikel: '253'
  - number: '63'
    text: |-
      Artikel 1185, tweede lid, van het Burgerlijk Wetboek, zoals dat tot aan het tijdstip van het in werking treden van
      de wet gold, blijft van toepassing ten aanzien van schulden die op dat tijdstip bestaan.
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel63
  - number: '64'
    text: |-
      De houders van certificaten als bedoeld in [artikel 259 van Boek 3][ref1], welke op het tijdstip van het in werking
      treden van de wet reeds bestaan, verkrijgen op dat tijdstip een pandrecht overeenkomstig het tweede en derde
      lid van dat artikel. Zijn de certificaten uitgegeven voor schuldvorderingen op naam zonder medewerking van de
      schuldenaar, dan geldt de vorige volzin slechts, indien aan deze van de uitgifte mededeling is gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0028745#Artikel259
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0028745
        artikel: '259'
  - number: '65'
    text: |-
      Indien op het tijdstip van het in werking treden van de wet sinds de overschrijving in de openbare registers van
      een leveringsakte wegens koop of een akte van scheiding nog geen acht vrije dagen zijn verstreken, blijven de
      artikelen 1207 en 1208 van het Burgerlijk Wetboek, zoals die voordien golden, van toepassing ten opzichte van de in
      die artikelen bedoelde hypotheken.
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel65
  - number: '66'
    text: |-
      Artikel 1209 van het Burgerlijk Wetboek, zoals dat vóór het tijdstip van het in werking treden van de wet gold,
      blijft van toepassing op bedongen rente over een vordering tot zekerheid waarvan vóór dat tijdstip hypotheek was
      gevestigd.
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel66
  - number: '67'
    text: |-
      [Artikel 266 van Boek 3][ref1] is gedurende een termijn van drie jaren na het in werking treden van de wet niet van
      toepassing op een hypotheek die vóór dat tijdstip is gevestigd.


      [ref1]: https://wetten.overheid.nl/BWBR0028745#Artikel266
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0028745
        artikel: '266'
  - number: '68'
    text: |-
      1 Indien een hypotheekhouder vóór het tijdstip van het in werking treden van het nieuwe
      [Wetboek van Burgerlijke Rechtsvordering][ref1] aan een notaris opdracht heeft gegeven tot de voorbereiding van
      een openbare verkoop, blijft het vóór 1 januari 2001 geldende recht op die verkoop van toepassing; zo alsdan de
      toewijzing ingevolge verkoop na 1 januari 2001 geschiedt, zijn de [artikelen 270 tot en met 273 van Boek 3][ref2]
      echter wel van toepassing, met dien verstande dat in artikel 270, derde lid, eerste volzin, voor «bij een door hem
      aangewezen bewaarder die aan de daartoe gestelde eisen van het Wetboek van Burgerlijke Rechtsvordering voldoet»
      wordt gelezen: ter griffie van het gerecht in eerste aanleg.


      [ref1]: https://wetten.overheid.nl/BWBR0028496
      [ref2]: https://wetten.overheid.nl/BWBR0028745#Artikel270
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0028496
      - id: ref2
        bwb_id: BWBR0028745
        artikel: '270'
  - number: '69'
    text: |-
      [Artikel 283 van Boek 3][ref1] is niet van toepassing met betrekking tot een vordering tot vergoeding die op het
      tijdstip van het in werking treden van de wet bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0028745#Artikel283
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0028745
        artikel: '283'
  - number: '70'
    text: |-
      Afschaffing van voorrechten op bepaalde goederen door het in werking treden van de wet heeft geen gevolg voor een
      voorrecht dat voordien reeds krachtens artikel 1165, onder 3, van het Burgerlijk Wetboek, zoals dat tevoren gold,
      aan een vordering was verbonden. De voordien geldende artikelen 1170 en 1172a van het Burgerlijk Wetboek blijven
      van toepassing. Het recht van degene aan wie de verkochte zaak tot zekerheid is overgedragen of in pand gegeven,
      kan, zolang zij zich onder de schuldenaar bevindt, niet aan de verkoper worden tegengeworpen.
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel70
  - number: '71'
    text: De wet bepaalt van haar in werking treden af, of een retentierecht bestaat en welke gevolgen dat recht heeft.
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel71
  - number: '72'
    text: |-
      De [artikelen 316 tot en met 318 van Boek 3][ref1] zijn van toepassing, indien de handelingen die volgens die
      bepalingen stuiting teweegbrengen, zijn verricht na het tijdstip van het in werking treden der wet. Indien
      overeenkomstig het tevoren geldende recht na stuiting een verjaringstermijn is aangevangen die binnen een jaar
      na het in werking treden van de wet nog niet is voltooid, dan wordt na afloop van dat jaar, met inachtneming van
      [artikel 8, tweede lid][ref2], van deze wet, [artikel 319 van Boek 3][ref3] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028745#Artikel316
      [ref2]: https://wetten.overheid.nl/BWBR0028466#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0028745#Artikel319
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0028745
        artikel: '316'
      - id: ref2
        bwb_id: BWBR0028466
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0028745
        artikel: '319'
  - number: '73'
    text: |-
      1 In afwijking van [artikel 8][ref1] van deze wet worden aanvang en duur van een verjaringstermijn door de wet
      bepaald in de gevallen waarin de verjaring overeenkomstig [artikel 320 van Boek 3][ref2] bij of binnen een jaar na
      het in werking treden van de wet wordt verlengd.

      2 De artikelen 2005 tot en met 2011 van het Burgerlijk Wetboek, zoals die tot aan het in werking treden van de
      wet golden, blijven gedurende een jaar nadien van toepassing op de gevallen waarin zij totdien toepasselijk waren,
      tenzij er een grond tot verlenging der verjaring overeenkomstig [artikel 321 van Boek 3][ref3] bestaat. Na afloop
      van dat jaar wordt de verjaring geacht nimmer geschorst te zijn geweest.


      [ref1]: https://wetten.overheid.nl/BWBR0028466#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0028745#Artikel320
      [ref3]: https://wetten.overheid.nl/BWBR0028745#Artikel321
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0028466
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0028745
        artikel: '320'
      - id: ref3
        bwb_id: BWBR0028745
        artikel: '321'
  - number: '74'
    text: |-
      Van het tijdstip van het in werking treden der wet af vindt [artikel 323, eerste en tweede lid, van Boek 3][ref1]
      toepassing, voor zover een pand- of hypotheekrecht niet reeds eerder teniet was gegaan.


      [ref1]: https://wetten.overheid.nl/BWBR0028745#Artikel323
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0028745
        artikel: '323'
  - number: '75'
    text: |-
      Vanaf een jaar na het tijdstip van het in werking treden der wet gelden de [artikelen 324][ref1] en
      [325 van Boek ][ref2]3 mede, indien de in artikel 324 bedoelde rechterlijke of arbitrale uitspraak vóór dat
      tijdstip is gevallen.


      [ref1]: https://wetten.overheid.nl/BWBR0028745#Artikel324
      [ref2]: https://wetten.overheid.nl/BWBR0028745#Artikel325
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0028745
        artikel: '324'
      - id: ref2
        bwb_id: BWBR0028745
        artikel: '325'
  - number: '76'
    text: |-
      Artikel 1992 van het Burgerlijk Wetboek, zoals dat tevoren gold, blijft van toepassing indien na het in werking
      treden van de wet een beroep wordt gedaan op verjaring ingevolge één van de tevoren geldende artikelen 1987 tot en
      met 1990 van het Burgerlijk Wetboek.
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel76
  - number: '100'
    text: |-
      1 Van het tijdstip van het in werking treden der wet af geldt een voordien gevestigde grondrente als een beperkt
      recht, rustend op een registergoed. De artikelen 776 tot en met 782 van het Burgerlijk Wetboek, zoals die vóór
      dat tijdstip golden, blijven daarop van toepassing, voor zover die met de bepalingen omtrent registergoederen
      verenigbaar zijn.

      2 De rechter kan op vordering van de eigenaar van de zaak waarop de grondrente rust, de inhoud van dat recht
      wijzigen, indien het ongewijzigd voortbestaan in strijd is met het algemeen belang, alsook op grond van
      omstandigheden welke van dien aard zijn dat naar maatstaven van redelijkheid en billijkheid ongewijzigde
      instandhouding niet van de eigenaar kan worden gevergd. De rechter kan de vordering toewijzen onder door hem te
      stellen voorwaarden; hij houdt geen rekening met omstandigheden die zich vóór het in werking treden van de wet
      hebben voorgedaan.
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel100
  - number: '101'
    text: |-
      1 De [artikelen 5 tot en met 12 van Boek 5][ref1] gelden van het tijdstip van het in werking treden van de wet af
      met betrekking tot roerende zaken die iemand vóór dat tijdstip heeft gevonden en tot zich genomen.

      2 Een jaar na het tijdstip van het in werking treden van de wet verkrijgt de vinder die de zaak
      alsdan in zijn macht heeft, de eigendom daarvan, indien hij vóór het genoemde tijdstip de in de in
      [artikel 5, eerste lid, van Boek 5][ref2] omschreven aangifte of mededeling heeft gedaan; ten aanzien van de vinder
      geldt hetzelfde, indien de overheid de zaak na aangifte in bewaring heeft genomen.

      3 De rechtspositie van de vinder die vóór het tijdstip van het in werking treden van de wet overeenkomstig
      [artikel 7 van Boek 5][ref3] heeft gehandeld, gaat op dat tijdstip met de daaraan verbonden verplichtingen over op
      degene aan wie hij de zaak heeft afgegeven; een recht op beloning ontstaat niet.

      4 De in het tweede lid van het vóór het tijdstip van het in werking treden van de wet geldende artikel 1996 van
      het Burgerlijk Wetboek bedoelde bevoegdheid tot terugvordering van een vóór dat tijdstip verloren zaak blijft
      gehandhaafd, doch tot ten hoogste een jaar na dat tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0028748#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0028748#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0028748#Artikel7
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel101
    references:
      - id: ref1
        bwb_id: BWBR0028748
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0028748
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0028748
        artikel: '7'
  - number: '102'
    text: |-
      De verplichting genoemd in [artikel 13, derde lid, van Boek 5][ref1] geldt niet, indien de schat meer dan een jaar
      vóór het in werking treden van de wet is ontdekt.


      [ref1]: https://wetten.overheid.nl/BWBR0028748#Artikel13
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel102
    references:
      - id: ref1
        bwb_id: BWBR0028748
        artikel: '13'
  - number: '103'
    text: |-
      Op het tijdstip van het in werking treden van de wet verliest degene die totdien eigenaar van een dier was, de
      eigendom daarvan, indien de in [artikel 19 van Boek 5][ref1] genoemde feiten op dat tijdstip waren voltooid.


      [ref1]: https://wetten.overheid.nl/BWBR0028748#Artikel19
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel103
    references:
      - id: ref1
        bwb_id: BWBR0028748
        artikel: '19'
  - number: '104'
    text: |-
      Van het tijdstip van het in werking treden van de wet af is degene die tot dien eigenaar van een water was,
      eigenaar van de bodem onder dat water. Een beperkt recht op zulk een water komt alsdan op die bodem te rusten.
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel104
  - number: '105'
    text: |-
      Onroerende zaken die op grond van het tevoren geldende artikel 572 van het Burgerlijk Wetboek aan het land
      toebehoren, gaan bij het in werking treden van [artikel 24 van Boek 5][ref1] over op het eilandgebied.


      [ref1]: https://wetten.overheid.nl/BWBR0028748#Artikel24
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel105
    references:
      - id: ref1
        bwb_id: BWBR0028748
        artikel: '24'
  - number: '106'
    text: |-
      Uitbreiding van de territoriale zee na het in werking treden van de wet heeft niet tot gevolg dat de eigendom van
      haar bodem de alsdan daarmede duurzaam verenigde gebouwen en werken zal gaan omvatten.
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel106
  - number: '107'
    text: |-
      Van drie jaren na het tijdstip van het in werking treden van de wet af bepalen de [artikelen 29][ref1] en
      [34 van Boek 5][ref2] wie alsdan eigenaar is van de stroken grond langs de oeverlijn van een water, tenzij vóór
      dat tijdstip de grens bij de limitatie overeenkomst is vastgelegd of na dat tijdstip [artikel 31 van Boek 5][ref3]
      toepassing heeft gevonden, dan wel een vordering tot vastlegging als bedoeld in [artikel 32 van dat Boek][ref4] is
      ingesteld. [Artikel 30 van Boek 5][ref5] is van overeenkomstige toepassing op de vastlegging van een grens door een
      de limitatie overeenkomst die vóór het in werking treden van de wet is gesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0028748#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0028748#Artikel34
      [ref3]: https://wetten.overheid.nl/BWBR0028748#Artikel31
      [ref4]: https://wetten.overheid.nl/BWBR0028748#Artikel32
      [ref5]: https://wetten.overheid.nl/BWBR0028748#Artikel30
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0028748
        artikel: '29'
      - id: ref2
        bwb_id: BWBR0028748
        artikel: '34'
      - id: ref3
        bwb_id: BWBR0028748
        artikel: '31'
      - id: ref4
        bwb_id: BWBR0028748
        artikel: '32'
      - id: ref5
        bwb_id: BWBR0028748
        artikel: '30'
  - number: '108'
    text: |-
      De eigenaar van een erf is, tenzij een beperkt recht iets anders meebrengt, verplicht op vordering van een
      nabuur de ten tijde van het in werking treden van de wet bestaande toestand in overeenstemming te brengen met
      hetgeen waarop die nabuur nadien op grond van [titel 4 van Boek 5][ref1] aanspraak kan maken. Is die toestand
      echter in overeenstemming met het voordien geldende recht, dan kan de eigenaar van het erf verlangen dat de
      wijziging niet wordt aangebracht dan op kosten van de nabuur en tegen vooraf door deze te betalen of te verzekeren
      schadevergoeding.


      [ref1]: https://wetten.overheid.nl/BWBR0028748
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0028748
  - number: '109'
    text: |-
      Het in werking treden van de wet brengt geen wijziging in de rechten, bevoegdheden en verplichtingen met betrekking
      tot een buurweg welke voordien is ontstaan; [artikel 24, eerste lid, van Boek 3][ref1] is niet van toepassing op de
      bestemming tot zulk een buurweg.


      [ref1]: https://wetten.overheid.nl/BWBR0028745#Artikel24
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel109
    references:
      - id: ref1
        bwb_id: BWBR0028745
        artikel: '24'
  - number: '110'
    text: |-
      Bij het in werking treden van de wet bestaat mandeligheid, indien alsdan reeds is voldaan aan de vereisten
      die [artikel 60 van Boek 5][ref1] aan het ontstaan daarvan stelt. Op dat tijdstip is een scheidsmuur, een
      hek of een heg gemeenschappelijk eigendom en mandelig, indien alsdan aan de vereisten daarvoor volgens
      [artikel 62 van Boek 5][ref2] is voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0028748#Artikel60
      [ref2]: https://wetten.overheid.nl/BWBR0028748#Artikel62
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel110
    references:
      - id: ref1
        bwb_id: BWBR0028748
        artikel: '60'
      - id: ref2
        bwb_id: BWBR0028748
        artikel: '62'
  - number: '111'
    text: |-
      Indien vóór het in werking treden van de wet een erfdienstbaarheid door bestemming of herleving is ontstaan, kan
      dit ontstaan worden ingeschreven in de openbare registers, bedoeld in [titel 1, afdeling 2, van Boek 3][ref1].
      Op het ontbreken van de inschrijving en op inschrijfbare feiten die vóór het in werking treden van de
      wet zijn voorgevallen, en die betreffen rechten die niet uit de openbare registers kenbaar zijn, is
      [artikel 24, eerste lid, van Boek 3][ref2] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028745#Afdeling2
      [ref2]: https://wetten.overheid.nl/BWBR0028745#Artikel24
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel111
    references:
      - id: ref1
        bwb_id: BWBR0028745
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0028745
        artikel: '24'
  - number: '112'
    text: |-
      Een erfdienstbaarheid die op het tijdstip van het in werking treden van de wet reeds bestond, kan niet uit hoofde
      van [artikel 78 van Boek 5][ref1] worden opgeheven. In geval van een vordering tot wijziging houdt de rechter geen
      rekening met omstandigheden die zich vóór dat tijdstip hebben voorgedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0028748#Artikel78
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0028748
        artikel: '78'
  - number: '113'
    text: |-
      Indien een erf vóór het in werking treden van de wet aan twee of meer personen, hetzij als deelgenoten, hetzij als
      eigenaars van verschillende gedeelten daarvan, toebehoort, wordt [artikel 77, eerste lid, van Boek 5][ref1] op hen
      van toepassing met betrekking tot geldelijke verplichtingen die na het in werking treden van de wet ontstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0028748#Artikel77
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel113
    references:
      - id: ref1
        bwb_id: BWBR0028748
        artikel: '77'
  - number: '114'
    text: |-
      Op een erfpacht, aangevangen vóór het tijdstip van het in werking treden van de wet, blijft, onverminderd het
      bepaalde in [artikel 87, tweede en derde lid, van Boek 5][ref1], het vóór dat tijdstip geldende artikel 758 van het
      Burgerlijk Wetboek van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028748#Artikel87
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel114
    references:
      - id: ref1
        bwb_id: BWBR0028748
        artikel: '87'
  - number: '115'
    text: |-
      Een erfpachter kan een erfpacht die op het tijdstip van het in werking treden van de wet bestaat, slechts opzeggen
      voor zover hij naar het voordien geldende recht tot opzegging of eenzijdige afstand bevoegd zou zijn geweest.
      [Artikel 88 van Boek 5][ref1] is van toepassing, behalve voor zover een andere termijn voor opzegging of afstand
      was bedongen.


      [ref1]: https://wetten.overheid.nl/BWBR0028748#Artikel88
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel115
    references:
      - id: ref1
        bwb_id: BWBR0028748
        artikel: '88'
  - number: '116'
    text: |-
      Indien een erfpacht vóór het tijdstip van het in werking treden van de wet aan twee of meer personen,
      hetzij als deelgenoten, hetzij als erfpachters van verschillende gedeelten van de zaak, toebehoort, wordt
      [artikel 92, eerste lid, van Boek 5][ref1] voor het eerst van toepassing met betrekking tot de eerste canon die na
      dat tijdstip wordt verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0028748#Artikel92
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel116
    references:
      - id: ref1
        bwb_id: BWBR0028748
        artikel: '92'
  - number: '117'
    text: |-
      Een erfpacht die op het tijdstip van het in werking treden van de wet reeds bestond, kan niet uit hoofde van
      [artikel 97, eerste lid, van Boek 5][ref1] worden opgeheven. In geval van een vordering tot wijziging houdt de
      rechter geen rekening met omstandigheden die zich vóór dat tijdstip hebben voorgedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0028748#Artikel97
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel117
    references:
      - id: ref1
        bwb_id: BWBR0028748
        artikel: '97'
  - number: '118'
    text: |-
      [Artikel 99 van Boek 5][ref1] is niet van toepassing op een erfpacht die ten tijde van het in werking treden van de
      wet bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0028748#Artikel99
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel118
    references:
      - id: ref1
        bwb_id: BWBR0028748
        artikel: '99'
  - number: '119'
    text: |-
      De [artikelen 114 tot en met 117][ref1] van deze wet zijn van overeenkomstige toepassing op een recht van opstal in
      dezelfde gevallen waarin die artikelen op een recht van erfpacht van toepassing zijn en voor zover het opstalrecht
      aan de daar bedoelde regels voor erfpacht is onderworpen.


      [ref1]: https://wetten.overheid.nl/BWBR0028466#Artikel114
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel119
    references:
      - id: ref1
        bwb_id: BWBR0028466
        artikel: '114'
  - number: '120'
    text: |-
      1 Bevat het reglement als bedoeld in het tevoren geldende artikel 634g, eerste lid, van het Burgerlijk Wetboek
      niet een regeling, houdende de oprichting van een vereniging van eigenaren als bedoeld in het tweede lid, onder
      1(, van dat artikel, dan blijven de tevoren geldende bepalingen betreffende de vergadering van eigenaren en de
      administrateur van toepassing totdat de akte van splitsing van een gebouw in appartementen zodanig is gewijzigd,
      dat het reglement aan [artikel 112 van Boek 5][ref1] voldoet.

      2 Van het tijdstip van het in werking treden van de wet af geldt een door de vereniging van eigenaren voordien
      benoemde administrateur als haar bestuurder overeenkomstig [artikel 131, eerste lid, van Boek 5][ref2].

      3 Ligt op het tijdstip van het in werking treden van de wet beslag op een gebouw, en is de splitsing van dat gebouw
      in appartementen voordien, doch na de beslaglegging in de openbare registers ingeschreven, dan wordt het beslag
      volgens het tevoren geldende recht afgewikkeld.


      [ref1]: https://wetten.overheid.nl/BWBR0028748#Artikel112
      [ref2]: https://wetten.overheid.nl/BWBR0028748#Artikel131
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel120
    references:
      - id: ref1
        bwb_id: BWBR0028748
        artikel: '112'
      - id: ref2
        bwb_id: BWBR0028748
        artikel: '131'
  - number: 120a
    text: |-
      1 Voorzover de bepalingen van een akte van splitsing in appartementen op het tijdstip van inwerkingtreding van
      [artikel 113, eerste lid, eerste volzin, van Boek 5][ref1] afwijkt van deze volzin, is deze volzin gedurende drie
      jaren na dat tijdstip niet van toepassing.

      2 Op een splitsing die heeft plaatsgevonden voor het tijdstip van inwerkingtreding van
      [artikel 118a van Boek 5][ref2], is dit artikel gedurende drie jaren na dat tijdstip niet van toepassing.

      3 Op verenigingen van eigenaars die op het tijdstip van inwerkingtreding van
      [artikel 126, eerste lid, tweede volzin, van Boek 5][ref3], niet het in deze volzin bedoelde reservefonds in stand
      houden, is deze volzin gedurende drie jaren na dat tijdstip niet van toepassing.

      4 Op een splitsing die heeft plaatsgevonden voor het tijdstip van inwerkingtreding van het eerste tot en met derde
      lid van [artikel 139 van Boek 5][ref4], zoals deze leden zijn komen te luiden bij de Landsverordening regeling
      gebruik in deeltijd van onroerende zaken en aanpassing appartementsrecht, zijn deze leden gedurende drie jaren na
      dat tijdstip niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028748#Artikel113
      [ref2]: https://wetten.overheid.nl/BWBR0028748#Artikel118a
      [ref3]: https://wetten.overheid.nl/BWBR0028748#Artikel126
      [ref4]: https://wetten.overheid.nl/BWBR0028748#Artikel139
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel120a
    references:
      - id: ref1
        bwb_id: BWBR0028748
        artikel: '113'
      - id: ref2
        bwb_id: BWBR0028748
        artikel: 118a
      - id: ref3
        bwb_id: BWBR0028748
        artikel: '126'
      - id: ref4
        bwb_id: BWBR0028748
        artikel: '139'
  - number: '121'
    text: |-
      De omzetting van een natuurlijke verbintenis in een rechtens afdwingbare bij een uiterste wilsbeschikking is niet
      aan de vereisten van [artikel 5 van Boek 6][ref1] onderworpen, indien deze beschikking vóór het in werking treden
      van de wet is gemaakt, doch nadien tot uitvoering komt.


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Artikel5
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel121
    references:
      - id: ref1
        bwb_id: BWBR0028749
        artikel: '5'
  - number: '122'
    text: |-
      1 De [artikelen 10 tot en met 13 van Boek 6][ref1] blijven buiten toepassing, indien vóór het in werking treden van
      de wet een schuld, al dan niet met de kosten, ten laste van een hoofdelijk schuldenaar of een derde geheel of ten
      dele is gedelgd voor meer dan het gedeelte dat hem aangaat.

      2 De [artikelen 6 tot en met 9][ref2] en [14 van Boek 6][ref3] zijn niet van toepassing op een vóór het in werking
      treden van de wet tot stand gekomen borgtocht of bedongen gebondenheid als hoofdelijk medeschuldenaar wie de schuld
      in zijn verhouding tot de hoofdschuldenaar niet aangaat.

      3 Degene die door het tevoren geldende recht naast een ander aansprakelijk werd gesteld en aan wie deswege op
      die ander een verhaalsrecht toekwam, kan dat verhaalsrecht ook uitoefenen, indien de schuld pas na het in werking
      treden van de wet te zijnen laste wordt voldaan en de wet hem geen verhaalsrecht toekent.


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0028749#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0028749#Artikel14
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel122
    references:
      - id: ref1
        bwb_id: BWBR0028749
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0028749
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0028749
        artikel: '14'
  - number: '123'
    text: |-
      Is een prestatie die aan twee of meer schuldeisers is verschuldigd, vóór het tijdstip van het in werking treden
      van de wet nog niet geheel of ten dele betaald, dan is [artikel 15, tweede lid, van Boek 6][ref1] daarop van
      toepassing, tenzij vóór dat tijdstip betaling is gevorderd.


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Artikel15
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0028749
        artikel: '15'
  - number: '124'
    text: |-
      Het in werking treden van de wet doet de vorderingen bedoeld in de [artikelen 33][ref1], [36][ref2] en
      [42 van Boek 6][ref3] ontstaan, indien alsdan aan de in die artikelen gestelde vereisten is voldaan en het tevoren
      geldende recht niet een zodanige vordering toekende. De termijn van verjaring van die vorderingen wordt gerekend
      te zijn begonnen op het tijdstip waarop de in die artikelen bedoelde vereisten waren vervuld, doch hij wordt niet
      voltooid voordat een jaar na het in werking treden is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0028749#Artikel36
      [ref3]: https://wetten.overheid.nl/BWBR0028749#Artikel42
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel124
    references:
      - id: ref1
        bwb_id: BWBR0028749
        artikel: '33'
      - id: ref2
        bwb_id: BWBR0028749
        artikel: '36'
      - id: ref3
        bwb_id: BWBR0028749
        artikel: '42'
  - number: '125'
    text: |-
      [Artikel 41, aanhef en onderdeel b, van Boek 6][ref1] geldt niet voor verbintenissen tot aflevering van een naar
      de soort bepaalde zaak, die voortvloeien uit een rechtsbetrekking welke vóór het in werking treden van de wet is
      ontstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Artikel41
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel125
    references:
      - id: ref1
        bwb_id: BWBR0028749
        artikel: '41'
  - number: '126'
    text: |-
      [Artikel 50, eerste lid, van Boek 6][ref1] geldt niet, indien vóór het in werking treden van de wet niet meer dan
      twee achtereenvolgende kwitanties zijn afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Artikel50
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel126
    references:
      - id: ref1
        bwb_id: BWBR0028749
        artikel: '50'
  - number: '127'
    text: |-
      Op een aanbod van gerede betaling en een daarop volgende consignatie of bewaargeving, verricht vóór het in werking
      treden van de wet en met inachtneming van de toen geldende artikelen 1421 tot en met 1429 van het Burgerlijk
      Wetboek zijn de [artikelen 66 tot en met 71 van Boek 6][ref1] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Artikel66
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel127
    references:
      - id: ref1
        bwb_id: BWBR0028749
        artikel: '66'
  - number: '128'
    text: |-
      Indien een schuldenaar vóór het in werking treden van de wet in de nakoming van zijn verbintenis is
      tekortgeschoten, is op de gevolgen van de tekortkoming de wet niet van toepassing, ook niet indien de tekortkoming
      nadien wordt voortgezet.
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel128
  - number: '129'
    text: |-
      [Artikel 80 van Boek 6][ref1] is niet van toepassing, indien de in het eerste lid daarvan, onder a, b of c,
      omschreven omstandigheden zich reeds vóór het in werking treden van de wet hebben voorgedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Artikel80
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel129
    references:
      - id: ref1
        bwb_id: BWBR0028749
        artikel: '80'
  - number: '130'
    text: |-
      [Artikel 83 van Boek 6][ref1] is niet van toepassing op het verstrijken van een termijn als bedoeld onder a van
      dat artikel, die voortvloeit uit een rechtsverhouding welke vóór het tijdstip van het in werking treden van de wet
      is ontstaan, noch op het niet nakomen van een op dat tijdstip bestaande verbintenis als bedoeld in onderdeel b van
      dat artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Artikel83
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel130
    references:
      - id: ref1
        bwb_id: BWBR0028749
        artikel: '83'
  - number: '131'
    text: |-
      [Artikel 130 van Boek 6][ref1] geldt niet met betrekking tot een vordering die vóór het tijdstip van in werking
      treden van de wet op een ander was overgegaan, of waarop vóór dat tijdstip beslag was gelegd dan wel een beperkt
      recht was gevestigd.


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Artikel130
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel131
    references:
      - id: ref1
        bwb_id: BWBR0028749
        artikel: '130'
  - number: '132'
    text: |-
      Tenzij uit de tussen partijen bestaande rechtsverhouding anders voortvloeit, worden de geldvorderingen en
      geldschulden die vóór het tijdstip van het in werking treden van de wet zijn opgenomen in een rekening als bedoeld
      in [artikel 140 van Boek 6][ref1], aangemerkt als op dat tijdstip verrekend voor zover dat nog niet eerder was
      geschied, in de volgorde waarin zij voor schuldvergelijking krachtens het voordien geldende recht waren vatbaar
      geworden; van dat tijdstip af is alleen het saldo verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Artikel140
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel132
    references:
      - id: ref1
        bwb_id: BWBR0028749
        artikel: '140'
  - number: '133'
    text: |-
      De bevoegdheid tot tenuitvoerlegging van een executoriale titel ter zake van een vordering en haar nevenrechten
      komt vanaf het tijdstip van het in werking treden van de wet toe aan degene op wie de vordering vóór dat tijdstip
      is overgegaan, tenzij de vorige rechthebbende reeds maatregelen tot uitoefening van zijn bevoegdheid had genomen.
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel133
  - number: '134'
    text: |-
      Het tevoren geldende artikel 1419, aanhef en onder 2°, van het Burgerlijk Wetboek is ook na het in werking treden
      van de wet van toepassing, indien de koop voordien is gesloten. De hypotheken van de schuldeisers in wier rechten
      de koper is gesubrogeerd, blijven in stand, voor zover dit voor uitoefening van die rechten door de koper nodig is.
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel134
  - number: '135'
    text: |-
      De [artikelen 151, tweede lid][ref1], en [152 van Boek 6][ref2] zijn niet van toepassing op een subrogatie na
      het in werking treden van de wet, indien tevoren eveneens reeds subrogatie ter zake van dezelfde vordering heeft
      plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Artikel151
      [ref2]: https://wetten.overheid.nl/BWBR0028749#Artikel152
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel135
    references:
      - id: ref1
        bwb_id: BWBR0028749
        artikel: '151'
      - id: ref2
        bwb_id: BWBR0028749
        artikel: '152'
  - number: '136'
    text: |-
      Indien vóór het tijdstip van het in werking treden van de wet een rechtshandeling onder ontbindende voorwaarde
      is verricht, die naar het toen geldende recht het tenietgaan van een verbintenis door vermenging tot gevolg heeft
      gehad, doet de vervulling van de voorwaarde na dat tijdstip de verbintenis herleven.
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel136
  - number: '137'
    text: |-
      Op de aansprakelijkheid van producenten als bedoeld in [artikel 187 van Boek 6][ref1] van vóór het in werking
      treden dezer wet in het verkeer gebrachte produkten als in dat artikel bedoeld, zijn de bepalingen van
      [titel 3, afdeling 3, van Boek 6][ref2] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Artikel187
      [ref2]: https://wetten.overheid.nl/BWBR0028749#Afdeling3
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel137
    references:
      - id: ref1
        bwb_id: BWBR0028749
        artikel: '187'
      - id: ref2
        bwb_id: BWBR0028749
        afdeling: '3'
  - number: '138'
    text: |-
      1 Het bepaalde in de [artikelen 232][ref1] en [233, aanhef en onder b, van Boek 6][ref2] geldt niet voor algemene
      voorwaarden die vóór het in werking treden van die bepalingen door een der partijen op een overeenkomst van
      toepassing zijn verklaard.

      2 Het bepaalde in [artikel 233, aanhef en onder a, van Boek 6][ref3] wordt op algemene voorwaarden welke een
      partij reeds vóór het tijdstip van het in werking treden in overeenkomsten gebruikte, van toepassing nadat een
      jaar sinds dat tijdstip is verstreken. Gedurende die termijn is de bepaling evenmin van toepassing op wijzigingen
      in die voorwaarden na dat tijdstip.Vernietiging van een beding in een overeenkomst op grond van het bepaalde in
      artikel 233, aanhef en onder a, van Boek 6 heeft geen werking over het tijdvak voordat de bepaling van toepassing
      is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Artikel232
      [ref2]: https://wetten.overheid.nl/BWBR0028749#Artikel233
      [ref3]: https://wetten.overheid.nl/BWBR0028749#Artikel233
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel138
    references:
      - id: ref1
        bwb_id: BWBR0028749
        artikel: '232'
      - id: ref2
        bwb_id: BWBR0028749
        artikel: '233'
      - id: ref3
        bwb_id: BWBR0028749
        artikel: '233'
  - number: '139'
    text: |-
      [Artikel 41, eerste lid][ref1], van deze wet geldt niet voor een beding als bedoeld in
      [artikel 252 van Boek 6][ref2] dat op het tijdstip van het in werking treden van de wet uit de openbare
      registers kenbaar is; de rechtsgevolgen die artikel 252 van Boek 6 en [titel 1, afdeling 2, van Boek 3][ref3] aan
      inschrijving in de openbare registers verbinden, komen slechts toe aan inschrijving na dit tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0028466#Artikel41
      [ref2]: https://wetten.overheid.nl/BWBR0028749#Artikel252
      [ref3]: https://wetten.overheid.nl/BWBR0028745#Afdeling2
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel139
    references:
      - id: ref1
        bwb_id: BWBR0028466
        artikel: '41'
      - id: ref2
        bwb_id: BWBR0028749
        artikel: '252'
      - id: ref3
        bwb_id: BWBR0028745
        afdeling: '2'
  - number: '140'
    text: |-
      De [artikelen 253, tweede lid][ref1], en [254 tot en met 256 van Boek 6][ref2] gelden niet voor een beding ten
      behoeve van een derde, dat op het tijdstip van het in werking treden van de wet reeds bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Artikel253
      [ref2]: https://wetten.overheid.nl/BWBR0028749#Artikel254
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel140
    references:
      - id: ref1
        bwb_id: BWBR0028749
        artikel: '253'
      - id: ref2
        bwb_id: BWBR0028749
        artikel: '254'
  - number: '141'
    text: |-
      Van het tijdstip van het in werking treden van de wet af is [artikel 257 van Boek 6][ref1] van toepassing op een
      ondergeschikte wiens gedraging vóór dat tijdstip tot aansprakelijkheid heeft geleid.


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Artikel257
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel141
    references:
      - id: ref1
        bwb_id: BWBR0028749
        artikel: '257'
  - number: '142'
    text: |-
      In geval van een vordering tot wijziging of ontbinding van een overeenkomst als bedoeld in
      [artikel 258 van Boek 6][ref1] houdt de rechter bij de toepassing van dat artikel geen rekening met een wijziging
      in de omstandigheden die zich vóór het in werking treden van de wet heeft voorgedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Artikel258
    url: https://wetten.overheid.nl/BWBR0028466/2010-10-10#Artikel142
    references:
      - id: ref1
        bwb_id: BWBR0028749
        artikel: '258'
  - number: '143'
    text: |-
      1 Op overeenkomsten van koop en ruil die vóór het tijdstip van het in werking treden van de wet zijn gesloten,
      wordt [titel 1 van Boek 7][ref1] een jaar na dat tijdstip van toepassing.

      2 In afwijking van het eerste lid worden de bepalingen van [titel 1 van Boek 7][ref2] omtrent consumentenkoop niet
      van toepassing op een consumentenkoop die vóór dat tijdstip is gesloten.

      3 In afwijking van het eerste en tweede lid is [titel 1 van Boek 7][ref3] van toepassing op de gevolgen van
      niet nakoming in het geval dat een der partijen na het in werking treden van de wet in de nakoming van een van
      haar verbintenissen tekortschiet, tenzij dat tekortschieten een voortzetting van een eerdere tekortkoming is. De
      [artikelen 24, tweede lid][ref4], en [25, zesde lid, van Boek 7][ref5] blijven evenwel buiten toepassing indien
      schade is veroorzaakt door een zaak die vóór het in werking treden van titel 3, afdeling 3, van Boek 6 in het
      verkeer is gebracht.

      4 [Titel 1, afdeling 8, van Boek 7][ref6] is in afwijking van de voorgaande leden van toepassing op het recht van
      reclame dat na het in werking treden van de wet wordt uitgeoefend; is het voordien uitgeoefend, dan blijft daarop
      het tevoren geldende recht van toepassing.

      5 [Artikel 7 van Boek 7][ref7] is slechts van toepassing op de gevolgen van de toezending van een zaak die na het
      in werking treden van de wet geschiedt.


      [ref1]: https://wetten.overheid.nl/BWBR0028751
      [ref2]: https://wetten.overheid.nl/BWBR0028751
      [ref3]: https://wetten.overheid.nl/BWBR0028751
