  - number: '2'
    text: |-
      1 De in [artikel 79 van de Werkloosheidswet][ref1] bedoelde reserves voor de wachtgeldfondsen worden alle
      onderscheiden in een reserve voor de werkloosheidslasten en een reserve voor de ziekengeldlasten.

      2 De reserve voor de ziekengeldlasten heeft aan het einde van elk jaar een omvang van 10% van het gemiddelde van
      die lasten in dat jaar en de twee daaraan voorafgaande jaren.

      3 Het Uitvoeringsinstituut werknemersverzekeringen wijst, met inachtneming van het vierde lid, de wachtgeldfondsen
      aan waarvoor een reserve voor de werkloosheidslasten wordt gevormd en instandgehouden.

      4 Een reserve voor de werkloosheidslasten wordt niet gevormd of instandgehouden indien in het tweede jaar,
      voorafgaande aan het jaar waarin de reserve zou worden gevormd of instandgehouden, of in de 14 aan dat tweede
      jaar voorafgaande jaren, het lastenpercentage van de werkloosheidslasten niet ten minste éénmaal een wijziging van
      minimaal de drempelwaarde heeft gekend.

      5 De reserve voor de werkloosheidslasten heeft aan het einde van elk jaar een omvang van ten hoogste 2,5 maal
      de verzekerde loonsom in dat jaar maal het verschil tussen de grootste wijziging van het lastenpercentage van de
      werkloosheidslasten, bedoeld in het vierde lid, en de voor het jaar van die wijziging geldende drempelwaarde.

      6 De drempelwaarde bedraagt voor de jaren tot 1996 0,2 procentpunt en voor de jaren daarna 0,4 procentpunt.

      7 Voor de toepassing van het vierde lid wordt de wijziging van het lastenpercentage van de werkloosheidslasten in
      1996 op nihil gesteld.

      8 Bij de toepassing van het vierde lid worden de lastenpercentages die betrekking hebben op het jaar 1998
      herberekend met een correctiefactor, die door het Uitvoeringsinstituut werknemersverzekeringen per sector is
      vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel79
