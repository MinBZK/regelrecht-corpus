  text: |-
    Gelet op artikel 51, achtste lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0013822/2002-07-05#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:



            a
             jaar:

              kalenderjaar;



            b
             de verzekerde loonsom:

              het totaalbedrag van het loon, bedoeld in [artikel 84 van de Werkloosheidswet][ref1], waarover
      het Uitvoeringsinstituut werknemersverzekeringen in een jaar ten gunste van een wachtgeldfonds
      de aldaar bedoelde premies ontvangt, met uitzondering van de uitkeringen en het loon waarop
      [artikel 85, derde lid, van de Werkloosheidswet][ref2] van toepassing is;



            c
            de ziekengeldlasten:

              de uitkeringen die op grond van [artikel 90, eerste lid, onderdeel c, van de Werkloosheidswet][ref3] ten
      laste van een wachtgeldfonds komen alsmede de uitvoeringskosten met betrekking tot die uitkeringen en de op grond
      van enige wet over die uitkeringen door het Uitvoeringsinstituut werknemersverzekeringen verschuldigde premies die
      niet op die uitkeringen in mindering kunnen worden gebracht;



            d
             de werkloosheidslasten:

              hetgeen op grond van [artikel 90, eerste lid, van de Werkloosheidswet][ref4] ten laste
      van het wachtgeldfonds komt, met uitzondering van de ziekengeldlasten en hetgeen op grond van
      [artikel 90, vierde lid, van de Werkloosheidswet][ref5] ten laste van het Algemeen Werkloosheidsfonds wordt
      gebracht;



            e
             het lastenpercentage van de werkloosheidslasten:

              het percentage van de verzekerde loonsom in een jaar waarin de werkloosheidslasten van dat jaar tot
      uitdrukking komen;



            f
            de wijziging van het lastenpercentage van de werkloosheidslasten in een jaar:

              het verschil tussen het lastenpercentage van de werkloosheidslasten in een jaar en dat lastenpercentage in
      het daaraan voorafgaande jaar.


