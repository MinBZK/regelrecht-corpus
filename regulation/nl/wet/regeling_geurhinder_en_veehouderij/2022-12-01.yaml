preamble:
  text: |-
    Handelende in overeenstemming met de Minister van Landbouw, Natuur en Voedselkwaliteit;

    Gelet op de artikelen 1, 4, tweede lid, en 10 van de Wet geurhinder en veehouderij;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0020711/2022-12-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      bijlage: bij deze regeling behorende bijlage;

      wet: [Wet geurhinder en veehouderij][ref1];

      emissiepunt: 'punt waar een relevante hoeveelheid geur buiten:'

      a. het geheel overdekt dierenverblijf treedt, dan wel wordt gebracht; of

      b. het overdekte gedeelte van het gedeeltelijk overdekt dierenverblijf treedt, dan wel wordt gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0020396
    url: https://wetten.overheid.nl/BWBR0020711/2022-12-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0020396
  - number: '2'
    text: |-
      1 De geurbelasting vanwege een veehouderij wordt berekend met inachtneming van het verspreidingsmodel V-Stacks
      vergunning 2020.

      2 Het geometrisch gemiddelde van de emissiepunten wordt aangemerkt als punt waar de geur uit het dierenverblijf
      treedt of wordt gebracht.

      3 De geurbelasting wordt bepaald op de dichtstbijzijnde buitenzijde van een geurgevoelig object, gerekend vanaf het
      geometrisch gemiddelde van de emissiepunten.

      4 Indien het dierenverblijf niet is overdekt, wordt de geurbelasting bepaald op de dichtstbijzijnde buitenzijde
      van een geurgevoelig object, gerekend vanaf het punt van de begrenzing dat het dichtst is gelegen bij het
      desbetreffende geurgevoelig object.

      5 De geuremissie vanuit een veehouderij is de som van de voor de verschillende diercategorieën, gehouden in de
      onderscheiden dierenverblijven, berekende aantallen odour units per seconde per dier.

      6 Het aantal odour units per seconde per dier van een diercategorie, is het aantal dieren van een diercategorie
      vermenigvuldigd met de voor de betreffende diercategorie in [bijlage 1][ref1] opgenomen geuremissiefactor.

      7 Indien voor een diercategorie geen geuremissiefactor is vastgesteld, wordt de diercategorie in de berekening van
      de geurbelasting buiten beschouwing gelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0020711
    url: https://wetten.overheid.nl/BWBR0020711/2022-12-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0020711
  - number: 2a
    text: |-
      Voor een veehouderij waarvoor geen omgevingsvergunning is vereist, wordt de geurbelasting die de veehouderij
      veroorzaakt vanwege dierenverblijven waarin een huisvestingssysteem dat begint met een van de navolgende BWL-codes
      wordt toegepast, tot 1 juli 2019 berekend met de geuremissiefactor voor de betreffende diercategorie zoals die
      luidde onmiddellijk vóór de datum van inwerkingtreding van de Regeling van de Staatssecretaris van Infrastructuur
      en Waterstaat van 17 juli 2018 tot wijziging van de Regeling ammoniak en veehouderij en de Regeling geurhinder en
      veehouderij (wijzigingen rendement geur voor bepaalde luchtwassystemen en periodieke actualisatie emissiefactoren
      voor ammoniak en geur) (Stcrt. 2018, 39679), indien vóór 1 mei 2018 reeds een aanvang is gemaakt met het oprichten
      of veranderen van de veehouderij:

      a. BWL 2006.14

      b. BWL 2006.15

      c. BWL 2007.01

      d. BWL 2007.02

      e. BWL 2009.12

      f. BWL 2010.02

      g. BWL 2011.07

      h. BWL 2011.08

      i. BWL 2012.07.
    url: https://wetten.overheid.nl/BWBR0020711/2022-12-01#Artikel2a
  - number: 2b
    text: |-
      Voor een veehouderij waarvoor geen omgevingsvergunning is vereist, wordt de geurbelasting vanwege de veehouderij
      tot 1 juni 2022 berekend met inachtneming van het verspreidingsmodel V-Stacks vergunning 2010, indien:

      a. voor 11 maart 2021 reeds een aanvang is gemaakt met het oprichten of veranderen van de veehouderij; en

      b. toepassing van verspreidingsmodel V-Stacks vergunning 2020 ertoe leidt dat na oprichting of verandering niet
      wordt voldaan aan de geldende geurnorm.
    url: https://wetten.overheid.nl/BWBR0020711/2022-12-01#Artikel2b
  - number: '3'
    text: |-
      De afstand, bedoeld in [artikel 4, tweede lid, van de wet][ref1] is opgenomen in [bijlage 2][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020396#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020711
    url: https://wetten.overheid.nl/BWBR0020711/2022-12-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0020396
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0020711
  - number: '4'
    text: |-
      1 De afstand, bedoeld in de [artikelen 3, tweede en derde lid][ref1], en [4, eerste lid, van de wet][ref2] wordt
      gemeten vanaf de buitenzijde van het geurgevoelig object tot het dichtstbijzijnde emissiepunt.

      2 Indien het dierenverblijf niet is overdekt, wordt de afstand gemeten vanaf de buitenzijde van een geurgevoelig
      object tot het punt van de begrenzing van het dierenverblijf dat het dichtst is gelegen bij het desbetreffende
      geurgevoelig object.


      [ref1]: https://wetten.overheid.nl/BWBR0020396#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020396#Artikel4
    url: https://wetten.overheid.nl/BWBR0020711/2022-12-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0020396
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020396
        artikel: '4'
  - number: '5'
    text: |-
      Deze regeling treedt in werking op het tijdstip waarop de [wet][ref1] in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0020396
    url: https://wetten.overheid.nl/BWBR0020711/2022-12-01#Artikel5
