preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging hebben genomen dat het wenselijk is gemeenten, provincies en regionale openbare lichamen te
    compenseren voor de lasten van de heffing van omzetbelasting om daarmee de afweging tussen het zelf uitvoeren van
    activiteiten en het uitbesteden daarvan te verbeteren;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0013817/2003-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze wet en de daarop gebaseerde bepalingen wordt verstaan onder:

      a. Onze Minister: Onze Minister van Financiën;

      b. Zesde BTW-richtlijn: [Richtlijn nr. 77/388/EEG](31977L0388) van de Raad van Europese Gemeenschappen van 17 mei
      1977, betreffende de harmonisatie van de wetgevingen van de Lid-Staten inzake omzetbelasting – Gemeenschappelijk
      stelsel van belasting over de toegevoegde waarde: uniforme grondslag (PbEG L 145);

      c. publiekrechtelijk lichaam: een provincie, dan wel een gemeente;

      d. regionaal openbaar lichaam: een regionaal openbaar lichaam als bedoeld in
      [artikel 1, onder d, van de Kaderwet bestuur in verandering][ref1];

      e. omzetbelasting: de belasting die wordt geheven in de lidstaten van de Europese Unie krachtens de nationale
      wetgeving die is gebaseerd op de Zesde BTW-richtlijn, alsmede de belasting die het karakter van een omzetbelasting
      heeft en krachtens de nationale wetgeving wordt geheven in de EVA-staten genoemd in artikel 2, onderdeel b, van de
      Overeenkomst betreffende de Europese Economische Ruimte;

      f. bijdrage: bijdrage aan een publiekrechtelijk lichaam of regionaal openbaar lichaam ter financiering van uitgaven
      inzake omzetbelasting onder bij deze wet te stellen voorwaarden;

      g. tijdvak: kalenderkwartaal waarin het recht op bijdrage of de verschuldigdheid ervan ontstaat;

      h. fonds: het BTW-compensatiefonds;

      i. uitkeringsjaar: het kalenderjaar waarover het recht op uitkering ontstaat;

      j. de inspecteur: de inspecteur van de rijksbelastingdienst die bevoegd is voor de heffing van de omzetbelasting
      ten aanzien van een publiekrechtelijk lichaam of regionaal openbaar lichaam waarop deze wet van toepassing is.

      2 Voorzover niet anders is bepaald, hebben de begrippen die in deze wet en de daarop berustende bepalingen worden
      gebruikt en die zijn ontleend aan de [Wet op de omzetbelasting 1968][ref2], dezelfde betekenis als de begrippen in
      die wet en de daarop berustende bepalingen.


      [ref1]: https://wetten.overheid.nl/BWBR0006620#Artikel1
