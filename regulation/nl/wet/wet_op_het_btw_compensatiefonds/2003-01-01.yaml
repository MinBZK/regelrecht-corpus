  - number: '13'
    text: |-
      1 Geen recht op bijdrage bestaat voor omzetbelasting die in rekening is gebracht op een tijdstip dat is gelegen op
      of na het tijdstip van inwerkingtreding van deze wet, in gevallen waarin de omzetbelasting:

      a. betrekking heeft op leveringen of diensten, voorzover die worden verricht op een tijdstip dat is gelegen voor
      het tijdstip van inwerkingtreding van deze wet;

      b. op grond van de wettelijke bepalingen inzake de omzetbelasting in rekening had moeten worden gebracht op een
      tijdstip dat is gelegen voor het tijdstip van inwerkingtreding van deze wet;

      c. betrekking heeft op de levering van een gebouw of een gedeelte van een gebouw en het erbij behorende terrein dan
      wel van een bouwterrein, alsmede van rechten waaraan deze zijn onderworpen, welk gebouw of gedeelte van een gebouw
      dan wel bouwterrein voor het eerst geheel dan wel gedeeltelijk in gebruik is genomen uiterlijk twee jaren voor het
      tijdstip van inwerkingtreding van deze wet.

      2 Bij diensten waarvoor periodiek een vergoeding in rekening wordt gebracht wordt het recht op bijdrage beperkt in
      de gevallen waarin en voorzover de vergoeding die in rekening wordt gebracht na het tijdstip van inwerkingtreding
      van deze wet meer dan tien percent hoger is dan de vergoeding die gemiddeld in rekening is gebracht in de periode
      van twee jaren voorafgaande aan het tijdstip van inwerkingtreding van deze wet. Het percentage van tien wordt
      vermeerderd met tien voor elk heel jaar dat sinds het tijdstip van inwerkingtreding van deze wet is verstreken.

      3 De beperking in het recht op bijdrage, bedoeld in het voorgaande lid, vervalt voor diensten met betrekking
      tot roerende zaken vijf jaren en voor diensten met betrekking tot onroerende zaken tien jaren na het tijdstip
      van inwerkingtreding van deze wet. Een overeenkomstige vervaltermijn geldt voor rechten waaraan roerende dan wel
      onroerende zaken zijn onderworpen. Voor overige diensten geldt een vervaltermijn van vijf jaren na het tijdstip van
      inwerkingtreding van deze wet.
    url: https://wetten.overheid.nl/BWBR0013817/2003-01-01#Artikel13
  - number: '14'
    text: |-
      Deze wet treedt in werking met ingang van 1 januari 2003, met uitzondering voor de regionale openbare lichamen,
      waarvoor deze wet op een bij koninklijk besluit te bepalen tijdstip in werking zal treden.
    url: https://wetten.overheid.nl/BWBR0013817/2003-01-01#Artikel14
  - number: '15'
    text: 'Deze wet wordt aangehaald als: Wet op het BTW-compensatiefonds.'
    url: https://wetten.overheid.nl/BWBR0013817/2003-01-01#Artikel15
