  - number: '2'
    text: |-
      1 Er is een BTW-compensatiefonds.

      2 Het fonds is een begrotingsfonds als bedoeld in [artikel 2 van de Comptabiliteitswet][ref1].

      3 Onze Minister voert het beheer over de begroting van het fonds.

      4 Het fonds wordt gevoed door voor ieder uitkeringsjaar bij wet een bedrag aan middelen van het Rijk ten behoeve
      van het fonds af te zonderen.

      Onze Minister kan nadere regels stellen ter bepaling van de wijze van voeding van het fonds.

      5 Ten gunste van de begroting van het fonds van enig jaar wordt het gerealiseerde batig saldo van het fonds van het
      voorafgaande jaar gebracht.

      6 De uitgaven van het fonds worden gevormd door:

      a. bijdragen;

      b. de uitgaven ten behoeve van het beheer van het fonds.

      Onze Minister kan nadere regels stellen ter bepaling van de wijze van uitkering van het fonds en het verstrekken
      van voorschotten.

      7 Ten laste van de begroting van het fonds van enig jaar wordt het gerealiseerde nadelig saldo van het fonds van
      het voorafgaande jaar gebracht.

      8 In afwijking van de [artikelen 4, tweede lid][ref2], en
      [65, tweede lid, aanhef en onder a, van de Comptabiliteitswet][ref3] hebben de begroting en de financiële
      verantwoording betrekking op de uitgaven en ontvangsten van het fonds.

      9 De inspecteur verstrekt de gegevens die nodig zijn ten behoeve van het beheer van het fonds.

      10 Onze Minister kan nadere regels stellen met betrekking tot de minimale hoogte van de bijdragen uit het fonds.

      Onze Minister kan daarbij nadere regels stellen met betrekking tot de toepassing van een vereveningsfactor in
      verband met de budgettaire verwerking daarvan voorzover de bijdragen uit het fonds op grond van dit lid meer
      bedragen dan de bijdragen waarop recht bestaat op grond van de overige bepalingen van deze wet.

      Onze Minister kan voorts nadere regels stellen met betrekking tot een verevening van de in de vorige volzin
      bedoelde uitgekeerde hogere bijdragen in een kalenderjaar met bijdragen over daarop volgende kalenderjaren
      voorzover laatstbedoelde bijdragen de minimale hoogte van de bijdragen uit het fonds in die jaren overtreffen.

      11 Onze Minister kan nadere regels stellen met betrekking tot de toepassing van een vereveningsfactor in
      verband met de budgettaire verwerking van bijdragen die niet samenhangen met betalingen op grond van de
      [Wet op de omzetbelasting 1968][ref4].

      12 Een krachtens dit artikel vastgestelde ministeriële regeling treedt niet eerder in werking dan acht weken na de
      datum van de plaatsing in de Staatscourant. Van de plaatsing wordt onverwijld mededeling gedaan aan de beide kamers
      der Staten-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0003075#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003075#Artikel4
