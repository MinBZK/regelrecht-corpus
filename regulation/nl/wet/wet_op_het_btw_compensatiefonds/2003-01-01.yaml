  - number: '3'
    text: |-
      Het publiekrechtelijk lichaam of regionaal openbaar lichaam heeft recht op een bijdrage uit het fonds ter
      financiering van:

      a. de omzetbelasting die door een ondernemer aan het publiekrechtelijk lichaam of regionaal openbaar lichaam in
      rekening is gebracht, dan wel van het publiekrechtelijk lichaam of regionaal openbaar lichaam wordt geheven, ter
      zake van aan hem verrichte leveringen en verleende diensten;

      b. de omzetbelasting die van het publiekrechtelijk lichaam of regionaal openbaar lichaam wordt geheven ingevolge
      een door hem verrichte intracommunautaire verwerving;

      c. de omzetbelasting die wordt geheven ter zake van de invoer van voor het publiekrechtelijk lichaam of regionaal
      openbaar lichaam bestemde goederen;

      voorzover die belasting betrekking heeft op goederen en diensten die het publiekrechtelijk lichaam of regionaal
      openbaar lichaam bezigt anders dan in het kader van zijn onderneming.
    url: https://wetten.overheid.nl/BWBR0013817/2003-01-01#Artikel3
  - number: '4'
    text: |-
      1 Het recht op een bijdrage wordt uitgesloten voor de omzetbelasting op de in artikel 3 bedoelde goederen en
      diensten welke gebezigd worden:

      a. om verstrekt, verleend of ter beschikking gesteld te worden aan een of meer individuele derden;

      b. voor het aan het personeel van het publiekrechtelijk lichaam of het regionaal openbaar lichaam verlenen van
      huisvesting, uitkering van loon in natura, geven van gelegenheid tot sport, ontspanning of privé-vervoer, dan wel
      voor andere persoonlijke doeleinden van het personeel of

      c. voor het verrichten van prestaties, al dan niet tegen vergoeding, die, indien zij door een ondernemer worden
      verricht, zijn vrijgesteld ingevolge [artikel 11 van de Wet op de omzetbelasting 1968](onbekend).

      2 Het in het eerste lid bepaalde geldt niet voor bij algemene maatregel van bestuur aangewezen gevallen.
    url: https://wetten.overheid.nl/BWBR0013817/2003-01-01#Artikel4
  - number: '5'
    text: |-
      Het recht op bijdrage ontstaat op het tijdstip waarop de omzetbelasting aan het publiekrechtelijk lichaam
      of regionaal openbaar lichaam in rekening wordt gebracht op een conform de wettelijke bepalingen inzake de
      omzetbelasting voorgeschreven wijze opgemaakte factuur, dan wel op het tijdstip waarop de omzetbelasting wordt
      verschuldigd.
    url: https://wetten.overheid.nl/BWBR0013817/2003-01-01#Artikel5
  - number: '6'
    text: |-
      1 De bijdrage wordt naar evenredigheid verschuldigd op het tijdstip waarop en voorzover redelijkerwijs moet worden
      aangenomen dat het bedrag waarop de bijdrage betrekking heeft, niet of niet geheel zal worden betaald dan wel is
      terugontvangen.

      2 De bijdrage wordt in ieder geval verschuldigd twee jaren na de opeisbaarheid van de vergoeding, voorzover deze op
      dat tijdstip nog niet is betaald.
    url: https://wetten.overheid.nl/BWBR0013817/2003-01-01#Artikel6
  - number: '7'
    text: |-
      1 De bijdrage wordt bepaald overeenkomstig de bestemming van de goederen en diensten op het tijdstip waarop de
      omzetbelasting aan het publiekrechtelijk lichaam of regionaal openbaar lichaam in rekening wordt gebracht, dan wel
      op het tijdstip waarop de omzetbelasting wordt verschuldigd.

      2 Indien op het tijdstip waarop het publiekrechtelijk lichaam of regionaal openbaar lichaam de goederen en diensten
      gaat bezigen, blijkt, dat de omzetbelasting ter financiering waarvan de bijdrage strekt voor een groter of kleiner
      gedeelte tot bijdrage heeft geleid dan waartoe het publiekrechtelijk lichaam of regionaal openbaar lichaam op
      grond van het gebruik van de goederen en diensten is gerechtigd, wordt de te veel ontvangen bijdrage op dat
      tijdstip verschuldigd, dan wel ontstaat op dat tijdstip een recht op bijdrage ter hoogte van de te weinig ontvangen
      bijdrage.
    url: https://wetten.overheid.nl/BWBR0013817/2003-01-01#Artikel7
  - number: '8'
    text: |-
      Onze Minister kan nadere regels stellen omtrent de bijdrage ingeval de goederen en diensten zowel worden bestemd
      of gebezigd in het kader van de onderneming van het publiekrechtelijk lichaam of regionaal openbaar lichaam als in
      het kader van andere doeleinden van het publiekrechtelijk lichaam of regionaal openbaar lichaam. Onze Minister kan
      voorts nadere regels stellen omtrent de bijdrage ingeval de goederen en diensten worden bestemd of gebezigd mede
      ten behoeve van prestaties als bedoeld in [artikel 4][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013817#Artikel4
    url: https://wetten.overheid.nl/BWBR0013817/2003-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0013817
        artikel: '4'
  - number: '9'
    text: |-
      1 De inspecteur als bedoeld in [artikel 1, onderdeel j][ref1], is mede bevoegd voor de toepassing van deze wet ten
      aanzien van het publiekrechtelijk lichaam of regionaal openbaar lichaam.

      2 Voor het einde van de maand volgend op het tijdvak waarin het recht op bijdrage is ontstaan, dan wel een eerder
      verstrekte of nog te verstrekken bijdrage geheel of gedeeltelijk verschuldigd is geworden, wordt daarvan opgave
      gedaan. De inspecteur kan bij beschikking afwijken van de opgave.

      3 Na afloop van het kalenderjaar stelt de inspecteur de bijdrage over dat jaar op grond van de bepalingen
      van deze wet bij beschikking vast. Het verschil tussen de bij de in de vorige volzin bedoelde beschikking
      vastgestelde bijdrage en de over het kalenderjaar verstrekte voorschotten wordt zes maanden na het kalenderjaar
      uitbetaald, teruggevorderd dan wel verrekend met omzetbelasting die verschuldigd is op grond van de
      [Wet op de omzetbelasting 1968][ref2], met inachtneming van het bepaalde in [artikel 2, tiende lid][ref3], over de
      minimale hoogte van de bijdrage.

      4 Indien uiterlijk vijf jaren na het einde van het kalenderjaar blijkt dat bijdrage over dat jaar is verstrekt
      tot een hoger of lager bedrag dan waarop het publiekrechtelijk lichaam of regionaal openbaar lichaam op grond van
      deze wet recht heeft, stelt de inspecteur de hoogte van de bijdrage over het desbetreffende kalenderjaar vast bij
      beschikking en wordt het verschil met de over dat kalenderjaar verstrekte bijdrage uitbetaald, teruggevorderd dan
      wel verrekend met omzetbelasting en de daarover berekende heffingsrente. Voor de toepassing van dit lid wordt rente
      berekend op grond van het vijfde lid beschouwd als bijdrage.

      5 In de gevallen bedoeld in het vierde lid wordt rente berekend.
      [Hoofdstuk VA van de Algemene wet inzake rijksbelastingen][ref4] is van overeenkomstige toepassing als ware de
      bijdrage omzetbelasting, met dien verstande dat rente wordt berekend met ingang van de eerste dag van de zevende
      kalendermaand volgend op het kalenderjaar waarop het recht op bijdrage betrekking heeft.

      6 Hetgeen voor de omzetbelasting onherroepelijk komt vast te staan, geldt mede ten aanzien van de toepassing van
      deze wet.

      7 In afwijking in zoverre van de [hoofdstukken 6][ref5],[ 7][ref6] en [8 van de Algemene wet bestuursrecht][ref7]
      is, met betrekking tot het bezwaar tegen een op de voet van het tweede, het derde lid of het vierde lid
      genomen beschikking, met betrekking tot beroep ter zake van een uitspraak op het desbetreffende bezwaar,
      alsmede met betrekking tot beroep in cassatie ter zake van de desbetreffende rechterlijke uitspraak,
      [hoofdstuk V van de Algemene wet inzake rijksbelastingen][ref8] van overeenkomstige toepassing.

      8 De [artikelen 47][ref9], [48 tot en met 56][ref10] en [67 van de Algemene wet inzake rijksbelastingen][ref11] en
      [de artikelen 34][ref12] en [34a van de Wet op de omzetbelasting 1968][ref13] zijn van overeenkomstige toepassing.

      9 Onze Minister kan nadere regels stellen ter uitvoering van hetgeen in dit artikel is bepaald.


