---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_op_het_btw_compensatiefonds
regulatory_layer: WET
publication_date: '2022-12-27'
valid_from: '2005-01-01'
bwb_id: BWBR0013817
url: https://wetten.overheid.nl/BWBR0013817/2005-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging hebben genomen dat het wenselijk is gemeenten, provincies en regionale openbare lichamen te
    compenseren voor de lasten van de heffing van omzetbelasting om daarmee de afweging tussen het zelf uitvoeren van
    activiteiten en het uitbesteden daarvan te verbeteren;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0013817/2005-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In deze wet en de daarop gebaseerde bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0013817/2005-01-01#Artikel1
  - number: 1.1.a
    text: 'Onze Minister: Onze Minister van Financiën;'
    url: https://wetten.overheid.nl/BWBR0013817/2005-01-01#Artikel1
  - number: 1.1.b
    text: |-
      Zesde BTW-richtlijn: [Richtlijn nr. 77/388/EEG](31977L0388) van de Raad van Europese Gemeenschappen van 17 mei
      1977, betreffende de harmonisatie van de wetgevingen van de Lid-Staten inzake omzetbelasting – Gemeenschappelijk
      stelsel van belasting over de toegevoegde waarde: uniforme grondslag (PbEG L 145);
    url: https://wetten.overheid.nl/BWBR0013817/2005-01-01#Artikel1
  - number: 1.1.c
    text: 'publiekrechtelijk lichaam: een provincie, dan wel een gemeente;'
    url: https://wetten.overheid.nl/BWBR0013817/2005-01-01#Artikel1
  - number: 1.1.d
    text: |-
      regionaal openbaar lichaam: een regionaal openbaar lichaam als bedoeld in
      [artikel 1, onder d, van de Kaderwet bestuur in verandering][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006620#Artikel1
    url: https://wetten.overheid.nl/BWBR0013817/2005-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006620
        artikel: '1'
  - number: 1.1.e
    text: |-
      omzetbelasting: de belasting die wordt geheven in de lidstaten van de Europese Unie krachtens de nationale
      wetgeving die is gebaseerd op de Zesde BTW-richtlijn, alsmede de belasting die het karakter van een omzetbelasting
      heeft en krachtens de nationale wetgeving wordt geheven in de EVA-staten genoemd in artikel 2, onderdeel b, van de
      Overeenkomst betreffende de Europese Economische Ruimte;
    url: https://wetten.overheid.nl/BWBR0013817/2005-01-01#Artikel1
  - number: 1.1.f
    text: |-
      bijdrage: bijdrage aan een publiekrechtelijk lichaam of regionaal openbaar lichaam ter financiering van uitgaven
      inzake omzetbelasting onder bij deze wet te stellen voorwaarden;
    url: https://wetten.overheid.nl/BWBR0013817/2005-01-01#Artikel1
  - number: 1.1.g
    text: 'tijdvak: kalenderkwartaal waarin het recht op bijdrage of de verschuldigdheid ervan ontstaat;'
    url: https://wetten.overheid.nl/BWBR0013817/2005-01-01#Artikel1
  - number: 1.1.h
    text: 'fonds: het BTW-compensatiefonds;'
    url: https://wetten.overheid.nl/BWBR0013817/2005-01-01#Artikel1
  - number: 1.1.i
    text: 'uitkeringsjaar: het kalenderjaar waarover het recht op uitkering ontstaat;'
    url: https://wetten.overheid.nl/BWBR0013817/2005-01-01#Artikel1
  - number: 1.1.j
    text: |-
      de inspecteur: de inspecteur van de rijksbelastingdienst die bevoegd is voor de heffing van de omzetbelasting ten
      aanzien van een publiekrechtelijk lichaam of regionaal openbaar lichaam waarop deze wet van toepassing is.
    url: https://wetten.overheid.nl/BWBR0013817/2005-01-01#Artikel1
  - number: '1.2'
    text: |-
      Voorzover niet anders is bepaald, hebben de begrippen die in deze wet en de daarop berustende bepalingen worden
      gebruikt en die zijn ontleend aan de [Wet op de omzetbelasting 1968][ref1], dezelfde betekenis als de begrippen in
      die wet en de daarop berustende bepalingen.


      [ref1]: https://wetten.overheid.nl/BWBR0002629
    url: https://wetten.overheid.nl/BWBR0013817/2005-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002629
  - number: '2.1'
    text: Er is een BTW-compensatiefonds.
    url: https://wetten.overheid.nl/BWBR0013817/2005-01-01#Artikel2
  - number: '2.2'
    text: |-
      Het fonds is een begrotingsfonds als bedoeld in [artikel 2 van de Comptabiliteitswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003075#Artikel2
    url: https://wetten.overheid.nl/BWBR0013817/2005-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003075
        artikel: '2'
  - number: '2.3'
    text: Onze Minister voert het beheer over de begroting van het fonds.
    url: https://wetten.overheid.nl/BWBR0013817/2005-01-01#Artikel2
  - number: '2.4'
    text: |-
      Het fonds wordt gevoed door voor ieder uitkeringsjaar bij wet een bedrag aan middelen van het Rijk ten behoeve
      van het fonds af te zonderen. Onze Minister kan nadere regels stellen ter bepaling van de wijze van voeding van
      het fonds.
    url: https://wetten.overheid.nl/BWBR0013817/2005-01-01#Artikel2
  - number: '2.5'
    text: |-
      Ten gunste van de begroting van het fonds van enig jaar wordt het gerealiseerde batig saldo van het fonds van het
      voorafgaande jaar gebracht.
    url: https://wetten.overheid.nl/BWBR0013817/2005-01-01#Artikel2
  - number: '2.6'
    text: 'De uitgaven van het fonds worden gevormd door:'
    url: https://wetten.overheid.nl/BWBR0013817/2005-01-01#Artikel2
  - number: 2.6.a
    text: bijdragen;
    url: https://wetten.overheid.nl/BWBR0013817/2005-01-01#Artikel2
  - number: 2.6.b
    text: de uitgaven ten behoeve van het beheer van het fonds.
    url: https://wetten.overheid.nl/BWBR0013817/2005-01-01#Artikel2
  - number: '2.7'
    text: |-
      Ten laste van de begroting van het fonds van enig jaar wordt het gerealiseerde nadelig saldo van het fonds van het
      voorafgaande jaar gebracht.
    url: https://wetten.overheid.nl/BWBR0013817/2005-01-01#Artikel2
  - number: '2.8'
    text: |-
      In afwijking van de [artikelen 4, tweede lid][ref1], en
      [65, tweede lid, aanhef en onder a, van de Comptabiliteitswet][ref2] hebben de begroting en de financiële
      verantwoording betrekking op de uitgaven en ontvangsten van het fonds.


      [ref1]: https://wetten.overheid.nl/BWBR0003075#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0003075#Artikel65
    url: https://wetten.overheid.nl/BWBR0013817/2005-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003075
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0003075
        artikel: '65'
  - number: '2.9'
    text: De inspecteur verstrekt de gegevens die nodig zijn ten behoeve van het beheer van het fonds.
    url: https://wetten.overheid.nl/BWBR0013817/2005-01-01#Artikel2
  - number: '2.10'
    text: |-
      Onze Minister kan nadere regels stellen met betrekking tot de minimale hoogte van de bijdragen uit het fonds. Onze
      Minister kan daarbij nadere regels stellen met betrekking tot de toepassing van een vereveningsfactor in verband
      met de budgettaire verwerking daarvan voorzover de bijdragen uit het fonds op grond van dit lid meer bedragen dan
      de bijdragen waarop recht bestaat op grond van de overige bepalingen van deze wet. Onze Minister kan voorts nadere
      regels stellen met betrekking tot een verevening van de in de vorige volzin bedoelde uitgekeerde hogere bijdragen
      in een kalenderjaar met bijdragen over daarop volgende kalenderjaren voorzover laatstbedoelde bijdragen de minimale
      hoogte van de bijdragen uit het fonds in die jaren overtreffen.
    url: https://wetten.overheid.nl/BWBR0013817/2005-01-01#Artikel2
  - number: '2.11'
    text: |-
      Onze Minister kan nadere regels stellen met betrekking tot de toepassing van een vereveningsfactor in
      verband met de budgettaire verwerking van bijdragen die niet samenhangen met betalingen op grond van de
      [Wet op de omzetbelasting 1968][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002629
    url: https://wetten.overheid.nl/BWBR0013817/2005-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002629
  - number: '2.12'
    text: |-
      Een krachtens dit artikel vastgestelde ministeriële regeling treedt niet eerder in werking dan acht weken na de
      datum van de plaatsing in de Staatscourant. Van de plaatsing wordt onverwijld mededeling gedaan aan de beide kamers
      der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0013817/2005-01-01#Artikel2
  - number: '3'
    text: |-
      Het publiekrechtelijk lichaam of regionaal openbaar lichaam heeft recht op een bijdrage uit het fonds ter
      financiering van:
    url: https://wetten.overheid.nl/BWBR0013817/2005-01-01#Artikel3
  - number: 3.a
    text: |-
      de omzetbelasting die door een ondernemer aan het publiekrechtelijk lichaam of regionaal openbaar lichaam in
      rekening is gebracht, dan wel van het publiekrechtelijk lichaam of regionaal openbaar lichaam wordt geheven, ter
      zake van aan hem verrichte leveringen en verleende diensten;
    url: https://wetten.overheid.nl/BWBR0013817/2005-01-01#Artikel3
  - number: 3.b
    text: |-
      de omzetbelasting die van het publiekrechtelijk lichaam of regionaal openbaar lichaam wordt geheven ingevolge een
      door hem verrichte intracommunautaire verwerving;
    url: https://wetten.overheid.nl/BWBR0013817/2005-01-01#Artikel3
  - number: 3.c
    text: |-
      de omzetbelasting die wordt geheven ter zake van de invoer van voor het publiekrechtelijk lichaam of regionaal
      openbaar lichaam bestemde goederen;
    url: https://wetten.overheid.nl/BWBR0013817/2005-01-01#Artikel3
  - number: '4.1'
    text: |-
      Het recht op een bijdrage wordt uitgesloten voor de omzetbelasting op de in artikel 3 bedoelde goederen en diensten
      welke gebezigd worden:
    url: https://wetten.overheid.nl/BWBR0013817/2005-01-01#Artikel4
  - number: 4.1.a
    text: om verstrekt, verleend of ter beschikking gesteld te worden aan een of meer individuele derden;
    url: https://wetten.overheid.nl/BWBR0013817/2005-01-01#Artikel4
  - number: 4.1.b
    text: |-
      voor het aan het personeel van het publiekrechtelijk lichaam of het regionaal openbaar lichaam verlenen van
      huisvesting, uitkering van loon in natura, geven van gelegenheid tot sport, ontspanning of privé-vervoer, dan wel
      voor andere persoonlijke doeleinden van het personeel of
    url: https://wetten.overheid.nl/BWBR0013817/2005-01-01#Artikel4
  - number: 4.1.c
    text: |-
      voor het verrichten van prestaties, al dan niet tegen vergoeding, die, indien zij door een ondernemer worden
      verricht, zijn vrijgesteld ingevolge [artikel 11 van de Wet op de omzetbelasting 1968](onbekend).
    url: https://wetten.overheid.nl/BWBR0013817/2005-01-01#Artikel4
  - number: '4.2'
    text: Het in het eerste lid bepaalde geldt niet voor bij algemene maatregel van bestuur aangewezen gevallen.
    url: https://wetten.overheid.nl/BWBR0013817/2005-01-01#Artikel4
  - number: '5'
    text: |-
      Het recht op bijdrage ontstaat op het tijdstip waarop de omzetbelasting aan het publiekrechtelijk lichaam
      of regionaal openbaar lichaam in rekening wordt gebracht op een conform de wettelijke bepalingen inzake de
      omzetbelasting voorgeschreven wijze opgemaakte factuur, dan wel op het tijdstip waarop de omzetbelasting wordt
      verschuldigd.
    url: https://wetten.overheid.nl/BWBR0013817/2005-01-01#Artikel5
  - number: '6.1'
    text: |-
      De bijdrage wordt naar evenredigheid verschuldigd op het tijdstip waarop en voorzover redelijkerwijs moet worden
      aangenomen dat het bedrag waarop de bijdrage betrekking heeft, niet of niet geheel zal worden betaald dan wel is
      terugontvangen.
    url: https://wetten.overheid.nl/BWBR0013817/2005-01-01#Artikel6
  - number: '6.2'
    text: |-
      De bijdrage wordt in ieder geval verschuldigd twee jaren na de opeisbaarheid van de vergoeding, voorzover deze op
      dat tijdstip nog niet is betaald.
    url: https://wetten.overheid.nl/BWBR0013817/2005-01-01#Artikel6
  - number: '7.1'
    text: |-
      De bijdrage wordt bepaald overeenkomstig de bestemming van de goederen en diensten op het tijdstip waarop de
      omzetbelasting aan het publiekrechtelijk lichaam of regionaal openbaar lichaam in rekening wordt gebracht, dan wel
      op het tijdstip waarop de omzetbelasting wordt verschuldigd.
    url: https://wetten.overheid.nl/BWBR0013817/2005-01-01#Artikel7
  - number: '7.2'
    text: |-
      Indien op het tijdstip waarop het publiekrechtelijk lichaam of regionaal openbaar lichaam de goederen en diensten
      gaat bezigen, blijkt, dat de omzetbelasting ter financiering waarvan de bijdrage strekt voor een groter of kleiner
      gedeelte tot bijdrage heeft geleid dan waartoe het publiekrechtelijk lichaam of regionaal openbaar lichaam op
      grond van het gebruik van de goederen en diensten is gerechtigd, wordt de te veel ontvangen bijdrage op dat
      tijdstip verschuldigd, dan wel ontstaat op dat tijdstip een recht op bijdrage ter hoogte van de te weinig ontvangen
      bijdrage.
    url: https://wetten.overheid.nl/BWBR0013817/2005-01-01#Artikel7
  - number: '8'
    text: |-
      Onze Minister kan nadere regels stellen omtrent de bijdrage ingeval de goederen en diensten zowel worden bestemd
      of gebezigd in het kader van de onderneming van het publiekrechtelijk lichaam of regionaal openbaar lichaam als in
      het kader van andere doeleinden van het publiekrechtelijk lichaam of regionaal openbaar lichaam. Onze Minister kan
      voorts nadere regels stellen omtrent de bijdrage ingeval de goederen en diensten worden bestemd of gebezigd mede
      ten behoeve van prestaties als bedoeld in [artikel 4][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013817#Artikel4
    url: https://wetten.overheid.nl/BWBR0013817/2005-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0013817
        artikel: '4'
  - number: '9.1'
    text: |-
      De inspecteur als bedoeld in [artikel 1, onderdeel j][ref1], is mede bevoegd voor de toepassing van deze wet ten
      aanzien van het publiekrechtelijk lichaam of regionaal openbaar lichaam.


      [ref1]: https://wetten.overheid.nl/BWBR0013817#Artikel1
    url: https://wetten.overheid.nl/BWBR0013817/2005-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0013817
        artikel: '1'
  - number: '9.2'
    text: |-
      Voor het einde van de maand volgend op het tijdvak waarin het recht op bijdrage is ontstaan, dan wel een eerder
      verstrekte of nog te verstrekken bijdrage geheel of gedeeltelijk verschuldigd is geworden, wordt daarvan opgave
      gedaan. De inspecteur kan bij beschikking afwijken van de opgave.
    url: https://wetten.overheid.nl/BWBR0013817/2005-01-01#Artikel9
  - number: '9.3'
    text: |-
      Na afloop van het kalenderjaar stelt de inspecteur de bijdrage over dat jaar op grond van de bepalingen
      van deze wet bij beschikking vast. Het verschil tussen de bij de in de vorige volzin bedoelde beschikking
      vastgestelde bijdrage en de over het kalenderjaar verstrekte voorschotten wordt zes maanden na het kalenderjaar
      uitbetaald, teruggevorderd dan wel verrekend met omzetbelasting die verschuldigd is op grond van de
      [Wet op de omzetbelasting 1968][ref1], met inachtneming van het bepaalde in [artikel 2, tiende lid][ref2], over de
      minimale hoogte van de bijdrage.


      [ref1]: https://wetten.overheid.nl/BWBR0002629
      [ref2]: https://wetten.overheid.nl/BWBR0013817#Artikel2
    url: https://wetten.overheid.nl/BWBR0013817/2005-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002629
      - id: ref2
        bwb_id: BWBR0013817
        artikel: '2'
  - number: '9.4'
    text: |-
      Indien uiterlijk vijf jaren na het einde van het kalenderjaar blijkt dat bijdrage over dat jaar is verstrekt tot
      een hoger of lager bedrag dan waarop het publiekrechtelijk lichaam of regionaal openbaar lichaam op grond van
      deze wet recht heeft, stelt de inspecteur de hoogte van de bijdrage over het desbetreffende kalenderjaar vast bij
      beschikking en wordt het verschil met de over dat kalenderjaar verstrekte bijdrage uitbetaald, teruggevorderd dan
      wel verrekend met omzetbelasting en de daarover berekende heffingsrente. Voor de toepassing van dit lid wordt rente
      berekend op grond van het vijfde lid beschouwd als bijdrage.
    url: https://wetten.overheid.nl/BWBR0013817/2005-01-01#Artikel9
  - number: '9.5'
    text: |-
      In de gevallen bedoeld in het vierde lid wordt rente berekend.
      [Hoofdstuk VA van de Algemene wet inzake rijksbelastingen][ref1] is van overeenkomstige toepassing als ware de
      bijdrage omzetbelasting, met dien verstande dat rente wordt berekend met ingang van de eerste dag van de zevende
      kalendermaand volgend op het kalenderjaar waarop het recht op bijdrage betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#HoofdstukVA
    url: https://wetten.overheid.nl/BWBR0013817/2005-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002320
        hoofdstuk: VA
  - number: '9.6'
    text: |-
      Hetgeen voor de omzetbelasting onherroepelijk komt vast te staan, geldt mede ten aanzien van de toepassing van
      deze wet.
    url: https://wetten.overheid.nl/BWBR0013817/2005-01-01#Artikel9
  - number: '9.7'
    text: |-
      Op het bezwaar, beroep, hoger beroep of beroep in cassatie tegen een op de voet van het tweede, derde of vierde
      lid gegeven beschikking is [hoofdstuk V van de Algemene wet inzake rijksbelastingen][ref1] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#HoofdstukV
    url: https://wetten.overheid.nl/BWBR0013817/2005-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002320
        hoofdstuk: V
  - number: '9.8'
    text: |-
      De [artikelen 47][ref1], [48 tot en met 56][ref2] en [67 van de Algemene wet inzake rijksbelastingen][ref3] en
      [de artikelen 34][ref4] en [34a van de Wet op de omzetbelasting 1968][ref5] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel48
      [ref3]: https://wetten.overheid.nl/BWBR0002320#Artikel67
      [ref4]: https://wetten.overheid.nl/BWBR0002629#Artikel34
      [ref5]: https://wetten.overheid.nl/BWBR0002629#Artikel34a
    url: https://wetten.overheid.nl/BWBR0013817/2005-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '47'
      - id: ref2
        bwb_id: BWBR0002320
        artikel: '48'
      - id: ref3
        bwb_id: BWBR0002320
        artikel: '67'
      - id: ref4
        bwb_id: BWBR0002629
        artikel: '34'
      - id: ref5
        bwb_id: BWBR0002629
        artikel: 34a
  - number: '9.9'
    text: Onze Minister kan nadere regels stellen ter uitvoering van hetgeen in dit artikel is bepaald.
    url: https://wetten.overheid.nl/BWBR0013817/2005-01-01#Artikel9
  - number: '13.1'
    text: |-
      Geen recht op bijdrage bestaat voor omzetbelasting die in rekening is gebracht op een tijdstip dat is gelegen op of
      na het tijdstip van inwerkingtreding van deze wet, in gevallen waarin de omzetbelasting:
    url: https://wetten.overheid.nl/BWBR0013817/2005-01-01#Artikel13
  - number: 13.1.a
    text: |-
      betrekking heeft op leveringen of diensten, voorzover die worden verricht op een tijdstip dat is gelegen voor het
      tijdstip van inwerkingtreding van deze wet;
    url: https://wetten.overheid.nl/BWBR0013817/2005-01-01#Artikel13
  - number: 13.1.b
    text: |-
      op grond van de wettelijke bepalingen inzake de omzetbelasting in rekening had moeten worden gebracht op een
      tijdstip dat is gelegen voor het tijdstip van inwerkingtreding van deze wet;
    url: https://wetten.overheid.nl/BWBR0013817/2005-01-01#Artikel13
  - number: 13.1.c
    text: |-
      betrekking heeft op de levering van een gebouw of een gedeelte van een gebouw en het erbij behorende terrein dan
      wel van een bouwterrein, alsmede van rechten waaraan deze zijn onderworpen, welk gebouw of gedeelte van een gebouw
      dan wel bouwterrein voor het eerst geheel dan wel gedeeltelijk in gebruik is genomen uiterlijk twee jaren voor het
      tijdstip van inwerkingtreding van deze wet.
    url: https://wetten.overheid.nl/BWBR0013817/2005-01-01#Artikel13
  - number: '13.2'
    text: |-
      Bij diensten waarvoor periodiek een vergoeding in rekening wordt gebracht wordt het recht op bijdrage beperkt in
      de gevallen waarin en voorzover de vergoeding die in rekening wordt gebracht na het tijdstip van inwerkingtreding
      van deze wet meer dan tien percent hoger is dan de vergoeding die gemiddeld in rekening is gebracht in de periode
      van twee jaren voorafgaande aan het tijdstip van inwerkingtreding van deze wet. Het percentage van tien wordt
      vermeerderd met tien voor elk heel jaar dat sinds het tijdstip van inwerkingtreding van deze wet is verstreken.
    url: https://wetten.overheid.nl/BWBR0013817/2005-01-01#Artikel13
  - number: '13.3'
    text: |-
      De beperking in het recht op bijdrage, bedoeld in het voorgaande lid, vervalt voor diensten met betrekking tot
      roerende zaken vijf jaren en voor diensten met betrekking tot onroerende zaken tien jaren na het tijdstip van
      inwerkingtreding van deze wet. Een overeenkomstige vervaltermijn geldt voor rechten waaraan roerende dan wel
      onroerende zaken zijn onderworpen. Voor overige diensten geldt een vervaltermijn van vijf jaren na het tijdstip van
      inwerkingtreding van deze wet.
    url: https://wetten.overheid.nl/BWBR0013817/2005-01-01#Artikel13
  - number: '14'
    text: |-
      Deze wet treedt in werking met ingang van 1 januari 2003, met uitzondering voor de regionale openbare lichamen,
      waarvoor deze wet op een bij koninklijk besluit te bepalen tijdstip in werking zal treden.
    url: https://wetten.overheid.nl/BWBR0013817/2005-01-01#Artikel14
  - number: '15'
    text: 'Deze wet wordt aangehaald als: Wet op het BTW-compensatiefonds.'
    url: https://wetten.overheid.nl/BWBR0013817/2005-01-01#Artikel15
