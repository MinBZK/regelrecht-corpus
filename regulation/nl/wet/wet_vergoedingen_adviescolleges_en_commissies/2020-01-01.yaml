  - number: '2'
    text: |-
      1 Bij besluit van Onze Minister kan een vergoeding per vergadering of een vaste vergoeding per maand worden
      toegekend aan:

      a. de leden, met inbegrip van de voorzitter, van een adviescollege onderscheidenlijk een commissie;

      b. de secretaris en adjunct-secretaris van een commissie;

      c. personen die aan de werkzaamheden van een adviescollege onderscheidenlijk een commissie deelnemen.

      2 De in het eerste lid genoemde personen ontvangen een vergoeding van reis- en verblijfkosten op de voet van de
      regeling voor de ambtenaren die op grond van een arbeidsovereenkomst met de Staat werkzaam zijn.

      3 Van de toekenning van vergoedingen als bedoeld in het eerste en tweede lid zijn uitgesloten:

      a. personen die een functie vervullen bij instellingen of organisaties als bedoeld in de
      __REF000___________________________________________________________________________________________________________
      _____, indien hun benoeming of deelname aan de werkzaamheden haar oorzaak vindt in de functie die zij vervullen;

      b. vertegenwoordigers van organisaties die gelegenheid hebben op te komen voor groepen of individuele personen wier
      belangen bij de arbeid van de commissie zijn betrokken, tenzij door Onze Minister in bijzondere gevallen anders
      wordt beslist.

      4 Bij of krachtens algemene maatregel van bestuur worden nadere regels vastgesteld met betrekking tot de
      vergoedingen, bedoeld in het eerste lid.

      5 Een besluit als bedoeld in het eerste lid wordt in de Staatscourant geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel1.2
