preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de regels met betrekking tot de vergoeding van de
    leden van adviescolleges en bij of krachtens wet, bij koninklijk besluit of bij ministerieel besluit ingestelde
    commissies te harmoniseren;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0024775/2020-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. *een adviescollege:* een adviescollege als bedoeld in de [Kaderwet adviescolleges][ref1], met uitzondering van
      adviescolleges waarvan de adviestaak, bedoeld in [artikel 1, onderdeel a, van de Kaderwet adviescolleges][ref2]
      niet de hoofdtaak is;

      b. *een commissie:* een bij of krachtens wet, bij koninklijk besluit of bij ministerieel besluit
      ingestelde commissie, niet zijnde een adviescollege of een zelfstandig bestuursorgaan als bedoeld in de
      [Kaderwet zelfstandige bestuursorganen][ref3];

      c. *Onze Minister:* Onze Minister wie het aangaat.


      [ref1]: https://wetten.overheid.nl/BWBR0008159
      [ref2]: https://wetten.overheid.nl/BWBR0008159#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0020495
    url: https://wetten.overheid.nl/BWBR0024775/2020-01-01#Artikel1
