  - number: '9'
    text: |-
      1 [Artikel 8, eerste lid, aanhef en onder a][ref1], is niet van toepassing indien de aanbestedende dienst:

      a. van mening is dat de gunning van een opdracht zonder voorafgaande bekendmaking
      van een aankondiging van de opdracht in het *Publicatieblad van de Europese Unie*
      op grond van het [Besluit aanbestedingsregels voor overheidsopdrachten][ref2] of het
      [Besluit aanbestedingen speciale sectoren][ref3] is toegestaan,

      b. de aankondiging van zijn voornemen om tot sluiting van de overeenkomst over te gaan in het *Publicatieblad van
      de Europese Unie* heeft bekendgemaakt, en

      c. de overeenkomst niet heeft gesloten voor het verstrijken van een termijn van ten minste 15 kalenderdagen,
      ingaande op de dag na de datum van de bekendmaking van bedoelde aankondiging.

      2 [Artikel 8, eerste lid, aanhef en onder c][ref4], is niet van toepassing indien de aanbestedende dienst:

      a. van mening is dat de gunning van een opdracht in overeenstemming
      is met [artikel 32, tiende lid, onderdeel b][ref5], en
      [artikel 33, elfde tot en met veertiende lid van het Besluit aanbestedingsregels voor overheidsopdrachten][ref6] of
      [artikel 39, elfde tot en met veertiende lid van het Besluit aanbestedingen speciale sectoren][ref7],

      b. het besluit tot gunning van de opdracht, tezamen met de relevante redenen als bedoeld in artikel 6 aan de
      betrokken inschrijvers heeft gezonden, en

      c. de overeenkomst niet is gesloten vóór het verstrijken van een termijn van ten minste 15 kalenderdagen, ingaande
      op de dag na de datum waarop het besluit tot gunning van de opdracht aan de betrokken inschrijvers is gezonden.


