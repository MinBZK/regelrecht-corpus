  - number: '5'
    text: |-
      1 Inschrijvers worden geacht bij de procedure betrokken te zijn als bedoeld in [artikel 4, tweede lid][ref1],
      zolang zij niet definitief zijn uitgesloten. De uitsluiting is definitief wanneer de betrokken inschrijvers daarvan
      in kennis zijn gesteld en wanneer de uitsluiting rechtmatig is bevonden door een rechter, dan wel er niet langer
      een rechtsmiddel kan worden aangewend tegen de uitsluiting.

      2 Gegadigden worden geacht bij de procedure betrokken te zijn als bedoeld in [artikel 4, tweede lid][ref2], indien
      de aanbestedende dienst geen informatie over de afwijzing van hun verzoek ter beschikking heeft gesteld voordat de
      betrokken inschrijvers in kennis werden gesteld van de gunningsbeslissing.


      [ref1]: https://wetten.overheid.nl/BWBR0027221#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0027221#Artikel4
    url: https://wetten.overheid.nl/BWBR0027221/2013-01-01#Artikel5
    references:
