        artikel: '4'
      - id: ref2
        bwb_id: BWBR0027221
        artikel: '4'
  - number: '6'
    text: |-
      1 De mededeling aan iedere inschrijver of gegadigde van een gunningsbeslissing bevat de relevante redenen voor die
      beslissing, alsmede een nauwkeurige omschrijving van de termijn, bedoeld in [artikel 4, eerste lid][ref1], die van
      toepassing is.

      2 De mededeling, bedoeld in het eerste lid, wordt in ieder geval elektronisch of per fax verzonden aan de betrokken
      inschrijvers en betrokken gegadigden.


      [ref1]: https://wetten.overheid.nl/BWBR0027221#Artikel4
    url: https://wetten.overheid.nl/BWBR0027221/2013-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0027221
        artikel: '4'
  - number: '7'
    text: |-
      Indien gedurende de termijn, bedoeld in [artikel 4, eerste lid][ref1], een onmiddellijke voorziening bij voorraad
      wordt verzocht met betrekking tot de desbetreffende gunningsbeslissing, sluit de aanbestedende dienst de met die
      beslissing beoogde overeenkomst niet eerder dan nadat de rechter dan wel het scheidsgerecht een beslissing heeft
      genomen over het verzoek tot voorlopige maatregelen en de termijn, bedoeld in artikel 4, eerste lid, is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0027221#Artikel4
    url: https://wetten.overheid.nl/BWBR0027221/2013-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0027221
        artikel: '4'
  - number: '8'
    text: |-
      1 Een als resultaat van een gunningsbeslissing gesloten overeenkomst is in rechte vernietigbaar op een van de
      volgende gronden:

      a. de aanbestedende dienst heeft, in strijd met het [Besluit aanbestedingsregels voor overheidsopdrachten][ref1] of
      het [Besluit aanbestedingen speciale sectoren][ref2], de overeenkomst gesloten zonder voorafgaande bekendmaking van
      een aankondiging van de opdracht in het *Publicatieblad van de Europese Unie*;

      b. de aanbestedende dienst heeft de termijnen, bedoeld in [artikel 4, eerste lid][ref3], onderscheidenlijk
      [7][ref4], niet in acht genomen;

      c. de aanbestedende dienst heeft toepassing gegeven aan [artikel 4, vierde lid, onder c][ref5],
      bij de gunning van een opdracht waarvan de geraamde waarde gelijk is aan of groter is dan de
      drempelbedragen, en heeft gehandeld in strijd met [artikel 32, tiende lid, onderdeel b][ref6], of
      [artikel 33, elfde tot en met veertiende lid, van het Besluit aanbestedingsregels voor overheidsopdrachten][ref7]
      dan wel [artikel 39, elfde tot en met veertiende lid van het Besluit aanbestedingen speciale sectoren][ref8].

      2 De vordering tot vernietiging wordt door een ondernemer die zich door een gunningsbeslissing benadeeld acht
      ingesteld:

      a. voor het verstrijken van een periode van 30 kalenderdagen ingaande, op de dag na de datum waarop

        - de aanbestedende dienst de aankondiging van de gegunde opdracht bekendmaakte
      overeenkomstig de [artikelen 35, twaalfde tot en met zeventiende lid][ref9], [36][ref10] en
      [37 van het Besluit aanbestedingsregels overheidsopdrachten][ref11] respectievelijk [43][ref12] en
      [44 van het Besluit aanbestedingen speciale sectoren][ref13];
        - de aanbestedende dienst aan de betrokken inschrijvers en gegadigden een kennisgeving zond van de sluiting
      van de overeenkomst, op voorwaarde dat die kennisgeving vergezeld gaat van de relevante redenen voor de
      gunningsbeslissing;

      b. in andere gevallen dan bedoeld in onderdeel a, voor het verstrijken van een periode van zes maanden, ingaande op
      de dag na de datum waarop de overeenkomst is gesloten.


