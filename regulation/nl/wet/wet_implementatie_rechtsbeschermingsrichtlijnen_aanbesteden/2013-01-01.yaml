        bwb_id: BWBR0027221
        artikel: '14'
  - number: '20'
    text: |-
      Indien terzake van een aanbestedingsgeschil arbitrage is overeengekomen:

      a. voldoet de voorzitter van het scheidsgerecht aan de eisen genoemd in [artikelen 1c][ref1] en
      [1d van de Wet rechtspositie rechterlijke ambtenaren][ref2];

      b. kan van een uitspraak in arbitrage beroep worden ingesteld bij de rechter.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel1c
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel1d
    url: https://wetten.overheid.nl/BWBR0027221/2013-01-01#Artikel20
