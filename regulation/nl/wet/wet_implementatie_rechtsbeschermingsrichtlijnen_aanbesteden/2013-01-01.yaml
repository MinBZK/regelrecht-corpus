  - number: '2'
    text: |-
      Deze wet en de daarop berustende bepalingen zijn van toepassing op opdrachten waarop het
      [Besluit aanbestedingsregels overheidsopdrachten][ref1] of het [Besluit aanbestedingen speciale sectoren][ref2] van
      toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0018607
      [ref2]: https://wetten.overheid.nl/BWBR0018608
    url: https://wetten.overheid.nl/BWBR0027221/2013-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0018607
      - id: ref2
        bwb_id: BWBR0018608
  - number: '3'
    text: |-
      Indien een aankoopcentrale aan welke door een aanbestedende dienst een overheidsopdracht wordt gegund, het
      bepaalde bij of krachtens deze wet heeft nageleefd, heeft de aanbestedende dienst voldaan aan de voor hem geldende
      verplichtingen op grond van deze wet.
    url: https://wetten.overheid.nl/BWBR0027221/2013-01-01#Artikel3
  - number: '4'
    text: |-
      1 Een aanbestedende dienst neemt een termijn in acht voordat hij de met de gunningsbeslissing beoogde overeenkomst
      sluit.

      2 De termijn, bedoeld in het eerste lid, vangt aan op de dag na de datum waarop de mededeling van de
      gunningsbeslissing is verzonden aan de betrokken inschrijvers en betrokken gegadigden.

      3 De termijn, bedoeld in het eerste lid, bedraagt ten minste vijftien kalenderdagen.

      4 Een aanbestedende dienst behoeft geen toepassing te geven aan het eerste lid indien:

      a. het [Besluit aanbestedingsregels voor overheidsopdrachten][ref1] of het
      [Besluit aanbestedingen speciale sectoren][ref2] geen voorafgaande bekendmaking van de aankondiging van de opdracht
      in het *Publicatieblad van de Europese Unie* vereist;

      b. de enige betrokken inschrijver degene is aan wie de opdracht wordt gegund en er geen betrokken gegadigden zijn;

      c. het gaat om opdrachten op grond van een raamovereenkomst of om specifieke opdrachten op
      grond van een dynamisch aankoopsysteem, als bedoeld in de [artikelen 32][ref3] onderscheidenlijk
      [33 van het Besluit aanbestedingsregels voor overheidsopdrachten][ref4], of de [artikelen 38][ref5]
      onderscheidenlijk [39 van het Besluit aanbestedingen speciale sectoren][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0018607
      [ref2]: https://wetten.overheid.nl/BWBR0018608
      [ref3]: https://wetten.overheid.nl/BWBR0018607#Artikel32
      [ref4]: https://wetten.overheid.nl/BWBR0018607#Artikel33
      [ref5]: https://wetten.overheid.nl/BWBR0018608#Artikel38
      [ref6]: https://wetten.overheid.nl/BWBR0018608#Artikel39
    url: https://wetten.overheid.nl/BWBR0027221/2013-01-01#Artikel4
