preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het ter implementatie van Richtlijn 2007/66/EG tot wijziging van de
    Richtlijnen 89/665/EG en 92/13/EEG van de Raad met betrekking tot de verhoging van de doeltreffendheid van de
    beroepsprocedures inzake het plaatsen van overheidsopdrachten (PbEU L 335) noodzakelijk is aanvullende regels te
    stellen omtrent de rechtsbescherming bij aanbesteden;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0027221/2013-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. *aanbestedende dienst:* de staat, een provincie, een gemeente, een waterschap, een publiekrechtelijke
      instelling, een samenwerkingsverband van deze overheden of publiekrechtelijke instellingen, een overheidsbedrijf,
      of een bedrijf of instelling waaraan door de staat, een provincie, een gemeente, een waterschap of een
      publiekrechtelijke instelling een bijzonder recht of een uitsluitend recht is verleend, wanneer deze een van de
      activiteiten, bedoeld in de [artikelen 2 tot en met 7 van het Besluit aanbestedingen speciale sectoren][ref1],
      uitoefent;

      b. *aankoopcentrale:* een aanbestedende dienst die voor aanbestedende diensten bestemde leveringen of diensten
      verwerft, opdrachten gunt of raamovereenkomsten sluit met betrekking tot voor aanbestedende diensten bestemde
      werken, leveringen of diensten;

      c. *bijzonder recht:* een recht dat bij wettelijk voorschrift of bij besluit van een bestuursorgaan aan een beperkt
      aantal ondernemingen wordt verleend en waarbij binnen een bepaald geografisch gebied:

      1°. het aantal van deze ondernemingen die een dienst mogen verrichten of een activiteit mogen uitoefenen op een
      andere wijze dan volgens objectieve, evenredige en niet-discriminerende criteria tot twee of meer wordt beperkt,

      2°. verscheidene concurrerende ondernemingen die een dienst mogen verrichten of een activiteit mogen uitoefenen op
      een andere wijze dan volgens deze criteria worden aangewezen, of

      3°. aan een of meer ondernemingen op een andere wijze dan volgens deze criteria voordelen worden toegekend waardoor
      enige andere onderneming aanzienlijk wordt belemmerd in de mogelijkheid om dezelfde activiteiten binnen hetzelfde
      geografische gebied onder in wezen gelijkwaardige voorwaarden uit te oefenen;

      d. *drempelbedragen:* de bedragen, bedoeld in artikel 7 van [richtlijn 2004/18/EG](32004L0018) of artikel 16 van
      [richtlijn 2004/17](32004L0017), waarbij een wijziging van deze bedragen gaat gelden met ingang van de dag waarop
      aan de betrokken wijziging uitvoering moet zijn gegeven;

      e. *gegadigde:* een ondernemer die heeft verzocht om een uitnodiging tot deelneming aan een niet-openbare
      procedure, aan een procedure van gunning door onderhandelingen of aan een concurrentiegerichte dialoog;

      f. *gunningsbeslissing:* de keuze van de aanbestedende dienst voor de ondernemer met wie hij een raamovereenkomst
      wil sluiten of aan wie hij een overheidsopdracht wil gunnen, waaronder mede wordt verstaan de beslissing om een
      opdracht niet te gunnen;

      g. *inschrijver:* een ondernemer die een inschrijving heeft ingediend;

      h. *mededeling van de gunningsbeslissing:* een schriftelijke kennisgeving van de gunningsbeslissing die voldoet aan
      de in [artikel 6][ref2] gestelde eisen;

      i. *overheidsbedrijf:* een bedrijf waarop de staat, een provincie, een gemeente, een waterschap, een
      publiekrechtelijke instelling of een samenwerkingsverband van de hiervoor genoemde overheden of publiekrechtelijke
      instellingen, rechtstreeks of middellijk een overheersende invloed kan uitoefenen uit hoofde van eigendom,
      financiële deelneming of de op het bedrijf van toepassing zijnde voorschriften;

      j. *overheersende invloed:* een invloed die wordt vermoed aanwezig te zijn, wanneer de staat, een provincie, een
      gemeente, een waterschap, een publiekrechtelijke instelling of een samenwerkingsverband van de hiervoor genoemde
      overheden of publiekrechtelijke instellingen, al dan niet rechtstreeks, ten aanzien van een overheidsbedrijf:

      1°. de meerderheid van het geplaatste kapitaal van het overheidsbedrijf bezit, of

      2°. over de meerderheid van de stemmen beschikt die aan de door het overheidsbedrijf uitgegeven aandelen zijn
      verbonden, of

      3°. meer dan de helft van de leden van het bestuurs-, leidinggevend of toezichthoudend orgaan van het
      overheidsbedrijf kan aanwijzen;

      k. *procedure:* een van de aanbestedingsprocedures, bedoeld in het
      [Besluit aanbestedingsregels voor overheidsopdrachten][ref3] of het
      [Besluit aanbestedingen speciale sectoren][ref4];

      l. *publiekrechtelijke instelling:* een instelling die is opgericht met het specifieke doel te voorzien in
      behoeften van algemeen belang, niet zijnde van industriële of commerciële aard, die rechtspersoonlijkheid bezit
      en waarvan:

      1°. de activiteiten in hoofdzaak door de staat, een provincie, een gemeente, een waterschap of een andere
      publiekrechtelijke instelling worden gefinancierd,

      2°. het beheer onderworpen is aan toezicht door de staat, een provincie, een gemeente, een waterschap of een andere
      publiekrechtelijke instelling, of

      3°. de leden van het bestuur, het leidinggevend of het toezichthoudend orgaan voor meer dan de helft door de staat,
      een provincie, een gemeente, een waterschap of andere publiekrechtelijke instellingen zijn aangewezen;

      m. *raad:* de raad van bestuur van de Nederlandse Mededingingsautoriteit;

      n. *relevante redenen:* de beschrijving van de redenen, bedoeld in
      [artikel 41, tweede tot en met vijfde lid van het Besluit aanbestedingsregels voor overheidsopdrachten][ref5],
      of de beschrijving van de redenen, bedoeld in
      [artikel 50, tweede tot en met vijfde lid van het Besluit aanbestedingen speciale sectoren][ref6];

      o. *uitsluitend recht:* een recht dat bij wettelijk voorschrift of bij besluit van een bestuursorgaan aan een
      onderneming wordt verleend, waarbij voor die onderneming het recht wordt voorbehouden om binnen een bepaald
      geografisch gebied een dienst te verrichten of een activiteit uit te oefenen.


      [ref1]: https://wetten.overheid.nl/BWBR0018608#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0027221#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0018607
