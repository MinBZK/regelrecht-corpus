  - number: '10'
    text: |-
      1 De bekendmaking, bedoeld in de [artikelen 8, tweede lid, onder a, eerste gedachtenstreepje][ref1], en
      [9, eerste lid, onder b][ref2], bevat tenminste de volgende gegevens:

      a. de naam en contactgegevens van de aanbestedende dienst;

      b. een beschrijving van het onderwerp van de opdracht;

      c. een rechtvaardiging van de beslissing om de opdracht te gunnen zonder voorafgaande bekendmaking van een
      aankondiging van de opdracht in het *Publicatieblad van de Europese Unie*;

      d. de naam en contactgegevens van de onderneming ten gunste van wie de beslissing om een opdracht te gunnen is
      genomen;

      e. voor zover van toepassing alle andere informatie die de aanbestedende dienst nuttig acht.

      2 De bekendmaking geschiedt overeenkomstig het daartoe door de Europese Commissie vastgestelde formulier.

      3 Onze Minister van Economische Zaken, Landbouw en Innovatie zorgt ervoor dat het formulier, bedoeld in het tweede
      lid, beschikbaar wordt gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0027221#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0027221#Artikel9
    url: https://wetten.overheid.nl/BWBR0027221/2013-01-01#Artikel10
