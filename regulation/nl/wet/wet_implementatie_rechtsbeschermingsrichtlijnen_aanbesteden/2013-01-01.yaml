  - number: '11'
    text: |-
      1 De rechter kan besluiten een overeenkomst niet te vernietigen indien, alle relevante aspecten in aanmerking
      genomen, dwingende redenen van algemeen belang het noodzakelijk maken dat de overeenkomst in stand blijft.

      2 Economische belangen mogen alleen als een dwingende reden als bedoeld in het eerste lid, worden beschouwd indien
      vernietiging in uitzonderlijke omstandigheden onevenredig grote gevolgen zou hebben. Economische belangen die
      rechtstreeks verband houden met de betrokken overeenkomst, mogen evenwel geen dwingende reden bedoeld in het eerste
      lid vormen. Zodanige belangen omvatten onder meer de kosten die voortvloeien uit vertraging bij de uitvoering van
      de overeenkomst, de kosten van een nieuwe aanbestedingsprocedure, de kosten die veroorzaakt worden door het feit
      dat een andere onderneming de overeenkomst uitvoert, en de kosten van de wettelijke verplichtingen die voortvloeien
      uit de vernietiging.
    url: https://wetten.overheid.nl/BWBR0027221/2013-01-01#Artikel11
  - number: '12'
    text: |-
      1 Indien de rechter toepassing geeft aan [artikel 11, eerste lid][ref1], kan de rechter op verzoek van een
      belanghebbende of ambtshalve de looptijd van de overeenkomst verkorten.

      2 De rechter houdt in ieder geval rekening met de ernst van de overtreding, het gedrag van de aanbestedende dienst,
      de aard van de overeenkomst en, in voorkomend geval, met de mogelijkheid om de werking van een vernietiging te
      beperken.


      [ref1]: https://wetten.overheid.nl/BWBR0027221#Artikel11
    url: https://wetten.overheid.nl/BWBR0027221/2013-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0027221
        artikel: '11'
  - number: '13'
    text: |-
      1 Indien de rechter toepassing heeft gegeven aan [artikel 11, eerste lid][ref1], wordt door de griffie van de
      rechtbank onverwijld en kosteloos een afschrift van de uitspraak gezonden aan Onze Minister van Economische Zaken,
      Landbouw en Innovatie en aan de raad.

      2 Onze Minister draagt zorg dat afschriften van uitspraken als bedoeld in het eerste lid eenmaal per jaar aan de
      Commissie van de Europese Gemeenschappen worden gezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0027221#Artikel11
    url: https://wetten.overheid.nl/BWBR0027221/2013-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0027221
        artikel: '11'
  - number: '14'
    text: |-
      1 De raad legt de aanbestedende dienst die partij is bij een overeenkomst waarbij toepassing is gegeven aan
      [artikel 11, eerste lid][ref1], een bestuurlijke boete op.

      2 Het eerste lid is van overeenkomstige toepassing indien de overeenkomst in rechte is vernietigd doch de werking
      geheel of gedeeltelijk aan die vernietiging is ontzegd.

      3 De in het eerste lid bedoelde boete is afschrikkend, evenredig en doeltreffend, beschouwd in samenhang met de in
      [artikel 12][ref2] bedoelde verkorting van de looptijd.

      4 De bestuurlijke boete bedraagt ten hoogste vijftien procent van de geraamde waarde van de desbetreffende
      overheidsopdracht. Bij het bepalen van de hoogte van de boete neemt de raad de relevante omstandigheden van het
      geval, waaronder de ernst van de overtreding in acht.

      5 De te betalen geldsom van de opgelegde bestuurlijke boete komt toe aan de Staat.


      [ref1]: https://wetten.overheid.nl/BWBR0027221#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0027221#Artikel12
    url: https://wetten.overheid.nl/BWBR0027221/2013-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0027221
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0027221
        artikel: '12'
  - number: '15'
    text: |-
      1 De raad neemt de beschikking, bedoeld in [artikel 14, eerste lid][ref1], niet dan nadat de uitspraak, bedoeld in
      [artikel 13, eerste lid][ref2], kracht van gewijsde heeft gekregen.

      2 De werking van een beschikking waarmee een bestuurlijke boete is opgelegd, wordt opgeschort totdat de
      beroepstermijn is verstreken of, indien beroep is ingesteld, op het beroep is beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0027221#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0027221#Artikel13
    url: https://wetten.overheid.nl/BWBR0027221/2013-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0027221
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0027221
        artikel: '13'
  - number: '16'
    text: |-
      1 De raad kan onder haar ressorterende ambtenaren aanwijzen als toezichthouders als bedoeld in
      [artikel 5:48 van de Algemene wet bestuursrecht][ref1].

      2 Alvorens een boete op te leggen kan de raad de overeenkomst onderzoeken teneinde de voor de vaststelling van de
      boete in aanmerking komende financiële gegevens te bepalen.

      3 De aanbestedende dienst is verplicht mee te werken aan de onderzoeken bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel548
    url: https://wetten.overheid.nl/BWBR0027221/2013-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 5:48
  - number: '17'
    text: |-
      Indien de aanbestedende dienst, bedoeld in [artikel 14, eerste lid][ref1], de Nederlandse Mededingingsautoriteit
      is, worden de bevoegdheden van de [artikelen 14 tot en met 16][ref2] uitgeoefend door Onze Minister van Economische
      Zaken, Landbouw en Innovatie.


      [ref1]: https://wetten.overheid.nl/BWBR0027221#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0027221#Artikel14
    url: https://wetten.overheid.nl/BWBR0027221/2013-01-01#Artikel17
    references:
