---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: uitvoeringsregeling_registratiewet_1970
regulatory_layer: WET
publication_date: '2024-12-24'
valid_from: '2026-01-01'
bwb_id: BWBR0034017
url: https://wetten.overheid.nl/BWBR0034017/2026-01-01
preamble:
  text: |-
    Handelende na overleg met de Staatssecretaris van Veiligheid en Justitie;

    Gelet op de artikelen 1, 3, 6, 7, 7a, 8 en 13 van de Registratiewet 1970, artikel 6 van de Wet op het centraal
    testamentenregister en artikel 18 van de Wet op belastingen van rechtsverkeer;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0034017/2026-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'Deze regeling verstaat onder:'
    url: https://wetten.overheid.nl/BWBR0034017/2026-01-01#Artikel1
  - number: 1.a
    text: |-
      *de wet:* de [Registratiewet 1970][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002739
    url: https://wetten.overheid.nl/BWBR0034017/2026-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002739
  - number: 1.b
    text: |-
      *de inspecteur:* de algemeen directeuren van de organisatieonderdelen, genoemd in
      [artikel 3, eerste lid, onderdelen a en c][ref1], en de directeur van het organisatieonderdeel, genoemd in artikel
      3, eerste lid, onderdeel b, van de Uitvoeringsregeling Belastingdienst 2003;


      [ref1]: https://wetten.overheid.nl/BWBR0014506#Artikel3
    url: https://wetten.overheid.nl/BWBR0034017/2026-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0014506
        artikel: '3'
  - number: 1.c
    text: |-
      *de inspectie:* het organisatieonderdeel, genoemd in
      [artikel 3, eerste lid, onderdelen a of b, van de Uitvoeringsregeling Belastingdienst 2003][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0014506#Artikel3
    url: https://wetten.overheid.nl/BWBR0034017/2026-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0014506
        artikel: '3'
  - number: 1.d
    text: |-
      *het register:* het register, bedoeld in [artikel 1, tweede lid, onderdeel a, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002739#Artikel1
    url: https://wetten.overheid.nl/BWBR0034017/2026-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002739
        artikel: '1'
  - number: 1.e
    text: |-
      *het repertorium:* het repertorium, bedoeld in [artikel 7 van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002739#Artikel7
    url: https://wetten.overheid.nl/BWBR0034017/2026-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002739
        artikel: '7'
  - number: 1.f
    text: |-
      *elektronisch afschrift:* in digitale vorm uitgegeven afschrift in de zin van
      [artikel 49, eerste lid, onderdeel a, van de Wet op het notarisambt][ref1] dat is voorzien van een gekwalificeerde
      elektronische handtekening van de notaris die voldoet aan de daaraan bij of krachtens Verordening (EU) nr.
      910/2014 van het Europees Parlement en de Raad van 23 juli 2014 betreffende elektronische identificatie en
      vertrouwensdiensten voor elektronische transacties in de interne markt en tot intrekking van [Richtlijn 1999/93/
      EG](31999L0093) (PbEU 2014, L 257) gestelde eisen en aan de daartoe door de KNB, in overeenstemming met de
      Belastingdienst, opgestelde richtlijnen;


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel49
    url: https://wetten.overheid.nl/BWBR0034017/2026-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '49'
  - number: 1.g
    text: |-
      *renvooien:* de bijvoegingen, veranderingen en doorhalingen, die op de kant of aan de voet van de akte zijn
      vermeld, mits daarbij de plaats in de akte is aangegeven waarop zij betrekking hebben;
    url: https://wetten.overheid.nl/BWBR0034017/2026-01-01#Artikel1
  - number: 1.h
    text: |-
      *elektronische kopie:* elektronische kopie als bedoeld in [artikel 4, derde lid, van de wet][ref1] die is voorzien
      van een gekwalificeerde elektronische handtekening van de notaris die voldoet aan de daaraan bij of krachtens
      Verordening (EU) nr. 910/2014 van het Europees Parlement en de Raad van 23 juli 2014 betreffende elektronische
      identificatie en vertrouwensdiensten voor elektronische transacties in de interne markt en tot intrekking
      van [Richtlijn 1999/93/EG](31999L0093) (PbEU 2014, L 257) gestelde eisen en aan de daartoe door de KNB, in
      overeenstemming met de Belastingdienst, opgestelde richtlijnen;


      [ref1]: https://wetten.overheid.nl/BWBR0002739#Artikel4
    url: https://wetten.overheid.nl/BWBR0034017/2026-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002739
        artikel: '4'
  - number: 1.i
    text: |-
      *elektronische kopie van een annex:* elektronische kopie van een aan een notariële akte gehecht stuk als bedoeld in
      [artikel 7b van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002739#Artikel7b
    url: https://wetten.overheid.nl/BWBR0034017/2026-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002739
        artikel: 7b
  - number: 1.j
    text: |-
      *RSIN:* rechtspersonen en samenwerkingsverbanden informatienummer dat door de Kamer van Koophandel wordt verstrekt
      bij inschrijving van rechtspersonen en samenwerkingsverbanden in het handelsregister.
    url: https://wetten.overheid.nl/BWBR0034017/2026-01-01#Artikel1
  - number: '2.1'
    text: |-
      Het register bevat een elektronisch afschrift van elke ter registratie aangeboden akte als bedoeld in de
      [artikelen 3][ref1] en [4 van de wet][ref2] of een elektronische kopie van iedere ter registratie aangeboden akte
      als bedoeld in artikel 4, derde lid, van de wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002739#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002739#Artikel4
    url: https://wetten.overheid.nl/BWBR0034017/2026-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002739
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0002739
        artikel: '4'
  - number: '2.2'
    text: |-
      De registratie, bedoeld in [artikel 1, tweede lid, onderdeel a, van de wet][ref1], en de vermelding van
      de gegevens, bedoeld in het derde lid, geschieden overeenkomstig de door de KNB, in overeenstemming met de
      Belastingdienst, daartoe opgestelde richtlijnen.


      [ref1]: https://wetten.overheid.nl/BWBR0002739#Artikel1
    url: https://wetten.overheid.nl/BWBR0034017/2026-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002739
        artikel: '1'
  - number: '2.3'
    text: |-
      Het opvragen en aanbieden van een elektronische kopie van een annex geschiedt overeenkomstig de door de KNB, in
      overeenstemming met de Belastingdienst, daartoe opgestelde richtlijnen.
    url: https://wetten.overheid.nl/BWBR0034017/2026-01-01#Artikel2
  - number: '2.4'
    text: |-
      Bij de registratie van een akte, bedoeld in [artikel 4, eerste lid, van de wet][ref1], worden ten minste de
      gegevens, bedoeld in [artikel 3, eerste lid, onderdelen a tot en met f][ref2], vermeld, met uitzondering van de
      woonplaats.


      [ref1]: https://wetten.overheid.nl/BWBR0002739#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0034017#Artikel3
    url: https://wetten.overheid.nl/BWBR0034017/2026-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002739
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0034017
        artikel: '3'
        hoofdstuk: '2'
  - number: '2.5'
    text: |-
      De notaris ontvangt ter bevestiging van de registratie van een akte een elektronisch ontvangstbericht met de datum
      van de registratie van die akte.
    url: https://wetten.overheid.nl/BWBR0034017/2026-01-01#Artikel2
  - number: '2.6'
    text: De gegevens in het register en het repertorium betreffende een notariële akte worden ten minste 31 jaar bewaard.
    url: https://wetten.overheid.nl/BWBR0034017/2026-01-01#Artikel2
  - number: '3.1'
    text: |-
      De inschrijving door de notaris, bedoeld in [artikel 7 van de wet][ref1], in het repertorium omvat voor elke akte
      ten minste:


      [ref1]: https://wetten.overheid.nl/BWBR0002739#Artikel7
    url: https://wetten.overheid.nl/BWBR0034017/2026-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002739
        artikel: '7'
  - number: 3.1.a
    text: een doorlopend volgnummer;
    url: https://wetten.overheid.nl/BWBR0034017/2026-01-01#Artikel3
  - number: 3.1.b
    text: de dagtekening van de akte;
    url: https://wetten.overheid.nl/BWBR0034017/2026-01-01#Artikel3
  - number: 3.1.c
    text: de soort van de akte;
    url: https://wetten.overheid.nl/BWBR0034017/2026-01-01#Artikel3
  - number: 3.1.d
    text: 'van ten minste een van de bij de akte optredende partijen:'
    url: https://wetten.overheid.nl/BWBR0034017/2026-01-01#Artikel3
  - number: 3.1.d.1°
    text: 'bij natuurlijke personen: de naam, met inbegrip van de voornamen, en de woonplaats;'
    url: https://wetten.overheid.nl/BWBR0034017/2026-01-01#Artikel3
  - number: 3.1.d.2°
    text: 'bij niet-natuurlijke personen: de statutaire naam en de woonplaats;'
    url: https://wetten.overheid.nl/BWBR0034017/2026-01-01#Artikel3
  - number: 3.1.e
    text: de vermelding of het een in minuut dan wel in originali verleden akte betreft;
    url: https://wetten.overheid.nl/BWBR0034017/2026-01-01#Artikel3
  - number: 3.1.f
    text: het aantal renvooien en het aantal annexen.
    url: https://wetten.overheid.nl/BWBR0034017/2026-01-01#Artikel3
  - number: '3.2'
    text: |-
      De notaris schrijft de door hem verleden akten dagelijks in het repertorium in, uiterlijk de dag nadat een akte is
      verleden. De [artikelen 1][ref1] en [3 van de Algemene termijnenwet][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002448#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002448#Artikel3
    url: https://wetten.overheid.nl/BWBR0034017/2026-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002448
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002448
        artikel: '3'
  - number: '3.3'
    text: Doorhalingen in het repertorium blijven zichtbaar. Een volgnummer dat is doorgehaald, wordt niet opnieuw gebruikt.
    url: https://wetten.overheid.nl/BWBR0034017/2026-01-01#Artikel3
  - number: '3.4'
    text: |-
      De inschrijving in het repertorium geschiedt overeenkomstig de daartoe door de KNB, in overeenstemming met de
      Belastingdienst, opgestelde richtlijnen.
    url: https://wetten.overheid.nl/BWBR0034017/2026-01-01#Artikel3
  - number: '3.5'
    text: |-
      De KNB legt de dagtekening van de registratie vast en draagt ervoor zorg dat deze door de notaris kan worden
      geraadpleegd.
    url: https://wetten.overheid.nl/BWBR0034017/2026-01-01#Artikel3
  - number: '3.6'
    text: |-
      In afwijking van het eerste lid, onderdeel d, worden in geval van een proces-verbaal-akte als bedoeld in
      [artikel 37 van de Wet op het notarisambt][ref1] de gegevens, bedoeld in het eerste lid, onderdeel d, onder 1° en
      2°, van ten minste een van de bij de inhoud belanghebbende personen of rechtspersonen vermeld in plaats van die
      gegevens van een bij de akte optredende partij.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel37
    url: https://wetten.overheid.nl/BWBR0034017/2026-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '37'
  - number: '4.1'
    text: |-
      De notaris doet aangifte overdrachtsbelasting als bedoeld in
      [artikel 21a van de Uitvoeringsregeling Algemene wet inzake rijksbelastingen 1994][ref1], via de KNB bij de
      inspecteur door registratie van de akte, bedoeld in [artikel 3 van de wet][ref2], en indien van toepassing het
      aanbieden van de verklaring, bedoeld in [artikel 15a van de Wet op belastingen van rechtsverkeer][ref3], alsmede
      door het insturen van een of meerdere elektronische berichten overeenkomstig de door de KNB, in overeenstemming met
      de Belastingdienst, daartoe opgestelde richtlijnen, het bericht omvat ten minste de volgende gegevens:


      [ref1]: https://wetten.overheid.nl/BWBR0006736#Artikel21a
      [ref2]: https://wetten.overheid.nl/BWBR0002739#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0002740#Artikel15a
    url: https://wetten.overheid.nl/BWBR0034017/2026-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0006736
        artikel: 21a
      - id: ref2
        bwb_id: BWBR0002739
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0002740
        artikel: 15a
  - number: 4.1.a
    text: het burgerservicenummer of het RSIN van iedere verkrijger;
    url: https://wetten.overheid.nl/BWBR0034017/2026-01-01#Artikel4
  - number: 4.1.b
    text: het verschuldigde bedrag;
    url: https://wetten.overheid.nl/BWBR0034017/2026-01-01#Artikel4
  - number: 4.1.c
    text: het tarief dat wordt toegepast, voor iedere verkrijger afzonderlijk;
    url: https://wetten.overheid.nl/BWBR0034017/2026-01-01#Artikel4
  - number: 4.1.d
    text: de maatstaf van heffing per toegepast tarief;
    url: https://wetten.overheid.nl/BWBR0034017/2026-01-01#Artikel4
  - number: 4.1.e
    text: de vermelding of sprake is van meegeleverde roerende zaken;
    url: https://wetten.overheid.nl/BWBR0034017/2026-01-01#Artikel4
  - number: 4.1.f
    text: |-
      de vermelding voor iedere verkrijger afzonderlijk of een beroep op een vrijstelling wordt gedaan onder verwijzing
      naar de bepaling van de vrijstelling waarop een beroep wordt gedaan;
    url: https://wetten.overheid.nl/BWBR0034017/2026-01-01#Artikel4
  - number: 4.1.g
    text: |-
      indien een beroep wordt gedaan op [artikel 14, tweede of derde lid, van de Wet op belastingen van rechtsverkeer][ref1]
      de adresgegevens van het verkregen object;


      [ref1]: https://wetten.overheid.nl/BWBR0002740#Artikel14
    url: https://wetten.overheid.nl/BWBR0034017/2026-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002740
        artikel: '14'
  - number: 4.1.h
    text: |-
      indien een beroep wordt gedaan op
      [artikel 15, eerste lid, onderdeel p, van de Wet op belastingen van rechtsverkeer][ref1] de adresgegevens
      en het totaal van de waarde van de woning of rechten waaraan deze is onderworpen en tot die woning behorende
      aanhorigheden.


      [ref1]: https://wetten.overheid.nl/BWBR0002740#Artikel15
    url: https://wetten.overheid.nl/BWBR0034017/2026-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002740
        artikel: '15'
  - number: '4.2'
    text: |-
      Als tijdstip van het doen van aangifte overdrachtsbelasting bij de inspecteur geldt het tijdstip waarop het
      elektronische afschrift en het elektronische bericht de KNB hebben bereikt. Als tijdstip van ontvangst door de
      inspecteur van de berichten inzake de overdrachtsbelasting waarmee een aangifte wordt gecorrigeerd, waarmee bezwaar
      wordt gemaakt of waarmee een verzoek wordt ingediend, geldt het tijdstip waarop dat bericht de KNB heeft bereikt.
      De inzending van de berichten, bedoeld in de eerste en tweede volzin, geschiedt overeenkomstig de door de KNB, in
      overeenstemming met de Belastingdienst, daartoe opgestelde richtlijnen.
    url: https://wetten.overheid.nl/BWBR0034017/2026-01-01#Artikel4
  - number: '4.3'
    text: |-
      De KNB draagt zorg voor onverwijlde doorzending van het elektronische bericht, bedoeld in het eerste lid,
      en de berichten, bedoeld in het tweede lid, op de wijze zoals is vastgesteld in overleg tussen de KNB en de
      Belastingdienst waarbij bij verzending van het elektronische bericht een verwijzing wordt opgenomen naar de
      desbetreffende akte.
    url: https://wetten.overheid.nl/BWBR0034017/2026-01-01#Artikel4
  - number: '5'
    text: |-
      De notaris draagt ervoor zorg dat de elektronische middelen waarmee hij toegang heeft tot het register en het
      repertorium en waarmee hij de gegevens verstrekt ten behoeve van de aangifte overdrachtsbelasting voldoen aan de
      daarvoor door de KNB gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0034017/2026-01-01#Artikel5
  - number: '6'
    text: |-
      De KNB draagt zorg voor onverwijlde doorzending van de gegevens, bedoeld in de [artikelen 7a, eerste lid][ref1],
      en [7b, eerste lid, van de wet][ref2], op de wijze zoals is vastgesteld in overleg tussen de KNB en de
      Belastingdienst.


      [ref1]: https://wetten.overheid.nl/BWBR0002739#Artikel7a
      [ref2]: https://wetten.overheid.nl/BWBR0002739#Artikel7b
    url: https://wetten.overheid.nl/BWBR0034017/2026-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002739
        artikel: 7a
      - id: ref2
        bwb_id: BWBR0002739
        artikel: 7b
  - number: '7'
    text: |-
      De verplichtingen van notarissen, genoemd in de [wet][ref1], gelden jegens iedere inspecteur.


      [ref1]: https://wetten.overheid.nl/BWBR0002739
    url: https://wetten.overheid.nl/BWBR0034017/2026-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002739
  - number: '8'
    text: |-
      De KNB kan beschikken over gegevens uit het repertorium indien dat noodzakelijk is voor het voldoen aan haar
      wettelijke taken. De KNB draagt zorg voor het onderhoud van het register en het repertorium.
    url: https://wetten.overheid.nl/BWBR0034017/2026-01-01#Artikel8
  - number: '9'
    text: |-
      Van een akte als bedoeld in [artikel 42 van de Wet op het notarisambt][ref1], die niet is verleden in de
      Nederlandse taal, doet de inspecteur de vordering, bedoeld in [artikel 6, tweede lid, van de wet][ref2], bij
      aangetekend schrijven aan de notaris blijken. Indien niet of niet tijdig aan de vordering wordt voldaan, stelt de
      inspecteur de KNB hiervan op de hoogte.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0002739#Artikel6
    url: https://wetten.overheid.nl/BWBR0034017/2026-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '42'
      - id: ref2
        bwb_id: BWBR0002739
        artikel: '6'
  - number: '10'
    text: |-
      De registratie door de inspecteur van een in de Friese of in een vreemde taal opgemaakte akte als bedoeld in
      [artikel 1, tweede lid, onderdeel b, van de wet][ref1], geschiedt in de Nederlandse taal.


      [ref1]: https://wetten.overheid.nl/BWBR0002739#Artikel1
    url: https://wetten.overheid.nl/BWBR0034017/2026-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002739
        artikel: '1'
  - number: '11'
    text: |-
      De registers, bedoeld in [artikel 1, tweede lid, onderdeel b, van de wet][ref1], worden gehouden door de
      algemeen directeur van het organisatieonderdeel Belastingdienst/Centrale administratieve processen, bedoeld in
      [artikel 3, eerste lid, onderdeel c, van de Uitvoeringsregeling Belastingdienst 2003][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002739#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0014506#Artikel3
    url: https://wetten.overheid.nl/BWBR0034017/2026-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002739
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0014506
        artikel: '3'
  - number: '12.1'
    text: |-
      De aanbieding ter registratie van akten als bedoeld in [artikel 1, tweede lid, onderdeel b, van de wet][ref1],
      geschiedt bij de inspecteur, bedoeld in [artikel 11][ref2], bij het daartoe door de Belastingdienst opengestelde
      kantoor.


      [ref1]: https://wetten.overheid.nl/BWBR0002739#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0034017#Artikel11
    url: https://wetten.overheid.nl/BWBR0034017/2026-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002739
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0034017
        artikel: '11'
        hoofdstuk: '3'
  - number: '12.2'
    text: |-
      Het kantoor, bedoeld in het eerste lid, is voor het aanbieden van de akten ter registratie dagelijks van 9.00 uur
      tot 17.00 uur geopend, met uitzondering van de zaterdag, de zondag, algemeen erkende feestdagen in de zin van de
      [Algemene termijnenwet][ref1] en de bij of krachtens [artikel 3 van die wet][ref2] daarmee gelijkgestelde dagen.


      [ref1]: https://wetten.overheid.nl/BWBR0002448
      [ref2]: https://wetten.overheid.nl/BWBR0002448#Artikel3
    url: https://wetten.overheid.nl/BWBR0034017/2026-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002448
      - id: ref2
        bwb_id: BWBR0002448
        artikel: '3'
  - number: '13.1'
    text: |-
      Akten als bedoeld in [artikel 1, tweede lid, onderdeel b, van de wet][ref1] worden door de inspecteur geregistreerd
      in het register Registratie Onderhandse Akten.


      [ref1]: https://wetten.overheid.nl/BWBR0002739#Artikel1
    url: https://wetten.overheid.nl/BWBR0034017/2026-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002739
        artikel: '1'
  - number: '13.2'
    text: |-
      In het register Registratie wordt boven de eerste registratie betreffende de op eenzelfde dag aan de inspecteur
      aangeboden akten de datum van aanbieding vermeld en wel – met uitzondering van het jaartal – in letters.
    url: https://wetten.overheid.nl/BWBR0034017/2026-01-01#Artikel13
  - number: '14'
    text: |-
      De registratie in het register Registratie, bedoeld in [artikel 13][ref1], omvat voor elke akte als bedoeld in
      [artikel 1, tweede lid, onderdeel b, van de wet][ref2] ten minste de volgende gegevens:


      [ref1]: https://wetten.overheid.nl/BWBR0034017#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0002739#Artikel1
    url: https://wetten.overheid.nl/BWBR0034017/2026-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0034017
        artikel: '13'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0002739
        artikel: '1'
  - number: 14.a
    text: een per registerdeel doorlopend volgnummer;
    url: https://wetten.overheid.nl/BWBR0034017/2026-01-01#Artikel14
  - number: 14.b
    text: de naam van de akte;
    url: https://wetten.overheid.nl/BWBR0034017/2026-01-01#Artikel14
  - number: 14.c
    text: 'van ten minste een van de bij de akte optredende partijen:'
    url: https://wetten.overheid.nl/BWBR0034017/2026-01-01#Artikel14
  - number: 14.c.1°
    text: 'bij natuurlijke personen: de naam, met inbegrip van de voornamen, en de woonplaats;'
    url: https://wetten.overheid.nl/BWBR0034017/2026-01-01#Artikel14
  - number: 14.c.2°
    text: 'bij niet-natuurlijke personen: de statutaire naam en de woonplaats;'
    url: https://wetten.overheid.nl/BWBR0034017/2026-01-01#Artikel14
  - number: 14.d
    text: het aantal exemplaren van de akte dat tegelijk ter registratie is aangeboden;
    url: https://wetten.overheid.nl/BWBR0034017/2026-01-01#Artikel14
  - number: 14.e
    text: het aantal bladen van de akte;
    url: https://wetten.overheid.nl/BWBR0034017/2026-01-01#Artikel14
  - number: 14.f
    text: het aantal renvooien en het aantal annexen.
    url: https://wetten.overheid.nl/BWBR0034017/2026-01-01#Artikel14
  - number: '15'
    text: |-
      Ingeval een akte als bedoeld in [artikel 1, tweede lid, onderdeel b, van de wet][ref1] niet of niet door alle
      daarin als ondertekenaren aangeduide personen is ondertekend, wordt dit bij de registratie vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0002739#Artikel1
    url: https://wetten.overheid.nl/BWBR0034017/2026-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002739
        artikel: '1'
  - number: '16'
    text: |-
      Tegelijk ter registratie aangeboden gelijksoortige akten als bedoeld in
      [artikel 1, tweede lid, onderdeel b, van de wet][ref1], die door dezelfde persoon zijn aangeboden, kunnen tezamen
      worden geregistreerd onder een aantal volgnummers dat overeenkomt met het aantal akten. In dat geval worden de
      gegevens, bedoeld in [artikel 14][ref2], slechts eenmaal vermeld, voor zover deze voor de verschillende akten
      gelijk zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0002739#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0034017#Artikel14
    url: https://wetten.overheid.nl/BWBR0034017/2026-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0002739
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0034017
        artikel: '14'
        hoofdstuk: '3'
  - number: '17'
    text: |-
      Bij de registratie van een akte als bedoeld in [artikel 1, tweede lid, onderdeel b, van de wet][ref1] worden door
      de inspecteur:


      [ref1]: https://wetten.overheid.nl/BWBR0002739#Artikel1
    url: https://wetten.overheid.nl/BWBR0034017/2026-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0002739
        artikel: '1'
  - number: 17.a
    text: de in de akte aangebrachte renvooien gewaarmerkt;
    url: https://wetten.overheid.nl/BWBR0034017/2026-01-01#Artikel17
  - number: 17.b
    text: 'genummerd en gewaarmerkt:'
    url: https://wetten.overheid.nl/BWBR0034017/2026-01-01#Artikel17
  - number: 17.b.1°
    text: de bladen van uit meer bladen bestaande akten;
    url: https://wetten.overheid.nl/BWBR0034017/2026-01-01#Artikel17
  - number: 17.b.2°
    text: de annexen.
    url: https://wetten.overheid.nl/BWBR0034017/2026-01-01#Artikel17
  - number: '18.1'
    text: |-
      De inspecteur stelt ten blijke van de registratie van een akte als bedoeld in
      [artikel 1, tweede lid, onderdeel b, van de wet][ref1] op het eerste blad van de akte of, indien meer exemplaren
      van de akte tegelijk ter registratie zijn aangeboden, op de eerste bladen van alle exemplaren een door hem
      ondertekende verklaring van registratie.


      [ref1]: https://wetten.overheid.nl/BWBR0002739#Artikel1
    url: https://wetten.overheid.nl/BWBR0034017/2026-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0002739
        artikel: '1'
  - number: '18.2'
    text: 'In de verklaring worden vermeld:'
    url: https://wetten.overheid.nl/BWBR0034017/2026-01-01#Artikel18
  - number: 18.2.a
    text: de plaats en dagtekening van de registratie;
    url: https://wetten.overheid.nl/BWBR0034017/2026-01-01#Artikel18
  - number: 18.2.b
    text: het nummer van het registerdeel waarin, alsmede het volgnummer waaronder de registratie heeft plaatsgehad;
    url: https://wetten.overheid.nl/BWBR0034017/2026-01-01#Artikel18
  - number: 18.2.c
    text: |-
      het aantal exemplaren van de akte dat tegelijk ter registratie is aangeboden, indien dat aantal meer dan een
      bedraagt;
    url: https://wetten.overheid.nl/BWBR0034017/2026-01-01#Artikel18
  - number: 18.2.d
    text: het aantal renvooien en het aantal annexen;
    url: https://wetten.overheid.nl/BWBR0034017/2026-01-01#Artikel18
  - number: 18.2.e
    text: |-
      de omstandigheid, bedoeld in [artikel 15][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0034017#Artikel15
    url: https://wetten.overheid.nl/BWBR0034017/2026-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0034017
        artikel: '15'
        hoofdstuk: '3'
  - number: '18.3'
    text: De dagtekening van de registratie wordt – met uitzondering van de eeuw – in letters gesteld.
    url: https://wetten.overheid.nl/BWBR0034017/2026-01-01#Artikel18
  - number: '18.4'
    text: |-
      Voor zover voor het stellen van de verklaring op de akte geen voldoende open ruimte is, wordt zij gesteld op een
      aan de akte te hechten vel papier.
    url: https://wetten.overheid.nl/BWBR0034017/2026-01-01#Artikel18
  - number: '19'
    text: |-
      De inspecteur wordt tevens aangewezen als inspecteur van de rijksbelastingen, bedoeld in
      [artikel 6, tweede lid, van de Wet op het centraal testamentenregister][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003080#Artikel6
    url: https://wetten.overheid.nl/BWBR0034017/2026-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0003080
        artikel: '6'
  - number: '21'
    text: |-
      Als kosten als bedoeld in [artikel 13a, tweede lid, van de wet][ref1] komen voor vergoeding in aanmerking de
      werkelijk gemaakte kosten op basis van nacalculatie door of ten laste van de KNB die noodzakelijk zijn ten
      behoeve van de uitoefening van de in de [wet][ref2] aan de KNB opgedragen taken zoals deze tussen de KNB en de
      Belastingdienst zijn vastgesteld dan wel op verzoek van beide partijen door een onafhankelijke ter zake deskundige
      derde partij. Vijf jaren na eerste ingebruikname van het door de KNB, in overeenstemming met de Belastingdienst, te
      ontwikkelen systeem van registratie langs elektronische weg, vindt een evaluatie van de wet, haar uitvoering en dit
      systeem van vergoeding plaats.


      [ref1]: https://wetten.overheid.nl/BWBR0002739#Artikel13a
      [ref2]: https://wetten.overheid.nl/BWBR0002739
    url: https://wetten.overheid.nl/BWBR0034017/2026-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0002739
        artikel: 13a
      - id: ref2
        bwb_id: BWBR0002739
  - number: '22'
    text: |-
      Tot de datum, bedoeld in [artikel V, eerste lid, van de Wet elektronische registratie notariële akten][ref1],
      blijven met betrekking tot akten van notarissen, het repertorium en de aangifte
      overdrachtsbelasting de [Uitvoeringsbeschikking Registratiewet 1970][ref2] en
      [artikel 21a, eerste lid, van de Uitvoeringsregeling Algemene wet inzake rijksbelastingen 1994][ref3] van
      toepassing zoals deze luidden onmiddellijk voorafgaande aan de inwerkingtreding van deze regeling. Indien ten
      aanzien van een notaris een beschikking is genomen als bedoeld in artikel V, tweede lid, van de Wet elektronische
      registratie notariële akten, treedt de in die beschikking vermelde datum in de plaats van de datum, bedoeld in de
      eerste volzin.


      [ref1]: https://wetten.overheid.nl/BWBR0032526#ArtikelV
      [ref2]: https://wetten.overheid.nl/BWBR0002772
      [ref3]: https://wetten.overheid.nl/BWBR0006736#Artikel21a
    url: https://wetten.overheid.nl/BWBR0034017/2026-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0032526
        artikel: V
      - id: ref2
        bwb_id: BWBR0002772
      - id: ref3
        bwb_id: BWBR0006736
        artikel: 21a
  - number: '23'
    text: |-
      De [Uitvoeringsbeschikking Registratiewet 1970][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0002772
    url: https://wetten.overheid.nl/BWBR0034017/2026-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0002772
  - number: '24'
    text: |-
      Deze regeling treedt in werking met ingang van de dag na de datum van uitgifte van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0034017/2026-01-01#Artikel24
  - number: '25.1'
    text: 'Deze regeling wordt aangehaald als: Uitvoeringsregeling Registratiewet 1970.'
    url: https://wetten.overheid.nl/BWBR0034017/2026-01-01#Artikel25
  - number: '25.2'
    text: Deze regeling zal met de toelichting in de Staatscourant worden geplaatst.
    url: https://wetten.overheid.nl/BWBR0034017/2026-01-01#Artikel25
