---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_incasso_boeten_en_onverschuldigde_betalingen_werkgevers
regulatory_layer: WET
publication_date: '2009-06-29'
valid_from: '1996-10-23'
bwb_id: BWBR0008272
url: https://wetten.overheid.nl/BWBR0008272/1996-10-23
preamble:
  text: |-
    Gelet op artikel 38, vierde lid, in samenhang met artikel 45c, derde lid, van de Ziektewet en artikel 71a, vijfde
    lid, in samenhang met artikel 29c, derde lid, en artikel 62, zevende lid, in samenhang met artikel 57b van de Wet
    op de arbeidsongeschiktheidsverzekering en artikel 48b van de Algemene Arbeidsongeschiktheidswet;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0008272/1996-10-23#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

            a
            de ZW:

              de Ziektewet;



            b
            de WAO:

              de Wet op de arbeidsongeschiktheidsverzekering;



            c
            de AAW:

              de Algemene Arbeidsongeschiktheidswet;



            d
            de boete:

              de boete, bedoeld in artikel 38, vierde lid, van de ZW en artikel 71a, tweede en derde lid, van de WAO;



            e
            de loonkostensubsidie:

              de subsidie, bedoeld in artikel 62 van de WAO;



            f
            voorziening:

              de voorziening bedoeld in artikel 57a van de AAW;



            g
            de vordering:

              het bedrag dat als boete is opgelegd;
      het bedrag van de loonkostensubsidie, dat wordt teruggevorderd op grond van artikel 62 vijfde en zesde lid, van
      de WAO;
      het bedrag van de voorziening, dat wordt teruggevorderd op grond van artikel 48 van de AAW;



            h
            de wettelijke rente en de kosten van invordering:

              de wettelijke rente en de op de invordering betrekking hebbende kosten, bedoeld in artikel 45g, zevende
      lid, van de ZW, 29g, zevende lid, van de WAO en 20g, zevende lid, van de AAW;



            i
            de werkgever:

              degene aan wie de boete is opgelegd of degene van wie een bedrag wordt teruggevorderd.
    url: https://wetten.overheid.nl/BWBR0008272/1996-10-23#Artikel1
  - number: '2'
    text: |-
      De bedrijfsvereniging stelt de termijnen vast waarbinnen de vordering wordt betaald of verrekend met inachtneming
      van dit besluit.
    url: https://wetten.overheid.nl/BWBR0008272/1996-10-23#Artikel2
  - number: '3.1'
    text: De bedrijfsvereniging beslist dat de werkgever de vordering binnen zes weken voldoet.
    url: https://wetten.overheid.nl/BWBR0008272/1996-10-23#Artikel3
  - number: '3.2'
    text: |-
      In afwijking van het eerste lid kan de bedrijfsvereniging betaling binnen ten hoogste 12 maanden toestaan, indien
      de werkgever hierom binnen zes weken na afgifte van de beslissing, bedoeld in het eerste lid, schriftelijk verzoekt
      en aantoont dat hij niet in staat is de vordering binnen zes weken te voldoen.
    url: https://wetten.overheid.nl/BWBR0008272/1996-10-23#Artikel3
  - number: '3.3'
    text: |-
      . De bedrijfsvereniging kan de vastgestelde termijnen herzien wegens gewijzigde omstandigheden met inachtneming van
      dit besluit.
    url: https://wetten.overheid.nl/BWBR0008272/1996-10-23#Artikel3
  - number: '4'
    text: Indien de werkgever op enig tijdstip niet volgens de vastgestelde termijnen betaalt,
    url: https://wetten.overheid.nl/BWBR0008272/1996-10-23#Artikel4
  - number: '4.1'
    text: wordt het bedrag van de vordering voorzover niet afgelost opeisbaar;
    url: https://wetten.overheid.nl/BWBR0008272/1996-10-23#Artikel4
  - number: '4.2'
    text: |-
      verrekent de bedrijfsvereniging de vordering voorzover niet afgelost, eventueel vermeerderd met de wettelijke
      rente en de kosten van invordering, waar mogelijk met de door de bedrijfsvereniging aan de werkgever verschuldigde
      bedragen.
    url: https://wetten.overheid.nl/BWBR0008272/1996-10-23#Artikel4
  - number: '5.1'
    text: |-
      De wettelijke rente en de kosten van invordering zijn verschuldigd vanaf het tijdstip dat de termijn is verstreken
      waarbinnen de vordering voorzover niet afgelost moest worden betaald.
    url: https://wetten.overheid.nl/BWBR0008272/1996-10-23#Artikel5
  - number: '5.2'
    text: 'De op de invordering betrekking hebbende kosten bedragen:'
    url: https://wetten.overheid.nl/BWBR0008272/1996-10-23#Artikel5
  - number: 5.2.a
    text: 15% van de vordering voorzover niet afgelost, doch ten minste f100,- en ten hoogste f 1500,- alsmede
    url: https://wetten.overheid.nl/BWBR0008272/1996-10-23#Artikel5
  - number: 5.2.b
    text: |-
      de kosten van berekening en gerechtelijke tenuitvoerlegging, zoals vastgesteld bij of krachtens de Wet tarieven in
      burgerlijke zaken.
    url: https://wetten.overheid.nl/BWBR0008272/1996-10-23#Artikel5
  - number: '6'
    text: |-
      In geval de toepassing van dit besluit leidt tot een kennelijke hardheid is de bedrijfsvereniging bevoegd van het
      gestelde in dit besluit af te wijken.
    url: https://wetten.overheid.nl/BWBR0008272/1996-10-23#Artikel6
  - number: '7'
    text: |-
      Dit besluit treedt in werking op het tijdstip waarop de Wet van 25 april 1996 tot wijziging van de sociale
      zekerheidswetten in verband met de nadere vaststelling van een stelsel van administratieve sancties, alsook tot
      wijziging van de daarin vervatte regels tot terugvordering van ten onrechte betaalde uitkeringen en de invordering
      daarvan (wet boeten, maatregelen en terug- en invordering sociale zekerheid; Stb. 1996, 248) in werking treedt.
      Indien dit besluit na inwerkingtreding van genoemde wet wordt bekend gemaakt in de Staatscourant, treedt dit
      besluit in werking met ingang van de tweede dag na dagtekening van de Staatscourant waarin het wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0008272/1996-10-23#Artikel7
  - number: '8'
    text: 'Dit besluit wordt aangehaald als: Besluit incasso boeten en onverschuldigde betalingen werkgevers.'
    url: https://wetten.overheid.nl/BWBR0008272/1996-10-23#Artikel8
