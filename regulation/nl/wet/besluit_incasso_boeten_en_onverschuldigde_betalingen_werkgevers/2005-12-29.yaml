    Besluit:
  url: https://wetten.overheid.nl/BWBR0008272/2005-12-29#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. UWV: Uitvoeringsinstituut werknemersverzekeringen, genoemd in
      [hoofdstuk 5 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1];

      b. ZW: [Ziektewet][ref2];

      c. Wet WIA: [Wet werk en inkomen naar arbeidsvermogen][ref3];

      d. WAO: [Wet op de arbeidsongeschiktheidsverzekering][ref4];

      e. boete: de boete bedoeld in[ artikel 38, vierde lid][ref5], de boete bedoeld in [artikel 38a, zesde lid][ref6] en
      de boete bedoeld in [artikel 63, negende lid, van de ZW][ref7];

      f. verhaalde bedrag: het bedrag dat het UWV op de werkgever of eigenrisicodrager verhaalt op grond
      van [artikel 39a, eerste lid][ref8] of [artikel 63a, derde, vierde of vijfde lid, van de ZW][ref9],
      [artikel 71, tweede lid][ref10], [artikel 75a, vierde lid][ref11], [75b, zevende lid][ref12], of
      [75f, eerste lid, van de WAO][ref13],[ artikel 72, tweede lid][ref14], [83, derde lid][ref15] of
      [artikel 84, tweede of vierde lid, van de Wet WIA][ref16];

      g. vordering:

      1°. het bedrag dat als boete is opgelegd;

      2°. het bedrag van een aan de werkgever verstrekt reïntegratie-instrument dat wordt teruggevorderd op grond van
      [artikel 77 van de Wet WIA][ref17];

      3°. het verhaalde bedrag;

      h. wettelijke rente en de kosten van invordering: de wettelijke rente en de op de invordering betrekking hebbende
      kosten bedoeld in [artikel 45g, zevende lid, van de ZW][ref18], [artikel 29g, zesde lid, van de WAO][ref19]
      en[ 96, zesde lid, van de Wet WIA][ref20];

      i. werkgever: de werkgever of eigenrisicodrager aan wie de boete is opgelegd, van wie een bedrag wordt
      teruggevorderd of op wie een bedrag wordt verhaald.


