  - number: '2'
    text: Het UWV stelt de termijn waarbinnen de vordering moet worden betaald of verrekend op zes weken.
    url: https://wetten.overheid.nl/BWBR0008272/2005-12-29#Artikel2
  - number: '3'
    text: |-
      1 In afwijking van het bepaalde in [artikel 2][ref1] kan het UWV betaling binnen ten hoogste twaalf maanden
      toestaan, indien de werkgever hierom binnen zes weken na afgifte van de beschikking bedoeld in [artikel 2][ref2],
      schriftelijk verzoekt en aantoont dat hij niet in staat is de vordering binnen zes weken te voldoen.

      2 Het UWV kan de vastgestelde termijnen herzien wegens gewijzigde omstandigheden met inachtneming van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0008272#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0008272#Artikel2
    url: https://wetten.overheid.nl/BWBR0008272/2005-12-29#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0008272
        artikel: '2'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0008272
        artikel: '2'
        hoofdstuk: II
  - number: '4'
    text: |-
      Indien de werkgever op enig tijdstip niet volgens de vastgestelde termijnen betaalt,

      1. wordt het bedrag van de vordering voorzover niet afgelost opeisbaar;

      2. verrekent het UWV de vordering voorzover niet afgelost, eventueel vermeerderd met de wettelijke rente en de
      kosten van invordering, waar mogelijk met de door het UWV aan de werkgever verschuldigde bedragen.
    url: https://wetten.overheid.nl/BWBR0008272/2005-12-29#Artikel4
  - number: '5'
    text: |-
      1 De wettelijke rente en de kosten van invordering zijn verschuldigd vanaf het tijdstip dat de termijn is
      verstreken waarbinnen de vordering voorzover niet afgelost moest worden betaald.

      2 De op de invordering betrekking hebbende kosten bedragen:

      a. 15% van de vordering doch ten minste € 45 en ten hoogste € 681 alsmede

      b. de kosten van betekening en gerechtelijke tenuitvoerlegging, zoals vastgesteld bij of krachtens de
      [Wet tarieven in burgerlijke zaken][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001852
    url: https://wetten.overheid.nl/BWBR0008272/2005-12-29#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0001852
  - number: '6'
    text: |-
      In geval de toepassing van dit besluit leidt tot een kennelijke hardheid, kan van het gestelde in dit besluit
      worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0008272/2005-12-29#Artikel6
  - number: '7'
    text: |-
      Dit besluit treedt in werking op het tijdstip waarop de Wet van 25 april 1996 tot wijziging van de sociale
      zekerheidswetten in verband met de nadere vaststelling van een stelsel van administratieve sancties, alsook tot
      wijziging van de daarin vervatte regels tot terugvordering van ten onrechte betaalde uitkeringen en de invordering
      daarvan (wet boeten, maatregelen en terug- en invordering sociale zekerheid; Stb. 1996, 248) in werking treedt.
      Indien dit besluit na inwerkingtreding van genoemde wet wordt bekend gemaakt in de Staatscourant, treedt dit
      besluit in werking met ingang van de tweede dag na dagtekening van de Staatscourant waarin het wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0008272/2005-12-29#Artikel7
  - number: '8'
    text: 'Dit besluit wordt aangehaald als: Besluit incasso boeten en onverschuldigde betalingen werkgevers.'
    url: https://wetten.overheid.nl/BWBR0008272/2005-12-29#Artikel8
