        hoofdstuk: XIV
  - number: 69.4.a
    text: omtrent het beroepschrift uitsluitend schriftelijk opmerkingen kunnen worden gemaakt;
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel69
  - number: 69.4.b
    text: de mondelinge opmerkingen ten overstaan van een lid van de commissie worden gemaakt;
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel69
  - number: 69.4.c
    text: |-
      ingeval bij een ander persoon mondeling inlichtingen worden ingewonnen, betrokkenen uitsluitend in de gelegenheid
      worden gesteld schriftelijk de vragen op te geven die zij aan die persoon gesteld wensen te zien.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel69
  - number: '69.5'
    text: |-
      De commissie doet zo spoedig mogelijk uitspraak. Met betrekking tot de uitspraak zijn de
      [artikelen 65, tweede en vierde lid, en zevende lid][ref1], met uitzondering van de eerste volzin, en [66][ref2],
      met uitzondering van het vijfde lid, van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel65
      [ref2]: https://wetten.overheid.nl/BWBR0008765#Artikel66
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: '65'
        hoofdstuk: XIV
      - id: ref2
        bwb_id: BWBR0008765
        artikel: '66'
        hoofdstuk: XIV
  - number: '70.1'
    text: Het hoofd van de instelling draagt zorg dat uit en door de verpleegden een verpleegdenraad kan worden gekozen.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel70
  - number: '70.2'
    text: |-
      De verpleegdenraad heeft tot taak met het hoofd van de instelling in overleg te treden over alle algemene
      onderwerpen betreffende het leef- en woonklimaat van de instelling. Zowel de raad als het hoofd van de instelling
      kunnen deze onderwerpen in dat overleg aan de orde stellen.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel70
  - number: '70.3'
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld over de bevoegdheden, de samenstelling en de werkwijze van
      de verpleegdenraad.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel70
  - number: '71.1'
    text: |-
      De in de [hoofdstukken XII tot en met XVI][ref1] aan de ter beschikking gestelde of de verpleegde
      toekomende rechten kunnen, behoudens ingeval de beklag- of beroepscommissie of commissie als bedoeld in
      [artikel 69, tweede lid][ref2], van oordeel is dat zwaarwegende belangen van betrokkene zich daartegen verzetten,
      mede worden uitgeoefend door:


      [ref1]: https://wetten.overheid.nl/BWBR0008765#HoofdstukXII
      [ref2]: https://wetten.overheid.nl/BWBR0008765#Artikel69
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0008765
        hoofdstuk: XII
      - id: ref2
        bwb_id: BWBR0008765
        artikel: '69'
        hoofdstuk: XVI
  - number: 71.1.a
    text: de curator, indien betrokkene onder curatele is gesteld;
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel71
  - number: 71.1.b
    text: de mentor, indien ten behoeve van betrokkene een mentorschap is ingesteld;
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel71
  - number: 71.1.c
    text: de ouders of voogd, indien betrokkene minderjarig is.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel71
  - number: '71.2'
    text: |-
      Het hoofd van de instelling draagt zorg dat de in het eerste lid genoemde personen op deze rechten opmerkzaam
      worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel71
  - number: '84'
    text: |-
      De regels vastgesteld krachtens [artikel 37][ref1], zoals dit artikel gold vóór de inwerkingtreding van deze wet,
      worden geacht te zijn vastgesteld krachtens de toepasselijke bepalingen van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel37c
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 37c
  - number: '85'
    text: |-
      Onze Minister zendt binnen drie jaar na de inwerkingtreding van deze wet, en vervolgens telkens na vijf jaar, aan
      de Staten-Generaal een verslag over de doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel85
  - number: '86'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip. Bij koninklijk besluit kan een ander
      tijdstip worden vastgesteld waarop [de artikelen 12][ref1] en [74, onderdeel K][ref2], in werking treden.


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0008765#Artikel74
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: '12'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0008765
        artikel: '74'
        hoofdstuk: XVIIIA
  - number: '87'
    text: 'Deze wet kan worden aangehaald als: Beginselenwet verpleging ter beschikking gestelden.'
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel87
