      zover het hoofd van de instelling de desbetreffende beslissing zelf neemt onderscheidenlijk heeft genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0008765#Artikel54
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: '53'
        hoofdstuk: XII
      - id: ref2
        bwb_id: BWBR0008765
        artikel: '54'
        hoofdstuk: XII
  - number: '9'
    text: |-
      De Raad behandelt beroepschriften ingevolge de [hoofdstukken XV][ref1], [XVA][ref2] en [XVI][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0008765#HoofdstukXV
      [ref2]: https://wetten.overheid.nl/BWBR0008765#HoofdstukXVa
      [ref3]: https://wetten.overheid.nl/BWBR0008765#HoofdstukXVI
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0008765
        hoofdstuk: XV
      - id: ref2
        bwb_id: BWBR0008765
        hoofdstuk: XVa
      - id: ref3
        bwb_id: BWBR0008765
        hoofdstuk: XVI
  - number: '10.1'
    text: Bij elke instelling wordt door Onze Minister een commissie van toezicht ingesteld.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel10
  - number: '10.2'
    text: 'De commissie van toezicht heeft tot taak:'
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel10
  - number: 10.2.a
    text: |-
      toezicht te houden op de wijze van tenuitvoerlegging van vrijheidsbenemende straffen en maatregelen in de
      instelling en het vervoer uitgevoerd door de instelling;
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel10
  - number: 10.2.b
    text: |-
      kennis te nemen van de door verpleegden naar voren gebrachte grieven en zonodig ter zake tussen een verpleegde en
      het hoofd van de instelling te bemiddelen;
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel10
  - number: 10.2.c
    text: |-
      zorg te dragen voor de behandeling van klaagschriften ingevolge het bepaalde in [hoofdstuk XIV][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008765#HoofdstukXIV
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0008765
        hoofdstuk: XIV
  - number: 10.2.d
    text: aan Onze Minister, de Raad en het bestuur advies en inlichtingen te geven omtrent het onder *a* gestelde.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel10
  - number: '10.3'
    text: |-
      Indien het advies of de inlichtingen een private instelling met een bijzondere aanwijzing als bedoeld in
      [artikel 3.3, eerste lid, van de Wet forensische zorg][ref1] betreffen en zijn bestemd voor Onze Minister of de
      Raad, voegt de commissie de desbetreffende opmerkingen van het betrokken bestuur daarbij, tenzij naar het oordeel
      van Onze Minister of de commissie bijzondere spoed geboden is dan wel het bestuur zijn opmerkingen naar het oordeel
      van de commissie niet binnen een redelijke termijn op schrift heeft gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0040634#Artikel3
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0040634
        artikel: '3'
  - number: '10.4'
    text: |-
      De commissie stelt zich door persoonlijk contact met de verpleegden regelmatig op de hoogte van onder hen levende
      wensen en gevoelens. Bij toerbeurt treedt één van haar leden hiertoe op als maandcommissaris.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel10
  - number: '10.5'
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld over de bevoegdheden, de samenstelling en de werkwijze van
      de commissie, de benoeming en het ontslag van haar leden alsmede over de werkzaamheden van de maandcommissaris.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel10
  - number: '11'
    text: Onze Minister kan nadere regels stellen omtrent de wijze waarop het vervoer van de verpleegde plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel11
  - number: '12.1'
    text: Er is een commissie van toezicht voor het vervoer, die door Onze Minister is ingesteld.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel12
  - number: '12.2'
    text: 'De commissie van toezicht voor het vervoer heeft tot taak:'
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel12
  - number: 12.2.a
    text: toezicht te houden op de uitvoering van het vervoer van verpleegden door Onze Minister;
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel12
  - number: 12.2.b
    text: kennis te nemen van door de verpleegde naar voren gebrachte grieven betreffende het vervoer door Onze Minister;
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel12
  - number: 12.2.c
    text: |-
      zorg te dragen voor de behandeling van klaagschriften ingevolge het bepaalde in [hoofdstuk XIVA][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008765#HoofdstukXIVa
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0008765
        hoofdstuk: XIVa
  - number: 12.2.d
    text: aan Onze Minister en de Raad advies en inlichtingen te geven omtrent het onder a gestelde.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel12
  - number: '12.3'
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld over de bevoegdheden, de samenstelling en de werkwijze van
      de commissie en de benoeming en het ontslag van haar leden.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel12
  - number: '16.1'
    text: |-
      Het hoofd van de instelling draagt zorg dat zo spoedig mogelijk en in ieder geval binnen drie maanden na
      binnenkomst van de verpleegde in de instelling, in overleg met hem, een verplegings- en behandelingsplan wordt
      vastgesteld. Hij wijst iedere verpleegde een persoonlijke verblijfsruimte toe en draagt zorg dat deze behoorlijk is
      ingericht. Onze Minister stelt regels omtrent de eisen waaraan een verblijfsruimte moet voldoen.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel16
  - number: '16.2'
    text: |-
      Het behandelingsplan, bedoeld in het eerste lid, is gericht op het zodanig wegnemen van het gevaar dat de
      psychische stoornis, psychogeriatrische aandoening of verstandelijke handicap de verpleegde doet veroorzaken, dat
      de terbeschikkingstelling kan worden beëindigd of voorwaardelijk kan worden beëindigd. Zo mogelijk geschiedt dit
      door het behandelen van de stoornis. Indien dit niet mogelijk is, geschiedt dit door het anderszins wegnemen van
      het gevaar.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel16
  - number: '16.3'
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld omtrent de eisen waaraan een verplegings- en
      behandelingsplan tenminste moet voldoen en de voorschriften die bij een wijziging daarvan in acht genomen moeten
      worden.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel16
  - number: '16.4'
    text: 'Alvorens het verplegings- en behandelingsplan wordt vastgesteld, wordt overleg gepleegd met:'
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel16
  - number: 16.4.a
    text: de curator, indien de verpleegde onder curatele is gesteld;
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel16
  - number: 16.4.b
    text: de mentor, indien ten behoeve van de verpleegde een mentorschap is ingesteld;
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel16
  - number: 16.4.c
    text: de ouders of voogd, indien de verpleegde minderjarig is.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel16
  - number: 16a
    text: 'Behandeling van de verpleegde vindt slechts plaats:'
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel16a
  - number: 16a.a
    text: voor zover deze is voorzien in het behandelingsplan
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel16a
  - number: 16a.b
    text: |-
      indien het overleg over het behandelingsplan als bedoeld in [artikel 16, eerste of vierde lid][ref1], tot
      overeenstemming heeft geleid, en


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel16
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel16a
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: '16'
        hoofdstuk: IV
  - number: 16a.c
    text: |-
      indien de verpleegde of -indien van toepassing- de in [artikel 16, vierde lid][ref1], bedoelde persoon zich niet
      tegen behandeling verzet.


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel16
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel16a
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: '16'
        hoofdstuk: IV
  - number: 16b
    text: |-
      Indien niet voldaan wordt aan de voorwaarden van [artikel 16a, onderdelen b en c][ref1], kan als uiterste middel
      niettemin behandeling plaatsvinden:


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel16a
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel16b
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: 16a
        hoofdstuk: IV
  - number: 16b.a
    text: |-
      voor zover aannemelijk is dat zonder die behandeling het gevaar dat de psychische stoornis, psychogeriatrische
      aandoening of verstandelijke handicap de verpleegde doet veroorzaken niet binnen een redelijke termijn kan worden
      weggenomen, of
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel16b
  - number: 16b.b
    text: |-
      indien het hoofd van de instelling daartoe een besluit heeft genomen en dit naar het oordeel van een arts volstrekt
      noodzakelijk is om het gevaar dat de psychische stoornis, psychogeriatrische aandoening of verstandelijke handicap
      de verpleegde binnen de instelling doet veroorzaken, af te wenden.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel16b
  - number: 16c.1
    text: |-
      Behandeling overeenkomstig [artikel 16b][ref1], onder a, vindt plaats na een schriftelijke beslissing van het hoofd
      van de instelling waarin wordt vermeld voor welke termijn zij geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel16b
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel16c
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: 16b
        hoofdstuk: IV
  - number: 16c.2
    text: |-
      Ten behoeve van de in het eerste lid genoemde beslissing dient te worden overgelegd een verklaring van de
      behandelend psychiater alsmede een verklaring van een psychiater die de verpleegde met het oog daarop kort
      tevoren heeft onderzocht maar niet bij diens behandeling betrokken was. Uit deze verklaringen dient te blijken
      dat de persoon op wie de verklaring betrekking heeft, een psychische stoornis, psychogeriatrische aandoening of
      verstandelijke handicap heeft en dat een geval als bedoeld in [artikel 16b, onder a][ref1], zich voordoet. De
      verklaringen moeten met redenen zijn omkleed en ondertekend.


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel16b
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel16c
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: 16b
        hoofdstuk: IV
  - number: 16c.3
    text: |-
      De beslissing als bedoeld in het eerste lid wordt gemeld aan de voorzitter van de Commissie van Toezicht. De
      voorzitter van de Commissie van Toezicht doet onverwijld een melding aan de maandcommissaris.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel16c
  - number: 16c.4
    text: |-
      De termijn als bedoeld in het eerste lid is zo kort mogelijk, maar niet langer dan drie maanden, gerekend vanaf
      de dag waarop de beslissing tot stand komt. Het hoofd van de instelling doet onverwijld een afschrift van de
      beslissing toekomen aan de verpleegde of de persoon als bedoeld in [artikel 16, vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel16
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel16c
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: '16'
        hoofdstuk: IV
  - number: 16c.5
    text: |-
      Indien na afloop van de termijn als bedoeld in het eerste lid, voortzetting van de behandeling overeenkomstig
      [artikel 16b, onder a][ref1], nodig is, geschiedt dit slechts krachtens een schriftelijke beslissing van het hoofd
      van de instelling. Het bepaalde in de voorgaande volzin is eveneens van toepassing indien binnen zes maanden na
      afloop van de termijn, bedoeld in het vierde lid, opnieuw behandeling overeenkomstig artikel 16b, onder a, nodig
      is. Het hoofd van de instelling geeft in zijn beslissing aan waarom van een behandeling alsnog het beoogde effect
      wordt verwacht. Op zodanige beslissingen is het vierde lid, eerste volzin van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel16b
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel16c
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: 16b
        hoofdstuk: IV
  - number: 16c.6
    text: |-
      Bij algemene maatregel van bestuur worden nadere regels gesteld omtrent de toepassing van het eerste, tweede,
      vierde en vijfde lid alsmede omtrent de toepassing van [artikel 16b, onder b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel16b
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel16c
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: 16b
        hoofdstuk: IV
  - number: 16c.7
    text: |-
      Deze in het zesde lid bedoelde regels betreffen in ieder geval de melding en de registratie van de behandeling
      alsmede de taak van de behandelend arts. Tevens kunnen categorieën van behandelingsmiddelen of -maatregelen worden
      aangewezen die niet mogen worden toegepast bij een behandeling als bedoeld in [artikel 16b][ref1]. Bij algemene
      maatregel van bestuur kunnen voorts ten aanzien van daarbij aangegeven categorieën van behandelingsmiddelen of
      -maatregelen regels worden gegeven met betrekking tot de wijze waarop tot toepassing daarvan moet worden besloten.


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel16b
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel16c
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: 16b
        hoofdstuk: IV
  - number: '17.1'
    text: |-
      De behandeling vindt plaats vanwege de instelling. Indien een gedeelte van de behandeling niet vanwege de
      instelling kan worden verricht, draagt het hoofd van de instelling zorg dat dit door een daartoe gekwalificeerde
      derde kan geschieden.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel17
  - number: '17.2'
    text: |-
      Het hoofd van de instelling draagt zorg dat de behandeling overeenkomstig het verplegings- en behandelingsplan
      plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel17
  - number: '18.1'
    text: |-
      De verpleegde heeft recht op een periodieke evaluatie door het hoofd van de instelling van het verloop van
      de verpleging en behandeling. Deze evaluatie vindt ten minste eenmaal per jaar en, indien de verpleegde
      een ter beschikking gestelde is, in ieder geval tijdig voor de opmaking van een advies als bedoeld in
      [artikel 6:6:12, eerste lid, onder a, van het Wetboek van Strafvordering][ref1] plaats.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel6
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '6'
  - number: '18.2'
    text: |-
      Het hoofd van de instelling draagt zorg dat van iedere evaluatie een verslag wordt gemaakt en dat dit verslag zo
      spoedig mogelijk met de verpleegde wordt besproken.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel18
  - number: '18.3'
    text: |-
      Indien de verpleegde van oordeel is dat het evaluatieverslag feitelijk onjuist of onvolledig is, heeft hij
      het recht op dit verslag schriftelijk commentaar te geven. Indien het evaluatieverslag niet overeenkomstig het
      commentaar wordt verbeterd of aangevuld, draagt het hoofd van de instelling zorg dat het commentaar aan het
      evaluatieverslag wordt gehecht.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel18
  - number: '18.4'
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld omtrent de procedure die met betrekking tot de evaluatie
      dient te worden gevolgd en de eisen die aan het verslag daarvan ten minste dienen te worden gesteld.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel18
  - number: '19.1'
    text: |-
      Het hoofd van de instelling draagt zorg dat ten dienste van de verpleging en de behandeling van de verpleegde een
      dossier wordt aangelegd, waarin in ieder geval de volgende gegevens worden vastgelegd:
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel19
  - number: 19.1.a
    text: |-
      rapporten uitgebracht door of aan de instelling betreffende de ten uitvoerlegging van de aan de verpleegde
      opgelegde vrijheidsbenemende straf of maatregel;
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel19
  - number: 19.1.b
    text: het verplegings- en behandelingsplan;
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel19
  - number: 19.1.c
    text: |-
      op schrift gestelde samenvattingen van besprekingen voor zover betrekking hebbende op de vaststelling en de
      wijziging van het verplegings- en behandelingsplan;
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel19
  - number: 19.1.d
    text: evaluatieverslagen;
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel19
  - number: 19.1.e
    text: |-
      adviezen en aantekeningen als bedoeld in [artikel 6:6:12, eerste lid, van het Wetboek van Strafvordering][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel6
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '6'
  - number: 19.1.f
    text: opname- en ontslaggegevens;
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel19
  - number: 19.1.g
    text: |-
      de aantekening omtrent de oplegging van een disciplinaire straf als bedoeld in [artikel 49, zevende lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel49
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: '49'
        hoofdstuk: X
  - number: '19.2'
    text: |-
      Bij algemene maatregel van bestuur worden nadere regels gesteld inzake de eisen waaraan het verpleegdedossier
      ten minste moet voldoen, de gegevens die daarin moeten worden vastgelegd, de termijn gedurende welke het
      verpleegdedossier moet worden bewaard, de wijze waarop het verpleegdedossier moet worden beheerd, bewaard en, na
      afloop van de bewaartermijn, vernietigd, alsmede de overdracht van gegevens in geval van een overplaatsing van
      de verpleegde.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel19
  - number: '19.3'
    text: |-
      Met toepassing van het bepaalde in [artikel 464 van Boek 7 van het Burgerlijk Wetboek][ref1] zijn
      [de artikelen 454][ref2] en [455][ref3] van dit boek niet van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel464
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel454
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel455
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '464'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '454'
      - id: ref3
        bwb_id: BWBR0005290
        artikel: '455'
  - number: '20.1'
    text: |-
      De verpleegde heeft, behoudens de overeenkomstig het tweede lid en derde lid te stellen beperkingen, recht op
      kennisneming van de in het verpleegdedossier vastgelegde gegevens.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel20
  - number: '20.2'
    text: |-
      Het hoofd van de instelling kan de verpleegde na een verzoek tot kennisneming van bepaalde gegevens hem deze
      onthouden, indien dit noodzakelijk is ter afwending van ernstig gevaar voor de handhaving van de orde of de
      veiligheid in de instelling of ter bescherming van de persoonlijke levenssfeer van anderen dan de verpleegde.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel20
  - number: '20.3'
    text: |-
      Het hoofd van de instelling kan het recht op kennisneming van evaluatieverslagen beperken tot een daarvan gemaakte
      samenvatting, indien de verpleging dit vereist.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel20
  - number: '20.4'
    text: |-
      Het hoofd van de instelling kan, in geval van toepassing van het tweede of derde lid, een door de verpleegde
      gemachtigde persoon doen kennis nemen van de gegevens waarvan de kennisneming aan de verpleegde onthouden wordt.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel20
  - number: '20.5'
    text: |-
      Voor wat betreft het verplegings- en behandelingsplan en het evaluatieverslag omvat het recht op kennisneming
      tevens het recht op het ontvangen van een afschrift.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel20
  - number: '20.6'
    text: |-
      Met toepassing van het bepaalde in [artikel 464 van Boek 7 van het Burgerlijk Wetboek][ref1] is [artikel 456][ref2]
      van dit boek niet van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel464
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel456
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '464'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '456'
  - number: '21.1'
    text: |-
      Het recht van de verpleegde op onaantastbaarheid van zijn lichaam, de van zijn lichaam afgescheiden stoffen, zijn
      kleding en zijn persoonlijke verblijfsruimte kan overeenkomstig de bepalingen van dit hoofdstuk worden beperkt.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel21
  - number: '21.2'
    text: |-
      Het recht van de ter beschikking gestelde op onaantastbaarheid van zijn lichaam kan overeenkomstig het bepaalde in
      [artikel 30][ref1] worden beperkt.


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel30
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: '30'
        hoofdstuk: V
  - number: '22.1'
    text: |-
      Het hoofd van de instelling stelt bij de eerste opname in de instelling, bij de tenuitvoerlegging van een bevel
      als bedoeld in [artikel 2, eerste lid, aanhef, van de Wet DNA-onderzoek bij veroordeelden][ref1] en voor zover dit
      anderszins noodzakelijk is, de identiteit van de verpleegde vast.


      [ref1]: https://wetten.overheid.nl/BWBR0017212#Artikel2
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0017212
        artikel: '2'
  - number: '22.2'
    text: |-
      Het vaststellen van de identiteit van de verpleegde omvat bij de eerste opname in de instelling het vragen
      naar zijn naam, voornamen, geboorteplaats en geboortedatum, het adres waarop hij in de basisregistratie
      personen is ingeschreven en het adres van zijn feitelijke verblijfplaats buiten de instelling. Het omvat
      tevens het nemen van een of meer vingerafdrukken. In de gevallen waarin van de verpleegde eerder overeenkomstig
      het [Wetboek van Strafvordering][ref1] vingerafdrukken zijn genomen en verwerkt, omvat het vaststellen
      van zijn identiteit bij binnenkomst in de instelling tevens een vergelijking van zijn vingerafdrukken met
      de van hem verwerkte vingerafdrukken. In de andere gevallen omvat het vaststellen van zijn identiteit een
      onderzoek van zijn identiteitsbewijs, bedoeld in [artikel 1 van de Wet op de identificatieplicht][ref2].
      [Artikel 29c, tweede lid, van het Wetboek van Strafvordering][ref3] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903
      [ref2]: https://wetten.overheid.nl/BWBR0006297#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel29c
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0001903
      - id: ref2
        bwb_id: BWBR0006297
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0001903
        artikel: 29c
  - number: '22.3'
    text: |-
      Het vaststellen van de identiteit van de verpleegde omvat in de andere gevallen dan de eerste opname in
      de instelling het nemen van een of meer vingerafdrukken en het vergelijken van die vingerafdrukken met
      de van hem bij binnenkomst genomen vingerafdrukken. Bij de tenuitvoerlegging van een bevel als bedoeld in
      [artikel 2, eerste lid, aanhef, van de Wet DNA-onderzoek bij veroordeelden][ref1] worden van de verpleegde tevens
      een of meer vingerafdrukken overeenkomstig het [Wetboek van Strafvordering][ref2] genomen en verwerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0017212#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0001903
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0017212
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0001903
  - number: '22.4'
    text: |-
      Het hoofd van de instelling is bevoegd van de verpleegde een of meer foto’s te nemen. De foto’s kunnen worden
      gebruikt voor het vervaardigen van een legitimatiebewijs en voor het voorkomen, opsporen, vervolgen en berechten
      van strafbare feiten. De verpleegde is verplicht het legitimatiebewijs bij zich te dragen en op verzoek van een
      personeelslid of medewerker te tonen.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel22
  - number: '22.5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld voor het verwerken van de persoonsgegevens,
      bedoeld in het tweede tot en met vierde lid.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel22
  - number: '23.1'
    text: |-
      Het hoofd van de instelling is bevoegd een verpleegde bij binnenkomst in of bij het verlaten van een instelling,
      voorafgaand aan of na afloop van bezoek, dan wel indien dit anderszins noodzakelijk is in het belang van de
      bescherming van de maatschappij tegen de gevaarlijkheid van de verpleegde voor de veiligheid van anderen dan de
      verpleegde of de algemene veiligheid van personen of goederen dan wel de handhaving van de orde of de veiligheid in
      de instelling, aan zijn lichaam of aan zijn kleding te onderzoeken.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel23
  - number: '23.2'
    text: |-
      Onze Minister is bevoegd ten behoeve van het vervoer van de verpleegde hem aan zijn lichaam of aan zijn kleding
      te onderzoeken.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel23
  - number: '23.3'
    text: |-
      Het onderzoek aan het lichaam van de verpleegde omvat mede het uitwendig schouwen van de openingen en holten van
      het lichaam van de verpleegde. Het onderzoek aan de kleding van de verpleegde omvat mede het onderzoek van de
      voorwerpen die de verpleegde bij zich draagt of met zich mee voert.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel23
  - number: '23.4'
    text: |-
      Het onderzoek aan het lichaam van de verpleegde wordt op besloten plaatsen en, voor zover mogelijk, door personen
      van hetzelfde geslacht als de verpleegde verricht.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel23
  - number: '23.5'
    text: |-
      Indien bij een onderzoek aan het lichaam of de kleding voorwerpen worden aangetroffen die niet in het bezit van de
      verpleegde mogen zijn is het hoofd van de instelling bevoegd deze in beslag te nemen. Deze bevoegdheid omvat mede
      het verwijderen van deze voorwerpen uit de openingen en holten van het lichaam voor zover dit kan plaatsvinden
      zonder het gebruik van hulpmiddelen. Hij draagt zorg dat deze voorwerpen, hetzij onder afgifte van een bewijs
      van ontvangst ten behoeve van de verpleegde worden bewaard, hetzij met toestemming van de verpleegde in diens
      aanwezigheid worden vernietigd, hetzij aan een opsporingsambtenaar ter hand worden gesteld met het oog op de
      voorkoming of opsporing van strafbare feiten.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel23
  - number: '24.1'
    text: |-
      Het hoofd van de instelling kan, indien dit noodzakelijk is in het belang van de handhaving van de orde of de
      veiligheid in de instelling dan wel in verband met de verlening van verlof, een verpleegde verplichten urine af te
      staan ten behoeve van een onderzoek van die urine op aanwezigheid van gedragsbeïnvloedende middelen.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel24
  - number: '24.2'
    text: |-
      Onze Minister stelt nadere regels omtrent de wijze van uitvoering van het urineonderzoek. Deze regels betreffen in
      elk geval het recht van de verpleegde om de uitslag te vernemen en om voor eigen rekening een hernieuwd onderzoek
      van de afgestane urine te laten plaatsvinden. Artikel 23, derde lid, is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel24
  - number: '25.1'
    text: |-
      Het hoofd van de instelling kan bepalen dat een verpleegde in het lichaam wordt onderzocht, indien dit noodzakelijk
      is ter afwending van ernstig gevaar voor de handhaving van de orde of de veiligheid in de instelling of ernstig
      gevaar voor de gezondheid of de veiligheid van de verpleegde. Het onderzoek in het lichaam wordt verricht door een
      arts of, in diens opdracht, door een verpleegkundige.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel25
  - number: '25.2'
    text: |-
      Het hoofd van de afdeling waar de verpleegde verblijft kan bij dringende noodzakelijkheid een beslissing als
      bedoeld in het eerste lid nemen.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel25
  - number: '25.3'
    text: |-
      Indien bij het onderzoek in het lichaam voorwerpen worden aangetroffen die niet in het bezit van de verpleegde
      mogen zijn, en deze voorwerpen door de arts of verpleegkundige uit het lichaam kunnen worden verwijderd, is het
      hoofd van de instelling bevoegd deze in beslag te nemen. [Artikel 23, vijfde lid, laatste volzin][ref1], is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel23
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: '23'
        hoofdstuk: V
  - number: '26.1'
    text: |-
      Het hoofd van de instelling kan een verpleegde verplichten te gedogen dat ten aanzien van hem
      een bepaalde geneeskundige handeling wordt verricht niet zijnde een behandeling als bedoeld in
      [artikel 16b, onder a of b][ref1], indien die handeling naar het oordeel van een arts volstrekt noodzakelijk is
      ter afwending van gevaar voor de gezondheid of de veiligheid van de verpleegde of van anderen. De handeling wordt
      verricht niet zijnde een behandeling als bedoeld in artikel 16b, onder a of b door een arts of, in diens opdracht,
      door een verpleegkundige.


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel16b
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: 16b
        hoofdstuk: IV
  - number: '26.2'
    text: |-
      [Artikel 25, tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel25
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: '25'
        hoofdstuk: V
  - number: '26.3'
    text: |-
      Bij algemene maatregel van bestuur worden nadere regels gesteld omtrent de toepassing van het eerste lid. Deze
      regels betreffen in ieder geval de melding en de registratie van de geneeskundige handeling. De algemene maatregel
      van bestuur treedt niet eerder in werking dan acht weken na de datum van uitgifte van het *Staatsblad* waarin hij
      is geplaatst. Van de plaatsing wordt onverwijld mededeling gedaan aan de beide kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel26
  - number: '27.1'
    text: |-
      Het hoofd van de instelling kan bepalen dat een verpleegde tijdens de separatie door bevestiging van mechanische
      middelen aan zijn lichaam voor een periode van ten hoogste vierentwintig uren in zijn bewegingsvrijheid wordt
      beperkt, indien die beperking noodzakelijk is ter afwending van een van de verpleegde uitgaand ernstig gevaar
      voor diens gezondheid of veiligheid of die van anderen. Het hoofd van de instelling stelt de arts of diens
      plaatsvervanger en de commissie van toezicht van de bevestiging onverwijld in kennis.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel27
  - number: '27.2'
    text: |-
      In geval van toepassing van [artikel 34, derde lid][ref1], kan het hoofd van de afdeling waar de verpleegde
      verblijft bij dringende noodzakelijkheid een beslissing als bedoeld in het eerste lid nemen. Het hoofd van de
      instelling, de arts of diens plaatsvervanger en de commissie van toezicht worden hiervan onverwijld in kennis
      gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel34
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: '34'
        hoofdstuk: VI
  - number: '27.3'
    text: |-
      Het hoofd van de instelling kan de bevestiging van mechanische middelen aan het lichaam van de verpleegde telkens
      met ten hoogste vierentwintig uren verlengen. De beslissing tot verlenging wordt genomen na overleg met een aan de
      instelling verbonden arts.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel27
  - number: '27.4'
    text: Onze Minister stelt nadere regels omtrent de bevestiging van mechanische middelen aan het lichaam.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel27
  - number: '28.1'
    text: |-
      Het hoofd van de instelling kan bepalen dat een op afwending of vermindering van gevaarlijk gedrag gerichte ingreep
      in het lichaam van een verpleegde, waarvan de gevolgen, naar is te voorzien, niet ongedaan gemaakt kunnen worden,
      wordt verricht.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel28
  - number: '28.2'
    text: 'Een ingreep als bedoeld in het eerste lid vindt slechts plaats indien:'
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel28
  - number: 28.2.a
    text: |-
      de arts die voornemens is de ingreep uit te voeren de verpleegde heeft voorgelicht over de aard en de gevolgen van
      de ingreep;
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel28
  - number: 28.2.b
    text: de verpleegde schriftelijk heeft verklaard in te stemmen met de ingreep;
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel28
  - number: 28.2.c
    text: |-
      een termijn van veertien dagen in acht genomen wordt tussen de instemming van de verpleegde en de uitvoering van
      de ingreep.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel28
  - number: '28.3'
    text: |-
      Een arts die voornemens is een ingreep als bedoeld in het eerste lid uit te voeren dient hieromtrent het advies in
      te winnen van een niet aan de instelling verbonden arts.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel28
  - number: '29.1'
    text: |-
      Het hoofd van de instelling is bevoegd de persoonlijke verblijfsruimte van een verpleegde op de aanwezigheid van
      voorwerpen, die niet in zijn bezit mogen zijn, te onderzoeken:
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel29
  - number: 29.1.a
    text: |-
      indien dit onderzoek plaatsvindt in het kader van het algemeen toezicht op de aanwezigheid van verboden voorwerpen
      in de persoonlijke verblijfsruimten van verpleegden;
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel29
  - number: 29.1.b
    text: |-
      indien dit anderszins noodzakelijk is met het oog op een belang als bedoeld in [artikel 23, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel23
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: '23'
        hoofdstuk: V
  - number: '29.2'
    text: |-
      [Artikel 23, vijfde lid][ref1], eerste en laatste volzin, is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel23
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: '23'
        hoofdstuk: V
  - number: '29.3'
    text: |-
      Het hoofd van de instelling is bevoegd de persoonlijke verblijfsruimte van een verpleegde te
      onderzoeken op de aanwezigheid van voorwerpen waarop vermoedelijk celmateriaal van de verpleegde
      aanwezig is en deze voorwerpen in beslag te nemen, indien de officier van justitie hem op grond van
      [artikel 6, eerste lid, van de Wet DNA-onderzoek bij veroordeelden][ref1] een opdracht tot het in beslag nemen van
      deze voorwerpen heeft gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0017212#Artikel6
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0017212
        artikel: '6'
  - number: '30.1'
    text: |-
      Het hoofd van de instelling is bevoegd jegens een verpleegde geweld te gebruiken of vrijheidsbeperkende middelen
      aan te wenden, voor zover dit noodzakelijk is met het oog op één van de volgende belangen:
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel30
  - number: 30.1.a
    text: de handhaving van de orde of de veiligheid in de instelling;
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel30
  - number: 30.1.b
    text: de uitvoering van een bij of krachtens deze wet genomen beslissing;
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel30
  - number: 30.1.c
    text: de voorkoming van de onttrekking van een verpleegde aan het op hem uitgeoefende toezicht;
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel30
  - number: 30.1.d
    text: |-
      de uitvoering van een ingevolge het [Wetboek van Strafvordering][ref1] of de
      [Wet DNA-onderzoek bij veroordeelden][ref2] door de officier van justitie of de rechter-commissaris genomen
      beslissing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903
      [ref2]: https://wetten.overheid.nl/BWBR0017212
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0001903
      - id: ref2
        bwb_id: BWBR0017212
  - number: '30.2'
    text: |-
      Het hoofd van de instelling is bevoegd jegens een ter beschikking gestelde geweld te gebruiken of
      vrijheidsbeperkende middelen aan te wenden met het oog op een belang als bedoeld in het eerste lid, onder *b* of
      *c*.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel30
  - number: '30.3'
    text: |-
      Onze Minister is bevoegd jegens een verpleegde geweld te gebruiken of vrijheidsbeperkende middelen aan te wenden
      met het oog op een van de volgende belangen:
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel30
  - number: 30.3.a
    text: de uitvoering van een door hem genomen beslissing;
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel30
  - number: 30.3.b
    text: de voorkoming van het zich onttrekken van de verpleegde aan het op hem uitgeoefende toezicht.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel30
  - number: '30.4'
    text: |-
      Aan het gebruik van geweld gaat zo mogelijk een waarschuwing vooraf. Degene die geweld heeft gebruikt maakt hiervan
      onverwijld een schriftelijk verslag en doet dit verslag onverwijld aan het hoofd van de instelling toekomen.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel30
  - number: '30.5'
    text: Onze Minister stelt nadere regels omtrent het gebruik van geweld en de aanwending van vrijheidsbeperkende middelen.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel30
  - number: '31.1'
    text: De bewegingsvrijheid van verpleegden binnen de instelling kan zowel per afdeling als per verpleegde verschillen.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel31
  - number: '31.2'
    text: |-
      Een verpleegde heeft, behoudens in geval van toepassing van [artikel 32][ref1], [34][ref2] of
      [49, eerste lid, onder a][ref3], het recht in totaal tenminste vier uren per dag samen met een of meer
      medeverpleegden door te brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0008765#Artikel34
      [ref3]: https://wetten.overheid.nl/BWBR0008765#Artikel49
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: '32'
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0008765
        artikel: '34'
        hoofdstuk: VI
      - id: ref3
        bwb_id: BWBR0008765
        artikel: '49'
        hoofdstuk: X
  - number: '31.3'
    text: |-
      De plaatsing op en overplaatsing naar een afdeling geschieden door het hoofd van de instelling met inachtneming van
      de volgende belangen:
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel31
  - number: 31.3.a
    text: |-
      de bescherming van de maatschappij tegen de gevaarlijkheid van de verpleegde voor de veiligheid van anderen dan de
      verpleegde of de algemene veiligheid van personen of goederen;
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel31
  - number: 31.3.b
    text: de handhaving van de orde of de veiligheid in de instelling;
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel31
  - number: 31.3.c
    text: de uitvoering van het verplegings- en behandelingsplan.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel31
  - number: '31.4'
    text: |-
      Het hoofd van de instelling kan aan de plaatsing op een afdeling, voor zover deze een uitbreiding van de
      bewegingsvrijheid met zich brengt, voorwaarden verbinden. Deze voorwaarden kunnen voor een verpleegde de
      verplichting inhouden om aan bepaalde activiteiten deel te nemen of werkzaamheden of arbeid te verrichten.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel31
  - number: '32.1'
    text: |-
      Het hoofd van de instelling kan een verpleegde op een door Onze Minister als zodanig aangewezen afdeling voor
      intensieve zorg plaatsen, indien dit noodzakelijk is met het oog op één van de volgende belangen:
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel32
  - number: 32.1.a
    text: |-
      de bescherming van de maatschappij tegen de gevaarlijkheid van de verpleegde voor de veiligheid van anderen dan de
      verpleegde of de algemene veiligheid van personen of goederen;
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel32
  - number: 32.1.b
    text: de handhaving van de orde of de veiligheid in de instelling;
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel32
  - number: 32.1.c
    text: de afwending van ernstig gevaar voor de gezondheid van de verpleegde.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel32
  - number: '32.2'
    text: |-
      Het hoofd van de instelling bepaalt telkens na ten hoogste zes maanden of voortzetting van het verblijf op de
      afdeling voor intensieve zorg met het oog op een belang als bedoeld in het eerste lid noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel32
  - number: '32.3'
    text: |-
      Een verpleegde, die op een afdeling voor intensieve zorg verblijft, heeft het recht ten minste twee maal een half
      uur per dag samen met een of meer medeverpleegden door te brengen.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel32
  - number: '33'
    text: |-
      Indien de bewegingsvrijheid waarop de verpleegde op grond van de bij of krachtens deze wet gestelde regels recht
      heeft, niet is beperkt tot de afdeling waar hij verblijft, kan het hoofd van de instelling zodanige beperking
      niettemin telkens voor een periode van ten hoogste vier weken opleggen, indien dit noodzakelijk is met het oog op
      een belang als bedoeld in [artikel 32, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel32
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: '32'
        hoofdstuk: VI
  - number: '34.1'
    text: |-
      Het hoofd van de instelling is bevoegd een verpleegde af te zonderen of te separeren, indien dit noodzakelijk is
      met het oog op een belang als bedoeld in [artikel 32, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel32
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: '32'
        hoofdstuk: VI
  - number: '34.2'
    text: |-
      Een ononderbroken verblijf in afzondering of separatie duurt ten hoogste vier weken, behoudens verlenging
      overeenkomstig het bepaalde in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel34
  - number: '34.3'
    text: |-
      Het hoofd van de afdeling waar de verpleegde verblijft kan bij dringende noodzakelijkheid de beslissing tot
      separatie nemen voor ten hoogste vijftien uren.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel34
  - number: '34.4'
    text: |-
      Het hoofd van de instelling kan de afzondering of separatie telkens, met schriftelijke machtiging van Onze
      Minister, met ten hoogste vier weken verlengen.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel34
  - number: '34.5'
    text: |-
      Het hoofd van de instelling draagt zorg dat, ingeval de separatie langer dan vierentwintig uren duurt, een aan de
      instelling verbonden arts en de commissie van toezicht onverwijld hiervan in kennis worden gesteld.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel34
  - number: '34.6'
    text: |-
      Het hoofd van de instelling draagt zorg dat in geval van afzondering of separatie het nodige contact tussen
      personeelsleden of medewerkers en verpleegde wordt gewaarborgd en naar aard en frequentie op de situatie van de
      verpleegde wordt afgestemd.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel34
  - number: '34.7'
    text: |-
      Onze Minister stelt nadere regels omtrent de toepassing van de afzondering of separatie. Deze regels betreffen in
      elk geval de rechten die tijdens de afzondering of separatie aan de verpleegde toekomen.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel34
  - number: 34a.1
    text: |-
      Het hoofd van de instelling kan, indien dit ter bescherming van de geestelijke of lichamelijke toestand van de
      verpleegde noodzakelijk is, bepalen dat de verpleegde die in afzondering of separatie verblijft, dag en nacht door
      middel van een camera wordt geobserveerd.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel34a
  - number: 34a.2
    text: |-
      Alvorens hij hiertoe beslist, wint hij het advies in van de voor de behandeling verantwoordelijke psychiater
      onderscheidenlijk een aan de inrichting verbonden arts, tenzij dit advies niet kan worden afgewacht. In dat geval
      wint het hoofd van de instelling het advies zo spoedig mogelijk na zijn beslissing in.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel34a
  - number: '35.1'
    text: |-
      De verpleegde heeft, behoudens de overeenkomstig het tweede tot en met vijfde lid te stellen beperkingen, het recht
      brieven en stukken per post te verzenden en te ontvangen. De hieraan verbonden kosten komen, tenzij het hoofd van
      de instelling anders bepaalt, voor rekening van de verpleegde.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel35
  - number: '35.2'
    text: |-
      Het hoofd van de instelling is bevoegd enveloppen of andere poststukken afkomstig van of bestemd voor
      verpleegden op de aanwezigheid van bijgesloten voorwerpen te onderzoeken en deze hiertoe te openen. Het
      openen geschiedt, voor zover mogelijk, in aanwezigheid van de betrokken verpleegde. Ten aanzien van de in
      [artikel 4, eerste lid, onder g][ref1], genoemde verpleegden geldt deze bevoegdheid slechts indien de kantonrechter
      van de rechtbank Den Haag hiertoe de last heeft gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel4
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: '4'
        hoofdstuk: II
        paragraaf: '2'
  - number: '35.3'
    text: |-
      Het hoofd van de instelling is bevoegd op de inhoud van brieven of andere poststukken afkomstig van of bestemd voor
      de verpleegde telkens voor een periode van ten hoogste vier weken toezicht uit te oefenen, indien dit noodzakelijk
      is met het oog op één van de volgende belangen:
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel35
  - number: 35.3.a
    text: |-
      de bescherming van de maatschappij tegen de gevaarlijkheid van de verpleegde voor de veiligheid van anderen dan de
      verpleegde of de algemene veiligheid van personen of goederen;
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel35
  - number: 35.3.b
    text: de handhaving van de orde of de veiligheid in de inrichting;
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel35
  - number: 35.3.c
    text: de afwending van ernstig gevaar voor de gezondheid van de verpleegde;
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel35
  - number: 35.3.d
    text: de bescherming van slachtoffers van of anderszins betrokkenen bij door een verpleegde begane misdrijven;
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel35
  - number: 35.3.e
    text: de voorkoming of opsporing van strafbare feiten.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel35
  - number: '35.4'
    text: Het toezicht, bedoeld in het derde lid, kan worden beperkt tot bepaalde personen of instanties.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel35
  - number: '35.5'
    text: |-
      Het hoofd van de instelling kan de verzending of uitreiking van bepaalde brieven of andere poststukken alsmede
      bijgesloten voorwerpen weigeren, indien dit noodzakelijk is met het oog op een belang als bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel35
  - number: '35.6'
    text: |-
      Het hoofd van de instelling draagt zorg dat de niet uitgereikte brieven of andere poststukken dan wel bijgesloten
      voorwerpen, hetzij worden terug gegeven aan de verpleegde of voor diens rekening worden teruggezonden aan de
      verzender of een ander door de verpleegde op te geven adres, hetzij onder afgifte van een bewijs van ontvangst ten
      behoeve van de verpleegde worden bewaard, hetzij met toestemming van de verpleegde in diens aanwezigheid worden
      vernietigd, hetzij aan een opsporingsambtenaar ter hand worden gesteld met het oog op de voorkoming of opsporing
      van strafbare feiten.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel35
  - number: '36.1'
    text: |-
      Het bepaalde in [artikel 35, derde tot en met het vijfde lid][ref1], is niet van toepassing op brieven, door de
      verpleegde gericht aan of afkomstig van:


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel35
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: '35'
        hoofdstuk: VII
  - number: 36.1.a
    text: leden van het Koninklijk Huis;
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel36
  - number: 36.1.b
    text: de Eerste of Tweede Kamer der Staten-Generaal, een commissie daaruit of leden daarvan;
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel36
  - number: 36.1.c
    text: Onze Minister;
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel36
  - number: 36.1.d
    text: justitiële autoriteiten;
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel36
  - number: 36.1.e
    text: de Nationale ombudsman;
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel36
  - number: 36.1.f
    text: de inspecteurs van de Inspectie gezondheidszorg en jeugd;
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel36
  - number: 36.1.g
    text: de Raad, een commissie daaruit of leden of buitengewone leden daarvan;
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel36
  - number: 36.1.h
    text: de commissie van toezicht of een beklagcommissie, of leden daarvan;
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel36
  - number: 36.1.i
    text: 'organen, of leden daarvan, die krachtens een wettelijk voorschrift of een in Nederland geldend verdrag:'
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel36
  - number: 36.1.i.1°
    text: bevoegd zijn tot kennisneming van klachten of behandeling van met een klacht aangevangen zaken; dan wel
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel36
  - number: 36.1.i.2°
    text: |-
      zijn belast met het houden van toezicht op inrichtingen als bedoeld in [hoofdstuk II][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008765#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0008765
        hoofdstuk: II
  - number: 36.1.j
    text: diens rechtsbijstandverlener;
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel36
  - number: 36.1.k
    text: diens reclasseringswerker;
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel36
  - number: 36.1.l
    text: |-
      het bestuur, voor zover het een private instelling met een bijzondere aanwijzing als bedoeld in
      [artikel 3.3, eerste lid, van de Wet forensische zorg][ref1] betreft;


      [ref1]: https://wetten.overheid.nl/BWBR0040634#Artikel3
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0040634
        artikel: '3'
  - number: 36.1.m
    text: andere door Onze Minister of het hoofd van de instelling aan te wijzen personen of instanties.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel36
  - number: '36.2'
    text: |-
      Onze Minister kan nadere regels stellen omtrent de wijze van verzending van brieven aan en door de in het eerste
      lid genoemde personen en instanties.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel36
  - number: '37.1'
    text: |-
      De verpleegde heeft het recht ten minste gedurende een uur per week op in de huisregels vastgestelde tijden en
      plaatsen bezoek te ontvangen. In de huisregels worden regels gesteld omtrent het aanvragen van bezoek. Bij of
      krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld aan instellingen met een bijzondere
      aanwijzing als bedoeld in artikel 3.3, eerste lid, over de toelating en weigering van bezoek aan ter beschikking
      gestelden en over de toegang van personeel werkzaam bij die instelling met het oog op de veiligheid in de
      instelling en de naleving van de bij of krachtens de wet gegeven regels.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel37
  - number: '37.2'
    text: |-
      Het hoofd van de instelling kan het aantal tegelijk tot de verpleegde toe te laten personen beperken, indien dit
      noodzakelijk is in het belang van de handhaving van de orde of de veiligheid in de instelling.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel37
  - number: '37.3'
    text: |-
      Het hoofd van de instelling kan de toelating tot de verpleegde van bezoek of van een bepaalde persoon of bepaalde
      personen telkens voor een periode van ten hoogste vier weken weigeren, indien dit noodzakelijk is met het oog op
      een belang als bedoeld in [artikel 35, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel35
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: '35'
        hoofdstuk: VII
  - number: '37.4'
    text: |-
      Het hoofd van de instelling kan bepalen dat tijdens het bezoek toezicht wordt uitgeoefend, indien dit noodzakelijk
      is met het oog op een belang als bedoeld in [artikel 35, derde lid][ref1]. Dit toezicht kan omvatten het
      beluisteren of opnemen van het gesprek tussen een bezoeker en de verpleegde. Tevoren wordt aan de verpleegde
      mededeling gedaan van de aard en de reden van het toezicht.


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel35
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: '35'
        hoofdstuk: VII
  - number: '37.5'
    text: |-
      Iedere bezoeker dient zich bij binnenkomst op deugdelijke wijze te legitimeren. Het hoofd van de instelling kan
      bepalen dat een bezoeker aan zijn kleding wordt onderzocht op de aanwezigheid van voorwerpen die een gevaar kunnen
      opleveren voor de orde of de veiligheid in de instelling. Dit onderzoek kan ook betrekking hebben op door de
      bezoeker meegebrachte voorwerpen. Het hoofd van de instelling is bevoegd dergelijke voorwerpen gedurende de duur
      van het bezoek onder zich te nemen tegen afgifte van een bewijs van ontvangst dan wel aan een opsporingsambtenaar
      ter hand te stellen met het oog op de voorkoming of opsporing van strafbare feiten.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel37
  - number: '37.6'
    text: |-
      Het hoofd van de instelling kan het bezoek binnen de daarvoor bestemde tijd beëindigen en de bezoeker
      uit de instelling doen verwijderen, indien dit noodzakelijk is met het oog op een belang als bedoeld in
      [artikel 35, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel35
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: '35'
        hoofdstuk: VII
  - number: '37.7'
    text: |-
      De in [artikel 36, eerste lid, onder g, h, en i, onder 2°][ref1], genoemde personen en instanties hebben te
      allen tijde toegang tot de verpleegde. De overige in dat lid genoemde personen en instanties hebben toegang tot de
      verpleegde op in de huisregels vastgestelde tijden en plaatsen. Tijdens het bezoek kunnen zij zich vrijelijk met
      de verpleegde onderhouden, behoudens ingeval van de verpleegde een ernstig gevaar uitgaat voor de veiligheid van
      de bezoeker.


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel36
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: '36'
        hoofdstuk: VII
  - number: '38.1'
    text: |-
      De verpleegde heeft, behoudens de overeenkomstig het tweede tot en met het vijfde lid te stellen beperkingen,
      het recht tenminste eenmaal per week gedurende tien minuten een of meer telefoongesprekken te voeren met personen
      buiten de instelling. In de huisregels worden de tijden en plaatsen alsmede het voor het gesprek of de gesprekken
      te gebruiken toestel aangewezen. De hieraan verbonden kosten komen, tenzij het hoofd van de instelling anders
      bepaalt, voor rekening van de verpleegde. In verband met het uitoefenen van toezicht als bedoeld in het tweede lid,
      kunnen telefoongesprekken worden opgenomen.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel38
  - number: '38.2'
    text: |-
      Het hoofd van de instelling kan bepalen dat op de door of met een verpleegde gevoerde telefoongesprekken
      toezicht wordt uitgeoefend, indien dit noodzakelijk is om de identiteit van de persoon met wie de
      verpleegde een telefoongesprek voert vast te stellen dan wel met het oog op een belang als bedoeld in
      [artikel 35, derde lid][ref1]. Dit toezicht kan omvatten het beluisteren van een telefoongesprek of het
      uitluisteren van een opgenomen telefoongesprek. Aan de betrokkene wordt mededeling gedaan van de aard en de
      reden van het toezicht. Bij algemene maatregel van bestuur worden nadere regels gesteld over het opnemen van
      telefoongesprekken en het bewaren en verstrekken van opgenomen telefoongesprekken.


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel35
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: '35'
        hoofdstuk: VII
  - number: '38.3'
    text: |-
      Het hoofd van de instelling kan het voeren van telefoongesprekken of een bepaald telefoongesprek telkens voor een
      periode van ten hoogste vier weken weigeren of een telefoongesprek binnen de daarvoor bestemde tijd beëindigen,
      indien dit noodzakelijk is met het oog op een belang als bedoeld in [artikel 35, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel35
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: '35'
        hoofdstuk: VII
  - number: '38.4'
    text: |-
      De verpleegde heeft het recht met de in [artikel 36, eerste lid][ref1], genoemde personen en instanties
      telefoongesprekken te voeren op in de huisregels vastgestelde tijden en plaatsen. Op deze gesprekken wordt geen
      ander toezicht uitgeoefend dan noodzakelijk is om de identiteit van de persoon of instantie met wie de verpleegde
      een telefoongesprek voert of wenst te voeren vast te stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel36
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: '36'
        hoofdstuk: VII
  - number: '39.1'
    text: |-
      Het hoofd van de instelling kan toestemming geven voor het voeren van een gesprek tussen de verpleegde en een
      vertegenwoordiger van de media, voor zover dit zich verdraagt met de volgende belangen:
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel39
  - number: 39.1.a
    text: |-
      de bescherming van de maatschappij tegen de gevaarlijkheid van de verpleegde voor de veiligheid van anderen dan de
      verpleegde of de algemene veiligheid van personen of goederen;
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel39
  - number: 39.1.b
    text: de handhaving van de orde of de veiligheid in de instelling;
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel39
  - number: 39.1.c
    text: de bescherming van de openbare orde en de goede zeden;
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel39
  - number: 39.1.d
    text: de bescherming van de rechten en vrijheden van anderen dan de verpleegde;
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel39
  - number: 39.1.e
    text: de voorkoming of opsporing van strafbare feiten.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel39
  - number: '39.2'
    text: |-
      Het hoofd van de instelling kan met het oog op de bescherming van de in het eerste lid genoemde belangen aan de
      toegang van een vertegenwoordiger van de media tot de instelling voorwaarden verbinden. Het hoofd van de instelling
      is bevoegd een vertegenwoordiger van de media uit de instelling te doen verwijderen, indien hij de hem opgelegde
      voorwaarden niet nakomt.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel39
  - number: '39.3'
    text: |-
      Het hoofd van de instelling kan op het contact met een vertegenwoordiger van de media toezicht uitoefenen, indien
      dit noodzakelijk is met het oog op een belang als bedoeld in het tweede lid. Artikel 37, vierde lid, tweede en
      derde volzin, en vijfde lid is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel39
  - number: '40.1'
    text: |-
      De verpleegde heeft het recht zijn godsdienst of levensovertuiging, individueel of in gemeenschap met anderen, vrij
      te belijden en te beleven.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel40
  - number: '40.2'
    text: |-
      Het hoofd van de instelling draagt zorg dat in de instelling voldoende geestelijke verzorging, die zoveel mogelijk
      aansluit bij de godsdienst of levensovertuiging van de verpleegden, beschikbaar is.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel40
  - number: '40.3'
    text: |-
      Het hoofd van de instelling stelt de verpleegde in de gelegenheid op in de huisregels vastgestelde tijden en
      plaatsen:
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel40
  - number: 40.3.a
    text: |-
      persoonlijk contact te onderhouden met de geestelijke verzorger van de godsdienst of levensovertuiging van zijn
      keuze, die aan de instelling is verbonden;
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel40
  - number: 40.3.b
    text: |-
      contact te onderhouden met andere dan de onder *a* genoemde geestelijke verzorgers volgens het bepaalde in
      [artikel 37][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel37
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: '37'
        hoofdstuk: VII
  - number: 40.3.c
    text: |-
      in de instelling te houden godsdienstige en levensbeschouwelijke bijeenkomsten van zijn keuze bij te wonen,
      tenzij het hoofd van de instelling dit verbiedt in verband met de handhaving van de orde of de veiligheid in de
      instelling.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel40
  - number: '40.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld ten aanzien van de
      beschikbaarheid van de geestelijke verzorging. Deze regels kunnen betrekking hebben op de verlening van geestelijke
      verzorging door of vanwege verschillende richtingen van godsdienst of levensovertuiging, op de organisatie en de
      bekostiging van de geestelijke verzorging en op de aanstelling van geestelijke verzorgers bij een instelling.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel40
  - number: '41.1'
    text: De verpleegde heeft recht op verzorging door een aan de instelling verbonden arts.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel41
  - number: '41.2'
    text: De verpleegde heeft recht op raadpleging voor eigen rekening van een arts van zijn keuze.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel41
  - number: '41.3'
    text: 'Het hoofd van de instelling draagt zorg dat een aan de instelling verbonden arts:'
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel41
  - number: 41.3.a
    text: regelmatig beschikbaar is voor het houden van een spreekuur;
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel41
  - number: 41.3.b
    text: op andere tijdstippen beschikbaar is, indien dit in het belang van de gezondheid van de verpleegde noodzakelijk is;
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel41
  - number: 41.3.c
    text: |-
      de verpleegden die hiervoor in aanmerking komen onderzoekt op hun geschiktheid voor deelname aan arbeid, sport of
      een andere gemeenschappelijke werkzaamheid of activiteit.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel41
  - number: '41.4'
    text: 'Het hoofd van de instelling draagt zorg voor:'
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel41
  - number: 41.4.a
    text: de verstrekking van de door een aan de instelling verbonden arts voorgeschreven medicijnen en diëten;
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel41
  - number: 41.4.b
    text: |-
      de behandeling van de verpleegde op aanwijzing van een aan de instelling verbonden arts voor zover deze niet kan
      worden aangemerkt als een behandeling, bedoeld in [artikel 1, onder v][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel1
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: '1'
        hoofdstuk: I
  - number: 41.4.c
    text: |-
      de overbrenging van de verpleegde naar een ziekenhuis dan wel andere instelling, indien de onder *b* bedoelde
      behandeling aldaar plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel41
  - number: '42.1'
    text: |-
      Het hoofd van de instelling draagt zorg dat aan de verpleegden voeding, noodzakelijke kleding en schoeisel worden
      verstrekt dan wel dat hem voldoende geldmiddelen ter beschikking worden gesteld om hierin naar behoren te voorzien.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel42
  - number: '42.2'
    text: |-
      De verpleegde heeft recht op het dragen van eigen kleding en schoeisel, tenzij die een gevaar kunnen opleveren voor
      de orde of de veiligheid in de instelling. Hij kan worden verplicht tijdens het verrichten van werkzaamheden of
      sport aangepaste kleding of schoeisel te dragen.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel42
  - number: '42.3'
    text: |-
      Het hoofd van de instelling draagt zorg dat bij de verstrekking van voeding zoveel mogelijk rekening wordt gehouden
      met de godsdienst of levensovertuiging van de verpleegden.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel42
  - number: '42.4'
    text: |-
      Het hoofd van de instelling draagt zorg dat de verpleegde in staat gesteld wordt het uiterlijk en de lichamelijke
      hygiëne naar behoren te verzorgen.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel42
  - number: '42.5'
    text: |-
      In de huisregels worden regels gesteld omtrent de aankoop door verpleegden van andere gebruiksartikelen dan die
      welke door het hoofd van de instelling ter beschikking worden gesteld.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel42
  - number: '43.1'
    text: |-
      Het hoofd van de instelling draagt zorg voor de sociale verzorging en hulpverlening, vorming en onderwijs,
      ontspannings- en sportactiviteiten voor de verpleegden, voor zover daarin niet reeds is voorzien in het
      verplegings- en behandelingsplan van de betrokken verpleegde.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel43
  - number: '43.2'
    text: |-
      Het hoofd van de instelling draagt zorg dat een bibliotheekvoorziening aanwezig is. In de huisregels worden regels
      gesteld omtrent het gebruik van de bibliotheek door verpleegden.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel43
  - number: '43.3'
    text: De verpleegde heeft recht op verblijf in de buitenlucht gedurende tenminste een uur per dag.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel43
  - number: '43.4'
    text: |-
      Onze Minister stelt regels omtrent de voorwaarden waaronder een tegemoetkoming kan worden verleend in de kosten
      die voor de verpleegde aan het volgen van onderwijs en het deelnemen aan andere educatieve activiteiten voor zover
      hierin niet in de instelling wordt voorzien, kunnen zijn verbonden. Deze voorwaarden kunnen betreffen de aard, de
      duur en de kosten van deze activiteiten alsmede de vooropleiding van de verpleegde en diens vorderingen.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel43
  - number: '44.1'
    text: |-
      De verpleegde heeft, behoudens de overeenkomstig het tweede tot en met het vierde lid te stellen beperkingen, het
      recht hem toebehorende voorwerpen in zijn persoonlijke verblijfsruimte te plaatsen dan wel bij zich te hebben.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel44
  - number: '44.2'
    text: |-
      In de huisregels kan worden bepaald dat het bezit van bepaalde soorten voorwerpen binnen de instelling of een
      bepaalde afdeling daarvan verboden is, indien dit bezit een gevaar kan opleveren voor:
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel44
  - number: 44.2.a
    text: |-
      de bescherming van de maatschappij tegen de gevaarlijkheid van de verpleegde voor de veiligheid van anderen dan de
      verpleegde of de algemene veiligheid van personen of goederen;
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel44
  - number: 44.2.b
    text: |-
      de handhaving van de orde of de veiligheid in de instelling, dan wel voor zover zich dit niet verdraagt met de
      aansprakelijkheid van het hoofd van de instelling voor de voorwerpen.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel44
  - number: '44.3'
    text: |-
      Het hoofd van de instelling kan bepalen dat een verpleegde een hem toebehorend voorwerp, niet behorende tot de
      soorten voorwerpen, bedoeld in het tweede lid, niet in zijn persoonlijke verblijfsruimte mag plaatsen of bij zich
      mag hebben, indien dit noodzakelijk is met het oog op één van de belangen als genoemd in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel44
  - number: '44.4'
    text: |-
      Het hoofd van de instelling is bevoegd aan de verpleegde toebehorende voorwerpen voor diens rekening te laten
      onderzoeken ten einde vast te stellen of de toelating of het bezit daarvan ingevolge het bepaalde in het tweede of
      derde lid kan worden toegestaan dan wel is verboden.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel44
  - number: '44.5'
    text: |-
      [Artikel 23, vijfde lid][ref1], eerste en laatste volzin is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel23
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: '23'
        hoofdstuk: V
  - number: '45'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot het beheer van het eigen
      geld van de verpleegde, waaronder begrepen de vergoeding voor het verrichten van werkzaamheden en het arbeidsloon
      als bedoeld in [artikel 46, tweede, onderscheidenlijk derde lid][ref1], en de besteding daarvan door verpleegden,
      alsmede het zak- en kleedgeld.


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel46
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: '46'
        hoofdstuk: VIII
        paragraaf: '2'
  - number: '46.1'
    text: 'De verpleegde is niet verplicht binnen de instelling werkzaamheden te verrichten, behoudens:'
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel46
  - number: 46.1.a
    text: |-
      voor zover dit voortvloeit uit een aan de uitbreiding van zijn bewegingsvrijheid verbonden voorwaarde als bedoeld
      in [artikel 31, vierde lid][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel31
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: '31'
        hoofdstuk: VI
  - number: 46.1.b
    text: |-
      deze werkzaamheden van huishoudelijke aard zijn en betrekking hebben op de ruimten waar zij verblijven, de
      persoonlijke verblijfsruimte daaronder begrepen.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel46
  - number: '46.2'
    text: |-
      Voor het verrichten van werkzaamheden, met uitzondering van de in het eerste lid, onder *b*, omschreven
      werkzaamheden, heeft de verpleegde recht op een door Onze Minister vast te stellen vergoeding. Deze vergoeding
      wordt bij de vaststelling van het bijdrageplichtig inkomen overeenkomstig het bepaalde bij of krachtens de
      [Wet langdurige zorg][ref1] buiten beschouwing gelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0035917
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0035917
  - number: '46.3'
    text: |-
      De verpleegde is niet verplicht buiten de instelling arbeid te verrichten, behoudens voor zover dit voortvloeit
      uit een aan het verlof of het proefverlof verbonden voorwaarde als bedoeld in [artikel 50, tweede lid][ref1],
      onderscheidenlijk [artikel 51, tweede lid][ref2]. Indien de verpleegde buiten de instelling arbeid verricht,
      blijft het door hem verdiende arbeidsloon zijn eigendom, onverminderd het bepaalde bij of krachtens de
      [Wet langdurige zorg][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel50
      [ref2]: https://wetten.overheid.nl/BWBR0008765#Artikel51
      [ref3]: https://wetten.overheid.nl/BWBR0035917
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: '50'
        hoofdstuk: XI
      - id: ref2
        bwb_id: BWBR0008765
        artikel: '51'
        hoofdstuk: XI
      - id: ref3
        bwb_id: BWBR0035917
  - number: '47.1'
    text: |-
      Indien een verpleegde een kind in de instelling wil onderbrengen ten einde het aldaar te verzorgen en op te
      voeden behoeft hij hiertoe de toestemming van het hoofd van de instelling. Het hoofd van de instelling kan deze
      toestemming geven, voor zover dit verblijf zich verdraagt met de volgende belangen:
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel47
  - number: 47.1.a
    text: de bescherming van de persoonlijke veiligheid of de geestelijke of lichamelijke ontwikkeling van het kind;
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel47
  - number: 47.1.b
    text: de handhaving van de orde of de veiligheid in de instelling;
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel47
  - number: 47.1.c
    text: de uitvoering van het verplegings- en behandelingsplan.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel47
  - number: '47.2'
    text: |-
      Het hoofd van de instelling kan aan de toestemming voorwaarden verbinden met het oog op een belang als bedoeld in
      het eerste lid.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel47
  - number: '47.3'
    text: |-
      Het hoofd van de instelling kan over een door hem voorgenomen onderbrenging van een kind in de instelling het
      advies inwinnen van de Raad voor de Kinderbescherming.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel47
  - number: '47.4'
    text: |-
      Het hoofd van de instelling kan de toestemming intrekken, indien dit noodzakelijk is met het oog op een belang
      als bedoeld in het eerste lid of indien de verpleegde een bepaalde voorwaarde niet nakomt. Indien het hoofd van
      de instelling een nader onderzoek nodig oordeelt, kan hij de medewerking van de Raad voor de Kinderbescherming
      inroepen.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel47
  - number: '47.5'
    text: |-
      Het hoofd van de instelling is verplicht de toestemming te weigeren of in te trekken, indien de onderbrenging van
      het kind in de instelling in strijd komt met enige op het gezag over het kind betrekking hebbende beslissing.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel47
  - number: '47.6'
    text: In de huisregels worden nadere regels gesteld omtrent het verblijf van kinderen in de instelling.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel47
  - number: '47.7'
    text: |-
      De kosten van de verzorging van het kind komen alleen voor rekening van het Rijk, voor zover de verpleegde zelf
      niet in die kosten kan voorzien.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel47
  - number: '48.1'
    text: |-
      Indien een personeelslid of medewerker van de instelling constateert dat een verpleegde betrokken is bij feiten
      die onverenigbaar zijn met de orde of de veiligheid in de instelling dan wel met een ongestoord verloop van de
      verpleging en hij voornemens is daarover aan het hoofd van de instelling schriftelijk verslag te doen, deelt hij
      dit de verpleegde mede.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel48
  - number: '48.2'
    text: |-
      Het hoofd van de instelling beslist over het opleggen van een disciplinaire straf zo spoedig mogelijk nadat hem
      verslag is gedaan.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel48
  - number: '48.3'
    text: |-
      Indien het hoofd van de instelling of zijn vervanger feiten als bedoeld in het eerste lid, constateert, blijft het
      eerste lid buiten toepassing.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel48
  - number: '49.1'
    text: |-
      Het hoofd van de instelling kan wegens het begaan van feiten als bedoeld in [artikel 48, eerste lid][ref1], een of
      meer van de volgende disciplinaire straffen opleggen:


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel48
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: '48'
        hoofdstuk: X
  - number: 49.1.a
    text: |-
      afzondering in de persoonlijke verblijfsruimte, gedurende het gehele etmaal of bepaalde uren daarvan, voor ten
      hoogste twee weken;
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel49
  - number: 49.1.b
    text: beperking van de bewegingsvrijheid tot de afdeling, waar de verpleegde verblijft, voor ten hoogste twee weken;
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel49
  - number: 49.1.c
    text: geldboete tot een door Onze Minister te bepalen maximum;
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel49
  - number: 49.1.d
    text: |-
      ontzegging van bezoek van een bepaalde persoon of van bepaalde personen voor ten hoogste twee weken, indien het
      feit plaatsvond in verband met bezoek van die persoon of personen;
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel49
  - number: 49.1.e
    text: |-
      uitsluiting van deelname aan een of meer gemeenschappelijke activiteiten of werkzaamheden voor ten hoogste twee
      weken, indien het feit plaatsvond in verband met die gemeenschappelijke activiteit of werkzaamheid.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel49
  - number: '49.2'
    text: |-
      Het hoofd van de instelling bepaalt bij de oplegging van een geldboete tevens door welke andere straf de boete zal
      worden vervangen, ingeval deze niet binnen de daartoe door hem gestelde termijn is betaald.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel49
  - number: '49.3'
    text: |-
      Het hoofd van de instelling kan voor feiten als bedoeld in [artikel 48, eerste lid][ref1], meer dan één straf
      opleggen, met dien verstande dat de in het eerste lid onder a en e genoemde straffen slechts kunnen worden opgelegd
      voor zover zij te zamen niet langer duren dan twee weken.


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel48
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: '48'
        hoofdstuk: X
  - number: '49.4'
    text: |-
      De oplegging van een straf laat onverlet de mogelijkheid voor het hoofd van de instelling om ter zake van de door
      de verpleegde toegebrachte schade aan eigendommen van de instelling of personeelsleden of medewerkers dan wel van
      medeverpleegden met de verpleegde een regeling te treffen.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel49
  - number: '49.5'
    text: |-
      Indien een straf is opgelegd wordt deze onverwijld ten uitvoer gelegd. Het hoofd van de instelling kan bepalen dat
      een straf niet of slechts ten dele ten uitvoer wordt gelegd.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel49
  - number: '49.6'
    text: |-
      Geen straf kan worden opgelegd indien de verpleegde voor het begaan van een feit als bedoeld in
      [artikel 48, eerste lid][ref1], niet verantwoordelijk kan worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel48
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: '48'
        hoofdstuk: X
  - number: '49.7'
    text: |-
      Van elke strafoplegging dan wel wijziging daarvan houdt het hoofd van de instelling aantekening. Indien een straf
      ingevolge [hoofdstuk XIII][ref1], [XIV][ref2] of [XV][ref3] geheel of ten dele wordt herzien, houdt het hoofd van
      de instelling hiervan aantekening.


      [ref1]: https://wetten.overheid.nl/BWBR0008765#HoofdstukXIII
      [ref2]: https://wetten.overheid.nl/BWBR0008765#HoofdstukXIV
      [ref3]: https://wetten.overheid.nl/BWBR0008765#HoofdstukXV
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0008765
        hoofdstuk: XIII
      - id: ref2
        bwb_id: BWBR0008765
        hoofdstuk: XIV
      - id: ref3
        bwb_id: BWBR0008765
        hoofdstuk: XV
  - number: '50.1'
    text: |-
      Indien de uit de psychische stoornis, psychogeriatrische aandoening of verstandelijke handicap voortvloeiende
      gevaarlijkheid van de ter beschikking gestelde voor de veiligheid van anderen dan de ter beschikking gestelde of
      de algemene veiligheid van personen of goederen dusdanig is teruggebracht dat het verantwoord is hem tijdelijk de
      instelling te doen verlaten, kan het hoofd van de instelling, met machtiging van Onze Minister, de ter beschikking
      gestelde verlof verlenen zich al dan niet onder toezicht buiten de instelling te begeven. Verlof kan omvatten een
      verblijf geheel buiten de instelling.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel50
  - number: '50.2'
    text: |-
      Als algemene voorwaarde geldt dat de ter beschikking gestelde zich niet aan enig misdrijf zal schuldig maken.
      Het hoofd van de instelling kan aan het verlof bijzondere voorwaarden, het gedrag van de ter beschikking gestelde
      betreffende, verbinden. Deze voorwaarden kunnen inhouden dat de ter beschikking gestelde zich dient te gedragen
      overeenkomstig de door de toezichthouder gegeven aanwijzingen.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel50
  - number: '50.3'
    text: |-
      Het hoofd van de instelling kan het verlof intrekken, indien dit noodzakelijk is met het oog op de bescherming van
      de maatschappij tegen de gevaarlijkheid van de ter beschikking gestelde voor de veiligheid van anderen dan de ter
      beschikking gestelde of de algemene veiligheid van personen of goederen of indien de ter beschikking gestelde een
      bepaalde voorwaarde niet nakomt.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel50
  - number: '50.4'
    text: |-
      Het bepaalde in het eerste tot en met het derde lid is van overeenkomstige toepassing op verpleegden die niet ter
      beschikking zijn gesteld.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel50
  - number: '50.5'
    text: |-
      Het hoofd van de instelling stelt de ter beschikking gestelde of anderszins verpleegde in de gelegenheid de
      instelling voor verpleging van ter beschikking gestelden te verlaten teneinde een gerechtelijke procedure bij te
      wonen:
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel50
  - number: 50.5.a
    text: indien hij krachtens wettelijk voorschrift verplicht is voor een rechter of bestuursorgaan te verschijnen;
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel50
  - number: 50.5.b
    text: indien hij terzake van een misdrijf moet terecht staan;
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel50
  - number: 50.5.c
    text: |-
      indien hij bij het bijwonen van de procedure een aanmerkelijk belang heeft en tegen het verlaten van de instelling
      hiertoe geen overwegend bezwaar bestaat.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel50
  - number: '50.6'
    text: Het hoofd van de instelling kan bepalen dat tijdens het verlaten van de instelling toezicht wordt uitgeoefend.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel50
  - number: '51.1'
    text: |-
      Indien de uit de psychische stoornis, psychogeriatrische aandoening of verstandelijke handicap voortvloeiende
      gevaarlijkheid van de ter beschikking gestelde voor de veiligheid van anderen dan de ter beschikking gestelde of
      de algemene veiligheid van personen of goederen dusdanig is teruggebracht dat het verantwoord is hem bij wijze van
      proef in de maatschappij te doen terugkeren, kan het hoofd van de instelling, met machtiging van Onze Minister, de
      ter beschikking gestelde proefverlof verlenen.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel51
  - number: '51.2'
    text: |-
      [Artikel 50, tweede lid, eerste en tweede volzin][ref1], is van overeenkomstige toepassing. De bijzondere
      voorwaarden kunnen inhouden dat de ter beschikking gestelde zich voor het verkrijgen van hulp en steun wendt tot
      een in de machtiging van Onze Minister aangewezen instelling, die aan bepaalde, bij algemene maatregel van bestuur
      te stellen eisen, voldoet. Bij het verlenen van hulp en steun wordt de identiteit van de ter beschikking gestelde
      vastgesteld. [Artikel 27a, eerste lid, eerste volzin, en tweede lid, van het Wetboek van Strafvordering][ref2] is
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel50
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel27a
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: '50'
        hoofdstuk: XI
      - id: ref2
        bwb_id: BWBR0001903
        artikel: 27a
  - number: '51.3'
    text: |-
      De ter beschikking gestelde aan wie proefverlof is verleend, geniet, behoudens de verplichtingen die voortvloeien
      uit hem opgelegde voorwaarden, vrijheid van beweging. [Artikel 50, derde lid][ref1], is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel50
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: '50'
        hoofdstuk: XI
  - number: '51.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden met betrekking tot het verlof en het proefverlof nadere
      regels gesteld.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel51
  - number: '52.1'
    text: |-
      Het hoofd van de instelling draagt zorg dat de verpleegde bij binnenkomst in de instelling, schriftelijk en zoveel
      mogelijk in een voor hem begrijpelijke taal, op de hoogte wordt gesteld van zijn bij of krachtens deze wet gestelde
      rechten en plichten.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel52
  - number: '52.2'
    text: 'De verpleegde wordt hierbij in het bijzonder gewezen op diens bevoegdheid:'
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel52
  - number: 52.2.a
    text: |-
      een verzoek tot bemiddeling in te dienen overeenkomstig het bepaalde in [hoofdstuk XIII][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008765#HoofdstukXIII
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0008765
        hoofdstuk: XIII
  - number: 52.2.b
    text: een klaag- of beroepschrift in te dienen overeenkomstig het bepaalde in de hoofdstukken XIV tot en met XVI.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel52
  - number: '52.3'
    text: |-
      Een verpleegde vreemdeling wordt bij binnenkomst in de instelling geïnformeerd over zijn recht de consulaire
      vertegenwoordiger van zijn land van zijn vrijheidsbeneming op de hoogte te laten stellen.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel52
  - number: '53.1'
    text: |-
      De verpleegde wordt, zoveel mogelijk in een voor hem begrijpelijke taal, gehoord althans daartoe in de gelegenheid
      gesteld alvorens een beslissing wordt genomen omtrent:
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel53
  - number: 53.1.a
    text: |-
      de plaatsing of voortzetting van het verblijf op een afdeling van intensieve zorg als bedoeld in
      [artikel 32][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel32
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: '32'
        hoofdstuk: VI
  - number: 53.1.b
    text: |-
      een beperking van de bewegingsvrijheid als bedoeld in de [artikelen 33][ref1] of [34][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0008765#Artikel34
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: '33'
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0008765
        artikel: '34'
        hoofdstuk: VI
  - number: 53.1.c
    text: |-
      een beperking van het recht op onaantastbaarheid van het lichaam als bedoeld in [artikelen 25 tot en met 27][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel25
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: '25'
        hoofdstuk: V
  - number: 53.1.d
    text: |-
      het verrichten van geneeskundige behandeling als bedoeld in [artikel 16b, onder a of b][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel16b
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: 16b
        hoofdstuk: IV
  - number: 53.1.e
    text: |-
      de beslissingen met betrekking tot de onderbrenging van een kind in de instelling als bedoeld in
      [artikel 47][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel47
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: '47'
        hoofdstuk: IX
  - number: 53.1.f
    text: |-
      de oplegging van een disciplinaire straf als bedoeld in [artikel 49][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel49
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: '49'
        hoofdstuk: X
  - number: 53.1.g
    text: |-
      de observatie door middel van een camera, bedoeld in [artikel 34a, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel34a
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: 34a
        hoofdstuk: VI
  - number: '53.2'
    text: |-
      De ter beschikking gestelde wordt, zoveel mogelijk in een voor hem begrijpelijke taal, gehoord althans daartoe in
      de gelegenheid gesteld alvorens een beslissing wordt genomen omtrent:
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel53
  - number: 53.2.a
    text: |-
      de beslissingen met betrekking tot de plaatsing of overplaatsing overeenkomstig het bepaalde in
      [hoofdstuk 6 van de Wet forensische zorg][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0040634#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0040634
        hoofdstuk: '6'
  - number: 53.2.b
    text: |-
      de intrekking van een verlof of proefverlof als bedoeld in onderscheidenlijk de [artikelen 50, derde lid][ref1],
      en [51, derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel50
      [ref2]: https://wetten.overheid.nl/BWBR0008765#Artikel51
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: '50'
        hoofdstuk: XI
      - id: ref2
        bwb_id: BWBR0008765
        artikel: '51'
        hoofdstuk: XI
  - number: '53.3'
    text: |-
      Zo nodig geschiedt het horen van betrokkene met bijstand van een tolk. Van het horen van betrokkene wordt
      aantekening gehouden.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel53
  - number: '53.4'
    text: 'Het horen van betrokkene kan achterwege blijven, indien:'
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel53
  - number: 53.4.a
    text: de vereiste spoed zich daartegen verzet;
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel53
  - number: 53.4.b
    text: de gemoedstoestand van betrokkene daaraan in de weg staat.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel53
  - number: '54.1'
    text: |-
      De verpleegde ontvangt onverwijld, schriftelijk en voor zoveel mogelijk in een voor hem begrijpelijke taal, een met
      redenen omklede, gedagtekende en ondertekende mededeling betreffende:
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel54
  - number: 54.1.a
    text: |-
      elke beslissing als bedoeld in [artikel 53, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel53
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: '53'
        hoofdstuk: XII
  - number: 54.1.b
    text: |-
      de weigering van verzending of uitreiking van een brief of ander poststuk dan wel van bijgesloten voorwerpen als
      bedoeld in [artikel 35, vijfde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel35
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: '35'
        hoofdstuk: VII
  - number: 54.1.c
    text: |-
      de weigering van de toelating tot de verpleegde van bezoek of een bepaalde bezoeker als bedoeld in
      [artikel 37, derde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel37
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: '37'
        hoofdstuk: VII
  - number: 54.1.d
    text: |-
      de weigering van het voeren van telefoongesprekken of een bepaald telefoongesprek als bedoeld in
      [artikel 38, derde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel38
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: '38'
        hoofdstuk: VII
  - number: 54.1.e
    text: |-
      het verbod van een contact met een vertegenwoordiger van de media als bedoeld in [artikel 39, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel39
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: '39'
        hoofdstuk: VII
  - number: '54.2'
    text: |-
      De ter beschikking gestelde ontvangt onverwijld, schriftelijk en voor zoveel mogelijk in een voor hem begrijpelijke
      taal, een met redenen omklede, gedagtekende en ondertekende mededeling omtrent elke beslissing als bedoeld in
      [artikel 53, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel53
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: '53'
        hoofdstuk: XII
  - number: '54.3'
    text: |-
      Betrokkene wordt, voor zover van toepassing, in de mededeling gewezen op de mogelijkheid van bemiddeling, beklag
      of beroep en de wijze waarop en de termijn waarbinnen dit moet worden gedaan alsmede op de mogelijkheid van het
      doen van een verzoek aan de voorzitter van de beroepscommissie om hangende de uitspraak op het klaagschrift de
      tenuitvoerlegging van de beslissing geheel of gedeeltelijk te schorsen.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel54
  - number: '54.4'
    text: |-
      Indien ter zake van de beslissing de machtiging van Onze Minister vereist is, wordt aan de mededeling een afschrift
      daarvan gehecht.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel54
  - number: '55.1'
    text: |-
      De verpleegde heeft het recht zich, mondeling of schriftelijk, tot de commissie van toezicht te wenden met het
      verzoek te bemiddelen ter zake van een grief omtrent de wijze waarop het hoofd van de instelling zich in een
      bepaalde aangelegenheid jegens hem heeft gedragen of een bij of krachtens deze wet gestelde zorgplicht betracht.
      Een gedraging van een personeelslid of medewerker van de instelling jegens de verpleegde wordt met het oog op de
      toepassing van deze bepaling als een gedraging van het hoofd van de instelling aangemerkt.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel55
  - number: '55.2'
    text: |-
      Indien de grief een beslissing betreft waartegen beklag openstaat, dient dit verzoek uiterlijk op de zevende dag na
      die waarop de verpleegde kennis heeft gekregen van die beslissing te worden ingediend.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel55
  - number: '55.3'
    text: |-
      De commissie van toezicht streeft ernaar binnen vier weken een voor beide partijen aanvaardbare oplossing te
      bereiken. Zij kan de bemiddeling geheel of ten dele aan de maandcommissaris of een ander uit haar midden aangewezen
      lid opdragen.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel55
  - number: '55.4'
    text: |-
      De commissie van toezicht stelt de verpleegde en het hoofd van de instelling in de gelegenheid, al dan niet in
      elkaars tegenwoordigheid, hun standpunt mondeling toe te lichten. Indien de verpleegde de Nederlandse taal niet
      voldoende beheerst, draagt de commissie van toezicht zorg voor de bijstand van een tolk.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel55
  - number: '55.5'
    text: |-
      Zij sluit de bemiddeling af met een mededeling van haar bevindingen aan het hoofd van de instelling en de
      verpleegde. In de gevallen, bedoeld in [artikel 56][ref1], wordt de verpleegde gewezen op de mogelijkheid van
      beklag en de wijze waarop en de termijn waarbinnen dit moet worden gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel56
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: '56'
        hoofdstuk: XIV
  - number: '55.6'
    text: |-
      Indien het hoofd van de instelling of de verpleegde hierom verzoekt, wordt hem zo spoedig mogelijk een gedagtekend
      afschrift van de mededeling toegezonden of uitgereikt. De datum van die toezending of uitreiking wordt op dit
      afschrift aangetekend. Indien de verpleegde de Nederlandse taal niet voldoende begrijpt, draagt de commissie van
      toezicht zorg voor een vertaling van de mededeling.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel55
  - number: '56.1'
    text: |-
      Een verpleegde kan bij de beklagcommissie beklag doen over de volgende door het hoofd van de instelling genomen
      beslissingen:
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel56
  - number: 56.1.a
    text: |-
      de oplegging van een disciplinaire straf als bedoeld in [artikel 49][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel49
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: '49'
        hoofdstuk: X
  - number: 56.1.b
    text: |-
      de plaatsing of voortzetting van het verblijf op een afdeling voor intensieve zorg als bedoeld in
      [artikel 32, eerste en tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel32
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: '32'
        hoofdstuk: VI
  - number: 56.1.c
    text: |-
      een beslissing die een beperking inhoudt van het contact met de buitenwereld als bedoeld in [hoofdstuk VII][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008765#HoofdstukVII
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0008765
        hoofdstuk: VII
  - number: 56.1.d
    text: |-
      de weigering of intrekking van de toestemming om een kind in de instelling onder te brengen als bedoeld in
      [artikel 47, eerste en vierde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel47
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: '47'
        hoofdstuk: IX
  - number: 56.1.e
    text: |-
      enige andere beslissing die een beperking inhoudt van een recht, dat hem op grond van een bij of krachtens deze
      wet gegeven voorschrift dan wel enig ander wettelijk voorschrift of een een ieder verbindende bepaling van een in
      Nederland geldend verdrag toekomt behoudens het gestelde in [artikel 57][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel57
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: '57'
        hoofdstuk: XIV
  - number: '56.2'
    text: |-
      Een verpleegde kan bij de beklagcommissie beklag doen over de volgende door het hoofd van de instelling genomen
      beslissing tot:
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel56
  - number: 56.2.a
    text: |-
      de intrekking van verlof als bedoeld in [artikel 50, derde lid][ref1], indien het verlof op het moment dat het
      wordt ingetrokken een aaneengesloten periode van meer dan een week heeft geduurd;


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel50
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: '50'
        hoofdstuk: XI
  - number: 56.2.b
    text: |-
      tegen de intrekking van het proefverlof als bedoeld in [artikel 51, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel51
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: '51'
        hoofdstuk: XI
  - number: '56.3'
    text: |-
      Een beslissing van een personeelslid of medewerker van de instelling wordt met het oog op de toepassing van deze
      bepaling als een beslissing van het hoofd van de instelling aangemerkt.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel56
  - number: '56.4'
    text: |-
      Tegen de wijze waarop het hoofd van de instelling een bij of krachtens deze wet gestelde zorgplicht betracht staat
      geen beklag open.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel56
  - number: '56.5'
    text: |-
      Met een beslissing als bedoeld in het eerste lid wordt gelijk gesteld een weigering om te beslissen. Het nemen
      van een beslissing wordt geacht te zijn geweigerd, indien niet binnen de wettelijke of, bij het ontbreken daarvan,
      binnen een redelijke termijn een beslissing is genomen.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel56
  - number: '56.6'
    text: |-
      Het hoofd van de instelling draagt zorg dat een verpleegde die beklag wenst te doen daartoe zo spoedig mogelijk in
      de gelegenheid wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel56
  - number: '57.1'
    text: |-
      Tegen een beslissing tot beperking van de bewegingsvrijheid als bedoeld in [artikel 33][ref1] staat beklag open
      nadat deze een week heeft geduurd.


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel33
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: '33'
        hoofdstuk: VI
  - number: '57.2'
    text: |-
      Tegen een beslissing tot separatie en de duur van de separatie staat beklag open nadat de separatie een dag heeft
      geduurd.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel57
  - number: '57.3'
    text: |-
      Tegen een beslissing tot afzondering en de duur van de afzondering staat beklag open, nadat de afzondering twee
      dagen heeft geduurd.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel57
  - number: '57.4'
    text: De dag waarop een beslissing als bedoeld in het eerste tot en met derde lid is genomen blijft buiten beschouwing.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel57
  - number: '57.5'
    text: |-
      Tegen de beslissing tot verlenging van de separatie of afzondering op de voet van het bepaalde in
      [artikel 34, vierde lid][ref1], staat beklag open.


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel34
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: '34'
        hoofdstuk: VI
  - number: '57.6'
    text: |-
      Tegen de beslissing tot het toepassen van cameraobservatie op grond van [artikel 34a, eerste lid][ref1], staat
      beklag open.


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel34a
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: 34a
        hoofdstuk: VI
  - number: '58.1'
    text: |-
      De verpleegde doet beklag door de indiening van een klaagschrift bij de secretaris van de beklagcommissie van de
      instelling waar de beslissing waarover hij klaagt is genomen.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel58
  - number: '58.2'
    text: |-
      De indiening van het klaagschrift kan door tussenkomst van het hoofd van de instelling waar de verpleegde verblijft
      geschieden. Het hoofd van de instelling draagt in dat geval zorg dat het klaagschrift, of, indien het klaagschrift
      zich in een gesloten envelop bevindt de envelop, van een dagtekening wordt voorzien.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel58
  - number: '58.3'
    text: |-
      Het klaagschrift vermeldt zo nauwkeurig mogelijk de beslissing waarover wordt geklaagd en de redenen van het
      beklag. Indien de verpleegde omtrent de beslissing waarover hij klaagt geen verzoek tot bemiddeling heeft gedaan,
      vermeldt hij de redenen hiervoor in het klaagschrift.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel58
  - number: '58.4'
    text: |-
      Indien de verpleegde de Nederlandse taal niet voldoende beheerst, kan hij het klaagschrift in een andere taal
      indienen. De voorzitter van de beklagcommissie kan bepalen dat het klaagschrift in de Nederlandse taal wordt
      vertaald. De vergoeding van de voor de vertaling gemaakte kosten geschiedt volgens regelen te stellen bij algemene
      maatregel van bestuur
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel58
  - number: '58.5'
    text: |-
      Het klaagschrift moet uiterlijk op de zevende dag na die waarop de verpleegde kennis heeft gekregen van de
      beslissing waarover hij zich wenst te beklagen worden ingediend. Als dag waarop het klaagschrift is ingediend,
      geldt die van de ontvangst door de secretaris dan wel de dagtekening, bedoeld in het tweede lid. Een na afloop van
      deze termijn ingediend klaagschrift is niettemin ontvankelijk, indien redelijkerwijs niet kan worden geoordeeld dat
      de verpleegde in verzuim is geweest.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel58
  - number: '58.6'
    text: |-
      Ingeval de verpleegde een verzoek tot bemiddeling inzake de bestreden beslissing heeft gedaan, dan moet, in
      afwijking van het bepaalde in het vijfde lid, het klaagschrift worden ingediend uiterlijk op de zevende dag na die
      waarop de verpleegde de schriftelijke mededeling van de bevindingen van de commissie van toezicht heeft ontvangen.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel58
  - number: '59.1'
    text: |-
      Het klaagschrift wordt behandeld door een door de commissie van toezicht uit haar midden benoemde beklagcommissie,
      bestaande uit drie leden, die wordt bijgestaan door een secretaris. Een lid van de commissie van toezicht neemt
      geen deel aan de behandeling van het klaagschrift, indien hij heeft bemiddeld ter zake van de beslissing waarop het
      klaagschrift betrekking heeft of daarmede op enige andere wijze bemoeienis heeft gehad.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel59
  - number: '59.2'
    text: |-
      Onze Minister kan, bij private instellingen met een bijzondere aanwijzing als bedoeld in
      [artikel 3.3, eerste lid van de Wet forensische zorg][ref1] op voordracht van het bestuur, leden van andere
      commissies van toezicht aanwijzen die van een beklagcommissie deel uit kunnen maken.


      [ref1]: https://wetten.overheid.nl/BWBR0040634#Artikel3
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0040634
        artikel: '3'
  - number: '59.3'
    text: |-
      De voorzitter dan wel een door hem aangewezen lid van de beklagcommissie kan, indien hij het beklag van eenvoudige
      aard, dan wel kennelijk niet ontvankelijk, kennelijk ongegrond of kennelijk gegrond acht, als enkelvoudig lid van
      de beklagcommissie het klaagschrift afdoen, met dien verstande dat hij tevens de bevoegdheden bezit die aan de
      voorzitter van de voltallige beklagcommissie toekomen.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel59
  - number: '59.4'
    text: |-
      De voorzitter, dan wel het door hem aangewezen lid als bedoeld in het derde lid, kan de behandeling te allen tijde
      verwijzen naar de voltallige beklagcommissie.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel59
  - number: '59.5'
    text: |-
      De behandeling van het klaagschrift vindt niet in het openbaar plaats, behoudens ingeval de beklagcommissie van
      oordeel is dat de niet openbare behandeling niet verenigbaar is met enige een ieder verbindende bepaling van een in
      Nederland geldend verdrag.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel59
  - number: '60.1'
    text: |-
      De secretaris van de beklagcommissie zendt het hoofd van de instelling een afschrift van het klaagschrift toe.
      Het hoofd van de instelling geeft dienaangaande zo spoedig mogelijk schriftelijk de nodige inlichtingen aan de
      beklagcommissie, tenzij hij van oordeel is dat het klaagschrift kennelijk niet-ontvankelijk of kennelijk ongegrond
      is. Hij voegt daaraan de opmerkingen toe waartoe het klaagschrift hem overigens aanleiding geeft. Aan de klager
      geeft de secretaris van de beklagcommissie schriftelijk kennis van de inhoud van deze inlichtingen en opmerkingen.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel60
  - number: '60.2'
    text: |-
      Indien de commissie van toezicht omtrent de beslissing waarover wordt geklaagd heeft bemiddeld en zij haar
      bevindingen schriftelijk aan de klager en het hoofd van de instelling heeft medegedeeld, voegt de secretaris van de
      beklagcommissie de bevindingen bij de processtukken.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel60
  - number: '61.1'
    text: |-
      De beklagcommissie stelt de klager en het hoofd van de instelling in de gelegenheid omtrent het klaagschrift
      mondeling opmerkingen te maken, tenzij zij het beklag aanstonds kennelijk niet-ontvankelijk, kennelijk ongegrond of
      kennelijk gegrond acht.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel61
  - number: '61.2'
    text: |-
      De klager en het hoofd van de instelling kunnen de voorzitter van de beklagcommissie de vragen opgeven die zij aan
      elkaar gesteld wensen te zien.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel61
  - number: '61.3'
    text: |-
      De beklagcommissie kan het hoofd van de instelling en de klager buiten elkaars aanwezigheid horen. In dat geval
      worden zij in de gelegenheid gesteld vooraf de vragen op te geven die zij gesteld wensen te zien en wordt de
      zakelijke inhoud van de aldus afgelegde verklaring door de voorzitter van de beklagcommissie aan de klager
      onderscheidenlijk het hoofd van de instelling mondeling medegedeeld.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel61
  - number: '61.4'
    text: |-
      De beklagcommissie kan ook bij andere personen mondeling of schriftelijk inlichtingen inwinnen. Indien mondeling
      inlichtingen worden ingewonnen zijn het tweede en derde lid van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel61
  - number: '62.1'
    text: |-
      De klager heeft het recht zich te doen bijstaan door een rechtsbijstandverlener of een andere vertrouwenspersoon,
      die daartoe van de beklagcommissie toestemming heeft gekregen. Indien aan de klager een advocaat is toegevoegd,
      geschieden diens beloning en de vergoeding van de door hem gemaakte kosten volgens regelen te stellen bij algemene
      maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel62
  - number: '62.2'
    text: |-
      Indien de klager de Nederlandse taal niet voldoende beheerst, draagt de voorzitter zorg voor de bijstand van een
      tolk. De beloning van de tolk en de vergoeding van de door de tolk gemaakte kosten geschieden volgens regelen te
      stellen bij algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel62
  - number: '62.3'
    text: |-
      Tijdens de beklagprocedure staat de beklagcommissie aan de klager op diens verzoek toe van de gedingstukken kennis
      te nemen.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel62
  - number: '62.4'
    text: |-
      Indien de klager elders verblijft kunnen de opmerkingen als bedoeld in [artikel 61, eerste lid][ref1], op verzoek
      van de beklagcommissie ten overstaan van een lid van een andere beklagcommissie worden gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel61
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: '61'
        hoofdstuk: XIV
  - number: '62.5'
    text: |-
      Van het horen van de betrokkenen maakt de secretaris een schriftelijk verslag, dat door de voorzitter en de
      secretaris wordt ondertekend. Bij verhindering van één van hen wordt de reden daarvan in het verslag vermeld.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel62
  - number: '63'
    text: |-
      De voorzitter van de beklagcommissie kan de behandeling van het klaagschrift voor bepaalde of onbepaalde
      tijd uitstellen, indien hij van oordeel is dat het klaagschrift zich leent voor bemiddeling of indien de
      bemiddelingsprocedure nog niet is afgesloten. In het eerste geval stelt de voorzitter een afschrift van het
      klaagschrift ter hand aan de maandcommissaris of aan een ander lid van de commissie van toezicht met het verzoek om
      te bemiddelen. Artikel 55 is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel63
  - number: '64.1'
    text: |-
      Hangende de uitspraak op het klaagschrift kan de voorzitter van de beroepscommissie op verzoek van de klager,
      na het hoofd van de instelling te hebben gehoord, de tenuitvoerlegging van de beslissing waarop het klaagschrift
      betrekking heeft geheel of gedeeltelijk schorsen.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel64
  - number: '64.2'
    text: De voorzitter doet hiervan onverwijld mededeling aan het hoofd van de instelling en de klager.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel64
  - number: '65.1'
    text: |-
      De beklagcommissie doet zo spoedig mogelijk, doch in ieder geval binnen een termijn van vier weken te rekenen vanaf
      de datum waarop het klaagschrift is ontvangen of, bij toepassing van [artikel 63][ref1], te rekenen vanaf de datum
      waarop de bemiddeling is afgesloten, uitspraak. In bijzondere omstandigheden kan de beklagcommissie deze termijn
      met ten hoogste vier weken verlengen. Van deze verlenging wordt aan het hoofd van de instelling en de klager
      mededeling gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel63
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: '63'
        hoofdstuk: XIV
  - number: '65.2'
    text: |-
      De uitspraak is met redenen omkleed en gedagtekend. Aan de uitspraak is een verslag van de door de beklagcommissie
      gehoorde personen gehecht. Zij wordt door de voorzitter, alsmede door de secretaris ondertekend. Bij verhindering
      van één van hen wordt de reden daarvan in de uitspraak vermeld. Aan de klager en het hoofd van de instelling wordt
      onverwijld en kosteloos een afschrift van de uitspraak van de beklagcommissie toegezonden of uitgereikt. De datum
      van die toezending of uitreiking wordt op dit afschrift aangetekend.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel65
  - number: '65.3'
    text: |-
      De uitspraak vermeldt de mogelijkheid van het instellen van beroep bij de beroepscommissie en de wijze waarop en
      de termijn waarbinnen dit moet worden gedaan alsmede de mogelijkheid van het doen van een verzoek aan de voorzitter
      van de beroepscommissie om hangende de uitspraak op het beroepschrift de tenuitvoerlegging van de uitspraak van de
      beklagcommissie geheel of gedeeltelijk te schorsen.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel65
  - number: '65.4'
    text: |-
      Indien de klager de Nederlandse taal niet voldoende beheerst en in de instelling niet op andere wijze in een
      vertaling kan worden voorzien, draagt de voorzitter van de beklagcommissie zorg voor een vertaling van de uitspraak
      en de mededeling als bedoeld in het tweede, onderscheidenlijk derde lid. De vergoeding van de voor de vertaling
      gemaakte kosten geschieden volgens regelen te stellen bij algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel65
  - number: '65.5'
    text: |-
      De voorzitter van de beklagcommissie kan de uitspraak ook mondeling mededelen aan de klager en het hoofd van de
      instelling. Deze worden daarbij gewezen op de mogelijkheid tot het instellen van beroep bij de beroepscommissie,
      de wijze waarop en de termijn waarbinnen dit moet worden gedaan, alsmede op de mogelijkheid tot schorsing van
      de tenuitvoerlegging van de uitspraak als bedoeld in [artikel 67, zesde lid][ref1]. Als dag van de uitspraak
      geldt de dag van het doen van deze mededeling. Indien mondeling uitspraak wordt gedaan, wordt de uitspraak op het
      klaagschrift aangetekend.


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel67
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: '67'
        hoofdstuk: XV
  - number: '65.6'
    text: |-
      Indien het vijfde lid toepassing heeft gevonden en beroep wordt ingesteld als voorzien in
      [artikel 67, eerste lid][ref1], vindt uitwerking van de uitspraak van de beklagcommissie plaats op de wijze als
      bedoeld in het tweede lid. De secretaris van de beklagcommissie zendt een afschrift van deze uitspraak toe aan het
      hoofd van de instelling, de klager en de beroepscommissie.


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel67
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: '67'
        hoofdstuk: XV
  - number: '65.7'
    text: |-
      De secretaris zendt van alle uitspraken van de beklagcommissie een afschrift naar Onze Minister. Een ieder heeft
      recht op kennisneming van deze uitspraken en het ontvangen van een afschrift daarvan. Onze Minister draagt zorg
      dat dit afschrift geen gegevens bevat waaruit de identiteit van de verpleegde kan worden afgeleid. Met betrekking
      tot de kosten van het ontvangen van een afschrift is het bij of krachtens de [Wet tarieven in strafzaken][ref1]
      bepaalde van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002406
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0002406
  - number: '66.1'
    text: 'De uitspraak van de beklagcommissie strekt tot gehele of gedeeltelijke:'
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel66
  - number: 66.1.a
    text: niet-ontvankelijkverklaring van het beklag;
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel66
  - number: 66.1.b
    text: ongegrondverklaring van het beklag;
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel66
  - number: 66.1.c
    text: gegrondverklaring van het beklag.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel66
  - number: '66.2'
    text: 'Indien de beklagcommissie van oordeel is dat de beslissing waarover is geklaagd:'
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel66
  - number: 66.2.a
    text: |-
      in strijd is met een in de instelling geldend wettelijk voorschrift of een een ieder verbindende bepaling van een
      in Nederland geldend verdrag dan wel
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel66
  - number: 66.2.b
    text: |-
      bij afweging van alle in aanmerking komende belangen, waaronder de veiligheid van de samenleving en de belangen
      van slachtoffers en nabestaanden, onredelijk of onbillijk moet worden geacht, verklaart zij het beklag gegrond en
      vernietigt zij de beslissing geheel of gedeeltelijk.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel66
  - number: '66.3'
    text: 'Bij toepassing van het bepaalde in het tweede lid kan de beklagcommissie:'
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel66
  - number: 66.3.a
    text: het hoofd van de instelling opdragen een nieuwe beslissing te nemen met inachtneming van haar uitspraak;
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel66
  - number: 66.3.b
    text: bepalen dat haar uitspraak in de plaats treedt van de vernietigde beslissing;
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel66
  - number: 66.3.c
    text: volstaan met de gehele of gedeeltelijke vernietiging.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel66
  - number: '66.4'
    text: |-
      Bij toepassing van het bepaalde in het derde lid, onder *a*, kan de beklagcommissie in haar uitspraak een termijn
      stellen.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel66
  - number: '66.5'
    text: |-
      De beklagcommissie kan bepalen dat de uitspraak geheel of gedeeltelijk buiten werking blijft totdat deze
      onherroepelijk is geworden.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel66
  - number: '66.6'
    text: |-
      Indien het bepaalde in het tweede lid toepassing vindt, worden de rechtsgevolgen van de vernietigde beslissing,
      voor zover mogelijk, door het hoofd van de instelling ongedaan gemaakt, dan wel in overeenstemming gebracht met de
      uitspraak van de beklagcommissie.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel66
  - number: '66.7'
    text: |-
      Voor zover de in het zesde lid bedoelde gevolgen niet meer ongedaan te maken zijn, bepaalt de beklagcommissie,
      na het hoofd van de instelling te hebben gehoord, of enige tegemoetkoming aan de klager geboden is. Zij stelt de
      tegemoetkoming, die geldelijk van aard kan zijn, vast.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel66
  - number: 66a.1
    text: |-
      Een verpleegde kan bij de beklagcommissie van de commissie van toezicht voor het vervoer, bedoeld in artikel 15b,
      beklag doen over de beslissingen, bedoeld in [artikel 23, tweede lid][ref1] en [artikel 30, derde lid][ref2], voor
      zover de beslissing is genomen ten behoeve van het vervoer van de verpleegde.


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0008765#Artikel30
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel66a
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: '23'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0008765
        artikel: '30'
        hoofdstuk: V
  - number: 66a.2
    text: |-
      Het hoofd van de inrichting waar de verpleegde verblijft, draagt zorg dat een verpleegde die beklag wenst te doen
      daartoe zo spoedig mogelijk in de gelegenheid wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel66a
  - number: 66a.3
    text: |-
      De [artikelen 58 tot en met 62][ref1] en [65][ref2] zijn van overeenkomstige toepassing, met dien verstande dat
      onder het hoofd van de inrichting in de [artikelen 60][ref3], [61][ref4] en 65 steeds wordt verstaan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel58
      [ref2]: https://wetten.overheid.nl/BWBR0008765#Artikel65
      [ref3]: https://wetten.overheid.nl/BWBR0008765#Artikel60
      [ref4]: https://wetten.overheid.nl/BWBR0008765#Artikel61
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel66a
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: '58'
        hoofdstuk: XIV
      - id: ref2
        bwb_id: BWBR0008765
        artikel: '65'
        hoofdstuk: XIV
      - id: ref3
        bwb_id: BWBR0008765
        artikel: '60'
        hoofdstuk: XIV
      - id: ref4
        bwb_id: BWBR0008765
        artikel: '61'
        hoofdstuk: XIV
  - number: 66b.1
    text: |-
      [Artikel 66, eerste en tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel66
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel66b
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: '66'
        hoofdstuk: XIV
  - number: 66b.2
    text: |-
      Indien het beklag geheel of gedeeltelijk gegrond wordt geacht, bepaalt de beklagcommissie of enige tegemoetkoming
      aan de verpleegde geboden is. Zij stelt de tegemoetkoming, die geldelijk van aard kan zijn, vast.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel66b
  - number: '67.1'
    text: |-
      Tegen de uitspraak van de beklagcommissie, kunnen het hoofd van de instelling en de klager beroep instellen bij
      de beroepscommissie door het indienen van een beroepschrift. Het met redenen omklede beroepschrift moet uiterlijk
      op de zevende dag na die van de ontvangst van het afschrift van de uitspraak onderscheidenlijk na die van de
      mondelinge mededeling van de uitspraak bij de secretaris van de beroepscommissie worden ingediend.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel67
  - number: '67.2'
    text: |-
      Het beroepschrift wordt behandeld door een door de Raad benoemde commissie van tenminste drie leden of buitengewone
      leden, die wordt bijgestaan door een secretaris.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel67
  - number: '67.3'
    text: |-
      De voorzitter dan wel een door hem aangewezen lid van de beroepscommissie die een met rechtspraak belast lid van de
      rechterlijke macht is, kan het beroepschrift enkelvoudig afdoen indien hij het beroep kennelijk niet-ontvankelijk,
      kennelijk ongegrond of kennelijk gegrond acht, met dien verstande dat hij tevens de bevoegdheden bezit die aan de
      voorzitter van de voltallige beroepscommissie toekomen.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel67
  - number: '67.4'
    text: |-
      De voorzitter, dan wel het door hem aangewezen lid, bedoeld in het derde lid, kan de behandeling te allen tijde
      verwijzen naar de voltallige beroepscommissie.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel67
  - number: '67.5'
    text: |-
      Ten aanzien van de behandeling van het beroepschrift zijn [de artikelen 56, vijfde lid][ref1],
      [58, tweede, vierde en vijfde lid, tweede en derde volzin][ref2], [59, vijfde lid][ref3], [60, eerste lid][ref4],
      [61][ref5] en [62, eerste, tweede, derde en vijfde lid][ref6], van overeenkomstige toepassing, met dien verstande
      dat de beroepscommissie kan bepalen dat:


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel56
      [ref2]: https://wetten.overheid.nl/BWBR0008765#Artikel58
      [ref3]: https://wetten.overheid.nl/BWBR0008765#Artikel59
      [ref4]: https://wetten.overheid.nl/BWBR0008765#Artikel60
      [ref5]: https://wetten.overheid.nl/BWBR0008765#Artikel61
      [ref6]: https://wetten.overheid.nl/BWBR0008765#Artikel62
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: '56'
        hoofdstuk: XIV
      - id: ref2
        bwb_id: BWBR0008765
        artikel: '58'
        hoofdstuk: XIV
      - id: ref3
        bwb_id: BWBR0008765
        artikel: '59'
        hoofdstuk: XIV
      - id: ref4
        bwb_id: BWBR0008765
        artikel: '60'
        hoofdstuk: XIV
      - id: ref5
        bwb_id: BWBR0008765
        artikel: '61'
        hoofdstuk: XIV
      - id: ref6
        bwb_id: BWBR0008765
        artikel: '62'
        hoofdstuk: XIV
  - number: 67.5.a
    text: |-
      het hoofd van de instelling en de klager uitsluitend in de gelegenheid worden gesteld omtrent het beroepschrift
      schriftelijk opmerkingen te maken;
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel67
  - number: 67.5.b
    text: de mondelinge opmerkingen ten overstaan van een lid van de beroepscommissie worden gemaakt;
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel67
  - number: 67.5.c
    text: |-
      ingeval bij een ander persoon mondeling inlichtingen worden ingewonnen, het hoofd van de instelling en de klager
      uitsluitend in de gelegenheid worden gesteld schriftelijk de vragen op te geven die zij aan die persoon gesteld
      wensen te zien.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel67
  - number: '67.6'
    text: |-
      De indiening van het beroepschrift schorst de tenuitvoerlegging van de uitspraak van de beklagcommissie niet,
      behalve voor zover deze de vaststelling van een tegemoetkoming als bedoeld in [artikel 66, zevende lid][ref1],
      inhoudt. Hangende de uitspraak op het beroepschrift kan de voorzitter van de beroepscommissie op verzoek van degene
      die beroep heeft ingesteld en gehoord de andere betrokkene in de procedure de tenuitvoerlegging van de uitspraak
      van de beklagcommissie schorsen. Hij doet hiervan onverwijld mededeling aan het hoofd van de instelling en de
      klager.


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel66
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: '66'
        hoofdstuk: XIV
  - number: '68.1'
    text: De beroepscommissie doet zo spoedig mogelijk uitspraak.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel68
  - number: '68.2'
    text: 'De uitspraak van de beroepscommissie strekt tot gehele of gedeeltelijke:'
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel68
  - number: 68.2.a
    text: niet-ontvankelijkverklaring van het beroep;
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel68
  - number: 68.2.b
    text: bevestiging van de uitspraak van de beklagcommissie, hetzij met overneming, hetzij met verbetering van de gronden;
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel68
  - number: 68.2.c
    text: vernietiging van de uitspraak van de beklagcommissie.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel68
  - number: '68.3'
    text: |-
      Indien het bepaalde in het tweede lid, onder *c*, toepassing vindt, doet de beroepscommissie hetgeen de
      beklagcommissie had behoren te doen.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel68
  - number: '68.4'
    text: |-
      Ten aanzien van de uitspraak van de beroepscommissie zijn de
      [artikelen 65, tweede lid, eerste en derde tot en met vijfde volzin, vierde en zevende lid][ref1], en
      [66, met uitzondering van het vijfde lid][ref2], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel65
      [ref2]: https://wetten.overheid.nl/BWBR0008765#Artikel66
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: '65'
        hoofdstuk: XIV
      - id: ref2
        bwb_id: BWBR0008765
        artikel: '66'
        hoofdstuk: XIV
  - number: 68a
    text: |-
      Tegen de uitspraak van de beklagcommissie bedoeld in [hoofdstuk XIVA][ref1] kunnen Onze Minister en de
      verpleegde beroep instellen. [Hoofdstuk XV][ref2] is van overeenkomstige toepassing, met uitzondering van
      [artikel 67, vierde lid, tweede en derde volzin][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0008765#HoofdstukXIVa
      [ref2]: https://wetten.overheid.nl/BWBR0008765#HoofdstukXV
      [ref3]: https://wetten.overheid.nl/BWBR0008765#Artikel67
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel68a
    references:
      - id: ref1
        bwb_id: BWBR0008765
        hoofdstuk: XIVa
      - id: ref2
        bwb_id: BWBR0008765
        hoofdstuk: XV
      - id: ref3
        bwb_id: BWBR0008765
        artikel: '67'
        hoofdstuk: XV
  - number: '69.1'
    text: 'Een ter beschikking gestelde of anderszins verpleegde kan beroep instellen tegen:'
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel69
  - number: 69.1.a
    text: |-
      de plaatsing of overplaatsing overeenkomstig het bepaalde in de [artikelen 6.1, eerste lid][ref1], [6.5][ref2] en
      [6.7 van de Wet forensische zorg][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0040634#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0040634#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0040634#Artikel6
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0040634
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0040634
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0040634
        artikel: '6'
  - number: 69.1.b
    text: |-
      de verlenging van de termijnen, bedoeld in [artikel 6.3, eerste lid][ref1], en
      [artikel, 6.5, vierde lid, van de Wet forensische zorg][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0040634#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0040634#Artikel6
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0040634
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0040634
        artikel: '6'
  - number: 69.1.c
    text: |-
      de intrekking van de machtiging door Onze Minister als bedoeld in de [artikelen 50][ref1] en [51][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel50
      [ref2]: https://wetten.overheid.nl/BWBR0008765#Artikel51
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: '50'
        hoofdstuk: XI
      - id: ref2
        bwb_id: BWBR0008765
        artikel: '51'
        hoofdstuk: XI
  - number: 69.1.d
    text: |-
      de beslissing van het hoofd van de private instelling, bedoeld in [artikel 1, onderdeel h][ref1], inzake intrekking
      van verlof als bedoeld in [artikel 50, derde lid][ref2], indien het verlof op het moment dat het wordt ingetrokken
      een aaneengesloten periode van meer dan een week heeft geduurd;


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0008765#Artikel50
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: '1'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0008765
        artikel: '50'
        hoofdstuk: XI
  - number: 69.1.e
    text: |-
      de beslissing van het hoofd van de private instelling, bedoeld in [artikel 1, onderdeel h][ref1], inzake de
      intrekking van het proefverlof als bedoeld in [artikel 51, derde lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0008765#Artikel51
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: '1'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0008765
        artikel: '51'
        hoofdstuk: XI
  - number: 69.1.f
    text: |-
      enige andere door Onze Minister genomen beslissing die een beperking inhoudt van een recht, dat hem op grond van
      een bij of krachtens deze wet gegeven voorschrift dan wel enig ander wettelijk voorschrift of enige een ieder
      verbindende bepaling van een in Nederland geldend verdrag toekomt;
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel69
  - number: 69.1.g
    text: |-
      een beslissing als bedoeld in het eerste lid van [artikel 16c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel16c
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: 16c
        hoofdstuk: IV
  - number: '69.2'
    text: |-
      Het beroepschrift wordt behandeld door een door de Raad benoemde commissie van drie leden of buitengewone leden,
      die wordt bijgestaan door een secretaris.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel69
  - number: '69.3'
    text: |-
      [Artikel 56, vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel56
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: '56'
        hoofdstuk: XIV
  - number: '69.4'
    text: |-
      Met betrekking tot de behandeling van het beroepschrift zijn de [artikelen 56, vijfde lid][ref1],
      [58, tweede lid, derde lid, met uitzondering van de tweede volzin, vierde en vijfde lid][ref2],
      [59, vijfde lid][ref3], [60, eerste lid][ref4], [61][ref5], [62, eerste, tweede, derde en vijfde lid][ref6], en
      [64][ref7] van overeenkomstige toepassing, met dien verstande dat de commissie kan bepalen dat:


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel56
      [ref2]: https://wetten.overheid.nl/BWBR0008765#Artikel58
      [ref3]: https://wetten.overheid.nl/BWBR0008765#Artikel59
      [ref4]: https://wetten.overheid.nl/BWBR0008765#Artikel60
      [ref5]: https://wetten.overheid.nl/BWBR0008765#Artikel61
      [ref6]: https://wetten.overheid.nl/BWBR0008765#Artikel62
      [ref7]: https://wetten.overheid.nl/BWBR0008765#Artikel64
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel69
    references:
