  - number: '2.1'
    text: |-
      De tenuitvoerlegging van een vrijheidsbenemende straf of maatregel in een instelling wordt zoveel mogelijk
      dienstbaar gemaakt aan de behandeling van de veroordeelde en de voorbereiding op diens terugkeer in de
      maatschappij, met inachtneming van het karakter van die vrijheidsbenemende straf of maatregel. Bij het verlenen van
      vrijheden aan ter beschikking gestelden wordt rekening gehouden met de veiligheid van de samenleving en de belangen
      van slachtoffers en nabestaanden.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel2
  - number: '2.2'
    text: |-
      Personen ten aanzien van wie de tenuitvoerlegging van een vrijheidsbenemende straf of maatregel in een instelling
      plaatsvindt, worden aan geen andere beperkingen onderworpen dan die welke voor het doel van de vrijheidsbeneming of
      in het belang van de handhaving van de orde of de veiligheid in de instelling noodzakelijk zijn.
    url: https://wetten.overheid.nl/BWBR0008765/2023-10-01#Artikel2
  - number: '2.3'
    text: |-
      Indien ter beschikking gestelden als bedoeld in [artikel 1, onderdeel n, van de Wet forensische zorg][ref1],
      verblijven in een private instelling, niet zijnde een instelling als bedoeld in [artikel 1, onderdeel b][ref2],
      zijn voor de duur van dat verblijf de [artikelen 50][ref3], [51][ref4], [69][ref5] en [71][ref6] van de
      Beginselenwet verpleging ter beschikking gestelden en de daarop rustende bepalingen van overeenkomstige toepassing.


