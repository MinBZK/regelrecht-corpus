  - number: '2.1'
    text: |-
      De tenuitvoerlegging van een vrijheidsbenemende straf of maatregel in een inrichting voor verpleging van ter
      beschikking gestelden wordt zoveel mogelijk dienstbaar gemaakt aan de behandeling van de veroordeelde en de
      voorbereiding op diens terugkeer in de maatschappij, met inachtneming van het karakter van die vrijheidsbenemende
      straf of maatregel.
    url: https://wetten.overheid.nl/BWBR0008765/2010-10-01#Artikel2
  - number: '2.2'
    text: |-
      Personen ten aanzien van wie de tenuitvoerlegging van een vrijheidsbenemende straf of maatregel in een inrichting
      voor verpleging van ter beschikking gestelden plaatsvindt, worden aan geen andere beperkingen onderworpen dan die
      welke voor het doel van de vrijheidsbeneming of in het belang van de handhaving van de orde of de veiligheid in de
      inrichting voor verpleging van ter beschikking gestelden noodzakelijk zijn.
    url: https://wetten.overheid.nl/BWBR0008765/2010-10-01#Artikel2
  - number: '3.1'
    text: |-
      De inrichtingen zijn van inrichtingen als bedoeld in
      [artikel 3, eerste lid, van de Penitentiaire beginselenwet][ref1] gescheiden. Onze Minister kan hierop ten aanzien
      van bepaalde inrichtingen een uitzondering maken.


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel3
    url: https://wetten.overheid.nl/BWBR0008765/2010-10-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: '3'
  - number: '3.2'
    text: |-
      Binnen een en dezelfde inrichting verblijven mannelijke en vrouwelijke verpleegden gescheiden van elkaar. Onze
      Minister kan hierop ten aanzien van bepaalde afdelingen een uitzondering maken. Het hoofd van de inrichting
      kan verpleegden van verschillend geslacht, die niet op dezelfde afdeling verblijven, in de gelegenheid stellen
      gezamenlijk aan bepaalde activiteiten deel te nemen of bepaalde werkzaamheden te verrichten.
    url: https://wetten.overheid.nl/BWBR0008765/2010-10-01#Artikel3
  - number: '4.1'
    text: 'Inrichtingen zijn bestemd voor opneming van:'
    url: https://wetten.overheid.nl/BWBR0008765/2010-10-01#Artikel4
  - number: 4.1.a
    text: |-
