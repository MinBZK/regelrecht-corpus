preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is regels vast te stellen omtrent de beginselen waarop de
    verpleging in inrichtingen voor verpleging van ter beschikking gestelden en de rechtspositie van verpleegden, in
    het bijzonder van de ter beschikking gestelden die in justitiële inrichtingen als bedoeld in artikel 90quinquies,
    tweede lid, van het Wetboek van Strafrecht, worden verpleegd, berusten en in verband daarmee enige bepalingen van
    het Wetboek van Strafrecht en de Beginselenwet gevangeniswezen te wijzigen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0008765/2010-10-01#ArtikelAanhef
