$id: wet_medische_hulpmiddelen
regulatory_layer: WET
publication_date: '2022-03-01'
valid_from: '2023-10-05'
bwb_id: BWBR0042755
url: https://wetten.overheid.nl/BWBR0042755/2023-10-05
preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo, Wij in overweging genomen hebben, dat het wenselijk is uitvoering te geven aan Verordening (EU) 2017/745 van
    het Europees Parlement en de Raad van 5 april 2017 betreffende medische hulpmiddelen, tot wijziging van Richtlijn
    2001/83/EG, Verordening (EG) nr. 178/2002 en Verordening (EG) nr. 1223/2009, en tot intrekking van Richtlijnen
    90/385/EEG en 93/42/EEG van de Raad en aan Verordening (EU) 2017/746 van het Europees Parlement en de Raad van 5
    april 2017 betreffende medische hulpmiddelen voor in-vitrodiagnostiek en tot intrekking van Richtlijn 98/79/EG en
    Besluit 2010/227/EU van de Commissie teneinde daarmee het soepel functioneren van de interne markt te garanderen
    en tegelijkertijd hoge kwaliteits- en veiligheidseisen aan medische hulpmiddelen te stellen en in verband hiermee
    de Wet op de medische hulpmiddelen te vervangen door een nieuwe wet en tevens de Wet medisch-wetenschappelijk
    onderzoek met mensen op een aantal onderdelen te wijzigen;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0042755/2023-10-05#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder: - *medisch hulpmiddel:* medisch hulpmiddel als
      gedefinieerd in artikel 2, onderdeel 1, van Verordening (EU) 2017/745;
        - *medisch hulpmiddel voor in-vitrodiagnostiek:* medisch hulpmiddel als gedefinieerd in artikel 2, onderdeel 2, van
      Verordening (EU) 2017/746;
        - *Onze Minister:* Onze Minister voor Medische Zorg;
        - *Verordening (EU) 2017/745:* Verordening (EU) 2017/745 van het Europees Parlement en de Raad van 5 april
      2017 betreffende medische hulpmiddelen, tot wijziging van [Richtlijn 2001/83/EG](32001L0083), Verordening (EG)
      nr. 178/2002 en Verordening (EG) nr. 1223/2009, en tot intrekking van [Richtlijnen 90/385/EEG](31990L0385) en
      [93/42/EEG](31993L0042) van de Raad (PbEU 2017, L 117);
        - *Verordening (EU) 2017/746:* Verordening (EU) 2017/746 van het Europees Parlement en de Raad van 5 april 2017
      betreffende medische hulpmiddelen voor in-vitrodiagnostiek en tot intrekking van [Richtlijn 98/79/EG](31998L0079)
      en Besluit 2010/227/EU van de Commissie (PbEU 2017, L 117);
        - *Verordening (EU) 2019/1020:* [Verordening (EU) 2019/1020](32920R2019) van het Europees Parlement en de Raad van
      20 juni 2019 betreffende markttoezicht en conformiteit van producten en tot wijziging van [Richtlijn 2004/42/EG]
      (32004L0042) en de [Verordeningen (EG) nr. 765/2008](32008R0765) en (EU) [nr. 305/2011](32011R0305) (PbEU 2019,
      L169).
    url: https://wetten.overheid.nl/BWBR0042755/2023-10-05#Artikel1
  - number: '2'
    text: |-
      Deze wet is van toepassing op medische hulpmiddelen waarop Verordening (EU) 2017/745 van toepassing is en op
      medische hulpmiddelen voor in-vitrodiagnostiek waarop Verordening (EU) 2017/746 van toepassing is.
    url: https://wetten.overheid.nl/BWBR0042755/2023-10-05#Artikel2
  - number: '3.1'
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld ter uitvoering van het bepaalde in artikel 18, tweede lid,
      van Verordening (EU) 2017/745.
    url: https://wetten.overheid.nl/BWBR0042755/2023-10-05#Artikel3
  - number: '3.2'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot het gebruik van specifieke
      soorten of categorieën medische hulpmiddelen of medische hulpmiddelen voor in-vitrodiagnostiek van een bij de
      maatregel aangewezen soort in overeenstemming met:
    url: https://wetten.overheid.nl/BWBR0042755/2023-10-05#Artikel3
  - number: 3.2.a
    text: artikel 1, veertiende lid, van Verordening (EU) 2017/745, en artikel 1, achtste lid, van Verordening (EU) 2017/746;
    url: https://wetten.overheid.nl/BWBR0042755/2023-10-05#Artikel3
  - number: 3.2.b
    text: |-
      de artikelen 95, zevende lid, 97, tweede lid, en 98, eerste lid, van Verordening (EU) 2017/745, en de artikelen 90,
      zevende lid, 92, tweede lid, en 93, eerste lid, van Verordening (EU) 2017/746.
    url: https://wetten.overheid.nl/BWBR0042755/2023-10-05#Artikel3
  - number: '3.3'
    text: |-
      In gevallen waarin een spoedige voorziening krachtens het tweede lid, onderdeel b, met uitzondering van artikel 97,
      tweede lid, van Verordening (EU) 2017/745, en artikel 92, tweede lid, van Verordening (EU) 2017/746, in het belang
      van de volksgezondheid of de veiligheid zo dringend geboden is dat de totstandkoming van een daartoe strekkende
      algemene maatregel van bestuur niet kan worden afgewacht, kan Onze Minister ter zake bij ministeriële regeling
      voorlopig geldende regels stellen en daarbij bepalingen van op die artikelen berustende algemene maatregelen van
      bestuur zo nodig buiten toepassing verklaren. De regeling vervalt een jaar nadat het in werking is getreden, of,
      indien binnen die termijn een algemene maatregel van bestuur ter vervanging van dat besluit in werking is getreden,
      op het tijdstip waarop de maatregel in werking treedt. De termijn kan door Onze Minister eenmaal met ten hoogste
      een jaar worden verlengd.
    url: https://wetten.overheid.nl/BWBR0042755/2023-10-05#Artikel3
  - number: '4.1'
    text: |-
      Voor zover Verordening (EU) 2017/745 en Verordening (EU) 2017/746 de bevoegdheid geven tot de vaststelling van de
      taal waarin documenten worden opgesteld, vindt die vaststelling plaats bij regeling van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0042755/2023-10-05#Artikel4
  - number: '4.2'
    text: 'Bij regeling van Onze Minister kunnen regels worden gesteld ter uitvoering van:'
    url: https://wetten.overheid.nl/BWBR0042755/2023-10-05#Artikel4
  - number: 4.2.a
    text: |-
      de artikelen 5, vijfde lid, tweede alinea, 21, tweede lid, tweede alinea, en 27, negende lid, van Verordening (EU)
      2017/745;
    url: https://wetten.overheid.nl/BWBR0042755/2023-10-05#Artikel4
  - number: 4.2.b
    text: de artikelen 5, vijfde lid, tweede alinea, en 24, negende lid, van Verordening (EU) 2017/746.
    url: https://wetten.overheid.nl/BWBR0042755/2023-10-05#Artikel4
  - number: '5.1'
    text: |-
      Herverwerking en verder gebruik van hulpmiddelen voor eenmalig gebruik als bedoeld in artikel 17, eerste lid, van
      Verordening (EU) 2017/745, zijn toegestaan.
    url: https://wetten.overheid.nl/BWBR0042755/2023-10-05#Artikel5
  - number: '5.2'
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld ter uitvoering van artikel 17, negende lid,
      van Verordening (EU) 2017/745.
    url: https://wetten.overheid.nl/BWBR0042755/2023-10-05#Artikel5
  - number: 5b.1
    text: |-
      De fabrikant, dan wel zijn gemachtigde, draagt er zorg voor dat de documentatie, bedoeld in bijlage IX, hoofdstuk
      III, punt 7, van Verordening (EU) 2017/745 en bijlage IX, hoofdstuk III, punt 6, van Verordening (EU) 2017/746
      gedurende in die bijlagen genoemde termijn ter beschikking blijft van Onze Minister, ook indien hij voor het
      verstrijken van die termijn failliet wordt verklaard of zijn bedrijfsactiviteiten staakt.
    url: https://wetten.overheid.nl/BWBR0042755/2023-10-05#Artikel5b
  - number: 5b.2
    text: |-
      De opdrachtgever, dan wel zijn contactpersoon, dan wel zijn wettelijk vertegenwoordiger, draagt er zorg voor dat
      de documentatie, bedoeld in bijlage XV van Verordening (EU) 2017/745 en bijlage XIV bij Verordening (EU) 2017/746
      gedurende in die bijlagen genoemde termijn ter beschikking blijft van Onze Minister, ook indien hij voor het
      verstrijken van die termijn failliet wordt verklaard of zijn bedrijfsactiviteiten staakt.
    url: https://wetten.overheid.nl/BWBR0042755/2023-10-05#Artikel5b
  - number: '6.1'
    text: |-
      Voor de toepassing van dit artikel wordt verstaan onder: - *bijeenkomst:* een georganiseerde samenkomst voor
      natuurlijke personen die betrokken zijn bij de toepassing van een medisch hulpmiddel of een medisch hulpmiddel
      voor in-vitrodiagnostiek die kennelijk uitsluitend tot doel heeft hun kennis en kunde op het gebied van de
      beroepsuitoefening, de patiëntenzorg of de toepassing van medische hulpmiddelen of medische hulpmiddelen voor in-
      vitrodiagnostiek te bevorderen;
        - *deelnamekosten:* de kosten voor deelname aan bijeenkomsten of manifestaties, waaronder de daaraan verbonden
      reis- en verblijfskosten;
        - *dienstverlening:* het verrichten van een prestatie door een natuurlijke persoon die betrokken is bij de
      toepassing van een medisch hulpmiddel of van een medisch hulpmiddel voor in-vitrodiagnostiek, of door een
      instelling voor de door de leverancier verstrekte of aangeboden gelden of op geld waardeerbare goederen of
      diensten;
        - *gunstbetoon:* het door een leverancier in het vooruitzicht stellen, aanbieden of toekennen van geld of op geld
      waardeerbare diensten of goederen aan een natuurlijke persoon die betrokken is bij de toepassing van een medisch
      hulpmiddel of van een medisch hulpmiddel voor in-vitrodiagnostiek, of aan een instelling of zorgverzekeraar met het
      kennelijke doel de verkoop van een medisch hulpmiddel of medisch hulpmiddel voor in-vitrodiagnostiek te bevorderen;
        - *instelling:* een instelling als bedoeld in
      [artikel 1, eerste lid, van de Wet kwaliteit, klachten en geschillen zorg][ref1];
        - *leverancier:* de natuurlijke persoon of rechtspersoon die een medisch hulpmiddel of een medisch hulpmiddel voor
      in-vitrodiagnostiek invoert, voorhanden heeft of op de markt aanbiedt;
        - *manifestatie:* een georganiseerde samenkomst van natuurlijke personen die betrokken zijn bij de toepassing van
      een medisch hulpmiddel of van een medisch hulpmiddel voor in-vitrodiagnostiek die kennelijk tot doel heeft het
      toepassen van medische hulpmiddelen of medische hulpmiddelen voor in-vitrodiagnostiek te bevorderen;
        - *zorgverzekeraar:* een zorgverzekeraar als bedoeld in [artikel 1, onderdeel b, van de Zorgverzekeringswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0014682#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel1
    url: https://wetten.overheid.nl/BWBR0042755/2023-10-05#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0014682
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0018450
        artikel: '1'
  - number: '6.2'
    text: |-
      Voor de toepassing van dit artikel wordt onder gunstbetoon tevens verstaan het aanvaarden, of het doen van
      een aanbod daartoe, door een natuurlijke persoon die betrokken is bij de toepassing van een medisch hulpmiddel
      of medisch hulpmiddel voor in-vitrodiagnostiek of door een instelling of zorgverzekeraar, van geld of op geld
      waardeerbare diensten of goederen die door een leverancier in het vooruitzicht worden gesteld, worden aangeboden of
      worden toegekend, met het kennelijke doel de verkoop van een medisch hulpmiddel of van een medisch hulpmiddel voor
      in-vitrodiagnostiek te bevorderen.
    url: https://wetten.overheid.nl/BWBR0042755/2023-10-05#Artikel6
  - number: '6.3'
    text: 'Gunstbetoon is verboden, tenzij:'
    url: https://wetten.overheid.nl/BWBR0042755/2023-10-05#Artikel6
  - number: 6.3.a
    text: |-
      het betreft een vergoeding van of het niet in rekening brengen van deelnamekosten, mits dit beperkt blijft tot
      hetgeen strikt noodzakelijk is om aan de bijeenkomst of manifestatie deel te nemen;
    url: https://wetten.overheid.nl/BWBR0042755/2023-10-05#Artikel6
  - number: 6.3.b
    text: |-
      het betreft dienstverlening, mits deze redelijk is in verhouding tot het verstrekte of aangeboden geld of tot de
      op geld waardeerbare goederen of diensten, in een schriftelijke overeenkomst is vastgelegd en relevant is voor de
      leverancier of voor de beroepsuitoefening van de natuurlijke persoon die betrokken is bij de toepassing van een
      medisch hulpmiddel of van een medisch hulpmiddel voor in-vitrodiagnostiek;
    url: https://wetten.overheid.nl/BWBR0042755/2023-10-05#Artikel6
  - number: 6.3.c
    text: |-
      het betreft geld of op geld waardeerbare diensten of goederen, waartegenover geen prestatie staat van de
      natuurlijke persoon die betrokken is bij de toepassing van een medisch hulpmiddel of van een medisch hulpmiddel
      voor in-vitrodiagnostiek, mits deze een geringe waarde hebben en relevant zijn voor de uitoefening van diens
      beroep;
    url: https://wetten.overheid.nl/BWBR0042755/2023-10-05#Artikel6
  - number: 6.3.d
    text: |-
      het betreft kortingen en bonussen die betrekking hebben op de inkoop van medische hulpmiddelen of van medische
      hulpmiddelen voor in-vitrodiagnostiek.
    url: https://wetten.overheid.nl/BWBR0042755/2023-10-05#Artikel6
  - number: '7.1'
    text: |-
      Onze Minister kan de kosten die samenhangen met het verrichten van werkzaamheden als bedoeld in [Verordening (EU)
      2017/745](32645R2017), [Verordening (EU) 2017/746](32646R2017) en [Verordening (EU) 2019/1020](32920R2019) ten
      laste brengen van degene ten behoeve van wie deze werkzaamheden worden verricht.
    url: https://wetten.overheid.nl/BWBR0042755/2023-10-05#Artikel7
  - number: '7.2'
    text: De bedragen ter vergoeding van de kosten worden bij ministeriële regeling vastgesteld.
    url: https://wetten.overheid.nl/BWBR0042755/2023-10-05#Artikel7
  - number: '8.1'
    text: |-
      Onze Minister wijst de voor de aangemelde instanties verantwoordelijke autoriteit aan, bedoeld in artikel 35,
      eerste lid, van Verordening (EU) 2017/745, en artikel 31, eerste lid, van Verordening (EU) 2017/746. De voor de
      aangemelde instanties verantwoordelijke autoriteit neemt die verordeningen in acht.
    url: https://wetten.overheid.nl/BWBR0042755/2023-10-05#Artikel8
  - number: '8.2'
    text: 'De voor de aangemelde instanties aangewezen verantwoordelijke autoriteit is bevoegd tot:'
    url: https://wetten.overheid.nl/BWBR0042755/2023-10-05#Artikel8
  - number: 8.2.a
    text: |-
      aanwijzing van de conformiteitsbeoordelingsinstantie als bedoeld in artikel 42, eerste lid, van Verordening (EU)
      2017/745, en artikel 38, eerste lid, van Verordening (EU) 2017/746;
    url: https://wetten.overheid.nl/BWBR0042755/2023-10-05#Artikel8
  - number: 8.2.b
    text: |-
      schorsing, beperking en gehele of gedeeltelijke intrekking van de aanwijzing als bedoeld in artikel 46, vierde lid,
      van Verordening (EU) 2017/745, en in artikel 42, vierde lid, van Verordening (EU) 2017/746.
    url: https://wetten.overheid.nl/BWBR0042755/2023-10-05#Artikel8
  - number: '8.3'
    text: |-
      Op de ingevolge het tweede lid, onderdeel a, aangewezen conformiteitsbeoordelingsinstantie is de
      [Kaderwet zelfstandige bestuursorganen][ref1] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020495
    url: https://wetten.overheid.nl/BWBR0042755/2023-10-05#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0020495
  - number: '8.4'
    text: |-
      Onze Minister wijst de bevoegde autoriteit aan, bedoeld in artikel 59, eerste lid, van Verordening (EU) 2017/745,
      en in artikel 54, eerste lid, van Verordening (EU) 2017/746. De aangewezen autoriteit neemt die verordeningen in
      acht.
    url: https://wetten.overheid.nl/BWBR0042755/2023-10-05#Artikel8
  - number: '9'
    text: |-
      Onverminderd het elders bij of krachtens deze wet en in de [Wet medisch-wetenschappelijk onderzoek met mensen][ref1]
      bepaalde, wijst Onze Minister de bevoegde autoriteiten aan, bedoeld in artikel 101 van Verordening (EU) 2017/745,
      en in artikel 96, van Verordening (EU) 2017/746. De aangewezen autoriteiten nemen die verordeningen in acht.


      [ref1]: https://wetten.overheid.nl/BWBR0009408
    url: https://wetten.overheid.nl/BWBR0042755/2023-10-05#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0009408
  - number: 9a
    text: |-
      Degenen die deskundig zijn om een voorschrift met specifieke ontwerpkenmerken af te geven voor een hulpmiddel naar
      maat als bedoeld in artikel 2, onderdeel 3, van Verordening (EU) 2017/745, zijn daartoe bevoegd.
    url: https://wetten.overheid.nl/BWBR0042755/2023-10-05#Artikel9a
  - number: '10'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet en van het bepaalde bij of krachtens
      [Verordening (EU) 2017/745](32645R2017), [Verordening (EU) 2017/746](32646R2017) en [Verordening (EU) 2019/1020]
      (32920R2019) zijn belast de inspecteurs van de Inspectie gezondheidszorg en jeugd.
    url: https://wetten.overheid.nl/BWBR0042755/2023-10-05#Artikel10
  - number: 10a.1
    text: |-
      De toezichthouders, bedoeld in [artikel 10][ref1], zijn in afwijking van
      [artikel 5:15, eerste lid, van de Algemene wet bestuursrecht][ref2] bevoegd met medeneming van de benodigde
      apparatuur een woning te betreden zonder toestemming van de bewoner ten behoeve van de uitoefening van de
      bevoegdheden, bedoeld in artikel 14, vierde lid, onderdelen a, d en e, van [Verordening (EU) 2019/1020]
      (32920R2019).


      [ref1]: https://wetten.overheid.nl/BWBR0042755#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0042755/2023-10-05#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0042755
        artikel: '10'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 10a.2
    text: |-
      Voor het uitoefenen van de bevoegdheid, bedoeld in het eerste lid, is een voorafgaande machtiging vereist van de
      rechter-commissaris. In het verzoek om afgifte van een machtiging worden de proportionaliteit en subsidiariteit
      van het verzoek gemotiveerd. De rechter-commissaris kan het openbaar ministerie horen alvorens te beslissen.
      [Artikel 171 van het Wetboek van Strafvordering][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel171
    url: https://wetten.overheid.nl/BWBR0042755/2023-10-05#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '171'
  - number: 10a.3
    text: |-
      Tegen de beslissing van de rechter-commissaris, bedoeld in het tweede lid, staat voor zover het verzoek om een
      machtiging niet is toegewezen, voor Onze Minister binnen veertien dagen beroep open bij de rechtbank, sector
      strafrecht.
    url: https://wetten.overheid.nl/BWBR0042755/2023-10-05#Artikel10a
  - number: 10a.4
    text: |-
      De [artikelen 2][ref1] en [3 van de Algemene wet op het binnentreden][ref2] zijn niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006763#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006763#Artikel3
    url: https://wetten.overheid.nl/BWBR0042755/2023-10-05#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0006763
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0006763
        artikel: '3'
  - number: 10b.1
    text: |-
      De toezichthouders, bedoeld in [artikel 10][ref1], zijn bevoegd om, ter uitvoering van [Verordening (EU)
      2019/1020](32920R2019), onder verstrekking van onjuiste of onvolledige gegevens met betrekking tot hun identiteit
      en hoedanigheid, medische hulpmiddelen of medische hulpmiddelen voor in-vitrodiagnostiek te verkrijgen en de
      hieraan gerelateerde handelingen te verrichten voor zover dat voor de invulling van hun taak noodzakelijk is.
      [Artikel 5:12, tweede lid, van de Algemene wet bestuursrecht][ref2] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0042755#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0042755/2023-10-05#Artikel10b
    references:
      - id: ref1
        bwb_id: BWBR0042755
        artikel: '10'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 10b.2
    text: |-
      De toezichthouder die gebruik heeft gemaakt van de bevoegdheid bedoeld in het eerste lid, maakt daarvan een
      schriftelijk verslag op waarin hij vermeldt:
    url: https://wetten.overheid.nl/BWBR0042755/2023-10-05#Artikel10b
  - number: 10b.2.a
    text: zijn naam of nummer en hoedanigheid;
    url: https://wetten.overheid.nl/BWBR0042755/2023-10-05#Artikel10b
  - number: 10b.2.b
    text: de motivering van de noodzaak tot uitoefening van de bevoegdheid;
    url: https://wetten.overheid.nl/BWBR0042755/2023-10-05#Artikel10b
  - number: 10b.2.c
    text: de voorschriften op de naleving waarvan wordt toegezien;
    url: https://wetten.overheid.nl/BWBR0042755/2023-10-05#Artikel10b
  - number: 10b.2.d
    text: |-
      het adres, waaronder indien van toepassing, het elektronische adres, waar het medisch hulpmiddel of het medisch
      hulpmiddel voor in-vitrodiagnostiek is verkregen en, voor zover bekend, de omschrijving van de betrokken
      marktdeelnemer;
    url: https://wetten.overheid.nl/BWBR0042755/2023-10-05#Artikel10b
  - number: 10b.2.e
    text: |-
      de onjuiste of onvolledige gegevens die bij het verkrijgen van het medisch hulpmiddel of medisch hulpmiddel voor
      in-vitrodiagnostiek zijn verstrekt;
    url: https://wetten.overheid.nl/BWBR0042755/2023-10-05#Artikel10b
  - number: 10b.2.f
    text: |-
      de wijze waarop en het tijdvak waarin het medisch hulpmiddel of medisch hulpmiddel voor in-vitrodiagnostiek is
      verkregen; en
    url: https://wetten.overheid.nl/BWBR0042755/2023-10-05#Artikel10b
  - number: 10b.2.g
    text: |-
      hetgeen tijdens het onderzoek van het medisch hulpmiddel of medisch hulpmiddel voor in-vitrodiagnostiek is
      verricht, gebleken en overigens is voorgevallen.
    url: https://wetten.overheid.nl/BWBR0042755/2023-10-05#Artikel10b
  - number: 10c
    text: |-
      [Titel 5.2 van de Algemene wet bestuursrecht][ref1] is van overeenkomstige toepassing voor zover een toezichthouder
      bijstand verleent aan een markttoezichtautoriteit als bedoeld in artikel 3, onderdeel 4, van [Verordening (EU)
      2019/1020](32920R2019) uit een lidstaat van de Europese Unie op grond van de artikelen 22 of 23 van [Verordening
      (EU) 2019/1020](32920R2019).


      [ref1]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0042755/2023-10-05#Artikel10c
    references:
      - id: ref1
        bwb_id: BWBR0005537
  - number: 10d.1
    text: |-
      Ter uitvoering van [Verordening (EU) 2019/1020](32920R2019) kan Onze Minister, indien er geen andere doeltreffende
      middelen voorhanden zijn om een ernstig risico als bedoeld in artikel 3, onderdeel 20, van [Verordening (EU)
      2019/1020](32920R2019), gevormd door een medisch hulpmiddel of medisch hulpmiddel voor in-vitrodiagnostiek, weg te
      nemen, een zelfstandige last opleggen aan:
    url: https://wetten.overheid.nl/BWBR0042755/2023-10-05#Artikel10d
  - number: 10d.1.a
    text: |-
      degene die daartoe in staat is, om inhoud te verwijderen van of de toegang te beperken tot een online interface
      als bedoeld in artikel 3, onderdeel 15, van [Verordening (EU) 2019/1020](32920R2019), of opdracht te geven tot
      de duidelijke weergave van een waarschuwing aan eindgebruikers wanneer die zich toegang tot de online interface
      verschaffen, of;
    url: https://wetten.overheid.nl/BWBR0042755/2023-10-05#Artikel10d
  - number: 10d.1.b
    text: |-
      indien niet binnen de daarvoor gestelde termijn aan een last als bedoeld onder a is voldaan, aanbieders van
      diensten van de informatiemaatschappij als bedoeld in artikel 3, onderdeel 14, van [Verordening (EU) 2019/1020]
      (32920R2019) om alle maatregelen te treffen die redelijkerwijs van hem kunnen worden gevergd om de toegang tot
      een online interface te beperken, onder meer door een daarvoor in aanmerking komende derde te verzoeken dergelijke
      maatregelen uit te voeren.
    url: https://wetten.overheid.nl/BWBR0042755/2023-10-05#Artikel10d
  - number: 10d.2
    text: Degene tot wie een zelfstandige last als bedoeld in het eerste lid is gericht, handelt overeenkomstig die last.
    url: https://wetten.overheid.nl/BWBR0042755/2023-10-05#Artikel10d
  - number: 10d.3
    text: |-
      Op grond van het eerste lid kan geen zelfstandige last worden opgelegd die leidt tot het blokkeren of filteren
      van internetverkeer.
    url: https://wetten.overheid.nl/BWBR0042755/2023-10-05#Artikel10d
  - number: 10d.4
    text: |-
      Voor een zelfstandige last als bedoeld in het eerste lid, is voorafgaande machtiging vereist van de rechter-
      commissaris. In het verzoek om afgifte van een machtiging worden de proportionaliteit en subsidiariteit van
      het verzoek gemotiveerd. De rechter-commissaris kan het openbaar ministerie horen alvorens te beslissen.
      [Artikel 171 van het Wetboek van Strafvordering][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel171
    url: https://wetten.overheid.nl/BWBR0042755/2023-10-05#Artikel10d
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '171'
  - number: 10d.5
    text: |-
      Tegen de beslissing van de rechter-commissaris, bedoeld in het vierde lid, staat voor zover het verzoek om een
      machtiging niet is toegewezen, voor Onze Minister binnen veertien dagen beroep open bij de rechtbank, sector
      strafrecht.
    url: https://wetten.overheid.nl/BWBR0042755/2023-10-05#Artikel10d
  - number: 10d.6
    text: |-
      Onze Minister maakt de machtiging van de rechter-commissaris gelijktijdig met de zelfstandige last, bedoeld in het
      eerste lid, bekend.
    url: https://wetten.overheid.nl/BWBR0042755/2023-10-05#Artikel10d
  - number: '11.1'
    text: |-
      Hij die handelt in strijd met artikel 7 van Verordening (EU) 2017/745 of met artikel 7 van Verordening (EU)
      2017/746 wordt gestraft met een gevangenisstraf van ten hoogste twee jaren of een geldboete van de zesde categorie.
    url: https://wetten.overheid.nl/BWBR0042755/2023-10-05#Artikel11
  - number: '11.2'
    text: |-
      Hij die handelt in strijd met [artikel 6][ref1] van deze wet wordt gestraft met hechtenis van ten hoogste zes
      maanden of een boete uit de derde categorie indien in de daaraan voorafgaande vierentwintig maanden tweemaal een
      bestuurlijke boete ter zake van dezelfde gedraging is opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0042755#Artikel6
    url: https://wetten.overheid.nl/BWBR0042755/2023-10-05#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0042755
        artikel: '6'
        hoofdstuk: '3'
  - number: '11.3'
    text: |-
      Het in het eerste lid strafbaar gestelde feit is een misdrijf. Het in het tweede lid strafbaar gestelde feit is
      een overtreding.
    url: https://wetten.overheid.nl/BWBR0042755/2023-10-05#Artikel11
