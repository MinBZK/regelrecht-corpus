  - number: '26'
    text: |-
      Een positief oordeel als bedoeld in
      [artikel 2, tweede lid, van de Wet medisch-wetenschappelijk onderzoek met mensen][ref1], dat is afgegeven voor
      26 mei 2021 voor een klinisch onderzoek als bedoeld in artikel 10 van [richtlijn 90/385/EEG](31990L0385) van de
      Raad van 20 juni 1990 betreffende de onderlinge aanpassing van de wetgevingen van de Lid-Staten inzake actieve
      implanteerbare medische hulpmiddelen (PbEG 1990, L 189) en in artikel 15 van [richtlijn 93/42/EEG](31993L0042) van
      de Raad van 14 juni 1993 betreffende medische hulpmiddelen (PbEG 1993, L 169) wordt aangemerkt als een positief
      oordeel voor wetenschappelijk onderzoek met medische hulpmiddelen als bedoeld in [artikel 1 van die wet][ref2],
      mits de uitvoering van het onderzoek reeds is aangevangen.


      [ref1]: https://wetten.overheid.nl/BWBR0009408#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0009408#Artikel1
