  - number: '9'
    text: |-
      Onverminderd het elders bij of krachtens deze wet en in de [Wet medisch-wetenschappelijk onderzoek met mensen][ref1]
      bepaalde, wijst Onze Minister de bevoegde autoriteiten aan, bedoeld in artikel 101 van Verordening (EU) 2017/745,
      en in artikel 96, van Verordening (EU) 2017/746. De aangewezen autoriteiten nemen die verordeningen in acht.


      [ref1]: https://wetten.overheid.nl/BWBR0009408
