    text: |-
      1 Bij algemene maatregel van bestuur worden regels gesteld ter implementatie van Richtlijn (EU) 98/79/EEG van het
      Europees Parlement en de Raad van 27 oktober 1998 betreffende medische hulpmiddelen voor in-vitrodiagnostiek (PbEG
      1998, L331).

      2 Na de inwerkingtreding van [artikel 29][ref1] van deze wet berust het [Besluit in-vitro diagnostica][ref2] op het
      eerste lid.


