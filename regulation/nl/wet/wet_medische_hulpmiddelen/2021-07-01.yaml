  - number: '7'
    text: |-
      1 Onze Minister kan de kosten die samenhangen met het verrichten van werkzaamheden als bedoeld in Verordening (EU)
      2017/745 en Verordening (EU) 2017/746 ten laste brengen van degene ten behoeve van wie deze werkzaamheden worden
      verricht.

      2 De bedragen ter vergoeding van de kosten worden bij ministeriële regeling vastgesteld.
    url: https://wetten.overheid.nl/BWBR0042755/2021-07-01#Artikel7
  - number: '8'
    text: |-
      1 Onze Minister wijst de voor de aangemelde instanties verantwoordelijke autoriteit aan, bedoeld in artikel 35,
      eerste lid, van Verordening (EU) 2017/745, en artikel 31, eerste lid, van Verordening (EU) 2017/746. De voor de
      aangemelde instanties verantwoordelijke autoriteit neemt die verordeningen in acht.

      2 De voor de aangemelde instanties aangewezen verantwoordelijke autoriteit is bevoegd tot:

      a. aanwijzing van de conformiteitsbeoordelingsinstantie als bedoeld in artikel 42, eerste lid, van Verordening (EU)
      2017/745, en artikel 38, eerste lid, van Verordening (EU) 2017/746;

      b. schorsing, beperking en gehele of gedeeltelijke intrekking van de aanwijzing als bedoeld in artikel 46, vierde
      lid, van Verordening (EU) 2017/745, en in artikel 42, vierde lid, van Verordening (EU) 2017/746.

      3 Op de ingevolge het tweede lid, onderdeel a, aangewezen conformiteitsbeoordelingsinstantie is de
      [Kaderwet zelfstandige bestuursorganen][ref1] niet van toepassing.

      4 Onze Minister wijst de bevoegde autoriteit aan, bedoeld in artikel 59, eerste lid, van Verordening (EU) 2017/745,
      en in artikel 54, eerste lid, van Verordening (EU) 2017/746. De aangewezen autoriteit neemt die verordeningen in
      acht.


      [ref1]: https://wetten.overheid.nl/BWBR0020495
