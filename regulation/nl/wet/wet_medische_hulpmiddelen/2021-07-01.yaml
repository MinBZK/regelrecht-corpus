  - number: '23'
    text: |-
      1 Besluiten als bedoeld in [artikel 10 van de Wet op de medische hulpmiddelen][ref1] die voor de inwerkingtreding
      van [artikel 29][ref2] van deze wet zijn genomen, vervallen:

      a. met ingang van 26 mei 2021, voor zover het besluit is genomen krachtens
      [artikel 11 van het Besluit medische hulpmiddelen][ref3] of krachtens
      [artikel 5, zevende lid, van het Besluit actieve implantaten][ref4], zoals deze luidden op de dag voor de
      inwerkingtreding van [artikel 29][ref5] van deze wet;

      b. met ingang van 26 mei 2022, voor zover het besluit is genomen krachtens
      [artikel 9 van het Besluit in-vitro diagnostica][ref6], zoals dit luidde op de dag voor de inwerkingtreding van
      [artikel 29][ref7] van deze wet.

      2 Besluiten als bedoeld in [artikel 8, eerste lid, eerste volzin, van de Wet op de medische hulpmiddelen][ref8] die
      voor de inwerkingtreding van [artikel 29][ref9] van deze wet zijn genomen, worden aangemerkt als door de krachtens
      [artikel 8, derde lid][ref10], van deze wet, aangewezen autoriteit genomen besluiten.

      3 Voor zover nodig is in afwijking van [hoofdstuk 4][ref11] van deze wet, is het bepaalde
      bij of krachtens de [artikelen 1, eerste lid, onderdeel a][ref12], [3][ref13], [11][ref14],
      [12][ref15], [12a][ref16], [13][ref17] en [14, van de Wet op de medische hulpmiddelen][ref18], en
      [artikel 1, aanhef en onder 4°, van de Wet op de economische delicten][ref19], zoals deze luidden voor
      inwerkingtreding van [artikel 29][ref20] van deze wet:

      a.

      b.

      c.

      d. van toepassing op medische hulpmiddelen als bedoeld in artikel 120, vijfde lid, van Verordening
      (EU) 2017/745, die voor 26 mei 2021 in de handel zijn gebracht, met dien verstande dat in
      [artikel 14 van de Wet op de medische hulpmiddelen][ref21] voor «artikel 2, 3, 4, 5, 7, eerste lid, 9, eerste of
      derde lid, of 13» en in [artikel 1, aanhef en onder 4°, van de Wet op de economische delicten][ref22] voor «de Wet
      op de medische hulpmiddelen, de artikelen 2, 3, eerste lid, 4, 5, 7, eerste lid, en 9, eerste en derde lid» telkens
      wordt gelezen «Verordening (EU) 2017/745»;

      e. van toepassing op medische hulpmiddelen voor in-vitrodiagnostiek als bedoeld in artikel 110,
      vijfde lid, van Verordening (EU) 2017/746, die voor 26 mei 2021 in de handel zijn gebracht, met
      dien verstande dat in  voor «artikel 2, 3, 4, 5, 7, eerste lid, 9, eerste of derde lid, of 13» en in
      [artikel 1, aanhef en onder 4°, van de Wet op de economische delicten][ref23] voor «de Wet op de medische
      hulpmiddelen, de artikelen 2, 3, eerste lid, 4, 5, 7, eerste lid, en 9, eerste en derde lid» telkens wordt gelezen
      «Verordening (EU) 2017/746».


