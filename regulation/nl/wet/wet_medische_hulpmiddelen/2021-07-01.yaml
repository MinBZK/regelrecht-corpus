  - number: 9a
    text: |-
      Degenen die deskundig zijn om een voorschrift met specifieke ontwerpkenmerken af te geven voor een hulpmiddel naar
      maat als bedoeld in artikel 2, onderdeel 3, van Verordening (EU) 2017/745, zijn daartoe bevoegd.
    url: https://wetten.overheid.nl/BWBR0042755/2021-07-01#Artikel9a
  - number: '10'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet en van het bepaalde bij of krachtens
      Verordening (EU) 2017/745 en Verordening (EU) 2017/746 zijn belast de inspecteurs van de Inspectie gezondheidszorg
      en jeugd.
    url: https://wetten.overheid.nl/BWBR0042755/2021-07-01#Artikel10
  - number: '11'
    text: |-
      1 Hij die handelt in strijd met artikel 7 van Verordening (EU) 2017/745 of met artikel 7 van Verordening (EU)
      2017/746 wordt gestraft met een gevangenisstraf van ten hoogste twee jaren of een geldboete van de zesde categorie.

      2 Hij die handelt in strijd met [artikel 6][ref1] van deze wet wordt gestraft met hechtenis van ten hoogste zes
      maanden of een boete uit de derde categorie indien in de daaraan voorafgaande vierentwintig maanden tweemaal een
      bestuurlijke boete ter zake van dezelfde gedraging is opgelegd.

      3 Het in het eerste lid strafbaar gestelde feit is een misdrijf. Het in het tweede lid strafbaar gestelde feit is
      een overtreding.


