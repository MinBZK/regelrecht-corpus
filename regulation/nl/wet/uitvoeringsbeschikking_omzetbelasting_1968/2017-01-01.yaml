  - number: '1.2'
    text: 'Deze regeling verstaat onder:'
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel1
  - number: 1.2.a
    text: |-
      *wet:* [Wet op de omzetbelasting 1968][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002629
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002629
  - number: 1.2.b
    text: |-
      *besluit:* [Uitvoeringsbesluit omzetbelasting 1968][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002633
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002633
  - number: 1.2.c
    text: '*belasting:* omzetbelasting.'
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel1
  - number: 1a.1
    text: |-
      De inspecteur stelt de datum met ingang waarvan ingevolge [artikel 1a, derde lid, eerste volzin, van de wet][ref1],
      het tweede lid van dat artikel niet van toepassing is, vast:


      [ref1]: https://wetten.overheid.nl/BWBR0002629
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0002629
  - number: 1a.1.a
    text: op de datum van dagtekening van de beschikking bedoeld in het derde lid van dat artikel; dan wel
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel1a
  - number: 1a.1.b
    text: indien degene die het verzoek indient zulks wenst, op een in het verzoek aangegeven latere datum.
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel1a
  - number: 1a.2
    text: |-
      De wederopzegging als bedoeld in [artikel 1a, derde lid, tweede volzin, van de wet][ref1], dient schriftelijk te
      geschieden.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel1a
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 1a
  - number: 1a.3
    text: |-
      De inspecteur stelt de datum met ingang waarvan na de wederopzegging [artikel 1a, tweede lid, van de wet][ref1],
      wederom van toepassing is, vast, met inachtneming van het derde lid, tweede volzin, van dat artikel, op 1 januari
      van het jaar volgend op dat waarin de wederopzegging is ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel1a
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 1a
  - number: 1b
    text: |-
      In geval moet worden aangetoond dat een vervoermiddel een nieuw vervoermiddel is, dienen zodanig deugdelijke
      gegevens te worden overgelegd dat aan de hand daarvan kan worden vastgesteld dat het vervoermiddel een nieuw
      vervoermiddel is. In ieder geval moeten worden overgelegd:
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel1b
  - number: 1b.a
    text: |-
      de gegevens als bedoeld in [artikel 2a, eerste lid, onderdeel f, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel2a
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel1b
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 2a
  - number: 1b.b
    text: de gegevens omtrent het gebruik op het moment van aankoop;
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel1b
  - number: 1b.c
    text: naam en adres van degene van wie het vervoermiddel is verkregen.
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel1b
  - number: 2a
    text: |-
      Het bedrag bedoeld in [artikel 5a, vierde lid, van de wet][ref1], is voor leveringen naar:


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel5a
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 5a
  - number: 2a.a
    text: 'het Koninkrijk Denemarken: Dkr 280 000;'
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel2a
  - number: 2a.b
    text: 'het Koninkrijk Zweden: SEK 320 000;'
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel2a
  - number: 2a.c
    text: 'het Verenigd Koninkrijk van Groot-Brittannië en Noord-Ierland: £ 70 000.'
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel2a
  - number: 2a.d
    text: 'de overige lidstaten: het in euro''s luidende bedrag zoals dat in die lidstaten geldt met ingang van 1 januari 2002.'
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel2a
  - number: 2b.1
    text: |-
      De inspecteur stelt de datum met ingang waarvan ingevolge [artikel 5a, vijfde lid, eerste volzin, van de wet][ref1],
      het vierde lid van dat artikel niet van toepassing is, vast:


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel5a
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel2b
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 5a
  - number: 2b.1.a
    text: op de datum van dagtekening van de beschikking bedoeld in het vijfde lid van dat artikel; dan wel
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel2b
  - number: 2b.1.b
    text: indien degene die het verzoek indient zulks wenst, op een in het verzoek aangegeven latere datum.
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel2b
  - number: 2b.2
    text: |-
      De wederopzegging als bedoeld in [artikel 5a, vijfde lid, tweede volzin, van de wet][ref1], dient schriftelijk
      te geschieden.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel5a
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel2b
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 5a
  - number: 2b.3
    text: |-
      De inspecteur stelt de datum met ingang waarvan na de wederopzegging [artikel 5a, vierde lid, van de wet][ref1],
      wederom van toepassing is, vast, met inachtneming van het vijfde lid, tweede volzin, van dat artikel, op 1 januari
      van het jaar volgend op dat waarin de wederopzegging is ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel5a
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel2b
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 5a
  - number: '3'
    text: |-
      Publiekrechtelijke lichamen worden als ondernemer aangemerkt met betrekking tot het geven van gelegenheid tot
      parkeren waarbij een fysieke barrière of een registratie bij de in- of uitrit ter verzekering van de betaling van
      het parkeergeld dient.
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel3
  - number: 3a.1
    text: |-
      Bij vorming van een fiscale eenheid als bedoeld in [artikel 7, vierde lid, van de wet][ref1], wordt de fiscale
      eenheid voor het berekenen van de door haar verschuldigde belasting geacht in de plaats te zijn getreden van de
      natuurlijke personen en lichamen in de zin van de [Algemene wet inzake rijksbelastingen][ref2], die de fiscale
      eenheid vormen.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002320
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0002320
  - number: 3a.2
    text: |-
      Bij beëindiging van een fiscale eenheid als bedoeld in [artikel 7, vierde lid, van de wet][ref1], worden de
      natuurlijke personen en lichamen in de zin van de [Algemene wet inzake rijksbelastingen][ref2], die de fiscale
      eenheid vormden, voor het berekenen van de door hen verschuldigde belasting geacht in de plaats te zijn getreden
      van de fiscale eenheid, voor het deel dat tot hun bedrijfsvermogen behoort.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002320
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0002320
  - number: 3a.3
    text: |-
      Bij wijziging van een fiscale eenheid als bedoeld in [artikel 7, vierde lid, van de wet][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel7
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '7'
  - number: 3a.3.a
    text: |-
      is bij toetreding van een natuurlijk persoon of lichaam in de zin van de
      [Algemene wet inzake rijksbelastingen][ref1] tot de fiscale eenheid, het eerste lid van overeenkomstige toepassing;
      en


      [ref1]: https://wetten.overheid.nl/BWBR0002320
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0002320
  - number: 3a.3.b
    text: |-
      is bij uittreding van een natuurlijk persoon of lichaam in de zin van de
      [Algemene wet inzake rijksbelastingen][ref1] uit de fiscale eenheid, het tweede lid van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002320
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0002320
  - number: 3a.4
    text: |-
      De voorgaande leden gelden niet voor de toepassing van [artikel 4c, derde en vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002634#Artikel4c
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0002634
        artikel: 4c
        hoofdstuk: III
  - number: '4.1'
    text: |-
      Als edele metalen en edelstenen als bedoeld in [artikel 2a, eerste lid, onderdeel 1, van de wet][ref1], worden
      aangewezen onbewerkte edele metalen (GN-code 7106, 7108, 7110 en 7112) en onbewerkte edelstenen (GN-code 7102,
      7103).


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel2a
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 2a
  - number: '4.2'
    text: |-
      Als kunstvoorwerpen, voorwerpen voor verzamelingen en antiquiteiten als bedoeld in
      [artikel 2a, eerste lid, onderdeel m, van de wet][ref1], worden aangewezen de in bijlage J bedoelde goederen.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel2a
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 2a
  - number: 4a.1
    text: |-
      De wederverkoper is verplicht aan zijn leverancier als bedoeld in [artikel 28b, tweede lid, van de wet][ref1], een
      door laatstbedoelde te ondertekenen inkoopverklaring uit te reiken waarin op duidelijke en overzichtelijke wijze
      zijn vermeld:


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel28b
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 28b
  - number: 4a.1.a
    text: de dag waarop de levering wordt verricht;
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel4a
  - number: 4a.1.b
    text: naam en adres van de wederverkoper;
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel4a
  - number: 4a.1.c
    text: naam en adres van de leverancier;
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel4a
  - number: 4a.1.d
    text: |-
      een duidelijke omschrijving van het geleverde goed en, voor zover het een motorrijtuig betreft, tevens het
      kenteken;
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel4a
  - number: 4a.1.e
    text: de hoeveelheid van de geleverde goederen;
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel4a
  - number: 4a.1.f
    text: het bedrag dat aan de leverancier ter zake van de levering is of moet worden voldaan;
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel4a
  - number: 4a.1.g
    text: |-
      een verklaring van de leverancier dat hij ter zake van de levering aan hem van het goed in het geheel geen
      belasting in aftrek heeft gebracht.
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel4a
  - number: 4a.2
    text: De wederverkoper is verplicht een dubbel van de uitgereikte inkoopverklaring te bewaren.
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel4a
  - number: 4a.3
    text: 'Het eerste lid is niet van toepassing:'
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel4a
  - number: 4a.3.a
    text: ingeval het bedrag dat aan de leverancier moet worden voldaan minder dan € 500 bedraagt;
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel4a
  - number: 4a.3.b
    text: |-
      ingeval de leverancier ingevolge [artikel 34c van de wet][ref1] een factuur uitreikt;


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel34c
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 34c
  - number: 4a.3.c
    text: |-
      ingeval de inkoop van een goed door de wederverkoper gelijktijdig plaatsvindt met de levering door hem van een
      ander goed aan de leverancier en de wederverkoper een factuur uitreikt die voldoet aan de in de wet gestelde
      voorwaarden, mits de factuur tevens voldoet aan het bepaalde in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel4a
  - number: 4b.1
    text: |-
      Ingeval van inwilliging van het in [artikel 28c, eerste lid, van de wet][ref1] bedoelde verzoek, is de
      wederverkoper de belasting die hij in aftrek heeft gebracht:


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel28c
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel4b
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 28c
  - number: 4b.1.a
    text: |-
      ter zake van de levering en invoer van goederen als bedoeld in het eerste lid, onderdelen a en b, van dat artikel;
      of
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel4b
  - number: 4b.1.b
    text: met toepassing van het tweede lid van dit artikel;
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel4b
  - number: 4b.2
    text: |-
      Ingeval van een wederopzegging als bedoeld in [artikel 28c, tweede lid, van de wet][ref1], kan de ondernemer de
      belasting die hij:


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel28c
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel4b
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 28c
  - number: 4b.2.a
    text: |-
      ingevolge [artikel 28e, onderdeel b, van de wet][ref1] niet in aftrek heeft gebracht; of


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel28e
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel4b
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 28e
  - number: 4b.2.b
    text: met toepassing van het eerste lid van dit artikel verschuldigd is geworden;
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel4b
  - number: 4c.1
    text: |-
      [Artikel 28d van de wet][ref1] is van toepassing:


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel28d
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel4c
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 28d
  - number: 4c.1.a
    text: |-
      ter zake van leveringen door wederverkopers van de volgende goederen alsmede van de gebruikte onderdelen,
      toebehoren en benodigdheden terzake:
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel4c
  - number: 4c.1.a.1°
    text: vervoermiddelen, daaronder begrepen caravans, fietsen en bromfietsen;
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel4c
  - number: 4c.1.a.2°
    text: kleding;
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel4c
  - number: 4c.1.a.3°
    text: meubels;
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel4c
  - number: 4c.1.a.4°
    text: boeken en tijdschriften;
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel4c
  - number: 4c.1.a.5°
    text: |-
      foto-, film- en video-apparatuur alsmede beeld- en geluiddragers zoals grammofoonplaten, video- en muziekcassettes
      en compact-discs;
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel4c
  - number: 4c.1.a.6°
    text: muziekinstrumenten;
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel4c
  - number: 4c.1.a.7
    text: huishoudelijke, elektrische en elektronische apparaten;
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel4c
  - number: 4c.1.a.8°
    text: huisdieren;
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel4c
  - number: 4c.1.a.9°
    text: kunstvoorwerpen, voorwerpen voor verzamelingen en antiquiteiten;
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel4c
  - number: 4c.1.b
    text: |-
      ter zake van leveringen door wederverkopers van andere goederen dan die bedoeld in onderdeel a, ingeval
      het onmogelijk of ongebruikelijk is om de goederen administratief van inkoop tot verkoop te volgen of om
      de aankoopprijs van een partij goederen te splitsen in aankoopprijzen voor elk afzonderlijk goed, mits de
      wederverkoper op een daartoe gedaan verzoek door de inspecteur is aangewezen.
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel4c
  - number: 4c.2
    text: Het eerste lid is niet van toepassing ten aanzien van veilinghouders.
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel4c
  - number: 4c.3
    text: |-
      Het eerste lid, aanhef en onderdeel a, is niet van toepassing ten aanzien van wederverkopers die daarvan
      schriftelijk kennis geven aan de inspecteur. Deze regeling mag slechts worden toegepast met ingang van het
      kalenderjaar volgend op dat van de kennisgeving en geldt tot wederopzegging met ingang van een kalenderjaar na die
      wederopzegging, doch voor ten minste vijf kalenderjaren. Een hernieuwde schriftelijke kennisgeving kan eerst met
      ingang van het zesde kalenderjaar na het ingaan van die wederopzegging worden ingewilligd.
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel4c
  - number: 4c.4
    text: |-
      De inspecteur beslist op het in het eerste lid, onderdeel b, bedoelde verzoek bij voor bezwaar vatbare beschikking.
      Bij inwilliging van het verzoek geldt zulks met ingang van het kalenderjaar volgend op dat van het verzoek en tot
      wederopzegging met ingang van een kalenderjaar na die wederopzegging, doch voor ten minste vijf kalenderjaren.
      Een hernieuwd verzoek kan eerst met ingang van het zesde kalenderjaar na het ingaan van die wederopzegging worden
      ingewilligd.
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel4c
  - number: 4c.5
    text: |-
      De wederverkoper die ingevolge de vorige leden de belasting moet berekenen op de voet van
      [artikel 28d van de wet][ref1], maar die ter zake van de levering van een goed in het tijdvak van aangifte op
      grond van [artikel 9, tweede lid, onderdeel b, van de wet][ref2] het tarief van nihil toepast dan wel de belasting
      berekent met toepassing van [artikel 28f, eerste lid, van de wet][ref3], is gehouden in dat tijdvak de in
      [artikel 28d, tweede volzin, van de wet][ref4], laatstbedoelde som te verminderen:


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel28d
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0002629#Artikel28f
      [ref4]: https://wetten.overheid.nl/BWBR0002629#Artikel28d
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel4c
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 28d
      - id: ref2
        bwb_id: BWBR0002629
        artikel: '9'
      - id: ref3
        bwb_id: BWBR0002629
        artikel: 28f
      - id: ref4
        bwb_id: BWBR0002629
        artikel: 28d
  - number: 4c.5.a
    text: |-
      met het bedrag dat eerder bij de berekening van de winstmarge per tijdvak van aangifte ter zake van dat goed in
      aanmerking is genomen; of
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel4c
  - number: 4c.5.b
    text: |-
      ingeval het in onderdeel a bedoelde bedrag niet bekend is, met het bedrag van de vergoeding voor dat goed
      verminderd met het positieve bedrag van de brutowinst, welke wordt gesteld op het bedrag van die vergoeding
      vermenigvuldigd:
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel4c
  - number: 4c.5.b.1°
    text: |-
      met het saldo van de winstmarges per tijdvak van aangifte over het voorgaande kalenderjaar gedeeld door de som van
      de bij de berekening van die winstmarges in aanmerking genomen vergoedingen; of
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel4c
  - number: 4c.5.b.2°
    text: |-
      ingeval het onder 1° bedoelde saldo ontbreekt, met de winstmarge over het voorafgaande tijdvak van aangifte gedeeld
      door de som van de bij de berekening van die winstmarge in aanmerking genomen vergoedingen;
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel4c
  - number: 4c.6
    text: |-
      Ingeval in een belastingtijdvak in een kalenderjaar, het laatste belastingtijdvak in een kalenderjaar uitgezonderd,
      de winstmarge per belastingtijdvak met betrekking tot leveringen van goederen waarop eenzelfde tarief wordt
      toegepast (tijdvak-winstmarge) negatief is, wordt deze negatieve tijdvak-winstmarge verrekend met een positieve
      tijdvak-winstmarge, of opgeteld bij een negatieve tijdvak-winstmarge, die in het volgende belastingtijdvak wordt
      gerealiseerd.
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel4c
  - number: 4c.7
    text: |-
      Na afloop van een kalenderjaar wordt voor dat kalenderjaar met betrekking tot leveringen van goederen
      waarop eenzelfde tarief wordt toegepast de in [artikel 28d, van de wet][ref1] bedoelde winstmarge op
      jaarbasis vastgesteld (jaarsaldo). Ingeval dat jaarsaldo negatief is, wordt dit negatieve jaarsaldo
      opgeteld bij de ten behoeve van de vaststelling van het jaarsaldo van het daaropvolgende kalenderjaar in
      [artikel 28d, tweede volzin, van de wet][ref2] laatstbedoelde, op jaarbasis herrekende, som. Ingeval de belasting
      over dat aldus berekende jaarsaldo minder bedraagt dan het bedrag aan belasting dat over dat kalenderjaar is of
      moet worden voldaan ter zake van dergelijke leveringen, wordt het verschil aan de wederverkoper teruggegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel28d
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel28d
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel4c
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 28d
      - id: ref2
        bwb_id: BWBR0002629
        artikel: 28d
  - number: 4c.8
    text: |-
      Het vaststellen van een negatief jaarsaldo als bedoeld in het zevende lid, alsmede van het bedrag van de aldaar
      bedoelde teruggaaf, geschiedt op verzoek bij voor bezwaar vatbare beschikking. Het verzoek wordt gedaan bij
      de aangifte over het eerste tijdvak van het volgende kalenderjaar. Indien de beschikking met betrekking tot de
      vaststelling van een negatief jaarsaldo tot een onjuist bedrag is vastgesteld, kan de inspecteur de beschikking
      bij voor bezwaar vatbare beschikking herzien. De bevoegdheid tot herziening ten aanzien van een negatief jaarsaldo
      vervalt door verloop van vijf jaren na het einde van het kalenderjaar waarin dat saldo, zonder toepassing van de
      tweede volzin van het zevende lid berekend, is ontstaan.
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel4c
  - number: 4d
    text: |-
      De keuze, bedoeld in [artikel 28zb van de wet][ref1], geldt voor een periode van tenminste vijf opeenvolgende
      jaren en geldt vanaf het begin van een aangiftetijdvak.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel28zb
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel4d
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 28zb
  - number: '5'
    text: |-
      Als met doorlopende posten gelijk te stellen bedragen, bedoeld in
      [artikel 4, eerste lid, onderdeel c, van het besluit][ref1], worden aangewezen:


      [ref1]: https://wetten.overheid.nl/BWBR0002633#Artikel4
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002633
        artikel: '4'
  - number: 5.a
    text: |-
      de bedragen welke door een reisbureau, reisvereniging of een dergelijke ondernemer op eigen naam ten behoeve van
      reizigers voor wie zij de reis verzorgen, aan een andere ondernemer worden voldaan ter zake van in het buitenland
      ten behoeve van die reizigers verrichte leveringen en diensten;
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel5
  - number: 5.b
    text: |-
      de bedragen welke de leverancier van een motorrijtuig aan de afnemer in rekening brengt ter
      zake van de inschrijving en tenaamstelling van het voertuig in het kentekenregister, bedoeld in
      [artikel 1, eerste lid, onderdeel i, van de Wegenverkeerswet 1994][ref1], voor zover die bedragen aan leges zijn
      voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel1
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '1'
  - number: 5a.1
    text: |-
      Als gemaakte uitgaven voor het gebruik van een goed als bedoeld in
      [artikel 4, tweede lid, onderdeel a, van de wet][ref1] worden, met inachtneming van het gestelde in het tweede en
      derde lid, aangemerkt de kosten van de ondernemer, de omzetbelasting daaronder niet begrepen, in verband met:


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel4
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '4'
  - number: 5a.1.a
    text: de verwerving of de vervaardiging van het goed;
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel5a
  - number: 5a.1.b
    text: het onderhoud, het herstel, de verbetering en de verbouwing van het goed;
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel5a
  - number: 5a.1.c
    text: het feitelijke gebruik van het goed;
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel5a
  - number: 5a.2
    text: |-
      Het bedrag van de voor een kalenderjaar in aanmerking te nemen kosten als bedoeld in het eerste lid, onderdeel a,
      wordt gedeeld door 10 ingeval van een onroerende zaak, en gedeeld door 5 ingeval van een roerende zaak waarop de
      ondernemer afschrijft voor de inkomstenbelasting of de vennootschapsbelasting of waarop hij zou kunnen afschrijven
      indien hij aan een zodanige belasting zou zijn onderworpen.
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel5a
  - number: 5a.3
    text: |-
      Het bedrag van de voor een kalenderjaar in aanmerking te nemen kosten als bedoeld in het eerste lid, onderdeel
      b, wordt gesteld op het bedrag van die kosten in het kalenderjaar waarin de ondernemer de betreffende goederen of
      diensten gaat gebruiken.
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel5a
  - number: 5a.4
    text: |-
      De in het eerste lid, onderdeel a, bedoelde kosten voor de verwerving of de vervaardiging van een goed worden op
      nihil gesteld voor een onroerende zaak na afloop van het negende jaar volgende op dat waarin de ondernemer het goed
      is gaan gebruiken, en voor een roerende zaak na afloop van het vierde jaar volgende op dat waarin de ondernemer het
      goed is gaan gebruiken, indien het gaat om een roerende zaak waarop de ondernemer voor de inkomstenbelasting of de
      vennootschapsbelasting afschrijft, of waarop hij zou kunnen afschrijven indien hij aan een zodanige belasting zou
      zijn onderworpen.
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel5a
  - number: 5a.5
    text: |-
      Voor goederen waarvoor de kosten in verband met de verwerving of de vervaardiging van het goed bij de
      verwerving of de vervaardiging lager zijn dan de vergoeding voor de levering van dat goed als bedoeld in
      [artikel 8 van de wet][ref1], wordt voor de toepassing van het eerste lid, onderdeel a, de vergoeding aangemerkt
      als de gemaakte kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel8
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '8'
  - number: 5b
    text: |-
      Als gemaakte uitgaven voor een dienst als bedoeld in [artikel 4, tweede lid, onderdeel b, van de wet][ref1], wordt
      aangemerkt het bedrag van de door de ondernemer voor het verrichten van de dienst gemaakte kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel4
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel5b
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '4'
  - number: '6.1'
    text: |-
      De keuze blijkens de notariële akte of het verzoek om te worden uitgezonderd van de vrijstelling van belasting voor
      de levering van onroerende zaken en van rechten waaraan deze zijn onderworpen kan voor elke onroerende zaak en voor
      elk recht waaraan een onroerende zaak is onderworpen worden gedaan.
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel6
  - number: '6.2'
    text: |-
      In de notariële akte of het verzoek wordt vermeld een omschrijving van de onroerende zaak en het recht waaraan
      deze is onderworpen met plaatselijke en kadastrale aanduiding alsmede de datum van aanvang van het boekjaar. In de
      notariële akte of het verzoek wordt een door de afnemer ondertekende verklaring gevoegd waaruit blijkt dat hij de
      onroerende zaak gebruikt voor doeleinden waarvoor een volledig of nagenoeg volledig recht op aftrek van belasting
      op de voet van [artikel 15 van de wet][ref1] bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel15
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '15'
  - number: '6.3'
    text: De inspecteur beslist op het verzoek bij voor bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel6
  - number: '6.4'
    text: |-
      Aan de in [artikel 11, eerste lid, onderdeel a, onder 2°, van de wet][ref1] bedoelde voorwaarde dat de afnemer
      de onroerende zaak gebruikt voor doeleinden waarvoor een volledig of nagenoeg volledig recht op aftrek van
      belasting op de voet van [artikel 15 van de wet][ref2] bestaat, is voldaan, wanneer de onroerende zaak zowel over
      het boekjaar van levering van de onroerende zaak als over het daarop volgende boekjaar voor de hiervoor vermelde
      doeleinden is gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel15
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0002629
        artikel: '15'
  - number: '6.5'
    text: |-
      Ingeval de onroerende zaak niet vóór het einde van het boekjaar volgende op het boekjaar van levering van
      de onroerende zaak in gebruik is genomen door de afnemer, is niet voldaan aan de in het vierde lid bedoelde
      voorwaarde.
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel6
  - number: '6.6'
    text: |-
      De afnemer stelt binnen vier weken na afloop van het boekjaar volgende op het boekjaar van levering van de
      onroerende zaak, de leverancier door middel van een door hem ondertekende verklaring ervan in kennis, of is voldaan
      aan de in het vierde lid bedoelde voorwaarde. De afnemer zendt binnen dezelfde termijn een afschrift van deze
      verklaring aan de inspecteur.
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel6
  - number: '6.7'
    text: |-
      In geval van levering door de afnemer van de onroerende zaak binnen de termijn waarin het keuzerecht voor belasting
      wordt beoordeeld, is het zesde lid van toepassing, met dien verstande dat de verklaring wordt overgelegd binnen
      vier weken na het tijdstip waarop de levering is verricht. In dat geval vervalt de verklaring, bedoeld in de eerste
      volzin van het zesde lid.
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel6
  - number: '6.8'
    text: Voor de toepassing van dit artikel geldt als boekjaar het boekjaar van de afnemer.
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel6
  - number: 6a.1
    text: |-
      De keuze blijkens de schriftelijke huurovereenkomst of het verzoek om te worden uitgezonderd van de vrijstelling
      van belasting voor verhuur van onroerende zaken kan voor elke onroerende zaak afzonderlijk worden gedaan.
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel6a
  - number: 6a.2
    text: |-
      In de schriftelijke huurovereenkomst of het verzoek wordt vermeld een omschrijving van de onroerende zaak
      met plaatselijke en kadastrale aanduiding alsmede de datum van aanvang van het boekjaar van de huurder. In de
      schriftelijke huurovereenkomst of het verzoek wordt een door de huurder ondertekende verklaring gevoegd waaruit
      blijkt dat hij de onroerende zaak gebruikt voor doeleinden waarvoor een volledig of nagenoeg volledig recht op
      aftrek van belasting op de voet van [artikel 15 van de wet][ref1] bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel15
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '15'
  - number: 6a.3
    text: |-
      De inspecteur beslist op het verzoek bij voor bezwaar vatbare beschikking, waarin de datum met ingang waarvan de
      vrijstelling buiten toepassing blijft, wordt vermeld.
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel6a
  - number: 6a.4
    text: |-
      [ Artikel 25 van de wet][ref1] geldt niet, voor zover de vrijstelling van
      [artikel 11, eerste lid, onderdeel b, van de wet][ref2] ingevolge 5° van die bepaling ten aanzien van de ondernemer
      niet van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel11
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '25'
      - id: ref2
        bwb_id: BWBR0002629
        artikel: '11'
  - number: 6a.5
    text: |-
      Voor elk boekjaar geldt dat aan de in [artikel 11, eerste lid, onderdeel b, onder 5°, van de wet][ref1] bedoelde
      voorwaarde dat de huurder de onroerende zaak gebruikt voor doeleinden waarvoor een volledig of nagenoeg volledig
      recht op aftrek van belasting op de voet van [artikel 15 van de wet][ref2] bestaat, is voldaan, wanneer de
      onroerende zaak over het desbetreffende boekjaar voor de hiervoor vermelde doeleinden is gebruikt. De voorwaarde
      wordt voor de eerste keer beoordeeld over het boekjaar waarin de huurder de onroerende zaak, met toepassing van het
      keuzerecht voor belasting, is gaan huren.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel15
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0002629
        artikel: '15'
  - number: 6a.6
    text: |-
      Ingeval de onroerende zaak niet vóór het einde van het boekjaar waarin de huurder de onroerende zaak, met
      toepassing van het keuzerecht voor belasting, is gaan huren, door de huurder in gebruik is genomen, is niet voldaan
      aan de in het vijfde lid bedoelde voorwaarde.
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel6a
  - number: 6a.7
    text: |-
      Ingeval niet meer wordt voldaan aan de in het vijfde lid bedoelde voorwaarde stelt de huurder de verhuurder binnen
      vier weken na afloop van het desbetreffende boekjaar daarvan in kennis door middel van een door hem ondertekende
      verklaring. Tevens zendt de huurder binnen dezelfde termijn een afschrift hiervan aan de inspecteur.
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel6a
  - number: 6a.8
    text: |-
      Ingeval in een boekjaar dat is aangevangen na het boekjaar waarin de huurder de onroerende zaak is gaan huren, de
      vrijstelling buiten toepassing is gebleven en na afloop van dat boekjaar blijkt dat de huurder niet meer voldoet
      aan de in het vijfde lid bedoelde voorwaarde, kan de vrijstelling in dat boekjaar buiten toepassing blijven, tenzij
      de huurder redelijkerwijs kon voorzien dat hij niet langer zou voldoen aan deze voorwaarde. Blijkt in het daarop
      volgende boekjaar evenmin te worden voldaan aan voormelde voorwaarde, dan vindt de vrijstelling toepassing met
      ingang van laatstgemeld boekjaar, ook als de huurder redelijkerwijs niet kon voorzien dat hij in het desbetreffende
      boekjaar niet zou voldoen aan die voorwaarde.
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel6a
  - number: 6a.9
    text: Voor de toepassing van dit artikel geldt als boekjaar het boekjaar van de huurder.
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel6a
  - number: 6b
    text: |-
      Tot de leveringen en diensten, bedoeld in [artikel 11, eerste lid, onderdeel f, van de wet][ref1], behoren niet,
      behoudens voor zover in [bijlage B bij het besluit][ref2] anders is bepaald:


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0002633
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel6b
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0002633
  - number: 6b.a
    text: het verstrekken van spijzen en dranken;
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel6b
  - number: 6b.b
    text: het verrichten van onderzoek;
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel6b
  - number: 6b.c
    text: het ter beschikking stellen van personeel;
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel6b
  - number: 6b.d
    text: het verzorgen van loon- en salarisadministraties, financiële administraties en grootboekadministraties.
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel6b
  - number: '7'
    text: |-
      De vrijstelling van belasting voor voordrachten en dergelijke diensten, als zijn bedoeld in
      [artikel 11, eerste lid, onderdeel p, van de wet][ref1], geldt in gevallen waarin zij worden gehouden of verricht
      vanwege publiekrechtelijke lichamen, stichtingen en verenigingen en strekken tot bevordering van wetenschap of
      algemene ontwikkeling.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel11
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '11'
  - number: 7a
    text: |-
      Tot leveringen en diensten die voortvloeien uit activiteiten ter verkrijging van financiële steun als bedoeld in
      [artikel 11, eerste lid, onderdeel v, van de wet][ref1], behoren niet verstrekkingen van spijzen en dranken die
      samenhangen met evenementen gelegen in de persoonlijke sfeer.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel11
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '11'
  - number: '8.1'
    text: |-
      In het geval, bedoeld in [artikel 37d van de wet][ref1], wordt hij aan wie de overdracht is geschied, voor het
      berekenen van de door hem verschuldigde belasting wat de onderneming of het overgedragen gedeelte betreft, geacht
      in plaats te zijn getreden van degene die de onderneming of een gedeelte daarvan heeft overgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel37d
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 37d
  - number: '8.2'
    text: |-
      Het eerste lid geldt niet voor de toepassing van [artikel 4c, derde en vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002634#Artikel4c
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002634
        artikel: 4c
        hoofdstuk: III
  - number: 9a
    text: |-
      Tot de diensten, bedoeld in [artikel 11, eerste lid, onderdeel u, van de wet][ref1], behoren niet:


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel11
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '11'
  - number: 9a.a
    text: het ontwikkelen van geautomatiseerde informatie- en communicatiesystemen;
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel9a
  - number: 9a.b
    text: |-
      het voor de in onderdeel a bedoelde systemen ontwikkelen van programmatuur, alsmede het ter beschikking stellen
      daarvan;
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel9a
  - number: 9a.c
    text: het begeleiden van dan wel het leiding geven aan de toepassing van de in onderdeel a bedoelde systemen;
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel9a
  - number: 9a.d
    text: het ter beschikking stellen van computerapparatuur;
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel9a
  - number: 9a.e
    text: |-
      advisering, begeleiding, onderzoek en andere diensten op het gebied van onderhoudsbeheersing van woningen en andere
      gebouwen;
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel9a
  - number: 9a.f
    text: |-
      expertisewerkzaamheden, onderzoeken, inspecties, taxaties, arbitrage en advisering in het kader van een verzekering
      of een schadegeval;
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel9a
  - number: 9a.g
    text: |-
      het verlenen van bijstand als bedoeld in [artikel 13, zevende lid][ref1] en
      [artikel 14, eerste lid, van de Arbeidsomstandighedenwet 1998][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0010346#Artikel14
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '13'
      - id: ref2
        bwb_id: BWBR0010346
        artikel: '14'
  - number: 9a.h
    text: werkzaamheden met betrekking tot de pensioenadministratie;
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel9a
  - number: 9a.i
    text: het adviseren en ondersteunen van paritaire organisaties;
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel9a
  - number: 9a.j
    text: het ter beschikking stellen van personeel.
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel9a
  - number: '10'
    text: |-
      Door de ondernemer kan in aftrek worden gebracht de belasting die blijkens zijn boeken en bescheiden in het tijdvak
      van aangifte op de voet van [artikel 22 van de wet][ref1] verschuldigd is geworden ter zake van de invoer van voor
      hem bestemde goederen.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel22
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '22'
  - number: 10a.1
    text: |-
      De in [artikel 15, derde lid, eerste volzin, van de wet][ref1] bedoelde belasting die in de aankoopprijs
      is begrepen, wordt gesteld op 21/121 van het bedrag van de aankoopprijs, voorzover deze betrekking
      heeft op een personenauto, een bestelauto of een motorrijwiel verminderd met het bij de personenauto, de
      bestelauto of het motorrijwiel nog behorende bedrag aan belasting bedoeld in en berekend overeenkomstig
      [artikel 10 van de Wet op de belasting van personenauto’s en motorrijwielen 1992][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0005806#Artikel10
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0005806
        artikel: '10'
  - number: 10a.2
    text: |-
      Het bedrag van de aankoopprijs dient ten genoegen van de inspecteur te worden aangetoond aan de hand van bescheiden
      zoals een originele factuur, een inkoopverklaring of een betalingsbewijs.
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel10a
  - number: '11.1'
    text: |-
      De aftrek van de in [artikel 15 van de wet][ref1] bedoelde belasting (voorbelasting) geschiedt, ingeval de
      ondernemer zowel handelingen verricht waarvoor recht op aftrek van voorbelasting bestaat als handelingen verricht
      waarvoor geen recht op aftrek van voorbelasting bestaat, met inachtneming van het volgende:


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel15
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '15'
  - number: 11.1.a
    text: |-
      van goederen en diensten, die uitsluitend worden gebruikt voor handelingen waarvoor recht op aftrek van
      voorbelasting bestaat, komt de voorbelasting geheel voor aftrek in aanmerking;
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel11
  - number: 11.1.b
    text: |-
      van goederen en diensten, die uitsluitend worden gebruikt voor handelingen waarvoor geen recht op aftrek van
      voorbelasting bestaat, komt de voorbelasting in het geheel niet voor aftrek in aanmerking;
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel11
  - number: 11.1.c
    text: |-
      met betrekking tot goederen en diensten die zowel voor de onder a als voor de onder b bedoelde handelingen worden
      gebruikt, komt voor aftrek in aanmerking het gedeelte van de voorbelasting dat in dezelfde verhouding staat tot
      die belasting als het totaal van de vergoedingen voor de handelingen bedoeld onder a staat tot het totaal van de
      vergoedingen voor de handelingen bedoeld onder a en onder b.
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel11
  - number: '11.2'
    text: |-
      Indien aannemelijk is dat het werkelijke gebruik van de in het eerste lid, onderdeel c, bedoelde goederen en
      diensten, als geheel genomen, niet overeenkomt met de aldaar bedoelde verhouding, wordt het voor aftrek in
      aanmerking komende gedeelte van de voorbelasting van die goederen en diensten berekend op basis van het werkelijke
      gebruik.
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel11
  - number: '11.3'
    text: |-
      Ingeval de ondernemer twee of meer goederen of diensten van dezelfde soort gebruikt, worden deze alle geacht mede
      te worden gebruikt ten behoeve van handelingen waarvoor geen recht op aftrek van voorbelasting bestaat, tenzij
      blijkt welke van die goederen of diensten uitsluitend worden gebruikt voor handelingen waarvoor geen recht op
      aftrek bestaat en welke uitsluitend voor handelingen waarvoor dat recht wél bestaat.
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel11
  - number: '11.4'
    text: |-
      De in [artikel 15, eerste lid, laatste alinea, van de wet][ref1] bedoelde aftrek over uitgaven in verband met een
      onroerende zaak wordt berekend op basis van het werkelijke gebruik van die onroerende zaak.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel15
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '15'
  - number: '12.1'
    text: |-
      De in artikel 11 voorgeschreven berekeningswijze geschiedt op basis van de gegevens van het belastingtijdvak waarin
      de belasting aan de ondernemer in rekening wordt gebracht dan wel de belasting wordt verschuldigd.
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel12
  - number: '12.2'
    text: |-
      De herziening, bedoeld in [artikel 15, vierde lid, van de wet][ref1], geschiedt op basis van de gegevens van het
      belastingtijdvak waarin de ondernemer de goederen of diensten is gaan gebruiken.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel15
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '15'
  - number: '12.3'
    text: |-
      Bij de aangifte over het laatste belastingtijdvak van het boekjaar vindt herziening van de aftrek plaats op basis
      van de voor het gehele boekjaar geldende gegevens.
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel12
  - number: '13.1'
    text: 'In afwijking van artikel 11 worden voor de toepassing van de aftrek afzonderlijk in aanmerking genomen:'
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel13
  - number: 13.1.a
    text: onroerende zaken en rechten waaraan deze zijn onderworpen;
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel13
  - number: 13.1.b
    text: |-
      roerende zaken waarop de ondernemer voor de inkomstenbelasting of de vennootschapsbelasting afschrijft, of waarop
      hij zou kunnen afschrijven indien hij aan een zodanige belasting zou zijn onderworpen.
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel13
  - number: '13.2'
    text: |-
      Met betrekking tot onroerende zaken en rechten waaraan deze zijn onderworpen wordt de aftrek herzien in elk van de
      negen boekjaren, volgende op dat waarin de ondernemer het goed is gaan gebruiken. De herziening geschiedt telkens
      voor een tiende gedeelte van de voorbelasting op basis van de voor het boekjaar geldende gegevens bij de aangifte
      over het laatste belastingtijdvak van dat boekjaar.
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel13
  - number: '13.3'
    text: |-
      Met betrekking tot de in het eerste lid, onderdeel b, bedoelde roerende zaken wordt de aftrek herzien in elk van
      de vier boekjaren, volgende op dat waarin de ondernemer het goed is gaan gebruiken. De herziening geschiedt telkens
      voor een vijfde gedeelte van de voorbelasting op basis van de voor het boekjaar geldende gegevens bij de aangifte
      over het laatste belastingtijdvak van dat boekjaar.
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel13
  - number: '13.4'
    text: |-
      De herziening blijft achterwege in het boekjaar waarin de belasting welke op basis van de voor dat boekjaar
      geldende gegevens voor aftrek in aanmerking komt, niet meer dan tien percent verschilt van de in aftrek gebrachte
      belasting.
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel13
  - number: 13a.1
    text: |-
      In geval van levering door de ondernemer van de in [artikel 13, eerste lid][ref1], bedoelde goederen binnen de
      termijn waarin de aftrek wordt herzien, is [artikel 13, tweede en derde lid][ref2], van overeenkomstige toepassing.
      Daarbij wordt de ondernemer geacht tot het einde van die termijn het gebruik van het goed voor bedrijfsdoeleinden
      voort te zetten uitsluitend ten behoeve van:


      [ref1]: https://wetten.overheid.nl/BWBR0002634#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0002634#Artikel13
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0002634
        artikel: '13'
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0002634
        artikel: '13'
        hoofdstuk: VI
  - number: 13a.1.a
    text: |-
      belaste handelingen, indien ter zake van de levering van het goed belasting verschuldigd is dan wel geen belasting
      verschuldigd is omdat het gaat om een handeling als bedoeld in [artikel 15, tweede lid, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel15
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '15'
  - number: 13a.1.b
    text: |-
      handelingen waarvoor geen recht op aftrek van voorbelasting bestaat, indien ter zake van de levering
      van het goed geen belasting verschuldigd is en het niet gaat om een handeling als bedoeld in
      [artikel 15, tweede lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel15
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '15'
  - number: 13a.2
    text: De herziening geschiedt in één keer bij de aangifte over het belastingtijdvak waarin de levering plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel13a
  - number: '14'
    text: |-
      Het afstoten van goederen welke de ondernemer in zijn bedrijf heeft gebruikt, wordt niet beschouwd als een
      handeling die voor de berekening van de aftrek bij hem in aanmerking komt.
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel14
  - number: 14a
    text: |-
      Handelingen ter zake waarvan op grond van [artikel 27, eerste lid, van de wet][ref1] geen belasting verschuldigd
      is, worden voor de toepassing van de [artikelen 11 tot en met 14][ref2] aangemerkt als handelingen, andere dan die
      bedoeld in [artikel 15, eerste en tweede lid, van de wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0002634#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0002629#Artikel27
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '27'
      - id: ref2
        bwb_id: BWBR0002634
        artikel: '11'
        hoofdstuk: VI
      - id: ref3
        bwb_id: BWBR0002629
        artikel: '27'
  - number: 16a.1
    text: |-
      Voor de toepassing van de vrijstelling, bedoeld in [artikel 17e van de wet][ref1], is de ondernemer gehouden een
      boekhouding te voeren waarin de voor die toepassing nodige gegevens op duidelijke en overzichtelijke wijze zijn
      vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel17e
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel16a
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 17e
  - number: 16a.2
    text: |-
      In geval de ondernemer niet in Nederland woont of is gevestigd en aldaar geen vaste inrichting heeft, dient de
      aanspraak op toepassing van de vrijstelling ten genoegen van de inspecteur te worden aangetoond.
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel16a
  - number: 16b.1
    text: |-
      Ten aanzien van de vrijstelling als bedoeld in [artikel 21, onderdeel d, van de wet][ref1], is een vergunning
      van de inspecteur vereist. Het bepaalde in artikel 22 van het Douanewetboek van de Unie is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel21
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel16b
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '21'
  - number: 16b.2
    text: 'De verlening van de vergunning, bedoeld in het eerste lid, is gebonden aan de volgende voorwaarden:'
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel16b
  - number: 16b.2.a
    text: |-
      degene die de goederen invoert, verstrekt aan de inspecteur zijn btw-identificatienummer dat is toegekend
      door Nederland of ingeval de belasting wordt voldaan door zijn fiscaal vertegenwoordiger als bedoeld in
      [artikel 33g van de wet][ref1] het btw-identificatienummer dat is toegekend door Nederland aan deze fiscaal
      vertegenwoordiger en het btw-identificatienummer waaronder degene die de goederen intracommunautair afneemt in
      een andere lidstaat is geregistreerd of ingeval van overbrenging van eigen goederen het btw-identificatienummer
      waaronder degene die de goederen invoert zelf in de lidstaat van aankomst van het vervoer is geregistreerd;


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel33g
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel16b
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 33g
  - number: 16b.2.b
    text: |-
      de inspecteur kan bepalen dat degene die de goederen invoert, onder de in het vierde lid genoemde voorwaarden,
      zekerheid stelt tot het beloop van een door de inspecteur vastgesteld bedrag per invoer van goederen;
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel16b
  - number: 16b.2.c
    text: |-
      degene die de goederen invoert, verstrekt op verzoek aan de inspecteur de inlichtingen die noodzakelijk zijn om het
      beloop van de zekerheid vast te stellen.
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel16b
  - number: 16b.3
    text: |-
      Ten aanzien van de goederen die worden ingevoerd kan door de inspecteur bewijs worden verzocht dat de ingevoerde
      goederen bestemd zijn om naar een andere lidstaat te worden vervoerd of verzonden.
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel16b
  - number: 16b.4
    text: |-
      Met betrekking tot de te stellen zekerheid zijn de bepalingen van Titel III, hoofdstuk 2, van het Douanewetboek van
      de Unie van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel16b
  - number: 16b.5
    text: 'De inspecteur kan de vergunning intrekken of wijzigen:'
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel16b
  - number: 16b.5.a
    text: op verzoek van de vergunninghouder;
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel16b
  - number: 16b.5.b
    text: indien de vergunninghouder niet voldoet aan de aan de vergunning verbonden voorwaarden.
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel16b
  - number: 16b.6
    text: |-
      De vrijstelling is slechts van toepassing indien wordt aangetoond dat ter zake van de levering is voldaan
      aan het bepaalde in de [artikelen 14][ref1], [34c][ref2], [35a][ref3] en [37a van de wet][ref4] alsmede in
      [artikel 12 van het besluit][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel34c
      [ref3]: https://wetten.overheid.nl/BWBR0002629#Artikel35a
      [ref4]: https://wetten.overheid.nl/BWBR0002629#Artikel37a
      [ref5]: https://wetten.overheid.nl/BWBR0002633#Artikel12
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel16b
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0002629
        artikel: 34c
      - id: ref3
        bwb_id: BWBR0002629
        artikel: 35a
      - id: ref4
        bwb_id: BWBR0002629
        artikel: 37a
      - id: ref5
        bwb_id: BWBR0002633
        artikel: '12'
  - number: '17.1'
    text: |-
      Voor goederen opgenomen in de bij deze regeling behorende bijlage A worden voor de toepassing
      van [artikel 23 van de wet][ref1] aangewezen alle ondernemers en lichamen in de zin van de
      [Algemene wet inzake rijksbelastingen][ref2], andere dan ondernemers.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0002320
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '23'
      - id: ref2
        bwb_id: BWBR0002320
  - number: '17.2'
    text: |-
      Bij de aangifte ten invoer worden bescheiden - een kopie-factuur, vracht- en ladingspapieren en dergelijke -
      overgelegd waaruit blijkt dat de regeling van [artikel 23 van de wet][ref1] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel23
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '23'
  - number: 17a.1
    text: |-
      Voor de toepassing van [artikel 23 van de wet][ref1] worden aangewezen alle ondernemers en lichamen in de zin van
      de [Algemene wet inzake rijksbelastingen][ref2], andere dan ondernemers, doch alleen voor wat betreft de voor hen
      bestemde, niet in het vrije verkeer zijnde goederen waarmee in Nederland een vervoermiddel wordt bevoorraad.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0002320
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '23'
      - id: ref2
        bwb_id: BWBR0002320
  - number: 17a.2
    text: |-
      Lichamen moeten van het bevoorraden, bedoeld in het eerste lid, afzonderlijk aantekening houden op de voet van
      artikel 31.
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel17a
  - number: '18.1'
    text: |-
      Voor andere goederen dan bedoeld in de [artikelen 17][ref1] en [17a][ref2] wordt een verzoek om aanwijzing voor de
      toepassing van [artikel 23 van de wet][ref3] ingediend bij de inspecteur. De inspecteur beslist op het verzoek bij
      voor bezwaar vatbare beschikking. Bij inwilliging van het verzoek stelt de inspecteur een datum van ingang vast en
      kent hij aan de belanghebbende een btw-identificatienummer toe.


      [ref1]: https://wetten.overheid.nl/BWBR0002634#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0002634#Artikel17a
      [ref3]: https://wetten.overheid.nl/BWBR0002629#Artikel23
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0002634
        artikel: '17'
        hoofdstuk: VII
      - id: ref2
        bwb_id: BWBR0002634
        artikel: 17a
        hoofdstuk: VII
      - id: ref3
        bwb_id: BWBR0002629
        artikel: '23'
  - number: '18.2'
    text: 'Het verzoek wordt slechts ingewilligd, indien de belanghebbende:'
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel18
  - number: 18.2.a
    text: in Nederland woont of is gevestigd, dan wel aldaar een vaste inrichting of een fiscaal vertegenwoordiger heeft;
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel18
  - number: 18.2.b
    text: |-
      geregeld goederen invoert, dan wel incidenteel goederen invoert en een fiscaal vertegenwoordiger in Nederland
      heeft;
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel18
  - number: 18.2.c
    text: |-
      een bedrijfsadministratie voert welke naar het oordeel van de inspecteur zodanig is ingericht dat daarin op
      overzichtelijke wijze zijn opgenomen de door de inspecteur nodig geoordeelde gegevens omtrent de ingevoerde
      goederen, en dat aan de hand daarvan op eenvoudige wijze de ter zake van de invoer van die goederen verschuldigde
      omzetbelasting kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel18
  - number: '18.3'
    text: |-
      De aanwijzing geldt voor alle goederen welke ten behoeve van de belanghebbende worden ingevoerd, waaronder zijn
      begrepen de goederen ter zake waarvan de belanghebbende aan een andere ondernemer een schriftelijke verklaring
      heeft afgegeven dat hij de goederen invoert of dat de invoer in zijn opdracht plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel18
  - number: '18.4'
    text: |-
      Ten aanzien van goederen welke door Koninklijke PostNL B.V. worden ingevoerd, vindt [artikel 23 van de wet][ref1]
      slechts toepassing, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel23
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '23'
  - number: 18.4.a
    text: |-
      op de postzending of in de daarbij behorende bescheiden het aan de belanghebbende toegekende btw-
      identificatienummer is vermeld, of
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel18
  - number: 18.4.b
    text: |-
      ten aanzien van de postzending de belanghebbende een schriftelijke inklaringsopdracht aan Koninklijke PostNL B.V.
      heeft verstrekt waarin het aan hem toegekende btw-identificatienummer is vermeld.
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel18
  - number: '18.5'
    text: 'Tenzij de inspecteur anders bepaalt, moet de belanghebbende voldoen aan de volgende voorwaarden:'
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel18
  - number: 18.5.a
    text: |-
      van de invoer wordt afzonderlijk aantekening gehouden op de voet van [artikel 31][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002634#Artikel31
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0002634
        artikel: '31'
        hoofdstuk: XII
  - number: 18.5.b
    text: |-
      bij aangifte ten invoer van de goederen worden bescheiden - een kopie-factuur, vracht- en ladingspapieren en
      dergelijke - overgelegd waaruit blijkt dat de goederen voor belanghebbende zijn bestemd en de regeling van
      [artikel 23 van de wet][ref1] van toepassing is. Op deze bescheiden moet het btw-identificatienummer zijn vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel23
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '23'
  - number: '18.6'
    text: |-
      Ingeval de belanghebbende handelt in strijd met de gestelde voorwaarden, alsmede in geval van misbruik, waaronder
      wordt begrepen misbruik door de vervoerder van de goederen, kan de inspecteur de aanwijzing intrekken en een nieuwe
      aanwijzing weigeren. De intrekking en de weigering geschieden bij voor bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel18
  - number: '18.7'
    text: |-
      Het eerste tot en met zesde lid zijn niet van toepassing op personenauto’s, bestelauto’s en motorrijwielen in de
      zin van de [artikelen 3][ref1] en [4 van de Wet op de belasting van personenauto’s en motorrijwielen 1992][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005806#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005806#Artikel4
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0005806
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0005806
        artikel: '4'
  - number: 18a.1
    text: |-
      Voor personenauto’s en bestelauto’s in de zin van
      [artikel 3 van de Wet op de belasting van personenauto’s en motorrijwielen 1992][ref1] wordt een verzoek om
      aanwijzing voor de toepassing van [artikel 23 van de wet][ref2] ingediend bij de inspecteur. De inspecteur beslist
      op het verzoek bij voor bezwaar vatbare beschikking. Bij inwilliging van het verzoek stelt de inspecteur een datum
      van ingang vast en wijst hij aan waar aangifte ten invoer dient te geschieden.


      [ref1]: https://wetten.overheid.nl/BWBR0005806#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel23
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel18a
    references:
      - id: ref1
        bwb_id: BWBR0005806
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0002629
        artikel: '23'
  - number: 18a.2
    text: 'Het verzoek wordt slechts ingewilligd, indien:'
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel18a
  - number: 18a.2.a
    text: |-
      de belanghebbende in Nederland woont of is gevestigd, dan wel aldaar een vaste inrichting of een fiscaal
      vertegenwoordiger heeft;
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel18a
  - number: 18a.2.b
    text: |-
      de belanghebbende reeds gedurende een tijdvak van ten minste zes maanden geregeld goederen als bedoeld in het
      eerste lid, heeft ingevoerd en op regelmatige wijze de ter zake van de invoer van die goederen verschuldigde
      omzetbelasting heeft voldaan;
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel18a
  - number: 18a.2.c
    text: |-
      de belanghebbende een bedrijfsadministratie voert welke naar het oordeel van de inspecteur zodanig is ingericht dat
      daarin op overzichtelijke wijze zijn opgenomen de door de inspecteur nodig geoordeelde gegevens omtrent de hiervoor
      bedoelde goederen en dat aan de hand daarvan op eenvoudige wijze de ter zake van de invoer van die goederen
      verschuldigde omzetbelasting kan worden vastgesteld;
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel18a
  - number: 18a.2.d
    text: |-
      de voldoening van de ter zake van de invoer van de hiervoor bedoelde goederen verschuldigde omzetbelasting naar het
      oordeel van de inspecteur is verzekerd.
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel18a
  - number: 18a.3
    text: 'De belanghebbende moet voldoen aan de volgende voorwaarden:'
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel18a
  - number: 18a.3.a
    text: |-
      van de invoer van goederen als zijn bedoeld in het eerste lid, wordt afzonderlijk aantekening gehouden op de voet
      van [artikel 31][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002634#Artikel31
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel18a
    references:
      - id: ref1
        bwb_id: BWBR0002634
        artikel: '31'
        hoofdstuk: XII
  - number: 18a.3.b
    text: |-
      bij aangifte ten invoer van de hiervoor bedoelde goederen worden bescheiden - een kopie-factuur, vracht- en
      ladingspapieren en dergelijke - overgelegd waaruit blijkt dat de goederen voor belanghebbende zijn bestemd en de
      regeling van [artikel 23 van de wet][ref1] van toepassing is. Op deze bescheiden moeten datum en nummer van de
      in het eerste lid bedoelde beschikking, alsmede in voorkomende gevallen het op de voet van [artikel 18][ref2] aan
      belanghebbende toegekende btw-identificatienummer zijn vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0002634#Artikel18
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel18a
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '23'
      - id: ref2
        bwb_id: BWBR0002634
        artikel: '18'
        hoofdstuk: VII
  - number: 18a.4
    text: De inspecteur is bevoegd in bepaalde gevallen nadere voorwaarden te stellen.
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel18a
  - number: 18a.5
    text: |-
      Ingeval de belanghebbende handelt in strijd met de gestelde voorwaarden, alsmede in geval van misbruik, waaronder
      wordt begrepen misbruik door de vervoerder van de in het eerste lid bedoelde goederen, kan de inspecteur de
      aanwijzing intrekken en een nieuwe aanwijzing weigeren. De intrekking en de weigering geschieden bij voor bezwaar
      vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel18a
  - number: 18a.6
    text: |-
      Het eerste tot en met vijfde lid zijn van overeenkomstige toepassing op motorrijwielen in de zin
      van[ artikel 4 van de Wet op de belasting van personenauto’s en motorrijwielen 1992][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005806#Artikel4
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel18a
    references:
      - id: ref1
        bwb_id: BWBR0005806
        artikel: '4'
  - number: 18b
    text: |-
      Bij toepassing van de artikelen 17, 17a, 18 en 18a is degene die goederen ten invoer aangeeft verplicht op eerste
      vordering een kopie-factuur in te leveren. Indien in een van de gevallen bedoeld in de eerste volzin van dit
      lid geen factuur wordt opgemaakt, wordt in plaats van een kopie-factuur een daarmee gelijk te stellen bescheid
      ingeleverd.
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel18b
  - number: '19'
    text: |-
      De schriftelijke opdracht, bedoeld in [artikel 12, tweede lid, onderdeel d, van het besluit][ref1], tot uitvoer
      uit de Unie of tot plaatsing onder de regeling douane-entrepot op basis van artikel 237, tweede lid, van het
      Douanewetboek van de Unie wordt opgemaakt overeenkomstig het in de bij deze regeling behorende [bijlage B][ref2]
      opgenomen model.


      [ref1]: https://wetten.overheid.nl/BWBR0002633#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0002634
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0002633
        artikel: '12'
      - id: ref2
        bwb_id: BWBR0002634
  - number: '20'
    text: |-
      Bij de aangifte ter verkrijging van teruggaaf op grond van [artikel 24, eerste lid, van de wet][ref1] worden
      overgelegd:


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel24
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '24'
  - number: 20.a
    text: bescheiden waarmee kan worden aangetoond hoeveel belasting voor de goederen is betaald;
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel20
  - number: 20.b
    text: |-
      het certificaat van uitvoer waarin de uit de Unie uitgevoerde of in een entrepot opgeslagen goederen zijn vermeld
      en dat overeenkomstig [artikel 22][ref1] is aangeboden en afgetekend;


      [ref1]: https://wetten.overheid.nl/BWBR0002634#Artikel22
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0002634
        artikel: '22'
        hoofdstuk: VII
  - number: 20.c
    text: |-
      voor wat betreft motorrijtuigen waarvoor ter zake van de in [artikel 36 van de Wegenverkeerswet 1994][ref1]
      bedoelde opgaaf van een kenteken een bewijs is afgegeven, een ter zake van de uitvoer uit de
      Unie door de Dienst Wegverkeer afgegeven kentekenbewijs deel II, dat is uitgereikt op de voet van
      [artikel 17, tweede lid, van het Kentekenreglement][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0006951#Artikel17
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '36'
      - id: ref2
        bwb_id: BWBR0006951
        artikel: '17'
  - number: '21'
    text: |-
      In de aangifte ter verkrijging van teruggaaf op grond van [artikel 24, eerste lid, van de wet][ref1] worden per
      partij uit de Unie uitgevoerde of in een entrepot opgeslagen goederen vermeld:


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel24
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '24'
  - number: 21.a
    text: het bedrag van de gevraagde teruggaaf;
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel21
  - number: 21.b
    text: de soort en de hoeveelheid van de uit de Unie uitgevoerde of in een entrepot opgeslagen goederen;
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel21
  - number: 21.c
    text: het nummer van het certificaat van uitvoer;
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel21
  - number: 21.d
    text: een omschrijving van de bescheiden waarmee kan worden aangetoond hoeveel belasting voor de goederen is betaald.
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel21
  - number: '22.1'
    text: |-
      Een lichaam als bedoeld in [artikel 24, eerste lid, van de wet][ref1], dat aanspraak wil maken op teruggaaf van de
      belasting op grond van dat artikel, draagt zorg, dat de goederen bij de uitvoer uit de Unie of bij de opslag in een
      entrepot zijn vergezeld van een certificaat van uitvoer uit de Unie. Daartoe dient te worden gebruik gemaakt van
      een van rijkswege tegen betaling verkrijgbaar gesteld formulier.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel24
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '24'
  - number: '22.2'
    text: 'In het certificaat worden vermeld:'
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel22
  - number: 22.2.a
    text: een per kalenderjaar doorlopend volgnummer;
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel22
  - number: 22.2.b
    text: de naam en het adres van het lichaam;
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel22
  - number: 22.2.c
    text: een nauwkeurige omschrijving van de soort en de hoeveelheid van de goederen.
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel22
  - number: '22.3'
    text: |-
      Het certificaat wordt, na daartoe te zijn aangeboden, voor uitvoer uit de Unie afgetekend door de daartoe bevoegde
      ambtenaar. Deze zendt het certificaat terug aan het daarin vermelde adres.
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel22
  - number: '23'
    text: |-
      Ingeval een lichaam als bedoeld in [artikel 24, eerste lid, van de wet][ref1], is aangewezen op de voet van
      [artikel 23 van de wet][ref2], kunnen de artikelen 20 en 22 al dan niet op verzoek en onder nader bij de aanwijzing
      te stellen voorwaarden buiten toepassing worden verklaard.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel23
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '24'
      - id: ref2
        bwb_id: BWBR0002629
        artikel: '23'
  - number: 23a.1
    text: |-
      In geval van levering van goederen aan natuurlijke personen die hun normale verblijfplaats hebben in een derde-land
      en die, anders dan als ondernemer, deze goederen uiterlijk het einde van de derde maand na de maand van aankoop
      bij het verlaten van Nederland in hun persoonlijke bagage meevoeren naar een derde-land, hetzij rechtstreeks hetzij
      via één of meer andere lidstaten, is de ondernemer gerechtigd, in afwijking van het wettelijk geldende tarief, het
      tarief van nihil toe te passen, indien de totale waarde van de op de factuur vermelde goederen, inclusief de tegen
      het wettelijk tarief berekende belasting, ten minste € 50 bedraagt. De normale verblijfplaats dient aan de hand van
      een legitimatiebewijs te worden aangetoond.
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel23a
  - number: 23a.2
    text: |-
      Het eerste lid, eerste volzin, is van overeenkomstige toepassing met betrekking tot goederen die worden afgenomen
      door een natuurlijke persoon die zijn normale verblijfplaats heeft in de Unie en die ten genoegen van de inspecteur
      kan aantonen dat hij zich binnen de in het eerste lid bedoelde termijn in een derde-land zal vestigen.
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel23a
  - number: 23a.3
    text: |-
      Met betrekking tot de toepassing van het tarief van nihil is het bepaalde in [artikel 12 van het besluit][ref1]
      van overeenkomstige toepassing, met dien verstande dat voor het aantonen van de aanspraak op toepassing daarvan in
      ieder geval is vereist een factuur, een kopie-factuur, of een daarmee gelijk te stellen bescheid dat, na daartoe te
      zijn aangeboden, voor uitvoer uit de Unie is afgetekend door een daartoe bevoegde ambtenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0002633#Artikel12
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel23a
    references:
      - id: ref1
        bwb_id: BWBR0002633
        artikel: '12'
  - number: '24.1'
    text: |-
      Indien aannemelijk is, dat over een jaar [artikel 25 van de wet][ref1] van toepassing zal zijn, kan de ondernemer
      per belastingtijdvak van dat jaar een voorlopige vermindering op de belasting toepassen.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel25
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '25'
  - number: '24.2'
    text: |-
      De voorlopige vermindering is per belastingtijdvak van een kwartaal gelijk aan de belasting vóór aftrek van de
      vermindering. Zij bedraagt per belastingtijdvak van een kwartaal evenwel bij een vermoedelijke belasting per jaar
      vóór toepassing van [artikel 25, eerste lid, van de wet][ref1], van:


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel25
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '25'
  - number: 24.2.a
    text: meer dan € 1345 doch niet meer dan € 1475 ten hoogste € 250;
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel24
  - number: 24.2.b
    text: meer dan € 1475 doch niet meer dan € 1611 ten hoogste € 159;
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel24
  - number: 24.2.c
    text: meer dan € 1611 doch niet meer dan € 1747 ten hoogste € 68;
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel24
  - number: 24.2.d
    text: meer dan € 1747 nihil.
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel24
  - number: '24.3'
    text: |-
      Na afloop van het jaar wordt de voorlopige vermindering verrekend met de in
      [artikel 25, eerste lid, van de wet][ref1] bedoelde vermindering.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel25
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '25'
  - number: '24.4'
    text: |-
      Indien de verrekening leidt tot een hoger bedrag dan over het jaar aan belasting is betaald, moet het verschil
      worden voldaan op de aangifte over het eerste belastingtijdvak van het volgende jaar; leidt de herrekening tot
      een lager bedrag dan over het jaar aan belasting is betaald, dan wordt het verschil aan de ondernemer op verzoek
      teruggegeven.
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel24
  - number: '25.1'
    text: |-
      Ontheffing van verplichtingen, opgelegd bij of krachtens de [artikelen 34][ref1] en [34c van de wet][ref2],
      wordt op verzoek verleend, indien aannemelijk is, dat de ondernemer jaarlijks, na toepassing van
      [artikel 25, eerste lid, van de wet][ref3], geen belasting behoeft te voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel34c
      [ref3]: https://wetten.overheid.nl/BWBR0002629#Artikel25
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '34'
      - id: ref2
        bwb_id: BWBR0002629
        artikel: 34c
      - id: ref3
        bwb_id: BWBR0002629
        artikel: '25'
  - number: '25.2'
    text: |-
      De inspecteur beslist op het verzoek bij voor bezwaar vatbare beschikking. De ontheffing gaat in bij het begin
      van het jaar, volgende op dat waarin het verzoek is gedaan. Indien het verzoek wordt gedaan op of voorafgaand aan
      de dag van het starten met het verrichten van belaste economische activiteiten, kan, in afwijking van de vorige
      volzin, de ontheffing worden verleend met ingang van de dag waarop met deze activiteiten wordt gestart.
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel25
  - number: '25.3'
    text: |-
      De ondernemer die ontheffing heeft verkregen, kan volstaan met het ordelijk
      bewaren van de aan hem uitgereikte facturen gedurende de termijn, bedoeld in
      [artikel 52, vierde lid, van de Algemene wet inzake rijksbelastingen][ref1] en in [artikel 34a van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel52
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel34a
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '52'
      - id: ref2
        bwb_id: BWBR0002629
        artikel: 34a
  - number: '25.4'
    text: 'De ontheffing vervalt:'
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel25
  - number: 25.4.a
    text: bij schriftelijke opzegging door de ondernemer;
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel25
  - number: 25.4.b
    text: |-
      zodra de ondernemer weet of redelijkerwijs moet vermoeden, dat hij niet langer voldoet aan de voor de ontheffing
      gestelde eisen;
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel25
  - number: 25.4.c
    text: bij niet-voldoening aan het derde lid.
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel25
  - number: '25.5'
    text: Na het vervallen van de ontheffing door opzegging kan een hernieuwd verzoek eerst na vijf jaar worden ingewilligd.
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel25
  - number: '25.6'
    text: |-
      De omzetbelasting die de ondernemer die ontheffing heeft gekregen, op aangifte moet voldoen op grond van de
      [artikelen 12, tweede, derde en vijfde lid][ref1], [17f][ref2] en [23 van de wet][ref3], kan door hem niet op de
      voet van [artikel 15 van de wet][ref4] op de aangifte in aftrek worden gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel17f
      [ref3]: https://wetten.overheid.nl/BWBR0002629#Artikel23
      [ref4]: https://wetten.overheid.nl/BWBR0002629#Artikel15
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '12'
      - id: ref2
        bwb_id: BWBR0002629
        artikel: 17f
      - id: ref3
        bwb_id: BWBR0002629
        artikel: '23'
      - id: ref4
        bwb_id: BWBR0002629
        artikel: '15'
  - number: 25a
    text: |-
      Voor de bepaling van de vermindering als bedoeld in [artikel 25, eerste lid, van de wet][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel25
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel25a
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '25'
  - number: 25a.a
    text: |-
      dient de belasting die ingevolge de [artikelen 12, tweede en derde lid][ref1], [17f][ref2] en
      [23 van de wet][ref3], wordt geheven van de ondernemer, niet te worden beschouwd als door hem verschuldigde
      belasting; en


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel17f
      [ref3]: https://wetten.overheid.nl/BWBR0002629#Artikel23
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel25a
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '12'
      - id: ref2
        bwb_id: BWBR0002629
        artikel: 17f
      - id: ref3
        bwb_id: BWBR0002629
        artikel: '23'
  - number: 25a.b
    text: |-
      dient de belasting die ingevolge [artikel 12, vijfde lid, van de wet][ref1], wordt geheven van degene aan wie de
      levering wordt verricht of de dienst wordt verleend, in aanmerking te worden genomen als ware zij geheven van de
      ondernemer die de levering of de dienst verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel12
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel25a
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '12'
  - number: '26.1'
    text: |-
      Als ondernemers als bedoeld in [artikel 26 van de wet][ref1], worden aangewezen:


      [ref1]: https://wetten.overheid.nl/BWBR0002629
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0002629
  - number: 26.1.a.1°
    text: winkeliers;
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel26
  - number: 26.1.a.2°
    text: marktkooplieden;
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel26
  - number: 26.1.a.3°
    text: schoenherstellers;
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel26
  - number: 26.1.a.4°
    text: kappers;
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel26
  - number: 26.1.a.5°
    text: glazenwassers;
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel26
  - number: 26.1.a.6°
    text: exploitanten van wasserijen;
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel26
  - number: 26.1.a.7°
    text: rijwielherstellers;
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel26
  - number: 26.1.a.8°
    text: exploitanten van schoonheidsverzorgingsbedrijven;
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel26
  - number: 26.1.a.9°
    text: behangers;
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel26
  - number: 26.1.a.10°
    text: stoffeerders;
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel26
  - number: 26.1.a.11°
    text: exploitanten van horecabedrijven;
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel26
  - number: 26.1.a.12°
    text: advocaten die hun praktijk alleen uitoefenen;
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel26
  - number: 26.1.a.13°
    text: houders van autorijscholen;
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel26
  - number: 26.1.b
    text: |-
      andere dan de in onderdeel a genoemde ondernemers, indien zij hun prestaties als ondernemer uitsluitend of nagenoeg
      uitsluitend verrichten in of vanuit een inrichting welke bestemd is voor de verkoop van goederen of het verlenen
      van diensten aan anderen dan ondernemers;
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel26
  - number: 26.1.c
    text: |-
      niet onder de onderdelen a of b vallende ondernemers die niet aan ondernemers goederen plegen te
      leveren en diensten plegen te verlenen, behoudens voorzover zij goederen leveren als bedoeld in
      [artikel 3, tweede lid, van de wet][ref1], mits zij op daartoe gedaan verzoek door de inspecteur zijn aangewezen.
      De inspecteur beslist op het verzoek bij voor bezwaar vatbare beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel3
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '3'
  - number: '26.2'
    text: |-
      Indien de in het eerste lid in de onderdelen a en b bedoelde ondernemers van de aanwijzing geen gebruik maken,
      dienen zij daarvan schriftelijk kennis te geven aan de inspecteur.
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel26
  - number: '28.1'
    text: |-
      De aftrek en de teruggaaf op grond van [artikel 27, vierde onderscheidenlijk vijfde lid, van de wet][ref1], vinden
      slechts plaats, indien de ondernemer aan wie de landbouwer, veehouder, tuinbouwer of bosbouwer de goederen heeft
      geleverd, een door deze ondertekende verklaring kan overleggen waaruit blijkt, dat de goederen binnen het kader van
      de genoemde bepaling zijn geleverd, en waarin voorts zijn vermeld:


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel27
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '27'
  - number: 28.1.a
    text: naam en adres van de leverancier;
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel28
  - number: 28.1.b
    text: de dag waarop de levering wordt verricht;
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel28
  - number: 28.1.c
    text: naam en adres van de afnemer;
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel28
  - number: 28.1.d
    text: de hoeveelheid van de goederen;
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel28
  - number: 28.1.e
    text: een duidelijke omschrijving van de goederen;
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel28
  - number: 28.1.f
    text: het in rekening gebrachte bedrag.
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel28
  - number: '28.2'
    text: |-
      De in het eerste lid bedoelde verklaring wordt opgemaakt vóór de vijftiende dag van de maand, volgende op die
      waarin de levering is verricht.
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel28
  - number: '28.3'
    text: De aftrek vindt plaats in het belastingtijdvak waarin de goederen zijn geleverd.
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel28
  - number: '28.4'
    text: |-
      Ingeval van leveringen aan veilingen en andere vaste afnemers kan, in afwijking van het eerste en het tweede lid,
      de landbouwer, veehouder, tuinbouwer en bosbouwer volstaan met een éénmaal per kalenderjaar af te geven verklaring
      waaruit blijkt, dat de goederen binnen het kader van [artikel 27, vierde lid, van de wet][ref1] zijn geleverd. In
      dat geval houdt degene aan wie de goederen worden geleverd, van iedere levering op zodanige wijze aantekening dat
      daaruit de in het eerste lid, onderdelen a tot en met f, bedoelde gegevens blijken.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel27
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '27'
  - number: '28.5'
    text: Het eerste tot en met vierde lid zijn ten aanzien van diensten voor zover mogelijk van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel28
  - number: '29'
    text: |-
      De wederopzegging door belanghebbende, bedoeld in [artikel 27, zesde lid, van de wet][ref1], dient schriftelijk
      te geschieden.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel27
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '27'
  - number: 29b
    text: |-
      De ondernemer of de tussenpersoon die het recht uitoefent om overeenkomstig [artikel 28l van de wet][ref1] voor
      belastingheffing te kiezen, stelt de inspecteur schriftelijk in kennis van deze keuze.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel28l
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel29b
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 28l
  - number: 29c
    text: |-
      Handelingen die op grond van [artikel 28k van de wet][ref1] van de belasting zijn vrijgesteld, worden voor de
      toepassing van de [artikelen 11 tot en met 14][ref2] aangemerkt als handelingen waarvoor geen recht op aftrek van
      voorbelasting bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel28k
      [ref2]: https://wetten.overheid.nl/BWBR0002634#Artikel11
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel29c
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 28k
      - id: ref2
        bwb_id: BWBR0002634
        artikel: '11'
        hoofdstuk: VI
  - number: 29d
    text: |-
      Voor de toepassing van de in [artikel 28k van de wet][ref1] vervatte vrijstelling, is de ondernemer gehouden een
      boekhouding te voeren waarin de voor die toepassing nodige gegevens op duidelijke en overzichtelijke wijze zijn
      vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel28k
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel29d
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 28k
  - number: 30a
    text: |-
      Een ondernemer die buiten de Unie woont of is gevestigd en geen vaste inrichting in Nederland heeft, dient indien
      de inspecteur zulks vraagt, bij een verzoek om teruggaaf als bedoeld in [artikel 31, tweede lid, van de wet][ref1]
      aan te tonen dat hij ondernemer is in de zin van [artikel 7 van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel7
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel30a
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '31'
      - id: ref2
        bwb_id: BWBR0002629
        artikel: '7'
  - number: '31.1'
    text: 'De ondernemer is gehouden regelmatig aantekening te houden van:'
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel31
  - number: 31.1.a
    text: |-
      de aan hem en door hem uitgereikte facturen alsmede, indien het een wederverkoper betreft, de door hem uitgereikte
      inkoopverklaringen;
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel31
  - number: 31.1.b
    text: |-
      de uitgaven en ontvangsten ter zake van de aan hem en door hem verrichte leveringen van goederen en verleende
      diensten en de door hem verrichte intracommunautaire verwervingen van goederen;
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel31
  - number: 31.1.c
    text: het betrekken van voor hem bestemde ingevoerde goederen;
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel31
  - number: 31.1.d
    text: het verzenden of afleveren van door hem voor uitvoer uit de Unie of opslag in een entrepot bestemde goederen.
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel31
  - number: '31.2'
    text: 'De in het eerste lid bedoelde aantekeningen van facturen - welke doorlopend dienen te worden genummerd - omvatten:'
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel31
  - number: 31.2.a
    text: dagtekening en nummer;
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel31
  - number: 31.2.b
    text: |-
      naam, adres en, in voorkomend geval, btw-identificatienummer van de ondernemer door wie of aan wie de levering
      of de dienst wordt verricht, alsmede van degene aan wie wordt geleverd met toepassing van de bij de wet behorende
      [tabel II][ref1], onderdeel a, post 6;


      [ref1]: https://wetten.overheid.nl/BWBR0002629
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0002629
  - number: 31.2.c
    text: een duidelijke omschrijving van de geleverde goederen of van de dienst;
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel31
  - number: 31.2.d
    text: de vergoeding;
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel31
  - number: 31.2.e
    text: het bedrag van de belasting.
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel31
  - number: '31.3'
    text: |-
      De rechtspersoon, andere dan ondernemer, is gehouden ter zake van zijn intracommunautaire verwervingen regelmatig
      aantekening te houden van:
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel31
  - number: 31.3.a
    text: de aan hem uitgereikte facturen;
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel31
  - number: 31.3.b
    text: de uitgaven ter zake van die verwervingen.
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel31
  - number: '31.4'
    text: 'De in het derde lid bedoelde aantekeningen van facturen - welke doorlopend dienen te worden genummerd - omvatten:'
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel31
  - number: 31.4.a
    text: dagtekening en nummer;
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel31
  - number: 31.4.b
    text: naam, adres en btw-identificatienummer van degene door wie de levering wordt verricht;
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel31
  - number: 31.4.c
    text: een duidelijke omschrijving van de geleverde goederen;
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel31
  - number: 31.4.d
    text: 'de vergoeding onderscheiden naar:'
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel31
  - number: 31.4.d.1°
    text: nieuwe vervoermiddelen;
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel31
  - number: 31.4.d.2°
    text: accijnsgoederen;
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel31
  - number: 31.4.d.3°
    text: overige goederen;
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel31
  - number: 31.4.e
    text: het bedrag van de belasting.
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel31
  - number: '31.5'
    text: |-
      De aantekeningen worden op zodanige duidelijke en overzichtelijke wijze en met vermelding van zodanige
      bijzonderheden gehouden, dat aan de hand daarvan de door de ondernemer of door de rechtspersoon, andere dan
      ondernemer, over een bepaald belastingtijdvak verschuldigde belasting kan worden vastgesteld. De wederverkoper
      is tevens gehouden om met betrekking tot goederen die administratief van inkoop tot verkoop zijn te volgen, zijn
      boekhouding op zodanige wijze te voeren dat aan de hand daarvan het verband tussen inkoop en verkoop kan worden
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel31
  - number: '31.6'
    text: |-
      De ondernemer en de rechtspersoon, andere dan ondernemer, zijn verplicht de aantekeningen te bewaren gedurende
      de termijn, bedoeld in [artikel 52, vierde lid, van de Algemene wet inzake rijksbelastingen][ref1] en in
      [artikel 34a van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel52
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel34a
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '52'
      - id: ref2
        bwb_id: BWBR0002629
        artikel: 34a
  - number: '31.7'
    text: De inspecteur kan afwijkingen toestaan van de verplichtingen welke zijn opgelegd in de vorige leden.
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel31
  - number: '31.8'
    text: |-
      De ondernemer is gehouden zijn boekhouding op zodanige duidelijke en overzichtelijke wijze te voeren en
      met vermelding van zodanige bijzonderheden, dat de inspecteur aan de hand daarvan kan vaststellen of de
      belastingheffing met betrekking tot de in [artikel 34, tweede lid, onderdelen a en b, van de wet][ref1], bedoelde
      goederen, op de juiste wijze plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0002629
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0002629
  - number: 31a
    text: |-
      De ondernemer aan wie een vergunning voor een fiscaal vertegenwoordiger als bedoeld in
      [artikel 24c van het besluit][ref1] is verleend, is gehouden:


      [ref1]: https://wetten.overheid.nl/BWBR0002633#Artikel24c
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel31a
    references:
      - id: ref1
        bwb_id: BWBR0002633
        artikel: 24c
  - number: 31a.a
    text: |-
      afzonderlijk aantekening te houden van de gegevens als bedoeld in artikel 31 die betrekking hebben op de
      buitenlandse ondernemer;
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel31a
  - number: 31a.b
    text: |-
      de aantekeningen als bedoeld in onderdeel a zodanig te houden dat de herkomst en de bestemming van de goederen op
      eenvoudige wijze kunnen worden gevolgd en de verschuldigde belasting op eenvoudige wijze kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel31a
  - number: 31b
    text: |-
      Het verzoek om teruggaaf, bedoeld in [artikel 29, tiende lid, van de wet][ref1], wordt door de ondernemer per
      aangiftetijdvak ingediend op de door de inspecteur aan te geven wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel29
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel31b
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '29'
  - number: '32.1'
    text: |-
      Als ondernemers als bedoeld in [artikel 34e van de wet][ref1], worden aangewezen groothandelaren in levensmiddelen,
      tabaksproducten, dranken, tandheelkundige grondstoffen, tandtechnische werken en onderdelen van tandtechnische
      werken.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel34e
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 34e
  - number: '32.2'
    text: |-
      De in [artikel 34c, tweede lid, van de wet][ref1], bedoelde ontheffing van de verplichting om een factuur uit te
      reiken indien vrijgestelde prestaties worden verricht, geldt niet ter zake van de levering van een roerende zaak
      als bedoeld in [artikel 11, eerste lid, onderdeel r, van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel34c
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel11
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 34c
      - id: ref2
        bwb_id: BWBR0002629
        artikel: '11'
  - number: '33.1'
    text: |-
      In afwijking in zoverre van de verplichtingen opgelegd bij [artikel 35a van de wet][ref1] geldt als een op de
      voorgeschreven wijze opgemaakte factuur:


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel35a
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 35a
  - number: 33.1.a
    text: |-
      het vervoersbewijs voorzover de ondernemer personen vervoert in de vorm van openbaar vervoer of taxivervoer als
      bedoeld in [artikel 1 van de Wet personenvervoer 2000][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel1
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '1'
  - number: 33.1.b
    text: |-
      de gebruikelijke afrekening voorzover de ondernemer spijzen en dranken verstrekt voor gebruik ter plaatse binnen
      het kader van het hotel-, café-, restaurant-, pension- en aanverwant bedrijf aan personen die daar slechts voor een
      korte periode verblijf houden;
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel33
  - number: 33.1.c
    text: |-
      de factuur die bij inruiltransacties wordt uitgereikt en die de gehele inruiltransactie dekt, mits die factuur alle
      vermeldingen bevat die anders op de afzonderlijk uit te reiken facturen zouden moeten worden vermeld;
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel33
  - number: 33.1.d
    text: |-
      de wekelijks of maandelijks uitgereikte verzamelfactuur met betrekking tot leveringen of diensten waarbij bonnen en
      dergelijke worden uitgereikt die op zich niet voldoen aan de factuurvereisten, mits deze verwijst naar de bonnen en
      dergelijke, en samen daarmee voldoet aan de factuurvereisten;
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel33
  - number: 33.1.e
    text: |-
      het gedeelte van de overschrijvingskaart dat de afnemer behoudt of de aan de afnemer gezonden bank- of giro-
      afrekening, bij het gebruik van acceptgirokaarten onderscheidenlijk automatische overschrijving;
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel33
  - number: '33.2'
    text: |-
      In afwijking in zoverre van de verplichtingen opgelegd bij [artikel 35a van de wet][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel35a
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 35a
  - number: 33.2.a
    text: |-
      kan bij de levering van energie voor landvoertuigen de vermelding van de naam en het adres van de afnemer
      achterwege blijven, mits die afnemer kan worden geïdentificeerd doordat zijn gegevens door de wijze van betalen,
      giraal of anderszins, traceerbaar zijn;
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel33
  - number: 33.2.b
    text: |-
      kan bij de levering van goederen door groothandelaren, in plaats van de vermelding van de aard van de geleverde
      goederen, een door de inspecteur goedgekeurde codevermelding worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel33
  - number: '33.3'
    text: |-
      Geen afwijkingen zijn toegestaan voor leveringen als bedoeld in [artikel 5a van de wet][ref1] en voor leveringen
      met toepassing van de bij de wet behorende [tabel II, onderdeel a, post 6][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel5a
      [ref2]: https://wetten.overheid.nl/BWBR0002629
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 5a
      - id: ref2
        bwb_id: BWBR0002629
  - number: 33a.1
    text: |-
      De aanvrager van het teruggaafverzoek als bedoeld in [artikel 32f van de wet][ref1] neemt in het verzoek alle
      informatie op die is voorgeschreven in de artikelen 8 en 9, lid 1, van Richtlijn 2008/9/EG.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel32f
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel33a
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 32f
  - number: 33a.2
    text: |-
      De aanvrager van het verzoek bedoeld in het eerste lid omschrijft in het verzoek mede zijn beroepsactiviteit op de
      wijze als genoemd in [artikel 32h van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel32h
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel33a
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 32h
  - number: 33a.3
    text: |-
      De aanvrager kan zowel voor het verstrekken van de gegevens in het in het eerste lid bedoelde verzoek als voor
      alle mogelijke andere op dit teruggaafverzoek betrekking hebbende te verstrekken aanvullende of verder aanvullende
      gegevens, gebruik maken van de Nederlandse, Engelse of Duitse taal.
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel33a
  - number: 33b
    text: |-
      Het bedrag, bedoeld in [artikel 37a, derde lid, van de wet][ref1], is € 50.000.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel37a
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel33b
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 37a
  - number: '34'
    text: |-
      Als hulpmiddelen die speciaal zijn ontworpen dan wel bestemd voor het exclusieve en persoonlijke gebruik door
      blinden en slechtzienden als bedoeld in de bij de wet behorende tabel I, onderdeel a, post 31, worden aangewezen:
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel34
  - number: 34.a
    text: sprekende koortsthermometers, bloedsuikermeters en bloeddrukmeters die worden aangewend voor zelfdiagnose;
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel34
  - number: 34.b
    text: |-
      programmatuur, alsmede de hiermee samenhangende apparatuur, die door middel van zogeheten spraakoutput er specifiek
      op is gericht visueel gehandicapten in staat te stellen om met computers te werken;
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel34
  - number: 34.c
    text: |-
      programmatuur die grafische besturingssystemen omzet in voor zogeheten spraakoutput en brailleschrift begrijpelijke
      informatie;
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel34
  - number: 34.d
    text: |-
      programmatuur die erop is gericht om conventionele geschriften met behulp van een scanner om te zetten in een door
      een computer te gebruiken tekst waardoor deze geschriften toegankelijk worden voor visueel gehandicapten;
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel34
  - number: 34.e
    text: |-
      programmatuur die erop is gericht de weergave op het beeldscherm van een computer te vergroten en/of te laten
      contrasteren;
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel34
  - number: 34.f
    text: |-
      . bijzondere gezichtshulpmiddelen voor slechtzienden die gewoonlijk door een arts of een optometrist worden
      voorgeschreven en individueel worden aangemeten, te weten: op of in een bril gemonteerde kijkerloepsystemen;
      telescoop- en prismaloepbrillen, de daarbij behorende opsteeklenzen daaronder begrepen; in een brilmontuur of
      brilglazen aan te brengen vergroot- en loepglazen; filterlenzen en -toepassingen en filterglazen bestemd voor
      een selectieve absorptie van meer dan 400 Nn. van het licht met korte golflengte; alsmede tafelloepsystemen,
      al dan niet voorzien van verlichting, voor vergrotingen tot Nn 2X en bijbehorende toebehoren, en monoculaire
      handtelescopen.
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel34
  - number: 34a.1
    text: |-
      Ter zake van de levering en het vervoer van gas door middel van pijpleidingen vinden de bij de
      [wet behorende tabel I, onderdeel a, post 32, onderscheidenlijk onderdeel b, post 18][ref1], slechts toepassing,
      indien de afnemer van die prestaties een tuinbouwer is en mits per aansluiting een door de tuinbouwer ondertekende
      verklaring aan de leverancier onderscheidenlijk netbeheerder kan worden overgelegd waaruit blijkt, dat deze het gas
      gebruikt voor verwarming ter bevordering van het groeiproces van tuinbouwproducten, en waarin voorts zijn vermeld:


      [ref1]: https://wetten.overheid.nl/BWBR0002629
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel34a
    references:
      - id: ref1
        bwb_id: BWBR0002629
  - number: 34a.1.a
    text: de dagtekening;
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel34a
  - number: 34a.1.b
    text: naam en adres van de afnemer, en
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel34a
  - number: 34a.1.c
    text: naam en adres van de leverancier onderscheidenlijk de netbeheerder.
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel34a
  - number: 34a.2
    text: |-
      De in het eerste lid bedoelde verklaring heeft betrekking op al het per aansluiting door de tuinbouwer afgenomen
      gas; indien slechts een deel van dat gas wordt gebruikt voor het in het eerste lid vermelde doel, moet dit in de
      verklaring worden vermeld en wordt dat deel uitgedrukt in een percentage van het geheel.
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel34a
  - number: 34a.3
    text: |-
      Indien een gegeven als bedoeld in het eerste lid, onderdeel b of c, of het tweede lid, wijzigt, geeft de tuinbouwer
      binnen zes weken een nieuwe verklaring af aan de leverancier onderscheidenlijk de netbeheerder.
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel34a
  - number: 34a.4
    text: |-
      De tuinbouwer trekt de verklaring binnen zes weken schriftelijk in, indien het door hem afgenomen gas niet langer
      wordt gebruikt voor het hiervoor vermelde doel. In de te ondertekenen verklaring wordt de datum van wijziging van
      gebruik opgenomen.
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel34a
  - number: 34b.1
    text: |-
      Ter zake van de levering, de invoer en de intracommunautaire verwerving van minerale olie vindt de bij de wet
      behorende tabel I, onderdeel a, post 32, slechts toepassing bij wijze van teruggaaf van belasting aan de tuinbouwer
      die de olie gebruikt voor verwarming ter bevordering van het groeiproces van tuinbouwprodukten.
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel34b
  - number: 34b.2
    text: |-
      De teruggaaf geschiedt op verzoek van de tuinbouwer en bedraagt 15 percent van de aan hem wegens levering van de
      minerale olie in rekening gebrachte vergoeding.
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel34b
  - number: 34b.3
    text: |-
      In afwijking in zoverre van [artikel 31 van de wet][ref1] geschiedt het verzoek om teruggaaf steeds binnen drie
      maanden na afloop van het kalenderkwartaal waarin de olie is ontvangen, en wel bij een afzonderlijke, ondertekende
      aangifte welke de volgende gegevens moet bevatten:


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel31
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel34b
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '31'
  - number: 34b.3.a
    text: de dagtekening;
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel34b
  - number: 34b.3.b
    text: het kwartaal waarover teruggaaf wordt verzocht;
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel34b
  - number: 34b.3.c
    text: naam en adres van de tuinbouwer;
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel34b
  - number: 34b.3.d
    text: |-
      de hoeveelheid en de soort minerale olie waarvoor teruggaaf wordt verzocht, en de vergoeding welke daarvoor in
      rekening is gebracht;
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel34b
  - number: 34b.3.e
    text: de datum van levering van de minerale olie;
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel34b
  - number: 34b.3.f
    text: het bedrag aan belasting dat wordt teruggevraagd;
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel34b
  - number: 34b.3.g
    text: |-
      de verklaring dat de tuinbouwer de olie ter zake waarvan teruggaaf wordt gevraagd gebruikt voor verwarming ter
      bevordering van het groeiproces van tuinbouwprodukten.
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel34b
  - number: 34b.4
    text: |-
      Bij de aangifte moeten de inkoopfacturen worden overgelegd van de in de aangifte vermelde hoeveelheid minerale olie
      waarvoor teruggaaf wordt verzocht.
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel34b
  - number: 34b.5
    text: |-
      Geen teruggaaf wordt verleend indien de belasting op de voet van [artikel 15 van de wet][ref1] in aftrek wordt
      gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel15
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel34b
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '15'
  - number: 34c
    text: |-
      Ter zake van de levering van gas anders dan door middel van pijpleidingen, en ter zake van de invoer en de
      intracommunautaire verwerving van gas is artikel 34b van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel34c
  - number: '35'
    text: |-
      Als hulpmiddel dat speciaal is ontworpen dan wel bestemd voor het exclusieve en persoonlijke gebruik door doven en
      slechthorenden als bedoeld in de bij de [wet behorende tabel I, onderdeel a, post 35][ref1], worden aangewezen:


      [ref1]: https://wetten.overheid.nl/BWBR0002629
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0002629
  - number: 35.a
    text: |-
      wek- en waarschuwingsapparatuur die er specifiek op is gericht om ten behoeve van auditief gehandicapten
      geluidssignalen om te zetten in zichtbare of voelbare signalen;
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel35
  - number: 35.b
    text: |-
      teksttelefoons die er specifiek op zijn gericht om ten behoeve van auditief gehandicapten spraak om te zetten
      tekst.
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel35
  - number: 36a.1
    text: |-
      Als schriftelijke verklaring als bedoeld in
      [artikel 12, tweede lid, onderdeel b.1° en b.2°, van het besluit][ref1], wordt aangewezen: een factuur,
      een kopiefactuur, of een daarmee gelijk te stellen bescheid dat is voorzien van de in die bepaling bedoelde
      verklaring van de afnemer van de goederen, die vergezeld gaat van een verklaring van de vergunninghouder van de
      accijnsgoederenplaats dat deze de goederen voor de ondernemer in zijn accijnsgoederenplaats in opslag neemt.


      [ref1]: https://wetten.overheid.nl/BWBR0002633#Artikel12
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel36a
    references:
      - id: ref1
        bwb_id: BWBR0002633
        artikel: '12'
  - number: 36a.2
    text: |-
      Als schriftelijke verklaring als bedoeld in [artikel 12, tweede lid, onderdeel c, van het besluit][ref1], wordt
      aangewezen: een factuur, een kopiefactuur, of een daarmee gelijk te stellen bescheid dat is voorzien van de in die
      bepaling bedoelde verklaring van de afnemer van de goederen.


      [ref1]: https://wetten.overheid.nl/BWBR0002633#Artikel12
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel36a
    references:
      - id: ref1
        bwb_id: BWBR0002633
        artikel: '12'
  - number: 36a.3
    text: |-
      In de factuur die de ondernemer afgeeft ter zake van leveringen als bedoeld in het eerste en tweede lid vermeldt
      hij ,,levering met toepassing van tabel II, post a.7’’, onderscheidenlijk ,,levering met toepassing van tabel II,
      post a.8’’. Wanneer een levering is geschied met toepassing van de bij de wet behorende tabel II, onderdeel a, post
      7, onder b, moet op de afgegeven factuur tevens het accijnsnummer van de afzender van het geleidedocument, alsmede
      het volgnummer van het geleidedocument worden vermeld.
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel36a
  - number: 36b
    text: |-
      Tot de goederen of soorten van goederen bedoeld in de bij de wet behorende tabel II, onderdeel a, post 8,
      onder a, onderscheidenlijk onder b behoren de goederen opgenomen in de bij deze regeling behorende bijlage I
      onderscheidenlijk bijlage K, voor zover deze produkten niet geschikt zijn zonder nadere be- of verwerking in de
      particuliere verbruikssfeer te worden gebracht.
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel36b
  - number: 36c.1
    text: |-
      Ondernemers wier bedrijfsuitoefening gericht is op het leveren van goederen als bedoeld in de bij deze regeling
      behorende bijlage I, kunnen met betrekking tot die goederen, voor zover in Nederland aanwezig, in aanmerking
      komen voor een vergunning voor een niet-plaatsgebonden entrepot als bedoeld in de bij de wet behorende tabel II,
      onderdeel a, post 8, onder a.
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel36c
  - number: 36c.2
    text: |-
      Degene die een vergunning voor een niet-plaatsgebonden entrepot wil verkrijgen, dient daartoe een verzoek in bij
      de inspecteur.
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel36c
  - number: 36c.3
    text: 'In het verzoek dient te worden vermeld:'
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel36c
  - number: 36c.3.a
    text: de naam, het adres, het btw-identificatienummer en de aard van het bedrijf van de ondernemer die het verzoek doet;
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel36c
  - number: 36c.3.b
    text: de goederen waarop het verzoek betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel36c
  - number: 36c.4
    text: |-
      In de vergunning neemt de inspecteur nadere regels op met betrekking tot de door de ondernemer te voeren
      administratie ten behoeve van de controle op de juiste toepassing van de bij de wet behorende tabel II, onderdeel
      a, post 8, onder a. In de vergunning vermeldt de inspecteur voorts de datum met ingang waarvan de vergunning geldt.
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel36c
  - number: 36c.5
    text: 'De vergunning kan worden gewijzigd of ingetrokken:'
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel36c
  - number: 36c.5.a
    text: op verzoek van de vergunninghouder;
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel36c
  - number: 36c.5.b
    text: in geval de voorwaarden voor de vergunning niet worden nageleefd.
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel36c
  - number: 36c.6
    text: |-
      Het verlenen, het wijzigen en het intrekken van een vergunning alsmede het afwijzen van een verzoek om een
      vergunning te verlenen geschieden bij voor bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel36c
  - number: 36ca.1
    text: |-
      Een accijnsgoederenplaats voor minerale oliën als bedoeld in de [Wet op de accijns][ref1] kan worden aangewezen
      voor toepassing van de bijzondere bepaling van de bij de wet behorende tabel II, onderdeel a, post 7.


      [ref1]: https://wetten.overheid.nl/BWBR0005251
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel36ca
    references:
      - id: ref1
        bwb_id: BWBR0005251
  - number: 36ca.2
    text: |-
      Voor het verkrijgen van de in het eerste lid bedoelde aanwijzing dient de vergunninghouder van de
      accijnsgoederenplaats een verzoek in bij de inspecteur. In het verzoek dient hij zijn naam, adres en btw-
      identificatienummer te vermelden. Voorts dient hij de inspecteur een afschrift te verstrekken van zijn vergunning
      voor die accijnsgoederenplaats.
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel36ca
  - number: 36ca.3
    text: |-
      In de aanwijzing neemt de inspecteur nadere voorwaarden op met betrekking tot de door de vergunninghouder te
      voeren administratie ten behoeve van de controle op de juiste toepassing van de bijzondere bepaling van de bij
      de wet behorende tabel II, onderdeel a, post 7. Deze voorwaarden bepalen in ieder geval dat de administratie
      zodanig wordt gevoerd dat bij de uitslag van minerale oliën uit de accijnsgoederenplaats in de zin van de
      [Wet op de accijns][ref1] de identiteit wordt vastgelegd van de ondernemer van wie de belasting wordt geheven
      ter zake van de aan hem verrichte, aan de uitslag voorafgaande levering alsmede dat de hoeveelheid en de soort
      van de desbetreffende minerale oliën wordt omschreven. Daarbij moet, wanneer bedoelde ondernemer een buitenlandse
      ondernemer is, de naam en het btw-identificatienummer worden vastgelegd van de fiscaal vertegenwoordiger die voor
      die ondernemer optreedt met betrekking tot die levering. In de aanwijzing vermeldt de inspecteur voorts de datum
      met ingang waarvan de aanwijzing geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0005251
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel36ca
    references:
      - id: ref1
        bwb_id: BWBR0005251
  - number: 36ca.4
    text: 'De aanwijzing kan worden gewijzigd of ingetrokken:'
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel36ca
  - number: 36ca.4.a
    text: op verzoek van de vergunninghouder;
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel36ca
  - number: 36ca.4.b
    text: in geval de voorwaarden voor de aanwijzing niet worden nageleefd.
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel36ca
  - number: 36ca.5
    text: |-
      Het verlenen, het wijzigen en het intrekken van een aanwijzing alsmede het afwijzen van een verzoek om een
      aanwijzing te verlenen, geschieden bij voor bezwaar vatbare beschikking. Een aanwijzing kan niet worden verleend
      aan degene die een vergunning voor een accijnsgoederenplaats voor minerale oliën heeft verkregen als bedoeld in
      [artikel 42a van de Wet op de accijns][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel42a
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel36ca
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: 42a
  - number: 36cb.1
    text: |-
      Ondernemers wier bedrijfsuitoefening erop gericht is om ten behoeve van een andere ondernemer te beschikken over
      een opslagplaats voor goederen als bedoeld in de bij deze regeling behorende bijlage K, kunnen met betrekking tot
      die opslagplaats voor die goederen in aanmerking komen voor een vergunning voor een plaatsgebonden entrepot als
      bedoeld in de bij de wet behorende tabel II, onderdeel a, post 8, onder b.
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel36cb
  - number: 36cb.2
    text: |-
      Degene die een vergunning voor een plaatsgebonden entrepot wil verkrijgen, dient daartoe een verzoek in bij de
      inspecteur.
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel36cb
  - number: 36cb.3
    text: 'In het verzoek dient te worden vermeld:'
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel36cb
  - number: 36cb.3.a
    text: de naam, het adres, het btw-identificatienummer en de aard van het bedrijf van de ondernemer die het verzoek doet;
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel36cb
  - number: 36cb.3.b
    text: de goederen waarop het verzoek betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel36cb
  - number: 36cb.3.c
    text: (vervallen);
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel36cb
  - number: 36cb.3.d
    text: de locatie en de inrichting van de als plaatsgebonden entrepot aan te merken plaats of plaatsen.
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel36cb
  - number: 36cb.4
    text: |-
      In de vergunning neemt de inspecteur ten behoeve van de controle op de juiste toepassing van de bij de
      wet behorende tabel II, onderdeel a, post 8, onder b, nadere voorwaarden op met betrekking tot de tot het
      plaatsgebonden entrepot te rekenen plaatsen en de door de ondernemer te voeren administratie. Deze voorwaarden
      bepalen in ieder geval dat de administratie zodanig wordt gevoerd dat bij de beëindiging van de opslag van
      de goederen in het entrepot de identiteit wordt vastgelegd van de ondernemer van wie de belasting wordt
      geheven ter zake van de aan hem verrichte, aan de beëindiging van de opslag voorafgaande levering alsmede dat
      de hoeveelheid en de soort van de desbetreffende goederen wordt omschreven. Daarbij moet, wanneer bedoelde
      ondernemer een buitenlandse ondernemer is, de naam en het btw-identificatienummer worden vastgelegd van de fiscaal
      vertegenwoordiger die voor die ondernemer optreedt met betrekking tot die levering. In de vergunning vermeldt de
      inspecteur voorts de datum met ingang waarvan deze geldt.
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel36cb
  - number: 36cb.5
    text: 'De vergunning kan worden gewijzigd of ingetrokken:'
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel36cb
  - number: 36cb.5.a
    text: op verzoek van de vergunninghouder;
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel36cb
  - number: 36cb.5.b
    text: in geval de voorwaarden voor de vergunning niet worden nageleefd.
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel36cb
  - number: 36cb.6
    text: |-
      Het verlenen, het wijzigen en het intrekken van een vergunning alsmede het afwijzen van een verzoek om een
      vergunning te verlenen, geschieden bij voor bezwaar vatbare beschikking. Een verzoek om een vergunning kan worden
      geweigerd aan de ondernemer die in de vijf aan het verzoek voorafgaande jaren onherroepelijk is veroordeeld wegens
      het niet nakomen van een wettelijke bepaling inzake de omzetbelasting.
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel36cb
  - number: 36cb.7
    text: 'Onder beëindiging van de opslag van goederen in een plaatsgebonden entrepot wordt verstaan:'
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel36cb
  - number: 36cb.7.a
    text: |-
      het brengen van goederen buiten een plaatsgebonden entrepot dat voor dat soort goederen als zodanig is aangewezen
      door of in opdracht van de ondernemer die de macht heeft als eigenaar over die goederen te beschikken;
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel36cb
  - number: 36cb.7.b
    text: |-
      het verrichten van een zodanige be- of verwerking met betrekking tot in een plaatsgebonden entrepot opgeslagen
      goederen door of in opdracht van de ondernemer die de macht heeft als eigenaar over die goederen te beschikken, dat
      die goederen daarna geen goederen meer zijn die zijn genoemd in de bij deze regeling behorende bijlage K, dan wel
      dat die goederen weliswaar goederen zijn die zijn genoemd in die bijlage, maar geschikt zijn om zonder nadere be-
      of verwerking in de particuliere verbruikssfeer te worden gebracht.
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel36cb
  - number: 36d.1
    text: |-
      [Artikel 1, aanhef en onderdeel b, van de wet][ref1] is niet van toepassing wanneer het verworven goed een gebruikt
      vervoermiddel is in de zin van artikel 327, lid 3, van de BTW-richtlijn 2006 waarvan de levering aan de in artikel
      4, onder b, van die richtlijn vermelde voorwaarden voldoet.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel1
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel36d
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '1'
  - number: 36d.2
    text: |-
      [Artikel 5a van de wet][ref1] is niet van toepassing op de in het eerste lid bedoelde leveringen.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel5a
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel36d
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 5a
  - number: 36d.3
    text: |-
      De in het eerste lid bedoelde leveringen worden voor de toepassing van artikel 28b, tweede lid, van de wet
      gelijkgesteld met de in dat tweede lid bedoelde leveringen aan de wederverkoper.
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel36d
  - number: '37.1'
    text: Deze regeling treedt in werking met ingang van 1 januari 1969.
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel37
  - number: '37.2'
    text: Deze regeling kan worden aangehaald als Uitvoeringsbeschikking omzetbelasting 1968.
    url: https://wetten.overheid.nl/BWBR0002634/2017-01-01#Artikel37
