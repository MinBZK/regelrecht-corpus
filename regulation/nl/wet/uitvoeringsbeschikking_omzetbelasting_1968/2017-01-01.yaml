    text: |-
      Deze regeling geeft uitvoering aan de [artikelen 1a, derde lid][ref1],
      [2a, eerste lid, onderdelen l en m, en tweede lid][ref2],
      [5a, vierde en vijfde lid][ref3], [7, derde en vierde lid][ref4], [8, zevende lid][ref5],
      [11, eerste lid, onderdelen a, onder 2°, b, onder 5°, p en v, en zesde lid][ref6],
      [15, eerste lid, onderdeel c, onder 1°, derde en zesde lid][ref7], [17e][ref8],
      [21][ref9],[ 23, eerste lid][ref10],[ 24, tweede lid][ref11], [25, tweede, derde en zesde lid][ref12],
      [26][ref13], [27, negende lid][ref14], [28d][ref15], [28i][ref16], [28p][ref17], [28zb, vierde lid][ref18],
      [29, tiende lid][ref19], [31, zevende lid][ref20], [32f, tweede lid][ref21], [32h][ref22],
      [32i][ref23], [34, eerste, tweede, derde en vierde lid][ref24], [34c, tweede lid][ref25],
      [34e][ref26], [35a, zesde lid][ref27], en [37d, van de Wet op de omzetbelasting 1968][ref28],
      [onderdeel a, posten 31, 32 en 35, van de bij die wet behorende tabel I][ref29],
      [onderdeel a, posten 7 en 8, van de bij die wet behorende tabel II][ref30],__REF030________________________________
      ___________________________________________________________________________________________________________________
      _____________________________________________________________________________________________,
      [artikel 62 van de Algemene wet inzake rijksbelastingen][ref32], alsmede de
      [artikelen 4, eerste lid, onderdeel c][ref33], [12, vijfde lid][ref34], [13][ref35], [24b, achtste lid][ref36],
      [24ba, tweede lid][ref37], en [24c, derde lid, onderdeel c, van het Uitvoeringsbesluit omzetbelasting 1968][ref38].


