        artikel: '15'
  - number: '13'
    text: |-
      1 In afwijking van artikel 11 worden voor de toepassing van de aftrek afzonderlijk in aanmerking genomen:

      a. onroerende zaken en rechten waaraan deze zijn onderworpen;

      b. roerende zaken waarop de ondernemer voor de inkomstenbelasting of de vennootschapsbelasting afschrijft, of
      waarop hij zou kunnen afschrijven indien hij aan een zodanige belasting zou zijn onderworpen;

      c. investeringsdiensten waarvan de vergoeding ten minste € 30.000 bedraagt.

      2 Met betrekking tot onroerende zaken en rechten waaraan deze zijn onderworpen wordt de aftrek herzien in elk
      van de negen boekjaren, volgende op dat waarin de ondernemer het goed is gaan gebruiken. De herziening geschiedt
      telkens voor een tiende gedeelte van de voorbelasting op basis van de voor het boekjaar geldende gegevens bij de
      aangifte over het laatste belastingtijdvak van dat boekjaar.

      3 Met betrekking tot de roerende zaken, bedoeld in het eerste lid, onderdeel b, en de investeringsdiensten, bedoeld
      in het eerste lid, onderdeel c, wordt de aftrek herzien in elk van de vier boekjaren, volgende op dat waarin de
      ondernemer het goed of de investeringsdienst is gaan gebruiken. De herziening geschiedt telkens voor een vijfde
      gedeelte van de voorbelasting op basis van de voor het boekjaar geldende gegevens bij de aangifte over het laatste
      belastingtijdvak van dat boekjaar.

      4 De herziening blijft achterwege in het boekjaar waarin de belasting welke op basis van de voor
      dat boekjaar geldende gegevens voor aftrek in aanmerking komt, niet meer dan tien percent verschilt
      van de in aftrek gebrachte belasting, met dien verstande dat wanneer de herziening het gevolg is van
      aanvang of beëindiging van de vrijstelling, bedoeld in [artikel 25a, eerste of tweede lid][ref1], of
      [artikel 25c, eerste lid, van de wet][ref2], deze in ieder geval achterwege blijft wanneer het bedrag van de
      herziening in dat boekjaar minder is dan € 500.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel25a
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel25c
