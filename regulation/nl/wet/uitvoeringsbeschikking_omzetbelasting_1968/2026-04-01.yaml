  - number: 33a
    text: |-
      1 De aanvrager van het teruggaafverzoek als bedoeld in [artikel 32f van de wet][ref1] neemt in het verzoek alle
      informatie op die is voorgeschreven in de artikelen 8 en 9, lid 1, van Richtlijn 2008/9/EG.

      2 De aanvrager van het verzoek bedoeld in het eerste lid omschrijft in het verzoek mede zijn beroepsactiviteit op
      de wijze als genoemd in [artikel 32h van de wet][ref2].

      3 De aanvrager overlegt tezamen met het teruggaafverzoek langs elektronische weg een afschrift van de factuur of
      het invoerdocument, indien de maatstaf van heffing op de factuur of het invoerdocument € 1.000 of meer beloopt.
      Indien de factuur betrekking heeft op brandstof, is dit drempelbedrag € 250.

      4 De aanvrager kan zowel voor het verstrekken van de gegevens in het in het eerste lid bedoelde verzoek als
      voor alle mogelijke andere op dit teruggaafverzoek betrekking hebbende te verstrekken aanvullende of verder
      aanvullende gegevens, gebruik maken van de Nederlandse, Engelse of Duitse taal. Het afschrift van de factuur of
      het invoerdocument, genoemd in het derde lid, wordt verstrekt in een van de talen, genoemd in artikel 1 van de
      Verordening No. 1 tot regeling van het taalgebruik in de Europese Economische Gemeenschap.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel32f
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel32h
