  - number: '3'
    text: |-
      Publiekrechtelijke lichamen worden als ondernemer aangemerkt met betrekking tot het geven van gelegenheid tot
      parkeren waarbij een fysieke barrière of een registratie bij de in- of uitrit ter verzekering van de betaling van
      het parkeergeld dient.
    url: https://wetten.overheid.nl/BWBR0002634/2026-04-01#Artikel3
  - number: 3a
    text: |-
      1 Bij vorming van een fiscale eenheid als bedoeld in [artikel 7, vierde lid, van de wet][ref1], wordt de fiscale
      eenheid voor het berekenen van de door haar verschuldigde belasting geacht in de plaats te zijn getreden van de
      natuurlijke personen en lichamen in de zin van de [Algemene wet inzake rijksbelastingen][ref2], die de fiscale
      eenheid vormen.

      2 Bij beëindiging van een fiscale eenheid als bedoeld in [artikel 7, vierde lid, van de wet][ref3], worden de
      natuurlijke personen en lichamen in de zin van de [Algemene wet inzake rijksbelastingen][ref4], die de fiscale
      eenheid vormden, voor het berekenen van de door hen verschuldigde belasting geacht in de plaats te zijn getreden
      van de fiscale eenheid, voor het deel dat tot hun bedrijfsvermogen behoort.

      3 Bij wijziging van een fiscale eenheid als bedoeld in [artikel 7, vierde lid, van de wet][ref5]:

      a. is bij toetreding van een natuurlijk persoon of lichaam in de zin van de
      [Algemene wet inzake rijksbelastingen][ref6] tot de fiscale eenheid, het eerste lid van overeenkomstige toepassing;
      en

      b. is bij uittreding van een natuurlijk persoon of lichaam in de zin van de
      [Algemene wet inzake rijksbelastingen][ref7] uit de fiscale eenheid, het tweede lid van overeenkomstige toepassing.

      4 De voorgaande leden gelden niet voor de toepassing van [artikel 4c, derde en vierde lid][ref8].


