  - number: 29e
    text: |-
      1 Indien de leverancier of dienstverrichter, bedoeld in [artikel 6k, vierde lid, van de wet][ref1], de inspecteur
      meldt dat hij [artikel 5a, eerste lid, onderdeel a][ref2], respectievelijk [artikel 6h, van de wet][ref3] wil
      toepassen, vinden laatstgenoemde bepalingen toepassing vanaf de eerste dag van het daaropvolgende belastingtijdvak.

      2 Wanneer de eerste handeling waarop de leverancier of dienstverrichter
      [artikel 5a, eerste lid, onderdeel a][ref4], respectievelijk [artikel 6h, van de wet][ref5], wil toepassen,
      plaatsvindt vóór de datum, bedoeld in het eerste lid, dan is artikel 5a, eerste lid, onderdeel a, respectievelijk
      artikel 6h, van de wet vanaf die handeling van toepassing, mits de leverancier of dienstverrichter de inspecteur
      uiterlijk op de tiende dag van de maand volgende op die eerste handeling hiervan op de hoogte brengt.


