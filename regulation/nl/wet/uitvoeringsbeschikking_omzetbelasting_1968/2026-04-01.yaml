  - number: '34'
    text: |-
      Als hulpmiddelen die speciaal zijn ontworpen dan wel bestemd voor het exclusieve en persoonlijke gebruik door
      blinden en slechtzienden als bedoeld in de bij de wet behorende tabel I, onderdeel a, post 31, worden aangewezen:

      a. sprekende koortsthermometers, bloedsuikermeters en bloeddrukmeters die worden aangewend voor zelfdiagnose;

      b. programmatuur, alsmede de hiermee samenhangende apparatuur, die door middel van zogeheten spraakoutput er
      specifiek op is gericht visueel gehandicapten in staat te stellen om met computers te werken;

      c. programmatuur die grafische besturingssystemen omzet in voor zogeheten spraakoutput en brailleschrift
      begrijpelijke informatie;

      d. programmatuur die erop is gericht om conventionele geschriften met behulp van een scanner om te zetten in een
      door een computer te gebruiken tekst waardoor deze geschriften toegankelijk worden voor visueel gehandicapten;

      e. programmatuur die erop is gericht de weergave op het beeldscherm van een computer te vergroten en/of te laten
      contrasteren;

      f. de volgende bijzondere gezichtshulpmiddelen voor slechtzienden, mits die gewoonlijk door een arts of
      een optometrist worden voorgeschreven en individueel worden aangemeten: op of in een bril gemonteerde
      kijkerloepsystemen; telescoop- en prismaloepbrillen, de daarbij behorende opsteeklenzen daaronder begrepen;
      in een brilmontuur of brilglazen aan te brengen vergroot- en loepglazen; filterlenzen en -toepassingen en
      filterglazen bestemd voor een selectieve absorptie van meer dan 400 nm. van het licht met korte golflengte; alsmede
      tafelloepsystemen, al dan niet voorzien van verlichting, voor vergrotingen tot 2x en bijbehorende toebehoren, en
      monoculaire handtelescopen.
    url: https://wetten.overheid.nl/BWBR0002634/2026-04-01#Artikel34
  - number: '35'
    text: |-
      Als hulpmiddel dat speciaal is ontworpen dan wel bestemd voor het exclusieve en persoonlijke gebruik door doven en
      slechthorenden als bedoeld in de bij de [wet behorende tabel I, onderdeel a, post 35][ref1], worden aangewezen:

      a. wek- en waarschuwingsapparatuur die er specifiek op is gericht om ten behoeve van auditief gehandicapten
      geluidssignalen om te zetten in zichtbare of voelbare signalen;

      b. teksttelefoons die er specifiek op zijn gericht om ten behoeve van auditief gehandicapten spraak om te zetten
      tekst.


      [ref1]: https://wetten.overheid.nl/BWBR0002629
