    text: |-
      Bij toepassing van de artikelen 17, 17a, 18 en 18a is degene die goederen ten invoer aangeeft verplicht op eerste
      vordering een kopie-factuur in te leveren. Indien in een van de gevallen bedoeld in de eerste volzin van dit
      lid geen factuur wordt opgemaakt, wordt in plaats van een kopie-factuur een daarmee gelijk te stellen bescheid
      ingeleverd.
