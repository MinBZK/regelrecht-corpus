  - number: 30a
    text: |-
      Een ondernemer die buiten de Unie woont of is gevestigd en geen vaste inrichting in Nederland heeft, dient indien
      de inspecteur zulks vraagt, bij een verzoek om teruggaaf als bedoeld in [artikel 31, tweede lid, van de wet][ref1]
      aan te tonen dat hij ondernemer is in de zin van [artikel 7 van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel7
