        artikel: '11'
      - id: ref2
        bwb_id: BWBR0002633
  - number: '7'
    text: |-
      De vrijstelling van belasting voor voordrachten en dergelijke diensten, als zijn bedoeld in
      [artikel 11, eerste lid, onderdeel p, van de wet][ref1], geldt in gevallen waarin zij worden gehouden of verricht
      vanwege publiekrechtelijke lichamen, stichtingen en verenigingen en strekken tot bevordering van wetenschap of
      algemene ontwikkeling.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel11
    url: https://wetten.overheid.nl/BWBR0002634/2026-04-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '11'
  - number: 7a
    text: |-
      Tot leveringen en diensten die voortvloeien uit activiteiten ter verkrijging van financiële steun als bedoeld in
      [artikel 11, eerste lid, onderdeel v, van de wet][ref1], behoren niet verstrekkingen van spijzen en dranken die
      samenhangen met evenementen gelegen in de persoonlijke sfeer.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel11
