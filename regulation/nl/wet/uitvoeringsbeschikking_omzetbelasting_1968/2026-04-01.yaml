  - number: 4a
    text: |-
      1 De wederverkoper is verplicht aan zijn leverancier als bedoeld in [artikel 28b, tweede lid, van de wet][ref1],
      een door laatstbedoelde te ondertekenen inkoopverklaring uit te reiken waarin op duidelijke en overzichtelijke
      wijze zijn vermeld:

      a. de dag waarop de levering wordt verricht;

      b. naam en adres van de wederverkoper;

      c. naam en adres van de leverancier;

      d. een duidelijke omschrijving van het geleverde goed en, voor zover het een motorrijtuig betreft, tevens het
      kenteken;

      e. de hoeveelheid van de geleverde goederen;

      f. het bedrag dat aan de leverancier ter zake van de levering is of moet worden voldaan;

      g. een verklaring van de leverancier dat hij ter zake van de levering aan hem van het goed in het geheel geen
      belasting in aftrek heeft gebracht.

      2 De wederverkoper is verplicht een dubbel van de uitgereikte inkoopverklaring te bewaren.

      3 Het eerste lid is niet van toepassing:

      a. ingeval het bedrag dat aan de leverancier moet worden voldaan minder dan € 500 bedraagt;

      b. ingeval de leverancier ingevolge [artikel 34c van de wet][ref2] een factuur uitreikt;

      c. ingeval de inkoop van een goed door de wederverkoper gelijktijdig plaatsvindt met de levering door hem van
      een ander goed aan de leverancier en de wederverkoper een factuur uitreikt die voldoet aan de in de wet gestelde
      voorwaarden, mits de factuur tevens voldoet aan het bepaalde in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel28b
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel34c
    url: https://wetten.overheid.nl/BWBR0002634/2026-04-01#Artikel4a
