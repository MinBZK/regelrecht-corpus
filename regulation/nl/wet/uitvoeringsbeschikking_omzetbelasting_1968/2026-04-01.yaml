  - number: 6a
    text: |-
      1 De keuze blijkens de schriftelijke huurovereenkomst of het verzoek om te worden uitgezonderd van de vrijstelling
      van belasting voor verhuur van onroerende zaken kan voor elke onroerende zaak afzonderlijk worden gedaan.

      2 In de schriftelijke huurovereenkomst of het verzoek wordt vermeld een omschrijving van de onroerende zaak
      met plaatselijke en kadastrale aanduiding alsmede de datum van aanvang van het boekjaar van de huurder. In de
      schriftelijke huurovereenkomst of het verzoek wordt een door de huurder ondertekende verklaring gevoegd waaruit
      blijkt dat hij de onroerende zaak gebruikt voor doeleinden waarvoor een volledig of nagenoeg volledig recht op
      aftrek van belasting op de voet van [artikel 15 van de wet][ref1] bestaat.

      3 De inspecteur beslist op het verzoek bij voor bezwaar vatbare beschikking, waarin de datum met ingang waarvan de
      vrijstelling buiten toepassing blijft, wordt vermeld.

      4 Voor elk boekjaar geldt dat aan de in [artikel 11, eerste lid, onderdeel b, onder 5°, van de wet][ref2]
      bedoelde voorwaarde dat de huurder de onroerende zaak gebruikt voor doeleinden waarvoor een volledig of nagenoeg
      volledig recht op aftrek van belasting op de voet van [artikel 15 van de wet][ref3] bestaat, is voldaan, wanneer
      de onroerende zaak over het desbetreffende boekjaar voor de hiervoor vermelde doeleinden is gebruikt. De voorwaarde
      wordt voor de eerste keer beoordeeld over het boekjaar waarin de huurder de onroerende zaak, met toepassing van het
      keuzerecht voor belasting, is gaan huren.

      5 Ingeval de onroerende zaak niet vóór het einde van het boekjaar waarin de huurder de onroerende zaak, met
      toepassing van het keuzerecht voor belasting, is gaan huren, door de huurder in gebruik is genomen, is niet voldaan
      aan de in het vierde lid bedoelde voorwaarde.

      6 Ingeval niet meer wordt voldaan aan de in het vierde lid bedoelde voorwaarde stelt de huurder de verhuurder
      binnen vier weken na afloop van het desbetreffende boekjaar daarvan in kennis door middel van een door hem
      ondertekende verklaring. Tevens zendt de huurder binnen dezelfde termijn een afschrift hiervan aan de inspecteur.

      7 Ingeval in een boekjaar dat is aangevangen na het boekjaar waarin de huurder de onroerende zaak is gaan huren,
      de vrijstelling buiten toepassing is gebleven en na afloop van dat boekjaar blijkt dat de huurder niet meer voldoet
      aan de in het vierde lid bedoelde voorwaarde, kan de vrijstelling in dat boekjaar buiten toepassing blijven, tenzij
      de huurder redelijkerwijs kon voorzien dat hij niet langer zou voldoen aan deze voorwaarde. Blijkt in het daarop
      volgende boekjaar evenmin te worden voldaan aan voormelde voorwaarde, dan vindt de vrijstelling toepassing met
      ingang van laatstgemeld boekjaar, ook als de huurder redelijkerwijs niet kon voorzien dat hij in het desbetreffende
      boekjaar niet zou voldoen aan die voorwaarde.

      8 Voor de toepassing van dit artikel geldt als boekjaar het boekjaar van de huurder.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0002629#Artikel15
