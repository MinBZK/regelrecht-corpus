  - number: '26'
    text: |-
      1 Als ondernemers als bedoeld in [artikel 26 van de wet][ref1], worden aangewezen:

      a. 1°. winkeliers;

      2°. marktkooplieden;

      3°. schoenherstellers;

      4°. kappers;

      5°. glazenwassers;

      6°. exploitanten van wasserijen;

      7°. rijwielherstellers;

      8°. exploitanten van schoonheidsverzorgingsbedrijven;

      9°. behangers;

      10°. stoffeerders;

      11°. exploitanten van horecabedrijven;

      12°. advocaten die hun praktijk alleen uitoefenen;

      13°. houders van autorijscholen;

      b. andere dan de in onderdeel a genoemde ondernemers, indien zij hun prestaties als ondernemer uitsluitend of
      nagenoeg uitsluitend verrichten in of vanuit een inrichting welke bestemd is voor de verkoop van goederen of het
      verlenen van diensten aan anderen dan ondernemers;

      c. niet onder de onderdelen a of b vallende ondernemers die niet aan ondernemers goederen plegen
      te leveren en diensten plegen te verlenen, behoudens voorzover zij goederen leveren als bedoeld in
      [artikel 3, tweede lid, van de wet][ref2], mits zij op daartoe gedaan verzoek door de inspecteur zijn aangewezen.
      De inspecteur beslist op het verzoek bij voor bezwaar vatbare beschikking.

      2 Indien de in het eerste lid in de onderdelen a en b bedoelde ondernemers van de aanwijzing geen gebruik maken,
      dienen zij dit uit hun administratie te laten blijken.


      [ref1]: https://wetten.overheid.nl/BWBR0002629
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel3
