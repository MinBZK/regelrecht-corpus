  - number: 6b
    text: |-
      Tot de leveringen en diensten, bedoeld in [artikel 11, eerste lid, onderdeel f, van de wet][ref1], behoren niet,
      behoudens voor zover in [bijlage B bij het besluit][ref2] anders is bepaald:

      a. het verstrekken van spijzen en dranken;

      b. het verrichten van onderzoek;

      c. het ter beschikking stellen van personeel;

      d. het verzorgen van loon- en salarisadministraties, financiële administraties en grootboekadministraties.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0002633
    url: https://wetten.overheid.nl/BWBR0002634/2026-04-01#Artikel6b
