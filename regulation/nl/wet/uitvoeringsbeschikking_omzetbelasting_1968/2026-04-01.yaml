  - number: 18a
    text: |-
      1 Voor personenauto’s en bestelauto’s in de zin van
      [artikel 3 van de Wet op de belasting van personenauto’s en motorrijwielen 1992][ref1] wordt een verzoek om
      aanwijzing voor de toepassing van [artikel 23 van de wet][ref2] ingediend bij de inspecteur. De inspecteur beslist
      op het verzoek bij voor bezwaar vatbare beschikking. Bij inwilliging van het verzoek stelt de inspecteur een datum
      van ingang vast en wijst hij aan waar aangifte ten invoer dient te geschieden.

      2 Het verzoek wordt slechts ingewilligd, indien:

      a. de belanghebbende in Nederland woont of is gevestigd, dan wel aldaar een vaste inrichting of een fiscaal
      vertegenwoordiger heeft;

      b. de belanghebbende reeds gedurende een tijdvak van ten minste zes maanden geregeld goederen als bedoeld in
      het eerste lid, heeft ingevoerd en op regelmatige wijze de ter zake van de invoer van die goederen verschuldigde
      omzetbelasting heeft voldaan;

      c. de belanghebbende een bedrijfsadministratie voert welke naar het oordeel van de inspecteur zodanig is ingericht
      dat daarin op overzichtelijke wijze zijn opgenomen de door de inspecteur nodig geoordeelde gegevens omtrent
      de hiervoor bedoelde goederen en dat aan de hand daarvan op eenvoudige wijze de ter zake van de invoer van die
      goederen verschuldigde omzetbelasting kan worden vastgesteld;

      d. de voldoening van de ter zake van de invoer van de hiervoor bedoelde goederen verschuldigde omzetbelasting naar
      het oordeel van de inspecteur is verzekerd.

      3 De belanghebbende moet voldoen aan de volgende voorwaarden:

      a. van de invoer van goederen als zijn bedoeld in het eerste lid, wordt afzonderlijk aantekening gehouden op de
      voet van [artikel 31][ref3];

      b. bij aangifte ten invoer van de hiervoor bedoelde goederen worden bescheiden - een kopie-factuur, vracht- en
      ladingspapieren en dergelijke - overgelegd waaruit blijkt dat de goederen voor belanghebbende zijn bestemd en de
      regeling van [artikel 23 van de wet][ref4] van toepassing is. Op deze bescheiden moeten datum en nummer van de
      in het eerste lid bedoelde beschikking, alsmede in voorkomende gevallen het op de voet van [artikel 18][ref5] aan
      belanghebbende toegekende btw-identificatienummer zijn vermeld.

      4 De inspecteur is bevoegd in bepaalde gevallen nadere voorwaarden te stellen.

      5 Ingeval de belanghebbende handelt in strijd met de gestelde voorwaarden, alsmede in geval van misbruik, waaronder
      wordt begrepen misbruik door de vervoerder van de in het eerste lid bedoelde goederen, kan de inspecteur de
      aanwijzing intrekken en een nieuwe aanwijzing weigeren. De intrekking en de weigering geschieden bij voor bezwaar
      vatbare beschikking.

      6 Het eerste tot en met vijfde lid zijn van overeenkomstige toepassing op motorrijwielen in de zin
      van[ artikel 4 van de Wet op de belasting van personenauto’s en motorrijwielen 1992][ref6].


