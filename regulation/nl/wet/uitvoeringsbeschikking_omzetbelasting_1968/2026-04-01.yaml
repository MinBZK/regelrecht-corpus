  - number: 1b
    text: |-
      In geval moet worden aangetoond dat een vervoermiddel een nieuw vervoermiddel is, dienen zodanig deugdelijke
      gegevens te worden overgelegd dat aan de hand daarvan kan worden vastgesteld dat het vervoermiddel een nieuw
      vervoermiddel is. In ieder geval moeten worden overgelegd:

      a. de gegevens als bedoeld in [artikel 2a, eerste lid, onderdeel f, van de wet][ref1];

      b. de gegevens omtrent het gebruik op het moment van aankoop;

      c. naam en adres van degene van wie het vervoermiddel is verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel2a
    url: https://wetten.overheid.nl/BWBR0002634/2026-04-01#Artikel1b
