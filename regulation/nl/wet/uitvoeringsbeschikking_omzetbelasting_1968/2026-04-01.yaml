  - number: '33'
    text: |-
      1 In afwijking in zoverre van de verplichtingen opgelegd bij [artikel 35a van de wet][ref1] geldt als een op de
      voorgeschreven wijze opgemaakte factuur:

      a. het vervoersbewijs voorzover de ondernemer personen vervoert in de vorm van openbaar vervoer of taxivervoer als
      bedoeld in [artikel 1 van de Wet personenvervoer 2000][ref2];

      b. de gebruikelijke afrekening voorzover de ondernemer spijzen en dranken verstrekt voor gebruik ter plaatse binnen
      het kader van het hotel-, café-, restaurant-, pension- en aanverwant bedrijf aan personen die daar slechts voor een
      korte periode verblijf houden;

      c. de factuur die bij inruiltransacties wordt uitgereikt en die de gehele inruiltransactie dekt, mits die factuur
      alle vermeldingen bevat die anders op de afzonderlijk uit te reiken facturen zouden moeten worden vermeld;

      d. de wekelijks of maandelijks uitgereikte verzamelfactuur met betrekking tot leveringen of diensten waarbij bonnen
      en dergelijke worden uitgereikt die op zich niet voldoen aan de factuurvereisten, mits deze verwijst naar de bonnen
      en dergelijke, en samen daarmee voldoet aan de factuurvereisten;

      e. het gedeelte van de overschrijvingskaart dat de afnemer behoudt of de aan de afnemer gezonden bank- of giro-
      afrekening, bij het gebruik van acceptgirokaarten onderscheidenlijk automatische overschrijving;

      mits daarop de vermeldingen, bedoeld in [artikel 35a, tweede lid, van de wet][ref3] staan.

      2 In afwijking in zoverre van de verplichtingen opgelegd bij [artikel 35a van de wet][ref4]:

      a. kan bij de levering van energie voor landvoertuigen de vermelding van de naam en het adres van de afnemer
      achterwege blijven, mits die afnemer kan worden geïdentificeerd doordat zijn gegevens door de wijze van betalen,
      giraal of anderszins, traceerbaar zijn;

      b. kan bij de levering van goederen door groothandelaren, in plaats van de vermelding van de aard van de geleverde
      goederen, een door de inspecteur goedgekeurde codevermelding worden gebruikt.

      3 Geen afwijkingen zijn toegestaan voor:

      a. leveringen als bedoeld in [artikel 5a, eerste lid, onderdeel a, van de wet][ref5], waarvoor de ondernemer geen
      gebruik maakt van de Unieregeling, bedoeld in [hoofdstuk V, afdeling 7, paragraaf 3, van de wet][ref6];

      b. leveringen met toepassing van de bij de wet behorende [tabel II, onderdeel a, post 6][ref7].


