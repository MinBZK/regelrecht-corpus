  - number: '19'
    text: |-
      De schriftelijke opdracht, bedoeld in [artikel 12, tweede lid, onderdeel d, van het besluit][ref1], tot uitvoer
      uit de Unie of tot plaatsing onder de regeling douane-entrepot op basis van artikel 237, tweede lid, van het
      Douanewetboek van de Unie wordt opgemaakt overeenkomstig het in de bij deze regeling behorende [bijlage B][ref2]
      opgenomen model.


