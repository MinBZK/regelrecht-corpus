  - number: '14'
    text: |-
      Het afstoten van goederen welke de ondernemer in zijn bedrijf heeft gebruikt, wordt niet beschouwd als een
      handeling die voor de berekening van de aftrek bij hem in aanmerking komt.
    url: https://wetten.overheid.nl/BWBR0002634/2026-04-01#Artikel14
  - number: 16a
    text: |-
      1 Voor de toepassing van de vrijstelling, bedoeld in [artikel 17e van de wet][ref1], is de ondernemer gehouden een
      boekhouding te voeren waarin de voor die toepassing nodige gegevens op duidelijke en overzichtelijke wijze zijn
      vermeld.

      2 In geval de ondernemer niet in Nederland woont of is gevestigd en aldaar geen vaste inrichting heeft, dient de
      aanspraak op toepassing van de vrijstelling ten genoegen van de inspecteur te worden aangetoond.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel17e
