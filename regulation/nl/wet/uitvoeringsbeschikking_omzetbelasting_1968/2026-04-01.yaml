  - number: 31a
    text: |-
      De ondernemer aan wie een vergunning voor een fiscaal vertegenwoordiger als bedoeld in
      [artikel 24c van het besluit][ref1] is verleend, is gehouden:

      a. afzonderlijk aantekening te houden van de gegevens als bedoeld in artikel 31 die betrekking hebben op de
      buitenlandse ondernemer;

      b. de aantekeningen als bedoeld in onderdeel a zodanig te houden dat de herkomst en de bestemming van de goederen
      op eenvoudige wijze kunnen worden gevolgd en de verschuldigde belasting op eenvoudige wijze kan worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002633#Artikel24c
