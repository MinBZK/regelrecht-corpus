  - number: '6'
    text: |-
      1 De keuze blijkens de notariële akte of het verzoek om te worden uitgezonderd van de vrijstelling van belasting
      voor de levering van onroerende zaken en van rechten waaraan deze zijn onderworpen kan voor elke onroerende zaak en
      voor elk recht waaraan een onroerende zaak is onderworpen worden gedaan.

      2 In de notariële akte of het verzoek wordt vermeld een omschrijving van de onroerende zaak en het recht waaraan
      deze is onderworpen met plaatselijke en kadastrale aanduiding alsmede de datum van aanvang van het boekjaar. In de
      notariële akte of het verzoek wordt een door de afnemer ondertekende verklaring gevoegd waaruit blijkt dat hij de
      onroerende zaak gebruikt voor doeleinden waarvoor een volledig of nagenoeg volledig recht op aftrek van belasting
      op de voet van [artikel 15 van de wet][ref1] bestaat.

      3 De inspecteur beslist op het verzoek bij voor bezwaar vatbare beschikking.

      4 Aan de in [artikel 11, eerste lid, onderdeel a, onder 2°, van de wet][ref2] bedoelde voorwaarde dat de afnemer
      de onroerende zaak gebruikt voor doeleinden waarvoor een volledig of nagenoeg volledig recht op aftrek van
      belasting op de voet van [artikel 15 van de wet][ref3] bestaat, is voldaan, wanneer de onroerende zaak zowel over
      het boekjaar van levering van de onroerende zaak als over het daarop volgende boekjaar voor de hiervoor vermelde
      doeleinden is gebruikt.

      5 Ingeval de onroerende zaak niet vóór het einde van het boekjaar volgende op het boekjaar van levering van
      de onroerende zaak in gebruik is genomen door de afnemer, is niet voldaan aan de in het vierde lid bedoelde
      voorwaarde.

      6 De afnemer stelt binnen vier weken na afloop van het boekjaar volgende op het boekjaar van levering van de
      onroerende zaak, de leverancier door middel van een door hem ondertekende verklaring ervan in kennis, of is voldaan
      aan de in het vierde lid bedoelde voorwaarde. De afnemer zendt binnen dezelfde termijn een afschrift van deze
      verklaring aan de inspecteur.

      7 In geval van levering door de afnemer van de onroerende zaak binnen de termijn waarin het keuzerecht voor
      belasting wordt beoordeeld, is het zesde lid van toepassing, met dien verstande dat de verklaring wordt overgelegd
      binnen vier weken na het tijdstip waarop de levering is verricht. In dat geval vervalt de verklaring, bedoeld in de
      eerste volzin van het zesde lid.

      8 Voor de toepassing van dit artikel geldt als boekjaar het boekjaar van de afnemer.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0002629#Artikel15
