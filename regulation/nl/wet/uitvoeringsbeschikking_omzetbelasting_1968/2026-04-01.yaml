    text: |-
      Ingeval een lichaam als bedoeld in [artikel 24, eerste lid, van de wet][ref1], is aangewezen op de voet van
      [artikel 23 van de wet][ref2], kunnen de artikelen 20 en 22 al dan niet op verzoek en onder nader bij de aanwijzing
      te stellen voorwaarden buiten toepassing worden verklaard.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel23
