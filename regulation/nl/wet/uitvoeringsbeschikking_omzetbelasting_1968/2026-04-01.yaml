  - number: '8'
    text: |-
      1 In het geval, bedoeld in [artikel 37d van de wet][ref1], wordt hij aan wie de overdracht is geschied, voor het
      berekenen van de door hem verschuldigde belasting wat de onderneming of het overgedragen gedeelte betreft, geacht
      in plaats te zijn getreden van degene die de onderneming of een gedeelte daarvan heeft overgedragen.

      2 Het eerste lid geldt niet voor de toepassing van [artikel 4c, derde en vierde lid][ref2].


