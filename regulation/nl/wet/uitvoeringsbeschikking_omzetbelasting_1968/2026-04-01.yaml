  - number: '21'
    text: |-
      In de aangifte ter verkrijging van teruggaaf op grond van [artikel 24, eerste lid, van de wet][ref1] worden per
      partij uit de Unie uitgevoerde of in een onder de regeling douane-entrepot geplaatste goederen vermeld:

      a. het bedrag van de gevraagde teruggaaf;

      b. de soort en de hoeveelheid van de uit de Unie uitgevoerde of onder de regeling douane-entrepot geplaatste
      goederen;

      c. een omschrijving van het bewijs, bedoeld in [artikel 20 onderdeel b of c][ref2], waarmee het verband tussen dat
      bewijs en de goederen kan worden vastgesteld;

      d. een omschrijving van de bescheiden waarmee kan worden aangetoond hoeveel belasting voor de goederen is betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0002634#Artikel20
