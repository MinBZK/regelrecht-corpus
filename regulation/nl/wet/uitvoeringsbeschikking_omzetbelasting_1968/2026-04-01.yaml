  - number: '11'
    text: |-
      1 De aftrek van de in [artikel 15 van de wet][ref1] bedoelde belasting (voorbelasting) geschiedt, ingeval de
      ondernemer zowel handelingen verricht waarvoor recht op aftrek van voorbelasting bestaat als handelingen verricht
      waarvoor geen recht op aftrek van voorbelasting bestaat, met inachtneming van het volgende:

      a. van goederen en diensten, die uitsluitend worden gebruikt voor handelingen waarvoor recht op aftrek van
      voorbelasting bestaat, komt de voorbelasting geheel voor aftrek in aanmerking;

      b. van goederen en diensten, die uitsluitend worden gebruikt voor handelingen waarvoor geen recht op aftrek van
      voorbelasting bestaat, komt de voorbelasting in het geheel niet voor aftrek in aanmerking;

      c. met betrekking tot goederen en diensten die zowel voor de onder a als voor de onder b bedoelde handelingen
      worden gebruikt, komt voor aftrek in aanmerking het gedeelte van de voorbelasting dat in dezelfde verhouding staat
      tot die belasting als het totaal van de vergoedingen voor de handelingen bedoeld onder a staat tot het totaal van
      de vergoedingen voor de handelingen bedoeld onder a en onder b.

      2 Indien aannemelijk is dat het werkelijke gebruik van de in het eerste lid, onderdeel c, bedoelde goederen
      en diensten, als geheel genomen, niet overeenkomt met de aldaar bedoelde verhouding, wordt het voor aftrek in
      aanmerking komende gedeelte van de voorbelasting van die goederen en diensten berekend op basis van het werkelijke
      gebruik.

      3 Ingeval de ondernemer twee of meer goederen of diensten van dezelfde soort gebruikt, worden deze alle geacht
      mede te worden gebruikt ten behoeve van handelingen waarvoor geen recht op aftrek van voorbelasting bestaat, tenzij
      blijkt welke van die goederen of diensten uitsluitend worden gebruikt voor handelingen waarvoor geen recht op
      aftrek bestaat en welke uitsluitend voor handelingen waarvoor dat recht wél bestaat.

      4 De in [artikel 15, eerste lid, laatste alinea, van de wet][ref2] bedoelde aftrek over uitgaven in verband met
      een onroerende zaak wordt berekend op basis van het werkelijke gebruik van die onroerende zaak.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel15
