  - number: 16b
    text: |-
      1 Ten aanzien van de vrijstelling als bedoeld in [artikel 21, onderdeel d, van de wet][ref1], is een vergunning
      van de inspecteur vereist. Het bepaalde in artikel 22 van het Douanewetboek van de Unie is van overeenkomstige
      toepassing.

      2 De verlening van de vergunning, bedoeld in het eerste lid, is gebonden aan de volgende voorwaarden:

      a. degene die de goederen invoert, verstrekt aan de inspecteur zijn btw-identificatienummer dat is toegekend
      door Nederland of ingeval de belasting wordt voldaan door zijn fiscaal vertegenwoordiger als bedoeld in
      [artikel 33g van de wet][ref2] het btw-identificatienummer dat is toegekend door Nederland aan deze fiscaal
      vertegenwoordiger en het btw-identificatienummer waaronder degene die de goederen intracommunautair afneemt in
      een andere lidstaat is geregistreerd of ingeval van overbrenging van eigen goederen het btw-identificatienummer
      waaronder degene die de goederen invoert zelf in de lidstaat van aankomst van het vervoer is geregistreerd;

      b. de inspecteur kan bepalen dat degene die de goederen invoert, onder de in het vierde lid genoemde voorwaarden,
      zekerheid stelt tot het beloop van een door de inspecteur vastgesteld bedrag per invoer van goederen;

      c. degene die de goederen invoert, verstrekt op verzoek aan de inspecteur de inlichtingen die noodzakelijk zijn om
      het beloop van de zekerheid vast te stellen.

      3 Ten aanzien van de goederen die worden ingevoerd kan door de inspecteur bewijs worden verzocht dat de ingevoerde
      goederen bestemd zijn om naar een andere lidstaat te worden vervoerd of verzonden.

      4 Met betrekking tot de te stellen zekerheid zijn de bepalingen van Titel III, hoofdstuk 2, van het Douanewetboek
      van de Unie van overeenkomstige toepassing.

      5 De inspecteur kan de vergunning intrekken of wijzigen:

      a. op verzoek van de vergunninghouder;

      b. indien de vergunninghouder niet voldoet aan de aan de vergunning verbonden voorwaarden.

      6 De vrijstelling is slechts van toepassing indien wordt aangetoond dat ter zake van de levering is voldaan
      aan het bepaalde in de [artikelen 14][ref3], [34c][ref4], [35a][ref5] en [37a van de wet][ref6] alsmede in
      [artikel 12 van het besluit][ref7].


