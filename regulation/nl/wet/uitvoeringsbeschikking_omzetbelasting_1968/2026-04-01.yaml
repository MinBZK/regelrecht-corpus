  - number: '31'
    text: |-
      1 De ondernemer is gehouden regelmatig aantekening te houden van:

      a. de aan hem en door hem uitgereikte facturen alsmede, indien het een wederverkoper betreft, de door hem
      uitgereikte inkoopverklaringen;

      b. de uitgaven en ontvangsten ter zake van de aan hem en door hem verrichte leveringen van goederen en verleende
      diensten en de door hem verrichte intracommunautaire verwervingen van goederen;

      c. het betrekken van voor hem bestemde ingevoerde goederen;

      d. het verzenden of afleveren van door hem voor uitvoer uit de Unie of opslag in een entrepot bestemde goederen.

      2 De in het eerste lid bedoelde aantekeningen van facturen - welke doorlopend dienen te worden genummerd -
      omvatten:

      a. dagtekening en nummer;

      b. naam, adres en, in voorkomend geval, btw-identificatienummer van de ondernemer door wie of aan wie de levering
      of de dienst wordt verricht, alsmede van degene aan wie wordt geleverd met toepassing van de bij de wet behorende
      [tabel II][ref1], onderdeel a, post 6;

      c. een duidelijke omschrijving van de geleverde goederen of van de dienst;

      d. de vergoeding;

      e. het bedrag van de belasting.

      3 De rechtspersoon, andere dan ondernemer, is gehouden ter zake van zijn intracommunautaire verwervingen regelmatig
      aantekening te houden van:

      a. de aan hem uitgereikte facturen;

      b. de uitgaven ter zake van die verwervingen.

      4 De in het derde lid bedoelde aantekeningen van facturen - welke doorlopend dienen te worden genummerd - omvatten:

      a. dagtekening en nummer;

      b. naam, adres en btw-identificatienummer van degene door wie de levering wordt verricht;

      c. een duidelijke omschrijving van de geleverde goederen;

      d. de vergoeding onderscheiden naar:

      1°. nieuwe vervoermiddelen;

      2°. accijnsgoederen;

      3°. overige goederen;

      e. het bedrag van de belasting.

      5 De aantekeningen worden op zodanige duidelijke en overzichtelijke wijze en met vermelding van zodanige
      bijzonderheden gehouden, dat aan de hand daarvan de door de ondernemer of door de rechtspersoon, andere dan
      ondernemer, over een bepaald belastingtijdvak verschuldigde belasting kan worden vastgesteld. De wederverkoper
      is tevens gehouden om met betrekking tot goederen die administratief van inkoop tot verkoop zijn te volgen, zijn
      boekhouding op zodanige wijze te voeren dat aan de hand daarvan het verband tussen inkoop en verkoop kan worden
      vastgesteld.

      6 De ondernemer en de rechtspersoon, andere dan ondernemer, zijn verplicht de aantekeningen te bewaren gedurende
      de termijn, bedoeld in [artikel 52, vierde lid, van de Algemene wet inzake rijksbelastingen][ref2] en in
      [artikel 34a van de wet][ref3].

      7 De inspecteur kan afwijkingen toestaan van de verplichtingen welke zijn opgelegd in de vorige leden.

      8 De ondernemer is gehouden zijn boekhouding op zodanige duidelijke en overzichtelijke wijze te voeren en
      met vermelding van zodanige bijzonderheden, dat de inspecteur aan de hand daarvan kan vaststellen of de
      belastingheffing met betrekking tot de in [artikel 34, tweede lid, onderdelen a en b, van de wet][ref4], bedoelde
      goederen, op de juiste wijze plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0002629
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel52
      [ref3]: https://wetten.overheid.nl/BWBR0002629#Artikel34a
      [ref4]: https://wetten.overheid.nl/BWBR0002629
    url: https://wetten.overheid.nl/BWBR0002634/2026-04-01#Artikel31
