  - number: '18'
    text: |-
      1 Voor andere goederen dan bedoeld in de [artikelen 17][ref1] en [17a][ref2] wordt een verzoek om aanwijzing voor
      de toepassing van [artikel 23 van de wet][ref3] ingediend bij de inspecteur. De inspecteur beslist op het verzoek
      bij voor bezwaar vatbare beschikking. Bij inwilliging van het verzoek stelt de inspecteur een datum van ingang vast
      en kent hij aan de belanghebbende een btw-identificatienummer toe.

      2 Het verzoek wordt slechts ingewilligd, indien de belanghebbende:

      a. in Nederland woont of is gevestigd, dan wel aldaar een vaste inrichting of een fiscaal vertegenwoordiger heeft;

      b. geregeld goederen invoert, dan wel incidenteel goederen invoert en een fiscaal vertegenwoordiger in Nederland
      heeft;

      c. een bedrijfsadministratie voert welke naar het oordeel van de inspecteur zodanig is ingericht dat daarin
      op overzichtelijke wijze zijn opgenomen de door de inspecteur nodig geoordeelde gegevens omtrent de ingevoerde
      goederen, en dat aan de hand daarvan op eenvoudige wijze de ter zake van de invoer van die goederen verschuldigde
      omzetbelasting kan worden vastgesteld.

      3 De aanwijzing geldt voor alle goederen welke ten behoeve van de belanghebbende worden ingevoerd, waaronder zijn
      begrepen de goederen ter zake waarvan de belanghebbende aan een andere ondernemer een schriftelijke verklaring
      heeft afgegeven dat hij de goederen invoert of dat de invoer in zijn opdracht plaatsvindt.

      4 Ten aanzien van goederen welke door Koninklijke PostNL B.V. worden ingevoerd, vindt [artikel 23 van de wet][ref4]
      slechts toepassing, indien:

      a. op de postzending of in de daarbij behorende bescheiden het aan de belanghebbende toegekende btw-
      identificatienummer is vermeld, of

      b. ten aanzien van de postzending de belanghebbende een schriftelijke inklaringsopdracht aan Koninklijke PostNL
      B.V. heeft verstrekt waarin het aan hem toegekende btw-identificatienummer is vermeld.

      5 Tenzij de inspecteur anders bepaalt, moet de belanghebbende voldoen aan de volgende voorwaarden:

      a. van de invoer wordt afzonderlijk aantekening gehouden op de voet van [artikel 31][ref5];

      b. bij aangifte ten invoer van de goederen worden bescheiden - een kopie-factuur, vracht- en ladingspapieren
      en dergelijke - overgelegd waaruit blijkt dat de goederen voor belanghebbende zijn bestemd en de regeling van
      [artikel 23 van de wet][ref6] van toepassing is. Op deze bescheiden moet het btw-identificatienummer zijn vermeld.

      6 Ingeval de belanghebbende handelt in strijd met de gestelde voorwaarden, alsmede in geval van misbruik, waaronder
      wordt begrepen misbruik door de vervoerder van de goederen, kan de inspecteur de aanwijzing intrekken en een nieuwe
      aanwijzing weigeren. De intrekking en de weigering geschieden bij voor bezwaar vatbare beschikking.

      7 Het eerste tot en met zesde lid zijn niet van toepassing op personenauto’s, bestelauto’s en motorrijwielen in de
      zin van de [artikelen 3][ref7] en [4 van de Wet op de belasting van personenauto’s en motorrijwielen 1992][ref8].


      [ref1]: https://wetten.overheid.nl/BWBR0002634#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0002634#Artikel17a
