  - number: '12'
    text: |-
      1 De in artikel 11 voorgeschreven berekeningswijze geschiedt op basis van de gegevens van het belastingtijdvak
      waarin de belasting aan de ondernemer in rekening wordt gebracht dan wel de belasting wordt verschuldigd.

      2 De herziening, bedoeld in [artikel 15, vierde lid, van de wet][ref1], geschiedt op basis van de gegevens van het
      belastingtijdvak waarin de ondernemer de goederen of diensten is gaan gebruiken.

      3 Bij de aangifte over het laatste belastingtijdvak van het boekjaar vindt herziening van de aftrek plaats op basis
      van de voor het gehele boekjaar geldende gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel15
    url: https://wetten.overheid.nl/BWBR0002634/2026-04-01#Artikel12
