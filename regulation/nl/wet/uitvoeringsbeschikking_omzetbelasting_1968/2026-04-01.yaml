  - number: '20'
    text: |-
      Bij de aangifte ter verkrijging van teruggaaf op grond van [artikel 24, eerste lid, van de wet][ref1] worden
      overgelegd:

      a. bescheiden waarmee kan worden aangetoond hoeveel belasting voor de goederen is betaald;

      b. voor wat betreft uitgevoerde goederen: een bewijs waaruit blijkt dat de betreffende goederen uit de Unie zijn
      uitgevoerd;

      c. voor wat betreft goederen die onder de regeling douane-entrepot op basis van artikel 237, tweede lid, van het
      Douanewetboek van de Unie zijn geplaatst: een bewijs waaruit blijkt dat de betreffende goederen onder de regeling
      douane-entrepot zijn geplaatst;

      d. voor wat betreft motorrijtuigen waarvoor ter zake van de in [artikel 36 van de Wegenverkeerswet 1994][ref2]
      bedoelde opgaaf van een kenteken een bewijs is afgegeven, een ter zake van de uitvoer uit de
      Unie door de Dienst Wegverkeer afgegeven kentekenbewijs deel II, dat is uitgereikt op de voet van
      [artikel 17, tweede lid, van het Kentekenreglement][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel36
      [ref3]: https://wetten.overheid.nl/BWBR0006951#Artikel17
