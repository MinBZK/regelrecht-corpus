        artikel: 34c
  - number: 4b
    text: |-
      1 Ingeval van inwilliging van het in [artikel 28c, eerste lid, van de wet][ref1] bedoelde verzoek, is de
      wederverkoper de belasting die hij in aftrek heeft gebracht:

      a. ter zake van de levering en invoer van goederen als bedoeld in het eerste lid, onderdelen a en b, van dat
      artikel; of

      b. met toepassing van het tweede lid van dit artikel;

      alsnog verschuldigd in het eerste belastingtijdvak waarin [artikel 28c van de wet][ref2] toepassing vindt.

      2 Ingeval van een wederopzegging als bedoeld in [artikel 28c, tweede lid, van de wet][ref3], kan de ondernemer de
      belasting die hij:

      a. ingevolge [artikel 28e, onderdeel b, van de wet][ref4] niet in aftrek heeft gebracht; of

      b. met toepassing van het eerste lid van dit artikel verschuldigd is geworden;

      alsnog in aftrek brengen in het eerste belastingtijdvak waarin die wederopzegging toepassing vindt.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel28c
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel28c
      [ref3]: https://wetten.overheid.nl/BWBR0002629#Artikel28c
      [ref4]: https://wetten.overheid.nl/BWBR0002629#Artikel28e
