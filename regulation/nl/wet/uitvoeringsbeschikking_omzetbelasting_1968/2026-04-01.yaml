      1 Als ondernemers als bedoeld in [artikel 34e van de wet][ref1], worden aangewezen groothandelaren in
      levensmiddelen, tabaksproducten, dranken, tandheelkundige grondstoffen, tandtechnische werken en onderdelen van
      tandtechnische werken.

      2 De in [artikel 34c, tweede lid, van de wet][ref2], bedoelde ontheffing van de verplichting om een factuur uit te
      reiken indien vrijgestelde prestaties worden verricht, geldt niet ter zake van de levering van een roerende zaak
      als bedoeld in [artikel 11, eerste lid, onderdeel r, van de wet][ref3].


