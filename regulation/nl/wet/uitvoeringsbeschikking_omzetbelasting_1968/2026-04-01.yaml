  - number: 9a
    text: |-
      Tot de diensten, bedoeld in [artikel 11, eerste lid, onderdeel u, van de wet][ref1], behoren niet:

      a. het ontwikkelen van geautomatiseerde informatie- en communicatiesystemen;

      b. het voor de in onderdeel a bedoelde systemen ontwikkelen van programmatuur, alsmede het ter beschikking stellen
      daarvan;

      c. het begeleiden van dan wel het leiding geven aan de toepassing van de in onderdeel a bedoelde systemen;

      d. het ter beschikking stellen van computerapparatuur;

      e. advisering, begeleiding, onderzoek en andere diensten op het gebied van onderhoudsbeheersing van woningen en
      andere gebouwen;

      f. expertisewerkzaamheden, onderzoeken, inspecties, taxaties, arbitrage en advisering in het kader van een
      verzekering of een schadegeval;

      g. het verlenen van bijstand als bedoeld in [artikel 13, zevende lid][ref2] en
      [artikel 14, eerste lid, van de Arbeidsomstandighedenwet 1998][ref3];

      h. werkzaamheden met betrekking tot de pensioenadministratie;

      i. het adviseren en ondersteunen van paritaire organisaties;

      j. het ter beschikking stellen van personeel.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0010346#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0010346#Artikel14
