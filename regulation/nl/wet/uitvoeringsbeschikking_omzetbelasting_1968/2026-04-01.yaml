  - number: 36b
    text: |-
      Tot de goederen of soorten van goederen bedoeld in de bij de wet behorende tabel II, onderdeel a, post 8,
      onder a, onderscheidenlijk onder b behoren de goederen opgenomen in de bij deze regeling behorende bijlage I
      onderscheidenlijk bijlage K, voor zover deze produkten niet geschikt zijn zonder nadere be- of verwerking in de
      particuliere verbruikssfeer te worden gebracht.
    url: https://wetten.overheid.nl/BWBR0002634/2026-04-01#Artikel36b
  - number: 36c
    text: |-
      1 Ondernemers wier bedrijfsuitoefening gericht is op het leveren van goederen als bedoeld in de bij deze regeling
      behorende bijlage I, kunnen met betrekking tot die goederen, voor zover in Nederland aanwezig, in aanmerking
      komen voor een vergunning voor een niet-plaatsgebonden entrepot als bedoeld in de bij de wet behorende tabel II,
      onderdeel a, post 8, onder a.

      2 Degene die een vergunning voor een niet-plaatsgebonden entrepot wil verkrijgen, dient daartoe een verzoek in bij
      de inspecteur.

      3 In het verzoek dient te worden vermeld:

      a. de naam, het adres, het btw-identificatienummer en de aard van het bedrijf van de ondernemer die het verzoek
      doet;

      b. de goederen waarop het verzoek betrekking heeft.

      4 In de vergunning neemt de inspecteur nadere regels op met betrekking tot de door de ondernemer te voeren
      administratie ten behoeve van de controle op de juiste toepassing van de bij de wet behorende tabel II, onderdeel
      a, post 8, onder a. In de vergunning vermeldt de inspecteur voorts de datum met ingang waarvan de vergunning geldt.

      5 De vergunning kan worden gewijzigd of ingetrokken:

      a. op verzoek van de vergunninghouder;

      b. in geval de voorwaarden voor de vergunning niet worden nageleefd.

      6 Het verlenen, het wijzigen en het intrekken van een vergunning alsmede het afwijzen van een verzoek om een
      vergunning te verlenen geschieden bij voor bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0002634/2026-04-01#Artikel36c
  - number: 36ca
    text: |-
      1 Een accijnsgoederenplaats voor minerale oliën als bedoeld in de [Wet op de accijns][ref1] kan worden aangewezen
      voor toepassing van de bijzondere bepaling van de bij de wet behorende tabel II, onderdeel a, post 7.

      2 Voor het verkrijgen van de in het eerste lid bedoelde aanwijzing dient de vergunninghouder van de
      accijnsgoederenplaats een verzoek in bij de inspecteur. In het verzoek dient hij zijn naam, adres en btw-
      identificatienummer te vermelden. Voorts dient hij de inspecteur een afschrift te verstrekken van zijn vergunning
      voor die accijnsgoederenplaats.

      3 In de aanwijzing neemt de inspecteur nadere voorwaarden op met betrekking tot de door de vergunninghouder te
      voeren administratie ten behoeve van de controle op de juiste toepassing van de bijzondere bepaling van de bij
      de wet behorende tabel II, onderdeel a, post 7. Deze voorwaarden bepalen in ieder geval dat de administratie
      zodanig wordt gevoerd dat bij de uitslag van minerale oliën uit de accijnsgoederenplaats in de zin van de
      [Wet op de accijns][ref2] de identiteit wordt vastgelegd van de ondernemer van wie de belasting wordt geheven
      ter zake van de aan hem verrichte, aan de uitslag voorafgaande levering alsmede dat de hoeveelheid en de soort
      van de desbetreffende minerale oliën wordt omschreven. Daarbij moet, wanneer bedoelde ondernemer een buitenlandse
      ondernemer is, de naam en het btw-identificatienummer worden vastgelegd van de fiscaal vertegenwoordiger die voor
      die ondernemer optreedt met betrekking tot die levering. In de aanwijzing vermeldt de inspecteur voorts de datum
      met ingang waarvan de aanwijzing geldt.

      4 De aanwijzing kan worden gewijzigd of ingetrokken:

      a. op verzoek van de vergunninghouder;

      b. in geval de voorwaarden voor de aanwijzing niet worden nageleefd.

      5 Het verlenen, het wijzigen en het intrekken van een aanwijzing alsmede het afwijzen van een verzoek om een
      aanwijzing te verlenen, geschieden bij voor bezwaar vatbare beschikking. Een aanwijzing kan niet worden verleend
      aan degene die een vergunning voor een accijnsgoederenplaats voor minerale oliën heeft verkregen als bedoeld in
      [artikel 42a van de Wet op de accijns][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005251
      [ref2]: https://wetten.overheid.nl/BWBR0005251
      [ref3]: https://wetten.overheid.nl/BWBR0005251#Artikel42a
