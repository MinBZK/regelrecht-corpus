    text: |-
      Handelingen die op grond van [artikel 28k van de wet][ref1] van de belasting zijn vrijgesteld, worden voor de
      toepassing van de [artikelen 11 tot en met 14][ref2] aangemerkt als handelingen waarvoor geen recht op aftrek van
      voorbelasting bestaat.


