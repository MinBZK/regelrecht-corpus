        artikel: '23'
  - number: 23a
    text: |-
      1 In geval van levering van goederen aan natuurlijke personen die hun normale verblijfplaats hebben in een
      derde-land en die, anders dan als ondernemer, deze goederen uiterlijk het einde van de derde maand na de maand
      van aankoop bij het verlaten van Nederland in hun persoonlijke bagage meevoeren naar een derde-land, hetzij
      rechtstreeks hetzij via één of meer andere lidstaten, is de ondernemer gerechtigd, in afwijking van het wettelijk
      geldende tarief, het tarief van nihil toe te passen, indien de totale waarde van de op de factuur vermelde
      goederen, inclusief de tegen het wettelijk tarief berekende belasting, ten minste € 50 bedraagt. De normale
      verblijfplaats dient aan de hand van een legitimatiebewijs te worden aangetoond.

      2 Het eerste lid, eerste volzin, is van overeenkomstige toepassing met betrekking tot goederen die worden afgenomen
      door een natuurlijke persoon die zijn normale verblijfplaats heeft in de Unie en die ten genoegen van de inspecteur
      kan aantonen dat hij zich binnen de in het eerste lid bedoelde termijn in een derde-land zal vestigen.

      3 Met betrekking tot de toepassing van het tarief van nihil is het bepaalde in [artikel 12 van het besluit][ref1]
      van overeenkomstige toepassing, met dien verstande dat voor goederen gekocht in Nederland:

      a. die vanuit Nederland worden uitgevoerd uit de Unie voor het aantonen van de aanspraak op toepassing daarvan in
      ieder geval is vereist een digitaal aangeleverd document dat is voorzien van een visum door een geautomatiseerd
      systeem van of vanwege de bevoegde autoriteiten;

      b. die vanuit een andere lidstaat worden uitgevoerd uit de Unie voor het aantonen van de aanspraak op toepassing
      daarvan in ieder geval is vereist een factuur, een kopie-factuur of een daarmee gelijk te stellen bescheid of
      digitaal aangeleverd document dat is voorzien van een visum door een geautomatiseerd systeem van of vanwege de
      bevoegde autoriteiten of een daartoe bevoegde ambtenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0002633#Artikel12
    url: https://wetten.overheid.nl/BWBR0002634/2026-04-01#Artikel23a
