    text: |-
      De ondernemer of de tussenpersoon die het recht uitoefent om overeenkomstig [artikel 28l van de wet][ref1] voor
      belastingheffing te kiezen, stelt de inspecteur schriftelijk in kennis van deze keuze.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel28l
