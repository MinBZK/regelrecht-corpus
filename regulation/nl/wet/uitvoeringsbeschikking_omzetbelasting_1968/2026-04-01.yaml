  - number: 4c
    text: |-
      1 [Artikel 28d van de wet][ref1] is van toepassing:

      a. ter zake van leveringen door wederverkopers van de volgende goederen alsmede van de gebruikte onderdelen,
      toebehoren en benodigdheden terzake:

      1°. vervoermiddelen, daaronder begrepen caravans, fietsen en bromfietsen;

      2°. kleding;

      3°. meubels;

      4°. boeken en tijdschriften;

      5°. foto-, film- en video-apparatuur alsmede beeld- en geluiddragers zoals grammofoonplaten, video- en
      muziekcassettes en compact-discs;

      6°. muziekinstrumenten;

      7° huishoudelijke, elektrische en elektronische apparaten;

      8°. huisdieren;

      9°. kunstvoorwerpen, voorwerpen voor verzamelingen en antiquiteiten;

      b. ter zake van leveringen door wederverkopers van andere goederen dan die bedoeld in onderdeel a, ingeval
      het onmogelijk of ongebruikelijk is om de goederen administratief van inkoop tot verkoop te volgen of om
      de aankoopprijs van een partij goederen te splitsen in aankoopprijzen voor elk afzonderlijk goed, mits de
      wederverkoper op een daartoe gedaan verzoek door de inspecteur is aangewezen.

      2 Het eerste lid is niet van toepassing ten aanzien van veilinghouders.

      3 Het eerste lid, aanhef en onderdeel a, is niet van toepassing ten aanzien van wederverkopers die daarvan
      schriftelijk kennis geven aan de inspecteur. Deze regeling mag slechts worden toegepast met ingang van het
      kalenderjaar volgend op dat van de kennisgeving en geldt tot wederopzegging met ingang van een kalenderjaar na die
      wederopzegging, doch voor ten minste vijf kalenderjaren. Een hernieuwde schriftelijke kennisgeving kan eerst met
      ingang van het zesde kalenderjaar na het ingaan van die wederopzegging worden ingewilligd.

      4 De inspecteur beslist op het in het eerste lid, onderdeel b, bedoelde verzoek bij voor bezwaar vatbare
      beschikking. Bij inwilliging van het verzoek geldt zulks met ingang van het kalenderjaar volgend op dat van
      het verzoek en tot wederopzegging met ingang van een kalenderjaar na die wederopzegging, doch voor ten minste
      vijf kalenderjaren. Een hernieuwd verzoek kan eerst met ingang van het zesde kalenderjaar na het ingaan van die
      wederopzegging worden ingewilligd.

      5 De wederverkoper die ingevolge de vorige leden de belasting moet berekenen op de voet van
      [artikel 28d van de wet][ref2], maar die ter zake van de levering van een goed in het tijdvak van aangifte op
      grond van [artikel 9, tweede lid, onderdeel b, van de wet][ref3] het tarief van nihil toepast dan wel de belasting
      berekent met toepassing van [artikel 28f, eerste lid, van de wet][ref4], is gehouden in dat tijdvak de in
      [artikel 28d, tweede volzin, van de wet][ref5], laatstbedoelde som te verminderen:

      a. met het bedrag dat eerder bij de berekening van de winstmarge per tijdvak van aangifte ter zake van dat goed in
      aanmerking is genomen; of

      b. ingeval het in onderdeel a bedoelde bedrag niet bekend is, met het bedrag van de vergoeding voor dat goed
      verminderd met het positieve bedrag van de brutowinst, welke wordt gesteld op het bedrag van die vergoeding
      vermenigvuldigd:

      1°. met het saldo van de winstmarges per tijdvak van aangifte over het voorgaande kalenderjaar gedeeld door de som
      van de bij de berekening van die winstmarges in aanmerking genomen vergoedingen; of

      2°. ingeval het onder 1° bedoelde saldo ontbreekt, met de winstmarge over het voorafgaande tijdvak van aangifte
      gedeeld door de som van de bij de berekening van die winstmarge in aanmerking genomen vergoedingen;

      waarbij de onder 1° en 2° bedoelde winstmarges en vergoedingen betrekking hebben op goederen waarop eenzelfde
      tarief van toepassing is als op het geleverde goed en de bedoelde winstmarges de in een tijdvak van aangifte
      gerealiseerde winstmarges betreffen, voordat de in het zesde lid bedoelde verrekening of optelling heeft
      plaatsgevonden.

      6 Ingeval in een belastingtijdvak in een kalenderjaar, het laatste belastingtijdvak in een kalenderjaar
      uitgezonderd, de winstmarge per belastingtijdvak met betrekking tot leveringen van goederen waarop eenzelfde
      tarief wordt toegepast (tijdvak-winstmarge) negatief is, wordt deze negatieve tijdvak-winstmarge verrekend
      met een positieve tijdvak-winstmarge, of opgeteld bij een negatieve tijdvak-winstmarge, die in het volgende
      belastingtijdvak wordt gerealiseerd.

      7 Na afloop van een kalenderjaar wordt voor dat kalenderjaar met betrekking tot leveringen van goederen
      waarop eenzelfde tarief wordt toegepast de in [artikel 28d, van de wet][ref6] bedoelde winstmarge op
      jaarbasis vastgesteld (jaarsaldo). Ingeval dat jaarsaldo negatief is, wordt dit negatieve jaarsaldo
      opgeteld bij de ten behoeve van de vaststelling van het jaarsaldo van het daaropvolgende kalenderjaar in
      [artikel 28d, tweede volzin, van de wet][ref7] laatstbedoelde, op jaarbasis herrekende, som. Ingeval de belasting
      over dat aldus berekende jaarsaldo minder bedraagt dan het bedrag aan belasting dat over dat kalenderjaar is of
      moet worden voldaan ter zake van dergelijke leveringen, wordt het verschil aan de wederverkoper teruggegeven.

      8 Het vaststellen van een negatief jaarsaldo als bedoeld in het zevende lid, alsmede van het bedrag van de aldaar
      bedoelde teruggaaf, geschiedt op verzoek bij voor bezwaar vatbare beschikking. Het verzoek wordt gedaan bij
      de aangifte over het eerste tijdvak van het volgende kalenderjaar. Indien de beschikking met betrekking tot de
      vaststelling van een negatief jaarsaldo tot een onjuist bedrag is vastgesteld, kan de inspecteur de beschikking
      bij voor bezwaar vatbare beschikking herzien. De bevoegdheid tot herziening ten aanzien van een negatief jaarsaldo
      vervalt door verloop van vijf jaren na het einde van het kalenderjaar waarin dat saldo, zonder toepassing van de
      tweede volzin van het zevende lid berekend, is ontstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel28d
