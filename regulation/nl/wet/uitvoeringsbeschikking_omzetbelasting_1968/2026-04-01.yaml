  - number: 36a
    text: |-
      1 Als schriftelijke verklaring als bedoeld in
      [artikel 12, tweede lid, onderdeel b.1° en b.2°, van het besluit][ref1], wordt aangewezen: een factuur,
      een kopiefactuur, of een daarmee gelijk te stellen bescheid dat is voorzien van de in die bepaling bedoelde
      verklaring van de afnemer van de goederen, die vergezeld gaat van een verklaring van de vergunninghouder van de
      accijnsgoederenplaats dat deze de goederen voor de ondernemer in zijn accijnsgoederenplaats in opslag neemt.

      2 Als schriftelijke verklaring als bedoeld in [artikel 12, tweede lid, onderdeel c, van het besluit][ref2], wordt
      aangewezen: een factuur, een kopiefactuur, of een daarmee gelijk te stellen bescheid dat is voorzien van de in die
      bepaling bedoelde verklaring van de afnemer van de goederen.

      3 In de factuur die de ondernemer afgeeft ter zake van leveringen als bedoeld in het eerste en tweede lid vermeldt
      hij ,,levering met toepassing van tabel II, post a.7’’, onderscheidenlijk ,,levering met toepassing van tabel II,
      post a.8’’. Wanneer een levering is geschied met toepassing van de bij de wet behorende tabel II, onderdeel a, post
      7, onder b, moet op de afgegeven factuur tevens het accijnsnummer van de afzender van het geleidedocument, alsmede
      het volgnummer van het geleidedocument worden vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0002633#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0002633#Artikel12
