    text: |-
      1 Deze regeling geeft uitvoering aan de [artikelen 1a, derde lid][ref1],
      [2a, eerste lid, onderdelen l en m, en tweede lid][ref2], [6k, vierde lid][ref3], [7, derde en vierde lid][ref4],
      [8, zevende lid][ref5], [11, eerste lid, onderdelen a, onder 2°, b, onder 5°, p, en zesde lid][ref6],
      [15, eerste lid, onderdeel c, onder 1°, derde en zesde lid][ref7], [17e][ref8], [21][ref9],
      [23, eerste lid][ref10], [24, tweede lid][ref11], [25b, eerste lid, onderdeel a][ref12],
      [26][ref13], [28d][ref14], [28i][ref15], [28p][ref16], [28zb, vierde lid][ref17],
      [29, tiende lid][ref18], [31, zevende lid][ref19], [32f, tweede lid][ref20], [32g][ref21],
      [32h][ref22], [32i][ref23], [34, eerste, tweede, derde en vierde lid][ref24], [34c, tweede lid][ref25],
      [34e][ref26], [35a, zesde lid][ref27], en [37d, van de Wet op de omzetbelasting 1968][ref28],
      [onderdeel a, posten 31 en 35, van de bij die wet behorende tabel I][ref29],
      [onderdeel a, posten 7 en 8, van de bij die wet behorende tabel II][ref30],
      [artikel 62 van de Algemene wet inzake rijksbelastingen][ref31], alsmede de
      [artikelen 4, eerste lid, onderdeel c][ref32], [12, vijfde lid][ref33], [13][ref34], [24b, achtste lid][ref35],
      [24ba, tweede lid][ref36], en [24c, derde lid, onderdeel c, van het Uitvoeringsbesluit omzetbelasting 1968][ref37].

      2 Deze regeling verstaat onder:

      a. *wet:* [Wet op de omzetbelasting 1968][ref38];

      b. *besluit:* [Uitvoeringsbesluit omzetbelasting 1968][ref39];

      c. *belasting:* omzetbelasting.


