  - number: 1a
    text: |-
      1 De inspecteur stelt de datum met ingang waarvan ingevolge
      [artikel 1a, derde lid, eerste volzin, van de wet][ref1], het tweede lid van dat artikel niet van toepassing is,
      vast:

      a. op de datum van dagtekening van de beschikking bedoeld in het derde lid van dat artikel; dan wel

      b. indien degene die het verzoek indient zulks wenst, op een in het verzoek aangegeven latere datum.

      2 De wederopzegging als bedoeld in [artikel 1a, derde lid, tweede volzin, van de wet][ref2], dient schriftelijk
      te geschieden.

      3 De inspecteur stelt de datum met ingang waarvan na de wederopzegging [artikel 1a, tweede lid, van de wet][ref3],
      wederom van toepassing is, vast, met inachtneming van het derde lid, tweede volzin, van dat artikel, op 1 januari
      van het jaar volgend op dat waarin de wederopzegging is ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0002629
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel1a
      [ref3]: https://wetten.overheid.nl/BWBR0002629#Artikel1a
