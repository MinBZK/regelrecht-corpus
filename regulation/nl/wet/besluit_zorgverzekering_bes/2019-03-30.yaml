  - number: 1.q
    text: |-
      *neonatale hielprik:* het onderzoek, bedoeld in [artikel 6, eerste lid, onderdeel l][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0029404#Artikel6
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel1
    references:
      - id: ref1
