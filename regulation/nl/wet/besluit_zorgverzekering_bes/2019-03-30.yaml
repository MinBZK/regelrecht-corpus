  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Volksgezondheid, Welzijn en Sport van 16 november 2010, kenmerk Z/VV-
    3020244;

    Gelet op de artikelen 18.4.1 en 18.4.3. van de Invoeringswet openbare lichamen Bonaire, Sint Eustatius en Saba;

    De Afdeling advisering van de Raad van State gehoord (advies van 6 december 2010, nummer  W13.10.0526/III);

    Gezien het nader rapport van Onze Minister van Volksgezondheid, Welzijn en Sport, van 16 december 2010, kenmerk Z/
    VV- 3040126;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel1
  - number: 1.a
    text: '*Onze Minister:* Onze Minister van Volksgezondheid, Welzijn en Sport;'
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel1
  - number: 1.b
    text: |-
      *RCN:* de Rijksdienst Caribisch Nederland, genoemd in
      [artikel 2 van het Organisatie- en mandaatbesluit BZK-BES][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0028832#Artikel2
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0028832
        artikel: '2'
  - number: 1.c
    text: |-
      *Zorgverzekeringskantoor BES:* het onderdeel van het RCN dat ten behoeve van Onze Minister ten dienste staat aan de
      uitvoering van dit besluit;
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel1
  - number: 1.d
    text: |-
      *lichaam:* rechtspersoon, maat- en vennootschap, samenwerkingsvorm zonder rechtspersoonlijkheid die met
      verenigingen maatschappelijk gelijk kan worden gesteld, of onderneming van publiekrechtelijke rechtspersoon en
      doelvermogens;
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel1
  - number: 1.e
    text: '*instelling:*'
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel1
  - number: 1.e.1
    text: |-
      een organisatorisch verband dat zich jegens het Zorgverzekeringskantoor BES heeft verbonden om behandeling,
      verpleging of verzorging te verlenen;
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel1
  - number: 1.e.2
    text: |-
      een buiten het grondgebied van de BES-eilanden gevestigde rechtspersoon die in het land van vestiging zorg verleent
      in het kader van het in dat land bestaande sociale zekerheidsstelsel, dan wel bij gebreke daarvan overeenkomstig de
      wetgeving van dat land rechtmatig zorg verleent als bedoeld in [artikel 6][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0029404#Artikel6
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0029404
        artikel: '6'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 1.f
    text: |-
      *zorgaanbieder:* een instelling of persoon die zorg als bedoeld in [artikel 6][ref1] verleent;


      [ref1]: https://wetten.overheid.nl/BWBR0029404#Artikel6
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0029404
        artikel: '6'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 1.g
    text: |-
      *loon:* het loon, bedoeld in de [hoofdstukken II][ref1] en [III, van de Wet loonbelasting BES][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0029283#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0029283#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel1
    references:
