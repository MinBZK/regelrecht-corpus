  - number: '2'
    text: Ingezetene in de zin van dit besluit is degene, die rechtmatig op het grondgebied van de BES-eilanden woont.
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel2
  - number: '3.1'
    text: Waar iemand woont en waar een lichaam gevestigd is, wordt naar de omstandigheden beoordeeld.
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel3
  - number: '3.2'
    text: |-
      Voor de toepassing van het eerste lid worden schepen welke op het grondgebied van de BES-eilanden hun thuishaven
      hebben, ten opzichte van de bemanning als deel van de BES-eilanden beschouwd.
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel3
  - number: '3.3'
    text: |-
      Hij die de BES-eilanden metterwoon heeft verlaten en binnen een jaar metterwoon terugkeert zonder inmiddels op
      het grondgebied van Aruba, Curaçao, Sint Maarten, Nederland of op het grondgebied van een andere Mogendheid te
      hebben gewoond, wordt ook voor de duur van zijn afwezigheid geacht op het grondgebied van de BES-eilanden te hebben
      gewoond.
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel3
  - number: '4.1'
    text: |-
      Onverminderd hetgeen is bepaald in [artikel 29][ref1], is verzekerd overeenkomstig de bepalingen van dit besluit
      degene, die:


      [ref1]: https://wetten.overheid.nl/BWBR0029404#Artikel29
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0029404
        artikel: '29'
        hoofdstuk: '9'
  - number: 4.1.a
    text: ingezetene is;
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel4
  - number: 4.1.b
    text: |-
      geen ingezetene is, doch op het grondgebied van de BES-eilanden in dienstbetrekking arbeid verricht ter zake
      waarvan het loon is onderworpen aan de [Wet loonbelasting BES][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0029283
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0029283
  - number: 4.1.c
    text: |-
      voor zover deze niet reeds is begrepen in onderdeel a en b, op grond van de [Wet toelating en uitzetting BES][ref1]
      een verblijfsvergunning voor bepaalde tijd of voor onbepaalde tijd heeft gekregen dan wel die op grond van een
      Verklaring van Rechtswege op het grondgebied van de BES verblijft;


      [ref1]: https://wetten.overheid.nl/BWBR0028571
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0028571
  - number: 4.1.d
    text: |-
      degene die na afloop van een verleende vergunning voor bepaalde tijd tijdig een aanvraag heeft ingediend voor
      voortzetting daarvan of voor omzetting in een vergunning voor onbepaalde tijd, tot op die aanvraag onherroepelijk
      is beslist;
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel4
  - number: 4.1.e
    text: |-
      aansluitend op het wonen op het grondgebied van de BES-eilanden uitsluitend wegens studieredenen niet meer op het
      grondgebied van de BES-eilanden woont;
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel4
  - number: 4.1.f
    text: |-
      als ambtenaar in dienst van het openbare lichaam Bonaire, Sint Eustatius of Saba is uitgezonden om in Nederland
      arbeid te verrichten ten behoeve van een van deze openbare lichamen en ten tijde van de aanwerving niet in
      Nederland woonde, tenzij hij:
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel4
  - number: 4.1.f.1°
    text: in Nederland arbeid verricht anders dan uit hoofde van de vorenbedoelde dienstbetrekking;
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel4
  - number: 4.1.f.2°
    text: een Nederlandse sociale verzekeringsuitkering ontvangt;
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel4
  - number: 4.1.g
    text: 'echtgenoot of anderszins inwonend gezinslid is van een persoon als bedoeld onder f, tenzij hij:'
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel4
  - number: 4.1.g.1°
    text: in Nederland arbeid verricht;
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel4
  - number: 4.1.g.2°
    text: een Nederlandse sociale verzekeringsuitkering ontvangt.
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel4
  - number: '4.2'
    text: 'Zo nodig in afwijking van het eerste lid, is niet verzekerd overeenkomstig de bepalingen van dit besluit:'
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel4
  - number: 4.2.a
    text: de persoon die uitsluitend wegens studieredenen op het grondgebied van de BES-eilanden verblijft;
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel4
  - number: 4.2.b
    text: degene die als stagiair of au pair op het grondgebied van de BES-eilanden verblijft;
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel4
  - number: 4.2.c
    text: |-
      de persoon die op het grondgebied van de BES-eilanden woont en die uit hoofde van een dienstbetrekking met een
      Nederlandse publiekrechtelijke rechtspersoon op het grondgebied van de BES-eilanden arbeid verricht ten behoeve van
      die rechtspersoon, alsmede diens echtgenoot en andere inwonende gezinsleden;
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel4
  - number: 4.2.d
    text: |-
      de persoon die op het grondgebied van de BES-eilanden woont en die gedurende een aaneengesloten periode van ten
      minste drie maanden uitsluitend buiten het grondgebied van de BES-eilanden arbeid verricht, tenzij die arbeid
      uitsluitend wordt verricht uit hoofde van een dienstbetrekking met een op het grondgebied van de BES-eilanden
      wonende of gevestigde werkgever;
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel4
  - number: 4.2.e
    text: |-
      de persoon die op het grondgebied van Nederland woont en die op het grondgebied van de BES-
      eilanden arbeid verricht uitsluitend uit hoofde van een dienstbetrekking met een in Nederland
      wonende of gevestigde werkgever, dan wel de persoon die niet op het grondgebied van Nederland woont
      en die op het grondgebied van de BES-eilanden arbeid verricht uit hoofde van een dienstbetrekking
      met een op het grondgebied van Nederland wonende of gevestigde werkgever en met toepassing van het
      [Besluit uitbreiding en beperking kring verzekerden volksverzekeringen 1999][ref1] verzekerd is ingevolge de
      [Wet langdurige zorg][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0010182
      [ref2]: https://wetten.overheid.nl/BWBR0035917
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0010182
      - id: ref2
        bwb_id: BWBR0035917
  - number: 4.2.f
    text: de Rijksvertegenwoordiger, diens echtgenoot en andere inwonende gezinsleden;
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel4
  - number: 4.2.g
    text: |-
      de persoon die niet beschikt over een verblijfsvergunning voor bepaalde tijd of voor onbepaalde tijd op grond
      van de [Wet toelating en uitzetting BES][ref1] dan wel die niet op grond van een Verklaring van Rechtswege op het
      grondgebied van de BES verblijft.


      [ref1]: https://wetten.overheid.nl/BWBR0028571
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0028571
  - number: '4.3'
    text: |-
      Bij ministeriële regeling kan, zo nodig in afwijking van het eerste en tweede lid, verdere uitbreiding dan wel
      beperking worden gegeven aan de kring van verzekerden.
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel4
  - number: '4.4'
    text: |-
      De echtgenoot en overige inwonende gezinsleden die op grond van het eerste lid, onderdeel g, verzekerd zijn,
      blijven verzekerd gedurende de periode van een jaar, te rekenen vanaf de datum van overlijden van de persoon,
      bedoeld in het eerste lid, onderdeel f, tenzij zij:
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel4
  - number: 4.4.1°
    text: in Nederland arbeid verrichten;
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel4
  - number: 4.4.2°
    text: een Nederlandse sociale verzekeringsuitkering ontvangen.
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel4
  - number: '4.5'
    text: |-
      Niet verzekerd is voorts de persoon die verzekerd is ingevolge de [Wet langdurige zorg][ref1] en
      verzekeringsplichtig is ingevolge de [Zorgverzekeringswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0035917
      [ref2]: https://wetten.overheid.nl/BWBR0018450
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0035917
      - id: ref2
        bwb_id: BWBR0018450
  - number: '4.6'
    text: |-
      Het tweede lid is niet van toepassing op een ingezetene van de BES-eilanden die niet verzekerd is ingevolge de
      [Wet langdurige zorg][ref1] en niet verzekeringsplichtig is ingevolge de [Zorgverzekeringswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0035917
      [ref2]: https://wetten.overheid.nl/BWBR0018450
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0035917
      - id: ref2
        bwb_id: BWBR0018450
  - number: '4.7'
    text: |-
      Het tweede lid, onderdeel c en f, is niet van toepassing op de echtgenoot die of het anderszins inwonende gezinslid
      dat op het grondgebied van de BES arbeid verricht.
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel4
  - number: '4.8'
    text: |-
      In afwijking van het eerste lid, onderdeel c, en voor zover al niet begrepen in de categorie van personen bedoeld
      in het tweede lid, onderdeel e, is niet verzekerd de persoon die buiten het grondgebied van de BES-eilanden woont,
      niet aan de loonbelasting BES is onderworpen en die tijdelijk op het grondgebied van de BES-eilanden werkzaam is,
      indien bij de aanvang van zijn werkzaamheden kan worden aangenomen, dat deze niet langer dan drie maanden, gerekend
      vanaf de aanvang van die werkzaamheden, op het grondgebied van de BES zullen worden verricht.
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel4
  - number: '5.1'
    text: |-
      De rechten en plichten ingevolge dit besluit zijn van rechtswege opgeschort gedurende de periode waarover Onze
      Minister van Justitie in het kader van de uitvoering van een rechterlijke uitspraak verantwoordelijk is voor de
      verstrekking van geneeskundige zorg aan een verzekerde.
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel5
  - number: '5.2'
    text: |-
      De verzekerde die het betreft meldt Onze Minister de dag waarop de periode, bedoeld in het eerste lid, aanvangt
      en eindigt.
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel5
  - number: '6.1'
    text: 'De verzekerden hebben ter voorziening in de geneeskundige verzorging aanspraak op:'
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel6
  - number: 6.1.a
    text: huisartsenzorg;
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel6
  - number: 6.1.b
    text: medisch-specialistische zorg;
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel6
  - number: 6.1.c
    text: ziekenhuiszorg;
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel6
  - number: 6.1.d
    text: paramedische zorg;
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel6
  - number: 6.1.e
    text: tandheelkundige zorg;
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel6
  - number: 6.1.f
    text: farmaceutische zorg;
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel6
  - number: 6.1.g
    text: hulpmiddelenzorg;
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel6
  - number: 6.1.h
    text: verloskundige zorg;
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel6
  - number: 6.1.i
    text: kraamzorg;
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel6
  - number: 6.1.j
    text: ziekenvervoer;
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel6
  - number: 6.1.k
    text: |-
      langdurige zorg in verband met ouderdom, een ziekte of handicap, al dan niet gepaard gaande met verblijf in een
      instelling;
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel6
  - number: 6.1.l
    text: onderzoek bij pasgeborenen naar bij ministeriële regeling aan te wijzen ernstige zeldzame ziekten.
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel6
  - number: '6.2'
    text: |-
      Bij ministeriële regeling kunnen de inhoud en omvang van de aanspraken, bedoeld in het eerste lid, nader worden
      geregeld en kunnen aan het tot gelding brengen van de aanspraken voorwaarden worden gesteld.
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel6
  - number: '6.3'
    text: |-
      Bij ministeriële regeling kan worden bepaald in welke gevallen de nabestaanden van een verzekerde recht kunnen doen
      gelden op een vergoeding van repatriëringskosten van een overleden verzekerde.
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel6
  - number: '6.4'
    text: |-
      Bij ministeriële regeling kan als voorwaarde voor het tot gelding brengen van aanspraken worden bepaald dat
      de verzekerde een bijdrage in de kosten betaalt. De bijdrage kan verschillen naar gelang de groep waartoe een
      verzekerde behoort. Voor de zorg, bedoeld in het eerste lid, onderdeel k, kan de bijdrage mede afhankelijk worden
      gesteld van het inkomen van de verzekerde en diens echtgenoot.
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel6
  - number: '6.5'
    text: Onze Minister zorgt dat de verzekerden hun aanspraken tot gelding kunnen brengen.
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel6
  - number: '6.6'
    text: |-
      De aanspraak op zorg of op vervoer kan slechts tot gelding worden gebracht voor zover de verzekerde, gelet op
      zijn behoefte en uit een oogpunt van doelmatige zorgverlening, redelijkerwijs daarop naar aard, inhoud en omvang
      is aangewezen.
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel6
  - number: '6.7'
    text: |-
      De aanspraken op zorg of op vervoer op de onderscheiden eilanden kunnen in beginsel slechts geldend worden gemaakt
      voor zover de zorg in redelijkheid ook geboden kan worden.
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel6
  - number: '7'
    text: |-
      Onze Minister beslist, na advies van het Zorgverzekeringskantoor BES, of de wijzigingen van de aard,
      inhoud en omvang van de prestaties die ingevolge een daartoe strekkend advies van het Zorginstituut worden
      aangebracht in het wettelijk aansprakenpakket, bedoeld in [artikel 3.1.1 van de Wet langdurige zorg][ref1] en
      [artikel 11 van de Zorgverzekeringswet][ref2], worden doorgevoerd in de aanspraken bedoeld in [artikel 6][ref3] van
      dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0035917#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0029404#Artikel6
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0035917
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0018450
        artikel: '11'
      - id: ref3
        bwb_id: BWBR0029404
        artikel: '6'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '8.1'
    text: |-
      Onze Minister sluit met op het grondgebied van de BES-eilanden gevestigde en naar het oordeel van Onze Minister
      daarvoor in aanmerking komende zorgaanbieders, overeenkomsten ter verwezenlijking van de aanspraken van
      verzekerden, neergelegd in [artikel 6][ref1], in zodanige omvang dat Onze Minister in staat is zijn verplichtingen
      jegens de verzekerden naar behoren na te komen.


      [ref1]: https://wetten.overheid.nl/BWBR0029404#Artikel6
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0029404
        artikel: '6'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '8.2'
    text: Onze Minister kan overeenkomsten sluiten met buiten de BES-eilanden gevestigde zorgaanbieders.
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel8
  - number: '8.3'
    text: 'Een overeenkomst wordt schriftelijk aangegaan en bevat ten minste bepalingen over:'
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel8
  - number: 8.3.a
    text: |-
      de datum waarop de overeenkomst aanvangt, de duur van de overeenkomst en de tussentijdse beëindiging van de
      overeenkomst;
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel8
  - number: 8.3.b
    text: de aard, de kwaliteit, de doelmatigheid en de omvang van de te verlenen zorg;
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel8
  - number: 8.3.c
    text: de prijs van de te verlenen zorg;
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel8
  - number: 8.3.d
    text: de wijze waarop de verzekerden van informatie worden voorzien;
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel8
  - number: 8.3.e
    text: |-
      de controle op de naleving van de overeenkomst, waaronder begrepen de controle op de te verlenen dan wel verleende
      zorg en op de juistheid van de daarvoor in rekening gebrachte bedragen;
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel8
  - number: 8.3.f
    text: de administratieve voorwaarden die partijen bij de uitvoering van de overeenkomst in acht zullen nemen.
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel8
  - number: '8.4'
    text: Bij ministeriële regeling kunnen nadere regels over de inhoud van de overeenkomst worden gesteld.
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel8
  - number: '8.5'
    text: |-
      Bij ministeriële regeling kunnen ter zake van de tariefstelling in het kader van de te sluiten overeenkomsten en de
      vergoedingen die aan de zorgaanbieders worden betaald, nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel8
  - number: '8.6'
    text: |-
      Indien Onze Minister in de onmogelijkheid verkeert om op voor hem aanvaardbare voorwaarden met een genoegzaam
      aantal personen of instellingen ter zake van een of meer vormen van zorg overeenkomsten als bedoeld in dit artikel
      te sluiten, kan bij ministeriële regeling worden bepaald dat de op grond van dit besluit verzekerde personen
      tijdelijk in plaats van aanspraak op deze zorg, aanspraak hebben op vergoeding van de aan deze zorg verbonden
      kosten. Indien voor de desbetreffende zorg een bedrag is vastgesteld op basis van [artikel 17][ref1], worden de in
      rekening gebrachte kosten vergoed, tot ten hoogste dat bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0029404#Artikel17
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0029404
        artikel: '17'
        hoofdstuk: '5'
  - number: '8.7'
    text: |-
      Bij ministeriële regeling kan tevens worden bepaald onder welke voorwaarden en tot welk bedrag aanspraak op
      vergoeding bestaat en kunnen nadere regels voor de aanspraak op een vergoeding worden gesteld.
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel8
  - number: '9'
    text: |-
      Elke bepaling in de in [artikel 8, eerste lid][ref1], bedoelde overeenkomsten, die in strijd is met dit besluit of
      de daarop berustende bepalingen is nietig.


      [ref1]: https://wetten.overheid.nl/BWBR0029404#Artikel8
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0029404
        artikel: '8'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '10.1'
    text: |-
      Onze Minister verifieert de verzekeringsgerechtigdheid van een persoon die aanspraak maakt op verstrekkingen door
      raadpleging van de basisadministratie BES.
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel10
  - number: '10.2'
    text: |-
      De verzekerde die zijn aanspraak op een verstrekking geldend wil maken, wendt zich voor het verkrijgen van de
      aanspraak tot een zorgaanbieder met wie een overeenkomst als bedoeld in [artikel 8, eerste en tweede lid][ref1], is
      gesloten en overlegt daarbij zijn identificatiedocument.


      [ref1]: https://wetten.overheid.nl/BWBR0029404#Artikel8
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0029404
        artikel: '8'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '10.3'
    text: De verzekerde wordt de keuze gelaten uit de in het tweede lid bedoelde zorgaanbieders.
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel10
  - number: '10.4'
    text: |-
      In afwijking van het tweede lid kan Onze Minister een verzekerde die een aanspraak op een verstrekking geldend wil
      maken toestemming verlenen zich voor de onder die verstrekking vallende zorg tot een niet door hem gecontracteerde
      zorgaanbieder te wenden. In dit geval heeft de verzekerde in plaats van aanspraak op de verstrekking, aanspraak op
      gehele of gedeeltelijke vergoeding van de voor deze zorg gemaakte kosten.
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel10
  - number: '10.5'
    text: |-
      De verzekerde is verplicht Onze Minister te informeren over iedere omstandigheid of wijziging daarin die van
      invloed kan zijn op de uitvoering van dit besluit.
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel10
  - number: '10.6'
    text: 'Bij ministeriële regeling:'
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel10
  - number: 10.6.a
    text: |-
      wordt bepaald in welke gevallen en onder welke voorwaarden de verzekerde voor het verkrijgen van een aanspraak op
      vergoeding als bedoeld in het vierde lid, geen toestemming van Onze Minister behoeft;
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel10
  - number: 10.6.b
    text: |-
      wordt de hoogte van de vergoeding bepaald, waarbij deze voor verschillende gevallen verschillend kan worden
      vastgesteld;
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel10
  - number: 10.6.c
    text: kunnen voorwaarden worden gesteld waaraan de verzekerde moet voldoen, wil toestemming kunnen worden verleend;
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel10
  - number: 10.6.d
    text: kan worden bepaald in welke gevallen geen toestemming wordt verleend.
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel10
  - number: '11.1'
    text: De verzekerde is een inkomensafhankelijke premie verschuldigd.
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel11
  - number: '11.2'
    text: |-
      De premie ten behoeve van dit besluit wordt geheven over het inkomen, met overeenkomstige toepassing van
      de [hoofdstukken V][ref1], [VI][ref2], [VII][ref3] en [IX van de Wet inkomstenbelasting BES][ref4], de
      [hoofdstukken III][ref5] en [VI van de Wet loonbelasting BES][ref6] en de [hoofdstukken I][ref7], [VII][ref8] en
      [VIII van de Belastingwet BES][ref9].


      [ref1]: https://wetten.overheid.nl/BWBR0029281#HoofdstukV
      [ref2]: https://wetten.overheid.nl/BWBR0029281#HoofdstukVI
      [ref3]: https://wetten.overheid.nl/BWBR0029281#HoofdstukVII
      [ref4]: https://wetten.overheid.nl/BWBR0029281#HoofdstukIX
      [ref5]: https://wetten.overheid.nl/BWBR0029283#HoofdstukIII
      [ref6]: https://wetten.overheid.nl/BWBR0029283#HoofdstukVI
      [ref7]: https://wetten.overheid.nl/BWBR0029244#HoofdstukI
      [ref8]: https://wetten.overheid.nl/BWBR0029244#HoofdstukVII
      [ref9]: https://wetten.overheid.nl/BWBR0029244#HoofdstukVIII
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0029281
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0029281
        hoofdstuk: VI
      - id: ref3
        bwb_id: BWBR0029281
        hoofdstuk: VII
      - id: ref4
        bwb_id: BWBR0029281
        hoofdstuk: IX
      - id: ref5
        bwb_id: BWBR0029283
        hoofdstuk: III
      - id: ref6
        bwb_id: BWBR0029283
        hoofdstuk: VI
      - id: ref7
        bwb_id: BWBR0029244
        hoofdstuk: I
      - id: ref8
        bwb_id: BWBR0029244
        hoofdstuk: VII
      - id: ref9
        bwb_id: BWBR0029244
        hoofdstuk: VIII
  - number: '11.3'
    text: |-
      Indien het inkomen meer bedraagt dan het in [artikel 24A, zevende lid, van de Wet inkomstenbelasting BES][ref1]
      genoemde bedrag, wordt over dat meerdere geen premie geheven.


      [ref1]: https://wetten.overheid.nl/BWBR0029281#Artikel24a
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0029281
        artikel: 24a
  - number: '11.4'
    text: |-
      Het percentage van de premie, bedoeld in het eerste lid, wordt met ingang van elk kalenderjaar voor de periode van
      één jaar vastgesteld door Onze Minister in overeenstemming met Onze Minister van Financiën.
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel11
  - number: '12.1'
    text: |-
      Ter zake van de kosten verbonden aan de geneeskundige verzorging, bedoeld in
      [artikel 6, eerste lid, onderdelen a tot en met j][ref1], van dit besluit is de werkgever een premie verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0029404#Artikel6
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0029404
        artikel: '6'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '12.2'
    text: |-
      De door de werkgever verschuldigde premie ten behoeve van dit besluit wordt door de rijksbelastingdienst
      geheven over het inkomen, met overeenkomstige toepassing van de [hoofdstukken II][ref1] en
      [III van de Wet loonbelasting BES][ref2] en de [hoofdstukken I][ref3] en [VIII van de Belastingwet BES][ref4], met
      dien verstande dat in plaats van «inhoudingsplichtige» telkens wordt gelezen «werkgever».


      [ref1]: https://wetten.overheid.nl/BWBR0029283#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0029283#HoofdstukIII
      [ref3]: https://wetten.overheid.nl/BWBR0029244#HoofdstukI
      [ref4]: https://wetten.overheid.nl/BWBR0029244#HoofdstukVIII
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0029283
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0029283
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0029244
        hoofdstuk: I
      - id: ref4
        bwb_id: BWBR0029244
        hoofdstuk: VIII
  - number: '12.3'
    text: |-
      Het premiepercentage, bedoeld in het tweede lid, wordt met ingang van elk kalenderjaar voor de periode van één jaar
      vastgesteld door Onze Minister in overeenstemming met Onze Minister van Financiën.
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel12
  - number: '12.4'
    text: De premie wordt door de inspecteur geheven door middel van afdracht op aangifte.
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel12
  - number: '13'
    text: |-
      De premies, bedoeld in [artikel 11, eerste lid][ref1], en in [artikel 12, eerste lid][ref2], komen ten gunste van
      het Rijk.


      [ref1]: https://wetten.overheid.nl/BWBR0029404#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0029404#Artikel12
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0029404
        artikel: '11'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0029404
        artikel: '12'
        hoofdstuk: '4'
  - number: '14'
    text: |-
      De kosten van de op grond van dit besluit door Onze Minister te verlenen verstrekkingen en vergoedingen, alsmede de
      aan de uitvoering van dit besluit verbonden kosten, komen ten laste van het Rijk.
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel14
  - number: '15.1'
    text: Onze Minister maakt bij de uitvoering van dit besluit gebruik van de diensten van het Zorgverzekeringskantoor BES.
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel15
  - number: '15.2'
    text: |-
      Het Zorgverzekeringskantoor BES is voor de uitoefening van zijn diensten die hem in het kader van dit besluit
      worden opgedragen uitsluitend verantwoording verschuldigd aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel15
  - number: '15.3'
    text: |-
      Onze Minister wordt in en buiten rechte, voor aangelegenheden de uitvoering van het besluit betreffende,
      vertegenwoordigd door het hoofd Zorgverzekeringskantoor BES.
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel15
  - number: '16.1'
    text: 'Onze Minister:'
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel16
  - number: 16.1.a
    text: zorgt voor een rechtmatige en doelmatige uitvoering van dit besluit;
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel16
  - number: 16.1.b
    text: |-
      zorgt, dat de gegevens in de administratie van het Zorgverzekeringskantoor BES bij voortduring juist, actueel en
      volledig zijn;
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel16
  - number: 16.1.c
    text: |-
      voorziet zich ter uitvoering van zijn controletaak van de gegevens die voor een doeltreffende controle nodig zijn,
      rekening houdend met de bescherming van de persoonlijke levenssfeer en het medisch beroepsgeheim;
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel16
  - number: 16.1.d
    text: |-
      voorziet in een systematische voorlichting aan verzekerden en werkgevers over de op hen rustende verplichting om
      aan hem tijdig alle inlichtingen te verstrekken die hij nodig heeft voor een goede uitvoering van de verzekering;
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel16
  - number: 16.1.e
    text: |-
      voert de administratie van verzekerden en van de inkomsten en de uitgaven in verband met de uitvoering van dit
      besluit;
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel16
  - number: 16.1.f
    text: voert de administratie van de inkomsten en de uitgaven in verband met de beheerskosten van het zorgkantoor BES;
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel16
  - number: 16.1.g
    text: zorgt voor de uitvoering van een neonatale hielprik.
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel16
  - number: '16.2'
    text: |-
      Voor zover de beoordeling van de voor de controle verzamelde gegevens bedoeld in het eerste lid, mede kennis
      vereist van gegevens bij andere lichamen, oefent Onze Minister in samenwerking met de desbetreffende lichamen die
      controle uit met gebruikmaking van de bij hen gezamenlijk voorhanden zijnde gegevens.
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel16
  - number: '16.3'
    text: Onze Minister stelt jaarlijks een financieel verslag op en zendt dat aan beide kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel16
  - number: '17.1'
    text: |-
      Onze Minister kan, per eiland, de aan de zorgaanbieders te vergoeden bedragen vaststellen. Deze vergoedingsbedragen
      hoeven niet aan elkaar gelijk te zijn.
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel17
  - number: '17.2'
    text: |-
      Onze Minister oordeelt periodiek, maar in elk geval elke drie jaar, of de in het eerste lid bedoelde bedragen
      aanpassing behoeven.
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel17
  - number: '18'
    text: |-
      Onze Minister kan nadere regels stellen met betrekking tot de ontwikkeling van de zorg en de zorgverlening in het
      kader van dit besluit.
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel18
  - number: '19.1'
    text: |-
      Onze Minister gebruikt het identificatienummer van de verzekerde met het doel te waarborgen dat de in het kader van
      de verzekering van zorg te verwerken persoonsgegevens op die verzekerde betrekking hebben.
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel19
  - number: '19.2'
    text: |-
      Bij gegevensuitwisseling tussen Onze Minister en instellingen, alsmede tussen Onze Minister en de in de
      [artikelen 20][ref1] en [21][ref2] genoemde personen en instanties wordt, voor zover die personen en instanties tot
      gebruik van dat nummer bevoegd zijn, het identificatienummer gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0029404#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0029404#Artikel21
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0029404
        artikel: '20'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0029404
        artikel: '21'
        hoofdstuk: '6'
  - number: '19.3'
    text: 'Bij ministeriële regeling kunnen nadere regels worden gesteld over:'
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel19
  - number: 19.3.a
    text: de beveiligingseisen waaraan de gegevensverwerking, bedoeld in het eerste en het tweede lid, moet voldoen;
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel19
  - number: 19.3.b
    text: |-
      de bij de gegevensuitwisseling, bedoeld in het eerste en tweede lid, te verwerken feiten of gegevens met betrekking
      tot verzekerden van wie het vaststellen van het identificatienummer onmogelijk blijkt of een onevenredige
      inspanning kost. Daarbij kan worden bepaald aan welke beveiligingseisen de verwerking van die feiten of gegevens
      voldoet.
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel19
  - number: '20.1'
    text: |-
      De zorgaanbieder raadpleegt de verzekerdenadministratie van het Zorgverzekeringskantoor BES met het uitsluitende
      doel te verifiëren of sprake is van een verzekerde in de zin van dit besluit.
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel20
  - number: '20.2'
    text: |-
      Een zorgaanbieder die aan een verzekerde zorg of andere diensten als bedoeld in [artikel 6][ref1] heeft
      verleend, en die de kosten daarvan krachtens een door hem met Onze Minister gesloten overeenkomst rechtstreeks
      bij Onze Minister in rekening brengt, verstrekt Onze Minister of een door hem aan te wijzen persoon, kosteloos
      de persoonsgegevens van de verzekerde, waaronder persoonsgegevens betreffende de gezondheid als bedoeld in de
      [Wet bescherming persoonsgegevens BES][ref2], die noodzakelijk zijn voor de uitvoering van dit besluit, dan wel
      stelt Onze Minister deze gegevens voor dit doel voor inzage of het nemen van afschrift ter beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0029404#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0028067
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0029404
        artikel: '6'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0028067
  - number: '20.3'
    text: |-
      Personen werkzaam ten behoeve van een zorgaanbieder als bedoeld in het tweede lid, verstrekken die zorgaanbieder
      de persoonsgegevens die hij nodig heeft om te kunnen voldoen aan zijn verplichtingen als bedoeld in het eerste en
      tweede lid.
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel20
  - number: '20.4'
    text: |-
      Personen werkzaam bij het Zorgverzekeringskantoor BES, of bij een door Onze Minister aangewezen persoon als bedoeld
      in het tweede lid, voor wie niet reeds uit hoofde van ambt of beroep een geheimhoudingplicht geldt, zijn verplicht
      tot geheimhouding van de gegevens, bedoeld in het eerste of tweede lid, behoudens voor zover enig wettelijk
      voorschrift hen mededeling toestaat.
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel20
  - number: '20.5'
    text: 'Bij ministeriële regeling kan worden bepaald:'
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel20
  - number: 20.5.a
    text: tot welke gegevens de verplichting, bedoeld in het tweede lid, zich in ieder geval uitstrekt;
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel20
  - number: 20.5.b
    text: op welke wijze gegevens, bedoeld in het tweede lid, worden verwerkt;
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel20
  - number: 20.5.c
    text: volgens welke technische standaarden gegevensverwerking plaatsvindt;
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel20
  - number: 20.5.d
    text: aan welke beveiligingseisen gegevensverwerking voldoet.
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel20
  - number: '21.1'
    text: |-
      Een ieder verstrekt op verzoek aan Onze Minister, het Zorgverzekeringskantoor BES, de rijksbelastingdienst, of aan
      een daartoe door of vanwege een van deze personen en instanties aangewezen persoon, kosteloos alle inlichtingen
      en gegevens, waaronder persoonsgegevens als bedoeld in de [Wet bescherming persoonsgegevens BES][ref1], die
      noodzakelijk zijn voor de uitvoering van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0028067
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0028067
  - number: '21.2'
    text: |-
      De in het eerste lid bedoelde gegevens en inlichtingen worden op verzoek verstrekt in schriftelijke vorm of in een
      andere vorm die redelijkerwijs kan worden verlangd, binnen een termijn die schriftelijk wordt gesteld bij het in
      het eerste lid bedoelde verzoek.
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel21
  - number: '21.3'
    text: |-
      Een ieder geeft op verzoek van een rechtspersoon als bedoeld in het eerste lid, inzage in alle bescheiden en
      andere gegevensdragers, stelt deze op verzoek ter beschikking voor het nemen van afschrift en verleent de ter zake
      verlangde medewerking, voor zover dit noodzakelijk is voor de uitvoering van dit besluit.
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel21
  - number: '21.4'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot het eerste, tweede en derde lid.
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel21
  - number: '22.1'
    text: |-
      De in [artikel 21, eerste lid][ref1], bedoelde instanties zijn bevoegd uit eigen beweging en verplicht op verzoek
      binnen een bij dat verzoek genoemde termijn, uit de onder hun verantwoordelijkheid gevoerde administratie, aan
      elkaar, aan een daartoe door of vanwege hen aangewezen persoon of aan een door Onze Minister aangewezen persoon,
      kosteloos, de gegevens, waaronder persoonsgegevens als bedoeld in de [Wet bescherming persoonsgegevens BES][ref2],
      te verstrekken die noodzakelijk zijn voor de uitvoering van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0029404#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0028067
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0029404
        artikel: '21'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0028067
  - number: '22.2'
    text: |-
      Alle ambtenaren tot afgifte van uittreksels uit registers van burgerlijke stand bevoegd, zijn verplicht aan een in
      [artikel 21, eerste lid][ref1], bedoelde instantie de door deze gevraagde uittreksels uit de registers kosteloos
      toe te zenden.


      [ref1]: https://wetten.overheid.nl/BWBR0029404#Artikel21
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0029404
        artikel: '21'
        hoofdstuk: '6'
  - number: '22.3'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld over de verstrekking van gegevens door de
      rijksbelastingdienst aan Onze Minister of aan het hoofd Zorgverzekeringskantoor BES.
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel22
  - number: '23.1'
    text: |-
      Onze Minister geeft aan de belanghebbende die bezwaar heeft tegen een beslissing betreffende het verlenen van zorg
      en het vaststellen van een bijdrage als bedoeld in [artikel 6][ref1], op diens verzoek schriftelijk kennis van
      de beslissing.


      [ref1]: https://wetten.overheid.nl/BWBR0029404#Artikel6
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0029404
        artikel: '6'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '23.2'
    text: Een verzoek als bedoeld in het eerste lid wordt ingediend bij het Zorgverzekeringskantoor BES.
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel23
  - number: '23.3'
    text: |-
      Een kennisgeving als bedoeld in het eerste lid vermeldt de dagtekening van de beslissing, de gronden waarop deze
      berust, alsmede de rechtsmiddelen die tegen de beslissing openstaan.
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel23
  - number: '24'
    text: |-
      Tegen een besluit van Onze Minister als bedoeld in [artikel 23][ref1], staat voor belanghebbende binnen zes weken
      na de dag waarop deze is gegeven, beroep open bij het Gerecht in eerste aanleg van Bonaire, Sint Eustatius en Saba
      en hoger beroep bij het Gemeenschappelijk Hof van Justitie van Aruba, Curaçao, Sint Maarten en van Bonaire, Sint
      Eustatius en Saba.


      [ref1]: https://wetten.overheid.nl/BWBR0029404#Artikel23
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0029404
        artikel: '23'
        hoofdstuk: '7'
  - number: '25'
    text: |-
      Bij de vaststelling van de schadevergoeding, waarop de verzekerde naar burgerlijk recht aanspraak kan maken ter
      zake van een feit, dat aanleiding geeft tot het verlenen van zorg, bedoeld in [artikel 6][ref1] van dit besluit,
      houdt de rechter rekening met de aanspraken, die de verzekerde krachtens dit besluit heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0029404#Artikel6
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0029404
        artikel: '6'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '26.1'
    text: |-
      Onze Minister heeft voor de krachtens dit besluit gemaakte kosten verhaal op degene, die in verband met het in
      [artikel 25][ref1] bedoelde feit jegens de verzekerde naar burgerlijk recht tot schadevergoeding is verplicht, doch
      ten hoogste tot het bedrag, waarvoor deze bij het ontbreken van de aanspraken krachtens dit besluit naar burgerlijk
      recht aansprakelijk zou zijn, verminderd met een bedrag, gelijk aan dat van de schadevergoeding tot betaling
      waarvan de aansprakelijke persoon jegens de verzekerde naar burgerlijk recht is gehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0029404#Artikel25
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0029404
        artikel: '25'
        hoofdstuk: '8'
  - number: '26.2'
    text: |-
      Voor zover de geldswaarde van de in het eerste lid bedoelde verleende zorg niet kan worden vastgesteld, wordt deze
      bepaald op een geschat bedrag. Bij ministeriële regeling kunnen hieromtrent nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel26
  - number: '27'
    text: |-
      Indien de verzekerde in dienstbetrekking werkzaam is, geldt [artikel 26][ref1], ten aanzien van de naar burgerlijk
      recht tot schadevergoeding verplichte werkgever van de verzekerde, onderscheidenlijk ten aanzien van de naar
      burgerlijk recht tot schadevergoeding verplichte persoon, die in dienstbetrekking staat tot dezelfde werkgever
      als de verzekerde jegens wie naar burgerlijk recht verplichting tot schadevergoeding bestaat, slechts indien
      het feit als genoemd in [artikel 25][ref2] is te wijten aan opzet of bewuste roekeloosheid van die werkgever
      onderscheidenlijk persoon.


      [ref1]: https://wetten.overheid.nl/BWBR0029404#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0029404#Artikel25
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0029404
        artikel: '26'
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0029404
        artikel: '25'
        hoofdstuk: '8'
  - number: '28.1'
    text: |-
      Onze Minister kan van hem, die, zonder daartoe gerechtigd te zijn, opzettelijk aanspraken als verzekerde bij hem
      doet gelden onderscheidenlijk deed gelden, alsmede van hem, die daaraan opzettelijk zijn medewerking verleent
      onderscheidenlijk heeft verleend, geheel of gedeeltelijk het bedrag vorderen van de verstrekkingen die hem te veel
      of ten onrechte zijn verleend. Voor zover de geldswaarde van de in de eerste volzin bedoelde zorg niet vaststaat,
      kan deze worden vastgesteld op een geschat bedrag.
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel28
  - number: '28.2'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld betreffende de in het eerste lid bedoelde
      terugvordering.
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel28
  - number: '29'
    text: |-
      Indien een verzekerde op de datum van inwerkingtreding van dit besluit of op de datum waarop dit besluit op hem
      van toepassing wordt is gebonden aan een overeenkomst met betrekking tot de verzekering van geneeskundige zorg
      of de kosten daarvan en binnen vier maanden na dit tijdstip ten genoegen van Onze Minister aantoont dat hij deze
      overeenkomst niet met ingang van dat tijdstip rechtsgeldig kan beëindigen, is dit besluit op hem van toepassing
      vanaf de eerste datum met ingang waarvan de overeenkomst had kunnen worden beëindigd doch ten laatste twee jaar
      na inwerkingtreding van dit besluit, respectievelijk de datum waarop dit besluit op hem van toepassing wordt. Het
      Zorgverzekeringskantoor BES geeft op verzoek van betrokkene een verklaring af dat en tot en met welke datum de
      betrokkene niet verzekerd is ingevolge dit besluit.
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel29
  - number: '30'
    text: |-
      Voor zover dit besluit niet anders bepaalt wordt hetgeen tot zijn uitvoering nodig is bij ministeriële regeling
      geregeld.
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel30
  - number: '32'
    text: |-
      Dit besluit treedt in werking met ingang van 1 januari 2011. Indien het Staatsblad waarin dit besluit wordt
      geplaatst, wordt uitgegeven na 31 december 2010, treedt het in werking met ingang van de dag na de datum van
      uitgifte van het Staatsblad waarin het wordt geplaatst, en werkt het terug tot en met 1 januari 2011.
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel32
  - number: '33'
    text: 'Dit besluit wordt aangehaald als: Besluit zorgverzekering BES.'
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel33
