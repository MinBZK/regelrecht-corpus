  - number: 1.k
    text: '*BES-eilanden:* de openbare lichamen Bonaire, Sint Eustatius of Saba;'
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel1
  - number: 1.l
    text: '*BZV:* Bureau Ziektekostenvoorzieningen;'
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel1
  - number: 1.m
    text: '*SVB:* Sociale Verzekeringsbank Nederlandse Antillen;'
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel1
  - number: 1.n
    text: |-
      *Zorginstituut:* Zorginstituut Nederland, genoemd in [artikel 58, eerste lid, van de Zorgverzekeringswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel58
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel1
