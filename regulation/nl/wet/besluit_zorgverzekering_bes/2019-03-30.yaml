        hoofdstuk: III
  - number: 1.h
    text: |-
      *inkomen:* de belastbare som, bedoeld in [artikel 24, eerste lid, van de Wet inkomstenbelasting BES][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0029281#Artikel24
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel1
    references:
