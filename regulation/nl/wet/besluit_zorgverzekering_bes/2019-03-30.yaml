    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel1
  - number: 1.p
    text: |-
      *basisadministratie BES:* de basisadministratie, bedoeld in de [Wet basisadministraties persoonsgegevens BES][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0028208
    url: https://wetten.overheid.nl/BWBR0029404/2019-03-30#Artikel1
    references:
      - id: ref1
