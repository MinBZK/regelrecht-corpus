        artikel: '6'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 1.r
    text: |-
      *Nederlandse sociale verzekeringsuitkering:* uitkering op grond van de [Werkloosheidswet][ref1],
      de [Ziektewet][ref2], [hoofdstuk 3, afdeling 2, van de Wet arbeid en zorg][ref3], de
      [Wet op de arbeidsongeschiktheidsverzekering][ref4], de [Wet werk en inkomen naar arbeidsvermogen][ref5],
      de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref6], de [Algemene Ouderdomswet][ref7],
      de [Algemene nabestaandenwet][ref8], de [Wet inkomensvoorziening oudere werklozen][ref9] en de
      [Wet werk en arbeidsondersteuning jonggehandicapten][ref10].


