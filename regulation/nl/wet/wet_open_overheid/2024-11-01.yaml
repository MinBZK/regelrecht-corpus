  - number: 3.3a.1.a
    text: de grondslag van de subsidie;
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel3.3a
  - number: 3.3a.1.b
    text: de ontvanger;
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel3.3a
  - number: 3.3a.1.c
    text: de activiteiten waarvoor de subsidie wordt verstrekt, alsmede in de beschikking opgenomen doelvoorschriften;
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel3.3a
  - number: 3.3a.1.d
    text: de hoogte van verleningen, vaststellingen en wijzigingen;
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel3.3a
  - number: 3.3a.1.e
    text: de intrekkingen;
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel3.3a
  - number: 3.3a.1.f
    text: de dagtekening van de beschikking.
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel3.3a
  - number: 3.3a.2
    text: |-
      Een bestuursorgaan kan in plaats van door openbaarmaking overeenkomstig
      [artikel 3.3, tweede lid, onderdeel k][ref1], de informatie over andere beschikkingen dan beschikkingen inzake
      subsidies openbaar maken in een voor personen elektronisch raadpleegbaar overzicht, waarbij, voor zover de
      informatie in de beschikking is opgenomen en de [artikelen 5.1, eerste, tweede en vijfde lid][ref2], en [5.2][ref3]
      niet aan openbaarmaking in de weg staan, in ieder geval openbaar wordt gemaakt:


      [ref1]: https://wetten.overheid.nl/BWBR0045754#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0045754#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0045754#Artikel5
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel3.3a
    references:
      - id: ref1
        bwb_id: BWBR0045754
        artikel: '3'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0045754
        artikel: '5'
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0045754
        artikel: '5'
        hoofdstuk: '5'
  - number: 3.3a.2.a
    text: de grondslag van de beschikking;
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel3.3a
  - number: 3.3a.2.b
    text: het rechtsgevolg van de beschikking, inclusief in de beschikking opgenomen voorschriften;
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel3.3a
  - number: 3.3a.2.c
    text: de duur van de beschikking;
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel3.3a
  - number: 3.3a.2.d
    text: de geadresseerde, voor zover de bescherming van de persoonlijke levenssfeer hieraan niet in de weg staat;
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel3.3a
  - number: 3.3a.2.e
    text: de dagtekening van de beschikking.
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel3.3a
  - number: 3.3a.3
    text: |-
      Een bestuursorgaan kan in plaats van door openbaarmaking overeenkomstig
      [artikel 3.3, tweede lid, onderdeel l][ref1], de informatie over schriftelijke oordelen in klachtprocedures
      openbaar maken in een voor personen elektronisch raadpleegbaar overzicht, waarbij, voor zover de informatie
      in het oordeel is opgenomen en de [artikelen 5.1, eerste, tweede en vijfde lid][ref2], en [5.2][ref3] niet aan
      openbaarmaking in de weg staan, in ieder geval openbaar wordt gemaakt:


      [ref1]: https://wetten.overheid.nl/BWBR0045754#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0045754#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0045754#Artikel5
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel3.3a
    references:
      - id: ref1
        bwb_id: BWBR0045754
        artikel: '3'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0045754
        artikel: '5'
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0045754
        artikel: '5'
        hoofdstuk: '5'
  - number: 3.3a.3.a
    text: de datum van ontvangst van de klacht;
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel3.3a
  - number: 3.3a.3.b
    text: het betrokken organisatieonderdeel;
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel3.3a
  - number: 3.3a.3.c
    text: de functiebenaming van de ambtenaar over wie is geklaagd;
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel3.3a
  - number: 3.3a.3.d
    text: de omschrijving van de gedraging waartegen de klacht gericht is;
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel3.3a
  - number: 3.3a.3.e
    text: de bevindingen;
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel3.3a
  - number: 3.3a.3.f
    text: het oordeel;
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel3.3a
  - number: 3.3a.3.g
    text: de conclusies;
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel3.3a
  - number: 3.3a.3.h
    text: de dagtekening van het oordeel.
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel3.3a
  - number: 3.3a.4
    text: |-
      Een bestuursorgaan kan in het overzicht, bedoeld in het derde lid, vergelijkbare klachten betreffende een
      organisatieonderdeel gecombineerd weergeven, indien ook het oordeel en de conclusies vergelijkbaar zijn. Voor
      iedere gecombineerde weergave wordt in plaats van de informatie, bedoeld in het derde lid, onderdelen a en h, het
      aantal verzonden oordelen per maand vermeld.
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel3.3a
  - number: 3.3a.5
    text: Een overzicht als bedoeld in dit artikel wordt ten minste iedere twee weken bijgewerkt.
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel3.3a
  - number: 3.3a.6
    text: |-
      Onze Minister kan bij ministeriële regeling nadere regels stellen over de wijze waarop in dit artikel genoemde
      overzichten actief openbaar worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel3.3a
  - number: 3.3b
    text: |-
      De openbaarmaking van de in de [artikelen 3.3][ref1] en [3.3a][ref2] genoemde documenten geschiedt elektronisch op
      een algemeen toegankelijke wijze door middel van een door Onze Minister in stand gehouden digitale infrastructuur.
      Deze infrastructuur is beschikbaar voor de openbaarmaking van andere documenten.


      [ref1]: https://wetten.overheid.nl/BWBR0045754#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0045754#Artikel3
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel3.3b
    references:
      - id: ref1
        bwb_id: BWBR0045754
        artikel: '3'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0045754
        artikel: '3'
        hoofdstuk: '3'
  - number: '3.4'
    text: |-
      In afwijking van de [artikelen 5.1][ref1] en [5.2][ref2] kan een bestuursorgaan informatie uit eigen beweging
      openbaar maken, wanneer een ander zwaarwegend algemeen belang, daaronder begrepen het belang van openbare
      veiligheid, de volksgezondheid of het milieu of de bescherming van de democratische rechtsorde, dat in een concreet
      geval vergt.


      [ref1]: https://wetten.overheid.nl/BWBR0045754#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0045754#Artikel5
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0045754
        artikel: '5'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0045754
        artikel: '5'
        hoofdstuk: '5'
  - number: '3.5'
    text: |-
      Een bestuursorgaan besteedt in de jaarlijkse begroting dan wel de jaarlijkse begroting van het openbaar lichaam of
      de rechtspersoon waarvan het bestuursorgaan deel uit maakt, aandacht aan de beleidsvoornemens inzake de uitvoering
      van deze wet en doet in de jaarlijkse verantwoording verslag van de uitvoering ervan, mede in relatie tot de
      beleidsvoornemens.
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel3.5
  - number: 4.1.1
    text: |-
      Eenieder kan een verzoek om publieke informatie richten tot een bestuursorgaan of een onder verantwoordelijkheid
      van een bestuursorgaan werkzame instelling, dienst of bedrijf. In het laatste geval beslist het verantwoordelijke
      bestuursorgaan op het verzoek.
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel4.1
  - number: 4.1.2
    text: |-
      Een verzoek kan mondeling of schriftelijk worden ingediend en kan elektronisch worden verzonden op de door het
      bestuursorgaan aangegeven wijze.
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel4.1
  - number: 4.1.3
    text: De verzoeker behoeft bij zijn verzoek geen belang te stellen.
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel4.1
  - number: 4.1.4
    text: |-
      De verzoeker vermeldt bij zijn verzoek de aangelegenheid of het daarop betrekking hebbende document, waarover hij
      informatie wenst te ontvangen.
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel4.1
  - number: 4.1.5
    text: |-
      Indien een verzoek te algemeen geformuleerd is, verzoekt het bestuursorgaan binnen twee weken na ontvangst van het
      verzoek de verzoeker om het verzoek te preciseren en is het de verzoeker daarbij behulpzaam.
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel4.1
  - number: 4.1.6
    text: |-
      Het bestuursorgaan kan besluiten een verzoek niet te behandelen, indien de verzoeker niet
      meewerkt aan een verzoek tot precisering als bedoeld het vijfde lid. In afwijking van
      [artikel 4:5, vierde lid, van de Algemene wet bestuursrecht][ref1] wordt het besluit om het verzoek niet te
      behandelen aan de verzoeker bekendgemaakt binnen twee weken nadat het verzoek is gepreciseerd of nadat de daarvoor
      gestelde termijn ongebruikt is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 4.1.7
    text: |-
      Een verzoek om informatie wordt ingewilligd met inachtneming van het bepaalde in [hoofdstuk 5][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0045754#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0045754
        hoofdstuk: '5'
  - number: 4.1a
    text: Het bestuursorgaan waarborgt het behoud van de documenten waarop een door hem ontvangen verzoek betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel4.1a
  - number: 4.2.1
    text: |-
      Voor zover het verzoek betrekking heeft op informatie die berust bij een ander bestuursorgaan dan dat waarbij het
      verzoek is ingediend, wordt de verzoeker zo nodig naar dat bestuursorgaan verwezen. Is het verzoek schriftelijk
      gedaan, dan wordt het voor zover betrekking hebbend op informatie die bij een ander bestuursorgaan berust,
      onverwijld doorgezonden aan dat bestuursorgaan, onder mededeling van de doorzending aan de verzoeker.
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel4.2
  - number: 4.2.2
    text: |-
      Indien het verzoek betrekking heeft op informatie die op grond van enig wettelijk voorschrift bij het
      bestuursorgaan had behoren te berusten, vordert het bestuursorgaan de gevraagde informatie van degene die over
      de informatie beschikt. Degene die over de gevraagde informatie beschikt, verstrekt deze per omgaande aan het
      bestuursorgaan.
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel4.2
  - number: 4.2.3
    text: |-
      Voor zover een verzoek als bedoeld in [artikel 4.1, eerste lid][ref1], dat is gericht aan een der Kamers of de
      verenigde vergadering der Staten-Generaal, betrekking heeft op informatie die door de regering vertrouwelijk aan de
      Staten-Generaal is verstrekt, zendt de Kamer of de verenigde vergadering het verzoek ter behandeling door aan Onze
      Minister of Onze Ministers die deze informatie vertrouwelijk heeft of hebben verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0045754#Artikel4
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0045754
        artikel: '4'
        hoofdstuk: '4'
  - number: 4.2a
    text: |-
      Indien een voldoende gespecificeerd verzoek zodanig omvangrijk is dat niet binnen de termijn van
      [artikel 4.4, eerste lid][ref1], kan worden beslist, treedt het bestuursorgaan voor het einde van die termijn in
      overleg met de verzoeker over de prioritering van de afhandeling van het verzoek. Het bestuursorgaan verstrekt de
      gevraagde documenten zo veel mogelijk in de door de verzoeker gewenste volgorde.


      [ref1]: https://wetten.overheid.nl/BWBR0045754#Artikel4
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel4.2a
    references:
      - id: ref1
        bwb_id: BWBR0045754
        artikel: '4'
        hoofdstuk: '4'
  - number: 4.3.1
    text: De beslissing op een verzoek om informatie wordt mondeling of schriftelijk genomen.
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel4.3
  - number: 4.3.2
    text: 'Het bestuursorgaan besluit in ieder geval schriftelijk op een verzoek om informatie, indien:'
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel4.3
  - number: 4.3.2.a
    text: het schriftelijke verzoek geheel of gedeeltelijk wordt afgewezen;
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel4.3
  - number: 4.3.2.b
    text: de verzoeker bij gehele of gedeeltelijke afwijzing van het mondelinge verzoek verzoekt om een schriftelijk besluit;
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel4.3
  - number: 4.3.2.c
    text: |-
      de gevraagde informatie slechts wordt verstrekt aan de verzoeker overeenkomstig [artikel 5.5][ref1],
      [artikel 5.6][ref2] of [artikel 5.7][ref3] en aan de verstrekking voorwaarden worden verbonden; of


      [ref1]: https://wetten.overheid.nl/BWBR0045754#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0045754#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0045754#Artikel5
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel4.3
    references:
      - id: ref1
        bwb_id: BWBR0045754
        artikel: '5'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0045754
        artikel: '5'
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0045754
        artikel: '5'
        hoofdstuk: '5'
  - number: 4.3.2.d
    text: |-
      de gevraagde informatie betrekking heeft op of afkomstig is van derden, tenzij deze hebben verklaard aan een
      schriftelijk besluit geen behoefte te hebben.
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel4.3
  - number: 4.3.3
    text: |-
      Bij de afwijzing van een mondeling verzoek, wordt de verzoeker gewezen op de mogelijkheid van een schriftelijk
      besluit.
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel4.3
  - number: 4.4.1
    text: |-
      Het bestuursorgaan beslist op het verzoek om informatie zo spoedig mogelijk, doch uiterlijk binnen vier weken
      gerekend vanaf de dag na die waarop het verzoek is ontvangen.
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel4.4
  - number: 4.4.2
    text: |-
      Het bestuursorgaan kan de beslissing voor ten hoogste twee weken verdagen, indien de omvang of de gecompliceerdheid
      van de informatie een verlenging rechtvaardigt. Van de verdaging wordt voor de afloop van de eerste termijn
      schriftelijk gemotiveerd mededeling gedaan aan de verzoeker.
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel4.4
  - number: 4.4.3
    text: |-
      Onverminderd [artikel 4:15 van de Algemene wet bestuursrecht][ref1] wordt de termijn voor het geven van
      een beschikking opgeschort gerekend vanaf de dag na die waarop het bestuursorgaan de verzoeker meedeelt dat
      toepassing is gegeven aan [artikel 4:8 van de Algemene wet bestuursrecht][ref2], tot en met de dag waarop door de
      belanghebbende of belanghebbenden een zienswijze naar voren is gebracht of de daarvoor gestelde termijn ongebruikt
      is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel4.4
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 4.4.4
    text: |-
      Indien de opschorting, bedoeld in het derde lid, eindigt, doet het bestuursorgaan daarvan zo spoedig mogelijk
      mededeling aan de verzoeker, onder vermelding van de termijn binnen welke de beschikking alsnog moet worden
      gegeven.
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel4.4
  - number: 4.4.5
    text: |-
      Indien het bestuursorgaan heeft besloten informatie te verstrekken, wordt de informatie verstrekt tegelijk met de
      bekendmaking van het besluit, tenzij naar verwachting een belanghebbende bezwaar daartegen heeft, in welk geval de
      informatie wordt verstrekt twee weken nadat de beslissing is bekendgemaakt. Indien wordt verzocht om een voorlopige
      voorziening als bedoeld in [artikel 8:81 van de Algemene wet bestuursrecht][ref1], wordt de openbaarmaking
      opgeschort totdat de voorzieningenrechter uitspraak heeft gedaan of het verzoek is ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel4.4
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 4.4.6
    text: |-
      Indien het bestuursorgaan heeft besloten informatie te verstrekken die rechtstreeks betrekking heeft op een derde
      of die van een derde afkomstig is, deelt het bestuursorgaan dit besluit gelijktijdig mede aan deze derde.
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel4.4
  - number: 4.5.1
    text: |-
      Het bestuursorgaan verstrekt de informatie in de door verzoeker verzochte vorm of, indien dit redelijkerwijs niet
      gevergd kan worden, met inachtneming van het bepaalde in [artikel 2.4, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0045754#Artikel2
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel4.5
    references:
      - id: ref1
        bwb_id: BWBR0045754
        artikel: '2'
        hoofdstuk: '2'
  - number: 4.5.2
    text: |-
      Indien de informatie reeds in een voor de verzoeker gemakkelijk toegankelijke vorm voor het publiek beschikbaar is,
      wijst het bestuursorgaan de verzoeker daarop.
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel4.5
  - number: '4.6'
    text: |-
      Indien de verzoeker kennelijk een ander doel heeft dan het verkrijgen van publieke informatie of indien het verzoek
      evident geen bestuurlijke aangelegenheid betreft, kan het bestuursorgaan binnen twee weken na ontvangst van het
      verzoek, dan wel onverwijld nadat is gebleken dat de verzoeker kennelijk een ander doel heeft dan het verkrijgen
      van publieke informatie, besluiten het verzoek niet te behandelen.
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel4.6
  - number: '4.7'
    text: |-
      Ter beantwoording van vragen over de beschikbaarheid van publieke informatie wijst het bestuursorgaan een of meer
      contactpersonen aan.
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel4.7
  - number: 5.1.1
    text: 'Het openbaar maken van informatie ingevolge deze wet blijft achterwege voor zover dit:'
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel5.1
  - number: 5.1.1.a
    text: de eenheid van de Kroon in gevaar zou kunnen brengen;
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel5.1
  - number: 5.1.1.b
    text: de veiligheid van de Staat zou kunnen schaden;
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel5.1
  - number: 5.1.1.c
    text: |-
      bedrijfs- en fabricagegegevens betreft die door natuurlijke personen of rechtspersonen vertrouwelijk aan de
      overheid zijn meegedeeld;
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel5.1
  - number: 5.1.1.d
    text: |-
      persoonsgegevens betreft als bedoeld in [paragraaf 3.1][ref1] onderscheidenlijk
      [paragraaf 3.2 van de Uitvoeringswet Algemene verordening gegevensbescherming][ref2], tenzij de betrokkene
      uitdrukkelijk toestemming heeft gegeven voor de openbaarmaking van deze persoonsgegevens of deze persoonsgegevens
      kennelijk door de betrokkene openbaar zijn gemaakt;


      [ref1]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.1
      [ref2]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.2
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel5.1
    references:
      - id: ref1
        bwb_id: BWBR0040940
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0040940
        paragraaf: '3.2'
  - number: 5.1.1.e
    text: |-
      nummers betreft die dienen ter identificatie van personen die bij wet of algemene maatregel van bestuur zijn
      voorgeschreven als bedoeld in [artikel 46 van de Uitvoeringswet Algemene verordening gegevensbescherming][ref1],
      tenzij de verstrekking kennelijk geen inbreuk op de levenssfeer maakt.


      [ref1]: https://wetten.overheid.nl/BWBR0040940#Artikel46
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel5.1
    references:
      - id: ref1
        bwb_id: BWBR0040940
        artikel: '46'
  - number: 5.1.2
    text: |-
      Het openbaar maken van informatie blijft eveneens achterwege voor zover het belang daarvan niet opweegt tegen de
      volgende belangen:
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel5.1
  - number: 5.1.2.a
    text: de betrekkingen van Nederland met andere landen en staten en met internationale organisaties;
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel5.1
  - number: 5.1.2.b
    text: |-
      de economische of financiële belangen van de Staat, andere publiekrechtelijke lichamen of bestuursorganen, in
      geval van milieu-informatie slechts voor zover de informatie betrekking heeft op handelingen met een vertrouwelijk
      karakter;
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel5.1
  - number: 5.1.2.c
    text: de opsporing en vervolging van strafbare feiten;
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel5.1
  - number: 5.1.2.d
    text: de inspectie, controle en toezicht door bestuursorganen;
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel5.1
  - number: 5.1.2.e
    text: de eerbiediging van de persoonlijke levenssfeer;
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel5.1
  - number: 5.1.2.f
    text: |-
      de bescherming van andere dan in het eerste lid, onderdeel c, genoemde concurrentiegevoelige bedrijfs- en
      fabricagegegevens;
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel5.1
  - number: 5.1.2.g
    text: de bescherming van het milieu waarop deze informatie betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel5.1
  - number: 5.1.2.h
    text: de beveiliging van personen en bedrijven en het voorkomen van sabotage;
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel5.1
  - number: 5.1.2.i
    text: het goed functioneren van de Staat, andere publiekrechtelijke lichamen of bestuursorganen.
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel5.1
  - number: 5.1.3
    text: |-
      Indien een verzoek tot openbaarmaking op een van de in het tweede lid genoemde gronden wordt afgewezen, bevat het
      besluit hiervoor een uitdrukkelijke motivering.
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel5.1
  - number: 5.1.4
    text: |-
      Openbaarmaking kan tijdelijk achterwege blijven, indien het belang van de geadresseerde van de informatie om als
      eerste kennis te nemen van de informatie dit kennelijk vereist. Het bestuursorgaan doet mededeling aan de verzoeker
      van de termijn waarbinnen de openbaarmaking alsnog zal geschieden.
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel5.1
  - number: 5.1.5
    text: |-
      In uitzonderlijke gevallen kan openbaarmaking van andere informatie dan milieu-informatie voorts achterwege blijven
      indien openbaarmaking onevenredige benadeling toebrengt aan een ander belang dan genoemd in het eerste of tweede
      lid en het algemeen belang van openbaarheid niet tegen deze benadeling opweegt. Het bestuursorgaan baseert een
      beslissing tot achterwege laten van de openbaarmaking van enige informatie op deze grond ten aanzien van dezelfde
      informatie niet tevens op een van de in het eerste of tweede lid genoemde gronden.
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel5.1
  - number: 5.1.6
    text: |-
      Het openbaar maken van informatie blijft in afwijking van het eerste lid, onderdeel c, in geval van milieu-
      informatie eveneens achterwege voor zover daardoor het in het eerste lid, onderdeel c, genoemde belang ernstig
      geschaad wordt en het algemeen belang van openbaarheid van informatie niet opweegt tegen deze schade.
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel5.1
  - number: 5.1.7
    text: |-
      Het eerste en tweede lid zijn niet van toepassing op milieu-informatie die betrekking heeft op emissies in het
      milieu.
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel5.1
  - number: 5.2.1
    text: |-
      In geval van een verzoek om informatie uit documenten, opgesteld ten behoeve van intern beraad, wordt geen
      informatie verstrekt over daarin opgenomen persoonlijke beleidsopvattingen. Onder persoonlijke beleidsopvattingen
      worden verstaan ambtelijke adviezen, visies, standpunten en overwegingen ten behoeve van intern beraad, niet zijnde
      feiten, prognoses, beleidsalternatieven, de gevolgen van een bepaald beleidsalternatief of andere onderdelen met
      een overwegend objectief karakter.
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel5.2
  - number: 5.2.2
    text: |-
      Het bestuursorgaan kan over persoonlijke beleidsopvattingen met het oog op een goede en democratische
      bestuursvoering informatie verstrekken in niet tot personen herleidbare vorm. Indien degene die deze opvattingen
      heeft geuit of zich erachter heeft gesteld, daarmee heeft ingestemd, kan de informatie in tot personen herleidbare
      vorm worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel5.2
  - number: 5.2.3
    text: |-
      Onverminderd het eerste en tweede lid wordt uit documenten opgesteld ten behoeve van formele bestuurlijke
      besluitvorming door een minister, een commissaris van de Koning, Gedeputeerde Staten, een gedeputeerde, het
      college van burgemeester en wethouders, een burgemeester en een wethouder, informatie verstrekt over persoonlijke
      beleidsopvattingen in niet tot personen herleidbare vorm, tenzij het kunnen voeren van intern beraad onevenredig
      wordt geschaad.
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel5.2
  - number: 5.2.4
    text: |-
      In afwijking van het eerste lid wordt bij milieu-informatie het belang van de bescherming van de persoonlijke
      beleidsopvattingen afgewogen tegen het belang van openbaarmaking. Informatie over persoonlijke beleidsopvattingen
      kan worden verstrekt in niet tot personen herleidbare vorm. Indien degene die deze opvattingen heeft geuit of
      zich erachter heeft gesteld, daarmee heeft ingestemd, kan de informatie in tot personen herleidbare vorm worden
      verstrekt.
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel5.2
  - number: '5.3'
    text: |-
      Bij een verzoek om informatie die ouder is dan vijf jaar motiveert het bestuursorgaan bij een weigering van die
      informatie waarom de in [artikel 5.1, tweede of vijfde lid][ref1], of [artikel 5.2][ref2] bedoelde belangen ondanks
      het tijdsverloop zwaarder wegen dan het algemeen belang van openbaarheid.


      [ref1]: https://wetten.overheid.nl/BWBR0045754#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0045754#Artikel5
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel5.3
    references:
      - id: ref1
        bwb_id: BWBR0045754
        artikel: '5'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0045754
        artikel: '5'
        hoofdstuk: '5'
  - number: '5.4'
    text: |-
      In afwijking van de [artikelen 5.1][ref1] en [5.2][ref2] is informatie die berust bij de formateur of de
      informateur, dan wel informatie die door een bestuursorgaan aan de formateur of de informateur is gezonden niet
      openbaar totdat de formatie is afgerond.


      [ref1]: https://wetten.overheid.nl/BWBR0045754#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0045754#Artikel5
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel5.4
    references:
      - id: ref1
        bwb_id: BWBR0045754
        artikel: '5'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0045754
        artikel: '5'
        hoofdstuk: '5'
  - number: 5.4a.1
    text: |-
      In afwijking van de [artikelen 5.1][ref1] en [5.2][ref2] is niet openbaar de informatie betreffende de
      ondersteuning van individuele leden van de Eerste Kamer of de Tweede Kamer der Staten-Generaal, provinciale staten
      of de gemeenteraad door ambtenaren werkzaam bij de Eerste Kamer of de Tweede Kamer, de griffie van provinciale
      staten of de griffie van de gemeenteraad.


      [ref1]: https://wetten.overheid.nl/BWBR0045754#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0045754#Artikel5
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel5.4a
    references:
      - id: ref1
        bwb_id: BWBR0045754
        artikel: '5'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0045754
        artikel: '5'
        hoofdstuk: '5'
  - number: 5.4a.2
    text: |-
      In afwijking van [artikel 5.2, eerste lid][ref1], wordt met betrekking tot informatie die aan individuele
      Kamerleden wordt verstrekt onder persoonlijke beleidsopvattingen verstaan ambtelijke adviezen, visies, standpunten
      en overwegingen ten behoeve van intern beraad.


      [ref1]: https://wetten.overheid.nl/BWBR0045754#Artikel5
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel5.4a
    references:
      - id: ref1
        bwb_id: BWBR0045754
        artikel: '5'
        hoofdstuk: '5'
  - number: 5.5.1
    text: |-
      Onverminderd het elders bij wet bepaalde, verstrekt een bestuursorgaan iedere natuurlijke of rechtspersoon
      op diens verzoek de op de verzoeker betrekking hebbende in documenten neergelegde informatie, tenzij een in
      [artikel 5.1, eerste lid, onderdelen a, b en c, alsmede d en e][ref1], voor zover betrekking hebbend op derden,
      genoemd belang aan de orde is of een in artikel 5.1, tweede of vijfde lid, of [artikel 5.2][ref2] genoemd belang
      zwaarder weegt dan het belang van de verzoeker bij toegang tot op hem betrekking hebbende informatie. De verzoeker
      vermeldt bij zijn verzoek de aangelegenheid of het daarop betrekking hebbende document, waarover hij informatie
      wenst te ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0045754#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0045754#Artikel5
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel5.5
    references:
      - id: ref1
        bwb_id: BWBR0045754
        artikel: '5'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0045754
        artikel: '5'
        hoofdstuk: '5'
  - number: 5.5.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing op een verzoek met betrekking tot gegevens ten aanzien van
      een overleden echtgenoot, geregistreerd partner, kind of ouder van de verzoeker, tenzij een schriftelijke
      wilsverklaring van de overledene aan de verstrekking in de weg staat.
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel5.5
  - number: 5.5.3
    text: Het bestuursorgaan draagt zorg voor een deugdelijke vaststelling van de identiteit van de verzoeker.
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel5.5
  - number: 5.5.4
    text: |-
      Het bestuursorgaan kan aan de verstrekking voorwaarden verbinden ter bescherming van een van de belangen, genoemd
      in de [artikelen 5.1][ref1] en [5.2][ref2], tenzij de gevraagde informatie met toepassing van de artikelen 5.1 en
      5.2 openbaar voor eenieder zou zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0045754#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0045754#Artikel5
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel5.5
    references:
      - id: ref1
        bwb_id: BWBR0045754
        artikel: '5'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0045754
        artikel: '5'
        hoofdstuk: '5'
  - number: 5.6.1
    text: |-
      Het bestuursorgaan kan, in geval informatie ingevolge de [artikelen 5.1][ref1] en [5.2][ref2] niet openbaar
      gemaakt kan worden, besluiten de informatie uitsluitend aan de verzoeker te verstrekken, indien er klemmende
      redenen zijn om de verzoeker niettegenstaande de toepasselijke uitzonderingsgrond of -gronden de gevraagde
      informatie niet te onthouden.


      [ref1]: https://wetten.overheid.nl/BWBR0045754#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0045754#Artikel5
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel5.6
    references:
      - id: ref1
        bwb_id: BWBR0045754
        artikel: '5'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0045754
        artikel: '5'
        hoofdstuk: '5'
  - number: 5.6.2
    text: |-
      Het eerste lid vindt slechts toepassing voor zover dit niet in strijd is met een toepasselijke
      geheimhoudingsplicht.
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel5.6
  - number: 5.6.3
    text: |-
      Het bestuursorgaan kan aan de verstrekking voorwaarden verbinden ter bescherming van een van de belangen, genoemd
      in de [artikelen 5.1][ref1] en [5.2][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0045754#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0045754#Artikel5
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel5.6
    references:
      - id: ref1
        bwb_id: BWBR0045754
        artikel: '5'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0045754
        artikel: '5'
        hoofdstuk: '5'
  - number: 5.7.1
    text: |-
      Een bestuursorgaan kan ten behoeve van historisch, statistisch, wetenschappelijk of journalistiek onderzoek toegang
      bieden tot informatie:
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel5.7
  - number: 5.7.1.a
    text: |-
      die ingevolge de [artikelen 5.1][ref1] en [5.2][ref2] niet openbaar gemaakt kan worden; of


      [ref1]: https://wetten.overheid.nl/BWBR0045754#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0045754#Artikel5
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel5.7
    references:
      - id: ref1
        bwb_id: BWBR0045754
        artikel: '5'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0045754
        artikel: '5'
        hoofdstuk: '5'
  - number: 5.7.1.b
    text: |-
      waarvan de vaststelling of deze informatie ingevolge de [artikelen 5.1][ref1] en [5.2][ref2] openbaar gemaakt kan
      worden een onevenredige inspanning vergt.


      [ref1]: https://wetten.overheid.nl/BWBR0045754#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0045754#Artikel5
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel5.7
    references:
      - id: ref1
        bwb_id: BWBR0045754
        artikel: '5'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0045754
        artikel: '5'
        hoofdstuk: '5'
  - number: 5.7.2
    text: Het bestuursorgaan kan aan het verlenen van toegang voorwaarden verbinden.
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel5.7
  - number: 5.7.3
    text: |-
      De toegang tot informatie overeenkomstig het eerste lid wordt in ieder geval verleend onder de voorwaarde dat
      degene aan wie toegang wordt verleend, de verkregen informatie niet verder verspreidt zonder voorafgaand besluit
      van het bestuursorgaan waarin de informatie met toepassing van de [artikelen 5.1][ref1] en [5.2][ref2] openbaar
      gemaakt wordt.


      [ref1]: https://wetten.overheid.nl/BWBR0045754#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0045754#Artikel5
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel5.7
    references:
      - id: ref1
        bwb_id: BWBR0045754
        artikel: '5'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0045754
        artikel: '5'
        hoofdstuk: '5'
  - number: '6.1'
    text: |-
      Het bestuursorgaan treft maatregelen ten behoeve van het duurzaam toegankelijk maken van de digitale documenten,
      bedoeld in [artikel 2.4, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0045754#Artikel2
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel6.1
    references:
      - id: ref1
        bwb_id: BWBR0045754
        artikel: '2'
        hoofdstuk: '2'
  - number: 6.2.1
    text: |-
      Onze Minister, in overeenstemming met Onze Minister van Onderwijs, Cultuur en Wetenschap, zendt een meerjarenplan
      naar de Staten-Generaal over de wijze waarop bestuursorganen hun digitale overheidsinformatie duurzaam toegankelijk
      maken.
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel6.2
  - number: 6.2.2
    text: |-
      Het meerjarenplan bevat langetermijndoelen voor de verbetering van de wijze waarop digitale documenten worden
      vervaardigd, geordend, bewaard, vernietigd en ontsloten alsmede de stappen die daartoe op korte termijn worden
      gezet.
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel6.2
  - number: 6.2.3
    text: |-
      Het meerjarenplan voorziet in stappen waarmee wordt bereikt dat eenieder zo veel mogelijk inzicht kan
      hebben in de aanwezigheid van publieke informatie bij een orgaan, persoon of college als bedoeld in
      [artikel 2.2, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0045754#Artikel2
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0045754
        artikel: '2'
        hoofdstuk: '2'
  - number: 6.2.4
    text: |-
      Onze Minister, in overeenstemming met Onze Minister van Onderwijs, Cultuur en Wetenschap, vult het meerjarenplan
      aan met de nodige maatregelen tot de digitale overheidsinformatie voldoende duurzaam toegankelijk is.
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel6.2
  - number: 7.1.1
    text: Er is een Adviescollege openbaarheid en informatiehuishouding.
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel7.1
  - number: 7.1.2
    text: Het college bestaat uit een voorzitter en ten hoogste vier andere leden.
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel7.1
  - number: 7.1.3
    text: |-
      De benoeming van de leden bij koninklijk besluit geschiedt op voordracht van Onze Minister, in overeenstemming met
      Onze Minister van Onderwijs, Cultuur en Wetenschap.
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel7.1
  - number: 7.1.4
    text: |-
      De [artikelen 13][ref1], [16][ref2] en [19 van de Kaderwet zelfstandige bestuursorganen][ref3] zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0020495#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0020495#Artikel19
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel7.1
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '13'
      - id: ref2
        bwb_id: BWBR0020495
        artikel: '16'
      - id: ref3
        bwb_id: BWBR0020495
        artikel: '19'
  - number: 7.2.1
    text: |-
      Het college adviseert de regering en de beide Kamers der Staten-Generaal gevraagd en ongevraagd over de uitvoering
      van de regels over openbaarmaking van publieke informatie.
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel7.2
  - number: 7.2.2
    text: |-
      Het college adviseert Onze Minister periodiek over aanpassing van het meerjarenplan. Het college rapporteert in
      zijn advies in elk geval over de stand van de informatiehuishouding in het bestuur, de voortgang van de uitvoering
      van het meerjarenplan en de toegang tot de publieke informatie.
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel7.2
  - number: 7.2.3
    text: |-
      Het college wordt om advies gevraagd over voorstellen van wet en ontwerpen van algemene maatregelen van bestuur
      die geheel of voor een belangrijk deel betrekking hebben op de openbaarmaking en de ontsluiting van publieke
      informatie.
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel7.2
  - number: 7.2.4
    text: |-
      Het college adviseert het betrokken bestuursorgaan naar aanleiding van bij het college ingediende klachten van
      journalisten, wetenschappers of andere naar het oordeel van het college in aanmerking komende groepen met een
      beroepsmatig belang bij het gebruik van publiek informatie over de wijze waarop dat bestuursorgaan publieke
      informatie openbaar maakt.
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel7.2
  - number: 7.2.5
    text: 'Het college bevordert de toepassing van deze wet, onder meer door:'
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel7.2
  - number: 7.2.5.a
    text: het geven van voorlichting aan bestuursorganen en anderen;
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel7.2
  - number: 7.2.5.b
    text: het opleiden van personen werkzaam bij organen belast met de uitvoering van openbaarmaking van publieke informatie;
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel7.2
  - number: 7.2.5.c
    text: |-
      het monitoren en onderzoeken van en rapporteren over de openbaarmaking van publieke informatie in algemene zin of
      door specifieke organen in het bijzonder;
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel7.2
  - number: 7.2.5.d
    text: |-
      het publiceren van richtsnoeren ter bevordering van de openbaarmaking uit eigen beweging en de ontsluiting van
      informatie.
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel7.2
  - number: 7.3.1
    text: |-
      Alvorens een advies als bedoeld in [artikel 7.2, vierde lid][ref1], uit te brengen, bemiddelt het college tussen
      het bestuursorgaan en de klager. Het bestuursorgaan werkt aan de bemiddeling mee.


      [ref1]: https://wetten.overheid.nl/BWBR0045754#Artikel7
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel7.3
    references:
      - id: ref1
        bwb_id: BWBR0045754
        artikel: '7'
        hoofdstuk: '7'
  - number: 7.3.2
    text: |-
      Indien de klacht mede betrekking heeft op een besluit op grond van deze wet waartegen bezwaar open staat, wordt de
      termijn voor het indienen van bezwaar, bedoeld in [artikel 6:7 van de Algemene wet bestuursrecht][ref1], opgeschort
      tot het college advies heeft uitgebracht, dan wel aan de klager en het bestuursorgaan heeft bericht dat geen advies
      zal worden uitgebracht. De opschorting van de bezwaartermijn vangt aan met ingang van de dag nadat de klager de
      klacht aan het college heeft gezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel7.3
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '6'
  - number: 7.3.3
    text: |-
      Indien de klager bezwaar maakt tegen het besluit, bedoeld in het tweede lid, beslist het bestuursorgaan in
      afwijking van [artikel 7:10, eerste lid, van de Algemene wet bestuursrecht][ref1] binnen twee weken nadat het
      college advies heeft uitgebracht, dan wel aan de klager en het bestuursorgaan heeft bericht dat geen advies zal
      worden uitgebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel7.3
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: 7.3.4
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld over de wijze waarop klachten worden
      ingediend en het college tussen het bestuursorgaan en de klager bemiddelt als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel7.3
  - number: '7.4'
    text: Een bestuursorgaan verstrekt desgevraagd het college alle gegevens die het nodig heeft voor zijn taak.
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel7.4
  - number: 7.5.1
    text: |-
      De leden van het college alsmede de ambtenaren van zijn bureau zijn tot geheimhouding verplicht voor zover zij
      krachtens deze wet beschikken over documenten die door het bestuursorgaan waarvan zij afkomstig zijn niet openbaar
      zijn gemaakt.
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel7.5
  - number: 7.5.2
    text: |-
      Voor zover een aan het college gericht verzoek op grond van deze wet betrekking heeft op door een bestuursorgaan
      aan het college verstrekte informatie, zendt het college het verzoek ter behandeling door aan het bestuursorgaan.
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel7.5
  - number: 8.1.1
    text: |-
      Overtreding van een voorwaarde die op grond van [artikel 5.5, vierde lid][ref1], [5.6, derde lid][ref2], of
      [artikel 5.7, tweede of derde lid][ref3], aan een verstrekking is verbonden, wordt gestraft met gevangenisstraf
      van ten hoogste een jaar of geldboete van de vierde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0045754#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0045754#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0045754#Artikel5
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel8.1
    references:
      - id: ref1
        bwb_id: BWBR0045754
        artikel: '5'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0045754
        artikel: '5'
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0045754
        artikel: '5'
        hoofdstuk: '5'
  - number: 8.1.2
    text: Het in het eerste lid strafbaar gestelde feit is een misdrijf.
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel8.1
  - number: '8.2'
    text: |-
      [Paragraaf 4.1.3.2 van de Algemene wet bestuursrecht][ref1] is niet van toepassing op besluiten op grond van deze
      wet en op beslissingen op bezwaar tegen deze besluiten.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.2
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel8.2
    references:
      - id: ref1
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.2
  - number: 8.4.1
    text: |-
      In geval van een gegrond beroep tegen het niet tijdig nemen van een besluit op grond van deze wet
      of een beslissing op bezwaar tegen een dergelijk besluit, waarbij nog geen besluit is bekendgemaakt,
      bepaalt de bestuursrechter, indien de omvang van het verzoek hiertoe aanleiding geeft, in afwijking van
      [artikel 8:55d, eerste lid, van de Algemene wet bestuursrecht][ref1] de termijn waarbinnen het bestuursorgaan
      alsnog een besluit bekendmaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel8.4
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 8.4.2
    text: |-
      Indien de bestuursrechter oordeelt dat het niet tijdig nemen van een besluit kennelijk het gevolg is van de wijze
      van indiening van het verzoek en nog geen besluit is bekendgemaakt, bepaalt de bestuursrechter, indien het verzoek
      hiertoe aanleiding geeft, in afwijking van [artikel 8:55d, eerste lid, van de Algemene wet bestuursrecht][ref1]
      een langere termijn waarbinnen het bestuursorgaan alsnog een besluit bekendmaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel8.4
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 8.4.3
    text: |-
      De bestuursrechter kan [artikel 8:74, eerste lid, van de Algemene wet bestuursrecht][ref1] buiten toepassing laten
      en een proceskostenveroordeling op grond van [artikel 8:75, eerste lid, van de Algemene wet bestuursrecht][ref2]
      achterwege laten, indien de indiener van het beroepschrift, gelet op de omvang van het verzoek, onvoldoende heeft
      meegewerkt aan het bereiken van overeenstemming over:


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel8.4
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 8.4.3.a
    text: |-
      een opschorting van de beslistermijn als bedoeld in
      [artikel 4:15, tweede lid, onderdeel a, van de Algemene wet bestuursrecht][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel8.4
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 8.4.3.b
    text: |-
      verder uitstel van de beslistermijn, bedoeld in
      [artikel 7:10, vierde lid, onderdeel a of b, van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel8.4
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: 8.4.4
    text: |-
      De bestuursrechter kan eveneens [artikel 8:74, eerste lid, van de Algemene wet bestuursrecht][ref1]
      buiten toepassing laten en een proceskostenveroordeling op grond van
      [artikel 8:75, eerste lid, van de Algemene wet bestuursrecht][ref2] achterwege laten, indien hij oordeelt dat het
      niet tijdig nemen van een besluit kennelijk het gevolg is van de wijze van indiening van het verzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel8.4
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '8.5'
    text: |-
      Het bestuursorgaan is bevoegd tot oplegging van een last onder dwangsom ter handhaving van
      [artikel 4.2, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0045754#Artikel4
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel8.5
    references:
      - id: ref1
        bwb_id: BWBR0045754
        artikel: '4'
        hoofdstuk: '4'
  - number: 8.6.1
    text: De openbaarmaking van informatie op grond van deze wet is kosteloos.
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel8.6
  - number: 8.6.2
    text: |-
      Voor de vervaardiging van kopieën van documenten kan een bestuursorgaan een redelijke vergoeding vragen, die de
      kostprijs van de verstrekte informatiedragers niet overstijgt.
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel8.6
  - number: 8.6.3
    text: |-
      Op voordracht van Onze Minister kunnen bij of krachtens algemene maatregel van bestuur regels worden gesteld met
      betrekking tot het tweede lid.
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel8.6
  - number: '8.7'
    text: |-
      Op voordracht van Onze Minister kunnen bij of krachtens algemene maatregel van bestuur regels worden gesteld over
      de wijze waarop een bestuursorgaan de uitvoering van deze wet organiseert.
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel8.7
  - number: '8.8'
    text: |-
      De [artikelen 3.1][ref1], [3.3][ref2], [4.1][ref3], [5.1, eerste, tweede en vijfde lid][ref4], en [5.2][ref5] zijn
      niet van toepassing op informatie waarvoor een bepaling geldt die is opgenomen in de bijlage bij deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0045754#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0045754#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0045754#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0045754#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0045754#Artikel5
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel8.8
    references:
      - id: ref1
        bwb_id: BWBR0045754
        artikel: '3'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0045754
        artikel: '3'
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0045754
        artikel: '4'
        hoofdstuk: '4'
      - id: ref4
        bwb_id: BWBR0045754
        artikel: '5'
        hoofdstuk: '5'
      - id: ref5
        bwb_id: BWBR0045754
        artikel: '5'
        hoofdstuk: '5'
  - number: 8.9.1
    text: |-
      Onze Minister zendt binnen vijf jaar na de inwerkingtreding van deze wet aan de Staten-Generaal een verslag over de
      doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel8.9
  - number: 8.9.2
    text: |-
      In deze evaluatie wordt in ieder geval aandacht besteed aan de vraag of het noodzakelijk is om een
      Informatiecommissaris in te stellen.
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel8.9
  - number: '10.1'
    text: |-
      De [Wet openbaarheid van bestuur][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0005252
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel10.1
    references:
      - id: ref1
        bwb_id: BWBR0005252
  - number: 10.2.1
    text: |-
      Bij tijdelijke regeling van Onze Minister wordt bepaald welke onderdelen van
      [artikel 3.3, eerste en tweede lid][ref1], niet van toepassing zijn op in die regeling aangewezen bestuursorganen
      voor een in die regeling bepaalde periode.


      [ref1]: https://wetten.overheid.nl/BWBR0045754#Artikel3
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel10.2
    references:
      - id: ref1
        bwb_id: BWBR0045754
        artikel: '3'
        hoofdstuk: '3'
  - number: 10.2.2
    text: 'Bij tijdelijke regeling van Onze Minister kan worden bepaald dat:'
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel10.2
  - number: 10.2.2.a
    text: |-
      voor in die regeling aangewezen bestuursorganen voor een in die regeling bepaalde periode in afwijking van
      [artikel 3.3, vierde of vijfde lid][ref1], bij in die regeling aangewezen onderdelen van artikel 3.3, eerste en
      tweede lid, een andere periode geldt waarbinnen de openbaarmaking plaatsvindt, of


      [ref1]: https://wetten.overheid.nl/BWBR0045754#Artikel3
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel10.2
    references:
      - id: ref1
        bwb_id: BWBR0045754
        artikel: '3'
        hoofdstuk: '3'
  - number: 10.2.2.b
    text: |-
      voor in die regeling aangewezen bestuursorganen voor een in die regeling bepaalde periode het in die regeling
      aangewezen type beschikkingen als bedoeld in [artikel 3.3, tweede lid, onderdeel k][ref1], de verplichting tot
      openbaarmaking reeds geldt of nog niet van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0045754#Artikel3
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel10.2
    references:
      - id: ref1
        bwb_id: BWBR0045754
        artikel: '3'
        hoofdstuk: '3'
  - number: 10.2a
    text: |-
      De in [artikel 3.3, eerste en tweede lid][ref1], opgenomen verplichting tot openbaarmaking geldt niet voor
      documenten die zijn vastgesteld of ontvangen voordat deze verplichting op het bestuursorgaan waarbij de documenten
      berusten, van toepassing is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0045754#Artikel3
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel10.2a
    references:
      - id: ref1
        bwb_id: BWBR0045754
        artikel: '3'
        hoofdstuk: '3'
  - number: 10.2b.1
    text: |-
      Zolang [artikel 3.3, tweede lid, onderdeel e][ref1], niet in werking is getreden, draagt de Afdeling advisering van
      de Raad van State zorg voor de openbaarmaking van:


      [ref1]: https://wetten.overheid.nl/BWBR0045754#Artikel3
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel10.2b
    references:
      - id: ref1
        bwb_id: BWBR0045754
        artikel: '3'
        hoofdstuk: '3'
  - number: 10.2b.1.a
    text: adviezen van de Afdeling advisering, door Ons gevraagd;
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel10.2b
  - number: 10.2b.1.b
    text: |-
      adviezen als bedoeld in [artikel 21 van de Wet op de Raad van State][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002367#Artikel21
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel10.2b
    references:
      - id: ref1
        bwb_id: BWBR0002367
        artikel: '21'
  - number: 10.2b.1.c
    text: |-
      voorlichting in aangelegenheden van wetgeving en bestuur als bedoeld in
      [artikel 21a van de Wet op de Raad van State][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002367#Artikel21a
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel10.2b
    references:
      - id: ref1
        bwb_id: BWBR0002367
        artikel: 21a
  - number: 10.2b.2
    text: |-
      [Artikel 3.3 vierde lid][ref1], is van toepassing, tenzij Onze Minister die het rechtstreeks aangaat heeft verzocht
      om toepassing van artikel 3.3, vijfde lid, onderdeel a.


      [ref1]: https://wetten.overheid.nl/BWBR0045754#Artikel3
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel10.2b
    references:
      - id: ref1
        bwb_id: BWBR0045754
        artikel: '3'
        hoofdstuk: '3'
  - number: 10.2c
    text: |-
      Gedurende drie jaar na de inwerkingtreding van [artikel 9.74][ref1] blijft
      [artikel 1, aanhef en onderdelen b en c, van het Besluit bestuursorganen WNo en Wob][ref2], zoals dat luidde op
      het tijdstip onmiddellijk voorafgaand aan het tijdstip van inwerkingtreding van artikel 9.74, van overeenkomstige
      toepassing op verzoeken om informatie die op dat tijdstip berust bij de Nederlandsche Bank N.V. of de Stichting
      Autoriteit Financiële Markten.


      [ref1]: https://wetten.overheid.nl/BWBR0045754#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0009896#Artikel1
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel10.2c
    references:
      - id: ref1
        bwb_id: BWBR0045754
        artikel: '9'
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0009896
        artikel: '1'
  - number: 10.2f.1
    text: |-
      [Hoofdstuk 6][ref1] vervalt bij koninklijk besluit, met dien verstande dat de voordracht voor dat koninklijk
      besluit niet eerder gedaan wordt dan vier weken nadat het ontwerp aan beide Kamers der Staten-Generaal is
      overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0045754#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel10.2f
    references:
      - id: ref1
        bwb_id: BWBR0045754
        hoofdstuk: '6'
  - number: 10.2f.2
    text: |-
      Met ingang van het tijdstip waarop [hoofdstuk 6][ref1] vervalt, komt [artikel 7.2, tweede lid][ref2], als volgt
      te luiden:


      [ref1]: https://wetten.overheid.nl/BWBR0045754#Hoofdstuk6
      [ref2]: https://wetten.overheid.nl/BWBR0045754#Artikel7
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel10.2f
    references:
      - id: ref1
        bwb_id: BWBR0045754
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0045754
        artikel: '7'
        hoofdstuk: '7'
  - number: 10.2f.2
    text: |-
      Het college adviseert Onze Minister over de stand van de informatiehuishouding in het bestuur en de toegang tot de
      publieke informatie.
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel10.2f
  - number: 10.3.1
    text: |-
      Deze wet treedt, met uitzondering van [artikel 3.3, eerste en tweede lid][ref1], in werking met ingang van de
      eerste dag van de zevende kalendermaand na de datum van uitgifte van het Staatsblad waarin zij wordt geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0045754#Artikel3
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel10.3
    references:
      - id: ref1
        bwb_id: BWBR0045754
        artikel: '3'
        hoofdstuk: '3'
  - number: 10.3.2
    text: |-
      [Artikel 3.3, eerste en tweede lid][ref1], treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat
      voor onderdelen daarvan verschillend kan worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0045754#Artikel3
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel10.3
    references:
      - id: ref1
        bwb_id: BWBR0045754
        artikel: '3'
        hoofdstuk: '3'
  - number: '10.4'
    text: 'Deze wet wordt aangehaald als: Wet open overheid.'
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel10.4
