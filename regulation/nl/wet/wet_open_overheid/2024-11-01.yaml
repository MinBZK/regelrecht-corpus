preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het, mede gelet op artikel 110 van de Grondwet, het op 25 juni 1998 te
    Aarhus (Denemarken) tot stand gekomen Verdrag betreffende toegang tot informatie, inspraak bij besluitvorming en
    toegang tot de rechter inzake milieuaangelegenheden (Trb. 2001, 73) en richtlijn nr. 2003/4/EG van het Europees
    Parlement en de Raad van 28 januari 2003 inzake de toegang van het publiek tot milieu-informatie en tot intrekking
    van Richtlijn 90/313/EEG van de Raad (PbEU L 41), wenselijk is gebleken om in het kader van het onophoudelijke
    streven naar een goed en democratisch bestuur, de toegang tot overheidsinformatie voor iedereen te vergroten, de
    actieve openbaarmaking te bevorderen, bestuurlijke transparantie tot norm te verheffen, de regels voor openheid en
    openbaarheid te actualiseren en deze zoveel mogelijk in de wet op te nemen zodat openbaarheid een recht wordt van
    de burger en een plicht van de overheid blijft;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      Eenieder heeft recht op toegang tot publieke informatie zonder daartoe een belang te hoeven stellen, behoudens bij
      deze wet gestelde beperkingen.
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel1.1
  - number: '2.1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder: - *document:* een door een orgaan, persoon of
      college als bedoeld in [artikel 2.2, eerste lid][ref1], opgemaakt of ontvangen schriftelijk stuk of ander geheel
      van vastgelegde gegevens dat naar zijn aard verband houdt met de publieke taak van dat orgaan, die persoon of dat
      college;
        - *milieu-informatie:* hetgeen daaronder wordt verstaan in [artikel 19.1a van de Wet milieubeheer][ref2];
        - *Onze Minister:* Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties;
        - *publieke informatie:* informatie neergelegd in documenten die berusten bij een orgaan, persoon of college als
      bedoeld in [artikel 2.2, eerste lid][ref3], of informatie die krachtens artikel 2.3 door een bestuursorgaan kan
      worden gevorderd.


      [ref1]: https://wetten.overheid.nl/BWBR0045754#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0045754#Artikel2
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel2.1
    references:
      - id: ref1
