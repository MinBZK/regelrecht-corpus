    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel2.2
  - number: 2.2.1.c
    text: de Raad voor de rechtspraak en het College van afgevaardigden;
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel2.2
  - number: 2.2.1.d
    text: |-
      de Raad van State, tenzij de Raad het koninklijk gezag uitoefent, en met uitzondering van de Afdeling
      bestuursrechtspraak;
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel2.2
  - number: 2.2.1.e
    text: de Algemene Rekenkamer;
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel2.2
  - number: 2.2.1.f
    text: |-
      de Nationale ombudsman en de substituut-ombudsmannen als bedoeld in
      [artikel 9, eerste lid, van de Wet Nationale ombudsman][ref1], en ombudsmannen en ombudscommissies als bedoeld in
      [artikel 9:17, onderdeel b, van de Algemene wet bestuursrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003372#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel9
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel2.2
    references:
