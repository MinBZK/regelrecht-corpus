        artikel: '9'
  - number: 2.2.2
    text: |-
      Voor de toepassing van deze wet worden de organen, personen en colleges, bedoeld in het eerste lid, onderdelen b
      tot en met f, die op grond van de [Algemene wet bestuursrecht][ref1] geen bestuursorgaan zijn, gelijk gesteld met
      een bestuursorgaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0005537
  - number: 2.4.1
    text: |-
      Een bestuursorgaan draagt er zorg voor dat de documenten die het ontvangt, vervaardigt of anderszins onder zich
      heeft, zich in goede, geordende en toegankelijke staat bevinden.
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel2.4
  - number: 2.4.2
    text: |-
      Een bestuursorgaan draagt er zoveel mogelijk zorg voor dat de informatie die het overeenkomstig deze wet verstrekt,
      actueel, nauwkeurig en vergelijkbaar is.
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel2.4
  - number: 2.4.3
    text: |-
      Indien een bestuursorgaan overeenkomstig deze wet informatie openbaar maakt, geschiedt dat op zodanige wijze dat
      de belanghebbende en belangstellende burger zoveel mogelijk wordt bereikt en op de volgende algemeen toegankelijke
      wijze:
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel2.4
  - number: 2.4.3.a
    text: |-
      in een voor hergebruik beschikbare vorm die voldoet aan de voorwaarden van de
      [Wet hergebruik van overheidsinformatie][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0036795
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel2.4
    references:
      - id: ref1
        bwb_id: BWBR0036795
  - number: 2.4.3.b
    text: |-
      of, indien verstrekking in een machinaal leesbaar open formaat redelijkerwijs niet gevergd kan worden, in andere
      elektronisch doorzoekbare vorm;
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel2.4
  - number: 2.4.3.c
    text: |-
      of, indien elektronische verschaffing redelijkerwijs niet gevergd kan worden, door verstrekking van een kopie van
      de letterlijke inhoud ervan in andere vorm te verstrekken;
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel2.4
  - number: 2.4.3.d
    text: |-
      of, indien verstrekking van een kopie of de letterlijke inhoud redelijkerwijs niet gevergd kan worden,
      door een uittreksel of een samenvatting van de inhoud te geven, inlichtingen daaruit te verschaffen of door
      terinzagelegging.
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel2.4
  - number: 2.4.4
    text: |-
      Een bestuursorgaan is niet verantwoordelijk voor de juistheid of de volledigheid van door derden opgestelde
      informatie.
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel2.4
  - number: 2.4.5
    text: |-
      Indien het bestuursorgaan kennis draagt van de onjuistheid of onvolledigheid van de verstrekte informatie, doet het
      hiervan mededeling.
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel2.4
  - number: 2.4.6
    text: |-
      Indien het bestuursorgaan informatie verstrekt, verstrekt het zo nodig, en voor zover deze informatie voorhanden
      is, tevens informatie over de methoden die zijn gebruikt bij het samenstellen van de informatie.
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel2.4
  - number: '2.5'
    text: |-
      Bij de toepassing van deze wet wordt uitgegaan van het algemeen belang van openbaarheid van publieke informatie
      voor de democratische samenleving.
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel2.5
  - number: 3.1.1
    text: |-
      Het bestuursorgaan dat het rechtstreeks aangaat, maakt bij de uitvoering van zijn taak uit eigen
      beweging de bij het bestuursorgaan berustende informatie neergelegd in documenten voor eenieder openbaar,
      indien dit zonder onevenredige inspanning of kosten redelijkerwijs mogelijk is, behoudens voor zover de
      [artikelen 5.1, eerste, tweede en vijfde lid][ref1], en [5.2][ref2] aan openbaarmaking in de weg staan of met
      de openbaarmaking geen redelijk belang wordt gediend. Deze informatie betreft in ieder geval informatie over het
      beleid, inclusief de voorbereiding, uitvoering, naleving, handhaving en evaluatie.


      [ref1]: https://wetten.overheid.nl/BWBR0045754#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0045754#Artikel5
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0045754
        artikel: '5'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0045754
        artikel: '5'
        hoofdstuk: '5'
  - number: 3.1.2
    text: |-
      Het bestuursorgaan doet bij een gedeeltelijke niet-openbaarmaking hiervan mededeling gelijktijdig met de
      openbaarmaking.
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel3.1
  - number: 3.1.3
    text: |-
      Documenten als bedoeld in het eerste lid worden niet openbaar gemaakt dan nadat belanghebbenden die naar
      verwachting bedenkingen zullen hebben tegen openbaarmaking, in de gelegenheid zijn gesteld binnen een door het
      bestuursorgaan gestelde termijn hun zienswijze naar voren te brengen.
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel3.1
  - number: 3.1.4
    text: |-
      Het bestuursorgaan deelt een belanghebbende mede dat toepassing wordt gegeven aan het eerste lid, onder vermelding
      van het tijdstip van openbaarmaking en de openbaar te maken documenten. De mededeling wordt gelijkgesteld met een
      besluit.
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel3.1
  - number: 3.3.1
    text: 'Een bestuursorgaan maakt in ieder geval uit eigen beweging openbaar:'
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel3.3
  - number: 3.3.1.a
    text: wetten en andere algemeen verbindende voorschriften;
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel3.3
  - number: 3.3.1.b
    text: overige besluiten van algemene strekking;
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel3.3
  - number: 3.3.1.d
    text: inzicht in zijn organisatie en werkwijze, waaronder de taken en bevoegdheden van de organisatieonderdelen;
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel3.3
  - number: 3.3.1.e
    text: |-
      de bereikbaarheid van het bestuursorgaan en zijn organisatieonderdelen en de wijze waarop een verzoek om informatie
      kan worden ingediend.
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel3.3
  - number: 3.3.2
    text: |-
      Behoudens voor zover de [artikelen 5.1, eerste, tweede en vijfde lid][ref1], en [5.2][ref2] daaraan in de weg
      staan, maakt het bestuursorgaan voorts uit eigen beweging openbaar:


      [ref1]: https://wetten.overheid.nl/BWBR0045754#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0045754#Artikel5
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0045754
        artikel: '5'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0045754
        artikel: '5'
        hoofdstuk: '5'
  - number: 3.3.2.b
    text: |-
      vergaderstukken en verslagen van de Kamers en de verenigde vergadering der Staten-Generaal en hun commissies,
      tenzij deze betrekking hebben op door de regering vertrouwelijk aan de Staten-Generaal verstrekte informatie;
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel3.3
  - number: 3.3.3
    text: 'Op voordracht van Onze Minister kan bij algemene maatregel van bestuur worden bepaald dat:'
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel3.3
  - number: 3.3.3.a
    text: |-
      het bestuursorgaan andere categorieën van informatie uit eigen beweging openbaar maakt overeenkomstig het eerste of
      tweede lid; en
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel3.3
  - number: 3.3.3.b
    text: |-
      categorieën van beschikkingen worden aangewezen die in afwijking van het tweede lid, onderdeel k, uit eigen
      beweging openbaar gemaakt worden.
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel3.3
  - number: 3.3.4
    text: |-
      De openbaarmaking, bedoeld in het eerste en tweede lid, geschiedt zo spoedig mogelijk, doch uiterlijk binnen twee
      weken na vaststelling of ontvangst van de informatie.
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel3.3
  - number: 3.3.5
    text: 'In afwijking van het vierde lid:'
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel3.3
  - number: 3.3.5.a
    text: |-
      worden de ontwerpen en de bijbehorende adviesaanvragen, bedoeld in het eerste lid, onderdeel c, alsmede de
      daarop betrekking hebbende adviezen, bedoeld in het tweede lid, onderdeel e, onder 1°, door het bestuursorgaan
      dat het advies heeft gevraagd openbaar gemaakt uiterlijk gelijktijdig met de indiening van het voorstel van wet
      bij de Staten-Generaal dan wel de bekendmaking van het algemeen verbindend voorschrift of besluit, indien het
      bestuursorgaan in zijn adviesaanvraag heeft gemotiveerd dat eerdere openbaarmaking afbreuk zou doen aan een met de
      wet, het voorschrift of het besluit beoogde doel;
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel3.3
  - number: 3.3.5.b
    text: |-
      worden in geval van voorstellen van algemene begrotingswetten en de stukken betreffende
      de verantwoording van de ontvangsten en de uitgaven van het Rijk als bedoeld in
      [artikel 105, eerste, tweede en derde lid, van de Grondwet][ref1], de daarbij behorende toelichtende stukken,
      alsmede in geval van een op het in [artikel 65 van de Grondwet][ref2] bedoelde tijdstip ingediende voorstel van wet
      voor zover dat voorstel betrekking heeft op het heffen van belasting, de versies waarover een adviesaanvraag wordt
      gedaan, de op die versies betrekking hebbende adviezen als bedoeld in het tweede lid, onderdeel e, en de op die
      versies betrekking hebbende onderzoeken als bedoeld in het tweede lid, onderdeel j, openbaar gemaakt gelijktijdig
      met de indiening van het voorstel van wet of de stukken bij de Staten-Generaal;


      [ref1]: https://wetten.overheid.nl/BWBR0001840#Artikel105
      [ref2]: https://wetten.overheid.nl/BWBR0001840#Artikel65
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0001840
        artikel: '105'
      - id: ref2
        bwb_id: BWBR0001840
        artikel: '65'
  - number: 3.3.5.c
    text: |-
      worden vergaderstukken als bedoeld in het tweede lid, onderdelen b en c, openbaar gemaakt, gelijktijdig met de
      verspreiding aan de deelnemers van de betreffende vergadering;
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel3.3
  - number: 3.3.5.d
    text: |-
      worden agenda’s als bedoeld in het tweede lid, onderdeel d, openbaar gemaakt, uiterlijk bij aanvang van de
      betreffende vergadering;
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel3.3
  - number: 3.3.5.e
    text: |-
      wordt de inhoud van een schriftelijk verzoek als bedoeld in het tweede lid, onderdeel i, openbaar gemaakt met de
      beslissing op dat verzoek;
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel3.3
  - number: 3.3.5.f
    text: |-
      geschiedt de openbaarmaking van onderzoeken als bedoeld in het tweede lid, onderdeel j, onder 1°, uiterlijk binnen
      vier weken na ontvangst van het onderzoek;
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel3.3
  - number: 3.3.5.g
    text: |-
      geschiedt de openbaarmaking van een beschikking houdende een herstelsanctie die niet in het tweede lid, onderdeel
      k, onder 6, is uitgezonderd, uiterlijk twee weken nadat de beschikking onherroepelijk is geworden;
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel3.3
  - number: 3.3.5.h
    text: |-
      worden ingekomen documenten als bedoeld in het tweede lid, niet openbaar gemaakt dan nadat belanghebbenden die naar
      verwachting bedenkingen zullen hebben tegen openbaarmaking, in de gelegenheid zijn gesteld binnen twee weken hun
      zienswijze naar voren te brengen;
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel3.3
  - number: 3.3.5.i
    text: |-
      worden documenten als bedoeld in het tweede lid, waarbij gedurende de voorbereiding ervan of na toepassing
      van onderdeel h is gebleken dat een belanghebbende naar verwachting bezwaar heeft tegen een voorgeschreven
      openbaarmaking, openbaar gemaakt na twee weken na vaststelling, onderscheidenlijk het verstrijken van de op grond
      van onderdeel h gestelde termijn om een zienswijze naar voren te brengen.
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel3.3
  - number: 3.3.6
    text: 'De openbaarmaking, bedoeld in het tweede lid, onderdeel e, geschiedt:'
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel3.3
  - number: 3.3.6.a
    text: voor een adviesaanvraag aan een adviescollege of -commissie door het bestuursorgaan dat het advies heeft gevraagd;
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel3.3
  - number: 3.3.6.b
    text: |-
      voor een advies van een adviescollege of -commissie door dat adviescollege of die commissie, behoudens de gevallen,
      bedoeld in het vijfde lid, onderdelen a en b;
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel3.3
  - number: 3.3.6.c
    text: voor een advies van een andere externe partij door het bestuursorgaan dat het advies heeft ontvangen.
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel3.3
  - number: 3.3.7
    text: |-
      Het bestuursorgaan deelt een belanghebbende mede dat toepassing wordt gegeven aan het vijfde lid, onderdeel i,
      onder vermelding van het tijdstip van openbaarmaking en de openbaar te maken documenten. De mededeling wordt
      gelijkgesteld met een besluit.
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel3.3
  - number: 3.3.8
    text: |-
      Het bestuursorgaan doet mededeling van een gedeeltelijke niet-openbaarmaking gelijktijdig met de openbaarmaking.
      Van een gehele niet-openbaarmaking doet het bestuursorgaan mededeling op de wijze en het tijdstip waarop het niet-
      openbaar gemaakte stuk openbaar zou zijn gemaakt.
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel3.3
  - number: 3.3.9
    text: |-
      Onze Minister kan bij ministeriële regeling nadere regels stellen over de wijze waarop in dit artikel genoemde
      documenten actief openbaar worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel3.3
  - number: 3.3a.1
    text: |-
      Een bestuursorgaan kan in plaats van door openbaarmaking overeenkomstig
      [artikel 3.3, tweede lid, onderdeel k][ref1], de informatie over beschikkingen inzake subsidies aan anderen dan
      natuurlijke personen openbaar maken in een voor personen elektronisch raadpleegbaar overzicht, waarbij, voor
      zover de informatie in de beschikking is opgenomen en de [artikelen 5.1, eerste, tweede en vijfde lid][ref2], en
      [5.2][ref3] niet aan openbaarmaking in de weg staan, in ieder geval openbaar wordt gemaakt:


      [ref1]: https://wetten.overheid.nl/BWBR0045754#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0045754#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0045754#Artikel5
    url: https://wetten.overheid.nl/BWBR0045754/2024-11-01#Artikel3.3a
    references:
      - id: ref1
