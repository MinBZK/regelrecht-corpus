---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: kaderregeling_vws_subsidies
regulatory_layer: WET
publication_date: '2016-02-10'
valid_from: '2015-02-17'
bwb_id: BWBR0029947
url: https://wetten.overheid.nl/BWBR0029947/2015-02-17
preamble:
  text: |-
    Gelet op de artikelen 3 en 5 van de Kaderwet VWS-subsidies;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze regeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel1
  - number: 1.a
    text: '*minister:* Minister van Volksgezondheid, Welzijn en Sport;'
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel1
  - number: 1.b
    text: |-
      *instelling:* privaatrechtelijke rechtspersoon met volledige rechtsbevoegdheid, dan wel een rechtspersoon krachtens
      publiekrecht ingesteld;
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel1
  - number: 1.c
    text: |-
      *instellingssubsidie:* subsidie voor dezelfde of in hoofdzaak dezelfde voortdurende, structurele activiteiten van
      een instelling;
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel1
  - number: 1.d
    text: '*projectsubsidie:* subsidie voor tijdelijke, incidentele activiteiten;'
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel1
  - number: 1.e
    text: '*subsidie:* instellingssubsidie of projectsubsidie;'
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel1
  - number: 1.f
    text: |-
      *jaarrekening:* jaarrekening als bedoeld in [artikel 361 van Boek 2 van het Burgerlijk Wetboek][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel361
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '361'
  - number: 1.g
    text: |-
      *accountant:* accountant als bedoeld in [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: 1.h
    text: |-
      *kosten:* kosten van de subsidieontvanger voor zover die samenhangen met de te subsidiëren of gesubsidieerde
      activiteit;
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel1
  - number: 1.i
    text: '*eigen bijdrage:* bijdrage van de subsidieontvanger zelf voor de te subsidiëren of gesubsidieerde activiteit;'
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel1
  - number: 1.j
    text: |-
      *bijdragen van derden:* bijdragen die de subsidieontvanger van een derde ontvangt en die de subsidieontvanger
      aanwendt voor de te subsidiëren of gesubsidieerde activiteit;
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel1
  - number: 1.k
    text: |-
      *opbrengsten:* eigen bijdrage en bijdragen van derden, vermeerderd met de aangevraagde, verleende of vastgestelde
      subsidie;
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel1
  - number: 1.l
    text: |-
      *egalisatiereserve:* egalisatiereserve, bedoeld in [artikel 34][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0029947#Artikel34
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0029947
        artikel: '34'
        paragraaf: '6'
  - number: '2.1'
    text: De minister verstrekt uitsluitend subsidies voor zover de verstrekking past in zijn beleid.
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel2
  - number: '2.2'
    text: Subsidies van minder dan € 125.000 worden niet verleend of zonder voorafgaande verlening vastgesteld.
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel2
  - number: '2.3'
    text: 'Het tweede lid geldt niet voor:'
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel2
  - number: 2.3.a
    text: subsidies met betrekking tot oorlogsgetroffenen en herinnering Wereldoorlog II;
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel2
  - number: 2.3.b
    text: subsidies uit hoofde van het Beleidskader voor subsidiëring van patiënten- en gehandicaptenorganisaties;
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel2
  - number: 2.3.e
    text: |-
      subsidies aan organisaties als bedoeld in
      [artikel 14 van de Wet op de beroepen in de individuele gezondheidszorg][ref1] voor activiteiten met betrekking
      tot specialistenregisters van wettelijk erkende specialistentitels;


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel14
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '14'
  - number: 2.3.f
    text: subsidies uit hoofde van het Beleidskader anonieme e-mental health 2014.
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel2
  - number: '2.4'
    text: |-
      Uit hoofde van het Beleidskader voor subsidiëring van patiënten- en gehandicaptenorganisaties kan onder
      overeenkomstige toepassing van [artikel 8, onderdeel a, onder 2°][ref1], een subsidie worden verstrekt tot een
      bedrag van € 125.000.


      [ref1]: https://wetten.overheid.nl/BWBR0029947#Artikel8
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0029947
        artikel: '8'
        paragraaf: '1'
  - number: '3'
    text: De minister maakt de hoofdlijnen van zijn beleid bekend aan de Tweede Kamer der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel3
  - number: '4'
    text: Een projectsubsidie kan worden verstrekt aan een instelling of een natuurlijke persoon.
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel4
  - number: '5'
    text: Een instellingssubsidie kan uitsluitend worden verstrekt aan een instelling.
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel5
  - number: '6.1'
    text: |-
      De minister verstrekt een projectsubsidie van die minder bedraagt dan € 25.000 en zonder voorafgaande verlening
      wordt vastgesteld slechts na afloop van de periode waarvoor de subsidie wordt aangevraagd.
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel6
  - number: '6.2'
    text: |-
      De minister verleent een projectsubsidie slechts voor een periode die aanvangt na ontvangst van de aanvraag van
      de projectsubsidie.
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel6
  - number: '6.3'
    text: |-
      Het tweede lid geldt niet voor aan jeugdhulporganisaties te verstrekken subsidies ten behoeve van bijzondere
      kosten die in het kader van de transitie van de jeugdhulp naar gemeenten als gevolg van de inwerkingtreding van de
      Jeugdwet gemaakt worden.
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel6
  - number: '6.4'
    text: De minister kan een projectsubsidie verstrekken voor een periode die zich uitstrekt over meer dan een kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel6
  - number: '6.5'
    text: Een projectsubsidie wordt voor ten hoogste vier jaren verstrekt.
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel6
  - number: '7.1'
    text: Een instellingssubsidie wordt voor de periode van een boekjaar verstrekt.
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel7
  - number: '7.2'
    text: |-
      De subsidieontvanger stelt het boekjaar gelijk aan het kalenderjaar, tenzij bij de subsidieverlening anders is
      bepaald.
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel7
  - number: '7.3'
    text: De minister verstrekt een instellingsubsidie van minder dan € 25.000 slechts na afloop van het boekjaar.
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel7
  - number: '8'
    text: 'De minister verstrekt uitsluitend:'
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel8
  - number: 8.a
    text: 'indien de subsidie minder dan € 25.000 bedraagt:'
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel8
  - number: 8.a.1°
    text: |-
      een subsidie die zonder voorafgaande verlening direct wordt vastgesteld op een bedrag waarvan de hoogte door de
      minister bij de vaststelling wordt genoemd of
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel8
  - number: 8.a.2°
    text: |-
      een subsidie die ambtshalve wordt vastgesteld op een bedrag waarvan de hoogte door de minister bij de verlening
      is genoemd,
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel8
  - number: 8.b
    text: |-
      een subsidie die wordt vastgesteld op een bedrag per gerealiseerde prestatie-eenheid waarvan de hoogte door
      de minister bij de verlening is genoemd, voor ten hoogste het aantal maximum prestatie-eenheden dat door de
      minister bij de verlening is genoemd: indien de subsidie € 25.000 of meer bedraagt en de activiteiten uit meetbare
      prestatie-eenheden bestaan,
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel8
  - number: 8.c
    text: |-
      een subsidie die wordt vastgesteld op een bedrag waarvan de hoogte door de minister bij de verlening is genoemd:
      indien de subsidie € 25.000 tot € 125.000 bedraagt en er naar het oordeel van de minister voldoende zekerheid
      bestaat over de kosten en opbrengsten,
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel8
  - number: 8.d
    text: |-
      een subsidie die wordt vastgesteld op een bedrag dat bestaat uit de totale werkelijke kosten verminderd met de
      totale werkelijke bijdragen van derden en de begrote eigen bijdrage, maar dat niet hoger is dan het maximum dat
      door de minister bij de verlening is genoemd: indien de subsidie € 25.000 tot € 125.000 bedraagt en er vanwege
      de aard van de activiteiten naar het oordeel van de minister onvoldoende zekerheid bestaat over de kosten en
      opbrengsten,
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel8
  - number: 8.e
    text: |-
      een subsidie die wordt vastgesteld op een bedrag dat bestaat uit de werkelijke kosten, verminderd met de werkelijke
      bijdragen van derden en de begrote eigen bijdrage, maar dat niet hoger is dan het maximum dat door de minister bij
      de verlening is genoemd: indien het een projectsubsidie betreft en de subsidie € 125.000 of meer bedraagt, of
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel8
  - number: 8.f
    text: |-
      een subsidie die wordt vastgesteld op een bedrag waarvan de hoogte door de minister bij de verlening is
      genoemd, verminderd met de eventuele overschrijding van de maximaal toegestane egalisatiereserve: indien het een
      instellingssubsidie betreft en de subsidie € 125.000 of meer bedraagt.
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel8
  - number: '9.1'
    text: |-
      De kosten worden berekend op basis van een controleerbare, voor de subsidieontvanger gebruikelijke methode, die is
      gebaseerd op bedrijfseconomische grondslagen en normen die in het maatschappelijk verkeer als aanvaardbaar worden
      beschouwd en die door de subsidieontvanger stelselmatig worden toegepast.
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel9
  - number: '9.2'
    text: De afschrijving van materiële vaste activa wordt berekend op basis van historische aanschafprijzen.
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel9
  - number: '9.3'
    text: |-
      Toevoegingen aan voorzieningen en reserveringen zijn geen subsidiabele kosten, tenzij de minister deze toevoegingen
      schriftelijk heeft goedgekeurd.
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel9
  - number: '10'
    text: De minister kan een subsidieplafond vaststellen.
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel10
  - number: '11'
    text: |-
      Bij projectsubsidies verdeelt de minister het ingevolge het subsidieplafond beschikbare bedrag in volgorde van
      datum van ontvangst van de aanvragen of na onderlinge afweging van de aanvragen.
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel11
  - number: '12'
    text: |-
      Bij instellingssubsidies verdeelt de minister het ingevolge het subsidieplafond beschikbare bedrag na onderlinge
      afweging van de aanvragen.
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel12
  - number: '13.1'
    text: |-
      Indien het ingevolge het subsidieplafond beschikbare bedrag in volgorde van ontvangst van de aanvragen wordt
      verdeeld:
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel13
  - number: 13.1.a
    text: |-
      geldt, indien de aanvraag krachtens [artikel 4:5 van de Algemene wet bestuursrecht][ref1] is aangevuld, bij de
      verdeling de dag waarop de aangevulde aanvraag is ontvangen als de datum van ontvangst;


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 13.1.b
    text: |-
      stelt de minister de onderlinge rangschikking van aanvragen die op dezelfde dag zijn ontvangen door middel van
      loting vast, indien honorering van al deze aanvragen ertoe zou leiden dat het subsidieplafond wordt overschreden.
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel13
  - number: '13.2'
    text: |-
      Indien het ingevolge het subsidieplafond beschikbare bedrag na onderlinge afweging van de aanvragen wordt
      verdeeld, geeft de minister die aanvragen voorrang waarvan de inwilliging in vergelijking met andere aanvragen
      naar verwachting van meer belang is voor het beleid en meer zal bijdragen aan de verwezenlijking van het doel van
      de subsidie.
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel13
  - number: '14'
    text: |-
      De minister kan tegelijk met het vaststellen van het subsidieplafond bepalen dat het ingevolge het subsidieplafond
      beschikbare bedrag op een wijze wordt verdeeld die afwijkt van de [artikelen 11][ref1], [12][ref2] en [13][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0029947#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0029947#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0029947#Artikel13
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0029947
        artikel: '11'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0029947
        artikel: '12'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0029947
        artikel: '13'
        paragraaf: '2'
  - number: '15.1'
    text: Voor een aanvraag tot verlening van een subsidie wordt een door de minister vastgesteld formulier gebruikt.
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel15
  - number: '15.2'
    text: |-
      Het aanvraagformulier wordt ondertekend door de aanvrager of door een persoon die bevoegd is de aanvrager te
      vertegenwoordigen.
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel15
  - number: '16.1'
    text: |-
      Een aanvraag tot verlening van een projectsubsidie wordt ingediend voor aanvang van de periode waarvoor
      projectsubsidie wordt aangevraagd.
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel16
  - number: '16.2'
    text: |-
      De verplichting, bedoeld in het eerste lid, geldt niet voor aanvragen van een subsidie als bedoeld in
      [artikel 6, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0029947#Artikel6
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0029947
        artikel: '6'
        paragraaf: '1'
  - number: '17'
    text: |-
      Een aanvraag tot verlening van een instellingssubsidie wordt ingediend uiterlijk dertien weken voor de aanvang van
      het boekjaar waarvoor de instellingssubsidie wordt aangevraagd.
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel17
  - number: '18.1'
    text: |-
      Bij het vaststellen van een subsidieplafond waarvan het beschikbare bedrag na onderlinge afweging van de aanvragen
      wordt verdeeld, bepaalt de minister dat aanvragen vóór een door hem vastgestelde datum dienen te zijn ontvangen.
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel18
  - number: '18.2'
    text: |-
      De minister kan bepalen dat aanvragen op een bepaald beleidsterrein binnen een door hem vastgestelde periode worden
      ontvangen.
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel18
  - number: '18.3'
    text: |-
      De minister kan vrijstelling en ontheffing verlenen van de termijn, bedoeld in [artikel 17][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0029947#Artikel17
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0029947
        artikel: '17'
        paragraaf: '3'
  - number: '19'
    text: 'De aanvraag tot verlening van de subsidie bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel19
  - number: 19.a
    text: een activiteitenplan, tenzij redelijkerwijs kan worden aangenomen dat daaraan geen behoefte is, en
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel19
  - number: 19.b
    text: een begroting, tenzij deze voor de berekening van het bedrag van de subsidie niet van belang is.
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel19
  - number: '20'
    text: 'Het activiteitenplan:'
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel20
  - number: 20.a
    text: behelst een overzicht van de activiteiten waarvoor subsidie wordt aangevraagd,
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel20
  - number: 20.b
    text: beschrijft aard, omvang, duur en wijze van uitvoering van de activiteiten en
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel20
  - number: 20.c
    text: beschrijft de met de activiteiten nagestreefde doelstellingen.
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel20
  - number: '21.1'
    text: |-
      De begroting behelst per activiteit een overzicht van de geraamde kosten en opbrengsten van de aanvrager, voor
      zover deze betrekking hebben op de periode waarvoor subsidie wordt aangevraagd.
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel21
  - number: '21.2'
    text: De begrotingsposten worden ieder afzonderlijk van een toelichting voorzien.
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel21
  - number: '21.3'
    text: De begroting is sluitend.
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel21
  - number: '22'
    text: |-
      Voor zover de aanvrager voor dezelfde begrote kosten tevens subsidie of een andere financiële bijdrage heeft
      aangevraagd bij een ander bestuursorgaan, doet hij daarvan mededeling in de aanvraag tot verlening van de subsidie,
      onder vermelding van de stand van zaken met betrekking tot de beoordeling van die andere aanvraag.
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel22
  - number: '23'
    text: |-
      Op verzoek van de minister legt de privaatrechtelijke rechtspersoon of de natuurlijke persoon die verlening van een
      projectsubsidie aanvraagt, een volledig en recent overzicht van zijn financiële toestand over.
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel23
  - number: '24.1'
    text: |-
      Indien de aanvraag tot verlening van de instellingssubsidie wordt ingediend door een privaatrechtelijke
      rechtspersoon waaraan de minister geen instellingssubsidie heeft verstrekt ten behoeve van het boekjaar voorafgaand
      aan het boekjaar waarvoor de instellingssubsidie wordt aangevraagd, gaat de aanvraag voorts vergezeld van:
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel24
  - number: 24.1.a
    text: |-
      een afschrift van de oprichtingsakte van de rechtspersoon dan wel van de statuten zoals deze laatstelijk zijn
      gewijzigd en
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel24
  - number: 24.1.b
    text: |-
      de laatst opgemaakte jaarrekening dan wel de balans en de staat van baten en lasten en de toelichting daarop of,
      indien deze bescheiden ontbreken, een verslag over de financiële positie van de aanvrager op het moment van de
      aanvraag.
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel24
  - number: '24.2'
    text: De minister kan vrijstelling en ontheffing verlenen van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel24
  - number: '25.1'
    text: De minister besluit binnen dertien weken na ontvangst van de aanvraag over de verlening van de subsidie.
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel25
  - number: '25.2'
    text: |-
      Indien toepassing is gegeven aan [artikel 18, eerste lid][ref1], neemt de minister in afwijking van het eerste lid
      binnen dertien weken na de door hem vastgestelde datum een besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0029947#Artikel18
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0029947
        artikel: '18'
        paragraaf: '3'
  - number: '25.3'
    text: 'De termijnen, bedoeld in het eerste en tweede lid, zijn tweeëntwintig weken in plaats van dertien weken indien:'
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel25
  - number: 25.3.a
    text: sprake is van cofinanciering in het kader van een fonds of programma van de Europese Unie,
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel25
  - number: 25.3.b
    text: de minister over de aanvraag advies vraagt of
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel25
  - number: 25.3.c
    text: de minister ter zake van de aanvraag een nader onderzoek instelt.
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel25
  - number: '25.4'
    text: |-
      De termijnen, bedoeld in het eerste en tweede lid, zijn veertig weken in plaats van dertien weken indien de
      verlening afhankelijk is van het oordeel van een internationale commissie of van buitenlandse deskundigen.
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel25
  - number: '25.5'
    text: |-
      Indien een termijn als bedoeld in het derde of vierde lid van toepassing is, deelt de minister dat zo spoedig
      mogelijk mee aan de aanvrager.
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel25
  - number: '26'
    text: |-
      Een subsidie ten laste van een begroting die nog niet is vastgesteld, wordt verleend onder de voorwaarde, bedoeld
      in [artikel 4:34, eerste lid, van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 26a
    text: |-
      De minister bepaalt in het besluit tot verlening van de subsidie, bedoeld in
      [artikel 8, onderdeel a, onder 2°][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0029947#Artikel8
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel26a
    references:
      - id: ref1
        bwb_id: BWBR0029947
        artikel: '8'
        paragraaf: '1'
  - number: 26a.a
    text: voor welke periode de subsidie wordt verleend,
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel26a
  - number: 26a.b
    text: voor welke activiteiten de subsidie wordt verleend,
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel26a
  - number: 26a.c
    text: het bedrag dat aan subsidie wordt verleend,
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel26a
  - number: 26a.d
    text: de datum waarop de activiteiten uiterlijk moeten zijn verricht en
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel26a
  - number: 26a.e
    text: de datum waarop de subsidie uiterlijk ambtshalve wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel26a
  - number: '27'
    text: |-
      De minister bepaalt bij het besluit tot verlening van de subsidie, bedoeld in [artikel 8, onderdeel b][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0029947#Artikel8
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0029947
        artikel: '8'
        paragraaf: '1'
  - number: 27.a
    text: voor welke periode de subsidie wordt verleend,
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel27
  - number: 27.b
    text: wat de prestatie-eenheid is waarvoor de subsidie wordt verleend,
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel27
  - number: 27.c
    text: het bedrag dat per prestatie-eenheid aan subsidie wordt verleend,
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel27
  - number: 27.d
    text: het maximum aantal prestatie-eenheden waarvoor subsidie wordt verleend,
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel27
  - number: 27.e
    text: |-
      op welke wijze de subsidieontvanger kan aantonen dat de prestatie-eenheden waarvoor de subsidie is verleend, zijn
      gerealiseerd en
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel27
  - number: 27.f
    text: |-
      op welke wijze de subsidieontvanger kan aantonen dat voldaan is aan de verplichtingen die verbonden zijn aan de
      verleende subsidie.
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel27
  - number: '28'
    text: |-
      De minister bepaalt in het besluit tot verlening van de subsidie, bedoeld in [artikel 8, onderdeel c][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0029947#Artikel8
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0029947
        artikel: '8'
        paragraaf: '1'
  - number: 28.a
    text: voor welke periode de subsidie wordt verleend,
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel28
  - number: 28.b
    text: voor welke activiteiten de subsidie wordt verleend,
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel28
  - number: 28.c
    text: het bedrag dat aan subsidie wordt verleend,
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel28
  - number: 28.d
    text: |-
      op welke wijze de subsidieontvanger kan aantonen dat de activiteiten waarvoor de subsidie is verleend, zijn
      verricht en
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel28
  - number: 28.e
    text: |-
      op welke wijze de subsidieontvanger kan aantonen dat voldaan is aan de verplichtingen die verbonden zijn aan de
      verleende subsidie.
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel28
  - number: '29'
    text: |-
      De minister vermeldt in het besluit tot verlening van de subsidie, bedoeld in [artikel 8, onderdeel d][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0029947#Artikel8
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0029947
        artikel: '8'
        paragraaf: '1'
  - number: 29.a
    text: voor welke periode de subsidie wordt verleend,
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel29
  - number: 29.b
    text: voor welke activiteiten de subsidie wordt verleend,
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel29
  - number: 29.c
    text: de hoogte van de begrote eigen bijdrage die in aanmerking wordt genomen bij het verstrekken van de subsidie en
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel29
  - number: 29.d
    text: het maximum bedrag dat aan subsidie wordt verleend.
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel29
  - number: '30.1'
    text: |-
      De minister vermeldt in het besluit tot verlening van de projectsubsidie, bedoeld in
      [artikel 8, onderdeel e][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0029947#Artikel8
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0029947
        artikel: '8'
        paragraaf: '1'
  - number: 30.1.a
    text: voor welke periode de projectsubsidie wordt verleend,
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel30
  - number: 30.1.b
    text: voor welke activiteiten de projectsubsidie wordt verleend,
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel30
  - number: 30.1.c
    text: welke kosten per activiteit in aanmerking zijn genomen bij het verlenen van de projectsubsidie,
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel30
  - number: 30.1.d
    text: welke bijdragen van derden per activiteit in aanmerking zijn genomen bij het verlenen van de projectsubsidie,
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel30
  - number: 30.1.e
    text: |-
      de hoogte van de begrote eigen bijdrage die in aanmerking wordt genomen bij het verstrekken van de projectsubsidie
      en
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel30
  - number: 30.1.f
    text: het maximum bedrag dat aan projectsubsidie wordt verleend.
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel30
  - number: '30.2'
    text: |-
      De in het besluit tot verlening vermelde kosten zijn gelijk aan de som van de in dat besluit vermelde bijdragen van
      derden, begrote eigen bijdrage en maximum projectsubsidie.
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel30
  - number: '31.1'
    text: |-
      De minister vermeldt in het besluit tot verlening van de instellingssubsidie, bedoeld in
      [artikel 8, onderdeel f][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0029947#Artikel8
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0029947
        artikel: '8'
        paragraaf: '1'
  - number: 31.1.a
    text: voor welke periode de instellingssubsidie wordt verleend,
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel31
  - number: 31.1.b
    text: voor welke activiteiten de instellingssubsidie wordt verleend,
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel31
  - number: 31.1.c
    text: welke kosten per activiteit in aanmerking zijn genomen bij het verlenen van de instellingssubsidie,
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel31
  - number: 31.1.d
    text: welke bijdragen van derden per activiteit in aanmerking zijn genomen bij het verlenen van de instellingssubsidie,
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel31
  - number: 31.1.e
    text: |-
      de hoogte van de begrote eigen bijdrage die in aanmerking wordt genomen bij het verstrekken van de
      instellingssubsidie en
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel31
  - number: 31.1.f
    text: het bedrag dat aan instellingssubsidie wordt verleend.
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel31
  - number: '31.2'
    text: |-
      De in het besluit tot verlening vermelde kosten zijn gelijk aan de som van de in dat besluit vermelde bijdragen van
      derden, begrote eigen bijdrage en instellingssubsidie.
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel31
  - number: '32.1'
    text: De minister kan bij het besluit tot verlening van een projectsubsidie ambtshalve tevens voorschotten verlenen.
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel32
  - number: '32.2'
    text: De voorschotten worden gelijkmatig verdeeld over het aantal maanden waarvoor de subsidie wordt verleend.
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel32
  - number: '32.3'
    text: Op verzoek van de subsidieontvanger kan de minister van het tweede lid afwijken.
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel32
  - number: '33.1'
    text: |-
      De minister verleent bij het besluit tot verlening van een instellingssubsidie ambtshalve tevens de volgende
      voorschotten: in januari 8%, februari 8%, maart 8%, april 7%, mei 16%, juni 7%, juli 8%, augustus 8%, september 7%,
      oktober 8%, november 8% en december 7% van het bedrag van de verleende instellingssubsidie.
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel33
  - number: '33.2'
    text: |-
      Op verzoek van de subsidieontvanger of indien een aanvraag van een instellingssubsidie later is ingediend dan in
      [artikel 17][ref1] is bepaald, kan de minister van het eerste lid afwijken.


      [ref1]: https://wetten.overheid.nl/BWBR0029947#Artikel17
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0029947
        artikel: '17'
        paragraaf: '3'
  - number: '34.1'
    text: |-
      De ontvanger van de instellingssubsidie die op grond van [artikel 8, onderdeel f][ref1], is verleend, vormt een
      egalisatiereserve.


      [ref1]: https://wetten.overheid.nl/BWBR0029947#Artikel8
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0029947
        artikel: '8'
        paragraaf: '1'
  - number: '34.2'
    text: |-
      De egalisatiereserve bedraagt ten hoogste 10% van het bij het besluit tot verlening bepaalde bedrag van de
      instellingssubsidie dan wel ten hoogste een lager percentage dat door de minister bij het besluit tot verlening
      is bepaald.
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel34
  - number: '34.3'
    text: |-
      Indien de instellingssubsidie wordt verlaagd wegens het niet of niet geheel verrichten van de activiteiten waarvoor
      de instellingssubsidie is verleend, wordt de maximaal toegestane egalisatiereserve berekend op basis van de
      verlaagde instellingssubsidie.
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel34
  - number: '34.4'
    text: De egalisatiereserve bedraagt ten laagste € 0.
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel34
  - number: '35.1'
    text: |-
      De egalisatiereserve wordt in een boekjaar uitsluitend besteed aan activiteiten waarvoor de instellingssubsidie in
      dat boekjaar is verleend en die niet kunnen worden bekostigd uit de instellingssubsidie die is verleend ten behoeve
      van dat boekjaar.
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel35
  - number: '35.2'
    text: |-
      De besteding van de egalisatiereserve wordt verantwoord met het activiteitenverslag en het financieel verslag,
      bedoeld in [artikel 63][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0029947#Artikel63
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0029947
        artikel: '63'
        paragraaf: '8'
  - number: '36.1'
    text: |-
      De egalisatiereserve wordt gevormd door een toevoeging bij een positief eindresultaat en een onttrekking bij een
      negatief eindresultaat. Het eindresultaat is de som van de werkelijke bijdragen van derden, de in het besluit tot
      verlening vermelde begrote eigen bijdrage en de verleende instellingssubsidie verminderd met de werkelijke kosten.
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel36
  - number: '36.2'
    text: |-
      De maximale toevoeging aan de egalisatiereserve is het bedrag dat aan de egalisatiereserve kan worden toegevoegd
      zonder de maximale omvang daarvan te overschrijden. De maximale onttrekking aan de egalisatiereserve is het bedrag
      van de egalisatiereserve.
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel36
  - number: '36.3'
    text: |-
      De toevoeging of onttrekking is gelijk aan het eindresultaat vermenigvuldigd met de verleende instellingssubsidie
      gedeeld door de som van de in het besluit tot verlening vermelde begrote eigen bijdrage en de verleende
      instellingssubsidie.
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel36
  - number: '36.4'
    text: De toevoeging of onttrekking bedraagt niet meer dan de maximale toevoeging of onttrekking.
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel36
  - number: '36.5'
    text: |-
      Voor zover het voor de toevoeging beschikbare bedrag hoger is dan de maximale toevoeging, wordt dat bedrag bij de
      vaststelling in mindering gebracht op de instellingssubsidie.
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel36
  - number: '36.6'
    text: |-
      Voor de toepassing van de vorige leden worden uitsluitend in aanmerking genomen de kosten, de bijdragen van derden
      en de instellingssubsidie met betrekking tot activiteiten waarvoor de instellingssubsidie is verleend en die
      werkelijk zijn verricht.
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel36
  - number: '37'
    text: 'Indien een subsidie is verleend, zorgt de subsidieontvanger ervoor dat:'
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel37
  - number: 37.a
    text: de doelstellingen van de gesubsidieerde activiteiten op doelmatige wijze worden nagestreefd,
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel37
  - number: 37.b
    text: de uitvoering van de gesubsidieerde activiteiten op verantwoorde wijze wordt bestuurd en
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel37
  - number: 37.c
    text: de voor de uitvoering van de gesubsidieerde activiteiten benodigde middelen op verantwoorde wijze worden beheerd.
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel37
  - number: '38.1'
    text: |-
      Indien een subsidie als bedoeld in [artikel 8, onderdeel b][ref1], is verleend, houdt de subsidieontvanger een
      zodanig ingerichte registratie bij dat daarin altijd de gerealiseerde prestatie-eenheden kunnen worden nagegaan.


      [ref1]: https://wetten.overheid.nl/BWBR0029947#Artikel8
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0029947
        artikel: '8'
        paragraaf: '1'
  - number: '38.2'
    text: De administratie wordt op overzichtelijke, controleerbare en doelmatige wijze ingericht.
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel38
  - number: '38.3'
    text: De administratie en de daartoe behorende bescheiden worden gedurende tien jaren bewaard.
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel38
  - number: '39.1'
    text: |-
      Indien een subsidie als bedoeld in [artikel 8, onderdeel d, e of f][ref1], is verleend, voert de subsidieontvanger
      een zodanig ingerichte administratie, dat daarin altijd de voor de vaststelling van de subsidie van belang zijnde
      rechten en verplichtingen, betalingen en ontvangsten alsmede kosten en opbrengsten kunnen worden nagegaan.


      [ref1]: https://wetten.overheid.nl/BWBR0029947#Artikel8
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0029947
        artikel: '8'
        paragraaf: '1'
  - number: '39.2'
    text: |-
      [Artikel 38, tweede en derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0029947#Artikel38
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0029947
        artikel: '38'
        paragraaf: '7'
  - number: '40.1'
    text: |-
      Indien een projectsubsidie voor meer dan twaalf maanden wordt verleend, kan de minister verlangen dat de
      subsidieontvanger eenmaal per twaalf maanden verslag doet van de voortgang van de gesubsidieerde activiteiten.
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel40
  - number: '40.2'
    text: |-
      Het besluit tot verlening van de projectsubsidie vermeldt op welke tijdstippen het verslag gedaan wordt en waaruit
      het verslag bestaat.
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel40
  - number: '41.1'
    text: 'De subsidieontvanger meldt meteen aan de minister als:'
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel41
  - number: 41.1.a
    text: |-
      het tijdens de periode waarvoor de subsidie is verleend aannemelijk is geworden dat de activiteiten waarvoor de
      subsidie is verleend niet, niet tijdig of niet geheel zullen worden verricht,
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel41
  - number: 41.1.b
    text: het aannemelijk is geworden dat niet of niet geheel aan de subsidieverplichtingen zal worden voldaan of
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel41
  - number: 41.1.c
    text: |-
      zich andere omstandigheden voordoen of zullen voordoen die van belang kunnen zijn voor een beslissing tot
      wijziging, intrekking of vaststelling van de subsidie.
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel41
  - number: '41.2'
    text: |-
      Indien een subsidie als bedoeld in [artikel 8, onderdeel a, onder 2°][ref1], is verleend, doet de
      subsidieontvanger onverwijld een schriftelijke melding bij de minister zodra de datum waarop de activiteiten
      uiterlijk moeten zijn verricht is verstreken zonder dat de activiteiten geheel zijn verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0029947#Artikel8
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0029947
        artikel: '8'
        paragraaf: '1'
  - number: '41.3'
    text: |-
      De melding wordt schriftelijk gedaan. De melding wordt voorzien van een toelichting. Bij de melding worden de
      relevante stukken overgelegd.
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel41
  - number: '42'
    text: |-
      De subsidieontvanger die aan derden goederen ter beschikking stelt of voor derden diensten verricht, brengt
      daarvoor een vergoeding in rekening die ten minste kostendekkend is, tenzij het derden betreft voor wie de
      gesubsidieerde activiteiten bestemd zijn.
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel42
  - number: '43'
    text: |-
      De subsidieontvanger werkt, onder meer door het verschaffen van de daartoe benodigde inlichtingen, gegevens en
      bescheiden, mee aan door of namens de minister ingesteld onderzoek dat erop is gericht de minister inlichtingen
      te verschaffen:
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel43
  - number: 43.a
    text: die van belang zijn voor het nemen van een besluit over het verstrekken van de subsidie of
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel43
  - number: 43.b
    text: voor de ontwikkeling van het beleid van de minister.
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel43
  - number: '44.1'
    text: |-
      Indien een instellingssubsidie is verleend, verzekert de subsidieontvanger haar roerende en onroerende zaken op
      afdoende wijze tegen het risico van diefstal en brand alsmede tegen het risico van wettelijke aansprakelijkheid
      tegenover derden.
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel44
  - number: '44.2'
    text: |-
      Indien een instellingssubsidie is verleend, verzekert de subsidieontvanger de wettelijke aansprakelijkheid van
      vrijwilligers die werkzaamheden verrichten in het kader van de gesubsidieerde activiteiten.
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel44
  - number: '44.3'
    text: Op verzoek van de subsidieontvanger kan de minister ontheffing verlenen van het eerste of tweede lid.
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel44
  - number: '45.1'
    text: |-
      Indien een gesubsidieerde activiteit leidt tot een publicatie, kan de minister bepalen dat de subsidieontvanger er
      voor zorgt dat bij de publicatie wordt aangegeven wie de uitvoerder en subsidiënt van de activiteit zijn geweest.
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel45
  - number: '45.2'
    text: |-
      Indien de subsidie gericht is of mede gericht is op de totstandkoming van een werk als bedoeld in
      [artikel 10, onder 1°, van de Auteurswet][ref1], zorgt de subsidieontvanger er voor auteursrechthebbende te zijn
      ter zake van dat werk.


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel10
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: '10'
  - number: '45.3'
    text: |-
      De subsidieontvanger vrijwaart de Staat der Nederlanden voor aanspraken van derden ter zake van alle schade die zij
      lijden ten gevolge van de door of vanwege de subsidieontvanger verrichte publicaties.
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel45
  - number: '46'
    text: |-
      [Artikel 4:71 van de Algemene wet bestuursrecht][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '47'
    text: |-
      Indien de activiteiten waarvoor de instellingssubsidie is verstrekt geheel of gedeeltelijk worden beëindigd of
      indien de instellingssubsidie wordt beëindigd, verstrekt de subsidieontvanger aan de minister op diens verzoek alle
      gegevens, bescheiden, informatie, medewerking en gebruiksrechten op auteursrechten die redelijkerwijs verlangd kan
      worden of kunnen worden voor de continuïteit van de activiteiten waarvoor de instellingssubsidie is verstrekt.
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel47
  - number: '48.1'
    text: |-
      In de gevallen, bedoeld in [artikel 4:41, tweede lid, van de Algemene wet bestuursrecht][ref1], is de
      subsidieontvanger aan de minister een door de minister te bepalen vergoeding verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '48.2'
    text: |-
      De subsidieontvanger meldt meteen aan de minister als zich een geval, bedoeld in
      [artikel 4:41, tweede lid, onder a, b, c en e, van de Algemene wet bestuursrecht][ref1], voordoet.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '48.3'
    text: |-
      Bij de bepaling van de hoogte van de vergoeding wordt uitgegaan van de waarde van de goederen en andere
      vermogensbestanddelen, waaronder de egalisatiereserve, op het tijdstip waarop de vergoeding verschuldigd wordt, met
      dien verstande dat:
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel48
  - number: 48.3.a
    text: de waarde van de egalisatiereserve gelijk is aan het bedrag van de egalisatiereserve;
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel48
  - number: 48.3.b
    text: |-
      de waarde van een schadevergoeding voor verlies of beschadiging van zaken gelijk is aan het bedrag dat als
      schadevergoeding door de subsidieontvanger wordt ontvangen;
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel48
  - number: 48.3.c
    text: |-
      de waarde van onroerende zaken wordt bepaald door drie onafhankelijke deskundigen. De minister en de
      subsidieontvanger wijzen elk een deskundige aan, die in onderling overleg een derde deskundige aanwijzen.
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel48
  - number: '48.4'
    text: |-
      De vergoeding aan de minister voor goederen en andere vermogensbestanddelen, waaronder de egalisatiereserve, die
      geheel zijn gevormd met de subsidie, is gelijk aan hun waarde. De vergoeding aan de minister voor goederen en
      andere vermogensbestanddelen, die gedeeltelijk zijn gevormd met de subsidie, is gelijk aan de waarde waarmee de
      subsidiëring door de minister in verhouding tot andere middelen aan de vorming van dat vermogen heeft bijgedragen.
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel48
  - number: '48.5'
    text: De minister kan de vergoeding in afwijking van het vierde lid op een lager bedrag bepalen.
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel48
  - number: '49'
    text: |-
      De minister kan bij de verlening van de subsidie verplichtingen opleggen als bedoeld in de [artikelen 4:38][ref1]
      en [4:39 van de Algemene wet bestuursrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 49a
    text: |-
      Uiterlijk op de datum, vermeld in het besluit tot verlening van de subsidie, bedoeld in
      [artikel 8, onderdeel a, onder 2°][ref1], neemt de minister ambtshalve een besluit over de vaststelling van de
      subsidie.


      [ref1]: https://wetten.overheid.nl/BWBR0029947#Artikel8
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel49a
    references:
      - id: ref1
        bwb_id: BWBR0029947
        artikel: '8'
        paragraaf: '1'
  - number: '50.1'
    text: Voor een aanvraag van de vaststelling van een subsidie wordt een door de minister vastgesteld formulier gebruikt.
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel50
  - number: '50.2'
    text: |-
      Het aanvraagformulier wordt ondertekend door de aanvrager of door een persoon die bevoegd is de aanvrager te
      vertegenwoordigen.
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel50
  - number: '51.1'
    text: |-
      Een aanvraag tot vaststelling van een subsidie als bedoeld in [artikel 8, onderdeel a, onder 1°][ref1] wordt
      ingediend:


      [ref1]: https://wetten.overheid.nl/BWBR0029947#Artikel8
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0029947
        artikel: '8'
        paragraaf: '1'
  - number: 51.1.a
    text: |-
      indien het een projectsubsidie betreft: binnen tweeëntwintig weken na afloop van de periode waarvoor de
      projectsubsidie wordt aangevraagd;
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel51
  - number: 51.1.b
    text: |-
      indien het een instellingssubsidie betreft: binnen tweeëntwintig weken na afloop van het boekjaar waarvoor de
      instellingssubsidie wordt aangevraagd.
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel51
  - number: '51.2'
    text: |-
      De [artikelen 18, eerste en tweede lid][ref1], [22][ref2] en [23][ref3] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0029947#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0029947#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0029947#Artikel23
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0029947
        artikel: '18'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0029947
        artikel: '22'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0029947
        artikel: '23'
        paragraaf: '3'
  - number: '52'
    text: |-
      De aanvraag tot vaststelling van de subsidie, bedoeld in [artikel 8, onderdeel a, onder 1°][ref1] bestaat in ieder
      geval uit:


      [ref1]: https://wetten.overheid.nl/BWBR0029947#Artikel8
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0029947
        artikel: '8'
        paragraaf: '1'
  - number: 52.a
    text: een activiteitenverslag, tenzij redelijkerwijs kan worden aangenomen dat daaraan geen behoefte is, en
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel52
  - number: 52.b
    text: een financieel verslag, tenzij deze voor de berekening van het bedrag van de subsidie niet van belang is.
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel52
  - number: '53'
    text: |-
      Het activiteitenverslag, bedoeld in [artikel 52][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0029947#Artikel52
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0029947
        artikel: '52'
        paragraaf: '8'
  - number: 53.a
    text: behelst een overzicht van de gerealiseerde activiteiten waarvoor subsidie wordt aangevraagd,
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel53
  - number: 53.b
    text: |-
      beschrijft de aard, omvang, duur en wijze van uitvoering van de gerealiseerde activiteiten waarvoor subsidie wordt
      aangevraagd en
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel53
  - number: 53.c
    text: beschrijft de met de activiteiten gerealiseerde doelstellingen.
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel53
  - number: '54.1'
    text: |-
      Het financieel verslag, bedoeld in [artikel 52][ref1], geeft volgens normen die in het maatschappelijk verkeer als
      aanvaardbaar worden beschouwd, een zodanig inzicht dat een verantwoord oordeel kan worden gevormd omtrent de kosten
      en opbrengsten per gerealiseerde activiteit en geeft de nodige informatie om de subsidie vast te stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0029947#Artikel52
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0029947
        artikel: '52'
        paragraaf: '8'
  - number: '54.2'
    text: |-
      Het financieel verslag, bedoeld in [artikel 52][ref1], is per post voorzien van een toelichting.


      [ref1]: https://wetten.overheid.nl/BWBR0029947#Artikel52
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0029947
        artikel: '52'
        paragraaf: '8'
  - number: '55.1'
    text: |-
      De minister besluit binnen dertien weken na ontvangst van de aanvraag over de vaststelling van de subsidie, bedoeld
      in [artikel 8, onderdeel a, onder 1°][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0029947#Artikel8
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0029947
        artikel: '8'
        paragraaf: '1'
  - number: '55.2'
    text: |-
      De subsidie, bedoeld in [artikel 8, onderdeel a, onder 1°][ref1] wordt vastgesteld op een door de minister te
      bepalen bedrag dat in het besluit tot vaststelling wordt genoemd.


      [ref1]: https://wetten.overheid.nl/BWBR0029947#Artikel8
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0029947
        artikel: '8'
        paragraaf: '1'
  - number: '55.3'
    text: |-
      [Artikel 25, tweede tot en met vijfde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0029947#Artikel25
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0029947
        artikel: '25'
        paragraaf: '4'
  - number: '56'
    text: |-
      De minister betaalt het bedrag van de subsidie, bedoeld in [artikel 8, onderdeel a, onder 1°][ref1] in één keer.


      [ref1]: https://wetten.overheid.nl/BWBR0029947#Artikel8
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0029947
        artikel: '8'
        paragraaf: '1'
  - number: '57.1'
    text: |-
      De ontvanger van een subsidie als bedoeld in [artikel 8, onderdeel b, c, d, e of f][ref1], dient een aanvraag tot
      vaststelling van de subsidie in:


      [ref1]: https://wetten.overheid.nl/BWBR0029947#Artikel8
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0029947
        artikel: '8'
        paragraaf: '1'
  - number: 57.1.a
    text: |-
      indien het een projectsubsidie betreft: binnen tweeëntwintig weken na afloop van de periode waarvoor de
      projectsubsidie is verleend;
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel57
  - number: 57.1.b
    text: |-
      indien het een instellingssubsidie betreft: binnen tweeëntwintig weken na afloop van het boekjaar waarvoor de
      instellingssubsidie is verleend.
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel57
  - number: '57.2'
    text: De minister kan vrijstelling en ontheffing verlenen van de termijnen, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel57
  - number: '58.1'
    text: |-
      In de aanvraag tot vaststelling van de subsidie, bedoeld in [artikel 8, onderdeel b of c][ref1], toont de
      subsidieontvanger op de bij het besluit tot verlening van de subsidie bepaalde wijze aan dat:


      [ref1]: https://wetten.overheid.nl/BWBR0029947#Artikel8
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0029947
        artikel: '8'
        paragraaf: '1'
  - number: 58.1.a
    text: de activiteiten zijn verricht waarvoor de subsidie is verleend en
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel58
  - number: 58.1.b
    text: voldaan is aan de verplichtingen die verbonden zijn aan de verleende subsidie.
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel58
  - number: '58.2'
    text: |-
      Indien de subsidie, bedoeld in [artikel 8, onderdeel b][ref1], € 125.000 of meer bedraagt, gaat de aanvraag tot
      vaststelling vergezeld van:


      [ref1]: https://wetten.overheid.nl/BWBR0029947#Artikel8
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0029947
        artikel: '8'
        paragraaf: '1'
  - number: 58.2.a
    text: |-
      een assurancerapport van een accountant dat is opgesteld overeenkomstig een door de minister vastgesteld model met
      inachtneming van een door de minister vastgesteld protocol;
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel58
  - number: 58.2.b
    text: |-
      een rapport van feitelijke bevindingen omtrent de naleving van de aan de subsidie verbonden verplichtingen door
      de subsidieontvanger, opgesteld door een accountant overeenkomstig een door de minister vastgesteld model met
      inachtneming van een door de minister vastgesteld protocol.
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel58
  - number: '59'
    text: |-
      De subsidie, bedoeld in [artikel 8, onderdeel b][ref1], wordt vastgesteld op een bedrag per gerealiseerde
      prestatie-eenheid waarvan de hoogte door de minister bij de verlening is genoemd, voor ten hoogste het maximum
      aantal subsidiabele prestatie-eenheden dat door de minister bij de verlening is genoemd.


      [ref1]: https://wetten.overheid.nl/BWBR0029947#Artikel8
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0029947
        artikel: '8'
        paragraaf: '1'
  - number: '60'
    text: |-
      Indien de activiteiten waarvoor de subsidie is verleend geheel zijn verricht en volledig is voldaan
      aan de verplichtingen die verbonden zijn aan de verleende subsidie, wordt de subsidie, bedoeld in
      [artikel 8, onderdeel c][ref1], vastgesteld op het bedrag waarvan de hoogte door de minister bij de verlening is
      genoemd.


      [ref1]: https://wetten.overheid.nl/BWBR0029947#Artikel8
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0029947
        artikel: '8'
        paragraaf: '1'
  - number: '61.1'
    text: |-
      De aanvraag tot vaststelling van de subsidie, bedoeld in [artikel 8, onderdeel d][ref1], bestaat uit een verklaring
      inzake werkelijke kosten en opbrengsten.


      [ref1]: https://wetten.overheid.nl/BWBR0029947#Artikel8
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0029947
        artikel: '8'
        paragraaf: '1'
  - number: '61.2'
    text: 'Een verklaring inzake werkelijke kosten en opbrengsten bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel61
  - number: 61.2.a
    text: |-
      een verklaring dat de activiteiten waarvoor de subsidie is verleend, zijn verricht, welke verklaring is voorzien
      van een korte toelichting,
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel61
  - number: 61.2.b
    text: een verklaring dat is voldaan aan de verplichtingen die verbonden zijn aan de verleende subsidie,
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel61
  - number: 61.2.c
    text: |-
      een opgave van de totale werkelijke kosten van de activiteiten waarvoor de subsidie is verleend en die werkelijk
      zijn verricht, en
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel61
  - number: 61.2.d
    text: |-
      een opgave van de totale werkelijke bijdragen van derden van de activiteiten waarvoor de subsidie is verleend en
      die werkelijk zijn verricht.
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel61
  - number: '62.1'
    text: |-
      De subsidie, bedoeld in [artikel 8, onderdeel d][ref1], wordt vastgesteld op een bedrag dat bestaat uit de totale
      werkelijke kosten verminderd met de totale werkelijke bijdragen van derden en de begrote eigen bijdrage, maar dat
      niet hoger is dan het maximum dat door de minister bij de verlening is genoemd.


      [ref1]: https://wetten.overheid.nl/BWBR0029947#Artikel8
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0029947
        artikel: '8'
        paragraaf: '1'
  - number: '62.2'
    text: |-
      Voor het vaststellen van de subsidie, bedoeld in [artikel 8, onderdeel d][ref1], worden uitsluitend in aanmerking
      genomen de kosten en bijdragen van derden met betrekking tot activiteiten waarvoor de subsidie is verleend en die
      werkelijk zijn verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0029947#Artikel8
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0029947
        artikel: '8'
        paragraaf: '1'
  - number: '63'
    text: |-
      De aanvraag tot vaststelling van de subsidie, bedoeld in [artikel 8, onderdeel e of f][ref1], bestaat in ieder
      geval uit een activiteitenverslag en een financieel verslag.


      [ref1]: https://wetten.overheid.nl/BWBR0029947#Artikel8
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0029947
        artikel: '8'
        paragraaf: '1'
  - number: '64'
    text: |-
      Het activiteitenverslag, bedoeld in [artikel 63][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0029947#Artikel63
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0029947
        artikel: '63'
        paragraaf: '8'
  - number: 64.a
    text: beschrijft de aard, omvang, duur en wijze van uitvoering van de activiteiten waarvoor subsidie werd verleend,
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel64
  - number: 64.b
    text: |-
      bevat een vergelijking van de verrichte activiteiten met de in het activiteitenplan voorgenomen activiteiten en een
      toelichting op de verschillen,
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel64
  - number: 64.c
    text: |-
      bevat een vergelijking van de nagestreefde doelstellingen met de gerealiseerde doelstellingen en een toelichting op
      de verschillen en
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel64
  - number: 64.d
    text: beschrijft in hoeverre is voldaan aan de aan de subsidie verbonden verplichtingen.
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel64
  - number: '65.1'
    text: |-
      Het financieel verslag, bedoeld in [artikel 63][ref1], geeft volgens normen die in het maatschappelijk verkeer als
      aanvaardbaar worden beschouwd, een zodanig inzicht dat een verantwoord oordeel kan worden gevormd over de besteding
      van de subsidie door de subsidieontvanger en geeft de nodige informatie om de subsidie vast te stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0029947#Artikel63
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0029947
        artikel: '63'
        paragraaf: '8'
  - number: '65.2'
    text: |-
      Het financieel verslag, bedoeld in [artikel 63][ref1], sluit aan op de indeling van de begroting op basis waarvan
      de subsidie is verleend. Een verschil tussen het financieel verslag en de begroting van 20% van een afzonderlijke
      begrotingspost wordt toegelicht, tenzij het verschil lager is dan € 25.000.


      [ref1]: https://wetten.overheid.nl/BWBR0029947#Artikel63
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0029947
        artikel: '63'
        paragraaf: '8'
  - number: '66.1'
    text: |-
      De subsidieontvanger doet het financieel verslag, bedoeld in [artikel 63][ref1], vergezellen van een
      controleverklaring van een accountant, opgesteld overeenkomstig een door de minister vastgestelde model met
      inachtneming van een door de minister vastgesteld protocol.


      [ref1]: https://wetten.overheid.nl/BWBR0029947#Artikel63
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0029947
        artikel: '63'
        paragraaf: '8'
  - number: '66.2'
    text: |-
      Het financieel verslag, bedoeld in [artikel 63][ref1], gaat vergezeld van een rapport van feitelijke bevindingen
      omtrent de naleving van de aan de subsidie verbonden verplichtingen door de subsidieontvanger, opgesteld door
      een accountant overeenkomstig een door de minister vastgesteld model met inachtneming van een door de minister
      vastgesteld protocol.


      [ref1]: https://wetten.overheid.nl/BWBR0029947#Artikel63
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0029947
        artikel: '63'
        paragraaf: '8'
  - number: '67'
    text: |-
      Op verzoek van de minister legt de ontvanger van de instellingssubsidie, bedoeld in [artikel 8, onderdeel f][ref1],
      in aanvulling op de aanvraag tot vaststelling van de instellingssubsidie een jaarrekening over.


      [ref1]: https://wetten.overheid.nl/BWBR0029947#Artikel8
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0029947
        artikel: '8'
        paragraaf: '1'
  - number: '68.1'
    text: |-
      De projectsubsidie, bedoeld in [artikel 8, onderdeel e][ref1], wordt vastgesteld op een bedrag dat bestaat uit de
      werkelijke kosten verminderd met de werkelijke bijdragen van derden en de begrote eigen bijdrage, maar dat niet
      hoger is dan het maximum dat door de minister bij de verlening is genoemd.


      [ref1]: https://wetten.overheid.nl/BWBR0029947#Artikel8
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0029947
        artikel: '8'
        paragraaf: '1'
  - number: '68.2'
    text: |-
      Voor het vaststellen van de projectsubsidie, bedoeld in [artikel 8, onderdeel e][ref1], worden uitsluitend in
      aanmerking genomen de kosten en de bijdragen van derden met betrekking tot activiteiten waarvoor de projectsubsidie
      is verleend en die werkelijk zijn verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0029947#Artikel8
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0029947
        artikel: '8'
        paragraaf: '1'
  - number: '69'
    text: |-
      Indien de activiteiten waarvoor de subsidie is verleend geheel zijn verricht en volledig is voldaan aan
      de verplichtingen die verbonden zijn aan de verleende subsidie, wordt de instellingssubsidie, bedoeld in
      [artikel 8, onderdeel f][ref1], vastgesteld op een bedrag waarvan de hoogte door de minister bij de verlening is
      genoemd verminderd met de eventuele overschrijding van de maximaal toegestane toevoeging aan de egalisatiereserve.


      [ref1]: https://wetten.overheid.nl/BWBR0029947#Artikel8
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0029947
        artikel: '8'
        paragraaf: '1'
  - number: '70'
    text: |-
      Binnen tweeëntwintig weken na ontvangst van de aanvraag tot vaststelling van de subsidie, bedoeld in
      [artikel 8, onderdeel b, c, d, e of f][ref1], neemt de minister een besluit op de aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0029947#Artikel8
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0029947
        artikel: '8'
        paragraaf: '1'
  - number: '71.1'
    text: |-
      De minister kan ambtshalve of op aanvraag een subsidie verstrekken uit hoofde van
      [artikel 4:51 van de Algemene wet bestuursrecht][ref1] en daarbij een of meer bepalingen van deze regeling buiten
      toepassing laten of daarvan afwijken.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '71.2'
    text: |-
      De minister kan voorts een of meer bepalingen van deze regeling buiten toepassing laten of daarvan afwijken
      voor zover toepassing gelet op het belang dat de desbetreffende bepaling beoogt te beschermen zal leiden tot een
      onbillijkheid van overwegende aard.
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel71
  - number: '72.1'
    text: |-
      De [Subsidieregeling VWS-subsidies][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0019947
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0019947
  - number: '72.2'
    text: |-
      De door de ontvanger van een instellingssubsidie als bedoeld in [artikel 8, onderdeel f][ref1], op grond van
      [artikel 30, derde lid, van de Subsidieregeling VWS-subsidies][ref2] opgebouwde egalisatiereserve wordt toegevoegd
      aan de egalisatiereserve.


      [ref1]: https://wetten.overheid.nl/BWBR0029947#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0019947#Artikel30
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0029947
        artikel: '8'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0019947
        artikel: '30'
  - number: '72.3'
    text: |-
      De [Subsidieregeling VWS-subsidies][ref1] blijft van toepassing op:


      [ref1]: https://wetten.overheid.nl/BWBR0019947
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0019947
  - number: 72.3.a
    text: |-
      aanvragen van projectsubsidies op grond van de [Subsidieregeling VWS-subsidies][ref1] die vóór 1 juli 2011 zijn
      ontvangen ten behoeve van activiteiten die vóór 1 oktober 2011 aanvangen alsmede op aanvragen van projectsubsidies
      uit hoofde van het ‘Beleidskader Sport en Bewegen in de Buurt 2011: uitrol interventies’ en het ‘Beleidskader Sport
      en Bewegen in de Buurt: private interventies’;


      [ref1]: https://wetten.overheid.nl/BWBR0019947
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0019947
  - number: 72.3.b
    text: |-
      subsidies die vóór de inwerkingtreding van deze regeling zijn verleend op grond van
      de [Subsidieregeling VWS-subsidies][ref1], met dien verstande dat, in afwijking van
      [artikel 30, derde lid, tweede volzin, van de Subsidieregeling VWS-subsidies][ref2], de egalisatiereserve die
      door de ontvanger van een instellingssubsidie anders dan bedoeld in artikel 8, onderdeel f, op grond van artikel
      30, derde lid, van de Subsidieregeling VWS-subsidies is opgebouwd, bij de vaststelling in mindering kan worden
      gebracht;


      [ref1]: https://wetten.overheid.nl/BWBR0019947
      [ref2]: https://wetten.overheid.nl/BWBR0019947#Artikel30
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0019947
      - id: ref2
        bwb_id: BWBR0019947
        artikel: '30'
  - number: 72.3.c
    text: |-
      subsidies die voor de inwerkingtreding van deze regeling zijn vastgesteld op grond van de
      [Subsidieregeling VWS-subsidies][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019947
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0019947
  - number: '73'
    text: Deze regeling treedt in werking op 1 juli 2011.
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel73
  - number: '74'
    text: 'Deze regeling wordt aangehaald als: Kaderregeling VWS-subsidies.'
    url: https://wetten.overheid.nl/BWBR0029947/2015-02-17#Artikel74
