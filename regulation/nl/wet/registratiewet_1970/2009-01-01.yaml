$id: registratiewet_1970
regulatory_layer: WET
publication_date: '2022-09-07'
valid_from: '2009-01-01'
bwb_id: BWBR0002739
url: https://wetten.overheid.nl/BWBR0002739/2009-01-01
preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het in verband met de algemene herziening van de registratie- en de
    zegelbelasting wenselijk is de formaliteit van registratie van akten bij een afzonderlijke wet te regelen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002739/2009-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Onder registratie wordt verstaan het vermelden van de gehele of gedeeltelijke inhoud van akten in registers welke
      worden gehouden door daartoe door Onze Minister van Financiën aangewezen inspecteurs van de rijksbelastingdienst.
    url: https://wetten.overheid.nl/BWBR0002739/2009-01-01#Artikel1
  - number: '2'
    text: |-
      Onder akten worden niet alleen verstaan stukken, opgemaakt om tot bewijs te dienen, maar ook huiselijke papieren,
      brieven, kaarten, tekeningen en andere bescheiden.
    url: https://wetten.overheid.nl/BWBR0002739/2009-01-01#Artikel2
  - number: '3.1'
    text: |-
      Akten van notarissen, welke niet zijn genoemd in [artikel 4, eerste lid][ref1], moeten binnen tien dagen na de dag
      waarop de akten zijn opgemaakt, door die ambtenaren ter registratie worden aangeboden.


      [ref1]: https://wetten.overheid.nl/BWBR0002739#Artikel4
    url: https://wetten.overheid.nl/BWBR0002739/2009-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002739
        artikel: '4'
  - number: '3.2'
    text: |-
      In afwijking in zoverre van het eerste lid kan, onder bij regeling van Onze Minister van Financiën te stellen
      voorwaarden, in plaats van de akte een elektronisch afschrift daarvan langs elektronische weg worden aangeboden.
    url: https://wetten.overheid.nl/BWBR0002739/2009-01-01#Artikel3
  - number: '4.1'
    text: |-
      Uiterste willen en de daarop of op omslagen daarvan gestelde aantekeningen, andere akten welke uitsluitend
      uiterste wilsbeschikkingen of de herroeping van uiterste wilsbeschikkingen inhouden, zomede akten van bewaargeving,
      superscriptie of teruggaaf van uiterste willen moeten door de notaris onder wie zij berusten, ter registratie
      worden aangeboden binnen een maand na de dag waarop het overlijden of de verklaring van vermoedelijk overlijden
      van de beschikker te zijner kennis is gekomen, met dien verstande dat deze termijn niet eerder aanvangt, dan met de
      dag, volgende op die waarop de akten onder de notaris zijn komen te berusten.
    url: https://wetten.overheid.nl/BWBR0002739/2009-01-01#Artikel4
  - number: '4.2'
    text: |-
      Het eerste lid geldt niet ten aanzien van de in [artikel 97 van Boek 4 van het Burgerlijk Wetboek][ref1] bedoelde
      akten en van akten waarvan de beschikkingen niet meer van kracht zijn op het tijdstip van het overlijden of van de
      verklaring van vermoedelijk overlijden van de beschikker.


      [ref1]: https://wetten.overheid.nl/BWBR0002761#Artikel97
    url: https://wetten.overheid.nl/BWBR0002739/2009-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002761
        artikel: '97'
  - number: '5'
    text: |-
      Andere akten dan zijn bedoeld in de [artikelen 3][ref1] en [4][ref2], worden geregistreerd, wanneer zij daartoe
      worden aangeboden.


      [ref1]: https://wetten.overheid.nl/BWBR0002739#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002739#Artikel4
    url: https://wetten.overheid.nl/BWBR0002739/2009-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002739
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0002739
        artikel: '4'
  - number: '6.1'
    text: |-
      Op vordering van de inspecteur moet van een akte welke in een vreemde taal is gesteld, worden overgelegd een
      letterlijke vertaling in het Nederlands, voor overeenstemmend verklaard door een beëdigd vertaler in de zin
      van de [Wet beëdigde tolken en vertalers][ref1]. Indien het een notariële akte betreft, kan de vertaling voor
      overeenstemmend worden verklaard door de notaris die de akte heeft opgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0022704
    url: https://wetten.overheid.nl/BWBR0002739/2009-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0022704
  - number: '6.2'
    text: |-
      Ten aanzien van een akte als is bedoeld in [artikel 3][ref1] of [4][ref2], doet de inspecteur van zijn vordering
      blijken door een op de akte te stellen gedagtekende en ondertekende verklaring; de akte moet met de vertaling weer
      worden ingeleverd binnen een maand na de dagtekening van die verklaring.


      [ref1]: https://wetten.overheid.nl/BWBR0002739#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002739#Artikel4
    url: https://wetten.overheid.nl/BWBR0002739/2009-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002739
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0002739
        artikel: '4'
  - number: '6.3'
    text: |-
      Is niet voldaan aan het eerste of tweede lid, dan wordt de aanbieding ter registratie geacht niet te hebben
      plaatsgehad.
    url: https://wetten.overheid.nl/BWBR0002739/2009-01-01#Artikel6
  - number: '7.1'
    text: |-
      De notaris is verplicht een repertorium aan te houden, waarin hij dagelijks de door hem opgemaakte akten
      inschrijft.
    url: https://wetten.overheid.nl/BWBR0002739/2009-01-01#Artikel7
  - number: '7.2'
    text: |-
      Het repertorium wordt binnen tien dagen na afloop van ieder jaar door de notaris, dan wel zijn plaatsvervanger of
      opvolger ter naziening ingeleverd bij de inspecteur.
    url: https://wetten.overheid.nl/BWBR0002739/2009-01-01#Artikel7
  - number: '8.1'
    text: |-
      De notaris is gehouden aan de inspecteur of een door Onze Minister van Financiën aangewezen andere ambtenaar van
      de rijksbelastingdienst:
    url: https://wetten.overheid.nl/BWBR0002739/2009-01-01#Artikel8
  - number: 8.1.a
    text: |-
      de door deze gevorderde gegevens en inlichtingen te verstrekken welke van belang kunnen zijn om te beoordelen of
      aan de bepalingen van deze wet is voldaan;
    url: https://wetten.overheid.nl/BWBR0002739/2009-01-01#Artikel8
  - number: 8.1.b
    text: |-
      desgevorderd de onder hem berustende akten en registers ter inzage te verstrekken ter plaatse waar zij zich
      bevinden;
    url: https://wetten.overheid.nl/BWBR0002739/2009-01-01#Artikel8
  - number: 8.1.c
    text: |-
      toe te staan, afschriften van of uittreksels uit de onder letter *b* bedoelde bescheiden te maken, dan wel die
      bescheiden voor ten hoogste drie dagen tot nader onderzoek onder zich te nemen. De notaris wordt desgevraagd in de
      gelegenheid gesteld een afschrift van of uittreksel uit de bescheiden te maken.
    url: https://wetten.overheid.nl/BWBR0002739/2009-01-01#Artikel8
  - number: '8.2'
    text: |-
      Het eerste lid geldt niet ten aanzien van de in [artikel 4, eerste lid][ref1], genoemde akten, zolang de
      beschikkers in leven zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0002739#Artikel4
    url: https://wetten.overheid.nl/BWBR0002739/2009-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002739
        artikel: '4'
  - number: '8.3'
    text: |-
      Voldoening aan de bij het eerste lid omschreven verplichtingen kan gevorderd worden op elke dag, met uitzondering
      van zaterdagen, zondagen, algemeen erkende feestdagen in de zin van de [Algemene termijnenwet][ref1] (*Stb.* 1964,
      314) en de bij of krachtens artikel 3 van die wet daarmede gelijkgestelde dagen, mits tussen des voormiddags negen
      uur en des namiddags vier uur.


      [ref1]: https://wetten.overheid.nl/BWBR0002448
    url: https://wetten.overheid.nl/BWBR0002739/2009-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002448
  - number: '8.4'
    text: |-
      Wordt de toegang tot de plaats, met inbegrip van een woning, waar de akten en registers zich bevinden of
      redelijkerwijs vermoed kunnen worden zich te bevinden, geweigerd, dan is de inspecteur of de in het eerste lid
      bedoelde andere ambtenaar bevoegd zich die toegang met behulp van de sterke arm te verschaffen.
    url: https://wetten.overheid.nl/BWBR0002739/2009-01-01#Artikel8
  - number: '9'
    text: |-
      De notaris is bevoegd onder hem berustende akten welke niet zijn genoemd in [artikel 4, eerste lid][ref1], voor ten
      hoogste veertien dagen tegen ontvangbewijs af te geven aan de inspecteur of de in [artikel 8, eerste lid][ref2],
      bedoelde andere ambtenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0002739#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0002739#Artikel8
    url: https://wetten.overheid.nl/BWBR0002739/2009-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002739
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0002739
        artikel: '8'
  - number: '10.1'
    text: |-
      Het is een ieder verboden hetgeen hem uit of in verband met enige werkzaamheid bij de uitvoering van deze wet over
      de persoon of zaken van een ander blijkt of wordt meegedeeld, verder bekend te maken dan noodzakelijk is voor de
      uitvoering van enige wet (geheimhoudingsplicht).
    url: https://wetten.overheid.nl/BWBR0002739/2009-01-01#Artikel10
  - number: '10.2'
    text: 'De geheimhoudingsplicht geldt niet indien:'
    url: https://wetten.overheid.nl/BWBR0002739/2009-01-01#Artikel10
  - number: 10.2.a
    text: enig wettelijk voorschrift tot de bekendmaking verplicht;
    url: https://wetten.overheid.nl/BWBR0002739/2009-01-01#Artikel10
  - number: 10.2.b
    text: |-
      bij regeling van Onze Minister van Financiën is bepaald dat bekendmaking noodzakelijk is voor de goede vervulling
      van een publiekrechtelijke taak van een bestuursorgaan;
    url: https://wetten.overheid.nl/BWBR0002739/2009-01-01#Artikel10
  - number: 10.2.c
    text: |-
      bekendmaking plaatsvindt aan degene op wie de gegevens betrekking hebben voorzover deze gegevens door of namens hem
      zijn verstrekt.
    url: https://wetten.overheid.nl/BWBR0002739/2009-01-01#Artikel10
  - number: '10.3'
    text: |-
      In andere gevallen dan bedoeld in het tweede lid kan Onze Minister van Financiën ontheffing verlenen van de
      geheimhoudingsplicht.
    url: https://wetten.overheid.nl/BWBR0002739/2009-01-01#Artikel10
  - number: '10.4'
    text: |-
      Aan degenen die partij zijn bij een akte, hun erfgenamen of hun rechtverkrijgenden alsmede aan de openbare
      ambtenaar die de akte heeft opgemaakt of ter registratie heeft aangeboden, zijn plaatsvervanger of zijn opvolger,
      wordt ter zake van die akte desgevraagd inzage verleend in de registers van registratie dan wel een uittreksel uit
      die registers afgegeven.
    url: https://wetten.overheid.nl/BWBR0002739/2009-01-01#Artikel10
  - number: '11'
    text: |-
      De Staat is aansprakelijk voor de schade wegens verlies of beschadiging van een ingevolge deze wet onder een
      ambtenaar van de rijksbelastingdienst berustende akte.
    url: https://wetten.overheid.nl/BWBR0002739/2009-01-01#Artikel11
  - number: '13'
    text: 'Onze Minister van Financiën bepaalt:'
    url: https://wetten.overheid.nl/BWBR0002739/2009-01-01#Artikel13
  - number: 13.a
    text: |-
      aan welke ambtenaren van de rijksbelastingdienst de aanbieding ter registratie moet geschieden en welke inspecteur
      bevoegd is ten aanzien van de verplichtingen van notarissen;
    url: https://wetten.overheid.nl/BWBR0002739/2009-01-01#Artikel13
  - number: 13.b
    text: de dagen en de uren waarop de kantoren voor het aanbieden van akten ter registratie zijn geopend;
    url: https://wetten.overheid.nl/BWBR0002739/2009-01-01#Artikel13
  - number: 13.c
    text: de inrichting van de registers van registratie en de wijze waarop de registratie geschiedt;
    url: https://wetten.overheid.nl/BWBR0002739/2009-01-01#Artikel13
  - number: 13.d
    text: de wijze waarop blijkt dat een akte is geregistreerd;
    url: https://wetten.overheid.nl/BWBR0002739/2009-01-01#Artikel13
  - number: 13.e
    text: |-
      de inrichting en de wijze van bijhouding van het in [artikel 7][ref1] bedoelde repertorium.


      [ref1]: https://wetten.overheid.nl/BWBR0002739#Artikel7
    url: https://wetten.overheid.nl/BWBR0002739/2009-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002739
        artikel: '7'
  - number: '14.1'
    text: |-
      Hij die niet voldoet aan een verplichting, hem bij of krachtens de [artikelen 3][ref1], [4][ref2], [7][ref3] of
      [13, letter ][ref4] opgelegd, wordt gestraft met een geldboete van de eerste categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0002739#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002739#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0002739#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0002739#Artikel13
    url: https://wetten.overheid.nl/BWBR0002739/2009-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002739
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0002739
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0002739
        artikel: '7'
      - id: ref4
        bwb_id: BWBR0002739
        artikel: '13'
  - number: '14.2'
    text: |-
      De notaris die niet voldoet aan een verplichting, hem bij [artikel 8][ref1] opgelegd, wordt gestraft met een
      geldboete van de tweede categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0002739#Artikel8
    url: https://wetten.overheid.nl/BWBR0002739/2009-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002739
        artikel: '8'
  - number: '14.3'
    text: |-
      De notaris die, ingevolge [artikel 8][ref1] desgevraagd gehouden zijnde tot het verschaffen van gegevens of
      inlichtingen, onjuiste of onvolledige gegevens of inlichtingen verstrekt, wordt gestraft met een geldboete van de
      derde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0002739#Artikel8
    url: https://wetten.overheid.nl/BWBR0002739/2009-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002739
        artikel: '8'
  - number: '14.4'
    text: |-
      De [afdelingen 2](onbekend) en 3 van [hoofdstuk IX van de Algemene wet inzake rijksbelastingen][ref1] zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#HoofdstukIX
    url: https://wetten.overheid.nl/BWBR0002739/2009-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002320
        hoofdstuk: IX
  - number: '15.1'
    text: Deze wet treedt in werking op een door Ons te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0002739/2009-01-01#Artikel15
  - number: '15.2'
    text: Zij kan worden aangehaald als 'Registratiewet 1970'.
    url: https://wetten.overheid.nl/BWBR0002739/2009-01-01#Artikel15
