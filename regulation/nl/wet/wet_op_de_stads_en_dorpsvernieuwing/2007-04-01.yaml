  - number: '29'
    text: |-
      1 Burgemeester en wethouders kunnen besluiten in een gebied, waarvoor een leefmilieuverordening geldt tijdelijk,
      in het besluit nader omschreven voorzieningen te treffen met het oog op de verbetering van de woon- en
      werkomstandigheden in of het uiterlijk aanzien van dat gebied.

      2 De voorzieningen bedoeld in het eerste lid, worden alleen getroffen op grond, welke onmiddellijk vóórdien reeds
      gedurende enige tijd niet of niet noemenswaard voor een bepaald doeleinde in gebruik was. Werken en werkzaamheden
      ten behoeve van deze voorzieningen worden niet uitgevoerd alvorens over de inhoud en vormgeving daarvan met de
      direct betrokkenen in het gebied overleg is gepleegd.

      3 Rechthebbenden ten aanzien van gronden alwaar voorzieningen als bedoeld worden getroffen, moeten, voorzover ter
      zake met de gemeente geen overeenstemming is bereikt, de uitvoering alsmede het in stand blijven daarvan gedogen.
      Indien zij dientengevolge schade lijden wordt deze desverzocht door de kantonrechter - met inachtneming van het
      bedrag, dat in geval van huur en verhuur redelijkerwijs als huurprijs zou zijn verschuldigd - vastgesteld en
      vervolgens door de gemeente vergoed.

      4 Indien de rechthebbende ten aanzien van grond, waarop voorzieningen zijn getroffen daarop een bouwwerk wil
      oprichten, dat niet in strijd is met de ter plaatse geldende bouwvoorschriften, of die grond in gebruik wil nemen
      voor enig doeleinde, waartegen de leefmilieuverordening noch een ander wettelijk voorschrift zich verzet, worden de
      voorzieningen van gemeentewege ongedaan gemaakt.

      5 De voorzieningen worden eveneens onverwijld van gemeentewege ongedaan gemaakt, indien de rechthebbende ten
      aanzien van de grond zulks, nadat de leefmilieuverordening heeft opgehouden te gelden, aan burgemeester en
      wethouders verzoekt.
    url: https://wetten.overheid.nl/BWBR0003709/2007-04-01#Artikel29
  - number: '30'
    text: |-
      1 Een leefmilieuverordening geldt voor een daarbij te stellen termijn van ten hoogste vijf jaar. Het besluit tot
      verlenging behoeft de goedkeuring van gedeputeerde staten.

      2 Ten aanzien van de herziening en intrekking van een leefmilieuverordening zijn de [artikelen 10–15][ref1] van
      overeenkomstige toepassing


      [ref1]: https://wetten.overheid.nl/BWBR0003709#Artikel10
