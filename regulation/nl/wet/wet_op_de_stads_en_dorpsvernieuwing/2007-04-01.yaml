    text: |-
      Bij het opsporen van een strafbaar feit als bedoeld in de [artikelen 46][ref1] en [47][ref2], hebben de in
      [artikel 49][ref3] bedoelde ambtenaren toegang tot elke plaats, voor zover dat redelijkerwijs voor de vervulling
      van hun taak nodig is.


      [ref1]: https://wetten.overheid.nl/BWBR0003709#Artikel46
