  - number: '26'
    text: |-
      Het verlenen van een bouwvergunning voor een bouwwerk, dat geheel of gedeeltelijk gelegen is binnen een gebied,
      waar het op grond van [artikel 20][ref1] dan wel [25][ref2] verboden is om zonder vergunning te slopen en dat
      sloping van een bestaand bouwwerk zou medebrengen, kan afhankelijk worden gesteld van een bankgarantie ten bedrage
      van ten hoogste eenvijfde gedeelte van de door burgemeester en wethouders geschatte bouwkosten.


      [ref1]: https://wetten.overheid.nl/BWBR0003709#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0003709#Artikel25
    url: https://wetten.overheid.nl/BWBR0003709/2007-04-01#Artikel26
