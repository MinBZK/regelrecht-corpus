  - number: '9'
    text: |-
      1 Een leefmilieuverordening strekt tot wering van dreigende en tot stuiting van reeds ingetreden achteruitgang
      van de woon- en werkomstandigheden in en het uiterlijk aanzien van het bij die verordening aangewezen gebied of de
      daarbij aangewezen gebieden.

      2 Voor een aanwijzing, als in het eerste lid bedoeld, komen slechts in aanmerking gebieden, welke in hoofdzaak
      worden gebezigd voor bewoning, het midden- en kleinbedrijf of kantoren of voor een samenstel van twee of meer van
      deze doeleinden.

      3 Bij een leefmilieuverordening kunnen uitsluitend ter verwezenlijking van het in het eerste lid vermelde doel
      voorschriften worden gegeven zowel ten aanzien van op te richten of door verbouwing tot stand te brengen bouwwerken
      en de toelaatbaarheid van werken, geen bouwwerken zijnde, en werkzaamheden als ten aanzien van het gebruik van
      gronden en opstallen.

      4 De verordening behoeft de goedkeuring van gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0003709/2007-04-01#Artikel9
  - number: '10'
    text: |-
      Op de voorbereiding van een leefmilieuverordening is [afdeling 3.4 van de Algemene wet bestuursrecht][ref1]
      van toepassing. Zienswijzen kunnen naar voren worden gebracht door een ieder. De kennisgeving, bedoeld in
      [artikel 3:12 van de Algemene wet bestuursrecht][ref2], wordt tevens in de Staatscourant geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel312
    url: https://wetten.overheid.nl/BWBR0003709/2007-04-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: 3:12
  - number: '12'
    text: |-
      De gemeenteraad beslist binnen twaalf weken na afloop van de in
      [artikel 3:16, eerste lid, van de Algemene wet bestuursrecht][ref1] genoemde termijn omtrent de vaststelling van
      de leefmilieuverordening.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel316
    url: https://wetten.overheid.nl/BWBR0003709/2007-04-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 3:16
  - number: '13'
    text: |-
      1 Een leefmilieuverordening, die afwijkt van de ontwerp-verordening, zoals deze ter inzage heeft gelegen,
      ligt gedurende zes weken ter gemeentesecretarie voor een ieder ter inzage. De tervisielegging geschiedt
      zo spoedig mogelijk doch in elk geval binnen vier weken na de dagtekening van het raadsbesluit. De
      nederlegging wordt bekendgemaakt op de wijze, in [artikel 3:12 van de Algemene wet bestuursrecht][ref1] en
      [artikel 10, derde volzin][ref2], aangegeven. De bekendmaking houdt mededeling in van de bevoegdheid tot het
      kenbaar maken van bedenkingen.

      2 Een ieder, die bedenkingen heeft tegen wijzigingen, kan deze gedurende de in het eerste lid genoemde termijn van
      terinzageligging bij gedeputeerde staten kenbaar maken.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel312
      [ref2]: https://wetten.overheid.nl/BWBR0003709#Artikel10
    url: https://wetten.overheid.nl/BWBR0003709/2007-04-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 3:12
      - id: ref2
        bwb_id: BWBR0003709
        artikel: '10'
        hoofdstuk: IV
        afdeling: '3'
  - number: '14'
    text: |-
      1 De leefmilieuverordening wordt na vaststelling zo spoedig mogelijk, doch in elk geval binnen vier weken na de
      dagtekening van het raadsbesluit aan de goedkeuring van Gedeputeerde Staten onderworpen.

      2 Indien [artikel 13, eerste lid][ref1], toepassing heeft gevonden, wordt het besluit omtrent goedkeuring
      binnen dertien weken na afloop van de in dat lid genoemde termijn van terinzagelegging bekendgemaakt. Alvorens
      te besluiten horen gedeputeerde staten de provinciale stadsvernieuwingscommissie en zo nodig de provinciale
      planologische commissie. [Artikel 10:31, tweede en derde lid, van de Algemene wet bestuursrecht][ref2] is niet van
      toepassing. De goedkeuring kan worden onthouden indien de ingediende bedenkingen daartoe aanleiding geven dan wel
      wegens strijd met het belang van de stadsvernieuwing.

      3 Van het besluit omtrent goedkeuring wordt door toezending van een afschrift mededeling gedaan aan de provinciale
      stadsvernieuwingscommissie en zo nodig de provinciale planologische commissie.


      [ref1]: https://wetten.overheid.nl/BWBR0003709#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel1031
    url: https://wetten.overheid.nl/BWBR0003709/2007-04-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0003709
        artikel: '13'
        hoofdstuk: IV
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: 10:31
  - number: '15'
    text: |-
      De verordening wordt bekendgemaakt binnen vier weken na de dag waarop het besluit tot goedkeuring is bekendgemaakt
      dan wel het besluit tot goedkeuring ingevolge [artikel 10:31, vierde lid, van de Algemene wet bestuursrecht][ref1]
      geacht wordt te zijn genomen. Hiervan wordt mededeling gedaan aan gedeputeerde staten.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel1031
    url: https://wetten.overheid.nl/BWBR0003709/2007-04-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 10:31
  - number: '16'
    text: |-
      Planologische maatregelen welke gelden in een gebied waarvoor een leefmilieuverordening tot stand is gekomen,
      blijven - behoudens intrekking - van kracht voorzover zij niet met die verordening in strijd zijn.
    url: https://wetten.overheid.nl/BWBR0003709/2007-04-01#Artikel16
  - number: '17'
    text: |-
      1 Onverminderd het bepaalde in [artikel 44 van de Woningwet][ref1] moet de bouwvergunning eveneens worden
      geweigerd, indien het bouwwerk, waarop de aanvraag betrekking heeft, in strijd zou zijn met bepalingen van een
      leefmilieuverordening.

      2 In afwijking van het bepaalde in [artikel 44 van de Woningwet][ref2] kan de bouwvergunning geweigerd worden
      indien burgemeester en wethouders toepassing hebben gegeven aan het bepaalde in [artikel 26][ref3], doch geen
      bankgarantie is verleend.

      3 Indien de aanvraag om bouwvergunning strekt tot vergunningverlening in twee fasen als bedoeld in
      [artikel 56a van de Woningwet][ref4], hebben het eerste en het tweede lid slechts betrekking op de bouwvergunning
      eerste fase.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel44
      [ref3]: https://wetten.overheid.nl/BWBR0003709#Artikel26
      [ref4]: https://wetten.overheid.nl/BWBR0005181#Artikel56a
    url: https://wetten.overheid.nl/BWBR0003709/2007-04-01#Artikel17
