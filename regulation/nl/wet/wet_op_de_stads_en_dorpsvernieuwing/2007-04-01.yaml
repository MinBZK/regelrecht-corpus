        artikel: '46'
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0003709
        artikel: '47'
        hoofdstuk: VI
  - number: '49'
    text: |-
      1 Met de opsporing van de bij de [artikelen 46][ref1] en [47][ref2] strafbaar gestelde feiten zijn, onverminderd
      [artikel 141 van het Wetboek van Strafvordering][ref3], belast:

      a. de bij besluit van Onze Minister aangewezen ambtenaren;

      b. de door burgemeester en wethouders krachtens [artikel 100a, eerste lid, van de Woningwet][ref4], aangewezen
      ambtenaren.

      2 Deze ambtenaren zijn tevens belast met de opsporing van feiten, strafbaar gesteld in de
      [artikelen 179 tot en met 182][ref5] en [184 van het Wetboek van Strafrecht][ref6], voor zover deze feiten
      betrekking hebben op een bevel, vordering of handeling, gedaan of ondernomen door henzelf.

      3 Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0003709#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0003709#Artikel47
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel141
      [ref4]: https://wetten.overheid.nl/BWBR0005181#Artikel100a
      [ref5]: https://wetten.overheid.nl/BWBR0001854#Artikel179
      [ref6]: https://wetten.overheid.nl/BWBR0001854#Artikel184
    url: https://wetten.overheid.nl/BWBR0003709/2007-04-01#Artikel49
