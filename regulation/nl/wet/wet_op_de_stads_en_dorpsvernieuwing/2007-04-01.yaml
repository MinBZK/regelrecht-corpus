        artikel: 56a
  - number: '18'
    text: |-
      1 Onverminderd het bepaalde in de [artikelen 50, eerste lid][ref1], en [51, eerste lid, van de Woningwet][ref2]
      houden burgemeester en wethouders de beschikking eveneens aan, indien er geen grond is om de vergunning te weigeren
      en voor het gebied, waarin het bouwwerk zal worden uitgevoerd, voordat de aanvraag is binnengekomen, een ontwerp
      voor een leefmilieuverordening of voor een herziening daarvan ter inzage is gelegd dan wel een zodanige verordening
      of een herziening daarvan is vastgesteld.

      2 De aanhouding duurt totdat de termijnen bedoeld in de [artikelen 12][ref3] of [14, tweede lid][ref4], zijn
      overschreden of omtrent de goedkeuring van de verordening of de herziening daarvan onherroepelijk is beslist.

      3 [Artikel 50, vierde, vijfde en zesde lid, van de Woningwet][ref5] is van overeenkomstige toepassing.

      4 Na de in het tweede lid bedoelde beëindiging van de aanhouding verlenen burgemeester en wethouders de
      bouwvergunning binnen vier weken na de beëindiging van de aanhouding.

      5 Indien de aanvraag om bouwvergunning strekt tot vergunningverlening in twee fasen als bedoeld in
      [artikel 56a van de Woningwet][ref6], hebben het eerste en het tweede lid slechts betrekking op de bouwvergunning
      eerste fase.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel50
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel51
