  - number: '32'
    text: |-
      1 Bij een stadsvernieuwingsplan kunnen gebieden worden aangewezen, waarbinnen de woningen en andere gebouwen,
      alsmede bouwwerken, niet zijnde gebouwen, voor het merendeel uit het oogpunt van woongerief, gebruiksmogelijkheden
      of anderszins niet of niet meer aan de daaraan te stellen eisen voldoen en hetzij door middel van verbetering,
      verbouwing, samenvoeging of op andere wijze dienen te worden gemoderniseerd, hetzij door gelijksoortige bebouwing
      van gelijke of nagenoeg gelijke bouwmassa dienen te worden vervangen.

      2 Zolang de binnen een ingevolge het eerste lid aangewezen gebied gelegen woningen en andere gebouwen, alsmede
      bouwwerken, niet zijnde gebouwen, niet zijn gemoderniseerd, dan wel vervangen, wordt het gebruik daarvan geacht af
      te wijken van het plan.
    url: https://wetten.overheid.nl/BWBR0003709/2007-04-01#Artikel32
  - number: '33'
    text: |-
      1 Een stadsvernieuwingsplan gaat vergezeld van een uitvoeringsschema. Dit geeft aan:

      a. de volgorde, waarin aan de verschillende onderdelen van het plan naar het oordeel van burgemeester en wethouders
      uitvoering zou moeten worden gegeven;

      b. het tijdstip, waarop naar het oordeel van burgemeester en wethouders de uitvoering van het plan of van
      onderdelen daarvan uiterlijk zou moeten zijn voltooid;

      c. de termijn, waarbinnen burgemeester en wethouders ernaar streven dat de bestemming zal worden verwezenlijkt van
      gronden, die bij het plan zijn aangewezen voor doeleinden van openbaar nut;

      d. de raming van de kosten, welke de uitvoering van het plan, naar tijdsvolgorde onderscheiden, zal medebrengen en
      van de opbrengsten, die daarmede zullen worden verkregen, alsmede de wijze waarop in de dekking van een eventueel
      tekort zal worden voorzien en voorts een overzicht van de te verwachten financiële tekorten die mochten ontstaan
      door de uitvoering van maatregelen, die als gevolg van het plan buiten het plangebied zullen worden uitgevoerd;

      e. de wijze, waarop burgemeester en wethouders voornemens zijn de bevolking bij de uitvoering van het plan of van
      onderdelen daarvan te betrekken;

      f. de wijze, waarop burgemeester en wethouders zich voorstellen om gedurende de uitvoering van het plan de belangen
      van personen of groepen, die doordat zij hun woning of ander gebouw tijdelijk niet kunnen gebruiken of anderszins
      door die uitvoering worden getroffen, te behartigen;

      g. de wijze, waarop burgemeester en wethouders zich voorstellen, zo nodig, van gemeentewege te voorzien in de
      huisvesting van hen, die ten gevolge van de uitvoering van het plan niet in hun oorspronkelijke woongelegenheid
      kunnen terugkeren alsmede de wijze, waarop het gemeentebestuur zich voorstelt, in vergelijkbaar geval het
      bedrijfsleven hulp en zo nodig geldelijke steun te bieden bij het vinden, respectievelijk innemen van een
      vestigingsplaats elders;

      h. welke andere maatregelen ten behoeve van de uitvoering van het plan, onder meer op het gebied van het specifieke
      welzijn en op economisch en milieuhygiënisch gebied, burgemeester en wethouders zich voorstellen, dat van
      gemeentewege of door anderen met instemming van de gemeente zullen worden genomen.

      2 Het uitvoeringsschema bevat voorts een beschrijving van de in het plan begrepen, voor modernisering of vervanging
      in aanmerking komende gebouwen, en geeft ten aanzien daarvan in elk geval aan de voornemens van burgemeester en
      wethouders ten aanzien van:

      a. de aard van de modernisering of de vervanging onderscheiden naar de soort van gebouwen of groepen van gebouwen;

      b. de volgorde van de modernisering of de vervanging naar gelang de dringendheid daarvan;

      c. de mate en de volgorde waarin voorzieningen ter verbetering van de omgeving van gemeentewege zullen worden
      getroffen.
    url: https://wetten.overheid.nl/BWBR0003709/2007-04-01#Artikel33
  - number: '34'
    text: |-
      1 Bij een stadsvernieuwingsplan kan worden bepaald, dat burgemeester en wethouders volgens bij het plan te
      geven regelen het uitvoeringsschema of een of meer gedeelten daarvan vaststellen. Tevens kan worden bepaald dat
      burgemeester en wethouders volgens bij het plan te geven regelen het door hen vastgestelde uitvoeringsschema of
      gedeelte van het uitvoeringsschema kunnen wijzigen.

      2 Burgemeester en wethouders oefenen de in het eerste lid bedoelde bevoegdheden zoveel mogelijk uit na overleg met
      de belanghebbenden.

      3 Een door burgemeester en wethouders vastgesteld of gewijzigd uitvoeringsschema of gedeelte daarvan
      wordt zo spoedig mogelijk, doch in elk geval binnen vier weken na de vaststelling aan Gedeputeerde
      Staten meegedeeld. Tegelijk met deze mededeling wordt het voor een ieder ter inzage gelegd.
      [Artikel 3:12, eerste lid, van de Algemene wet bestuursrecht][ref1] is van overeenkomstige toepassing. De
      kennisgeving, bedoeld in het eerste lid van dat artikel, wordt tevens in de *Staatscourant* gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel312
    url: https://wetten.overheid.nl/BWBR0003709/2007-04-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 3:12
  - number: '35'
    text: |-
      In een stadsvernieuwingsplan begrepen grond waarvan het gebruik afwijkt van het plan wordt geacht te zijn
      aangewezen ingevolge [artikel 13, eerste lid, van de Wet op de Ruimtelijke Ordening][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel13
    url: https://wetten.overheid.nl/BWBR0003709/2007-04-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0002375
        artikel: '13'
  - number: '36'
    text: |-
      In het gebied, dat is begrepen in een stadsvernieuwingsplan is het verboden te slopen zonder vergunning van
      burgemeester en wethouders. De [artikelen 20-28][ref1] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003709#Artikel20
    url: https://wetten.overheid.nl/BWBR0003709/2007-04-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0003709
        artikel: '20'
        hoofdstuk: IV
        afdeling: '3'
  - number: '37'
    text: |-
      De gemeenteraad kan voor het in een stadsvernieuwingsplan begrepen gebied een overeenkomstig besluit nemen als
      bedoeld in [artikel 29][ref1]. De leden 1-4 van genoemd artikel zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003709#Artikel29
    url: https://wetten.overheid.nl/BWBR0003709/2007-04-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0003709
        artikel: '29'
        hoofdstuk: IV
        afdeling: '3'
  - number: '38'
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere voorschriften worden gegeven zowel omtrent de voorbereiding
      en de inhoud van een leefmilieuverordening als omtrent de voorbereiding, de vormgeving en de inrichting van
      stadsvernieuwingsplannen met inbegrip van het in [artikel 33][ref1] bedoelde uitvoeringsschema.


      [ref1]: https://wetten.overheid.nl/BWBR0003709#Artikel33
    url: https://wetten.overheid.nl/BWBR0003709/2007-04-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0003709
        artikel: '33'
        hoofdstuk: IV
        afdeling: '4'
  - number: '44'
    text: |-
      Indien toepassing van bestuursdwang ter handhaving van de bij of krachtens deze wet gestelde verplichtingen leidt
      tot sloping van bouwwerken, worden overblijvende materialen in het openbaar verkocht, tenzij, naar redelijke
      verwachtingen, bij onderhandse verkoop een hogere opbrengst kan worden verkregen. De opbrengst wordt, na aftrek van
      de kosten van sloping en verkoop, aan de rechthebbende uitgekeerd.
    url: https://wetten.overheid.nl/BWBR0003709/2007-04-01#Artikel44
  - number: '46'
    text: |-
      Overtreding van [artikel 20][ref1] wordt gestraft met hechtenis van ten hoogste zes maanden of geldboete van de
      derde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0003709#Artikel20
    url: https://wetten.overheid.nl/BWBR0003709/2007-04-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0003709
        artikel: '20'
        hoofdstuk: IV
        afdeling: '3'
  - number: '47'
    text: |-
      1 Overtreding van bepalingen, die ter uitvoering van deze wet zijn vastgesteld, wordt, voor zover de overtreding
      van die bepalingen uitdrukkelijk als strafbaar feit is aangeduid, gestraft met hechtenis van ten hoogste zes
      maanden of geldboete van de derde categorie, met uitzondering van overtreding van bepalingen die ter uitvoering van
      [artikel 31][ref1] zijn vastgesteld.

      2 Indien tijdens het plegen van de overtreding nog geen jaar is verlopen sedert een vroegere veroordeling van de
      schuldige wegens gelijke overtreding onherroepelijk is geworden, kan de rechter hechtenis of geldboete tot het
      dubbele van het voor elke overtreding gestelde maximum uitspreken.


      [ref1]: https://wetten.overheid.nl/BWBR0003709#Artikel31
    url: https://wetten.overheid.nl/BWBR0003709/2007-04-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0003709
        artikel: '31'
        hoofdstuk: IV
        afdeling: '4'
  - number: '48'
    text: |-
      De in de [artikelen 46][ref1] en [47][ref2] bedoelde strafbare feiten worden beschouwd als overtredingen.


      [ref1]: https://wetten.overheid.nl/BWBR0003709#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0003709#Artikel47
    url: https://wetten.overheid.nl/BWBR0003709/2007-04-01#Artikel48
    references:
