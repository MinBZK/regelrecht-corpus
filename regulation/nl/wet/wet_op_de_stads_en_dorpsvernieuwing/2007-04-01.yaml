  - number: '51'
    text: |-
      1 In afwijking in zoverre van deze wet kunnen Gedeputeerde Staten op verzoek van de gemeenteraad een vóór
      de inwerkingtreding van deze wet onherroepelijk goedgekeurd bestemmingsplan, dat strekt tot behoud, herstel,
      verbetering, herindeling of sanering van het daarin begrepen gebied, gelijkstellen met een stadsvernieuwingsplan.

      2 Gelijke bevoegdheid komt Gedeputeerde Staten toe met betrekking tot een bestemmingsplan, als in het eerste lid
      bedoeld, waarvan het ontwerp vóór de inwerkingtreding van deze wet ter inzage is gelegd, doch dat eerst ná die
      inwerkingtreding van kracht is geworden.

      3 Gedeputeerde Staten beslissen binnen drie maanden na de dag, waarop zij het verzoek hebben ontvangen. Alvorens te
      beslissen, horen zij de provinciale stadsvernieuwingscommissie en zo nodig de provinciale planologische commissie.
      Zij worden geacht het verzoek te hebben ingewilligd indien zij binnen de genoemde termijn geen beslissing aan de
      gemeenteraad hebben toegezonden.

      4 Gedeputeerde staten maken hun besluit zo spoedig mogelijk doch in elk geval binnen vier weken na dagtekening
      daarvan bekend aan de gemeenteraad. Tegen een afwijzend besluit van gedeputeerde staten kan de gemeenteraad beroep
      instellen bij de Afdeling bestuursrechtspraak van de Raad van State.

      5 Gedeputeerde Staten kunnen voorts, in afwijking in zoverre van deze wet, bij hun beslissing omtrent goedkeuring
      een bestemmingsplan, dat strekt tot behoud, herstel, verbetering, herindeling of sanering van het daarin begrepen
      gebied, waarvan het ontwerp vóór de inwerkingtreding van deze wet ter inzage is gelegd, gelijkstellen met een
      stadsvernieuwingsplan.
    url: https://wetten.overheid.nl/BWBR0003709/2007-04-01#Artikel51
