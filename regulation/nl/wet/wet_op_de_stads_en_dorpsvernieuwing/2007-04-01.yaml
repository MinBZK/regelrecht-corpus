  - number: '21'
    text: |-
      1 De sloopvergunning mag worden geweigerd, indien bouwvergunning kan worden verleend voor een in plaats van het te
      slopen bouwwerk op te richten bouwwerk, doch deze vergunning nog niet is aangevraagd.

      2 De sloopvergunning moet worden geweigerd, indien vergunning voor het slopen van het bouwwerk ingevolge de
      [Monumentenwet 1988][ref1], een provinciale of gemeentelijke monumentenverordening is vereist en deze vergunning
      niet is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0004471
    url: https://wetten.overheid.nl/BWBR0003709/2007-04-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0004471
  - number: '22'
    text: |-
      1 Burgemeester en wethouders beslissen omtrent een aanvraag om sloopvergunning binnen twaalf weken na de
      dag waarop zij de aanvraag hebben ontvangen. De [artikelen 46, vierde tot en met zevende lid][ref1], en
      [47 van de Woningwet][ref2] zijn van overeenkomstige toepassing.

      2 In afwijking van het eerste lid kunnen burgemeester en wethouders de beslissing aanhouden, indien voor een in
      plaats van het te slopen bouwwerk op te richten bouwwerk bouwvergunning is aangevraagd, doch op de aanvrage nog
      niet is beslist.

      3 De aanhouding duurt totdat onherroepelijk op de aanvrage om bouwvergunning, bedoeld in het tweede lid, is
      beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel47
    url: https://wetten.overheid.nl/BWBR0003709/2007-04-01#Artikel22
    references:
