        artikel: '25'
        hoofdstuk: IV
        afdeling: '3'
  - number: '27'
    text: |-
      1 In afwijking van het bepaalde in [artikel 59, eerste lid, onder ][ref1] kunnen burgemeester en wethouders in een
      bouwvergunning als bedoeld in [artikel 26][ref2] een termijn opnemen waarbinnen met de werkzaamheden moet begonnen
      zijn. Deze termijn mag niet korter zijn dan twaalf weken na de dagtekening van de vergunning. Burgemeester en
      wethouders kunnen deze termijn op verzoek van de vergunninghouder verlengen.

      2 De bankgarantie bedoeld in [artikel 26][ref3] eindigt in elk geval op het tijdstip waarop metterdaad met de bouw
      is begonnen.

      3 Indien binnen de in het eerste lid bedoelde termijn of verlengde termijn niet met de werkzaamheden is begonnen,
      kunnen burgemeester en wethouders het bedrag, waarvoor de garantie is gesteld, aan de gemeente doen uitbetalen;
      tevens kunnen zij de bouwvergunning intrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel59
      [ref2]: https://wetten.overheid.nl/BWBR0003709#Artikel26
      [ref3]: https://wetten.overheid.nl/BWBR0003709#Artikel26
