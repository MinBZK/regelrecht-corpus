  - number: '28'
    text: |-
      De eigenaar van grond of de rechthebbende op een beperkt recht waaraan grond is onderworpen, die geheel of
      gedeeltelijk is gelegen in een gebied, waar het op grond van [artikel 20][ref1] dan wel [25][ref2] verboden is
      zonder vergunning te slopen en waarop door zijn toedoen zonder vergunning een bouwwerk is gesloopt, is, indien
      bouwvergunning kan worden verleend voor een in de plaats van het gesloopte bouwwerk op te richten bouwwerk,
      verplicht deze vergunning binnen zes maanden na de sloop aan te vragen. Burgemeester en wethouders kunnen deze
      termijn op verzoek van de eigenaar verlengen. [Artikel 27, eerste lid][ref3], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003709#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0003709#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0003709#Artikel27
