preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het gewenst is bij de wet enige regelen te stellen ter bevordering van
    de stads- en dorpsvernieuwing;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0003709/2007-04-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze wet wordt onder stads- en dorpsvernieuwing verstaan de stelselmatige inspanning zowel op stedebouwkundig
      als op sociaal, economisch, cultureel en milieuhygiënisch gebied, gericht op behoud, herstel, verbetering,
      herindeling of sanering van bebouwde gedeelten van het gemeentelijk grondgebied.

      2 Waar hierna in deze wet wordt gesproken van stadsvernieuwing, al dan niet in verbinding met andere zelfstandige
      naamwoorden, wordt voor zover van toepassing dorpsvernieuwing daaronder mede begrepen.

      3 Voorts wordt in deze wet verstaan onder:

      a. Onze Minister: Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer;

      b. gebouw, bouwen, bouwvergunning, verbeteren en slopen: hetgeen daaronder in de [Woningwet][ref1] wordt verstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005181
    url: https://wetten.overheid.nl/BWBR0003709/2007-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005181
  - number: '2'
    text: |-
      De in deze wet voorziene algemene maatregelen van bestuur treden niet eerder in werking dan twee maanden na
      de dagtekening van het *Staatsblad*, waarin de desbetreffende besluiten zijn geplaatst. Van de plaatsing wordt
      onverwijld aan de Staten-Generaal mededeling gedaan.
    url: https://wetten.overheid.nl/BWBR0003709/2007-04-01#Artikel2
  - number: '3'
    text: |-
      1 Onze Minister verricht het nodige ter voorbereiding van de bepaling van het regeringsbeleid inzake de
      stadsvernieuwing. Hij draagt ervoor zorg dat het beleid van Onze onderscheidene Ministers op het gebied van de
      stadsvernieuwing een samenhangend geheel vormt.

      2 Ter uitvoering van het eerste lid doet Onze Minister jaarlijks ter gelegenheid van de aanbieding van de
      Rijksbegroting aan de Tweede Kamer der Staten-Generaal toekomen:

      a. een overzicht van de op stadsvernieuwing betrekking hebbende posten in de onderscheidene hoofdstukken van de
      Rijksbegroting, vergezeld door een overzicht van de aard en omvang van de behoefte aan stadsvernieuwing en van de
      ter bevordering van voorziening in deze behoefte van rijkswege te nemen maatregelen;

      b. een voor het desbetreffende begrotingsjaar bijgesteld programma van in de komende vijf jaren door de Regering te
      ontplooien activiteiten ten behoeve van de stadsvernieuwing en van van rijkswege voor de stadsvernieuwing ten laste
      van de onderscheidene hoofdstukken van de rijksbegroting ter beschikking te stellen bijdragen, vergezeld door een
      verslag van het door de regering gevoerde beleid en van de voortgang van de stadsvernieuwing;

      c. een voor het desbetreffende begrotingsjaar bijgestelde raming van de kosten, verbonden aan de uitvoering van het
      onder *b* bedoelde programma.
    url: https://wetten.overheid.nl/BWBR0003709/2007-04-01#Artikel3
  - number: '5'
    text: |-
      1 Gedeputeerde Staten bevorderen de coördinatie tussen de stadsvernieuwing en de regionale ontwikkeling van de
      provincie.

      2 Onverminderd het bepaalde in [artikel 53 van de Wet op de Ruimtelijke Ordening][ref1] is er ten behoeve
      van het overleg en de advisering over zaken betreffende de stadsvernieuwing in elke provincie een provinciale
      stadsvernieuwingscommissie. In deze commissie hebben vertegenwoordigers in de provincie van bij stadsvernieuwing
      betrokken rijksdiensten in elk geval zitting.


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel53
    url: https://wetten.overheid.nl/BWBR0003709/2007-04-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002375
        artikel: '53'
  - number: '7'
    text: |-
      1 De gemeenteraad kan voor een bepaald gedeelte of voor bepaalde gedeelten van het gemeentelijk grondgebied, die
      daarvoor naar zijn mening in aanmerking komen:

      a. een leefmilieuverordening vaststellen, zulks overeenkomstig hetgeen dienaangaande is bepaald in de
      [afdelingen 2][ref1] en [3][ref2] van dit hoofdstuk;

      b. een stadsvernieuwingsplan vaststellen, zulks overeenkomstig hetgeen dienaangaande is bepaald in de
      [afdelingen 2][ref3] en [4][ref4] van dit hoofdstuk.

      2 Het bepaalde in dit artikel laat de bevoegdheid van de gemeenteraad onderscheidenlijk burgemeester en wethouders
      om overeenkomstig andere wettelijke voorschriften maatregelen in het belang van de stadsvernieuwing te nemen
      onverlet. Evenmin beperkt het de mogelijkheid om in datzelfde belang langs andere weg te komen tot uitvoering van
      werken en werkzaamheden ter verbetering van woningen, andere gebouwen en derzelver omgeving.


      [ref1]: https://wetten.overheid.nl/BWBR0003709#HoofdstukIV
      [ref2]: https://wetten.overheid.nl/BWBR0003709#HoofdstukIV
      [ref3]: https://wetten.overheid.nl/BWBR0003709#HoofdstukIV
      [ref4]: https://wetten.overheid.nl/BWBR0003709#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0003709/2007-04-01#Artikel7
