    text: |-
      Zolang geen uitvoering is gegeven aan het bepaalde in [artikel 24][ref1] zijn met betrekking tot de inrichting
      van aanvragen om en de overdraagbaarheid van sloopvergunning de overeenkomstige bepalingen uit de bouwverordening
      betreffende bouwvergunningen van toepassing.


