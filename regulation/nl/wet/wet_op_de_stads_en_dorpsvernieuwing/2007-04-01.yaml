  - number: '19'
    text: |-
      Indien en voorzover blijkt, dat een belanghebbende ten gevolge van de bepalingen van een leefmilieuverordening
      schade lijdt of zal lijden, is [artikel 49 van de Wet op de Ruimtelijke Ordening][ref1] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel49
    url: https://wetten.overheid.nl/BWBR0003709/2007-04-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0002375
        artikel: '49'
  - number: '20'
    text: |-
      1 In gebieden, waarvoor een leefmilieuverordening geldt is het verboden te slopen zonder of in afwijking van een
      schriftelijke vergunning van burgemeester en wethouders (sloopvergunning).

      2 Geen sloopvergunning krachtens deze wet is vereist voor het slopen:

      a. ingevolge een besluit van burgemeester en wethouders als bedoeld in [artikel 13 van de Woningwet][ref1] dan wel
      ingevolge een besluit van burgemeester en wethouders tot toepassing van bestuursdwang of oplegging van een last
      onder dwangsom wegens overtreding van het bepaalde bij of krachtens [artikel 1a][ref2], [1b][ref3], [7b][ref4],
      [13][ref5], [40][ref6], [45, zevende lid][ref7], of [120 van die wet][ref8];

      b. van bouwwerken als bedoeld in [artikel 43 van de Woningwet][ref9].

      3 In afwijking van het in het eerste lid bepaalde, kan de gemeenteraad bij de leefmilieuverordening bepalen, dat
      het verbod om zonder vergunning te slopen slechts van toepassing is in bepaalde gedeelten van de in dit artikel
      bedoelde gebieden.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel1a
