        bwb_id: BWBR0005181
        artikel: '46'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '47'
  - number: '24'
    text: |-
      Voor een gebied waarvoor een leefmilieuverordening geldt, worden door burgemeester en wethouders voorschriften
      gegeven omtrent:

      a. de inrichting van aanvragen om sloopvergunning;

      b. de overdraagbaarheid van deze vergunning.
    url: https://wetten.overheid.nl/BWBR0003709/2007-04-01#Artikel24
  - number: '25'
    text: |-
      De [artikelen 20-24][ref1] zijn van overeenkomstige toepassing op die delen van de gemeente waarvoor een ontwerp
      voor een leefmilieuverordening ter inzage is gelegd of een zodanige verordening is vastgesteld, met dien verstande
      echter, dat het verbod om zonder vergunning te slopen van rechtswege vervalt, indien de termijn bedoeld in
      [artikel 12][ref2] is overschreden dan wel Gedeputeerde Staten goedkeuring aan de verordening hebben onthouden.


      [ref1]: https://wetten.overheid.nl/BWBR0003709#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0003709#Artikel12
    url: https://wetten.overheid.nl/BWBR0003709/2007-04-01#Artikel25
