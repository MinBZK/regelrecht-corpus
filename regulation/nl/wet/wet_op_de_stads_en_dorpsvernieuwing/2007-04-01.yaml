        hoofdstuk: IV
        afdeling: '3'
  - number: '31'
    text: |-
      Een stadsvernieuwingsplan strekt tot behoud, herstel, verbetering, herindeling of sanering van het daarin
      begrepen gebied. Het wordt voor de toepassing van deze en andere wetten gelijkgesteld met een bestemmingsplan,
      als bedoeld in [artikel 10 van de Wet op de Ruimtelijke Ordening][ref1]. De [hoofdstukken IV][ref2],
      [V][ref3], [VII][ref4], [VIII][ref5] en [IXA van de Wet op de Ruimtelijke Ordening][ref6] alsmede
      [hoofdstuk IV van het Besluit op de ruimtelijke ordening 1985][ref7] zijn van overeenkomstige toepassing, met dien
      verstande dat in de [hoofdstukken IV][ref8] en [V van de Wet op de Ruimtelijke Ordening][ref9] in plaats van "de
      provinciale planologische commissie" telkenmale wordt gelezen: de provinciale stadsvernieuwingscommissie en zo
      nodig de provinciale planologische commissie.


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002375#HoofdstukIV
      [ref3]: https://wetten.overheid.nl/BWBR0002375#HoofdstukV
