preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat van het stelsel van de studiefinanciering een regulerende werking
    uitgaat op de verblijfsduur van studerenden in het hoger onderwijs, dat als gevolg daarvan niet langer de behoefte
    bestaat aan afzonderlijke wettelijke bepalingen die die verblijfsduur regelen of beïnvloeden, en dat het gewenst is
    de mogelijkheid voor instellingen om zelf de hoogte van de onderwijsbijdrage te bepalen te verruimen;

    dat het voorts, gelet op de beperkte overheidsmiddelen, noodzakelijk is het wettelijk voltijds collegegeld te
    verhogen, welke verhoging in drie fasen zal worden ingevoerd en wel zodanig dat de volledige verhoging in het
    studiejaar 1998–1999 zal worden bereikt;

    dat in verband daarmee wijziging van de Wet op het hoger onderwijs en wetenschappelijk onderzoek, alsmede de Wet op
    de studiefinanciering, noodzakelijk is;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0007971/2005-08-03#ArtikelAanhef
articles:
