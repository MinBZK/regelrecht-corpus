articles:
  - number: '1'
    text: |-
      1 Elk railvoertuig dat op een bepaald traject van de spoorweg gebruik maakt, wordt voor de toepassing van deze
      regeling toegedeeld aan de desbetreffende voertuigcategorie, genoemd in hoofdstuk 1 van de bijlage bij deze
      regeling.

      2 Voor de toepassing van deze regeling wordt verstaan onder:




                *emissietraject:*


                gedeelte van een spoorweg waarop de geluidemissie constant kan worden veronderstelt;




                *emissiegetal:*


                getal dat de sterkte aangeeft van het geëmitteerde geluid ten gevolge van het gezamenlijk treinverkeer op
      een bepaald spoorweggedeelte, zonodig gespecificeerd per oktaafband en per onderscheiden bronhoogte;




                *etmaalperiode:*


                het gedeelte van een etmaal, waarover het equivalente geluidsniveau wordt bepaald;




                *eenheid:*


                afhankelijk van de railvoertuigcategorie een locomotief, een rijtuig of een wagen;




                *verkeersintensiteit:*


                het aantal eenheden van een categorie railvoertuigen, als bedoeld in het eerste lid, dat per uur,
      gemiddeld over een etmaalperiode, op een bepaald emissietraject passeert;




                *snelheid:*


                de voor het betreffende emissietraject representatief te achten snelheid per categorie railvoertuigen,
      als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0004171/2005-02-25#Artikel1
  - number: '2'
    text: |-
      Bij de bepaling van het emissiegetal van een bepaald emissietraject wordt rekening gehouden met:

      a. de verkeersintensiteiten van de onderscheidene categorieën railvoertuigen;

      b. de snelheid van de onderscheidene categorieën railvoertuigen;

      c. de specifieke geluidemissies van de onderscheidene categorieën railvoertuigen;

      d. de bronhoogten die representatief te achten zijn voor de betrokken categorieën railvoertuigen;

      e. de mogelijke extra geluidemissie die optreedt bij het remmen van de betrokken categorieën railvoertuigen;

      f. de voor het betreffende emissietraject karakteristieke baangesteldheid;

      g. de wijze van spoorstaafoplegging.
    url: https://wetten.overheid.nl/BWBR0004171/2005-02-25#Artikel2
  - number: 2a
    text: |-
      1 De Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer draagt zorg voor de samenstelling en het
      beheer van een emissieregister, waarin de gegevens worden vastgelegd, bedoeld in hoofdstuk 8 van de bijlage bij
      deze regeling.

      2 Het emissieregister is openbaar.
    url: https://wetten.overheid.nl/BWBR0004171/2005-02-25#Artikel2a
  - number: '3'
    text: |-
      1 Bij de bepaling van het equivalente geluidsniveau op een bepaalde plaats buiten een woning of ander
      geluidsgevoelig gebouw ten behoeve van de vaststelling van de geluidsbelasting vanwege een spoorweg, wordt rekening
      gehouden met:

      a. de emissiegegevens, zoals vastgelegd in het emissieregister, bedoeld in [artikel 2a][ref1], van de
      emissietrajecten die voor de desbetreffende locatie relevant zijn;

      b. de verzwakking van het geluid ten gevolge van de geometrische uitbreiding van het geluidsveld;

      c. de verzwakking van het geluid door absorptie van geluidenergie in de atmosfeer;

      d. de invloed van de bodem op de geluidoverdracht;

      e. de meteorologische invloeden van de geluidoverdracht.

      2 Bij de bepaling van het equivalente geluidsniveau wordt, afhankelijk van de situatie, bovendien rekening gehouden
      met de effecten op de geluidoverdracht, die het gevolg zijn van een of meer:

      a. reflecties van het geluid;

      b. afscherming van het greluid.

      3 Indien het equivalente geluidsniveau wordt bepaald ter plaatse van de gevel van een woning of andere
      geluidsgevoelig gebouw, wordt slechts rekening gehouden met het op de gevel invallend geluid.

      4 De Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer kan, na overleg met de instanties die op
      de desbetreffende locatie de infrastructuur en het gebruik daarvan beheren, afwijking toestaan van het eerste lid,
      onder a, indien de daar bedoelde gegevens onvoldoende representatief zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0004171#Artikel2a
    url: https://wetten.overheid.nl/BWBR0004171/2005-02-25#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0004171
        artikel: 2a
  - number: '4'
    text: |-
      Het emissiegetal van een bepaald emissietraject en het equivalente geluidsniveau vanwege een spoorweg kan worden
      bepaald door middel van berekening, dan wel meting.
    url: https://wetten.overheid.nl/BWBR0004171/2005-02-25#Artikel4
  - number: '5'
    text: |-
      1 De berekening van het emissiegetal van een bepaald emissietraject wordt uitgevoerd volgens de in hoofdstuk 2 en 3
      van de bijlage bij deze regeling beschreven methode.

      2 In gevallen waarin de in het eerste lid genoemde methode leidt tot een voor de betreffende situatie onvoldoende
      representatief emissiegetal, wordt het emissiegetal met behulp van meting bepaald.
    url: https://wetten.overheid.nl/BWBR0004171/2005-02-25#Artikel5
  - number: '6'
    text: |-
      1 Het equivalente geluidsniveau wordt berekend volgens de standaard-rekenmethode II, bedoeld in hoofdstuk 5 van de
      bijlage bij deze regeling.

      2 Indien de standaard-rekenmethode I, bedoeld in hoofdstuk 4 van de bijlage bij deze regeling, of de
      standaardmeetmethode, bedoeld in hoofdstuk 6 van die bijlage, een voor de desbetreffende situatie voldoende
      representatief resultaat geeft, kunnen deze, in afwijking van het eerste lid, worden toegepast voor de bepaling van
      het equivalente geluidsniveau.
    url: https://wetten.overheid.nl/BWBR0004171/2005-02-25#Artikel6
  - number: '8'
    text: |-
      De resultaten van het akoestisch onderzoek ter bepaling van het equivalente geluidsniveau als bedoeld in
      [artikel 3][ref1], worden vastgelegd in een rapport ingericht overeenkomstig het in hoofdstuk 7 van de bijlage bij
      deze regeling van deze regeling bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0004171#Artikel3
    url: https://wetten.overheid.nl/BWBR0004171/2005-02-25#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004171
        artikel: '3'
  - number: '9'
    text: |-
      1 De waarde van het door berekening of door meting verkregen equivalente geluidsniveau, wordt afgerond naar het
      dichtstbijzijnde gehele getal, waarbij een halve eenheid wordt afgerond naar het even getal.

      2 Bij de vaststelling van het verschil van twee geluidsbelastingswaarden wordt, in afwijking van het eerste lid, de
      afronding slechts toegepast op het resultaat van de verschilberekening.
    url: https://wetten.overheid.nl/BWBR0004171/2005-02-25#Artikel9
  - number: '11'
    text: |-
      1 Deze regeling kan worden aangehaald als: Reken- en Meetvoorschrift Railverkeerslawaai.

      2 Zij treedt in werking met ingang van 1 juli 1987.
    url: https://wetten.overheid.nl/BWBR0004171/2005-02-25#Artikel11
