    text: |-
      1 De Minister vraagt advies aan de Autoriteit Consument en Markt voorafgaande aan:

      a. het afwijken, bedoeld in [artikel 10, tweede lid, tweede volzin, van de wet][ref1],

      b. de vaststelling van de gewogen gemiddelde vermogenskostenvoet, bedoeld in
      [artikel 10, derde lid, van de wet][ref2],

      c. de beoordeling van een verzoek tot fusie als bedoeld in [artikel 18, tweede lid, van de wet][ref3], voor zover
      het de doelmatige drinkwatervoorziening, bedoeld in [artikel 7, eerste lid, onder a, van de wet][ref4], in relatie
      tot de voorgenomen fusie betreft,

      d. de vaststelling van de nadere regels, bedoeld in de [artikelen 6, tweede lid][ref5], en
      [8, vierde lid, van het besluit][ref6],

      e. de vaststelling van het maximaal toegestane aandeel eigen vermogen, bedoeld in
      [artikel 7, tweede lid, van het besluit][ref7].

      2 De inspecteur vraagt bij de uitoefening van het toezicht op de naleving van
      [artikel 12, derde lid, van de wet][ref8] en van [paragraaf 2.1 van het besluit][ref9] advies aan de Autoriteit
      Consument en Markt.


