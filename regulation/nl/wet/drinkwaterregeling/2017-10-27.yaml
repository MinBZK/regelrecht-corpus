  - number: '10'
    text: |-
      1 Indien een drinkwaterbedrijf, collectieve watervoorziening of collectief leidingnet in gebruik is, beschikt de
      eigenaar daarvan over een daarop betrekking hebbend meetprogramma dat voldoet aan de in [bijlage 3][ref1] bij deze
      regeling opgenomen tabellen en bestaat uit het nemen en analyseren van verschillende watermonsters of metingen die
      in het kader van een doorlopend proces van controle worden geregistreerd. De eigenaar evalueert voortdurend het
      meetprogramma. Bij wijzigingen in de feitelijke situatie of vanwege de evaluatie past de eigenaar het meetprogramma
      daaraan voorafgaand respectievelijk daarop aan.

      2 Het eerste lid is niet van toepassing op de eigenaar van een collectief leidingnet of van een collectieve
      watervoorziening voor warm tapwater, uitsluitend voor zover daarmee, berekend over een kalenderjaar, per dag
      gemiddeld minder dan 100 m3 drinkwater, onderscheidenlijk minder dan 10 m3 warm tapwater, wordt gedistribueerd. Het
      eerste lid is evenmin van toepassing op de eigenaar van een collectieve watervoorziening voor warm tapwater, niet
      zijnde een wijkwarmtapwatervoorziening.

      3 Een meetprogramma als bedoeld in het eerste lid dat betrekking heeft op een drinkwaterbedrijf behoeft jaarlijks
      goedkeuring van de inspecteur. Een meetprogramma als bedoeld in het eerste lid dat betrekking heeft op eigen
      winning behoeft eenmaal in de vijf jaar goedkeuring van de inspecteur. Het programma wordt daartoe door de
      eigenaar van dat bedrijf of die winning na vaststelling of wijziging voorgelegd aan de inspecteur, in de door deze
      aangegeven vorm.

      4 De eigenaar, bedoeld in het eerste lid, onderzoekt het water in de frequentie en op de plaatsen, aangegeven in
      het meetprogramma, bedoeld in dat lid.

      5 Indien en voor zolang de eigenaar niet beschikt over een meetprogramma dat in overeenstemming is met het eerste
      lid dan wel, in de gevallen, bedoeld in het derde lid, niet beschikt over een goedgekeurd meetprogramma, verricht
      hij metingen overeenkomstig de in [bijlage 3][ref2] bij deze regeling opgenomen tabellen.

      6 Voor micro-organismen, parasieten en stoffen die niet zijn genoemd in de tabellen I, II en III van
      [bijlage A bij het besluit][ref3], verricht de eigenaar van een drinkwaterbedrijf, collectieve watervoorziening
      of collectief leidingnet metingen indien er redenen zijn om aan te nemen dat deze aanwezig zijn in aantallen per
      volume-eenheid of concentraties die nadelige gevolgen voor de volksgezondheid kunnen hebben.

      7 De toezichthouder kan bepalen dat door hem aangegeven parameters, genoemd in [bijlage 3][ref4] bij deze regeling,
      frequenter worden onderzocht dan in die bijlage is aangegeven. Tevens kan hij bepalen dat andere dan de in
      bijlage 3 bij deze regeling genoemde, door hem aangegeven parameters, onderzocht worden in een door hem aangegeven
      frequentie, indien dat naar zijn oordeel van belang is voor het verkrijgen van voldoende inzicht in de kwaliteit
      van het water.


      [ref1]: https://wetten.overheid.nl/BWBR0030152
