      1 De voorziening voor productie en distributie van huishoudwater voldoet aan de daaraan gestelde bepalingen in de
      onderdelen 4.7.2. en 4.7.3 van NEN 1006:2002/A3:2011.

      2 De eigenaar van de voorziening voor productie en distributie van huishoudwater:

      a. beschikt over actuele tekeningen en beschrijvingen van de installatie,

      b. voert de beheersmaatregelen uit die zijn opgenomen in de gebruikershandleiding die door de leverancier van de
      installatie is verstrekt, en

      c. houdt van de uitvoering van de beheersmaatregelen aantekening in een logboek, dat ter plaatste van de
      voorziening aanwezig is.

      3 Het is de eigenaar van een drinkwaterbedrijf niet toegestaan om zonder daartoe door de Minister verleende
      ontheffing huishoudwater te produceren voor consumenten of andere afnemers of aan hen huishoudwater te leveren.
