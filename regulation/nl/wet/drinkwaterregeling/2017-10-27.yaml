  - number: '20'
    text: |-
      1 Het in [artikel 14, tweede lid, van het Besluit gewasbeschermingsmiddelen en biociden][ref1] bedoelde verbod is
      niet van toepassing indien de toegepaste biociden zodanig snel afbreken dat ze niet meer in het drinkwater aanwezig
      zijn op het punt waar het drinkwater gebruikt wordt.

      2 Onverminderd het eerste lid is het de eigenaar van een drinkwaterbedrijf,
      collectieve watervoorziening of collectief leidingnet toegestaan om overeenkomstig
      [artikel 14, tweede lid, van het Besluit gewasbeschermingsmiddelen en biociden][ref2], biociden toe te passen bij
      de productie en distributie van drinkwater, voor zover gewaarborgd wordt dat het ten behoeve van de desinfectie
      behandelde water niet wordt geconsumeerd.

      3 Onverminderd het eerste en tweede lid is het de eigenaar van een drinkwaterbedrijf,
      collectieve watervoorziening of collectief leidingnet toegestaan om overeenkomstig
      [artikel 14, tweede lid, van het Besluit gewasbeschermingsmiddelen en biociden][ref3], biociden toe te passen bij
      de productie en distributie van drinkwater, voor zover:

      a. hij ten minste twee weken voor de aanvang van de toepassing daarvan melding heeft gedaan aan de Minister dan
      wel, in geval van een noodsituatie, hij daarvan onverwijld melding doet aan de inspecteur die zo nodig nadere
      aanwijzingen kan geven;

      b. er gevaar dreigt of bestaat voor de volksgezondheid vanwege microbiologische verontreiniging van het drinkwater;

      c. er redelijkerwijs geen andere mogelijkheden zijn de microbiologische verontreiniging te bestrijden of te
      voorkomen, en

      d. hij waarborgt dat het drinkwater aan het tappunt voldoet aan de eisen gesteld in
      [artikel 21, eerste lid, van de wet][ref4] en [artikel 13 van het besluit][ref5].


