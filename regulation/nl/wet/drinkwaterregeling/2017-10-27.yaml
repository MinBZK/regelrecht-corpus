  - number: '11'
    text: |-
      1 De eigenaar van een drinkwaterbedrijf die drinkwater betrekt dat geleverd is door een ander teneinde dit
      zonder behandeling aan derden ter beschikking te stellen, onderzoekt dat ter plaatse waar hij dit water betrekt
      overeenkomstig de tabellen Ia, Ib en II, opgenomen in [bijlage 3][ref1] bij deze regeling. In het meetprogramma kan
      op basis van een goedgekeurde risicobeoordeling hiervan gemotiveerd worden afgeweken. Indien het drinkwater wordt
      betrokken van een ander drinkwaterbedrijf kan de inspecteur toestaan dat de levering van onderzoeksgegevens van het
      andere bedrijf wordt beschouwd als uitvoering van het onderzoek, bedoeld in de eerste volzin.

      2 In alle overige gevallen dan bedoeld in het eerste lid worden de monsters aan de tappunten genomen, met
      uitzondering van de monsters waarvan in de kolom ‘monsterplaats’ in de tabellen van [bijlage 3][ref2] bij deze
      regeling is aangegeven voor welke parameters de monsters of een deel daarvan ter plaatse van de inname van het
      gebruikte grondwater of oppervlaktewater dan wel na behandeling daarvan mogen worden genomen.

      3 De monstername geschiedt op een zodanig tijdstip en op zodanige wijze, dat de uitkomsten van het onderzoek
      representatief zijn voor de hoedanigheid van het desbetreffende water.

      4 Een monster dat niet ter plaatse wordt geanalyseerd wordt zodanig bewaard dat daardoor de uitkomsten van het
      onderzoek niet in betekenende mate worden beïnvloed.

      5 De eigenaar die gebruik maakt van oppervlaktewater ten behoeve van de bereiding van drinkwater

      verricht het onderzoek of neemt de monsters daarvoor op een plaats die representatief is voor de waterkwaliteit op
      het punt waar het oppervlaktewater vóór de zuiveringsbehandeling wordt onttrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0030152
      [ref2]: https://wetten.overheid.nl/BWBR0030152
    url: https://wetten.overheid.nl/BWBR0030152/2017-10-27#Artikel11
