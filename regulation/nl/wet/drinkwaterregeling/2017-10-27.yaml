  - number: '12'
    text: |-
      1 De eigenaar van een drinkwaterbedrijf draagt er zorg voor dat:

      a. de door het pompstation afgeleverde hoeveelheden water voortdurend, of ten minste elk uur, worden geregistreerd;

      b. de druk van het water voortdurend wordt geregistreerd op de plaatsen die op voordracht van de eigenaar door de
      inspecteur worden vastgesteld.

      2 De eigenaar houdt de in het eerste lid bedoelde gegevens gedurende ten minste vijf jaar beschikbaar.
    url: https://wetten.overheid.nl/BWBR0030152/2017-10-27#Artikel12
  - number: '13'
    text: |-
      1 Bij het uitvoeren van onderzoek als bedoeld in de [artikelen 9][ref1], [10][ref2], [10a][ref3] en [11][ref4]
      worden de specificaties, genoemd in [bijlage 4][ref5] bij deze regeling, in acht genomen. Voor de in tabel I van
      bijlage 4 bij deze regeling genoemde parameters worden de daar genoemde analysemethoden toegepast.

      2 In afwijking van het eerste lid, tweede volzin, kan de inspecteur op verzoek van degene die de analyses uitvoert
      toestaan dat van alternatieve analysemethoden gebruik wordt gemaakt, indien deze naar zijn oordeel ten minste even
      betrouwbaar zijn als de analysemethoden, bedoeld in het eerste lid. Bij zijn verzoek verstrekt de aanvrager alle
      voor de beoordeling van de alternatieve analysemethode relevante gegevens in de door de inspecteur aangegeven vorm.
      De inspecteur meldt de toepassing van de alternatieve analysemethode aan de Minister.

      3 Voor de in tabel II van [bijlage 4][ref6] bij deze regeling genoemde parameters worden bij de analyse de daar
      vermelde prestatiekenmerken in acht genomen.


