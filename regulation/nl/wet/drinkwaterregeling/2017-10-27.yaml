  - number: '14'
    text: |-
      1 De eigenaar van een drinkwaterbedrijf verstrekt aan de inspecteur per meetpunt voor iedere in het meetprogramma
      opgenomen parameter in ieder geval de volgende gegevens:

      a. het aantal uitgevoerde metingen,

      b. de minimum meetwaarde,

      c. de gemiddelde meetwaarde,

      d. de maximum meetwaarde,

      e. het aantal over- of onderschrijdingen van de in [bijlage A bij het besluit][ref1] opgenomen kwaliteitseisen,

      f. de eventuele percentielwaarden.

      Tevens geeft de eigenaar van een drinkwaterbedrijf aan de inspecteur een schriftelijke toelichting op afwijkingen
      van de voorgeschreven meetfrequenties en op over- of onderschrijdingen van de in [bijlage A bij het besluit][ref2]
      opgenomen kwaliteitseisen.

      2 De eigenaar van een drinkwaterbedrijf verstrekt de in het eerste lid bedoelde gegevens in het format van
      het computerprogramma REWAB (Registratie opgaven van drinkwaterbedrijven) of een soortgelijke opvolger van dit
      programma.

      3 De eigenaar van een eigen winning verstrekt de kwaliteitsgegevens op diens verzoek aan de inspecteur volgens een
      door de inspecteur voorgeschreven en beschikbaar gesteld elektronisch format.

      4 Voor zover de eigenaar van een collectieve voorziening voor warm tapwater op grond van
      [artikel 10, eerste lid][ref3], gehouden is om over een meetprogramma te beschikken, verstrekt hij de in het
      eerste lid bedoelde gegevens op diens verzoek aan de inspecteur volgens een door de inspecteur voorgeschreven en
      beschikbaar gesteld elektronisch format.

      5 De representatieve samenvatting, bedoeld in [artikel 26, vierde lid, van het besluit][ref4], wordt aan de
      inspecteur verstrekt in de vorm van een begeleidende brief bij de aanbieding van de gegevens als bedoeld in het
      eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0030111
      [ref2]: https://wetten.overheid.nl/BWBR0030111
      [ref3]: https://wetten.overheid.nl/BWBR0030152#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0030111#Artikel26
