  - number: 10a
    text: |-
      1 In afwijking van [artikel 10][ref1] kan, indien een drinkwaterbedrijf, collectieve watervoorziening of
      collectief leidingnet in gebruik is, de eigenaar daarvan een risicobeoordeling opstellen om de parameters en de
      meetfrequenties van de bewakings- en audit parameters in [bijlage 3][ref2], tabellen Ia, Ib, II, IIIa en IIIb, bij
      deze regeling te bepalen. De risicobeoordeling geschiedt op basis van de algemene beginselen van risicobeoordeling
      op basis van internationale normen.

      2 In de risicobeoordeling wordt in ieder geval rekening gehouden met de
      controleprogramma’s en de resultaten daarvan, die zijn vastgesteld overeenkomstig
      [artikel 11 tot en met 17 van het Besluit kwaliteitseisen en monitoring water 2009][ref3].

      3 Een risicobeoordeling dat betrekking heeft op een drinkwaterbedrijf behoeft jaarlijks de goedkeuring van de
      inspecteur. Andere risicobeoordelingen behoeven eenmaal in de vijf jaar de goedkeuring van de inspecteur.

      De risicobeoordeling wordt daartoe door de eigenaar van het drinkwaterbedrijf, collectieve watervoorziening
      of collectief leidingnet na vaststelling of wijziging voorgelegd aan de inspecteur, in de door deze aangegeven
      vorm. Het drinkwaterbedrijf, collectieve watervoorziening of collectief leidingnet heeft informatie beschikbaar
      waaruit blijkt dat een risicobeoordeling heeft plaatsgevonden, samen met een samenvatting van de resultaten van
      de risicobeoordeling.

      4 De toezichthouder kan op basis van de resultaten van de risicobeoordeling bepalen dat voor de eigenaar, bedoeld
      in het eerste lid, de lijst van bewakings- en audit parameters, genoemd in [bijlage 3][ref4], tabellen Ia, Ib, IIIa
      en IIIb, bij deze regeling, wordt uitgebreid en dat de bemonsteringsfrequenties, genoemd in bijlage 3, tabellen II,
      IIIa en IIIb, bij deze regeling, worden verhoogd indien:

      a. de lijst van parameters in [bijlage 3][ref5], tabel Ia, tabel Ib of de frequenties in bijlage 3, tabellen II,
      IIIa en IIIb, bij deze regeling niet volstaat om te voldoen aan de verplichtingen om te controleren dat wordt
      voldaan aan de kwaliteitseisen, bedoeld in de [artikelen 13][ref6], [31][ref7] en [33 van het besluit][ref8];

      b. bijkomende controle is vereist voor stoffen of micro-organismen waarvoor geen parameterwaarden zijn vastgesteld
      in [bijlage A bij het besluit][ref9], indien er reden is om aan te nemen dat deze stoffen of micro-organismen
      aanwezig zijn in hoeveelheden of aantallen die gevaar voor de volksgezondheid kunnen opleveren; of

      c. de nodige waarborgen moeten worden geleverd om na te gaan of de drinkwaterkwaliteit van bron tot tap moet worden
      beheerst zodanig dat op het punt waar aan de parameterwaarden van [bijlage 3][ref10] bij deze regeling moet worden
      voldaan, het drinkwater voldoet aan de kwaliteitseisen van het [Drinkwaterbesluit][ref11].

      5 De toezichthouder kan op basis van de resultaten van de risicobeoordeling bepalen dat voor de eigenaar, bedoeld
      in het eerste lid, de lijst van bewakings- en audit parameters, genoemd in [bijlage 3][ref12], tabel Ia, Ib,
      IIIa en IIIb bij deze regeling wordt beperkt en de bemonsteringsfrequenties van bijlage 3, tabel II, IIIa en IIIb
      bij deze regeling wordt verlaagd, met inachtneming van de herkomst van de parameter en van de variatie en lange
      termijnontwikkeling van diens concentratie, indien de risicobeoordeling bevestigt dat geen enkele redelijkerwijs te
      voorziene factor aanwezig is waardoor de kwaliteit van het voor menselijk consumptie bestemde water achteruit zou
      kunnen gaan in het geval van het verlagen van een bemonsteringsfreguentie of het schrappen van een parameter, en,

      a. indien de resultaten van de monsters die in een periode van ten minste drie jaar met regelmatige tussenpozen
      zijn genomen op plaatsen die representatief zijn voor het volledige leveringsgebied minder dan 60% van de
      parameterwaarde bedragen in het geval van een verlaging van de minimumfrequentie voor monsterneming van een
      parameter als bedoeld in [bijlage 3][ref13], tabellen II, IIIa en IIIb, bij deze regeling; of,

      b. indien de resultaten van de monsters die in een periode van ten minste drie jaar met regelmatige tussenpozen
      zijn genomen op plaatsen die representatief zijn voor het volledige leveringsgebied minder dan 30% van de
      parameterwaarde bedragen in het geval van het schrappen van de lijst van de te controleren parameters, bedoeld in
      [bijlage 3][ref14], tabellen Ia, Ib, IIIa en IIIb, bij deze regeling, en de controleresultaten van voor menselijke
      consumptie bestemd water bevestigen dat de volksgezondheid is beschermd tegen de schadelijke gevolgen van
      verontreiniging van voor menselijke consumptie bestemd water in het geval van het schrappen van een parameter als
      bedoeld in bijlage 3, tabellen Ia, Ib, IIIa en IIIb, bij deze regeling.

      6 Het vijfde lid is niet van toepassing op de bemonsteringsfrequenties voor Escherichia Coli.


