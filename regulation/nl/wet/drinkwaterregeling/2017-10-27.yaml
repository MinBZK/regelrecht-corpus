  - number: '9'
    text: |-
      1 Het nemen en analyseren van monsters ter uitvoering van het [besluit][ref1] geschiedt door laboratoria die een
      kwaliteitsborgingssysteem hanteren dat gebaseerd is op NEN-EN-ISO/IEC 17025 of een gelijkwaardige norm en die
      daarvoor overeenkomstig deze norm geaccrediteerd zijn.

      2 Het nemen van monsters ter uitvoering van het [besluit][ref2] kan tevens plaatsvinden door bedrijven en personen
      die een kwaliteitsborgingssysteem hanteren dat gebaseerd is op NEN-EN-ISO/IEC 17025 of een gelijkwaardige norm en
      die daarvoor overeenkomstig deze norm geaccrediteerd zijn.

      3 Een gelijkwaardige norm als bedoeld in het eerste en tweede lid wordt uitsluitend toegepast na daartoe verkregen
      toestemming van de inspecteur. Bij de aanvraag tot toestemming als bedoeld in de eerste volzin, worden alle voor de
      beoordeling van de gelijkwaardigheid van bedoelde norm relevante gegevens in de door de inspecteur aangegeven vorm
      aan hem overgelegd.

      4 Het nemen en analyseren van monsters ter uitvoering van het [besluit][ref3] ten behoeve van drinkwaterbedrijven
      geschiedt door laboratoria als bedoeld in het eerste lid die daartoe zijn aangewezen door de Minister.

      5 Bij de aanwijzing, bedoeld in het vierde lid, hanteert de Minister de volgende criteria:

      a. de positie van het laboratorium ten opzichte van de procesverantwoordelijke voor winning, zuivering, transport
      en distributie bij het drinkwaterbedrijf;

      b. de deskundigheid van de medewerkers van het laboratorium op het terrein van de relevante wetgeving en de
      waterkwaliteit, van grondstof tot tappunt;

      c. de capaciteit die het laboratorium heeft om ook bij calamiteiten voldoende personeel en apparatuur in te kunnen
      zetten;

      d. de breedte van het analysepakket;

      e. waarborgen omtrent de tijdigheid, volledigheid, juistheid en toegankelijkheid van de rapportage van
      het laboratorium aan de procesverantwoordelijke voor winning, zuivering, transport en distributie bij het
      drinkwaterbedrijf.

      6 De laboratoria, genoemd in [bijlage 2][ref4] bij deze regeling, worden aangemerkt als laboratoria die zijn
      aangewezen overeenkomstig het vierde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0030111
