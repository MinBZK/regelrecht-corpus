  - number: '15'
    text: |-
      1 De eigenaar van een wijkwarmtapwatervoorziening, waarmee gemiddeld per dag meer dan 10 m3 warm tapwater per
      dag wordt geleverd, beschikt over een kwaliteitsmanagementsysteem, gebaseerd op NEN-EN-ISO 9001:2008/C1:2009, dat
      betrekking heeft op de borging van de kwaliteit van het geleverde warm tapwater.

      2 Een kwaliteitsmanagementsysteem als bedoeld in het eerste lid, is of wordt gecertificeerd door een bij de Raad
      voor Accreditatie daarvoor geaccrediteerde certificatie-instelling of door een certificatie-instelling die daarvoor
      is geaccrediteerd door een andere accreditatie-instelling die ondertekenaar is van de Multilateral Agreement van de
      European co-operation for Accreditation (EA-01/06).

      3 Het kwaliteitsmanagementsysteem, bedoeld in het eerste lid, omvat de volgende onderdelen:

      a. algemeen deel, bestaande uit:

      1°. een beschrijving van het systeem en kwetsbare elementen daarin,

      2°. wijze waarop de kwaliteitsborging plaatsvindt, en

      3°. contactgegevens;

      b. waterkwaliteit, bestaande uit:

      1°. een risicoanalyse van de installaties in relatie tot waterkwaliteit,

      2°. de wijze waarop werkzaamheden plaatsvinden in relatie tot de waterkwaliteit en hoe dit geborgd is in de
      bedrijfsvoering,

      3°. welke kwaliteitsbewaking van het systeem plaatsvindt en welke metingen en controles daartoe worden verricht, en

      4°. hoe groei van legionellabacteriën en andere micro-organismen wordt voorkomen

      c. beveiliging, bestaande uit:

      1°. voorzieningen, beheersmaatregelen en controles om verbrandingsrisico’s te voorkomen,

      2°. analyse van kwetsbare doelgroepen onder afnemers van het warm tapwater in relatie tot verbrandingsrisico’s, en

      3°. voorzieningen, beheersmaatregelen en controles om terugstroming van warm tapwater in het distributienet van de
      drinkwatervoorziening te voorkomen;

      d. inspecties, bestaande uit:

      1°. inspectieschema’s en maatregelen bij afwijkingen,

      2°. monsternameschema’s, en

      3°. wijze van rapportage over metingen en controles;

      e. communicatie, zijnde een communicatieplan voor situaties van storingen en calamiteiten, in relatie tot het
      drinkwaterbedrijf, de inspecteur en de afnemers.

      4 De Minister kan een handleiding aanwijzen die de eigenaar moet gebruiken bij het opstellen van het
      kwaliteitsmanagementsysteem.

      5 De in het eerste lid bedoelde eigenaar draagt er zorg voor dat jaarlijks een auditrapport wordt opgesteld door
      een certificatie-instelling als bedoeld in het tweede lid, en dat dit rapport ter inzage ligt voor de inspecteur.

      6 Indien de certificatie-instelling het certificaat van de in het eerste lid bedoelde eigenaar intrekt dan wel
      significante afwijkingen van de desbetreffende kwaliteitseisen constateert, stelt de eigenaar de inspecteur daar
      terstond en volledig van op de hoogte.

      7 Indien toepassing is gegeven aan het vierde lid, kan de inspecteur, indien het kwaliteitsmanagementsysteem
      van de in het eerste lid bedoelde eigenaar niet voldoet aan de eisen die daaraan worden gesteld overeenkomstig
      de handleiding, bedoeld in het vierde lid, aanwijzingen geven en daarbij bepalen op welke wijze en binnen welke
      termijn alsnog aan die eisen moet worden voldaan.
    url: https://wetten.overheid.nl/BWBR0030152/2017-10-27#Artikel15
  - number: '16'
    text: |-
      1 De eisen gesteld aan het oppervlaktewater waaruit drinkwater kan worden bereid, bedoeld in
      [artikel 30, eerste lid, aanhef en onder b, van het besluit][ref1], zijn opgenomen in [bijlage 5][ref2].

      2 Indien niet wordt voldaan aan een in [bijlage 5][ref3] opgenomen kwaliteitseis meldt het drinkwaterbedrijf deze
      afwijking onverwijld aan de inspecteur.

      3 Indien naar verwachting gedurende een periode, langer dan 30 dagen, niet wordt voldaan aan een in
      [bijlage 5][ref4] opgenomen kwaliteitseis, verzoekt het drinkwaterbedrijf de Minister om een ontheffing van de
      desbetreffende kwaliteitseis. In afwachting van het besluit van de Minister kan de inname worden voortgezet.

      4 Het verbod, bedoeld in [artikel 22, tweede lid, van de wet][ref5], is niet van toepassing op een situatie
      als bedoeld in het tweede of derde lid, voor zover het oppervlaktewater voor de bereiding van drinkwater wordt
      behandeld op een wijze als bedoeld in het achtste lid.

      5 De Minister kan een ontheffing als bedoeld in het derde lid verlenen indien:

      a. de eigenaar een zodanige behandeling, met inbegrip van menging, van het water kan toepassen dat
      het bereide drinkwater voldoet aan de eisen, gesteld in [artikel 21, eerste lid, van de wet][ref6] en
      [artikel 13 van het besluit][ref7];

      b. de eigenaar is aangewezen op het gebruik van het desbetreffende oppervlaktewater voor de bereiding van
      drinkwater, en

      c. het belang van de bescherming van de volksgezondheid zich niet verzet tegen het gebruik van dit oppervlaktewater
      voor de bereiding van drinkwater.

      6 De in het vijfde lid, onderdeel a, opgenomen voorwaarde voor een ontheffing is niet van toepassing:

      1°. voor zover van een kwaliteitseis ontheffing is verleend op grond van [artikel 28 van het besluit][ref8], in
      welk geval voldaan moet worden aan de bij de ontheffing vastgestelde waarde, of

      2°. in geval van een normoverschrijding als bedoeld in [artikel 25, eerste lid, van dat besluit][ref9], en de
      toezichthouder overeenkomstig het tweede en derde lid van dat artikel van oordeel is dat deze geen nadelige
      gevolgen heeft voor de gezondheid van de consumenten en voor de aan hen toebehorende goederen.

      7 De Minister doet van een ontheffing op grond van het vijfde lid mededeling aan het openbaar
      lichaam dat belast is met het waterkwaliteitsbeheer van het betrokken oppervlaktewater, bedoeld in
      [artikel 3.1 van de Waterregeling][ref10].

      8 De wijze van behandeling van het oppervlaktewater gebruikt voor de bereiding van drinkwater is zodanig dat ook in
      een situatie als bedoeld in het tweede of derde lid, het daarmee bereide drinkwater voldoet aan de kwaliteitseisen,
      gesteld in [artikel 21, eerste lid, van de wet][ref11], en [artikel 13 van het besluit][ref12].

      9 Het achtste lid is niet van toepassing:

      a. voor zover van een kwaliteitseis ontheffing is verleend op grond van [artikel 28 van het besluit][ref13], in
      welk geval moet worden voldaan aan de bij de ontheffing vastgestelde waarde, of

      b. in geval van het niet voldoen aan een eis als bedoeld in [artikel 25, eerste lid, van het besluit][ref14], en
      de toezichthouder overeenkomstig het tweede en derde lid van dat artikel van oordeel is dat deze geen nadelige
      gevolgen heeft voor de gezondheid van de consumenten en voor de aan hen toebehorende goederen.


