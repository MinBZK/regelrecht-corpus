      1 De maximaal toegestane vermogenskosten die de eigenaar van een drinkwaterbedrijf mag
      doorberekenen in het drinkwatertarief worden berekend als het product van de op grond van
      [artikel 10, vierde lid, van het besluit][ref1] vastgestelde vermogenskostenvergoeding en de activawaarde, bedoeld
      in [artikel 11, vierde lid, van de wet][ref2].

      2 De activawaarde, bedoeld in het eerste lid, is het gemiddelde van het begrote totaal van de activa per 1 januari
      en 31 december van het jaar waarvoor de toegestane vermogenskosten worden berekend. Liquide middelen worden niet
      gerekend tot de activawaarde.


      [ref1]: https://wetten.overheid.nl/BWBR0030111#Artikel10
