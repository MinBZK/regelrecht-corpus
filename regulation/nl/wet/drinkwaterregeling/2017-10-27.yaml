      Ten behoeve van de berekening van de gewogen gemiddelde vermogenskostenvoet, bedoeld in
      [artikel 10, eerste lid, van de wet][ref1], overeenkomstig [bijlage C van het besluit][ref2], hanteert de Minister
      de volgende uitgangspunten:

      a. De risicovrije rente wordt gebaseerd op een nominale Nederlandse staatsobligatie met een looptijd van tien jaar,
      aan de hand van het gemiddelde gerealiseerde rendement over de voorafgaande twee jaren en de voorafgaande vijf
      jaren;

      b. de renteopslag wordt gebaseerd op:

      1°. de historische renteopslag van een geschikte groep van ondernemingen met activiteiten die vergelijkbaar zijn
      met die van de drinkwaterbedrijven en met een vergelijkbare kredietwaardigheid,

      2°. de gemiddelde historische renteopslag op een index van obligaties van ondernemingen met een vergelijkbare
      kredietwaardigheid;

      c. bovenop de renteopslag worden transactiekosten berekend;

      d. de marktrisicopremie wordt gebaseerd op zowel historisch gerealiseerde rendementen als op verwachtingen over
      toekomstige rendementen;

      e. de equity bèta wordt bepaald op basis van beursgenoteerde ondernemingen met vergelijkbare activiteiten en een
      vergelijkbaar risicoprofiel;

      f. het aandeel eigen vermogen ten behoeve van de bepaling van de gewogen gemiddelde vermogenskostenvoet
      wordt gebaseerd op gegevens over het aandeel eigen vermogen van ondernemingen die vergelijkbaar zijn met
      drinkwaterbedrijven, met een gezonde financiële positie.


      [ref1]: https://wetten.overheid.nl/BWBR0026338#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0030111
