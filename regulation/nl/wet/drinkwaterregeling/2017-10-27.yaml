articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

        - *besluit:* [Drinkwaterbesluit][ref1];
        - *eigen winning:* collectieve watervoorziening waarbij de eigenaar van de voorziening voor de winning
      of behandeling van water, dat als drinkwater ter beschikking wordt gesteld, gebruik maakt van grondwater,
      oppervlaktewater, zeewater of een overeenkomstige grondstof of halffabrikaat, niet zijnde een voorziening voor
      de productie of distributie van water op een binnen het Nederlandse territoir of het Nederlandse deel van het
      continentale plat gelegen mijnbouwinstallatie als bedoeld in [artikel 1, onderdeel o, van de Mijnbouwwet][ref2];
        - *Minister:* Minister van Infrastructuur en Milieu;
        - *wet:* [Drinkwaterwet][ref3];
        - *wijkwarmtapwatervoorziening:* collectieve watervoorziening voor de productie of distributie van warm tapwater,
      waarbij het distributienet in de bodem ligt.


