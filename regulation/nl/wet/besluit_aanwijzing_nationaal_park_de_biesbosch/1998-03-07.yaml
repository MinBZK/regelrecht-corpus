preamble:
  text: |-
    Gezien het advies van de Voorlopige Commissie Nationale Parken van 8 februari 1993;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0006508/1998-03-07#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

            a
            minister:

              Minister van Landbouw, Natuurbeheer en Visserij;



            b
            Overlegorgaan:

              Overlegorgaan, bedoeld in [artikel 3][ref1];



            c
            nationaal park:

              gebied zoals omschreven in het Structuurschema Groene Ruimte (Kamerstukken II, 1992/93, 22880, nr. 5, blz.
      99).


      [ref1]: https://wetten.overheid.nl/BWBR0006508#Artikel3
    url: https://wetten.overheid.nl/BWBR0006508/1998-03-07#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006508
        artikel: '3'
  - number: '2'
    text: |-
      Als nationaal park wordt aangewezen het natuurgebied De Biesbosch, zoals aangegeven op de als bijlage bij dit
      besluit behorende kaart.
    url: https://wetten.overheid.nl/BWBR0006508/1998-03-07#Artikel2
  - number: '3'
    text: Er is een Overlegorgaan nationaal park De Biesbosch.
    url: https://wetten.overheid.nl/BWBR0006508/1998-03-07#Artikel3
  - number: '4'
    text: |-
      Het Overlegorgaan heeft tot taak zorg te dragen voor de inrichting en het beheer van het nationaal park De
      Biesbosch. Daartoe behoort onder meer:
    url: https://wetten.overheid.nl/BWBR0006508/1998-03-07#Artikel4
  - number: 4.a
    text: het opstellen en actualiseren van het beheers- en inrichtingsplan;
    url: https://wetten.overheid.nl/BWBR0006508/1998-03-07#Artikel4
  - number: 4.b
    text: de onderlinge afstemming van alle voor de inrichting en het beheer van belang zijn activiteiten;
    url: https://wetten.overheid.nl/BWBR0006508/1998-03-07#Artikel4
  - number: 4.c
    text: |-
      het doen van voorstellen aan de minister voor de besteding en toekenning van de voor het nationaal park De
      Biesbosch beschikbare middelen en een jaarlijks werkprogramma met de daarbij behorende begroting voor activiteiten
      in het kader van het nationaal park De Biesbosch;
    url: https://wetten.overheid.nl/BWBR0006508/1998-03-07#Artikel4
  - number: 4.d
    text: |-
      besteding van gelden op basis van het door de minister goed te keuren bestedingsprogramma, het (doen) opstellen van
      projectplannen, controle op de besteding van gelden en coördinatie van de uitvoering van projecten binnen het kader
      van het beheers- en inrichtingsplan;
    url: https://wetten.overheid.nl/BWBR0006508/1998-03-07#Artikel4
  - number: 4.e
    text: bevordering en coördinatie van voorlichting en educatie met betrekking tot het nationaal park De Biesbosch.
    url: https://wetten.overheid.nl/BWBR0006508/1998-03-07#Artikel4
  - number: '5'
    text: |-
      Het Overlegorgaan voert zijn taak uit overeenkomstig het beheers- en inrichtingsplan voor het nationaal park
      De Biesbosch van februari 1992, met inachtneming van de daarbij bij brief van de Staatssecretaris van Landbouw,
      Natuurbeheer en Visserij van 21 september 1993, kenmerk NBLF 93-2688, geplaatste kanttekeningen.
    url: https://wetten.overheid.nl/BWBR0006508/1998-03-07#Artikel5
  - number: '6'
    text: 'In het Overlegorgaan hebben zitting:'
    url: https://wetten.overheid.nl/BWBR0006508/1998-03-07#Artikel6
  - number: 6.a
    text: één door de minister te benoemen lid, tevens voorzitter;
    url: https://wetten.overheid.nl/BWBR0006508/1998-03-07#Artikel6
  - number: 6.b
    text: 'dertien door de minister te benoemen leden, als vertegenwoordiger en op voordracht van respectievelijk:'
    url: https://wetten.overheid.nl/BWBR0006508/1998-03-07#Artikel6
  - number: 6.b.1
    text: de provincie Zuid-Holland;
    url: https://wetten.overheid.nl/BWBR0006508/1998-03-07#Artikel6
  - number: 6.b.2
    text: de provincie Noord-Brabant;
    url: https://wetten.overheid.nl/BWBR0006508/1998-03-07#Artikel6
  - number: 6.b.3
    text: de gemeente Dordrecht;
    url: https://wetten.overheid.nl/BWBR0006508/1998-03-07#Artikel6
  - number: 6.b.4
    text: de gemeente Made;
    url: https://wetten.overheid.nl/BWBR0006508/1998-03-07#Artikel6
  - number: 6.b.5
    text: de gemeente Werkendam;
    url: https://wetten.overheid.nl/BWBR0006508/1998-03-07#Artikel6
  - number: 6.b.6
    text: het Hoogheemraadschap Alm en Biesbosch;
    url: https://wetten.overheid.nl/BWBR0006508/1998-03-07#Artikel6
  - number: 6.b.7
    text: het Waterschap De Groote Waard;
    url: https://wetten.overheid.nl/BWBR0006508/1998-03-07#Artikel6
  - number: 6.b.8
    text: de N.V. Waterwinningbedrijf Brabantse Biesbosch;
    url: https://wetten.overheid.nl/BWBR0006508/1998-03-07#Artikel6
  - number: 6.b.9
    text: het Natuur- en Recreatieschap De Hollandse Biesbosch;
    url: https://wetten.overheid.nl/BWBR0006508/1998-03-07#Artikel6
  - number: 6.b.10
    text: het Recreatieschap Nationaal Park De Biesbosch;
    url: https://wetten.overheid.nl/BWBR0006508/1998-03-07#Artikel6
  - number: 6.b.11
    text: het Staatsbosbeheer;
    url: https://wetten.overheid.nl/BWBR0006508/1998-03-07#Artikel6
  - number: 6.b.12
    text: het Ministerie van Financiën;
    url: https://wetten.overheid.nl/BWBR0006508/1998-03-07#Artikel6
  - number: 6.b.13
    text: het Ministerie van Verkeer en Waterstaat;
    url: https://wetten.overheid.nl/BWBR0006508/1998-03-07#Artikel6
  - number: 6.c
    text: de Directeur van de Directie Zuid van het Ministerie van Landbouw, Natuurbeheer en Visserij;
    url: https://wetten.overheid.nl/BWBR0006508/1998-03-07#Artikel6
  - number: '7.1'
    text: |-
      Het secretariaat van het overlegorgaan berust bij een door de provincie Noord-Brabant te benoemen ambtenaar van
      die provincie.
    url: https://wetten.overheid.nl/BWBR0006508/1998-03-07#Artikel7
  - number: '7.2'
    text: |-
      Het Overlegorgaan regelt de openbaarheid en de plaats van zijn vergadering, alsmede de overige aspecten van zijn
      inrichting en werkwijze.
    url: https://wetten.overheid.nl/BWBR0006508/1998-03-07#Artikel7
  - number: '7.3'
    text: |-
      Het Overlegorgaan brengt jaarlijks van zijn werkzaamheden en de daarmee samenhangende ontwikkelingen in het
      nationaal park De Biesbosch verslag uit aan de minister.
    url: https://wetten.overheid.nl/BWBR0006508/1998-03-07#Artikel7
  - number: '8'
    text: |-
      Indien in het Overlegorgaan belangrijke verschillen van inzicht blijken te bestaan, doet de voorzitter van het
      Overlegorgaan daarvan mededeling aan de minister, die daarop de naar zijn oordeel nodige stappen onderneemt.
    url: https://wetten.overheid.nl/BWBR0006508/1998-03-07#Artikel8
  - number: '9'
    text: De Regeling aanwijzing nationaal park in oprichting De Biesbosch wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0006508/1998-03-07#Artikel9
  - number: '10.1'
    text: Dit besluit treedt in werking met ingang van 10 maart 1994.
    url: https://wetten.overheid.nl/BWBR0006508/1998-03-07#Artikel10
  - number: '10.2'
    text: |-
      Dit besluit kan worden aangehaald als: Besluit aanwijzing nationaal park De Biesbosch. Dit besluit zal met de
      toelichting in de Staatscourant worden geplaatst, met uitzondering van de bijlage, die ter inzage wordt gelegd. Van
      deze terinzagelegging zal mededeling worden gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0006508/1998-03-07#Artikel10
