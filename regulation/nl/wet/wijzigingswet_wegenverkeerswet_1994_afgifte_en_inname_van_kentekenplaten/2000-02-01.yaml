$id: wijzigingswet_wegenverkeerswet_1994_afgifte_en_inname_van_kentekenplaten
regulatory_layer: WET
publication_date: '1999-11-04'
valid_from: '2000-02-01'
bwb_id: BWBR0010759
url: https://wetten.overheid.nl/BWBR0010759/2000-02-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is regels te stellen met betrekking tot de afgifte en
    inname van kentekenplaten teneinde het valselijk gebruik maken van kentekenplaten terug te dringen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0010759/2000-02-01#ArtikelAanhef
articles:
  - number: II
    text: |-
      1 Een op de dag vóór die van de inwerkingtreding van artikel 70a geldende goedkeuring of machtiging tot het
      aanbrengen van een keur- of waarmerk op kentekenplaten en de daarop op die dag van toepassing zijnde voorschriften,
      blijven tot een bij ministeriële regeling te bepalen tijdstip van kracht ten aanzien van bij die regeling
      aangewezen keur- of waarmerken.

      2 Ten aanzien van de productie en afgifte van kentekenplaten, geproduceerd met toepassing van het eerste lid,
      blijven de artikelen 70a tot en met 70h tot het in eerste lid bedoelde, bij ministeriële regeling te bepalen
      tijdstip buiten toepassing.
    url: https://wetten.overheid.nl/BWBR0010759/2000-02-01#ArtikelII
  - number: III
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip dat voor de verschillende artikelen of
      onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0010759/2000-02-01#ArtikelIII
