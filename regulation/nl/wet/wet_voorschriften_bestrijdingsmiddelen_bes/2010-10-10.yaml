    text: |-
      Deze wet en de ter uitvoering daarvan te geven voorschriften verstaan onder:

        - *bestrijdingsmiddelen:* elke stof of elk mengsel van stoffen, alsmede micro-organismen, bestemd om als
      zodanig of met andere stoffen gemengd, te worden gebruikt bij: a. de bestrijding van onkruid en van ongewenste
      groei bij planten of delen van planten dan wel bij het doden van loof; b. de bestrijding van de verwekkers van
      plantenziekten; c. de bestrijding en afweer van dieren, welke schade kunnen aanrichten aan gewassen in land-,
      tuin- en bosbouw in de ruimste zin; d. de bestrijding en afweer van ander gedierte; e. de wering van bederf van de
      voortbrengselen van land-, tuin- en bosbouw in de ruimste zin;
        - *Onze Minister:* Onze Minister, bedoeld in [artikel 1 van de Wet gewasbeschermingsmiddelen en biociden][ref1];
        - *bevoegde instantie:* door Onze Minister aangewezen dienst, autoriteit of instantie.


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel1
    url: https://wetten.overheid.nl/BWBR0028176/2010-10-10#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '1'
  - number: '2'
    text: |-
      1 De handel in enig bestrijdingsmiddel is toegestaan, mits door de fabrikant of de importeur tenminste drie maanden
      te voren van het voornemen daartoe aan de bevoegde instantie schriftelijk kennis is gegeven.

      2 Deze kennisgeving moet zijn vergezeld:

      a. van een monster van het betreffende middel, van voldoende grootte om de nodige onderzoekingen te kunnen
      verrichten;

      b. van een zodanige beschrijving van aard en samenstelling van het middel, alsmede van een opgave van de te
      garanderen gehalten aan waardegevende bestanddelen en van zodanige verdere gegevens omtrent deze bestanddelen, dat
      deze de grondslag kunnen vormen voor een onderzoek van de chemische samenstelling en fysische toestand;

      c. van een opgave van alle bestanddelen, welke giftig zijn voor mensen en warmbloedige dieren;

      d. van een opgave van het doel, waarvoor het bestrijdingsmiddel bestemd is, van de toepassingsmogelijkheden en van
      een nauwkeurige gebruiksaanwijzing, alsmede van de naam of aanduiding, waaronder het middel in de handel zal worden
      gebracht.
    url: https://wetten.overheid.nl/BWBR0028176/2010-10-10#Artikel2
  - number: '3'
    text: |-
      1 Onze Minister kan bepalen, dat op de verpakking van met name of op grond van hun samenstelling algemeen aan te
      duiden bestrijdingsmiddelen duidelijk moeten worden aangeduid:

      a. de juiste in de scheikunde gebruikelijke naam van het vergif of van het vergiftige bestanddeel,
      onderscheidenlijk van de vergiftige bestanddelen;

      b. de wijze, waarop nadeel voor de gezondheid van de gebruikers en van anderen kan worden voorkomen;

      c. de voornaamste vergiftigingsverschijnselen.

      2 De verpakking van bestrijdingsmiddelen moet deugdelijk zijn.
    url: https://wetten.overheid.nl/BWBR0028176/2010-10-10#Artikel3
  - number: '4'
    text: |-
      Onze Minister kan in het belang van de volksgezondheid de invoer in het vrije verkeer verbieden van met name of op
      grond van hun samenstelling algemeen aan te duiden bestrijdingsmiddelen.
    url: https://wetten.overheid.nl/BWBR0028176/2010-10-10#Artikel4
  - number: '5'
    text: |-
      Onze Minister kan in het belang van de volksgezondheid de openlijke aankondiging verbieden van met name of op grond
      van hun samenstelling algemeen aan te duiden bestrijdingsmiddelen, indien de invoer daarvan in het vrije verkeer
      ingevolge het [vorige artikel][ref1] verboden is of indien deze aankondiging een valse of misleidende aanprijzing
      bevat.


      [ref1]: https://wetten.overheid.nl/BWBR0028176#Artikel4
    url: https://wetten.overheid.nl/BWBR0028176/2010-10-10#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0028176
        artikel: '4'
        hoofdstuk: '1'
  - number: '6'
    text: |-
      1 Bij ministeriële regeling, kunnen bestrijdingsmiddelen worden aangewezen, waarvan de aankoop en de aanwending
      door de gebruiker uitsluitend is toegestaan op grond van een door of vanwege het bestuurscollege verleende
      vergunning.

      2 Aan de in het eerste lid bedoelde vergunning kunnen in het belang van de volksgezondheid de voorwaarden worden
      verbonden, dat de aanwending geschiedt:

      a. met inachtneming van noodzakelijke maatregelen ter bescherming van mens en dier;

      b. door of onder het toezicht van de door of vanwege het bestuurscollege aan te wijzen personen.
    url: https://wetten.overheid.nl/BWBR0028176/2010-10-10#Artikel6
  - number: '7'
    text: |-
      1 Door of vanwege het bestuurscollege kan de in het [vorige artikel][ref1] bedoelde vergunning op met redenen
      omklede gronden worden geweigerd, gewijzigd en ingetrokken.

      2 De belanghebbende kan bij Onze Minister beroep instellen tegen de weigering, wijziging of intrekking van een
      vergunning.

      3 Ingeval beroep wordt ingesteld tegen een beslissing, inhoudende de weigering, wijziging of intrekking van een
      vergunning, kan de aangevochten beslissing in beroep worden gewijzigd. De gewijzigde beslissing treedt in de plaats
      van die, waartegen beroep werd ingesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0028176#Artikel6
    url: https://wetten.overheid.nl/BWBR0028176/2010-10-10#Artikel7
