      1 Met het toezicht op de naleving van het bij of krachtens deze wet bepaalde zijn belast de door Onze Minister
      aangewezen ambtenaren. Een zodanige aanwijzing wordt bekendgemaakt in de Staatscourant.

      2 De in het eerste lid bedoelde ambtenaren zijn, uitsluitend voor zover dat voor de vervulling van hun taak
      redelijkerwijze noodzakelijk is, bevoegd:

      a. alle inlichtingen te vragen;

      b. inzage te verlangen van alle boeken, bescheiden en andere informatiedragers en daarvan afschrift te nemen of
      deze daartoe tijdelijk mee te nemen;

      c. goederen aan opneming en onderzoek te onderwerpen, deze daartoe tijdelijk mee te nemen en daarvan monsters te
      nemen;

      d. alle plaatsen, met uitzondering van woningen zonder de uitdrukkelijke toestemming van de bewoner, te betreden,
      vergezeld van door hen aangewezen personen;

      e. vaartuigen, stilstaande voertuigen en de lading daarvan te onderzoeken.

      3 Zo nodig, wordt de toegang tot een plaats als bedoeld in het tweede lid, onderdeel d, verschaft met behulp van de
      sterke arm.

      4 Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de wijze van taakuitoefening van de in
      het eerste lid bedoelde ambtenaren.

      5 Een ieder is verplicht aan de in het eerste lid bedoelde ambtenaren alle medewerking te verlenen die op grond van
      het tweede lid wordt gevorderd.
    url: https://wetten.overheid.nl/BWBR0028176/2010-10-10#Artikel8
  - number: '9'
    text: |-
      1 Overtreding van de bij of krachtens de [artikelen 2 tot en met 6][ref1] gestelde voorschriften of voorwaarden
      wordt gestraft met hechtenis van ten hoogste veertien dagen of een geldboete van de eerste categorie.

      2 Indien tijdens het plegen van de overtreding nog geen jaar is verlopen sedert een vroegere veroordeling
      van de schuldige wegens gelijke overtreding onherroepelijk is geworden, kunnen de in het eerste lid
      genoemde straffen worden verdubbeld. Met een vroegere veroordeling wordt gelijkgesteld de vrijwillige
      voldoening aan de voorwaarde door de bevoegde ambtenaar van het openbaar ministerie krachtens
      [artikel 76, eerste lid, van het Wetboek van Strafrecht BES][ref2] gesteld.

      3 De in dit artikel strafbaar gestelde feiten zijn overtredingen.


      [ref1]: https://wetten.overheid.nl/BWBR0028176#Artikel2
