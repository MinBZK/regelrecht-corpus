      1 Bij de uitoefening van hun taak dragen de toezichthouders een door Onze Minister te verstrekken legitimatiebewijs
      bij zich.

      2 Desgevraagd tonen zij hun legitimatiebewijs aanstonds.

      3 Het legitimatiebewijs bevat een foto van de toezichthouder en vermeldt in ieder geval diens naam en hoedanigheid.
    url: https://wetten.overheid.nl/BWBR0028176/2010-10-10#Artikel11
  - number: '12'
    text: |-
      Onze Minister is bevoegd tot het doen wegnemen, ontruimen, beletten, in de vorige toestand herstellen of verrichten
      van hetgeen in strijd met in deze wet of de daarop berustende bepalingen is of wordt gedaan, gehouden of nagelaten.
    url: https://wetten.overheid.nl/BWBR0028176/2010-10-10#Artikel12
  - number: '13'
    text: |-
      1 Een beslissing tot toepassing van bestuursdwang als bedoeld in [artikel 12][ref1] wordt op schrift gesteld en
      geldt als een beschikking.

      2 De bekendmaking ervan geschiedt aan de overtreder en eventuele andere rechthebbenden.

      3 In de beschikking wordt een termijn gesteld waarbinnen de overtreder en eventueel andere rechthebbenden de
      tenuitvoerlegging kunnen voorkomen door zelf de in de beschikking vermelde maatregelen te treffen.

      4 Indien de situatie dermate spoedeisend is dat de beslissing tot toepassing van bestuursdwang niet tevoren op
      schrift kan worden gesteld, wordt alsnog zo spoedig mogelijk voor de opschriftstelling en de bekendmaking ervan
      gezorgd.


      [ref1]: https://wetten.overheid.nl/BWBR0028176#Artikel12
    url: https://wetten.overheid.nl/BWBR0028176/2010-10-10#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0028176
        artikel: '12'
        hoofdstuk: '2'
  - number: '14'
    text: |-
      1 De overtreder is de kosten verbonden aan de toepassing van bestuursdwang verschuldigd, tenzij de kosten
      redelijkerwijze niet of niet geheel te zijnen laste behoren te komen.

      2 De beschikking vermeldt dat de toepassing van bestuursdwang op kosten van de overtreder plaatsvindt.

      3 Indien echter de kosten geheel of gedeeltelijk niet ten laste van de overtreder zullen worden gebracht, wordt dat
      in de beschikking vermeld.

      4 Onder de kosten worden begrepen de kosten verbonden aan de voorbereiding van bestuursdwang, voor zover deze
      kosten zijn gemaakt na het tijdstip waarop de termijn, bedoeld in [artikel 13, derde lid][ref1], is verstreken.

      5 De kosten zijn ook verschuldigd indien de bestuursdwang door opheffing van de onrechtmatige situatie niet of niet
      volledig is uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0028176#Artikel13
    url: https://wetten.overheid.nl/BWBR0028176/2010-10-10#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0028176
        artikel: '13'
        hoofdstuk: '2'
  - number: '15'
    text: |-
      1 Onze Minister kan van de overtreder bij dwangbevel de verschuldigde kosten, verhoogd met de op de invordering
      vallende kosten, invorderen.

      2 Het dwangbevel wordt op kosten van de overtreder bij deurwaardersexploot betekend en levert een executoriale
      titel op in de zin van het [Wetboek van Burgerlijke Rechtsvordering BES][ref1].

      3 Gedurende zes weken na de dag van betekening staat verzet tegen het dwangbevel open door dagvaarding van de Staat
      der Nederlanden.

      4 Het verzet schorst de tenuitvoerlegging. Op verzoek van de Staat kan het gerecht in eerste aanleg de schorsing
      van de tenuitvoerlegging opheffen.


      [ref1]: https://wetten.overheid.nl/BWBR0028496
    url: https://wetten.overheid.nl/BWBR0028176/2010-10-10#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0028496
  - number: '16'
    text: |-
      De kosten verbonden aan de toepassing van bestuursdwang zijn bevoorrecht op de zaak ten aanzien waarvan zij zijn
      besteed en worden na de kosten, bedoeld in [artikel 284 van het Burgerlijk Wetboek BES][ref1], uit de opbrengst van
      de zaak betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0028745#Artikel284
    url: https://wetten.overheid.nl/BWBR0028176/2010-10-10#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0028745
        artikel: '284'
  - number: '17'
    text: |-
      Om aan een beslissing van bestuursdwang uitvoering te geven, komen de personen die daartoe door de
      bevoegde instantie zijn aangewezen, de bevoegdheden toe, genoemd in [artikel 8, tweede en derde lid][ref1].
      [Artikel 10, eerste lid][ref2], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028176#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0028176#Artikel10
