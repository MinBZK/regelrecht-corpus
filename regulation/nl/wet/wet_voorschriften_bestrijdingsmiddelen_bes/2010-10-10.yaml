  - number: '18'
    text: |-
      Tot de bevoegdheid tot toepassing van bestuursdwang behoort het verzegelen van gebouwen, terreinen en hetgeen zich
      daarin of daarop bevindt.
    url: https://wetten.overheid.nl/BWBR0028176/2010-10-10#Artikel18
  - number: '19'
    text: |-
      Tot de bevoegdheid tot toepassing van bestuursdwang behoort het meevoeren en opslaan van daarvoor vatbare
      zaken voor zover de toepassing van bestuursdwang dit vereist. Indien zaken zijn meegevoerd en opgeslagen, doet
      de bevoegde instantie daarvan proces-verbaal opmaken, waarvan afschrift wordt verstrekt aan de rechthebbende.
      De bevoegde instantie draagt zorg voor de bewaring van de opgeslagen zaken en geeft deze zaken terug aan de
      rechthebbende, zodra dat redelijkerwijs nodig is. De bevoegde instantie is bevoegd de afgifte op te schorten
      totdat de verschuldigde kosten zijn voldaan. De Staat is niet aansprakelijk voor afgifte van het opgeslagene aan
      een onbevoegde.
    url: https://wetten.overheid.nl/BWBR0028176/2010-10-10#Artikel19
  - number: '20'
    text: |-
      1 Onze Minister is bevoegd, indien een opgeslagen zaak niet binnen dertien weken na de opslag kan worden
      teruggegeven aan de rechthebbende, deze te doen verkopen of, indien verkoop naar zijn oordeel niet mogelijk is, de
      zaak om niet aan een derde in eigendom over te dragen of te laten vernietigen.

      2 Gelijke bevoegdheid heeft Onze Minister ook binnen die termijn zodra de aan de toepassing van bestuursdwang
      verbonden kosten vermeerderd met de voor de verkoop, de eigendomsoverdracht om niet of de vernietiging geraamde
      kosten, in verhouding tot de waarde van de zaak onevenredig hoog worden.

      3 Verkoop, eigendomsoverdracht of vernietiging vindt niet plaats binnen twee weken na de verstrekking van het
      afschrift van het proces-verbaal betreffende het meevoeren en opslaan, tenzij het gevaarlijke stoffen of eerder aan
      bederf onderhevige stoffen betreft.

      4 Gedurende drie jaren na het tijdstip van verkoop heeft degene die op dat tijdstip rechthebbende was, recht op de
      opbrengst van het goed onder aftrek van de aan de toepassing van bestuursdwang verbonden kosten en de kosten van de
      verkoop. Indien de rechthebbende niet tevens de overtreder is, worden van de opbrengst de kosten van bestuursdwang
      niet in mindering gebracht.

      5 De Staat is niet aansprakelijk voor afgifte van de opbrengst uit de verkoop aan een onbevoegde.

      6 Bij ministeriële regeling kunnen regels worden gesteld ter zake van het in het eerste lid bedoelde in eigendom
      overdragen aan een derde.
    url: https://wetten.overheid.nl/BWBR0028176/2010-10-10#Artikel20
  - number: '21'
    text: |-
      1 Onze Minister kan in plaats van het uitoefenen van bestuursdwang aan de overtreder een last onder dwangsom
      opleggen, die ertoe strekt de overtreding ongedaan te maken dan wel een herhaling van de overtreding te voorkomen.

      2 Een last onder dwangsom wordt niet opgelegd indien het belang dat het betrokken voorschrift beoogt te beschermen
      zich daartegen verzet.

      3 Onze Minister stelt de dwangsom vast, hetzij op een bedrag ineens, hetzij op een bedrag per tijdseenheid waarin
      de last niet is uitgevoerd of op een bedrag per overtreding van de last. Onze Minister stelt tevens een bedrag vast
      waarboven geen dwangsom meer wordt verbeurd. Het vastgestelde bedrag van de dwangsom dient in redelijke verhouding
      te staan tot de zwaarte van het geschonden belang en beoogde werking van de dwangsomoplegging.

      4 In de beschikking tot oplegging van een last onder dwangsom die strekt tot het ongedaan maken of het beëindigen,
      wordt een termijn gesteld gedurende welke de overtreder de last kan uitvoeren zonder dat een dwangsom wordt
      verbeurd.
    url: https://wetten.overheid.nl/BWBR0028176/2010-10-10#Artikel21
  - number: '22'
    text: |-
      1 Verbeurde dwangsommen komen toe aan de Staat. Onze Minister kan bij dwangbevel het verschuldigde bedrag
      invorderen.

      2 [Artikel 15, tweede, derde en vierde lid][ref1], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028176#Artikel15
    url: https://wetten.overheid.nl/BWBR0028176/2010-10-10#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0028176
        artikel: '15'
        hoofdstuk: '2'
  - number: '23'
    text: |-
      1 Onze Minister kan op verzoek van de overtreder de last opheffen, de looptijd ervan opschorten voor een bepaalde
      termijn of de dwangsom verminderen in geval van blijvende of tijdelijke gehele of gedeeltelijke onmogelijkheid voor
      de overtreder om aan zijn verplichtingen te voldoen.

      2 Onze Minister kan op verzoek van de overtreder de last opheffen indien de beschikking een jaar van kracht is
      geweest zonder dat de dwangsom is verbeurd.
    url: https://wetten.overheid.nl/BWBR0028176/2010-10-10#Artikel23
  - number: '24'
    text: |-
      1 De bevoegdheid tot invordering van verbeurde bedragen verjaart door verloop van een jaar na de dag waarop ze
      zijn verbeurd.

      2 De verjaring wordt gestuit door faillissement en ieder wettelijk beletsel voor invordering van de dwangsom.
    url: https://wetten.overheid.nl/BWBR0028176/2010-10-10#Artikel24
  - number: '25'
    text: |-
      1 Ingeval van overtreding van de bij of krachtens deze wet gegeven voorschriften kan Onze Minister aan de
      overtreder een bestuurlijke boete opleggen van ten hoogste 560.000,– USD.

      2 De hoogte van de boete wordt in ieder geval afgestemd op de ernst en de duur van de overtreding, alsmede op de
      mate waarin de overtreder daarvan een verwijt kan worden gemaakt.

      3 De bevoegdheid tot het opleggen van een boete vervalt indien ter zake van de overtreding op grond waarvan
      de boete kan worden opgelegd, tegen de overtreder een strafvervolging is ingesteld en het onderzoek ter
      terechtzitting een aanvang heeft genomen, dan wel het recht tot strafvervolging is vervallen ingevolge
      [artikel 76 van het Wetboek van Strafrecht BES][ref1].

      4 Het recht tot strafvervolging vervalt indien Onze Minister aan de betrokkene ter zake van hetzelfde feit reeds
      een bestuurlijke boete heeft opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel76
    url: https://wetten.overheid.nl/BWBR0028176/2010-10-10#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '76'
  - number: '26'
    text: |-
      1 Met het onderzoek in verband met de op te leggen bestuurlijke boete zijn belast de personen bedoeld in
      [artikel 8, eerste lid][ref1].

      2 Ten dienste van het onderzoek beschikken zij over de bevoegdheden die hun in deze paragraaf worden toegekend,
      alsmede, met inachtneming van de daaraan in die artikelen gestelde beperkingen, over de bevoegdheden die hun zijn
      toegekend ter uitoefening van het toezicht, bedoeld in [artikel 8, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0028176#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0028176#Artikel8
    url: https://wetten.overheid.nl/BWBR0028176/2010-10-10#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0028176
        artikel: '8'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0028176
        artikel: '8'
        hoofdstuk: '2'
  - number: '27'
    text: |-
      Indien de personen, bedoeld in [artikel 8, eerste lid][ref1], een redelijk vermoeden hebben dat een bepaalde
      natuurlijke persoon of rechtspersoon een overtreding heeft begaan, is er geen verplichting aan de zijde van die
      natuurlijke persoon of rechtspersoon ter zake een verklaring af te leggen. De betrokkenen worden hiervan in kennis
      gesteld voordat hun mondeling ter zake om informatie wordt gevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0028176#Artikel8
    url: https://wetten.overheid.nl/BWBR0028176/2010-10-10#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0028176
        artikel: '8'
        hoofdstuk: '2'
  - number: '28'
    text: |-
      1 Een persoon als bedoeld in [artikel 8, eerste lid][ref1], die vaststelt dat een overtreding is begaan, maakt
      daarvan een rapport op.

      2 In het rapport worden in ieder geval vermeld:

      a. de feiten en omstandigheden op grond waarvan is vastgesteld dat een overtreding is begaan;

      b. waar en wanneer de feiten, bedoeld onder a, zich hebben voorgedaan;

      c. het overtreden wettelijk voorschrift.

      3 Een kopie van het rapport wordt gezonden aan degene die de overtreding heeft begaan.

      4 Op verzoek van de belanghebbende die het rapport wegens zijn gebrekkige kennis van de Nederlandse taal
      onvoldoende begrijpt, draagt Onze Minister er zoveel mogelijk zorg voor dat de inhoud van het rapport aan de
      betrokkene wordt meegedeeld in een voor hem begrijpelijke taal.


      [ref1]: https://wetten.overheid.nl/BWBR0028176#Artikel8
    url: https://wetten.overheid.nl/BWBR0028176/2010-10-10#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0028176
        artikel: '8'
        hoofdstuk: '2'
  - number: '29'
    text: |-
      1 De belanghebbende wordt schriftelijk opgeroepen om naar keuze schriftelijk of mondeling zijn zienswijze naar
      voren te brengen omtrent het in [artikel 28, eerste lid][ref1], bedoelde rapport.

      2 Indien de belanghebbende zijn zienswijze mondeling naar voren brengt, draagt Onze Minister er op verzoek van
      de belanghebbende die de Nederlandse taal onvoldoende begrijpt, zorg voor dat een tolk wordt benoemd die de
      belanghebbende bij het horen kan bijstaan, tenzij redelijkerwijs kan worden aangenomen dat daaraan geen behoefte
      bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0028176#Artikel28
    url: https://wetten.overheid.nl/BWBR0028176/2010-10-10#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0028176
        artikel: '28'
        hoofdstuk: '2'
  - number: '30'
    text: |-
      1 Een bestuurlijke boete wordt opgelegd bij beschikking van Onze Minister. In de beschikking worden in ieder geval
      vermeld:

      a. de te betalen geldsom, alsmede een toelichting op de hoogte daarvan;

      b. de overtreding terzake waarvan zij is gegeven, alsmede het overtreden voorschrift.

      2 Op verzoek van de belanghebbende die de beschikking wegens zijn gebrekkige kennis van de Nederlandse taal
      onvoldoende begrijpt, draagt Onze Minister er zoveel mogelijk zorg voor dat de inhoud van de beschikking aan de
      betrokkene wordt meegedeeld in een voor hem begrijpelijke taal.

      3 De beschikking dient te worden gegeven binnen twaalf weken nadat het rapport, bedoeld in
      [artikel 32, eerste lid][ref1], is opgemaakt, tenzij binnen deze termijn het rapport aan het openbaar ministerie
      is gezonden. In dat geval kan een boete worden opgelegd binnen twaalf weken nadat het openbaar ministerie aan Onze
      Minister heeft meegedeeld dat geen strafvervolging wordt ingesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0028176#Artikel32
    url: https://wetten.overheid.nl/BWBR0028176/2010-10-10#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0028176
        artikel: '32'
        hoofdstuk: '2'
  - number: '31'
    text: |-
      De werkzaamheden die verband houden met de uitvoering van de [artikelen 29][ref1] en [30][ref2] worden verricht
      door personen die niet betrokken zijn geweest bij de opstelling van het in [artikel 28][ref3] bedoelde rapport en
      het daaraan voorafgaande onderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0028176#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0028176#Artikel30
      [ref3]: https://wetten.overheid.nl/BWBR0028176#Artikel28
    url: https://wetten.overheid.nl/BWBR0028176/2010-10-10#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0028176
        artikel: '29'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0028176
        artikel: '30'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0028176
        artikel: '28'
        hoofdstuk: '2'
  - number: '32'
    text: |-
      De werking van een beschikking als bedoeld in [artikel 30, eerste lid][ref1], wordt opgeschort totdat de
      beroepstermijn is verstreken of, indien beroep is ingesteld, op het beroep is beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0028176#Artikel30
    url: https://wetten.overheid.nl/BWBR0028176/2010-10-10#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0028176
        artikel: '30'
        hoofdstuk: '2'
  - number: '33'
    text: |-
      1 Een boete wordt betaald binnen zes weken nadat de beschikking waarbij de boete is opgelegd, in werking is
      getreden.

      2 De boete wordt vermeerderd met de wettelijke rente, te rekenen zes weken vanaf de dag waarop de in het eerste lid
      genoemde beschikking is bekendgemaakt.

      3 Indien niet is betaald binnen de in de eerste lid genoemde termijn, wordt degene die de boete is verschuldigd
      schriftelijk bevolen binnen twee weken, alsnog het bedrag van de boete, verhoogd met de krachtens het tweede lid
      verschuldigde rente en de kosten van de aanmaning, te betalen.
    url: https://wetten.overheid.nl/BWBR0028176/2010-10-10#Artikel33
  - number: '34'
    text: |-
      1 Bij gebreke van betaling binnen de termijn van twee weken, bedoeld in [artikel 33, derde lid][ref1], kan Onze
      Minister van de overtreder de verschuldigde boete, verhoogd met de krachtens artikel 33, tweede lid, verschuldigde
      rente en de op de aanmaning en invordering betrekking hebbende kosten, invorderen bij dwangbevel.

      2 Het dwangbevel wordt op kosten van de overtreder bij deurwaardersexploot betekend en levert een executoriale
      titel op in de zin van het [Tweede Boek van het Wetboek van Burgerlijke Rechtsvordering BES][ref2].

      3 Gedurende zes weken na de dag van betekening staat verzet tegen het dwangbevel open door dagvaarding van de
      Staat.

      4 Het verzet schorst de tenuitvoerlegging. Op verzoek van de Staat kan de rechter de schorsing van de
      tenuitvoerlegging opheffen.

      5 De in het eerste lid bedoelde bedragen komen toe aan de Staat.


      [ref1]: https://wetten.overheid.nl/BWBR0028176#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0028496
    url: https://wetten.overheid.nl/BWBR0028176/2010-10-10#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0028176
        artikel: '33'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0028496
  - number: '35'
    text: De bevoegdheid tot het opleggen van een boete vervalt vijf jaar nadat de overtreding is begaan.
    url: https://wetten.overheid.nl/BWBR0028176/2010-10-10#Artikel35
  - number: '36'
    text: |-
      1 Met de opsporing van de bij of krachtens deze wet strafbaar gestelde feiten zijn, onverminderd
      [artikel 184 van het Wetboek van Strafvordering BES][ref1], belast de door Onze Minister van Justitie, in
      overeenstemming met Onze Minister, aangewezen ambtenaren. Een zodanige aanwijzing wordt bekendgemaakt in de
      Staatscourant.

      2 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent de vereisten waaraan de
      ingevolge het eerste lid aangewezen personen dienen te voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel184
    url: https://wetten.overheid.nl/BWBR0028176/2010-10-10#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '184'
  - number: '37'
    text: |-
      1 Handelen in strijd met de in [artikel 8, vijfde lid][ref1], vervatte verplichting wordt gestraft met hetzij
      hechtenis van ten hoogste een jaar, hetzij een geldboete van de vierde categorie, hetzij met beide straffen.

      2 Het in het eerste lid strafbaar gestelde feit is een overtreding.


      [ref1]: https://wetten.overheid.nl/BWBR0028176#Artikel8
    url: https://wetten.overheid.nl/BWBR0028176/2010-10-10#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0028176
        artikel: '8'
        hoofdstuk: '2'
  - number: '38'
    text: |-
      1 Degene die opzettelijk de bij [artikel 39][ref1] opgelegde plicht tot geheimhouding schendt, wordt gestraft
      hetzij met gevangenisstraf van ten hoogste twee jaren, hetzij met een geldboete van de vijfde categorie hetzij met
      beide straffen. Het in dit lid strafbaar gestelde feit is een misdrijf.

      2 Degene aan wiens schuld schending van de geheimhouding te wijten is, wordt gestraft met hechtenis van ten hoogste
      zes maanden hetzij met een geldboete van de vierde categorie, hetzij met beide straffen. Het in dit lid strafbaar
      gestelde feit is een overtreding.

      3 Geen vervolging wordt ingesteld dan op beklag van degene te wiens aanzien de geheimhouding geschonden is.


      [ref1]: https://wetten.overheid.nl/BWBR0028176#Artikel39
    url: https://wetten.overheid.nl/BWBR0028176/2010-10-10#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0028176
        artikel: '39'
        hoofdstuk: '2'
  - number: '39'
    text: |-
      Eenieder die betrokken is bij de uitvoering van deze wet en daarbij de beschikking krijgt over gegevens waarvan
      hij het vertrouwelijke karakter kent of redelijkerwijs moet vermoeden en voor wie niet reeds uit hoofde van
      ambt, beroep of wettelijk voorschrift ter zake van die gegevens een geheimhoudingsplicht geldt, is verplicht tot
      geheimhouding daarvan behoudens voor zover enig wettelijk voorschrift hem tot bekendmaking verplicht of uit zijn
      taak bij de uitvoering van deze wet de noodzaak tot bekendmaking voortvloeit.
    url: https://wetten.overheid.nl/BWBR0028176/2010-10-10#Artikel39
  - number: '40'
    text: 'Deze wet wordt aangehaald als: Wet voorschriften bestrijdingsmiddelen BES.'
    url: https://wetten.overheid.nl/BWBR0028176/2010-10-10#Artikel40
