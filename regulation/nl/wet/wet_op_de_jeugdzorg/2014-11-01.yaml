    text: |-
      Tot het tijdstip waarop [artikel 14 van de Beginselenwet justitiële jeugdinrichtingen][ref1]
      in werking treedt, is [artikel 10, eerste lid, onder g][ref2], van overeenkomstige
      toepassing met betrekking tot een plaatsing in een justitiële jeugdinrichting als bedoeld in
      [artikel 1, onder b, van de Beginselenwet justitiële jeugdinrichtingen][ref3].


