        artikel: '3'
  - number: '105'
    text: |-
      Een beslissing van een stichting, de rechtspersoon, bedoeld in [artikel 254, tweede lid][ref1],
      of [artikel 302, tweede lid, van Boek 1 van het Burgerlijk Wetboek][ref2] of een zorgaanbieder
      op een verzoek als bedoeld in de [artikelen 30, derde lid][ref3], [35][ref4], [36][ref5] en
      [38, tweede lid, van de Wet bescherming persoonsgegevens][ref6], alsmede een beslissing naar aanleiding
      van de aantekening van verzet als bedoeld in de [artikelen 40][ref7] of [41 van die wet][ref8]
      gelden, ook voor zover de stichting, de rechtspersoon, bedoeld in [artikel 254, tweede lid][ref9], of
      [artikel 302, tweede lid, van Boek 1 van het Burgerlijk Wetboek][ref10] of de zorgaanbieder de beslissing heeft
      genomen als bestuursorgaan, voor de toepassing van [Hoofdstuk 8 van die wet][ref11], als een beslissing genomen
      door een ander dan een bestuursorgaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel254
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel302
      [ref3]: https://wetten.overheid.nl/BWBR0011468#Artikel30
