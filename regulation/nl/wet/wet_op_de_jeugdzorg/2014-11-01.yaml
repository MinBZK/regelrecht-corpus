  - number: '102.3'
    text: |-
      In afwijking van het eerste en tweede lid, kan de kinderrechter op verzoek van bloed- en aanverwanten van de
      minderjarige, van de raad voor de kinderbescherming, van belanghebbenden of ambtshalve, de voogdij opdragen aan de
      stichting, bedoeld in [artikel 1, eerste lid][ref1], die werkzaam is in de provincie waar de minderjarige verblijft
      ten tijde van de inwerkingtreding van deze wet, alsmede een minderjarige onder toezicht stellen van een zodanige
      stichting.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel1
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel102
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '1'
        hoofdstuk: I
  - number: '102.4'
    text: Een verzoek als bedoeld in het derde lid kan tot zes maanden na de inwerkingtreding van deze wet worden gedaan.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel102
  - number: '103.1'
    text: |-
      Jeugdigen die op het tijdstip van inwerkingtreding van deze wet jeugdzorg waarop ingevolge deze wet aanspraak
      bestaat, ontvingen van een voorziening van jeugdhulpverlening in de zin van de [Wet op de jeugdhulpverlening][ref1]
      hebben, tot het tijdstip waarop de bevoegde stichting een besluit heeft genomen als bedoeld in
      [artikel 5, tweede lid][ref2], in afwijking van [artikel 3, derde lid][ref3], aanspraak op jeugdzorg te verlenen
      door de betrokken voorziening van jeugdhulpverlening.


      [ref1]: https://wetten.overheid.nl/BWBR0004608
      [ref2]: https://wetten.overheid.nl/BWBR0016637#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0016637#Artikel3
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel103
    references:
      - id: ref1
        bwb_id: BWBR0004608
      - id: ref2
        bwb_id: BWBR0016637
        artikel: '5'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0016637
        artikel: '3'
        hoofdstuk: II
  - number: '103.2'
    text: |-
      Jeugdigen die op het tijdstip van inwerkingtreding van deze wet op grond van de
      [Algemene Wet Bijzondere Ziektekosten][ref1] aanspraak hadden op jeugdzorg als bedoeld
      in [artikel 5, tweede lid, onder b][ref2], behouden deze aanspraak tot de bevoegde
      stichting een besluit heeft genomen als bedoeld in [artikel 5, tweede lid][ref3], of
      [artikel 9b, vijfde lid, van de Algemene Wet Bijzondere Ziektekosten][ref4] toepassing heeft gevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0002614
      [ref2]: https://wetten.overheid.nl/BWBR0016637#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0016637#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0002614#Artikel9b
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel103
    references:
      - id: ref1
        bwb_id: BWBR0002614
      - id: ref2
        bwb_id: BWBR0016637
        artikel: '5'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0016637
        artikel: '5'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0002614
        artikel: 9b
  - number: '103.3'
    text: |-
      De bevoegde stichting neemt een besluit als bedoeld in het eerste of tweede lid, op het tijdstip waarop de termijn,
      bedoeld in [artikel 6, eerste lid, onder c][ref1], is verstreken, doch in ieder geval vóór 1 januari 2006.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel6
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel103
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '6'
        hoofdstuk: III
        paragraaf: '2'
  - number: '104.1'
    text: |-
      Onze Ministers kunnen tot een bij koninklijk besluit vast te stellen tijdstip, in de uitkering, bedoeld
      in [artikel 37, eerste lid, onder a][ref1], de kosten verwerken van de door de provincie te verstrekken
      subsidie aan het bureau jeugdzorg ten behoeve van de uitoefening van de voogdij, de ondertoezichtstelling
      of de taken bedoeld in [artikel 10, eerste lid, onder c en d][ref2] waarbij de taak wordt uitgevoerd
      door een persoon in dienst van een door Onze Ministers aan te wijzen instelling, als bedoeld in
      [artikel 1, eerste lid, onder k, van de Wet op de jeugdhulpverlening][ref3] met een landelijk bereik die in het
      jaar voorafgaand aan het tijdstip van inwerkingtreding van de wet als instelling met een landelijk bereik subsidie
      ontving, voor zover dit nodig is om de continuïteit van de werkzaamheden van die instelling voor hun doelgroep
      te garanderen.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0016637#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0004608#Artikel1
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '37'
        hoofdstuk: VI
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0016637
        artikel: '10'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0004608
        artikel: '1'
  - number: '104.2'
    text: |-
      Onze Ministers kunnen tot een bij koninklijk besluit vast te stellen tijdstip, in de uitkering, bedoeld
      in [artikel 37, eerste lid, onder b][ref1], de kosten verwerken van de door de provincie te verstrekken
      subsidie aan een door Onze Ministers aan te wijzen uitvoerder van een landelijke voorziening als bedoeld in
      [artikel 3, eerste lid, van de Wet op de jeugdhulpverlening][ref2] die in het jaar voorafgaand aan het tijdstip van
      inwerkingtreding van de wet als landelijke voorziening subsidie ontving, voor zover dit nodig is om de continuïteit
      van hun zorgaanbod te garanderen.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0004608#Artikel3
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel104
