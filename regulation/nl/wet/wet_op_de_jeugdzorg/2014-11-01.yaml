preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben dat het wenselijk is een wettelijke aanspraak op jeugdzorg voor zover
    daarop geen aanspraak bestaat ingevolge de Algemene Wet Bijzondere Ziektekosten of de Beginselenwet justitiële
    jeugdinrichtingen, te vestigen, een samenhangend aanbod van jeugdzorg te realiseren, dat aansluit op de behoefte,
    de toegang tot de jeugdzorg alsmede de bekostiging van de jeugdzorg waarop ingevolge deze wet aanspraak bestaat
    opnieuw te regelen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder: - aanbieder van andere zorg: natuurlijke
      persoon of rechtspersoon, die zorg verleent als bedoeld in [artikel 5, tweede lid, onder b of c][ref1];
        - accommodatie: een accommodatie als bedoeld in [artikel 29k, eerste lid][ref2];
        - bureau jeugdzorg: een bureau als bedoeld in [artikel 4][ref3];
        - burgerservicenummer: burgerservicenummer als bedoeld in
      [artikel 1, onderdeel b, van de Wet algemene bepalingen burgerservicenummer][ref4];
        - cliënt: jeugdige, zijn ouders of stiefouders of anderen die een jeugdige als behorend tot hun gezin verzorgen en
      opvoeden, met uitzondering van pleegouders;
        - experiment: het ontwikkelen en in de praktijk beproeven van nieuwe en het verbeteren van bestaande methoden,
      werkvormen of hulpmiddelen ten behoeve van het functioneren van bureaus jeugdzorg en van jeugdzorg waarop ingevolge
      deze wet aanspraak bestaat;
        - huiselijk geweld: huiselijk geweld als bedoeld in
      [artikel 1, eerste lid, van de Wet maatschappelijke ondersteuning][ref5];
        - hulpverleningsplan: het plan, bedoeld in [artikel 24, tweede lid][ref6];
        - inspectie: de inspectie, bedoeld in [artikel 47][ref7];
        - jeugdige: 'een persoon die: 1º. de meerderjarigheidsleeftijd nog niet heeft bereikt,'
      2º. de meerderjarigheidsleeftijd heeft bereikt en ten aanzien van wie op grond van
      [artikel 77c van het Wetboek van Strafrecht][ref8] recht is gedaan overeenkomstig de
      [artikelen 77g tot en met 77gg van het Wetboek van Strafrecht][ref9], of 3º. de meerderjarigheidsleeftijd
      doch niet de leeftijd van drieëntwintig jaren heeft bereikt, en voor wie voortzetting van jeugdzorg, die was
      aangevangen of waarvan de aanvraag, bedoeld in [artikel 7, eerste lid][ref10], was ingediend vóór het bereiken
      van de meerderjarigheidsleeftijd, noodzakelijk is of voor wie, na beëindiging van jeugdzorg die was aangevangen
      vóór het bereiken van de meerderjarigheidsleeftijd, binnen een termijn van een half jaar hervatting van jeugdzorg
      noodzakelijk is;
        - jeugdzorg: ondersteuning van en hulp aan jeugdigen, hun ouders, stiefouders of anderen die een jeugdige
      als behorende tot hun gezin verzorgen en opvoeden, met uitzondering van pleegouders, bij opgroei- of
      opvoedingsproblemen of dreigende zodanige problemen;
        - kindermishandeling: elke vorm van voor een minderjarige bedreigende of gewelddadige interactie van fysieke,
      psychische of seksuele aard, die de ouders of andere personen ten opzichte van wie de minderjarige in een relatie
      van afhankelijkheid of van onvrijheid staat, actief of passief opdringen, waardoor ernstige schade wordt berokkend
      of dreigt te worden berokkend aan de minderjarige in de vorm van fysiek of psychisch letsel;
        - landelijk beleidskader: het landelijke beleidskader jeugdzorg, bedoeld in [artikel 34, eerste lid][ref11];
        - Landelijk Bureau Inning Onderhoudsbijdragen: het bureau, genoemd in
      [artikel 2, eerste lid, van de Wet Landelijk Bureau Inning Onderhoudsbijdragen][ref12];
        - machtiging: een machtiging als bedoeld in [artikel 29b, eerste lid][ref13];
        - Onze Ministers: Onze Minister van Volksgezondheid, Welzijn en Sport en Onze Minister van Veiligheid en Justitie
      tezamen;
        - ouderbijdrage: de bijdrage, bedoeld in [artikel 69][ref14];
        - pleegouder: degene die een pleegcontract als bedoeld in [artikel 28b, eerste lid][ref15], met een zorgaanbieder
      heeft gesloten;
        - provinciaal beleidskader: het provinciale beleidskader jeugdzorg, bedoeld in [artikel 31, eerste lid][ref16];
        - steunfunctie: een aanbod van ondersteunende werkzaamheden ten behoeve van de stichting en van jeugdzorg waarop
      ingevolge deze wet aanspraak bestaat;
        - stichting: een stichting die een bureau jeugdzorg in stand houdt;
        - uitvoeringsprogramma: het provinciale programma, bedoeld in [artikel 32, eerste lid][ref17];
        - vertrouwenspersoon: persoon werkzaam bij een rechtspersoon als bedoeld in [artikel 41, vierde lid][ref18],
      die cliënten of pleegouders onafhankelijk van het bestuur en van personen in dienst van de stichting of
      de zorgaanbieder, ondersteunt in aangelegenheden samenhangend met de door de stichting uitgeoefende taken
      onderscheidenlijk aangelegenheden samenhangend met de geboden jeugdzorg;
        - verwerken van persoonsgegevens: verwerking van persoonsgegevens als bedoeld in
      [artikel 1, onder b, van de Wet bescherming persoonsgegevens][ref19];
        - voortgangsrapportage: de voortgangsrapportage jeugdzorg, bedoeld in [artikel 36, eerste lid][ref20];
        - zorgaanbieder: de natuurlijke persoon of de rechtspersoon die jeugdzorg verleent, waarop ingevolge deze wet
      aanspraak bestaat;
        - zorgeenheid: een organisatie-eenheid, waarbinnen een zorgaanbieder een afgebakend geheel aan jeugdzorg verleent;
        - zorgverzekeraar: een zorgverzekeraar als bedoeld in
      [artikel 1, eerste lid, onderdeel b, van de Algemene Wet Bijzondere Ziektekosten][ref21].


