      [ref10]: https://wetten.overheid.nl/BWBR0002656#Artikel302
      [ref11]: https://wetten.overheid.nl/BWBR0011468#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel105
