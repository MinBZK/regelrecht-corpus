  - number: '1.2'
    text: |-
      Het begrip jeugdige, bedoeld in het eerste lid, is niet van toepassing op de [hoofdstukken IA][ref1] en
      [IVB][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0016637#HoofdstukIa
      [ref2]: https://wetten.overheid.nl/BWBR0016637#HoofdstukIVb
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0016637
        hoofdstuk: Ia
      - id: ref2
        bwb_id: BWBR0016637
        hoofdstuk: IVb
  - number: '1.3'
    text: Deze wet is van toepassing op in Nederland verblijvende jeugdigen.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel1
  - number: '2'
    text: |-
      Indien een provinciebestuur de bevoegdheden inzake de uitvoering van zijn taken in het
      kader van de jeugdzorg heeft overgedragen aan het bestuur van een plusregio als bedoeld in
      [artikel 104 van de Wet gemeenschappelijke regelingen][ref1] waarvan de gemeente Amsterdam, Rotterdam,
      onderscheidenlijk ‘s-Gravenhage deel uit maakt, wordt dat bestuur voor de toepassing van deze wet gelijkgesteld met
      het provinciebestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel104
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '104'
  - number: 2a
    text: |-
      In dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder: - *jeugdige:* persoon die de leeftijd van
      23 jaar nog niet heeft bereikt;
        - *hulp, zorg of bijsturing:* werkzaamheden die een meldingsbevoegde op grond van de voor hem geldende regelgeving
      ten behoeve van een jeugdige verricht.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel2a
  - number: 2b.1
    text: 'Meldingsbevoegde is een functionaris die werkzaam is voor een instantie die:'
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel2b
  - number: 2b.1.a
    text: |-
      behoort tot een bij algemene maatregel van bestuur aangewezen categorie van instanties die werkzaam is in een of
      meer van de domeinen jeugdzorg, jeugdgezondheidszorg, gezondheidszorg, onderwijs, maatschappelijke ondersteuning,
      werk en inkomen, of politie en justitie,
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel2b
  - number: 2b.1.b
    text: |-
      afspraken als bedoeld in [artikel 2g][ref1] heeft gemaakt met het college van burgemeester en wethouders, en


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel2g
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel2b
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: 2g
        hoofdstuk: Ia
        paragraaf: '3'
  - number: 2b.1.c
    text: de functionaris als zodanig heeft aangewezen.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel2b
  - number: 2b.2
    text: 'Meldingsbevoegde is voorts een functionaris die niet werkzaam is voor een instantie en die:'
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel2b
  - number: 2b.2.a
    text: |-
      behoort tot een bij algemene maatregel van bestuur aangewezen categorie van functionarissen die werkzaam is in een
      of meer van de in het eerste lid, onder a, genoemde domeinen, en
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel2b
  - number: 2b.2.b
    text: |-
      afspraken als bedoeld in [artikel 2g][ref1] heeft gemaakt met het college van burgemeester en wethouders.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel2g
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel2b
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: 2g
        hoofdstuk: Ia
        paragraaf: '3'
  - number: 2b.3
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld over de functionaris, bedoeld in het eerste
      en tweede lid, en de instanties, bedoeld in het eerste lid, onder a. Deze regels kunnen verschillen per categorie
      van instanties of functionarissen.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel2b
  - number: 2c
    text: |-
      Met het oog op de goede uitvoering van dit hoofdstuk kan bij algemene maatregel van bestuur onderscheid worden
      gemaakt tussen daarbij aan te geven leeftijdscategorieën van jeugdigen.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel2c
  - number: 2d.1
    text: |-
      Er is een verwijsindex risicojongeren, zijnde een landelijk elektronisch systeem, waarin persoonsgegevens in de zin
      van [artikel 1, onder a, van de Wet bescherming persoonsgegevens][ref1] alsmede andere gegevens worden verwerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel1
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel2d
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '1'
  - number: 2d.2
    text: |-
      De verwijsindex heeft tot doel vroegtijdige en onderlinge afstemming tussen meldingsbevoegden te bewerkstelligen,
      opdat zij jeugdigen tijdig passende hulp, zorg of bijsturing kunnen verlenen om daadwerkelijke bedreigingen van de
      noodzakelijke condities voor een gezonde en veilige ontwikkeling naar volwassenheid te voorkomen, te beperken of
      weg te nemen.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel2d
  - number: 2d.3
    text: De verwijsindex wordt uitsluitend gebruikt voor het in het tweede lid aangegeven doel.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel2d
  - number: 2e.1
    text: |-
      Onze Minister van Volksgezondheid, Welzijn en Sport draagt zorg voor de inrichting en het beheer van de
      verwijsindex.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel2e
  - number: 2e.2
    text: |-
      Onze Minister van Volksgezondheid, Welzijn en Sport is de verantwoordelijke in de zin van
      [artikel 1, onder d, van de Wet bescherming persoonsgegevens][ref1] voor de verwijsindex.


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel1
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel2e
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '1'
  - number: 2e.3
    text: |-
      In afwijking van het tweede lid, is voor de toepassing van de [artikelen 34 tot en met 40][ref1] en
      [43 van de Wet bescherming persoonsgegevens][ref2] de verantwoordelijke het college van burgemeester en wethouders
      van de gemeente die afspraken als bedoeld in [artikel 2g][ref3] heeft gemaakt met de instantie waarvoor de
      meldingsbevoegde die de jeugdige heeft gemeld werkzaam is of, indien die niet werkzaam is voor een instantie, de
      meldingsbevoegde.


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0011468#Artikel43
      [ref3]: https://wetten.overheid.nl/BWBR0016637#Artikel2g
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel2e
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '34'
      - id: ref2
        bwb_id: BWBR0011468
        artikel: '43'
      - id: ref3
        bwb_id: BWBR0016637
        artikel: 2g
        hoofdstuk: Ia
        paragraaf: '3'
  - number: 2e.4
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent de inrichting en het beheer van de
      verwijsindex. Daartoe behoren in elk geval regels omtrent de beveiliging van persoonsgegevens en de beschikbaarheid
      van de voorzieningen, bedoeld in [artikel 2f][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel2f
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel2e
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: 2f
        hoofdstuk: Ia
        paragraaf: '2'
  - number: 2f.1
    text: 'Van de verwijsindex maken deel uit:'
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel2f
  - number: 2f.1.a
    text: |-
      voorzieningen waarmee de verwijsindex met het oog op het verwerken van een melding het burgerservicenummer van de
      betrokken jeugdige kan opvragen of verifiëren;
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel2f
  - number: 2f.1.b
    text: voorzieningen waarmee een jeugdige aan de verwijsindex kan worden gemeld of eruit kan worden verwijderd;
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel2f
  - number: 2f.1.c
    text: |-
      voorzieningen waarmee bij twee of meer meldingen van dezelfde jeugdige een signaal wordt gezonden naar de
      meldingsbevoegden die de betrokken jeugdige hebben gemeld en naar degene die belast is met de taken, bedoeld in
      [artikel 2h][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel2h
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel2f
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: 2h
        hoofdstuk: Ia
        paragraaf: '3'
  - number: 2f.1.d
    text: |-
      een logboek dat registreert welke meldingsbevoegde wanneer een jeugdige aan de verwijsindex heeft gemeld, hem
      daaruit heeft verwijderd of een signaal heeft ontvangen;
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel2f
  - number: 2f.1.e
    text: |-
      voorzieningen waarmee verhuisbewegingen van aan de verwijsindex gemelde jeugdigen worden geregistreerd en
      doorgegeven aan de meldingsbevoegde die de jeugdige heeft gemeld en, indien de jeugdige naar een andere gemeente is
      verhuisd, aan de regievoerder van de gemeente waarnaar de jeugdige is verhuisd;
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel2f
  - number: 2f.1.f
    text: 'voorzieningen waarmee ten behoeve van:'
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel2f
  - number: 2f.1.f.1°
    text: het toezicht op de naleving inzage kan worden gegeven in de verwijsindex;
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel2f
  - number: 2f.1.f.2°
    text: |-
      beleidsinformatie en het toezicht op de naleving rapportages over het gebruik van de verwijsindex kunnen worden
      samengesteld en opgevraagd, bestaande uit niet tot specifieke jeugdigen of specifieke meldingsbevoegden herleidbare
      gegevens;
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel2f
  - number: 2f.1.g
    text: |-
      voorzieningen waarmee aan de jeugdige bij de uitoefening van de
      [artikelen 35 tot en met 40 van de Wet bescherming persoonsgegevens][ref1] inzage kan worden verleend in een hem
      betreffende melding in de verwijsindex.


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel35
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel2f
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '35'
  - number: 2f.2
    text: |-
      Bij de verwijsindex is een historisch meldingenarchief gevoegd waarin uit de verwijsindex verwijderde meldingen
      worden opgenomen. Het historisch meldingenarchief heeft tot doel de verdere verlening van hulp, zorg of bijsturing
      ten behoeve van een jeugdige te ondersteunen.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel2f
  - number: 2f.3
    text: |-
      Bij algemene maatregel van bestuur kunnen met het oog op een effectief gebruik van de verwijsindex noodzakelijke
      andere voorzieningen worden aangewezen die aan de verwijsindex worden toegevoegd.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel2f
  - number: 2g.1
    text: |-
      Het college van burgemeester en wethouders bevordert het gebruik van de verwijsindex. Daartoe maakt het college
      afspraken met de binnen hun gemeente werkzame instanties en functionarissen, voor zover zij behoren tot een
      categorie die is aangewezen bij de algemene maatregel van bestuur, bedoeld in [artikel 2b][ref1]. Het college
      organiseert voorts de aansluiting van die instanties en functionarissen op de verwijsindex.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel2b
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel2g
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: 2b
        hoofdstuk: Ia
        paragraaf: '1'
  - number: 2g.2
    text: |-
      De afspraken betreffen in elk geval de wijze waarop het college samenwerkt met die instanties en functionarissen,
      en die instanties en functionarissen onderling samenwerken bij het verlenen van hulp, zorg of bijsturing ten
      behoeve van jeugdigen, alsmede het beheer en de nakoming van die afspraken. De afspraken worden in een convenant
      vastgelegd.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel2g
  - number: 2g.3
    text: |-
      Bij regeling van Onze Minister van Volksgezondheid, Welzijn en Sport kunnen regels worden gesteld omtrent het
      beheer en de nakoming van de afspraken en kunnen voorts regels worden gesteld omtrent andere in de afspraken
      op te nemen onderwerpen. Voor zover dat uit hoofde van hun functie of taak noodzakelijk is, kan in de afspraken
      onderscheid worden gemaakt tussen daarbij aangewezen categorieën van meldingsbevoegden.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel2g
  - number: 2g.4
    text: |-
      Bij regeling van Onze Minister van Volksgezondheid, Welzijn en Sport kunnen nadere regels worden gesteld omtrent
      het gebruik van, de aansluiting en de organisatie van de aansluiting op de verwijsindex. Daarbij kan onderscheid
      gemaakt worden tussen daarbij aangewezen categorieën van gemeenten en van meldingsbevoegden.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel2g
  - number: 2h.1
    text: |-
      Het college van burgemeester en wethouders draagt er zorg voor dat wordt nagegaan of de meldingsbevoegden die een
      jeugdige aan de verwijsindex hebben gemeld en vervolgens daaruit een signaal hebben ontvangen, met elkaar contact
      hebben opgenomen.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel2h
  - number: 2h.2
    text: |-
      Degene die belast is met de taken, bedoeld in het eerste lid, heeft uitsluitend ten behoeve daarvan toegang tot
      de verwijsindex.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel2h
  - number: 2i.1
    text: |-
      Instanties kunnen met het oog op een effectief gebruik van de verwijsindex een binnen hun instantie werkzame
      coördinator aanwijzen. De coördinator heeft als taak de contactgegevens van de meldingsbevoegden te beheren en zo
      nodig, aan te passen en de signalen uit de verwijsindex te beheren.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel2i
  - number: 2i.2
    text: Een coördinator heeft uitsluitend ten behoeve van de taak, bedoeld in het eerste lid, toegang tot de verwijsindex.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel2i
  - number: 2j
    text: |-
      Een meldingsbevoegde kan zonder toestemming van de jeugdige of zijn wettelijk vertegenwoordiger en zo nodig met
      doorbreking van de op grond van zijn ambt of beroep geldende plicht tot geheimhouding, een jeugdige melden aan
      de verwijsindex indien hij een redelijk vermoeden heeft dat de jeugdige door een of meer van de hierna genoemde
      risico’s in de noodzakelijke condities voor een gezonde en veilige ontwikkeling naar volwassenheid daadwerkelijk
      wordt bedreigd:
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel2j
  - number: 2j.a
    text: |-
      de jeugdige staat bloot aan geestelijk, lichamelijk of seksueel geweld, enige andere vernederende behandeling,
      of verwaarlozing;
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel2j
  - number: 2j.b
    text: |-
      de jeugdige heeft meer of andere dan bij zijn leeftijd normaliter voorkomende psychische problemen, waaronder
      verslaving aan alcohol, drugs of kansspelen;
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel2j
  - number: 2j.c
    text: de jeugdige heeft meer dan bij zijn leeftijd normaliter voorkomende ernstige opgroei- of opvoedingsproblemen;
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel2j
  - number: 2j.d
    text: de jeugdige is minderjarig en moeder of zwanger;
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel2j
  - number: 2j.e
    text: |-
      de jeugdige verzuimt veelvuldig van school of andere onderwijsinstelling, dan wel verlaat die voortijdig of dreigt
      die voortijdig te verlaten;
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel2j
  - number: 2j.f
    text: de jeugdige is niet gemotiveerd om door legale arbeid in zijn levensonderhoud te voorzien;
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel2j
  - number: 2j.g
    text: de jeugdige heeft meer of andere dan bij zijn leeftijd normaliter voorkomende financiële problemen;
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel2j
  - number: 2j.h
    text: de jeugdige heeft geen vaste woon- of verblijfplaats;
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel2j
  - number: 2j.i
    text: de jeugdige is een gevaar voor anderen door lichamelijk of geestelijk geweld of ander intimiderend gedrag;
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel2j
  - number: 2j.j
    text: de jeugdige laat zich in met activiteiten die strafbaar zijn gesteld;
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel2j
  - number: 2j.k
    text: |-
      de ouders of andere verzorgers van de jeugdige schieten ernstig tekort in de verzorging of opvoeding van de
      jeugdige;
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel2j
  - number: 2j.l
    text: de jeugdige staat bloot aan risico’s die in bepaalde etnische groepen onevenredig vaak voorkomen.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel2j
  - number: 2k.1
    text: |-
      Een melding wordt in de verwijsindex gekoppeld aan het burgerservicenummer van de jeugdige, met als doel te
      waarborgen dat de melding betrekking heeft op die jeugdige.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel2k
  - number: 2k.2
    text: |-
      Indien de melding afkomstig is van een meldingsbevoegde die op grond van een wettelijke bepaling reeds bevoegd is
      het burgerservicenummer van de jeugdige te gebruiken, biedt hij de melding met dat nummer aan de verwijsindex aan.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel2k
  - number: 2k.3
    text: |-
      In andere gevallen biedt de meldingsbevoegde de melding aan de verwijsindex aan met behulp van de voorzieningen,
      bedoeld in [artikel 2f, eerste lid, onder a][ref1], zonder dat hij kennis kan nemen van het burgerservicenummer van
      de betrokken jeugdige.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel2f
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel2k
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: 2f
        hoofdstuk: Ia
        paragraaf: '2'
  - number: 2k.4
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over het aanbieden van een
      melding aan de verwijsindex, bedoeld in het tweede en derde lid, en overigens over de wijze van melding.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel2k
  - number: 2k.5
    text: |-
      Bij algemene maatregel van bestuur worden een persoonsidentificerend nummer en andere identificerende gegevens
      aangewezen die gebruikt worden om jeugdigen die niet beschikken over een burgerservicenummer te melden aan de
      verwijsindex. Bij of krachtens de maatregel worden voorts regels gesteld over de wijze waarop deze gegevens worden
      aangeboden aan de verwijsindex.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel2k
  - number: 2l.1
    text: |-
      Naast het burgerservicenummer van de jeugdige worden in de verwijsindex bij een melding uitsluitend de volgende
      gegevens opgeslagen:
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel2l
  - number: 2l.1.a
    text: |-
      de identificatiegegevens en contactgegevens van de meldingsbevoegde die de melding doet, en, in voorkomend geval,
      van de coördinator, bedoeld in [artikel 2i][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel2i
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel2l
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: 2i
        hoofdstuk: Ia
        paragraaf: '3'
  - number: 2l.1.b
    text: de datum en het tijdstip van de melding, en
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel2l
  - number: 2l.1.c
    text: |-
      de datum waarop de melding op grond van [artikel 2n, tweede lid, onder a][ref1], uit de verwijsindex zal worden
      verwijderd.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel2n
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel2l
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: 2n
        hoofdstuk: Ia
        paragraaf: '4'
  - number: 2l.2
    text: Een signaal uit de verwijsindex bevat uitsluitend de gegevens, genoemd in het eerste lid, onder a.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel2l
  - number: 2m
    text: |-
      Ten behoeve van de doeleinden, bedoeld in [artikel 2d][ref1], worden persoonsgegevens betreffende de gezondheid,
      alsmede strafrechtelijke persoonsgegevens als bedoeld in [artikel 16 van de Wet bescherming persoonsgegevens][ref2]
      verwerkt. De verwerking van deze gegevens vindt uitsluitend plaats teneinde meldingsbevoegden uit de domeinen
      jeugdgezondheidszorg, gezondheidszorg en politie en justitie in staat te stellen een jeugdige aan de verwijsindex
      te melden alsmede andere meldingsbevoegden in staat te stellen van deze melding kennis te nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel2d
      [ref2]: https://wetten.overheid.nl/BWBR0011468#Artikel16
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel2m
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: 2d
        hoofdstuk: Ia
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0011468
        artikel: '16'
  - number: 2n.1
    text: 'Een meldingsbevoegde verwijdert een door hem gedane melding uit de verwijsindex indien naar zijn oordeel:'
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel2n
  - number: 2n.1.a
    text: die melding niet terecht is gedaan;
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel2n
  - number: 2n.1.b
    text: het eerder gesignaleerde risico niet meer aanwezig is.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel2n
  - number: 2n.2
    text: 'Een melding wordt voorts in elk geval uit de verwijsindex verwijderd:'
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel2n
  - number: 2n.2.a
    text: ten hoogste twee jaar nadat zij is gedaan;
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel2n
  - number: 2n.2.b
    text: met ingang van de dag dat de jeugdige 23 jaar wordt;
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel2n
  - number: 2n.2.c
    text: zo spoedig mogelijk na het overlijden van de jeugdige.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel2n
  - number: 2o.1
    text: |-
      Een overeenkomstig [artikel 2n, eerste lid, onder b, en tweede lid, onder a][ref1], uit de verwijsindex verwijderde
      melding wordt gedurende vijf jaren opgenomen in een historisch meldingenarchief, met dien verstande dat die opname
      wordt vernietigd met ingang van de dag dat de jeugdige 23 jaar wordt of zo spoedig mogelijk na het overlijden van
      de jeugdige. Meldingen die uit de verwijsindex zijn verwijderd met toepassing van artikel 2n, eerste lid, onder a,
      of het tweede lid, onder b of c, of de [artikelen 36][ref2] of [40 van de Wet bescherming persoonsgegevens][ref3],
      worden niet in het historisch meldingenarchief opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel2n
      [ref2]: https://wetten.overheid.nl/BWBR0011468#Artikel36
      [ref3]: https://wetten.overheid.nl/BWBR0011468#Artikel40
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel2o
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: 2n
        hoofdstuk: Ia
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0011468
        artikel: '36'
      - id: ref3
        bwb_id: BWBR0011468
        artikel: '40'
  - number: 2o.2
    text: |-
      Een in het historisch meldingenarchief opgenomen melding wordt uitsluitend en eenmalig aangeboden aan een
      meldingsbevoegde op het moment dat hij een jeugdige aan de verwijsindex meldt.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel2o
  - number: 2o.3
    text: |-
      [Artikelen 2e][ref1] en [2f, eerste lid, aanhef, juncto onder f en g][ref2], zijn van overeenkomstige toepassing
      op het historisch meldingenarchief. Van het historisch meldingenarchief maakt een voorziening deel uit waarmee een
      jeugdige uit het historisch meldingenarchief kan worden verwijderd.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel2e
      [ref2]: https://wetten.overheid.nl/BWBR0016637#Artikel2f
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel2o
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: 2e
        hoofdstuk: Ia
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0016637
        artikel: 2f
        hoofdstuk: Ia
        paragraaf: '2'
  - number: 2p.1
    text: |-
      Indien een melding betrekking heeft op een jeugdige die jonger is dan twaalf jaren wordt de mededeling, bedoeld
      in [artikel 34 van de Wet bescherming persoonsgegevens][ref1] gedaan aan zijn wettelijk vertegenwoordiger. Indien
      de jeugdige de leeftijd van twaalf, maar nog niet die van zestien jaren heeft bereikt, wordt de mededeling zowel
      aan de jeugdige als zijn wettelijk vertegenwoordiger gedaan. Het college van burgemeester en wethouders kan nadere
      regels stellen omtrent de mededeling.


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel34
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel2p
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '34'
  - number: 2p.2
    text: |-
      Indien de jeugdige jonger is dan twaalf jaren wordt een verzoek als bedoeld in de [artikelen 35][ref1]
      en [36 van de Wet bescherming persoonsgegevens][ref2] of een aantekening van verzet als bedoeld in
      [artikel 40 van die wet][ref3] gedaan door zijn wettelijk vertegenwoordiger. Indien de jeugdige de leeftijd van
      twaalf, maar nog niet die van zestien jaren heeft bereikt, wordt het verzoek of de aantekening van verzet gedaan
      door de jeugdige en zijn wettelijk vertegenwoordiger gezamenlijk.


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0011468#Artikel36
      [ref3]: https://wetten.overheid.nl/BWBR0011468#Artikel40
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel2p
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '35'
      - id: ref2
        bwb_id: BWBR0011468
        artikel: '36'
      - id: ref3
        bwb_id: BWBR0011468
        artikel: '40'
  - number: 2q.1
    text: |-
      Een meldingsbevoegde die een jeugdige aan de verwijsindex heeft gemeld, brengt aan het college van burgemeester en
      wethouders een advies uit over een door die jeugdige aan hen gedaan verzoek als bedoeld in de [artikelen 35][ref1]
      of [36 van de Wet bescherming persoonsgegevens][ref2], of over een bij hen aangetekend verzet als bedoeld in
      [artikel 40 van die wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0011468#Artikel36
      [ref3]: https://wetten.overheid.nl/BWBR0011468#Artikel40
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel2q
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '35'
      - id: ref2
        bwb_id: BWBR0011468
        artikel: '36'
      - id: ref3
        bwb_id: BWBR0011468
        artikel: '40'
  - number: 2q.2
    text: |-
      De meldingsbevoegde verstrekt het college overigens alle inlichtingen die nodig zijn met
      het oog op de uitvoering door het college van de in het eerste lid genoemde artikelen en
      [artikel 43 van de Wet bescherming persoonsgegevens][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel43
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel2q
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '43'
  - number: 2r.1
    text: |-
      Stichtingen en zorgaanbieders gebruiken het burgerservicenummer van een cliënt met het doel te waarborgen dat de in
      het kader van de uitvoering van deze wet te verwerken persoonsgegevens op die cliënt betrekking hebben.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel2r
  - number: 2r.2
    text: |-
      Het eerste lid is niet van toepassing op een stichting, voor zover deze ter uitvoering van de taken, bedoeld in
      [artikel 10, eerste lid, onderdelen c en d][ref1], persoonsgegevens uitwisselt van verdachten en veroordeelden ten
      behoeve van de toepassing van het strafrecht.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel10
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel2r
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '10'
        hoofdstuk: III
        paragraaf: '2'
  - number: 2s
    text: |-
      De stichting stelt het burgerservicenummer van een cliënt vast wanneer de cliënt voor de eerste maal contact met
      haar heeft in het kader van de uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel2s
  - number: 2t
    text: |-
      De zorgaanbieder stelt het burgerservicenummer van een cliënt vast wanneer de cliënt voor de eerste maal contact
      met hem heeft ter verkrijging van jeugdzorg waarop ingevolge deze wet aanspraak bestaat.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel2t
  - number: 2u.1
    text: |-
      Teneinde het burgerservicenummer van de cliënt vast te stellen, raadplegen de
      zorgaanbieder en de stichting het nummerregister en de voorzieningen, bedoeld in
      [artikel 3, eerste lid, onder b en d, van de Wet algemene bepalingen burgerservicenummer][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022428#Artikel3
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel2u
    references:
      - id: ref1
        bwb_id: BWBR0022428
        artikel: '3'
  - number: 2u.2
    text: 'De zorgaanbieder en de stichting kunnen de raadpleging, bedoeld in het eerste lid, achterwege laten, indien:'
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel2u
  - number: 2u.2.a
    text: |-
      het burgerservicenummer is verstrekt door een gebruiker als bedoeld in
      [artikel 1 van de Wet algemene bepalingen burgerservicenummer][ref1], die bij of krachtens de wet gehouden is het
      burgerservicenummer van de cliënt vast te stellen aan de hand van het nummerregister en de voorzieningen, bedoeld
      in [artikel 3, eerste lid, onder b en d, van de Wet algemene bepalingen burgerservicenummer][ref2], of


      [ref1]: https://wetten.overheid.nl/BWBR0022428#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0022428#Artikel3
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel2u
    references:
      - id: ref1
        bwb_id: BWBR0022428
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0022428
        artikel: '3'
  - number: 2u.2.b
    text: |-
      zij het burgerservicenummer hebben verkregen uit een basisadministratie van persoonsgegevens als bedoeld in
      [artikel 2 van de Wet gemeentelijke basisadministratie persoonsgegevens][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel2
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel2u
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '2'
  - number: 2v
    text: 'Indien aan een cliënt geen burgerservicenummer is toegekend:'
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel2v
  - number: 2v.a
    text: 'nemen stichtingen en zorgaanbieders in ieder geval de volgende gegevens van de cliënt in hun administratie op:'
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel2v
  - number: 2v.a.1°
    text: achternaam;
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel2v
  - number: 2v.a.2°
    text: voornamen;
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel2v
  - number: 2v.a.3°
    text: geboortedatum;
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel2v
  - number: 2v.a.4°
    text: postcode en huisnummer van het woonadres, en
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel2v
  - number: 2v.b
    text: |-
      vermelden stichtingen en zorgaanbieders de gegevens, bedoeld in onderdeel a, bij het
      verstrekken van persoonsgegevens met betrekking tot de verlening van, indicatiestelling
      voor of verzekering van zorg aan een zorgaanbieder, een indicatieorgaan, als bedoeld
      in [artikel 9a, eerste lid, van de Algemene Wet Bijzondere Ziektekosten][ref1] of
      [artikel 9b, vierde lid, van de Algemene Wet Bijzondere Ziektekosten][ref2], of een zorgverzekeraar.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel9a
      [ref2]: https://wetten.overheid.nl/BWBR0002614#Artikel9b
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel2v
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: 9a
      - id: ref2
        bwb_id: BWBR0002614
        artikel: 9b
  - number: 2w
    text: |-
      Bij ministeriële regeling wordt bepaald aan welke beveiligingseisen de gegevensverwerking, bedoeld in de
      [artikelen 2r][ref1] en [2v][ref2], voldoet.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel2r
      [ref2]: https://wetten.overheid.nl/BWBR0016637#Artikel2v
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel2w
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: 2r
        hoofdstuk: Ib
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0016637
        artikel: 2v
        hoofdstuk: Ib
        paragraaf: '2'
  - number: 2x
    text: |-
      Stichtingen en zorgaanbieders kunnen van de bij de [artikelen 2r tot en met 2v][ref1] gestelde verplichtingen
      afwijken voor zolang dit noodzakelijk is met betrekking tot gevallen als bedoeld in [artikel 3, vijfde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel2r
      [ref2]: https://wetten.overheid.nl/BWBR0016637#Artikel3
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel2x
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: 2r
        hoofdstuk: Ib
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0016637
        artikel: '3'
        hoofdstuk: II
  - number: 2y
    text: |-
      Onze Minister van Volksgezondheid, Welzijn en Sport of een door hem aangewezen instelling beheert
      een autorisatielijst van jeugdzorgaanbieders, waarin een zorgaanbieder op zijn verzoek wordt
      opgenomen teneinde gebruik te kunnen maken van het nummerregister en de voorzieningen, bedoeld in
      [artikel 3, eerste lid, onder b en d, van de Wet algemene bepalingen burgerservicenummer][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022428#Artikel3
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel2y
    references:
      - id: ref1
        bwb_id: BWBR0022428
        artikel: '3'
  - number: 2z.1
    text: 'Bij of krachtens algemene maatregel van bestuur worden regels gesteld over:'
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel2z
  - number: 2z.1.a
    text: |-
      het opnemen, wijzigen en verwijderen van gegevens in, onderscheidenlijk uit, de in [artikel 2y][ref1] bedoelde
      autorisatielijst van jeugdzorgaanbieders;


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel2y
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel2z
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: 2y
        hoofdstuk: Ib
        paragraaf: '4'
  - number: 2z.1.b
    text: het beheer van de autorisatielijst, in ieder geval wat betreft de beveiliging van persoonsgegevens;
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel2z
  - number: 2z.1.c
    text: het toezicht op het functioneren van de autorisatielijst.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel2z
  - number: 2z.2
    text: |-
      Bij de maatregel, bedoeld in het eerste lid, kunnen bijdragen van zorgaanbieders worden verlangd in de kosten van
      de autorisatielijst.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel2z
  - number: 2z.3
    text: |-
      De beheerder van de autorisatielijst, bedoeld in [artikel 2y][ref1], verschaft aan een in de autorisatielijst
      opgenomen zorgaanbieder op diens verzoek een middel waarmee deze ten behoeve van de raadpleging, bedoeld
      in [artikel 2u][ref2], toegang kan krijgen tot het nummerregister en de voorzieningen, bedoeld in
      [artikel 3, eerste lid, onder b en d, van de Wet algemene bepalingen burgerservicenummer][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel2y
      [ref2]: https://wetten.overheid.nl/BWBR0016637#Artikel2u
      [ref3]: https://wetten.overheid.nl/BWBR0022428#Artikel3
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel2z
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: 2y
        hoofdstuk: Ib
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0016637
        artikel: 2u
        hoofdstuk: Ib
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0022428
        artikel: '3'
  - number: 2z.4
    text: De beheerder kan voor het middel een vergoeding verlangen.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel2z
  - number: 2z.5
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de kenmerken, de aanvraag, de
      procedure, de verstrekking, het beheer, de beveiliging, het gebruik en de intrekking van het middel, bedoeld in het
      derde lid.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel2z
  - number: '3.1'
    text: |-
      Cliënten, behoudens niet rechtmatig in Nederland verblijvende vreemdelingen, hebben aanspraak op
      jeugdzorg. Bij of krachtens algemene maatregel van bestuur worden aard en inhoud van de jeugdzorg waarop
      aanspraak bestaat, geregeld. Ingevolge deze wet bestaat geen aanspraak op jeugdzorg waarop ingevolge de
      [Beginselenwet justitiële jeugdinrichtingen][ref1] aanspraak bestaat. Onder vreemdeling wordt in dit artikel
      verstaan hetgeen daaronder wordt verstaan in de [Vreemdelingenwet 2000][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011756
      [ref2]: https://wetten.overheid.nl/BWBR0011823
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0011756
      - id: ref2
        bwb_id: BWBR0011823
  - number: '3.2'
    text: |-
      Gedeputeerde staten van de provincie waarin de jeugdige voorafgaand aan de aanvang van de jeugdzorg, duurzaam
      verblijft, dragen ervoor zorg dat cliënten hun aanspraak op jeugdzorg als bedoeld in het eerste lid, tot gelding
      kunnen brengen.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel3
  - number: '3.3'
    text: |-
      Een cliënt heeft slechts aanspraak op jeugdzorg ingevolge deze wet als de stichting die werkzaam is in de
      provincie waar de jeugdige duurzaam verblijft, een besluit heeft genomen waaruit blijkt dat die cliënt op die
      zorg is aangewezen. Met een zodanig besluit wordt gelijk gesteld een beslissing van de rechter als bedoeld in
      [artikel 261, vierde lid, van Boek 1 van het Burgerlijk Wetboek][ref1], alsmede een beslissing van Onze Minister
      van Veiligheid en Justitie in het kader van [artikel 77s, vijfde lid, van het Wetboek van Strafrecht][ref2],
      voor zover hij de veroordeelde elders doet opnemen, een beslissing van de rechter als bedoeld in
      [artikel 77wa, eerste lid, van het Wetboek van Strafrecht][ref3], en een beslissing van de selectiefunctionaris,
      bedoeld in [artikel 12, derde lid, van de Beginselenwet justitiële jeugdinrichtingen][ref4], bij welke beslissing
      jeugdzorg waarop ingevolge deze wet aanspraak bestaat, wordt opgelegd of als voorwaarde wordt gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel261
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel77s
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel77wa
      [ref4]: https://wetten.overheid.nl/BWBR0011756#Artikel12
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '261'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: 77s
      - id: ref3
        bwb_id: BWBR0001854
        artikel: 77wa
      - id: ref4
        bwb_id: BWBR0011756
        artikel: '12'
  - number: '3.4'
    text: |-
      Indien het besluit van de stichting strekt tot uithuisplaatsing in het kader van een ondertoezichtstelling als
      bedoeld in [artikel 261 van Boek 1 van het Burgerlijk Wetboek][ref1], treedt het niet in werking dan nadat de
      in [dat artikel][ref2] bedoelde machtiging van de kinderrechter is verkregen. Indien de machtiging niet wordt
      verleend, vervalt het besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel261
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel261
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '261'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '261'
  - number: '3.5'
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld voor gevallen waarin het besluit, bedoeld in het derde
      lid, niet afgewacht kan worden. Daarbij kan worden afgeweken van het derde lid.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel3
  - number: '3.6'
    text: |-
      Een cliënt kan zijn aanspraak op jeugdzorg ingevolge deze wet uitsluitend tot gelding brengen bij een zorgaanbieder
      die tot dat doel van de provincie subsidie ontvangt.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel3
  - number: '3.7'
    text: |-
      In afwijking van het zesde lid kan een cliënt zijn aanspraak op jeugdzorg ingevolge deze wet tot gelding brengen
      bij een zorgaanbieder, die tot dat doel door een andere provincie dan die jegens welke de cliënt aanspraak
      heeft, wordt gesubsidieerd, indien de cliënt op jeugdzorg is aangewezen die slechts kan worden geboden door
      een zorgaanbieder wiens aanbod gericht is op jeugdzorg die zodanig gespecialiseerd is of vanuit een zodanige
      levensbeschouwelijke achtergrond wordt geboden, dat gezien de omvang van de doelgroep niet verwacht mag worden dat
      iedere provincie subsidie verstrekt voor deze zorg. Gedeputeerde staten van een provincie die geen zorgaanbieder
      als bedoeld in de eerste volzin subsidie verstrekken, voldoen aan de verplichting van het tweede lid door het
      aangaan van een schriftelijke overeenkomst met de provincie die aan die zorgaanbieders subsidie verstrekt. Deze
      overeenkomst legt in ieder geval vast op welke wijze de kosten worden verrekend.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel3
  - number: '3.8'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen, in afwijking van het eerste lid, eerste volzin, de
      aanspraken ingevolge deze wet, zo nodig in afwijking van [artikel 11 van de Vreemdelingenwet 2000][ref1], voor
      bij of krachtens die algemene maatregel van bestuur aan te geven categorieën rechtmatig in Nederland verblijvende
      vreemdelingen worden beperkt, gelet op de aard, de plaats of de verwachte duur van hun verblijf.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel11
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '11'
  - number: '3.9'
    text: |-
      In afwijking van het eerste lid, kunnen bij of krachtens algemene maatregel van bestuur, zo nodig in afwijking
      van [artikel 10 van de Vreemdelingenwet 2000][ref1], de aanspraken ingevolge deze wet geheel of gedeeltelijk
      worden uitgebreid tot bij of krachtens die algemene maatregel van bestuur aan te geven categorieën niet rechtmatig
      in Nederland verblijvende vreemdelingen. Een zodanige aanspraak geeft een vreemdeling geen recht op rechtmatig
      verblijf.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel10
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '10'
  - number: '4.1'
    text: |-
      Gedeputeerde staten dragen er zorg voor dat in de provincie één bureau jeugdzorg werkzaam is, dat in stand wordt
      gehouden door een stichting als bedoeld in [artikel 285 van Boek 2 van het Burgerlijk Wetboek][ref1] die door de
      provincie wordt gesubsidieerd.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel285
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '285'
  - number: '4.2'
    text: |-
      De stichting heeft als doel het in stand houden van een bureau jeugdzorg dat de in deze wet aan de stichting
      opgedragen taken vervult. De stichting kan naast het in stand houden van een bureau jeugdzorg slechts ten doel
      hebben het verlenen van jeugdzorg, niet zijnde zorg als bedoeld in [artikel 5, tweede lid][ref1], en het geven van
      voorlichting en advies over opgroei- en opvoedingsvragen en vragen van jeugdigen over hun juridische positie voor
      zover gedeputeerde staten toestemming hebben verleend. Gedeputeerde staten verlenen geen toestemming dan na overleg
      met het betrokken college van burgemeester en wethouders.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel5
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '5'
        hoofdstuk: III
        paragraaf: '2'
  - number: '4.3'
    text: |-
      Indien het bestuur van de stichting wordt gevormd door de leiding van het bureau jeugdzorg, voorzien de statuten in
      een raad van toezicht, die tot taak heeft toezicht te houden op het beleid van het bestuur en op de algemene gang
      van zaken in de stichting. De raad van toezicht heeft de bevoegdheid tot het benoemen, schorsen en ontslaan van de
      leden van het bestuur.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel4
  - number: '4.4'
    text: |-
      De bestuursleden en de leden van de raad van toezicht van de stichting, alsmede de leiding van het bureau
      vervullen geen functie bij een natuurlijke persoon of rechtspersoon die zorg aanbiedt als bedoeld in
      [artikel 5, tweede lid][ref1]. Zij hebben evenmin een functie die betrekking heeft op die zorg bij de
      desbetreffende provincie, een gemeente binnen die provincie of een zorgverzekeraar. De stichting voorziet in
      waarborgen voor een onafhankelijke taakuitoefening door de personen die de in [artikel 5][ref2] genoemde taken
      uitvoeren.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0016637#Artikel5
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '5'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0016637
        artikel: '5'
        hoofdstuk: III
        paragraaf: '2'
  - number: '4.5'
    text: |-
      Gedeputeerde staten kunnen, indien de juiste uitvoering van de in de wet aan de stichting opgedragen taken
      in gevaar komt ten gevolge van handelen of nalaten van het bestuur of van leden van de raad van toezicht,
      bestuursleden of leden van de raad van toezicht van de stichting schorsen of ontslaan, of tijdelijk voorzien in de
      leiding van het bureau jeugdzorg.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel4
  - number: '5.1'
    text: |-
      De stichting heeft tot taak te bezien of een cliënt zorg nodig heeft in verband met opgroei-, opvoedings- of
      psychiatrische problemen, dan wel in verband met problemen van een cliënt, niet zijnde een jeugdige, die het
      onbedreigd opgroeien van een jeugdige belemmeren.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel5
  - number: '5.2'
    text: 'Tot de taak, bedoeld in het eerste lid, behoort het vaststellen of een cliënt is aangewezen op:'
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel5
  - number: 5.2.a
    text: jeugdzorg waarop ingevolge deze wet aanspraak bestaat,
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel5
  - number: 5.2.b
    text: |-
      zorg, bestaande uit bij algemene maatregel van bestuur aan te wijzen vormen van geestelijke gezondheidszorg voor
      jeugdigen waarop ingevolge de [Algemene Wet Bijzondere Ziektekosten][ref1] dan wel ingevolge een zorgverzekering
      als bedoeld in [artikel 1, onderdeel d, van de Zorgverzekeringswet][ref2] aanspraak bestaat,


      [ref1]: https://wetten.overheid.nl/BWBR0002614
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel1
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002614
      - id: ref2
        bwb_id: BWBR0018450
        artikel: '1'
  - number: '5.3'
    text: De stichting oefent de taak, bedoeld in het eerste lid, uit op verzoek van een cliënt of uit eigen beweging.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel5
  - number: '5.4'
    text: |-
      Uitgangspunt bij het uitoefenen van de taak, bedoeld in het eerste lid, is dat zorg het belang van een onbedreigde
      ontwikkeling van een jeugdige dient en aansluit bij de behoefte van de cliënt. Deze zorg is in verband hiermee niet
      ingrijpender dan noodzakelijk en wordt geboden zo dicht mogelijk bij de plaats waar de cliënt duurzaam verblijft en
      gedurende een zo kort mogelijke periode.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel5
  - number: '6.1'
    text: |-
      Indien de stichting een besluit neemt, waarbij wordt vastgesteld dat een cliënt is aangewezen op zorg als bedoeld
      in [artikel 5, tweede lid][ref1], geeft zij daarbij in ieder geval:


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel5
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '5'
        hoofdstuk: III
        paragraaf: '2'
  - number: 6.1.a
    text: een beschrijving van de problemen of dreigende problemen van de cliënt, de ernst en de mogelijke oorzaken daarvan;
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel6
  - number: 6.1.b
    text: een beschrijving van de in verband daarmee benodigde zorg en het met die zorg beoogde doel;
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel6
  - number: 6.1.c
    text: de termijn waarbinnen de aanspraak tot gelding moet zijn gebracht;
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel6
  - number: 6.1.d
    text: een advies wie de zorg kan of kunnen verlenen.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel6
  - number: '6.2'
    text: |-
      In het besluit geeft de stichting aan of coördinatie van de zorg noodzakelijk is en zo ja, wie deze coördinatie het
      beste kan uitvoeren.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel6
  - number: '6.3'
    text: |-
      Indien in een besluit dat strekt tot de vaststelling dat een cliënt is aangewezen op jeugdzorg in de zin van
      [artikel 5, tweede lid, onder a][ref1], bepalingen over de duur en de omvang van de geïndiceerde jeugdzorg worden
      opgenomen, hebben deze bepalingen geen gevolgen voor de aanspraak op jeugdzorg.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel5
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '5'
        hoofdstuk: III
        paragraaf: '2'
  - number: '6.4'
    text: |-
      Indien een besluit strekt tot de vaststelling dat een cliënt is aangewezen op zorg als bedoeld in
      [artikel 5, tweede lid, onder b][ref1], wordt daarin opgenomen de termijn gedurende welke de aanspraak geldt nadat
      de in het besluit voorziene zorg is aangevangen.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel5
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '5'
        hoofdstuk: III
        paragraaf: '2'
  - number: '6.5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld omtrent de inhoud van het besluit,
      bedoeld in het eerste lid, en kunnen regels worden gesteld omtrent de wijze van totstandkoming daarvan.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel6
  - number: 6a.1
    text: |-
      De aanspraak op zorg, bedoeld in [artikel 5, tweede lid][ref1], vervalt, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel5
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '5'
        hoofdstuk: III
        paragraaf: '2'
  - number: 6a.1.a
    text: |-
      de cliënt de aanspraak niet binnen de termijn, bedoeld in [artikel 6, eerste lid, onderdeel c][ref1], tot gelding
      heeft gebracht,


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel6
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '6'
        hoofdstuk: III
        paragraaf: '2'
  - number: 6a.1.b
    text: |-
      de zorgaanbieder en de cliënt tezamen schriftelijk aan de stichting hebben medegedeeld dat de met de zorg beoogde
      doelen zijn bereikt, of
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel6a
  - number: 6a.1.c
    text: |-
      de stichting een besluit neemt, waarbij wordt vastgesteld dat de cliënt niet langer is aangewezen op de
      geïndiceerde zorg.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel6a
  - number: 6a.2
    text: |-
      In afwijking van het eerste lid vervalt de aanspraak op zorg, bedoeld in
      [artikel 5, tweede lid, op grond van het eerste lid, onder b of onder c][ref1], uitsluitend indien de stichting
      daarmee instemt, voor zover het gaat om een aanspraak die wordt verleend:


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel5
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '5'
        hoofdstuk: III
        paragraaf: '2'
  - number: 6a.2.a
    text: |-
      in het kader van een ondertoezichtstelling als bedoeld in
      [artikel 254, van Boek 1 van het Burgerlijk Wetboek][ref1], dan wel een voorlopige ondertoezichtstelling als
      bedoeld in [artikel 255, van Boek 1 van het Burgerlijk Wetboek][ref2], of


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel254
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel255
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '254'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '255'
  - number: 6a.2.b
    text: |-
      indien de stichting de voogdij op grond van [artikel 302, van Boek 1 van het Burgerlijk Wetboek][ref1]
      dan wel de voorlopige voogdij op grond van [artikel 241, tweede lid][ref2], [271, vierde lid][ref3], of
      [272, eerste lid, van Boek 1 van het Burgerlijk Wetboek][ref4], uitoefent.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel302
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel241
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel271
      [ref4]: https://wetten.overheid.nl/BWBR0002656#Artikel272
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '302'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '241'
      - id: ref3
        bwb_id: BWBR0002656
        artikel: '271'
      - id: ref4
        bwb_id: BWBR0002656
        artikel: '272'
  - number: 6a.3
    text: |-
      In afwijking van het eerste lid vervalt de aanspraak op zorg, bedoeld in [artikel 5, tweede lid][ref1],
      zodra de tenuitvoerlegging van een rechterlijke beslissing als bedoeld in
      [artikel 77wa, eerste lid, van het Wetboek van Strafrecht][ref2] is voltooid, tenzij de zorgaanbieders en de cliënt
      gezamenlijk van oordeel zijn dat de zorg dient te worden voortgezet.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel77wa
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '5'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: 77wa
  - number: '7.1'
    text: |-
      Aan een besluit waarbij wordt vastgesteld of een cliënt is aangewezen op zorg als bedoeld in
      [artikel 5, tweede lid][ref1], ligt een aanvraag van een cliënt ten grondslag.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel5
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '5'
        hoofdstuk: III
        paragraaf: '2'
  - number: '7.2'
    text: |-
      Indien de zorg betrekking heeft op een ander dan de aanvrager, behoeft de aanvraag de instemming van de cliënt
      waarop de aanvraag betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel7
  - number: '7.3'
    text: |-
      Indien de aanvraag betrekking heeft op een minderjarige die jonger is dan twaalf jaren of ouder dan twaalf jaren en
      niet in staat is tot een redelijke waardering van zijn belangen ter zake, is niet de instemming van de minderjarige
      vereist, maar van diens wettelijke vertegenwoordiger.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel7
  - number: '7.4'
    text: |-
      Indien de aanvraag betrekking heeft op een minderjarige die de leeftijd van twaalf maar nog niet die van zestien
      jaren heeft bereikt, behoeft de aanvraag de instemming van de minderjarige en diens wettelijke vertegenwoordiger.
      Indien de wettelijke vertegenwoordiger weigert in te stemmen met de aanvraag, kan de stichting in afwijking van
      de eerste volzin, een besluit nemen indien de zorg voor de minderjarige noodzakelijk is en de minderjarige de zorg
      weloverwogen blijft wensen.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel7
  - number: '7.5'
    text: |-
      In afwijking van het tweede lid kan de stichting op een aanvraag van de wettelijke vertegenwoordiger van een
      minderjarige, die ouder is dan twaalf jaren, maar nog niet de leeftijd van zestien jaren heeft bereikt, en die
      weigert in te stemmen met de aanvraag, een besluit nemen, indien de zorg voor de minderjarige noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel7
  - number: '7.6'
    text: 'In afwijking van het eerste lid kan de stichting een besluit nemen zonder een aanvraag daartoe, indien:'
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel7
  - number: 7.6.a
    text: |-
      verlening van zorg noodzakelijk is ter uitvoering van de taken, bedoeld in
      [artikel 10, eerste lid, onder a tot en met d][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel10
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '10'
        hoofdstuk: III
        paragraaf: '2'
  - number: 7.6.b
    text: |-
      het besluit strekt tot een uithuisplaatsing in het kader van een ondertoezichtstelling als bedoeld in
      [artikel 261 van Boek 1 van het Burgerlijk Wetboek][ref1] op verzoek van het openbaar ministerie of de raad voor
      de kinderbescherming;


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel261
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '261'
  - number: 7.6.c
    text: het besluit strekt tot verblijf niet zijnde verblijf bij een pleegouder en een machtiging wordt verzocht.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel7
  - number: '8.1'
    text: |-
      Indien de stichting van oordeel is dat zorg, niet zijnde zorg als bedoeld in [artikel 5, tweede lid][ref1],
      noodzakelijk is om een voor een jeugdige bedreigende situatie te voorkomen, legt de stichting ten behoeve van de
      cliënt schriftelijk vast welke zorg zij noodzakelijk acht. Zij geeft daarbij in ieder geval:


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel5
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '5'
        hoofdstuk: III
        paragraaf: '2'
  - number: 8.1.a
    text: een beschrijving van de problemen of dreigende problemen van de cliënt en de mogelijke oorzaken daarvan;
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel8
  - number: 8.1.b
    text: de mate waarin deze een bedreigende situatie voor de jeugdige kunnen veroorzaken;
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel8
  - number: 8.1.c
    text: een beschrijving van de in verband daarmee benodigde zorg;
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel8
  - number: 8.1.d
    text: een advies wie de benodigde zorg kan verlenen.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel8
  - number: '8.2'
    text: |-
      Bij de vastlegging geeft de stichting aan of coördinatie van de zorg noodzakelijk is en zo ja, wie deze coördinatie
      het beste kan uitvoeren.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel8
  - number: '9.1'
    text: |-
      De stichting beziet bij de uitoefening van haar taken voortdurend of een maatregel met betrekking tot het gezag
      overwogen dient te worden.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel9
  - number: '9.2'
    text: |-
      Zodra de stichting tot het oordeel komt dat een maatregel met betrekking tot het gezag over een minderjarige
      overwogen dient te worden, stelt zij de raad voor de kinderbescherming hiervan in kennis.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel9
  - number: '10.1'
    text: 'De stichting heeft bovendien tot taak:'
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel10
  - number: 10.1.a
    text: |-
      het, met uitsluiting van andere rechtspersonen en onverminderd [artikel 302, tweede lid][ref1], en
      [artikel 241, zevende lid, van Boek 1 van het Burgerlijk Wetboek][ref2], uitoefenen van de voogdij en de voorlopige
      voogdij op grond van [Boek 1 van het Burgerlijk Wetboek][ref3] of de voorlopige voogdij op grond van andere wetten;


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel302
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel241
      [ref3]: https://wetten.overheid.nl/BWBR0002656
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '302'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '241'
      - id: ref3
        bwb_id: BWBR0002656
  - number: 10.1.b
    text: |-
      het, met uitsluiting van andere rechtspersonen en onverminderd
      [artikel 254, tweede lid, van Boek 1 van het Burgerlijk Wetboek][ref1], uitoefenen van de taak, genoemd in
      [artikel 257 van Boek 1 van het Burgerlijk Wetboek][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel254
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel257
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '254'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '257'
  - number: 10.1.c
    text: |-
      het geven van de in [artikel 77f, eerste lid, van het Wetboek van Strafrecht][ref1] bedoelde
      aanwijzingen, dan wel het uitvoeren van de taken, bedoeld in [artikel 77j, vierde en vijfde lid][ref2],
      [77o, eerste lid][ref3], [77s, achtste lid][ref4], [77w, derde en zesde lid][ref5],
      en [77aa, tweede en derde lid, van het Wetboek van Strafrecht][ref6] of in
      [artikel 493, eerste lid, van het Wetboek van Strafvordering][ref7], en de daarop aansluitende nazorg, alsmede het
      geven van begeleiding als bedoeld in [artikel 77hh, tweede lid, van het Wetboek van Strafrecht][ref8];


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel77f
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel77j
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel77o
      [ref4]: https://wetten.overheid.nl/BWBR0001854#Artikel77s
      [ref5]: https://wetten.overheid.nl/BWBR0001854#Artikel77w
      [ref6]: https://wetten.overheid.nl/BWBR0001854#Artikel77aa
      [ref7]: https://wetten.overheid.nl/BWBR0001903#Artikel493
      [ref8]: https://wetten.overheid.nl/BWBR0001854#Artikel77hh
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 77f
      - id: ref2
        bwb_id: BWBR0001854
        artikel: 77j
      - id: ref3
        bwb_id: BWBR0001854
        artikel: 77o
      - id: ref4
        bwb_id: BWBR0001854
        artikel: 77s
      - id: ref5
        bwb_id: BWBR0001854
        artikel: 77w
      - id: ref6
