        artikel: 77aa
      - id: ref7
        bwb_id: BWBR0001903
        artikel: '493'
      - id: ref8
        bwb_id: BWBR0001854
        artikel: 77hh
  - number: 10.1.d
    text: |-
      het, met uitsluiting van anderen, begeleiden van en toezicht houden op jeugdigen die deel nemen aan een scholings-
      en trainingsprogramma als bedoeld in [artikel 3 van de Beginselenwet justitiële jeugdinrichtingen][ref1], alsmede
      de overige taken die bij of krachtens die wet aan de stichting zijn opgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel3
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '3'
  - number: 10.1.e
    text: het fungeren als advies- en meldpunt kindermishandeling;
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel10
  - number: 10.1.f
    text: |-
      het actief bijstaan van een cliënt en het zo nodig motiveren van een cliënt tot het tot gelding brengen van zijn
      aanspraak op zorg als bedoeld in [artikel 5, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel5
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '5'
        hoofdstuk: III
        paragraaf: '2'
  - number: 10.1.g
    text: |-
      het, met uitsluiting van anderen, bevorderen dat degenen bij wie een aanspraak op zorg als bedoeld in
      [artikel 5, tweede lid][ref1], tot gelding wordt gebracht, een samenhangend hulpverleningsplan tot stand brengen
      dat is afgeleid van het besluit, bedoeld in [artikel 6, eerste lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0016637#Artikel6
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '5'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0016637
        artikel: '6'
        hoofdstuk: III
        paragraaf: '2'
  - number: 10.1.h
    text: |-
      het volgen van de verleende zorg als bedoeld in [artikel 5, tweede lid][ref1], en het bijstaan van de cliënt bij
      vragen omtrent de inhoud van deze zorg, alsmede de evaluatie van deze zorg;


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel5
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '5'
        hoofdstuk: III
        paragraaf: '2'
  - number: 10.1.i
    text: |-
      het adviseren van de cliënt omtrent zorg die na beëindiging van de zorg, bedoeld in [artikel 5, tweede lid][ref1],
      nodig is en het bijstaan van de cliënt bij het verkrijgen van deze zorg;


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel5
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '5'
        hoofdstuk: III
        paragraaf: '2'
  - number: 10.1.j
    text: |-
      het in gevallen als bedoeld in [artikel 8, eerste lid][ref1], bijstaan van een cliënt bij het verkrijgen van zorg,
      zo nodig motiveren van een cliënt tot het gebruik maken van zorg, en volgen van deze zorg.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel8
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '8'
        hoofdstuk: III
        paragraaf: '2'
  - number: '10.2'
    text: |-
      De stichting neemt bij de uitoefening van de in het eerste lid, onder c, bedoelde taken de aanwijzingen van de raad
      voor de kinderbescherming in acht. Bij de uitoefening van de in het eerste lid, onder d, bedoelde taken neemt de
      stichting de aanwijzingen van Onze Minister van Veiligheid en Justitie, van de selectiefunctionaris, bedoeld in
      [artikel 1, onder aa, van de Beginselenwet justitiële jeugdinrichtingen][ref1], dan wel van de directeur, bedoeld
      in artikel 1, onder i, van die wet, in acht.


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel1
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '1'
  - number: '10.3'
    text: 'De stichting heeft binnen de door de provincie bij de subsidiëring gestelde grenzen voorts tot taak:'
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel10
  - number: 10.3.a
    text: |-
      het advies geven aan en, het bijdragen aan de deskundigheidsbevordering van en het onderhouden van contacten met
      algemene voorzieningen voor jeugdigen, waaronder in elk geval het onderwijs, ter versterking van deze algemene
      voorzieningen en ter bevordering van vroegtijdige signalering van problemen bij jeugdigen die tot zorg als bedoeld
      in [artikel 5, tweede lid][ref1], zouden kunnen leiden;


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel5
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '5'
        hoofdstuk: III
        paragraaf: '2'
  - number: 10.3.b
    text: |-
      het verlenen van ambulante jeugdzorg anders dan jeugdzorg als bedoeld in [artikel 5, tweede lid][ref1] , nadat de
      stichting heeft vastgesteld dat de cliënt niet is aangewezen op zorg als bedoeld in artikel 5, tweede lid;


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel5
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '5'
        hoofdstuk: III
        paragraaf: '2'
  - number: 10.3.c
    text: |-
      het door vrijwilligers per telefoon laten adviseren van jeugdigen over door hen telefonisch voorgelegde vragen
      of problemen.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel10
  - number: '11.1'
    text: |-
      Het fungeren als een advies- en meldpunt kindermishandeling houdt, onverminderd de taken van de raad voor de
      kinderbescherming, de uitoefening van de volgende taken in:
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel11
  - number: 11.1.a
    text: |-
      het naar aanleiding van een melding van kindermishandeling of een vermoeden daarvan, onderzoeken of sprake is van
      kindermishandeling;
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel11
  - number: 11.1.b
    text: |-
      het beoordelen van de vraag of en zo ja tot welke stappen de melding van kindermishandeling of een vermoeden
      daarvan aanleiding geeft;
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel11
  - number: 11.1.c
    text: |-
      het binnen het bureau jeugdzorg overdragen van een zaak ten behoeve van de uitvoering van de in
      [artikel 5, eerste lid][ref1], bedoelde taak;


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel5
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '5'
        hoofdstuk: III
        paragraaf: '2'
  - number: 11.1.d
    text: |-
      het in kennis stellen van andere justitiële autoriteiten van kindermishandeling of een vermoeden daarvan, indien
      het belang van de minderjarige dan wel de ernst van de situatie waarop de melding betrekking heeft, daartoe
      aanleiding geeft;
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel11
  - number: 11.1.e
    text: |-
      het op de hoogte stellen van degene die een melding heeft gedaan, van de stappen die naar aanleiding van de melding
      zijn ondernomen;
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel11
  - number: 11.1.f
    text: |-
      het in kennis stellen van het steunpunt huiselijk geweld als bedoeld in
      [artikel 1, eerste lid, van de Wet maatschappelijke ondersteuning][ref1] van een melding van kindermishandeling
      gepleegd door iemand uit de huiselijke kring of een vermoeden daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0020031#Artikel1
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0020031
        artikel: '1'
  - number: '11.2'
    text: |-
      Het fungeren als advies- en meldpunt kindermishandeling houdt bovendien in het verstrekken van advies aan een
      persoon die een vermoeden van kindermishandeling heeft over de stappen die door hem in verband hiermee kunnen
      worden ondernomen en het zonodig ondersteunen daarbij.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel11
  - number: '12'
    text: |-
      De stichting heeft verder tot taak aan het Landelijk Bureau Inning Onderhoudsbijdragen onverwijld schriftelijk
      mededeling te doen van de aanvang, de wijziging en de beëindiging van jeugdzorg waarvoor een ouderbijdrage
      verschuldigd is. Deze mededeling bevat de gegevens die nodig zijn voor de vaststelling van de bijdrage. De
      mededeling wordt gedaan met gebruikmaking van een door Onze Ministers vastgesteld formulier.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel12
  - number: '13.1'
    text: |-
      De stichting legt de wijze waarop het bureau jeugdzorg de in de wet aan haar opgedragen taken uitvoert schriftelijk
      vast. Daarbij wordt in ieder geval aangegeven hoe de werkzaamheden in verband met deze taken zijn afgezonderd
      van de werkzaamheden, bedoeld in [artikel 4, tweede lid, tweede volzin][ref1]. Tevens wordt daarbij geregeld
      op welke wijze wordt gewaarborgd dat persoonsgegevens, waaronder bijzondere persoonsgegevens als bedoeld in
      [artikel 16 van de Wet bescherming persoonsgegevens][ref2], die door het bureau worden verwerkt, slechts worden
      verwerkt voor het doel waarvoor ze zijn verzameld of voor zover het verwerken met dat doel verenigbaar is, alsmede
      hoe daarop wordt toegezien.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0011468#Artikel16
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '4'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0011468
        artikel: '16'
  - number: '13.2'
    text: |-
      De stichting draagt zorg voor een verantwoorde uitvoering door het bureau jeugdzorg van de in deze wet aan de
      stichting opgedragen taken hetgeen in ieder geval een doeltreffende, doelmatige en cliëntgerichte uitvoering
      inhoudt.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel13
  - number: '13.3'
    text: |-
      Tot een verantwoorde uitvoering van de taken, genoemd in [artikel 10, eerste lid, onder a, b, c en d][ref1],
      behoort in ieder geval dat de taken worden uitgevoerd op basis van een voogdijplan, gezinsvoogdijplan of
      jeugdreclasseringsplan dat is afgestemd op de behoeften van de cliënt. Het plan wordt niet vastgesteld dan na
      overleg met de cliënt en, indien er sprake is van pleegzorg, de pleegouders.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel10
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '10'
        hoofdstuk: III
        paragraaf: '2'
  - number: '13.4'
    text: |-
      De stichting organiseert de uitvoering van deze taken op zodanige wijze en voorziet het bureau jeugdzorg
      daartoe zowel kwalitatief als kwantitatief zodanig van personeel en materieel, en draagt zorg voor een zodanige
      verantwoordelijkheidstoedeling, dat een en ander leidt, of redelijkerwijs moet leiden tot een verantwoorde
      uitoefening van deze taken.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel13
  - number: '13.5'
    text: |-
      Het uitvoeren van het vierde lid omvat mede de systematische bewaking, beheersing en verbetering van de kwaliteit
      van de uitvoering van de taken.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel13
  - number: '13.6'
    text: 'Ter uitvoering van het vijfde lid draagt de stichting zorg voor:'
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel13
  - number: 13.6.a
    text: |-
      het op systematische wijze verzamelen en registreren van gegevens betreffende de kwaliteit van de uitvoering van
      de taken;
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel13
  - number: 13.6.b
    text: |-
      het aan de hand van de gegevens, bedoeld onder a, op systematische wijze toetsen in hoeverre de wijze van
      uitvoering van het vierde lid leidt tot een verantwoorde uitvoering van de taken;
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel13
  - number: 13.6.c
    text: |-
      het op basis van de uitkomst van de toetsing, bedoeld onder b, zonodig veranderen van de wijze waarop het vierde
      lid wordt uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel13
  - number: '13.7'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent de deskundigheden waarover de
      stichting moet beschikken en kunnen regels worden gesteld over de deskundigheid waarover bij de stichting
      werkzame personen moeten beschikken om een verantwoorde uitvoering van de taken te kunnen realiseren.
      Bij of krachtens algemene maatregel van bestuur worden tevens regels gesteld omtrent de samenwerking van
      de stichting met de raad voor de kinderbescherming en met een steunpunt huiselijk geweld als bedoeld in
      [artikel 1, eerste lid, van de Wet maatschappelijke ondersteuning][ref1], alsook omtrent de werkwijze van de
      stichting bij de uitoefening van de in de [artikelen 5, eerste lid][ref2], en [10, eerste lid][ref3], genoemde
      taken. Bij of krachtens algemene maatregel van bestuur worden bovendien regels gesteld omtrent de gevallen waarin
      het bekendmaken van de identiteit van de persoon die de kindermishandeling of een vermoeden daarvan heeft gemeld
      of van de persoon van wie informatie in het kader van het onderzoek is verkregen, achterwege kan blijven. Bij of
      krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent de andere onderwerpen, genoemd in het
      vierde lid, en omtrent het eerste lid. Deze regels kunnen voor de verschillende taken verschillend zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0020031#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0016637#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0016637#Artikel10
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0020031
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0016637
        artikel: '5'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0016637
        artikel: '10'
        hoofdstuk: III
        paragraaf: '2'
  - number: '13.8'
    text: |-
      De stichting wijst ten aanzien van een cliënt een contactpersoon aan. De contactpersoon is aanspreekpunt voor
      de cliënt gedurende de gehele periode waarin de stichting een van haar wettelijke taken ten aanzien van de
      cliënt uitoefent. De contactpersoon bevordert de continuïteit in de taakuitvoering van het bureau jeugdzorg
      ten aanzien van de cliënt en is de persoon die de cliënt in voorkomende gevallen jeugdzorg als bedoeld in
      [artikel 10, derde lid, onder b][ref1], verleent. Zo mogelijk wijst de stichting bij de taakuitvoering ten aanzien
      van de cliënt in volgende gevallen dezelfde contactpersoon aan.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel10
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '10'
        hoofdstuk: III
        paragraaf: '2'
  - number: 13a.1
    text: |-
      De stichting vergewist zich ervan dat de wijze waarop de medewerkers van de stichting in het verleden hebben
      gefunctioneerd, niet in de weg staat aan het inzetten van de medewerkers bij de uitvoering van de taken van de
      stichting.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel13a
  - number: 13a.2
    text: |-
      De stichting is in het bezit van een verklaring omtrent het gedrag als bedoeld in
      [artikel 28 van de Wet justitiële en strafvorderlijke gegevens][ref1] voor de medewerkers van de stichting die
      in opdracht van hem beroepsmatig in contact kunnen komen met jeugdigen of ouders, welke verklaring niet eerder dan
      drie maanden voor het tijdstip waarop betrokkene voor de stichting ging werken, is afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel28
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: '28'
  - number: 13a.3
    text: |-
      Indien de stichting of inspectie redelijkerwijs mag vermoeden dat een medewerker niet langer voldoet aan de eisen
      voor het afgeven van een verklaring als bedoeld in het tweede lid, verlangt de stichting of inspectie dat die
      medewerker opnieuw een verklaring als bedoeld in het tweede lid overlegt, die niet ouder is dan drie maanden.
      De desbetreffende medewerker legt de verklaring over binnen een door de stichting of inspectie vast te stellen
      termijn.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel13a
  - number: 13b.1
    text: |-
      De stichting stelt voor de medewerkers van de stichting een meldcode vast waarin stapsgewijs wordt aangegeven hoe
      met signalen van huiselijk geweld of kindermishandeling wordt omgegaan en die er redelijkerwijs aan bijdraagt dat
      zo snel en adequaat mogelijk hulp kan worden geboden.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel13b
  - number: 13b.2
    text: De stichting bevordert de kennis en het gebruik van die meldcode.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel13b
  - number: 13b.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur wordt vastgesteld uit welke elementen een meldcode in ieder geval
      bestaat.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel13b
  - number: '14.1'
    text: |-
      De stichting legt jaarlijks vóór 1 juni een verslag ter openbare inzage, waarin zij verantwoording
      aflegt van het beleid dat zij in het afgelopen kalenderjaar heeft gevoerd ter uitvoering
      van [artikel 13, tweede, vierde en vijfde lid][ref1] en van de regels gesteld krachtens
      [artikel 13, zevende lid][ref2], alsmede van de kwaliteit van de uitvoering van haar taken.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0016637#Artikel13
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '13'
        hoofdstuk: III
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0016637
        artikel: '13'
        hoofdstuk: III
        paragraaf: '3'
  - number: '14.2'
    text: 'In dat verslag geeft zij daartoe onder meer aan:'
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel14
  - number: 14.2.a
    text: op welke wijze zij cliënten bij haar kwaliteitsbeleid heeft betrokken;
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel14
  - number: 14.2.b
    text: |-
      de frequentie waarmee en de wijze waarop binnen de stichting kwaliteitsbeoordeling heeft plaats gevonden en het
      resultaat daarvan;
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel14
  - number: 14.2.c
    text: welk gevolg zij heeft gegeven aan klachten en meldingen over de kwaliteit van de uitvoering van haar taken.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel14
  - number: '14.3'
    text: |-
      De stichting zendt een afschrift van het verslag aan gedeputeerde staten van de betrokken provincie, de raad voor
      de kinderbescherming en aan de inspectie, alsmede aan cliëntenorganisaties en pleegouderorganisaties.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel14
  - number: '15'
    text: |-
      De stichting gaat bij de uitoefening van haar taken uit van de godsdienstige gezindheid, de levensovertuiging en
      culturele achtergrond van de cliënt.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel15
  - number: '16.1'
    text: |-
      Indien gedeputeerde staten van oordeel zijn dat de stichting deze wet of de daarop berustende bepalingen niet of in
      onvoldoende mate of op onjuiste wijze naleeft, kunnen zij de stichting een schriftelijke aanwijzing geven.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel16
  - number: '16.2'
    text: |-
      In de aanwijzing geven gedeputeerde staten met redenen omkleed aan op welke punten deze wet of de daarop berustende
      bepalingen niet of in onvoldoende mate of op onjuiste wijze worden nageleefd, alsmede de in verband daarmee te
      nemen maatregelen.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel16
  - number: '16.3'
    text: Een aanwijzing bevat de termijn waarbinnen de stichting er aan moet voldoen.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel16
  - number: '16.4'
    text: Gedeputeerde staten doen van een aanwijzing mededeling aan de inspectie.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel16
  - number: '16.5'
    text: |-
      Indien het nemen van maatregelen in verband met gevaar voor een ernstige aantasting van de belangen van de cliënten
      redelijkerwijs geen uitstel kan lijden, kan de ingevolge [artikel 47][ref1] met het toezicht belaste ambtenaar een
      schriftelijk bevel geven, waarvan afschrift wordt gezonden aan gedeputeerde staten van de betrokken provincie. Het
      bevel heeft een geldigheidsduur van zeven dagen, welke door gedeputeerde staten kan worden verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel47
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '47'
        hoofdstuk: VIII
  - number: '16.6'
    text: |-
      De stichting is verplicht binnen de daarbij gestelde termijn aan de aanwijzing onderscheidenlijk onmiddellijk aan
      het bevel te voldoen.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel16
  - number: '16.7'
    text: |-
      Gedeputeerde staten zijn bevoegd tot oplegging van een last onder bestuursdwang ter handhaving van de uit een
      krachtens het eerste onderscheidenlijk vijfde lid gegeven aanwijzing, onderscheidenlijk bevel, voortvloeiende
      verplichtingen.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel16
  - number: '18.1'
    text: |-
      Een zorgaanbieder is een in de Europese Economische Ruimte gevestigde rechtspersoon met volledige
      rechtsbevoegdheid, die zich blijkens zijn statuten ten doel stelt het bieden van een of meer vormen van jeugdzorg
      waarop ingevolge deze wet aanspraak bestaat.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel18
  - number: '18.2'
    text: |-
      Een zorgaanbieder kan, in afwijking van het eerste lid, een natuurlijke persoon zijn, voor
      zover het een beroepsbeoefenaar betreft die is ingeschreven in een register als bedoeld in
      [artikel 3 van de Wet op de beroepen in de individuele gezondheidszorg][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel3
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '3'
  - number: '19'
    text: |-
      Een zorgaanbieder bij wie een cliënt zijn aanspraak op jeugdzorg tot gelding kan brengen verleent hem deze zorg
      waarop deze aanspraak heeft, tenzij de zorgaanbieder de cliënt kan aantonen dat het verlenen van die zorg niet
      binnen de grenzen van de aan de zorgaanbieder verleende subsidie mogelijk is.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel19
  - number: '20'
    text: |-
      Een zorgaanbieder en een aanbieder van andere zorg doen aan de stichting die heeft vastgesteld dat een cliënt is
      aangewezen op zorg, mededeling van de aanvang en de beëindiging van de zorg. Zij houden de stichting op de hoogte
      van de voortgang van de zorg, verschaffen de stichting de gegevens die nodig zijn voor de evaluatie van de zorg en
      werken mee aan deze evaluatie.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel20
  - number: '21.1'
    text: |-
      Indien het een zorgaanbieder bekend is geworden dat een persoon die bij hem werkzaam is of dat een pleegouder zich
      mogelijk schuldig maakt of heeft gemaakt aan kindermishandeling, doet die zorgaanbieder hiervan onverwijld melding
      aan de stichting in verband met de uitoefening van de taak, bedoeld in [artikel 10, eerste lid, onder e][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel10
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '10'
        hoofdstuk: III
        paragraaf: '2'
  - number: '21.2'
    text: |-
      Indien een persoon die werkzaam is bij een zorgaanbieder bekend is geworden dat een bij die zorgaanbieder werkzame
      andere persoon of een door die zorgaanbieder gecontracteerde pleegouder zich mogelijk schuldig maakt of heeft
      gemaakt aan kindermishandeling, stelt hij die zorgaanbieder daarvan onverwijld in kennis.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel21
  - number: '22'
    text: |-
      De [artikelen 16][ref1] en [17][ref2] zijn van overeenkomstige toepassing ten aanzien van de naleving van deze wet
      en de daarop berustende bepalingen door een zorgaanbieder.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0016637#Artikel17
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '16'
        hoofdstuk: III
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0016637
        artikel: '17'
        hoofdstuk: III
        paragraaf: '3'
  - number: '24.1'
    text: |-
      Een zorgaanbieder, niet zijnde een alleen werkende zorgaanbieder als bedoeld in [artikel 18, tweede lid][ref1],
      verleent verantwoorde zorg. Onder verantwoorde zorg wordt verstaan: zorg van goed niveau, die in ieder geval
      doeltreffend, doelmatig en cliëntgericht wordt verleend en die is afgestemd op de reële behoefte van de cliënt.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel18
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '18'
        hoofdstuk: IV
        paragraaf: '1'
  - number: '24.2'
    text: |-
      Tot verantwoorde zorg behoort in ieder geval dat de zorg die wordt verleend, is gebaseerd op een hulpverleningsplan
      dat is afgeleid van het besluit, bedoeld in [artikel 6, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel6
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '6'
        hoofdstuk: III
        paragraaf: '2'
  - number: '24.3'
    text: |-
      Een zorgaanbieder en een aanbieder van andere zorg plegen, in verband met het tweede lid, overleg met de stichting
      omtrent de inhoud van het hulpverleningsplan. Indien aan een cliënt door meer dan één zorgaanbieder of aanbieder
      van andere zorg zorg wordt geboden, werken zij zodanig samen dat aan de cliënt samenhangende zorg wordt geboden en
      plegen zij gezamenlijk over het hulpverleningsplan overleg met de stichting. Tijdens het overleg wordt vastgesteld
      welke zorgaanbieder of aanbieder van andere zorg belast is met de coördinatie van de totstandkoming van het
      hulpverleningsplan en de uitvoering daarvan. In het hulpverleningsplan wordt opgenomen welke aanbieder belast is
      met de coördinatie van de zorg.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel24
  - number: '24.4'
    text: |-
      Voor zover het betreft cliënten ten aanzien van wie de stichting een van de taken, bedoeld in
      [artikel 10, eerste lid, onder a, b, c of d][ref1], uitoefent, is het overleg er tevens op gericht het
      hulpverleningsplan en het plan, bedoeld in [artikel 13, derde lid][ref2], op elkaar te doen aansluiten.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0016637#Artikel13
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '10'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0016637
        artikel: '13'
        hoofdstuk: III
        paragraaf: '3'
  - number: '24.5'
    text: |-
      Het hulpverleningsplan wordt niet dan na overleg met de cliënt vastgesteld. Het behoeft diens instemming, tenzij
      het zorg betreft waartoe een maatregel van kinderbescherming verplicht, of onderdelen van het hulpverleningsplan
      als bedoeld in de [artikelen 29o tot en met 29r][ref1] en [29ta][ref2]. Een zorgaanbieder die pleegzorg biedt,
      pleegt over het hulpverleningsplan tevens overleg met de betrokken pleegouder. Het behoeft diens instemming,
      voor zover het betreft de omschrijving daarin van zijn rol in het hulpverleningsproces en van de wijze waarop de
      begeleiding door de zorgaanbieder die pleegzorg biedt wordt vorm gegeven. Het hulpverleningsplan wordt vastgesteld
      vóór de aanvang van de zorg, doch uiterlijk binnen zes weken na de dag waarop is komen vast te staan welke
      aanbieder of zorgaanbieders de zorg waarop de cliënt is aangewezen, zal verlenen.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel29o
      [ref2]: https://wetten.overheid.nl/BWBR0016637#Artikel29ta
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: 29o
        hoofdstuk: IVb
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0016637
        artikel: 29ta
        hoofdstuk: IVb
        paragraaf: '3'
  - number: '24.6'
    text: |-
      Indien de cliënt minderjarig is, is in plaats van diens instemming, de instemming van zijn wettelijke
      vertegenwoordiger vereist, indien hij:
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel24
  - number: 24.6.a
    text: jonger is dan twaalf jaren, of
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel24
  - number: 24.6.b
    text: |-
      de leeftijd van twaalf jaren heeft bereikt en niet in staat kan worden geacht tot een redelijke waardering van zijn
      belangen terzake, danwel
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel24
  - number: 24.6.c
    text: |-
      ouder is dan twaalf jaren, maar nog niet de leeftijd van zestien jaren heeft bereikt, en de stichting een besluit
      heeft genomen met toepassing van [artikel 7, vijfde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel7
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '7'
        hoofdstuk: III
        paragraaf: '2'
  - number: '24.7'
    text: |-
      Indien de cliënt minderjarig is en de leeftijd van twaalf maar nog niet die van zestien jaren heeft bereikt, is
      tevens de instemming van de wettelijke vertegenwoordiger vereist tenzij de stichting een besluit heeft genomen met
      toepassing van [artikel 7, vierde lid, tweede volzin][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel7
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '7'
        hoofdstuk: III
        paragraaf: '2'
  - number: '25.1'
    text: |-
      De zorgaanbieder organiseert de zorgverlening op zodanige wijze, voorziet de zorgeenheid zowel kwalitatief als
      kwantitatief zodanig van personeel en materieel, en draagt zorg voor een zodanige verantwoordelijkheidstoedeling,
      dat een en ander leidt of redelijkerwijs moet leiden tot een verantwoorde zorg.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel25
  - number: '25.2'
    text: |-
      De zorgaanbieder vergewist zich ervan dat de wijze waarop zorgverleners die zorg verlenen aan zijn cliënten in
      het verleden hebben gefunctioneerd, niet in de weg staat aan het inzetten van de zorgverleners bij het verlenen
      van zorg.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel25
  - number: '25.3'
    text: |-
      De zorgaanbieder is in het bezit van een verklaring omtrent het gedrag als bedoeld in
      [artikel 28 van de Wet justitiële en strafvorderlijke gegevens][ref1] voor de personen die hij jeugdzorg waarop
      ingevolge deze wet aanspraak bestaat doet verlenen en voor andere personen die in opdracht van de zorgaanbieder
      beroepsmatig in contact kunnen komen met zijn cliënten, welke verklaring niet eerder dan drie maanden voor het
      tijdstip waarop betrokkene voor de zorgaanbieder ging werken, is afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel28
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: '28'
  - number: '25.4'
    text: |-
      Indien de zorgaanbieder of de inspectie redelijkerwijs mag vermoeden dat een persoon niet langer voldoet aan de
      eisen voor het afgeven van een verklaring als bedoeld in het derde lid, verlangt de zorgaanbieder of de inspectie
      dat die persoon opnieuw een verklaring als bedoeld in het derde lid overlegt, die niet ouder is dan drie maanden.
      De desbetreffende persoon legt de verklaring over binnen een door de zorgaanbieder of de inspectie vast te stellen
      termijn.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel25
  - number: '25.5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent de opleidingseisen te stellen
      aan het personeel werkzaam bij de zorgaanbieder.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel25
  - number: '25.6'
    text: |-
      Voor zover het betreft een zorgaanbieder die jeugdzorg biedt die verblijf van cliënten gedurende ten minste een
      etmaal met zich meebrengt, draagt de zorgaanbieder er tevens zorg voor dat in de zorgeenheid geestelijke verzorging
      beschikbaar is, die zoveel mogelijk aansluit bij de godsdienst of levensovertuiging van de cliënten.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel25
  - number: 25a.1
    text: |-
      De zorgaanbieder stelt voor zijn medewerkers een meldcode vast waarin stapsgewijs wordt aangegeven hoe met signalen
      van huiselijk geweld of kindermishandeling wordt omgegaan en die er redelijkerwijs aan bijdraagt dat zo snel en
      adequaat mogelijk hulp kan worden geboden.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel25a
  - number: 25a.2
    text: De zorgaanbieder bevordert de kennis en het gebruik van die meldcode.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel25a
  - number: 25a.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur wordt vastgesteld uit welke elementen een meldcode in ieder geval
      bestaat.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel25a
  - number: '26.1'
    text: |-
      Het uitvoeren van [artikel 25][ref1] omvat mede de systematische bewaking, beheersing en verbetering van de
      kwaliteit van de zorg.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel25
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '25'
        hoofdstuk: IV
        paragraaf: '2'
  - number: '26.2'
    text: |-
      Ter uitvoering van het eerste lid draagt de zorgaanbieder, afgestemd op de aard en omvang van de zorgeenheid, zorg
      voor:
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel26
  - number: 26.2.a
    text: het op systematische wijze verzamelen en registreren van gegevens betreffende de kwaliteit van de zorg;
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel26
  - number: 26.2.b
    text: |-
      het aan de hand van de gegevens, bedoeld onder a, op systematische wijze toetsen in hoeverre de wijze van
      uitvoering van [artikel 25][ref1] leidt tot een verantwoorde zorgverlening;


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel25
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '25'
        hoofdstuk: IV
        paragraaf: '2'
  - number: 26.2.c
    text: |-
      het op basis van de uitkomst van de toetsing, bedoeld onder b, zonodig veranderen van de wijze waarop
      [artikel 25][ref1] wordt uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel25
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '25'
        hoofdstuk: IV
        paragraaf: '2'
  - number: '26.3'
    text: |-
      Onder de kwaliteit van de zorg, bedoeld in het eerste lid, wordt mede verstaan de begeleiding door de zorgaanbieder
      die pleegzorg biedt van een pleegouder tijdens de plaatsing van een jeugdige in diens gezin.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel26
  - number: '27.1'
    text: |-
      De zorgaanbieder legt jaarlijks vóór 1 juni per zorgeenheid een verslag ter openbare inzage, waarin hij
      verantwoording aflegt van het beleid dat hij in het afgelopen kalenderjaar heeft gevoerd ter uitvoering van de
      [artikelen 24 tot en met 26][ref1] en van de kwaliteit van de zorg die hij in dat jaar heeft verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel24
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '24'
        hoofdstuk: IV
        paragraaf: '2'
  - number: '27.2'
    text: 'In dat verslag geeft de zorgaanbieder daartoe onder meer aan:'
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel27
  - number: 27.2.a
    text: op welke wijze hij cliënten bij zijn kwaliteitsbeleid heeft betrokken;
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel27
  - number: 27.2.b
    text: |-
      de frequentie waarmee en de wijze waarop binnen de zorgeenheid kwaliteitsbeoordeling heeft plaats gevonden en het
      resultaat daarvan;
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel27
  - number: 27.2.c
    text: welk gevolg hij heeft gegeven aan klachten en meldingen over de kwaliteit van de verleende zorg;
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel27
  - number: 27.2.d
    text: |-
      het aantal malen dat hij een beslissing heeft genomen tot toepassing van de [artikelen 29o, derde lid][ref1],
      [29p, tweede lid][ref2], [29q, derde lid][ref3], [29r, derde lid][ref4], en [29t][ref5], onder vermelding van de
      duur daarvan, alsmede een overzicht van de omstandigheden die daartoe aanleiding gaven, alsmede het aantal klachten
      dat op grond van [artikel 29w][ref6] is ingediend en de aard van de beslissingen die op de klachten zijn genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel29o
      [ref2]: https://wetten.overheid.nl/BWBR0016637#Artikel29p
      [ref3]: https://wetten.overheid.nl/BWBR0016637#Artikel29q
      [ref4]: https://wetten.overheid.nl/BWBR0016637#Artikel29r
      [ref5]: https://wetten.overheid.nl/BWBR0016637#Artikel29t
      [ref6]: https://wetten.overheid.nl/BWBR0016637#Artikel29w
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: 29o
        hoofdstuk: IVb
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0016637
        artikel: 29p
        hoofdstuk: IVb
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0016637
        artikel: 29q
        hoofdstuk: IVb
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0016637
        artikel: 29r
        hoofdstuk: IVb
        paragraaf: '3'
      - id: ref5
        bwb_id: BWBR0016637
        artikel: 29t
        hoofdstuk: IVb
        paragraaf: '3'
      - id: ref6
        bwb_id: BWBR0016637
        artikel: 29w
        hoofdstuk: IVb
        paragraaf: '5'
  - number: '27.3'
    text: |-
      De zorgaanbieder zendt een afschrift van het verslag aan gedeputeerde staten van de betrokken provincie en aan de
      inspectie, alsmede aan cliëntenorganisaties en pleegouderorganisaties.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel27
  - number: '28.1'
    text: |-
      Bij algemene maatregel van bestuur kunnen, indien het niveau van de zorg, verleend in een bij de maatregel
      aangewezen categorie van zorgaanbod, dit vereist, regels worden gesteld met betrekking tot de uitvoering van de
      [artikelen 25][ref1] en [26][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0016637#Artikel26
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '25'
        hoofdstuk: IV
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0016637
        artikel: '26'
        hoofdstuk: IV
        paragraaf: '2'
  - number: '28.2'
    text: |-
      Indien uitvoering van de [artikelen 25][ref1] en [26][ref2] overeenkomstig de op grond van het eerste lid gestelde
      regels niet blijkt te leiden tot verantwoorde zorg, kunnen bij algemene maatregel van bestuur tevens nadere regels
      worden gesteld met betrekking tot [artikel 24][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0016637#Artikel26
      [ref3]: https://wetten.overheid.nl/BWBR0016637#Artikel24
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '25'
        hoofdstuk: IV
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0016637
        artikel: '26'
        hoofdstuk: IV
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0016637
        artikel: '24'
        hoofdstuk: IV
        paragraaf: '2'
  - number: 28a.1
    text: 'De pleegouder voldoet aan de volgende voorwaarden:'
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel28a
  - number: 28a.1.a
    text: de pleegouder heeft ten minste de leeftijd van eenentwintig jaren bereikt;
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel28a
  - number: 28a.1.b
    text: |-
      de pleegouder is niet tevens degene, die door de desbetreffende zorgaanbieder die pleegzorg biedt, is belast met de
      begeleiding van een pleegouder;
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel28a
  - number: 28a.1.c
    text: |-
      de pleegouder beschikt over een verklaring van geen bezwaar die voor de aanvang van de opvoeding en verzorging
      van een jeugdige is afgegeven door de raad voor de kinderbescherming, waaruit blijkt dat er geen sprake is van
      bezwarende feiten en omstandigheden voor het verzorgen en opvoeden van een pleegkind. De verklaring is vereist
      voorafgaand aan de plaatsing van een eerste jeugdige, bij de komst van nieuwe inwonenden en indien de pleegouder
      gedurende twee jaren geen pleegouder is geweest. Deze voorwaarde geldt tevens voor alle personen van 12 jaar en
      ouder die als inwonenden op het adres van de pleegouder staan ingeschreven;
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel28a
  - number: 28a.1.d
    text: |-
      de pleegouder heeft met goed gevolg een door de zorgaanbieder die pleegzorg biedt aangeboden voorbereidings- en
      selectietraject afgerond.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel28a
  - number: 28a.2
    text: De zorgaanbieder die pleegzorg biedt stelt vast of aan de voorwaarden, genoemd in het eerste lid, is voldaan.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel28a
  - number: 28a.3
    text: |-
      Voorafgaand aan de plaatsing van een jeugdige in het gezin van de pleegouder beoordeelt de zorgaanbieder die
      pleegzorg biedt of de jeugdige in het gezin van de pleegouder kan worden geplaatst, gelet op de leeftijd en de
      problemen van de jeugdige, de samenstelling van het gezin van de pleegouder en de verwachte duur van de plaatsing
      van de jeugdige in het gezin van de pleegouder.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel28a
  - number: 28a.4
    text: |-
      Degene die een jeugdige reeds verzorgt en opvoedt op het moment dat bij een zorgaanbieder die pleegzorg biedt de
      aanspraak van die jeugdige op verblijf bij een pleegouder tot gelding wordt gebracht, kan in afwijking van het
      eerste lid, onder c, en het derde lid, aan de in die artikelonderdelen bedoelde voorwaarden voldoen binnen dertien
      weken nadat de aanspraak tot gelding wordt gebracht, mits de betrokken zorgaanbieder heeft vastgesteld dat de
      verzorging en opvoeding van de jeugdige door diegene niet schadelijk is voor de ontwikkeling van de jeugdige.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel28a
  - number: 28b.1
    text: |-
      Een zorgaanbieder die pleegzorg biedt en een pleegouder sluiten een pleegcontract voor de verzorging en opvoeding
      van een jeugdige.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel28b
  - number: 28b.2
    text: |-
      Het contract bevat in ieder geval afspraken omtrent de wijze waarop de verzorging en opvoeding van een jeugdige
      door de pleegouder wordt uitgevoerd en de begeleiding die de pleegouder daarbij van de zorgaanbieder die pleegzorg
      biedt ontvangt.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel28b
  - number: 28b.3
    text: |-
      Bij regeling van Onze Minister van Volksgezondheid, Welzijn en Sport kunnen regels worden gesteld ten aanzien van
      het pleegcontract.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel28b
  - number: 28c.1
    text: |-
      Een zorgaanbieder die pleegzorg biedt, verstrekt aan een pleegouder waarmee hij een pleegcontract heeft gesloten
      een subsidie voor de verzorging en opvoeding van de in het gezin van de pleegouder geplaatste jeugdige, bestaande
      uit een door Onze Ministers vast te stellen basisbedrag, dat voor te onderscheiden leeftijdscategorieën van
      pleegkinderen verschillend kan zijn.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel28c
  - number: 28c.2
    text: |-
      Onze Ministers stellen regels omtrent op het basisbedrag te verlenen toeslagen of op het basisbedrag toe te passen
      kortingen.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel28c
  - number: 28c.3
    text: 'De regels, bedoeld in het tweede lid, hebben betrekking op:'
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel28c
  - number: 28c.3.a
    text: |-
      het basisbedrag en het bedrag van de toeslagen en kortingen en de omstandigheden waaronder deze worden verleend
      of toegepast;
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel28c
  - number: 28c.3.b
    text: de dagen waarover het basisbedrag en de toeslagen worden verleend en de kortingen worden toegepast.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel28c
  - number: 28d.1
    text: |-
      De stichting en de zorgaanbieder die pleegzorg biedt, verstrekken aan de pleegouder in het belang van
      de verzorging en de opvoeding van de jeugdige, zo nodig zonder toestemming en zo mogelijk voorafgaand
      aan de plaatsing, inlichtingen inzake feiten en omstandigheden die de persoon van een jeugdige of
      diens verzorging of opvoeding betreffen en die noodzakelijk zijn voor de uitoefening van de taak van de
      pleegouder. Deze inlichtingen kunnen mede omvatten persoonsgegevens betreffende de gezondheid als bedoeld in
      [artikel 21 van de Wet bescherming persoonsgegevens][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel21
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel28d
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '21'
  - number: 28d.2
    text: |-
      Bij regeling van Onze Minister van Volksgezondheid, Welzijn en Sport kunnen regels worden gesteld met betrekking
      tot de uitvoering van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel28d
  - number: 29a.1
    text: |-
      Dit hoofdstuk is van toepassing op minderjarige jeugdigen alsmede op jeugdigen die de leeftijd van 21
      jaar nog niet hebben bereikt, ten aanzien van wie op het tijdstip waarop zij meerderjarig werden, een
      machtiging gold. Laatstbedoelde jeugdigen worden voor de toepassing van dit hoofdstuk, in afwijking van
      [artikel 233 van Boek 1 van het Burgerlijk Wetboek][ref1], als minderjarigen behandeld.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel233
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel29a
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '233'
  - number: 29a.2
    text: |-
      In zaken betrekking hebbende op de toepassing van dit hoofdstuk is een minderjarige die de leeftijd van twaalf
      jaren heeft bereikt, bekwaam in rechte op te treden. Hetzelfde geldt indien de minderjarige de leeftijd van twaalf
      jaren nog niet heeft bereikt, maar in staat kan worden geacht tot een redelijke waardering van zijn belangen ter
      zake.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel29a
  - number: 29b.1
    text: |-
      De kinderrechter kan op verzoek een machtiging verlenen om een jeugdige in een accommodatie, het daarbij behorende
      terrein daaronder begrepen, te doen opnemen en te doen verblijven, ongeacht of hij daarmee instemt.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel29b
  - number: 29b.2
    text: |-
      Een machtiging voor een jeugdige die de leeftijd van 18 jaar nog niet heeft bereikt, kan slechts worden verleend
      indien:
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel29b
  - number: 29b.2.a
    text: de jeugdige onder toezicht is gesteld,
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel29b
  - number: 29b.2.b
    text: de voogdij over de jeugdige berust bij een stichting, of
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel29b
  - number: 29b.2.c
    text: degene die, anders dan bedoeld onder b, het gezag over hem uitoefent, met de opneming en het verblijf instemt.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel29b
  - number: 29b.3
    text: |-
      Een machtiging kan bovendien slechts worden verleend indien naar het oordeel van de kinderrechter de jeugdige
      ernstige opgroei- of opvoedingsproblemen heeft die zijn ontwikkeling naar volwassenheid ernstig belemmeren en die
      maken dat de opneming en het verblijf noodzakelijk zijn om te voorkomen dat de jeugdige zich aan de zorg die hij
      nodig heeft zal onttrekken of daaraan door anderen zal worden onttrokken.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel29b
  - number: 29b.4
    text: |-
      Een machtiging kan voorts slechts worden verleend indien de betrokken stichting een besluit als bedoeld in
      [artikel 6, eerste lid][ref1], heeft genomen, dat strekt tot verblijf niet zijnde verblijf bij een pleegouder, en
      heeft verklaard dat zich een geval als bedoeld in het derde lid, voordoet.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel6
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel29b
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '6'
        hoofdstuk: III
        paragraaf: '2'
  - number: 29b.5
    text: |-
      De verklaring, bedoeld in het vierde lid, behoeft de instemming van een gedragswetenschapper behorende tot een bij
      regeling van Onze Ministers aangewezen categorie, die de jeugdige met het oog daarop kort tevoren heeft onderzocht.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel29b
  - number: 29b.6
    text: |-
      In afwijking van het vierde lid kan de kinderrechter, ten aanzien van een jeugdige die onder toezicht is gesteld
      of ten aanzien van wie tevens een ondertoezichtstelling wordt verzocht, dan wel ten aanzien van wie de stichting
      de voogdij uitoefent, een machtiging verlenen indien de stichting niet een besluit als bedoeld in het vierde
      lid, heeft genomen, doch slechts indien de raad heeft verklaard dat een geval als bedoeld in het derde lid, zich
      voordoet. Het vijfde lid is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel29b
  - number: 29b.7
    text: |-
      Indien de machtiging betrekking heeft op een minderjarige die onder toezicht is gesteld, geldt de machtiging als
      een machtiging als bedoeld in [artikel 261 van Boek 1 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel261
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel29b
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '261'
  - number: 29b.8
    text: |-
      Indien degene die het gezag heeft over een jeugdige die met een machtiging in een accommodatie verblijft, zijn
      instemming intrekt, kan die jeugdige gedurende ten hoogste veertien dagen in de accommodatie verblijven, ongeacht
      of hij daarmee instemt, en zijn de [paragrafen 3][ref1], [4][ref2] en [5][ref3] op hem van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#HoofdstukIVb
      [ref2]: https://wetten.overheid.nl/BWBR0016637#HoofdstukIVb
      [ref3]: https://wetten.overheid.nl/BWBR0016637#HoofdstukIVb
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel29b
    references:
      - id: ref1
        bwb_id: BWBR0016637
        hoofdstuk: IVb
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0016637
        hoofdstuk: IVb
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0016637
        hoofdstuk: IVb
        paragraaf: '5'
  - number: 29b.9
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld ter uitwerking van het criterium, als
      bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel29b
  - number: 29c.1
    text: |-
      De kinderrechter kan, indien een machtiging niet kan worden afgewacht, op verzoek een voorlopige machtiging
      verlenen om een jeugdige, met inachtneming van [artikel 29b, tweede lid][ref1], in een accommodatie te doen opnemen
      en te doen verblijven, ongeacht of hij daarmee instemt.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel29b
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel29c
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: 29b
        hoofdstuk: IVb
        paragraaf: '1'
  - number: 29c.2
    text: |-
      Een voorlopige machtiging, kan slechts worden verleend indien naar het oordeel van de kinderrechter onmiddellijke
      verlening van jeugdzorg noodzakelijk is in verband met ernstige opgroei- of opvoedingsproblemen van de jeugdige
      die zijn ontwikkeling naar volwassenheid ernstig belemmeren of een ernstig vermoeden daarvan, en die maken dat de
      opneming en het verblijf noodzakelijk zijn om te voorkomen dat de jeugdige zich aan de zorg die hij nodig heeft zal
      onttrekken of daaraan door anderen zal worden onttrokken.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel29c
  - number: 29c.3
    text: |-
      Een voorlopige machtiging kan slechts worden verleend indien de betrokken stichting heeft verklaard dat zich een
      geval als bedoeld in het tweede lid, voordoet.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel29c
  - number: 29c.4
    text: |-
      De verklaring, bedoeld in het derde lid, behoeft de instemming van een gedragswetenschapper behorende tot een bij
      regeling van Onze Ministers aangewezen categorie, die de jeugdige met het oog daarop kort tevoren heeft onderzocht,
      tenzij onderzoek feitelijk onmogelijk is.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel29c
  - number: 29c.5
    text: |-
      [Artikel 29b, zesde tot en met negende lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel29b
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel29c
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: 29b
        hoofdstuk: IVb
        paragraaf: '1'
  - number: 29d.1
    text: |-
      Een verzoek, gericht op het verkrijgen van een machtiging of een voorlopige machtiging, wordt ingediend door de
      stichting van de provincie waar de jeugdige duurzaam verblijft. Indien het verzoek betrekking heeft op een jeugdige
      die onder toezicht is gesteld, of ten aanzien van wie tevens een ondertoezichtstelling wordt verzocht, dan wel ten
      aanzien van wie de stichting de voogdij uitoefent, wordt het verzoek ingediend door de stichting van de provincie
      waar de jeugdige zijn woonplaats heeft of door de raad voor de kinderbescherming.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel29d
  - number: 29d.2
    text: |-
      Op verzoeken als bedoeld in het eerste lid, is
      [artikel 265, eerste, derde en vierde lid, van Boek 1 van het Burgerlijk Wetboek][ref1], alsmede de eerste
      afdeling van de [zesde titel van Boek 3 van het Wetboek van Burgerlijke Rechtsvordering][ref2], van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel265
      [ref2]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel29d
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '265'
      - id: ref2
        bwb_id: BWBR0001827
  - number: 29e.1
    text: |-
      De stichting dan wel de raad voor de kinderbescherming legt bij een verzoek als bedoeld in
      [artikel 29d, eerste lid][ref1], een afschrift van het besluit, alsmede van de verklaring, bedoeld in
      [artikel 29b, vierde lid][ref2], over.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel29d
      [ref2]: https://wetten.overheid.nl/BWBR0016637#Artikel29b
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel29e
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: 29d
        hoofdstuk: IVb
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0016637
        artikel: 29b
        hoofdstuk: IVb
        paragraaf: '1'
  - number: 29e.2
    text: |-
      In een geval als bedoeld in [artikel 29b, zesde lid][ref1], legt de raad voor de kinderbescherming bij een verzoek
      als bedoeld in [artikel 29d, eerste lid][ref2], de verklaring, bedoeld in [artikel 29b, zesde lid][ref3], over.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel29b
      [ref2]: https://wetten.overheid.nl/BWBR0016637#Artikel29d
      [ref3]: https://wetten.overheid.nl/BWBR0016637#Artikel29b
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel29e
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: 29b
        hoofdstuk: IVb
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0016637
        artikel: 29d
        hoofdstuk: IVb
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0016637
        artikel: 29b
        hoofdstuk: IVb
        paragraaf: '1'
  - number: 29e.3
    text: |-
      In de gevallen, bedoeld in [artikel 29c][ref1], wordt in afwijking van het eerste en tweede lid, een verklaring van
      de stichting of de raad voor de kinderbescherming overgelegd dat naar haar onderscheidenlijk zijn oordeel een geval
      als bedoeld in [artikel 29c, tweede lid][ref2], zich voordoet.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel29c
      [ref2]: https://wetten.overheid.nl/BWBR0016637#Artikel29c
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel29e
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: 29c
        hoofdstuk: IVb
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0016637
        artikel: 29c
        hoofdstuk: IVb
        paragraaf: '1'
  - number: 29f.1
    text: |-
      Alvorens op een verzoek tot het verlenen van een machtiging of voorlopige machtiging te beslissen, hoort de
      kinderrechter de jeugdige, degene die het gezag over de minderjarige uitoefent en degene die de jeugdige als
      behorende tot zijn gezin verzorgt en opvoedt, tenzij de kinderrechter vaststelt dat een persoon niet bereid is zich
      te doen horen, alsmede de verzoekende stichting en de raad voor de kinderbescherming indien deze de verzoeker is.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel29f
  - number: 29f.2
    text: |-
      De rechter geeft het bestuur van de raad voor rechtsbijstand ambtshalve last tot toevoeging van een raadsman aan
      de jeugdige.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel29f
  - number: 29fa.1
    text: |-
      Ten aanzien van een jeugdige voor wie een machtiging is afgegeven en die in verband met deze machtiging aanwezig
      is in het gerechtsgebouw, kunnen, om te voorkomen dat de jeugdige zich onttrekt aan de tenuitvoerlegging van de
      machtiging, tegen de wil van de jeugdige of van degene die het gezag over hem uitoefent, voor de duur van zijn
      aanwezigheid aldaar de volgende maatregelen worden genomen:
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel29fa
  - number: 29fa.1.a
    text: vastpakken en vasthouden;
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel29fa
  - number: 29fa.1.b
    text: onderzoek aan kleding;
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel29fa
  - number: 29fa.1.c
    text: tijdelijke plaatsing in een geschikte, afzonderlijke en af te sluiten ruimte.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel29fa
  - number: 29fa.2
    text: |-
      De maatregelen, bedoeld in het eerste lid, worden uitsluitend ten uitvoer gelegd door ambtenaren aangewezen voor de
      uitvoering van de politietaak, bedoeld in [artikel 3 van de Politiewet 2012][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel3
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel29fa
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '3'
  - number: 29g
    text: |-
      De griffier zendt, onverminderd [artikel 805 van het Wetboek van Burgerlijke Rechtsvordering][ref1], een afschrift
      van de beschikking inzake de machtiging aan:


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel805
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel29g
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '805'
  - number: 29g.a
    text: de jeugdige indien deze de leeftijd van 12 jaar heeft bereikt,
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel29g
  - number: 29g.b
    text: degene die het gezag over de jeugdige heeft,
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel29g
  - number: 29g.c
    text: degene die de jeugdige als behorende tot zijn gezin verzorgt en opvoedt,
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel29g
  - number: 29g.d
    text: de stichting die het verzoek heeft gedaan, en
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel29g
  - number: 29g.e
    text: de raad voor de kinderbescherming.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel29g
  - number: 29h.1
    text: De beschikking van de rechter is bij voorraad uitvoerbaar.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel29h
  - number: 29h.2
    text: Bij opneming van de jeugdige in een accommodatie wordt de machtiging overgelegd.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel29h
  - number: 29h.3
    text: De kinderrechter bepaalt de geldigheidsduur van de machtiging op ten hoogste één jaar.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel29h
  - number: 29h.4
    text: |-
      De machtiging vervalt indien de aanspraak is vervallen omdat de stichting toepassing heeft gegeven aan
      [artikel 6a, eerste lid, onder c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel6a
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel29h
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: 6a
        hoofdstuk: III
        paragraaf: '2'
  - number: 29h.5
    text: |-
      De voorlopige machtiging geldt tot het tijdstip waarop een beslissing op een verzoek om een machtiging is genomen,
      doch ten hoogste vier weken.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel29h
  - number: 29h.6
    text: |-
      De tenuitvoerlegging van de machtiging kan door de zorgaanbieder worden geschorst, indien de tenuitvoerlegging
      naar het oordeel van de zorgaanbieder niet langer nodig is om te voorkomen dat de jeugdige zich aan de zorg die
      hij nodig heeft zal onttrekken of daaraan door anderen wordt onttrokken. De schorsing kan worden ingetrokken indien
      blijkt dat de tenuitvoerlegging nodig is om te voorkomen dat de jeugdige zich aan de zorg die hij nodig heeft zal
      onttrekken of daaraan door anderen wordt onttrokken.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel29h
  - number: 29h.7
    text: |-
      De betrokken stichting doet aan de raad voor de kinderbescherming mededeling van het vervallen van de machtiging
      op grond van het vierde lid, alsmede van het besluit geen nieuwe machtiging aan te vragen na afloop van de
      geldigheidsduur van een machtiging. De zorgaanbieder doet aan de stichting en de raad voor de kinderbescherming
      mededeling van een besluit tot schorsing en intrekking, als bedoeld in het zesde lid.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel29h
  - number: 29i
    text: |-
      De zorgaanbieder in wiens accommodatie de machtiging ten uitvoer wordt gelegd, doet van de opneming zo spoedig
      mogelijk mededeling aan degene die het gezag over de jeugdige uitoefent, aan de betrokken stichting en, indien de
      stichting niet de verzoeker was, aan degene die het verzoek tot het verlenen van de machtiging heeft ingediend.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel29i
  - number: 29j
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot het verzoekschrift, bedoeld in
      [artikel 29d][ref1], en de verklaring, bedoeld in [artikel 29e][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel29d
      [ref2]: https://wetten.overheid.nl/BWBR0016637#Artikel29e
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel29j
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: 29d
        hoofdstuk: IVb
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0016637
        artikel: 29e
        hoofdstuk: IVb
        paragraaf: '1'
  - number: 29k.1
    text: |-
      Een machtiging kan slechts worden ten uitvoer gelegd in een door Onze Ministers daartoe aangewezen accommodatie van
      een zorgaanbieder. De aanwijzing geschiedt niet dan na overleg met de provincie waarin de accommodatie is gelegen.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel29k
  - number: 29k.2
    text: |-
      De rechter kan, indien het een jeugdige betreft van 12 jaar of ouder, op verzoek van de betrokken
      stichting of de raad voor de kinderbescherming, in zijn beschikking inzake de machtiging bepalen
      dat deze in afwijking van het eerste lid, ten uitvoer wordt gelegd in een inrichting als bedoeld in
      [artikel 1, onder b van de Beginselenwet justitiële jeugdinrichtingen][ref1]. De eerste volzin wordt
      slechts toegepast met betrekking tot een jeugdige die op het tijdstip waarop een machtiging wordt verleend
      op basis van een veroordeling is opgenomen in een inrichting. Toepassing geschiedt slechts met instemming
      van de jeugdige of indien deze de leeftijd van zestien jaar nog niet heeft bereikt, met instemming van
      de jeugdige en degene die het gezag over hem heeft. De tenuitvoerlegging in een inrichting geschiedt
      slechts voor de termijn die nodig is om een behandeling of opleiding af te ronden. Op de tenuitvoerlegging
      is de [Beginselenwet justitiële jeugdinrichtingen][ref2] van toepassing. Een besluit als bedoeld in
      [artikel 29b, vierde lid][ref3], geeft alsdan, in afwijking van [artikel 3][ref4], aanspraak op verblijf als
      bedoeld in [artikel 14 van de Beginselenwet justitiële jeugdinrichtingen][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0011756
      [ref3]: https://wetten.overheid.nl/BWBR0016637#Artikel29b
      [ref4]: https://wetten.overheid.nl/BWBR0016637#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0011756#Artikel14
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel29k
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0011756
      - id: ref3
        bwb_id: BWBR0016637
        artikel: 29b
        hoofdstuk: IVb
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0016637
        artikel: '3'
        hoofdstuk: II
      - id: ref5
        bwb_id: BWBR0011756
        artikel: '14'
  - number: 29l.1
    text: |-
      Aangewezen kunnen worden accommodaties die geschikt zijn voor verblijf van jeugdigen die met een machtiging zijn
      opgenomen.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel29l
  - number: 29l.2
    text: |-
      De geschiktheid heeft betrekking op de voorzieningen die nodig zijn om de veiligheid binnen de accommodatie, de
      maatschappelijke veiligheid daarbuiten te waarborgen alsmede de opvoedkundige doeleinden van de zorg te realiseren.
      Bij regeling van Onze Ministers kunnen hieromtrent nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel29l
  - number: 29l.3
    text: |-
      Een aanwijzing kan worden ingetrokken indien de accommodatie niet langer geschikt is voor verblijf van jeugdigen
      die met een machtiging zijn opgenomen of indien de accommodatie niet meer nodig is voor de tenuitvoerlegging van
      machtigingen. [Artikel 29k, eerste lid, tweede volzin][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel29k
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel29l
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: 29k
        hoofdstuk: IVb
        paragraaf: '2'
  - number: 29l.4
    text: Een aanwijzing of intrekking wordt in de Staatscourant bekend gemaakt.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel29l
  - number: 29m
    text: |-
      Een zorgaanbieder die aan een leerplichtige jeugdige verblijf biedt in een accommodatie is gedurende de looptijd
      van de machtiging een persoon die zich met de feitelijke verzorging van de jeugdige heeft belast als bedoeld in
      [artikel 2, eerste lid, van de Leerplichtwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel2
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel29m
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '2'
  - number: 29n.1
    text: |-
      Een zorgaanbieder die een accommodatie in stand houdt stelt, met het oog op een zorgvuldige toepassing van
      maatregelen als bedoeld in [paragraaf 3][ref1], een regeling vast omtrent de personen die tot het treffen daarvan
      bevoegd zijn en met betrekking tot de wijze waarop tot toepassing wordt besloten.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#HoofdstukIVb
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel29n
    references:
      - id: ref1
        bwb_id: BWBR0016637
        hoofdstuk: IVb
        paragraaf: '3'
  - number: 29n.2
    text: |-
      Een zorgaanbieder die een accommodatie in stand houdt, stelt huisregels vast die betrekking hebben op een ordelijke
      gang van zaken, de veiligheid binnen de accommodatie en het waarborgen van een pedagogisch klimaat.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel29n
  - number: 29n.3
    text: |-
      De huisregels bevatten in ieder geval een regeling van de bezoektijden, van de controle van de bezoekers en van
      voorwerpen die jeugdigen in verband met de veiligheid binnen de inrichting niet in hun bezit mogen hebben.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel29n
  - number: 29o.1
    text: |-
      Het hulpverleningsplan kan ten aanzien van een met een machtiging opgenomen jeugdige maatregelen bevatten op grond
      waarvan hij tegen zijn wil of die van degene die het gezag over hem uitoefent, binnen de accommodatie in zijn
      vrijheden kan worden beperkt. Indien het plan zodanige maatregelen bevat omschrijft het tevens de gevallen waarin
      en de termijn gedurende welke de maatregelen kunnen worden toegepast.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel29o
  - number: 29o.2
    text: 'De maatregelen, bedoeld in het eerste lid, kunnen inhouden:'
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel29o
  - number: 29o.2.a
    text: |-
      het verbod zich op te houden op in het hulpverleningsplan aangegeven plaatsen en zonodig de tijdstippen waarop dat
      verbod geldt;
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel29o
  - number: 29o.2.b
    text: tijdelijke plaatsing in afzondering;
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel29o
  - number: 29o.2.c
    text: |-
      tijdelijke overplaatsing binnen de accommodatie of naar een andere accommodatie die is aangewezen op grond van
      [artikel 29k, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel29k
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel29o
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: 29k
        hoofdstuk: IVb
        paragraaf: '2'
  - number: 29o.2.d
    text: het vastpakken en vasthouden.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel29o
  - number: 29o.3
    text: |-
      De maatregelen, bedoeld in het tweede lid, die in het hulpverleningsplan zijn opgenomen, kunnen worden toegepast,
      voor zover dit nodig is om te voorkomen dat de jeugdige zich onttrekt aan de noodzakelijke jeugdzorg of voor zover
      dit nodig is voor de veiligheid van de jeugdige of anderen. De maatregelen bedoeld in het tweede lid, onder b
      en c, kunnen bovendien worden toegepast voor zover dit nodig is voor de handhaving van de huisregels, bedoeld in
      [artikel 29n, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel29n
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel29o
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: 29n
        hoofdstuk: IVb
        paragraaf: '2'
  - number: 29o.4
    text: |-
      De zorgaanbieder meldt de toepassing van het tweede lid, onder b en c, aan de stichting alsmede aan de ouders
      indien de jeugdige niet onder toezicht is gesteld.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel29o
  - number: 29p.1
    text: |-
      Het hulpverleningsplan kan ten aanzien van een met een machtiging opgenomen jeugdige hulpverleningsprogramma’s
      bevatten aan de toepassing waarvan hij moet meewerken.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel29p
  - number: 29p.2
    text: |-
      De hulpverleningsprogramma’s die in het hulpverleningsplan zijn opgenomen, kunnen tegen de wil van de jeugdige
      of van degene die het gezag over hem uitoefent, worden toegepast voor zover dit nodig is om het met het verblijf
      beoogde doel te bereiken.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel29p
  - number: 29p.3
    text: |-
      Het hulpverleningsplan kan ten aanzien van een met een machtiging opgenomen jeugdige geneeskundige
      behandelingsmethoden, waaronder het toedienen van medicijnen, bevatten die hij moet gedogen.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel29p
  - number: 29p.4
    text: |-
      De geneeskundige behandelingsmethoden die in het hulpverleningsplan zijn opgenomen, kunnen tegen de wil van de
      jeugdige of van degene die het gezag over hem uitoefent, worden toegepast voor zover dit nodig is om het met het
      verblijf beoogde doel te bereiken of voor zover dit nodig is voor de veiligheid van de jeugdige of anderen.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel29p
  - number: 29p.5
    text: |-
      De zorgaanbieder meldt de toepassing van het tweede of vierde lid aan de stichting alsmede aan de ouders indien
      de jeugdige niet onder toezicht is gesteld. Indien de geneeskundige behandelingsmethode wordt toegepast ter
      behandeling van een stoornis van de geestvermogens, wordt tevens melding gedaan aan het Staatstoezicht op de
      volksgezondheid.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel29p
  - number: 29q.1
    text: |-
      Het hulpverleningsplan kan ten aanzien van een met een machtiging opgenomen jeugdige, onverminderd de huisregels,
      als bedoeld in [artikel 29n, tweede lid][ref1], beperkingen van het brief- en telefoonverkeer of het gebruik van
      andere communicatiemiddelen bevatten.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel29n
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel29q
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: 29n
        hoofdstuk: IVb
        paragraaf: '2'
  - number: 29q.2
    text: |-
      Het hulpverleningsplan kan ten aanzien van een met een machtiging opgenomen jeugdige, onverminderd de huisregels,
      als bedoeld in [artikel 29n, tweede lid][ref1], beperkingen van bezoek bevatten of bepalen dat bezoek slechts onder
      toezicht kan plaatsvinden.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel29n
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel29q
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: 29n
        hoofdstuk: IVb
        paragraaf: '2'
  - number: 29q.3
    text: |-
      De beperkingen, bedoeld in het eerste en tweede lid, kunnen, onverminderd
      [artikel 263a van Boek 1 van het Burgerlijk Wetboek][ref1], tegen de wil van de jeugdige of van degene die het
      gezag over hem uitoefent, worden toegepast voor zover dit nodig is om te voorkomen dat het met het verblijf beoogde
      doel wordt tegengewerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel263a
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel29q
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 263a
  - number: 29q.4
    text: |-
      Op de beperkingen, bedoeld in het tweede lid, is [artikel 42, eerste en tweede lid][ref1], en
      [43, zevende lid, van de Beginselenwet justitiële jeugdinrichtingen][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0011756#Artikel43
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel29q
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '42'
      - id: ref2
        bwb_id: BWBR0011756
        artikel: '43'
  - number: 29r.1
    text: Het hulpverleningsplan kan ten aanzien van een met een machtiging opgenomen jeugdige controlemaatregelen bevatten.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel29r
  - number: 29r.2
    text: 'De maatregelen, bedoeld in het eerste lid, kunnen inhouden:'
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel29r
  - number: 29r.2.a
    text: onderzoek aan lichaam en kleding;
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel29r
  - number: 29r.2.b
    text: onderzoek van urine op aanwezigheid van gedragsbeïnvloedende middelen;
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel29r
  - number: 29r.2.c
    text: onderzoek van de kamer van de jeugdige op de aanwezigheid van voorwerpen die hij niet in zijn bezit mag hebben;
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel29r
  - number: 29r.2.d
    text: |-
      onderzoek van poststukken afkomstig van of bestemd voor de jeugdigen op de aanwezigheid van voorwerpen, doch
      slechts in aanwezigheid van de jeugdige.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel29r
  - number: 29r.3
    text: |-
      De controlemaatregelen die in het hulpverleningsplan zijn opgenomen, kunnen tegen de wil van de jeugdige of
      van degene die het gezag over hem uitoefent, worden toegepast voor zover dit nodig is om te controleren of
      hetgeen in het hulpverleningsplan is opgenomen, wordt nagekomen. De maatregelen, bedoeld in het tweede lid,
      kunnen bovendien worden toegepast voor zover dit nodig is voor de handhaving van de huisregels, bedoeld in
      [artikel 29n, tweede lid][ref1], of voor zover dit nodig is om te voorkomen dat de jeugdzorg aan andere jeugdigen
      wordt tegengewerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel29n
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel29r
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: 29n
        hoofdstuk: IVb
        paragraaf: '2'
  - number: 29r.4
    text: |-
      Voorwerpen die niet in het bezit van de jeugdige mogen zijn worden in beslag genomen en voor de jeugdige bewaard of
      met zijn toestemming vernietigd, dan wel aan een opsporingsambtenaar ter hand gesteld.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel29r
  - number: 29s.1
    text: |-
      De in de [artikelen 29o tot en met 29r][ref1] bedoelde onderdelen van het hulpverleningsplan worden slechts
      opgenomen indien dit noodzakelijk is voor het met de opneming en verblijf beoogde doel. Voorafgaand aan de
      vaststelling of wijziging van deze onderdelen wordt overleg gevoerd met degene die het gezag over de jeugdige
      heeft. Zij behoeven, in afwijking van [artikel 24, vijfde lid, tweede volzin][ref2], niet de instemming van de
      jeugdige of degene die het gezag over hem heeft. Zij behoeven de instemming van een gedragswetenschapper behorende
      tot een bij regeling van Onze Ministers aangewezen categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel29o
      [ref2]: https://wetten.overheid.nl/BWBR0016637#Artikel24
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel29s
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: 29o
        hoofdstuk: IVb
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0016637
        artikel: '24'
        hoofdstuk: IV
        paragraaf: '2'
  - number: 29s.2
    text: |-
      Een hulpverleningsplan ten aanzien van een jeugdige die met een machtiging in een accommodatie verblijft, wordt zo
      vaak geëvalueerd als in het belang van de jeugdige noodzakelijk wordt geacht.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel29s
  - number: 29t
    text: |-
      Met betrekking tot een jeugdige kunnen, anders dan ter uitvoering van een hulpverleningsplan of ter handhaving van
      de huisregels, bedoeld in [artikel 29n, tweede lid][ref1], geen maatregelen, methoden of beperkingen, genoemd in
      de [artikelen 29o tot en met 29r][ref2], tegen zijn wil of die van degene die het gezag over hem uitoefent, worden
      toegepast dan ter overbrugging van tijdelijke noodsituaties. De toepassing behoeft binnen vierentwintig uur nadat
      deze is aangevangen de instemming van een gedragswetenschapper behorende tot een bij regeling van Onze Ministers
      aangewezen categorie. De maatregelen, methoden of beperkingen worden ten hoogste gedurende zeven opeenvolgende
      dagen toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel29n
      [ref2]: https://wetten.overheid.nl/BWBR0016637#Artikel29o
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel29t
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: 29n
        hoofdstuk: IVb
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0016637
        artikel: 29o
        hoofdstuk: IVb
        paragraaf: '3'
  - number: 29ta.1
    text: |-
      Indien een zorgaanbieder met het oog op de veiligheid van de jeugdige of anderen dan wel om te voorkomen dat
      de jeugdige zich onttrekt aan de tenuitvoerlegging van de machtiging, ervoor zorg draagt dat het vervoer van en
      naar een accommodatie plaatsvindt door een vervoerder als bedoeld in het derde lid, kunnen door de vervoerder,
      voor zover dit noodzakelijk is met het oog op vorenomschreven doeleinden ten aanzien van die jeugdige tijdens dat
      vervoer tegen diens wil of de wil van degene die het gezag over hem uitoefent, voor de duur van het vervoer de
      volgende maatregelen worden genomen:
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel29ta
  - number: 29ta.1.a
    text: vastpakken en vasthouden;
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel29ta
  - number: 29ta.1.b
    text: onderzoek aan kleding;
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel29ta
  - number: 29ta.1.c
    text: tijdelijke plaatsing in een afzonderlijke en af te sluiten ruimte in het vervoermiddel.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel29ta
  - number: 29ta.2
    text: |-
      De maatregelen, bedoeld in het eerste lid, worden in het hulpverleningsplan opgenomen en worden dienovereenkomstig
      ten uitvoer gelegd.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel29ta
  - number: 29ta.3
    text: |-
      Een vervoerder als bedoeld in het eerste lid is een door Onze Ministers daartoe aangewezen vervoerder dan wel een
      andere vervoerder die voldoet aan de bij ministeriële regeling van Onze Ministers gestelde eisen, waaronder eisen
      omtrent het door de vervoerder te gebruiken vervoermiddel.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel29ta
  - number: 29ta.4
    text: |-
      In geval van vervoer als bedoeld in het eerste lid meldt de vervoerder de toepassing van een of meer van de in dat
      lid genoemde maatregelen aan de zorgaanbieder en de stichting. Indien de jeugdige niet onder toezicht is gesteld,
      licht de zorgaanbieder tevens de ouders in.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel29ta
  - number: 29u.1
    text: |-
      Degene die de beslissing heeft genomen tot toepassing van de [artikelen 29o tot en met 29r][ref1] of van
      [artikel 29t][ref2], draagt er zorg voor dat de toepassing zo spoedig mogelijk in het dossier betreffende de
      jeugdige wordt vastgelegd, onder vermelding van de omstandigheden die daartoe aanleiding gaven.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel29o
      [ref2]: https://wetten.overheid.nl/BWBR0016637#Artikel29t
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel29u
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: 29o
        hoofdstuk: IVb
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0016637
        artikel: 29t
        hoofdstuk: IVb
        paragraaf: '3'
  - number: 29u.2
    text: |-
      De zorgaanbieder draagt er zorg voor dat de toepassing van een of meer van de in de
      [artikelen 29fa, eerste lid][ref1], of [29ta, eerste lid][ref2], genoemde maatregelen zo spoedig mogelijk in het
      dossier betreffende de jeugdige wordt vastgelegd, onder vermelding van de omstandigheden die daartoe aanleiding
      gaven.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel29fa
      [ref2]: https://wetten.overheid.nl/BWBR0016637#Artikel29ta
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel29u
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: 29fa
        hoofdstuk: IVb
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0016637
        artikel: 29ta
        hoofdstuk: IVb
        paragraaf: '3'
  - number: 29u.3
    text: |-
      De zorgaanbieder verstrekt aan de stichting alsmede aan de ouders indien de jeugdige niet onder toezicht is
      gesteld, elk half jaar een rapportage over de toepassingen, als bedoeld in het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel29u
  - number: 29v.1
    text: |-
      Aan een jeugdige kan, naast de mogelijkheden die het hulpverleningsplan biedt om de accommodatie te verlaten,
      verlof worden verleend indien zulks, gelet op de reden waarom de jeugdige in de accommodatie moet verblijven,
      verantwoord is.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel29v
  - number: 29v.2
    text: Aan het verlof kunnen voorwaarden worden verbonden betreffende de zorg en het gedrag van de jeugdige.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel29v
  - number: 29v.3
    text: |-
      Verlof wordt slechts verleend indien redelijkerwijs kan worden aangenomen dat de jeugdige de voorwaarden zal
      naleven.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel29v
  - number: 29v.4
    text: |-
      Verlof wordt niet verleend dan nadat een gedragswetenschapper als bedoeld in [artikel 29s, eerste lid][ref1],
      daarmee heeft ingestemd.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel29s
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel29v
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: 29s
        hoofdstuk: IVb
        paragraaf: '3'
  - number: 29v.5
    text: |-
      Het verlof wordt ingetrokken indien voortzetting van het verlof, gezien de problemen van de jeugdige, niet langer
      verantwoord is. Het verlof kan worden ingetrokken indien de jeugdige zich niet aan de voorwaarden houdt. De aan het
      verlof verbonden voorwaarden kunnen worden gewijzigd.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel29v
  - number: 29w.1
    text: |-
      Een jeugdige of degene die het gezag over hem heeft kan binnen redelijke termijn tegen een beslissing als
      bedoeld in de [artikelen 29h, zesde lid, tweede volzin][ref1], [29o, derde lid][ref2], [29p, tweede lid][ref3],
      [29q, derde lid][ref4], en [29r, derde en vierde lid][ref5], de toepassing van de [artikelen 29t][ref6] en
      [29ta, eerste lid][ref7], of een beslissing aangaande verlof als bedoeld in [artikel 29v][ref8] een schriftelijke
      klacht indienen bij de klachtencommissie, bedoeld in [artikel 68][ref9].


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel29h
      [ref2]: https://wetten.overheid.nl/BWBR0016637#Artikel29o
      [ref3]: https://wetten.overheid.nl/BWBR0016637#Artikel29p
      [ref4]: https://wetten.overheid.nl/BWBR0016637#Artikel29q
      [ref5]: https://wetten.overheid.nl/BWBR0016637#Artikel29r
      [ref6]: https://wetten.overheid.nl/BWBR0016637#Artikel29t
      [ref7]: https://wetten.overheid.nl/BWBR0016637#Artikel29ta
      [ref8]: https://wetten.overheid.nl/BWBR0016637#Artikel29v
      [ref9]: https://wetten.overheid.nl/BWBR0016637#Artikel68
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel29w
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: 29h
        hoofdstuk: IVb
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0016637
        artikel: 29o
        hoofdstuk: IVb
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0016637
        artikel: 29p
        hoofdstuk: IVb
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0016637
        artikel: 29q
        hoofdstuk: IVb
        paragraaf: '3'
      - id: ref5
        bwb_id: BWBR0016637
        artikel: 29r
        hoofdstuk: IVb
        paragraaf: '3'
      - id: ref6
        bwb_id: BWBR0016637
        artikel: 29t
        hoofdstuk: IVb
        paragraaf: '3'
      - id: ref7
        bwb_id: BWBR0016637
        artikel: 29ta
        hoofdstuk: IVb
        paragraaf: '3'
      - id: ref8
        bwb_id: BWBR0016637
        artikel: 29v
        hoofdstuk: IVb
        paragraaf: '4'
      - id: ref9
        bwb_id: BWBR0016637
        artikel: '68'
        hoofdstuk: XII
  - number: 29w.2
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld met betrekking tot de samenstelling van de
      klachtencommissie bij de behandeling van klachten als bedoeld in het eerste lid en de wijze waarop deze klachten
      worden behandeld.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel29w
  - number: 29w.3
    text: |-
      De klachtencommissie neemt zo spoedig mogelijk, doch in ieder geval binnen vier weken, te rekenen vanaf de datum
      waarop de klacht is ontvangen, een beslissing op de klacht.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel29w
  - number: 29w.4
    text: 'De beslissing van de commissie strekt tot:'
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel29w
  - number: 29w.4.a
    text: onbevoegdverklaring van de commissie,
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel29w
  - number: 29w.4.b
    text: niet-ontvankelijkverklaring van de klacht,
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel29w
  - number: 29w.4.c
    text: ongegrondverklaring van de klacht, of
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel29w
  - number: 29w.4.d
    text: gegrondverklaring van de klacht.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel29w
  - number: 29w.5
    text: |-
      Indien de commissie de klacht gegrond verklaart, vernietigt zij de bestreden beslissing geheel of gedeeltelijk.
      Gehele of gedeeltelijke vernietiging brengt vernietiging van de rechtsgevolgen van de beslissing of het vernietigde
      gedeelte van de beslissing mee.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel29w
  - number: 29w.6
    text: |-
      Indien de commissie de klacht gegrond verklaart, kan zij degene die de beslissing heeft genomen opdragen een nieuwe
      beslissing te nemen en voor het nemen daarvan een termijn stellen.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel29w
  - number: 29w.7
    text: |-
      Indien de commissie de klacht gegrond verklaart, kan zij bepalen dat enige tegemoetkoming, die geldelijk van aard
      kan zijn, aan de klager geboden is en stelt deze tegemoetkoming vast.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel29w
  - number: 29x.1
    text: |-
      Hangende de beslissing op de klacht kan de voorzitter van een beroepscommissie als bedoeld in
      [artikel 1, onder n, van de Beginselenwet justitiële jeugdinrichtingen][ref1], op verzoek van de jeugdige, gehoord
      degene die de beslissing heeft genomen, de beslissing waartegen de klacht is gericht, schorsen.


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel1
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel29x
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '1'
  - number: 29x.2
    text: De voorzitter doet hiervan onverwijld mededeling aan degene die de beslissing heeft genomen en de klager.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel29x
  - number: 29y
    text: |-
      Ten aanzien van een beslissing als bedoeld in [artikel 29w, derde lid][ref1], zijn de
      [artikelen 74 tot en met 76 van de Beginselenwet justitiële jeugdinrichtingen][ref2] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel29w
      [ref2]: https://wetten.overheid.nl/BWBR0011756#Artikel74
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel29y
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: 29w
        hoofdstuk: IVb
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0011756
        artikel: '74'
  - number: '30.1'
    text: |-
      Gedeputeerde staten bieden provinciale staten vóór 1 oktober van het jaar voorafgaande aan het eerste jaar waarop
      het betrekking heeft, een ontwerp aan van het provinciale beleidskader jeugdzorg. Het ontwerp wordt gelijktijdig
      met de aanbieding aan Onze Ministers gezonden.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel30
  - number: '30.2'
    text: 'Alvorens het ontwerp van het provinciale beleidskader vast te stellen, plegen gedeputeerde staten overleg met:'
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel30
  - number: 30.2.a
    text: |-
      de stichting, de in de provincie werkzame zorgaanbieders en de raad voor de kinderbescherming, teneinde de behoefte
      aan de uitvoering van de taken van de stichting te kunnen vaststellen alsmede afstemming van de door de provincie
      te subsidiëren jeugdzorg op de vraag te realiseren en gegevens te verkrijgen die nodig zijn voor de onder b tot en
      met d, genoemde afspraken;
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel30
  - number: 30.2.b
    text: |-
      de colleges van burgemeester en wethouders, teneinde afspraken te maken over de inzet van de stichting met
      betrekking tot de taken, genoemd in [artikel 10, derde lid][ref1], alsmede over de inzet van algemene voorzieningen
      voor jeugdigen bij het vroegtijdig signaleren van problemen en het voorzien in jeugdzorg anders dan bedoeld in
      [artikel 5, tweede lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0016637#Artikel5
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '10'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0016637
        artikel: '5'
        hoofdstuk: III
        paragraaf: '2'
  - number: 30.2.c
    text: |-
      de in de provincie werkzame zorgverzekeraars, teneinde afspraken te maken over de zorg waarin door de provincie,
      respectievelijk de zorgverzekeraars zal worden voorzien;
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel30
  - number: 30.2.d
    text: |-
      Onze Minister van Veiligheid en Justitie, teneinde afspraken te maken over de capaciteit van inrichtingen als
      bedoeld in [artikel 1, onder b, van de Beginselenwet justitiële jeugdinrichtingen][ref1] ten behoeve van aldaar
      op grond van de [artikelen 261][ref2] of [305, derde lid, van Boek 1 van het Burgerlijk Wetboek][ref3] te plaatsen
      minderjarigen.


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel261
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel305
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '261'
      - id: ref3
        bwb_id: BWBR0002656
        artikel: '305'
  - number: '30.3'
    text: |-
      Gedeputeerde staten stellen de betrokken cliëntenorganisaties en pleegouderorganisaties in de gelegenheid te
      reageren op het ontwerp van het provinciale beleidskader.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel30
  - number: '31.1'
    text: |-
      Provinciale staten stellen eenmaal in de vier jaar een provinciaal beleidskader jeugdzorg voor de komende vier
      kalenderjaren vast. Het provinciale beleidskader wordt vóór 1 december van het jaar voorafgaand aan het eerste jaar
      waarop het betrekking heeft, vastgesteld.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel31
  - number: '31.2'
    text: Het provinciale beleidskader is in overeenstemming met het landelijk beleidskader.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel31
  - number: '31.3'
    text: |-
      Het provinciale beleidskader bevat de hoofdlijnen van het beleid ten aanzien van de stichting en de jeugdzorg
      waarop ingevolge deze wet aanspraak bestaat alsmede een financieel kader voor dat beleid.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel31
  - number: '31.4'
    text: |-
      Uitgangspunt bij de vaststelling van het provinciale beleidskader is dat het aanbod van jeugdzorg waarop ingevolge
      deze wet aanspraak bestaat, aansluit bij de behoefte van cliënten en bij het uitgangspunt dat jeugdzorg in het
      algemeen het meest doelmatig en het meest doeltreffend plaatsvindt in de minst ingrijpende vorm, zo dicht mogelijk
      bij de plaats waar de cliënt duurzaam verblijft en gedurende een zo kort mogelijke periode.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel31
  - number: '31.5'
    text: |-
      Ten behoeve van de samenhang binnen de jeugdzorg bevat het provinciale beleidskader voorts een overzicht van de
      wijze waarop de zorgverzekeraars, de gemeenten en Onze Minister van Veiligheid en Justitie voornemens zijn te
      voorzien in de behoefte aan jeugdzorg, niet zijnde jeugdzorg waarop ingevolge deze wet aanspraak bestaat.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel31
  - number: '31.6'
    text: |-
      Provinciale staten bezien jaarlijks in hoeverre het provinciale beleidskader bijstelling behoeft en zij stellen het
      in ieder geval bij naar aanleiding van een wijziging van het landelijk beleidskader.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel31
  - number: '31.7'
    text: Afschrift van het provinciale beleidskader wordt zo spoedig mogelijk na vaststelling gezonden aan Onze Ministers.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel31
  - number: '31.8'
    text: Onze Ministers kunnen regels stellen omtrent de inrichting van het provinciale beleidskader.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel31
  - number: '32.1'
    text: |-
      Gedeputeerde staten stellen jaarlijks vóór 1 december het uitvoeringsprogramma jeugdzorg vast. Gedeputeerde staten
      zenden het ontwerp van het uitvoeringsprogramma jaarlijks vóór 1 oktober aan Onze Ministers.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel32
  - number: '32.2'
    text: 'Het uitvoeringsprogramma bevat een overzicht van:'
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel32
  - number: 32.2.a
    text: |-
      de in het aan het jaar van vaststelling voorafgaande kalenderjaar door de stichting en de gesubsidieerde
      zorgaanbieders geleverde activiteiten en de voor de uitvoering van die activiteiten verstrekte subsidies;
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel32
  - number: 32.2.b
    text: |-
      de in het jaar van vaststelling, met inachtneming van het provinciale beleidskader, door de stichting en de
      zorgaanbieders te leveren activiteiten en de voor de uitvoering daarvan verleende subsidies;
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel32
  - number: 32.2.c
    text: |-
      de in het kalenderjaar volgend op het jaar van vaststelling, met inachtneming van het provinciale beleidskader,
      door de stichting en de zorgaanbieders te leveren activiteiten en de voor de uitvoering daarvan beschikbare
      subsidies.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel32
  - number: '32.3'
    text: |-
      Het uitvoeringsprogramma bevat tevens een overzicht van de in de jaren waarop het programma betrekking heeft
      door de in [artikel 30, tweede lid, onder b tot en met d][ref1], genoemde instanties, bekostigde of te bekostigen
      jeugdzorg.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel30
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '30'
        hoofdstuk: V
        paragraaf: '1'
  - number: '32.4'
    text: |-
      Ten aanzien van de totstandkoming van het in het derde lid, onder c, bedoelde onderdeel van het
      uitvoeringsprogramma is [artikel 30, tweede en derde lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel30
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '30'
        hoofdstuk: V
        paragraaf: '1'
  - number: '32.5'
    text: |-
      Een tussentijdse wijziging van het provinciale beleidskader wordt in het uitvoeringsprogramma opgenomen. Op een
      tussentijdse wijziging is [artikel 30][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel30
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '30'
        hoofdstuk: V
        paragraaf: '1'
  - number: '32.6'
    text: Afschrift van het uitvoeringsprogramma wordt gezonden aan Onze Ministers.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel32
  - number: '32.7'
    text: Onze Ministers kunnen regels stellen omtrent de inrichting van het uitvoeringsprogramma.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel32
  - number: '34.1'
    text: |-
      Onze Ministers stellen eenmaal in de vier jaar vóór de indiening van de begroting van het Rijk een landelijk
      beleidskader jeugdzorg voor de komende vier kalenderjaren vast.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel34
  - number: '34.2'
    text: |-
      Het landelijke beleidskader bevat de uitgangspunten voor het door de provinciebesturen te voeren beleid, alsmede
      een raming van de bedragen die het Rijk voornemens is aan de onderscheiden provincies te verstrekken ten behoeve
      van de subsidiëring van de stichting en van de jeugdzorg waarop ingevolge deze wet aanspraak bestaat. Het
      landelijk beleidskader bevat voorts de uitgangspunten voor het door de gemeentebesturen te voeren beleid inzake de
      signalering van risico’s die jeugdigen als bedoeld in [hoofdstuk IA][ref1] in de noodzakelijke condities voor een
      gezonde en veilige ontwikkeling naar volwassenheid daadwerkelijk bedreigen.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#HoofdstukIa
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0016637
        hoofdstuk: Ia
  - number: '34.3'
    text: |-
      Ten behoeve van de samenhang binnen de jeugdzorg, bevat het landelijke beleidskader voorts een overzicht van de
      wijze waarop:
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel34
  - number: 34.3.a
    text: |-
      de gemeenten voornemens zijn te voorzien in de behoefte aan jeugdzorg, niet zijnde jeugdzorg waarop ingevolge
      deze wet aanspraak bestaat, en waarop zij voornemens zijn vorm te geven aan de samenwerking, bedoeld in
      [artikel 2g][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel2g
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: 2g
        hoofdstuk: Ia
        paragraaf: '3'
  - number: 34.3.b
    text: |-
      de zorgverzekeraars voornemens zijn te voorzien in de behoefte aan zorg als bedoeld in
      [artikel 5, tweede lid, onder b en c][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel5
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '5'
        hoofdstuk: III
        paragraaf: '2'
  - number: 34.3.c
    text: |-
      Onze Minister van Veiligheid en Justitie voornemens is te voorzien in de behoefte aan jeugdzorg als bedoeld in
      [artikel 5, tweede lid, onder d][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel5
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '5'
        hoofdstuk: III
        paragraaf: '2'
  - number: '34.4'
    text: |-
      Bij de vaststelling van het landelijke beleidskader wordt rekening gehouden met het door de provinciebesturen in de
      voorafgaande jaren gevoerde beleid, zoals dit blijkt uit de uitvoeringsprogramma's.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel34
  - number: '34.5'
    text: Het landelijke beleidskader wordt gezonden aan de provinciebesturen en aan de beide Kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel34
  - number: '34.6'
    text: |-
      Jaarlijks bezien Onze Ministers in hoeverre het landelijke beleidskader bijstelling behoeft. Onze Ministers kunnen
      het landelijke beleidskader aanpassen zodra daartoe aanleiding bestaat.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel34
  - number: '35.1'
    text: |-
      Alvorens het landelijke beleidskader vast te stellen, plegen Onze Ministers overleg met de colleges
      van gedeputeerde staten en een vertegenwoordiging van de colleges van burgemeester en wethouders en van
      zorgverzekeraars.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel35
  - number: '35.2'
    text: |-
      Onze Ministers stellen de betrokken cliëntenorganisaties en pleegouderorganisaties in de gelegenheid te reageren op
      het ontwerp van het landelijke beleidskader.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel35
  - number: '36.1'
    text: |-
      Onze Ministers stellen jaarlijks vóór de indiening van de begroting van het Rijk een voortgangsrapportage jeugdzorg
      vast.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel36
  - number: '36.2'
    text: 'De voortgangsrapportage van elk kalenderjaar bevat in ieder geval een overzicht van:'
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel36
  - number: 36.2.a
    text: |-
      de in het tweede, aan het jaar van vaststelling voorafgaande kalenderjaar aan gedeputeerde staten verstrekte
      uitkeringen, bedoeld in [artikel 37][ref1], alsmede de wijze waarop in dat jaar deze uitkeringen door de provincie
      zijn besteed;


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel37
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '37'
        hoofdstuk: VI
        paragraaf: '1'
  - number: 36.2.b
    text: |-
      de in het aan het jaar van vaststelling voorafgaande kalenderjaar aan de provincies verstrekte uitkeringen, bedoeld
      in [artikel 37][ref1], alsmede de bestemming die gedeputeerde staten volgens het op dat jaar betrekking hebbende
      deel van het uitvoeringsprogramma daaraan hebben gegeven;


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel37
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '37'
        hoofdstuk: VI
        paragraaf: '1'
  - number: 36.2.c
    text: |-
      de in het jaar van vaststelling, met inachtneming van het landelijke beleidskader, aan de provincies verleende
      uitkeringen, bedoeld in [artikel 37][ref1], alsmede de bestemming die gedeputeerde staten volgens het op dat jaar
      betrekking hebbende deel van het uitvoeringsprogramma daaraan hebben gegeven;


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel37
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '37'
        hoofdstuk: VI
        paragraaf: '1'
  - number: 36.2.d
    text: |-
      de voor de provincies, uitgaande van het landelijk beleidskader, beschikbare uitkeringen, bedoeld in
      [artikel 37][ref1], voor het kalenderjaar volgend op het jaar van vaststelling.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel37
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '37'
        hoofdstuk: VI
        paragraaf: '1'
  - number: '36.3'
    text: |-
      De voortgangsrapportage bevat tevens een overzicht van de in die jaren uitgevoerde of uit te voeren
      andere vormen van jeugdzorg dan waarop ingevolge deze wet aanspraak bestaat en zorg als bedoeld in
      [artikel 5, tweede lid, onder b, c en d][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel5
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '5'
        hoofdstuk: III
        paragraaf: '2'
  - number: '36.4'
    text: |-
      Een tussentijdse wijziging van het landelijke beleidskader wordt in de voortgangsrapportage opgenomen. Op een
      tussentijdse wijziging is [artikel 35][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel35
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '35'
        hoofdstuk: V
        paragraaf: '2'
  - number: '36.5'
    text: De voortgangsrapportage wordt gezonden aan de provinciebesturen en aan de beide Kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel36
  - number: '36.6'
    text: |-
      Ten aanzien van de totstandkoming van het in het tweede lid, onder d, bedoelde onderdeel van de
      voortgangsrapportage is [artikel 35][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel35
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '35'
        hoofdstuk: V
        paragraaf: '2'
  - number: '37.1'
    text: 'Onze Ministers verstrekken aan de provincies jaarlijks:'
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel37
  - number: 37.1.a
    text: |-
      een uitkering ten behoeve van de door de stichting ingevolge deze wet uit te voeren taken, ten behoeve van
      de vertrouwenspersoon voor de cliënten van de stichting, ten behoeve van de uitvoering van experimenten of de
      steunfunctie met betrekking tot de stichting, en
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel37
  - number: 37.1.b
    text: |-
      een uitkering ten behoeve van de door zorgaanbieders verleende jeugdzorg waarop ingevolge deze wet aanspraak
      bestaat, ten behoeve van de vertrouwenspersoon voor de cliënten van de zorgaanbieders, ten behoeve van
      de uitvoering van experimenten of de steunfunctie met betrekking tot deze jeugdzorg, ten behoeve van
      cliëntenorganisaties, ten behoeve van het verwerken van gegevens, bedoeld in [artikel 43][ref1], en het verstrekken
      van gegevens, bedoeld in [artikel 44, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0016637#Artikel44
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '43'
        hoofdstuk: VII
      - id: ref2
        bwb_id: BWBR0016637
        artikel: '44'
        hoofdstuk: VII
  - number: '37.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen andere dan de in het eerste lid, onder b, bedoelde
      activiteiten op het terrein van de jeugdzorg worden aangewezen, waarvoor de uitkering, bedoeld in het eerste lid,
      onder b, kan worden aangewend.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel37
  - number: '38.1'
    text: |-
      Onze Ministers kunnen aan een provincie of een privaatrechtelijke rechtspersoon subsidie verstrekken ten behoeve
      van de uitvoering van een experiment of van de steunfunctie, dan wel ten behoeve van het stimuleren van nieuw
      beleid.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel38
  - number: '38.2'
    text: De subsidie wordt verstrekt voor een bij de verlening aan te geven periode van ten hoogste vier jaar.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel38
  - number: '38.3'
    text: |-
      Onze Ministers kunnen met betrekking tot deze subsidie een subsidieplafond vaststellen. Daarbij wordt voorzien in
      de wijze van verdeling.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel38
  - number: '38.4'
    text: |-
      Onze Minister van Veiligheid en Justitie kan aan een rechtspersoon als bedoeld in [artikel 254, tweede lid][ref1],
      en aan een rechtspersoon als bedoeld in [artikel 302, tweede lid, van Boek 1 van het Burgerlijk Wetboek][ref2],
      subsidie verstrekken ten behoeve van de kosten van de uitoefening van de in die bepalingen en in
      [artikel 241, zevende lid, van Boek 1 van het Burgerlijk Wetboek][ref3] bedoelde taken, bijzondere door Onze
      Minister van Veiligheid en Justitie aan te geven kosten daaronder begrepen. Bij of krachtens algemene maatregel van
      bestuur worden regels gesteld omtrent het verlenen van deze subsidie. Deze regels kunnen betrekking hebben op de
      onderwerpen genoemd in [artikel 39, eerste lid][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel254
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel302
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel241
      [ref4]: https://wetten.overheid.nl/BWBR0016637#Artikel39
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '254'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '302'
      - id: ref3
        bwb_id: BWBR0002656
        artikel: '241'
      - id: ref4
        bwb_id: BWBR0016637
        artikel: '39'
        hoofdstuk: VI
        paragraaf: '1'
  - number: '38.5'
    text: |-
      Op een rechtspersoon als bedoeld in het vierde lid zijn de [artikelen 13 tot en met 16][ref1] en de
      [hoofdstukken VII][ref2], [VIII][ref3], [IX][ref4], [X][ref5] en [XII][ref6] van overeenkomstige toepassing. Waar
      in deze bepalingen wordt gesproken van gedeputeerde staten wordt daarvoor gelezen Onze Minister van Veiligheid
      en Justitie.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0016637#HoofdstukVII
      [ref3]: https://wetten.overheid.nl/BWBR0016637#HoofdstukVIII
      [ref4]: https://wetten.overheid.nl/BWBR0016637#HoofdstukIX
      [ref5]: https://wetten.overheid.nl/BWBR0016637#HoofdstukX
      [ref6]: https://wetten.overheid.nl/BWBR0016637#HoofdstukXII
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '13'
        hoofdstuk: III
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0016637
        hoofdstuk: VII
      - id: ref3
        bwb_id: BWBR0016637
        hoofdstuk: VIII
      - id: ref4
        bwb_id: BWBR0016637
        hoofdstuk: IX
      - id: ref5
        bwb_id: BWBR0016637
        hoofdstuk: X
      - id: ref6
        bwb_id: BWBR0016637
        hoofdstuk: XII
  - number: '39.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld ten aanzien van de uitkeringen, bedoeld in
      [artikel 37][ref1]. Deze regels kunnen betrekking hebben op:


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel37
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '37'
        hoofdstuk: VI
        paragraaf: '1'
  - number: 39.1.a
    text: het bedrag van de uitkeringen, dan wel de wijze waarop dit bedrag wordt bepaald;
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel39
  - number: 39.1.b
    text: de aanvraag van de uitkeringen en de besluitvorming daarover;
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel39
  - number: 39.1.c
    text: de voorwaarden waaronder de uitkeringen worden verleend;
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel39
  - number: 39.1.d
    text: de verplichtingen van de provincies;
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel39
  - number: 39.1.e
    text: de vaststelling van de uitkeringen;
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel39
  - number: 39.1.f
    text: de intrekking of wijziging van de verlening of de vaststelling van de uitkering;
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel39
  - number: 39.1.g
    text: de betaling of de terugvordering van de uitkeringen en het verlenen van voorschotten.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel39
  - number: '39.2'
    text: |-
      Bij regeling van Onze Ministers worden regels gesteld ten aanzien van subsidies als bedoeld in
      [artikel 38, eerste lid][ref1]. Deze regels kunnen betrekking hebben op de onderwerpen, genoemd in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel38
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '38'
        hoofdstuk: VI
        paragraaf: '1'
  - number: '40.1'
    text: |-
      Een subsidie als bedoeld in [artikel 38][ref1] ten laste van een begroting die nog niet is vastgesteld, wordt
      verleend onder de voorwaarde, bedoeld in [artikel 4:34, eerste lid, van de Algemene wet bestuursrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '38'
        hoofdstuk: VI
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '40.2'
    text: |-
      De verlening van een uitkering als bedoeld in [artikel 37][ref1] of een subsidie als bedoeld in [artikel 38][ref2]
      wordt in ieder geval geweigerd in de gevallen, bedoeld in [artikel 4:35 van de Algemene wet bestuursrecht][ref3] en
      indien niet wordt voldaan aan het bij of krachtens de wet bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0016637#Artikel38
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '37'
        hoofdstuk: VI
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0016637
        artikel: '38'
        hoofdstuk: VI
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '41.1'
    text: |-
      Gedeputeerde staten verstrekken aan de stichting subsidie ten behoeve van de ingevolge deze wet uit te voeren taken
      en kan aan de stichting subsidie verstrekken ten behoeve van experimenten.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel41
  - number: '41.2'
    text: |-
      Gedeputeerde staten verstrekken aan zorgaanbieders subsidie ten behoeve van de uitvoering van die jeugdzorg en het
      verwerken van gegevens als bedoeld in de [artikelen 43][ref1] en [44][ref2]. Gedeputeerde staten kunnen aan een
      zorgaanbieders subsidie verstrekken ten behoeve van experimenten.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0016637#Artikel44
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '43'
        hoofdstuk: VII
      - id: ref2
        bwb_id: BWBR0016637
        artikel: '44'
        hoofdstuk: VII
  - number: '41.3'
    text: |-
      Gedeputeerde staten kunnen aan een rechtspersoon met volledige rechtsbevoegdheid subsidie verstrekken voor de
      uitvoering van de steunfunctie ten behoeve van de stichting of zorgaanbieders.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel41
  - number: '41.4'
    text: |-
      Gedeputeerde staten verstrekken aan een door hen aangewezen rechtspersoon met volledige rechtsbevoegdheid subsidie
      ten behoeve van de werkzaamheden van de vertrouwenspersoon, die de rechtspersoon ten behoeve van hun cliënten aan
      een stichting en aan zorgaanbieders beschikbaar stelt.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel41
  - number: '41.5'
    text: |-
      Provinciale staten stellen bij verordening regels vast omtrent de subsidiëring. Deze regels hebben in ieder geval
      betrekking op de onderwerpen, genoemd in [artikel 39][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel39
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '39'
        hoofdstuk: VI
        paragraaf: '1'
  - number: '41.6'
    text: |-
      Onze Ministers kunnen regels stellen omtrent de in de verordening, bedoeld in het vijfde lid, te stellen regels
      over:
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel41
  - number: 41.6.a
    text: het bedrag van de subsidie, dan wel de wijze waarop dit bedrag wordt bepaald;
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel41
  - number: 41.6.b
    text: de verlening en vaststelling van subsidies;
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel41
  - number: 41.6.c
    text: de inrichting van de begroting en het financiële verslag;
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel41
  - number: 41.6.d
    text: het toezicht op de rechtmatige en doelmatige besteding van subsidies.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel41
  - number: '42.1'
    text: |-
      Onze Ministers verwerken gegevens ten behoeve van de totstandbrenging van een samenhangend beleid ten aanzien van
      de zorg, bedoeld in [artikel 5, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel5
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '5'
        hoofdstuk: III
        paragraaf: '2'
  - number: '42.2'
    text: |-
      Gedeputeerde staten verwerken gegevens ten behoeve van de totstandbrenging van een samenhangend provinciaal beleid
      ten aanzien van de zorg, bedoeld in [artikel 5, tweede lid][ref1] en ten behoeve van de verwerking, bedoeld in het
      eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel5
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '5'
        hoofdstuk: III
        paragraaf: '2'
  - number: '42.3'
    text: |-
      De zorgverzekeraars verwerken gegevens ten behoeve van de totstandbrenging van samenhang tussen zorg als bedoeld
      in [artikel 5, tweede lid, onder b en c][ref1], en de overige jeugdzorg, alsmede ten behoeve van de verwerking,
      bedoeld in het eerste en tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel5
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '5'
        hoofdstuk: III
        paragraaf: '2'
  - number: '43'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat de stichtingen, de zorgaanbieders, de aanbieders
      van andere zorg ten behoeve van de verwerking, bedoeld in [artikel 42][ref1], de gegevens, bedoeld in
      [artikel 44, zesde lid, onder a][ref2], verwerken en op welke wijze die verwerking plaatsvindt. Onze Ministers
      kunnen nadere regels stellen omtrent de wijze van verwerking.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0016637#Artikel44
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '42'
        hoofdstuk: VII
      - id: ref2
        bwb_id: BWBR0016637
        artikel: '44'
        hoofdstuk: VII
  - number: '44.1'
    text: |-
      De stichtingen verstrekken ten behoeve van de verwerking, bedoeld in [artikel 42, eerste en tweede lid][ref1],
      gegevens aan gedeputeerde staten van de betrokken provincie en de betrokken zorgverzekeraars.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel42
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '42'
        hoofdstuk: VII
  - number: '44.2'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat de raad voor de kinderbescherming en de justitiële
      jeugdinrichtingen, bedoeld in [artikel 1, onder b, van de Beginselenwet justitiële jeugdinrichtingen][ref1],
      ten behoeve van de verwerking, bedoeld in [artikel 42, eerste en tweede lid][ref2], gegevens verstrekken aan Onze
      Minister van Veiligheid en Justitie of de provincies. Bij die maatregel kan worden geregeld dat zorgaanbieders
      gegevens verstrekken aan gedeputeerde staten van de betrokken provincies ten behoeve van de verwerking, bedoeld in
      [artikel 42, tweede lid][ref3], en aanbieders van andere zorg aan de betrokken zorgverzekeraars ten behoeve van de
      verwerking bedoeld in [artikel 42, derde lid][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0016637#Artikel42
      [ref3]: https://wetten.overheid.nl/BWBR0016637#Artikel42
      [ref4]: https://wetten.overheid.nl/BWBR0016637#Artikel42
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0016637
        artikel: '42'
        hoofdstuk: VII
      - id: ref3
        bwb_id: BWBR0016637
        artikel: '42'
        hoofdstuk: VII
      - id: ref4
        bwb_id: BWBR0016637
        artikel: '42'
        hoofdstuk: VII
  - number: '44.3'
    text: |-
      Gedeputeerde Staten en zorgaanbieders bij wie een machtiging ten uitvoer kan worden gelegd, verstrekken gegevens
      aan Onze Ministers ten behoeve van de verwerking, bedoeld in [artikel 42, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel42
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '42'
        hoofdstuk: VII
  - number: '44.4'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat de zorgverzekeraars gegevens verstrekken aan
      Onze Ministers of gedeputeerde staten van de betrokken provincies ten behoeve van de verwerking, bedoeld in
      [artikel 42, eerste of tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel42
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '42'
        hoofdstuk: VII
  - number: '44.5'
    text: |-
      Onze Ministers verstrekken de gegevens aan de provincies en de betrokken zorgverzekeraars ten behoeve van de
      verwerking, bedoeld in [artikel 42, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel42
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '42'
        hoofdstuk: VII
  - number: '44.6'
    text: |-
      Bij of krachtens algemene maatregel van bestuur wordt met het oog op de verwerking, bedoeld in [artikel 42][ref1],
      bepaald:


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel42
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '42'
        hoofdstuk: VII
  - number: 44.6.a
    text: welke gegevens worden verstrekt;
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel44
  - number: 44.6.b
    text: de wijze waarop de gegevens worden verstrekt;
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel44
  - number: 44.6.c
    text: de tijdvakken waarop de gegevens die worden verstrekt, betrekking hebben;
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel44
  - number: 44.6.d
    text: de termijnen waarbinnen de gegevens worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel44
  - number: '44.7'
    text: |-
      Voor zover de gegevens, bedoeld in [artikel 42][ref1], persoonsgegevens zijn, worden de regels, bedoeld in het
      zesde lid, gesteld bij algemene maatregel van bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel42
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '42'
        hoofdstuk: VII
  - number: '45.1'
    text: |-
      De gegevens, bedoeld in de [artikelen 42][ref1], [43][ref2] en [44][ref3], kunnen persoonsgegevens zijn, voor zover
      deze gegevens noodzakelijk zijn voor:


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0016637#Artikel43
      [ref3]: https://wetten.overheid.nl/BWBR0016637#Artikel44
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '42'
        hoofdstuk: VII
      - id: ref2
        bwb_id: BWBR0016637
        artikel: '43'
        hoofdstuk: VII
      - id: ref3
        bwb_id: BWBR0016637
        artikel: '44'
        hoofdstuk: VII
  - number: 45.1.a
    text: |-
      het doelmatig en doeltreffend functioneren van de toegang tot de jeugdzorg, bedoeld in
      [artikel 5, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel5
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '5'
        hoofdstuk: III
        paragraaf: '2'
  - number: 45.1.b
    text: |-
      het doelmatig en doeltreffend functioneren van de zorgaanbieders, van de aanbieders van andere zorg en van de raad
      voor de kinderbescherming;
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel45
  - number: 45.1.c
    text: |-
      de doelmatigheid en de doeltreffendheid van het aanbod aan jeugdzorg als bedoeld in [artikel 5, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel5
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '5'
        hoofdstuk: III
        paragraaf: '2'
  - number: '45.2'
    text: |-
      Tot de persoonsgegevens kunnen gegevens behoren betreffende iemands etnische of culturele achtergrond of
      gezondheid, alsmede strafrechtelijke gegevens.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel45
  - number: '45.3'
    text: |-
      De gegevens, bedoeld in het eerste lid, worden niet verwerkt voor andere doeleinden dan bedoeld in dat lid of een
      daarmee verenigbaar doel en worden verwerkt op een wijze die waarborgt dat zij zo min mogelijk tot een persoon
      herleidbaar zijn.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel45
  - number: '46.1'
    text: |-
      Bij ministeriële regeling van Onze Ministers kan worden bepaald aan welke personen of instanties, die zijn
      betrokken bij de jeugdzorg, informatie wordt verstrekt op basis van de gegevens, bedoeld in [artikel 42][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel42
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '42'
        hoofdstuk: VII
  - number: '46.2'
    text: Deze informatie bevat geen gegevens op basis waarvan een persoon redelijkerwijs herleidbaar is.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel46
  - number: '47.1'
    text: |-
      Er is een Inspectie jeugdzorg die ressorteert onder Onze Minister van Volksgezondheid, Welzijn en Sport en die tot
      taak heeft:
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel47
  - number: 47.1.a
    text: |-
      het verrichten van onderzoeken naar de kwaliteit in algemene zin van de bureaus jeugdzorg en
      de jeugdzorg, waarop ingevolge deze wet aanspraak bestaat, van de inrichtingen, bedoeld in
      [artikel 1, onder b, van de Beginselenwet justitiële jeugdinrichtingen][ref1] en van de raad voor de
      kinderbescherming, alsmede waar nodig, het aangeven en bevorderen van middelen tot verbetering daarvan;


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel1
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '1'
  - number: 47.1.b
    text: |-
      het toezicht op de naleving van de wet en de daarop berustende bepalingen ten aanzien van de stichtingen,
      zorgaanbieders en vervoerders als bedoeld in [artikel 29ta, derde lid][ref1], met uitzondering van het toezicht op
      de rechtmatige en doelmatige besteding van subsidies;


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel29ta
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: 29ta
        hoofdstuk: IVb
        paragraaf: '3'
  - number: 47.1.c
    text: |-
      het toezicht op de naleving van het bij of krachtens de [Beginselenwet justitiële jeugdinrichtingen][ref1]
      bepaalde omtrent de kwaliteit van de justitiële jeugdinrichtingen;


      [ref1]: https://wetten.overheid.nl/BWBR0011756
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0011756
  - number: 47.1.d
    text: |-
      het toezicht op de naleving van [artikel 9 van de Wet Centraal Orgaan opvang asielzoekers][ref1],
      voor zover het betreft minderjarigen die onder toezicht staan van de rechtspersoon, bedoeld in
      [artikel 254, tweede lid][ref2], of die onder voogdij staan van de rechtspersoon, bedoeld in
      [artikel 302, tweede lid, van Boek 1 van het Burgerlijk Wetboek][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0006685#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel254
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel302
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0006685
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '254'
      - id: ref3
        bwb_id: BWBR0002656
        artikel: '302'
  - number: '47.2'
    text: Met de taken, bedoeld in het eerste lid, zijn belast de ambtenaren van de inspectie.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel47
  - number: '47.3'
    text: |-
      De toezichthouders beschikken niet over de bevoegdheden, genoemd in
      [artikel 5:18 van de Algemene wet bestuursrecht][ref1]. De [artikelen 5:12][ref2], [5:13][ref3], [5:15][ref4],
      [5:16][ref5], [5:17][ref6] en [5:20 van de Algemene wet bestuursrecht][ref7] zijn van overeenkomstige toepassing
      ten aanzien van de ambtenaren, belast met de taak bedoeld in het eerste lid, onder a.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref6]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref7]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref5
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref6
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref7
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '47.4'
    text: |-
      De ambtenaren van de inspectie nemen bij de vervulling van de taak, bedoeld in het eerste lid, onder a, de
      instructies van Onze Ministers en bij de vervulling van de taak, bedoeld in het eerste lid, onder b, de instructies
      van gedeputeerde staten van de betrokken provincie in acht. Bij de vervulling van de taken, bedoeld in het eerste
      lid, onder c en d, nemen zij de instructies van Onze Minister van Veiligheid en Justitie in acht.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel47
  - number: '47.5'
    text: |-
      De inspectie verricht onderzoeken als bedoeld in het eerste lid, onder a, uit eigen beweging of indien
      het onderzoeken betreft met betrekking tot de bureaus jeugdzorg en de jeugdzorg waarop ingevolge deze
      wet aanspraak bestaat, op verzoek van Onze Ministers en met betrekking tot de inrichtingen, bedoeld
      in [artikel 1, onder b, van de Beginselenwet justitiële jeugdinrichtingen][ref1] en de raad voor de
      kinderbescherming, op verzoek van Onze Minister van Veiligheid en Justitie. Onderzoeken in verband met de taak,
      bedoeld in het eerste lid, onder d, worden uit eigen beweging verricht of op verzoek van Onze Minister van
      Veiligheid en Justitie.


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel1
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '1'
  - number: '47.6'
    text: |-
      De inspectie verricht onderzoeken als bedoeld in het eerste lid onder b uit eigen beweging of op verzoek van
      gedeputeerde staten van de betrokken provincie.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel47
  - number: '47.7'
    text: |-
      De inspectie verricht onderzoeken als bedoeld in het eerste lid, onder c, uit eigen beweging of op verzoek van Onze
      Minister van Veiligheid en Justitie.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel47
  - number: '47.8'
    text: |-
      De inspectie brengt van haar bevindingen verslag uit aan degene bij wie het onderzoek is uitgevoerd en kan daarbij
      voorstellen doen tot verbetering van de kwaliteit. De inspectie stelt het betrokken overheidsorgaan schriftelijk op
      de hoogte van haar bevindingen.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel47
  - number: '47.9'
    text: |-
      De inspectie stelt gedeputeerde staten van haar bevindingen ten aanzien van bureaus jeugdzorg
      en zorgaanbieders op de hoogte indien zij van oordeel is, dat toepassing moet worden gegeven aan
      [artikel 16, eerste of zevende lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel16
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '16'
        hoofdstuk: III
        paragraaf: '3'
  - number: '47.10'
    text: |-
      Indien een organisatie van beoefenaren van een beroep in de jeugdzorg, een systeem van tuchtrecht heeft
      georganiseerd, zijn de ambtenaren van de Inspectie jeugdzorg bevoegd in het kader van dat systeem een tuchtklacht
      in te dienen. Bij algemene maatregel van bestuur kunnen ter zake nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel47
  - number: '47.11'
    text: |-
      De inspectie stelt jaarlijks een verslag op van haar werkzaamheden. In het verslag doet zij de voorstellen die zij
      in het belang van de jeugdzorg nodig acht. Het verslag wordt gezonden aan de provinciebesturen, Onze Ministers en
      de Tweede Kamer der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel47
  - number: '47.12'
    text: Onze Ministers kunnen regels stellen omtrent de organisatie van de inspectie.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel47
  - number: '48.1'
    text: |-
      De stichtingen en de zorgaanbieders verstrekken desgevraagd alle inlichtingen en leggen desgevraagd alle bescheiden
      die voor een juiste taakuitoefening noodzakelijk zijn te achten over aan de door gedeputeerde staten aangewezen
      ambtenaren die belast zijn met de controle op de rechtmatige en doelmatige besteding van de door gedeputeerde
      staten verleende subsidies.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel48
  - number: '48.2'
    text: |-
      De stichtingen en de zorgaanbieders verlenen de in het eerste lid bedoelde ambtenaren desgevraagd toegang tot de
      gebouwen waarin zij hun werkzaamheden verrichten.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel48
  - number: '48.3'
    text: |-
      Zij die uit hoofde van hun stand, beroep of ambt tot geheimhouding verplicht zijn, kunnen zich van het geven van
      inlichtingen of het overleggen van inzage verschonen, voor zover hun geheimhoudingsplicht zich daartoe uitstrekt.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel48
  - number: '48.4'
    text: |-
      In afwijking van het derde lid en van [artikel 5:20, tweede lid, van de Algemene wet bestuursrecht][ref1], zijn de
      door Onze Minister van Volksgezondheid, Welzijn en Sport aangewezen ambtenaren die belast zijn met de controle op
      de rechtmatige en doelmatige besteding van de door Onze Minister van Volksgezondheid, Welzijn en Sport verleende
      subsidies bevoegd tot inzage van cliëntdossiers, waaronder gegevens als bedoeld in [artikel 45, tweede lid][ref2],
      voor zover dat noodzakelijk is voor de controle op de rechtmatige en doelmatige besteding van subsidies die
      zijn verleend aan zorgaanbieders bij wie een machtiging ten uitvoer kan worden gelegd. Voor zover de betrokken
      beroepsbeoefenaar uit hoofde van zijn beroep tot geheimhouding van het dossier verplicht is, geldt gelijke
      verplichting voor de betrokken ambtenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0016637#Artikel45
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0016637
        artikel: '45'
        hoofdstuk: VII
  - number: '48.5'
    text: |-
      Op de verwerking van de gegevens, bedoeld in het vierde lid, is [artikel 45, derde lid][ref1], van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel45
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '45'
        hoofdstuk: VII
  - number: '48.6'
    text: |-
      Het eerste tot en met derde lid zijn van overeenkomstige toepassing op de subsidies, bedoeld in [artikel 38][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel38
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '38'
        hoofdstuk: VI
        paragraaf: '1'
  - number: '49'
    text: |-
      De stichtingen en de zorgaanbieders verstrekken aan de cliënt desgevraagd zo spoedig mogelijk inzage in en
      afschrift van de bescheiden die deze met betrekking tot de cliënt onder zich hebben.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel49
  - number: '50.1'
    text: 'Inzage in of afschrift van de bescheiden wordt aan de cliënt geweigerd, indien deze:'
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel50
  - number: 50.1.a
    text: jonger dan twaalf jaren is, of
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel50
  - number: 50.1.b
    text: |-
      de leeftijd van twaalf jaren heeft bereikt en niet in staat kan worden geacht tot een redelijke waardering van zijn
      belangen terzake.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel50
  - number: '50.2'
    text: |-
      Indien de cliënt jonger is dan zestien jaren, of de leeftijd van zestien jaar heeft bereikt en niet in staat
      kan worden geacht tot een redelijke waardering van zijn belangen ter zake, worden desgevraagd aan de wettelijke
      vertegenwoordiger inlichtingen dan wel inzage in of afschrift van de bescheiden verstrekt, tenzij het belang van de
      jeugdige zich daartegen verzet.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel50
  - number: '50.3'
    text: |-
      Inlichtingen over, inzage in of afschrift van bescheiden kan eveneens worden geweigerd, voor zover de persoonlijke
      levenssfeer van een ander dan de cliënt daardoor zou worden geschaad.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel50
  - number: '50.4'
    text: |-
      Voor de verstrekking van een afschrift kan een vergoeding worden gevraagd overeenkomstig de krachtens
      [artikel 39 van de Wet bescherming persoonsgegevens][ref1] gestelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel39
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '39'
  - number: '51.1'
    text: |-
      Onverminderd het bij of krachtens de wet bepaalde, verstrekken de stichting en de zorgaanbieder aan anderen dan de
      cliënt geen inlichtingen over de cliënt, dan wel inzage in of afschrift van de bescheiden dan met toestemming van
      de cliënt.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel51
  - number: '51.2'
    text: |-
      Indien de cliënt minderjarig is, is in plaats van diens toestemming de toestemming van zijn wettelijke
      vertegenwoordiger vereist, indien hij:
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel51
  - number: 51.2.a
    text: jonger is dan twaalf jaren, of
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel51
  - number: 51.2.b
    text: |-
      de leeftijd van twaalf jaren heeft bereikt en niet in staat kan worden geacht tot een redelijke waardering van zijn
      belangen terzake.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel51
  - number: '51.3'
    text: |-
      Onder anderen dan de cliënt zijn niet begrepen degenen van wie beroepshalve de medewerking bij de toegang tot en de
      uitvoering van de jeugdzorg noodzakelijk is, alsmede degenen die zijn betrokken bij de voorbereiding of uitvoering
      van de taken, bedoeld in [artikel 10, eerste lid, onder a tot en met d][ref1], doch slechts voor zover dit voor
      de medewerking bij de toegang, de uitvoering van de jeugdzorg of de voorbereiding of uitvoering van een maatregel
      noodzakelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel10
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '10'
        hoofdstuk: III
        paragraaf: '2'
  - number: '52.1'
    text: |-
      De stichtingen en de zorgaanbieders treffen een schriftelijke regeling waarin het recht op inzage in en
      afschrift van bescheiden, alsmede de beperkingen aan het verstrekken van inlichtingen en inzage worden geregeld
      overeenkomstig de [artikelen 49 tot en met 51][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel49
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '49'
        hoofdstuk: IX
  - number: '52.2'
    text: Deze regeling wordt aan de belanghebbenden beschikbaar gesteld.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel52
  - number: '53.1'
    text: |-
      De stichting kan, onverminderd de [Wet bescherming persoonsgegevens][ref1], in de gevallen,
      bedoeld in [artikel 7, zesde lid][ref2], of indien dit voor de uitoefening van de taken genoemd in
      [artikel 11, eerste lid][ref3], noodzakelijk is te achten, zonder toestemming van degene die het betreft
      persoonsgegevens verwerken.


      [ref1]: https://wetten.overheid.nl/BWBR0011468
      [ref2]: https://wetten.overheid.nl/BWBR0016637#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0016637#Artikel11
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0011468
      - id: ref2
        bwb_id: BWBR0016637
        artikel: '7'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0016637
        artikel: '11'
        hoofdstuk: III
        paragraaf: '2'
  - number: '53.2'
    text: |-
      De stichting kan zonder toestemming van degene die het betreft slechts bijzondere gegevens als bedoeld in
      [artikel 16 van de Wet bescherming persoonsgegevens][ref1] verwerken indien uit een melding redelijkerwijs
      een vermoeden van kindermishandeling kan worden afgeleid dan wel sprake is van een geval als bedoeld in
      [artikel 7, zesde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0016637#Artikel7
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '16'
      - id: ref2
        bwb_id: BWBR0016637
        artikel: '7'
        hoofdstuk: III
        paragraaf: '2'
  - number: '53.3'
    text: |-
      Degene die op grond van een wettelijk voorschrift of op grond van zijn ambt of beroep tot geheimhouding is
      verplicht kan, zonder toestemming van degene die het betreft, aan een stichting inlichtingen verstrekken, indien
      dit noodzakelijk kan worden geacht om een situatie van kindermishandeling te beëindigen of een redelijk vermoeden
      van kindermishandeling te onderzoeken.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel53
  - number: '54.1'
    text: |-
      Indien door de stichting bij de uitoefening van de taken, genoemd in [artikel 11, eerste lid][ref1],
      persoonsgegevens worden verkregen bij anderen dan degene die het betreft, brengt zij de betrokkene hiervan zo
      spoedig mogelijk, doch in ieder geval binnen vier weken na het moment van vastlegging van de hem betreffende
      gegevens, op de hoogte.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel11
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '11'
        hoofdstuk: III
        paragraaf: '2'
  - number: '54.2'
    text: |-
      De in het eerste lid genoemde termijn kan telkens met ten hoogste twee weken worden verlengd, voor zover
      dit noodzakelijk is voor de uitoefening van de taken, genoemd in [artikel 11, eerste lid][ref1], en dit
      noodzakelijk kan worden geacht om een situatie van kindermishandeling te beëindigen of een redelijk vermoeden van
      kindermishandeling te onderzoeken.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel11
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '11'
        hoofdstuk: III
        paragraaf: '2'
  - number: '54.3'
    text: |-
      In afwijking van [artikel 35 van de Wet bescherming persoonsgegevens][ref1] kan een stichting de mededeling aan
      degene die het betreft dat ten aanzien van hem persoonsgegevens worden verwerkt achterwege laten voor zover dit
      noodzakelijk kan worden geacht om een situatie van kindermishandeling te beëindigen of een redelijk vermoeden van
      kindermishandeling te onderzoeken.


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel35
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '35'
  - number: '55.1'
    text: |-
      Onverminderd het tweede lid en [artikel 56][ref1] bewaren de stichting en de zorgaanbieder bescheiden die deze met
      betrekking tot een cliënt onder zich hebben gedurende vijftien jaren, te rekenen van het tijdstip waarop zij zijn
      vervaardigd, of zoveel langer als redelijkerwijs in verband met een zorgvuldige hulpverlening noodzakelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel56
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '56'
        hoofdstuk: IX
  - number: '55.2'
    text: |-
      De stichting bewaart, voor zover deze de taken, bedoeld in [artikel 10, eerste lid, onder a, b, en e][ref1],
      uitoefent, de bescheiden tot het jongste kind van het gezin waartoe de jeugdige behoort en met welk gezin het
      bureau bemoeienis heeft gehad, meerderjarig is geworden, een en ander voor zover aannemelijk gemaakt kan worden dat
      het bewaren een bijdrage kan leveren aan het beëindigen van een mogelijke situatie van kindermishandeling, of van
      belang kan zijn voor een situatie waarin een maatregel met betrekking tot het gezag over een minderjarige overwogen
      dient te worden.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel10
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '10'
        hoofdstuk: III
        paragraaf: '2'
  - number: '56.1'
    text: |-
      De stichtingen en de zorgaanbieders vernietigen de door hen bewaarde bescheiden binnen drie maanden na een daartoe
      strekkend verzoek van degene op wie de bescheiden betrekking hebben.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel56
  - number: '56.2'
    text: |-
      Het eerste lid geldt niet voor zover het verzoek bescheiden betreft waarvan redelijkerwijs aannemelijk is dat
      de bewaring van aanmerkelijk belang is voor een ander dan de verzoeker, alsmede voor zover het bepaalde bij of
      krachtens de wet zich tegen vernietiging verzet.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel56
  - number: '56.3'
    text: 'Het verzoek van een cliënt wordt niet ingewilligd indien deze:'
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel56
  - number: 56.3.a
    text: jonger is dan twaalf jaren, of
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel56
  - number: 56.3.b
    text: |-
      de leeftijd van twaalf jaren heeft bereikt en niet in staat kan worden geacht tot een redelijke waardering van zijn
      belangen ter zake.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel56
  - number: '56.4'
    text: In de gevallen bedoeld in het derde lid, kan het verzoek door een wettelijke vertegenwoordiger worden gedaan.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel56
  - number: '57.1'
    text: |-
      Gedeputeerde staten dragen er zorg voor dat pleegouders en cliënten van het door de stichting in stand gehouden
      bureau jeugdzorg en van de zorgaanbieders een beroep kunnen doen op een vertrouwenspersoon.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel57
  - number: '57.2'
    text: |-
      De stichting en de zorgaanbieders stellen vertrouwenspersonen, werkzaam bij de rechtspersoon, bedoeld in
      [artikel 41, vierde lid][ref1], in de gelegenheid hun taak uit te oefenen.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel41
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '41'
        hoofdstuk: VI
        paragraaf: '2'
  - number: '57.3'
    text: |-
      Bij algemene maatregel van bestuur worden regels gegeven met betrekking tot de taken en bevoegdheden van de
      vertrouwenspersoon en de verplichtingen van de stichting en de zorgaanbieders.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel57
  - number: '58.1'
    text: |-
      De stichtingen en de zorgaanbieders, niet zijnde een zorgaanbieder als bedoeld in [artikel 18, tweede lid][ref1],
      stellen een cliëntenraad in, die binnen het kader van hun doelstelling de gemeenschappelijke belangen van de
      cliënten behartigt. De verplichting tot het instellen van een cliëntenraad geldt voor een zorgaanbieder ten
      aanzien van elke door hem in stand gehouden zorgeenheid. Een zorgaanbieder kan deze verplichting ook nakomen door
      instelling van een cliëntenraad die voor meer dan een door hem in stand gehouden zorgeenheid werkzaam is.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel18
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '18'
        hoofdstuk: IV
        paragraaf: '1'
  - number: '58.2'
    text: 'De stichtingen en de zorgaanbieders regelen schriftelijk:'
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel58
  - number: 58.2.a
    text: |-
      het aantal leden van de cliëntenraad, de wijze van benoeming, welke personen tot lid kunnen worden benoemd en de
      zittingsduur van de leden;
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel58
  - number: 58.2.b
    text: de materiële middelen waarover de cliëntenraad ten behoeve van zijn werkzaamheden kan beschikken.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel58
  - number: '58.3'
    text: 'De in het tweede lid bedoelde regeling is zodanig dat de cliëntenraad:'
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel58
  - number: 58.3.a
    text: redelijkerwijze representatief kan worden geacht voor de cliënten en
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel58
  - number: 58.3.b
    text: redelijkerwijze in staat kan worden geacht hun gemeenschappelijke belangen te behartigen.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel58
  - number: '58.4'
    text: |-
      In de cliëntenraad wordt voorzien in tenminste twee plaatsen voor jeugdigen, tenzij kan worden aangetoond dat dit
      niet aangewezen is.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel58
  - number: '58.5'
    text: De cliëntenraad regelt schriftelijk zijn werkwijze met inbegrip van zijn vertegenwoordiging in en buiten rechte.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel58
  - number: '58.6'
    text: |-
      De kosten van het door de cliëntenraad voeren van rechtsgedingen als bedoeld in [artikel 66, vierde lid][ref1],
      komen slechts ten laste van de stichting of de zorgaanbieder indien deze van de te maken kosten vooraf in kennis
      is gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel66
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '66'
        hoofdstuk: XI
        paragraaf: '1'
  - number: '58.7'
    text: |-
      Na vaststelling van de in het tweede lid bedoelde regeling treft de stichting of de zorgaanbieder de voorzieningen
      die op grond van die regeling noodzakelijk zijn voor de benoeming van de leden van de cliëntenraad. Zij treffen
      de bedoelde voorzieningen opnieuw telkens wanneer de cliëntenraad gedurende twee jaren niet heeft gefunctioneerd
      wegens het ontbreken van het in de regeling vastgestelde aantal leden.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel58
  - number: '59.1'
    text: |-
      De stichtingen en de zorgaanbieders stellen de cliëntenraad in ieder geval in de gelegenheid advies uit te
      brengen over elk voorgenomen besluit dat de stichting of een of meer der door een zorgaanbieder in stand gehouden
      zorgeenheden betreft, inzake:
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel59
  - number: 59.1.a
    text: een wijziging van de doelstelling of grondslag;
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel59
  - number: 59.1.b
    text: |-
      het overdragen van de zeggenschap of fusie of het aangaan of verbreken van de samenwerking met een andere
      zorgaanbieder;
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel59
  - number: 59.1.c
    text: |-
      de gehele of gedeeltelijke opheffing, verhuizing of ingrijpende verbouwing van de accommodatie waarin de zorg wordt
      geboden;
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel59
  - number: 59.1.d
    text: een belangrijke wijziging in de organisatie;
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel59
  - number: 59.1.e
    text: een belangrijke inkrimping, uitbreiding of andere wijziging van de werkzaamheden;
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel59
  - number: 59.1.f
    text: het benoemen van personen die rechtstreeks de hoogste zeggenschap zullen uitoefenen bij de leiding van de arbeid;
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel59
  - number: 59.1.g
    text: de begroting en de jaarrekening;
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel59
  - number: 59.1.h
    text: het algemeen beleid inzake de toelating van cliënten en de beëindiging van de hulpverlening aan cliënten;
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel59
  - number: 59.1.i
    text: |-
      voedingsaangelegenheden van algemene aard en het algemene beleid op het gebied van de veiligheid, de gezondheid of
      de hygiëne en de geestelijke verzorging van en de maatschappelijke bijstand aan cliënten;
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel59
  - number: 59.1.j
    text: |-
      de systematische bewaking, beheersing of verbetering van de kwaliteit met betrekking tot de aspecten: te hanteren
      methodieken, organisatie, professionaliteit en materiële voorzieningen;
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel59
  - number: 59.1.k
    text: |-
      de vaststelling of wijziging van een regeling inzake de behandeling van klachten van cliënten en het aanwijzen van
      personen die belast worden met de behandeling van klachten;
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel59
  - number: 59.1.l
    text: |-
      wijziging van de regeling, bedoeld in [artikel 58, tweede lid][ref1], en de vaststelling of wijziging van andere
      voor cliënten geldende regelingen;


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel58
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '58'
        hoofdstuk: XI
        paragraaf: '1'
  - number: 59.1.m
    text: recreatiemogelijkheden en ontspanningsactiviteiten voor jeugdigen;
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel59
  - number: 59.1.n
    text: |-
      wijziging van een werkplan, voor zover het aangelegenheden betreft die niet reeds zijn begrepen onder a tot en met
      k en m en o;
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel59
  - number: 59.1.o
    text: |-
      het belasten van personen met de leiding van een onderdeel van het zorgaanbod, waarin gedurende het etmaal zorg
      wordt verleend aan jeugdigen die in de regel in de zorgeenheid verblijven.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel59
  - number: '59.2'
    text: Het advies wordt op een zodanig tijdstip gevraagd dat het wezenlijk van invloed kan zijn op het te nemen besluit.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel59
  - number: '59.3'
    text: |-
      De cliëntenraad is bevoegd de stichting of de zorgaanbieder ook ongevraagd te adviseren inzake de in het eerste lid
      genoemde en andere onderwerpen, die voor de cliënten van belang zijn.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel59
  - number: '59.4'
    text: |-
      Ingeval een zorgaanbieder meer dan een cliëntenraad heeft ingesteld en bovendien één cliëntenraad die alle door
      hem in stand gehouden zorgeenheden omvat, bevat de regeling, bedoeld in [artikel 58, tweede lid][ref1], tevens
      een voorziening waardoor de in dit hoofdstuk bedoelde verplichtingen en bevoegdheden slechts behoeven te worden
      nagekomen jegens en kunnen worden uitgeoefend door één cliëntenraad.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel58
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '58'
        hoofdstuk: XI
        paragraaf: '1'
  - number: '60.1'
    text: |-
      De stichtingen en de zorgaanbieders nemen geen van een schriftelijk uitgebracht advies afwijkend besluit dan nadat
      daarover, voor zover dat redelijkerwijs mogelijk is, ten minste eenmaal met de cliëntenraad overleg is gepleegd.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel60
  - number: '60.2'
    text: |-
      De stichtingen en de zorgaanbieders doen van een besluit inzake een onderwerp waarover de cliëntenraad schriftelijk
      advies heeft uitgebracht, schriftelijk, en voor zover zij van het advies afwijken onder opgave van redenen,
      mededeling aan de cliëntenraad.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel60
  - number: '61.1'
    text: |-
      De stichtingen en de zorgaanbieders verstrekken de cliëntenraad tijdig, en desgevraagd, schriftelijk alle
      inlichtingen en gegevens die deze voor de vervulling van zijn taak redelijkerwijs nodig heeft.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel61
  - number: '61.2'
    text: |-
      Zij verstrekken de cliëntenraad voorts tenminste eenmaal per jaar mondeling of schriftelijk algemene gegevens
      omtrent het beleid dat in het verstreken tijdvak is gevoerd en in het komende jaar zal worden gevoerd.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel61
  - number: '62.1'
    text: |-
      De stichtingen en de zorgaanbieders kunnen aan de cliëntenraad schriftelijk verdergaande bevoegdheden dan de in dit
      hoofdstuk genoemde bevoegdheden toekennen.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel62
  - number: '62.2'
    text: |-
      Zij stellen de cliëntenraad in de gelegenheid advies uit te brengen over een voornemen een besluit te nemen
      als bedoeld in het eerste lid en over het voornemen een zodanig besluit te wijzigen. [Artikel 60][ref1] is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel60
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '60'
        hoofdstuk: XI
        paragraaf: '1'
  - number: '63.1'
    text: |-
      De stichtingen en de zorgaanbieders die rechtspersoon zijn als bedoeld in
      [artikel 3 van boek 2 van het Burgerlijk Wetboek][ref1], voorzien in de statuten in een regeling die waarborgt
      dat de cliënten invloed kunnen uitoefenen op de samenstelling van het bestuur. De regeling houdt ten minste in
      dat één bestuurslid wordt benoemd op bindende voordracht van de cliëntenraad of cliëntenraden, tenzij deze van de
      mogelijkheid een voordracht te doen geen gebruik heeft onderscheidenlijk hebben gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel3
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '3'
  - number: '63.2'
    text: |-
      Het eerste lid is niet van toepassing als het bestuur bestaat uit één of meer personen die deze functie uitoefent
      onderscheidenlijk uitoefenen op grond van een arbeidsrelatie waaraan een geldelijke beloning is verbonden. In dat
      geval is het eerste lid van overeenkomstige toepassing op de samenstelling van het orgaan dat belast is met het
      toezicht op of de goedkeuring van besluiten van het bestuur.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel63
  - number: '64'
    text: |-
      De stichtingen en de zorgaanbieders stellen jaarlijks een schriftelijk verslag op over de wijze waarop door hen dit
      hoofdstuk is toegepast.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel64
  - number: '65.1'
    text: 'De stichtingen en de zorgaanbieders maken binnen tien dagen na vaststelling openbaar:'
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel65
  - number: 65.1.a
    text: het jaarverslag;
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel65
  - number: 65.1.b
    text: |-
      op schrift gestelde uitgangspunten voor het beleid, waaronder begrepen de algemene criteria, welke bij de
      uitvoering van de taken onderscheidenlijk de zorgverlening worden gehanteerd;
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel65
  - number: 65.1.c
    text: |-
      de notulen dan wel de besluitenlijst van de vergaderingen van het bestuur dan wel in de gevallen bedoeld in
      [artikel 63, tweede lid][ref1], van het daar bedoelde orgaan, voor zover deze algemene beleidszaken betreffen;


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel63
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '63'
        hoofdstuk: XI
        paragraaf: '1'
  - number: 65.1.d
    text: |-
      een regeling inzake de behandeling van klachten en van andere voor cliënten geldende regelingen, alsmede een
      regeling als bedoeld in [artikel 58, tweede lid][ref1] en [artikel 66a][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel58
      [ref2]: https://wetten.overheid.nl/BWBR0016637#Artikel66a
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '58'
        hoofdstuk: XI
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0016637
        artikel: 66a
        hoofdstuk: XI
        paragraaf: '2'
  - number: 65.1.e
    text: |-
      het verslag, bedoeld in [artikel 64][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel64
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '64'
        hoofdstuk: XI
        paragraaf: '1'
  - number: '65.2'
    text: |-
      De openbaarmaking geschiedt door de stukken voor cliënten en pleegouders ter inzage te leggen en hun op verzoek
      daarvan afschriften te verstrekken.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel65
  - number: '65.3'
    text: |-
      Van de terinzagelegging wordt mededeling gedaan op de bij de stichting of de zorgaanbieder voor het doen van
      mededelingen aan cliënten en pleegouders gebruikelijke wijze.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel65
  - number: '65.4'
    text: |-
      Voor het op verzoek verstrekken van afschriften kan een tarief in rekening worden gebracht, ten hoogste gelijk aan
      de kostprijs, tenzij de Wet openbaarheid van bestuur van toepassing is.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel65
  - number: '66.1'
    text: |-
      De stichtingen en de zorgaanbieders stellen in overeenstemming met de cliëntenraad of cliëntenraden een uit drie
      leden bestaande commissie van vertrouwenslieden in, waarvan één lid door henzelf wordt aangewezen, één lid door de
      cliëntenraad of cliëntenraden kan worden aangewezen en één lid door beide gezamenlijk wordt aangewezen.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel66
  - number: '66.2'
    text: |-
      De vertrouwenscommissie heeft tot taak te bemiddelen en zonodig een bindende uitspraak te doen op verzoek
      van de cliëntenraad, indien de stichting of de zorgaanbieder ten aanzien van een onderwerp, genoemd in
      [artikel 59 eerste lid, onder k en l][ref1], waarover de cliëntenraad schriftelijk advies heeft uitgebracht, een
      van dat advies afwijkend besluit wenst te nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel59
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '59'
        hoofdstuk: XI
        paragraaf: '1'
  - number: '66.3'
    text: |-
      De stichtingen en de zorgaanbieders kunnen, in afwijking van het eerste lid, een door een of meer
      cliëntenorganisaties, een of meer stichtingen of een of meer organisaties van zorgaanbieders ingestelde commissie
      van vertrouwenslieden aanwijzen voor de vervulling van de in het tweede lid bedoelde taak.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel66
  - number: '66.4'
    text: |-
      De cliëntenraad en iedere cliënt van de stichting of de zorgaanbieder kan de kantonrechter van de rechtbank van
      het arrondissement waarin de woonplaats van de stichting of de zorgaanbieder is gelegen, schriftelijk verzoeken de
      stichting of de zorgaanbieder te bevelen de [artikelen 58][ref1], [61, tweede lid][ref2], [63][ref3] en [65][ref4]
      en het eerste lid, na te leven. Een verzoeker die niet vooraf schriftelijk aan de stichting of de zorgaanbieder
      heeft verzocht te handelen overeenkomstig hetgeen in het verzoekschrift wordt verzocht en deze daarbij niet een
      redelijke termijn heeft gegeven om aan dat verzoek te voldoen, wordt niet-ontvankelijk verklaard.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel58
      [ref2]: https://wetten.overheid.nl/BWBR0016637#Artikel61
      [ref3]: https://wetten.overheid.nl/BWBR0016637#Artikel63
      [ref4]: https://wetten.overheid.nl/BWBR0016637#Artikel65
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '58'
        hoofdstuk: XI
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0016637
        artikel: '61'
        hoofdstuk: XI
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0016637
        artikel: '63'
        hoofdstuk: XI
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0016637
        artikel: '65'
        hoofdstuk: XI
        paragraaf: '1'
  - number: '66.5'
    text: |-
      De kantonrechter kan in zijn beschikking aan de stichting of de zorgaanbieder de verplichting opleggen bepaalde
      handelingen te verrichten of na te laten.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel66
  - number: '66.6'
    text: |-
      De [derde titel van het eerste boek van het Wetboek van Burgerlijke Rechtsvordering][ref1] is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0001827
  - number: 66a.1
    text: |-
      De zorgaanbieder die pleegzorg biedt, stelt een pleegouderraad in, die binnen het kader van zijn doelstelling
      de gemeenschappelijke belangen van de pleegouders behartigt. Een zorgaanbieder die pleegzorg biedt, kan deze
      verplichting ook nakomen door instelling van een pleegouderraad die voor meer dan een door hem in stand gehouden
      zorgeenheid werkzaam is.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel66a
  - number: 66a.2
    text: 'De zorgaanbieders die pleegzorg bieden, regelen schriftelijk:'
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel66a
  - number: 66a.2.a
    text: |-
      het aantal leden van de pleegouderraad, de wijze van benoeming, welke personen tot lid kunnen worden benoemd en de
      zittingsduur van de leden;
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel66a
  - number: 66a.2.b
    text: de materiële middelen waarover de pleegouderraad ten behoeve van zijn werkzaamheden kan beschikken.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel66a
  - number: 66a.3
    text: 'De in het tweede lid bedoelde regeling is zodanig dat de pleegouderraad:'
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel66a
  - number: 66a.3.a
    text: |-
      redelijkerwijze representatief kan worden geacht voor de bij de zorgaanbieder die pleegzorg biedt betrokken
      pleegouders; en
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel66a
  - number: 66a.3.b
    text: redelijkerwijze in staat kan worden geacht hun gemeenschappelijke belangen te behartigen.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel66a
  - number: 66a.4
    text: De pleegouderraad regelt schriftelijk zijn werkwijze met inbegrip van zijn vertegenwoordiging in en buiten rechte.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel66a
  - number: 66a.5
    text: |-
      Op door de pleegouderraad te voeren rechtsgedingen, is [artikel 66, vierde lid][ref1] van overeenkomstige
      toepassing. De kosten hiervan komen slechts ten laste van de zorgaanbieder die pleegzorg biedt, indien deze van de
      te maken kosten vooraf in kennis is gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel66
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel66a
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '66'
        hoofdstuk: XI
        paragraaf: '1'
  - number: 66a.6
    text: |-
      Na vaststelling van de in het tweede lid bedoelde regeling treft de zorgaanbieder die pleegzorg biedt de
      voorzieningen die op grond van die regeling noodzakelijk zijn voor de benoeming van de leden van de pleegouderraad.
      Zij treffen de bedoelde voorzieningen opnieuw telkens wanneer de pleegouderraad gedurende twee jaar niet heeft
      gefunctioneerd wegens het ontbreken van het in de regeling vastgestelde aantal leden.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel66a
  - number: 66b.1
    text: |-
      De zorgaanbieders die pleegzorg bieden, stellen de pleegouderraad in ieder geval in de gelegenheid advies uit te
      brengen over elk voorgenomen besluit dat een of meer van de door een zorgaanbieder in stand gehouden zorgeenheden
      betreft, voor zover van invloed op pleegzorg inzake:
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel66b
  - number: 66b.1.a
    text: |-
      het overdragen van de zeggenschap of fusie of het aangaan of verbreken van de samenwerking met een andere
      zorgaanbieder;
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel66b
  - number: 66b.1.b
    text: een belangrijke wijziging in de organisatie van de zorgaanbieder, voor zover met betrekking tot pleegzorg;
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel66b
  - number: 66b.1.c
    text: |-
      een belangrijke inkrimping, uitbreiding of andere wijziging van de werkzaamheden van de zorgaanbieder, voor zover
      met betrekking tot pleegzorg;
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel66b
  - number: 66b.1.d
    text: de begroting en de jaarrekening van de zorgaanbieder;
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel66b
  - number: 66b.1.e
    text: |-
      het beleid van de zorgaanbieder inzake de toelating van cliënten en de beëindiging van de hulpverlening aan
      cliënten, voor zover met betrekking tot pleegzorg;
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel66b
  - number: 66b.1.f
    text: |-
      de systematische bewaking, beheersing of verbetering van de kwaliteit door de zorgaanbieder met betrekking tot
      de aspecten: te hanteren methodieken, organisatie, professionaliteit en materiële voorzieningen, voor zover met
      betrekking tot pleegzorg;
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel66b
  - number: 66b.1.g
    text: |-
      wijziging van een werkplan van de zorgaanbieder voor zover met betrekking tot pleegzorg, voor zover het
      aangelegenheden betreft die niet reeds hierboven zijn genoemd.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel66b
  - number: 66b.2
    text: Het advies wordt op een zodanig tijdstip gevraagd dat het wezenlijk van invloed kan zijn op het te nemen besluit.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel66b
  - number: 66b.3
    text: |-
      De pleegouderraad is bevoegd de zorgaanbieder die pleegzorg biedt ook ongevraagd te adviseren inzake de in het
      eerste lid genoemde en andere onderwerpen, die voor de pleegouders van belang zijn.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel66b
  - number: 66b.4
    text: |-
      Ingeval een zorgaanbieder die pleegzorg biedt meer dan één pleegouderraad heeft ingesteld en bovendien
      één pleegouderraad die alle door hem in stand gehouden zorgeenheden omvat, bevat de regeling, bedoeld in
      [artikel 66a, tweede lid][ref1], tevens een voorziening waardoor de in dit hoofdstuk bedoelde verplichtingen en
      bevoegdheden slechts behoeven te worden nagekomen jegens en kunnen worden uitgeoefend door één pleegouderraad.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel66a
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel66b
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: 66a
        hoofdstuk: XI
        paragraaf: '2'
  - number: 66c
    text: |-
      De zorgaanbieders die pleegzorg bieden, vragen de voorafgaande instemming van de pleegouderraad voor elk door de
      zorgaanbieders die pleegzorg bieden te nemen besluit met betrekking tot in ieder geval de volgende aangelegenheden:
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel66c
  - number: 66c.a
    text: |-
      de vaststelling of wijziging van een regeling inzake de behandeling van klachten van pleegouders en het aanwijzen
      van personen die belast worden met de behandeling van klachten;
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel66c
  - number: 66c.b
    text: de vaststelling of wijziging van voor pleegouders geldende reglementen;
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel66c
  - number: 66c.c
    text: |-
      vaststelling of wijziging van een regeling over het verwerken van en de bescherming van persoonsgegevens van
      jeugdigen aan wie pleegouders pleegzorg bieden en pleegouders.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel66c
  - number: 66d.1
    text: |-
      De zorgaanbieders die pleegzorg bieden, stellen in overeenstemming met de pleegouderraad of pleegouderraden een
      uit drie leden bestaande commissie van vertrouwenslieden in, waarvan één lid door henzelf wordt aangewezen, één lid
      door de pleegouderraad of pleegouderraden kan worden aangewezen en één lid door beide gezamenlijk wordt aangewezen.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel66d
  - number: 66d.2
    text: |-
      De vertrouwenscommissie, bedoeld in het eerste lid, heeft op verzoek van de zorgaanbieder die pleegzorg biedt
      tot taak te bemiddelen en zonodig een bindende uitspraak te doen, indien die zorgaanbieder ten aanzien van een te
      nemen, na overleg al dan niet gewijzigd, besluit dat ingevolge [artikel 66c][ref1] instemming behoeft, de vereiste
      instemming niet heeft verworven en die zorgaanbieder zijn voorstel wenst te handhaven.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel66c
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel66d
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: 66c
        hoofdstuk: XI
        paragraaf: '2'
  - number: 66e.1
    text: |-
      Indien aan een te nemen besluit van de zorgaanbieder die pleegzorg biedt de instemming, vereist ingevolge
      [artikel 66c][ref1], is onthouden, deelt die zorgaanbieder binnen drie maanden na het onthouden van instemming
      aan de pleegouderraad mee, of het voorstel wordt ingetrokken dan wel wordt voorgelegd aan de vertrouwenscommissie,
      bedoeld in [artikel 66d, eerste lid][ref2]. Indien deze mededeling niet binnen drie maanden wordt gedaan of het
      voorstel niet binnen zes weken na de mededeling aan de pleegouderraad aan de vertrouwenscommissie wordt voorgelegd,
      vervalt het voorstel.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel66c
      [ref2]: https://wetten.overheid.nl/BWBR0016637#Artikel66d
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel66e
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: 66c
        hoofdstuk: XI
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0016637
        artikel: 66d
        hoofdstuk: XI
        paragraaf: '2'
  - number: 66e.2
    text: |-
      De zorgaanbieder die pleegzorg biedt, doet een verzoek als bedoeld in [artikel 66d, tweede lid][ref1], onder
      overlegging van de door die zorgaanbieder gemaakte afweging van de belangen die daarbij voor die zorgaanbieder
      onderscheidenlijk de pleegouderraad aan de orde zijn. De vertrouwenscommissie stelt de pleegouderraad in de
      gelegenheid om zijn argumenten voor het onthouden van zijn instemming bij de vertrouwenscommissie naar voren te
      brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel66d
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel66e
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: 66d
        hoofdstuk: XI
        paragraaf: '2'
  - number: 66e.3
    text: |-
      De vertrouwenscommissie kan een bemiddelingsvoorstel voorleggen aan de zorgaanbieder die pleegzorg biedt en
      de pleegouderraad, tenzij die zorgaanbieder of de pleegouderraad te kennen geven daarop geen prijs te stellen.
      Indien de vertrouwenscommissie van deze bevoegdheid geen gebruik maakt of indien haar voorstel niet de instemming
      heeft van de zorgaanbieder die pleegzorg biedt of de pleegouderraad, beoordeelt de vertrouwenscommissie of de
      pleegouderraad in redelijkheid tot het onthouden van instemming heeft kunnen komen of dat sprake is van bepaalde
      zwaarwegende omstandigheden die het voorstel van de zorgaanbieder die pleegzorg biedt rechtvaardigen.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel66e
  - number: 66f
    text: |-
      De [artikelen 60 tot en met 64][ref1] en [artikel 66, derde tot en met zesde lid][ref2], zijn van overeenkomstige
      toepassing op zorgaanbieders die pleegzorg bieden ten aanzien van pleegouderraden, met dien verstande dat in
      artikel 66, vierde lid, in plaats van [artikel 58][ref3] wordt gelezen: [artikel 66a][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel60
      [ref2]: https://wetten.overheid.nl/BWBR0016637#Artikel66
      [ref3]: https://wetten.overheid.nl/BWBR0016637#Artikel58
      [ref4]: https://wetten.overheid.nl/BWBR0016637#Artikel66a
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel66f
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '60'
        hoofdstuk: XI
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0016637
        artikel: '66'
        hoofdstuk: XI
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0016637
        artikel: '58'
        hoofdstuk: XI
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0016637
        artikel: 66a
        hoofdstuk: XI
        paragraaf: '2'
  - number: '67.1'
    text: 'In dit hoofdstuk wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel67
  - number: 67.1.a
    text: |-
      klager: degene die als zodanig is aangewezen in de regeling, bedoeld in [artikel 68][ref1] doch in ieder geval
      een cliënt;


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel68
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '68'
        hoofdstuk: XII
  - number: 67.1.b
    text: |-
      gedraging: enig handelen of nalaten alsmede het nemen van een besluit dat gevolgen heeft voor een onder a, bedoelde
      persoon.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel67
  - number: '67.2'
    text: |-
      [Titel 9.1 van de Algemene wet bestuursrecht][ref1] is niet van toepassing op klachten als bedoeld in
      [artikel 68, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537
      [ref2]: https://wetten.overheid.nl/BWBR0016637#Artikel68
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0005537
      - id: ref2
        bwb_id: BWBR0016637
        artikel: '68'
        hoofdstuk: XII
  - number: '68.1'
    text: |-
      De stichtingen en de zorgaanbieders treffen een regeling voor de behandeling van klachten over gedragingen van
      hen of van voor hen werkzame personen jegens jeugdigen of jegens hun ouders, voogden, stiefouders, anderen die een
      jeugdige als behorende tot hun gezin verzorgen en opvoeden of degenen die anders dan als ouder samen met de ouder
      het gezag over de jeugdige uitoefenen. Zij brengen de regeling op passende wijze onder de aandacht van in ieder
      geval degenen die als klager zijn aangewezen.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel68
  - number: '68.2'
    text: 'De in het eerste lid bedoelde regeling:'
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel68
  - number: 68.2.a
    text: |-
      voorziet erin dat de klachten worden behandeld door een uit ten minste drie leden bestaande klachtencommissie,
      welke personen niet werkzaam zijn voor of bij de stichting of de zorgaanbieder;
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel68
  - number: 68.2.b
    text: |-
      waarborgt dat de klachtencommissie binnen zes weken na ontvangst van de klacht de klager, degene over wie
      is geklaagd en, indien dit niet dezelfde persoon is, de stichting of de zorgaanbieder, schriftelijk en met
      redenen omkleed in kennis stelt van haar oordeel over de gegrondheid van de klacht, al dan niet vergezeld van
      aanbevelingen;
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel68
  - number: 68.2.c
    text: |-
      waarborgt dat bij afwijking van de onder b bedoelde termijn de klachtencommissie daarvan met redenen omkleed
      mededeling doet aan de klager, degene over wie is geklaagd en, indien dit niet dezelfde persoon is, de stichting
      of de zorgaanbieder, onder vermelding van de termijn waarbinnen de klachtencommissie haar oordeel over de klacht
      zal uitbrengen;
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel68
  - number: 68.2.d
    text: |-
      waarborgt dat de klager en degene over wie is geklaagd, door de klachtencommissie in de gelegenheid worden gesteld
      mondeling of schriftelijk een toelichting te geven op de gedraging waarover is geklaagd;
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel68
  - number: 68.2.e
    text: |-
      waarborgt dat de klager en degene over wie is geklaagd, zich bij de behandeling van de klacht kunnen laten
      bijstaan.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel68
  - number: '68.3'
    text: |-
      De stichtingen en de zorgaanbieders zien erop toe dat de klachtencommissie, bedoeld in het tweede lid, onder a,
      haar werkzaamheden verricht volgens een door deze commissie op te stellen reglement.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel68
  - number: '68.4'
    text: |-
      Door of namens een klager kan bij de klachtencommissie, bedoeld in het tweede lid, onder a, een klacht tegen een
      stichting of zorgaanbieder worden ingediend over een gedraging van hen of van voor hen werkzame personen jegens
      de klager.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel68
  - number: '68.5'
    text: |-
      De stichting of de zorgaanbieder deelt de klager en de klachtencommissie, bedoeld in het tweede lid, onder a,
      binnen vier weken na ontvangst van het in het tweede lid, onder b, bedoelde oordeel van de klachtencommissie
      schriftelijk mede of hij het oordeel van de commissie over de gegrondheid van de klacht deelt en of hij naar
      aanleiding van dat oordeel maatregelen zal nemen en zo ja welke. Bij afwijking van de in de eerste volzin
      bedoelde termijn, doet de stichting of de zorgaanbieder daarvan met redenen omkleed mededeling aan de klager en de
      klachtencommissie onder vermelding van de termijn waarbinnen de stichting of de zorgaanbieder zijn standpunt aan
      hen kenbaar zal maken, met dien verstande dat dit uitstel ten hoogste vier weken is.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel68
  - number: '68.6'
    text: |-
      In afwijking van het vierde lid, kan bij de klachtencommissie, bedoeld in het tweede lid, onder a, eveneens
      een klacht tegen een stichting of een zorgaanbieder worden ingediend over een gedraging van hen of van voor hen
      werkzame personen, jegens een persoon, als bedoeld in [artikel 67, eerste lid, onder a][ref1], die inmiddels is
      overleden.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel67
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '67'
        hoofdstuk: XII
  - number: '68.7'
    text: |-
      De stichting en de zorgaanbieder dragen er zorg voor dat over elk kalenderjaar een openbaar verslag wordt opgesteld
      waarin worden aangegeven:
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel68
  - number: 68.7.a
    text: een beknopte beschrijving van de regeling, bedoeld in het eerste lid;
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel68
  - number: 68.7.b
    text: de wijze waarop de stichting en de zorgaanbieder die regeling onder de aandacht van hun cliënten hebben gebracht;
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel68
  - number: 68.7.c
    text: de samenstelling van de klachtencommissie, bedoeld in het tweede lid, onder a;
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel68
  - number: 68.7.d
    text: |-
      in welke mate die klachtencommissie haar werkzaamheden heeft kunnen verrichten met inachtneming van de waarborgen,
      bedoeld in het tweede lid;
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel68
  - number: 68.7.e
    text: het aantal en de aard van de door die klachtencommissie behandelde klachten;
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel68
  - number: 68.7.f
    text: de strekking van de oordelen en aanbevelingen van die klachtencommissie;
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel68
  - number: 68.7.g
    text: de aard van de maatregelen, bedoeld in het vijfde lid.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel68
  - number: '68.8'
    text: Bij regeling van Onze Ministers kunnen nadere regels worden gesteld met betrekking tot het verslag.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel68
  - number: '68.9'
    text: |-
      De stichting en de zorgaanbieder zenden het verslag voor 1 juni van het daaropvolgende kalenderjaar aan
      gedeputeerde staten, aan de inspectie en aan de betrokken cliëntenorganisaties.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel68
  - number: 68a
    text: |-
      De [artikelen 67][ref1] en [68][ref2] zijn van overeenkomstige toepassing op zorgaanbieders die pleegzorg bieden
      jegens pleegouders.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel67
      [ref2]: https://wetten.overheid.nl/BWBR0016637#Artikel68
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel68a
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '67'
        hoofdstuk: XII
      - id: ref2
        bwb_id: BWBR0016637
        artikel: '68'
        hoofdstuk: XII
  - number: '69.1'
    text: |-
      De onderhoudsplichtige ouders, degene tegen wie een op [artikel 394 van Boek 1 van het Burgerlijk Wetboek][ref1]
      gegrond verzoek is toegewezen daaronder begrepen, de onderhoudsplichtige stiefouder van een jeugdige en
      degene die anders dan als ouder samen met de ouder het gezag uitoefent over een jeugdige, zijn aan het Rijk
      een bijdrage verschuldigd in de kosten van aan een jeugdige geboden jeugdzorg van een bij algemene maatregel
      van bestuur aangewezen vorm die verzorging en verblijf omvat, waarop hij ingevolge deze wet aanspraak heeft
      of in de kosten van verblijf in een justitiële jeugdinrichting van een jeugdige die met toepassing van
      [artikel 261, vijfde lid, van Boek 1 van het Burgerlijk Wetboek][ref2] aldaar is geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel394
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel261
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '394'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '261'
  - number: '69.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent de hoogte van de bijdrage, die naar
      de leeftijd van de jeugdige en de aard van de zorg kan verschillen.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel69
  - number: '69.3'
    text: |-
      Indien ten aanzien van een jeugdige meer dan één persoon de ouderbijdrage verschuldigd is, is ieder der
      bijdrageplichtigen de ouderbijdrage verschuldigd met dien verstande dat, indien de een heeft betaald, de ander
      is bevrijd.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel69
  - number: '71.1'
    text: 'Geen ouderbijdrage is verschuldigd indien:'
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel71
  - number: 71.1.a
    text: de jeugdige met het oog op adoptie niet meer door zijn ouders wordt verzorgd en opgevoed;
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel71
  - number: 71.1.b
    text: de ouders van het gezag over de jeugdige zijn ontheven of ontzet;
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel71
  - number: 71.1.c
    text: |-
      het verblijf en de verzorging worden geboden in een acute noodsituatie, zulks voor de duur van ten hoogste zes
      weken.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel71
  - number: '71.2'
    text: |-
      Geen ouderbijdrage is verschuldigd door de ouder of stiefouder ten aanzien van wie de rechter op
      de voet van de [artikelen 406][ref1] en [407 van Boek 1 van het Burgerlijk Wetboek][ref2] of van
      [artikel 822, eerste lid, onder c, van het Wetboek van Burgerlijke Rechtsvordering][ref3] een bedrag heeft bepaald
      dat hij periodiek moet betalen ter voorziening in de kosten van verzorging en opvoeding van zijn kind of stiefkind.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel406
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel407
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel822
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '406'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '407'
      - id: ref3
        bwb_id: BWBR0001827
        artikel: '822'
  - number: '72'
    text: |-
      Indien bijdrageplichtige ouders of stiefouders gescheiden wonen en er geen bedrag is bepaald op
      de voet van de [artikelen 406][ref1] of [407 van Boek 1 van het Burgerlijk Wetboek][ref2] of van
      [artikel 822, eerste lid, onder c, van het Wetboek van Burgerlijke Rechtsvordering][ref3], is de ouder of
      stiefouder die ingevolge de [Algemene Kinderbijslagwet][ref4] onmiddellijk voorafgaande aan de aanvang van de zorg
      recht op kinderbijslag heeft, de ouderbijdrage verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel406
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel407
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel822
      [ref4]: https://wetten.overheid.nl/BWBR0002368
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '406'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '407'
      - id: ref3
        bwb_id: BWBR0001827
        artikel: '822'
      - id: ref4
        bwb_id: BWBR0002368
  - number: '73'
    text: De ouderbijdrage wordt vastgesteld en geïnd door het Landelijk Bureau Inning Onderhoudsbijdragen.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel73
  - number: 73a
    text: |-
      Het Landelijk Bureau Inning Onderhoudsbijdragen kan in bij algemene maatregel van bestuur aan te wijzen gevallen
      bepalen dat de verschuldigde ouderbijdrage, bedoeld in [artikel 69, eerste lid][ref1], buiten invordering wordt
      gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel69
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel73a
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '69'
        hoofdstuk: XIII
  - number: '74.1'
    text: |-
      De bijdrageplichtige, bedoeld in [artikel 69, eerste lid][ref1], is verplicht aan het Landelijk Bureau Inning
      Onderhoudsbijdragen desgevraagd alle inlichtingen te geven die nodig zijn voor de vaststelling en inning van de
      ouderbijdrage.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel69
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '69'
        hoofdstuk: XIII
  - number: '74.2'
    text: |-
      De inlichtingen moeten, indien dit wordt verzocht, schriftelijk worden verstrekt binnen een door degene die belast
      is met de vaststelling en de inning van de bijdrage schriftelijk te stellen, redelijke termijn.
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel74
  - number: '102.1'
    text: |-
      Elke voogdij en voorlopige voogdij, opgedragen aan een rechtspersoon die op grond van
      [artikel 60, eerste lid, onder a, van de Wet op de jeugdhulpverlening][ref1] aanvaard is als voogdij-
      instelling en die op het tijdstip van inwerkingtreding van deze wet als de in [artikel 4, eerste lid][ref2],
      bedoelde stichting wordt aangemerkt, berust met ingang van dat tijdstip bij die stichting. Een voogdij en
      een voorlopige voogdij, opgedragen aan een andere rechtspersoon dan die bedoeld in de eerste volzin, gaat
      van rechtswege over op de stichting in de provincie waar de minderjarige woonplaats heeft. Overgang van de
      voogdijen en de voorlopige voogdijen geschiedt niet met betrekking tot die welke de rechtspersoon, bedoeld in
      [artikel 302, tweede lid, van Boek 1 van het Burgerlijk Wetboek][ref3] op het tijdstip van inwerkingtreding van
      deze wet uitoefent.


      [ref1]: https://wetten.overheid.nl/BWBR0004608#Artikel60
      [ref2]: https://wetten.overheid.nl/BWBR0016637#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel302
    url: https://wetten.overheid.nl/BWBR0016637/2014-11-01#Artikel102
    references:
      - id: ref1
        bwb_id: BWBR0004608
        artikel: '60'
      - id: ref2
        bwb_id: BWBR0016637
        artikel: '4'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0002656
        artikel: '302'
  - number: '102.2'
    text: |-
      Het eerste lid, eerste en tweede volzin, is van overeenkomstige toepassing met betrekking tot de taken van
      gezinsvoogdij-instellingen, genoemd in [artikel 257 van Boek 1 van het Burgerlijk Wetboek][ref1], het uitoefenen
      van het voorlopig toezicht, bedoeld in [artikel 255 van Boek 1 van het Burgerlijk Wetboek][ref2] alsmede
      de bevoegdheden en taken van gezinsvoogdij-instellingen genoemd in de [artikelen 77f, eerste lid][ref3],
      [77j, vijfde lid][ref4] , [77aa, tweede en derde lid, van het Wetboek van Strafrecht][ref5], en
      in de maatregel krachtens [artikel 77ff, tweede lid, van het Wetboek van Strafrecht][ref6] of in
      [artikel 493, eerste lid, van het Wetboek van Strafvordering][ref7], een en ander zoals die bepalingen tot
      het tijdstip van inwerkingtreding van deze wet luidden. Overgang met betrekking tot de taken, genoemd in
      [artikel 257 van Boek 1 van het Burgerlijk Wetboek][ref8], en het uitoefenen van het voorlopig toezicht, bedoeld
      in [artikel 255 van Boek 1 van het Burgerlijk Wetboek][ref9], geschiedt niet voor wat betreft de gezinsvoogdijen
      die de rechtspersoon, bedoeld in [artikel 254, tweede lid, van Boek 1 van het Burgerlijk Wetboek][ref10] op het
      tijdstip van inwerkingtreding van deze wet uitoefent.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel257
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel255
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel77f
      [ref4]: https://wetten.overheid.nl/BWBR0001854#Artikel77j
      [ref5]: https://wetten.overheid.nl/BWBR0001854#Artikel77aa
      [ref6]: https://wetten.overheid.nl/BWBR0001854#Artikel77ff
      [ref7]: https://wetten.overheid.nl/BWBR0001903#Artikel493
