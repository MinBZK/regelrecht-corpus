    url: https://wetten.overheid.nl/BWBR0016637/2006-01-01#Artikel1
  - number: 1.n
    text: |-
      provinciaal beleidskader: het provinciale beleidskader jeugdzorg, bedoeld in [artikel 31, eerste lid][ref1];


