      landelijk beleidskader: het landelijke beleidskader jeugdzorg, bedoeld in [artikel 34, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel34
    url: https://wetten.overheid.nl/BWBR0016637/2006-01-01#Artikel1
    references:
