preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben dat het wenselijk is een wettelijke aanspraak op jeugdzorg voor zover
    daarop geen aanspraak bestaat ingevolge de Algemene Wet Bijzondere Ziektekosten of de Beginselenwet justitiële
    jeugdinrichtingen, te vestigen, een samenhangend aanbod van jeugdzorg te realiseren, dat aansluit op de behoefte,
    de toegang tot de jeugdzorg alsmede de bekostiging van de jeugdzorg waarop ingevolge deze wet aanspraak bestaat
    opnieuw te regelen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0016637/2006-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0016637/2006-01-01#Artikel1
  - number: 1.a
    text: 'Onze Ministers: Onze Minister van Volksgezondheid, Welzijn en Sport en Onze Minister van Justitie tezamen;'
    url: https://wetten.overheid.nl/BWBR0016637/2006-01-01#Artikel1
  - number: 1.b
    text: 'jeugdige: een in Nederland verblijvende persoon die:'
    url: https://wetten.overheid.nl/BWBR0016637/2006-01-01#Artikel1
  - number: 1.b.1º
    text: de meerderjarigheidsleeftijd nog niet heeft bereikt,
    url: https://wetten.overheid.nl/BWBR0016637/2006-01-01#Artikel1
  - number: 1.b.2º
    text: |-
      de meerderjarigheidsleeftijd heeft bereikt en ten aanzien van wie op grond van
      [artikel 77c van het Wetboek van Strafrecht][ref1] recht is gedaan overeenkomstig de
      [artikelen 77g tot en met 77gg van het Wetboek van Strafrecht][ref2], of


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel77c
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel77aa
    url: https://wetten.overheid.nl/BWBR0016637/2006-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 77c
      - id: ref2
        bwb_id: BWBR0001854
        artikel: 77aa
  - number: 1.b.3º
    text: |-
      de meerderjarigheidsleeftijd doch niet de leeftijd van drieëntwintig jaren heeft bereikt, en voor wie voortzetting
      van jeugdzorg, die was aangevangen of waarvan de aanvraag, bedoeld in [artikel 7, eerste lid][ref1], was ingediend
      vóór het bereiken van de meerderjarigheidsleeftijd, noodzakelijk is of voor wie, na beëindiging van jeugdzorg die
      was aangevangen vóór het bereiken van de meerderjarigheidsleeftijd, binnen een termijn van een half jaar hervatting
      van jeugdzorg noodzakelijk is;


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel7
    url: https://wetten.overheid.nl/BWBR0016637/2006-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '7'
        hoofdstuk: III
        paragraaf: '2'
  - number: 1.c
    text: |-
      jeugdzorg: ondersteuning van en hulp aan jeugdigen, hun ouders, stiefouders of anderen, die een jeugdige als
      behorende tot hun gezin verzorgen en opvoeden, bij opgroei- of opvoedingsproblemen of dreigende zodanige problemen;
    url: https://wetten.overheid.nl/BWBR0016637/2006-01-01#Artikel1
  - number: 1.d
    text: |-
      cliënt: een jeugdige, zijn ouders of stiefouder of anderen die de jeugdige als behorend tot hun gezin verzorgen
      en opvoeden;
    url: https://wetten.overheid.nl/BWBR0016637/2006-01-01#Artikel1
  - number: 1.e
    text: |-
      bureau jeugdzorg: een bureau als bedoeld in [artikel 4][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel4
    url: https://wetten.overheid.nl/BWBR0016637/2006-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '4'
        hoofdstuk: III
        paragraaf: '1'
  - number: 1.f
    text: 'stichting: een stichting die een bureau jeugdzorg in stand houdt;'
    url: https://wetten.overheid.nl/BWBR0016637/2006-01-01#Artikel1
  - number: 1.g
    text: |-
      zorgaanbieder: de natuurlijke persoon of de rechtspersoon die jeugdzorg verleent, waarop ingevolge deze wet
      aanspraak bestaat;
    url: https://wetten.overheid.nl/BWBR0016637/2006-01-01#Artikel1
  - number: 1.h
    text: |-
      aanbieder van zorg: de natuurlijke persoon of de rechtspersoon, die andere zorg verleent dan die, waarop ingevolge
      deze wet aanspraak bestaat;
    url: https://wetten.overheid.nl/BWBR0016637/2006-01-01#Artikel1
  - number: 1.i
    text: 'zorgeenheid: een organisatie-eenheid, waarbinnen een zorgaanbieder een afgebakend geheel aan jeugdzorg verleent;'
    url: https://wetten.overheid.nl/BWBR0016637/2006-01-01#Artikel1
  - number: 1.j
    text: |-
      steunfunctie: een aanbod van ondersteunende werkzaamheden ten behoeve van de stichting en van jeugdzorg waarop
      ingevolge deze wet aanspraak bestaat;
    url: https://wetten.overheid.nl/BWBR0016637/2006-01-01#Artikel1
  - number: 1.k
    text: |-
      experiment: het ontwikkelen en in de praktijk beproeven van nieuwe en het verbeteren van bestaande methoden,
      werkvormen of hulpmiddelen ten behoeve van het functioneren van bureaus jeugdzorg en van jeugdzorg waarop ingevolge
      deze wet aanspraak bestaat;
    url: https://wetten.overheid.nl/BWBR0016637/2006-01-01#Artikel1
  - number: 1.l
    text: |-
      inspectie: de inspectie, bedoeld in [artikel 47][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel47
    url: https://wetten.overheid.nl/BWBR0016637/2006-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '47'
        hoofdstuk: VIII
  - number: 1.m
    text: |-
      kindermishandeling: elke vorm van voor een minderjarige bedreigende of gewelddadige interactie van fysieke,
