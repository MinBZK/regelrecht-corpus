        artikel: '1'
  - number: 1.w
    text: |-
      vertrouwenspersoon: een persoon werkzaam bij een rechtspersoon als bedoeld in [artikel 41, vierde lid][ref1],
      die, onafhankelijk van het bestuur en van personen in dienst van de stichting of de zorgaanbieder, cliënten
      van het door de stichting in stand gehouden bureau jeugdzorg of van de zorgaanbieder op hun verzoek ondersteunt
      in aangelegenheden samenhangend met de door de stichting uitgeoefende taken onderscheidenlijk aangelegenheden
      samenhangend met de geboden jeugdzorg;


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel41
    url: https://wetten.overheid.nl/BWBR0016637/2006-01-01#Artikel1
    references:
