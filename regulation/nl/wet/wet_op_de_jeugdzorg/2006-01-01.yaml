        hoofdstuk: '8'
  - number: '106.1'
    text: |-
      Stichtingen stellen uiterlijk zes maanden na het tijdstip van inwerkingtreding van [artikel 58, tweede lid][ref1],
      een regeling vast als bedoeld in dat artikellid.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel58
    url: https://wetten.overheid.nl/BWBR0016637/2006-01-01#Artikel106
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '58'
        hoofdstuk: XI
  - number: '106.2'
    text: |-
      Stichtingen treffen uiterlijk drie maanden nadat de in het eerste lid bedoelde regeling is vastgesteld, de
      voorzieningen die op grond van die regeling noodzakelijk zijn voor de benoeming van de leden van de cliëntenraad.
    url: https://wetten.overheid.nl/BWBR0016637/2006-01-01#Artikel106
  - number: '106.3'
    text: |-
      De [artikelen 59][ref1] en [60][ref2] blijven buiten toepassing met betrekking tot besluiten, genomen vóór de datum
      van benoeming van de leden van de cliëntenraad.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel59
      [ref2]: https://wetten.overheid.nl/BWBR0016637#Artikel60
    url: https://wetten.overheid.nl/BWBR0016637/2006-01-01#Artikel106
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '59'
        hoofdstuk: XI
      - id: ref2
        bwb_id: BWBR0016637
        artikel: '60'
        hoofdstuk: XI
  - number: '106.4'
    text: |-
      De statuten van de stichting zijn uiterlijk zes maanden na het tijdstip van inwerkingtreding van [artikel 63][ref1]
      in overeenstemming met dat artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel63
    url: https://wetten.overheid.nl/BWBR0016637/2006-01-01#Artikel106
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '63'
        hoofdstuk: XI
  - number: '106.5'
    text: |-
      Stichtingen treffen de in [artikel 68][ref1] bedoelde regeling binnen zes maanden na de inwerkingtreding van dat
      artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel68
    url: https://wetten.overheid.nl/BWBR0016637/2006-01-01#Artikel106
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '68'
        hoofdstuk: XII
  - number: '107.2'
    text: |-
      In afwijking van [artikel 32, eerste lid][ref1], wordt bij regeling van Onze Ministers de inhoud van het
      uitvoeringsprogramma, bedoeld in het eerste lid, en van het daarop volgende uitvoeringsprogramma geregeld.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel32
    url: https://wetten.overheid.nl/BWBR0016637/2006-01-01#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '32'
        hoofdstuk: V
        paragraaf: '1'
  - number: '107.3'
    text: |-
      In afwijking van [artikel 36, tweede lid][ref1], wordt bij regeling van Onze Ministers de inhoud van de
      voortgangsrapportage, bedoeld in het eerste lid, en van de daarop volgende twee voortgangsrapportages geregeld.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel36
    url: https://wetten.overheid.nl/BWBR0016637/2006-01-01#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '36'
        hoofdstuk: V
        paragraaf: '2'
  - number: '108.1'
    text: |-
      Indien de aanvaarding van de rechtspersoon, bedoeld in
      [artikel 302, tweede lid, van Boek 1 van het Burgerlijk Wetboek][ref1] eindigt, gaat met ingang van het tijdstip
      van de beëindiging elke voogdij die was opgedragen aan die rechtspersoon van rechtswege over op de stichting in de
      provincie waar de desbetreffende minderjarige duurzaam verblijft.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel302
    url: https://wetten.overheid.nl/BWBR0016637/2006-01-01#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '302'
  - number: '108.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing indien de aanvaarding van de in
      [artikel 254, tweede lid, van Boek 1 van het Burgerlijk Wetboek][ref1] bedoelde rechtspersoon eindigt.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel254
    url: https://wetten.overheid.nl/BWBR0016637/2006-01-01#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '254'
  - number: '109'
    text: |-
      De voordracht voor een algemene maatregel van bestuur op grond van deze wet wordt niet gedaan dan nadat het ontwerp
      in de Staatscourant is bekend gemaakt en aan eenieder de gelegenheid is geboden om binnen vier weken na de dag
      waarop de bekendmaking is geschied, wensen en bedenkingen ter kennis van Onze Ministers te brengen. Gelijktijdig
      met de bekendmaking wordt het ontwerp aan de beide kamers der Staten-Generaal overgelegd.
    url: https://wetten.overheid.nl/BWBR0016637/2006-01-01#Artikel109
  - number: '110.1'
    text: |-
      Onze Ministers zenden binnen vijf jaar na de inwerkingtreding van de wet aan de Staten-Generaal een verslag over de
      doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0016637/2006-01-01#Artikel110
  - number: '110.2'
    text: 'Het verslag als bedoeld in het eerste lid bevat in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0016637/2006-01-01#Artikel110
  - number: 110.2.a
    text: een evaluatie van de waarde van de provincie als verantwoordelijke bestuurslaag;
    url: https://wetten.overheid.nl/BWBR0016637/2006-01-01#Artikel110
  - number: 110.2.b
    text: de aansluiting van de landelijke, provinciale en locale jeugdzorg;
    url: https://wetten.overheid.nl/BWBR0016637/2006-01-01#Artikel110
  - number: 110.2.c
    text: een evaluatie van de continuïteit van de zorg in het gezin;
    url: https://wetten.overheid.nl/BWBR0016637/2006-01-01#Artikel110
  - number: 110.2.d
    text: het bestaan van wachtlijsten, en
    url: https://wetten.overheid.nl/BWBR0016637/2006-01-01#Artikel110
  - number: 110.2.e
    text: een evaluatie van de werking van de bekostigingssystematiek.
    url: https://wetten.overheid.nl/BWBR0016637/2006-01-01#Artikel110
  - number: '111.1'
    text: |-
      De [Wet op de jeugdhulpverlening][ref1] wordt ingetrokken, met dien verstande dat zij van toepassing blijft op
      de financiële verantwoording, vaststelling en uitbetaling van op grond van [die wet][ref2] verleende subsidies
      en uitkeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0004608
      [ref2]: https://wetten.overheid.nl/BWBR0004608
    url: https://wetten.overheid.nl/BWBR0016637/2006-01-01#Artikel111
    references:
      - id: ref1
        bwb_id: BWBR0004608
      - id: ref2
        bwb_id: BWBR0004608
  - number: '111.2'
    text: |-
      In wettelijke procedures en rechtsgedingen tegen besluiten die op grond van de [Wet op de jeugdhulpverlening][ref1]
      zijn genomen, dan wel op tegen deze besluiten in te stellen of ingestelde beroepen, blijven, zowel in eerste aanleg
      als in verdere instantie, de regels van toepassing, die golden voor de intrekking van [die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004608
      [ref2]: https://wetten.overheid.nl/BWBR0004608
    url: https://wetten.overheid.nl/BWBR0016637/2006-01-01#Artikel111
    references:
      - id: ref1
        bwb_id: BWBR0004608
      - id: ref2
        bwb_id: BWBR0004608
  - number: '112.1'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen
      of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0016637/2006-01-01#Artikel112
  - number: '112.2'
    text: |-
      [Artikel 78, onderdeel D][ref1], treedt in werking met ingang van 1 januari 2006. Bij koninklijk besluit kan een
      later tijdstip worden bepaald, indien de beschikbare plaatsruimte in de desbetreffende justitiële jeugdinrichtingen
      zulks noodzakelijk maakt.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel78
    url: https://wetten.overheid.nl/BWBR0016637/2006-01-01#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '78'
        hoofdstuk: XIV
  - number: '112.3'
    text: |-
      Tot het tijdstip waarop [artikel 78, onderdeel D][ref1], in werking treedt, is plaatsing van een
      jeugdige als bedoeld in [artikel 11a, eerste lid][ref2], in een justitiële jeugdinrichting als bedoeld in
      [artikel 1, onder b, van de Beginselenwet justitiële jeugdinrichtingen][ref3], slechts mogelijk indien de
      stichting een besluit heeft genomen waaruit blijkt dat de jeugdige op die plaatsing is aangewezen. Bij algemene
      maatregel van bestuur worden regels gesteld voor gevallen waarin het besluit, bedoeld in de eerste volzin niet kan
      worden afgewacht. Daarbij kan worden afgeweken van het bepaalde in die volzin.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel78
      [ref2]: https://wetten.overheid.nl/BWBR0011756#Artikel11a
      [ref3]: https://wetten.overheid.nl/BWBR0011756#Artikel1
    url: https://wetten.overheid.nl/BWBR0016637/2006-01-01#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '78'
        hoofdstuk: XIV
      - id: ref2
        bwb_id: BWBR0011756
        artikel: 11a
      - id: ref3
        bwb_id: BWBR0011756
        artikel: '1'
  - number: '112.5'
    text: |-
      Voor de toepassing van [artikel 10][ref1] en van [artikel 261 van Boek 1 van het Burgerlijk Wetboek][ref2] wordt
      tot het tijdstip, bedoeld in het derde lid, een besluit als bedoeld in het derde lid gelijkgesteld met een besluit
      als bedoeld in [artikel 6, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel261
      [ref3]: https://wetten.overheid.nl/BWBR0016637#Artikel6
    url: https://wetten.overheid.nl/BWBR0016637/2006-01-01#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '10'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '261'
      - id: ref3
        bwb_id: BWBR0016637
        artikel: '6'
        hoofdstuk: III
        paragraaf: '2'
  - number: '112.6'
    text: |-
      Tot het tijdstip waarop [artikel 78, onderdeel D][ref1], in werking treedt,
      is [artikel 10, eerste lid, onder g][ref2], van overeenkomstige toepassing met
      betrekking tot een plaatsing in een justitiële jeugdinrichting als bedoeld in
      [artikel 1, onder b, van de Beginselenwet justitiële jeugdinrichtingen][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel78
      [ref2]: https://wetten.overheid.nl/BWBR0016637#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0011756#Artikel1
    url: https://wetten.overheid.nl/BWBR0016637/2006-01-01#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '78'
        hoofdstuk: XIV
      - id: ref2
        bwb_id: BWBR0016637
        artikel: '10'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0011756
        artikel: '1'
  - number: '113'
    text: 'Deze wet wordt aangehaald als: Wet op de jeugdzorg.'
    url: https://wetten.overheid.nl/BWBR0016637/2006-01-01#Artikel113
