  - number: 1.t
    text: |-
      eigen bijdrage: de bijdrage, bedoeld in [artikel 70][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel70
    url: https://wetten.overheid.nl/BWBR0016637/2006-01-01#Artikel1
    references:
