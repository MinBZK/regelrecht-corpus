        paragraaf: '1'
  - number: 1.o
    text: |-
      uitvoeringsprogramma: het provinciale programma, bedoeld in [artikel 32, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel32
    url: https://wetten.overheid.nl/BWBR0016637/2006-01-01#Artikel1
    references:
