  - number: 1.u
    text: |-
      pleegouder: degene die in het kader van jeugdzorg een jeugdige die niet zijn kind of stiefkind is, als behorende
      tot zijn gezin verzorgt en opvoedt;
    url: https://wetten.overheid.nl/BWBR0016637/2006-01-01#Artikel1
  - number: 1.v
    text: |-
      verwerken van persoonsgegevens: verwerking van persoonsgegevens als bedoeld in
      [artikel 1, onder b, van de Wet bescherming persoonsgegevens][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel1
    url: https://wetten.overheid.nl/BWBR0016637/2006-01-01#Artikel1
    references:
      - id: ref1
