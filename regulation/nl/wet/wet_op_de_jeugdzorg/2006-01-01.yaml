  - number: 1.r
    text: |-
      zorgverzekeraar: een zorgverzekeraar als bedoeld in
      [artikel 1, eerste lid, onderdeel b, van de Algemene Wet Bijzondere Ziektekosten][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel1
    url: https://wetten.overheid.nl/BWBR0016637/2006-01-01#Artikel1
    references:
