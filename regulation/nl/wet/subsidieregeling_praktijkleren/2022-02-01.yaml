  - number: 9c
    text: |-
      1 De minister kan subsidie verstrekken aan een werkgever voor een gerealiseerde praktijkleerplaats
      voor een leerling in het kader van het praktijkonderwijs in het voortgezet onderwijs als bedoeld in
      [artikel 10f van de WVO][ref1].

      2 Onder werkgever, genoemd in het eerste lid, wordt verstaan de stagegever, bedoeld in
      [artikel 34 van het Inrichtingsbesluit WVO][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10f
      [ref2]: https://wetten.overheid.nl/BWBR0005946#Artikel34
