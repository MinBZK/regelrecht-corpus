  - number: '5'
    text: |-
      Subsidie op grond van [artikel 4][ref1] wordt slechts verstrekt voor zover:

      a. de mbo-student gedurende het desbetreffende studiejaar of een deel daarvan een beroepsopleiding heeft gevolgd
      die gericht is op het behalen van een kwalificatie die is opgenomen in het Centraal register beroepsonderwijs,
      bedoeld in [artikel 6.4.1 van de WEB][ref2];

      b. het onderwijsprogramma van de beroepsopleiding, bedoeld onder a, aan de eisen met betrekking
      tot voldoende begeleide onderwijsuren en uren beroepspraktijkvorming voldoet als bedoeld in
      [artikel 7.2.7, vierde lid, van de WEB][ref3];

      c. de verzorging van het onderricht in de praktijk van het beroep voor de mbo-student door de werkgever plaats
      heeft gevonden op grond van en overeenkomstig een praktijkleerovereenkomst;

      d. de werkgever beschikt over een aanwezigheidsregistratie van de mbo-student bij de beroepspraktijkvorming; en

      e. de werkgever beschikt over een administratie waaruit de begeleiding van de mbo-student blijkt en de wijze waarop
      de mbo-student het deel van de beroepsopleiding met betrekking tot de beroepspraktijkvorming heeft gerealiseerd.


      [ref1]: https://wetten.overheid.nl/BWBR0034144#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel6.4.1
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel7.2.7
