      in afwijking van de [artikelen 9b, onder d][ref2], [9d, onder d][ref3], en [artikel 11, tweede lid, onder d][ref4],
      uiterlijk 15 september 2018 over een gunstige beoordeling, bedoeld in [artikel 1.5.3 van de WEB][ref5].

      2 De werkgever, bedoeld in het vorige lid, dient het verzoek voor een gunstige beoordeling vóór de aanvang van de
      stage respectievelijk beroepspraktijkvorming door de leerling in bij de Samenwerkingsorganisatie beroepsonderwijs
