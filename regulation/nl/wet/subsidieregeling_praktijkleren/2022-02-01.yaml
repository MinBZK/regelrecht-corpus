  - number: '7'
    text: |-
      Subsidie op grond van [artikel 6][ref1] wordt slechts verstrekt voor zover:

      a. de hbo-student gedurende het desbetreffende studiejaar een opleiding in het hoger beroepsonderwijs heeft gevolgd
      waarvoor op grond van [artikel 5a.9 van de WHW][ref2] accreditatie is verleend en de opleiding is opgenomen in
      het Centraal register opleidingen hoger onderwijs, bedoeld in [artikel 6.13 van die wet][ref3], en de code van de
      opleiding is opgenomen in de onderdelen 1°. techniek, 2°. gezondheidszorg, gedrag en maatschappij, of 3°. landbouw
      en natuurlijke omgeving;

      b. de verzorging van het onderricht in de praktijk van het beroep voor de hbo-student door de werkgever plaats
      heeft gevonden op grond van en overeenkomstig een praktijkleerovereenkomst;

      c. de werkgever beschikt over een aanwezigheidsregistratie van de hbo-student bij de beroepsuitoefening; en

      d. de werkgever beschikt over een administratie waaruit de begeleiding van de hbo-student blijkt en de wijze waarop
      de hbo-student het deel van de kwaliteiten met betrekking tot de beroepsuitoefening heeft gerealiseerd.


