  - number: '6'
    text: |-
      1 De minister kan subsidie verstrekken aan een werkgever voor een gerealiseerde praktijkleerplaats
      voor een hbo-student in het kader van een duale opleiding in het hoger beroepsonderwijs als bedoeld in
      [artikel 7.7, tweede lid, van de WHW][ref1] of een deeltijdse opleiding in het hoger beroepsonderwijs waarbij de
      beroepsuitoefening een verplicht onderdeel vormt van de opleiding.

      2 Onder werkgever wordt in dit artikel verstaan een in Nederland gevestigd bedrijf dat of organisatie die het
      onderricht in de beroepsuitoefening voor de hbo-student verzorgt.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7.7
