    text: |-
      1 Met een mbo-student of hbo-student aan een opleiding als bedoeld in [artikel 4][ref1] of [6][ref2] wordt
      gelijkgesteld een natuurlijke persoon die gedurende het desbetreffende studiejaar een opleiding heeft gevolgd
      in een andere lidstaat van de Europese Unie of een andere staat die partij is bij de Overeenkomst betreffende de
      Europese Economische Ruimte, indien de werkgever gevestigd is in Nederland en beschikt over een verklaring van
      de minister dat die opleiding wat betreft niveau en kwaliteit vergelijkbaar is met een opleiding als bedoeld in
      [artikel 5, onder a][ref3], onderscheidenlijk [artikel 7, onder a][ref4].

      2 Voor de toepassing van het eerste lid wordt in [artikel 5][ref5] of [7][ref6] onder praktijkleerovereenkomst
      verstaan een onderwijsarbeidsovereenkomst of stage-overeenkomst gesloten tussen de werkgever, het
      opleidingsinstituut en de natuurlijke persoon, waarin de verzorging van het onderricht in de praktijk van het
      beroep is geregeld.

      3 De verklaring, bedoeld in het eerste lid, wordt verkregen overeenkomstig [paragraaf vier][ref7] van deze
      regeling.


