  - number: 14a
    text: |-
      1 Een werkgever die in 2020 niet in staat is geweest tijdig een subsidieaanvraag in te dienen voor het studiejaar
      2019–2020 en zich om die reden uiterlijk binnen veertien dagen na 16 september 2020, 17:00 uur heeft gemeld bij
      de Rijksdienst voor Ondernemend Nederland, wordt, indien daarbij sprake is van een onbillijkheid van overwegende
      aard als bedoeld in [artikel 1, eerste lid, van de Verzamelregeling subsidies OCW COVID-19][ref1], alsnog in de
      gelegenheid gesteld om in de in het tweede lid bedoelde aanvraagperiode een aanvraag in te dienen voor een subsidie
      op grond van deze regeling voor dat studiejaar.

      2 In afwijking van [artikel 17, eerste lid][ref2], wordt een subsidieaanvraag ingediend van 3 mei 2021, 9:00 uur,
      tot en met 21 mei 2021, 17:00 uur.

      3 Voor subsidieverstrekking op grond van het eerste lid is ten hoogste € 3.100.000,– beschikbaar. Van dat bedrag
      is beschikbaar:

      a. voor subsidies op grond van [artikel 4][ref3]: € 2.828.000;

      b. voor subsidies op grond van [artikel 6][ref4]: € 58.000;

      c. voor subsidies op grond van [artikel 8][ref5]: € 41.000;

      d. voor subsidies op grond van de [artikelen 9a][ref6], [9c][ref7] en [10][ref8]: € 19.000; en

      e. voor subsidies op grond van [paragraaf 1a][ref9]: € 154.000,–.

      4 In afwijking van [artikel 15][ref10] en [15c, vierde lid][ref11], is het subsidiebedrag per gerealiseerde
      praktijkleerplaats of leerwerkplaats voor een subsidie als bedoeld in de [artikelen 4][ref12], [6][ref13],
      [8][ref14], [9a][ref15], [9c][ref16], [10][ref17] en [paragraaf 1a][ref18], ten hoogste het subsidiebedrag
      per praktijkleerplaats of leerwerkplaats dat binnen de desbetreffende subsidiecategorie is verstrekt voor de
      subsidieaanvragen voor het studiejaar 2019–2020 die uiterlijk op 16 september 2020 zijn ingediend.

      5 In afwijking van [artikel 18][ref19] wordt een subsidieaanvraag ingediend via door RVO beschikbaar gestelde
      formulieren, via het e-mailadres verzamelregeling_pl@rvo.nl.


