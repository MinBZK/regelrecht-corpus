  - number: '25'
    text: |-
      1 De minister beslist binnen acht weken op een aanvraag voor een verklaring als bedoeld in
      [artikel 12, eerste lid][ref1].

      2 De verklaring vermeldt het tijdstip vanaf welk moment de opleiding waarop de verklaring betrekking heeft als een
      vergelijkbare opleiding wordt aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0034144#Artikel12
    url: https://wetten.overheid.nl/BWBR0034144/2022-02-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0034144
        artikel: '12'
        paragraaf: '1'
  - number: '26'
    text: |-
      Een aanvraag voor een verklaring wordt in ieder geval geweigerd indien de buitenlandse opleiding niet in dat land
      is erkend of het opleidingsniveau lager is dan een vergelijkbare Nederlandse opleiding.
    url: https://wetten.overheid.nl/BWBR0034144/2022-02-01#Artikel26
  - number: '27'
    text: |-
      Aan de Algemeen directeur Rijksdienst voor Ondernemend Nederland van het Ministerie van Economische Zaken en
      Klimaat wordt mandaat verleend tot:

      a. het nemen van besluiten namens de minister op grond van deze regeling, met uitzondering van [paragraaf 4][ref1];
      en

      b. het beslissen op bezwaarschriften tegen besluiten als bedoeld in onderdeel a, voor zover het besluit waartegen
      het bezwaar zich richt, niet door hem in mandaat is genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0034144#Paragraaf4
    url: https://wetten.overheid.nl/BWBR0034144/2022-02-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0034144
        paragraaf: '4'
  - number: '28'
    text: |-
      De Algemeen directeur Rijksdienst voor Ondernemend Nederland van het Ministerie van Economische Zaken en Klimaat
      kan met betrekking tot zijn bevoegdheden, bedoeld in [artikel 27][ref1], ondermandaat verlenen aan één of meer
      onder hem ressorterende medewerkers.


      [ref1]: https://wetten.overheid.nl/BWBR0034144#Artikel27
    url: https://wetten.overheid.nl/BWBR0034144/2022-02-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0034144
        artikel: '27'
        paragraaf: '5'
  - number: '29'
    text: |-
      Onverminderd het toezicht door de Inspectie van het onderwijs worden de ambtenaren die een arbeidsovereenkomst
      hebben bij het Ministerie van Economische Zaken en Klimaat, voor zover zij werkzaamheden verrichten ten behoeve van
      de uitvoering van deze regeling, belast met het toezicht op de naleving van het bepaalde bij deze regeling.
    url: https://wetten.overheid.nl/BWBR0034144/2022-02-01#Artikel29
  - number: '30'
    text: |-
      1 De minister kan aan een werkgever als bedoeld in [artikel 4, eerste lid][ref1], vooruitlopend op een
      subsidieaanvraag in 2020 een voorschot verstrekken.

      2 Werkgevers kunnen daartoe een aanvraag indienen van 2 juni 2020 tot en met 30 juni 2020 om 17:00 uur, met
      gebruikmaking van het aanvraagformulier dat daartoe op de website www.rvo.nl/praktijkleren beschikbaar is gesteld.
      Aanvragen die later worden ontvangen, worden afgewezen.

      3 De hoogte van het voorschotbedrag wordt berekend aan de hand van het aantal weken dat voor de desbetreffende
      praktijkleerplaats reeds onderricht in de praktijk heeft plaatsgevonden in de periode van 1 augustus 2019 tot en
      met 31 maart 2020, waarbij het aantal weken wordt vermenigvuldigd met € 42,50. [Artikel 33, eerste lid][ref2], is
      van overeenkomstige toepassing.

      4 Het voorschot wordt verstrekt onder de voorwaarde dat aan de werkgever in 2020 op grond van
      [artikel 4, eerste lid][ref3], van deze regeling subsidie wordt toegekend. Indien de werkgever geen
      subsidieaanvraag doet of indien zijn subsidieaanvraag wordt afgewezen, wordt het verleende voorschot als zijnde
      onverschuldigd betaald geheel teruggevorderd.

      5 Indien het toegekende subsidiebedrag lager is dan het voorschot dat op grond van het eerste lid aan een werkgever
      is verleend, wordt het teveel ontvangen bedrag als zijnde onverschuldigd betaald teruggevorderd.

      6 In afwijking van het vierde lid kan de Minister afzien van de terugvordering van een voorschot dat werd
      verstrekt aan een werkgever die voor de desbetreffende praktijkleerplaats in 2020 geen subsidie als bedoeld in
      [artikel 4][ref4] heeft aangevraagd, indien de werkgever met door hem aan te leveren gegevens aannemelijk kan
      maken, dat aan hem subsidie zou zijn verstrekt, indien hij haar zou hebben aangevraagd.


