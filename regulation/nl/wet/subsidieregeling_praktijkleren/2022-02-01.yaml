  - number: '11'
    text: |-
      1 Subsidie op grond van [artikel 10, eerste lid][ref1], wordt slechts verstrekt voor zover:

      a. de leerling een basisberoepsgerichte leerweg in het voortgezet onderwijs volgt die is ingericht
      als leer-werktraject als bedoeld in [artikel 10b1 van de WVO][ref2] en dat specifiek is gericht
      op het behalen van een startkwalificatie op het niveau van de basisberoepsopleiding, bedoeld in
      [artikel 7.2.2, eerste lid, onder b, van de WEB][ref3];

      b. het praktijkgedeelte van het leer-werktraject voldoet aan het aantal klokuren, bedoeld in
      [artikel 10b1, eerste lid, van de WVO][ref4];

      c. de verzorging van het onderricht in de praktijk van het beroep voor de leerling door de werkgever plaats heeft
      gevonden op grond van en overeenkomstig een praktijkleerovereenkomst;

      d. de werkgever beschikt over een aanwezigheidsregistratie van de leerling bij het praktijkgedeelte; en

      e. de werkgever beschikt over een administratie waaruit de begeleiding van de leerling blijkt en de wijze waarop de
      leerling de leerdoelen van het praktijkgedeelte heeft behaald.

      2 Subsidie op grond van [artikel 10, derde lid][ref5], wordt slechts verstrekt voor zover:

      a. de leerling een basisberoepsgerichte leerweg in het voortgezet onderwijs volgt die is ingericht als
      entreeopleiding als bedoeld in [artikel 10b8 van de WVO][ref6] en dat wordt verzorgd als beroepsbegeleidende
      leerweg, bedoeld in [artikel 7.2.2, tweede lid, van de WEB][ref7];

      b. de beroepspraktijkvorming van de entreeopleiding voldoet aan het aantal klokuren, bedoeld in
      [artikel 7.2.7, vierde lid, van de WEB][ref8];

      c. de verzorging van het onderricht in de praktijk van het beroep voor de leerling door de werkgever plaats heeft
      gevonden op grond van en overeenkomstig een praktijkleerovereenkomst;

      d. de werkgever beschikt over een gunstige beoordeling door de Samenwerkingsorganisatie beroepsonderwijs
      bedrijfsleven, bedoeld in [artikel 1.5.3, tweede lid, van de WEB][ref9];

      e. de werkgever beschikt over een aanwezigheidsregistratie van de leerling bij het praktijkgedeelte; en

      f. de werkgever beschikt over een administratie waaruit de begeleiding van de leerling blijkt en de wijze waarop de
      leerling de leerdoelen van het praktijkgedeelte heeft behaald.


