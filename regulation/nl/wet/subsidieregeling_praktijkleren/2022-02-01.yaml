  - number: 15c1
    text: |-
      1 In aanvulling op de subsidie die wordt verstrekt aan een werkgever op grond van [artikel 4][ref1],
      kan de Minister subsidie verstrekken voor een gerealiseerde praktijkplaats voor een mbo-student in
      het kader van een beroepsopleiding voor zover het betreft de beroepsbegeleidende leerweg, bedoeld in
      [artikel 7.2.2, tweede lid, van de WEB][ref2], in een sector die contact- en conjunctuurgevoelig is.

      2 In afwijking van [artikel 16][ref3] kunnen slechts werkgevers in aanmerking komen voor de aanvullende
      subsidie waarvan op het moment van aanvragen en gedurende het studiejaar waarop de aanvraag betrekking heeft,
      de hoofdactiviteit bij de Kamer van Koophandel geregistreerd staat onder één van de SBI-codes die voorkomt in
      [bijlage 2][ref4] bij deze regeling.

      3 De aanvullende subsidie wordt op aanvraag verstrekt. De subsidieaanvraag maakt onderdeel uit van de aanvraag,
      bedoeld in [artikel 16][ref5], juncto [artikel 4][ref6].

      4 In afwijking van [artikel 15][ref7] wordt het subsidiebedrag per gerealiseerde praktijkleerplaats berekend
      aan de hand van het beschikbare bedrag voor de desbetreffende categorie gedeeld door het aantal gerealiseerde
      praktijkleerplaatsen dat in aanmerking komt voor subsidie.

      5 Aanvullende subsidie kan ook worden toegekend indien de werkgever ten genoegen van de Minister aantoont dat een
      onderneming op het moment van aanvragen en gedurende het studiejaar waarop de aanvraag betrekking heeft, feitelijk
      een activiteit uitvoert als hoofdactiviteit die valt onder een SBI-code die in [bijlage 2][ref8] van deze regeling
      is opgenomen. De werkgever kan dit aantonen aan de hand van een afschrift van de Kamer van Koophandel, waarin de
      desbetreffende SBI-code is geregistreerd, in samenhang met andere stukken waaruit blijkt dat de werkgever feitelijk
      een hoofdactiviteit heeft die onder één van de in de bijlage 2 opgenomen SBI-codes valt.


      [ref1]: https://wetten.overheid.nl/BWBR0034144#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel7.2.2
      [ref3]: https://wetten.overheid.nl/BWBR0034144#Artikel16
