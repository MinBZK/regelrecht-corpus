preamble:
  text: |-
    Gelet op artikel 2.7 van de Wet educatie en beroepsonderwijs en de artikelen 4 en 10 van de Wet overige OCW-
    subsidies;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0034144/2022-02-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. *beroepsopleiding:* beroepsopleiding als bedoeld in [artikel 7.1.2, tweede lid, van de WEB][ref1];

      b. *gerealiseerde praktijkleerplaats:* het aantal weken dat tijdens de praktijkleerplaats daadwerkelijk onderricht
      in de praktijk van het beroep plaats vindt tot ten hoogste 40 weken per studiejaar gedeeld door 40 voor zover het
      een beroepsopleiding, het voortgezet speciaal onderwijs of het voortgezet onderwijs betreft, onderscheidenlijk tot
      ten hoogste 42 weken gedeeld door 42 voor zover het een opleiding in het hoger beroepsonderwijs betreft;

      c. *gerealiseerde werkleerplaats:* het aantal maanden in een studiejaar dat een promovendus zijn onderzoek verricht
      of een technologisch ontwerper in opleiding staat ingeschreven bij een universiteit voor zijn opleiding, gedeeld
      door twaalf en vermenigvuldigd met de totale arbeidsduur van de promovendus of technologisch ontwerper in opleiding
      in uren per week tot ten hoogste 36 uur gedeeld door 36;

      d. *hbo-student:* natuurlijke persoon die een opleiding volgt in het hoger beroepsonderwijs als bedoeld in de
      [WHW][ref2];

      e. *KNAW:* Koninklijke Nederlandse Akademie voor Wetenschappen, bedoeld in
      [artikel 1.5, eerste lid, van de WHW][ref3];

      f. *leerling:* leerling als bedoeld in de WEC of de WVO;

      g. *mbo-student:* student als bedoeld in de [WEB][ref4];

      h. *minister:* Minister van Onderwijs, Cultuur en Wetenschap;

      i. *NWO:* Nederlandse organisatie voor wetenschappelijk onderzoek, bedoeld in
      [artikel 2 van de Wet op de Nederlandse organisatie voor wetenschappelijk onderzoek][ref5];

      j. *praktijkleerovereenkomst:* overeenkomst als bedoeld in [artikel 7.2.8 van de WEB][ref6],
      [artikel 7.7, vijfde lid, van de WHW][ref7] of [artikel 10b3 van de WVO][ref8] dan wel stage-
      overeenkomst als bedoeld in [artikel 9 van het Onderwijskundig besluit WEC][ref9], respectievelijk
      [artikel 35 van het Inrichtingsbesluit WVO][ref10];

      k. *praktijkleerplaats:* tijdsduur gedurende welk een bedrijf of organisatie onderricht in de praktijk van het
      beroep voor een leerling, mbo-student of hbo-student verzorgt op grond van een praktijkleerovereenkomst;

      l. *promovendus:* natuurlijke persoon die een onderzoek verricht gericht op promotie als bedoeld in
      [artikel 7.18 WHW][ref11];

      m. *studiejaar:* tijdvak dat aanvangt op 1 augustus van een kalenderjaar en eindigt op 31 juli van het
      daaropvolgende kalenderjaar voor zover het een beroepsopleiding, het voortgezet speciaal onderwijs of het
      voortgezet onderwijs betreft of tijdvak dat aanvangt op 1 september van een kalenderjaar en eindigt op 31 augustus
      van het daaropvolgende kalenderjaar voor zover het een opleiding in het hoger beroepsonderwijs of een promovendus
      of technologisch ontwerper in opleiding betreft;

      n. *technologisch ontwerper in opleiding:* natuurlijk persoon die staat ingeschreven bij een universiteit voor de
      opleiding gericht op de titel PDEng;

      o. *universiteit:* bekostigde universiteit als bedoeld in de onderdelen a en b, van de [bijlage bij de WHW]
      (onbekend);

      p. *WEB:* [Wet educatie en beroepsonderwijs][ref12];

      q. *WEC:* [Wet op de expertisecentra][ref13];

      r. *werkgever:* bedrijf of organisatie die de praktijkleerplaats of werkleerplaats verzorgt en omschreven als
      bedoeld in [artikel 4, tweede lid][ref14], [6, tweede lid][ref15], [8, tweede lid][ref16], onderscheidenlijk
      [10, tweede lid][ref17];

      s. *werkleerplaats:* tijdsduur gedurende welke een promovendus aan een universiteit of instituut van de KNAW of NWO
      zijn onderzoek verricht of welke een technologisch ontwerper in opleiding zijn opleiding volgt;

      t. *WHW:* [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref18];

      u. *WVO:* [Wet op het voortgezet onderwijs][ref19].


