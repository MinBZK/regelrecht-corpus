  - number: '33'
    text: |-
      1 Bij de subsidieverstrekking in 2020 worden voor de berekening van gerealiseerde praktijkleerplaatsen, in
      afwijking van [artikel 1, onderdeel c][ref1], de weken waarin ten gevolge van de uitbraak van het coronavirus of de
      maatregelen ter bestrijding ervan geen onderricht in de praktijk heeft plaatsgevonden, gelijk gesteld met de weken
      waarin daadwerkelijk onderricht in de praktijk heeft plaatsgevonden.

      2 Bij de subsidieverstrekking in 2020 worden voor de berekening van gerealiseerde werkleerplaatsen voor promovendi,
      in afwijking van [artikel 1, onderdeel d][ref2], de maanden waarin de desbetreffende promovendus ten gevolge van de
      uitbraak van het coronavirus of de maatregelen ter bestrijding ervan geen onderzoek heeft verricht, gelijk gesteld
      met maanden waarin de promovendus daadwerkelijk onderzoek heeft verricht.


