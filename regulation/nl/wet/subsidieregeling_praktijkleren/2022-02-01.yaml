  - number: 9b
    text: |-
      Subsidie op grond van [artikel 9a, eerste en derde lid][ref1], wordt slechts verstrekt voor zover:

      a. de leerling als daadwerkelijk schoolgaand staat ingeschreven aan een school voor voortgezet speciaal onderwijs
      en in het laatste schooljaar onderwijs volgt in het arbeidsmarktgerichte uitstroomprofiel als bedoeld in
      [artikel 14c van de WEC][ref2], respectievelijk een leer-werktraject in het uitstroomprofiel vervolgonderwijs,
      bedoeld in [artikel 14a van de WEC][ref3];

      b. de stage van de uitstroomprofielen, bedoeld in het eerste lid, een omvang heeft van tenminste
      640 klokuren en voldoet aan de voorwaarden, bedoeld in [artikel 17, van de WEC][ref4] en
      [Titel III van het Onderwijskundig besluit WEC][ref5];

      c. de verzorging van het onderricht in de praktijk van het beroep voor de leerling door de werkgever plaats heeft
      gevonden op grond van en overeenkomstig een stage-overeenkomst;

      d. de werkgever over een gunstige beoordeling beschikt door de Samenwerkingsorganisatie beroepsonderwijs
      bedrijfsleven als bedoeld in [artikel 1.5.3, tweede lid, van de WEB][ref6];

      e. de werkgever beschikt over een aanwezigheidsregistratie van de leerling bij het praktijkgedeelte; en

      f. de werkgever beschikt over een administratie waaruit de begeleiding van de leerling blijkt en de wijze waarop de
      leerling de leerdoelen van het praktijkgedeelte heeft behaald.


