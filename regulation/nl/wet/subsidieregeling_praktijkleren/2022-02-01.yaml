  - number: 9d
    text: |-
      Subsidie op grond van [artikel 9c, eerste lid][ref1], wordt slechts verstrekt voor zover:

      a. de leerling als daadwerkelijk schoolgaand staat ingeschreven aan een school voor praktijkonderwijs als bedoeld
      in [artikel 10f van de WVO][ref2] en onderwijs volgt in het laatste schooljaar;

      b. de stage een omvang heeft van tenminste 640 klokuren en voldoet aan de voorschriften, bedoeld in
      [paragraaf 6 van hoofdstuk III van het Inrichtingsbesluit WVO][ref3];

      c. de verzorging van het onderricht in de praktijk van het beroep voor de leerling door de werkgever plaats heeft
      gevonden op grond van en overeenkomstig een stageovereenkomst;

      d. de werkgever over een gunstige beoordeling beschikt door de Samenwerkingsorganisatie beroepsonderwijs
      bedrijfsleven als bedoeld in [artikel 1.5.3, tweede lid, van de WEB][ref4];

      e. de werkgever beschikt over een aanwezigheidsregistratie van de leerling bij het praktijkgedeelte; en

      f. de werkgever beschikt over een administratie waaruit de begeleiding van de leerling blijkt en de wijze waarop de
      leerling de leerdoelen van het praktijkgedeelte heeft behaald.


      [ref1]: https://wetten.overheid.nl/BWBR0034144#Artikel9c
