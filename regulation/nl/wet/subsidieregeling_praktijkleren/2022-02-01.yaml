  - number: '8'
    text: |-
      1 De minister kan subsidie verstrekken aan een werkgever voor een gerealiseerde werkleerplaats voor een promovendus
      of technologisch ontwerper in opleiding.

      2 Onder werkgever wordt in dit artikel verstaan een privaatrechtelijke rechtspersoon, met uitzondering van de
      bijzondere universiteiten of de daaraan verbonden academische ziekenhuizen genoemd in de [bijlage bij de WHW]
      (onbekend) en de privaatrechtelijke onderzoeksorganisaties.
    url: https://wetten.overheid.nl/BWBR0034144/2022-02-01#Artikel8
  - number: '9'
    text: |-
      1 Subsidie op grond van [artikel 8][ref1] wordt slechts verstrekt voor zover:

      a. de promovendus:

      1° voor zijn onderzoek een arbeidsovereenkomst met een universiteit of een instituut van de NWO of de KNAW
      heeft, op basis van een overeenkomst tussen één van die instellingen en de werkgever over de financiering van de
      loonkosten van de promovendus door de werkgever; of

      2° met de werkgever een arbeidsovereenkomst heeft en de werkgever een overeenkomst heeft met een universiteit of
      een instituut van de NWO of de KNAW over de begeleiding door die instelling van de promovendus bij diens onderzoek;
      of

      b. de technologisch ontwerper in opleiding:

      1° voor zijn opleiding een arbeidsovereenkomst met een universiteit heeft en in dat kader een ontwerpopdracht bij
      de werkgever vervult op basis van een overeenkomst tussen de universiteit en de werkgever; of

      2° een arbeidsovereenkomst heeft met de werkgever en de werkgever een overeenkomst heeft met een universiteit over
      de begeleiding door de universiteit van de technologisch ontwerper in opleiding bij diens opleiding.

      2 De overeenkomst, bedoeld in het eerste lid, onderdeel a, onder 1°, bevat in ieder geval:

      a. een bepaling dat de werkgever de loonkosten van de promovendus financiert;

      b. de periode van de arbeidsovereenkomst met de instelling, bedoeld in dat onderdeel, en de totale arbeidsduur in
      uren per week van de promovendus; en

      c. de naam en het adres van de werkgever, de instelling en de promovendus.

      3 De overeenkomst, bedoeld in het eerste lid, onderdeel a, onder 2°, bevat in ieder geval:

      a. de zaken, bedoeld in het tweede lid, onder a en c; en

      b. de periode van de begeleiding door de instelling, bedoeld in dat onderdeel, en de totale arbeidsduur in uren per
      week van de promovendus bij de werkgever.

      4 De overeenkomst, bedoeld in het eerste lid, onderdeel b, onder 1°, bevat in ieder geval:

      a. de periode waarin de technologisch ontwerper in opleiding de ontwerpopdracht bij de werkgever vervult en de
      arbeidsduur in uren per week van de technologisch ontwerper in opleiding; en

      b. de naam en het adres van de werkgever, de universiteit en de technologisch ontwerper in opleiding.

      5 Het derde lid is van overeenkomstige toepassing op de overeenkomst, bedoeld in het eerste lid, onderdeel b, onder
      2°.


      [ref1]: https://wetten.overheid.nl/BWBR0034144#Artikel8
