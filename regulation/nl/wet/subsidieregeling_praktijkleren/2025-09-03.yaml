  - number: '12.1'
    text: |-
      Met een mbo-student of hbo-student aan een opleiding als bedoeld in [artikel 4][ref1] of [6][ref2] wordt
      gelijkgesteld een natuurlijke persoon die gedurende het desbetreffende studiejaar een opleiding heeft gevolgd
      in een andere lidstaat van de Europese Unie of een andere staat die partij is bij de Overeenkomst betreffende de
      Europese Economische Ruimte, indien de werkgever gevestigd is in Nederland en beschikt over een verklaring van
      de minister dat die opleiding wat betreft niveau en kwaliteit vergelijkbaar is met een opleiding als bedoeld in
      [artikel 5, onder a][ref3], onderscheidenlijk [artikel 7, onder a][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0034144#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0034144#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0034144#Artikel5
