        bwb_id: BWBR0037603
  - number: '3'
    text: |-
      1 Deze regeling heeft tot doel het stimuleren van werkgevers tot het bieden van praktijkleerplaatsen en
      werkleerplaatsen door middel van de verstrekking van subsidie.

      2 De subsidie is een tegemoetkoming in de kosten van een werkgever voor de begeleiding van een leerling, mbo-
      student of hbo-student of een tegemoetkoming in de loonkosten of begeleidingskosten van een promovendus of
      technologisch ontwerper in opleiding.
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel3
  - number: '4'
    text: |-
      1 De minister kan subsidie verstrekken aan een werkgever voor een gerealiseerde praktijkleerplaats voor een mbo-
      student in het kader van een beroepsopleiding voor zover het betreft de beroepsbegeleidende leerweg als bedoeld in
      [artikel 7.2.2, tweede lid, van de WEB][ref1], of [artikel 7.2.2, tweede lid, onderdeel b, van de WEB BES][ref2].

      2 Onder werkgever wordt in dit artikel verstaan het bedrijf dat of de organisatie die het onderricht in de praktijk
      van het beroep voor de mbo-student verzorgt.

      3 Op grond van deze regeling wordt geen subsidie verstrekt voor een gerealiseerde praktijkleerplaats
      voor een mbo-student in het kader van een beroepsopleiding, bedoeld in het eerste lid, indien de
      beroepspraktijkvormingsovereenkomst uitsluitend betrekking heeft op één of meer keuzedelen.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7.2.2
      [ref2]: https://wetten.overheid.nl/BWBR0028395#Artikel7.2.2
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel4
