  - number: 9a
    text: |-
      1 De minister kan subsidie verstrekken aan een werkgever voor een gerealiseerde praktijkleerplaats voor een
      leerling in het kader van het arbeidsmarktgerichte uitstroomprofiel in het voortgezet speciaal onderwijs als
      bedoeld in [artikel 14c van de WEC][ref1].

      2 Onder werkgever genoemd in het eerste lid wordt verstaan de stagegever, bedoeld in
      [artikel 6, van het Onderwijskundig besluit WEC][ref2], niet zijnde het bevoegd gezag, bedoeld in
      [artikel 9, derde lid, van het Onderwijskundig besluit WEC][ref3].

      3 De minister kan subsidie verstrekken aan een werkgever voor een gerealiseerde praktijkleerplaats voor een
      leerling in het kader van een leer-werktraject in het uitstroomprofiel vervolgonderwijs van het voortgezet speciaal
      onderwijs, bedoeld in [artikel 14a van de WEC][ref4].

      4 Onder werkgever, genoemd in het derde lid, wordt verstaan het bedrijf dat of de organisatie die
      de begeleiding van de leerling verzorgt als bedoeld in [artikel 14a, tweede lid, van de WEC][ref5]
      juncto [artikel 2.105 WVO 2020][ref6], niet zijnde het bevoegd gezag, bedoeld in
      [artikel 9, derde lid, van het Onderwijskundig besluit WEC][ref7].

      5 De minister kan subsidie verstrekken aan een werkgever voor een gerealiseerde praktijkleerplaats
      voor een leerling in het kader van een entreeopleiding in het uitstroomprofiel vervolgonderwijs van
      het voortgezet speciaal onderwijs, als bedoeld in artikel 14a tweede lid, van de WEC in samenhang met
      [artikel 2.102 van de WVO 2020][ref8].

      6 Onder een werkgever als bedoeld in het vijfde lid, wordt verstaan het bedrijf dat of de organisatie die de
      begeleiding van de leerling verzorgt als bedoeld in [artikel 14a, tweede lid, van de WEC][ref9], niet zijnde het
      bevoegd gezag, bedoeld in [artikel 9, derde lid, van het Onderwijskundig besluit WEC][ref10].


