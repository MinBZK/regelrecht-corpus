    text: |-
      het persoonsgebonden nummer, bedoeld in [artikel 8, eerste lid, onder a, van deze wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0042012#Artikel8
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel7
    references:
      - id: ref1
