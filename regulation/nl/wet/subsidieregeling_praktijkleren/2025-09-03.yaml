  - number: '24'
    text: |-
      1 Een verklaring als bedoeld in [artikel 12, eerste lid][ref1], wordt verstrekt op aanvraag.

      2 Een aanvraag wordt ingediend met gebruikmaking van het aanvraagformulier dat door de minister bekend wordt
      gemaakt.

      3 Een aanvraag voor de vergelijking van een buitenlandse opleiding met een opleiding als bedoeld in
      [artikel 4][ref2] of [6][ref3] geeft in ieder geval inzicht in de vooropleiding die toegang geeft tot de
      opleiding.

      4 In aanvulling op het derde lid geeft een aanvraag voor de vergelijking met een opleiding als bedoeld in
      [artikel 4][ref4] in ieder geval inzicht in:

      a. het vakkenpakket waaruit de opleiding bestaat;

      b. de hoeveelheid onderwijsuren waaruit de opleiding bestaat; en

      c. het aantal uren en aandeel van de beroepspraktijkvorming, als onderdeel van de opleiding.


      [ref1]: https://wetten.overheid.nl/BWBR0034144#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0034144#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0034144#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0034144#Artikel4
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel24
