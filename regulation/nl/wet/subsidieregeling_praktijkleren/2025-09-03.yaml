    text: |-
      Voor de verstrekking van aanvullende subsidies op grond van deze paragraaf, is voor het studiejaar 2020–2021
      € 6.700.000,- beschikbaar en voor het studiejaar 2021–2022 is jaarlijks € 8.000.000 beschikbaar.
