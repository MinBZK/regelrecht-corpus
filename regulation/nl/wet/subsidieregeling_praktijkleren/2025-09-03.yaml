  - number: '17.1'
    text: |-
      Een aanvraag voor subsidie wordt ingediend uiterlijk om 17:00 uur op 17 september na het studiejaar waarvoor
      subsidie wordt gevraagd, met dien verstande dat de subsidie voor de laatste maal uiterlijk om 17:00 uur op
      18 september 2028 kan worden aangevraagd. Aanvragen die later worden ontvangen worden afgewezen.
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel17
  - number: '17.2'
    text: |-
      In geval het indienen van een aanvraag op of kort voor de sluitingsdatum van een aanvraagronde langere tijd niet
      mogelijk is door een calamiteit aan de kant van het elektronisch loket, bedoeld in [artikel 18][ref1], kan de
      minister met inachtneming van een redelijke termijn een nieuw tijdstip voor uiterste indiening van een aanvraag
      bepalen.


      [ref1]: https://wetten.overheid.nl/BWBR0034144#Artikel18
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0034144
        artikel: '18'
        paragraaf: '2'
  - number: '17.3'
    text: |-
      Voor aanvragers op Bonaire geldt dat een aanvraag voor subsidie uiterlijk wordt ingediend om 17:00 uur lokale tijd
      op 17 september na het studiejaar waarvoor subsidie wordt aangevraagd, met dien verstande dat de subsidie voor
      de laatste maal uiterlijk om 17:00 uur op 18 september 2028 kan worden aangevraagd. Aanvragen die later worden
      ontvangen worden afgewezen.
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel17
  - number: '17.4'
    text: |-
      Indien een aanvraag onvolledig is en de aanvrager op grond van [artikel 4:5 van de Algemene wet bestuursrecht][ref1]
      in de gelegenheid is gesteld zijn aanvraag aan te vullen, geldt als datum van ontvangst de datum waarop de
      aanvullende informatie is ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '18.1'
    text: |-
      Een subsidieaanvraag wordt elektronisch ingediend via de website www.rvo.nl/subsidies-regelingen/subsidieregeling-
      praktijkleren.
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel18
  - number: '18.2'
    text: |-
      Een subsidieaanvraag voor een gerealiseerde praktijkleerplaats op Bonaire wordt in persoon ingediend, op een
      hiervoor bestemde locatie die wordt bekend gemaakt op de website [https://www.rvo.nl/praktijkleren/cn](https://
      www.rvo.nl/praktijkleren/cn).
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel18
  - number: '19.1'
    text: |-
      Voor de indiening van een aanvraag wordt gebruik gemaakt van het hiervoor bestemde aanvraagformulier dat wordt
      bekendgemaakt op de website [www.rvo.nl/praktijkleren](http://www.rvo.nl/praktijkleren).
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel19
  - number: '19.2'
    text: |-
      De minister kan na indiening van een aanvraag, de aanvrager verplichten de documenten, bedoeld in
      [artikel 5][ref1], [7][ref2], [9][ref3], [9b][ref4], [9d][ref5] of [11][ref6] over te leggen. [Artikel 17][ref7]
      is niet van toepassing op het indienen van deze documenten.


      [ref1]: https://wetten.overheid.nl/BWBR0034144#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0034144#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0034144#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0034144#Artikel9b
      [ref5]: https://wetten.overheid.nl/BWBR0034144#Artikel9d
      [ref6]: https://wetten.overheid.nl/BWBR0034144#Artikel11
      [ref7]: https://wetten.overheid.nl/BWBR0034144#Artikel17
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0034144
        artikel: '5'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0034144
        artikel: '7'
        paragraaf: '1'
