  - number: '20'
    text: |-
      Onverminderd [artikel 4:35 van de Algemene wet bestuursrecht][ref1] wordt de subsidieverstrekking geweigerd voor
      zover door verstrekking van de subsidie:

      a. aan de werkgever voor de mbo-student of hbo-student voor meer volledige gerealiseerde praktijkleerplaatsen
      subsidie zou worden verstrekt dan de duur van de opleiding van de mbo-student of hbo-student in studiejaren;

      b. aan de werkgever voor de promovendus voor meer dan vier volledige gerealiseerde werkleerplaatsen subsidie zou
      worden verstrekt; of

      c. aan de werkgever voor de technologisch ontwerper in opleiding voor meer dan twee volledige gerealiseerde
      werkleerplaatsen subsidie zou worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel435
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:35
  - number: '21'
    text: |-
      De minister beslist met toepassing van [artikel 15][ref1] gelijktijdig op de voor het desbetreffende studiejaar
      ontvangen aanvragen.


      [ref1]: https://wetten.overheid.nl/BWBR0034144#Artikel15
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0034144
        artikel: '15'
        paragraaf: '1'
  - number: '22'
    text: |-
      De minister beslist binnen dertien weken na 17 september van enig kalenderjaar op de voor het daaraan voorafgaande
      studiejaar ontvangen aanvragen.
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel22
  - number: '23'
    text: |-
      1 Aan de verstrekking van subsidie is de verplichting verbonden dat de subsidieontvanger de documenten, bedoeld in
      [artikel 5][ref1], [7][ref2], [9][ref3], [9b][ref4], [9d][ref5] of [11][ref6] gedurende vijf jaren bewaart na het
      studiejaar waarvoor subsidie is verstrekt.

      2 De verplichting, bedoeld in het eerste lid, geldt niet voor subsidieontvangers op Bonaire.


      [ref1]: https://wetten.overheid.nl/BWBR0034144#Artikel5
