  - number: '25'
    text: |-
      1 De minister beslist binnen acht weken op een aanvraag voor een verklaring als bedoeld in
      [artikel 12, eerste lid][ref1].

      2 De verklaring vermeldt het tijdstip vanaf welk moment de opleiding waarop de verklaring betrekking heeft als een
      vergelijkbare opleiding wordt aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0034144#Artikel12
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0034144
        artikel: '12'
        paragraaf: '1'
  - number: '26'
    text: |-
      Een aanvraag voor een verklaring wordt in ieder geval geweigerd indien de buitenlandse opleiding niet in dat land
      is erkend of het opleidingsniveau lager is dan een vergelijkbare Nederlandse opleiding.
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel26
  - number: '27'
    text: |-
      Aan de Directeur-generaal Rijksdienst voor Ondernemend Nederland van het Ministerie van Economische Zaken wordt
      mandaat verleend tot:

      a. het nemen van besluiten namens de minister op grond van deze regeling, met uitzondering van [paragraaf 4][ref1];
      en

      b. het beslissen op bezwaarschriften tegen besluiten als bedoeld in onderdeel a, voor zover het besluit waartegen
      het bezwaar zich richt, niet door hem in mandaat is genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0034144#Paragraaf4
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0034144
        paragraaf: '4'
  - number: 27a
    text: |-
      1 De minister is verwerkingsverantwoordelijke als bedoeld in [artikel 4][ref1] van de [Verordening (EU) 2016/679]
      (32016R0679) van het Europees Parlement en de Raad van 27 april 2016 betreffende de bescherming van natuurlijke
      personen in verband met de verwerking van persoonsgegevens en betreffende het vrije verkeer van die gegevens en
      tot intrekking van [Richtlijn 95/46/EG](31995L0046), voor de verwerking van persoonsgegevens op basis van deze
      regeling.

      2 De Directeur-generaal Rijksdienst voor Ondernemend Nederland van het Ministerie van Economische Zaken
      is verwerker voor de verwerking van persoonsgegevens ter uitvoering van de gemandateerde taken, bedoeld in
      [artikel 27][ref2]. Aan de Directeur-generaal Rijksdienst voor Ondernemend Nederland van het Ministerie van
      Economische Zaken wordt mandaat verleend tot het afhandelen van verzoeken van betrokkenen op grond van de
      [Verordening (EU) 2016/679](32016R0679) van het Europees Parlement en de Raad van 27 april 2016 betreffende de
      bescherming van natuurlijke personen in verband met de verwerking van persoonsgegevens en betreffende het vrije
      verkeer van die gegevens en tot intrekking van [Richtlijn 95/46/EG](31995L0046), en het voorbereiden en nemen van
      besluiten in dit kader namens de minister.

      3 De persoonsgegevens die verwerkt worden ter uitvoering van deze regeling worden niet verder verwerkt voor andere
      doeleinden, met uitzondering van verwerking van deze gegevens voor zover dat noodzakelijk is voor de uitvoering van
      de [Subsidieregeling groepshulpen kinderopvang][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0034144#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0034144#Artikel27
      [ref3]: https://wetten.overheid.nl/BWBR0049599
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel27a
    references:
      - id: ref1
        bwb_id: BWBR0034144
        artikel: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0034144
        artikel: '27'
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0049599
  - number: '28'
    text: |-
      De Directeur-generaal Rijksdienst voor Ondernemend Nederland van het Ministerie van Economische Zaken kan met
      betrekking tot zijn bevoegdheden, bedoeld in [artikel 27][ref1] en [27a][ref2], ondermandaat verlenen aan één of
      meer onder hem ressorterende medewerkers.


      [ref1]: https://wetten.overheid.nl/BWBR0034144#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0034144#Artikel27a
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel28
    references:
