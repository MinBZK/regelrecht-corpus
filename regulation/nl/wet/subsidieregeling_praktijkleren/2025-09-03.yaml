  - number: '15'
    text: |-
      1 Het subsidiebedrag per gerealiseerde praktijkleerplaats of gerealiseerde werkleerplaats wordt berekend aan
      de hand van het beschikbare bedrag voor de desbetreffende categorie gedeeld door het aantal gerealiseerde
      praktijkleerplaatsen of werkleerplaatsen dat in aanmerking komt voor subsidie voor die categorie. Het maximumbedrag
      per gerealiseerde praktijkplaats of werkleerplaats wordt jaarlijks vastgesteld en bekendgemaakt door middel van
      een bekendmakingsbesluit.

      2 Het subsidiebedrag per gerealiseerde praktijkleerplaats op Bonaire wordt jaarlijks vastgesteld en bekendgemaakt
      door middel van een bekendmakingsbesluit. Het subsidiebedrag wordt omgerekend in US-dollars tegen de jaarlijks
      vastgestelde wisselkoers.
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel15
  - number: 15a
    text: |-
      In deze paragraaf wordt verstaan onder:

        - *hoofdactiviteit:* activiteit van een werkgever die valt onder de SBI-code die als eerste in het handelsregister
      van de Kamer van Koophandel is geregistreerd;
        - *SBI-code:* code van de Standaard Bedrijfsindeling zoals gehanteerd door het Centraal Bureau voor de Statistiek
      waarmee de economische activiteit van een bedrijf wordt weergegeven.
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel15a
  - number: 15b
    text: |-
      1 Voor de verstrekking van aanvullende subsidies op grond van deze paragraaf voor mbo-praktijkplaatsen in
      de sectoren landbouw, horeca of recreatie, is voor de studiejaren 2020–2021 tot en met 2022–2023 jaarlijks
      € 10.600.000 beschikbaar en is voor het studiejaar 2023–2024 € 11.629.000 beschikbaar.

      2 Voor de verstrekking van aanvullende subsidies op grond van deze paragraaf voor mbo-praktijkleerplaatsen
      voor opleidingen als bedoeld in [bijlage 4][ref1] bij deze regeling is voor studiejaar 2025–2026 € 7.000.000,–
      beschikbaar.

      3 Voor de verstrekking van aanvullende subsidies op grond van deze paragraaf voor mbo-praktijkleerplaatsen in
      sectoren die contact- en conjunctuurgevoelig zijn, is voor het studiejaar 2020–2021 € 15.800.000 beschikbaar en is
      voor het studiejaar 2021–2022 € 19.000.000 beschikbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0034144
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel15b
    references:
      - id: ref1
        bwb_id: BWBR0034144
  - number: 15c
    text: |-
      1 In aanvulling op de subsidie die wordt verstrekt aan een werkgever op grond van [artikel 4][ref1],
      kan de Minister subsidie verstrekken voor een gerealiseerde praktijkplaats voor een mbo-student in
      het kader van een beroepsopleiding voor zover het betreft de beroepsbegeleidende leerweg, bedoeld in
      [artikel 7.2.2, tweede lid, van de WEB][ref2], in één van de sectoren landbouw, horeca of recreatie.

      2 In afwijking van [artikel 16][ref3] kunnen slechts werkgevers in aanmerking komen voor de aanvullende
      subsidie waarvan op het moment van aanvragen en gedurende het studiejaar waarop de aanvraag betrekking heeft,
      de hoofdactiviteit bij de Kamer van Koophandel geregistreerd staat onder één van de SBI-codes die voorkomt in
      [bijlage 1][ref4] bij deze regeling.

      3 De subsidie wordt op aanvraag verstrekt. De subsidieaanvraag maakt onderdeel uit van de aanvraag, bedoeld in
      [artikel 16][ref5], juncto [artikel 4][ref6].

      4 In afwijking van [artikel 15][ref7] wordt het subsidiebedrag per gerealiseerde praktijkleerplaats berekend
      aan de hand van het beschikbare bedrag voor de desbetreffende categorie gedeeld door het aantal gerealiseerde
      praktijkleerplaatsen dat in aanmerking komt voor subsidie.

      5 In afwijking van het tweede lid kan de aanvullende subsidie ook worden toegekend indien de werkgever ten genoegen
      van de Minister aantoont dat een onderneming op het moment van aanvragen en gedurende het studiejaar waarop de
      aanvraag betrekking heeft, feitelijk een activiteit uitvoert als hoofdactiviteit die valt onder een SBI-code die
      in [bijlage 1][ref8] van deze regeling is opgenomen. De werkgever kan dit aantonen aan de hand van een afschrift
      van de Kamer van Koophandel, waarin de desbetreffende SBI-code is geregistreerd, in samenhang met andere stukken
      waaruit blijkt dat de werkgever feitelijk een hoofdactiviteit heeft die onder één van de in de bijlage 1 opgenomen
      SBI-codes valt.


