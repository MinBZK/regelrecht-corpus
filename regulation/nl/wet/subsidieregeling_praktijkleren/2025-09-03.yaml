        artikel: 9d
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0034144
        artikel: '11'
        paragraaf: '1'
  - number: 19.3.b
    text: |-
      indien de aanvraag wordt ingediend door een gemachtigde, de machtiging waaruit blijkt dat de gemachtigde bevoegd is
      de documenten namens de aanvrager in te dienen.
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel19
  - number: '19.4'
    text: |-
      Voor het indienen van de documenten, bedoeld in het derde lid, onderdeel a, houdende de gegevens
      bedoeld in [artikel 5, onderdelen e en f][ref1], [artikel 9d, onderdelen f en g][ref2], en
      [artikel 11, eerste lid, onderdelen e en f, en tweede lid, onderdelen f en g][ref3], wordt gebruik gemaakt van
      formulieren die bekend worden gemaakt op de website [www.rvo.nl/praktijkleren/cn](http://www.rvo.nl/praktijkleren/
      cn).


      [ref1]: https://wetten.overheid.nl/BWBR0034144#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0034144#Artikel9d
      [ref3]: https://wetten.overheid.nl/BWBR0034144#Artikel11
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel19
