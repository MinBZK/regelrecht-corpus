    text: |-
      1 Subsidie op grond van [artikel 9c, eerste lid][ref1], wordt slechts verstrekt voor zover:

      a. de leerling als daadwerkelijk schoolgaand staat ingeschreven aan een school voor praktijkonderwijs als bedoeld
      in [artikel 2.8 van de WVO 2020][ref2] en onderwijs volgt in het laatste schooljaar;

      b. de stage een omvang heeft van tenminste 640 klokuren en voldoet aan de voorschriften, bedoeld in de
      [artikelen 2.34 tot en met 2.37][ref3], [2.39][ref4] en [2.44 van het Uitvoeringsbesluit WVO 2020][ref5];

      c. de verzorging van het onderricht in de praktijk van het beroep voor de leerling door de werkgever plaats heeft
      gevonden op grond van en overeenkomstig een stageovereenkomst;

      d. de volgende gegevens aan de Minister zijn geleverd, bedoeld in
      [artikel 12 van de Wet register onderwijsdeelnemers][ref6]:

      1°. het persoonsgebonden nummer, bedoeld in [artikel 8, eerste lid, onder a, van deze wet][ref7];

      2°. de basisgegevens, bedoeld in [artikel 10, eerste lid, van deze wet][ref8]; en

      3°. de diplomagegevens, bedoeld in [artikel 10, vierde lid, van deze wet][ref9];

      e. de werkgever over een gunstige beoordeling beschikt door de Samenwerkingsorganisatie
      beroepsonderwijs bedrijfsleven als bedoeld in [artikel 1.5.3, tweede lid, van de WEB][ref10],
      dan wel over een positieve beoordeling beschikt van de Raad onderwijs arbeidsmarkt, bedoeld in
      [artikel 1.5.2, vierde en vijfde lid, van de WEB BES][ref11];

      f. de werkgever beschikt over een aanwezigheidsregistratie van de leerling bij het praktijkgedeelte; en

      g. de werkgever beschikt over een administratie waaruit de begeleiding van de leerling blijkt en de wijze waarop de
      leerling de leerdoelen van het praktijkgedeelte heeft behaald.

      2 De voorwaarde, bedoeld in het eerste lid, onderdeel d, geldt niet voor gerealiseerde praktijkleerplaatsen op
      Bonaire.


