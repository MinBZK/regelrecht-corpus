        bwb_id: BWBR0005537
        artikel: '4'
  - number: 20.a
    text: |-
      aan de werkgever voor de mbo-student of hbo-student voor meer volledige gerealiseerde praktijkleerplaatsen subsidie
      zou worden verstrekt dan de duur van de opleiding van de mbo-student of hbo-student in studiejaren;
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel20
  - number: 20.b
    text: |-
      aan de werkgever voor de promovendus voor meer dan vier volledige gerealiseerde werkleerplaatsen subsidie zou
      worden verstrekt; of
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel20
  - number: 20.c
    text: |-
      aan de werkgever voor de technologisch ontwerper in opleiding voor meer dan twee volledige gerealiseerde
      werkleerplaatsen subsidie zou worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel20
  - number: '21'
    text: |-
      De minister beslist met toepassing van [artikel 15][ref1] gelijktijdig op de voor het desbetreffende studiejaar
      ontvangen aanvragen.


      [ref1]: https://wetten.overheid.nl/BWBR0034144#Artikel15
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0034144
        artikel: '15'
        paragraaf: '1'
  - number: '22'
    text: |-
      De minister beslist binnen dertien weken na 17 september van enig kalenderjaar op de voor het daaraan voorafgaande
      studiejaar ontvangen aanvragen.
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel22
  - number: '23.1'
    text: |-
      Aan de verstrekking van subsidie is de verplichting verbonden dat de subsidieontvanger de documenten, bedoeld in
      [artikel 5][ref1], [7][ref2], [9][ref3], [9b][ref4], [9d][ref5] of [11][ref6] gedurende vijf jaren bewaart na het
      studiejaar waarvoor subsidie is verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0034144#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0034144#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0034144#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0034144#Artikel9b
      [ref5]: https://wetten.overheid.nl/BWBR0034144#Artikel9d
      [ref6]: https://wetten.overheid.nl/BWBR0034144#Artikel11
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0034144
        artikel: '5'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0034144
        artikel: '7'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0034144
        artikel: '9'
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0034144
        artikel: 9b
        paragraaf: '1'
      - id: ref5
        bwb_id: BWBR0034144
        artikel: 9d
        paragraaf: '1'
      - id: ref6
        bwb_id: BWBR0034144
        artikel: '11'
        paragraaf: '1'
  - number: '23.2'
    text: De verplichting, bedoeld in het eerste lid, geldt niet voor subsidieontvangers op Bonaire.
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel23
  - number: '24.1'
    text: |-
      Een verklaring als bedoeld in [artikel 12, eerste lid][ref1], wordt verstrekt op aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0034144#Artikel12
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0034144
        artikel: '12'
        paragraaf: '1'
  - number: '24.2'
    text: Een aanvraag wordt ingediend met gebruikmaking van het aanvraagformulier dat door de minister bekend wordt gemaakt.
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel24
  - number: '24.3'
    text: |-
      Een aanvraag voor de vergelijking van een buitenlandse opleiding met een opleiding als bedoeld in [artikel 4][ref1]
      of [6][ref2] geeft in ieder geval inzicht in de vooropleiding die toegang geeft tot de opleiding.


      [ref1]: https://wetten.overheid.nl/BWBR0034144#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0034144#Artikel6
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0034144
        artikel: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0034144
        artikel: '6'
        paragraaf: '1'
  - number: '24.4'
    text: |-
      In aanvulling op het derde lid geeft een aanvraag voor de vergelijking met een opleiding als bedoeld in
      [artikel 4][ref1] in ieder geval inzicht in:


      [ref1]: https://wetten.overheid.nl/BWBR0034144#Artikel4
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0034144
        artikel: '4'
        paragraaf: '1'
  - number: 24.4.a
    text: het vakkenpakket waaruit de opleiding bestaat;
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel24
  - number: 24.4.b
    text: de hoeveelheid onderwijsuren waaruit de opleiding bestaat; en
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel24
  - number: 24.4.c
    text: het aantal uren en aandeel van de beroepspraktijkvorming, als onderdeel van de opleiding.
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel24
  - number: '25.1'
    text: |-
      De minister beslist binnen acht weken op een aanvraag voor een verklaring als bedoeld in
      [artikel 12, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0034144#Artikel12
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0034144
        artikel: '12'
        paragraaf: '1'
  - number: '25.2'
    text: |-
      De verklaring vermeldt het tijdstip vanaf welk moment de opleiding waarop de verklaring betrekking heeft als een
      vergelijkbare opleiding wordt aangemerkt.
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel25
  - number: '26'
    text: |-
      Een aanvraag voor een verklaring wordt in ieder geval geweigerd indien de buitenlandse opleiding niet in dat land
      is erkend of het opleidingsniveau lager is dan een vergelijkbare Nederlandse opleiding.
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel26
  - number: '27'
    text: |-
      Aan de Directeur-generaal Rijksdienst voor Ondernemend Nederland van het Ministerie van Economische Zaken wordt
      mandaat verleend tot:
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel27
  - number: 27.a
    text: |-
      het nemen van besluiten namens de minister op grond van deze regeling, met uitzondering van [paragraaf 4][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0034144#Paragraaf4
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0034144
        paragraaf: '4'
  - number: 27.b
    text: |-
      het beslissen op bezwaarschriften tegen besluiten als bedoeld in onderdeel a, voor zover het besluit waartegen het
      bezwaar zich richt, niet door hem in mandaat is genomen.
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel27
  - number: 27a.1
    text: |-
      De minister is verwerkingsverantwoordelijke als bedoeld in [artikel 4][ref1] van de [Verordening (EU) 2016/679]
      (32016R0679) van het Europees Parlement en de Raad van 27 april 2016 betreffende de bescherming van natuurlijke
      personen in verband met de verwerking van persoonsgegevens en betreffende het vrije verkeer van die gegevens en
      tot intrekking van [Richtlijn 95/46/EG](31995L0046), voor de verwerking van persoonsgegevens op basis van deze
      regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0034144#Artikel4
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel27a
    references:
      - id: ref1
        bwb_id: BWBR0034144
        artikel: '4'
        paragraaf: '1'
  - number: 27a.2
    text: |-
      De Directeur-generaal Rijksdienst voor Ondernemend Nederland van het Ministerie van Economische Zaken is verwerker
      voor de verwerking van persoonsgegevens ter uitvoering van de gemandateerde taken, bedoeld in [artikel 27][ref1].
      Aan de Directeur-generaal Rijksdienst voor Ondernemend Nederland van het Ministerie van Economische Zaken wordt
      mandaat verleend tot het afhandelen van verzoeken van betrokkenen op grond van de [Verordening (EU) 2016/679]
      (32016R0679) van het Europees Parlement en de Raad van 27 april 2016 betreffende de bescherming van natuurlijke
      personen in verband met de verwerking van persoonsgegevens en betreffende het vrije verkeer van die gegevens en
      tot intrekking van [Richtlijn 95/46/EG](31995L0046), en het voorbereiden en nemen van besluiten in dit kader namens
      de minister.


      [ref1]: https://wetten.overheid.nl/BWBR0034144#Artikel27
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel27a
    references:
      - id: ref1
        bwb_id: BWBR0034144
        artikel: '27'
        paragraaf: '5'
  - number: 27a.3
    text: |-
      De persoonsgegevens die verwerkt worden ter uitvoering van deze regeling worden niet verder verwerkt voor andere
      doeleinden, met uitzondering van verwerking van deze gegevens voor zover dat noodzakelijk is voor de uitvoering van
      de [Subsidieregeling groepshulpen kinderopvang][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0049599
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel27a
    references:
      - id: ref1
        bwb_id: BWBR0049599
  - number: '28'
    text: |-
      De Directeur-generaal Rijksdienst voor Ondernemend Nederland van het Ministerie van Economische Zaken kan met
      betrekking tot zijn bevoegdheden, bedoeld in [artikel 27][ref1] en [27a][ref2], ondermandaat verlenen aan één of
      meer onder hem ressorterende medewerkers.


      [ref1]: https://wetten.overheid.nl/BWBR0034144#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0034144#Artikel27a
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0034144
        artikel: '27'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0034144
        artikel: 27a
        paragraaf: '5'
  - number: '29'
    text: |-
      Onverminderd het toezicht door de Inspectie van het onderwijs worden de ambtenaren die een arbeidsovereenkomst
      hebben bij het Ministerie van Economische Zaken en Klimaat, voor zover zij werkzaamheden verrichten ten behoeve van
      de uitvoering van deze regeling, belast met het toezicht op de naleving van het bepaalde bij deze regeling.
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel29
  - number: '31'
    text: |-
      Ten aanzien van subsidieverstrekking voor het studiejaar 2020–2021, is de weigeringsgrond, bedoeld in
      [artikel 20, aanhef en onderdeel a][ref1], niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0034144#Artikel20
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0034144
        artikel: '20'
        paragraaf: '3'
  - number: 31a
    text: |-
      Deze regeling is mede gebaseerd op [artikel 2.4.1 van de Wet educatie en beroepsonderwijs BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel2
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel31a
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '2'
  - number: '34.1'
    text: Deze regeling treedt in werking met ingang van 1 januari 2014.
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel34
  - number: '34.2'
    text: Deze regeling vervalt met ingang van 1 januari 2029.
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel34
  - number: '35'
    text: 'Deze regeling wordt aangehaald als: Subsidieregeling praktijkleren.'
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel35
