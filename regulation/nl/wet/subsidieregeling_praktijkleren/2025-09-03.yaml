    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel13
  - number: '14'
    text: |-
      1 De minister maakt jaarlijks de hoogte van de subsidieplafonds voor de subsidies, bedoeld in de
      [artikelen 4][ref1], [6][ref2], [8][ref3] en [9a][ref4], [9c][ref5] en [10][ref6], bekend in de Staatscourant.

      2 Indien in enig jaar een beschikbaar bedrag niet geheel wordt verstrekt, kan het resterende bedrag naar verhouding
      van de budgetten gelijkelijk worden verdeeld over de overige in het eerste lid bedoelde budgetten.


