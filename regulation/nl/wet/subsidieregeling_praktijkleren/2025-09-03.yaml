        artikel: 7.2.2
  - number: '5'
    text: |-
      1 Subsidie op grond van [artikel 4][ref1] wordt slechts verstrekt voor zover:

      a. de mbo-student gedurende het desbetreffende studiejaar of een deel daarvan een beroepsopleiding heeft gevolgd
      die gericht is op het behalen van een kwalificatie die is opgenomen in de Registratie instellingen en opleidingen,
      bedoeld in [artikel 6.4.1 van de WEB][ref2] en [artikel 6.1.1 van de WEB BES][ref3];

      b. de volgende gegevens aan de Minister zijn geleverd als bedoeld in
      [artikel 12 van de Wet register onderwijsdeelnemers][ref4]:

      1°. het persoonsgebonden nummer, bedoeld in [artikel 8, eerste lid, onder a, van deze wet][ref5];

      2°. de basisgegevens, bedoeld in [artikel 10, eerste lid, van deze wet][ref6]; en

      3°. de diplomagegevens, bedoeld in [artikel 10, vierde lid, van deze wet][ref7];

      c. het onderwijsprogramma van de beroepsopleiding, bedoeld onder a, aan de eisen met betrekking
      tot voldoende begeleide onderwijsuren en uren beroepspraktijkvorming voldoet als bedoeld in
      [artikel 7.2.7, vierde lid, van de WEB][ref8] of [artikel 7.2.6 van de WEB BES][ref9];

      d. de verzorging van het onderricht in de praktijk van het beroep voor de mbo-student door de werkgever plaats
      heeft gevonden op grond van en overeenkomstig een praktijkleerovereenkomst;

      e. de werkgever beschikt over een aanwezigheidsregistratie van de mbo-student bij de beroepspraktijkvorming; en

      f. de werkgever beschikt over een administratie waaruit de begeleiding van de mbo-student blijkt en de wijze waarop
      de mbo-student het deel van de beroepsopleiding met betrekking tot de beroepspraktijkvorming heeft gerealiseerd.

      2 De voorwaarde, bedoeld in het eerste lid, onderdeel b, geldt niet voor gerealiseerde praktijkleerplaatsen op
      Bonaire.


