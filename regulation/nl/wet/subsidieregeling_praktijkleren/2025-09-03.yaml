      [ref1]: https://wetten.overheid.nl/BWBR0042012#Artikel10
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0042012
        artikel: '10'
  - number: 7.b.3°
    text: |-
      De diplomagegevens, bedoeld in [artikel 10, vierde lid, van deze wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0042012#Artikel10
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0042012
        artikel: '10'
  - number: 7.c
    text: |-
      de verzorging van het onderricht in de praktijk van het beroep voor de hbo-student door de werkgever plaats heeft
      gevonden op grond van en overeenkomstig een praktijkleerovereenkomst;
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel7
  - number: 7.d
    text: de werkgever beschikt over een aanwezigheidsregistratie van de hbo-student bij de beroepsuitoefening; en
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel7
  - number: 7.e
    text: |-
      de werkgever beschikt over een administratie waaruit de begeleiding van de hbo-student blijkt en de wijze waarop de
      hbo-student het deel van de kwaliteiten met betrekking tot de beroepsuitoefening heeft gerealiseerd.
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel7
  - number: '8.1'
    text: |-
      De minister kan subsidie verstrekken aan een werkgever voor een gerealiseerde werkleerplaats voor een promovendus
      of technologisch ontwerper in opleiding.
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel8
  - number: '8.2'
    text: |-
      Onder werkgever wordt in dit artikel verstaan een privaatrechtelijke rechtspersoon, met uitzondering van de
      bijzondere universiteiten of de daaraan verbonden academische ziekenhuizen genoemd in de [bijlage bij de WHW]
      (onbekend) en de privaatrechtelijke onderzoeksorganisaties.
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel8
  - number: '9.1'
    text: |-
      Subsidie op grond van [artikel 8][ref1] wordt slechts verstrekt voor zover:


      [ref1]: https://wetten.overheid.nl/BWBR0034144#Artikel8
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0034144
        artikel: '8'
        paragraaf: '1'
  - number: 9.1.a
    text: 'de promovendus:'
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel9
  - number: 9.1.a.1
    text: |-
      voor zijn onderzoek een arbeidsovereenkomst met een universiteit of een instituut van de NWO of de KNAW heeft, op
      basis van een overeenkomst tussen één van die instellingen en de werkgever over de financiering van de loonkosten
      van de promovendus door de werkgever; of
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel9
  - number: 9.1.a.2
    text: |-
      met de werkgever een arbeidsovereenkomst heeft en de werkgever een overeenkomst heeft met een universiteit of een
      instituut van de NWO of de KNAW over de begeleiding door die instelling van de promovendus bij diens onderzoek; of
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel9
  - number: 9.1.b
    text: 'de technologisch ontwerper in opleiding:'
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel9
  - number: 9.1.b.1
    text: |-
      voor zijn opleiding een arbeidsovereenkomst met een universiteit heeft en in dat kader een ontwerpopdracht bij de
      werkgever vervult op basis van een overeenkomst tussen de universiteit en de werkgever; of
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel9
  - number: 9.1.b.2
    text: |-
      een arbeidsovereenkomst heeft met de werkgever en de werkgever een overeenkomst heeft met een universiteit over de
      begeleiding door de universiteit van de technologisch ontwerper in opleiding bij diens opleiding.
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel9
  - number: '9.2'
    text: 'De overeenkomst, bedoeld in het eerste lid, onderdeel a, onder 1°, bevat in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel9
  - number: 9.2.a
    text: een bepaling dat de werkgever de loonkosten van de promovendus financiert;
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel9
  - number: 9.2.b
    text: |-
      de periode van de arbeidsovereenkomst met de instelling, bedoeld in dat onderdeel, en de totale arbeidsduur in uren
      per week van de promovendus; en
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel9
  - number: 9.2.c
    text: de naam en het adres van de werkgever, de instelling en de promovendus.
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel9
  - number: '9.3'
    text: 'De overeenkomst, bedoeld in het eerste lid, onderdeel a, onder 2°, bevat in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel9
  - number: 9.3.a
    text: de zaken, bedoeld in het tweede lid, onder a en c; en
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel9
  - number: 9.3.b
    text: |-
      de periode van de begeleiding door de instelling, bedoeld in dat onderdeel, en de totale arbeidsduur in uren per
      week van de promovendus bij de werkgever.
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel9
  - number: '9.4'
    text: 'De overeenkomst, bedoeld in het eerste lid, onderdeel b, onder 1°, bevat in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel9
  - number: 9.4.a
    text: |-
      de periode waarin de technologisch ontwerper in opleiding de ontwerpopdracht bij de werkgever vervult en de
      arbeidsduur in uren per week van de technologisch ontwerper in opleiding; en
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel9
  - number: 9.4.b
    text: de naam en het adres van de werkgever, de universiteit en de technologisch ontwerper in opleiding.
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel9
  - number: '9.5'
    text: |-
      Het derde lid is van overeenkomstige toepassing op de overeenkomst, bedoeld in het eerste lid, onderdeel b, onder
      2°.
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel9
  - number: 9a.1
    text: |-
      De minister kan subsidie verstrekken aan een werkgever voor een gerealiseerde praktijkleerplaats voor een leerling
      in het kader van het arbeidsmarktgerichte uitstroomprofiel in het voortgezet speciaal onderwijs als bedoeld in
      [artikel 14c van de WEC][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel14c
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 14c
  - number: 9a.2
    text: |-
      Onder werkgever genoemd in het eerste lid wordt verstaan de stagegever, bedoeld in
      [artikel 6, van het Onderwijskundig besluit WEC][ref1], niet zijnde het bevoegd gezag, bedoeld in
      [artikel 9, derde lid, van het Onderwijskundig besluit WEC][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003848#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0003848#Artikel9
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0003848
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0003848
        artikel: '9'
  - number: 9a.3
    text: |-
      De minister kan subsidie verstrekken aan een werkgever voor een gerealiseerde praktijkleerplaats voor een leerling
      in het kader van een leer-werktraject in het uitstroomprofiel vervolgonderwijs van het voortgezet speciaal
      onderwijs, bedoeld in [artikel 14a van de WEC][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel14a
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 14a
  - number: 9a.4
    text: |-
      Onder werkgever, genoemd in het derde lid, wordt verstaan het bedrijf dat of de organisatie die
      de begeleiding van de leerling verzorgt als bedoeld in [artikel 14a, tweede lid, van de WEC][ref1]
      juncto [artikel 2.105 WVO 2020][ref2], niet zijnde het bevoegd gezag, bedoeld in
      [artikel 9, derde lid, van het Onderwijskundig besluit WEC][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel14a
      [ref2]: https://wetten.overheid.nl/BWBR0044212#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0003848#Artikel9
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 14a
      - id: ref2
        bwb_id: BWBR0044212
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0003848
        artikel: '9'
  - number: 9a.5
    text: |-
      De minister kan subsidie verstrekken aan een werkgever voor een gerealiseerde praktijkleerplaats voor
      een leerling in het kader van een entreeopleiding in het uitstroomprofiel vervolgonderwijs van het
      voortgezet speciaal onderwijs, als bedoeld in artikel 14a tweede lid, van de WEC in samenhang met
      [artikel 2.102 van de WVO 2020][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '2'
  - number: 9a.6
    text: |-
      Onder een werkgever als bedoeld in het vijfde lid, wordt verstaan het bedrijf dat of de organisatie die de
      begeleiding van de leerling verzorgt als bedoeld in [artikel 14a, tweede lid, van de WEC][ref1], niet zijnde het
      bevoegd gezag, bedoeld in [artikel 9, derde lid, van het Onderwijskundig besluit WEC][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel14a
      [ref2]: https://wetten.overheid.nl/BWBR0003848#Artikel9
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 14a
      - id: ref2
        bwb_id: BWBR0003848
        artikel: '9'
  - number: 9b
    text: |-
      Subsidie op grond van [artikel 9a, eerste, derde en vijfde lid][ref1], wordt slechts verstrekt voor zover:


      [ref1]: https://wetten.overheid.nl/BWBR0034144#Artikel9a
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel9b
