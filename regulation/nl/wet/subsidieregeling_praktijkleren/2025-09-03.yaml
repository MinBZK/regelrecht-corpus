        bwb_id: BWBR0034144
        artikel: '20'
        paragraaf: '3'
  - number: 31a
    text: |-
      Deze regeling is mede gebaseerd op [artikel 2.4.1 van de Wet educatie en beroepsonderwijs BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel2.4.1
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel31a
