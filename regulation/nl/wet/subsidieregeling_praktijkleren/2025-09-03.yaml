preamble:
  text: |-
    Gelet op artikel 2.7 van de Wet educatie en beroepsonderwijs en de artikelen 4 en 10 van de Wet overige OCW-
    subsidies;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze regeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel1
  - number: 1.a
    text: |-
      *beroepsopleiding:* beroepsopleiding als bedoeld in [artikel 7.1.2, tweede lid, van de WEB][ref1], of
      [artikel 7.1.2, tweede lid van de WEB BES][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0028395#Artikel7
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0028395
        artikel: '7'
  - number: 1.b
    text: |-
      *gerealiseerde praktijkleerplaats:* het aantal weken dat tijdens de praktijkleerplaats daadwerkelijk onderricht in
      de praktijk van het beroep plaats vindt tot ten hoogste 40 weken per studiejaar gedeeld door 40 voor zover het een
      beroepsopleiding, het voortgezet speciaal onderwijs of het voortgezet onderwijs betreft, onderscheidenlijk tot ten
      hoogste 42 weken gedeeld door 42 voor zover het een opleiding in het hoger beroepsonderwijs betreft;
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel1
  - number: 1.c
    text: |-
      *gerealiseerde werkleerplaats:* het aantal maanden in een studiejaar dat een promovendus zijn onderzoek verricht of
      een technologisch ontwerper in opleiding staat ingeschreven bij een universiteit voor zijn opleiding, gedeeld door
      twaalf en vermenigvuldigd met de totale arbeidsduur van de promovendus of technologisch ontwerper in opleiding in
      uren per week tot ten hoogste 36 uur gedeeld door 36;
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel1
  - number: 1.d
    text: '*hbo-student:* student die is ingeschreven aan een hoger beroepsopleiding;'
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel1
  - number: 1.e
    text: |-
      *KNAW:* Koninklijke Nederlandse Akademie voor Wetenschappen, bedoeld in [artikel 1.5, eerste lid, van de WHW][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
  - number: 1.f
    text: |-
      *leerling:* leerling als bedoeld in de WEC of de [WVO 2020][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0044212
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0044212
  - number: 1.g
    text: |-
      *mbo-student:* student als bedoeld in de [WEB][ref1], of de [WEB BES][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0007625
      [ref2]: https://wetten.overheid.nl/BWBR0028395
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007625
      - id: ref2
        bwb_id: BWBR0028395
  - number: 1.h
    text: '*minister:* Minister van Onderwijs, Cultuur en Wetenschap;'
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel1
  - number: 1.i
    text: |-
      *NWO:* Nederlandse organisatie voor wetenschappelijk onderzoek, bedoeld in
      [artikel 2 van de Wet op de Nederlandse organisatie voor wetenschappelijk onderzoek][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004191#Artikel2
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004191
        artikel: '2'
  - number: 1.j
    text: |-
      *praktijkleerovereenkomst:* overeenkomst als bedoeld in [artikel 7.2.8 van de WEB][ref1],
      [artikel 7.2.7 van de WEB BES][ref2], [artikel 7.7, vijfde lid, van de WHW][ref3]
      of [2.103, zesde lid, van de WVO 2020][ref4] dan wel stage-overeenkomst als
      bedoeld in [artikel 9 van het Onderwijskundig besluit WEC][ref5], respectievelijk
      [artikel 2.36 van het Uitvoeringsbesluit WVO 2020][ref6];


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0028395#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0044212#Artikel2
      [ref5]: https://wetten.overheid.nl/BWBR0003848#Artikel9
      [ref6]: https://wetten.overheid.nl/BWBR0045787#Artikel2
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel1
    references:
      - id: ref1
