      en in het laatste schooljaar onderwijs volgt in het arbeidsmarktgerichte uitstroomprofiel als bedoeld in
      [artikel 14c van de WEC][ref1], een leer-werktraject in het uitstroomprofiel vervolgonderwijs, bedoeld in
      [artikel 14a van de WEC][ref2] respectievelijk een entreeopleiding in het uitstroomprofiel vervolgonderwijs
      van het voortgezet speciaal onderwijs als bedoeld in [artikel 14a tweede lid van de WEC][ref3] in samenhang met
      [artikel 2.102 van de WVO 2020][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel14c
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel14a
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel14a
      [ref4]: https://wetten.overheid.nl/BWBR0044212#Artikel2
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel9b
    references:
