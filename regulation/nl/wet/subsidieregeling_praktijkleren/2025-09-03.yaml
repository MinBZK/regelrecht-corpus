      1 Subsidie op grond van [artikel 10, eerste lid][ref1], wordt slechts verstrekt voor zover:

      a. de leerling een basisberoepsgerichte leerweg in het voortgezet onderwijs volgt die is ingericht
      als leer-werktraject als bedoeld in [artikel 2.103 van de WVO 2020][ref2] en dat specifiek is gericht
      op het behalen van een startkwalificatie op het niveau van de basisberoepsopleiding, bedoeld in
      [artikel 7.2.2, eerste lid, onder b, van de WEB][ref3];

      b. het praktijkgedeelte van het leer-werktraject voldoet aan het aantal klokuren, bedoeld in
      [artikel 2.38, negende lid, van de WVO 2020][ref4];

      c. de verzorging van het onderricht in de praktijk van het beroep voor de leerling door de werkgever plaats heeft
      gevonden op grond van en overeenkomstig een praktijkleerovereenkomst;

      d. de volgende gegevens aan de Minister zijn geleverd, bedoeld in
      [artikel 12 van de Wet register onderwijsdeelnemers][ref5]:

      1°. het persoonsgebonden nummer, bedoeld in [artikel 8, eerste lid, onder a, van deze wet][ref6];

      2°. de basisgegevens, bedoeld in [artikel 10, eerste lid, van deze wet][ref7]; en

      3°. de diplomagegevens, bedoeld in [artikel 10, vierde lid, van deze wet][ref8];

      e. de werkgever beschikt over een aanwezigheidsregistratie van de leerling bij het praktijkgedeelte; en

      f. de werkgever beschikt over een administratie waaruit de begeleiding van de leerling blijkt en de wijze waarop de
      leerling de leerdoelen van het praktijkgedeelte heeft behaald.

      2 Subsidie op grond van [artikel 10, derde lid][ref9], wordt slechts verstrekt voor zover:

      a. de leerling een basisberoepsgerichte leerweg in het voortgezet onderwijs volgt die is ingericht als
      entreeopleiding als bedoeld in [artikel 2.102 van de WVO 2020][ref10] en dat wordt verzorgd als beroepsbegeleidende
      leerweg, bedoeld in [artikel 7.2.2, tweede lid, van de WEB][ref11];

      b. de beroepspraktijkvorming van de entreeopleiding voldoet aan het aantal klokuren, bedoeld in
      [artikel 7.2.7, vierde lid, van de WEB][ref12];

      c. de verzorging van het onderricht in de praktijk van het beroep voor de leerling door de werkgever plaats heeft
      gevonden op grond van en overeenkomstig een praktijkleerovereenkomst;

      d. de volgende gegevens aan de Minister zijn geleverd, bedoeld in
      [artikel 12 van de Wet register onderwijsdeelnemers][ref13]:

      1°. het persoonsgebonden nummer, bedoeld in [artikel 8, eerste lid, onder a, van deze wet][ref14];

      2°. de basisgegevens, bedoeld in [artikel 10, eerste lid, van deze wet][ref15]; en

      3°. de diplomagegevens, bedoeld in [artikel 10, vierde lid, van deze wet][ref16];

      e. de werkgever beschikt over een gunstige beoordeling door de Samenwerkingsorganisatie
      beroepsonderwijs bedrijfsleven, bedoeld in [artikel 1.5.3, tweede lid, van de WEB][ref17],
      dan wel over een positieve beoordeling beschikt van de Raad onderwijs arbeidsmarkt, bedoeld in
      [artikel 1.5.2, vierde en vijfde, lid van de WEB BES][ref18];

      f. de werkgever beschikt over een aanwezigheidsregistratie van de leerling bij het praktijkgedeelte; en

      g. de werkgever beschikt over een administratie waaruit de begeleiding van de leerling blijkt en de wijze waarop de
      leerling de leerdoelen van het praktijkgedeelte heeft behaald.

      3 De voorwaarde, bedoeld in het eerste lid, onderdeel d, en het tweede lid, onderdeel d, geldt niet voor
      gerealiseerde praktijkleerplaatsen op Bonaire.


