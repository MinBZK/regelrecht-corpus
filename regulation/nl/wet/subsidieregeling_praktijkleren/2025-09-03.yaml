  - number: '14.2'
    text: |-
      Indien in enig jaar een beschikbaar bedrag niet geheel wordt verstrekt, kan het resterende bedrag naar verhouding
      van de budgetten gelijkelijk worden verdeeld over de overige in het eerste lid bedoelde budgetten.
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel14
  - number: '15.1'
    text: |-
      Het subsidiebedrag per gerealiseerde praktijkleerplaats of gerealiseerde werkleerplaats wordt berekend aan
      de hand van het beschikbare bedrag voor de desbetreffende categorie gedeeld door het aantal gerealiseerde
      praktijkleerplaatsen of werkleerplaatsen dat in aanmerking komt voor subsidie voor die categorie. Het maximumbedrag
      per gerealiseerde praktijkplaats of werkleerplaats wordt jaarlijks vastgesteld en bekendgemaakt door middel van
      een bekendmakingsbesluit.
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel15
  - number: '15.2'
    text: |-
      Het subsidiebedrag per gerealiseerde praktijkleerplaats op Bonaire wordt jaarlijks vastgesteld en bekendgemaakt
      door middel van een bekendmakingsbesluit. Het subsidiebedrag wordt omgerekend in US-dollars tegen de jaarlijks
      vastgestelde wisselkoers.
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel15
  - number: 15a
    text: |-
      In deze paragraaf wordt verstaan onder: - *hoofdactiviteit:* activiteit van een werkgever die valt onder de SBI-
      code die als eerste in het handelsregister van de Kamer van Koophandel is geregistreerd;
        - *SBI-code:* code van de Standaard Bedrijfsindeling zoals gehanteerd door het Centraal Bureau voor de Statistiek
      waarmee de economische activiteit van een bedrijf wordt weergegeven.
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel15a
  - number: 15b.1
    text: |-
      Voor de verstrekking van aanvullende subsidies op grond van deze paragraaf voor mbo-praktijkplaatsen in de sectoren
      landbouw, horeca of recreatie, is voor de studiejaren 2020–2021 tot en met 2022–2023 jaarlijks € 10.600.000
      beschikbaar en is voor het studiejaar 2023–2024 € 11.629.000 beschikbaar.
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel15b
  - number: 15b.2
    text: |-
      Voor de verstrekking van aanvullende subsidies op grond van deze paragraaf voor mbo-praktijkleerplaatsen voor
      opleidingen als bedoeld in [bijlage 4][ref1] bij deze regeling is voor studiejaar 2025–2026 € 7.000.000,–
      beschikbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0034144
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel15b
    references:
      - id: ref1
        bwb_id: BWBR0034144
  - number: 15b.3
    text: |-
      Voor de verstrekking van aanvullende subsidies op grond van deze paragraaf voor mbo-praktijkleerplaatsen in
      sectoren die contact- en conjunctuurgevoelig zijn, is voor het studiejaar 2020–2021 € 15.800.000 beschikbaar en is
      voor het studiejaar 2021–2022 € 19.000.000 beschikbaar.
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel15b
  - number: 15c.1
    text: |-
      In aanvulling op de subsidie die wordt verstrekt aan een werkgever op grond van [artikel 4][ref1],
      kan de Minister subsidie verstrekken voor een gerealiseerde praktijkplaats voor een mbo-student in
      het kader van een beroepsopleiding voor zover het betreft de beroepsbegeleidende leerweg, bedoeld in
      [artikel 7.2.2, tweede lid, van de WEB][ref2], in één van de sectoren landbouw, horeca of recreatie.


      [ref1]: https://wetten.overheid.nl/BWBR0034144#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel15c
    references:
      - id: ref1
        bwb_id: BWBR0034144
        artikel: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '7'
  - number: 15c.2
    text: |-
      In afwijking van [artikel 16][ref1] kunnen slechts werkgevers in aanmerking komen voor de aanvullende subsidie
      waarvan op het moment van aanvragen en gedurende het studiejaar waarop de aanvraag betrekking heeft, de
      hoofdactiviteit bij de Kamer van Koophandel geregistreerd staat onder één van de SBI-codes die voorkomt in
      [bijlage 1][ref2] bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0034144#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0034144
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel15c
    references:
      - id: ref1
        bwb_id: BWBR0034144
        artikel: '16'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0034144
  - number: 15c.3
    text: |-
      De subsidie wordt op aanvraag verstrekt. De subsidieaanvraag maakt onderdeel uit van de aanvraag, bedoeld in
      [artikel 16][ref1], juncto [artikel 4][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0034144#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0034144#Artikel4
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel15c
    references:
      - id: ref1
        bwb_id: BWBR0034144
        artikel: '16'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0034144
        artikel: '4'
        paragraaf: '1'
  - number: 15c.4
    text: |-
      In afwijking van [artikel 15][ref1] wordt het subsidiebedrag per gerealiseerde praktijkleerplaats berekend
      aan de hand van het beschikbare bedrag voor de desbetreffende categorie gedeeld door het aantal gerealiseerde
      praktijkleerplaatsen dat in aanmerking komt voor subsidie.


      [ref1]: https://wetten.overheid.nl/BWBR0034144#Artikel15
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel15c
    references:
      - id: ref1
        bwb_id: BWBR0034144
        artikel: '15'
        paragraaf: '1'
  - number: 15c.5
    text: |-
      In afwijking van het tweede lid kan de aanvullende subsidie ook worden toegekend indien de werkgever ten genoegen
      van de Minister aantoont dat een onderneming op het moment van aanvragen en gedurende het studiejaar waarop de
      aanvraag betrekking heeft, feitelijk een activiteit uitvoert als hoofdactiviteit die valt onder een SBI-code die
      in [bijlage 1][ref1] van deze regeling is opgenomen. De werkgever kan dit aantonen aan de hand van een afschrift
      van de Kamer van Koophandel, waarin de desbetreffende SBI-code is geregistreerd, in samenhang met andere stukken
      waaruit blijkt dat de werkgever feitelijk een hoofdactiviteit heeft die onder één van de in de bijlage 1 opgenomen
      SBI-codes valt.


      [ref1]: https://wetten.overheid.nl/BWBR0034144
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel15c
    references:
      - id: ref1
        bwb_id: BWBR0034144
  - number: 15c1.1
    text: |-
      In aanvulling op de subsidie die wordt verstrekt aan een werkgever op grond van [artikel 4][ref1],
      kan de minister subsidie verstrekken voor een gerealiseerde praktijkleerplaats voor een mbo-student in
      het kader van een beroepsopleiding voor zover het betreft de beroepsbegeleidende leerweg, bedoeld in
      [artikel 7.2.2, tweede lid, van de WEB][ref2] of [artikel 7.2.2, tweede lid, onderdeel b, van de WEB BES][ref3], en
      voor zover deze opleiding wordt genoemd in [bijlage 4][ref4] bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0034144#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0028395#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0034144
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel15c1
    references:
      - id: ref1
        bwb_id: BWBR0034144
        artikel: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0028395
        artikel: '7'
      - id: ref4
        bwb_id: BWBR0034144
  - number: 15c1.2
    text: |-
      De subsidie wordt op aanvraag verstrekt. De subsidieaanvraag maakt onderdeel uit van de aanvraag, bedoeld in
      [artikel 16][ref1] juncto [artikel 4][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0034144#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0034144#Artikel4
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel15c1
    references:
      - id: ref1
        bwb_id: BWBR0034144
        artikel: '16'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0034144
        artikel: '4'
        paragraaf: '1'
  - number: 15c1.3
    text: |-
      In afwijking van [artikel 15][ref1] wordt het subsidiebedrag per gerealiseerde praktijkleerplaats, als bedoeld
      in het eerste lid, berekend aan de hand van het beschikbare bedrag voor deze categorie gedeeld door het aantal
      gerealiseerde praktijkplaatsen dat in aanmerking komt voor subsidie, met een maximum van € 500,– per gerealiseerde
      praktijkleerplaats als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0034144#Artikel15
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel15c1
    references:
      - id: ref1
        bwb_id: BWBR0034144
        artikel: '15'
        paragraaf: '1'
  - number: 15c2.1
    text: |-
      In aanvulling op de subsidie die wordt verstrekt aan een werkgever op grond van [artikel 4][ref1],
      kan de Minister subsidie verstrekken voor een gerealiseerde praktijkplaats voor een mbo-student in
      het kader van een beroepsopleiding voor zover het betreft de beroepsbegeleidende leerweg, bedoeld in
      [artikel 7.2.2, tweede lid, van de WEB][ref2], in een sector die contact- en conjunctuurgevoelig is.


      [ref1]: https://wetten.overheid.nl/BWBR0034144#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel15c2
    references:
      - id: ref1
        bwb_id: BWBR0034144
        artikel: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '7'
  - number: 15c2.2
    text: |-
      In afwijking van [artikel 16][ref1] kunnen slechts werkgevers in aanmerking komen voor de aanvullende subsidie
      waarvan op het moment van aanvragen en gedurende het studiejaar waarop de aanvraag betrekking heeft, de
      hoofdactiviteit bij de Kamer van Koophandel geregistreerd staat onder één van de SBI-codes die voorkomt in
      [bijlage 2][ref2] bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0034144#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0034144
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel15c2
    references:
      - id: ref1
        bwb_id: BWBR0034144
        artikel: '16'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0034144
  - number: 15c2.3
    text: |-
      De aanvullende subsidie wordt op aanvraag verstrekt. De subsidieaanvraag maakt onderdeel uit van de aanvraag,
      bedoeld in [artikel 16][ref1], juncto [artikel 4][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0034144#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0034144#Artikel4
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel15c2
    references:
      - id: ref1
        bwb_id: BWBR0034144
        artikel: '16'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0034144
        artikel: '4'
        paragraaf: '1'
  - number: 15c2.4
    text: |-
      In afwijking van [artikel 15][ref1] wordt het subsidiebedrag per gerealiseerde praktijkleerplaats berekend
      aan de hand van het beschikbare bedrag voor de desbetreffende categorie gedeeld door het aantal gerealiseerde
      praktijkleerplaatsen dat in aanmerking komt voor subsidie.


      [ref1]: https://wetten.overheid.nl/BWBR0034144#Artikel15
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel15c2
    references:
      - id: ref1
        bwb_id: BWBR0034144
        artikel: '15'
        paragraaf: '1'
  - number: 15c2.5
    text: |-
      Aanvullende subsidie kan ook worden toegekend indien de werkgever ten genoegen van de Minister aantoont dat een
      onderneming op het moment van aanvragen en gedurende het studiejaar waarop de aanvraag betrekking heeft, feitelijk
      een activiteit uitvoert als hoofdactiviteit die valt onder een SBI-code die in [bijlage 2][ref1] van deze regeling
      is opgenomen. De werkgever kan dit aantonen aan de hand van een afschrift van de Kamer van Koophandel, waarin de
      desbetreffende SBI-code is geregistreerd, in samenhang met andere stukken waaruit blijkt dat de werkgever feitelijk
      een hoofdactiviteit heeft die onder één van de in de bijlage 2 opgenomen SBI-codes valt.


      [ref1]: https://wetten.overheid.nl/BWBR0034144
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel15c2
    references:
      - id: ref1
        bwb_id: BWBR0034144
  - number: 15c2.6
    text: |-
      De aanvullende subsidie, bedoeld in dit artikel, kan slechts worden aangevraagd voor gerealiseerde praktijkplaatsen
      voor de studiejaren 2020–2021 en 2021–2022.
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel15c2
  - number: 15d.1
    text: |-
      De aanvulling op de subsidie wordt uitsluitend verstrekt indien de aanvraag voor subsidie, bedoeld in
      [artikel 4][ref1], wordt gehonoreerd.


      [ref1]: https://wetten.overheid.nl/BWBR0034144#Artikel4
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel15d
    references:
      - id: ref1
        bwb_id: BWBR0034144
        artikel: '4'
        paragraaf: '1'
  - number: 15d.2
    text: |-
      Bij de aanvraag voor subsidie, bedoeld in [artikel 4][ref1], overlegt de werkgever het nummer waaronder het is
      geregistreerd bij de Kamer van Koophandel.


      [ref1]: https://wetten.overheid.nl/BWBR0034144#Artikel4
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel15d
    references:
      - id: ref1
        bwb_id: BWBR0034144
        artikel: '4'
        paragraaf: '1'
  - number: 15e
    text: |-
      Voor de verstrekking van aanvullende subsidies op grond van deze paragraaf, is voor het studiejaar 2020–2021
      € 6.700.000,- beschikbaar en voor het studiejaar 2021–2022 is jaarlijks € 8.000.000 beschikbaar.
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel15e
  - number: 15f.1
    text: |-
      In aanvulling op de subsidie die wordt verstrekt aan een werkgever op grond van [artikel 6][ref1], kan de Minister
      aanvullende subsidie verstrekken voor een gerealiseerde praktijkplaats voor een hbo-student in het kader van een
      duale opleiding in het hoger beroepsonderwijs als bedoeld in [artikel 7.7, tweede lid, van de WHW][ref2] of een
      deeltijdse opleiding in het hoger beroepsonderwijs waarbij de beroepsuitoefening een verplicht onderdeel vormt van
      de opleiding.


      [ref1]: https://wetten.overheid.nl/BWBR0034144#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel15f
    references:
      - id: ref1
        bwb_id: BWBR0034144
        artikel: '6'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
  - number: 15f.2
    text: De aanvullende subsidie kan enkel worden verstrekt voor een opleiding als bedoeld in bijlage 3.
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel15f
  - number: 15f.3
    text: |-
      De aanvullende subsidie wordt verstrekt aan de aanvrager, wanneer deze hiervoor in aanmerking komt. De
      subsidieaanvraag maakt onderdeel uit van de aanvraag, bedoeld in [artikel 16][ref1], juncto [artikel 6][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0034144#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0034144#Artikel6
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel15f
    references:
      - id: ref1
        bwb_id: BWBR0034144
        artikel: '16'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0034144
        artikel: '6'
        paragraaf: '1'
  - number: 15f.4
    text: |-
      In afwijking van [artikel 15][ref1] wordt het subsidiebedrag per gerealiseerde praktijkleerplaats berekend
      aan de hand van het beschikbare bedrag voor de desbetreffende categorie gedeeld door het aantal gerealiseerde
      praktijkleerplaatsen dat in aanmerking komt voor subsidie. Het subsidiebedrag van de aanvullende subsidie bedraagt
      ten hoogste € 2.700.


      [ref1]: https://wetten.overheid.nl/BWBR0034144#Artikel15
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel15f
    references:
