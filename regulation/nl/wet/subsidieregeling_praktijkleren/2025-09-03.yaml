        bwb_id: BWBR0034144
        artikel: '15'
        paragraaf: '1'
  - number: 15f.5
    text: |-
      De aanvullende subsidie, bedoeld in dit artikel, kan slechts worden aangevraagd voor gerealiseerde praktijkplaatsen
      voor de studiejaren 2020–2021 en 2021–2022.
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel15f
  - number: 15g
    text: |-
      De aanvulling op de subsidie wordt uitsluitend verstrekt indien de ingediende aanvraag voor subsidie als bedoeld in
      [artikel 6][ref1], wordt gehonoreerd.


      [ref1]: https://wetten.overheid.nl/BWBR0034144#Artikel6
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel15g
    references:
      - id: ref1
        bwb_id: BWBR0034144
        artikel: '6'
        paragraaf: '1'
  - number: '16'
    text: |-
      Een werkgever als bedoeld in [artikel 4][ref1], [6][ref2], [8][ref3], [9a][ref4], [9c][ref5] of [10][ref6] kan
      een aanvraag voor subsidie als bedoeld in het desbetreffende artikel indienen.


      [ref1]: https://wetten.overheid.nl/BWBR0034144#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0034144#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0034144#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0034144#Artikel9a
      [ref5]: https://wetten.overheid.nl/BWBR0034144#Artikel9c
      [ref6]: https://wetten.overheid.nl/BWBR0034144#Artikel10
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel16
