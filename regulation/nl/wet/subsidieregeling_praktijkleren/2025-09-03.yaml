        bwb_id: BWBR0034144
        artikel: '17'
        paragraaf: '2'
  - number: '19.3'
    text: |-
      Bij de indiening van een aanvraag voor een gerealiseerde praktijkleerplaats op Bonaire worden door de aanvrager de
      volgende documenten overgelegd:
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel19
  - number: 19.3.a
    text: |-
      de documenten, bedoeld in [artikel 5][ref1], [9d][ref2] of [11][ref3]; en


      [ref1]: https://wetten.overheid.nl/BWBR0034144#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0034144#Artikel9d
      [ref3]: https://wetten.overheid.nl/BWBR0034144#Artikel11
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0034144
        artikel: '5'
        paragraaf: '1'
      - id: ref2
