        artikel: '2'
  - number: 1.k
    text: |-
      *praktijkleerplaats:* tijdsduur gedurende welk een bedrijf of organisatie onderricht in de praktijk van het beroep
      voor een leerling, mbo-student of hbo-student verzorgt op grond van een praktijkleerovereenkomst;
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel1
  - number: 1.l
    text: |-
      *promovendus:* natuurlijke persoon die een onderzoek verricht gericht op promotie als bedoeld in
      [artikel 7.18 WHW][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
  - number: 1.m
    text: |-
      *studiejaar:* tijdvak dat aanvangt op 1 augustus van een kalenderjaar en eindigt op 31 juli van het daaropvolgende
      kalenderjaar voor zover het een beroepsopleiding, het voortgezet speciaal onderwijs of het voortgezet
      onderwijs betreft of tijdvak dat aanvangt op 1 september van een kalenderjaar en eindigt op 31 augustus van het
      daaropvolgende kalenderjaar voor zover het een opleiding in het hoger beroepsonderwijs of een promovendus of
      technologisch ontwerper in opleiding betreft;
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel1
  - number: 1.n
    text: |-
      *technologisch ontwerper in opleiding:* natuurlijk persoon die staat ingeschreven bij een universiteit voor de
      opleiding gericht op de titel PDEng;
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel1
  - number: 1.o
    text: '*universiteit:* bekostigde universiteit als bedoeld in de onderdelen a en b, van de [bijlage bij de WHW](onbekend);'
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel1
  - number: 1.p
    text: |-
      *WEB:* [Wet educatie en beroepsonderwijs][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007625
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007625
  - number: 1.q
    text: |-
      *WEB BES:* [Wet educatie en beroepsonderwijs BES][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0028395
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0028395
  - number: 1.r
    text: |-
      *WEC:* [Wet op de expertisecentra][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003549
  - number: 1.s
    text: |-
      *werkgever:* bedrijf of organisatie die de praktijkleerplaats of werkleerplaats verzorgt en omschreven als
      bedoeld in [artikel 4, tweede lid][ref1], [6, tweede lid][ref2], [8, tweede lid][ref3], onderscheidenlijk
      [10, tweede lid][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0034144#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0034144#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0034144#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0034144#Artikel10
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0034144
        artikel: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0034144
        artikel: '6'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0034144
        artikel: '8'
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0034144
        artikel: '10'
        paragraaf: '1'
  - number: 1.t
    text: |-
      *werkleerplaats:* tijdsduur gedurende welke een promovendus aan een universiteit of instituut van de KNAW of NWO
      zijn onderzoek verricht of welke een technologisch ontwerper in opleiding zijn opleiding volgt;
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel1
  - number: 1.u
    text: |-
      *WHW:* [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005682
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005682
  - number: 1.v
    text: |-
      *WVO 2020:* [Wet voortgezet onderwijs 2020][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0044212
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0044212
  - number: '2'
    text: |-
      Deze regeling geldt in aanvulling op de [Kaderregeling subsidies OCW, SZW en VWS][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037603
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0037603
  - number: '3.1'
    text: |-
      Deze regeling heeft tot doel het stimuleren van werkgevers tot het bieden van praktijkleerplaatsen en
      werkleerplaatsen door middel van de verstrekking van subsidie.
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel3
  - number: '3.2'
    text: |-
      De subsidie is een tegemoetkoming in de kosten van een werkgever voor de begeleiding van een leerling, mbo-student
      of hbo-student of een tegemoetkoming in de loonkosten of begeleidingskosten van een promovendus of technologisch
      ontwerper in opleiding.
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel3
  - number: '4.1'
    text: |-
      De minister kan subsidie verstrekken aan een werkgever voor een gerealiseerde praktijkleerplaats voor een mbo-
      student in het kader van een beroepsopleiding voor zover het betreft de beroepsbegeleidende leerweg als bedoeld in
      [artikel 7.2.2, tweede lid, van de WEB][ref1], of [artikel 7.2.2, tweede lid, onderdeel b, van de WEB BES][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0028395#Artikel7
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0028395
        artikel: '7'
  - number: '4.2'
    text: |-
      Onder werkgever wordt in dit artikel verstaan het bedrijf dat of de organisatie die het onderricht in de praktijk
      van het beroep voor de mbo-student verzorgt.
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel4
  - number: '4.3'
    text: |-
      Op grond van deze regeling wordt geen subsidie verstrekt voor een gerealiseerde praktijkleerplaats
      voor een mbo-student in het kader van een beroepsopleiding, bedoeld in het eerste lid, indien de
      beroepspraktijkvormingsovereenkomst uitsluitend betrekking heeft op één of meer keuzedelen.
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel4
  - number: '5.1'
    text: |-
      Subsidie op grond van [artikel 4][ref1] wordt slechts verstrekt voor zover:


      [ref1]: https://wetten.overheid.nl/BWBR0034144#Artikel4
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0034144
        artikel: '4'
        paragraaf: '1'
  - number: 5.1.a
    text: |-
      de mbo-student gedurende het desbetreffende studiejaar of een deel daarvan een beroepsopleiding heeft gevolgd die
      gericht is op het behalen van een kwalificatie die is opgenomen in de Registratie instellingen en opleidingen,
      bedoeld in [artikel 6.4.1 van de WEB][ref1] en [artikel 6.1.1 van de WEB BES][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0028395#Artikel6
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0028395
        artikel: '6'
  - number: 5.1.b
    text: |-
      de volgende gegevens aan de Minister zijn geleverd als bedoeld in
      [artikel 12 van de Wet register onderwijsdeelnemers][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0042012#Artikel12
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0042012
        artikel: '12'
  - number: 5.1.b.1°
    text: |-
      het persoonsgebonden nummer, bedoeld in [artikel 8, eerste lid, onder a, van deze wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0042012#Artikel8
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0042012
        artikel: '8'
  - number: 5.1.b.2°
    text: |-
      de basisgegevens, bedoeld in [artikel 10, eerste lid, van deze wet][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0042012#Artikel10
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0042012
        artikel: '10'
  - number: 5.1.b.3°
    text: |-
      de diplomagegevens, bedoeld in [artikel 10, vierde lid, van deze wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0042012#Artikel10
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0042012
        artikel: '10'
  - number: 5.1.c
    text: |-
      het onderwijsprogramma van de beroepsopleiding, bedoeld onder a, aan de eisen met betrekking
      tot voldoende begeleide onderwijsuren en uren beroepspraktijkvorming voldoet als bedoeld in
      [artikel 7.2.7, vierde lid, van de WEB][ref1] of [artikel 7.2.6 van de WEB BES][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0028395#Artikel7
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0028395
        artikel: '7'
  - number: 5.1.d
    text: |-
      de verzorging van het onderricht in de praktijk van het beroep voor de mbo-student door de werkgever plaats heeft
      gevonden op grond van en overeenkomstig een praktijkleerovereenkomst;
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel5
  - number: 5.1.e
    text: de werkgever beschikt over een aanwezigheidsregistratie van de mbo-student bij de beroepspraktijkvorming; en
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel5
  - number: 5.1.f
    text: |-
      de werkgever beschikt over een administratie waaruit de begeleiding van de mbo-student blijkt en de wijze waarop de
      mbo-student het deel van de beroepsopleiding met betrekking tot de beroepspraktijkvorming heeft gerealiseerd.
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel5
  - number: '5.2'
    text: |-
      De voorwaarde, bedoeld in het eerste lid, onderdeel b, geldt niet voor gerealiseerde praktijkleerplaatsen op
      Bonaire.
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel5
  - number: '6.1'
    text: |-
      De minister kan subsidie verstrekken aan een werkgever voor een gerealiseerde praktijkleerplaats voor
      een hbo-student in het kader van een duale opleiding in het hoger beroepsonderwijs als bedoeld in
      [artikel 7.7, tweede lid, van de WHW][ref1] of een deeltijdse opleiding in het hoger beroepsonderwijs waarbij de
      beroepsuitoefening een verplicht onderdeel vormt van de opleiding.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
  - number: '6.2'
    text: |-
      Onder werkgever wordt in dit artikel verstaan een in Nederland gevestigd bedrijf dat of organisatie die het
      onderricht in de beroepsuitoefening voor de hbo-student verzorgt.
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel6
  - number: '7'
    text: |-
      Subsidie op grond van [artikel 6][ref1] wordt slechts verstrekt voor zover:


      [ref1]: https://wetten.overheid.nl/BWBR0034144#Artikel6
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0034144
        artikel: '6'
        paragraaf: '1'
  - number: 7.a
    text: |-
      de hbo-student gedurende het desbetreffende studiejaar een opleiding in het hoger beroepsonderwijs heeft gevolgd
      waarvoor op grond van [artikel 5.8][ref1] of [artikel 5.11 van de WHW][ref2] accreditatie is verleend en de
      opleiding is opgenomen in de Registratie instellingen en opleidingen, bedoeld in [artikel 6.13 van de WHW][ref3] en
      [artikel 6.1.1. van de WEB BES][ref4], en de code van de opleiding is opgenomen in de onderdelen 1°. techniek, 2°.
      gezondheidszorg, gedrag en maatschappij, of 3°. landbouw en natuurlijke omgeving;


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0028395#Artikel6
