  - number: 9b
    text: |-
      Subsidie op grond van [artikel 9a, eerste, derde en vijfde lid][ref1], wordt slechts verstrekt voor zover:

      a. de leerling als daadwerkelijk schoolgaand staat ingeschreven aan een school voor voortgezet speciaal
      onderwijs en in het laatste schooljaar onderwijs volgt in het arbeidsmarktgerichte uitstroomprofiel als bedoeld
      in [artikel 14c van de WEC][ref2], een leer-werktraject in het uitstroomprofiel vervolgonderwijs, bedoeld in
      [artikel 14a van de WEC][ref3] respectievelijk een entreeopleiding in het uitstroomprofiel vervolgonderwijs
      van het voortgezet speciaal onderwijs als bedoeld in [artikel 14a tweede lid van de WEC][ref4] in samenhang met
      [artikel 2.102 van de WVO 2020][ref5];

      b. de stage van de uitstroomprofielen, bedoeld in het eerste lid, een omvang heeft van tenminste
      640 klokuren en voldoet aan de voorwaarden, bedoeld in [artikel 17, van de WEC][ref6] en
      [Titel III van het Onderwijskundig besluit WEC][ref7];

      c. de verzorging van het onderricht in de praktijk van het beroep voor de leerling door de werkgever plaats heeft
      gevonden op grond van en overeenkomstig een stage-overeenkomst;

      d. de volgende gegevens aan de Minister zijn geleverd, bedoeld in
      [artikel 12 van de Wet register onderwijsdeelnemers][ref8]:

      1°. het persoonsgebonden nummer, bedoeld in [artikel 8, eerste lid, onder a, van deze wet][ref9];

      2°. de basisgegevens, bedoeld in [artikel 10, eerste lid, van deze wet][ref10]; en

      3°. de diplomagegevens, bedoeld in [artikel 10, vierde lid, van deze wet][ref11];

      e. de werkgever over een gunstige beoordeling beschikt door de Samenwerkingsorganisatie beroepsonderwijs
      bedrijfsleven als bedoeld in [artikel 1.5.3, tweede lid, van de WEB][ref12];

      f. de werkgever beschikt over een aanwezigheidsregistratie van de leerling bij het praktijkgedeelte; en

      g. de werkgever beschikt over een administratie waaruit de begeleiding van de leerling blijkt en de wijze waarop de
      leerling de leerdoelen van het praktijkgedeelte heeft behaald.


