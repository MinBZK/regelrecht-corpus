  - number: '18'
    text: |-
      1 Een subsidieaanvraag wordt elektronisch ingediend via de website www.rvo.nl/subsidies-regelingen/
      subsidieregeling-praktijkleren.

      2 Een subsidieaanvraag voor een gerealiseerde praktijkleerplaats op Bonaire wordt in persoon ingediend, op een
      hiervoor bestemde locatie die wordt bekend gemaakt op de website [https://www.rvo.nl/praktijkleren/cn](https://
      www.rvo.nl/praktijkleren/cn).
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel18
  - number: '19'
    text: |-
      1 Voor de indiening van een aanvraag wordt gebruik gemaakt van het hiervoor bestemde aanvraagformulier dat wordt
      bekendgemaakt op de website [www.rvo.nl/praktijkleren](http://www.rvo.nl/praktijkleren).

      2 De minister kan na indiening van een aanvraag, de aanvrager verplichten de documenten, bedoeld in
      [artikel 5][ref1], [7][ref2], [9][ref3], [9b][ref4], [9d][ref5] of [11][ref6] over te leggen. [Artikel 17][ref7]
      is niet van toepassing op het indienen van deze documenten.

      3 Bij de indiening van een aanvraag voor een gerealiseerde praktijkleerplaats op Bonaire worden door de aanvrager
      de volgende documenten overgelegd:

      a. de documenten, bedoeld in [artikel 5][ref8], [9d][ref9] of [11][ref10]; en

      b. indien de aanvraag wordt ingediend door een gemachtigde, de machtiging waaruit blijkt dat de gemachtigde bevoegd
      is de documenten namens de aanvrager in te dienen.

      4 Voor het indienen van de documenten, bedoeld in het derde lid, onderdeel a, houdende de gegevens
      bedoeld in [artikel 5, onderdelen e en f][ref11], [artikel 9d, onderdelen f en g][ref12], en
      [artikel 11, eerste lid, onderdelen e en f, en tweede lid, onderdelen f en g][ref13], wordt gebruik gemaakt van
      formulieren die bekend worden gemaakt op de website [www.rvo.nl/praktijkleren/cn](http://www.rvo.nl/praktijkleren/
      cn).


