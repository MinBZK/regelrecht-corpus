  - number: '7'
    text: |-
      Subsidie op grond van [artikel 6][ref1] wordt slechts verstrekt voor zover:

      a. de hbo-student gedurende het desbetreffende studiejaar een opleiding in het hoger beroepsonderwijs heeft
      gevolgd waarvoor op grond van [artikel 5.8][ref2] of [artikel 5.11 van de WHW][ref3] accreditatie is verleend en de
      opleiding is opgenomen in de Registratie instellingen en opleidingen, bedoeld in [artikel 6.13 van de WHW][ref4] en
      [artikel 6.1.1. van de WEB BES][ref5], en de code van de opleiding is opgenomen in de onderdelen 1°. techniek, 2°.
      gezondheidszorg, gedrag en maatschappij, of 3°. landbouw en natuurlijke omgeving;

      b. de volgende gegevens aan de Minister zijn geleverd als bedoeld in
      [artikel 12 van de Wet register onderwijsdeelnemers][ref6]:

      1°. het persoonsgebonden nummer, bedoeld in [artikel 8, eerste lid, onder a, van deze wet][ref7];

      2°. de basisgegevens, bedoeld in [artikel 10, eerste lid, van deze wet][ref8]; en

      3°. De diplomagegevens, bedoeld in [artikel 10, vierde lid, van deze wet][ref9];

      c. de verzorging van het onderricht in de praktijk van het beroep voor de hbo-student door de werkgever plaats
      heeft gevonden op grond van en overeenkomstig een praktijkleerovereenkomst;

      d. de werkgever beschikt over een aanwezigheidsregistratie van de hbo-student bij de beroepsuitoefening; en

      e. de werkgever beschikt over een administratie waaruit de begeleiding van de hbo-student blijkt en de wijze waarop
      de hbo-student het deel van de kwaliteiten met betrekking tot de beroepsuitoefening heeft gerealiseerd.


