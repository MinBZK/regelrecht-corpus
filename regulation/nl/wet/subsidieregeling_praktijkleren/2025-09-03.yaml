    text: |-
      1 In aanvulling op de subsidie die wordt verstrekt aan een werkgever op grond van [artikel 4][ref1],
      kan de minister subsidie verstrekken voor een gerealiseerde praktijkleerplaats voor een mbo-student in
      het kader van een beroepsopleiding voor zover het betreft de beroepsbegeleidende leerweg, bedoeld in
      [artikel 7.2.2, tweede lid, van de WEB][ref2] of [artikel 7.2.2, tweede lid, onderdeel b, van de WEB BES][ref3], en
