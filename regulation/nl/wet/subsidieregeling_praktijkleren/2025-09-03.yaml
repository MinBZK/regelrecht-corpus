      1 De minister kan subsidie verstrekken aan een werkgever voor een gerealiseerde praktijkleerplaats
      voor een leerling in het kader van een leer-werktraject in het voortgezet onderwijs als bedoeld in
      [artikel 2.103 van de WVO 2020][ref1].

      2 Onder werkgever wordt in dit artikel verstaan het bedrijf dat of de organisatie die de begeleiding van de
      leerling verzorgt als bedoeld in [artikel 2.105 van de WVO 2020][ref2].

      3 De minister kan subsidie verstrekken aan een werkgever voor een gerealiseerde praktijkleerplaats
      voor een leerling in het kader van een entreeopleiding in het voortgezet onderwijs als bedoeld in
      [artikel 2.102 van de WVO 2020][ref3].

      4 Onder werkgever wordt in dit artikel verstaan het bedrijf dat of de organisatie die de begeleiding van de
      leerling verzorgt als bedoeld in [artikel 2.63, eerste lid onder d, van het Uitvoeringsbesluit WVO 2020][ref4]
      juncto [artikel 7.2.9, derde lid, van de WEB][ref5].


