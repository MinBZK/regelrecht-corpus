  - number: '17'
    text: |-
      1 Een aanvraag voor subsidie wordt ingediend uiterlijk om 17:00 uur op 17 september na het studiejaar waarvoor
      subsidie wordt gevraagd, met dien verstande dat de subsidie voor de laatste maal uiterlijk om 17:00 uur op
      18 september 2028 kan worden aangevraagd. Aanvragen die later worden ontvangen worden afgewezen.

      2 In geval het indienen van een aanvraag op of kort voor de sluitingsdatum van een aanvraagronde langere tijd
      niet mogelijk is door een calamiteit aan de kant van het elektronisch loket, bedoeld in [artikel 18][ref1], kan
      de minister met inachtneming van een redelijke termijn een nieuw tijdstip voor uiterste indiening van een aanvraag
      bepalen.

      3 Voor aanvragers op Bonaire geldt dat een aanvraag voor subsidie uiterlijk wordt ingediend om 17:00 uur lokale
      tijd op 17 september na het studiejaar waarvoor subsidie wordt aangevraagd, met dien verstande dat de subsidie
      voor de laatste maal uiterlijk om 17:00 uur op 18 september 2028 kan worden aangevraagd. Aanvragen die later worden
      ontvangen worden afgewezen.

      4 Indien een aanvraag onvolledig is en de aanvrager op grond van
      [artikel 4:5 van de Algemene wet bestuursrecht][ref2] in de gelegenheid is gesteld zijn aanvraag aan te vullen,
      geldt als datum van ontvangst de datum waarop de aanvullende informatie is ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0034144#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel45
    url: https://wetten.overheid.nl/BWBR0034144/2025-09-03#Artikel17
