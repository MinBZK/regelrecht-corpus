---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: veewet
regulatory_layer: WET
publication_date: '2002-02-21'
valid_from: '2006-01-01'
bwb_id: BWBR0001900
url: https://wetten.overheid.nl/BWBR0001900/2006-01-01
preamble:
  text: |-
    Wij WILHELMINA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of hooren lezen, salut! doen te weten:

    Alzoo Wij in overweging genomen hebben, dat het wenschelijk is nieuwe wettelijke voorschriften tot regeling van het
    veeartsenijkundig Staatstoezicht uit te vaardigen;

    Zoo is het, dat Wij, den Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0001900/2006-01-01#ArtikelAanhef
articles:
  - number: '66'
    text: 'In deze titel wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0001900/2006-01-01#Artikel66
  - number: 66.a
    text: |-
      vee: levende runderen, varkens, schapen, geiten en eenhoevige dieren, voor zover de dieren als huisdieren worden
      gehouden;
    url: https://wetten.overheid.nl/BWBR0001900/2006-01-01#Artikel66
  - number: 66.b
    text: 'vlees: vlees van dieren als bedoeld onder *a*;'
    url: https://wetten.overheid.nl/BWBR0001900/2006-01-01#Artikel66
  - number: 66.c
    text: |-
      vers vlees: vlees, dat geen behandeling heeft ondergaan ter bevordering van de houdbaarheid, tenzij het betreft
      een koelbehandeling;
    url: https://wetten.overheid.nl/BWBR0001900/2006-01-01#Artikel66
  - number: 66.d
    text: |-
      vleesprodukten: vlees, dat een behandeling, niet zijnde een koelbehandeling, heeft ondergaan ter bevordering van de
      houdbaarheid, alsmede levensmiddelen, verkregen van vlees of waarin vlees is verwerkt.
    url: https://wetten.overheid.nl/BWBR0001900/2006-01-01#Artikel66
  - number: '68.1'
    text: |-
      Het is verboden vers vlees uit te voeren, te pogen uit te voeren of aan een middel van vervoer ten uitvoer aan te
      bieden, tenzij de zending overeenkomstig door Onze Minister van Landbouw, Natuurbeheer en Visserij gestelde regelen
      voorzien is van een of meer merken of bewijsstukken, aangebracht of afgegeven op grond van een van Rijkswege
      ingesteld onderzoek ten bewijze, dat voldaan is aan de met het oog op de uitvoer door hem gestelde eisen met
      betrekking tot:
    url: https://wetten.overheid.nl/BWBR0001900/2006-01-01#Artikel68
  - number: 68.1.a
    text: de toestand van de dieren, waarvan het vlees afkomstig is, vóór het slachten;
    url: https://wetten.overheid.nl/BWBR0001900/2006-01-01#Artikel68
  - number: 68.1.b
    text: de toestand van het vlees na het slachten;
    url: https://wetten.overheid.nl/BWBR0001900/2006-01-01#Artikel68
  - number: 68.1.c
    text: de inrichting en uitrusting der slachthuizen en uitsnijderijen;
    url: https://wetten.overheid.nl/BWBR0001900/2006-01-01#Artikel68
  - number: 68.1.d
    text: de hygiëne bij het slachten en bij de be- en verwerking van het vlees;
    url: https://wetten.overheid.nl/BWBR0001900/2006-01-01#Artikel68
  - number: 68.1.e
    text: de inrichting van de koelhuizen en de opslag hierin;
    url: https://wetten.overheid.nl/BWBR0001900/2006-01-01#Artikel68
  - number: 68.1.f
    text: de inlading, het vervoer en de vervoermiddelen;
    url: https://wetten.overheid.nl/BWBR0001900/2006-01-01#Artikel68
  - number: 68.1.g
    text: |-
      andere onderwerpen, voor zover de nakoming van internationale overeenkomsten of van besluiten van volkenrechtelijke
      organisaties zulks meebrengt.
    url: https://wetten.overheid.nl/BWBR0001900/2006-01-01#Artikel68
  - number: '68.2'
    text: |-
      Ter uitvoering van het bepaalde in het eerste lid kan Onze Minister van Landbouw, Natuurbeheer en Visserij voorts
      regelen stellen met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0001900/2006-01-01#Artikel68
  - number: 68.2.a
    text: de plaatsen waar, alsmede de tijdruimten waarbinnen, de keuring kan plaatsvinden;
    url: https://wetten.overheid.nl/BWBR0001900/2006-01-01#Artikel68
  - number: 68.2.b
    text: de wijze van keuring vóór en na het slachten;
    url: https://wetten.overheid.nl/BWBR0001900/2006-01-01#Artikel68
  - number: 68.2.c
    text: de wijze van slachten.
    url: https://wetten.overheid.nl/BWBR0001900/2006-01-01#Artikel68
  - number: '69.1'
    text: |-
      Voor zover Onze Minister van Landbouw, Natuurbeheer en Visserij niet anders bepaalt is het verboden vleesprodukten
      uit te voeren, te pogen uit te voeren of aan een middel van vervoer ten uitvoer aan te bieden, tenzij de zending
      overeenkomstig door hem gestelde regelen voorzien is van een of meer bewijsstukken, aangebracht of afgegeven op
      grond van een van Rijkswege ingesteld onderzoek, ten bewijze dat voldaan is aan de met het oog op de uitvoer door
      hem gestelde eisen met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0001900/2006-01-01#Artikel69
  - number: 69.1.a
    text: de inrichting, waarin de bereiding geschiedt;
    url: https://wetten.overheid.nl/BWBR0001900/2006-01-01#Artikel69
  - number: 69.1.b
    text: het vlees, waarvan de vleesprodukten zijn bereid;
    url: https://wetten.overheid.nl/BWBR0001900/2006-01-01#Artikel69
  - number: 69.1.c
    text: de wijze van bereiding en behandeling;
    url: https://wetten.overheid.nl/BWBR0001900/2006-01-01#Artikel69
  - number: 69.1.d
    text: de hygiëne bij de be- en verwerking;
    url: https://wetten.overheid.nl/BWBR0001900/2006-01-01#Artikel69
  - number: 69.1.e
    text: de verpakking;
    url: https://wetten.overheid.nl/BWBR0001900/2006-01-01#Artikel69
  - number: 69.1.f
    text: de inrichting van de koelhuizen en de opslag hierin;
    url: https://wetten.overheid.nl/BWBR0001900/2006-01-01#Artikel69
  - number: 69.1.g
    text: de inlading, het vervoer en de vervoermiddelen;
    url: https://wetten.overheid.nl/BWBR0001900/2006-01-01#Artikel69
  - number: 69.1.h
    text: |-
      andere onderwerpen, voor zover de nakoming van internationale overeenkomsten of van besluiten van volkenrechtelijke
      organisaties zulks meebrengt.
    url: https://wetten.overheid.nl/BWBR0001900/2006-01-01#Artikel69
  - number: '69.2'
    text: |-
      Ter uitvoering van het bepaalde in het eerste lid kan Onze Minister van Landbouw, Natuurbeheer en Visserij voorts
      regelen stellen met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0001900/2006-01-01#Artikel69
  - number: 69.2.a
    text: de plaatsen waar, alsmede de tijdruimten waarbinnen, de keuring kan plaatsvinden;
    url: https://wetten.overheid.nl/BWBR0001900/2006-01-01#Artikel69
  - number: 69.2.b
    text: de wijze van keuring.
    url: https://wetten.overheid.nl/BWBR0001900/2006-01-01#Artikel69
  - number: '70.1'
    text: |-
      De eisen en regelen, bedoeld in de [artikelen 68][ref1] en [69][ref2], kunnen verschillend zijn naar gelang van de
      soort van het vee, van het vlees en van de vleesprodukten en naar gelang van het land van bestemming.


      [ref1]: https://wetten.overheid.nl/BWBR0001900#Artikel68
      [ref2]: https://wetten.overheid.nl/BWBR0001900#Artikel69
    url: https://wetten.overheid.nl/BWBR0001900/2006-01-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0001900
        artikel: '68'
      - id: ref2
        bwb_id: BWBR0001900
        artikel: '69'
  - number: '70.2'
    text: |-
      Indien ter uitvoering van het bepaalde in [artikel 68, eerste lid onder ][ref1], en
      [artikel 69, eerste lid onder ][ref2], wordt voorzien in een officiële erkenning van de aldaar bedoelde
      instellingen, wordt een zodanige erkenning verleend voor iedere instelling, die aan de daarvoor door Onze
      Minister van Landbouw, Natuurbeheer en Visserij gestelde eisen voldoet en wordt de erkenning ingetrokken, indien
      de instelling niet langer aan deze eisen blijkt te voldoen, doch niet dan nadat gedurende een redelijke termijn
      gelegenheid is gegeven de noodzakelijke voorzieningen te treffen.


      [ref1]: https://wetten.overheid.nl/BWBR0001900#Artikel68
      [ref2]: https://wetten.overheid.nl/BWBR0001900#Artikel69
    url: https://wetten.overheid.nl/BWBR0001900/2006-01-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0001900
        artikel: '68'
      - id: ref2
        bwb_id: BWBR0001900
        artikel: '69'
  - number: '71'
    text: |-
      Onze Minister van Landbouw, Natuurbeheer en Visserij kan van de verbodsbepalingen, neergelegd in
      [artikel 68, eerste lid][ref1], en [artikel 69, eerste lid][ref2], in bijzondere gevallen of groepen van gevallen
      ontheffing verlenen. Aan deze ontheffing kunnen voorschriften of beperkingen worden verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0001900#Artikel68
      [ref2]: https://wetten.overheid.nl/BWBR0001900#Artikel69
    url: https://wetten.overheid.nl/BWBR0001900/2006-01-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0001900
        artikel: '68'
      - id: ref2
        bwb_id: BWBR0001900
        artikel: '69'
  - number: '73'
    text: |-
      Ter zake van een onderzoek van Rijkswege, als bedoeld in de [artikelen 68][ref1] en [69][ref2] wordt vergoeding van
      kosten geheven overeenkomstig een door Onze Minister van Landbouw, Natuurbeheer en Visserij vastgesteld tarief.


      [ref1]: https://wetten.overheid.nl/BWBR0001900#Artikel68
      [ref2]: https://wetten.overheid.nl/BWBR0001900#Artikel69
    url: https://wetten.overheid.nl/BWBR0001900/2006-01-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0001900
        artikel: '68'
      - id: ref2
        bwb_id: BWBR0001900
        artikel: '69'
  - number: 75a.1
    text: 'Onze Minister kan een vergoeding van kosten heffen overeenkomstig een door hem vastgesteld tarief ter zake van:'
    url: https://wetten.overheid.nl/BWBR0001900/2006-01-01#Artikel75a
  - number: 75a.1.a
    text: |-
      de behandeling van een aanvraag om een bij of krachtens deze wet voorgeschreven vergunning, toelating, aanwijzing,
      erkenning of registratie danwel een aanvraag tot wijziging daarvan;
    url: https://wetten.overheid.nl/BWBR0001900/2006-01-01#Artikel75a
  - number: 75a.1.b
    text: |-
      de instandhouding van de bij of krachtens deze wet verleende vergunning, toelating, aanwijzing, erkenning of
      registratie;
    url: https://wetten.overheid.nl/BWBR0001900/2006-01-01#Artikel75a
  - number: 75a.1.c
    text: |-
      andere onderzoeken of verrichtingen met betrekking tot dieren, producten van dierlijke oorsprong en andere
      producten en voorwerpen die dragers van smetstof kunnen zijn, voorzover de onderzoeken of verrichtingen zijn
      voorgeschreven bij besluit krachtens het Verdrag tot oprichting van de Europese Gemeenschap, danwel op verzoek van
      betrokkenen plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0001900/2006-01-01#Artikel75a
  - number: 75a.2
    text: Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot betaling van de vergoeding.
    url: https://wetten.overheid.nl/BWBR0001900/2006-01-01#Artikel75a
  - number: 75b.1
    text: |-
      Onverminderd de [artikelen 14][ref1], [73][ref2] en [75a][ref3] kan Onze Minister bij of krachtens algemene
      maatregel van bestuur een vergoeding van kosten heffen overeenkomstig een door hem vastgesteld tarief ter zake
      van bij die maatregel benoemde onderzoeken of verrichtingen met betrekking tot dieren, producten van dierlijke
      oorsprong en andere producten en voorwerpen die dragers van smetstof kunnen zijn, voorzover de onderzoeken of
      verrichtingen zijn voorgeschreven krachtens deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0001900#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0001900#Artikel73
      [ref3]: https://wetten.overheid.nl/BWBR0001900#Artikel75a
    url: https://wetten.overheid.nl/BWBR0001900/2006-01-01#Artikel75b
    references:
      - id: ref1
        bwb_id: BWBR0001900
        artikel: '14'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0001900
        artikel: '73'
      - id: ref3
        bwb_id: BWBR0001900
        artikel: 75a
  - number: 75b.2
    text: Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot betaling van de vergoeding.
    url: https://wetten.overheid.nl/BWBR0001900/2006-01-01#Artikel75b
  - number: 75c
    text: |-
      Een tarief als bedoeld in de [artikelen 14][ref1], [73][ref2], [75a][ref3] en [75b][ref4] wordt zodanig vastgesteld
      dat de geraamde baten niet uitgaan boven de geraamde kosten die in een rechtstreeks verband staan met de
      werkzaamheden waarvoor het tarief wordt vastgesteld, onverminderd de daaromtrent bij besluit krachtens het Verdrag
      tot oprichting van de Europese Gemeenschap vastgestelde verplichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0001900#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0001900#Artikel73
      [ref3]: https://wetten.overheid.nl/BWBR0001900#Artikel75a
      [ref4]: https://wetten.overheid.nl/BWBR0001900#Artikel75b
    url: https://wetten.overheid.nl/BWBR0001900/2006-01-01#Artikel75c
    references:
      - id: ref1
        bwb_id: BWBR0001900
        artikel: '14'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0001900
        artikel: '73'
      - id: ref3
        bwb_id: BWBR0001900
        artikel: 75a
      - id: ref4
        bwb_id: BWBR0001900
        artikel: 75b
