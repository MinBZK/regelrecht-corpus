        artikel: '37'
        paragraaf: '3'
  - number: '44'
    text: |-
      Schade, veroorzaakt door de toepassing van maatregelen als bedoeld in [artikel 9][ref1], [18][ref2] en [20][ref3]
      kan voor zoover deze niet uit hoofde van de [artikelen 39 t/m 43][ref4] voor vergoeding in aanmerking komt,
      in bijzondere gevallen door Onzen met de zaken van den landbouw belasten Minister uit 's Rijks kas geheel of
      gedeeltelijk worden vergoed.


      [ref1]: https://wetten.overheid.nl/BWBR0001900#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0001900#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0001900#Artikel20
