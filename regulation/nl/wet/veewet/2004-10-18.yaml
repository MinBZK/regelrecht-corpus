  - number: '48'
    text: |-
      Bij algemeenen maatregel van bestuur kunnen hetzij voor het geheele Rijk, hetzij voor bepaalde gedeelten daarvan,
      voorschriften tot wering en bestrijding van andere dan de in de [artikelen 7][ref1] en [45][ref2] bedoelde
      veeziekten of van ziekten van andere dan de in [artikel 4][ref3] bedoelde dieren worden gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0001900#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0001900#Artikel45
      [ref3]: https://wetten.overheid.nl/BWBR0001900#Artikel4
