  - number: 10a
    text: |-
      Onze Minister van Landbouw, Natuurbeheer en Visserij kan, indien zulks naar zijn oordeel met het oog op
      besmettingsgevaar noodzakelijk is, regelen stellen met betrekking tot het ontvangen en het afleveren en de
      aanwezigheid van dieren op bedrijven.
    url: https://wetten.overheid.nl/BWBR0001900/2004-10-18#Artikel10a
  - number: '12'
    text: |-
      Tot wering van besmettelijke veeziekten kan Onze Minister van Landbouw, Natuurbeheer en Visserij de in- en doorvoer
      verbieden of niet dan voorwaardelijk toestaan van vee, vlees, afval van vlees, huiden, hoornen, klauwen, hoeven,
      borstels, haar, wol, beenderen, daaronder begrepen gebroken of gemalen beenderen, van vee afkomstig zaad, melk,
      afgeroomde melk, karnemelk, wei, mest, daaronder begrepen kunstmest voor zover deze geheel of gedeeltelijk uit
      diermeel, beendermeel of bloedmeel bestaat, alsmede van andere voorwerpen of produkten, welke dragers van smetstof
      kunnen zijn.
    url: https://wetten.overheid.nl/BWBR0001900/2004-10-18#Artikel12
  - number: '13'
    text: |-
      Het is verboden voorwerpen, waarvan de in- of doorvoer voorwaardelijk is toegestaan, in- of door te voeren langs
      andere dan de door Onze Minister van Landbouw, Natuurbeheer en Visserij aan te wijzen kantoren.
    url: https://wetten.overheid.nl/BWBR0001900/2004-10-18#Artikel13
  - number: '14'
    text: |-
      Indien de in- of doorvoer is toegestaan onder voorwaarde van voorafgaand onderzoek, wordt voor dat onderzoek
      vergoeding van kosten geheven naar een door Ons vast te stellen tarief.
    url: https://wetten.overheid.nl/BWBR0001900/2004-10-18#Artikel14
  - number: '35'
    text: |-
      1 Het is verboden vee te doen verblijven of dit te gedogen op een terrein, waarop zich vuilnis bevindt of waarop
      vuilnis pleegt te worden gestort of bewaard, alsmede op een daaraan grenzend terrein, indien het vee zich vrijelijk
      van het ene terrein naar het andere kan begeven.

      2 Het is verboden vuilnis te storten of te bewaren op een terrein, hetwelk voor vee vrijelijk te betreden is.

      3 Onder "vuilnis" wordt in de vorige leden verstaan: stads-, huis-, straat- en bedrijfsvuil, daaronder niet
      begrepen mest, verkregen in een onderneming, waarin de veeteelt wordt uitgeoefend.
    url: https://wetten.overheid.nl/BWBR0001900/2004-10-18#Artikel35
  - number: '38'
    text: |-
      1 Tot voorkoming van besmetting kan door Onze Minister van Landbouw, Natuurbeheer en Visserij worden verboden of
      niet dan voorwaardelijk worden toegestaan, dat vee, vleesch, huiden, hoornen, klauwen, hoeven, borstels, haar, wol,
      beenderen, melk, afgeroomde melk, karnemelk, wei, mest, veevoeder en andere voorwerpen, welke dragers van smetstof
      kunnen zijn, worden vervoerd binnen het Rijk of uit, naar of binnen bepaalde gedeelten van het Rijk.

      2

      3 Onze Minister van Landbouw, Natuurbeheer en Visserij kan voor het krachtens het eerste lid aangewezen gebied het
      bij [artikel 37][ref1] bepaalde van overeenkomstige toepassing verklaren ten aanzien van gezond vee.


      [ref1]: https://wetten.overheid.nl/BWBR0001900#Artikel37
    url: https://wetten.overheid.nl/BWBR0001900/2004-10-18#Artikel38
    references:
      - id: ref1
