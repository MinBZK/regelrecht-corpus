  - number: '8'
    text: |-
      Onze met de zaken van den landbouw belaste Minister geeft ten aanzien van inrichtingen, waar melk van vee van
      verschillende eigenaren wordt verwerkt, voorschriften tot voorkoming van verspreiding van smetstof.
    url: https://wetten.overheid.nl/BWBR0001900/2004-10-18#Artikel8
  - number: '9'
    text: |-
      1 Door Onzen met de zaken van den landbouw belasten Minister kan hetzij voor het geheele Rijk, hetzij voor bepaalde
      gedeelten daarvan, worden bevolen, dat het vee, dat door een bepaalde besmettelijke veeziekte kan worden aangetast,
      op de door hem te bepalen wijze voorbehoedend wordt behandeld en gemerkt of één van beide.

      2 Een ieder, wien zulks aangaat, is verplicht aan de uitvoering van een bevel, als bedoeld in het vorig lid, zijn
      medewerking te verleenen.

      3 Indien Onze Minister van Landbouw, Natuurbeheer en Visserij op grond van het eerste lid beveelt dat vee moet
      worden gemerkt kan hij daarbij tevens bepalen dat de eigenaar, houder of hoeder van het vee

      a. overeenkomstig nader bij regeling te stellen voorschriften een registratie dient te voeren van de merking
      alsmede van de op zijn bedrijf aanwezige, aangevoerde en afgevoerde dieren;

      b. overeenkomstig nader bij regeling te stellen voorschriften mededeling dient te doen van de registratie, bedoeld
      in onderdeel *a*, aan een bij die regeling aangewezen instantie;

      c. de registratie, bedoeld in onderdeel *a*, en de daarop betrekking hebbende bescheiden gedurende een daarbij te
      bepalen periode dient te bewaren.

      4 De kosten van het in het eerste lid bedoelde behandelen en merken komen voor rekening van den eigenaar van het
      vee, voor zoover door Onzen met de zaken van den landbouw belasten Minister niet wordt bepaald, dat deze kosten
      geheel of gedeeltelijk uit 's Rijks kas kan worden betaald.
    url: https://wetten.overheid.nl/BWBR0001900/2004-10-18#Artikel9
  - number: 9a
    text: |-
      1 Bij een bevel als bedoeld in [artikel 9, eerste lid][ref1], kan worden bepaald, dat vee dat niet overeenkomstig
      dat bevel is gemerkt dan wel niet overeenkomstig het bepaalde krachtens [artikel 9, derde lid][ref2], is
      geregistreerd op last van een door Onze Minister van Landbouw, Natuurbeheer en Visserij aangewezen ambtenaar wordt
      afgemaakt en onschadelijk gemaakt.

      2 De in het eerste lid bedoelde last wordt niet gegeven indien de eigenaar, houder of hoeder op eerste vordering en
      ten genoege van de daar bedoelde ambtenaar de herkomst van het vee aantoont.

      3 Indien vee op grond van het bepaalde in het eerste lid wordt afgemaakt kan ter zake geen aanspraak worden gemaakt
      op enige schadeloosstelling of vergoeding uit hoofde van de [artikelen 39][ref3], [39][ref4] of [44][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0001900#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0001900#Artikel9
