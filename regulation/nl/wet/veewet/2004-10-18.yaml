preamble:
  text: |-
    Wij WILHELMINA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of hooren lezen, salut! doen te weten:

    Alzoo Wij in overweging genomen hebben, dat het wenschelijk is nieuwe wettelijke voorschriften tot regeling van het
    veeartsenijkundig Staatstoezicht uit te vaardigen;

    Zoo is het, dat Wij, den Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0001900/2004-10-18#ArtikelAanhef
articles:
  - number: 2bis
    text: |-
      Gezondheidsdiensten voor dieren, die als zodanig door het Landbouwschap zijn erkend, zijn verplicht aan de
      door Onze Minister van Landbouw, Natuurbeheer en Visserij aangewezen ambtenaren van de Veeartsenijkundige
      Dienst desgevraagd alle met hun werkzaamheden ter uitvoering van wettelijke voorschriften op het terrein van de
      bestrijding van dierziekten verband houdende inlichtingen te geven, welke die ambtenaren ter uitoefening van hun
      taak nodig hebben.
    url: https://wetten.overheid.nl/BWBR0001900/2004-10-18#Artikel2bis
  - number: '3'
    text: |-
      Bij algemeenen maatregel van bestuur wordt bepaald, welke wetenschappelijke inrichtingen geheel of ten deele ten
      dienste van den veeartsenijkundigen dienst zullen worden gebezigd en op welke wijze de ambtenaren van dien dienst,
      met de leiders dier inrichtingen zullen samenwerken.
    url: https://wetten.overheid.nl/BWBR0001900/2004-10-18#Artikel3
  - number: '4'
    text: |-
      In deze wet wordt verstaan:

      a. door vee: herkauwende en eenhoevige dieren en varkens;

      b. door vlees: gedood of geslacht vee, of alle delen van dit vee, ongeboren vruchten daaronder begrepen, met
      uitzondering van huiden, voor zover deze niet van varkens afkomstig zijn, hoornen, klauwen, hoeven, borstels, haar,
      wol en geheel van spieren ontdane beenderen;

      c. door pluimvee: hoenderachtigen, kalkoenen, eenden en ganzen.
    url: https://wetten.overheid.nl/BWBR0001900/2004-10-18#Artikel4
  - number: '5'
    text: |-
      1 Ter uitvoering van bij algemeenen maatregel van bestuur te geven voorschriften betreffende het veeartsenijkundig
      toezicht op veemarkten, worden in gemeenten, waar veemarkten worden gehouden, onder Onze goedkeuring door den
      gemeenteraad verordeningen vastgesteld.

      2 Bij gebreke van eene verordening, als bedoeld in het vorige lid, is het verboden veemarkten te houden.
    url: https://wetten.overheid.nl/BWBR0001900/2004-10-18#Artikel5
  - number: 5bis
    text: |-
      1 Degene, die voornemens is een keuring of tentoonstelling te houden dan wel op soortgelijke wijze vee, honden of
      katten bijeen te brengen, is verplicht:

      a. van dit voornemen tenminste acht dagen van te voren kennis te geven aan het districtshoofd van den
      Veeartsenijkundigen Dienst;

      b. de dieren, alvorens deze toe te laten, bij de plaats van aanvoer op zijn kosten veeartsenijkundig te laten
      onderzoeken door één of meer, door het districtshoofd van den Veeartsenijkundigen Dienst, daartoe aangewezen
      veeartsen.

      2 Van het bepaalde in het vorig lid onder *b* kan door het districtshoofd van den Veeartsenijkundigen Dienst
      ontheffing worden verleend.
    url: https://wetten.overheid.nl/BWBR0001900/2004-10-18#Artikel5bis
  - number: '6'
    text: |-
      Bij algemeenen maatregel van bestuur worden voorschriften gegeven betreffende het reinigen en ontsmetten van
      openbare middelen van vervoer, welke zijn gebruikt tot vervoer van vee, vleesch, huiden, hoornen, klauwen, hoeven,
      borstels, haar, wol, beenderen, vellen, mest of veevoeder.
    url: https://wetten.overheid.nl/BWBR0001900/2004-10-18#Artikel6
  - number: 6bis
    text: |-
      Onze Minister van Landbouw, Natuurbeheer en Visserij kan regelen stellen ter voorkoming van verspreiding van
      smetstof door niet-openbare vervoermiddelen en de daarbij behorende voorwerpen, welke worden gebruikt voor het
      vervoer van vee of van door hem aangewezen delen van vee en andere goederen, welke dragers van smetstof kunnen
      zijn.
    url: https://wetten.overheid.nl/BWBR0001900/2004-10-18#Artikel6bis
  - number: '7'
    text: |-
      De [paragrafen 1][ref1], [3][ref2] en [4][ref3] van deze titel zijn toepasselijk op de volgende besmettelijke
      veeziekten:

      a. de veepest der herkauwende dieren;

      b. de longziekte der runderen;

      c. het mond- en klauwzeer bij herkauwende dieren en varkens;

      d. het miltvuur bij alle vee;

      e. de hondsdolheid bij alle vee;

      f. de schurft (sarcoptes-schurft en psoroptes-schurft) bij schapen, geiten en eenhoevige dieren;

      g. de schaapspokken bij schapen en geiten;

      h. de kwade droes bij eenhoevige dieren;

      i. de atrofische rhinitis infectiosa bij varkens;

      j. de Teschener ziekte bij varkens;

      k. de brucellosis melitensis bij alle vee;

      l. de brucellosis suis bij alle vee;

      m. de infectieuze anaemie bij eenhoevige dieren;

      n. de paardenpest bij alle vee;

      o. de vesiculaire varkensziekte.


      [ref1]: https://wetten.overheid.nl/BWBR0001900#Paragraaf1
      [ref2]: https://wetten.overheid.nl/BWBR0001900#Paragraaf3
      [ref3]: https://wetten.overheid.nl/BWBR0001900#Paragraaf4
    url: https://wetten.overheid.nl/BWBR0001900/2004-10-18#Artikel7
