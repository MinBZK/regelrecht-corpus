  - number: '71'
    text: |-
      Onze Minister van Landbouw, Natuurbeheer en Visserij kan van de verbodsbepalingen, neergelegd in
      [artikel 68, eerste lid][ref1], en [artikel 69, eerste lid][ref2], in bijzondere gevallen of groepen van gevallen
      ontheffing verlenen. Aan deze ontheffing kunnen voorschriften of beperkingen worden verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0001900#Artikel68
      [ref2]: https://wetten.overheid.nl/BWBR0001900#Artikel69
    url: https://wetten.overheid.nl/BWBR0001900/2004-10-18#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0001900
        artikel: '68'
      - id: ref2
        bwb_id: BWBR0001900
        artikel: '69'
  - number: '73'
    text: |-
      Ter zake van een onderzoek van Rijkswege, als bedoeld in de [artikelen 68][ref1] en [69][ref2] wordt vergoeding van
      kosten geheven overeenkomstig een door Onze Minister van Landbouw, Natuurbeheer en Visserij vastgesteld tarief.


      [ref1]: https://wetten.overheid.nl/BWBR0001900#Artikel68
      [ref2]: https://wetten.overheid.nl/BWBR0001900#Artikel69
    url: https://wetten.overheid.nl/BWBR0001900/2004-10-18#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0001900
        artikel: '68'
      - id: ref2
        bwb_id: BWBR0001900
        artikel: '69'
  - number: 75a
    text: |-
      1 Onze Minister kan een vergoeding van kosten heffen overeenkomstig een door hem vastgesteld tarief ter zake van:

      a. de behandeling van een aanvraag om een bij of krachtens deze wet voorgeschreven vergunning, toelating,
      aanwijzing, erkenning of registratie danwel een aanvraag tot wijziging daarvan;

      b. de instandhouding van de bij of krachtens deze wet verleende vergunning, toelating, aanwijzing, erkenning of
      registratie;

      c. andere onderzoeken of verrichtingen met betrekking tot dieren, producten van dierlijke oorsprong en andere
      producten en voorwerpen die dragers van smetstof kunnen zijn, voorzover de onderzoeken of verrichtingen zijn
      voorgeschreven bij besluit krachtens het Verdrag tot oprichting van de Europese Gemeenschap, danwel op verzoek van
      betrokkenen plaatsvinden.

      2 Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot betaling van de vergoeding.
    url: https://wetten.overheid.nl/BWBR0001900/2004-10-18#Artikel75a
  - number: 75b
    text: |-
      1 Onverminderd de [artikelen 14][ref1], [73][ref2] en [75a][ref3] kan Onze Minister bij of krachtens algemene
      maatregel van bestuur een vergoeding van kosten heffen overeenkomstig een door hem vastgesteld tarief ter zake
      van bij die maatregel benoemde onderzoeken of verrichtingen met betrekking tot dieren, producten van dierlijke
      oorsprong en andere producten en voorwerpen die dragers van smetstof kunnen zijn, voorzover de onderzoeken of
      verrichtingen zijn voorgeschreven krachtens deze wet.

      2 Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot betaling van de vergoeding.


      [ref1]: https://wetten.overheid.nl/BWBR0001900#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0001900#Artikel73
      [ref3]: https://wetten.overheid.nl/BWBR0001900#Artikel75a
    url: https://wetten.overheid.nl/BWBR0001900/2004-10-18#Artikel75b
    references:
