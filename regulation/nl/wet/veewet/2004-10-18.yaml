        bwb_id: BWBR0001900
        artikel: '14'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0001900
        artikel: '73'
      - id: ref3
        bwb_id: BWBR0001900
        artikel: 75a
  - number: 75c
    text: |-
      Een tarief als bedoeld in de [artikelen 14][ref1], [73][ref2], [75a][ref3] en [75b][ref4] wordt zodanig vastgesteld
      dat de geraamde baten niet uitgaan boven de geraamde kosten die in een rechtstreeks verband staan met de
      werkzaamheden waarvoor het tarief wordt vastgesteld, onverminderd de daaromtrent bij besluit krachtens het Verdrag
      tot oprichting van de Europese Gemeenschap vastgestelde verplichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0001900#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0001900#Artikel73
      [ref3]: https://wetten.overheid.nl/BWBR0001900#Artikel75a
      [ref4]: https://wetten.overheid.nl/BWBR0001900#Artikel75b
    url: https://wetten.overheid.nl/BWBR0001900/2004-10-18#Artikel75c
    references:
