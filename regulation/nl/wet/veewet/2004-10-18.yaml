  - number: '79'
    text: |-
      Hij, die een der in deze wet bedoelde kenteekenen of merken namaakt of valschelijk plaatst of een echt
      vervalscht met het oogmerk om het als echt en onvervalscht te gebruiken of te doen gebruiken, wordt gestraft met
      gevangenisstraf van ten hoogste twee jaren.
    url: https://wetten.overheid.nl/BWBR0001900/2004-10-18#Artikel79
  - number: '80'
    text: |-
      Hij, die wederrechtelijk een der in [artikel 9][ref1] bedoelde merken verwijdert of vernietigt, wordt gestraft met
      geldboete van de eerste categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0001900#Artikel9
    url: https://wetten.overheid.nl/BWBR0001900/2004-10-18#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0001900
        artikel: '9'
        paragraaf: '1'
  - number: '85'
    text: |-
      1 Hij, die last geeft tot het plegen van een feit, waarop bij deze wet straf is gesteld, wordt, indien dat feit is
      gepleegd, geacht de dader te zijn.

      2 Niet strafbaar wegens een der in deze wet strafbaar gestelde feiten, welke als overtredingen worden beschouwd, is
      een werknemer, indien het strafbaar feit een gevolg is van een last van zijn werkgever.
    url: https://wetten.overheid.nl/BWBR0001900/2004-10-18#Artikel85
  - number: '94'
    text: |-
      De bij of krachtens deze wet strafbaar gestelde feiten worden beschouwd als overtredingen, behalve de bij
      [artikel 79][ref1] strafbaar gestelde feiten, welke als misdrijven worden beschouwd.


      [ref1]: https://wetten.overheid.nl/BWBR0001900#Artikel79
    url: https://wetten.overheid.nl/BWBR0001900/2004-10-18#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0001900
        artikel: '79'
  - number: '96'
    text: |-
      Onze Minister is bevoegd tot toepassing van bestuursdwang ter handhaving van de bij of krachtens deze wet gestelde
      verplichtingen.
    url: https://wetten.overheid.nl/BWBR0001900/2004-10-18#Artikel96
  - number: '97'
    text: Onder districtshoofd van den veeartsenijkundigen dienst wordt begrepen hij, die dien ambtenaar vervangt.
    url: https://wetten.overheid.nl/BWBR0001900/2004-10-18#Artikel97
  - number: '99'
    text: |-
      1 Deze wet is niet van toepassing op de door Ons aan te wijzen inrichtingen van onderwijs en van wetenschappelijk
      onderzoek.

      2 Bij algemeenen maatregel van bestuur worden voorschriften vastgesteld, ten einde het verspreiden van smetstof
      door inrichtingen, als bedoeld in het vorige lid, te voorkomen.
    url: https://wetten.overheid.nl/BWBR0001900/2004-10-18#Artikel99
  - number: '100'
    text: |-
      Met het inwerking treden dezer wet vervallen:

      a. de wet van 20 Juli 1870 (*Staatsblad* no. 131), tot regeling van het veeartsenijkundig Staatstoezigt en de
      veeartsenijkundige politie, gewijzigd bij de wetten van 1 Augustus 1880 (*Staatsblad* no. 123), 15 April 1886
      (*Staatsblad* no. 64), 15 April 1896 (*Staatsblad* no. 68), 21 Junij 1901 (*Staatsblad* no. 157) en 3 Februari 1902
      (*Staatsblad* no. 14);

      b. de wet van 5 Junij 1875 (*Staatsblad* no. 110), tot vaststelling van bepalingen bij het voorkomen van
      hondsdolheid, gewijzigd bij de wetten van 15 April 1886 (*Staatsblad* no. 64), 15 April 1891 ( *Staatsblad* no. 80)
      en 3 Februari 1902 (*Staatsblad* no. 14);

      c. de wet van 8 Augustus 1878 (*Staatsblad* no. 115), houdende vaststelling van bijzondere bepalingen tot
      beteugeling der longziekte onder het rundvee in bepaalde deelen des lands, gewijzigd bij de wet van 15 April 1886
      (*Staatsblad* no. 64);

      d. de wet van 16 Juli 1907 (*Staatsblad* no. 217), houdende bepalingen betreffende de keuring van voor uitvoer
      bestemd vleesch.
    url: https://wetten.overheid.nl/BWBR0001900/2004-10-18#Artikel100
  - number: '101'
    text: Deze wet kan worden aangehaald onder den titel van "Veewet".
    url: https://wetten.overheid.nl/BWBR0001900/2004-10-18#Artikel101
  - number: '102'
    text: Deze wet treedt in werking op een door Ons te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0001900/2004-10-18#Artikel102
