        bwb_id: BWBR0001900
        artikel: 75b
  - number: '76'
    text: |-
      Met het opsporen van de in deze wet strafbaar gestelde feiten zijn belast, behalve de bij
      [artikel 141 van het Wetboek van Strafvordering][ref1] aangewezen ambtenaren:

      a. de ambtenaren van rijks- en gemeentepolitie;

      b. de ambtenaren van de rijksbelastingdienst, bevoegd inzake douane;

      c. de door Onze met de zaken van de landbouw belaste Minister aangewezen ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0001900/2004-10-18#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
  - number: '77'
    text: |-
      Bij het opsporen van een bij deze wet strafbaar gesteld feit hebben de in [artikel 76][ref1] bedoelde ambtenaren
      toegang tot elke plaats, voor zover dat redelijkerwijs voor de vervulling van hun taak nodig is.


      [ref1]: https://wetten.overheid.nl/BWBR0001900#Artikel76
    url: https://wetten.overheid.nl/BWBR0001900/2004-10-18#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0001900
        artikel: '76'
  - number: 77bis
    text: |-
      De in [artikel 76][ref1] bedoelde ambtenaren zijn bevoegd te vorderen, dat bestuurders van vervoermiddelen, met
      uitzondering van openbare vervoermiddelen, deze doen stilhouden en onderzoek toestaan van de vervoermiddelen
      en van de zich daarin bevindende voorwerpen. Zij kunnen tevens vorderen, dat de bestuurders overeenkomstig hun
      aanwijzingen terzake medewerking verlenen.


      [ref1]: https://wetten.overheid.nl/BWBR0001900#Artikel76
    url: https://wetten.overheid.nl/BWBR0001900/2004-10-18#Artikel77bis
    references:
      - id: ref1
        bwb_id: BWBR0001900
        artikel: '76'
  - number: 77ter
    text: |-
      De in [artikel 76][ref1] bedoelde ambtenaren zijn bevoegd inzage te vorderen en afschriften te nemen van boeken en
      andere bescheiden voor zover dit naar hun redelijk oordeel voor de vervulling van hun taak nodig is.


      [ref1]: https://wetten.overheid.nl/BWBR0001900#Artikel76
    url: https://wetten.overheid.nl/BWBR0001900/2004-10-18#Artikel77ter
    references:
      - id: ref1
        bwb_id: BWBR0001900
        artikel: '76'
