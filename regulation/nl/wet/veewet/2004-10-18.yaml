  - number: '49'
    text: |-
      1 Tegelijk met de afkondiging van een algemeenen maatregel van bestuur, als bedoeld in het vorige artikel, wordt
      een voorstel van wet, houdende regeling van het in den algemeenen maatregel van bestuur geregelde onderwerp, aan de
      Tweede Kamer der Staten-Generaal gezonden.

      2 Indien het voorstel tot wet wordt verheven, houdt tegelijk met de inwerkingtreding de algemeene maatregel van
      bestuur op van kracht te zijn.

      3 Indien het voorstel wordt ingetrokken of indien een van de beide Kamers der Staten-Generaal tot niet-aanneming
      van het voorstel besluit, wordt de algemeene maatregel van bestuur dadelijk ingetrokken.
    url: https://wetten.overheid.nl/BWBR0001900/2004-10-18#Artikel49
  - number: '50'
    text: |-
      In dezen titel wordt verstaan:

      a. door dolle honden en katten: honden en katten, welke door hondsdolheid zijn aangetast;

      b. door van dolheid verdachte honden en katten: honden en katten, welke verdacht worden gevaar op te leveren voor
      verspreiding van hondsdolheid.
    url: https://wetten.overheid.nl/BWBR0001900/2004-10-18#Artikel50
  - number: 50a
    text: |-
      Tot wering en bestrijding van hondsdolheid kan Onze Minister van Landbouw, Natuurbeheer en Visserij de in- en
      doorvoer van honden en katten, alsmede van andere dieren, welke dragers van smetstof kunnen zijn, verbieden of
      voorwaardelijk toestaan.
    url: https://wetten.overheid.nl/BWBR0001900/2004-10-18#Artikel50a
  - number: 64ter
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur kunnen voor het gehele Land of voor bepaalde gedeelten daarvan:

      a. regelen worden gesteld tot wering en bestrijding van hondsdolheid bij andere dieren dan vee, honden en katten,
      waarbij tevens [artikel 77][ref1] van overeenkomstige toepassing kan worden verklaard ten aanzien van de door Onze
      Minister van Landbouw, Natuurbeheer en Visserij aan te wijzen personen of groepen van personen;

      b. nadere regelen worden gesteld tot bestrijding van hondsdolheid bij honden en katten, waarbij zo nodig kan worden
      afgeweken van het bepaalde bij of krachtens de [artikelen 60-62][ref2];

      2 Onze Minister van Landbouw, Natuurbeheer en Visserij is bevoegd regelen onderscheidenlijk nadere regelen, als
      bedoeld in het vorige lid, te stellen voor een termijn van ten hoogste vier maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0001900#Artikel77
      [ref2]: https://wetten.overheid.nl/BWBR0001900#Artikel60
    url: https://wetten.overheid.nl/BWBR0001900/2004-10-18#Artikel64ter
    references:
      - id: ref1
        bwb_id: BWBR0001900
        artikel: '77'
      - id: ref2
        bwb_id: BWBR0001900
        artikel: '60'
  - number: '66'
    text: |-
      In deze titel wordt verstaan onder:

      a. vee: levende runderen, varkens, schapen, geiten en eenhoevige dieren, voor zover de dieren als huisdieren worden
      gehouden;

      b. vlees: vlees van dieren als bedoeld onder *a*;

      c. vers vlees: vlees, dat geen behandeling heeft ondergaan ter bevordering van de houdbaarheid, tenzij het betreft
      een koelbehandeling;

      d. vleesprodukten: vlees, dat een behandeling, niet zijnde een koelbehandeling, heeft ondergaan ter bevordering van
      de houdbaarheid, alsmede levensmiddelen, verkregen van vlees of waarin vlees is verwerkt.
    url: https://wetten.overheid.nl/BWBR0001900/2004-10-18#Artikel66
  - number: '68'
    text: |-
      1 Het is verboden vers vlees uit te voeren, te pogen uit te voeren of aan een middel van vervoer ten uitvoer aan te
      bieden, tenzij de zending overeenkomstig door Onze Minister van Landbouw, Natuurbeheer en Visserij gestelde regelen
      voorzien is van een of meer merken of bewijsstukken, aangebracht of afgegeven op grond van een van Rijkswege
      ingesteld onderzoek ten bewijze, dat voldaan is aan de met het oog op de uitvoer door hem gestelde eisen met
      betrekking tot:

      a. de toestand van de dieren, waarvan het vlees afkomstig is, vóór het slachten;

      b. de toestand van het vlees na het slachten;

      c. de inrichting en uitrusting der slachthuizen en uitsnijderijen;

      d. de hygiëne bij het slachten en bij de be- en verwerking van het vlees;

      e. de inrichting van de koelhuizen en de opslag hierin;

      f. de inlading, het vervoer en de vervoermiddelen;

      g. andere onderwerpen, voor zover de nakoming van internationale overeenkomsten of van besluiten van
      volkenrechtelijke organisaties zulks meebrengt.

      2 Ter uitvoering van het bepaalde in het eerste lid kan Onze Minister van Landbouw, Natuurbeheer en Visserij voorts
      regelen stellen met betrekking tot:

      a. de plaatsen waar, alsmede de tijdruimten waarbinnen, de keuring kan plaatsvinden;

      b. de wijze van keuring vóór en na het slachten;

      c. de wijze van slachten.
    url: https://wetten.overheid.nl/BWBR0001900/2004-10-18#Artikel68
  - number: '69'
    text: |-
      1 Voor zover Onze Minister van Landbouw, Natuurbeheer en Visserij niet anders bepaalt is het verboden
      vleesprodukten uit te voeren, te pogen uit te voeren of aan een middel van vervoer ten uitvoer aan te bieden,
      tenzij de zending overeenkomstig door hem gestelde regelen voorzien is van een of meer bewijsstukken, aangebracht
      of afgegeven op grond van een van Rijkswege ingesteld onderzoek, ten bewijze dat voldaan is aan de met het oog op
      de uitvoer door hem gestelde eisen met betrekking tot:

      a. de inrichting, waarin de bereiding geschiedt;

      b. het vlees, waarvan de vleesprodukten zijn bereid;

      c. de wijze van bereiding en behandeling;

      d. de hygiëne bij de be- en verwerking;

      e. de verpakking;

      f. de inrichting van de koelhuizen en de opslag hierin;

      g. de inlading, het vervoer en de vervoermiddelen;

      h. andere onderwerpen, voor zover de nakoming van internationale overeenkomsten of van besluiten van
      volkenrechtelijke organisaties zulks meebrengt.

      2 Ter uitvoering van het bepaalde in het eerste lid kan Onze Minister van Landbouw, Natuurbeheer en Visserij voorts
      regelen stellen met betrekking tot:

      a. de plaatsen waar, alsmede de tijdruimten waarbinnen, de keuring kan plaatsvinden;

      b. de wijze van keuring.
    url: https://wetten.overheid.nl/BWBR0001900/2004-10-18#Artikel69
  - number: '70'
    text: |-
      1 De eisen en regelen, bedoeld in de [artikelen 68][ref1] en [69][ref2], kunnen verschillend zijn naar gelang van
      de soort van het vee, van het vlees en van de vleesprodukten en naar gelang van het land van bestemming.

      2 Indien ter uitvoering van het bepaalde in [artikel 68, eerste lid onder ][ref3], en
      [artikel 69, eerste lid onder ][ref4], wordt voorzien in een officiële erkenning van de aldaar bedoelde
      instellingen, wordt een zodanige erkenning verleend voor iedere instelling, die aan de daarvoor door Onze
      Minister van Landbouw, Natuurbeheer en Visserij gestelde eisen voldoet en wordt de erkenning ingetrokken, indien
      de instelling niet langer aan deze eisen blijkt te voldoen, doch niet dan nadat gedurende een redelijke termijn
      gelegenheid is gegeven de noodzakelijke voorzieningen te treffen.


      [ref1]: https://wetten.overheid.nl/BWBR0001900#Artikel68
      [ref2]: https://wetten.overheid.nl/BWBR0001900#Artikel69
      [ref3]: https://wetten.overheid.nl/BWBR0001900#Artikel68
      [ref4]: https://wetten.overheid.nl/BWBR0001900#Artikel69
    url: https://wetten.overheid.nl/BWBR0001900/2004-10-18#Artikel70
