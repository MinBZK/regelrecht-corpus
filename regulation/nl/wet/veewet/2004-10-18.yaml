  - number: '45'
    text: |-
      1 Bij algemene maatregel van bestuur kan worden bepaald, dat de [paragrafen 1][ref1] en [3][ref2] van deze titel
      geheel of gedeeltelijk zullen worden toegepast tot bestrijding van:

      a.

      b. het boutvuur der runderen;

      c. de huidschimmelziekte bij runderen en paarden;

      d. de goedaardige droes der paarden;

      e. de borstziekte der paarden;

      f. het rotkreupel der schapen;

      g. de vlekziekte der varkens;

      h. de borstziekte der varkens;

      i. de varkenspest;

      j. de trichinenziekte der varkens;

      k. besmettelijke aandoening der geslachtsorganen;

      l. het besmettelijk verwerpen bij runderen en paarden;

      m. de salmonellose bij alle vee;

      n. de ziekte van Aujeszky.

      2 Wanneer ingevolge het eerste lid de voorschriften van dezen titel gedeeltelijk van kracht worden, treden de
      bepalingen van [§ 4][ref3] daarbij van rechtswege in werking.


      [ref1]: https://wetten.overheid.nl/BWBR0001900#Paragraaf1
      [ref2]: https://wetten.overheid.nl/BWBR0001900#Paragraaf3
      [ref3]: https://wetten.overheid.nl/BWBR0001900#Paragraaf4
