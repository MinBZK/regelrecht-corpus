  - number: '16'
    text: |-
      Tolken zijn bevoegd voor de mondelinge vertolking voor de rechter in rekening te brengen voor elke vacatie van een
      half uur of gedeelte daarvan 28 USD. Ingeval tolken in dezelfde vacatie in meer dan een zaak hebben gediend bepaalt
      de rechter het bedrag dat ten laste van elke zaak afzonderlijk zal worden gebracht.
    url: https://wetten.overheid.nl/BWBR0028448/2010-10-10#Artikel16
  - number: '17'
    text: |-
      De vergoeding voor schriftelijke vertalingen bedraagt 28 USD per pagina vertaling; een pagina dient ten minste 25
      regels te kunnen bevatten met 80 tekens per regel.
    url: https://wetten.overheid.nl/BWBR0028448/2010-10-10#Artikel17
  - number: '18'
    text: |-
      Voor niet-beroepstolken en niet-beroepsvertalers worden de vergoedingen, als bedoeld in de [artikelen 16][ref1] en
      [17][ref2], gesteld op 70% van de daarin genoemde bedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0028448#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0028448#Artikel17
