        artikel: '59'
  - number: '2'
    text: |-
      1 De deurwaarders mogen, uit welke hoofde en onder welk voorwendsel ook, geen andere of hogere rechten of
      beloningen vorderen of ontvangen, of doen vorderen of ontvangen, dan die, welke bij dit besluit zijn vastgesteld.

      2 Bij overtreding zijn zij tot teruggave en vergoeding van kosten, schaden en interessen verplicht, onverminderd de
      toepassing van de strafwet, indien daartoe termen aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0028448/2010-10-10#Artikel2
  - number: '3'
    text: |-
      1 Aan de deurwaarder is verschuldigd:

      a. voor het doen van elk exploot dat betrekking heeft op een geding voor het Gerecht en voor het Hof, uitgebracht
      voor de einduitspraak in het geding, of, buiten eigenlijk rechtsgeding, op een zaak voor het Gerecht te behandelen
      of in behandeling 6 USD, en voor het doen van elk ander exploot 10 USD;

      b. voor de redactie van een exploot 3 USD;

      c. voor de overhandiging van afschriften van een exploot: 1 USD voor het eerste, 2 USD voor elk volgend afschrift;

      d. voor nazoeking, informatie en correspondentie, indien een en ander, of een van deze, moet plaats hebben met het
      oog op de redactie of het doen van exploten 2 USD;

      e. voor bespreking van de zaak met de lastgever, indien deze bespreking voor de redactie of het doen van exploten
      nodig of door de lastgever verlangd is 2 USD;

      f. voor schrijfloon van het exploot en het afschrift of de afschriften gezamenlijk, 1 USD voor elke pagina of deel
      daarvan;

      g. voor het schrijven of collationeren van afschriften van alle stukken die bij de exploten worden afgegeven, voor
      zover zij door de deurwaarder voor afschrift worden getekend, 1 USD voor elke pagina of deel daarvan.

      2 Wanneer een exploot gesteld aan de deurwaarder is overhandigd, is het bedrag in het eerste lid, onder b, genoemd
      niet verschuldigd.

      3 Blijkt het de deurwaarder, overgaande tot de betekening van een exploot als in het tweede lid bedoeld, dat
      het niet of niet op de gegeven plaats kan of moet worden uitgebracht, dan brengt hij boven zijn verschotten,
      afstandsgelden en het schrijfloon, 3 USD in rekening.

      4 De kosten in het eerste lid, onder d en e, en die in het derde lid genoemd, blijven voor rekening van hem die
      opdracht gaf en kunnen in een geding niet ten laste van de tegenpartij worden gebracht.
    url: https://wetten.overheid.nl/BWBR0028448/2010-10-10#Artikel3
  - number: '4'
    text: |-
      Indien het exploot aan het parket van het Openbaar Ministerie of een andere autoriteit of college wordt gedaan, of
      een akte aldaar moet worden betekend, en er op het origineel een visum wordt vereist of wel indien het exploot of
      een ander stuk wordt aangeplakt of aangekondigd, of in een dagblad aangekondigd, rekent de deurwaarder voor elke
      bemoeienis boven de vergoeding, hem bij [artikel 3][ref1] toegestaan, 2 USD voor elk stuk, waaromtrent een van de
      hierboven bedoelde werkzaamheden heeft plaats gehad.


      [ref1]: https://wetten.overheid.nl/BWBR0028448#Artikel3
    url: https://wetten.overheid.nl/BWBR0028448/2010-10-10#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0028448
        artikel: '3'
        afdeling: Eerste
  - number: '5'
    text: |-
      Aan de deurwaarder is verschuldigd:

      a. voor protesten van non-acceptatie of non-betaling van wissels, orderbiljetten en dergelijke, copie en
      overschrijving op het register daaronder begrepen, 13 USD; voor akten van interventie aan de voet van protesten 3
      USD; voor iedere getuige bij een protest 8 USD;

      b. voor alle voorbereidende maatregelen om te kunnen overgaan tot de ontruiming van woningen, gebouwen en
      dergelijke, de inbeslagneming of de verkoop van onroerende goederen, roerende goederen, of schepen 15 USD; voor
      de ontruiming, de inbeslagneming, het nazien of de verkoop, daaronder begrepen het opmaken van het proces-verbaal
      en het vervaardigen van de nodige afschriften 13 USD, alsmede een bedrag van 8 USD per uur, of gedeelte daarvan,
      voor de verrichtingen ter plaatse; voor ieder van de gevorderde getuigen 8 USD en indien hun tegenwoordigheid ter
      plaatse langer dan een uur vereist is, 6 USD voor elk uur of gedeelte daarvan boven het eerste uur;

      c. voor alle nodige maatregelen gezamenlijk, na inbeslagneming of verkoop, zoals de bemoeiingen ten aanzien van
      bewaarders, de inbewaringstelling van in beslag genomen waarden of gelden, de verantwoording of inbewaringstelling
      van kooppenningen en dergelijke bemoeiingen, 9 USD;

      d. voor het proces-verbaal van in gijzelneming en de akte van ingevangenisstelling van een schuldenaar, daaronder
      begrepen het getuigenloon van de twee de deurwaarder vergezellende getuigen, alsmede de afschriften 84 USD;

      e. voor vacatie ter verkrijging van assistentie van de sterke arm, ingeval zulks vereist wordt, alsmede bij het
      Gerecht en bij het Hof, ingeval van kort geding op de in hechtenisneming, het melding maken op het proces-verbaal
      daaronder begrepen 15 USD;

      f. voor alle andere processen-verbaal, in het algemeen in de gevallen waarin de deurwaarder verplicht of
      aangezocht is het verrichte of bevondene door zodanige akte te constateren, een redaktieloon van 6 USD, en gelijke
      vergoedingen als in [artikel 3, eerste lid, onder d, e en f][ref1], ten aanzien van het opmaken van exploten zijn
      genoemd, alsmede een bedrag van 6 USD voor elk uur, of gedeelte daarvan, nodig geweest voor de verrichting of het
      onderzoek ter plaatse; voor iedere getuigen, 6 USD voor elk uur, of gedeelte daarvan, dat zijn tegenwoordigheid ter
      plaatse nodig is.


      [ref1]: https://wetten.overheid.nl/BWBR0028448#Artikel3
