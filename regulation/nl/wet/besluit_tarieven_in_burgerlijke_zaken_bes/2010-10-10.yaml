  - number: '25'
    text: |-
      1 Voor de opening van een gerechtelijke rangregeling buiten faillissement wordt een bedrag van 42 USD geheven van
      degene, op wiens verzoek de akte wordt opgemaakt.

      2 Voor de indiening van verzoekschriften tot rangschikking wordt geen recht geheven. In geval van verwijzing ten
      gevolge van tegenspraak is het recht overeenkomstig [artikel 20][ref1] verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0028448#Artikel20
    url: https://wetten.overheid.nl/BWBR0028448/2010-10-10#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0028448
        artikel: '20'
        paragraaf: '1'
        afdeling: Derde
  - number: '26'
    text: |-
      1 Onverminderd het elders in dit besluit bepaalde worden aan partijen en aan belanghebbenden afschriften van of
      uittreksels uit beslissingen, akten, processen-verbaal, registers of andere stukken zonder betaling afgegeven ten
      behoeve van hun advokaten of hun gemachtigden.

      2 Voorts is de griffier bevoegd aan partijen en belanghebbenden afschriften of uittreksels, als in het eerste lid
      bedoeld, zonder betaling af te geven, voorzover zij daarbij belang hebben en niet in staat zijn op andere wijze in
      de behoefte te voorzien. Bij weigering van de griffier kunnen partijen de beslissing van de president van het Hof
      inroepen. Hiervoor is geen vast recht, als bedoeld in [paragraaf 1][ref1] van deze afdeling verschuldigd. Tegen
      deze beslissing is geen hogere voorziening toegelaten.

      3 Onverminderd het bepaalde bij het eerste en het tweede lid worden bij of krachtens een algemene maatregel van
      bestuur regelen gesteld met betrekking tot de vergoedingen, verschuldigd voor afschriften van en uittreksels uit
      vonnissen en beschikkingen.

      4 Onze Minister kan een bedrag vaststellen, te heffen van advocaten of gemachtigden voor het verstrekken van niet-
      getekende afschriften van of uittreksels uit de rol. Dit bedrag zal niet hoger zijn dan 391 USD per kalenderjaar.

      5 Voor de overschrijving van huwelijkse voorwaarden in de daartoe bestemde registers wordt een recht geheven van 56
      USD van degene die overschrijving verzoekt.


      [ref1]: https://wetten.overheid.nl/BWBR0028448#AfdelingDerde
    url: https://wetten.overheid.nl/BWBR0028448/2010-10-10#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0028448
        paragraaf: '1'
        afdeling: Derde
  - number: '27'
    text: |-
      1 Voor elke akte, beschikking of proces-verbaal gedaan, gegeven of opgemaakt door een gerecht of een
      griffier anders dan in een geding, bij de behandeling van een verzoekschrift of van de zaken, waaromtrent in
      [paragraaf 1][ref1] het vaste recht geregeld is, wordt een recht geheven van 28 USD.

      2 Voor de noodzakelijke afschriften van deze beschikkingen, akten en processen-verbaal wordt geen recht geheven.


      [ref1]: https://wetten.overheid.nl/BWBR0028448#AfdelingDerde
    url: https://wetten.overheid.nl/BWBR0028448/2010-10-10#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0028448
        paragraaf: '1'
        afdeling: Derde
  - number: '28'
    text: |-
      1 Geen recht wordt geheven ter zake van beëdigingen die ingevolge wettelijk voorschrift plaats vinden, voor de
      akte van bewaargeving van de registers van de burgerlijke stand en van de behandeling van de aangifte voor eigen
      faillissement.

      Voor afschriften van de in die gevallen op te maken akten is geen recht verschuldigd.

      2 Ook wordt geen recht geheven van openbare colleges en van ambtenaren van openbare lichamen, die afschriften of
      uittreksels van stukken of legalisaties van handtekeningen behoeven voor de waarneming van de dienst.

      3 Voorts wordt geen recht geheven in de gevallen, waarin bij andere wettelijke regelingen vrijstellingen zijn
      toegestaan of vastgesteld.
    url: https://wetten.overheid.nl/BWBR0028448/2010-10-10#Artikel28
  - number: '29'
    text: Betaling van de rechten en verschotten geschiedt hetzij contant, hetzij uit voorschot.
    url: https://wetten.overheid.nl/BWBR0028448/2010-10-10#Artikel29
  - number: '30'
    text: |-
      1 Indien in het verzoekschrift of bij de mondelinge voordracht vergunning is verzocht om kosteloos te mogen
      procederen, onder overlegging van het in artikel 738 van het [Wetboek van Burgerlijke Rechtsvordering BES][ref1]
      genoemde stuk, worden de rechten in debet gesteld.

      2 Bij intrekking of afwijzing van het verzoek zijn de verschuldigde rechten terstond opvorderbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0028496
    url: https://wetten.overheid.nl/BWBR0028448/2010-10-10#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0028496
  - number: '31'
    text: |-
      Op last van de president van het Hof of van de rechter in eerste aanleg wordt aan on- of minvermogenden voor
      het geheel of voor de helft, vrijstelling van rechten verleend in de gevallen, waarin niet is voorzien in de
      [artikelen 736 tot en met 747 van het Wetboek van Burgerlijke Rechtsvordering BES][ref1].

      Zodanige last wordt gegeven ten behoeve van personen die, onder overlegging van het in artikel 738 van het Wetboek
      van Burgerlijke Rechtsvordering BES genoemd stuk, doen blijken dat hun financiële draagkracht tekort schiet voor
      het voldoen van de rechten.


      [ref1]: https://wetten.overheid.nl/BWBR0028496#Artikel736
    url: https://wetten.overheid.nl/BWBR0028448/2010-10-10#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0028496
        artikel: '736'
  - number: '32'
    text: In debet gestelde opvorderbare rechten worden voldaan zodra de griffier de vordering tot betaling doet.
    url: https://wetten.overheid.nl/BWBR0028448/2010-10-10#Artikel32
  - number: '33'
    text: |-
      1 Bij gebreke van betaling geschiedt invordering van de rechten en betaalde verschotten krachtens een dwangbevel.

      2 Het dwangbevel wordt uitvoerbaar verklaard door de rechter in eerste aanleg, of, indien het het Hof geldt, door
      de president.

      3 Het dwangbevel wordt op kosten van de schuldenaar, niet eerder dan een maand na de betekening tenuitvoergelegd op
      de wijze in het [Wetboek van Burgerlijke Rechtsvordering BES][ref1] bepaald.

      4 Gedurende een maand na de betekening van het dwangbevel kan de schuldenaar bij het betrokken gerecht, rechtdoende
      in burgerlijke zaken, daartegen, bij verzoekschrift, in verzet komen.


      [ref1]: https://wetten.overheid.nl/BWBR0028496
    url: https://wetten.overheid.nl/BWBR0028448/2010-10-10#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0028496
  - number: '34'
    text: |-
      1 Geschillen over de tenuitvoerlegging van dwangbevelen gerezen, worden berecht door het Gerecht in Eerste Aanleg,
      rechtdoende in burgerlijke zaken.

      Bevoegd is het Gerecht binnen wiens rechtsgebied de tenuitvoerlegging plaats heeft.

      2 Zodanige geschillen worden bij verzoekschrift van verzet aan het oordeel van de rechter onderworpen.

      3 Het verzet kan nimmer steunen op de onwettigheid van het tenuitvoergelegde dwangbevel.

      4 Tegen de beslissing van het Gerecht is geen hogere voorziening toegelaten.
    url: https://wetten.overheid.nl/BWBR0028448/2010-10-10#Artikel34
  - number: '35'
    text: |-
      1 De griffier is bevoegd van de belanghebbenden, hun advocaten, raadslieden of gemachtigden, tegen bewijs
      van ontvangst en ter latere verrekening, een voorschot te vragen tot dekking van de vermoedelijke rechten en
      verschotten.

      2 De griffier kan zijn dienst weigeren, zolang het verlangde voorschot niet is gestort.

      3 Gedurende een maand na de storting van het voorschot kan de voorschotgever bij het Gerecht of het Hof ter welks
      griffie het voorschot is gestort, rechtdoende in burgerlijke zaken, tegen de beslissing van de griffier, bij
      verzoekschrift, in verzet komen.

      4 Tegen de beslissing van het Gerecht of het Hof is geen hogere voorziening toegelaten.
    url: https://wetten.overheid.nl/BWBR0028448/2010-10-10#Artikel35
  - number: '36'
    text: |-
      1 Gedurende een maand na de mededeling van de uit het voorschot verrekende rechten en verschotten, en bij
      rechtstreekse betaling daarvan, binnen een maand na die betaling kunnen in het eerste geval de voorschotgever,
      in het tweede geval hij die de rechten en verschotten betaalde, bij het Gerecht of het Hof ter griffie waarvan
      voorschot werd gestort of werd betaald, rechtdoende in burgerlijke zaken, tegen de beslissing van de griffier, bij
      verzoekschrift, in verzet komen.

      2 Tegen de beslissing van het Gerecht of het Hof is geen hogere voorziening toegelaten.
    url: https://wetten.overheid.nl/BWBR0028448/2010-10-10#Artikel36
  - number: '37'
    text: |-
      Voor de indiening van een verzoekschrift, als bedoeld in de [artikelen 33][ref1], [35][ref2] en [36][ref3] is geen
      recht verschuldigd.


