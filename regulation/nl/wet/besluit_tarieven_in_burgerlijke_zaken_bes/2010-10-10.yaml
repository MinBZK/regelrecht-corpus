        bwb_id: BWBR0028743
  - number: '21'
    text: |-
      1 Het geding in reconventie, het incidenteel beroep als bedoeld in
      [artikel 267 van het Wetboek van Burgerlijke Rechtsvordering BES][ref1], het vereffenen van kosten, schaden en
      interessen en het doen van rekening en verantwoording worden niet als afzonderlijke gedingen beschouwd.

      2 De vordering tot voeging of tussenkomst, als bedoeld in
      [artikel 214 van het Wetboek van Burgerlijke Rechtsvordering BES][ref2], geldt voor de partijen die de vordering
      doet, als het aanvangen van een nieuw geding. Voor een zodanige vordering is een gelijk bedrag aan vast recht
      verschuldigd als voor de vordering in het oorspronkelijk geding.

      3 In een geding tot vrijwaring is de eiser tot vrijwaring geen vast recht verschuldigd.

      4 In geval van verzet is de opposant geen vast recht verschuldigd.

      5 Voor de indiening van een gemeenschappelijk verzoek tot scheiding van tafel en bed of ontbinding van het huwelijk
      na scheiding van tafel en bed wordt van elk van de verzoekers de helft van het verschuldigde vast recht geheven.

      6 Indien in de loop van een aanhangig geding een op dit geding betrekking hebbend verzoekschrift wordt ingediend,
      is daarvoor geen vast recht verschuldigd.

      7 Bij verwijzing van een zaak naar een andere zittingsplaats is niet opnieuw vast recht verschuldigd.

      8 [Vervallen]


      [ref1]: https://wetten.overheid.nl/BWBR0028496#Artikel267
      [ref2]: https://wetten.overheid.nl/BWBR0028496#Artikel214
