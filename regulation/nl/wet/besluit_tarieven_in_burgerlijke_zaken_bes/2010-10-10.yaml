  - number: '19'
    text: |-
      1 In alle zaken, behalve strafzaken worden rechten geheven, behalve van het openbaar ministerie en van de
      voogdijraad, ambtshalve optredende.

      2 Onze Minister kan bepalen dat voor bepaalde categorieën van zaken geen vast recht verschuldigd zal zijn.
    url: https://wetten.overheid.nl/BWBR0028448/2010-10-10#Artikel19
  - number: '20'
    text: |-
      1 Voor de indiening van een verzoekschrift bij het Gerecht of het Hof wordt van elke eisende partij een vast recht
      geheven, onverminderd de verschotten.

      2 Het vast recht bij het Gerecht bedraagt:

      a. wanneer de eis of het verzoek betrekking heeft op het bij of krachtens
      [boek 1 van het Burgerlijk Wetboek BES][ref1] bepaalde, 28 USD;

      b. wanneer de eis of het verzoek strekt tot betaling van een bepaalde geldsom van niet meer dan 5587 USD in
      hoofdsom, 15% van de hoofdsom met een minimum van 28 USD en een maximum van 251 USD;

      c. wanneer de eis of het verzoek strekt tot betaling van een bepaalde geldsom van meer dan 5587 USD in hoofdsom,
      doch niet meer dan 13.966 USD, 419 USD;

      d. wanneer de eis of het verzoek strekt tot betaling van een bepaalde geldsom van meer dan 13.966 USD in hoofdsom,
      1% van de hoofdsom met een minimum van 419 USD en een maximum van 4190 USD.

      3 In de gevallen waarin het tweede lid niet van toepassing is, is een vast recht verschuldigd van 251 USD, tenzij
      de eisende partij een direct geldelijk belang heeft dat op een bepaald bedrag kan worden gewaardeerd. In het
      laatste geval is het tweede lid van overeenkomstige toepassing.

      4 In geval van vermindering van een eis of van een verzoek wordt het recht niet verminderd.

      5 In geval van vermeerdering van een eis of van een verzoek tot een bepaalde geldsom of tot een bepaald direct
      geldelijk belang, wordt het recht verhoogd en bepaald overeenkomstig het tweede lid, zonodig in verbinding met het
      derde lid. De verhoging is verschuldigd na de afroeping van de zaak ter terechtzitting waarop eiser zijn eis bij
      conclusie of akte ter rolle heeft vermeerderd of nadat het verzoek is vermeerderd.

      6 Het verschuldigd vast recht wordt afgerond op het meest nabij gelegen veelvoud van 6 USD.

      7 Het vast recht bij het Hof bedraagt het tweevoud van dat bij het Gerecht.


      [ref1]: https://wetten.overheid.nl/BWBR0028743
    url: https://wetten.overheid.nl/BWBR0028448/2010-10-10#Artikel20
