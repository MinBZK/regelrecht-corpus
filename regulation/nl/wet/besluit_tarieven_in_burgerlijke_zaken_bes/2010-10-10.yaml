  - number: '6'
    text: |-
      1 Door de partij of de belanghebbende die de opdracht gaf, worden aan de deurwaarder vergoed alle kosten in
      billijkheid als verschotten door hem gemaakt, zoals zegel- en registratierechten, briefport en telegramkosten,
      advertentiekosten, kosten van transport van goederen, vergoeding van werklieden, lokaalhuur, belasting en alle
      dergelijke, voor zover mogelijk op vertoon van kwitantie wegens het betaalde, en desnoods ter taxatie door de
      president van het Hof of het Gerecht naar gelang het een zaak betreft voor het Hof of het Gerecht te behandelen of
      in behandeling.

      2 Indien de deurwaarder, zich voor het doen van ambtsverrichtingen buiten zijn kantoor of het gerechtsgebouw of
      (buiten kantooruren) zijn woning moet begeven, worden door de partij of de belanghebbende die de opdracht gaf aan
      hem, naar gelang van de af te leggen reiskosten vergoed.

      Aan ieder van de getuigen die de deurwaarder moet vergezellen wordt de helft van de aan de deurwaarder
      verschuldigde afstandsgelden vergoed. Het Gerecht beslist over geschillen omtrent afstandsgelden.
    url: https://wetten.overheid.nl/BWBR0028448/2010-10-10#Artikel6
  - number: '7'
    text: |-
      1 De deurwaarder ter rolle dienstdoende, berekent:

      a. voor de afroeping van elke zaak 1 USD;

      b. bij de verkoop van onroerend goed of schepen 8 USD voor elk perceel of schip, dat in veiling wordt gebracht;

      c. voor bemoeiingen bij getuigenverhoren voor elk verhoor, ongeacht het aantal getuigen 4 USD.

      2 De deurwaarders mogen bij comparities voor het Hof, voor het Gerecht, of voor de rechter-commissaris, gelijke
      vergoeding als voor de afroeping van een zaak ter rolle vorderen van de partij op wiens verzoek de comparitie wordt
      gehouden.

      3 Indien de comparitie ambtshalve plaats heeft, wordt deze vergoeding door de belanghebbenden, ieder voor een
      gelijk aandeel, voldaan.
    url: https://wetten.overheid.nl/BWBR0028448/2010-10-10#Artikel7
  - number: '8'
    text: |-
      1 Voor elke verrichting, krachtens verlof van de rechter op zondag of op een algemeen erkende feestdag, wordt het
      de deurwaarder verschuldigde met de helft verhoogd.

      2 Algemeen erkende feestdagen zijn:

      a. de Nieuwjaarsdag

      b. de dag na de, in ieder openbaar lichaam afzonderlijk gehouden, Carnavalsoptocht;

      c. de Goede Vrijdag;

      d. de Christelijke tweede Paasdag;

      e. de Hemelvaartsdag;

      f. de dag waarop de verjaardag van de Koning officieel wordt gevierd;

      g. de dag waarop de dag van de arbeid (1 mei) officieel wordt gevierd;

      h. de eerste en tweede Kerstdag;

      i. 6 september voor wat betreft het openbaar lichaam Bonaire;

      j. 16 november voor wat betreft het openbaar lichaam Sint Eustatius;

      k. de eerste vrijdag in de maand december voor wat betreft het openbaar lichaam Saba;

      l. elke andere dag bij besluit aangewezen.
    url: https://wetten.overheid.nl/BWBR0028448/2010-10-10#Artikel8
  - number: '9'
    text: |-
      1 Aan de gestelde bewaarder over in beslag genomen of verzegelde goederen, wordt wanneer hij geen medebewoner
      van het huis of de plaats is, waarin de inbeslagneming of verzegeling heeft plaats gehad, of zelf bij de bewaring
      daarvan geen belang heeft, of wanneer hij daarmede in geen andere betrekking is belast, voor elke dag of gedeelte
      daarvan, kost en onderhoud daaronder begrepen, toegekend een vergoeding van 6 USD.

      2 Indien de in het eerste lid bedoelde bewaarder medebewoner is van het huis of de plaats, waarin de inbeslagneming
      of verzegeling heeft plaats gehad, en die zelf bij de bewaring daarvan geen belang heeft of daarmede in geen
      andere betrekking is belast, wordt aan deze toegekend een vergoeding van 3 USD per dag of gedeelte daarvan, alles
      daaronder begrepen.
    url: https://wetten.overheid.nl/BWBR0028448/2010-10-10#Artikel9
  - number: '10'
    text: |-
      Aan deskundigen wordt toegekend een vacatiegeld, ter beoordeling van de rechter die het onderzoek heeft bevolen,
      maar niet hoger dan 112 USD voor elke vacatie van een uur, of een gedeelte daarvan.
    url: https://wetten.overheid.nl/BWBR0028448/2010-10-10#Artikel10
  - number: '11'
    text: Voor de eedsaflegging alsook voor de overbrenging van het rapport ter griffie, wordt een halve vacatie berekend.
    url: https://wetten.overheid.nl/BWBR0028448/2010-10-10#Artikel11
  - number: '12'
    text: |-
      Indien deskundigen zich voor het verrichten van hun werkzaamheden van hun woning of kantoor moeten verwijderen,
      wordt aan hen een gelijk vacatiegeld toegekend, voor de tijd van de heen- en terugreis.
    url: https://wetten.overheid.nl/BWBR0028448/2010-10-10#Artikel12
  - number: '13'
    text: |-
      Aan houders of bewaarders van stukken, die opgeroepen worden om stukken, onder hun berusting of bewaring zijnde,
      voor de rechter te brengen, wordt ter beoordeling van de rechter voor elke vacatie toegekend een bedrag van ten
      hoogste 28 USD.
    url: https://wetten.overheid.nl/BWBR0028448/2010-10-10#Artikel13
  - number: '14'
    text: |-
      Aan getuigen wordt, ter beoordeling van de rechter een schadeloosstelling toegekend voor elk uur dat hun
      tegenwoordigheid wordt vereist, van hoogstens 31 USD per uur of een gedeelte daarvan, met een maximum van 251 USD
      per dag.
    url: https://wetten.overheid.nl/BWBR0028448/2010-10-10#Artikel14
  - number: '15'
    text: |-
      1 Aan deskundigen, aan houders of bewaarders van stukken, als bedoeld in de [artikelen 10][ref1] en [13][ref2],
      en aan getuigen, zal het bedrag van hetgeen de heen- en terugreis kost, worden vergoed, naar billijkheid en ter
      beoordeling van de rechter.

      2 Daarenboven zal hun, ter beoordeling van de rechter, voor tijdverlies gedurende de heen- en terugreis een
      schadeloosstelling worden toegekend. [Artikel 14][ref3], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028448#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0028448#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0028448#Artikel14
    url: https://wetten.overheid.nl/BWBR0028448/2010-10-10#Artikel15
