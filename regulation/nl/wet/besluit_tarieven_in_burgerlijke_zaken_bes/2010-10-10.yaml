        artikel: '214'
  - number: '22'
    text: |-
      1 Aan elke partij worden, ongeacht of door haar het vaste recht verschuldigd is, kosteloos verstrekt:

      a. een afschrift van alle vonnissen en beschikkingen;

      b. verdere afschriften van het eindvonnis, of de eindbeschikking voorzover deze nodig mochten zijn voor de
      tenuitvoerlegging, voor het aanwenden van rechtsmiddelen of krachtens wettelijk voorschrift;

      c. een afschrift van alle akten en processen-verbaal, ten processe opgemaakt, met uitzondering van processen-
      verbaal in de vorm van audientiebladen opgemaakt.

      2 Evenmin worden kosten in rekening gebracht voor beslissingen, akten en processen-verbaal, die een rechtstreeks
      uitvloeisel van de uitspraak zijn, met inbegrip van afschriften op de voet van het eerste lid.

      3 Onze Minister kan nadere regelen stellen omtrent de toepassing van dit artikel.
    url: https://wetten.overheid.nl/BWBR0028448/2010-10-10#Artikel22
  - number: '23'
    text: |-
      1 Het vaste recht voor de indiening van een verzoekschrift tot het verlenen of het verlengen van surseance van
      betaling bedraagt 84 USD. Hetzelfde vaste recht wordt geheven van hem, die ter zake hoger beroep instelt.

      2 Ingeval van indiening van een verzoekschrift tot ontbinding van een akkoord of in hoger beroep van de beslissing
      betreffende homologatie of ontbinding van een akkoord dan wel van een vonnis tot faillietverklaring bij niet-
      aanneming van een akkoord door de schuldeisers, wordt het recht volgens [artikel 20][ref1] geheven.


      [ref1]: https://wetten.overheid.nl/BWBR0028448#Artikel20
    url: https://wetten.overheid.nl/BWBR0028448/2010-10-10#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0028448
        artikel: '20'
        paragraaf: '1'
        afdeling: Derde
  - number: '24'
    text: |-
      1 In elk faillissement betaalt de curator uit de baten van de boedel bij het deponeren van de eerste
      uitdelingslijst of zodra de uitspraak tot homologatie van een akkoord in kracht van gewijsde is gegaan, een vast
      recht van 112 USD.

      2 Onder het vaste recht, als bedoeld in het eerste lid, is niet begrepen het recht, volgens [artikel 20][ref1] voor
      verificatiegeschillen verschuldigd.

      3 Ingeval van indiening van een verzoekschrift in hoger beroep van de beslissing betreffende de homologatie
      van een akkoord, evenals ingeval van indiening van een verzoekschrift tot ontbinding van een akkoord en van een
      verzoekschrift in hoger beroep van die beslissing, wordt het recht volgens [artikel 20][ref2] geheven.

      4 Hij die als niet geverifieerd schuldeiser verzet doet tegen de uitdelingslijst ten einde als schuldeiser
      geverifieerd te worden, voldoet een vast recht overeenkomstig [artikel 20][ref3]. Het recht wordt niet geheven,
      indien tevens door wel geverifieerde schuldeisers verzet tegen de uitdelingslijst wordt gedaan.


