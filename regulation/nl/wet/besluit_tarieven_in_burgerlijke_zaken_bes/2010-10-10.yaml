  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. *het Hof:* het Gemeenschappelijk Hof van Justitie van Aruba, Curaçao, Sint Maarten en van Bonaire, Sint
      Eustatius en Saba;

      b. *het Gerecht:* het Gerecht in eerste aanleg van Bonaire, Sint Eustatius en Saba;

      c. *de griffier:* de griffier van het Hof onderscheidenlijk het Gerecht;

      d. *Onze Minister:* Onze Minister van Justitie;

      e. *het Wetboek van Burgerlijke Rechtsvordering:* het [Wetboek van Burgerlijke Rechtsvordering BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028496
    url: https://wetten.overheid.nl/BWBR0028448/2010-10-10#Artikel1
