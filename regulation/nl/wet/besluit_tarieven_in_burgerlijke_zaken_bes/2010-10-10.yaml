        bwb_id: BWBR0028496
  - number: 1a
    text: |-
      Dit besluit berust op [artikel 59 van de Rijkswet Gemeenschappelijk Hof van Justitie][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028070#Artikel59
    url: https://wetten.overheid.nl/BWBR0028448/2010-10-10#Artikel1a
