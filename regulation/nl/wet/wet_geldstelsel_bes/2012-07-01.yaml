        artikel: '32'
  - number: 13f.1.a
    text: |-
      «Aruba, Curaçao en Sint Maarten», «Curaçao, Sint Maarten», «Curaçao en Sint Maarten», «Curaçao onderscheidenlijk
      Sint Maarten» «Curaçao, onderscheidenlijk Aruba, onderscheidenlijk Sint Maarten» of «Aruba, Curaçao of Sint
      Maarten» telkens moet worden gelezen «de openbare lichamen»;
    url: https://wetten.overheid.nl/BWBR0028551/2012-07-01#Artikel13f
  - number: 13f.1.b
    text: «Nederland» telkens moet worden gelezen «het in Europa gelegen deel van het Koninkrijk».
    url: https://wetten.overheid.nl/BWBR0028551/2012-07-01#Artikel13f
  - number: 13f.2
    text: |-
      De in het eerste lid bedoelde wijze van voorkoming van dubbele belasting, wordt gedurende de overgangsperiode
      aangemerkt als de Belastingregeling voor het land Nederland.
    url: https://wetten.overheid.nl/BWBR0028551/2012-07-01#Artikel13f
  - number: 13g.1
    text: |-
      De Raad van Beroep voor belastingzaken is gevestigd in de zittingsplaats van het Gerecht in Eerste Aanleg van
      Bonaire, Sint Eustatius en Saba. De Raad kan ook elders zitting houden.
    url: https://wetten.overheid.nl/BWBR0028551/2012-07-01#Artikel13g
  - number: 13g.2
    text: De Raad van Beroep voor belastingzaken doet uitspraak op beroepschriften inzake belastingen.
    url: https://wetten.overheid.nl/BWBR0028551/2012-07-01#Artikel13g
  - number: 13h.1
    text: De Raad van Beroep voor belastingzaken bestaat uit een voorzitter en twee leden.
    url: https://wetten.overheid.nl/BWBR0028551/2012-07-01#Artikel13h
  - number: 13h.2
    text: |-
      Voorzitter is de President van het Gemeenschappelijke Hof van Justitie van Aruba, Curaçao, Sint Maarten en van
      Bonaire, Sint Eustatius en Saba of zijn aangewezen plaatsvervanger.
    url: https://wetten.overheid.nl/BWBR0028551/2012-07-01#Artikel13h
  - number: 13h.3
    text: |-
      De leden worden door de voorzitter gekozen uit de bezoldigde met rechtspraak belaste leden, waaruit het
      Gemeenschappelijke Hof van Justitie van Aruba, Curaçao, Sint Maarten en van Bonaire, Sint Eustatius en Saba is
      samengesteld, hetzij voor een bepaalde termijn, hetzij voor een bepaalde zaak.
    url: https://wetten.overheid.nl/BWBR0028551/2012-07-01#Artikel13h
  - number: 13i
    text: |-
      Als secretaris van de Raad van Beroep voor belastingzaken treedt op de griffier van het Gemeenschappelijke Hof van
      Justitie van Aruba, Curaçao, Sint Maarten en van Bonaire, Sint Eustatius en Saba, die zo nodig wordt vervangen door
      de substituut-griffier van het Gemeenschappelijke Hof van Justitie van Aruba, Curaçao, Sint Maarten en van Bonaire,
      Sint Eustatius en Saba.
    url: https://wetten.overheid.nl/BWBR0028551/2012-07-01#Artikel13i
  - number: 13j.1
    text: De Raad van Beroep voor belastingzaken vergadert op plaats en tijd door de voorzitter te bepalen.
    url: https://wetten.overheid.nl/BWBR0028551/2012-07-01#Artikel13j
  - number: 13j.2
    text: De vergaderingen zijn niet openbaar.
    url: https://wetten.overheid.nl/BWBR0028551/2012-07-01#Artikel13j
  - number: 13j.3
    text: De Raad van Beroep voor belastingzaken beslist bij meerderheid van stemmen.
    url: https://wetten.overheid.nl/BWBR0028551/2012-07-01#Artikel13j
  - number: 13j.4
    text: |-
      Zijn meer dan twee verschillende gevoelens uitgebracht, dan wordt besloten in de zin, die het meest overeenkomt met
      het gevoelen van de meerderheid.
    url: https://wetten.overheid.nl/BWBR0028551/2012-07-01#Artikel13j
  - number: '14'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voor een goede uitvoering van deze wet nadere regels worden
      gesteld met betrekking tot de in deze wet geregelde onderwerpen.
    url: https://wetten.overheid.nl/BWBR0028551/2012-07-01#Artikel14
  - number: '15.1'
    text: |-
      Handelen in strijd met [artikel 6, tweede lid][ref1], wordt gestraft met hechtenis van ten hoogste zes maanden of
      geldboete van de vierde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0028551#Artikel6
    url: https://wetten.overheid.nl/BWBR0028551/2012-07-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0028551
        artikel: '6'
        paragraaf: '1'
  - number: '15.2'
    text: |-
      Opzettelijk handelen in strijd met [artikel 6, tweede lid][ref1], wordt gestraft met gevangenisstraf van ten
      hoogste 2 jaren of geldboete van de vierde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0028551#Artikel6
    url: https://wetten.overheid.nl/BWBR0028551/2012-07-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0028551
        artikel: '6'
        paragraaf: '1'
  - number: '15.3'
    text: |-
      Het in het eerste lid strafbaar gestelde feit is een overtreding. Het in het tweede lid strafbaar gestelde feit is
      een misdrijf.
    url: https://wetten.overheid.nl/BWBR0028551/2012-07-01#Artikel15
  - number: '16.1'
    text: |-
      Indien
      __REF000___________________________________________________________________________________________________________
      _____ op een eerder tijdstip in werking treedt dan deze wet, blijft tot aan het tijdstip van inwerkingtreding van
      deze wet de Nederlands-Antilliaanse gulden de munteenheid van de openbare lichamen.


      [ref1]: https://wetten.overheid.nl/BWBR0028249#ArtikelI
    url: https://wetten.overheid.nl/BWBR0028551/2012-07-01#Artikel16
