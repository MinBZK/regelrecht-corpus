  - number: '16.2'
    text: |-
      Gedurende de in het eerste lid bedoelde periode hebben de in Nederlands-Antilliaanse
      guldens luidende bankbiljetten en munten die op het tijdstip van inwerkingtreding van
      __REF000___________________________________________________________________________________________________________
      _____ als wettig betaalmiddel in omloop waren, de hoedanigheid van wettig betaalmiddel in de openbare lichamen.


      [ref1]: https://wetten.overheid.nl/BWBR0028249#ArtikelI
    url: https://wetten.overheid.nl/BWBR0028551/2012-07-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0028249
        artikel: I
  - number: '16.3'
    text: |-
      Verwijzingen naar de dollar, opgenomen in een wettelijk voorschrift, gelden gedurende de in het eerste lid bedoelde
      periode als verwijzingen naar Nederlands-Antilliaanse guldens, volgens de omrekenkoers USD 1,00 = NAf. 1,790.
      [Artikel 11][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028551#Artikel11
    url: https://wetten.overheid.nl/BWBR0028551/2012-07-01#Artikel16
