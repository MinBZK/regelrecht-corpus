    text: de Landsverordening economische zones 2000;
    url: https://wetten.overheid.nl/BWBR0028551/2012-07-01#Artikel13b
  - number: 13b.1.t
    text: de Landsverordening tarief van invoerrechten;
    url: https://wetten.overheid.nl/BWBR0028551/2012-07-01#Artikel13b
  - number: 13b.1.u
    text: de Landsverordening In- en Uitvoer;
    url: https://wetten.overheid.nl/BWBR0028551/2012-07-01#Artikel13b
  - number: 13b.1.v
    text: de Landsverordening uitvoerrecht op delfstoffen;
    url: https://wetten.overheid.nl/BWBR0028551/2012-07-01#Artikel13b
  - number: 13b.1.w
    text: |-
      de op de eilandgebieden Bonaire, Sint Eustatius en Saba geldende eilandsverordeningen regelende de heffing van
      opcenten op de aanslagen in de inkomstenbelasting en de winstbelasting;
    url: https://wetten.overheid.nl/BWBR0028551/2012-07-01#Artikel13b
  - number: 13b.1.x
    text: de Registratieverordening 1908;
    url: https://wetten.overheid.nl/BWBR0028551/2012-07-01#Artikel13b
  - number: 13b.1.y
    text: de Landsverordening op de scheepsregistratiebelasting 1987, of
    url: https://wetten.overheid.nl/BWBR0028551/2012-07-01#Artikel13b
  - number: 13b.1.z
    text: de op de in de onderdelen a tot en met y bedoelde verordeningen gebaseerde regelingen,
    url: https://wetten.overheid.nl/BWBR0028551/2012-07-01#Artikel13b
  - number: 13b.2
    text: |-
      Op de rechten en verplichtingen, bedoeld in het eerste lid, blijven de Algemene Landsverordening Landsbelastingen,
      de Invorderingsverordening 1961, de Invorderingsverordening 1970, de Landsverordening houdende regeling van
      de invordering van belastingen, bijdragen en vergoedingen, de Landsverordening op de invordering van directe
      belastingen 1943, de Landsverordening houdende regeling van de invordering van belastingen, bijdragen en
      vergoedingen door middel van dwangschriften alsmede van de rechtspleging inzake van belastingen, bijdragen en
      vergoedingen en de Algemene Verordening I. U. en D. 1908 en de daarop gebaseerde regelingen van toepassing.
    url: https://wetten.overheid.nl/BWBR0028551/2012-07-01#Artikel13b
  - number: 13b.3
    text: |-
      Het eerste lid en het tweede lid zijn van overeenkomstige toepassing op, op het tijdstip dat onmiddellijk
      voorafgaat aan het tijdstip van transitie, bestaande rechtsverhoudingen.
    url: https://wetten.overheid.nl/BWBR0028551/2012-07-01#Artikel13b
  - number: 13b.4
    text: |-
      In de overgangsperiode zijn de in het eerste lid, onderdelen a tot en met y, en het tweede lid bedoelde
      verordeningen als wet van toepassing. De op deze verordeningen gebaseerde regelingen bedoeld in onderdeel z zijn in
      de overgangsperiode als ministeriële regelingen van toepassing.
    url: https://wetten.overheid.nl/BWBR0028551/2012-07-01#Artikel13b
  - number: 13b.5
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld voor de toepassing van het vierde lid.
    url: https://wetten.overheid.nl/BWBR0028551/2012-07-01#Artikel13b
  - number: 13c.1
    text: |-
      Op het tijdstip van transitie gaan de taken en bevoegdheden van de Inspecteur der Belastingen en de Inspecteur der
      Invoerrechten en Accijnzen over op de inspecteur van de rijksbelastingdienst, bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0028551/2012-07-01#Artikel13c
  - number: 13c.2
    text: |-
      Op het tijdstip van transitie gaan de taken en bevoegdheden van de Ontvanger over op de ontvanger van de
      rijksbelastingdienst, bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0028551/2012-07-01#Artikel13c
  - number: 13c.3
    text: |-
      De inspecteur of ontvanger van de rijksbelastingdienst is de functionaris die als zodanig bij ministeriële regeling
      is aangewezen.
    url: https://wetten.overheid.nl/BWBR0028551/2012-07-01#Artikel13c
  - number: 13c.4
    text: |-
      De bevoegdheid van een inspecteur of ontvanger is niet bepaald naar de geografische indeling van het Rijk. Bij
      ministeriële regeling worden regels gesteld omtrent de hoofdlijnen van de inrichting van de rijksbelastingdienst
      en omtrent de functionaris, bedoeld in de vorige volzin, onder wie de belastingplichtige en de belastingschuldige
      ressorteren.
    url: https://wetten.overheid.nl/BWBR0028551/2012-07-01#Artikel13c
  - number: 13c.5
    text: |-
      Voor de toepassing van dit artikel wordt verstaan onder: - *Rijk:* het land Nederland, zijnde Nederland en de
      openbare lichamen;
        - *Nederland:* het in Europa gelegen deel van het Koninkrijk der Nederlanden.
    url: https://wetten.overheid.nl/BWBR0028551/2012-07-01#Artikel13c
  - number: 13d
    text: |-
      De bepalingen van de verordeningen, bedoeld in [artikel 13b, eerste en tweede lid][ref1], blijven van toepassing op
      de in die verordeningen strafbaar gestelde feiten die zich hebben voorgedaan vóór het tijdstip van transitie.


      [ref1]: https://wetten.overheid.nl/BWBR0028551#Artikel13b
    url: https://wetten.overheid.nl/BWBR0028551/2012-07-01#Artikel13d
    references:
      - id: ref1
        bwb_id: BWBR0028551
        artikel: 13b
        paragraaf: 2a
  - number: 13e
    text: |-
      Op het tijdstip van transitie treedt de Raad van Beroep voor belastingzaken, bedoeld in [paragraaf 2b][ref1], in de
      plaats van de Raad van Beroep voor belastingzaken, bedoeld in de Landsverordening op het beroep in belastingzaken
      1940.


      [ref1]: https://wetten.overheid.nl/BWBR0028551#Paragraaf2b
    url: https://wetten.overheid.nl/BWBR0028551/2012-07-01#Artikel13e
    references:
      - id: ref1
        bwb_id: BWBR0028551
        paragraaf: 2b
  - number: 13f.1
    text: |-
      In afwijking van [artikel 37, tweede lid, van de Algemene wet inzake rijksbelastingen][ref1] en
      artikel 58 van de in de overgangsperiode als wet van toepassing zijnde Algemene Landsverordening
      Landsbelasting, wordt in de overgangsperiode dubbele belasting voorkomen overeenkomstig de
      regels van de [Belastingregeling voor het Koninkrijk][ref2] met uitzondering van de regels,
      bedoeld in [artikel 3, derde lid, onderdeel c][ref3], [artikel 11, derde lid, onderdeel b][ref4],
      [artikel 26, tweede lid, onderdeel c][ref5], [artikel 30, onderdeel c][ref6],
      [artikel 32, onderdeel c, van die regeling][ref7] en met dien verstande dat voor:


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0002464
      [ref3]: https://wetten.overheid.nl/BWBR0002464#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0002464#Artikel11
      [ref5]: https://wetten.overheid.nl/BWBR0002464#Artikel26
      [ref6]: https://wetten.overheid.nl/BWBR0002464#Artikel30
      [ref7]: https://wetten.overheid.nl/BWBR0002464#Artikel32
    url: https://wetten.overheid.nl/BWBR0028551/2012-07-01#Artikel13f
