    url: https://wetten.overheid.nl/BWBR0028551/2012-07-01#Artikel13b
  - number: 13b.1.b
    text: de Landsverordening op de loonbelasting 1976;
    url: https://wetten.overheid.nl/BWBR0028551/2012-07-01#Artikel13b
