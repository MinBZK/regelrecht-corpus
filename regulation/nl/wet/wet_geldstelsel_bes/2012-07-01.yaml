preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat met de eilandgebieden Bonaire, Sint Eustatius en Saba is overeengekomen
    dat zij als openbare lichamen een staatsrechtelijke positie binnen het Nederlandse staatsbestel krijgen en dat het
    in verband hiermee wenselijk is regels te stellen met betrekking tot de munteenheid en de wettige betaalmiddelen
    van de openbare lichamen Bonaire, Sint Eustatius en Saba, en dat het met het oog op de transitie voorts wenselijk
    is om enige voorzieningen van overgangsrechtelijke aard te treffen, waaronder de tijdelijke voortzetting van het
    Nederlands-Antilliaanse fiscale stelsel;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0028551/2012-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0028551/2012-07-01#Artikel1
  - number: 1.a
    text: '*Bank:* De Nederlandsche Bank N.V.;'
    url: https://wetten.overheid.nl/BWBR0028551/2012-07-01#Artikel1
  - number: 1.b
    text: '*dollar:* de gelijknamige munteenheid van de Verenigde Staten van Amerika;'
    url: https://wetten.overheid.nl/BWBR0028551/2012-07-01#Artikel1
  - number: 1.c
    text: |-
      *dollarbiljetten en dollarmunten:* als wettig betaalmiddel van de Verenigde Staten van Amerika in omloop zijnde
      bankbiljetten en munten;
    url: https://wetten.overheid.nl/BWBR0028551/2012-07-01#Artikel1
  - number: 1.d
    text: '*openbare lichamen:* de openbare lichamen Bonaire, Sint Eustatius en Saba;'
    url: https://wetten.overheid.nl/BWBR0028551/2012-07-01#Artikel1
  - number: 1.e
    text: |-
      *kredietinstelling:* kredietinstelling in de zin van de [Wet financiële markten BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030883
    url: https://wetten.overheid.nl/BWBR0028551/2012-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0030883
  - number: '2.1'
    text: |-
      De munteenheid van de openbare lichamen is de dollar. De rekeneenheid is één dollar; de dollar is verdeeld in
      honderd centen.
    url: https://wetten.overheid.nl/BWBR0028551/2012-07-01#Artikel2
  - number: '2.2'
    text: |-
      Bij in cijfers aangegeven bedragen kan de dollar worden aangeduid met de letters «USD» of het symbool «$»,
      geplaatst voor het bedrag.
    url: https://wetten.overheid.nl/BWBR0028551/2012-07-01#Artikel2
  - number: '3'
    text: 'Bankbiljetten en munten met de hoedanigheid van wettig betaalmiddel in de openbare lichamen zijn:'
    url: https://wetten.overheid.nl/BWBR0028551/2012-07-01#Artikel3
  - number: 3.a
    text: dollarmunten met een nominale waarde van ten hoogste USD 1;
    url: https://wetten.overheid.nl/BWBR0028551/2012-07-01#Artikel3
  - number: 3.b
    text: dollarbiljetten met een nominale waarde van ten hoogste USD 100.
    url: https://wetten.overheid.nl/BWBR0028551/2012-07-01#Artikel3
  - number: '4.1'
    text: |-
      De Bank heeft tot taak het bevorderen van de goede werking van het betalingsverkeer in de openbare lichamen.
      De goede werking van het betalingsverkeer omvat mede de geldomloop van de in [artikel 3][ref1] bedoelde
      dollarbiljetten en dollarmunten.


      [ref1]: https://wetten.overheid.nl/BWBR0028551#Artikel3
    url: https://wetten.overheid.nl/BWBR0028551/2012-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0028551
        artikel: '3'
        paragraaf: '1'
  - number: '4.2'
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot de in het eerste lid
      bedoelde taak.
    url: https://wetten.overheid.nl/BWBR0028551/2012-07-01#Artikel4
  - number: '5.1'
    text: Niemand is verplicht om voor één betaling meer dan vijftig dollarmunten te aanvaarden.
    url: https://wetten.overheid.nl/BWBR0028551/2012-07-01#Artikel5
  - number: '5.2'
    text: |-
      De Bank kan in de openbare lichamen kantoren aanwijzen waar, met inachtneming van daartoe door de Bank gestelde
      regels, dollarmunten kunnen worden verwisseld voor dollarbiljetten.
    url: https://wetten.overheid.nl/BWBR0028551/2012-07-01#Artikel5
  - number: '6.1'
    text: Niemand is verplicht om valse of vervalste dollarbiljetten of dollarmunten aan te nemen.
    url: https://wetten.overheid.nl/BWBR0028551/2012-07-01#Artikel6
  - number: '6.2'
    text: |-
      Ondernemingen of instellingen die in de openbare lichamen het bedrijf van kredietinstelling uitoefenen of in de
      uitoefening van een ander bedrijf deelnemen aan de verwerking en verstrekking aan het publiek van dollarbiljetten
      of dollarmunten, zijn verplicht alle door hen ontvangen dollarbiljetten en dollarmunten waarvan zij weten of
      vermoeden dat deze vals of vervalst zijn, uit omloop te nemen en in te leveren bij een daartoe bij besluit van Onze
      Minister van Financiën aangewezen instantie.
    url: https://wetten.overheid.nl/BWBR0028551/2012-07-01#Artikel6
  - number: '6.3'
    text: |-
      Indien dollarbiljetten of dollarmunten niet vals of vervalst blijken te zijn, worden zij teruggegeven in de staat
      waarin zij zijn ontvangen, of wordt daarvan de nominale waarde vergoed. Voor valse of vervalste dollarbiljetten en
      dollarmunten wordt geen vergoeding verstrekt.
    url: https://wetten.overheid.nl/BWBR0028551/2012-07-01#Artikel6
  - number: '7.1'
    text: Niemand is verplicht om geschonden dollarbiljetten of dollarmunten aan te nemen.
    url: https://wetten.overheid.nl/BWBR0028551/2012-07-01#Artikel7
  - number: '7.2'
    text: |-
      Onder geschonden dollarbiljetten en dollarmunten worden niet verstaan kennelijk in het gebruik gekreukte, vervuilde
      of beschadigde dollarbiljetten waarvan de volledige opdruk nog duidelijk te onderscheiden is, en dollarmunten die
      uitsluitend door slijtage in gewicht zijn verminderd.
    url: https://wetten.overheid.nl/BWBR0028551/2012-07-01#Artikel7
  - number: '7.3'
    text: |-
      De Bank kan in de openbare lichamen kantoren aanwijzen waar, met inachtneming van de ter zake door de bevoegde
      autoriteiten van de Verenigde Staten van Amerika gehanteerde regels of richtlijnen, geschonden dollarbiljetten of
      dollarmunten ter verwisseling of vergoeding kunnen worden aangeboden.
    url: https://wetten.overheid.nl/BWBR0028551/2012-07-01#Artikel7
  - number: '8'
    text: 'De omrekenkoers voor de overgang van de Nederlands-Antilliaanse gulden naar de dollar is: NAf. 1,790 = USD 1,00.'
    url: https://wetten.overheid.nl/BWBR0028551/2012-07-01#Artikel8
  - number: '9.1'
    text: |-
      Alle bij een onderneming of instelling die in de openbare lichamen het bedrijf van kredietinstelling uitoefent
      aangehouden tegoeden, in de vorm van giraal geld of anderszins, luiden met ingang van het tijdstip van
      inwerkingtreding van deze wet in dollars, overeenkomstig de in [artikel 8][ref1] vastgestelde omrekenkoers.


      [ref1]: https://wetten.overheid.nl/BWBR0028551#Artikel8
    url: https://wetten.overheid.nl/BWBR0028551/2012-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0028551
        artikel: '8'
        paragraaf: '2'
  - number: '9.2'
    text: |-
      Het eerste lid is niet van toepassing op tegoeden, aangehouden in andere munteenheden dan de Nederlands-
      Antilliaanse gulden.
    url: https://wetten.overheid.nl/BWBR0028551/2012-07-01#Artikel9
  - number: '10.1'
    text: |-
      Na de inwerkingtreding van deze wet gelden verwijzingen naar Nederlands-Antilliaanse guldens, opgenomen in
      bestaande rechtsinstrumenten, als verwijzingen naar de dollar, overeenkomstig de in [artikel 8][ref1] vastgestelde
      omrekenkoers.


      [ref1]: https://wetten.overheid.nl/BWBR0028551#Artikel8
    url: https://wetten.overheid.nl/BWBR0028551/2012-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0028551
        artikel: '8'
        paragraaf: '2'
  - number: '10.2'
    text: |-
      Onder bestaande rechtsinstrumenten als bedoeld in het eerste lid worden, voor zover op die instrumenten het
      recht van de openbare lichamen van toepassing is, verstaan: alle op het tijdstip van inwerkingtreding van deze
      wet geldende wettelijke voorschriften, besluiten van bestuursorganen, rechterlijke uitspraken, overeenkomsten,
      eenzijdige rechtsakten, betaalmiddelen anders dan bankbiljetten en munten, alsmede andere op rechtsgevolg gerichte
      instrumenten.
    url: https://wetten.overheid.nl/BWBR0028551/2012-07-01#Artikel10
  - number: '10.3'
    text: |-
      Het eerste lid is niet van toepassing, voor zover uit de aard of strekking van een rechtsinstrument anders
      voortvloeit. Voorts is het eerste lid niet van toepassing op overeenkomsten ten aanzien waarvan de betrokken
      partijen uitdrukkelijk anders zijn overeengekomen.
    url: https://wetten.overheid.nl/BWBR0028551/2012-07-01#Artikel10
  - number: '11.1'
    text: |-
      Voor de toepassing van de [artikelen 9][ref1] en [10][ref2] worden de overeenkomstig [artikel 8][ref3] omgerekende
      bedragen rekenkundig afgerond op de dichtstbijzijnde dollarcent. Halve centen worden naar boven afgerond.


      [ref1]: https://wetten.overheid.nl/BWBR0028551#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0028551#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0028551#Artikel8
    url: https://wetten.overheid.nl/BWBR0028551/2012-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0028551
        artikel: '9'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0028551
        artikel: '10'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0028551
        artikel: '8'
        paragraaf: '2'
  - number: '11.2'
    text: |-
      Indien het oorspronkelijke bedrag in meer dan twee decimalen was gesteld, geschiedt de afronding met inachtneming
      van het oorspronkelijke aantal decimalen. De afrondingsregel voor halve centen is in dat geval van overeenkomstige
      toepassing op de laatste decimaal.
    url: https://wetten.overheid.nl/BWBR0028551/2012-07-01#Artikel11
  - number: '12'
    text: |-
      De in Nederlands-Antilliaanse guldens luidende bankbiljetten en munten die op het tijdstip van inwerkingtreding van
      deze wet in omloop waren als wettig betaalmiddel, behouden tot en met de laatste dag van de eerste kalendermaand na
      inwerkingtreding van deze wet de hoedanigheid van wettig betaalmiddel in de openbare lichamen.
    url: https://wetten.overheid.nl/BWBR0028551/2012-07-01#Artikel12
  - number: '13.1'
    text: |-
      Bij besluit van de Bank worden in de openbare lichamen kantoren aangewezen waar tot een bij koninklijk
      besluit te bepalen tijdstip, dat voor bankbiljetten en munten verschillend kan worden vastgesteld, Nederlands-
      Antilliaanse munten en bankbiljetten kosteloos kunnen worden verwisseld voor wettig betaalmiddel als bedoeld in
      [artikel 3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028551#Artikel3
    url: https://wetten.overheid.nl/BWBR0028551/2012-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0028551
        artikel: '3'
        paragraaf: '1'
  - number: '13.2'
    text: |-
      De Bank kan nadere regels stellen betreffende de in het eerste lid bedoelde verwisseling van Nederlands-
      Antilliaanse munten en bankbiljetten.
    url: https://wetten.overheid.nl/BWBR0028551/2012-07-01#Artikel13
  - number: 13a
    text: 'In deze paragraaf wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0028551/2012-07-01#Artikel13a
  - number: 13a.a
    text: |-
      *tijdstip van transitie:* het tijdstip waarop
      __REF000___________________________________________________________________________________________________________
      _____ in werking treedt;


      [ref1]: https://wetten.overheid.nl/BWBR0028249#ArtikelI
    url: https://wetten.overheid.nl/BWBR0028551/2012-07-01#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0028249
        artikel: I
  - number: 13a.b
    text: '*overgangsperiode:* de periode vanaf het tijdstip van transitie tot 1 januari 2011.'
    url: https://wetten.overheid.nl/BWBR0028551/2012-07-01#Artikel13a
  - number: 13b.1
    text: |-
      Voor zover een belastingplichtige of inhoudingsplichtige op het tijdstip dat onmiddellijk voorafgaat aan het
      tijdstip van transitie rechten en verplichtingen heeft, ingevolge:
