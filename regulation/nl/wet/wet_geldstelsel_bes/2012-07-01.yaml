    url: https://wetten.overheid.nl/BWBR0028551/2012-07-01#Artikel13b
  - number: 13b.1.n
    text: de Regeling bijzonder invoerrecht op benzine Bovenwindse Eilanden;
    url: https://wetten.overheid.nl/BWBR0028551/2012-07-01#Artikel13b
  - number: 13b.1.o
    text: de Landsverordening ter bevordering bedrijfsvestiging en hotelbouw;
    url: https://wetten.overheid.nl/BWBR0028551/2012-07-01#Artikel13b
