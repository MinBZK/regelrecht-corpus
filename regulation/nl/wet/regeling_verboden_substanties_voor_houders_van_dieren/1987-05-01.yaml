preamble:
  text: |-
    Gelet op artikel 44 van de Diergeneesmiddelenwet (Stb. 1985, 410):

    Gehoord de Vereniging van Fabrikanten en Groothandelaren in Veterinaire Produkten (Fagrovet), de Dibevo, de
    Vereniging van Fabrikanten en Importeurs van Diergeneesmiddelen in Nederland (Fidin) en het Landbouwschap;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0004151/1987-05-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:


              *wet:*


              [Diergeneesmiddelenwet][ref1] (Stb. 1985, 410);


      [ref1]: https://wetten.overheid.nl/BWBR0003818
    url: https://wetten.overheid.nl/BWBR0004151/1987-05-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003818
  - number: '2'
    text: |-
      Als substanties, bedoeld in [artikel 44 van de wet][ref1], welke degene die bedrijfsmatig dieren houdt niet
      voorhanden of in voorraad mag hebben, worden aangewezen:


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel44
    url: https://wetten.overheid.nl/BWBR0004151/1987-05-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '44'
  - number: 2.a
    text: stilbenen, stilbeenderivaten, zouten en esters daarvan;
    url: https://wetten.overheid.nl/BWBR0004151/1987-05-01#Artikel2
  - number: 2.b
    text: thyreostatica;
    url: https://wetten.overheid.nl/BWBR0004151/1987-05-01#Artikel2
  - number: 2.c
    text: langs biotechnische weg bereide somatotropines;
    url: https://wetten.overheid.nl/BWBR0004151/1987-05-01#Artikel2
  - number: 2.d
    text: |-
      substanties die kunnen worden gebruikt voor de bereiding van diergeneesmiddelen welke zijn aangewezen ingevolge
      [artikel 29 van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel29
    url: https://wetten.overheid.nl/BWBR0004151/1987-05-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '29'
  - number: '3.1'
    text: Deze regeling treedt in werking op 1 mei 1987.
    url: https://wetten.overheid.nl/BWBR0004151/1987-05-01#Artikel3
  - number: '3.2'
    text: 'Deze regeling kan worden aangehaald als: Regeling verboden substanties voor houders van dieren.'
    url: https://wetten.overheid.nl/BWBR0004151/1987-05-01#Artikel3
