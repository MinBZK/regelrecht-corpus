preamble:
  text: |-
    Gelet op artikel 45 van de Diergeneesmiddelenwet (Stb. 1985, 410);

    Gehoord de Koninklijke Nederlandse Maatschappij voor Diergeneeskunde, de Vereniging van Fabrikanten en Importeurs
    van Diergeneesmiddelen in Nederland (Fidin), de Vereniging van Fabrikanten en Groothandelaren in Veterinaire
    Producten (Fagrovet), de Dibevo, de Nehoma, Produktschap voor Vee en Vlees en het Landbouwschap;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0005605/2001-12-19#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:




              *wet:*


              [Diergeneesmiddelenwet][ref1] (Stb. 1985, 410);




              *diergeneesmiddelen:*


              andere diergeneesmiddelen dan sera, entstoffen en biologische diagnostica;




              *richtlijn nr. 2001/82/EG:*


              [richtlijn nr. 2001/82/EG](32001L0082) van het Europees Parlement en de Raad van de Europese Unie van
      6 november 2001 tot vaststelling van een communautair wetboek betreffende geneesmiddelen voor diergeneeskundig
      gebruik (PbEG L 311).


      [ref1]: https://wetten.overheid.nl/BWBR0003818
    url: https://wetten.overheid.nl/BWBR0005605/2001-12-19#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003818
  - number: '2'
    text: |-
      Aan dierenartsen bedoeld in de Regeling toelating onderdanen EEG-lidstaten (Stcrt. 1991, 220) wordt, met
      inachtneming van het bepaalde in de [artikelen 3][ref1] tot en met [7][ref2], vrijstelling verleend van het in
      [artikel 2, eerste lid, van de wet][ref3] gestelde verbod tot het voorhanden hebben, afleveren of toepassen van
      niet geregistreerde diergeneesmiddelen.


      [ref1]: https://wetten.overheid.nl/BWBR0005605#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005605#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0003818#Artikel2
    url: https://wetten.overheid.nl/BWBR0005605/2001-12-19#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005605
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0005605
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0003818
        artikel: '2'
  - number: '3'
    text: |-
      Het is de in [artikel 2][ref1] bedoelde dierenarts slechts toegestaan een niet in Nederland geregistreerd
      diergeneesmiddel voorhanden te hebben, af te leveren of toe te passen, onverminderd het bepaalde in
      [artikel 6][ref2], indien:

      a. het betrokken diergeneesmiddel in de Lid-Staat alwaar de dierenarts als zodanig is gevestigd, officieel
      overeenkomstig de bepalingen van [richtlijn nr. 2001/82/EG](32001L0082) is toegelaten en het diergeneesmiddel
      uitsluitend wordt toegepast onder de voorwaarden waaronder die toelating is verleend;

      b. de betrokken hoeveelheid van het diergemeesmiddel de normale dagelijkse behoefte voor de uitoefening van de
      diergeneeskunde volgens goed veterinair gebruik door een dierenarts niet overschrijdt, en

      c. in het geval dat hij het diergeneesmiddel toepast bij dieren die plegen te worden geconsumeerd, hij kan aantonen
      dat het betrokken diergeneesmiddel kwalitatief en kwantitatief hetzelfde of dezelfde werkzame bestanddelen bevat
      als een hier in Nederland voor eenzelfde therapeutisch doel geregistreerd diergeneesmiddel.


      [ref1]: https://wetten.overheid.nl/BWBR0005605#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005605#Artikel6
    url: https://wetten.overheid.nl/BWBR0005605/2001-12-19#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005605
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0005605
        artikel: '6'
  - number: '4'
    text: |-
      Het is de in [artikel 2][ref1] bedoelde dierenarts slechts toegestaan een in [artikel 3][ref2] bedoelde
      diergeneesmiddel voorhanden te hebben of te vervoeren indien:

      a. dit diergeneesmiddel zich bevindt in de oorspronkelijke recipiënt en buitenverpakking van degene, door wie het
      is bereid, en

      b. de aard en de hoeveelheid van het vervoerde diergeneesmiddel is afgestemd op de normale dagelijkse behoefte
      volgens goed veterinair gebruik voor de dieren waarvoor zijn hulp is ingeroepen.


      [ref1]: https://wetten.overheid.nl/BWBR0005605#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005605#Artikel3
    url: https://wetten.overheid.nl/BWBR0005605/2001-12-19#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005605
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0005605
        artikel: '3'
  - number: '5'
    text: |-
      De in [artikel 2][ref1] bedoelde dierenarts is verplicht, indien hij een in [artikel 3][ref2] bedoeld
      diergeneesmiddel heeft afgeleverd of toegepast, aan de houder van het dier schriftelijk de wachttermijn
      mede te delen die vermeld wordt op het etiket of de bijsluiter van het betrokken diergeneesmiddel, tenzij
      hij redelijkerwijs geacht kan worden te weten, dat in Nederland een andere wachttermijn voor een dergelijk
      diergeneesmiddel in acht moet worden genomen, in welk geval hij verplicht is deze aan de houder van het dier mede
      te delen.


      [ref1]: https://wetten.overheid.nl/BWBR0005605#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005605#Artikel3
    url: https://wetten.overheid.nl/BWBR0005605/2001-12-19#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005605
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0005605
        artikel: '3'
  - number: '6'
    text: |-
      Het is de dierenarts bedoeld in [artikel 2][ref1] slechts toegestaan, onverminderd het bepaalde in
      [artikel 3 van de Kanalisatieregeling diergeneesmiddelen en gemedicineerde voeders][ref2] (Stcrt. 1986, 187), een
      in [artikel 3][ref3] bedoeld diergeneesmiddel aan de houder van dieren af te leveren, indien hij het dier of de
      dieren waarvoor het diergeneesmiddel is bestemd onder zijn behandeling heeft en deze heeft onderzocht in welk geval
      de af te leveren hoeveelheid, behoudens toestemming van de Minister van Landbouw, Natuurbeheer en Visserij, de
      benodigde hoeveelheid voor een behandeling zich uitstrekkend over ten hoogste drie dagen, niet mag overschrijden.


      [ref1]: https://wetten.overheid.nl/BWBR0005605#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0004033#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0005605#Artikel3
    url: https://wetten.overheid.nl/BWBR0005605/2001-12-19#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005605
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0004033
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0005605
        artikel: '3'
  - number: '7'
    text: |-
      1 De in [artikel 2][ref1] bedoelde dierenarts is verplicht in het geval door hem een diergeneesmiddel is toegepast
      of afgeleverd een nauwkeurige administratie bij te houden van:

      a. het toegepaste en afgeleverde diergeneesmiddel alsmede de voorgeschreven dosis;

      b. naam en adres van de houder van de dieren;

      c. de behandelde dieren;

      d. de gestelde diagnose;

      e. de duur van de behandeling en de door hem opgegeven wachttermijn, indien voor het betrokken diergeneesmiddel een
      wachttermijn in acht moet worden genomen.

      2 De in [artikel 2][ref2] bedoelde dierenarts is verplicht de in het eerste lid
      bedoelde gegevens tenminste drie jaar te bewaren en op eerste afroep aan de ingevolge
      [artikel 17, eerste lid, onderdeel 2, van de Wet op de economische delicten][ref3] met de opsporing belaste
      personen, te tonen.


      [ref1]: https://wetten.overheid.nl/BWBR0005605#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005605#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0002063#Artikel17
    url: https://wetten.overheid.nl/BWBR0005605/2001-12-19#Artikel7
    references:
