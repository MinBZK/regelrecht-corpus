        artikel: '17'
  - number: '8'
    text: |-
      Deze regeling treedt in werking met ingang van de dertigste dag volgend op die van haar bekendmaking in de
      Staatscourant.
    url: https://wetten.overheid.nl/BWBR0005605/2001-12-19#Artikel8
  - number: '9'
    text: 'Deze regeling kan worden aangehaald als: Vrijstellingsregeling diergeneesmiddelen voor EEG-dierenartsen.'
    url: https://wetten.overheid.nl/BWBR0005605/2001-12-19#Artikel9
