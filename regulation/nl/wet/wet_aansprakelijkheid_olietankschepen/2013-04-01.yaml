$id: wet_aansprakelijkheid_olietankschepen
regulatory_layer: WET
publication_date: '2023-05-10'
valid_from: '2013-04-01'
bwb_id: BWBR0002976
url: https://wetten.overheid.nl/BWBR0002976/2013-04-01
preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is, in verband met de bekrachtiging van het op 29 november
    1969 te Brussel tot stand gekomen Internationaal Verdrag inzake de wettelijke aansprakelijkheid voor schade door
    verontreiniging door olie (Trb. 1970, 196) regelen vast te stellen tot uitvoering van dat Verdrag en, in afwachting
    van de inwerkingtreding van dat Verdrag, reeds in overeenstemming daarmede regelen vast te stellen betreffende
    de wettelijke aansprakelijkheid voor schade door verontreiniging door olie afkomstig van olietankschepen en
    betreffende daarmede samenhangende onderwerpen:

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002976/2013-04-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'Voor de toepassing van het bij of krachtens deze wet bepaalde wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0002976/2013-04-01#Artikel1
  - number: 1.a
    text: '"Onze Minister": Onze Minister van Verkeer en Waterstaat;'
    url: https://wetten.overheid.nl/BWBR0002976/2013-04-01#Artikel1
  - number: 1.b
    text: |-
      «Verdrag»: het op 27 november 1992 te Londen tot stand gekomen Internationaal Verdrag inzake de wettelijke
      aansprakelijkheid voor schade door verontreiniging door olie 1992, met Bijlage (*Trb*. 1994, 229);
    url: https://wetten.overheid.nl/BWBR0002976/2013-04-01#Artikel1
  - number: 1.c
    text: |-
      «schip»: alle zeeschepen en andere zeegaande vaartuigen, van welk type ook, gebouwd of aangepast voor het vervoer
      van olie in bulk als lading, met uitzondering van oorlogsschepen of andere schepen in eigendom van of geëxploiteerd
      door een Staat ten tijde dat zij uitsluitend worden gebruikt in dienst van de overheid voor andere dan
      handelsdoeleinden, en met dien verstande dat een schip dat olie en andere soorten lading kan vervoeren alleen als
      een schip wordt beschouwd, wanneer het daadwerkelijk olie in bulk als lading vervoert en tijdens iedere reis na een
      zodanig vervoer, tenzij wordt aangetoond dat het geen residuen van zulk vervoer van olie in bulk aan boord heeft.
    url: https://wetten.overheid.nl/BWBR0002976/2013-04-01#Artikel1
  - number: 1.d
    text: '"persoon": een natuurlijke persoon of een privaatrechtelijke of publiekrechtelijke rechtspersoon;'
    url: https://wetten.overheid.nl/BWBR0002976/2013-04-01#Artikel1
  - number: 1.e
    text: |-
      "eigenaar": degene die in de registratie voor schepen, bedoeld in [artikel 85 van de Kadasterwet][ref1],
      als eigenaar staat vermeld dan wel in een buitenlands register waarin het schip teboekstaat als eigenaar
      staat ingeschreven, of, indien het schip niet te boek staat in de openbare registers, bedoeld in
      [afdeling 2 van titel 1 van Boek 3 van het Burgerlijk Wetboek][ref2] dan wel een soortgelijk buitenlands register,
      degene die het schip in eigendom heeft. Is een schip eigendom van een Staat en wordt het geëxploiteerd of gereed
      door een persoon, die in die Staat als exploitant of reder van dat schip is ingeschreven, dan wordt die persoon als
      eigenaar van het schip beschouwd;


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel85
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Afdeling2
    url: https://wetten.overheid.nl/BWBR0002976/2013-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '85'
      - id: ref2
        bwb_id: BWBR0005291
        afdeling: '2'
  - number: 1.f
    text: |-
      «olie»: ruwe olie, stookolie, zware dieselolie, smeerolie, alsmede zonodig bij algemene maatregel van bestuur nader
      te omschrijven andere persistente, uit koolwaterstoffen bestaande minerale oliën.
    url: https://wetten.overheid.nl/BWBR0002976/2013-04-01#Artikel1
  - number: 1.g
    text: '«schade door verontreiniging»:'
    url: https://wetten.overheid.nl/BWBR0002976/2013-04-01#Artikel1
  - number: 1.g.a
    text: |-
      verlies of schade buiten het schip in Nederland, de territoriale zee daaronder begrepen, en in de Nederlandse
      exclusieve economische zone (EEZ) of, zolang een zodanige zone niet is ingesteld, binnen een gebied buiten en
      grenzend aan de territoriale zee, waarvan de buitengrenzen samenvallen met die van het aan Nederland toekomende
      gedeelte van het continentaal plat, toegebracht door bevuiling als gevolg van het ontsnappen of lozen van olie uit
      het schip, waar zulk ontsnappen of lozen ook heeft plaatsgevonden, met dien verstande dat vergoeding voor andere
      schade aan het milieu dan winstderving ten gevolge van deze schade wordt beperkt tot de kosten van redelijke
      maatregelen tot herstel die daadwerkelijk worden ondernomen of zullen worden ondernomen;
    url: https://wetten.overheid.nl/BWBR0002976/2013-04-01#Artikel1
  - number: 1.g.b
    text: de kosten van preventieve maatregelen alsmede verlies of schade veroorzaakt door die maatregelen.
    url: https://wetten.overheid.nl/BWBR0002976/2013-04-01#Artikel1
  - number: 1.h
    text: |-
      "preventieve maatregelen": na een voorval genomen redelijke maatregelen ter voorkoming of beperking van schade
      door verontreiniging;
    url: https://wetten.overheid.nl/BWBR0002976/2013-04-01#Artikel1
  - number: 1.i
    text: |-
      «voorval»: feit of opeenvolging van feiten met eenzelfde oorzaak, waardoor schade door verontreiniging wordt
      veroorzaakt, of waardoor een ernstige en onmiddellijke dreiging ontstaat dat zulk een schade zal worden
      veroorzaakt.
    url: https://wetten.overheid.nl/BWBR0002976/2013-04-01#Artikel1
  - number: 1.j
    text: |-
      "ton": behoudens in [artikel 4][ref1]: een gewichtseenheid van 1000 kilogram.


      [ref1]: https://wetten.overheid.nl/BWBR0002976#Artikel4
    url: https://wetten.overheid.nl/BWBR0002976/2013-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002976
        artikel: '4'
        hoofdstuk: II
  - number: '2'
    text: |-
      Deze wet is mede van toepassing op aansprakelijkheid wegens voorvallen ten tijde dat het schip, in verband
      met het vervoer, zich bevindt op een laad- of losplaats, in een haven of op een binnenwater in Nederland en op
      de verplichting tot het instandhouden van een verzekering of andere financiële zekerheid ter dekking van deze
      aansprakelijkheid.
    url: https://wetten.overheid.nl/BWBR0002976/2013-04-01#Artikel2
  - number: '3.1'
    text: |-
      De eigenaar van het schip op het tijdstip van het voorval of, zo dit bestaat uit een opeenvolging van feiten, op
      het tijdstip van het eerste feit, is aansprakelijk voor schade door verontreiniging, veroorzaakt door het schip als
      gevolg van het voorval.
    url: https://wetten.overheid.nl/BWBR0002976/2013-04-01#Artikel3
  - number: '3.2'
    text: |-
      De eigenaar is niet aansprakelijk indien hij bewijst dat de schade - werd veroorzaakt door oorlogshandeling,
      vijandelijkheden, burgeroorlog, opstand of een natuurverschijnsel van een uitzonderlijke, onvermijdelijke en
      onweerstaanbare aard, of
        - geheel en al werd veroorzaakt door een handelen of nalaten van derden, met het opzet schade te veroorzaken, of
        - geheel en al werd veroorzaakt door schuldig handelen of nalaten van een regering of andere autoriteit,
      verantwoordelijk voor het onderhouden van lichten of andere hulpmiddelen bij de navigatie, in de uitoefening van
      die taak.
    url: https://wetten.overheid.nl/BWBR0002976/2013-04-01#Artikel3
  - number: '3.3'
    text: |-
      Indien de eigenaar bewijst dat de schade door verontreiniging geheel of gedeeltelijk het gevolg is van een handelen
      of nalaten van de persoon die de schade heeft geleden, met het opzet schade te veroorzaken of van de schuld van die
      persoon, kan hij geheel of gedeeltelijk worden ontheven van zijn aansprakelijkheid tegenover die persoon.
    url: https://wetten.overheid.nl/BWBR0002976/2013-04-01#Artikel3
  - number: '3.4'
    text: Voor schade door verontreiniging kan de eigenaar niet uit anderen hoofde worden aangesproken.
    url: https://wetten.overheid.nl/BWBR0002976/2013-04-01#Artikel3
  - number: '3.5'
    text: |-
      Voor schade door verontreiniging kunnen, onverminderd het bepaalde in het zesde lid van dit artikel, noch uit
      hoofde van deze wet noch uit anderen hoofde worden aangesproken:
    url: https://wetten.overheid.nl/BWBR0002976/2013-04-01#Artikel3
  - number: 3.5.a
    text: de ondergeschikten, vertegenwoordigers of lasthebbers van de eigenaar of de leden van de bemanning;
    url: https://wetten.overheid.nl/BWBR0002976/2013-04-01#Artikel3
  - number: 3.5.b
    text: de loods of enige andere persoon die, zonder lid van de bemanning te zijn, diensten voor het schip verricht;
    url: https://wetten.overheid.nl/BWBR0002976/2013-04-01#Artikel3
  - number: 3.5.c
    text: |-
      een bevrachter (hoe ook omschreven, met inbegrip van een rompbevrachter), beheerder of degene in wiens handen de
      exploitatie van het schip is gelegd;
    url: https://wetten.overheid.nl/BWBR0002976/2013-04-01#Artikel3
  - number: 3.5.d
    text: |-
      personen die met instemming van de eigenaar of in opdracht van een bevoegde overheidsinstantie
      hulpverleningswerkzaamheden verrichten;
    url: https://wetten.overheid.nl/BWBR0002976/2013-04-01#Artikel3
  - number: 3.5.e
    text: personen die preventieve maatregelen nemen;
    url: https://wetten.overheid.nl/BWBR0002976/2013-04-01#Artikel3
  - number: 3.5.f
    text: alle ondergeschikten, vertegenwoordigers of lasthebbers van personen genoemd onder *b*, *c*, *d* en *e*;
    url: https://wetten.overheid.nl/BWBR0002976/2013-04-01#Artikel3
  - number: '3.6'
    text: |-
      De eigenaar heeft een recht van verhaal op derden die voor de schade uit anderen hoofde, anders dan uit
      overeenkomst, jegens de benadeelden aansprakelijk zijn. Voor zover niet anders is overeengekomen, heeft hij op
      de in het vijfde lid genoemde, van aansprakelijkheid vrijgestelde, personen echter geen recht van verhaal, tenzij
      de schade het gevolg is van hun persoonlijk handelen of nalaten, begaan hetzij met het opzet zodanige schade te
      veroorzaken, hetzij roekeloos en in de wetenschap dat zodanige schade er waarschijnlijk uit zou voortvloeien.
    url: https://wetten.overheid.nl/BWBR0002976/2013-04-01#Artikel3
  - number: 3a
    text: |-
      Wanneer zich een voorval voordoet waarbij twee of meer schepen zijn betrokken en er ten gevolge daarvan
      schade door verontreiniging is ontstaan, zijn de eigenaren van alle daarbij betrokken schepen, tenzij zij
      ingevolge [artikel 3][ref1] van aansprakelijkheid zijn ontheven, hoofdelijk aansprakelijk voor alle schade
      die redelijkerwijs niet te scheiden is. Op de onderlinge verhouding van de eigenaren van de betrokken schepen
      is [artikel 545, derde lid, laatste volzin, van Boek 8 van het Burgerlijk Wetboek][ref2] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002976#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel545
    url: https://wetten.overheid.nl/BWBR0002976/2013-04-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0002976
        artikel: '3'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '545'
  - number: '4.1'
    text: |-
      De eigenaar kan zijn aansprakelijkheid per voorval beperken tot het bedrag, bepaald in artikel V van het Verdrag,
      behoudens wijziging door de bijzondere amenderingsprocedure voorzien in artikel 15 van het Verdrag.
    url: https://wetten.overheid.nl/BWBR0002976/2013-04-01#Artikel4
  - number: '4.2'
    text: |-
      De eigenaar kan zijn aansprakelijkheid niet overeenkomstig het voorgaande lid beperken, indien wordt bewezen
      dat de schade door verontreiniging het gevolg is van zijn persoonlijk handelen of nalaten, hetzij met het opzet
      zodanige schade te veroorzaken, hetzij roekeloos en in de wetenschap dat zodanige schade er waarschijnlijk uit
      zou voortvloeien.
    url: https://wetten.overheid.nl/BWBR0002976/2013-04-01#Artikel4
  - number: '5.1'
    text: |-
      Ten einde zich te kunnen beroepen op de in [artikel 4][ref1] bedoelde beperking van aansprakelijkheid moet de
      eigenaar een fonds vormen bij de in [artikel 9, eerste lid][ref2], bedoelde rechtbank, tot een bedrag gelijk
      aan het maximum van zijn aansprakelijkheid. Het fonds kan worden gevormd door het storten van een geldsom of het
      stellen van een door de rechtbank goed te keuren bankgarantie of andere financiële zekerheid.


      [ref1]: https://wetten.overheid.nl/BWBR0002976#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0002976#Artikel9
    url: https://wetten.overheid.nl/BWBR0002976/2013-04-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002976
        artikel: '4'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0002976
        artikel: '9'
        hoofdstuk: III
  - number: '5.2'
    text: |-
      Heeft de eigenaar een fonds gevormd en is hij gerechtigd zijn aansprakelijkheid te beperken, dan is terzake van
      vorderingen tot vergoeding van schade door verontreiniging gegrond op dat voorval, geen verhaal meer mogelijk op
      andere goederen van de eigenaar, indien het fonds werkelijk beschikbaar is tot voldoening van die vorderingen.
    url: https://wetten.overheid.nl/BWBR0002976/2013-04-01#Artikel5
  - number: '6'
    text: |-
      Indien vóór de verdeling van het fonds de eigenaar, een van zijn ondergeschikten of vertegenwoordigers, een
      verzekeraar of andere persoon die financiële zekerheid heeft gesteld voor de aansprakelijkheid van de eigenaar,
      of enige andere persoon die er belang bij had de schuld van de eigenaar te voldoen, in verband met het voorval een
      vergoeding terzake van schade door verontreiniging heeft betaald, dan treedt hij bij wege van subrogatie, tot het
      bedrag dat hij heeft betaald, in de rechten die de door hem schadeloos gestelde persoon op grond van deze wet zou
      hebben gehad.
    url: https://wetten.overheid.nl/BWBR0002976/2013-04-01#Artikel6
  - number: '7.1'
    text: |-
      Vorderingen tot vergoeding van schade door verontreiniging kunnen rechtstreeks worden ingesteld tegen de
      verzekeraar of andere persoon die financiële zekerheid heeft gesteld voor de aansprakelijkheid van de eigenaar.
      In dit geval kan de verweerder, zelfs indien de eigenaar op grond van het [tweede lid van artikel 4][ref1] niet
      gerechtigd is zijn aansprakelijkheid te beperken, zich beroepen op de in [artikel 4][ref2] bedoelde beperking van
      aansprakelijkheid.


      [ref1]: https://wetten.overheid.nl/BWBR0002976#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0002976#Artikel4
    url: https://wetten.overheid.nl/BWBR0002976/2013-04-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002976
        artikel: '4'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0002976
        artikel: '4'
        hoofdstuk: II
  - number: '7.2'
    text: |-
      De verweerder komen alle verweermiddelen toe welke de eigenaar tegen de vorderingen zou hebben kunnen aanvoeren,
      doch hij kan geen beroep doen op de omstandigheid dat de eigenaar surséance van betaling is verleend, dat ten
      aanzien van hem de schuldsaneringsregeling natuurlijke personen van toepassing is of dat deze zich in staat van
      faillissement of vereffening bevindt. Hij kan zich voorts verweren met een beroep op het feit, dat de schade door
      verontreiniging is veroorzaakt door opzettelijk wangedrag van de eigenaar zelf, doch andere verweermiddelen welke
      hij zou hebben kunnen aanvoeren tegen een door de eigenaar tegen hem ingestelde vordering komen hem niet toe.
    url: https://wetten.overheid.nl/BWBR0002976/2013-04-01#Artikel7
  - number: '7.3'
    text: De verweerder kan de eigenaar steeds in het geding roepen.
    url: https://wetten.overheid.nl/BWBR0002976/2013-04-01#Artikel7
  - number: '7.4'
    text: |-
      Een verzekeraar of andere persoon die financiële zekerheid heeft gesteld voor de aansprakelijkheid van de eigenaar
      kan in diens plaats in overeenstemming met het bepaalde in [artikel 5][ref1] een fonds vormen, zelfs indien de
      eigenaar op grond van het [tweede lid van artikel 4][ref2] niet gerechtigd is zijn aansprakelijkheid te beperken.
      De vorming van dit fonds heeft dezelfde rechtsgevolgen als de vorming van een fonds door de eigenaar, doch
      indien de eigenaar op grond van het [tweede lid van artikel 4][ref3] niet gerechtigd is zijn aansprakelijkheid
      te beperken, blijven de rechten van de schuldeisers, voor zover hun vorderingen niet uit het fonds zijn voldaan,
      tegenover hem onverlet en treden die rechtsgevolgen alleen in ten aanzien van degene die het fonds vormde.


      [ref1]: https://wetten.overheid.nl/BWBR0002976#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0002976#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0002976#Artikel4
    url: https://wetten.overheid.nl/BWBR0002976/2013-04-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002976
        artikel: '5'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0002976
        artikel: '4'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0002976
        artikel: '4'
        hoofdstuk: II
  - number: '8'
    text: |-
      Het recht op schadevergoeding uit hoofde van deze wet vervalt, wanneer niet binnen drie jaar na de datum waarop de
      schade is ontstaan een rechtsvordering ter zake is ingesteld, doch in ieder geval nadat zes jaar zijn verstreken na
      de datum van het voorval waaruit de schade is ontstaan. Indien het voorval bestond uit een opeenvolging van feiten
      met dezelfde oorzaak, loopt de termijn van zes jaren na de dag waarop het eerste dier feiten plaatsvond.
    url: https://wetten.overheid.nl/BWBR0002976/2013-04-01#Artikel8
  - number: 8a
    text: |-
      Tot de kennisneming in eerste aanleg van vorderingen tot vergoeding van schade door verontreiniging uit hoofde van
      het Verdrag en van deze wet is in Nederland bij uitsluiting bevoegd de rechtbank Rotterdam.
    url: https://wetten.overheid.nl/BWBR0002976/2013-04-01#Artikel8a
  - number: '9.1'
    text: |-
      Hij, die gebruik wenst te maken van de hem in [artikel 4][ref1] gegeven bevoegdheid tot beperking van zijn
      aansprakelijkheid, verzoekt de rechtbank Rotterdam, het bedrag waartoe zijn aansprakelijkheid is beperkt, vast te
      stellen en te bevelen, dat tot een procedure ter verdeling van dit bedrag zal worden overgegaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002976#Artikel4
    url: https://wetten.overheid.nl/BWBR0002976/2013-04-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002976
        artikel: '4'
        hoofdstuk: II
  - number: '9.2'
    text: |-
      Op het verzoek en de procedure ter verdeling zijn de [artikelen 642a, tweede tot en met vierde lid][ref1],
      [642b-d][ref2], [642e, eerste lid][ref3], [642f tot en met 642t, eerste lid][ref4], en
      [642u tot en met 642z van het Wetboek van Burgerlijke Rechtsvordering][ref5] van overeenkomstige toepassing, met
      dien verstande dat in het geval van artikel 642e, eerste lid, de rechter de opheffing van de gelegde conservatoire
      beslagen dan wel de teruggave van reeds gegeven zekerheid moet bevelen. Het fonds wordt verdeeld onder de
      schuldeisers in evenredigheid met de bedragen van hun erkende vorderingen. Indien het bedrag van alle vorderingen
      het door de rechtbank vastgestelde bedrag overtreft, worden de vorderingen in evenredigheid gekort.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel642
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel642b
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel642e
      [ref4]: https://wetten.overheid.nl/BWBR0001827#Artikel642f
      [ref5]: https://wetten.overheid.nl/BWBR0001827#Artikel642u
    url: https://wetten.overheid.nl/BWBR0002976/2013-04-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '642'
      - id: ref2
        bwb_id: BWBR0001827
        artikel: 642b
      - id: ref3
        bwb_id: BWBR0001827
        artikel: 642e
      - id: ref4
        bwb_id: BWBR0001827
        artikel: 642f
      - id: ref5
        bwb_id: BWBR0001827
        artikel: 642u
  - number: '9.3'
    text: |-
      De vorderingen van de eigenaar ter zake van door hem vrijwillig en binnen de grenzen der redelijkheid gedane
      uitgaven en gebrachte offers ter voorkoming of beperking van schade door verontreiniging staan in rang gelijk met
      andere vorderingen op het fonds.
    url: https://wetten.overheid.nl/BWBR0002976/2013-04-01#Artikel9
  - number: '9.4'
    text: |-
      De in [artikel 4][ref1] bedoelde rekeneenheid wordt omgerekend in Nederlands geld volgens de waarderingsmethode
      die door het Internationale Monetaire Fonds wordt toegepast voor zijn eigen verrichtingen en transacties op de dag,
      waarop de eigenaar voldoet aan een ingevolge [artikel 642c van het Wetboek van Burgerlijke Rechtsvordering][ref2]
      gegeven bevel tot storting of tot zekerheidstelling, en volgens de op die dag geldende koers.


      [ref1]: https://wetten.overheid.nl/BWBR0002976#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel642c
    url: https://wetten.overheid.nl/BWBR0002976/2013-04-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002976
        artikel: '4'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0001827
        artikel: 642c
  - number: '10.1'
    text: |-
      Is als gevolg van eenzelfde voorval schade door verontreiniging behalve in Nederland ook in een of meer andere
      bij het Verdrag partij zijnde Staten ontstaan, dan heeft de vorming van een fonds in die Staat of in een van die
      Staten overeenkomstig artikel V van het Verdrag in Nederland dezelfde rechtsgevolgen als de vorming van een fonds
      in Nederland, indien de schuldeiser toegang heeft tot de rechtbank die het fonds beheert en het fonds werkelijk
      beschikbaar is tot voldoening van zijn vordering.
    url: https://wetten.overheid.nl/BWBR0002976/2013-04-01#Artikel10
  - number: '10.2'
    text: |-
      Is in het geval bedoeld in het voorgaande lid het fonds in Nederland gevormd, dan is in eerste aanleg uitsluitend
      de in [artikel 9, eerste lid][ref1], bedoelde rechtbank bevoegd tot de kennisneming van verzoeken als bedoeld in
      [artikel 985 van het Wetboek van Burgerlijke Rechtsvordering][ref2] ten aanzien van rechterlijke beslissingen uit
      een andere bij het Verdrag partij zijnde Staat, waarbij vorderingen tot vergoeding van schade door verontreiniging
      zijn toegewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0002976#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel985
    url: https://wetten.overheid.nl/BWBR0002976/2013-04-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002976
        artikel: '9'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '985'
  - number: 10a
    text: |-
      De eigenaar kan zich overeenkomstig het bepaalde in [titel 7 van Boek 8 van het Burgerlijk Wetboek][ref1]
      en de [artikelen 642a-642z van het Wetboek van Burgerlijke Rechtsvordering][ref2] beroepen op beperking van
      aansprakelijkheid uit anderen hoofde voor vorderingen terzake van verlies of schade, buiten het schip buiten
      Nederland, de territoriale zee daaronder begrepen, buiten de Nederlandse exclusieve economische zone (EEZ) of,
      zolang een zodanige zone niet is ingesteld, buiten een gebied buiten en grenzend aan de territoriale zee, waarvan
      de buitengrenzen samenvallen met die van het aan Nederland toekomende gedeelte van het continentaal plat en niet
      in het gebied van een bij het Verdrag partij zijnde Staat toegebracht, door bevuiling door olie als gevolg van het
      ontsnappen of lozen van die olie uit het schip, daaronder begrepen de kosten van preventieve maatregelen en verlies
      of schade welke zijn veroorzaakt door deze maatregelen.


      [ref1]: https://wetten.overheid.nl/BWBR0005034
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel642a
    url: https://wetten.overheid.nl/BWBR0002976/2013-04-01#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0005034
      - id: ref2
        bwb_id: BWBR0001827
        artikel: 642a
  - number: '11'
    text: |-
      De eigenaar van een in Nederland teboekstaand schip is verplicht om ten tijde dat daarmee waar ter wereld ook meer
      dan 2000 ton olie in bulk als lading wordt vervoerd, een verzekering of andere financiële zekerheid in stand te
      houden ter dekking van zijn uit deze wet en uit het Verdrag voortvloeiende aansprakelijkheid, tot het in artikel 4,
      eerste lid, vermelde bedrag.
    url: https://wetten.overheid.nl/BWBR0002976/2013-04-01#Artikel11
  - number: '12'
    text: |-
      De eigenaar van een schip dat teboekstaat buiten Nederland of een andere dan de Nederlandse vlag voert, is,
      verplicht om, ten tijde dat dit schip meer dan 2000 ton olie in bulk als lading vervoert en een haven of laad-
      of losplaats in Nederland aanloopt of verlaat, of een Nederlands binnenwater bevaart, een verzekering of andere
      financiële zekerheid in stand te houden ter dekking van zijn uit deze wet en uit het Verdrag voortvloeiende
      aansprakelijkheid, tot het in [artikel 4, eerste lid, van deze wet][ref1] en in artikel V, eerste lid, van het
      Verdrag bedoelde bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0002976#Artikel4
    url: https://wetten.overheid.nl/BWBR0002976/2013-04-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002976
        artikel: '4'
        hoofdstuk: II
  - number: '13'
    text: |-
      De overeenkomst tot verstrekking van financiële zekerheid ten aanzien van een schip dat teboekstaat in Nederland of
      dat teboekstaat in een Staat die niet bij het Verdrag partij is, of de vlag voert van zulk een Staat, moet voldoen
      aan het volgende:
    url: https://wetten.overheid.nl/BWBR0002976/2013-04-01#Artikel13
  - number: 13.a
    text: |-
      de overeenkomst moet zijn aangegaan met een verzekeraar, een bank of een andere financiële instelling als bedoeld
      in [artikel 1:1 van de Wet op het financieel toezicht][ref1] of een andere persoon, van wie Onze Minister, na
      overleg met Onze Minister van Financiën, de financiële draagkracht tot het geven van dekking voor de uit deze wet
      en het Verdrag voortvloeiende aansprakelijkheid voldoende oordeelt;


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0002976/2013-04-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
  - number: 13.b
    text: |-
      de gelden uit de overeenkomst moeten, indien de verstrekker van financiële zekerheid buiten Nederland is gevestigd,
      ook werkelijk in Nederland ter beschikking kunnen komen;
    url: https://wetten.overheid.nl/BWBR0002976/2013-04-01#Artikel13
  - number: 13.c
    text: |-
      uit de overeenkomst moet blijken, dat de benadeelde, in overeenstemming met [artikel 7][ref1] van deze wet en
      met artikel VII, achtste lid, van het Verdrag, zijn vordering rechtstreeks tegen de verstrekker van financiële
      zekerheid kan instellen. Indien de overeenkomst een beding inhoudt dat de eigenaar zelf voor een deel in de
      vergoeding van de schade door verontreiniging zal bijdragen, moet uit de overeenkomst blijken, dat de verstrekker
      van financiële zekerheid niettemin jegens de benadeelde terzake van schade door verontreiniging gehouden blijft tot
      betaling ook van dat deel van de schadevergoeding;


      [ref1]: https://wetten.overheid.nl/BWBR0002976#Artikel7
    url: https://wetten.overheid.nl/BWBR0002976/2013-04-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002976
        artikel: '7'
        hoofdstuk: II
  - number: 13.d
    text: |-
      uit de overeenkomst moet blijken, dat de verstrekker van financiële zekerheid deze binnen de tijdsduur waarvoor het
      certificaat van [artikel 15][ref1] is afgegeven, niet eerder kan schorsen of beëindigen of zodanig wijzigen dat hij
      niet meer aan dit artikel voldoet, dan na verloop van drie maanden na de datum van ontvangst van een mededeling als
      bedoeld in [artikel 18, eerste lid][ref2]; tenzij het certificaat is ingeleverd of een nieuw is afgegeven vóór het
      verstrijken van de termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0002976#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002976#Artikel18
    url: https://wetten.overheid.nl/BWBR0002976/2013-04-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002976
        artikel: '15'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0002976
        artikel: '18'
        hoofdstuk: IV
  - number: '14'
    text: |-
      Gelden uit een verzekering of andere financiële zekerheid welke ingevolge de [artikelen 11][ref1] en [12][ref2]
      wordt in stand gehouden, zijn uitsluitend beschikbaar voor de voldoening van vorderingen ingevolge deze wet. Voor
      andere vorderingen kan op deze gelden geen beslag worden gelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0002976#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0002976#Artikel12
    url: https://wetten.overheid.nl/BWBR0002976/2013-04-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002976
        artikel: '11'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0002976
        artikel: '12'
        hoofdstuk: IV
  - number: '15.1'
    text: |-
      Onze Minister geeft aan de eigenaar van een in Nederland teboekstaand schip of van een schip dat niet is teboek
      gesteld in een Staat die bij het Verdrag partij is, op diens verzoek een certificaat af als omschreven in artikel
      VII, tweede lid, van het Verdrag en in de vorm van het model uit de Bijlage van het Verdrag, of waarmerkt als
      certificaat een door de verstrekker van financiële zekerheid in deze vorm ten behoeve van de eigenaar afgegeven
      document, indien hem is gebleken dat de eigenaar aan zijn in [artikel 11][ref1] bedoelde verplichting voldoet.


      [ref1]: https://wetten.overheid.nl/BWBR0002976#Artikel11
    url: https://wetten.overheid.nl/BWBR0002976/2013-04-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002976
        artikel: '11'
        hoofdstuk: IV
  - number: '15.2'
    text: 'Bij het verzoek moet de eigenaar de volgende gegevens en stukken overleggen:'
    url: https://wetten.overheid.nl/BWBR0002976/2013-04-01#Artikel15
  - number: 15.2.a
    text: de naam en woonplaats van de eigenaar en de plaats waar diens hoofdkantoor is gevestigd;
    url: https://wetten.overheid.nl/BWBR0002976/2013-04-01#Artikel15
  - number: 15.2.b
    text: |-
      een uittreksel uit de registratie voor schepen als bedoeld in
      [artikel 101, eerste lid, van de Kadasterwet][ref1] vermeldende tenminste de gegevens bedoeld in
      [artikel 85, tweede lid, onder a, c, d, e, f, g en i, van die wet][ref2], alsmede de gegevens omtrent niet
      doorgehaalde voorlopige aantekeningen, met dien verstande dat ingeval dat uittreksel meer dan twee dagen vóór de
      dag der overlegging is afgegeven, op dat uittreksel een verklaring van de bewaarder van het kadaster en de openbare
      registers moet voorkomen, afgegeven binnen voornoemde termijn van twee dagen, dat sedert de afgifte de op dat
      uittreksel vermelde gegevens geen wijziging hebben ondergaan;


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel101
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel85
    url: https://wetten.overheid.nl/BWBR0002976/2013-04-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '101'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: '85'
  - number: 15.2.c
    text: een afschrift van de overeenkomst tot verstrekking van financiële zekerheid;
    url: https://wetten.overheid.nl/BWBR0002976/2013-04-01#Artikel15
  - number: 15.2.d
    text: |-
      de naam, en de plaats waar het hoofdkantoor is gevestigd van degene die de financiële zekerheid verstrekt en, zo
      nodig, het kantoor waar deze zekerheid wordt verstrekt;
    url: https://wetten.overheid.nl/BWBR0002976/2013-04-01#Artikel15
  - number: 15.2.e
    text: het tijdstip waarop de financiële zekerheid ingaat en het tijdstip waarop deze een einde neemt.
    url: https://wetten.overheid.nl/BWBR0002976/2013-04-01#Artikel15
  - number: '17'
    text: |-
      Onze Minister wijst een verzoek als bedoeld in [artikel 15][ref1] af, indien de overgelegde gegevens of stukken
      onvoldoende of onjuist zijn, of indien de overeenkomst tot verstrekking van financiële zekerheid niet voldoet aan
      de daaraan bij of krachtens deze wet gestelde eisen. De beschikking bevat de gronden tot afwijzing en wordt de
      verzoeker schriftelijk medegedeeld. In deze mededeling wordt de verzoeker tevens kennis gegeven op welke wijze en
      binnen welke termijn hij beroep tegen de beschikking kan instellen.


      [ref1]: https://wetten.overheid.nl/BWBR0002976#Artikel15
    url: https://wetten.overheid.nl/BWBR0002976/2013-04-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0002976
        artikel: '15'
        hoofdstuk: IV
  - number: '18.1'
    text: |-
      De eigenaar aan wie een certificaat is afgegeven, is verplicht om onverwijld aan Onze Minister schriftelijk
      mededeling te doen van het ongeldig worden, de schorsing of de beëindiging van de overeenkomst tot verstrekking
      van financiële zekerheid binnen de tijdsduur waarvoor het certificaat is afgegeven, alsmede van elke wijziging
      welke zich gedurende die tijdsduur voordoet in de gegevens welke bij het in [artikel 15][ref1] bedoelde verzoek
      zijn overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0002976#Artikel15
    url: https://wetten.overheid.nl/BWBR0002976/2013-04-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0002976
        artikel: '15'
        hoofdstuk: IV
  - number: '18.2'
    text: |-
      Onze Minister draagt zorg, dat van een mededeling als bedoeld in het eerste lid ten aanzien van een overeenkomst
      tot verstrekking van financiële zekerheid voor een in Nederland teboekstaand schip schriftelijk kennis wordt
      gegeven aan het kantoor van de Dienst voor het kadaster en de openbare registers, waar de openbare registers waarin
      het verzoek tot teboekstelling van het schip is ingeschreven, worden gehouden, welke kennisgeving aldaar wordt
      bewaard.
    url: https://wetten.overheid.nl/BWBR0002976/2013-04-01#Artikel18
  - number: '18.3'
    text: |-
      Het bestaan en de dagtekening van ontvangst van kennisgevingen als bedoeld in het tweede lid, worden onverwijld
      vermeld in de registratie voor schepen, bedoeld in [artikel 85 van de Kadasterwet][ref1]. Kennisgevingen als
      bedoeld in het tweede lid, zijn openbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel85
    url: https://wetten.overheid.nl/BWBR0002976/2013-04-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '85'
  - number: '18.4'
    text: |-
      De in het eerste lid bedoelde mededeling kan behalve door de eigenaar ook worden gedaan door degene die de
      financiële zekerheid verstrekt.
    url: https://wetten.overheid.nl/BWBR0002976/2013-04-01#Artikel18
  - number: '19.1'
    text: |-
      Onze Minister kan, na overleg met Onze Minister van Financiën, een certificaat intrekken indien, door wijziging
      in de gegevens welke bij het in [artikel 15][ref1] bedoelde verzoek zijn overgelegd of doordat die gegevens
      onvoldoende of onjuist blijken te zijn, het niet meer voldoet aan de bij of krachtens deze wet gestelde eisen, of
      indien er goede gronden zijn om aan te nemen dat de financiële draagkracht van de verstrekker van de financiële
      zekerheid onvoldoende was, of is geworden of, indien deze buiten Nederland is gevestigd, blijkt van een beletsel
      voor het werkelijk in Nederland beschikbaar komen van de gelden.


      [ref1]: https://wetten.overheid.nl/BWBR0002976#Artikel15
    url: https://wetten.overheid.nl/BWBR0002976/2013-04-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0002976
        artikel: '15'
        hoofdstuk: IV
  - number: '19.2'
    text: |-
      De beschikking bevat de gronden tot de intrekking en wordt de eigenaar schriftelijk medegedeeld. In deze mededeling
      wordt een termijn gesteld voor de inlevering van het certificaat. Tevens wordt de eigenaar kennis gegeven, op welke
      wijze en binnen welke termijn hij beroep tegen de beschikking kan instellen. Ingeval van beroep vangt de termijn
      van inlevering aan op de dag volgende op die, waarop de eigenaar mededeling heeft ontvangen van de beslissing
      waarbij het beroep is afgewezen of niet-ontvankelijk is verklaard.
    url: https://wetten.overheid.nl/BWBR0002976/2013-04-01#Artikel19
  - number: '20.1'
    text: |-
      De eigenaar is verplicht om het certificaat zo spoedig mogelijk nadat overeenkomstig
      [artikel 18, eerste lid][ref1], mededeling is gedaan van het ongeldig worden, de schorsing of de beëindiging van
      de overeenkomst tot verstrekking van financiële zekerheid, of nadat de tijdsduur waarvoor het is afgegeven is
      verstreken, bij Onze Minister in te leveren.


      [ref1]: https://wetten.overheid.nl/BWBR0002976#Artikel18
    url: https://wetten.overheid.nl/BWBR0002976/2013-04-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0002976
        artikel: '18'
        hoofdstuk: IV
  - number: '20.2'
    text: |-
      De eigenaar is verplicht om het certificaat ingeval van onherroepelijke intrekking bij Onze Minister in te leveren
      binnen de termijn, bedoeld in [artikel 19, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002976#Artikel19
    url: https://wetten.overheid.nl/BWBR0002976/2013-04-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0002976
        artikel: '19'
        hoofdstuk: IV
  - number: '21.1'
    text: |-
      Onze Minister zendt een afschrift van elk door hem ten aanzien van een in Nederland teboek gesteld schip afgegeven
      certificaat, alsmede van elke onherroepelijke beschikking tot intrekking van een ten aanzien van een in Nederland
      teboek gesteld schip afgegeven certificaat, aan het kantoor van de Dienst voor het kadaster en de openbare
      registers, welke kennisgeving aldaar wordt bewaard.
    url: https://wetten.overheid.nl/BWBR0002976/2013-04-01#Artikel21
  - number: '21.2'
    text: |-
      [Artikel 18, derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002976#Artikel18
    url: https://wetten.overheid.nl/BWBR0002976/2013-04-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0002976
        artikel: '18'
        hoofdstuk: IV
  - number: '22'
    text: |-
      De kapitein van een in Nederland teboekstaand schip waarmede, waar ter wereld ook, meer dan 2000 ton olie in
      bulk als lading wordt vervoerd, is verplicht een geldig certificaat als bedoeld in [artikel 15][ref1] aan boord
      te hebben en op eerste aanvraag te vertonen of te doen vertonen aan de ambtenaren, belast met de opsporing van
      overtredingen van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002976#Artikel15
    url: https://wetten.overheid.nl/BWBR0002976/2013-04-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0002976
        artikel: '15'
        hoofdstuk: IV
  - number: '23'
    text: |-
      De kapitein van een schip waarmede meer dan 2000 ton olie in bulk als lading wordt vervoerd, is bij het aanlopen
      of verlaten van een haven of een laad- of losplaats in Nederland en ten tijde dat het schip, in verband met het
      vervoer, zich aldaar of op een binnenwater in Nederland bevindt, of een zodanig water bevaart, verplicht, een
      geldig certificaat als bedoeld in [artikel 15 van deze wet][ref1] of in artikel VII van het Verdrag aan boord
      te hebben en op eerste aanvraag te vertonen of te doen vertonen aan de ambtenaren, belast met de opsporing van
      overtredingen van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002976#Artikel15
    url: https://wetten.overheid.nl/BWBR0002976/2013-04-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0002976
        artikel: '15'
        hoofdstuk: IV
  - number: '24.1'
    text: |-
      Het is de eigenaar, de rompbevrachter en de kapitein van een schip waarmede meer dan 2000 ton olie in bulk als
      lading wordt vervoerd verboden, dit een haven of laad- of losplaats in Nederland te doen aanlopen of verlaten of,
      in verband met het vervoer, aldaar of op een binnenwater in Nederland te doen verblijven, of een zodanig water te
      doen bevaren, indien met betrekking tot dat schip niet een certificaat als bedoeld in artikel 15 van deze wet of in
      artikel VII van het Verdrag is afgegeven. Het verbod wordt ten aanzien van uitgaande schepen zonodig met behulp van
      de sterke arm gehandhaafd.
    url: https://wetten.overheid.nl/BWBR0002976/2013-04-01#Artikel24
  - number: '24.2'
    text: |-
      In bijzondere gevallen kan, in het belang van de bestrijding van verontreiniging door olie, de veiligheid van de
      scheepvaart of het welzijn van opvarenden van het schip, door of vanwege Onze Minister ontheffing worden verleend
      van het in het voorgaande lid bedoelde verbod. Aan de verlening van ontheffing kunnen voorwaarden worden verbonden
      en aan de ontheffing kunnen beperkingen worden gesteld.
    url: https://wetten.overheid.nl/BWBR0002976/2013-04-01#Artikel24
  - number: '25.1'
    text: |-
      Bij vermoeden van overtreding van [artikel 24][ref1] kan aan de kapitein bevel worden gegeven dat het schip
      Nederland niet mag verlaten, voordat op een bij het bevel aan te wijzen plaats een bij dat bevel bepaalde geldsom
      is gestort waarop een ter zake van die overtreding op te leggen geldboete zal kunnen worden verhaald. Het bevel
      wordt zonodig met behulp van de sterke arm gehandhaafd.


      [ref1]: https://wetten.overheid.nl/BWBR0002976#Artikel24
    url: https://wetten.overheid.nl/BWBR0002976/2013-04-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0002976
        artikel: '24'
        hoofdstuk: V
  - number: '25.2'
    text: |-
      Het in het eerste lid bedoelde bevel wordt op vordering van de officier van justitie gegeven door de voorzitter van
      de rechtbank waarvoor de zaak wordt of zal worden vervolgd. De kapitein wordt vooraf gehoord of althans behoorlijk
      opgeroepen. Het bevel is dadelijk uitvoerbaar en wordt onverwijld aan de kapitein betekend.
    url: https://wetten.overheid.nl/BWBR0002976/2013-04-01#Artikel25
  - number: '25.3'
    text: |-
      Van het bevel of de beschikking tot afwijzing van de vordering kan het openbaar ministerie binnen veertien dagen en
      de verdachte binnen veertien dagen na de betekening in beroep komen. Het hof beslist zo spoedig mogelijk.
    url: https://wetten.overheid.nl/BWBR0002976/2013-04-01#Artikel25
  - number: '25.4'
    text: |-
      Zodra het in de strafzaak gewezen vonnis onherroepelijk is geworden, wordt de gestorte geldsom wederom ter
      beschikking van de rechthebbende gesteld nadat daarop een bij dat vonnis opgelegde geldboete in mindering is
      gebracht. Tot dat tijdstip en te rekenen vanaf de dag dat de geldsom werd gestort, wordt over die som rente
      vergoed.
    url: https://wetten.overheid.nl/BWBR0002976/2013-04-01#Artikel25
  - number: '26.1'
    text: |-
      Onze Minister kan verlangen dat de eigenaar van een schip waarmede het verbod van [artikel 24, eerste lid][ref1],
      is overtreden, alsnog een overeenkomst tot verzekering of verstrekking van andere financiële zekerheid sluit
      ter dekking van zijn aansprakelijkheid wegens schade door verontreiniging, tot het in [artikel 4][ref2] bedoelde
      bedrag en voor de duur van de tijd dat het schip beladen met meer dan 2000 ton olie een Nederlands binnenwater
      bevaart of, in verband met het vervoer, zich bevindt op een laad- of losplaats, in een haven of op een binnenwater
      in Nederland. Voldoet de eigenaar hier niet aan, dan kan Onze Minister voor hem een zodanige overeenkomst, in
      overeenstemming met Onze Minister van Financiën, sluiten.


      [ref1]: https://wetten.overheid.nl/BWBR0002976#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0002976#Artikel4
    url: https://wetten.overheid.nl/BWBR0002976/2013-04-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0002976
        artikel: '24'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0002976
        artikel: '4'
        hoofdstuk: II
  - number: '26.2'
    text: |-
      In dit geval is het de kapitein verboden het schip te doen vertrekken alvorens de kosten van de overeenkomst aan
      Onze Minister zijn vergoed of daarvoor zekerheid is gesteld. Onze Minister is bevoegd tot oplegging van een last
      onder bestuursdwang ter handhaving van het verbod.
    url: https://wetten.overheid.nl/BWBR0002976/2013-04-01#Artikel26
  - number: 27a
    text: |-
      In afwijking van [artikel 8:7 van de Algemene wet bestuursrecht][ref1] is voor beroepen tegen besluiten op grond
      van deze wet de rechtbank te Rotterdam bevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0002976/2013-04-01#Artikel27a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '29'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld betreffende de voor de afgifte of waarmerking
      van een certificaat als bedoeld in [artikel 15][ref1] verschuldigde vergoedingen, betreffende de hoogte van de in
      [artikel 25, vierde lid][ref2], bedoelde rente, alsmede, indien dit in het belang van een goede uitvoering der wet
      of in verband met internationale afspraken inzake de uitvoering van het Verdrag noodzakelijk is, betreffende andere
      in de [Hoofdstukken I-IV][ref3] geregelde onderwerpen.


      [ref1]: https://wetten.overheid.nl/BWBR0002976#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002976#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0002976#HoofdstukI
    url: https://wetten.overheid.nl/BWBR0002976/2013-04-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0002976
        artikel: '15'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0002976
        artikel: '25'
        hoofdstuk: V
      - id: ref3
        bwb_id: BWBR0002976
        hoofdstuk: I
  - number: '30'
    text: |-
      Deze wet kan worden aangehaald als: Wet aansprakelijkheid olietankschepen. Zij treedt voor wat betreft
      de [artikelen 4-7][ref1] en [9-29][ref2] in werking op een door Ons nader te bepalen tijdstip. De
      [artikelen 1-3][ref3] en [8][ref4] zijn slechts van toepassing ten aanzien van aansprakelijkheid uit een voorval
      dat na de dag van inwerkingtreding van deze wet heeft plaats gevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0002976#Artikel4
