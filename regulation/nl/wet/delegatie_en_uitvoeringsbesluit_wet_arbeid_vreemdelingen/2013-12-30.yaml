  - number: '4'
    text: |-
      Voor aanvragen die geschoold werk betreffen, dienen bij de personalia van de werknemer de gewaarmerkte diploma’s
      en getuigschriften dat aan de vereiste kwalificaties is voldaan, bij de vergunningaanvraag te worden gevoegd. De
      waarde van deze documenten dient te kunnen worden geverifieerd aan de hand van een door een deskundige instantie
      afgegeven verklaring met welk Nederlands diploma of welke graad van vakbekwaamheid deze documenten vergelijkbaar
      zijn.
    url: https://wetten.overheid.nl/BWBR0007514/2013-12-30#Artikel4
  - number: '5'
    text: |-
      De houder van de tewerkstellingsvergunning is verplicht hiervan onverwijld mededeling te doen indien van de
      tewerkstellingsvergunning langer dan een maand geen gebruik wordt gemaakt.
    url: https://wetten.overheid.nl/BWBR0007514/2013-12-30#Artikel5
  - number: '6'
    text: |-
      Afwijking van [artikel 8, eerste lid, onder b, van de Wet arbeid vreemdelingen][ref1] vindt slechts plaats in geval
      er sprake is van buitengewone omstandigheden die een spoedige vervulling van de arbeidsplaats noodzakelijk maken en
      die niet door de werkgever waren te voorzien of door hem te beïnvloeden waren.


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel8
    url: https://wetten.overheid.nl/BWBR0007514/2013-12-30#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: '8'
  - number: '7'
    text: |-
      Afwijking van [artikel 8, eerste lid, onder a en b, van de Wet arbeid vreemdelingen][ref1] vindt slechts plaats
      ten behoeve van de bevordering van internationale handelscontacten als omschreven in de bij dit besluit behorende
      uitvoeringsregels.


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel8
    url: https://wetten.overheid.nl/BWBR0007514/2013-12-30#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: '8'
  - number: '8'
    text: |-
      Afwijking van [artikel 8, eerste lid, onder a, b en d, van de Wet arbeid vreemdelingen][ref1] vindt slechts plaats
      in het kader van scholing, opleiding, internationale uitwisseling en andere internationale culturele contacten
      alsmede ten behoeve van vreemdelingen die beschikken over een voor het verrichten van arbeid geldige vergunning tot
      verblijf, voor zover dit in de bij dit besluit behorende uitvoeringsregels is omschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel8
    url: https://wetten.overheid.nl/BWBR0007514/2013-12-30#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: '8'
  - number: '9'
    text: |-
      Een tewerkstellingsvergunning kan worden geweigerd ten aanzien van een niet eerder toegelaten vreemdeling die
      jonger is dan 18 jaar of ouder dan 45 jaar.
    url: https://wetten.overheid.nl/BWBR0007514/2013-12-30#Artikel9
  - number: '10'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen brengt jaarlijks aan de Minister van Sociale Zaken en
      Werkgelegenheid verslag uit omtrent de wijze waarop de bevoegdheid, bedoeld in [artikel 1][ref1], is uitgeoefend.

      Dit verslag betreft in ieder geval:

      a. een opgave van het aantal tewerkstellingsvergunningen dat is aangevraagd;

      b. een opgave van het aantal tewerkstellingsvergunningen dat is verleend onderscheidenlijk geweigerd, onder
      vermelding van de weigeringsgrond;

      c. een opgave van het aantal personen waarop de verleende tewerkstellingsvergunningen betrekking hebben;

      d. een opgave van het aantal malen dat aan de verleende tewerkstellingsvergunningen beperkingen dan wel
      voorschriften zijn verbonden;

      e. een opgave van het aantal tewerkstellingsvergunningen dat is ingetrokken, onder vermelding van de
      intrekkingsgrond;

      f. een opgave van het aantal bezwaarschriften dat tegen de onderscheiden beslissingen is ingediend, van het aantal
      malen dat deze zijn ingewilligd onderscheidenlijk afgewezen, en van het aantal malen dat tegen de beslissing op het
      bezwaarschrift beroep bij de rechter is ingesteld;

      g. een opgave van de termijnen waarbinnen de onder b en f bedoelde beslissingen zijn genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0007514#Artikel1
    url: https://wetten.overheid.nl/BWBR0007514/2013-12-30#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0007514
        artikel: '1'
  - number: '11'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen is verplicht aan de Minister van Sociale Zaken en Werkgelegenheid
      en de door deze aangewezen ambtenaren desgevraagd binnen een daartoe gestelde termijn en op de aangegeven
      wijze alle opgaven en inlichtingen te verstrekken betreffende de wijze waarop de bevoegdheden, bedoeld in
      [artikel 1][ref1], zijn uitgeoefend.


      [ref1]: https://wetten.overheid.nl/BWBR0007514#Artikel1
    url: https://wetten.overheid.nl/BWBR0007514/2013-12-30#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0007514
        artikel: '1'
  - number: '12'
    text: |-
      Deze regeling treedt in werking met ingang van de dag waarop de [Wet arbeid vreemdelingen][ref1] in werking treedt
      en wordt aangehaald als [Delegatie- en uitvoeringsbesluit Wet arbeid vreemdelingen](onbekend).


