articles:
  - number: '1'
    text: |-
      De bevoegdheid inzake het afgeven, verlengen en intrekken van tewerkstellingsvergunningen wordt overgedragen aan
      het Uitvoeringsinstituut werknemersverzekeringen.
    url: https://wetten.overheid.nl/BWBR0007514/2013-12-30#Artikel1
  - number: '2'
    text: |-
      Bij de uitoefening van de bevoegdheden, bedoeld in [artikel 1][ref1], neemt het
      Uitvoeringsinstituut werknemersverzekeringen, naast de in de [Wet arbeid vreemdelingen][ref2], het
      [Besluit ter uitvoering van de Wet arbeid vreemdelingen][ref3] en in dit besluit gestelde regels, de nadere regels
      in acht inzake de wijze van toepassing van de [Wet arbeid vreemdelingen][ref4] zoals die zijn neergelegd in de
      uitvoeringsregels behorende bij dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0007514#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007149
      [ref3]: https://wetten.overheid.nl/BWBR0007523
      [ref4]: https://wetten.overheid.nl/BWBR0007149
    url: https://wetten.overheid.nl/BWBR0007514/2013-12-30#Artikel2
