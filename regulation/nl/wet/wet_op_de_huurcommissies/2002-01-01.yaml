---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_op_de_huurcommissies
regulatory_layer: WET
publication_date: '2003-11-18'
valid_from: '2002-01-01'
bwb_id: BWBR0003222
url: https://wetten.overheid.nl/BWBR0003222/2002-01-01
preamble:
  text: |-
    Wij Juliana, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is regelen te stellen met betrekking tot de instelling, de
    taak, de samenstelling en de werkwijze van huurcommissies;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0003222/2002-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0003222/2002-01-01#Artikel1
  - number: 1.a
    text: |-
      woonruimte: een gebouwde onroerende zaak die een zelfstandige woning vormt, of een tot bewoning bestemd gedeelte
      van een gebouwde onroerende zaak, dan wel een woonwagen of een standplaats, een en ander met zijn onroerende
      aanhorigheden;
    url: https://wetten.overheid.nl/BWBR0003222/2002-01-01#Artikel1
  - number: 1.b
    text: |-
      woonwagen: voor bewoning bestemd gebouw dat is geplaatst op een standplaats en dat in zijn geheel of in delen
      kan worden verplaatst, met uitzondering van wagens die een eigen aandrijving hebben en wagens waarvoor voor het
      voortbewegen ervan over een weg geen ontheffing ingevolge de [Wegenverkeerswet 1994][ref1] van bij of krachtens die
      wet gegeven voorschriften met betrekking tot verkeersregels en verkeerstekens is vereist;


      [ref1]: https://wetten.overheid.nl/BWBR0006622
    url: https://wetten.overheid.nl/BWBR0003222/2002-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006622
  - number: 1.c
    text: |-
      standplaats: een kavel, bestemd voor het plaatsen van een woonwagen, waarop voorzieningen aanwezig zijn die op het
      leidingnet van de openbare nutsbedrijven, andere instellingen of van gemeenten kunnen worden aangesloten;
    url: https://wetten.overheid.nl/BWBR0003222/2002-01-01#Artikel1
  - number: 1.d
    text: 'Onze Minister: Onze Minister belast met de zorg voor de volkshuisvesting;'
    url: https://wetten.overheid.nl/BWBR0003222/2002-01-01#Artikel1
  - number: 1.e
    text: 'Gedeputeerde Staten: Gedeputeerde Staten der provincie, waarin de standplaats van een huurcommissie is gelegen.'
    url: https://wetten.overheid.nl/BWBR0003222/2002-01-01#Artikel1
  - number: '2.1'
    text: |-
      In het rechtsgebied van ieder arrondissement zijn één of meer huurcommissies. Bij algemene maatregel van bestuur
      worden de ressorten van deze huurcommissies bepaald door vermelding van de gemeenten waarover deze ressorten zich
      uitstrekken.
    url: https://wetten.overheid.nl/BWBR0003222/2002-01-01#Artikel2
  - number: '2.2'
    text: |-
      De huurcommissies zijn gevestigd in de gemeenten, waarvan de naam in de in het eerste lid bedoelde algemene
      maatregel van bestuur als aanduiding van het ressort van die huurcommissie is opgenomen.
    url: https://wetten.overheid.nl/BWBR0003222/2002-01-01#Artikel2
  - number: '3.1'
    text: Een huurcommissie heeft tot taak terzake van huur en verhuur van woonruimte
    url: https://wetten.overheid.nl/BWBR0003222/2002-01-01#Artikel3
  - number: 3.1.a
    text: |-
      desverzocht ingevolge het bepaalde in [artikel 6, derde lid, van de Huurprijzenwet woonruimte][ref1] aan de huurder
      of aan de verhuurder of aan beiden een met redenen omkleed schriftelijk advies uit te brengen over de vraag of met
      een beding als bedoeld in [artikel 6, eerste of tweede lid][ref2], enig niet redelijk voordeel is overeengekomen en
      daarbij zonodig te vermelden hetgeen zij met betrekking tot het onderwerp van het beding redelijk acht;


      [ref1]: https://wetten.overheid.nl/BWBR0003221#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0003222#Artikel6
    url: https://wetten.overheid.nl/BWBR0003222/2002-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003221
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0003222
        artikel: '6'
        hoofdstuk: III
  - number: 3.1.b
    text: |-
      desverzocht ingevolge het bepaalde in de [artikelen 10, tweede lid][ref1] respectievelijk
      [13, eerste lid, van de Huurprijzenwet woonruimte][ref2] aan de huurder of aan de verhuurder een met redenen
      omkleed schriftelijk advies uit te brengen respectievelijk een schriftelijke uitspraak te doen over de vraag, welke
      de betalingsverplichting van de huurder is met betrekking tot de in [artikel 10, eerste lid van genoemde wet][ref3]
      bedoelde huurprijs of de in [artikel 12, eerste lid van die wet][ref4] bedoelde kosten;


      [ref1]: https://wetten.overheid.nl/BWBR0003221#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0003221#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0003221#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0003221#Artikel12
    url: https://wetten.overheid.nl/BWBR0003222/2002-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003221
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0003221
        artikel: '13'
      - id: ref3
        bwb_id: BWBR0003221
        artikel: '10'
      - id: ref4
        bwb_id: BWBR0003221
        artikel: '12'
  - number: 3.1.c
    text: |-
      desverzocht ingevolge het bepaalde in [artikel 10a, derde lid, van de Huurprijzenwet woonruimte][ref1]
      uitspraak te doen over het bedrag van de verhoging van de huurprijs na de totstandkoming van ingrepen of
      voorzieningen, getroffen ter uitvoering van een aanschrijving als bedoeld in [artikel 15][ref2], [15a][ref3] of
      [16 van de Woningwet ][ref4](Stb. 1991, 439);


      [ref1]: https://wetten.overheid.nl/BWBR0003221#Artikel10a
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0005181#Artikel15a
      [ref4]: https://wetten.overheid.nl/BWBR0005181#Artikel16
    url: https://wetten.overheid.nl/BWBR0003222/2002-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003221
        artikel: 10a
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '15'
      - id: ref3
        bwb_id: BWBR0005181
        artikel: 15a
      - id: ref4
        bwb_id: BWBR0005181
        artikel: '16'
  - number: 3.1.d
    text: |-
      desverzocht ingevolge het bepaalde in [artikel 11a, eerste lid, van de Huurprijzenwet woonruimte][ref1] uitspraak
      te doen over de vraag of partijen bij een overeenkomst als in dat artikellid bedoeld, slechts de hoogte van de
      prijs en niet die van de huurprijs zijn overeengekomen en daarbij zonodig uit te spreken dat partijen slechts
      de hoogte van de prijs en niet die van de huurpijs zijn overeengekomen en in dat geval ingevolge het bepaalde
      in [artikel 11a, tweede lid, van genoemde wet][ref2] tevens de huurprijs en het voorschotbedrag terzake van de
      vergoedingen voor de kosten, bedoeld in [artikel 12, eerste lid, van genoemde wet][ref3], uit te spreken;


      [ref1]: https://wetten.overheid.nl/BWBR0003221#Artikel11a
      [ref2]: https://wetten.overheid.nl/BWBR0003221#Artikel11a
      [ref3]: https://wetten.overheid.nl/BWBR0003221#Artikel12
    url: https://wetten.overheid.nl/BWBR0003222/2002-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003221
        artikel: 11a
      - id: ref2
        bwb_id: BWBR0003221
        artikel: 11a
      - id: ref3
        bwb_id: BWBR0003221
        artikel: '12'
  - number: 3.1.e
    text: |-
      desverzocht of uit eigen beweging Onze Minister te adviseren terzake van door deze ingevolge het bepaalde in
      [artikel 16 van de Huurprijzenwet woonruimte][ref1] te nemen besluiten ten aanzien van wijziging in bijzondere
      gevallen van een overeengekomen huurprijs van woonruimte;


      [ref1]: https://wetten.overheid.nl/BWBR0003221#Artikel16
    url: https://wetten.overheid.nl/BWBR0003222/2002-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003221
        artikel: '16'
  - number: 3.1.f
    text: |-
      desverzocht ingevolge het bepaalde in [artikel 17, tweede lid, van de Huurprijzenwet woonruimte][ref1] uitspraak te
      doen over de redelijkheid van een overeengekomen huurprijs en daarbij zo nodig uit te spreken dat de overeengekomen
      huurprijs niet redelijk is en in dat geval tevens welke huurprijs zij redelijk acht, alsmede desverzocht ingevolge
      [artikel 17, vijfde lid, van genoemde wet][ref2] uitspraak te doen omtrent het opgeheven zijn van tekortkomingen in
      de onderhoudstoestand van de woonruimte;


      [ref1]: https://wetten.overheid.nl/BWBR0003221#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0003221#Artikel17
    url: https://wetten.overheid.nl/BWBR0003222/2002-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003221
        artikel: '17'
      - id: ref2
        bwb_id: BWBR0003221
        artikel: '17'
  - number: 3.1.g
    text: |-
      desverzocht ingevolge het bepaalde in [artikel 18, tweede lid, van de Huurprijzenwet woonruimte][ref1], uitspraak
      te doen omtrent de huurprijs die zij redelijk acht in verband met gebreken aan of tekortkomingen ten aanzien van
      de woonruimte, alsmede desverzocht ingevolge het bepaalde in [artikel 18, achtste lid, van genoemde wet][ref2]
      uitspraak te doen omtrent het opgeheven zijn van voornoemde gebreken of tekortkomingen;


      [ref1]: https://wetten.overheid.nl/BWBR0003221#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0003221#Artikel18
    url: https://wetten.overheid.nl/BWBR0003222/2002-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003221
        artikel: '18'
      - id: ref2
        bwb_id: BWBR0003221
        artikel: '18'
  - number: 3.1.h
    text: |-
      desverzocht ingevolge het bepaalde in [artikel 20, derde lid, van de Huurprijzenwet woonruimte][ref1], een huurder
      kennis te geven van een voorstel van de verhuurder tot verhoging van de huurprijs onder vermelding van de wijze
      waarop en het tijdvak waarbinnen de huurder, indien hij bezwaren heeft tegen het voorstel, daarvan kan doen
      blijken, alsmede de gevolgen welke zijn verbonden aan het niet doen blijken van bezwaren;


      [ref1]: https://wetten.overheid.nl/BWBR0003221#Artikel20
    url: https://wetten.overheid.nl/BWBR0003222/2002-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003221
        artikel: '20'
  - number: 3.1.i
    text: |-
      desverzocht ingevolge het bepaalde in [artikel 25, eerste lid, van de Huurprijzenwet woonruimte][ref1]
      uitspraak te doen over de redelijkheid van een voorstel van huurder of verhuurder tot wijziging
      van de huurprijs, al dan niet na een uitspraak te hebben gedaan ingevolge het bepaalde in
      [artikel 25a, vierde lid, van de Huurprijzenwet woonruimte][ref2], op het in [artikel 25a, derde lid][ref3],
      bedoelde verzet van huurder of verhuurder tegen een uitspraak van de voorzitter van de huurcommissie, bedoeld in
      [artikel 25a, eerste lid, van genoemde wet][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0003221#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0003221#Artikel25a
      [ref3]: https://wetten.overheid.nl/BWBR0003221#Artikel25a
      [ref4]: https://wetten.overheid.nl/BWBR0003221#Artikel25a
    url: https://wetten.overheid.nl/BWBR0003222/2002-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003221
        artikel: '25'
      - id: ref2
        bwb_id: BWBR0003221
        artikel: 25a
      - id: ref3
        bwb_id: BWBR0003221
        artikel: 25a
      - id: ref4
        bwb_id: BWBR0003221
        artikel: 25a
  - number: 3.1.j
    text: |-
      desverzocht uitspraak te doen ingevolge verzet bij de toepassing van
      [artikel 25c van de Huurprijzenwet woonruimte][ref1] en inlichtingen te verstrekken aan de kantonrechter met
      betrekking tot een door haar gedane uitspraak;


      [ref1]: https://wetten.overheid.nl/BWBR0003221#Artikel25c
    url: https://wetten.overheid.nl/BWBR0003222/2002-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003221
        artikel: 25c
  - number: 3.1.k
    text: |-
      desverzocht aan de verhuurder die zich ingevolge artikel 1623c, tweede lid, van het Burgerlijk Wetboek tot de
      kantonrechter wil wenden met het verzoek het tijdstip vast te stellen waarop de huurovereenkomst zal eindigen, een
      verklaring te verstrekken, inhoudende hetzij de vaststelling dat de huurder de woonruimte niet heeft onderverhuurd,
      hetzij de namen en woonplaatsen van de onderhuurders, zomede alle verdere gegevens betreffende de onderhuurders,
      welke naar het oordeel van de commissie ter kennis van de rechter behoren te worden gebracht;
    url: https://wetten.overheid.nl/BWBR0003222/2002-01-01#Artikel3
  - number: 3.1.l
    text: |-
      desverzocht met betrekking tot een overeenkomst van huur en verhuur, waarop de [Huurprijzenwet woonruimte][ref1]
      ingevolge [artikel 2 van die wet][ref2] niet van toepassing is, dan wel waarop uitsluitend
      [artikel 2, derde lid, van die wet][ref3] van toepassing is, een advies te geven over aangelegenheden waarover de
      huurcommissie bevoegd zou zijn te adviseren of waaromtrent zij bevoegd zou zijn een uitspraak te doen in het geval
      de [Huurprijzenwet woonruimte][ref4] op de overeenkomst van toepassing zou zijn, voorzover in de overeenkomst is
      bepaald dat deze bij geschil aan de huurcommissie worden voorgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0003221
      [ref2]: https://wetten.overheid.nl/BWBR0003221#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0003221#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0003221
    url: https://wetten.overheid.nl/BWBR0003222/2002-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003221
      - id: ref2
        bwb_id: BWBR0003221
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0003221
        artikel: '2'
      - id: ref4
        bwb_id: BWBR0003221
  - number: '3.2'
    text: |-
      De huurcommissie verstrekt desverzocht aan Onze Minister en aan publiekrechtelijke lichamen die geacht kunnen
      worden daarbij belang te hebben een verklaring over de met inachtneming van het daaromtrent bepaalde bij of
      krachtens de [Huurprijzenwet woonruimte][ref1] aan een woonruimte toe te kennen kwaliteit, de gebreken of
      tekortkomingen in het onderhoud die ten aanzien van die woonruimte zijn vast te stellen en een voor die woonruimte
      redelijk te achten huurprijs. De hierbedoelde verklaring wordt niet gegeven, indien het belang van de verklaring
      is gelegen in de beoordeling door de verzoeker van een huurovereenkomst waarop de [Huurprijzenwet woonruimte][ref2]
      ingevolge [artikel 2, eerste of tweede lid, van die wet][ref3] niet van toepassing is, dan wel waarop uitsluitend
      [artikel 2, derde lid, van die wet][ref4] van toepassing is. Een verklaring wordt in elk geval gegeven indien het
      belang daarvan gelegen is in de toepassing van [artikel 1, vierde lid, van de Huisvestingswet][ref5]. Onze Minister
      kan voor de uitvoering van de in de eerste volzin bedoelde taak nadere regelen stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0003221
      [ref2]: https://wetten.overheid.nl/BWBR0003221
      [ref3]: https://wetten.overheid.nl/BWBR0003221#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0003221#Artikel2
      [ref5]: https://wetten.overheid.nl/BWBR0005674#Artikel1
    url: https://wetten.overheid.nl/BWBR0003222/2002-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003221
      - id: ref2
        bwb_id: BWBR0003221
      - id: ref3
        bwb_id: BWBR0003221
        artikel: '2'
      - id: ref4
        bwb_id: BWBR0003221
        artikel: '2'
      - id: ref5
        bwb_id: BWBR0005674
        artikel: '1'
  - number: '3.3'
    text: |-
      De huurcommissie verricht voorts de taken die haar bij of krachtens de [Huurwet][ref1] (Stb. 1950, K 452) zijn
      opgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0002066
    url: https://wetten.overheid.nl/BWBR0003222/2002-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002066
  - number: '3.4'
    text: 'De huurcommissie is tevens belast met:'
    url: https://wetten.overheid.nl/BWBR0003222/2002-01-01#Artikel3
  - number: 3.4.a
    text: |-
      het doen van uitspraken over de redelijkheid van een besluit tot vaststelling of tot wijziging van een
      gebruiksvergoeding als bedoeld in [artikel 51, eerste lid, van de Huisvestingswet][ref1] (Stb. 1992, 548) en over
      een aanvullende vergoeding als bedoeld in [artikel 51, derde lid, van die wet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel51
      [ref2]: https://wetten.overheid.nl/BWBR0005674#Artikel51
    url: https://wetten.overheid.nl/BWBR0003222/2002-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005674
        artikel: '51'
      - id: ref2
        bwb_id: BWBR0005674
        artikel: '51'
  - number: 3.4.b
    text: |-
      het desverzocht met betrekking tot een door haar gedane uitspraak als bedoeld onder a aan de kantonrechter
      verstrekken van nadere inlichtingen.
    url: https://wetten.overheid.nl/BWBR0003222/2002-01-01#Artikel3
  - number: '3.5'
    text: |-
      Voor het ingevolge het eerste lid, onder l, uitbrengen van een advies door de huurcommissie is door de verzoeker
      een vergoeding aan de Staat verschuldigd, waarvan het bedrag en de wijze van betaling bij algemene maatregel van
      bestuur worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003222/2002-01-01#Artikel3
  - number: 3a.1
    text: |-
      De voorzitter van de huurcommissie verstrekt op verzoek van een huurder van woonruimte ten behoeve van een
      aanvraag om huursubsidie krachtens de [Huursubsidiewet][ref1] binnen vier weken een verklaring omtrent de
      redelijkheid van de huurprijs en de juistheid van andere gegevens betreffende de woonruimte, een en ander voorzover
      van belang voor de toepassing van die wet, in de gevallen die bij algemene maatregel van bestuur krachtens
      [artikel 28 van genoemde wet][ref2] zijn aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0008659
      [ref2]: https://wetten.overheid.nl/BWBR0008659#Artikel28
    url: https://wetten.overheid.nl/BWBR0003222/2002-01-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0008659
      - id: ref2
        bwb_id: BWBR0008659
        artikel: '28'
  - number: 3a.2
    text: |-
      Indien de voorzitter de verklaring niet binnen vier weken verstrekt, stelt hij de huurder hier onmiddellijk van in
      kennis onder vermelding van de redenen daarvoor, en geeft daarbij aan binnen welke termijn de verklaring zal worden
      verstrekt.
    url: https://wetten.overheid.nl/BWBR0003222/2002-01-01#Artikel3a
  - number: '4.1'
    text: Een huurcommissie bestaat uit een voorzitter en een door Onze Minister te bepalen aantal leden.
    url: https://wetten.overheid.nl/BWBR0003222/2002-01-01#Artikel4
  - number: '4.2'
    text: |-
      Onze Minister kan bepalen dat een huurcommissie een plaatsvervangend voorzitter en plaatsvervangende leden telt.
      Hij stelt dan tevens het aantal plaatsvervangende leden vast. De artikelen van deze wet betrekking hebbend op de
      voorzitter van een huurcommissie zijn tevens van toepassing op de plaatsvervangend voorzitter.
    url: https://wetten.overheid.nl/BWBR0003222/2002-01-01#Artikel4
  - number: '4.3'
    text: |-
      Bij afwezigheid of ontstentenis van de voorzitter treedt overeenkomstig een door Onze Minister vast te stellen
      rooster de voorzitter van een huurcommissie uit een ander ressort als waarnemend voorzitter op. Is op deze wijze
      niet in de waarneming te voorzien, dan wijst de huurcommissie uit haar midden een waarnemend voorzitter aan.
    url: https://wetten.overheid.nl/BWBR0003222/2002-01-01#Artikel4
  - number: '4.4'
    text: |-
      Bij afwezigheid of ontstentenis van een der leden treedt een daartoe door de voorzitter aangewezen lid of
      plaatsvervangend lid als vervanger op.
    url: https://wetten.overheid.nl/BWBR0003222/2002-01-01#Artikel4
  - number: '5.1'
    text: |-
      De voorzitter van een huurcommissie wordt bij koninklijk besluit benoemd en ontslagen. Een benoeming geschiedt voor
      de tijd van zes jaren. Hij kan tot voorzitter van meer dan een huurcommissie worden benoemd.
    url: https://wetten.overheid.nl/BWBR0003222/2002-01-01#Artikel5
  - number: '5.2'
    text: |-
      De voorzitter moet aan een universiteit dan wel de Open Universiteit waarop de
      [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1] betrekking heeft, het recht om de titel meester
      te voeren hebben verkregen of blijk hebben gegeven op andere wijze de voor de betrekking van voorzitter benodigde
      kennis te hebben verworven.


      [ref1]: https://wetten.overheid.nl/BWBR0005682
    url: https://wetten.overheid.nl/BWBR0003222/2002-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005682
  - number: '5.3'
    text: |-
      De voorzitter mag niet metterdaad betrokken zijn bij de uitoefening van een bedrijf dat werkzaam is of mede
      werkzaam is op het gebied van gebouwde onroerende zaken, noch is het hem toegestaan beroepsmatig betrokken te
      zijn bij het beheer van en de beschikking over zodanige zaken dan wel deel uit te maken van het bestuur van een
      vereniging, vennootschap of stichting, die daarbij is betrokken.
    url: https://wetten.overheid.nl/BWBR0003222/2002-01-01#Artikel5
  - number: '6.1'
    text: |-
      Onze Minister benoemt en ontslaat de leden en de plaatsvervangende leden van een huurcommissie. Een benoeming
      geschiedt voor de tijd van vier jaren.
    url: https://wetten.overheid.nl/BWBR0003222/2002-01-01#Artikel6
  - number: '6.2'
    text: |-
      De benoeming van de leden en de plaatsvervangende leden geschiedt zodanig dat in de huurcommissie het belang van de
      huurders noch dat van de verhuurders overheerst.
    url: https://wetten.overheid.nl/BWBR0003222/2002-01-01#Artikel6
  - number: '6.3'
    text: |-
      Daartoe stelt Onze Minister bij iedere benoeming, gelet op de te bereiken samenstelling der commissie, de
      organisaties, die naar het oordeel van Onze Minister geacht kunnen worden het belang van de huurders te
      vertegenwoordigen of dat der verhuurders, gedurende twee maanden in de gelegenheid een aanbeveling te doen.
    url: https://wetten.overheid.nl/BWBR0003222/2002-01-01#Artikel6
  - number: '6.4'
    text: |-
      Onze Minister neemt binnen drie maanden na het verstrijken van de in het derde lid bedoelde termijn over de
      benoeming een beslissing.
    url: https://wetten.overheid.nl/BWBR0003222/2002-01-01#Artikel6
  - number: '7.1'
    text: |-
      De voorzitter moet de leeftijd van 25 jaar, doch niet die van 65 jaar hebben bereikt. De leden en de
      plaatsvervangende leden moeten de voor het lidmaatschap van de gemeenteraad vereiste leeftijd hebben bereikt doch
      niet die van 70 jaar, terwijl zij woonachtig moeten zijn in een der gemeenten in het ressort van de huurcommissie.
      In bijzondere gevallen kan Onze Minister de leden ontheffing verlenen van laatstbedoelde verplichting.
    url: https://wetten.overheid.nl/BWBR0003222/2002-01-01#Artikel7
  - number: '7.2'
    text: |-
      De voorzitter wordt ontslagen bij het bereiken van de leeftijd van 65 jaar, de leden en de plaatsvervangende
      leden bij het bereiken van de leeftijd van 70 jaar. Zij kunnen, na tevoren hierover te zijn gehoord, te allen
      tijde worden ontslagen bij gebleken ongeschiktheid door ouderdom, aanhoudende lichaams- of geestesziekte en bij
      ondercuratelestelling.
    url: https://wetten.overheid.nl/BWBR0003222/2002-01-01#Artikel7
  - number: '7.3'
    text: |-
      De voorzitter, de leden en de plaatsvervangende leden kunnen, na tevoren hierover te zijn gehoord, worden
      ontslagen:
    url: https://wetten.overheid.nl/BWBR0003222/2002-01-01#Artikel7
  - number: 7.3.a
    text: wanneer zij wegens misdrijf tot gevangenisstraf of hechtenis zijn veroordeeld;
    url: https://wetten.overheid.nl/BWBR0003222/2002-01-01#Artikel7
  - number: 7.3.b
    text: |-
      wanneer zij in staat van faillissement zijn verklaard of surseance van betaling hebben verkregen, dan wel ten
      aanzien van hen de schuldsaneringsregeling natuurlijke personen van toepassing is verklaard;
    url: https://wetten.overheid.nl/BWBR0003222/2002-01-01#Artikel7
  - number: 7.3.c
    text: |-
      wegens gedrag dat het vertrouwen in de huurcommissie ernstig schaadt of bij gebleken voortdurende achteloosheid in
      de waarneming van hun ambt.
    url: https://wetten.overheid.nl/BWBR0003222/2002-01-01#Artikel7
  - number: '8.1'
    text: Aan de huurcommissie wordt een secretaris toegevoegd, die wordt benoemd en ontslagen door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0003222/2002-01-01#Artikel8
  - number: '8.2'
    text: Een secretaris kan aan meer dan een huurcommissie worden toegevoegd.
    url: https://wetten.overheid.nl/BWBR0003222/2002-01-01#Artikel8
  - number: '8.3'
    text: |-
      De secretaris is de voorzitter en de leden van de huurcommissie behulpzaam in alles wat de juiste taakvervulling
      van de commissie betreft. Hij heeft de leiding van het bureau van de huurcommissie.
    url: https://wetten.overheid.nl/BWBR0003222/2002-01-01#Artikel8
  - number: '8.4'
    text: |-
      Onze Minister neemt zo nodig ten behoeve van het bureau van de huurcommissie personeel in dienst. Hij kan een of
      meer personeelsleden van het bureau aanwijzen als plaatsvervangend secretaris van de huurcommissie. De secretaris
      kan Onze Minister terzake van de indienstneming van personeel en de aanwijzing als plaatsvervangend secretaris
      voorstellen doen.
    url: https://wetten.overheid.nl/BWBR0003222/2002-01-01#Artikel8
  - number: '8.5'
    text: |-
      Onze Minister kan terzake van de taakvervulling van de secretaris en de inrichting van het bureau van de
      huurcommissie aanwijzingen geven.
    url: https://wetten.overheid.nl/BWBR0003222/2002-01-01#Artikel8
  - number: '9.1'
    text: |-
      De voorzitter, de leden en de plaatsvervangende leden, de secretaris en de plaatsvervangende secretaris zijn
      verplicht tot geheimhouding van hetgeen hun bij de behandeling van de krachtens deze wet toevertrouwde zaken bekend
      is geworden en van hetgeen in raadkamer is besproken.
    url: https://wetten.overheid.nl/BWBR0003222/2002-01-01#Artikel9
  - number: '9.2'
    text: |-
      De voorzitter, de leden en de plaatsvervangende leden, de secretaris en de plaatsvervangende secretaris mogen
      zich direct noch indirect in enig bijzonder onderhoud of gesprek inlaten met partijen of derzelver raadslieden,
      noch enige bijzondere onderrichting, memorie of schrifturen aannemen over enige aangelegenheid, welke aanhangig
      is of waarvan zij weten of vermoeden, dat deze aanhangig zal worden bij de huurcommissie waartoe zij behoren.
      Zij onthouden zich voorts van deelneming aan de behandeling van enige zaak, indien er te hunnen aanzien feiten of
      omstandigheden bestaan, waardoor in het algemeen hun onpartijdigheid schade zou kunnen lijden.
    url: https://wetten.overheid.nl/BWBR0003222/2002-01-01#Artikel9
  - number: '10.1'
    text: |-
      De voorzitter geniet een bezoldiging welke bij algemene maatregel van bestuur wordt vastgesteld. Hij geniet voorts
      vergoeding voor reis- en verblijfkosten volgens bij algemene maatregel van bestuur te stellen regelen.
    url: https://wetten.overheid.nl/BWBR0003222/2002-01-01#Artikel10
  - number: '10.2'
    text: |-
      De leden en de plaatsvervangende leden genieten een vergoeding voor reis- en verblijfkosten en verdere vergoedingen
      volgens bij algemene maatregel van bestuur te stellen regelen.
    url: https://wetten.overheid.nl/BWBR0003222/2002-01-01#Artikel10
  - number: '11'
    text: |-
      Een huurcommissie houdt zitting in haar standplaats. Indien daartoe aanleiding is, kan de voorzitter bepalen dat
      de commissie ook zitting houdt in een andere gemeente. In dat geval stellen burgemeester en wethouders van de
      betrokken gemeente de huurcommissie aldaar een passend lokaal ter beschikking.
    url: https://wetten.overheid.nl/BWBR0003222/2002-01-01#Artikel11
  - number: '12.1'
    text: De huurcommissie houdt zitting en beraadslaagt met de voorzitter benevens twee leden.
    url: https://wetten.overheid.nl/BWBR0003222/2002-01-01#Artikel12
  - number: '12.2'
    text: Ieder jaar vóór 1 maart stelt de huurcommissie een rooster van haar werkzaamheden vast in een algemene vergadering.
    url: https://wetten.overheid.nl/BWBR0003222/2002-01-01#Artikel12
  - number: '12.3'
    text: 'Dit rooster behelst:'
    url: https://wetten.overheid.nl/BWBR0003222/2002-01-01#Artikel12
  - number: 12.3.a
    text: vaststelling van tijd en plaats van de zitting der huurcommissie;
    url: https://wetten.overheid.nl/BWBR0003222/2002-01-01#Artikel12
  - number: 12.3.b
    text: aanwijzing van de ter zitting aan de behandeling der zaken deelnemende leden der huurcommissie.
    url: https://wetten.overheid.nl/BWBR0003222/2002-01-01#Artikel12
  - number: '12.4'
    text: |-
      Het door de huurcommissie vastgestelde rooster, zomede een tussentijds daarin aangebrachte wijziging, behoeft de
      goedkeuring van Onze Minister. De goedkeuring kan worden onthouden op de grond dat:
    url: https://wetten.overheid.nl/BWBR0003222/2002-01-01#Artikel12
  - number: 12.4.a
    text: |-
      bij de vaststelling van tijd en plaats van de zitting van de huurcommissie onvoldoende rekening is gehouden met de
      belangen van huurders en verhuurders, of
    url: https://wetten.overheid.nl/BWBR0003222/2002-01-01#Artikel12
  - number: 12.4.b
    text: |-
      niet genoegzaam blijkt dat bij de behandeling van iedere zaak onder de deelnemende leden het belang van de huurders
      noch dat der verhuurders overheerst.
    url: https://wetten.overheid.nl/BWBR0003222/2002-01-01#Artikel12
  - number: '12.5'
    text: Om dringende redenen kan de voorzitter besluiten, dat van het goedgekeurde rooster zal worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0003222/2002-01-01#Artikel12
  - number: '13'
    text: |-
      De[ artikelen 14 tot en met 19][ref1] hebben betrekking op de behandeling van verzoeken, bedoeld in
      [artikel 3, eerste lid, onder b, c, d, f, g en i, en vierde lid, onder a][ref2], alsmede op de behandeling van
      verzoeken, bedoeld in de [artikelen 11, eerste lid][ref3], en [12, tweede lid, van de Huurwet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0003222#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0003222#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0002066#Artikel11
      [ref4]: https://wetten.overheid.nl/BWBR0002066#Artikel12
    url: https://wetten.overheid.nl/BWBR0003222/2002-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003222
        artikel: '14'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0003222
        artikel: '3'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0002066
        artikel: '11'
      - id: ref4
        bwb_id: BWBR0002066
        artikel: '12'
  - number: '14.1'
    text: De zittingen van de huurcommissie zijn openbaar.
    url: https://wetten.overheid.nl/BWBR0003222/2002-01-01#Artikel14
  - number: '14.2'
    text: |-
      In het belang der openbare orde of op verzoek van een der partijen, indien haar belangen dit eisen, kan de
      huurcommissie besluiten dat de zitting met gesloten deuren zal worden gehouden.
    url: https://wetten.overheid.nl/BWBR0003222/2002-01-01#Artikel14
  - number: '14.3'
    text: De beraadslaging en de beslissing over een verzoek, bedoeld in het tweede lid, geschiedt in raadkamer.
    url: https://wetten.overheid.nl/BWBR0003222/2002-01-01#Artikel14
  - number: '15.1'
    text: |-
      Voor de aanvang van de behandeling ter zitting kan elk der deelnemers aan de zitting door een der partijen
      worden gewraakt op grond van feiten of omstandigheden, die het vormen van een onpartijdig oordeel zouden kunnen
      bemoeilijken.
    url: https://wetten.overheid.nl/BWBR0003222/2002-01-01#Artikel15
  - number: '15.2'
    text: Op grond van zodanige feiten of omstandigheden kan een deelnemer aan de zitting zich verschonen.
    url: https://wetten.overheid.nl/BWBR0003222/2002-01-01#Artikel15
  - number: '15.3'
    text: |-
      De overige deelnemers beslissen zo spoedig mogelijk of de wraking of verschoning wordt toegestaan. De beraadslaging
      en beslissing geschiedt in raadkamer. In geval van staking van stemmen is het verzoek tot wraking of verschoning
      toegestaan. De behandeling der zaak kan in dat geval tot een door de voorzitter te bepalen dag en uur worden
      aangehouden.
    url: https://wetten.overheid.nl/BWBR0003222/2002-01-01#Artikel15
  - number: '16'
    text: |-
      Indien een machtiging als bedoeld in [artikel 2:1, tweede lid, van de Algemene wet bestuursrecht][ref1] ontbreekt,
      kan de huurcommissie de zaak aanhouden totdat de betrokken partij in de gelegenheid is geweest op de juiste wijze
      in zijn vertegenwoordiging te voorzien.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel2
    url: https://wetten.overheid.nl/BWBR0003222/2002-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '2'
  - number: '17.1'
    text: |-
      Alvorens een verzoek ter zitting wordt behandeld wordt een voorbereidend onderzoek ingesteld. Een zodanig onderzoek
      blijft achterwege indien de beschikbare stukken naar het oordeel van de voorzitter voldoende zijn ter voorbereiding
      van de zitting.
    url: https://wetten.overheid.nl/BWBR0003222/2002-01-01#Artikel17
  - number: '17.2'
    text: |-
      Het voorbereidend onderzoek wordt ingesteld door de secretaris of door een door hem daartoe aangewezen
      ambtenaar van het bureau der huurcommissie. In bijzondere gevallen kunnen de voorzitter of een of meer leden der
      huurcommissie het onderzoek ook zelf instellen.
    url: https://wetten.overheid.nl/BWBR0003222/2002-01-01#Artikel17
  - number: '17.3'
    text: Onze Minister kan nadere regelen geven ten aanzien van de bij het voorbereidend onderzoek te volgen werkwijze.
    url: https://wetten.overheid.nl/BWBR0003222/2002-01-01#Artikel17
  - number: '17.4'
    text: |-
      Van het ingestelde voorbereidend onderzoek wordt door de secretaris, onderscheidenlijk door de voorzitter of de met
      het onderzoek belaste leden der huurcommissie, een schriftelijk rapport opgemaakt.
    url: https://wetten.overheid.nl/BWBR0003222/2002-01-01#Artikel17
  - number: '17.5'
    text: |-
      Zodra het voorbereidend onderzoek naar het oordeel van de voorzitter voltooid is, of, indien dit onderzoek
      ingevolge het bepaalde in het eerste lid niet wordt ingesteld, reeds aanstonds, bepaalt de voorzitter de dag en het
      uur, waarop het verzoek ter zitting van de huurcommissie zal worden behandeld.
    url: https://wetten.overheid.nl/BWBR0003222/2002-01-01#Artikel17
  - number: '17.6'
    text: |-
      De secretaris geeft partijen daarvan onverwijld, doch ten minste acht dagen voor de dag van de behandeling van het
      verzoek ter zitting, kennis. De kennisgeving gaat vergezeld van een afschrift van het in het vierde lid bedoelde
      rapport of bevat de mededeling dat terzake geen voorbereidend onderzoek nodig is geacht, zulks onder vermelding
      van de redenen die tot dat oordeel hebben geleid. De kennisgeving bevat voorts de mededeling dat de op de zaak
      betrekking hebbende stukken tot de dag der zitting bij het bureau van de huurcommissie ter inzage liggen voor
      partijen of hun schriftelijk gemachtigden.
    url: https://wetten.overheid.nl/BWBR0003222/2002-01-01#Artikel17
  - number: 17a
    text: |-
      De voorzitter van de huurcommissie is bevoegd verzoeken welke gelijkluidend dan wel nagenoeg gelijkluidend zijn
      gevoegd door de huurcommissie te laten behandelen.
    url: https://wetten.overheid.nl/BWBR0003222/2002-01-01#Artikel17a
  - number: 17b
    text: |-
      Indien omtrent dezelfde woonruimte een verzoekschrift ingevolge
      [artikel 18, eerste lid, van de Huurprijzenwet woonruimte][ref1] en een verzoekschrift ingevolge
      [artikel 20, eerste of tweede lid, van die wet][ref2] bij de huurcommissie zijn ingediend, beslist de huurcommissie
      op het eerstgenoemde verzoek alvorens op het andere verzoek te beslissen, tenzij de indiening van het eerstgenoemde
      verzoekschrift heeft plaatsgevonden na het tijdstip waarop volgens het andere verzoekschrift de wijziging van de
      huurprijs dient in te gaan.


      [ref1]: https://wetten.overheid.nl/BWBR0003221#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0003221#Artikel20
    url: https://wetten.overheid.nl/BWBR0003222/2002-01-01#Artikel17b
    references:
      - id: ref1
        bwb_id: BWBR0003221
        artikel: '18'
      - id: ref2
        bwb_id: BWBR0003221
        artikel: '20'
  - number: '18.1'
    text: De voorzitter heeft de leiding der zitting.
    url: https://wetten.overheid.nl/BWBR0003222/2002-01-01#Artikel18
  - number: '18.2'
    text: |-
      Hij en de aan de zitting deelnemende leden van de huurcommissie maken zich voor de aanvang van de behandeling van
      het verzoek bekend en ondervragen vervolgens partijen of hun gemachtigden alsmede door partijen voor de aanvang der
      zitting aan de voorzitter opgegeven getuigen en deskundigen.
    url: https://wetten.overheid.nl/BWBR0003222/2002-01-01#Artikel18
  - number: '18.3'
    text: |-
      Partijen worden daarbij in de gelegenheid gesteld door tussenkomst van de voorzitter terzake dienende vragen tot
      elkaar te richten.
    url: https://wetten.overheid.nl/BWBR0003222/2002-01-01#Artikel18
  - number: '18.4'
    text: Voordat de behandeling ter zitting wordt gesloten, heeft ieder der partijen het recht het woord te voeren.
    url: https://wetten.overheid.nl/BWBR0003222/2002-01-01#Artikel18
  - number: '18.5'
    text: Zodra de behandeling ter zitting gesloten is, deelt de voorzitter mede, wanneer uitspraak zal worden gedaan.
    url: https://wetten.overheid.nl/BWBR0003222/2002-01-01#Artikel18
  - number: '18.6'
    text: |-
      Indien een nader onderzoek noodzakelijk blijkt of indien een onderzoek alsnog wenselijk wordt geacht, kan de
      commissie tot het instellen daarvan besluiten, zulks onder gelijktijdige bepaling wie daarmee is belast. In dat
      geval zijn de verdere bepalingen over het voorbereidend onderzoek van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0003222/2002-01-01#Artikel18
  - number: '19.1'
    text: |-
      De huurcommissie beraadslaagt en beslist in raadkamer en grondt haar uitspraken uitsluitend op hetgeen ter zitting
      is besproken en op de stukken, die overeenkomstig het in [artikel 17, zesde lid][ref1], gegeven voorschrift ter
      inzage zijn gelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0003222#Artikel17
    url: https://wetten.overheid.nl/BWBR0003222/2002-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0003222
        artikel: '17'
        hoofdstuk: IV
  - number: '19.2'
    text: |-
      De uitspraken van de huurcommissie zijn met redenen omkleed en vermelden de namen van degenen die aan de
      behandeling der zaak hebben deelgenomen. Zij worden door de voorzitter en door de secretaris ondertekend.
    url: https://wetten.overheid.nl/BWBR0003222/2002-01-01#Artikel19
  - number: '19.3'
    text: |-
      De secretaris zendt onverwijld aan de huurder en de verhuurder een afschrift van de uitspraak en, desverzocht, aan
      ieder van hen nog ten hoogste twee exemplaren.
    url: https://wetten.overheid.nl/BWBR0003222/2002-01-01#Artikel19
  - number: '19.4'
    text: |-
      Indien in de uitspraak van de huurcommissie wordt vastgesteld dat een woonruimte een of meer ernstige gebreken of
      tekortkomingen in het onderhoud vertoont die het woongenot ernstig schaden zendt de secretaris bovendien afschrift
      aan de inspecteur van de volkshuisvesting en aan burgemeester en wethouders van de gemeente waarin de woonruimte
      is gelegen.
    url: https://wetten.overheid.nl/BWBR0003222/2002-01-01#Artikel19
  - number: '20'
    text: |-
      Alvorens een advies uit te brengen, bedoeld in [artikel 3, eerste lid, onder a en e][ref1], stelt de huurcommissie
      de betrokken huurder en verhuurder in de gelegenheid ter zitting te worden gehoord.


      [ref1]: https://wetten.overheid.nl/BWBR0003222#Artikel3
    url: https://wetten.overheid.nl/BWBR0003222/2002-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0003222
        artikel: '3'
        hoofdstuk: II
  - number: '21'
    text: |-
      De secretaris is bij de zittingen der huurcommissie aanwezig. Hij houdt aantekening van al hetgeen daar wordt
      behandeld met vermelding van de zakelijke inhoud van de verklaringen der door de commissie gehoorde personen.
    url: https://wetten.overheid.nl/BWBR0003222/2002-01-01#Artikel21
  - number: '22.1'
    text: |-
      Ten minste eenmaal per drie maanden verstrekt de secretaris aan Onze Minister een opgave houdende het aantal van
      de sedert de afsluiting van de vorige opgave binnengekomen, door de huurcommissie te behandelen zaken, alsmede het
      aantal sedert dat tijdstip door haar afgedane zaken.
    url: https://wetten.overheid.nl/BWBR0003222/2002-01-01#Artikel22
  - number: '22.2'
    text: |-
      De secretaris houdt voorts een openbaar register aan, waarin met uitzondering van de namen der betrokken huurders
      en verhuurders de in [artikel 3, eerste lid, onder b, c, d, e, f, g en i][ref1], bedoelde uitspraken van de
      huurcommissie in afschrift zijn opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0003222#Artikel3
    url: https://wetten.overheid.nl/BWBR0003222/2002-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0003222
        artikel: '3'
        hoofdstuk: II
  - number: '22.3'
    text: |-
      Onze Minister kan regels stellen omtrent de inrichting van dit register. Tevens kan Onze Minister regels stellen
      met betrekking tot door de secretaris aan te houden andere registers.
    url: https://wetten.overheid.nl/BWBR0003222/2002-01-01#Artikel22
  - number: '23'
    text: |-
      Aan de secretaris worden ter bestrijding van de door de huurcommissie te maken kosten, bureaukosten daaronder
      begrepen, gelden verstrekt.
    url: https://wetten.overheid.nl/BWBR0003222/2002-01-01#Artikel23
  - number: '24.1'
    text: |-
      Een huurcommissie brengt jaarlijks vóór 1 maart aan Onze Minister een verslag uit van haar werkzaamheden. Het wordt
      mede toegezonden aan de kantonrechter met wiens rechtsgebied dat van de huurcommissie samenvalt.
    url: https://wetten.overheid.nl/BWBR0003222/2002-01-01#Artikel24
  - number: '24.2'
    text: |-
      Het verslag wordt ingericht overeenkomstig door Onze Minister te stellen regels. Het ligt voor een ieder ter inzage
      bij het bureau van de huurcommissie.
    url: https://wetten.overheid.nl/BWBR0003222/2002-01-01#Artikel24
  - number: '25.1'
    text: |-
      Onze Minister ziet toe dat de huurcommissies de haar ingevolge de wet opgedragen taken naar behoren vervullen. Hij
      kan de huurcommissies daartoe de nodige aanwijzingen verstrekken.
    url: https://wetten.overheid.nl/BWBR0003222/2002-01-01#Artikel25
  - number: '25.2'
    text: |-
      Desverzocht verstrekken de huurcommissies aan Onze Minister alle inlichtingen die deze uit hoofde van het toezicht
      nodig oordeelt.
    url: https://wetten.overheid.nl/BWBR0003222/2002-01-01#Artikel25
  - number: '28'
    text: |-
      De voorzitter en de leden van een huurcommissie hebben toegang tot alle woon- en bedrijfsruimten, alsmede tot
      ruimte die als zodanig kan worden gebruikt, voorzover dat redelijkerwijs voor de vervulling van hun taak nodig
      is. Zij kunnen zich bij het betreden door bepaalde, door hen aan te wijzen personen doen vergezellen. Zo nodig
      verschaffen zij zich de toegang met behulp van de sterke arm.
    url: https://wetten.overheid.nl/BWBR0003222/2002-01-01#Artikel28
  - number: '29.1'
    text: |-
      De voorzitter van een huurcommissie kan ter uitvoering van de taak, bedoeld in
      [artikel 3, eerste lid, onder a, b en c][ref1], van de verhuurder inzage en het nemen van afschrift vorderen van
      boeken en andere zakelijke bescheiden, waarvan raadpleging door hemzelf, een of meer leden der huurcommissie, de
      secretaris, het personeel bedoeld in [artikel 8, vierde lid][ref2], en de door Onze Minister aangewezen ambtenaren
      redelijkerwijs nodig is.


      [ref1]: https://wetten.overheid.nl/BWBR0003222#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003222#Artikel8
    url: https://wetten.overheid.nl/BWBR0003222/2002-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0003222
        artikel: '3'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0003222
        artikel: '8'
        hoofdstuk: III
  - number: '29.2'
    text: |-
      De verhuurder is verplicht de van hem krachtens het eerste lid gevorderde inzage en het nemen van afschrift
      van boeken en andere zakelijke bescheiden te verlenen, een en ander op de wijze en binnen de termijn, door de
      voorzitter van de huurcommissie te bepalen.
    url: https://wetten.overheid.nl/BWBR0003222/2002-01-01#Artikel29
  - number: '29.3'
    text: |-
      Het niet voldoen aan de in het vorige lid omschreven verplichting wordt gestraft met geldboete van de tweede
      categorie. Het strafbare feit is een overtreding.
    url: https://wetten.overheid.nl/BWBR0003222/2002-01-01#Artikel29
  - number: '30'
    text: |-
      Onze Minister kan nadere regels stellen omtrent de wijze waarop de huurcommissie haar taken ingevolge deze wet
      uitvoert.
    url: https://wetten.overheid.nl/BWBR0003222/2002-01-01#Artikel30
  - number: '32.1'
    text: Deze wet kan worden aangehaald als "Wet op de huurcommissies".
    url: https://wetten.overheid.nl/BWBR0003222/2002-01-01#Artikel32
  - number: '32.2'
    text: Zij treedt in werking op een door Ons te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0003222/2002-01-01#Artikel32
