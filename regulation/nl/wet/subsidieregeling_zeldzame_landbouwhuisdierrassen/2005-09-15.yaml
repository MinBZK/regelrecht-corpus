  - number: '2'
    text: |-
      De minister kan met inachtneming van de volgende bepalingen op aanvraag een subsidie verstrekken ter zake van het
      houden van zeldzame landbouwhuisdieren.
    url: https://wetten.overheid.nl/BWBR0009766/2005-09-15#Artikel2
  - number: '3.1'
    text: |-
      Een subsidie kan worden verstrekt aan natuurlijke personen of rechtspersonen die blijkens hun statuten ten doel
      hebben een landbouwbedrijf te exploiteren, indien:
    url: https://wetten.overheid.nl/BWBR0009766/2005-09-15#Artikel3
  - number: 3.1.a
    text: |-
      zij blijkens de gegevens van het Bedrijfs Registratie Systeem van Dienst Regelingen op het moment van de aanvraag
      van een beschikking tot subsidieverlening voor eigen rekening en risico een landbouwbedrijf exploiteren;
    url: https://wetten.overheid.nl/BWBR0009766/2005-09-15#Artikel3
  - number: 3.1.b
    text: |-
      zij voor eigen rekening en risico op hun landbouwbedrijf een tenminste met 1 GVE overeenkomend aantal zeldzame
      landbouwhuisdieren houden.
    url: https://wetten.overheid.nl/BWBR0009766/2005-09-15#Artikel3
  - number: '3.2'
    text: |-
      Een subsidie kan tevens worden verstrekt aan natuurlijke personen, met uitzondering van de natuurlijke
      personen, bedoeld in het eerste lid, of rechtspersonen die blijkens hun statuten ten doel hebben zeldzame
      landbouwhuisdierrassen, natuurlijke landschappen of het milieu in stand te houden, en voor eigen rekening en risico
      een tenminste met 1 GVE overeenkomend aantal zeldzame landbouwhuisdieren houden.
    url: https://wetten.overheid.nl/BWBR0009766/2005-09-15#Artikel3
  - number: '3.3'
    text: |-
      Indien de aanvraag tot subsidieverlening betrekking heeft op de subsidie als bedoeld in het eerste lid, wordt een
      veebezettingsgetal van maximaal 2,5 GVE per hectare per jaar door de aanvrager in acht genomen voor de zeldzame
      landbouwhuisdieren waarvoor subsidie is verleend.
    url: https://wetten.overheid.nl/BWBR0009766/2005-09-15#Artikel3
  - number: '3.4'
    text: 'Geen subsidie wordt verstrekt indien op het moment van de aanvraag van tot subsidieverlening:'
    url: https://wetten.overheid.nl/BWBR0009766/2005-09-15#Artikel3
  - number: 3.4.a
    text: reeds een subsidie aan de aanvrager is verleend op grond van deze regeling, of
    url: https://wetten.overheid.nl/BWBR0009766/2005-09-15#Artikel3
  - number: 3.4.b
    text: |-
      reeds voor hetzelfde of een vergelijkbaar doel vanwege de staat, een ander overheidsorgaan of de Europese
      Gemeenschap aan de aanvrager een subsidie is verleend.
    url: https://wetten.overheid.nl/BWBR0009766/2005-09-15#Artikel3
  - number: '3.5'
    text: |-
      Indien de fysieke, juridische of financiële structuur van een bedrijf na inwerkingtreding van de regeling
      tot wijziging van deze regeling is of wordt gewijzigd hoofdzakelijk met het doel de verplichtingen, het
      maximumsubsidiebedrag of het bepaalde in het vierde lid, van de Subsidieregeling zeldzame landbouwhuisdieren zoals
      gewijzigd te ontgaan, wordt deze wijziging buiten beschouwing gelaten voor de toepassing van de regeling.
    url: https://wetten.overheid.nl/BWBR0009766/2005-09-15#Artikel3
  - number: '4.1'
    text: |-
      De minister stelt ieder kalenderjaar een subsidieplafond vast ten behoeve van subsidieverlening op grond van deze
      regeling.
    url: https://wetten.overheid.nl/BWBR0009766/2005-09-15#Artikel4
  - number: '4.2'
    text: |-
      Aanvragen worden behandeld in volgorde van binnenkomst, waarbij bepalend is het tijdstip dat een aanvraag
      is ontvangen met het ingevulde formulier, genoemd in [artikel 5, eerste lid][ref1], en de kopie van het
      bedrijfsregister, genoemd in [artikel 5, tweede lid, onderdeel c][ref2], en indien toepasselijk een kopie van de
      statuten van de rechtspersoon.


      [ref1]: https://wetten.overheid.nl/BWBR0009766#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0009766#Artikel5
    url: https://wetten.overheid.nl/BWBR0009766/2005-09-15#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0009766
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0009766
        artikel: '5'
  - number: '5.1'
    text: |-
      De minister stelt jaarlijks een of meer aanvraagperioden vast, in welke perioden aanvragen tot subsidieverlening
      kunnen worden ingediend bij Dienst Regelingen door gebruikmaking van een daartoe bestemd formulier. Per
      aanvraagperiode kan door dezelfde natuurlijke of rechtspersoon slechts één aanvraag worden ingediend. Het besluit
      tot openstelling van een aanvraagperiode wordt bekendgemaakt in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0009766/2005-09-15#Artikel5
  - number: '5.2'
    text: 'De aanvraag tot subsidieverlening bevat:'
    url: https://wetten.overheid.nl/BWBR0009766/2005-09-15#Artikel5
  - number: 5.2.a
    text: |-
      een opgave van het aantal zeldzame landbouwhuisdieren gespecificeerd naar: registratienummer aan of in het dier,
      soort, ras, geslacht, leeftijd en aantal, dat door de aanvrager op de datum van indiening van de aanvraag wordt
      gehouden en waarvoor om subsidieverlening wordt verzocht,
    url: https://wetten.overheid.nl/BWBR0009766/2005-09-15#Artikel5
  - number: 5.2.b
    text: |-
      een door Dienst Regelingen voorgeschreven schriftelijke en gewaarmerkte bevestiging door een erkende organisatie
      als bedoeld in het [Fokkerijbesluit][ref1] van de inschrijving in het stamboek van de, in de opgave van onderdeel
      a, genoemde dieren, en het voldoen van deze ingeschreven dieren aan de in bijlage 1 van deze regeling genoemde
      bloedvoeringspercentages,


      [ref1]: https://wetten.overheid.nl/BWBR0006862
    url: https://wetten.overheid.nl/BWBR0009766/2005-09-15#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0006862
  - number: 5.2.c
    text: |-
      een kopie van het bedrijfsregister dat betrekking heeft op de gehouden zeldzame landbouwhuisdieren waarvoor
      subsidie wordt aangevraagd,
    url: https://wetten.overheid.nl/BWBR0009766/2005-09-15#Artikel5
  - number: 5.2.d
    text: |-
      een verklaring van de aanvrager dat de in de opgave vermelde dieren voldoen aan de in bijlage 1 van deze regeling
      genoemde minimum bloedvoeringspercentages,
    url: https://wetten.overheid.nl/BWBR0009766/2005-09-15#Artikel5
  - number: 5.2.e
    text: |-
      indien toepasselijk: een verklaring van de aanvrager dat het landbouwbedrijf voldoet aan de goede
      landbouwpraktijken,
    url: https://wetten.overheid.nl/BWBR0009766/2005-09-15#Artikel5
  - number: 5.2.f
    text: |-
      een verklaring van de aanvrager dat aan hem geen subsidie is verleend voor hetzelfde doel of een vergelijkbaar doel
      op grond van deze regeling of vanwege de staat, een ander overheidsorgaan of de Europese Gemeenschap,
    url: https://wetten.overheid.nl/BWBR0009766/2005-09-15#Artikel5
  - number: 5.2.g
    text: 'indien toepasselijk: een opgave van het voederareaal,'
    url: https://wetten.overheid.nl/BWBR0009766/2005-09-15#Artikel5
  - number: 5.2.h
    text: 'indien toepasselijk: een afschrift van de statuten van de rechtspersoon, en'
    url: https://wetten.overheid.nl/BWBR0009766/2005-09-15#Artikel5
  - number: 5.2.i
    text: 'indien toepasselijk: afschriften van de hippische registratiebewijzen en bijbehorende schetsen.'
    url: https://wetten.overheid.nl/BWBR0009766/2005-09-15#Artikel5
  - number: '5.3'
    text: |-
      Indien de aanvraag volledig is of na een daartoe strekkend verzoek als bedoeld in
      [artikel 4:5 van de Algemene wet bestuursrecht][ref1] is aangevuld, zendt Dienst Regelingen de aanvrager een
      bevestiging van ontvangst van de aanvraag, waarbij wordt aangegeven op welke datum de aanvraag volledig is
      ontvangen. De minister beslist uiterlijk binnen 12 weken na ontvangst van de aanvraag tot subsidieverlening.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0009766/2005-09-15#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '5.4'
    text: |-
      De minister kan besluiten dat vanaf een door hem te bepalen datum geen aanvragen tot subsidieverlening meer kunnen
      worden ingediend. Zodanig besluit wordt bekendgemaakt in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0009766/2005-09-15#Artikel5
  - number: '6.1'
    text: |-
      De minister kan besluiten dat met betrekking tot het houden van een of meer rassen van zeldzame landbouwhuisdieren
      geen aanvragen tot subsidieverlening meer kunnen worden ingediend indien hem is gebleken dat van deze rassen het
      aantal volwassen vrouwelijke dieren waarvoor subsidie is aangevraagd of verleend groter is dan:
    url: https://wetten.overheid.nl/BWBR0009766/2005-09-15#Artikel6
  - number: 6.1.a
    text: 1000 voor rassen van rund en paard,
    url: https://wetten.overheid.nl/BWBR0009766/2005-09-15#Artikel6
  - number: 6.1.b
    text: 1500 voor schapenrassen.
    url: https://wetten.overheid.nl/BWBR0009766/2005-09-15#Artikel6
  - number: '6.2'
    text: |-
      Voor de toepassing van het eerste lid worden als volwassen aangemerkt vrouwelijke runderen en paarden van twee jaar
      en ouder en vrouwelijke schapen en geiten van 6 maanden en ouder.
    url: https://wetten.overheid.nl/BWBR0009766/2005-09-15#Artikel6
  - number: '6.3'
    text: Van een besluit als bedoeld in het eerste lid geeft de minister kennis in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0009766/2005-09-15#Artikel6
  - number: '6.4'
    text: |-
      Indien ten aanzien van een of meer rassen een besluit als bedoeld in het eerste lid is genomen, wordt voor de
      toepassing van deze regeling ten aanzien van aanvragen tot subsidieverlening welke zijn ingediend na de datum van
      kennisgeving, bedoeld in het tweede lid, geen rekening gehouden met dieren, behorende tot deze rassen.
    url: https://wetten.overheid.nl/BWBR0009766/2005-09-15#Artikel6
  - number: '7.1'
    text: |-
      De beschikking tot subsidieverlening vermeldt per ras het aantal dieren, omgerekend in GVE, waarvoor subsidie wordt
      verleend, alsmede het jaarlijkse bedrag van de subsidie, berekend overeenkomstig het tweede lid.
    url: https://wetten.overheid.nl/BWBR0009766/2005-09-15#Artikel7
  - number: '7.2'
    text: |-
      De subsidie bedraagt € 120,25 per jaar per GVE gehouden zeldzame landbouwhuisdieren tot, indien toepasselijk, een
      maximumbedrag van € 300,60 per hectare voederareaal op het landbouwbedrijf. De subsidie heeft, met uitzondering van
      een subsidie uitsluitend voor schapenrassen, betrekking op ten hoogste dertig GVE per aanvrager.
    url: https://wetten.overheid.nl/BWBR0009766/2005-09-15#Artikel7
  - number: '7.3'
    text: |-
      De subsidie als bedoeld in het tweede lid, wordt verleend voor een tijdvak van vijf jaren te rekenen vanaf de door
      de minister bij het besluit als bedoeld in [artikel 5, eerste lid][ref1], te bepalen datum.


      [ref1]: https://wetten.overheid.nl/BWBR0009766#Artikel5
    url: https://wetten.overheid.nl/BWBR0009766/2005-09-15#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0009766
        artikel: '5'
  - number: '7.4'
    text: 'De subsidieverlening wordt in ieder geval geweigerd indien:'
    url: https://wetten.overheid.nl/BWBR0009766/2005-09-15#Artikel7
  - number: 7.4.a
    text: |-
      de aanvrager door ernstige nalatigheid of opzet een onjuiste aanvraag tot subsidieverlening heeft ingediend,
      onderscheidenlijk
    url: https://wetten.overheid.nl/BWBR0009766/2005-09-15#Artikel7
  - number: 7.4.b
    text: het bedrag van de subsidie, berekend overeenkomstig het tweede lid, minder dan € 120,25 per jaar zou bedragen.
    url: https://wetten.overheid.nl/BWBR0009766/2005-09-15#Artikel7
  - number: '8.1'
    text: |-
      De subsidieontvanger is verplicht gedurende een tijdvak van 5 jaar, te rekenen vanaf de door de minister bij het
      besluit als bedoeld in [artikel 5, eerste lid][ref1], te bepalen datum:


      [ref1]: https://wetten.overheid.nl/BWBR0009766#Artikel5
    url: https://wetten.overheid.nl/BWBR0009766/2005-09-15#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0009766
        artikel: '5'
  - number: 8.1.a
    text: |-
      per ras het aantal zeldzame landbouwhuisdieren op zijn landbouwbedrijf, omgerekend in GVE, op een niveau te
      handhaven dat ten minste gelijk is aan het aantal zeldzame landbouwhuisdieren van dat ras, omgerekend in GVE,
      waarvoor subsidie is verleend,
    url: https://wetten.overheid.nl/BWBR0009766/2005-09-15#Artikel8
  - number: 8.1.b
    text: |-
      een bedrijfsregister en een administratie bij te houden en binnen drie dagen iedere mutatie ten aanzien van een
      zeldzaam landbouwhuisdier te registreren,
    url: https://wetten.overheid.nl/BWBR0009766/2005-09-15#Artikel8
  - number: 8.1.c
    text: 'indien van toepassing: de goede landbouwpraktijken op het gehele landbouwbedrijf in acht te nemen, en'
    url: https://wetten.overheid.nl/BWBR0009766/2005-09-15#Artikel8
  - number: 8.1.d
    text: |-
      indien van toepassing: het veebezettingsgetal als bedoeld in [artikel 3, derde lid][ref1], op het landbouwbedrijf
      in acht te nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0009766#Artikel3
    url: https://wetten.overheid.nl/BWBR0009766/2005-09-15#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0009766
        artikel: '3'
  - number: '8.2'
    text: |-
      De subsidieontvanger is verplicht bij Dienst Regelingen door gebruikmaking van een daartoe bestemd formulier binnen
      twee maanden aangifte te doen van een mutatie van het aantal zeldzame landbouwhuisdieren van een bepaald ras dat
      wordt gehouden, bedoeld in het eerste lid, onderdeel a, onder vermelding van de reden van deze mutatie.
    url: https://wetten.overheid.nl/BWBR0009766/2005-09-15#Artikel8
  - number: '8.3'
    text: |-
      Indien de subsidieontvanger bij de aangifte, bedoeld in het tweede lid, aangeeft dat de daling van het aantal
      op zijn bedrijf gehouden zeldzame landbouwhuisdieren het gevolg is van verkoop, sterfte of noodslachting,
      heeft deze daling geen gevolgen voor de beschikking tot subsidieverlening onderscheidenlijk de beschikking tot
      subsidievaststelling, mits:
    url: https://wetten.overheid.nl/BWBR0009766/2005-09-15#Artikel8
  - number: 8.3.a)
    text: |-
      het verkochte, gestorven of in nood geslachte zeldzame landbouwhuisdier van het betrokken ras binnen 2 maanden na
      de datum waarop het dier het bedrijf heeft verlaten is vervangen door een zeldzaam landbouwhuisdier van hetzelfde
      ras en met dezelfde waarde in GVE,
    url: https://wetten.overheid.nl/BWBR0009766/2005-09-15#Artikel8
  - number: 8.3.b)
    text: |-
      de vervanging binnen een termijn van 2 maanden als bedoeld in onderdeel a, door middel van het door Dienst
      Regelingen voorgeschreven formulier aan Dienst Regelingen is gemeld, en
    url: https://wetten.overheid.nl/BWBR0009766/2005-09-15#Artikel8
  - number: 8.3.c)
    text: |-
      het vervangende dier op het moment van vervanging is geregistreerd door een erkende organisatie als bedoeld in
      [artikel 3 van het Fokkerijbesluit][ref1] en ingeschreven is in het stamboek.


      [ref1]: https://wetten.overheid.nl/BWBR0006862#Artikel3
    url: https://wetten.overheid.nl/BWBR0009766/2005-09-15#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0006862
        artikel: '3'
  - number: '8.4'
    text: |-
      Indien de subsidie-ontvanger bij de aangifte, bedoeld in het tweede lid, aantoont dat de daling van het aantal op
      zijn bedrijf gehouden zeldzame landbouwhuisdieren van een bepaald ras het gevolg is van overmacht heeft deze daling
      geen gevolgen voor de beschikking tot subsidieverlening. De subsidie-ontvanger is in dat geval verplicht het aantal
      zeldzame landbouwhuisdieren van het betrokken ras binnen een jaar na de datum van de aangifte weer terug te brengen
      op het niveau, bedoeld in het eerste lid, onderdeel a.
    url: https://wetten.overheid.nl/BWBR0009766/2005-09-15#Artikel8
  - number: '9.1'
    text: |-
      De subsidie-ontvanger dient telkens binnen vier weken nadat een heel jaar van het tijdvak, bedoeld
      in [artikel 8, eerste lid, onderdeel a][ref1], is verstreken, bij Dienst Regelingen een aanvraag tot
      subsidievaststelling in door gebruikmaking van een daartoe bestemd formulier.


      [ref1]: https://wetten.overheid.nl/BWBR0009766#Artikel8
    url: https://wetten.overheid.nl/BWBR0009766/2005-09-15#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0009766
        artikel: '8'
  - number: '9.2'
    text: |-
      De aanvraag tot subsidievaststelling gaat vergezeld van een afschrift van het register, bedoeld in
      [artikel 8, eerste lid, onder b][ref1], naar de stand van de laatste dag van het jaar waarop de aanvraag
      betrekking heeft, alsmede van schriftelijke bescheiden uit de administratie van de subsidie-ontvanger, waaruit
      blijkt dat de in het register vermelde dieren zijn geregistreerd door een erkende organisatie als bedoeld in
      [artikel 3 van het Fokkerijbesluit][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009766#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0006862#Artikel3
    url: https://wetten.overheid.nl/BWBR0009766/2005-09-15#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0009766
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0006862
        artikel: '3'
  - number: '9.3'
    text: |-
      De subsidieontvanger voegt bij de aanvraag tot subsidievaststelling als bedoeld in het eerste lid, een
      verklaring dat de in de opgave vermelde dieren voldoen aan de in bijlage 1 van deze regeling genoemde minimum
      bloedvoeringspercentages.
    url: https://wetten.overheid.nl/BWBR0009766/2005-09-15#Artikel9
  - number: '10.1'
    text: |-
      [Artikel 4:49, eerste lid, onderdeel c, Algemene wet bestuursrecht][ref1] vindt geen toepassing ten aanzien van de
      reeds uitbetaalde subsidie indien niet-nakoming van de uit deze regeling voortvloeiende verplichtingen het gevolg
      is van:


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0009766/2005-09-15#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 10.1.a
    text: overlijden van de subsidieontvanger,
    url: https://wetten.overheid.nl/BWBR0009766/2005-09-15#Artikel10
  - number: 10.1.b
    text: langdurige arbeidsongeschiktheid van de aanvrager,
    url: https://wetten.overheid.nl/BWBR0009766/2005-09-15#Artikel10
  - number: 10.1.c
    text: overmacht,
    url: https://wetten.overheid.nl/BWBR0009766/2005-09-15#Artikel10
  - number: 10.1.d
    text: |-
      onteigening of gedwongen verkoop in de zin van de [Onteigeningswet][ref1], voorzover deze onteigening of gedwongen
      verkoop niet te voorzien was op de dag waarop de aanvraag tot subsidieverlening is ingediend,


      [ref1]: https://wetten.overheid.nl/BWBR0001842
    url: https://wetten.overheid.nl/BWBR0009766/2005-09-15#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0001842
  - number: 10.1.e
    text: een epizoötie die de gehele veestapel of een deel daarvan heeft getroffen, of
    url: https://wetten.overheid.nl/BWBR0009766/2005-09-15#Artikel10
  - number: 10.1.f
    text: |-
      een uitbraak van een epizoötie waardoor de gehele veestapel of een deel daarvan preventief is gedood ten behoeve
      van de bestrijding van de uitbraak.
    url: https://wetten.overheid.nl/BWBR0009766/2005-09-15#Artikel10
  - number: '10.2'
    text: |-
      Een subsidieontvanger dient het beroep op een van de in het eerste lid bedoelde gevallen bij Dienst Regelingen in
      binnen een termijn van een maand, te rekenen vanaf het tijdstip waarop dit voor hem mogelijk is. Dit beroep gaat
      vergezeld van bewijzen.
    url: https://wetten.overheid.nl/BWBR0009766/2005-09-15#Artikel10
  - number: 10a.1
    text: |-
      De subsidieverlening of -vaststelling wordt overeenkomstig het tweede tot en met vierde lid gewijzigd
      onderscheidenlijk overeenkomstig het vijfde lid ingetrokken indien op enig moment, behoudens de situatie, bedoeld
      in [artikel 8, derde lid][ref1] of [artikel 10, eerste lid][ref2], wordt vastgesteld dat het aantal in de aanvraag
      tot subsidieverlening of de aanvraag subsidievaststelling aangegeven dieren, omgerekend in GVE, verschilt van het
      aantal aanwezige dieren, omgerekend in GVE, waarvoor subsidie is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0009766#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0009766#Artikel10
    url: https://wetten.overheid.nl/BWBR0009766/2005-09-15#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0009766
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0009766
        artikel: '10'
  - number: 10a.2
    text: |-
      Het subsidiebedrag per dier wordt voor het betrokken verplichtingenjaar verminderd met: het percentage dat
      overeenkomt met het bevonden verschil, indien dit niet hoger is dan 2 dieren.
    url: https://wetten.overheid.nl/BWBR0009766/2005-09-15#Artikel10a
  - number: 10a.3
    text: |-
      Het subsidiebedrag per dier wordt, indien het bevonden verschil groter is dan 2 dieren, voor het betrokken
      verplichtingenjaar verminderd met:
    url: https://wetten.overheid.nl/BWBR0009766/2005-09-15#Artikel10a
  - number: 10a.3.a
    text: het percentage dat overeenkomt met het bevonden verschil, indien dit verschil niet groter is dan 10%;
    url: https://wetten.overheid.nl/BWBR0009766/2005-09-15#Artikel10a
  - number: 10a.3.b
    text: |-
      het dubbele van het percentage dat overeenkomt met het bevonden verschil, indien dit hoger is dan 10% doch niet
      hoger dan 20%;
    url: https://wetten.overheid.nl/BWBR0009766/2005-09-15#Artikel10a
  - number: 10a.3.c
    text: 100%, indien het bevonden verschil hoger is dan 20%.
    url: https://wetten.overheid.nl/BWBR0009766/2005-09-15#Artikel10a
  - number: 10a.4
    text: |-
      Indien de in [artikel 9, eerste lid][ref1], bedoelde aanvraag tot subsidievaststelling wordt ingediend na de
      uiterste termijn voor indiening, wordt de subsidie met 1% per werkdag, tot en met een maximum van 25 dagen, lager
      vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0009766#Artikel9
    url: https://wetten.overheid.nl/BWBR0009766/2005-09-15#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0009766
        artikel: '9'
  - number: 10a.5
    text: |-
      Indien de aanvrager door ernstige nalatigheid of opzet een onjuiste aanvraag tot subsidieverlening of -vaststelling
      heeft ingediend of de aanvraag tot subsidievaststelling langer dan 25 dagen na de uiterste datum heeft ingediend,
      wordt de subsidieverlening of -vaststelling geweigerd onderscheidenlijk ingetrokken.
    url: https://wetten.overheid.nl/BWBR0009766/2005-09-15#Artikel10a
  - number: '11'
    text: |-
      Indien toepassing wordt gegeven aan [artikel 4:57 van de Algemene wet bestuursrecht][ref1] of
      [artikel 6 van de Kaderwet LNV-subsidies][ref2], betaalt de subsidie-ontvanger onverschuldigd uitgekeerde bedragen
      op eerste verzoek daartoe terug, vermeerderd met de wettelijke rente vanaf het moment van betaling tot de datum
      van terugbetaling.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0009194#Artikel6
    url: https://wetten.overheid.nl/BWBR0009766/2005-09-15#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0009194
        artikel: '6'
  - number: '12.1'
    text: |-
      Indien de subsidie-ontvanger voor de afloop van de periode van vijf jaar, bedoeld in
      [artikel 8, eerste lid, onderdeel a][ref1], overlijdt, het gehele landbouwbedrijf verkoopt, verpacht of daarop een
      gebruiksrecht vestigt, kan zijn bedrijfsopvolger zich er tegenover de minister toe verbinden de verplichtingen van
      de subsidie-ontvanger voortvloeiende uit deze regeling verder na te komen. De bedrijfsopvolger meldt dit onverwijld
      schriftelijk aan Dienst Regelingen. Voor de toepassing van deze regeling wordt de bedrijfsopvolger die de in de
      eerste volzin bedoelde verbintenis aangaat, vanaf het moment dat deze verbintenis is aangegaan aangemerkt als de
      subsidie-ontvanger.


      [ref1]: https://wetten.overheid.nl/BWBR0009766#Artikel8
    url: https://wetten.overheid.nl/BWBR0009766/2005-09-15#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0009766
        artikel: '8'
  - number: '12.2'
    text: |-
      Indien voor de afloop van de periode van vijf jaar, bedoeld in [artikel 8, eerste lid, onderdeel a][ref1],
      de subsidie-ontvanger overlijdt, zonder dat er een bedrijfsopvolger is die de in het eerste lid bedoelde
      verbintenis aangaat, of het betrokken bedrijf voorwerp is van onteigening of gedwongen verkoop in de zin van
      de [Onteigeningswet][ref2], trekt de minister de beschikking tot subsidieverlening in voor het resterende deel
      van deze periode. Vóór de intrekking van de subsidieverlening gegeven beschikkingen tot subsidievaststelling
      worden in dit geval niet ingetrokken of gewijzigd op de grond dat niet is voldaan aan de verplichting, bedoeld in
      [artikel 8, eerste lid, onderdeel a][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0009766#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0001842
      [ref3]: https://wetten.overheid.nl/BWBR0009766#Artikel8
    url: https://wetten.overheid.nl/BWBR0009766/2005-09-15#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0009766
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0001842
      - id: ref3
        bwb_id: BWBR0009766
        artikel: '8'
  - number: '13.1'
    text: |-
      De Algemene Inspectiedienst van het Ministerie van Landbouw, Natuur en Voedselkwaliteit is belast met het toezicht
      op de naleving van de in deze regeling gestelde voorschriften.
    url: https://wetten.overheid.nl/BWBR0009766/2005-09-15#Artikel13
  - number: 13a.1
    text: De subsidie wordt verleend onder voorbehoud van goedkeuring van de Commissie van de Europese Gemeenschappen.
    url: https://wetten.overheid.nl/BWBR0009766/2005-09-15#Artikel13a
  - number: 13a.2
    text: |-
      De beslissing tot verlening van de subsidie kan worden gewijzigd of ingetrokken indien dit noodzakelijk is in
      verband met het verkrijgen van de goedkeuring van de Commissie van de Europese Gemeenschappen voor deze regeling of
      wegens het uitblijven daarvan.
    url: https://wetten.overheid.nl/BWBR0009766/2005-09-15#Artikel13a
  - number: '14'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0009766/2005-09-15#Artikel14
  - number: '15'
    text: 'Deze regeling wordt aangehaald als: Subsidieregeling zeldzame landbouwhuisdierrassen.'
    url: https://wetten.overheid.nl/BWBR0009766/2005-09-15#Artikel15
