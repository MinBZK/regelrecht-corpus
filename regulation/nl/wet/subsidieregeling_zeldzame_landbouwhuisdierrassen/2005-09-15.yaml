preamble:
  text: |-
    Gelet op artikel 2, eerste lid, onderdeel d, van Verordening (EEG) nr. 2078/92 van de Raad van de Europese
    Gemeenschappen van 30 juni 1992 en Verordening (EG) nr. 746/96 van de Commissie van de Europese Gemeenschappen van
    24 april 1996;

    Gelet op de artikelen 15 en 19 van de Landbouwwet en artikel 2 van de Kaderwet LNV-subsidies;

    Gezien de goedkeuring van de Commissie van de Europese Gemeenschappen van 24 november 1997, nr. C(97)3096;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0009766/2005-09-15#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

            a
             de minister:

              de Minister van Landbouw, Natuur en Voedselkwaliteit;



            b
             landbouwbedrijf:

              geheel van productie-eenheden in Nederland, bestaande uit één of meer gebouwen of gedeelten daarvan en
      daarbij behorende cultuurgrond, uitsluitend of ondermeer dienende tot uitoefening van de landbouw;



            c
             rechtspersoon:

              rechtspersoon, anders dan een publiekrechtelijke rechtspersoon;



            d
            zeldzame landbouwhuisdieren:

              runderen, paarden of schapen, die blijkens een registratie door een ingevolge
      [artikel 3 van het Fokkerijbesluit][ref1] erkende organisatie voor ten minste de in bijlage I bij deze regeling
      genoemde bloedvoeringspercentages behoren tot een ras dat is opgenomen in [bijlage I][ref2];



            e
             Dienst Regelingen:

              Dienst Regelingen van het Ministerie van Landbouw, Natuur en Voedselkwaliteit;



            f
             GVE:

              grootvee-eenheid als bedoeld in bijlage II bij deze regeling.



            g
             mutatie:

              iedere, voor het bedrijfsregister relevante, wijziging ten aanzien van het zeldzame landbouwhuisdier
      waarvoor subsidie is aangevraagd, daaronder begrepen aanvoer, afvoer, geboorte en dood;



            h
             bedrijfsregister:

              een door Dienst Regelingen voorgeschreven register van de gehouden zeldzame landbouwhuisdieren waarvoor
      subsidie is of wordt aangevraagd, gespecificeerd naar registratienummer aan of in het dier of bij paarden naar
      hippisch registratiebewijs met bijbehorende schets, soort, ras, geslacht, leeftijd en aantal, waarin tevens iedere
      mutatie ten aanzien van een zeldzaam landbouwhuisdier waarvoor subsidie is aangevraagd wordt vermeld;



            i
            voederareaal:

              oppervlakte in gebruik door het landbouwbedrijf ten behoeve van het voederen van de zeldzame
      landbouwhuisdieren, waarvoor subsidie is aangevraagd of verleend;



            j
             bedrijfsadministratie:

              geheel aan gegevens omtrent mutaties, koop, verkoop, destructie, keuring en andere relevante bescheiden ten
      aanzien van de gehouden zeldzame landbouwhuisdieren waarvoor subsidie is aangevraagd evenals alle bescheiden ten
      aanzien van het voederareaal;



            k
             goede landbouwpraktijken:

              de geldende nationale en Europese minimumnormen op het gebied van milieu, dierenwelzijn en
      hygiëne, hetgeen in ieder geval omvat de geldende normen bij of krachtens de Wet milieubeheer, de
      Wet verontreiniging oppervlaktewater, de [Meststoffenwet][ref3], de [Wet bodembescherming][ref4],
      de [Bestrijdingsmiddelenwet 1962][ref5], de [Gezondheids- en welzijnswet voor dieren][ref6], de
      [Diergeneesmiddelenwet][ref7] en de [Plantenziektenwet][ref8];



            l
            veebezettingsgetal:

              getal dat de verhouding weergeeft tussen het aantal GVE aan gehouden en gesubsideerde zeldzame
      landbouwhuisdieren en het voederareaal van het bedrijf dat voor de voedering van deze zeldzame landbouwhuisdieren
      wordt gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0006862#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0009766
      [ref3]: https://wetten.overheid.nl/BWBR0003818
      [ref4]: https://wetten.overheid.nl/BWBR0003818
      [ref5]: https://wetten.overheid.nl/BWBR0003818
      [ref6]: https://wetten.overheid.nl/BWBR0003818
      [ref7]: https://wetten.overheid.nl/BWBR0003818
      [ref8]: https://wetten.overheid.nl/BWBR0002075
