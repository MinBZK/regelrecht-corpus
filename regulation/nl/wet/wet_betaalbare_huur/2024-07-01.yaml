publication_date: '2024-06-28'
valid_from: '2024-07-01'
bwb_id: BWBR0049889
url: https://wetten.overheid.nl/BWBR0049889/2024-07-01
preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die dezen zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is een groter segment huurwoningen te reguleren en de
    rechten van huurders beter te waarborgen;

    Zo is het dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-Generaal,
    hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0049889/2024-07-01#ArtikelAanhef
articles:
  - number: VI
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties zendt binnen vijf jaar en vervolgens elke vijf jaar
      na het tijdstip van inwerkingtreding van deze wet aan de Staten-Generaal een verslag over de doeltreffendheid en
      de effecten van deze wet in de praktijk, waarbij in het bijzonder aandacht wordt besteed aan de betaalbaarheid
      van huren voor middeninkomens, de investeringen in nieuwbouw en verduurzaming van middenhuurwoningen door
      particulieren, investeerders en woningcorporaties, de gevolgen voor de omvang van de diverse huursegmenten alsmede
      de gevolgen voor de woonkansen van verschillende groepen woningzoekenden op de woningmarkt, de uitvoerbaarheid
      van de middenhuurregulering voor de Huurcommissie en gemeenten en andere effecten van de middenhuurregulering voor
      huurders en verhuurders.
    url: https://wetten.overheid.nl/BWBR0049889/2024-07-01#ArtikelVI
  - number: VII
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip dat voor de verschillende artikelen of
      onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0049889/2024-07-01#ArtikelVII
  - number: VIII
    text: 'Deze wet wordt aangehaald als: Wet betaalbare huur.'
    url: https://wetten.overheid.nl/BWBR0049889/2024-07-01#ArtikelVIII
