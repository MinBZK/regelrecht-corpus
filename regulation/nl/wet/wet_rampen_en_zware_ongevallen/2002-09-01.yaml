---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_rampen_en_zware_ongevallen
regulatory_layer: WET
publication_date: '2004-12-23'
valid_from: '2002-09-01'
bwb_id: BWBR0003765
url: https://wetten.overheid.nl/BWBR0003765/2002-09-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is regels te geven over de rampenbestrijding en over de
    voorbereiding daarop,;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0003765/2002-09-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0003765/2002-09-01#Artikel1
  - number: 1.a
    text: 'Onze Minister: Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties;'
    url: https://wetten.overheid.nl/BWBR0003765/2002-09-01#Artikel1
  - number: 1.b
    text: 'ramp of zwaar ongeval: een gebeurtenis'
    url: https://wetten.overheid.nl/BWBR0003765/2002-09-01#Artikel1
  - number: 1.b.1°
    text: |-
      waardoor een ernstige verstoring van de openbare veiligheid is ontstaan, waarbij het leven en de gezondheid van
      vele personen, het milieu of grote materiële belangen in ernstige mate worden bedreigd of zijn geschaad, en
    url: https://wetten.overheid.nl/BWBR0003765/2002-09-01#Artikel1
  - number: 1.b.2°
    text: |-
      waarbij een gecoördineerde inzet van diensten en organisaties van verschillende disciplines is vereist om de
      dreiging weg te nemen of de schadelijke gevolgen te beperken.
    url: https://wetten.overheid.nl/BWBR0003765/2002-09-01#Artikel1
  - number: '2'
    text: |-
      Burgemeester en wethouders zijn belast met de voorbereiding van de bestrijding van rampen en zware ongevallen in
      de gemeente, voor zover niet bij of krachtens de wet anders is bepaald. Zij bevorderen in het bijzonder het houden
      van oefeningen en de totstandkoming van afspraken, die nodig zijn voor een doelmatige bestrijding van rampen en
      zware ongevallen.
    url: https://wetten.overheid.nl/BWBR0003765/2002-09-01#Artikel2
  - number: 2a.1
    text: |-
      Burgemeester en wethouders dragen er zorg voor dat de bevolking, Onze commissaris in de provincie, en Onze Minister
      op passende wijze informatie wordt verschaft over de rampen en zware ongevallen die de bevolking en het milieu
      kunnen treffen, de maatregelen die zijn getroffen ter voorkoming en bestrijding van deze rampen en zware ongevallen
      en de bij deze rampen en zware ongevallen te volgen gedragslijn.
    url: https://wetten.overheid.nl/BWBR0003765/2002-09-01#Artikel2a
  - number: 2a.2
    text: |-
      Burgemeester en wethouders dragen er zorg voor dat de bij de bestrijding van rampen en zware ongevallen betrokken
      personen op passende wijze informatie wordt verschaft over de rampen en zware ongevallen die de bevolking en het
      milieu kunnen treffen, de risico’s die hun inzet kan hebben voor hun gezondheid en de voorzorgsmaatregelen die in
      verband daarmee zijn of zullen worden getroffen.
    url: https://wetten.overheid.nl/BWBR0003765/2002-09-01#Artikel2a
  - number: 2a.3
    text: |-
      Onze Minister draagt er zorg voor dat alle staten waarvan de bevolking en het milieu door rampen en zware
      ongevallen op Nederlands grondgebied kunnen worden getroffen, de informatie over de onderwerpen, bedoeld in het
      eerste lid, wordt verschaft, voor zover deze niet reeds op grond van andere voorschriften is verschaft.
    url: https://wetten.overheid.nl/BWBR0003765/2002-09-01#Artikel2a
  - number: 2a.4
    text: |-
      Bij algemene maatregel van bestuur worden nadere regels gegeven over de inhoud van de informatie, bedoeld in het
      eerste, tweede en derde lid, en over de wijze waarop de in die leden bedoelde taken worden uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0003765/2002-09-01#Artikel2a
  - number: 2b
    text: |-
      Indien een ramp of een zwaar ongeval heeft plaatsgevonden, dragen burgemeester en wethouders van de gemeente
      waar de ramp of het zware ongeval zich heeft voorgedaan, zorg voor een volledige analyse van de ramp of het zware
      ongeval en doen zij zo nodig aanbevelingen om een soortgelijke ramp of een soortgelijk zwaar ongeval in de toekomst
      te voorkomen en de gevolgen ervan te beperken.
    url: https://wetten.overheid.nl/BWBR0003765/2002-09-01#Artikel2b
  - number: 2c.1
    text: |-
      Een ieder die beschikt over relevante veiligheidstechnische gegevens, verschaft burgemeester en wethouders, de
      burgemeester en het bestuur van de regionale brandweer de informatie die nodig is opdat zij hun taken in het kader
      van de voorbereiding van de bestrijding van rampen en zware ongevallen naar behoren kunnen uitvoeren. Dit geldt
      niet voor zover deze informatie reeds op grond van andere voorschriften is verschaft of kan worden verkregen.
    url: https://wetten.overheid.nl/BWBR0003765/2002-09-01#Artikel2c
  - number: 2c.2
    text: |-
      Burgemeester en wethouders kunnen bevelen dat een krachtens [artikel 7, derde lid][ref1], aangewezen inrichting
      niet in bedrijf gesteld wordt indien degene die de inrichting gaat drijven niet aan de in het eerste lid bedoelde
      verplichting tot informatieverstrekking heeft voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0003765#Artikel7
    url: https://wetten.overheid.nl/BWBR0003765/2002-09-01#Artikel2c
    references:
      - id: ref1
        bwb_id: BWBR0003765
        artikel: '7'
        hoofdstuk: II
        paragraaf: '3'
  - number: 2c.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld omtrent de informatieverschaffing,
      bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0003765/2002-09-01#Artikel2c
  - number: 2c.4
    text: |-
      Het eerste lid is niet van toepassing op gegevens waarvan de geheimhouding door het belang van de veiligheid van de
      staat is geboden.
    url: https://wetten.overheid.nl/BWBR0003765/2002-09-01#Artikel2c
  - number: '3.1'
    text: De gemeenteraad stelt voor het gehele gebied van de gemeente een rampenplan vast.
    url: https://wetten.overheid.nl/BWBR0003765/2002-09-01#Artikel3
  - number: '3.2'
    text: |-
      In het rampenplan kan worden bepaald, dat burgemeester en wethouders volgens in het plan te geven regels het plan
      moeten uitwerken of binnen daarbij te bepalen grenzen het plan kunnen wijzigen.
    url: https://wetten.overheid.nl/BWBR0003765/2002-09-01#Artikel3
  - number: '4.1'
    text: 'Het rampenplan dient in ieder geval te bevatten:'
    url: https://wetten.overheid.nl/BWBR0003765/2002-09-01#Artikel4
  - number: 4.1.a
    text: begripsomschrijvingen;
    url: https://wetten.overheid.nl/BWBR0003765/2002-09-01#Artikel4
  - number: 4.1.b
    text: een overzicht van de soorten rampen en zware ongevallen die de gemeente kunnen bedreigen;
    url: https://wetten.overheid.nl/BWBR0003765/2002-09-01#Artikel4
  - number: 4.1.c
    text: |-
      een overzicht van diensten, instanties, organisaties en individuele personen, die bij de bestrijding van rampen en
      zware ongevallen kunnen worden betrokken;
    url: https://wetten.overheid.nl/BWBR0003765/2002-09-01#Artikel4
  - number: 4.1.d
    text: |-
      een schema met betrekking tot de leiding over en de gecoördineerde inzet van diensten en organisaties bij de
      bestrijding van rampen en zware ongevallen;
    url: https://wetten.overheid.nl/BWBR0003765/2002-09-01#Artikel4
  - number: 4.1.e
    text: een intern en extern verbindings- en alarmeringsschema;
    url: https://wetten.overheid.nl/BWBR0003765/2002-09-01#Artikel4
  - number: 4.1.f
    text: |-
      regels over de wijze waarop burgemeester en wethouders de informatie, bedoeld in [artikel 2][ref1], verschaffen, en
      over de wijze waarop de burgemeester de informatie, bedoeld in [artikel 11][ref2], verschaft, alsmede een plan in
      hoofdlijnen met betrekking tot de waarschuwing van de bevolking;


      [ref1]: https://wetten.overheid.nl/BWBR0003765#Artikel2a
      [ref2]: https://wetten.overheid.nl/BWBR0003765#Artikel11a
    url: https://wetten.overheid.nl/BWBR0003765/2002-09-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003765
        artikel: 2a
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0003765
        artikel: 11a
        hoofdstuk: III
  - number: 4.1.g
    text: een plan in hoofdlijnen met betrekking tot maatregelen te nemen bij een verplaatsing van bevolking;
    url: https://wetten.overheid.nl/BWBR0003765/2002-09-01#Artikel4
  - number: 4.1.h
    text: |-
      een plan in hoofdlijnen met betrekking tot de geneeskundige organisatie op het terrein waar een ramp of een zwaar
      ongeval heeft plaatsgevonden;
    url: https://wetten.overheid.nl/BWBR0003765/2002-09-01#Artikel4
  - number: 4.1.i
    text: een plan in hoofdlijnen met betrekking tot de opvang en verzorging van slachtoffers;
    url: https://wetten.overheid.nl/BWBR0003765/2002-09-01#Artikel4
  - number: 4.1.j
    text: een plan in hoofdlijnen met betrekking tot de voedselvoorziening van de bevolking;
    url: https://wetten.overheid.nl/BWBR0003765/2002-09-01#Artikel4
  - number: 4.1.k
    text: |-
      een plan in hoofdlijnen met betrekking tot maatregelen ten behoeve van de bevoorrading van met de bestrijding van
      rampen en zware ongevallen belaste diensten en organisaties;
    url: https://wetten.overheid.nl/BWBR0003765/2002-09-01#Artikel4
  - number: 4.1.l
    text: een plan in hoofdlijnen met betrekking tot het beperken van de schadelijke gevolgen;
    url: https://wetten.overheid.nl/BWBR0003765/2002-09-01#Artikel4
  - number: 4.1.m
    text: regels over de vastlegging van gegevens met betrekking tot veroorzaakte schade;
    url: https://wetten.overheid.nl/BWBR0003765/2002-09-01#Artikel4
  - number: 4.1.n
    text: regels over de organisatie en inrichting van een centraal registratie- en inlichtingenbureau;
    url: https://wetten.overheid.nl/BWBR0003765/2002-09-01#Artikel4
  - number: 4.1.o
    text: regels over de verslaglegging;
    url: https://wetten.overheid.nl/BWBR0003765/2002-09-01#Artikel4
  - number: 4.1.p
    text: een verzendlijst.
    url: https://wetten.overheid.nl/BWBR0003765/2002-09-01#Artikel4
  - number: '4.2'
    text: |-
      Het rampenplan is afgestemd op calamiteitenplannen als bedoeld in [artikel 69 van de Waterstaatswet 1900][ref1] die
      betrekking hebben op geheel of ten dele binnen de gemeentegrenzen gelegen waterstaatswerken, alsmede op plannen,
      vastgesteld voor het gebied van aangrenzende gemeenten en van aangrenzende gebieden in andere staten.


      [ref1]: https://wetten.overheid.nl/BWBR0001867#Artikel69
    url: https://wetten.overheid.nl/BWBR0003765/2002-09-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0001867
        artikel: '69'
  - number: '5.1'
    text: |-
      Het rampenplan wordt uiterlijk een maand na de vaststelling door burgemeester en wethouders aan gedeputeerde
      staten en, ter kennisneming, aan Onze commissaris in de provincie alsmede aan de bestuursorganen die binnen de
      gemeentegrenzen zijn belast met aangelegenheden betreffende de waterstaatszorg gezonden.
    url: https://wetten.overheid.nl/BWBR0003765/2002-09-01#Artikel5
  - number: '5.2'
    text: |-
      Wijzigingen in het rampenplan alsmede uitwerkingen daarvan, als bedoeld in [artikel 3, tweede lid][ref1], worden
      uiterlijk een maand na de vaststelling aan gedeputeerde staten, en ter kennisneming, aan Onze commissaris in de
      provincie alsmede aan de bestuursorganen die binnen de gemeentegrenzen zijn belast met aangelegenheden betreffende
      de waterstaatszorg gezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0003765#Artikel3
    url: https://wetten.overheid.nl/BWBR0003765/2002-09-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003765
        artikel: '3'
        hoofdstuk: II
        paragraaf: '2'
  - number: '6.1'
    text: |-
      Gedeputeerde staten kunnen het gemeentebestuur uitnodigen het rampenplan, de uitwerkingen en wijzigingen, als
      bedoeld in [artikel 3, tweede lid][ref1], daaronder begrepen, binnen een door hen te bepalen termijn te wijzigen,
      indien zij van oordeel zijn dat het plan niet voldoet aan de eisen, bij de wet gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003765#Artikel3
    url: https://wetten.overheid.nl/BWBR0003765/2002-09-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0003765
        artikel: '3'
        hoofdstuk: II
        paragraaf: '2'
  - number: '6.2'
    text: |-
      Gedeputeerde staten plegen alvorens gebruik te maken van hun bevoegdheid, bedoeld in het eerste lid, overleg met
      het betrokken gemeentebestuur.
    url: https://wetten.overheid.nl/BWBR0003765/2002-09-01#Artikel6
  - number: '6.3'
    text: |-
      Indien het gemeentebestuur geen gevolg geeft aan een uitnodiging op grond van het eerste lid, gaan gedeputeerde
      staten op kosten van de gemeente tot wijziging van het rampenplan over.
    url: https://wetten.overheid.nl/BWBR0003765/2002-09-01#Artikel6
  - number: '7.1'
    text: |-
      De burgemeester stelt voor elke ramp of elk zwaar ongeval, waarvan de plaats, de aard en de gevolgen voorzienbaar
      zijn, een rampbestrijdingsplan vast, waarin het geheel van bij die ramp of dat zware ongeval te nemen maatregelen
      is opgenomen.
    url: https://wetten.overheid.nl/BWBR0003765/2002-09-01#Artikel7
  - number: '7.2'
    text: |-
      Het rampbestrijdingsplan is afgestemd op calamiteitenplannen als bedoeld in
      [artikel 69 van de Waterstaatswet 1900][ref1] die betrekking hebben op geheel of ten dele binnen de gemeentegrenzen
      gelegen waterstaatswerken, alsmede op plannen, vastgesteld voor het gebied van aangrenzende gemeenten en van
      aangrenzende gebieden in andere staten.


      [ref1]: https://wetten.overheid.nl/BWBR0001867#Artikel69
    url: https://wetten.overheid.nl/BWBR0003765/2002-09-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0001867
        artikel: '69'
  - number: '7.3'
    text: |-
      Een rampbestrijdingsplan wordt in ieder geval vastgesteld voor bij algemene maatregel van bestuur aan te wijzen
      rampen en zware ongevallen. Bij of krachtens die maatregel worden regels gesteld omtrent:
    url: https://wetten.overheid.nl/BWBR0003765/2002-09-01#Artikel7
  - number: 7.3.a
    text: de inhoud van het rampbestrijdingsplan;
    url: https://wetten.overheid.nl/BWBR0003765/2002-09-01#Artikel7
  - number: 7.3.b
    text: |-
      het raadplegen van de bevolking bij het opstellen van het rampbestrijdingsplan en van belangrijke wijzigingen van
      dat plan;
    url: https://wetten.overheid.nl/BWBR0003765/2002-09-01#Artikel7
  - number: 7.3.c
    text: het periodiek beproeven en actualiseren van het rampbestrijdingsplan;
    url: https://wetten.overheid.nl/BWBR0003765/2002-09-01#Artikel7
  - number: 7.3.d
    text: de bekendmaking van een besluit, bedoeld in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0003765/2002-09-01#Artikel7
  - number: '7.4'
    text: |-
      De burgemeester kan op grond van de ingevolge [artikel 2c][ref1] verschafte informatie besluiten dat voor een
      inrichting die behoort tot een krachtens het derde lid aangewezen categorie geen rampbestrijdingsplan behoeft te
      worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003765#Artikel2c
    url: https://wetten.overheid.nl/BWBR0003765/2002-09-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0003765
        artikel: 2c
        hoofdstuk: II
        paragraaf: '1'
  - number: '7.5'
    text: |-
      Elk rampbestrijdingsplan wordt uiterlijk een maand na de vaststelling aan Onze commissaris in de provincie
      gezonden. Indien het rampbestrijdingsplan voor de waterstaatszorg van belang is wordt dit eveneens gezonden aan de
      bestuursorganen die binnen de gemeentegrenzen zijn belast met aangelegenheden betreffende de waterstaatszorg.
    url: https://wetten.overheid.nl/BWBR0003765/2002-09-01#Artikel7
  - number: '8.1'
    text: |-
      Onze commissaris in de provincie kan de burgemeester, na overleg met hem, de verplichting opleggen tot het wijzigen
      van een vastgesteld rampbestrijdingsplan. Hij kan daarbij een termijn stellen, waarbinnen de wijziging moet zijn
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003765/2002-09-01#Artikel8
  - number: '8.2'
    text: |-
      Binnen zes maanden na de datum waarop het rampbestrijdingsplan hem is toegezonden, deelt Onze commissaris in de
      provincie de burgemeester mede of hij van de bevoegdheid, bedoeld in het eerste lid, gebruik zal maken.
    url: https://wetten.overheid.nl/BWBR0003765/2002-09-01#Artikel8
  - number: '9.1'
    text: |-
      Onze commissaris in de provincie kan de burgemeesters van aan elkaar grenzende gemeenten die kunnen worden
      getroffen door een en dezelfde ramp of een en hetzelfde zware ongeval, waarvan de plaats, de aard en de gevolgen
      voorzienbaar zijn, na overleg met hen, de verplichting opleggen om na onderling overleg, ieder voor zijn gemeente,
      een rampbestrijdingsplan vast te stellen. Hij kan daarbij een termijn stellen, waarbinnen het plan moet zijn
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003765/2002-09-01#Artikel9
  - number: '9.2'
    text: |-
      Indien de gemeenten, bedoeld in het eerste lid, in meer dan één provincie zijn gelegen, kan Onze Minister, na
      overleg met Onze betrokken commissarissen in de provinciën, de bevoegdheid, bedoeld in het eerste lid, uitoefenen.
    url: https://wetten.overheid.nl/BWBR0003765/2002-09-01#Artikel9
  - number: '10.1'
    text: |-
      Onze commissaris in de provincie stelt binnen twee jaar na het inwerkingtreden van deze wet een provinciaal
      coördinatieplan vast. In het plan worden in ieder geval opgenomen een schema met betrekking tot de leiding over
      en de gecoördineerde inzet van diensten en organisaties bij de bestrijding van een ramp of een zwaar ongeval op
      provinciaal niveau, alsmede gegevens over het verzoeken en verlenen van bijstand.
    url: https://wetten.overheid.nl/BWBR0003765/2002-09-01#Artikel10
  - number: '10.2'
    text: |-
      Het provinciaal coördinatieplan wordt uiterlijk een maand na de vaststelling ter kennisneming aan Onze Minister,
      aan de burgemeesters in de provincie alsmede aan de bestuursorganen die binnen de provinciegrenzen zijn belast met
      aangelegenheden betreffende de waterstaatszorg gezonden.
    url: https://wetten.overheid.nl/BWBR0003765/2002-09-01#Artikel10
  - number: '11.1'
    text: |-
      De burgemeester heeft het opperbevel in geval van een ramp of een zwaar ongeval of van ernstige vrees voor het
      ontstaan daarvan. Degenen die aan de bestrijding van een ramp of een zwaar ongeval deelnemen, staan onder zijn
      bevel. Hij doet zich bijstaan door een door hem samengestelde gemeentelijke rampenstaf.
    url: https://wetten.overheid.nl/BWBR0003765/2002-09-01#Artikel11
  - number: '11.2'
    text: |-
      Degene die de leiding over de brandweer heeft, is tevens belast met de operationele leiding van de bestrijding van
      een ramp of een zwaar ongeval, tenzij de burgemeester een andere voorziening treft.
    url: https://wetten.overheid.nl/BWBR0003765/2002-09-01#Artikel11
  - number: 11a.1
    text: |-
      De burgemeester draagt er zorg voor dat de bevolking, Onze commissaris in de provincie, en Onze Minister op
      passende wijze informatie wordt verschaft over de oorsprong, de omvang en de gevolgen van een ramp die of een zwaar
      ongeval dat de bevolking en het milieu bedreigt of treft, alsmede over de bij deze ramp of dit zware ongeval te
      volgen gedragslijn.
    url: https://wetten.overheid.nl/BWBR0003765/2002-09-01#Artikel11a
  - number: 11a.2
    text: |-
      De burgemeester draagt er zorg voor dat de bij de bestrijding van een ramp of een zwaar ongeval betrokken personen
      op passende wijze informatie wordt verschaft over een ramp die of een zwaar ongeval dat de bevolking en het milieu
      bedreigt of treft, de risico’s die hun inzet bij deze ramp of dit zware ongeval heeft voor hun gezondheid en de
      voorzorgsmaatregelen die in verband daarmee zijn of zullen worden getroffen.
    url: https://wetten.overheid.nl/BWBR0003765/2002-09-01#Artikel11a
  - number: 11a.3
    text: |-
      Onze Minister draagt er zorg voor dat alle staten waarvan de bevolking en het milieu door rampen en zware
      ongevallen op Nederlands grondgebied worden bedreigd of getroffen, de informatie over de onderwerpen, bedoeld in
      het eerste lid, wordt verschaft, voor zover deze niet reeds op grond van andere voorschriften is verschaft.
    url: https://wetten.overheid.nl/BWBR0003765/2002-09-01#Artikel11a
  - number: 11a.4
    text: |-
      Bij algemene maatregel van bestuur worden nadere regels gegeven over de inhoud van de informatie, bedoeld in het
      eerste, tweede en derde lid, en over de wijze waarop de in die leden bedoelde taken worden uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0003765/2002-09-01#Artikel11a
  - number: 11b.1
    text: |-
      In geval van een ramp of een zwaar ongeval stelt een ieder die daarvan kennis draagt, de burgemeester van de
      gemeente waar de ramp of het zware ongeval plaatsvindt, zo spoedig mogelijk daarvan op de hoogte.
    url: https://wetten.overheid.nl/BWBR0003765/2002-09-01#Artikel11b
  - number: 11b.2
    text: |-
      In geval van een ramp of een zwaar ongeval verschaft een ieder die over relevante veiligheidstechnische informatie
      beschikt, de burgemeester van de gemeente waar de ramp of het zware ongeval plaatsvindt, de informatie die nodig
      is opdat hij zijn taken, bedoeld in [artikel 11][ref1], naar behoren kan uitvoeren. Dit geldt niet voor zover deze
      informatie reeds op grond van andere voorschriften is verschaft of kan worden verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0003765#Artikel11a
    url: https://wetten.overheid.nl/BWBR0003765/2002-09-01#Artikel11b
    references:
      - id: ref1
        bwb_id: BWBR0003765
        artikel: 11a
        hoofdstuk: III
  - number: 11b.3
    text: |-
      Bij algemene maatregel van bestuur worden nadere regels gegeven over de inhoud van de informatie, bedoeld in
      het tweede lid, alsmede over de wijze waarop de informatie wordt verschaft en welke natuurlijke personen of
      rechtspersonen de informatie verplicht zijn te verschaffen.
    url: https://wetten.overheid.nl/BWBR0003765/2002-09-01#Artikel11b
  - number: 11b.4
    text: |-
      Het tweede lid is niet van toepassing op gegevens waarvan de geheimhouding door het belang van de veiligheid van de
      staat is geboden.
    url: https://wetten.overheid.nl/BWBR0003765/2002-09-01#Artikel11b
  - number: '12'
    text: |-
      Onze commissaris in de provincie kan in geval van een ramp of een zwaar ongeval van meer dan plaatselijke betekenis
      in een of meer gemeenten of van ernstige vrees voor het ontstaan daarvan de burgemeesters in de provincie, zoveel
      mogelijk na overleg met hen, de nodige aanwijzingen geven over het door hen inzake de bestrijding van een ramp of
      een zwaar ongeval te voeren beleid. Hij kan alsdan in de operationele leiding van de bestrijding van een ramp of
      een zwaar ongeval voorzien. Hij doet zich bijstaan door een door hem samengestelde provinciale rampenstaf.
    url: https://wetten.overheid.nl/BWBR0003765/2002-09-01#Artikel12
  - number: '13'
    text: |-
      Onze Minister kan in geval van een ramp of een zwaar ongeval of van ernstige vrees voor het ontstaan daarvan,
      indien het algemeen belang zulks dringend eist, Onze commissaris in de provincie, zoveel mogelijk na overleg met
      hem, de nodige aanwijzingen geven over het door hem inzake de bestrijding van een ramp of een zwaar ongeval te
      voeren beleid.
    url: https://wetten.overheid.nl/BWBR0003765/2002-09-01#Artikel13
  - number: '14'
    text: |-
      De burgemeesters, Onze commissarissen in de provinciën en Onze Minister verstrekken elkaar de nodige inlichtingen
      ten behoeve van de toepassing van de [artikelen 11-13][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003765#Artikel11
    url: https://wetten.overheid.nl/BWBR0003765/2002-09-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0003765
        artikel: '11'
        hoofdstuk: III
  - number: 14a
    text: |-
      Indien bij of krachtens de wet aan een van Onze Ministers de bevoegdheid is gegeven bij een ramp of een zwaar
      ongeval regels te stellen of maatregelen te treffen, maakt hij van deze bevoegdheid geen gebruik dan na overleg met
      Onze Minister, tenzij de vereiste spoed zich daartegen verzet.
    url: https://wetten.overheid.nl/BWBR0003765/2002-09-01#Artikel14a
  - number: '15.1'
    text: |-
      Behoeft een burgemeester in geval van een ramp of een zwaar ongeval of van ernstige vrees voor het ontstaan daarvan
      bijstand van provinciale diensten, dan richt hij een verzoek daartoe aan Onze commissaris in de provincie.
    url: https://wetten.overheid.nl/BWBR0003765/2002-09-01#Artikel15
  - number: '15.2'
    text: Onze commissaris in de provincie voldoet aan het verzoek, tenzij dringende redenen zich daartegen verzetten.
    url: https://wetten.overheid.nl/BWBR0003765/2002-09-01#Artikel15
  - number: '16.1'
    text: |-
      Indien Onze commissaris in de provincie niet kan voldoen aan een verzoek, als bedoeld in [artikel 15][ref1], richt
      hij zich tot Onze Minister met het verzoek om bijstand van provinciale diensten uit andere provincies.


      [ref1]: https://wetten.overheid.nl/BWBR0003765#Artikel15
    url: https://wetten.overheid.nl/BWBR0003765/2002-09-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0003765
        artikel: '15'
        hoofdstuk: IV
  - number: '16.2'
    text: |-
      Onze Minister beslist op het verzoek na overleg met Onze betrokken commissarissen in de provincies. Onze betrokken
      commissarissen in de provincies treffen de nodige voorzieningen.
    url: https://wetten.overheid.nl/BWBR0003765/2002-09-01#Artikel16
  - number: '17.1'
    text: |-
      Behoeft een burgemeester in geval van een ramp of een zwaar ongeval of van ernstige vrees voor het ontstaan daarvan
      bijstand van rijksdiensten, dan richt hij een verzoek daartoe aan Onze commissaris in de provincie, die zich ter
      zake wendt tot Onze Minister.
    url: https://wetten.overheid.nl/BWBR0003765/2002-09-01#Artikel17
  - number: '17.2'
    text: |-
      Onze Minister richt zich ter zake tot Onze betrokken Minister, die de nodige voorzieningen treft, tenzij dringende
      redenen zich daartegen verzetten.
    url: https://wetten.overheid.nl/BWBR0003765/2002-09-01#Artikel17
  - number: '18'
    text: |-
      In bijzondere gevallen kan Onze commissaris in de provincie een verzoek tot bijstand van militairen richten aan
      Onze Minister. Deze wendt zich ter zake tot Onze Minister van Defensie, die de nodige voorzieningen treft, tenzij
      dringende redenen zich daartegen verzetten.
    url: https://wetten.overheid.nl/BWBR0003765/2002-09-01#Artikel18
  - number: '19.1'
    text: |-
      Onze commissaris in de provincie kan burgemeester en wethouders aanwijzingen geven over gezamenlijke oefeningen
      van gemeenten, die tezamen een gemeenschappelijke regeling inzake de brandweer zijn aangegaan, met het oog op de
      bestrijding van rampen en zware ongevallen in buitengewone omstandigheden.
    url: https://wetten.overheid.nl/BWBR0003765/2002-09-01#Artikel19
  - number: '19.2'
    text: |-
      Onze commissaris in de provincie kan burgemeester en wethouders opdragen oefeningen, als bedoeld in het eerste lid,
      te houden, indien deze naar zijn oordeel in onvoldoende mate worden gehouden.
    url: https://wetten.overheid.nl/BWBR0003765/2002-09-01#Artikel19
  - number: '19.3'
    text: |-
      Onze Minister kan Onze commissaris in de provincie opdragen aanwijzingen en opdrachten, als bedoeld in het eerste
      en tweede lid, te geven voorzover het oefeningen betreft van gemeenten die in meer dan één provincie zijn gelegen.
    url: https://wetten.overheid.nl/BWBR0003765/2002-09-01#Artikel19
  - number: '20'
    text: |-
      Onze Minister stelt de eisen vast, waaraan rampenplannen en provinciale coördinatieplannen, als bedoeld in
      [hoofdstuk II][ref1] van deze wet, moeten voldoen met het oog op de bestrijding van rampen en zware ongevallen in
      buitengewone omstandigheden.


      [ref1]: https://wetten.overheid.nl/BWBR0003765#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0003765/2002-09-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0003765
        hoofdstuk: II
  - number: '21.1'
    text: |-
      Onverminderd de [artikelen 7, eerste lid][ref1], en
      [8, eerste lid, van de Coördinatiewet uitzonderingstoestanden][ref2] kunnen, ingeval buitengewone
      omstandigheden dit noodzakelijk maken, bij koninklijk besluit, op voordracht van Onze Minister-President, de
      [artikelen 22 tot en met 24][ref3] in werking worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007981#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007981#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0003765#Artikel22
    url: https://wetten.overheid.nl/BWBR0003765/2002-09-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0007981
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0007981
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0003765
        artikel: '22'
        hoofdstuk: V
        paragraaf: '2'
  - number: '21.2'
    text: |-
      Wanneer het in het eerste lid bedoelde besluit is genomen, wordt onverwijld een voorstel van wet aan de Tweede
      Kamer gezonden omtrent het voortduren van de werking van de bij dat besluit in werking gestelde bepalingen.
    url: https://wetten.overheid.nl/BWBR0003765/2002-09-01#Artikel21
  - number: '21.3'
    text: |-
      Wordt het voorstel van wet door de Staten-Generaal verworpen, dan worden bij koninklijk besluit, op voordracht
      van Onze Minister-President, de bepalingen die ingevolge het eerste lid in werking zijn gesteld, onverwijld buiten
      werking gesteld.
    url: https://wetten.overheid.nl/BWBR0003765/2002-09-01#Artikel21
  - number: '21.4'
    text: |-
      Bij koninklijk besluit, op voordracht van Onze Minister-President, worden bepalingen die ingevolge het eerste lid
      in werking zijn gesteld, buiten werking gesteld, zodra de omstandigheden dit naar Ons oordeel toelaten.
    url: https://wetten.overheid.nl/BWBR0003765/2002-09-01#Artikel21
  - number: '21.5'
    text: |-
      Het besluit, bedoeld in het eerste, derde en vierde lid, wordt op de daarin te bepalen wijze bekendgemaakt. Het
      treedt in werking terstond na de bekendmaking.
    url: https://wetten.overheid.nl/BWBR0003765/2002-09-01#Artikel21
  - number: '21.6'
    text: Het besluit, bedoeld in het eerste, derde en vierde lid, wordt in ieder geval geplaatst in het *Staatsblad*.
    url: https://wetten.overheid.nl/BWBR0003765/2002-09-01#Artikel21
  - number: '22.1'
    text: |-
      Onze commissaris in de provincie kan de burgemeesters in de provincie de nodige aanwijzingen geven inzake de
      bestrijding van een ramp of een zwaar ongeval.
    url: https://wetten.overheid.nl/BWBR0003765/2002-09-01#Artikel22
  - number: '22.2'
    text: |-
      Onze Minister kan Onze commissaris in de provincie opdragen aan de burgemeesters in de provincie de nodige
      aanwijzingen te geven inzake de bestrijding van een ramp of een zwaar ongeval.
    url: https://wetten.overheid.nl/BWBR0003765/2002-09-01#Artikel22
  - number: '23'
    text: |-
      Onze Minister kan, indien het algemeen belang zulks dringend eist, voorzien in de uitoefening van bevoegdheden van
      Onze commissaris in de provincie en van de burgemeester op grond van deze wet, door die uitoefening geheel of ten
      dele aan zich te trekken dan wel daarmee geheel of ten dele een andere autoriteit te belasten.
    url: https://wetten.overheid.nl/BWBR0003765/2002-09-01#Artikel23
  - number: '24'
    text: |-
      Onze commissaris in de provincie, de burgemeester en de door hen of door Onze Minister aangewezen personen
      hebben toegang tot elke plaats, voor zover dat redelijkerwijs voor de vervulling van hun taak nodig is. Zo nodig
      verschaffen zij zich de toegang met behulp van de sterke arm.
    url: https://wetten.overheid.nl/BWBR0003765/2002-09-01#Artikel24
  - number: '25.1'
    text: |-
      In de kosten die voor de gemeenten voortvloeien uit de daadwerkelijke bestrijding van een ramp of een zwaar ongeval
      en de gevolgen daarvan, kan uit ’s Rijks kas een bijdrage worden verleend.
    url: https://wetten.overheid.nl/BWBR0003765/2002-09-01#Artikel25
  - number: '25.2'
    text: |-
      In de kosten die voortvloeien uit het verlenen van bijstand als bedoeld in artikel 3 van de op 14 november 1984
      te Den Haag tot stand gekomen Overeenkomst tussen het Koninkrijk der Nederlanden en het Koninkrijk België inzake
      wederzijdse bijstandsverlening bij het bestrijden van rampen en ongevallen (Trb. 1984, 155) en van de op 7 juni
      1988 te Bonn tot stand gekomen Overeenkomst tussen het Koninkrijk der Nederlanden en de Bondsrepubliek Duitsland
      inzake wederzijdse bijstandsverlening bij het bestrijden van rampen, zware ongevallen daaronder begrepen (Trb.
      1988, 95), kan door Onze Minister aan de bij de bestrijding betrokken provincies, gemeenten, organisaties en
      diensten een bijdrage worden verleend.
    url: https://wetten.overheid.nl/BWBR0003765/2002-09-01#Artikel25
  - number: '25.3'
    text: Bij algemene maatregel van bestuur worden regels gesteld over het bepaalde in het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0003765/2002-09-01#Artikel25
  - number: 25a.1
    text: |-
      Burgemeester en wethouders stellen de krachtens [artikel 2c][ref1] verschafte gegevens ten behoeve van de
      vaststelling van de in [artikel 7, derde lid][ref2], bedoelde rampbestrijdingsplannen uit eigen beweging ter
      beschikking van het publiek. Bij of krachtens algemene maatregel van bestuur kunnen terzake regels worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003765#Artikel2c
      [ref2]: https://wetten.overheid.nl/BWBR0003765#Artikel7
    url: https://wetten.overheid.nl/BWBR0003765/2002-09-01#Artikel25a
    references:
      - id: ref1
        bwb_id: BWBR0003765
        artikel: 2c
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0003765
        artikel: '7'
        hoofdstuk: II
        paragraaf: '3'
  - number: 25a.2
    text: |-
      Onverminderd [artikel 10, eerste lid, van de Wet openbaarheid van bestuur][ref1] en in afwijking van
      [artikel 10, tweede lid, van die wet][ref2] blijft het verstrekken van informatie over de gegevens, bedoeld in het
      eerste lid, achterwege voor zover het belang daarvan niet opweegt tegen de volgende belangen:


      [ref1]: https://wetten.overheid.nl/BWBR0005252#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002380#Artikel10
    url: https://wetten.overheid.nl/BWBR0003765/2002-09-01#Artikel25a
    references:
      - id: ref1
        bwb_id: BWBR0005252
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0002380
        artikel: '10'
  - number: 25a.2.a
    text: de eerbiediging van de persoonlijke levenssfeer;
    url: https://wetten.overheid.nl/BWBR0003765/2002-09-01#Artikel25a
  - number: 25a.2.b
    text: het voorkomen van sabotage.
    url: https://wetten.overheid.nl/BWBR0003765/2002-09-01#Artikel25a
  - number: 25a.3
    text: |-
      [Artikel 10, tweede lid, aanhef en onder f, van de Wet openbaarheid van bestuur][ref1] is niet van toepassing op
      het op verzoek verstrekken van informatie over gegevens die bij de toepassing van het bij of krachtens deze wet
      bepaalde ter uitvoering van [richtlijn nr. 96/82/EG](31996L0082) van de Raad van de Europese Unie van 9 december
      1996 betreffende de beheersing van de gevaren van zware ongevallen waarbij gevaarlijke stoffen zijn betrokken (PbEG
      L 10) door enig bestuursorgaan zijn verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0005252#Artikel10
    url: https://wetten.overheid.nl/BWBR0003765/2002-09-01#Artikel25a
    references:
      - id: ref1
        bwb_id: BWBR0005252
        artikel: '10'
  - number: 25a.4
    text: |-
      [Artikel 10, tweede lid, aanhef en onder b, van de Wet openbaarheid van bestuur][ref1] is op het op verzoek
      verstrekken van informatie over gegevens als bedoeld in het derde lid uitsluitend van toepassing, voor zover die
      gegevens een vertrouwelijk karakter hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0005252#Artikel10
    url: https://wetten.overheid.nl/BWBR0003765/2002-09-01#Artikel25a
    references:
      - id: ref1
        bwb_id: BWBR0005252
        artikel: '10'
  - number: 25a.5
    text: |-
      [Artikel 10, tweede lid, aanhef en onder g, van de Wet openbaarheid van bestuur][ref1] is op het op verzoek
      verstrekken van informatie over gegevens als bedoeld in het derde lid uitsluitend van toepassing, voor zover het
      gegevens betreft die afbreuk kunnen doen aan de mogelijkheid van het voorkomen van sabotage.


      [ref1]: https://wetten.overheid.nl/BWBR0005252#Artikel10
    url: https://wetten.overheid.nl/BWBR0003765/2002-09-01#Artikel25a
    references:
      - id: ref1
        bwb_id: BWBR0005252
        artikel: '10'
  - number: 25b
    text: |-
      Met het toezicht op de naleving van het bij of krachtens [artikel 2c][ref1] bepaalde ten aanzien van krachtens
      [artikel 7, derde lid][ref2], aangewezen inrichtingen zijn belast de bij besluit van burgemeester en wethouders
      binnen hun ambtsgebied aangewezen ambtenaren. Bij of krachtens algemene maatregel van bestuur worden regels gesteld
      over dit toezicht.


      [ref1]: https://wetten.overheid.nl/BWBR0003765#Artikel2c
      [ref2]: https://wetten.overheid.nl/BWBR0003765#Artikel7
    url: https://wetten.overheid.nl/BWBR0003765/2002-09-01#Artikel25b
    references:
      - id: ref1
        bwb_id: BWBR0003765
        artikel: 2c
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0003765
        artikel: '7'
        hoofdstuk: II
        paragraaf: '3'
  - number: 25c
    text: |-
      Burgemeester en wethouders zijn bevoegd tot toepassing van bestuursdwang ter handhaving van het bij of krachtens
      [artikel 2c][ref1] bepaalde ten aanzien van krachtens [artikel 7, derde lid][ref2], aangewezen inrichtingen,
      tot welke bevoegdheid mede behoort het stilleggen of gedeeltelijk buiten werking stellen of verzegelen van de
      inrichting dan wel het verzegelen of verwijderen van hetgeen zich in de inrichting bevindt.


      [ref1]: https://wetten.overheid.nl/BWBR0003765#Artikel2c
      [ref2]: https://wetten.overheid.nl/BWBR0003765#Artikel7
    url: https://wetten.overheid.nl/BWBR0003765/2002-09-01#Artikel25c
    references:
      - id: ref1
        bwb_id: BWBR0003765
        artikel: 2c
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0003765
        artikel: '7'
        hoofdstuk: II
        paragraaf: '3'
  - number: '26'
    text: |-
      Handelen in strijd met de [artikelen 2][ref1], en [11][ref2], is een strafbaar feit voor zover dat handelen in de
      algemene maatregel van bestuur, bedoeld in [artikel 2][ref3], onderscheidenlijk [artikel 11][ref4], is aangeduid
      als strafbaar feit.


      [ref1]: https://wetten.overheid.nl/BWBR0003765#Artikel2c
      [ref2]: https://wetten.overheid.nl/BWBR0003765#Artikel11b
      [ref3]: https://wetten.overheid.nl/BWBR0003765#Artikel2c
      [ref4]: https://wetten.overheid.nl/BWBR0003765#Artikel11b
    url: https://wetten.overheid.nl/BWBR0003765/2002-09-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0003765
        artikel: 2c
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0003765
        artikel: 11b
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0003765
        artikel: 2c
        hoofdstuk: II
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0003765
        artikel: 11b
        hoofdstuk: III
  - number: '27.1'
    text: De Wet rampenplannen (*Stb.* 1981, 384) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0003765/2002-09-01#Artikel27
  - number: '27.2'
    text: |-
      Plannen, vastgesteld op grond van de Wet rampenplannen, worden geacht plannen te zijn, vastgesteld krachtens deze
      wet, met dien verstande dat zij met inachtneming van het bepaalde in deze wet opnieuw dienen te zijn vastgesteld
      vier jaren na het tijdstip van inwerkingtreding van deze wet.
    url: https://wetten.overheid.nl/BWBR0003765/2002-09-01#Artikel27
  - number: '28.1'
    text: 'Deze wet wordt aangehaald als: Wet rampen en zware ongevallen.'
    url: https://wetten.overheid.nl/BWBR0003765/2002-09-01#Artikel28
  - number: '28.2'
    text: |-
      Zij treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen
      verschillend kan worden gesteld.
    url: https://wetten.overheid.nl/BWBR0003765/2002-09-01#Artikel28
