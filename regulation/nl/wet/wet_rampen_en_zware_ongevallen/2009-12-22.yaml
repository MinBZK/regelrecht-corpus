  - number: 4a
    text: |-
      1 Bij algemene maatregel van bestuur kunnen rampen en zware ongevallen worden aangewezen waarvoor een
      rampbestrijdingsplan wordt vastgesteld.

      2 Bij of krachtens die maatregel worden regels gesteld omtrent:

      a. de inhoud van het rampbestrijdingsplan;

      b. het raadplegen van de bevolking bij het opstellen van het rampbestrijdingsplan en van belangrijke wijzigingen
      van dat plan;

      c. het periodiek beproeven en actualiseren van het rampbestrijdingsplan;

      d. de bekendmaking van een besluit, bedoeld in het derde lid.

      3 In afwijking van het krachtens het eerste lid bepaalde kan de burgemeester op grond van de ingevolge
      [artikel 10a][ref1] verschafte informatie besluiten dat voor een desbetreffende inrichting geen
      rampbestrijdingsplan behoeft te worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003765#Artikel10a
    url: https://wetten.overheid.nl/BWBR0003765/2009-12-22#Artikel4a
    references:
