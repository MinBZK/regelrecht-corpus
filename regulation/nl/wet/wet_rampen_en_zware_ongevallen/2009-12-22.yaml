  - number: '6'
    text: |-
      1 De commissaris van de Koning stelt ten minste één maal per vier jaren een provinciaal coördinatieplan vast,
      waarin in ieder geval is opgenomen een schema met betrekking tot de leiding over en de gecoördineerde inzet van
      diensten en organisaties bij de bestrijding van een ramp of een zwaar ongeval op provinciaal niveau, alsmede
      gegevens over het verzoeken en verlenen van bijstand.

      2 Het provinciaal coördinatieplan wordt tussentijds geactualiseerd, indien gewijzigde omstandigheden daartoe
      aanleiding geven.

      3 Het provinciaal coördinatieplan wordt uiterlijk een maand na de vaststelling ter kennisneming aan Onze Minister,
      aan de burgemeesters in de provincie alsmede aan de bestuursorganen die binnen de provinciegrenzen zijn belast met
      aangelegenheden betreffende de waterstaatszorg gezonden.
    url: https://wetten.overheid.nl/BWBR0003765/2009-12-22#Artikel6
  - number: 6a
    text: |-
      1 Gedeputeerde staten dragen zorg voor de productie en het beheer van een geografische kaart waarop
      de in de provincie aanwezige risico's zijn aangeduid. Deze risicokaart vermeldt de plaatsgebonden en
      geografisch te onderscheiden risico's die zijn beschreven in de gemeentelijke risico-inventarisatie,
      bedoeld in [artikel 3][ref1], alsmede de gegevens die zijn opgenomen in het openbare register, bedoeld in
      [artikel 12.12 van de Wet milieubeheer][ref2]. De kaart is openbaar.

      2 De colleges van burgemeester en wethouders in de provincie en de directeur-generaal van het Rijksinstituut voor
      volksgezondheid en milieu leveren gedeputeerde staten de voor de uitvoering van het eerste lid benodigde gegevens.

      3 Bij ministeriële regeling kunnen regels worden gegeven over de in de risicokaart op te nemen categorieën van
      rampen, over de productie, het beheer en de vormgeving van de risicokaart, over de wijze waarop en de frequentie
      waarmee gegevens voor de risicokaart dienen te worden aangeleverd en over de wijze waarop toegang kan worden
      verkregen tot onderdelen van de risicokaart.


      [ref1]: https://wetten.overheid.nl/BWBR0003765#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel12.12
    url: https://wetten.overheid.nl/BWBR0003765/2009-12-22#Artikel6a
