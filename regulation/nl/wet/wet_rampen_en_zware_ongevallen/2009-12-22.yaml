  - number: '26'
    text: |-
      Handelen in strijd met de [artikelen 10a, eerste lid][ref1], en [11b, tweede lid][ref2], is een strafbaar
      feit voor zover dat handelen in de algemene maatregel van bestuur, bedoeld in [artikel 10a, derde lid][ref3],
      onderscheidenlijk [artikel 11b, derde lid][ref4], is aangeduid als strafbaar feit.


