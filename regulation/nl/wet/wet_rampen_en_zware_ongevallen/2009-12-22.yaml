        bwb_id: BWBR0003765
        artikel: 10a
        hoofdstuk: II
        paragraaf: '4'
  - number: '5'
    text: |-
      1 Het bestuur van de regionale brandweer stelt ingevolge
      [artikel 4, eerste lid, onderdeel 2, onder a, van de Brandweerwet 1985][ref1], ten minste één maal per vier
      jaren een beheersplan vast, waarin het beleid ten aanzien van de multidisciplinaire voorbereiding van de
      rampenbestrijding en ten aanzien van de waarborging van de benodigde capaciteit en kwaliteit van de organisatie van
      de rampenbestrijding is vastgelegd.

      2 Het beheersplan bevat in ieder geval:

      a. het niveau van het hulpaanbod dat wordt nagestreefd op grond van de analyse van de risico-inventarisatie,
      bedoeld in [artikel 3, derde lid][ref2];

      b. de op het niveau van het hulpaanbod, bedoeld in onderdeel a, afgestemde operationele prestaties
      van de brandweer, de politie en de geneeskundige hulpverleningsdiensten en ziekenhuizen,
      voor zover het de geneeskundige hulpverlening bij rampen en zware ongevallen als bedoeld in
      [artikel 1, onderdeel b, van de Wet geneeskundige hulpverlening bij ongevallen en rampen][ref3], betreft, de
      daarbij behorende capaciteit en deskundigheid en de maatregelen gericht op de realisering of de instandhouding
      daarvan;

      c. de inzet van de organisaties, bedoeld in onderdeel b, in het kader van het voorkomen en beperken van risico's,
      de daarbij behorende capaciteit en deskundigheid en de maatregelen gericht op de realisering of de instandhouding
      daarvan;

      d. de op het niveau van het hulpaanbod, bedoeld in onderdeel a, afgestemde prestaties van andere bij de
      rampenbestrijding betrokken gemeentelijke diensten en de maatregelen gericht op de realisering of de instandhouding
      daarvan;

      e. het op het niveau van het hulpaanbod, bedoeld in onderdeel a, afgestemde opleidings- en oefenprogramma en de
      maatregelen gericht op de realisering of de instandhouding daarvan.

      3 Het beheersplan is afgestemd met de beheersplannen van de binnen de provincie gelegen andere brandweerregio's en
      met de beheersplannen in aangrenzende provincies.

      4 Het beheersplan wordt tussentijds geactualiseerd, indien gewijzigde omstandigheden daartoe aanleiding geven.

      5 Het beheersplan wordt vastgesteld in overeenstemming met het regionale college en het bestuur van de GHOR-regio.

      6 Het bestuur van de regionale brandweer zendt het beheersplan en de wijzigingen daarop binnen een
      maand na vaststelling toe aan gedeputeerde staten, en ter kennisneming aan de commissaris van de
      Koning, alsmede aan de bestuursorganen die binnen het grondgebied van de aan de regeling, bedoeld in
      [artikel 3, eerste lid, van de Brandweerwet 1985][ref4], deelnemende gemeenten, belast zijn met aangelegenheden
      betreffende de waterstaatszorg.

      7 Bij algemene maatregel van bestuur kunnen criteria worden vastgesteld waaraan gedeputeerde staten ingevolge
      [artikel 9][ref5] de kwaliteit van het beheersplan toetsen.


      [ref1]: https://wetten.overheid.nl/BWBR0003764#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0003765#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0005276#Artikel1
