  - number: 10g
    text: |-
      1 Indien een ramp of zwaar ongeval heeft plaatsgevonden, draagt het college van burgemeester en wethouders van
      de gemeente waar de ramp of het zware ongeval zich heeft voorgedaan zorg voor een onderzoek van de ramp of het
      zware ongeval en doet het zonodig aanbevelingen om een soortgelijke ramp of soortgelijk zwaar ongeval voor de
      toekomst te voorkomen en de gevolgen daarvan te beperken, tenzij de Onderzoeksraad voor veiligheid, bedoeld in
      [artikel 2 van de Rijkswet Onderzoeksraad voor veiligheid][ref1], daar onderzoek naar verricht.

      2 Indien daartoe aanleiding is, wordt naar aanleiding van het eigen onderzoek of het onderzoek van de
      Onderzoeksraad voor veiligheid het rampenplan, de rampbestrijdingsplannen of het beheersplan aangepast.


      [ref1]: https://wetten.overheid.nl/BWBR0017613#Artikel2
    url: https://wetten.overheid.nl/BWBR0003765/2009-12-22#Artikel10g
    references:
      - id: ref1
        bwb_id: BWBR0017613
        artikel: '2'
  - number: '11'
    text: |-
      1 De burgemeester heeft het opperbevel in geval van een ramp of een zwaar ongeval of van ernstige vrees voor het
      ontstaan daarvan. Degenen die aan de bestrijding van een ramp of een zwaar ongeval deelnemen, staan onder zijn
      bevel. Hij doet zich bijstaan door een door hem samengestelde gemeentelijke rampenstaf.

      2 Degene die de leiding over de brandweer heeft, is tevens belast met de operationele leiding van de bestrijding
      van een ramp of een zwaar ongeval, tenzij de burgemeester een andere voorziening treft.
    url: https://wetten.overheid.nl/BWBR0003765/2009-12-22#Artikel11
  - number: 11a
    text: |-
      1 De burgemeester draagt er zorg voor dat de bevolking, de hoofdofficier van justitie, Onze commissaris in de
      provincie, en Onze Minister op passende wijze informatie wordt verschaft over de oorsprong, de omvang en de
      gevolgen van een ramp die of een zwaar ongeval dat de bevolking en het milieu bedreigt of treft, alsmede over de
      bij deze ramp of dit zware ongeval te volgen gedragslijn.

      2 De burgemeester draagt er zorg voor dat de bij de bestrijding van een ramp of een zwaar ongeval betrokken
      personen op passende wijze informatie wordt verschaft over een ramp die of een zwaar ongeval dat de bevolking
      en het milieu bedreigt of treft, de risico’s die hun inzet bij deze ramp of dit zware ongeval heeft voor hun
      gezondheid en de voorzorgsmaatregelen die in verband daarmee zijn of zullen worden getroffen.

      3 Onze Minister draagt er zorg voor dat alle staten waarvan de bevolking en het milieu door rampen en zware
      ongevallen op Nederlands grondgebied worden bedreigd of getroffen, de informatie over de onderwerpen, bedoeld in
      het eerste lid, wordt verschaft, voor zover deze niet reeds op grond van andere voorschriften is verschaft.

      4 Bij algemene maatregel van bestuur worden nadere regels gegeven over de inhoud van de informatie, bedoeld in het
      eerste, tweede en derde lid, en over de wijze waarop de in die leden bedoelde taken worden uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0003765/2009-12-22#Artikel11a
  - number: 11b
    text: |-
      1 In geval van een ramp of een zwaar ongeval stelt een ieder die daarvan kennis draagt, de burgemeester van de
      gemeente waar de ramp of het zware ongeval plaatsvindt, zo spoedig mogelijk daarvan op de hoogte.

      2 In geval van een ramp of een zwaar ongeval verschaft een ieder die over relevante veiligheidstechnische
      informatie beschikt, de burgemeester van de gemeente waar de ramp of het zware ongeval plaatsvindt, de informatie
      die nodig is opdat hij zijn taken, bedoeld in [artikel 11][ref1], naar behoren kan uitvoeren. Dit geldt niet voor
      zover deze informatie reeds op grond van andere voorschriften is verschaft of kan worden verkregen.

      3 Bij algemene maatregel van bestuur worden nadere regels gegeven over de inhoud van de informatie, bedoeld
      in het tweede lid, alsmede over de wijze waarop de informatie wordt verschaft en welke natuurlijke personen of
      rechtspersonen de informatie verplicht zijn te verschaffen.

      4 Het tweede lid is niet van toepassing op gegevens waarvan de geheimhouding door het belang van de veiligheid van
      de staat is geboden.


      [ref1]: https://wetten.overheid.nl/BWBR0003765#Artikel11a
    url: https://wetten.overheid.nl/BWBR0003765/2009-12-22#Artikel11b
    references:
      - id: ref1
        bwb_id: BWBR0003765
        artikel: 11a
        hoofdstuk: III
  - number: '12'
    text: |-
      Onze commissaris in de provincie kan in geval van een ramp of een zwaar ongeval van meer dan plaatselijke betekenis
      in een of meer gemeenten of van ernstige vrees voor het ontstaan daarvan de burgemeesters in de provincie, zoveel
      mogelijk na overleg met hen, de nodige aanwijzingen geven over het door hen inzake de bestrijding van een ramp of
      een zwaar ongeval te voeren beleid. Hij kan alsdan in de operationele leiding van de bestrijding van een ramp of
      een zwaar ongeval voorzien. Hij doet zich bijstaan door een door hem samengestelde provinciale rampenstaf.
    url: https://wetten.overheid.nl/BWBR0003765/2009-12-22#Artikel12
  - number: '13'
    text: |-
      Onze Minister kan in geval van een ramp of een zwaar ongeval of van ernstige vrees voor het ontstaan daarvan,
      indien het algemeen belang zulks dringend eist, Onze commissaris in de provincie, zoveel mogelijk na overleg met
      hem, de nodige aanwijzingen geven over het door hem inzake de bestrijding van een ramp of een zwaar ongeval te
      voeren beleid.
    url: https://wetten.overheid.nl/BWBR0003765/2009-12-22#Artikel13
  - number: '14'
    text: |-
      De burgemeesters, Onze commissarissen in de provinciën en Onze Minister verstrekken elkaar de nodige inlichtingen
      ten behoeve van de toepassing van de [artikelen 11-13][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003765#Artikel11
    url: https://wetten.overheid.nl/BWBR0003765/2009-12-22#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0003765
        artikel: '11'
        hoofdstuk: III
  - number: 14a
    text: |-
      Indien bij of krachtens de wet aan een van Onze Ministers de bevoegdheid is gegeven bij een ramp of een zwaar
      ongeval regels te stellen of maatregelen te treffen, maakt hij van deze bevoegdheid geen gebruik dan na overleg met
      Onze Minister, tenzij de vereiste spoed zich daartegen verzet.
    url: https://wetten.overheid.nl/BWBR0003765/2009-12-22#Artikel14a
  - number: '15'
    text: |-
      1 Behoeft een burgemeester in geval van een ramp of een zwaar ongeval of van ernstige vrees voor het ontstaan
      daarvan bijstand van provinciale diensten, dan richt hij een verzoek daartoe aan Onze commissaris in de provincie.

      2 Onze commissaris in de provincie voldoet aan het verzoek, tenzij dringende redenen zich daartegen verzetten.
    url: https://wetten.overheid.nl/BWBR0003765/2009-12-22#Artikel15
  - number: '16'
    text: |-
      1 Indien Onze commissaris in de provincie niet kan voldoen aan een verzoek, als bedoeld in [artikel 15][ref1],
      richt hij zich tot Onze Minister met het verzoek om bijstand van provinciale diensten uit andere provincies.

      2 Onze Minister beslist op het verzoek na overleg met Onze betrokken commissarissen in de provincies. Onze
      betrokken commissarissen in de provincies treffen de nodige voorzieningen.


      [ref1]: https://wetten.overheid.nl/BWBR0003765#Artikel15
    url: https://wetten.overheid.nl/BWBR0003765/2009-12-22#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0003765
        artikel: '15'
        hoofdstuk: IV
  - number: '17'
    text: |-
      1 Behoeft een burgemeester in geval van een ramp of een zwaar ongeval of van ernstige vrees voor het ontstaan
      daarvan bijstand van rijksdiensten, dan richt hij een verzoek daartoe aan Onze commissaris in de provincie, die
      zich ter zake wendt tot Onze Minister.

      2 Onze Minister richt zich ter zake tot Onze betrokken Minister, die de nodige voorzieningen treft, tenzij
      dringende redenen zich daartegen verzetten.
    url: https://wetten.overheid.nl/BWBR0003765/2009-12-22#Artikel17
  - number: '18'
    text: |-
      In bijzondere gevallen kan Onze commissaris in de provincie een verzoek tot bijstand van militairen richten aan
      Onze Minister. Deze wendt zich ter zake tot Onze Minister van Defensie, die de nodige voorzieningen treft, tenzij
      dringende redenen zich daartegen verzetten.
    url: https://wetten.overheid.nl/BWBR0003765/2009-12-22#Artikel18
  - number: '19'
    text: |-
      1 Onze commissaris in de provincie kan burgemeester en wethouders aanwijzingen geven over gezamenlijke oefeningen
      van gemeenten, die tezamen een gemeenschappelijke regeling inzake de brandweer zijn aangegaan, met het oog op de
      bestrijding van rampen en zware ongevallen in buitengewone omstandigheden.

      2 Onze commissaris in de provincie kan burgemeester en wethouders opdragen oefeningen, als bedoeld in het eerste
      lid, te houden, indien deze naar zijn oordeel in onvoldoende mate worden gehouden.

      3 Onze Minister kan Onze commissaris in de provincie opdragen aanwijzingen en opdrachten, als bedoeld in het eerste
      en tweede lid, te geven voorzover het oefeningen betreft van gemeenten die in meer dan één provincie zijn gelegen.
    url: https://wetten.overheid.nl/BWBR0003765/2009-12-22#Artikel19
  - number: '20'
    text: |-
      Onze Minister stelt de eisen vast, waaraan rampenplannen en provinciale coördinatieplannen, als bedoeld in
      [hoofdstuk II][ref1] van deze wet, moeten voldoen met het oog op de bestrijding van rampen en zware ongevallen in
      buitengewone omstandigheden.


      [ref1]: https://wetten.overheid.nl/BWBR0003765#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0003765/2009-12-22#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0003765
        hoofdstuk: II
  - number: '21'
    text: |-
      1 Onverminderd de [artikelen 7, eerste lid][ref1], en
      [8, eerste lid, van de Coördinatiewet uitzonderingstoestanden][ref2] kunnen, ingeval buitengewone
      omstandigheden dit noodzakelijk maken, bij koninklijk besluit, op voordracht van Onze Minister-President, de
      [artikelen 22 tot en met 24][ref3] in werking worden gesteld.

      2 Wanneer het in het eerste lid bedoelde besluit is genomen, wordt onverwijld een voorstel van wet aan de Tweede
      Kamer gezonden omtrent het voortduren van de werking van de bij dat besluit in werking gestelde bepalingen.

      3 Wordt het voorstel van wet door de Staten-Generaal verworpen, dan worden bij koninklijk besluit, op voordracht
      van Onze Minister-President, de bepalingen die ingevolge het eerste lid in werking zijn gesteld, onverwijld buiten
      werking gesteld.

      4 Bij koninklijk besluit, op voordracht van Onze Minister-President, worden bepalingen die ingevolge het eerste lid
      in werking zijn gesteld, buiten werking gesteld, zodra de omstandigheden dit naar Ons oordeel toelaten.

      5 Het besluit, bedoeld in het eerste, derde en vierde lid, wordt op de daarin te bepalen wijze bekendgemaakt. Het
      treedt in werking terstond na de bekendmaking.

      6 Het besluit, bedoeld in het eerste, derde en vierde lid, wordt in ieder geval geplaatst in het *Staatsblad*.


      [ref1]: https://wetten.overheid.nl/BWBR0007981#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007981#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0003765#Artikel22
    url: https://wetten.overheid.nl/BWBR0003765/2009-12-22#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0007981
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0007981
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0003765
        artikel: '22'
        hoofdstuk: V
        paragraaf: '2'
  - number: '22'
    text: |-
      1 Onze commissaris in de provincie kan de burgemeesters in de provincie de nodige aanwijzingen geven inzake de
      bestrijding van een ramp of een zwaar ongeval.

      2 Onze Minister kan Onze commissaris in de provincie opdragen aan de burgemeesters in de provincie de nodige
      aanwijzingen te geven inzake de bestrijding van een ramp of een zwaar ongeval.
    url: https://wetten.overheid.nl/BWBR0003765/2009-12-22#Artikel22
  - number: '23'
    text: |-
      Onze Minister kan, indien het algemeen belang zulks dringend eist, voorzien in de uitoefening van bevoegdheden van
      Onze commissaris in de provincie en van de burgemeester op grond van deze wet, door die uitoefening geheel of ten
      dele aan zich te trekken dan wel daarmee geheel of ten dele een andere autoriteit te belasten.
    url: https://wetten.overheid.nl/BWBR0003765/2009-12-22#Artikel23
  - number: '24'
    text: |-
      Onze commissaris in de provincie, de burgemeester en de door hen of door Onze Minister aangewezen personen
      hebben toegang tot elke plaats, voor zover dat redelijkerwijs voor de vervulling van hun taak nodig is. Zo nodig
      verschaffen zij zich de toegang met behulp van de sterke arm.
    url: https://wetten.overheid.nl/BWBR0003765/2009-12-22#Artikel24
  - number: '25'
    text: |-
      1 In de kosten die voor de gemeenten voortvloeien uit de daadwerkelijke bestrijding van een ramp of een zwaar
      ongeval en de gevolgen daarvan, kan uit ’s Rijks kas een bijdrage worden verleend.

      2 In de kosten die voortvloeien uit het verlenen van bijstand als bedoeld in artikel 3 van de op 14 november 1984
      te Den Haag tot stand gekomen Overeenkomst tussen het Koninkrijk der Nederlanden en het Koninkrijk België inzake
      wederzijdse bijstandsverlening bij het bestrijden van rampen en ongevallen (Trb. 1984, 155) en van de op 7 juni
      1988 te Bonn tot stand gekomen Overeenkomst tussen het Koninkrijk der Nederlanden en de Bondsrepubliek Duitsland
      inzake wederzijdse bijstandsverlening bij het bestrijden van rampen, zware ongevallen daaronder begrepen (Trb.
      1988, 95), kan door Onze Minister aan de bij de bestrijding betrokken provincies, gemeenten, organisaties en
      diensten een bijdrage worden verleend.

      3 In de kosten die voor gemeenten voortvloeien uit het opsporen en ruimen van als gevolg van de Tweede Wereldoorlog
      achtergebleven explosieven, kan door Onze Minister een bijdrage worden verleend.

      4 Bij algemene maatregel van bestuur worden regels gesteld over het bepaalde in het eerste tot en met derde lid.
    url: https://wetten.overheid.nl/BWBR0003765/2009-12-22#Artikel25
  - number: 25b
    text: |-
      Met het toezicht op de naleving van het bij of krachtens [artikel 10a][ref1] bepaalde ten aanzien van krachtens
      [artikel 4a][ref2] aangewezen inrichtingen zijn belast de bij besluit van burgemeester en wethouders binnen hun
      ambtsgebied aangewezen ambtenaren. Bij of krachtens algemene maatregel van bestuur worden regels gesteld over dit
      toezicht.


      [ref1]: https://wetten.overheid.nl/BWBR0003765#Artikel10a
      [ref2]: https://wetten.overheid.nl/BWBR0003765#Artikel4a
    url: https://wetten.overheid.nl/BWBR0003765/2009-12-22#Artikel25b
