  - number: '27'
    text: |-
      1 De Wet rampenplannen (*Stb.* 1981, 384) wordt ingetrokken.

      2 Plannen, vastgesteld op grond van de Wet rampenplannen, worden geacht plannen te zijn, vastgesteld krachtens deze
      wet, met dien verstande dat zij met inachtneming van het bepaalde in deze wet opnieuw dienen te zijn vastgesteld
      vier jaren na het tijdstip van inwerkingtreding van deze wet.
    url: https://wetten.overheid.nl/BWBR0003765/2009-12-22#Artikel27
  - number: '28'
    text: |-
      1 Deze wet wordt aangehaald als: Wet rampen en zware ongevallen.

      2 Zij treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen
      verschillend kan worden gesteld.
    url: https://wetten.overheid.nl/BWBR0003765/2009-12-22#Artikel28
