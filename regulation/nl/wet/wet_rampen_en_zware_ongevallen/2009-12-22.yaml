  - number: '7'
    text: |-
      1 Indien het college van burgemeester en wethouders verzuimt een rampenplan vast te stellen, nodigen gedeputeerde
      staten het college uit om het plan binnen drie maanden vast te stellen.

      2 Indien gedeputeerde staten van oordeel zijn dat het rampenplan niet aan de wettelijke eisen voldoet, nodigen zij
      het college van burgemeester en wethouders binnen drie maanden nadat het plan is ontvangen uit het plan binnen een
      door hen vast te stellen termijn te wijzigen.

      3 Indien gedeputeerde staten van oordeel zijn dat het rampenplan niet meer actueel is, nodigen zij het college van
      burgemeester en wethouders uit het plan binnen een door hen vast te stellen termijn te wijzigen.

      4 Indien het college van burgemeester en wethouders geen gevolg geeft aan een uitnodiging op grond van het eerste,
      tweede of derde lid, stellen gedeputeerde staten het plan respectievelijk de wijziging daarvan binnen zes maanden
      op kosten van de gemeente vast.

      5 Alvorens de bevoegdheden, bedoeld in de vorige leden, toe te passen, treden gedeputeerde staten in overleg met
      het college van burgemeester en wethouders.
    url: https://wetten.overheid.nl/BWBR0003765/2009-12-22#Artikel7
  - number: '8'
    text: |-
      1 Indien de burgemeester verzuimt het rampbestrijdingsplan vast te stellen, nodigt de commissaris van de Koning hem
      uit om het plan binnen drie maanden vast te stellen.

      2 Indien de commissaris van de Koning van oordeel is dat het rampbestrijdingsplan niet aan de wettelijke eisen
      voldoet, nodigt hij de burgemeester binnen drie maanden nadat het plan is ontvangen uit het plan binnen een door
      hem vast te stellen termijn te wijzigen.

      3 Indien de commissaris van de Koning van oordeel is dat het rampbestrijdingsplan niet meer actueel is, nodigt hij
      de burgemeester uit het plan binnen een door hem vast te stellen termijn te wijzigen.

      4 Indien de burgemeester geen gevolg geeft aan een uitnodiging op grond van het eerste, tweede of derde lid, stelt
      de commissaris van de Koning het plan respectievelijk de wijziging daarvan binnen zes maanden op kosten van de
      gemeente vast.

      5 Alvorens de bevoegdheden, bedoeld in de vorige leden, toe te passen, treedt de commissaris van de Koning in
      overleg met de burgemeester.
    url: https://wetten.overheid.nl/BWBR0003765/2009-12-22#Artikel8
  - number: '9'
    text: |-
      1 Indien het bestuur van de regionale brandweer verzuimt het beheersplan vast te stellen, nodigen gedeputeerde
      staten het bestuur uit om het plan binnen drie maanden vast te stellen.

      2 Indien gedeputeerde staten van oordeel zijn dat het beheersplan niet aan de wettelijke eisen voldoet, nodigen zij
      het bestuur van de regionale brandweer binnen drie maanden nadat het plan is ontvangen uit het plan binnen een door
      hen vast te stellen termijn te wijzigen.

      3 Indien gedeputeerde staten van oordeel zijn dat het beheersplan niet meer actueel is, nodigen zij het bestuur van
      de regionale brandweer uit het plan binnen een door hen vast te stellen termijn te wijzigen.

      4 Indien het bestuur van de regionale brandweer geen gevolg geeft aan een uitnodiging op grond van het eerste
      tweede of derde lid, stellen gedeputeerde staten het plan respectievelijk de wijziging daarvan binnen zes maanden
      op kosten van het bestuur van de regionale brandweer vast.

      5 Alvorens de bevoegdheden, bedoeld in de vorige leden, toe te passen, treden gedeputeerde staten in overleg met de
      besturen van de regionale brandweer en van de GHOR-regio en met het regionale college.
    url: https://wetten.overheid.nl/BWBR0003765/2009-12-22#Artikel9
  - number: '10'
    text: |-
      1 Indien de commissaris van de Koning van oordeel is dat met de uitvoering van de in het beheersplan
      neergelegde beleidsmaatregelen met betrekking tot de prestaties en het opleidingen oefenprogramma, bedoeld in
      [artikel 5, tweede lid][ref1], onvoldoende voortgang wordt geboekt, kan hij het bestuur van de regionale brandweer
      aanwijzingen geven ter bevordering van de uitvoering daarvan.

      2 Alvorens een aanwijzing te geven treedt de commissaris van de Koning in overleg met het bestuur van de regionale
      brandweer.


      [ref1]: https://wetten.overheid.nl/BWBR0003765#Artikel5
    url: https://wetten.overheid.nl/BWBR0003765/2009-12-22#Artikel10
