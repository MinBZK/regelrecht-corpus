      - id: ref2
        bwb_id: BWBR0003765
        artikel: 4a
        hoofdstuk: II
        paragraaf: '1'
  - number: 25c
    text: |-
      Burgemeester en wethouders zijn bevoegd tot oplegging van een last onder bestuursdwang ter handhaving van het bij
      of krachtens [artikel 10a][ref1] bepaalde ten aanzien van krachtens [artikel 4a][ref2] aangewezen inrichtingen,
      tot welke bevoegdheid mede behoort het stilleggen of gedeeltelijk buiten werking stellen of verzegelen van de
      inrichting dan wel het verzegelen of verwijderen van hetgeen zich in de inrichting bevindt.


      [ref1]: https://wetten.overheid.nl/BWBR0003765#Artikel10a
      [ref2]: https://wetten.overheid.nl/BWBR0003765#Artikel4a
