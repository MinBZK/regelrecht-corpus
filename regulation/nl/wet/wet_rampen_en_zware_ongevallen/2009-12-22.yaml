  - number: '2'
    text: |-
      Het college van burgemeester en wethouders is belast met de voorbereiding van de bestrijding van rampen en
      zware ongevallen in de gemeente, voor zover niet bij of krachtens de wet anders is bepaald. Het bevordert in
      het bijzonder het houden van oefeningen en de totstandkoming van afspraken, die nodig zijn voor een doelmatige
      bestrijding van rampen en zware ongevallen.
    url: https://wetten.overheid.nl/BWBR0003765/2009-12-22#Artikel2
  - number: '3'
    text: |-
      1 Het college van burgemeester en wethouders stelt ten minste één maal per vier jaren een rampenplan vast,
      waarin risico's worden geïnventariseerd, de organisatie, de verantwoordelijkheden, de taken en de bevoegdheden
      in het kader van de rampenbestrijding worden beschreven en het beleid ten aanzien van het vaststellen van
      rampbestrijdingsplannen wordt vastgelegd.

      2 Het rampenplan wordt tussentijds geactualiseerd, indien gewijzigde omstandigheden daartoe aanleiding geven.

      3 De risico-inventarisatie in het rampenplan bevat:

      a. een overzicht van de soorten rampen en zware ongevallen die de gemeente bedreigen en de mogelijke gevolgen
      daarvan;

      b. een overzicht van de risicovolle situaties binnen de gemeente waarbij zich een ramp of zwaar ongeval kan
      voordoen en de mogelijke gevolgen daarvan.

      4 Het in het rampenplan opgenomen beleid ten aanzien van het vaststellen van rampbestrijdingsplannen bevat in
      ieder geval een overzicht van rampen en zware ongevallen waarvan de plaats, aard en gevolgen voorzienbaar zijn en
      waarvoor een rampbestrijdingsplan wordt vastgesteld alsmede een termijn waarbinnen dat zal worden vastgesteld.

      5 Ten aanzien van de organisatie, verantwoordelijkheden, taken en bevoegdheden in het kader van de
      rampenbestrijding bevat het rampenplan in ieder geval:

      a. begripsomschrijvingen;

      b. een overzicht van diensten, instanties, organisaties en personen, die bij de bestrijding van rampen en zware
      ongevallen kunnen worden betrokken;

      c. een schema met betrekking tot de leiding over en de gecoördineerde inzet van diensten en organisaties bij de
      bestrijding van rampen en zware ongevallen;

      d. een intern en extern verbindings- en alarmeringsschema;

      e. een plan met betrekking tot de wijze waarop het college van burgemeester en wethouders de informatie, bedoeld
      in [artikel 10b, eerste en tweede lid][ref1], en [10c][ref2] verschaft, de wijze waarop de burgemeester de
      informatie, bedoeld in [artikel 11a, eerste en tweede lid][ref3], verschaft, alsmede een plan met betrekking tot de
      waarschuwing van de bevolking;

      f. een plan met betrekking tot maatregelen te nemen bij een verplaatsing van de bevolking;

      g. een plan met betrekking tot de geneeskundige organisatie op het terrein waar een ramp of een zwaar ongeval heeft
      plaatsgevonden;

      h. een plan met betrekking tot de opvang en verzorging van slachtoffers;

      i. een plan met betrekking tot psychosociale nazorg;

      j. een plan met betrekking tot de voedselvoorziening van de bevolking;

      k. een plan met betrekking tot maatregelen ten behoeve van de bevoorrading van met de bestrijding van rampen en
      zware ongevallen belaste diensten, instanties, organisaties en personen;

      l. een plan met betrekking tot het beperken van de schadelijke gevolgen;

      m. een plan met betrekking tot de vastlegging van gegevens met betrekking tot veroorzaakte schade;

      n. een plan met betrekking tot de organisatie en inrichting van een centraal registratie- en inlichtingenbureau;

      o. een plan met betrekking tot de verslaglegging;

      p. een verzendlijst.

      6 Het rampenplan is afgestemd op calamiteitenplannen als bedoeld in [artikel 5.29 van de Waterwet][ref4] die
      betrekking hebben op geheel of ten dele binnen de gemeentegrenzen gelegen waterstaatswerken, alsmede op plannen,
      vastgesteld voor het gebied van aangrenzende gemeenten en van aangrenzende andere staten.

      7 Het college van burgemeester en wethouders zendt het rampenplan en de wijzigingen daarop binnen een maand na
      vaststelling toe aan gedeputeerde staten, en ter kennisneming aan de commissaris van de Koning, de hoofdofficier
      van justitie alsmede aan de bestuursorganen die binnen de gemeentegrenzen belast zijn met aangelegenheden
      betreffende de waterstaatszorg, indien het plan voor de waterstaatszorg van belang is.

      8 Bij algemene maatregel van bestuur kunnen criteria worden vastgesteld waaraan gedeputeerde staten ingevolge
      [artikel 7][ref5] de kwaliteit van het rampenplan toetsen.


      [ref1]: https://wetten.overheid.nl/BWBR0003765#Artikel10b
