preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is regels te geven over de rampenbestrijding en over de
    voorbereiding daarop,;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0003765/2009-12-22#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. Onze Minister: Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties;

      b. ramp of zwaar ongeval: een gebeurtenis

      1°. waardoor een ernstige verstoring van de openbare veiligheid is ontstaan, waarbij het leven en de gezondheid van
      vele personen, het milieu of grote materiële belangen in ernstige mate worden bedreigd of zijn geschaad, en

      2°. waarbij een gecoördineerde inzet van diensten en organisaties van verschillende disciplines is vereist om de
      dreiging weg te nemen of de schadelijke gevolgen te beperken.

      c. brandweerregio: een regio als bedoeld in [artikel 3 van de Brandweerwet 1985][ref1];

      d. GHOR-regio: een intergemeentelijk samenwerkingsverband inzake de geneeskundige hulpverlening als bedoeld in
      [artikel 3 van de Wet geneeskundige hulpverlening][ref2] bij ongevallen en rampen;

      e. het regionale college: het regionale college als bedoeld in [artikel 22 van de Politiewet 1993][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003764#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005276#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0006299#Artikel22
