  - number: 10d
    text: |-
      Het bestuur van de regionale brandweer rapporteert, na overleg met het regionale college en het bestuur van
      de GHOR-regio, jaarlijks over de stand van zaken met betrekking tot de uitvoering van de beleidsmaatregelen,
      bedoeld in [artikel 5, tweede lid][ref1], en zendt deze aan de commissaris van de Koning en ter kennisneming aan
      gedeputeerde staten.


      [ref1]: https://wetten.overheid.nl/BWBR0003765#Artikel5
    url: https://wetten.overheid.nl/BWBR0003765/2009-12-22#Artikel10d
    references:
      - id: ref1
        bwb_id: BWBR0003765
        artikel: '5'
        hoofdstuk: II
        paragraaf: '1'
  - number: 10e
    text: |-
      De commissaris van de Koning informeert, mede op basis van de informatie, verkregen op grond van
      [artikel 10d][ref1], Onze Minister jaarlijks over de stand van zaken met betrekking tot de rampenbestrijding en de
      voorbereiding daarop.


      [ref1]: https://wetten.overheid.nl/BWBR0003765#Artikel10d
    url: https://wetten.overheid.nl/BWBR0003765/2009-12-22#Artikel10e
    references:
      - id: ref1
        bwb_id: BWBR0003765
        artikel: 10d
        hoofdstuk: II
        paragraaf: '5'
  - number: 10f
    text: |-
      Onze Minister informeert, mede op basis van de informatie, verkregen op grond van [artikel 10e][ref1], en de
      [artikelen 19][ref2] en [19a van de Brandweerwet 1985][ref3], de Tweede Kamer der Staten-Generaal ten minste één
      maal per vier jaren over de stand van zaken met betrekking tot de rampenbestrijding en de voorbereiding daarop.


      [ref1]: https://wetten.overheid.nl/BWBR0003765#Artikel10e
      [ref2]: https://wetten.overheid.nl/BWBR0003764#Artikel19
