  - number: 10b
    text: |-
      1 Het college van burgemeester en wethouders draagt er zorg voor dat de bevolking, de commissaris van de Koning en
      Onze Minister op passende wijze informatie wordt verschaft over de rampen en zware ongevallen die de bevolking en
      het milieu kunnen treffen, de maatregelen die zijn getroffen ter voorkoming en bestrijding van deze rampen en zware
      ongevallen en de bij deze rampen en zware ongevallen te volgen gedragslijn.

      2 Het college van burgemeester en wethouders draagt er zorg voor dat de bij de bestrijding van rampen en zware
      ongevallen betrokken personen op passende wijze informatie wordt verschaft over de rampen en zware ongevallen
      die de bevolking en het milieu kunnen treffen, de risico's die hun inzet kan hebben voor hun gezondheid en de
      voorzorgsmaatregelen die in verband daarmee zijn of zullen worden getroffen.

      3 Onze Minister draagt er zorg voor dat alle staten waarvan de bevolking en het milieu door rampen en zware
      ongevallen op Nederlands grondgebied kunnen worden getroffen, de informatie over de onderwerpen, bedoeld in het
      eerste lid, wordt verschaft, voor zover deze niet reeds op grond van andere voorschriften is verschaft.

      4 Bij algemene maatregel van bestuur worden nadere regels gegeven over de inhoud van de informatie, bedoeld in het
      eerste, tweede en derde lid, en over de wijze waarop de in die leden bedoelde taken worden uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0003765/2009-12-22#Artikel10b
  - number: 10c
    text: |-
      1 Het college van burgemeester en wethouders stelt de krachtens [artikel 10a][ref1] verschafte gegevens ten behoeve
      van de vaststelling van de in [artikel 4a, eerste lid][ref2], bedoelde rampbestrijdingsplannen uit eigen beweging
      ter beschikking van het publiek. Bij of krachtens algemene maatregel van bestuur kunnen terzake regels worden
      gesteld.

      2 Onverminderd [artikel 10, eerste lid, van de Wet openbaarheid][ref3] van bestuur en in afwijking van
      [artikel 10, tweede lid, van die wet][ref4] blijft het verstrekken van informatie over de gegevens, bedoeld in het
      eerste lid, achterwege voor zover het belang daarvan niet opweegt tegen de volgende belangen:

      a. het belang, bedoeld in [artikel 10, tweede lid, onder e, van de Wet openbaarheid van bestuur][ref5];

      b. het belang, bedoeld in [artikel 10, zevende lid, onder b, van de Wet openbaarheid van bestuur][ref6], voorzover
      het betreft het voorkomen van sabotage.

      3 [Artikel 10, tweede lid, aanhef en onder f, van de Wet openbaarheid van bestuur][ref7] is niet van toepassing
      op het op verzoek verstrekken van informatie over gegevens die bij de toepassing van het bij of krachtens deze wet
      bepaalde ter uitvoering van [richtlijn nr. 96/82/EG](31996L0082) van de Raad van de Europese Unie van 9 december
      1996 betreffende de beheersing van de gevaren van zware ongevallen waarbij gevaarlijke stoffen zijn betrokken (PbEG
      L 10) door enig bestuursorgaan zijn verkregen.

      4 [Artikel 10, tweede lid, aanhef en onder b, van de Wet openbaarheid van bestuur][ref8] is op het op verzoek
      verstrekken van informatie over gegevens als bedoeld in het derde lid uitsluitend van toepassing, voor zover die
      gegevens een vertrouwelijk karakter hebben.

      5 [Artikel 10, tweede lid, aanhef en onder g, van de Wet openbaarheid van bestuur][ref9] is op het op verzoek
      verstrekken van informatie over gegevens als bedoeld in het derde lid uitsluitend van toepassing, voor zover het
      gegevens betreft die afbreuk kunnen doen aan de mogelijkheid van het voorkomen van sabotage.

      6 [Artikel 10, zevende lid, aanhef en onder b, van de Wet openbaarheid van bestuur][ref10] is, voorzover het gaat
      om milieu-informatie als bedoeld in [artikel 19.1a van de Wet milieubeheer][ref11], uitsluitend van toepassing
      voorzover het gegevens betreft die afbreuk doen aan de mogelijkheid van het voorkomen van sabotage.


