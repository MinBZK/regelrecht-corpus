  - number: '4'
    text: |-
      1 De burgemeester stelt ten minste één maal per vier jaren de rampbestrijdingsplannen vast voor de rampen en zware
      ongevallen, genoemd in het overzicht, bedoeld in [artikel 3, vierde lid][ref1].

      2 In het rampbestrijdingsplan is het geheel van de bij die ramp of dat zware ongeval te nemen maatregelen
      opgenomen.

      3 Het rampbestrijdingsplan wordt tussentijds geactualiseerd, indien gewijzigde omstandigheden daartoe aanleiding
      geven.

      4 Het rampbestrijdingsplan is afgestemd op calamiteitenplannen als bedoeld in [artikel 5.29 van de Waterwet][ref2]
      die betrekking hebben op geheel of ten dele binnen de gemeente gelegen waterstaatswerken, alsmede op plannen,
      vastgesteld voor het gebied van aangrenzende gemeenten en van aangrenzende andere staten.

      5 De burgemeester zendt het rampbestrijdingsplan en de wijzigingen daarop binnen een maand na vaststelling toe
      aan de commissaris van de Koning, alsmede aan de bestuursorganen die binnen de gemeentegrenzen belast zijn met
      aangelegenheden betreffende de waterstaatszorg, indien het plan voor de waterstaatszorg van belang is.

      6 Bij algemene maatregel van bestuur kunnen criteria worden vastgesteld waaraan de commissaris van de Koning
      ingevolge [artikel 8][ref3] de kwaliteit van het rampbestrijdingsplan toetst.


      [ref1]: https://wetten.overheid.nl/BWBR0003765#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0025458#Artikel5.29
      [ref3]: https://wetten.overheid.nl/BWBR0003765#Artikel8
