preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het noodzakelijk is de Wet bedreigde uitheemse diersoorten te wijzigen
    teneinde volledig uitvoering te kunnen geven aan de Overeenkomst inzake de internationale handel in bedreigde in
    het wild levende dier- en plantesoorten (Trb. 1975, 23) en aan verordening (EEG) nr. 3626/82 van de Raad van de
    Europese Gemeenschappen van 23 december 1982 betreffende de toepassing in de Gemeenschap van de Overeenkomst inzake
    de internationale handel in bedreigde in het wild levende dier- en plantesoorten (PbEGL 384), alsmede teneinde
    toekomstige internationale regelen op het gebied van de in het bezit van en de handel in bedreigde dier- en
    plantesoorten eenvoudig te kunnen uitvoeren;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0006766/1995-08-01#ArtikelAanhef
articles:
  - number: II
    text: |-
      Ten aanzien van zaken betreffende overtredingen van ingevolge [artikel I][ref1] vervallen voorschriften die op het
      tijdstip van intrekking bij de tot dat tijdstip bevoegde rechter aanhangig waren, blijft deze rechter bevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0006766#ArtikelI
    url: https://wetten.overheid.nl/BWBR0006766/1995-08-01#ArtikelII
    references:
      - id: ref1
        bwb_id: BWBR0006766
        artikel: I
  - number: III
    text: |-
      1 Vergunningen verleend krachtens het In- en uitvoerbesluit bedreigde uitheemse dier- en plantesoorten (*Stb.*
      1984, 570) blijven van kracht voor de tijd dat zij zijn verleend.

      2 Ontheffingen verleend krachtens de Wet bedreigde uitheemse diersoorten vóór het tijdstip van inwerkingtreding van
      artikel F van deze wet tot wijziging van de Wet bedreigde uitheemse diersoorten, blijven van kracht voor de tijd
      dat zij zijn verleend.
    url: https://wetten.overheid.nl/BWBR0006766/1995-08-01#ArtikelIII
  - number: IV
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden gesteld.
    url: https://wetten.overheid.nl/BWBR0006766/1995-08-01#ArtikelIV
