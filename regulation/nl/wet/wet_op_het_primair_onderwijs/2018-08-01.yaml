  - number: '80'
    text: |-
      1 Indien de gemeenteraad een aanvraag tot opneming in het plan van een bijzondere of een openbare school niet heeft
      ingewilligd, kunnen de aanvragers administratief beroep instellen bij Onze minister.

      2 Indien een onherroepelijk geworden beslissing in beroep of een uitspraak naar aanleiding van de beslissing in
      beroep, dan wel het naar aanleiding daarvan genomen besluit van Onze minister strekt tot het voor bekostiging
      in aanmerking brengen van de school, neemt de gemeenteraad de school op in het na de beslissing in beroep, de
      uitspraak of het besluit vast te stellen plan.
    url: https://wetten.overheid.nl/BWBR0003420/2018-08-01#Artikel80
  - number: '81'
    text: |-
      1 Scholen die gedurende 3 achtereenvolgende schooljaren in het plan zijn opgenomen en niet voor bekostiging in
      aanmerking zijn gebracht, brengt de gemeenteraad voor het daaropvolgende schooljaar voor bekostiging in aanmerking.

      2 Ten aanzien van een school die ingevolge [artikel 79, zevende lid][ref1], in het daar bedoelde plan wordt
      opgenomen, vangt de termijn genoemd in het eerste lid, aan met ingang van het eerste schooljaar van het plan waarin
      de school was opgenomen. Ten aanzien van een school die ingevolge [artikel 80, tweede lid][ref2], in het daar
      bedoelde plan wordt opgenomen, vangt de termijn genoemd in het eerste lid, aan met ingang van het eerste schooljaar
      van het plan waarvoor de aanvraag werd ingediend.


