  - number: 32a
    text: |-
      1 Bij algemene maatregel van bestuur worden bekwaamheidseisen vastgesteld voor leraren.

      2 Bij algemene maatregel van bestuur worden bekwaamheidseisen vastgesteld voor werkzaamheden van leidinggevende
      aard die nauw verband houden met het pedagogisch-didactische klimaat op de school of die onderwijskundige leiding
      omvatten, en kunnen ook voor andere werkzaamheden van leidinggevende aard bekwaamheidseisen worden vastgesteld.

      3 Bij algemene maatregel van bestuur worden bekwaamheidseisen vastgesteld voor bij die maatregel aan te wijzen
      onderwijsondersteunende werkzaamheden die rechtstreeks verband houden met het onderwijsleerproces.

      4 De in het eerste lid bedoelde bekwaamheidseisen zijn gericht op het handelen in het onderwijsleerproces, het
      algemeen professioneel handelen en het werken binnen een onderwijsorganisatie. Zij omvatten in elk geval eisen ten
      aanzien van:

      a. pedagogisch-didactische kennis, inzicht en vaardigheden, en

      b. vakbekwaamheid.

      5 De algemene maatregel van bestuur, bedoeld in het eerste, tweede en derde lid, wordt aan de beide Kamers der
      Staten-Generaal overgelegd. De maatregel treedt niet in werking dan nadat vier weken na de overlegging zijn
      verstreken en niet door of namens een van beide Kamers de wens wordt te kennen gegeven dat het in die maatregel
      geregelde onderwerp bij de wet wordt geregeld. Alsdan wordt een daartoe strekkend wetsvoorstel zo spoedig mogelijk
      ingediend.

      6 Onze minister stelt een beroepsorganisatie die hij vanuit het oogpunt van beroepskwaliteit representatief acht
      voor onderwijspersoneel als bedoeld in deze wet, in de gelegenheid hem een voorstel te doen voor de in het eerste,
      tweede of derde lid voorgeschreven bekwaamheidseisen en kan een representatief geachte beroepsorganisatie in de
      gelegenheid stellen hem een voorstel te doen voor bekwaamheidseisen die op grond van het tweede lid kunnen worden
      vastgesteld. Onze minister stelt deze organisatie vervolgens in elk geval eenmaal in de zes jaar in de gelegenheid,
      hem een voorstel te doen over ongewijzigde handhaving of wijziging van de bekwaamheidseisen voor zover vastgesteld.
      Uit een voorstel als bedoeld in de eerste of tweede volzin blijkt tevens, in hoeverre dat voorstel mede steun
      geniet van een vertegenwoordiging van bevoegde gezagsorganen en ouders van de leerlingen.
    url: https://wetten.overheid.nl/BWBR0003420/2018-08-01#Artikel32a
  - number: 32b
    text: |-
      Het bevoegd gezag beschikt ten aanzien van elk personeelslid dat een functie of werkzaamheden verricht waarvoor
      bekwaamheidseisen zijn vastgesteld, over geordende gegevens met betrekking tot de bekwaamheid en het onderhouden
      van de bekwaamheid. Ten behoeve van de onderlinge vergelijkbaarheid en herkenbaarheid van de gegevens kunnen bij
      ministeriële regeling voorschriften worden vastgesteld over de inrichting en wijze van ordening van deze gegevens.
    url: https://wetten.overheid.nl/BWBR0003420/2018-08-01#Artikel32b
  - number: '33'
    text: |-
      1 Met inachtneming van bij of krachtens algemene maatregel van bestuur vastgestelde voorschriften als bedoeld in
      het tweede en vierde lid regelt het bevoegd gezag van een openbare school de rechtspositie van het personeel en
      draagt het bevoegd gezag van een bijzondere school zorg voor de regeling van de rechtspositie van het personeel.

      2 Bij of krachtens algemene maatregel van bestuur kunnen voorschriften worden vastgesteld betreffende:

      a. salarisschalen en uitgangspunten waaraan een door het bevoegd gezag in te richten functiewaarderingssysteem moet
      voldoen, en

      b. vakantie, verlof, aanspraken op salaris in geval van militaire dienst, ziekte of ongeval, ontslaguitkeringen,
      alsmede omtrent andere rechten en verplichtingen, dan wel de voorwaarden waaronder het bevoegd gezag bedoelde
      rechten en verplichtingen zelf regelt of voor de regeling daarvan zorg draagt.

      3 Onder regeling van de rechtspositie als bedoeld in het eerste lid wordt tevens begrepen het vaststellen van
      bepalingen omtrent aanstelling, benoeming, schorsing, disciplinaire maatregelen en ontslag van het personeel.
      De bepalingen omtrent ontslag mogen het personeel van de openbare scholen niet minder rechten verschaffen dan
      die welke voor werknemers met een arbeidsovereenkomst voortvloeien uit de bepalingen van dwingend recht van
      [titel 10 van Boek 7 van het Burgerlijk Wetboek][ref1].

      4 Bij algemene maatregel van bestuur kunnen voorschriften worden vastgesteld betreffende algemene arbeidsduur.


      [ref1]: https://wetten.overheid.nl/BWBR0005290
    url: https://wetten.overheid.nl/BWBR0003420/2018-08-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0005290
  - number: 33a
    text: Het bevoegd gezag benoemt, schorst en ontslaat het personeel.
    url: https://wetten.overheid.nl/BWBR0003420/2018-08-01#Artikel33a
  - number: '34'
    text: |-
      1 Het bevoegd gezag benoemt de directeur en de adjunct-directeur, de leraren en het onderwijsondersteunend
      personeel in algemene dienst van het bevoegd gezag.

      2 Onder benoeming in algemene dienst van het bevoegd gezag wordt in dit artikel en in de [artikelen 53][ref1] en
      [59][ref2] verstaan een benoeming ten behoeve van het verrichten van werkzaamheden aan door het bevoegd gezag in
      stand gehouden scholen.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel59
