      1 Ten aanzien van de bijdrage die een gemeente in de ontslaguitkeringskosten dient te verstrekken bij of krachtens
      artikel 102 van de Wet op de onderwijsverzorging zoals die voorschriften luidden op 31 december 1997, blijven die
      voorschriften van kracht gedurende de periode waarover ontslaguitkeringen worden uitgekeerd.

      2 Een schoolbegeleidingsdienst dient aan Onze minister op diens verzoek de kosten van werkloosheidsuitkeringen of
      herplaatsingswachtgelden te voldoen:

      a. voor zover het betreft uitkeringen die zijn ontstaan voor 1 januari 1998: indien die kosten bij of krachtens
      de artikelen 90 en 102 van de Wet op de onderwijsverzorging zoals die voorschriften luidden op 31 december 1997,
      zouden worden ingehouden op de rijksvergoeding aan die schoolbegeleidingsdienst, en

      b. voor zover het betreft uitkeringen die zijn ontstaan na 31 december 1997: indien de rechtspersoon, bedoeld
      in artikel 114b van de Wet op het basisonderwijs, zoals die bepaling luidde ten tijde van deze uitkeringen, op
      een daartoe strekkend verzoek van het bestuur van de schoolbegeleidingsdienst, voorafgaand aan het ontslag niet
      heeft ingestemd met het ten laste van die rechtspersoon brengen van de kosten van werkloosheidsuitkeringen of
      herplaatsingswachtgelden.
