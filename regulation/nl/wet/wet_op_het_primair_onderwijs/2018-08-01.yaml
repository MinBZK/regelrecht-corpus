  - number: 178c
    text: |-
      1 Gegevens uit het basisregister onderwijs kunnen worden gebruikt door:

      a. Onze minister voor zover deze gegevens noodzakelijk zijn voor de bekostiging van scholen, de begrotings- en
      beleidsvoorbereiding, en de uitvoering van de taak, bedoeld in [artikel 45a, tweede lid][ref1];

      b. de inspectie voor zover deze gegevens noodzakelijk zijn voor het uitoefenen van het toezicht op het
      basisonderwijs.

      2 Voor zover de door het bevoegd gezag op grond van [artikel 178a][ref2] verstrekte gegevens naar het oordeel van
      Onze minister onjuist of onvolledig zijn, kan Onze minister ten behoeve van de vaststelling van de bekostiging van
      deze gegevens afwijken, in welk geval de door Onze minister vastgestelde gewijzigde gegevens worden opgenomen in
      het basisregister onderwijs, nadat het desbetreffende besluit tot vaststelling van de bekostiging onherroepelijk
      is geworden.

      3 Bij het gebruik, bedoeld in het eerste lid, kunnen persoonsgegevens worden verwerkt, indien dat noodzakelijk
      is voor de in het eerste lid genoemde doelen, onverminderd de verplichting voor de verwerkingsverantwoordelijke
      om passende technische en organisatorische maatregelen te treffen als bedoeld in artikel 25 van de Algemene
      verordening gegevensbescherming.

      4 Bij ministeriële regeling worden regels gesteld ter uitvoering van het eerste en derde lid, in ieder geval
      omtrent de inhoud en de samenstelling van de gegevens, de wijze waarop de gegevens uit het basisregister worden
      verstrekt, de tijdstippen waarop de gegevens worden verstrekt, en de perioden waarop de gegevens betrekking hebben.

      5 Onze Minister kan in het verkeer met het bevoegd gezag ten behoeve van de vaststelling van de bekostiging het
      persoonsgebonden nummer gebruiken. In afwijking van het vierde lid wordt bij algemene maatregel van bestuur bepaald
      welke overige gegevens uit het basisregister onderwijs tezamen met het persoonsgebonden nummer hiervoor kunnen
      worden gebruikt.

      6 Onze Minister kan uit het basisregister onderwijs ten behoeve van het zenden van de samenvatting van het
      inspectierapport aan de ouders van de leerlingen ingevolge [artikel 45a, tweede lid][ref3], het persoonsgebonden
      nummer van die leerlingen gebruiken.


