  - number: '72'
    text: |-
      1 Voor de toepassing van deze titel zijn de voorschriften die betrekking hebben op bijzondere scholen, van
      overeenkomstige toepassing op openbare scholen die in stand worden gehouden door een stichting als bedoeld in
      [artikel 48][ref1] of een openbare rechtspersoon als bedoeld in [artikel 47][ref2], tenzij het tegendeel blijkt.

      2 Indien een openbare school in stand wordt gehouden door een stichting of een openbare rechtspersoon, wordt deze
      aangemerkt als een door de gemeente in stand gehouden openbare school voor de toepassing van afdeling 2 en afdeling
      9.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel48
