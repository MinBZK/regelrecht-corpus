      Indien burgemeester en wethouders in samenwerking met de bevoegde gezagsorganen van de scholen, activiteiten
      ter bevordering van de beheersing van de Nederlandse taal op scholen willen verrichten met het oog op het
      voorkomen en bestrijden van onderwijsachterstanden, wordt het onderwijs zodanig ingericht dat deze activiteiten
      plaatsvinden geheel of gedeeltelijk gedurende dan wel buiten het aantal uren onderwijs dat leerlingen op grond van
      [artikel 8][ref1] tenminste ontvangen. Een leerling neemt slechts deel aan deze activiteiten als nadat de ouders
      van de leerling hun instemming schriftelijk kenbaar hebben gemaakt aan het bevoegd gezag.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel8
