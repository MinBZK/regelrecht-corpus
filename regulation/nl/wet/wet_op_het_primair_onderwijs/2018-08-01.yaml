      De school voor openbaar en protestants-christelijk onderwijs in Earnewâld wordt niet voor een bij koninklijk
      besluit te bepalen datum opgeheven, tenzij deze school indien zij als nevenvestiging onderdeel zou vormen
      van een andere school wegens het niet voldoen aan een van de normen voor bekostiging van een nevenvestiging,
      genoemd in [artikel 158, eerste lid][ref1], van de Wet op het primair onderwijs zou moeten worden opgeheven.
      Indien deze school op een bij koninklijk besluit te bepalen datum voldoet aan de criteria voor het
      voortbestaan als zelfstandige school, kan de bekostiging van deze school met ingang van een bij koninklijk
      besluit te bepalen datum worden voortgezet zolang na laatstgenoemde datum geen opheffing op grond van de
      [artikelen 153 tot en met 160][ref2] van de Wet op het primair onderwijs behoeft plaats te vinden.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel158
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel153
