  - number: '9'
    text: |-
      1 Het onderwijs omvat, waar mogelijk in samenhang:

      a. zintuiglijke en lichamelijke oefening;

      b. Nederlandse taal;

      c. rekenen en wiskunde;

      d. Engelse taal;

      e. enkele kennisgebieden;

      f. expressie-activiteiten;

      g. bevordering van sociale redzaamheid, waaronder gedrag in het verkeer;

      h. bevordering van gezond gedrag.

      2 Bij de kennisgebieden wordt in elk geval aandacht besteed aan:

      a. aardrijkskunde;

      b. geschiedenis;

      c. de natuur, waaronder biologie;

      d. maatschappelijke verhoudingen, waaronder staatsinrichting;

      e. geestelijke stromingen.

      3 Het onderwijs kan naast de onderwijsactiviteiten, genoemd in het eerste en tweede lid, tevens de Duitse taal of
      de Franse taal omvatten.

      4 Op de scholen in de provincie Fryslân wordt tevens onderwijs gegeven in de Friese taal. Gedeputeerde staten
      kunnen op aanvraag van het bevoegd gezag gedeeltelijke of volledige ontheffing van deze verplichting verlenen.
      Gedeputeerde staten stellen in een beleidsregel criteria vast voor die gedeeltelijke en volledige ontheffing. De
      vaststelling geschiedt niet eerder dan nadat gedeputeerde staten overleg hebben gevoerd met het Friese primair
      onderwijs.

      5 Ten aanzien van de onderwijsactiviteiten, genoemd in het eerste en tweede lid, worden bij algemene maatregel van
      bestuur kerndoelen vastgesteld. De algemene maatregel van bestuur bedoeld in de vorige volzin, wordt aan de beide
      Kamers der Staten-Generaal overgelegd. De maatregel treedt niet in werking dan nadat 4 weken na de overlegging zijn
      verstreken en gedurende die termijn niet door of namens een van beide Kamers de wens wordt te kennen gegeven dat
      het in die maatregel geregelde onderwerp bij de wet wordt geregeld. Alsdan wordt een daartoe strekkend wetsvoorstel
      zo spoedig mogelijk ingediend.

      6 Ten aanzien van de onderwijsactiviteit, bedoeld in het vierde lid, stellen provinciale staten van Fryslân
      bij verordening kerndoelen Friese taal vast. De vaststelling geschiedt niet eerder dan nadat gedeputeerde
      staten overleg hebben gevoerd met het Friese primair onderwijs. De verordening behoeft de goedkeuring van
      Onze minister. Indien Onze minister voornemens is goedkeuring te onthouden, verzoekt hij de Onderwijsraad
      een advies uit te brengen. Het verzoek bevat een omschrijving van de onderwerpen waarover advies wordt
      verwacht. Het advies wordt binnen zes weken uitgebracht aan Onze minister en wordt bekend gemaakt. Onze
      minister informeert beide Kamers der Staten-Generaal over zijn voornemen om al dan niet goed te keuren.
      [Paragraaf 4.1.3.3 van de Algemene wet bestuursrecht][ref1] is niet van overeenkomstige toepassing.

      7 Onze minister kan goedkeuring als bedoeld in het zesde lid in ieder geval onthouden indien aan de volgende
      voorwaarden, waarvoor gedeputeerde staten gegevens aandragen, niet wordt voldaan:

      a. het bestaan van voldoende draagvlak in het Friese primair onderwijs voor de voorgelegde kerndoelen Friese taal;

      b. dat de kerndoelen Friese taal niet meer inspanningen van het Friese primair onderwijs vergen dan het aandeel van
      het onderwijs in de Friese taal binnen het totaal aan onderwijsactiviteiten rechtvaardigt.

      8 Onze minister kan goedkeuring als bedoeld in het zesde lid in ieder geval onthouden indien de kerndoelen Friese
      taal geen aandacht schenken aan:

      a. het zich mondeling uitdrukken in het Fries en het verstaan van de Fries gesproken taal,

      b. het zich schriftelijk uitdrukken in het Fries en het verwerven van informatie uit in het Fries gestelde teksten,

      c. bevordering van het begrip van de Friese taal, en

      d. het ontwikkelen van een positieve houding ten aanzien van het gebruik van het Fries.

      9 Voor de school geldt de eis dat zij tenminste de kerndoelen bij haar onderwijsactiviteiten als aan het eind
      van het basisonderwijs te bereiken doelstellingen hanteert. Kerndoelen geven een beschrijving van kwaliteiten van
      leerlingen op het gebied van kennis, inzicht en vaardigheden. Indien de eerste volzin niet kan worden toegepast
      voor een leerling vanwege zijn handicap, wordt in het ontwikkelingsperspectief, bedoeld in [artikel 40a][ref2],
      aangegeven welke vervangende onderwijsdoelen worden gehanteerd.

      10 Indien een bevoegd gezag van een bijzondere school dringend bedenkingen heeft tegen de krachtens het vijfde
      of zesde lid vastgestelde kerndoelen, kan het bevoegd gezag eigen kerndoelen voor de school vaststellen. Deze
      kerndoelen zijn van gelijk niveau als de kerndoelen, bedoeld in het vijfde of zesde lid. Het bevoegd gezag zendt de
      vastgestelde kerndoelen aan de inspecteur.

      11 Bij de verzorging van het onderwijs op basis van de kerndoelen voor Nederlandse taal en
      rekenen en wiskunde, neemt het bevoegd gezag, met inachtneming van [artikel 8, eerste lid][ref3],
      de referentieniveaus Nederlandse taal en de referentieniveaus rekenen, bedoeld in
      [artikel 2, tweede lid, aanhef en onderdeel a, van de Wet referentieniveaus Nederlandse taal en rekenen][ref4],
      als uitgangspunt.

      12

      13 Het onderwijs wordt gegeven in het Nederlands. Daar waar naast de Nederlandse taal, de Friese taal of een
      streektaal in levend gebruik is, kan de Friese taal of de streektaal mede als voertaal bij het onderwijs worden
      gebruikt. Voor de opvang in en de aansluiting bij het Nederlandse onderwijs van leerlingen met een niet-Nederlandse
      culturele achtergrond kan de taal van het land van oorsprong mede als voertaal bij het onderwijs worden gebruikt,
      overeenkomstig een door het bevoegd gezag vastgestelde gedragscode.

      13a In afwijking van het dertiende lid kan een deel van het onderwijs worden gegeven in de Engelse, Duitse of
      Franse taal tot ten hoogste een bij algemene maatregel van bestuur vast te stellen percentage per schooljaar.

      14 In afwijking van het dertiende lid, eerste volzin, kan het onderwijs aan een afdeling als bedoeld in
      [artikel 85a][ref5] worden gegeven in de Engelse taal, mits ten minste 10% van het aantal uren, bedoeld in
      [artikel 8, zevende lid][ref6], wordt gegeven in het Nederlands of wordt besteed aan de Nederlandse taal.

      15 Onze minister kan in bijzondere gevallen op aanvraag van het bevoegd gezag besluiten toe te staan dat wordt
      afgeweken van de voorschriften in het eerste en tweede lid. De toestemming wordt verleend voor een bepaald tijdvak;
      zij kan voorwaarden bevatten.


