      1 Indien de inspectie in het inspectierapport, bedoeld in [artikel 20 van de Wet op het onderwijstoezicht][ref1],
      tot het oordeel is gekomen dat de kwaliteit van het onderwijs zeer zwak is, als bedoeld in
      [artikel 10a, eerste of vierde lid][ref2], informeert het bevoegd gezag de ouders van de leerlingen van de school
      hierover door middel van in ieder geval de toezending van de door de inspectie opgestelde samenvatting van het
      inspectierapport, welke samenvatting gelijktijdig met het inspectierapport ter beschikking is gesteld van het
      bevoegd gezag. De toezending, bedoeld in de eerste volzin, geschiedt binnen vier weken na de vaststelling van het
      inspectierapport.

      2 Indien het bevoegd gezag niet of niet tijdig voldoet aan de verplichting, bedoeld in het eerste lid, zendt Onze
      minister de samenvatting van het inspectierapport, bedoeld in het eerste lid, in de vijfde week na vaststelling van
      het inspectie rapport aan de ouders van de leerlingen.

      3 Indien de inspectie op basis van een onderzoek als bedoeld in [artikel 11][ref3] of
      [artikel 15 van de Wet op het onderwijstoezicht][ref4] in het inspectierapport, bedoeld in
      [artikel 20 van genoemde wet][ref5], tot het oordeel is gekomen dat sprake is van een zeer zwakke school, betrekt
      het bevoegd gezag de ouders van de leerlingen van de school bij de door het bevoegd gezag voorgenomen maatregelen
      ten behoeve van kwaliteitsverbetering.


