  - number: '83'
    text: |-
      1 De vaststelling van een plan blijft achterwege indien:

      a. geen aanvragen tot opneming in het plan zijn ingekomen of geen der ingekomen aanvragen voor inwilliging in
      aanmerking komt,

      b. stichting van een openbare school niet noodzakelijk is, omdat de in
      [artikel 75, vierde lid, eerste volzin][ref1], omschreven situatie zich niet voordoet en

      c. geen scholen uit het voorafgaande plan voor opneming in het plan in aanmerking komen.

      2 Het besluit bedoeld in het eerste lid onder b, behoeft uitsluitend de goedkeuring van Onze minister, indien
      in het voorafgaande jaar een zelfde besluit werd genomen en daarvoor geen goedkeuring is gevraagd. Het goed
      te keuren besluit wordt voor 1 augustus voorafgaande aan de betrokken planperiode aan Onze minister gezonden.
      [Artikel 79, derde lid][ref2], is van overeenkomstige toepassing.

      3 Indien een onherroepelijk geworden besluit van Onze minister of een naar aanleiding van het besluit van Onze
      minister in beroep als bedoeld in [artikel 71][ref3] gegeven beslissing strekt tot het voor bekostiging in
      aanmerking brengen van een openbare school, neemt de gemeenteraad de school op in het na het onherroepelijk
      geworden besluit onderscheidenlijk de in dat beroep gegeven beslissing vast te stellen plan.

      4 Aan de indieners van de niet ingewilligde aanvragen bedoeld in het eerste lid onder a, wordt voor 15 augustus
      voorafgaande aan de betrokken planperiode, afschrift gezonden van het desbetreffende raadsbesluit.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel75
