  - number: '115'
    text: |-
      1 De bekostiging, bedoeld in [artikel 113, eerste lid derde volzin][ref1], voor de materiële instandhouding
      bestaat voor de gezamenlijke speciale scholen voor basisonderwijs in een samenwerkingsverband uit een bedrag
      vermenigvuldigd met 2% van het aantal leerlingen van het samenwerkingsverband op 1 oktober van het jaar
      voorafgaande aan het jaar waarover de bekostiging plaatsvindt. Het Rijk verdeelt deze bekostiging over de speciale
      scholen voor basisonderwijs in een samenwerkingsverband naar rato van het aantal leerlingen van elke speciale
      school voor basisonderwijs op die datum.

      2 Indien alle bevoegde gezagsorganen van de scholen in het samenwerkingsverband ermee instemmen dat van het
      samenwerkingsverband geen speciale school voor basisonderwijs deel uitmaakt, bestaat de bekostiging, bedoeld in
      [artikel 113, eerste lid, derde volzin][ref2], voor de materiële instandhouding uit een bedrag vermenigvuldigd
      met 2% van het aantal leerlingen van het samenwerkingsverband op 1 oktober van het jaar voorafgaande aan het jaar
      waarover de bekostiging plaatsvindt. Het Rijk verstrekt deze bekostiging aan het samenwerkingsverband.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel113
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel113
