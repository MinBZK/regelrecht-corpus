  - number: 18a
    text: |-
      1 Het bevoegd gezag van één of meer scholen is voor elke vestiging van die school of scholen aangesloten bij een
      samenwerkingsverband als bedoeld in het tweede lid of bij een landelijk samenwerkingsverband als bedoeld in het
      vijftiende lid.

      2 Een samenwerkingsverband omvat alle binnen een gebied als bedoeld in het derde lid gelegen vestigingen
      van scholen, scholen voor speciaal onderwijs en scholen voor speciaal en voortgezet speciaal onderwijs,
      voor zover daaraan speciaal onderwijs wordt verzorgd, behorend tot cluster 3 en 4, bedoeld in de
      [Wet op de expertisecentra][ref1], met uitzondering van vestigingen waarvoor het bevoegd gezag is aangesloten
      bij een landelijk samenwerkingsverband. Het samenwerkingsverband stelt zich ten doel een samenhangend geheel
      van ondersteuningsvoorzieningen binnen en tussen de scholen, bedoeld in de vorige volzin, te realiseren en wel
      zodanig dat leerlingen een ononderbroken ontwikkelingsproces kunnen doormaken en leerlingen die extra ondersteuning
      behoeven een zo passend mogelijke plaats in het onderwijs krijgen.

      3 Bij ministeriële regeling worden voor de samenwerkingsverbanden aaneengesloten gebieden aangewezen.

      3a Bij algemene maatregel van bestuur kunnen regels worden gesteld over de wijze waarop een samenwerkingsverband
      dat is gelegen aan de landsgrens bij de vervulling van zijn taken kan samenwerken met een school of instelling
      in België of in een van de bondsstaten Noord-Rijnland-Westfalen, Nedersaksen of Bremen van de Bondsrepubliek
      Duitsland.

      4 De bevoegde gezagsorganen van de scholen, bedoeld in het tweede lid, geven het samenwerkingsverband vorm door
      het oprichten van een rechtspersoon met volledige rechtsbevoegdheid zonder winstoogmerk, waarin uitsluitend deze
      bevoegde gezagsorganen deelnemen, behoudens deelname van een bevoegd gezag op grond van het vijfde lid. De statuten
      van de rechtspersoon bevatten een voorziening voor de beslechting van geschillen.

      5 Indien het bevoegd gezag van een school voor speciaal onderwijs of een school voor speciaal en voortgezet
      speciaal onderwijs, behorend tot cluster 3 en 4, bedoeld in de [Wet op de expertisecentra][ref2], waarvan de
      vestiging of vestigingen zijn gelegen buiten het gebied van een samenwerkingsverband, wenst deel te nemen aan dit
      samenwerkingsverband, wordt dit bevoegd gezag niet uitgesloten van deelname aan het samenwerkingsverband.

      6 Het samenwerkingsverband heeft in elk geval tot taak:

      a. het vaststellen van een ondersteuningsplan,

      b. het verdelen en toewijzen van ondersteuningsmiddelen en ondersteuningsvoorzieningen aan de scholen, bedoeld in
      het tweede lid,

      c. het beoordelen of leerlingen toelaatbaar zijn tot het onderwijs aan een speciale school voor basisonderwijs in
      het samenwerkingsverband of tot het speciaal onderwijs, op verzoek van het bevoegd gezag van een school als bedoeld
      in het tweede lid waar de leerling is aangemeld of ingeschreven, en

      d. het adviseren over de ondersteuningsbehoefte van een leerling op verzoek van het bevoegd gezag van een school
      als bedoeld in het tweede lid waar de leerling is aangemeld of ingeschreven.

      7 Het samenwerkingsverband stelt ten minste eenmaal in de 4 jaar een ondersteuningsplan vast. Bij het vaststellen
      van het ondersteuningsplan kunnen door het samenwerkingsverband slechts beperkingen worden gesteld aan de door de
      school gewenste invulling van het schoolondersteuningsprofiel, indien dat voor het samenwerkingsverband met het oog
      op de beschikbare ondersteuningsmiddelen en ondersteuningsvoorzieningen een onevenredige belasting zou vormen.

      8 Het ondersteuningsplan omvat in elk geval:

      a. de wijze waarop wordt voldaan aan het tweede lid, tweede volzin, waaronder tevens zijn begrepen de
      basisondersteuningsvoorzieningen die op alle vestigingen van scholen in het samenwerkingsverband aanwezig zijn,

      b. de procedure en criteria voor de verdeling, besteding en toewijzing van ondersteuningsmiddelen en
      ondersteuningsvoorzieningen aan de scholen, bedoeld in het tweede lid, mede bezien in het perspectief van een
      meerjarenbegroting,

      c. de procedure en criteria voor de plaatsing van leerlingen op speciale scholen voor basisonderwijs in het
      samenwerkingsverband en op scholen voor speciaal onderwijs en speciaal en voortgezet speciaal onderwijs,

      d. de procedure en het beleid met betrekking tot de terugplaatsing of overplaatsing naar het basisonderwijs van
      leerlingen van scholen voor speciaal onderwijs en speciaal en voortgezet speciaal onderwijs voor wie de periode
      waarop de toelaatbaarheidsverklaring, bedoeld in [artikel 40, tiende lid, van de Wet op de expertisecentra][ref3]
      betrekking heeft, is verstreken,

      e. de beoogde en bereikte kwalitatieve en kwantitatieve resultaten van het onderwijs aan leerlingen die extra
      ondersteuning behoeven en de daarmee samenhangende bekostiging,

      f. de wijze waarop aan de ouders informatie wordt verstrekt over de ondersteuningsvoorzieningen en over de
      onafhankelijke ondersteuningsmogelijkheden voor ouders,

      g. de wijze waarop wordt bepaald of de situaties, bedoeld in de [artikelen 118, vierde lid][ref4], en [124][ref5],
      zich voordoen,

      h. de wijze waarop wordt vastgesteld wat het aandeel van de onderscheiden scholen is in de overdracht van de
      bekostiging voor materiële instandhouding in een situatie als bedoeld in [artikel 124, zevende lid][ref6], of
      [artikel 125, zesde lid][ref7],

      i. de wijze waarop wordt bepaald of de situaties, bedoeld in [artikel 125b][ref8] zich voordoen, en

      j. de wijze waarop wordt vastgesteld wat het aandeel van de onderscheiden scholen, bedoeld in het tweede lid, is in
      de overdracht van de bekostiging personeelskosten in een situatie als bedoeld in [artikel 125b, derde lid][ref9].

      9 Het ondersteuningsplan wordt niet vastgesteld voordat over een concept van het plan op overeenstemming
      gericht overleg heeft plaatsgevonden met burgemeester en wethouders van de desbetreffende
      gemeente of gemeenten en overleg heeft plaatsgevonden met het samenwerkingsverband, bedoeld in
      [artikel 17a, tweede lid, van de Wet op het voortgezet onderwijs][ref10], waarvan het gebied geheel of gedeeltelijk
      samenvalt met het gebied van het samenwerkingsverband. Het overleg met burgemeester en wethouders vindt plaats
      overeenkomstig een procedure, vastgesteld door het samenwerkingsverband en burgemeester en wethouders van die
      gemeente of gemeenten. De procedure bevat een voorziening voor het beslechten van geschillen.

      10 Het ondersteuningsplan wordt voor 1 mei voorafgaand aan het eerste schooljaar van de periode waarop het plan
      betrekking heeft, toegezonden aan de inspectie.

      10a Het samenwerkingsverband kan, met het oog op de doelstelling, bedoeld in het tweede lid, een of meer
      orthopedagogisch-didactische centra inrichten. Bij algemene maatregel van bestuur kunnen regels worden gesteld over
      de voorwaarden waaronder een zodanige voorziening kan worden ingericht.

      11 Het samenwerkingsverband draagt er zorg voor dat deskundigen in elk geval het samenwerkingsverband adviseren
      over de toelaatbaarheid van leerlingen tot het onderwijs aan een speciale school voor basisonderwijs in het
      samenwerkingsverband of tot het speciaal onderwijs. Bij algemene maatregel van bestuur worden nadere voorschriften
      gegeven met betrekking tot de aard van de noodzakelijke deskundigheid.

      12 Het samenwerkingsverband stelt een adviescommissie als bedoeld in [artikel 7:13 van de Algemene wet
      bestuursrecht](onbekend) in, die adviseert over bezwaarschriften betreffende besluiten van het samenwerkingsverband
      over de toelaatbaarheid van leerlingen tot het onderwijs aan een speciale school voor basisonderwijs in het
      samenwerkingsverband of tot het speciaal onderwijs.

      13 Het samenwerkingsverband is bevoegd gegevens over gezondheid als bedoeld in artikel 4, onderdeel 15, van de
      Algemene verordening gegevensbescherming te verwerken met betrekking tot leerlingen, voor zover dit noodzakelijk
      is voor de uitoefening van de taken, bedoeld in het zesde lid, onderdelen b tot en met d. Het samenwerkingsverband
      verstrekt de gegevens, bedoeld in de eerste volzin, niet aan derden, met uitzondering van het bevoegd gezag van de
      school waar de desbetreffende leerling is aangemeld of ingeschreven. Het samenwerkingsverband bewaart de gegevens
      op een plaats die uitsluitend toegankelijk is voor het samenwerkingsverband en de deskundigen, bedoeld in het elfde
      lid. Het samenwerkingsverband bewaart de gegevens tot drie jaar na afloop van:

      a. de beoordeling van de toelaatbaarheid van de leerling tot het onderwijs aan een speciale school voor
      basisonderwijs in het samenwerkingsverband of tot het speciaal onderwijs,

      b. de advisering over de ondersteuningsbehoefte van de leerling aan het bevoegd gezag van de school waar de
      leerling is aangemeld of ingeschreven, of

      c. de toewijzing van ondersteuningsmiddelen of ondersteuningsvoorzieningen aan de school, voor zover het voor die
      toewijzing nodig was gegevens van de leerling als bedoeld in de eerste volzin te verwerken.

      14 Het samenwerkingsverband kent aan elke toelaatbaarheidsverklaring als bedoeld in
      [artikel 40, tiende lid, van de Wet op de expertisecentra][ref11] een volgnummer toe. Het samenwerkingsverband
      verstrekt van elk advies over de ondersteuningsbehoefte van een leerling als bedoeld in het dertiende lid,
      afschrift aan de ouders.

      15 Bevoegde gezagsorganen van tot dezelfde richting behorende scholen en scholen als bedoeld in de
      [Wet op de expertisecentra][ref12] waaraan speciaal onderwijs behorend tot cluster 3 en 4 wordt verzorgd, kunnen
      een landelijk samenwerkingsverband oprichten. Een landelijk samenwerkingsverband omvat alle in Nederland gelegen
      en tot dezelfde richting behorende scholen als bedoeld in de eerste volzin. Op een landelijk samenwerkingsverband
      zijn het tweede tot en met veertiende lid, met uitzondering van het derde en vijfde lid, en het zestiende lid van
      overeenkomstige toepassing. Indien een bevoegd gezag scholen heeft met meer dan een richting bepaalt het bevoegd
      gezag eenmalig op basis van welke richting de aansluiting bij het samenwerkingsverband plaatsvindt.

      16 Bij algemene maatregel van bestuur kunnen nadere voorschriften worden vastgesteld met betrekking tot de
      samenwerkingsverbanden.


