  - number: '132'
    text: |-
      1 Aan het samenwerkingsverband wordt personeelsbekostiging toegekend voor ondersteuningsvoorzieningen. De
      grondslag voor de berekening van de personeelsbekostiging voor ondersteuningsvoorzieningen is een bij ministeriële
      regeling vast te stellen bedrag per leerling voor het aantal leerlingen op vestigingen van basisscholen in het
      samenwerkingsverband op 1 oktober van het jaar voorafgaand aan het jaar waarover de bekostiging plaatsvindt.

      2 Aan het samenwerkingsverband wordt personeelsbekostiging toegekend in aanvulling op de in het eerste lid bedoelde
      bekostiging.

      3 De in het tweede lid bedoelde bekostiging bestaat uit een bij ministeriële regeling vast te stellen bedrag per
      leerling voor het aantal leerlingen op vestigingen van scholen in het samenwerkingsverband op 1 oktober van het
      jaar voorafgaand aan het jaar waarover de bekostiging plaatsvindt.

      4 Voor elke leerling die op 1 oktober van het jaar voorafgaand aan het jaar waarover de bekostiging plaatsvindt
      was ingeschreven op een school voor speciaal onderwijs of speciaal en voortgezet speciaal onderwijs behorend
      tot cluster 3 en 4, bedoeld in de [Wet op de expertisecentra][ref1], wordt een bedrag in mindering gebracht
      op de in het tweede lid bedoelde bekostiging van het samenwerkingsverband dat de leerling op grond van
      [artikel 40, tiende lid, van de Wet op de expertisecentra][ref2] toelaatbaar heeft verklaard tot het speciaal
      onderwijs. Het in de eerste volzin bedoelde bedrag is afhankelijk van de in de toelaatbaarheidsverklaring opgenomen
      ondersteuningsbehoefte van de leerling en komt overeen met één van de normbedragen die bij ministeriële regeling
      worden vastgesteld.

      5 Het vierde lid is van overeenkomstige toepassing op leerlingen opgenomen in residentiële instellingen aan wie op
      1 oktober van het jaar voorafgaand aan het jaar waarover de bekostiging plaatsvindt onderwijs werd gegeven op basis
      van een samenwerkingsovereenkomst als bedoeld in [artikel 71c, tweede lid, van de Wet op de expertisecentra][ref3],
      met dien verstande dat het normbedrag, bedoeld in [artikel 117, zevende lid, van die wet][ref4] in mindering wordt
      gebracht op de bekostiging van:

      a. het samenwerkingsverband:

      1°. dat verantwoordelijk is voor de bekostiging tijdens de inschrijving op een school voor speciaal
      onderwijs of speciaal en voortgezet speciaal onderwijs behorend tot cluster 3 en 4, bedoeld in de
      [Wet op de expertisecentra][ref5], indien de leerling onmiddellijk voorafgaand aan de opname in de residentiële
      instelling was ingeschreven op een school voor speciaal onderwijs of speciaal en voortgezet speciaal onderwijs, of

      2°. waartoe de vestiging van de school behoort waar de leerling was ingeschreven en bekostigd onmiddellijk
      voorafgaand aan de opname in de residentiële instelling, of

      b. het samenwerkingsverband in het gebied waarvan de leerling woonachtig is, indien de leerling onmiddellijk
      voorafgaand aan de opname in de residentiële instelling niet was ingeschreven op een school of school voor
      speciaal onderwijs of speciaal en voortgezet speciaal onderwijs behorend tot cluster 3 en 4, bedoeld in de
      [Wet op de expertisecentra][ref6].

      6 De bedragen, bedoeld in het eerste en derde lid, zijn de uitkomst van een bij algemene maatregel van bestuur vast
      te stellen hoeveelheid formatie per leerling, vermenigvuldigd met een bedrag. Bij de vaststelling van de bedragen,
      bedoeld in het eerste lid, wordt in ieder geval rekening gehouden met de ontwikkeling van de genormeerde gemiddelde
      personeelslast van de leraren van speciale scholen voor basisonderwijs. Bij de bedragen, bedoeld in het derde lid,
      wordt in ieder geval rekening gehouden met de ontwikkeling van de genormeerde gemiddelde personeelslast van de
      leraren van de scholen voor speciaal onderwijs, de scholen voor voortgezet speciaal onderwijs en de scholen voor
      speciaal en voortgezet speciaal onderwijs.

      7 [Artikel 123][ref7] is van overeenkomstige toepassing op het samenwerkingsverband.


