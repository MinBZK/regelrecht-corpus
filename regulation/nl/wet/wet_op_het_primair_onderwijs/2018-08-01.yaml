  - number: '119'
    text: |-
      1 Het bevoegd gezag dat, dan wel de gemeente die eigenaar is van een schoolgebouw, zorgt voor het deel van
      de materiële instandhouding waarop de programma's van eisen, bedoeld in [artikel 114, onder a, b en c][ref1],
      betrekking hebben.

      2 Het bevoegd gezag van een bijzondere school en het bevoegd gezag van een openbare nevenvestiging ten aanzien
      waarvan [artikel 85, tweede lid][ref2], toepassing heeft gevonden en dat eigenaar is van een schoolgebouw, kan
      met burgemeester en wethouders overeenkomen dat de gemeente het in het eerste lid bedoelde deel van de materiële
      instandhouding geheel of gedeeltelijk verzorgt.

      3 Het bevoegd gezag, bedoeld in het eerste lid, kan met een bevoegd gezag dat gebruik maakt van de voorziening in
      de huisvesting van het eerstgenoemde bevoegd gezag, overeenkomen dat het laatstgenoemde bevoegd gezag het in het
      eerste lid bedoelde deel van de materiële instandhouding geheel of gedeeltelijk verzorgt.

      4 Ingeval de gemeente eigenaar is van het schoolgebouw, kan het bevoegd gezag van een bijzondere school en het
      bevoegd gezag van een openbare nevenvestiging ten aanzien waarvan [artikel 85, tweede lid][ref3], toepassing heeft
      gevonden, met de gemeente overeenkomen dat het bevoegd gezag het in het eerste lid bedoelde deel van de materiële
      instandhouding geheel of gedeeltelijk verzorgt.

      5 Het bevoegd gezag zorgt voor het deel van de materiële instandhouding waarop de programma's van eisen, bedoeld in
      [artikel 114, onder d en e][ref4], betrekking hebben.


