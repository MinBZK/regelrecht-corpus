  - number: 17d
    text: |-
      1 Een samenwerkingsschool is een school waarin zowel openbaar onderwijs als bijzonder onderwijs wordt aangeboden.
      Een samenwerkingsschool kan uitsluitend tot stand komen door samenvoeging van één of meer openbare scholen
      met één of meer bijzondere scholen en wordt in stand gehouden door een stichting, een stichting als bedoeld in
      [artikel 17][ref1] of een stichting als bedoeld in [artikel 48][ref2] waarvan het statutaire doel in ieder geval
      is het in stand houden van een samenwerkingsschool. De [artikelen 49][ref3] en [56][ref4] zijn van overeenkomstige
      toepassing.

      2 Een samenwerkingsschool kan uitsluitend tot stand komen indien:

      a. met die totstandkoming van de samenwerkingsschool de continuïteit van het openbaar of bijzonder onderwijs
      gehandhaafd kan blijven; en

      b. de betrokken scholen ten minste zes schooljaren zijn bekostigd.

      3 Van een situatie als bedoeld in het tweede lid, onderdeel a, is sprake indien één van de betrokken scholen op
      1 oktober van het eerste of tweede schooljaar voorafgaand aan de fusiedatum werd bezocht door een aantal leerlingen
      dat ten hoogste gelijk is aan de opheffingsnorm, bedoeld in [artikel 154][ref5], verhoogd met de uitkomst van de
      formule 67,797 – (0,339 x de opheffingsnorm), met een maximum van 200 leerlingen. De uitkomst van de berekening
      wordt afgerond overeenkomstig artikel 154, tweede volzin.

      4 Samenwerkingsscholen zijn toegankelijk voor alle kinderen zonder onderscheid van godsdienst of levensbeschouwing.

      5 Aan een samenwerkingsschool is een identiteitscommissie verbonden.

      6 De identiteitscommissie adviseert gevraagd en ongevraagd het bevoegd gezag en de directeur over alle
      aangelegenheden die betrekking hebben op de wijze waarop invulling wordt gegeven aan het openbare karakter en de
      identiteit van de samenwerkingsschool. De identiteitscommissie kan tevens voorstellen doen over de aangelegenheden,
      bedoeld in de eerste volzin.

      7 De statuten van de stichting die de samenwerkingsschool in stand houdt, voorzien in een regeling over de
      identiteitscommissie waarin in ieder geval de samenstelling, benoeming, herbenoeming, ontslag, duur van de
      benoeming, werkwijze, inrichting en bevoegdheden van de identiteitscommissie zijn vastgelegd alsmede een
      voorziening voor het beslechten van geschillen tussen het bevoegd gezag en de identiteitscommissie. Bij de
      samenstelling van de identiteitscommissie is sprake van een evenwichtige verdeling tussen openbaar en bijzonder
      onderwijs.

      8 Wijziging van de statuten van de stichting die de samenwerkingsschool in stand houdt voor zover die betrekking
      hebben op de regeling over de identiteitscommissie, is slechts mogelijk indien het bevoegd gezag en de
      identiteitscommissie daartoe gezamenlijk besluiten. Indien het een stichting betreft anders dan een stichting
      als bedoeld in [artikel 17][ref6] en anders dan bedoeld in artikel 48, kan een wijziging als bedoeld in de eerste
      volzin uitsluitend tot stand komen met instemming van de gemeenteraad van de gemeente waarin de samenwerkingsschool
      gevestigd is. Instemming kan slechts worden onthouden indien overheersende invloed van de overheid in de
      identiteitscommissie niet is verzekerd voor zover het openbaar onderwijs binnen de samenwerkingsschool betreft.

      9 De stichting anders dan een stichting als bedoeld in [artikel 17][ref7] en anders dan bedoeld in
      [artikel 48][ref8] brengt jaarlijks aan de gemeenteraad van de gemeente waarin de samenwerkingsschool gevestigd is
      verslag uit over de werkzaamheden waarbij in ieder geval aandacht wordt geschonken aan de wezenskenmerken van het
      openbaar onderwijs. Het verslag wordt bekendgemaakt.

      10 De voorschriften van deze wet en van andere wetten die het primair onderwijs betreffen, alsmede de daarop
      gebaseerde regelingen, voor zover die voorschriften en regelingen betrekking hebben op een bijzondere school,
      zijn van overeenkomstige toepassing op een samenwerkingsschool als bedoeld in het eerste lid, tenzij het tegendeel
      blijkt.

      11 In geval van ernstige taakverwaarlozing door het bestuur of functioneren in strijd met de wet, voor zover
      het openbaar onderwijs betreft, neemt de gemeenteraad van de gemeente waar de samenwerkingsschool gevestigd
      is, de maatregelen die hij nodig acht om de continuïteit van het onderwijsproces te waarborgen voor zover het
      openbaar onderwijs betreft. De feitelijke samenwerking wordt beëindigd op 1 augustus van het jaar na een daartoe
      door de gemeenteraad van de gemeente waar de samenwerkingsschool gevestigd is, en het bevoegd gezag van de
      samenwerkingsschool gezamenlijk genomen besluit.

      12 [Artikel 159, tweede lid][ref9], is van overeenkomstige toepassing.

      13 Overdracht of fusie van de samenwerkingsschool is slechts mogelijk na instemming van de gemeenteraad van de
      gemeente waar de samenwerkingsschool gevestigd is.


