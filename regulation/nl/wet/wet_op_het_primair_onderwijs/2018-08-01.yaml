  - number: 194d
    text: |-
      1 Een school voor bijzonder onderwijs die op of na 1 juni 2006 is samengevoegd met een school voor openbaar
      onderwijs dan wel een school voor openbaar onderwijs die op of na 1 juni 2006 is samengevoegd met een school
      voor bijzonder onderwijs kan voor bekostiging in aanmerking worden gebracht als samenwerkingsschool als bedoeld
      in [artikel 17d][ref1].

      2 Een verzoek om voor bekostiging in aanmerking te worden gebracht als
      samenwerkingsschool wordt uiterlijk twee volledige schooljaren na inwerkingtreding van
      de__REF000_________________________________________________________________________________________________________
      ___________________________________________________________________________________________ ingediend bij Onze
      minister.

      3 Onze minister willigt het verzoek in indien ten tijde van de samenvoeging werd voldaan aan
      [artikel 17d, eerste tot en met derde lid][ref3], zoals dat artikel luidt na de inwerkingtreding van
      [artikel I, onderdeel D, van de in het tweede lid genoemde wet][ref4].

      4 Dit artikel vervalt met ingang van 1 augustus van het vijfde schooljaar na inwerkingtreding van de in het tweede
      lid genoemde [wet][ref5].


