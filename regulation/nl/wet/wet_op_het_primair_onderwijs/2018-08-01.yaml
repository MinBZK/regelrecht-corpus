  - number: 38h
    text: |-
      1 Het bevoegd gezag verstrekt aan Onze Minister de basisgegevens van
      leraren die zijn benoemd of tewerkgesteld zonder benoeming op grond van
      [artikel 3, eerste lid, onderdeel b, onder 1 en 2, tweede lid, aanhef en onderdeel a, of derde lid][ref1], en
      draagt zorg voor het correct bijhouden van die gegevens ten behoeve van het lerarenregister.

      2 De leraar verstrekt aan Onze Minister de gegevens, genoemd in
      [artikel 38g, eerste lid, onderdelen e tot en met g][ref2].

      3

      4 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de tijdstippen en wijze van
      levering, de correctie van de gegevens en over het aantonen van de bekwaamheidseisen, bedoeld in het derde lid.


