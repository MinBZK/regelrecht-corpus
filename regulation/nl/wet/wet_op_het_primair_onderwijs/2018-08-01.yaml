  - number: '30'
    text: |-
      1 Het bevoegd gezag stelt ten behoeve van de directies van zijn scholen, indien aan het totaal van die scholen van
      een ondervertegenwoordiging van vrouwen in de functie van directeur onderscheidenlijk adjunct-directeur sprake is,
      eenmaal in de 4 jaar een document inzake evenredige vertegenwoordiging van vrouwen in de schoolleiding vast.

      2 Het document bevat streefcijfers, met inbegrip van een bepaald tijdvak waarbinnen deze streefcijfers worden
      gerealiseerd, aan de hand waarvan door het bevoegd gezag een beleid inzake evenredige vertegenwoordiging
      van vrouwen in de schoolleiding wordt gevoerd, opdat aan de scholen te zamen in de functie van directeur
      onderscheidenlijk adjunct-directeur vrouwen en mannen naar evenredigheid werkzaam zullen zijn. Voor de evenredige
      vertegenwoordiging wordt uitgegaan van de verhouding mannen en vrouwen voor wat betreft het onderwijzend personeel
      dat werkzaam is in het door de school verzorgde onderwijs, zoals die blijkt uit de daarover jaarlijks door Onze
      minister gepubliceerde cijfers. Het document vermeldt tevens de maatregelen die het bevoegd gezag heeft genomen
      en zal nemen teneinde de in de eerste volzin bedoelde streefcijfers te realiseren en geeft een overzicht van de
      beoogde en bereikte resultaten van het beleid inzake evenredige vertegenwoordiging van vrouwen in de schoolleiding
      gedurende de periode waarvoor het document geldt, onderscheidenlijk de periode waarvoor het vorige document gold.

      3 Het bevoegd gezag draagt er zorg voor dat een exemplaar van het document in het gebouw van de school ter inzage
      wordt gelegd op een voor het personeel, de ouders en de leerlingen toegankelijke plaats, alsmede dat een exemplaar
      wordt bewaard bij de administratie van de school.
