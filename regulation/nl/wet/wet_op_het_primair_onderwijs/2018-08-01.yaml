        artikel: '33'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: '1'
  - number: 38a
    text: |-
      1 Degene die beschikt over een in artikel 176b bedoelde geschiktheidsverklaring, het bevoegd gezag dat betrokkene
      benoemt of tewerkstelt zonder benoeming, en het bestuur van een instelling die werkzaamheden uitvoert als bedoeld
      in artikel 176g, eerste lid onder a, sluiten een overeenkomst die hun wederzijdse rechten en plichten omvat
      met betrekking tot het uitvoeren van de noodzakelijk geachte scholing en begeleiding, met inachtneming van de
      beoordeling, bedoeld in artikel 176c, tweede lid, onder c. Indien na het sluiten van de overeenkomst blijkt dat
      de scholing of begeleiding niet volgens de overeenkomst kan worden uitgevoerd, treft het bevoegd gezag tijdig een
      toereikende vervangende voorziening.

      2 Bij of krachtens algemene maatregel van bestuur kunnen nadere voorschriften worden gegeven voor de uitvoering van
      het eerste lid, waaronder in elk geval voorschriften ter waarborging van de kwaliteit van het daarin bepaalde.

      3 Voor zover betrokkene de werkzaamheden ten aanzien waarvan hem een geschiktheidsverklaring is verstrekt, verricht
      bij twee of meer bevoegde gezagsorganen, dragen deze bevoegde gezagsorganen er zorg voor dat de overeenkomsten,
      bedoeld in het eerste lid, waarbij zij ten aanzien van betrokkene partij zijn, op elkaar worden afgestemd. Zonodig
      wordt een al gesloten overeenkomst daartoe gewijzigd.

      4 De algemene maatregel van bestuur, bedoeld in het tweede en derde lid, wordt aan de beide Kamers der Staten-
      Generaal overgelegd. De maatregel treedt niet in werking dan nadat vier weken na de overlegging zijn verstreken
      en niet door of namens een van beide Kamers de wens wordt te kennen gegeven dat het in die maatregel geregelde
      onderwerp bij de wet wordt geregeld. Alsdan wordt een daartoe strekkend wetsvoorstel zo spoedig mogelijk ingediend.
    url: https://wetten.overheid.nl/BWBR0003420/2018-08-01#Artikel38a
  - number: 38b
    text: |-
      1 Er is een lerarenregister. In het lerarenregister zijn van leraren voor
      wie de grond voor benoeming of tewerkstelling zonder benoeming is gelegen in
      [artikel 3, eerste lid, onderdeel b, onder 1 en 2, tweede lid, aanhef en onderdeel a, of derde lid][ref1],
      persoonsidentificerende gegevens, en gegevens betreffende de school, de benoeming of tewerkstelling zonder
      benoeming, en de herregistratie opgenomen.

      2 Het lerarenregister heeft tot doel:

      a. het vastleggen van het onderwijs waarvoor een leraar is benoemd of tewerkgesteld zonder benoeming op grond van
      [artikel 3, eerste lid, onderdeel b, onder 1 en 2, tweede lid, aanhef en onderdeel a, of derde lid][ref2];

      b. het vastleggen op welke wijze een leraar voldoet aan de bekwaamheidseisen; en

      c. het vastleggen of een leraar voldoet aan de herregistratiecriteria.

      3 In aanvulling op het tweede lid heeft het lerarenregister tot doel gegevens te verstrekken:

      a. aan Onze Minister ten behoeve van de beleidsvorming; en

      b. aan de inspectie voor zover de verwerking van die gegevens noodzakelijk is voor de goede vervulling van haar
      publieke taak.

      4 Onze Minister draagt zorg voor het beheer van het lerarenregister.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel3
    url: https://wetten.overheid.nl/BWBR0003420/2018-08-01#Artikel38b
