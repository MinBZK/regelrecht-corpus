  - number: 118a
    text: |-
      Indien [artikel 125][ref1] van toepassing is, wordt door het samenwerkingsverband tevens een bij het zorgplan
      bepaald gedeelte van de bekostiging bedoeld in [artikel 118][ref2] overgedragen aan de speciale school voor
      basisonderwijs. De in de eerste volzin bedoelde overdracht vindt plaats voor zover nog niet het maximum van de op
      grond van [artikel 118, eerste lid][ref3], aan het samenwerkingsverband toegekende bekostiging van de materiële
      instandhouding die samenhangt met de inrichting van de zorgstructuur op grond van [artikel 118, vierde lid][ref4],
      is overgedragen.


