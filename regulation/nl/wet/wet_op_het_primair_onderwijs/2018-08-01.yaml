      1 Het onderwijs wordt zodanig ingericht dat de leerlingen een ononderbroken ontwikkelingsproces kunnen doorlopen.
      Het wordt afgestemd op de voortgang in de ontwikkeling van de leerlingen.

      2 Het onderwijs richt zich in elk geval op de emotionele en de verstandelijke ontwikkeling, en op het ontwikkelen
      van creativiteit, op het verwerven van noodzakelijke kennis en van sociale, culturele en lichamelijke vaardigheden.

      3 Het onderwijs:

      a. gaat er mede van uit dat leerlingen opgroeien in een pluriforme samenleving,

      b. is mede gericht op het bevorderen van actief burgerschap en sociale integratie, en

      c. is er mede op gericht dat leerlingen kennis hebben van en kennismaken met verschillende achtergronden en
      culturen van leeftijdgenoten.

      4 Ten aanzien van leerlingen die extra ondersteuning behoeven, is het onderwijs gericht op individuele begeleiding
      die is afgestemd op de behoeften van de leerling. Zo nodig treedt het bevoegd gezag daarbij in overleg met:

      a. het college van burgemeester en wethouders van de gemeente waar de leerling zijn woonplaats heeft als bedoeld in
      [artikel 1.1. van de Jeugdwet][ref1],

      b. een instantie die jeugdgezondheidszorg uitvoert als bedoeld in [artikel 5 van de Wet publieke gezondheid][ref2],

      c. een instantie die maatschappelijke ondersteuning biedt als bedoeld in
      [artikel 1, eerste lid, onder g, 2°, van de Wet maatschappelijke ondersteuning][ref3],

      d. een zorgaanbieder als bedoeld in
      [artikel 1, eerste lid, onder j, van de Algemene Wet Bijzondere Ziektekosten][ref4] of

      e. een zorgaanbieder die geneeskundige geestelijke gezondheidszorg levert welke behoort tot de prestaties
      omschreven bij of krachtens de [Zorgverzekeringswet][ref5].

      5 Het bevoegd gezag stelt ten minste eenmaal in de 4 jaar een schoolondersteuningsprofiel vast.

      6 De scholen gebruiken een leerling- en onderwijsvolgsysteem waaruit de vorderingen in de kennis en vaardigheden
      blijken op het niveau van de leerling, de groep en de school. Het leerling- en onderwijsvolgsysteem bevat toetsen
      die kennis en vaardigheden van de leerling meten in elk geval op het terrein van de Nederlandse taal en rekenen en
      wiskunde, met inachtneming van de referentieniveaus Nederlandse taal en de referentieniveaus rekenen, bedoeld in
      [artikel 2, tweede lid, aanhef en onderdeel a, van de Wet referentieniveaus Nederlandse taal en rekenen][ref6].

      7 De toetsen, bedoeld in het zesde lid, voldoen aan het kwaliteitsoordeel van een door Onze minister aangewezen
      onafhankelijke commissie betreffende inhoudelijke validiteit, betrouwbaarheid en deugdelijke normering. Bij of
      krachtens algemene maatregel van bestuur kunnen voorschriften omtrent het leerling- en onderwijsvolgsysteem en de
      daaraan verbonden toetsen worden vastgesteld.

      8 De scholen voorzien in een voortgangsregistratie omtrent de ontwikkeling van leerlingen die extra ondersteuning
      behoeven, en omtrent leerlingen die onderwijs volgen als bedoeld in [artikel 165][ref7].

      9 Het onderwijs wordt zodanig ingericht dat:

      a. de leerlingen in beginsel binnen een tijdvak van 8 aaneensluitende schooljaren de school kunnen doorlopen;

      b. de leerlingen in 8 schooljaren ten minste 7.520 uren onderwijs ontvangen, met dien verstande dat:

      1°. de leerlingen in de eerste 4 schooljaren ten minste 3.520 uren onderwijs en in de laatste 4 schooljaren ten
      minste 3.760 uren onderwijs ontvangen, en

      2°. aan de leerlingen in de laatste 6 schooljaren ten hoogste 7 weken van het schooljaar 4 dagen per week onderwijs
      wordt gegeven, die evenwichtig zijn verdeeld over het schooljaar, bij een schoolweek van in beginsel niet minder
      dan 5 dagen onderwijs; en

      c. de onderwijsactiviteiten evenwichtig over de dag worden verdeeld, tenzij afwijking van deze verdeling van belang
      is in verband met activiteiten in het kader van het voorkomen en bestrijden van onderwijsachterstanden.

      10 Het onderwijs wordt zodanig ingericht dat leerlingen die in verband met ziekte thuis verblijven dan wel zijn
      opgenomen in een ziekenhuis, op adequate wijze voldoende onderwijs kunnen genieten.

      11 Het onderwijs wordt zodanig ingericht dat daarbij op structurele en herkenbare wijze aandacht wordt besteed aan
      het bestrijden van achterstanden in het bijzonder in de beheersing van de Nederlandse taal, waarin ook door middel
      van vroegschoolse educatie kan worden voorzien.

      12 De inspectie kan op verzoek van het bevoegd gezag ermee instemmen dat om lichamelijke of psychische redenen voor
      individuele leerlingen wordt afgeweken van het negende lid, onderdeel b.


