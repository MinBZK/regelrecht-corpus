  - number: '120'
    text: |-
      1 Voor de bekostiging van personeel wordt een bedrag per leerling toegekend, welk bedrag wordt verhoogd met een
      bedrag dat wordt vermenigvuldigd met de gewogen gemiddelde leeftijd van de leraren van de school op 1 oktober van
      het voorafgaande schooljaar. Voor het schooljaar waarin een nieuwe basisschool respectievelijk nieuwe speciale
      school voor basisonderwijs wordt geopend, wordt vermenigvuldigd met de geraamde landelijk gewogen gemiddelde
      leeftijd op 1 oktober van het voorafgaande schooljaar van de leraren van basisscholen respectievelijk van de
      leraren van speciale scholen voor basisonderwijs.

      2 De bedragen, bedoeld in het eerste lid, kunnen in elk geval verschillend worden vastgesteld voor leerlingen:

      a. van een basisschool in de leeftijd van 4 tot en met 7 jaar;

      b. van een basisschool in de leeftijd van 8 jaar en ouder; en

      c. van speciale scholen voor basisonderwijs.

      3 Bij algemene maatregel van bestuur wordt bepaald in welke gevallen en onder welke voorwaarden aanvullende
      bekostiging voor personeelskosten kan worden toegekend. In ieder geval wordt aanvullende bekostiging toegekend
      voor kleine basisscholen, schoolleiding, de bestrijding van onderwijsachterstanden, groei van het aantal leerlingen
      van basisscholen gedurende het schooljaar en indien onderwijs wordt gegeven in een of meer nevenvestigingen van
      een basisschool. De omvang van de aanvullende vergoeding wordt bij of krachtens algemene maatregel van bestuur
      vastgesteld.

      4 De gezamenlijke speciale scholen voor basisonderwijs van een samenwerkingsverband, ofwel, indien van het
      samenwerkingsverband geen speciale school voor basisonderwijs deel uitmaakt, het samenwerkingsverband, ontvangen
      respectievelijk ontvangt tevens een bekostiging voor ondersteuningsvoorzieningen. De in de eerste volzin bedoelde
      bekostiging is gebaseerd op 2% van het aantal leerlingen van alle scholen in het samenwerkingsverband op 1 oktober
      van het voorafgaande schooljaar, rekenkundig afgerond op een geheel getal. Het aantal leerlingen, bedoeld in de
      tweede volzin, wordt aan de afzonderlijke speciale scholen voor basisonderwijs toegerekend naar rato van het aantal
      leerlingen van elk van die scholen op die datum. De speciale school voor basisonderwijs ontvangt voor elke van de
      aan die school toegerekende leerling een bedrag per leerling, welk bedrag wordt verhoogd met een bedrag dat wordt
      vermenigvuldigd met de gewogen gemiddelde leeftijd van de leraren van die school op 1 oktober van het voorafgaande
      schooljaar. Indien alle bevoegde gezagsorganen van de scholen in het samenwerkingsverband ermee instemmen dat van
      het samenwerkingsverband geen speciale school voor basisonderwijs deel uitmaakt, ontvangt het samenwerkingsverband
      voor de leerlingen, bedoeld in de tweede volzin, een bedrag per leerling, welk bedrag wordt verhoogd met een bedrag
      dat wordt vermenigvuldigd met de geraamde landelijk gewogen gemiddelde leeftijd van leraren van speciale scholen
      voor basisonderwijs.

      5 Bij ministeriële regeling worden de bedragen, bedoeld in het eerste lid en het vierde lid vastgesteld. Het bedrag
      per leerling en het vermenigvuldigingsbedrag van de verhoging zijn de uitkomst van een bij algemene maatregel van
      bestuur vast te stellen hoeveelheid formatie per leerling vermenigvuldigd met een bedrag.

      6 Bij de vaststelling van de bedragen, bedoeld in het vijfde lid, wordt in ieder geval rekening gehouden met de
      ontwikkeling van de geraamde landelijk gewogen gemiddelde leeftijd en de genormeerde gemiddelde personeelslasten
      van leraren van basisscholen dan wel speciale scholen voor basisonderwijs, en worden nadere regels vastgesteld
      met betrekking tot de vaststelling van de in het eerste en het vierde lid bedoelde gewogen gemiddelde leeftijd en
      geraamde landelijk gewogen gemiddelde leeftijd. Indien aanvullende bekostiging wordt toegekend voor een bepaalde
      categorie personeel kan in afwijking van de eerste volzin rekening worden gehouden met de genormeerde gemiddelde
      personeelslasten van die categorie personeel.

      7 De bekostiging, bedoeld in het eerste lid, en de bekostiging voor kleine basisscholen, schoolleiding, groei
      van het aantal leerlingen van een basisschool gedurende het schooljaar en een of meer nevenvestigingen van een
      basisschool, bedoeld in de tweede volzin van het derde lid, is redelijkerwijs voldoende voor het leiden en beheren
      van de school, voor het geven van onderwijs aan de school en voor de overige werkzaamheden die verband houden met
      het onderwijs aan de school.
    url: https://wetten.overheid.nl/BWBR0003420/2018-08-01#Artikel120
  - number: '121'
    text: |-
      1 Voor de toepassing van [artikel 120, eerste lid][ref1], geldt het aantal leerlingen van de school op 1 oktober
      van het voorafgaande schooljaar.

      2 Voor de toepassing van [artikel 120, eerste lid][ref2], voor het schooljaar waarin een nieuwe school
      wordt geopend en voor het daaropvolgende schooljaar geldt het aantal leerlingen van de school op 1 oktober
      volgende op de opening. De eerste volzin is van overeenkomstige toepassing op een afdeling als bedoeld in
      [artikel 85a, eerste lid][ref3].

      3 Voor de toepassing van [artikel 120, eerste lid][ref4], geldt ingeval van samenvoeging van scholen het aantal
      leerlingen van alle bij de samenvoeging betrokken scholen, voor elke school vastgesteld volgens het eerste lid, en
      de gewogen gemiddelde leeftijd van de leraren van alle bij de samenvoeging betrokken scholen op 1 oktober van het
      voorafgaande schooljaar.

      4 Op het aantal leerlingen, bedoeld in het eerste lid, van het overblijvende deel van de school, bedoeld in
      [artikel 84a, tweede lid, onderdeel b][ref5], wordt het aantal leerlingen in mindering gebracht dat op grond van
      het tweede lid meetelt voor de bekostiging van een nieuwe school die op grond van artikel 84a voor bekostiging in
      aanmerking is gebracht.

      5 Indien van het aantal leerlingen, bedoeld in het tweede lid, van een nieuwe school die op grond van een plan
      van scholen als bedoeld in [artikel 74][ref6] voor bekostiging in aanmerking is gebracht, een substantieel aantal
      leerlingen afkomstig is van andere scholen van hetzelfde bevoegd gezag, worden die leerlingen niet meegeteld voor
      de bekostiging van die andere scholen op grond van het eerste lid. Bij algemene maatregel van bestuur wordt de
      omvang van dat aantal leerlingen bepaald, die voor categorieën van scholen kan verschillen.


