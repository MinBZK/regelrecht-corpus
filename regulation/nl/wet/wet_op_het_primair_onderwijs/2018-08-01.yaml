  - number: 194c
    text: |-
      1 Aanvragen als bedoeld in [artikel 94 van deze wet][ref1], voor zover betreft voorzieningen als bedoeld in
      [artikel 92, eerste lid, onderdeel b, van deze wet][ref2] zoals luidend op de dag voor de inwerkingtreding
      van artikel I van de Wet van 7 mei 2014 houdende wijziging van de Wet op het primair onderwijs, de Wet op de
      expertisecentra en de Wet primair onderwijs BES in verband met de overheveling van taak en budget voor aanpassingen
      in onderwijshuisvesting van gemeente naar school (Stb. 175), die worden ingediend na de inwerkingtreding van
      artikel I van die wet, blijven buiten behandeling.

      2 Het programma huisvestingsvoorzieningen dat op grond van [artikel 95 van deze wet][ref3] is vastgesteld voor
      het jaar waarin artikel I van de Wet van 7 mei 2014 houdende wijziging van de Wet op het primair onderwijs, de
      Wet op de expertisecentra en de Wet primair onderwijs BES in verband met de overheveling van taak en budget voor
      aanpassingen in onderwijshuisvesting van gemeente naar school (Stb. 175) in werking treedt, vervalt voor zover het
      betreft voorzieningen als bedoeld in [artikel 92, eerste lid, onderdeel b, van deze wet][ref4] zoals luidend op de
      dag voor de inwerkingtreding van artikel I van die wet.

      3 De programma’s huisvestingsvoorzieningen die op grond van [artikel 95 van deze wet][ref5] zijn vastgesteld
      voor de jaren voorafgaand aan de inwerkingtreding van artikel I van de Wet van 7 mei 2014 houdende wijziging van
      de Wet op het primair onderwijs, de Wet op de expertisecentra en de Wet primair onderwijs BES in verband met de
      overheveling van taak en budget voor aanpassingen in onderwijshuisvesting van gemeente naar school (Stb. 175)
      worden volledig uitgevoerd.


