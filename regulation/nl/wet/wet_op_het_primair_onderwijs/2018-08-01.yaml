  - number: '84'
    text: |-
      1 Onze minister kan onder door hem te stellen voorwaarden voor bekostiging in aanmerking brengen een school
      die wordt omgezet, als bedoeld in [artikel 74, eerste lid derde volzin][ref1], of waaraan het onderwijs
      wordt uitgebreid met onderwijs van een of meer andere richtingen dan wel een school die tot stand komt als
      samenwerkingsschool als bedoeld in [artikel 17d, eerste lid][ref2]. Artikel 74, eerste lid, vierde volzin, is niet
      van toepassing op een school die wordt omgezet als bedoeld in artikel 74, eerste lid, derde volzin.

      2 Onze minister kan besluiten toe te staan dat een bekostigde school een andere plaats van vestiging binnen de
      gemeente krijgt. Onze minister kan aan zijn toestemming voorwaarden verbinden.

      3 Een aanvraag van een besluit als bedoeld in het eerste of tweede lid gaat vergezeld van een motivering en de
      gegevens, bedoeld in [artikel 75, eerste lid][ref3].

      4 Onze minister willigt de aanvraag in ieder geval in, indien:

      a. de school, als deze in een plan van scholen zou zijn opgenomen, bij toepassing van de
      [artikelen 77 tot en met 79][ref4] door hem zou worden goedgekeurd;

      b. het een omzetting in een openbare school of een verplaatsing van een school waaraan openbaar onderwijs wordt
      gegeven betreft, binnen 10 kilometer van de plaats in de gemeente waar het onderwijs moet worden gegeven over de
      weg gemeten geen school aanwezig is waarbinnen openbaar onderwijs wordt gegeven en aan het volgen van openbaar
      onderwijs behoefte bestaat;

      c. de bekostiging van de school, als daaraan het onderwijs wordt uitgebreid met onderwijs van een
      of meer andere richtingen, van uitsluitend een of meer op te heffen scholen, met inachtneming van de
      [artikelen 154 tot en met 156][ref5] gedurende ten minste 20 achtereenvolgende jaren zou kunnen worden voortgezet;
      of

      d. een samenwerkingsschool met inachtneming van [artikel 17d][ref6] tot stand zou kunnen komen.

      5 Onze minister willigt een aanvraag niet in, indien:

      a. als gevolg van het inwilligen van de aanvraag een andere school dreigt te worden opgeheven of niet meer te
      worden bekostigd en het bevoegd gezag van die andere school daarmee niet schriftelijk heeft ingestemd; of

      b. het overeenkomstig [artikel 152][ref7] berekende aantal leerlingen van de school, daaronder niet begrepen het
      aantal leerlingen van een nevenvestiging, op 1 oktober van het schooljaar waarin de aanvraag is ingediend minder
      bedraagt dan de opheffingsnorm die, berekend overeenkomstig de [artikelen 154][ref8] en [155][ref9], geldt voor de
      gemeente of voor het deel van de gemeente waarin de school is gelegen en de school, na inwilliging van het verzoek,
      uitsluitend op grond van [artikel 153, vierde lid][ref10], voor bekostiging in aanmerking kan blijven komen of in
      stand kan worden gehouden.


