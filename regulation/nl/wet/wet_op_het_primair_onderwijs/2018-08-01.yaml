  - number: 125a
    text: |-
      Indien het totaal van de bedragen, bedoeld in [artikel 132, vierde lid, eerste volzin, en vijfde lid][ref1],
      de personeelsbekostiging van het samenwerkingsverband, bedoeld in artikel 132, tweede lid, overschrijdt, wordt
      het bedrag waarmee die bekostiging wordt overschreden door Onze minister in mindering gebracht op de personele
      bekostiging van alle scholen en scholen voor speciaal onderwijs en speciaal en voortgezet speciaal onderwijs
      behorend tot cluster 3 en 4, bedoeld in de [Wet op de expertisecentra][ref2], waarvan één of meer vestigingen zijn
      gelegen in het gebied van het samenwerkingsverband. Het bedrag dat in mindering wordt gebracht wordt per school
      dan wel school voor speciaal onderwijs of speciaal en voortgezet speciaal onderwijs behorend tot cluster 3 en 4,
      bedoeld in de Wet op de expertisecentra, voor zover het betreft het daaraan verzorgde speciaal onderwijs, bepaald
      op basis van het leerlingenaantal van de desbetreffende vestiging of vestigingen in het samenwerkingsverband.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel132
