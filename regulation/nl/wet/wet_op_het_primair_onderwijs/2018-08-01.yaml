  - number: '53'
    text: |-
      1 Ieder personeelslid is in het bezit van een door het bevoegd gezag getekende akte van aanstelling. De akte van
      aanstelling bevat in elk geval:

      a. de naam en het adres van het bevoegd gezag;

      b. de naam, de voornamen en de geboortedatum van de betrokkene;

      c. de datum van ingang van de aanstelling;

      d. de functie waarin de betrokkene wordt aangesteld;

      e. de omvang van de betrekking;

      f. de bepaling of de aanstelling in vaste of in tijdelijke dienst geschiedt en in het laatste geval de gronden voor
      de tijdelijkheid en de duur van de aanstelling;

      g. de op de dag van zijn aanstelling van toepassing zijnde schaal en het salarisnummer;

      h. de bepaling dat de betrokkene werkzaam zal zijn in algemene dienst van het bevoegd gezag; en

      i. voor personeelsleden die bij de uitoefening van hun functie kennis nemen van persoonlijke gegevens van
      leerlingen, voorschriften omtrent geheimhouding daarvan, voor zover een geheimhoudingsplicht niet uit anderen
      hoofde is verzekerd.

      2 Het bevoegd gezag draagt zorg dat afschriften van de bewijsstukken waarmee de bekwaamheid wordt aangetoond, de
      geschiktheidsverklaringen, van de verklaringen omtrent het gedrag, alsmede van de akten van aanstelling van het aan
      de school verbonden personeel worden bewaard.

      3 Het eerste lid, aanhef en onder i, en het tweede lid, zijn van overeenkomstige toepassing op personeel dat is
      tewerkgesteld zonder aanstelling.
    url: https://wetten.overheid.nl/BWBR0003420/2018-08-01#Artikel53
  - number: '55'
    text: |-
      Een bijzondere school wordt in stand gehouden door een rechtspersoon met volledige rechtsbevoegdheid die zich
      blijkens de statuten of reglementen het geven van onderwijs ten doel stelt zonder daarbij het maken van winst te
      beogen.
    url: https://wetten.overheid.nl/BWBR0003420/2018-08-01#Artikel55
  - number: '56'
    text: |-
      1 De rechtspersoon die de school in stand houdt, kan de instandhouding van de school overdragen aan een andere
      rechtspersoon die voldoet aan [artikel 55][ref1]. De overdracht geschiedt bij notariële akte.

      2 Bij deze akte verbindt de overdragende rechtspersoon zich tevens de rechten ten aanzien van gebouwen en
      terreinen alsmede de roerende zaken over te dragen. Deze akte geldt tevens als akte van levering bedoeld in
      [artikel 89 van Boek 3 van het Burgerlijk Wetboek][ref2].

      3 In de akte wordt bepaald dat de rechtspersoon aan wie wordt overgedragen, het personeel in gelijke betrekkingen
      en onder dezelfde voorwaarden als vermeld in de akte van benoeming, benoemt met ingang van de datum van overdracht.

      4 Door overdracht met inachtneming van de voorgaande leden, treedt de verkrijgende rechtspersoon in alle uit de
      wet voortvloeiende rechten en verplichtingen van zijn rechtsvoorganger met betrekking tot de school, onverminderd
      hetgeen verder voor de overgang daarvan naar burgerlijk recht is vereist.

      5 Bij een splitsing als bedoeld in [artikel 334a van Boek 2 van het Burgerlijk Wetboek][ref3] van een rechtspersoon
      die een school in stand houdt, wordt in de splitsingsakte bepaald dat de voortbestaande splitsende rechtspersoon de
      school in stand zal houden of op welke verkrijgende rechtspersoon de instandhouding van de school overgaat. In het
      laatste geval zijn het tweede tot en met vierde lid van overeenkomstige toepassing.


