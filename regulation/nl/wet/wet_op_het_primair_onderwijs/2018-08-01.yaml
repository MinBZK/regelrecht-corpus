  - number: 176f
    text: |-
      Het bekwaamheidsonderzoek strekt ertoe, vast te stellen of de leraar voldoet aan de in artikel 32a, eerste lid,
      bedoelde bekwaamheidseisen voor het onderwijs waarvoor die eisen zijn vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003420/2018-08-01#Artikel176f
  - number: 176g
    text: |-
      1 Het instellingsbestuur van een instelling voor hoger onderwijs die opleidt voor het voldoen aan bekwaamheidseisen
      als bedoeld in artikel 32a, eerste lid, en die zich daartoe bij Onze minister heeft gemeld, is na die melding en
      onder overlegging van een plan van aanpak, bevoegd tot:

      a. het verzorgen of doen verzorgen van de in artikel 176c, tweede lid, onder c, bedoelde scholing en begeleiding,
      voor zover deze verband houden met opleidingen die de instelling verzorgt, of

      b. het uitvoeren of onder zijn verantwoordelijkheid doen uitvoeren van bekwaamheidsonderzoek, voor zover de
      instelling opleidt voor het desbetreffende getuigschrift, dan wel

      c. zowel de onder a als de onder b bedoelde activiteiten.

      2 Het instellingsbestuur van een instelling voor hoger onderwijs die op grond van het eerste lid, onder b, bevoegd
      is tot het uitvoeren van het bekwaamheidsonderzoek, stelt de leraar die zich daartoe heeft gemeld en voor wie
      de scholing en begeleiding zijn afgerond overeenkomstig de in artikel 38a bedoelde overeenkomst, tijdig in de
      gelegenheid deel te nemen aan dat onderzoek.

      3 Het instellingsbestuur kan bepalen dat de aanvrager van het bekwaamheidsonderzoek aan dat bestuur een bijdrage
      is verschuldigd voor uitvoering van dat onderzoek. Bij ministeriële regeling kan voor deze bijdrage een maximum
      worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003420/2018-08-01#Artikel176g
  - number: 176h
    text: |-
      1 Het in artikel 176e en het in artikel 176g bedoelde bestuur dragen zorg voor de kwaliteit van de werkzaamheden
      van de instelling.

      2 Onze minister kan een instelling een of meer van de in artikel 176e of artikel 176g, eerste lid, bedoelde
      bevoegdheden ontnemen indien gebleken is dat de kwaliteit van de uitoefening daarvan tekortschiet, dan wel indien
      niet of niet meer wordt voldaan aan het terzake bij en krachtens deze wet bepaalde. Artikel 6.10, vierde lid, van
      de Wet op het hoger onderwijs en wetenschappelijk onderzoek is van overeenkomstige toepassing ten aanzien van de
      ontneming.
    url: https://wetten.overheid.nl/BWBR0003420/2018-08-01#Artikel176h
  - number: 176i
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur worden nadere voorschriften vastgesteld voor de uitvoering van
      artikel 176c, tweede lid onder b, en vierde lid.

      2 Tevens kunnen bij of krachtens de in het eerste lid bedoelde algemene maatregel van bestuur voorschriften worden
      vastgesteld voor de uitvoering van deze afdeling, waaronder in elk geval voorschriften met betrekking tot:

      a. waarborging van de kwaliteit van het geschiktheidsonderzoek en van de instellingen die dat onderzoek uitvoeren,

      b. de scholing en begeleiding, en het bekwaamheidsonderzoek, waaronder voorschriften ter waarborging van de
      kwaliteit, alsmede

      c. de procedure voor het aanvragen van het geschiktheidsonderzoek en voor afgifte van de geschiktheidsverklaring.

      3 De algemene maatregel van bestuur, bedoeld in het eerste lid, wordt aan de beide Kamers der Staten-Generaal
      overgelegd. De maatregel treedt niet in werking dan nadat vier weken na de overlegging zijn verstreken en niet door
      of namens een van beide Kamers de wens wordt te kennen gegeven dat het in die maatregel geregelde onderwerp bij de
      wet wordt geregeld. Alsdan wordt een daartoe strekkend wetsvoorstel zo spoedig mogelijk ingediend.
    url: https://wetten.overheid.nl/BWBR0003420/2018-08-01#Artikel176i
  - number: 176j
    text: |-
      Het in artikel 176e en het in artikel 176g bedoelde bestuur verstrekken aan Onze minister alle inlichtingen
      die deze nodig acht ten behoeve van een goede naleving van deze afdeling. Het bestuur zendt de inspectie van
      het onderwijs telkens na zes maanden een overzicht van in die periode afgegeven geschiktheidsverklaringen en
      bekwaamheidsonderzoeken waaraan met goed gevolg is deelgenomen.
    url: https://wetten.overheid.nl/BWBR0003420/2018-08-01#Artikel176j
  - number: 176k
    text: |-
      1 Met het oog op verbetering van de kwaliteit, toegankelijkheid of doelmatigheid van het
      basisonderwijs kan bij wijze van experiment bij algemene maatregel van bestuur worden afgeweken
      van [hoofdstuk I, titel I, artikelen 1][ref1] en [2][ref2], [titel II, afdeling 1][ref3],
      [afdeling 2, artikelen 47][ref4] en [48][ref5], en [titel IV, afdeling 1][ref6], [2][ref7],
      [4 tot en met 7][ref8], [afdeling 8, paragrafen 2][ref9], [3][ref10], [6][ref11] en [7][ref12] en
      [afdeling 9 paragrafen 1][ref13] en [2][ref14], van de wet.

      2 In geval van toepassing van het eerste lid wordt bij algemene maatregel van bestuur in elk geval bepaald:

      a. het doel van het experiment,

      b. op welke wijze van welke in het eerste lid bedoelde voorschriften wordt afgeweken,

      c. de duur van het experiment, en

      d. op welke wijze en aan de hand van welke criteria de met het experiment beoogde effecten worden geëvalueerd.

      3 Bij ministeriële regeling kunnen regels worden gesteld over de uitvoering van een experiment.

      4 Een experiment duurt ten hoogste zes jaar, tenzij een langere duur gezien de bijzondere aard van het experiment
      noodzakelijk is. Alsdan wordt de duur van het experiment op ten hoogste acht jaar bepaald. Indien een voorstel
      van wet is ingediend bij de Staten-Generaal om het experiment om te zetten in een structurele wettelijke regeling,
      voordat een experiment is afgelopen, kan Onze Minister het experiment verlengen tot het tijdstip waarop het
      wetsvoorstel tot wet is verheven en in werking treedt.

      5 Onze Minister zendt drie maanden voor het einde van de werkingsduur van een algemene maatregel van bestuur
      als bedoeld in het eerste lid aan de Staten-Generaal een verslag over de doeltreffendheid en de effecten van het
      experiment in de praktijk, evenals een standpunt over de voortzetting van die algemene maatregel van bestuur,
      anders dan een voortzetting als experiment.

      6 In verband met een experiment als bedoeld in het eerste lid, kan bij algemene maatregel van bestuur eveneens bij
      wijze van experiment worden afgeweken van [artikel 1 van de Leerplichtwet 1969][ref15].

      7 Dit artikel is van overeenkomstige toepassing op een samenwerkingsverband van een school
      met een school als bedoeld in [artikel 1][ref16], een school of instelling als bedoeld in de
      [Wet op de expertisecentra][ref17], of een school als bedoeld in de [Wet op het voortgezet onderwijs][ref18].
      Bij samenwerking met een school of instelling kan voor die school of instelling respectievelijk
      worden afgeweken van [titel I, artikelen 1][ref19] en [2][ref20], [titel II, afdeling 1][ref21] en
      [titel IV, afdelingen 4 tot en met 6][ref22] en [afdeling 7, paragrafen 2][ref23], [3][ref24], [6][ref25]
      en [7 van de Wet op de expertisecentra][ref26], en [titel II, afdeling I, hoofdstuk I][ref27] en
      [titel III, afdeling II van de Wet op het voortgezet onderwijs][ref28]. Bij de algemene maatregel van bestuur,
      bedoeld in het tweede lid, wordt geregeld welke bij of krachtens de wet, de Wet op de expertisecentra of de Wet
      op het voortgezet onderwijs vastgestelde voorschriften van toepassing of van overeenkomstige toepassing zijn op
      de samenwerking.

      8 De voordracht voor de algemene maatregel van bestuur, bedoeld in het tweede lid, wordt niet eerder gedaan dan
      vier weken nadat het ontwerp aan beide Kamers der Staten-Generaal is overgelegd.


