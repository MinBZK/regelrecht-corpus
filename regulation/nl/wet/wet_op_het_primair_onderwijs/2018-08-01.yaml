  - number: '144'
    text: |-
      1 Indien een gemeente een of meer scholen in stand houdt, stellen burgemeester en wethouders onderscheiden al naar
      gelang het basisscholen of speciale scholen voor basisonderwijs betreft, jaarlijks voorlopig vast:

      a. het totaal van de bedragen die in het voorafgaande kalenderjaar zijn uitgegeven ten behoeve van de
      personeelskosten,

      b. het totaal van de bedragen die in het voorafgaande kalenderjaar zijn uitgegeven ten behoeve van personeels- en
      arbeidsmarktbeleid als bedoeld in [artikel 129][ref1] en ten behoeve van schoolbegeleiding,

      c. het totaal van de bedragen die in het voorafgaande kalenderjaar zijn uitgegeven ten behoeve van de materiële
      instandhouding,

      d. het totaal van de ontvangsten, bedoeld in de [artikelen 116][ref2] en [137][ref3], in het voorafgaande
      kalenderjaar,

      e. het totaal van de ontvangsten dat is gebaseerd op de bedragen die krachtens [artikel 129, tweede lid][ref4],
      ten behoeve van personeels- en arbeidsmarktbeleid en die ten behoeve van schoolbegeleiding voor het kalenderjaar
      zijn vastgesteld,

      f. het totaal van de ontvangsten dat is gebaseerd op de bedragen die krachtens [artikel 113][ref5] voor de
      voorzieningen voor de materiële instandhouding voor dat kalenderjaar zijn vastgesteld,

      g. het totaal van de aanvullende ontvangsten waaronder worden verstaan de bedragen die krachtens
      [artikel 135][ref6] voor de voorzieningen ten behoeve van de materiële instandhouding voor dat kalenderjaar zijn
      vastgesteld,

      h. het totaal van de bedragen die in het voorafgaande kalenderjaar zijn uitgegeven ten behoeve van de
      instandhouding van een rechtspersoon als bedoeld in [artikel 68][ref7],

      i. het totaal van de ontvangsten op grond van [artikel 134, tweede lid, tweede volzin][ref8], en

      j. een staat van voorzieningen die zijn ingesteld ten behoeve van de door de gemeente in stand gehouden scholen.

      2 Indien de gemeente een deel van de ontvangsten bedoeld, in het eerste lid onder d of een deel van de ontvangsten,
      bedoeld in dat lid onder e, f, g en i, toevoegt aan een voorziening, wordt dat deel aangemerkt als een uitgave als
      bedoeld in dat lid onder a, onderscheidenlijk als een uitgave als bedoeld in dat lid onder b, c en h. Indien de
      gemeente ten behoeve van de personeelskosten, de nascholingskosten, de kosten voor materiële instandhouding of de
      kosten voor de instandhouding van een rechtspersoon als bedoeld in [artikel 68][ref9], bedragen aan een voorziening
      onttrekt, worden deze aangemerkt als ontvangsten als bedoeld in het eerste lid onder d, e of f.

      3 Bij het vaststellen van de bedragen, bedoeld in het eerste lid onder c, f, g en h, worden buiten beschouwing
      gelaten de uitgaven en ontvangsten voor:

      a. administratie, beheer en bestuur, bedoeld in [artikel 114 , onder e][ref10],

      b. de materiële instandhouding van het onderwijs in lichamelijke oefening en

      c. de materiële instandhouding in verband met de toepassing van [artikel 165][ref11].

      4 Bij het vaststellen van de bedragen, bedoeld in het eerste lid onder a, worden buiten beschouwing gelaten
      de uitgaven ten behoeve van personeel dat door de gemeente met toepassing van [artikel 165][ref12], aan een
      openbare school wordt verbonden. Bij het vaststellen van de bedragen, bedoeld in het eerste lid onder a, b,
      c en h, worden voorts buiten beschouwing gelaten de uitgaven die worden gedekt door ontvangsten van bedragen
      die door derden zijn betaald, de uitgaven die worden gedekt door ontvangsten op grond van een besluit als
      bedoeld in [artikel 140, zesde lid, tweede volzin][ref13], en de uitgaven voor de voorzieningen waarvoor het
      bevoegd gezag van een niet door de gemeente in stand gehouden school op grond van de regeling, bedoeld in
      [artikel 141, eerste lid][ref14], een aanvraag bij de gemeente kon indienen en wel gedurende de periode waarvoor
      een dergelijke aanvraag kon worden gedaan. Bij het vaststellen van de bedragen, bedoeld in het eerste lid onder a,
      b, c en h, blijven de uitgaven ten behoeve van een basisschool buiten beschouwing tot het bedrag dat de gemeente
      voor die school overdraagt op grond van [artikel 118][ref15], [artikel 124][ref16] of [artikel 125][ref17].

      4a Bij het vaststellen van de bedragen bedoeld in het eerste lid, onder c, mogen voorzieningen die volgens de
      desbetreffende rijksbekostiging een afschrijvingstermijn van ten minste 20 jaar hebben, over ten hoogste 20 jaar
      worden aangemerkt als jaarlijkse uitgaven op grond van rente op basis van een fictieve lening met een looptijd van
      ten hoogste 20 jaar en een lineaire aflossing.

      5 Indien de gemeente een deel van de bekostiging voor uitgaven voor personeel en kosten voor materiële
      instandhouding overdraagt aan een ander bevoegd gezag, wordt dat deel aangemerkt als een uitgave als bedoeld
      in het eerste lid, onderdeel a, of onderdeel c. Indien door een ander bevoegd gezag een deel van de bekostiging
      voor personeelskosten en kosten voor materiële instandhouding aan de gemeente wordt overgedragen, wordt dat deel
      aangemerkt als een ontvangst als bedoeld in het eerste lid, onderdeel d, of onderdeel f.

      6 Om de vijf jaar stellen burgemeester en wethouders voorlopig vast het totaal van de vastgestelde uitgaven
      en ontvangsten in de voorafgaande vijf kalenderjaren, zoals in het eerste tot en met vijfde lid is aangegeven.
      Indien de uitgaven hoger zijn dan de ontvangsten, bepalen burgemeester en wethouders tevens het bedrag van de
      overschrijding. Indien een gemeente vanaf een tijdstip binnen een periode van vijf jaar als bedoeld in de eerste
      volzin geen school in stand houdt, stellen burgemeester en wethouders in afwijking van die volzin zo spoedig
      mogelijk na dat tijdstip voorlopig vast het totaal van de vastgestelde uitgaven en ontvangsten in het aan dat
      tijdstip voorafgaande deel van de periode van vijf jaar, zoals in het eerste tot en met vijfde lid is aangegeven.

      7 Na sluiting van de rekening van de gemeente stellen burgemeester en wethouders de in het eerste en zesde lid
      bedoelde bedragen, zo nodig gewijzigd, vast. In het geval, bedoeld in het zesde lid, tweede volzin, drukken
      burgemeester en wethouders vervolgens het bedrag van de overschrijding uit in een percentage van het totaal van de
      ontvangsten, bedoeld in het eerste lid onder d tot en met g en i. Het percentage wordt afgerond tot twee decimalen.
      Afronding naar beneden vindt plaats indien de derde decimaal kleiner is dan 5, en naar boven indien deze decimaal
      ten minste 5 bedraagt.


