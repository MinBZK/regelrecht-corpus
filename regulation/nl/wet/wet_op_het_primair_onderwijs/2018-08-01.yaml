  - number: 184a
    text: |-
      1 De rechtspersoon, bedoeld in [artikel 184][ref1], kan het burgerservicenummer van het gewezen personeelslid,
      uitsluitend in het kader van het doel, bedoeld in artikel 184, eerste lid, gebruiken in het verkeer met:

      a. het gewezen personeelslid,

      b. het bevoegd gezag van de school, het bestuur van de centrale dienst dan wel het samenwerkingsverband waar de in
      onderdeel a bedoelde persoon werkzaam was,

      c. Onze minister, of

      d. de instantie, bedoeld in [artikel 184, vijfde lid][ref2].

      2 Het burgerservicenummer wordt op een daartoe strekkend verzoek van de in het eerste lid bedoelde rechtspersoon
      aan die rechtspersoon verstrekt door het bevoegd gezag van de school, het bestuur van de centrale dienst dan wel
      het samenwerkingsverband waar het gewezen personeelslid werkzaam was.

      3 Indien dat ten behoeve van het jaarverslag, bedoeld in
      [artikel 18, eerste lid, van de Kaderwet zelfstandige bestuursorganen][ref3], noodzakelijk is, worden gegevens
      daarin slechts zodanig openbaar gemaakt dat daaraan geen herkenbare gegevens over een afzonderlijk persoon
      kunnen worden ontleend, tenzij het betreft de controle op de juistheid van de gegevens in het kader van de
      controle op de rechtmatigheid en de doelmatigheid van door de rechtspersoon gedane uitgaven. Daarbij kunnen de
      burgerservicenummers worden vergeleken met de burgerservicenummers die door andere daartoe bij of krachtens de wet
      bevoegde instanties zijn verstrekt.


