  - number: 178b
    text: |-
      1 Onze minister neemt de door het bevoegd gezag verstrekte persoonsgebonden nummers en andere gegevens, bedoeld
      in [artikel 178a, tweede en zevende lid][ref1], op in het basisregister onderwijs, nadat hij deze gegevens
      heeft getoetst op juistheid en volledigheid. Onze minister verstrekt de gegevens, inclusief de gegevens,
      bedoeld in [artikel 24c, eerste lid, onderdeel g, van de Wet op het onderwijstoezicht][ref2], zoals hij
      voornemens is die gegevens in het basisregister onderwijs op te nemen, aan het bevoegd gezag. Onverminderd
      [artikel 178c, tweede lid][ref3], kan Onze minister de door het bevoegd gezag verstrekte gegevens uitsluitend met
      instemming van het bevoegd gezag wijzigen.

      2 Het bevoegd gezag verstrekt Onze minister alle inlichtingen die hij nodig acht voor de uitvoering van de taak,
      bedoeld in het eerste lid. Het bevoegd gezag werkt eraan mee dat de in het basisregister onderwijs opgenomen
      gegevens juist en volledig zijn.

      3 Indien Onze minister naar aanleiding van de toetsing, bedoeld in het eerste lid, redenen heeft om aan te
      nemen dat een bevoegd gezag in strijd handelt of heeft gehandeld met het bepaalde bij of krachtens deze wet en
      een onderzoek daarnaar door de inspectie nodig acht, verstrekt Onze minister ten behoeve van dit onderzoek de
      persoonsgebonden nummers en andere gegevens van leerlingen aan de inspectie. De inspectie meldt de uitkomst van het
      onderzoek aan Onze minister.

      4 Onze minister en de inspectie verstrekken ter uitvoering van
      [artikel 107, tweede lid, van de Vreemdelingenwet 2000][ref4] geen gegevens die zij op grond van het derde lid
      hebben ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel178a
