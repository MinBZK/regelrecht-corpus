        hoofdstuk: I
        afdeling: '3'
  - number: '104'
    text: |-
      Tenzij het bevoegd gezag van een niet door de gemeente in stand gehouden school dat aanspraak heeft op bekostiging
      van een voorziening in de huisvesting, met burgemeester en wethouders overeenkomt dat de gemeente deze voorziening
      tot stand brengt, behoeven de bouwplannen en de desbetreffende begrotingen de instemming van burgemeester en
      wethouders.
    url: https://wetten.overheid.nl/BWBR0003420/2018-08-01#Artikel104
  - number: '105'
    text: |-
      De gemeente brengt een voorziening in de huisvesting van een niet door de gemeente in stand gehouden school
      slechts tot stand, indien tussen burgemeester en wethouders en het bevoegd gezag overeenstemming bestaat over de
      bouwplannen en de wijze van uitvoering.
    url: https://wetten.overheid.nl/BWBR0003420/2018-08-01#Artikel105
  - number: '106'
    text: |-
      1 Het bevoegd gezag is verplicht het gebouw en terrein, alsmede de roerende zaken waarvoor bekostiging wordt
      genoten, behoorlijk te gebruiken en te onderhouden.

      2 Vervreemding door het bevoegd gezag van een niet door de gemeente in stand gehouden school anders dan op grond
      van [artikel 49][ref1] of [artikel 56][ref2] van gebouwen, terreinen en roerende zaken waarvoor bekostiging wordt
      genoten, of bezwaren met een zakelijk recht door het bevoegd gezag van een niet door de gemeente in stand gehouden
      school van zodanige gebouwen en terreinen, is zonder toestemming van burgemeester en wethouders nietig.

      3 Het tweede lid is niet van toepassing ten aanzien van het recht van opstal ten behoeve van een door de gemeente
      te plaatsen tijdelijke voorziening in de huisvesting op grond die eigendom is van het bevoegd gezag van de
      betrokken school.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel56
