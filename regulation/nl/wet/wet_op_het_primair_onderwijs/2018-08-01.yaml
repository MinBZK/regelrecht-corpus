  - number: '137'
    text: |-
      1 Met inachtneming van de [artikelen 120][ref1] en [121][ref2] verstrekt het Rijk jaarlijks aan het bevoegd gezag
      een bekostigingsbedrag ten behoeve van de personeelskosten.

      2 In geval van het verstrekken van een bijzondere bekostiging als bedoeld in [artikel 123][ref3] verstrekt het Rijk
      aan het desbetreffende bevoegd gezag het bedrag van deze bekostiging.

      3 Het Rijk verstrekt jaarlijks aan het samenwerkingsverband een bedrag ten behoeve van de personeelskosten.

      4 Bij of krachtens algemene maatregel van bestuur worden voorschriften gegeven met betrekking tot het betalen van
      het in het eerste, tweede en derde lid bedoelde bedrag.

      5 Op het in het eerste, tweede en derde lid bedoelde bedrag worden op een bij ministeriële regeling vast te stellen
      wijze in mindering gebracht de inkomsten die het bevoegd gezag dan wel het samenwerkingsverband direct of indirect
      geniet vanwege uitkeringen of toelagen waarop door het personeel aanspraak kan worden gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel120
