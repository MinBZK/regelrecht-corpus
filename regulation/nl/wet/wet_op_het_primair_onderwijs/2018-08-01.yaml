      1 Instemming van Onze minister is vereist ten aanzien van de statuten van de rechtspersoon, bedoeld in
      [artikel 183][ref1], alsmede ten aanzien van wijziging van die statuten.

      2 Onze minister is bevoegd tot intrekking van de aanwijzing van de rechtspersoon, bedoeld in [artikel 183][ref2].

      3 Bij algemene maatregel van bestuur worden regels gesteld omtrent:

      a. nadere taakomschrijving van de rechtspersoon;

      b. de voorwaarden voor instemming door Onze minister met de statuten van de rechtspersoon en wijziging van deze
      statuten; en

      c. de gevolgen van intrekking van de aanwijzing van de rechtspersoon.

      4 Krachtens bij algemene maatregel van bestuur vast te stellen voorschriften kan Onze minister subsidie verlenen
      aan de rechtspersoon ten behoeve van:

      a. bedragen die, gedurende een vooraf vastgestelde periode en tot een vooraf vastgestelde maximale
      hoogte, strekken ter vervanging van de vergoeding ten behoeve van de kosten voor vervanging, bedoeld in
      [artikel 126, eerste lid][ref3], en de bijdrage, bedoeld in [artikel 183, tweede lid][ref4], voor zover die
      betrekking heeft op de kosten van vervanging van personeel wegens voorschriften gegeven bij algemene maatregel van
      bestuur of bij ministeriële regeling,

      b. een bijdrage aan de kosten van de bedrijfsvoering van de rechtspersoon, en

      c. een bijdrage ten behoeve van de uitoefening van landelijke taken in het kader van de bedrijfsgezondheidszorg.

      5 Bij de algemene maatregel van bestuur, bedoeld in het vierde lid, kan ten behoeve van een in dat lid bedoelde
      subsidie een subsidieplafond worden vastgesteld.

      6 Het bestuur van de rechtspersoon kan ten behoeve van de uitoefening van landelijke taken in het kader van de
      bedrijfsgezondheidszorg subsidie aan derden verstrekken.

      7 De algemene maatregel van bestuur, bedoeld in het derde en vierde lid, wordt aan de Tweede Kamer der Staten-
      Generaal overgelegd. De maatregel treedt niet in werking dan nadat 4 weken na de overlegging zijn verstreken
      en gedurende die termijn niet door of namens de Kamer de wens te kennen wordt gegeven dat het in die maatregel
      geregelde onderwerp bij de wet wordt geregeld. Alsdan wordt een daartoe strekkend wetsvoorstel zo spoedig mogelijk
      ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel183
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel183
