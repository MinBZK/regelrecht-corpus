  - number: '143'
    text: |-
      1 Burgemeester en wethouders stellen, onderscheiden al naar gelang het basisscholen of speciale scholen voor
      basisonderwijs betreft, jaarlijks vast in welke mate zij ten behoeve van de door de gemeente in stand gehouden
      scholen meer dan wel minder uitgaven zullen doen voor het personeel en de materiële instandhouding dan door het
      Rijk worden bekostigd. Deze vaststelling geschiedt voor het komende begrotingsjaar en het resterende deel van het
      vijfjarig tijdvak, bedoeld in [artikel 142, eerste lid][ref1].

      2 Indien voor het komende begrotingsjaar meer uitgaven zullen worden gedaan voor het personeel en de materiële
      instandhouding dan door het Rijk worden bekostigd, verlenen burgemeester en wethouders in dat begrotingsjaar
      aan het bevoegd gezag van de niet door de gemeente in stand gehouden basisscholen onderscheidenlijk speciale
      scholen voor basisonderwijs in de gemeente een voorschot op het te verwachten overschrijdingsbedrag, bedoeld in
      [artikel 142, eerste lid][ref2]. Indien uit het besluit van burgemeester en wethouders, bedoeld in het eerste lid,
      blijkt dat de hiervoor bedoelde meer-uitgaven in de resterende jaren van het vijfjarig tijdvak geheel of ten dele
      worden gecompenseerd door minder uitgaven, wordt hiermee rekening gehouden bij de bepaling van de hoogte van het
      voorschot.

      3 Indien uit de jaarlijkse voorlopige vaststelling van de bedragen, bedoeld in [artikel 144, eerste lid][ref3],
      blijkt dat, in afwijking van hetgeen is vastgesteld bij het besluit van burgemeester en wethouders, bedoeld in
      het eerste lid, meer uitgaven zijn gedaan voor personeel en materiële instandhouding dan door het Rijk worden
      bekostigd, verlenen burgemeester en wethouders alsnog een voorschot aan het bevoegd gezag van de niet door de
      gemeente in stand gehouden basisscholen onderscheidenlijk speciale scholen voor basisonderwijs in de gemeente. Bij
      de bepaling van de hoogte van het voorschot is de tweede volzin van het tweede lid van overeenkomstige toepassing.


