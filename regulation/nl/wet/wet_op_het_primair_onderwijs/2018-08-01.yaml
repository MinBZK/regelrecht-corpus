  - number: '42'
    text: |-
      1 Over iedere leerling die de school verlaat, stelt de directeur, na overleg met het onderwijzend personeel, ten
      behoeve van de ontvangende school of school als bedoeld in de [Wet op de expertisecentra][ref1] dan wel als bedoeld
      in de [Wet op het voortgezet onderwijs][ref2] een onderwijskundig rapport op. Afschrift van dit rapport wordt aan
      de ouders van de leerling verstrekt. Bij algemene maatregel van bestuur worden nadere voorschriften omtrent dit
      rapport gegeven. De centrale eindtoets of andere eindtoets dient als tweede objectieve gegeven om onderadvisering
      vanuit het primair onderwijs te voorkomen.

      2 Ten behoeve van iedere leerling in het achtste schooljaar stelt het bevoegd gezag voor 1 maart
      een schooladvies vast omtrent het volgen van aansluitend voortgezet onderwijs als bedoeld in
      de [Wet op het voortgezet onderwijs][ref3] of voortgezet speciaal onderwijs als bedoeld in de
      [Wet op de expertisecentra][ref4]. Het schooladvies maakt onderdeel uit van het onderwijskundig rapport. Indien de
      leerling blijkens de uitslag van de centrale eindtoets of andere eindtoets, bedoeld in [artikel 9b][ref5], beschikt
      over meer kennis en vaardigheden dan die waarop het schooladvies berust, heroverweegt het bevoegd gezag het
      schooladvies. Indien hierbij wordt afgeweken van de uitslag van de centrale eindtoets of andere eindtoets, wordt
      dit gemotiveerd.

      3 De in het eerste lid bedoelde algemene maatregel van bestuur wordt aan de beide kamers der Staten-Generaal
      overgelegd. De maatregel treedt niet in werking dan nadat vier weken na de overlegging zijn verstreken en gedurende
      die termijn niet door of namens een van beide kamers de wens te kennen wordt gegeven dat het in die maatregel
      geregelde onderwerp bij de wet wordt geregeld. Alsdan wordt een daartoe strekkend wetsvoorstel zo spoedig mogelijk
      ingediend.


