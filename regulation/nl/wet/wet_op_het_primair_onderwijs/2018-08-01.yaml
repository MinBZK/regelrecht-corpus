  - number: 9b
    text: |-
      1 In het achtste schooljaar legt de leerling in een volledige week tussen 15 april en 15 mei een centrale eindtoets
      af.

      2 De centrale eindtoets meet kennis en vaardigheden van de leerling op het terrein van Nederlandse taal en
      rekenen en wiskunde. Het bevoegd gezag kan bij een leerling tevens de toets voor de kennisgebieden, genoemd in
      [artikel 9, tweede lid, onderdelen a, b en c][ref1], afnemen.

      3 Indien een leerling is verhinderd de centrale eindtoets af te leggen, wordt de toets op een later moment alsnog
      afgenomen, tenzij dit voor de leerling om medische redenen onmogelijk is.

      4 Het bevoegd gezag kan mede op basis van de toetsgegevens in het leerling- en onderwijsvolgsysteem, bedoeld in
      [artikel 8, zesde lid][ref2], gemotiveerd bepalen dat geen centrale eindtoets wordt afgelegd door:

      a. zeer moeilijk lerende leerlingen,

      b. meervoudig gehandicapte leerlingen voor wie het zeer moeilijk lerend zijn een van de handicaps is, en

      c. leerlingen die vier jaar of korter in Nederland zijn en om die reden de Nederlandse taal onvoldoende beheersen.

      5 Indien het bevoegd gezag op grond van het vierde lid, onderdelen a of b, bepaalt dat de leerling geen centrale
      eindtoets aflegt, informeert het de ouders over de grond voor die toepassing voor de aanvang van de afname van de
      centrale eindtoets.

      6 Indien het bevoegd gezag voornemens is te bepalen dat de leerling op grond van het vierde lid, onderdeel c, geen
      toets aflegt, overlegt het bevoegd gezag hierover met de ouders.

      7 Onze minister kan het gebruik van andere eindtoetsen dan de centrale eindtoets, bedoeld in het eerste lid,
      toelaten. Dit artikel is van overeenkomstige toepassing op de andere eindtoetsen met dien verstande dat bij
      algemene maatregel van bestuur voorschriften worden gesteld ten aanzien van de toelating van andere eindtoetsen.

      8 Bij of krachtens algemene maatregel van bestuur kunnen voorschriften omtrent de centrale eindtoets worden
      vastgesteld.

      9 Tot een bij koninklijk besluit te bepalen datum zijn het eerste tot en met het achtste lid, niet van toepassing
      op leerlingen van een speciale school voor basisonderwijs.


