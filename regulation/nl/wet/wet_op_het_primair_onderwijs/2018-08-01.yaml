  - number: '154'
    text: |-
      Voor iedere gemeente wordt, op basis van de leerlingdichtheid in die gemeente, een opheffingsnorm vastgesteld aan
      de hand van de formule:

      Opheffingsnorm = 0,6 x (leerlingdichtheid : (0,15 + 0,0027 x leerlingdichtheid))

      De uitkomst van de berekening wordt afgerond, waarbij de decimalen worden verwaarloosd indien het eerste cijfer
      achter de komma kleiner is dan 5 en waarbij de decimalen worden verwaarloosd en het getal verhoogd met 1 indien het
      eerste cijfer achter de komma gelijk is aan of groter is dan 5. De opheffingsnorm bedraagt minimaal 23 en maximaal
      200. De leerlingdichtheid is de uitkomst van het aantal inwoners van 4 tot en met 11 jaar in die gemeente gedeeld
      door het aantal km2 grondoppervlakte van die gemeente. Indien het aantal km2 van de gemeente minder bedraagt dan 10
      km2, wordt voor de berekening van de leerlingdichtheid uitgegaan van 10 km2. De leerlingdichtheid bedraagt maximaal
      500.
    url: https://wetten.overheid.nl/BWBR0003420/2018-08-01#Artikel154
  - number: '155'
    text: |-
      1 Burgemeester en wethouders kunnen, indien elk bevoegd gezag dat een of meer scholen in de gemeente in stand
      houdt schriftelijk heeft verklaard daarmee in te stemmen, besluiten dat het grondgebied van de gemeente in twee
      bij dat besluit vastgestelde delen wordt gesplitst in verband met aanzienlijke verschillen in bebouwingskarakter
      en bevolkingsdichtheid tussen die delen. De grenzen van de delen van de gemeente die zijn ontstaan als gevolg
      van toepassing van de eerste volzin, vallen samen met grenzen van gebieden in die gemeente die zijn opgenomen in
      de jaarlijkse publikatie van het Centraal Bureau voor de Statistiek «De landelijke wijk- en buurtindeling». Het
      besluit is gedurende 20 jaar van kracht behoudens het gestelde in het vijfde lid.

      2 Burgemeester en wethouders brengen Onze minister binnen vier weken na het nemen van het besluit, bedoeld in
      het eerste lid, op de hoogte van dat besluit, waarbij tevens mededeling wordt gedaan van de begrenzing van de
      beide gebiedsdelen, de oppervlakte daarvan en het aantal 4- tot en met 11-jarigen dat daarbinnen woonachtig is.
      Na ontvangst van een mededeling als bedoeld in de eerste volzin wordt bij ministeriële regeling voor de beide
      gebiedsdelen een afzonderlijke opheffingsnorm vastgesteld. De opheffingsnorm voor elk deel wordt vastgesteld op
      de wijze als aangegeven in [artikel 154][ref1], met dien verstande dat bij het bepalen van de leerlingdichtheid
      wordt uitgegaan van het aantal km2 grondoppervlakte van het desbetreffende deel en dat de vijfde volzin van
      artikel 154 niet van toepassing is. De ministeriële regeling wordt overeenkomstig [artikel 153, tweede lid][ref2],
      bekendgemaakt en is voor de eerste maal van toepassing met ingang van 1 augustus, volgend op die bekendmaking.

      3 Indien niet elk bevoegd gezag een schriftelijke verklaring als bedoeld in het eerste lid eerste volzin wenst te
      verstrekken, kunnen burgemeester en wethouders Onze minister verzoeken een besluit tot splitsing als bedoeld in het
      eerste lid te nemen. Met betrekking tot de aanvraag is het tweede lid eerste volzin van overeenkomstige toepassing,
      met dien verstande dat burgemeester en wethouders eveneens de ontvangen instemmende verklaringen overleggen,
      alsmede een opgave van de scholen waarvan het bevoegd gezag geen instemmende verklaring wenste te verstrekken.
      Indien Onze minister tot splitsing van de gemeente besluit zijn op dit besluit de tweede tot en met vierde volzin
      van het tweede lid van overeenkomstige toepassing.

      4 Van een besluit van burgemeester en wethouders inhoudende een weigering om tot splitsing van de gemeente,
      als bedoeld in het eerste lid, over te gaan en van een besluit van burgemeester en wethouders, inhoudende een
      weigering om een aanvraag tot een zodanige splitsing bij Onze minister in te dienen, kan iedere natuurlijke
      persoon of rechtspersoon die daardoor rechtstreeks in zijn belang is getroffen, bij de Kroon in beroep komen. Met
      een weigering om tot splitsing van de gemeente over te gaan, wordt gelijk gesteld het niet nemen van een besluit
      met betrekking tot splitsing binnen 6 maanden na verzending van de laatste instemmende verklaring van de bevoegde
      gezagsorganen, bedoeld in het eerste lid. Met een weigering om een aanvraag tot splitsing bij Onze minister in te
      dienen, wordt gelijkgesteld het niet nemen van een besluit binnen 6 maanden na verzending van een aanvraag daartoe
      aan burgemeester en wethouders door een bevoegd gezag dat een of meer scholen in de gemeente in stand houdt. Het
      beroep wordt ingesteld binnen 30 dagen nadat het besluit openbaar is gemaakt of ter kennis is gebracht van degene
      jegens wie het besluit is genomen dan wel binnen 30 dagen na het verstrijken van de termijn van 6 maanden bedoeld
      in de tweede of derde volzin.

      5 Op grond van bijzondere omstandigheden die voortvloeien uit de ruimtelijke ordening en die op het moment
      dat het besluit tot splitsing als bedoeld in het eerste of derde lid werd genomen niet voorzienbaar waren, kan
      de gemeenteraad binnen de in het eerste lid bedoelde termijn van 20 jaar een besluit nemen tot wijziging of
      beëindiging van de splitsing. Het eerste tot en met het vierde lid zijn van overeenkomstige toepassing. Een besluit
      van de gemeenteraad tot wijziging of beëindiging van de splitsing behoeft de goedkeuring van Onze minister.


