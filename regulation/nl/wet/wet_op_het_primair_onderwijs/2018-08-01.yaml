      1 Indien het bevoegd gezag tekortschiet in haar zorg voor de kwaliteit van het onderwijs, bedoeld in
      [artikel 10][ref1], kan Onze minister op verzoek van het bevoegd gezag van een school of uit eigen beweging in
      overeenstemming met het bevoegd gezag maatregelen treffen.

      2 Tot de maatregelen, bedoeld in het eerste lid, behoort de mogelijkheid het bestuur van de instelling te laten
      bijstaan door een extern deskundige. Ook kunnen onder voorwaarden extra financiële middelen aan de instelling ter
      beschikking worden gesteld.

      3 Onze minister stelt nadere regels omtrent de toekenning van en verantwoording voor maatregelen, voorzover deze
      het verstrekken van financiële middelen betreffen.

      4 Het eerste tot en met het derde lid is van overeenkomstige toepassing ten aanzien van de kwaliteit van de
      uitoefening van de taken van het samenwerkingsverband en de kwaliteit van het bestuur van het samenwerkingsverband.


