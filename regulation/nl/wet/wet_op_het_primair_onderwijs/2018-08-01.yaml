  - number: '134'
    text: |-
      1 Behoudens het tweede lid verstrekt het Rijk jaarlijks aan het bevoegd gezag bekostiging ten behoeve van de
      materiële instandhouding waarop de programma's van eisen, bedoeld in [artikel 114][ref1], betrekking hebben,
      waarbij voor het bevoegd gezag geldt dat indien toepassing is gegeven aan [artikel 119, tweede lid][ref2], dan wel
      indien geen overeenkomst als bedoeld in artikel 119, derde of vierde lid tot stand is gekomen, dit bevoegd gezag
      de bekostiging aan de gemeente dan wel aan het desbetreffende bevoegd gezag overdraagt voor zover deze de materiële
      instandhouding verzorgt.

      2 Het Rijk verstrekt jaarlijks aan de provincie Fryslân bekostiging ten behoeve van de materiële instandhouding,
      voor zover het betreft het onderwijs in de Friese taal, bedoeld in [artikel 9, vierde lid][ref3]. De provincie
      Fryslân draagt zorg voor verdeling van de bekostiging over de betrokken scholen naar rato van het aantal leerlingen
      dat gebruik maakt van dat onderwijs.

      3 Grondslag voor de bekostiging van de in het eerste en tweede lid bedoelde kosten zijn de voor het desbetreffende
      jaar vastgestelde bedragen.

      4 Grondslag voor de bekostiging ten behoeve van de uitgaven voor de voorzieningen, bedoeld in [artikel 113][ref4],
      voor basisscholen zijn:

      a. de schoolgrootte die normatief wordt bepaald op basis van het op grond van de algemene maatregel van bestuur,
      bedoeld in [artikel 69][ref5], normatief bepaalde aantal te huisvesten groepen leerlingen naar de maatstaf van het
      aantal leerlingen op 1 oktober van het jaar voorafgaande aan het jaar waarover de bekostiging plaatsvindt, waarbij
      rekening wordt gehouden met de samenstelling van het leerlingenbestand in de gevallen en op de wijze als aangegeven
      in bedoelde algemene maatregel van bestuur, en

      b. het aantal leerlingen op 1 oktober van het jaar voorafgaande aan het jaar waarover de bekostiging plaatsvindt,
      verhoogd met 3% daarvan, waarbij de uitkomst naar beneden wordt afgerond op een geheel getal.

      5 Voor nieuwe basisscholen zijn gedurende de periode van 1 augustus tot 1 januari volgend op de opening, grondslag
      voor de bekostiging ten behoeve van de uitgaven voor de voorzieningen, bedoeld in [artikel 113][ref6]:

      a. de schoolgrootte die normatief wordt bepaald op basis van het op grond van de algemene maatregel van bestuur,
      bedoeld in [artikel 69][ref7], normatief bepaalde aantal te huisvesten groepen leerlingen naar de maatstaf van
      het aantal leerlingen op 1 oktober in die periode, waarbij rekening wordt gehouden met de samenstelling van het
      leerlingenbestand in de gevallen en op de wijze als aangegeven in bedoelde algemene maatregel van bestuur, en

      b. het aantal leerlingen op 1 oktober in die periode, verhoogd met 3% daarvan, waarbij de uitkomst naar beneden
      wordt afgerond op een geheel getal.

      6 In afwijking van het vierde lid wordt het aantal leerlingen van het overblijvende deel van de school, bedoeld
      in [artikel 84a, tweede lid, onderdeel b][ref8], waarop de bekostiging, bedoeld in het vierde lid, gebaseerd is,
      gedurende de in het vijfde lid bedoelde periode verminderd met het aantal leerlingen dat op grond van dat lid
      meetelt voor de bekostiging van een nieuwe school die op grond van artikel 84a, eerste lid, voor bekostiging in
      aanmerking is gebracht.

      7 Indien van het aantal leerlingen als bedoeld in [artikel 121, tweede lid][ref9] van een nieuwe school die op
      grond van een plan van scholen als bedoeld in [artikel 74][ref10] voor bekostiging in aanmerking is gebracht, een
      substantieel aantal leerlingen afkomstig is van andere scholen van hetzelfde bevoegd gezag, worden die leerlingen
      gedurende de in het vijfde lid bedoelde periode niet meegeteld voor de bekostiging van die andere scholen als
      bedoeld in dit artikel. Bij een algemene maatregel van bestuur wordt de omvang van dat aantal leerlingen bepaald
      die voor categorieën van scholen kan verschillen.

      8 Indien op 1 maart van het jaar waarover de bekostiging plaatsvindt, het aantal leerlingen met ten minste een bij
      de algemene maatregel van bestuur, bedoeld in [artikel 69][ref11], vastgesteld aantal is toegenomen ten opzichte
      van het aantal leerlingen, zoals dat luidt na de verhoging overeenkomstig het vierde lid onder b, en toepassing van
      de in dit lid bedoelde grondslag niet tot een lagere bekostiging zou leiden, zijn grondslag voor de bekostiging ten
      behoeve van de uitgaven voor de voorzieningen, bedoeld in [artikel 113][ref12], voor basisscholen:

      a. de schoolgrootte die normatief wordt bepaald op basis van het op grond van de algemene maatregel van bestuur,
      bedoeld in [artikel 69][ref13], normatief bepaalde aantal te huisvesten groepen leerlingen naar de maatstaf van
      het aantal leerlingen op 1 maart van het jaar waarover de bekostiging plaatsvindt, waarbij rekening wordt gehouden
      met de samenstelling van het leerlingenbestand in de gevallen en op de wijze als aangegeven in bedoelde algemene
      maatregel van bestuur, en

      b. het aantal leerlingen op 1 maart van het jaar waarover de bekostiging plaatsvindt.

      9 Ingeval een samenvoeging plaatsvindt tussen 1 januari en 1 oktober daaropvolgend, wordt de bekostiging ten
      behoeve van de uitgaven voor de voorzieningen, bedoeld in [artikel 113][ref14], van alle bij de samenvoeging
      betrokken scholen gehandhaafd tot het einde van het jaar waarin de samenvoeging plaatsvond.

      10 Ingeval een samenvoeging plaatsvindt tussen 1 oktober en 1 januari daaropvolgend, wordt de bekostiging ten
      behoeve van de uitgaven voor de voorzieningen, bedoeld in [artikel 113][ref15], van alle bij de samenvoeging
      betrokken scholen gehandhaafd tot het einde van het jaar waarin de samenvoeging plaatsvond, en wordt de bekostiging
      van de uitgaven voor die voorzieningen voor het jaar volgend op de samenvoeging, gebaseerd op de bekostiging van de
      uitgaven voor die voorzieningen van alle bij de samenvoeging betrokken scholen, zoals die golden op 1 oktober van
      het jaar van samenvoeging.

      11 Het Rijk verstrekt jaarlijks aan het samenwerkingsverband bekostiging ten behoeve van de materiële
      instandhouding.


