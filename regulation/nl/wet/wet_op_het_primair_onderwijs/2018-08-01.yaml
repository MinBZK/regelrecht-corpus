  - number: '117'
    text: |-
      1 Burgemeester en wethouders stellen na overleg met de bevoegde gezagsorganen van de niet door de gemeente in stand
      gehouden scholen het aantal klokuren per week vast dat per groep leerlingen ten hoogste

      a. ter beschikking wordt gesteld in een ruimte voor het onderwijs in lichamelijke oefening, of

      b. voor bekostiging voor de materiële instandhouding van een ruimte voor het onderwijs in lichamelijke oefening in
      aanmerking komt.

      2 Het aantal klokuren, bedoeld in het eerste lid, wordt vastgesteld op ten minste 1,5 voor basisscholen en ten
      minste 2,25 voor speciale scholen voor basisonderwijs.

      3 Burgemeester en wethouders stellen de hoogte vast van

      a. de bekostiging, bedoeld in het eerste lid, onder b, en

      b. de bekostiging voor de vaste kosten van de materiële instandhouding van een ruimte voor lichamelijke oefening
      waarvan de eigendom berust bij het bevoegd gezag van een niet door de gemeente in stand gehouden school.

      4 Bij de vaststelling, bedoeld in het derde lid, kan onderscheid worden gemaakt naar gelang de oppervlakte van de
      ruimte, alsmede tussen ruimten voor de exploitatie waarvan op grond van de onderwijswetgeving bekostiging wordt
      verleend en ruimten waarvoor dat niet het geval is.
    url: https://wetten.overheid.nl/BWBR0003420/2018-08-01#Artikel117
  - number: '118'
    text: |-
      1 Aan het samenwerkingsverband wordt bekostiging toegekend voor materiële instandhouding die samenhangt met de
      inrichting van de ondersteuningsstructuur.

      2 De in het eerste lid bedoelde bekostiging is afhankelijk van het aantal leerlingen op de vestigingen van de
      basisscholen in het samenwerkingsverband op 1 oktober van het jaar voorafgaand aan het jaar waarover de bekostiging
      plaatsvindt.

      3 De bekostiging, bedoeld in het eerste lid, wordt jaarlijks vastgesteld bij ministeriële regeling. Deze
      ministeriële regeling wordt tezamen met de ministeriële regelingen, bedoeld in [artikel 113, zevende lid][ref1],
      binnen 4 weken na de vaststelling bekendgemaakt in de Staatscourant, onder gelijktijdige overlegging aan de Tweede
      Kamer der Staten-Generaal. Artikel 113, zevende lid, tweede volzin, is van overeenkomstige toepassing.

      4 Indien op 1 oktober het aantal leerlingen van de gezamenlijke speciale scholen voor basisonderwijs in
      een samenwerkingsverband meer bedraagt dan 2% van het aantal leerlingen op de vestigingen van de scholen in
      het samenwerkingsverband, draagt het samenwerkingsverband voor elke leerling van een speciale school voor
      basisonderwijs boven voornoemde 2% het in [artikel 115][ref2] bedoelde bedrag over aan de speciale school voor
      basisonderwijs.

      5 In het ondersteuningsplan wordt vastgelegd welk deel van de bekostiging voor de materiële instandhouding
      die samenhangt met de inrichting van de ondersteuningsstructuur voor zover na toepassing van het vierde lid en
      [artikel 118a][ref3] die bekostiging nog resteert, op welke basisschool in het samenwerkingsverband wordt ingezet.

      6 Bij de berekening op grond van het vierde lid wordt 2% van het aantal leerlingen op de vestigingen van de scholen
      in het samenwerkingsverband rekenkundig afgerond op een geheel getal.

      7 De overdracht op grond van het vierde lid door het samenwerkingsverband heeft betrekking op het kalenderjaar dat
      volgt op de in het vierde lid bedoelde teldatum en vindt ten hoogste plaats voor de aan het samenwerkingsverband
      op grond van het eerste lid toegekende bekostiging van de materiële instandhouding die samenhangt met de
      ondersteuningsstructuur.

      8 Aan het samenwerkingsverband wordt bekostiging voor materiële instandhouding toegekend in aanvulling op de in het
      eerste lid bedoelde bekostiging.

      9 De in het achtste lid bedoelde bekostiging bestaat uit een bij ministeriële regeling vast te stellen bedrag per
      leerling voor het aantal leerlingen op de vestigingen van de scholen in het samenwerkingsverband op 1 oktober van
      het jaar voorafgaand aan het jaar waarover de bekostiging plaatsvindt.

      10 Voor elke leerling die op 1 oktober van het jaar voorafgaand aan het jaar waarover de bekostiging plaatsvindt,
      was ingeschreven op een school voor speciaal onderwijs of speciaal en voortgezet speciaal onderwijs behorend tot
      cluster 3 en 4, bedoeld in de [Wet op de expertisecentra][ref4], voor zover het betreft het daaraan verzorgde
      speciaal onderwijs wordt een bedrag in mindering gebracht op de in het achtste lid bedoelde bekostiging van het
      samenwerkingsverband dat de leerling op grond van [artikel 40, tiende lid, van de Wet op de expertisecentra][ref5]
      toelaatbaar heeft verklaard tot het speciaal onderwijs. Het in de eerste volzin bedoelde bedrag is afhankelijk van
      de in de toelaatbaarheidsverklaring opgenomen ondersteuningsbehoefte van de leerling en komt overeen met één van de
      normbedragen die bij ministeriële regeling worden vastgesteld.

      11 Het tiende lid is van overeenkomstige toepassing op leerlingen opgenomen in residentiële instellingen aan wie op
      1 oktober van het jaar voorafgaand aan het jaar waarover de bekostiging plaatsvindt onderwijs werd gegeven op basis
      van een samenwerkingsovereenkomst als bedoeld in [artikel 71c, tweede lid, van de Wet op de expertisecentra][ref6],
      met dien verstande dat het normbedrag, bedoeld in [artikel 117, zevende lid, van die wet][ref7] in mindering wordt
      gebracht op de bekostiging van:

      a. het samenwerkingsverband:

      1°. dat verantwoordelijk is voor de bekostiging tijdens de inschrijving op een school voor speciaal
      onderwijs of speciaal en voortgezet speciaal onderwijs behorend tot cluster 3 en 4, bedoeld in de
      [Wet op de expertisecentra][ref8], indien de leerling onmiddellijk voorafgaand aan de opname in de residentiële
      instelling was ingeschreven op een school voor speciaal onderwijs of speciaal en voortgezet speciaal onderwijs, of

      2°. waartoe de vestiging van de school behoort waar de leerling was ingeschreven en bekostigd onmiddellijk
      voorafgaand aan de opname in de residentiële instelling, of

      b. het samenwerkingsverband in het gebied waarvan de leerling woonachtig is, indien de leerling onmiddellijk
      voorafgaand aan de opname in de residentiële instelling niet was ingeschreven op een school of school voor
      speciaal onderwijs of speciaal en voortgezet speciaal onderwijs behorend tot cluster 3 en 4, bedoeld in de
      [Wet op de expertisecentra][ref9].

      12 [Artikel 116][ref10] is van overeenkomstige toepassing op het samenwerkingsverband.


