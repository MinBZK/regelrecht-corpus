  - number: '152'
    text: |-
      Waar in deze paragraaf sprake is van een aantal leerlingen, is dat het aantal leerlingen op 1 oktober van het
      schooljaar, verhoogd met 3% daarvan, waarbij de uitkomst naar beneden wordt afgerond op een geheel getal.
    url: https://wetten.overheid.nl/BWBR0003420/2018-08-01#Artikel152
  - number: '153'
    text: |-
      1 De bekostiging van een bijzondere school wordt beëindigd en een openbare school wordt opgeheven indien
      het aantal leerlingen, voor zover het niet betreft het aantal leerlingen van een nevenvestiging, gedurende 3
      achtereenvolgende schooljaren telkens minder heeft bedragen dan de opheffingsnorm die, berekend overeenkomstig de
      [artikelen 154][ref1] en [155][ref2], geldt voor de gemeente of voor het deel van de gemeente waarin de school,
      daaronder niet begrepen een nevenvestiging, is gelegen. De eerste volzin is niet van toepassing zolang gedurende
      de eerste 5 schooljaren van de bekostiging van een school het aantal leerlingen van de school, voor zover het niet
      betreft het aantal leerlingen van een nevenvestiging, niet heeft voldaan aan de stichtingsnorm die werd vastgesteld
      met toepassing van [artikel 77, tweede lid][ref3], en op grond waarvan de school voor bekostiging in aanmerking
      werd genomen. De tweede volzin is niet van toepassing op scholen als bedoeld in [artikel 84][ref4].

      2 De opheffingsnormen, berekend op grond van [artikel 154][ref5], zijn voor de eerste maal opgenomen in de bij
      deze wet behorende bijlage. Deze normen zijn tot en met 31 juli 1998 van kracht. Deze normen worden met ingang van
      1 augustus 1998 telkens voor een tijdvak van 5 jaar bij ministeriële regeling aangepast op basis van de gegevens
      van het Centraal Bureau voor de Statistiek betreffende 1 januari van het tweede jaar voorafgaand aan het laatste
      jaar waarin de opheffingsnormen van kracht zijn. De ministeriële regeling, bedoeld in de derde volzin, wordt,
      tezamen met bij die regeling op grond van [artikel 155][ref6] vastgestelde normen voor delen van gemeenten, voor 1
      november van het jaar voorafgaand aan het laatste jaar waarin de opheffingsnormen van kracht zijn, bekendgemaakt in
      de Staatscourant.

      3 De beëindiging van de bekostiging van een bijzondere school of de opheffing van een openbare school geschiedt met
      ingang van 1 augustus volgend op de 3 achtereenvolgende schooljaren, bedoeld in het eerste lid. De beëindiging van
      de bekostiging van een bijzondere school of de opheffing van een openbare school ten aanzien waarvan gedurende de
      eerste 5 schooljaren van de bekostiging van de school het eerste lid, tweede volzin, toepassing diende te vinden,
      geschiedt met ingang van 1 augustus volgend op die 5 schooljaren.

      4 Indien het aantal leerlingen van een bijzondere school of een openbare school, voor zover het niet betreft het
      aantal leerlingen van een nevenvestiging, in het derde schooljaar van de 3 achtereenvolgende schooljaren, bedoeld
      in het eerste lid, gelijk is aan of meer bedraagt dan 50 en de school, daaronder niet begrepen een nevenvestiging,
      binnen een straal van 5 km de laatste school van de richting is onderscheidenlijk de laatste openbare school is,
      wordt de bekostiging van de bijzondere school niet beëindigd of de openbare school niet opgeheven op grond van dit
      artikel, mits het bevoegd gezag tijdig de in [artikel 160, tweede lid][ref7], bedoelde mededeling heeft gedaan.

      5 Indien binnen 10 km van een school waarbinnen openbaar onderwijs wordt gegeven, over de weg gemeten geen school
      aanwezig is waarbinnen openbaar onderwijs wordt gegeven en aan het volgen van openbaar onderwijs behoefte bestaat,
      wordt de eerstgenoemde school niet opgeheven op grond van dit artikel.

      6 Het vierde lid is niet van toepassing indien de school eerder is omgezet als bedoeld in
      [artikel 84, eerste lid][ref8], tenzij bij die omzetting is voldaan aan artikel 84, vierde lid. Het vierde lid is
      evenmin van toepassing op de richting of richtingen waarmee het onderwijs aan een school is uitgebreid als bedoeld
      in artikel 84, eerste lid, tenzij bij die uitbreiding is voldaan aan artikel 84, vierde lid.


