      1 Bij algemene maatregel van bestuur worden de criteria vastgesteld op grond waarvan een gemeente in aanmerking
      komt voor een specifieke uitkering ter tegemoetkoming in de kosten van de uitvoering van de verplichtingen, bedoeld
      in de [artikelen 165][ref1], [166][ref2] en [167][ref3], alsmede de criteria voor de hoogte daarvan. De uitkering
      wordt per kalenderjaar verstrekt.

      2 Burgemeester en wethouders verstrekken de middelen die de gemeente als specifieke uitkering uit ’s Rijks kas
      ontvangt voor de verplichtingen bedoeld in het eerste lid aan de rechtspersonen die daarvoor in aanmerking komen.

      3 Onze Minister kan de uitkering geheel of gedeeltelijk terugvorderen indien de uitkering niet is besteed in
      overeenstemming met de bepalingen van deze wet. Bij de algemene maatregel van bestuur, bedoeld in het eerste lid,
      worden criteria vastgesteld op basis waarvan de minister tot terugvordering kan overgaan.

      4 Burgemeester en wethouders van een gemeente, die een uitkering ontvangt als bedoeld in het eerste lid, dragen
      er zorg voor dat zij beschikken over geordende gegevens ten behoeve van het door Onze Minister te voeren beleid
      bedoeld in de [artikelen 165][ref4], [166][ref5] en [167][ref6], en verlenen desgevraagd medewerking aan door of
      namens Onze Minister uit te voeren onderzoek dat geheel of mede op deze gegevens is gebaseerd.

      5 Bij of krachtens algemene maatregel van bestuur kunnen nadere voorschriften worden gegeven omtrent de
      definiëring, de wijze van ordening en omtrent de beschikbaarstelling van de gegevens, bedoeld in het vierde lid.


