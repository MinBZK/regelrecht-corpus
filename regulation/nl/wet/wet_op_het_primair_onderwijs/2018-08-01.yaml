  - number: 38o
    text: |-
      1

      2 Op verzoek van het bevoegd gezag van de school waaraan de leraar is benoemd of tewerkgesteld zonder benoeming
      worden in aanvulling op de gegevens, bedoeld in het eerste lid, de volgende gegevens van een leraar verstrekt:

      a. het geslacht, het adres, de postcode en de geboortedatum;

      b. gegevens betreffende de benoeming of tewerkstelling zonder benoeming;

      c. gegevens betreffende de school waaraan hij is benoemd of tewerkgesteld zonder benoeming;

      d. indien het bevoegd gezag daarvoor toestemming heeft van de leraar: gegevens betreffende de activiteiten voor
      herregistratie; en

      e. overige gegevens betreffende de herregistratie.

      3 Bij of krachtens algemene maatregel van bestuur:

      a. wordt de wijze waarop de gegevens van een leraar worden verstrekt vastgesteld;

      b.

      c. kunnen de gegevens, bedoeld in het eerste lid en tweede lid, nader worden gespecificeerd.

      4

      5 De betrokkene heeft toegang tot de gegevens die worden bewaard op grond van [artikel 38n, derde lid][ref1].

      6 Uit het lerarenregister worden aan Onze Minister gegevens verstrekt ten behoeve van:

      a.

      b. de beleidsvorming.

      7 Uit het lerarenregister worden aan de inspectie gegevens verstrekt voor zover de verwerking van die gegevens
      noodzakelijk is voor de goede vervulling van haar publieke taak.

      8 Bij de verstrekking, bedoeld in het zesde en zevende lid, kunnen persoonsgegevens worden verwerkt, indien
      dat noodzakelijk is voor de in het zesde of zevende lid genoemde doelen, onverminderd de verplichting voor de
      verwerkingsverantwoordelijke om passende technische en organisatorische maatregelen te treffen als bedoeld in
      artikel 25 van de Algemene verordening gegevensbescherming.


