      1 Het bevoegd gezag stelt de leerlingen in de gelegenheid op de school, binnen de schooltijden,
      godsdienstonderwijs of levensbeschouwelijk vormingsonderwijs te ontvangen. Van de tijd daaraan te besteden
      worden ten hoogste 120 uren per schooljaar meegeteld voor het aantal uren onderwijs dat de leerlingen krachtens
      [artikel 8, zevende lid, aanhef en onder b][ref1], ten minste moeten ontvangen. Voor de leerlingen die dit
      onderwijs niet volgen, voorziet het bevoegd gezag in andere onderwijsactiviteiten op de school.

      2 Het eerste lid is van overeenkomstige toepassing op samenwerkingsscholen als bedoeld in [artikel 17d][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel17d
