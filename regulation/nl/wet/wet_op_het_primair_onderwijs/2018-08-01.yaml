      1 In deze afdeling wordt verstaan onder:

        - *fusie:* een bestuurlijke of institutionele fusie,
        - *institutionele fusie:* een fusie waarbij een school ontstaat door samenvoeging van twee of meer scholen,
        - *bestuurlijke fusie:* een fusie waarbij een of meer rechtspersonen de instandhouding van een school, een school
      als bedoeld in de [Wet op de expertisecentra][ref1] dan wel de [Wet op het voortgezet onderwijs][ref2] overdragen.

      2 Het eerste lid, onderdeel c, is niet van toepassing op het instellen van een openbare rechtspersoon als bedoeld
      in [artikel 47, eerste lid, eerste volzin][ref3], de instandhouding van een of meer openbare scholen door een
      stichting als bedoeld in [artikel 48, eerste lid][ref4], of de overdracht aan de gemeente van de instandhouding
      van een openbare school of openbare nevenvestiging, bedoeld in [artikel 159, tweede lid][ref5].


