      1 Onze Minister stelt regels van tijdelijke aard vast die de invoering van de Wet van 7 mei 2014 houdende wijziging
      van de Wet op het primair onderwijs, de Wet op de expertisecentra en de Wet primair onderwijs BES in verband met
      de overheveling van taak en budget voor aanpassingen in onderwijshuisvesting van gemeente naar school (Stb. 175)
      vergemakkelijken, door het verstrekken van aanvullende bekostiging aan bevoegde gezagsorganen die in ieder geval
      voldoen aan de volgende eisen:

      a. het bevoegd gezag ontvangt een bij ministeriële regeling te bepalen hoeveelheid bekostiging als bedoeld in
      [artikel 134, eerste lid][ref1], en

      b. het onder het bevoegd gezag ressorterende hoofdgebouw van een school of hoofdgebouw van een nevenvestiging,
      of één of meer van de onder het bevoegd gezag ressorterende hoofdgebouwen van scholen of hoofdgebouwen van
      nevenvestigingen, danwel een bij ministeriële regeling te bepalen percentage van de onder het bevoegd gezag
      ressorterende hoofdgebouwen van scholen of hoofdgebouwen van nevenvestigingen is of zijn gebouwd in een bij
      ministeriële regeling te bepalen tijdvak.

      2 De hoogte van het bedrag van de aanvullende bekostiging wordt per leerling van één van de scholen of
      nevenvestigingen, bedoeld in het eerste lid, onderdeel b, vastgesteld.

      3 Dit artikel vervalt met ingang van 1 januari van het vierde jaar na de datum van inwerkingtreding van artikel
