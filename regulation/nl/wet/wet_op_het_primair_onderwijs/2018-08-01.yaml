  - number: '70'
    text: |-
      Onze minister kan onder nader te stellen voorwaarden aanvullende middelen ter beschikking stellen die niet strekken
      tot bekostiging van het onderwijs, bedoeld in deze wet, en de schoolbegeleiding ten behoeve daarvan, maar die
      direct of indirect dienstig zijn voor de uitvoering van het onderwijs of voor verhoging van de mogelijkheid tot
      deelname aan het onderwijs. Bij de toepassing van dit artikel zijn de [artikelen 4][ref1], [5][ref2], [9][ref3]
      en [10 van de Wet overige OCW-subsidies][ref4] van toepassing.


