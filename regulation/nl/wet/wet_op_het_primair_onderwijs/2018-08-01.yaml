  - number: '59'
    text: |-
      1 De akte van benoeming bevat tenminste bepalingen van gelijke inhoud als zijn vastgesteld bij de algemene
      maatregel van bestuur bedoeld in [artikel 33, tweede lid onder a en b][ref1], voor zover deze geen rechtstreekse
      aanspraak op het Rijk geven.

      2 Ieder personeelslid is in het bezit van een door het bevoegd gezag en hemzelf getekende akte van benoeming. De
      akte van benoeming bevat in elk geval:

      a. de naam en het adres van het bevoegd gezag;

      b. de naam, de voornamen en de geboortedatum van de betrokkene;

      c. de datum van ingang van de benoeming;

      d. de functie waarin de betrokkene wordt benoemd;

      e. de omvang van de betrekking;

      f. de bepaling of de benoeming in vaste of tijdelijke dienst geschiedt en in het laatste geval de gronden voor de
      tijdelijkheid en de duur van de benoeming;

      g. de op de dag van zijn benoeming van toepassing zijnde schaal en het salarisnummer;

      h. de bepaling dat de betrokkene werkzaam zal zijn in algemene dienst van het bevoegd gezag; en

      i. voor personeelsleden die bij de uitoefening van hun functie kennis nemen van persoonlijke gegevens van
      leerlingen, voorschriften omtrent geheimhouding daarvan, voor zover een geheimhoudingsplicht niet uit anderen
      hoofde is verzekerd.

      3 De akte van benoeming bevat bepalingen inzake gronden voor schorsing, ontslag en disciplinaire maatregelen.

      4 Het bevoegd gezag draagt zorg dat afschriften van de bewijsstukken waarmee de bekwaamheid wordt aangetoond, de
      geschiktheidsverklaringen, van de verklaringen omtrent het gedrag, alsmede van de akten van benoeming van het aan
      de school verbonden personeel worden bewaard.

      5 Het tweede lid, aanhef en onder i, en het vierde lid, zijn van overeenkomstige toepassing op personeel dat is
      tewerkgesteld zonder benoeming.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel33
