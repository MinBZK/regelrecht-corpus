  - number: '158'
    text: |-
      1 De bekostiging van een bijzondere nevenvestiging wordt beëindigd of een openbare nevenvestiging wordt opgeheven
      indien de nevenvestiging gedurende 3 achtereenvolgende schooljaren op de teldatum 1 oktober niet heeft voldaan of
      geacht wordt niet te hebben voldaan aan een van de volgende voorwaarden:

      a. het aantal leerlingen van de nevenvestiging bedraagt ten minste 23 en binnen een straal van 2 km bevindt zich
      geen school,

      b. het aantal leerlingen van de nevenvestiging bedraagt ten minste 50 en binnen een straal van 3 km bevindt zich
      geen school waar onderwijs wordt gegeven van dezelfde richting of richtingen onderscheidenlijk waar openbaar
      onderwijs wordt gegeven,

      c. het aantal leerlingen van de nevenvestiging bedraagt ten minste 23 en binnen een straal van 5 km bevindt zich
      geen school waar onderwijs wordt gegeven van dezelfde richting of richtingen onderscheidenlijk waar openbaar
      onderwijs wordt gegeven,

      d. binnen 10 km van de openbare nevenvestiging over de weg gemeten, is geen andere school aanwezig waarbinnen
      openbaar onderwijs wordt gegeven, of

      e. bij het gelijkstellen van de nevenvestiging met een zelfstandige school zou deze met toepassing van
      [artikel 157][ref1] en onder vervanging van het getal 290 in dat artikel door 260, voor bekostiging in aanmerking
      komen.

      2 De beëindiging van de bekostiging van een bijzondere nevenvestiging of de opheffing van een openbare
      nevenvestiging geschiedt met ingang van 1 augustus volgend op de 3 achtereenvolgende schooljaren, bedoeld in het
      eerste lid.

      3 Indien het bevoegd gezag van oordeel is dat op de teldatum 1 oktober wordt voldaan aan een van de voorwaarden
      genoemd in het eerste lid en het de nevenvestiging in het op die datum volgende schooljaar wil handhaven, deelt
      het dit voor 1 februari voorafgaand aan dat schooljaar onder de gemotiveerde vermelding van de voorwaarde die
      het betreft schriftelijk mede aan Onze minister. Indien deze mededeling niet tijdig wordt gedaan, wordt de
      nevenvestiging geacht gedurende het desbetreffende schooljaar niet aan een van de voorwaarden genoemd in het eerste
      lid te voldoen, tenzij het eerste lid, onder d, van toepassing is.

      4 Onze minister maakt voor 1 mei, volgend op de mededeling, bedoeld in het derde lid, aan het bevoegd gezag van de
      desbetreffende school bekend dat

      a. de nevenvestiging naar zijn oordeel gedurende 3 achtereenvolgende schooljaren op de teldatum 1 oktober niet
      heeft voldaan of geacht wordt niet te hebben voldaan aan een van de voorwaarden genoemd in het eerste lid zodat
      de bekostiging van de bijzondere nevenvestiging wordt beëindigd of de openbare nevenvestiging dient te worden
      opgeheven,

      b. de nevenvestiging naar zijn oordeel niet voldoet aan een van de voorwaarden genoemd in het eerste lid
      maar, gelet op het eerste lid, de bekostiging van de bijzondere nevenvestiging wordt voortgezet of de openbare
      nevenvestiging in stand kan worden gehouden, of

      c. de nevenvestiging naar zijn oordeel voldoet aan een van de voorwaarden genoemd in het eerste lid, zodat de
      bekostiging van de bijzondere nevenvestiging wordt voortgezet of de openbare nevenvestiging in stand kan, dan wel
      dient te worden gehouden.


