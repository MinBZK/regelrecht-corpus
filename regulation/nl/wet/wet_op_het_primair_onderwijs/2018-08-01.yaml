  - number: '96'
    text: |-
      Burgemeester en wethouders stellen gelijktijdig met het programma, bedoeld in [artikel 95][ref1], ten behoeve van
      het onderwijs op het grondgebied van de gemeente voor een door hen te bepalen tijdstip een overzicht vast van die
      voorzieningen die zijn aangevraagd dan wel nodig zijn, die niet op het programma zijn opgenomen. Daarbij wordt
      aangegeven waarom de desbetreffende voorzieningen niet zijn opgenomen. Het overzicht wordt ter inzage gelegd. Het
      overzicht heeft betrekking op scholen als bedoeld in [artikel 93, eerste lid, onderdelen a, b en c][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel95
