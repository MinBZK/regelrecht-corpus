  - number: '123'
    text: |-
      1 Indien bijzondere ontwikkelingen in het basisonderwijs daartoe aanleiding geven, kunnen bij ministeriële regeling
      voorschriften worden vastgesteld omtrent het verstrekken van bijzondere bekostiging voor personeelskosten.

      2 In verband met bijzondere omstandigheden kan Onze minister op aanvraag van het bevoegd gezag van een basisschool
      onder door hem op te leggen verplichtingen bijzondere bekostiging voor personeelskosten verstrekken.

      3 Een aanvraag als bedoeld in het tweede lid wordt ingediend ten hoogste vier maanden voorafgaand aan het
      schooljaar waarin de bijzondere omstandigheden zich zullen voordoen en niet later dan in het schooljaar waarin die
      bijzondere omstandigheden zich hebben voorgedaan. Onze minister besluit binnen vier maanden na ontvangst van een in
      het tweede lid bedoelde aanvraag.

      4 Onze minister kan in verband met de in het eerste en tweede lid bedoelde bekostiging een bekostigingsplafond
      instellen. In dat geval worden bij ministeriële regeling regels omtrent de verdeling vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003420/2018-08-01#Artikel123
  - number: '124'
    text: |-
      1 Indien op 1 februari het aantal leerlingen van de speciale scholen voor basisonderwijs in een
      samenwerkingsverband meer bedraagt dan het aantal leerlingen van die scholen op 1 oktober daaraan voorafgaand,
      draagt het samenwerkingsverband voor het verschil per leerling een bij ministeriële regeling vast te stellen
      bedrag over aan de speciale scholen voor basisonderwijs, welk bedrag wordt verhoogd met een bedrag dat wordt
      vermenigvuldigd met de geraamde landelijk gewogen gemiddelde leeftijd van leraren van speciale scholen voor
      basisonderwijs.

      2 Indien op 1 februari het aantal leerlingen van de speciale scholen voor basisonderwijs in een
      samenwerkingsverband meer bedraagt dan 2% van het aantal leerlingen op de vestigingen van de scholen in het
      samenwerkingsverband op 1 oktober daaraan voorafgaand, draagt het samenwerkingsverband voor elke leerling van een
      speciale school voor basisonderwijs boven voornoemde 2% per leerling een bij ministeriële regeling vast te stellen
      bedrag over aan de speciale scholen voor basisonderwijs, welk bedrag wordt verhoogd met een bedrag dat afhankelijk
      is van de geraamde landelijk gewogen gemiddelde leeftijd van leraren van speciale scholen voor basisonderwijs.

      3 Bij de vaststelling ingevolge het eerste en tweede lid van het aantal leerlingen van de speciale scholen voor
      basisonderwijs in een samenwerkingsverband op de overeenkomstig [artikel 18a, achtste lid, onderdeel g][ref1],
      vastgestelde peildatum, worden leerlingen voor wie op grond van [artikel 125][ref2] al een overdracht plaatsvindt
      vanuit een ander samenwerkingsverband buiten beschouwing gelaten. De uitkomst van de berekening van 2% van het
      aantal leerlingen van het samenwerkingsverband op grond van het tweede lid wordt rekenkundig afgerond op een geheel
      getal.

      4

      5 De overdracht op grond van het eerste en tweede lid heeft betrekking op het schooljaar dat volgt op de in het
      eerste onderscheidenlijk tweede lid bedoelde peildatum.

      6

      7 Indien de in [artikel 132, eerste lid][ref3], bedoelde bekostiging niet voldoende is om daaruit de
      verplichtingen, bedoeld in dit artikel na te komen, dragen de bevoegde gezagsorganen van de gezamenlijke
      basisscholen in het samenwerkingsverband de ontbrekende bekostiging over aan het samenwerkingsverband. Het
      aandeel van de onderscheiden basisscholen in de overdrachtsverplichting, bedoeld in de eerste volzin, wordt
      bepaald overeenkomstig de regeling die daarvoor op grond van [artikel 18a, achtste lid, onderdeel h][ref4], in het
      ondersteuningsplan van het samenwerkingsverband is opgenomen.

      8 Het bedrag per leerling, bedoeld in het eerste en het tweede lid, en het vermenigvuldigingsbedrag van de
      verhoging, bedoeld in het eerste en het tweede lid, zijn de uitkomst van een bij algemene maatregel van bestuur
      vast te stellen hoeveelheid formatie per leerling, vermenigvuldigd met een bedrag. Bij de vaststelling van de
      bedragen wordt in ieder geval rekening gehouden met de ontwikkeling van de geraamde landelijk gewogen gemiddelde
      leeftijd en de genormeerde gemiddelde personeelslast van leraren van speciale scholen voor basisonderwijs.

      9 In afwijking van het eerste en het tweede lid kan het samenwerkingsverband besluiten dat in plaats van met
      de landelijk gewogen leeftijd, wordt vermenigvuldigd met de gewogen gemiddelde leeftijd van de leraren van de
      desbetreffende speciale school voor basisonderwijs.


