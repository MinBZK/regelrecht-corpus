    text: |-
      1 Ten behoeve van het schoolbezoek verstrekken burgemeester en wethouders aan ouders van in de gemeente
      verblijvende leerlingen op aanvraag vergoeding van de door burgemeester en wethouders noodzakelijk te achten
      vervoerskosten. De gemeenteraad stelt daartoe een nadere regeling vast, met inachtneming van het bepaalde in de
      volgende leden.

      2 De regeling maakt geen onderscheid tussen openbaar en bijzonder onderwijs.

      3 De regeling eerbiedigt de op godsdienst of levensbeschouwing van de ouders berustende keuze van een school.

      4 De regeling houdt rekening met de van ouders redelijkerwijs te vergen inzet en voorziet erin dat het vervoer
      kan plaatsvinden op een wijze die voor de leerling passend is. De regeling bepaalt op welke wijze burgemeester en
      wethouders terzake advies van deskundigen inwinnen.

      5 De regeling bepaalt dat de kosten worden vergoed van vervoer over de afstand tussen de woning van de leerling en

      a. de dichtstbijzijnde voor de leerling toegankelijke basisschool of, indien een leerling op het onderwijs van
      een speciale school voor basisonderwijs is aangewezen, de dichtstbijzijnde voor de leerling toegankelijke speciale
      school voor basisonderwijs,

      b. een andere basisschool of speciale school voor basisonderwijs, indien het vervoer naar die school voor de
      gemeente minder kosten met zich mee zou brengen dan het vervoer naar de basisschool onderscheidenlijk speciale
      school voor basisonderwijs, bedoeld onder a, en de ouders met het vervoer naar die andere school instemmen,

      c. de dichtstbijzijnde voor de leerling toegankelijke speciale school voor basisonderwijs in het
      samenwerkingsverband van de basisschool waarvan de leerling afkomstig is, indien de ouders met het vervoer naar die
      speciale school voor basisonderwijs instemmen, of

      d. een andere speciale school voor basisonderwijs in het onder c bedoelde samenwerkingsverband, indien het vervoer
      naar die school voor de gemeente minder kosten met zich zou brengen dan het vervoer naar de speciale school voor
      basisonderwijs, bedoeld onder c, en de ouders met het vervoer naar die andere school instemmen.

      6 Bij de toepassing van het vijfde lid worden de afstanden gemeten langs de kortste voor de leerling voldoende
      begaanbare en veilige weg en wordt de keuze van de ouders, bedoeld in het derde lid, in acht genomen.

      7 De regeling kan ten aanzien van ouders wier inkomen tezamen meer bedraagt dan € 17 700 bepalen dat slechts
      vergoeding wordt verstrekt voor zover de kosten van vervoer de kosten van het openbaar vervoer over de door de
      gemeenteraad op grond van het achtste lid vastgestelde afstand te boven gaan, welke afstand ten hoogste 6 kilometer
      bedraagt. Bij de berekening van het inkomen wordt uitgegaan van het inkomen in het tweede kalenderjaar voorafgaand
      aan het kalenderjaar waarin het schooljaar waarvoor vergoeding wordt gevraagd, begint. De kosten van het openbaar
      vervoer, bedoeld in de eerste volzin, betreffen de kosten van openbaar vervoer die op grond van de zone-indeling in
      de regeling die is gebaseerd op artikel 27, eerste lid, van de Wet personenvervoer, voor de afstand redelijkerwijs
      zouden worden gemaakt, ongeacht de aanwezigheid van openbaar vervoer of het daadwerkelijk gebruik ervan. Ingeval
      toepassing wordt gegeven aan het tiende lid voorziet de regeling in een overeenkomstig de derde volzin berekende
      financiële bijdrage van de ouders. Het bedrag, bedoeld in de eerste volzin, wordt met ingang van 1 januari 1999
      jaarlijks aangepast aan de wijziging die het indexcijfer van de regelingslonen van volwassen werknemers heeft
      ondergaan ten opzichte van het voorafgaande jaar, en afgerond op een veelvoud van € 450. Het aangepaste bedrag
      treedt in de plaats van het in de eerste volzin bedoelde bedrag.

      8 De regeling kan bepalen dat geen aanspraak op vergoeding bestaat op grond van de afstand tussen de voor de
      leerling toegankelijke school en de woning van de leerling, gemeten langs de kortste, voor de leerling voldoende
      begaanbare en veilige weg.

      9 De regeling kan bepalen dat voor een leerling die ouder is dan een bepaalde leeftijd, de aanspraak op vergoeding
      wordt beperkt tot de kosten van openbaar vervoer, dan wel, indien zulks in redelijkheid kan worden verlangd, een
      goedkopere wijze van vervoer. In dat geval dient de regeling erin te voorzien, dat uitvoering wordt gegeven aan
      het bepaalde in het vierde lid voor die leerlingen voor wie openbaar vervoer ontbreekt en de in de vorige volzin
      bedoelde goedkopere wijze van vervoer in redelijkheid niet kan worden verlangd.

      10 De regeling kan bepalen dat de gemeente, in plaats van vergoeding in geld te geven, het vervoer verzorgt of
      doet verzorgen.

      11 De regeling kan voor leerlingen voor wie de afstand bedoeld in het vijfde lid, meer bedraagt dan 20 kilometer,
      bepalen dat de hoogte van de vergoeding afhankelijk is van de financiële draagkracht van de ouders, of dat het
      vervoer dat de gemeente verzorgt of doet verzorgen geschiedt tegen een van de financiële draagkracht van de ouders
      afhankelijke bijdrage tot ten hoogste het bedrag van de kosten van het vervoer van de desbetreffende leerling. In
      dat geval bevat de regeling tevens voorschriften omtrent de bepaling van de financiële draagkracht van de ouders.
      De eerste volzin is niet van toepassing voor een leerling van een speciale school voor basisonderwijs voor wie
      geldt dat de afstand tot de dichtstbijzijnde openbare of bijzondere speciale school voor basisonderwijs meer dan 20
      kilometer bedraagt.

      12 De regeling kan bepalen dat burgemeester en wethouders in bijzondere gevallen de bevoegdheid hebben ten gunste
      van de ouders van de inhoud van de regeling af te wijken.

      13 Het zevende tot en met negende lid en het elfde lid zijn niet van toepassing op leerlingen die wegens hun
      lichamelijke, verstandelijke, zintuiglijke of psychische handicap op ander vervoer dan openbaar vervoer zijn
      aangewezen, dan wel vanwege een zodanige handicap niet zelfstandig van openbaar vervoer gebruik kunnen maken.
