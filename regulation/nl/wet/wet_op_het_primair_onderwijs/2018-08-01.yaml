  - number: 64c
    text: |-
      1 Onze minister kan goedkeuring onthouden indien als gevolg van de fusie de daadwerkelijke variatie van het
      onderwijsaanbod, zowel in het opzicht van richting en pedagogisch-didactische aanpak binnen het voedingsgebied van
      de te fuseren scholen of rechtspersonen, op significante wijze wordt belemmerd.

      2 Onze minister laat zich ten aanzien van de goedkeuring, bedoeld in het eerste lid, adviseren door een
      onafhankelijke adviescommissie, tenzij de noodzaak daartoe ontbreekt. Bij ministeriële regeling wordt bepaald
      wanneer er geen sprake is van de noodzaak bedoeld in de eerste volzin.

      3 Onze minister stelt beleidsregels vast omtrent de uitoefening van de bevoegdheid, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0003420/2018-08-01#Artikel64c
  - number: 64d
    text: |-
      1 Onze minister besluit binnen 13 weken op een aanvraag als bedoeld in [artikel 64b][ref1].

      2 De termijn, bedoeld in het eerste lid, kan ten hoogste met 13 weken worden verlengd. Van deze verlenging wordt,
      binnen de 13 weken bedoeld in het eerste lid, mededeling gedaan aan de aanvrager.

      3 Op het besluit bedoeld in het eerste lid is [paragraaf 4.1.3.3 van de Algemene wet bestuursrecht][ref2] van
      toepassing.


