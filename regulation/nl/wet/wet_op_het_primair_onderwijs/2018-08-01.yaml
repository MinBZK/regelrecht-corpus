      1 Indien het bevoegd gezag van een school dan wel het samenwerkingsverband in strijd handelt met het bepaalde
      bij of krachtens deze wet, waaronder tevens wordt verstaan het niet opvolgen van een aanwijzing als bedoeld in
      [artikel 163b][ref1], kan Onze minister bepalen dat de bekostiging, voorschotten daaronder begrepen, geheel of
      gedeeltelijk wordt ingehouden dan wel opgeschort.

      2 Het eerste lid is van overeenkomstige toepassing, indien het bevoegd gezag of het personeel van een
      school dan wel het samenwerkingsverband of het personeel van een samenwerkingsverband in strijd handelt met
      [artikel 5:20 van de Algemene wet bestuursrecht][ref2].

      3 Onze minister kent de bekostiging wederom toe, indien blijkt dat de reden voor de toepassing van het eerste of
      tweede lid is vervallen.


