      1 De gegevens, bedoeld in [artikel 38g, eerste lid, onder b][ref1], zijn gekoppeld aan het burgerservicenummer van
      de desbetreffende leraar en worden door Onze Minister verkregen uit de basisregistratie personen indien de leraar
