  - number: '111'
    text: |-
      In afwijking van deze afdeling kan de gemeenteraad besluiten dat jaarlijks een bedrag voor huisvestingskosten
      wordt betaald aan het bevoegd gezag van een niet door de gemeente in stand gehouden school voor zover die op het
      grondgebied van die gemeente in stand wordt gehouden. De gemeenteraad neemt het besluit in overeenstemming met het
      bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0003420/2018-08-01#Artikel111
  - number: '112'
    text: |-
      Het bevoegd gezag van een niet door de desbetreffende gemeente in stand gehouden school is gehouden aan de
      gemeenteraad onderscheidenlijk burgemeester en wethouders alle inlichtingen te verschaffen die de gemeenteraad
      onderscheidenlijk burgemeester en wethouders voor een adequate uitvoering van de bepalingen in deze afdeling
      noodzakelijk achten.
    url: https://wetten.overheid.nl/BWBR0003420/2018-08-01#Artikel112
  - number: '113'
    text: |-
      1 Bij ministeriële regeling worden eenmaal in de vijf jaar voor 1 oktober programma's van eisen vastgesteld die
      de grondslag vormen voor de bekostiging van de voorzieningen, bedoeld in het derde lid. De programma's van eisen
      gelden voor de vijf jaar volgend op het jaar waarin de vaststelling dient plaats te vinden. In de programma's
      van eisen wordt een extra bekostiging opgenomen voor de gezamenlijke speciale scholen voor basisonderwijs in
      een samenwerkingsverband of, indien van een samenwerkingsverband geen speciale school voor basisonderwijs deel
      uitmaakt, voor een samenwerkingsverband.

      Elk programma van eisen omvat:

      a. een omschrijving van de in aanmerking genomen componenten waaruit de voorzieningen zijn opgebouwd,

      b. de daarvoor noodzakelijk geachte bedragen en

      c. de wijze waarop de voor elke voorziening vast te stellen bekostiging wordt berekend.

      2 De programma's van eisen voldoen aan de redelijke behoeften van een in normale omstandigheden verkerende school,
      onverminderd het vierde tot en met negende lid, en houden rekening met de bruto vloeroppervlakten die op grond van
      de algemene maatregel van bestuur, bedoeld in [artikel 92, tweede lid][ref1], worden voorgeschreven.

      3 Programma's van eisen worden vastgesteld voor de materiële voorzieningen ten behoeve van de instandhouding van de
      scholen, daaronder niet begrepen de ruimten voor het onderwijs in lichamelijke oefening.

      4 Bij ministeriële regeling worden jaarlijks voor 1 oktober de overeenkomstig het zesde lid, aangepaste bedragen
      vastgesteld. De aldus vastgestelde bedragen zijn de definitieve bedragen, geldend voor het jaar volgend op het jaar
      waarin de vaststelling dient plaats te vinden.

      5 Onze minister kan bij de vaststelling van de ministeriële regeling, bedoeld in het vierde lid, wijzigingen in de
      programma's van eisen aanbrengen indien de toestand van 's Rijks schatkist of onderwijskundige ontwikkelingen dat
      noodzakelijk maken. Aan de eerste volzin kan slechts toepassing worden gegeven indien de ministeriële regeling,
      bedoeld in het vierde lid, voor de in dat lid bedoelde datum wordt vastgesteld.

      6 De aanpassing, bedoeld in het vierde lid, vindt plaats door de bedragen op basis van de werkelijke
      prijsontwikkeling voor het tweede jaar voorafgaand aan het jaar waarvoor de bedragen worden vastgesteld, aan te
      passen overeenkomstig de prijsmutatie van de netto materiële consumptie, zoals opgenomen in de Macro Economische
      Verkenning, die naar verwachting zal optreden tussen het prijsniveau in het eerstbedoelde jaar en het prijsniveau
      in het daaropvolgende jaar, alsmede aan te passen overeenkomstig de prijsmutatie van de netto materiële consumptie,
      zoals opgenomen in de Macro Economische Verkenning, die naar verwachting zal optreden tussen het prijsniveau in
      het jaar voorafgaand aan het jaar waarvoor de bedragen worden vastgesteld en het jaar waarvoor de bedragen worden
      vastgesteld.

      7 De ministeriële regelingen, bedoeld in het eerste en vierde lid, worden binnen 4 weken na de vaststelling,
      bedoeld in het eerste en vierde lid, gezamenlijk bekendgemaakt in de Staatscourant, onder gelijktijdige overlegging
      aan de Tweede Kamer der Staten-Generaal. De ministeriële regelingen treden niet in werking dan nadat 4 weken zijn
      verstreken na het overleggen aan de Tweede Kamer en gedurende die termijn niet door of namens de Kamer de wens tot
      overleg over de ministeriële regelingen te kennen wordt gegeven, dan wel met de Tweede Kamer overleg is gevoerd.

      8 Naar aanleiding van het overleg met de Tweede Kamer kunnen wijzigingen in de programma's van eisen en de
      wijzigingen daarvan, bedoeld in het vijfde lid, worden aangebracht. De wijzigingen worden bekendgemaakt in de
      Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel92
