    text: |-
      1 Indien een gemeente zelf een of meer openbare basisscholen of openbare speciale scholen voor basisonderwijs in
      stand houdt en zij uitgaven wil doen voor het onderwijs aan die scholen welke niet door het Rijk worden bekostigd,
      kan de gemeenteraad daarvoor bij verordening een regeling vaststellen.

      2 [Artikel 140, tweede tot en met zevende lid][ref1], is van toepassing.


