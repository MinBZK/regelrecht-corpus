  - number: 84a
    text: |-
      1 Onze minister kan onder door hem te stellen voorwaarden een nevenvestiging, of een deel van een school of
      nevenvestiging dat zich op een andere locatie bevindt dan de plaats van vestiging van die school of nevenvestiging,
      als school voor bekostiging in aanmerking brengen.

      2 Een aanvraag om een besluit als bedoeld in het eerste lid is met redenen omkleed en gaat vergezeld van:

      a. voor zover het betreft de nieuwe school, de gegevens, bedoeld in [artikel 75, eerste lid][ref1], juncto artikel
      75, vijfde lid, of de gegevens, bedoeld in [artikel 76, tweede lid][ref2],

      b. een prognose van het te verwachten aantal leerlingen op het overblijvende deel van de school met uitzondering
      van nevenvestigingen, of, indien van toepassing, op het overblijvende deel van de nevenvestiging, en

      c. een opgave van het aantal leerlingen dat op de teldatum voorafgaand aan de aanvraag daadwerkelijk onderwijs
      volgde op het deel van de school waarop de aanvraag betrekking heeft.

      3 Bij de berekening van het aantal leerlingen dat de nieuwe school zal bezoeken, wordt [artikel 78][ref3] niet
      toegepast, voor zover het plaatsruimte betreft op de nieuwe school.

      4 Onze minister willigt de aanvraag slechts in, indien:

      a. aannemelijk is dat de nieuwe school gedurende 15 jaar na aanvang van de bekostiging zal worden bezocht door ten
      minste het aantal leerlingen dat overeenkomt met de stichtingsnorm, bedoeld in [artikel 77, tweede lid][ref4], en

      b. aannemelijk is dat de bekostiging van het overblijvende deel van de school, met inachtneming van de
      [artikelen 154 tot en met 156][ref5], gedurende ten minste 15 achtereenvolgende jaren kan worden voortgezet, of

      c. indien van toepassing aannemelijk is dat de bekostiging van het overblijvende deel van de nevenvestiging, met
      inachtneming van [artikel 158][ref6], gedurende ten minste 15 achtereenvolgende jaren kan worden voortgezet.

      5 Bij ministeriële regeling kunnen modellen worden vastgesteld voor het verstrekken van de prognose, bedoeld in het
      tweede lid, onderdeel b. Daarbij wordt aangegeven op welke wijze de prognose wordt ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel75
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel76
