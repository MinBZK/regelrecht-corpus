  - number: 38s
    text: |-
      1 De leraar blijft voor het onderwijs waarvoor hij in het registervoorportaal is opgenomen vermeld:

      a. totdat hij voldoet aan de bekwaamheidseisen van dat onderwijs; of

      b. maximaal voor de duur van de periode, genoemd in het artikel op grond waarvan deze leraar dit onderwijs geeft.

      2 Het bevoegd gezag stelt een leraar die in het registervoorportaal is opgenomen in staat te voldoen aan de
      vereisten om voor het desbetreffende onderwijs in het lerarenregister te kunnen worden opgenomen.

      3 Vanaf het moment dat een leraar voor het onderwijs waarvoor hij in het registervoorportaal is opgenomen, voldoet
      aan de criteria om in het lerarenregister te worden vermeld, worden de gegevens van deze leraar verstrekt voor
      opname in het lerarenregister.

      4 Indien een leraar die opgenomen is in het registervoorportaal niet langer voldoet aan de vereisten die op grond
      van de in [artikel 38r, eerste lid][ref1], genoemde bepalingen zijn gesteld aan de leraar, worden de gegevens van
      deze leraar verwijderd uit het registervoorportaal en gedurende vijf jaar bewaard.


