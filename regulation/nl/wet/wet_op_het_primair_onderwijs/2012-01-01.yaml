  - number: 10a
    text: |-
      1 Het bevoegd gezag van een basisschool voldoet in elk geval niet aan de wettelijke opdrachten voor het onderwijs,
      bedoeld in [artikel 10][ref1], indien de leerresultaten op de school aan het eind van het zevende of het achtste
      schooljaar op groepsniveau ernstig of langdurig tekortschieten.

      2 Er is sprake van onvoldoende leerresultaten als bedoeld in het eerste lid indien:

      a. op de school de leerresultaten op het gebied van de Nederlandse taal en op het gebied van rekenen en wiskunde,
      gemeten over een periode van 3 schooljaren, liggen onder de minimum normering die daarvoor geldt in vergelijking
      tot die leerresultaten over diezelfde schooljaren van scholen met een vergelijkbaar leerlingenbestand; dan wel

      b. geen leerresultaten door de school kunnen worden aangetoond.

      3 De leerresultaten op de school worden beoordeeld op basis van alle leerlingen die onderwijs volgen in het zevende
      of achtste schooljaar met uitzondering van de leerlingen die aansluitend onderwijs gaan volgen op een school voor
      voortgezet speciaal onderwijs als bedoeld in de [Wet op de expertisecentra][ref2], in het praktijkonderwijs als
      bedoeld in de [Wet op het voortgezet onderwijs][ref3] en leerlingen die aan het begin van het achtste schooljaar 4
      jaar of korter in Nederland zijn.

      4 Er is sprake van ernstig of langdurig tekortschieten van de kwaliteit van het onderwijs als bedoeld in
      het eerste lid indien de inspectie op grond van [artikel 14 van de Wet op het onderwijstoezicht][ref4]
      Onze minister meedeelt dat uit het onderzoek naar de kwaliteitsverbeteringen, bedoeld in
      [artikel 11, derde lid, van de Wet op het onderwijstoezicht][ref5] blijkt dat sprake is van onvoldoende
      verbeteringen dan wel dat het bevoegd gezag niet bereid is afspraken te maken over kwaliteitsverbeteringen naar
      aanleiding van het onderzoek, bedoeld in artikel 11, tweede lid, van de Wet op het onderwijstoezicht.

      5 Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot de wijze waarop
      leerresultaten worden gemeten en, indien zij niet gemeten kunnen worden, op welke andere wijze zij worden
      aangetoond. Voorts wordt de normering, bedoeld in het derde lid, bepaald en wordt bepaald bij welk aantal
      leerlingen in het zevende of achtste schooljaar van een bepaalde school voor die school voor de periode van 3
      schooljaren, bedoeld in het tweede lid, onderdeel a, wordt gelezen 5 schooljaren.

      6 De voordracht voor een krachtens het vijfde lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.


