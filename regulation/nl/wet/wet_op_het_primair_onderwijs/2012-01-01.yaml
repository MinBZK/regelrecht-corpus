  - number: '167'
    text: |-
      1 Burgemeester en wethouders voeren ten minste jaarlijks overleg en dragen zorg voor het maken van afspraken over:

      a. met het oog op een zo groot mogelijke deelname van het aantal kinderen aan voorschoolse educatie:

      1°. het vaststellen welke kinderen met een risico op een achterstand in de Nederlandse taal in aanmerking komen
      voor voorschoolse educatie,

      2°. de wijze waarop die kinderen worden toegeleid naar voorschoolse en vroegschoolse educatie, en

      3°. de organisatie van een doorlopende leerlijn van voorschoolse naar vroegschoolse educatie, en

      b. resultaten van vroegschoolse educatie.

      2 Burgemeester en wethouders voeren overleg en maken de afspraken, bedoeld in het eerste lid, met de volgende
      partijen:

      a. voor het eerste lid, onderdeel a: met de bevoegde gezagsorganen van scholen en de houders van kindercentra of
      peuterspeelzalen als bedoeld in de [Wet kinderopvang en kwaliteitseisen peuterspeelzalen][ref1] in de gemeente,

      b. voor het eerste lid, onderdeel b: met de bevoegde gezagsorganen van scholen.

      Alle partijen werken mee aan de totstandkoming van de afspraken.

      3 Een houder van een kindercentrum of peuterspeelzaal verwerkt persoonsgegevens met als doel de bevordering van
      een goede doorstroom naar het basisonderwijs. De gegevens die een houder van een kindercentrum of peuterspeelzaal
      verplicht overdraagt aan het bevoegd gezag van een basisschool over leerlingen die op de basisschool zijn
      ingeschreven, zijn het programma van voorschoolse educatie dat een leerling heeft gevolgd en de duur van het
      programma dat is gevolgd. Houders van kindercentra of peuterspeelzalen maken afspraken met de basisscholen binnen
      een gemeente over de wijze van gegevenslevering. De bewaartermijn voor de overgedragen gegevens is twee jaar nadat
      het kind het kindercentrum of peuterspeelzaal heeft verlaten.


      [ref1]: https://wetten.overheid.nl/BWBR0017017
    url: https://wetten.overheid.nl/BWBR0003420/2012-01-01#Artikel167
    references:
      - id: ref1
        bwb_id: BWBR0017017
  - number: 167a
    text: |-
      1 Burgemeester en wethouders en de bevoegde gezagsorganen van de scholen en de kinderopvang, bedoeld in de
      [Wet kinderopvang][ref1] in de gemeente voeren tenminste jaarlijks overleg over het voorkomen van segregatie,
      het bevorderen van integratie en het bestrijden van onderwijsachterstanden, de afstemming over inschrijvings-
      en toelatingsprocedures en het uit het overleg voortvloeiende voorstel van het bevoegd gezag van in de gemeente
      gevestigde scholen om tot een evenwichtige verdeling van leerlingen met een onderwijsachterstand over de scholen
      te komen. Het overleg is gericht op het maken van afspraken over de in de eerste volzin bedoelde onderwerpen.
      Deze afspraken hebben zoveel mogelijk het karakter van meetbare doelen. De inspectie rapporteert jaarlijks over
      de mate waarin die doelen worden bereikt. Burgemeester en wethouders kunnen de uitkomsten van het verplichte op
      overeenstemming gerichte overleg omzetten in bindende afspraken over onder andere de te realiseren prestaties en
      inspanningen, die – alvorens de afspraken tot stand komen – aan alle partijen worden voorgelegd. Indien het overleg
      over de voorgenomen bindende afspraken niet tot overeenstemming leidt, schrijven burgemeester en wethouders een
      nieuw overleg uit, waarbij zij initiatieven nemen tot het bereiken van een zo groot mogelijke consensus. Indien ook
      dit overleg niet tot overeenstemming leidt, vragen burgemeester en wethouders of een van de bevoegde gezagsorganen
      aan de geschillencommissie, bedoeld in het tweede lid, om een bindend advies. De geschillencommissie brengt binnen
      4 weken aan burgemeester en wethouders dan wel aan het bevoegd gezag dat om het advies heeft verzocht, een bindend
      advies uit. Burgemeester en wethouders maken dit advies bekend aan de bevoegde gezagsorganen van de scholen en de
      kinderopvang, bedoeld in de [Wet kinderopvang][ref2] in de gemeente.

      2 Onze minister stelt een geschillencommissie in.

      3 De commissie bestaat uit een voorzitter en 4 leden, die allen door Onze minister worden benoemd. De 4 leden
      worden benoemd op voordracht van de gezamenlijke besturenorganisaties en de Vereniging van Nederlandse Gemeenten.
      De voorzitter is een jurist.

      4 De voorzitter en de leden worden benoemd voor een termijn van 4 jaar. Zij zijn opnieuw benoembaar. Op eigen
      verzoek wordt aan hen ontslag verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0017017
      [ref2]: https://wetten.overheid.nl/BWBR0017017
    url: https://wetten.overheid.nl/BWBR0003420/2012-01-01#Artikel167a
    references:
      - id: ref1
        bwb_id: BWBR0017017
      - id: ref2
        bwb_id: BWBR0017017
  - number: '168'
    text: |-
      Indien niet binnen een redelijke termijn met alle partijen, bedoeld in [artikel 167, tweede lid][ref1], afspraken
      als bedoeld in artikel 167, eerste lid, zijn gemaakt, kunnen burgemeester en wethouders de werkingssfeer van de
      gemaakte afspraken, voor zover noodzakelijk voor een samenhangend onderwijsachterstandenbeleid, uitbreiden naar de
      partijen, bedoeld in artikel 167, tweede lid, waarmee geen afspraken zijn gemaakt.


