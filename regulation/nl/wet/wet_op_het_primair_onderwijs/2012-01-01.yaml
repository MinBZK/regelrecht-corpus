    text: |-
      1 Onze minister besluit binnen 13 weken op een aanvraag als bedoeld in [artikel 64b][ref1].

      2 De termijn, bedoeld in het eerste lid, kan ten hoogste met 13 weken worden verlengd. Van deze verlenging wordt,
      binnen de 13 weken bedoeld in het eerste lid, mededeling gedaan aan de aanvrager.

      3 Op het besluit bedoeld in het eerste lid is [paragraaf 4.1.3.3 van de Algemene wet bestuursrecht][ref2] van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel64b
