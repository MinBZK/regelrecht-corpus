  - number: '74'
    text: |-
      1 De bekostiging van een openbare en een bijzondere school kan slechts een aanvang nemen, indien zij voorkomt op
      een voor de gemeente van vestiging vastgesteld plan van nieuwe scholen. De bekostiging van een nevenvestiging neemt
      slechts een aanvang op grond van [artikel 85][ref1]. De [artikelen 74, tweede lid, tot en met 83][ref2] zijn niet
      van toepassing op nevenvestigingen, bij omzetting van een bekostigde bijzondere school in een bekostigde openbare
      school of omgekeerd, bij omzetting van een bekostigde bijzondere school in een bekostigde bijzondere school van een
      andere richting, bij uitbreiding van het onderwijs aan een school met onderwijs van een of meer andere richtingen,
      en bij de totstandkoming van een samenwerkingsschool. De bekostiging kan slechts aanvangen per 1 augustus van een
      schooljaar.

      2 De gemeenteraad stelt het plan, bedoeld in het eerste lid, eerste volzin, al dan niet in samenwerking met de raad
      van een of meer andere gemeenten, elk jaar voor 1 augustus vast. Het plan bestrijkt 3 achtereenvolgende schooljaren
      volgende op het jaar van de vaststelling en vermeldt in elk geval welke scholen bij de aanvang van het eerste
      schooljaar van de planperiode voor bekostiging in aanmerking komen en de reden waarom de overige scholen daarvoor
      niet in aanmerking komen. Het plan vermeldt verder van elke school de plaats van vestiging en de te verwachten
      omvang. Het plan behoeft de goedkeuring van Onze minister, bedoeld in [artikel 79][ref3].

      3 Bij de goedkeuring van Onze minister van het plan, treden voor de toepassing van
      [artikel 4:8 van de Algemene wet bestuursrecht][ref4] burgemeester en wethouders in de plaats van het bevoegd gezag
      van de bijzondere scholen.


