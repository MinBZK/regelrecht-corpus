    text: |-
      1 Burgemeester en wethouders stellen na overleg met de bevoegde gezagsorganen van de niet door de gemeente in stand
      gehouden scholen het aantal klokuren per week vast dat per groep leerlingen ten hoogste

      a. ter beschikking wordt gesteld in een ruimte voor het onderwijs in lichamelijke oefening, of

      b. voor bekostiging voor de materiële instandhouding van een ruimte voor het onderwijs in lichamelijke oefening in
      aanmerking komt.

      2 Het aantal klokuren, bedoeld in het eerste lid, wordt vastgesteld op ten minste 1,5 voor basisscholen en ten
      minste 2,25 voor speciale scholen voor basisonderwijs.

      3 Burgemeester en wethouders stellen de hoogte vast van

      a. de bekostiging, bedoeld in het eerste lid, onder b, en

      b. de bekostiging voor de vaste kosten van de materiële instandhouding van een ruimte voor lichamelijke oefening
      waarvan de eigendom berust bij het bevoegd gezag van een niet door de gemeente in stand gehouden school.

      4 Bij de vaststelling, bedoeld in het derde lid, kan onderscheid worden gemaakt naar gelang de oppervlakte van de
      ruimte, alsmede tussen ruimten voor de exploitatie waarvan op grond van de onderwijswetgeving bekostiging wordt
      verleend en ruimten waarvoor dat niet het geval is.
    url: https://wetten.overheid.nl/BWBR0003420/2012-01-01#Artikel117
  - number: '118'
    text: |-
      1 Indien verschillende bevoegde gezagsorganen samenwerken in een samenwerkingsverband, wordt aan het bestuur van
      de centrale dienst een bekostiging toegekend voor materiële instandhouding die samenhangt met de inrichting van
      de zorgstructuur.

      2 Indien een bevoegd gezag alle scholen in een samenwerkingsverband in stand houdt, wordt de bekostiging voor
      materiële instandhouding die samenhangt met de inrichting van de zorgstructuur toegekend aan dat bevoegd gezag.

      3 De in het eerste en tweede lid bedoelde bekostiging is afhankelijk van het aantal leerlingen van de afzonderlijke
      basisscholen op 1 oktober van het jaar voorafgaand aan het jaar waarover de bekostiging plaatsvindt.

      4 De bekostiging, bedoeld in het eerste en het tweede lid, wordt jaarlijks vastgesteld bij ministeriële
      regeling. Deze ministeriële regeling wordt tezamen met de ministeriële regelingen, bedoeld in
      [artikel 113, zevende lid][ref1], binnen 4 weken na de vaststelling bekendgemaakt in de Staatscourant, onder
      gelijktijdige overlegging aan de Tweede Kamer der Staten-Generaal. [Artikel 113, zevende lid, tweede volzin][ref2],
      is van overeenkomstige toepassing.

      5 Indien op 1 oktober het aantal leerlingen van de gezamenlijke speciale scholen voor basisonderwijs in een
      samenwerkingsverband meer bedraagt dan 2% van het aantal leerlingen van het samenwerkingsverband, draagt het
      bestuur van de centrale dienst voor elke leerling van een speciale school voor basisonderwijs boven voornoemde 2%
      het in [artikel 115, eerste lid][ref3], bedoelde bedrag over aan de speciale scholen voor basisonderwijs, met dien
      verstande dat [artikel 115, eerste lid, tweede volzin, en tweede lid][ref4], van overeenkomstige toepassing is.

      6 In het zorgplan wordt vastgelegd welk deel van de bekostiging voor materiële instandhouding die samenhangt met de
      inrichting van de zorgstructuur voorzover na toepassing van het vijfde lid en [artikel 118a][ref5] die bekostiging
      nog resteert, op welke basisschool in het samenwerkingsverband wordt ingezet.

      7 Bij de berekening op grond van het vijfde lid wordt 2% van het aantal leerlingen van het samenwerkingsverband
      rekenkundig afgerond op een geheel getal.

      8 De overdracht op grond van het vijfde lid door het bestuur van de centrale dienst heeft betrekking op het
      kalenderjaar dat volgt op de in het vijfde lid bedoelde teldatum en vindt ten hoogste plaats voor het aan het
      bestuur van de centrale dienst op grond van het eerste lid dan wel het bevoegd gezag op grond van het tweede lid
      toegekende bekostiging van de materiële instandhouding die samenhangt met de inrichting van de zorgstructuur.


