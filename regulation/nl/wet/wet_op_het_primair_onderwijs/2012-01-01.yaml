  - number: '75'
    text: |-
      1 Een voorstel van burgemeester en wethouders aan de gemeenteraad dat de opneming in het plan van een of meer
      openbare scholen bevat, gaat vergezeld van:

      a. een prognose van het te verwachten aantal leerlingen,

      b. de beschrijving van het voedingsgebied,

      c. de aanduiding van de plaats in de gemeente waar het onderwijs moet worden gegeven en

      d. de voorgestelde datum van ingang van de bekostiging.

      2 De gemeenteraad neemt een openbare school in elk geval in het plan op, indien binnen 10 kilometer van de plaats
      in de gemeente waar het onderwijs moet worden gegeven over de weg gemeten geen school aanwezig is waarbinnen
      openbaar onderwijs wordt gegeven en aan het volgen van openbaar onderwijs behoefte bestaat. De gemeenteraad neemt
      een openbare school voorts in het plan op, indien op grond van de bij het voorstel overgelegde gegevens aannemelijk
      is, dat zij voldoet aan de normen van [artikel 77, eerste lid][ref1].

      3 De in het eerste lid bedoelde prognose:

      a. geeft inzicht in het te verwachten aantal leerlingen voor elk jaar van het tijdvak waarop de prognose betrekking
      heeft,

      b. is gebaseerd op statistische gegevens over een tijdvak van 5 jaar en

      c. vermeldt de berekeningen die tot de uitkomsten hebben geleid.

      De prognose bevat gegevens omtrent:

      1°. het voedingsgebied,

      2°. de plaats in de gemeente waar het onderwijs moet worden gegeven,

      3°. de bevolking in het voedingsgebied van 0 tot en met 14 jaar, verdeeld in leeftijdsgroepen van 1 jaar,

      4°. de te verwachten instroom naar en uitstroom uit die bevolking,

      5°. het te verwachten aantal levendgeborenen en

      6°. indien het betreft openbaar onderwijs waarvoor nog geen basisonderwijs binnen de gemeente wordt gegeven: het
      belangstellingspercentage voor het openbaar basisonderwijs in een vergelijkbare gemeente, of

      7°. indien het betreft openbaar onderwijs waarvoor reeds een school binnen de gemeente aanwezig is: het
      belangstellingspercentage voor de openbare school of scholen binnen de gemeente.

      De prognose kan tevens gegevens bevatten naar aanleiding van de directe meting.

      4 Bij ministeriële regeling worden modellen vastgesteld voor het verstrekken van de prognose, bedoeld in het eerste
      lid. Daarbij wordt aangegeven op welke wijze de prognose wordt ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel77
