  - number: 157a
    text: |-
      1 Het bevoegd gezag van een school die op grond van de gemiddelde schoolgrootte, bedoeld in
      [artikel 157, eerste, tweede of derde lid][ref1], in stand wordt gehouden dan wel wordt bekostigd, en die
      vervolgens op de teldatum 1 oktober minder dan 23 leerlingen telt, kan Onze minister verzoeken in afwijking van
      [artikel 153, eerste, tweede en derde lid][ref2], die bijzondere school te blijven bekostigen of die openbare
      school in stand te houden voor een door Onze minister te bepalen termijn. Een besluit tot instandhouding
      wordt in elk geval niet genomen indien de kwaliteit van het onderwijs op de school, bedoeld in de Wet op het
      onderwijstoezicht, onvoldoende is of geen perspectief bestaat op structurele toename van het aantal leerlingen
      van de school tot het aantal van ten minste 23 op 1 oktober voorafgaand aan de datum waarop de door Onze minister
      te bepalen termijn eindigt. Het al dan niet aanwezig zijn van basisscholen in de omgeving van de school kan Onze
      minister eveneens betrekken bij zijn besluit.

      2 Een verzoek als bedoeld in het eerste lid moet voor 1 februari voorafgaand aan de datum van de beëindiging
      van de bekostiging onderscheidenlijk de opheffing schriftelijk worden ingediend bij Onze minister. Het verzoek
      gaat vergezeld van gegevens ter onderbouwing van het perspectief, bedoeld in het eerste lid, een beredeneerde
      leerlingprognose en gegevens over de ligging van de school ten opzichte van de dichtstbijzijnde basisscholen.

      3 Onze minister besluit voor 1 mei, volgend op het verzoek, bedoeld in het tweede lid, dat:

      a. met ingang van 1 augustus van het volgende schooljaar de bekostiging van de bijzondere school wordt beëindigd
      dan wel de openbare school wordt opgeheven, of

      b. met ingang van 1 augustus van het volgende schooljaar de bekostiging van de bijzondere school wordt voortgezet
      of de openbare school in stand wordt gehouden.

      4 Onze minister kan de termijn, bedoeld in het eerste lid, op verzoek van het bevoegd gezag eenmalig verlengen met
      maximaal de duur van de termijn die op grond van het eerste lid ten aanzien van de school door hem was bepaald. De
      tweede en derde volzin van het eerste lid zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel157
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel153
