      1 Burgemeester en wethouders dragen er zorg voor dat er in een gemeente voldoende voorzieningen in aantal
      en spreiding zijn waar kinderen met een risico op een achterstand in de Nederlandse taal, als bedoeld in
      [artikel 167, eerste lid][ref1], deel kunnen nemen aan voorschoolse educatie die voldoet aan de bij of krachtens
      de [artikelen 1.50b][ref2] en [2.8 van de Wet kinderopvang en kwaliteitseisen peuterspeelzalen][ref3] vastgestelde
      bepalingen.

      2


