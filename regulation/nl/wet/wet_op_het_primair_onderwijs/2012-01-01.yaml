  - number: '84'
    text: |-
      1 Onze minister kan onder door hem te stellen voorwaarden voor bekostiging in aanmerking brengen een school
      die wordt omgezet, als bedoeld in [artikel 74, eerste lid derde volzin][ref1], of waaraan het onderwijs
      wordt uitgebreid met onderwijs van een of meer andere richtingen dan wel een school die tot stand komt als
      samenwerkingsschool.

      2 Onze minister kan toestaan dat een bekostigde school een andere plaats van vestiging krijgt. Onze minister kan
      aan zijn toestemming voorwaarden verbinden.

      3 Een verzoek om een besluit als bedoeld in het eerste of tweede lid, is met redenen omkleed en gaat vergezeld van
      de gegevens, genoemd in [artikel 75, eerste lid][ref2]. Onze minister willigt het verzoek slechts in, ingeval:

      a. de school, indien deze in een plan van scholen zou zijn opgenomen, bij toepassing van de
      [artikelen 77 tot en met 79][ref3] door hem zou worden goedgekeurd,

      b. indien op de onder a genoemde grond geen goedkeuring zou kunnen worden verleend en het een omzetting in een
      openbare school, de totstandkoming van een samenwerkingsschool, of een verplaatsing van een school waaraan openbaar
      onderwijs wordt gegeven betreft, binnen 10 kilometer van de plaats in de gemeente waar het onderwijs moet worden
      gegeven over de weg gemeten geen school aanwezig is waarbinnen openbaar onderwijs wordt gegeven en aan het volgen
      van openbaar onderwijs behoefte bestaat,

      c. de bekostiging van de school, indien daaraan het onderwijs wordt uitgebreid met onderwijs van een
      of meer andere richtingen, van uitsluitend een of meer op te heffen scholen, met inachtneming van de
      [artikelen 154 tot en met 156][ref4] gedurende ten minste 20 achtereenvolgende jaren zou kunnen worden voortgezet,
      of

      d. een samenwerkingsschool met inachtneming van [artikel 17d][ref5] tot stand zou kunnen komen.


