  - number: '28'
    text: |-
      Bij algemene maatregel van bestuur worden nadere voorschriften gegeven omtrent de taak, samenstelling, werkwijze
      en totstandkoming van de regionale verwijzingscommissies. De algemene maatregel van bestuur, bedoeld in de vorige
      volzin, wordt aan de Tweede Kamer der Staten-Generaal overgelegd. De maatregel treedt niet in werking dan nadat
      4 weken na de overlegging zijn verstreken en gedurende die termijn niet door of namens de Kamer de wens wordt te
      kennen gegeven dat het in die maatregel geregelde onderwerp bij de wet wordt geregeld. Alsdan wordt een daartoe
      strekkend wetsvoorstel zo spoedig mogelijk ingediend. Het bepaalde in de vorige 3 volzinnen is niet van toepassing
      indien het ontwerp van de algemene maatregel van bestuur voordien aan de Kamer is overgelegd en door of namens de
      Kamer te kennen is gegeven dat van de procedure, bedoeld in de vorige 3 volzinnen, kan worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0003420/2012-01-01#Artikel28
  - number: '29'
    text: |-
      1 Aan elke school zijn 1 of 2 directeuren verbonden, bij wie onder verantwoordelijkheid van het bevoegd gezag de
      onderwijskundige, organisatorische en huishoudelijke leiding berust. De functie van directeur kan minder dan een
      volledige formatieplaats omvatten. De directeur van een school kan tevens met de leiding worden belast van een
      andere school waar de functie van directeur vacant is. De directeur van een school kan tevens directeur zijn van
      een andere school of van een school als bedoeld in de [Wet op de expertisecentra][ref1].

      2 Aan een school zijn een of meer leraren verbonden.

      3 Een of meer leraren kunnen tevens tot adjunct-directeur worden benoemd dan wel tewerkgesteld zonder benoeming.
      Indien geen adjunct-directeur wordt benoemd dan wel tewerkgesteld zonder benoeming en aan de school slechts 1
      directeur is verbonden, wijst het bevoegd gezag een leraar aan als plaatsvervanger van de directeur.

      4 Voor zover het betreft de functie van directeur en adjunct-directeur, wordt in geval van samenvoeging van scholen
      de overblijvende school gelijkgesteld met een nieuwe school. De directeur, onderscheidenlijk de adjunct-directeur
      of adjunct-directeuren, kan slechts een van de directeuren onderscheidenlijk kunnen slechts een of meer van de
      adjunct-directeuren van de samen te voegen scholen zijn, tenzij geen van de betrokkenen de desbetreffende functie
      wenst te aanvaarden.

      5 Het bevoegd gezag kan tevens personeel, dat werkzaamheden verricht ten behoeve van meer dan een school of meer
      dan een school als bedoeld in de [Wet op de expertisecentra][ref2], benoemen of te werk stellen zonder benoeming
      waaronder begrepen leden van het bestuur van die scholen voor zover het intern toezicht wordt uitgeoefend door een
      raad van toezicht als bedoeld in [artikel 17c, derde lid][ref3].

      6 Aan een school kan onderwijsondersteunend personeel zijn verbonden.

      7 Bij algemene maatregel van bestuur wordt bepaald welke rechtspositionele gevolgen zijn verbonden aan functies die
      zowel onderwijsgevende als onderwijsondersteunende taken omvatten.

      8 Het bevoegd gezag stelt jaarlijks het beleid vast met betrekking tot de formatie van de verschillende categorieën
      personeel van de school. Indien toepassing is gegeven aan het vijfde lid, stelt het bevoegd gezag tevens jaarlijks
      het beleid vast met betrekking tot de formatie van dat personeel. Zoveel mogelijk tegelijk met de vaststelling
      van het in de eerste en tweede volzin bedoelde beleid met betrekking tot de formatie, bepaalt het bevoegd gezag
      functies en taken van het personeel van de school, met inachtneming van de daaromtrent bij algemene maatregel van
      bestuur te geven nadere voorschriften, en in voorkomend geval functies en taken van het in het vijfde lid bedoelde
      personeel.


      [ref1]: https://wetten.overheid.nl/BWBR0003549
      [ref2]: https://wetten.overheid.nl/BWBR0003549
      [ref3]: https://wetten.overheid.nl/BWBR0003420#Artikel17c
