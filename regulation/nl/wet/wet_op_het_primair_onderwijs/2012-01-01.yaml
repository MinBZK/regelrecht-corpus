  - number: '148'
    text: |-
      1 Het bevoegd gezag wendt met inachtneming van het zorgplan het totaal van de in de [artikelen 129][ref1],
      [134][ref2] en [137][ref3] bedoelde bedragen voor de kosten voor de materiële instandhouding en de personeelskosten
      uitsluitend aan voor kosten voor materiële instandhouding, personeelskosten van de school of personeelskosten in
      verband met benoeming of tewerkstelling zonder benoeming van personeel, bedoeld in [artikel 29, vijfde lid][ref4],
      dan wel mede voor die kosten van een van de andere scholen van dat bevoegd gezag.

      2 Het bevoegd gezag kan de in de [artikelen 129][ref5], [134][ref6], [137][ref7] en [180a][ref8] bedoelde bedragen
      voor de kosten voor de materiële instandhouding en voor de personeelskosten mede aanwenden voor de in het eerste
      lid bedoelde kosten van:

      a. een centrale dienst of een andere school;

      b. een centrale dienst of een school voor speciaal onderwijs, voor voortgezet speciaal onderwijs, voor speciaal en
      voortgezet speciaal onderwijs, een instelling voor speciaal en voortgezet speciaal onderwijs dan wel een regionaal
      expertisecentrum als bedoeld in de [Wet op de expertisecentra][ref9] of een centrale dienst dan wel een school als
      bedoeld in de [Wet op het voortgezet onderwijs][ref10].

      3 De verstrekte overschrijdingsbedragen worden ten behoeve van het onderwijs aan de scholen van het bevoegd gezag
      aangewend.

      4 De op grond van [artikel 140][ref11] of [artikel 141][ref12] verstrekte vergoeding wordt besteed aan het doel
      waarvoor zij is verstrekt.


