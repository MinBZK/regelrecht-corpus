  - number: '77'
    text: |-
      1 De gemeenteraad neemt een bijzondere school in elk geval in het plan op, indien op grond van de bij het
      verzoek overgelegde gegevens aannemelijk is dat zij binnen 5 jaar vanaf de datum van ingang van de bekostiging en
      voorts gedurende 15 jaar na die periode van 5 jaar zal worden bezocht door ten minste het aantal leerlingen dat
      overeenkomt met de voor de gemeente geldende stichtingsnorm.

      2 Bij ministeriële regeling wordt voor elke gemeente een stichtingsnorm vastgesteld welke 10/6 bedraagt van de voor
      de gemeente geldende opheffingsnorm berekend op grond van [artikel 154][ref1]. De uitkomst wordt afgerond, waarbij
      de decimalen worden verwaarloosd indien het eerste cijfer achter de komma kleiner is dan 5 en de decimalen worden
      verwaarloosd en het getal verhoogd met 1 indien het eerste cijfer achter de komma gelijk is aan of groter is dan 5.
      De stichtingsnorm bedraagt minimaal 200.

      3 De stichtingsnormen, bedoeld in het tweede lid, zijn in afwijking van het tweede lid, eerste volzin, voor
      de eerste maal opgenomen in de bij deze wet behorende bijlage. Deze normen zijn tot en met 31 juli 1998 van
      kracht. Deze normen worden met ingang van 1 augustus 1998 telkens voor een tijdvak van 5 jaar gelijktijdig met
      de aanpassing van de opheffingsnormen op grond van [artikel 153][ref2] bij ministeriële regeling aangepast. De
      ministeriële regeling, bedoeld in de derde volzin, wordt voor 1 november van het jaar voorafgaand aan het laatste
      jaar waarin de stichtingsnormen van kracht zijn, bekendgemaakt in de Staatscourant.

      4 In het geval van een wijziging van de gemeentelijke indeling of een grenscorrectie als bedoeld in
      [artikel 283 van de Gemeentewet][ref3], stelt Onze minister op de wijze als aangegeven in het tweede lid de
      nieuwe stichtingsnormen voor de betrokken gemeenten vast, voor zover deze afwijken van de op grond van het tweede
      en derde lid bepaalde stichtingsnormen. De nieuwe stichtingsnormen treden in de plaats van de op grond van het
      tweede en derde lid bepaalde stichtingsnormen en treden in werking met ingang van 1 januari volgend op de datum
      van herindeling, bedoeld in [artikel 1, onderdeel f, van de Wet algemene regels herindeling][ref4]. Tot en met
      31 december volgend op de datum van herindeling blijven op de scholen in de gemeenten die bij de wijziging van de
      gemeentelijke indeling of de grenscorrectie zijn betrokken, de stichtingsnormen van toepassing die golden op de dag
      voorafgaande aan de datum van herindeling.

      5 In het geval van een wijziging van de naam van een gemeente of een wijziging van het gemeentenummer past
      Onze minister de ministeriële regeling, bedoeld in het tweede lid, of de bijlage, bedoeld in het derde lid,
      dienovereenkomstig aan.


