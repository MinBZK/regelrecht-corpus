  - number: '76'
    text: |-
      1 Een verzoek om opneming in het plan van een bijzondere school moet voor 1 februari van het jaar van de
      vaststelling van het plan bij de gemeenteraad worden ingediend.

      2 Het verzoek vermeldt de richting van de school en naam en adres van het bevoegd gezag en gaat vergezeld van de
      gegevens genoemd in [artikel 75, eerste lid][ref1], juncto [artikel 75, derde lid][ref2], met dien verstande dat in
      afwijking van [artikel 75, eerste lid,][ref3] juncto [artikel 75, derde lid onder c 6°en c 7°][ref4] de prognose
      gegevens bevat omtrent:

      a. indien het betreft een richting waarvoor nog geen basisonderwijs binnen de gemeente wordt gegeven: het
      belangstellingspercentage voor het basisonderwijs van die richting in een vergelijkbare gemeente, of

      b. indien het betreft een school van een richting waarvoor reeds een school binnen de gemeente aanwezig is: het
      belangstellingspercentage voor de school of scholen van die richting binnen de gemeente.

      Indien de door het bevoegd gezag verstrekte gegevens onvoldoende zijn om het verzoek te kunnen beoordelen, delen
      burgemeester en wethouders voor 1 maart volgend op de in het eerste lid genoemde datum aan het bevoegd gezag mede
      dat de gegevens voor 1 april daaropvolgend dienen te worden aangevuld. Indien de aanvullende gegevens niet voor 1
      april zijn verstrekt, wordt het verzoek buiten behandeling gelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel75
