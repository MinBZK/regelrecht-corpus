  - number: 38a
    text: |-
      1 Degene die beschikt over een in artikel 176b bedoelde geschiktheidsverklaring, het bevoegd gezag dat betrokkene
      benoemt of tewerkstelt zonder benoeming, en het bestuur van een instelling die werkzaamheden uitvoert als bedoeld
      in artikel 176g, eerste lid onder a, sluiten een overeenkomst die hun wederzijdse rechten en plichten omvat
      met betrekking tot het uitvoeren van de noodzakelijk geachte scholing en begeleiding, met inachtneming van de
      beoordeling, bedoeld in artikel 176c, tweede lid, onder c. Indien na het sluiten van de overeenkomst blijkt dat
      de scholing of begeleiding niet volgens de overeenkomst kan worden uitgevoerd, treft het bevoegd gezag tijdig een
      toereikende vervangende voorziening.

      2 Bij of krachtens algemene maatregel van bestuur kunnen nadere voorschriften worden gegeven voor de uitvoering van
      het eerste lid, waaronder in elk geval voorschriften ter waarborging van de kwaliteit van het daarin bepaalde.

      3 Tevens worden bij algemene maatregel van bestuur bijzondere zonodig van deze wet afwijkende voorschriften gegeven
      voor gevallen waarin men voor dezelfde werkzaamheden wenst te worden benoemd of tewerkgesteld zonder benoeming aan
      scholen die niet uitgaan van hetzelfde bevoegd gezag.

      4 De algemene maatregel van bestuur, bedoeld in het tweede en derde lid, wordt aan de beide Kamers der Staten-
      Generaal overgelegd. De maatregel treedt niet in werking dan nadat vier weken na de overlegging zijn verstreken
      en niet door of namens een van beide Kamers de wens wordt te kennen gegeven dat het in die maatregel geregelde
      onderwerp bij de wet wordt geregeld. Alsdan wordt een daartoe strekkend wetsvoorstel zo spoedig mogelijk ingediend.
    url: https://wetten.overheid.nl/BWBR0003420/2012-01-01#Artikel38a
  - number: '39'
    text: |-
      1 Om als leerling tot een school te worden toegelaten, moet een kind de leeftijd van 4 jaar hebben bereikt.

      2 Het bevoegd gezag kan voor kinderen die nog niet eerder tot een school, een school of afdeling voor speciaal
      onderwijs, een school voor speciaal en voortgezet speciaal onderwijs dan wel een instelling voor speciaal en
      voortgezet speciaal onderwijs zijn toegelaten, toelatingstijdstippen vaststellen op ten minste eenmaal per maand.

      3 In de periode vanaf de leeftijd van 3 jaar en 10 maanden tot het bereiken van de leeftijd van 4 jaar kan het
      bevoegd gezag kinderen gedurende ten hoogste 5 dagen toelaten. Deze kinderen zijn geen leerlingen in de zin van
      de wet.

      4 Leerlingen bij wie naar het oordeel van de directeur van de school de grondslag voor het volgen van aansluitend
      voortgezet onderwijs in voldoende mate is gelegd, verlaten aan het einde van het schooljaar de school, mits
      hierover met de ouders overeenstemming bestaat. In elk geval verlaten de leerlingen de school aan het einde van het
      schooljaar waarin zij de leeftijd van 14 jaar hebben bereikt.
    url: https://wetten.overheid.nl/BWBR0003420/2012-01-01#Artikel39
  - number: '40'
    text: |-
      1 De beslissing over toelating en verwijdering van leerlingen berust bij het bevoegd gezag. De
      toelating tot de school is niet afhankelijk van het houden van rechtmatig verblijf in de zin van
      [artikel 8 van de Vreemdelingenwet 2000][ref1]. De toelating mag niet afhankelijk worden gesteld van een geldelijke
      bijdrage van de ouders. Overeenkomsten waarbij ouders worden verplicht tot het betalen van een geldelijke bijdrage
      zijn nietig, behoudens voorzover zij na de toelating van de leerling tot de school schriftelijk zijn aangegaan
      en in het desbetreffende schriftelijke stuk aan de ouders kenbaar is gemaakt dat het een vrijwillige bijdrage
      betreft waarvoor de overeenkomst niet behoeft te worden aangegaan, doch waarvoor geldt dat na de ondertekening
      wel een verplichting tot betaling van de overeengekomen bijdrage bestaat. Zodanige overeenkomsten zijn evenzeer
      nietig, indien deze niet hebben voorzien in de vermelding dat de ouders de mogelijkheid hebben er voor te kiezen
      om de overeenkomst slechts voor bepaalde voorzieningen aan te gaan en ten behoeve daarvan niet een specificatie
      voor de te onderscheiden voorzieningen in de overeenkomst is opgenomen. Zodanige overeenkomsten zijn voorts nietig
      indien ten aanzien daarvan geen reductie- en kwijtscheldingsregeling geldt en de inhoud van die regeling niet in de
      overeenkomst is opgenomen. Een overeenkomst wordt telkens voor de periode van een schooljaar aangegaan.

      2 Toelating van leerlingen afkomstig van een school voor speciaal onderwijs, een school voor speciaal en voortgezet
      speciaal onderwijs of een instelling voor speciaal en voortgezet speciaal onderwijs, alsmede overgang van een
      leerling naar een dergelijke school of instelling, vindt slechts plaats in overeenstemming met de ouders.

      3 Een leerling wordt niet toegelaten tot een speciale school voor basisonderwijs dan nadat de permanente commissie
      leerlingenzorg van het samenwerkingsverband waarvan de speciale school voor basisonderwijs deel uitmaakt, heeft
      bepaald dat plaatsing van de leerling op een zodanige school noodzakelijk is. Indien de permanente commissie
      leerlingenzorg, bedoeld in de eerste volzin, heeft bepaald dat plaatsing van de leerling op een speciale school
      voor basisonderwijs noodzakelijk is, wordt de leerling toegelaten uiterlijk met ingang van het eerste van de
      volgende tijdstippen: de eerste dag na de voor de school geldende zomervakantie, de eerste dag na de voor de school
      geldende kerstvakantie dan wel 1 april.

      4 De toelating tot een speciale school voor basisonderwijs wordt niet geweigerd op de grond dat de leerling
      niet is aangewezen op het onderwijs van een speciale school voor basisonderwijs, indien de permanente commissie
      leerlingenzorg van het samenwerkingsverband waaraan de speciale school voor basisonderwijs deelneemt heeft bepaald
      dat plaatsing van de leerling op een speciale school voor basisonderwijs noodzakelijk is. De toelating van een
      leerling van een basisschool tot een speciale school voor basisonderwijs van het samenwerkingsverband waaraan
      de basisschool deelneemt wordt voorts niet geweigerd op denominatieve gronden, tenzij de ouders van de leerling
      weigeren te verklaren dat zij de grondslag van het onderwijs van de school zullen respecteren.

      5 Voordat wordt besloten tot verwijdering hoort het bevoegd gezag de betrokken groepsleraar. Definitieve
      verwijdering van een leerling vindt niet plaats dan nadat het bevoegd gezag ervoor heeft zorggedragen dat een
      andere school, een school voor speciaal onderwijs, een school voor speciaal en voortgezet speciaal onderwijs of een
      instelling voor speciaal en voortgezet speciaal onderwijs bereid is de leerling toe te laten. Indien aantoonbaar
      gedurende 8 weken zonder succes is gezocht naar een zodanige school of instelling waarnaar kan worden verwezen, kan
      in afwijking van de vorige volzin tot definitieve verwijdering worden overgegaan.

      6 Indien tegen het besluit, bedoeld in het eerste lid, van het bevoegd gezag van een openbare school bezwaar is
      gemaakt, besluit het bevoegd gezag in afwijking van [artikel 7:10 van de Algemene wet bestuursrecht][ref2] binnen 4
      weken gerekend vanaf de dag na die waarop de termijn voor het indienen van het bezwaarschrift is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel710
