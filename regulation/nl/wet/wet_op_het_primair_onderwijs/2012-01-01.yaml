  - number: 180a
    text: |-
      1 Het Rijk verstrekt jaarlijks aan het bevoegd gezag van een school, bekostiging die kan worden besteed ten behoeve
      van schoolbegeleiding.

      2 De bekostiging, bedoeld in het eerste lid, wordt voor elk schooljaar berekend door het aantal leerlingen
      op de teldatum 1 oktober van het voorafgaande schooljaar te vermenigvuldigen met een bedrag dat jaarlijks bij
      ministeriële regeling wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003420/2012-01-01#Artikel180a
  - number: '181'
    text: |-
      1 Indien een bij of krachtens de wet gestelde termijn door het bevoegd gezag wordt overschreden en de gemeente
      daardoor geen bekostiging van het Rijk dan wel lagere bekostiging of met ingang van een latere datum bekostiging
      van het Rijk voor de materiële instandhouding ontvangt dan het geval zou zijn geweest indien deze termijn wel in
      acht was genomen, vergoedt het bevoegd gezag de door de gemeente geleden schade.

      2 Indien een bij of krachtens de wet gestelde termijn door burgemeester en wethouders wordt overschreden en het
      bevoegd gezag daardoor geen bekostiging van het Rijk dan wel lagere bekostiging of met ingang van een latere datum
      bekostiging van het Rijk voor de materiële instandhouding ontvangt dan het geval zou zijn geweest indien deze
      termijn wel in acht was genomen, vergoedt de gemeente de door het bevoegd gezag geleden schade.

      3 Burgemeester en wethouders en het bevoegd gezag kunnen in onderling overleg de in het eerste en tweede lid
      bedoelde verplichting tot schadevergoeding matigen. Indien dit overleg niet tot overeenstemming leidt, is
      [artikel 109 van boek 6 van het Burgerlijk Wetboek][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel109
    url: https://wetten.overheid.nl/BWBR0003420/2012-01-01#Artikel181
    references:
      - id: ref1
