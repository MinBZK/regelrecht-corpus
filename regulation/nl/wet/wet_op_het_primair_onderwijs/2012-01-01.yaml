  - number: '145'
    text: |-
      1 In het jaar volgend op de definitieve vaststelling, bedoeld in [artikel 144, zevende lid][ref1], wordt het
      overschrijdingsbedrag vastgesteld waarop het bevoegd gezag van een niet door de gemeente in stand gehouden school,
      die gedurende een of meer jaren van het desbetreffende tijdvak in de gemeente was gevestigd, aanspraak heeft.
      Dit overschrijdingsbedrag wordt vastgesteld door het percentage, bedoeld in [artikel 144, zevende lid][ref2], te
      vermenigvuldigen met het totaal van de ontvangsten van een niet door de gemeente in stand gehouden school dat is
      gebaseerd op de bedragen die krachtens de [artikelen 113][ref3] en [137][ref4] voor het desbetreffende tijdvak zijn
      vastgesteld, met dien verstande dat bij het vaststellen van het totaal van de ontvangsten, bedoeld in voorgaande
      volzin, buiten beschouwing blijven de ontvangsten op grond van de programma's van eisen voor administratie,
      beheer en bestuur, bedoeld in [artikel 114, onder e][ref5], voor de materiële instandhouding van het onderwijs in
      lichamelijke oefening en in verband met de toepassing van [artikel 165][ref6].

      2 Indien aan het bevoegd gezag van een niet door de gemeente in stand gehouden school een deel van de bekostiging
      voor personeelskosten is overgedragen door een ander bevoegd gezag, wordt bij het vaststellen van het totaal van
      de ontvangsten, bedoeld in het eerste lid, tweede volzin, dat deel bij genoemde school wel en bij de school van
      laatstgenoemd bevoegd gezag niet aangemerkt als ontvangsten.

      3 Indien een gemeente voor een niet door de gemeente in stand gehouden school het deel van de materiële
      instandhouding waarop de programma's van eisen, bedoeld in [artikel 114, onder a, b en c][ref7], betrekking hebben,
      geheel of gedeeltelijk verzorgt, wordt een overeenkomstig deel van de ontvangsten in mindering gebracht op het
      totaal van de ontvangsten voor de betrokken school waarover ingevolge het eerste lid het overschrijdingsbedrag
      wordt vastgesteld.

      4 Indien een gemeente gedurende een gedeelte van het desbetreffende tijdvak een of meer basisscholen
      onderscheidenlijk speciale scholen voor basisonderwijs in stand houdt, wordt voor het vaststellen van het
      overschrijdingsbedrag, bedoeld in het eerste lid, uitgegaan van het totaal van de ontvangsten van een niet door de
      gemeente in stand gehouden school over een overeenkomstig gedeelte van het desbetreffende tijdvak.


