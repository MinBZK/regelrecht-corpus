        artikel: '32'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: '1'
  - number: '38'
    text: |-
      Over de door het bevoegd gezag ingevolge [artikel 33][ref1] te treffen regelingen, alsmede over andere
      aangelegenheden van algemeen belang voor de bijzondere rechtstoestand van het personeel van de desbetreffende
      school, wordt door of namens het bevoegd gezag overleg gevoerd met de daarvoor in aanmerking komende
      vakorganisaties van overheids- en onderwijspersoneel, op een met deze schriftelijk overeengekomen wijze. In geval
      van een geschil over de deelneming aan het overleg, bedoeld in de eerste volzin, alsmede in geval van een geschil
      over de aard, de inhoud en de organisatie van het overleg leggen de betrokken partijen het geschil voor aan een
      geschillencommissie. Deze geschillencommissie bestaat uit drie personen, die door de partijen gezamenlijk worden
      aangewezen. De uitspraak van de geschillencommissie heeft bindende kracht.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel33
