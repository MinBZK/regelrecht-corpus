  - number: '140'
    text: |-
      1 Indien in een gemeente uitsluitend een of meer andere rechtspersonen dan de gemeente openbare basisscholen of
      openbare speciale scholen voor basisonderwijs in stand houden of openbare basisscholen onderscheidenlijk openbare
      speciale scholen voor basisonderwijs ontbreken en de gemeente uitgaven wil doen voor het onderwijs aan die scholen
      welke niet door het Rijk worden bekostigd, stelt de gemeenteraad bij verordening een regeling daarvoor vast en zijn
      de [artikelen 142 tot en met 147][ref1] niet van toepassing.

      2 De regeling, bedoeld in het eerste lid, maakt geen onderscheid tussen openbaar en bijzonder onderwijs en voorziet
      in een behandeling van basisscholen onderscheidenlijk speciale scholen voor basisonderwijs naar dezelfde maatstaf.

      3 De regeling, bedoeld in het eerste lid, bevat in elk geval de voorzieningen die door het bevoegd gezag van een
      in de gemeente gelegen, niet door de gemeente in stand gehouden basisschool onderscheidenlijk speciale school voor
      basisonderwijs kunnen worden aangevraagd en de procedure voor het doen van een aanvraag.

      4 De gemeenteraad kan besluiten dat burgemeester en wethouders de regeling, bedoeld in het eerste lid, tijdelijk
      kunnen aanvullen met nieuwe voorzieningen. De aanvulling wordt binnen 1 week aan de bevoegde gezagsorganen van
      de niet door de gemeente in stand gehouden basisscholen onderscheidenlijk speciale scholen voor basisonderwijs
      gezonden. Binnen 12 weken na de totstandkoming van de aanvulling wordt deze voorgelegd aan de gemeenteraad en
      besluit de gemeenteraad over de bekrachtiging ervan. Indien de gemeenteraad niet binnen 12 weken heeft besloten,
      wordt de aanvulling gelijk gesteld met een aanvulling die is bekrachtigd. Een afwijzing van de aanvulling door
      de gemeenteraad heeft geen gevolgen voor aanvragen waarop reeds is besloten of die reeds zijn ingediend en die
      voorzieningen betreffen waarop de aanvulling betrekking heeft.

      5 [Artikel 8:2 van de Algemene wet bestuursrecht][ref2] is niet van toepassing op de regeling, bedoeld in het
      eerste lid, dan wel een wijziging daarvan. In afwijking van [artikel 8:1 van de Algemene wet bestuursrecht][ref3]
      kan tegen een aanvulling als bedoeld in het vierde lid geen beroep worden ingesteld zolang de gemeenteraad deze nog
      niet heeft bekrachtigd.

      6 Voor de toepassing van dit artikel wordt een nevenvestiging aangemerkt als een nevenvestiging die is gelegen
      in de gemeente van de hoofdvestiging. De gemeenteraad kan in de verordening, bedoeld in het eerste lid, aan
      burgemeester en wethouders de bevoegdheid verlenen om, met inachtneming van de in die verordening gestelde regels,
      te besluiten dat in de gemeente gelegen nevenvestigingen van scholen waarvan de hoofdvestiging is gelegen in
      een andere gemeente in afwijking van de eerste volzin in aanmerking komen voor een of meer van de in de regeling
      genoemde voorzieningen.

      7 Burgemeester en wethouders maken jaarlijks in een van overheidswege uitgegeven blad of een dag-, nieuws- of huis-
      aan-huisblad, dan wel op een andere geschikte wijze, een overzicht bekend van de op grond van de regeling, bedoeld
      in het eerste lid, toegekende voorzieningen.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel142
