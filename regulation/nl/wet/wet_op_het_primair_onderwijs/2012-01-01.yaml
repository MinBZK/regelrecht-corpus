  - number: '18'
    text: |-
      1 Het bevoegd gezag is voor elk van zijn scholen aangesloten bij een samenwerkingsverband met een of meer
      basisscholen en een of meer speciale scholen voor basisonderwijs. Dit samenwerkingsverband stelt zich ten doel
      een samenhangend geheel van zorgvoorzieningen binnen en tussen basisscholen en in samenwerking met speciale
      scholen voor basisonderwijs te realiseren en wel zodanig dat zoveel mogelijk leerlingen een ononderbroken
      ontwikkelingsproces kunnen doormaken.

      2 De scholen die samenwerken in een samenwerkingsverband hebben tezamen ten minste 2000 leerlingen. In afwijking
      van de eerste volzin kunnen de scholen in een samenwerkingsverband gedurende 2 achtereenvolgende schooljaren of
      in het eerste en derde schooljaar van 3 achtereenvolgende schooljaren tezamen minder dan 2000 leerlingen hebben.
      Uiterlijk met ingang van 1 augustus volgend op de in de vorige volzin bedoelde schooljaren nemen de scholen deel
      aan een samenwerkingsverband dat op 1 oktober daaropvolgend voldoet aan de norm van 2000 leerlingen.

      3 Indien het aantal leerlingen in een samenwerkingsverband op 1 oktober minder bedraagt dan 2000 leerlingen, deelt
      Onze minister dit voor 1 februari daaropvolgend schriftelijk mee aan de bevoegde gezagsorganen van de scholen in
      het samenwerkingsverband.

      4 Een bevoegd gezag kan de deelname aan een samenwerkingsverband voor een school beëindigen indien

      a. een regeling is getroffen met de overige bevoegde gezagsorganen ten aanzien van de financiële en personele
      consequenties daarvan en

      b. door de beëindiging van de deelname geen aanspraken ontstaan op ontslaguitkeringen voor personeel dat werkzaam
      is bij de deelnemende scholen, waaronder de school waarvoor de deelname wordt beëindigd.

      5 Bij de beëindiging van de deelname op grond van het vierde lid wordt een termijn van 1 jaar in acht genomen.
      Deze termijn geldt niet voor scholen die deelnemen aan een samenwerkingsverband dat gedurende het tweede
      achtereenvolgende schooljaar dan wel het tweede van 3 achtereenvolgende schooljaren niet voldoet aan de norm van
      2000 leerlingen.

      6 De beëindiging van de deelname aan een samenwerkingsverband en de aansluiting bij een nieuw samenwerkingsverband
      gaan in op 1 augustus van een schooljaar. Voor 1 oktober of in het geval, bedoeld in het vijfde lid, tweede
      volzin, 1 april van het daaraan voorafgaande schooljaar meldt het bevoegd gezag de beëindiging onderscheidenlijk de
      aansluiting aan Onze minister.

      7 Onze minister kan ermee instemmen dat, in afwijking van het eerste lid, eerste volzin, van het
      samenwerkingsverband geen speciale school voor basisonderwijs deel uitmaakt en dat het eerste lid, tweede volzin,
      niet van toepassing is voor zover het betreft de samenwerking met speciale scholen voor basisonderwijs. Onze
      minister stemt slechts in indien

      a. in een adequate onderwijskundige opvang van leerlingen wordt voorzien en de inspectie hierover een positief
      advies heeft uitgebracht, en

      b. alle bevoegde gezagsorganen van de scholen in het samenwerkingsverband met het samenwerkingsverband waarvoor de
      instemming is gevraagd, instemmen.

      8 Het bevoegd gezag kan per basisschool slechts deelnemen aan 1 samenwerkingsverband. Bij deelname aan meer dan
      één samenwerkingsverband is voor de toepassing van deze wet en de daarop gebaseerde voorschriften uitsluitend de
      deelname van belang aan het samenwerkingsverband waarbij voor het eerst werd aangesloten.

      9 Indien een bevoegd gezag wenst deel te nemen aan een samenwerkingsverband, wordt deze deelname door de bevoegde
      gezagsorganen van het samenwerkingsverband niet geweigerd.
    url: https://wetten.overheid.nl/BWBR0003420/2012-01-01#Artikel18
  - number: '19'
    text: |-
      1 De bevoegde gezagsorganen van de scholen die samenwerken in een samenwerkingsverband stellen jaarlijks voor 1 mei
      een zorgplan vast voor het daaropvolgende schooljaar.

      2 Het zorgplan bevat in elk geval:

      a. de wijze waarop wordt voldaan aan [artikel 18, eerste lid][ref1],

      b. de wijze, waarop de bekostiging voor de zorgvoorzieningen, bedoeld in [artikel 120, vierde lid][ref2], en
      [artikel 132][ref3], en het daaraan gerelateerde personeel wordt ingezet, alsmede de basisscholen waaraan de
      bekostiging, bedoeld in [artikel 132][ref4], wordt overgedragen,

      c. de beoogde en bereikte kwalitatieve en kwantitatieve resultaten ten aanzien van de onderwijskundige opvang van
      de leerlingen die extra zorg behoeven,

      d. de samenstelling, werkwijze en financiering van een permanente commissie leerlingenzorg als bedoeld in
      [artikel 23][ref5],

      e. de procedures voor onderzoek van leerlingen en plaatsing van leerlingen op een speciale school voor
      basisonderwijs,

      f. de wijze waarop aan de ouders informatie wordt verstrekt over de zorgvoorzieningen en de criteria die de
      permanente commissie leerlingenzorg hanteert,

      g. de wijze waarop de ouders in de gelegenheid worden gesteld informatie te verstrekken aan de permanente commissie
      leerlingenzorg,

      h. de wijze waarop de permanente commissie leerlingenzorg informatie verstrekt aan de klachtencommissie, en

      i. de wijze waarop de bekostiging, bedoeld in [artikel 118][ref6] en [artikel 118a][ref7] wordt ingezet, en
      de basisscholen onderscheidenlijk de speciale scholen voor basisonderwijs waaraan de bekostiging, bedoeld in
      [artikel 118][ref8] onderscheidenlijk [artikel 118a][ref9], wordt overgedragen.

      3 Het zorgplan wordt voor 15 mei voorafgaand aan het schooljaar waarop het betrekking heeft, toegezonden aan de
      inspectie.


