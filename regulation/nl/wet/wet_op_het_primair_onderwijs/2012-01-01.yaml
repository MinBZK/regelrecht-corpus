  - number: '136'
    text: |-
      1 De gemeente verstrekt jaarlijks aan het bevoegd gezag van een niet door de gemeente in stand gehouden school dat
      eigenaar is van een ruimte voor het onderwijs in lichamelijke oefening op het grondgebied van de gemeente

      a. een bekostigingsbedrag dat wordt bepaald ingevolge [artikel 117 en het derde lid][ref1], en

      b. voor zover het gebruik van die ruimte ontoereikend is een overeenkomstig het tweede lid vast te stellen
      bekostigingsbedrag.

      2 Voor zover geen ruimte ter beschikking is gesteld als bedoeld in [artikel 117, eerste lid onder a][ref2],
      verstrekt de gemeente jaarlijks aan het bevoegd gezag van een niet door de gemeente in stand gehouden school
      dat geen eigenaar is van een ruimte voor het onderwijs in lichamelijke oefening een bekostigingsbedrag dat wordt
      bepaald ingevolge [artikel 117, eerste lid onder b, en derde lid onder a, en het derde lid][ref3].

      3 Het aantal groepen leerlingen voor basisscholen wordt berekend overeenkomstig
      [artikel 134, vierde lid onder a, vijfde lid onder a, en zesde lid onder a][ref4], en de ter uitvoering daarvan
      vastgestelde algemene maatregel van bestuur, met dien verstande dat groepen waarvoor van rijkswege bekostiging
      wordt verstrekt voor de kosten van de materiële instandhouding van een speellokaal niet in aanmerking worden
      genomen.

      4 Het aantal groepen leerlingen voor speciale scholen voor basisonderwijs wordt berekend door het aantal leerlingen
      op 1 oktober van het jaar voorafgaande aan het jaar waarover de bekostiging plaatsvindt te delen door 15 en de
      uitkomst rekenkundig af te ronden op een geheel getal.


