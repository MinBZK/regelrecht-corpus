  - number: 140a
    text: |-
      1 Indien de gemeenteraad ten aanzien van een of meer door de gemeente in stand gehouden openbare scholen
      besluit dat deze met ingang van een datum die is gelegen in de periode die aanvangt met een bij koninklijk
      besluit te bepalen datum en eindigt met ingang van het negende kalenderjaar daaropvolgend, in stand
      zullen worden gehouden door een of meer andere rechtspersonen dan de gemeente, kan de regeling, bedoeld in
      [artikel 140, eerste lid][ref1], dan wel de regeling, bedoeld in [artikel 141, eerste lid][ref2], bij effectuering
      van dat besluit ten aanzien van die scholen en in afwijking van [artikel 140, tweede lid][ref3], dan wel een
      regeling op grond van dit artikel bij effectuering van dat besluit ten aanzien van die scholen, erin voorzien
      dat door de gemeente aan een of meer andere rechtspersonen dan de gemeente die die scholen in stand houden, een
      vergoeding voor administratie, beheer en bestuur wordt toegekend als aangegeven in het tweede lid.

      2 De vergoeding, die op grond van het eerste lid kan worden toegekend, bedraagt gedurende het eerste en het
      tweede kalenderjaar volgend op het tijdstip waarop de scholen, bedoeld in het eerste lid, niet langer door de
      gemeente in stand worden gehouden, maximaal 4 maal het bedrag voor administratie, beheer en bestuur, op grond van
      [artikel 114, onderdeel e][ref4], en gedurende het derde, vierde en vijfde kalenderjaar maximaal 3 maal dat bedrag.

      3 Indien de gemeenteraad besluit scholen niet langer in stand te houden vanaf een andere datum dan 1 januari
      dan geldt als het eerste kalenderjaar, bedoeld in het tweede lid, het deel van het kalenderjaar dat volgt op de
      datum waarop de gemeente die scholen niet langer in stand houdt en bedraagt de vergoeding die voor dat eerste
      kalenderjaar maximaal kan worden toegekend voor administratie, beheer en bestuur een evenredig deel van de
      vergoeding die op grond van het tweede lid maximaal kan worden toegekend.

      4 Voor de toepassing van het tweede lid wordt per school uitgegaan van het leerlingenaantal, bedoeld in
      [artikel 134][ref5], zoals dat gold voor de berekening van het bedrag voor administratie, beheer en bestuur voor
      het kalenderjaar direct voorafgaand aan het tijdstip waarop door de gemeente de desbetreffende school niet langer
      in stand wordt gehouden en het prijspeil in dat kalenderjaar. De korting wegens rente-ontvangsten uit gevormde
      reserves van de programma's van eisen, bedoeld in [artikel 114, onderdelen a en d][ref6], blijft daarbij buiten
      beschouwing.

      5 De op grond van het eerste lid toe te kennen vergoeding kan in een kalenderjaar niet hoger zijn dan de in
      het daaraan voorafgaande kalenderjaar op grond van dit artikel toegekende vergoeding. De eerste volzin is niet
      van toepassing ten aanzien van de vergoeding voor het tweede kalenderjaar indien de vergoeding voor het eerste
      kalenderjaar is bepaald op grond van het derde lid. Bij de toepassing van de eerste volzin blijft het teruggestorte
      bedrag, bedoeld in het zevende lid, buiten beschouwing.

      6 Het bevoegd gezag dat een school als bedoeld in het eerste lid in stand houdt die voor die tijd door de gemeente
      in stand werd gehouden, legt aan die gemeente en aan de andere rechtspersonen die een of meer niet door de gemeente
      in stand gehouden scholen in die gemeente in stand houden, jaarlijks een verklaring van een accountant als bedoeld
      in [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref7] over met betrekking tot de uitgaven en
      ontvangsten voor administratie, beheer en bestuur.

      7 Voor zover voor een school als bedoeld in het eerste lid, de vergoeding, bedoeld in het eerste lid, vermeerderd
      met de vergoeding op grond van [artikel 114, onderdeel e][ref8], in een kalenderjaar niet volledig is aangewend
      voor uitgaven voor administratie, beheer en bestuur, wordt het verschil door het bevoegd gezag, bedoeld in het
      zesde lid, teruggestort in de gemeentekas.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel140
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel141
