    text: |-
      Indien de inspectie op basis van een onderzoek als bedoeld in [artikel 11][ref1] of
      [artikel 15 van de Wet op het onderwijstoezicht][ref2], in het inspectierapport, bedoeld in
      [artikel 20 van genoemde wet][ref3], tot het oordeel is gekomen dat sprake is van een zeer zwakke school,
      informeert het bevoegd gezag de ouders van de leerlingen van de school hierover door middel van in ieder geval
      de toezending van de door de inspectie opgestelde samenvatting van het inspectierapport welke samenvatting
      gelijktijdig met het inspectierapport ter beschikking is gesteld van het bevoegd gezag. De toezending, bedoeld in
      de eerste volzin, geschiedt binnen vier weken na de vaststelling van het inspectierapport.


