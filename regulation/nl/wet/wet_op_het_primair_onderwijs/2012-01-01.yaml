  - number: '109'
    text: |-
      Voorzieningen aan gebouwen of terreinen in verband met verhuur krachtens de [artikelen 108][ref1] of [110][ref2]
      door het bevoegd gezag van een niet door de gemeente in stand gehouden school komen niet ten laste van de gemeente.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel108
