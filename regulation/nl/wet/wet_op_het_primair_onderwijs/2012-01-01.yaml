  - number: '25'
    text: |-
      Een regionale verwijzingscommissie die door Onze minister is ingesteld, kan worden verbonden aan rechtspersonen
      die voldoen aan bij of krachtens algemene maatregel van bestuur te stellen voorwaarden en die daartoe door Onze
      minister zijn aangewezen.
    url: https://wetten.overheid.nl/BWBR0003420/2012-01-01#Artikel25
  - number: '27'
    text: |-
      1 Onze minister brengt een regionale verwijzingscommissie die is ingesteld, voor bekostiging in aanmerking indien
      zij:

      a. jaarlijks voor 1 mei verslag uitbrengt over haar werkzaamheden in het voorafgaande kalenderjaar, en

      b. jaarlijks voor 1 mei over het voorafgaande kalenderjaar rekening en verantwoording aflegt van het geldelijk
      beheer.

      2 Onze minister stelt jaarlijks, op basis van het aantal leerlingen in het basisonderwijs, bedoeld in
      [artikel 161][ref1] van de Wet op het primair onderwijs, van dat jaar in de desbetreffende regio, de bekostiging
      vast voor de werkzaamheden van de regionale verwijzingscommissie voor het daaropvolgende jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel161
