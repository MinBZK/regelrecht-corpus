  - number: '21'
    text: |-
      Indien verschillende bevoegde gezagsorganen samenwerken in een samenwerkingsverband zijn zij aangesloten bij
      dezelfde centrale dienst.
    url: https://wetten.overheid.nl/BWBR0003420/2012-01-01#Artikel21
  - number: '22'
    text: |-
      1 Onze minister stelt een landelijke geschillencommissie voor samenwerkingsverbanden in.

      2 De commissie bestaat uit een voorzitter en 4 leden, die allen door Onze minister worden benoemd. De 4 leden
      worden benoemd op voordracht van de gezamenlijke besturenorganisaties en de Vereniging van Nederlandse Gemeenten.
      De voorzitter is een jurist.

      3 De voorzitter en de leden worden benoemd voor een termijn van 4 jaar. Zij zijn opnieuw benoembaar. Op eigen
      verzoek wordt aan hen ontslag verleend.

      4 Het bevoegd gezag van een school kan voorziening vragen bij de landelijke geschillencommissie tegen

      a. beslissingen en andere handelingen inzake de totstandkoming van het reglement,

      b. beslissingen en andere handelingen in het kader van het samenwerkingsverband,

      c. de weigering van instemming door het bevoegd gezag van een speciale school voor basisonderwijs met een
      beslissing als bedoeld in [artikel 20, tweede lid onder a][ref1], en

      d. de weigering van instemming door het bevoegd gezag van een school met een beslissing als bedoeld in
      [artikel 20, tweede lid onder c][ref2].

      Het vragen van voorziening als bedoeld in de eerste volzin wordt gelijkgesteld met het instellen van administratief
      beroep.

      5 De uitspraak van de geschillencommissie is bindend voor de bevoegde gezagsorganen van de scholen in het
      samenwerkingsverband.

      6 Tegen de uitspraak van de geschillencommissie kan beroep worden ingesteld bij de Afdeling bestuursrechtspraak van
      de Raad van State. De uitspraak bedoeld in de eerste volzin wordt gelijkgesteld met een uitspraak in administratief
      beroep.

      7 Het reglement, bedoeld in [artikel 20][ref3], kan erin voorzien dat de in het vierde lid bedoelde geschillen
      worden voorgelegd aan een geschillencommissie die door het samenwerkingsverband, al dan niet tezamen met andere
      samenwerkingsverbanden is ingesteld. In dat geval is het vierde lid niet van toepassing en zijn het vijfde en zesde
      lid van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel20
      [ref3]: https://wetten.overheid.nl/BWBR0003420#Artikel20
