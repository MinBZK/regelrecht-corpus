  - number: '60'
    text: |-
      1 Het bevoegd gezag is aangesloten bij een commissie van beroep. Het personeel kan bij die commissie beroep
      instellen tegen een beslissing van het bevoegd gezag inhoudende:

      a. een disciplinaire maatregel;

      b. schorsing;

      c. het direct of indirect onthouden van promotie;

      d. het verminderen van de omvang van de betrekking;

      e. ontslag anders dan op eigen verzoek, voordat de pensioengerechtigde leeftijd is bereikt;

      f. de beslissing van het bevoegd gezag ten aanzien van een personeelslid op basis waarvan op termijn vermindering
      van diens betrekkingsomvang kan plaatsvinden;

      g. de beëindiging van een verlengd tijdelijk dienstverband;

      h. de aanwijzing als personeelslid boven de basisformatie voortvloeiend uit een algemeen verbindend voorschrift
      welke aanwijzing op termijn kan leiden tot ontslag, vermindering van de betrekkingsomvang of beëindiging van een
      verlengd tijdelijk dienstverband;

      i. de aanwijzing van een andere school of andere scholen waaraan een personeelslid werkzaamheden zal verrichten.

      2 Een beslissing als bedoeld in het vorige lid, aanhef, wordt schriftelijk aan de betrokkene medegedeeld. Daarbij
      wordt tevens vermeld de beroepstermijn en het adres van de commissie waar het beroep kan worden ingesteld.

      3 Het bevoegd gezag onderwerpt zich aan de uitspraak van de commissie.
    url: https://wetten.overheid.nl/BWBR0003420/2012-01-01#Artikel60
  - number: '61'
    text: |-
      1 Het beroep bedoeld in [artikel 60][ref1], wordt schriftelijk ingesteld binnen 6 weken, nadat de beslissing aan
      betrokkene is medegedeeld. Bij overschrijding van deze termijn ten gevolge van omstandigheden die de betrokkene
      niet kunnen worden verweten, laat de commissie niet-ontvankelijkverklaring op die grond achterwege.

      2 Tijdens de behandeling door de commissie van beroep loopt geen verjaring met betrekking tot rechtsvorderingen ter
      zake van beslissingen die aan het oordeel van de commissie zijn onderworpen.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel60
    url: https://wetten.overheid.nl/BWBR0003420/2012-01-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '60'
        hoofdstuk: I
        afdeling: '3'
  - number: '62'
    text: |-
      1 Een commissie van beroep strekt haar werkzaamheden uit over ten minste 50 bijzondere scholen. Onze minister kan
      dit aantal lager stellen.

      2 Tot scholen bedoeld in het eerste lid, kunnen ook scholen voor speciaal onderwijs, voortgezet speciaal onderwijs,
      of speciaal en voortgezet speciaal onderwijs, instellingen voor speciaal en voortgezet speciaal onderwijs en
      scholen voor voortgezet onderwijs behoren.

      3 De commissie bestaat uit 5 leden en 5 plaatsvervangende leden, waarvan 2 leden en 2 plaatsvervangende leden
      worden gekozen door het bevoegd gezag en 2 leden en 2 plaatsvervangende leden door het personeel van de aangesloten
      scholen. Deze 4 leden kiezen het vijfde lid, tevens voorzitter, en diens plaatsvervanger.

      4 De leden en plaatsvervangende leden mogen niet behoren tot het bevoegd gezag of het personeel van een aangesloten
      school of tot de inspectie van het onderwijs.

      5 Bij algemene maatregel van bestuur worden nadere voorschriften gegeven omtrent de samenstelling en de werkwijze
      van de commissie van beroep.
    url: https://wetten.overheid.nl/BWBR0003420/2012-01-01#Artikel62
  - number: '63'
    text: |-
      1 Indien het bevoegd gezag van een bijzondere school op grond van [artikel 36, derde lid][ref1], een student de
      toegang weigert, deelt het deze beslissing, schriftelijk en met redenen omkleed, mede door toezending of uitreiking
      aan de student, onverminderd het bepaalde in dat artikellid.

      2 Indien het bevoegd gezag van een bijzondere school op grond van [artikel 40][ref2] weigert een leerling toe te
      laten dan wel een leerling verwijdert, deelt het de beslissing daartoe, schriftelijk en met redenen omkleed, mede
      door toezending of uitreiking aan de ouders. Daarbij wordt tevens de inhoud van het bepaalde in het derde lid,
      eerste volzin, vermeld. Voordat het bevoegd gezag van een bijzondere school op grond van dat artikellid beslist tot
      verwijdering van een leerling, hoort het de ouders van de leerling, onverminderd het bepaalde in dat artikellid.
      Het bevoegd gezag neemt de beslissing, bedoeld in de eerste volzin, zo spoedig mogelijk, met dien verstande dat de
      beslissing over de toelating van een leerling voor wie een leerlinggebonden budget beschikbaar is uiterlijk drie
      maanden na ontvangst van het verzoek tot toelating wordt genomen.

      3 Binnen 6 weken na de mededeling, bedoeld in het tweede lid, kunnen de ouders bij het bevoegd gezag schriftelijk
      hun bezwaren kenbaar maken tegen de beslissing. Het bevoegd gezag beslist binnen 4 weken na ontvangst van de
      bezwaren. Alvorens te beslissen hoort het bevoegd gezag de ouders.


