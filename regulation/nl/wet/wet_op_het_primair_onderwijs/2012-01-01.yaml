  - number: '125'
    text: |-
      1 Het bevoegd gezag van alle scholen in een samenwerkingsverband dan wel, indien verschillende bevoegde
      gezagsorganen samenwerken in het verband, het bestuur van de centrale dienst draagt per leerling een bij
      ministeriële regeling vast te stellen bedrag over aan de speciale school voor basisonderwijs, welk bedrag wordt
      verhoogd met een bedrag dat wordt vermenigvuldigd met de geraamde landelijk gewogen gemiddelde leeftijd van leraren
      van speciale scholen voor basisonderwijs indien

      a. de speciale school voor basisonderwijs een leerling toelaat van een basisschool in het desbetreffende
      samenwerkingsverband,

      b. de speciale school geen deel uitmaakt van het desbetreffende samenwerkingsverband, en

      c. de permanente commissie leerlingenzorg van het desbetreffende samenwerkingsverband heeft bepaald dat de leerling
      op het onderwijs van een speciale school voor basisonderwijs is aangewezen.

      2 Het bedrag per leerling, bedoeld in het eerste lid, en het vermenigvuldigingsbedrag van de verhoging, bedoeld in
      het eerste lid, zijn de uitkomst van een bij algemene maatregel van bestuur vast te stellen hoeveelheid formatie
      per leerling vermenigvuldigd met een bedrag. Bij de vaststelling van de bedragen wordt in ieder geval rekening
      gehouden met de ontwikkeling van de geraamde landelijk gewogen gemiddelde leeftijd en de genormeerde gemiddelde
      personeelslast van leraren van speciale scholen voor basisonderwijs. In de algemene maatregel van bestuur, bedoeld
      in de vorige volzin, kan voor de verschillende schooljaren en afhankelijk van het moment van de toelating tot de
      speciale school voor basisonderwijs een verschillende hoeveelheid formatie worden vastgesteld.

      3 De in het eerste lid bedoelde overdracht vindt voor het eerst plaats voor het schooljaar volgend op het
      schooljaar van de toelating tot de speciale school voor basisonderwijs.

      4 De in het eerste lid bedoelde overdracht vindt niet plaats als de toelating plaatsvindt binnen 6 maanden voor
      of na een verhuizing van de ouders van een woning buiten het gebied van het samenwerkingsverband van de speciale
      school voor basisonderwijs naar een woning binnen dat gebied.

      5 De overdracht, bedoeld in het eerste lid, eindigt met ingang van het schooljaar dat volgt op het schooljaar
      waarin de leerling de speciale school voor basisonderwijs verlaat.

      6 [Artikel 124, zesde en zevende lid][ref1], is van overeenkomstige toepassing op de overdrachtsverplichting,
      bedoeld in het eerste lid, met dien verstande dat ook speciale scholen voor basisonderwijs een aandeel kunnen
      hebben in de overdrachtsverplichting.


