        paragraaf: '1'
        afdeling: '1'
  - number: 64b
    text: |-
      1 De rechtspersoon dient dan wel de rechtspersonen gezamenlijk dienen een aanvraag in bij Onze minister voor het
      verkrijgen van de goedkeuring, bedoeld in [artikel 64a, eerste lid][ref1]. De aanvraag gaat vergezeld van:

      a. een door de rechtspersoon dan wel rechtspersonen opgestelde fusie-effectrapportage, en

      b. een schriftelijke verklaring van instemming met de fusie door de medezeggenschapsraden dan wel de
      gemeenschappelijke medezeggenschapsraden, dan wel

      c. de bindende uitspraak van de geschillencommissie, bedoeld in
      [artikel 32, derde lid, van de Wet medezeggenschap op scholen][ref2], dan wel de bindende uitspraak van de
      ondernemingskamer, bedoeld in [artikel 36, derde lid, van de Wet medezeggenschap op scholen][ref3].

      2 De fusie-effectrapportage bevat ten minste een weergave van:

      a. de motieven voor de fusie,

      b. de alternatieven voor de fusie,

      c. het tijdsbestek waarbinnen de fusie zal worden gerealiseerd,

      d. de te bereiken doelen,

      e. de effecten van de fusie op de keuzevrijheid, in het bijzonder de effecten van de fusie op de spreiding en
      omvang van de rechtspersonen en scholen in het voedingsgebied en de onderwijskundige en bestuurlijke diversiteit
      van het onderwijsaanbod in het voedingsgebied,

      f. de kosten en baten van de fusie,

      g. de gevolgen van de fusie voor het personeel en leerlingen, waaronder begrepen de gevolgen voor de voorzieningen,

      h. de wijze waarop over de fusie wordt gecommuniceerd,

      i. de wijze waarop de fusie wordt geëvalueerd, en

      j. een advies van burgemeester en wethouders van de betrokken gemeenten over de wenselijkheid van de voorgestelde
      fusie.

      3 Bij ministeriële regeling wordt een modelformulier voor de fusie-effectrapportage vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel64a
      [ref2]: https://wetten.overheid.nl/BWBR0020685#Artikel32
      [ref3]: https://wetten.overheid.nl/BWBR0020685#Artikel36
