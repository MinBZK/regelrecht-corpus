        paragraaf: '1'
        afdeling: '1'
  - number: '48'
    text: |-
      1 Een gemeenteraad kan besluiten dat een of meer openbare scholen in de gemeente in stand worden gehouden door
      een stichting die zich ten doel stelt het in stand houden van een of meer openbare scholen, al dan niet te zamen
      met openbare scholen als bedoeld in de [Wet op de expertisecentra][ref1] of openbare scholen als bedoeld in de
      [Wet op het voortgezet onderwijs][ref2].

      2 De gemeenteraad maakt het voornemen tot een besluit als bedoeld in het eerste lid bekend.

      3 Een stichting die een openbare school in stand houdt, wordt opgericht door een of meer gemeenten, al dan niet te
      zamen met een of meer privaatrechtelijke rechtspersonen met volledige rechtsbevoegdheid.

      4 Het statutaire doel van de stichting is uitsluitend het geven van openbaar onderwijs overeenkomstig artikel 46.

      5 De stichting oefent met uitzondering van de besluitvorming over de opheffing van een openbare school alle taken
      en bevoegdheden van het bevoegd gezag uit.

      6 Onverminderd het vierde lid voorzien de statuten in ieder geval in een regeling omtrent:

      a. de samenstelling, werkwijze en inrichting van het bestuur van de stichting,

      b. de wijze van benoeming, herbenoeming, schorsing en ontslag van de bestuursleden, met dien verstande dat de
      leden van het bestuur worden benoemd door de gemeenteraad of gemeenteraden en dat ten minste een derde gedeelte,
      doch geen meerderheid, van die leden wordt benoemd op bindende voordracht van de ouders van de leerlingen die zijn
      ingeschreven op de betrokken school of scholen,

      c. de termijn waarvoor de bestuursleden worden benoemd,

      d. de vaststelling van de begroting na goedkeuring door de desbetreffende gemeenteraad of gemeenteraden en de
      vaststelling van de jaarrekening na instemming van de desbetreffende gemeenteraad of gemeenteraden,

      e. de wijze waarop de gemeenteraad of gemeenteraden toezicht op het bestuur uitoefenen,

      f. de gronden waarop het bestuur kan besluiten de vergaderingen besloten te houden,

      g. de periode waarvoor de stichting in het leven wordt geroepen, met dien verstande dat deze periode ten minste 5
      jaren bedraagt, en

      h. de bevoegdheid de stichting te ontbinden, met dien verstande dat in de regeling een overheersende invloed van de
      overheid in het bestuur is verzekerd.

      De goedkeuring bedoeld in onderdeel d kan worden onthouden wegens strijd met het recht of met het algemeen belang,
      waaronder begrepen het financiële belang van de gemeente.

      7 De statuten van de stichting kunnen slechts worden gewijzigd na instemming van de desbetreffende gemeenteraad
      of gemeenteraden.

      8 Het bestuur brengt jaarlijks aan de gemeenteraad of gemeenteraden verslag uit over de werkzaamheden, waarbij in
      ieder geval aandacht wordt geschonken aan de wezenskenmerken van het openbaar onderwijs. Het verslag wordt openbaar
      gemaakt.

      9 De vergaderingen van het bestuur van de stichting zijn openbaar, tenzij het bestuur anders beslist, op gronden,
      vermeld in de statuten.

      10 Indien voor 1 februari van het jaar waarvoor de begroting geldt, de begroting niet is goedgekeurd, neemt de
      gemeenteraad of gemeenteraden de maatregelen die zij nodig achten om de continuïteit van het onderwijsproces te
      waarborgen.

      11 De gemeenteraad of gemeenteraden zijn in geval van ernstige taakverwaarlozing door het bestuur of functioneren
      in strijd met de wet bevoegd zelf te voorzien in het bestuur van de scholen en zo nodig de stichting te ontbinden.

      12 Indien de school een raad van toezicht heeft, is het zesde lid niet van toepassing en voorzien de statuten,
      onverminderd [artikel 17c][ref3], in ieder geval in een regeling omtrent:

      a. de samenstelling, werkwijze en inrichting van de raad van toezicht van de stichting,

      b. de wijze van benoeming, herbenoeming, schorsing en ontslag van de leden van de raad van toezicht, met dien
      verstande dat de leden van de raad van toezicht worden benoemd door de gemeenteraad of gemeenteraden en dat ten
      minste een derde gedeelte, doch geen meerderheid, van die leden wordt benoemd op bindende voordracht van de ouders
      van de leerlingen die zijn ingeschreven op de betrokken school of scholen,

      c. de termijn waarvoor de leden van de raad van toezicht worden benoemd,

      d. de vaststelling van de begroting en de jaarrekening, en

      e. de periode waarvoor de stichting in het leven wordt geroepen, met dien verstande dat deze periode ten minste 5
      jaren bedraagt,

      h. de bevoegdheid de stichting te ontbinden, met dien verstande dat in de regeling een overheersende invloed
      van de overheid in de raad van toezicht is verzekerd. Het achtste, negende en elfde lid zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003549
      [ref2]: https://wetten.overheid.nl/BWBR0002399
      [ref3]: https://wetten.overheid.nl/BWBR0003420#Artikel17c
