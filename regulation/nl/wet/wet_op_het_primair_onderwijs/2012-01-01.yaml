      1 Wanneer het college van burgemeester en wethouders een krachtens deze wet gevorderde beslissing niet of niet naar
      behoren neemt dan wel een krachtens deze wet gevorderde handeling niet of niet naar behoren verricht, besluit Onze
      Minister daarin te voorzien ten laste van de gemeente.

      2 Het eerste lid vindt geen toepassing dan nadat het college van burgemeester en wethouders in de gelegenheid is
      gesteld binnen een door Onze Minister gestelde termijn alsnog de in het eerste lid bedoelde taken uit te voeren.
    url: https://wetten.overheid.nl/BWBR0003420/2012-01-01#Artikel170
  - number: '171'
    text: |-
      1 Het bevoegd gezag stelt jaarlijks een jaarverslag over het voorafgaande kalenderjaar vast. Op deze
      jaarverslaggeving is [Boek 2, titel 9, van het Burgerlijk Wetboek][ref1], met uitzondering van de afdelingen 1,
      11 en 12, van overeenkomstige toepassing voor zover bij of krachtens algemene maatregel van bestuur niet anders is
      bepaald. Het jaarverslag bestaat tenminste uit de volgende onderdelen:

      a. een bestuursverslag als bedoeld in [artikel 391 Boek 2 van het Burgerlijk Wetboek][ref2] waarin de door het
      bevoegd gezag gehanteerde code voor goed bestuur wordt vermeld alsmede ten minste verantwoording wordt afgelegd
      over de afwijkingen van die code voor goed bestuur,

      b. een jaarrekening als bedoeld in [artikel 361 van Boek 2 van het Burgerlijk Wetboek][ref3], met daarbij ingevolge
      het derde lid vast te stellen bijlagen,

      c. overige gegevens als bedoeld in [artikel 392 van Boek 2 van het Burgerlijk Wetboek][ref4].

      2 Bij algemene maatregel van bestuur kan worden bepaald welke onderdelen het jaarverslag tevens dient te bevatten,
      dan wel welke onderdelen komen te vervallen.

      3 Bij of krachtens algemene maatregel van bestuur kan een nadere invulling worden gegeven aan de onderdelen,
      bedoeld in het eerste en tweede lid, en kunnen nadere voorschriften worden gegeven over:

      a. de indeling en de wijze van ordening van de gegevens per onderdeel van het jaarverslag,

      b. de wijze en het tijdstip waarop de desbetreffende onderdelen beschikbaar gesteld worden,

      c. de elektronische verzending van het cijfermatige deel uit de jaarrekening, en

      d. de grondslagen voor de jaarrekening.

      4 De beschikbaarstelling van de gegevens, bedoeld in het derde lid, onder b, gaat vergezeld van een verklaring
      omtrent de getrouwheid en rechtmatigheid, afgegeven door een door de toezichthouder of het toezichthoudend orgaan
      aangewezen accountant als bedoeld in [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref5]. Bij de
      aanwijzing van de accountant bedingt de toezichthouder of het toezichthoudend orgaan dat de controle overeenkomstig
      een door Onze minister vast te stellen controleprotocol plaatsvindt en dat aan Onze minister op diens verzoek
      inzicht wordt geboden in de controlerapporten van de accountant.

      5 De code voor goed bestuur, bedoeld in het eerste lid, onderdeel a, bevat ten minste bepalingen over de wijze
      waarop invulling wordt gegeven aan

      a. een beleid dat de eigen deskundigheid en verantwoordelijkheid van het personeel voor de kwaliteit van het
      onderwijs tot haar recht komt,

      b. een integere bedrijfsvoering, waaronder voorzieningen om verstrengeling van belangen tegen te gaan, en

      c. afstemming met en verantwoording aan de ouders en andere belanghebbenden binnen en buiten de school.

      6 Bij algemene maatregel van bestuur kan een code voor goed bestuur worden aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0003045
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel391
