  - number: '11'
    text: Het bevoegd gezag rapporteert over de vorderingen van de leerlingen aan hun ouders.
    url: https://wetten.overheid.nl/BWBR0003420/2012-01-01#Artikel11
  - number: '12'
    text: |-
      1 Het schoolplan bevat een beschrijving van het beleid met betrekking tot de kwaliteit van het onderwijs dat binnen
      de school wordt gevoerd, en omvat in elk geval het onderwijskundig beleid, het personeelsbeleid en het beleid met
      betrekking tot de bewaking en verbetering van de kwaliteit van het onderwijs. Het schoolplan omvat mede het beleid
      ten aanzien van de aanvaarding van materiële bijdragen of geldelijke bijdragen, niet zijnde ouderbijdragen of op
      de onderwijswetgeving gebaseerde bijdragen, indien het bevoegd gezag daarbij verplichtingen op zich neemt waarmee
      de leerlingen binnen de schooltijden en tijdens de activiteiten die worden georganiseerd onder verantwoordelijkheid
      van het bevoegd gezag, alsmede tijdens het overblijven, zullen worden geconfronteerd. In het schoolplan wordt
      aangegeven op welke wijze invulling wordt gegeven aan het openbare karakter onderscheidenlijk de identiteit voor
      zover het betreft een samenwerkingsschool. Het schoolplan kan op een of meer scholen voor basisonderwijs en een of
      meer scholen voor ander onderwijs van hetzelfde bevoegd gezag betrekking hebben.

      2 Het onderwijskundig beleid omvat in elk geval de uitwerking van de wettelijke opdrachten voor het onderwijs
      en van de door het bevoegd gezag in het schoolplan opgenomen eigen opdrachten voor het onderwijs in een
      onderwijsprogramma. Daarbij worden tevens betrokken de voorzieningen die zijn getroffen voor leerlingen met
      specifieke onderwijsbehoeften en voor leerlingen voor wie een leerlinggebonden budget beschikbaar is.

      3 Het personeelsbeleid, voor zover dat in het schoolplan tot uitdrukking wordt gebracht, omvat in elk geval
      maatregelen met betrekking tot het personeel die bijdragen aan de ontwikkeling en de uitvoering van het
      onderwijskundig beleid alsmede het document inzake evenredige vertegenwoordiging van vrouwen in de schoolleiding,
      bedoeld in [artikel 30][ref1] van de wet.

      4 Het beleid met betrekking tot de bewaking en verbetering van de kwaliteit van het onderwijs omvat in elk geval:

      a. de wijze waarop het bevoegd gezag bewaakt dat die kwaliteit wordt gerealiseerd,

      b. de wijze waarop het bevoegd gezag vaststelt welke maatregelen ter verbetering van de kwaliteit nodig zijn, en

      c. maatregelen en instrumenten om te waarborgen dat het personeel zijn bekwaamheid onderhoudt.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel30
