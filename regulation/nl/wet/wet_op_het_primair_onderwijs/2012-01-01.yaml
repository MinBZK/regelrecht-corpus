  - number: 163b
    text: |-
      1 Indien sprake is van wanbeheer van een of meer bestuurders of toezichthouders kan Onze minister de rechtspersoon
      die de school in stand houdt een aanwijzing geven. Een aanwijzing omvat een of meer maatregelen en is evenredig aan
      het doel waarvoor zij wordt gegeven.

      2 Onder wanbeheer wordt uitsluitend verstaan:

      a. financieel wanbeleid,

      b. ongerechtvaardigde verrijking, al dan niet beoogd, van de rechtspersoon die de school in stand houdt, zichzelf
      dan wel een derde of

      c. onrechtmatig handelen, waaronder wordt verstaan het in de hoedanigheid van bestuurder of toezichthouder handelen
      in strijd met wettelijke bepalingen of de kennelijke geest van wettelijke bepalingen waarmee financieel voordeel
      wordt behaald ten gunste van de rechtspersoon die de school in stand houdt, zichzelf of een derde, en

      d. het in ernstige mate verwaarlozen van de zorg voor wat door redelijkheid en billijkheid wordt gevorderd in de
      omgang met betrokkenen in de schoolorganisatie, waaronder wordt verstaan intimidatie of bedreiging van personeel,
      leerlingen of ouders door een bestuurder of toezichthouder.

      3 In de aanwijzing geeft Onze minister met redenen omkleed aan op welke punten sprake is van wanbeheer alsmede de
      in verband daarmee te nemen maatregelen.

      4 Een aanwijzing bevat de termijn waarbinnen het bevoegd gezag aan de aanwijzing moet voldoen.

      5 Alvorens Onze minister een aanwijzing als bedoeld in het eerste lid geeft:

      a. heeft de inspectie een onderzoek als bedoeld in [artikel 11][ref1] of
      [artikel 15 van de Wet op het onderwijstoezicht][ref2] verricht;

      b. heeft de inspectie daarover een inspectierapport als bedoeld in
      [artikel 20, eerste lid, van de Wet op het onderwijstoezicht][ref3] uitgebracht; en

      c. stelt Onze minister de rechtspersoon vervolgens vier weken in de gelegenheid zijn zienswijze met betrekking tot
      de aanwijzing naar voren te brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0013800#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0013800#Artikel20
