  - number: '78'
    text: |-
      Bij de berekening van het aantal leerlingen dat een openbare of een bijzondere school zal bezoeken, worden
      niet meegeteld leerlingen die wonen binnen redelijke afstand van een openbare school, onderscheidenlijk van een
      bijzondere school van de desbetreffende richting of richtingen en voor wie op die school plaatsruimte aanwezig is.
    url: https://wetten.overheid.nl/BWBR0003420/2012-01-01#Artikel78
  - number: '79'
    text: |-
      1 Aan het plan wordt toegevoegd een overzicht van de verzoeken die niet zijn ingewilligd en de motivering daarvan.
      In het plan wordt aangegeven op welke wijze [artikel 78][ref1] ten aanzien van de op het plan geplaatste scholen
      is toegepast. Deze stukken worden door de gemeenteraad binnen 2 weken na de vaststelling van het plan aan alle
      verzoekers gezonden met vermelding van de datum waarop het plan ter goedkeuring aan Onze minister is gezonden. Het
      plan wordt gedurende 6 weken ter inzage gelegd in het gemeentehuis.

      2 Binnen 2 weken na de vaststelling wordt het plan ter goedkeuring aan Onze minister gezonden. Het gaat vergezeld
      van de ingewilligde verzoeken en de stukken genoemd in het eerste lid. Indien de bij het verzoek gevoegde gegevens
      onvoldoende zijn om het verzoek te kunnen beoordelen, deelt Onze minister voor 15 september volgend op de in de
      eerste volzin bedoelde datum aan burgemeester en wethouders mede dat de gegevens voor 15 oktober daaropvolgend
      dienen te worden aangevuld. Indien de aanvullende gegevens niet voor 15 oktober zijn verstrekt, wordt het verzoek
      buiten behandeling gelaten.

      3 Onze minister besluit voor 1 januari voorafgaande aan de planperiode. Afschrift van het besluit wordt binnen 2
      weken aan de gemeenteraad gezonden. Indien Onze minister niet voor 1 januari heeft besloten, wordt het plan geacht
      te zijn goedgekeurd.

      4 Onze minister onthoudt zijn goedkeuring voor zover:

      a. de in [artikel 75,][ref2] tweede lid eerste volzin, omschreven situatie zich voordoet en geen openbare school in
      het plan werd opgenomen;

      b. 1°. op grond van de bij het verzoek om goedkeuring overgelegde gegevens niet aannemelijk is dat een school
      overeenkomstig de [artikelen 77][ref3] en [78][ref4] zal worden bezocht door het ingevolge [artikel 77][ref5]
      vereiste aantal leerlingen, dan wel

      2°. indien het in een zodanig geval betreft een openbare school de stichting daarvan niet noodzakelijk is, omdat de
      in [artikel 75, tweede lid eerste volzin][ref6], omschreven situatie zich niet voordoet;

      c. 1°. wegens een in het plan opgenomen andere school of een in een plan van een andere gemeente opgenomen
      school, die voor bekostiging in aanmerking zal worden gebracht, niet aannemelijk is dat een school overeenkomstig
      de [artikelen 77][ref7] en [78][ref8] zal worden bezocht door het ingevolge [artikel 77][ref9] vereiste aantal
      leerlingen, dan wel

      2°. indien het in een zodanig geval betreft een openbare school de stichting daarvan niet noodzakelijk is, omdat de
      in [artikel 75, tweede lid eerste volzin][ref10], omschreven situatie zich niet meer zal voordoen;

      d. niet is voldaan aan het bij en krachtens deze wet bepaalde met betrekking tot de prognoses;

      e. is uitgegaan van kennelijk ondeugdelijke prognoses, of

      f. ten aanzien van een op het plan geplaatste school ten onrechte niet is bepaald dat zij voor bekostiging in
      aanmerking komt bij de aanvang van het eerste schooljaar van de planperiode.

      5 Bij onthouding van de goedkeuring op grond van het vierde lid onder a, draagt Onze minister de gemeenteraad op
      alsnog een openbare school in het plan op te nemen. Indien goedkeuring wordt onthouden op grond van het vierde
      lid onder f draagt Onze minister de gemeenteraad op in het plan alsnog te vermelden dat de betrokken school bij de
      aanvang van het eerste schooljaar van de planperiode voor bekostiging in aanmerking komt.

      6 Indien ten gevolge van een besluit van Onze minister op grond van het vierde lid een school uit het plan moet
      vervallen, maakt Onze minister dit besluit binnen 2 weken bekend aan de indiener van het verzoek om opneming in het
      plan van de betrokken school.

      7 Indien tegen een besluit van Onze minister als bedoeld in het zesde lid beroep is ingesteld en de uitspraak dan
      wel het naar aanleiding daarvan genomen besluit van Onze minister strekt tot het voor bekostiging in aanmerking
      brengen van de school, neemt de gemeenteraad de school op in het na de uitspraak onderscheidenlijk het besluit vast
      te stellen plan.

      8 Zodra de bekostiging van een in het plan opgenomen school een aanvang kan nemen, maakt Onze minister dit bekend
      aan het bevoegd gezag.


