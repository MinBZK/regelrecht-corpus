  - number: '121'
    text: |-
      1 Voor de toepassing van [artikel 120, eerste lid][ref1], geldt het aantal leerlingen van de school op 1 oktober
      van het voorafgaande schooljaar.

      2 Voor de toepassing van [artikel 120, eerste lid][ref2], voor het schooljaar waarin een nieuwe school wordt
      geopend en voor het daaropvolgende schooljaar geldt het aantal leerlingen van de school op 1 oktober volgende op
      de opening.

      3 Voor de toepassing van [artikel 120, eerste lid][ref3], geldt ingeval van samenvoeging van scholen het aantal
      leerlingen van alle bij de samenvoeging betrokken scholen, voor elke school vastgesteld volgens het eerste lid, en
      de gewogen gemiddelde leeftijd van de leraren van alle bij de samenvoeging betrokken scholen op 1 oktober van het
      voorafgaande schooljaar.


