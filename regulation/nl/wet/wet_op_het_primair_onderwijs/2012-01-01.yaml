      1 [Artikel 138][ref1] is van overeenkomstige toepassing indien de rechtspersoon, bedoeld in [artikel 68][ref2],
      personeel benoemt met voorbijgaan van gewezen personeel als bedoeld in [artikel 138, eerste en vijfde lid][ref3],
      van de rechtspersoon of van een bevoegd gezag waarvoor diensten worden verricht, dan wel niet handelt
      overeenkomstig het bepaalde in laatstgenoemde artikelleden. Van het gewezen personeel, bedoeld in de eerste volzin,
      is uitgezonderd het personeel van het bevoegd gezag waarvoor diensten worden verricht, waarvan de dienstbetrekking
      is beëindigd op een tijdstip dat meer dan twee jaar ligt voor de aanvang van de dienstverlening.

      2 In geval van toepassing van het eerste lid wordt het in mindering te brengen bedrag in gelijke mate verdeeld over
      de scholen waarvoor diensten worden verricht.

      3 [Artikel 138][ref4] is eveneens van overeenkomstige toepassing

      a. indien een bevoegd gezag waarvoor diensten worden verricht, personeel benoemt met voorbijgaan van gewezen
      personeel van de rechtspersoon, bedoeld in [artikel 68][ref5], en

      b. indien een bevoegd gezag waarvoor geen diensten meer worden verricht, in het tijdvak van vijf jaar na
      beëindiging van de dienstverlening personeel benoemt met voorbijgaan van gewezen personeel als bedoeld in onderdeel
      a.

      4 [Artikel 138, derde lid][ref6], is van overeenkomstige toepassing indien de rechtspersoon, bedoeld in
      [artikel 68][ref7], personeel ontslaat zonder voorafgaande instemming van de rechtspersoon, bedoeld in
      [artikel 184][ref8], met dien verstande dat het in mindering te brengen bedrag in gelijke mate wordt verdeeld over
      de bevoegde gezagsorganen waarvan de rechtspersoon, bedoeld in [artikel 68][ref9], uitgaat.


