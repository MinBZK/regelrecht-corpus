  - number: '114'
    text: |-
      De programma's van eisen, bedoeld in [artikel 113, derde lid][ref1], worden onderverdeeld in programma's van eisen
      omtrent:

      a. onderhoud,

      b. energie- en waterverbruik,

      c. publiekrechtelijke heffingen, met uitzondering van de belastingen ter zake van onroerende zaken,

      d. middelen, en

      e. administratie, beheer en bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel113
    url: https://wetten.overheid.nl/BWBR0003420/2012-01-01#Artikel114
