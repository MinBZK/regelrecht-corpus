  - number: '20'
    text: |-
      1 Indien verschillende bevoegde gezagsorganen samenwerken in een samenwerkingsverband stellen zij een reglement
      vast. Het reglement bevat in elk geval een regeling voor:

      a. de wijze waarop het zorgplan, bedoeld in [artikel 19][ref1], wordt vastgesteld,

      b. de wijze waarop over het zorgplan in het kader van de medezeggenschap overleg plaatsvindt,

      c. de wijze waarop over arbeidsvoorwaardelijke aspecten van het zorgplan decentraal georganiseerd overleg wordt
      gevoerd,

      d. de wijze waarop wordt bepaald of de situaties, bedoeld in de [artikelen 118][ref2] en [124][ref3], zich
      voordoen, waaronder de vaststelling van de in [artikel 124, eerste en tweede lid][ref4], bedoelde peildatum, die is
      gelegen in de periode van 2 oktober tot en met 31 juli daaropvolgend,

      e. de wijze waarop wordt vastgesteld wat het aandeel van de onderscheiden scholen is in de overdracht van
      de bekostiging voor materiële instandhouding in een situatie als bedoeld in [artikel 118][ref5] en van de
      bekostiging voor zorgvoorzieningen in een situatie als bedoeld in [artikel 124, zesde of zevende lid][ref6], of
      [artikel 125, zesde lid][ref7], en

      f. de wijze waarop beslissingen worden genomen, onverminderd het tweede lid, alsmede het aantal stemmen voor elk
      afzonderlijk bevoegd gezag.

      2 Bij reglement kan met inachtneming van de tweede volzin, onderdelen a, b en c, per onderwerp verschillend de
      wijze van beslissen worden geregeld. Indien voor een onderwerp geen wijze van beslissen is geregeld, geschiedt de
      wijze van beslissen bij meerderheid van stemmen, met dien verstande dat

      a. voor een beslissing over de inzet van de bekostiging voor zorgvoorzieningen, bedoeld in
      [artikel 120, vierde lid][ref8], tevens de instemming is vereist van de bevoegde gezagsorganen van alle speciale
      scholen voor basisonderwijs in het samenwerkingsverband,

      b. voor een beslissing tot samenvoeging van 2 of meer speciale scholen voor basisonderwijs tevens de instemming is
      vereist van de bevoegde gezagsorganen van de desbetreffende scholen, en

      c. voor een beslissing tot wijziging van het reglement of tot algehele samenvoeging van het verband met een ander
      verband in plaats van meerderheid van stemmen de instemming is vereist van de bevoegde gezagsorganen van alle
      scholen in het samenwerkingsverband.


