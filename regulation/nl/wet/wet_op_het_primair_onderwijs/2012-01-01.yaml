  - number: '9'
    text: |-
      1 Het onderwijs omvat, waar mogelijk in samenhang:

      a. zintuiglijke en lichamelijke oefening;

      b. Nederlandse taal;

      c. rekenen en wiskunde;

      d. Engelse taal;

      e. enkele kennisgebieden;

      f. expressie-activiteiten;

      g. bevordering van sociale redzaamheid, waaronder gedrag in het verkeer;

      h. bevordering van gezond gedrag.

      2 Bij de kennisgebieden wordt in elk geval aandacht besteed aan:

      a. aardrijkskunde;

      b. geschiedenis;

      c. de natuur, waaronder biologie;

      d. maatschappelijke verhoudingen, waaronder staatsinrichting;

      e. geestelijke stromingen.

      3 Het onderwijs kan naast de onderwijsactiviteiten, genoemd in het eerste en tweede lid, tevens de Duitse taal of
      de Franse taal omvatten.

      4 Op de scholen in de provincie Fryslân wordt tevens onderwijs gegeven in de Friese taal, tenzij gedeputeerde
      staten op verzoek van het bevoegd gezag ontheffing van deze verplichting hebben verleend.

      5 Ten aanzien van de onderwijsactiviteiten, genoemd in het eerste, tweede en vierde lid, worden bij algemene
      maatregel van bestuur kerndoelen vastgesteld. De algemene maatregel van bestuur bedoeld in de vorige volzin, wordt
      aan de beide Kamers der Staten-Generaal overgelegd. De maatregel treedt niet in werking dan nadat 4 weken na de
      overlegging zijn verstreken en gedurende die termijn niet door of namens een van beide Kamers de wens wordt te
      kennen gegeven dat het in die maatregel geregelde onderwerp bij de wet wordt geregeld. Alsdan wordt een daartoe
      strekkend wetsvoorstel zo spoedig mogelijk ingediend.

      6 Voor de school geldt de eis dat zij tenminste de kerndoelen bij haar onderwijsactiviteiten als aan het eind
      van het basisonderwijs te bereiken doelstellingen hanteert. Kerndoelen geven een beschrijving van kwaliteiten van
      leerlingen op het gebied van kennis, inzicht en vaardigheden. Indien de eerste volzin niet kan worden toegepast
      voor een leerling voor wie een leerlinggebonden budget beschikbaar is dan wel voor een visueel gehandicapte
      leerling, wordt in het handelingsplan, bedoeld in [artikel 40a][ref1], aangegeven wat daarvan de reden is en welke
      vervangende onderwijsdoelen worden gehanteerd.

      7 Indien een bevoegd gezag van een bijzondere school dringend bedenkingen heeft tegen de krachtens het vijfde lid
      vastgestelde kerndoelen, kan het bevoegd gezag eigen kerndoelen voor de school vaststellen. Deze kerndoelen zijn
      van gelijk niveau als de kerndoelen, bedoeld in het vijfde lid. Het bevoegd gezag zendt de vastgestelde kerndoelen
      aan de inspecteur.

      8 Bij de verzorging van het onderwijs op basis van de kerndoelen voor Nederlandse taal en
      rekenen en wiskunde, neemt het bevoegd gezag, met inachtneming van [artikel 8, eerste lid][ref2],
      de referentieniveaus Nederlandse taal en de referentieniveaus rekenen, bedoeld in
      [artikel 2, tweede lid, aanhef en onderdeel a, van de Wet referentieniveaus Nederlandse taal en rekenen][ref3],
      als uitgangspunt.

      9

      10 Het onderwijs wordt gegeven in het Nederlands. Daar waar naast de Nederlandse taal, de Friese taal of een
      streektaal in levend gebruik is, kan de Friese taal of de streektaal mede als voertaal bij het onderwijs worden
      gebruikt. Voor de opvang in en de aansluiting bij het Nederlandse onderwijs van leerlingen met een niet-Nederlandse
      culturele achtergrond kan de taal van het land van oorsprong mede als voertaal bij het onderwijs worden gebruikt,
      overeenkomstig een door het bevoegd gezag vastgestelde gedragscode.

      11 Onze minister kan in bijzondere gevallen op verzoek van het bevoegd gezag toestaan dat wordt afgeweken van
      de voorschriften in het eerste en tweede lid. De toestemming wordt verleend voor een bepaald tijdvak; zij kan
      voorwaarden bevatten.


