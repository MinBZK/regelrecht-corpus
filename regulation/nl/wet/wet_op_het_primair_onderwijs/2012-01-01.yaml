  - number: '24'
    text: |-
      1 Onze minister kan een regionale verwijzingscommissie instellen. Een regionale verwijzingscommissie brengt binnen
      4 weken na een verzoek als bedoeld in [artikel 23, vijfde lid][ref1], advies uit aan de permanente commissie
      leerlingenzorg.

      2 Een regionale verwijzingscommissie is werkzaam voor een bij algemene maatregel van bestuur vastgestelde regio.

      3 Het verzoek, bedoeld in [artikel 23, vijfde lid][ref2], wordt ingediend bij

      a. de regionale verwijzingscommissie die werkzaam is voor de regio waarin de school of de school voor speciaal
      onderwijs of speciaal en voortgezet speciaal onderwijs die de leerling bezoekt, is gelegen,

      b. bij gebreke daarvan de commissie van de regio waarbinnen de leerling woonachtig is, en

      c. indien er in een regio geen regionale verwijzingscommissie is, een regionale verwijzingscommissie die is
      gevestigd in een aangrenzende regio.

      4 In een regio kan slechts één regionale verwijzingscommissie werkzaam zijn. Indien in een regio meer dan één
      schoolbegeleidingsdienst regionaal werkzaam is, hoort Onze minister de desbetreffende schoolbegeleidingsdiensten,
      alvorens een regionale verwijzingscommissie te erkennen of in te stellen.

      5 De algemene maatregel van bestuur, bedoeld in het tweede lid, wordt aan de Tweede Kamer der Staten-Generaal
      overgelegd. De maatregel treedt niet in werking dan nadat 4 weken na de overlegging zijn verstreken en gedurende
      die termijn niet door of namens de Kamer de wens wordt te kennen gegeven dat het in die maatregel geregelde
      onderwerp bij de wet wordt geregeld. Alsdan wordt een daartoe strekkend wetsvoorstel zo spoedig mogelijk ingediend.
      Het bepaalde in de vorige 3 volzinnen is niet van toepassing indien het ontwerp van de algemene maatregel van
      bestuur voordien aan de Kamer is overgelegd en door of namens de Kamer te kennen is gegeven dat van de procedure,
      bedoeld in de vorige 3 volzinnen, kan worden afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel23
