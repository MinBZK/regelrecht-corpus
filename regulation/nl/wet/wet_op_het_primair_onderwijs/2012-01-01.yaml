  - number: 70b
    text: |-
      1 De commissie voor de indicatiestelling, bedoeld in [artikel 28c van de Wet op de expertisecentra][ref1],
      beoordeelt, indien de ouders van een leerling niet overgaan tot een verzoek als bedoeld in
      [artikel 28c, eerste lid, van de Wet op de expertisecentra][ref2], op verzoek van het bevoegd gezag van de school
      van een leerling, die zijn woonplaats heeft in het gebied van het regionaal expertisecentrum dat de desbetreffende
      commissie voor de indicatiestelling in stand houdt, of een leerling op basis van de in het achtste lid van
      [artikel 28c van de Wet op de expertisecentra][ref3] bedoelde criteria:

      a. in aanmerking komt voor een leerlinggebonden budget indien de leerling wordt dan wel is ingeschreven bij een
      school alsmede

      b. toelaatbaar is tot het cluster, bedoeld in
      [artikel 2, vierde lid, onder d, van de Wet op de expertisecentra][ref4], waarvoor de commissie voor de
      indicatiestelling werkzaam is.

      2 Het tweede, vierde, vijfde, zesde, zevende, achtste, tiende en elfde lid van
      [artikel 28c van de Wet op de expertisecentra][ref5] zijn van overeenkomstige toepassing.

      3 Het bevoegd gezag informeert de ouders van de desbetreffende leerling schriftelijk over zijn voornemen om tot
      een verzoek als bedoeld in het eerste lid over te gaan en stelt hen daarbij in de gelegenheid binnen ten minste
      vier weken na dagtekening van de informatieve mededeling aan te geven of zij zelf tot een verzoek overgaan. Bij het
      aanmeldingsformulier, bedoeld in [artikel 28c, vierde lid][ref6], geeft het bevoegd gezag de reactie van de ouders
      weer.


