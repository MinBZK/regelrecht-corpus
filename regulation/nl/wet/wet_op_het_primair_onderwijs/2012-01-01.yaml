  - number: '65'
    text: |-
      1 De gemeenteraad is bevoegd uitsluitend in het belang van een doelmatige spreiding van de leerlingen over de
      openbare scholen, het grondgebied van de gemeente in schoolwijken te verdelen.

      2 Een besluit als bedoeld in het eerste lid, geldt voor ten minste 3 schooljaren, met dien verstande dat
      tussentijdse wijziging mogelijk is in geval van veranderingen in het scholenbestand. Burgemeester en wethouders
      zenden binnen 4 weken nadat het besluit is genomen afschrift daarvan aan gedeputeerde staten.

      3 De toelating tot een openbare school geschiedt in overeenstemming met de vastgestelde schoolwijken, tenzij de
      ouders van een leerling schriftelijk aan het bevoegd gezag te kennen geven toelating tot een school in een andere
      schoolwijk te wensen.
    url: https://wetten.overheid.nl/BWBR0003420/2012-01-01#Artikel65
  - number: '66'
    text: |-
      Vertegenwoordigers van het basisonderwijs en het speciaal onderwijs kunnen ten behoeve van de scholen en
      instellingen die zij vertegenwoordigen een overlegorgaan oprichten met het doel de samenwerking tussen die scholen
      en instellingen te bevorderen ten aanzien van de toelating van leerlingen en de inrichting van het onderwijs.
    url: https://wetten.overheid.nl/BWBR0003420/2012-01-01#Artikel66
  - number: '67'
    text: |-
      Met betrekking tot het basisonderwijs en het aansluitend voortgezet onderwijs is [artikel 66][ref1] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel66
