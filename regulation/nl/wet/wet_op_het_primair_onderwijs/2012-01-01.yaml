  - number: '13'
    text: |-
      1 De schoolgids bevat voor ouders, verzorgers en leerlingen informatie over de werkwijze van de school en bevat in
      elk geval informatie over:

      a. de doelen van het onderwijs en de resultaten die met het onderwijsleerproces worden bereikt, met dien verstande
      dat bij algemene maatregel van bestuur voorschriften kunnen worden gegeven met betrekking tot de wijze waarop

      1°. de resultaten worden beschreven die met het onderwijsleerproces worden bereikt, en

      2°. de context wordt vermeld waarin de onder 1° bedoelde resultaten dienen te worden geplaatst.

      b. de wijze waarop aan de zorg voor het jonge kind wordt vormgegeven,

      c. de wijze waarop aan de zorg voor leerlingen met specifieke onderwijsbehoeften en voor leerlingen voor wie een
      leerlinggebonden budget beschikbaar is, wordt vormgegeven

      d. de wijze waarop de verplichte onderwijstijd wordt benut,

      e. de geldelijke bijdrage, bedoeld in [artikel 40, eerste lid][ref1], waarbij een ontwerp van een overeenkomst voor
      een dergelijke bijdrage, die voldoet aan de eisen die in [artikel 40, eerste lid][ref2], zijn geformuleerd, in de
      schoolgids wordt opgenomen,

      f. de rechten en plichten van de ouders, de verzorgers, de leerlingen en het bevoegd gezag, waaronder de informatie
      over de klachtenregeling, bedoeld in [artikel 14][ref3], en de gronden voor vrijstelling van het onderwijs, bedoeld
      in [artikel 41, tweede lid][ref4], en

      g. de wijze waarop het bevoegd gezag omgaat met de in [artikel 12, eerste lid][ref5], omschreven bijdragen,

      i. het beleid met betrekking tot de veiligheid,

      j. de wijze waarop de voorzieningen, bedoeld in [artikel 45][ref6], worden georganiseerd, en

      k. het verzuimbeleid,

      k. de wijze waarop invulling wordt gegeven aan het openbare karakter onderscheidenlijk de identiteit voor zover het
      betreft een samenwerkingsschool.

      2 Het bevoegd gezag reikt de schoolgids uit aan de ouders dan wel de verzorgers bij de inschrijving en jaarlijks na
      de vaststelling van de schoolgids.

      3 De algemene maatregel van bestuur, bedoeld in het eerste lid, onder a, wordt aan de beide kamers der Staten-
      Generaal overgelegd. De maatregel treedt niet in werking dan nadat 4 weken na de overlegging zijn verstreken en
      gedurende die termijn niet door of namens een der kamers de wens te kennen wordt gegeven dat het in die maatregel
      geregelde onderwerp bij de wet wordt geregeld. Alsdan wordt een daartoe strekkend wetsvoorstel zo spoedig mogelijk
      ingediend.


