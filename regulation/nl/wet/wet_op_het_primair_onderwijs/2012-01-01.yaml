  - number: '115'
    text: |-
      1 De bekostiging, bedoeld in [artikel 113, eerste lid derde volzin][ref1], voor de materiële instandhouding
      bestaat voor de gezamenlijke speciale scholen voor basisonderwijs in een samenwerkingsverband uit een bedrag
      vermenigvuldigd met 2% van het aantal leerlingen van het samenwerkingsverband op 1 oktober van het jaar
      voorafgaande aan het jaar waarover de bekostiging plaatsvindt. Het Rijk verdeelt deze bekostiging over de speciale
      scholen voor basisonderwijs in een samenwerkingsverband naar rato van het aantal leerlingen van elke speciale
      school voor basisonderwijs op die datum.

      2 Het aantal leerlingen van een speciale school voor basisonderwijs die deelneemt aan meer dan één
      samenwerkingsverband wordt bij het bepalen van het in het eerste lid, eerste volzin, bedoelde aantal leerlingen van
      elk samenwerkingsverband en het in het eerste lid, tweede volzin, bedoelde aantal leerlingen van de speciale school
      voor basisonderwijs aan de desbetreffende verbanden toegerekend naar rato van het aantal basisschoolleerlingen van
      elk verband op 1 oktober van het jaar voorafgaande aan het jaar waarover de bekostiging plaatsvindt.

      3 De bekostiging, bedoeld in [artikel 113, eerste lid derde volzin][ref2], bestaat voor basisscholen in een
      samenwerkingsverband dat een instemming als bedoeld in [artikel 18, zevende lid][ref3], heeft verkregen uit een
      bedrag vermenigvuldigd met 2% van het aantal leerlingen van de desbetreffende school.


