  - number: '82'
    text: |-
      1 Behoudens het bepaalde in het tweede lid worden in elk plan de scholen uit het voorgaande plan opgenomen die:

      a. nog niet voor bekostiging in aanmerking zijn gebracht, of

      b. voor bekostiging in aanmerking zijn gebracht, maar waaraan het onderwijs nog niet is aangevangen.

      2 Uit het voorgaande plan wordt een school niet opgenomen:

      a. indien de indiener van een verzoek heeft gevraagd de school te laten vervallen;

      b. indien aan een bijzondere school het onderwijs niet is aangevangen bij aanvang van het tweede schooljaar volgend
      op het schooljaar waarvoor de school het eerst voor bekostiging in aanmerking is gebracht, tenzij opneming in het
      plan op grond van de bij een nieuw verzoek overgelegde gegevens gerechtvaardigd is, of

      c. indien zich naar het oordeel van de gemeenteraad omstandigheden hebben voorgedaan die bij de vaststelling van
      het plan niet bekend waren, en die, waren zij wel bekend geweest, tot een ander besluit zouden hebben geleid.

      3 [Artikel 80][ref1] is van overeenkomstige toepassing indien een school ingevolge het tweede lid onder c niet in
      een volgend plan wordt opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel80
