  - number: '132'
    text: |-
      1 Indien verschillende bevoegde gezagsorganen samenwerken in een samenwerkingsverband wordt personeelsbekostiging
      toegekend voor zorgvoorzieningen aan het bestuur van de centrale dienst van dat verband.

      2 Indien een bevoegd gezag alle scholen in een samenwerkingsverband in stand houdt, wordt de in het eerste lid
      bedoelde bekostiging toegekend aan dat bevoegd gezag.

      3 De grondslag voor de berekening van de personeelsbekostiging voor zorgvoorzieningen is een bij ministeriële
      regeling vast te stellen bedrag per leerling van de afzonderlijke basisscholen in het samenwerkingsverband,
      welk bedrag wordt verhoogd met een bedrag dat wordt vermenigvuldigd met de geraamde landelijk gewogen gemiddelde
      leeftijd van de leraren van speciale scholen voor basisonderwijs.

      4 In een samenwerkingsverband dat de instemming, bedoeld in [artikel 18, zevende lid][ref1], heeft verkregen, wordt
      de in het eerste en het tweede lid bedoelde bekostiging verhoogd. De verhoging wordt vastgesteld door 2% van het
      aantal leerlingen van elke basisschool in een samenwerkingsverband op 1 oktober van het voorafgaande schooljaar, te
      vermenigvuldigen met een bij ministeriële regeling vast te stellen bedrag per leerling, welk bedrag wordt verhoogd
      met een bedrag dat wordt vermenigvuldigd met de geraamde landelijk gewogen gemiddelde leeftijd van leraren van
      speciale scholen voor basisonderwijs.

      5 De bedragen per leerling, bedoeld in het derde en vierde lid, en de vermenigvuldigingsbedragen van de verhoging,
      bedoeld in het derde en vierde lid, zijn de uitkomst van een bij algemene maatregel van bestuur vast te stellen
      hoeveelheid formatie per leerling vermenigvuldigd met een bedrag. Bij de vaststelling van de bedragen wordt in
      ieder geval rekening gehouden met de ontwikkeling van de geraamde landelijk gewogen gemiddelde leeftijd en de
      genormeerde gemiddelde personeelslast van de leraren van speciale scholen voor basisonderwijs.


