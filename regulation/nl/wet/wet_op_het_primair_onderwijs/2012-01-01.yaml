      1 Aan de school wordt in verband met de kosten van vervanging van personeel wegens voorschriften die zijn gegeven
      bij algemene maatregel van bestuur of bij ministeriële regeling en de kosten van werkloosheidsuitkeringen,
      suppleties inzake arbeidsongeschiktheid alsmede uitkeringen wegens ziekte en arbeidsongeschiktheid van gewezen
      personeel anders dan op grond van de [Ziektewet][ref1] bekostiging verstrekt.

      2 De in het eerste lid bedoelde bekostiging is verwerkt in de bedragen en in de vermenigvuldigingsbedragen van de
      verhoging, bedoeld in de [artikelen 120][ref2], [123][ref3], [124][ref4], [125][ref5] en [132][ref6].


