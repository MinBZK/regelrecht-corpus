    text: |-
      Het bevoegd gezag stelt de ouders van de leerlingen in de gelegenheid ondersteunende werkzaamheden ten behoeve
      van de school en het onderwijs te verrichten. De ouders zijn daarbij gehouden de aanwijzingen op te volgen van de
      directeur en het overige onderwijzend personeel, die verantwoordelijk blijven voor de gang van zaken.
    url: https://wetten.overheid.nl/BWBR0003420/2012-01-01#Artikel44
  - number: '45'
    text: |-
      1 Het bevoegd gezag draagt zorg voor een voorziening voor leerlingen om de middagpauze onder toezicht door te
      brengen, indien ouders hierom verzoeken. Ingeval de voorziening, bedoeld in de eerste volzin, tot stand komt,
      draagt het bevoegd gezag er zorg voor dat:

      a. er een overblijfaanpak tot stand komt,

      b. overleg over de overblijfaanpak tot stand komt met degenen die met het toezicht op de leerlingen worden belast,
      en met de ouders,

      c. het overblijven plaats vindt in een veilige en kindvriendelijke ruimte, en

      d. met ingang van 1 augustus 2011 ten minste de helft van degenen die met het toezicht op de leerlingen worden
      belast, een scholing heeft gevolgd op het gebied van het overblijven.

      De kosten die hieruit voortvloeien komen voor rekening van de ouders, voogden of verzorgers. Indien de leerlingen
      van de voorziening, bedoeld in de eerste volzin, gebruik maken, draagt het bevoegd gezag er zorg voor dat degene,
      die met het toezicht op de leerlingen wordt belast, voor wettelijke aansprakelijkheid verzekerd is. Het bevoegd
      gezag van een bijzondere school is, telkenmale voor de duur van een schooljaar, ontheven van de verplichting tot
      verzekering indien:

      a. deze verplichting zich naar zijn oordeel niet verdraagt met de godsdienstige of levensbeschouwelijke overtuiging
      die aan de school ten grondslag ligt; en

      b. het bevoegd gezag van zijn oordeel mededeling heeft gedaan aan de ouders.

      Van de ontheffing van de verplichting bedoeld in de vorige volzin doet het bevoegd gezag tijdig mededeling aan
      de inspecteur.

      1a Diegene die met het toezicht op de leerlingen is belast, als bedoeld in het eerste lid, is in het bezit van
      een verklaring omtrent het gedrag, afgegeven volgens de [Wet justitiële en strafvorderlijke gegevens][ref1]. De
      verklaring, bedoeld in de eerste volzin, wordt aan het bevoegd gezag overgelegd en is op het moment dat zij wordt
      overgelegd, niet ouder dan twee maanden.

      2 Het bevoegd gezag van een basisschool draagt op daarvoor met ouders afgesproken dagen, zorg voor de organisatie
      van kinderopvang in de zin van de [Wet kinderopvang en kwaliteitseisen peuterspeelzalen][ref2], voor leerlingen,
      op doordeweekse niet-schooldagen, niet zijnde algemeen erkende feestdagen en op schooldagen gedurende de voor- en
      naschoolse periode, tussen 07:30 uur en 18:30 uur, indien een of meer ouders hierom verzoeken. De kosten die uit de
      opvang als bedoeld in de eerste volzin voortvloeien, komen voor rekening van de ouders.

      3 Indien een of meer ouders gebruik maken van andere kinderopvang in de zin van de
      [Wet kinderopvang en kwaliteitseisen peuterspeelzalen][ref3] dan bedoeld in het tweede lid, verstrekt het bevoegd
      gezag van een basisschool op verzoek van die andere kinderopvang de praktische informatie die nodig is voor de
      opvang van kinderen door die kinderopvang.


      [ref1]: https://wetten.overheid.nl/BWBR0014194
      [ref2]: https://wetten.overheid.nl/BWBR0017017
      [ref3]: https://wetten.overheid.nl/BWBR0017017
