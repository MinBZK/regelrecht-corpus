  - number: 176d
    text: |-
      1 Het instellingsbestuur van een instelling voor hoger onderwijs die werkzaamheden uitvoert als bedoeld in artikel
      176g, eerste lid, onder a, is partij bij de in artikel 38a, eerste lid, bedoelde overeenkomst.

      2 Indien na het sluiten van die overeenkomst blijkt dat de scholing of begeleiding niet volgens de overeenkomst kan
      worden uitgevoerd, treft dat instellingsbestuur tijdig een toereikende vervangende voorziening.
    url: https://wetten.overheid.nl/BWBR0003420/2012-01-01#Artikel176d
  - number: 176e
    text: |-
      1 Onze minister kan op aanvraag van het bestuur een instelling erkennen als bevoegd tot het uitvoeren of onder zijn
      verantwoordelijkheid doen uitvoeren van het geschiktheidsonderzoek. Erkenning vindt plaats indien het bestuur in
      zijn aanvraag ten genoegen van Onze Minister aantoont dat de instelling het geschiktheidsonderzoek onafhankelijk,
      deskundig en betrouwbaar zal uitvoeren. Bij algemene maatregel van bestuur kunnen regels worden vastgesteld met
      betrekking tot de toepassing van de tweede volzin, waaronder regels over de behandeling en beoordeling van de
      aanvraag. Een erkende instelling heeft tevens de bevoegdheid tot het verstrekken van geschiktheidsverklaringen op
      grond van het geschiktheidsonderzoek en tot het doen van voorstellen over de noodzakelijke scholing en begeleiding,
      met inachtneming van [artikel 176c, tweede lid, onder c][ref1].

      2 Ten behoeve van de behandeling van aanvragen om erkenning kan Onze minister een bij ministeriële regeling te
      bepalen bijdrage verlangen van het bestuur van de instelling.

      3 Onze Minister kan de erkenning intrekken indien de instelling, bedoeld in het eerste lid, naar het oordeel van
      Onze Minister het geschiktheidsonderzoek niet langer onafhankelijk, deskundig of betrouwbaar uitvoert.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel176c
    url: https://wetten.overheid.nl/BWBR0003420/2012-01-01#Artikel176e
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 176c
        hoofdstuk: I
        afdeling: 11A
  - number: 176f
    text: |-
      Het bekwaamheidsonderzoek strekt ertoe, vast te stellen of de leraar voldoet aan de in artikel 32a, eerste lid,
      bedoelde bekwaamheidseisen voor het onderwijs waarvoor die eisen zijn vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003420/2012-01-01#Artikel176f
  - number: 176g
    text: |-
      1 Het instellingsbestuur van een instelling voor hoger onderwijs die opleidt voor het voldoen aan bekwaamheidseisen
      als bedoeld in artikel 32a, eerste lid, en die zich daartoe bij Onze minister heeft gemeld, is na die melding en
      onder overlegging van een plan van aanpak, bevoegd tot:

      a. het verzorgen of doen verzorgen van de in artikel 176c, tweede lid, onder c, bedoelde scholing en begeleiding,
      voor zover deze verband houden met opleidingen die de instelling verzorgt, of

      b. het uitvoeren of onder zijn verantwoordelijkheid doen uitvoeren van bekwaamheidsonderzoek, voor zover de
      instelling opleidt voor het desbetreffende getuigschrift, dan wel

      c. zowel de onder a als de onder b bedoelde activiteiten.

      2 Het instellingsbestuur van een instelling voor hoger onderwijs die op grond van het eerste lid, onder b, bevoegd
      is tot het uitvoeren van het bekwaamheidsonderzoek, stelt de leraar die zich daartoe heeft gemeld en voor wie
      de scholing en begeleiding zijn afgerond overeenkomstig de in artikel 38a bedoelde overeenkomst, tijdig in de
      gelegenheid deel te nemen aan dat onderzoek.

      3 Het instellingsbestuur kan bepalen dat de aanvrager van het bekwaamheidsonderzoek aan dat bestuur een bijdrage
      is verschuldigd voor uitvoering van dat onderzoek. Bij ministeriële regeling kan voor deze bijdrage een maximum
      worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003420/2012-01-01#Artikel176g
  - number: 176h
    text: |-
      1 Het in artikel 176e en het in artikel 176g bedoelde bestuur dragen zorg voor de kwaliteit van de werkzaamheden
      van de instelling.

      2 Onze minister kan een instelling een of meer van de in artikel 176e of artikel 176g, eerste lid, bedoelde
      bevoegdheden ontnemen indien gebleken is dat de kwaliteit van de uitoefening daarvan tekortschiet, dan wel indien
      niet of niet meer wordt voldaan aan het terzake bij en krachtens deze wet bepaalde. Artikel 6.10, vierde lid, van
      de Wet op het hoger onderwijs en wetenschappelijk onderzoek is van overeenkomstige toepassing ten aanzien van de
      ontneming.
    url: https://wetten.overheid.nl/BWBR0003420/2012-01-01#Artikel176h
  - number: 176i
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur worden nadere voorschriften vastgesteld voor de uitvoering van
      artikel 176c, tweede lid onder b, en vierde lid.

      2 Tevens kunnen bij of krachtens de in het eerste lid bedoelde algemene maatregel van bestuur voorschriften worden
      vastgesteld voor de uitvoering van deze afdeling, waaronder in elk geval voorschriften met betrekking tot:

      a. waarborging van de kwaliteit van het geschiktheidsonderzoek en van de instellingen die dat onderzoek uitvoeren,

      b. de scholing en begeleiding, en het bekwaamheidsonderzoek, waaronder voorschriften ter waarborging van de
      kwaliteit, alsmede

      c. de procedure voor het aanvragen van het geschiktheidsonderzoek en voor afgifte van de geschiktheidsverklaring.

      3 De algemene maatregel van bestuur, bedoeld in het eerste lid, wordt aan de beide Kamers der Staten-Generaal
      overgelegd. De maatregel treedt niet in werking dan nadat vier weken na de overlegging zijn verstreken en niet door
      of namens een van beide Kamers de wens wordt te kennen gegeven dat het in die maatregel geregelde onderwerp bij de
      wet wordt geregeld. Alsdan wordt een daartoe strekkend wetsvoorstel zo spoedig mogelijk ingediend.
    url: https://wetten.overheid.nl/BWBR0003420/2012-01-01#Artikel176i
  - number: 176j
    text: |-
      Het in artikel 176e en het in artikel 176g bedoelde bestuur verstrekken aan Onze minister alle inlichtingen
      die deze nodig acht ten behoeve van een goede naleving van deze afdeling. Het bestuur zendt de inspectie van
      het onderwijs telkens na zes maanden een overzicht van in die periode afgegeven geschiktheidsverklaringen en
      bekwaamheidsonderzoeken waaraan met goed gevolg is deelgenomen.
    url: https://wetten.overheid.nl/BWBR0003420/2012-01-01#Artikel176j
  - number: '177'
    text: |-
      1 Onze minister kan bepalen dat geen of slechts een gedeeltelijke bekostiging wordt verstrekt voor uitgaven die het
      gevolg zijn van schuld of nalatigheid van het bevoegd gezag.

      2 Indien de uitgaven bedoeld in het eerste lid, voor bekostiging door het Rijk in aanmerking komen, treedt het Rijk
      op het moment van een uitdrukkelijk besluit tot bekostiging in alle rechten die het bevoegd gezag ter zake tegen
      derden mocht hebben.

      3 Indien de gemeente een collectieve verzekering heeft afgesloten voor de vergoeding van schade, ontstaan aan
      gebouwen, terreinen of roerende zaken van een niet door de gemeente in stand gehouden school, heeft het bevoegd
      gezag van de desbetreffende school jegens de gemeente geen aanspraak op vergoeding van dergelijke schade, voor
      zover die collectieve verzekering de schade dekt.

      4 Indien schade, ontstaan aan gebouwen, terreinen of roerende zaken van een niet door de gemeente in stand gehouden
      school voor vergoeding door de gemeente in aanmerking komt, treedt de gemeente op het moment van een uitdrukkelijk
      besluit tot vergoeding in alle rechten die het bevoegd gezag ter zake van die schade tegen derden mocht hebben.
    url: https://wetten.overheid.nl/BWBR0003420/2012-01-01#Artikel177
  - number: 178a
    text: |-
      1 Het bevoegd gezag kan het persoonsgebonden nummer van een leerling gebruiken in het verkeer met de leerling op
      wie het nummer betrekking heeft, of met de ouders van deze leerling.

      2 Het bevoegd gezag verstrekt het persoonsgebonden nummer van iedere leerling aan Onze minister, tezamen met de
      volgende gegevens van de leerling:

      a. geslacht, geboortedatum en postcode van de woonplaats;

      b. de datum van in- of uitschrijving;

      c. de groep;

      d. indien van toepassing het gewicht, bedoeld in [artikel 15b, eerste lid, van het Formatiebesluit WPO][ref1],
      indien het betreft een leerling die is ingeschreven op een basisschool;

      e. indien van toepassing de aanduiding dat het betreft een leerling met een niet-Nederlandse culturele achtergrond
      als bedoeld in [artikel 1 van het Formatiebesluit WPO][ref2], indien het betreft een leerling die is ingeschreven
      op een speciale school voor basisonderwijs, dan wel de aanduiding dat het betreft een leerling met een niet-
      Nederlandse culturele achtergrond met uitzondering van leerlingen van wie ten minste een van de ouders of voogden
      afkomstig is uit Suriname, de Nederlandse Antillen of Aruba, indien het betreft een leerling die is ingeschreven op
      een basisschool;

      f. indien van toepassing voor- en vroegschoolse educatie;

      g. indien van toepassing de uitslag van een onder verantwoordelijkheid van de school afgenomen onafhankelijke
      eindtoets basisonderwijs;

      h. het advies omtrent het volgen van aansluitend voortgezet onderwijs bij het verlaten van de school, zoals
      opgenomen in het onderwijskundig rapport, bedoeld in [artikel 42][ref3];

      i. het registratienummer van de school of, indien sprake is van een nevenvestiging, het registratienummer daarvan;

      j. indien van toepassing de onderwijssoort dan wel het cluster, bedoeld in
      [artikel 2, vierde lid onder d, van de Wet op de expertisecentra][ref4], de begindatum van de periode
      waarvoor de leerling toelaatbaar is verklaard door een commissie voor de indicatiestelling als bedoeld in
      [artikel 28c van de Wet op de expertisecentra][ref5] en het registratienummer van het regionaal expertisecentrum
      dat de indicatiestelling heeft verricht en van de school bedoeld in de [Wet op de expertisecentra][ref6] die de
      leerling begeleidt;

      k. indien van toepassing de aanduiding visueel gehandicapte leerling en de instelling die deze leerling begeleidt;
      en

      l. bekostigingsindicatie.

      3 Bij ministeriële regeling kan een nadere specificatie worden gegeven van de gegevens, bedoeld in het tweede
      en zevende lid, en kan worden bepaald welke van de gegevens, bedoeld in het tweede en zevende lid, niet langer
      behoeven te worden verstrekt. Bij ministeriële regeling kunnen voorts regels worden gesteld omtrent de tijdstippen
      en de wijze van verstrekking van de gegevens, bedoeld in het tweede en zevende lid.

      4 Het bevoegd gezag kan het persoonsgebonden nummer van een leerling, al dan niet tezamen met een of meer van
      de gegevens, bedoeld in het tweede en zevende lid, gebruiken in het verkeer met Onze minister ten behoeve van de
      vaststelling van de bekostiging van de school.

      5 Het bevoegd gezag en het hoofd, bedoeld in [artikel 1, onder d, van de Leerplichtwet 1969][ref7],
      gebruiken het persoonsgebonden nummer van een leerling in contacten met een gemeente in het kader van de
      [Leerplichtwet 1969][ref8], tezamen met de gegevens die noodzakelijk zijn voor het toezicht op de naleving van die
      wet door de gemeente.

      6 Het bevoegd gezag gebruikt het persoonsgebonden nummer van een leerling in het contact met een andere school of
      een school voor ander onderwijs ten behoeve van de in- en uitschrijving van die leerling.

      7 Indien de gegevens over de nationaliteit van de leerling niet zijn opgenomen in de gemeentelijke
      basisadministratie persoonsgegevens worden deze gegevens door het bevoegd gezag verstrekt aan Onze minister.

      8 Het bevoegd gezag gebruikt het persoonsgebonden nummer van een leerling in het kader van de uitvoering van
      subsidieregelingen van het Europees Sociaal Fonds.

      9 Het bevoegd gezag verstrekt geen persoonsgebonden nummer van een leerling ter uitvoering van
      [artikel 107, tweede en vijfde lid, van de Vreemdelingenwet 2000][ref9].


