  - number: '86'
    text: 'In deze paragraaf wordt onder «school» verstaan: speciale school voor basisonderwijs.'
    url: https://wetten.overheid.nl/BWBR0003420/2012-01-01#Artikel86
  - number: '87'
    text: |-
      1 Onze minister kan een school op aanvraag van het bevoegd gezag van de school voor bekostiging in aanmerking
      brengen. Onze minister willigt de aanvraag slechts in, indien

      a. de bevoegde gezagsorganen van alle basisscholen in het samenwerkingsverband met het verzoek instemmen,

      b. het samenwerkingsverband meer dan de helft van de basisscholen omvat in een nieuwe woningbouwlocatie van ten
      minste 15 000 woningen of in aan elkaar grenzende woningbouwlocaties waar binnen 10 jaar in totaal ten minste
      15 000 woningen worden gebouwd,

      c. het samenwerkingsverband nog niet over een speciale school voor basisonderwijs beschikt, en

      d. als gevolg van de oprichting van het samenwerkingsverband niet een reeds bestaand samenwerkingsverband onder de
      norm van [artikel 18, tweede lid][ref1], terecht zou komen.

      2 De bekostiging kan slechts aanvangen met ingang van 1 augustus van een schooljaar.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel18
    url: https://wetten.overheid.nl/BWBR0003420/2012-01-01#Artikel87
