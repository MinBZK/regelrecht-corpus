  - number: '68'
    text: |-
      1 Op het personeel van een rechtspersoon met volledige rechtsbevoegdheid die

      a. uitsluitend wordt bestuurd door een bevoegd gezag al dan niet met een of meer andere bevoegde gezagsorganen als
      bedoeld in deze wet, de [Wet op de expertisecentra][ref1] of de [Wet op het voortgezet onderwijs][ref2],

      b. zich blijkens de statuten dan wel de gemeenschappelijke regeling, bedoeld in de
      [Wet gemeenschappelijke regelingen][ref3], uitsluitend ten doel stelt om ten behoeve van scholen en andere
      onderwijsinstellingen die uit 's Rijks kas worden bekostigd, werkzaamheden te verrichten ter verzekering van
      de goede gang van het onderwijs met uitzondering van het leiden van de school, het geven van onderwijs en het
      verrichten van werkzaamheden op het terrein van de schoolbegeleiding,

      c. niet het maken van winst beoogt,

      d. wordt gefinancierd met behulp van bijdragen van de bevoegde gezagsorganen waarvoor diensten worden verricht,
      waaronder begrepen de bekostiging voor zorgvoorzieningen, bedoeld in [artikel 120, vierde lid][ref4], of
      [artikel 132][ref5], en

      e. Onze minister heeft medegedeeld als rechtspersoon in de zin van dit artikel werkzaam te willen zijn,

      zijn van toepassing de in [artikel 33][ref6] bedoelde voorschriften en regels.

      Voor de toepassing van de eerste volzin, onder b, wordt onder het geven van onderwijs niet begrepen het onderwijs
      dat wordt gegeven door personeel dat is benoemd of aangesteld op bekostiging voor zorgvoorzieningen, bedoeld in
      [artikel 120, vierde lid][ref7], of [artikel 132][ref8].

      2 Onder bevoegd gezag en bevoegde gezagsorganen in het eerste lid onderdeel a wordt mede verstaan burgemeester
      en wethouders.

      3 Het bestuur van de rechtspersoon is aangesloten bij een commissie van beroep als bedoeld in [artikel 60][ref9].
      De leden en plaatsvervangende leden van een commissie van beroep mogen niet behoren tot het bestuur of het
      personeel van de rechtspersoon.

      4 De in het eerste lid onder a bedoelde bevoegde gezagsorganen delen Onze minister mede dat zij het bestuur vormen
      van een rechtspersoon in de zin van dit artikel. Voorts verschaffen zij Onze minister en de door hem aangewezen
      personen desgevraagd alle inlichtingen omtrent de rechtspersoon en zijn activiteiten. De in het eerste lid
      onder a bedoelde bevoegde gezagsorganen kunnen Onze minister mededelen dat zij erin toestemmen dat de gevraagde
      inlichtingen rechtstreeks door het bestuur van de rechtspersoon zelf aan Onze minister en de door hem aangewezen
      personen worden verschaft.

      5 Burgemeester en wethouders en het bevoegd gezag dat deel uitmaakt van het bestuur van de rechtspersoon, zijn
      verplicht op de naleving van de in de voorgaande leden genoemde voorschriften toe te zien.

      6 De [artikelen 37][ref10], [38][ref11], [60][ref12] en [61][ref13] zijn van overeenkomstige toepassing ten aanzien
      van het personeel van de rechtspersoon met dien verstande dat een geschillencommissie haar werkzaamheden uitstrekt
      over ten minste vijf rechtspersonen als bedoeld in dit artikel.

      7 De [artikelen 164][ref14], [171][ref15], [172][ref16], [175][ref17], [177][ref18] en [182][ref19] zijn van
      overeenkomstige toepassing voor de centrale diensten die op grond van [artikel 132][ref20] personeelsbekostiging
      voor zorgvoorzieningen ontvangen.


