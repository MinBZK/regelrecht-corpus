  - number: 64c
    text: |-
      1 Onze minister kan goedkeuring onthouden indien als gevolg van de fusie de daadwerkelijke variatie van het
      onderwijsaanbod, zowel in het opzicht van richting en pedagogisch-didactische aanpak binnen het voedingsgebied van
      de te fuseren scholen of rechtspersonen, op significante wijze wordt belemmerd.

      2 Onze minister verleent slechts goedkeuring aan een bestuurlijke fusie als bedoeld in [artikel 17][ref1],
      indien daardoor de continuïteit van het openbaar of het bijzonder onderwijs gehandhaafd kan blijven en
      met de bestuurlijke fusie wordt voorkomen dat een of meer daarbij betrokken scholen door toepassing van de
      [artikelen 151 tot en met 161][ref2] wordt opgeheven of niet meer voor bekostiging in aanmerking komt. Het
      bevoegd gezag van de betreffende school toont dat aan op basis van een prognose van de ontwikkeling van het aantal
      leerlingen waaruit blijkt dat die school binnen een termijn van zes jaar dreigt te worden opgeheven of niet meer te
      worden bekostigd.

      3 Onze minister laat zich ten aanzien van de goedkeuring, bedoeld in het eerste en tweede lid, adviseren door
      een onafhankelijke adviescommissie, tenzij de noodzaak daartoe ontbreekt. Bij ministeriële regeling wordt bepaald
      wanneer er geen sprake is van de noodzaak bedoeld in de eerste volzin.

      4 Onze minister stelt beleidsregels vast omtrent de uitoefening van de bevoegdheid, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel151
