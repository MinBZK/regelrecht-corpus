  - number: '23'
    text: |-
      1 Het bevoegd gezag of de bevoegde gezagsorganen van scholen in een samenwerkingsverband stellen een permanente
      commissie leerlingenzorg in. Deze commissie bepaalt op aanvraag van de ouders of plaatsing van een leerling
      op een speciale school voor basisonderwijs noodzakelijk is. De commissie weigert de toelaatbaarheid tot
      een speciale school voor basisonderwijs niet op grond van het feit dat de leerling aangewezen zou zijn op
      een onderwijssoort binnen een cluster als bedoeld in [artikel 2, vierde lid onder b of c][ref1], dan wel
      tot het cluster, bedoeld in [genoemd artikel onder d, van de Wet op de expertisecentra][ref2], indien een
      commissie voor de indicatiestelling, bedoeld in [artikel 28c van genoemde wet][ref3], heeft geoordeeld dat
      die leerling niet toelaatbaar is tot een onderwijssoort binnen dat cluster dan wel tot het cluster, bedoeld in
      [artikel 2, vierde lid onder d, van die wet][ref4]. De commissie kan voorts worden belast met andere taken. Indien
      sprake is van een samenwerkingsverband zonder speciale school voor basisonderwijs is de tweede volzin niet van
      toepassing en adviseert de commissie in elk geval

      a. op verzoek van de ouders of het bevoegd gezag van de basisschool die de leerling bezoekt over de wijze waarop
      een leerling op die school kan worden begeleid, en

      b. indien in het samenwerkingsverband voorzieningen zijn getroffen ten behoeve van de basisscholen voor de opvang
      van kinderen die extra zorg behoeven over de verwijzing naar die voorzieningen.

      2 De permanente commissie leerlingenzorg bestaat uit ten minste 3 leden.

      3 Alvorens een beslissing te nemen op een aanvraag als bedoeld in het eerste lid, tweede volzin, vraagt de commissie
      aan de school van de leerling de gegevens, bedoeld in [artikel 43, eerste onderscheidenlijk tweede lid][ref5].

      4 Een aanvraag als bedoeld in het eerste lid, tweede volzin, wordt niet in behandeling genomen indien de
      leerling afkomstig is van een basisschool van een ander samenwerkingsverband dan dat van de permanente commissie
      leerlingenzorg en de permanente commissie leerlingenzorg van dat andere samenwerkingsverband geen onherroepelijk
      geworden beslissing als bedoeld in het eerste lid, tweede volzin, heeft genomen. De eerste volzin is niet van
      toepassing indien de aanvraag plaatsvindt in verband met een verhuizing van de leerling.

      5 Alvorens een beslissing te nemen op een bezwaarschrift vraagt de permanente commissie leerlingenzorg advies aan
      de regionale verwijzingscommissie, bedoeld in [artikel 24][ref6].

      6 Een beslissing van de permanente commissie leerlingenzorg als bedoeld in het eerste lid,
      tweede volzin, wordt aangemerkt als een beschikking van een bestuursorgaan als bedoeld in
      [artikel 1:1, eerste lid, van de Algemene wet bestuursrecht][ref7]. Deze beschikking is geen besluit als bedoeld in
      [artikel 8:4, onderdeel e, van de Algemene wet bestuursrecht][ref8].

      7 De permanente commissie leerlingenzorg stelt indien de ouders bij een ingediende aanvraag of een ingediend
      verzoek of bezwaarschrift daarom hebben verzocht een termijn waarbinnen de ouders een deskundigenadvies of
      overige informatie kunnen indienen. De commissie betrekt de door de ouders tijdig overgelegde informatie bij de
      besluitvorming.

      8 Beslissingen en adviezen van de permanente commissie leerlingenzorg worden in de school die de leerling bezocht
      toen het advies werd uitgebracht, bewaard tot 3 jaar nadat de leerling de school heeft verlaten, met dien verstande
      dat bij plaatsing van een leerling op een andere school in het samenwerkingsverband de beslissing of het advies in
      die school wordt bewaard tot 3 jaar nadat de leerling die school heeft verlaten.


