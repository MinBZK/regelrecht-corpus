      De algemene maatregel van bestuur, bedoeld in [artikel 120][ref1], [124][ref2], [125][ref3] en [132][ref4],
      wordt aan de Tweede Kamer der Staten-Generaal overgelegd. De maatregel treedt niet in werking dan nadat 4 weken
      na de overlegging zijn verstreken en gedurende die termijn niet door of namens de Kamer de wens wordt te kennen
      gegeven dat het in die maatregel geregelde onderwerp bij de wet wordt geregeld. Alsdan wordt een daartoe strekkend
      wetsontwerp zo spoedig mogelijk ingediend. Het bepaalde in de vorige 3 volzinnen is niet van toepassing indien het
      ontwerp van de algemene maatregel van bestuur voordien aan de Kamer is overgelegd en door of namens de Kamer te
      kennen is gegeven dat van de procedure, bedoeld in de vorige 3 volzinnen, kan worden afgeweken.


