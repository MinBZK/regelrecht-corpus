  - number: 64a
    text: |-
      1 Fusies worden niet tot stand gebracht dan nadat daarvoor goedkeuring is verleend door Onze minister.

      2 De goedkeuring, bedoeld in het eerste lid, is niet vereist voor:

      a. een institutionele fusie waarbij het totaal aantal leerlingen van de betrokken scholen minder dan 500 bedraagt,
      of

      b. een bestuurlijke fusie, met uitzondering van de bestuurlijke fusie bedoeld in [artikel 17][ref1], waarbij het
      aantal betrokken scholen minder dan 10 bedraagt.

      3 De rechtspersoon dan wel de betrokken rechtspersonen stellen een fusie-effectrapportage op voor iedere
      institutionele of bestuurlijke fusie.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel17
    url: https://wetten.overheid.nl/BWBR0003420/2012-01-01#Artikel64a
