  - number: '184'
    text: |-
      1 Het bevoegd gezag van een school onderscheidenlijk het bestuur van een centrale dienst is aangesloten bij een
      door Onze Minister aan te wijzen rechtspersoon met volledige rechtsbevoegdheid die zich ten doel stelt waarborgen
      te bieden voor de kosten van werkloosheidsuitkeringen, suppleties inzake arbeidsongeschiktheid alsmede uitkeringen
      wegens ziekte en arbeidsongeschiktheid van gewezen personeel anders dan op grond van de [Ziektewet][ref1] ten
      behoeve van gewezen personeel.

      2 Het bevoegd gezag onderscheidenlijk het bestuur van de centrale dienst voldoet aan de rechtspersoon
      jaarlijks een door het bestuur van die rechtspersoon vast te stellen bijdrage in verband met de kosten
      van werkloosheidsuitkeringen, suppleties inzake arbeidsongeschiktheid alsmede uitkeringen wegens ziekte en
      arbeidsongeschiktheid van gewezen personeel anders dan op grond van de [Ziektewet][ref2].

      3 Van de in het eerste en tweede lid bedoelde verplichting kan Onze Minister op verzoek van het bevoegd gezag
      onderscheidenlijk het bestuur van de centrale dienst ontheffing verlenen op grond van bezwaren van godsdienstige of
      levensbeschouwelijke aard. Onze Minister verleent de ontheffing slechts, indien het bevoegd gezag onderscheidenlijk
      het bestuur van de centrale dienst aantoont dat een afdoende andere voorziening is getroffen met betrekking tot
      de kosten van werkloosheidsuitkeringen, suppleties inzake arbeidsongeschiktheid alsmede uitkeringen wegens ziekte
      en arbeidsongeschiktheid van gewezen personeel anders dan op grond van de [Ziektewet][ref3]. Onze Minister besluit
      binnen zes maanden na ontvangst van een verzoek. Indien de beschikking niet binnen zes maanden kan worden gegeven,
      stelt Onze Minister de verzoeker daarvan in kennis en noemt hij daarbij een termijn waarbinnen de beschikking wel
      tegemoet kan worden gezien.

      4 Het bestuur van de rechtspersoon stelt regels vast voor de behandeling, beoordeling en beantwoording
      van een verzoek van het bevoegd gezag onderscheidenlijk het bestuur van de centrale dienst als bedoeld in
      [artikel 138, derde lid][ref4]. Indien het bevoegd gezag onderscheidenlijk het bestuur van de centrale dienst zich
      beroept op overwegingen van godsdienstige of levensbeschouwelijke aard, betrekt het bestuur van de rechtspersoon
      die overwegingen bij de beoordeling van een in de eerste volzin bedoeld verzoek.

      5 Indien het bestuur van de rechtspersoon het in het vierde lid bedoelde verzoek heeft ingewilligd, vergoedt hij
      aan de instantie die de werkloosheidsuitkeringen, de suppleties inzake arbeidsongeschiktheid alsmede de uitkeringen
      wegens ziekte en arbeidsongeschiktheid van gewezen personeel anders dan op grond van de [Ziektewet][ref5] verstrekt
      of heeft verstrekt, de kosten van die uitkeringen of suppleties.

      6 Indien een werkloosheidsuitkering, een suppletie inzake arbeidsongeschiktheid alsmede een uitkering wegens
      ziekte en arbeidsongeschiktheid van gewezen personeel anders dan op grond van de [Ziektewet][ref6] van gewezen
      personeel van een school of een centrale dienst voortvloeit uit de inzet of een wijziging van de inzet van de
      in [artikel 120, vierde lid][ref7], en [artikel 132][ref8] bedoelde bekostiging ten opzichte van voorafgaande
      schooljaren, zijn de bevoegde gezagsorganen van alle scholen van het desbetreffende samenwerkingsverband hoofdelijk
      aansprakelijk voor het aan de rechtspersoon vergoeden van de kosten van de werkloosheidsuitkering, de suppletie
      inzake arbeidsongeschiktheid onderscheidenlijk de uitkering wegens ziekte en arbeidsongeschiktheid van gewezen
      personeel anders dan op grond van de [Ziektewet][ref9].

      7 Tegen een besluit van het bestuur van de rechtspersoon kan het bevoegd gezag onderscheidenlijk het bestuur van de
      centrale dienst beroep instellen bij de Afdeling bestuursrechtspraak van de Raad van State.

      8 Op de rechtspersoon, bedoeld in het eerste lid, is de [Kaderwet zelfstandige bestuursorganen][ref10] van
      toepassing.


