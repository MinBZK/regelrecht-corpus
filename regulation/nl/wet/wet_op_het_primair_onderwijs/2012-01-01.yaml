  - number: '69'
    text: |-
      1 De openbare en de bijzondere scholen worden door het Rijk bekostigd volgens de bepalingen van deze titel met
      uitzondering van afdeling 3. Geen bekostiging vindt plaats indien groepen van leerlingen van verschillende scholen
      al dan niet van hetzelfde bevoegd gezag gezamenlijk onderwijs ontvangen. De bedragen die de gemeente krachtens deze
      wet in aanvulling op de rijksbekostiging verstrekt blijven ten laste van de gemeente.

      2 Bij algemene maatregel van bestuur worden nadere voorschriften gegeven ter uitvoering van het eerste lid. Deze
      algemene maatregel van bestuur bevat in elk geval een regeling omtrent de termijnen binnen welke besluiten moeten
      worden genomen.

      3 De algemene maatregel van bestuur bedoeld in het tweede lid, bevat tevens:

      a. een regeling omtrent de betaling van de bedragen van de bekostiging voor de materiële voorzieningen ten behoeve
      van de instandhouding voortvloeiende uit het gebruik door een school van voorzieningen die voor meer dan een school
      of voor andere doeleinden zijn bestemd;

      b. een financiële regeling tussen het Rijk en de bevoegde gezagsorganen die personeel in dienst hebben dat niet
      door het Rijk wordt bekostigd ter zake van een korting op de bekostiging ter compensatie van de kosten van de voor
      dat personeel geldende rechtspositionele voorzieningen, voor zover deze ten laste van 's Rijks kas komen.

      4 De algemene maatregel van bestuur bedoeld in het tweede lid, wordt aan de Tweede Kamer der Staten-Generaal
      overgelegd. De maatregel treedt niet in werking dan nadat 4 weken na de overlegging zijn verstreken en gedurende
      die termijn niet door of namens de Kamer de wens wordt te kennen gegeven dat het in die maatregel geregelde
      onderwerp bij de wet wordt geregeld. Alsdan wordt een daartoe strekkend wetsontwerp zo spoedig mogelijk ingediend.

      5 [Artikel 4:32 van de Algemene wet bestuursrecht][ref1] is niet van toepassing op de bekostiging van scholen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel432
    url: https://wetten.overheid.nl/BWBR0003420/2012-01-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:32
  - number: '70'
    text: |-
      Onze minister kan onder nader te stellen voorwaarden aanvullende middelen ter beschikking stellen die niet strekken
      tot bekostiging van het onderwijs, bedoeld in deze wet, en de schoolbegeleiding ten behoeve daarvan, maar die
      direct of indirect dienstig zijn voor de uitvoering van het onderwijs of voor verhoging van de mogelijkheid tot
      deelname aan het onderwijs. Voor zover toepassing van de eerste volzin het verstrekken van subsidie betreft, zijn
      de [artikelen 4 tot en met 19 van de Wet overige OCW-subsidies][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009458#Artikel4
    url: https://wetten.overheid.nl/BWBR0003420/2012-01-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0009458
        artikel: '4'
  - number: 70a
    text: |-
      1 Indien op verzoek van de ouders van een leerling voor wie op basis van een beoordeling door een commissie voor
      de indicatiestelling als bedoeld in [artikel 28c van de Wet op de expertisecentra][ref1] een leerlinggebonden
      budget beschikbaar is, die leerling wordt ingeschreven bij een school, dan wel indien een dergelijk budget
      beschikbaar komt voor een leerling die al staat ingeschreven bij een school, meldt het bevoegd gezag van die school
      die inschrijving, respectievelijk het beschikbaar komen van een leerlinggebonden budget voor de desbetreffende
      leerling, aan Onze minister.

      2 Indien sprake is van een eerste inschrijving bij een school als leerling voor wie een leerlinggebonden
      budget beschikbaar is, dan wel indien een leerlinggebonden budget beschikbaar komt voor een leerling die al
      staat ingeschreven bij een school, wordt met ingang van de eerste dag van de maand volgend op de inschrijving,
      respectievelijk het beschikbaar komen van het leerlinggebonden budget, aan het bevoegd gezag van die school
      ten behoeve van die leerling een leerlinggebonden budget toegekend, dat wordt berekend op een bij of krachtens
      algemene maatregel van bestuur vastgestelde wijze. De omvang van het leerlinggebonden budget is afhankelijk van
      de onderwijssoort waarvoor de leerling toelaatbaar is verklaard, waarbinnen onderscheid kan worden gemaakt op
      grond van leerlingkenmerken. Indien een leerling voor wie een leerlinggebonden budget beschikbaar is, wordt,
      dan wel blijft, ingeschreven bij een speciale school voor basisonderwijs, meldt het bevoegd gezag de reden voor
      inschrijving, respectievelijk het ingeschreven blijven, bij die speciale school voor basisonderwijs aan Onze
      minister.

      3 Indien ten behoeve van een leerling voor wie een leerlinggebonden budget beschikbaar is in het lopende schooljaar
      dat budget aan het bevoegd gezag van een school is toegekend, wordt bij inschrijving van die leerling bij een
      andere school, het in het tweede lid bedoelde leerlinggebonden budget aan het bevoegd gezag van laatstbedoelde
      school toegekend met ingang van het nieuwe schooljaar.

      4 Het bevoegd gezag van de school is verplicht een bij algemene maatregel van bestuur te bepalen deel van
      het leerlinggebonden budget te besteden bij een school als bedoeld in de [Wet op de expertisecentra][ref2]
      waarbinnen onderwijs wordt gegeven van de soort waarvoor de leerling toelaatbaar is verklaard of van
      de soort die behoort tot hetzelfde cluster als de onderwijssoort waarvoor de leerling toelaatbaar
      is verklaard. Het in de eerste volzin bedoelde deel kan voor de onderwijssoorten, bedoeld in
      [artikel 2, tweede lid, van de Wet op de expertisecentra][ref3], verschillend worden vastgesteld. De eerste volzin
      is van overeenkomstige toepassing ten aanzien van een leerling die toelaatbaar is verklaard tot het cluster,
      bedoeld in [artikel 2, vierde lid onder d, van de Wet op de expertisecentra][ref4].

      5 Bij de melding, bedoeld in het eerste lid, geeft het bevoegd gezag tevens aan bij welke school bedoeld
      in de [Wet op de expertisecentra][ref5] het in het vierde lid bedoelde deel van het leerlinggebonden budget
      wordt besteed. Op grond van deze melding kent Onze minister dat deel van het leerlinggebonden budget toe aan
      laatstbedoelde school.

      6 In afwijking van de tweede volzin van het tweede lid, kan bij algemene maatregel van bestuur worden bepaald
      in welke gevallen en in welke mate de omvang van het leerlinggebonden budget bij inschrijving, dan wel het
      ingeschreven blijven, van een leerling bij een speciale school voor basisonderwijs lager wordt vastgesteld dan bij
      inschrijving van die leerling bij een basisschool.

      7 Een krachtens het tweede, vierde en zesde lid vastgestelde algemene maatregel van bestuur wordt aan de Tweede
      Kamer der Staten-Generaal overgelegd. Hij treedt in werking op een tijdstip dat nadat 4 weken na de overlegging
      zijn verstreken bij koninklijk besluit wordt vastgesteld, tenzij binnen die termijn door of namens de kamer de
      wens te kennen wordt gegeven dat het onderwerp van de algemene maatregel van bestuur bij wet wordt geregeld. In
      dat geval wordt een daartoe strekkend voorstel van wet zo spoedig mogelijk ingediend. De vorige 3 volzinnen zijn
      niet van toepassing, voor zover het ontwerp van een algemene maatregel van bestuur voordien aan de Tweede Kamer der
      Staten-Generaal is voorgelegd en door of namens de kamer te kennen is gegeven dat van de procedure, bedoeld in de
      vorige 3 volzinnen, kan worden afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel28c
      [ref2]: https://wetten.overheid.nl/BWBR0003549
