  - number: 184a
    text: |-
      1 De rechtspersoon, bedoeld in [artikel 184][ref1], kan het burgerservicenummer of, bij het ontbreken daarvan,
      het sociaal-fiscaalnummer van het gewezen personeelslid, uitsluitend in het kader van het doel, bedoeld in
      [artikel 184, eerste lid][ref2], gebruiken in het verkeer met:

      a. het gewezen personeelslid,

      b. het bevoegd gezag van de school dan wel het bestuur van de centrale dienst waar de in onderdeel a bedoelde
      persoon werkzaam was,

      c. Onze minister, of

      d. de instantie, bedoeld in [artikel 184, vijfde lid][ref3].

      2 Het burgerservicenummer of, bij het ontbreken daarvan, het sociaal-fiscaalnummer wordt op een daartoe strekkend
      verzoek van de in het eerste lid bedoelde rechtspersoon aan die rechtspersoon verstrekt door het bevoegd gezag van
      de school dan wel het bestuur van de centrale dienst waar het gewezen personeelslid werkzaam was.

      3 Indien dat ten behoeve van het jaarverslag, bedoeld in
      [artikel 18, eerste lid, van de Kaderwet zelfstandige bestuursorganen][ref4], noodzakelijk is, worden gegevens
      daarin slechts zodanig openbaar gemaakt dat daaraan geen herkenbare gegevens over een afzonderlijk persoon
      kunnen worden ontleend, tenzij het betreft de controle op de juistheid van de gegevens in het kader van de
      controle op de rechtmatigheid en de doelmatigheid van door de rechtspersoon gedane uitgaven. Daarbij kunnen
      de burgerservicenummers of, voor zover deze ontbreken, sociaal-fiscale nummers worden vergeleken met de
      burgerservicenummers of sociaal-fiscale nummers die door andere daartoe bij of krachtens de wet bevoegde instanties
      zijn verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel184
