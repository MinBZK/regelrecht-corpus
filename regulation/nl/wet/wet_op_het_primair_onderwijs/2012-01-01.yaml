    text: |-
      1 Het bevoegd gezag van een school waar een visueel gehandicapte leerling is ingeschreven of een leerling voor
      wie een leerlinggebonden budget beschikbaar is, stelt in overeenstemming met de ouders voor elk schooljaar een
      handelingsplan op. Indien de inschrijving van de in de eerste volzin bedoelde leerling plaatsvindt op of na 1
      augustus wordt het handelingsplan zo spoedig mogelijk doch uiterlijk een maand na die inschrijving opgesteld.

      2 In het handelingsplan dat betrekking heeft op het laatste schooljaar van de periode gedurende welke voor de
      leerling een leerlinggebonden budget beschikbaar is, wordt aangegeven dat de voortzetting van de voorzieningen die
      voor de leerling zijn getroffen op basis van het leerlinggebonden budget, afhankelijk is van een nieuwe beoordeling
      door een zodanige commissie voor de indicatiestelling.

      3 Het handelingsplan wordt jaarlijks met de ouders geëvalueerd.
    url: https://wetten.overheid.nl/BWBR0003420/2012-01-01#Artikel40a
  - number: 40b
    text: |-
      1 Onverminderd bij algemene maatregel van bestuur gegeven voorschriften met betrekking tot de in- en uitschrijving
      van leerlingen, vindt toelating van een leerling als bedoeld in artikel 40 slechts plaats nadat de ouders de
      gegevens betreffende de geslachtsnaam, de voorletters, de geboortedatum, het geslacht en het persoonsgebonden
      nummer van de leerling hebben overgelegd. Indien de ouders aannemelijk maken dat zij geen persoonsgebonden nummer
      van de leerling kunnen overleggen, vindt de toelating plaats met inachtneming van het derde lid.

      2 De in het eerste lid bedoelde gegevens worden overgelegd door middel van een van overheidswege verstrekt document
      dan wel een door een andere school of een school voor ander onderwijs verstrekt bewijs van uitschrijving, waarin de
      desbetreffende gegevens zijn opgenomen.

      3 Indien de ouders aannemelijk maken dat zij geen persoonsgebonden nummer van de leerling kunnen overleggen,
      meldt het bevoegd gezag binnen twee weken na het besluit tot toelating aan Onze minister de beschikbare
      gegevens van de leerling, bedoeld in het eerste lid, alsmede zijn adres en woonplaats en, indien aanwezig, het
      leerlingadministratienummer.

      4 Onze minister verstrekt binnen acht weken na ontvangst van de melding, bedoeld in het derde lid, aan het
      bevoegd gezag het burgerservicenummer van de leerling, dan wel, indien is gebleken dat hem niet van overheidswege
      een burgerservicenummer is verstrekt, het onderwijsnummer van de leerling. Het onderwijsnummer is een door Onze
      minister uitgegeven en aan de leerling toegekend persoonsgebonden nummer.

      5 Het bevoegd gezag neemt de in het eerste en vierde lid bedoelde gegevens op in de leerlingenadministratie van
      de school. Bij ministeriële regeling kan worden bepaald welke andere gegevens in de leerlingenadministratie worden
      opgenomen.

      6 Indien aan een leerling een onderwijsnummer is toegekend en het bevoegd gezag de beschikking krijgt over zijn
      burgerservicenummer, neemt het bevoegd gezag dit burgerservicenummer terstond als persoonsgebonden nummer op
      in de leerlingenadministratie van de school in de plaats van het onderwijsnummer. Het bevoegd gezag meldt deze
      wijziging binnen twee weken aan Onze minister onder opgave van het burgerservicenummer en het onderwijsnummer van
      de leerling.
    url: https://wetten.overheid.nl/BWBR0003420/2012-01-01#Artikel40b
  - number: '41'
    text: |-
      1 De leerlingen nemen deel aan alle voor hen bestemde onderwijsactiviteiten, met dien verstande dat die
      onderwijsactiviteiten voor de leerlingen onderling kunnen verschillen.

      2 Het bevoegd gezag kan op verzoek van de ouders een leerling vrijstellen van het deelnemen aan bepaalde
      onderwijsactiviteiten. Een vrijstelling kan slechts worden verleend op door het bevoegd gezag vastgestelde gronden.
      Het bevoegd gezag bepaalt bij de vrijstelling welke onderwijsactiviteiten voor de leerling in de plaats komen van
      die waarvan vrijstelling is verleend.
    url: https://wetten.overheid.nl/BWBR0003420/2012-01-01#Artikel41
  - number: '42'
    text: |-
      Over iedere leerling die de school verlaat, stelt de directeur, na overleg met het onderwijzend personeel, ten
      behoeve van de ontvangende school of school als bedoeld in de [Wet op de expertisecentra][ref1] dan wel als bedoeld
      in de [Wet op het voortgezet onderwijs][ref2] een onderwijskundig rapport op. Afschrift van dit rapport wordt aan
      de ouders van de leerling verstrekt. Bij algemene maatregel van bestuur kunnen nadere voorschriften omtrent dit
      rapport worden gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0003549
      [ref2]: https://wetten.overheid.nl/BWBR0002399
