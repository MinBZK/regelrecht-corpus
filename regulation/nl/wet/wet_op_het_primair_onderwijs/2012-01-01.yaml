  - number: 178c
    text: |-
      1 Gegevens uit het basisregister onderwijs kunnen worden gebruikt door:

      a. Onze minister voor zover deze gegevens noodzakelijk zijn voor de bekostiging van scholen en de begrotings- en
      beleidsvoorbereiding;

      b. de inspectie voor zover deze gegevens noodzakelijk zijn voor het uitoefenen van het toezicht op het
      basisonderwijs.

      2 Voor zover de door het bevoegd gezag op grond van [artikel 178a][ref1] verstrekte gegevens naar het oordeel van
      Onze minister onjuist of onvolledig zijn, kan Onze minister ten behoeve van de vaststelling van de bekostiging van
      deze gegevens afwijken, in welk geval de door Onze minister vastgestelde gewijzigde gegevens worden opgenomen in
      het basisregister onderwijs, nadat het desbetreffende besluit tot vaststelling van de bekostiging onherroepelijk
      is geworden.

      3 Het gebruik, bedoeld in het eerste lid, ziet uitsluitend op gegevens die niet herleid of herleidbaar zijn tot
      individuele leerlingen, onverminderd [artikel 178b, derde lid][ref2].

      4 Bij ministeriële regeling worden regels gesteld ter uitvoering van het eerste en derde lid, in ieder geval
      omtrent de inhoud en de samenstelling van de gegevens, de wijze waarop de gegevens uit het basisregister worden
      verstrekt, de tijdstippen waarop de gegevens worden verstrekt, en de perioden waarop de gegevens betrekking hebben.

      5 In afwijking van het derde lid wordt bij algemene maatregel van bestuur bepaald in welke gevallen en onder welke
      voorwaarden Onze minister gegevens als bedoeld in [artikel 178a, tweede en derde lid][ref3], kan gebruiken tezamen
      met het persoonsgebonden nummer van een leerling ten behoeve van de vaststelling van de bekostiging van een school,
      alsmede welke gegevens dit gebruik kan betreffen.


