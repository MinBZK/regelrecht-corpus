        bwb_id: BWBR0005291
        artikel: '89'
  - number: '50'
    text: |-
      Het bevoegd gezag stelt de leerlingen in de gelegenheid op de school, binnen de schooltijden, godsdienstonderwijs
      of levensbeschouwelijk vormingsonderwijs te ontvangen. Van de tijd daaraan te besteden worden ten
      hoogste 120 uren per schooljaar meegeteld voor het aantal uren onderwijs dat de leerlingen krachtens
      [artikel 8, zevende lid, aanhef en onder b][ref1], ten minste moeten ontvangen. Voor de leerlingen die dit
      onderwijs niet volgen, voorziet het bevoegd gezag in andere onderwijsactiviteiten op de school.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel8
    url: https://wetten.overheid.nl/BWBR0003420/2012-01-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '8'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '1'
  - number: '51'
    text: |-
      Godsdienstonderwijs wordt gegeven door leraren daartoe aangewezen door kerkelijke gemeenten, plaatselijke kerken,
      of rechtspersonen met volledige rechtsbevoegdheid die zich blijkens hun statuten het geven van godsdienstonderwijs
      ten doel stellen. Levensbeschouwelijk vormingsonderwijs wordt gegeven door leraren daartoe aangewezen door
      volledige rechtsbevoegdheid bezittende organisaties op geestelijke grondslag.

      Het bevoegd gezag ziet erop toe dat dit onderwijs uitsluitend wordt gegeven door een leraar die blijkens een
      daartoe strekkende verklaring van de aanwijzende instantie:

      a. voldoet aan de bekwaamheidseisen die krachtens artikel 32a, eerste lid, voor het geven van dat onderwijs zijn
      vastgesteld, en

      b. zijn bekwaamheid onderhoudt.
    url: https://wetten.overheid.nl/BWBR0003420/2012-01-01#Artikel51
  - number: '52'
    text: |-
      In afwijking van [artikel 33, derde lid][ref1], zijn Gedeputeerde Staten van de desbetreffende provincie bevoegd de
      disciplinaire straf of de schorsing op te leggen dan wel het ontslag te verlenen, indien het betreft een directeur,
      een adjunct-directeur, of een ander lid van het onderwijzend personeel van een openbare school en deze tevens lid
      is van de raad van de gemeente die de school in stand houdt.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel33
    url: https://wetten.overheid.nl/BWBR0003420/2012-01-01#Artikel52
    references:
