  - number: '8'
    text: |-
      1 Het onderwijs wordt zodanig ingericht dat de leerlingen een ononderbroken ontwikkelingsproces kunnen doorlopen.
      Het wordt afgestemd op de voortgang in de ontwikkeling van de leerlingen.

      2 Het onderwijs richt zich in elk geval op de emotionele en de verstandelijke ontwikkeling, en op het ontwikkelen
      van creativiteit, op het verwerven van noodzakelijke kennis en van sociale, culturele en lichamelijke vaardigheden.

      3 Het onderwijs:

      a. gaat er mede van uit dat leerlingen opgroeien in een pluriforme samenleving,

      b. is mede gericht op het bevorderen van actief burgerschap en sociale integratie, en

      c. is er mede op gericht dat leerlingen kennis hebben van en kennismaken met verschillende achtergronden en
      culturen van leeftijdgenoten.

      4 Ten aanzien van leerlingen die extra zorg behoeven, is het onderwijs gericht op individuele begeleiding die is
      afgestemd op de behoeften van de leerling.

      5 Het onderwijs aan een speciale school voor basisonderwijs is tevens erop gericht leerlingen waar mogelijk tot het
      volgen van onderwijs in basisscholen of scholen voor voortgezet onderwijs te brengen.

      6 De scholen voorzien in een voortgangsregistratie omtrent de ontwikkeling van leerlingen die extra zorg behoeven,
      en omtrent leerlingen die onderwijs volgen als bedoeld in [artikel 165][ref1].

      7 Het onderwijs wordt zodanig ingericht dat:

      a. de leerlingen in beginsel binnen een tijdvak van 8 aaneensluitende schooljaren de school kunnen doorlopen;

      b. de leerlingen in 8 schooljaren ten minste 7520 uren onderwijs ontvangen, met dien verstande dat de leerlingen
      in de eerste 4 schooljaren ten minste 3520 uren onderwijs en in de laatste 4 schooljaren ten minste 3760 uren
      onderwijs ontvangen, en aan de leerlingen in de laatste 6 schooljaren ten hoogste 7 weken van het schooljaar 4
      dagen per week onderwijs wordt gegeven, die evenwichtig zijn verdeeld over het schooljaar, bij een schoolweek van
      in beginsel niet minder dan 5 dagen onderwijs, en

      c. de onderwijsactiviteiten evenwichtig over de dag worden verdeeld, tenzij afwijking van deze verdeling van belang
      is in verband met activiteiten in het kader van het voorkomen en bestrijden van onderwijsachterstanden.

      8 Het onderwijs wordt zodanig ingericht dat leerlingen die in verband met ziekte thuis verblijven dan wel zijn
      opgenomen in een ziekenhuis, op adequate wijze voldoende onderwijs kunnen genieten.

      9 Het onderwijs wordt zodanig ingericht dat daarbij op structurele en herkenbare wijze aandacht wordt besteed aan
      het bestrijden van achterstanden in het bijzonder in de beheersing van de Nederlandse taal, waarin ook door middel
      van vroegschoolse educatie kan worden voorzien.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel165
