  - number: '43'
    text: |-
      1 Binnen vier weken na een daartoe strekkend verzoek van een permanente commissie leerlingenzorg als bedoeld in
      [artikel 23][ref1] zendt de basisschool de commissie de gegevens waaruit blijkt om welke reden naar het oordeel van
      de directeur van de basisschool, mede op advies van het onderwijzend personeel van de school, de leerling niet op
      de school kan worden gehandhaafd en een beschrijving van de maatregelen die tijdens het verblijf van de leerling
      op de school zijn getroffen om te bewerkstelligen dat de leerling wel op de school zou kunnen worden gehandhaafd.
      De basisschool verstrekt de commissie desgevraagd tevens binnen vier weken alle nadere gegevens die de commissie
      verlangt en die redelijkerwijs door de school kunnen worden verstrekt.

      2 Het eerste lid is van overeenkomstige toepassing bij overgang van een leerling van een speciale school voor
      basisonderwijs naar een dergelijke school in een ander samenwerkingsverband, met dien verstande dat de gegevens
      inzicht geven in de voortgang van de ontwikkeling van de leerling.

      3 Het eerste lid is van overeenkomstige toepassing ten aanzien van een verzoek van de permanente commissie
      leerlingenzorg met betrekking tot een leerling van een school als bedoeld in de [Wet op de expertisecentra][ref2],
      met dien verstande dat de gegevens inzicht geven in de voortgang van de ontwikkeling van de leerling.

      4 Afschrift van het rapport, bedoeld in het eerste, tweede en derde lid, wordt aan de ouders van de leerling
      verstrekt.

      5 Bij het verstrekken van de gegevens, bedoeld in het eerste lid, meldt de basisschool wanneer en aan welke
      permanente commissie leerlingenzorg door haar reeds eerder dergelijke gegevens over de leerling werden verstrekt.

      6 Het eerste lid is van overeenkomstige toepassing indien het een verzoek betreft van ouders van
      een leerling in het kader van hun verzoek aan de commissie voor de indicatiestelling, bedoeld in
      [artikel 28c, van de Wet op de expertisecentra][ref3]

      7 Bij algemene maatregel van bestuur kunnen nadere voorschriften worden gegeven omtrent de in dit artikel bedoelde
      gegevens.


