      1 [Artikel 187][ref1] is van overeenkomstige toepassing ten aanzien van de rechtspersoon, bedoeld in
      [artikel 184][ref2].

      2 Onze Minister zendt binnen vijf jaar na de aanwijzing van de rechtspersoon, bedoeld in [artikel 184][ref3], en
      vervolgens telkens na vijf jaar, aan de Tweede Kamer der Staten-Generaal een verslag over de doeltreffendheid en de
      effecten van de werkzaamheden van die rechtspersoon.


