  - number: 1a.1
    text: |-
      In deze wet wordt onder het gecorrigeerde verzamelinkomen verstaan: het verzamelinkomen, bedoeld in
      [artikel 2.18 van de Wet inkomstenbelasting 2001][ref1], verminderd met:


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel2
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '2'
  - number: 1a.1.a
    text: |-
      indien in het kalenderjaar de zelfstandigenaftrek, bedoeld in
      [artikel 3.76 van de Wet inkomstenbelasting 2001][ref1], is toegepast: € 1355;


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 1a.1.b
    text: |-
      indien in het kalenderjaar loon wordt genoten: het hoogste van de uit de toepassing van de volgende onderdelen
      voortvloeiende bedragen:
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel1a
  - number: 1a.1.b.1°
    text: 'bij loon uit tegenwoordige dienstbetrekking: 12% van dat loon, maar niet minder dan € 119 en niet meer dan € 1605;'
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel1a
  - number: 1a.1.b.2°
    text: 'bij loon uit vroegere dienstbetrekking: € 487;'
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel1a
  - number: 1a.1.c
    text: |-
      het bedrag van de in het kalenderjaar 2000 in aanmerking genomen kosten van woon-werkverkeer (reiskostenforfait),
      maar niet meer dan € 939;
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel1a
  - number: 1a.1.d
    text: |-
      indien in het kalenderjaar 2000 loon uit dienstbetrekking wordt genoten: het bedrag van de in dat jaar in
      aanmerking genomen aftrekbare kosten terzake van inkomsten uit arbeid andere dan kosten van woon-werkverkeer, na
      toepassing van artikel 37, tweede lid, van de Wet op de inkomstenbelasting 1964, verminderd met 12% van het loon
      uit tegenwoordige dienstbetrekking in dat jaar, maar met niet minder dan € 119 en met niet meer dan € 1605;
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel1a
  - number: 1a.1.e
    text: |-
      het bedrag van de in het kalenderjaar 2000 in aanmerking genomen renten van schulden, kosten van geldleningen
      daaronder begrepen, bedoeld in artikel 45, eerste lid, onderdeel f, van de Wet op de inkomstenbelasting 1964;
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel1a
  - number: 1a.1.f
    text: |-
      het bedrag van de in het kalenderjaar 2000 in aanmerking genomen premies voor lijfrenten, maar niet meer dan
      € 2804, verminderd met € 1036, maar niet verder dan tot nihil; indien bij de echtgenoot van degene van wie het
      gecorrigeerd verzamelinkomen wordt berekend geen premies voor lijfrenten in aanmerking genomen zijn, worden de
      bedragen van € 2804 en € 1036 verhoogd tot € 5608 respectievelijk € 2072;
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel1a
  - number: 1a.1.g
    text: |-
      het bedrag van de in het kalenderjaar 2000 in aanmerking genomen uitgaven tot voorziening in het levensonderhoud
      van kinderen en pleegkinderen van 27 jaar en ouder, alsmede andere bloed- en aanverwanten in de rechte lijn of
      in de tweede graad van de zijlijn, bedoeld in artikel 46, eerste lid, onderdeel a, onder 2°, van de Wet op de
      inkomstenbelasting 1964.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel1a
  - number: 1a.2
    text: |-
      In het eerste lid wordt onder loon verstaan loon in de zin van de [Wet inkomstenbelasting 2001][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011353
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0011353
  - number: 1a.3
    text: |-
      In deze wet en de daarop rustende bepalingen wordt onder het gecorrigeerde belastbare loon verstaan: het belastbare
      loon, bedoeld in artikel 9 van de Wet op de loonbelasting 1964, verminderd met:
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel1a
  - number: 1a.3.a
    text: 'het hoogste van de uit de toepassing van de volgende onderdelen voortvloeiende bedragen:'
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel1a
  - number: 1a.3.a.1°
    text: 'bij loon uit tegenwoordige dienstbetrekking: 12% van dat loon, maar niet minder dan € 119 en niet meer dan € 1605;'
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel1a
  - number: 1a.3.a.2°
    text: 'bij loon uit vroegere dienstbetrekking: € 487;'
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel1a
  - number: 1a.3.b
    text: de bedragen bedoeld in het eerste lid, onderdelen c tot en met g.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel1a
  - number: 1a.4
    text: |-
      De in het eerste lid, onderdelen c tot en met g, en derde lid, onderdeel b, bedoelde correctieposten worden over
      het kalenderjaar 2001 voor het geheel in aanmerking genomen, over het kalenderjaar 2002 voor 2/3 deel en over het
      kalenderjaar 2003 voor 1/3 deel. Over het kalenderjaar 2004 en volgende kalenderjaren worden deze correctieposten
      niet meer in aanmerking genomen.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel1a
  - number: 1a.5
    text: 'Met loon uit tegenwoordige dienstbetrekking wordt gelijkgesteld:'
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel1a
  - number: 1a.5.a
    text: |-
      loon genoten wegens tijdelijke arbeidsongeschiktheid, anders dan ingevolge de
      [Wet werk en inkomen naar arbeidsvermogen][ref1], de [Wet op de arbeidsongeschiktheidsverzekering][ref2], de
      [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref3] behoudens uitkeringen in verband met bevalling, en de
      [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0019057
      [ref2]: https://wetten.overheid.nl/BWBR0002524
      [ref3]: https://wetten.overheid.nl/BWBR0008656
      [ref4]: https://wetten.overheid.nl/BWBR0008657
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0019057
      - id: ref2
        bwb_id: BWBR0002524
      - id: ref3
        bwb_id: BWBR0008656
      - id: ref4
        bwb_id: BWBR0008657
  - number: 1a.5.b
    text: |-
      loon in de vorm van uitkeringen ingevolge de Wet financiering loopbaanonderbreking en aanvullingen daarop door
      degene tot wie de belastingplichtige in dienstbetrekking staat.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel1a
  - number: 1a.6
    text: |-
      De inspecteur, onder wie de ouders van leerlingen die aanspraak maken op gehele of gedeeltelijke vergoeding van
      vervoerskosten krachtens [artikel 3, tweede lid, van de Algemene wet inzake rijksbelastingen][ref1] ressorteren
      voor de heffing van de inkomstenbelasting, bepaalt op verzoek van burgemeester en wethouders van de gemeente waar
      de leerlingen waarvan de ouders aanspraak maken op vergoeding van kosten van leerlingenvervoer verblijven, het
      gecorrigeerde verzamelinkomen of het gecorrigeerde belastbare loon in het desbetreffende jaar van de desbetreffende
      ouders.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel3
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '3'
  - number: 1a.7
    text: |-
      De in het zesde lid bedoelde inspecteur verstrekt de gegevens inzake het gecorrigeerde verzamelinkomen of het
      gecorrigeerde belastbare loon aan het in het zesde lid bedoelde college van burgemeester en wethouders volgens bij
      of krachtens algemene maatregel van bestuur te stellen regels.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel1a
  - number: '2'
    text: |-
      Het basisonderwijs is het onderwijs bestemd voor kinderen vanaf de leeftijd van omstreeks 4 jaar. Het legt mede de
      grondslag voor het volgen van aansluitend voortgezet onderwijs.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel2
  - number: '3.1'
    text: 'Schoolonderwijs mag slechts worden gegeven door degene die:'
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel3
  - number: 3.1.a
    text: |-
      in het bezit is van een verklaring omtrent het gedrag, afgegeven volgens de
      [Wet justitiële en strafvorderlijke gegevens][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0014194
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0014194
  - number: 3.1.b
    text: |-
      in het bezit is van een bewijs van bekwaamheid bedoeld in [artikel 186][ref1], of van een daarmee krachtens
      het derde lid gelijk gesteld bewijs van bekwaamheid, of van een ten aanzien van het door hem te geven onderwijs
      afgegeven EG-verklaring als bedoeld in de [Algemene wet erkenning EG-hoger-onderwijsdiploma's][ref2] dan wel in
      de [Algemene wet erkenning EG-beroepsopleidingen][ref3], dan wel van Onze minister krachtens het vierde lid de
      bevoegdheid heeft verkregen, en


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel186
      [ref2]: https://wetten.overheid.nl/BWBR0006317
      [ref3]: https://wetten.overheid.nl/BWBR0006781
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '186'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0006317
      - id: ref3
        bwb_id: BWBR0006781
  - number: 3.1.c
    text: niet krachtens rechterlijke uitspraak van het geven van onderwijs is uitgesloten.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel3
  - number: '3.2'
    text: |-
      Het eerste lid onder a en b is niet van toepassing voor het geven van godsdienstonderwijs of levensbeschouwelijk
      vormingsonderwijs.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel3
  - number: '3.3'
    text: |-
      Bij ministeriële regeling kan een buiten Nederland verworven bewijs worden gelijkgesteld met een bewijs van
      bekwaamheid genoemd in [artikel 186][ref1]. Daarbij kunnen voorwaarden en beperkingen worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel186
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '186'
        hoofdstuk: III
  - number: '3.4'
    text: |-
      Onze minister kan aan personen die in het bezit zijn van een buiten Nederland behaald bewijs van bekwaamheid, de
      bevoegdheid tot het geven van schoolonderwijs verlenen. Hij kan daarbij voorwaarden en beperkingen stellen.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel3
  - number: '3.5'
    text: |-
      Ten aanzien van studenten die een duale opleiding volgen als bedoeld in
      [artikel 7.7 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1] leidend tot een getuigschrift
      dat bij of krachtens [artikel 186][ref2] is aangewezen als bewijs van bekwaamheid, en aan die opleiding ten
      minste 180 studiepunten hebben behaald, kan worden afgeweken van de eisen in het eerste lid onder b, met
      dien verstande dat het tijdelijk dienstverband van de student een periode beslaat die overeenkomt met een
      volledig dienstverband van vijf maanden. De vorige volzin is van overeenkomstige toepassing ten aanzien van
      studenten die ten minste 166 doch nog geen 180 studiepunten hebben behaald, indien door de desbetreffende
      hogeschool wordt verklaard dat de student beschikt over met 180 studiepunten vergelijkbare en tevens voor het
      dienstverband relevante kennis, inzicht en vaardigheden. De toepassing van de vorige volzin vervalt ten aanzien
      van die student die niet binnen vier weken na aanvang van het dienstverband over 180 studiepunten beschikt. De
      in [artikel 7.7, vijfde lid, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref3] bedoelde
      overeenkomst vermeldt tevens de leraar onder wiens verantwoordelijkheid de betrokken student werkzaamheden van
      onderwijskundige aard verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel186
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '186'
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0005682
        artikel: '7'
  - number: '4.1'
    text: |-
      Ten behoeve van het schoolbezoek verstrekken burgemeester en wethouders aan ouders van in de gemeente verblijvende
      leerlingen op aanvraag bekostiging van de door burgemeester en wethouders noodzakelijk te achten vervoerskosten. De
      gemeenteraad stelt daartoe een nadere regeling vast, met inachtneming van het bepaalde in de volgende leden.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel4
  - number: '4.2'
    text: De regeling maakt geen onderscheid tussen openbaar en bijzonder onderwijs.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel4
  - number: '4.3'
    text: De regeling eerbiedigt de op godsdienst of levensbeschouwing van de ouders berustende keuze van een school.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel4
  - number: '4.4'
    text: De regeling voorziet erin dat het vervoer kan plaatsvinden op een wijze die voor de leerling passend is.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel4
  - number: '4.5'
    text: De regeling bepaalt dat de kosten worden vergoed van vervoer over de afstand tussen de woning van de leerling en
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel4
  - number: 4.5.a
    text: |-
      de dichtstbijzijnde voor de leerling toegankelijke basisschool of, indien een leerling op het onderwijs van een
      speciale school voor basisonderwijs is aangewezen, de dichtstbijzijnde voor de leerling toegankelijke speciale
      school voor basisonderwijs,
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel4
  - number: 4.5.b
    text: |-
      een andere basisschool of speciale school voor basisonderwijs, indien het vervoer naar die school voor de gemeente
      minder kosten met zich mee zou brengen dan het vervoer naar de basisschool onderscheidenlijk speciale school voor
      basisonderwijs, bedoeld onder a, en de ouders met het vervoer naar die andere school instemmen,
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel4
  - number: 4.5.c
    text: |-
      de dichtstbijzijnde voor de leerling toegankelijke speciale school voor basisonderwijs in het samenwerkingsverband
      van de basisschool waarvan de leerling afkomstig is, indien de ouders met het vervoer naar die speciale school voor
      basisonderwijs instemmen, of
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel4
  - number: 4.5.d
    text: |-
      een andere speciale school voor basisonderwijs in het onder c bedoelde samenwerkingsverband, indien het vervoer
      naar die school voor de gemeente minder kosten met zich zou brengen dan het vervoer naar de speciale school voor
      basisonderwijs, bedoeld onder c, en de ouders met het vervoer naar die andere school instemmen.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel4
  - number: '4.6'
    text: |-
      Bij de toepassing van het vijfde lid worden de afstanden gemeten langs de kortste voor de leerling voldoende
      begaanbare en veilige weg en wordt de keuze van de ouders, bedoeld in het derde lid, in acht genomen.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel4
  - number: '4.7'
    text: |-
      De regeling kan ten aanzien van ouders wier inkomen tezamen meer bedraagt dan € 17 700 bepalen dat slechts
      bekostiging wordt verstrekt voor zover de kosten van vervoer de kosten van het openbaar vervoer over de door
      de gemeenteraad op grond van het achtste lid vastgestelde afstand te boven gaan, welke afstand ten hoogste 6
      kilometer bedraagt. Bij de berekening van het inkomen wordt uitgegaan van het inkomen in het tweede kalenderjaar
      voorafgaand aan het kalenderjaar waarin het schooljaar waarvoor bekostiging wordt gevraagd, begint. Voor zover
      het inkomen is onderworpen aan de Nederlandse inkomstenbelasting respectievelijk loonbelasting wordt uitgegaan van
      het gecorrigeerde verzamelinkomen respectievelijk het gecorrigeerde belastbare loon. De kosten van het openbaar
      vervoer, bedoeld in de eerste volzin, betreffen de kosten van openbaar vervoer die op grond van de zone-indeling in
      de regeling die is gebaseerd op artikel 27, eerste lid, van de Wet personenvervoer, voor de afstand redelijkerwijs
      zouden worden gemaakt, ongeacht de aanwezigheid van openbaar vervoer of het daadwerkelijk gebruik ervan. Ingeval
      toepassing wordt gegeven aan het tiende lid voorziet de regeling in een overeenkomstig de vierde volzin berekende
      financiële bijdrage van de ouders. Het bedrag, bedoeld in de eerste volzin, wordt met ingang van 1 januari 1999
      jaarlijks aangepast aan de wijziging die het indexcijfer van de regelingslonen van volwassen werknemers heeft
      ondergaan ten opzichte van het voorafgaande jaar, en afgerond op een veelvoud van € 450. Het aangepaste bedrag
      treedt in de plaats van het in de eerste volzin bedoelde bedrag. Indien het inkomen moet worden bepaald over
      een aan het kalenderjaar 2001 voorafgaand kalenderjaar, wordt in afwijking van de derde volzin uitgegaan van het
      belastbare inkomen respectievelijk het zuivere loon.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel4
  - number: '4.8'
    text: |-
      De regeling kan bepalen dat geen aanspraak op bekostiging bestaat op grond van de afstand tussen de voor de
      leerling toegankelijke school en de woning van de leerling, gemeten langs de kortste, voor de leerling voldoende
      begaanbare en veilige weg.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel4
  - number: '4.9'
    text: |-
      De regeling kan bepalen dat voor een leerling die ouder is dan een bepaalde leeftijd, de aanspraak op bekostiging
      wordt beperkt tot de kosten van openbaar vervoer, dan wel, indien zulks in redelijkheid kan worden verlangd, een
      goedkopere wijze van vervoer. In dat geval dient de regeling erin te voorzien, dat uitvoering wordt gegeven aan
      het bepaalde in het vierde lid voor die leerlingen voor wie openbaar vervoer ontbreekt en de in de vorige volzin
      bedoelde goedkopere wijze van vervoer in redelijkheid niet kan worden verlangd.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel4
  - number: '4.10'
    text: |-
      De regeling kan bepalen dat de gemeente, in plaats van bekostiging in geld te geven, het vervoer verzorgt of doet
      verzorgen.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel4
  - number: '4.11'
    text: |-
      De regeling kan voor leerlingen voor wie de afstand bedoeld in het vijfde lid, meer bedraagt dan 20 kilometer,
      bepalen dat de hoogte van de bekostiging afhankelijk is van de financiële draagkracht van de ouders, of dat het
      vervoer dat de gemeente verzorgt of doet verzorgen geschiedt tegen een van de financiële draagkracht van de ouders
      afhankelijke bijdrage tot ten hoogste het bedrag van de kosten van het vervoer van de desbetreffende leerling. In
      dat geval bevat de regeling tevens voorschriften omtrent de bepaling van de financiële draagkracht van de ouders.
      De eerste volzin is niet van toepassing voor een leerling van een speciale school voor basisonderwijs voor wie
      geldt dat de afstand tot de dichtstbijzijnde openbare of bijzondere speciale school voor basisonderwijs meer dan 20
      kilometer bedraagt.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel4
  - number: '4.12'
    text: |-
      De regeling kan bepalen dat burgemeester en wethouders in bijzondere gevallen de bevoegdheid hebben ten gunste van
      de ouders van de inhoud van de regeling af te wijken.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel4
  - number: '4.13'
    text: |-
      Het zevende tot en met negende lid en het elfde lid zijn niet van toepassing op leerlingen die wegens hun
      lichamelijke, verstandelijke of zintuiglijke handicap op ander vervoer dan openbaar vervoer zijn aangewezen, dan
      wel vanwege een zodanige handicap niet zelfstandig van openbaar vervoer gebruik kunnen maken.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel4
  - number: 4a.1
    text: |-
      Indien het bevoegd gezag op enigerlei wijze bekend is geworden dat een ten behoeve van zijn school
      met taken belast persoon zich mogelijk schuldig maakt of heeft gemaakt aan een misdrijf tegen de
      zeden als bedoeld in [Titel XIV van het Wetboek van Strafrecht][ref1] jegens een leerling van de
      school, treedt het bevoegd gezag onverwijld in overleg met de vertrouwensinspecteur, bedoeld in
      [artikel 6 van de Wet op het onderwijstoezicht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001854
      [ref2]: https://wetten.overheid.nl/BWBR0013800#Artikel6
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0001854
      - id: ref2
        bwb_id: BWBR0013800
        artikel: '6'
  - number: 4a.2
    text: |-
      Indien uit het overleg, bedoeld in het eerste lid, moet worden geconcludeerd dat er sprake is van een redelijk
      vermoeden dat de desbetreffende persoon zich schuldig heeft gemaakt aan een misdrijf als bedoeld in het eerste
      lid jegens een leerling van de school, doet het bevoegd gezag onverwijld aangifte bij een opsporingsambtenaar als
      bedoeld in [artikel 127][ref1] juncto [artikel 141 van het Wetboek van Strafvordering][ref2], en stelt het bevoegd
      gezag de vertrouwensinspecteur daarvan onverwijld in kennis. Voordat het bevoegd gezag overgaat tot het doen van
      aangifte, stelt het de ouders van de betrokken leerling, onderscheidenlijk de betreffende ten behoeve van de school
      met taken belaste persoon, hiervan op de hoogte.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel127
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '127'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '141'
  - number: 4a.3
    text: |-
      Indien een personeelslid op enigerlei wijze bekend is geworden dat een ten behoeve van de school met taken belast
      persoon zich mogelijk schuldig maakt of heeft gemaakt aan een misdrijf als bedoeld in het eerste lid jegens een
      leerling van de school, stelt het personeelslid het bevoegd gezag daarvan onverwijld in kennis.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel4a
  - number: '6'
    text: |-
      Ten laste van een andere openbare kas dan van Rijk en gemeente worden geen scholen in stand gehouden, noch uitgaven
      voor een school gedaan. Gemeenten doen geen uitgaven voor een niet door de gemeente in stand gehouden school dan
      krachtens de wet.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel6
  - number: '7.1'
    text: |-
      Deze wet is niet van toepassing op scholen die uitsluitend bestemd zijn voor kinderen die niet de Nederlandse
      nationaliteit hebben.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel7
  - number: '7.2'
    text: Bij twijfel of op een school het eerste lid van toepassing is, besluit de Kroon, de Raad van State gehoord.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel7
  - number: '8.1'
    text: |-
      Het onderwijs wordt zodanig ingericht dat de leerlingen een ononderbroken ontwikkelingsproces kunnen doorlopen. Het
      wordt afgestemd op de voortgang in de ontwikkeling van de leerlingen.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel8
  - number: '8.2'
    text: |-
      Het onderwijs richt zich in elk geval op de emotionele en de verstandelijke ontwikkeling, en op het ontwikkelen van
      creativiteit, op het verwerven van noodzakelijke kennis en van sociale, culturele en lichamelijke vaardigheden.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel8
  - number: '8.3'
    text: 'Het onderwijs:'
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel8
  - number: 8.3.a
    text: gaat er mede van uit dat leerlingen opgroeien in een pluriforme samenleving,
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel8
  - number: 8.3.b
    text: is mede gericht op het bevorderen van actief burgerschap en sociale integratie, en
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel8
  - number: 8.3.c
    text: |-
      is er mede op gericht dat leerlingen kennis hebben van en kennismaken met verschillende achtergronden en culturen
      van leeftijdgenoten.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel8
  - number: '8.4'
    text: |-
      Ten aanzien van leerlingen die extra zorg behoeven, is het onderwijs gericht op individuele begeleiding die is
      afgestemd op de behoeften van de leerling.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel8
  - number: '8.5'
    text: |-
      Het onderwijs aan een speciale school voor basisonderwijs is tevens erop gericht leerlingen waar mogelijk tot het
      volgen van onderwijs in basisscholen of scholen voor voortgezet onderwijs te brengen.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel8
  - number: '8.6'
    text: De scholen voorzien in een voortgangsregistratie omtrent de ontwikkeling van leerlingen die extra zorg behoeven.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel8
  - number: '8.7'
    text: 'Het onderwijs wordt zodanig ingericht dat:'
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel8
  - number: 8.7.a
    text: |-
      de leerlingen in de eerste 4 schooljaren ten minste 3520 uren onderwijs en in de laatste 4 schooljaren ten minste
      4000 uren onderwijs ontvangen,
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel8
  - number: 8.7.b
    text: de leerlingen in beginsel binnen een tijdvak van 8 aaneensluitende jaren de school kunnen doorlopen en
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel8
  - number: 8.7.c
    text: |-
      de leerlingen per dag ten hoogste 5,5 uren onderwijs ontvangen, waarbij een evenwichtige verdeling van de
      activiteiten in acht wordt genomen, tenzij afwijking van dit maximale aantal van belang is in verband met
      activiteiten in het kader van het voorkomen en bestrijden van onderwijsachterstanden.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel8
  - number: '8.8'
    text: |-
      Het onderwijs wordt zodanig ingericht dat leerlingen die in verband met ziekte thuis verblijven dan wel zijn
      opgenomen in een ziekenhuis, op adequate wijze voldoende onderwijs kunnen genieten.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel8
  - number: '8.9'
    text: |-
      Het onderwijs wordt zodanig ingericht dat daarbij op structurele en herkenbare wijze aandacht wordt besteed aan het
      bestrijden van achterstanden in het bijzonder in de beheersing van de Nederlandse taal.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel8
  - number: '9.1'
    text: 'Het onderwijs omvat, waar mogelijk in samenhang:'
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel9
  - number: 9.1.a
    text: zintuiglijke en lichamelijke oefening;
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel9
  - number: 9.1.b
    text: Nederlandse taal;
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel9
  - number: 9.1.c
    text: rekenen en wiskunde;
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel9
  - number: 9.1.d
    text: Engelse taal;
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel9
  - number: 9.1.e
    text: enkele kennisgebieden;
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel9
  - number: 9.1.f
    text: expressie-activiteiten;
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel9
  - number: 9.1.g
    text: bevordering van sociale redzaamheid, waaronder gedrag in het verkeer;
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel9
  - number: 9.1.h
    text: bevordering van gezond gedrag.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel9
  - number: '9.2'
    text: 'Bij de kennisgebieden wordt in elk geval aandacht besteed aan:'
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel9
  - number: 9.2.a
    text: aardrijkskunde;
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel9
  - number: 9.2.b
    text: geschiedenis;
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel9
  - number: 9.2.c
    text: de natuur, waaronder biologie;
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel9
  - number: 9.2.d
    text: maatschappelijke verhoudingen, waaronder staatsinrichting;
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel9
  - number: 9.2.e
    text: geestelijke stromingen.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel9
  - number: '9.3'
    text: |-
      Bij de expressie-activiteiten wordt in elk geval aandacht besteed aan: de bevordering van het taalgebruik, tekenen,
      muziek, handvaardigheid, spel en beweging.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel9
  - number: '9.4'
    text: |-
      Op de scholen in de provincie Fryslân wordt tevens onderwijs gegeven in de Friese taal, tenzij gedeputeerde staten
      op verzoek van het bevoegd gezag ontheffing van deze verplichting hebben verleend.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel9
  - number: '9.5'
    text: |-
      Ten aanzien van de onderwijsactiviteiten, genoemd in het eerste tot en met vierde lid, worden bij algemene
      maatregel van bestuur kerndoelen vastgesteld. De algemene maatregel van bestuur bedoeld in de vorige volzin, wordt
      aan de beide Kamers der Staten-Generaal overgelegd. De maatregel treedt niet in werking dan nadat 4 weken na de
      overlegging zijn verstreken en gedurende die termijn niet door of namens een van beide Kamers de wens wordt te
      kennen gegeven dat het in die maatregel geregelde onderwerp bij de wet wordt geregeld. Alsdan wordt een daartoe
      strekkend wetsvoorstel zo spoedig mogelijk ingediend.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel9
  - number: '9.6'
    text: |-
      Voor de school geldt de eis dat zij tenminste de kerndoelen bij haar onderwijsactiviteiten als aan het eind van
      het basisonderwijs te bereiken doelstellingen hanteert. Kerndoelen geven een beschrijving van kwaliteiten van
      leerlingen op het gebied van kennis, inzicht en vaardigheden. Indien de eerste volzin niet kan worden toegepast
      voor een leerling voor wie een leerlinggebonden budget beschikbaar is dan wel voor een visueel gehandicapte
      leerling, wordt in het handelingsplan, bedoeld in [artikel 40a][ref1], aangegeven wat daarvan de reden is en welke
      vervangende onderwijsdoelen worden gehanteerd.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel40a
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 40a
        hoofdstuk: I
        paragraaf: '4'
        afdeling: '1'
  - number: '9.7'
    text: |-
      Indien een bevoegd gezag van een bijzondere school dringend bedenkingen heeft tegen de krachtens het vijfde lid
      vastgestelde kerndoelen, kan het bevoegd gezag eigen kerndoelen voor de school vaststellen. Deze kerndoelen zijn
      van gelijk niveau als de kerndoelen, bedoeld in het vijfde lid. Het bevoegd gezag zendt de vastgestelde kerndoelen
      aan de inspecteur.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel9
  - number: '9.8'
    text: |-
      Het onderwijs wordt gegeven in het Nederlands. Daar waar naast de Nederlandse taal, de Friese taal of een
      streektaal in levend gebruik is, kan de Friese taal of de streektaal mede als voertaal bij het onderwijs worden
      gebruikt. Voor de opvang in en de aansluiting bij het Nederlandse onderwijs van leerlingen met een niet-Nederlandse
      culturele achtergrond kan de taal van het land van oorsprong mede als voertaal bij het onderwijs worden gebruikt,
      overeenkomstig een door het bevoegd gezag vastgestelde gedragscode.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel9
  - number: '9.9'
    text: |-
      Onze minister kan in bijzondere gevallen op verzoek van het bevoegd gezag toestaan dat wordt afgeweken van de
      voorschriften in het eerste tot en met het derde lid. De toestemming wordt verleend voor een bepaald tijdvak; zij
      kan voorwaarden bevatten.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel9
  - number: 9a.1
    text: |-
      Bij het geven van onderwijs aan een leerling die is opgenomen in een ziekenhuis of die in verband met ziekte thuis
      verblijft, kan het bevoegd gezag van een school worden ondersteund.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel9a
  - number: 9a.2
    text: 'De ondersteuning bedoeld in het eerste lid wordt verzorgd door:'
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel9a
  - number: 9a.2.a
    text: |-
      een educatieve voorziening als bedoeld in
      [artikel 1.4, tweede lid, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1] indien de leerling
      is opgenomen in een academisch ziekenhuis of


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
  - number: 9a.2.b
    text: |-
      een schoolbegeleidingsdienst als bedoeld in [artikel 179][ref1], indien de leerling is opgenomen in een ziekenhuis
      niet zijnde een academisch ziekenhuis dan wel indien de leerling in verband met ziekte thuis verblijft.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel179
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '179'
        hoofdstuk: I
        afdeling: '12'
  - number: 9a.3
    text: |-
      De ondersteuning bedoeld in het eerste lid kan in overeenstemming tussen de educatieve voorziening dan wel de
      schoolbegeleidingsdienst en de school waarbij de leerling is ingeschreven, mede het geven van onderwijs aan de
      leerling betreffen.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel9a
  - number: '10'
    text: |-
      Het bevoegd gezag draagt zorg voor de kwaliteit van het onderwijs op de school. Onder zorg dragen voor de
      kwaliteit van het onderwijs wordt in elk geval verstaan: het uitvoeren van het in het schoolplan, bedoeld in
      [artikel 12][ref1], beschreven beleid op een zodanige wijze dat de wettelijke opdrachten voor het onderwijs en de
      door het bevoegd gezag in het schoolplan opgenomen eigen opdrachten voor het onderwijs, worden gerealiseerd.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel12
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '12'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '1'
  - number: '11'
    text: Het bevoegd gezag rapporteert over de vorderingen van de leerlingen aan hun ouders.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel11
  - number: '12.1'
    text: |-
      Het schoolplan bevat een beschrijving van het beleid met betrekking tot de kwaliteit van het onderwijs dat binnen
      de school wordt gevoerd, en omvat in elk geval het onderwijskundig beleid, het personeelsbeleid en het beleid met
      betrekking tot de bewaking en verbetering van de kwaliteit van het onderwijs. Het schoolplan omvat mede het beleid
      ten aanzien van de aanvaarding van materiële bijdragen of geldelijke bijdragen, niet zijnde ouderbijdragen of op
      de onderwijswetgeving gebaseerde bijdragen, indien het bevoegd gezag daarbij verplichtingen op zich neemt waarmee
      de leerlingen binnen de schooltijden en tijdens de activiteiten die worden georganiseerd onder verantwoordelijkheid
      van het bevoegd gezag, alsmede tijdens het overblijven, zullen worden geconfronteerd. Het schoolplan kan op een of
      meer scholen voor basisonderwijs en een of meer scholen voor ander onderwijs van hetzelfde bevoegd gezag betrekking
      hebben.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel12
  - number: '12.2'
    text: |-
      Het onderwijskundig beleid omvat in elk geval de uitwerking van de wettelijke opdrachten voor het onderwijs
      en van de door het bevoegd gezag in het schoolplan opgenomen eigen opdrachten voor het onderwijs in een
      onderwijsprogramma. Daarbij worden tevens betrokken de voorzieningen die zijn getroffen voor leerlingen met
      specifieke onderwijsbehoeften en voor leerlingen voor wie een leerlinggebonden budget beschikbaar is.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel12
  - number: '12.3'
    text: |-
      Het personeelsbeleid, voor zover dat in het schoolplan tot uitdrukking wordt gebracht, omvat in elk geval
      maatregelen met betrekking tot het personeel die bijdragen aan de ontwikkeling en de uitvoering van het
      onderwijskundig beleid alsmede het document inzake evenredige vertegenwoordiging van vrouwen in de schoolleiding,
      bedoeld in [artikel 30][ref1] van de wet.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel30
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '30'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: '1'
  - number: '12.4'
    text: |-
      Het beleid met betrekking tot de bewaking en verbetering van de kwaliteit van het onderwijs omvat in elk geval
      op welke wijze het bevoegd gezag bewaakt dat die kwaliteit wordt gerealiseerd en vaststelt welke maatregelen ter
      verbetering van de kwaliteit nodig zijn.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel12
  - number: '13.1'
    text: |-
      De schoolgids bevat voor ouders, verzorgers en leerlingen informatie over de werkwijze van de school en bevat in
      elk geval informatie over:
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel13
  - number: 13.1.a
    text: |-
      de doelen van het onderwijs en de resultaten die met het onderwijsleerproces worden bereikt, met dien verstande dat
      bij algemene maatregel van bestuur voorschriften kunnen worden gegeven met betrekking tot de wijze waarop
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel13
  - number: 13.1.a.1°
    text: de resultaten worden beschreven die met het onderwijsleerproces worden bereikt, en
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel13
  - number: 13.1.a.2°
    text: de context wordt vermeld waarin de onder 1° bedoelde resultaten dienen te worden geplaatst.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel13
  - number: 13.1.b
    text: de wijze waarop aan de zorg voor het jonge kind wordt vormgegeven,
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel13
  - number: 13.1.c
    text: |-
      de wijze waarop aan de zorg voor leerlingen met specifieke onderwijsbehoeften en voor leerlingen voor wie een
      leerlinggebonden budget beschikbaar is, wordt vormgegeven
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel13
  - number: 13.1.d
    text: de wijze waarop de verplichte onderwijstijd wordt benut,
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel13
  - number: 13.1.e
    text: |-
      de geldelijke bijdrage, bedoeld in [artikel 40, eerste lid][ref1], waarbij een ontwerp van een overeenkomst voor
      een dergelijke bijdrage, die voldoet aan de eisen die in [artikel 40, eerste lid][ref2], zijn geformuleerd, in de
      schoolgids wordt opgenomen,


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel40
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '40'
        hoofdstuk: I
        paragraaf: '4'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '40'
        hoofdstuk: I
        paragraaf: '4'
        afdeling: '1'
  - number: 13.1.f
    text: |-
      de rechten en plichten van de ouders, de verzorgers, de leerlingen en het bevoegd gezag, waaronder de informatie
      over de klachtenregeling, bedoeld in [artikel 14][ref1], en de gronden voor vrijstelling van het onderwijs, bedoeld
      in [artikel 41, tweede lid][ref2], en


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel41
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '14'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '41'
        hoofdstuk: I
        paragraaf: '4'
        afdeling: '1'
  - number: 13.1.g
    text: |-
      de wijze waarop het bevoegd gezag omgaat met de in [artikel 12, eerste lid][ref1], omschreven bijdragen.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel12
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '12'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '1'
  - number: '13.2'
    text: |-
      Het bevoegd gezag reikt de schoolgids uit aan de ouders dan wel de verzorgers bij de inschrijving en jaarlijks na
      de vaststelling van de schoolgids.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel13
  - number: '13.3'
    text: |-
      De algemene maatregel van bestuur, bedoeld in het eerste lid, onder a, wordt aan de beide kamers der Staten-
      Generaal overgelegd. De maatregel treedt niet in werking dan nadat 4 weken na de overlegging zijn verstreken en
      gedurende die termijn niet door of namens een der kamers de wens te kennen wordt gegeven dat het in die maatregel
      geregelde onderwerp bij de wet wordt geregeld. Alsdan wordt een daartoe strekkend wetsvoorstel zo spoedig mogelijk
      ingediend.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel13
  - number: '14.1'
    text: |-
      Ouders dan wel verzorgers, en personeelsleden kunnen bij de klachtencommissie, bedoeld in het tweede lid, onderdeel
      a, een klacht indienen over gedragingen en beslissingen van het bevoegd gezag, personeel of de permanente commissie
      leerlingenzorg, waaronder discriminatie, dan wel het nalaten van gedragingen en het niet nemen van beslissingen
      door het bevoegd gezag, het personeel of de permanente commissie leerlingenzorg.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel14
  - number: '14.2'
    text: 'Het bevoegd gezag treft een regeling voor de behandeling van klachten. Deze regeling vermeldt in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel14
  - number: 14.2.a
    text: de instelling van een klachtencommissie, die klachten behandelt,
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel14
  - number: 14.2.b
    text: de wijze waarop de klachtencommissie haar werkzaamheden verricht,
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel14
  - number: 14.2.c
    text: de termijn waarbinnen de klager een klacht kan indienen en
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel14
  - number: 14.2.d
    text: |-
      de termijn waarbinnen mededeling plaatsvindt van het oordeel, bedoeld in het zesde lid, en hoe bij noodzakelijke
      afwijking van deze termijn wordt gehandeld.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel14
  - number: '14.3'
    text: |-
      Deze regeling strekt ter vervanging van klachtenregelingen op grond van andere voorschriften dan dit artikel en
      strekt niet ter vervanging van een andere voorziening die op grond van een wettelijke regeling, niet zijnde een
      klachtenregeling, voor de klager openstaat of heeft opengestaan.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel14
  - number: '14.4'
    text: Deze regeling
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel14
  - number: 14.4.a
    text: |-
      voorziet erin dat de klachten worden behandeld door een klachtencommissie die bestaat uit ten minste drie leden,
      waaronder een voorzitter die geen deel uitmaakt van het bevoegd gezag en niet werkzaam is voor of bij het bevoegd
      gezag en
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel14
  - number: 14.4.b
    text: |-
      waarborgt dat aan de behandeling van een klacht niet wordt deelgenomen door een persoon op wiens gedraging de
      klacht rechtstreeks betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel14
  - number: '14.5'
    text: 'De klager en degene over wie is geklaagd dan wel de instantie waarover is geklaagd krijgen de gelegenheid:'
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel14
  - number: 14.5.a
    text: hun zienswijze mondeling of schriftelijk toe te lichten en
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel14
  - number: 14.5.b
    text: zich bij de behandeling van de klacht te laten bijstaan.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel14
  - number: '14.6'
    text: |-
      De klachtencommissie vormt zich een oordeel over de gegrondheid van de klacht en deelt dit oordeel, al dan niet
      vergezeld van aanbevelingen, schriftelijk mede aan de klager, degene over wie is geklaagd dan wel de instantie
      waarover is geklaagd en het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel14
  - number: '14.7'
    text: |-
      Het bevoegd gezag deelt de klager en de klachtencommissie, bedoeld in het tweede lid, onderdeel a, binnen 4 weken
      na ontvangst van het in het zesde lid bedoelde oordeel van de klachtencommissie schriftelijk mede of hij het
      oordeel over de gegrondheid van de klacht deelt en of hij naar aanleiding van dat oordeel maatregelen zal nemen en
      zo ja welke. Bij afwijking van de in de eerste volzin bedoelde termijn, doet het bevoegd gezag daarvan met redenen
      omkleed mededeling aan de klager en de klachtencommissie onder vermelding van de termijn waarbinnen het bevoegd
      gezag zijn standpunt bekend zal maken.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel14
  - number: '14.8'
    text: |-
      Degene die betrokken is bij de uitvoering van dit artikel en daarbij de beschikking krijgt over gegevens waarvan
      hij het vertrouwelijke karakter kent of redelijkerwijze moet vermoeden, is verplicht tot geheimhouding daarvan,
      behoudens voor zover enig wettelijk voorschrift hem tot mededeling verplicht of uit zijn taak de noodzaak tot
      mededeling voortvloeit.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel14
  - number: '14.9'
    text: |-
      Gegevens die betrekking hebben op een klacht worden bewaard op een plaats die uitsluitend toegankelijk is voor de
      leden van de klachtencommissie en het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel14
  - number: '15.1'
    text: |-
      Indien een leerling gedurende een deel van de week onderwijs ontvangt op een andere school, op een school voor
      speciaal onderwijs, op een school voor speciaal en voortgezet speciaal onderwijs, dan wel op een instelling voor
      speciaal en voortgezet speciaal onderwijs telt de tijd gedurende welke de leerling dit onderwijs ontvangt mee voor
      het aantal uren onderwijs dat de leerling ten minste moet ontvangen.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel15
  - number: '15.2'
    text: |-
      Bij ministeriële regeling kunnen begin en eind van de zomervakantie worden vastgesteld die niet voor alle scholen
      gelijk behoeven te zijn.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel15
  - number: '16.1'
    text: Het bevoegd gezag stelt ten minste eenmaal in de 4 jaar het schoolplan vast.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel16
  - number: '16.2'
    text: Het bevoegd gezag stelt jaarlijks de schoolgids vast ten behoeve van het eerstvolgende schooljaar.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel16
  - number: '16.3'
    text: |-
      Het bevoegd gezag zendt het schoolplan dan wel de wijzigingen daarvan en de schoolgids onmiddellijk na de
      vaststelling aan de inspecteur.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel16
  - number: '17.1'
    text: |-
      De instandhouding van een of meer openbare en een of meer bijzondere scholen kan worden opgedragen of overgedragen
      aan een stichting die met dit doel wordt onderscheidenlijk is opgericht.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel17
  - number: '17.2'
    text: |-
      Het statutaire doel van de stichting is in elk geval het geven van openbaar onderwijs en onderwijs van een of meer
      richtingen in afzonderlijke scholen voor openbaar onderscheidenlijk bijzonder onderwijs.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel17
  - number: '17.3'
    text: |-
      De stichting oefent met uitzondering van de besluitvorming over de opheffing van een openbare school alle taken en
      bevoegdheden van het bevoegd gezag uit.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel17
  - number: '17.4'
    text: |-
      Het personeel dat werkzaam is aan de openbare school en niet zonder benoeming is tewerkgesteld, wordt benoemd
      krachtens een arbeidsovereenkomst naar burgerlijk recht.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel17
  - number: '17.5'
    text: 'De statuten voorzien in ieder geval in een regeling omtrent:'
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel17
  - number: 17.5.a
    text: de samenstelling, werkwijze en inrichting van het bestuur van de stichting,
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel17
  - number: 17.5.b
    text: de wijze van benoeming, herbenoeming, schorsing en ontslag van de bestuursleden,
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel17
  - number: 17.5.c
    text: de termijn waarvoor de bestuursleden worden benoemd,
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel17
  - number: 17.5.d
    text: |-
      de vaststelling van de begroting en jaarrekening na overleg met de gemeenteraad van de gemeente waarin de openbare
      school is gelegen,
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel17
  - number: 17.5.e
    text: |-
      de wijze waarop de gemeenteraad van de gemeente waarin de openbare school is gelegen, toezicht op het bestuur van
      de openbare school uitoefent,
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel17
  - number: 17.5.f
    text: de gronden waarop het bestuur kan besluiten de vergaderingen besloten te houden,
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel17
  - number: 17.5.g
    text: |-
      de periode waarvoor de stichting in het leven wordt geroepen, met dien verstande dat deze periode ten minste 5
      jaren bedraagt, en
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel17
  - number: 17.5.h
    text: |-
      de bevoegdheid de stichting te ontbinden, met dien verstande dat in de regeling een overheersende invloed van de
      overheid in het bestuur is verzekerd voor zover het openbaar onderwijs betreft.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel17
  - number: '17.6'
    text: |-
      De statuten van de stichting kunnen slechts worden gewijzigd na goedkeuring van de gemeenteraad van de gemeente
      waarin de openbare school is gelegen. Goedkeuring kan slechts worden onthouden indien overheersende invloed van de
      overheid in het bestuur niet is verzekerd voor zover het openbaar onderwijs betreft.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel17
  - number: '17.7'
    text: |-
      Het bestuur brengt jaarlijks aan de gemeenteraad van de gemeente waarin de openbare school is gelegen, verslag uit
      over de werkzaamheden, waarbij in ieder geval aandacht wordt geschonken aan de wezenskenmerken van het openbaar
      onderwijs. Het verslag wordt bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel17
  - number: '17.8'
    text: |-
      De vergaderingen van het bestuur van de stichting zijn openbaar, tenzij het bestuur anders beslist, op gronden,
      vermeld in de statuten.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel17
  - number: '17.9'
    text: |-
      In geval van ernstige taakverwaarlozing door het bestuur of functioneren in strijd met de wet, voor zover het
      openbaar onderwijs betreft, neemt de gemeenteraad van de gemeente waarin de openbare school is gelegen, de
      maatregelen die hij nodig acht om de continuïteit van het onderwijsproces te waarborgen voor zover het openbaar
      onderwijs betreft.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel17
  - number: '18.1'
    text: |-
      Het bevoegd gezag is voor elk van zijn scholen aangesloten bij een samenwerkingsverband met een of meer
      basisscholen en een of meer speciale scholen voor basisonderwijs. Dit samenwerkingsverband stelt zich ten doel
      een samenhangend geheel van zorgvoorzieningen binnen en tussen basisscholen en in samenwerking met speciale
      scholen voor basisonderwijs te realiseren en wel zodanig dat zoveel mogelijk leerlingen een ononderbroken
      ontwikkelingsproces kunnen doormaken.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel18
  - number: '18.2'
    text: |-
      De scholen die samenwerken in een samenwerkingsverband hebben tezamen ten minste 2000 leerlingen. In afwijking van
      de eerste volzin kunnen de scholen in een samenwerkingsverband gedurende 2 achtereenvolgende schooljaren of in het
      eerste en derde schooljaar van 3 achtereenvolgende schooljaren tezamen minder dan 2000 leerlingen hebben. Uiterlijk
      met ingang van 1 augustus volgend op de in de vorige volzin bedoelde schooljaren nemen de scholen deel aan een
      samenwerkingsverband dat op 1 oktober daaropvolgend voldoet aan de norm van 2000 leerlingen.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel18
  - number: '18.3'
    text: |-
      Indien het aantal leerlingen in een samenwerkingsverband op 1 oktober minder bedraagt dan 2000 leerlingen, deelt
      Onze minister dit voor 1 februari daaropvolgend schriftelijk mee aan de bevoegde gezagsorganen van de scholen in
      het samenwerkingsverband.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel18
  - number: '18.4'
    text: Een bevoegd gezag kan de deelname aan een samenwerkingsverband voor een school beëindigen indien
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel18
  - number: 18.4.a
    text: |-
      een regeling is getroffen met de overige bevoegde gezagsorganen ten aanzien van de financiële en personele
      consequenties daarvan en
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel18
  - number: 18.4.b
    text: |-
      door de beëindiging van de deelname geen aanspraken ontstaan op ontslaguitkeringen voor personeel dat werkzaam is
      bij de deelnemende scholen, waaronder de school waarvoor de deelname wordt beëindigd.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel18
  - number: '18.5'
    text: |-
      Bij de beëindiging van de deelname op grond van het vierde lid wordt een termijn van 1 jaar in acht genomen.
      Deze termijn geldt niet voor scholen die deelnemen aan een samenwerkingsverband dat gedurende het tweede
      achtereenvolgende schooljaar dan wel het tweede van 3 achtereenvolgende schooljaren niet voldoet aan de norm van
      2000 leerlingen.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel18
  - number: '18.6'
    text: |-
      De beëindiging van de deelname aan een samenwerkingsverband en de aansluiting bij een nieuw samenwerkingsverband
      gaan in op 1 augustus van een schooljaar. Voor 1 oktober of in het geval, bedoeld in het vijfde lid, tweede
      volzin, 1 april van het daaraan voorafgaande schooljaar meldt het bevoegd gezag de beëindiging onderscheidenlijk de
      aansluiting aan Onze minister.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel18
  - number: '18.7'
    text: |-
      Onze minister kan ermee instemmen dat, in afwijking van het eerste lid, eerste volzin, van het samenwerkingsverband
      geen speciale school voor basisonderwijs deel uitmaakt en dat het eerste lid, tweede volzin, niet van toepassing
      is voor zover het betreft de samenwerking met speciale scholen voor basisonderwijs. Onze minister stemt slechts
      in indien
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel18
  - number: 18.7.a
    text: |-
      in een adequate onderwijskundige opvang van leerlingen wordt voorzien en de inspectie hierover een positief advies
      heeft uitgebracht, en
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel18
  - number: 18.7.b
    text: |-
      alle bevoegde gezagsorganen van de scholen in het samenwerkingsverband met het samenwerkingsverband waarvoor de
      instemming is gevraagd, instemmen.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel18
  - number: '18.8'
    text: |-
      Het bevoegd gezag kan per basisschool slechts deelnemen aan 1 samenwerkingsverband. Bij deelname aan meer dan
      één samenwerkingsverband is voor de toepassing van deze wet en de daarop gebaseerde voorschriften uitsluitend de
      deelname van belang aan het samenwerkingsverband waarbij voor het eerst werd aangesloten.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel18
  - number: '18.9'
    text: |-
      Indien een bevoegd gezag wenst deel te nemen aan een samenwerkingsverband, wordt deze deelname door de bevoegde
      gezagsorganen van het samenwerkingsverband niet geweigerd.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel18
  - number: '19.1'
    text: |-
      De bevoegde gezagsorganen van de scholen die samenwerken in een samenwerkingsverband stellen jaarlijks voor 1 mei
      een zorgplan vast voor het daaropvolgende schooljaar.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel19
  - number: '19.2'
    text: 'Het zorgplan bevat in elk geval:'
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel19
  - number: 19.2.a
    text: |-
      de wijze waarop wordt voldaan aan [artikel 18, eerste lid][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel18
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '18'
        hoofdstuk: I
        paragraaf: '2'
        afdeling: '1'
  - number: 19.2.b
    text: |-
      de wijze, waarop de bekostiging voor de zorgvoorzieningen, bedoeld in [artikel 120, vierde lid][ref1], en
      [artikel 132][ref2], en het daaraan gerelateerde personeel wordt ingezet, alsmede de basisscholen waaraan de
      bekostiging, bedoeld in [artikel 132][ref3], wordt overgedragen,


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel120
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel132
      [ref3]: https://wetten.overheid.nl/BWBR0003420#Artikel132
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '120'
        hoofdstuk: I
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '132'
        hoofdstuk: I
        afdeling: '7'
      - id: ref3
        bwb_id: BWBR0003420
        artikel: '132'
        hoofdstuk: I
        afdeling: '7'
  - number: 19.2.c
    text: |-
      de beoogde en bereikte kwalitatieve en kwantitatieve resultaten ten aanzien van de onderwijskundige opvang van de
      leerlingen die extra zorg behoeven,
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel19
  - number: 19.2.d
    text: |-
      de samenstelling, werkwijze en financiering van een permanente commissie leerlingenzorg als bedoeld in
      [artikel 23][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel23
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '23'
        hoofdstuk: I
        paragraaf: '2'
        afdeling: '1'
  - number: 19.2.e
    text: de procedures voor onderzoek van leerlingen en plaatsing van leerlingen op een speciale school voor basisonderwijs,
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel19
  - number: 19.2.f
    text: |-
      de wijze waarop aan de ouders informatie wordt verstrekt over de zorgvoorzieningen en de criteria die de permanente
      commissie leerlingenzorg hanteert,
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel19
  - number: 19.2.g
    text: |-
      de wijze waarop de ouders in de gelegenheid worden gesteld informatie te verstrekken aan de permanente commissie
      leerlingenzorg, en
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel19
  - number: 19.2.h
    text: de wijze waarop de permanente commissie leerlingenzorg informatie verstrekt aan de klachtencommissie.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel19
  - number: '19.3'
    text: |-
      Het zorgplan wordt voor 15 mei voorafgaand aan het schooljaar waarop het betrekking heeft, toegezonden aan de
      inspectie.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel19
  - number: '20.1'
    text: |-
      Indien verschillende bevoegde gezagsorganen samenwerken in een samenwerkingsverband stellen zij een reglement vast.
      Het reglement bevat in elk geval een regeling voor:
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel20
  - number: 20.1.a
    text: |-
      de wijze waarop het zorgplan, bedoeld in [artikel 19][ref1], wordt vastgesteld,


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel19
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '19'
        hoofdstuk: I
        paragraaf: '2'
        afdeling: '1'
  - number: 20.1.b
    text: de wijze waarop over het zorgplan in het kader van de medezeggenschap overleg plaatsvindt,
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel20
  - number: 20.1.c
    text: |-
      de wijze waarop over arbeidsvoorwaardelijke aspecten van het zorgplan decentraal georganiseerd overleg wordt
      gevoerd,
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel20
  - number: 20.1.d
    text: |-
      de wijze waarop wordt bepaald of de situaties, bedoeld in de [artikelen 118][ref1] en [124][ref2], zich voordoen,
      waaronder de vaststelling van de in [artikel 124, eerste en tweede lid][ref3], bedoelde peildatum, die is gelegen
      in de periode van 2 oktober tot en met 31 juli daaropvolgend,


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel118
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel124
      [ref3]: https://wetten.overheid.nl/BWBR0003420#Artikel124
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '118'
        hoofdstuk: I
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '124'
        hoofdstuk: I
        afdeling: '5'
      - id: ref3
        bwb_id: BWBR0003420
        artikel: '124'
        hoofdstuk: I
        afdeling: '5'
  - number: 20.1.e
    text: |-
      de wijze waarop wordt vastgesteld wat het aandeel van de onderscheiden scholen is in de overdracht van
      de bekostiging voor materiële instandhouding in een situatie als bedoeld in [artikel 118][ref1] en van de
      bekostiging voor zorgvoorzieningen in een situatie als bedoeld in [artikel 124, zesde of zevende lid][ref2], of
      [artikel 125, zesde lid][ref3], en


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel118
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel124
      [ref3]: https://wetten.overheid.nl/BWBR0003420#Artikel125
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '118'
        hoofdstuk: I
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '124'
        hoofdstuk: I
        afdeling: '5'
      - id: ref3
        bwb_id: BWBR0003420
        artikel: '125'
        hoofdstuk: I
        afdeling: '5'
  - number: 20.1.f
    text: |-
      de wijze waarop beslissingen worden genomen, onverminderd het tweede lid, alsmede het aantal stemmen voor elk
      afzonderlijk bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel20
  - number: '20.2'
    text: |-
      Bij reglement kan met inachtneming van de tweede volzin, onderdelen a, b en c, per onderwerp verschillend de wijze
      van beslissen worden geregeld. Indien voor een onderwerp geen wijze van beslissen is geregeld, geschiedt de wijze
      van beslissen bij meerderheid van stemmen, met dien verstande dat
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel20
  - number: 20.2.a
    text: |-
      voor een beslissing over de inzet van de bekostiging voor zorgvoorzieningen, bedoeld in
      [artikel 120, vierde lid][ref1], tevens de instemming is vereist van de bevoegde gezagsorganen van alle speciale
      scholen voor basisonderwijs in het samenwerkingsverband,


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel120
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '120'
        hoofdstuk: I
        afdeling: '5'
  - number: 20.2.b
    text: |-
      voor een beslissing tot samenvoeging van 2 of meer speciale scholen voor basisonderwijs tevens de instemming is
      vereist van de bevoegde gezagsorganen van de desbetreffende scholen, en
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel20
  - number: 20.2.c
    text: |-
      voor een beslissing tot wijziging van het reglement of tot algehele samenvoeging van het verband met een ander
      verband in plaats van meerderheid van stemmen de instemming is vereist van de bevoegde gezagsorganen van alle
      scholen in het samenwerkingsverband.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel20
  - number: '21'
    text: |-
      Indien verschillende bevoegde gezagsorganen samenwerken in een samenwerkingsverband zijn zij aangesloten bij
      dezelfde centrale dienst.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel21
  - number: '22.1'
    text: Onze minister stelt een landelijke geschillencommissie voor samenwerkingsverbanden in.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel22
  - number: '22.2'
    text: |-
      De commissie bestaat uit een voorzitter en 4 leden, die allen door Onze minister worden benoemd. De 4 leden worden
      benoemd op voordracht van de gezamenlijke besturenorganisaties en de Vereniging van Nederlandse Gemeenten. De
      voorzitter is een jurist.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel22
  - number: '22.3'
    text: |-
      De voorzitter en de leden worden benoemd voor een termijn van 4 jaar. Zij zijn opnieuw benoembaar. Op eigen verzoek
      wordt aan hen ontslag verleend.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel22
  - number: '22.4'
    text: Het bevoegd gezag van een school kan voorziening vragen bij de landelijke geschillencommissie tegen
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel22
  - number: 22.4.a
    text: beslissingen en andere handelingen inzake de totstandkoming van het reglement,
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel22
  - number: 22.4.b
    text: beslissingen en andere handelingen in het kader van het samenwerkingsverband,
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel22
  - number: 22.4.c
    text: |-
      de weigering van instemming door het bevoegd gezag van een speciale school voor basisonderwijs met een beslissing
      als bedoeld in [artikel 20, tweede lid onder a][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel20
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '20'
        hoofdstuk: I
        paragraaf: '2'
        afdeling: '1'
  - number: 22.4.d
    text: |-
      de weigering van instemming door het bevoegd gezag van een school met een beslissing als bedoeld in
      [artikel 20, tweede lid onder c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel20
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '20'
        hoofdstuk: I
        paragraaf: '2'
        afdeling: '1'
  - number: '22.5'
    text: |-
      De uitspraak van de geschillencommissie is bindend voor de bevoegde gezagsorganen van de scholen in het
      samenwerkingsverband.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel22
  - number: '22.6'
    text: |-
      Tegen de uitspraak van de geschillencommissie kan beroep worden ingesteld bij de Afdeling bestuursrechtspraak van
      de Raad van State. De uitspraak bedoeld in de eerste volzin wordt gelijkgesteld met een uitspraak in administratief
      beroep.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel22
  - number: '22.7'
    text: |-
      Het reglement, bedoeld in [artikel 20][ref1], kan erin voorzien dat de in het vierde lid bedoelde geschillen
      worden voorgelegd aan een geschillencommissie die door het samenwerkingsverband, al dan niet tezamen met andere
      samenwerkingsverbanden is ingesteld. In dat geval is het vierde lid niet van toepassing en zijn het vijfde en zesde
      lid van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel20
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '20'
        hoofdstuk: I
        paragraaf: '2'
        afdeling: '1'
  - number: '23.1'
    text: |-
      Het bevoegd gezag of de bevoegde gezagsorganen van scholen in een samenwerkingsverband stellen een permanente
      commissie leerlingenzorg in. Deze commissie bepaalt op aanvraag van de ouders of plaatsing van een leerling
      op een speciale school voor basisonderwijs noodzakelijk is. De commissie weigert de toelaatbaarheid tot
      een speciale school voor basisonderwijs niet op grond van het feit dat de leerling aangewezen zou zijn op
      een onderwijssoort binnen een cluster als bedoeld in [artikel 2, vierde lid onder b of c][ref1], dan wel
      tot het cluster, bedoeld in [genoemd artikel onder d, van de Wet op de expertisecentra][ref2], indien een
      commissie voor de indicatiestelling, bedoeld in [artikel 28c van genoemde wet][ref3], heeft geoordeeld dat
      die leerling niet toelaatbaar is tot een onderwijssoort binnen dat cluster dan wel tot het cluster, bedoeld in
      [artikel 2, vierde lid onder d, van die wet][ref4]. De commissie kan voorts worden belast met andere taken. Indien
      sprake is van een samenwerkingsverband zonder speciale school voor basisonderwijs is de tweede volzin niet van
      toepassing en adviseert de commissie in elk geval


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel28c
      [ref4]: https://wetten.overheid.nl/BWBR0003549#Artikel2
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0003549
        artikel: 28c
      - id: ref4
        bwb_id: BWBR0003549
        artikel: '2'
  - number: 23.1.a
    text: |-
      op verzoek van de ouders of het bevoegd gezag van de basisschool die de leerling bezoekt over de wijze waarop een
      leerling op die school kan worden begeleid, en
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel23
  - number: 23.1.b
    text: |-
      indien in het samenwerkingsverband voorzieningen zijn getroffen ten behoeve van de basisscholen voor de opvang van
      kinderen die extra zorg behoeven over de verwijzing naar die voorzieningen.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel23
  - number: '23.2'
    text: De permanente commissie leerlingenzorg bestaat uit ten minste 3 leden.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel23
  - number: '23.3'
    text: |-
      Alvorens een beslissing te nemen op een aanvraag als bedoeld in het eerste lid, tweede volzin, vraagt de commissie
      aan de school van de leerling de gegevens, bedoeld in [artikel 43, eerste onderscheidenlijk tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel43
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '43'
        hoofdstuk: I
        paragraaf: '4'
        afdeling: '1'
  - number: '23.4'
    text: |-
      Een aanvraag als bedoeld in het eerste lid, tweede volzin, wordt niet in behandeling genomen indien de leerling
      afkomstig is van een basisschool van een ander samenwerkingsverband dan dat van de permanente commissie
      leerlingenzorg en de permanente commissie leerlingenzorg van dat andere samenwerkingsverband geen onherroepelijk
      geworden beslissing als bedoeld in het eerste lid, tweede volzin, heeft genomen. De eerste volzin is niet van
      toepassing indien de aanvraag plaatsvindt in verband met een verhuizing van de leerling.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel23
  - number: '23.5'
    text: |-
      Alvorens een beslissing te nemen op een bezwaarschrift vraagt de permanente commissie leerlingenzorg advies aan de
      regionale verwijzingscommissie, bedoeld in [artikel 24][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel24
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '24'
        hoofdstuk: I
        paragraaf: '2'
        afdeling: '1'
  - number: '23.6'
    text: |-
      Een beslissing van de permanente commissie leerlingenzorg als bedoeld in het eerste lid,
      tweede volzin, wordt aangemerkt als een beschikking van een bestuursorgaan als bedoeld in
      [artikel 1:1, eerste lid, van de Algemene wet bestuursrecht][ref1]. Deze beschikking is geen besluit als bedoeld in
      [artikel 8:4, onderdeel e, van de Algemene wet bestuursrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '23.7'
    text: |-
      De permanente commissie leerlingenzorg stelt indien de ouders bij een ingediende aanvraag of een ingediend
      verzoek of bezwaarschrift daarom hebben verzocht een termijn waarbinnen de ouders een deskundigenadvies of
      overige informatie kunnen indienen. De commissie betrekt de door de ouders tijdig overgelegde informatie bij de
      besluitvorming.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel23
  - number: '23.8'
    text: |-
      Beslissingen en adviezen van de permanente commissie leerlingenzorg worden in de school die de leerling bezocht
      toen het advies werd uitgebracht, bewaard tot 3 jaar nadat de leerling de school heeft verlaten, met dien verstande
      dat bij plaatsing van een leerling op een andere school in het samenwerkingsverband de beslissing of het advies in
      die school wordt bewaard tot 3 jaar nadat de leerling die school heeft verlaten.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel23
  - number: '24.1'
    text: |-
      Onze minister kan een regionale verwijzingscommissie instellen, dan wel erkennen op voorstel van een
      schoolbegeleidingsdienst als bedoeld in [artikel 179][ref1]. Een regionale verwijzingscommissie brengt binnen
      4 weken na een verzoek als bedoeld in [artikel 23, vijfde lid][ref2], advies uit aan de permanente commissie
      leerlingenzorg.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel179
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel23
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '179'
        hoofdstuk: I
        afdeling: '12'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '23'
        hoofdstuk: I
        paragraaf: '2'
        afdeling: '1'
  - number: '24.2'
    text: Een regionale verwijzingscommissie is werkzaam voor een bij algemene maatregel van bestuur vastgestelde regio.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel24
  - number: '24.3'
    text: |-
      Het verzoek, bedoeld in [artikel 23, vijfde lid][ref1], wordt ingediend bij


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel23
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '23'
        hoofdstuk: I
        paragraaf: '2'
        afdeling: '1'
  - number: 24.3.a
    text: |-
      de regionale verwijzingscommissie die werkzaam is voor de regio waarin de school of de school voor speciaal
      onderwijs of speciaal en voortgezet speciaal onderwijs die de leerling bezoekt, is gelegen,
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel24
  - number: 24.3.b
    text: bij gebreke daarvan de commissie van de regio waarbinnen de leerling woonachtig is, en
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel24
  - number: 24.3.c
    text: |-
      indien er in een regio geen regionale verwijzingscommissie is, een regionale verwijzingscommissie die is gevestigd
      in een aangrenzende regio.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel24
  - number: '24.4'
    text: |-
      In een regio kan slechts één regionale verwijzingscommissie werkzaam zijn. Indien in een regio meer dan één
      schoolbegeleidingsdienst regionaal werkzaam is, hoort Onze minister de desbetreffende schoolbegeleidingsdiensten,
      alvorens een regionale verwijzingscommissie te erkennen of in te stellen.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel24
  - number: '24.5'
    text: |-
      De algemene maatregel van bestuur, bedoeld in het tweede lid, wordt aan de Tweede Kamer der Staten-Generaal
      overgelegd. De maatregel treedt niet in werking dan nadat 4 weken na de overlegging zijn verstreken en gedurende
      die termijn niet door of namens de Kamer de wens wordt te kennen gegeven dat het in die maatregel geregelde
      onderwerp bij de wet wordt geregeld. Alsdan wordt een daartoe strekkend wetsvoorstel zo spoedig mogelijk ingediend.
      Het bepaalde in de vorige 3 volzinnen is niet van toepassing indien het ontwerp van de algemene maatregel van
      bestuur voordien aan de Kamer is overgelegd en door of namens de Kamer te kennen is gegeven dat van de procedure,
      bedoeld in de vorige 3 volzinnen, kan worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel24
  - number: '25'
    text: |-
      Een regionale verwijzingscommissie die door Onze minister is erkend of ingesteld, wordt verbonden aan een regionaal
      werkzame schoolbegeleidingsdienst in de desbetreffende regio.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel25
  - number: '26'
    text: |-
      Indien Onze minister binnen 3 maanden na de opheffing van een regionale verwijzingscommissie niet een voorstel
      voor erkenning van een zodanige commissie heeft ontvangen dat door hem wordt ingewilligd, stelt hij een regionale
      verwijzingscommissie in.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel26
  - number: '27.1'
    text: |-
      Onze minister brengt een regionale verwijzingscommissie die is erkend of ingesteld, voor bekostiging in aanmerking
      indien zij:
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel27
  - number: 27.1.a
    text: jaarlijks voor 1 mei verslag uitbrengt over haar werkzaamheden in het voorafgaande kalenderjaar, en
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel27
  - number: 27.1.b
    text: jaarlijks voor 1 mei over het voorafgaande kalenderjaar rekening en verantwoording aflegt van het geldelijk beheer.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel27
  - number: '27.2'
    text: |-
      Onze minister stelt jaarlijks, op basis van het aantal leerlingen in het basisonderwijs, bedoeld in artikel 161 van
      de Wet op het primair onderwijs, van dat jaar in de desbetreffende regio, de bekostiging vast voor de werkzaamheden
      van de regionale verwijzingscommissie voor het daaropvolgende jaar.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel27
  - number: '28'
    text: |-
      Bij algemene maatregel van bestuur worden nadere voorschriften gegeven omtrent de taak, samenstelling, werkwijze
      en totstandkoming van de regionale verwijzingscommissies. De algemene maatregel van bestuur, bedoeld in de vorige
      volzin, wordt aan de Tweede Kamer der Staten-Generaal overgelegd. De maatregel treedt niet in werking dan nadat
      4 weken na de overlegging zijn verstreken en gedurende die termijn niet door of namens de Kamer de wens wordt te
      kennen gegeven dat het in die maatregel geregelde onderwerp bij de wet wordt geregeld. Alsdan wordt een daartoe
      strekkend wetsvoorstel zo spoedig mogelijk ingediend. Het bepaalde in de vorige 3 volzinnen is niet van toepassing
      indien het ontwerp van de algemene maatregel van bestuur voordien aan de Kamer is overgelegd en door of namens de
      Kamer te kennen is gegeven dat van de procedure, bedoeld in de vorige 3 volzinnen, kan worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel28
  - number: '29.1'
    text: |-
      Aan elke school zijn 1 of 2 directeuren verbonden, bij wie onder verantwoordelijkheid van het bevoegd gezag de
      onderwijskundige, organisatorische en huishoudelijke leiding berust. De functie van directeur kan minder dan een
      volledige formatieplaats omvatten. De directeur van een school kan tevens met de leiding worden belast van een
      andere school waar de functie van directeur vacant is. De directeur van een school kan tevens directeur zijn van
      een andere school of van een school als bedoeld in de [Wet op de expertisecentra][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0003549
  - number: '29.2'
    text: Aan een school zijn een of meer leraren verbonden.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel29
  - number: '29.3'
    text: |-
      Een of meer leraren kunnen tevens tot adjunct-directeur worden benoemd dan wel tewerkgesteld zonder benoeming.
      Indien geen adjunct-directeur wordt benoemd dan wel tewerkgesteld zonder benoeming en aan de school slechts 1
      directeur is verbonden, wijst het bevoegd gezag een leraar aan als plaatsvervanger van de directeur.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel29
  - number: '29.4'
    text: |-
      Voor zover het betreft de functie van directeur en adjunct-directeur, wordt in geval van samenvoeging van scholen
      de overblijvende school gelijkgesteld met een nieuwe school. De directeur, onderscheidenlijk de adjunct-directeur
      of adjunct-directeuren, kan slechts een van de directeuren onderscheidenlijk kunnen slechts een of meer van de
      adjunct-directeuren van de samen te voegen scholen zijn, tenzij geen van de betrokkenen de desbetreffende functie
      wenst te aanvaarden.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel29
  - number: '29.5'
    text: |-
      Het bevoegd gezag kan tevens personeel, dat werkzaamheden verricht ten behoeve van meer dan een school of meer dan
      een school als bedoeld in de [Wet op de expertisecentra][ref1], benoemen of te werk stellen zonder benoeming.


      [ref1]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0003549
  - number: '29.6'
    text: Aan een school kan onderwijsondersteunend personeel zijn verbonden.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel29
  - number: '29.7'
    text: |-
      Bij algemene maatregel van bestuur wordt bepaald welke rechtspositionele gevolgen zijn verbonden aan functies die
      zowel onderwijsgevende als onderwijsondersteunende taken omvatten.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel29
  - number: '29.8'
    text: |-
      Het bevoegd gezag stelt jaarlijks het beleid vast met betrekking tot de formatie van de verschillende categorieën
      personeel van de school. Indien toepassing is gegeven aan het vijfde lid, stelt het bevoegd gezag tevens jaarlijks
      het beleid vast met betrekking tot de formatie van dat personeel. Zoveel mogelijk tegelijk met de vaststelling
      van het in de eerste en tweede volzin bedoelde beleid met betrekking tot de formatie, bepaalt het bevoegd gezag
      functies en taken van het personeel van de school, met inachtneming van de daaromtrent bij algemene maatregel van
      bestuur te geven nadere voorschriften, en in voorkomend geval functies en taken van het in het vijfde lid bedoelde
      personeel.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel29
  - number: '30.1'
    text: |-
      Het bevoegd gezag stelt ten behoeve van de directies van zijn scholen, indien aan het totaal van die scholen van
      een ondervertegenwoordiging van vrouwen in de functie van directeur onderscheidenlijk adjunct-directeur sprake is,
      eenmaal in de 4 jaar een document inzake evenredige vertegenwoordiging van vrouwen in de schoolleiding vast.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel30
  - number: '30.2'
    text: |-
      Het document bevat streefcijfers, met inbegrip van een bepaald tijdvak waarbinnen deze streefcijfers worden
      gerealiseerd, aan de hand waarvan door het bevoegd gezag een beleid inzake evenredige vertegenwoordiging
      van vrouwen in de schoolleiding wordt gevoerd, opdat aan de scholen te zamen in de functie van directeur
      onderscheidenlijk adjunct-directeur vrouwen en mannen naar evenredigheid werkzaam zullen zijn. Voor de evenredige
      vertegenwoordiging wordt uitgegaan van de verhouding mannen en vrouwen voor wat betreft het onderwijzend personeel
      dat werkzaam is in het door de school verzorgde onderwijs, zoals die blijkt uit de daarover jaarlijks door Onze
      minister gepubliceerde cijfers. Het document vermeldt tevens de maatregelen die het bevoegd gezag heeft genomen
      en zal nemen teneinde de in de eerste volzin bedoelde streefcijfers te realiseren en geeft een overzicht van de
      beoogde en bereikte resultaten van het beleid inzake evenredige vertegenwoordiging van vrouwen in de schoolleiding
      gedurende de periode waarvoor het document geldt, onderscheidenlijk de periode waarvoor het vorige document gold.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel30
  - number: '30.3'
    text: |-
      Het bevoegd gezag draagt er zorg voor dat een exemplaar van het document in het gebouw van de school ter inzage
      wordt gelegd op een voor het personeel, de ouders en de leerlingen toegankelijke plaats, alsmede dat een exemplaar
      wordt bewaard bij de administratie van de school.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel30
  - number: '31.1'
    text: |-
      Het bevoegd gezag stelt na overleg met de directeur en indien toepassing is gegeven aan
      [artikel 29, vijfde lid][ref1], met het in dat artikellid bedoelde personeel voor zover dat is belast met
      managementtaken met betrekking tot de scholen en de scholen, bedoeld in de [Wet op de expertisecentra][ref2], een
      managementstatuut vast. In het managementstatuut is ten minste een regeling opgenomen betreffende de bevoegdheden
      van de directeur en indien toepassing is gegeven aan [artikel 29, vijfde lid][ref3], tevens van de bevoegdheden van
      het in dat artikellid bedoelde personeel voor zover dat is belast met managementtaken met betrekking tot de scholen
      en de scholen, bedoeld in de [Wet op de expertisecentra][ref4], met betrekking tot de toedeling, bestemming en
      aanwending van de bekostiging.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0003549
      [ref3]: https://wetten.overheid.nl/BWBR0003420#Artikel29
      [ref4]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '29'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0003549
      - id: ref3
        bwb_id: BWBR0003420
        artikel: '29'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: '1'
      - id: ref4
        bwb_id: BWBR0003549
  - number: '31.2'
    text: |-
      Het managementstatuut bevat tevens de aanduiding van de andere aan het bevoegd gezag bij wettelijk voorschrift
      toegekende taken en bevoegdheden waarvan het bevoegd gezag heeft bepaald dat de directeur van de school of
      indien toepassing is gegeven aan [artikel 29, vijfde lid][ref1], het in dat artikellid bedoelde personeel
      voor zover dat is belast met managementtaken met betrekking tot de scholen en de scholen, bedoeld in de
      [Wet op de expertisecentra][ref2] deze in naam van het bevoegd gezag kan uitoefenen. Het managementstatuut bevat
      voorts instructies ten aanzien van deze taken en bevoegdheden.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '29'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0003549
  - number: '31.3'
    text: |-
      Het bevoegd gezag draagt er zorg voor dat een exemplaar van het managementstatuut in het gebouw van de school ter
      inzage beschikbaar is op een voor een ieder toegankelijke plaats. Het bevoegd gezag zendt een exemplaar van het
      managementstatuut, alsmede elke wijziging daarvan, zo spoedig mogelijk na de vaststelling ter kennisneming aan
      de inspectie.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel31
  - number: '32.1'
    text: |-
      Directeuren, adjunct-directeuren en leraren worden door het bevoegd gezag benoemd dan wel tewerkgesteld zonder
      benoeming.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel32
  - number: '32.2'
    text: |-
      Om tot directeur, adjunct-directeur of leraar, behalve in een functie voor het geven van godsdienstonderwijs
      of levensbeschouwelijk vormingsonderwijs, te kunnen worden benoemd of tewerkgesteld zonder benoeming, dient de
      betrokkene te voldoen aan [artikel 3, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel3
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '3'
        hoofdstuk: I
  - number: '32.3'
    text: |-
      Om te kunnen worden benoemd of tewerkgesteld zonder benoeming uitsluitend voor het geven van
      godsdienstonderwijs of levensbeschouwelijk vormingsonderwijs dient de betrokkene te voldoen aan
      [artikel 3, eerste lid, onder a en c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel3
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '3'
        hoofdstuk: I
  - number: '32.4'
    text: |-
      Om te kunnen worden benoemd of tewerkgesteld zonder benoeming in een andere functie dan het geven van
      onderwijs en om te worden benoemd of tewerkgesteld zonder benoeming in een functie die bestaat uit het
      verrichten van werkzaamheden ten behoeve van meer dan een school of meer dan een school als bedoeld in de
      [Wet op de expertisecentra][ref1], niet zijnde het geven van onderwijs, dient de betrokkene:


      [ref1]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0003549
  - number: 32.4.a
    text: |-
      in het bezit te zijn van de verklaring, bedoeld in [artikel 3, eerste lid, onder a][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel3
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '3'
        hoofdstuk: I
  - number: 32.4.b
    text: te voldoen aan de overige vereisten voor de te vervullen functie.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel32
  - number: '32.5'
    text: |-
      Bij algemene maatregel van bestuur worden nadere voorschriften gegeven omtrent de vereisten, bedoeld in het vierde
      lid, onder b.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel32
  - number: '32.6'
    text: |-
      De verklaring, bedoeld in [artikel 3, eerste lid, onder a][ref1], die in verband met de benoeming of de
      tewerkstelling zonder benoeming wordt overgelegd, mag op het tijdstip van overlegging niet ouder zijn dan een bij
      algemene maatregel van bestuur te bepalen periode.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel3
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '3'
        hoofdstuk: I
  - number: '33.1'
    text: |-
      Met inachtneming van bij of krachtens algemene maatregel van bestuur vastgestelde voorschriften als bedoeld in
      het tweede lid regelt het bevoegd gezag van een openbare school de rechtspositie van het personeel en draagt het
      bevoegd gezag van een bijzondere school zorg voor de regeling van de rechtspositie van het personeel.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel33
  - number: '33.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden voor het personeel, bedoeld in [artikel 32][ref1],
      voorschriften vastgesteld betreffende:


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel32
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '32'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: '1'
  - number: 33.2.a
    text: |-
      salarissen en toelagen, door het bevoegd gezag toe te kennen bij uitoefening van een volledige weektaak of een deel
      daarvan, en
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel33
  - number: 33.2.b
    text: |-
      vakantie, verlof, aanspraken op salaris in geval van militaire dienst, ziekte of ongeval, ontslaguitkeringen,
      alsmede omtrent andere rechten en verplichtingen, dan wel de voorwaarden waaronder het bevoegd gezag een of meer
      onderdelen van in dit onderdeel bedoelde rechten en verplichtingen zelf regelt of voor de regeling daarvan zorg
      draagt.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel33
  - number: '33.3'
    text: |-
      Onder regeling van de rechtspositie als bedoeld in het eerste lid wordt voor de openbare scholen niet begrepen het
      vaststellen van bepalingen omtrent:
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel33
  - number: 33.3.a
    text: aanstelling,
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel33
  - number: 33.3.b
    text: schorsing,
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel33
  - number: 33.3.c
    text: disciplinaire maatregelen, en
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel33
  - number: 33.3.d
    text: ontslag.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel33
  - number: 33a
    text: |-
      Het bevoegd gezag benoemt, schorst en ontslaat het personeel. Van een benoeming in vaste dienst en in tijdelijke
      dienst voor langer dan een half jaar, alsmede van een ontslag uit een zodanige betrekking, doet het bevoegd gezag
      terstond mededeling aan de inspecteur.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel33a
  - number: '34.1'
    text: |-
      Het bevoegd gezag benoemt de directeur en de adjunct-directeur, de leraren en het onderwijsondersteunend personeel
      in algemene dienst van het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel34
  - number: '34.2'
    text: |-
      Onder benoeming in algemene dienst van het bevoegd gezag wordt in dit artikel en in de [artikelen 53][ref1] en
      [59][ref2] verstaan een benoeming ten behoeve van het verrichten van werkzaamheden aan door het bevoegd gezag in
      stand gehouden scholen.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel59
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '53'
        hoofdstuk: I
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '59'
        hoofdstuk: I
        afdeling: '3'
  - number: '36.1'
    text: |-
      Het bevoegd gezag is verplicht aan studenten die in opleiding zijn voor een functie in het basisonderwijs of in
      het voortgezet onderwijs, gelegenheid te bieden de als onderdeel van hun opleiding vereiste ervaring in de school
      te verkrijgen.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel36
  - number: '36.2'
    text: 'De verplichting bedoeld in het eerste lid, betreft:'
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel36
  - number: 36.2.a
    text: |-
      studenten die op een school voor de opleiding van onderwijzend personeel zijn ingeschreven of anderszins studeren
      voor een bewijs van bekwaamheid, dan wel voor een bewijs van voldoende pedagogische en didactische voorbereiding;
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel36
  - number: 36.2.b
    text: |-
      in een schooljaar gelijktijdig niet meer studenten als bedoeld onder a, dan de helft van het aantal groepsleraren
      in dat jaar.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel36
  - number: '36.3'
    text: |-
      Een bevoegd gezag kan een student de verdere toegang tot de school ontzeggen indien deze in de school in strijd
      handelt met de grondslag en doelstellingen van de school. Van een beslissing tot ontzegging van de toegang tot
      de school wordt mededeling gedaan door toezending of uitreiking van een afschrift aan het bevoegd gezag van de
      betrokken opleidingsinstelling dan wel aan de betrokken staatsexamencommissie, en aan de inspectie.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel36
  - number: '36.4'
    text: |-
      De directeur regelt, onder verantwoordelijkheid van het bevoegd gezag, de werkzaamheden in verband met de
      begeleiding door het onderwijzend personeel van de studenten in de school in overeenstemming met dit personeel,
      alsmede in overeenstemming met de betrokken opleidingsinstellingen, dan wel, indien het betreft studenten die zich
      voorbereiden op het afleggen van een staatsexamen ter verkrijging van een bewijs van bekwaamheid of een bewijs van
      voldoende pedagogische en didactische voorbereiding, in overeenstemming met de betrokken staatsexamencommissie.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel36
  - number: '36.5'
    text: |-
      Onze minister kan het bevoegd gezag op grond van bijzondere omstandigheden gehele of gedeeltelijke ontheffing van
      de verplichting verlenen. De ontheffing geldt voor een schooljaar.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel36
  - number: '36.6'
    text: |-
      De scholen waarop studenten als bedoeld in het eerste lid, zijn toegelaten, zijn toegankelijk voor de inspectie
      belast met het toezicht op de opleidingsinstellingen, voor de directeuren en de door deze aan te wijzen leraren
      van die opleidingsinstellingen, alsmede voor de leden van de betrokken staatsexamencommissies, een en ander voor
      zover zulks voor de uitoefening van het toezicht op de praktische vorming, onderscheidenlijk de begeleiding van de
      praktische vorming van de in de school aanwezige studenten noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel36
  - number: '37'
    text: |-
      Over aangelegenheden van algemeen belang voor de rechtstoestand van het personeel bedoeld in [artikel 32][ref1],
      wordt volgens bij algemene maatregel van bestuur te stellen regels overleg gevoerd met de daarvoor in aanmerking
      komende personeelsorganisaties en, voor zover zij daarbij belang hebben, organisaties van gemeente- en
      schoolbesturen. De algemene maatregel van bestuur bepaalt tevens de gevallen waarin in dat overleg overeenstemming
      met de personeelsorganisaties dient te worden bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel32
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '32'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: '1'
  - number: '38'
    text: |-
      Over de door het bevoegd gezag ingevolge [artikel 33][ref1] te treffen regelingen, alsmede over andere
      aangelegenheden van algemeen belang voor de bijzondere rechtstoestand van het personeel van de desbetreffende
      school, wordt door of namens het bevoegd gezag overleg gevoerd met de daarvoor in aanmerking komende
      vakorganisaties van overheids- en onderwijspersoneel, op een met deze schriftelijk overeengekomen wijze. In geval
      van een geschil over de deelneming aan het overleg, bedoeld in de eerste volzin, alsmede in geval van een geschil
      over de aard, de inhoud en de organisatie van het overleg leggen de betrokken partijen het geschil voor aan een
      geschillencommissie. Deze geschillencommissie bestaat uit drie personen, die door de partijen gezamenlijk worden
      aangewezen. De uitspraak van de geschillencommissie heeft bindende kracht.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel33
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '33'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: '1'
  - number: '39.1'
    text: Om als leerling tot een school te worden toegelaten, moet een kind de leeftijd van 4 jaar hebben bereikt.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel39
  - number: '39.2'
    text: |-
      Het bevoegd gezag kan voor kinderen die nog niet eerder tot een school, een school of afdeling voor speciaal
      onderwijs, een school voor speciaal en voortgezet speciaal onderwijs dan wel een instelling voor speciaal en
      voortgezet speciaal onderwijs zijn toegelaten, toelatingstijdstippen vaststellen op ten minste eenmaal per maand.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel39
  - number: '39.3'
    text: |-
      In de periode vanaf de leeftijd van 3 jaar en 10 maanden tot het bereiken van de leeftijd van 4 jaar kan het
      bevoegd gezag kinderen gedurende ten hoogste 5 dagen toelaten. Deze kinderen zijn geen leerlingen in de zin van
      de wet.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel39
  - number: '39.4'
    text: |-
      Leerlingen bij wie naar het oordeel van de directeur van de school de grondslag voor het volgen van aansluitend
      voortgezet onderwijs in voldoende mate is gelegd, verlaten aan het einde van het schooljaar de school, mits
      hierover met de ouders overeenstemming bestaat. In elk geval verlaten de leerlingen de school aan het einde van het
      schooljaar waarin zij de leeftijd van 14 jaar hebben bereikt.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel39
  - number: '40.1'
    text: |-
      De beslissing over toelating en verwijdering van leerlingen berust bij het bevoegd gezag. De
      toelating tot de school is niet afhankelijk van het houden van rechtmatig verblijf in de zin van
      [artikel 8 van de Vreemdelingenwet 2000][ref1]. De toelating mag niet afhankelijk worden gesteld van een geldelijke
      bijdrage van de ouders. Overeenkomsten waarbij ouders worden verplicht tot het betalen van een geldelijke bijdrage
      zijn nietig, behoudens voorzover zij na de toelating van de leerling tot de school schriftelijk zijn aangegaan
      en in het desbetreffende schriftelijke stuk aan de ouders kenbaar is gemaakt dat het een vrijwillige bijdrage
      betreft waarvoor de overeenkomst niet behoeft te worden aangegaan, doch waarvoor geldt dat na de ondertekening
      wel een verplichting tot betaling van de overeengekomen bijdrage bestaat. Zodanige overeenkomsten zijn evenzeer
      nietig, indien deze niet hebben voorzien in de vermelding dat de ouders de mogelijkheid hebben er voor te kiezen
      om de overeenkomst slechts voor bepaalde voorzieningen aan te gaan en ten behoeve daarvan niet een specificatie
      voor de te onderscheiden voorzieningen in de overeenkomst is opgenomen. Zodanige overeenkomsten zijn voorts nietig
      indien ten aanzien daarvan geen reductie- en kwijtscheldingsregeling geldt en de inhoud van die regeling niet in de
      overeenkomst is opgenomen. Een overeenkomst wordt telkens voor de periode van een schooljaar aangegaan.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: '40.2'
    text: |-
      Toelating van leerlingen afkomstig van een school voor speciaal onderwijs, een school voor speciaal en voortgezet
      speciaal onderwijs of een instelling voor speciaal en voortgezet speciaal onderwijs, alsmede overgang van een
      leerling naar een dergelijke school of instelling, vindt slechts plaats in overeenstemming met de ouders.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel40
  - number: '40.3'
    text: |-
      Een leerling wordt niet toegelaten tot een speciale school voor basisonderwijs dan nadat de permanente commissie
      leerlingenzorg van het samenwerkingsverband waarvan de speciale school voor basisonderwijs deel uitmaakt, heeft
      bepaald dat plaatsing van de leerling op een zodanige school noodzakelijk is. Indien de permanente commissie
      leerlingenzorg, bedoeld in de eerste volzin, heeft bepaald dat plaatsing van de leerling op een speciale school
      voor basisonderwijs noodzakelijk is, wordt de leerling toegelaten uiterlijk met ingang van het eerste van de
      volgende tijdstippen: de eerste dag na de voor de school geldende zomervakantie, de eerste dag na de voor de school
      geldende kerstvakantie dan wel 1 april.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel40
  - number: '40.4'
    text: |-
      De toelating tot een speciale school voor basisonderwijs wordt niet geweigerd op de grond dat de leerling niet
      is aangewezen op het onderwijs van een speciale school voor basisonderwijs, indien de permanente commissie
      leerlingenzorg van het samenwerkingsverband waaraan de speciale school voor basisonderwijs deelneemt heeft bepaald
      dat plaatsing van de leerling op een speciale school voor basisonderwijs noodzakelijk is. De toelating van een
      leerling van een basisschool tot een speciale school voor basisonderwijs van het samenwerkingsverband waaraan
      de basisschool deelneemt wordt voorts niet geweigerd op denominatieve gronden, tenzij de ouders van de leerling
      weigeren te verklaren dat zij de grondslag van het onderwijs van de school zullen respecteren.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel40
  - number: '40.5'
    text: |-
      Voordat wordt besloten tot verwijdering hoort het bevoegd gezag de betrokken groepsleraar. Definitieve verwijdering
      van een leerling vindt niet plaats dan nadat het bevoegd gezag ervoor heeft zorggedragen dat een andere school, een
      school voor speciaal onderwijs, een school voor speciaal en voortgezet speciaal onderwijs of een instelling voor
      speciaal en voortgezet speciaal onderwijs bereid is de leerling toe te laten. Indien aantoonbaar gedurende 8 weken
      zonder succes is gezocht naar een zodanige school of instelling waarnaar kan worden verwezen, kan in afwijking van
      de vorige volzin tot definitieve verwijdering worden overgegaan.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel40
  - number: '40.6'
    text: |-
      Indien tegen het besluit, bedoeld in het eerste lid, van het bevoegd gezag van een openbare school bezwaar is
      gemaakt, besluit het bevoegd gezag in afwijking van [artikel 7:10 van de Algemene wet bestuursrecht][ref1] binnen 4
      weken na ontvangst van het bezwaarschrift.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: 40a.1
    text: |-
      Het bevoegd gezag van een school waar een visueel gehandicapte leerling is ingeschreven of een leerling voor
      wie een leerlinggebonden budget beschikbaar is, stelt in overeenstemming met de ouders voor elk schooljaar een
      handelingsplan op. Indien de inschrijving van de in de eerste volzin bedoelde leerling plaatsvindt op of na 1
      augustus wordt het handelingsplan zo spoedig mogelijk doch uiterlijk een maand na die inschrijving opgesteld.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel40a
  - number: 40a.2
    text: |-
      In het handelingsplan dat betrekking heeft op het laatste schooljaar van de periode gedurende welke voor de
      leerling een leerlinggebonden budget beschikbaar is, wordt aangegeven dat de voortzetting van de voorzieningen die
      voor de leerling zijn getroffen op basis van het leerlinggebonden budget, afhankelijk is van een nieuwe beoordeling
      door een zodanige commissie voor de indicatiestelling.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel40a
  - number: 40a.3
    text: Het handelingsplan wordt jaarlijks met de ouders geëvalueerd.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel40a
  - number: 40b.1
    text: |-
      Onverminderd bij algemene maatregel van bestuur gegeven voorschriften met betrekking tot de in- en uitschrijving
      van leerlingen, vindt toelating van een leerling als bedoeld in artikel 40 slechts plaats nadat de ouders de
      gegevens betreffende de geslachtsnaam, de voorletters, de geboortedatum, het geslacht en het persoonsgebonden
      nummer van de leerling hebben overgelegd. Indien de ouders aannemelijk maken dat zij geen persoonsgebonden nummer
      van de leerling kunnen overleggen, vindt de toelating plaats met inachtneming van het derde lid.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel40b
  - number: 40b.2
    text: |-
      De in het eerste lid bedoelde gegevens worden overgelegd door middel van een van overheidswege verstrekt document
      dan wel een door een andere school of een school voor ander onderwijs verstrekt bewijs van uitschrijving, waarin de
      desbetreffende gegevens zijn opgenomen.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel40b
  - number: 40b.3
    text: |-
      Indien de ouders aannemelijk maken dat zij geen persoonsgebonden nummer van de leerling kunnen overleggen, meldt
      het bevoegd gezag binnen twee weken na het besluit tot toelating aan de Informatie Beheer Groep de beschikbare
      gegevens van de leerling, bedoeld in het eerste lid, alsmede zijn adres en woonplaats.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel40b
  - number: 40b.4
    text: |-
      De Informatie Beheer Groep verstrekt binnen acht weken na ontvangst van de melding, bedoeld in het derde lid,
      aan het bevoegd gezag het sociaal-fiscaalnummer van de leerling, dan wel, indien is gebleken dat hem niet van
      overheidswege een sociaal-fiscaalnummer is verstrekt, het onderwijsnummer van de leerling. Het onderwijsnummer is
      een door de Informatie Beheer Groep uitgegeven en aan de leerling toegekend persoonsgebonden nummer.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel40b
  - number: 40b.5
    text: |-
      Het bevoegd gezag neemt de in het eerste lid bedoelde gegevens op in de leerlingenadministratie van de school. Bij
      ministeriële regeling kan worden bepaald welke andere gegevens in de leerlingenadministratie worden opgenomen.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel40b
  - number: 40b.6
    text: |-
      Indien aan een leerling een onderwijsnummer is toegekend en het bevoegd gezag de beschikking krijgt over zijn
      sociaal-fiscaalnummer, neemt het bevoegd gezag dit sociaal-fiscaalnummer terstond als persoonsgebonden nummer op
      in de leerlingenadministratie van de school in de plaats van het onderwijsnummer. Het bevoegd gezag meldt deze
      wijziging binnen twee weken aan de Informatie Beheer Groep onder opgave van het sociaal-fiscaalnummer en het
      onderwijsnummer van de leerling.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel40b
  - number: '41.1'
    text: |-
      De leerlingen nemen deel aan alle voor hen bestemde onderwijsactiviteiten, met dien verstande dat die
      onderwijsactiviteiten voor de leerlingen onderling kunnen verschillen.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel41
  - number: '41.2'
    text: |-
      Het bevoegd gezag kan op verzoek van de ouders een leerling vrijstellen van het deelnemen aan bepaalde
      onderwijsactiviteiten. Een vrijstelling kan slechts worden verleend op door het bevoegd gezag vastgestelde gronden.
      Het bevoegd gezag bepaalt bij de vrijstelling welke onderwijsactiviteiten voor de leerling in de plaats komen van
      die waarvan vrijstelling is verleend.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel41
  - number: '42'
    text: |-
      Over iedere leerling die de school verlaat, stelt de directeur, na overleg met het onderwijzend personeel, ten
      behoeve van de ontvangende school of school als bedoeld in de [Wet op de expertisecentra][ref1] dan wel als bedoeld
      in de [Wet op het voortgezet onderwijs][ref2] een onderwijskundig rapport op. Afschrift van dit rapport wordt aan
      de ouders van de leerling verstrekt. Bij algemene maatregel van bestuur kunnen nadere voorschriften omtrent dit
      rapport worden gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0003549
      [ref2]: https://wetten.overheid.nl/BWBR0002399
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0003549
      - id: ref2
        bwb_id: BWBR0002399
  - number: '43.1'
    text: |-
      Binnen vier weken na een daartoe strekkend verzoek van een permanente commissie leerlingenzorg als bedoeld in
      [artikel 23][ref1] zendt de basisschool de commissie de gegevens waaruit blijkt om welke reden naar het oordeel van
      de directeur van de basisschool, mede op advies van het onderwijzend personeel van de school, de leerling niet op
      de school kan worden gehandhaafd en een beschrijving van de maatregelen die tijdens het verblijf van de leerling
      op de school zijn getroffen om te bewerkstelligen dat de leerling wel op de school zou kunnen worden gehandhaafd.
      De basisschool verstrekt de commissie desgevraagd tevens binnen vier weken alle nadere gegevens die de commissie
      verlangt en die redelijkerwijs door de school kunnen worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel23
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '23'
        hoofdstuk: I
        paragraaf: '2'
        afdeling: '1'
  - number: '43.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing bij overgang van een leerling van een speciale school voor
      basisonderwijs naar een dergelijke school in een ander samenwerkingsverband, met dien verstande dat de gegevens
      inzicht geven in de voortgang van de ontwikkeling van de leerling.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel43
  - number: '43.3'
    text: |-
      Het eerste lid is van overeenkomstige toepassing ten aanzien van een verzoek van de permanente commissie
      leerlingenzorg met betrekking tot een leerling van een school als bedoeld in de [Wet op de expertisecentra][ref1],
      met dien verstande dat de gegevens inzicht geven in de voortgang van de ontwikkeling van de leerling.


      [ref1]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0003549
  - number: '43.4'
    text: |-
      Afschrift van het rapport, bedoeld in het eerste, tweede en derde lid, wordt aan de ouders van de leerling
      verstrekt.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel43
  - number: '43.5'
    text: |-
      Bij het verstrekken van de gegevens, bedoeld in het eerste lid, meldt de basisschool wanneer en aan welke
      permanente commissie leerlingenzorg door haar reeds eerder dergelijke gegevens over de leerling werden verstrekt.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel43
  - number: '43.6'
    text: |-
      Het eerste lid is van overeenkomstige toepassing indien het een verzoek betreft van ouders van
      een leerling in het kader van hun verzoek aan de commissie voor de indicatiestelling, bedoeld in
      [artikel 28c, van de Wet op de expertisecentra][ref1]


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel28c
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 28c
  - number: '43.7'
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere voorschriften worden gegeven omtrent de in dit artikel bedoelde
      gegevens.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel43
  - number: '44'
    text: |-
      Het bevoegd gezag stelt de ouders van de leerlingen in de gelegenheid ondersteunende werkzaamheden ten behoeve
      van de school en het onderwijs te verrichten. De ouders zijn daarbij gehouden de aanwijzingen op te volgen van de
      directeur en het overige onderwijzend personeel, die verantwoordelijk blijven voor de gang van zaken.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel44
  - number: '45'
    text: |-
      Het bevoegd gezag stelt leerlingen in de gelegenheid onder toezicht de middagpauze in het schoolgebouw en op
      het terrein van de school door te brengen. De kosten die hieruit voortvloeien komen voor rekening van de ouders,
      voogden of verzorgers. Het bevoegd gezag kan de overblijfmogelijkheid zelf organiseren. Indien leerlingen van de
      mogelijkheid bedoeld in de eerste volzin gebruik maken, draagt het bevoegd gezag zorg voor een verzekering tegen
      wettelijke aansprakelijkheid. Het bevoegd gezag van een bijzondere school is, telkenmale voor de duur van een
      schooljaar, ontheven van de verplichting tot verzekering indien:
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel45
  - number: 45.a
    text: |-
      deze verplichting zich naar zijn oordeel niet verdraagt met de godsdienstige of levensbeschouwelijke overtuiging
      die aan de school ten grondslag ligt; en
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel45
  - number: 45.b
    text: het bevoegd gezag van zijn oordeel mededeling heeft gedaan aan de ouders.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel45
  - number: '46.1'
    text: |-
      Het openbaar onderwijs draagt bij aan de ontwikkeling van de leerlingen met aandacht voor de godsdienstige,
      levensbeschouwelijke en maatschappelijke waarden zoals die leven in de Nederlandse samenleving en met onderkenning
      van de betekenis van de verscheidenheid van die waarden.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel46
  - number: '46.2'
    text: Openbare scholen zijn toegankelijk voor alle kinderen zonder onderscheid van godsdienst of levensbeschouwing.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel46
  - number: '46.3'
    text: Openbaar onderwijs wordt gegeven met eerbiediging van ieders godsdienst of levensbeschouwing.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel46
  - number: '47.1'
    text: |-
      Een gemeenteraad kan bij verordening een openbare rechtspersoon instellen die tot doel heeft een of meer
      openbare scholen in de gemeente in stand te houden, al dan niet te zamen met openbare scholen als bedoeld in de
      [Wet op de expertisecentra][ref1] of openbare scholen als bedoeld in de [Wet op het voortgezet onderwijs][ref2].
      Een openbare rechtspersoon kan ook worden ingesteld door meer dan een gemeente ten behoeve van het in stand houden
      van openbare scholen in die gemeenten door het vaststellen van een voor wat betreft de onderwerpen, bedoeld in
      het vierde lid, gelijkluidende verordening, in welk geval de openbare rechtspersoon niet eerder tot stand komt dan
      nadat alle daartoe strekkende verordeningen in werking zijn getreden.


      [ref1]: https://wetten.overheid.nl/BWBR0003549
      [ref2]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0003549
      - id: ref2
        bwb_id: BWBR0003549
  - number: '47.2'
    text: De gemeenteraad of gemeenteraden maken het voornemen tot een besluit als bedoeld in het eerste lid bekend.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel47
  - number: '47.3'
    text: |-
      De openbare rechtspersoon oefent met uitzondering van de besluitvorming over de opheffing van een openbare school
      alle taken en bevoegdheden uit van het bevoegd gezag. Hij bezit rechtspersoonlijkheid.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel47
  - number: '47.4'
    text: 'De verordening, bedoeld in het eerste lid, voorziet in ieder geval in een regeling omtrent:'
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel47
  - number: 47.4.a
    text: de samenstelling, werkwijze en inrichting van het bestuur van de openbare rechtspersoon,
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel47
  - number: 47.4.b
    text: |-
      de wijze van benoeming, herbenoeming, schorsing en ontslag van de bestuursleden, met dien verstande dat de leden
      van het bestuur worden benoemd door de gemeenteraad of gemeenteraden en dat ten minste een derde gedeelte, doch
      geen meerderheid, van die leden wordt benoemd op bindende voordracht van de ouders van de leerlingen die zijn
      ingeschreven op de betrokken school of scholen,
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel47
  - number: 47.4.c
    text: de termijn waarvoor de bestuursleden worden benoemd,
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel47
  - number: 47.4.d
    text: |-
      de vaststelling van de begroting na goedkeuring door de desbetreffende gemeenteraad of gemeenteraden en de
      vaststelling van de jaarrekening na instemming van de desbetreffende gemeenteraad of gemeenteraden,
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel47
  - number: 47.4.e
    text: de wijze waarop de gemeenteraad of gemeenteraden toezicht op het bestuur uitoefenen,
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel47
  - number: 47.4.f
    text: de gronden waarop het bestuur kan besluiten de vergaderingen besloten te houden, en
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel47
  - number: 47.4.g
    text: |-
      de periode waarvoor de openbare rechtspersoon in het leven wordt geroepen, met dien verstande dat deze periode ten
      minste 5 jaren bedraagt,
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel47
  - number: '47.5'
    text: |-
      Het bestuur brengt jaarlijks aan de gemeenteraad of gemeenteraden verslag uit over de werkzaamheden, waarbij in
      ieder geval aandacht wordt geschonken aan de wezenskenmerken van het openbaar onderwijs. Het verslag wordt openbaar
      gemaakt.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel47
  - number: '47.6'
    text: |-
      De vergaderingen van het bestuur van de openbare rechtspersoon zijn openbaar, tenzij het bestuur anders beslist, op
      gronden, vermeld in de verordening.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel47
  - number: '47.7'
    text: |-
      Indien voor 1 februari van het jaar waarvoor de begroting geldt, de begroting niet is goedgekeurd, neemt de
      gemeenteraad of gemeenteraden de maatregelen die zij nodig achten om de continuïteit van het onderwijsproces te
      waarborgen.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel47
  - number: '47.8'
    text: |-
      De gemeenteraad of gemeenteraden zijn in geval van ernstige taakverwaarlozing door het bestuur of functioneren
      in strijd met de wet bevoegd zelf te voorzien in het bestuur van de scholen en zo nodig de openbare rechtspersoon
      te ontbinden.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel47
  - number: '48.1'
    text: |-
      Een gemeenteraad kan besluiten dat een of meer openbare scholen in de gemeente in stand worden gehouden door
      een stichting die zich ten doel stelt het in stand houden van een of meer openbare scholen, al dan niet te zamen
      met openbare scholen als bedoeld in de [Wet op de expertisecentra][ref1] of openbare scholen als bedoeld in de
      [Wet op het voortgezet onderwijs][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003549
      [ref2]: https://wetten.overheid.nl/BWBR0002399
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0003549
      - id: ref2
        bwb_id: BWBR0002399
  - number: '48.2'
    text: De gemeenteraad maakt het voornemen tot een besluit als bedoeld in het eerste lid bekend.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel48
  - number: '48.3'
    text: |-
      Een stichting die een openbare school in stand houdt, wordt opgericht door een of meer gemeenten, al dan niet te
      zamen met een of meer privaatrechtelijke rechtspersonen met volledige rechtsbevoegdheid.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel48
  - number: '48.4'
    text: Het statutaire doel van de stichting is uitsluitend het geven van openbaar onderwijs overeenkomstig artikel 46.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel48
  - number: '48.5'
    text: |-
      De stichting oefent met uitzondering van de besluitvorming over de opheffing van een openbare school alle taken en
      bevoegdheden van het bevoegd gezag uit.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel48
  - number: '48.6'
    text: 'Onverminderd het vierde lid voorzien de statuten in ieder geval in een regeling omtrent:'
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel48
  - number: 48.6.a
    text: de samenstelling, werkwijze en inrichting van het bestuur van de stichting,
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel48
  - number: 48.6.b
    text: |-
      de wijze van benoeming, herbenoeming, schorsing en ontslag van de bestuursleden, met dien verstande dat de leden
      van het bestuur worden benoemd door de gemeenteraad of gemeenteraden en dat ten minste een derde gedeelte, doch
      geen meerderheid, van die leden wordt benoemd op bindende voordracht van de ouders van de leerlingen die zijn
      ingeschreven op de betrokken school of scholen,
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel48
  - number: 48.6.c
    text: de termijn waarvoor de bestuursleden worden benoemd,
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel48
  - number: 48.6.d
    text: |-
      de vaststelling van de begroting na goedkeuring door de desbetreffende gemeenteraad of gemeenteraden en de
      vaststelling van de jaarrekening na instemming van de desbetreffende gemeenteraad of gemeenteraden,
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel48
  - number: 48.6.e
    text: de wijze waarop de gemeenteraad of gemeenteraden toezicht op het bestuur uitoefenen,
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel48
  - number: 48.6.f
    text: de gronden waarop het bestuur kan besluiten de vergaderingen besloten te houden,
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel48
  - number: 48.6.g
    text: |-
      de periode waarvoor de stichting in het leven wordt geroepen, met dien verstande dat deze periode ten minste 5
      jaren bedraagt, en
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel48
  - number: 48.6.h
    text: |-
      de bevoegdheid de stichting te ontbinden, met dien verstande dat in de regeling een overheersende invloed van de
      overheid in het bestuur is verzekerd.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel48
  - number: '48.7'
    text: |-
      De statuten van de stichting kunnen slechts worden gewijzigd na instemming van de desbetreffende gemeenteraad of
      gemeenteraden.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel48
  - number: '48.8'
    text: |-
      Het bestuur brengt jaarlijks aan de gemeenteraad of gemeenteraden verslag uit over de werkzaamheden, waarbij in
      ieder geval aandacht wordt geschonken aan de wezenskenmerken van het openbaar onderwijs. Het verslag wordt openbaar
      gemaakt.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel48
  - number: '48.9'
    text: |-
      De vergaderingen van het bestuur van de stichting zijn openbaar, tenzij het bestuur anders beslist, op gronden,
      vermeld in de statuten.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel48
  - number: '48.10'
    text: |-
      Indien voor 1 februari van het jaar waarvoor de begroting geldt, de begroting niet is goedgekeurd, neemt de
      gemeenteraad of gemeenteraden de maatregelen die zij nodig achten om de continuïteit van het onderwijsproces te
      waarborgen.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel48
  - number: '48.11'
    text: |-
      De gemeenteraad of gemeenteraden zijn in geval van ernstige taakverwaarlozing door het bestuur of functioneren in
      strijd met de wet bevoegd zelf te voorzien in het bestuur van de scholen en zo nodig de stichting te ontbinden.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel48
  - number: '49.1'
    text: |-
      De rechtspersoon die een openbare school in stand houdt, kan de instandhouding van die school overdragen aan
      een andere rechtspersoon die tot instandhouding van een openbare school bevoegd is. De overdracht geschiedt bij
      notariële akte.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel49
  - number: '49.2'
    text: |-
      Bij deze akte verbindt de overdragende rechtspersoon zich tevens de rechten ten aanzien van gebouwen en
      terreinen alsmede de roerende zaken over te dragen. Deze akte geldt tevens als akte van levering als bedoeld in
      [artikel 89 van Boek 3 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel89
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '89'
  - number: '49.3'
    text: |-
      In de akte wordt bepaald dat de rechtspersoon aan wie wordt overgedragen, het personeel in gelijke betrekkingen en
      onder dezelfde voorwaarden als vermeld in de akte van aanstelling, aan de school aanstelt met ingang van de datum
      van overdracht.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel49
  - number: '49.4'
    text: |-
      Door overdracht met inachtneming van de voorgaande leden treedt de verkrijgende rechtspersoon in alle uit de wet
      voortvloeiende rechten en verplichtingen die zijn rechtsvoorganger bezit in zijn hoedanigheid van bevoegd gezag,
      onverminderd hetgeen verder voor de overgang daarvan naar burgerlijk recht is vereist.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel49
  - number: '50'
    text: |-
      Het bevoegd gezag stelt de leerlingen in de gelegenheid op de school, binnen de schooltijden, godsdienstonderwijs
      of levensbeschouwelijk vormingsonderwijs te ontvangen. Van de tijd daaraan te besteden worden ten
      hoogste 120 uren per schooljaar meegeteld voor het aantal uren onderwijs dat de leerlingen krachtens
      [artikel 8, zevende lid, aanhef en onder a][ref1], ten minste moeten ontvangen. Voor de leerlingen die dit
      onderwijs niet volgen, voorziet het bevoegd gezag in andere onderwijsactiviteiten op de school.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel8
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '8'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '1'
  - number: '51'
    text: |-
      Godsdienstonderwijs wordt gegeven door leraren daartoe aangewezen door kerkelijke gemeenten, plaatselijke kerken,
      of rechtspersonen met volledige rechtsbevoegdheid die zich blijkens hun statuten het geven van godsdienstonderwijs
      ten doel stellen. Levensbeschouwelijk vormingsonderwijs wordt gegeven door leraren daartoe aangewezen door
      volledige rechtsbevoegdheid bezittende organisaties op geestelijke grondslag.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel51
  - number: '52.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden voor het personeel voorschriften vastgesteld omtrent
      aanstelling, schorsing, ontslag en disciplinaire maatregelen.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel52
  - number: '52.2'
    text: |-
      In afwijking van het bepaalde bij of krachtens het eerste lid zijn gedeputeerde staten van de desbetreffende
      provincie bevoegd de disciplinaire maatregel of de schorsing op te leggen dan wel het ontslag te verlenen, indien
      het betreft een directeur, een adjunct-directeur of een ander lid van het onderwijzend personeel van een openbare
      school en deze tevens lid is van de raad van de gemeente die de school in stand houdt.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel52
  - number: '53.1'
    text: |-
      Ieder personeelslid is in het bezit van een door het bevoegd gezag getekende akte van aanstelling. De akte van
      aanstelling bevat in elk geval:
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel53
  - number: 53.1.a
    text: de naam en het adres van het bevoegd gezag;
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel53
  - number: 53.1.b
    text: de naam, de voornamen en de geboortedatum van de betrokkene;
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel53
  - number: 53.1.c
    text: de datum van ingang van de aanstelling;
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel53
  - number: 53.1.d
    text: de functie waarin de betrokkene wordt aangesteld;
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel53
  - number: 53.1.e
    text: de omvang van de betrekking;
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel53
  - number: 53.1.f
    text: |-
      de bepaling of de aanstelling in vaste of in tijdelijke dienst geschiedt en in het laatste geval de gronden voor de
      tijdelijkheid en de duur van de aanstelling;
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel53
  - number: 53.1.g
    text: de op de dag van zijn aanstelling van toepassing zijnde schaal en het salarisnummer;
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel53
  - number: 53.1.h
    text: de bepaling dat de betrokkene werkzaam zal zijn in algemene dienst van het bevoegd gezag; en
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel53
  - number: 53.1.i
    text: |-
      voor personeelsleden die bij de uitoefening van hun functie kennis nemen van persoonlijke gegevens van leerlingen,
      voorschriften omtrent geheimhouding daarvan, voor zover een geheimhoudingsplicht niet uit anderen hoofde is
      verzekerd.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel53
  - number: '53.2'
    text: |-
      Het bevoegd gezag draagt zorg dat afschriften van de akten van bekwaamheid, van de verklaringen omtrent het gedrag,
      alsmede van de akten van aanstelling van het aan de school verbonden personeel worden bewaard.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel53
  - number: '53.3'
    text: |-
      Het eerste lid, aanhef en onder i, en het tweede lid, zijn van overeenkomstige toepassing op personeel dat is
      tewerkgesteld zonder aanstelling.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel53
  - number: '54'
    text: |-
      De aanstelling of tewerkstelling zonder aanstelling van de mede-directeur, de adjunct-directeur of leraren
      geschiedt de directeur gehoord.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel54
  - number: '55'
    text: |-
      Een bijzondere school wordt in stand gehouden door een rechtspersoon met volledige rechtsbevoegdheid die zich
      blijkens de statuten of reglementen het geven van onderwijs ten doel stelt zonder daarbij het maken van winst te
      beogen.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel55
  - number: '56.1'
    text: |-
      De rechtspersoon die de school in stand houdt, kan de instandhouding van de school overdragen aan een andere
      rechtspersoon die voldoet aan [artikel 55][ref1]. De overdracht geschiedt bij notariële akte.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel55
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '55'
        hoofdstuk: I
        afdeling: '3'
  - number: '56.2'
    text: |-
      Bij deze akte verbindt de overdragende rechtspersoon zich tevens de rechten ten aanzien van gebouwen en
      terreinen alsmede de roerende zaken over te dragen. Deze akte geldt tevens als akte van levering bedoeld in
      [artikel 89 van Boek 3 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel89
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '89'
  - number: '56.3'
    text: |-
      In de akte wordt bepaald dat de rechtspersoon aan wie wordt overgedragen, het personeel in gelijke betrekkingen en
      onder dezelfde voorwaarden als vermeld in de akte van benoeming, benoemt met ingang van de datum van overdracht.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel56
  - number: '56.4'
    text: |-
      Door overdracht met inachtneming van de voorgaande leden, treedt de verkrijgende rechtspersoon in alle uit de
      wet voortvloeiende rechten en verplichtingen van zijn rechtsvoorganger met betrekking tot de school, onverminderd
      hetgeen verder voor de overgang daarvan naar burgerlijk recht is vereist.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel56
  - number: '56.5'
    text: |-
      Bij een splitsing als bedoeld in [artikel 334a van Boek 2 van het Burgerlijk Wetboek][ref1] van een rechtspersoon
      die een school in stand houdt, wordt in de splitsingsakte bepaald dat de voortbestaande splitsende rechtspersoon de
      school in stand zal houden of op welke verkrijgende rechtspersoon de instandhouding van de school overgaat. In het
      laatste geval zijn het tweede tot en met vierde lid van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel334a
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 334a
  - number: '57'
    text: |-
      Onverminderd [artikel 9][ref1] kunnen de onderwijsactiviteiten godsdienstonderwijs of levensbeschouwelijk
      vormingsonderwijs omvatten. Van de tijd daaraan te besteden worden ten hoogste 120 uren per schooljaar meegeteld
      voor het aantal uren onderwijs dat de leerlingen krachtens [artikel 8, zevende lid, aanhef en onder a][ref2], ten
      minste moeten ontvangen. Het geven van godsdienstonderwijs of levensbeschouwelijk vormingsonderwijs kan worden
      opgedragen aan een niet aan de school verbonden leraar.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel8
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '9'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '8'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '1'
  - number: '58.1'
    text: |-
      Indien binnen redelijke afstand van de woning van de leerling geen gelegenheid bestaat tot het volgen van
      openbaar onderwijs, mag de toelating tot de school niet worden geweigerd op grond van godsdienstige gezindheid
      of levensbeschouwing. Het voorgaande is niet van toepassing indien de school uitsluitend is bestemd voor interne
      leerlingen.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel58
  - number: '58.2'
    text: |-
      Leerlingen die ingevolge het eerste lid zijn toegelaten, kunnen niet worden verplicht godsdienstonderwijs of
      levensbeschouwelijk vormingsonderwijs te volgen.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel58
  - number: '59.1'
    text: |-
      De akte van benoeming bevat tenminste bepalingen van gelijke inhoud als zijn vastgesteld bij de algemene maatregel
      van bestuur bedoeld in [artikel 33, tweede lid onder a en b][ref1], voor zover deze geen rechtstreekse aanspraak op
      het Rijk geven.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel33
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '33'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: '1'
  - number: '59.2'
    text: |-
      Ieder personeelslid is in het bezit van een door het bevoegd gezag en hemzelf getekende akte van benoeming. De akte
      van benoeming bevat in elk geval:
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel59
  - number: 59.2.a
    text: de naam en het adres van het bevoegd gezag;
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel59
  - number: 59.2.b
    text: de naam, de voornamen en de geboortedatum van de betrokkene;
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel59
  - number: 59.2.c
    text: de datum van ingang van de benoeming;
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel59
  - number: 59.2.d
    text: de functie waarin de betrokkene wordt benoemd;
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel59
  - number: 59.2.e
    text: de omvang van de betrekking;
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel59
  - number: 59.2.f
    text: |-
      de bepaling of de benoeming in vaste of tijdelijke dienst geschiedt en in het laatste geval de gronden voor de
      tijdelijkheid en de duur van de benoeming;
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel59
  - number: 59.2.g
    text: de op de dag van zijn benoeming van toepassing zijnde schaal en het salarisnummer;
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel59
  - number: 59.2.h
    text: de bepaling dat de betrokkene werkzaam zal zijn in algemene dienst van het bevoegd gezag; en
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel59
  - number: 59.2.i
    text: |-
      voor personeelsleden die bij de uitoefening van hun functie kennis nemen van persoonlijke gegevens van leerlingen,
      voorschriften omtrent geheimhouding daarvan, voor zover een geheimhoudingsplicht niet uit anderen hoofde is
      verzekerd.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel59
  - number: '59.3'
    text: De akte van benoeming bevat bepalingen inzake gronden voor schorsing, ontslag en disciplinaire maatregelen.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel59
  - number: '59.4'
    text: |-
      Het bevoegd gezag draagt zorg dat afschriften van de akten van bekwaamheid, van de verklaringen omtrent het gedrag,
      alsmede van de akten van benoeming van het aan de school verbonden personeel worden bewaard.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel59
  - number: '59.5'
    text: |-
      Het eerste lid, aanhef en onder i, en het vierde lid, zijn van overeenkomstige toepassing op personeel dat is
      tewerkgesteld zonder benoeming.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel59
  - number: '60.1'
    text: |-
      Het bevoegd gezag is aangesloten bij een commissie van beroep. Het personeel kan bij die commissie beroep instellen
      tegen een beslissing van het bevoegd gezag inhoudende:
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel60
  - number: 60.1.a
    text: een disciplinaire maatregel;
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel60
  - number: 60.1.b
    text: schorsing;
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel60
  - number: 60.1.c
    text: het direct of indirect onthouden van promotie;
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel60
  - number: 60.1.d
    text: het verminderen van de omvang van de betrekking;
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel60
  - number: 60.1.e
    text: ontslag anders dan op eigen verzoek, voordat de pensioengerechtigde leeftijd is bereikt;
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel60
  - number: 60.1.f
    text: |-
      de beslissing van het bevoegd gezag ten aanzien van een personeelslid op basis waarvan op termijn vermindering van
      diens betrekkingsomvang kan plaatsvinden;
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel60
  - number: 60.1.g
    text: de beëindiging van een verlengd tijdelijk dienstverband;
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel60
  - number: 60.1.h
    text: |-
      de aanwijzing als personeelslid boven de basisformatie voortvloeiend uit een algemeen verbindend voorschrift welke
      aanwijzing op termijn kan leiden tot ontslag, vermindering van de betrekkingsomvang of beëindiging van een verlengd
      tijdelijk dienstverband;
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel60
  - number: 60.1.i
    text: de aanwijzing van een andere school of andere scholen waaraan een personeelslid werkzaamheden zal verrichten.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel60
  - number: '60.2'
    text: |-
      Een beslissing als bedoeld in het vorige lid, aanhef, wordt schriftelijk aan de betrokkene medegedeeld. Daarbij
      wordt tevens vermeld de beroepstermijn en het adres van de commissie waar het beroep kan worden ingesteld.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel60
  - number: '60.3'
    text: Het bevoegd gezag onderwerpt zich aan de uitspraak van de commissie.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel60
  - number: '61.1'
    text: |-
      Het beroep bedoeld in [artikel 60][ref1], wordt schriftelijk ingesteld binnen 6 weken, nadat de beslissing aan
      betrokkene is medegedeeld. Bij overschrijding van deze termijn ten gevolge van omstandigheden die de betrokkene
      niet kunnen worden verweten, laat de commissie niet-ontvankelijkverklaring op die grond achterwege.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel60
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '60'
        hoofdstuk: I
        afdeling: '3'
  - number: '61.2'
    text: |-
      Tijdens de behandeling door de commissie van beroep loopt geen verjaring met betrekking tot rechtsvorderingen ter
      zake van beslissingen die aan het oordeel van de commissie zijn onderworpen.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel61
  - number: '62.1'
    text: |-
      Een commissie van beroep strekt haar werkzaamheden uit over ten minste 50 bijzondere scholen. Onze minister kan dit
      aantal lager stellen.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel62
  - number: '62.2'
    text: |-
      Tot scholen bedoeld in het eerste lid, kunnen ook scholen voor speciaal onderwijs, voortgezet speciaal onderwijs,
      of speciaal en voortgezet speciaal onderwijs, instellingen voor speciaal en voortgezet speciaal onderwijs en
      scholen voor voortgezet onderwijs behoren.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel62
  - number: '62.3'
    text: |-
      De commissie bestaat uit 5 leden en 5 plaatsvervangende leden, waarvan 2 leden en 2 plaatsvervangende leden worden
      gekozen door het bevoegd gezag en 2 leden en 2 plaatsvervangende leden door het personeel van de aangesloten
      scholen. Deze 4 leden kiezen het vijfde lid, tevens voorzitter, en diens plaatsvervanger.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel62
  - number: '62.4'
    text: |-
      De leden en plaatsvervangende leden mogen niet behoren tot het bevoegd gezag of het personeel van een aangesloten
      school of tot de inspectie van het onderwijs.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel62
  - number: '62.5'
    text: |-
      Bij algemene maatregel van bestuur worden nadere voorschriften gegeven omtrent de samenstelling en de werkwijze van
      de commissie van beroep.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel62
  - number: '63.1'
    text: |-
      Indien het bevoegd gezag van een bijzondere school op grond van [artikel 36, derde lid][ref1], een student de
      toegang weigert, deelt het deze beslissing, schriftelijk en met redenen omkleed, mede door toezending of uitreiking
      aan de student, onverminderd het bepaalde in dat artikellid.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel36
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '36'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: '1'
  - number: '63.2'
    text: |-
      Indien het bevoegd gezag van een bijzondere school op grond van [artikel 40][ref1] weigert een leerling toe te
      laten dan wel een leerling verwijdert, deelt het de beslissing daartoe, schriftelijk en met redenen omkleed, mede
      door toezending of uitreiking aan de ouders. Daarbij wordt tevens de inhoud van het bepaalde in het derde lid,
      eerste volzin, vermeld. Voordat het bevoegd gezag van een bijzondere school op grond van dat artikellid beslist tot
      verwijdering van een leerling, hoort het de ouders van de leerling, onverminderd het bepaalde in dat artikellid.
      Het bevoegd gezag neemt de beslissing, bedoeld in de eerste volzin, zo spoedig mogelijk, met dien verstande dat de
      beslissing over de toelating van een leerling voor wie een leerlinggebonden budget beschikbaar is uiterlijk drie
      maanden na ontvangst van het verzoek tot toelating wordt genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel40
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '40'
        hoofdstuk: I
        paragraaf: '4'
        afdeling: '1'
  - number: '63.3'
    text: |-
      Binnen 6 weken na de mededeling, bedoeld in het tweede lid, kunnen de ouders bij het bevoegd gezag schriftelijk hun
      bezwaren kenbaar maken tegen de beslissing. Het bevoegd gezag beslist binnen 4 weken na ontvangst van de bezwaren.
      Alvorens te beslissen hoort het bevoegd gezag de ouders.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel63
  - number: '65.1'
    text: |-
      De gemeenteraad is bevoegd uitsluitend in het belang van een doelmatige spreiding van de leerlingen over de
      openbare scholen, het grondgebied van de gemeente in schoolwijken te verdelen.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel65
  - number: '65.2'
    text: |-
      Een besluit als bedoeld in het eerste lid, geldt voor ten minste 3 schooljaren, met dien verstande dat tussentijdse
      wijziging mogelijk is in geval van veranderingen in het scholenbestand. Burgemeester en wethouders zenden binnen 4
      weken nadat het besluit is genomen afschrift daarvan aan gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel65
  - number: '65.3'
    text: |-
      De toelating tot een openbare school geschiedt in overeenstemming met de vastgestelde schoolwijken, tenzij de
      ouders van een leerling schriftelijk aan het bevoegd gezag te kennen geven toelating tot een school in een andere
      schoolwijk te wensen.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel65
  - number: '66'
    text: |-
      Vertegenwoordigers van het basisonderwijs en het speciaal onderwijs kunnen ten behoeve van de scholen en
      instellingen die zij vertegenwoordigen een overlegorgaan oprichten met het doel de samenwerking tussen die scholen
      en instellingen te bevorderen ten aanzien van de toelating van leerlingen en de inrichting van het onderwijs.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel66
  - number: '67'
    text: |-
      Met betrekking tot het basisonderwijs en het aansluitend voortgezet onderwijs is [artikel 66][ref1] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel66
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '66'
        hoofdstuk: I
  - number: '68.1'
    text: Op het personeel van een rechtspersoon met volledige rechtsbevoegdheid die
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel68
  - number: 68.1.a
    text: |-
      uitsluitend wordt bestuurd door een bevoegd gezag al dan niet met een of meer andere bevoegde gezagsorganen als
      bedoeld in deze wet, de [Wet op de expertisecentra][ref1] of de [Wet op het voortgezet onderwijs][ref2],


      [ref1]: https://wetten.overheid.nl/BWBR0003549
      [ref2]: https://wetten.overheid.nl/BWBR0002399
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0003549
      - id: ref2
        bwb_id: BWBR0002399
  - number: 68.1.b
    text: |-
      zich blijkens de statuten dan wel de gemeenschappelijke regeling, bedoeld in de
      [Wet gemeenschappelijke regelingen][ref1], uitsluitend ten doel stelt om ten behoeve van scholen en andere
      onderwijsinstellingen die uit 's Rijks kas worden bekostigd, werkzaamheden te verrichten ter verzekering van
      de goede gang van het onderwijs met uitzondering van het leiden van de school, het geven van onderwijs en het
      verrichten van werkzaamheden op het terrein van de schoolbegeleiding als bedoeld in [artikel 179][ref2],


      [ref1]: https://wetten.overheid.nl/BWBR0003740
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel179
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0003740
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '179'
        hoofdstuk: I
        afdeling: '12'
  - number: 68.1.c
    text: niet het maken van winst beoogt,
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel68
  - number: 68.1.d
    text: |-
      wordt gefinancierd met behulp van bijdragen van de bevoegde gezagsorganen waarvoor diensten worden verricht,
      waaronder begrepen de bekostiging voor zorgvoorzieningen, bedoeld in [artikel 120, vierde lid][ref1], of
      [artikel 132][ref2], en


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel120
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel132
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel68
    references:
