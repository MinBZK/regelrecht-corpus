  - number: '145.2'
    text: |-
      Indien aan het bevoegd gezag van een niet door de gemeente in stand gehouden school een deel van de bekostiging
      voor personeelskosten is overgedragen door een ander bevoegd gezag, wordt bij het vaststellen van het totaal van
      de ontvangsten, bedoeld in het eerste lid, tweede volzin, dat deel bij genoemde school wel en bij de school van
      laatstgenoemd bevoegd gezag niet aangemerkt als ontvangsten.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel145
  - number: '145.3'
    text: |-
      Indien een gemeente voor een niet door de gemeente in stand gehouden school het deel van de materiële
      instandhouding waarop de programma's van eisen, bedoeld in [artikel 114, onder a, b en c][ref1], betrekking hebben,
      geheel of gedeeltelijk verzorgt, wordt een overeenkomstig deel van de ontvangsten in mindering gebracht op het
      totaal van de ontvangsten voor de betrokken school waarover ingevolge het eerste lid het overschrijdingsbedrag
      wordt vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel114
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel145
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '114'
        hoofdstuk: I
        afdeling: '4'
  - number: '145.4'
    text: |-
      Indien een gemeente gedurende een gedeelte van het desbetreffende tijdvak een of meer basisscholen
      onderscheidenlijk speciale scholen voor basisonderwijs in stand houdt, wordt voor het vaststellen van het
      overschrijdingsbedrag, bedoeld in het eerste lid, uitgegaan van het totaal van de ontvangsten van een niet door de
      gemeente in stand gehouden school over een overeenkomstig gedeelte van het desbetreffende tijdvak.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel145
  - number: '147'
    text: |-
      Aan het bevoegd gezag van de niet door de gemeente in stand gehouden scholen wordt een afschrift gezonden
      van de besluiten van de gemeenteraad tot vaststelling van de mate waarin meer dan wel minder uitgaven
      worden gedaan, bedoeld in [artikel 143, eerste lid][ref1], tot verlening van het voorschot, bedoeld
      in [artikel 143, tweede of derde lid][ref2], en tot voorlopige en definitieve vaststelling van het
      overschrijdingsbedrag, bedoeld in [artikel 144, zesde en zevende lid][ref3]. Daarbij is opgenomen een staat van
      voorzieningen als bedoeld in [artikel 144, eerste lid onder j][ref4], waarin per kalenderjaar wordt aangegeven het
      verloop van de toevoegingen en de onttrekkingen aan de voorzieningen. De toezending geschiedt binnen 2 weken na
      de dag waarop de gemeenteraad een besluit als bedoeld in de eerste volzin heeft genomen. Het bevoegd gezag van een
      niet door de gemeente in stand gehouden school kan tegen een besluit als bedoeld in de eerste volzin administratief
      beroep instellen bij gedeputeerde staten.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel143
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel143
      [ref3]: https://wetten.overheid.nl/BWBR0003420#Artikel144
      [ref4]: https://wetten.overheid.nl/BWBR0003420#Artikel144
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel147
