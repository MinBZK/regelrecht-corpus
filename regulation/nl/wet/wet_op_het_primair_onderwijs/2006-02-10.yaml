  - number: '69.1'
    text: |-
      De openbare en de bijzondere scholen worden door het Rijk bekostigd volgens de bepalingen van deze titel met
      uitzondering van afdeling 3. Geen bekostiging vindt plaats indien groepen van leerlingen van verschillende scholen
      al dan niet van hetzelfde bevoegd gezag gezamenlijk onderwijs ontvangen. De bedragen die de gemeente krachtens deze
      wet in aanvulling op de rijksbekostiging verstrekt blijven ten laste van de gemeente.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel69
  - number: '69.2'
    text: |-
      Bij algemene maatregel van bestuur worden nadere voorschriften gegeven ter uitvoering van het eerste lid. Deze
      algemene maatregel van bestuur bevat in elk geval een regeling omtrent de termijnen binnen welke besluiten moeten
      worden genomen.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel69
  - number: '69.3'
    text: 'De algemene maatregel van bestuur bedoeld in het tweede lid, bevat tevens:'
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel69
  - number: 69.3.a
    text: |-
      een regeling omtrent de betaling van de bedragen van de bekostiging voor de materiële voorzieningen ten behoeve van
      de instandhouding voortvloeiende uit het gebruik door een school van voorzieningen die voor meer dan een school of
      voor andere doeleinden zijn bestemd;
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel69
  - number: 69.3.b
    text: |-
      een financiële regeling tussen het Rijk en de bevoegde gezagsorganen die personeel in dienst hebben dat niet door
      het Rijk wordt bekostigd ter zake van een korting op de bekostiging ter compensatie van de kosten van de voor dat
      personeel geldende rechtspositionele voorzieningen, voor zover deze ten laste van 's Rijks kas komen.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel69
  - number: '69.4'
    text: |-
      De algemene maatregel van bestuur bedoeld in het tweede lid, wordt aan de Tweede Kamer der Staten-Generaal
      overgelegd. De maatregel treedt niet in werking dan nadat 4 weken na de overlegging zijn verstreken en gedurende
      die termijn niet door of namens de Kamer de wens wordt te kennen gegeven dat het in die maatregel geregelde
      onderwerp bij de wet wordt geregeld. Alsdan wordt een daartoe strekkend wetsontwerp zo spoedig mogelijk ingediend.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel69
  - number: '69.5'
    text: |-
      [Artikel 4:32 van de Algemene wet bestuursrecht][ref1] is niet van toepassing op de bekostiging van scholen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '70'
    text: |-
      Onze minister kan onder nader te stellen voorwaarden aanvullende middelen ter beschikking stellen die niet strekken
      tot bekostiging van het onderwijs, bedoeld in deze wet, en de schoolbegeleiding ten behoeve daarvan, maar die
      direct of indirect dienstig zijn voor de uitvoering van het onderwijs of voor verhoging van de mogelijkheid tot
      deelname aan het onderwijs. Voor zover toepassing van de eerste volzin het verstrekken van subsidie betreft, zijn
      de [artikelen 4 tot en met 19 van de Wet overige OCenW-subsidies][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009458#Artikel4
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0009458
        artikel: '4'
  - number: 70a.1
    text: |-
      Indien op verzoek van de ouders van een leerling voor wie op basis van een beoordeling door een commissie voor
      de indicatiestelling als bedoeld in [artikel 28c van de Wet op de expertisecentra][ref1] een leerlinggebonden
      budget beschikbaar is, die leerling wordt ingeschreven bij een school, meldt het bevoegd gezag van die school die
      inschrijving aan Onze minister.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel28c
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel70a
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 28c
  - number: 70a.2
    text: |-
      Indien sprake is van een eerste inschrijving bij een school als leerling voor wie een leerlinggebonden budget
      beschikbaar is, wordt met ingang van de eerste dag van de maand volgend op de inschrijving aan het bevoegd gezag
      van die school ten behoeve van die leerling een leerlinggebonden budget toegekend, dat wordt berekend op een
      bij algemene maatregel van bestuur vastgestelde wijze. De omvang van het leerlinggebonden budget is uitsluitend
      afhankelijk van de onderwijssoort waarvoor de leerling toelaatbaar is verklaard. Indien een leerling voor wie een
      leerlinggebonden budget beschikbaar is, wordt ingeschreven bij een speciale school voor basisonderwijs, meldt het
      bevoegd gezag de reden voor inschrijving bij die speciale school voor basisonderwijs aan Onze minister.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel70a
  - number: 70a.3
    text: |-
      Indien ten behoeve van een leerling voor wie een leerlinggebonden budget beschikbaar is in het lopende schooljaar
      dat budget aan het bevoegd gezag van een school is toegekend, wordt bij inschrijving van die leerling bij een
      andere school, het in het tweede lid bedoelde leerlinggebonden budget aan het bevoegd gezag van laatstbedoelde
      school toegekend met ingang van het nieuwe schooljaar.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel70a
  - number: 70a.4
    text: |-
      Het bevoegd gezag van de school is verplicht een bij algemene maatregel van bestuur te
      bepalen deel van het leerlinggebonden budget te besteden bij een school als bedoeld in de
      [Wet op de expertisecentra][ref1] waarbinnen onderwijs wordt gegeven van de soort waarvoor de leerling
      toelaatbaar is verklaard. Het in de eerste volzin bedoelde deel kan voor de onderwijssoorten, bedoeld in
      [artikel 2, tweede lid, van de Wet op de expertisecentra][ref2], verschillend worden vastgesteld. De eerste volzin
      is van overeenkomstige toepassing ten aanzien van een leerling die toelaatbaar is verklaard tot het cluster,
      bedoeld in [artikel 2, vierde lid onder d, van de Wet op de expertisecentra][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003549
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel2
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel70a
    references:
      - id: ref1
        bwb_id: BWBR0003549
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0003549
        artikel: '2'
  - number: 70a.5
    text: |-
      Bij de melding, bedoeld in het eerste lid, geeft het bevoegd gezag tevens aan bij welke school bedoeld in
      de [Wet op de expertisecentra][ref1] het in het vierde lid bedoelde deel van het leerlinggebonden budget
      wordt besteed. Op grond van deze melding kent Onze minister dat deel van het leerlinggebonden budget toe aan
      laatstbedoelde school.


      [ref1]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel70a
    references:
      - id: ref1
        bwb_id: BWBR0003549
  - number: 70a.6
    text: |-
      In afwijking van de tweede volzin van het tweede lid, kan bij algemene maatregel van bestuur worden bepaald in
      welke gevallen en in welke mate de omvang van het leerlinggebonden budget bij inschrijving van een leerling bij
      een speciale school voor basisonderwijs lager wordt vastgesteld dan bij inschrijving van die leerling bij een
      basisschool.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel70a
  - number: 70a.7
    text: |-
      Een krachtens het tweede, vierde en zesde lid vastgestelde algemene maatregel van bestuur wordt aan de Tweede Kamer
      der Staten-Generaal overgelegd. Hij treedt in werking op een tijdstip dat nadat 4 weken na de overlegging zijn
      verstreken bij koninklijk besluit wordt vastgesteld, tenzij binnen die termijn door of namens de kamer de wens te
      kennen wordt gegeven dat het onderwerp van de algemene maatregel van bestuur bij wet wordt geregeld. In dat geval
      wordt een daartoe strekkend voorstel van wet zo spoedig mogelijk ingediend. De vorige 3 volzinnen zijn niet van
      toepassing, voor zover het ontwerp van een algemene maatregel van bestuur voordien aan de Tweede Kamer der Staten-
      Generaal is voorgelegd en door of namens de kamer te kennen is gegeven dat van de procedure, bedoeld in de vorige 3
      volzinnen, kan worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel70a
  - number: '71'
    text: 'Een belanghebbende kan beroep instellen bij de Afdeling bestuursrechtspraak van de Raad van State tegen:'
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel71
  - number: 71.a
    text: een besluit of een van rechtswege verleende goedkeuring als bedoeld in de afdelingen 2 en 9 van deze titel,
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel71
  - number: 71.b
    text: |-
      een besluit als bedoeld in [artikel 123, tweede lid][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel123
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '123'
        hoofdstuk: I
        afdeling: '5'
  - number: 71.c
    text: |-
      een besluit als bedoeld in [artikel 135][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel135
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '135'
        hoofdstuk: I
        paragraaf: '2'
        afdeling: '8'
  - number: '72.1'
    text: |-
      Voor de toepassing van deze titel zijn de voorschriften die betrekking hebben op bijzondere scholen, van
      overeenkomstige toepassing op openbare scholen die in stand worden gehouden door een stichting als bedoeld in
      [artikel 48][ref1] of een openbare rechtspersoon als bedoeld in [artikel 47][ref2], tenzij het tegendeel blijkt.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel47
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '48'
        hoofdstuk: I
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '47'
        hoofdstuk: I
        afdeling: '2'
  - number: '72.2'
    text: |-
      Indien een openbare school in stand wordt gehouden door een stichting of een openbare rechtspersoon, wordt deze
      aangemerkt als een door de gemeente in stand gehouden openbare school voor de toepassing van afdeling 2 en afdeling
      9.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel72
  - number: 72a.1
    text: |-
      Onze minister kan op aanvraag van een bevoegd gezag besluiten dat, met het oog op de ontwikkeling door scholen van
      instrumenten voor planning en beheer, de [artikelen 123, tweede en derde lid][ref1], [129][ref2], [148][ref3] en
      [149][ref4] niet van toepassing zijn op de bekostiging van de scholen van dat bevoegd gezag. Voor een dergelijk
      besluit komen ten hoogste vijfentwintig bevoegde gezagsorganen in aanmerking. Onze minister kan een tijdstip
      vaststellen voor welke de aanvragen moeten worden ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel123
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel129
      [ref3]: https://wetten.overheid.nl/BWBR0003420#Artikel148
      [ref4]: https://wetten.overheid.nl/BWBR0003420#Artikel149
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel72a
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '123'
        hoofdstuk: I
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '129'
        hoofdstuk: I
        afdeling: '6'
      - id: ref3
        bwb_id: BWBR0003420
        artikel: '148'
        hoofdstuk: I
        paragraaf: '6'
        afdeling: '8'
      - id: ref4
        bwb_id: BWBR0003420
        artikel: '149'
        hoofdstuk: I
        paragraaf: '7'
        afdeling: '8'
  - number: 72a.2
    text: |-
      Onze minister bepaalt bij zijn besluit welke regelen en voorwaarden voor de bekostiging zullen gelden in plaats
      van het bepaalde bij of krachtens de artikelen, genoemd in het eerste lid, alsmede de wijze van bekostiging. Onze
      minister kan aan het besluit voorschriften verbinden omtrent het afleggen van rekening en verantwoording van het
      financieel beheer, alsmede, zo nodig in afwijking van het bepaalde krachtens [artikel 182, tweede volzin][ref1],
      omtrent de inrichting van de boekhouding.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel182
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel72a
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '182'
        hoofdstuk: I
        afdeling: '12'
  - number: 72a.3
    text: |-
      Onze minister stelt, na overleg met de aanvrager, een ontwerp op van het besluit en zendt dit ontwerp aan de
      aanvrager. Indien de aanvrager zijn aanvraag niet binnen twee weken na verzending van het ontwerp van het besluit
      door Onze minister heeft ingetrokken, besluit Onze minister overeenkomstig het ontwerp.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel72a
  - number: 72a.4
    text: |-
      Voor zover nodig neemt Onze minister, na overleg met de gemeente of gemeenten die het aangaat, een besluit omtrent
      toepassing van de overschrijdingsregeling, bedoeld in de [artikelen 142 tot en met 147][ref1], door de gemeente of
      gemeenten waar een of meer scholen waarop een besluit als bedoeld in het eerste lid van toepassing is, gevestigd
      zijn. Onze minister kan daarbij afwijken van het bepaalde bij of krachtens de [artikelen 142 tot en met 147][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel142
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel142
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel72a
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '142'
        hoofdstuk: I
        paragraaf: '5'
        afdeling: '8'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '142'
        hoofdstuk: I
        paragraaf: '5'
        afdeling: '8'
  - number: 72a.5
    text: Het besluit, bedoeld in het eerste lid, heeft een geldigheidsduur van ten hoogste vier jaren.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel72a
  - number: 72a.6
    text: |-
      Indien voor het einde van de geldigheidsduur van het besluit een voorstel van wet tot invoering van
      lumpsumbekostiging voor de personeels- en exploitatiekosten van scholen als bedoeld in deze wet bij de Staten-
      Generaal wordt ingediend, kan de minister het besluit, bedoeld in het eerste lid, na overleg met het bevoegd gezag,
      zodanig aanpassen en in afwijking van het vijfde lid verlengen, dat een goede overgang wordt gewaarborgd naar het
      bekostigingssysteem dat geldt op het moment waarop de periode eindigt waarop het besluit betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel72a
  - number: '73'
    text: 'In deze paragraaf wordt onder «school» verstaan: basisschool.'
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel73
  - number: '74.1'
    text: |-
      De bekostiging van een openbare en een bijzondere school kan slechts een aanvang nemen, indien zij voorkomt op een
      voor de gemeente van vestiging vastgesteld plan van nieuwe scholen. De bekostiging van een nevenvestiging neemt
      slechts een aanvang op grond van [artikel 85][ref1]. De [artikelen 74, tweede lid, tot en met 83][ref2] zijn niet
      van toepassing op nevenvestigingen, bij omzetting van een bekostigde bijzondere school in een bekostigde openbare
      school of omgekeerd, bij omzetting van een bekostigde bijzondere school in een bekostigde bijzondere school van een
      andere richting en bij uitbreiding van het onderwijs aan een school met openbaar onderwijs of met onderwijs van een
      of meer richtingen. De bekostiging kan slechts aanvangen per 1 augustus van een schooljaar.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel85
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel74
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '85'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '74'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '2'
  - number: '74.2'
    text: |-
      De gemeenteraad stelt het plan, bedoeld in het eerste lid, eerste volzin, al dan niet in samenwerking met de raad
      van een of meer andere gemeenten, elk jaar voor 1 augustus vast. Het plan bestrijkt 3 achtereenvolgende schooljaren
      volgende op het jaar van de vaststelling en vermeldt in elk geval welke scholen bij de aanvang van het eerste
      schooljaar van de planperiode voor bekostiging in aanmerking komen en de reden waarom de overige scholen daarvoor
      niet in aanmerking komen. Het plan vermeldt verder van elke school de plaats van vestiging en de te verwachten
      omvang. Het plan behoeft de goedkeuring van Onze minister, bedoeld in [artikel 79][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel79
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '79'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '2'
  - number: '74.3'
    text: |-
      Bij de goedkeuring van Onze minister van het plan, treden voor de toepassing van
      [artikel 4:8 van de Algemene wet bestuursrecht][ref1] burgemeester en wethouders in de plaats van het bevoegd gezag
      van de bijzondere scholen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '75.1'
    text: |-
      Een voorstel van burgemeester en wethouders aan de gemeenteraad dat de opneming in het plan van een of meer
      openbare scholen bevat, gaat vergezeld van:
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel75
  - number: 75.1.a
    text: een prognose van het te verwachten aantal leerlingen,
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel75
  - number: 75.1.b
    text: de beschrijving van het voedingsgebied,
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel75
  - number: 75.1.c
    text: de aanduiding van de plaats in de gemeente waar het onderwijs moet worden gegeven en
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel75
  - number: 75.1.d
    text: de voorgestelde datum van ingang van de bekostiging.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel75
  - number: '75.2'
    text: |-
      De gemeenteraad neemt een openbare school in elk geval in het plan op, indien binnen 10 kilometer van de plaats in
      de gemeente waar het onderwijs moet worden gegeven over de weg gemeten geen school aanwezig is waarbinnen openbaar
      onderwijs wordt gegeven en aan het volgen van openbaar onderwijs behoefte bestaat. De gemeenteraad neemt een
      openbare school voorts in het plan op, indien op grond van de bij het voorstel overgelegde gegevens aannemelijk is,
      dat zij voldoet aan de normen van [artikel 77, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel77
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '77'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '2'
  - number: '75.3'
    text: |-
      De in het eerste lid bedoelde prognose: a. geeft inzicht in het te verwachten aantal leerlingen voor elk jaar van
      het tijdvak waarop de prognose betrekking heeft, b. is gebaseerd op statistische gegevens over een tijdvak van 5
      jaar en c. vermeldt de berekeningen die tot de uitkomsten hebben geleid. De prognose bevat gegevens omtrent: 1°.
      het voedingsgebied, 2°. de plaats in de gemeente waar het onderwijs moet worden gegeven, 3°. de bevolking in het
      voedingsgebied van 0 tot en met 14 jaar, verdeeld in leeftijdsgroepen van 1 jaar, 4°. de te verwachten instroom
      naar en uitstroom uit die bevolking, 5°. het te verwachten aantal levendgeborenen en 6°. indien het betreft
      openbaar onderwijs waarvoor nog geen basisonderwijs binnen de gemeente wordt gegeven: het belangstellingspercentage
      voor het openbaar basisonderwijs in een vergelijkbare gemeente, of 7°. indien het betreft openbaar onderwijs
      waarvoor reeds een school binnen de gemeente aanwezig is: het belangstellingspercentage voor de openbare school of
      scholen binnen de gemeente. De prognose kan tevens gegevens bevatten naar aanleiding van de directe meting.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel75
  - number: '75.4'
    text: |-
      Bij ministeriële regeling worden modellen vastgesteld voor het verstrekken van de prognose, bedoeld in het eerste
      lid. Daarbij wordt aangegeven op welke wijze de prognose wordt ingediend.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel75
  - number: '76.1'
    text: |-
      Een verzoek om opneming in het plan van een bijzondere school moet voor 1 februari van het jaar van de vaststelling
      van het plan bij de gemeenteraad worden ingediend.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel76
  - number: '76.2'
    text: |-
      Het verzoek vermeldt de richting van de school en naam en adres van het bevoegd gezag en gaat vergezeld van de
      gegevens genoemd in [artikel 75, eerste lid][ref1], juncto [artikel 75, derde lid][ref2], met dien verstande dat in
      afwijking van [artikel 75, eerste lid,][ref3] juncto [artikel 75, derde lid onder c 6°en c 7°][ref4] de prognose
      gegevens bevat omtrent:


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel75
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel75
      [ref3]: https://wetten.overheid.nl/BWBR0003420#Artikel75
      [ref4]: https://wetten.overheid.nl/BWBR0003420#Artikel75
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '75'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '75'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0003420
        artikel: '75'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0003420
        artikel: '75'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '2'
  - number: 76.2.a
    text: |-
      indien het betreft een richting waarvoor nog geen basisonderwijs binnen de gemeente wordt gegeven: het
      belangstellingspercentage voor het basisonderwijs van die richting in een vergelijkbare gemeente, of
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel76
  - number: 76.2.b
    text: |-
      indien het betreft een school van een richting waarvoor reeds een school binnen de gemeente aanwezig is: het
      belangstellingspercentage voor de school of scholen van die richting binnen de gemeente.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel76
  - number: '77.1'
    text: |-
      De gemeenteraad neemt een bijzondere school in elk geval in het plan op, indien op grond van de bij het verzoek
      overgelegde gegevens aannemelijk is dat zij binnen 5 jaar vanaf de datum van ingang van de bekostiging en
      voorts gedurende 15 jaar na die periode van 5 jaar zal worden bezocht door ten minste het aantal leerlingen dat
      overeenkomt met de voor de gemeente geldende stichtingsnorm.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel77
  - number: '77.2'
    text: |-
      Bij ministeriële regeling wordt voor elke gemeente een stichtingsnorm vastgesteld welke 10/6 bedraagt van de voor
      de gemeente geldende opheffingsnorm berekend op grond van [artikel 154][ref1]. De uitkomst wordt afgerond, waarbij
      de decimalen worden verwaarloosd indien het eerste cijfer achter de komma kleiner is dan 5 en de decimalen worden
      verwaarloosd en het getal verhoogd met 1 indien het eerste cijfer achter de komma gelijk is aan of groter is dan 5.
      De stichtingsnorm bedraagt minimaal 200.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel154
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '154'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '9'
  - number: '77.3'
    text: |-
      De stichtingsnormen, bedoeld in het tweede lid, zijn in afwijking van het tweede lid, eerste volzin, voor de eerste
      maal opgenomen in de bij deze wet behorende bijlage. Deze normen zijn tot en met 31 juli 1998 van kracht. Deze
      normen worden met ingang van 1 augustus 1998 telkens voor een tijdvak van 5 jaar gelijktijdig met de aanpassing
      van de opheffingsnormen op grond van [artikel 153][ref1] bij ministeriële regeling aangepast. De ministeriële
      regeling, bedoeld in de derde volzin, wordt voor 1 november van het jaar voorafgaand aan het laatste jaar waarin de
      stichtingsnormen van kracht zijn, bekendgemaakt in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel153
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '153'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '9'
  - number: '77.4'
    text: |-
      In het geval van een wijziging van de gemeentelijke indeling of een grenscorrectie als bedoeld in
      [artikel 283 van de Gemeentewet][ref1], stelt Onze minister op de wijze als aangegeven in het tweede lid de
      nieuwe stichtingsnormen voor de betrokken gemeenten vast, voor zover deze afwijken van de op grond van het tweede
      en derde lid bepaalde stichtingsnormen. De nieuwe stichtingsnormen treden in de plaats van de op grond van het
      tweede en derde lid bepaalde stichtingsnormen en treden in werking met ingang van 1 januari volgend op de datum
      van herindeling, bedoeld in [artikel 1, onderdeel f, van de Wet algemene regels herindeling][ref2]. Tot en met
      31 december volgend op de datum van herindeling blijven op de scholen in de gemeenten die bij de wijziging van de
      gemeentelijke indeling of de grenscorrectie zijn betrokken, de stichtingsnormen van toepassing die golden op de dag
      voorafgaande aan de datum van herindeling.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel283
      [ref2]: https://wetten.overheid.nl/BWBR0003718#Artikel1
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '283'
      - id: ref2
        bwb_id: BWBR0003718
        artikel: '1'
  - number: '77.5'
    text: |-
      In het geval van een wijziging van de naam van een gemeente of een wijziging van het gemeentenummer past
      Onze minister de ministeriële regeling, bedoeld in het tweede lid, of de bijlage, bedoeld in het derde lid,
      dienovereenkomstig aan.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel77
  - number: '78'
    text: |-
      Bij de berekening van het aantal leerlingen dat een openbare of een bijzondere school zal bezoeken, worden
      niet meegeteld leerlingen die wonen binnen redelijke afstand van een openbare school, onderscheidenlijk van een
      bijzondere school van de desbetreffende richting of richtingen en voor wie op die school plaatsruimte aanwezig is.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel78
  - number: '79.1'
    text: |-
      Aan het plan wordt toegevoegd een overzicht van de verzoeken die niet zijn ingewilligd en de motivering daarvan.
      In het plan wordt aangegeven op welke wijze [artikel 78][ref1] ten aanzien van de op het plan geplaatste scholen
      is toegepast. Deze stukken worden door de gemeenteraad binnen 2 weken na de vaststelling van het plan aan alle
      verzoekers gezonden met vermelding van de datum waarop het plan ter goedkeuring aan Onze minister is gezonden. Het
      plan wordt gedurende 6 weken ter inzage gelegd in het gemeentehuis.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel78
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '78'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '2'
  - number: '79.2'
    text: |-
      Binnen 2 weken na de vaststelling wordt het plan ter goedkeuring aan Onze minister gezonden. Het gaat vergezeld
      van de ingewilligde verzoeken en de stukken genoemd in het eerste lid. Indien de bij het verzoek gevoegde gegevens
      onvoldoende zijn om het verzoek te kunnen beoordelen, deelt Onze minister voor 15 september volgend op de in de
      eerste volzin bedoelde datum aan burgemeester en wethouders mede dat de gegevens voor 15 oktober daaropvolgend
      dienen te worden aangevuld. Indien de aanvullende gegevens niet voor 15 oktober zijn verstrekt, wordt het verzoek
      buiten behandeling gelaten.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel79
  - number: '79.3'
    text: |-
      Onze minister besluit voor 1 januari voorafgaande aan de planperiode. Afschrift van het besluit wordt binnen 2
      weken aan de gemeenteraad gezonden. Indien Onze minister niet voor 1 januari heeft besloten, wordt het plan geacht
      te zijn goedgekeurd.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel79
  - number: '79.4'
    text: 'Onze minister onthoudt zijn goedkeuring voor zover:'
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel79
  - number: 79.4.a
    text: |-
      de in [artikel 75,][ref1] tweede lid eerste volzin, omschreven situatie zich voordoet en geen openbare school in
      het plan werd opgenomen;


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel75
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '75'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '2'
  - number: 79.4.b.1°
    text: |-
      op grond van de bij het verzoek om goedkeuring overgelegde gegevens niet aannemelijk is dat een school
      overeenkomstig de [artikelen 77][ref1] en [78][ref2] zal worden bezocht door het ingevolge [artikel 77][ref3]
      vereiste aantal leerlingen, dan wel


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel77
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel78
      [ref3]: https://wetten.overheid.nl/BWBR0003420#Artikel77
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '77'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '78'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0003420
        artikel: '77'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '2'
  - number: 79.4.b.2°
    text: |-
      indien het in een zodanig geval betreft een openbare school de stichting daarvan niet noodzakelijk is, omdat de in
      [artikel 75, tweede lid eerste volzin][ref1], omschreven situatie zich niet voordoet;


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel75
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '75'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '2'
  - number: 79.4.c.1°
    text: |-
      wegens een in het plan opgenomen andere school of een in een plan van een andere gemeente opgenomen school,
      die voor bekostiging in aanmerking zal worden gebracht, niet aannemelijk is dat een school overeenkomstig de
      [artikelen 77][ref1] en [78][ref2] zal worden bezocht door het ingevolge [artikel 77][ref3] vereiste aantal
      leerlingen, dan wel


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel77
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel78
      [ref3]: https://wetten.overheid.nl/BWBR0003420#Artikel77
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '77'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '78'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0003420
        artikel: '77'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '2'
  - number: 79.4.c.2°
    text: |-
      indien het in een zodanig geval betreft een openbare school de stichting daarvan niet noodzakelijk is, omdat de in
      [artikel 75, tweede lid eerste volzin][ref1], omschreven situatie zich niet meer zal voordoen;


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel75
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '75'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '2'
  - number: 79.4.d
    text: niet is voldaan aan het bij en krachtens deze wet bepaalde met betrekking tot de prognoses;
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel79
  - number: 79.4.e
    text: is uitgegaan van kennelijk ondeugdelijke prognoses, of
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel79
  - number: 79.4.f
    text: |-
      ten aanzien van een op het plan geplaatste school ten onrechte niet is bepaald dat zij voor bekostiging in
      aanmerking komt bij de aanvang van het eerste schooljaar van de planperiode.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel79
  - number: '79.5'
    text: |-
      Bij onthouding van de goedkeuring op grond van het vierde lid onder a, draagt Onze minister de gemeenteraad op
      alsnog een openbare school in het plan op te nemen. Indien goedkeuring wordt onthouden op grond van het vierde
      lid onder f draagt Onze minister de gemeenteraad op in het plan alsnog te vermelden dat de betrokken school bij de
      aanvang van het eerste schooljaar van de planperiode voor bekostiging in aanmerking komt.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel79
  - number: '79.6'
    text: |-
      Indien ten gevolge van een besluit van Onze minister op grond van het vierde lid een school uit het plan moet
      vervallen, maakt Onze minister dit besluit binnen 2 weken bekend aan de indiener van het verzoek om opneming in het
      plan van de betrokken school.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel79
  - number: '79.7'
    text: |-
      Indien tegen een besluit van Onze minister als bedoeld in het zesde lid beroep is ingesteld en de uitspraak dan wel
      het naar aanleiding daarvan genomen besluit van Onze minister strekt tot het voor bekostiging in aanmerking brengen
      van de school, neemt de gemeenteraad de school op in het na de uitspraak onderscheidenlijk het besluit vast te
      stellen plan.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel79
  - number: '79.8'
    text: |-
      Zodra de bekostiging van een in het plan opgenomen school een aanvang kan nemen, maakt Onze minister dit bekend aan
      het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel79
  - number: '80.1'
    text: |-
      Indien de gemeenteraad een verzoek tot opneming in het plan van een bijzondere of een openbare school niet heeft
      ingewilligd, kunnen de verzoekers administratief beroep instellen bij Onze minister.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel80
  - number: '80.2'
    text: |-
      Indien een onherroepelijk geworden beslissing in beroep of een uitspraak naar aanleiding van de beslissing in
      beroep, dan wel het naar aanleiding daarvan genomen besluit van Onze minister strekt tot het voor bekostiging
      in aanmerking brengen van de school, neemt de gemeenteraad de school op in het na de beslissing in beroep, de
      uitspraak of het besluit vast te stellen plan.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel80
  - number: '81.1'
    text: |-
      Scholen die gedurende 3 achtereenvolgende schooljaren in het plan zijn opgenomen en niet voor bekostiging in
      aanmerking zijn gebracht, brengt de gemeenteraad voor het daaropvolgende schooljaar voor bekostiging in aanmerking.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel81
  - number: '81.2'
    text: |-
      Ten aanzien van een school die ingevolge [artikel 79, zevende lid][ref1], in het daar bedoelde plan wordt
      opgenomen, vangt de termijn genoemd in het eerste lid, aan met ingang van het eerste schooljaar van het plan waarin
      de school was opgenomen. Ten aanzien van een school die ingevolge [artikel 80, tweede lid][ref2], in het daar
      bedoelde plan wordt opgenomen, vangt de termijn genoemd in het eerste lid, aan met ingang van het eerste schooljaar
      van het plan waarvoor het verzoek werd ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel79
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel80
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '79'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '80'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '2'
  - number: '82.1'
    text: 'Behoudens het bepaalde in het tweede lid worden in elk plan de scholen uit het voorgaande plan opgenomen die:'
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel82
  - number: 82.1.a
    text: nog niet voor bekostiging in aanmerking zijn gebracht, of
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel82
  - number: 82.1.b
    text: voor bekostiging in aanmerking zijn gebracht, maar waaraan het onderwijs nog niet is aangevangen.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel82
  - number: '82.2'
    text: 'Uit het voorgaande plan wordt een school niet opgenomen:'
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel82
  - number: 82.2.a
    text: indien de indiener van een verzoek heeft gevraagd de school te laten vervallen;
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel82
  - number: 82.2.b
    text: |-
      indien aan een bijzondere school het onderwijs niet is aangevangen bij aanvang van het tweede schooljaar volgend op
      het schooljaar waarvoor de school het eerst voor bekostiging in aanmerking is gebracht, tenzij opneming in het plan
      op grond van de bij een nieuw verzoek overgelegde gegevens gerechtvaardigd is, of
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel82
  - number: 82.2.c
    text: |-
      indien zich naar het oordeel van de gemeenteraad omstandigheden hebben voorgedaan die bij de vaststelling van het
      plan niet bekend waren, en die, waren zij wel bekend geweest, tot een ander besluit zouden hebben geleid.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel82
  - number: '82.3'
    text: |-
      [Artikel 80][ref1] is van overeenkomstige toepassing indien een school ingevolge het tweede lid onder c niet in een
      volgend plan wordt opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel80
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '80'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '2'
  - number: '83.1'
    text: 'De vaststelling van een plan blijft achterwege indien:'
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel83
  - number: 83.1.a
    text: |-
      geen verzoeken om opneming in het plan zijn ingekomen of geen der ingekomen verzoeken voor inwilliging in
      aanmerking komt,
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel83
  - number: 83.1.b
    text: |-
      stichting van een openbare school niet noodzakelijk is, omdat de in [artikel 75, tweede lid eerste volzin][ref1],
      omschreven situatie zich niet voordoet en


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel75
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '75'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '2'
  - number: 83.1.c
    text: geen scholen uit het voorafgaande plan voor opneming in het plan in aanmerking komen.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel83
  - number: '83.2'
    text: |-
      Het besluit bedoeld in het eerste lid onder b, behoeft uitsluitend de goedkeuring van Onze minister, indien
      in het voorafgaande jaar een zelfde besluit werd genomen en daarvoor geen goedkeuring is gevraagd. Het goed
      te keuren besluit wordt voor 1 augustus voorafgaande aan de betrokken planperiode aan Onze minister gezonden.
      [Artikel 79, derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel79
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '79'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '2'
  - number: '83.3'
    text: |-
      Indien een onherroepelijk geworden besluit van Onze minister of een naar aanleiding van het besluit van Onze
      minister in beroep als bedoeld in [artikel 71][ref1] gegeven beslissing strekt tot het voor bekostiging in
      aanmerking brengen van een openbare school, neemt de gemeenteraad de school op in het na het onherroepelijk
      geworden besluit onderscheidenlijk de in dat beroep gegeven beslissing vast te stellen plan.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel71
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '71'
        hoofdstuk: I
        afdeling: '1'
  - number: '83.4'
    text: |-
      Aan de indieners van de niet ingewilligde verzoeken bedoeld in het eerste lid onder a, wordt voor 15 augustus
      voorafgaande aan de betrokken planperiode, afschrift gezonden van het desbetreffende raadsbesluit.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel83
  - number: '84.1'
    text: |-
      Onze minister kan onder door hem te stellen voorwaarden voor bekostiging in aanmerking brengen een school die wordt
      omgezet, als bedoeld in [artikel 74, eerste lid derde volzin][ref1], of waaraan het onderwijs wordt uitgebreid met
      openbaar onderwijs, dan wel met onderwijs van een of meer richtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel74
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '74'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '2'
  - number: '84.2'
    text: |-
      Onze minister kan toestaan dat een bekostigde school een andere plaats van vestiging krijgt. Onze minister kan aan
      zijn toestemming voorwaarden verbinden.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel84
  - number: '84.3'
    text: |-
      Een verzoek om een besluit als bedoeld in het eerste of tweede lid, is met redenen omkleed en gaat vergezeld van de
      gegevens, genoemd in [artikel 75, eerste lid][ref1]. Onze minister willigt het verzoek slechts in, ingeval:


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel75
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '75'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '2'
  - number: 84.3.a
    text: |-
      de school, indien deze in een plan van scholen zou zijn opgenomen, bij toepassing van de
      [artikelen 77 tot en met 79][ref1] door hem zou worden goedgekeurd,


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel77
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '77'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '2'
  - number: 84.3.b
    text: |-
      indien op de onder a genoemde grond geen goedkeuring zou kunnen worden verleend en het een omzetting in een
      openbare school, een uitbreiding met openbaar onderwijs, of een verplaatsing van een school waaraan openbaar
      onderwijs wordt gegeven betreft, binnen 10 kilometer van de plaats in de gemeente waar het onderwijs moet worden
      gegeven over de weg gemeten geen school aanwezig is waarbinnen openbaar onderwijs wordt gegeven en aan het volgen
      van openbaar onderwijs behoefte bestaat, of
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel84
  - number: 84.3.c
    text: |-
      de bekostiging van de school, indien daaraan het onderwijs wordt uitgebreid met openbaar onderwijs of met
      onderwijs van een of meer richtingen, van uitsluitend een of meer op te heffen scholen, met inachtneming van de
      [artikelen 154 tot en met 156][ref1] gedurende ten minste 20 achtereenvolgende jaren zou kunnen worden voortgezet.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel154
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '154'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '9'
  - number: '85.1'
    text: 'De bekostiging van een nevenvestiging van een school neemt een aanvang met ingang van 1 augustus indien:'
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel85
  - number: 85.1.a
    text: |-
      de nevenvestiging overeenkomstig [artikel 158][ref1] voldoet aan een der normen voor bekostiging, genoemd in
      dat artikel en, voor zover het een nevenvestiging betreft die voor bekostiging in aanmerking komt op grond van
      het eerste lid, onder e, van dat artikel, op die grond aan alle scholen van het bevoegd gezag of, bij toepassing
      van [artikel 157, derde lid][ref2], de samenwerkende bevoegde gezagsorganen, niet meer nevenvestigingen worden
      verbonden dan het verschil tussen het totale aantal leerlingen van die scholen gedeeld door 260 en het totale
      aantal leerlingen van die scholen gedeeld door 290, waarbij de quotiënten naar beneden worden afgerond op een
      geheel getal,


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel158
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel157
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '158'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '9'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '157'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '9'
  - number: 85.1.b
    text: |-
      de nevenvestiging niet wordt verbonden aan een school die met toepassing van [artikel 157][ref1] in stand wordt
      gehouden,


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel157
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '157'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '9'
  - number: 85.1.c.1°
    text: |-
      de nevenvestiging, onmiddellijk voorafgaand aan het tijdstip van ingang van de bekostiging als nevenvestiging, als
      zelfstandige school van de desbetreffende richting dan wel indien het betreft een nevenvestiging van een openbare
      school als zelfstandige openbare school werd bekostigd, of
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel85
  - number: 85.1.c.2°
    text: de nevenvestiging voor bekostiging in aanmerking kwam als nevenvestiging van de voormalige school bedoeld onder 1°,
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel85
  - number: 85.1.d
    text: |-
      ingeval het betreft een nevenvestiging van een openbare school die in stand wordt gehouden door een andere
      rechtspersoon dan de gemeente op wier grondgebied de nevenvestiging is gelegen, die gemeente bij notariële akte de
      instandhouding van de school die nevenvestiging is geworden, heeft overgedragen aan die andere rechtspersoon, en
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel85
  - number: 85.1.e
    text: |-
      van de omvorming tot nevenvestiging voor 1 februari voorafgaand aan de datum, bedoeld in de aanhef, mededeling is
      gedaan aan Onze minister, en indien het betreft een situatie als bedoeld onder d, onder overlegging van gegevens
      waaruit blijkt dat aan het vereiste onder d is voldaan.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel85
  - number: '85.2'
    text: |-
      Bij de akte, bedoeld in het eerste lid onder d, worden tevens overgedragen de rechten die het bevoegd gezag van een
      school toekomen, ten aanzien van het gebouw en terrein, alsmede ten aanzien van de roerende zaken. In de akte wordt
      bepaald dat de rechtspersoon aan wie wordt overgedragen, het personeel in gelijke betrekkingen en onder dezelfde
      voorwaarden als vermeld in de akte van aanstelling, aan de school aanstelt met ingang van de datum van overdracht.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel85
  - number: '85.3'
    text: |-
      Door overdracht met inachtneming van het eerste en tweede lid, treedt de verkrijgende rechtspersoon in alle uit
      de wet voortvloeiende rechten en verplichtingen van zijn rechtsvoorganger voor zover deze zijn hoedanigheid van
      bevoegd gezag betroffen.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel85
  - number: '85.4'
    text: |-
      Onze minister maakt voor 1 mei volgend op de mededeling, bedoeld in het eerste lid onder e, aan het bevoegd gezag
      van de beoogde nevenvestiging bekend of de nevenvestiging zal worden bekostigd.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel85
  - number: '86'
    text: 'In deze paragraaf wordt onder «school» verstaan: speciale school voor basisonderwijs.'
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel86
  - number: '87.1'
    text: |-
      Onze minister kan een school op aanvraag van het bevoegd gezag van de school voor bekostiging in aanmerking
      brengen. Onze minister willigt de aanvraag slechts in, indien
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel87
  - number: 87.1.a
    text: de bevoegde gezagsorganen van alle basisscholen in het samenwerkingsverband met het verzoek instemmen,
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel87
  - number: 87.1.b
    text: |-
      het samenwerkingsverband meer dan de helft van de basisscholen omvat in een nieuwe woningbouwlocatie van ten minste
      15 000 woningen of in aan elkaar grenzende woningbouwlocaties waar binnen 10 jaar in totaal ten minste 15 000
      woningen worden gebouwd,
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel87
  - number: 87.1.c
    text: het samenwerkingsverband nog niet over een speciale school voor basisonderwijs beschikt, en
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel87
  - number: 87.1.d
    text: |-
      als gevolg van de oprichting van het samenwerkingsverband niet een reeds bestaand samenwerkingsverband onder de
      norm van [artikel 18, tweede lid][ref1], terecht zou komen.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel18
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '18'
        hoofdstuk: I
        paragraaf: '2'
        afdeling: '1'
  - number: '87.2'
    text: De bekostiging kan slechts aanvangen met ingang van 1 augustus van een schooljaar.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel87
  - number: '88.1'
    text: |-
      Onze minister kan onder door hem te stellen voorwaarden voor bekostiging in aanmerking brengen een school die wordt
      omgezet van een openbare in een bijzondere school of omgekeerd, waaraan de richting van het onderwijs verandert of
      waaraan het onderwijs wordt uitgebreid met openbaar onderwijs, dan wel met onderwijs van een of meer richtingen.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel88
  - number: '88.2'
    text: |-
      Onze minister kan ermee instemmen dat een bekostigde school een andere plaats van vestiging krijgt. Onze minister
      kan aan zijn instemming voorwaarden verbinden.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel88
  - number: '88.3'
    text: Een aanvraag van een besluit als bedoeld in het eerste of tweede lid is met redenen omkleed en gaat vergezeld van
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel88
  - number: 88.3.a
    text: |-
      een opgave van het samenwerkingsverband of de samenwerkingsverbanden waaraan de school deelneemt en zal gaan
      deelnemen,
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel88
  - number: 88.3.b
    text: de voorgestelde datum van ingang van de bekostiging en,
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel88
  - number: 88.3.c.1°
    text: |-
      indien het betreft een aanvraag van een besluit als bedoeld in het eerste lid, het openbaar onderwijs of de
      richting of richtingen van het bijzonder onderwijs dat de school voor en na de omzetting, wijziging van richting of
      uitbreiding met een of meer richtingen omvat, of
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel88
  - number: 88.3.c.2°
    text: |-
      indien het betreft een aanvraag van een besluit als bedoeld in het tweede lid, de aanduiding van de plaats in de
      gemeente waar het onderwijs moet worden gegeven.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel88
  - number: '88.4'
    text: |-
      Onze minister willigt de aanvraag van een besluit als bedoeld in het tweede lid slechts in, ingeval binnen het
      betrokken samenwerkingsverband of de betrokken samenwerkingsverbanden sprake blijft van een goede bereikbaarheid
      van speciale scholen voor basisonderwijs.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel88
  - number: '88.5'
    text: |-
      De omzetting, wijziging van richting of uitbreiding met openbaar of bijzonder onderwijs kan slechts plaatsvinden
      met ingang van 1 augustus van een schooljaar.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel88
  - number: '89.1'
    text: 'De bekostiging van een nevenvestiging van een school neemt een aanvang met ingang van 1 augustus indien:'
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel89
  - number: 89.1.a.1°
    text: |-
      de nevenvestiging, onmiddellijk voorafgaand aan het tijdstip van ingang van de bekostiging als nevenvestiging,
      bekostigd werd als een zelfstandige school, of
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel89
  - number: 89.1.a.2°
    text: de nevenvestiging voor bekostiging in aanmerking kwam als nevenvestiging van de voormalige school bedoeld onder 1°,
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel89
  - number: 89.1.b
    text: |-
      ingeval het betreft een nevenvestiging van een openbare school die in stand wordt gehouden door een andere
      rechtspersoon dan de gemeente op wier grondgebied de nevenvestiging is gelegen, die gemeente bij notariële akte de
      instandhouding van de school die nevenvestiging is geworden, heeft overgedragen aan die andere rechtspersoon, en
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel89
  - number: 89.1.c
    text: |-
      van de omvorming tot nevenvestiging voor 1 februari voorafgaand aan de datum, bedoeld in de aanhef, mededeling is
      gedaan aan Onze minister, en indien het betreft een situatie als bedoeld onder b, onder overlegging van de gegevens
      waaruit blijkt dat aan het vereiste onder b is voldaan.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel89
  - number: '89.2'
    text: |-
      Bij de akte, bedoeld in het eerste lid onder b, worden tevens overgedragen de rechten die het bevoegd gezag van een
      school toekomen ten aanzien van het gebouw en terrein, alsmede ten aanzien van de roerende zaken. In de akte wordt
      bepaald dat de rechtspersoon aan wie wordt overgedragen, het personeel in gelijke betrekkingen en onder dezelfde
      voorwaarden als vermeld in de akte van aanstelling, aan de school aanstelt met ingang van de datum van overdracht.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel89
  - number: '89.3'
    text: |-
      Door overdracht met inachtneming van het eerste en tweede lid, treedt de verkrijgende rechtspersoon in alle uit
      de wet voortvloeiende rechten en verplichtingen van zijn rechtsvoorganger voor zover deze zijn hoedanigheid van
      bevoegd gezag betroffen.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel89
  - number: '89.4'
    text: |-
      Onze minister maakt voor 1 mei volgend op de mededeling, bedoeld in het eerste lid onder c, aan het bevoegd gezag
      van de beoogde nevenvestiging bekend of de nevenvestiging zal worden bekostigd.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel89
  - number: '90.1'
    text: Bij algemene maatregel van bestuur kunnen nadere voorschriften worden gegeven voor de uitvoering van deze afdeling.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel90
  - number: '90.2'
    text: |-
      Een ontwerp van een algemene maatregel van bestuur als bedoeld in het eerste lid wordt geplaatst in de
      Staatscourant. De algemene maatregel van bestuur treedt niet in werking dan nadat 4 weken na de plaatsing zijn
      verstreken.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel90
  - number: '91.1'
    text: |-
      De gemeenteraad draagt ten behoeve van de door de gemeente in stand gehouden scholen en ten behoeve van de niet
      door de gemeente in stand gehouden scholen zorg voor de voorzieningen in de huisvesting op het grondgebied van de
      gemeente overeenkomstig het bepaalde in deze afdeling. Hij behandelt daarbij de door de gemeente in stand gehouden
      scholen en de niet door de gemeente in stand gehouden scholen op gelijke voet.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel91
  - number: '91.2'
    text: |-
      Voor de toepassing van deze afdeling wordt onder een niet door de gemeente in stand gehouden school mede begrepen
      een op het grondgebied van de gemeente gelegen nevenvestiging van een school waarvan de hoofdvestiging op het
      grondgebied van een andere gemeente is gelegen.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel91
  - number: '92.1'
    text: 'Voor de toepassing van deze afdeling worden onder voorzieningen in de huisvesting begrepen:'
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel92
  - number: 92.1.a
    text: 'voor blijvend onderscheidenlijk voor tijdelijk gebruik bestemde voorzieningen, bestaande uit:'
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel92
  - number: 92.1.a.1°
    text: |-
      nieuwbouw, een bestaand gebouw of een gedeelte daarvan, verplaatsing van een bestaand gebouw of van een gedeelte
      daarvan, terreinen, alsmede eerste aanschaf van onderwijsleerpakketten en meubilair,
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel92
  - number: 92.1.a.2°
    text: uitbreiding van de onder 1° bedoelde voorzieningen, en
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel92
  - number: 92.1.a.3°
    text: medegebruik van een ruimte die geschikt is voor het onderwijs;
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel92
  - number: 92.1.b
    text: 'voorzieningen, bestaande uit:'
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel92
  - number: 92.1.b.1°
    text: |-
      aanpassingen met uitzondering van het aanbrengen van een invalidentoilet en het toegankelijk maken van het gebouw
      voor gehandicapten, en
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel92
  - number: 92.1.b.2°
    text: |-
      vervanging binnenkozijnen en binnendeuren inclusief hang- en sluitwerk, algehele vervanging radiatoren, convectoren
      en leidingen voor de centrale verwarming, alsmede onderhoud aan de buitenzijde van het gebouw met uitzondering van
      het buitenschilderwerk;
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel92
  - number: 92.1.c
    text: |-
      herstel van constructiefouten aan het gebouw, alsmede herstel en vervanging in verband met schade aan gebouw,
      onderwijsleerpakketten en meubilair in geval van bijzondere omstandigheden.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel92
  - number: '92.2'
    text: |-
      Bij algemene maatregel van bestuur worden bruto vloeroppervlakten per gelijktijdig aanwezige leerling
      voorgeschreven die voorzieningen in de huisvesting ten minste dienen te bevatten. Deze oppervlakten kunnen per
      schoolsoort verschillend worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel92
  - number: '93.1'
    text: |-
      De gemeenteraad stelt jaarlijks ten behoeve van het eerstvolgende jaar voor een door hem te bepalen tijdstip een
      bekostigingsplafond vast voor de bekostiging van de voorzieningen in de huisvesting voor:
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel93
  - number: 93.1.a
    text: scholen,
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel93
  - number: 93.1.b
    text: |-
      scholen voor speciaal onderwijs, scholen voor voortgezet speciaal onderwijs, scholen voor speciaal en voortgezet
      speciaal onderwijs dan wel instellingen voor speciaal en voortgezet speciaal onderwijs, en
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel93
  - number: 93.1.c
    text: |-
      scholen voor voorbereidend wetenschappelijk onderwijs, voor hoger en middelbaar algemeen voortgezet onderwijs en
      voor voorbereidend beroepsonderwijs.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel93
  - number: '93.2'
    text: |-
      Het bekostigingsplafond wordt zodanig vastgesteld dat redelijkerwijs kan worden voorzien in de huisvesting van de
      in het eerste lid bedoelde scholen op het grondgebied van de gemeente.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel93
  - number: '94.1'
    text: |-
      Het bevoegd gezag van een niet door de gemeente in stand gehouden school dat een voorziening in de huisvesting
      wenst, dient een aanvraag voor opneming van die voorziening op het programma, bedoeld in [artikel 95][ref1], in bij
      burgemeester en wethouders.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel95
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '95'
        hoofdstuk: I
        afdeling: '3'
  - number: '94.2'
    text: |-
      De gemeenteraad kan ten aanzien van voorzieningen als bedoeld in [artikel 92][ref1] bekostiging verstrekken ter
      zake van de kosten van bouwvoorbereiding.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel92
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '92'
        hoofdstuk: I
        afdeling: '3'
  - number: '94.3'
    text: |-
      De gemeenteraad stelt vast, voor welk tijdstip de aanvraag wordt ingediend en aan welke voorwaarden deze dient
      te voldoen.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel94
  - number: '94.4'
    text: Het derde lid is van overeenkomstige toepassing op de door de gemeente in stand gehouden scholen.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel94
  - number: '95.1'
    text: |-
      De gemeenteraad stelt, na overleg met de bevoegde gezagsorganen van de niet door de gemeente in stand gehouden
      scholen in de gemeente, jaarlijks ten behoeve van het onderwijs op het grondgebied van de gemeente voor een door
      hem te bepalen tijdstip een programma als bedoeld in het tweede lid vast. Het programma heeft betrekking op scholen
      als bedoeld in [artikel 93, eerste lid, onderdelen a, b en c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel93
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '93'
        hoofdstuk: I
        afdeling: '3'
  - number: '95.2'
    text: |-
      Het programma omvat de voorzieningen in de huisvesting, bedoeld in [artikel 92][ref1], die in het jaar na de
      vaststelling van het programma voor bekostiging in aanmerking zullen worden gebracht voor niet door de gemeente in
      stand gehouden scholen alsmede voorzieningen die nodig zijn voor door de gemeente in stand gehouden scholen.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel92
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '92'
        hoofdstuk: I
        afdeling: '3'
  - number: '95.3'
    text: 'De gemeenteraad neemt uitsluitend voorzieningen in de huisvesting in het programma op, voor zover:'
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel95
  - number: 95.3.a
    text: |-
      met de voorzieningen in het kalenderjaar volgend op het jaar van vaststelling van het programma redelijkerwijs een
      aanvang kan worden gemaakt dan wel de voorzieningen in het desbetreffende kalenderjaar kunnen worden gerealiseerd,
      en
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel95
  - number: 95.3.b
    text: |-
      niet een van de weigeringsgronden, genoemd in [artikel 100][ref1], van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel100
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '100'
        hoofdstuk: I
        afdeling: '3'
  - number: '95.4'
    text: |-
      Indien het bekostigingsplafond, bedoeld in [artikel 93][ref1], niet toereikend is, worden die voorzieningen in het
      programma opgenomen die uit dat bekostigingsplafond kunnen worden bekostigd, waarbij de volgorde wordt bepaald met
      inachtneming van de criteria, bedoeld in [artikel 102, eerste lid, onderdeel c][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel93
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel102
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '93'
        hoofdstuk: I
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '102'
        hoofdstuk: I
        afdeling: '3'
  - number: '95.5'
    text: |-
      De beschikking van de gemeenteraad kan een gedeelte van de gewenste voorziening dan wel een andere voorziening dan
      gewenst omvatten.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel95
  - number: '95.6'
    text: |-
      De gemeenteraad kan aan de opneming in het programma voorwaarden verbinden betreffende ingebruikneming of
      buitengebruikstelling van gebouwen of lokalen.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel95
  - number: '95.7'
    text: |-
      De gemeenteraad neemt bij de vaststelling van het programma de criteria, bedoeld in
      [artikel 102, eerste lid, onderdeel c][ref1], in acht.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel102
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '102'
        hoofdstuk: I
        afdeling: '3'
  - number: '95.8'
    text: |-
      Binnen vier weken na de vaststelling van het programma treden burgemeester en wethouders met het bevoegd gezag
      in overleg over de wijze van uitvoering. Indien dit overleg niet tot overeenstemming leidt, delen burgemeester en
      wethouders het bevoegd gezag mede dat zij niet kunnen instemmen met de door het bevoegd gezag gewenste wijze van
      uitvoering.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel95
  - number: '95.9'
    text: |-
      Tijdens het in het eerste lid bedoelde overleg kan de gemeenteraad de Onderwijsraad verzoeken een advies uit te
      brengen over de vaststelling van het programma huisvestingsvoorzieningen in relatie tot de vrijheid van richting
      en de vrijheid van inrichting. Het verzoek wordt gedaan indien een bevoegd gezag hierom heeft gevraagd dan wel uit
      eigen beweging. Het verzoek bevat een omschrijving van de onderwerpen waarover advies wordt verwacht. Het advies
      wordt binnen vier weken uitgebracht aan de gemeenteraad. Het advies wordt bekend gemaakt tezamen met het programma.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel95
  - number: '96'
    text: |-
      De gemeenteraad stelt gelijktijdig met het programma, bedoeld in [artikel 95][ref1], ten behoeve van het onderwijs
      op het grondgebied van de gemeente voor een door hem te bepalen tijdstip een overzicht vast van die voorzieningen
      die zijn aangevraagd dan wel nodig zijn, die niet op het programma zijn opgenomen. Daarbij wordt aangegeven waarom
      de desbetreffende voorzieningen niet zijn opgenomen. Het overzicht wordt ter inzage gelegd. Het overzicht heeft
      betrekking op scholen als bedoeld in [artikel 93, eerste lid, onderdelen a, b en c][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel95
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel93
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '95'
        hoofdstuk: I
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '93'
        hoofdstuk: I
        afdeling: '3'
  - number: '97'
    text: |-
      De gemeenteraad stelt geen programma als bedoeld in[ artikel 95][ref1] en geen overzicht als bedoeld in
      [artikel 96][ref2] vast, indien geen voorziening in de huisvesting nodig is noch een aanvraag is ingediend voor
      scholen als bedoeld in [artikel 93, eerste lid, onderdelen a, b en c][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel95
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel96
      [ref3]: https://wetten.overheid.nl/BWBR0003420#Artikel93
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel97
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '95'
        hoofdstuk: I
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '96'
        hoofdstuk: I
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0003420
        artikel: '93'
        hoofdstuk: I
        afdeling: '3'
  - number: '98.1'
    text: |-
      Het bevoegd gezag van een niet door de gemeente in stand gehouden school dat een voorziening in de huisvesting
      wenst die niet in het programma, bedoeld in [artikel 95][ref1], is opgenomen, maar die gelet op de voortgang van
      het onderwijs geen uitstel kan lijden, dient een aanvraag om bekostiging van die voorziening in bij burgemeester
      en wethouders.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel95
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel98
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '95'
        hoofdstuk: I
        afdeling: '3'
  - number: '98.2'
    text: |-
      De beschikking kan een gedeelte van de gewenste voorziening dan wel een andere voorziening dan gewenst omvatten. De
      gemeenteraad wijst de aanvraag af, indien:
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel98
  - number: 98.2.a
    text: het besluit over de voorziening kan worden genomen bij de vaststelling van het eerstvolgende programma, of
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel98
  - number: 98.2.b
    text: |-
      een van de weigeringsgronden, genoemd in
      [artikel 100, eerste lid, onderdelen a tot en met d en f, en tweede lid][ref1], van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel100
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel98
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '100'
        hoofdstuk: I
        afdeling: '3'
  - number: '99.1'
    text: |-
      De gemeenteraad beslist bij beschikking met ingang van welk tijdstip in het jaar volgend op het jaar van
      vaststelling van het programma, bedoeld in [artikel 95][ref1], de bekostiging van een voorziening die in het
      programma is opgenomen, daadwerkelijk een aanvang kan nemen, onverminderd het bepaalde in [artikel 101][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel95
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel101
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '95'
        hoofdstuk: I
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '101'
        hoofdstuk: I
        afdeling: '3'
  - number: '99.2'
    text: |-
      De aanspraak op bekostiging van een voorziening vervalt, indien niet binnen een door de gemeente in de verordening
      op basis van [artikel 102][ref1] te bepalen termijn na de beschikking, bedoeld in het eerste lid, met betrekking
      tot de voorziening een bouwopdracht is gegeven dan wel een koop-, huur- of erfpachtovereenkomst is gesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel102
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '102'
        hoofdstuk: I
        afdeling: '3'
  - number: '100.1'
    text: 'Een voorziening in de huisvesting wordt slechts geweigerd, indien:'
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel100
  - number: 100.1.a
    text: |-
      de gewenste voorziening geen voorziening is in de zin van [artikel 92][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel92
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel100
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '92'
        hoofdstuk: I
        afdeling: '3'
  - number: 100.1.b
    text: |-
      de gewenste voorziening niet gerechtvaardigd is op grond van de aard en de omvang van de voorzieningen waarover
      de school reeds beschikt, voor zover deze uit de openbare kas zijn bekostigd, gelet op de normen, bedoeld in
      [artikel 102, eerste lid, onderdeel b][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel102
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel100
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '102'
        hoofdstuk: I
        afdeling: '3'
  - number: 100.1.c
    text: |-
      de gewenste voorziening niet gerechtvaardigd is op grond van de te verwachten ontwikkeling van het
      aantal leerlingen of onderwijskundige ontwikkelingen, zulks met inachtneming van het bepaalde in
      [artikel 102, eerste lid, onderdelen c en d][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel102
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel100
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '102'
        hoofdstuk: I
        afdeling: '3'
  - number: 100.1.d
    text: |-
      op andere wijze dan wordt gewenst redelijkerwijs in de behoefte aan huisvesting kan worden voorzien, onder meer
      doordat binnen redelijke afstand van de gewenste plaats van de voorziening gebruik dan wel medegebruik mogelijk is,
      of een reeds voor bekostiging in aanmerking gebracht gebouw of deel daarvan beschikbaar komt,
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel100
  - number: 100.1.e
    text: |-
      het bekostigingsplafond, bedoeld in [artikel 93][ref1], niet toereikend is voor de te verstrekken voorzieningen
      voor scholen als bedoeld in het [eerste lid, onderdelen a, b en c, van dat artikel][ref2], of


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel93
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel93
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel100
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '93'
        hoofdstuk: I
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '93'
        hoofdstuk: I
        afdeling: '3'
  - number: 100.1.f
    text: de gewenste voorziening anders dan op grond van de onderdelen b tot en met d niet noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel100
  - number: '100.2'
    text: |-
      Een voorziening in de huisvesting kan tevens worden geweigerd, indien de voorziening als gevolg van het verwijtbaar
      nalaten van noodzakelijk onderhoud in een slechte bouwkundige staat verkeert of indien de voorziening nodig is voor
      herstel van schade die is veroorzaakt door schuld of toedoen van het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel100
  - number: '101'
    text: |-
      Voorzieningen die in het programma, bedoeld in [artikel 95][ref1], zijn opgenomen, komen voor bekostiging in
      aanmerking, mits op het tijdstip dat daarvoor op grond van [artikel 99, eerste lid][ref2], is vastgesteld,


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel95
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel99
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel101
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '95'
        hoofdstuk: I
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '99'
        hoofdstuk: I
        afdeling: '3'
  - number: 101.a
    text: is voldaan aan de bij of krachtens de wet gestelde voorschriften, en
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel101
  - number: 101.b
    text: |-
      de feiten en omstandigheden waarin de school verkeert, ten opzichte van de feiten en omstandigheden ten tijde van
      de vaststelling van het programma niet ingrijpend zijn gewijzigd.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel101
  - number: '102.1'
    text: 'De gemeenteraad stelt bij verordening een regeling vast met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel102
  - number: 102.1.a
    text: |-
      de voorzieningen die ingevolge [artikel 92][ref1] voor bekostiging in aanmerking kunnen worden gebracht,


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel92
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel102
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '92'
        hoofdstuk: I
        afdeling: '3'
  - number: 102.1.b
    text: de oppervlakte en de indeling van schoolgebouwen,
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel102
  - number: 102.1.c
    text: de urgentiecriteria,
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel102
  - number: 102.1.d
    text: de prognosecriteria,
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel102
  - number: 102.1.e
    text: |-
      de termijn bedoeld in [artikel 99][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel99
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel102
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '99'
        hoofdstuk: I
        afdeling: '3'
  - number: 102.1.f
    text: de procedure met betrekking tot verhuur en het medegebruik van ruimten voor het onderwijs,
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel102
  - number: 102.1.g
    text: |-
      de termijn gedurende welke een gebouw of terrein voor een school of nevenvestiging nog ten hoogste kan worden
      gebruikt bij toepassing van [artikel 110][ref1], alsmede de procedure in verband met een eventueel op te maken
      staat van onderhoud, en


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel110
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel102
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '110'
        hoofdstuk: I
        afdeling: '3'
  - number: 102.1.h
    text: |-
      de gegevens bedoeld in [artikel 112][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel112
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel102
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '112'
        hoofdstuk: I
        afdeling: '3'
  - number: '102.2'
    text: |-
      De regeling wordt zodanig vastgesteld dat kan worden voldaan aan de redelijke eisen die het onderwijs aan de
      huisvesting van scholen in de gemeente stelt.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel102
  - number: '102.3'
    text: |-
      De gemeenteraad stelt normen vast aan de hand waarvan de bedragen worden vastgesteld voor de toegekende
      voorzieningen in de huisvesting.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel102
  - number: '102.4'
    text: |-
      Burgemeester en wethouders betalen volgens door hen te stellen regels de bedragen aan de hand van de door de
      gemeenteraad gestelde normen.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel102
  - number: '102.5'
    text: |-
      De gemeenteraad stelt de regeling, bedoeld in het eerste lid, dan wel een wijziging daarvan, niet vast dan nadat
      daarover op overeenstemming gericht overleg is gevoerd met door de bevoegde gezagsorganen van de niet door de
      gemeente in stand gehouden scholen in de gemeente aan te wijzen vertegenwoordigers. De gemeenteraad stelt daartoe
      een procedure vast.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel102
  - number: '102.6'
    text: |-
      Tijdens het in het vijfde lid bedoelde overleg kan de gemeenteraad de Onderwijsraad verzoeken een advies uit te
      brengen over de vaststelling of wijziging van de gemeentelijke verordening in relatie tot de vrijheid van richting
      en de vrijheid van inrichting. Het verzoek wordt gedaan indien een bevoegd gezag hierom heeft gevraagd dan wel uit
      eigen beweging. Het verzoek bevat een omschrijving van de onderwerpen waarover advies wordt verwacht. Het advies
      wordt binnen vier weken uitgebracht aan de gemeenteraad. Het advies wordt bekend gemaakt tezamen met de verordening
      of de wijziging daarvan.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel102
  - number: '103.1'
    text: |-
      Het bevoegd gezag van een niet door de gemeente in stand gehouden school geeft opdracht de voorziening in de
      huisvesting waartoe op grond van de [artikelen 95][ref1] en [98][ref2] kan worden overgegaan, tot stand te brengen
      met daartoe door de gemeente beschikbaar te stellen gelden, tenzij het met burgemeester en wethouders overeenkomt
      dat de gemeente deze voorziening tot stand brengt.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel95
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel98
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel103
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '95'
        hoofdstuk: I
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '98'
        hoofdstuk: I
        afdeling: '3'
  - number: '103.2'
    text: |-
      Indien de gemeente de voorziening in de huisvesting van een niet door de gemeente in stand gehouden school tot
      stand heeft gebracht, worden gebouw en terrein aan het bevoegd gezag in eigendom overgedragen, tenzij burgemeester
      en wethouders en het bevoegd gezag anders overeenkomen.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel103
  - number: '103.3'
    text: |-
      Indien de voorziening in de huisvesting, bedoeld in het tweede lid, niet voldoet aan de eisen voor
      eigendomsoverdracht, geven burgemeester en wethouders deze aan het bevoegd gezag in gebruik.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel103
  - number: '104'
    text: |-
      Tenzij het bevoegd gezag van een niet door de gemeente in stand gehouden school dat aanspraak heeft op bekostiging
      van een voorziening in de huisvesting, met burgemeester en wethouders overeenkomt dat de gemeente deze voorziening
      tot stand brengt, behoeven de bouwplannen en de desbetreffende begrotingen de instemming van burgemeester en
      wethouders.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel104
  - number: '105'
    text: |-
      De gemeente brengt een voorziening in de huisvesting van een niet door de gemeente in stand gehouden school
      slechts tot stand, indien tussen burgemeester en wethouders en het bevoegd gezag overeenstemming bestaat over de
      bouwplannen en de wijze van uitvoering.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel105
  - number: '106.1'
    text: |-
      Het bevoegd gezag is verplicht het gebouw en terrein, alsmede de roerende zaken waarvoor bekostiging wordt genoten,
      behoorlijk te gebruiken en te onderhouden.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel106
  - number: '106.2'
    text: |-
      Vervreemding door het bevoegd gezag van een niet door de gemeente in stand gehouden school anders dan op grond
      van [artikel 49][ref1] of [artikel 56][ref2] van gebouwen, terreinen en roerende zaken waarvoor bekostiging wordt
      genoten, of bezwaren met een zakelijk recht door het bevoegd gezag van een niet door de gemeente in stand gehouden
      school van zodanige gebouwen en terreinen, is zonder toestemming van burgemeester en wethouders nietig.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel56
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel106
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '49'
        hoofdstuk: I
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '56'
        hoofdstuk: I
        afdeling: '3'
  - number: '106.3'
    text: |-
      Het tweede lid is niet van toepassing ten aanzien van het recht van opstal ten behoeve van een door de gemeente te
      plaatsen tijdelijke voorziening in de huisvesting op grond die eigendom is van het bevoegd gezag van de betrokken
      school.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel106
  - number: '107.1'
    text: |-
      Burgemeester en wethouders zijn bevoegd een gedeelte van een gebouw of terrein dat tijdelijk of gedurende een
      gedeelte van de dag niet nodig zal zijn voor de daar gevestigde school, gedurende die tijd als huisvesting voor
      een andere school, voor ander uit de openbare kas bekostigd onderwijs niet zijnde basisonderwijs, of voor educatie
      als bedoeld in de [Wet educatie en beroepsonderwijs][ref1] dan wel voor andere culturele, maatschappelijke of
      recreatieve doeleinden te bestemmen. Het voorgenomen gebruik dient zich te verdragen met het onderwijs aan de
      in het gebouw gevestigde school. Tevens zijn burgemeester en wethouders bevoegd ten behoeve van het onderwijs in
      lichamelijke oefening of expressie-activiteiten een gebouw of terrein dan wel een gedeelte daarvan dat tijdelijk
      gedurende gedeelten van de dag of in het geheel niet nodig zal zijn voor de daar gevestigde school, gedurende
      die tijd als huisvesting voor een andere school, voor ander uit de openbare kas bekostigd onderwijs niet zijnde
      basisonderwijs, of voor educatie als bedoeld in de [Wet educatie en beroepsonderwijs][ref2] dan wel voor andere
      culturele, maatschappelijke of recreatieve doeleinden te bestemmen.


      [ref1]: https://wetten.overheid.nl/BWBR0007625
      [ref2]: https://wetten.overheid.nl/BWBR0007625
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0007625
      - id: ref2
        bwb_id: BWBR0007625
  - number: '107.2'
    text: |-
      Indien het gebouw of terrein in gebruik is voor een niet door de gemeente in stand gehouden school plegen
      burgemeester en wethouders vooraf overleg met het bevoegd gezag en, voor zover van toepassing, ook met het bevoegd
      gezag van die school of nevenvestiging waarvoor de huisvesting is bestemd.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel107
  - number: '108.1'
    text: |-
      Voor zover [artikel 107][ref1] geen toepassing vindt, kan het bevoegd gezag een gedeelte van een gebouw
      of terrein in gebruik geven ten behoeve van uit de openbare kas bekostigd onderwijs dan wel voor andere
      culturele, maatschappelijke of recreatieve doeleinden. Voor zover niet nodig voor uit de openbare kas bekostigd
      onderwijs, kan het bevoegd gezag een gedeelte van het gebouw of terrein verhuren aan een derde, voor zover
      het gehuurde niet bestemd zal zijn als woon- of bedrijfsruimte in de zin van de vijfde en zesde afdeling van
      [titel 4 van Boek 7 van het Burgerlijk Wetboek][ref2]. Indien het een niet door de gemeente in stand gehouden
      school betreft, is voor verhuur toestemming van burgemeester en wethouders vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel107
      [ref2]: https://wetten.overheid.nl/BWBR0005290
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '107'
        hoofdstuk: I
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005290
  - number: '108.2'
    text: 'De ingebruikgeving of verhuur ingevolge het eerste lid eindigt:'
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel108
  - number: 108.2.a
    text: |-
      indien burgemeester en wethouders gebruik maken van hun bevoegdheid op grond van [artikel 107][ref1] zonder dat
      enige schadeplicht ontstaat, of


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel107
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '107'
        hoofdstuk: I
        afdeling: '3'
  - number: 108.2.b
    text: indien het in gebruik gegeven dan wel verhuurde deel nodig is voor gebruik door de eigen school.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel108
  - number: '108.3'
    text: |-
      Ingebruikgeving of verhuur ingevolge het eerste lid geschiedt niet indien het voorgenomen gebruik zich niet
      verdraagt met het onderwijs aan de in het gebouw gevestigde school.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel108
  - number: '108.4'
    text: |-
      Op de ingebruikgeving en verhuur ingevolge het eerste lid is
      [artikel 230a van Boek 7 van het Burgerlijk Wetboek][ref1] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel230a
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 230a
  - number: '108.5'
    text: |-
      Het zonder toestemming van burgemeester en wethouders verhuren van een gebouw of terrein door het bevoegd gezag
      van een niet door de gemeente in stand gehouden school alsmede elk met dit artikel strijdig beding opgenomen in een
      huurovereenkomst met betrekking tot schoolgebouwen, is nietig.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel108
  - number: '109'
    text: |-
      Voorzieningen aan gebouwen of terreinen in verband met verhuur krachtens de [artikelen 108][ref1] of [110][ref2]
      door het bevoegd gezag van een niet door de gemeente in stand gehouden school komen niet ten laste van de gemeente.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel108
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel110
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel109
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '108'
        hoofdstuk: I
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '110'
        hoofdstuk: I
        afdeling: '3'
  - number: '110.1'
    text: |-
      Burgemeester en wethouders en het bevoegd gezag van een niet door de gemeente in stand gehouden school dat eigenaar
      is van het gebouw en terrein, kunnen in een gezamenlijke akte verklaren dat het bevoegd gezag blijvend heeft
      opgehouden dan wel blijvend zal ophouden het gebouw of terrein of een voor eigendomsoverdracht vatbaar gedeelte
      daarvan, voor de school te gebruiken.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel110
  - number: '110.2'
    text: |-
      Gedeputeerde staten kunnen in geval van een geschil omtrent de toepassing van het eerste lid desgevraagd besluiten
      dat het bevoegd gezag blijvend heeft opgehouden dan wel blijvend zal ophouden het gebouw of terrein of een voor
      eigendomsoverdracht vatbaar gedeelte daarvan, voor de school te gebruiken. De aanvraag om het besluit wordt gedaan
      door burgemeester en wethouders of door het bevoegd gezag van de school. Alvorens op de aanvraag te besluiten,
      horen gedeputeerde staten de wederpartij.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel110
  - number: '110.3'
    text: |-
      Het bevoegd gezag van een niet door de gemeente in stand gehouden school dat voornemens is gebouwen of terreinen,
      of een gedeelte daarvan, blijvend niet meer voor de school te gebruiken, doet hiervan onverwijld mededeling aan
      burgemeester en wethouders.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel110
  - number: '110.4'
    text: |-
      Zodra de in het eerste lid bedoelde akte door beide partijen is getekend, of het in het tweede lid bedoelde besluit
      van gedeputeerde staten onherroepelijk is geworden dan wel in beroep is bepaald dat de uitspraak van de rechter,
      inhoudende een besluit als bedoeld in het tweede lid eerste volzin, in de plaats treedt van het vernietigde
      besluit, wordt de akte, het onherroepelijk geworden besluit onderscheidenlijk de uitspraak, tenzij deze een gebouw
      betreft als bedoeld in [artikel E 33 van de Overgangswet WBO](onbekend), ingeschreven in de openbare registers,
      bedoeld in [afdeling 2 van titel 1 van Boek 3 van het Burgerlijk Wetboek][ref1]. Door de inschrijving verkrijgt de
      gemeente de eigendom.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Afdeling2
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel110
    references:
      - id: ref1
        bwb_id: BWBR0005291
        afdeling: '2'
  - number: '110.5'
    text: |-
      Burgemeester en wethouders en het bevoegd gezag van een niet door de gemeente in stand gehouden school dat eigenaar
      is van het schoolgebouw, kunnen in een gezamenlijke akte verklaren dat een gedeelte van het gebouw dat niet vatbaar
      is voor eigendomsoverdracht, blijvend niet meer voor het onderwijs nodig zal zijn.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel110
  - number: '110.6'
    text: |-
      Gedeputeerde staten kunnen in geval van een geschil omtrent de toepassing van het vijfde lid desgevraagd besluiten
      dat een gedeelte van het gebouw dat niet vatbaar is voor eigendomsoverdracht, blijvend niet meer voor het onderwijs
      nodig zal zijn. De aanvraag om het besluit wordt gedaan door burgemeester en wethouders of door het bevoegd gezag
      van de school. Alvorens op de aanvraag te besluiten, horen gedeputeerde staten de wederpartij.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel110
  - number: '110.7'
    text: |-
      Zodra de in het vijfde lid bedoelde akte door beide partijen is getekend, of het in het zesde lid bedoelde besluit
      van gedeputeerde staten onherroepelijk is geworden dan wel in beroep is bepaald dat de uitspraak van de rechter,
      inhoudende een beslissing als bedoeld in het zesde lid eerste volzin, in de plaats treedt van het vernietigde
      besluit, kan het bevoegd gezag van een niet door de gemeente in stand gehouden school het desbetreffende gedeelte
      van het gebouw met toestemming van burgemeester en wethouders verhuren.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel110
  - number: '110.8'
    text: |-
      De toestemming, bedoeld in het zevende lid, wordt verleend voor een tijdvak van ten hoogste 3 jaren. Op verzoek van
      het bevoegd gezag kan dit tijdvak telkens worden verlengd met een termijn van ten hoogste 3 jaren.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel110
  - number: '110.9'
    text: |-
      Op de verhuur, bedoeld in het zevende lid, is [artikel 230a van Boek 7 van het Burgerlijk Wetboek][ref1] niet van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel230a
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel110
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 230a
  - number: '111'
    text: |-
      In afwijking van deze afdeling kan de gemeenteraad besluiten dat jaarlijks een bedrag voor huisvestingskosten
      wordt betaald aan het bevoegd gezag van een niet door de gemeente in stand gehouden school voor zover die op het
      grondgebied van die gemeente in stand wordt gehouden. De gemeenteraad neemt het besluit in overeenstemming met het
      bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel111
  - number: '112'
    text: |-
      Het bevoegd gezag van een niet door de gemeente in stand gehouden school is gehouden aan de gemeente alle
      inlichtingen te verschaffen die de gemeente voor een adequate uitvoering van de bepalingen in deze afdeling
      noodzakelijk acht.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel112
  - number: '113.1'
    text: |-
      Bij ministeriële regeling worden eenmaal in de vijf jaar voor 1 oktober programma's van eisen vastgesteld die
      de grondslag vormen voor de bekostiging van de voorzieningen, bedoeld in het derde lid. De programma's van eisen
      gelden voor de vijf jaar volgend op het jaar waarin de vaststelling dient plaats te vinden. In de programma's
      van eisen wordt een extra bekostiging opgenomen voor de gezamenlijke speciale scholen voor basisonderwijs in
      een samenwerkingsverband en voor de basisscholen van een samenwerkingsverband dat een instemming als bedoeld in
      [artikel 18, zevende lid][ref1], heeft verkregen. Elk programma van eisen omvat:


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel18
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel113
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '18'
        hoofdstuk: I
        paragraaf: '2'
        afdeling: '1'
  - number: 113.1.a
    text: een omschrijving van de in aanmerking genomen componenten waaruit de voorzieningen zijn opgebouwd,
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel113
  - number: 113.1.b
    text: de daarvoor noodzakelijk geachte bedragen en
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel113
  - number: 113.1.c
    text: de wijze waarop de voor elke voorziening vast te stellen bekostiging wordt berekend.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel113
  - number: '113.2'
    text: |-
      De programma's van eisen voldoen aan de redelijke behoeften van een in normale omstandigheden verkerende school,
      onverminderd het vierde tot en met negende lid, en houden rekening met de bruto vloeroppervlakten die op grond van
      de algemene maatregel van bestuur, bedoeld in [artikel 92, tweede lid][ref1], worden voorgeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel92
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel113
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '92'
        hoofdstuk: I
        afdeling: '3'
  - number: '113.3'
    text: |-
      Programma's van eisen worden vastgesteld voor de materiële voorzieningen ten behoeve van de instandhouding van de
      scholen, daaronder niet begrepen de ruimten voor het onderwijs in lichamelijke oefening.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel113
  - number: '113.4'
    text: |-
      Bij ministeriële regeling worden jaarlijks voor 1 oktober de overeenkomstig het zesde lid, aangepaste bedragen
      vastgesteld. De aldus vastgestelde bedragen zijn de definitieve bedragen, geldend voor het jaar volgend op het jaar
      waarin de vaststelling dient plaats te vinden.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel113
  - number: '113.5'
    text: |-
      Onze minister kan bij de vaststelling van de ministeriële regeling, bedoeld in het vierde lid, wijzigingen in de
      programma's van eisen aanbrengen indien de toestand van 's Rijks schatkist of onderwijskundige ontwikkelingen dat
      noodzakelijk maken. Aan de eerste volzin kan slechts toepassing worden gegeven indien de ministeriële regeling,
      bedoeld in het vierde lid, voor de in dat lid bedoelde datum wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel113
  - number: '113.6'
    text: |-
      De aanpassing, bedoeld in het vierde lid, vindt plaats door de bedragen op basis van de werkelijke
      prijsontwikkeling voor het tweede jaar voorafgaand aan het jaar waarvoor de bedragen worden vastgesteld, aan te
      passen overeenkomstig de prijsmutatie van de netto materiële consumptie, zoals opgenomen in de Macro Economische
      Verkenning, die naar verwachting zal optreden tussen het prijsniveau in het eerstbedoelde jaar en het prijsniveau
      in het daaropvolgende jaar, alsmede aan te passen overeenkomstig de prijsmutatie van de netto materiële consumptie,
      zoals opgenomen in de Macro Economische Verkenning, die naar verwachting zal optreden tussen het prijsniveau in
      het jaar voorafgaand aan het jaar waarvoor de bedragen worden vastgesteld en het jaar waarvoor de bedragen worden
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel113
  - number: '113.7'
    text: |-
      De ministeriële regelingen, bedoeld in het eerste en vierde lid, worden binnen 4 weken na de vaststelling, bedoeld
      in het eerste en vierde lid, gezamenlijk bekendgemaakt in de Staatscourant, onder gelijktijdige overlegging aan
      de Tweede Kamer der Staten-Generaal. De ministeriële regelingen treden niet in werking dan nadat 4 weken zijn
      verstreken na het overleggen aan de Tweede Kamer en gedurende die termijn niet door of namens de Kamer de wens tot
      overleg over de ministeriële regelingen te kennen wordt gegeven, dan wel met de Tweede Kamer overleg is gevoerd.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel113
  - number: '113.8'
    text: |-
      Naar aanleiding van het overleg met de Tweede Kamer kunnen wijzigingen in de programma's van eisen en de
      wijzigingen daarvan, bedoeld in het vijfde lid, worden aangebracht. De wijzigingen worden bekendgemaakt in de
      Staatscourant.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel113
  - number: '114'
    text: |-
      De programma's van eisen, bedoeld in [artikel 113, derde lid][ref1], worden onderverdeeld in programma's van eisen
      omtrent:


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel113
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel114
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '113'
        hoofdstuk: I
        afdeling: '4'
  - number: 114.a
    text: onderhoud,
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel114
  - number: 114.b
    text: energie- en waterverbruik,
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel114
  - number: 114.c
    text: publiekrechtelijke heffingen, met uitzondering van de belastingen ter zake van onroerende zaken,
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel114
  - number: 114.d
    text: middelen, en
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel114
  - number: 114.e
    text: administratie, beheer en bestuur.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel114
  - number: '115.1'
    text: |-
      De bekostiging, bedoeld in [artikel 113, eerste lid derde volzin][ref1], voor de materiële instandhouding
      bestaat voor de gezamenlijke speciale scholen voor basisonderwijs in een samenwerkingsverband uit een bedrag
      vermenigvuldigd met 2% van het aantal leerlingen van het samenwerkingsverband op 1 oktober van het jaar
      voorafgaande aan het jaar waarover de bekostiging plaatsvindt. Het Rijk verdeelt deze bekostiging over de speciale
      scholen voor basisonderwijs in een samenwerkingsverband naar rato van het aantal leerlingen van elke speciale
      school voor basisonderwijs op die datum.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel113
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel115
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '113'
        hoofdstuk: I
        afdeling: '4'
  - number: '115.2'
    text: |-
      Het aantal leerlingen van een speciale school voor basisonderwijs die deelneemt aan meer dan één
      samenwerkingsverband wordt bij het bepalen van het in het eerste lid, eerste volzin, bedoelde aantal leerlingen van
      elk samenwerkingsverband en het in het eerste lid, tweede volzin, bedoelde aantal leerlingen van de speciale school
      voor basisonderwijs aan de desbetreffende verbanden toegerekend naar rato van het aantal basisschoolleerlingen van
      elk verband op 1 oktober van het jaar voorafgaande aan het jaar waarover de bekostiging plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel115
  - number: '115.3'
    text: |-
      De bekostiging, bedoeld in [artikel 113, eerste lid derde volzin][ref1], bestaat voor basisscholen in een
      samenwerkingsverband dat een instemming als bedoeld in [artikel 18, zevende lid][ref2], heeft verkregen uit een
      bedrag vermenigvuldigd met 2% van het aantal leerlingen van de desbetreffende school.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel113
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel18
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel115
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '113'
        hoofdstuk: I
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '18'
        hoofdstuk: I
        paragraaf: '2'
        afdeling: '1'
  - number: '116.1'
    text: |-
      Indien bijzondere ontwikkelingen in het basisonderwijs daartoe aanleiding geven, kunnen bij ministeriële
      regeling voorschriften worden vastgesteld omtrent het verstrekken van aanvullende bekostiging voor de materiële
      instandhouding.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel116
  - number: '116.2'
    text: |-
      Indien bijzondere bekostiging op grond van [artikel 123][ref1] wordt toegekend, kan Onze minister bepalen dat, voor
      de periode waarvoor die bijzondere bekostiging wordt toegekend, tevens aanvullende bekostiging voor de materiële
      instandhouding wordt toegekend. Bij ministeriële regeling kunnen nadere regels worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel123
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel116
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '123'
        hoofdstuk: I
        afdeling: '5'
  - number: '116.3'
    text: |-
      Onze minister kan in verband met de in het eerste lid en het tweede lid bedoelde bekostiging een
      bekostigingsplafond instellen. In dat geval worden bij ministeriële regeling regels omtrent de verdeling
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel116
  - number: '117.1'
    text: |-
      De gemeenteraad stelt na overleg met de bevoegde gezagsorganen van de niet door de gemeente in stand gehouden
      scholen het aantal klokuren per week vast dat per groep leerlingen ten hoogste
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel117
  - number: 117.1.a
    text: ter beschikking wordt gesteld in een ruimte voor het onderwijs in lichamelijke oefening, of
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel117
  - number: 117.1.b
    text: |-
      voor bekostiging voor de materiële instandhouding van een ruimte voor het onderwijs in lichamelijke oefening in
      aanmerking komt.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel117
  - number: '117.2'
    text: |-
      Het aantal klokuren, bedoeld in het eerste lid, wordt vastgesteld op ten minste 1,5 voor basisscholen en ten minste
      2,25 voor speciale scholen voor basisonderwijs.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel117
  - number: '117.3'
    text: De gemeenteraad stelt de hoogte vast van
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel117
  - number: 117.3.a
    text: de bekostiging, bedoeld in het eerste lid, onder b, en
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel117
  - number: 117.3.b
    text: |-
      de bekostiging voor de vaste kosten van de materiële instandhouding van een ruimte voor lichamelijke oefening
      waarvan de eigendom berust bij het bevoegd gezag van een niet door de gemeente in stand gehouden school.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel117
  - number: '117.4'
    text: |-
      Bij de vaststelling, bedoeld in het derde lid, kan onderscheid worden gemaakt naar gelang de oppervlakte van de
      ruimte, alsmede tussen ruimten voor de exploitatie waarvan op grond van de onderwijswetgeving bekostiging wordt
      verleend en ruimten waarvoor dat niet het geval is.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel117
  - number: '118.1'
    text: |-
      Indien op 1 oktober het aantal leerlingen van de gezamenlijke speciale scholen voor basisonderwijs in een
      samenwerkingsverband meer bedraagt dan 2% van het aantal leerlingen van het samenwerkingsverband, dragen
      de gezamenlijke bevoegde gezagsorganen van de basisscholen in het samenwerkingsverband voor elke leerling
      van een speciale school voor basisonderwijs boven voornoemde 2% het in [artikel 115, eerste lid][ref1],
      bedoelde bedrag over aan de speciale scholen voor basisonderwijs, met dien verstande dat
      [artikel 115, eerste lid tweede volzin, en tweede lid][ref2], van overeenkomstige toepassing is. Van de
      overeenkomstige toepassing van [artikel 115, tweede lid][ref3], op de in de eerste volzin bedoelde overdracht
      wordt afgeweken indien de bevoegde gezagsorganen van alle scholen in de betrokken samenwerkingsverbanden daarmee
      schriftelijk instemmen.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel115
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel115
      [ref3]: https://wetten.overheid.nl/BWBR0003420#Artikel115
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel118
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '115'
        hoofdstuk: I
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '115'
        hoofdstuk: I
        afdeling: '4'
      - id: ref3
        bwb_id: BWBR0003420
        artikel: '115'
        hoofdstuk: I
        afdeling: '4'
  - number: '118.2'
    text: |-
      Bij de berekening op grond van het eerste lid wordt 2% van het aantal leerlingen van het samenwerkingsverband
      rekenkundig afgerond op een geheel getal.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel118
  - number: '118.3'
    text: |-
      De overdracht op grond van dit artikel door basisscholen heeft betrekking op het kalenderjaar dat volgt op de in
      het eerste lid bedoelde teldatum en vindt ten hoogste plaats voor een bij ministeriële regeling te bepalen gedeelte
      van de bekostiging voor de materiële instandhouding voor dat jaar.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel118
  - number: '118.4'
    text: |-
      Het aandeel van de onderscheiden basisscholen in de overdrachtsverplichting, bedoeld in het eerste lid, wordt
      bepaald overeenkomstig de regeling die daarvoor op grond van [artikel 20, eerste lid onder e][ref1], in het
      reglement van het samenwerkingsverband is opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel20
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel118
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '20'
        hoofdstuk: I
        paragraaf: '2'
        afdeling: '1'
  - number: '119.1'
    text: |-
      Het bevoegd gezag dat, dan wel de gemeente die eigenaar is van een schoolgebouw, zorgt voor het deel van de
      materiële instandhouding waarop de programma's van eisen, bedoeld in [artikel 114, onder a, b en c][ref1],
      betrekking hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel114
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel119
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '114'
        hoofdstuk: I
        afdeling: '4'
  - number: '119.2'
    text: |-
      Het bevoegd gezag van een bijzondere school en het bevoegd gezag van een openbare nevenvestiging ten aanzien
      waarvan [artikel 85, tweede lid][ref1], toepassing heeft gevonden en dat eigenaar is van een schoolgebouw, kan
      met burgemeester en wethouders overeenkomen dat de gemeente het in het eerste lid bedoelde deel van de materiële
      instandhouding geheel of gedeeltelijk verzorgt.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel85
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel119
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '85'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '2'
  - number: '119.3'
    text: |-
      Het bevoegd gezag, bedoeld in het eerste lid, kan met een bevoegd gezag dat gebruik maakt van de voorziening in
      de huisvesting van het eerstgenoemde bevoegd gezag, overeenkomen dat het laatstgenoemde bevoegd gezag het in het
      eerste lid bedoelde deel van de materiële instandhouding geheel of gedeeltelijk verzorgt.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel119
  - number: '119.4'
    text: |-
      Ingeval de gemeente eigenaar is van het schoolgebouw, kan het bevoegd gezag van een bijzondere school en het
      bevoegd gezag van een openbare nevenvestiging ten aanzien waarvan [artikel 85, tweede lid][ref1], toepassing heeft
      gevonden, met de gemeente overeenkomen dat het bevoegd gezag het in het eerste lid bedoelde deel van de materiële
      instandhouding geheel of gedeeltelijk verzorgt.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel85
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel119
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '85'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '2'
  - number: '119.5'
    text: |-
      Het bevoegd gezag zorgt voor het deel van de materiële instandhouding waarop de programma's van eisen, bedoeld in
      [artikel 114, onder d en e][ref1], betrekking hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel114
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel119
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '114'
        hoofdstuk: I
        afdeling: '4'
  - number: 119a
    text: |-
      De algemene maatregel van bestuur, bedoeld in [artikel 120][ref1], [124][ref2], [125][ref3] en [132][ref4],
      wordt aan de Tweede Kamer der Staten-Generaal overgelegd. De maatregel treedt niet in werking dan nadat 4 weken
      na de overlegging zijn verstreken en gedurende die termijn niet door of namens de Kamer de wens wordt te kennen
      gegeven dat het in die maatregel geregelde onderwerp bij de wet wordt geregeld. Alsdan wordt een daartoe strekkend
      wetsontwerp zo spoedig mogelijk ingediend. Het bepaalde in de vorige 3 volzinnen is niet van toepassing indien het
      ontwerp van de algemene maatregel van bestuur voordien aan de Kamer is overgelegd en door of namens de Kamer te
      kennen is gegeven dat van de procedure, bedoeld in de vorige 3 volzinnen, kan worden afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel120
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel124
      [ref3]: https://wetten.overheid.nl/BWBR0003420#Artikel125
      [ref4]: https://wetten.overheid.nl/BWBR0003420#Artikel132
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel119a
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '120'
        hoofdstuk: I
        afdeling: '5'
      - id: ref2
