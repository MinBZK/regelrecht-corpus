        bwb_id: BWBR0003420
        artikel: '132'
        hoofdstuk: I
        afdeling: '7'
  - number: '129.1'
    text: |-
      Bij ministeriële regeling wordt de grondslag vastgesteld voor de omvang van de bekostiging voor personeels- en
      arbeidsmarktbeleid. Deze grondslag kan verschillend worden vastgesteld voor basisscholen en speciale scholen voor
      basisonderwijs en voor groepen van basisscholen. De omvang van de bekostiging is in ieder geval afhankelijk of
      mede afhankelijk van het aantal leerlingen op de teldatum, bedoeld in [artikel 121][ref1], en de samenstelling
      van het leerlingenbestand. Bij het vaststellen van de bekostiging wordt in ieder geval rekening gehouden met de
      ontwikkeling van de genormeerde gemiddelde personeelslasten van leraren van basisscholen dan wel speciale scholen
      voor basisonderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel121
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel129
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '121'
        hoofdstuk: I
        afdeling: '5'
  - number: '129.2'
    text: |-
      Met inachtneming van het eerste lid verstrekt het Rijk jaarlijks aan het bevoegd gezag van de openbare en
      bijzondere scholen bekostiging ten behoeve van personeels- en arbeidsmarktbeleid.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel129
  - number: '132.1'
    text: |-
      Indien verschillende bevoegde gezagsorganen samenwerken in een samenwerkingsverband wordt personeelsbekostiging
      toegekend voor zorgvoorzieningen aan het bestuur van de centrale dienst van dat verband.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel132
  - number: '132.2'
    text: |-
      Indien een bevoegd gezag alle scholen in een samenwerkingsverband in stand houdt, wordt de in het eerste lid
      bedoelde bekostiging toegekend aan dat bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel132
  - number: '132.3'
    text: |-
      De grondslag voor de berekening van de personeelsbekostiging voor zorgvoorzieningen is een bij ministeriële
      regeling vast te stellen bedrag per leerling van de afzonderlijke basisscholen in het samenwerkingsverband,
      welk bedrag wordt verhoogd met een bedrag dat wordt vermenigvuldigd met de geraamde landelijk gewogen gemiddelde
      leeftijd van de leraren van speciale scholen voor basisonderwijs.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel132
  - number: '132.4'
    text: |-
      In een samenwerkingsverband dat de instemming, bedoeld in [artikel 18, zevende lid][ref1], heeft verkregen, wordt
      de in het eerste en het tweede lid bedoelde bekostiging verhoogd. De verhoging wordt vastgesteld door 2% van het
      aantal leerlingen van elke basisschool in een samenwerkingsverband op 1 oktober van het voorafgaande schooljaar, te
      vermenigvuldigen met een bij ministeriële regeling vast te stellen bedrag per leerling, welk bedrag wordt verhoogd
      met een bedrag dat wordt vermenigvuldigd met de geraamde landelijk gewogen gemiddelde leeftijd van leraren van
      speciale scholen voor basisonderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel18
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel132
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '18'
        hoofdstuk: I
        paragraaf: '2'
        afdeling: '1'
  - number: '132.5'
    text: |-
      De bedragen per leerling, bedoeld in het derde en vierde lid, en de vermenigvuldigingsbedragen van de verhoging,
      bedoeld in het derde en vierde lid, zijn de uitkomst van een bij algemene maatregel van bestuur vast te stellen
      hoeveelheid formatie per leerling vermenigvuldigd met een bedrag. Bij de vaststelling van de bedragen wordt in
      ieder geval rekening gehouden met de ontwikkeling van de geraamde landelijk gewogen gemiddelde leeftijd en de
      genormeerde gemiddelde personeelslast van de leraren van speciale scholen voor basisonderwijs.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel132
  - number: '133'
    text: |-
      De gemeente bekostigt aan het bevoegd gezag van een niet door de gemeente in stand gehouden school dat is
      onderworpen aan een of meer der in [artikel 220 van de Gemeentewet][ref1] bedoelde belastingen ter zake van
      onroerende zaken het bedrag dat is uitgegeven voor de belastingen met betrekking tot de in de gemeente gelegen
      gebouwen en terreinen.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel220
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel133
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '220'
  - number: '134.1'
    text: |-
      Behoudens het tweede lid verstrekt het Rijk jaarlijks aan het bevoegd gezag bekostiging ten behoeve van de
      materiële instandhouding waarop de programma's van eisen, bedoeld in [artikel 114][ref1], betrekking hebben,
      waarbij voor het bevoegd gezag geldt dat indien toepassing is gegeven aan [artikel 119, tweede lid][ref2], dan wel
      indien geen overeenkomst als bedoeld in [artikel 119, derde of vierde lid][ref3] tot stand is gekomen, dit bevoegd
      gezag de bekostiging aan de gemeente dan wel aan het desbetreffende bevoegd gezag overdraagt voor zover deze de
      materiële instandhouding verzorgt.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel114
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel119
      [ref3]: https://wetten.overheid.nl/BWBR0003420#Artikel119
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel134
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '114'
        hoofdstuk: I
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '119'
        hoofdstuk: I
        afdeling: '4'
      - id: ref3
        bwb_id: BWBR0003420
        artikel: '119'
        hoofdstuk: I
        afdeling: '4'
  - number: '134.2'
    text: |-
      Het Rijk verstrekt jaarlijks aan de provincie Fryslân bekostiging ten behoeve van de materiële instandhouding, voor
      zover het betreft het onderwijs in de Friese taal, bedoeld in [artikel 9, vierde lid][ref1]. De provincie Fryslân
      draagt zorg voor verdeling van de bekostiging over de betrokken scholen naar rato van het aantal leerlingen dat
      gebruik maakt van dat onderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel9
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel134
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '9'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '1'
  - number: '134.3'
    text: |-
      Grondslag voor de bekostiging van de in het eerste en tweede lid bedoelde kosten zijn de voor het desbetreffende
      jaar vastgestelde bedragen.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel134
  - number: '134.4'
    text: |-
      Grondslag voor de bekostiging ten behoeve van de uitgaven voor de voorzieningen, bedoeld in [artikel 113][ref1],
      voor basisscholen zijn:


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel113
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel134
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '113'
        hoofdstuk: I
        afdeling: '4'
  - number: 134.4.a
    text: |-
      de schoolgrootte die normatief wordt bepaald op basis van het op grond van de algemene maatregel van bestuur,
      bedoeld in [artikel 69][ref1], normatief bepaalde aantal te huisvesten groepen leerlingen naar de maatstaf van het
      aantal leerlingen op 1 oktober van het jaar voorafgaande aan het jaar waarover de bekostiging plaatsvindt, waarbij
      rekening wordt gehouden met de samenstelling van het leerlingenbestand in de gevallen en op de wijze als aangegeven
      in bedoelde algemene maatregel van bestuur, en


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel69
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel134
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '69'
        hoofdstuk: I
        afdeling: '1'
  - number: 134.4.b
    text: |-
      het aantal leerlingen op 1 oktober van het jaar voorafgaande aan het jaar waarover de bekostiging plaatsvindt,
      verhoogd met 3% daarvan, waarbij de uitkomst naar beneden wordt afgerond op een geheel getal.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel134
  - number: '134.5'
    text: |-
      Voor nieuwe basisscholen zijn gedurende de periode van 1 augustus tot 1 januari volgend op de opening, grondslag
      voor de bekostiging ten behoeve van de uitgaven voor de voorzieningen, bedoeld in [artikel 113][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel113
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel134
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '113'
        hoofdstuk: I
        afdeling: '4'
  - number: 134.5.a
    text: |-
      de schoolgrootte die normatief wordt bepaald op basis van het op grond van de algemene maatregel van bestuur,
      bedoeld in [artikel 69][ref1], normatief bepaalde aantal te huisvesten groepen leerlingen naar de maatstaf van
      het aantal leerlingen op 1 oktober in die periode, waarbij rekening wordt gehouden met de samenstelling van het
      leerlingenbestand in de gevallen en op de wijze als aangegeven in bedoelde algemene maatregel van bestuur, en


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel69
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel134
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '69'
        hoofdstuk: I
        afdeling: '1'
  - number: 134.5.b
    text: |-
      het aantal leerlingen op 1 oktober in die periode, verhoogd met 3% daarvan, waarbij de uitkomst naar beneden wordt
      afgerond op een geheel getal.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel134
  - number: '134.6'
    text: |-
      Indien op 1 maart van het jaar waarover de bekostiging plaatsvindt, het aantal leerlingen met ten minste een bij
      de algemene maatregel van bestuur, bedoeld in [artikel 69][ref1], vastgesteld aantal is toegenomen ten opzichte van
      het aantal leerlingen, zoals dat luidt na de verhoging overeenkomstig het vierde lid onder b, en toepassing van de
      in dit lid bedoelde grondslag niet tot een lagere bekostiging zou leiden, zijn grondslag voor de bekostiging ten
      behoeve van de uitgaven voor de voorzieningen, bedoeld in [artikel 113][ref2], voor basisscholen:


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel69
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel113
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel134
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '69'
        hoofdstuk: I
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '113'
        hoofdstuk: I
        afdeling: '4'
  - number: 134.6.a
    text: |-
      de schoolgrootte die normatief wordt bepaald op basis van het op grond van de algemene maatregel van bestuur,
      bedoeld in [artikel 69][ref1], normatief bepaalde aantal te huisvesten groepen leerlingen naar de maatstaf van
      het aantal leerlingen op 1 maart van het jaar waarover de bekostiging plaatsvindt, waarbij rekening wordt gehouden
      met de samenstelling van het leerlingenbestand in de gevallen en op de wijze als aangegeven in bedoelde algemene
      maatregel van bestuur, en


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel69
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel134
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '69'
        hoofdstuk: I
        afdeling: '1'
  - number: 134.6.b
    text: het aantal leerlingen op 1 maart van het jaar waarover de bekostiging plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel134
  - number: '134.7'
    text: |-
      Ingeval een samenvoeging plaatsvindt tussen 1 januari en 1 oktober daaropvolgend, wordt de bekostiging ten behoeve
      van de uitgaven voor de voorzieningen, bedoeld in [artikel 113][ref1], van alle bij de samenvoeging betrokken
      scholen gehandhaafd tot het einde van het jaar waarin de samenvoeging plaatsvond.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel113
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel134
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '113'
        hoofdstuk: I
        afdeling: '4'
  - number: '134.8'
    text: |-
      Ingeval een samenvoeging plaatsvindt tussen 1 oktober en 1 januari daaropvolgend, wordt de bekostiging ten behoeve
      van de uitgaven voor de voorzieningen, bedoeld in [artikel 113][ref1], van alle bij de samenvoeging betrokken
      scholen gehandhaafd tot het einde van het jaar waarin de samenvoeging plaatsvond, en wordt de bekostiging van
      de uitgaven voor die voorzieningen voor het jaar volgend op de samenvoeging, gebaseerd op de bekostiging van de
      uitgaven voor die voorzieningen van alle bij de samenvoeging betrokken scholen, zoals die golden op 1 oktober van
      het jaar van samenvoeging.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel113
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel134
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '113'
        hoofdstuk: I
        afdeling: '4'
  - number: '135.1'
    text: |-
      Jaarlijks voor 1 maart kan Onze minister verhoging van de bekostiging worden gevraagd, indien op grond van
      bijzondere omstandigheden van de school in dat jaar het totale bedrag niet voldoende is voor de noodzakelijke
      uitgaven van de school.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel135
  - number: '135.2'
    text: |-
      Een verzoek als bedoeld in het eerste lid, kan slechts worden gedaan door het bevoegd gezag voor zover het betreft
      de materiële instandhouding waarop de programma's van eisen, bedoeld in [artikel 114][ref1], betrekking hebben.
      In afwijking van de vorige volzin kan ingeval [artikel 119, tweede, derde of vierde lid][ref2], is toegepast, het
      bevoegd gezag dat dan wel de gemeente die de materiële instandhouding geheel of gedeeltelijk verzorgt, het verzoek
      indienen.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel114
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel119
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel135
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '114'
        hoofdstuk: I
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '119'
        hoofdstuk: I
        afdeling: '4'
  - number: '135.3'
    text: 'Onze minister wijst het verzoek in elk geval af indien:'
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel135
  - number: 135.3.a
    text: |-
      in het jaar waarvoor de programma's van eisen zijn vastgesteld, het totaal van de noodzakelijke uitgaven voor de
      materiële instandhouding van de school, niet ten minste 5% meer zal bedragen dan het totaal van de uit 's Rijks kas
      daarvoor te verstrekken inkomsten,
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel135
  - number: 135.3.b
    text: |-
      de bijzondere omstandigheden het gevolg zijn van een bij algemene maatregel van bestuur aan te geven omstandigheid
      of afwijking van de omvang van de componenten van de voorziening ten aanzien waarvan de bijzondere omstandigheden
      zouden bestaan,
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel135
  - number: 135.3.c
    text: |-
      de bijzondere omstandigheid het gevolg is van een verschil tussen het prijsniveau in enig jaar en de op grond van
      [artikel 113][ref1] vastgestelde of aangepaste bedragen, of


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel113
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel135
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '113'
        hoofdstuk: I
        afdeling: '4'
  - number: 135.3.d
    text: |-
      het bevoegd gezag dat of de gemeente die het verzoek heeft ingediend, niet aantoont dat het de bijzondere
      omstandigheden niet op enigerlei wijze had kunnen voorkomen.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel135
  - number: '135.4'
    text: |-
      Een verzoek als bedoeld in het eerste lid gaat vergezeld van een verklaring van een accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1], van de juistheid van de gegevens die bij
      het verzoek zijn gevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel135
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '135.6'
    text: |-
      Onze minister besluit binnen drie maanden. Indien technisch onderzoek zulks noodzakelijk maakt, kan Onze minister
      deze termijn eenmaal met ten hoogste zes maanden verdagen.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel135
  - number: '135.7'
    text: |-
      Onze minister kan in verband met de in het eerste lid bedoelde verhoging een bekostigingsplafond instellen. In dat
      geval worden bij ministeriële regeling regels omtrent de verdeling vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel135
  - number: '136.1'
    text: |-
      De gemeente verstrekt jaarlijks aan het bevoegd gezag van een niet door de gemeente in stand gehouden school dat
      eigenaar is van een ruimte voor het onderwijs in lichamelijke oefening op het grondgebied van de gemeente
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel136
  - number: 136.1.a
    text: |-
      een bekostigingsbedrag dat wordt bepaald ingevolge [artikel 117 en het derde lid][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel117
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel136
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '117'
        hoofdstuk: I
        afdeling: '4'
  - number: 136.1.b
    text: |-
      voor zover het gebruik van die ruimte ontoereikend is een overeenkomstig het tweede lid vast te stellen
      bekostigingsbedrag.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel136
  - number: '136.2'
    text: |-
      Voor zover geen ruimte ter beschikking is gesteld als bedoeld in [artikel 117, eerste lid onder a][ref1], verstrekt
      de gemeente jaarlijks aan het bevoegd gezag van een niet door de gemeente in stand gehouden school dat geen
      eigenaar is van een ruimte voor het onderwijs in lichamelijke oefening een bekostigingsbedrag dat wordt bepaald
      ingevolge [artikel 117, eerste lid onder b, en derde lid onder a, en het derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel117
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel117
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel136
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '117'
        hoofdstuk: I
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '117'
        hoofdstuk: I
        afdeling: '4'
  - number: '136.3'
    text: |-
      Het aantal groepen leerlingen voor basisscholen wordt berekend overeenkomstig
      [artikel 134, vierde lid onder a, vijfde lid onder a, en zesde lid onder a][ref1], en de ter uitvoering daarvan
      vastgestelde algemene maatregel van bestuur, met dien verstande dat groepen waarvoor van rijkswege bekostiging
      wordt verstrekt voor de kosten van de materiële instandhouding van een speellokaal niet in aanmerking worden
      genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel134
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel136
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '134'
        hoofdstuk: I
        paragraaf: '2'
        afdeling: '8'
  - number: '136.4'
    text: |-
      Het aantal groepen leerlingen voor speciale scholen voor basisonderwijs wordt berekend door het aantal leerlingen
      op 1 oktober van het jaar voorafgaande aan het jaar waarover de bekostiging plaatsvindt te delen door 15 en de
      uitkomst rekenkundig af te ronden op een geheel getal.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel136
  - number: '137.1'
    text: |-
      Met inachtneming van de [artikelen 120][ref1], [121][ref2] en [132, tweede lid][ref3], verstrekt het Rijk jaarlijks
      aan het bevoegd gezag een bekostigingsbedrag ten behoeve van de personeelskosten.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel120
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel121
      [ref3]: https://wetten.overheid.nl/BWBR0003420#Artikel132
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel137
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '120'
        hoofdstuk: I
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '121'
        hoofdstuk: I
