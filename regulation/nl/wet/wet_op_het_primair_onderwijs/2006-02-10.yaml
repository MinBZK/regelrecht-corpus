$id: wet_op_het_primair_onderwijs
regulatory_layer: WET
publication_date: '2023-06-07'
valid_from: '2006-02-10'
bwb_id: BWBR0003420
url: https://wetten.overheid.nl/BWBR0003420/2006-02-10
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het ter bevordering van

    een ononderbroken ontwikkeling van de leerlingen, gewenst is de afzonderlijke onderwijsvormen kleuteronderwijs en
    gewoon lager onderwijs samen te voegen tot een onderwijsvorm die gericht is op een doorlopend ontwikkelingsproces
    van de leerlingen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet wordt verstaan onder: *Onze minister:* Onze minister van Onderwijs, Cultuur en Wetenschap;
      *inspectie of inspecteur:* de inspectie, bedoeld in de [Wet op het onderwijstoezicht][ref1], voor zover
      belast met taken op het gebied van het basisonderwijs; *school:* een basisschool of een speciale school voor
      basisonderwijs, tenzij het tegendeel blijkt; *basisschool:* een school waar basisonderwijs wordt gegeven,
      niet zijnde een speciale school voor basisonderwijs; *speciale school voor basisonderwijs:* een school waar
      basisonderwijs wordt gegeven aan kinderen voor wie vaststaat dat overwegend een zodanige orthopedagogische
      en orthodidactische benadering aangewezen is, dat zij althans gedurende enige tijd op een speciale school
      voor basisonderwijs moeten worden opgevangen; *school voor speciaal onderwijs:* een school voor speciaal
      onderwijs als bedoeld in [artikel 1 van de Wet op de expertisecentra][ref2]; *school voor speciaal en
      voortgezet speciaal onderwijs:* een school voor speciaal en voortgezet speciaal onderwijs als bedoeld in
      [artikel 1 van de Wet op de expertisecentra][ref3]; *school voor voortgezet speciaal onderwijs:* een school voor
      voortgezet speciaal onderwijs als bedoeld in [artikel 1 van de Wet op de expertisecentra][ref4]; *instelling voor
      speciaal en voortgezet speciaal onderwijs:* een instelling voor speciaal en voortgezet speciaal onderwijs als
      bedoeld in [artikel 8, eerste lid tweede volzin, van de Wet op de expertisecentra][ref5]; *school voor voortgezet
      onderwijs:* een school voor voortgezet onderwijs als bedoeld in de [Wet op het voortgezet onderwijs][ref6];
      *openbare school:* a. een door een of meer gemeenten, al dan niet te zamen met een of meer privaatrechtelijke
      rechtspersonen met volledige rechtsbevoegdheid in stand gehouden school; b. een door een openbare
      rechtspersoon als bedoeld in [artikel 47][ref7] in stand gehouden school; dan wel c. een door een stichting
      als bedoeld in [artikel 17][ref8] of [artikel 48][ref9] in stand gehouden school; *bijzondere school:* door
      een natuurlijk persoon of een privaatrechtelijke rechtspersoon, niet zijnde een stichting als bedoeld in
      [artikel 48][ref10], in stand gehouden school; *openbare rechtspersoon:* een rechtspersoon die krachtens
      publiekrecht is ingesteld als bedoeld in [artikel 47][ref11]; *nevenvestiging:* deel van een school, dat op
      de plaats waar het onderwijs wordt gegeven voordat het een deel van de school werd als zelfstandige school
      functioneerde; *bevoegd gezag van volgens deze wet bekostigde scholen:* voor wat betreft a. een openbare
      school: 1°. het college van burgemeester en wethouders, voor zover de raad niet anders bepaalt, en, indien
      de raad dit besluit, met inachtneming van door hem te stellen regelen; 2°. het krachtens de desbetreffende
      gemeenschappelijke regeling bevoegde orgaan; 3°. de openbare rechtspersoon, bedoeld in [artikel 47][ref12];
      dan wel 4°. de stichting, bedoeld in [artikel 17][ref13] of [artikel 48][ref14]; b. een bijzondere school: de
      rechtspersoon bedoeld in [artikel 55][ref15]; *Informatie Beheer Groep:* de Informatie Beheer Groep, genoemd in
      de [Wet verzelfstandiging Informatiseringsbank][ref16]; *persoonsgebonden nummer:* het sociaal-fiscaalnummer,
      bedoeld in [artikel 2, derde lid, onder j, van de Algemene wet inzake rijksbelastingen][ref17], dan wel het door de
      Informatie Beheer Groep uitgegeven onderwijsnummer, bedoeld in [artikel 40b, vierde lid][ref18]; *ouders*: ouders
      of voogden; *schooljaar*: het tijdvak van 1 augustus tot en met 31 juli daaraanvolgend; *samenwerkingsverband*:
      een samenwerkingsverband als bedoeld in [artikel 18][ref19], tenzij het tegendeel blijkt; *personeel*: a. de
      benoemde directeur, het personeel benoemd in een functie voor het geven van onderwijs, het personeel benoemd in
      een andere functie dan het geven van onderwijs, het personeel dat is benoemd voor het verrichten van werkzaamheden
      ten behoeve van meer dan een school of meer dan een school als bedoeld in de [Wet op de expertisecentra][ref20];
      b. het onder a bedoelde personeel dat zonder benoeming is tewerkgesteld, tenzij het betreft de toepassing
      van de [artikelen 33][ref21], [33a][ref22], [34][ref23], [37][ref24], [38][ref25], [52][ref26],
      [53, eerste en tweede lid][ref27], [59, eerste tot en met vierde lid][ref28], [60 tot en met 62][ref29],
      [68][ref30], [138][ref31] en [139][ref32], voor zover niet anders is bepaald, en de toepassing van daarmee verband
      houdende wettelijke bepalingen; leerlinggebonden budget: een leerlinggebonden budget voor een leerling als bedoeld
      in [artikel 70a.][ref33]


