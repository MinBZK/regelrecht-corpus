        hoofdstuk: I
        afdeling: '7'
  - number: '120.1'
    text: |-
      Voor de bekostiging van personeel wordt een bedrag per leerling toegekend, welk bedrag wordt verhoogd met een
      bedrag dat wordt vermenigvuldigd met de gewogen gemiddelde leeftijd van de leraren van de school op 1 oktober van
      het voorafgaande schooljaar. Voor het schooljaar waarin een nieuwe basisschool respectievelijk nieuwe speciale
      school voor basisonderwijs wordt geopend, wordt vermenigvuldigd met de geraamde landelijk gewogen gemiddelde
      leeftijd op 1 oktober van het voorafgaande schooljaar van de leraren van basisscholen respectievelijk van de
      leraren van speciale scholen voor basisonderwijs.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel120
  - number: '120.2'
    text: 'De bedragen, bedoeld in het eerste lid, kunnen in elk geval verschillend worden vastgesteld voor leerlingen:'
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel120
  - number: 120.2.a
    text: van een basisschool in de leeftijd van 4 tot en met 7 jaar;
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel120
  - number: 120.2.b
    text: van een basisschool in de leeftijd van 8 jaar en ouder; en
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel120
  - number: 120.2.c
    text: van speciale scholen voor basisonderwijs.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel120
  - number: '120.3'
    text: |-
      Bij algemene maatregel van bestuur wordt bepaald in welke gevallen en onder welke voorwaarden aanvullende
      bekostiging voor personeelskosten kan worden toegekend. In ieder geval wordt aanvullende bekostiging toegekend
      voor kleine basisscholen, schoolleiding, de bestrijding van onderwijsachterstanden, groei van het aantal leerlingen
      van basisscholen gedurende het schooljaar en indien onderwijs wordt gegeven in een of meer nevenvestigingen van
      een basisschool. De omvang van de aanvullende vergoeding wordt bij of krachtens algemene maatregel van bestuur
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel120
  - number: '120.4'
    text: |-
      De gezamenlijke speciale scholen voor basisonderwijs van een samenwerkingsverband ontvangen tevens een bekostiging
      voor zorgvoorzieningen. De in de eerste volzin bedoelde bekostiging is gebaseerd op 2% van het aantal leerlingen
      van alle scholen in het samenwerkingsverband op 1 oktober van het voorafgaande schooljaar, rekenkundig afgerond op
      een geheel getal. Het aantal leerlingen, bedoeld in de tweede volzin, wordt aan de afzonderlijke speciale scholen
      voor basisonderwijs toegerekend naar rato van het aantal leerlingen van elk van die scholen op die datum. De
      speciale school voor basisonderwijs ontvangt voor elke van de aan die school toegerekende leerling een bedrag per
      leerling, welk bedrag wordt verhoogd met een bedrag dat wordt vermenigvuldigd met de gewogen gemiddelde leeftijd
      van de leraren van die school op 1 oktober van het voorafgaande schooljaar. [Artikel 115, tweede lid][ref1], is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel115
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel120
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '115'
        hoofdstuk: I
        afdeling: '4'
  - number: '120.5'
    text: |-
      Bij ministeriële regeling worden de bedragen, bedoeld in het eerste lid en het vierde lid vastgesteld. Het bedrag
      per leerling en het vermenigvuldigingsbedrag van de verhoging zijn de uitkomst van een bij algemene maatregel van
      bestuur vast te stellen hoeveelheid formatie per leerling vermenigvuldigd met een bedrag.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel120
  - number: '120.6'
    text: |-
      Bij de vaststelling van de bedragen, bedoeld in het vijfde lid, wordt in ieder geval rekening gehouden met de
      ontwikkeling van de geraamde landelijk gewogen gemiddelde leeftijd en de genormeerde gemiddelde personeelslasten
      van leraren van basisscholen dan wel speciale scholen voor basisonderwijs, en worden nadere regels vastgesteld
      met betrekking tot de vaststelling van de in het eerste en het vierde lid bedoelde gewogen gemiddelde leeftijd en
      geraamde landelijk gewogen gemiddelde leeftijd. Indien aanvullende bekostiging wordt toegekend voor een bepaalde
      categorie personeel kan in afwijking van de eerste volzin rekening worden gehouden met de genormeerde gemiddelde
      personeelslasten van die categorie personeel.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel120
  - number: '120.7'
    text: |-
      De bekostiging, bedoeld in het eerste lid, en de bekostiging voor kleine basisscholen, schoolleiding, groei van het
      aantal leerlingen van een basisschool gedurende het schooljaar en een of meer nevenvestigingen van een basisschool,
      bedoeld in de tweede volzin van het derde lid, is redelijkerwijs voldoende voor het leiden en beheren van de
      school, voor het geven van onderwijs aan de school en voor de overige werkzaamheden die verband houden met het
      onderwijs aan de school.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel120
  - number: '121.1'
    text: |-
      Voor de toepassing van [artikel 120, eerste lid][ref1], geldt het aantal leerlingen van de school op 1 oktober van
      het voorafgaande schooljaar.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel120
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel121
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '120'
        hoofdstuk: I
        afdeling: '5'
  - number: '121.2'
    text: |-
      Voor de toepassing van [artikel 120, eerste lid][ref1], voor het schooljaar waarin een nieuwe school wordt
      geopend en voor het daaropvolgende schooljaar geldt het aantal leerlingen van de school op 1 oktober volgende op
      de opening.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel120
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel121
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '120'
        hoofdstuk: I
        afdeling: '5'
  - number: '121.3'
    text: |-
      Voor de toepassing van [artikel 120, eerste lid][ref1], geldt ingeval van samenvoeging van scholen het aantal
      leerlingen van alle bij de samenvoeging betrokken scholen, voor elke school vastgesteld volgens het eerste lid, en
      de gewogen gemiddelde leeftijd van de leraren van alle bij de samenvoeging betrokken scholen op 1 oktober van het
      voorafgaande schooljaar.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel120
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel121
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '120'
        hoofdstuk: I
        afdeling: '5'
  - number: '123.1'
    text: |-
      Indien bijzondere ontwikkelingen in het basisonderwijs daartoe aanleiding geven, kunnen bij ministeriële regeling
      voorschriften worden vastgesteld omtrent het verstrekken van bijzondere bekostiging voor personeelskosten.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel123
  - number: '123.2'
    text: |-
      In verband met bijzondere omstandigheden kan Onze minister op verzoek van het bevoegd gezag van een basisschool
      onder door hem op te leggen verplichtingen bijzondere bekostiging voor personeelskosten verstrekken.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel123
  - number: '123.3'
    text: |-
      Een aanvraag als bedoeld in het tweede lid wordt ingediend ten hoogste vier maanden voorafgaand aan het schooljaar
      waarin de bijzondere omstandigheden zich zullen voordoen en niet later dan in het schooljaar waarin die bijzondere
      omstandigheden zich hebben voorgedaan. Onze minister besluit binnen vier maanden na ontvangst van een in het tweede
      lid bedoelde aanvraag. Indien de beschikking niet binnen vier maanden kan worden gegeven, stelt Onze minister de
      aanvrager daarvan in kennis en noemt hij daarbij een termijn waarbinnen de beschikking wel tegemoet kan worden
      gezien.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel123
  - number: '123.4'
    text: |-
      Onze minister kan in verband met de in het eerste en tweede lid bedoelde bekostiging een bekostigingsplafond
      instellen. In dat geval worden bij ministeriële regeling regels omtrent de verdeling vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel123
  - number: '124.1'
    text: |-
      Indien op de overeenkomstig [artikel 20, eerste lid onder d][ref1], vastgestelde peildatum het aantal leerlingen
      van de speciale scholen voor basisonderwijs in een samenwerkingsverband meer bedraagt dan het aantal leerlingen
      van die scholen op 1 oktober daaraan voorafgaand, draagt het bevoegd gezag van alle scholen in het verband dan
      wel, indien verschillende bevoegde gezagsorganen samenwerken in het verband, het bestuur van de centrale dienst
      voor het verschil per leerling een bij ministeriële regeling vast te stellen bedrag over aan de speciale scholen
      voor basisonderwijs, welk bedrag wordt verhoogd met een bedrag dat wordt vermenigvuldigd met de geraamde landelijk
      gewogen gemiddelde leeftijd van leraren van speciale scholen voor basisonderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel20
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel124
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '20'
        hoofdstuk: I
        paragraaf: '2'
        afdeling: '1'
  - number: '124.2'
    text: |-
      Indien op de overeenkomstig [artikel 20, eerste lid onder d][ref1], vastgestelde peildatum het aantal leerlingen
      van de speciale scholen voor basisonderwijs in een samenwerkingsverband meer bedraagt dan 2% van het aantal
      leerlingen van het samenwerkingsverband op 1 oktober daaraan voorafgaand, draagt het bevoegd gezag van alle scholen
      in het verband dan wel, indien verschillende bevoegde gezagsorganen samenwerken in het verband, het bestuur van
      de centrale dienst voor elke leerling van een speciale school voor basisonderwijs boven voornoemde 2% per leerling
      een bij ministeriële regeling vast te stellen bedrag over aan de speciale scholen voor basisonderwijs, welk bedrag
      wordt verhoogd met een bedrag dat afhankelijk is van de geraamde landelijk gewogen gemiddelde leeftijd van leraren
      van speciale scholen voor basisonderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel20
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel124
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '20'
        hoofdstuk: I
        paragraaf: '2'
        afdeling: '1'
  - number: '124.3'
    text: |-
      Bij de vaststelling ingevolge het eerste en tweede lid van het aantal leerlingen van de speciale scholen
      voor basisonderwijs in een samenwerkingsverband op de overeenkomstig [artikel 20, eerste lid onder d][ref1],
      vastgestelde peildatum, worden leerlingen voor wie op grond van [artikel 125][ref2] al een overdracht plaatsvindt
      vanuit een ander samenwerkingsverband buiten beschouwing gelaten. De uitkomst van de berekening van 2% van het
      aantal leerlingen van het samenwerkingsverband op grond van het tweede lid wordt rekenkundig afgerond op een geheel
      getal.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel125
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel124
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '20'
        hoofdstuk: I
        paragraaf: '2'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '125'
        hoofdstuk: I
        afdeling: '5'
  - number: '124.4'
    text: |-
      Het aantal leerlingen van een speciale school voor basisonderwijs die deelneemt aan meer dan één
      samenwerkingsverband wordt bij het bepalen van het in het eerste en tweede lid bedoelde aantal leerlingen van
      de speciale scholen in elk samenwerkingsverband en het in het tweede lid bedoelde aantal leerlingen van elk
      samenwerkingsverband aan de desbetreffende verbanden toegerekend naar rato van het aantal basisschoolleerlingen
      van elk verband op 1 oktober van het jaar voorafgaande aan het jaar waarover de bekostiging plaatsvindt. Van de
      toepassing van de eerste volzin op de in het eerste en tweede lid bedoelde overdrachten wordt afgeweken indien de
      bevoegde gezagsorganen van alle scholen in de betrokken samenwerkingsverbanden daarmee schriftelijk instemmen.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel124
  - number: '124.5'
    text: |-
      De overdracht op grond van het eerste en tweede lid heeft betrekking op het schooljaar dat volgt op de in het
      eerste onderscheidenlijk tweede lid bedoelde peildatum.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel124
  - number: '124.6'
    text: |-
      Het aandeel van de onderscheiden basisscholen in de overdrachtsverplichtingen, bedoeld in het eerste en tweede lid,
      wordt bepaald overeenkomstig de regeling die daarvoor op grond van [artikel 20, eerste lid onder e][ref1], in het
      reglement van het samenwerkingsverband is opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel20
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel124
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '20'
        hoofdstuk: I
        paragraaf: '2'
        afdeling: '1'
  - number: '124.7'
    text: |-
      Indien de in [artikel 132, eerste lid][ref1], bedoelde bekostiging niet voldoende is om daaruit de verplichtingen,
      bedoeld in dit artikel na te komen, dragen de bevoegde gezagsorganen van de gezamenlijke basisscholen in het
      samenwerkingsverband de ontbrekende bekostiging over aan het bestuur van de centrale dienst van het verband. Het
      aandeel van de onderscheiden basisscholen in de overdrachtsverplichting, bedoeld in de eerste volzin, wordt bepaald
      overeenkomstig de regeling die daarvoor op grond van [artikel 20, eerste lid onder e][ref2], in het reglement van
      het samenwerkingsverband is opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel132
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel20
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel124
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '132'
        hoofdstuk: I
        afdeling: '7'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '20'
        hoofdstuk: I
        paragraaf: '2'
        afdeling: '1'
  - number: '124.8'
    text: |-
      Het bedrag per leerling, bedoeld in het eerste en het tweede lid, en het vermenigvuldigingsbedrag van de verhoging,
      bedoeld in het eerste en het tweede lid, zijn de uitkomst van een bij algemene maatregel van bestuur vast te
      stellen hoeveelheid formatie per leerling, vermenigvuldigd met een bedrag. Bij de vaststelling van de bedragen
      wordt in ieder geval rekening gehouden met de ontwikkeling van de geraamde landelijk gewogen gemiddelde leeftijd en
      de genormeerde gemiddelde personeelslast van leraren van speciale scholen voor basisonderwijs.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel124
  - number: '124.9'
    text: |-
      In afwijking van het eerste en het tweede lid kan het samenwerkingsverband besluiten dat in plaats van met
      de landelijk gewogen leeftijd, wordt vermenigvuldigd met de gewogen gemiddelde leeftijd van de leraren van de
      desbetreffende speciale school voor basisonderwijs.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel124
  - number: '125.1'
    text: |-
      Het bevoegd gezag van alle scholen in een samenwerkingsverband dan wel, indien verschillende bevoegde gezagsorganen
      samenwerken in het verband, het bestuur van de centrale dienst draagt per leerling een bij ministeriële regeling
      vast te stellen bedrag over aan de speciale school voor basisonderwijs, welk bedrag wordt verhoogd met een bedrag
      dat wordt vermenigvuldigd met de geraamde landelijk gewogen gemiddelde leeftijd van leraren van speciale scholen
      voor basisonderwijs indien
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel125
  - number: 125.1.a
    text: |-
      de speciale school voor basisonderwijs een leerling toelaat van een basisschool in het desbetreffende
      samenwerkingsverband,
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel125
  - number: 125.1.b
    text: de speciale school geen deel uitmaakt van het desbetreffende samenwerkingsverband, en
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel125
  - number: 125.1.c
    text: |-
      de permanente commissie leerlingenzorg van het desbetreffende samenwerkingsverband heeft bepaald dat de leerling op
      het onderwijs van een speciale school voor basisonderwijs is aangewezen.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel125
  - number: '125.2'
    text: |-
      Het bedrag per leerling, bedoeld in het eerste lid, en het vermenigvuldigingsbedrag van de verhoging, bedoeld in
      het eerste lid, zijn de uitkomst van een bij algemene maatregel van bestuur vast te stellen hoeveelheid formatie
      per leerling vermenigvuldigd met een bedrag. Bij de vaststelling van de bedragen wordt in ieder geval rekening
      gehouden met de ontwikkeling van de geraamde landelijk gewogen gemiddelde leeftijd en de genormeerde gemiddelde
      personeelslast van leraren van speciale scholen voor basisonderwijs. In de algemene maatregel van bestuur, bedoeld
      in de vorige volzin, kan voor de verschillende schooljaren en afhankelijk van het moment van de toelating tot de
      speciale school voor basisonderwijs een verschillende hoeveelheid formatie worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel125
  - number: '125.3'
    text: |-
      De in het eerste lid bedoelde overdracht vindt voor het eerst plaats voor het schooljaar volgend op het schooljaar
      van de toelating tot de speciale school voor basisonderwijs.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel125
  - number: '125.4'
    text: |-
      De in het eerste lid bedoelde overdracht vindt niet plaats als de toelating plaatsvindt binnen 6 maanden voor of na
      een verhuizing van de ouders van een woning buiten het gebied van het samenwerkingsverband van de speciale school
      voor basisonderwijs naar een woning binnen dat gebied.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel125
  - number: '125.5'
    text: |-
      De overdracht, bedoeld in het eerste lid, eindigt met ingang van het schooljaar dat volgt op het schooljaar waarin
      de leerling de speciale school voor basisonderwijs verlaat.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel125
  - number: '125.6'
    text: |-
      [Artikel 124, zesde en zevende lid][ref1], is van overeenkomstige toepassing op de overdrachtsverplichting, bedoeld
      in het eerste lid, met dien verstande dat ook speciale scholen voor basisonderwijs een aandeel kunnen hebben in
      de overdrachtsverplichting.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel124
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel125
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '124'
        hoofdstuk: I
        afdeling: '5'
  - number: '126.1'
    text: |-
      Aan de school wordt in verband met de kosten van vervanging van personeel wegens voorschriften die zijn gegeven bij
      algemene maatregel van bestuur of bij ministeriële regeling en de kosten van werkloosheidsuitkeringen, suppleties
      inzake arbeidsongeschiktheid alsmede uitkeringen wegens ziekte en arbeidsongeschiktheid van gewezen personeel
      anders dan op grond van de [Ziektewet][ref1] bekostiging verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel126
    references:
      - id: ref1
        bwb_id: BWBR0001888
  - number: '126.2'
    text: |-
      De in het eerste lid bedoelde bekostiging is verwerkt in de bedragen en in de vermenigvuldigingsbedragen van de
      verhoging, bedoeld in de [artikelen 120][ref1], [123][ref2], [124][ref3], [125][ref4] en [132][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel120
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel123
      [ref3]: https://wetten.overheid.nl/BWBR0003420#Artikel124
