        afdeling: '3'
      - id: ref4
        bwb_id: BWBR0003420
        artikel: '61'
        hoofdstuk: I
        afdeling: '3'
  - number: '68.7'
    text: |-
      De [artikelen 164][ref1], [171][ref2], [172][ref3], [175][ref4], [177][ref5] en [182][ref6] zijn van
      overeenkomstige toepassing voor de centrale diensten die op grond van [artikel 132][ref7] zorgformatie ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel164
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel171
      [ref3]: https://wetten.overheid.nl/BWBR0003420#Artikel172
      [ref4]: https://wetten.overheid.nl/BWBR0003420#Artikel175
      [ref5]: https://wetten.overheid.nl/BWBR0003420#Artikel177
      [ref6]: https://wetten.overheid.nl/BWBR0003420#Artikel182
      [ref7]: https://wetten.overheid.nl/BWBR0003420#Artikel132
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel68
