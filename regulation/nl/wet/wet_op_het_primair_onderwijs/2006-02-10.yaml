  - number: '149.1'
    text: |-
      Op de bekostiging of onderdelen daarvan kunnen voorschotten worden verleend volgens regels, te stellen bij of
      krachtens algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel149
  - number: '149.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden tevens voorschriften gegeven voor de verrekening van de
      betaalde voorschotten met het bedrag van de vastgestelde bekostiging of onderdelen daarvan.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel149
  - number: '151'
    text: 'In deze paragraaf wordt onder «school» verstaan: basisschool.'
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel151
  - number: '152'
    text: |-
      Waar in deze paragraaf sprake is van een aantal leerlingen, is dat het aantal leerlingen op 1 oktober van het
      schooljaar, verhoogd met 3% daarvan, waarbij de uitkomst naar beneden wordt afgerond op een geheel getal.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel152
  - number: '153.1'
    text: |-
      De bekostiging van een bijzondere school wordt beëindigd en een openbare school wordt opgeheven indien het
      aantal leerlingen, voor zover het niet betreft het aantal leerlingen van een nevenvestiging, gedurende 3
      achtereenvolgende schooljaren telkens minder heeft bedragen dan de opheffingsnorm die, berekend overeenkomstig de
      [artikelen 154][ref1] en [155][ref2], geldt voor de gemeente of voor het deel van de gemeente waarin de school,
      daaronder niet begrepen een nevenvestiging, is gelegen. De eerste volzin is niet van toepassing zolang gedurende
      de eerste 5 schooljaren van de bekostiging van een school het aantal leerlingen van de school, voor zover het niet
      betreft het aantal leerlingen van een nevenvestiging, niet heeft voldaan aan de stichtingsnorm die werd vastgesteld
      met toepassing van [artikel 77, tweede lid][ref3], en op grond waarvan de school voor bekostiging in aanmerking
      werd genomen. De tweede volzin is niet van toepassing op scholen als bedoeld in [artikel 84][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel154
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel155
      [ref3]: https://wetten.overheid.nl/BWBR0003420#Artikel77
      [ref4]: https://wetten.overheid.nl/BWBR0003420#Artikel84
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel153
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '154'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '9'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '155'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '9'
      - id: ref3
        bwb_id: BWBR0003420
        artikel: '77'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0003420
        artikel: '84'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '2'
  - number: '153.2'
    text: |-
      De opheffingsnormen, berekend op grond van [artikel 154][ref1], zijn voor de eerste maal opgenomen in de bij deze
      wet behorende bijlage. Deze normen zijn tot en met 31 juli 1998 van kracht. Deze normen worden met ingang van 1
      augustus 1998 telkens voor een tijdvak van 5 jaar bij ministeriële regeling aangepast op basis van de gegevens
      van het Centraal Bureau voor de Statistiek betreffende 1 januari van het tweede jaar voorafgaand aan het laatste
      jaar waarin de opheffingsnormen van kracht zijn. De ministeriële regeling, bedoeld in de derde volzin, wordt,
      tezamen met bij die regeling op grond van [artikel 155][ref2] vastgestelde normen voor delen van gemeenten, voor 1
      november van het jaar voorafgaand aan het laatste jaar waarin de opheffingsnormen van kracht zijn, bekendgemaakt in
      de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel154
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel155
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel153
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '154'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '9'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '155'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '9'
  - number: '153.3'
    text: |-
      De beëindiging van de bekostiging van een bijzondere school of de opheffing van een openbare school geschiedt met
      ingang van 1 augustus volgend op de 3 achtereenvolgende schooljaren, bedoeld in het eerste lid. De beëindiging van
      de bekostiging van een bijzondere school of de opheffing van een openbare school ten aanzien waarvan gedurende de
      eerste 5 schooljaren van de bekostiging van de school het eerste lid, tweede volzin, toepassing diende te vinden,
      geschiedt met ingang van 1 augustus volgend op die 5 schooljaren.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel153
  - number: '153.4'
    text: |-
      Indien het aantal leerlingen van een bijzondere school of een openbare school, voor zover het niet betreft het
      aantal leerlingen van een nevenvestiging, in het derde schooljaar van de 3 achtereenvolgende schooljaren, bedoeld
      in het eerste lid, gelijk is aan of meer bedraagt dan 50 en de school, daaronder niet begrepen een nevenvestiging,
      binnen een straal van 5 km de laatste school van de richting is onderscheidenlijk de laatste openbare school is,
      wordt de bekostiging van de bijzondere school niet beëindigd of de openbare school niet opgeheven op grond van dit
      artikel, mits het bevoegd gezag tijdig de in [artikel 160, tweede lid][ref1], bedoelde mededeling heeft gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel160
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel153
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '160'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '9'
  - number: '153.5'
    text: |-
      Indien binnen 10 km van een school waarbinnen openbaar onderwijs wordt gegeven, over de weg gemeten geen school
      aanwezig is waarbinnen openbaar onderwijs wordt gegeven en aan het volgen van openbaar onderwijs behoefte bestaat,
      wordt de eerstgenoemde school niet opgeheven op grond van dit artikel.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel153
  - number: '154'
    text: |-
      Voor iedere gemeente wordt, op basis van de leerlingdichtheid in die gemeente, een opheffingsnorm vastgesteld
      aan de hand van de formule: Opheffingsnorm = 0,6 x (leerlingdichtheid : (0,15 + 0,0027 x leerlingdichtheid)) De
      uitkomst van de berekening wordt afgerond, waarbij de decimalen worden verwaarloosd indien het eerste cijfer achter
      de komma kleiner is dan 5 en waarbij de decimalen worden verwaarloosd en het getal verhoogd met 1 indien het eerste
      cijfer achter de komma gelijk is aan of groter is dan 5. De opheffingsnorm bedraagt minimaal 23 en maximaal 200.
      De leerlingdichtheid is de uitkomst van het aantal inwoners van 4 tot en met 11 jaar in die gemeente gedeeld door
      het aantal km2 grondoppervlakte van die gemeente. Indien het aantal km2 van de gemeente minder bedraagt dan 10 km2,
      wordt voor de berekening van de leerlingdichtheid uitgegaan van 10 km2. De leerlingdichtheid bedraagt maximaal 500.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel154
  - number: '155.1'
    text: |-
      De gemeenteraad kan, indien elk bevoegd gezag dat een of meer scholen in de gemeente in stand houdt schriftelijk
      heeft verklaard daarmee in te stemmen, besluiten dat het grondgebied van de gemeente in twee bij dat
      besluit vastgestelde delen wordt gesplitst in verband met aanzienlijke verschillen in bebouwingskarakter en
      bevolkingsdichtheid tussen die delen. De grenzen van de delen van de gemeente die zijn ontstaan als gevolg van
      toepassing van de eerste volzin, vallen samen met grenzen van gebieden in die gemeente die zijn opgenomen in
      de jaarlijkse publikatie van het Centraal Bureau voor de Statistiek «De landelijke wijk- en buurtindeling». Het
      besluit wordt genomen uiterlijk 2 jaar voor het verstrijken van de periode tot en met 31 juli 1998 of een 5-
      jaarlijkse periode als bedoeld in [artikel 153, tweede lid][ref1]. Het besluit is gedurende 20 jaar van kracht
      behoudens het gestelde in het vijfde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel153
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel155
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '153'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '9'
  - number: '155.2'
    text: |-
      Burgemeester en wethouders brengen Onze minister binnen vier weken na het nemen van het besluit, bedoeld in
      het eerste lid, op de hoogte van dat besluit, waarbij tevens mededeling wordt gedaan van de begrenzing van de
      beide gebiedsdelen, de oppervlakte daarvan en het aantal 4- tot en met 11-jarigen dat daarbinnen woonachtig
      is. Na ontvangst van een mededeling als bedoeld in de eerste volzin wordt bij ministeriële regeling voor
      de beide gebiedsdelen een afzonderlijke opheffingsnorm vastgesteld. De opheffingsnorm voor elk deel wordt
      vastgesteld op de wijze als aangegeven in [artikel 154][ref1], met dien verstande dat bij het bepalen van de
      leerlingdichtheid wordt uitgegaan van het aantal km2 grondoppervlakte van het desbetreffende deel en dat de
      vijfde volzin van [artikel 154][ref2] niet van toepassing is. De ministeriële regeling wordt overeenkomstig
      [artikel 153, tweede lid][ref3], bekendgemaakt en is voor de eerste maal van toepassing op het eerstvolgende
      tijdvak van 5 jaar, volgend op die bekendmaking.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel154
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel154
      [ref3]: https://wetten.overheid.nl/BWBR0003420#Artikel153
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel155
    references:
      - id: ref1
        bwb_id: BWBR0003420
