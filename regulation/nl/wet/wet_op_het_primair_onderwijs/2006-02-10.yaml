  - number: '148.3'
    text: |-
      De verstrekte overschrijdingsbedragen worden ten behoeve van het onderwijs aan de scholen van het bevoegd gezag
      aangewend.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel148
  - number: '148.4'
    text: |-
      De op grond van [artikel 140][ref1] of [artikel 141][ref2] verstrekte vergoeding wordt besteed aan het doel
      waarvoor zij is verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel140
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel141
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel148
