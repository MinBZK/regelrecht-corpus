        artikel: '135'
        hoofdstuk: I
        paragraaf: '2'
        afdeling: '8'
  - number: 144.1.h
    text: |-
      het totaal van de bedragen die in het voorafgaande kalenderjaar zijn uitgegeven ten behoeve van de instandhouding
      van een rechtspersoon als bedoeld in [artikel 68][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel68
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel144
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '68'
        hoofdstuk: I
  - number: 144.1.i
    text: |-
      het totaal van de ontvangsten op grond van [artikel 134, tweede lid, tweede volzin][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel134
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel144
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '134'
        hoofdstuk: I
        paragraaf: '2'
        afdeling: '8'
  - number: 144.1.j
    text: een staat van voorzieningen die zijn ingesteld ten behoeve van de door de gemeente in stand gehouden scholen.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel144
  - number: '144.2'
    text: |-
      Indien de gemeente een deel van de ontvangsten bedoeld, in het eerste lid onder d of een deel van de ontvangsten,
      bedoeld in dat lid onder e, f, g en i, toevoegt aan een voorziening, wordt dat deel aangemerkt als een uitgave als
      bedoeld in dat lid onder a, onderscheidenlijk als een uitgave als bedoeld in dat lid onder b, c en h. Indien de
      gemeente ten behoeve van de personeelskosten, de nascholingskosten, de kosten voor materiële instandhouding of de
      kosten voor de instandhouding van een rechtspersoon als bedoeld in [artikel 68][ref1], bedragen aan een voorziening
      onttrekt, worden deze aangemerkt als ontvangsten als bedoeld in het eerste lid onder d, e of f.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel68
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel144
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '68'
        hoofdstuk: I
  - number: '144.3'
    text: |-
      Bij het vaststellen van de bedragen, bedoeld in het eerste lid onder c, f, g en h, worden buiten beschouwing
      gelaten de uitgaven en ontvangsten voor:
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel144
  - number: 144.3.a
    text: |-
      administratie, beheer en bestuur, bedoeld in [artikel 114 , onder e][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel114
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel144
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '114'
        hoofdstuk: I
        afdeling: '4'
  - number: 144.3.b
    text: de materiële instandhouding van het onderwijs in lichamelijke oefening en
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel144
  - number: 144.3.c
    text: |-
      de materiële instandhouding in verband met de toepassing van [artikel 166, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel166
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel144
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '166'
        hoofdstuk: I
        afdeling: '10'
  - number: '144.4'
    text: |-
      Bij het vaststellen van de bedragen, bedoeld in het eerste lid onder a, worden buiten beschouwing gelaten de
      uitgaven ten behoeve van personeel dat door de gemeente met toepassing van [artikel 166, eerste lid][ref1],
      aan een openbare school wordt verbonden. Bij het vaststellen van de bedragen, bedoeld in het eerste lid onder
      a, b, c en h, worden voorts buiten beschouwing gelaten de uitgaven die worden gedekt door ontvangsten van
      bedragen die door derden zijn betaald, de uitgaven die worden gedekt door ontvangsten op grond van een besluit
      als bedoeld in [artikel 140, zesde lid, tweede volzin][ref2], en de uitgaven voor de voorzieningen waarvoor
      het bevoegd gezag van een niet door de gemeente in stand gehouden school op grond van de regeling, bedoeld in
      [artikel 141, eerste lid][ref3], een aanvraag bij de gemeente kon indienen en wel gedurende de periode waarvoor een
      dergelijke aanvraag kon worden gedaan. Bij het vaststellen van de bedragen, bedoeld in het eerste lid onder a, b,
      c en h, blijven de uitgaven ten behoeve van een basisschool buiten beschouwing tot het bedrag dat de gemeente voor
      die school overdraagt op grond van [artikel 118][ref4], [artikel 124][ref5] of [artikel 125][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel166
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel140
      [ref3]: https://wetten.overheid.nl/BWBR0003420#Artikel141
      [ref4]: https://wetten.overheid.nl/BWBR0003420#Artikel118
      [ref5]: https://wetten.overheid.nl/BWBR0003420#Artikel124
      [ref6]: https://wetten.overheid.nl/BWBR0003420#Artikel125
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel144
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '166'
        hoofdstuk: I
        afdeling: '10'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '140'
        hoofdstuk: I
        paragraaf: '4'
        afdeling: '8'
      - id: ref3
        bwb_id: BWBR0003420
        artikel: '141'
