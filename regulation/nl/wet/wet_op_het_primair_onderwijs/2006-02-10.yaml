  - number: '156.3'
    text: |-
      [Artikel 155, derde lid, eerste, derde en vierde volzin, en vierde lid][ref1] is van overeenkomstige toepassing,
      met dien verstande dat in het vierde lid voor «6 maanden» wordt gelezen: 3 maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel155
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel156
