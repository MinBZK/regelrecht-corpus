  - number: '148.2'
    text: |-
      Het bevoegd gezag kan de in de [artikelen 129][ref1], [134][ref2] en [137][ref3] bedoelde bedragen voor de kosten
      voor de materiële instandhouding en voor de personeelskosten mede aanwenden voor de in het eerste lid bedoelde
      kosten van:


