      - id: ref3
        bwb_id: BWBR0003420
        artikel: '132'
        hoofdstuk: I
        afdeling: '7'
  - number: '137.2'
    text: |-
      In geval van het verstrekken van een bijzondere bekostiging als bedoeld in [artikel 123][ref1] verstrekt het Rijk
      aan het desbetreffende bevoegd gezag het bedrag van deze bekostiging.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel123
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel137
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '123'
        hoofdstuk: I
        afdeling: '5'
  - number: '137.3'
    text: |-
      Met inachtneming van [artikel 132, eerste lid][ref1], verstrekt het Rijk jaarlijks aan het bestuur van een centrale
      dienst een bedrag ten behoeve van de personeelskosten van zorgvoorzieningen.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel132
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel137
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '132'
        hoofdstuk: I
        afdeling: '7'
  - number: '137.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden voorschriften gegeven met betrekking tot het betalen van het
      in het eerste, tweede en derde lid bedoelde bedrag.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel137
  - number: '137.5'
    text: |-
      Op het in het eerste, tweede en derde lid bedoelde bedrag worden op een bij ministeriële regeling vast te stellen
      wijze in mindering gebracht de inkomsten die het bevoegd gezag dan wel het bestuur van de centrale dienst direct of
      indirect geniet vanwege uitkeringen of toelagen waarop door het personeel aanspraak kan worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel137
  - number: '138.1'
    text: |-
      Op de bekostiging, bedoeld in [artikel 137][ref1], worden in mindering gebracht de salarissen, toelagen,
      uitkeringen of andere bijdragen waarop aanspraak wordt gemaakt door personeel dat is benoemd met voorbijgaan van
      personeel dat een gelijksoortige functie uitoefent of heeft uitgeoefend aan een school van het bevoegd gezag, voor
      zover laatstbedoeld personeel


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel137
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel138
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '137'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: '8'
  - number: 138.1.a
    text: |-
      gebruik maakt van een krachtens [artikel 33, tweede lid][ref1], vastgestelde regeling voor onvrijwillige
      taakvermindering, of


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel33
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel138
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '33'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: '1'
  - number: 138.1.b
    text: |-
      voor zover zich geen geval voordoet als bedoeld onder a, in het genot is van wachtgeld of van een andere
      ontslaguitkering en direct aan die ontslaguitkering voorafgaand langer dan een jaar onafgebroken in dienst is
      geweest van het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel138
  - number: '138.2'
    text: |-
      Op de bekostiging, bedoeld in [artikel 137][ref1], worden eveneens in mindering gebracht de salarissen, toelagen,
      uitkeringen of andere bijdragen waarop aanspraak wordt gemaakt door personeel dat langer dan 1 jaar anders dan
      wegens vervanging onafgebroken, met een onderbreking van een week of minder, dan wel met een of meer onderbrekingen
      gedurende een schoolvakantie, in een gelijksoortige functie in tijdelijke dienst verbonden is geweest aan een
      school van het bevoegd gezag. De termijn van 1 jaar kan ingeval van een of meer ziekteperioden van langer dan 4
      weken met deze ziekteperioden worden verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel137
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel138
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '137'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: '8'
  - number: '138.3'
    text: |-
      Op de bekostiging worden eveneens in mindering gebracht de kosten van werkloosheidsuitkeringen, suppleties inzake
      arbeidsongeschiktheid alsmede uitkeringen wegens ziekte en arbeidsongeschiktheid van gewezen personeel anders dan
      op grond van de [Ziektewet][ref1]. De eerste volzin is niet van toepassing, indien de rechtspersoon, bedoeld in
      [artikel 184][ref2], op een daartoe strekkend verzoek van het bevoegd gezag, voorafgaand aan het ontslag heeft
      ingestemd met het ten laste van die rechtspersoon brengen van de kosten van uitkeringen of suppleties als bedoeld
      in de eerste volzin.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel184
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel138
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '184'
        hoofdstuk: I
        afdeling: '12'
  - number: '138.4'
    text: |-
      Het eerste lid is eveneens van toepassing, indien de benoeming heeft plaatsgevonden in aansluiting op een benoeming
      in tijdelijke dienst in dezelfde functie.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel138
  - number: '138.5'
    text: |-
      Met gewezen personeel dat in het genot is van wachtgeld of van een andere ontslaguitkering als bedoeld in het
      eerste lid onder b, wordt gelijk gesteld personeel aan wie op grond van het leerlingenverloop op of na 1 februari
      ontslag is of zal worden aangezegd, op grond van welk ontslag recht op wachtgeld of een andere ontslaguitkering zou
      kunnen ontstaan. In afwijking van de eerste volzin kan voor een periode tot uiterlijk de datum van ingang van het
      recht op wachtgeld of op een andere ontslaguitkering in een vacature worden voorzien zonder dat de vermindering,
      bedoeld in het eerste lid, plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel138
  - number: '138.6'
    text: |-
      Bij ministeriële regeling wordt bepaald in welke gevallen geen vermindering als bedoeld in het eerste en tweede
      lid plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel138
  - number: '138.7'
    text: |-
      Onze minister kan in andere gevallen dan voorzien in de ministeriële regeling bedoeld in het zesde lid, wegens
      gewichtige redenen op verzoek van het bevoegd gezag besluiten dat de vermindering van de bekostiging, bedoeld in
      het eerste lid, niet zal plaatsvinden. Onze minister besluit binnen 4 maanden na ontvangst van het verzoek. Indien
      het besluit niet binnen 4 maanden kan worden genomen, stelt Onze minister de verzoeker daarvan in kennis en noemt
      hij een redelijke termijn waarbinnen het besluit wel tegemoet kan worden gezien. Uitsluitend op grond van door het
      bevoegd gezag aangevoerde bijzondere omstandigheden kan Onze minister bepalen dat het besluit, bedoeld in de eerste
      volzin, betrekking heeft of mede betrekking heeft op een periode voorafgaand aan de datum waarop het bevoegd gezag
      het in de eerste volzin bedoelde verzoek heeft ingediend.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel138
  - number: '138.8'
    text: Onze minister kan projecten aanwijzen waarvoor het tweede lid niet van toepassing is.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel138
  - number: '139.1'
    text: |-
      [Artikel 138][ref1] is van overeenkomstige toepassing indien de rechtspersoon, bedoeld in [artikel 68][ref2],
      personeel benoemt met voorbijgaan van gewezen personeel als bedoeld in [artikel 138, eerste en vijfde lid][ref3],
      van de rechtspersoon of van een bevoegd gezag waarvoor diensten worden verricht, dan wel niet handelt
      overeenkomstig het bepaalde in laatstgenoemde artikelleden. Van het gewezen personeel, bedoeld in de eerste volzin,
      is uitgezonderd het personeel van het bevoegd gezag waarvoor diensten worden verricht, waarvan de dienstbetrekking
      is beëindigd op een tijdstip dat meer dan twee jaar ligt voor de aanvang van de dienstverlening.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel138
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel68
      [ref3]: https://wetten.overheid.nl/BWBR0003420#Artikel138
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel139
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '138'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: '8'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '68'
        hoofdstuk: I
      - id: ref3
        bwb_id: BWBR0003420
        artikel: '138'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: '8'
  - number: '139.2'
    text: |-
      In geval van toepassing van het eerste lid wordt het in mindering te brengen bedrag in gelijke mate verdeeld over
      de scholen waarvoor diensten worden verricht.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel139
  - number: '139.3'
    text: |-
      [Artikel 138][ref1] is eveneens van overeenkomstige toepassing


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel138
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel139
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '138'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: '8'
  - number: 139.3.a
    text: |-
      indien een bevoegd gezag waarvoor diensten worden verricht, personeel benoemt met voorbijgaan van gewezen personeel
      van de rechtspersoon, bedoeld in [artikel 68][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel68
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel139
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '68'
        hoofdstuk: I
  - number: 139.3.b
    text: |-
      indien een bevoegd gezag waarvoor geen diensten meer worden verricht, in het tijdvak van vijf jaar na beëindiging
      van de dienstverlening personeel benoemt met voorbijgaan van gewezen personeel als bedoeld in onderdeel a.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel139
  - number: '139.4'
    text: |-
      [Artikel 138, derde lid][ref1], is van overeenkomstige toepassing indien de rechtspersoon, bedoeld in
      [artikel 68][ref2], personeel ontslaat zonder voorafgaande instemming van de rechtspersoon, bedoeld in
      [artikel 184][ref3], met dien verstande dat het in mindering te brengen bedrag in gelijke mate wordt verdeeld over
      de bevoegde gezagsorganen waarvan de rechtspersoon, bedoeld in [artikel 68][ref4], uitgaat.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel138
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel68
      [ref3]: https://wetten.overheid.nl/BWBR0003420#Artikel184
      [ref4]: https://wetten.overheid.nl/BWBR0003420#Artikel68
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel139
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '138'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: '8'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '68'
        hoofdstuk: I
      - id: ref3
        bwb_id: BWBR0003420
        artikel: '184'
        hoofdstuk: I
        afdeling: '12'
      - id: ref4
        bwb_id: BWBR0003420
        artikel: '68'
        hoofdstuk: I
  - number: '140.1'
    text: |-
      Indien in een gemeente uitsluitend een of meer andere rechtspersonen dan de gemeente openbare basisscholen of
      openbare speciale scholen voor basisonderwijs in stand houden of openbare basisscholen onderscheidenlijk openbare
      speciale scholen voor basisonderwijs ontbreken en de gemeente uitgaven wil doen voor het onderwijs aan die scholen
      welke niet door het Rijk worden bekostigd, stelt de gemeenteraad onverminderd [artikel 166, eerste lid][ref1], bij
      verordening een regeling daarvoor vast en zijn de [artikelen 142 tot en met 147][ref2] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel166
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel142
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel140
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '166'
        hoofdstuk: I
        afdeling: '10'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '142'
        hoofdstuk: I
        paragraaf: '5'
        afdeling: '8'
  - number: '140.2'
    text: |-
      De regeling, bedoeld in het eerste lid, maakt geen onderscheid tussen openbaar en bijzonder onderwijs en voorziet
      in een behandeling van basisscholen onderscheidenlijk speciale scholen voor basisonderwijs naar dezelfde maatstaf.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel140
  - number: '140.3'
    text: |-
      De regeling, bedoeld in het eerste lid, bevat in elk geval de voorzieningen die door het bevoegd gezag van een in
      de gemeente gelegen, niet door de gemeente in stand gehouden basisschool onderscheidenlijk speciale school voor
      basisonderwijs kunnen worden aangevraagd en de procedure voor het doen van een aanvraag.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel140
  - number: '140.4'
    text: |-
      De gemeenteraad kan besluiten dat burgemeester en wethouders de regeling, bedoeld in het eerste lid, tijdelijk
      kunnen aanvullen met nieuwe voorzieningen. De aanvulling wordt binnen 1 week aan de bevoegde gezagsorganen van
      de niet door de gemeente in stand gehouden basisscholen onderscheidenlijk speciale scholen voor basisonderwijs
      gezonden. Binnen 12 weken na de totstandkoming van de aanvulling wordt deze voorgelegd aan de gemeenteraad en
      besluit de gemeenteraad over de bekrachtiging ervan. Indien de gemeenteraad niet binnen 12 weken heeft besloten,
      wordt de aanvulling gelijk gesteld met een aanvulling die is bekrachtigd. Een afwijzing van de aanvulling door
      de gemeenteraad heeft geen gevolgen voor aanvragen waarop reeds is besloten of die reeds zijn ingediend en die
      voorzieningen betreffen waarop de aanvulling betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel140
  - number: '140.5'
    text: |-
      [Artikel 8:2 van de Algemene wet bestuursrecht][ref1] is niet van toepassing op de regeling, bedoeld in het eerste
      lid, dan wel een wijziging daarvan. In afwijking van [artikel 8:1 van de Algemene wet bestuursrecht][ref2] kan
      tegen een aanvulling als bedoeld in het vierde lid geen beroep worden ingesteld zolang de gemeenteraad deze nog
      niet heeft bekrachtigd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel140
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '140.6'
    text: |-
      Voor de toepassing van dit artikel wordt een nevenvestiging aangemerkt als een nevenvestiging die is gelegen in
      de gemeente van de hoofdvestiging. De gemeenteraad kan besluiten dat in de gemeente gelegen nevenvestigingen van
      scholen waarvan de hoofdvestiging is gelegen in een andere gemeente in afwijking van de eerste volzin in aanmerking
      komen voor een of meer van de in de regeling genoemde voorzieningen.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel140
  - number: '140.7'
    text: |-
      Burgemeester en wethouders maken jaarlijks in een van overheidswege uitgegeven blad of een dag-, nieuws- of huis-
      aan-huisblad, dan wel op een andere geschikte wijze, een overzicht bekend van de op grond van de regeling, bedoeld
      in het eerste lid, toegekende voorzieningen.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel140
  - number: 140a.1
    text: |-
      Indien de gemeenteraad ten aanzien van een of meer door de gemeente in stand gehouden openbare scholen besluit dat
      deze met ingang van een datum die is gelegen in de periode die aanvangt met een bij koninklijk besluit te bepalen
      datum en eindigt met ingang van het zevende kalenderjaar daaropvolgend, in stand zullen worden gehouden door een
      of meer andere rechtspersonen dan de gemeente, kan de regeling, bedoeld in [artikel 140, eerste lid][ref1], dan
      wel de regeling, bedoeld in [artikel 141, eerste lid][ref2], bij effectuering van dat besluit ten aanzien van
      die scholen en in afwijking van [artikel 140, tweede lid][ref3], dan wel een regeling op grond van dit artikel
      bij effectuering van dat besluit ten aanzien van die scholen, erin voorzien dat door de gemeente aan een of meer
      andere rechtspersonen dan de gemeente die die scholen in stand houden, een vergoeding voor administratie, beheer en
      bestuur wordt toegekend als aangegeven in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel140
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel141
      [ref3]: https://wetten.overheid.nl/BWBR0003420#Artikel140
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel140a
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '140'
        hoofdstuk: I
        paragraaf: '4'
        afdeling: '8'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '141'
        hoofdstuk: I
        paragraaf: '4'
        afdeling: '8'
      - id: ref3
        bwb_id: BWBR0003420
        artikel: '140'
        hoofdstuk: I
        paragraaf: '4'
        afdeling: '8'
  - number: 140a.2
    text: |-
      De vergoeding, die op grond van het eerste lid kan worden toegekend, bedraagt gedurende het eerste en het
      tweede kalenderjaar volgend op het tijdstip waarop de scholen, bedoeld in het eerste lid, niet langer door de
      gemeente in stand worden gehouden, maximaal 4 maal het bedrag voor administratie, beheer en bestuur, op grond van
      [artikel 114, onderdeel e][ref1], en gedurende het derde, vierde en vijfde kalenderjaar maximaal 3 maal dat bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel114
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel140a
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '114'
        hoofdstuk: I
        afdeling: '4'
  - number: 140a.3
    text: |-
      Indien de gemeenteraad besluit scholen niet langer in stand te houden vanaf een andere datum dan 1 januari dan
      geldt als het eerste kalenderjaar, bedoeld in het tweede lid, het deel van het kalenderjaar dat volgt op de
      datum waarop de gemeente die scholen niet langer in stand houdt en bedraagt de vergoeding die voor dat eerste
      kalenderjaar maximaal kan worden toegekend voor administratie, beheer en bestuur een evenredig deel van de
      vergoeding die op grond van het tweede lid maximaal kan worden toegekend.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel140a
  - number: 140a.4
    text: |-
      Voor de toepassing van het tweede lid wordt per school uitgegaan van het leerlingenaantal, bedoeld in
      [artikel 134][ref1], zoals dat gold voor de berekening van het bedrag voor administratie, beheer en bestuur voor
      het kalenderjaar direct voorafgaand aan het tijdstip waarop door de gemeente de desbetreffende school niet langer
      in stand wordt gehouden en het prijspeil in dat kalenderjaar. De korting wegens rente-ontvangsten uit gevormde
      reserves van de programma's van eisen, bedoeld in [artikel 114, onderdelen a en d][ref2], blijft daarbij buiten
      beschouwing.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel134
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel114
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel140a
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '134'
        hoofdstuk: I
        paragraaf: '2'
        afdeling: '8'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '114'
        hoofdstuk: I
        afdeling: '4'
  - number: 140a.5
    text: |-
      De op grond van het eerste lid toe te kennen vergoeding kan in een kalenderjaar niet hoger zijn dan de in het
      daaraan voorafgaande kalenderjaar op grond van dit artikel toegekende vergoeding. De eerste volzin is niet
      van toepassing ten aanzien van de vergoeding voor het tweede kalenderjaar indien de vergoeding voor het eerste
      kalenderjaar is bepaald op grond van het derde lid. Bij de toepassing van de eerste volzin blijft het teruggestorte
      bedrag, bedoeld in het zevende lid, buiten beschouwing.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel140a
  - number: 140a.6
    text: |-
      Het bevoegd gezag dat een school als bedoeld in het eerste lid in stand houdt die voor die tijd door de gemeente
      in stand werd gehouden, legt aan die gemeente en aan de andere rechtspersonen die een of meer niet door de gemeente
      in stand gehouden scholen in die gemeente in stand houden, jaarlijks een verklaring van een accountant als bedoeld
      in [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1] over met betrekking tot de uitgaven en
      ontvangsten voor administratie, beheer en bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel140a
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: 140a.7
    text: |-
      Voor zover voor een school als bedoeld in het eerste lid, de vergoeding, bedoeld in het eerste lid, vermeerderd met
      de vergoeding op grond van [artikel 114, onderdeel e][ref1], in een kalenderjaar niet volledig is aangewend voor
      uitgaven voor administratie, beheer en bestuur, wordt het verschil door het bevoegd gezag, bedoeld in het zesde
      lid, teruggestort in de gemeentekas.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel114
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel140a
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '114'
        hoofdstuk: I
        afdeling: '4'
  - number: '141.1'
    text: |-
      Indien een gemeente zelf een of meer openbare basisscholen of openbare speciale scholen voor basisonderwijs
      in stand houdt en zij uitgaven wil doen voor het onderwijs aan die scholen welke niet door het Rijk worden
      bekostigd, kan de gemeenteraad onverminderd [artikel 166, eerste lid][ref1], daarvoor bij verordening een regeling
      vaststellen.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel166
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel141
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '166'
        hoofdstuk: I
        afdeling: '10'
  - number: '141.2'
    text: |-
      [Artikel 140, tweede tot en met zevende lid][ref1], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel140
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel141
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '140'
        hoofdstuk: I
        paragraaf: '4'
        afdeling: '8'
  - number: '142.1'
    text: |-
      Indien een gemeente ten behoeve van een of meer door haar in stand gehouden basisscholen of speciale scholen
      voor basisonderwijs meer uitgaven doet voor het personeel en de materiële instandhouding dan door het Rijk worden
      bekostigd, wordt met inachtneming van de [artikelen 142 tot en met 147][ref1] aan het bevoegd gezag van de in die
      gemeente gevestigde, niet door de gemeente in stand gehouden basisscholen onderscheidenlijk speciale scholen voor
      basisonderwijs om de vijf jaar een overschrijdingsbedrag verstrekt. Voor de toepassing van de eerste volzin worden
      ontvangsten op grond van [artikel 134, tweede lid, tweede volzin][ref2], gelijk gesteld met ontvangsten van het
      Rijk. Indien een gemeente vanaf een tijdstip binnen een periode van vijf jaar als bedoeld in de eerste volzin geen
      basisschool onderscheidenlijk speciale school voor basisonderwijs in stand houdt, wordt het overschrijdingsbedrag
      in afwijking van die volzin uiterlijk 31 december van het kalenderjaar dat volgt op dat tijdstip waarop de gemeente
      niet langer een school in stand houdt, toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel142
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel134
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel142
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '142'
        hoofdstuk: I
        paragraaf: '5'
        afdeling: '8'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '134'
        hoofdstuk: I
        paragraaf: '2'
        afdeling: '8'
  - number: '142.2'
    text: |-
      Voor de toepassing van de [artikelen 142 tot en met 147][ref1] worden uitgaven ten behoeve van een nevenvestiging
      aangemerkt als uitgaven ten behoeve van de hoofdvestiging van de school waaraan de nevenvestiging is verbonden.
      Indien ten behoeve van een school of nevenvestiging uitgaven worden gedaan door meer dan één gemeente, worden deze
      uitgaven aangemerkt als uitgaven van de gemeente op wier grondgebied de hoofdvestiging is gelegen. In het geval
      bedoeld in de vorige volzin worden de besluiten ingevolge het vierde lid en de [artikelen 143 tot en met 147][ref2]
      genomen door laatstbedoelde gemeente en hebben deze mede betrekking op de uitgaven van de andere gemeente of
      gemeenten.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel142
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel143
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel142
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '142'
        hoofdstuk: I
        paragraaf: '5'
        afdeling: '8'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '143'
        hoofdstuk: I
        paragraaf: '5'
        afdeling: '8'
  - number: '142.3'
    text: |-
      Voor de toepassing van de [artikelen 142 tot en met 147][ref1] wordt een nevenvestiging in een andere gemeente
      dan waarin de hoofdvestiging is gelegen, aangemerkt als een nevenvestiging die is gelegen in de gemeente van de
      hoofdvestiging.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel142
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel142
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '142'
        hoofdstuk: I
        paragraaf: '5'
        afdeling: '8'
  - number: '142.4'
    text: |-
      De gemeenteraad kan in overeenstemming met het bevoegd gezag van een niet door de gemeente in stand gehouden
      school besluiten dat met betrekking tot een of meer scholen van dat bevoegd gezag uitgaven die de gemeente doet
      ten behoeve van een door haar in stand gehouden school buiten beschouwing worden gelaten bij het vaststellen van de
      bedragen, bedoeld in de [artikelen 143][ref1] en [144][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel143
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel144
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel142
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '143'
        hoofdstuk: I
        paragraaf: '5'
        afdeling: '8'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '144'
        hoofdstuk: I
        paragraaf: '5'
        afdeling: '8'
  - number: '143.1'
    text: |-
      De gemeenteraad stelt, onderscheiden al naar gelang het basisscholen of speciale scholen voor basisonderwijs
      betreft, jaarlijks vast in welke mate zij ten behoeve van de door de gemeente in stand gehouden scholen meer dan
      wel minder uitgaven zal doen voor het personeel en de materiële instandhouding dan door het Rijk worden bekostigd.
      Deze vaststelling geschiedt voor het komende begrotingsjaar en het resterende deel van het vijfjarig tijdvak,
      bedoeld in [artikel 142, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel142
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel143
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '142'
        hoofdstuk: I
        paragraaf: '5'
        afdeling: '8'
  - number: '143.2'
    text: |-
      Indien voor het komende begrotingsjaar meer uitgaven zullen worden gedaan voor het personeel en de materiële
      instandhouding dan door het Rijk worden bekostigd, verlenen burgemeester en wethouders in dat begrotingsjaar
      aan het bevoegd gezag van de niet door de gemeente in stand gehouden basisscholen onderscheidenlijk speciale
      scholen voor basisonderwijs in de gemeente een voorschot op het te verwachten overschrijdingsbedrag, bedoeld in
      [artikel 142, eerste lid][ref1]. Indien uit het besluit van de gemeenteraad, bedoeld in het eerste lid, blijkt
      dat de hiervoor bedoelde meer-uitgaven in de resterende jaren van het vijfjarig tijdvak geheel of ten dele
      worden gecompenseerd door minder uitgaven, wordt hiermee rekening gehouden bij de bepaling van de hoogte van het
      voorschot.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel142
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel143
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '142'
        hoofdstuk: I
        paragraaf: '5'
        afdeling: '8'
  - number: '143.3'
    text: |-
      Indien uit de jaarlijkse voorlopige vaststelling van de bedragen, bedoeld in [artikel 144, eerste lid][ref1],
      blijkt dat, in afwijking van hetgeen is vastgesteld bij het besluit van de gemeenteraad, bedoeld in het eerste lid,
      meer uitgaven zijn gedaan voor personeel en materiële instandhouding dan door het Rijk worden bekostigd, verlenen
      burgemeester en wethouders alsnog een voorschot aan het bevoegd gezag van de niet door de gemeente in stand
      gehouden basisscholen onderscheidenlijk speciale scholen voor basisonderwijs in de gemeente. Bij de bepaling van de
      hoogte van het voorschot is de tweede volzin van het tweede lid van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel144
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel143
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '144'
        hoofdstuk: I
        paragraaf: '5'
        afdeling: '8'
  - number: '144.1'
    text: |-
      Indien een gemeente een of meer scholen in stand houdt, stelt de gemeenteraad onderscheiden al naar gelang het
      basisscholen of speciale scholen voor basisonderwijs betreft, jaarlijks voorlopig vast:
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel144
  - number: 144.1.a
    text: |-
      het totaal van de bedragen die in het voorafgaande kalenderjaar zijn uitgegeven ten behoeve van de
      personeelskosten,
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel144
  - number: 144.1.b
    text: |-
      het totaal van de bedragen die in het voorafgaande kalenderjaar zijn uitgegeven ten behoeve van personeels- en
      arbeidsmarktbeleid als bedoeld in [artikel 129][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel129
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel144
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '129'
        hoofdstuk: I
        afdeling: '6'
  - number: 144.1.c
    text: |-
      het totaal van de bedragen die in het voorafgaande kalenderjaar zijn uitgegeven ten behoeve van de materiële
      instandhouding,
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel144
  - number: 144.1.d
    text: |-
      het totaal van de ontvangsten, bedoeld in de [artikelen 116][ref1] en [137][ref2], in het voorafgaande
      kalenderjaar,


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel116
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel137
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel144
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '116'
        hoofdstuk: I
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '137'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: '8'
  - number: 144.1.e
    text: |-
      het totaal van de ontvangsten dat is gebaseerd op de bedragen die krachtens [artikel 129, tweede lid][ref1], ten
      behoeve van personeels- en arbeidsmarktbeleid voor het kalenderjaar zijn vastgesteld,


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel129
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel144
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '129'
        hoofdstuk: I
        afdeling: '6'
  - number: 144.1.f
    text: |-
      het totaal van de ontvangsten dat is gebaseerd op de bedragen die krachtens [artikel 113][ref1] voor de
      voorzieningen voor de materiële instandhouding voor dat kalenderjaar zijn vastgesteld,


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel113
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel144
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '113'
        hoofdstuk: I
        afdeling: '4'
  - number: 144.1.g
    text: |-
      het totaal van de aanvullende ontvangsten waaronder worden verstaan de bedragen die krachtens [artikel 135][ref1]
      voor de voorzieningen ten behoeve van de materiële instandhouding voor dat kalenderjaar zijn vastgesteld,


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel135
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel144
    references:
