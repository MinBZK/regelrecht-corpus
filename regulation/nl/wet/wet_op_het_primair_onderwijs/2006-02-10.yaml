  - number: '148.1'
    text: |-
      Het bevoegd gezag kan met inachtneming van het zorgplan het totaal van de in de [artikelen 129][ref1], [134][ref2]
      en [137][ref3] bedoelde bedragen voor de kosten voor de materiële instandhouding en de personeelskosten aanwenden
      voor kosten voor materiële instandhouding, personeelskosten van de school of personeelskosten in verband met
      benoeming of tewerkstelling zonder benoeming van personeel, bedoeld in [artikel 29, vijfde lid][ref4], dan wel mede
      voor die kosten van een van de andere scholen van dat bevoegd gezag.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel129
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel134
      [ref3]: https://wetten.overheid.nl/BWBR0003420#Artikel137
