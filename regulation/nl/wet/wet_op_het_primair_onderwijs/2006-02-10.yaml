        afdeling: '5'
      - id: ref6
        bwb_id: BWBR0003420
        artikel: '125'
        hoofdstuk: I
        afdeling: '5'
  - number: 144.4a
    text: |-
      Bij het vaststellen van de bedragen bedoeld in het eerste lid, onder c, mogen voorzieningen die volgens de
      desbetreffende rijksbekostiging een afschrijvingstermijn van ten minste 20 jaar hebben, over ten hoogste 20 jaar
      worden aangemerkt als jaarlijkse uitgaven op grond van rente op basis van een fictieve lening met een looptijd van
      ten hoogste 20 jaar en een lineaire aflossing.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel144
  - number: '144.5'
    text: |-
      Indien de gemeente een deel van de bekostiging voor uitgaven voor personeel en kosten voor materiële instandhouding
      overdraagt aan een ander bevoegd gezag, wordt dat deel aangemerkt als een uitgave als bedoeld in het eerste lid,
      onderdeel a, of onderdeel c. Indien door een ander bevoegd gezag een deel van de bekostiging voor personeelskosten
      en kosten voor materiële instandhouding aan de gemeente wordt overgedragen, wordt dat deel aangemerkt als een
      ontvangst als bedoeld in het eerste lid, onderdeel d, of onderdeel f.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel144
  - number: '144.6'
    text: |-
      Om de vijf jaar stelt de gemeenteraad voorlopig vast het totaal van de vastgestelde uitgaven en ontvangsten in de
      voorafgaande vijf kalenderjaren, zoals in het eerste tot en met vijfde lid is aangegeven. Indien de uitgaven hoger
      zijn dan de ontvangsten, bepaalt de gemeenteraad tevens het bedrag van de overschrijding. Indien een gemeente vanaf
      een tijdstip binnen een periode van vijf jaar als bedoeld in de eerste volzin geen school in stand houdt, stelt
      de gemeenteraad in afwijking van die volzin zo spoedig mogelijk na dat tijdstip voorlopig vast het totaal van de
      vastgestelde uitgaven en ontvangsten in het aan dat tijdstip voorafgaande deel van de periode van vijf jaar, zoals
      in het eerste tot en met vijfde lid is aangegeven.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel144
  - number: '144.7'
    text: |-
      Na sluiting van de rekening van de gemeente stelt de gemeenteraad de in het eerste en zesde lid bedoelde bedragen,
      zo nodig gewijzigd, vast. In het geval, bedoeld in het zesde lid, tweede volzin, drukt de gemeenteraad vervolgens
      het bedrag van de overschrijding uit in een percentage van het totaal van de ontvangsten, bedoeld in het eerste lid
      onder d tot en met g en i. Het percentage wordt afgerond tot twee decimalen. Afronding naar beneden vindt plaats
      indien de derde decimaal kleiner is dan 5, en naar boven indien deze decimaal ten minste 5 bedraagt.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel144
  - number: '145.1'
    text: |-
      In het jaar volgend op de definitieve vaststelling, bedoeld in [artikel 144, zevende lid][ref1], wordt het
      overschrijdingsbedrag vastgesteld waarop het bevoegd gezag van een niet door de gemeente in stand gehouden school,
      die gedurende een of meer jaren van het desbetreffende tijdvak in de gemeente was gevestigd, aanspraak heeft.
      Dit overschrijdingsbedrag wordt vastgesteld door het percentage, bedoeld in [artikel 144, zevende lid][ref2], te
      vermenigvuldigen met het totaal van de ontvangsten van een niet door de gemeente in stand gehouden school dat is
      gebaseerd op de bedragen die krachtens de [artikelen 113][ref3] en [137][ref4] voor het desbetreffende tijdvak zijn
      vastgesteld, met dien verstande dat bij het vaststellen van het totaal van de ontvangsten, bedoeld in voorgaande
      volzin, buiten beschouwing blijven de ontvangsten op grond van de programma's van eisen voor administratie,
      beheer en bestuur, bedoeld in [artikel 114, onder e][ref5], voor de materiële instandhouding van het onderwijs in
      lichamelijke oefening en in verband met de toepassing van [artikel 166, eerste lid][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel144
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel144
      [ref3]: https://wetten.overheid.nl/BWBR0003420#Artikel113
      [ref4]: https://wetten.overheid.nl/BWBR0003420#Artikel137
      [ref5]: https://wetten.overheid.nl/BWBR0003420#Artikel114
      [ref6]: https://wetten.overheid.nl/BWBR0003420#Artikel166
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel145
