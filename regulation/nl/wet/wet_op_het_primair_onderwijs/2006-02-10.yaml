  - number: '157.3'
    text: |-
      Behoudens het bepaalde in het vierde lid zijn het eerste en tweede lid van overeenkomstige toepassing indien een
      bevoegd gezag met ten minste 1 ander bevoegd gezag een samenwerkingsovereenkomst heeft gesloten, waarbij voldaan
      wordt aan de volgende voorwaarden:
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel157
  - number: 157.3.a
    text: |-
      alle scholen van elk bevoegd gezag dat aan de overeenkomst deelneemt, bevinden zich in een gebied van aan elkaar
      grenzende gemeenten, dan wel delen van gemeenten als bedoeld in [artikel 155][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel155
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel157
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '155'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '9'
  - number: 157.3.b
    text: |-
      de overeenkomst is langer dan 1 jaar voor het niet meer voldoen van een der scholen aan de voor die school geldende
      opheffingsnorm gesloten en is aangegaan voor een termijn van ten minste 10 jaren en
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel157
  - number: 157.3.c
    text: |-
      in de overeenkomst is in elk geval opgenomen de verplichting voor elk bevoegd gezag om geen personeel te benoemen
      met voorbijgaan van personeel van een der scholen waarvan het bevoegd gezag aan de overeenkomst deelneemt en dat
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel157
  - number: 157.3.c.1°
    text: |-
      werkzaam is met gebruikmaking van bekostiging, die is toegekend op grond van [artikel 123, tweede lid][ref1],
      wegens samenvoeging van scholen,


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel123
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel157
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '123'
        hoofdstuk: I
        afdeling: '5'
  - number: 157.3.c.2°
    text: |-
      voor zover zich geen geval voordoet als bedoeld onder 1° gebruik maakt van een krachtens
      [artikel 33, tweede lid][ref1], vastgestelde regeling voor onvrijwillige taakvermindering, dan wel


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel33
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel157
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '33'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: '1'
  - number: 157.3.c.3°
    text: |-
      voor zover zich geen geval voordoet als bedoeld onder 1° en 2° in het genot is van wachtgeld of van een andere
      ontslaguitkering en direct aan die ontslaguitkering voorafgaand langer dan een jaar onafgebroken in dienst is
      geweest van het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel157
  - number: '157.4'
    text: |-
      Met toepassing van het derde lid juncto het tweede lid kan in afwijking van
      [artikel 153, eerste tot en met derde lid][ref1], de bekostiging van een bijzondere school slechts worden
      voortgezet of een openbare school slechts in stand worden gehouden, indien zich binnen een straal van 2,5 km van de
      desbetreffende school geen andere school van dezelfde richting, dan wel, indien het openbaar onderwijs betreft geen
      andere school met openbaar onderwijs bevindt.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel153
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel157
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '153'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '9'
  - number: '157.5'
    text: |-
      De samenwerkingsovereenkomst, bedoeld in het derde lid, kan bepalen dat geen verplichting als bedoeld in het derde
      lid onder c 3° bestaat in gevallen, genoemd in de ministeriële regeling bedoeld in [artikel 138, zesde li][ref1]d,
      en in gevallen waarin Onze minister op grond van [artikel 138, zevende lid][ref2], heeft besloten dat de
      vermindering van de bekostiging, bedoeld in [artikel 138, eerste lid en tweede lid onder a][ref3], niet zal
      plaatsvinden.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel138
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel138
      [ref3]: https://wetten.overheid.nl/BWBR0003420#Artikel138
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel157
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '138'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: '8'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '138'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: '8'
      - id: ref3
        bwb_id: BWBR0003420
        artikel: '138'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: '8'
  - number: '157.6'
    text: |-
      Indien de samenwerkingsovereenkomst, bedoeld in het derde lid, voor afloop van de termijn bedoeld in het derde
      lid onder b door een bevoegd gezag wordt beëindigd, wordt de bekostiging van een bijzondere school die op
      grond van de samenwerkingsovereenkomst in afwijking van [artikel 153, eerste tot en met derde lid][ref1], werd
      bekostigd, beëindigd, dan wel een openbare school die op grond van de samenwerkingsovereenkomst in afwijking
      van [artikel 153, eerste tot en met derde lid][ref2], in stand werd gehouden, opgeheven overeenkomstig
      [artikel 153][ref3] met dien verstande dat de bekostiging niet wordt beëindigd onderscheidenlijk de school niet
      wordt opgeheven voor 1 augustus volgend op de beëindiging van de samenwerkingsovereenkomst. Bij een beëindiging van
      de samenwerkingsovereenkomst voor afloop van de termijn bedoeld in het derde lid onder b, wordt op de bekostiging
      van het Rijk voor de school of scholen van elk bevoegd gezag dat aan de samenwerkingsovereenkomst deelnam een
      bedrag ingehouden, waarvan de hoogte door middel van een bij algemene maatregel van bestuur vast te stellen
      regeling wordt bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel153
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel153
      [ref3]: https://wetten.overheid.nl/BWBR0003420#Artikel153
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel157
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '153'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '9'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '153'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '9'
      - id: ref3
        bwb_id: BWBR0003420
        artikel: '153'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '9'
  - number: '157.7'
    text: |-
      Een bevoegd gezag kan slechts deelnemen aan 1 samenwerkingsovereenkomst als bedoeld in het derde lid. Bij deelname
      aan meer dan 1 samenwerkingsovereenkomst als bedoeld in het derde lid, is voor de toepassing van dit artikel
      uitsluitend de eerst gesloten samenwerkingsovereenkomst van belang.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel157
  - number: '158.1'
    text: |-
      De bekostiging van een bijzondere nevenvestiging wordt beëindigd of een openbare nevenvestiging wordt opgeheven
      indien de nevenvestiging gedurende 3 achtereenvolgende schooljaren op de teldatum 1 oktober niet heeft voldaan of
      geacht wordt niet te hebben voldaan aan een van de volgende voorwaarden:
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel158
  - number: 158.1.a
    text: |-
      het aantal leerlingen van de nevenvestiging bedraagt ten minste 23 en binnen een straal van 2 km bevindt zich geen
      school,
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel158
  - number: 158.1.b
    text: |-
      het aantal leerlingen van de nevenvestiging bedraagt ten minste 50 en binnen een straal van 3 km bevindt zich geen
      school waar onderwijs wordt gegeven van dezelfde richting of richtingen onderscheidenlijk waar openbaar onderwijs
      wordt gegeven,
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel158
  - number: 158.1.c
    text: |-
      het aantal leerlingen van de nevenvestiging bedraagt ten minste 23 en binnen een straal van 5 km bevindt zich geen
      school waar onderwijs wordt gegeven van dezelfde richting of richtingen onderscheidenlijk waar openbaar onderwijs
      wordt gegeven,
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel158
  - number: 158.1.d
    text: |-
      binnen 10 km van de openbare nevenvestiging over de weg gemeten, is geen andere school aanwezig waarbinnen openbaar
      onderwijs wordt gegeven, of
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel158
  - number: 158.1.e
    text: |-
      bij het gelijkstellen van de nevenvestiging met een zelfstandige school zou deze met toepassing van
      [artikel 157][ref1] en onder vervanging van het getal 290 in dat artikel door 260, voor bekostiging in aanmerking
      komen.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel157
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel158
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '157'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '9'
  - number: '158.2'
    text: |-
      De beëindiging van de bekostiging van een bijzondere nevenvestiging of de opheffing van een openbare nevenvestiging
      geschiedt met ingang van 1 augustus volgend op de 3 achtereenvolgende schooljaren, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel158
  - number: '158.3'
    text: |-
      Indien het bevoegd gezag van oordeel is dat op de teldatum 1 oktober wordt voldaan aan een van de voorwaarden
      genoemd in het eerste lid en het de nevenvestiging in het op die datum volgende schooljaar wil handhaven, deelt
      het dit voor 1 februari voorafgaand aan dat schooljaar onder de gemotiveerde vermelding van de voorwaarde die
      het betreft schriftelijk mede aan Onze minister. Indien deze mededeling niet tijdig wordt gedaan, wordt de
      nevenvestiging geacht gedurende het desbetreffende schooljaar niet aan een van de voorwaarden genoemd in het eerste
      lid te voldoen, tenzij het eerste lid, onder d, van toepassing is.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel158
  - number: '158.4'
    text: |-
      Onze minister maakt voor 1 mei, volgend op de mededeling, bedoeld in het derde lid, aan het bevoegd gezag van de
      desbetreffende school bekend dat
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel158
  - number: 158.4.a
    text: |-
      de nevenvestiging naar zijn oordeel gedurende 3 achtereenvolgende schooljaren op de teldatum 1 oktober niet
      heeft voldaan of geacht wordt niet te hebben voldaan aan een van de voorwaarden genoemd in het eerste lid zodat
      de bekostiging van de bijzondere nevenvestiging wordt beëindigd of de openbare nevenvestiging dient te worden
      opgeheven,
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel158
  - number: 158.4.b
    text: |-
      de nevenvestiging naar zijn oordeel niet voldoet aan een van de voorwaarden genoemd in het eerste lid maar, gelet
      op het eerste lid, de bekostiging van de bijzondere nevenvestiging wordt voortgezet of de openbare nevenvestiging
      in stand kan worden gehouden, of
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel158
  - number: 158.4.c
    text: |-
      de nevenvestiging naar zijn oordeel voldoet aan een van de voorwaarden genoemd in het eerste lid, zodat de
      bekostiging van de bijzondere nevenvestiging wordt voortgezet of de openbare nevenvestiging in stand kan, dan wel
      dient te worden gehouden.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel158
  - number: '159'
    text: |-
      De gemeenteraad kan besluiten tot vermindering van het aantal openbare scholen en nevenvestigingen. In afwijking
      van de eerste volzin vindt opheffing van een openbare school of nevenvestiging niet plaats in de gevallen bedoeld
      in [artikel 153, vijfde lid][ref1], onderscheidenlijk [artikel 158, eerste lid onder d][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel153
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel158
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel159
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '153'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '9'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '158'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '9'
  - number: '160.1'
    text: |-
      Indien naar het oordeel van Onze minister de bekostiging van een bijzondere school dient te worden beëindigd of
      een openbare school dient te worden opgeheven, maakt Onze minister dit voor 1 januari voorafgaand aan de datum van
      beëindiging van de bekostiging onderscheidenlijk opheffing van de school bekend aan het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel160
  - number: '160.2'
    text: |-
      Indien naar het oordeel van het bevoegd gezag sprake is van een uitzonderingssituatie als bedoeld in
      [artikel 153, vierde of vijfde lid][ref1], dan wel [artikel 157][ref2], deelt het bevoegd gezag dit voor 1 februari
      voorafgaand aan de datum voor de beëindiging van de bekostiging onderscheidenlijk de opheffing schriftelijk mede
      aan Onze minister. Bij algemene maatregel van bestuur wordt bepaald welke gegevens bij deze mededeling worden
      overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel153
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel157
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel160
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '153'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '9'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '157'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '9'
  - number: '160.3'
    text: |-
      Voor zover Onze minister niet reeds heeft bekendgemaakt dat hij de mededeling, bedoeld in het tweede lid, buiten
      behandeling laat wegens het niet verstrekken van de voorgeschreven gegevens, maakt hij voor 1 mei, volgend op de
      mededeling, bedoeld in het tweede lid, aan het bevoegd gezag van de desbetreffende school bekend dat:
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel160
  - number: 160.3.a
    text: |-
      naar zijn oordeel geen sprake is van een van de uitzonderingssituaties, bedoeld in het tweede lid, en dat met
      ingang van 1 augustus van het volgende schooljaar de bekostiging van de bijzondere school wordt beëindigd dan wel
      de openbare school dient te worden opgeheven, of
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel160
  - number: 160.3.b
    text: |-
      met ingang van 1 augustus van het volgende schooljaar de bekostiging van de bijzondere school wordt voortgezet of
      de openbare school in stand dient te worden gehouden.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel160
  - number: '160.4'
    text: |-
      Indien Onze minister niet voor 1 mei, volgend op de mededeling, bedoeld in het tweede lid, een bekendmaking als
      bedoeld in het derde lid heeft gedaan, wordt met ingang van 1 augustus van het volgende schooljaar de bekostiging
      van de bijzondere school voortgezet of dient de openbare school met ingang van laatstgenoemde datum in stand te
      worden gehouden.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel160
  - number: '161.1'
    text: |-
      Het bevoegd gezag zendt voor 15 oktober volgend op de teldatum, bedoeld in [artikel 152][ref1], aan Onze minister
      een opgave van het aantal leerlingen. Indien deze opgave niet voor die datum wordt gedaan, stelt Onze minister het
      aantal leerlingen, indien die gegevens voor de voortzetting of beëindiging van de bekostiging onderscheidenlijk de
      opheffing of instandhouding van een school noodzakelijk zijn, ambtshalve vast. Een opgave van het aantal leerlingen
      op of na 15 oktober aan Onze minister heeft geen invloed op het ambtshalve vastgestelde aantal leerlingen voor
      zover het betreft het al of niet beëindigen van de bekostiging van een bijzondere school of nevenvestiging of de
      opheffing of instandhouding van een openbare school of nevenvestiging.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel152
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel161
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '152'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '9'
  - number: '161.2'
    text: |-
      Onze minister wijst het bevoegd gezag voorafgaand aan de teldatum, bedoeld in [artikel 152][ref1], op de
      verplichting, bedoeld in de eerste volzin van het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel152
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel161
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '152'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '9'
  - number: '162'
    text: |-
      [Artikel 159, eerste volzin][ref1], is van overeenkomstige toepassing op speciale scholen voor basisonderwijs en
      nevenvestigingen daarvan, met dien verstande dat voor opheffing van de laatste speciale school voor basisonderwijs
      van een samenwerkingsverband de in [artikel 18, zevende lid][ref2], bedoelde goedkeuring van Onze minister is
      vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel159
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel18
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel162
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '159'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '9'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '18'
        hoofdstuk: I
        paragraaf: '2'
        afdeling: '1'
  - number: '163.1'
    text: |-
      Indien de bekostiging van een bijzondere school of nevenvestiging wordt beëindigd of het bevoegd gezag tot
      de opheffing van de school of nevenvestiging beslist, dan wel een openbare nevenvestiging ten aanzien waarvan
      [artikel 85, tweede lid][ref1], of [artikel 89, tweede lid][ref2], toepassing heeft gevonden, wordt opgeheven,
      eindigt het recht op het gebouw en terrein en worden alle roerende zaken, behalve die welke het bevoegd gezag
      uit eigen middelen heeft aangeschaft, aan de gemeente op wier grondgebied het gebouw en terrein zijn gelegen,
      overgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel85
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel89
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel163
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '85'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '89'
        hoofdstuk: I
        paragraaf: '2'
        afdeling: '2'
  - number: '163.2'
    text: |-
      [Artikel 110, eerste tot en met vierde lid][ref1], is van overeenkomstige toepassing met dien verstande dat in
      de verklaring ingevolge het eerste lid en het besluit ingevolge het tweede lid als datum waarop het bevoegd gezag
      blijvend heeft opgehouden dan wel blijvend zal ophouden het gebouw of terrein voor de school te gebruiken, zal
      worden genoemd de datum waarop de bekostiging is geëindigd dan wel zal eindigen.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel110
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel163
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '110'
        hoofdstuk: I
        afdeling: '3'
  - number: 163a.1
    text: |-
      Indien de bekostiging van de laatste bijzondere school van een bevoegd gezag wordt beëindigd of het bevoegd gezag
      tot de opheffing van de laatste school beslist, dan wel de laatste openbare school wordt opgeheven, stort het
      bevoegd gezag de niet bestede bekostigingsbedragen terug in de desbetreffende overheidskas.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel163a
  - number: 163a.2
    text: Het exploitatietekort blijft in de gevallen, bedoeld in het eerste lid, voor rekening van het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel163a
  - number: 163a.3
    text: |-
      Bij algemene maatregel van bestuur kunnen voorschriften worden gegeven omtrent de wijze waarop het
      exploitatieoverschot, bedoeld in het eerste lid, wordt berekend.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel163a
  - number: '164.1'
    text: |-
      Indien het bevoegd gezag van een school in strijd handelt met het bepaalde bij of krachtens deze wet, kan Onze
      minister bepalen dat de bekostiging, voorschotten daaronder begrepen, geheel of gedeeltelijk wordt ingehouden dan
      wel opgeschort.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel164
  - number: '164.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing, indien het bevoegd gezag of het personeel van een school in
      strijd handelt met [artikel 5:20 van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel164
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '164.3'
    text: |-
      Onze minister kent de bekostiging wederom toe, indien blijkt dat de reden voor de toepassing van het eerste of
      tweede lid is vervallen.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel164
  - number: 164a.1
    text: |-
      Indien de kwaliteit van het onderwijs ernstig of langdurig tekortschiet, kan Onze minister op verzoek van het
      bevoegd gezag van een school of uit eigen beweging in overeenstemming met het bevoegd gezag maatregelen treffen.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel164a
  - number: 164a.2
    text: |-
      Tot de maatregelen, bedoeld in het eerste lid, behoort de mogelijkheid het bestuur van de instelling te laten
      bijstaan door een extern deskundige. Ook kunnen onder voorwaarden extra financiële middelen aan de instelling ter
      beschikking worden gesteld.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel164a
  - number: 164a.3
    text: |-
      Onze minister stelt nadere regels omtrent de toekenning van en verantwoording voor maatregelen, voorzover deze het
      verstrekken van financiële middelen betreffen.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel164a
  - number: '165.1'
    text: |-
      Bij algemene maatregel van bestuur wordt voor een periode van telkens 4 schooljaren een landelijk beleidskader
      vastgesteld. De algemene maatregel van bestuur, bedoeld in de eerste volzin, wordt aan de beide kamers der Staten-
      Generaal overgelegd. De maatregel treedt niet in werking dan nadat 4 weken na de overlegging zijn verstreken en
      gedurende die termijn niet door of namens een van beide kamers de wens wordt te kennen gegeven dat het in die
      maatregel geregelde onderwerp bij de wet wordt geregeld. Alsdan wordt een daartoe strekkend wetsvoorstel zo spoedig
      mogelijk ingediend. Het bepaalde in de vorige drie volzinnen is niet van toepassing, voorzover het ontwerp van de
      algemene maatregel van bestuur voordien aan beide kamers der Staten-Generaal is overgelegd en door of namens een
      der kamers te kennen is gegeven dat van de procedure, bedoeld in de tweede tot en met vierde volzin, kan worden
      afgeweken.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel165
  - number: '165.2'
    text: |-
      Het landelijk beleidskader vermeldt de landelijke doelstellingen van het beleid inzake
      onderwijsachterstandenbestrijding en verstrekt informatie over de voornemens van de rijksoverheid met betrekking
      tot de landelijke evaluatie van het beleid inzake onderwijsachterstandenbestrijding.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel165
  - number: '166.1'
    text: |-
      De gemeenteraad stelt voor een periode van telkens 4 schooljaren een plan vast, onderwijsachterstandenplan genaamd,
      ter bestrijding van onderwijsachterstanden. Indien het totaal van de voor de bestrijding van onderwijsachterstanden
      bestemde middelen, bedoeld in het vierde lid, onderdelen a en c, jaarlijks minder is dan € 113 500, kan de
      gemeenteraad afzien van de vaststelling van het plan. In dat geval besluit de gemeenteraad op andere wijze omtrent
      de verdeling van de middelen, bedoeld in het vierde lid, onderdelen a en b, waarbij de gemeenteraad het landelijk
      beleidskader in acht neemt.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel166
  - number: '166.2'
    text: |-
      Onder onderwijsachterstanden worden verstaan die negatieve effecten op de leer- en ontwikkelingsmogelijkheden van
      leerlingen, die het gevolg zijn van sociale, economische en culturele omstandigheden.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel166
  - number: '166.3'
    text: 'Het onderwijsachterstandenplan vermeldt in elk geval:'
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel166
  - number: 166.3.a
    text: |-
      de wijze waarop de doelstellingen, genoemd in het landelijk beleidskader, bedoeld in artikel 165, in kwalitatieve
      en kwantitatieve zin worden uitgewerkt,
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel166
  - number: 166.3.b
    text: |-
      de wijze waarop de voor de bestrijding van onderwijsachterstanden bestemde middelen, anders dan de in onderdeel c
      genoemde middelen, worden ingezet, alsmede de scholen en instellingen die de daaruit voortvloeiende activiteiten
      zullen verrichten,
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel166
  - number: 166.3.c
    text: |-
      de wijze waarop de scholen de bekostiging, die is toegekend voor het bestrijden van onderwijsachterstanden met dien
      verstande dat de scholen de zeggenschap hebben over de wijze waarop dit wordt geoperationaliseerd,
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel166
  - number: 166.3.d
    text: |-
      de wijze waarop de scholen verantwoording afleggen over de inzet van de in onderdeel c bedoelde middelen in
      overeenstemming met het plan, en de wijze waarop de scholen en instellingen rekening en verantwoording afleggen
      inzake de besteding van de middelen, bedoeld in het vierde lid, onderdelen a en b,
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel166
  - number: 166.3.e
    text: de procedure met betrekking tot de wijziging van het plan, en
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel166
  - number: 166.3.f
    text: de wijze waarop de gemeenteraad het gemeentelijk onderwijsachterstandenbeleid evalueert.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel166
  - number: '166.4'
    text: |-
      Het onderwijsachterstandenplan vermeldt tevens de omvang van de voor de bestrijding van onderwijsachterstanden
      bestemde middelen, waarbij onderscheid wordt gemaakt tussen:
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel166
  - number: 166.4.a
    text: |-
      de middelen die de gemeente als specifieke uitkering, bedoeld in artikel 168, uit 's Rijks kas ontvangt voor de
      bestrijding van onderwijsachterstanden,
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel166
  - number: 166.4.b
    text: |-
      de middelen, anders dan bedoeld in onderdeel a, die de gemeenteraad bestemt voor de bestrijding van
      onderwijsachterstanden, en
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel166
  - number: 166.4.c
    text: de middelen, bedoeld in het derde lid, onderdeel c, die de scholen ontvangen.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel166
  - number: '166.5'
    text: 'Het onderwijsachterstandenplan heeft betrekking op:'
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel166
  - number: 166.5.a
    text: basisscholen en speciale scholen voor basisonderwijs,
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel166
  - number: 166.5.b
    text: |-
      scholen als bedoeld in de [Wet op de expertisecentra][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel166
    references:
      - id: ref1
        bwb_id: BWBR0003549
  - number: 166.5.c
    text: |-
      scholen als bedoeld in de [Wet op het voortgezet onderwijs][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0002399
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel166
    references:
      - id: ref1
        bwb_id: BWBR0002399
  - number: 166.5.d
    text: andere instellingen.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel166
  - number: '166.6'
    text: |-
      Vaststelling en wijziging van het onderwijsachterstandenplan of het nemen van een besluit omtrent de verdeling
      van middelen indien wordt afgezien van vaststelling van het plan, geschiedt niet dan na op overeenstemming
      gericht overleg met de bevoegde gezagsorganen van alle scholen in de gemeente. De gemeenteraad stelt daartoe bij
      verordening een procedure vast, met dien verstande dat in de verordening in ieder geval wordt bepaald:
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel166
  - number: 166.6.a
    text: |-
      vanaf wanneer en tot welk moment het gemeentebestuur de Onderwijsraad kan verzoeken een advies als bedoeld in het
      tiende lid, uit te brengen,
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel166
  - number: 166.6.b
    text: |-
      dat de termijn voor het uitbrengen van het advies wordt opgeschort met ingang van de dag waarop de Onderwijsraad
      het gemeentebestuur uitnodigt het verzoek voor het uitbrengen van het advies aan te vullen met de gegevens die de
      Onderwijsraad nodig heeft voor een goede vervulling van diens taak, tot de dag waarop het verzoek is aangevuld, en
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel166
  - number: 166.6.c
    text: dat het gemeentebestuur gedurende de termijn voor het uitbrengen van het advies geen besluit neemt.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel166
  - number: '166.7'
    text: |-
      Binnen een jaar na de vaststelling van het landelijk beleidskader, bedoeld in artikel 165, stelt de gemeenteraad
      het onderwijsachterstandenplan vast.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel166
  - number: '166.8'
    text: Het onderwijsachterstandenplan kan tussentijds worden gewijzigd.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel166
  - number: '166.9'
    text: |-
      Indien de vaststelling en wijziging van het onderwijsachterstandenplan of een besluit omtrent de verdeling van
      middelen indien wordt afgezien van vaststelling van het plan, leiden tot kosten van werkloosheidsuitkeringen, komen
      deze kosten ten laste van het Rijk indien het ontstaan van deze kosten in redelijkheid is toe te rekenen aan het
      Rijk.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel166
  - number: '166.10'
    text: |-
      Tijdens het in het zesde lid bedoelde overleg kan de gemeenteraad de Onderwijsraad verzoeken een advies uit
      te brengen over de vaststelling of wijziging van het onderwijsachterstandenplan in relatie tot de vrijheid van
      richting en de vrijheid van inrichting. Het verzoek wordt gedaan indien het bevoegd gezag hierom heeft gevraagd
      dan wel uit eigen beweging. Het verzoek bevat een omschrijving van de onderwerpen waarover advies wordt verwacht.
      Het advies wordt binnen vier weken uitgebracht aan de gemeenteraad. Het advies wordt bekendgemaakt tezamen met
      het plan.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel166
  - number: '166.11'
    text: |-
      Het gemeentebestuur kan een subsidieplafond vaststellen en bepalen hoe het beschikbare bedrag met inachtneming
      daarvan wordt verdeeld.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel166
  - number: '167'
    text: |-
      Voor zover het onderwijsachterstandenplan of een besluit omtrent de verdeling van middelen indien wordt afgezien
      van vaststelling van het plan, daarin voorziet, kunnen activiteiten worden verricht en financiële middelen worden
      ingezet ten behoeve van kinderen die nog niet tot een school kunnen worden toegelaten en die de leeftijd van 2 jaar
      hebben bereikt. De activiteiten zijn gericht op het verbeteren van de voorwaarden voor het met succes instromen in
      het basisonderwijs.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel167
  - number: '168.1'
    text: |-
      Bij algemene maatregel van bestuur worden de criteria vastgesteld op grond waarvan een gemeente voor telkens
      een periode van 4 jaar in aanmerking komt voor een specifieke uitkering ter tegemoetkoming in de kosten voor het
      bestrijden van onderwijsachterstanden, alsmede de criteria voor de hoogte daarvan. De uitkering wordt per jaar
      verstrekt.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel168
  - number: '168.2'
    text: |-
      De gemeente verstrekt de middelen, bedoeld in [artikel 166, vierde lid, onderdelen a en b][ref1], aan de
      rechtspersonen die daarvoor in aanmerking komen.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel166
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel168
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '166'
        hoofdstuk: I
        afdeling: '10'
  - number: '168.3'
    text: |-
      Onze minister kan voor bij ministeriële regeling aan te wijzen gevallen of groepen van gevallen tegemoet komen
      aan onbillijkheden van overwegende aard, welke zich bij de toepassing van het eerste lid van dit artikel mochten
      voordoen.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel168
  - number: '169'
    text: |-
      Onze minister kan de uitkering geheel of gedeeltelijk terugvorderen indien uit de jaarrekening, bedoeld in
      [artikel 197 van de Gemeentewet][ref1], het jaarverslag, bedoeld in [artikel 197 van de Gemeentewet][ref2],
      de accountantsverklaring, bedoeld in [artikel 213, derde lid, van de Gemeentewet][ref3], het
      verslag van bevindingen, bedoeld in [artikel 213, vierde lid, van de Gemeentewet][ref4], dan wel
      uit een afzonderlijke verantwoording, voorzien van een verklaring van een accountant, als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref5], niet blijkt dat de uitkering is besteed in
      overeenstemming met de bepalingen van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel197
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel197
      [ref3]: https://wetten.overheid.nl/BWBR0005416#Artikel213
      [ref4]: https://wetten.overheid.nl/BWBR0005416#Artikel213
      [ref5]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel169
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '197'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '197'
      - id: ref3
        bwb_id: BWBR0005416
        artikel: '213'
      - id: ref4
        bwb_id: BWBR0005416
        artikel: '213'
      - id: ref5
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '170.1'
    text: |-
      Het toezicht op het gemeentelijk onderwijsachterstandenbeleid in de gemeente is opgedragen aan het gemeentebestuur.
      Het toezicht op het gemeentebestuur in verband met de evaluatie van de landelijke doelstellingen van het
      beleid inzake onderwijsachterstandenbestrijding wordt uitgeoefend door bij besluit van Onze minister aangewezen
      personen. Het toezicht op de bevoegde gezagsorganen van de scholen en andere instellingen die betrokken zijn of
      betrokken worden bij de uitvoering van het plan of een besluit omtrent de verdeling van middelen indien wordt
      afgezien van de vaststelling van het plan, wordt in verband met de opstelling van het plan of het in deze volzin
      bedoelde besluit en voor de evaluatie uitgeoefend door bij besluit van de gemeenteraad aangewezen personen. De
      [artikelen 5:12 tot en met 5:17][ref1] en [5:20 van de Algemene wet bestuursrecht][ref2] zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel170
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '170.2'
    text: |-
      Indien het bevoegd gezag van een school naar het oordeel van de gemeenteraad de middelen, bedoeld in
      [artikel 166, vierde lid, onderdelen a en b][ref1], niet besteedt overeenkomstig het onderwijsachterstandenplan,
      kan de gemeenteraad de middelen geheel of gedeeltelijk inhouden.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel166
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel170
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '166'
        hoofdstuk: I
        afdeling: '10'
  - number: '170.3'
    text: |-
      Indien het bevoegd gezag van een school naar het oordeel van de gemeenteraad de middelen, bedoeld in
      [artikel 166, vierde lid, onderdeel c][ref1], niet besteedt overeenkomstig het onderwijsachterstandenplan, maakt de
      gemeenteraad hiervan melding aan Onze minister.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel166
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel170
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '166'
        hoofdstuk: I
        afdeling: '10'
  - number: '170.4'
    text: |-
      Indien het gemeentebestuur naar het oordeel van Onze minister de voorschriften in deze afdeling niet nakomt, kan
      Onze minister de uitkering, bedoeld in [artikel 168][ref1], geheel of gedeeltelijk inhouden.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel168
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel170
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '168'
        hoofdstuk: I
        afdeling: '10'
  - number: '170.5'
    text: |-
      Indien Onze Minister toepassing geeft aan het vierde lid in verband met een besluit van het gemeentebestuur dat
      leidt tot kosten van werkloosheidsuitkeringen en de rechtspersoon, bedoeld in [artikel 184, eerste lid][ref1],
      een verzoek als bedoeld in [artikel 138, derde lid][ref2], met betrekking tot een niet door de gemeente in stand
      gehouden school als gevolg van dat besluit van het gemeentebestuur heeft ingewilligd, vergoedt Onze Minister aan
      deze rechtspersoon de als gevolg van die inwilliging gemaakte kosten van werkloosheidsuitkeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel184
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel138
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel170
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '184'
        hoofdstuk: I
        afdeling: '12'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '138'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: '8'
  - number: '171.1'
    text: |-
      Het bevoegd gezag stelt jaarlijks een jaarverslag over het voorafgaande kalenderjaar vast. Op deze
      jaarverslaggeving is [Boek 2, titel 9, van het Burgerlijk Wetboek][ref1], met uitzondering van de afdelingen 1,
      11 en 12, van overeenkomstige toepassing voor zover bij of krachtens algemene maatregel van bestuur niet anders is
      bepaald. Het jaarverslag bestaat tenminste uit de volgende onderdelen:


      [ref1]: https://wetten.overheid.nl/BWBR0003045
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel171
    references:
      - id: ref1
        bwb_id: BWBR0003045
  - number: 171.1.a
    text: |-
      een bestuursverslag als bedoeld in [artikel 391 van Boek 2 van het Burgerlijk Wetboek][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel391
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel171
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '391'
  - number: 171.1.b
    text: |-
      een jaarrekening als bedoeld in [artikel 361 van Boek 2 van het Burgerlijk Wetboek][ref1], met daarbij ingevolge
      het derde lid vast te stellen bijlagen,


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel361
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel171
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '361'
  - number: 171.1.c
    text: |-
      overige gegevens als bedoeld in [artikel 392 van Boek 2 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel392
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel171
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '392'
  - number: '171.2'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald welke onderdelen het jaarverslag tevens dient te bevatten,
      dan wel welke onderdelen komen te vervallen.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel171
  - number: '171.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan een nadere invulling worden gegeven aan de onderdelen, bedoeld
      in het eerste en tweede lid, en kunnen nadere voorschriften worden gegeven over:
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel171
  - number: 171.3.a
    text: de indeling en de wijze van ordening van de gegevens per onderdeel van het jaarverslag,
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel171
  - number: 171.3.b
    text: de wijze en het tijdstip waarop de desbetreffende onderdelen beschikbaar gesteld worden,
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel171
  - number: 171.3.c
    text: de elektronische verzending van het cijfermatige deel uit de jaarrekening, en
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel171
  - number: 171.3.d
    text: de grondslagen voor de jaarrekening.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel171
  - number: '171.4'
    text: |-
      De beschikbaarstelling van de gegevens, bedoeld in het derde lid, onder b, gaat vergezeld van een verklaring
      omtrent de getrouwheid en rechtmatigheid, afgegeven door een door het bevoegd gezag aangewezen accountant
      als bedoeld in [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1]. Bij de aanwijzing
      van de accountant bedingt het bevoegd gezag dat de controle overeenkomstig een door Onze minister vast te
      stellen controleprotocol plaatsvindt en dat aan Onze minister op diens verzoek inzicht wordt geboden in de
      controlerapporten van de accountant.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel171
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '172.1'
    text: |-
      Het bevoegd gezag draagt er zorg voor dat het ten behoeve van Onze minister beschikt over geordende gegevens die
      van belang zijn voor de berekening van de hoogte van de bekostiging, alsmede over een verklaring over de juistheid
      van de bekostigingsgegevens, afgegeven door een door het bevoegd gezag aangewezen accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel172
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '172.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere voorschriften worden gegeven omtrent de definiëring,
      de wijze van ordening en de beschikbaarstelling van de gegevens, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel172
  - number: '172.3'
    text: |-
      Het bevoegd gezag bewaart de gegevens, bedoeld in het eerste lid, en de desbetreffende boeken en bescheiden
      gedurende een periode van zeven jaren.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel172
  - number: '173.1'
    text: |-
      Het bevoegd gezag draagt er zorg voor dat het beschikt over geordende gegevens ten behoeve van het door Onze
      minister te voeren beleid met betrekking tot het onderwijs, bedoeld in deze wet, en verleent desgevraagd
      medewerking aan door of namens Onze minister uit te voeren onderzoek dat geheel of mede op deze gegevens is
      gebaseerd.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel173
  - number: '173.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere voorschriften worden gegeven omtrent de definiëring,
      de wijze van ordening en de beschikbaarstelling van de gegevens, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel173
  - number: '174'
    text: |-
      De voorschriften, bedoeld in [artikel 171, derde lid][ref1], [artikel 172, tweede lid][ref2], en
      [artikel 173, tweede lid][ref3], hebben geen betrekking op het persoonsgebonden nummer van een leerling of op de
      andere gegevens, bedoeld in [artikel 178a, tweede lid][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel171
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel172
      [ref3]: https://wetten.overheid.nl/BWBR0003420#Artikel173
      [ref4]: https://wetten.overheid.nl/BWBR0003420#Artikel178a
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel174
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '171'
        hoofdstuk: I
        afdeling: '11'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '172'
        hoofdstuk: I
        afdeling: '11'
      - id: ref3
        bwb_id: BWBR0003420
        artikel: '173'
        hoofdstuk: I
        afdeling: '11'
      - id: ref4
        bwb_id: BWBR0003420
        artikel: 178a
        hoofdstuk: I
        afdeling: '12'
  - number: '175.1'
    text: |-
      De accountant die door Onze minister is belast met het onderzoek van de controlerapporten, bedoeld in
      [artikel 171, vierde lid][ref1], en met het onderzoek van de juistheid van de bekostigingsgegevens, bedoeld
      in [artikel 172][ref2], heeft met het oog op het verrichten van dat onderzoek toegang tot de plaats waar de
      desbetreffende boeken en bescheiden worden bewaard. Aan de accountant wordt desgevraagd inzage in de boeken en
      bescheiden gegeven en worden alle inlichtingen verstrekt die deze voor de uitvoering van zijn taak nodig oordeelt.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel171
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel172
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel175
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '171'
        hoofdstuk: I
        afdeling: '11'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '172'
        hoofdstuk: I
        afdeling: '11'
  - number: '175.2'
    text: |-
      Onze minister kan naast het accountantsonderzoek, bedoeld in het eerste lid, een onderzoek instellen of doen
      instellen naar de rechtmatigheid van het beheer op grond van de ter beschikking gestelde controlerapporten,
      bedoeld in [artikel 171, vierde lid][ref1], en de bekostigingsgegevens, bedoeld in [artikel 172][ref2]. Het bevoegd
      gezag verstrekt aan degene die door Onze minister met het onderzoek is belast, alle inlichtingen die deze voor de
      uitvoering van zijn taak nodig oordeelt en geeft desgevraagd inzage in de boeken en bescheiden.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel171
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel172
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel175
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '171'
        hoofdstuk: I
        afdeling: '11'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '172'
        hoofdstuk: I
        afdeling: '11'
  - number: '177.1'
    text: |-
      Onze minister kan bepalen dat geen of slechts een gedeeltelijke bekostiging wordt verstrekt voor uitgaven die het
      gevolg zijn van schuld of nalatigheid van het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel177
  - number: '177.2'
    text: |-
      Indien de uitgaven bedoeld in het eerste lid, voor bekostiging door het Rijk in aanmerking komen, treedt het Rijk
      op het moment van een uitdrukkelijk besluit tot bekostiging in alle rechten die het bevoegd gezag ter zake tegen
      derden mocht hebben.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel177
  - number: '177.3'
    text: |-
      Indien de gemeente een collectieve verzekering heeft afgesloten voor de vergoeding van schade, ontstaan aan
      gebouwen, terreinen of roerende zaken van een niet door de gemeente in stand gehouden school, heeft het bevoegd
      gezag van de desbetreffende school jegens de gemeente geen aanspraak op vergoeding van dergelijke schade, voor
      zover die collectieve verzekering de schade dekt.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel177
  - number: '177.4'
    text: |-
      Indien schade, ontstaan aan gebouwen, terreinen of roerende zaken van een niet door de gemeente in stand gehouden
      school voor vergoeding door de gemeente in aanmerking komt, treedt de gemeente op het moment van een uitdrukkelijk
      besluit tot vergoeding in alle rechten die het bevoegd gezag ter zake van die schade tegen derden mocht hebben.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel177
  - number: 178a.7
    text: |-
      Het bevoegd gezag verstrekt geen persoonsgebonden nummer van een leerling ter uitvoering van
      [artikel 107, tweede en vijfde lid, van de Vreemdelingenwet 2000][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel107
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel178a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '107'
  - number: '179.1'
    text: |-
      Het gemeentebestuur draagt al of niet in samenwerking met een of meer andere gemeentebesturen zorg voor de
      instandhouding van een schoolbegeleidingsdienst.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel179
  - number: '179.2'
    text: |-
      De schoolbegeleidingsdienst gaat uit van een gemeente of een andere rechtspersoon die krachtens de doelstelling en
      gezien de activiteiten niet het maken van winst beoogt.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel179
  - number: '179.3'
    text: |-
      De schoolbegeleidingsdienst heeft tot taak het ten behoeve van elke school en uitgaande van de in elk
      van de scholen aanwezige behoeften op verzoek van het bevoegd gezag van die scholen verrichten van
      begeleidingsactiviteiten, ontwikkelingsactiviteiten, advisering, informatieverstrekking en evaluatie,
      alsmede van activiteiten die dienen tot bevordering van een optimale schoolloopbaan van leerlingen. Onder
      activiteiten die dienen tot bevordering van een optimale schoolloopbaan van leerlingen wordt mede verstaan
      het ondersteunen bij het onderwijs aan leerlingen van basisscholen, speciale scholen voor basisonderwijs,
      scholen voor speciaal onderwijs, voortgezet speciaal onderwijs, speciaal en voortgezet speciaal onderwijs als
      bedoeld in [artikel 2, tweede lid onder a, b, c, f, h, j, k, m of n, van de Wet op de expertisecentra][ref1],
      instellingen voor speciaal en voortgezet speciaal onderwijs als bedoeld in
      [artikel 8, eerste lid tweede volzin, van de Wet op de expertisecentra][ref2], scholen voor voortgezet onderwijs
      en instellingen voor beroepsonderwijs die zijn opgenomen in een ziekenhuis niet zijnde een academisch ziekenhuis of
      die in verband met ziekte thuis verblijven.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel8
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel179
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '8'
  - number: '179.4'
    text: |-
      Het ondersteunen, bedoeld in het derde lid, kan in overeenstemming tussen de schoolbegeleidingsdienst en de school
      waarbij de leerling is ingeschreven, mede het geven van onderwijs aan de leerling betreffen.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel179
  - number: '179.5'
    text: |-
      De schoolbegeleidingsdienst beschikt in ieder geval over deskundigen op de volgende terreinen: onderwijskunde,
      pedagogiek, orthopedagogiek, psychologie, organisatiekunde en informatie- en communicatietechnologie.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel179
  - number: '179.6'
    text: 'De gemeenteraad stelt jaarlijks vast:'
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel179
  - number: 179.6.a
    text: de omvang van de voor schoolbegeleiding bestemde middelen,
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel179
  - number: 179.6.b
    text: |-
      welk deel van de voor schoolbegeleiding bestemde middelen wordt besteed aan door de schoolbegeleidingsdienst te
      verrichten activiteiten die aansluiten bij doelstellingen van lokaal onderwijsbeleid, en
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel179
  - number: 179.6.c
    text: |-
      de criteria waaraan de scholen moeten voldoen om voor door de schoolbegeleidingsdienst te verrichten activiteiten
      als bedoeld in onderdeel b in aanmerking te komen, met dien verstande dat de vaststelling van de onderdelen b en c
      niet geschiedt dan na op overeenstemming gericht overleg met de bevoegde gezagsorganen van alle scholen.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel179
  - number: '179.7'
    text: |-
      De gemeenteraad stelt voor het op overeenstemming gericht overleg bij verordening een procedure vast, met dien
      verstande dat in de verordening in ieder geval wordt bepaald:
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel179
  - number: 179.7.a
    text: |-
      vanaf wanneer en tot welk moment het gemeentebestuur de Onderwijsraad kan verzoeken een advies als bedoeld in het
      achtste lid, uit te brengen,
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel179
  - number: 179.7.b
    text: |-
      dat de termijn voor het uitbrengen van het advies wordt opgeschort met ingang van de dag waarop de Onderwijsraad
      het gemeentebestuur uitnodigt het verzoek voor het uitbrengen van het advies aan te vullen met de gegevens die de
      Onderwijsraad nodig heeft voor een goede vervulling van diens taak, tot de dag waarop het verzoek is aangevuld, en
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel179
  - number: 179.7.c
    text: dat het gemeentebestuur gedurende de termijn voor het uitbrengen van het advies geen besluit neemt.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel179
  - number: '179.8'
    text: |-
      Tijdens het in het zesde lid bedoelde overleg kan de gemeenteraad de Onderwijsraad verzoeken een advies uit te
      brengen over de vaststelling van het bepaalde in het zesde lid, onderdelen b en c, in relatie tot de vrijheid van
      richting en de vrijheid van inrichting. Het verzoek wordt gedaan indien een bevoegd gezag hierom heeft gevraagd
      dan wel uit eigen beweging. Het verzoek bevat een omschrijving van de onderwerpen waarover advies wordt verwacht.
      Het advies wordt binnen vier weken uitgebracht aan de gemeenteraad. Het advies wordt bekend gemaakt tezamen met het
      besluit, bedoeld in het zesde lid.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel179
  - number: '179.9'
    text: |-
      De rechtspersoon, bedoeld in het tweede lid, en het personeel van de schoolbegeleidingsdienst zijn gehouden aan de
      inspectie alle gevraagde inlichtingen te geven omtrent de verrichting van de in het derde, het vierde en het zesde
      lid, onder b, bedoelde activiteiten ten behoeve van de scholen.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel179
  - number: '180.1'
    text: |-
      Scholen kunnen schoolbegeleiding door een landelijke dienst naar richting ontvangen, indien zij op 31 december 1997
      met een dergelijke dienst een schoolbegeleidingsovereenkomst hadden als bedoeld in de bij of krachtens hoofdstuk
      II, titel II, van de Wet op de onderwijsverzorging gegeven voorschriften zoals die op die datum van kracht waren.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel180
  - number: '180.2'
    text: |-
      Onder scholen als bedoeld in het eerste lid, worden mede verstaan scholen die voor het eerst na 31 december 1997
      voor bekostiging in aanmerking komen en die in stand worden gehouden door:
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel180
  - number: 180.2.a
    text: |-
      een bestuur dat een of meer andere scholen in stand houdt ten aanzien waarvan op die dag reeds een
      schoolbegeleidingsovereenkomst bestond met een landelijke dienst naar richting, of
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel180
  - number: 180.2.b
    text: |-
      een in verband met die aan te vangen bekostiging nieuw in het leven geroepen bestuur, indien ten aanzien van die
      scholen het bestuur dat deze scholen in stand houdt, een samenwerkingsovereenkomst heeft gesloten met het bevoegd
      gezag van een andere school die reeds schoolbegeleiding als bedoeld in het eerste lid, dit lid, onderdeel a, en
      [artikel B3 van de Wet van 15 mei 1997](onbekend) (Stb. 252) ontvangt en in de samenwerkingsovereenkomst in elk
      geval is opgenomen dat:
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel180
  - number: 180.2.b.1°
    text: de overeenkomst wordt aangegaan voor een termijn van tenminste 10 jaren, en
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel180
  - number: 180.2.b.2°
    text: |-
      voor elk bevoegd gezag de verplichting is opgenomen om geen personeel te benoemen met voorbijgaan van personeel van
      een der scholen waarvan het bevoegd gezag aan de overeenkomst deelneemt, en dat in het genot is van wachtgeld of
      van een andere ontslaguitkering en direct aan die ontslaguitkering voorafgaand langer dan een jaar onafgebroken in
      dienst is geweest van het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel180
  - number: '180.3'
    text: |-
      Het gemeentebestuur verstrekt ten behoeve van de schoolbegeleiding door de landelijke diensten naar richting,
      bedoeld in het eerste en tweede lid, aan deze diensten subsidie, met dien verstande dat deze wordt vastgesteld op
      ten minste een evenredig deel van de middelen, bedoeld in [artikel 179][ref1], voor zover het betreft de middelen,
      bedoeld in het zesde lid, onderdeel a, verminderd met de middelen, bedoeld in het zesde lid, onderdeel b, van dat
      artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel179
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel180
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '179'
        hoofdstuk: I
        afdeling: '12'
  - number: '181.1'
    text: |-
      Indien een bij of krachtens de wet gestelde termijn door het bevoegd gezag wordt overschreden en de gemeente
      daardoor geen bekostiging van het Rijk dan wel lagere bekostiging of met ingang van een latere datum bekostiging
      van het Rijk voor de materiële instandhouding ontvangt dan het geval zou zijn geweest indien deze termijn wel in
      acht was genomen, vergoedt het bevoegd gezag de door de gemeente geleden schade.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel181
  - number: '181.2'
    text: |-
      Indien een bij of krachtens de wet gestelde termijn door burgemeester en wethouders wordt overschreden en het
      bevoegd gezag daardoor geen bekostiging van het Rijk dan wel lagere bekostiging of met ingang van een latere datum
      bekostiging van het Rijk voor de materiële instandhouding ontvangt dan het geval zou zijn geweest indien deze
      termijn wel in acht was genomen, vergoedt de gemeente de door het bevoegd gezag geleden schade.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel181
  - number: '181.3'
    text: |-
      Burgemeester en wethouders en het bevoegd gezag kunnen in onderling overleg de in het eerste en tweede lid
      bedoelde verplichting tot schadevergoeding matigen. Indien dit overleg niet tot overeenstemming leidt, is
      [artikel 109 van boek 6 van het Burgerlijk Wetboek][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel109
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel181
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '109'
  - number: '182'
    text: |-
      Het bevoegd gezag van een bijzondere school is verplicht de uit de overheidskassen ontvangen gelden overeenkomstig
      de bestemming te gebruiken. Van de inkomsten en uitgaven wordt volgens bij algemene maatregel van bestuur te geven
      voorschriften nauwkeurig boekgehouden.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel182
  - number: '183.1'
    text: |-
      Het bevoegd gezag van een school onderscheidenlijk het bestuur van een centrale dienst voor zover het betreft
      personeel dat is benoemd op bekostiging voor zorgvoorzieningen als bedoeld in [artikel 120, vierde lid][ref1],
      of [artikel 132][ref2] is aangesloten bij een door Onze minister aan te wijzen rechtspersoon met volledige
      rechtsbevoegdheid die zich ten doel stelt waarborgen te bieden voor


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel120
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel132
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel183
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '120'
        hoofdstuk: I
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '132'
        hoofdstuk: I
        afdeling: '7'
  - number: 183.1.a
    text: de kosten voor vervanging bij afwezigheid van personeel, en
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel183
  - number: 183.1.b
    text: |-
      de kosten voortvloeiend uit rechtspositionele verplichtingen ten aanzien van personeel dat gebruik maakt van een
      krachtens [artikel 33, tweede lid][ref1], vastgestelde regeling voor onvrijwillige taakvermindering.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel33
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel183
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '33'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: '1'
  - number: '183.2'
    text: |-
      Het bevoegd gezag van een school onderscheidenlijk het bestuur van een centrale dienst voor zover het betreft
      personeel dat is benoemd op bekostiging voor zorgvoorzieningen als bedoeld in [artikel 120, vierde lid][ref1], of
      [artikel 132][ref2] is voorts verplicht jaarlijks een door de in het eerste lid bedoelde rechtspersoon te bepalen
      bijdrage te voldoen aan die rechtspersoon in verband met de kosten voor vervanging.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel120
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel132
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel183
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '120'
        hoofdstuk: I
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '132'
        hoofdstuk: I
        afdeling: '7'
  - number: '183.3'
    text: |-
      Van de in het eerste juncto tweede lid bedoelde verplichting kan Onze minister op verzoek van het bevoegd gezag
      onderscheidenlijk het bestuur van de centrale dienst ontheffing verlenen op grond van bezwaren van godsdienstige of
      levensbeschouwelijke aard. Onze minister verleent de ontheffing slechts indien het bevoegd gezag onderscheidenlijk
      het bestuur van de centrale dienst aantoont dat een afdoende andere voorziening is getroffen met betrekking tot
      de gevolgen van vervanging bij afwezigheid van personeel en de gevolgen die voortvloeien uit rechtspositionele
      verplichtingen ten aanzien van personeel dat gebruik maakt van een krachtens [artikel 33, tweede lid][ref1],
      vastgestelde regeling voor onvrijwillige taakvermindering. Onze minister besluit binnen zes maanden na ontvangst
      van een verzoek als bedoeld in de eerste volzin. Indien de beschikking niet binnen zes maanden kan worden gegeven,
      stelt Onze minister het bevoegd gezag onderscheidenlijk het bestuur van de centrale dienst daarvan in kennis en
      noemt hij daarbij een termijn waarbinnen de beschikking wel tegemoet kan worden gezien.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel33
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel183
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '33'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: '1'
  - number: '183.4'
    text: De rechtspersoon kan regels vaststellen ter uitvoering van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel183
  - number: '183.5'
    text: |-
      Uit 's Rijks kas wordt jaarlijks een door Onze minister te bepalen bedrag betaald aan de rechtspersoon, bedoeld in
      het eerste lid, in verband met de kosten, bedoeld in dat lid onder b.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel183
  - number: 183a.1
    text: |-
      De rechtspersoon, bedoeld in [artikel 183][ref1], kan het sociaal-fiscaal nummer van het personeelslid dat bij
      afwezigheid wordt vervangen, en van degene die het personeelslid tijdelijk vervangt, uitsluitend in het kader van
      het doel, bedoeld in [artikel 183, eerste lid, onderdeel a][ref2], gebruiken in het verkeer met:


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel183
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel183
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel183a
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '183'
        hoofdstuk: I
        afdeling: '12'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '183'
        hoofdstuk: I
        afdeling: '12'
  - number: 183a.1.a
    text: het personeelslid onderscheidenlijk degene die het personeelslid tijdelijk vervangt,
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel183a
  - number: 183a.1.b
    text: |-
      het bevoegd gezag van de school dan wel het bestuur van de centrale dienst waar de in onderdeel a bedoelde personen
      werkzaam zijn,
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel183a
  - number: 183a.1.c
    text: Onze minister,
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel183a
  - number: 183a.1.d
    text: |-
      de instantie, bedoeld in [artikel 184, vijfde lid][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel184
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel183a
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '184'
        hoofdstuk: I
        afdeling: '12'
  - number: 183a.1.e
    text: |-
      het Uitvoeringsinstituut werknemersverzekeringen, genoemd in
      [hoofdstuk 5 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel183a
    references:
      - id: ref1
        bwb_id: BWBR0013060
        hoofdstuk: '5'
  - number: 183a.2
    text: |-
      Het sociaal-fiscaal nummer wordt op een daartoe strekkend verzoek van de in het eerste lid bedoelde rechtspersoon
      aan die rechtspersoon verstrekt door het bevoegd gezag van de school dan wel het bestuur van de centrale dienst
      waar het personeelslid dat bij afwezigheid wordt vervangen, werkzaam is.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel183a
  - number: 183a.3
    text: |-
      Indien dat ten behoeve van het verslag, bedoeld in [artikel 187, tweede lid][ref1], noodzakelijk is, worden
      gegevens daarin slechts zodanig openbaar gemaakt dat daaraan geen herkenbare gegevens over een afzonderlijk persoon
      kunnen worden ontleend, tenzij het betreft de controle op de juistheid van de gegevens in het kader van de controle
      op de rechtmatigheid en de doelmatigheid van door de rechtspersoon gedane uitgaven. Daarbij kunnen de sociaal-
      fiscale nummers worden vergeleken met de sociaal-fiscale nummers die door andere daartoe bij of krachtens de wet
      bevoegde instanties zijn verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel187
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel183a
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '187'
        hoofdstuk: III
  - number: '184.1'
    text: |-
      Het bevoegd gezag van een school onderscheidenlijk het bestuur van een centrale dienst is aangesloten bij een door
      Onze Minister aan te wijzen rechtspersoon met volledige rechtsbevoegdheid die zich ten doel stelt waarborgen te
      bieden voor de kosten van werkloosheidsuitkeringen, suppleties inzake arbeidsongeschiktheid alsmede uitkeringen
      wegens ziekte en arbeidsongeschiktheid van gewezen personeel anders dan op grond van de [Ziektewet][ref1] ten
      behoeve van gewezen personeel.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel184
    references:
      - id: ref1
        bwb_id: BWBR0001888
  - number: '184.2'
    text: |-
      Het bevoegd gezag onderscheidenlijk het bestuur van de centrale dienst voldoet aan de rechtspersoon jaarlijks een
      door die rechtspersoon vast te stellen bijdrage in verband met de kosten van werkloosheidsuitkeringen, suppleties
      inzake arbeidsongeschiktheid alsmede uitkeringen wegens ziekte en arbeidsongeschiktheid van gewezen personeel
      anders dan op grond van de [Ziektewet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel184
    references:
      - id: ref1
        bwb_id: BWBR0004045
  - number: '184.3'
    text: |-
      Van de in het eerste en tweede lid bedoelde verplichting kan Onze Minister op verzoek van het bevoegd gezag
      onderscheidenlijk het bestuur van de centrale dienst ontheffing verlenen op grond van bezwaren van godsdienstige of
      levensbeschouwelijke aard. Onze Minister verleent de ontheffing slechts, indien het bevoegd gezag onderscheidenlijk
      het bestuur van de centrale dienst aantoont dat een afdoende andere voorziening is getroffen met betrekking tot
      de kosten van werkloosheidsuitkeringen, suppleties inzake arbeidsongeschiktheid alsmede uitkeringen wegens ziekte
      en arbeidsongeschiktheid van gewezen personeel anders dan op grond van de [Ziektewet][ref1]. Onze Minister besluit
      binnen zes maanden na ontvangst van een verzoek. Indien de beschikking niet binnen zes maanden kan worden gegeven,
      stelt Onze Minister de verzoeker daarvan in kennis en noemt hij daarbij een termijn waarbinnen de beschikking wel
      tegemoet kan worden gezien.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel184
    references:
      - id: ref1
        bwb_id: BWBR0004045
  - number: '184.4'
    text: |-
      De rechtspersoon stelt regels vast voor de behandeling, beoordeling en beantwoording van een verzoek van het
      bevoegd gezag onderscheidenlijk het bestuur van de centrale dienst als bedoeld in [artikel 138, derde lid][ref1].
      Indien het bevoegd gezag onderscheidenlijk het bestuur van de centrale dienst zich beroept op overwegingen van
      godsdienstige of levensbeschouwelijke aard, betrekt de rechtspersoon die overwegingen bij de beoordeling van een in
      de eerste volzin bedoeld verzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel138
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel184
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '138'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: '8'
  - number: '184.5'
    text: |-
      Indien de rechtspersoon het in het vierde lid bedoelde verzoek heeft ingewilligd, vergoedt hij aan de instantie
      die de werkloosheidsuitkeringen, de suppleties inzake arbeidsongeschiktheid alsmede de uitkeringen wegens ziekte
      en arbeidsongeschiktheid van gewezen personeel anders dan op grond van de [Ziektewet][ref1] verstrekt of heeft
      verstrekt, de kosten van die uitkeringen of suppleties.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel184
    references:
      - id: ref1
        bwb_id: BWBR0004045
  - number: '184.6'
    text: |-
      Indien een werkloosheidsuitkering, een suppletie inzake arbeidsongeschiktheid alsmede een uitkering wegens
      ziekte en arbeidsongeschiktheid van gewezen personeel anders dan op grond van de [Ziektewet][ref1] van gewezen
      personeel van een school of een centrale dienst voortvloeit uit de inzet of een wijziging van de inzet van de
      in [artikel 120, vierde lid][ref2], en [artikel 132][ref3] bedoelde bekostiging ten opzichte van voorafgaande
      schooljaren, zijn de bevoegde gezagsorganen van alle scholen van het desbetreffende samenwerkingsverband hoofdelijk
      aansprakelijk voor het aan de rechtspersoon vergoeden van de kosten van de werkloosheidsuitkering, de suppletie
      inzake arbeidsongeschiktheid onderscheidenlijk de uitkering wegens ziekte en arbeidsongeschiktheid van gewezen
      personeel anders dan op grond van de [Ziektewet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel120
      [ref3]: https://wetten.overheid.nl/BWBR0003420#Artikel132
      [ref4]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel184
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '120'
        hoofdstuk: I
        afdeling: '5'
      - id: ref3
        bwb_id: BWBR0003420
        artikel: '132'
        hoofdstuk: I
        afdeling: '7'
      - id: ref4
        bwb_id: BWBR0004045
  - number: '184.7'
    text: |-
      Tegen een besluit van de rechtspersoon kan het bevoegd gezag onderscheidenlijk het bestuur van de centrale dienst
      beroep instellen bij de Afdeling bestuursrechtspraak van de Raad van State.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel184
  - number: 184a.1
    text: |-
      De rechtspersoon, bedoeld in [artikel 184][ref1], kan het sociaal-fiscaal nummer van het gewezen personeelslid,
      uitsluitend in het kader van het doel, bedoeld in [artikel 184, eerste lid][ref2], gebruiken in het verkeer met:


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel184
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel184
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel184a
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '184'
        hoofdstuk: I
        afdeling: '12'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '184'
        hoofdstuk: I
        afdeling: '12'
  - number: 184a.1.a
    text: het gewezen personeelslid,
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel184a
  - number: 184a.1.b
    text: |-
      het bevoegd gezag van de school dan wel het bestuur van de centrale dienst waar de in onderdeel a bedoelde persoon
      werkzaam was,
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel184a
  - number: 184a.1.c
    text: Onze minister, of
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel184a
  - number: 184a.1.d
    text: |-
      de instantie, bedoeld in [artikel 184, vijfde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel184
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel184a
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '184'
        hoofdstuk: I
        afdeling: '12'
  - number: 184a.2
    text: |-
      Het sociaal-fiscaal nummer wordt op een daartoe strekkend verzoek van de in het eerste lid bedoelde rechtspersoon
      aan die rechtspersoon verstrekt door het bevoegd gezag van de school dan wel het bestuur van de centrale dienst
      waar het gewezen personeelslid werkzaam was.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel184a
  - number: 184a.3
    text: |-
      Indien dat ten behoeve van het verslag, bedoeld in [artikel 188, eerste lid][ref1], noodzakelijk is, worden
      gegevens daarin slechts zodanig openbaar gemaakt dat daaraan geen herkenbare gegevens over een afzonderlijk persoon
      kunnen worden ontleend, tenzij het betreft de controle op de juistheid van de gegevens in het kader van de controle
      op de rechtmatigheid en de doelmatigheid van door de rechtspersoon gedane uitgaven. Daarbij kunnen de sociaal-
      fiscale nummers worden vergeleken met de sociaal-fiscale nummers die door andere daartoe bij of krachtens de wet
      bevoegde instanties zijn verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel188
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel184a
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '188'
        hoofdstuk: III
  - number: '185.1'
    text: |-
      Bij algemene maatregel van bestuur worden regels gegeven, onderscheidenlijk voorwaarden gesteld, voor de
      bekostiging van scholen voor kinderen van wie de ouders een trekkend bestaan leiden, naar bij die algemene
      maatregel van bestuur aan te geven onderscheidingen.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel185
  - number: '185.2'
    text: |-
      Op de scholen bekostigd krachtens het eerste lid, zijn de bepalingen van [hoofdstuk I, titel I][ref1], van
      toepassing, tenzij bij de algemene maatregel van bestuur anders wordt bepaald. Bij de algemene maatregel van
      bestuur kunnen andere bepalingen van deze wet van overeenkomstige toepassing worden verklaard. Een belanghebbende
      kan beroep instellen bij de Afdeling bestuursrechtspraak van de Raad van State tegen een besluit op grond van
      bepalingen als bedoeld in [artikel 71][ref2], die bij de algemene maatregel van bestuur ingevolge de vorige volzin
      van overeenkomstige toepassing zijn verklaard, dan wel tegen een besluit op grond van bepalingen van de algemene
      maatregel van bestuur die daarmee overeenkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#HoofdstukI
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel71
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel185
    references:
      - id: ref1
        bwb_id: BWBR0003420
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '71'
        hoofdstuk: I
        afdeling: '1'
  - number: '185.3'
    text: |-
      De algemene maatregel van bestuur bedoeld in het eerste lid, wordt aan de Tweede Kamer der Staten-Generaal
      overgelegd. De maatregel treedt niet in werking dan nadat 4 weken na de overlegging zijn verstreken en gedurende
      die termijn niet door of namens de Kamer de wens wordt te kennen gegeven dat het in die maatregel geregelde
      onderwerp bij de wet wordt geregeld. Als dan wordt een daartoe strekkend wetsontwerp zo spoedig mogelijk ingediend.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel185
  - number: '186.1'
    text: |-
      De bewijzen van bekwaamheid tot het geven van het onderwijs bedoeld in [artikel 9, eerste lid][ref1], aan een
      school zijn:


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel9
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel186
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '9'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '1'
  - number: 186.1.a
    text: |-
      het getuigschrift hoger beroepsonderwijs van met goed gevolg afgelegd afsluitend examen in de studierichting die
      voorbereidt op het beroep van leraar basisonderwijs, met dien verstande dat dit getuigschrift voor wat betreft
      het onderwijs in zintuiglijke en lichamelijke oefening een bevoegdheid verleent voor de eerste twee leerjaren van
      het basisonderwijs;
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel186
  - number: 186.1.b
    text: de akte van bekwaamheid als leidster of hoofdleidster bij het kleuteronderwijs;
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel186
  - number: 186.1.c
    text: |-
      de getuigschriften die door Onze minister op grond van artikel 131, vierde lid, van de Kleuteronderwijswet,
      gelijk zijn gesteld met de akte van bekwaamheid als leidster, onderscheidenlijk als hoofdleidster bij het
      kleuteronderwijs;
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel186
  - number: 186.1.d
    text: de akte van bekwaamheid als onderwijzer of hoofdonderwijzer;
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel186
  - number: 186.1.e
    text: de akte van bekwaamheid als volledig bevoegd onderwijzer;
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel186
  - number: 186.1.f
    text: |-
      het diploma van de applicatiecursus volledig bevoegd onderwijzer of dat van de applicatiecursus volledig bevoegd
      onderwijzer voor buitenlandse onderwijsgevenden.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel186
  - number: '186.2'
    text: |-
      Zij die op 31 juli 1985 op grond van artikel 131, vijfde lid, van de Kleuteronderwijswet bevoegd zijn om als
      leidster, onderscheidenlijk hoofdleidster bij het kleuteronderwijs werkzaam te zijn, zijn met ingang van 1 augustus
      1985 bevoegd tot het geven van basisonderwijs. Zij die voor 1 augustus 1985 belast zijn geweest met het onderwijs
      in het vak zingen bedoeld in artikel 2, eerste lid onder h, van de Lager-onderwijswet 1920 (Stb. 1974, 565), zijn
      bevoegd tot het geven van onderwijs in de expressie-activiteit muziek. Zij die op 31 juli 2004 in het bezit zijn
      van het bewijs van bekwaamheid, bedoeld in het eerste lid, onder a, blijven bevoegd tot het geven van onderwijs
      in zintuiglijke en lichamelijke oefening in alle leerjaren. Zij die op 31 juli 2001 een studie volgen die opleidt
      voor het getuigschrift hoger beroepsonderwijs van met goed gevolg afgelegd afsluitend examen in de studierichting
      die voorbereidt op het beroep van leraar basisonderwijs, waarvan het onderwijsprogramma voor lichamelijke
      opvoeding zoals dat werd uitgevoerd voor 1 september 2000 deel uitmaakt, ontlenen aan dit getuigschrift een
      bevoegdheid ten aanzien van het geven van onderwijs in zintuiglijke en lichamelijke oefening in alle leerjaren
      indien zij bedoeld getuigschrift behalen voor 1 september 2005. Zij die tijdelijk zijn benoemd tot leraar op
      grond van [artikel 2 van de Interimwet zij-instroom leraren primair en voortgezet onderwijs][ref1] en die daarna
      het getuigschrift, bedoeld in [artikel 6, derde lid, van die wet][ref2] behalen, ontlenen aan dit getuigschrift
      een bevoegdheid tot het geven van onderwijs in zintuiglijke en lichamelijke oefening in alle leerjaren indien
      noodzakelijk geachte scholing, bedoeld in [artikel 5 van die wet][ref3], voor dat vak werd gevolgd volgens het
      onderwijsprogramma voor lichamelijke opvoeding zoals dat werd uitgevoerd voor 1 september 2000.


      [ref1]: https://wetten.overheid.nl/BWBR0011469#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011469#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0011469#Artikel5
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel186
    references:
      - id: ref1
        bwb_id: BWBR0011469
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0011469
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0011469
        artikel: '5'
  - number: '186.3'
    text: |-
      Zij die op 31 juli 1998 bij een school voor speciaal onderwijs of voor
      speciaal en voortgezet speciaal onderwijs onderwijs geven als bedoeld in
      [artikel 12, eerste lid, van de Interimwet op het speciaal onderwijs en het voortgezet speciaal onderwijs][ref1]
      zoals luidend op die datum en bevoegd zijn op basis van [artikel 111, eerste lid onder f of g, van die wet][ref2],
      zijn bevoegd tot het geven van het onderwijs, bedoeld in [artikel 9, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel111
      [ref3]: https://wetten.overheid.nl/BWBR0003420#Artikel9
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel186
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '12'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '111'
      - id: ref3
        bwb_id: BWBR0003420
        artikel: '9'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '1'
  - number: '186.4'
    text: |-
      De akten genoemd in het eerste lid onder a, b, d en e, en de diploma's genoemd in het eerste lid onder f, moeten
      zijn verkregen aan een van rijkswege bekostigd of aangewezen opleidingsinstituut, dan wel na het afleggen van een
      staatsexamen.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel186
  - number: '186.5'
    text: |-
      Bij algemene maatregel van bestuur wordt bepaald welke bewijzen van bekwaamheid naast die, genoemd in het eerste
      lid, dan wel welke studies voor een bewijs van bekwaamheid in combinatie met een bepaald bewijs van bekwaamheid,
      genoemd in het eerste lid, een bevoegdheid verlenen onderscheidenlijk een tijdelijke bevoegdheid verlenen tot het
      geven van onderwijs in een of meer van de in [artikel 9, eerste lid][ref1], genoemde onderwijsactiviteiten en wordt
      tevens bepaald welke bewijzen van bekwaamheid bevoegdheid verlenen tot het geven van onderwijs in de Friese taal.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel9
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel186
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '9'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '1'
  - number: '187.1'
    text: |-
      Onze minister is ten aanzien van de rechtspersoon, bedoeld in [artikel 183][ref1], bevoegd tot:


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel183
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel187
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '183'
        hoofdstuk: I
        afdeling: '12'
  - number: 187.1.a
    text: instemming met de statuten van de rechtspersoon, alsmede van wijziging van de statuten;
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel187
  - number: 187.1.b
    text: |-
      instemming met de bijdrage, bedoeld in [artikel 183, tweede lid][ref1], voor zover die betrekking heeft op de
      kosten van vervanging van personeel wegens voorschriften die zijn gegeven bij algemene maatregel van bestuur of bij
      ministeriële regeling;


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel183
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel187
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '183'
        hoofdstuk: I
        afdeling: '12'
  - number: 187.1.c
    text: |-
      het geven van algemene aanwijzingen aan de rechtspersoon in verband met de minimaal door de rechtspersoon te geven
      waarborgen, bedoeld in [artikel 183, eerste lid][ref1], zulks in verband met de goede voortgang van het onderwijs;


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel183
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel187
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '183'
        hoofdstuk: I
        afdeling: '12'
  - number: 187.1.d
    text: |-
      het geven van algemene aanwijzingen aan de rechtspersoon met het oog op de afstemming van activiteiten van de
      rechtspersoon op het algemene beleid inzake preventie van ziekteverzuim en arbeidsongeschiktheid;
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel187
  - number: 187.1.e
    text: |-
      het geven van algemene aanwijzingen aan de rechtspersoon om de nakoming te verzekeren van verplichtingen die bij
      deze wet aan de rechtspersoon zijn opgedragen;
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel187
  - number: 187.1.f
    text: |-
      het geven van algemene aanwijzingen aan de rechtspersoon om de door Onze minister gewenste inlichtingen te
      verkrijgen;
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel187
  - number: 187.1.g
    text: |-
      het geven van algemene aanwijzingen aan de rechtspersoon in gevallen dat het algemeen belang dit in belangrijke
      mate vereist;
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel187
  - number: 187.1.h
    text: intrekking van de aanwijzing van de rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel187
  - number: '187.2'
    text: |-
      De rechtspersoon brengt jaarlijks voor 1 april aan Onze minister over het afgelopen jaar verslag uit over zijn
      werkzaamheden, voortvloeiend uit [artikel 183][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel183
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel187
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '183'
        hoofdstuk: I
        afdeling: '12'
  - number: '187.3'
    text: |-
      Onze minister zendt het verslag, bedoeld in het tweede lid, vergezeld van zijn advies daarover, voor 1 mei volgend
      op de datum, bedoeld in het tweede lid, aan de Tweede Kamer der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel187
  - number: '187.4'
    text: |-
      Bij algemene maatregel van bestuur worden nadere voorschriften gegeven omtrent de uitoefening van de in het eerste
      lid bedoelde bevoegdheden en omtrent de gevolgen van intrekking van de aanwijzing van de rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel187
  - number: '187.5'
    text: |-
      Krachtens bij algemene maatregel van bestuur vast te stellen voorschriften kan Onze minister subsidie verlenen aan
      de rechtspersoon ten behoeve van:
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel187
  - number: 187.5.a
    text: |-
      bedragen die, gedurende een vooraf vastgestelde periode en tot een vooraf vastgestelde maximale
      hoogte, strekken ter vervanging van de vergoeding ten behoeve van de kosten voor vervanging, bedoeld in
      [artikel 126, eerste lid][ref1], en de bijdrage, bedoeld in [artikel 183, tweede lid][ref2], voor zover die
      betrekking heeft op de kosten van vervanging van personeel wegens voorschriften gegeven bij algemene maatregel van
      bestuur of bij ministeriële regeling,


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel126
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel183
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel187
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '126'
        hoofdstuk: I
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '183'
        hoofdstuk: I
        afdeling: '12'
  - number: 187.5.b
    text: een bijdrage aan de kosten van de bedrijfsvoering van de rechtspersoon, en
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel187
  - number: 187.5.c
    text: een bijdrage ten behoeve van de uitoefening van landelijke taken in het kader van de bedrijfsgezondheidszorg.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel187
  - number: '187.6'
    text: |-
      Bij de algemene maatregel van bestuur, bedoeld in het vijfde lid, kan ten behoeve van een in dat lid bedoelde
      subsidie een subsidieplafond worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel187
  - number: '187.7'
    text: |-
      De rechtspersoon kan ten behoeve van de uitoefening van landelijke taken in het kader van de
      bedrijfsgezondheidszorg subsidie aan derden verstrekken.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel187
  - number: '187.8'
    text: |-
      Het toezicht op de rechtspersoon is opgedragen aan Onze minister. Met het toezicht zijn belast de bij besluit
      van Onze minister aangewezen ambtenaren. Een besluit als bedoeld in de tweede volzin wordt bekendgemaakt in de
      Staatscourant.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel187
  - number: '187.9'
    text: |-
      De algemene maatregel van bestuur, bedoeld in het vierde en vijfde lid, wordt aan de Tweede Kamer der Staten-
      Generaal overgelegd. De maatregel treedt niet in werking dan nadat 4 weken na de overlegging zijn verstreken
      en gedurende die termijn niet door of namens de Kamer de wens te kennen wordt gegeven dat het in die maatregel
      geregelde onderwerp bij de wet wordt geregeld. Alsdan wordt een daartoe strekkend wetsvoorstel zo spoedig mogelijk
      ingediend.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel187
  - number: '188.1'
    text: |-
      [Artikel 187][ref1] is van overeenkomstige toepassing ten aanzien van de rechtspersoon, bedoeld in
      [artikel 184][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel187
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel184
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel188
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '187'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '184'
        hoofdstuk: I
        afdeling: '12'
  - number: '188.2'
    text: |-
      Onze Minister zendt binnen vijf jaar na de aanwijzing van de rechtspersoon, bedoeld in [artikel 184][ref1], en
      vervolgens telkens na vijf jaar, aan de Tweede Kamer der Staten-Generaal een verslag over de doeltreffendheid en de
      effecten van de werkzaamheden van die rechtspersoon.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel184
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel188
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '184'
        hoofdstuk: I
        afdeling: '12'
  - number: '189'
    text: Deze wet wordt aangehaald als «Wet op het primair onderwijs».
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel189
