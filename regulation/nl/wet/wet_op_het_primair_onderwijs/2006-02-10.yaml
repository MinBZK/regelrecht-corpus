  - number: '156.4'
    text: |-
      De ingevolge het eerste en tweede lid vastgestelde opheffingsnormen treden in de plaats van de
      op grond van [artikel 153, tweede lid][ref1], en [artikel 155][ref2] bepaalde opheffingsnormen
      en treden in werking met ingang van 1 januari volgend op de datum van herindeling, bedoeld in
      [artikel 1, onderdeel f, van de Wet algemene regels herindeling][ref3]. Tot en met 31 december volgend op de datum
      van herindeling blijven op de scholen in de gemeenten die bij de wijziging van de gemeentelijke indeling of de
      grenscorrectie zijn betrokken, de opheffingsnormen van toepassing die golden op de dag voorafgaande aan de datum
      van herindeling.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel153
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel155
      [ref3]: https://wetten.overheid.nl/BWBR0003718#Artikel1
