  - number: '155.3'
    text: |-
      Indien niet elk bevoegd gezag een schriftelijke verklaring als bedoeld in het eerste lid eerste volzin wenst te
      verstrekken, kan de gemeenteraad Onze minister verzoeken een besluit tot splitsing als bedoeld in het eerste lid
      te nemen. Het besluit tot het doen van een zodanig verzoek wordt genomen uiterlijk 2 jaar voor het verstrijken van
      de periode tot en met 31 juli 1998, of een 5-jaarlijkse periode als bedoeld in [artikel 153, tweede lid][ref1].
      Met betrekking tot het verzoek is het tweede lid eerste volzin van overeenkomstige toepassing, met dien verstande
      dat burgemeester en wethouders eveneens de ontvangen instemmende verklaringen overleggen, alsmede een opgave van
      de scholen waarvan het bevoegd gezag geen instemmende verklaring wenste te verstrekken. Indien Onze minister tot
      splitsing van de gemeente besluit, wordt dit besluit genomen uiterlijk 1 jaar voor het verstrijken van de periode
      tot en met 31 juli 1998, of de 5-jaarlijkse periode waarin het verzoek werd gedaan en zijn op dit besluit de tweede
      tot en met vierde volzin van het tweede lid van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel153
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel155
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '153'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '9'
  - number: '155.4'
    text: |-
      Van een besluit van de gemeenteraad inhoudende een weigering om tot splitsing van de gemeente, als bedoeld in het
      eerste lid, over te gaan en van een besluit van de gemeenteraad, inhoudende een weigering om een verzoek tot een
      zodanige splitsing bij Onze minister in te dienen, kan iedere natuurlijke persoon of rechtspersoon die daardoor
      rechtstreeks in zijn belang is getroffen, bij de Kroon in beroep komen. Met een weigering om tot splitsing van de
      gemeente over te gaan, wordt gelijk gesteld het niet nemen van een besluit met betrekking tot splitsing binnen 6
      maanden na verzending van de laatste instemmende verklaring van de bevoegde gezagsorganen, bedoeld in het eerste
      lid. Met een weigering om een verzoek tot splitsing bij Onze minister in te dienen, wordt gelijkgesteld het niet
      nemen van een besluit binnen 6 maanden na verzending van een verzoek daartoe aan de gemeenteraad door een bevoegd
      gezag dat een of meer scholen in de gemeente in stand houdt. Het beroep wordt ingesteld binnen 30 dagen nadat het
      besluit openbaar is gemaakt of ter kennis is gebracht van degene jegens wie het besluit is genomen dan wel binnen
      30 dagen na het verstrijken van de termijn van 6 maanden bedoeld in de tweede of derde volzin.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel155
  - number: '155.5'
    text: |-
      Op grond van bijzondere omstandigheden die voortvloeien uit de ruimtelijke ordening en die op het moment dat
      het besluit tot splitsing als bedoeld in het eerste of derde lid werd genomen niet voorzienbaar waren, kan
      de gemeenteraad binnen de in het eerste lid bedoelde termijn van 20 jaar een besluit nemen tot wijziging of
      beëindiging van de splitsing. Het eerste tot en met het vierde lid zijn van overeenkomstige toepassing. Een besluit
      van de gemeenteraad tot wijziging of beëindiging van de splitsing behoeft de goedkeuring van Onze minister.
    url: https://wetten.overheid.nl/BWBR0003420/2006-02-10#Artikel155
  - number: '156.1'
    text: |-
      In het geval van een wijziging van de gemeentelijke indeling of een grenscorrectie als bedoeld in
      [artikel 283 van de Gemeentewet][ref1], stelt Onze minister op de wijze als aangegeven in [artikel 154][ref2]
      en [artikel 155, tweede lid][ref3], de nieuwe opheffingsnormen voor de betrokken gemeenten onderscheidenlijk
      delen van gemeenten vast, voor zover deze afwijken van de op grond van [artikel 153, tweede lid][ref4], en
      [artikel 155][ref5] bepaalde opheffingsnormen.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel283
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel154
