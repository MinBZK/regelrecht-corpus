  - number: '157.1'
    text: |-
      Indien een bevoegd gezag scholen in stand houdt in uitsluitend 1 gemeente of, ingeval voor die gemeente op grond
      van [artikel 155][ref1] opheffingsnormen zijn vastgesteld, in uitsluitend 1 deel van die gemeente, wordt, in
      afwijking van [artikel 153, eerste tot en met derde lid][ref2], de bekostiging van een bijzondere school niet
      beëindigd en een openbare school niet opgeheven op grond van artikel 153 indien de school ten minste 23 leerlingen
      telt, de gemiddelde schoolgrootte van alle scholen van dat bevoegd gezag ten minste 10/6x de voor die gemeente
      onderscheidenlijk dat deel van de gemeente geldende opheffingsnorm, dan wel ten minste 290 bedraagt en het bevoegd
      gezag tijdig de in [artikel 160, tweede lid][ref3], bedoelde mededeling heeft gedaan. Indien het bevoegd gezag
      dat bij die mededeling aangeeft, tellen bij de toepassing van de gemiddelde schoolgrootte niet mee de door hem
      aangeduide scholen die sinds de aanvang van de bekostiging niet meer dan 8 schooljaren zijn bekostigd en waarvan
      het aantal leerlingen, voor zover het niet betreft het aantal leerlingen van een nevenvestiging, niet heeft voldaan
      aan de stichtingsnorm op grond waarvan de school voor bekostiging in aanmerking werd genomen. De tweede volzin is
      niet van toepassing op scholen als bedoeld in [artikel 84][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel155
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel153
      [ref3]: https://wetten.overheid.nl/BWBR0003420#Artikel160
      [ref4]: https://wetten.overheid.nl/BWBR0003420#Artikel84
