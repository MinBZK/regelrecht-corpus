        paragraaf: '1'
        afdeling: '9'
  - number: '155.3'
    text: |-
      Indien niet elk bevoegd gezag een schriftelijke verklaring als bedoeld in het eerste lid eerste volzin wenst te
      verstrekken, kunnen burgemeester en wethouders Onze Minister verzoeken een besluit tot splitsing als bedoeld in het
      eerste lid te nemen. Met betrekking tot de aanvraag is het tweede lid eerste volzin van overeenkomstige toepassing,
      met dien verstande dat burgemeester en wethouders eveneens de ontvangen instemmende verklaringen overleggen,
      alsmede een opgave van de scholen waarvan het bevoegd gezag geen instemmende verklaring wenste te verstrekken.
      Indien Onze Minister tot splitsing van de gemeente besluit zijn op dit besluit de tweede tot en met vierde volzin
      van het tweede lid van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel155
  - number: '155.4'
    text: |-
      Van een besluit van burgemeester en wethouders inhoudende een weigering om tot splitsing van de gemeente, als
      bedoeld in het eerste lid, over te gaan en van een besluit van burgemeester en wethouders, inhoudende een weigering
      om een aanvraag tot een zodanige splitsing bij Onze Minister in te dienen, kan iedere natuurlijke persoon of
      rechtspersoon die daardoor rechtstreeks in zijn belang is getroffen, bij de Kroon in beroep komen. Met een
      weigering om tot splitsing van de gemeente over te gaan, wordt gelijk gesteld het niet nemen van een besluit met
      betrekking tot splitsing binnen 6 maanden na verzending van de laatste instemmende verklaring van de bevoegde
      gezagsorganen, bedoeld in het eerste lid. Met een weigering om een aanvraag tot splitsing bij Onze Minister in te
      dienen, wordt gelijkgesteld het niet nemen van een besluit binnen 6 maanden na verzending van een aanvraag daartoe
      aan burgemeester en wethouders door een bevoegd gezag dat een of meer scholen in de gemeente in stand houdt. Het
      beroep wordt ingesteld binnen 30 dagen nadat het besluit openbaar is gemaakt of ter kennis is gebracht van degene
      jegens wie het besluit is genomen dan wel binnen 30 dagen na het verstrijken van de termijn van 6 maanden bedoeld
      in de tweede of derde volzin.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel155
  - number: '155.5'
    text: |-
      Op grond van bijzondere omstandigheden die voortvloeien uit de ruimtelijke ordening en die op het moment dat
      het besluit tot splitsing als bedoeld in het eerste of derde lid werd genomen niet voorzienbaar waren, kan
      de gemeenteraad binnen de in het eerste lid bedoelde termijn van 20 jaar een besluit nemen tot wijziging of
      beëindiging van de splitsing. Het eerste tot en met het vierde lid zijn van overeenkomstige toepassing. Een besluit
      van de gemeenteraad tot wijziging of beëindiging van de splitsing behoeft de goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel155
  - number: '156.1'
    text: |-
      In het geval van een wijziging van de gemeentelijke indeling of een grenscorrectie als bedoeld in
      [artikel 3 van de Wet algemene regels herindeling][ref1], stelt Onze Minister op de wijze als aangegeven
      in [artikel 154][ref2] en [artikel 155, tweede lid][ref3], de nieuwe opheffingsnormen voor de betrokken
      gemeenten onderscheidenlijk delen van gemeenten vast, voor zover deze afwijken van de op grond van
      [artikel 153, tweede lid][ref4], en [artikel 155][ref5] bepaalde opheffingsnormen.


      [ref1]: https://wetten.overheid.nl/BWBR0003718#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel154
      [ref3]: https://wetten.overheid.nl/BWBR0003420#Artikel155
      [ref4]: https://wetten.overheid.nl/BWBR0003420#Artikel153
      [ref5]: https://wetten.overheid.nl/BWBR0003420#Artikel155
