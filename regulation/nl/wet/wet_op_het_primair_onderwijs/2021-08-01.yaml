        afdeling: '3'
  - number: 194c.3
    text: |-
      De programma’s huisvestingsvoorzieningen die op grond van [artikel 95 van deze wet][ref1] zijn vastgesteld voor de
      jaren voorafgaand aan de inwerkingtreding van artikel I van de Wet van 7 mei 2014 houdende wijziging van de Wet op
      het primair onderwijs, de Wet op de expertisecentra en de Wet primair onderwijs BES in verband met de overheveling
      van taak en budget voor aanpassingen in onderwijshuisvesting van gemeente naar school (Stb. 175) worden volledig
      uitgevoerd.


