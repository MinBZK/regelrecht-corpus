  - number: 194f.2
    text: |-
      Geschillen die in bezwaar, beroep of hoger beroep aanhangig zijn of binnen de bezwaar- dan wel beroepstermijn dan
      wel verschoonbaar daarbuiten aanhangig worden gemaakt tegen besluiten van Onze Minister die zijn genomen voor de
      inwerkingtreding van deze wet op grond van [artikel 64a][ref1] zoals luidend op de dag voor de inwerkingtreding van
      deze wet, worden behandeld op grond van de regelingen zoals deze gelden de dag voor deze wet in werking treedt. De
      eerste volzin is hangende het bezwaar, beroep of hoger beroep van overeenkomstige toepassing op de bevoegdheid tot
      het intrekken en vervangen van besluiten die tot de aldaar bedoelde geschillen hebben geleid.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel64a
