  - number: '157.3'
    text: |-
      Het eerste en tweede lid zijn van overeenkomstige toepassing indien een bevoegd gezag met ten minste 1 ander
      bevoegd gezag een samenwerkingsovereenkomst heeft gesloten, waarbij voldaan wordt aan de volgende voorwaarden:
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel157
  - number: 157.3.a
    text: |-
      alle scholen van elk bevoegd gezag dat aan de overeenkomst deelneemt, bevinden zich in een gebied van aan elkaar
      grenzende gemeenten, dan wel delen van gemeenten als bedoeld in [artikel 155][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel155
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel157
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '155'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '9'
  - number: 157.3.b
    text: de overeenkomst is aangegaan voor een termijn van ten minste 10 jaren en
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel157
  - number: 157.3.c
    text: |-
      in de overeenkomst is in elk geval opgenomen de verplichting voor elk bevoegd gezag om geen personeel te benoemen
      met voorbijgaan van personeel van een der scholen waarvan het bevoegd gezag aan de overeenkomst deelneemt en dat
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel157
  - number: 157.3.c.1°
    text: |-
      werkzaam is met gebruikmaking van bekostiging, die is toegekend op grond van [artikel 123, tweede lid][ref1],
      wegens samenvoeging van scholen, dan wel


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel123
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel157
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '123'
        hoofdstuk: I
        afdeling: '5'
  - number: 157.3.c.2°
    text: |-
      voor zover zich geen geval voordoet als bedoeld onder 1° in het genot is van wachtgeld of van een andere
      ontslaguitkering en direct aan die ontslaguitkering voorafgaand langer dan een jaar onafgebroken in dienst is
      geweest van het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel157
  - number: '157.4'
    text: |-
      De samenwerkingsovereenkomst, bedoeld in het derde lid, kan bepalen dat geen verplichting als bedoeld in
      het derde lid, onderdeel c, onder 2°, bestaat in gevallen, genoemd in de ministeriële regeling bedoeld in
      [artikel 138, vijfde lid][ref1], en in gevallen waarin Onze Minister op grond van artikel 138, zesde lid, heeft
      besloten dat de vermindering van de bekostiging, bedoeld in artikel 138, eerste lid, niet zal plaatsvinden.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel138
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel157
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '138'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: '8'
  - number: '157.5'
    text: |-
      Indien de samenwerkingsovereenkomst, bedoeld in het derde lid, voor afloop van de termijn bedoeld in het derde lid,
      onder b, door een bevoegd gezag wordt beëindigd, wordt de bekostiging van een bijzondere school die op grond van
      de samenwerkingsovereenkomst in afwijking van [artikel 153, eerste tot en met derde lid][ref1], werd bekostigd,
      beëindigd, dan wel een openbare school die op grond van de samenwerkingsovereenkomst in afwijking van artikel 153,
      eerste tot en met derde lid, in stand werd gehouden, opgeheven overeenkomstig artikel 153 met dien verstande dat
      de bekostiging niet wordt beëindigd onderscheidenlijk de school niet wordt opgeheven voor 1 augustus volgend op de
      beëindiging van de samenwerkingsovereenkomst. Bij een beëindiging van de samenwerkingsovereenkomst voor afloop van
      de termijn, bedoeld in het derde lid, onder b, wordt op de bekostiging van het Rijk voor de school of scholen van
      elk bevoegd gezag dat aan de samenwerkingsovereenkomst deelnam een bedrag ingehouden, waarvan de hoogte door middel
      van een bij algemene maatregel van bestuur vast te stellen regeling wordt bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel153
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel157
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '153'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '9'
  - number: '157.6'
    text: |-
      Een bevoegd gezag kan slechts deelnemen aan 1 samenwerkingsovereenkomst als bedoeld in het derde lid. Bij deelname
      aan meer dan 1 samenwerkingsovereenkomst als bedoeld in het derde lid, is voor de toepassing van dit artikel
      uitsluitend de eerst gesloten samenwerkingsovereenkomst van belang.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel157
  - number: 157a.1
    text: |-
      Het bevoegd gezag van een school die op grond van de gemiddelde schoolgrootte, bedoeld in
      [artikel 157, eerste, tweede of derde lid][ref1], in stand wordt gehouden dan wel wordt bekostigd, en die
      vervolgens op de teldatum 1 oktober minder dan 23 leerlingen telt, kan Onze Minister verzoeken in afwijking van
      [artikel 153, eerste, tweede en derde lid][ref2], die bijzondere school te blijven bekostigen of die openbare
      school in stand te houden voor een door Onze Minister te bepalen termijn. Een besluit tot instandhouding wordt
      in elk geval niet genomen indien het bevoegd gezag tekortschiet in haar zorg voor de kwaliteit van het onderwijs,
      bedoeld in [artikel 10][ref3], of geen perspectief bestaat op structurele toename van het aantal leerlingen van
      de school tot het aantal van ten minste 23 op 1 oktober voorafgaand aan de datum waarop de door Onze Minister
      te bepalen termijn eindigt. Het al dan niet aanwezig zijn van basisscholen in de omgeving van de school kan Onze
      Minister eveneens betrekken bij zijn besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel157
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel153
      [ref3]: https://wetten.overheid.nl/BWBR0003420#Artikel10
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel157a
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '157'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '9'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '153'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '9'
      - id: ref3
        bwb_id: BWBR0003420
        artikel: '10'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '1'
  - number: 157a.2
    text: |-
      Een aanvraag als bedoeld in het eerste lid moet voor 1 februari voorafgaand aan de datum van de beëindiging
      van de bekostiging onderscheidenlijk de opheffing schriftelijk worden ingediend bij Onze Minister. De aanvraag
      gaat vergezeld van gegevens ter onderbouwing van het perspectief, bedoeld in het eerste lid, een beredeneerde
      leerlingprognose en gegevens over de ligging van de school ten opzichte van de dichtstbijzijnde basisscholen.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel157a
  - number: 157a.3
    text: 'Onze Minister besluit voor 1 mei, volgend op de aanvraag, dat:'
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel157a
  - number: 157a.3.a
    text: |-
      met ingang van 1 augustus van het volgende schooljaar de bekostiging van de bijzondere school wordt beëindigd dan
      wel de openbare school wordt opgeheven, of
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel157a
  - number: 157a.3.b
    text: |-
      met ingang van 1 augustus van het volgende schooljaar de bekostiging van de bijzondere school wordt voortgezet of
      de openbare school in stand wordt gehouden.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel157a
  - number: 157a.4
    text: |-
      Onze Minister kan de termijn, bedoeld in het eerste lid, op aanvraag van het bevoegd gezag eenmalig verlengen met
      maximaal de duur van de termijn die op grond van het eerste lid ten aanzien van de school door hem was bepaald. De
      tweede en derde volzin van het eerste lid zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel157a
  - number: 157a.5
    text: |-
      Het derde en het vierde lid zijn van overeenkomstige toepassing voor openbare scholen die als gevolg van een
      besluit van Onze Minister op grond van artikel II van de Wet van 28 oktober 2010 tot wijziging van de Wet op
      het primair onderwijs in verband met onder meer een discretionaire bevoegdheid van de minister ten aanzien van
      kwalitatief goede scholen met minder dan 23 leerlingen met perspectief op hoger aantal leerlingen (Stb. 2010, 755)
      in stand zijn gehouden of voor bijzondere scholen waarvan als gevolg van een besluit van Onze Minister op grond van
      artikel II van de hiervoor genoemde wet de bekostiging is voortgezet.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel157a
  - number: 157b
    text: |-
      Indien de instandhouding van een openbare school of de bekostiging van een bijzondere school niet mogelijk is op
      grond van de [artikelen 153 tot en met 157a][ref1], kan Onze Minister in bijzondere gevallen op aanvraag van het
      bevoegd gezag voor een door hem te bepalen tijd toestaan, dat een openbare school in stand wordt gehouden of een
      bijzondere school wordt bekostigd.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel153
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel157b
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '153'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '9'
  - number: '158.1'
    text: |-
      De bekostiging van een bijzondere nevenvestiging wordt beëindigd of een openbare nevenvestiging wordt opgeheven
      indien de nevenvestiging gedurende 3 achtereenvolgende schooljaren op de teldatum 1 oktober niet heeft voldaan of
      geacht wordt niet te hebben voldaan aan een van de volgende voorwaarden:
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel158
  - number: 158.1.a
    text: |-
      het aantal leerlingen van de nevenvestiging bedraagt ten minste 23 en binnen een straal van 2 km bevindt zich geen
      school,
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel158
  - number: 158.1.b
    text: |-
      het aantal leerlingen van de nevenvestiging bedraagt ten minste 50 en binnen een straal van 3 km bevindt zich geen
      school waar onderwijs wordt gegeven van dezelfde richting onderscheidenlijk waar openbaar onderwijs wordt gegeven,
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel158
  - number: 158.1.c
    text: |-
      het aantal leerlingen van de nevenvestiging bedraagt ten minste 23 en binnen een straal van 5 km bevindt zich geen
      school waar onderwijs wordt gegeven van dezelfde richting onderscheidenlijk waar openbaar onderwijs wordt gegeven,
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel158
  - number: 158.1.d
    text: |-
      binnen 10 km van de openbare nevenvestiging over de weg gemeten, is geen andere school aanwezig waarbinnen openbaar
      onderwijs wordt gegeven, of
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel158
  - number: 158.1.e
    text: |-
      bij het gelijkstellen van de nevenvestiging met een zelfstandige school zou deze met toepassing van
      [artikel 157][ref1] en onder vervanging van het getal 290 in dat artikel door 260, voor bekostiging in aanmerking
      komen.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel157
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel158
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '157'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '9'
  - number: '158.2'
    text: |-
      De beëindiging van de bekostiging van een bijzondere nevenvestiging of de opheffing van een openbare nevenvestiging
      geschiedt met ingang van 1 augustus volgend op de 3 achtereenvolgende schooljaren, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel158
  - number: '158.3'
    text: |-
      Indien het bevoegd gezag van oordeel is dat op de teldatum 1 oktober wordt voldaan aan een van de voorwaarden
      genoemd in het eerste lid en het de nevenvestiging in het op die datum volgende schooljaar wil handhaven, deelt
      het dit voor 1 februari voorafgaand aan dat schooljaar onder de gemotiveerde vermelding van de voorwaarde die
      het betreft schriftelijk mede aan Onze Minister. Indien deze mededeling niet tijdig wordt gedaan, wordt de
      nevenvestiging geacht gedurende het desbetreffende schooljaar niet aan een van de voorwaarden genoemd in het eerste
      lid te voldoen, tenzij het eerste lid, onder d, van toepassing is.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel158
  - number: 158.3a
    text: |-
      Indien de nevenvestiging meer dan een richting heeft of indien binnen een periode van vijf jaar
      voorafgaand aan de datum waarop de bekostiging zou worden beëindigd, een melding is gedaan als bedoeld in
      [artikel 170, derde lid][ref1], wordt die nevenvestiging geacht gedurende het desbetreffende schooljaar niet aan de
      voorwaarden genoemd in het eerste lid, onderdeel b of c te voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel170
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel158
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '170'
        hoofdstuk: I
        afdeling: '11'
  - number: '158.4'
    text: |-
      Onze Minister maakt voor 1 mei, volgend op de mededeling, bedoeld in het derde lid, aan het bevoegd gezag van de
      desbetreffende school bekend dat
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel158
  - number: 158.4.a
    text: |-
      de nevenvestiging naar zijn oordeel gedurende 3 achtereenvolgende schooljaren op de teldatum 1 oktober niet
      heeft voldaan of geacht wordt niet te hebben voldaan aan een van de voorwaarden genoemd in het eerste lid zodat
      de bekostiging van de bijzondere nevenvestiging wordt beëindigd of de openbare nevenvestiging dient te worden
      opgeheven,
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel158
  - number: 158.4.b
    text: |-
      de nevenvestiging naar zijn oordeel niet voldoet aan een van de voorwaarden genoemd in het eerste lid maar, gelet
      op het eerste lid, de bekostiging van de bijzondere nevenvestiging wordt voortgezet of de openbare nevenvestiging
      in stand kan worden gehouden, of
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel158
  - number: 158.4.c
    text: |-
      de nevenvestiging naar zijn oordeel voldoet aan een van de voorwaarden genoemd in het eerste lid, zodat de
      bekostiging van de bijzondere nevenvestiging wordt voortgezet of de openbare nevenvestiging in stand kan, dan wel
      dient te worden gehouden.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel158
  - number: 158a.1
    text: |-
      De bekostiging van een afdeling voor internationaal georiënteerd basisonderwijs aan een bijzondere school wordt
      beëindigd of een afdeling voor internationaal georiënteerd basisonderwijs aan een openbare school wordt opgeheven
      indien het aantal leerlingen van de afdeling gedurende 3 achtereenvolgende schooljaren op de teldatum 1 oktober
      telkens minder dan 30 bedraagt. De eerste volzin is niet van toepassing zolang gedurende de eerste 5 schooljaren
      van de bekostiging van de afdeling het aantal leerlingen op de afdeling, minder dan 80 bedraagt.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel158a
  - number: 158a.2
    text: |-
      De beëindiging van de bekostiging van een afdeling voor internationaal georiënteerd basisonderwijs aan een
      bijzondere school of de opheffing van een afdeling voor internationaal georiënteerd basisonderwijs aan een openbare
      school geschiedt met ingang van 1 augustus volgend op de 3 achtereenvolgende schooljaren, bedoeld in het eerste
      lid. De beëindiging van de bekostiging van een afdeling voor internationaal georiënteerd basisonderwijs aan een
      bijzondere school of de opheffing van een afdeling voor internationaal georiënteerd basisonderwijs aan een openbare
      school ten aanzien waarvan gedurende de eerste 5 schooljaren van de bekostiging van de afdeling, het eerste lid,
      tweede volzin van toepassing was, geschiedt met ingang van 1 augustus volgende op die 5 schooljaren.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel158a
  - number: 158a.3
    text: |-
      [Artikel 160, eerste lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel160
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel158a
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '160'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '9'
  - number: '159.1'
    text: |-
      De gemeenteraad kan besluiten tot vermindering van het aantal door de gemeente in stand gehouden openbare scholen
      en nevenvestigingen.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel159
  - number: '159.2'
    text: |-
      De openbare rechtspersoon, bedoeld in [artikel 47][ref1], of de stichting, bedoeld in [artikel 17][ref2] of
      [48][ref3], kan besluiten tot opheffing van een door die openbare rechtspersoon of stichting in stand gehouden
      openbare school of nevenvestiging. Een besluit tot opheffing wordt uiterlijk op 1 augustus van het schooljaar
      voorafgaand aan de beoogde datum van opheffing medegedeeld aan de gemeenteraad. Indien de gemeenteraad voor
      1 februari daaropvolgend besluit dat hij de school in stand wenst te houden, wordt deze niet opgeheven, maar wordt
      de instandhouding daarvan overgedragen aan de gemeente.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0003420#Artikel48
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel159
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '47'
        hoofdstuk: I
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '17'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0003420
        artikel: '48'
        hoofdstuk: I
        afdeling: '2'
  - number: '159.3'
    text: |-
      In afwijking van het eerste lid en het tweede lid, eerste volzin, vindt opheffing van een openbare school
      of nevenvestiging niet plaats in de gevallen, bedoeld in [artikel 153, vijfde lid][ref1], onderscheidenlijk
      [artikel 158, eerste lid, onder d][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel153
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel158
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel159
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '153'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '9'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '158'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '9'
  - number: '159.4'
    text: |-
      Indien een besluit tot opheffing, bedoeld in het tweede lid, in afwijking van de tweede volzin van dat lid na
      1 augustus, maar uiterlijk op 1 januari van het schooljaar voorafgaand aan de beoogde datum van opheffing wordt
      medegedeeld aan de gemeenteraad, dan wordt de school of nevenvestiging slechts opgeheven op grond van dat besluit
      indien:
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel159
  - number: 159.4.a
    text: |-
      de op te heffen openbare school of nevenvestiging binnen 10 km over de weg gemeten niet de enige school is
      waarbinnen openbaar onderwijs wordt gegeven, en
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel159
  - number: 159.4.b
    text: |-
      de gemeenteraad uiterlijk op 1 februari volgend op die mededeling besluit om in te stemmen met opheffing van de
      school of nevenvestiging.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel159
  - number: '159.5'
    text: |-
      Indien het besluit, bedoeld in het tweede lid, na 1 januari van het schooljaar voorafgaand aan de beoogde datum van
      opheffing wordt medegedeeld aan de gemeenteraad, dan wordt de school of nevenvestiging niet opgeheven op grond van
      dat besluit.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel159
  - number: '160.1'
    text: |-
      Indien naar het oordeel van Onze Minister de bekostiging van een bijzondere school dient te worden beëindigd of
      een openbare school dient te worden opgeheven, maakt Onze Minister dit voor 1 januari voorafgaand aan de datum van
      beëindiging van de bekostiging onderscheidenlijk opheffing van de school bekend aan het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel160
  - number: '160.2'
    text: |-
      Indien naar het oordeel van het bevoegd gezag sprake is van een uitzonderingssituatie als bedoeld in
      [artikel 153, vierde of vijfde lid][ref1], dan wel [artikel 157][ref2], deelt het bevoegd gezag dit voor 1 februari
      voorafgaand aan de datum voor de beëindiging van de bekostiging onderscheidenlijk de opheffing schriftelijk mede
      aan Onze Minister. Bij algemene maatregel van bestuur wordt bepaald welke gegevens bij deze mededeling worden
      overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel153
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel157
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel160
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '153'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '9'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '157'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '9'
  - number: '160.3'
    text: |-
      Voor zover Onze Minister niet reeds heeft bekendgemaakt dat hij de mededeling, bedoeld in het tweede lid, buiten
      behandeling laat wegens het niet verstrekken van de voorgeschreven gegevens, maakt hij voor 1 mei, volgend op de
      mededeling, bedoeld in het tweede lid, aan het bevoegd gezag van de desbetreffende school bekend dat:
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel160
  - number: 160.3.a
    text: |-
      naar zijn oordeel geen sprake is van een van de uitzonderingssituaties, bedoeld in het tweede lid, en dat met
      ingang van 1 augustus van het volgende schooljaar de bekostiging van de bijzondere school wordt beëindigd dan wel
      de openbare school dient te worden opgeheven, of
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel160
  - number: 160.3.b
    text: |-
      met ingang van 1 augustus van het volgende schooljaar de bekostiging van de bijzondere school wordt voortgezet of
      de openbare school in stand dient te worden gehouden.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel160
  - number: '160.4'
    text: |-
      Indien Onze Minister niet voor 1 mei, volgend op de mededeling, bedoeld in het tweede lid, een bekendmaking als
      bedoeld in het derde lid heeft gedaan, wordt met ingang van 1 augustus van het volgende schooljaar de bekostiging
      van de bijzondere school voortgezet of dient de openbare school met ingang van laatstgenoemde datum in stand te
      worden gehouden.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel160
  - number: '162'
    text: |-
      [Artikel 159, eerste lid, en tweede lid, eerste volzin][ref1], is van overeenkomstige toepassing op speciale
      scholen voor basisonderwijs en nevenvestigingen daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel159
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel162
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '159'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '9'
  - number: '163.1'
    text: |-
      Indien de bekostiging van een bijzondere school of nevenvestiging wordt beëindigd of het bevoegd gezag tot
      de opheffing van de school of nevenvestiging beslist, dan wel een openbare nevenvestiging ten aanzien waarvan
      [artikel 85, tweede lid][ref1], of [artikel 89, tweede lid][ref2], toepassing heeft gevonden, wordt opgeheven,
      eindigt het recht op het gebouw en terrein en worden alle roerende zaken, behalve die welke het bevoegd gezag
      uit eigen middelen heeft aangeschaft, aan de gemeente op wier grondgebied het gebouw en terrein zijn gelegen,
      overgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel85
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel89
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel163
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '85'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '89'
        hoofdstuk: I
        paragraaf: '2'
        afdeling: '2'
  - number: '163.2'
    text: |-
      [Artikel 110, eerste tot en met vierde lid][ref1], is van overeenkomstige toepassing met dien verstande dat in
      de verklaring ingevolge het eerste lid en het besluit ingevolge het tweede lid als datum waarop het bevoegd gezag
      blijvend heeft opgehouden dan wel blijvend zal ophouden het gebouw of terrein voor de school te gebruiken, zal
      worden genoemd de datum waarop de bekostiging is geëindigd dan wel zal eindigen.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel110
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel163
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '110'
        hoofdstuk: I
        afdeling: '3'
  - number: 163a.1
    text: |-
      Indien de bekostiging van de laatste bijzondere school van een bevoegd gezag wordt beëindigd of het bevoegd gezag
      tot de opheffing van de laatste school beslist, dan wel de laatste openbare school wordt opgeheven, stort het
      bevoegd gezag de niet bestede bekostigingsbedragen terug in de desbetreffende overheidskas.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel163a
  - number: 163a.2
    text: Het exploitatietekort blijft in de gevallen, bedoeld in het eerste lid, voor rekening van het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel163a
  - number: 163a.3
    text: |-
      Bij algemene maatregel van bestuur kunnen voorschriften worden gegeven omtrent de wijze waarop het
      exploitatieoverschot, bedoeld in het eerste lid, wordt berekend.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel163a
  - number: 163b.1
    text: |-
      Indien sprake is van wanbeheer van een of meer bestuurders of toezichthouders kan Onze Minister de rechtspersoon
      die de school in stand houdt dan wel het samenwerkingsverband een aanwijzing geven. Een aanwijzing omvat een of
      meer maatregelen en is evenredig aan het doel waarvoor zij wordt gegeven.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel163b
  - number: 163b.2
    text: 'Onder wanbeheer wordt uitsluitend verstaan:'
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel163b
  - number: 163b.2.a
    text: financieel wanbeleid,
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel163b
  - number: 163b.2.b
    text: |-
      ernstige nalatigheid om, in ieder geval in strijd met [artikel 10][ref1], maatregelen te treffen die noodzakelijk
      zijn voor het waarborgen van de kwaliteit en goede voortgang van het onderwijs aan de school en om te voorkomen dat
      de kwaliteit van het stelsel van primair onderwijs in gevaar komt,


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel10
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel163b
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '10'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '1'
  - number: 163b.2.c
    text: |-
      ongerechtvaardigde verrijking, al dan niet beoogd, van de rechtspersoon die de school in stand houdt dan wel het
      samenwerkingsverband, zichzelf dan wel een derde of
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel163b
  - number: 163b.2.d
    text: |-
      onrechtmatig handelen, waaronder wordt verstaan het in de hoedanigheid van bestuurder of toezichthouder handelen in
      strijd met wettelijke bepalingen waarmee financieel voordeel wordt behaald ten gunste van de rechtspersoon die de
      school in stand houdt dan wel het samenwerkingsverband, zichzelf of een derde, en
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel163b
  - number: 163b.2.e
    text: |-
      het in ernstige mate verwaarlozen van de zorg voor wat door redelijkheid en billijkheid wordt gevorderd in de
      omgang met betrokkenen in de schoolorganisatie, waaronder wordt verstaan intimidatie of bedreiging van personeel,
      leerlingen of ouders door een bestuurder of toezichthouder.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel163b
  - number: 163b.3
    text: |-
      In de aanwijzing geeft Onze Minister met redenen omkleed aan op welke punten sprake is van wanbeheer alsmede de in
      verband daarmee te nemen maatregelen.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel163b
  - number: 163b.4
    text: |-
      Een aanwijzing bevat de termijn waarbinnen het bevoegd gezag dan wel het samenwerkingsverband aan de aanwijzing
      moet voldoen.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel163b
  - number: 163b.5
    text: 'Alvorens Onze Minister een aanwijzing als bedoeld in het eerste lid geeft:'
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel163b
  - number: 163b.5.a
    text: |-
      heeft de inspectie een onderzoek als bedoeld in [artikel 11][ref1] of
      [artikel 15 van de Wet op het onderwijstoezicht][ref2] verricht;


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0013800#Artikel15
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel163b
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0013800
        artikel: '15'
  - number: 163b.5.b
    text: |-
      heeft de inspectie daarover een inspectierapport als bedoeld in
      [artikel 20, eerste lid, van de Wet op het onderwijstoezicht][ref1] uitgebracht; en


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel20
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel163b
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: '20'
  - number: 163b.5.c
    text: |-
      stelt Onze Minister de rechtspersoon dan wel het samenwerkingsverband vervolgens vier weken in de gelegenheid zijn
      zienswijze met betrekking tot de aanwijzing naar voren te brengen.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel163b
  - number: 163c.1
    text: |-
      Indien naar het oordeel van Onze Minister het samenwerkingsverband zijn taak ernstig verwaarloost, kan tot een bij
      koninklijk besluit te bepalen datum Onze Minister de noodzakelijke voorzieningen treffen.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel163c
  - number: 163c.2
    text: |-
      De voorzieningen worden, spoedeisende gevallen uitgezonderd, niet eerder getroffen dan nadat het
      samenwerkingsverband in de gelegenheid is gesteld om binnen een door Onze Minister te stellen termijn alsnog zijn
      taak naar behoren uit te voeren.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel163c
  - number: 163c.3
    text: |-
      Het eerste en tweede lid zijn van overeenkomstige toepassing indien de bevoegde gezagsorganen, bedoeld in
      [artikel 18a, tweede lid][ref1], niet of niet tijdig voldoen aan de verplichtingen, bedoeld in genoemd artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel18a
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel163c
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 18a
        hoofdstuk: I
        paragraaf: '2'
        afdeling: '1'
  - number: '164.1'
    text: |-
      Indien het bevoegd gezag van een school dan wel het samenwerkingsverband in strijd handelt met het bepaalde
      bij of krachtens deze wet, waaronder tevens wordt verstaan het niet opvolgen van een aanwijzing als bedoeld in
      [artikel 163b][ref1], kan Onze Minister bepalen dat de bekostiging, voorschotten daaronder begrepen, geheel of
      gedeeltelijk wordt ingehouden dan wel opgeschort.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel163b
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel164
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 163b
        hoofdstuk: I
        paragraaf: '3'
        afdeling: '9'
  - number: '164.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing, indien het bevoegd gezag of het personeel van een school
      dan wel het samenwerkingsverband of het personeel van een samenwerkingsverband in strijd handelt met
      [artikel 5:20, eerste lid, van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel164
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '164.3'
    text: |-
      Onze Minister kent de bekostiging wederom toe, indien blijkt dat de reden voor de toepassing van het eerste of
      tweede lid is vervallen.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel164
  - number: 164a.1
    text: |-
      Indien het bevoegd gezag tekortschiet in haar zorg voor de kwaliteit van het onderwijs, bedoeld in
      [artikel 10][ref1], kan Onze Minister op verzoek van het bevoegd gezag van een school of uit eigen beweging in
      overeenstemming met het bevoegd gezag maatregelen treffen.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel10
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel164a
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '10'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '1'
  - number: 164a.2
    text: |-
      Tot de maatregelen, bedoeld in het eerste lid, behoort de mogelijkheid het bestuur van de instelling te laten
      bijstaan door een extern deskundige. Ook kunnen onder voorwaarden extra financiële middelen aan de instelling ter
      beschikking worden gesteld.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel164a
  - number: 164a.3
    text: |-
      Onze Minister stelt nadere regels omtrent de toekenning van en verantwoording voor maatregelen, voorzover deze het
      verstrekken van financiële middelen betreffen.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel164a
  - number: 164a.4
    text: |-
      Het eerste tot en met het derde lid is van overeenkomstige toepassing ten aanzien van de kwaliteit van de
      uitoefening van de taken van het samenwerkingsverband en de kwaliteit van het bestuur van het samenwerkingsverband.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel164a
  - number: 164b.1
    text: |-
      Indien sprake is van een situatie als bedoeld in [artikel 10a, eerste lid][ref1], kan Onze Minister besluiten dat
      met ingang van een in dat besluit bepaalde datum een openbare school wordt opgeheven en de bekostiging van een
      bijzondere school wordt beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel10a
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel164b
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 10a
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '1'
  - number: 164b.2
    text: 'Alvorens Onze Minister toepassing geeft aan het eerste lid:'
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel164b
  - number: 164b.2.a
    text: |-
      heeft de inspectie een onderzoek als bedoeld in [artikel 11, derde lid, van de Wet op het onderwijstoezicht][ref1]
      verricht en heeft de inspectie Onze Minister meegedeeld dat het bevoegd gezag naar aanleiding van dit onderzoek
      niet bereid is afspraken te maken over verbeteringen dan wel dat uit het onderzoek naar de verbeteringen, bedoeld
      in artikel 11, vierde lid, van de Wet op het onderwijstoezicht blijkt dat sprake is van onvoldoende verbeteringen;


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel11
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel164b
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: '11'
  - number: 164b.2.b
    text: |-
      heeft de inspectie daarover een inspectierapport als bedoeld in
      [artikel 20, eerste lid, van de Wet op het onderwijstoezicht][ref1] uitgebracht; en


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel20
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel164b
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: '20'
  - number: 164b.2.c
    text: |-
      stelt Onze Minister het bevoegd gezag vervolgens vier weken in de gelegenheid zijn zienswijze met betrekking tot de
      voorgenomen opheffing of de voorgenomen beëindiging van de bekostiging naar voren te brengen.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel164b
  - number: 164b.3
    text: |-
      Op een basisschool die minder dan 2 jaar wordt bekostigd en waarvan de kwaliteit van het onderwijs in deze periode
      zeer zwak is als bedoeld in [artikel 10a][ref1], zijn het eerste en tweede lid van overeenkomstige toepassing,
      indien het bevoegd gezag:


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel10a
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel164b
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 10a
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '1'
  - number: 164b.3.a
    text: tekortschiet in de naleving van drie of meer bij of krachtens deze wet gegeven voorschriften, en dientengevolge
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel164b
  - number: 164b.3.b
    text: |-
      tekortschiet in het zorgdragen voor de veiligheid op de school als bedoeld in [artikel 4c][ref1], of in het
      zodanig inrichten van het onderwijs dat leerlingen een ononderbroken ontwikkelingsproces kunnen doorlopen
      dan wel in het afstemmen van het onderwijs op de voortgang in de ontwikkeling van leerlingen als bedoeld in
      [artikel 8, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel4c
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel8
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel164b
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 4c
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '8'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '1'
  - number: '165'
    text: |-
      Indien burgemeester en wethouders in samenwerking met de bevoegde gezagsorganen van de scholen, activiteiten
      ter bevordering van de beheersing van de Nederlandse taal op scholen willen verrichten met het oog op het
      voorkomen en bestrijden van onderwijsachterstanden, wordt het onderwijs zodanig ingericht dat deze activiteiten
      plaatsvinden geheel of gedeeltelijk gedurende dan wel buiten het aantal uren onderwijs dat leerlingen op grond van
      [artikel 8][ref1] tenminste ontvangen. Een leerling neemt slechts deel aan deze activiteiten als nadat de ouders
      van de leerling hun instemming schriftelijk kenbaar hebben gemaakt aan het bevoegd gezag.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel8
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel165
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '8'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '1'
  - number: '166.1'
    text: |-
      Burgemeester en wethouders dragen er zorg voor dat er in een gemeente voldoende voorzieningen in aantal
      en spreiding zijn waar kinderen met een risico op een achterstand in de Nederlandse taal, als bedoeld in
      [artikel 167, eerste lid][ref1], deel kunnen nemen aan voorschoolse educatie die voldoet aan de bij of krachtens
      [artikel 1.50b van de Wet kinderopvang][ref2] vastgestelde bepalingen.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel167
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Artikel1
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel166
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '167'
        hoofdstuk: I
        afdeling: '10'
      - id: ref2
        bwb_id: BWBR0017017
        artikel: '1'
  - number: '167.1'
    text: 'Burgemeester en wethouders voeren ten minste jaarlijks overleg en dragen zorg voor het maken van afspraken over:'
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel167
  - number: 167.1.a
    text: 'met het oog op een zo groot mogelijke deelname van het aantal kinderen aan voorschoolse educatie:'
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel167
  - number: 167.1.a.1°
    text: |-
      het vaststellen welke kinderen met een risico op een achterstand in de Nederlandse taal in aanmerking komen voor
      voorschoolse educatie,
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel167
  - number: 167.1.a.2°
    text: de wijze waarop die kinderen worden toegeleid naar voorschoolse en vroegschoolse educatie, en
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel167
  - number: 167.1.a.3°
    text: de organisatie van een doorlopende leerlijn van voorschoolse naar vroegschoolse educatie, en
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel167
  - number: 167.1.b
    text: resultaten van vroegschoolse educatie.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel167
  - number: '167.2'
    text: |-
      Burgemeester en wethouders voeren overleg en maken de afspraken, bedoeld in het eerste lid, met de volgende
      partijen:
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel167
  - number: 167.2.a
    text: |-
      voor het eerste lid, onderdeel a: met de bevoegde gezagsorganen van scholen en de houders van kindercentra als
      bedoeld in de [Wet kinderopvang][ref1] in de gemeente,


      [ref1]: https://wetten.overheid.nl/BWBR0017017
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel167
    references:
      - id: ref1
        bwb_id: BWBR0017017
  - number: 167.2.b
    text: 'voor het eerste lid, onderdeel b: met de bevoegde gezagsorganen van scholen.'
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel167
  - number: '167.3'
    text: |-
      Een houder van een kindercentrum verwerkt persoonsgegevens met als doel de bevordering van een goede doorstroom
      naar het basisonderwijs. De gegevens die een houder van een kindercentrum verplicht overdraagt aan het bevoegd
      gezag van een basisschool over leerlingen die op de basisschool zijn ingeschreven, zijn het programma van
      voorschoolse educatie dat een leerling heeft gevolgd en de duur van het programma dat is gevolgd. Houders van
      kindercentra maken afspraken met de basisscholen binnen een gemeente over de wijze van gegevenslevering. De
      bewaartermijn voor de overgedragen gegevens is twee jaar nadat het kind het kindercentrum heeft verlaten.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel167
  - number: 167a.1
    text: |-
      Burgemeester en wethouders en de bevoegde gezagsorganen van de scholen en de kinderopvang, bedoeld in de
      [Wet kinderopvang][ref1] in de gemeente voeren tenminste jaarlijks overleg over het voorkomen van segregatie,
      het bevorderen van integratie en het bestrijden van onderwijsachterstanden, de afstemming over inschrijvings-
      en toelatingsprocedures en het uit het overleg voortvloeiende voorstel van het bevoegd gezag van in de gemeente
      gevestigde scholen om tot een evenwichtige verdeling van leerlingen met een onderwijsachterstand over de scholen
      te komen. Het overleg is gericht op het maken van afspraken over de in de eerste volzin bedoelde onderwerpen.
      Deze afspraken hebben zoveel mogelijk het karakter van meetbare doelen. De inspectie rapporteert jaarlijks over
      de mate waarin die doelen worden bereikt. Burgemeester en wethouders kunnen de uitkomsten van het verplichte op
      overeenstemming gerichte overleg omzetten in bindende afspraken over onder andere de te realiseren prestaties en
      inspanningen, die – alvorens de afspraken tot stand komen – aan alle partijen worden voorgelegd. Indien het overleg
      over de voorgenomen bindende afspraken niet tot overeenstemming leidt, schrijven burgemeester en wethouders een
      nieuw overleg uit, waarbij zij initiatieven nemen tot het bereiken van een zo groot mogelijke consensus. Indien ook
      dit overleg niet tot overeenstemming leidt, vragen burgemeester en wethouders of een van de bevoegde gezagsorganen
      aan de geschillencommissie, bedoeld in het tweede lid, om een bindend advies. De geschillencommissie brengt binnen
      4 weken aan burgemeester en wethouders dan wel aan het bevoegd gezag dat om het advies heeft verzocht, een bindend
      advies uit. Burgemeester en wethouders maken dit advies bekend aan de bevoegde gezagsorganen van de scholen en de
      kinderopvang, bedoeld in de [Wet kinderopvang][ref2] in de gemeente.


      [ref1]: https://wetten.overheid.nl/BWBR0017017
      [ref2]: https://wetten.overheid.nl/BWBR0017017
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel167a
    references:
      - id: ref1
        bwb_id: BWBR0017017
      - id: ref2
        bwb_id: BWBR0017017
  - number: 167a.2
    text: Onze Minister stelt een geschillencommissie in.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel167a
  - number: 167a.3
    text: |-
      De commissie bestaat uit een voorzitter en 4 leden, die allen door Onze Minister worden benoemd. De 4 leden worden
      benoemd op voordracht van de gezamenlijke besturenorganisaties en de Vereniging van Nederlandse Gemeenten. De
      voorzitter is een jurist.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel167a
  - number: 167a.4
    text: |-
      De voorzitter en de leden worden benoemd voor een termijn van 4 jaar. Zij zijn opnieuw benoembaar. Op eigen verzoek
      wordt aan hen ontslag verleend.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel167a
  - number: '168'
    text: |-
      Indien niet binnen een redelijke termijn met alle partijen, bedoeld in [artikel 167, tweede lid][ref1], afspraken
      als bedoeld in artikel 167, eerste lid, zijn gemaakt, kunnen burgemeester en wethouders de werkingssfeer van de
      gemaakte afspraken, voor zover noodzakelijk voor een samenhangend onderwijsachterstandenbeleid, uitbreiden naar de
      partijen, bedoeld in artikel 167, tweede lid, waarmee geen afspraken zijn gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel167
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel168
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '167'
        hoofdstuk: I
        afdeling: '10'
  - number: 168a.1
    text: |-
      Bij algemene maatregel van bestuur worden de criteria vastgesteld op grond waarvan een gemeente in aanmerking komt
      voor een specifieke uitkering ter tegemoetkoming in de kosten van de uitvoering van de verplichtingen, bedoeld
      in de [artikelen 165][ref1], [166][ref2] en [167][ref3], alsmede de criteria voor de hoogte daarvan. De uitkering
      wordt per kalenderjaar verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel165
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel166
      [ref3]: https://wetten.overheid.nl/BWBR0003420#Artikel167
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel168a
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '165'
        hoofdstuk: I
        afdeling: '10'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '166'
        hoofdstuk: I
        afdeling: '10'
      - id: ref3
        bwb_id: BWBR0003420
        artikel: '167'
        hoofdstuk: I
        afdeling: '10'
  - number: 168a.2
    text: |-
      Burgemeester en wethouders verstrekken de middelen die de gemeente als specifieke uitkering uit ’s Rijks kas
      ontvangt voor de verplichtingen bedoeld in het eerste lid aan de rechtspersonen die daarvoor in aanmerking komen.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel168a
  - number: 168a.3
    text: |-
      Onze Minister kan de uitkering geheel of gedeeltelijk terugvorderen indien de uitkering niet is besteed in
      overeenstemming met de bepalingen van deze wet. Bij de algemene maatregel van bestuur, bedoeld in het eerste lid,
      worden criteria vastgesteld op basis waarvan de minister tot terugvordering kan overgaan.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel168a
  - number: 168a.4
    text: |-
      Burgemeester en wethouders van een gemeente, die een uitkering ontvangt als bedoeld in het eerste lid, dragen
      er zorg voor dat zij beschikken over geordende gegevens ten behoeve van het door Onze Minister te voeren beleid
      bedoeld in de [artikelen 165][ref1], [166][ref2] en [167][ref3], en verlenen desgevraagd medewerking aan door of
      namens Onze Minister uit te voeren onderzoek dat geheel of mede op deze gegevens is gebaseerd.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel165
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel166
      [ref3]: https://wetten.overheid.nl/BWBR0003420#Artikel167
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel168a
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '165'
        hoofdstuk: I
        afdeling: '10'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '166'
        hoofdstuk: I
        afdeling: '10'
      - id: ref3
        bwb_id: BWBR0003420
        artikel: '167'
        hoofdstuk: I
        afdeling: '10'
  - number: 168a.5
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere voorschriften worden gegeven omtrent de definiëring,
      de wijze van ordening en omtrent de beschikbaarstelling van de gegevens, bedoeld in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel168a
  - number: '170.1'
    text: |-
      Voor 1 mei van het kalenderjaar volgend op het besluit, bedoeld in [artikel 75, derde lid][ref1], meldt het bevoegd
      gezag aan Onze Minister of de school uitgaat van een grondslag en zo ja, welke grondslag.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel75
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel170
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '75'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '2'
  - number: '170.2'
    text: |-
      Voor scholen die direct voorafgaand aan de datum van inwerkingtreding van de Wet van 20 mei 2020 tot wijziging van
      diverse onderwijswetten door het wijzigen van de systematiek van het in aanmerking brengen voor bekostiging van
      nieuwe openbare en bijzondere scholen zodat meer ruimte is voor een nieuw onderwijsaanbod (Wet meer ruimte voor
      nieuwe scholen) (Stb. 2020, 160) reeds werden bekostigd, geldt als grondslag de op die datum geldende richting van
      de school.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel170
  - number: '170.3'
    text: |-
      Indien de school op enig moment alsnog uitgaat van een grondslag of indien de grondslag van de school wijzigt,
      wordt daarvan binnen vier weken melding gedaan aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel170
  - number: '170.4'
    text: |-
      Het eerste, tweede en derde lid zijn van overeenkomstige toepassing op de nevenvestiging indien die van een andere
      grondslag uitgaat dan de school.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel170
  - number: '170.5'
    text: Bij ministeriële regeling wordt een model vastgesteld voor de melding, bedoeld in het eerste en derde lid.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel170
  - number: '171.1'
    text: |-
      Het bevoegd gezag onderscheidenlijk het samenwerkingsverband stelt jaarlijks een jaarverslag over het voorafgaande
      kalenderjaar vast. Op deze jaarverslaggeving is [Boek 2, titel 9, van het Burgerlijk Wetboek][ref1], met
      uitzondering van de [afdelingen 1][ref2], [11][ref3] en [12][ref4], van overeenkomstige toepassing voor zover
      bij of krachtens algemene maatregel van bestuur niet anders is bepaald. Het jaarverslag bestaat tenminste uit de
      volgende onderdelen:


      [ref1]: https://wetten.overheid.nl/BWBR0003045
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Afdeling1
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Afdeling11
      [ref4]: https://wetten.overheid.nl/BWBR0003045#Afdeling12
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel171
    references:
      - id: ref1
        bwb_id: BWBR0003045
      - id: ref2
        bwb_id: BWBR0003045
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0003045
        afdeling: '11'
      - id: ref4
        bwb_id: BWBR0003045
        afdeling: '12'
  - number: 171.1.a
    text: |-
      een bestuursverslag als bedoeld in [artikel 391 Boek 2 van het Burgerlijk Wetboek][ref1] waarin de door het bevoegd
      gezag gehanteerde code voor goed bestuur wordt vermeld alsmede ten minste verantwoording wordt afgelegd over de
      afwijkingen van die code voor goed bestuur,


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel391
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel171
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '391'
  - number: 171.1.b
    text: |-
      een jaarrekening als bedoeld in [artikel 361 van Boek 2 van het Burgerlijk Wetboek][ref1], waaruit blijkt dat
      sprake is van een rechtmatige en doelmatige aanwending van de bekostiging, met daarbij ingevolge het derde lid vast
      te stellen bijlagen,


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel361
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel171
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '361'
  - number: 171.1.c
    text: |-
      overige gegevens als bedoeld in [artikel 392 van Boek 2 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel392
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel171
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '392'
  - number: '171.2'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald welke onderdelen het jaarverslag tevens dient te bevatten,
      dan wel welke onderdelen komen te vervallen.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel171
  - number: '171.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan een nadere invulling worden gegeven aan de onderdelen, bedoeld
      in het eerste en tweede lid, en kunnen nadere voorschriften worden gegeven over:
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel171
  - number: 171.3.a
    text: de indeling en de wijze van ordening van de gegevens per onderdeel van het jaarverslag,
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel171
  - number: 171.3.b
    text: de wijze en het tijdstip waarop de desbetreffende onderdelen beschikbaar gesteld worden,
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel171
  - number: 171.3.c
    text: de elektronische verzending van het cijfermatige deel uit de jaarrekening, en
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel171
  - number: 171.3.d
    text: de grondslagen voor de jaarrekening.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel171
  - number: '171.4'
    text: |-
      De beschikbaarstelling van de gegevens, bedoeld in het derde lid, onder b, gaat vergezeld van een verklaring
      omtrent de getrouwheid en rechtmatigheid, afgegeven door een door de toezichthouder of het toezichthoudend orgaan
      aangewezen accountant als bedoeld in [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1]. Bij de
      aanwijzing van de accountant bedingt de toezichthouder of het toezichthoudend orgaan dat de controle overeenkomstig
      een door Onze Minister vast te stellen accountantsprotocol plaatsvindt en dat aan Onze Minister op diens verzoek
      inzicht wordt geboden in de controlerapporten van de accountant.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel171
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '171.5'
    text: |-
      De code voor goed bestuur, bedoeld in het eerste lid, onderdeel a, bevat ten minste bepalingen over de wijze waarop
      invulling wordt gegeven aan
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel171
  - number: 171.5.a
    text: |-
      een beleid dat de eigen deskundigheid en verantwoordelijkheid van het personeel voor de kwaliteit van het onderwijs
      tot haar recht komt,
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel171
  - number: 171.5.b
    text: een integere bedrijfsvoering, waaronder voorzieningen om verstrengeling van belangen tegen te gaan, en
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel171
  - number: 171.5.c
    text: afstemming met en verantwoording aan de ouders en andere belanghebbenden binnen en buiten de school.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel171
  - number: '171.6'
    text: Bij algemene maatregel van bestuur kan een code voor goed bestuur worden aangewezen.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel171
  - number: '171.7'
    text: Het bevoegd gezag onderscheidenlijk het samenwerkingsverband maakt het jaarverslag openbaar.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel171
  - number: '171.8'
    text: |-
      Bij ministeriële regeling kunnen nadere voorschriften worden gegeven over de wijze en het tijdstip waarop
      openbaarmaking van het jaarverslag plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel171
  - number: '172.1'
    text: |-
      Het bevoegd gezag onderscheidenlijk het samenwerkingsverband draagt er zorg voor dat het ten behoeve
      van Onze Minister beschikt over geordende gegevens die van belang zijn voor de berekening van de hoogte
      van de bekostiging, alsmede over een verklaring over de juistheid van de bekostigingsgegevens, afgegeven
      door een door de toezichthouder of het toezichthoudend orgaan aangewezen accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel172
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '172.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere voorschriften worden gegeven omtrent de definiëring,
      de wijze van ordening en de beschikbaarstelling van de gegevens, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel172
  - number: '172.3'
    text: |-
      Het bevoegd gezag onderscheidenlijk het samenwerkingsverband bewaart de gegevens, bedoeld in het eerste lid, en de
      desbetreffende boeken en bescheiden gedurende een periode van zeven jaren.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel172
  - number: '173.1'
    text: |-
      Het bevoegd gezag onderscheidenlijk het samenwerkingsverband draagt er zorg voor dat het beschikt over geordende
      gegevens ten behoeve van het door Onze Minister te voeren beleid met betrekking tot het onderwijs, bedoeld in deze
      wet, en verleent desgevraagd medewerking aan door of namens Onze Minister uit te voeren onderzoek dat geheel of
      mede op deze gegevens is gebaseerd.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel173
  - number: '173.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere voorschriften worden gegeven omtrent de definiëring,
      de wijze van ordening en de beschikbaarstelling van de gegevens, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel173
  - number: '174'
    text: |-
      De voorschriften, bedoeld in [artikel 171, derde lid][ref1], [artikel 172, tweede lid][ref2], en
      [artikel 173, tweede lid][ref3], hebben geen betrekking op het persoonsgebonden nummer van een leerling of op de
      andere gegevens, bedoeld in [artikel 178a, tweede lid][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel171
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel172
      [ref3]: https://wetten.overheid.nl/BWBR0003420#Artikel173
      [ref4]: https://wetten.overheid.nl/BWBR0003420#Artikel178a
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel174
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '171'
        hoofdstuk: I
        afdeling: '11'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '172'
        hoofdstuk: I
        afdeling: '11'
      - id: ref3
        bwb_id: BWBR0003420
        artikel: '173'
        hoofdstuk: I
        afdeling: '11'
      - id: ref4
        bwb_id: BWBR0003420
        artikel: 178a
        hoofdstuk: I
        afdeling: '12'
  - number: '175.1'
    text: |-
      Onverminderd de bevoegdheid van de inspectie op grond van de [Wet op het onderwijstoezicht][ref1] kan Onze minister
      een onderzoek instellen of doen instellen naar de jaarverslaggeving, naar de gegevens die noodzakelijk zijn voor de
      vaststelling van de bekostiging, naar de rechtmatigheid van de bestedingen en naar de doelmatigheid van het beheer
      van de school.


      [ref1]: https://wetten.overheid.nl/BWBR0013800
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel175
    references:
      - id: ref1
        bwb_id: BWBR0013800
  - number: '175.2'
    text: |-
      Indien uit een op grond van het eerste lid ingesteld onderzoek blijkt dat de bekostiging voor een school onjuist is
      vastgesteld, kan Onze minister correcties aanbrengen op de bekostiging.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel175
  - number: '175.3'
    text: |-
      Onze minister doet het bevoegd gezag schriftelijk mededeling van een besluit tot het aanbrengen van een correctie
      op de bekostiging.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel175
  - number: '175.4'
    text: |-
      Indien uit de jaarverslaggeving, bedoeld in [artikel 171, eerste lid][ref1], uit de verklaring van de
      accountant, bedoeld in artikel 171, vierde lid, of uit een op grond van het eerste lid ingesteld onderzoek
      blijkt dat de bekostiging voor een school onrechtmatig is besteed of evident ondoelmatig is aangewend,
      kan Onze minister bepalen dat het desbetreffende gedeelte van de bekostiging niet ten laste komt van het
      Rijk of dat de daarmee gemoeide bedragen in mindering worden gebracht op de bekostiging, onverminderd
      [artikel 4:49 van de Algemene wet bestuursrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel171
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel175
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '171'
        hoofdstuk: I
        afdeling: '11'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '175.5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld over de wijze waarop wordt vastgesteld
      dat sprake is van evident ondoelmatige aanwending van de bekostiging als bedoeld in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel175
  - number: '175.6'
    text: |-
      De voordracht voor een krachtens het vijfde lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide Kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel175
  - number: '175.7'
    text: |-
      Een in het tweede lid bedoelde correctie wordt indien de correctie strekt tot verhoging van de bekostiging, binnen
      acht weken na de mededeling, bedoeld in het derde lid, door Onze minister betaald.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel175
  - number: 176a
    text: 'In deze afdeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel176a
  - number: 176a.a
    text: |-
      instelling voor hoger onderwijs: een instelling voor hoger onderwijs als bedoeld in artikel 1.1, onder g, van de
      Wet op het hoger onderwijs en wetenschappelijk onderzoek;
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel176a
  - number: 176a.b
    text: |-
      instellingsbestuur: het instellingsbestuur, bedoeld in artikel 1.1, onderdeel j, van de Wet op het hoger onderwijs
      en wetenschappelijk onderzoek, met dien verstande dat voor zover het openbare instellingen betreft, de artikelen
      9.2, tweede lid, 10.9, tweede lid, en 11.1, tweede lid, van die wet van overeenkomstige toepassing zijn.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel176a
  - number: 176b.1
    text: |-
      Aan degene die blijkens een geschiktheidsonderzoek als bedoeld in [artikel 176c][ref1] voldoende geschikt
      wordt geacht voor het beroep van leraar en in staat moet worden geacht binnen twee jaar na benoeming of
      tewerkstelling zonder benoeming tot leraar met goed gevolg deel te nemen aan het in [artikel 176f][ref2] bedoelde
      bekwaamheidsonderzoek, geeft het bestuur van een instelling die op grond van [artikel 176e][ref3] is erkend, een
      geschiktheidsverklaring af.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel176c
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel176f
      [ref3]: https://wetten.overheid.nl/BWBR0003420#Artikel176e
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel176b
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 176c
        hoofdstuk: I
        afdeling: 11A
      - id: ref2
        bwb_id: BWBR0003420
        artikel: 176f
        hoofdstuk: I
        afdeling: 11A
      - id: ref3
        bwb_id: BWBR0003420
        artikel: 176e
        hoofdstuk: I
        afdeling: 11A
  - number: 176b.2
    text: Bij ministeriële regeling wordt een model voor de geschiktheidsverklaring vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel176b
  - number: 176b.3
    text: |-
      Op 31 juli 2006 nog geldige geschiktheidsverklaringen, afgegeven op grond van de Interimwet zij-instroom leraren
      primair en voortgezet onderwijs, gelden vanaf 1 augustus 2006 als te zijn afgegeven op grond van het eerste lid,
      indien deze verklaringen vanaf dat tijdstip geldig zouden zijn geweest.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel176b
  - number: 176c.1
    text: |-
      Het geschiktheidsonderzoek wordt op aanvraag van het bevoegd gezag dat voornemens is betrokkene te benoemen of
      tewerktestellen zonder benoeming, of op aanvraag van betrokkene zelf, uitgevoerd onder verantwoordelijkheid van
      het bestuur van een instelling die op grond van [artikel 176e][ref1] is erkend. Dat instellingsbestuur betrekt bij
      het geschiktheidsonderzoek het bevoegd gezag dat voornemens is betrokkene te benoemen of tewerktestellen zonder
      benoeming, of indien betrokkene de aanvraag zelf indient, een bevoegd gezag dat daartoe in overeenstemming met
      betrokkene is uitgenodigd.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel176e
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel176c
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 176e
        hoofdstuk: I
        afdeling: 11A
  - number: 176c.2
    text: 'Het geschiktheidsonderzoek omvat:'
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel176c
  - number: 176c.2.a
    text: |-
      de beoordeling of de gevolgde opleiding en de maatschappelijke of beroepservaring van betrokkene, in onderlinge
      samenhang bezien, van voldoende belang zijn in verhouding tot de door deze beoogde werkzaamheden aan een school, en
      indien dat het geval is
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel176c
  - number: 176c.2.b
    text: |-
      het onderzoek naar de geschiktheid van betrokkene voor die werkzaamheden, waartoe in ieder geval wordt gerekend de
      beoordeling of betrokkene in de feitelijke klassituatie tot verantwoord lesgeven in staat is, alsmede
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel176c
  - number: 176c.2.c
    text: |-
      de beoordeling, welke scholing en begeleiding voor betrokkene noodzakelijk moeten worden geacht om met goed gevolg
      deel te kunnen nemen aan het bekwaamheidsonderzoek.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel176c
  - number: 176c.3
    text: 'Uit de aanvraag voor het geschiktheidsonderzoek blijkt dat betrokkene in het bezit is van:'
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel176c
  - number: 176c.3.a
    text: |-
      een getuigschrift van met goed gevolg afgelegd afsluitend examen van een opleiding
      in het wetenschappelijk onderwijs of in het hoger beroepsonderwijs als bedoeld in de
      [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1], dan wel van een erkenning van
      beroepskwalificaties als bedoeld in [artikel 5 van de Algemene wet erkenning EU-beroepskwalificaties][ref2], of


      [ref1]: https://wetten.overheid.nl/BWBR0005682
      [ref2]: https://wetten.overheid.nl/BWBR0023066#Artikel5
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel176c
    references:
      - id: ref1
        bwb_id: BWBR0005682
      - id: ref2
        bwb_id: BWBR0023066
        artikel: '5'
  - number: 176c.3.b
    text: |-
      een buitenlands getuigschrift dat naar het oordeel van het bestuur van de instelling die het geschiktheidsonderzoek
      uitvoert, gelijkwaardig is aan een getuigschrift als bedoeld onder a.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel176c
  - number: 176c.4
    text: |-
      Het in het tweede lid, onder b, bedoelde onderzoek is erop gericht, vast te stellen of betrokkene in voldoende
      mate beschikt over kennis, inzicht en vaardigheden om te kunnen worden belast met het geven van onderwijs dat
      voldoet aan de daaraan gestelde kwaliteitseisen, in aanmerking nemend dat betrokkene in de periode van benoeming
      of tewerkstelling zonder benoeming begeleid en verder geschoold zal worden om met goed gevolg deel te kunnen nemen
      aan het bekwaamheidsonderzoek. De in de eerste volzin bedoelde kennis en vaardigheden en het in die volzin bedoelde
      inzicht zijn afgeleid van de in [artikel 32a, eerste lid][ref1], bedoelde bekwaamheidseisen en omvatten in het
      bijzonder beroepsmatige vaardigheden.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel32a
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel176c
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 32a
        hoofdstuk: I
        paragraaf: '3'
        afdeling: '1'
  - number: 176c.5
    text: 'Het geschiktheidsonderzoek is zodanig ingericht dat daarbij in gelijke mate zijn betrokken:'
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel176c
  - number: 176c.5.a
    text: personen die zijn belast of belast zijn geweest met het geven van onderwijs aan een lerarenopleiding, alsmede
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel176c
  - number: 176c.5.b
    text: |-
      leraren in het desbetreffende vak of vakgebied, niet zijnde personeelsleden van het bevoegd gezag dat is betrokken
      bij het geschiktheidsonderzoek.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel176c
  - number: 176c.6
    text: |-
      Ten behoeve van het uitvoeren van het geschiktheidsonderzoek is de aanvrager aan de instelling die het onderzoek
      zal verrichten, een bij ministeriële regeling vast te stellen bijdrage verschuldigd.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel176c
  - number: 176d.1
    text: |-
      Het instellingsbestuur van een instelling voor hoger onderwijs die werkzaamheden uitvoert als bedoeld in artikel
      176g, eerste lid, onder a, is partij bij de in artikel 38a, eerste lid, bedoelde overeenkomst.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel176d
  - number: 176d.2
    text: |-
      Indien na het sluiten van die overeenkomst blijkt dat de scholing of begeleiding niet volgens de overeenkomst kan
      worden uitgevoerd, treft dat instellingsbestuur tijdig een toereikende vervangende voorziening.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel176d
  - number: 176e.1
    text: |-
      Onze Minister kan op aanvraag van het bestuur een instelling erkennen als bevoegd tot het uitvoeren of onder zijn
      verantwoordelijkheid doen uitvoeren van het geschiktheidsonderzoek. Erkenning vindt plaats indien het bestuur in
      zijn aanvraag ten genoegen van Onze Minister aantoont dat de instelling het geschiktheidsonderzoek onafhankelijk,
      deskundig en betrouwbaar zal uitvoeren. Bij algemene maatregel van bestuur kunnen regels worden vastgesteld met
      betrekking tot de toepassing van de tweede volzin, waaronder regels over de behandeling en beoordeling van de
      aanvraag. Een erkende instelling heeft tevens de bevoegdheid tot het verstrekken van geschiktheidsverklaringen op
      grond van het geschiktheidsonderzoek en tot het doen van voorstellen over de noodzakelijke scholing en begeleiding,
      met inachtneming van [artikel 176c, tweede lid, onder c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel176c
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel176e
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 176c
        hoofdstuk: I
        afdeling: 11A
  - number: 176e.2
    text: |-
      Ten behoeve van de behandeling van aanvragen om erkenning kan Onze Minister een bij ministeriële regeling te
      bepalen bijdrage verlangen van het bestuur van de instelling.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel176e
  - number: 176e.3
    text: |-
      Onze Minister kan de erkenning intrekken indien de instelling, bedoeld in het eerste lid, naar het oordeel van Onze
      Minister het geschiktheidsonderzoek niet langer onafhankelijk, deskundig of betrouwbaar uitvoert.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel176e
  - number: 176e.4
    text: |-
      Instellingen voor hoger onderwijs die op 31 juli 2006 op grond van de
      [Interimwet zij-instroom leraren primair en voortgezet onderwijs][ref1] bevoegd waren tot het verrichten van een
      geschiktheidsonderzoek worden aangemerkt als instellingen met een erkenning als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0011469
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel176e
    references:
      - id: ref1
        bwb_id: BWBR0011469
  - number: 176f
    text: |-
      Het bekwaamheidsonderzoek strekt ertoe, vast te stellen of de leraar voldoet aan de in artikel 32a, eerste lid,
      bedoelde bekwaamheidseisen voor het onderwijs waarvoor die eisen zijn vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel176f
  - number: 176g.1
    text: |-
      Het instellingsbestuur van een instelling voor hoger onderwijs die opleidt voor het voldoen aan bekwaamheidseisen
      als bedoeld in [artikel 32a, eerste lid][ref1], en die zich daartoe bij Onze Minister heeft gemeld, is na die
      melding en onder overlegging van een plan van aanpak, bevoegd tot:


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel32a
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel176g
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 32a
        hoofdstuk: I
        paragraaf: '3'
        afdeling: '1'
  - number: 176g.1.a
    text: |-
      het verzorgen of doen verzorgen van de in [artikel 176c, tweede lid, onder c][ref1], bedoelde scholing en
      begeleiding, voor zover deze verband houden met opleidingen die de instelling verzorgt, of


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel176c
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel176g
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 176c
        hoofdstuk: I
        afdeling: 11A
  - number: 176g.1.b
    text: |-
      het uitvoeren of onder zijn verantwoordelijkheid doen uitvoeren van bekwaamheidsonderzoek, voor zover de instelling
      opleidt voor het desbetreffende getuigschrift, dan wel
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel176g
  - number: 176g.1.c
    text: zowel de onder a als de onder b bedoelde activiteiten.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel176g
  - number: 176g.2
    text: |-
      Het instellingsbestuur van een instelling voor hoger onderwijs die op grond van het eerste lid, onder b, bevoegd
      is tot het uitvoeren van het bekwaamheidsonderzoek, stelt de leraar die zich daartoe heeft gemeld en voor wie de
      scholing en begeleiding zijn afgerond overeenkomstig de in [artikel 38a][ref1] bedoelde overeenkomst, tijdig in de
      gelegenheid deel te nemen aan dat onderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel38a
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel176g
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 38a
        hoofdstuk: I
        paragraaf: '3'
        afdeling: '1'
  - number: 176g.3
    text: |-
      Het instellingsbestuur kan bepalen dat de aanvrager van het bekwaamheidsonderzoek aan dat bestuur een bijdrage is
      verschuldigd voor uitvoering van dat onderzoek. Bij ministeriële regeling kan voor deze bijdrage een maximum worden
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel176g
  - number: 176g.4
    text: |-
      Een melding, gedaan voor 1 augustus 2006 onder overlegging van een plan van aanpak als bedoeld in
      [artikel 7, eerste lid, van de Interimwet zij-instroom leraren primair en voortgezet onderwijs][ref1], zoals dat
      artikel luidde op 31 juli 2006, geldt als te zijn gedaan op grond van het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0011469#Artikel7
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel176g
    references:
      - id: ref1
        bwb_id: BWBR0011469
        artikel: '7'
  - number: 176h.1
    text: |-
      Het in [artikel 176e][ref1] en het in [artikel 176g][ref2] bedoelde bestuur dragen zorg voor de kwaliteit van de
      werkzaamheden van de instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel176e
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel176g
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel176h
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 176e
        hoofdstuk: I
        afdeling: 11A
      - id: ref2
        bwb_id: BWBR0003420
        artikel: 176g
        hoofdstuk: I
        afdeling: 11A
  - number: 176h.2
    text: |-
      Onze Minister kan een instelling een of meer van de in [artikel 176e][ref1] of [artikel 176g, eerste lid][ref2],
      bedoelde bevoegdheden ontnemen indien gebleken is dat de kwaliteit van de uitoefening daarvan tekortschiet,
      dan wel indien niet of niet meer wordt voldaan aan het terzake bij en krachtens deze wet bepaalde.
      [Artikel 6.10, vierde lid, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref3] is van
      overeenkomstige toepassing ten aanzien van de ontneming.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel176e
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel176g
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel6
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel176h
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 176e
        hoofdstuk: I
        afdeling: 11A
      - id: ref2
        bwb_id: BWBR0003420
        artikel: 176g
        hoofdstuk: I
        afdeling: 11A
      - id: ref3
        bwb_id: BWBR0005682
        artikel: '6'
  - number: 176i.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere voorschriften vastgesteld voor de uitvoering van
      artikel 176c, tweede lid onder b, en vierde lid.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel176i
  - number: 176i.2
    text: |-
      Tevens kunnen bij of krachtens de in het eerste lid bedoelde algemene maatregel van bestuur voorschriften worden
      vastgesteld voor de uitvoering van deze afdeling, waaronder in elk geval voorschriften met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel176i
  - number: 176i.2.a
    text: waarborging van de kwaliteit van het geschiktheidsonderzoek en van de instellingen die dat onderzoek uitvoeren,
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel176i
  - number: 176i.2.b
    text: |-
      de scholing en begeleiding, en het bekwaamheidsonderzoek, waaronder voorschriften ter waarborging van de kwaliteit,
      alsmede
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel176i
  - number: 176i.2.c
    text: de procedure voor het aanvragen van het geschiktheidsonderzoek en voor afgifte van de geschiktheidsverklaring.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel176i
  - number: 176i.3
    text: |-
      De algemene maatregel van bestuur, bedoeld in het eerste lid, wordt aan de beide Kamers der Staten-Generaal
      overgelegd. De maatregel treedt niet in werking dan nadat vier weken na de overlegging zijn verstreken en niet door
      of namens een van beide Kamers de wens wordt te kennen gegeven dat het in die maatregel geregelde onderwerp bij de
      wet wordt geregeld. Alsdan wordt een daartoe strekkend wetsvoorstel zo spoedig mogelijk ingediend.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel176i
  - number: 176j
    text: |-
      Het in [artikel 176e][ref1] en het in [artikel 176g][ref2] bedoelde bestuur verstrekken aan Onze Minister alle
      inlichtingen die deze nodig acht ten behoeve van een goede naleving van deze afdeling. Op verzoek van de inspectie
      zendt het bestuur een overzicht van afgegeven geschiktheidsverklaringen en bekwaamheidsonderzoeken waaraan met goed
      gevolg is deelgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel176e
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel176g
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel176j
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 176e
        hoofdstuk: I
        afdeling: 11A
      - id: ref2
        bwb_id: BWBR0003420
        artikel: 176g
        hoofdstuk: I
        afdeling: 11A
  - number: 176k.1
    text: |-
      Met het oog op verbetering van de kwaliteit, toegankelijkheid of doelmatigheid van het basisonderwijs kan bij wijze
      van experiment bij algemene maatregel van bestuur worden afgeweken van [hoofdstuk I, titel I, artikelen 1][ref1]
      en [2][ref2], [titel II, afdeling 1][ref3], [afdeling 2, artikelen 47][ref4] en [48][ref5], en
      [titel IV, afdeling 1][ref6], [2][ref7], [4 tot en met 7][ref8], [afdeling 8, paragrafen 2][ref9], [3][ref10],
      [6][ref11] en [7][ref12] en [afdeling 9 paragrafen 1][ref13] en [2][ref14], van de wet.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0003420#HoofdstukI
