        artikel: 17d
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '1'
  - number: 194d.2
    text: |-
      Een verzoek om voor bekostiging in aanmerking te worden gebracht als
      samenwerkingsschool wordt uiterlijk twee volledige schooljaren na inwerkingtreding van
      de__REF000_________________________________________________________________________________________________________
      ___________________________________________________________________________________________ ingediend bij Onze
      Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0039948
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel194d
    references:
      - id: ref1
        bwb_id: BWBR0039948
  - number: 194d.3
    text: |-
      Onze Minister willigt het verzoek in indien ten tijde van de samenvoeging werd voldaan aan
      [artikel 17d, eerste tot en met derde lid][ref1], zoals dat artikel luidt na de inwerkingtreding van
      [artikel I, onderdeel D, van de in het tweede lid genoemde wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel17d
      [ref2]: https://wetten.overheid.nl/BWBR0039948#ArtikelI
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel194d
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 17d
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0039948
        artikel: I
  - number: 194d.4
    text: |-
      Dit artikel vervalt met ingang van 1 augustus van het vijfde schooljaar na inwerkingtreding van de in het tweede
      lid genoemde [wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0039948
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel194d
    references:
      - id: ref1
        bwb_id: BWBR0039948
  - number: 194e.1
    text: |-
      Na inwerkingtreding van de Wet van 20 mei 2020 tot wijziging van diverse onderwijswetten door het wijzigen van de
      systematiek van het in aanmerking brengen voor bekostiging van nieuwe openbare en bijzondere scholen zodat er meer
      ruimte is voor een nieuw onderwijsaanbod (Wet meer ruimte voor nieuwe scholen) (Stb. 2020, 160) vindt nog één maal
      vaststelling plaats van een plan van scholen conform [titel IV, afdeling 2][ref1], zoals luidend direct voorafgaand
      aan de datum van inwerkingtreding van genoemde wet.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#HoofdstukI
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel194e
    references:
      - id: ref1
        bwb_id: BWBR0003420
        hoofdstuk: I
        afdeling: '2'
  - number: 194e.2
    text: |-
      Een school die is vermeld op het laatste plan van scholen dat is vastgesteld en door Onze Minister is goedgekeurd
      voor inwerkingtreding van de in het eerste lid genoemde wet en ten aanzien waarvan op dat tijdstip nog niet is
      beslist over aanvang van de bekostiging of die is vermeld op het plan van scholen dat is vastgesteld op grond van
      het eerste lid, wordt aangemerkt als een school waarvoor Onze Minister op grond van [artikel 75, derde lid][ref1],
      zoals luidend op de dag van inwerkingtreding van artikel I, onderdeel D, van de in het eerste lid genoemde wet
      heeft beslist dat zij voor bekostiging uit ’s Rijks kas in aanmerking wordt gebracht. Artikel 75, zesde, zevende en
      achtste lid, is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel75
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel194e
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '75'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '2'
  - number: 194e.3
    text: |-
      Op geschillen die in beroep aanhangig zijn of binnen de beroepstermijn dan wel verschoonbaar daarbuiten aanhangig
      worden gemaakt tegen besluiten die zijn genomen door Onze Minister op grond van het eerste lid of op grond van
      [titel IV, afdeling 2][ref1], en daarop berustende bepalingen zoals luidend op de dag voor de inwerkingtreding
      van de desbetreffende onderdelen van de in het eerste lid genoemde wet blijven de op die datum geldende regelingen
      van toepassing. Indien de uitspraak op een beroep als bedoeld in [artikel 80][ref2] zoals luidend voor de
      inwerkingtreding van de in het eerste lid genoemde wet strekt tot opneming van een school in het plan van scholen,
      is het tweede lid van overeenkomstige toepassing. De eerste volzin is hangende het, beroep van overeenkomstige
      toepassing op de bevoegdheid tot het intrekken en vervangen van besluiten die tot de aldaar bedoelde geschillen
      hebben geleid.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#HoofdstukI
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel80
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel194e
    references:
      - id: ref1
        bwb_id: BWBR0003420
        hoofdstuk: I
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '80'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '2'
  - number: 194e.4
    text: |-
      Het derde lid is van overeenkomstige toepassing op geschillen die betrekking hebben op de toepassing van
      [artikel 84a][ref1], zoals dat luidde op de dag voor de inwerkingtreding van de desbetreffende onderdelen van de in
      het eerste lid genoemde wet.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel84a
