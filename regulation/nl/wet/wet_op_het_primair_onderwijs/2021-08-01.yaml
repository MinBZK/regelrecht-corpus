    text: |-
      Grondslag voor de bekostiging van de in het eerste en tweede lid bedoelde kosten zijn de voor het desbetreffende
      jaar vastgestelde bedragen.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel134
  - number: '134.4'
    text: |-
