        bwb_id: BWBR0003420
        artikel: '158'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '9'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '153'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '9'
  - number: '192.1'
    text: |-
      Besparingen voor het Rijk als gevolg van de vermindering van het aantal basisscholen door de Tijdelijke wet
      bekostiging nieuwe basisscholen en de [wet van 15 december 1993][ref1], Stb. 716, worden, voor zover deze een
      extra bijdrage aan het Gemeentefonds, bedoeld in artikel 3 van de Financiële-verhoudingswet 1984, in verband
      met extra uitgaven op grond van artikel 45 van de Wet op het basisonderwijs als gevolg van die vermindering
      overstijgen, door het Rijk besteed ten behoeve van het basisonderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0006321
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel192
    references:
      - id: ref1
        bwb_id: BWBR0006321
  - number: '192.2'
    text: |-
      De besparingen als gevolg van de vermindering van het aantal basisscholen worden jaarlijks bepaald door de kosten
      van het aantal door het Rijk bekostigde basisscholen op 1 augustus van dat jaar te vergelijken met de kosten van
      het aantal bassischolen dat naar verwachting zou worden bekostigd zonder de inwerkingtreding van de Tijdelijke wet
      bekostiging nieuwe basisscholen en de [wet van 15 december 1993][ref1], Stb. 716, te weten: per 1 augustus 1992
      8436 basisscholen, per 1 augustus 1993 8416 basisscholen, per 1 augustus 1994 8396 basisscholen, per 1 augustus
      1995 8376 basisscholen, per 1 augustus 1996 en daaropvolgende jaren 8356 basisscholen.


      [ref1]: https://wetten.overheid.nl/BWBR0006321
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel192
    references:
      - id: ref1
        bwb_id: BWBR0006321
  - number: '192.3'
    text: |-
      De ingevolge het tweede lid voor de jaren 1994 en volgende berekende besparingen worden telkens verwerkt in de
      Rijksbegroting voor het daaropvolgende jaar.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel192
  - number: '192.4'
    text: |-
      Over de besteding van de besparingen vindt overleg plaats met de landelijke organisaties van schoolbesturen, de
      Vereniging van Nederlandse Gemeenten, de landelijke organisaties van ouders en de landelijke organisaties van
      onderwijspersoneel
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel192
  - number: '193.1'
    text: |-
      Ten aanzien van de bijdrage die een gemeente in de ontslaguitkeringskosten dient te verstrekken bij of krachtens
      artikel 102 van de Wet op de onderwijsverzorging zoals die voorschriften luidden op 31 december 1997, blijven die
      voorschriften van kracht gedurende de periode waarover ontslaguitkeringen worden uitgekeerd.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel193
  - number: '193.2'
    text: |-
      Een schoolbegeleidingsdienst dient aan Onze Minister op diens verzoek de kosten van werkloosheidsuitkeringen of
      herplaatsingswachtgelden te voldoen:
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel193
  - number: 193.2.a
    text: |-
      voor zover het betreft uitkeringen die zijn ontstaan voor 1 januari 1998: indien die kosten bij of krachtens de
      artikelen 90 en 102 van de Wet op de onderwijsverzorging zoals die voorschriften luidden op 31 december 1997,
      zouden worden ingehouden op de rijksvergoeding aan die schoolbegeleidingsdienst, en
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel193
  - number: 193.2.b
    text: |-
      voor zover het betreft uitkeringen die zijn ontstaan na 31 december 1997: indien de rechtspersoon, bedoeld in
      artikel 114b van de Wet op het basisonderwijs, zoals die bepaling luidde ten tijde van deze uitkeringen, op
      een daartoe strekkend verzoek van het bestuur van de schoolbegeleidingsdienst, voorafgaand aan het ontslag niet
      heeft ingestemd met het ten laste van die rechtspersoon brengen van de kosten van werkloosheidsuitkeringen of
      herplaatsingswachtgelden.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel193
  - number: '194.1'
    text: |-
      Met betrekking tot de op 31 december 1997 door het Rijk nog niet vastgestelde of uitgekeerde bedragen, blijven van
      toepassing de bij of krachtens de Wet op de onderwijsverzorging gegeven voorschriften die betrekking hebben op de
      schoolbegeleidingsdiensten, bedoeld in Hoofdstuk II, Titel II, van die wet.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel194
  - number: '194.2'
    text: |-
      Met betrekking tot de op 31 december 2001 door het Rijk nog niet vastgestelde of uitgekeerde bedragen, blijven
      van toepassing de bij of krachtens [artikel V, Titel A, van de wet van 15 mei 1997][ref1], Stb. 252, gegeven
      voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0008684#ArtikelV
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel194
    references:
      - id: ref1
        bwb_id: BWBR0008684
        artikel: V
  - number: 194b
    text: |-
      Op geschillen die in bezwaar, beroep of hoger beroep aanhangig zijn of binnen de bezwaar- dan wel beroepstermijn
      dan wel verschoonbaar daarbuiten aanhangig worden gemaakt tegen besluiten van de gemeente inzake bouwkundige
      aanpassingen die zijn genomen voor de inwerkingtreding van artikel I van de Wet van 7 mei 2014 houdende wijziging
      van de Wet op het primair onderwijs, de Wet op de expertisecentra en de Wet primair onderwijs BES in verband met
      de overheveling van taak en budget voor aanpassingen in onderwijshuisvesting van gemeente naar school (Stb. 175) op
      grond van bepalingen bij of krachtens [hoofdstuk I, titel IV, afdeling 3, van deze wet][ref1], zoals luidend op de
      dag voor de inwerkingtreding van artikel I van die wet, blijven de op die datum geldende regelingen van toepassing.
      De eerste volzin is hangende het bezwaar, beroep of hoger beroep van overeenkomstige toepassing op de bevoegdheid
      tot het intrekken en vervangen van besluiten die tot de aldaar bedoelde geschillen hebben geleid.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#HoofdstukI
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel194b
    references:
      - id: ref1
        bwb_id: BWBR0003420
        hoofdstuk: I
        afdeling: '3'
  - number: 194c.1
    text: |-
      Aanvragen als bedoeld in [artikel 94 van deze wet][ref1], voor zover betreft voorzieningen als bedoeld in
      [artikel 92, eerste lid, onderdeel b, van deze wet][ref2] zoals luidend op de dag voor de inwerkingtreding
      van artikel I van de Wet van 7 mei 2014 houdende wijziging van de Wet op het primair onderwijs, de Wet op de
      expertisecentra en de Wet primair onderwijs BES in verband met de overheveling van taak en budget voor aanpassingen
      in onderwijshuisvesting van gemeente naar school (Stb. 175), die worden ingediend na de inwerkingtreding van
      artikel I van die wet, blijven buiten behandeling.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel94
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel92
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel194c
