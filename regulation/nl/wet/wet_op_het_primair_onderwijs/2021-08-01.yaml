        afdeling: '3'
  - number: 194c.2
    text: |-
      Het programma huisvestingsvoorzieningen dat op grond van [artikel 95 van deze wet][ref1] is vastgesteld voor
      het jaar waarin artikel I van de Wet van 7 mei 2014 houdende wijziging van de Wet op het primair onderwijs, de
      Wet op de expertisecentra en de Wet primair onderwijs BES in verband met de overheveling van taak en budget voor
      aanpassingen in onderwijshuisvesting van gemeente naar school (Stb. 175) in werking treedt, vervalt voor zover het
      betreft voorzieningen als bedoeld in [artikel 92, eerste lid, onderdeel b, van deze wet][ref2] zoals luidend op de
      dag voor de inwerkingtreding van artikel I van die wet.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel95
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel92
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel194c
