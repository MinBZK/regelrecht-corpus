        paragraaf: '1'
        afdeling: '9'
  - number: '153.3'
    text: |-
      De beëindiging van de bekostiging van een bijzondere school of de opheffing van een openbare school geschiedt met
      ingang van 1 augustus volgend op de 3 achtereenvolgende schooljaren, bedoeld in het eerste lid. De beëindiging van
      de bekostiging van een bijzondere school of de opheffing van een openbare school ten aanzien waarvan gedurende de
      eerste 8 schooljaren van de bekostiging van de school het eerste lid, tweede volzin, toepassing diende te vinden,
      geschiedt met ingang van 1 augustus volgend op die 8 schooljaren.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel153
  - number: '153.4'
    text: |-
      Indien het aantal leerlingen van een bijzondere school of een openbare school, voor zover het niet betreft het
      aantal leerlingen van een nevenvestiging, in het derde schooljaar van de 3 achtereenvolgende schooljaren, bedoeld
      in het eerste lid, gelijk is aan of meer bedraagt dan 50 en de school, daaronder niet begrepen een nevenvestiging,
      binnen een straal van 5 km de laatste school van de richting is onderscheidenlijk de laatste openbare school is,
      wordt de bekostiging van de bijzondere school niet beëindigd of de openbare school niet opgeheven op grond van dit
      artikel, mits het bevoegd gezag tijdig de in [artikel 160, tweede lid][ref1], bedoelde mededeling heeft gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel160
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel153
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '160'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '9'
  - number: '153.5'
    text: |-
      Indien binnen 10 km van een school waarbinnen openbaar onderwijs wordt gegeven, over de weg gemeten geen school
      aanwezig is waarbinnen openbaar onderwijs wordt gegeven en aan het volgen van openbaar onderwijs behoefte bestaat,
      wordt de eerstgenoemde school niet opgeheven op grond van dit artikel.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel153
  - number: '153.6'
    text: 'Het vierde lid is niet van toepassing, indien:'
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel153
  - number: 153.6.a
    text: de school meer dan een richting heeft; of
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel153
  - number: 153.6.b
    text: |-
      indien binnen een periode van vijf jaar voorafgaand aan de datum waarop de bekostiging op grond van het derde
      lid zou worden beëindigd, een melding is gedaan als bedoeld in [artikel 170, derde lid][ref1], tenzij die melding
      voortvloeide uit een omzetting van bijzonder onderwijs naar openbaar onderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel170
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel153
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '170'
        hoofdstuk: I
        afdeling: '11'
  - number: '154'
    text: |-
      Voor iedere gemeente wordt, op basis van de leerlingdichtheid in die gemeente, een opheffingsnorm vastgesteld
      aan de hand van de formule: Opheffingsnorm = 0,6 x (leerlingdichtheid : (0,15 + 0,0027 x leerlingdichtheid)) De
      uitkomst van de berekening wordt afgerond, waarbij de decimalen worden verwaarloosd indien het eerste cijfer achter
      de komma kleiner is dan 5 en waarbij de decimalen worden verwaarloosd en het getal verhoogd met 1 indien het eerste
      cijfer achter de komma gelijk is aan of groter is dan 5. De opheffingsnorm bedraagt minimaal 23 en maximaal 200.
      De leerlingdichtheid is de uitkomst van het aantal inwoners van 4 tot en met 11 jaar in die gemeente gedeeld door
      het aantal km2 grondoppervlakte van die gemeente. Indien het aantal km2 van de gemeente minder bedraagt dan 10 km2,
      wordt voor de berekening van de leerlingdichtheid uitgegaan van 10 km2. De leerlingdichtheid bedraagt maximaal 500.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel154
  - number: '155.1'
    text: |-
      Burgemeester en wethouders kunnen, indien elk bevoegd gezag dat een of meer scholen in de gemeente in stand houdt
      schriftelijk heeft verklaard daarmee in te stemmen, besluiten dat het grondgebied van de gemeente in twee bij
      dat besluit vastgestelde delen wordt gesplitst in verband met aanzienlijke verschillen in bebouwingskarakter en
      bevolkingsdichtheid tussen die delen. De grenzen van de delen van de gemeente die zijn ontstaan als gevolg van
      toepassing van de eerste volzin, vallen samen met grenzen van gebieden in die gemeente die zijn opgenomen in
      de jaarlijkse publikatie van het Centraal Bureau voor de Statistiek «De landelijke wijk- en buurtindeling». Het
      besluit is gedurende 20 jaar van kracht behoudens het gestelde in het vijfde lid.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel155
  - number: '155.2'
    text: |-
      Burgemeester en wethouders brengen Onze Minister binnen vier weken na het nemen van het besluit, bedoeld in
      het eerste lid, op de hoogte van dat besluit, waarbij tevens mededeling wordt gedaan van de begrenzing van de
      beide gebiedsdelen, de oppervlakte daarvan en het aantal 4- tot en met 11-jarigen dat daarbinnen woonachtig is.
      Na ontvangst van een mededeling als bedoeld in de eerste volzin wordt bij ministeriële regeling voor de beide
      gebiedsdelen een afzonderlijke opheffingsnorm vastgesteld. De opheffingsnorm voor elk deel wordt vastgesteld op
      de wijze als aangegeven in [artikel 154][ref1], met dien verstande dat bij het bepalen van de leerlingdichtheid
      wordt uitgegaan van het aantal km2 grondoppervlakte van het desbetreffende deel en dat de vijfde volzin van
      artikel 154 niet van toepassing is. De ministeriële regeling wordt overeenkomstig [artikel 153, tweede lid][ref2],
      bekendgemaakt en is voor de eerste maal van toepassing met ingang van 1 augustus, volgend op die bekendmaking.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel154
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel153
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel155
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '154'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '9'
