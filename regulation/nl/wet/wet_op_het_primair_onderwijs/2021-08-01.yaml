        afdeling: '4'
  - number: '145.4'
    text: |-
      Indien een gemeente gedurende een gedeelte van het desbetreffende tijdvak een of meer basisscholen
      onderscheidenlijk speciale scholen voor basisonderwijs in stand houdt, wordt voor het vaststellen van het
      overschrijdingsbedrag, bedoeld in het eerste lid, uitgegaan van het totaal van de ontvangsten van een niet door de
      gemeente in stand gehouden school over een overeenkomstig gedeelte van het desbetreffende tijdvak.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel145
  - number: '147'
    text: |-
      Aan het bevoegd gezag van de niet door de gemeente in stand gehouden scholen wordt een afschrift gezonden
      van de besluiten van burgemeester en wethouders tot vaststelling van de mate waarin meer dan wel minder
      uitgaven worden gedaan, bedoeld in [artikel 143, eerste lid][ref1], tot verlening van het voorschot,
      bedoeld in [artikel 143, tweede of derde lid][ref2], en tot voorlopige en definitieve vaststelling van het
      overschrijdingsbedrag, bedoeld in [artikel 144, zesde en zevende lid][ref3]. Daarbij is opgenomen een staat van
      voorzieningen als bedoeld in [artikel 144, eerste lid onder j][ref4], waarin per kalenderjaar wordt aangegeven het
      verloop van de toevoegingen en de onttrekkingen aan de voorzieningen. De toezending geschiedt binnen 2 weken na
      de dag waarop burgemeester en wethouders een besluit als bedoeld in de eerste volzin hebben genomen. Het bevoegd
      gezag van een niet door de gemeente in stand gehouden school kan tegen een besluit als bedoeld in de eerste volzin
      administratief beroep instellen bij gedeputeerde staten.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel143
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel143
