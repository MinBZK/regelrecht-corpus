        paragraaf: '1'
        afdeling: '2'
  - number: 194e.5
    text: Bij ministeriële regeling kunnen nadere uitvoeringsvoorschriften worden gesteld.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel194e
  - number: 194f.1
    text: |-
      Op aanvragen die voor de datum van inwerkingtreding van artikel I, onderdeel C, van de Wet tot wijziging van
      diverse onderwijswetten door het wijzigen van de systematiek van het in aanmerking brengen voor bekostiging van
      nieuwe openbare en bijzondere scholen zodat er meer ruimte is voor een nieuw onderwijsaanbod (Wet meer ruimte voor
      nieuwe scholen) (Stb. 2020, 160) zijn ingediend op grond van [artikel 64b][ref1] blijft [artikel 64c][ref2] zoals
      dat artikel luidde op de dag voor de inwerkingtreding van die wet, van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel64b
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel64c
