  - number: 176k.8
    text: |-
      De voordracht voor de algemene maatregel van bestuur, bedoeld in het tweede lid, wordt niet eerder gedaan dan vier
      weken nadat het ontwerp aan beide Kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel176k
  - number: '177.1'
    text: |-
      Onze Minister kan bepalen dat geen of slechts een gedeeltelijke bekostiging wordt verstrekt voor uitgaven die het
      gevolg zijn van schuld of nalatigheid van het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel177
  - number: '177.2'
    text: |-
      Indien de uitgaven bedoeld in het eerste lid, voor bekostiging door het Rijk in aanmerking komen, treedt het Rijk
      op het moment van een uitdrukkelijk besluit tot bekostiging in alle rechten die het bevoegd gezag ter zake tegen
      derden mocht hebben.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel177
  - number: '177.3'
    text: |-
      Indien de gemeente een collectieve verzekering heeft afgesloten voor de vergoeding van schade, ontstaan aan
      gebouwen, terreinen of roerende zaken van een niet door de gemeente in stand gehouden school, heeft het bevoegd
      gezag van de desbetreffende school jegens de gemeente geen aanspraak op vergoeding van dergelijke schade, voor
      zover die collectieve verzekering de schade dekt.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel177
  - number: '177.4'
    text: |-
      Indien schade, ontstaan aan gebouwen, terreinen of roerende zaken van een niet door de gemeente in stand gehouden
      school voor vergoeding door de gemeente in aanmerking komt, treedt de gemeente op het moment van een uitdrukkelijk
      besluit tot vergoeding in alle rechten die het bevoegd gezag ter zake van die schade tegen derden mocht hebben.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel177
  - number: 178a.1
    text: |-
      Het bevoegd gezag kan het persoonsgebonden nummer van een leerling gebruiken in het verkeer met de leerling op wie
      het nummer betrekking heeft, of met de ouders van deze leerling.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel178a
  - number: 178a.4
    text: |-
      Het bevoegd gezag kan het persoonsgebonden nummer van een leerling, al dan niet tezamen met een of meer van de
      gegevens, bedoeld in [artikel 12, eerste lid, van de Wet register onderwijsdeelnemers][ref1], gebruiken in het
      verkeer met Onze Minister ten behoeve van de vaststelling van de bekostiging van de school.


      [ref1]: https://wetten.overheid.nl/BWBR0042012#Artikel12
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel178a
    references:
      - id: ref1
        bwb_id: BWBR0042012
        artikel: '12'
  - number: 178a.5
    text: |-
      Het bevoegd gezag en het hoofd, bedoeld in [artikel 1, onder d, van de Leerplichtwet 1969][ref1],
      gebruiken het persoonsgebonden nummer van een leerling in contacten met een gemeente in het kader van de
      [Leerplichtwet 1969][ref2], tezamen met de gegevens die noodzakelijk zijn voor het toezicht op de naleving van die
      wet door de gemeente.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002628
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel178a
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002628
  - number: 178a.6
    text: |-
      Het bevoegd gezag gebruikt het persoonsgebonden nummer van een leerling in het contact met een andere school of een
      school voor ander onderwijs ten behoeve van de in- en uitschrijving van die leerling en bij het overleggen van het
      onderwijskundig rapport, bedoeld in [artikel 42][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel42
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel178a
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '42'
        hoofdstuk: I
        paragraaf: '4'
        afdeling: '1'
  - number: 178a.8
    text: |-
      Het bevoegd gezag gebruikt het persoonsgebonden nummer van een leerling in het kader van de uitvoering van
      subsidieregelingen van het Europees Sociaal Fonds.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel178a
  - number: 178a.9
    text: |-
      Het bevoegd gezag verstrekt geen persoonsgebonden nummer van een leerling ter uitvoering van
      [artikel 107, tweede en vijfde lid, van de Vreemdelingenwet 2000][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel107
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel178a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '107'
  - number: 178a.10
    text: |-
      Het bevoegd gezag gebruikt het persoonsgebonden nummer van een leerling in contacten met een school als bedoeld
      in de [Wet op de expertisecentra][ref1] in het kader van de ondersteuning die deze school biedt op grond van
      [artikel 8a, eerste lid, van de Wet op de expertisecentra][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003549
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel8a
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel178a
    references:
      - id: ref1
        bwb_id: BWBR0003549
      - id: ref2
        bwb_id: BWBR0003549
        artikel: 8a
  - number: 178a.11
    text: |-
      Het bevoegd gezag kan het persoonsgebonden nummer van een leerling eenmalig gebruiken ten behoeve van het genereren
      van een pseudoniem voor deze leerling met het oog op het bieden van voorzieningen in het kader van het onderwijs
      en de begeleiding van leerlingen. Het bevoegd gezag draagt er zorg voor dat het pseudoniem wordt bewaard in de
      systemen waarin de leerlingen zijn geregistreerd.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel178a
  - number: 178a.12
    text: |-
      Het bevoegd gezag kan het pseudoniem, bedoeld in het elfde lid, gebruiken voor het genereren van een ander
      pseudoniem voor een leerling in het kader van de toegang tot en het gebruik van digitale leermiddelen of het
      digitaal afnemen van toetsen, waarbij het bevoegd gezag er zorg voor draagt dat dit andere pseudoniem wordt bewaard
      in de systemen waarin de leerlingen zijn geregistreerd. Dit andere pseudoniem wordt uitsluitend verstrekt aan
      een leverancier die een digitaal product of een digitale dienst aanbiedt bestaande uit leerstof of toetsen en de
      daarmee samenhangende digitale diensten.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel178a
  - number: 178a.13
    text: |-
      Bij algemene maatregel van bestuur kunnen andere gevallen worden aangewezen dan het geval, bedoeld in het twaalfde
      lid, waarvoor het bevoegd gezag op basis van het pseudoniem, bedoeld in het elfde lid, een ander pseudoniem kan
      genereren. Daarbij worden in ieder geval de categorieën van ontvangers van dit andere pseudoniem aangewezen.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel178a
  - number: 178a.14
    text: |-
      Bij ministeriële regeling worden regels gesteld over de voorwaarden waaronder de pseudoniemen, bedoeld in het elfde
      tot en met het dertiende lid, kunnen worden gegenereerd en gebruikt. Deze voorwaarden betreffen in ieder geval de
      duur en de beveiliging, waaronder de gescheiden opslag van de pseudoniemen.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel178a
  - number: 178e
    text: |-
      Onverminderd het overigens bij of krachtens de wet bepaalde omtrent het gebruik van het burgerservicenummer
      door de gemeente, gebruikt de gemeente het persoonsgebonden nummer van een leerling uitsluitend ten
      behoeve van een registratie van leerplichtige jongeren in het belang van het toezicht op de naleving van de
      [Leerplichtwet 1969][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002628
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel178e
    references:
      - id: ref1
        bwb_id: BWBR0002628
  - number: '179'
    text: Schoolbegeleiding vindt plaats op verzoek van het bevoegd gezag van een school.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel179
  - number: '180.1'
    text: |-
      Het Rijk verstrekt aan schoolbegeleidingsdiensten bekostiging voor activiteiten die worden verricht met betrekking
      tot de ondersteuning bij het onderwijs aan zieke leerlingen als bedoeld in [artikel 9a][ref1]. Bij ministeriële
      regeling kunnen nadere regels worden gesteld voor de bekostiging, bedoeld in de vorige volzin.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel9a
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel180
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 9a
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '1'
  - number: '180.2'
    text: |-
      Schoolbegeleidingsdiensten als bedoeld in het eerste lid, zijn de schoolbegeleidingsdiensten die
      voor de ondersteuning bij het onderwijs aan zieke leerlingen als bedoeld in [artikel 9a][ref1] in
      de periode 1 augustus 1999 tot 1 augustus 2004 subsidie ontvingen van een gemeente op grond van
      __REF001___________________________________________________________________________________________________________
      ___________________________________________________________________________________________________________________
      _______________________________________________________________________________________________________________,
      zoals dat artikel luidde op de dag direct voorafgaand aan het tijdstip waarop [die wet][ref3] is vervallen.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel9a
      [ref2]: https://wetten.overheid.nl/BWBR0010086#ArtikelIX
      [ref3]: https://wetten.overheid.nl/BWBR0010086
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel180
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 9a
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0010086
        artikel: IX
      - id: ref3
        bwb_id: BWBR0010086
  - number: 180a.1
    text: |-
      Het Rijk verstrekt jaarlijks aan het bevoegd gezag van een school, bekostiging die kan worden besteed ten behoeve
      van schoolbegeleiding.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel180a
  - number: 180a.2
    text: |-
      De bekostiging, bedoeld in het eerste lid, wordt voor elk schooljaar berekend door het aantal leerlingen op
      de teldatum 1 oktober van het voorafgaande schooljaar te vermenigvuldigen met een bedrag dat jaarlijks bij
      ministeriële regeling wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel180a
  - number: '181.1'
    text: |-
      Indien een bij of krachtens de wet gestelde termijn door het bevoegd gezag wordt overschreden en de gemeente
      daardoor geen bekostiging van het Rijk dan wel lagere bekostiging of met ingang van een latere datum bekostiging
      van het Rijk voor de materiële instandhouding ontvangt dan het geval zou zijn geweest indien deze termijn wel in
      acht was genomen, vergoedt het bevoegd gezag de door de gemeente geleden schade.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel181
  - number: '181.2'
    text: |-
      Indien een bij of krachtens de wet gestelde termijn door burgemeester en wethouders wordt overschreden en het
      bevoegd gezag daardoor geen bekostiging van het Rijk dan wel lagere bekostiging of met ingang van een latere datum
      bekostiging van het Rijk voor de materiële instandhouding ontvangt dan het geval zou zijn geweest indien deze
      termijn wel in acht was genomen, vergoedt de gemeente de door het bevoegd gezag geleden schade.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel181
  - number: '181.3'
    text: |-
      Burgemeester en wethouders en het bevoegd gezag kunnen in onderling overleg de in het eerste en tweede lid
      bedoelde verplichting tot schadevergoeding matigen. Indien dit overleg niet tot overeenstemming leidt, is
      [artikel 109 van boek 6 van het Burgerlijk Wetboek][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel109
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel181
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '109'
  - number: '182'
    text: |-
      Het bevoegd gezag van een bijzondere school is verplicht de uit de overheidskassen ontvangen gelden overeenkomstig
      de bestemming te gebruiken. Van de inkomsten en uitgaven wordt volgens bij algemene maatregel van bestuur te geven
      voorschriften nauwkeurig boekgehouden.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel182
  - number: '183.1'
    text: |-
      Het bevoegd gezag van een school onderscheidenlijk het samenwerkingsverband is aangesloten bij een door Onze
      Minister aan te wijzen rechtspersoon met volledige rechtsbevoegdheid die zich ten doel stelt waarborgen te bieden
      voor de kosten voor vervanging bij afwezigheid van personeel.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel183
  - number: '183.2'
    text: |-
      Het bevoegd gezag van een school onderscheidenlijk het samenwerkingsverband is voorts verplicht jaarlijks een door
      het bestuur van de in het eerste lid bedoelde rechtspersoon te bepalen bijdrage te voldoen aan die rechtspersoon in
      verband met de kosten voor vervanging.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel183
  - number: '183.3'
    text: |-
      Van de in het eerste juncto tweede lid bedoelde verplichting kan Onze Minister op aanvraag van het bevoegd gezag
      ontheffing verlenen op grond van bezwaren van godsdienstige of levensbeschouwelijke aard. Onze Minister verleent
      de ontheffing slechts indien het bevoegd gezag aantoont dat een afdoende andere voorziening is getroffen met
      betrekking tot de gevolgen van vervanging bij afwezigheid van personeel. Onze Minister besluit binnen zes maanden
      na ontvangst van een aanvraag als bedoeld in de eerste volzin.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel183
  - number: '183.4'
    text: Het bestuur van de rechtspersoon kan regels vaststellen ter uitvoering van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel183
  - number: '183.5'
    text: |-
      Uit 's Rijks kas wordt jaarlijks een door Onze Minister te bepalen bedrag betaald aan de rechtspersoon, bedoeld in
      het eerste lid, in verband met de kosten, bedoeld in dat lid onder b.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel183
  - number: '183.6'
    text: |-
      Op de rechtspersoon, bedoeld in het eerste lid, is de [Kaderwet zelfstandige bestuursorganen][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020495
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel183
    references:
      - id: ref1
        bwb_id: BWBR0020495
  - number: 183a.1
    text: |-
      De rechtspersoon, bedoeld in [artikel 183][ref1], kan het burgerservicenummer van het personeelslid dat bij
      afwezigheid wordt vervangen, en van degene die het personeelslid tijdelijk vervangt, uitsluitend in het kader van
      het doel, bedoeld in artikel 183, eerste lid, onderdeel a, gebruiken in het verkeer met:


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel183
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel183a
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '183'
        hoofdstuk: I
        afdeling: '12'
  - number: 183a.1.a
    text: het personeelslid onderscheidenlijk degene die het personeelslid tijdelijk vervangt,
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel183a
  - number: 183a.1.b
    text: |-
      het bevoegd gezag van de school dan wel het samenwerkingsverband waar de in onderdeel a bedoelde personen werkzaam
      zijn,
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel183a
  - number: 183a.1.c
    text: Onze Minister,
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel183a
  - number: 183a.1.d
    text: |-
      de instantie, bedoeld in [artikel 184, vijfde lid][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel184
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel183a
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '184'
        hoofdstuk: I
        afdeling: '12'
  - number: 183a.1.e
    text: |-
      het Uitvoeringsinstituut werknemersverzekeringen, genoemd in
      [hoofdstuk 5 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel183a
    references:
      - id: ref1
        bwb_id: BWBR0013060
        hoofdstuk: '5'
  - number: 183a.2
    text: |-
      Het burgerservicenummer wordt op een daartoe strekkend verzoek van de in het eerste lid bedoelde rechtspersoon
      aan die rechtspersoon verstrekt door het bevoegd gezag van de school dan wel het samenwerkingsverband waar het
      personeelslid dat bij afwezigheid wordt vervangen, werkzaam is.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel183a
  - number: 183a.3
    text: |-
      Indien dat ten behoeve van het jaarverslag, bedoeld in
      [artikel 18, eerste lid, van de Kaderwet zelfstandige bestuursorganen][ref1], noodzakelijk is, worden gegevens
      daarin slechts zodanig openbaar gemaakt dat daaraan geen herkenbare gegevens over een afzonderlijk persoon
      kunnen worden ontleend, tenzij het betreft de controle op de juistheid van de gegevens in het kader van de
      controle op de rechtmatigheid en de doelmatigheid van door de rechtspersoon gedane uitgaven. Daarbij kunnen de
      burgerservicenummers worden vergeleken met de burgerservicenummers die door andere daartoe bij of krachtens de wet
      bevoegde instanties zijn verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel18
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel183a
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '18'
  - number: '184.1'
    text: |-
      Het bevoegd gezag van een school onderscheidenlijk het bestuur van een centrale dienst onderscheidenlijk
      het samenwerkingsverband is aangesloten bij een door Onze Minister aan te wijzen rechtspersoon met volledige
      rechtsbevoegdheid die zich ten doel stelt waarborgen te bieden voor de kosten van werkloosheidsuitkeringen,
      suppleties inzake arbeidsongeschiktheid alsmede uitkeringen wegens ziekte en arbeidsongeschiktheid van gewezen
      personeel anders dan op grond van de [Ziektewet][ref1] ten behoeve van gewezen personeel.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel184
    references:
      - id: ref1
        bwb_id: BWBR0001888
  - number: '184.2'
    text: |-
      Het bevoegd gezag onderscheidenlijk het bestuur van de centrale dienst onderscheidenlijk het samenwerkingsverband
      voldoet aan de rechtspersoon jaarlijks een door het bestuur van die rechtspersoon vast te stellen bijdrage in
      verband met de kosten van werkloosheidsuitkeringen, suppleties inzake arbeidsongeschiktheid alsmede uitkeringen
      wegens ziekte en arbeidsongeschiktheid van gewezen personeel anders dan op grond van de [Ziektewet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel184
    references:
      - id: ref1
        bwb_id: BWBR0004045
  - number: '184.3'
    text: |-
      Van de in het eerste en tweede lid bedoelde verplichting kan Onze Minister op aanvraag van het bevoegd gezag
      onderscheidenlijk het bestuur van de centrale dienst ontheffing verlenen op grond van bezwaren van godsdienstige of
      levensbeschouwelijke aard. Onze Minister verleent de ontheffing slechts, indien het bevoegd gezag onderscheidenlijk
      het bestuur van de centrale dienst aantoont dat een afdoende andere voorziening is getroffen met betrekking tot
      de kosten van werkloosheidsuitkeringen, suppleties inzake arbeidsongeschiktheid alsmede uitkeringen wegens ziekte
      en arbeidsongeschiktheid van gewezen personeel anders dan op grond van de [Ziektewet][ref1]. Onze Minister besluit
      binnen zes maanden na ontvangst van een aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel184
    references:
      - id: ref1
        bwb_id: BWBR0004045
  - number: '184.4'
    text: |-
      Het bestuur van de rechtspersoon stelt regels vast voor de behandeling, beoordeling en beantwoording van een
      aanvraag van het bevoegd gezag onderscheidenlijk het bestuur van de centrale dienst onderscheidenlijk het
      samenwerkingsverband als bedoeld in [artikel 138, tweede lid][ref1]. Indien het bevoegd gezag onderscheidenlijk het
      bestuur van de centrale dienst zich beroept op overwegingen van godsdienstige of levensbeschouwelijke aard, betrekt
      het bestuur van de rechtspersoon die overwegingen bij de beoordeling van de aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel138
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel184
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '138'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: '8'
  - number: '184.5'
    text: |-
      Indien het bestuur van de rechtspersoon de aanvraag heeft ingewilligd, vergoedt hij aan de instantie die de
      werkloosheidsuitkeringen, de suppleties inzake arbeidsongeschiktheid alsmede de uitkeringen wegens ziekte en
      arbeidsongeschiktheid van gewezen personeel anders dan op grond van de [Ziektewet][ref1] verstrekt of heeft
      verstrekt, de kosten van die uitkeringen of suppleties.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel184
    references:
      - id: ref1
        bwb_id: BWBR0004045
  - number: '184.6'
    text: |-
      Indien een werkloosheidsuitkering, een suppletie inzake arbeidsongeschiktheid alsmede een uitkering wegens
      ziekte en arbeidsongeschiktheid van gewezen personeel anders dan op grond van de [Ziektewet][ref1] van gewezen
      personeel van een school of een centrale dienst voortvloeit uit de inzet of een wijziging van de inzet van de
      in [artikel 120, vierde lid][ref2], en [artikel 132][ref3] bedoelde bekostiging ten opzichte van voorafgaande
      schooljaren, zijn de bevoegde gezagsorganen van alle scholen van het desbetreffende samenwerkingsverband hoofdelijk
      aansprakelijk voor het aan de rechtspersoon vergoeden van de kosten van de werkloosheidsuitkering, de suppletie
      inzake arbeidsongeschiktheid onderscheidenlijk de uitkering wegens ziekte en arbeidsongeschiktheid van gewezen
      personeel anders dan op grond van de Ziektewet.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel120
      [ref3]: https://wetten.overheid.nl/BWBR0003420#Artikel132
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel184
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '120'
        hoofdstuk: I
        afdeling: '5'
      - id: ref3
        bwb_id: BWBR0003420
        artikel: '132'
        hoofdstuk: I
        afdeling: '7'
  - number: '184.7'
    text: |-
      Tegen een besluit van de rechtspersoon kan beroep worden ingesteld door het bevoegd gezag, het bestuur van de
      centrale dienst onderscheidenlijk het samenwerkingsverband.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel184
  - number: '184.8'
    text: |-
      Op de rechtspersoon, bedoeld in het eerste lid, is de [Kaderwet zelfstandige bestuursorganen][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020495
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel184
    references:
      - id: ref1
        bwb_id: BWBR0020495
  - number: 184a.1
    text: |-
      De rechtspersoon, bedoeld in [artikel 184][ref1], kan het burgerservicenummer van het gewezen personeelslid,
      uitsluitend in het kader van het doel, bedoeld in artikel 184, eerste lid, gebruiken in het verkeer met:


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel184
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel184a
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '184'
        hoofdstuk: I
        afdeling: '12'
  - number: 184a.1.a
    text: het gewezen personeelslid,
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel184a
  - number: 184a.1.b
    text: |-
      het bevoegd gezag van de school, het bestuur van de centrale dienst dan wel het samenwerkingsverband waar de in
      onderdeel a bedoelde persoon werkzaam was,
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel184a
  - number: 184a.1.c
    text: Onze Minister, of
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel184a
  - number: 184a.1.d
    text: |-
      de instantie, bedoeld in [artikel 184, vijfde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel184
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel184a
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '184'
        hoofdstuk: I
        afdeling: '12'
  - number: 184a.2
    text: |-
      Het burgerservicenummer wordt op een daartoe strekkend verzoek van de in het eerste lid bedoelde rechtspersoon aan
      die rechtspersoon verstrekt door het bevoegd gezag van de school, het bestuur van de centrale dienst dan wel het
      samenwerkingsverband waar het gewezen personeelslid werkzaam was.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel184a
  - number: 184a.3
    text: |-
      Indien dat ten behoeve van het jaarverslag, bedoeld in
      [artikel 18, eerste lid, van de Kaderwet zelfstandige bestuursorganen][ref1], noodzakelijk is, worden gegevens
      daarin slechts zodanig openbaar gemaakt dat daaraan geen herkenbare gegevens over een afzonderlijk persoon
      kunnen worden ontleend, tenzij het betreft de controle op de juistheid van de gegevens in het kader van de
      controle op de rechtmatigheid en de doelmatigheid van door de rechtspersoon gedane uitgaven. Daarbij kunnen de
      burgerservicenummers worden vergeleken met de burgerservicenummers die door andere daartoe bij of krachtens de wet
      bevoegde instanties zijn verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel18
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel184a
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '18'
  - number: 184b.1
    text: |-
      Onze Minister verstrekt bekostiging voor het geven van het onderwijs, bedoeld in
      [artikel 50, eerste en tweede volzin][ref1], aan een rechtspersoon met volledige rechtsbevoegdheid die zich
      blijkens zijn statuten ten doel stelt het geven van onderwijs als bedoeld in artikel 50, eerste lid, eerste en
      tweede volzin, voor zover dit wordt gegeven door leraren als bedoeld in [artikel 51][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel50
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel51
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel184b
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '50'
        hoofdstuk: I
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '51'
        hoofdstuk: I
        afdeling: '2'
  - number: 184b.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels gegeven of voorwaarden worden gesteld voor de
      bekostiging van godsdienstonderwijs of levensbeschouwelijk onderwijs.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel184b
  - number: 184b.3
    text: |-
      De voordracht voor een krachtens het tweede lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel184b
  - number: '185.1'
    text: |-
      Bij algemene maatregel van bestuur worden regels gegeven, onderscheidenlijk voorwaarden gesteld, voor de
      bekostiging van scholen voor kinderen van wie de ouders een trekkend bestaan leiden, naar bij die algemene
      maatregel van bestuur aan te geven onderscheidingen.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel185
  - number: '185.2'
    text: |-
      Op de scholen bekostigd krachtens het eerste lid, zijn de bepalingen van [hoofdstuk I, titel I][ref1], van
      toepassing, tenzij bij de algemene maatregel van bestuur anders wordt bepaald. Bij de algemene maatregel van
      bestuur kunnen andere bepalingen van deze wet van overeenkomstige toepassing worden verklaard.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#HoofdstukI
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel185
    references:
      - id: ref1
        bwb_id: BWBR0003420
        hoofdstuk: I
  - number: '185.3'
    text: |-
      De algemene maatregel van bestuur bedoeld in het eerste lid, wordt aan de Tweede Kamer der Staten-Generaal
      overgelegd. De maatregel treedt niet in werking dan nadat 4 weken na de overlegging zijn verstreken en gedurende
      die termijn niet door of namens de Kamer de wens wordt te kennen gegeven dat het in die maatregel geregelde
      onderwerp bij de wet wordt geregeld. Als dan wordt een daartoe strekkend wetsontwerp zo spoedig mogelijk ingediend.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel185
  - number: '187.1'
    text: |-
      Instemming van Onze Minister is vereist ten aanzien van de statuten van de rechtspersoon, bedoeld in
      [artikel 183][ref1], alsmede ten aanzien van wijziging van die statuten.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel183
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel187
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '183'
        hoofdstuk: I
        afdeling: '12'
  - number: '187.2'
    text: |-
      Onze Minister is bevoegd tot intrekking van de aanwijzing van de rechtspersoon, bedoeld in [artikel 183][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel183
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel187
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '183'
        hoofdstuk: I
        afdeling: '12'
  - number: '187.3'
    text: 'Bij algemene maatregel van bestuur worden regels gesteld omtrent:'
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel187
  - number: 187.3.a
    text: nadere taakomschrijving van de rechtspersoon;
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel187
  - number: 187.3.b
    text: |-
      de voorwaarden voor instemming door Onze Minister met de statuten van de rechtspersoon en wijziging van deze
      statuten; en
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel187
  - number: 187.3.c
    text: de gevolgen van intrekking van de aanwijzing van de rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel187
  - number: '187.4'
    text: |-
      Krachtens bij algemene maatregel van bestuur vast te stellen voorschriften kan Onze Minister subsidie verlenen aan
      de rechtspersoon ten behoeve van:
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel187
  - number: 187.4.a
    text: |-
      bedragen die, gedurende een vooraf vastgestelde periode en tot een vooraf vastgestelde maximale
      hoogte, strekken ter vervanging van de vergoeding ten behoeve van de kosten voor vervanging, bedoeld in
      [artikel 126, eerste lid][ref1], en de bijdrage, bedoeld in [artikel 183, tweede lid][ref2], voor zover die
      betrekking heeft op de kosten van vervanging van personeel wegens voorschriften gegeven bij algemene maatregel van
      bestuur of bij ministeriële regeling,


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel126
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel183
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel187
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '126'
        hoofdstuk: I
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '183'
        hoofdstuk: I
        afdeling: '12'
  - number: 187.4.b
    text: een bijdrage aan de kosten van de bedrijfsvoering van de rechtspersoon, en
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel187
  - number: 187.4.c
    text: een bijdrage ten behoeve van de uitoefening van landelijke taken in het kader van de bedrijfsgezondheidszorg.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel187
  - number: '187.5'
    text: |-
      Bij de algemene maatregel van bestuur, bedoeld in het vierde lid, kan ten behoeve van een in dat lid bedoelde
      subsidie een subsidieplafond worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel187
  - number: '187.6'
    text: |-
      Het bestuur van de rechtspersoon kan ten behoeve van de uitoefening van landelijke taken in het kader van de
      bedrijfsgezondheidszorg subsidie aan derden verstrekken.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel187
  - number: '187.7'
    text: |-
      De algemene maatregel van bestuur, bedoeld in het derde en vierde lid, wordt aan de Tweede Kamer der Staten-
      Generaal overgelegd. De maatregel treedt niet in werking dan nadat 4 weken na de overlegging zijn verstreken
      en gedurende die termijn niet door of namens de Kamer de wens te kennen wordt gegeven dat het in die maatregel
      geregelde onderwerp bij de wet wordt geregeld. Alsdan wordt een daartoe strekkend wetsvoorstel zo spoedig mogelijk
      ingediend.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel187
  - number: '188.1'
    text: |-
      [Artikel 187][ref1] is van overeenkomstige toepassing ten aanzien van de rechtspersoon, bedoeld in
      [artikel 184][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel187
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel184
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel188
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '187'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '184'
        hoofdstuk: I
        afdeling: '12'
  - number: '188.2'
    text: |-
      Onze Minister zendt binnen vijf jaar na de aanwijzing van de rechtspersoon, bedoeld in [artikel 184][ref1], en
      vervolgens telkens na vijf jaar, aan de Tweede Kamer der Staten-Generaal een verslag over de doeltreffendheid en de
      effecten van de werkzaamheden van die rechtspersoon.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel184
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel188
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '184'
        hoofdstuk: I
        afdeling: '12'
  - number: 188a
    text: |-
      Onze Minister zendt binnen vijf jaar na de inwerkingtreding van de [artikelen 10a][ref1] en [164b][ref2], en
      vervolgens telkens na vijf jaar aan de Staten-Generaal een verslag over de doeltreffendheid en de effecten van de
      artikelen 10a en 164b in de praktijk.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel10a
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel164b
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel188a
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 10a
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: 164b
        hoofdstuk: I
        paragraaf: '3'
        afdeling: '9'
  - number: 188b
    text: |-
      Onze Minister zendt binnen vier jaar na de inwerkingtreding van
      __REF000___________________________________________________________________________________________________________
      ___________________________________________________________________________________________________________________
      ___________________________________________________________________________________________________________________
      ___________________________________________________________________________________________________________________
      __________________________________________________________________________________________ (Stb. 2014, 13)
      aan de Staten-Generaal een verslag over de doeltreffendheid en effecten van [artikel 8, zesde lid][ref2], en
      [artikel 9b][ref3] van de wet in de praktijk.


      [ref1]: https://wetten.overheid.nl/BWBR0034687#ArtikelI
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0003420#Artikel9b
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel188b
    references:
      - id: ref1
        bwb_id: BWBR0034687
        artikel: I
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '8'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0003420
        artikel: 9b
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '1'
  - number: 188c
    text: |-
      Onze Minister zendt binnen vijf jaar na de inwerkingtreding van artikel I van de Wet van 4 juni 2015 tot wijziging
      van enige onderwijswetten in verband met het invoeren van de verplichting voor scholen om zorg te dragen voor de
      veiligheid op school (Stb. 238) aan de Staten-Generaal een verslag over de doeltreffendheid en effecten van de
      [artikelen 4c][ref1] en [13, eerste lid, onderdeel n][ref2], in de praktijk.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel4c
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel13
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel188c
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 4c
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '13'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '1'
  - number: 188d
    text: |-
      Onze Minister zendt binnen vijf jaar na de inwerkingtreding van de Wet van 29 november 2017 tot wijziging
      van diverse onderwijswetten in verband met het pseudonimiseren van het persoonsgebonden nummer van een
      onderwijsdeelnemer ten behoeve van het bieden van voorzieningen in het kader van het onderwijs en de begeleiding
      van onderwijsdeelnemers (Stb. 508) aan de Staten-Generaal een verslag over de doeltreffendheid en effecten van
      [artikel 178a, elfde tot en met veertiende lid][ref1], in de praktijk.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel178a
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel188d
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 178a
        hoofdstuk: I
        afdeling: '12'
  - number: 188e
    text: |-
      Onze Minister zendt na vijf, tien en vijftien jaar na de inwerkingtreding van de Wet van 20 mei 2020 tot wijziging
      van diverse onderwijswetten door het wijzigen van de systematiek van het in aanmerking brengen voor bekostiging van
      nieuwe openbare en bijzondere scholen zodat er meer ruimte is voor een nieuw onderwijsaanbod (Wet meer ruimte voor
      nieuwe scholen) (Stb. 2020, 160) aan de Staten-Generaal een verslag over de doeltreffendheid en de effecten van de
      gewijzigde systematiek van het in aanmerking brengen voor bekostiging van nieuwe scholen in de praktijk. Daarbij
      wordt in ieder geval gelet op de effecten op de segregatie.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel188e
  - number: '189.1'
    text: |-
      Aan degene die de bevoegdheid tot het geven van onderwijs krachtens artikel 4 van de Wet op het basisonderwijs
      (Stb. 1984, 2) voor 17 april 1982 heeft verloren en deze bevoegdheid niet voordien onvoorwaardelijk is
      teruggegeven, is deze bevoegdheid alsnog teruggegeven op 17 april 1987.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel189
  - number: '189.2'
    text: |-
      Aan degene die de bevoegdheid, bedoeld in het eerste lid, vijf jaar of minder voor 17 april 1987 krachtens
      de in het eerste lid bedoelde bepalingen heeft verloren en deze bevoegdheid niet voordien onvoorwaardelijk is
      teruggegeven, is deze bevoegdheid vijf jaar na het verlies daarvan alsnog teruggegeven.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel189
  - number: '189.3'
    text: |-
      Onze Minister kan in bijzondere gevallen de bevoegdheid, bedoeld in het eerste lid, die krachtens de in het eerste
      lid bedoelde bepalingen is verloren en voor 17 april 1987 niet is teruggegeven, al dan niet onder voorwaarden, op
      schriftelijk verzoek van de betrokkene alsnog teruggeven. Deze voorwaarden vervallen vijf jaar na het verlies van
      de bevoegdheid, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel189
  - number: '190.1'
    text: |-
      De vergoeding voor een schoolterrein die voor 1 juni 1992 is aangevangen en plaatsvindt met toepassing van artikel
      98, derde lid, van de Wet op het basisonderwijs, of artikel E 29, E 32 of E 43 van de Overgangswet WBO, zoals die
      voorschriften luidden op 31 mei 1992, wordt met ingang van 1 juni 1992 gewijzigd in een vergoeding ter grootte
      van twee-derde deel van de rente op basis van een fictieve lening voor de noodzakelijk geachte kosten, met een
      lineaire aflossing en, gerekend vanaf het tijdstip waarop voor het eerst een vergoeding voor het schoolterrein werd
      verleend, een looptijd van 40 jaar. Bij de toepassing van de eerste volzin wordt gerekend met het rentepercentage
      dat zou gelden voor een lening met een lineaire aflossing en een looptijd van 20 jaar, uitgaande van een herziening
      van het rentepercentage per 1 januari volgend op een periode van 20 kalenderjaren waarin vergoeding werd verleend.
      Onze Minister is bevoegd om in verband met de rentestand tot bijstelling van een ingevolge de tweede volzin geldend
      rentepercentage over te gaan. Indien Onze Minister tot bijstelling van het rentepercentage is overgegaan, wordt
      in afwijking van de tweede volzin uitgegaan van een herziening van het rentepercentage per 1 januari volgend op
      een periode van 20 kalenderjaren sinds die bijstelling, het kalenderjaar waarin die bijstelling plaatsvond daarbij
      inbegrepen.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel190
  - number: '190.2'
    text: |-
      De vergoeding voor de niet op het schoolterrein betrekking hebbende kosten van stichting en eerste inrichting
      van een voorziening in de huisvesting bestemd voor blijvend gebruik die plaatsvindt met toepassing van artikel
      98, eerste lid, van de Wet op het basisonderwijs of artikel E 32 of E 43 van de Overgangswet WBO, zoals die
      voorschriften luidden op 31 december 1991, wordt met ingang van 1 januari 1992 vastgesteld op een vergoeding ter
      grootte van de rente en aflossing op basis van een fictieve lening voor de noodzakelijk geachte kosten met een
      lineaire aflossing en een looptijd van 60 jaar. Indien de vergoeding voor 1 januari 1992 is aangevangen, wordt
      deze met ingang van 1 januari 1992 vastgesteld op een vergoeding ter grootte van de rente en aflossing op basis van
      een fictieve lening voor de op die datum nog niet vergoede noodzakelijk geachte kosten met een lineaire aflossing
      en, gerekend vanaf 1 januari 1992, een looptijd van 60 jaar verminderd met het aantal jaren waarover reeds een
      vergoeding is verleend.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel190
  - number: '190.3'
    text: |-
      Bij de toepassing van het tweede lid wordt gerekend met het rentepercentage dat zou gelden voor een lening met een
      lineaire aflossing en een looptijd van 20 jaar, uitgaande van een herziening van het rentepercentage telkens per
      1 januari volgend op een periode van 20 kalenderjaren waarin vergoeding werd verleend. Onze Minister is bevoegd
      om in verband met de rentestand tot bijstelling van een ingevolge de eerste volzin geldend rentepercentage over
      te gaan. Indien Onze Minister tot bijstelling van het rentepercentage is overgegaan, wordt in afwijking van de
      eerste volzin uitgegaan van een herziening van het rentepercentage telkens per 1 januari volgend op een periode van
      20 kalenderjaren sinds die bijstelling, het kalenderjaar waarin die bijstelling plaatsvond daarbij inbegrepen.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel190
  - number: '191'
    text: |-
      De school voor openbaar en protestants-christelijk onderwijs in Earnewâld wordt niet voor een bij koninklijk
      besluit te bepalen datum opgeheven, tenzij deze school indien zij als nevenvestiging onderdeel zou vormen
      van een andere school wegens het niet voldoen aan een van de normen voor bekostiging van een nevenvestiging,
      genoemd in [artikel 158, eerste lid][ref1], van de Wet op het primair onderwijs zou moeten worden opgeheven.
      Indien deze school op een bij koninklijk besluit te bepalen datum voldoet aan de criteria voor het
      voortbestaan als zelfstandige school, kan de bekostiging van deze school met ingang van een bij koninklijk
      besluit te bepalen datum worden voortgezet zolang na laatstgenoemde datum geen opheffing op grond van de
      [artikelen 153 tot en met 160][ref2] van de Wet op het primair onderwijs behoeft plaats te vinden.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel158
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel153
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel191
