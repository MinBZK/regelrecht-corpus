    text: |-
      Ingeval een samenvoeging plaatsvindt tussen 1 oktober en 1 januari daaropvolgend, wordt de bekostiging ten behoeve
      van de uitgaven voor de voorzieningen, bedoeld in [artikel 113][ref1], van alle bij de samenvoeging betrokken
      scholen gehandhaafd tot het einde van het jaar waarin de samenvoeging plaatsvond, en wordt de bekostiging van
      de uitgaven voor die voorzieningen voor het jaar volgend op de samenvoeging, gebaseerd op de bekostiging van de
      uitgaven voor die voorzieningen van alle bij de samenvoeging betrokken scholen, zoals die golden op 1 oktober van
      het jaar van samenvoeging.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel113
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel134
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '113'
        hoofdstuk: I
        afdeling: '4'
  - number: '134.11'
    text: Het Rijk verstrekt jaarlijks aan het samenwerkingsverband bekostiging ten behoeve van de materiële instandhouding.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel134
  - number: '135.1'
    text: |-
      Jaarlijks voor 1 maart kan Onze Minister verhoging van de bekostiging worden gevraagd, indien op grond van
      bijzondere omstandigheden van de school in dat jaar het totale bedrag niet voldoende is voor de noodzakelijke
      uitgaven van de school.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel135
  - number: '135.2'
    text: |-
      Een aanvraag als bedoeld in het eerste lid, kan slechts worden gedaan door het bevoegd gezag voor zover het betreft
      de materiële instandhouding waarop de programma's van eisen, bedoeld in [artikel 114][ref1], betrekking hebben.
      In afwijking van de vorige volzin kan ingeval [artikel 119, tweede, derde of vierde lid][ref2], is toegepast, het
      bevoegd gezag dat dan wel de gemeente die de materiële instandhouding geheel of gedeeltelijk verzorgt, de aanvraag
      indienen.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel114
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel119
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel135
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '114'
        hoofdstuk: I
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '119'
        hoofdstuk: I
        afdeling: '4'
  - number: '135.3'
    text: 'Onze Minister wijst de aanvraag in elk geval af indien:'
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel135
  - number: 135.3.a
    text: |-
      in het jaar waarvoor de programma's van eisen zijn vastgesteld, het totaal van de noodzakelijke uitgaven voor de
      materiële instandhouding van de school, niet ten minste 5% meer zal bedragen dan het totaal van de uit 's Rijks kas
      daarvoor te verstrekken inkomsten,
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel135
  - number: 135.3.b
    text: |-
      de bijzondere omstandigheden het gevolg zijn van een bij algemene maatregel van bestuur aan te geven omstandigheid
      of afwijking van de omvang van de componenten van de voorziening ten aanzien waarvan de bijzondere omstandigheden
      zouden bestaan,
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel135
  - number: 135.3.c
    text: |-
      de bijzondere omstandigheid het gevolg is van een verschil tussen het prijsniveau in enig jaar en de op grond van
      [artikel 113][ref1] vastgestelde of aangepaste bedragen, of


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel113
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel135
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '113'
        hoofdstuk: I
        afdeling: '4'
  - number: 135.3.d
    text: |-
      het bevoegd gezag dat of de gemeente die de aanvraag heeft ingediend, niet aantoont dat het de bijzondere
      omstandigheden niet op enigerlei wijze had kunnen voorkomen.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel135
  - number: '135.4'
    text: |-
      Een aanvraag als bedoeld in het eerste lid gaat vergezeld van een verklaring van een accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1], van de juistheid van de gegevens die bij de
      aanvraag zijn gevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel135
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '135.6'
    text: |-
      Onze Minister besluit binnen drie maanden. Indien technisch onderzoek zulks noodzakelijk maakt, kan Onze Minister
      deze termijn eenmaal met ten hoogste zes maanden verdagen.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel135
  - number: '135.7'
    text: |-
      Onze Minister kan in verband met de in het eerste lid bedoelde verhoging een bekostigingsplafond instellen. In dat
      geval worden bij ministeriële regeling regels omtrent de verdeling vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel135
  - number: '136.1'
    text: |-
      De gemeente verstrekt jaarlijks aan het bevoegd gezag van een niet door de gemeente in stand gehouden school dat
      eigenaar is van een ruimte voor het onderwijs in lichamelijke oefening op het grondgebied van de gemeente
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel136
  - number: 136.1.a
    text: |-
      een bekostigingsbedrag dat wordt bepaald ingevolge [artikel 117 en het derde lid][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel117
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel136
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '117'
        hoofdstuk: I
        afdeling: '4'
  - number: 136.1.b
    text: |-
      voor zover het gebruik van die ruimte ontoereikend is een overeenkomstig het tweede lid vast te stellen
      bekostigingsbedrag.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel136
  - number: '136.2'
    text: |-
      Voor zover geen ruimte ter beschikking is gesteld als bedoeld in [artikel 117, eerste lid onder a][ref1], verstrekt
      de gemeente jaarlijks aan het bevoegd gezag van een niet door de gemeente in stand gehouden school dat geen
      eigenaar is van een ruimte voor het onderwijs in lichamelijke oefening een bekostigingsbedrag dat wordt bepaald
      ingevolge artikel 117, eerste lid onder b, en derde lid onder a, en het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel117
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel136
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '117'
        hoofdstuk: I
        afdeling: '4'
  - number: '136.3'
    text: |-
      Het aantal groepen leerlingen voor basisscholen wordt berekend overeenkomstig
      [artikel 134, vierde lid onder a, vijfde lid onder a, en achtste lid onder a][ref1], en de ter uitvoering daarvan
      vastgestelde algemene maatregel van bestuur, met dien verstande dat groepen waarvoor van rijkswege bekostiging
      wordt verstrekt voor de kosten van de materiële instandhouding van een speellokaal niet in aanmerking worden
      genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel134
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel136
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '134'
        hoofdstuk: I
        paragraaf: '2'
        afdeling: '8'
  - number: '136.4'
    text: |-
      Het aantal groepen leerlingen voor speciale scholen voor basisonderwijs wordt berekend door het aantal leerlingen
      op 1 oktober van het jaar voorafgaande aan het jaar waarover de bekostiging plaatsvindt te delen door 15 en de
      uitkomst rekenkundig af te ronden op een geheel getal.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel136
  - number: '137.1'
    text: |-
      Met inachtneming van de [artikelen 120][ref1] en [121][ref2] verstrekt het Rijk jaarlijks aan het bevoegd gezag een
      bekostigingsbedrag ten behoeve van de personeelskosten.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel120
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel121
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel137
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '120'
        hoofdstuk: I
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '121'
        hoofdstuk: I
        afdeling: '5'
  - number: '137.2'
    text: |-
      In geval van het verstrekken van een bijzondere bekostiging als bedoeld in [artikel 123][ref1] verstrekt het Rijk
      aan het desbetreffende bevoegd gezag het bedrag van deze bekostiging.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel123
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel137
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '123'
        hoofdstuk: I
        afdeling: '5'
  - number: '137.3'
    text: Het Rijk verstrekt jaarlijks aan het samenwerkingsverband een bedrag ten behoeve van de personeelskosten.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel137
  - number: '137.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden voorschriften gegeven met betrekking tot het betalen van het
      in het eerste, tweede en derde lid bedoelde bedrag.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel137
  - number: '137.5'
    text: |-
      Op het in het eerste, tweede en derde lid bedoelde bedrag worden op een bij ministeriële regeling vast te stellen
      wijze in mindering gebracht de inkomsten die het bevoegd gezag dan wel het samenwerkingsverband direct of indirect
      geniet vanwege uitkeringen of toelagen waarop door het personeel aanspraak kan worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel137
  - number: '138.1'
    text: |-
      Op de bekostiging, bedoeld in [artikel 137][ref1], worden in mindering gebracht de salarissen, toelagen,
      uitkeringen of andere bijdragen waarop aanspraak wordt gemaakt door personeel dat is benoemd met voorbijgaan van
      personeel dat een gelijksoortige functie uitoefent of heeft uitgeoefend aan een school van het bevoegd gezag,
      voor zover laatstbedoeld personeel in het genot is van een bovenwettelijke werkloosheidsuitkering of een andere
      ontslaguitkering en direct aan die uitkering voorafgaand langer dan een jaar onafgebroken in dienst is geweest
      van het bevoegd gezag. Voor de toepassing van de eerste volzin wordt, indien het betreft openbaar onderwijs, onder
      «school van het bevoegd gezag» verstaan elke binnen de desbetreffende gemeente gelegen school, met uitzondering van
      de binnen die gemeente gelegen nevenvestigingen waarvan de hoofdvestiging in een andere gemeente is gelegen.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel137
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel138
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '137'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: '8'
  - number: '138.2'
    text: |-
      Op de bekostiging worden eveneens in mindering gebracht de kosten van werkloosheidsuitkeringen, suppleties inzake
      arbeidsongeschiktheid alsmede uitkeringen wegens ziekte en arbeidsongeschiktheid van gewezen personeel anders dan
      op grond van de [Ziektewet][ref1]. De eerste volzin is niet van toepassing, indien de rechtspersoon, bedoeld in
      [artikel 184][ref2], op een daartoe strekkende aanvraag van het bevoegd gezag, voorafgaand aan het ontslag heeft
      ingestemd met het ten laste van die rechtspersoon brengen van de kosten van uitkeringen of suppleties als bedoeld
      in de eerste volzin.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel184
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel138
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '184'
        hoofdstuk: I
        afdeling: '12'
  - number: '138.3'
    text: |-
      Het eerste lid is eveneens van toepassing, indien de benoeming heeft plaatsgevonden in aansluiting op een benoeming
      in tijdelijke dienst in dezelfde functie.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel138
  - number: '138.4'
    text: |-
      Met gewezen personeel dat in het genot is van wachtgeld of van een andere ontslaguitkering als bedoeld in het
      eerste lid wordt gelijk gesteld personeel aan wie op grond van het leerlingenverloop op of na 1 februari ontslag
      is of zal worden aangezegd, op grond van welk ontslag recht op wachtgeld of een andere ontslaguitkering zou kunnen
      ontstaan. In afwijking van de eerste volzin kan voor een periode tot uiterlijk de datum van ingang van het recht op
      wachtgeld of op een andere ontslaguitkering in een vacature worden voorzien zonder dat de vermindering, bedoeld in
      het eerste lid, plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel138
  - number: '138.5'
    text: |-
      Bij ministeriële regeling wordt bepaald in welke gevallen geen vermindering als bedoeld in het eerste lid
      plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel138
  - number: '138.6'
    text: |-
      Onze Minister kan in andere gevallen dan voorzien in de ministeriële regeling bedoeld in het vijfde lid, wegens
      gewichtige redenen op aanvraag van het bevoegd gezag besluiten dat de vermindering van de bekostiging, bedoeld
      in het eerste lid, niet zal plaatsvinden. Onze Minister besluit binnen 4 maanden na ontvangst van de aanvraag.
      Uitsluitend op grond van door het bevoegd gezag aangevoerde bijzondere omstandigheden kan Onze Minister bepalen dat
      het besluit, bedoeld in de eerste volzin, betrekking heeft of mede betrekking heeft op een periode voorafgaand aan
      de datum waarop het bevoegd gezag de aanvraag heeft ingediend.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel138
  - number: '139.1'
    text: |-
      [Artikel 138][ref1] is van overeenkomstige toepassing indien de rechtspersoon, bedoeld in [artikel 68][ref2],
      personeel benoemt met voorbijgaan van gewezen personeel als bedoeld in [artikel 138, eerste en vierde lid][ref3],
      van de rechtspersoon of van een bevoegd gezag waarvoor diensten worden verricht, dan wel niet handelt
      overeenkomstig het bepaalde in laatstgenoemde artikelleden. Van het gewezen personeel, bedoeld in de eerste volzin,
      is uitgezonderd het personeel van het bevoegd gezag waarvoor diensten worden verricht, waarvan de dienstbetrekking
      is beëindigd op een tijdstip dat meer dan twee jaar ligt voor de aanvang van de dienstverlening.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel138
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel68
      [ref3]: https://wetten.overheid.nl/BWBR0003420#Artikel138
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel139
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '138'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: '8'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '68'
        hoofdstuk: I
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0003420
        artikel: '138'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: '8'
  - number: '139.2'
    text: |-
      In geval van toepassing van het eerste lid wordt het in mindering te brengen bedrag in gelijke mate verdeeld over
      de scholen waarvoor diensten worden verricht.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel139
  - number: '139.3'
    text: |-
      [Artikel 138][ref1] is eveneens van overeenkomstige toepassing


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel138
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel139
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '138'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: '8'
  - number: 139.3.a
    text: |-
      indien een bevoegd gezag waarvoor diensten worden verricht, personeel benoemt met voorbijgaan van gewezen personeel
      van de rechtspersoon, bedoeld in [artikel 68][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel68
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel139
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '68'
        hoofdstuk: I
        afdeling: '2'
  - number: 139.3.b
    text: |-
      indien een bevoegd gezag waarvoor geen diensten meer worden verricht, in het tijdvak van vijf jaar na beëindiging
      van de dienstverlening personeel benoemt met voorbijgaan van gewezen personeel als bedoeld in onderdeel a.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel139
  - number: '139.4'
    text: |-
      [Artikel 138, tweede lid][ref1], is van overeenkomstige toepassing indien de rechtspersoon, bedoeld in
      [artikel 68][ref2], personeel ontslaat zonder voorafgaande instemming van de rechtspersoon, bedoeld in
      [artikel 184][ref3], met dien verstande dat het in mindering te brengen bedrag in gelijke mate wordt verdeeld over
      de bevoegde gezagsorganen waarvan de rechtspersoon, bedoeld in [artikel 68][ref4], uitgaat.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel138
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel68
      [ref3]: https://wetten.overheid.nl/BWBR0003420#Artikel184
      [ref4]: https://wetten.overheid.nl/BWBR0003420#Artikel68
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel139
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '138'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: '8'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '68'
        hoofdstuk: I
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0003420
        artikel: '184'
        hoofdstuk: I
        afdeling: '12'
      - id: ref4
        bwb_id: BWBR0003420
        artikel: '68'
        hoofdstuk: I
        afdeling: '2'
  - number: '140.1'
    text: |-
      Indien in een gemeente uitsluitend een of meer andere rechtspersonen dan de gemeente openbare basisscholen of
      openbare speciale scholen voor basisonderwijs in stand houden of openbare basisscholen onderscheidenlijk openbare
      speciale scholen voor basisonderwijs ontbreken en de gemeente uitgaven wil doen voor het onderwijs aan die scholen
      welke niet door het Rijk worden bekostigd, stelt de gemeenteraad bij verordening een regeling daarvoor vast en zijn
      de [artikelen 142 tot en met 147][ref1] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel142
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel140
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '142'
        hoofdstuk: I
        paragraaf: '5'
        afdeling: '8'
  - number: '140.2'
    text: |-
      De regeling, bedoeld in het eerste lid, maakt geen onderscheid tussen openbaar en bijzonder onderwijs en voorziet
      in een behandeling van basisscholen onderscheidenlijk speciale scholen voor basisonderwijs naar dezelfde maatstaf.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel140
  - number: '140.3'
    text: |-
      De regeling, bedoeld in het eerste lid, bevat in elk geval de voorzieningen die door het bevoegd gezag van een in
      de gemeente gelegen, niet door de gemeente in stand gehouden basisschool onderscheidenlijk speciale school voor
      basisonderwijs kunnen worden aangevraagd en de procedure voor het doen van een aanvraag.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel140
  - number: '140.4'
    text: |-
      De gemeenteraad kan besluiten dat burgemeester en wethouders de regeling, bedoeld in het eerste lid, tijdelijk
      kunnen aanvullen met nieuwe voorzieningen. De aanvulling wordt binnen 1 week aan de bevoegde gezagsorganen van
      de niet door de gemeente in stand gehouden basisscholen onderscheidenlijk speciale scholen voor basisonderwijs
      gezonden. Binnen 12 weken na de totstandkoming van de aanvulling wordt deze voorgelegd aan de gemeenteraad en
      besluit de gemeenteraad over de bekrachtiging ervan. Indien de gemeenteraad niet binnen 12 weken heeft besloten,
      wordt de aanvulling gelijk gesteld met een aanvulling die is bekrachtigd. Een afwijzing van de aanvulling door
      de gemeenteraad heeft geen gevolgen voor aanvragen waarop reeds is besloten of die reeds zijn ingediend en die
      voorzieningen betreffen waarop de aanvulling betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel140
  - number: '140.6'
    text: |-
      Voor de toepassing van dit artikel wordt een nevenvestiging aangemerkt als een nevenvestiging die is gelegen in de
      gemeente van de hoofdvestiging. De gemeenteraad kan in de verordening, bedoeld in het eerste lid, aan burgemeester
      en wethouders de bevoegdheid verlenen om, met inachtneming van de in die verordening gestelde regels, te besluiten
      dat in de gemeente gelegen nevenvestigingen van scholen waarvan de hoofdvestiging is gelegen in een andere
      gemeente in afwijking van de eerste volzin in aanmerking komen voor een of meer van de in de regeling genoemde
      voorzieningen.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel140
  - number: '140.7'
    text: |-
      Burgemeester en wethouders maken jaarlijks in een van overheidswege uitgegeven blad of een dag-, nieuws- of huis-
      aan-huisblad, dan wel op een andere geschikte wijze, een overzicht bekend van de op grond van de regeling, bedoeld
      in het eerste lid, toegekende voorzieningen.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel140
  - number: '141.1'
    text: |-
      Indien een gemeente zelf een of meer openbare basisscholen of openbare speciale scholen voor basisonderwijs in
      stand houdt en zij uitgaven wil doen voor het onderwijs aan die scholen welke niet door het Rijk worden bekostigd,
      kan de gemeenteraad daarvoor bij verordening een regeling vaststellen.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel141
  - number: '141.2'
    text: |-
      [Artikel 140, tweede tot en met zevende lid][ref1], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel140
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel141
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '140'
        hoofdstuk: I
        paragraaf: '4'
        afdeling: '8'
  - number: '142.1'
    text: |-
      Indien een gemeente ten behoeve van een of meer door haar in stand gehouden basisscholen of speciale scholen
      voor basisonderwijs meer uitgaven doet voor het personeel en de materiële instandhouding dan door het Rijk worden
      bekostigd, wordt met inachtneming van de [artikelen 142 tot en met 147][ref1] aan het bevoegd gezag van de in die
      gemeente gevestigde, niet door de gemeente in stand gehouden basisscholen onderscheidenlijk speciale scholen voor
      basisonderwijs om de vijf jaar een overschrijdingsbedrag verstrekt. Voor de toepassing van de eerste volzin worden
      ontvangsten op grond van [artikel 134, tweede lid, tweede volzin][ref2], gelijk gesteld met ontvangsten van het
      Rijk. Indien een gemeente vanaf een tijdstip binnen een periode van vijf jaar als bedoeld in de eerste volzin geen
      basisschool onderscheidenlijk speciale school voor basisonderwijs in stand houdt, wordt het overschrijdingsbedrag
      in afwijking van die volzin uiterlijk 31 december van het kalenderjaar dat volgt op dat tijdstip waarop de gemeente
      niet langer een school in stand houdt, toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel142
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel134
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel142
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '142'
        hoofdstuk: I
        paragraaf: '5'
        afdeling: '8'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '134'
        hoofdstuk: I
        paragraaf: '2'
        afdeling: '8'
  - number: '142.2'
    text: |-
      Voor de toepassing van de [artikelen 142 tot en met 147][ref1] worden uitgaven ten behoeve van een nevenvestiging
      aangemerkt als uitgaven ten behoeve van de hoofdvestiging van de school waaraan de nevenvestiging is verbonden.
      Indien ten behoeve van een school of nevenvestiging uitgaven worden gedaan door meer dan één gemeente, worden deze
      uitgaven aangemerkt als uitgaven van de gemeente op wier grondgebied de hoofdvestiging is gelegen. In het geval
      bedoeld in de vorige volzin worden de besluiten ingevolge het vierde lid en de [artikelen 143 tot en met 147][ref2]
      genomen door burgemeester en wethouders van laatstbedoelde gemeente en hebben deze mede betrekking op de uitgaven
      van de andere gemeente of gemeenten.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel142
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel143
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel142
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '142'
        hoofdstuk: I
        paragraaf: '5'
        afdeling: '8'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '143'
        hoofdstuk: I
        paragraaf: '5'
        afdeling: '8'
  - number: '142.3'
    text: |-
      Voor de toepassing van de [artikelen 142 tot en met 147][ref1] wordt een nevenvestiging in een andere gemeente
      dan waarin de hoofdvestiging is gelegen, aangemerkt als een nevenvestiging die is gelegen in de gemeente van de
      hoofdvestiging.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel142
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel142
