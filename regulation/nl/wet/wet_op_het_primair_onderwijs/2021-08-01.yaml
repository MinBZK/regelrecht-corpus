  - number: '2'
    text: |-
      Het basisonderwijs is het onderwijs bestemd voor kinderen vanaf de leeftijd van omstreeks 4 jaar. Het legt mede de
      grondslag voor het volgen van aansluitend voortgezet onderwijs.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel2
  - number: '3.1'
    text: 'Schoolonderwijs mag, onverminderd het derde lid, slechts worden gegeven door degene die:'
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel3
  - number: 3.1.a
    text: |-
      in het bezit is van een verklaring omtrent het gedrag, afgegeven volgens de
