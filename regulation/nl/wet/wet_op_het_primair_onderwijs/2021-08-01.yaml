        artikel: '84'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '2'
  - number: '153.2'
    text: |-
      De opheffingsnormen, berekend op grond van [artikel 154][ref1], zijn voor de eerste maal opgenomen in de bij deze
      wet behorende bijlage. Deze normen zijn tot en met 31 juli 1998 van kracht. Deze normen worden met ingang van 1
      augustus 1998 telkens voor een tijdvak van 5 jaar bij ministeriële regeling aangepast op basis van de gegevens
      van het Centraal Bureau voor de Statistiek betreffende 1 januari van het tweede jaar voorafgaand aan het laatste
      jaar waarin de opheffingsnormen van kracht zijn. De ministeriële regeling, bedoeld in de derde volzin, wordt,
      tezamen met bij die regeling op grond van [artikel 155][ref2] vastgestelde normen voor delen van gemeenten, voor 1
      november van het jaar voorafgaand aan het laatste jaar waarin de opheffingsnormen van kracht zijn, bekendgemaakt in
      de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel154
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel155
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel153
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '154'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '9'
      - id: ref2
