    text: 'het samenwerkingsverband:'
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel132
  - number: 132.5.a.1°
    text: |-
      dat verantwoordelijk is voor de bekostiging tijdens de inschrijving op een school voor speciaal
      onderwijs of speciaal en voortgezet speciaal onderwijs behorend tot cluster 3 en 4, bedoeld in de
      [Wet op de expertisecentra][ref1], indien de leerling onmiddellijk voorafgaand aan de opname in de residentiële
      instelling was ingeschreven op een school voor speciaal onderwijs of speciaal en voortgezet speciaal onderwijs, of


      [ref1]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel132
    references:
      - id: ref1
        bwb_id: BWBR0003549
  - number: 132.5.a.2°
    text: |-
      waartoe de vestiging van de school behoort waar de leerling was ingeschreven en bekostigd onmiddellijk voorafgaand
      aan de opname in de residentiële instelling, of
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel132
  - number: 132.5.b
    text: |-
      het samenwerkingsverband in het gebied waarvan de leerling woonachtig is, indien de leerling onmiddellijk
      voorafgaand aan de opname in de residentiële instelling niet was ingeschreven op een school of school voor
      speciaal onderwijs of speciaal en voortgezet speciaal onderwijs behorend tot cluster 3 en 4, bedoeld in de
      [Wet op de expertisecentra][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel132
    references:
      - id: ref1
        bwb_id: BWBR0003549
  - number: '132.6'
    text: |-
      De bedragen, bedoeld in het eerste en derde lid, zijn de uitkomst van een bij algemene maatregel van bestuur vast
      te stellen hoeveelheid formatie per leerling, vermenigvuldigd met een bedrag. Bij de vaststelling van de bedragen,
      bedoeld in het eerste lid, wordt in ieder geval rekening gehouden met de ontwikkeling van de genormeerde gemiddelde
      personeelslast van de leraren van speciale scholen voor basisonderwijs. Bij de bedragen, bedoeld in het derde lid,
      wordt in ieder geval rekening gehouden met de ontwikkeling van de genormeerde gemiddelde personeelslast van de
      leraren van de scholen voor speciaal onderwijs, de scholen voor voortgezet speciaal onderwijs en de scholen voor
      speciaal en voortgezet speciaal onderwijs.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel132
  - number: '132.7'
    text: |-
      [Artikel 123][ref1] is van overeenkomstige toepassing op het samenwerkingsverband.


