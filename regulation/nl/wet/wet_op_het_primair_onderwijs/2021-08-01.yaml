  - number: '156.2'
    text: |-
      Indien burgemeester en wethouders binnen 3 maanden na de datum van herindeling, bedoeld in
      [artikel 1, onderdeel h, van de Wet algemene regels herindeling][ref1], een besluit nemen tot splitsing
      van de gemeente, stelt Onze Minister voor de beide gebiedsdelen een afzonderlijke opheffingsnorm vast.
      [Artikel 155, eerste lid eerste, tweede en vierde volzin en tweede lid eerste en derde volzin][ref2], is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003718#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel155
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel156
