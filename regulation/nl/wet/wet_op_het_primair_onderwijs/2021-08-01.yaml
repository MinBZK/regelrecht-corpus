      De gemeente bekostigt aan het bevoegd gezag van een niet door de gemeente in stand gehouden school dat is
      onderworpen aan een of meer der in [artikel 220 van de Gemeentewet][ref1] bedoelde belastingen ter zake van
      onroerende zaken het bedrag dat is uitgegeven voor de belastingen met betrekking tot de in de gemeente gelegen
      gebouwen en terreinen.


