      [ref12]: https://wetten.overheid.nl/BWBR0003420#HoofdstukI
      [ref13]: https://wetten.overheid.nl/BWBR0003420#HoofdstukI
      [ref14]: https://wetten.overheid.nl/BWBR0003420#HoofdstukI
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel176k
    references:
