  - number: 3.1.c
    text: niet krachtens rechterlijke uitspraak van het geven van onderwijs is uitgesloten.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel3
  - number: '3.2'
    text: |-
      Het onderwijs in de onderwijsactiviteit zintuiglijke en lichamelijke oefening in het derde tot en met achtste
      schooljaar kan in afwijking van het eerste lid, onderdeel b, onder 1, behalve door degene die beschikt over een
      in dat onderdeel b, onder 1, bedoeld getuigschrift waaruit blijkt dat wordt voldaan aan de bekwaamheidseisen
      voor het geven van lichamelijke opvoeding in het voortgezet onderwijs, uitsluitend worden gegeven door degene
      die beschikt over een in dat onderdeel b, onder 1, bedoeld getuigschrift waaruit blijkt dat wordt voldaan aan de
      bekwaamheidseisen die zijn vastgesteld krachtens [artikel 32a, eerste lid][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel32a
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 32a
        hoofdstuk: I
        paragraaf: '3'
        afdeling: '1'
  - number: 3.2.a
    text: |-
      in het bezit is van een bij ministeriële regeling aangewezen getuigschrift dat specifiek is gericht op de
      bekwaamheid tot het geven van dat onderwijs, of
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel3
  - number: 3.2.b
    text: |-
      onderwijs volgt ter verkrijging van een dergelijk getuigschrift, in welk geval betrokkene het onderwijs in deze
      onderwijsactiviteit mag geven gedurende ten hoogste twee aaneengesloten schooljaren, gerekend vanaf het moment
      waarop betrokkene het onderwijs ter verkrijging van dit getuigschrift voor de eerste maal volgt.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel3
  - number: '3.3'
    text: |-
      Onze Minister kan aan personen die in het bezit zijn van een buiten de Europese Economische Ruimte of Zwitserland
      behaald bewijsstuk waarmee de bekwaamheid wordt aangetoond, de bevoegdheid tot het geven van schoolonderwijs
      verlenen. Hij kan daarbij voorwaarden en beperkingen stellen.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel3
  - number: '3.4'
    text: |-
      Ten aanzien van studenten die een duale opleiding volgen als bedoeld in
      [artikel 7.7 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1] leidend tot een
      getuigschrift als bedoeld in het eerste lid, onder b.1°, en aan die opleiding ten minste 180 studiepunten
      hebben behaald, kan worden afgeweken van de eisen in het eerste lid onder b, met dien verstande dat het
      tijdelijk dienstverband van de student een periode beslaat die overeenkomt met een volledig dienstverband
      van vijf maanden. De vorige volzin is van overeenkomstige toepassing ten aanzien van studenten die ten
      minste 166 doch nog geen 180 studiepunten hebben behaald, indien door de desbetreffende hogeschool wordt
      verklaard dat de student beschikt over met 180 studiepunten vergelijkbare en tevens voor het dienstverband
      relevante kennis, inzicht en vaardigheden. De toepassing van de vorige volzin vervalt ten aanzien van die
      student die niet binnen vier weken na aanvang van het dienstverband over 180 studiepunten beschikt. De in
      [artikel 7.7, vijfde lid, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref2] bedoelde
      overeenkomst vermeldt tevens de leraar onder wiens verantwoordelijkheid de betrokken student werkzaamheden van
      onderwijskundige aard verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
  - number: '3.5'
    text: |-
      Op de inzet van een leraar voor schoolonderwijs zijn de [artikelen 31a][ref1], en [38b tot en met 38v][ref2] van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel31a
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel38b
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 31a
        hoofdstuk: I
        paragraaf: '3'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: 38b
        hoofdstuk: I
        paragraaf: 3a
        afdeling: '1'
  - number: 3a.1
    text: |-
      Onderwijsondersteunende werkzaamheden als bedoeld in [artikel 32a, derde lid][ref1], mogen slechts worden verricht
      door degene die:


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel32a
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 32a
        hoofdstuk: I
        paragraaf: '3'
        afdeling: '1'
  - number: 3a.1.a
    text: |-
      in het bezit is van een verklaring omtrent het gedrag, afgegeven ingevolge de
      [Wet justitiële en strafvorderlijke gegevens][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0014194
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0014194
  - number: 3a.1.b
    text: |-
      in het bezit is van een getuigschrift afgegeven krachtens de
      [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1] of de [Wet educatie en beroepsonderwijs][ref2],
      waaruit blijkt dat is voldaan aan de in [artikel 32a, derde lid][ref3], bedoelde bekwaamheidseisen of


      [ref1]: https://wetten.overheid.nl/BWBR0005682
      [ref2]: https://wetten.overheid.nl/BWBR0007625
      [ref3]: https://wetten.overheid.nl/BWBR0003420#Artikel32a
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0005682
      - id: ref2
        bwb_id: BWBR0007625
      - id: ref3
        bwb_id: BWBR0003420
        artikel: 32a
        hoofdstuk: I
        paragraaf: '3'
        afdeling: '1'
  - number: 3a.1.c
    text: |-
      in het bezit is van een erkenning van beroepskwalificaties als bedoeld in
      [artikel 5 van de Algemene wet erkenning EU-beroepskwalificaties][ref1], verleend ten aanzien van de door hem te
      verrichten werkzaamheden, of


      [ref1]: https://wetten.overheid.nl/BWBR0023066#Artikel5
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0023066
        artikel: '5'
  - number: 3a.1.d
    text: volgens bij algemene maatregel van bestuur te geven regels zijn bekwaamheid heeft aangetoond, en
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel3a
  - number: 3a.1.e
    text: niet krachtens rechterlijke uitspraak is uitgesloten van het verrichten van deze werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel3a
  - number: 3a.2
    text: |-
      De onderwijsondersteunende functionaris die niet voldoet aan de eisen van het eerste lid, onder b, c of d, mag
      voor zover het werkzaamheden betreft waarvoor op grond van [artikel 32a, derde lid][ref1], bekwaamheidseisen
      zijn vastgesteld, niettemin met die werkzaamheden worden belast, voor een periode van ten hoogste twee jaren.
      Aan de eerste volzin wordt uitsluitend toepassing gegeven indien het bevoegd gezag en betrokkene in ieder geval
      schriftelijk hebben verklaard dat betrokkene verplicht is zich in te spannen om binnen twee jaren alsnog te voldoen
      aan de bekwaamheidseisen voor die werkzaamheden.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel32a
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 32a
        hoofdstuk: I
        paragraaf: '3'
        afdeling: '1'
  - number: 3a.3
    text: |-
      Ten aanzien van studenten aan een opleiding als bedoeld in
      [artikel 7.7, tweede lid, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1]
      en deelnemers aan de beroepsbegeleidende leerweg van een opleiding als bedoeld in
      [artikel 7.2.2 van de Wet educatie en beroepsonderwijs][ref2] die in het kader van die opleiding
      onderwijsondersteunende werkzaamheden verrichten waarvoor op grond van [artikel 32a, derde lid][ref3],
      bekwaamheidseisen zijn vastgesteld, kan voor de duur van die werkzaamheden worden afgeweken van het eerste lid,
      onder b tot en met d.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0003420#Artikel32a
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0003420
        artikel: 32a
        hoofdstuk: I
        paragraaf: '3'
        afdeling: '1'
  - number: '4.1'
    text: |-
      Ten behoeve van het schoolbezoek verstrekken burgemeester en wethouders aan ouders van in de gemeente verblijvende
      leerlingen op aanvraag vergoeding van de door burgemeester en wethouders noodzakelijk te achten vervoerskosten. De
      gemeenteraad stelt daartoe een nadere regeling vast, met inachtneming van het bepaalde in de volgende leden.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel4
  - number: '4.2'
    text: De regeling maakt geen onderscheid tussen openbaar en bijzonder onderwijs.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel4
  - number: '4.3'
    text: De regeling eerbiedigt de op godsdienst of levensbeschouwing van de ouders berustende keuze van een school.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel4
  - number: '4.4'
    text: |-
      De regeling houdt rekening met de van ouders redelijkerwijs te vergen inzet en voorziet erin dat het vervoer kan
      plaatsvinden op een wijze die voor de leerling passend is. De regeling bepaalt op welke wijze burgemeester en
      wethouders terzake advies van deskundigen inwinnen.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel4
  - number: '4.5'
    text: De regeling bepaalt dat de kosten worden vergoed van vervoer over de afstand tussen de woning van de leerling en
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel4
  - number: 4.5.a
    text: |-
      de dichtstbijzijnde voor de leerling toegankelijke basisschool of, indien een leerling op het onderwijs van een
      speciale school voor basisonderwijs is aangewezen, de dichtstbijzijnde voor de leerling toegankelijke speciale
      school voor basisonderwijs,
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel4
  - number: 4.5.b
    text: |-
      een andere basisschool of speciale school voor basisonderwijs, indien het vervoer naar die school voor de gemeente
      minder kosten met zich mee zou brengen dan het vervoer naar de basisschool onderscheidenlijk speciale school voor
      basisonderwijs, bedoeld onder a, en de ouders met het vervoer naar die andere school instemmen,
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel4
  - number: 4.5.c
    text: |-
      de dichtstbijzijnde voor de leerling toegankelijke speciale school voor basisonderwijs in het samenwerkingsverband
      van de basisschool waarvan de leerling afkomstig is, indien de ouders met het vervoer naar die speciale school voor
      basisonderwijs instemmen, of
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel4
  - number: 4.5.d
    text: |-
      een andere speciale school voor basisonderwijs in het onder c bedoelde samenwerkingsverband, indien het vervoer
      naar die school voor de gemeente minder kosten met zich zou brengen dan het vervoer naar de speciale school voor
      basisonderwijs, bedoeld onder c, en de ouders met het vervoer naar die andere school instemmen.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel4
  - number: '4.6'
    text: |-
      Bij de toepassing van het vijfde lid worden de afstanden gemeten langs de kortste voor de leerling voldoende
      begaanbare en veilige weg en wordt de keuze van de ouders, bedoeld in het derde lid, in acht genomen.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel4
  - number: '4.7'
    text: |-
      De regeling kan ten aanzien van ouders wier inkomen tezamen meer bedraagt dan € 17 700 bepalen dat slechts
      vergoeding wordt verstrekt voor zover de kosten van vervoer de kosten van het openbaar vervoer over de door de
      gemeenteraad op grond van het achtste lid vastgestelde afstand te boven gaan, welke afstand ten hoogste 6 kilometer
      bedraagt. Bij de berekening van het inkomen wordt uitgegaan van het inkomen in het tweede kalenderjaar voorafgaand
      aan het kalenderjaar waarin het schooljaar waarvoor vergoeding wordt gevraagd, begint. De kosten van het openbaar
      vervoer, bedoeld in de eerste volzin, betreffen de kosten van openbaar vervoer die op grond van de zone-indeling
      in de regeling die is gebaseerd op [artikel 30, eerste lid, van de Wet personenvervoer 2000][ref1], voor de afstand
      redelijkerwijs zouden worden gemaakt, ongeacht de aanwezigheid van openbaar vervoer of het daadwerkelijk gebruik
      ervan. Ingeval toepassing wordt gegeven aan het tiende lid voorziet de regeling in een overeenkomstig de derde
      volzin berekende financiële bijdrage van de ouders. Het bedrag, bedoeld in de eerste volzin, wordt met ingang
      van 1 januari 1999 jaarlijks aangepast aan de wijziging die het indexcijfer van de regelingslonen van volwassen
      werknemers heeft ondergaan ten opzichte van het voorafgaande jaar, en afgerond op een veelvoud van € 450. Het
      aangepaste bedrag treedt in de plaats van het in de eerste volzin bedoelde bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel30
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '30'
  - number: '4.8'
    text: |-
      De regeling kan bepalen dat geen aanspraak op vergoeding bestaat op grond van de afstand tussen de voor de leerling
      toegankelijke school en de woning van de leerling, gemeten langs de kortste, voor de leerling voldoende begaanbare
      en veilige weg.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel4
  - number: '4.9'
    text: |-
      De regeling kan bepalen dat voor een leerling die ouder is dan een bepaalde leeftijd, de aanspraak op vergoeding
      wordt beperkt tot de kosten van openbaar vervoer, dan wel, indien zulks in redelijkheid kan worden verlangd, een
      goedkopere wijze van vervoer. In dat geval dient de regeling erin te voorzien, dat uitvoering wordt gegeven aan
      het bepaalde in het vierde lid voor die leerlingen voor wie openbaar vervoer ontbreekt en de in de vorige volzin
      bedoelde goedkopere wijze van vervoer in redelijkheid niet kan worden verlangd.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel4
  - number: '4.10'
    text: |-
      De regeling kan bepalen dat de gemeente, in plaats van vergoeding in geld te geven, het vervoer verzorgt of doet
      verzorgen.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel4
  - number: '4.11'
    text: |-
      De regeling kan voor leerlingen voor wie de afstand bedoeld in het vijfde lid, meer bedraagt dan 20 kilometer,
      bepalen dat de hoogte van de vergoeding afhankelijk is van de financiële draagkracht van de ouders, of dat het
      vervoer dat de gemeente verzorgt of doet verzorgen geschiedt tegen een van de financiële draagkracht van de ouders
      afhankelijke bijdrage tot ten hoogste het bedrag van de kosten van het vervoer van de desbetreffende leerling. In
      dat geval bevat de regeling tevens voorschriften omtrent de bepaling van de financiële draagkracht van de ouders.
      De eerste volzin is niet van toepassing voor een leerling van een speciale school voor basisonderwijs voor wie
      geldt dat de afstand tot de dichtstbijzijnde openbare of bijzondere speciale school voor basisonderwijs meer dan 20
      kilometer bedraagt.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel4
  - number: '4.12'
    text: |-
      De regeling kan bepalen dat burgemeester en wethouders in bijzondere gevallen de bevoegdheid hebben ten gunste van
      de ouders van de inhoud van de regeling af te wijken.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel4
  - number: '4.13'
    text: |-
      Het zevende tot en met negende lid en het elfde lid zijn niet van toepassing op leerlingen die wegens hun
      lichamelijke, verstandelijke, zintuiglijke of psychische handicap op ander vervoer dan openbaar vervoer zijn
      aangewezen, dan wel vanwege een zodanige handicap niet zelfstandig van openbaar vervoer gebruik kunnen maken.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel4
  - number: 4a.1
    text: |-
      Indien het bevoegd gezag op enigerlei wijze bekend is geworden dat een ten behoeve van zijn school
      met taken belast persoon zich mogelijk schuldig maakt of heeft gemaakt aan een misdrijf tegen de
      zeden als bedoeld in [Titel XIV van het Wetboek van Strafrecht][ref1] jegens een leerling van de
      school, treedt het bevoegd gezag onverwijld in overleg met de vertrouwensinspecteur, bedoeld in
      [artikel 6 van de Wet op het onderwijstoezicht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001854
      [ref2]: https://wetten.overheid.nl/BWBR0013800#Artikel6
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0001854
      - id: ref2
        bwb_id: BWBR0013800
        artikel: '6'
  - number: 4a.2
    text: |-
      Indien uit het overleg, bedoeld in het eerste lid, moet worden geconcludeerd dat er sprake is van een redelijk
      vermoeden dat de desbetreffende persoon zich schuldig heeft gemaakt aan een misdrijf als bedoeld in het eerste
      lid jegens een leerling van de school, doet het bevoegd gezag onverwijld aangifte bij een opsporingsambtenaar als
      bedoeld in [artikel 127][ref1] juncto [artikel 141 van het Wetboek van Strafvordering][ref2], en stelt het bevoegd
      gezag de vertrouwensinspecteur daarvan onverwijld in kennis. Voordat het bevoegd gezag overgaat tot het doen van
      aangifte, stelt het de ouders van de betrokken leerling, onderscheidenlijk de betreffende ten behoeve van de school
      met taken belaste persoon, hiervan op de hoogte.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel127
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '127'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '141'
  - number: 4a.3
    text: |-
      Indien een personeelslid op enigerlei wijze bekend is geworden dat een ten behoeve van de school met taken belast
      persoon zich mogelijk schuldig maakt of heeft gemaakt aan een misdrijf als bedoeld in het eerste lid jegens een
      leerling van de school, stelt het personeelslid het bevoegd gezag daarvan onverwijld in kennis.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel4a
  - number: 4b.1
    text: |-
      Het bevoegd gezag of de natuurlijke persoon dan wel de rechtspersoon die een school in stand houdt die niet uit de
      openbare kas wordt bekostigd, stelt voor het personeel een meldcode vast waarin stapsgewijs wordt aangegeven hoe
      met signalen van huiselijk geweld of kindermishandeling wordt omgegaan en die er redelijkerwijs aan bijdraagt dat
      zo snel en adequaat mogelijk hulp kan worden geboden.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel4b
  - number: 4b.2
    text: |-
      Onder huiselijk geweld wordt verstaan: huiselijk geweld als bedoeld in
      [artikel 1.1.1 van de Wet maatschappelijke ondersteuning 2015][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel1
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel4b
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '1'
  - number: 4b.3
    text: |-
      Onder kindermishandeling wordt verstaan: kindermishandeling als bedoeld in [artikel 1.1 van de Jeugdwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel1
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel4b
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '1'
  - number: 4b.4
    text: |-
      Het bevoegd gezag of de natuurlijke persoon dan wel de rechtspersoon die een school in stand houdt die niet uit de
      openbare kas wordt bekostigd, bevordert de kennis en het gebruik van de meldcode.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel4b
  - number: 4b.5
    text: |-
      Bij of krachtens algemene maatregel van bestuur wordt vastgesteld uit welke elementen een meldcode in ieder geval
      bestaat.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel4b
  - number: 4c.1
    text: 'Het bevoegd gezag draagt zorg voor de veiligheid op school, waarbij het bevoegd gezag in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel4c
  - number: 4c.1.a
    text: beleid met betrekking tot de veiligheid voert,
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel4c
  - number: 4c.1.b
    text: |-
      de veiligheid van leerlingen op school monitort met een instrument dat een representatief en actueel beeld geeft,
      en
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel4c
  - number: 4c.1.c
    text: 'er zorg voor draagt dat bij een persoon ten minste de volgende taken zijn belegd:'
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel4c
  - number: 4c.1.c.1°
    text: het coördineren van het beleid in het kader van het tegengaan van pesten, en
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel4c
  - number: 4c.1.c.2°
    text: het fungeren als aanspreekpunt in het kader van pesten.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel4c
  - number: 4c.2
    text: |-
      Onder veiligheid, bedoeld in het eerste lid, wordt verstaan de sociale, psychische en fysieke veiligheid van
      leerlingen.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel4c
  - number: 4c.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over het instrument, bedoeld in het
      eerste lid, onderdeel b, dat door de school wordt vormgegeven of gekozen, waaronder:
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel4c
  - number: 4c.3.a
    text: de aandachtsgebieden die het instrument inzichtelijk maakt,
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel4c
  - number: 4c.3.b
    text: de representativiteit van het instrument, en
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel4c
  - number: 4c.3.c
    text: de frequentie waarmee het instrument wordt ingezet.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel4c
  - number: '5'
    text: |-
      Het bevoegd gezag van een bijzondere school geeft binnen vier weken na de oprichting van de school onder
      overlegging van de statuten van de rechtspersoon, die de school in stand houdt, en van de reglementen, van die
      oprichting kennis aan Onze Minister. Indien de statuten of reglementen worden gewijzigd of ingetrokken, wordt
      eveneens binnen vier weken van de wijziging of van de intrekking van de statuten of reglementen aan Onze Minister
      kennis gegeven.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel5
  - number: '6'
    text: |-
      Ten laste van een andere openbare kas dan van Rijk en gemeente worden geen scholen in stand gehouden, noch uitgaven
      voor een school gedaan. Gemeenten doen geen uitgaven voor een niet door de gemeente in stand gehouden school dan
      krachtens de wet.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel6
  - number: '7.1'
    text: |-
      Deze wet is niet van toepassing op scholen die uitsluitend bestemd zijn voor kinderen die niet de Nederlandse
      nationaliteit hebben.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel7
  - number: '7.2'
    text: Bij twijfel of op een school het eerste lid van toepassing is, besluit de Kroon, de Raad van State gehoord.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel7
  - number: '8.1'
    text: |-
      Het onderwijs wordt zodanig ingericht dat de leerlingen een ononderbroken ontwikkelingsproces kunnen doorlopen. Het
      wordt afgestemd op de voortgang in de ontwikkeling van de leerlingen.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel8
  - number: '8.2'
    text: |-
      Het onderwijs richt zich in elk geval op de emotionele en de verstandelijke ontwikkeling, en op het ontwikkelen van
      creativiteit, op het verwerven van noodzakelijke kennis en van sociale, culturele en lichamelijke vaardigheden.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel8
  - number: '8.3'
    text: |-
      Het onderwijs bevordert actief burgerschap en sociale cohesie op doelgerichte en samenhangende wijze, waarbij het
      onderwijs zich in ieder geval herkenbaar richt op:
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel8
  - number: 8.3.a
    text: |-
      het bijbrengen van respect voor en kennis van de basiswaarden van de democratische rechtsstaat, zoals verankerd in
      de [Grondwet][ref1], en de universeel geldende fundamentele rechten en vrijheden van de mens, en het handelen naar
      deze basiswaarden op school;


      [ref1]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0001840
  - number: 8.3.b
    text: |-
      het ontwikkelen van de sociale en maatschappelijke competenties die de leerling in staat stellen deel uit te maken
      van en bij te dragen aan de pluriforme, democratische Nederlandse samenleving; en
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel8
  - number: 8.3.c
    text: |-
      het bijbrengen van kennis over en respect voor verschillen in godsdienst, levensovertuiging, politieke gezindheid,
      afkomst, geslacht, handicap of seksuele gerichtheid alsmede de waarde dat gelijke gevallen gelijk behandeld worden.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel8
  - number: 8.3a
    text: |-
      Het bevoegd gezag draagt zorg voor een schoolcultuur die in overeenstemming is met de waarden, bedoeld in het derde
      lid, onderdeel a, creëert een omgeving waarin leerlingen worden gestimuleerd actief te oefenen met de omgang met en
      het handelen naar deze waarden en draagt voorts zorg voor een omgeving waarin leerlingen en personeel zich veilig
      en geaccepteerd weten, ongeacht de in het derde lid, onder c, genoemde verschillen.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel8
  - number: '8.4'
    text: |-
      Ten aanzien van leerlingen die extra ondersteuning behoeven, is het onderwijs gericht op individuele begeleiding
      die is afgestemd op de behoeften van de leerling. Zo nodig treedt het bevoegd gezag daarbij in overleg met:
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel8
  - number: 8.4.a
    text: |-
      het college van burgemeester en wethouders van de gemeente waar de leerling zijn woonplaats heeft als bedoeld in
      [artikel 1.1. van de Jeugdwet][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel1
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '1'
  - number: 8.4.b
    text: |-
      een instantie die jeugdgezondheidszorg uitvoert als bedoeld in [artikel 5 van de Wet publieke gezondheid][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel5
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: '5'
  - number: 8.4.c
    text: |-
      een instantie die maatschappelijke ondersteuning biedt als bedoeld in
      [artikel 1, eerste lid, onder g, 2°, van de Wet maatschappelijke ondersteuning][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0020031#Artikel1
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0020031
        artikel: '1'
  - number: 8.4.d
    text: |-
      een zorgaanbieder als bedoeld in [artikel 1, eerste lid, onder j, van de Algemene Wet Bijzondere Ziektekosten][ref1]
      of


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel1
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '1'
  - number: 8.4.e
    text: |-
      een zorgaanbieder die geneeskundige geestelijke gezondheidszorg levert welke behoort tot de prestaties omschreven
      bij of krachtens de [Zorgverzekeringswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018450
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0018450
  - number: '8.5'
    text: Het bevoegd gezag stelt ten minste eenmaal in de 4 jaar een schoolondersteuningsprofiel vast.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel8
  - number: '8.6'
    text: |-
      De scholen gebruiken een leerling- en onderwijsvolgsysteem waaruit de vorderingen in de kennis en vaardigheden
      blijken op het niveau van de leerling, de groep en de school. Het leerling- en onderwijsvolgsysteem bevat toetsen
      die kennis en vaardigheden van de leerling meten in elk geval op het terrein van de Nederlandse taal en rekenen en
      wiskunde, met inachtneming van de referentieniveaus Nederlandse taal en de referentieniveaus rekenen, bedoeld in
      [artikel 2, tweede lid, aanhef en onderdeel a, van de Wet referentieniveaus Nederlandse taal en rekenen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0027679#Artikel2
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0027679
        artikel: '2'
  - number: '8.7'
    text: |-
      De toetsen, bedoeld in het zesde lid, voldoen aan het kwaliteitsoordeel van een door Onze Minister aangewezen
      onafhankelijke commissie betreffende inhoudelijke validiteit, betrouwbaarheid en deugdelijke normering. Bij of
      krachtens algemene maatregel van bestuur kunnen voorschriften omtrent het leerling- en onderwijsvolgsysteem en de
      daaraan verbonden toetsen worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel8
  - number: '8.8'
    text: |-
      De scholen voorzien in een voortgangsregistratie omtrent de ontwikkeling van leerlingen die extra ondersteuning
      behoeven, en omtrent leerlingen die onderwijs volgen als bedoeld in [artikel 165][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel165
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '165'
        hoofdstuk: I
        afdeling: '10'
  - number: '8.9'
    text: 'Het onderwijs wordt zodanig ingericht dat:'
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel8
  - number: 8.9.a
    text: de leerlingen in beginsel binnen een tijdvak van 8 aaneensluitende schooljaren de school kunnen doorlopen;
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel8
  - number: 8.9.b
    text: 'de leerlingen in 8 schooljaren ten minste 7.520 uren onderwijs ontvangen, met dien verstande dat:'
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel8
  - number: 8.9.b.1°
    text: |-
      de leerlingen in de eerste 4 schooljaren ten minste 3.520 uren onderwijs en in de laatste 4 schooljaren ten minste
      3.760 uren onderwijs ontvangen, en
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel8
  - number: 8.9.b.2°
    text: |-
      aan de leerlingen in de laatste 6 schooljaren ten hoogste 7 weken van het schooljaar 4 dagen per week onderwijs
      wordt gegeven, die evenwichtig zijn verdeeld over het schooljaar, bij een schoolweek van in beginsel niet minder
      dan 5 dagen onderwijs; en
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel8
  - number: 8.9.c
    text: |-
      de onderwijsactiviteiten evenwichtig over de dag worden verdeeld, tenzij afwijking van deze verdeling van belang is
      in verband met activiteiten in het kader van het voorkomen en bestrijden van onderwijsachterstanden.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel8
  - number: '8.10'
    text: |-
      Het onderwijs wordt zodanig ingericht dat leerlingen die in verband met ziekte thuis verblijven dan wel zijn
      opgenomen in een ziekenhuis, op adequate wijze voldoende onderwijs kunnen genieten.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel8
  - number: '8.11'
    text: |-
      Het onderwijs wordt zodanig ingericht dat daarbij op structurele en herkenbare wijze aandacht wordt besteed aan het
      bestrijden van achterstanden in het bijzonder in de beheersing van de Nederlandse taal, waarin ook door middel van
      vroegschoolse educatie kan worden voorzien.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel8
  - number: '8.12'
    text: |-
      De inspectie kan op verzoek van het bevoegd gezag ermee instemmen dat om lichamelijke of psychische redenen voor
      individuele leerlingen wordt afgeweken van het negende lid, onderdeel b.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel8
  - number: '9.1'
    text: 'Het onderwijs omvat, waar mogelijk in samenhang:'
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel9
  - number: 9.1.a
    text: zintuiglijke en lichamelijke oefening;
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel9
  - number: 9.1.b
    text: Nederlandse taal;
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel9
  - number: 9.1.c
    text: rekenen en wiskunde;
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel9
  - number: 9.1.d
    text: Engelse taal;
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel9
  - number: 9.1.e
    text: enkele kennisgebieden;
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel9
  - number: 9.1.f
    text: expressie-activiteiten;
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel9
  - number: 9.1.g
    text: bevordering van sociale redzaamheid, waaronder gedrag in het verkeer;
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel9
  - number: 9.1.h
    text: bevordering van gezond gedrag.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel9
  - number: '9.2'
    text: 'Bij de kennisgebieden wordt in elk geval aandacht besteed aan:'
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel9
  - number: 9.2.a
    text: aardrijkskunde;
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel9
  - number: 9.2.b
    text: geschiedenis;
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel9
  - number: 9.2.c
    text: de natuur, waaronder biologie;
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel9
  - number: 9.2.d
    text: maatschappelijke verhoudingen, waaronder staatsinrichting;
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel9
  - number: 9.2.e
    text: geestelijke stromingen.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel9
  - number: '9.3'
    text: |-
      Het onderwijs kan naast de onderwijsactiviteiten, genoemd in het eerste en tweede lid, tevens de Duitse taal of de
      Franse taal omvatten.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel9
  - number: '9.4'
    text: |-
      Op de scholen in de provincie Fryslân wordt tevens onderwijs gegeven in de Friese taal. Gedeputeerde staten
      kunnen op aanvraag van het bevoegd gezag gedeeltelijke of volledige ontheffing van deze verplichting verlenen.
      Gedeputeerde staten stellen in een beleidsregel criteria vast voor die gedeeltelijke en volledige ontheffing. De
      vaststelling geschiedt niet eerder dan nadat gedeputeerde staten overleg hebben gevoerd met het Friese primair
      onderwijs.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel9
  - number: '9.5'
    text: |-
      Ten aanzien van de onderwijsactiviteiten, genoemd in het eerste en tweede lid, worden bij algemene maatregel van
      bestuur kerndoelen vastgesteld. De algemene maatregel van bestuur bedoeld in de vorige volzin, wordt aan de beide
      Kamers der Staten-Generaal overgelegd. De maatregel treedt niet in werking dan nadat 4 weken na de overlegging zijn
      verstreken en gedurende die termijn niet door of namens een van beide Kamers de wens wordt te kennen gegeven dat
      het in die maatregel geregelde onderwerp bij de wet wordt geregeld. Alsdan wordt een daartoe strekkend wetsvoorstel
      zo spoedig mogelijk ingediend.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel9
  - number: '9.6'
    text: |-
      Ten aanzien van de onderwijsactiviteit, bedoeld in het vierde lid, stellen provinciale staten van Fryslân
      bij verordening kerndoelen Friese taal vast. De vaststelling geschiedt niet eerder dan nadat gedeputeerde
      staten overleg hebben gevoerd met het Friese primair onderwijs. De verordening behoeft de goedkeuring van
      Onze Minister. Indien Onze Minister voornemens is goedkeuring te onthouden, verzoekt hij de Onderwijsraad
      een advies uit te brengen. Het verzoek bevat een omschrijving van de onderwerpen waarover advies wordt
      verwacht. Het advies wordt binnen zes weken uitgebracht aan Onze Minister en wordt bekend gemaakt. Onze
      Minister informeert beide Kamers der Staten-Generaal over zijn voornemen om al dan niet goed te keuren.
      [Paragraaf 4.1.3.3 van de Algemene wet bestuursrecht][ref1] is niet van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: '9.7'
    text: |-
      Onze Minister kan goedkeuring als bedoeld in het zesde lid in ieder geval onthouden indien aan de volgende
      voorwaarden, waarvoor gedeputeerde staten gegevens aandragen, niet wordt voldaan:
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel9
  - number: 9.7.a
    text: het bestaan van voldoende draagvlak in het Friese primair onderwijs voor de voorgelegde kerndoelen Friese taal;
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel9
  - number: 9.7.b
    text: |-
      dat de kerndoelen Friese taal niet meer inspanningen van het Friese primair onderwijs vergen dan het aandeel van
      het onderwijs in de Friese taal binnen het totaal aan onderwijsactiviteiten rechtvaardigt.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel9
  - number: '9.8'
    text: |-
      Onze Minister kan goedkeuring als bedoeld in het zesde lid in ieder geval onthouden indien de kerndoelen Friese
      taal geen aandacht schenken aan:
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel9
  - number: 9.8.a
    text: het zich mondeling uitdrukken in het Fries en het verstaan van de Fries gesproken taal,
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel9
  - number: 9.8.b
    text: het zich schriftelijk uitdrukken in het Fries en het verwerven van informatie uit in het Fries gestelde teksten,
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel9
  - number: 9.8.c
    text: bevordering van het begrip van de Friese taal, en
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel9
  - number: 9.8.d
    text: het ontwikkelen van een positieve houding ten aanzien van het gebruik van het Fries.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel9
  - number: '9.9'
    text: |-
      Voor de school geldt de eis dat zij tenminste de kerndoelen bij haar onderwijsactiviteiten als aan het eind van
      het basisonderwijs te bereiken doelstellingen hanteert. Kerndoelen geven een beschrijving van kwaliteiten van
      leerlingen op het gebied van kennis, inzicht en vaardigheden. Indien de eerste volzin niet kan worden toegepast
      voor een leerling vanwege zijn handicap, wordt in het ontwikkelingsperspectief, bedoeld in [artikel 40a][ref1],
      aangegeven welke vervangende onderwijsdoelen worden gehanteerd.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel40a
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 40a
        hoofdstuk: I
        paragraaf: '4'
        afdeling: '1'
  - number: '9.10'
    text: |-
      Indien een bevoegd gezag van een bijzondere school dringend bedenkingen heeft tegen de krachtens het vijfde
      of zesde lid vastgestelde kerndoelen, kan het bevoegd gezag eigen kerndoelen voor de school vaststellen. Deze
      kerndoelen zijn van gelijk niveau als de kerndoelen, bedoeld in het vijfde of zesde lid. Het bevoegd gezag zendt de
      vastgestelde kerndoelen aan de inspecteur.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel9
  - number: '9.11'
    text: |-
      Bij de verzorging van het onderwijs op basis van de kerndoelen voor Nederlandse taal en rekenen
      en wiskunde, neemt het bevoegd gezag, met inachtneming van [artikel 8, eerste lid][ref1],
      de referentieniveaus Nederlandse taal en de referentieniveaus rekenen, bedoeld in
      [artikel 2, tweede lid, aanhef en onderdeel a, van de Wet referentieniveaus Nederlandse taal en rekenen][ref2],
      als uitgangspunt.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0027679#Artikel2
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '8'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0027679
        artikel: '2'
  - number: '9.13'
    text: |-
      Het onderwijs wordt gegeven in het Nederlands. Daar waar naast de Nederlandse taal, de Friese taal of een
      streektaal in levend gebruik is, kan de Friese taal of de streektaal mede als voertaal bij het onderwijs worden
      gebruikt. Voor de opvang in en de aansluiting bij het Nederlandse onderwijs van leerlingen met een niet-Nederlandse
      culturele achtergrond kan de taal van het land van oorsprong mede als voertaal bij het onderwijs worden gebruikt,
      overeenkomstig een door het bevoegd gezag vastgestelde gedragscode.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel9
  - number: 9.13a
    text: |-
      In afwijking van het dertiende lid kan een deel van het onderwijs worden gegeven in de Engelse, Duitse of Franse
      taal tot ten hoogste een bij algemene maatregel van bestuur vast te stellen percentage per schooljaar.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel9
  - number: '9.14'
    text: |-
      In afwijking van het dertiende lid, eerste volzin, kan het onderwijs aan een afdeling als bedoeld in
      [artikel 85a][ref1] worden gegeven in de Engelse taal, mits ten minste 10% van het aantal uren, bedoeld in
      [artikel 8, zevende lid][ref2], wordt gegeven in het Nederlands of wordt besteed aan de Nederlandse taal.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel85a
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel8
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 85a
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '8'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '1'
  - number: '9.15'
    text: |-
      Onze Minister kan in bijzondere gevallen op aanvraag van het bevoegd gezag besluiten toe te staan dat wordt
      afgeweken van de voorschriften in het eerste en tweede lid. De toestemming wordt verleend voor een bepaald tijdvak;
      zij kan voorwaarden bevatten.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel9
  - number: 9a.1
    text: |-
      Bij het geven van onderwijs aan een leerling die is opgenomen in een ziekenhuis of die in verband met ziekte thuis
      verblijft, kan het bevoegd gezag van een school worden ondersteund.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel9a
  - number: 9a.2
    text: 'De ondersteuning bedoeld in het eerste lid wordt verzorgd door:'
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel9a
  - number: 9a.2.a
    text: |-
      een educatieve voorziening als bedoeld in
      [artikel 1.4, tweede lid, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1] indien de leerling
      is opgenomen in een academisch ziekenhuis of


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
  - number: 9a.2.b
    text: |-
      een schoolbegeleidingsdienst, indien de leerling is opgenomen in een ziekenhuis niet zijnde een academisch
      ziekenhuis dan wel indien de leerling in verband met ziekte thuis verblijft.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel9a
  - number: 9a.3
    text: |-
      De ondersteuning bedoeld in het eerste lid kan in overeenstemming tussen de educatieve voorziening dan wel de
      schoolbegeleidingsdienst en de school waarbij de leerling is ingeschreven, mede het geven van onderwijs aan de
      leerling betreffen.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel9a
  - number: 9b.1
    text: |-
      In het achtste schooljaar legt de leerling in een volledige week tussen 15 april en 15 mei een centrale eindtoets
      af.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel9b
  - number: 9b.2
    text: |-
      De centrale eindtoets meet kennis en vaardigheden van de leerling op het terrein van Nederlandse taal en rekenen
      en wiskunde, met inachtneming van de referentieniveaus Nederlandse taal en de referentieniveaus rekenen, bedoeld
      in [artikel 2, tweede lid, aanhef en onderdeel a, van de Wet referentieniveaus Nederlandse taal en rekenen][ref1].
      Het bevoegd gezag kan bij een leerling tevens de toets voor de kennisgebieden, genoemd in
      [artikel 9, tweede lid, onderdelen a, b en c][ref2], afnemen.


      [ref1]: https://wetten.overheid.nl/BWBR0027679#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel9
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel9b
    references:
      - id: ref1
        bwb_id: BWBR0027679
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '9'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '1'
  - number: 9b.3
    text: |-
      Indien een leerling is verhinderd de centrale eindtoets af te leggen, wordt de toets op een later moment alsnog
      afgenomen, tenzij dit voor de leerling om medische redenen onmogelijk is.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel9b
  - number: 9b.4
    text: |-
      Het bevoegd gezag kan mede op basis van de toetsgegevens in het leerling- en onderwijsvolgsysteem, bedoeld in
      [artikel 8, zesde lid][ref1], gemotiveerd bepalen dat geen centrale eindtoets wordt afgelegd door:


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel8
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel9b
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '8'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '1'
  - number: 9b.4.a
    text: zeer moeilijk lerende leerlingen,
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel9b
  - number: 9b.4.b
    text: meervoudig gehandicapte leerlingen voor wie het zeer moeilijk lerend zijn een van de handicaps is, en
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel9b
  - number: 9b.4.c
    text: leerlingen die vier jaar of korter in Nederland zijn en om die reden de Nederlandse taal onvoldoende beheersen.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel9b
  - number: 9b.5
    text: |-
      Indien het bevoegd gezag op grond van het vierde lid, onderdelen a of b, bepaalt dat de leerling geen centrale
      eindtoets aflegt, informeert het de ouders over de grond voor die toepassing voor de aanvang van de afname van de
      centrale eindtoets.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel9b
  - number: 9b.6
    text: |-
      Indien het bevoegd gezag voornemens is te bepalen dat de leerling op grond van het vierde lid, onderdeel c, geen
      toets aflegt, overlegt het bevoegd gezag hierover met de ouders.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel9b
  - number: 9b.7
    text: |-
      Onze Minister kan het gebruik van andere eindtoetsen dan de centrale eindtoets, bedoeld in het eerste lid,
      toelaten. Dit artikel is van overeenkomstige toepassing op de andere eindtoetsen met dien verstande dat bij
      algemene maatregel van bestuur voorschriften worden gesteld ten aanzien van de toelating van andere eindtoetsen.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel9b
  - number: 9b.8
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voorschriften omtrent de centrale eindtoets worden
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel9b
  - number: 9b.9
    text: |-
      Tot een bij koninklijk besluit te bepalen datum zijn het eerste tot en met het achtste lid, niet van toepassing op
      leerlingen van een speciale school voor basisonderwijs.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel9b
  - number: 9c
    text: |-
      De voordracht voor een krachtens [artikel 8, zevende lid][ref1], en [artikel 9b, achtste en negende lid][ref2],
      vast te stellen algemene maatregel van bestuur wordt niet eerder gedaan dan vier weken nadat het ontwerp aan beide
      kamers der Staten-Generaal is overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel9b
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel9c
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '8'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: 9b
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '1'
  - number: '10'
    text: |-
      Het bevoegd gezag draagt zorg voor de kwaliteit van het onderwijs op de school. Onder zorg dragen voor de kwaliteit
      van het onderwijs wordt in elk geval verstaan het naleven van de bij of krachtens deze wet gegeven voorschriften en
      het uitvoeren van het stelsel van kwaliteitszorg, bedoeld in [artikel 12, vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel12
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '12'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '1'
  - number: 10a.1
    text: |-
      De kwaliteit van het onderwijs is zeer zwak indien de leerresultaten op de school aan het eind van het zevende
      of het achtste schooljaar op groepsniveau ernstig en langdurig tekortschieten en het bevoegd gezag in verband
      met dit tekortschieten eveneens tekortschiet in de naleving van een of meer bij of krachtens deze wet gegeven
      voorschriften. Het bevoegd gezag voldoet in elk geval niet aan de wettelijke opdracht om zorg te dragen voor de
      kwaliteit van het onderwijs, bedoeld in [artikel 10][ref1], indien de kwaliteit van het onderwijs zeer zwak is.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel10
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '10'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '1'
  - number: 10a.2
    text: |-
      Er is sprake van onvoldoende leerresultaten als bedoeld in het eerste lid indien op de school de leerresultaten
      op het gebied van de Nederlandse taal en op het gebied van rekenen en wiskunde, gemeten over een periode van
      3 schooljaren, liggen onder de in het vierde lid bedoelde normering die daarvoor geldt in vergelijking tot die
      leerresultaten over diezelfde schooljaren van scholen met een vergelijkbaar leerlingenbestand.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel10a
  - number: 10a.3
    text: |-
      De leerresultaten van de school worden jaarlijks beoordeeld op basis van de resultaten van de afgelegde centrale
      eindtoetsen, bedoeld in [artikel 9b][ref1], op het gebied van Nederlandse taal en rekenen en wiskunde. Voor
      de toepassing van de eerste volzin blijven centrale eindtoetsen die zijn afgelegd door zeer moeilijk lerende
      leerlingen, meervoudig gehandicapte leerlingen voor wie het zeer moeilijk lerend zijn een van de handicaps is, en
      leerlingen die vier jaar of korter in Nederland zijn en om die reden de Nederlandse taal onvoldoende beheersen,
      buiten beschouwing. De eerste en tweede volzin zijn van overeenkomstige toepassing op de andere eindtoetsen,
      bedoeld in artikel 9b, achtste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel9b
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 9b
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '1'
  - number: 10a.4
    text: |-
      Indien de leerresultaten van de school niet kunnen worden beoordeeld op grond van de regels gesteld bij of
      krachtens het vijfde lid, is de kwaliteit van het onderwijs zeer zwak indien de school tekortschiet in de naleving
      van twee of meer bij of krachtens deze wet gegeven voorschriften en de school dientengevolge tekortschiet in het
      zorg dragen voor de veiligheid op school, bedoeld in [artikel 4c][ref1], of het zodanig inrichten van het onderwijs
      dat leerlingen een ononderbroken ontwikkelingsproces kunnen doorlopen dan wel het afstemmen van het onderwijs op de
      voortgang in de ontwikkeling van de leerlingen, bedoeld in [artikel 8, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel4c
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel8
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 4c
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '8'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '1'
  - number: 10a.5
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot de wijze waarop
      leerresultaten worden gemeten, genormeerd en beoordeeld. Voorts wordt de normering, bedoeld in het derde lid,
      bepaald en wordt bepaald bij welk aantal leerlingen in het achtste schooljaar van een bepaalde school voor die
      school voor de periode van 3 schooljaren, bedoeld in het tweede lid, onderdeel a, wordt gelezen 5 schooljaren.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel10a
  - number: 10a.6
    text: |-
      De voordracht voor een krachtens het vijfde lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel10a
  - number: '11'
    text: |-
      Het bevoegd gezag rapporteert met inachtneming van het leerling- en onderwijsvolgsysteem, bedoeld in
      [artikel 8, zesde lid][ref1], over de vorderingen van de leerlingen aan hun ouders.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel8
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '8'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '1'
  - number: '12.1'
    text: |-
      Het schoolplan bevat een beschrijving van het beleid met betrekking tot de kwaliteit van het onderwijs dat
      binnen de school wordt gevoerd, en omvat in elk geval het onderwijskundig beleid, het personeelsbeleid en het
      stelsel van kwaliteitszorg. Het schoolplan omvat mede het beleid ten aanzien van de aanvaarding van materiële
      bijdragen of geldelijke bijdragen, niet zijnde ouderbijdragen of op de onderwijswetgeving gebaseerde bijdragen,
      indien het bevoegd gezag daarbij verplichtingen op zich neemt waarmee de leerlingen binnen de schooltijden
      en tijdens de activiteiten die worden georganiseerd onder verantwoordelijkheid van het bevoegd gezag, alsmede
      tijdens het overblijven, zullen worden geconfronteerd. In het schoolplan wordt aangegeven op welke wijze de
      identiteitscommissie, bedoeld in [artikel 17d][ref1], invulling geeft aan het openbare karakter onderscheidenlijk
      de identiteit voor zover het betreft een samenwerkingsschool.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel17d
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 17d
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '1'
  - number: '12.2'
    text: 'De beschrijving van het onderwijskundig beleid omvat in elk geval:'
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel12
  - number: 12.2.a
    text: |-
      de uitwerking van de wettelijke voorschriften betreffende de uitgangspunten, de doelstelling en de inhoud van het
      onderwijs,
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel12
  - number: 12.2.b
    text: |-
      de door het bevoegd gezag in het schoolplan opgenomen eigen opdrachten voor het onderwijs in een
      onderwijsprogramma,
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel12
  - number: 12.2.c
    text: het pedagogisch-didactisch klimaat en het schoolklimaat, en
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel12
  - number: 12.2.d
    text: het zorg dragen voor de veiligheid op school, bedoeld in artikel 4c.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel12
  - number: '12.3'
    text: 'De beschrijving van het personeelsbeleid omvat in elk geval:'
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel12
  - number: 12.3.a
    text: het voldoen aan de eisen van bevoegdheid en de wijze waarop de bekwaamheid wordt onderhouden,
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel12
  - number: 12.3.b
    text: cijfers over de mate van evenredige vertegenwoordiging van vrouwen in leidinggevende posities,
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel12
  - number: 12.3.c
    text: |-
      de maatregelen met betrekking tot het personeel die bijdragen aan de ontwikkeling en de uitvoering van het
      onderwijskundig beleid, en
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel12
  - number: 12.3.d
    text: het pedagogisch-didactisch handelen van het onderwijspersoneel.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel12
  - number: '12.4'
    text: 'De beschrijving van het stelsel van kwaliteitszorg omvat in elk geval het zorg dragen voor:'
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel12
  - number: 12.4.a
    text: |-
      het bewaken dat leerlingen een ononderbroken ontwikkelingsproces kunnen doorlopen en dat het onderwijs wordt
      afgestemd op de voortgang in de ontwikkeling van leerlingen, bedoeld in [artikel 8, eerste lid][ref1], mede met
      behulp van het leerling- en onderwijsvolgsysteem, bedoeld in artikel 8, zesde lid, en


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel8
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '8'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '1'
  - number: 12.4.b
    text: het vaststellen welke maatregelen ter verbetering nodig zijn.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel12
  - number: '13.1'
    text: |-
      De schoolgids bevat voor ouders, verzorgers en leerlingen informatie over de werkwijze van de school en bevat in
      elk geval informatie over:
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel13
  - number: 13.1.a
    text: |-
      de doelen van het onderwijs en de resultaten die met het onderwijsleerproces worden bereikt, met dien verstande dat
      bij algemene maatregel van bestuur voorschriften kunnen worden gegeven met betrekking tot de wijze waarop
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel13
  - number: 13.1.a.1°
    text: de resultaten worden beschreven die met het onderwijsleerproces worden bereikt, en
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel13
  - number: 13.1.a.2°
    text: de context wordt vermeld waarin de onder 1° bedoelde resultaten dienen te worden geplaatst,
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel13
  - number: 13.1.b
    text: de wijze waarop aan de ondersteuning van het jonge kind wordt vormgegeven,
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel13
  - number: 13.1.c
    text: de wijze waarop aan de ondersteuning van leerlingen die extra ondersteuning behoeven wordt vormgegeven,
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel13
  - number: 13.1.d
    text: de wijze waarop de verplichte onderwijstijd wordt benut,
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel13
  - number: 13.1.e
    text: |-
      de geldelijke bijdrage, bedoeld in [artikel 40, eerste lid][ref1], waarbij wordt vermeld dat deze vrijwillig is en
      dat het niet voldoen van die bijdrage niet leidt tot het uitsluiten van leerlingen van deelname aan activiteiten,


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel40
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '40'
        hoofdstuk: I
        paragraaf: '4'
        afdeling: '1'
  - number: 13.1.f
    text: |-
      de rechten en plichten van de ouders, de verzorgers, de leerlingen en het bevoegd gezag, waaronder de informatie
      over de klachtenregeling, bedoeld in [artikel 14][ref1], en de gronden voor vrijstelling van het onderwijs, bedoeld
      in [artikel 41, tweede lid][ref2],


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel41
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '14'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '41'
        hoofdstuk: I
        paragraaf: '4'
        afdeling: '1'
  - number: 13.1.g
    text: |-
      de wijze waarop het bevoegd gezag omgaat met de in [artikel 12, eerste lid][ref1], omschreven bijdragen,


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel12
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '12'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '1'
  - number: 13.1.i
    text: het beleid met betrekking tot de veiligheid,
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel13
  - number: 13.1.j
    text: |-
      de wijze waarop de voorzieningen, bedoeld in [artikel 45][ref1], worden georganiseerd,


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel45
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '45'
        hoofdstuk: I
        paragraaf: '5'
        afdeling: '1'
  - number: 13.1.k
    text: het verzuimbeleid,
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel13
  - number: 13.1.l
    text: |-
      de wijze waarop de identiteitscommissie, bedoeld in [artikel 17d][ref1], invulling geeft aan het openbare karakter
      onderscheidenlijk de identiteit voor zover het betreft een samenwerkingsschool,


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel17d
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 17d
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '1'
  - number: 13.1.m
    text: |-
      het samenwerkingsverband en in voorkomend geval de samenwerkingsverbanden waarbij het bevoegd gezag van de school
      is aangesloten,
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel13
  - number: 13.1.n
    text: |-
      de persoon bij wie de taken, bedoeld in [artikel 4c, eerste lid, onderdeel c][ref1], zijn belegd, en


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel4c
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 4c
        hoofdstuk: I
  - number: 13.1.o
    text: |-
      de in het kader van het stelsel van kwaliteitszorg, bedoeld in [artikel 12, vierde lid][ref1], gedane bevindingen
      en de maatregelen die naar aanleiding daarvan zijn getroffen.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel12
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '12'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '1'
  - number: '13.2'
    text: |-
      De algemene maatregel van bestuur, bedoeld in het eerste lid, onder a, wordt aan de beide kamers der Staten-
      Generaal overgelegd. De maatregel treedt niet in werking dan nadat 4 weken na de overlegging zijn verstreken en
      gedurende die termijn niet door of namens een der kamers de wens te kennen wordt gegeven dat het in die maatregel
      geregelde onderwerp bij de wet wordt geregeld. Alsdan wordt een daartoe strekkend wetsvoorstel zo spoedig mogelijk
      ingediend.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel13
  - number: 13a.1
    text: |-
      Het bevoegd gezag stelt ten minste eenmaal in de vier jaar het schoolplan vast en stelt dit zo spoedig mogelijk na
      de vaststelling beschikbaar voor de inspectie.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel13a
  - number: 13a.2
    text: |-
      Het bevoegd gezag stelt jaarlijks de schoolgids vast ten behoeve van het eerstvolgende schooljaar en stelt deze zo
      spoedig mogelijk na de vaststelling beschikbaar voor de ouders en de inspectie.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel13a
  - number: '14.1'
    text: |-
      Ouders dan wel verzorgers, en personeelsleden kunnen bij de klachtencommissie, bedoeld in het tweede lid,
      onderdeel a, een klacht indienen over gedragingen en beslissingen van het bevoegd gezag of het personeel, waaronder
      discriminatie, dan wel het nalaten van gedragingen en het niet nemen van beslissingen door het bevoegd gezag of
      het personeel.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel14
  - number: '14.2'
    text: 'Het bevoegd gezag treft een regeling voor de behandeling van klachten. Deze regeling vermeldt in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel14
  - number: 14.2.a
    text: de instelling van een klachtencommissie, die klachten behandelt,
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel14
  - number: 14.2.b
    text: de wijze waarop de klachtencommissie haar werkzaamheden verricht,
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel14
  - number: 14.2.c
    text: de termijn waarbinnen de klager een klacht kan indienen en
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel14
  - number: 14.2.d
    text: |-
      de termijn waarbinnen mededeling plaatsvindt van het oordeel, bedoeld in het zesde lid, en hoe bij noodzakelijke
      afwijking van deze termijn wordt gehandeld.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel14
  - number: '14.3'
    text: |-
      Deze regeling strekt ter vervanging van klachtenregelingen op grond van andere voorschriften dan dit artikel en
      strekt niet ter vervanging van een andere voorziening die op grond van een wettelijke regeling, niet zijnde een
      klachtenregeling, voor de klager openstaat of heeft opengestaan.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel14
  - number: '14.4'
    text: Deze regeling
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel14
  - number: 14.4.a
    text: |-
      voorziet erin dat de klachten worden behandeld door een klachtencommissie die bestaat uit ten minste drie leden,
      waaronder een voorzitter die geen deel uitmaakt van het bevoegd gezag en niet werkzaam is voor of bij het bevoegd
      gezag en
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel14
  - number: 14.4.b
    text: |-
      waarborgt dat aan de behandeling van een klacht niet wordt deelgenomen door een persoon op wiens gedraging de
      klacht rechtstreeks betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel14
  - number: '14.5'
    text: 'De klager en degene over wie is geklaagd dan wel de instantie waarover is geklaagd krijgen de gelegenheid:'
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel14
  - number: 14.5.a
    text: hun zienswijze mondeling of schriftelijk toe te lichten en
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel14
  - number: 14.5.b
    text: zich bij de behandeling van de klacht te laten bijstaan.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel14
  - number: '14.6'
    text: |-
      De klachtencommissie vormt zich een oordeel over de gegrondheid van de klacht en deelt dit oordeel, al dan niet
      vergezeld van aanbevelingen, schriftelijk mede aan de klager, degene over wie is geklaagd dan wel de instantie
      waarover is geklaagd en het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel14
  - number: '14.7'
    text: |-
      Het bevoegd gezag deelt de klager en de klachtencommissie, bedoeld in het tweede lid, onderdeel a, binnen 4 weken
      na ontvangst van het in het zesde lid bedoelde oordeel van de klachtencommissie schriftelijk mede of hij het
      oordeel over de gegrondheid van de klacht deelt en of hij naar aanleiding van dat oordeel maatregelen zal nemen en
      zo ja welke. Bij afwijking van de in de eerste volzin bedoelde termijn, doet het bevoegd gezag daarvan met redenen
      omkleed mededeling aan de klager en de klachtencommissie onder vermelding van de termijn waarbinnen het bevoegd
      gezag zijn standpunt bekend zal maken.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel14
  - number: '14.8'
    text: |-
      Degene die betrokken is bij de uitvoering van dit artikel en daarbij de beschikking krijgt over gegevens waarvan
      hij het vertrouwelijke karakter kent of redelijkerwijze moet vermoeden, is verplicht tot geheimhouding daarvan,
      behoudens voor zover enig wettelijk voorschrift hem tot mededeling verplicht of uit zijn taak de noodzaak tot
      mededeling voortvloeit.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel14
  - number: '14.9'
    text: |-
      Gegevens die betrekking hebben op een klacht worden bewaard op een plaats die uitsluitend toegankelijk is voor de
      leden van de klachtencommissie en het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel14
  - number: '15.1'
    text: |-
      Indien een leerling gedurende een deel van het onderwijsprogramma onderwijs ontvangt op een andere school, op
      een school voor speciaal onderwijs, op een school voor speciaal en voortgezet speciaal onderwijs, dan wel op een
      instelling voor speciaal en voortgezet speciaal onderwijs telt de tijd gedurende welke de leerling dit onderwijs
      ontvangt mee voor het aantal uren onderwijs dat de leerling ten minste moet ontvangen.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel15
  - number: '15.2'
    text: |-
      Bij ministeriële regeling kunnen voorschriften worden vastgesteld omtrent vakanties. Daarbij kunnen begin en eind
      van vakanties worden vastgesteld die niet voor alle scholen gelijk behoeven te zijn.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel15
  - number: '15.3'
    text: |-
      Bij algemene maatregel van bestuur kunnen voorschriften worden gegeven omtrent de uitvoering van het eerste lid
      alsmede omtrent de aard en de eisen aan de scholen en instellingen, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel15
  - number: '17.1'
    text: |-
      De instandhouding van een of meer openbare en een of meer bijzondere scholen kan worden opgedragen of overgedragen
      aan een stichting die met dit doel wordt onderscheidenlijk is opgericht. De besluitvorming van de zijde van de
      gemeente vindt plaats door de gemeenteraad.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel17
  - number: '17.2'
    text: |-
      Het statutaire doel van de stichting is in elk geval het geven van openbaar onderwijs en bijzonder onderwijs in
      afzonderlijke scholen voor openbaar onderscheidenlijk bijzonder onderwijs.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel17
  - number: '17.3'
    text: De stichting oefent alle taken en bevoegdheden van het bevoegd gezag uit.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel17
  - number: '17.4'
    text: 'De statuten voorzien in ieder geval in een regeling omtrent:'
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel17
  - number: 17.4.a
    text: de samenstelling, werkwijze en inrichting van het bestuur van de stichting,
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel17
  - number: 17.4.b
    text: de wijze van benoeming, herbenoeming, schorsing en ontslag van de bestuursleden,
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel17
  - number: 17.4.c
    text: de termijn waarvoor de bestuursleden worden benoemd,
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel17
  - number: 17.4.d
    text: |-
      de vaststelling van de begroting en jaarrekening na overleg met de gemeenteraad van de gemeente waarin de school
      waar openbaar onderwijs wordt gegeven, gevestigd is,
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel17
  - number: 17.4.e
    text: |-
      de wijze waarop de gemeenteraad van de gemeente waarin de school waar openbaar onderwijs wordt gegeven, gevestigd
      is, toezicht op het bestuur van die school uitoefent,
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel17
  - number: 17.4.f
    text: de gronden waarop het bestuur kan besluiten de vergaderingen besloten te houden,
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel17
  - number: 17.4.g
    text: |-
      de periode waarvoor de stichting in het leven wordt geroepen, met dien verstande dat deze periode ten minste 5
      jaren bedraagt, en
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel17
  - number: 17.4.h
    text: |-
      de bevoegdheid de stichting te ontbinden, met dien verstande dat in de regeling een overheersende invloed van de
      overheid in het bestuur is verzekerd voor zover het openbaar onderwijs betreft.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel17
  - number: '17.5'
    text: |-
      De statuten van de stichting kunnen slechts worden gewijzigd na instemming van de gemeenteraad van de gemeente
      waarin de school waar openbaar onderwijs wordt gegeven, gevestigd is. Instemming kan slechts worden onthouden
      indien overheersende invloed van de overheid in het bestuur niet is verzekerd voor zover het openbaar onderwijs
      betreft.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel17
  - number: '17.6'
    text: |-
      Het bestuur brengt jaarlijks aan de gemeenteraad van de gemeente waarin de school waar openbaar onderwijs wordt
      gegeven, gevestigd is, verslag uit over de werkzaamheden, waarbij in ieder geval aandacht wordt geschonken aan de
      wezenskenmerken van het openbaar onderwijs. Het verslag wordt bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel17
  - number: '17.7'
    text: |-
      De vergaderingen van het bestuur van de stichting zijn openbaar, tenzij het bestuur anders beslist, op gronden,
      vermeld in de statuten.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel17
  - number: '17.8'
    text: |-
      In geval van ernstige taakverwaarlozing door het bestuur of functioneren in strijd met de wet, voor zover het
      openbaar onderwijs betreft, neemt de gemeenteraad van de gemeente waarin de openbare school is gelegen, de
      maatregelen die hij nodig acht om de continuïteit van het onderwijsproces te waarborgen voor zover het openbaar
      onderwijs betreft.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel17
  - number: '17.9'
    text: |-
      Indien de laatste afzonderlijke openbare school en de laatste afzonderlijke bijzondere school die door de stichting
      in stand worden gehouden, zijn gefuseerd tot een samenwerkingsschool als bedoeld in [artikel 17d][ref1] kan de
      instandhouding van die samenwerkingsschool opgedragen blijven aan de stichting.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel17d
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 17d
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '1'
  - number: 17a.1
    text: |-
      Het bevoegd gezag draagt mede in verband met de verplichting, bedoeld in [artikel 10][ref1], zorg voor een goed
      bestuurde school met een scheiding tussen de functies van bestuur en het toezicht daarop en met een rechtmatig
      bestuur en beheer.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel10
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '10'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '1'
  - number: 17a.2
    text: |-
      De benoeming in de functies van het bestuur en het interne toezicht op het bestuur, bedoeld in het eerste lid,
      geschiedt op basis van vooraf openbaar gemaakte profielen. Bij de benoeming van de leden van de raad van toezicht
      wordt de medezeggenschapsraad van de school, bedoeld in [artikel 3 van de Wet medezeggenschap op scholen][ref1],
      in de gelegenheid gesteld een bindende voordracht te doen voor een lid. Bij de benoeming van de leden
      van de raad van toezicht van het samenwerkingsverband wordt de ondersteuningsplanraad, bedoeld in
      [artikel 4a van de Wet medezeggenschap op scholen][ref2], in de gelegenheid gesteld een bindende voordracht te doen
      voor een lid.


      [ref1]: https://wetten.overheid.nl/BWBR0020685#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020685#Artikel4a
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0020685
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020685
        artikel: 4a
  - number: 17a.3
    text: Het eerste lid en het tweede lid, eerste volzin, zijn van overeenkomstige toepassing op een samenwerkingsverband.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel17a
  - number: 17b.1
    text: |-
      Het bevoegd gezag draagt er zorg voor dat de functies van bestuur en intern toezicht op het bestuur in functionele
      of organieke zin zijn gescheiden.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel17b
  - number: 17b.2
    text: |-
      Een intern toezichthouder of een lid van het interne toezichthoudend orgaan functioneert onafhankelijk van het
      bestuur.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel17b
  - number: 17b.3
    text: Dit artikel is van overeenkomstige toepassing op een samenwerkingsverband.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel17b
  - number: 17c.1
    text: |-
      De interne toezichthouder of het interne toezichthoudend orgaan houdt toezicht op de uitvoering van de taken en de
      uitoefening van de bevoegdheden door het bestuur en staat het bestuur met raad terzijde. De toezichthouder of het
      toezichthoudend orgaan is ten minste belast met:
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel17c
  - number: 17c.1.a
    text: |-
      het goedkeuren van de begroting en het jaarverslag en, indien van toepassing, het strategisch meerjarenplan van
      de school;
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel17c
  - number: 17c.1.b
    text: |-
      het toezien op de naleving door het bestuur van wettelijke verplichtingen, de code voor goed bestuur, bedoeld in
      [artikel 171, eerste lid, onderdeel a][ref1], en de afwijkingen van die code;


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel171
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel17c
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '171'
        hoofdstuk: I
        afdeling: '11'
  - number: 17c.1.c
    text: |-
      het toezien op de rechtmatige verwerving en de doelmatige en rechtmatige bestemming en aanwending van de middelen
      van de school verkregen op grond van deze wet;
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel17c
  - number: 17c.1.d
    text: |-
      het aanwijzen van een accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1] die verslag uitbrengt aan de toezichthouder
      of het toezichthoudend orgaan, en


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel17c
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: 17c.1.e
    text: |-
      het jaarlijks afleggen van verantwoording over de uitvoering van de taken en de uitoefening van de bevoegdheden,
      bedoeld onder a tot en met d, in het jaarverslag.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel17c
  - number: 17c.2
    text: |-
      De taken en bevoegdheden van de interne toezichthouder of het interne toezichthoudend orgaan zijn zodanig dat hij
      een deugdelijk en onafhankelijk intern toezicht kan uitoefenen. Indien sprake is van meer dan een toezichthouder of
      van een toezichthoudend orgaan is de eerste volzin van overeenkomstige toepassing met betrekking tot de combinatie
      van de toezichthouders of de samenstelling van het toezichthoudend orgaan.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel17c
  - number: 17c.3
    text: |-
      De interne toezichthouder of het interne toezichthoudend orgaan pleegt ten minste tweemaal per jaar overleg met
      de medezeggenschapsraad.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel17c
  - number: 17c.4
    text: |-
      Indien het intern toezicht wordt uitgeoefend door een raad van toezicht, zijn het eerste lid en het tweede lid
      van overeenkomstige toepassing ten aanzien van een raad van toezicht. Een raad van toezicht is tevens belast met
      het benoemen, schorsen en ontslaan en de vaststelling van de beloning van de leden van het bestuur, alsmede de
      toepassing van de [artikelen 29, vijfde lid][ref1], [33 tot en met 34a][ref2], [38][ref3], en de daarmee verband
      houdende wettelijke bepalingen op leden van het bestuur die mede tot het personeel behoren.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel33
      [ref3]: https://wetten.overheid.nl/BWBR0003420#Artikel38
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel17c
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '29'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '33'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0003420
        artikel: '38'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: '1'
  - number: 17c.5
    text: |-
      Dit artikel is, met uitzondering van het derde lid, van overeenkomstige toepassing op een
      samenwerkingsverband. De interne toezichthouder of het interne toezichthoudend orgaan van het
      samenwerkingsverband pleegt ten minste tweemaal per jaar overleg met de ondersteuningsplanraad, bedoeld in
      [artikel 4a van de Wet medezeggenschap op scholen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020685#Artikel4a
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel17c
    references:
      - id: ref1
        bwb_id: BWBR0020685
        artikel: 4a
  - number: 17d.1
    text: |-
      Een samenwerkingsschool is een school waarin zowel openbaar onderwijs als bijzonder onderwijs wordt aangeboden.
      Een samenwerkingsschool kan uitsluitend tot stand komen door samenvoeging van één of meer openbare scholen
      met één of meer bijzondere scholen en wordt in stand gehouden door een stichting, een stichting als bedoeld in
      [artikel 17][ref1] of een stichting als bedoeld in [artikel 48][ref2] waarvan het statutaire doel in ieder geval
      is het in stand houden van een samenwerkingsschool. De [artikelen 49][ref3] en [56][ref4] zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel48
      [ref3]: https://wetten.overheid.nl/BWBR0003420#Artikel49
      [ref4]: https://wetten.overheid.nl/BWBR0003420#Artikel56
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel17d
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '17'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '48'
        hoofdstuk: I
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0003420
        artikel: '49'
        hoofdstuk: I
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0003420
        artikel: '56'
        hoofdstuk: I
        afdeling: '3'
  - number: 17d.2
    text: 'Een samenwerkingsschool kan uitsluitend tot stand komen indien:'
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel17d
  - number: 17d.2.a
    text: |-
      met die totstandkoming van de samenwerkingsschool de continuïteit van het openbaar of bijzonder onderwijs
      gehandhaafd kan blijven; en
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel17d
  - number: 17d.2.b
    text: de betrokken scholen ten minste zes schooljaren zijn bekostigd.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel17d
  - number: 17d.3
    text: |-
      Van een situatie als bedoeld in het tweede lid, onderdeel a, is sprake indien één van de betrokken scholen op
      1 oktober van het eerste of tweede schooljaar voorafgaand aan de fusiedatum werd bezocht door een aantal leerlingen
      dat ten hoogste gelijk is aan de opheffingsnorm, bedoeld in [artikel 154][ref1], verhoogd met de uitkomst van de
      formule 67,797 – (0,339 x de opheffingsnorm), met een maximum van 200 leerlingen. De uitkomst van de berekening
      wordt afgerond overeenkomstig artikel 154, tweede volzin.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel154
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel17d
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '154'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '9'
  - number: 17d.4
    text: Samenwerkingsscholen zijn toegankelijk voor alle kinderen zonder onderscheid van godsdienst of levensbeschouwing.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel17d
  - number: 17d.5
    text: Aan een samenwerkingsschool is een identiteitscommissie verbonden.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel17d
  - number: 17d.6
    text: |-
      De identiteitscommissie adviseert gevraagd en ongevraagd het bevoegd gezag en de directeur over alle
      aangelegenheden die betrekking hebben op de wijze waarop invulling wordt gegeven aan het openbare karakter en de
      identiteit van de samenwerkingsschool. De identiteitscommissie kan tevens voorstellen doen over de aangelegenheden,
      bedoeld in de eerste volzin.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel17d
  - number: 17d.7
    text: |-
      De statuten van de stichting die de samenwerkingsschool in stand houdt, voorzien in een regeling over de
      identiteitscommissie waarin in ieder geval de samenstelling, benoeming, herbenoeming, ontslag, duur van de
      benoeming, werkwijze, inrichting en bevoegdheden van de identiteitscommissie zijn vastgelegd alsmede een
      voorziening voor het beslechten van geschillen tussen het bevoegd gezag en de identiteitscommissie. Bij de
      samenstelling van de identiteitscommissie is sprake van een evenwichtige verdeling tussen openbaar en bijzonder
      onderwijs.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel17d
  - number: 17d.8
    text: |-
      Wijziging van de statuten van de stichting die de samenwerkingsschool in stand houdt voor zover die betrekking
      hebben op de regeling over de identiteitscommissie, is slechts mogelijk indien het bevoegd gezag en de
      identiteitscommissie daartoe gezamenlijk besluiten. Indien het een stichting betreft anders dan een stichting
      als bedoeld in [artikel 17][ref1] en anders dan bedoeld in artikel 48, kan een wijziging als bedoeld in de eerste
      volzin uitsluitend tot stand komen met instemming van de gemeenteraad van de gemeente waarin de samenwerkingsschool
      gevestigd is. Instemming kan slechts worden onthouden indien overheersende invloed van de overheid in de
      identiteitscommissie niet is verzekerd voor zover het openbaar onderwijs binnen de samenwerkingsschool betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel17
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel17d
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '17'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '1'
  - number: 17d.9
    text: |-
      De stichting anders dan een stichting als bedoeld in [artikel 17][ref1] en anders dan bedoeld in [artikel 48][ref2]
      brengt jaarlijks aan de gemeenteraad van de gemeente waarin de samenwerkingsschool gevestigd is verslag uit over de
      werkzaamheden waarbij in ieder geval aandacht wordt geschonken aan de wezenskenmerken van het openbaar onderwijs.
      Het verslag wordt bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel48
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel17d
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '17'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '48'
        hoofdstuk: I
        afdeling: '2'
  - number: 17d.10
    text: |-
      De voorschriften van deze wet en van andere wetten die het primair onderwijs betreffen, alsmede de daarop
      gebaseerde regelingen, voor zover die voorschriften en regelingen betrekking hebben op een bijzondere school,
      zijn van overeenkomstige toepassing op een samenwerkingsschool als bedoeld in het eerste lid, tenzij het tegendeel
      blijkt.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel17d
  - number: 17d.11
    text: |-
      In geval van ernstige taakverwaarlozing door het bestuur of functioneren in strijd met de wet, voor zover
      het openbaar onderwijs betreft, neemt de gemeenteraad van de gemeente waar de samenwerkingsschool gevestigd
      is, de maatregelen die hij nodig acht om de continuïteit van het onderwijsproces te waarborgen voor zover het
      openbaar onderwijs betreft. De feitelijke samenwerking wordt beëindigd op 1 augustus van het jaar na een daartoe
      door de gemeenteraad van de gemeente waar de samenwerkingsschool gevestigd is, en het bevoegd gezag van de
      samenwerkingsschool gezamenlijk genomen besluit.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel17d
  - number: 17d.12
    text: |-
      [Artikel 159, tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel159
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel17d
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '159'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '9'
  - number: 17d.13
    text: |-
      Overdracht of fusie van de samenwerkingsschool is slechts mogelijk na instemming van de gemeenteraad van de
      gemeente waar de samenwerkingsschool gevestigd is.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel17d
  - number: 18a.1
    text: |-
      Het bevoegd gezag van één of meer scholen is voor elke vestiging van die school of scholen aangesloten bij een
      samenwerkingsverband als bedoeld in het tweede lid of bij een landelijk samenwerkingsverband als bedoeld in het
      vijftiende lid.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel18a
  - number: 18a.2
    text: |-
      Een samenwerkingsverband omvat alle binnen een gebied als bedoeld in het derde lid gelegen vestigingen van scholen,
      scholen voor speciaal onderwijs en scholen voor speciaal en voortgezet speciaal onderwijs, voor zover daaraan
      speciaal onderwijs wordt verzorgd, behorend tot cluster 3 en 4, bedoeld in de [Wet op de expertisecentra][ref1],
      met uitzondering van vestigingen waarvoor het bevoegd gezag is aangesloten bij een landelijk samenwerkingsverband.
      Het samenwerkingsverband stelt zich ten doel een samenhangend geheel van ondersteuningsvoorzieningen binnen en
      tussen de scholen, bedoeld in de vorige volzin, te realiseren en wel zodanig dat leerlingen een ononderbroken
      ontwikkelingsproces kunnen doormaken en leerlingen die extra ondersteuning behoeven een zo passend mogelijke plaats
      in het onderwijs krijgen.


      [ref1]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel18a
    references:
      - id: ref1
        bwb_id: BWBR0003549
  - number: 18a.3
    text: Bij ministeriële regeling worden voor de samenwerkingsverbanden aaneengesloten gebieden aangewezen.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel18a
  - number: 18a.3a
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld over de wijze waarop een samenwerkingsverband
      dat is gelegen aan de landsgrens bij de vervulling van zijn taken kan samenwerken met een school of instelling
      in België of in een van de bondsstaten Noord-Rijnland-Westfalen, Nedersaksen of Bremen van de Bondsrepubliek
      Duitsland.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel18a
  - number: 18a.4
    text: |-
      De bevoegde gezagsorganen van de scholen, bedoeld in het tweede lid, geven het samenwerkingsverband vorm door
      het oprichten van een rechtspersoon met volledige rechtsbevoegdheid zonder winstoogmerk, waarin uitsluitend deze
      bevoegde gezagsorganen deelnemen, behoudens deelname van een bevoegd gezag op grond van het vijfde lid. De statuten
      van de rechtspersoon bevatten een voorziening voor de beslechting van geschillen.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel18a
  - number: 18a.5
    text: |-
      Indien het bevoegd gezag van een school voor speciaal onderwijs of een school voor speciaal en voortgezet
      speciaal onderwijs, behorend tot cluster 3 en 4, bedoeld in de [Wet op de expertisecentra][ref1], waarvan de
      vestiging of vestigingen zijn gelegen buiten het gebied van een samenwerkingsverband, wenst deel te nemen aan dit
      samenwerkingsverband, wordt dit bevoegd gezag niet uitgesloten van deelname aan het samenwerkingsverband.


      [ref1]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel18a
    references:
      - id: ref1
        bwb_id: BWBR0003549
  - number: 18a.6
    text: 'Het samenwerkingsverband heeft in elk geval tot taak:'
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel18a
  - number: 18a.6.a
    text: het vaststellen van een ondersteuningsplan,
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel18a
  - number: 18a.6.b
    text: |-
      het verdelen en toewijzen van ondersteuningsmiddelen en ondersteuningsvoorzieningen aan de scholen, bedoeld in het
      tweede lid,
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel18a
  - number: 18a.6.c
    text: |-
      het beoordelen of leerlingen toelaatbaar zijn tot het onderwijs aan een speciale school voor basisonderwijs in het
      samenwerkingsverband of tot het speciaal onderwijs, op verzoek van het bevoegd gezag van een school als bedoeld in
      het tweede lid waar de leerling is aangemeld of ingeschreven, en
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel18a
  - number: 18a.6.d
    text: |-
      het adviseren over de ondersteuningsbehoefte van een leerling op verzoek van het bevoegd gezag van een school als
      bedoeld in het tweede lid waar de leerling is aangemeld of ingeschreven.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel18a
  - number: 18a.7
    text: |-
      Het samenwerkingsverband stelt ten minste eenmaal in de 4 jaar een ondersteuningsplan vast. Bij het vaststellen
      van het ondersteuningsplan kunnen door het samenwerkingsverband slechts beperkingen worden gesteld aan de door de
      school gewenste invulling van het schoolondersteuningsprofiel, indien dat voor het samenwerkingsverband met het oog
      op de beschikbare ondersteuningsmiddelen en ondersteuningsvoorzieningen een onevenredige belasting zou vormen.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel18a
  - number: 18a.8
    text: 'Het ondersteuningsplan omvat in elk geval:'
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel18a
  - number: 18a.8.a
    text: |-
      de wijze waarop wordt voldaan aan het tweede lid, tweede volzin, waaronder tevens zijn begrepen de
      basisondersteuningsvoorzieningen die op alle vestigingen van scholen in het samenwerkingsverband aanwezig zijn,
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel18a
  - number: 18a.8.b
    text: |-
      de procedure en criteria voor de verdeling, besteding en toewijzing van ondersteuningsmiddelen en
      ondersteuningsvoorzieningen aan de scholen, bedoeld in het tweede lid, mede bezien in het perspectief van een
      meerjarenbegroting,
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel18a
  - number: 18a.8.c
    text: |-
      de procedure en criteria voor de plaatsing van leerlingen op speciale scholen voor basisonderwijs in het
      samenwerkingsverband en op scholen voor speciaal onderwijs en speciaal en voortgezet speciaal onderwijs,
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel18a
  - number: 18a.8.d
    text: |-
      de procedure en het beleid met betrekking tot de terugplaatsing of overplaatsing naar het basisonderwijs van
      leerlingen van scholen voor speciaal onderwijs en speciaal en voortgezet speciaal onderwijs voor wie de periode
      waarop de toelaatbaarheidsverklaring, bedoeld in [artikel 40, tiende lid, van de Wet op de expertisecentra][ref1]
      betrekking heeft, is verstreken,


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel40
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel18a
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '40'
  - number: 18a.8.e
    text: |-
      de beoogde en bereikte kwalitatieve en kwantitatieve resultaten van het onderwijs aan leerlingen die extra
      ondersteuning behoeven en de daarmee samenhangende bekostiging,
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel18a
  - number: 18a.8.f
    text: |-
      de wijze waarop aan de ouders informatie wordt verstrekt over de ondersteuningsvoorzieningen en over de
      onafhankelijke ondersteuningsmogelijkheden voor ouders,
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel18a
  - number: 18a.8.g
    text: |-
      de wijze waarop wordt bepaald of de situaties, bedoeld in de [artikelen 118, vierde lid][ref1], en [124][ref2],
      zich voordoen,


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel118
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel124
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel18a
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '118'
        hoofdstuk: I
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '124'
        hoofdstuk: I
        afdeling: '5'
  - number: 18a.8.h
    text: |-
      de wijze waarop wordt vastgesteld wat het aandeel van de onderscheiden scholen is in de overdracht van de
      bekostiging voor materiële instandhouding in een situatie als bedoeld in [artikel 124, zevende lid][ref1], of
      [artikel 125, zesde lid][ref2],


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel124
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel125
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel18a
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '124'
        hoofdstuk: I
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '125'
        hoofdstuk: I
        afdeling: '5'
  - number: 18a.8.i
    text: |-
      de wijze waarop wordt bepaald of de situaties, bedoeld in [artikel 125b][ref1] zich voordoen, en


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel125b
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel18a
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 125b
        hoofdstuk: I
        afdeling: '5'
  - number: 18a.8.j
    text: |-
      de wijze waarop wordt vastgesteld wat het aandeel van de onderscheiden scholen, bedoeld in het tweede lid, is in de
      overdracht van de bekostiging personeelskosten in een situatie als bedoeld in [artikel 125b, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel125b
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel18a
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 125b
        hoofdstuk: I
        afdeling: '5'
  - number: 18a.9
    text: |-
      Het ondersteuningsplan wordt niet vastgesteld voordat over een concept van het plan op overeenstemming
      gericht overleg heeft plaatsgevonden met burgemeester en wethouders van de desbetreffende
      gemeente of gemeenten en overleg heeft plaatsgevonden met het samenwerkingsverband, bedoeld in
      [artikel 17a, tweede lid, van de Wet op het voortgezet onderwijs][ref1], waarvan het gebied geheel of gedeeltelijk
      samenvalt met het gebied van het samenwerkingsverband. Het overleg met burgemeester en wethouders vindt plaats
      overeenkomstig een procedure, vastgesteld door het samenwerkingsverband en burgemeester en wethouders van die
      gemeente of gemeenten. De procedure bevat een voorziening voor het beslechten van geschillen.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel17a
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel18a
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 17a
  - number: 18a.10
    text: |-
      Het ondersteuningsplan wordt voor 1 mei voorafgaand aan het eerste schooljaar van de periode waarop het plan
      betrekking heeft, toegezonden aan de inspectie.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel18a
  - number: 18a.10a
    text: |-
      Het samenwerkingsverband kan, met het oog op de doelstelling, bedoeld in het tweede lid, een of meer
      orthopedagogisch-didactische centra inrichten. Bij algemene maatregel van bestuur kunnen regels worden gesteld over
      de voorwaarden waaronder een zodanige voorziening kan worden ingericht.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel18a
  - number: 18a.11
    text: |-
      Het samenwerkingsverband draagt er zorg voor dat deskundigen in elk geval het samenwerkingsverband adviseren
      over de toelaatbaarheid van leerlingen tot het onderwijs aan een speciale school voor basisonderwijs in het
      samenwerkingsverband of tot het speciaal onderwijs. Bij algemene maatregel van bestuur worden nadere voorschriften
      gegeven met betrekking tot de aard van de noodzakelijke deskundigheid.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel18a
  - number: 18a.12
    text: |-
      Het samenwerkingsverband stelt een adviescommissie als bedoeld in
      [artikel 7:13 van de Algemene wet bestuursrecht][ref1] in, die adviseert over bezwaarschriften betreffende
      besluiten van het samenwerkingsverband over de toelaatbaarheid van leerlingen tot het onderwijs aan een speciale
      school voor basisonderwijs in het samenwerkingsverband of tot het speciaal onderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel18a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: 18a.13
    text: |-
      Het samenwerkingsverband is bevoegd gegevens over gezondheid als bedoeld in artikel 4, onderdeel 15, van de
      Algemene verordening gegevensbescherming te verwerken met betrekking tot leerlingen, voor zover dit noodzakelijk
      is voor de uitoefening van de taken, bedoeld in het zesde lid, onderdelen b tot en met d. Het samenwerkingsverband
      verstrekt de gegevens, bedoeld in de eerste volzin, niet aan derden, met uitzondering van het bevoegd gezag van de
      school waar de desbetreffende leerling is aangemeld of ingeschreven. Het samenwerkingsverband bewaart de gegevens
      op een plaats die uitsluitend toegankelijk is voor het samenwerkingsverband en de deskundigen, bedoeld in het elfde
      lid. Het samenwerkingsverband bewaart de gegevens tot drie jaar na afloop van:
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel18a
  - number: 18a.13.a
    text: |-
      de beoordeling van de toelaatbaarheid van de leerling tot het onderwijs aan een speciale school voor basisonderwijs
      in het samenwerkingsverband of tot het speciaal onderwijs,
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel18a
  - number: 18a.13.b
    text: |-
      de advisering over de ondersteuningsbehoefte van de leerling aan het bevoegd gezag van de school waar de leerling
      is aangemeld of ingeschreven, of
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel18a
  - number: 18a.13.c
    text: |-
      de toewijzing van ondersteuningsmiddelen of ondersteuningsvoorzieningen aan de school, voor zover het voor die
      toewijzing nodig was gegevens van de leerling als bedoeld in de eerste volzin te verwerken.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel18a
  - number: 18a.14
    text: |-
      Het samenwerkingsverband kent aan elke toelaatbaarheidsverklaring als bedoeld in
      [artikel 40, tiende lid, van de Wet op de expertisecentra][ref1] een volgnummer toe. Het samenwerkingsverband
      verstrekt van elk advies over de ondersteuningsbehoefte van een leerling als bedoeld in het dertiende lid,
      afschrift aan de ouders.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel40
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel18a
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '40'
  - number: 18a.15
    text: |-
      Bevoegde gezagsorganen van tot dezelfde richting behorende scholen en scholen als bedoeld in de
      [Wet op de expertisecentra][ref1] waaraan speciaal onderwijs behorend tot cluster 3 en 4 wordt verzorgd kunnen
      aangesloten blijven of kunnen zich aansluiten bij een landelijk samenwerkingsverband als bedoeld in dit lid,
      zoals dat luidde vóór de datum van inwerkingtreding van dit lid zoals dat is komen te luiden met de Wet van 20 mei
      2020 tot wijziging van diverse onderwijswetten door het wijzigen van de systematiek van het in aanmerking brengen
      voor bekostiging van nieuwe openbare en bijzondere scholen zodat er meer ruimte is voor een nieuw onderwijsaanbod
      (Wet meer ruimte voor nieuwe scholen) (Stb. 2020, 160). Op een landelijk samenwerkingsverband zijn het tweede
      tot en met het veertiende lid, met uitzondering van het derde lid en het vijfde lid, en het zestiende lid van
      overeenkomstige toepassing. Indien een bevoegd gezag scholen heeft met ten minste de richting van de scholen die
      behoren tot het landelijk samenwerkingsverband bepaalt het bevoegd gezag eenmalig of aansluiting bij het landelijk
      samenwerkingsverband wordt gevraagd. Het landelijk samenwerkingsverband beslist over de aansluiting.


      [ref1]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel18a
    references:
      - id: ref1
        bwb_id: BWBR0003549
  - number: 18a.16
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere voorschriften worden vastgesteld met betrekking tot de
      samenwerkingsverbanden.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel18a
  - number: '29.1'
    text: |-
      Aan elke school zijn 1 of 2 directeuren verbonden, bij wie onder verantwoordelijkheid van het bevoegd gezag
      de onderwijskundige, organisatorische en huishoudelijke leiding berust. De directeur van een school kan tevens
      directeur zijn van een andere school of van een school als bedoeld in de [Wet op de expertisecentra][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0003549
  - number: '29.2'
    text: Aan een school zijn een of meer leraren verbonden.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel29
  - number: '29.3'
    text: Een of meer leraren kunnen tevens tot adjunct-directeur worden benoemd dan wel tewerkgesteld zonder benoeming.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel29
  - number: '29.4'
    text: |-
      Voor zover het betreft de functie van directeur en adjunct-directeur, wordt in geval van samenvoeging van scholen
      de overblijvende school gelijkgesteld met een nieuwe school. De directeur, onderscheidenlijk de adjunct-directeur
      of adjunct-directeuren, kan slechts een van de directeuren onderscheidenlijk kunnen slechts een of meer van de
      adjunct-directeuren van de samen te voegen scholen zijn, tenzij geen van de betrokkenen de desbetreffende functie
      wenst te aanvaarden.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel29
  - number: '29.5'
    text: |-
      Het bevoegd gezag kan tevens personeel, dat werkzaamheden verricht ten behoeve van meer dan een school of meer
      dan een school als bedoeld in de [Wet op de expertisecentra][ref1], benoemen of te werk stellen zonder benoeming
      waaronder begrepen leden van het bestuur van die scholen voor zover het intern toezicht wordt uitgeoefend door een
      raad van toezicht als bedoeld in [artikel 17c, derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003549
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel17c
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0003549
      - id: ref2
        bwb_id: BWBR0003420
        artikel: 17c
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '1'
  - number: '29.6'
    text: Aan een school kan onderwijsondersteunend personeel zijn verbonden.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel29
  - number: '29.7'
    text: |-
      Het bevoegd gezag stelt jaarlijks het beleid vast met betrekking tot de formatie van de verschillende categorieën
      personeel van de school.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel29
  - number: '30'
    text: Het bevoegd gezag streeft evenredige vertegenwoordiging van vrouwen in leidinggevende posities na.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel30
  - number: 30a.1
    text: |-
      Het bestuur kan hem bij wettelijk voorschrift opgedragen taken en bevoegdheden overdragen aan de directeur van
      de school of indien toepassing is gegeven aan [artikel 29, vijfde lid][ref1], het in dat artikellid bedoelde
      personeel voor zover dat is belast met managementtaken met betrekking tot de scholen en de scholen, bedoeld in de
      [Wet op de expertisecentra][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel30a
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '29'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0003549
  - number: 30a.2
    text: |-
      De directeur van de school of indien toepassing is gegeven aan [artikel 29, vijfde lid][ref1], het in dat
      artikellid bedoelde personeel voor zover dat is belast met managementtaken met betrekking tot de scholen en de
      scholen, bedoeld in de [Wet op de expertisecentra][ref2], kan hem bij wettelijk voorschrift opgedragen, of door het
      bevoegd gezag overgedragen, taken en bevoegdheden overdragen aan de adjunct-directeur.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel30a
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '29'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0003549
  - number: '31.1'
    text: |-
      Het bevoegd gezag stelt na overleg met de directeur en indien toepassing is gegeven aan
      [artikel 29, vijfde lid][ref1], met het in dat artikellid bedoelde personeel voor zover dat is belast met
      managementtaken met betrekking tot de scholen en de scholen, bedoeld in de [Wet op de expertisecentra][ref2], een
      managementstatuut vast. In het managementstatuut is ten minste een regeling opgenomen betreffende de bevoegdheden
      van de directeur en indien toepassing is gegeven aan [artikel 29, vijfde lid][ref3], tevens van de bevoegdheden van
      het in dat artikellid bedoelde personeel voor zover dat is belast met managementtaken met betrekking tot de scholen
      en de scholen, bedoeld in de [Wet op de expertisecentra][ref4], met betrekking tot de toedeling, bestemming en
      aanwending van de bekostiging.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0003549
      [ref3]: https://wetten.overheid.nl/BWBR0003420#Artikel29
      [ref4]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '29'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0003549
      - id: ref3
        bwb_id: BWBR0003420
        artikel: '29'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: '1'
      - id: ref4
        bwb_id: BWBR0003549
  - number: '31.2'
    text: |-
      Het managementstatuut bevat tevens de aanduiding van de andere aan het bevoegd gezag bij wettelijk voorschrift
      toegekende taken en bevoegdheden waarvan het bevoegd gezag heeft bepaald dat de directeur van de school of
      indien toepassing is gegeven aan [artikel 29, vijfde lid][ref1], het in dat artikellid bedoelde personeel
      voor zover dat is belast met managementtaken met betrekking tot de scholen en de scholen, bedoeld in de
      [Wet op de expertisecentra][ref2] deze in naam van het bevoegd gezag kan uitoefenen. Het managementstatuut bevat
      voorts instructies ten aanzien van deze taken en bevoegdheden.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '29'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0003549
  - number: '31.3'
    text: 'In het managementstatuut worden tevens vastgelegd:'
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel31
  - number: 31.3.a
    text: |-
      de taken en bevoegdheden die het bestuur overdraagt aan de directeur van de school of indien toepassing is
      gegeven aan [artikel 29, vijfde lid][ref1], het in dat artikellid bedoelde personeel voor zover dat is belast
      met managementtaken met betrekking tot de scholen en de scholen, bedoeld in de [Wet op de expertisecentra][ref2],
      indien toepassing is gegeven aan [artikel 30a, eerste lid][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0003549
      [ref3]: https://wetten.overheid.nl/BWBR0003420#Artikel30a
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '29'
