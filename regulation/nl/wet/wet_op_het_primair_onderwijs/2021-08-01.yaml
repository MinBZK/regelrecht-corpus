  - number: '148.1'
    text: |-
      Het bevoegd gezag wendt het totaal van de in de [artikelen 129][ref1], [134][ref2] en [137][ref3] bedoelde bedragen
      voor de kosten voor de materiële instandhouding en de personeelskosten uitsluitend aan voor kosten voor materiële
      instandhouding, personeelskosten van de school of personeelskosten in verband met benoeming of tewerkstelling
      zonder benoeming van personeel, bedoeld in [artikel 29, vijfde lid][ref4], dan wel mede voor die kosten van een van
      de andere scholen van dat bevoegd gezag.


