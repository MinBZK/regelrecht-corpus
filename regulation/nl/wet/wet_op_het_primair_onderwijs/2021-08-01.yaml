        afdeling: '2'
  - number: '144.3'
    text: |-
      Bij het vaststellen van de bedragen, bedoeld in het eerste lid onder c, f, g en h, worden buiten beschouwing
      gelaten de uitgaven en ontvangsten voor:
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel144
  - number: 144.3.a
    text: |-
      administratie, beheer en bestuur, bedoeld in [artikel 114 , onder e][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel114
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel144
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '114'
        hoofdstuk: I
        afdeling: '4'
  - number: 144.3.b
    text: de materiële instandhouding van het onderwijs in lichamelijke oefening en
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel144
  - number: 144.3.c
    text: |-
      de materiële instandhouding in verband met de toepassing van [artikel 165][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel165
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel144
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '165'
        hoofdstuk: I
        afdeling: '10'
  - number: '144.4'
    text: |-
      Bij het vaststellen van de bedragen, bedoeld in het eerste lid onder a, worden buiten beschouwing gelaten
      de uitgaven ten behoeve van personeel dat door de gemeente met toepassing van [artikel 165][ref1], aan een
      openbare school wordt verbonden. Bij het vaststellen van de bedragen, bedoeld in het eerste lid onder a, b,
      c en h, worden voorts buiten beschouwing gelaten de uitgaven die worden gedekt door ontvangsten van bedragen
      die door derden zijn betaald, de uitgaven die worden gedekt door ontvangsten op grond van een besluit als
      bedoeld in [artikel 140, zesde lid, tweede volzin][ref2], en de uitgaven voor de voorzieningen waarvoor het
      bevoegd gezag van een niet door de gemeente in stand gehouden school op grond van de regeling, bedoeld in
      [artikel 141, eerste lid][ref3], een aanvraag bij de gemeente kon indienen en wel gedurende de periode waarvoor een
      dergelijke aanvraag kon worden gedaan. Bij het vaststellen van de bedragen, bedoeld in het eerste lid onder a, b,
      c en h, blijven de uitgaven ten behoeve van een basisschool buiten beschouwing tot het bedrag dat de gemeente voor
      die school overdraagt op grond van [artikel 118][ref4], [artikel 124][ref5] of [artikel 125][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel165
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel140
      [ref3]: https://wetten.overheid.nl/BWBR0003420#Artikel141
      [ref4]: https://wetten.overheid.nl/BWBR0003420#Artikel118
      [ref5]: https://wetten.overheid.nl/BWBR0003420#Artikel124
      [ref6]: https://wetten.overheid.nl/BWBR0003420#Artikel125
