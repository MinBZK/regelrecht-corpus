  - number: '129.1'
    text: |-
      Bij ministeriële regeling wordt de grondslag vastgesteld voor de omvang van de bekostiging voor personeels- en
      arbeidsmarktbeleid. Deze grondslag kan verschillend worden vastgesteld voor basisscholen en speciale scholen voor
      basisonderwijs en voor groepen van basisscholen. De omvang van de bekostiging is in ieder geval afhankelijk of
      mede afhankelijk van het aantal leerlingen op de teldatum, bedoeld in [artikel 121][ref1], en de samenstelling
      van het leerlingenbestand. Bij het vaststellen van de bekostiging wordt in ieder geval rekening gehouden met de
      ontwikkeling van de genormeerde gemiddelde personeelslasten van leraren van basisscholen dan wel speciale scholen
      voor basisonderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel121
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel129
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '121'
        hoofdstuk: I
        afdeling: '5'
  - number: '129.2'
    text: |-
      Met inachtneming van het eerste lid verstrekt het Rijk jaarlijks aan het bevoegd gezag van de openbare en
      bijzondere scholen bekostiging ten behoeve van personeels- en arbeidsmarktbeleid.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel129
  - number: '132.1'
    text: |-
      Aan het samenwerkingsverband wordt personeelsbekostiging toegekend voor ondersteuningsvoorzieningen. De grondslag
      voor de berekening van de personeelsbekostiging voor ondersteuningsvoorzieningen is een bij ministeriële
      regeling vast te stellen bedrag per leerling voor het aantal leerlingen op vestigingen van basisscholen in het
      samenwerkingsverband op 1 oktober van het jaar voorafgaand aan het jaar waarover de bekostiging plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel132
  - number: '132.2'
    text: |-
      Aan het samenwerkingsverband wordt personeelsbekostiging toegekend in aanvulling op de in het eerste lid bedoelde
      bekostiging.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel132
  - number: '132.3'
    text: |-
      De in het tweede lid bedoelde bekostiging bestaat uit een bij ministeriële regeling vast te stellen bedrag per
      leerling voor het aantal leerlingen op vestigingen van scholen in het samenwerkingsverband op 1 oktober van het
      jaar voorafgaand aan het jaar waarover de bekostiging plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel132
  - number: '132.4'
    text: |-
      Voor elke leerling die op 1 oktober van het jaar voorafgaand aan het jaar waarover de bekostiging plaatsvindt
      was ingeschreven op een school voor speciaal onderwijs of speciaal en voortgezet speciaal onderwijs behorend
      tot cluster 3 en 4, bedoeld in de [Wet op de expertisecentra][ref1], wordt een bedrag in mindering gebracht
      op de in het tweede lid bedoelde bekostiging van het samenwerkingsverband dat de leerling op grond van
      [artikel 40, tiende lid, van de Wet op de expertisecentra][ref2] toelaatbaar heeft verklaard tot het speciaal
      onderwijs. Het in de eerste volzin bedoelde bedrag is afhankelijk van de in de toelaatbaarheidsverklaring opgenomen
      ondersteuningsbehoefte van de leerling en komt overeen met één van de normbedragen die bij ministeriële regeling
      worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003549
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel40
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel132
    references:
      - id: ref1
        bwb_id: BWBR0003549
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '40'
  - number: '132.5'
    text: |-
      Het vierde lid is van overeenkomstige toepassing op leerlingen opgenomen in residentiële instellingen aan wie op
      1 oktober van het jaar voorafgaand aan het jaar waarover de bekostiging plaatsvindt onderwijs werd gegeven op basis
      van een samenwerkingsovereenkomst als bedoeld in [artikel 71c, tweede lid, van de Wet op de expertisecentra][ref1],
      met dien verstande dat het normbedrag, bedoeld in [artikel 117, zevende lid, van die wet][ref2] in mindering wordt
      gebracht op de bekostiging van:


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel71c
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel117
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel132
    references:
