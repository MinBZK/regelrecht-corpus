      - id: ref3
        bwb_id: BWBR0003420
        artikel: 30a
        hoofdstuk: I
        paragraaf: '3'
        afdeling: '1'
  - number: 31.3.b
    text: |-
      de taken en bevoegdheden die het bestuur, de directeur van de school of indien toepassing is gegeven aan
      [artikel 29, vijfde lid][ref1], het in dat artikellid bedoelde personeel voor zover dat is belast met
      managementtaken met betrekking tot de scholen en de scholen, bedoeld in de [Wet op de expertisecentra][ref2]
      overdraagt aan de adjunct-directeur, indien toepassing is gegeven aan [artikel 30a, tweede lid][ref3]; en


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0003549
      [ref3]: https://wetten.overheid.nl/BWBR0003420#Artikel30a
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '29'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0003549
      - id: ref3
        bwb_id: BWBR0003420
        artikel: 30a
        hoofdstuk: I
        paragraaf: '3'
        afdeling: '1'
  - number: 31.3.c
    text: de richtlijnen voor de uitoefening van de overgedragen taken en bevoegdheden.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel31
  - number: '31.4'
    text: |-
      Het bevoegd gezag stelt het managementstatuut, alsmede elke wijziging daarvan, zo spoedig mogelijk na de
      vaststelling op een voor eenieder toegankelijke wijze beschikbaar.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel31
  - number: 31a.1
    text: |-
      Onder het beroep van leraar wordt verstaan het binnen de kaders van het onderwijskundig beleid van de school,
      verantwoordelijkheid dragen voor het vakinhoudelijke, vakdidactische en pedagogische proces in de school.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel31a
  - number: 31a.2
    text: |-
      Leraren komt een zelfstandige verantwoordelijkheid toe als het gaat om het beoordelen van de onderwijsprestaties
      van leerlingen.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel31a
  - number: 31a.3
    text: |-
      Leraren beschikken over voldoende vakinhoudelijke, vakdidactische en pedagogische zeggenschap, waaronder wordt
      verstaan de zeggenschap over:
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel31a
  - number: 31a.3.a
    text: de inhoud van de lesstof;
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel31a
  - number: 31a.3.b
    text: de wijze waarop de lesstof wordt aangeboden en de middelen die daarbij worden gebruikt;
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel31a
  - number: 31a.3.c
    text: |-
      de te hanteren pedagogisch-didactische aanpak op de school en de wijze waarop daar uitvoering aan wordt gegeven,
      waaronder de begeleiding van de leerlingen en de contacten met de ouders;
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel31a
  - number: 31a.3.d
    text: |-
      het in samenhang met de onderdelen a, b en c, onderhouden van de bekwaamheid van de leraren als onderdeel van het
      team.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel31a
  - number: 31a.4
    text: |-
      Het bevoegd gezag stelt in overleg met de leraren een professioneel statuut op waarin de afspraken zijn opgenomen
      over de wijze waarop de zeggenschap van leraren, bedoeld in het derde lid, wordt georganiseerd. Bij het opstellen
      van het professioneel statuut wordt de professionele standaard van de beroepsgroep in acht genomen.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel31a
  - number: '32.1'
    text: |-
      Directeuren, adjunct-directeuren en leraren worden door het bevoegd gezag benoemd dan wel tewerkgesteld zonder
      benoeming.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel32
  - number: '32.2'
    text: 'Tot directeur of adjunct-directeur kan slechts worden benoemd of tewerkgesteld zonder benoeming degene die:'
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel32
  - number: 32.2.a
    text: 'in het bezit is van:'
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel32
  - number: 32.2.a.1°
    text: |-
      een verklaring omtrent het gedrag, afgegeven volgens de [Wet justitiële en strafvorderlijke gegevens][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0014194
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0014194
  - number: 32.2.a.2°
    text: |-
      een getuigschrift, afgegeven krachtens de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1],
      of van een erkenning van beroepskwalificaties als bedoeld in
      [artikel 5 van de Algemene wet erkenning EU-beroepskwalificaties][ref2], en


      [ref1]: https://wetten.overheid.nl/BWBR0005682
      [ref2]: https://wetten.overheid.nl/BWBR0023066#Artikel5
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0005682
      - id: ref2
        bwb_id: BWBR0023066
        artikel: '5'
  - number: 32.2.b
    text: |-
      voor zover tot de functie werkzaamheden behoren waarvoor op grond van [artikel 32a, tweede lid][ref1],
      bekwaamheidseisen zijn vastgesteld, in het bezit is van:


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel32a
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 32a
        hoofdstuk: I
        paragraaf: '3'
        afdeling: '1'
  - number: 32.2.b.1°
    text: |-
      een getuigschrift, afgegeven krachtens de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1] waaruit
      blijkt dat aan die eisen is voldaan, of


      [ref1]: https://wetten.overheid.nl/BWBR0005682
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0005682
  - number: 32.2.b.2°
    text: |-
      een erkenning van beroepskwalificaties als bedoeld in
      [artikel 5 van de Algemene wet erkenning EU-beroepskwalificaties][ref1], verleend ten aanzien van de in
      [artikel 32a, tweede lid][ref2], bedoelde werkzaamheden die betrokkene zal verrichten, of


      [ref1]: https://wetten.overheid.nl/BWBR0023066#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel32a
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0023066
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: 32a
        hoofdstuk: I
        paragraaf: '3'
        afdeling: '1'
  - number: 32.2.b.3°
    text: |-
      een bewijsstuk dat hij volgens bij algemene maatregel van bestuur te geven regels zijn bekwaamheid heeft
      aangetoond, en
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel32
  - number: 32.2.c
    text: |-
      niet krachtens rechterlijke uitspraak is uitgesloten van het verrichten van de werkzaamheden waarop de benoeming of
      de tewerkstelling zonder benoeming is gericht.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel32
  - number: '32.3'
    text: |-
      De directeur of adjunct-directeur die niet voldoet aan de eisen van het tweede lid, onder b, mag voor zover het
      werkzaamheden betreft waarvoor op grond van [artikel 32a, tweede lid][ref1], bekwaamheidseisen zijn vastgesteld,
      niettemin met die werkzaamheden worden belast, voor een periode van ten hoogste twee jaren.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel32a
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 32a
        hoofdstuk: I
        paragraaf: '3'
        afdeling: '1'
  - number: '32.4'
    text: |-
      De directeur of adjunct-directeur die op grond van [artikel 3][ref1] bevoegd is tot het geven van onderwijs of
      die op grond van [artikel 3a][ref2] bevoegd is tot het verrichten van de daar bedoelde onderwijsondersteunende
      werkzaamheden, kan tevens worden belast met het geven van onderwijs respectievelijk met het verrichten van die
      onderwijsondersteunende werkzaamheden.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel3a
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '3'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0003420
        artikel: 3a
        hoofdstuk: I
  - number: '32.5'
    text: |-
      Om te kunnen worden benoemd of tewerkgesteld zonder benoeming tot leraar dient betrokkene te voldoen aan de
      desbetreffende vereisten, bedoeld in [artikel 3, eerste tot en met vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel3
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '3'
        hoofdstuk: I
  - number: '32.6'
    text: |-
      De onderwijsondersteunend functionaris die wordt belast met werkzaamheden waarvoor op grond
      van [artikel 32a, derde lid][ref1], bekwaamheidseisen zijn vastgesteld, dient te voldoen aan
      [artikel 3a, eerste lid][ref2], onverminderd het tweede en derde lid van dat artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel32a
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel3a
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 32a
        hoofdstuk: I
        paragraaf: '3'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: 3a
        hoofdstuk: I
  - number: '32.7'
    text: |-
      De onderwijsondersteunend functionaris die wordt belast met andere werkzaamheden dan die waarvoor op grond van
      [artikel 32a, derde lid][ref1], bekwaamheidseisen zijn vastgesteld, dient:


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel32a
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 32a
        hoofdstuk: I
        paragraaf: '3'
        afdeling: '1'
  - number: 32.7.a
    text: |-
      in het bezit te zijn van de verklaring, bedoeld in [artikel 3, eerste lid, onder a][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel3
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '3'
        hoofdstuk: I
  - number: 32.7.b
    text: te voldoen aan de overige vereisten voor de te vervullen functie.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel32
  - number: '32.8'
    text: |-
      Bij algemene maatregel van bestuur worden nadere voorschriften gegeven omtrent de vereisten, bedoeld in het zevende
      lid, onder b.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel32
  - number: '32.9'
    text: |-
      De verklaring, bedoeld in het tweede lid, onder a.1°, [artikel 3, eerste lid, onder a][ref1], en
      [artikel 3a, eerste lid, onder a][ref2], die in verband met de benoeming of tewerkstelling zonder benoeming wordt
      overgelegd, mag op het tijdstip van overlegging aan het bevoegd gezag niet ouder zijn dan zes maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel3a
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '3'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0003420
        artikel: 3a
        hoofdstuk: I
  - number: '32.10'
    text: |-
      Indien betrokkene in het bezit is van een geschiktheidsverklaring als bedoeld in [artikel 176b][ref1] vindt
      de benoeming of tewerkstelling zonder benoeming plaats voor een periode van ten hoogste twee aaneengesloten
      schooljaren. Het bevoegd gezag kan deze benoemingsperiode, al dan niet onder door dat gezag te stellen voorwaarden,
      verlengen met ten hoogste twee jaren indien het bevoegd gezag daarvoor redenen aanwezig acht. Het bevoegd gezag
      beschikt over geordende gegevens met betrekking tot de toepassing van de tweede volzin. Het bevoegd gezag dat
      betrokkene voor de eerste maal na afgifte van de geschiktheidsverklaring benoemt of tewerkstelt zonder benoeming,
      tekent het feit en de datum van benoeming of tewerkstelling zonder benoeming aan op die verklaring.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel176b
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 176b
        hoofdstuk: I
        afdeling: 11A
  - number: '32.11'
    text: |-
      Directeuren en adjunct-directeuren die zijn benoemd of tewerkgesteld zonder benoeming voordat de
      [Wet op de beroepen in het onderwijs][ref1] in werking is getreden en bij hun benoeming of tewerkstelling zonder
      benoeming niet beschikten over een getuigschrift als bedoeld in het tweede lid, onder a.2°, zijn vanaf het tijdstip
      van inwerkingtreding van die wet benoembaar of tewerkstelbaar zonder benoeming als directeur respectievelijk
      adjunct-directeur indien zij in elk geval voldoen aan de vereisten van het tweede lid, onder a.1° en c. Het derde
      lid is niet van toepassing op deze directeuren en adjunct-directeuren.


      [ref1]: https://wetten.overheid.nl/BWBR0016944
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0016944
  - number: 32a.1
    text: Bij algemene maatregel van bestuur worden bekwaamheidseisen vastgesteld voor leraren.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel32a
  - number: 32a.2
    text: |-
      Bij algemene maatregel van bestuur worden bekwaamheidseisen vastgesteld voor werkzaamheden van leidinggevende
      aard die nauw verband houden met het pedagogisch-didactische klimaat op de school of die onderwijskundige leiding
      omvatten, en kunnen ook voor andere werkzaamheden van leidinggevende aard bekwaamheidseisen worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel32a
  - number: 32a.3
    text: |-
      Bij algemene maatregel van bestuur worden bekwaamheidseisen vastgesteld voor bij die maatregel aan te wijzen
      onderwijsondersteunende werkzaamheden die rechtstreeks verband houden met het onderwijsleerproces.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel32a
  - number: 32a.4
    text: |-
      De in het eerste lid bedoelde bekwaamheidseisen zijn gericht op het handelen in het onderwijsleerproces, het
      algemeen professioneel handelen en het werken binnen een onderwijsorganisatie. Zij omvatten in elk geval eisen ten
      aanzien van:
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel32a
  - number: 32a.4.a
    text: pedagogisch-didactische kennis, inzicht en vaardigheden, en
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel32a
  - number: 32a.4.b
    text: vakbekwaamheid.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel32a
  - number: 32a.5
    text: |-
      De algemene maatregel van bestuur, bedoeld in het eerste, tweede en derde lid, wordt aan de beide Kamers der
      Staten-Generaal overgelegd. De maatregel treedt niet in werking dan nadat vier weken na de overlegging zijn
      verstreken en niet door of namens een van beide Kamers de wens wordt te kennen gegeven dat het in die maatregel
      geregelde onderwerp bij de wet wordt geregeld. Alsdan wordt een daartoe strekkend wetsvoorstel zo spoedig mogelijk
      ingediend.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel32a
  - number: 32a.6
    text: |-
      Onze Minister stelt een beroepsorganisatie die hij vanuit het oogpunt van beroepskwaliteit representatief acht
      voor onderwijspersoneel als bedoeld in deze wet, in de gelegenheid hem een voorstel te doen voor de in het eerste,
      tweede of derde lid voorgeschreven bekwaamheidseisen en kan een representatief geachte beroepsorganisatie in de
      gelegenheid stellen hem een voorstel te doen voor bekwaamheidseisen die op grond van het tweede lid kunnen worden
      vastgesteld. Onze Minister stelt deze organisatie vervolgens in elk geval eenmaal in de zes jaar in de gelegenheid,
      hem een voorstel te doen over ongewijzigde handhaving of wijziging van de bekwaamheidseisen voor zover vastgesteld.
      Uit een voorstel als bedoeld in de eerste of tweede volzin blijkt tevens, in hoeverre dat voorstel mede steun
      geniet van een vertegenwoordiging van bevoegde gezagsorganen en ouders van de leerlingen.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel32a
  - number: 32b
    text: |-
      Het bevoegd gezag beschikt ten aanzien van elk personeelslid dat een functie of werkzaamheden verricht waarvoor
      bekwaamheidseisen zijn vastgesteld, over geordende gegevens met betrekking tot de bekwaamheid en het onderhouden
      van de bekwaamheid. Ten behoeve van de onderlinge vergelijkbaarheid en herkenbaarheid van de gegevens kunnen bij
      ministeriële regeling voorschriften worden vastgesteld over de inrichting en wijze van ordening van deze gegevens.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel32b
  - number: 32c
    text: |-
      Totdat de bekwaamheidseisen voor werkzaamheden van leidinggevende aard, bedoeld in [artikel 32a, tweede lid][ref1],
      in werking treden, blijven ten aanzien van de benoeming of tewerkstelling als directeur of adjunct-directeur de bij
      of krachtens deze wet vastgestelde voorschriften, zoals luidend op 31 juli 2006, van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel32a
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel32c
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 32a
        hoofdstuk: I
        paragraaf: '3'
        afdeling: '1'
  - number: 32d.1
    text: |-
      Degene die op 31 juli 2017 voor het geven van godsdienstonderwijs of levensbeschouwelijk vormingsonderwijs aan een
      school is benoemd of tewerkgesteld zonder benoeming, alsmede degene die eerder al voor het geven van dat onderwijs
      benoemd is geweest of tewerkgesteld zonder benoeming, voldoet aan de bekwaamheidseisen voor het geven van dat
      onderwijs.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel32d
  - number: 32d.2
    text: |-
      Degene die binnen een periode van vijf jaren gerekend vanaf 1 augustus 2017 voor de eerste keer wordt benoemd of
      tewerkgesteld zonder benoeming voor het geven van godsdienstonderwijs of levensbeschouwelijk vormingsonderwijs
      aan een school, dient binnen een periode van vijf jaren gerekend vanaf het tijdstip van die eerste benoeming of
      die eerste tewerkstelling zonder benoeming, te voldoen aan de bekwaamheidseisen voor het geven van dat onderwijs
      om belast te kunnen blijven worden met de desbetreffende werkzaamheden. Bij algemene maatregel van bestuur kan
      deze periode worden verlengd met een daarbij te bepalen periode indien verlenging noodzakelijk is voor een goede
      invoering van die bekwaamheidseisen.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel32d
  - number: 32d.3
    text: 'Het eerste en tweede lid zijn van overeenkomstige toepassing op degene die:'
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel32d
  - number: 32d.3.a
    text: |-
      onderwijsondersteunende werkzaamheden ten behoeve van godsdienstonderwijs of levensbeschouwelijk vormingsonderwijs
      aan een school verricht, vanaf het moment dat voor die werkzaamheden bekwaamheidseisen zijn vastgesteld; of
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel32d
  - number: 32d.3.b
    text: |-
      is aangewezen, eerder was aangewezen onderscheidenlijk voor de eerste keer wordt aangewezen voor het geven van
      godsdienstonderwijs of levensbeschouwelijk vormingsonderwijs op openbare scholen.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel32d
  - number: 32d.4
    text: Bij ministeriële regeling kunnen regels worden gesteld ter uitvoering van het eerste tot en met derde lid.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel32d
  - number: 32e
    text: |-
      [Artikel 12, derde lid][ref1],vindt, wat het onderhouden van de bekwaamheid betreft, voor een bepaalde
      personeelscategorie voor het eerst toepassing met ingang van het tijdstip waarop de bekwaamheidseisen voor die
      categorie in werking treden.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel12
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel32e
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '12'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '1'
  - number: '33'
    text: Het bevoegd gezag draagt er zorg voor dat de rechtspositie van het personeel wordt geregeld.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel33
  - number: 33a
    text: Het bevoegd gezag benoemt, schorst en ontslaat het personeel.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel33a
  - number: '34.1'
    text: |-
      Het bevoegd gezag benoemt de directeur en de adjunct-directeur, de leraren en het onderwijsondersteunend personeel
      in algemene dienst van het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel34
  - number: '34.2'
    text: |-
      Onder benoeming in algemene dienst van het bevoegd gezag wordt in dit artikel verstaan een benoeming ten behoeve
      van het verrichten van werkzaamheden aan door het bevoegd gezag in stand gehouden scholen.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel34
  - number: 34a.1
    text: |-
      Het bevoegd gezag draagt er zorg voor dat afschriften van bewijsstukken waarmee de bekwaamheid wordt aangetoond,
      van geschiktheidsverklaringen, van verklaringen omtrent het gedrag en van arbeidsovereenkomsten van het aan de
      school verbonden personeel worden bewaard.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel34a
  - number: 34a.2
    text: Het eerste lid is van overeenkomstige toepassing op personeel dat is tewerkgesteld zonder benoeming.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel34a
  - number: '36.1'
    text: |-
      Het bevoegd gezag is verplicht aan studenten die in opleiding zijn voor een functie in het basisonderwijs of in
      het voortgezet onderwijs, gelegenheid te bieden de als onderdeel van hun opleiding vereiste ervaring in de school
      te verkrijgen.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel36
  - number: '36.2'
    text: 'De verplichting bedoeld in het eerste lid, betreft:'
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel36
  - number: 36.2.a
    text: |-
      studenten die op een school voor de opleiding van onderwijzend personeel zijn ingeschreven of anderszins studeren
      om aan de bekwaamheidseisen te voldoen;
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel36
  - number: 36.2.b
    text: |-
      in een schooljaar gelijktijdig niet meer studenten als bedoeld onder a, dan de helft van het aantal groepsleraren
      in dat jaar.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel36
  - number: '36.3'
    text: |-
      Een bevoegd gezag kan een student de verdere toegang tot de school ontzeggen indien deze in de school in strijd
      handelt met de grondslag en doelstellingen van de school. Van een beslissing tot ontzegging van de toegang tot
      de school wordt mededeling gedaan door toezending of uitreiking van een afschrift aan het bevoegd gezag van de
      betrokken opleidingsinstelling.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel36
  - number: '36.4'
    text: |-
      De directeur regelt, onder verantwoordelijkheid van het bevoegd gezag, de werkzaamheden in verband met de
      begeleiding door het onderwijzend personeel van de studenten in de school in overeenstemming met dit personeel,
      alsmede in overeenstemming met de betrokken opleidingsinstellingen, dan wel, indien het betreft studenten die zich
      voorbereiden op het afleggen van een staatsexamen om te voldoen aan de bekwaamheidseisen, in overeenstemming met de
      betrokken staatsexamencommissie.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel36
  - number: '36.5'
    text: |-
      Onze Minister kan het bevoegd gezag op grond van bijzondere omstandigheden gehele of gedeeltelijke ontheffing van
      de verplichting verlenen. De ontheffing geldt voor een schooljaar.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel36
  - number: '36.6'
    text: |-
      De scholen waarop studenten als bedoeld in het eerste lid, zijn toegelaten, zijn toegankelijk voor de inspectie
      belast met het toezicht op de opleidingsinstellingen, voor de directeuren en de door deze aan te wijzen leraren
      van die opleidingsinstellingen, alsmede voor de leden van de betrokken staatsexamencommissies, een en ander voor
      zover zulks voor de uitoefening van het toezicht op de praktische vorming, onderscheidenlijk de begeleiding van de
      praktische vorming van de in de school aanwezige studenten noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel36
  - number: '38'
    text: |-
      Over de door het bevoegd gezag ingevolge [artikel 33][ref1] te treffen regelingen, alsmede over andere
      aangelegenheden van algemeen belang voor de rechtstoestand van het personeel, wordt door of namens het bevoegd
      gezag overleg gevoerd met de daarvoor in aanmerking komende verenigingen van werknemers, op een met deze
      schriftelijk overeengekomen wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel33
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '33'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: '1'
  - number: 38a.1
    text: |-
      Degene die beschikt over een in artikel 176b bedoelde geschiktheidsverklaring, het bevoegd gezag dat betrokkene
      benoemt of tewerkstelt zonder benoeming, en het bestuur van een instelling die werkzaamheden uitvoert als bedoeld
      in artikel 176g, eerste lid onder a, sluiten een overeenkomst die hun wederzijdse rechten en plichten omvat
      met betrekking tot het uitvoeren van de noodzakelijk geachte scholing en begeleiding, met inachtneming van de
      beoordeling, bedoeld in artikel 176c, tweede lid, onder c. Indien na het sluiten van de overeenkomst blijkt dat
      de scholing of begeleiding niet volgens de overeenkomst kan worden uitgevoerd, treft het bevoegd gezag tijdig een
      toereikende vervangende voorziening.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel38a
  - number: 38a.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere voorschriften worden gegeven voor de uitvoering van
      het eerste lid, waaronder in elk geval voorschriften ter waarborging van de kwaliteit van het daarin bepaalde.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel38a
  - number: 38a.3
    text: |-
      Voor zover betrokkene de werkzaamheden ten aanzien waarvan hem een geschiktheidsverklaring is verstrekt, verricht
      bij twee of meer bevoegde gezagsorganen, dragen deze bevoegde gezagsorganen er zorg voor dat de overeenkomsten,
      bedoeld in het eerste lid, waarbij zij ten aanzien van betrokkene partij zijn, op elkaar worden afgestemd. Zonodig
      wordt een al gesloten overeenkomst daartoe gewijzigd.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel38a
  - number: 38a.4
    text: |-
      De algemene maatregel van bestuur, bedoeld in het tweede en derde lid, wordt aan de beide Kamers der Staten-
      Generaal overgelegd. De maatregel treedt niet in werking dan nadat vier weken na de overlegging zijn verstreken
      en niet door of namens een van beide Kamers de wens wordt te kennen gegeven dat het in die maatregel geregelde
      onderwerp bij de wet wordt geregeld. Alsdan wordt een daartoe strekkend wetsvoorstel zo spoedig mogelijk ingediend.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel38a
  - number: 38b.1
    text: |-
      Er is een lerarenregister. In het lerarenregister zijn van leraren voor wie
      de grond voor benoeming of tewerkstelling zonder benoeming is gelegen in
      [artikel 3, eerste lid, onderdeel b, onder 1 en 2, tweede lid, aanhef en onderdeel a, of derde lid][ref1],
      persoonsidentificerende gegevens, en gegevens betreffende de school, de benoeming of tewerkstelling zonder
      benoeming, en de herregistratie opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel3
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel38b
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '3'
        hoofdstuk: I
  - number: 38b.2
    text: 'Het lerarenregister heeft tot doel:'
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel38b
  - number: 38b.2.a
    text: |-
      het vastleggen van het onderwijs waarvoor een leraar is benoemd of tewerkgesteld zonder benoeming op grond van
      [artikel 3, eerste lid, onderdeel b, onder 1 en 2, tweede lid, aanhef en onderdeel a, of derde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel3
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel38b
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '3'
        hoofdstuk: I
  - number: 38b.2.b
    text: het vastleggen op welke wijze een leraar voldoet aan de bekwaamheidseisen; en
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel38b
  - number: 38b.2.c
    text: het vastleggen of een leraar voldoet aan de herregistratiecriteria.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel38b
  - number: 38b.3
    text: 'In aanvulling op het tweede lid heeft het lerarenregister tot doel gegevens te verstrekken:'
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel38b
  - number: 38b.3.a
    text: aan Onze Minister ten behoeve van de beleidsvorming; en
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel38b
  - number: 38b.3.b
    text: |-
      aan de inspectie voor zover de verwerking van die gegevens noodzakelijk is voor de goede vervulling van haar
      publieke taak.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel38b
  - number: 38b.4
    text: Onze Minister draagt zorg voor het beheer van het lerarenregister.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel38b
  - number: 38d
    text: |-
      Onze Minister is voor de verwerking van persoonsgegevens in het kader van het lerarenregister de
      verwerkingsverantwoordelijke.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel38d
  - number: 38f
    text: |-
      Onze Minister stelt bij ministeriële regeling regels over de autorisatie van degenen die onder zijn gezag vallen
      voor verwerking van persoonsgegevens in het kader van het lerarenregister.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel38f
  - number: 38g.1
    text: 'Het lerarenregister bevat voor elke daarin opgenomen leraar:'
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel38g
  - number: 38g.1.a
    text: het burgerservicenummer;
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel38g
  - number: 38g.1.b
    text: de geslachtsnaam, de voornamen, het geslacht, het adres, de postcode, en de geboortedatum van de leraar;
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel38g
  - number: 38g.1.c
    text: |-
      gegevens betreffende de benoeming of tewerkstelling zonder benoeming, waaronder in ieder geval de ingangsdatum
      ervan;
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel38g
  - number: 38g.1.d
    text: |-
      gegevens betreffende de school waaraan hij benoemd is of tewerkgesteld zonder benoeming, waaronder in ieder geval
      het registratienummer van de school;
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel38g
  - number: 38g.1.e
    text: het onderwijs waarvoor de leraar kan opgaan voor herregistratie;
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel38g
  - number: 38g.1.f
    text: voor welk onderwijs als bedoeld in onderdeel e de leraar opgaat voor herregistratie;
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel38g
  - number: 38g.1.g
    text: gegevens betreffende de activiteiten voor herregistratie; en
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel38g
  - number: 38g.1.h
    text: |-
      gegevens betreffende de herregistratie waaronder, indien van toepassing, de aantekening, bedoeld in
      [artikel 38l, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel38l
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel38g
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 38l
        hoofdstuk: I
        paragraaf: 3a
        afdeling: '1'
  - number: 38g.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen de gegevens, bedoeld in het eerste lid, onderdelen c tot en
      met h, nader worden gespecificeerd.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel38g
  - number: 38h.1
    text: |-
      Het bevoegd gezag verstrekt aan Onze Minister de basisgegevens van
      leraren die zijn benoemd of tewerkgesteld zonder benoeming op grond van
      [artikel 3, eerste lid, onderdeel b, onder 1 en 2, tweede lid, aanhef en onderdeel a, of derde lid][ref1], en
      draagt zorg voor het correct bijhouden van die gegevens ten behoeve van het lerarenregister.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel3
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel38h
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '3'
        hoofdstuk: I
  - number: 38h.2
    text: |-
      De leraar verstrekt aan Onze Minister de gegevens, genoemd in
      [artikel 38g, eerste lid, onderdelen e tot en met g][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel38g
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel38h
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 38g
        hoofdstuk: I
        paragraaf: 3a
        afdeling: '1'
  - number: 38h.3
    text: |-
      Indien een leraar niet is benoemd of tewerkgesteld zonder benoeming, kan hij ten behoeve van opname in
      het lerarenregister de gegevens als genoemd in [artikel 38g, eerste lid, onderdelen e tot en met g][ref1],
      verstrekken aan Onze Minister mits hij tevens de gegevens, bedoeld in artikel 38g,
      eerste lid, onderdelen a en b, verstrekt en middels een bewijsstuk als bedoeld in
      [artikel 3, eerste lid, onderdeel b, onder 1 en 2, tweede lid, aanhef en onderdeel a, of derde lid][ref2], aantoont
      dat hij aan de bekwaamheidseisen voldoet.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel38g
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel3
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel38h
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 38g
        hoofdstuk: I
        paragraaf: 3a
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '3'
        hoofdstuk: I
  - number: 38h.4
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de tijdstippen en wijze van
      levering, de correctie van de gegevens en over het aantonen van de bekwaamheidseisen, bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel38h
  - number: 38i.1
    text: |-
      De gegevens, bedoeld in [artikel 38g, eerste lid, onder b][ref1], zijn gekoppeld aan het burgerservicenummer van de
      desbetreffende leraar en worden door Onze Minister verkregen uit de basisregistratie personen indien de leraar als
      ingezetene is ingeschreven in de basisregistratie personen.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel38g
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel38i
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 38g
        hoofdstuk: I
        paragraaf: 3a
        afdeling: '1'
  - number: 38i.2
    text: |-
      Indien de leraar niet als ingezetene is ingeschreven in de basisregistratie personen, worden de desbetreffende
      gegevens verkregen uit de levering op grond van [artikel 38h][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel38h
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel38i
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 38h
        hoofdstuk: I
        paragraaf: 3a
        afdeling: '1'
  - number: 38j
    text: |-
      Nadat een leraar de gegevens, bedoeld in [artikel 38h, tweede of derde lid][ref1], heeft verstrekt, neemt Onze
      Minister het burgerservicenummer en de andere gegevens die zijn geleverd op grond van artikel 38h en verkregen op
      grond van [artikel 38i][ref2] of [38s, tweede lid][ref3], op in het lerarenregister, met dien verstande dat hij de
      basisgegevens slechts opneemt voor zover deze niet kunnen worden verkregen uit de basisadministratie personen.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel38h
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel38i
      [ref3]: https://wetten.overheid.nl/BWBR0003420#Artikel38s
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel38j
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 38h
        hoofdstuk: I
        paragraaf: 3a
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: 38i
        hoofdstuk: I
        paragraaf: 3a
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0003420
        artikel: 38s
        hoofdstuk: I
        paragraaf: 3b
        afdeling: '1'
  - number: 38k.1
    text: |-
      Indien een of meer van de basisgegevens van een leraar in het lerarenregister afwijken van de betreffende
      basisgegevens behorende bij de benoeming of tewerkstelling zonder benoeming van deze leraar, kan de betrokkene
      Onze Minister elektronisch verzoeken deze gegevens te verbeteren. Onze Minister verzoekt het bevoegd gezag om hem
      overeenkomstig [artikel 38h, eerste lid][ref1], de juiste gegevens te verstrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel38h
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel38k
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 38h
        hoofdstuk: I
        paragraaf: 3a
        afdeling: '1'
  - number: 38k.2
    text: |-
      Indien het bevoegd gezag na het verzoek van Onze Minister constateert dat de basisgegevens van de leraar in het
      lerarenregister overeenkomen met de betreffende basisgegevens behorende bij de benoeming of tewerkstelling zonder
      benoeming van deze leraar, deelt hij dit elektronisch mee aan Onze Minister en deelt Onze Minister dit elektronisch
      mee aan de betrokkene.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel38k
  - number: 38k.3
    text: |-
      Het eerste en tweede lid zijn niet van toepassing op de gegevens die op grond van [artikel 38i][ref1] zijn
      overgenomen uit de basisregistratie personen.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel38i
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel38k
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 38i
        hoofdstuk: I
        paragraaf: 3a
        afdeling: '1'
  - number: 38k.4
    text: |-
      Een beslissing op een verzoek als bedoeld in het eerste lid, eerste volzin, geldt als een besluit in de zin van de
      [Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel38k
    references:
      - id: ref1
        bwb_id: BWBR0005537
  - number: 38n.1
    text: |-
      Gegevens van een leraar als bedoeld in [artikel 38g][ref1] worden verwijderd uit het lerarenregister:


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel38g
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel38n
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 38g
        hoofdstuk: I
        paragraaf: 3a
        afdeling: '1'
  - number: 38n.1.a
    text: indien betrokkene Onze Minister hier om verzoekt;
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel38n
  - number: 38n.1.b
    text: indien betrokkene de pensioengerechtigde leeftijd bereikt;
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel38n
  - number: 38n.1.c
    text: indien betrokkene is overleden.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel38n
  - number: 38n.2
    text: |-
      In de gevallen, bedoeld in het eerste lid, onder b en c, worden alle in het lerarenregister geregistreerde gegevens
      van betrokkene verwijderd.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel38n
  - number: 38n.3
    text: |-
      Indien een of meerdere gegevens van een leraar op grond van het eerste lid worden verwijderd uit het
      lerarenregister, blijven deze gegevens tot vijf jaar na verwijdering bewaard.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel38n
  - number: 38n.4
    text: |-
      Indien op grond van [artikel 38h][ref1] gegevens worden verstrekt voor heropname van een leraar in
      het lerarenregister, worden door Onze Minister van deze leraar de bewaarde gegevens als bedoeld in
      [artikel 38g, eerste lid, onderdelen e tot en met h][ref2], opgenomen in het lerarenregister.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel38h
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel38g
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel38n
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 38h
        hoofdstuk: I
        paragraaf: 3a
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: 38g
        hoofdstuk: I
        paragraaf: 3a
        afdeling: '1'
  - number: 38n.5
    text: |-
      Op verzoek van een leraar aan Onze Minister is het eerste lid, aanhef en onder b, op deze leraar niet van
      toepassing.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel38n
  - number: 38n.6
    text: |-
      Met pensioengerechtigde leeftijd wordt in dit artikel bedoeld de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a van de Algemene Ouderdomswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel38n
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: 7a
  - number: 38o.2
    text: |-
      Op verzoek van het bevoegd gezag van de school waaraan de leraar is benoemd of tewerkgesteld zonder benoeming
      worden in aanvulling op de gegevens, bedoeld in het eerste lid, de volgende gegevens van een leraar verstrekt:
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel38o
  - number: 38o.2.a
    text: het geslacht, het adres, de postcode en de geboortedatum;
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel38o
  - number: 38o.2.b
    text: gegevens betreffende de benoeming of tewerkstelling zonder benoeming;
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel38o
  - number: 38o.2.c
    text: gegevens betreffende de school waaraan hij is benoemd of tewerkgesteld zonder benoeming;
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel38o
  - number: 38o.2.d
    text: |-
      indien het bevoegd gezag daarvoor toestemming heeft van de leraar: gegevens betreffende de activiteiten voor
      herregistratie; en
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel38o
  - number: 38o.2.e
    text: overige gegevens betreffende de herregistratie.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel38o
  - number: 38o.3
    text: 'Bij of krachtens algemene maatregel van bestuur:'
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel38o
  - number: 38o.3.a
    text: wordt de wijze waarop de gegevens van een leraar worden verstrekt vastgesteld;
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel38o
  - number: 38o.3.c
    text: kunnen de gegevens, bedoeld in het eerste lid en tweede lid, nader worden gespecificeerd.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel38o
  - number: 38o.5
    text: |-
      De betrokkene heeft toegang tot de gegevens die worden bewaard op grond van [artikel 38n, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel38n
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel38o
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 38n
        hoofdstuk: I
        paragraaf: 3a
        afdeling: '1'
  - number: 38o.6
    text: 'Uit het lerarenregister worden aan Onze Minister gegevens verstrekt ten behoeve van:'
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel38o
  - number: 38o.6.b
    text: de beleidsvorming.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel38o
  - number: 38o.7
    text: |-
      Uit het lerarenregister worden aan de inspectie gegevens verstrekt voor zover de verwerking van die gegevens
      noodzakelijk is voor de goede vervulling van haar publieke taak.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel38o
  - number: 38o.8
    text: |-
      Bij de verstrekking, bedoeld in het zesde en zevende lid, kunnen persoonsgegevens worden verwerkt, indien
      dat noodzakelijk is voor de in het zesde of zevende lid genoemde doelen, onverminderd de verplichting voor de
      verwerkingsverantwoordelijke om passende technische en organisatorische maatregelen te treffen als bedoeld in
      artikel 25 van de Algemene verordening gegevensbescherming.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel38o
  - number: 38p.1
    text: |-
      Er is een registervoorportaal. In het registervoorportaal zijn van leraren die zijn benoemd of tewerkgesteld zonder
      benoeming en niet voldoen aan de bekwaamheidseisen van het onderwijs dat zij verzorgen persoonsidentificerende
      gegevens en gegevens betreffende de school en de benoeming of tewerkstelling opgenomen.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel38p
  - number: 38p.2
    text: |-
      Het registervoorportaal heeft tot doel het inzichtelijk maken welke leraren die zijn benoemd of tewerkgesteld
      zonder benoeming niet voldoen aan de bekwaamheidseisen van het onderwijs dat zij verzorgen.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel38p
  - number: 38p.3
    text: 'In aanvulling op het tweede lid heeft het registervoorportaal tot doel gegevens te verstrekken:'
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel38p
  - number: 38p.3.a
    text: aan Onze Minister ten behoeve van de beleidsvorming; en
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel38p
  - number: 38p.3.b
    text: |-
      aan de inspectie voor zover de verwerking van die gegevens noodzakelijk is voor de goede vervulling van haar
      publieke taak.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel38p
  - number: 38p.4
    text: Onze Minister draagt zorg voor het beheer van het registervoorportaal.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel38p
  - number: 38q.1
    text: |-
      Het registervoorportaal bevat voor elke daarin opgenomen leraar de basisgegevens, die op grond van
      [artikel 38r][ref1] worden geleverd, waaronder in ieder geval het gegeven betreffende het onderwijs waarvoor hij is
      benoemd of tewerkgesteld zonder benoeming.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel38r
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel38q
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 38r
        hoofdstuk: I
        paragraaf: 3b
        afdeling: '1'
  - number: 38q.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen de gegevens, bedoeld in het eerste lid, nader worden
      gespecificeerd.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel38q
  - number: 38r.1
    text: |-
      Het bevoegd gezag verstrekt aan Onze Minister de basisgegevens van leraren die zijn benoemd of
      tewerkgesteld zonder benoeming of onderwijs verzorgen op grond van de [artikelen 32][ref1] en
      [3, eerste lid, onderdeel b, onder 3, tweede lid, aanhef en onderdeel b, en vierde lid][ref2], en draagt zorg voor
      het correct bijhouden van die gegevens ten behoeve van het registervoorportaal.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel3
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel38r
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '32'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '3'
        hoofdstuk: I
  - number: 38r.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over het tijdstip en de wijze van
      levering en over de correctie van de gegevens.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel38r
  - number: 38s.1
    text: 'De leraar blijft voor het onderwijs waarvoor hij in het registervoorportaal is opgenomen vermeld:'
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel38s
  - number: 38s.1.a
    text: totdat hij voldoet aan de bekwaamheidseisen van dat onderwijs; of
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel38s
  - number: 38s.1.b
    text: maximaal voor de duur van de periode, genoemd in het artikel op grond waarvan deze leraar dit onderwijs geeft.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel38s
  - number: 38s.2
    text: |-
      Het bevoegd gezag stelt een leraar die in het registervoorportaal is opgenomen in staat te voldoen aan de vereisten
      om voor het desbetreffende onderwijs in het lerarenregister te kunnen worden opgenomen.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel38s
  - number: 38s.3
    text: |-
      Vanaf het moment dat een leraar voor het onderwijs waarvoor hij in het registervoorportaal is opgenomen, voldoet
      aan de criteria om in het lerarenregister te worden vermeld, worden de gegevens van deze leraar verstrekt voor
      opname in het lerarenregister.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel38s
  - number: 38s.4
    text: |-
      Indien een leraar die opgenomen is in het registervoorportaal niet langer voldoet aan de vereisten die op grond van
      de in [artikel 38r, eerste lid][ref1], genoemde bepalingen zijn gesteld aan de leraar, worden de gegevens van deze
      leraar verwijderd uit het registervoorportaal en gedurende vijf jaar bewaard.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel38r
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel38s
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 38r
        hoofdstuk: I
        paragraaf: 3b
        afdeling: '1'
  - number: 38t.2
    text: |-
      Op verzoek van het bevoegd gezag van de school waaraan de leraar is benoemd of tewerkgesteld zonder benoeming
      worden in aanvulling op de gegevens, bedoeld in het eerste lid, de volgende gegevens van een leraar verstrekt:
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel38t
  - number: 38t.2.a
    text: het geslacht, het adres, de postcode en de geboortedatum;
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel38t
  - number: 38t.2.b
    text: overige gegevens betreffende de benoeming of tewerkstelling zonder benoeming; en
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel38t
  - number: 38t.2.c
    text: gegevens betreffende de school waaraan hij is benoemd of tewerkgesteld zonder benoeming.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel38t
  - number: 38t.3
    text: 'Bij of krachtens algemene maatregel van bestuur:'
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel38t
  - number: 38t.3.a
    text: wordt de wijze waarop de gegevens van een leraar worden verstrekt vastgesteld;
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel38t
  - number: 38t.3.c
    text: kunnen de gegevens, bedoeld in het eerste lid en tweede lid, nader worden gespecificeerd.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel38t
  - number: 38t.4
    text: |-
      De leraar heeft toegang tot de gegevens die worden bewaard op grond van [artikel 38s, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel38s
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel38t
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 38s
        hoofdstuk: I
        paragraaf: 3b
        afdeling: '1'
  - number: 38t.5
    text: Uit het registervoorportaal worden aan Onze Minister gegevens verstrekt ten behoeve van de beleidsvorming.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel38t
  - number: 38t.6
    text: |-
      Uit het registervoorportaal worden aan de inspectie gegevens verstrekt voor zover de verwerking van die gegevens
      noodzakelijk is voor de goede vervulling van haar publieke taak.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel38t
  - number: 38t.7
    text: |-
      Bij de verstrekking, bedoeld in het vijfde en zesde lid, kunnen persoonsgegevens worden verwerkt, indien
      dat noodzakelijk is voor de in het vijfde of zesde lid genoemde doelen, onverminderd de verplichting voor de
      verwerkingsverantwoordelijke om passende technische en organisatorische maatregelen te treffen als bedoeld in
      artikel 25 van de Algemene verordening gegevensbescherming.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel38t
  - number: 38v
    text: |-
      De [artikelen 38b, vierde lid][ref1], [38d][ref2], [38f][ref3] en [38i tot en met 38k][ref4], zijn van
      overeenkomstige toepassing op het registervoorportaal.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel38b
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel38d
      [ref3]: https://wetten.overheid.nl/BWBR0003420#Artikel38f
      [ref4]: https://wetten.overheid.nl/BWBR0003420#Artikel38i
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel38v
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 38b
        hoofdstuk: I
        paragraaf: 3a
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: 38d
        hoofdstuk: I
        paragraaf: 3a
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0003420
        artikel: 38f
        hoofdstuk: I
        paragraaf: 3a
        afdeling: '1'
      - id: ref4
        bwb_id: BWBR0003420
        artikel: 38i
        hoofdstuk: I
        paragraaf: 3a
        afdeling: '1'
  - number: '39.1'
    text: Om als leerling tot een school te worden toegelaten, moet een kind de leeftijd van 4 jaar hebben bereikt.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel39
  - number: '39.2'
    text: |-
      Het bevoegd gezag kan voor kinderen die nog niet eerder tot een school, een school of afdeling voor speciaal
      onderwijs, een school voor speciaal en voortgezet speciaal onderwijs dan wel een instelling voor speciaal en
      voortgezet speciaal onderwijs zijn toegelaten, toelatingstijdstippen vaststellen op ten minste eenmaal per maand.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel39
  - number: '39.3'
    text: |-
      In de periode vanaf de leeftijd van 3 jaar en 10 maanden tot het bereiken van de leeftijd van 4 jaar kan het
      bevoegd gezag kinderen gedurende ten hoogste 5 dagen toelaten. Deze kinderen zijn geen leerlingen in de zin van
      de wet.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel39
  - number: '39.4'
    text: |-
      Leerlingen bij wie naar het oordeel van de directeur van de school de grondslag voor het volgen van aansluitend
      voortgezet onderwijs in voldoende mate is gelegd, verlaten aan het einde van het schooljaar de school, mits
      hierover met de ouders overeenstemming bestaat. In elk geval verlaten de leerlingen de school aan het einde van het
      schooljaar waarin zij de leeftijd van 14 jaar hebben bereikt.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel39
  - number: '40.1'
    text: |-
      De beslissing over toelating en verwijdering van leerlingen berust bij het bevoegd gezag. De
      toelating tot de school is niet afhankelijk van het houden van rechtmatig verblijf in de zin van
      [artikel 8 van de Vreemdelingenwet 2000][ref1]. De toelating mag niet afhankelijk worden gesteld van een geldelijke
      bijdrage van de ouders.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: '40.2'
    text: |-
      De aanmelding van kinderen voor toelating geschiedt schriftelijk en kan worden gedaan vanaf de dag waarop het
      kind de leeftijd van 3 jaar bereikt. De ouders doen de aanmelding zo mogelijk ten minste 10 weken voor de datum
      waarop toelating wordt gevraagd en geven bij de aanmelding aan bij welke school of scholen eveneens om toelating
      is verzocht.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel40
  - number: '40.3'
    text: |-
      Het bevoegd gezag beoordeelt of de aanmelding een kind betreft dat extra ondersteuning behoeft. Hiertoe kan
      het bevoegd gezag de ouders verzoeken gegevens te overleggen betreffende stoornissen of handicaps van het
      kind of beperkingen in de onderwijsparticipatie. Onder extra ondersteuning wordt niet verstaan ondersteuning
      ter bevordering van de beheersing van de Nederlandse taal met het oog op het voorkomen en bestrijden van
      onderwijsachterstanden.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel40
  - number: '40.4'
    text: |-
      Indien de toelating van een leerling die extra ondersteuning behoeft, wordt geweigerd, vindt de weigering niet
      plaats dan nadat het bevoegd gezag er, na overleg met de ouders en met inachtneming van de ondersteuningsbehoefte
      van de leerling en de schoolondersteuningsprofielen van de betrokken scholen, voor heeft zorg gedragen dat een
      andere school bereid is de leerling toe te laten. Onder andere school kan ook worden verstaan een school voor
      speciaal onderwijs, een school voor speciaal en voortgezet speciaal onderwijs of een instelling voor speciaal en
      voortgezet speciaal onderwijs.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel40
  - number: '40.5'
    text: 'Het derde en vierde lid zijn niet van toepassing:'
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel40
  - number: 40.5.a
    text: indien op de school waar de leerling is aangemeld geen plaatsruimte beschikbaar is, of
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel40
  - number: 40.5.b
    text: |-
      indien het bevoegd gezag de ouders bij de aanmelding verzoekt te verklaren dat zij de grondslag van het onderwijs
      op de school zullen respecteren dan wel te verklaren dat zij de grondslag van het onderwijs op de school zullen
      onderschrijven, en de ouders dit weigeren te verklaren.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel40
  - number: '40.6'
    text: |-
      Het bevoegd gezag neemt de beslissing over toelating van een leerling zo spoedig mogelijk doch uiterlijk 6
      weken na ontvangst van de aanmelding. Indien de beslissing, bedoeld in de vorige volzin, niet binnen 6 weken kan
      worden gegeven, deelt het bevoegd gezag dit aan de ouders mede en noemt het daarbij een zo kort mogelijke termijn
      waarbinnen de beslissing wel tegemoet kan worden gezien, welke termijn ten hoogste 4 weken bedraagt.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel40
  - number: '40.7'
    text: |-
      Indien de aanmelding een kind betreft dat niet is ingeschreven op een andere school, een school voor speciaal
      onderwijs, een school voor speciaal en voortgezet speciaal onderwijs of een instelling voor speciaal en voortgezet
      speciaal onderwijs, en de beslissing over de toelating is 10 weken na de dag waarop het verzoek om toelating is
      gedaan nog niet genomen, wordt het kind met ingang van de dag volgend op bedoelde 10 weken, doch niet eerder dan de
      datum waarop het kind de leeftijd heeft bereikt om te kunnen worden toegelaten tot de school, tijdelijk geplaatst
      op de school en als leerling ingeschreven. Indien de leerling wordt toegelaten, wordt de tijdelijke plaatsing
      omgezet in een definitieve plaatsing. Indien de toelating van de leerling wordt geweigerd of een beslissing
      wordt genomen de aanmelding niet te behandelen, wordt de tijdelijke plaatsing beëindigd en wordt de leerling
      uitgeschreven met ingang van de dag die volgt op de dag waarop de toelating wordt geweigerd of de beslissing wordt
      genomen de aanmelding niet te behandelen.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel40
  - number: '40.8'
    text: |-
      Een leerling wordt niet toegelaten tot een speciale school voor basisonderwijs dan nadat het samenwerkingsverband
      waartoe de speciale school voor basisonderwijs behoort de leerling toelaatbaar heeft verklaard tot het onderwijs
      aan een speciale school voor basisonderwijs in het samenwerkingsverband. De beslissing over de toelaatbaarheid
      is geen besluit als bedoeld in [artikel 8:4, derde lid, onder b, van de Algemene wet bestuursrecht][ref1]. Het
      samenwerkingsverband neemt geen beslissing over de toelaatbaarheid van de leerling, indien de leerling afkomstig
      is van een basisschool waarvan het bevoegd gezag is aangesloten bij een ander samenwerkingsverband en dat
      samenwerkingsverband nog geen onherroepelijk geworden beslissing over de toelaatbaarheid heeft genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '40.9'
    text: |-
      De toelating van een leerling van een basisschool tot een speciale school voor basisonderwijs van het
      samenwerkingsverband waaraan de basisschool deelneemt wordt niet geweigerd op denominatieve gronden, tenzij
      de ouders van de leerling weigeren te verklaren dat zij de grondslag van het onderwijs van de school zullen
      respecteren.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel40
  - number: '40.10'
    text: |-
      Tot een afdeling als bedoeld in [artikel 85a][ref1] kan uitsluitend worden toegelaten degene die:


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel85a
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 85a
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '2'
  - number: 40.10.a
    text: |-
      een andere dan de Nederlandse nationaliteit bezit of mede een dergelijke nationaliteit bezit en van wie ten minste
      een van de ouders voor een bepaalde tijd in Nederland of het grensgebied van Nederland werkzaam is, dan wel
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel40
  - number: 40.10.b
    text: |-
      uitsluitend de Nederlandse nationaliteit bezit, langere tijd in het buitenland heeft doorgebracht doordat ten
      minste een van de ouders voor een bepaalde tijd in het buitenland werkzaam was en de leerling daar langer dan 2
      jaar onderwijs heeft genoten volgens het daar geldende onderwijssysteem, dan wel
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel40
  - number: 40.10.c
    text: |-
      uitsluitend de Nederlandse nationaliteit bezit en waarvan blijkens een schriftelijke verklaring van de werkgever
      vaststaat dat ten minste een van de ouders binnen 2 jaar voor ten minste 2 jaar in het buitenland werkzaam zal zijn
      en de leerling mee verhuist naar het buitenland.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel40
  - number: '40.11'
    text: |-
      Voordat wordt besloten tot verwijdering hoort het bevoegd gezag de betrokken groepsleraar en de ouders van de
      leerling. Definitieve verwijdering van een leerling vindt niet plaats dan nadat het bevoegd gezag ervoor heeft zorg
      gedragen dat een andere school bereid is de leerling toe te laten. Onder andere school kan ook worden verstaan een
      school voor speciaal onderwijs, een school voor speciaal en voortgezet speciaal onderwijs of een instelling voor
      speciaal en voortgezet speciaal onderwijs.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel40
  - number: '40.12'
    text: |-
      Indien tegen het besluit, bedoeld in het eerste lid, van het bevoegd gezag van een openbare school bezwaar is
      gemaakt, besluit het bevoegd gezag in afwijking van [artikel 7:10 van de Algemene wet bestuursrecht][ref1] binnen 4
      weken gerekend vanaf de dag na die waarop de termijn voor het indienen van het bezwaarschrift is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: 40a.1
    text: |-
      Het bevoegd gezag stelt nadat op overeenstemming gericht overleg is gevoerd met de ouders een
      ontwikkelingsperspectief vast:
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel40a
  - number: 40a.1.a
    text: voor leerlingen van een basisschool, die extra ondersteuning behoeven;
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel40a
  - number: 40a.1.b
    text: voor leerlingen van een speciale school voor basisonderwijs.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel40a
  - number: 40a.2
    text: |-
      In afwijking van het eerste lid, wordt het deel van het ontwikkelingsperspectief betreffende de individuele
      begeleiding, bedoeld in [artikel 8, vierde lid][ref1], vastgesteld nadat hierover overeenstemming bereikt is tussen
      het bevoegd gezag en de ouders.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel8
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel40a
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '8'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '1'
  - number: 40a.3
    text: |-
      Het ontwikkelingsperspectief wordt zo spoedig mogelijk, doch uiterlijk binnen zes weken na de inschrijving van de
      leerling vastgesteld. Indien het betreft een inschrijving op grond van [artikel 40, zevende lid][ref1], wordt het
      ontwikkelingsperspectief uiterlijk binnen zes weken na de definitieve plaatsing van de leerling vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel40
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel40a
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '40'
        hoofdstuk: I
        paragraaf: '4'
        afdeling: '1'
  - number: 40a.4
    text: Het ontwikkelingsperspectief wordt ten minste één keer per schooljaar met de ouders geëvalueerd.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel40a
  - number: 40a.5
    text: |-
      Nadat op overeenstemming gericht overleg is gevoerd met de ouders of nadat overeenstemming bereikt is met de ouders
      voor zover het betreft de individuele begeleiding, bedoeld in [artikel 8, vierde lid][ref1], kan het bevoegd gezag
      het ontwikkelingsperspectief bijstellen.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel8
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel40a
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '8'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '1'
  - number: 40a.6
    text: |-
      Het ontwikkelingsperspectief bevat een omschrijving van de begeleiding, bedoeld in [artikel 8, vierde lid][ref1].
      Indien voor leerlingen als bedoeld in het eerste lid, onder a, bij de inrichting van het onderwijs wordt afgeweken
      van één of meer onderdelen van het onderwijsprogramma, wordt dat in het ontwikkelingsperspectief vermeld. Bij
      algemene maatregel van bestuur worden nadere voorschriften over de inhoud van het ontwikkelingsperspectief
      vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel8
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel40a
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '8'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '1'
  - number: 40b.1
    text: |-
      Onverminderd bij algemene maatregel van bestuur gegeven voorschriften met betrekking tot de in- en uitschrijving
      van leerlingen, vindt toelating van een leerling als bedoeld in artikel 40 slechts plaats nadat de ouders de
      gegevens betreffende de geslachtsnaam, de voorletters, de geboortedatum, het geslacht en het persoonsgebonden
      nummer van de leerling hebben overgelegd. Indien de ouders aannemelijk maken dat zij geen persoonsgebonden nummer
      van de leerling kunnen overleggen, vindt de toelating plaats met inachtneming van het derde lid.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel40b
  - number: 40b.2
    text: |-
      De in het eerste lid bedoelde gegevens worden overgelegd door middel van een van overheidswege verstrekt document,
      waarin de desbetreffende gegevens zijn opgenomen.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel40b
  - number: 40b.3
    text: |-
      Indien de ouders aannemelijk maken dat zij geen persoonsgebonden nummer van de leerling kunnen overleggen,
      meldt het bevoegd gezag binnen twee weken na het besluit tot toelating aan Onze Minister de beschikbare
      gegevens van de leerling, bedoeld in het eerste lid, alsmede zijn adres en woonplaats en, indien aanwezig, het
      leerlingadministratienummer.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel40b
  - number: 40b.4
    text: |-
      Onze Minister verstrekt binnen acht weken na ontvangst van de melding, bedoeld in het derde lid, aan het bevoegd
      gezag het burgerservicenummer van de leerling, dan wel, indien is gebleken dat hem niet van overheidswege een
      burgerservicenummer is verstrekt, het onderwijsnummer van de leerling. Het onderwijsnummer is een door Onze
      Minister uitgegeven en aan de leerling toegekend persoonsgebonden nummer.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel40b
  - number: 40b.5
    text: |-
      Het bevoegd gezag neemt de in het eerste en vierde lid bedoelde gegevens op in de leerlingenadministratie van de
      school. Bij ministeriële regeling kan worden bepaald welke andere gegevens in de leerlingenadministratie worden
      opgenomen.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel40b
  - number: 40b.6
    text: |-
      Indien aan een leerling een onderwijsnummer is toegekend en het bevoegd gezag de beschikking krijgt over zijn
      burgerservicenummer, neemt het bevoegd gezag dit burgerservicenummer terstond als persoonsgebonden nummer op
      in de leerlingenadministratie van de school in de plaats van het onderwijsnummer. Het bevoegd gezag meldt deze
      wijziging binnen twee weken aan Onze Minister onder opgave van het burgerservicenummer en het onderwijsnummer van
      de leerling.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel40b
  - number: 40c.1
    text: Het bevoegd gezag kan met opgave van redenen een leerling voor een periode van ten hoogste één week schorsen.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel40c
  - number: 40c.2
    text: De beslissing tot schorsing wordt schriftelijk aan de ouders bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel40c
  - number: 40c.3
    text: |-
      Het bevoegd gezag stelt de inspectie van een schorsing voor een periode langer dan één dag schriftelijk en met
      opgave van redenen onverwijld in kennis.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel40c
  - number: '41.1'
    text: |-
      De leerlingen nemen deel aan alle voor hen bestemde onderwijsactiviteiten, met dien verstande dat die
      onderwijsactiviteiten voor de leerlingen onderling kunnen verschillen.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel41
  - number: '41.2'
    text: |-
      Het bevoegd gezag kan op verzoek van de ouders een leerling vrijstellen van het deelnemen aan bepaalde
      onderwijsactiviteiten met uitzondering van de centrale eindtoets of de andere eindtoetsen, bedoeld in
      [artikel 9b][ref1]. Een vrijstelling kan slechts worden verleend op door het bevoegd gezag vastgestelde gronden.
      Het bevoegd gezag bepaalt bij de vrijstelling welke onderwijsactiviteiten voor de leerling in de plaats komen van
      die waarvan vrijstelling is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel9b
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 9b
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '1'
  - number: 41a.1
    text: |-
      De deelname van leerlingen aan activiteiten die geen onderdeel uitmaken van het verplichte onderwijsprogramma
      en worden georganiseerd onder verantwoordelijkheid van het bevoegd gezag, wordt niet afhankelijk gesteld van een
      bijdrage als bedoeld in [artikel 40, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel40
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel41a
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '40'
        hoofdstuk: I
        paragraaf: '4'
        afdeling: '1'
  - number: 41a.2
    text: 'Aan het eerste lid wordt in ieder geval voldaan voor de daar bedoelde activiteiten, indien:'
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel41a
  - number: 41a.2.a
    text: |-
      deze activiteiten buiten de kerndoelen, bedoeld in [artikel 9, vijfde lid][ref1], langdurig aan leerlingen worden
      aangeboden door een school die door dat bevoegd gezag in stand gehouden wordt,


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel9
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel41a
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '9'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '1'
  - number: 41a.2.b
    text: die school is aangesloten bij een verband van scholen die dergelijke activiteiten organiseren, en
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel41a
  - number: 41a.2.c
    text: |-
      krachtens een door dat verband vastgestelde code een regeling is getroffen voor de leerlingen ten aanzien van wie
      niet of niet geheel de gevraagde ouderbijdrage wordt betaald.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel41a
  - number: 41a.3
    text: |-
      Bij ministeriële regeling kunnen nadere voorschriften worden gesteld aan de scholen, bedoeld in het tweede lid,
      onderdeel b, en aan de code, bedoeld in het tweede lid, onderdeel c.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel41a
  - number: '42.1'
    text: |-
      Over iedere leerling die de school verlaat, stelt de directeur, na overleg met het onderwijzend personeel, ten
      behoeve van de ontvangende school of school als bedoeld in de [Wet op de expertisecentra][ref1] dan wel als bedoeld
      in de [Wet op het voortgezet onderwijs][ref2] een onderwijskundig rapport op. Afschrift van dit rapport wordt aan
      de ouders van de leerling verstrekt. Bij algemene maatregel van bestuur worden nadere voorschriften omtrent dit
      rapport gegeven. De centrale eindtoets of andere eindtoets dient als tweede objectieve gegeven om onderadvisering
      vanuit het primair onderwijs te voorkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0003549
      [ref2]: https://wetten.overheid.nl/BWBR0002399
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0003549
      - id: ref2
        bwb_id: BWBR0002399
  - number: '42.2'
    text: |-
      Ten behoeve van iedere leerling in het achtste schooljaar stelt het bevoegd gezag voor 1 maart
      een schooladvies vast omtrent het volgen van aansluitend voortgezet onderwijs als bedoeld in
      de [Wet op het voortgezet onderwijs][ref1] of voortgezet speciaal onderwijs als bedoeld in de
      [Wet op de expertisecentra][ref2]. Het schooladvies maakt onderdeel uit van het onderwijskundig rapport. Indien de
      leerling blijkens de uitslag van de centrale eindtoets of andere eindtoets, bedoeld in [artikel 9b][ref3], beschikt
      over meer kennis en vaardigheden dan die waarop het schooladvies berust, heroverweegt het bevoegd gezag het
      schooladvies. Indien hierbij wordt afgeweken van de uitslag van de centrale eindtoets of andere eindtoets, wordt
      dit gemotiveerd.


      [ref1]: https://wetten.overheid.nl/BWBR0002399
      [ref2]: https://wetten.overheid.nl/BWBR0003549
      [ref3]: https://wetten.overheid.nl/BWBR0003420#Artikel9b
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0002399
      - id: ref2
        bwb_id: BWBR0003549
      - id: ref3
        bwb_id: BWBR0003420
        artikel: 9b
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '1'
  - number: '42.3'
    text: |-
      De in het eerste lid bedoelde algemene maatregel van bestuur wordt aan de beide kamers der Staten-Generaal
      overgelegd. De maatregel treedt niet in werking dan nadat vier weken na de overlegging zijn verstreken en gedurende
      die termijn niet door of namens een van beide kamers de wens te kennen wordt gegeven dat het in die maatregel
      geregelde onderwerp bij de wet wordt geregeld. Alsdan wordt een daartoe strekkend wetsvoorstel zo spoedig mogelijk
      ingediend.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel42
  - number: '43.1'
    text: |-
      Er is tot een bij koninklijk besluit te bepalen tijdstip een landelijke commissie voor geschillen waarbij
      elke school, school als bedoeld in de [Wet op de expertisecentra][ref1] en school als bedoeld in de
      [Wet op het voortgezet onderwijs][ref2] is aangesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0003549
      [ref2]: https://wetten.overheid.nl/BWBR0002399
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0003549
      - id: ref2
        bwb_id: BWBR0002399
  - number: '43.2'
    text: |-
      De commissie neemt kennis van geschillen tussen ouders en bevoegd gezag van een school die ontstaan bij de
      toepassing van:
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel43
  - number: 43.2.a
    text: |-
      [artikel 40, derde, vierde, vijfde en elfde lid][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel40
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '40'
        hoofdstuk: I
        paragraaf: '4'
        afdeling: '1'
  - number: 43.2.b
    text: |-
      [artikel 40a, eerste, tweede en vijfde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel40a
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 40a
        hoofdstuk: I
        paragraaf: '4'
        afdeling: '1'
  - number: '43.3'
    text: |-
      De commissie brengt op verzoek van de ouders binnen 10 weken een oordeel uit aan het bevoegd gezag, rekening
      houdend met het schoolondersteuningsprofiel en het ondersteuningsplan.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel43
  - number: '43.4'
    text: |-
      Indien een geschil aanhangig is gemaakt bij de commissie en de ouders bezwaar hebben gemaakt tegen de beslissing
      over de toelating of de verwijdering, neemt het bevoegd gezag de beslissing op bezwaar niet dan nadat de commissie
      heeft geoordeeld. De termijn voor het nemen van de beslissing op bezwaar wordt opgeschort met ingang van de
      dag waarop het geschil aanhangig is gemaakt bij de commissie tot de dag waarop de commissie het oordeel heeft
      uitgebracht.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel43
  - number: '43.5'
    text: |-
      Bij algemene maatregel van bestuur worden voorschriften gegeven met betrekking tot de commissie, waaronder in elk
      geval het aantal leden, de wijze van benoeming en ontslag en de deskundigheid van de leden van de commissie.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel43
  - number: '45.1'
    text: |-
      Het bevoegd gezag draagt zorg voor een voorziening voor leerlingen om de middagpauze onder toezicht door
      te brengen, indien ouders hierom verzoeken. Ingeval de voorziening, bedoeld in de eerste volzin, tot stand
      komt, draagt het bevoegd gezag er zorg voor dat: a. er een overblijfaanpak tot stand komt, b. overleg over de
      overblijfaanpak tot stand komt met degenen die met het toezicht op de leerlingen worden belast, en met de ouders,
      c. het overblijven plaats vindt in een veilige en kindvriendelijke ruimte, en d. met ingang van 1 augustus 2011
      ten minste de helft van degenen die met het toezicht op de leerlingen worden belast, een scholing heeft gevolgd
      op het gebied van het overblijven. De kosten die hieruit voortvloeien komen voor rekening van de ouders, voogden
      of verzorgers. Indien de leerlingen van de voorziening, bedoeld in de eerste volzin, gebruik maken, draagt
      het bevoegd gezag er zorg voor dat degene, die met het toezicht op de leerlingen wordt belast, voor wettelijke
      aansprakelijkheid verzekerd is. Het bevoegd gezag van een bijzondere school is, telkenmale voor de duur van een
      schooljaar, ontheven van de verplichting tot verzekering indien: a. deze verplichting zich naar zijn oordeel niet
      verdraagt met de godsdienstige of levensbeschouwelijke overtuiging die aan de school ten grondslag ligt; en b. het
      bevoegd gezag van zijn oordeel mededeling heeft gedaan aan de ouders.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel45
  - number: 45.1a
    text: |-
      Diegene die met het toezicht op de leerlingen is belast, als bedoeld in het eerste lid, is in het bezit van een
      verklaring omtrent het gedrag, afgegeven volgens de [Wet justitiële en strafvorderlijke gegevens][ref1]. De
      verklaring, bedoeld in de eerste volzin, wordt aan het bevoegd gezag overgelegd en is op het moment dat zij wordt
      overgelegd, niet ouder dan twee maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0014194
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0014194
  - number: '45.2'
    text: |-
      Het bevoegd gezag van een basisschool draagt op daarvoor met ouders afgesproken dagen, zorg voor de organisatie
      van kinderopvang in de zin van de [Wet kinderopvang][ref1], voor leerlingen, op doordeweekse niet-schooldagen, niet
      zijnde algemeen erkende feestdagen en op schooldagen gedurende de voor- en naschoolse periode, tussen 07:30 uur en
      18:30 uur, indien een of meer ouders hierom verzoeken. De kosten die uit de opvang als bedoeld in de eerste volzin
      voortvloeien, komen voor rekening van de ouders.


      [ref1]: https://wetten.overheid.nl/BWBR0017017
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0017017
  - number: '45.3'
    text: |-
      Indien een of meer ouders gebruik maken van andere kinderopvang in de zin van de [Wet kinderopvang][ref1] dan
      bedoeld in het tweede lid, verstrekt het bevoegd gezag van een basisschool op verzoek van die andere kinderopvang
      de praktische informatie die nodig is voor de opvang van kinderen door die kinderopvang.


      [ref1]: https://wetten.overheid.nl/BWBR0017017
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0017017
  - number: '45.4'
    text: |-
      Onze Minister zendt elke twee jaar aan de Staten-Generaal een verslag over de doeltreffendheid en de
      effecten in de praktijk van het bepaalde in het tweede en het derde lid, alsmede van het bepaalde in
      [artikel 11, onderdeel p, van de Wet medezeggenschap op scholen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020685#Artikel11
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0020685
        artikel: '11'
  - number: 45a.1
    text: |-
      Indien de inspectie in het inspectierapport, bedoeld in [artikel 20 van de Wet op het onderwijstoezicht][ref1],
      tot het oordeel is gekomen dat de kwaliteit van het onderwijs zeer zwak is, als bedoeld in
      [artikel 10a, eerste of vierde lid][ref2], informeert het bevoegd gezag de ouders van de leerlingen van de school
      hierover door middel van in ieder geval de toezending van de door de inspectie opgestelde samenvatting van het
      inspectierapport, welke samenvatting gelijktijdig met het inspectierapport ter beschikking is gesteld van het
      bevoegd gezag. De toezending, bedoeld in de eerste volzin, geschiedt binnen vier weken na de vaststelling van het
      inspectierapport.


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel10
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel45a
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: '20'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '10'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '1'
  - number: 45a.2
    text: |-
      Indien het bevoegd gezag niet of niet tijdig voldoet aan de verplichting, bedoeld in het eerste lid, zendt Onze
      Minister de samenvatting van het inspectierapport, bedoeld in het eerste lid, in de vijfde week na vaststelling van
      het inspectie rapport aan de ouders van de leerlingen.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel45a
  - number: 45a.3
    text: |-
      Indien de inspectie op basis van een onderzoek als bedoeld in [artikel 11][ref1] of
      [artikel 15 van de Wet op het onderwijstoezicht][ref2] in het inspectierapport, bedoeld in
      [artikel 20 van genoemde wet][ref3], tot het oordeel is gekomen dat sprake is van een zeer zwakke school, betrekt
      het bevoegd gezag de ouders van de leerlingen van de school bij de door het bevoegd gezag voorgenomen maatregelen
      ten behoeve van kwaliteitsverbetering.


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0013800#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0013800#Artikel20
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel45a
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0013800
        artikel: '15'
      - id: ref3
        bwb_id: BWBR0013800
        artikel: '20'
  - number: '46.1'
    text: |-
      Het openbaar onderwijs draagt bij aan de ontwikkeling van de leerlingen met aandacht voor de godsdienstige,
      levensbeschouwelijke en maatschappelijke waarden zoals die leven in de Nederlandse samenleving en met onderkenning
      van de betekenis van de verscheidenheid van die waarden.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel46
  - number: '46.2'
    text: Openbare scholen zijn toegankelijk voor alle kinderen zonder onderscheid van godsdienst of levensbeschouwing.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel46
  - number: '46.3'
    text: Openbaar onderwijs wordt gegeven met eerbiediging van ieders godsdienst of levensbeschouwing.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel46
  - number: '47.1'
    text: |-
      Een gemeenteraad kan bij verordening een openbare rechtspersoon instellen die tot doel heeft een of meer
      openbare scholen in de gemeente in stand te houden, al dan niet te zamen met openbare scholen als bedoeld in de
      [Wet op de expertisecentra][ref1] of openbare scholen als bedoeld in de [Wet op het voortgezet onderwijs][ref2].
      Een openbare rechtspersoon kan ook worden ingesteld door meer dan een gemeente ten behoeve van het in stand houden
      van openbare scholen in die gemeenten door het vaststellen van een voor wat betreft de onderwerpen, bedoeld in
      het vierde lid, gelijkluidende verordening, in welk geval de openbare rechtspersoon niet eerder tot stand komt dan
      nadat alle daartoe strekkende verordeningen in werking zijn getreden.


      [ref1]: https://wetten.overheid.nl/BWBR0003549
      [ref2]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0003549
      - id: ref2
        bwb_id: BWBR0003549
  - number: '47.2'
    text: De gemeenteraad of gemeenteraden maken het voornemen tot een besluit als bedoeld in het eerste lid bekend.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel47
  - number: '47.3'
    text: |-
      De openbare rechtspersoon oefent alle taken en bevoegdheden uit van het bevoegd gezag. Hij bezit
      rechtspersoonlijkheid.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel47
  - number: '47.4'
    text: 'De verordening, bedoeld in het eerste lid, voorziet in ieder geval in een regeling omtrent:'
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel47
  - number: 47.4.a
    text: de samenstelling, werkwijze en inrichting van het bestuur van de openbare rechtspersoon,
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel47
  - number: 47.4.b
    text: |-
      de wijze van benoeming, herbenoeming, schorsing en ontslag van de bestuursleden, met dien verstande dat de leden
      van het bestuur worden benoemd door de gemeenteraad of gemeenteraden en dat ten minste een derde gedeelte, doch
      geen meerderheid, van die leden wordt benoemd op bindende voordracht van de ouders van de leerlingen die zijn
      ingeschreven op de betrokken school of scholen,
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel47
  - number: 47.4.c
    text: de termijn waarvoor de bestuursleden worden benoemd,
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel47
  - number: 47.4.d
    text: |-
      de vaststelling van de begroting na goedkeuring door de desbetreffende gemeenteraad of gemeenteraden en de
      vaststelling van de jaarrekening na instemming van de desbetreffende gemeenteraad of gemeenteraden,
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel47
  - number: 47.4.e
    text: de wijze waarop de gemeenteraad of gemeenteraden toezicht op het bestuur uitoefenen,
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel47
  - number: 47.4.f
    text: de gronden waarop het bestuur kan besluiten de vergaderingen besloten te houden, en
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel47
  - number: 47.4.g
    text: |-
      de periode waarvoor de openbare rechtspersoon in het leven wordt geroepen, met dien verstande dat deze periode ten
      minste 5 jaren bedraagt,
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel47
  - number: '47.5'
    text: |-
      Het bestuur brengt jaarlijks aan de gemeenteraad of gemeenteraden verslag uit over de werkzaamheden, waarbij in
      ieder geval aandacht wordt geschonken aan de wezenskenmerken van het openbaar onderwijs. Het verslag wordt openbaar
      gemaakt.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel47
  - number: '47.6'
    text: |-
      De vergaderingen van het bestuur van de openbare rechtspersoon zijn openbaar, tenzij het bestuur anders beslist, op
      gronden, vermeld in de verordening.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel47
  - number: '47.7'
    text: |-
      Indien voor 1 februari van het jaar waarvoor de begroting geldt, de begroting niet is goedgekeurd, neemt de
      gemeenteraad of gemeenteraden de maatregelen die zij nodig achten om de continuïteit van het onderwijsproces te
      waarborgen.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel47
  - number: '47.8'
    text: |-
      De gemeenteraad of gemeenteraden zijn in geval van ernstige taakverwaarlozing door het bestuur of functioneren
      in strijd met de wet bevoegd zelf te voorzien in het bestuur van de scholen en zo nodig de openbare rechtspersoon
      te ontbinden.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel47
  - number: '47.9'
    text: |-
      Indien de school een raad van toezicht heeft, is het vierde lid niet van toepassing en voorziet de verordening,
      bedoeld in het eerste lid, onverminderd [artikel 17c][ref1], in ieder geval in een regeling omtrent:


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel17c
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 17c
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '1'
  - number: 47.9.a
    text: de samenstelling, werkwijze en inrichting van de raad van toezicht van de openbare rechtspersoon,
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel47
  - number: 47.9.b
    text: |-
      de wijze van benoeming, herbenoeming, schorsing en ontslag van de leden van de raad van toezicht, met dien
      verstande dat de leden van de raad van toezicht worden benoemd door de gemeenteraad of gemeenteraden en dat ten
      minste een derde gedeelte, doch geen meerderheid, van die leden wordt benoemd op bindende voordracht van de ouders
      van de leerlingen die zijn ingeschreven op de betrokken school of scholen,
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel47
  - number: 47.9.c
    text: de termijn waarvoor de leden van de raad van toezicht worden benoemd,
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel47
  - number: 47.9.d
    text: de vaststelling van de begroting en de jaarrekening, en
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel47
  - number: 47.9.e
    text: |-
      de periode waarvoor de openbare rechtspersoon in het leven wordt geroepen, met dien verstande dat deze periode ten
      minste 5 jaren bedraagt, met dien verstande dat in de regeling een overheersende invloed van de overheid in de raad
      van toezicht is verzekerd. Het vijfde, zesde en achtste lid zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel47
  - number: '48.1'
    text: |-
      Een gemeenteraad kan besluiten dat een of meer openbare scholen in de gemeente in stand worden gehouden door
      een stichting die zich ten doel stelt het in stand houden van een of meer openbare scholen, al dan niet te zamen
      met openbare scholen als bedoeld in de [Wet op de expertisecentra][ref1] of openbare scholen als bedoeld in de
      [Wet op het voortgezet onderwijs][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003549
      [ref2]: https://wetten.overheid.nl/BWBR0002399
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0003549
      - id: ref2
        bwb_id: BWBR0002399
  - number: '48.2'
    text: De gemeenteraad maakt het voornemen tot een besluit als bedoeld in het eerste lid bekend.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel48
  - number: '48.3'
    text: |-
      Een stichting die een openbare school in stand houdt, wordt opgericht door een of meer gemeenten, al dan niet te
      zamen met een of meer privaatrechtelijke rechtspersonen met volledige rechtsbevoegdheid.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel48
  - number: '48.4'
    text: |-
      Onverminderd [artikel 17d, eerste lid][ref1], is het statutaire doel van de stichting uitsluitend het geven van
      openbaar onderwijs overeenkomstig [artikel 46][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel17d
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel46
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 17d
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '46'
        hoofdstuk: I
        afdeling: '2'
  - number: '48.5'
    text: De stichting oefent alle taken en bevoegdheden van het bevoegd gezag uit.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel48
  - number: '48.6'
    text: 'Onverminderd het vierde lid voorzien de statuten in ieder geval in een regeling omtrent:'
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel48
  - number: 48.6.a
    text: de samenstelling, werkwijze en inrichting van het bestuur van de stichting,
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel48
  - number: 48.6.b
    text: |-
      de wijze van benoeming, herbenoeming, schorsing en ontslag van de bestuursleden, met dien verstande dat de leden
      van het bestuur worden benoemd door de gemeenteraad of gemeenteraden en dat ten minste een derde gedeelte, doch
      geen meerderheid, van die leden wordt benoemd op bindende voordracht van de ouders van de leerlingen die zijn
      ingeschreven op de betrokken school of scholen,
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel48
  - number: 48.6.c
    text: de termijn waarvoor de bestuursleden worden benoemd,
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel48
  - number: 48.6.d
    text: |-
      de vaststelling van de begroting na goedkeuring door de desbetreffende gemeenteraad of gemeenteraden en de
      vaststelling van de jaarrekening na instemming van de desbetreffende gemeenteraad of gemeenteraden,
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel48
  - number: 48.6.e
    text: de wijze waarop de gemeenteraad of gemeenteraden toezicht op het bestuur uitoefenen,
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel48
  - number: 48.6.f
    text: de gronden waarop het bestuur kan besluiten de vergaderingen besloten te houden,
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel48
  - number: 48.6.g
    text: |-
      de periode waarvoor de stichting in het leven wordt geroepen, met dien verstande dat deze periode ten minste 5
      jaren bedraagt, en
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel48
  - number: 48.6.h
    text: |-
      de bevoegdheid de stichting te ontbinden, met dien verstande dat in de regeling een overheersende invloed van de
      overheid in het bestuur is verzekerd.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel48
  - number: '48.7'
    text: |-
      De statuten van de stichting kunnen slechts worden gewijzigd na instemming van de desbetreffende gemeenteraad of
      gemeenteraden.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel48
  - number: '48.8'
    text: |-
      Het bestuur brengt jaarlijks aan de gemeenteraad of gemeenteraden verslag uit over de werkzaamheden, waarbij in
      ieder geval aandacht wordt geschonken aan de wezenskenmerken van het openbaar onderwijs. Het verslag wordt openbaar
      gemaakt.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel48
  - number: '48.9'
    text: |-
      De vergaderingen van het bestuur van de stichting zijn openbaar, tenzij het bestuur anders beslist, op gronden,
      vermeld in de statuten.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel48
  - number: '48.10'
    text: |-
      Indien voor 1 februari van het jaar waarvoor de begroting geldt, de begroting niet is goedgekeurd, neemt de
      gemeenteraad of gemeenteraden de maatregelen die zij nodig achten om de continuïteit van het onderwijsproces te
      waarborgen.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel48
  - number: '48.11'
    text: |-
      De gemeenteraad of gemeenteraden zijn in geval van ernstige taakverwaarlozing door het bestuur of functioneren in
      strijd met de wet bevoegd zelf te voorzien in het bestuur van de scholen en zo nodig de stichting te ontbinden.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel48
  - number: '48.12'
    text: |-
      Indien de school een raad van toezicht heeft, is het zesde lid niet van toepassing en voorzien de statuten,
      onverminderd [artikel 17c][ref1], in ieder geval in een regeling omtrent:


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel17c
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 17c
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '1'
  - number: 48.12.a
    text: de samenstelling, werkwijze en inrichting van de raad van toezicht van de stichting,
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel48
  - number: 48.12.b
    text: |-
      de wijze van benoeming, herbenoeming, schorsing en ontslag van de leden van de raad van toezicht, met dien
      verstande dat de leden van de raad van toezicht worden benoemd door de gemeenteraad of gemeenteraden en dat ten
      minste een derde gedeelte, doch geen meerderheid, van die leden wordt benoemd op bindende voordracht van de ouders
      van de leerlingen die zijn ingeschreven op de betrokken school of scholen,
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel48
  - number: 48.12.c
    text: de termijn waarvoor de leden van de raad van toezicht worden benoemd,
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel48
  - number: 48.12.d
    text: de vaststelling van de begroting en de jaarrekening, en
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel48
  - number: 48.12.e
    text: |-
      de periode waarvoor de stichting in het leven wordt geroepen, met dien verstande dat deze periode ten minste 5
      jaren bedraagt,
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel48
  - number: 48.12.h
    text: |-
      de bevoegdheid de stichting te ontbinden, met dien verstande dat in de regeling een overheersende invloed van
      de overheid in de raad van toezicht is verzekerd. Het achtste, negende en elfde lid zijn van overeenkomstige
      toepassing.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel48
  - number: '49.1'
    text: |-
      De rechtspersoon die een openbare school in stand houdt, kan de instandhouding van die school overdragen aan
      een andere rechtspersoon die tot instandhouding van een openbare school bevoegd is. De overdracht geschiedt bij
      notariële akte.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel49
  - number: '49.2'
    text: |-
      Bij deze akte verbindt de overdragende rechtspersoon zich tevens de rechten ten aanzien van gebouwen en
      terreinen alsmede de roerende zaken over te dragen. Deze akte geldt tevens als akte van levering als bedoeld in
      [artikel 89 van Boek 3 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel89
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '89'
  - number: '49.3'
    text: |-
      In de akte wordt bepaald dat de rechtspersoon aan wie wordt overgedragen, het personeel in gelijke betrekkingen en
      onder dezelfde voorwaarden als vermeld in de arbeidsovereenkomst, benoemt met ingang van de datum van overdracht.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel49
  - number: '49.4'
    text: |-
      Door overdracht met inachtneming van de voorgaande leden treedt de verkrijgende rechtspersoon in alle uit de wet
      voortvloeiende rechten en verplichtingen die zijn rechtsvoorganger bezit in zijn hoedanigheid van bevoegd gezag,
      onverminderd hetgeen verder voor de overgang daarvan naar burgerlijk recht is vereist.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel49
  - number: '50.1'
    text: |-
      Het bevoegd gezag stelt de leerlingen in de gelegenheid op de school, binnen de schooltijden, godsdienstonderwijs
      of levensbeschouwelijk vormingsonderwijs te ontvangen. Van de tijd daaraan te besteden worden ten
      hoogste 40 uren per schooljaar meegeteld voor het aantal uren onderwijs dat de leerlingen krachtens
      [artikel 8, zevende lid, aanhef en onder b][ref1], ten minste moeten ontvangen. Voor de leerlingen die dit
      onderwijs niet volgen, voorziet het bevoegd gezag in andere onderwijsactiviteiten op de school.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel8
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '8'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '1'
  - number: '50.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing op samenwerkingsscholen als bedoeld in [artikel 17d][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel17d
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 17d
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '1'
  - number: '50.3'
    text: |-
      Het bevoegd gezag informeert de ouders in de schoolgids over de mogelijkheid om godsdienstonderwijs of
      levensbeschouwelijk onderwijs te ontvangen.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel50
  - number: '51'
    text: |-
      Godsdienstonderwijs wordt gegeven door leraren daartoe aangewezen door kerkelijke gemeenten, plaatselijke kerken,
      of rechtspersonen met volledige rechtsbevoegdheid die zich blijkens hun statuten het geven van godsdienstonderwijs
      ten doel stellen. Levensbeschouwelijk vormingsonderwijs wordt gegeven door leraren daartoe aangewezen door
      volledige rechtsbevoegdheid bezittende organisaties op geestelijke grondslag. Het bevoegd gezag ziet erop toe
      dat dit onderwijs uitsluitend wordt gegeven door een leraar die blijkens een daartoe strekkende verklaring van de
      aanwijzende instantie:
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel51
  - number: 51.a
    text: |-
      voldoet aan de bekwaamheidseisen die krachtens artikel 32a, eerste lid, voor het geven van dat onderwijs zijn
      vastgesteld, en
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel51
  - number: 51.b
    text: zijn bekwaamheid onderhoudt.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel51
  - number: '52'
    text: |-
      In afwijking van [artikel 33a][ref1], zijn Gedeputeerde Staten van de desbetreffende provincie bevoegd de
      disciplinaire straf of de schorsing op te leggen dan wel het ontslag te verlenen, indien het betreft een directeur,
      een adjunct-directeur, of een ander lid van het onderwijzend personeel van een openbare school en deze tevens lid
      is van de raad van de gemeente die de school in stand houdt.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel33a
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 33a
        hoofdstuk: I
        paragraaf: '3'
        afdeling: '1'
  - number: '55'
    text: |-
      Een bijzondere school wordt in stand gehouden door een rechtspersoon met volledige rechtsbevoegdheid die zich
      blijkens de statuten of reglementen het geven van onderwijs ten doel stelt zonder daarbij het maken van winst te
      beogen.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel55
  - number: '56.1'
    text: |-
      De rechtspersoon die de school in stand houdt, kan de instandhouding van de school overdragen aan een andere
      rechtspersoon die voldoet aan [artikel 55][ref1]. De overdracht geschiedt bij notariële akte.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel55
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '55'
        hoofdstuk: I
        afdeling: '3'
  - number: '56.2'
    text: |-
      Bij deze akte verbindt de overdragende rechtspersoon zich tevens de rechten ten aanzien van gebouwen en
      terreinen alsmede de roerende zaken over te dragen. Deze akte geldt tevens als akte van levering bedoeld in
      [artikel 89 van Boek 3 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel89
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '89'
  - number: '56.3'
    text: |-
      In de akte wordt bepaald dat de rechtspersoon aan wie wordt overgedragen, het personeel in gelijke betrekkingen en
      onder dezelfde voorwaarden als vermeld in de arbeidsovereenkomst, benoemt met ingang van de datum van overdracht.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel56
  - number: '56.4'
    text: |-
      Door overdracht met inachtneming van de voorgaande leden, treedt de verkrijgende rechtspersoon in alle uit de
      wet voortvloeiende rechten en verplichtingen van zijn rechtsvoorganger met betrekking tot de school, onverminderd
      hetgeen verder voor de overgang daarvan naar burgerlijk recht is vereist.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel56
  - number: '56.5'
    text: |-
      Bij een splitsing als bedoeld in [artikel 334a van Boek 2 van het Burgerlijk Wetboek][ref1] van een rechtspersoon
      die een school in stand houdt, wordt in de splitsingsakte bepaald dat de voortbestaande splitsende rechtspersoon de
      school in stand zal houden of op welke verkrijgende rechtspersoon de instandhouding van de school overgaat. In het
      laatste geval zijn het tweede tot en met vierde lid van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel334a
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 334a
  - number: '57'
    text: |-
      Onverminderd [artikel 9][ref1] kunnen de onderwijsactiviteiten godsdienstonderwijs of levensbeschouwelijk
      vormingsonderwijs omvatten. Van de tijd daaraan te besteden worden ten hoogste 120 uren per schooljaar meegeteld
      voor het aantal uren onderwijs dat de leerlingen krachtens [artikel 8, zevende lid, aanhef en onder b][ref2], ten
      minste moeten ontvangen. Het geven van godsdienstonderwijs of levensbeschouwelijk vormingsonderwijs kan worden
      opgedragen aan een niet aan de school verbonden leraar.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel8
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '9'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '8'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '1'
  - number: '58.1'
    text: |-
      Indien binnen redelijke afstand van de woning van de leerling geen gelegenheid bestaat tot het volgen van
      openbaar onderwijs, mag de toelating tot de school niet worden geweigerd op grond van godsdienstige gezindheid
      of levensbeschouwing. Het voorgaande is niet van toepassing indien de school uitsluitend is bestemd voor interne
      leerlingen.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel58
  - number: '58.2'
    text: |-
      Leerlingen die ingevolge het eerste lid zijn toegelaten, kunnen niet worden verplicht godsdienstonderwijs of
      levensbeschouwelijk vormingsonderwijs te volgen.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel58
  - number: '63.1'
    text: |-
      Indien het bevoegd gezag van een bijzondere school op grond van [artikel 36, derde lid][ref1], een student de
      toegang weigert, deelt het deze beslissing, schriftelijk en met redenen omkleed, mede door toezending of uitreiking
      aan de student, onverminderd het bepaalde in dat artikellid.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel36
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '36'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: '1'
  - number: '63.2'
    text: |-
      Indien het bevoegd gezag van een bijzondere school op grond van [artikel 40][ref1] weigert een leerling toe te
      laten dan wel een leerling verwijdert, deelt het de beslissing daartoe, schriftelijk en met redenen omkleed, mede
      door toezending of uitreiking aan de ouders. Daarbij wordt tevens de inhoud van het bepaalde in het derde lid,
      eerste volzin, vermeld. Voordat het bevoegd gezag van een bijzondere school op grond van dat artikellid beslist tot
      verwijdering van een leerling, hoort het de ouders van de leerling, onverminderd het bepaalde in dat artikellid.
      Het bevoegd gezag neemt de beslissing, bedoeld in de eerste volzin, zo spoedig mogelijk.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel40
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '40'
        hoofdstuk: I
        paragraaf: '4'
        afdeling: '1'
  - number: '63.3'
    text: |-
      Binnen 6 weken na de mededeling, bedoeld in het tweede lid, kunnen de ouders bij het bevoegd gezag schriftelijk hun
      bezwaren kenbaar maken tegen de beslissing. Het bevoegd gezag beslist binnen 4 weken na ontvangst van de bezwaren.
      Alvorens te beslissen hoort het bevoegd gezag de ouders.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel63
  - number: '63.4'
    text: |-
      Het bevoegd gezag van een bijzondere school kan beslissen een aanmelding voor toelating niet te behandelen,
      indien de verstrekte gegevens en bescheiden onvoldoende zijn voor de beoordeling van de aanmelding of voor de
      voorbereiding van de toelatingsbeslissing, mits de ouders de gelegenheid hebben gehad de aanmelding binnen een
      door het bevoegd gezag gestelde termijn aan te vullen. Een beslissing om de aanmelding niet te behandelen wordt aan
      de ouders bekendgemaakt binnen vier weken nadat de aanmelding is aangevuld of nadat de daarvoor gestelde termijn
      ongebruikt is verstreken. De termijn voor het nemen van de toelatingsbeslissing wordt opgeschort met ingang van de
      dag waarop het bevoegd gezag krachtens de eerste volzin de ouders uitnodigt de aanmelding aan te vullen, tot de dag
      waarop de aanmelding is aangevuld of de daarvoor gestelde termijn ongebruikt is verstreken.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel63
  - number: '64.1'
    text: |-
      In deze afdeling wordt verstaan onder: - *fusie:* een bestuurlijke of institutionele fusie,
        - *institutionele fusie:* een fusie waarbij een school ontstaat door samenvoeging van twee of meer scholen,
        - *bestuurlijke fusie:* een fusie waarbij een of meer rechtspersonen de instandhouding van een school, een school
      als bedoeld in de [Wet op de expertisecentra][ref1] dan wel de [Wet op het voortgezet onderwijs][ref2] overdragen.


      [ref1]: https://wetten.overheid.nl/BWBR0003549
      [ref2]: https://wetten.overheid.nl/BWBR0002399
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0003549
      - id: ref2
        bwb_id: BWBR0002399
  - number: '64.2'
    text: |-
      Het eerste lid, onderdeel c, is niet van toepassing op het instellen van een openbare rechtspersoon als bedoeld
      in [artikel 47, eerste lid, eerste volzin][ref1], de instandhouding van een of meer openbare scholen door een
      stichting als bedoeld in [artikel 48, eerste lid][ref2], of de overdracht aan de gemeente van de instandhouding
      van een openbare school of openbare nevenvestiging, bedoeld in [artikel 159, tweede lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel48
      [ref3]: https://wetten.overheid.nl/BWBR0003420#Artikel159
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '47'
        hoofdstuk: I
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '48'
        hoofdstuk: I
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0003420
        artikel: '159'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '9'
  - number: 64a.1
    text: Fusies worden niet tot stand gebracht dan nadat daarvoor goedkeuring is verleend door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel64a
  - number: 64a.2
    text: 'De goedkeuring, bedoeld in het eerste lid, is niet vereist voor:'
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel64a
  - number: 64a.2.a
    text: een institutionele fusie waarbij het totaal aantal leerlingen van de betrokken scholen minder dan 500 bedraagt;
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel64a
  - number: 64a.2.b
    text: een bestuurlijke fusie waarbij het aantal betrokken scholen minder dan tien bedraagt; of
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel64a
  - number: 64a.2.c
    text: |-
      de bestuurlijke en institutionele fusie die noodzakelijk zijn voor de totstandkoming van de samenwerkingsschool,
      bedoeld in [artikel 17d, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel17d
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel64a
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 17d
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '1'
  - number: 64a.3
    text: |-
      De rechtspersoon dan wel de betrokken rechtspersonen stellen een fusie-effectrapportage op voor iedere
      institutionele of bestuurlijke fusie.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel64a
  - number: 64b.1
    text: |-
      De rechtspersoon dient dan wel de rechtspersonen gezamenlijk dienen een aanvraag in bij Onze Minister voor het
      verkrijgen van de goedkeuring, bedoeld in [artikel 64a, eerste lid][ref1]. De aanvraag gaat vergezeld van:


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel64a
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel64b
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 64a
        hoofdstuk: I
        afdeling: '1'
  - number: 64b.1.a
    text: een door de rechtspersoon dan wel rechtspersonen opgestelde fusie-effectrapportage, en
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel64b
  - number: 64b.1.b
    text: |-
      een schriftelijke verklaring van instemming met de fusie door de medezeggenschapsraden dan wel de
      gemeenschappelijke medezeggenschapsraden, dan wel
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel64b
  - number: 64b.1.c
    text: |-
      de bindende uitspraak van de geschillencommissie op grond
      van[ artikel 32, eerste dan wel vierde lid, tweede volzin, van de Wet medezeggenschap op scholen][ref1], dan wel de
      bindende uitspraak van de ondernemingskamer op grond van [artikel 36 van de Wet medezeggenschap op scholen][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020685#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0020685#Artikel36
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel64b
    references:
      - id: ref1
        bwb_id: BWBR0020685
        artikel: '32'
      - id: ref2
        bwb_id: BWBR0020685
        artikel: '36'
  - number: 64b.2
    text: 'De fusie-effectrapportage bevat ten minste een weergave van:'
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel64b
  - number: 64b.2.a
    text: de motieven voor de fusie,
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel64b
  - number: 64b.2.b
    text: de alternatieven voor de fusie,
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel64b
  - number: 64b.2.c
    text: het tijdsbestek waarbinnen de fusie zal worden gerealiseerd,
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel64b
  - number: 64b.2.d
    text: de te bereiken doelen,
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel64b
  - number: 64b.2.e
    text: |-
      de effecten van de fusie op de keuzevrijheid, in het bijzonder de effecten van de fusie op de spreiding en omvang
      van de rechtspersonen en scholen in het voedingsgebied en de onderwijskundige en bestuurlijke diversiteit van het
      onderwijsaanbod in het voedingsgebied,
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel64b
  - number: 64b.2.f
    text: de kosten en baten van de fusie,
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel64b
  - number: 64b.2.g
    text: de gevolgen van de fusie voor het personeel en leerlingen, waaronder begrepen de gevolgen voor de voorzieningen,
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel64b
  - number: 64b.2.h
    text: de wijze waarop over de fusie wordt gecommuniceerd,
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel64b
  - number: 64b.2.i
    text: de wijze waarop de fusie wordt geëvalueerd, en
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel64b
  - number: 64b.2.j
    text: |-
      een advies van burgemeester en wethouders van de betrokken gemeenten over de wenselijkheid van de voorgestelde
      fusie.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel64b
  - number: 64b.3
    text: Bij ministeriële regeling wordt een modelformulier voor de fusie-effectrapportage vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel64b
  - number: 64c.1
    text: |-
      Onze Minister kan goedkeuring onthouden indien als gevolg van de fusie de daadwerkelijke variatie van het
      onderwijsaanbod binnen het voedingsgebied van de te fuseren scholen of rechtspersonen, op significante wijze wordt
      belemmerd.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel64c
  - number: 64c.2
    text: |-
      Onze Minister laat zich ten aanzien van de goedkeuring, bedoeld in het eerste lid, adviseren door een
      onafhankelijke adviescommissie, tenzij de noodzaak daartoe ontbreekt. Bij ministeriële regeling wordt bepaald
      wanneer er geen sprake is van de noodzaak bedoeld in de eerste volzin.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel64c
  - number: 64c.3
    text: Onze Minister stelt beleidsregels vast omtrent de uitoefening van de bevoegdheid, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel64c
  - number: 64d.1
    text: |-
      Onze Minister besluit binnen 13 weken op een aanvraag als bedoeld in [artikel 64b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel64b
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel64d
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 64b
        hoofdstuk: I
        afdeling: '1'
  - number: 64d.2
    text: |-
      De termijn, bedoeld in het eerste lid, kan ten hoogste met 13 weken worden verlengd. Van deze verlenging wordt,
      binnen de 13 weken bedoeld in het eerste lid, mededeling gedaan aan de aanvrager.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel64d
  - number: 64d.3
    text: |-
      Op het besluit bedoeld in het eerste lid is [paragraaf 4.1.3.3 van de Algemene wet bestuursrecht][ref1] van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel64d
    references:
      - id: ref1
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: '65.1'
    text: |-
      De gemeenteraad is bevoegd uitsluitend in het belang van een doelmatige spreiding van de leerlingen over de
      openbare scholen, het grondgebied van de gemeente in schoolwijken te verdelen.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel65
  - number: '65.2'
    text: |-
      Een besluit als bedoeld in het eerste lid, geldt voor ten minste 3 schooljaren, met dien verstande dat tussentijdse
      wijziging mogelijk is in geval van veranderingen in het scholenbestand. Burgemeester en wethouders zenden binnen 4
      weken nadat het besluit is genomen afschrift daarvan aan gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel65
  - number: '65.3'
    text: |-
      De toelating tot een openbare school geschiedt in overeenstemming met de vastgestelde schoolwijken, tenzij de
      ouders van een leerling schriftelijk aan het bevoegd gezag te kennen geven toelating tot een school in een andere
      schoolwijk te wensen.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel65
  - number: '66'
    text: |-
      Vertegenwoordigers van het basisonderwijs en het speciaal onderwijs kunnen ten behoeve van de scholen en
      instellingen die zij vertegenwoordigen een overlegorgaan oprichten met het doel de samenwerking tussen die scholen
      en instellingen te bevorderen ten aanzien van de toelating van leerlingen en de inrichting van het onderwijs.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel66
  - number: '67'
    text: |-
      Met betrekking tot het basisonderwijs en het aansluitend voortgezet onderwijs is [artikel 66][ref1] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel66
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '66'
        hoofdstuk: I
        afdeling: '2'
  - number: '68.1'
    text: Op het personeel van een rechtspersoon met volledige rechtsbevoegdheid die
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel68
  - number: 68.1.a
    text: |-
      uitsluitend wordt bestuurd door een bevoegd gezag al dan niet met een of meer andere bevoegde gezagsorganen als
      bedoeld in deze wet, de [Wet op de expertisecentra][ref1] of de [Wet op het voortgezet onderwijs][ref2],


      [ref1]: https://wetten.overheid.nl/BWBR0003549
      [ref2]: https://wetten.overheid.nl/BWBR0002399
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0003549
      - id: ref2
        bwb_id: BWBR0002399
  - number: 68.1.b
    text: |-
      zich blijkens de statuten dan wel de gemeenschappelijke regeling, bedoeld in de
      [Wet gemeenschappelijke regelingen][ref1], uitsluitend ten doel stelt om ten behoeve van scholen en andere
      onderwijsinstellingen die uit 's Rijks kas worden bekostigd, werkzaamheden te verrichten ter verzekering van
      de goede gang van het onderwijs met uitzondering van het leiden van de school, het geven van onderwijs en het
      verrichten van werkzaamheden op het terrein van de schoolbegeleiding,


      [ref1]: https://wetten.overheid.nl/BWBR0003740
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0003740
  - number: 68.1.c
    text: niet het maken van winst beoogt,
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel68
  - number: 68.1.d
    text: wordt gefinancierd met behulp van bijdragen van de bevoegde gezagsorganen waarvoor diensten worden verricht, en
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel68
  - number: 68.1.e
    text: Onze Minister heeft medegedeeld als rechtspersoon in de zin van dit artikel werkzaam te willen zijn,
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel68
  - number: '68.2'
    text: |-
      Onder bevoegd gezag en bevoegde gezagsorganen in het eerste lid onderdeel a wordt mede verstaan burgemeester en
      wethouders.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel68
  - number: '68.4'
    text: |-
      De in het eerste lid onder a bedoelde bevoegde gezagsorganen delen Onze Minister mede dat zij het bestuur vormen
      van een rechtspersoon in de zin van dit artikel. Voorts verschaffen zij Onze Minister en de door hem aangewezen
      personen desgevraagd alle inlichtingen omtrent de rechtspersoon en zijn activiteiten. De in het eerste lid
      onder a bedoelde bevoegde gezagsorganen kunnen Onze Minister mededelen dat zij erin toestemmen dat de gevraagde
      inlichtingen rechtstreeks door het bestuur van de rechtspersoon zelf aan Onze Minister en de door hem aangewezen
      personen worden verschaft.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel68
  - number: '68.5'
    text: |-
      Burgemeester en wethouders en het bevoegd gezag dat deel uitmaakt van het bestuur van de rechtspersoon, zijn
      verplicht op de naleving van de in de voorgaande leden genoemde voorschriften toe te zien.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel68
  - number: '68.6'
    text: |-
      [Artikel 38][ref1] is van overeenkomstige toepassing ten aanzien van het personeel van de rechtspersoon.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel38
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '38'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: '1'
  - number: '69.1'
    text: |-
      De openbare en de bijzondere scholen worden door het Rijk bekostigd volgens de bepalingen van deze titel met
      uitzondering van afdeling 3. Geen bekostiging vindt plaats indien groepen van leerlingen van verschillende scholen
      al dan niet van hetzelfde bevoegd gezag gezamenlijk onderwijs ontvangen. De bedragen die de gemeente krachtens deze
      wet in aanvulling op de rijksbekostiging verstrekt blijven ten laste van de gemeente.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel69
  - number: '69.2'
    text: |-
      Bij algemene maatregel van bestuur worden nadere voorschriften gegeven ter uitvoering van het eerste lid. Deze
      algemene maatregel van bestuur bevat in elk geval een regeling omtrent de termijnen binnen welke besluiten moeten
      worden genomen.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel69
  - number: '69.3'
    text: 'De algemene maatregel van bestuur bedoeld in het tweede lid, bevat tevens:'
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel69
  - number: 69.3.a
    text: |-
      een regeling omtrent de betaling van de bedragen van de bekostiging voor de materiële voorzieningen ten behoeve van
      de instandhouding voortvloeiende uit het gebruik door een school van voorzieningen die voor meer dan een school of
      voor andere doeleinden zijn bestemd;
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel69
  - number: 69.3.b
    text: |-
      een financiële regeling tussen het Rijk en de bevoegde gezagsorganen die personeel in dienst hebben dat niet door
      het Rijk wordt bekostigd ter zake van een korting op de bekostiging ter compensatie van de kosten van de voor dat
      personeel geldende rechtspositionele voorzieningen, voor zover deze ten laste van 's Rijks kas komen.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel69
  - number: '69.4'
    text: |-
      De algemene maatregel van bestuur bedoeld in het tweede lid, wordt aan de Tweede Kamer der Staten-Generaal
      overgelegd. De maatregel treedt niet in werking dan nadat 4 weken na de overlegging zijn verstreken en gedurende
      die termijn niet door of namens de Kamer de wens wordt te kennen gegeven dat het in die maatregel geregelde
      onderwerp bij de wet wordt geregeld. Alsdan wordt een daartoe strekkend wetsontwerp zo spoedig mogelijk ingediend.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel69
  - number: '69.5'
    text: |-
      [Artikel 4:32 van de Algemene wet bestuursrecht][ref1] is niet van toepassing op de bekostiging van scholen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 69a
    text: |-
      De op 31 juli 1998 uit de openbare kassen bekostigde scholen, uitgaande van de Stichting Muziekinstituut van de
      Kathedraal St. Bavo te Haarlem, onderscheidenlijk van de Stichting Nederlands Instituut voor Katholieke Kerkmuziek
      te Utrecht, ten behoeve waarvan op grond van artikel 3, tweede lid, van de Lager-onderwijswet 1920 vergunning is
      verleend dat deze scholen minder dan 6 achtereenvolgende leerjaren omvatten, worden bekostigd als basisscholen,
      waarbij:
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel69a
  - number: 69a.a
    text: |-
      op deze scholen de bepalingen van deze wet waar mogelijk van overeenkomstige toepassing zijn, met dien verstande
      dat het onderwijs is bestemd voor kinderen vanaf de leeftijd van omstreeks acht jaar; en
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel69a
  - number: 69a.b
    text: |-
      voor deze scholen voor de toepassing van [artikel 153, eerste lid][ref1], als opheffingsnorm het getal 45 geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel153
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel69a
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '153'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '9'
  - number: '70'
    text: |-
      Onze Minister kan onder nader te stellen voorwaarden aanvullende middelen ter beschikking stellen die niet strekken
      tot bekostiging van het onderwijs, bedoeld in deze wet, en de schoolbegeleiding ten behoeve daarvan, maar die
      direct of indirect dienstig zijn voor de uitvoering van het onderwijs of voor verhoging van de mogelijkheid tot
      deelname aan het onderwijs. Bij de toepassing van dit artikel zijn de [artikelen 4][ref1], [5][ref2], [9][ref3]
      en [10 van de Wet overige OCW-subsidies][ref4] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009458#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0009458#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0009458#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0009458#Artikel10
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0009458
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0009458
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0009458
        artikel: '9'
      - id: ref4
        bwb_id: BWBR0009458
        artikel: '10'
  - number: '72.1'
    text: |-
      Voor de toepassing van deze titel zijn de voorschriften die betrekking hebben op bijzondere scholen, van
      overeenkomstige toepassing op openbare scholen die in stand worden gehouden door een stichting als bedoeld in
      [artikel 48][ref1] of een openbare rechtspersoon als bedoeld in [artikel 47][ref2], tenzij het tegendeel blijkt.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel47
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '48'
        hoofdstuk: I
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '47'
        hoofdstuk: I
        afdeling: '2'
  - number: '72.2'
    text: |-
      Indien een openbare school in stand wordt gehouden door een stichting of een openbare rechtspersoon, wordt deze
      aangemerkt als een door de gemeente in stand gehouden openbare school voor de toepassing van afdeling 2 en afdeling
      9.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel72
  - number: '73'
    text: 'In deze paragraaf wordt onder «school» verstaan: basisschool.'
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel73
  - number: '74.1'
    text: |-
      Het bevoegd gezag dient bij Onze Minister een aanvraag in voor bekostiging van een openbare en een bijzondere
      school. Deze aanvraag vermeldt of het openbaar of bijzonder onderwijs betreft en wat de beoogde plaats van
      vestiging van de school is.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel74
  - number: '74.2'
    text: 'De aanvraag gaat vergezeld van:'
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel74
  - number: 74.2.a
    text: |-
      een belangstellingsmeting als bedoeld in [artikel 74a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel74a
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 74a
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '2'
  - number: 74.2.b
    text: |-
      een beschrijving van het voorgenomen beleid ten aanzien van de kwaliteit van het onderwijs dat binnen de school zal
      worden gevoerd, voor zover dit betreft de uitwerking van de wettelijke voorschriften voor:
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel74
  - number: 74.2.b.1
    text: |-
      de inhoud van het onderwijs, bedoeld in [artikel 8, derde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel8
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '8'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '1'
  - number: 74.2.b.2
    text: |-
      leerlingen die extra ondersteuning behoeven, bedoeld in [artikel 8, vierde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel8
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '8'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '1'
  - number: 74.2.b.3
    text: |-
      de inrichting van het onderwijs, bedoeld in [artikel 8, eerste lid][ref1] en een leerling- en onderwijsvolgsysteem
      als bedoeld in [artikel 8, zesde tot en met achtste lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel8
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '8'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '8'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '1'
  - number: 74.2.b.4
    text: |-
      de inrichting van het onderwijs, bedoeld in [artikel 8, negende lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel8
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '8'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '1'
  - number: 74.2.b.5
    text: |-
      de inhoud van het onderwijs, die dekkend zal zijn voor de kerndoelen, bedoeld in [artikel 9][ref1], en de
      referentieniveaus, bedoeld in [artikel 2 van de Wet referentieniveaus Nederlandse taal en rekenen;][ref2] en


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0027679#Artikel2
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '9'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0027679
        artikel: '2'
  - number: 74.2.b.6
    text: |-
      de scheiding tussen de functies van bestuur en het toezicht daarop, bedoeld in [artikel 17a][ref1] en [17b][ref2]
      en, indien toepassing wordt gegeven aan [artikel 30a][ref3], een beschrijving van de over te dragen taken;


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel17a
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel17b
      [ref3]: https://wetten.overheid.nl/BWBR0003420#Artikel30a
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 17a
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: 17b
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0003420
        artikel: 30a
        hoofdstuk: I
        paragraaf: '3'
        afdeling: '1'
  - number: 74.2.c
    text: |-
      een document waaruit blijkt dat de gemeente van de beoogde plaats van vestiging van de school, het
      samenwerkingsverband en de bevoegde gezagsorganen van de scholen en vestigingen binnen het voedingsgebied van de
      school zijn gevraagd om te overleggen over het voornemen tot het doen van een aanvraag om bekostiging; en
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel74
  - number: 74.2.d
    text: |-
      een verklaring omtrent het gedrag afgegeven volgens de [Wet justitiële en strafvorderlijke gegevens][ref1], die
      op het tijdstip van het doen van de aanvraag niet ouder is dan zes maanden, van de personen die het bestuur en het
      intern toezicht vormen.


      [ref1]: https://wetten.overheid.nl/BWBR0014194
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0014194
  - number: '74.3'
    text: 'De aanvraag bevat tevens:'
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel74
  - number: 74.3.a
    text: een beschrijving van het beleid met betrekking tot de bewaking en verbetering van de kwaliteit van het onderwijs;
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel74
  - number: 74.3.b
    text: een beschrijving van de beoogde samenstelling van de formatie van de school;
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel74
  - number: 74.3.c
    text: |-
      een beschrijving van de wijze waarop invulling wordt gegeven aan de voorschriften die worden gesteld aan de
      bekwaamheid van leraren en degenen die onderwijsondersteunende of leidinggevende werkzaamheden verrichten;
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel74
  - number: 74.3.d
    text: |-
      een beschrijving van de wijze waarop invulling wordt gegeven aan de zorg voor de sociale, psychische en fysieke
      veiligheid van leerlingen op school;
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel74
  - number: 74.3.e
    text: |-
      een meerjarenbegroting over de eerste drie schooljaren gebaseerd op de bekostiging die de school zal ontvangen
      gegeven het aantal te verwachten leerlingen in die periode;
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel74
  - number: 74.3.f
    text: de verwachtingen met betrekking tot de huisvesting en de samenwerking met de kinderopvang;
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel74
  - number: 74.3.g
    text: |-
      informatie over de hoogte van en het beleid ten aanzien van de vrijwillige geldelijke bijdrage die van de ouders
      zal worden gevraagd en het jaarlijks verwachte totaalbedrag van die bijdragen;
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel74
  - number: 74.3.h
    text: |-
      informatie over de wijze waarop het bevoegd gezag uitvoering zal geven aan de afspraken, bedoeld in
      [artikel 167][ref1] en [artikel 167a][ref2]; en


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel167
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel167a
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '167'
        hoofdstuk: I
        afdeling: '10'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: 167a
        hoofdstuk: I
        afdeling: '10'
  - number: 74.3.i
    text: |-
      een beschrijving van de wijze waarop uitvoering wordt gegeven aan de [Wet medezeggenschap op scholen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020685
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0020685
  - number: '74.4'
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld aan de wijze waarop de aanvraag plaatsvindt en kan een model
      voor de aanvraag worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel74
  - number: 74a.1
    text: |-
      De belangstellingsmeting, bedoeld in [artikel 74, tweede lid, onderdeel a][ref1], wordt uitgevoerd aan de hand van
      hetzij ouderverklaringen dan wel, in bij ministeriële regeling te bepalen gevallen, een marktonderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel74
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel74a
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '74'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '2'
  - number: 74a.2
    text: 'De belangstellingsmeting:'
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel74a
  - number: 74a.2.a
    text: |-
      geeft inzicht in het te verwachten aantal leerlingen op 1 januari van het elfde jaar na de indiening van de
      aanvraag, bedoeld in [artikel 74, eerste lid][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel74
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel74a
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '74'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '2'
  - number: 74a.2.b
    text: |-
      vindt plaats binnen het voedingsgebied dat een gebied omvat dat bestaat uit viercijferige postcodegebieden die
      geheel of gedeeltelijk zijn gelegen binnen een straal van zes kilometer van de beoogde plaats van vestiging van
      de school.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel74a
  - number: 74a.3
    text: |-
      Het te verwachten aantal leerlingen, bedoeld in het tweede lid, onderdeel a, wordt berekend overeenkomstig de
      formule q = (y/x *100%) * w * z, waarbij:
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel74a
  - number: 74a.3.a
    text: |-
      in het geval van keuze voor de ouderverklaring geldt: y = aantal kinderen in de leeftijd van 2 tot en met 4 jaar
      van wie in de ouderverklaring is aangegeven belangstelling te hebben voor de school in de aanvraag; x = totaal
      aantal kinderen in de leeftijd van 2 tot en met 4 jaar op 1 januari van het kalenderjaar waarin de aanvraag wordt
      gedaan, in het voedingsgebied, bedoeld in het tweede lid, onder b; w = het totaal aantal kinderen in de leeftijd
      van 4 tot en met 11 jaar, vermeerderd met 30 procent van het aantal kinderen in de leeftijd van 12 jaar in het
      voedingsgebied, bedoeld in het tweede lid onder b, op 1 januari van het elfde jaar na de indiening van de aanvraag,
      gebaseerd op gegevens onder meer verstrekt door het Centraal Bureau voor de Statistiek; z = een bij ministeriële
      regeling te bepalen correctiefactor;
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel74a
  - number: 74a.3.b
    text: |-
      in het geval van keuze voor het marktonderzoek geldt: y = aantal kinderen in de leeftijd van 2 tot en met 4 jaar
      ten aanzien van wie in het marktonderzoek is aangegeven dat er belangstelling is voor de school in de aanvraag;
      x = totaal aantal kinderen in de leeftijd van 2 tot en met 4 jaar ten aanzien van wie in het marktonderzoek is
      deelgenomen; w = het totaal aantal kinderen in de leeftijd van 4 tot en met 11 jaar vermeerderd met 30 procent
      van het aantal kinderen in de leeftijd van 12 jaar in het voedingsgebied, bedoeld in het tweede lid onder b, op
      1 januari van het elfde jaar na de indiening van de aanvraag, gebaseerd op gegevens onder meer verstrekt door het
      Centraal Bureau voor de Statistiek; z = een bij ministeriële regeling te bepalen correctiefactor.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel74a
  - number: 74a.4
    text: |-
      De ouderverklaring, bedoeld in het eerste lid, heeft betrekking op één kind in de leeftijd van 2 tot en met 4
      jaar op 1 november van het kalenderjaar waarin de aanvraag wordt gedaan en wordt ingediend door de ouder van deze
      leerling.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel74a
  - number: 74a.5
    text: 'Het marktonderzoek, bedoeld in het eerste lid:'
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel74a
  - number: 74a.5.a
    text: heeft betrekking op kinderen in de leeftijd van 2 tot en met 4 jaar;
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel74a
  - number: 74a.5.b
    text: |-
      wordt afgenomen onder de ouders van kinderen, bedoeld in onderdeel a, op een wetenschappelijk verantwoorde manier
      door een onafhankelijk onderzoeksbureau dat aantoonbaar werkt volgens een door een brancheorganisatie opgestelde
      gedragscode met betrekking tot de uitvoering van marktonderzoek;
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel74a
  - number: 74a.5.c
    text: |-
      wordt uitgevoerd aan de hand van een aselecte steekproef uit de kinderen, bedoeld in onderdeel a, die aantoonbaar
      representatief is voor die kinderen; en
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel74a
  - number: 74a.5.d
    text: mag niet ouder zijn dan 24 maanden voorafgaand aan de uiterste indieningsdatum van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel74a
  - number: 74a.6
    text: |-
      Indien uit de belangstellingsmeting van meer dan één aanvraag blijkt dat de betrokken postcodegebieden, bedoeld
      in het tweede lid, onderdeel b, elkaar overlappen en daardoor de som van de kinderen voor wie belangstelling
      is aangetoond in het overlappende voedingsgebied groter is dan het totaal aantal kinderen in het overlappende
      voedingsgebied, worden de aantallen van de kinderen voor wie belangstelling is aangetoond in het overlappende
      voedingsgebied naar evenredigheid verminderd tot de som van het totaal kinderen in het overlappende voedingsgebied
      voor wie belangstelling is aangetoond gelijk is aan het totaal aantal kinderen in het overlappende voedingsgebied.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel74a
  - number: 74a.7
    text: 'Bij ministeriële regeling kunnen nadere regels worden gesteld aan de uitvoering van de belangstellingsmeting over:'
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel74a
  - number: 74a.7.a
    text: de wijze waarop de belangstellingsmeting wordt uitgevoerd; en
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel74a
  - number: 74a.7.b
    text: |-
      de omvang van het marktonderzoek in relatie tot de minimale verhoudingen tussen de verschillende onderdelen van de
      formule voor de belangstellingsmeting, bedoeld in het derde lid, onderdeel b.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel74a
  - number: '75.1'
    text: |-
      De aanvraag, bedoeld in [artikel 74, eerste lid][ref1], wordt ingediend voor 1 november. De inspectie adviseert
      Onze Minister of de aanvraag voldoet aan de verplichtingen, bedoeld in artikel 74, tweede lid, onderdeel b.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel74
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '74'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '2'
  - number: '75.2'
    text: |-
      Indien het bevoegd gezag het voornemen heeft om een aanvraag, bedoeld in het eerste lid, in te dienen, meldt het
      bevoegd gezag dit aan Onze Minister voor 1 juli voorafgaand aan die voorgenomen aanvraag. Bij ministeriële regeling
      kunnen nadere regels worden gesteld aan de wijze waarop deze melding plaatsvindt en kan een model voor de melding
      worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel75
  - number: '75.3'
    text: |-
      Onze Minister controleert of de belangstellingsmeting, bedoeld in [artikel 74, tweede lid, onderdeel a][ref1],
      juist en volledig is en besluit op basis van de aanvraag, bedoeld in artikel 74, eerste en tweede lid, en de voor
      de school geldende stichtingsnorm, bedoeld in [artikel 76, eerste lid][ref2], voor 1 juni of de school met ingang
      van 1 augustus van het kalenderjaar volgend op het besluit van Onze Minister voor bekostiging in aanmerking wordt
      gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel74
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel76
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '74'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '76'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '2'
  - number: '75.4'
    text: |-
      Onverminderd [artikel 4:35 van de Algemene wet bestuursrecht][ref1] kan Onze Minister de aanvraag,
      bedoeld in [artikel 74, eerste lid][ref2], afwijzen indien deze is ingediend door een rechtspersoon, niet
      zijnde een gemeente, die voorafgaande aan de aanvraag een of meer scholen in stand heeft gehouden waarop
      [artikel 164b, eerste lid][ref3], van toepassing is geweest of waarvan een of meer van de bestuurders of
      toezichthouders deel uitmaakte of uitmaakt van een andere rechtspersoon die een dergelijke school in stand heeft
      gehouden, welke toepassing onherroepelijk is geworden en ten tijde van de aanvraag nog geen vijf jaren oud is
      gerekend vanaf de ontvangst van het besluit tot toepassing van artikel 164b, eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel74
      [ref3]: https://wetten.overheid.nl/BWBR0003420#Artikel164b
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '74'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0003420
        artikel: 164b
        hoofdstuk: I
        paragraaf: '3'
        afdeling: '9'
  - number: '75.5'
    text: |-
      Onverminderd [artikel 4:35 van de Algemene wet bestuursrecht][ref1] kan Onze Minister de aanvraag, bedoeld in
      [artikel 74, eerste lid][ref2], afwijzen indien de aanvraag is ingediend door een rechtspersoon, niet zijnde
      een gemeente, die reeds een of meer scholen in stand houdt en die een aanwijzing heeft ontvangen als bedoeld in
      [artikel 163b, eerste lid][ref3], of waarvan een of meer van de bestuurders of toezichthouders deel uitmaakte of
      uitmaakt van een andere rechtspersoon die een dergelijke aanwijzing heeft ontvangen welke aanwijzing onherroepelijk
      is geworden en ten tijde van de aanvraag nog geen vijf jaren oud is gerekend vanaf de ontvangst van het besluit tot
      toepassing van artikel 163b, eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel74
      [ref3]: https://wetten.overheid.nl/BWBR0003420#Artikel163b
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '74'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0003420
        artikel: 163b
        hoofdstuk: I
        paragraaf: '3'
        afdeling: '9'
  - number: '75.6'
    text: |-
      De bekostiging vangt aan op 1 augustus. De aanspraak op bekostiging vervalt indien uiterlijk op de eerste schooldag
      na 1 augustus in het tweede kalenderjaar na het besluit van Onze Minister geen onderwijs aan de nieuwe school wordt
      gegeven. Indien door het bevoegd gezag een verzoek tot bekostiging is gedaan met ingang van 1 augustus van het
      eerste kalenderjaar na het besluit van Onze Minister vervalt de aanspraak op bekostiging voor dat schooljaar indien
      op de eerste schooldag geen onderwijs wordt gegeven.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel75
  - number: '75.7'
    text: |-
      In afwijking van het zesde lid en op aanvraag van het bevoegd gezag of de gemeente van de beoogde plaats van
      vestiging van de school kan Onze Minister besluiten in bijzondere gevallen de aanspraak op bekostiging voor een
      jaar te handhaven.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel75
  - number: '75.8'
    text: |-
      Dit artikel is niet van toepassing bij omzetting van een bekostigde bijzondere school in een bekostigde openbare
      school of omgekeerd en bij de totstandkoming van een samenwerkingsschool.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel75
  - number: '75.9'
    text: |-
      Voor uitsluitend de controle of de gegevens uit de ouderverklaringen, bedoeld in [artikel 74a, vierde lid][ref1],
      juist en volledig zijn, maakt Onze Minister gebruik van het burgerservicenummer, bedoeld in
      [artikel 1, onderdeel b, van de Wet algemene bepalingen burgerservicenummer][ref2], van een van de ouders en het
      kind waarop de ouderverklaring betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel74a
      [ref2]: https://wetten.overheid.nl/BWBR0022428#Artikel1
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 74a
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0022428
        artikel: '1'
  - number: '75.10'
    text: |-
      Onverminderd [artikel 3:41 van de Algemene wet bestuursrecht][ref1] wordt van de besluiten, bedoeld in het derde,
      vierde en vijfde lid, mededeling gedaan in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '75.11'
    text: |-
      Onze Minister stelt op voordracht van de inspectie een kader vast waarin de werkwijze voor het advies, bedoeld in
      het eerste lid, is vastgelegd. Deze werkwijze omvat in ieder geval een gesprek over de aanvraag met het bevoegd
      gezag dat de aanvraag heeft ingediend. Dit kader wordt bekendgemaakt in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel75
  - number: '75.12'
    text: |-
      Burgemeester en wethouders van de beoogde plaats van vestiging van de school kunnen voor de datum, genoemd in het
      eerste lid, bij Onze Minister een zienswijze naar voren brengen.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel75
  - number: '76.1'
    text: |-
      Het bevoegd gezag maakt met de belangstellingsmeting, bedoeld in [artikel 74, tweede lid, onder a][ref1],
      aannemelijk dat een school op 1 januari van het elfde jaar na de indiening van de aanvraag zal worden bezocht door
      ten minste het aantal leerlingen dat overeenkomt met de voor de gemeente geldende stichtingsnorm.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel74
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '74'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '2'
  - number: '76.2'
    text: |-
      Bij ministeriële regeling wordt voor elke gemeente een stichtingsnorm vastgesteld welke 10/6 bedraagt van de voor
      de gemeente geldende opheffingsnorm berekend op grond van [artikel 154][ref1]. De uitkomst wordt afgerond, waarbij
      de decimalen worden verwaarloosd indien het eerste cijfer achter de komma kleiner is dan 5 en de decimalen worden
      verwaarloosd en het getal verhoogd met 1 indien het eerste cijfer achter de komma gelijk is aan of groter is dan 5.
      De stichtingsnorm bedraagt minimaal 200.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel154
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '154'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '9'
  - number: '76.3'
    text: |-
      De stichtingsnormen, bedoeld in het tweede lid, worden telkens voor een tijdvak van 5 jaar gelijktijdig met
      de aanpassing van de opheffingsnormen op grond van [artikel 153][ref1] bij ministeriële regeling aangepast.
      De ministeriële regeling wordt voor 1 november van het jaar voorafgaand aan het laatste jaar waarin de
      stichtingsnormen van kracht zijn, bekendgemaakt in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel153
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '153'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '9'
  - number: '76.4'
    text: |-
      In het geval van een wijziging van de gemeentelijke indeling of een grenscorrectie als bedoeld in
      [artikel 3 van de Wet algemene regels herindeling][ref1], stelt Onze Minister op de wijze als aangegeven in het
      tweede lid de nieuwe stichtingsnormen voor de betrokken gemeenten vast, voor zover deze afwijken van de op grond
      van het tweede en derde lid bepaalde stichtingsnormen. De nieuwe stichtingsnormen treden in de plaats van de op
      grond van het tweede en derde lid bepaalde stichtingsnormen en treden in werking met ingang van 1 januari volgend
      op de datum van herindeling, bedoeld in [artikel 1, onderdeel h, van de Wet algemene regels herindeling][ref2]. Tot
      en met 31 december volgend op de datum van herindeling blijven op de scholen in de gemeenten die bij de wijziging
      van de gemeentelijke indeling of de grenscorrectie zijn betrokken, de stichtingsnormen van toepassing die golden op
      de dag voorafgaande aan de datum van herindeling.


      [ref1]: https://wetten.overheid.nl/BWBR0003718#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003718#Artikel1
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0003718
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0003718
        artikel: '1'
  - number: '76.5'
    text: |-
      In het geval van een wijziging van de naam van een gemeente of een wijziging van het gemeentenummer past Onze
      Minister de ministeriële regeling, bedoeld in het tweede lid, dienovereenkomstig aan.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel76
  - number: '77.1'
    text: |-
      Indien uit schriftelijke verklaringen van ten minste 50 verschillende ouders van kinderen tot en met de leeftijd
      van 12 jaar behoefte blijkt te bestaan aan het volgen van openbaar onderwijs en dat in die behoefte niet of
      onvoldoende wordt voorzien, onderzoeken burgemeester en wethouders of uit de belangstellingsmeting, bedoeld in
      [artikel 74, tweede lid, onderdeel a][ref1], voldoende belangstelling blijkt.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel74
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '74'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '2'
  - number: '77.2'
    text: |-
      Indien uit de belangstellingsmeting voldoende belangstelling is gebleken, dienen burgemeester en wethouders een
      aanvraag als bedoeld in [artikel 74, eerste tot en met derde lid][ref1], in, met uitzondering van een document
      waaruit blijkt dat de gemeente van de beoogde plaats van vestiging van de school is gevraagd om te overleggen over
      het voornemen tot het doen van een aanvraag om bekostiging.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel74
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '74'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '2'
  - number: '77.3'
    text: |-
      Voor een openbare school wordt in elk geval door burgemeester en wethouders een aanvraag als bedoeld in
      [artikel 74][ref1] ingediend, indien binnen 10 kilometer van de plaats in de gemeente waar het onderwijs moet
      worden gegeven over de weg gemeten geen school aanwezig is waarbinnen openbaar onderwijs wordt gegeven en aan het
      volgen van openbaar onderwijs behoefte bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel74
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '74'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '2'
  - number: '77.4'
    text: |-
      Indien binnen 10 kilometer van de plaats in de gemeente waar het onderwijs moet worden gegeven over de weg gemeten
      geen school aanwezig is waar openbaar onderwijs wordt gegeven en aan het volgen van openbaar onderwijs behoefte
      bestaat, brengt Onze Minister een openbare school waarvoor een aanvraag is gedaan voor bekostiging in aanmerking,
      indien voldaan is aan de voorschriften van [artikel 74, eerste en tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel74
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '74'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '2'
  - number: '84.1'
    text: |-
      Onze Minister kan onder door hem te stellen voorwaarden voor bekostiging in aanmerking brengen een school die
      wordt omgezet van een bijzondere school in een openbare school of omgekeerd dan wel een school die tot stand komt
      als samenwerkingsschool als bedoeld in [artikel 17d, eerste lid][ref1]. Een omzetting kan slechts plaatsvinden met
      ingang van 1 augustus van enig kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel17d
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 17d
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '1'
  - number: '84.2'
    text: |-
      Indien het bevoegd gezag een school binnen een gemeente verplaatst binnen een straal van 3 kilometer van het
      huidige vestigingsadres, blijft de aanspraak op bekostiging bestaan.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel84
  - number: '84.3'
    text: |-
      Indien het bevoegd gezag een school verplaatst buiten een straal van 3 kilometer van het huidige vestigingsadres,
      zijn de [artikelen 74][ref1], [74a][ref2], [75][ref3] en [76][ref4] van overeenkomstige toepassing. Onze Minister
      kan onder door hem te stellen voorwaarden een school voor bekostiging in aanmerking blijven brengen zonder dat de
      belangstellingsmeting aannemelijk maakt dat de school op 1 januari van het elfde jaar na de verplaatsing zal worden
      bezocht door ten minste het aantal leerlingen dat overeenkomt met de voor de gemeente geldende stichtingsnorm,
      bedoeld in artikel 76, eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel74
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel74a
      [ref3]: https://wetten.overheid.nl/BWBR0003420#Artikel75
      [ref4]: https://wetten.overheid.nl/BWBR0003420#Artikel76
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '74'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: 74a
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0003420
        artikel: '75'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0003420
        artikel: '76'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '2'
  - number: 84a.1
    text: |-
      Het bevoegd gezag kan op de wijze als aangegeven in [artikel 74][ref1], met uitzondering van het tweede lid,
      onderdeel a, en [artikel 75, eerste lid, eerste volzin en tweede lid][ref2], bij Onze Minister een aanvraag
      indienen om een nevenvestiging, of een deel van een school of nevenvestiging die zich op een andere locatie bevindt
      dan de plaats van vestiging van die school, te verzelfstandigen en als school voor bekostiging in aanmerking te
      brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel74
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel75
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel84a
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '74'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '75'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '2'
  - number: 84a.2
    text: |-
      Onze Minister willigt een aanvraag in indien wordt voldaan aan voorwaarden die bij ministeriële regeling zijn
      vastgesteld. Deze voorwaarden hebben in elk geval betrekking op:
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel84a
  - number: 84a.2.a
    text: het aantal leerlingen van de school op de teldatum in het jaar dat voorafgaat aan de aanvraag;
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel84a
  - number: 84a.2.b
    text: |-
      het aantal leerlingen waarvan redelijkerwijs kan worden aangenomen dat deze de scholen die na de verzelfstandiging
      ontstaan, zal bezoeken; en
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel84a
  - number: 84a.2.c
    text: |-
      de wijze waarop op basis van de statistische gegevens, onder meer verstrekt door het Centraal Bureau voor
      de Statistiek aannemelijk wordt gemaakt dat op 1 januari van het elfde jaar na de aanvraag de school die na
      verzelfstandiging ontstaat, voldoet aan de stichtingsnorm en de bekostiging van het overblijvende deel van de
      school, met in achtneming van de [artikelen 154 tot en met 156][ref1], gedurende ten minste 10 achtereenvolgende
      jaren kan worden voortgezet.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel154
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel84a
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '154'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '9'
  - number: 84a.3
    text: |-
      [Artikel 75, eerste lid, tweede volzin, derde tot en met zevende, tiende en elfde lid][ref1], is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel75
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel84a
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '75'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '2'
  - number: '85.1'
    text: 'De bekostiging van een nevenvestiging van een school neemt een aanvang met ingang van 1 augustus indien:'
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel85
  - number: 85.1.a
    text: |-
      de nevenvestiging overeenkomstig [artikel 158][ref1] voldoet aan een der normen voor bekostiging, genoemd in
      dat artikel en, voor zover het een nevenvestiging betreft die voor bekostiging in aanmerking komt op grond van
      het eerste lid, onder e, van dat artikel, op die grond aan alle scholen van het bevoegd gezag of, bij toepassing
      van [artikel 157, derde lid][ref2], de samenwerkende bevoegde gezagsorganen, niet meer nevenvestigingen worden
      verbonden dan het verschil tussen het totale aantal leerlingen van die scholen gedeeld door 260 en het totale
      aantal leerlingen van die scholen gedeeld door 290, waarbij de quotiënten naar beneden worden afgerond op een
      geheel getal,


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel158
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel157
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '158'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '9'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '157'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '9'
  - number: 85.1.b
    text: |-
      de nevenvestiging niet wordt verbonden aan een school die met toepassing van [artikel 157][ref1] in
      stand wordt gehouden of aan een school waarvan de kwaliteit van het onderwijs zeer zwak is als bedoeld in
      [artikel 10a, eerste en vierde lid][ref2],


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel157
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel10a
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '157'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '9'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: 10a
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '1'
  - number: 85.1.c.1°
    text: |-
      de nevenvestiging, onmiddellijk voorafgaand aan het tijdstip van ingang van de bekostiging als nevenvestiging, werd
      bekostigd als zelfstandige school, of
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel85
  - number: 85.1.c.2°
    text: de nevenvestiging voor bekostiging in aanmerking kwam als nevenvestiging van de voormalige school bedoeld onder 1°,
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel85
  - number: 85.1.d
    text: |-
      ingeval het betreft een nevenvestiging van een openbare school die in stand wordt gehouden door een andere
      rechtspersoon dan de gemeente op wier grondgebied de nevenvestiging is gelegen, die gemeente bij notariële akte de
      instandhouding van de school die nevenvestiging is geworden, heeft overgedragen aan die andere rechtspersoon, en
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel85
  - number: 85.1.e
    text: |-
      van de omvorming tot nevenvestiging voor 1 februari voorafgaand aan de datum, bedoeld in de aanhef, mededeling is
      gedaan aan Onze Minister, en indien het betreft een situatie als bedoeld onder d, onder overlegging van gegevens
      waaruit blijkt dat aan het vereiste onder d is voldaan.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel85
  - number: '85.2'
    text: |-
      Bij de akte, bedoeld in het eerste lid onder d, worden tevens overgedragen de rechten die het bevoegd gezag van een
      school toekomen, ten aanzien van het gebouw en terrein, alsmede ten aanzien van de roerende zaken. In de akte wordt
      bepaald dat de rechtspersoon aan wie wordt overgedragen, het personeel in gelijke betrekkingen en onder dezelfde
      voorwaarden als vermeld in de arbeidsovereenkomst, benoemt met ingang van de datum van overdracht.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel85
  - number: '85.3'
    text: |-
      Door overdracht met inachtneming van het eerste en tweede lid, treedt de verkrijgende rechtspersoon in alle uit
      de wet voortvloeiende rechten en verplichtingen van zijn rechtsvoorganger voor zover deze zijn hoedanigheid van
      bevoegd gezag betroffen.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel85
  - number: '85.4'
    text: |-
      Onze Minister maakt voor 1 mei volgend op de mededeling, bedoeld in het eerste lid onder e, aan het bevoegd gezag
      van de beoogde nevenvestiging bekend of de nevenvestiging zal worden bekostigd.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel85
  - number: 85a.1
    text: |-
      Onze Minister kan op aanvraag van het bevoegd gezag van een basisschool een afdeling voor internationaal
      georiënteerd basisonderwijs aan die school en in die gemeente voor bekostiging in aanmerking brengen. Een
      aanvraag als bedoeld in de eerste volzin moet voor 1 oktober van het jaar voorafgaand aan het schooljaar waarin
      de bekostiging van de afdeling wordt verzocht, worden ingediend bij Onze Minister. Onze Minister besluit voor
      1 januari daaropvolgend.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel85a
  - number: 85a.2
    text: |-
      Onze Minister willigt de aanvraag slechts in, indien de aanvraag vergezeld gaat van een prognose die is gebaseerd
      op statistische gegevens, op basis waarvan het te verwachten aantal leerlingen op de afdeling binnen 5 schooljaren
      ten minste 80 bedraagt en de afdeling past binnen een evenwichtig landelijk gespreid geheel van basisscholen met
      een afdeling voor internationaal georiënteerd basisonderwijs.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel85a
  - number: 85a.3
    text: |-
      Bij de berekening van het aantal leerlingen dat de afdeling, bedoeld in het eerste lid, zal bezoeken worden
      leerlingen die wonen binnen een redelijke afstand van een basisschool met een afdeling voor internationaal
      georiënteerd basisonderwijs en voor wie op die afdeling plaatsruimte aanwezig is, niet meegeteld.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel85a
  - number: 85a.4
    text: |-
      Bij ministeriële regeling kan een model worden vastgesteld voor de berekening van de prognose, bedoeld in het
      tweede lid, en de wijze van indiening ervan.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel85a
  - number: 85b.1
    text: |-
      De afdelingen voor internationaal georiënteerd basisonderwijs die op 31 juli 2014 door Onze Minister werden
      bekostigd, worden aangemerkt als afdelingen, bedoeld in [artikel 85a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel85a
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel85b
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 85a
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '2'
  - number: 85b.2
    text: |-
      [Artikel 40, vijfde lid][ref1], is niet van toepassing ten aanzien van de leerlingen die op 31 juli 2014 onderwijs
      volgden op een afdeling als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel40
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel85b
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '40'
        hoofdstuk: I
        paragraaf: '4'
        afdeling: '1'
  - number: '86'
    text: 'In deze paragraaf wordt onder «school» verstaan: speciale school voor basisonderwijs.'
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel86
  - number: '87.1'
    text: |-
      Onze Minister kan een school op aanvraag van het bevoegd gezag van de school voor bekostiging in aanmerking
      brengen. Onze Minister willigt de aanvraag slechts in, indien
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel87
  - number: 87.1.a
    text: de bevoegde gezagsorganen van alle basisscholen in het samenwerkingsverband met de aanvraag instemmen,
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel87
  - number: 87.1.b
    text: |-
      het samenwerkingsverband meer dan de helft van de basisscholen omvat in een nieuwe woningbouwlocatie van ten minste
      15 000 woningen of in aan elkaar grenzende woningbouwlocaties waar binnen 10 jaar in totaal ten minste 15 000
      woningen worden gebouwd, en
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel87
  - number: 87.1.c
    text: het samenwerkingsverband nog niet over een speciale school voor basisonderwijs beschikt.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel87
  - number: '87.2'
    text: De bekostiging kan slechts aanvangen met ingang van 1 augustus van een schooljaar.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel87
  - number: '88.1'
    text: |-
      Onze Minister kan onder door hem te stellen voorwaarden voor bekostiging in aanmerking brengen een school die wordt
      omgezet van een openbare in een bijzondere school of omgekeerd, waaraan de richting van het onderwijs verandert,
      waaraan het onderwijs wordt uitgebreid met onderwijs van een of meer andere richtingen, of die tot stand komt als
      samenwerkingsschool.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel88
  - number: '88.2'
    text: |-
      Onze Minister kan besluiten toe te staan dat een bekostigde school een andere plaats van vestiging krijgt. Onze
      Minister kan aan zijn toestemming voorwaarden verbinden.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel88
  - number: '88.3'
    text: Een aanvraag van een besluit als bedoeld in het eerste of tweede lid is met redenen omkleed en gaat vergezeld van
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel88
  - number: 88.3.a
    text: |-
      een opgave van het samenwerkingsverband of de samenwerkingsverbanden waaraan de school deelneemt en zal gaan
      deelnemen,
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel88
  - number: 88.3.b
    text: de voorgestelde datum van ingang van de bekostiging,
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel88
  - number: 88.3.c
    text: |-
      indien het betreft een aanvraag van een besluit als bedoeld in het eerste lid, het openbaar onderwijs of de
      richting of richtingen van het bijzonder onderwijs dat de school voor en na de omzetting, wijziging van richting,
      uitbreiding met een of meer andere richtingen of totstandkoming van een samenwerkingsschool omvat, en
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel88
  - number: 88.3.d
    text: |-
      indien het betreft een aanvraag van een besluit als bedoeld in het tweede lid, de aanduiding van de plaats in de
      gemeente waar het onderwijs moet worden gegeven.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel88
  - number: '88.4'
    text: |-
      Onze Minister willigt de aanvraag van een besluit als bedoeld in het tweede lid slechts in, ingeval binnen het
      betrokken samenwerkingsverband of de betrokken samenwerkingsverbanden sprake blijft van een goede bereikbaarheid
      van speciale scholen voor basisonderwijs.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel88
  - number: '88.5'
    text: |-
      [Artikel 17d, tweede lid][ref1], is niet van toepassing bij de totstandkoming van een samenwerkingsschool.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel17d
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel88
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 17d
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '1'
  - number: '89.1'
    text: 'De bekostiging van een nevenvestiging van een school neemt een aanvang met ingang van 1 augustus indien:'
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel89
  - number: 89.1.a.1°
    text: |-
      de nevenvestiging, onmiddellijk voorafgaand aan het tijdstip van ingang van de bekostiging als nevenvestiging,
      bekostigd werd als een zelfstandige school, of
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel89
  - number: 89.1.a.2°
    text: de nevenvestiging voor bekostiging in aanmerking kwam als nevenvestiging van de voormalige school bedoeld onder 1°,
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel89
  - number: 89.1.b
    text: |-
      ingeval het betreft een nevenvestiging van een openbare school die in stand wordt gehouden door een andere
      rechtspersoon dan de gemeente op wier grondgebied de nevenvestiging is gelegen, die gemeente bij notariële akte de
      instandhouding van de school die nevenvestiging is geworden, heeft overgedragen aan die andere rechtspersoon, en
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel89
  - number: 89.1.c
    text: |-
      van de omvorming tot nevenvestiging voor 1 februari voorafgaand aan de datum, bedoeld in de aanhef, mededeling is
      gedaan aan Onze Minister, en indien het betreft een situatie als bedoeld onder b, onder overlegging van de gegevens
      waaruit blijkt dat aan het vereiste onder b is voldaan.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel89
  - number: '89.2'
    text: |-
      Bij de akte, bedoeld in het eerste lid onder b, worden tevens overgedragen de rechten die het bevoegd gezag van een
      school toekomen ten aanzien van het gebouw en terrein, alsmede ten aanzien van de roerende zaken. In de akte wordt
      bepaald dat de rechtspersoon aan wie wordt overgedragen, het personeel in gelijke betrekkingen en onder dezelfde
      voorwaarden als vermeld in de arbeidsovereenkomst, benoemt met ingang van de datum van overdracht.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel89
  - number: '89.3'
    text: |-
      Door overdracht met inachtneming van het eerste en tweede lid, treedt de verkrijgende rechtspersoon in alle uit
      de wet voortvloeiende rechten en verplichtingen van zijn rechtsvoorganger voor zover deze zijn hoedanigheid van
      bevoegd gezag betroffen.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel89
  - number: '89.4'
    text: |-
      Onze Minister maakt voor 1 mei volgend op de mededeling, bedoeld in het eerste lid onder c, aan het bevoegd gezag
      van de beoogde nevenvestiging bekend of de nevenvestiging zal worden bekostigd.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel89
  - number: '90.1'
    text: Bij algemene maatregel van bestuur kunnen nadere voorschriften worden gegeven voor de uitvoering van deze afdeling.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel90
  - number: '90.2'
    text: |-
      Een ontwerp van een algemene maatregel van bestuur als bedoeld in het eerste lid wordt geplaatst in de
      Staatscourant. De algemene maatregel van bestuur treedt niet in werking dan nadat 4 weken na de plaatsing zijn
      verstreken.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel90
  - number: '91.1'
    text: |-
      De gemeenteraad draagt onderscheidenlijk burgemeester en wethouders dragen ten behoeve van de door de gemeente
      in stand gehouden scholen en ten behoeve van de niet door de gemeente in stand gehouden scholen zorg voor de
      voorzieningen in de huisvesting op het grondgebied van de gemeente overeenkomstig het bepaalde in deze afdeling.
      Hij behandelt onderscheidenlijk zij behandelen daarbij de door de gemeente in stand gehouden scholen en de niet
      door de gemeente in stand gehouden scholen op gelijke voet.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel91
  - number: '91.2'
    text: |-
      Voor de toepassing van deze afdeling wordt onder een niet door de gemeente in stand gehouden school mede begrepen
      een op het grondgebied van de gemeente gelegen nevenvestiging van een school waarvan de hoofdvestiging op het
      grondgebied van een andere gemeente is gelegen.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel91
  - number: '92.1'
    text: 'Voor de toepassing van deze afdeling worden onder voorzieningen in de huisvesting begrepen:'
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel92
  - number: 92.1.a
    text: 'voor blijvend onderscheidenlijk voor tijdelijk gebruik bestemde voorzieningen, bestaande uit:'
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel92
  - number: 92.1.a.1°
    text: |-
      nieuwbouw, een bestaand gebouw of een gedeelte daarvan, verplaatsing van een bestaand gebouw of van een gedeelte
      daarvan, terreinen, alsmede eerste aanschaf van onderwijsleerpakketten en meubilair,
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel92
  - number: 92.1.a.2°
    text: uitbreiding van de onder 1° bedoelde voorzieningen, en
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel92
  - number: 92.1.a.3°
    text: medegebruik van een ruimte die geschikt is voor het onderwijs;
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel92
  - number: 92.1.b
    text: |-
      herstel van constructiefouten aan het gebouw, alsmede herstel en vervanging in verband met schade aan gebouw,
      onderwijsleerpakketten en meubilair in geval van bijzondere omstandigheden.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel92
  - number: '92.2'
    text: |-
      Bij algemene maatregel van bestuur worden bruto vloeroppervlakten per gelijktijdig aanwezige leerling
      voorgeschreven die voorzieningen in de huisvesting ten minste dienen te bevatten. Deze oppervlakten kunnen per
      schoolsoort verschillend worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel92
  - number: '93.1'
    text: |-
      Burgemeester en wethouders stellen jaarlijks ten behoeve van het eerstvolgende jaar voor een door hen te bepalen
      tijdstip een bekostigingsplafond vast voor de bekostiging van de voorzieningen in de huisvesting voor:
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel93
  - number: 93.1.a
    text: scholen,
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel93
  - number: 93.1.b
    text: |-
      scholen voor speciaal onderwijs, scholen voor voortgezet speciaal onderwijs, scholen voor speciaal en voortgezet
      speciaal onderwijs dan wel instellingen voor speciaal en voortgezet speciaal onderwijs, en
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel93
  - number: 93.1.c
    text: |-
      scholen voor voorbereidend wetenschappelijk onderwijs, voor hoger en middelbaar algemeen voortgezet onderwijs, voor
      voorbereidend beroepsonderwijs en voor praktijkonderwijs.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel93
  - number: '93.2'
    text: |-
      Het bekostigingsplafond wordt zodanig vastgesteld dat redelijkerwijs kan worden voorzien in de huisvesting van de
      in het eerste lid bedoelde scholen op het grondgebied van de gemeente.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel93
  - number: '94.1'
    text: |-
      Het bevoegd gezag van een niet door de gemeente in stand gehouden school dat een voorziening in de huisvesting
      wenst, dient een aanvraag voor opneming van die voorziening op het programma, bedoeld in [artikel 95][ref1], in bij
      burgemeester en wethouders.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel95
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '95'
        hoofdstuk: I
        afdeling: '3'
  - number: '94.2'
    text: |-
      Burgemeester en wethouders kunnen ten aanzien van voorzieningen als bedoeld in [artikel 92][ref1] bekostiging
      verstrekken ter zake van de kosten van bouwvoorbereiding.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel92
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '92'
        hoofdstuk: I
        afdeling: '3'
  - number: '94.3'
    text: |-
      Burgemeester en wethouders stellen vast, voor welk tijdstip de aanvraag wordt ingediend en aan welke voorwaarden
      deze dient te voldoen.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel94
  - number: '94.4'
    text: Het derde lid is van overeenkomstige toepassing op de door de gemeente in stand gehouden scholen.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel94
  - number: '95.1'
    text: |-
      Burgemeester en wethouders stellen, na overleg met de bevoegde gezagsorganen van de niet door de gemeente in stand
      gehouden scholen in de gemeente, jaarlijks ten behoeve van het onderwijs op het grondgebied van de gemeente voor
      een door hen te bepalen tijdstip een programma als bedoeld in het tweede lid vast. Het programma heeft betrekking
      op scholen als bedoeld in [artikel 93, eerste lid, onderdelen a, b en c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel93
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '93'
        hoofdstuk: I
        afdeling: '3'
  - number: '95.2'
    text: |-
      Het programma omvat de voorzieningen in de huisvesting, bedoeld in [artikel 92][ref1], die in het jaar na de
      vaststelling van het programma voor bekostiging in aanmerking zullen worden gebracht voor niet door de gemeente in
      stand gehouden scholen alsmede voorzieningen die nodig zijn voor door de gemeente in stand gehouden scholen.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel92
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '92'
        hoofdstuk: I
        afdeling: '3'
  - number: '95.3'
    text: 'Burgemeester en wethouders nemen uitsluitend voorzieningen in de huisvesting in het programma op, voor zover:'
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel95
  - number: 95.3.a
    text: |-
      met de voorzieningen in het kalenderjaar volgend op het jaar van vaststelling van het programma redelijkerwijs een
      aanvang kan worden gemaakt dan wel de voorzieningen in het desbetreffende kalenderjaar kunnen worden gerealiseerd,
      en
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel95
  - number: 95.3.b
    text: |-
      niet een van de weigeringsgronden, genoemd in [artikel 100][ref1], van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel100
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '100'
        hoofdstuk: I
        afdeling: '3'
  - number: '95.4'
    text: |-
      Indien het bekostigingsplafond, bedoeld in [artikel 93][ref1], niet toereikend is, worden die voorzieningen in het
      programma opgenomen die uit dat bekostigingsplafond kunnen worden bekostigd, waarbij de volgorde wordt bepaald met
      inachtneming van de criteria, bedoeld in [artikel 102, eerste lid, onderdeel c][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel93
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel102
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '93'
        hoofdstuk: I
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '102'
        hoofdstuk: I
        afdeling: '3'
  - number: '95.5'
    text: |-
      De beschikking van burgemeester en wethouders kan een gedeelte van de gewenste voorziening dan wel een andere
      voorziening dan gewenst omvatten.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel95
  - number: '95.6'
    text: |-
      Burgemeester en wethouders kunnen aan de opneming in het programma voorwaarden verbinden betreffende
      ingebruikneming of buitengebruikstelling van gebouwen of lokalen.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel95
  - number: '95.7'
    text: |-
      Burgemeester en wethouders nemen bij de vaststelling van het programma de criteria, bedoeld in
      [artikel 102, eerste lid, onderdeel c][ref1], in acht.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel102
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '102'
        hoofdstuk: I
        afdeling: '3'
  - number: '95.8'
    text: |-
      Binnen vier weken na de vaststelling van het programma treden burgemeester en wethouders met het bevoegd gezag
      in overleg over de wijze van uitvoering. Indien dit overleg niet tot overeenstemming leidt, delen burgemeester en
      wethouders het bevoegd gezag mede dat zij niet kunnen instemmen met de door het bevoegd gezag gewenste wijze van
      uitvoering.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel95
  - number: '95.9'
    text: |-
      Tijdens het in het eerste lid bedoelde overleg kunnen burgemeester en wethouders de Onderwijsraad verzoeken een
      advies uit te brengen over de vaststelling van het programma huisvestingsvoorzieningen in relatie tot de vrijheid
      van richting en de vrijheid van inrichting. Het verzoek wordt gedaan indien een bevoegd gezag hierom heeft gevraagd
      dan wel uit eigen beweging. Het verzoek bevat een omschrijving van de onderwerpen waarover advies wordt verwacht.
      Het advies wordt binnen vier weken uitgebracht aan burgemeester en wethouders. Het advies wordt bekend gemaakt
      tezamen met het programma.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel95
  - number: '96'
    text: |-
      Burgemeester en wethouders stellen gelijktijdig met het programma, bedoeld in [artikel 95][ref1], ten behoeve van
      het onderwijs op het grondgebied van de gemeente voor een door hen te bepalen tijdstip een overzicht vast van die
      voorzieningen die zijn aangevraagd dan wel nodig zijn, die niet op het programma zijn opgenomen. Daarbij wordt
      aangegeven waarom de desbetreffende voorzieningen niet zijn opgenomen. Het overzicht wordt ter inzage gelegd. Het
      overzicht heeft betrekking op scholen als bedoeld in [artikel 93, eerste lid, onderdelen a, b en c][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel95
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel93
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '95'
        hoofdstuk: I
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '93'
        hoofdstuk: I
        afdeling: '3'
  - number: '97'
    text: |-
      Burgemeester en wethouders stellen geen programma als bedoeld in[ artikel 95][ref1] en geen overzicht als bedoeld
      in [artikel 96][ref2] vast, indien geen voorziening in de huisvesting nodig is noch een aanvraag is ingediend voor
      scholen als bedoeld in [artikel 93, eerste lid, onderdelen a, b en c][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel95
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel96
      [ref3]: https://wetten.overheid.nl/BWBR0003420#Artikel93
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel97
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '95'
        hoofdstuk: I
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '96'
        hoofdstuk: I
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0003420
        artikel: '93'
        hoofdstuk: I
        afdeling: '3'
  - number: '98.1'
    text: |-
      Het bevoegd gezag van een niet door de gemeente in stand gehouden school dat een voorziening in de huisvesting
      wenst die niet in het programma, bedoeld in [artikel 95][ref1], is opgenomen, maar die gelet op de voortgang van
      het onderwijs geen uitstel kan lijden, dient een aanvraag om bekostiging van die voorziening in bij burgemeester
      en wethouders.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel95
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel98
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '95'
        hoofdstuk: I
        afdeling: '3'
  - number: '98.2'
    text: |-
      De beschikking kan een gedeelte van de gewenste voorziening dan wel een andere voorziening dan gewenst omvatten.
      Burgemeester en wethouders wijzen de aanvraag af, indien:
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel98
  - number: 98.2.a
    text: het besluit over de voorziening kan worden genomen bij de vaststelling van het eerstvolgende programma, of
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel98
  - number: 98.2.b
    text: |-
      een van de weigeringsgronden, genoemd in
      [artikel 100, eerste lid, onderdelen a tot en met d en f, en tweede lid][ref1], van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel100
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel98
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '100'
        hoofdstuk: I
        afdeling: '3'
  - number: '99.1'
    text: |-
      Burgemeester en wethouders beslissen bij beschikking met ingang van welk tijdstip in het jaar volgend op het jaar
      van vaststelling van het programma, bedoeld in [artikel 95][ref1], de bekostiging van een voorziening die in het
      programma is opgenomen, daadwerkelijk een aanvang kan nemen, onverminderd het bepaalde in [artikel 101][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel95
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel101
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '95'
        hoofdstuk: I
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '101'
        hoofdstuk: I
        afdeling: '3'
  - number: '99.2'
    text: |-
      De aanspraak op bekostiging van een voorziening vervalt, indien niet binnen een in de verordening op basis
      van [artikel 102][ref1] te bepalen termijn na de beschikking, bedoeld in het eerste lid, met betrekking tot de
      voorziening een bouwopdracht is gegeven dan wel een koop-, huur- of erfpachtovereenkomst is gesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel102
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '102'
        hoofdstuk: I
        afdeling: '3'
  - number: '100.1'
    text: 'Een voorziening in de huisvesting wordt slechts geweigerd, indien:'
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel100
  - number: 100.1.a
    text: |-
      de gewenste voorziening geen voorziening is in de zin van [artikel 92][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel92
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel100
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '92'
        hoofdstuk: I
        afdeling: '3'
  - number: 100.1.b
    text: |-
      de gewenste voorziening niet gerechtvaardigd is op grond van de aard en de omvang van de voorzieningen waarover
      de school reeds beschikt, voor zover deze uit de openbare kas zijn bekostigd, gelet op de normen, bedoeld in
      [artikel 102, eerste lid, onderdeel b][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel102
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel100
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '102'
        hoofdstuk: I
        afdeling: '3'
  - number: 100.1.c
    text: |-
      de gewenste voorziening niet gerechtvaardigd is op grond van de te verwachten ontwikkeling van het
      aantal leerlingen of onderwijskundige ontwikkelingen, zulks met inachtneming van het bepaalde in
      [artikel 102, eerste lid, onderdelen c en d][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel102
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel100
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '102'
        hoofdstuk: I
        afdeling: '3'
  - number: 100.1.d
    text: |-
      op andere wijze dan wordt gewenst redelijkerwijs in de behoefte aan huisvesting kan worden voorzien, onder meer
      doordat binnen redelijke afstand van de gewenste plaats van de voorziening gebruik dan wel medegebruik mogelijk is,
      of een reeds voor bekostiging in aanmerking gebracht gebouw of deel daarvan beschikbaar komt,
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel100
  - number: 100.1.e
    text: |-
      het bekostigingsplafond, bedoeld in [artikel 93][ref1], niet toereikend is voor de te verstrekken voorzieningen
      voor scholen als bedoeld in het [eerste lid, onderdelen a, b en c, van dat artikel][ref2], of


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel93
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel93
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel100
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '93'
        hoofdstuk: I
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '93'
        hoofdstuk: I
        afdeling: '3'
  - number: 100.1.f
    text: de gewenste voorziening anders dan op grond van de onderdelen b tot en met d niet noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel100
  - number: '100.2'
    text: |-
      Een voorziening in de huisvesting kan tevens worden geweigerd, indien de voorziening als gevolg van het verwijtbaar
      nalaten van noodzakelijk onderhoud in een slechte bouwkundige staat verkeert of indien de voorziening nodig is voor
      herstel van schade die is veroorzaakt door schuld of toedoen van het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel100
  - number: '101'
    text: |-
      Voorzieningen die in het programma, bedoeld in [artikel 95][ref1], zijn opgenomen, komen voor bekostiging in
      aanmerking, mits op het tijdstip dat daarvoor op grond van [artikel 99, eerste lid][ref2], is vastgesteld,


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel95
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel99
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel101
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '95'
        hoofdstuk: I
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '99'
        hoofdstuk: I
        afdeling: '3'
  - number: 101.a
    text: is voldaan aan de bij of krachtens de wet gestelde voorschriften, en
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel101
  - number: 101.b
    text: |-
      de feiten en omstandigheden waarin de school verkeert, ten opzichte van de feiten en omstandigheden ten tijde van
      de vaststelling van het programma niet ingrijpend zijn gewijzigd.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel101
  - number: '102.1'
    text: 'De gemeenteraad stelt bij verordening een regeling vast met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel102
  - number: 102.1.a
    text: |-
      de voorzieningen die ingevolge [artikel 92][ref1] voor bekostiging in aanmerking kunnen worden gebracht,


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel92
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel102
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '92'
        hoofdstuk: I
        afdeling: '3'
  - number: 102.1.b
    text: de oppervlakte en de indeling van schoolgebouwen,
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel102
  - number: 102.1.c
    text: de urgentiecriteria,
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel102
  - number: 102.1.d
    text: de prognosecriteria,
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel102
  - number: 102.1.e
    text: |-
      de termijn bedoeld in [artikel 99][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel99
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel102
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '99'
        hoofdstuk: I
        afdeling: '3'
  - number: 102.1.f
    text: de procedure met betrekking tot verhuur en het medegebruik van ruimten voor het onderwijs,
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel102
  - number: 102.1.g
    text: |-
      de termijn gedurende welke een gebouw of terrein voor een school of nevenvestiging nog ten hoogste kan worden
      gebruikt bij toepassing van [artikel 110][ref1], alsmede de procedure in verband met een eventueel op te maken
      staat van onderhoud, en


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel110
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel102
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '110'
        hoofdstuk: I
        afdeling: '3'
  - number: 102.1.h
    text: |-
      de gegevens bedoeld in [artikel 112][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel112
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel102
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '112'
        hoofdstuk: I
        afdeling: '3'
  - number: '102.2'
    text: |-
      De regeling wordt zodanig vastgesteld dat kan worden voldaan aan de redelijke eisen die het onderwijs aan de
      huisvesting van scholen in de gemeente stelt.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel102
  - number: '102.3'
    text: |-
      De gemeenteraad stelt normen vast aan de hand waarvan de bedragen worden vastgesteld voor de toegekende
      voorzieningen in de huisvesting.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel102
  - number: '102.4'
    text: |-
      Burgemeester en wethouders betalen volgens door hen te stellen regels de bedragen aan de hand van de door de
      gemeenteraad gestelde normen.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel102
  - number: '102.5'
    text: |-
      De gemeenteraad stelt de regeling, bedoeld in het eerste lid, dan wel een wijziging daarvan, niet vast dan nadat
      daarover op overeenstemming gericht overleg is gevoerd met door de bevoegde gezagsorganen van de niet door de
      gemeente in stand gehouden scholen in de gemeente aan te wijzen vertegenwoordigers. De gemeenteraad stelt daartoe
      een procedure vast.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel102
  - number: '102.6'
    text: |-
      Tijdens het in het vijfde lid bedoelde overleg kan de gemeenteraad de Onderwijsraad verzoeken een advies uit te
      brengen over de vaststelling of wijziging van de gemeentelijke verordening in relatie tot de vrijheid van richting
      en de vrijheid van inrichting. Het verzoek wordt gedaan indien een bevoegd gezag hierom heeft gevraagd dan wel uit
      eigen beweging. Het verzoek bevat een omschrijving van de onderwerpen waarover advies wordt verwacht. Het advies
      wordt binnen vier weken uitgebracht aan de gemeenteraad. Het advies wordt bekend gemaakt tezamen met de verordening
      of de wijziging daarvan.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel102
  - number: '103.1'
    text: |-
      Het bevoegd gezag van een niet door de gemeente in stand gehouden school geeft opdracht de voorziening in de
      huisvesting waartoe op grond van de [artikelen 95][ref1] en [98][ref2] kan worden overgegaan, tot stand te brengen
      met daartoe door de gemeente beschikbaar te stellen gelden, tenzij het met burgemeester en wethouders overeenkomt
      dat de gemeente deze voorziening tot stand brengt.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel95
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel98
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel103
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '95'
        hoofdstuk: I
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '98'
        hoofdstuk: I
        afdeling: '3'
  - number: '103.2'
    text: |-
      Indien de gemeente de voorziening in de huisvesting van een niet door de gemeente in stand gehouden school tot
      stand heeft gebracht, worden gebouw en terrein aan het bevoegd gezag in eigendom overgedragen, tenzij burgemeester
      en wethouders en het bevoegd gezag anders overeenkomen.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel103
  - number: '103.3'
    text: |-
      Indien de voorziening in de huisvesting, bedoeld in het tweede lid, niet voldoet aan de eisen voor
      eigendomsoverdracht, geven burgemeester en wethouders deze aan het bevoegd gezag in gebruik.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel103
  - number: '104'
    text: |-
      Tenzij het bevoegd gezag van een niet door de gemeente in stand gehouden school dat aanspraak heeft op bekostiging
      van een voorziening in de huisvesting, met burgemeester en wethouders overeenkomt dat de gemeente deze voorziening
      tot stand brengt, behoeven de bouwplannen en de desbetreffende begrotingen de instemming van burgemeester en
      wethouders.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel104
  - number: '105'
    text: |-
      De gemeente brengt een voorziening in de huisvesting van een niet door de gemeente in stand gehouden school
      slechts tot stand, indien tussen burgemeester en wethouders en het bevoegd gezag overeenstemming bestaat over de
      bouwplannen en de wijze van uitvoering.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel105
  - number: '106.1'
    text: |-
      Het bevoegd gezag is verplicht het gebouw en terrein, alsmede de roerende zaken waarvoor bekostiging wordt genoten,
      behoorlijk te gebruiken en te onderhouden.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel106
  - number: '106.2'
    text: |-
      Vervreemding door het bevoegd gezag van een niet door de gemeente in stand gehouden school anders dan op grond
      van [artikel 49][ref1] of [artikel 56][ref2] van gebouwen, terreinen en roerende zaken waarvoor bekostiging wordt
      genoten, of bezwaren met een zakelijk recht door het bevoegd gezag van een niet door de gemeente in stand gehouden
      school van zodanige gebouwen en terreinen, is zonder toestemming van burgemeester en wethouders nietig.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel56
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel106
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '49'
        hoofdstuk: I
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '56'
        hoofdstuk: I
        afdeling: '3'
  - number: '106.3'
    text: |-
      Het tweede lid is niet van toepassing ten aanzien van het recht van opstal ten behoeve van een door de gemeente te
      plaatsen tijdelijke voorziening in de huisvesting op grond die eigendom is van het bevoegd gezag van de betrokken
      school.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel106
  - number: '107.1'
    text: |-
      Burgemeester en wethouders zijn bevoegd een gedeelte van een gebouw of terrein dat tijdelijk of gedurende een
      gedeelte van de dag niet nodig zal zijn voor de daar gevestigde school, gedurende die tijd als huisvesting voor
      een andere school, voor ander uit de openbare kas bekostigd onderwijs niet zijnde basisonderwijs, of voor educatie
      als bedoeld in de [Wet educatie en beroepsonderwijs][ref1] dan wel voor andere culturele, maatschappelijke of
      recreatieve doeleinden te bestemmen. Het voorgenomen gebruik dient zich te verdragen met het onderwijs aan de
      in het gebouw gevestigde school. Tevens zijn burgemeester en wethouders bevoegd ten behoeve van het onderwijs in
      lichamelijke oefening of expressie-activiteiten een gebouw of terrein dan wel een gedeelte daarvan dat tijdelijk
      gedurende gedeelten van de dag of in het geheel niet nodig zal zijn voor de daar gevestigde school, gedurende
      die tijd als huisvesting voor een andere school, voor ander uit de openbare kas bekostigd onderwijs niet zijnde
      basisonderwijs, of voor educatie als bedoeld in de [Wet educatie en beroepsonderwijs][ref2] dan wel voor andere
      culturele, maatschappelijke of recreatieve doeleinden te bestemmen.


      [ref1]: https://wetten.overheid.nl/BWBR0007625
      [ref2]: https://wetten.overheid.nl/BWBR0007625
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0007625
      - id: ref2
        bwb_id: BWBR0007625
  - number: '107.2'
    text: |-
      Indien het gebouw of terrein in gebruik is voor een niet door de gemeente in stand gehouden school plegen
      burgemeester en wethouders vooraf overleg met het bevoegd gezag en, voor zover van toepassing, ook met het bevoegd
      gezag van die school of nevenvestiging waarvoor de huisvesting is bestemd.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel107
  - number: '108.1'
    text: |-
      Voor zover [artikel 107][ref1] geen toepassing vindt, kan het bevoegd gezag een gedeelte van een gebouw
      of terrein in gebruik geven ten behoeve van uit de openbare kas bekostigd onderwijs dan wel voor andere
      culturele, maatschappelijke of recreatieve doeleinden. Voor zover niet nodig voor uit de openbare kas bekostigd
      onderwijs, kan het bevoegd gezag een gedeelte van het gebouw of terrein verhuren aan een derde, voor zover
      het gehuurde niet bestemd zal zijn als woon- of bedrijfsruimte in de zin van de vijfde en zesde afdeling van
      [titel 4 van Boek 7 van het Burgerlijk Wetboek][ref2]. Indien het een niet door de gemeente in stand gehouden
      school betreft, is voor verhuur toestemming van burgemeester en wethouders vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel107
      [ref2]: https://wetten.overheid.nl/BWBR0005290
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '107'
        hoofdstuk: I
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005290
  - number: '108.2'
    text: 'De ingebruikgeving of verhuur ingevolge het eerste lid eindigt:'
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel108
  - number: 108.2.a
    text: |-
      indien burgemeester en wethouders gebruik maken van hun bevoegdheid op grond van [artikel 107][ref1] zonder dat
      enige schadeplicht ontstaat, of


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel107
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '107'
        hoofdstuk: I
        afdeling: '3'
  - number: 108.2.b
    text: indien het in gebruik gegeven dan wel verhuurde deel nodig is voor gebruik door de eigen school.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel108
  - number: '108.3'
    text: |-
      Ingebruikgeving of verhuur ingevolge het eerste lid geschiedt niet indien het voorgenomen gebruik zich niet
      verdraagt met het onderwijs aan de in het gebouw gevestigde school.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel108
  - number: '108.4'
    text: |-
      Op de ingebruikgeving en verhuur ingevolge het eerste lid is
      [artikel 230a van Boek 7 van het Burgerlijk Wetboek][ref1] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel230a
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 230a
  - number: '108.5'
    text: |-
      Het zonder toestemming van burgemeester en wethouders verhuren van een gebouw of terrein door het bevoegd gezag
      van een niet door de gemeente in stand gehouden school alsmede elk met dit artikel strijdig beding opgenomen in een
      huurovereenkomst met betrekking tot schoolgebouwen, is nietig.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel108
  - number: '109'
    text: |-
      Voorzieningen aan gebouwen of terreinen in verband met verhuur krachtens de [artikelen 108][ref1] of [110][ref2]
      door het bevoegd gezag van een niet door de gemeente in stand gehouden school komen niet ten laste van de gemeente.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel108
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel110
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel109
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '108'
        hoofdstuk: I
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '110'
        hoofdstuk: I
        afdeling: '3'
  - number: '110.1'
    text: |-
      Burgemeester en wethouders en het bevoegd gezag van een niet door de gemeente in stand gehouden school dat eigenaar
      is van het gebouw en terrein, kunnen in een gezamenlijke akte verklaren dat het bevoegd gezag blijvend heeft
      opgehouden dan wel blijvend zal ophouden het gebouw of terrein of een voor eigendomsoverdracht vatbaar gedeelte
      daarvan, voor de school te gebruiken.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel110
  - number: '110.2'
    text: |-
      Gedeputeerde staten kunnen in geval van een geschil omtrent de toepassing van het eerste lid desgevraagd besluiten
      dat het bevoegd gezag blijvend heeft opgehouden dan wel blijvend zal ophouden het gebouw of terrein of een voor
      eigendomsoverdracht vatbaar gedeelte daarvan, voor de school te gebruiken. De aanvraag om het besluit wordt gedaan
      door burgemeester en wethouders of door het bevoegd gezag van de school. Alvorens op de aanvraag te besluiten,
      horen gedeputeerde staten de wederpartij.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel110
  - number: '110.3'
    text: |-
      Het bevoegd gezag van een niet door de gemeente in stand gehouden school dat voornemens is gebouwen of terreinen,
      of een gedeelte daarvan, blijvend niet meer voor de school te gebruiken, doet hiervan onverwijld mededeling aan
      burgemeester en wethouders.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel110
  - number: '110.4'
    text: |-
      Zodra de in het eerste lid bedoelde akte door beide partijen is getekend, of het in het tweede lid bedoelde besluit
      van gedeputeerde staten onherroepelijk is geworden dan wel in beroep is bepaald dat de uitspraak van de rechter,
      inhoudende een besluit als bedoeld in het tweede lid eerste volzin, in de plaats treedt van het vernietigde
      besluit, wordt de akte, het onherroepelijk geworden besluit onderscheidenlijk de uitspraak, tenzij deze een gebouw
      betreft als bedoeld in [artikel E 33 van de Overgangswet WBO](onbekend), ingeschreven in de openbare registers,
      bedoeld in [afdeling 2 van titel 1 van Boek 3 van het Burgerlijk Wetboek][ref1]. Door de inschrijving verkrijgt de
      gemeente de eigendom.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Afdeling2
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel110
    references:
      - id: ref1
        bwb_id: BWBR0005291
        afdeling: '2'
  - number: '110.5'
    text: |-
      Burgemeester en wethouders en het bevoegd gezag van een niet door de gemeente in stand gehouden school dat eigenaar
      is van het schoolgebouw, kunnen in een gezamenlijke akte verklaren dat een gedeelte van het gebouw dat niet vatbaar
      is voor eigendomsoverdracht, blijvend niet meer voor het onderwijs nodig zal zijn.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel110
  - number: '110.6'
    text: |-
      Gedeputeerde staten kunnen in geval van een geschil omtrent de toepassing van het vijfde lid desgevraagd besluiten
      dat een gedeelte van het gebouw dat niet vatbaar is voor eigendomsoverdracht, blijvend niet meer voor het onderwijs
      nodig zal zijn. De aanvraag om het besluit wordt gedaan door burgemeester en wethouders of door het bevoegd gezag
      van de school. Alvorens op de aanvraag te besluiten, horen gedeputeerde staten de wederpartij.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel110
  - number: '110.7'
    text: |-
      Zodra de in het vijfde lid bedoelde akte door beide partijen is getekend, of het in het zesde lid bedoelde besluit
      van gedeputeerde staten onherroepelijk is geworden dan wel in beroep is bepaald dat de uitspraak van de rechter,
      inhoudende een beslissing als bedoeld in het zesde lid eerste volzin, in de plaats treedt van het vernietigde
      besluit, kan het bevoegd gezag van een niet door de gemeente in stand gehouden school het desbetreffende gedeelte
      van het gebouw met toestemming van burgemeester en wethouders verhuren.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel110
  - number: '110.8'
    text: |-
      De toestemming, bedoeld in het zevende lid, wordt verleend voor een tijdvak van ten hoogste 3 jaren. Op aanvraag
      van het bevoegd gezag kan dit tijdvak telkens worden verlengd met een termijn van ten hoogste 3 jaren.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel110
  - number: '110.9'
    text: |-
      Op de verhuur, bedoeld in het zevende lid, is [artikel 230a van Boek 7 van het Burgerlijk Wetboek][ref1] niet van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel230a
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel110
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 230a
  - number: '111'
    text: |-
      In afwijking van deze afdeling kan de gemeenteraad besluiten dat jaarlijks een bedrag voor huisvestingskosten
      wordt betaald aan het bevoegd gezag van een niet door de gemeente in stand gehouden school voor zover die op het
      grondgebied van die gemeente in stand wordt gehouden. De gemeenteraad neemt het besluit in overeenstemming met het
      bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel111
  - number: '112'
    text: |-
      Het bevoegd gezag van een niet door de desbetreffende gemeente in stand gehouden school is gehouden aan de
      gemeenteraad onderscheidenlijk burgemeester en wethouders alle inlichtingen te verschaffen die de gemeenteraad
      onderscheidenlijk burgemeester en wethouders voor een adequate uitvoering van de bepalingen in deze afdeling
      noodzakelijk achten.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel112
  - number: '113.1'
    text: |-
      Bij ministeriële regeling worden eenmaal in de vijf jaar voor 1 oktober programma's van eisen vastgesteld die
      de grondslag vormen voor de bekostiging van de voorzieningen, bedoeld in het derde lid. De programma's van eisen
      gelden voor de vijf jaar volgend op het jaar waarin de vaststelling dient plaats te vinden. In de programma's
      van eisen wordt een extra bekostiging opgenomen voor de gezamenlijke speciale scholen voor basisonderwijs in
      een samenwerkingsverband of, indien van een samenwerkingsverband geen speciale school voor basisonderwijs deel
      uitmaakt, voor een samenwerkingsverband. Elk programma van eisen omvat:
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel113
  - number: 113.1.a
    text: een omschrijving van de in aanmerking genomen componenten waaruit de voorzieningen zijn opgebouwd,
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel113
  - number: 113.1.b
    text: de daarvoor noodzakelijk geachte bedragen en
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel113
  - number: 113.1.c
    text: de wijze waarop de voor elke voorziening vast te stellen bekostiging wordt berekend.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel113
  - number: '113.2'
    text: |-
      De programma's van eisen voldoen aan de redelijke behoeften van een in normale omstandigheden verkerende school,
      onverminderd het vierde tot en met negende lid, en houden rekening met de bruto vloeroppervlakten die op grond van
      de algemene maatregel van bestuur, bedoeld in [artikel 92, tweede lid][ref1], worden voorgeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel92
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel113
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '92'
        hoofdstuk: I
        afdeling: '3'
  - number: '113.3'
    text: |-
      Programma's van eisen worden vastgesteld voor de materiële voorzieningen ten behoeve van de instandhouding van de
      scholen, daaronder niet begrepen de ruimten voor het onderwijs in lichamelijke oefening.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel113
  - number: '113.4'
    text: |-
      Bij ministeriële regeling worden jaarlijks voor 1 oktober de overeenkomstig het zesde lid, aangepaste bedragen
      vastgesteld. De aldus vastgestelde bedragen zijn de definitieve bedragen, geldend voor het jaar volgend op het jaar
      waarin de vaststelling dient plaats te vinden.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel113
  - number: '113.5'
    text: |-
      Onze Minister kan bij de vaststelling van de ministeriële regeling, bedoeld in het vierde lid, wijzigingen in de
      programma's van eisen aanbrengen indien de toestand van 's Rijks schatkist of onderwijskundige ontwikkelingen dat
      noodzakelijk maken. Aan de eerste volzin kan slechts toepassing worden gegeven indien de ministeriële regeling,
      bedoeld in het vierde lid, voor de in dat lid bedoelde datum wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel113
  - number: '113.6'
    text: |-
      De aanpassing, bedoeld in het vierde lid, vindt plaats door de bedragen op basis van de werkelijke
      prijsontwikkeling voor het tweede jaar voorafgaand aan het jaar waarvoor de bedragen worden vastgesteld, aan te
      passen overeenkomstig de prijsmutatie van de netto materiële consumptie, zoals opgenomen in de Macro Economische
      Verkenning, die naar verwachting zal optreden tussen het prijsniveau in het eerstbedoelde jaar en het prijsniveau
      in het daaropvolgende jaar, alsmede aan te passen overeenkomstig de prijsmutatie van de netto materiële consumptie,
      zoals opgenomen in de Macro Economische Verkenning, die naar verwachting zal optreden tussen het prijsniveau in
      het jaar voorafgaand aan het jaar waarvoor de bedragen worden vastgesteld en het jaar waarvoor de bedragen worden
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel113
  - number: '113.7'
    text: |-
      De ministeriële regelingen, bedoeld in het eerste en vierde lid, worden binnen 4 weken na de vaststelling, bedoeld
      in het eerste en vierde lid, gezamenlijk bekendgemaakt in de Staatscourant, onder gelijktijdige overlegging aan
      de Tweede Kamer der Staten-Generaal. De ministeriële regelingen treden niet in werking dan nadat 4 weken zijn
      verstreken na het overleggen aan de Tweede Kamer en gedurende die termijn niet door of namens de Kamer de wens tot
      overleg over de ministeriële regelingen te kennen wordt gegeven, dan wel met de Tweede Kamer overleg is gevoerd.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel113
  - number: '113.8'
    text: |-
      Naar aanleiding van het overleg met de Tweede Kamer kunnen wijzigingen in de programma's van eisen en de
      wijzigingen daarvan, bedoeld in het vijfde lid, worden aangebracht. De wijzigingen worden bekendgemaakt in de
      Staatscourant.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel113
  - number: '114'
    text: |-
      De programma's van eisen, bedoeld in [artikel 113, derde lid][ref1], worden onderverdeeld in programma's van eisen
      omtrent:


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel113
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel114
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '113'
        hoofdstuk: I
        afdeling: '4'
  - number: 114.a
    text: onderhoud van en aanpassingen aan het gebouw en het terrein,
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel114
  - number: 114.b
    text: energie- en waterverbruik,
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel114
  - number: 114.c
    text: publiekrechtelijke heffingen, met uitzondering van de belastingen ter zake van onroerende zaken,
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel114
  - number: 114.d
    text: middelen, en
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel114
  - number: 114.e
    text: administratie, beheer en bestuur.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel114
  - number: '115.1'
    text: |-
      De bekostiging, bedoeld in [artikel 113, eerste lid derde volzin][ref1], voor de materiële instandhouding
      bestaat voor de gezamenlijke speciale scholen voor basisonderwijs in een samenwerkingsverband uit een bedrag
      vermenigvuldigd met 2% van het aantal leerlingen van het samenwerkingsverband op 1 oktober van het jaar
      voorafgaande aan het jaar waarover de bekostiging plaatsvindt. Het Rijk verdeelt deze bekostiging over de speciale
      scholen voor basisonderwijs in een samenwerkingsverband naar rato van het aantal leerlingen van elke speciale
      school voor basisonderwijs op die datum.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel113
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel115
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '113'
        hoofdstuk: I
        afdeling: '4'
  - number: '115.2'
    text: |-
      Indien alle bevoegde gezagsorganen van de scholen in het samenwerkingsverband ermee instemmen dat van het
      samenwerkingsverband geen speciale school voor basisonderwijs deel uitmaakt, bestaat de bekostiging, bedoeld in
      [artikel 113, eerste lid, derde volzin][ref1], voor de materiële instandhouding uit een bedrag vermenigvuldigd
      met 2% van het aantal leerlingen van het samenwerkingsverband op 1 oktober van het jaar voorafgaande aan het jaar
      waarover de bekostiging plaatsvindt. Het Rijk verstrekt deze bekostiging aan het samenwerkingsverband.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel113
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel115
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '113'
        hoofdstuk: I
        afdeling: '4'
  - number: '116.1'
    text: |-
      Indien bijzondere ontwikkelingen in het basisonderwijs daartoe aanleiding geven, kunnen bij ministeriële
      regeling voorschriften worden vastgesteld omtrent het verstrekken van aanvullende bekostiging voor de materiële
      instandhouding.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel116
  - number: '116.2'
    text: |-
      Indien bijzondere bekostiging op grond van [artikel 123][ref1] wordt toegekend, kan Onze Minister bepalen dat, voor
      de periode waarvoor die bijzondere bekostiging wordt toegekend, tevens aanvullende bekostiging voor de materiële
      instandhouding wordt toegekend. Bij ministeriële regeling kunnen nadere regels worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel123
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel116
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '123'
        hoofdstuk: I
        afdeling: '5'
  - number: '116.3'
    text: |-
      Onze Minister kan in verband met de in het eerste lid en het tweede lid bedoelde bekostiging een
      bekostigingsplafond instellen. In dat geval worden bij ministeriële regeling regels omtrent de verdeling
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel116
  - number: '117.1'
    text: |-
      Burgemeester en wethouders stellen na overleg met de bevoegde gezagsorganen van de niet door de gemeente in stand
      gehouden scholen het aantal klokuren per week vast dat per groep leerlingen ten hoogste
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel117
  - number: 117.1.a
    text: ter beschikking wordt gesteld in een ruimte voor het onderwijs in lichamelijke oefening, of
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel117
  - number: 117.1.b
    text: |-
      voor bekostiging voor de materiële instandhouding van een ruimte voor het onderwijs in lichamelijke oefening in
      aanmerking komt.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel117
  - number: '117.2'
    text: |-
      Het aantal klokuren, bedoeld in het eerste lid, wordt vastgesteld op ten minste 1,5 voor basisscholen en ten minste
      2,25 voor speciale scholen voor basisonderwijs.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel117
  - number: '117.3'
    text: Burgemeester en wethouders stellen de hoogte vast van
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel117
  - number: 117.3.a
    text: de bekostiging, bedoeld in het eerste lid, onder b, en
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel117
  - number: 117.3.b
    text: |-
      de bekostiging voor de vaste kosten van de materiële instandhouding van een ruimte voor lichamelijke oefening
      waarvan de eigendom berust bij het bevoegd gezag van een niet door de gemeente in stand gehouden school.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel117
  - number: '117.4'
    text: |-
      Bij de vaststelling, bedoeld in het derde lid, kan onderscheid worden gemaakt naar gelang de oppervlakte van de
      ruimte, alsmede tussen ruimten voor de exploitatie waarvan op grond van de onderwijswetgeving bekostiging wordt
      verleend en ruimten waarvoor dat niet het geval is.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel117
  - number: '118.1'
    text: |-
      Aan het samenwerkingsverband wordt bekostiging toegekend voor materiële instandhouding die samenhangt met de
      inrichting van de ondersteuningsstructuur.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel118
  - number: '118.2'
    text: |-
      De in het eerste lid bedoelde bekostiging is afhankelijk van het aantal leerlingen op de vestigingen van de
      basisscholen in het samenwerkingsverband op 1 oktober van het jaar voorafgaand aan het jaar waarover de bekostiging
      plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel118
  - number: '118.3'
    text: |-
      De bekostiging, bedoeld in het eerste lid, wordt jaarlijks vastgesteld bij ministeriële regeling. Deze ministeriële
      regeling wordt tezamen met de ministeriële regelingen, bedoeld in [artikel 113, zevende lid][ref1], binnen 4 weken
      na de vaststelling bekendgemaakt in de Staatscourant, onder gelijktijdige overlegging aan de Tweede Kamer der
      Staten-Generaal. Artikel 113, zevende lid, tweede volzin, is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel113
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel118
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '113'
        hoofdstuk: I
        afdeling: '4'
  - number: '118.4'
    text: |-
      Indien op 1 oktober het aantal leerlingen van de gezamenlijke speciale scholen voor basisonderwijs in een
      samenwerkingsverband meer bedraagt dan 2% van het aantal leerlingen op de vestigingen van de scholen in
      het samenwerkingsverband, draagt het samenwerkingsverband voor elke leerling van een speciale school voor
      basisonderwijs boven voornoemde 2% het in [artikel 115][ref1] bedoelde bedrag over aan de speciale school voor
      basisonderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel115
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel118
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '115'
        hoofdstuk: I
        afdeling: '4'
  - number: '118.5'
    text: |-
      In het ondersteuningsplan wordt vastgelegd welk deel van de bekostiging voor de materiële instandhouding die
      samenhangt met de inrichting van de ondersteuningsstructuur voor zover na toepassing van het vierde lid en
      [artikel 118a][ref1] die bekostiging nog resteert, op welke basisschool in het samenwerkingsverband wordt ingezet.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel118a
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel118
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 118a
        hoofdstuk: I
        afdeling: '4'
  - number: '118.6'
    text: |-
      Bij de berekening op grond van het vierde lid wordt 2% van het aantal leerlingen op de vestigingen van de scholen
      in het samenwerkingsverband rekenkundig afgerond op een geheel getal.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel118
  - number: '118.7'
    text: |-
      De overdracht op grond van het vierde lid door het samenwerkingsverband heeft betrekking op het kalenderjaar dat
      volgt op de in het vierde lid bedoelde teldatum en vindt ten hoogste plaats voor de aan het samenwerkingsverband
      op grond van het eerste lid toegekende bekostiging van de materiële instandhouding die samenhangt met de
      ondersteuningsstructuur.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel118
  - number: '118.8'
    text: |-
      Aan het samenwerkingsverband wordt bekostiging voor materiële instandhouding toegekend in aanvulling op de in het
      eerste lid bedoelde bekostiging.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel118
  - number: '118.9'
    text: |-
      De in het achtste lid bedoelde bekostiging bestaat uit een bij ministeriële regeling vast te stellen bedrag per
      leerling voor het aantal leerlingen op de vestigingen van de scholen in het samenwerkingsverband op 1 oktober van
      het jaar voorafgaand aan het jaar waarover de bekostiging plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel118
  - number: '118.10'
    text: |-
      Voor elke leerling die op 1 oktober van het jaar voorafgaand aan het jaar waarover de bekostiging plaatsvindt,
      was ingeschreven op een school voor speciaal onderwijs of speciaal en voortgezet speciaal onderwijs behorend tot
      cluster 3 en 4, bedoeld in de [Wet op de expertisecentra][ref1], voor zover het betreft het daaraan verzorgde
      speciaal onderwijs wordt een bedrag in mindering gebracht op de in het achtste lid bedoelde bekostiging van het
      samenwerkingsverband dat de leerling op grond van [artikel 40, tiende lid, van de Wet op de expertisecentra][ref2]
      toelaatbaar heeft verklaard tot het speciaal onderwijs. Het in de eerste volzin bedoelde bedrag is afhankelijk van
      de in de toelaatbaarheidsverklaring opgenomen ondersteuningsbehoefte van de leerling en komt overeen met één van de
      normbedragen die bij ministeriële regeling worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003549
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel40
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel118
    references:
      - id: ref1
        bwb_id: BWBR0003549
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '40'
  - number: '118.11'
    text: |-
      Het tiende lid is van overeenkomstige toepassing op leerlingen opgenomen in residentiële instellingen aan wie op
      1 oktober van het jaar voorafgaand aan het jaar waarover de bekostiging plaatsvindt onderwijs werd gegeven op basis
      van een samenwerkingsovereenkomst als bedoeld in [artikel 71c, tweede lid, van de Wet op de expertisecentra][ref1],
      met dien verstande dat het normbedrag, bedoeld in [artikel 117, zevende lid, van die wet][ref2] in mindering wordt
      gebracht op de bekostiging van:


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel71c
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel117
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel118
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 71c
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '117'
  - number: 118.11.a
    text: 'het samenwerkingsverband:'
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel118
  - number: 118.11.a.1°
    text: |-
      dat verantwoordelijk is voor de bekostiging tijdens de inschrijving op een school voor speciaal
      onderwijs of speciaal en voortgezet speciaal onderwijs behorend tot cluster 3 en 4, bedoeld in de
      [Wet op de expertisecentra][ref1], indien de leerling onmiddellijk voorafgaand aan de opname in de residentiële
      instelling was ingeschreven op een school voor speciaal onderwijs of speciaal en voortgezet speciaal onderwijs, of


      [ref1]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel118
    references:
      - id: ref1
        bwb_id: BWBR0003549
  - number: 118.11.a.2°
    text: |-
      waartoe de vestiging van de school behoort waar de leerling was ingeschreven en bekostigd onmiddellijk voorafgaand
      aan de opname in de residentiële instelling, of
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel118
  - number: 118.11.b
    text: |-
      het samenwerkingsverband in het gebied waarvan de leerling woonachtig is, indien de leerling onmiddellijk
      voorafgaand aan de opname in de residentiële instelling niet was ingeschreven op een school of school voor
      speciaal onderwijs of speciaal en voortgezet speciaal onderwijs behorend tot cluster 3 en 4, bedoeld in de
      [Wet op de expertisecentra][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel118
    references:
      - id: ref1
        bwb_id: BWBR0003549
  - number: '118.12'
    text: |-
      [Artikel 116][ref1] is van overeenkomstige toepassing op het samenwerkingsverband.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel116
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel118
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '116'
        hoofdstuk: I
        afdeling: '4'
  - number: 118a
    text: |-
      Indien [artikel 125][ref1] van toepassing is, wordt door het samenwerkingsverband tevens een bij het zorgplan
      bepaald gedeelte van de bekostiging bedoeld in [artikel 118][ref2] overgedragen aan de speciale school voor
      basisonderwijs. De in de eerste volzin bedoelde overdracht vindt plaats voor zover nog niet het maximum van de op
      grond van [artikel 118, eerste lid][ref3], aan het samenwerkingsverband toegekende bekostiging van de materiële
      instandhouding die samenhangt met de inrichting van de zorgstructuur op grond van [artikel 118, vierde lid][ref4],
      is overgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel125
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel118
      [ref3]: https://wetten.overheid.nl/BWBR0003420#Artikel118
      [ref4]: https://wetten.overheid.nl/BWBR0003420#Artikel118
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel118a
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '125'
        hoofdstuk: I
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '118'
        hoofdstuk: I
        afdeling: '4'
      - id: ref3
        bwb_id: BWBR0003420
        artikel: '118'
        hoofdstuk: I
        afdeling: '4'
      - id: ref4
        bwb_id: BWBR0003420
        artikel: '118'
        hoofdstuk: I
        afdeling: '4'
  - number: 118b
    text: |-
      Indien het totaal van de bedragen, bedoeld in [artikel 118, tiende lid, eerste volzin, en elfde lid][ref1],
      de bekostiging voor materiële instandhouding van het samenwerkingsverband, bedoeld in artikel 118, achtste
      lid, overschrijdt, wordt het bedrag waarmee die bekostiging wordt overschreden door Onze Minister in mindering
      gebracht op de materiële bekostiging van alle scholen en scholen voor speciaal onderwijs en speciaal en voortgezet
      speciaal onderwijs behorend tot cluster 3 en 4, bedoeld in de [Wet op de expertisecentra][ref2], waarvan één
      of meer vestigingen zijn gelegen in het gebied van het samenwerkingsverband. Het bedrag dat in mindering wordt
      gebracht wordt per school dan wel school voor speciaal onderwijs of speciaal en voortgezet speciaal onderwijs
      behorend tot cluster 3 en 4, bedoeld in de Wet op de expertisecentra, voor zover het betreft het daaraan verzorgde
      speciaal onderwijs bepaald op basis van het leerlingenaantal van de desbetreffende vestiging of vestigingen in
      het samenwerkingsverband.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel118
      [ref2]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel118b
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '118'
        hoofdstuk: I
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0003549
  - number: '119.1'
    text: |-
      Het bevoegd gezag dat, dan wel de gemeente die eigenaar is van een schoolgebouw, zorgt voor het deel van de
      materiële instandhouding waarop de programma's van eisen, bedoeld in [artikel 114, onder a, b en c][ref1],
      betrekking hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel114
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel119
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '114'
        hoofdstuk: I
        afdeling: '4'
  - number: '119.2'
    text: |-
      Het bevoegd gezag van een bijzondere school en het bevoegd gezag van een openbare nevenvestiging ten aanzien
      waarvan [artikel 85, tweede lid][ref1], toepassing heeft gevonden en dat eigenaar is van een schoolgebouw, kan
      met burgemeester en wethouders overeenkomen dat de gemeente het in het eerste lid bedoelde deel van de materiële
      instandhouding geheel of gedeeltelijk verzorgt.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel85
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel119
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '85'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '2'
  - number: '119.3'
    text: |-
      Het bevoegd gezag, bedoeld in het eerste lid, kan met een bevoegd gezag dat gebruik maakt van de voorziening in
      de huisvesting van het eerstgenoemde bevoegd gezag, overeenkomen dat het laatstgenoemde bevoegd gezag het in het
      eerste lid bedoelde deel van de materiële instandhouding geheel of gedeeltelijk verzorgt.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel119
  - number: '119.4'
    text: |-
      Ingeval de gemeente eigenaar is van het schoolgebouw, kan het bevoegd gezag van een bijzondere school en het
      bevoegd gezag van een openbare nevenvestiging ten aanzien waarvan [artikel 85, tweede lid][ref1], toepassing heeft
      gevonden, met de gemeente overeenkomen dat het bevoegd gezag het in het eerste lid bedoelde deel van de materiële
      instandhouding geheel of gedeeltelijk verzorgt.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel85
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel119
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '85'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '2'
  - number: '119.5'
    text: |-
      Het bevoegd gezag zorgt voor het deel van de materiële instandhouding waarop de programma's van eisen, bedoeld in
      [artikel 114, onder d en e][ref1], betrekking hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel114
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel119
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '114'
        hoofdstuk: I
        afdeling: '4'
  - number: 119a
    text: |-
      De algemene maatregel van bestuur, bedoeld in [artikel 120][ref1], [124][ref2], [125][ref3] en [132][ref4],
      wordt aan de Tweede Kamer der Staten-Generaal overgelegd. De maatregel treedt niet in werking dan nadat 4 weken
      na de overlegging zijn verstreken en gedurende die termijn niet door of namens de Kamer de wens wordt te kennen
      gegeven dat het in die maatregel geregelde onderwerp bij de wet wordt geregeld. Alsdan wordt een daartoe strekkend
      wetsontwerp zo spoedig mogelijk ingediend. Het bepaalde in de vorige 3 volzinnen is niet van toepassing indien het
      ontwerp van de algemene maatregel van bestuur voordien aan de Kamer is overgelegd en door of namens de Kamer te
      kennen is gegeven dat van de procedure, bedoeld in de vorige 3 volzinnen, kan worden afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel120
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel124
      [ref3]: https://wetten.overheid.nl/BWBR0003420#Artikel125
      [ref4]: https://wetten.overheid.nl/BWBR0003420#Artikel132
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel119a
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '120'
        hoofdstuk: I
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '124'
        hoofdstuk: I
        afdeling: '5'
      - id: ref3
        bwb_id: BWBR0003420
        artikel: '125'
        hoofdstuk: I
        afdeling: '5'
      - id: ref4
        bwb_id: BWBR0003420
        artikel: '132'
        hoofdstuk: I
        afdeling: '7'
  - number: '120.1'
    text: |-
      Voor de bekostiging van personeel wordt een bedrag per leerling toegekend, welk bedrag wordt verhoogd met een
      bedrag dat wordt vermenigvuldigd met de gewogen gemiddelde leeftijd van de leraren van de school op 1 oktober van
      het voorafgaande schooljaar. Voor het schooljaar waarin een nieuwe basisschool respectievelijk nieuwe speciale
      school voor basisonderwijs wordt geopend, wordt vermenigvuldigd met de geraamde landelijk gewogen gemiddelde
      leeftijd op 1 oktober van het voorafgaande schooljaar van de leraren van basisscholen respectievelijk van de
      leraren van speciale scholen voor basisonderwijs.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel120
  - number: '120.2'
    text: 'De bedragen, bedoeld in het eerste lid, kunnen in elk geval verschillend worden vastgesteld voor leerlingen:'
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel120
  - number: 120.2.a
    text: van een basisschool in de leeftijd van 4 tot en met 7 jaar;
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel120
  - number: 120.2.b
    text: van een basisschool in de leeftijd van 8 jaar en ouder; en
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel120
  - number: 120.2.c
    text: van speciale scholen voor basisonderwijs.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel120
  - number: '120.3'
    text: |-
      Bij algemene maatregel van bestuur wordt bepaald in welke gevallen en onder welke voorwaarden aanvullende
      bekostiging voor personeelskosten kan worden toegekend. In ieder geval wordt aanvullende bekostiging toegekend
      voor kleine basisscholen, schoolleiding, de bestrijding van onderwijsachterstanden, groei van het aantal leerlingen
      van basisscholen gedurende het schooljaar en indien onderwijs wordt gegeven in een of meer nevenvestigingen van
      een basisschool. De omvang van de aanvullende vergoeding wordt bij of krachtens algemene maatregel van bestuur
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel120
  - number: '120.4'
    text: |-
      De gezamenlijke speciale scholen voor basisonderwijs van een samenwerkingsverband, ofwel, indien van het
      samenwerkingsverband geen speciale school voor basisonderwijs deel uitmaakt, het samenwerkingsverband, ontvangen
      respectievelijk ontvangt tevens een bekostiging voor ondersteuningsvoorzieningen. De in de eerste volzin bedoelde
      bekostiging is gebaseerd op 2% van het aantal leerlingen van alle scholen in het samenwerkingsverband op 1 oktober
      van het voorafgaande schooljaar, rekenkundig afgerond op een geheel getal. Het aantal leerlingen, bedoeld in de
      tweede volzin, wordt aan de afzonderlijke speciale scholen voor basisonderwijs toegerekend naar rato van het aantal
      leerlingen van elk van die scholen op die datum. De speciale school voor basisonderwijs ontvangt voor elke van de
      aan die school toegerekende leerling een bedrag per leerling, welk bedrag wordt verhoogd met een bedrag dat wordt
      vermenigvuldigd met de gewogen gemiddelde leeftijd van de leraren van die school op 1 oktober van het voorafgaande
      schooljaar. Indien alle bevoegde gezagsorganen van de scholen in het samenwerkingsverband ermee instemmen dat van
      het samenwerkingsverband geen speciale school voor basisonderwijs deel uitmaakt, ontvangt het samenwerkingsverband
      voor de leerlingen, bedoeld in de tweede volzin, een bedrag per leerling, welk bedrag wordt verhoogd met een bedrag
      dat wordt vermenigvuldigd met de geraamde landelijk gewogen gemiddelde leeftijd van leraren van speciale scholen
      voor basisonderwijs.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel120
  - number: '120.5'
    text: |-
      Bij ministeriële regeling worden de bedragen, bedoeld in het eerste lid en het vierde lid vastgesteld. Het bedrag
      per leerling en het vermenigvuldigingsbedrag van de verhoging zijn de uitkomst van een bij algemene maatregel van
      bestuur vast te stellen hoeveelheid formatie per leerling vermenigvuldigd met een bedrag.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel120
  - number: '120.6'
    text: |-
      Bij de vaststelling van de bedragen, bedoeld in het vijfde lid, wordt in ieder geval rekening gehouden met de
      ontwikkeling van de geraamde landelijk gewogen gemiddelde leeftijd en de genormeerde gemiddelde personeelslasten
      van leraren van basisscholen dan wel speciale scholen voor basisonderwijs, en worden nadere regels vastgesteld
      met betrekking tot de vaststelling van de in het eerste en het vierde lid bedoelde gewogen gemiddelde leeftijd en
      geraamde landelijk gewogen gemiddelde leeftijd. Indien aanvullende bekostiging wordt toegekend voor een bepaalde
      categorie personeel kan in afwijking van de eerste volzin rekening worden gehouden met de genormeerde gemiddelde
      personeelslasten van die categorie personeel.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel120
  - number: '120.7'
    text: |-
      De bekostiging, bedoeld in het eerste lid, en de bekostiging voor kleine basisscholen, schoolleiding, groei van het
      aantal leerlingen van een basisschool gedurende het schooljaar en een of meer nevenvestigingen van een basisschool,
      bedoeld in de tweede volzin van het derde lid, is redelijkerwijs voldoende voor het leiden en beheren van de
      school, voor het geven van onderwijs aan de school en voor de overige werkzaamheden die verband houden met het
      onderwijs aan de school.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel120
  - number: '121.1'
    text: |-
      Voor de toepassing van [artikel 120, eerste lid][ref1], geldt het aantal leerlingen van de school op 1 oktober van
      het voorafgaande schooljaar.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel120
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel121
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '120'
        hoofdstuk: I
        afdeling: '5'
  - number: '121.2'
    text: |-
      Voor de toepassing van [artikel 120, eerste lid][ref1], voor het schooljaar waarin een nieuwe school
      wordt geopend en voor het daaropvolgende schooljaar geldt het aantal leerlingen van de school op 1 oktober
      volgende op de opening. De eerste volzin is van overeenkomstige toepassing op een afdeling als bedoeld in
      [artikel 85a, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel120
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel85a
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel121
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '120'
        hoofdstuk: I
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: 85a
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '2'
  - number: '121.3'
    text: |-
      Voor de toepassing van [artikel 120, eerste lid][ref1], geldt ingeval van samenvoeging van scholen het aantal
      leerlingen van alle bij de samenvoeging betrokken scholen, voor elke school vastgesteld volgens het eerste lid, en
      de gewogen gemiddelde leeftijd van de leraren van alle bij de samenvoeging betrokken scholen op 1 oktober van het
      voorafgaande schooljaar.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel120
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel121
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '120'
        hoofdstuk: I
        afdeling: '5'
  - number: '121.4'
    text: |-
      Op het aantal leerlingen, bedoeld in het eerste lid, van het overblijvende deel van de school, bedoeld in
      [artikel 84a, tweede lid, onderdeel b][ref1], wordt het aantal leerlingen in mindering gebracht dat op grond van
      het tweede lid meetelt voor de bekostiging van een nieuwe school die op grond van artikel 84a voor bekostiging in
      aanmerking is gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel84a
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel121
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 84a
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '2'
  - number: '121.5'
    text: |-
      Indien van het aantal leerlingen, bedoeld in het tweede lid, van een nieuwe school die voor bekostiging in
      aanmerking is gebracht, een substantieel aantal leerlingen afkomstig is van andere scholen van hetzelfde bevoegd
      gezag, worden die leerlingen niet meegeteld voor de bekostiging van die andere scholen op grond van het eerste
      lid. Bij algemene maatregel van bestuur wordt de omvang van dat aantal leerlingen bepaald, die voor categorieën van
      scholen kan verschillen.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel121
  - number: '122'
    text: |-
      De Overgangswet WBO zoals die luidde op 31 juli 1998 blijft van toepassing op aanspraken die op die datum op grond
      van artikel E 17 of E 18 van die wet bestonden.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel122
  - number: '123.1'
    text: |-
      Indien bijzondere ontwikkelingen in het basisonderwijs daartoe aanleiding geven, kunnen bij ministeriële regeling
      voorschriften worden vastgesteld omtrent het verstrekken van bijzondere bekostiging voor personeelskosten.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel123
  - number: '123.2'
    text: |-
      In verband met bijzondere omstandigheden kan Onze Minister op aanvraag van het bevoegd gezag van een basisschool
      onder door hem op te leggen verplichtingen bijzondere bekostiging voor personeelskosten verstrekken.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel123
  - number: '123.3'
    text: |-
      Een aanvraag als bedoeld in het tweede lid wordt ingediend ten hoogste vier maanden voorafgaand aan het schooljaar
      waarin de bijzondere omstandigheden zich zullen voordoen en niet later dan in het schooljaar waarin die bijzondere
      omstandigheden zich hebben voorgedaan. Onze Minister besluit binnen vier maanden na ontvangst van een in het tweede
      lid bedoelde aanvraag.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel123
  - number: '123.4'
    text: |-
      Onze Minister kan in verband met de in het eerste en tweede lid bedoelde bekostiging een bekostigingsplafond
      instellen. In dat geval worden bij ministeriële regeling regels omtrent de verdeling vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel123
  - number: '124.1'
    text: |-
      Indien op 1 februari het aantal leerlingen van de speciale scholen voor basisonderwijs in een samenwerkingsverband
      meer bedraagt dan het aantal leerlingen van die scholen op 1 oktober daaraan voorafgaand, draagt het
      samenwerkingsverband voor het verschil per leerling een bij ministeriële regeling vast te stellen bedrag over aan
      de speciale scholen voor basisonderwijs, welk bedrag wordt verhoogd met een bedrag dat wordt vermenigvuldigd met de
      geraamde landelijk gewogen gemiddelde leeftijd van leraren van speciale scholen voor basisonderwijs.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel124
  - number: '124.2'
    text: |-
      Indien op 1 februari het aantal leerlingen van de speciale scholen voor basisonderwijs in een samenwerkingsverband
      meer bedraagt dan 2% van het aantal leerlingen op de vestigingen van de scholen in het samenwerkingsverband op
      1 oktober daaraan voorafgaand, draagt het samenwerkingsverband voor elke leerling van een speciale school voor
      basisonderwijs boven voornoemde 2% per leerling een bij ministeriële regeling vast te stellen bedrag over aan de
      speciale scholen voor basisonderwijs, welk bedrag wordt verhoogd met een bedrag dat afhankelijk is van de geraamde
      landelijk gewogen gemiddelde leeftijd van leraren van speciale scholen voor basisonderwijs.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel124
  - number: '124.3'
    text: |-
      Bij de vaststelling ingevolge het eerste en tweede lid van het aantal leerlingen van de speciale scholen voor
      basisonderwijs in een samenwerkingsverband op de overeenkomstig [artikel 18a, achtste lid, onderdeel g][ref1],
      vastgestelde peildatum, worden leerlingen voor wie op grond van [artikel 125][ref2] al een overdracht plaatsvindt
      vanuit een ander samenwerkingsverband buiten beschouwing gelaten. De uitkomst van de berekening van 2% van het
      aantal leerlingen van het samenwerkingsverband op grond van het tweede lid wordt rekenkundig afgerond op een geheel
      getal.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel18a
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel125
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel124
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 18a
        hoofdstuk: I
        paragraaf: '2'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '125'
        hoofdstuk: I
        afdeling: '5'
  - number: '124.5'
    text: |-
      De overdracht op grond van het eerste en tweede lid heeft betrekking op het schooljaar dat volgt op de in het
      eerste onderscheidenlijk tweede lid bedoelde peildatum.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel124
  - number: '124.7'
    text: |-
      Indien de in [artikel 132, eerste lid][ref1], bedoelde bekostiging niet voldoende is om daaruit de verplichtingen,
      bedoeld in dit artikel na te komen, dragen de bevoegde gezagsorganen van de gezamenlijke basisscholen in het
      samenwerkingsverband de ontbrekende bekostiging over aan het samenwerkingsverband. Het aandeel van de onderscheiden
      basisscholen in de overdrachtsverplichting, bedoeld in de eerste volzin, wordt bepaald overeenkomstig de regeling
      die daarvoor op grond van [artikel 18a, achtste lid, onderdeel h][ref2], in het ondersteuningsplan van het
      samenwerkingsverband is opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel132
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel18a
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel124
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '132'
        hoofdstuk: I
        afdeling: '7'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: 18a
        hoofdstuk: I
        paragraaf: '2'
        afdeling: '1'
  - number: '124.8'
    text: |-
      Het bedrag per leerling, bedoeld in het eerste en het tweede lid, en het vermenigvuldigingsbedrag van de verhoging,
      bedoeld in het eerste en het tweede lid, zijn de uitkomst van een bij algemene maatregel van bestuur vast te
      stellen hoeveelheid formatie per leerling, vermenigvuldigd met een bedrag. Bij de vaststelling van de bedragen
      wordt in ieder geval rekening gehouden met de ontwikkeling van de geraamde landelijk gewogen gemiddelde leeftijd en
      de genormeerde gemiddelde personeelslast van leraren van speciale scholen voor basisonderwijs.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel124
  - number: '124.9'
    text: |-
      In afwijking van het eerste en het tweede lid kan het samenwerkingsverband besluiten dat in plaats van met
      de landelijk gewogen leeftijd, wordt vermenigvuldigd met de gewogen gemiddelde leeftijd van de leraren van de
      desbetreffende speciale school voor basisonderwijs.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel124
  - number: '125.1'
    text: |-
      Het samenwerkingsverband draagt per leerling een bij ministeriële regeling vast te stellen bedrag over aan de
      speciale school voor basisonderwijs, welk bedrag wordt verhoogd met een bedrag dat wordt vermenigvuldigd met de
      geraamde landelijk gewogen gemiddelde leeftijd van leraren van speciale scholen voor basisonderwijs indien
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel125
  - number: 125.1.a
    text: |-
      de speciale school voor basisonderwijs een leerling toelaat van een basisschool in het desbetreffende
      samenwerkingsverband,
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel125
  - number: 125.1.b
    text: de speciale school geen deel uitmaakt van het desbetreffende samenwerkingsverband, en
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel125
  - number: 125.1.c
    text: |-
      het samenwerkingsverband heeft bepaald dat de leerling op het onderwijs van een speciale school voor basisonderwijs
      is aangewezen.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel125
  - number: '125.2'
    text: |-
      Het bedrag per leerling, bedoeld in het eerste lid, en het vermenigvuldigingsbedrag van de verhoging, bedoeld in
      het eerste lid, zijn de uitkomst van een bij algemene maatregel van bestuur vast te stellen hoeveelheid formatie
      per leerling vermenigvuldigd met een bedrag. Bij de vaststelling van de bedragen wordt in ieder geval rekening
      gehouden met de ontwikkeling van de geraamde landelijk gewogen gemiddelde leeftijd en de genormeerde gemiddelde
      personeelslast van leraren van speciale scholen voor basisonderwijs. In de algemene maatregel van bestuur, bedoeld
      in de vorige volzin, kan voor de verschillende schooljaren en afhankelijk van het moment van de toelating tot de
      speciale school voor basisonderwijs een verschillende hoeveelheid formatie worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel125
  - number: '125.3'
    text: |-
      De in het eerste lid bedoelde overdracht vindt voor het eerst plaats voor het schooljaar volgend op het schooljaar
      van de toelating tot de speciale school voor basisonderwijs.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel125
  - number: '125.4'
    text: |-
      De in het eerste lid bedoelde overdracht vindt niet plaats als de toelating plaatsvindt binnen 6 maanden voor of na
      een verhuizing van de ouders van een woning buiten het gebied van het samenwerkingsverband van de speciale school
      voor basisonderwijs naar een woning binnen dat gebied.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel125
  - number: '125.5'
    text: |-
      De overdracht, bedoeld in het eerste lid, eindigt met ingang van het schooljaar dat volgt op het schooljaar waarin
      de leerling de speciale school voor basisonderwijs verlaat.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel125
  - number: '125.6'
    text: |-
      [Artikel 124, zevende lid][ref1], is van overeenkomstige toepassing op de overdrachtsverplichting, bedoeld in
      het eerste lid, met dien verstande dat ook speciale scholen voor basisonderwijs een aandeel kunnen hebben in de
      overdrachtsverplichting.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel124
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel125
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '124'
        hoofdstuk: I
        afdeling: '5'
  - number: 125a
    text: |-
      Indien het totaal van de bedragen, bedoeld in [artikel 132, vierde lid, eerste volzin, en vijfde lid][ref1],
      de personeelsbekostiging van het samenwerkingsverband, bedoeld in artikel 132, tweede lid, overschrijdt, wordt
      het bedrag waarmee die bekostiging wordt overschreden door Onze Minister in mindering gebracht op de personele
      bekostiging van alle scholen en scholen voor speciaal onderwijs en speciaal en voortgezet speciaal onderwijs
      behorend tot cluster 3 en 4, bedoeld in de [Wet op de expertisecentra][ref2], waarvan één of meer vestigingen zijn
      gelegen in het gebied van het samenwerkingsverband. Het bedrag dat in mindering wordt gebracht wordt per school
      dan wel school voor speciaal onderwijs of speciaal en voortgezet speciaal onderwijs behorend tot cluster 3 en 4,
      bedoeld in de Wet op de expertisecentra, voor zover het betreft het daaraan verzorgde speciaal onderwijs, bepaald
      op basis van het leerlingenaantal van de desbetreffende vestiging of vestigingen in het samenwerkingsverband.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel132
      [ref2]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel125a
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '132'
        hoofdstuk: I
        afdeling: '7'
      - id: ref2
        bwb_id: BWBR0003549
  - number: 125b.1
    text: |-
      Indien op 1 februari het aantal leerlingen dat door het samenwerkingsverband toelaatbaar is verklaard tot het
      speciaal onderwijs en is ingeschreven op scholen voor speciaal onderwijs en speciaal en voortgezet speciaal
      onderwijs behorend tot cluster 3 en 4, bedoeld in de [Wet op de expertisecentra][ref1] meer bedraagt dan op
      1 oktober daaraan voorafgaand, draagt het samenwerkingsverband voor het verschil per leerling een bedrag over aan
      de school waar de leerling is ingeschreven. Het in de eerste volzin bedoelde bedrag is de som van:


      [ref1]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel125b
    references:
      - id: ref1
        bwb_id: BWBR0003549
  - number: 125b.1.a
    text: |-
      een bedrag dat afhankelijk is van de in de toelaatbaarheidsverklaring opgenomen ondersteuningsbehoefte van de
      leerling en dat overeenkomt met één van de normbedragen die bij ministeriële regeling worden vastgesteld, en
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel125b
  - number: 125b.1.b
    text: |-
      een bij ministeriële regeling vast te stellen bedrag dat afhankelijk is van de leeftijd van de leerling, welk
      bedrag wordt verhoogd met een bedrag dat wordt vermenigvuldigd met de geraamde landelijk gewogen gemiddelde
      leeftijd van leraren van scholen voor speciaal onderwijs.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel125b
  - number: 125b.2
    text: |-
      De overdracht op grond van het eerste lid heeft betrekking op het schooljaar dat volgt op de in het eerste lid
      bedoelde peildatum.
    url: https://wetten.overheid.nl/BWBR0003420/2021-08-01#Artikel125b
  - number: 125b.3
    text: |-
      Indien de in [artikel 132, tweede lid][ref1], bedoelde bekostiging niet voldoende is om daaruit de verplichtingen,
      bedoeld in dit artikel na te komen, dragen alle scholen en scholen voor speciaal onderwijs en speciaal en
      voortgezet speciaal onderwijs behorend tot cluster 3 en 4, bedoeld in de [Wet op de expertisecentra][ref2], waarvan
      één of meer vestigingen zijn gelegen in het gebied van het samenwerkingsverband, de ontbrekende bekostiging over
      aan het samenwerkingsverband. Het aandeel van de onderscheiden scholen en scholen voor speciaal onderwijs en
      speciaal en voortgezet speciaal onderwijs, bedoeld in de eerste volzin, wordt bepaald overeenkomstig de regeling
      die daarvoor op grond van [artikel 18a, achtste lid, onderdeel j][ref3], in het ondersteuningsplan van het
      samenwerkingsverband is opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel132
      [ref2]: https://wetten.overheid.nl/BWBR0003549
      [ref3]: https://wetten.overheid.nl/BWBR0003420#Artikel18a
