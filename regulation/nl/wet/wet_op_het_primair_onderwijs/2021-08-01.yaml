  - number: '157.2'
    text: |-
      Indien een bevoegd gezag scholen in stand houdt in meer dan 1 gemeente, of in meer dan 1 deel van een
      gemeente waarvoor op grond van [artikel 155][ref1] opheffingsnormen zijn vastgesteld, wordt, in afwijking van
      [artikel 153, eerste tot en met derde lid][ref2], de bekostiging van een bijzondere school niet beëindigd en
      een openbare school niet opgeheven op grond van artikel 153 indien de school ten minste 23 leerlingen telt en
      de gemiddelde schoolgrootte van alle scholen van dat bevoegd gezag ten minste 10/6x het gewogen gemiddelde van
      de voor elk van die gemeenten en delen van gemeenten geldende opheffingsnormen, dan wel ten minste 290 bedraagt
      en het bevoegd gezag tijdig de in [artikel 160, tweede lid][ref3], bedoelde mededeling heeft gedaan. Het gewogen
      gemiddelde, bedoeld in de eerste volzin, wordt vastgesteld door het aantal scholen van het bevoegd gezag in elke
      gemeente of elk deel van een gemeente te vermenigvuldigen met de voor die gemeente onderscheidenlijk dat deel
      geldende opheffingsnorm en de som van de verkregen uitkomsten te delen door het totale aantal scholen van het
      bevoegd gezag. Indien het bevoegd gezag dat bij de mededeling, bedoeld in de eerste volzin, aangeeft, tellen bij
      de toepassing van de gemiddelde schoolgrootte en het gewogen gemiddelde niet mee de door hem aangeduide scholen die
      sinds de aanvang van de bekostiging niet meer dan 8 schooljaren zijn bekostigd en waarvan het aantal leerlingen,
      voor zover het niet betreft het aantal leerlingen van een nevenvestiging, niet heeft voldaan aan de stichtingsnorm
      op grond waarvan de school voor bekostiging in aanmerking werd genomen. De derde volzin is niet van toepassing op
      scholen als bedoeld in [artikel 84][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel155
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel153
      [ref3]: https://wetten.overheid.nl/BWBR0003420#Artikel160
      [ref4]: https://wetten.overheid.nl/BWBR0003420#Artikel84
