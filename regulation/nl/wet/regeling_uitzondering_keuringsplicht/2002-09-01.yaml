preamble:
  text: |-
    Gelet op artikel 73, derde lid, van de Wegenverkeerswet 1994;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0009149/2002-09-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 [Artikel 72, eerste lid, van de Wegenverkeerswet 1994][ref1] is niet van toepassing op:

      a. een voertuig waarvoor een kenteken is opgegeven dat de lettergroep ZZ of de enkele letter A, E, H, K, L, N, P,
      S, T, V, W, X of Z en twee groepen van twee cijfers bevat;

      b. een voertuig waarvoor een kenteken is opgegeven ter zake waarvan een kentekenbewijs als bedoeld in
      [artikel 17, zesde lid, van het Kentekenreglement][ref2] is afgegeven;

      c. een voertuig op de dag dat deze door ambtenaren van de Dienst Wegverkeer of door de ambtenaren, bedoeld in
      [artikel 141 van het Wetboek van Strafvordering][ref3], worden onderzocht in verband met de afgifte of wijziging
      van een kentekenbewijs of met de teruggave van het voor dat voertuig afgegeven kentekenbewijs waarvan op grond van
      [artikel 60 van de wet][ref4] de overgifte is gevorderd;.

      d. rijdende werktuigen, niet zijnde motorrijtuigen met beperkte snelheid, met:

      1∞ een lengte van meer dan 12,00 m,

      2∞ een breedte van meer dan 2,55 m indien de toegestane maximum massa niet meer bedraagt dan 10.000 kg,

      3∞ een breedte van meer dan 2,60 m indien de toegestane maximum massa meer bedraagt dan 10.000 kg,

      4∞ een toegestane maximum massa van meer dan 50.000 kg, dan wel

      5∞ een toegestane maximum last onder enige as van meer dan 10.000 kg voor een niet-aangedreven as dan wel van meer
      dan 11.500 kg voor een aangedreven as.

      2 Van de in het eerste lid, onderdeel d, bedoelde uitzondering wordt melding gemaakt op het kentekenbewijs.


