$id: regeling_uitzondering_keuringsplicht
regulatory_layer: WET
publication_date: '2009-04-29'
valid_from: '2002-09-01'
bwb_id: BWBR0009149
url: https://wetten.overheid.nl/BWBR0009149/2002-09-01
preamble:
  text: |-
    Gelet op artikel 73, derde lid, van de Wegenverkeerswet 1994;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0009149/2002-09-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      [Artikel 72, eerste lid, van de Wegenverkeerswet 1994][ref1] is niet van toepassing op:


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel72
    url: https://wetten.overheid.nl/BWBR0009149/2002-09-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '72'
  - number: 1.1.a
    text: |-
      een voertuig waarvoor een kenteken is opgegeven dat de lettergroep ZZ of de enkele letter A, E, H, K, L, N, P, S,
      T, V, W, X of Z en twee groepen van twee cijfers bevat;
    url: https://wetten.overheid.nl/BWBR0009149/2002-09-01#Artikel1
  - number: 1.1.b
    text: |-
      een voertuig waarvoor een kenteken is opgegeven ter zake waarvan een kentekenbewijs als bedoeld in
      [artikel 17, zesde lid, van het Kentekenreglement][ref1] is afgegeven;


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel17
    url: https://wetten.overheid.nl/BWBR0009149/2002-09-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '17'
  - number: 1.1.c
    text: |-
      een voertuig op de dag dat deze door ambtenaren van de Dienst Wegverkeer of door de ambtenaren, bedoeld in
      [artikel 141 van het Wetboek van Strafvordering][ref1], worden onderzocht in verband met de afgifte of wijziging
      van een kentekenbewijs of met de teruggave van het voor dat voertuig afgegeven kentekenbewijs waarvan op grond van
      [artikel 60 van de wet][ref2] de overgifte is gevorderd;.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel60
    url: https://wetten.overheid.nl/BWBR0009149/2002-09-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '60'
  - number: 1.1.d
    text: 'rijdende werktuigen, niet zijnde motorrijtuigen met beperkte snelheid, met:'
    url: https://wetten.overheid.nl/BWBR0009149/2002-09-01#Artikel1
  - number: 1.1.d.1∞
    text: een lengte van meer dan 12,00 m,
    url: https://wetten.overheid.nl/BWBR0009149/2002-09-01#Artikel1
  - number: 1.1.d.2∞
    text: een breedte van meer dan 2,55 m indien de toegestane maximum massa niet meer bedraagt dan 10.000 kg,
    url: https://wetten.overheid.nl/BWBR0009149/2002-09-01#Artikel1
  - number: 1.1.d.3∞
    text: een breedte van meer dan 2,60 m indien de toegestane maximum massa meer bedraagt dan 10.000 kg,
    url: https://wetten.overheid.nl/BWBR0009149/2002-09-01#Artikel1
  - number: 1.1.d.4∞
    text: een toegestane maximum massa van meer dan 50.000 kg, dan wel
    url: https://wetten.overheid.nl/BWBR0009149/2002-09-01#Artikel1
  - number: 1.1.d.5∞
    text: |-
      een toegestane maximum last onder enige as van meer dan 10.000 kg voor een niet-aangedreven as dan wel van meer dan
      11.500 kg voor een aangedreven as.
    url: https://wetten.overheid.nl/BWBR0009149/2002-09-01#Artikel1
  - number: '1.2'
    text: Van de in het eerste lid, onderdeel d, bedoelde uitzondering wordt melding gemaakt op het kentekenbewijs.
    url: https://wetten.overheid.nl/BWBR0009149/2002-09-01#Artikel1
  - number: '2'
    text: |-
      De regeling van de Minister van Verkeer en Waterstaat van 5 december 1994, nr. RV 187592, houdende aanwijzing van
      voertuigen die zijn uitgezonderd van de keuringsplicht, bedoeld in [artikel 72 van de Wegenverkeerswet 1994][ref1]
      (Stcrt. 239), wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel72
    url: https://wetten.overheid.nl/BWBR0009149/2002-09-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '72'
  - number: '3'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0009149/2002-09-01#Artikel3
  - number: '4'
    text: 'Deze regeling wordt aangehaald als: Regeling uitzondering keuringsplicht.'
    url: https://wetten.overheid.nl/BWBR0009149/2002-09-01#Artikel4
