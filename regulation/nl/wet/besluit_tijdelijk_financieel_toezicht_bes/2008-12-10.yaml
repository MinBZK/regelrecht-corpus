      1 Tegen een besluit van het College financieel toezicht tot het afgeven van een afkeurende of gedeeltelijk
      afkeurende verklaring inzake het uitvoeren van een begroting of een begrotingswijziging staat voor een
      bestuurscollege gedurende dertig dagen na verzending van het besluit, beroep open bij Ons. De Raad van State
      van het Koninkrijk is belast met het voorbereiden van het ontwerpbesluit inzake de beslissing op het beroep.
      Ons besluit wordt in het Publicatieblad van de Nederlandse Antillen bekend gemaakt en ter kennis van het
      bestuurscollege en de eilandsraad van het betrokken eilandgebied gebracht.

      2 Het eerste lid is van overeenkomstige toepassing op een besluit van Onze Minister als bedoeld in
      [artikel 14, derde lid][ref1], [artikel 15, vierde lid][ref2], en [artikel 18, vijfde lid][ref3].

      3 De Raad van State van het Koninkrijk kan bij de voorbereiding van het ontwerpbesluit, bedoeld in het eerste lid,
      belanghebbenden, getuigen, deskundigen en tolken oproepen om tijdens het onderzoek ter zitting te worden gehoord.

      4 De [artikelen 32 tot en met 35 van de Wet op de Raad van State][ref4] zijn van overeenkomstige toepassing.

      5 De [artikelen 6:5][ref5], [6:6][ref6], [6:14][ref7], [6:15][ref8], [6:17][ref9] en [6:21][ref10],
      [8:24][ref11], [8:25][ref12], [8:27 tot en met 8:29][ref13], [8:31][ref14], [8:32][ref15],
      [8:33 tot en met 8:36, eerste lid][ref16], [8:39][ref17], [8:50][ref18] , [8:61][ref19] en
      [8:62 van de Algemene wet bestuursrecht][ref20] zijn van overeenkomstige toepassing. Ambtsberichten en andere door
      Onze Minister aangewezen stukken zijn niet openbaar.

      6 Het ontwerp van een koninklijk besluit als bedoeld in het eerste lid, is niet openbaar.

      7 [Artikel 18a van de Wet op de Raad van State][ref21] is van overeenkomstige toepassing. Het onderzoek ter zitting
      is openbaar.

      8 Het beroep schorst niet de werking van het besluit waartegen het is gericht.

      9 De Raad van State van het Koninkrijk kan een procesreglement vaststellen voor de behandeling van het
      beroep, bedoeld in het eerste of tweede lid, en van het verzoek om een voorlopige voorziening, bedoeld in
      [artikel 29][ref22].

      10 Binnen een maand nadat het ontwerpbesluit is opgesteld kan Onze Minister de Raad gemotiveerd verzoeken zijn
      ontwerp in nadere overweging te nemen. Indien het koninklijk besluit afwijkt van het ontwerp of het nader ontwerp,
      wordt het in het Staatsblad geplaatst met het ontwerp, bedoeld in het eerste lid en indien daarvan sprake is,
      het nader ontwerp. Indien niet binnen een maand een verzoek als bedoeld in de eerste volzin is gedaan, luidt het
      koninklijk besluit overeenkomstig het ontwerpbesluit.

      11 Binnen dertig dagen na verzending van andere dan in het eerste en tweede lid bedoelde besluiten van het College
      financieel toezicht kan een bestuurscollege of een andere rechtspersoon die deel uitmaakt van de collectieve sector
      verzoeken om heroverweging, indien zij door die besluiten rechtstreeks in de aan hen toevertrouwde belangen worden
      getroffen. Het College financieel toezicht beslist binnen een week op dit verzoek.

      12 Besluiten van het College financieel toezicht en van Onze Minister op grond van dit besluit zijn niet vatbaar
      voor beroep bij de administratieve rechter op grond van de Landsverordening Administratieve rechtsspraak of de
      [Algemene wet bestuursrecht][ref23]. Dit geldt eveneens voor Ons besluit als bedoeld in het eerste lid.


