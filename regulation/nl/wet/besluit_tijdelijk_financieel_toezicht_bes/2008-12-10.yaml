  - number: '15'
    text: |-
      1 Zolang het College financieel toezicht met betrekking tot de begrotingen voor de jaren na 2008 geen goedkeurende
      verklaring heeft verleend, blijft de goedgekeurde begroting van het jaar voorafgaande aan het jaar waarover de
      begroting wordt ingediend, van kracht.

      2 Het College financieel toezicht toetst de begroting over het voorafgaande jaar aan de criteria genoemd in
      [artikel 16][ref1].

      3 Indien de toetsing daartoe aanleiding geeft, stelt het College financieel toezicht een nieuwe ontwerpbegroting op
      met inachtneming van de criteria genoemd in [artikel 16][ref2].

      4 De vaststelling van de in het derde lid bedoelde begroting geschiedt in overeenstemming met het gevoelen van de
      raad van ministers van het Koninkrijk door Onze Minister.


