  - number: '16'
    text: |-
      1 Voor de beoordeling van de ontwerpbegroting en van de vastgestelde begroting van een eilandgebied hanteert het
      College financieel toezicht de volgende criteria:

      a. de gewone dienst en de kapitaaldienst vertonen geen tekort;

      b. in de begroting zijn alle voorgenomen uitgaven en verwachte ontvangsten opgenomen;

      c. in de begroting zijn de meerjarige uitgaven als gevolg van de voorgenomen verplichtingen opgenomen;

      d. in de begroting is het verband met de begroting van het voorafgaande jaar aangegeven;

      e. de rentelastnorm wordt niet overschreden;

      f. de begroting is toelaatbaar uit een oogpunt van een rechtmatig, doelmatig, ordelijk en controleerbaar financieel
      beheer;

      g. de in de begroting opgenomen uitgaven en ontvangsten zijn in overeenstemming met de best mogelijke inschatting
      van reeds aangegane financiële verplichtingen en van te verwachten externe ontwikkelingen;

      h. de in de begroting opgenomen financiële verplichtingen en uitgaven brengen geen onaanvaardbare risico’s met zich
      mee voor toekomstige begrotingsjaren;

      i. de begroting voldoet overigens aan de geldende regelgeving.

      2 Het criterium, bedoeld in het eerste lid, onderdeel a, geldt niet gedurende de drie eerstvolgende begrotingsjaren
      na inwerkingtreding van dit besluit, indien Onze Minister en Onze Minister van Financiën enerzijds en een
      bestuurscollege anderzijds overeenstemming hebben over het tijdpad en de tekortreeks om te komen tot een sluitende
      gewone dienst. Gedurende deze periode kan het bestuurscollege de financiering van de tekorten op de gewone dienst
      alleen aantrekken bij het College financieel toezicht.
    url: https://wetten.overheid.nl/BWBR0022921/2008-12-10#Artikel16
  - number: '17'
    text: |-
      1 De rentelastnorm voor de collectieve sector van een eilandgebied bedraagt 0% gemiddeld per begrotingsjaar.

      2 Liquiditeitstekorten ten gevolge van afwijkingen in de gerealiseerde uitgaven en ontvangsten van de gewone dienst
      worden, na instemming van het College financieel toezicht, gedekt door het toestaan van een tekort op de rekening-
      courant, bedoeld in [artikel 24, derde lid][ref1] (rekening-courantkrediet).

      3 Het College financieel toezicht stelt per maand, per kwartaal of per half jaar een maximum vast van het tekort
      op een rekening-courant, dan wel het minimum van het tegoed op een rekening-courant, zodanig dat het toegestane
      rekening-courantkrediet niet leidt tot overschrijding van de geldende rentelastnorm in het begrotingsjaar.

      4 Een eilandgebied is niet bevoegd kredieten anders dan bij het College financieel toezicht op te nemen.

      5 De norm, bedoeld in het eerste lid, geldt niet gedurende de drie eerstvolgende begrotingsjaren na
      inwerkingtreding van dit besluit, indien Onze Minister en Onze Minister van Financiën enerzijds en een
      bestuurscollege anderzijds overeenstemming hebben over het tijdpad en de tekortreeks om te komen tot een sluitende
      gewone dienst. Gedurende deze periode kan het bestuurscollege de financiering van de tekorten op de gewone dienst
      alleen aantrekken bij het College financieel toezicht.


      [ref1]: https://wetten.overheid.nl/BWBR0022921#Artikel24
    url: https://wetten.overheid.nl/BWBR0022921/2008-12-10#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0022921
        artikel: '24'
        hoofdstuk: '5'
  - number: '18'
    text: |-
      1 Beleidsmaatregelen die gevolgen hebben voor de uitgaven of de ontvangsten op de begroting, worden door het
      bestuurscollege en de eilandsraad uitgevoerd door middel van een daartoe geëigende voorziening.

      2 Indien het bestuurscollege de in het eerste lid bedoelde voorziening niet vaststelt of op een zodanig tijdstip
      vaststelt, implementeert of uitvoert dat de haalbaarheid van de uitgaven- en ontvangstenramingen in gevaar
      komt, rapporteert het College financieel toezicht hierover aan Onze Minister en Onze Minister van Financiën van
      Nederland.

      3 Het College financieel toezicht rapporteert eveneens aan Onze Minister en Onze Minister van Financiën van
      Nederland indien een eilandsraad niet met een voorgestelde voorziening instemt of daarmee op een zodanig tijdstip
      instemt dat de haalbaarheid van de uitgaven- en ontvangstenramingen in gevaar komt.

      4 Het College financieel toezicht zendt de betreffende bestuurscolleges en eilandsraden een afschrift van het
      rapport.

      5 Onze Minister kan, in overeenstemming met het gevoelen van de raad van ministers van het Koninkrijk en in
      afwachting van de totstandkoming of implementatie van de bedoelde voorziening, besluiten het College financieel
      toezicht te belasten met het vaststellen van bijzondere maatregelen en het zelfstandig uitvoeren hiervan.
    url: https://wetten.overheid.nl/BWBR0022921/2008-12-10#Artikel18
  - number: '19'
    text: |-
      1 Een bestuurscollege zendt uiterlijk drie weken na afloop van ieder kwartaal uitvoeringsrapportages en zo nodig
      ontwerpen van begrotingswijzigingen aan het College financieel toezicht.

      2 Ontwerpen van begrotingswijzigingen worden in ieder geval voorgelegd met betrekking tot:

      a. wijzigingen in de ramingen van de verplichtingen, de uitgaven en de ontvangsten van het lopende jaar;

      b. voornemens tot nieuw beleid.

      3 Het College financieel toezicht toetst deze ontwerpen van begrotingswijzigingen aan de criteria, genoemd
      in [artikel 16][ref1]. Hij betrekt hierbij de ontwikkeling van het saldo op de rekening-courant, bedoeld in
      [artikel 24, derde lid][ref2].

      4 Op ontwerpen van begrotingswijzigingen en op de vaststelling van begrotingswijzigingen zijn de
      [artikelen 11][ref3], [12][ref4] en [14][ref5] van toepassing.

      5 Ten aanzien van de toepassing van [artikel 14][ref6] geldt dat ingevolge het eerste lid ingezonden ontwerpen van
      begrotingswijzigingen uiterlijk zes weken na aanvang van ieder kwartaal zijn vastgesteld.

      6 Na de vaststelling van de begrotingswijzigingen maken deze deel uit van de begroting voor het lopende jaar.


