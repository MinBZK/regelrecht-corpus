    text: |-
      1 Indien op de in [artikel 11, eerste lid][ref1], bedoelde datum geen ontwerpbegroting voor het jaar 2008 aan het
      College financieel toezicht is voorgelegd, stelt het College financieel toezicht de ontwerpbegroting voor dat jaar
      op. Het College financieel toezicht informeert hierover de raad van ministers van het Koninkrijk door tussenkomst
      van Onze Minister.

      2 Het College financieel toezicht neemt bij de opstelling van de ontwerpbegroting de criteria van
      [artikel 16][ref2] in acht.

      3 Het bestuurscollege dient deze ontwerpbegroting in bij de eilandsraad.

      4 [Artikel 12][ref3] is van toepassing op de in dit artikel bedoelde begroting.


