        artikel: '19'
        hoofdstuk: '5'
  - number: '21'
    text: |-
      1 Het College financieel toezicht kan met een bestuurscollege afspraken maken ter verbetering van het financieel
      beheer, het materieel beheer en de daarvoor bij te houden administraties.

      2 Het College financieel toezicht kan het bestuurscollege ter zake van de in het eerste lid genoemde onderwerpen
      algemene en bijzondere aanwijzingen geven.

      3 Het College financieel toezicht geeft deze aanwijzingen op het terrein van het financieel beheer met inachtneming
      van de bevindingen van de accountant en van de Algemene Rekenkamer van de Nederlandse Antillen.

      4 Het bestuurscollege neemt de aanwijzingen, bedoeld in het tweede en derde lid, in acht.

      5 Voor de afspraken inzake de verbeteringen in het financieel beheer maakt het College financieel toezicht gebruik
      van de bevindingen van de accountant en van de Algemene Rekenkamer van de Nederlandse Antillen.

      6 Het College financieel toezicht houdt toezicht op de inrichting van de controle die plaatsvindt in het kader van
      de uitvoering van de begroting.
    url: https://wetten.overheid.nl/BWBR0022921/2008-12-10#Artikel21
  - number: '22'
    text: |-
      1 Een bestuurscollege gaat uitsluitend financiële verplichtingen aan voor zover deze zijn opgenomen in een
      begroting die in uitvoering mag worden genomen.

      2 Het bestuurscollege legt het voornemen tot het aangaan van een financiële verplichting voor advies voor aan
      het hoofd Financiën van het eilandgebied of, bij zijn afwezigheid, aan zijn eerste of tweede plaatsvervanger. Een
      positief advies wordt verleend indien de financiële verplichting voortvloeit uit de uitvoering van de begroting.

      3 Namens het eilandgebied is uitsluitend het hoofd Financiën van dat eilandgebied of zijn eerste of tweede
      plaatsvervanger gemachtigd tot het verrichten van privaatrechtelijke rechtshandelingen die voortvloeien uit een
      besluit tot het aangaan van een financiële verplichting en waarover een positief advies als bedoeld in het tweede
      lid is verleend.

      4 Indien het bestuurscollege zonder een positief advies, bedoeld in het tweede lid, de in dat lid bedoelde
      functionarissen niettemin opdraagt een verplichting aan te gaan of de daarmee verband houdende privaatrechtelijke
      rechtshandelingen te verrichten, informeert de betrokken functionaris het College financieel toezicht daarover.

      5 Het College financieel toezicht geeft ter zake van de door de betrokken functionaris voorgelegde aangelegenheden
      een aanwijzing. Het bestuurscollege en de betrokken functionaris nemen deze aanwijzing in acht.

      6 Het bestuurscollege deponeert de namen en functies van de personen, bedoeld in het tweede en derde lid, bij
      het College financieel toezicht. Het College financieel toezicht houdt hiervan een register bij en publiceert dit
      register na de vaststelling ervan, na elke wijziging, maar in elk geval iedere zes maanden.

      7 Het College financieel toezicht kan na overleg met Onze Minister, handelende in overeenstemming met het gevoelen
      van de raad van ministers van het Koninkrijk, begrotingen of begrotingsartikelen aanwijzen ten laste waarvan geen
      financiële verplichtingen mogen worden aangegaan, voordat het daarmee heeft ingestemd.

      8 De inhoud van de aangewezen begrotingen of begrotingsartikelen, bedoeld in het zevende lid, worden, zolang ze
      zijn aangewezen, opgenomen in het register, bedoeld in het zesde lid.

      9 Privaatrechtelijke rechtshandelingen betreffende het aangaan van financiële verplichtingen als bedoeld in dit
      artikel zijn niet geldig indien:

      a. de regels in dit besluit omtrent de bevoegdheid van de handelende personen niet zijn nageleefd, of

      b. deze handelingen begrotingen of begrotingsartikelen betreffen die ingevolge het achtste lid zijn opgenomen in
      het register, bedoeld in het zesde lid.

      10 In geval van het aangaan van financiële verplichtingen en het verrichten van privaatrechtelijke
      rechtshandelingen waartoe door de eilandsraad is besloten, is dit artikel van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0022921/2008-12-10#Artikel22
  - number: '23'
    text: |-
      1 Namens het eilandgebied is uitsluitend het hoofd Financiën van het eilandgebied of, bij zijn afwezigheid
      zijn eerste of tweede plaatsvervanger, bevoegd tot het verrichten van betalingen die voortvloeien uit door een
      bestuursorgaan aangegane financiële verplichtingen. Zij kunnen de eilandsontvanger machtigen de genoemde betalingen
      te verrichten.

      2 [Artikel 22, vierde en vijfde lid][ref1], is van overeenkomstige toepassing op opdrachten van het bestuurscollege
      tot het doen van betalingen, bedoeld in het eerste lid.

      3 In afwijking van het eerste lid kunnen betalingen door anderen dan de gemachtigden worden verricht voor zover zij
      contant betalen of gebruik maken van een bankpas of creditcard, onverminderd het bepaalde in het achtste lid.

      4 Betalingen namens het eilandgebied, zowel onderling als aan derde partijen, worden uitsluitend verricht via het
      bancaire betalingsverkeer, behoudens het bepaalde in het derde lid.

      5 Met de schriftelijke instemming van het College financieel toezicht en onder door hem te stellen voorwaarden kan
      van het vierde lid worden afgeweken.

      6 Het bestuurscollege bevordert dat derde partijen hun betalingen aan het eilandgebied verrichten ten gunste van de
      betrokken ontvangstenrekening van het eilandgebied.

      7 Ontvangen contante gelden en cheques worden op de dag van ontvangst gestort op de ontvangstenrekening van het
      eilandgebied.

      8 Het doen van contante betalingen, het gebruik van bankpassen, creditcards, chippassen en andere elektronische
      betaalwijzen is, zonder voorafgaande schriftelijke instemming van het College financieel toezicht, niet toegestaan.
      In overleg met het bestuurscollege kan het College financieel toezicht voor het gebruik van een creditcard een
      bestedingslimiet vaststellen.

      9 Betalingen namens het eilandgebied geschieden tegen voldoende kwijting.

      10 Het als geldelijke betaling in ontvangst nemen van niet-geldelijke zaken is niet toegestaan. Met de
      schriftelijke instemming van het College financieel toezicht kan hiervan worden afgeweken.

      11 Het afgeven aan derden en het in ontvangst nemen van derden van geldswaardige papieren in de vorm van effecten
      (aandelen en obligaties) geschiedt tegen een voldoende kwijting.

      12 Het verlenen van voorschotten op aan derde partijen te verrichten betalingen geschiedt met inachtneming van
      door het College financieel toezicht na overleg met het bestuurscollege op te stellen regels inzake het verlenen
      van voorschotten.


