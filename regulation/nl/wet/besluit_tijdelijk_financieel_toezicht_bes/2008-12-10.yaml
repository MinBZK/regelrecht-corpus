  - number: '30'
    text: |-
      1 Indien de inzending van de ontwerpbegroting 2008 of de begroting 2008 niet plaatsvindt binnen de daartoe
      in [hoofdstuk 3][ref1] gestelde termijnen of indien het College financieel toezicht op deze begroting geen
      goedkeurende verklaring kan geven, kan het college een tijdelijke voorziening treffen, gericht op het verkrijgen
      van een goedkeurende verklaring als bedoeld in [artikel 12][ref2]. De voorziening eindigt uiterlijk drie maanden na
      het verlenen van de toestemming.

      2 Bij regeling van Onze Minister kan bepaald worden dat de toepassing van artikelen of onderdelen daarvan tijdelijk
      wordt opgeschort wegens voorbereidende werkzaamheden door het College financieel toezicht of het bestuurscollege
      ten behoeve van de uitvoerbaarheid van die artikelen of onderdelen daarvan.

      3 In afwijking van [artikel 16, eerste lid, onderdeel a, en tweede lid][ref3], wordt de rentelast, voortvloeiend
      uit de door Nederland over te nemen leningen, niet betrokken bij de beoordeling van het tekort op de gewone dienst.


      [ref1]: https://wetten.overheid.nl/BWBR0022921#Hoofdstuk3
