preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Binnenlandse Zaken en Koninkrijksrelaties van 11 juli 2007, nr. 2007-
    0000253355, Directie Koninkrijksrelaties, gedaan mede namens Onze Minister van Financiën;

    Overwegende, dat er overeenstemming bestaat tussen Nederland, de Nederlandse Antillen en de eilandgebieden Bonaire,
    Sint Eustatius en Saba over toekomstige nieuwe staatkundige verhoudingen van deze eilandgebieden, te weten de
    totstandkoming van een status als Nederlands openbaar lichaam voor Bonaire, Sint Eustatius en Saba;

    dat in de Miniconferentie van 10 en 11 oktober 2006 met de eilandgebieden Bonaire, Sint Eustatius en Saba is
    afgesproken dat de openbare financiën van deze eilandgebieden van de Nederlandse Antillen op orde moeten worden
    gebracht om deze eilanden een goede startpositie te geven en dat daartoe bij algemene maatregel van rijksbestuur
    toezicht zal worden ingesteld;

    dat met de Nederlandse Antillen en met de eilandgebieden Bonaire, Sint Eustatius en Saba overeenstemming bestaat
    over de vormgeving van het financieel toezicht voor deze eilandgebieden;

    dat wordt gestreefd naar een startdatum van de nieuwe staatkundige verhoudingen op 15 december 2008;

    Gelet op artikel 38, tweede lid, van het Statuut voor het Koninkrijk der Nederlanden;

    De Raad van State van het Koninkrijk gehoord (advies van 23 augustus 2007, no. W04.07.0242/I/K);

    Gezien het nader rapport van de Staatssecretaris van Binnenlandse Zaken en Koninkrijksrelaties van 23 oktober 2007,
    nr. 2007-0000431714, uitgebracht mede namens Onze Minister van Financiën;

    De bepalingen van het Statuut voor het Koninkrijk in acht genomen zijnde:

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0022921/2008-12-10#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

        - begroting: het jaarlijkse overzicht van de geraamde uitgaven en ontvangsten van een eilandgebied, inclusief een
      daarbij behorende toelichting, bestaande uit een deeloverzicht omvattende de lopende uitgaven en ontvangsten (de
      gewone dienst) en een deeloverzicht omvattende de kapitaaluitgaven en kapitaalontvangsten (de kapitaaldienst);
        - bestuurscollege: het bestuurscollege van een eilandgebied;
        - collectieve sector: de gezamenlijkheid van de rechtspersonen die op basis van het System of National Accounts van
      de Verenigde Naties tot de sector overheid worden gerekend;
        - eilandgebied: het eilandgebied Bonaire, Sint Eustatius of Saba;
        - eilandsraad: de eilandsraad van een eilandgebied;
        - geconsolideerde schuld: de gezamenlijke schulden van de collectieve sector van een eilandgebied in de vorm van
      leningen en kredieten, met uitzondering van de onderlinge schulden van de betreffende collectieve sector;
        - kapitaaluitgaven: uitgaven die ingevolge de geldende definitie van het System of National Accounts van de
      Verenigde Naties op de kapitaaldienst van de overheidsrekening worden geboekt;
        - Onze Minister: Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties;
        - rentelast: de uitgaven aan rente in een begrotingsjaar over de geconsolideerde schuld van de collectieve sector
      van een eilandgebied, weergegeven als percentage van de gemiddelde ontvangsten van de collectieve sector van het
      eilandgebied over de drie jaren voorafgaand aan het jaar waarin de begroting wordt ingediend;
        - rentelastnorm: de norm dat de rentelast van een eilandgebied niet hoger is dan het percentage, genoemd in
      [artikel 17, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022921#Artikel17
