    text: |-
      1 Indien een dreigende overschrijding van de rentelastnorm wordt veroorzaakt door uitgaven- en
      ontvangstenontwikkelingen in de collectieve sector, niet zijnde een eilandgebied, kan het College financieel
      toezicht na overleg met Onze Minister, handelende in overeenstemming met het gevoelen van de raad van ministers van
      het Koninkrijk, regels stellen ter beheersing van de rentelasten van de collectieve sector.

      2 Ter beoordeling van deze uitgaven- en ontvangstenontwikkeling, rapporteert het Centraal Bureau voor de
      Statistiek van de Nederlandse Antillen in samenwerking met de Bank Nederlandse Antillen en het Nederlandse Centraal
      Bureau voor de Statistiek aan het College financieel toezicht en aan de raad van ministers van het Koninkrijk,
      gelijktijdig met de jaarrekeningen van de eilandgebieden, over de voorlopige uitgaven-, ontvangsten-, tekort-
      en schuldcijfers van de collectieve sector van de eilandgebieden. Daarbij zijn de definities van het System of
      National Accounts leidend.
    url: https://wetten.overheid.nl/BWBR0022921/2008-12-10#Artikel25
  - number: '26'
    text: |-
      1 In dit artikel wordt onder deelnemen in een privaatrechtelijke rechtspersoon verstaan het houden van aandelen of
      onderdeel uitmaken van het bestuur van die rechtspersoon.

      2 Een bestuurscollege of een eilandgebied neemt met ingang van de datum van inwerkingtreding van dit besluit niet
      deel in een privaatrechtelijke rechtspersoon en richt geen privaatrechtelijke rechtspersoon op zonder voorafgaande
      schriftelijke toestemming van het College financieel toezicht.

      3 Benoemingen en herbenoemingen van vertegenwoordigers van een bestuurscollege of een eilandgebied in een
      privaatrechtelijke rechtspersoon worden vooraf ter goedkeuring aan het College financieel toezicht voorgelegd.
      Het college geeft de goedkeuring tot benoeming indien de vertegenwoordiger over voldoende deskundigheid
      beschikt en de vertegenwoordiger ook overigens voldoet aan de eisen die voortvloeien uit de beginselen van goed
      ondernemingsbestuur.

      4 Ambtenaren en politieke ambtsdragers nemen geen zitting in het bestuur van een privaatrechtelijke rechtspersoon
      waarin het eilandgebied deelneemt.

      5 Het College financieel toezicht geeft toestemming tot het oprichten van of het deelnemen in een
      privaatrechtelijke rechtspersoon als het bestuurscollege of het eilandgebied aannemelijk maakt dat dit noodzakelijk
      is voor het verrichten van de beoogde activiteit of ten behoeve van vervreemding van bezittingen van het
      eilandgebied.

      6 Vervreemding van bezittingen van een eilandgebied op welke wijze dan ook, geschiedt tegen marktcomforme
      voorwaarden en behoeft instemming vooraf van het College financieel toezicht voor alle onroerende zaken, aandelen
      en concessies en voor roerende zaken, indien met toepassing van die voorwaarden voorzien kan worden dat met de
      vervreemding een geldelijk belang is gemoeid van meer dan Naf 10.000,–.

      7 Het College financieel toezicht kan op grond van overwegingen van deugdelijk beheer dwingende voorschriften
      geven aan de vertegenwoordiger van een bestuurscollege of een eilandgebied in een privaatrechtelijke rechtspersoon
      met het oog op de standpuntbepaling in de aandeelhouders- of bestuursvergadering op het terrein van het
      dividendbeleid, de benoeming, het ontslag en de salarissen van bestuurders. De vertegenwoordiger neemt in elk
      geval het standpunt in dat investeringen en desinvesteringen door de rechtspersoon voor goedkeuring aan de algemene
      aandeelhoudersvergadering, respectievelijk het bestuur worden voorgelegd.

      8 Het bestuurscollege stelt de jaarrekeningen van de privaatrechtelijke rechtspersonen waarin het of het
      eilandgebied deelneemt uiterlijk zes maanden na afloop van het boekjaar aan het College financieel toezicht ter
      beschikking.
    url: https://wetten.overheid.nl/BWBR0022921/2008-12-10#Artikel26
  - number: '27'
    text: |-
      Indien dit nodig is in verband met het herstel van schade veroorzaakt door buitengewone gebeurtenissen, waaronder
      natuurrampen, kan het College financieel toezicht, na overleg met het betreffende bestuurscollege en Onze Minister,
      handelende in overeenstemming met de raad van ministers van het Koninkrijk, afwijken van de [artikelen 16][ref1]
      en [17][ref2].


