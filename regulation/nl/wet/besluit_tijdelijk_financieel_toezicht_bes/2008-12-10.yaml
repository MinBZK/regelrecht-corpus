  - number: '20'
    text: |-
      1 Uiterlijk 1 april van ieder jaar verstrekt het bestuurscollege de jaarrekening van het voorafgaande jaar aan het
      College financieel toezicht.

      2 Het College financieel toezicht laat deze jaarrekening controleren door een registeraccountant.

      3 Indien uit de jaarrekening blijkt dat sprake is van een tekort op de gewone dienst of op de kapitaaldienst
      of van een overschrijding van de rentelastnorm, geeft het College financieel toezicht aan het bestuurscollege
      een advies voor wijziging van de begroting voor het lopende jaar en voor de begroting voor het komende jaar.
      [Artikel 19][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0022921#Artikel19
