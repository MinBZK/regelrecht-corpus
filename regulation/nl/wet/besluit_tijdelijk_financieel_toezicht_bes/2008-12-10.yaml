  - number: '24'
    text: |-
      1 Met ingang van een door het College financieel toezicht te bepalen datum draagt het bestuurscollege, in
      overeenstemming met het College financieel toezicht, er zorg voor:

      a. dat voor het doen van betalingen en het incasseren van ontvangsten aparte bankrekeningen zijn geopend bij een of
      meer banken, al naar gelang de doelmatigheid dat vereist;

      b. dat creditsaldi op de bankrekeningen dagelijks aan het eind van de dag worden overgeboekt naar de bankrekening
      van het College financieel toezicht;

      c. dat het College financieel toezicht dagelijks afschriften ontvangt van de mutaties op de bankrekeningen.

      2 Het College financieel toezicht draagt er zorg voor dat debetsaldi op de bankrekeningen dagelijks aan het eind
      van de dag worden aangevuld.

      3 De mutaties op de in het eerste lid, onder b, bedoelde bankrekening worden door het College financieel toezicht
      voor elk van de eilandgebieden bijgehouden op een rekening-courant.

      4 Het College financieel toezicht vergoedt over creditsaldi op de rekening-courant een creditrente en brengt over
      debetsaldi een debetrente in rekening. Het percentage van de creditrente en van de debetrente zijn aan elkaar
      gelijk en gelijk aan de Euro Overnight Index Average.

      5 De [Regeling rekening-courant- en leningenbeheer derden][ref1] is van overeenkomstige toepassing.


