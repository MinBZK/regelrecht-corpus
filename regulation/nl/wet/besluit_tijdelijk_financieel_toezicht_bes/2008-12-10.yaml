      1 Indien de begroting voor het jaar 2008 niet op een door het College financieel toezicht te bepalen tijdstip is
      vastgesteld, stelt het College financieel toezicht een ontwerpbegroting op.

      2 Het College financieel toezicht neemt bij de opstelling van de ontwerpbegroting de criteria van
      [artikel 16][ref1] in acht.

      3 De vaststelling van de in dit artikel bedoelde begroting geschiedt in overeenstemming met het gevoelen van de
      raad van ministers van het Koninkrijk door Onze Minister.


