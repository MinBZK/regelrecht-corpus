  - number: '2'
    text: |-
      In dit besluit wordt verstaan onder College financieel toezicht: het College financieel toezicht, genoemd in
      [artikel 2 van het Besluit tijdelijk financieel toezicht Nederlandse Antillen, Curaçao en Sint Maarten][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024823#Artikel2
    url: https://wetten.overheid.nl/BWBR0022921/2008-12-10#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0024823
        artikel: '2'
  - number: '4'
    text: |-
      De taken van het College financieel toezicht op grond van dit besluit zijn, onverminderd de in andere artikelen
      genoemde taken:

      a. het toezicht op de toepassing van de bij dit besluit vastgestelde normen ter zake van de voorbereiding, de
      uitvoering en de verantwoording van de begroting door het eilandgebied, alsmede het toezicht op de verbetering van
      het financieel beheer, de inrichting en de werking van de administraties en het betalingsverkeer;

      b. het toetsen of aan de bij dit besluit vastgestelde voorwaarden is voldaan voor het aangaan van kredieten door
      een eilandgebied.
    url: https://wetten.overheid.nl/BWBR0022921/2008-12-10#Artikel4
  - number: '8'
    text: |-
      1 De bestuurscolleges verstrekken het College financieel toezicht alle inlichtingen die deze voor de uitoefening
      van zijn taken nodig acht.

      2 De bestuurscolleges verlenen het College financieel toezicht dan wel door hem aangewezen vertegenwoordigers, te
      allen tijde toegang tot dan wel inzage in alle goederen, administraties, documenten en andere informatiedragers.

      3 Het College financieel toezicht kan na overleg met Onze Minister, handelende in overeenstemming met het gevoelen
      van de raad van ministers van het Koninkrijk, regels stellen over de verstrekking van gegevens door de collectieve
      sector, niet zijnde een eilandgebied.
    url: https://wetten.overheid.nl/BWBR0022921/2008-12-10#Artikel8
  - number: '9'
    text: |-
      1 De uitgaven en ontvangsten, samenhangende met het verstrekken van rekening-courantkredieten door het College
      financieel toezicht aan een eilandgebied, komen ten laste respectievelijk ten gunste van de begroting van Onze
      Minister.

      2 De valutarisico’s, samenhangende met het verstrekken van rekening-courantkredieten door het College financieel
      toezicht aan een eilandgebied, komen voor rekening van de begroting van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0022921/2008-12-10#Artikel9
  - number: '11'
    text: |-
      1 Het bestuurscollege zendt voor een door het College financieel toezicht te bepalen datum de ontwerpbegroting voor
      het komende jaar aan hem toe. Aan de ontwerpbegroting worden de ramingen voor het op het begrotingsjaar volgende
      jaar toegevoegd.

      2 Het College financieel toezicht toetst de ontwerpbegroting en ramingen aan de criteria, genoemd in
      [artikel 16][ref1].

      3 Het College financieel toezicht zendt binnen veertien dagen na ontvangst van de ontwerpbegroting aan het
      bestuurscollege een advies bevattende zijn bevindingen met betrekking tot de uitgevoerde toetsing en aanbevelingen
      met betrekking tot aanpassing van de begroting.

      4 Het bestuurscollege dient de ontwerpbegroting in bij de eilandsraad en geeft daarbij aan op welke wijze rekening
      is gehouden met de bevindingen en aanbevelingen van het College financieel toezicht.

      5 Het bestuurscollege legt de op de ontwerpbegroting ingediende amendementen onmiddellijk na indiening voor
      advisering voor aan het College financieel toezicht. Het College financieel toezicht brengt, na de toetsing bedoeld
      in het tweede lid, aan het bestuurscollege binnen drie werkdagen na ontvangst zijn advies uit over de amendementen.


      [ref1]: https://wetten.overheid.nl/BWBR0022921#Artikel16
    url: https://wetten.overheid.nl/BWBR0022921/2008-12-10#Artikel11
