  - number: '12'
    text: |-
      1 Het bestuurscollege legt de begroting, onmiddellijk nadat deze door de eilandsraad is vastgesteld, voor aan het
      College financieel toezicht.

      2 Het College financieel toezicht toetst de vastgestelde begrotingen aan de criteria, genoemd in
      [artikel 16][ref1].

      3 Het College financieel toezicht zendt binnen veertien dagen na ontvangst van de vastgestelde begrotingen aan het
      bestuurscollege een goedkeurende verklaring, een gedeeltelijk afkeurende verklaring of een afkeurende verklaring
      inzake de uitvoering van de begroting.

      4 Eerst na ontvangst van een goedkeurende verklaring of een gedeeltelijk afkeurende verklaring neemt het
      bestuurscollege de begroting, respectievelijk het niet afgekeurde deel van de begroting in uitvoering.

      5 Een afkeurende en een gedeeltelijk afkeurende verklaring maakt de vaststelling van de begroting, respectievelijk
      van de afgekeurde gedeelten van de begroting, door de eilandsraad ongedaan.

      6 Het bestuurscollege stelt zo spoedig mogelijk na ontvangst van een afkeurende of een gedeeltelijk afkeurende
      verklaring een nieuwe ontwerpbegroting op.

      7 Op deze ontwerpbegroting zijn [artikel 11][ref2] en het eerste tot en met het zesde lid van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0022921#Artikel16
