$id: wet_beperking_tabaksgebruik_bes
regulatory_layer: WET
publication_date: '2010-10-01'
valid_from: '2010-10-10'
bwb_id: BWBR0028544
url: https://wetten.overheid.nl/BWBR0028544/2010-10-10
articles:
  - number: '1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0028544/2010-10-10#Artikel1
  - number: 1.a
    text: |-
      *tabaksprodukten:* sigaren, sigaretten en kerftabak, geheel of gedeeltelijk bestaande uit bestanddelen van de plant
      Nicotiana;
    url: https://wetten.overheid.nl/BWBR0028544/2010-10-10#Artikel1
  - number: 1.b
    text: '*kerftabak:* shag, pijp-, pruim- en sniftabak;'
    url: https://wetten.overheid.nl/BWBR0028544/2010-10-10#Artikel1
  - number: 1.c
    text: |-
      *de openbare gebouwen:* de gebouwen die door de Staat en de openbare lichamen Bonaire, Sint Eustatius en Saba
      worden beheerd;
    url: https://wetten.overheid.nl/BWBR0028544/2010-10-10#Artikel1
  - number: 1.d
    text: '*het bevoegd gezag:*'
    url: https://wetten.overheid.nl/BWBR0028544/2010-10-10#Artikel1
  - number: 1.d.1
    text: voor wat betreft de Staat de betrokken minister;
    url: https://wetten.overheid.nl/BWBR0028544/2010-10-10#Artikel1
  - number: 1.d.2
    text: voor wat betreft de openbare lichamen Bonaire, Sint Eustatius en Saba het bestuurscollege;
    url: https://wetten.overheid.nl/BWBR0028544/2010-10-10#Artikel1
  - number: 1.d.3
    text: |-
      voor wat betreft inrichtingen als bedoeld in [artikel 3][ref1], de directeur.


      [ref1]: https://wetten.overheid.nl/BWBR0028544#Artikel3
    url: https://wetten.overheid.nl/BWBR0028544/2010-10-10#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0028544
        artikel: '3'
  - number: '2.1'
    text: |-
      Het bevoegd gezag treft voor de openbare gebouwen zodanige maatregelen, dat van de daarin geboden voorzieningen
      gebruik kan worden gemaakt en de werkzaamheden kunnen worden verricht zonder dat daarbij hinder van het gebruik van
      tabaksprodukten wordt ondervonden.
    url: https://wetten.overheid.nl/BWBR0028544/2010-10-10#Artikel2
  - number: '2.2'
    text: |-
      Tot de maatregelen, bedoeld in het eerste lid, behoort in ieder geval het instellen en handhaven van een
      verbod tabaksprodukten te gebruiken in ruimten behorende tot de bij algemene maatregel van bestuur, aangewezen
      categorieën. Op het verbod kan het bevoegd gezag, overeenkomstig bij algemene maatregel van bestuur, te stellen
      regelen, beperkingen aanbrengen.
    url: https://wetten.overheid.nl/BWBR0028544/2010-10-10#Artikel2
  - number: '3.1'
    text: |-
      Bij algemene maatregel van bestuur, kan aan degenen die – anders dan in een hoedanigheid als bedoeld in
      [artikel 2, eerste lid][ref1] – het beheer hebben over inrichtingen voor gezondheidszorg, maatschappelijke
      dienstverlening, sport, sociaal-cultureel werk of onderwijs, voor zover die inrichtingen behoren tot bij algemene
      maatregel van bestuur, aangewezen categorieën, de verplichting worden opgelegd tot het treffen van maatregelen als
      bedoeld in artikel 2, eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0028544#Artikel2
    url: https://wetten.overheid.nl/BWBR0028544/2010-10-10#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0028544
        artikel: '2'
  - number: '3.2'
    text: |-
      [Artikel 2, tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028544#Artikel2
    url: https://wetten.overheid.nl/BWBR0028544/2010-10-10#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0028544
        artikel: '2'
  - number: '4'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028544/2010-10-10#Artikel4
  - number: '5'
    text: 'Deze wet wordt aangehaald als: Wet beperking tabaksgebruik BES.'
    url: https://wetten.overheid.nl/BWBR0028544/2010-10-10#Artikel5
