---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_op_bijzondere_medische_verrichtingen
regulatory_layer: WET
publication_date: '2025-06-04'
valid_from: '2019-04-02'
bwb_id: BWBR0008974
url: https://wetten.overheid.nl/BWBR0008974/2019-04-02
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is in de regulering van de bijzondere verrichtingen zoals
    omschreven in de Wet ziekenhuisvoorzieningen, een gradatie aan te brengen en de desbetreffende regels, te zamen met
    die inzake ontwikkelingsgeneeskunde, in een afzonderlijke wettelijke regeling onder te brengen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0008974/2019-04-02#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0008974/2019-04-02#Artikel1
  - number: 1.a
    text: 'Onze Minister: Onze Minister van Volksgezondheid, Welzijn en Sport;'
    url: https://wetten.overheid.nl/BWBR0008974/2019-04-02#Artikel1
  - number: 1.b
    text: |-
      medische verrichtingen: handelingen op het gebied van de individuele gezondheidszorg in de zin van de
      [Wet op de beroepen in de individuele gezondheidszorg][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006251
    url: https://wetten.overheid.nl/BWBR0008974/2019-04-02#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006251
  - number: 1.c
    text: |-
      ontwikkelingsgeneeskunde: de op wetenschappelijk inzicht gebaseerde ontwikkeling en evaluatie van methoden en
      technieken in de praktijk van de gezondheidszorg, waarvan de uiteindelijke toepassing ingrijpende kwalitatieve,
      maatschappelijke, ethische, juridische, financiële of organisatorische gevolgen kan hebben.
    url: https://wetten.overheid.nl/BWBR0008974/2019-04-02#Artikel1
  - number: '2.1'
    text: 'Indien gewichtige belangen daartoe aanleiding geven, kan Onze Minister bij ministeriële regeling bepalen:'
    url: https://wetten.overheid.nl/BWBR0008974/2019-04-02#Artikel2
  - number: 2.1.a
    text: |-
      dat het verboden is zonder zijn vergunning medische verrichtingen van een bij de regeling aangegeven aard uit te
      voeren;
    url: https://wetten.overheid.nl/BWBR0008974/2019-04-02#Artikel2
  - number: 2.1.b
    text: |-
      dat het verboden is zonder zijn vergunning apparatuur van een bij de regeling aangegeven aard ten behoeve van het
      uitvoeren van medische verrichtingen aan te schaffen of te gebruiken.
    url: https://wetten.overheid.nl/BWBR0008974/2019-04-02#Artikel2
  - number: '2.2'
    text: |-
      De vaststelling krachtens het eerste lid van een ministeriële regeling houdende beëindiging van een verbod als in
      dat lid bedoeld, wordt niet eerder gedaan dan vier weken nadat een ontwerp aan beide kamers der Staten-Generaal
      is overgelegd.
    url: https://wetten.overheid.nl/BWBR0008974/2019-04-02#Artikel2
  - number: '3.1'
    text: |-
      Indien een medische verrichting, gezien de maatschappelijke, ethische of juridische aspecten, ongewenst is en
      de omstandigheden van dien aard zijn dat de totstandkoming van een regeling van die verrichting bij wet niet kan
      worden afgewacht, kan bij algemene maatregel van bestuur worden bepaald dat het verboden is zodanige medische
      verrichting uit te voeren.
    url: https://wetten.overheid.nl/BWBR0008974/2019-04-02#Artikel3
  - number: '3.2'
    text: |-
      Een krachtens het eerste lid vastgestelde maatregel wordt aan de beide kamers der Staten-Generaal overgelegd. Hij
      treedt in werking op een tijdstip dat nadat vier weken na de overlegging zijn verstreken bij koninklijk besluit
      wordt vastgesteld, tenzij binnen die termijn door of namens een der kamers of door ten minste een vijfde van het
      grondwettelijk aantal leden van een der kamers de wens te kennen wordt gegeven dat het onderwerp van de algemene
      maatregel van bestuur bij wet wordt geregeld. In dat geval wordt een daartoe strekkend voorstel van wet zo spoedig
      mogelijk ingediend. Indien het voorstel van wet wordt ingetrokken of indien een van de beide kamers van de Staten-
      Generaal besluit het voorstel niet aan te nemen, wordt de algemene maatregel van bestuur ingetrokken.
    url: https://wetten.overheid.nl/BWBR0008974/2019-04-02#Artikel3
  - number: '3.3'
    text: |-
      Een krachtens het eerste lid vastgestelde maatregel vervalt twee jaar na de inwerkingtreding. Indien binnen die
      termijn een wetsvoorstel tot regeling van het onderwerp is ingediend bij de Tweede Kamer der Staten-Generaal,
      vervalt de maatregel op het tijdstip waarop een van de beide kamers der Staten-Generaal besluit het wetsvoorstel
      niet aan te nemen of op het tijdstip waarop het wetsvoorstel kracht van wet krijgt.
    url: https://wetten.overheid.nl/BWBR0008974/2019-04-02#Artikel3
  - number: '4.1'
    text: |-
      Met betrekking tot medische verrichtingen waarvoor subsidie wordt verstrekt door Onze Minister in het kader van
      een project van ontwikkelingsgeneeskunde, kan Onze Minister, indien het belang van dat project of een belang als
      bedoeld in [artikel 2][ref1] daartoe aanleiding geeft dan wel indien moet worden onderzocht of de verrichting,
      gezien de maatschappelijke, ethische of juridische aspecten, al dan niet gewenst is, bij ministeriële regeling
      bepalen dat het verboden is die medische verrichtingen uit te voeren elders dan in de bij dat project betrokken
      instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0008974#Artikel2
    url: https://wetten.overheid.nl/BWBR0008974/2019-04-02#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0008974
        artikel: '2'
        hoofdstuk: II
        paragraaf: '1'
  - number: '4.2'
    text: |-
      Een regeling als bedoeld in het eerste lid vervalt een jaar na het tijdstip waarop de subsidiëring van dat project
      wordt beëindigd.
    url: https://wetten.overheid.nl/BWBR0008974/2019-04-02#Artikel4
  - number: '5'
    text: |-
      Onze Minister bepaalt bij ministeriële regeling de omvang van de behoefte aan verrichtingen en apparatuur, bedoeld
      in [artikel 2, eerste lid, onder a onderscheidenlijk b][ref1], alsmede de wijze waarop in die behoefte kan worden
      voorzien.


      [ref1]: https://wetten.overheid.nl/BWBR0008974#Artikel2
    url: https://wetten.overheid.nl/BWBR0008974/2019-04-02#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0008974
        artikel: '2'
        hoofdstuk: II
        paragraaf: '1'
  - number: '6.1'
    text: |-
      Een vergunning als bedoeld in [artikel 2, eerste lid][ref1], kan slechts worden geweigerd indien het verlenen
      daarvan in strijd zou zijn met het bepaalde krachtens [artikel 5][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008974#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0008974#Artikel5
    url: https://wetten.overheid.nl/BWBR0008974/2019-04-02#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0008974
        artikel: '2'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0008974
        artikel: '5'
        hoofdstuk: II
        paragraaf: '1'
  - number: '6.2'
    text: |-
      Bij ministeriële regeling wordt de procedure met betrekking tot de vergunningverlening vastgesteld. Een vergunning
      kan onder beperkingen worden verleend. Aan een vergunning kunnen voorschriften worden verbonden. De beperkingen en
      voorschriften kunnen worden gewijzigd of ingetrokken en nieuwe beperkingen of voorschriften kunnen worden gesteld.
    url: https://wetten.overheid.nl/BWBR0008974/2019-04-02#Artikel6
  - number: '6.3'
    text: |-
      De vergunninghouder is verplicht Onze Minister periodiek de gegevens te verstrekken die Onze Minister van belang
      acht voor een goede uitvoering van [artikel 5][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008974#Artikel5
    url: https://wetten.overheid.nl/BWBR0008974/2019-04-02#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0008974
        artikel: '5'
        hoofdstuk: II
        paragraaf: '1'
  - number: '6.4'
    text: |-
      Indien bij het in werking treden van een regeling als bedoeld in [artikel 2, eerste lid, onder a of b][ref1], de
      daarin aangegeven verrichtingen reeds werden uitgevoerd onderscheidenlijk de daarin bedoelde apparatuur reeds werd
      gebruikt, niet in strijd met het bepaalde bij of krachtens deze wet, mag dit, mits hieraan geen uitbreiding wordt
      gegeven, worden voortgezet gedurende drie maanden. Onze Minister kan desgevraagd deze termijn verlengen.


      [ref1]: https://wetten.overheid.nl/BWBR0008974#Artikel2
    url: https://wetten.overheid.nl/BWBR0008974/2019-04-02#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0008974
        artikel: '2'
        hoofdstuk: II
        paragraaf: '1'
  - number: '6.5'
    text: |-
      Een vergunning als bedoeld in [artikel 2, eerste lid][ref1], kan worden ingetrokken indien de vergunninghouder in
      strijd handelt met een beperking of voorschrift als bedoeld in het tweede lid dan wel met het derde lid, alsmede
      indien de omstandigheden na de verlening van de vergunning zodanig zijn gewijzigd, dat de vergunning niet meer zou
      zijn verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0008974#Artikel2
    url: https://wetten.overheid.nl/BWBR0008974/2019-04-02#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0008974
        artikel: '2'
        hoofdstuk: II
        paragraaf: '1'
  - number: 6a.1
    text: |-
      Het uitvoeren van medische verrichtingen met toepassing van xenotransplantatie is verboden. Onder
      xenotransplantatie wordt verstaan het in- of aanbrengen van levende bestanddelen van een dier of van een foetus of
      embryo van een dier, dan wel een menselijk bestanddeel dat daarmee doelgericht in aanraking is gebracht, in of aan
      het lichaam van een mens.
    url: https://wetten.overheid.nl/BWBR0008974/2019-04-02#Artikel6a
  - number: 6a.2
    text: |-
      Bij algemene maatregel van bestuur kan het begrip xenotransplantatie nader worden omschreven en kunnen
      verrichtingen waarbij naar heersend medisch inzicht onaanvaardbare risico's voor de patiënt en de volksgezondheid
      redelijkerwijs zijn uitgesloten, worden aangewezen waarop het in het eerste lid bedoelde verbod niet van toepassing
      is.
    url: https://wetten.overheid.nl/BWBR0008974/2019-04-02#Artikel6a
  - number: '8.1'
    text: |-
      Onze Minister kan met betrekking tot medische verrichtingen waarop niet een regeling als bedoeld in
      [artikel 2][ref1] of [3][ref2] van toepassing is en die niet behoren tot de ontwikkelingsgeneeskunde, zijn
      beleidsvisie bekend maken ten aanzien van bijzondere aspecten van die verrichtingen, welke aspecten die
      verrichtingen onderscheiden van andere medische verrichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0008974#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0008974#Artikel3
    url: https://wetten.overheid.nl/BWBR0008974/2019-04-02#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0008974
        artikel: '2'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0008974
        artikel: '3'
        hoofdstuk: II
        paragraaf: '1'
  - number: '8.2'
    text: |-
      Een instelling kan Onze Minister verzoeken haar aan te wijzen voor de uitvoering van de bijzondere aspecten van
      de in het eerste lid bedoelde verrichtingen. Onze Minister kan zodanige aanwijzing uitsluitend weigeren indien het
      geven daarvan in strijd zou zijn met zijn beleidsvisie, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0008974/2019-04-02#Artikel8
  - number: '8.3'
    text: |-
      Onze Minister kan aan een aanwijzing voorschriften verbinden, voor zover die voortvloeien uit de beleidsvisie.
      [Artikel 6, derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008974#Artikel6
    url: https://wetten.overheid.nl/BWBR0008974/2019-04-02#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0008974
        artikel: '6'
        hoofdstuk: II
        paragraaf: '1'
  - number: '8.4'
    text: |-
      De beleidsvisie, bedoeld in het eerste lid, kan inhouden dat Onze Minister, voor zover dat naar zijn oordeel
      noodzakelijk is in het belang van de volksgezondheid, zorg draagt voor bekostiging van de instandhouding dan wel
      continuïteit van de uitvoering van de bijzondere aspecten van de in het eerste lid bedoelde verrichtingen door een
      instelling die op grond van het tweede lid is aangewezen.
    url: https://wetten.overheid.nl/BWBR0008974/2019-04-02#Artikel8
  - number: '9.1'
    text: |-
      Degene die een medische verrichting uitvoert waarvoor niet langer ingevolge [artikel 2][ref1] een vergunning is
      vereist, doet daarvan binnen drie maanden nadat hij met de uitvoering is begonnen mededeling aan de Inspectie
      gezondheidszorg en jeugd. Deze verplichting rust niet op degene die op de datum waarop de vergunningplicht
      eindigde, in het bezit was van een zodanige vergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0008974#Artikel2
    url: https://wetten.overheid.nl/BWBR0008974/2019-04-02#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0008974
        artikel: '2'
        hoofdstuk: II
        paragraaf: '1'
  - number: '9.2'
    text: |-
      De verplichting tot het doen van een mededeling als bedoeld in het eerste lid, eindigt twee jaar na de datum waarop
      de vergunningplicht is geëindigd.
    url: https://wetten.overheid.nl/BWBR0008974/2019-04-02#Artikel9
  - number: '9.3'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over de wijze waarop de mededeling, bedoeld in het eerste
      lid geschiedt en de gegevens die daarbij worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0008974/2019-04-02#Artikel9
  - number: '9.4'
    text: |-
      Onze Minister zendt een jaar nadat voor een medische verrichting een verplichting tot het doen van een mededeling
      als bedoeld in het eerste lid is ontstaan, aan de Staten-Generaal een verslag over de doeltreffendheid en de
      effecten van die verplichting in de praktijk.
    url: https://wetten.overheid.nl/BWBR0008974/2019-04-02#Artikel9
  - number: '10'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de ambtenaren van de
      Inspectie gezondheidszorg en jeugd.
    url: https://wetten.overheid.nl/BWBR0008974/2019-04-02#Artikel10
  - number: '11'
    text: |-
      De toezichthouders zijn bevoegd, met medeneming van de benodigde apparatuur, een woning binnen te treden zonder
      toestemming van de bewoner voor zover deze woning deel uitmaakt van een instelling.
    url: https://wetten.overheid.nl/BWBR0008974/2019-04-02#Artikel11
  - number: 11a
    text: |-
      Onze Minister is bevoegd tot oplegging van een last onder bestuursdwang ter handhaving van de bij
      [artikel 5:20, eerste lid, van de Algemene wet bestuursrecht][ref1] gestelde verplichting.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0008974/2019-04-02#Artikel11a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '12.1'
    text: |-
      Onze Minister is bevoegd een bestuurlijke boete van ten hoogste € 33.500,– op te leggen ter zake van een gedraging
      die in strijd is met het bepaalde bij of krachtens de [artikelen 2][ref1] en [4][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008974#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0008974#Artikel4
    url: https://wetten.overheid.nl/BWBR0008974/2019-04-02#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0008974
        artikel: '2'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0008974
        artikel: '4'
        hoofdstuk: II
        paragraaf: '1'
  - number: '12.2'
    text: |-
      Onze Minister is bevoegd een bestuurlijke boete van ten hoogste € 13.400,– op te leggen ter zake van een gedraging
      die in strijd is met het bepaalde bij of krachtens [artikel 9][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008974#Artikel9
    url: https://wetten.overheid.nl/BWBR0008974/2019-04-02#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0008974
        artikel: '9'
        hoofdstuk: IV
  - number: '18.1'
    text: |-
      Na de inwerkingtreding van deze wet berusten de Regeling harttransplantatie, de Regeling longtransplantatie,
      de Regeling levertransplantatie en de Regeling klinisch-genetisch onderzoek en erfelijkheidsadvisering op
      [de artikelen 2, eerste lid][ref1], en [5][ref2] van deze wet, berusten het Planningsbesluit niertransplantatie,
      het Planningsbesluit radiotherapie, het Planningsbesluit in vitro fertilisatie, het Planningsbesluit
      neonatale intensive care, het Planningsbesluit neurochirurgie, het Planningsbesluit dialyse en het
      [Planningsbesluit bijzondere interventies aan het hart][ref3] op [artikel 5][ref4] van deze wet, en berust het
      Besluit procedures voor bijzondere functies Wet ziekenhuisvoorzieningen op [artikel 6, tweede lid][ref5], van deze
      wet.


      [ref1]: https://wetten.overheid.nl/BWBR0008974#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0008974#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0008447
      [ref4]: https://wetten.overheid.nl/BWBR0008974#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0008974#Artikel6
    url: https://wetten.overheid.nl/BWBR0008974/2019-04-02#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0008974
        artikel: '2'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0008974
        artikel: '5'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0008447
      - id: ref4
        bwb_id: BWBR0008974
        artikel: '5'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref5
        bwb_id: BWBR0008974
        artikel: '6'
        hoofdstuk: II
        paragraaf: '1'
  - number: '18.2'
    text: |-
      Een vergunning, verleend op grond van
      [artikel 18, eerste lid, onder a of b, van de Wet ziekenhuisvoorzieningen][ref1], zoals dat artikel
      luidde tot de inwerkingtreding van deze wet, wordt gelijkgesteld met een vergunning, verleend op grond van
      [artikel 2, eerste lid, onder a onderscheidenlijk b, van de onderhavige wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002753#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0008974#Artikel2
    url: https://wetten.overheid.nl/BWBR0008974/2019-04-02#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0002753
        artikel: '18'
      - id: ref2
        bwb_id: BWBR0008974
        artikel: '2'
        hoofdstuk: II
        paragraaf: '1'
  - number: '18.3'
    text: |-
      Beroepen, ingesteld tegen beslissingen op grond van [artikel 18 van de Wet ziekenhuisvoorzieningen][ref1], worden
      afgewikkeld overeenkomstig de in die wet voorziene procedure, zoals die wet luidde tot de inwerkingtreding van
      deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002753#Artikel18
    url: https://wetten.overheid.nl/BWBR0008974/2019-04-02#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0002753
        artikel: '18'
  - number: '20'
    text: |-
      Onze Minister zendt binnen vier jaar na inwerkingtreding van deze wet, en vervolgens telkens na vier jaar, aan de
      Staten-Generaal een verslag over de doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0008974/2019-04-02#Artikel20
  - number: '21'
    text: |-
      Deze wet treedt in werking met ingang van de dag na de datum van uitgifte van het *Staatsblad* waarin zij wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0008974/2019-04-02#Artikel21
  - number: '22'
    text: 'Deze wet wordt aangehaald als: Wet op bijzondere medische verrichtingen.'
    url: https://wetten.overheid.nl/BWBR0008974/2019-04-02#Artikel22
