---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_beheer_rijkswaterstaatswerken
regulatory_layer: WET
publication_date: '2020-06-17'
valid_from: '2006-12-13'
bwb_id: BWBR0008331
url: https://wetten.overheid.nl/BWBR0008331/2006-12-13
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo wij in overweging genomen hebben dat de behoefte aan wettelijke middelen ter bescherming van waterstaatswerken
    in beheer bij het Rijk en ter verzekering van het doelmatig en veilig gebruik van die werken, alsook de inzichten
    inzake hetgeen daaromtrent regeling dient te vinden bij wet, zodanig zijn gewijzigd, dat het gewenst is daarvoor
    een nieuwe wettelijke regeling vast te stellen;

    Zo is het dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0008331/2006-12-13#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In deze wet en de daarop berustende bepalingen worden verstaan onder waterstaatswerken: bij het Rijk in beheer
      zijnde wateren, waterkeringen en wegen alsmede, voor zover in beheer bij het Rijk, de daarin gelegen kunstwerken en
      hetgeen verder naar hun aard daartoe behoort.
    url: https://wetten.overheid.nl/BWBR0008331/2006-12-13#Artikel1
  - number: '1.2'
    text: Onder wateren wordt mede verstaan de territoriale zee en de exclusieve economische zone.
    url: https://wetten.overheid.nl/BWBR0008331/2006-12-13#Artikel1
  - number: 1a
    text: |-
      In deze wet worden de rivieren, behorende tot de wateren in beheer bij het Rijk, begrensd door de buitenkruinlijn
      van de primaire waterkering in de zin van de [Wet op de waterkering][ref1], voor zover aangegeven op de als
      [bijlage I bij die wet][ref2] behorende landkaart, dan wel, waar zodanige waterkering ontbreekt, door de bij
      algemene maatregel van bestuur vast te stellen lijn van de hoogwaterkerende gronden.


      [ref1]: https://wetten.overheid.nl/BWBR0007801
      [ref2]: https://wetten.overheid.nl/BWBR0007801
    url: https://wetten.overheid.nl/BWBR0008331/2006-12-13#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0007801
      - id: ref2
        bwb_id: BWBR0007801
  - number: 1b
    text: Deze wet is niet van toepassing met betrekking tot mijnbouwactiviteiten binnen de exclusieve economische zone.
    url: https://wetten.overheid.nl/BWBR0008331/2006-12-13#Artikel1b
  - number: '2.1'
    text: |-
      Het is verboden zonder vergunning van Onze Minister van Verkeer en Waterstaat gebruik te maken van een
      waterstaatswerk door anders dan waartoe het is bestemd:
    url: https://wetten.overheid.nl/BWBR0008331/2006-12-13#Artikel2
  - number: 2.1.a
    text: daarin, daarop, daaronder of daarover werken te maken of te behouden;
    url: https://wetten.overheid.nl/BWBR0008331/2006-12-13#Artikel2
  - number: 2.1.b
    text: |-
      daarin, daaronder of daarop vaste stoffen of voorwerpen te storten, te plaatsen of neer te leggen, of deze te laten
      staan of liggen.
    url: https://wetten.overheid.nl/BWBR0008331/2006-12-13#Artikel2
  - number: '2.2'
    text: Een vergunning kan onder beperkingen worden verleend. Aan een vergunning kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0008331/2006-12-13#Artikel2
  - number: '2.3'
    text: Het eerste lid is niet van toepassing op het uitvoeren van gewoon onderhoud.
    url: https://wetten.overheid.nl/BWBR0008331/2006-12-13#Artikel2
  - number: 2a
    text: |-
      Bij algemene maatregel van bestuur worden binnen de ingevolge [artikel 1a][ref1] geldende begrenzing de gedeelten
      van het rivierbed aangewezen waar [artikel 2, eerste lid][ref2], vanwege de ruimte aldaar van het rivierbed
      of de ligging aldaar van bebouwd gebied, niet van toepassing is dan wel op bepaalde gedragingen niet van
      toepassing is dan wel slechts op bepaalde gedragingen van toepassing is. Tevens worden bij algemene maatregel
      van bestuur bepaalde gedragingen aangewezen waarop artikel 2, eerste lid, in het rivierbed binnen de ingevolge
      [artikel 1a][ref3] geldende begrenzing niet van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0008331#Artikel1a
      [ref2]: https://wetten.overheid.nl/BWBR0008331#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0008331#Artikel1a
    url: https://wetten.overheid.nl/BWBR0008331/2006-12-13#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0008331
        artikel: 1a
      - id: ref2
        bwb_id: BWBR0008331
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0008331
        artikel: 1a
  - number: '3.1'
    text: |-
      Weigering, wijziging of intrekking van een vergunning, alsmede toepassing van de [artikelen 2, tweede lid][ref1],
      en [6][ref2] kan slechts geschieden ter bescherming van waterstaatswerken en ter verzekering van het doelmatig en
      veilig gebruik van die werken, met inbegrip van het belang van verruiming of wijziging anderszins van die werken.


      [ref1]: https://wetten.overheid.nl/BWBR0008331#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0008331#Artikel6
    url: https://wetten.overheid.nl/BWBR0008331/2006-12-13#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0008331
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0008331
        artikel: '6'
  - number: '3.2'
    text: |-
      De in het eerste lid bedoelde besluiten kunnen mede strekken ter bescherming van aan de waterstaatswerken verbonden
      belangen van andere dan waterstaatkundige aard, doch enkel voor zover daarin niet is voorzien door bij of krachtens
      een andere wet gestelde bepalingen.
    url: https://wetten.overheid.nl/BWBR0008331/2006-12-13#Artikel3
  - number: '4'
    text: |-
      Van de aanvrager kunnen, volgens bij algemene maatregel van bestuur te stellen regels, rechten worden geheven voor
      het in behandeling nemen van aanvragen tot verlening of wijziging van een vergunning.
    url: https://wetten.overheid.nl/BWBR0008331/2006-12-13#Artikel4
  - number: '5.1'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de bij besluit van Onze
      Minister van Verkeer en Waterstaat aangewezen ambtenaren. De toezichthouder beschikt niet over de bevoegdheden,
      genoemd in de [artikelen 5:18][ref1] en [5:19 van de Algemene wet bestuursrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0008331/2006-12-13#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '5.2'
    text: |-
      Met de opsporing van de bij [artikel 11][ref1] strafbaar gestelde feiten zijn, onverminderd
      [artikel 141 van het Wetboek van Strafvordering][ref2], belast de ambtenaren, aangewezen bij besluit
      van Onze Ministers van Verkeer en Waterstaat en van Justitie. Deze ambtenaren zijn tevens belast met
      de opsporing van de feiten, strafbaar gesteld in de [artikelen 179][ref3] tot en met [182][ref4] en
      [184 van het Wetboek van Strafrecht][ref5], voor zover deze feiten betrekking hebben op een bevel, vordering of
      handeling, gedaan of ondernomen door henzelf.


      [ref1]: https://wetten.overheid.nl/BWBR0008331#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel141
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel179
      [ref4]: https://wetten.overheid.nl/BWBR0001854#Artikel182
      [ref5]: https://wetten.overheid.nl/BWBR0001854#Artikel184
    url: https://wetten.overheid.nl/BWBR0008331/2006-12-13#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0008331
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '141'
      - id: ref3
        bwb_id: BWBR0001854
        artikel: '179'
      - id: ref4
        bwb_id: BWBR0001854
        artikel: '182'
      - id: ref5
        bwb_id: BWBR0001854
        artikel: '184'
  - number: '5.3'
    text: |-
      Van een besluit als bedoeld in het eerste of tweede lid wordt mededeling gedaan door plaatsing in de
      *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0008331/2006-12-13#Artikel5
  - number: '6.1'
    text: |-
      Onze Minister van Verkeer en Waterstaat kan de toegang tot een waterstaatswerk geheel of gedeeltelijk verbieden of
      beperken door een daartoe strekkende bekendmaking, geplaatst bij het betrokken waterstaatswerk, dan wel gedaan op
      een andere geschikte wijze.
    url: https://wetten.overheid.nl/BWBR0008331/2006-12-13#Artikel6
  - number: '6.2'
    text: |-
      Het eerste lid is niet van toepassing op het gebruik door het openbaar verkeer, tenzij het verbod of de beperking
      van de toegang betrekking heeft op:
    url: https://wetten.overheid.nl/BWBR0008331/2006-12-13#Artikel6
  - number: 6.2.a
    text: |-
      een veiligheidszone als bedoeld in artikel 60 van het op 10 december 1982 te Montego-Bay tot stand gekomen Verdrag
      inzake het recht van de zee (Trb. 1983, 83), of
    url: https://wetten.overheid.nl/BWBR0008331/2006-12-13#Artikel6
  - number: 6.2.b
    text: de territoriale zee.
    url: https://wetten.overheid.nl/BWBR0008331/2006-12-13#Artikel6
  - number: '7'
    text: |-
      Onze Minister van Verkeer en Waterstaat is bevoegd tot toepassing van bestuursdwang ter handhaving van de bij of
      krachtens deze wet gestelde verplichtingen.
    url: https://wetten.overheid.nl/BWBR0008331/2006-12-13#Artikel7
  - number: '9.1'
    text: |-
      De kosten wegens schade, toegebracht aan waterstaatswerken, waarvoor eigenaren of gebruikers van vaartuigen
      wettelijk aansprakelijk zijn, worden door de op grond van [artikel 5, eerste lid][ref1] aangewezen ambtenaar
      geraamd en vermeld in een proces-verbaal dat, zo mogelijk, aan de schipper in afschrift wordt meegedeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0008331#Artikel5
    url: https://wetten.overheid.nl/BWBR0008331/2006-12-13#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0008331
        artikel: '5'
  - number: '9.2'
    text: |-
      Indien het geraamde bedrag aan de betrokken ambtenaar niet tot zekerheid wordt betaald of niet tot diens genoegen
      zekerheid wordt gesteld voor betaling daarvan binnen redelijke termijn, is deze ambtenaar bevoegd, desnoods met
      behulp van de sterke arm, het voortzetten van de reis, het ondernemen van de terugtocht of het aanvangen van een
      nieuwe reis te beletten.
    url: https://wetten.overheid.nl/BWBR0008331/2006-12-13#Artikel9
  - number: '9.3'
    text: |-
      Onverminderd het recht op volledige vergoeding van de schade, is het Rijk bevoegd het betaalde bedrag aan te wenden
      tot herstel van de schade. Indien blijkt dat de werkelijke kosten wegens schade minder bedragen dan het betaalde
      bedrag, wordt het overschot, met de wettelijke rente daarvan vanaf de dag der betaling, uitgekeerd aan degene die
      heeft betaald.
    url: https://wetten.overheid.nl/BWBR0008331/2006-12-13#Artikel9
  - number: '10'
    text: |-
      Een vergunning op grond van een of meer reglementen die zijn vastgesteld krachtens de Wet van 28 februari 1891, tot
      vaststelling van bepalingen betreffende 's Rijks waterstaatswerken (*Stb.* 69), alsmede een vergunning op grond van
      de Rivierenwet wordt gelijkgesteld met een vergunning op grond van deze Wet. Hetzelfde geldt ten aanzien van een
      ontheffing die is verleend op grond van de Verkeerswet tegen lichtbebouwing.
    url: https://wetten.overheid.nl/BWBR0008331/2006-12-13#Artikel10
  - number: '11.1'
    text: |-
      Overtreding van het bepaalde bij of krachtens de [artikelen 2][ref1] en [6][ref2] van deze wet wordt gestraft met
      geldboete van de tweede categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0008331#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0008331#Artikel6
    url: https://wetten.overheid.nl/BWBR0008331/2006-12-13#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0008331
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0008331
        artikel: '6'
  - number: '11.2'
    text: De in het eerste lid strafbaar gestelde feiten zijn overtredingen.
    url: https://wetten.overheid.nl/BWBR0008331/2006-12-13#Artikel11
  - number: '11.3'
    text: |-
      De Nederlandse strafwet is van toepassing op ieder die zich in de exclusieve economische zone schuldig maakt aan
      overtreding van het bepaalde bij of krachtens [artikel 2][ref1] of [artikel 6][ref2] van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0008331#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0008331#Artikel6
    url: https://wetten.overheid.nl/BWBR0008331/2006-12-13#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0008331
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0008331
        artikel: '6'
  - number: '14'
    text: |-
      De Wet van 28 februari 1891, tot vaststelling van bepalingen betreffende 's Rijks Waterstaatswerken (*Stb.* 69),
      wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0008331/2006-12-13#Artikel14
  - number: '15'
    text: De Verkeerswet tegen lintbebouwing wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0008331/2006-12-13#Artikel15
  - number: '17'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0008331/2006-12-13#Artikel17
  - number: '18'
    text: 'Deze wet wordt aangehaald als: Wet beheer rijkswaterstaatswerken.'
    url: https://wetten.overheid.nl/BWBR0008331/2006-12-13#Artikel18
