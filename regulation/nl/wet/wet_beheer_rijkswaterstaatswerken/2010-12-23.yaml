preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo wij in overweging genomen hebben dat de behoefte aan wettelijke middelen ter bescherming van waterstaatswerken
    in beheer bij het Rijk en ter verzekering van het doelmatig en veilig gebruik van die werken, alsook de inzichten
    inzake hetgeen daaromtrent regeling dient te vinden bij wet, zodanig zijn gewijzigd, dat het gewenst is daarvoor
    een nieuwe wettelijke regeling vast te stellen;

    Zo is het dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0008331/2010-12-23#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder waterstaatswerken: bij het Rijk in beheer
      zijnde wegen alsmede, voor zover in beheer bij het Rijk, de daarin gelegen kunstwerken en hetgeen verder naar zijn
      aard daartoe behoort.
    url: https://wetten.overheid.nl/BWBR0008331/2010-12-23#Artikel1
  - number: '2'
    text: |-
      1 Het is verboden zonder vergunning van Onze Minister van Verkeer en Waterstaat gebruik te maken van een
      waterstaatswerk door anders dan waartoe het is bestemd:

      a. daarin, daarop, daaronder of daarover werken te maken of te behouden;

      b. daarin, daaronder of daarop vaste stoffen of voorwerpen te storten, te plaatsen of neer te leggen, of deze te
      laten staan of liggen.

      2 Een vergunning kan onder beperkingen worden verleend. Aan een vergunning kunnen voorschriften worden verbonden.

      3 Het eerste lid is niet van toepassing op het gebruik van waterstaatswerken door of vanwege Onze Minister van
      Verkeer en Waterstaat in het kader van de aanleg, wijziging, verbetering of het beheer van die waterstaatswerken of
      de regeling van het verkeer over die waterstaatswerken.
    url: https://wetten.overheid.nl/BWBR0008331/2010-12-23#Artikel2
  - number: '3'
    text: |-
      1 Weigering, wijziging of intrekking van een vergunning, alsmede toepassing van de [artikelen 2, tweede lid][ref1],
      en [6][ref2] kan slechts geschieden ter bescherming van waterstaatswerken en ter verzekering van het doelmatig en
      veilig gebruik van die werken, met inbegrip van het belang van verruiming of wijziging anderszins van die werken.

      2 De in het eerste lid bedoelde besluiten kunnen mede strekken ter bescherming van aan de waterstaatswerken
      verbonden belangen van andere dan waterstaatkundige aard, doch enkel voor zover daarin niet is voorzien door bij of
      krachtens een andere wet gestelde bepalingen.


      [ref1]: https://wetten.overheid.nl/BWBR0008331#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0008331#Artikel6
    url: https://wetten.overheid.nl/BWBR0008331/2010-12-23#Artikel3
