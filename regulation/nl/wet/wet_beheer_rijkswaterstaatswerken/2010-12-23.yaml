        artikel: '2'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0008331
        artikel: '6'
        hoofdstuk: '1'
  - number: 11a
    text: |-
      In dit hoofdstuk wordt verstaan onder:

        - *verkeersveiligheidseffectbeoordeling:* een strategische vergelijkende beoordeling van het effect dat een nieuwe
      weg of een grondige wijziging van het bestaande wegennet hebben op het verkeersveiligheidsniveau van het wegennet;
        - *verkeersveiligheidsaudit:* een onafhankelijke, gedetailleerde, systematische en technische
      verkeersveiligheidscontrole van de ontwerpkenmerken van een infrastructuurproject, in alle fasen van het project,
      van planning tot eerste gebruik;
        - *verkeersveiligheidsinspectie:* een gewone periodieke beoordeling van de kenmerken en gebreken van wegen,
      waarvoor onderhoudswerkzaamheden nodig zijn met het oog op de verkeersveiligheid;
        - *infrastructuurproject:* een project voor de bouw van nieuwe weginfrastructuur of voor de grondige wijziging van
      het bestaande wegennet met gevolgen voor de hoeveelheid verkeersstroom.
    url: https://wetten.overheid.nl/BWBR0008331/2010-12-23#Artikel11a
  - number: 11b
    text: |-
      1 Dit hoofdstuk is van toepassing op wegen in beheer bij het Rijk die deel uitmaken van het wegennet beschreven in
      deel 2 van bijlage I bij Beschikking nr. 1692/96/EG.

      2 In afwijking van het eerste lid is dit hoofdstuk niet van toepassing op:

      a. tunnels als bedoeld in richtlijn nr. 2004/54/EG van het Europees parlement en de Raad van de Europese Unie van
      29 april 2004 inzake de minimumveiligheidseisen voor tunnels in het trans-Europese wegennet (PbEG L 167/39);

      b. projecten als bedoeld in [artikel 2 van de Spoedwet wegverbreding][ref1] en de [bijlage bij de Tracéwet]
      (onbekend), en

      c. projecten waarvoor op 19 december 2010 een aanvangsbeslissing als bedoeld in [artikel 2 van de Tracéwet][ref2]
      is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0015158#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006147#Artikel2
    url: https://wetten.overheid.nl/BWBR0008331/2010-12-23#Artikel11b
    references:
      - id: ref1
        bwb_id: BWBR0015158
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0006147
        artikel: '2'
  - number: 11c
    text: |-
      1 Onze Minister van Verkeer en Waterstaat voert in een bij ministeriële regeling aan te wijzen fase van de
      voorbereiding van een infrastructuurproject:

      a. een verkeersveiligheidseffectbeoordeling uit, en

      b. verkeersveiligheidsaudits uit, waarvan de bevindingen in een verslag worden vastgelegd.

      2 Bij ministeriële regeling worden nadere regels gesteld over de inhoud van een
      verkeersveiligheidseffectbeoordeling of verkeersveiligheidsaudit, waartoe in elk geval kunnen behoren:

      a. elementen waaraan wordt gestreefd aandacht te besteden;

      b. de inhoud van een verslag van een verkeersveiligheidsaudit, en

      c. vakbekwaamheid van personen die een verkeersveiligheidsaudit uitvoeren, erkenning van instellingen voor afgifte
      van vakbekwaamheidscertificaten aan die personen, en erkenning van certificaten die zijn afgegeven voor 19 december
      2010 of in andere landen.
    url: https://wetten.overheid.nl/BWBR0008331/2010-12-23#Artikel11c
  - number: 11d
    text: |-
      1 Onze Minister van Verkeer en Waterstaat beoordeelt ten minste om de drie jaar de classificatie van weggedeelten
      met een hoog aantal ongevallen en van de verkeersveiligheid van het wegennet in het kader van de beoordelingen van
      de exploitatie van het wegennet.

      2 Bij ministeriële regeling worden nadere regels gesteld, waartoe in elk geval kunnen behoren:

      a. criteria waarvan wordt gestreefd die te beoordelen;

      b. de wijze van inspecteren van die weggedeelten, en

      c. wijze van afweging ten aanzien van verbetermaatregelen.
    url: https://wetten.overheid.nl/BWBR0008331/2010-12-23#Artikel11d
  - number: 11e
    text: |-
      Onze Minister van Verkeer en Waterstaat voert op bij ministeriële regeling aangegeven wijze
      verkeersveiligheidsinspecties uit van in gebruik zijnde wegen teneinde de veiligheidskenmerken van de wegen te
      identificeren en ongevallen te voorkomen.
    url: https://wetten.overheid.nl/BWBR0008331/2010-12-23#Artikel11e
  - number: '14'
    text: |-
      De Wet van 28 februari 1891, tot vaststelling van bepalingen betreffende 's Rijks Waterstaatswerken (*Stb.* 69),
      wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0008331/2010-12-23#Artikel14
  - number: '15'
    text: De Verkeerswet tegen lintbebouwing wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0008331/2010-12-23#Artikel15
  - number: '17'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0008331/2010-12-23#Artikel17
  - number: '18'
    text: 'Deze wet wordt aangehaald als: Wet beheer rijkswaterstaatswerken.'
    url: https://wetten.overheid.nl/BWBR0008331/2010-12-23#Artikel18
