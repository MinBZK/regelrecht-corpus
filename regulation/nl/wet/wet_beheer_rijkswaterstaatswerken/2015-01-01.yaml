---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht-mvp/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_beheer_rijkswaterstaatswerken
regulatory_layer: WET
publication_date: '2020-06-17'
valid_from: '2015-01-01'
bwb_id: BWBR0008331
url: https://wetten.overheid.nl/BWBR0008331/2015-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo wij in overweging genomen hebben dat de behoefte aan wettelijke middelen ter bescherming van waterstaatswerken
    in beheer bij het Rijk en ter verzekering van het doelmatig en veilig gebruik van die werken, alsook de inzichten
    inzake hetgeen daaromtrent regeling dient te vinden bij wet, zodanig zijn gewijzigd, dat het gewenst is daarvoor
    een nieuwe wettelijke regeling vast te stellen;

    Zo is het dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0008331/2015-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder waterstaatswerken: bij het Rijk in beheer
      zijnde wegen alsmede, voor zover in beheer bij het Rijk, de daarin gelegen kunstwerken en hetgeen verder naar zijn
      aard daartoe behoort.
    url: https://wetten.overheid.nl/BWBR0008331/2015-01-01#Artikel1
  - number: '2.1'
    text: |-
      Het is verboden zonder vergunning van Onze Minister van Verkeer en Waterstaat gebruik te maken van een
      waterstaatswerk door anders dan waartoe het is bestemd:
    url: https://wetten.overheid.nl/BWBR0008331/2015-01-01#Artikel2
  - number: 2.1.a
    text: daarin, daarop, daaronder of daarover werken te maken of te behouden;
    url: https://wetten.overheid.nl/BWBR0008331/2015-01-01#Artikel2
  - number: 2.1.b
    text: |-
      daarin, daaronder of daarop vaste stoffen of voorwerpen te storten, te plaatsen of neer te leggen, of deze te laten
      staan of liggen.
    url: https://wetten.overheid.nl/BWBR0008331/2015-01-01#Artikel2
  - number: '2.2'
    text: Een vergunning kan onder beperkingen worden verleend. Aan een vergunning kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0008331/2015-01-01#Artikel2
  - number: '2.3'
    text: |-
      Het eerste lid is niet van toepassing op het gebruik van waterstaatswerken door of vanwege Onze Minister van
      Verkeer en Waterstaat in het kader van de aanleg, wijziging, verbetering of het beheer van die waterstaatswerken of
      de regeling van het verkeer over die waterstaatswerken.
    url: https://wetten.overheid.nl/BWBR0008331/2015-01-01#Artikel2
  - number: '3.1'
    text: |-
      Weigering, wijziging of intrekking van een vergunning, alsmede toepassing van de [artikelen 2, tweede lid][ref1],
      en [6][ref2] kan slechts geschieden ter bescherming van waterstaatswerken en ter verzekering van het doelmatig en
      veilig gebruik van die werken, met inbegrip van het belang van verruiming of wijziging anderszins van die werken.


      [ref1]: https://wetten.overheid.nl/BWBR0008331#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0008331#Artikel6
    url: https://wetten.overheid.nl/BWBR0008331/2015-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0008331
        artikel: '2'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0008331
        artikel: '6'
        hoofdstuk: '1'
  - number: '3.2'
    text: |-
      De in het eerste lid bedoelde besluiten kunnen mede strekken ter bescherming van aan de waterstaatswerken verbonden
      belangen van andere dan waterstaatkundige aard, doch enkel voor zover daarin niet is voorzien door bij of krachtens
      een andere wet gestelde bepalingen.
    url: https://wetten.overheid.nl/BWBR0008331/2015-01-01#Artikel3
  - number: '4'
    text: |-
      Van de aanvrager kunnen, volgens bij algemene maatregel van bestuur te stellen regels, rechten worden geheven voor
      het in behandeling nemen van aanvragen tot verlening of wijziging van een vergunning.
    url: https://wetten.overheid.nl/BWBR0008331/2015-01-01#Artikel4
  - number: '5.1'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de bij besluit van Onze
      Minister van Verkeer en Waterstaat aangewezen ambtenaren. De toezichthouder beschikt niet over de bevoegdheden,
      genoemd in de [artikelen 5:18][ref1] en [5:19 van de Algemene wet bestuursrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0008331/2015-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '5.2'
    text: |-
      Met de opsporing van de bij [artikel 11][ref1] strafbaar gestelde feiten zijn, onverminderd
      [artikel 141 van het Wetboek van Strafvordering][ref2], belast de ambtenaren, aangewezen bij besluit
      van Onze Ministers van Verkeer en Waterstaat en van Justitie. Deze ambtenaren zijn tevens belast met
      de opsporing van de feiten, strafbaar gesteld in de [artikelen 179][ref3] tot en met [182][ref4] en
      [184 van het Wetboek van Strafrecht][ref5], voor zover deze feiten betrekking hebben op een bevel, vordering of
      handeling, gedaan of ondernomen door henzelf.


      [ref1]: https://wetten.overheid.nl/BWBR0008331#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel141
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel179
      [ref4]: https://wetten.overheid.nl/BWBR0001854#Artikel182
      [ref5]: https://wetten.overheid.nl/BWBR0001854#Artikel184
    url: https://wetten.overheid.nl/BWBR0008331/2015-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0008331
        artikel: '11'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '141'
      - id: ref3
        bwb_id: BWBR0001854
        artikel: '179'
      - id: ref4
        bwb_id: BWBR0001854
        artikel: '182'
      - id: ref5
        bwb_id: BWBR0001854
        artikel: '184'
  - number: '5.3'
    text: |-
      Van een besluit als bedoeld in het eerste of tweede lid wordt mededeling gedaan door plaatsing in de
      *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0008331/2015-01-01#Artikel5
  - number: '6.1'
    text: |-
      Onze Minister van Verkeer en Waterstaat kan de toegang tot een waterstaatswerk geheel of gedeeltelijk verbieden of
      beperken door een daartoe strekkende bekendmaking, geplaatst bij het betrokken waterstaatswerk, dan wel gedaan op
      een andere geschikte wijze.
    url: https://wetten.overheid.nl/BWBR0008331/2015-01-01#Artikel6
  - number: '6.2'
    text: Het eerste lid is niet van toepassing op het gebruik door het openbaar verkeer.
    url: https://wetten.overheid.nl/BWBR0008331/2015-01-01#Artikel6
  - number: '7'
    text: |-
      Onze Minister van Verkeer en Waterstaat is bevoegd tot oplegging van een last onder bestuursdwang ter handhaving
      van de bij of krachtens deze wet gestelde verplichtingen.
    url: https://wetten.overheid.nl/BWBR0008331/2015-01-01#Artikel7
  - number: '9.1'
    text: |-
      De kosten wegens schade, toegebracht aan waterstaatswerken, waarvoor eigenaren of gebruikers van vaartuigen
      wettelijk aansprakelijk zijn, worden door de op grond van [artikel 5, eerste lid][ref1] aangewezen ambtenaar
      geraamd en vermeld in een proces-verbaal dat, zo mogelijk, aan de schipper in afschrift wordt meegedeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0008331#Artikel5
    url: https://wetten.overheid.nl/BWBR0008331/2015-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0008331
        artikel: '5'
        hoofdstuk: '1'
  - number: '9.2'
    text: |-
      Indien het geraamde bedrag aan de betrokken ambtenaar niet tot zekerheid wordt betaald of niet tot diens genoegen
      zekerheid wordt gesteld voor betaling daarvan binnen redelijke termijn, is deze ambtenaar bevoegd, desnoods met
      behulp van de sterke arm, het voortzetten van de reis, het ondernemen van de terugtocht of het aanvangen van een
      nieuwe reis te beletten.
    url: https://wetten.overheid.nl/BWBR0008331/2015-01-01#Artikel9
  - number: '9.3'
    text: |-
      Onverminderd het recht op volledige vergoeding van de schade, is het Rijk bevoegd het betaalde bedrag aan te wenden
      tot herstel van de schade. Indien blijkt dat de werkelijke kosten wegens schade minder bedragen dan het betaalde
      bedrag, wordt het overschot, met de wettelijke rente daarvan vanaf de dag der betaling, uitgekeerd aan degene die
      heeft betaald.
    url: https://wetten.overheid.nl/BWBR0008331/2015-01-01#Artikel9
  - number: '10'
    text: |-
      Een vergunning op grond van een of meer reglementen die zijn vastgesteld krachtens de Wet van 28 februari 1891, tot
      vaststelling van bepalingen betreffende 's Rijks waterstaatswerken (*Stb.* 69), alsmede een vergunning op grond van
      de Rivierenwet wordt gelijkgesteld met een vergunning op grond van deze Wet. Hetzelfde geldt ten aanzien van een
      ontheffing die is verleend op grond van de Verkeerswet tegen lichtbebouwing.
    url: https://wetten.overheid.nl/BWBR0008331/2015-01-01#Artikel10
  - number: '11.1'
    text: |-
      Overtreding van het bepaalde bij of krachtens de [artikelen 2][ref1] en [6][ref2] van deze wet wordt gestraft met
      geldboete van de tweede categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0008331#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0008331#Artikel6
    url: https://wetten.overheid.nl/BWBR0008331/2015-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0008331
        artikel: '2'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0008331
        artikel: '6'
        hoofdstuk: '1'
  - number: '11.2'
    text: De in het eerste lid strafbaar gestelde feiten zijn overtredingen.
    url: https://wetten.overheid.nl/BWBR0008331/2015-01-01#Artikel11
  - number: 11a
    text: |-
      In dit hoofdstuk wordt verstaan onder: - *verkeersveiligheidseffectbeoordeling:* een strategische vergelijkende
      beoordeling van het effect dat een nieuwe weg of een grondige wijziging van het bestaande wegennet hebben op het
      verkeersveiligheidsniveau van het wegennet;
        - *verkeersveiligheidsaudit:* een onafhankelijke, gedetailleerde, systematische en technische
      verkeersveiligheidscontrole van de ontwerpkenmerken van een infrastructuurproject, in alle fasen van het project,
      van planning tot eerste gebruik;
        - *verkeersveiligheidsinspectie:* een gewone periodieke beoordeling van de kenmerken en gebreken van wegen,
      waarvoor onderhoudswerkzaamheden nodig zijn met het oog op de verkeersveiligheid;
        - *infrastructuurproject:* een project voor de bouw van nieuwe weginfrastructuur of voor de grondige wijziging van
      het bestaande wegennet met gevolgen voor de hoeveelheid verkeersstroom;
        - *wegbeheerder:* beheerder van een weg als bedoeld in [artikel 11b, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008331#Artikel11b
    url: https://wetten.overheid.nl/BWBR0008331/2015-01-01#Artikel11a
    references:
      - id: ref1
        bwb_id: BWBR0008331
        artikel: 11b
        hoofdstuk: '2'
  - number: 11b.1
    text: |-
      Dit hoofdstuk is van toepassing op wegen die deel uitmaken van het bij ministeriële regeling aan te wijzen wegennet
      als bedoeld in richtlijn nr. 2008/96/EG van het Europees Parlement en de Raad van de Europese Unie van 19 november
      2008 betreffende het beheer van de verkeersveiligheid van weginfrastructuur (PbEU L 319) en die in beheer zijn bij
      het Rijk of die, in afwijking van [artikel 1][ref1], in beheer zijn bij een ander dan het Rijk.


      [ref1]: https://wetten.overheid.nl/BWBR0008331#Artikel1
    url: https://wetten.overheid.nl/BWBR0008331/2015-01-01#Artikel11b
    references:
      - id: ref1
        bwb_id: BWBR0008331
        artikel: '1'
        hoofdstuk: '1'
  - number: 11b.2
    text: 'In afwijking van het eerste lid is dit hoofdstuk niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0008331/2015-01-01#Artikel11b
  - number: 11b.2.a
    text: |-
      tunnels als bedoeld in richtlijn nr. 2004/54/EG van het Europees parlement en de Raad van de Europese Unie van 29
      april 2004 inzake de minimumveiligheidseisen voor tunnels in het trans-Europese wegennet (PbEG L 167/39);
    url: https://wetten.overheid.nl/BWBR0008331/2015-01-01#Artikel11b
  - number: 11b.2.b
    text: |-
      projecten als bedoeld in [artikel 2 van de Spoedwet wegverbreding][ref1] en de [bijlage bij de Tracéwet](onbekend),
      en


      [ref1]: https://wetten.overheid.nl/BWBR0015158#Artikel2
    url: https://wetten.overheid.nl/BWBR0008331/2015-01-01#Artikel11b
    references:
      - id: ref1
        bwb_id: BWBR0015158
        artikel: '2'
  - number: 11b.2.c
    text: |-
      projecten waarvoor uiterlijk op 19 december 2010 een aanvangsbeslissing als bedoeld in
      [artikel 2 van de Tracéwet][ref1] is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0006147#Artikel2
    url: https://wetten.overheid.nl/BWBR0008331/2015-01-01#Artikel11b
    references:
      - id: ref1
        bwb_id: BWBR0006147
        artikel: '2'
  - number: 11c.1
    text: |-
      De wegbeheerder voert in een bij ministeriële regeling aan te wijzen fase van de voorbereiding van een
      infrastructuurproject:
    url: https://wetten.overheid.nl/BWBR0008331/2015-01-01#Artikel11c
  - number: 11c.1.a
    text: een verkeersveiligheidseffectbeoordeling uit, en
    url: https://wetten.overheid.nl/BWBR0008331/2015-01-01#Artikel11c
  - number: 11c.1.b
    text: verkeersveiligheidsaudits uit, waarvan de bevindingen in een verslag worden vastgelegd.
    url: https://wetten.overheid.nl/BWBR0008331/2015-01-01#Artikel11c
  - number: 11c.2
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld over de inhoud van een verkeersveiligheidseffectbeoordeling
      of verkeersveiligheidsaudit, waartoe in elk geval kunnen behoren:
    url: https://wetten.overheid.nl/BWBR0008331/2015-01-01#Artikel11c
  - number: 11c.2.a
    text: elementen waaraan wordt gestreefd aandacht te besteden;
    url: https://wetten.overheid.nl/BWBR0008331/2015-01-01#Artikel11c
  - number: 11c.2.b
    text: de inhoud van een verslag van een verkeersveiligheidsaudit, en
    url: https://wetten.overheid.nl/BWBR0008331/2015-01-01#Artikel11c
  - number: 11c.2.c
    text: |-
      vakbekwaamheid van personen die een verkeersveiligheidsaudit uitvoeren, erkenning van instellingen voor afgifte
      van vakbekwaamheidscertificaten aan die personen, en erkenning van certificaten die zijn afgegeven voor 19 december
      2010 of in andere landen.
    url: https://wetten.overheid.nl/BWBR0008331/2015-01-01#Artikel11c
  - number: 11d.1
    text: |-
      De wegbeheerder beoordeelt ten minste om de drie jaar de classificatie van weggedeelten met een hoog aantal
      ongevallen en van de verkeersveiligheid van het wegennet in het kader van de beoordelingen van de exploitatie van
      het wegennet.
    url: https://wetten.overheid.nl/BWBR0008331/2015-01-01#Artikel11d
  - number: 11d.2
    text: 'Bij ministeriële regeling worden nadere regels gesteld, waartoe in elk geval kunnen behoren:'
    url: https://wetten.overheid.nl/BWBR0008331/2015-01-01#Artikel11d
  - number: 11d.2.a
    text: criteria waarvan wordt gestreefd die te beoordelen;
    url: https://wetten.overheid.nl/BWBR0008331/2015-01-01#Artikel11d
  - number: 11d.2.b
    text: de wijze van inspecteren van die weggedeelten, en
    url: https://wetten.overheid.nl/BWBR0008331/2015-01-01#Artikel11d
  - number: 11d.2.c
    text: wijze van afweging ten aanzien van verbetermaatregelen.
    url: https://wetten.overheid.nl/BWBR0008331/2015-01-01#Artikel11d
  - number: 11e
    text: |-
      De wegbeheerder voert op bij ministeriële regeling aangegeven wijze verkeersveiligheidsinspecties uit van in
      gebruik zijnde wegen teneinde de veiligheidskenmerken van de wegen te identificeren en ongevallen te voorkomen.
    url: https://wetten.overheid.nl/BWBR0008331/2015-01-01#Artikel11e
  - number: '14'
    text: |-
      De Wet van 28 februari 1891, tot vaststelling van bepalingen betreffende 's Rijks Waterstaatswerken (*Stb.* 69),
      wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0008331/2015-01-01#Artikel14
  - number: '15'
    text: De Verkeerswet tegen lintbebouwing wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0008331/2015-01-01#Artikel15
  - number: '17'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0008331/2015-01-01#Artikel17
  - number: '18'
    text: 'Deze wet wordt aangehaald als: Wet beheer rijkswaterstaatswerken.'
    url: https://wetten.overheid.nl/BWBR0008331/2015-01-01#Artikel18
