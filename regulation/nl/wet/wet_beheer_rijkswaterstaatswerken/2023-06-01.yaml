  - number: '6'
    text: |-
      1 Onze Minister van Verkeer en Waterstaat kan de toegang tot een waterstaatswerk geheel of gedeeltelijk verbieden
      of beperken door een daartoe strekkende bekendmaking, geplaatst bij het betrokken waterstaatswerk, dan wel gedaan
      op een andere geschikte wijze.

      2 Het eerste lid is niet van toepassing op het gebruik door het openbaar verkeer.
    url: https://wetten.overheid.nl/BWBR0008331/2023-06-01#Artikel6
  - number: '7'
    text: |-
      Onze Minister van Verkeer en Waterstaat is bevoegd tot oplegging van een last onder bestuursdwang ter handhaving
      van de bij of krachtens deze wet gestelde verplichtingen.
    url: https://wetten.overheid.nl/BWBR0008331/2023-06-01#Artikel7
  - number: '9'
    text: |-
      1 De kosten wegens schade, toegebracht aan waterstaatswerken, waarvoor eigenaren of gebruikers van vaartuigen
      wettelijk aansprakelijk zijn, worden door de op grond van [artikel 5, eerste lid][ref1] aangewezen ambtenaar
      geraamd en vermeld in een proces-verbaal dat, zo mogelijk, aan de schipper in afschrift wordt meegedeeld.

      2 Indien het geraamde bedrag aan de betrokken ambtenaar niet tot zekerheid wordt betaald of niet tot diens genoegen
      zekerheid wordt gesteld voor betaling daarvan binnen redelijke termijn, is deze ambtenaar bevoegd, desnoods met
      behulp van de sterke arm, het voortzetten van de reis, het ondernemen van de terugtocht of het aanvangen van een
      nieuwe reis te beletten.

      3 Onverminderd het recht op volledige vergoeding van de schade, is het Rijk bevoegd het betaalde bedrag aan te
      wenden tot herstel van de schade. Indien blijkt dat de werkelijke kosten wegens schade minder bedragen dan het
      betaalde bedrag, wordt het overschot, met de wettelijke rente daarvan vanaf de dag der betaling, uitgekeerd aan
      degene die heeft betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0008331#Artikel5
    url: https://wetten.overheid.nl/BWBR0008331/2023-06-01#Artikel9
