  - number: '4'
    text: |-
      Van de aanvrager kunnen, volgens bij algemene maatregel van bestuur te stellen regels, rechten worden geheven voor
      het in behandeling nemen van aanvragen tot verlening of wijziging van een vergunning.
    url: https://wetten.overheid.nl/BWBR0008331/2023-06-01#Artikel4
  - number: '5'
    text: |-
      1 Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de bij besluit van Onze
      Minister van Verkeer en Waterstaat aangewezen ambtenaren. De toezichthouder beschikt niet over de bevoegdheden,
      genoemd in de [artikelen 5:18][ref1] en [5:19 van de Algemene wet bestuursrecht][ref2].

      2 Met de opsporing van de bij [artikel 11][ref3] strafbaar gestelde feiten zijn, onverminderd
      [artikel 141 van het Wetboek van Strafvordering][ref4], belast de ambtenaren, aangewezen bij besluit
      van Onze Ministers van Verkeer en Waterstaat en van Justitie. Deze ambtenaren zijn tevens belast met
      de opsporing van de feiten, strafbaar gesteld in de [artikelen 179][ref5] tot en met [182][ref6] en
      [184 van het Wetboek van Strafrecht][ref7], voor zover deze feiten betrekking hebben op een bevel, vordering of
      handeling, gedaan of ondernomen door henzelf.

      3 Van een besluit als bedoeld in het eerste of tweede lid wordt mededeling gedaan door plaatsing in de
      *Staatscourant*.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel518
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel519
