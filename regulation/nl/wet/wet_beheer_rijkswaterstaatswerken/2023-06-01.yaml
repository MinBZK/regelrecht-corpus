  - number: '10'
    text: |-
      Een vergunning op grond van een of meer reglementen die zijn vastgesteld krachtens de Wet van 28 februari 1891, tot
      vaststelling van bepalingen betreffende 's Rijks waterstaatswerken (*Stb.* 69), alsmede een vergunning op grond van
      de Rivierenwet wordt gelijkgesteld met een vergunning op grond van deze Wet. Hetzelfde geldt ten aanzien van een
      ontheffing die is verleend op grond van de Verkeerswet tegen lichtbebouwing.
    url: https://wetten.overheid.nl/BWBR0008331/2023-06-01#Artikel10
  - number: '11'
    text: |-
      1 Overtreding van het bepaalde bij of krachtens de [artikelen 2][ref1] en [6][ref2] van deze wet wordt gestraft
      met geldboete van de tweede categorie.

      2 De in het eerste lid strafbaar gestelde feiten zijn overtredingen.


