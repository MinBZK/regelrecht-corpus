  - number: 6.4.n
    text: de uitvoering van de taken van de Rijksschoonmaakorganisatie.
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel6
  - number: '6.5'
    text: 'De plaatsvervangend secretaris-generaal is verantwoordelijk voor:'
