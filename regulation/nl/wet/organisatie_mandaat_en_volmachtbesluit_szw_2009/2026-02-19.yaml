      en van teamleiders aan wie bevoegdheden zijn toegekend met betrekking tot personeelsaangelegenheden, voor zover het
      gaat om functies met het maximum van salarisschaal 13 zoals overeengekomen in de laatstelijk afgesloten collectieve
      arbeidsovereenkomst voor rijksambtenaren, mits hij van zijn voornemen daartoe vooraf melding heeft gemaakt in de
      Commissie Management Development;
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel7
  - number: 7.2.d
    text: |-
      het instellen van tijdelijke projectorganisaties binnen zijn werkterrein als bedoeld in [artikel 6][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0024956#Artikel6
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel7
    references:
