  - number: '3.1'
    text: |-
      De volgende functionarissen voeren regelmatig collegiaal overleg over de belangrijke aspecten van
      beleidsontwikkeling en -uitvoering en over de departementale bedrijfsvoering:
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel3
  - number: 3.1.a
    text: de secretaris-generaal;
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel3
  - number: 3.1.b
    text: de plaatsvervangend secretaris-generaal;
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel3
  - number: 3.1.c
    text: de directeur-generaal Sociale Zekerheid en Integratie;
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel3
  - number: 3.1.d
    text: de directeur-generaal Werk;
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel3
  - number: 3.1.e
    text: de inspecteur-generaal Nederlandse Arbeidsinspectie;
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel3
  - number: 3.1.f
    text: de programma-directeur-generaal Werk aan Uitvoering.
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel3
  - number: '3.2'
    text: |-
      Het in het eerste lid bedoelde overleg staat onder voorzitterschap van de secretaris-generaal en elk van de
      functionarissen neemt daaraan deel met volledig behoud van de eigen verantwoordelijkheden en bevoegdheden. De
      inspecteur-generaal Nederlandse Arbeidsinspectie neemt aan dit overleg deel op een zodanige wijze, dat dit in
      overeenstemming is met zijn verantwoordelijkheid voor de onafhankelijke uitvoering van de taken, genoemd in
      [artikel 37 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel37
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '37'
  - number: '4.1'
    text: |-
      De secretaris-generaal is, gelet op het
      __REF000___________________________________________________________________________________________________________
      _________________ (Stb. 1988, 499), belast met de ambtelijke leiding van het ministerie.


      [ref1]: https://wetten.overheid.nl/BWBR0004419
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0004419
  - number: '4.2'
    text: |-
      De secretaris-generaal geeft rechtstreeks leiding aan de functionarissen, genoemd in
      [artikel 3, eerste lid, onderdelen b tot en met f][ref1], en aan de functionarissen die leiding geven aan de
      organisatieonderdelen, genoemd in [artikel 2, onderdeel a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0024956#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0024956#Artikel2
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0024956
        artikel: '3'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0024956
        artikel: '2'
        hoofdstuk: '2'
  - number: '4.3'
    text: |-
      De secretaris-generaal kan een meerjarenplan voor het ministerie vaststellen. De secretaris-generaal stelt voorts
      de jaarplannen vast van de organisatieonderdelen, genoemd in [artikel 2, onderdeel a][ref1]. De secretaris-generaal
      kent aan de plaatsvervangend secretaris-generaal, de directeuren-generaal, de inspecteur-generaal Nederlandse
      Arbeidsinspectie en de functionarissen die leiding geven aan de organisatieonderdelen, genoemd in artikel 2,
      onderdeel a, de budgetten toe waarover de genoemde functionarissen mogen beschikken. De secretaris-generaal bewaakt
      de voortgang van de uitvoering van het meerjarenplan en van de jaarplannen van de organisatieonderdelen, genoemd in
      artikel 2, onderdeel a.


      [ref1]: https://wetten.overheid.nl/BWBR0024956#Artikel2
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0024956
        artikel: '2'
        hoofdstuk: '2'
  - number: '4.4'
    text: 'De secretaris-generaal is verantwoordelijk voor:'
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel4
  - number: 4.4.a
    text: |-
      het bij schriftelijk besluit toedelen van taken aan de organisatieonderdelen, genoemd in
      [artikel 2, onderdeel a][ref1], en aan de functionarissen die leiding geven aan deze organisatieonderdelen;


      [ref1]: https://wetten.overheid.nl/BWBR0024956#Artikel2
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0024956
        artikel: '2'
        hoofdstuk: '2'
  - number: 4.4.b
    text: |-
      de werkgeversverplichtingen die voortvloeien uit wet- en regelgeving op het gebied van arbeidsomstandigheden
      ten aanzien van de organisatieonderdelen, genoemd in [artikel 2, onderdeel a][ref1], met dien verstande dat de
      secretaris-generaal zorg draagt voor toedeling van deze verantwoordelijkheid aan andere functionarissen voor
      zover deze ten aanzien van organisatieonderdelen genoemd in artikel 2, onderdeel a, als bestuurder in de zin van
      [artikel 1 van de Wet op de ondernemingsraden][ref2] optreden;


      [ref1]: https://wetten.overheid.nl/BWBR0024956#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002747#Artikel1
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel4
