        bwb_id: BWBR0020583
  - number: 6.5.h
    text: |-
      het vervullen van de rol van eigenaar van de Sociale Verzekeringsbank, met dien verstande dat de secretaris-
      generaal de plaatsvervangend secretaris-generaal vervangt bij diens afwezigheid of verhindering.
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel6
  - number: '6.6'
    text: |-
      De plaatsvervangend secretaris-generaal is verantwoordelijk voor het CIO-stelsel en wijst de CIO van het ministerie
      aan.
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel6
  - number: '7.1'
    text: |-
      De plaatsvervangend secretaris-generaal is bevoegd om namens een bewindspersoon besluiten te nemen,
      privaatrechtelijke rechtshandelingen te verrichten en handelingen te verrichten die noch een besluit, noch
      een privaatrechtelijke rechtshandeling zijn, voor zover zij verband houden met zijn werkterrein als bedoeld in
      [artikel 6][ref1] en voor zover zij niet zijn voorbehouden aan een bewindspersoon of de secretaris-generaal. Van de
      volmacht, bedoeld in de eerste volzin, is evenwel uitgezonderd het aangaan van:


      [ref1]: https://wetten.overheid.nl/BWBR0024956#Artikel6
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0024956
        artikel: '6'
        hoofdstuk: '3'
  - number: 7.1.a
    text: |-
      overeenkomsten met de Landsadvocaat en andere juridische dienstverleners inzake advisering en procureurstelling
      alsmede het instellen van gerechtelijke procedures, tenzij deze overeenkomsten betrekking hebben op gerechtelijke
      procedures van (ex-)medewerkers inzake aangelegenheden verband houdend met de dienstbetrekking of op de invordering
      van geldvorderingen van de Staat;
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel7
  - number: 7.1.b
    text: |-
      overeenkomsten met het Centraal bureau voor de statistiek alsmede overeenkomsten met betrekking tot meerjarige,
      structurele beleidsinformatievoorziening die het verzamelen, bewerken en leveren van beleidsinformatie betreffen,
      voor zover deze informatie primair bedoeld is voor ramingen en verdeelmodellen, dan wel verband houdt met
      verplichtingen die voortvloeien uit de Regeling Rijksbegrotingsvoorschriften 2008 of met verplichtingen die
      voortvloeien uit internationale verdragen.
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel7
  - number: '7.2'
    text: |-
      De bevoegdheden van de plaatsvervangend secretaris-generaal, bedoeld in het eerste lid, omvatten in elk geval
      mandaat, volmacht en machtiging ten aanzien van de volgende aangelegenheden:
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel7
  - number: 7.2.a
    text: |-
      beslissingen in bezwaar- en beroepsprocedures voor zover deze betrekking hebben op zijn verantwoordelijkheden of
      werkterrein als bedoeld in [artikel 6][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0024956#Artikel6
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0024956
        artikel: '6'
        hoofdstuk: '3'
  - number: 7.2.b
    text: |-
      de in [artikel 6, vijfde lid][ref1], genoemde aangelegenheden;


      [ref1]: https://wetten.overheid.nl/BWBR0024956#Artikel6
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0024956
        artikel: '6'
        hoofdstuk: '3'
