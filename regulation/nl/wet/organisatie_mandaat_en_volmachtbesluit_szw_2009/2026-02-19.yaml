      van crisisbeheersing en milieumanagement, en de regie op het huisvestings- en beveiligingsbeleid voor het gehele
      ministerie;
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel6
  - number: 6.4.d
    text: |-
      het automatiserings- en informatiseringsbeleid, waaronder het adviseren hierover, van de
