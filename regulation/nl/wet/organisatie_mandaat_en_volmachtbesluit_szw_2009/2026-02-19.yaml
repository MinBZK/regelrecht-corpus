    text: |-
      de werkgeversverplichtingen die voortvloeien uit wet- en regelgeving op het gebied van arbeidsomstandigheden ten
      aanzien van de onder hen ressorterende organisatieonderdelen, met uitzondering van de bij de plaatsvervangend
      secretaris-generaal belegde centraal georganiseerde werkgeversverplichtingen;
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel8
