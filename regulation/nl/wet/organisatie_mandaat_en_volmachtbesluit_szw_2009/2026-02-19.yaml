    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel6
  - number: 6.5.c
    text: |-
      de personeelsaangelegenheden welke niet ingevolge [artikel 4, vierde lid][ref1], aan de secretaris-generaal
      zijn voorbehouden, dan wel ingevolge [artikel 8, derde lid][ref2], tot de taken van een directeur-generaal of de
      inspecteur-generaal Nederlandse Arbeidsinspectie behoren;


      [ref1]: https://wetten.overheid.nl/BWBR0024956#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0024956#Artikel8
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel6
    references:
      - id: ref1
