preamble:
  text: |-
    Gelet op de artikelen 2, eerste lid, van het Coördinatiebesluit organisatie en formatie rijksdienst 2007 en 10:3
    van de Algemene wet bestuursrecht;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze regeling en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel1
  - number: 1.a
    text: '*het ministerie:* het Ministerie van Sociale Zaken en Werkgelegenheid;'
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel1
  - number: 1.b
    text: |-
      *bewindspersoon:* de Minister van Sociale Zaken en Werkgelegenheid of de Staatssecretaris van Sociale Zaken en
      Werkgelegenheid, afhankelijk van wie het aangaat;
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel1
  - number: 1.c
    text: '*mandaat:* de bevoegdheid om in naam van een bewindspersoon besluiten te nemen;'
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel1
  - number: 1.d
    text: '*volmacht:* de bevoegdheid om in naam van een bewindspersoon privaatrechtelijke rechtshandelingen te verrichten;'
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel1
  - number: 1.e
    text: |-
      *machtiging:* de bevoegdheid om in naam van een bewindspersoon handelingen te verrichten die noch een besluit, noch
      een privaatrechtelijke rechtshandeling zijn;
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel1
  - number: 1.f
    text: |-
      *vertegenwoordigingsbevoegdheid:* de bevoegdheid om namens een bewindspersoon, onder diens verantwoordelijkheid
      en met inachtneming van diens algemene en bijzondere aanwijzingen, besluiten te nemen, privaatrechtelijke
      rechtshandelingen te verrichten dan wel handelingen te verrichten die noch een besluit noch een privaatrechtelijke
      rechtshandeling zijn;
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel1
  - number: 1.g
    text: |-
      *bedrijfsvoering:* de sturing en beheersing van bedrijfsprocessen om de gestelde (beleids)doelstellingen te kunnen
      realiseren;
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel1
  - number: 1.h
    text: |-
      *Commissie Management Development:* de commissie, bestaande uit de functionarissen, genoemd in
      [artikel 3, onderdelen a tot en met e][ref1], waarin managementbenoemingen en de selectie voor
      managementopleidingen plaatsvindt;


      [ref1]: https://wetten.overheid.nl/BWBR0024956#Artikel3
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel1
    references:
