  - number: 5.2.d
    text: de kwijtschelding van vorderingen op derden van ten hoogste € 1.000.000,–;
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel5
  - number: 5.2.e
    text: |-
      beslissingen op verzoeken om informatie op grond van de [Wet open overheid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0045754
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0045754
  - number: '5.3'
    text: |-
      De secretaris-generaal is bevoegd tot uitoefening van alle bevoegdheden die zijn verleend aan onder hem
      ressorterende functionarissen, met dien verstande dat hij gehouden is om door de inspecteur-generaal Nederlandse
      Arbeidsinspectie aangeboden inspectiebevindingen, jaarplannen, meerjarenplannen en jaarverslagen met betrekking tot
      inspectietaken van de Nederlandse Arbeidsinspectie ongewijzigd door te sturen naar de desbetreffende bewindspersoon
      of -personen. Op het jaarplan, het meerjarenplan en het jaarverslag voor de gehele Nederlandse Arbeidsinspectie is
      [artikel 38 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel38
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '38'
  - number: '5.4'
    text: |-
      De secretaris-generaal kan departementale projectorganisaties instellen en arbeidsovereenkomsten aangaan met
      projectdirecteuren die leiding geven aan deze projectorganisaties.
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel5
  - number: '6.1'
    text: |-
      De plaatsvervangend secretaris-generaal vervangt de secretaris-generaal bij diens afwezigheid of verhindering. Hij
      treedt alsdan in de verantwoordelijkheden en bevoegdheden van de secretaris-generaal.
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel6
  - number: '6.2'
    text: |-
      De plaatsvervangend secretaris-generaal geeft rechtstreeks leiding aan de functionarissen die leiding geven aan de
      organisatieonderdelen, genoemd in [artikel 2, onderdeel b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024956#Artikel2
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0024956
        artikel: '2'
        hoofdstuk: '2'
  - number: '6.3'
    text: |-
      De plaatsvervangend secretaris-generaal stelt de jaarplannen vast van de organisatieonderdelen, genoemd in
      [artikel 2, onderdeel b][ref1]. Gegeven het budget dat door de secretaris-generaal aan de plaatsvervangend
      secretaris-generaal ter beschikking is gesteld, kent de plaatsvervangend secretaris-generaal aan de functionarissen
      die leiding geven aan de organisatieonderdelen, genoemd in artikel 2, onderdeel b, het budget toe waarover zij
      mogen beschikken. De plaatsvervangend secretaris-generaal bewaakt de voortgang van de uitvoering van de jaarplannen
      van de organisatieonderdelen, genoemd in artikel 2, onderdeel b.


      [ref1]: https://wetten.overheid.nl/BWBR0024956#Artikel2
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0024956
        artikel: '2'
        hoofdstuk: '2'
  - number: '6.4'
    text: |-
      De plaatsvervangend secretaris-generaal is belast met de beleids- en bedrijfsvoering betreffende de
      organisatieonderdelen, genoemd in [artikel 2, onderdeel b][ref1], en hij is tevens verantwoordelijk voor een
      departementsbrede samenhangende bedrijfsvoering. Het werkterrein van de plaatsvervangend secretaris-generaal omvat
      in brede zin:


      [ref1]: https://wetten.overheid.nl/BWBR0024956#Artikel2
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0024956
        artikel: '2'
        hoofdstuk: '2'
  - number: 6.4.a
    text: het organisatie- en personeelsbeleid;
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel6
  - number: 6.4.b
    text: |-
      de ondersteuning van de directies van het ministerie op het gebied van personeelsbeheer, salarisadministratie, en
      documentaire informatievoorziening;
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel6
  - number: 6.4.b1
    text: |-
