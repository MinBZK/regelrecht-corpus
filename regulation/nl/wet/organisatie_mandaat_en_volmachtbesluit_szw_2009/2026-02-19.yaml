  - number: '30'
    text: |-
      Deze regeling treedt in werking met ingang van 1 januari 2009, met dien verstande dat
      [artikel 26, onderdeel A][ref1] terugwerkt tot en met 1 juli 2007.


      [ref1]: https://wetten.overheid.nl/BWBR0024956#Artikel26
