      attenderen van de bewindspersonen op politiek of maatschappelijk gevoelige aspecten ten aanzien van zijn
      werkterrein;
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel6
  - number: 6.5.e
    text: |-
      het rapporteren aan de secretaris-generaal over de uitvoering van de jaarplannen betreffende de
      organisatieonderdelen, genoemd in [artikel 2, onderdeel b][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0024956#Artikel2
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel6
    references:
