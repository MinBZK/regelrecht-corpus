      betrekking heeft op de eigen verantwoordelijkheden of het eigen werkterrein.
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel7
  - number: '8.1'
    text: |-
      Elke (programma-)directeur-generaal en de inspecteur-generaal Nederlandse Arbeidsinspectie geven rechtstreeks
      leiding aan de hoofden van de organisatieonderdelen welke ingevolge [artikel 2][ref1] rechtstreeks onder elk van
      hen ressorteren.


      [ref1]: https://wetten.overheid.nl/BWBR0024956#Artikel2
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0024956
        artikel: '2'
        hoofdstuk: '2'
  - number: '8.2'
    text: |-
      Elke (programma-)directeur-generaal stelt de jaarplannen vast van de onder elk van hen ressorterende
      organisatieonderdelen. De inspecteur-generaal Nederlandse Arbeidsinspectie stelt een jaarplan voor de gehele
      Nederlandse Arbeidsinspectie vast. Gegeven het budget dat door de secretaris-generaal aan de betreffende
      (programma-)directeur-generaal respectievelijk de inspecteur-generaal Nederlandse Arbeidsinspectie ter
      beschikking is gesteld, kennen de (programma-)directeuren-generaal en de inspecteur-generaal Nederlandse
      Arbeidsinspectie aan de functionarissen die leiding geven aan de onder hen ressorterende organisatieonderdelen,
      de budgetten toe waarover zij mogen beschikken. De (programma-)directeuren-generaal bewaken de voortgang van
      de uitvoering van jaarplannen van de onder hen ressorterende organisatieonderdelen. De inspecteur-generaal
      Nederlandse Arbeidsinspectie bewaakt de voortgang van de uitvoering van het jaarplan van de gehele Nederlandse
      Arbeidsinspectie.
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel8
  - number: '8.3'
    text: 'De (programma-)directeuren-generaal zijn verantwoordelijk voor:'
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel8
  - number: 8.3.a
    text: |-
      het bij schriftelijk besluit toedelen van taken aan de onder hen ressorterende organisatieonderdelen en aan de
      functionarissen die leiding geven aan deze organisatieonderdelen;
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel8
  - number: 8.3.b
    text: |-
      de personeelsaangelegenheden van de functionarissen die onder hen ressorteren, voor zover dit niet ingevolge
      [artikel 4, vierde lid][ref1], aan de secretaris-generaal is opgedragen;


      [ref1]: https://wetten.overheid.nl/BWBR0024956#Artikel4
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0024956
        artikel: '4'
        hoofdstuk: '3'
