      [artikel 10, aanhef en onderdeel g][ref1], en van de directeur-generaal Werk in de rol van opdrachtgever als
      bedoeld in [artikel 11, aanhef en onderdeel j][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0024956#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0024956#Artikel11
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel6
    references:
