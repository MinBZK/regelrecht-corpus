      van de daarvoor beschikbaar gestelde budgetten en desbetreffende aanwijzingen van de secretaris-generaal;


      [ref1]: https://wetten.overheid.nl/BWBR0024956#Artikel2
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel7
    references:
      - id: ref1
