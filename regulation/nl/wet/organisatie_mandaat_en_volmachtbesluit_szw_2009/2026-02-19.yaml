        hoofdstuk: '3'
  - number: 6.4.e
    text: het inkoopbeleid;
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel6
  - number: 6.4.f
    text: overige facilitaire diensten;
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel6
  - number: 6.4.g
    text: |-
