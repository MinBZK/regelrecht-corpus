    text: |-
      het zorgdragen voor toedeling van de in onderdeel c bedoelde verantwoordelijkheid aan onder
      hen ressorterende functionarissen, voor zover deze functionarissen als bestuurder in de zin van
      [artikel 1 van de Wet op de ondernemingsraden][ref1] optreden;


      [ref1]: https://wetten.overheid.nl/BWBR0002747#Artikel1
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002747
        artikel: '1'
  - number: 8.3.e
    text: |-
      het adviseren van de bewindspersonen ten aanzien van hun eigen werkterrein en het attenderen van de bewindspersonen
      op politiek of maatschappelijk gevoelige aspecten ten aanzien van dat werkterrein;
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel8
  - number: 8.3.f
    text: |-
      het rapporteren aan de secretaris-generaal over de uitvoering van de jaarplannen betreffende de onder hen
      ressorterende organisatieonderdelen;
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel8
  - number: 8.3.g
    text: |-
      de behandeling van klachten als bedoeld in [artikel 9:1 van de Algemene wet bestuursrecht][ref1] voor zover deze
      betrekking hebben op gedragingen van de onder hen ressorterende functionarissen;


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel9
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '9'
  - number: 8.3.h
    text: |-
      het materieel beheer overeenkomstig de [Regeling materieelbeheer rijksoverheid 2006][ref1] en de
      [Regeling materieelbeheer museale voorwerpen][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0019767
      [ref2]: https://wetten.overheid.nl/BWBR0020583
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0019767
      - id: ref2
        bwb_id: BWBR0020583
  - number: '8.4'
    text: |-
      Het derde lid is van overeenkomstige toepassing op de inspecteur-generaal Nederlandse Arbeidsinspectie, met dien
      verstande dat hij voor de toepassing van onderdeel f verantwoordelijk is voor het rapporteren aan de secretaris-
      generaal over de uitvoering van het jaarplan van de gehele Nederlandse Arbeidsinspectie.
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel8
  - number: '9.1'
    text: |-
      Elke (programma-)directeur-generaal is bevoegd om namens een bewindspersoon besluiten te nemen, privaatrechtelijke
      rechtshandelingen te verrichten en handelingen te verrichten die noch een besluit, noch een privaatrechtelijke
      rechtshandeling zijn, voor zover zij verband houden met zijn werkterrein en voor zover zij niet zijn voorbehouden
      aan een bewindspersoon of de secretaris-generaal. Van de volmacht, bedoeld in de eerste volzin, is evenwel
      uitgezonderd het aangaan van de volgende overeenkomsten:
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel9
  - number: 9.1.a
    text: |-
      overeenkomsten met de Landsadvocaat en andere juridische dienstverleners inzake advisering en procureurstelling
      alsmede het instellen van gerechtelijke procedures;
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel9
  - number: 9.1.b
    text: |-
      overeenkomsten met het Centraal bureau voor de statistiek alsmede overeenkomsten met betrekking tot meerjarige,
      structurele beleidsinformatievoorziening die het verzamelen, bewerken en leveren van beleidsinformatie betreffen,
      voor zover deze informatie primair bedoeld is voor ramingen en verdeelmodellen, dan wel verband houdt met
      verplichtingen die voortvloeien uit de Regeling Rijksbegrotingsvoorschriften 2008 of met verplichtingen die
      voortvloeien uit internationale verdragen;
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel9
  - number: 9.1.c
    text: |-
      overeenkomsten betreffende de organisatie van voorlichtings- en informatiecampagnes en de productie en distributie
      van voorlichtingsmateriaal;
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel9
  - number: 9.1.d
    text: overeenkomsten betreffende externe advisering in het kader van voorlichtingsprojecten;
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel9
  - number: 9.1.e
    text: overeenkomsten met de arbodienst en het centraal flankerend beleid ten behoeve van herplaatsers;
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel9
  - number: 9.1.f
    text: |-
      overeenkomsten betreffende de technische infrastructuur, de hardware, de kantoorautomatiseringssoftware, de
      datacommunicatievoorzieningen en het technisch beheer van geautomatiseerde systemen, tenzij uit besluitvorming van
      de plaatsvervangend secretaris-generaal anders volgt;
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel9
  - number: 9.1.g
    text: |-
      overeenkomsten betreffende de huisvesting en facilitaire voorzieningen ten behoeve van de Haagse vestigingen van
      het ministerie;
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel9
  - number: 9.1.h
    text: overeenkomsten betreffende de gerechtelijke en buitengerechtelijke invordering van geldvorderingen van de Staat;
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel9
  - number: 9.1.i
    text: |-
      overeenkomsten met betrekking tot systeemontwikkeling, licenties, functioneel beheer en onderhoud van applicaties
      van geautomatiseerde informatie- en salarissystemen, tenzij uit besluitvorming van de plaatsvervangend secretaris-
      generaal anders volgt.
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel9
  - number: '9.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing op de inspecteur-generaal Nederlandse Arbeidsinspectie, met dien
      verstande dat hij tevens bevoegd is tot:
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel9
  - number: 9.2.a
    text: |-
      a. het aangaan van overeenkomsten die betrekking hebben op de productie en distributie van voorlichtingsmateriaal,
      gericht op de communicatie van toezichtsbevindingen en van handhavings-, opsporings- en toezichtsactiviteiten;
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel9
  - number: 9.2.b
    text: |-
      b. het aangaan van overeenkomsten die betrekking hebben op systeemontwikkeling, licenties, functioneel en
      netwerkbeheer en onderhoud van applicaties van voorlichtings- en documentatiesystemen ten behoeve van de
      handhavings-, opsporings- en toezichtstaken van de Nederlandse Arbeidsinspectie;
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel9
  - number: 9.2.c
    text: |-
      c. het aangaan van de overeenkomsten, bedoeld in het eerste lid, onderdelen f en g, voor zover geen gebruik wordt
      gemaakt van de departementale infrastructuur en er geen sprake is van huisvesting in een gebouw waar tevens een
      ander organisatieonderdeel van het ministerie, niet zijnde de Directie Dienstverlening, Samenwerkingsverbanden en
      Uitvoering, is gehuisvest.
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel9
  - number: '9.3'
    text: |-
      De in het eerste en tweede lid bedoelde bevoegdheden van de (programma-)directeuren-generaal en de inspecteur-
      generaal Nederlandse Arbeidsinspectie omvatten in elk geval mandaat, volmacht en machtiging ten aanzien van de
      volgende aangelegenheden:
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel9
  - number: 9.3.a
    text: |-
      beslissingen in bezwaar- en beroepsprocedures voor zover deze betrekking hebben op hun eigen verantwoordelijkheden
      of werkterrein;
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel9
  - number: 9.3.b
    text: |-
      de aangelegenheden, genoemd in [artikel 8, derde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0024956#Artikel8
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0024956
        artikel: '8'
        hoofdstuk: '3'
  - number: 9.3.c
    text: |-
      het aangaan van arbeidsovereenkomsten met de onder hen ressorterende hoofden van afdelingen, subafdelingen en
      bureaus en van teamleiders aan wie bevoegdheden zijn toegekend met betrekking tot personeelsaangelegenheden, voor
      zover het gaat om functies met het maximum van salarisschaal 13 zoals overeengekomen in de laatstelijk afgesloten
      collectieve arbeidsovereenkomst voor rijksambtenaren, mits zij van hun voornemen daartoe vooraf melding hebben
      gemaakt in de Commissie Management Development;
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel9
  - number: 9.3.d
    text: het instellen van tijdelijke projectorganisaties binnen hun eigen werkterrein;
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel9
  - number: 9.3.e
    text: |-
      de formatie van de onder hen ressorterende organisatieonderdelen, een en ander met inachtneming van de daarvoor
      beschikbaar gestelde budgetten en desbetreffende aanwijzingen van de secretaris-generaal;
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel9
  - number: 9.3.f
    text: |-
      het verlenen en vaststellen van subsidies en rijksvergoedingen, het aangaan van verbetertrajecten en het korten op
      bevoorschotting, voor zover het de uitvoering betreft van regelingen op hun eigen werkterrein;
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel9
  - number: 9.3.g
    text: |-
      het nemen van dwangsombesluiten die verband houden met het niet tijdig afdoen van een besluit, voor zover dit
      betrekking heeft op hun eigen verantwoordelijkheden of werkterrein.
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel9
  - number: '9.4'
    text: |-
      De uitzonderingen, genoemd in het eerste lid, onderdelen c, d, f, h en i, gelden niet voor de in het eerste
      lid genoemde bevoegdheden die de directeur-generaal Sociale Zekerheid en Integratie heeft in verband met zijn
      werkterrein beschreven in [artikel 10, aanhef en onderdelen s en t][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024956#Artikel10
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0024956
        artikel: '10'
        hoofdstuk: '3'
  - number: '10'
    text: |-
      De directeur-generaal Sociale Zekerheid en Integratie is belast met de beleids- en bedrijfsvoering betreffende de
      organisatieonderdelen, genoemd in [artikel 2, onderdeel c][ref1]. Het werkterrein van de directeur-generaal Sociale
      Zekerheid en Integratie omvat in brede zin:


      [ref1]: https://wetten.overheid.nl/BWBR0024956#Artikel2
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0024956
        artikel: '2'
        hoofdstuk: '2'
  - number: 10.a
    text: |-
      het zorgdragen voor een effectief re-integratiebeleid, onder meer door een samenhangend pakket re-integratie-
      instrumenten en een effectieve en efficiënte inzet daarvan door de uitvoering door onder andere een regionale
      aanpak van het arbeidsmarktbeleid;
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel10
  - number: 10.b
    text: |-
      het scheppen van voorwaarden voor het re-integreren van mensen met een sociale zekerheidsuitkering (werkloosheid,
      arbeidsongeschiktheid en bijstand) in betaalde arbeid of zelfstandig ondernemerschap, zowel aan de aanbodkant als
      aan de vraagkant;
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel10
  - number: 10.c
    text: |-
      het doen inschakelen van mensen met en zonder uitkering in andere vormen van maatschappelijke participatie indien
      inschakeling in betaalde arbeid nog niet mogelijk blijkt, als stap op weg naar betaald werk;
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel10
  - number: 10.d
    text: |-
      het formuleren van het beleid ten aanzien van de rechten en plichten van de sociale verzekeringen en voorzieningen,
      gericht op preventie, werk en bescherming, waaronder verstaan wordt het beleid op het terrein van armoede en
      schuldhulpverlening;
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel10
  - number: 10.e
    text: |-
      het formuleren van het financieringsbeleid van de sociale verzekeringen en voorzieningen gericht op het stimuleren
      van werknemers, werkgevers en de uitvoering;
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel10
  - number: 10.f
    text: |-
      het beheren van de relatie tussen het ministerie en de partners in het domein van werk en inkomen, zoals onder meer
      de uitvoeringsorganisaties en gemeenten;
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel10
  - number: 10.g
    text: het vervullen van de rol van opdrachtgever van de uitvoeringsorganisaties van het ministerie;
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel10
  - number: 10.h
    text: |-
      het adviseren van de secretaris-generaal over het maken van prestatieafspraken, het bewaken van de realisatie
      daarvan en – indien nodig – optreden;
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel10
  - number: 10.i
    text: |-
      het aansturen van de samenwerking in de keten van uitvoeringsorganisaties en gemeenten, gericht op de toeleiding
      naar werk en het verstrekken van uitkeringen, met inbegrip van de gegevensinfrastructuur en het daartoe
      ondersteunende gegevensverkeer;
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel10
  - number: 10.j
    text: het zorgdragen voor de ontwikkeling en het beheer van het uitvoeringsstelsel, waarbij innovatie centraal staat;
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel10
  - number: 10.k
    text: |-
      het intra- en interdepartementaal coördineren van de regeldrukprogramma’s voor bedrijven, burgers, professionals
      en medeoverheden;
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel10
  - number: 10.l
    text: |-
      het strategisch en eenduidig opereren in de regio door het ministerie en de afstemming hierover met andere
      departementen en de partners in het domein van werk en inkomen;
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel10
  - number: 10.m
    text: |-
      het coördineren en maken van beleid op het gebied van de gegevensuitwisseling, privacy en beveiliging binnen het
      domein van werk en inkomen en aanpalende domeinen;
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel10
  - number: 10.n
    text: |-
      het ontwikkelen van een handhavingsstrategie van het ministerie met systematische aandacht voor handhaven in alle
      onderdelen van de beleidscyclus en de hele keten van werk en inkomen gericht op de effectiviteit van de handhaving;
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel10
  - number: 10.o
    text: |-
      het bevorderen van vernieuwingen in het handhavingsbeleid van het ministerie en de uitvoeringsorganisaties en het
      (doen) aanpakken van lacunes in beleid, wetgeving en uitvoering;
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel10
  - number: 10.p
    text: |-
      het bevorderen van de samenhang in het handhavings- en opsporingsbeleid van het ministerie en de
      uitvoeringsorganisaties met het beleid van externe partijen;
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel10
  - number: 10.q
    text: |-
      het zorgdragen voor de afwikkeling van de opgeheven Raad voor Werk en Inkomen en de opgeheven
      arbeidsvoorzieningsorganisatie;
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel10
  - number: 10.r
    text: het ontwikkelen en uitvoeren van beleid gericht op inburgering;
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel10
  - number: 10.s
    text: |-
      het uitvoeren van de [Remigratiewet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0010424
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0010424
  - number: 10.t
    text: het ontwikkelen en uitvoeren van beleid gericht op integratie en antidiscriminatie;
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel10
  - number: 10.u
    text: |-
      het (waar nodig) leveren van een bijdrage aan generiek beleid zodanig dat het voor migranten in de samenleving
      toegankelijk en effectief is;
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel10
  - number: 10.v
    text: het ten aanzien van integratievraagstukken ontwikkelen, onderhouden en beschikbaar stellen van kennis;
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel10
  - number: 10.w
    text: |-
      de (inter)departementale beleidsvorming en het daarmee samenhangende financieel beheer inzake de openbare
      lichamen Bonaire, Sint Eustatius en Saba, mede voor zover dit geschiedt op het werkterrein van de secretaris-
      generaal, de plaatsvervangend secretaris-generaal, de directeur-generaal Werk en de inspecteur-generaal Nederlandse
      Arbeidsinspectie. De directies die ressorteren onder voornoemde functionarissen blijven de hen toebedeelde
      taken en verantwoordelijkheden uitvoeren, met de bijbehorende bevoegdheden, maar leggen voor wat betreft de
      (inter)departementale beleidsvorming en het daarmee samenhangende financieel beheer inzake de openbare lichamen
      Bonaire, Sint Eustatius en Saba verantwoording af aan de directeur-generaal Sociale Zekerheid en Integratie;
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel10
  - number: 10.x
    text: het zorgdragen voor de uitvoeringstaken van de bewindspersoon op Bonaire, Sint Eustatius en Saba.
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel10
  - number: '11'
    text: |-
      De directeur-generaal Werk is belast met de beleids- en bedrijfsvoering betreffende de organisatieonderdelen,
      genoemd in [artikel 2, onderdeel d][ref1]. Het werkterrein van de directeur-generaal Werk omvat in brede zin:


      [ref1]: https://wetten.overheid.nl/BWBR0024956#Artikel2
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0024956
        artikel: '2'
        hoofdstuk: '2'
  - number: 11.a
    text: de algemeen-economische beleidsontwikkeling en het inkomensbeleid;
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel11
  - number: 11.b
    text: het beleid met betrekking tot de bestrijding en preventie van arbeidsrisico's en ziekteverzuim;
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel11
  - number: 11.c
    text: de wijze waarop arbeidsvoorwaarden worden vormgegeven (CAO’s, algemeen verbindend verklaren, medezeggenschap);
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel11
  - number: 11.d
    text: arbeidsmigratie;
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel11
  - number: 11.e
    text: de kaders voor de vormgeving van enkele specifieke arbeidsvoorwaarden (pensioenen, levensloop, arbeid en zorg);
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel11
  - number: 11.f
    text: de strategievorming op het brede SZW-beleidsterrein;
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel11
  - number: 11.g
    text: |-
      de departementale coördinatie van het internationale beleid en het uitdragen van en onderhandelen over de
      Nederlandse standpunten in multilateraal en bilateraal verband;
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel11
  - number: 11.h
    text: |-
      de coördinatie van de advisering rond budgettaire en ordeningsvraagstukken in de collectieve sector, voor zover dit
      buiten het Sociale Zekerheid en Arbeidsmarkt-kader valt;
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel11
  - number: 11.i
    text: |-
      de wijze waarop werkenden beschermd, behandeld en toegerust worden (arbeidsrecht, gelijke behandeling en
      diversiteit);
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel11
  - number: 11.j
    text: het kinderopvangbeleid;
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel11
  - number: 11.k
    text: het vervullen van de rol van opdrachtgever van de uitvoeringsorganisaties van het ministerie.
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel11
  - number: '12.1'
    text: |-
      De inspecteur-generaal Nederlandse Arbeidsinspectie is belast met de beleids- en bedrijfsvoering betreffende de
      Nederlandse Arbeidsinspectie, die bestaat uit de organisatieonderdelen, genoemd in [artikel 2, onderdeel e][ref1].
      Het werkterrein van de inspecteur-generaal Nederlandse Arbeidsinspectie omvat in brede zin:


      [ref1]: https://wetten.overheid.nl/BWBR0024956#Artikel2
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0024956
        artikel: '2'
        hoofdstuk: '2'
  - number: 12.1.a
    text: |-
      het houden van toezicht op de naleving van wet- en regelgeving op de beleidsterreinen, waarvoor de bewindspersoon
      verantwoordelijkheid draagt, en het in verband daarmee opsporen van strafbare feiten, alsmede het aan de
      bewindspersoon opgedragen toezicht op de werking van de stelsels van persoonsregistratie, certificering en
      keuringen en het aan de bewindspersoon opgedragen toezicht op de toezichtswerkzaamheden van door de bewindspersoon
      op grond van wet- en regelgeving op het terrein van arbeidsveiligheid, arbeidsgezondheid en productveiligheid
      aangewezen certificatie- en keuringsinstellingen die zijn belast met het verstrekken van certificaten, dan wel
      het verrichten van keuringen in het belang van veiligheid en gezondheid in de arbeid alsook het op hun verzoek
      aanwijzen van instellingen als certificatie- of keuringsinstelling, als in dit onderdeel genoemd;
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel12
  - number: 12.1.b
    text: |-
      het opsporen van strafbare feiten op de beleidsterreinen waarvoor de bewindspersoon verantwoordelijkheid draagt,
      het in het kader van deze opsporing constateren van andere strafbare feiten welke daarmee verband houden, het
      in verband met de opsporing van strafbare feiten verzamelen van criminele inlichtingen en het verwerken van
      persoonsgegevens binnen de daarvoor geldende wettelijke bepalingen, alsmede het opsporen van strafbare feiten op
      andere beleidsterreinen voor zover daartoe door het desbetreffende bestuursorgaan bevoegdheid is gegeven;
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel12
  - number: 12.1.c
    text: |-
      de uitvoering van de taken, bedoeld in
      [hoofdstuk 7 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0013060
        hoofdstuk: '7'
  - number: '12.2'
    text: |-
      De inspecteur-generaal Nederlandse Arbeidsinspectie geeft op verzoek van een der kamers van de Staten Generaal
      of een commissie uit een van die kamers een toelichting op het jaarverslag of een andere rapportage van de
      Nederlandse Arbeidsinspectie nadat het desbetreffende stuk aan de kamers ter kennisname is gebracht. De inspecteur-
      generaal Nederlandse Arbeidsinspectie beperkt zich daarbij tot het geven van inlichtingen van feitelijke aard. De
      inspecteur-generaal Nederlandse Arbeidsinspectie stelt de bewindspersoon terstond in kennis van een verzoek als
      hier bedoeld.
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel12
  - number: '12.3'
    text: |-
      De inspecteur-generaal Nederlandse Arbeidsinspectie is verantwoordelijk voor de verspreiding van jaarverslagen
      en inspectierapportages ten aanzien van de daarin opgenomen bevindingen, nadat de secretaris-generaal en de
      bewindslieden van het jaarverslag en de inspectierapportage kennis hebben kunnen nemen.
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel12
  - number: '12.4'
    text: |-
      De Nederlandse Arbeidsinspectie vervult de rol van verbindingsbureau detacheringsarbeid, bedoeld in
      [artikel 4, eerste lid, van de Wet arbeidsvoorwaarden gedetacheerde werknemers in de Europese Unie][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0038054#Artikel4
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0038054
        artikel: '4'
  - number: '12.5'
    text: De Nederlandse Arbeidsinspectie is verantwoordelijk voor het Informatieknooppunt SZW.
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel12
  - number: '13.1'
    text: |-
      Waar in wet- en regelgeving bevoegdheden zijn toegekend aan de Arbeidsinspectie of aan de Inspectie SZW,
      aan ambtenaren van de Arbeidsinspectie of van de Inspectie SZW dan wel aan de algemeen directeur van de
      Arbeidsinspectie of aan de inspecteur-generaal Sociale Zaken en Werkgelegenheid, worden deze bevoegdheden
      uitgeoefend door de Nederlandse Arbeidsinspectie, ambtenaren van de Nederlandse Arbeidsinspectie respectievelijk
      de inspecteur-generaal Nederlandse Arbeidsinspectie. Waar in enig wettelijk voorschrift ambtenaren van de
      Arbeidsinspectie of van de Inspectie SZW zijn aangewezen als ambtenaren belast met toezicht op de naleving of
      opsporing, gelden die aanwijzingen nu voor de ambtenaren van de Nederlandse Arbeidsinspectie, die daartoe bij de
      Nederlandse Arbeidsinspectie zijn aangesteld.
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel13
  - number: '13.2'
    text: |-
      De directie Opsporing is de bijzondere opsporingsdienst, bedoeld in
      [artikel 2, aanhef en onderdeel d, van de Wet op de bijzondere opsporingsdiensten][ref1]. Waar in wet- en
      regelgeving bevoegdheden zijn toegekend aan de Sociale Inlichtingen- en Opsporingsdienst of aan de Inspectie
      SZW dan wel aan ambtenaren van de Sociale Inlichtingen- en Opsporingsdienst of van de Inspectie SZW, worden deze
      bevoegdheden uitgeoefend door de directie Opsporing respectievelijk ambtenaren van de directie Opsporing van de
      Nederlandse Arbeidsinspectie.


      [ref1]: https://wetten.overheid.nl/BWBR0019919#Artikel2
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0019919
        artikel: '2'
  - number: '13.3'
    text: |-
      Waar in wet- en regelgeving bevoegdheden zijn toegekend aan de directie Arbeidsmarktfraude, de directie
      Arbeidsomstandigheden en de directie Major Hazard Control dan wel aan ambtenaren van die directies, worden deze
      bevoegdheden uitgeoefend door de directie Meldingen en Verzoeken, dan wel de directie Toezicht respectievelijk
      ambtenaren van die directies.
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel13
  - number: 13a
    text: |-
      De programma-directeur-generaal Werk aan Uitvoering is belast met de beleids- en bedrijfsvoering betreffende de
      organisatieonderdelen, genoemd in [artikel 2, onderdeel f][ref1]. Het werkterrein van de programma-directeur-
      generaal Werk aan Uitvoering omvat in brede zin:


      [ref1]: https://wetten.overheid.nl/BWBR0024956#Artikel2
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0024956
        artikel: '2'
        hoofdstuk: '2'
  - number: 13a.a
    text: |-
      het vormgeven en ondersteunen van de door de Ambtelijke Commissie Uitvoering (ACU) benoemde programmatische en
      projectmatige activiteiten;
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel13a
  - number: 13a.b
    text: |-
      het inspireren, signaleren, faciliteren, evalueren en het bieden van richting en support aan de Werk aan
      Uitvoering-beweging door interventies optimaal in te zetten bij de politiek, beleidsmakers en publieke
      dienstverleners;
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel13a
  - number: 13a.c
    text: |-
      het werken aan domein overstijgende vereenvoudiging van wet- en regelgeving voor inkomensondersteuning vanuit het
      perspectief van burgers.
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel13a
  - number: 13b.1
    text: De Regeringscommissaris transitie pensioenen staat beheersmatig onder leiding van de directeur-generaal Werk.
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel13b
  - number: 13b.2
    text: 'De Regeringscommissaris transitie pensioenen heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel13b
  - number: 13b.2.a
    text: het beoordelen en bevorderen van het verloop van de transitie naar het nieuwe pensioenstelsel;
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel13b
  - number: 13b.2.b
    text: |-
      het volgen van de voortgang van de transitie naar het nieuwe pensioenstelsel en het signaleren van eventuele
      knelpunten;
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel13b
  - number: 13b.2.c
    text: |-
      het gevraagd en ongevraagd adviseren van de bewindspersoon over de mogelijke maatregelen om eventuele knelpunten in
      de transitie weg te nemen;
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel13b
  - number: 13b.2.d
    text: |-
      het bevorderen dat bij de transitie betrokken partijen hun verantwoordelijkheid nemen voor het tijdig en zorgvuldig
      doorlopen van de transitie;
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel13b
  - number: 13b.2.e
    text: |-
      het stimuleren dat goede voorbeelden die bevorderlijk zijn voor het verloop van de transitie worden gedeeld, met
      inachtneming van de wettelijke kaders;
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel13b
  - number: 13b.3
    text: |-
      De Regeringscommissaris transitie pensioenen wordt in de taakuitoefening ondersteund door de directie
      Pensioenbeleid.
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel13b
  - number: '14.1'
    text: |-
      De uitoefening van vertegenwoordigingsbevoegdheden geschiedt binnen de grenzen van de vastgestelde taken en met
      inachtneming van het terzake geldende recht alsmede de voor de rijksdienst en voor het ministerie geldende beleids-
      en uitvoeringsregels.
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel14
  - number: '14.2'
    text: |-
      De algemene bepalingen inzake organisatie, mandaat, volmacht en machtiging in dit besluit zijn tevens van
      toepassing ten aanzien van de uitoefening van bevoegdheden die krachtens ondermandaat respectievelijk doorverlening
      van volmacht en machtiging worden uitgeoefend.
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel14
  - number: '14.3'
    text: |-
      Het uitoefenen van vertegenwoordigingsbevoegdheden die betrekking hebben op aangelegenheden met (mogelijke)
      financiële gevolgen geschiedt, onverminderd het bepaalde in het eerste lid, met inachtneming van:
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel14
  - number: 14.3.a
    text: de begrotingswet en de daarbij gegeven financiële ruimte;
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel14
  - number: 14.3.b
    text: de voor de vertegenwoordigingsbevoegde geldende jaarplannen en budgetten;
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel14
  - number: 14.3.c
    text: |-
      het bepaalde bij en krachtens de [Comptabiliteitswet 2001][ref1] en de aanwijzingen van de directeur Financieel-
      Economische Zaken op grond van [die wet][ref2] en de daarop berustende regelgeving;


      [ref1]: https://wetten.overheid.nl/BWBR0013891
      [ref2]: https://wetten.overheid.nl/BWBR0013891
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0013891
      - id: ref2
        bwb_id: BWBR0013891
  - number: 14.3.d
    text: door de secretaris-generaal te stellen regels betreffende de (financiële) besturing van het ministerie.
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel14
  - number: '14.4'
    text: 'Verleningen van mandaat, volmacht en machtiging zijn niet van toepassing:'
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel14
  - number: 14.4.a
    text: indien bij wettelijk voorschrift is bepaald dat verlening van de betreffende bevoegdheid niet mogelijk is;
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel14
  - number: 14.4.b
    text: indien de aard van de bevoegdheid zich daartegen verzet.
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel14
  - number: '15.1'
    text: |-
      De afdoening van alle stukken waarvan de bewindspersonen aangeven dat zij deze zelf wensen af te doen, geschiedt
      door een bewindspersoon.
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel15
  - number: '15.2'
    text: |-
      Tenzij de bewindspersonen anders te kennen geven, worden brieven ter beantwoording van persoonlijke brieven,
      gericht aan (een van) de bewindspersonen, ondertekend door een bewindspersoon.
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel15
  - number: '15.3'
    text: |-
      De vertegenwoordigingsbevoegde is gehouden in de ondertekening van stukken die op basis van mandaat, volmacht of
      machtiging worden ondertekend, zijn vertegenwoordigingsbevoegdheid tot uitdrukking te brengen. Dit doet hij door
      opneming van een van de volgende hieronder weergegeven formules:
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel15
  - number: 15.3.a
    text: |-
      De Minister van Sociale Zaken en Werkgelegenheid, namens deze, handtekening van de betrokken
      vertegenwoordigingsbevoegde, naam van de betrokken vertegenwoordigingsbevoegde, functie betrokken
      vertegenwoordigingsbevoegde;
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel15
  - number: 15.3.b
    text: |-
      De Staatsecretaris van Sociale Zaken en Werkgelegenheid, namens deze, handtekening van de betrokken
      vertegenwoordigingsbevoegde, naam van de betrokken vertegenwoordigingsbevoegde, functie betrokken
      vertegenwoordigingsbevoegde.
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel15
  - number: '15.4'
    text: |-
      Stukken kunnen met goedvinden van een bewindspersoon overeenkomstig de door hen geparafeerde minute worden
      ondertekend door de secretaris-generaal dan wel door een door de bewindspersoon aan te wijzen andere functionaris.
      Daartoe wordt een van de volgende formules opgenomen:
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel15
  - number: 15.4.a
    text: |-
      Overeenkomstig het door de Minister van Sociale Zaken en Werkgelegenheid genomen besluit, handtekening van de
      betrokken vertegenwoordigingsbevoegde, naam van de betrokken vertegenwoordigingsbevoegde, functie betrokken
      vertegenwoordigingsbevoegde;
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel15
  - number: 15.4.b
    text: |-
      Overeenkomstig het door de Staatsecretaris van Sociale Zaken en Werkgelegenheid genomen besluit, handtekening van
      de betrokken vertegenwoordigingsbevoegde, naam van de betrokken vertegenwoordigingsbevoegde, functie betrokken
      vertegenwoordigingsbevoegde.
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel15
  - number: '15.5'
    text: |-
      In afwijking van het derde lid blijft de handtekening van de directeur Collectieve arbeidsovereenkomsten achterwege
      voor categorieën van beschikkingen die schriftelijk zijn aangewezen door de directeur-generaal Werk.
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel15
  - number: '16.1'
    text: 'Stukken, bestemd voor:'
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel16
  - number: 16.1.a
    text: de Koning;
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel16
  - number: 16.1.b
    text: de Raad van State (van het Koninkrijk), voor zover betrekking hebbend op wetgeving;
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel16
  - number: 16.1.c
    text: de Raad van Ministers (van het Koninkrijk);
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel16
  - number: 16.1.d
    text: de Eerste of Tweede Kamer der Staten-Generaal;
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel16
  - number: 16.1.e
    text: de Algemene Rekenkamer;
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel16
  - number: 16.1.f
    text: de Nationale ombudsman; en
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel16
  - number: 16.1.g
    text: een extern advies- of overlegorgaan;
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel16
  - number: '16.2'
    text: |-
      Ministeriële regelingen houdende algemeen verbindende voorschriften worden vastgesteld en ondertekend door een
      bewindspersoon. Indien bij of krachtens de wet waarbij de bevoegdheid tot het vaststellen van een ministeriële
      regeling wordt verleend in de mogelijkheid van mandaatverlening is voorzien, kan een ministeriële regeling namens
      de bewindspersoon worden vastgesteld en ondertekend door hetzij de functionaris die daartoe bij of krachtens die
      wetsbepaling is aangewezen, hetzij de functionaris die daarvoor op grond van deze regeling in aanmerking komt.
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel16
  - number: '16.3'
    text: |-
      Besluiten inzake het verlenen van goedkeuring aan, het schorsen of het vernietigen van dan wel het onthouden van
      goedkeuring aan besluiten van een ander bestuursorgaan worden genomen en ondertekend door een bewindspersoon.
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel16
  - number: '16.4'
    text: |-
      Besluiten inzake de definitieve buiteninvorderingstelling van vorderingen op derden van meer dan € 1.000.000,–
      worden genomen en ondertekend door een bewindspersoon.
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel16
  - number: '16.5'
    text: |-
      Besluiten inzake kwijtschelding van vorderingen op derden van meer dan € 1.000.000,– worden genomen en ondertekend
      door een bewindspersoon.
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel16
  - number: '16.6'
    text: |-
      Besluiten tot instelling van een externe of interdepartementale commissie of een adviescollege in de zin van de
      [Kaderwet adviescolleges][ref1] en de benoeming van de leden van deze organen dan wel de inschakeling van externe
      personen die op verzoek van een bewindspersoon op persoonlijke titel en op individuele basis een bepaalde taak
      verrichten, worden genomen en ondertekend door een bewindspersoon.


      [ref1]: https://wetten.overheid.nl/BWBR0008159
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0008159
  - number: '17.1'
    text: |-
      Een voorstel tot het nemen van een besluit als bedoeld [artikel 16, zesde lid][ref1], wordt na schriftelijke
      instemming van de secretaris-generaal aan een bewindspersoon voorgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0024956#Artikel16
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0024956
        artikel: '16'
        hoofdstuk: '4'
  - number: '17.2'
    text: |-
      Besluiten tot de toekenning van vergoedingen en beloningen aan een externe of interdepartementale commissie,
      een adviescollege in de zin van de Kaderwet adviescolleges, dan wel aan externe personen die op verzoek van een
      bewindspersoon op persoonlijke titel en op individuele basis een bepaalde taak verrichten, worden genomen na
      schriftelijke instemming van de secretaris-generaal.
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel17
  - number: '18.1'
    text: |-
      Bij afwezigheid of verhindering van een vertegenwoordigingsbevoegde worden, voor de duur van de afwezigheid of
      verhindering, diens taken en bevoegdheden waargenomen door een daartoe aan te wijzen plaatsvervanger, behoudens de
      bevoegdheid tot het verlenen, wijzigen of intrekken van mandaten, volmachten en machtigingen.
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel18
  - number: '18.2'
    text: |-
      Bij gelijktijdige afwezigheid of verhindering van de secretaris-generaal en de plaatsvervangend secretaris-generaal
      worden de taken en bevoegdheden van de secretaris-generaal waargenomen door de directeur-generaal Sociale Zekerheid
      en Integratie, de directeur-generaal Werk of de programma-directeur-generaal Werk aan Uitvoering, behoudens de
      bevoegdheid tot het verlenen, wijzigen of intrekken van mandaten, volmachten en machtigingen.
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel18
  - number: '19'
    text: |-
      Tenzij in deze regeling anders is bepaald, is de leidinggevende van een vertegenwoordigingsbevoegde te allen tijde
      bevoegd de aan deze verleende bevoegdheden zelf uit te oefenen.
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel19
  - number: '20'
    text: |-
      Een vertegenwoordigingsbevoegde is niet bevoegd tot het nemen van besluiten over en het vaststellen en ondertekenen
      van stukken op het gebied van personeelsaangelegenheden die betrekking hebben op hemzelf.
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel20
  - number: '22.1'
    text: |-
      Het gebruik van een afgesloten raamovereenkomst is verplicht, behoudens toestemming van de houder van de
      raamovereenkomst om hiervan af te wijken.
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel22
  - number: '22.3'
    text: |-
      Indien de geraamde waarde van een voorgenomen opdracht € 33.000,– exclusief BTW of meer bedraagt, is inschakeling
      van de Rijksinkoopsamenwerking verplicht.
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel22
  - number: '22.5'
    text: |-
      Een opdracht voor de externe inhuur van interim-management, organisatie- en formatieadviezen, communicatieadvies
      of beleidsadvies wordt slechts verleend na voorafgaande instemming van een van de functionarissen, genoemd in
      [artikel 3, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024956#Artikel3
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0024956
        artikel: '3'
        hoofdstuk: '2'
  - number: '22.6'
    text: Het vijfde lid is niet van toepassing op de RCN-unit SZW, gevestigd te Bonaire, Sint Eustatius en Saba.
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel22
  - number: '23.1'
    text: |-
      De secretaris-generaal, de plaatsvervangend secretaris-generaal, de directeuren-generaal en de inspecteur-
      generaal Nederlandse Arbeidsinspectie kunnen hun vertegenwoordigingsbevoegdheden in een door hen te bepalen
      omvang mandateren of doorverlenen aan onder hen ressorterende functionarissen. Zij kunnen daarbij bepalen dat deze
      ondermandaat kunnen verlenen respectievelijk volmacht en machtiging kunnen doorverlenen aan rechtstreeks onder hen
      ressorterende functionarissen.
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel23
  - number: '23.2'
    text: |-
      Bevoegdheden ten aanzien van de volgende aangelegenheden kunnen niet worden doorverleend aan andere dan de in
      [artikel 3, eerste lid][ref1], genoemde functionarissen:


      [ref1]: https://wetten.overheid.nl/BWBR0024956#Artikel3
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0024956
        artikel: '3'
        hoofdstuk: '2'
  - number: 23.2.a
    text: |-
      het aangaan van overeenkomsten met een waarde van € 500.000,– of meer, tenzij het betreft overeenkomsten met het
      Centraal bureau voor de statistiek in welk geval het mag gaan om overeenkomsten met een waarde van ten hoogste
      € 1.000.000,–;
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel23
  - number: 23.2.b
    text: |-
      het aangaan en beëindigen van arbeidsovereenkomsten met functionarissen die vallen onder de laatstelijk afgesloten
      collectieve arbeidsovereenkomst voor rijksambtenaren;
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel23
  - number: 23.2.c
    text: |-
      het op grond van [artikel 22a van het Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref1] toekennen van
      periodieke toeslagen voor zover het gaat om toeslagen om redenen van werving en behoud;


      [ref1]: https://wetten.overheid.nl/BWBR0003630#Artikel22a
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0003630
        artikel: 22a
  - number: 23.2.d
    text: de voorlopige buiteninvorderingstelling van vorderingen op derden van meer dan € 1.000.000,–;
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel23
  - number: 23.2.e
    text: de formatie van organisatieonderdelen;
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel23
  - number: 23.2.f
    text: |-
      het vaststellen en ondertekenen van beleidsregels als bedoeld in
      [artikel 1:3, vierde lid, van de Algemene wet bestuursrecht][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel1
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '1'
  - number: 23.2.g
    text: |-
      het geven van opdracht tot het doen verrichten van een (intern) onderzoek naar integriteitsschending overeenkomstig
      de Leidraad Onderzoek Integriteitsschending.
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel23
  - number: '23.3'
    text: |-
      Onverminderd het bepaalde in het eerste en tweede lid kunnen de secretaris-generaal, de plaatsvervangend
      secretaris-generaal, de directeuren-generaal en de inspecteur-generaal Nederlandse Arbeidsinspectie hun
      bevoegdheden eveneens doorverlenen aan functionarissen die niet onder hen ressorteren, mits de betreffende
      functionaris daarmee schriftelijk instemt.
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel23
  - number: '23.4'
    text: |-
      De (door)verlening van (onder-)mandaat, volmacht en machtiging kan uitsluitend bij een schriftelijk besluit
      geschieden.
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel23
  - number: '23.5'
    text: |-
      In afwijking van het tweede lid, onderdeel b, kan de plaatsvervangend secretaris-generaal de bevoegdheid
      doorverlenen aan de directeur van de Rijksschoonmaakorganisatie ten aanzien van het aangaan en beëindigen van
      arbeidsovereenkomsten met onder de directeur van de Rijksschoonmaakorganisatie ressorterende functionarissen die
      vallen onder de laatstelijk afgesloten collectieve arbeidsovereenkomst voor rijksambtenaren.
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel23
  - number: '24.1'
    text: |-
      De vertegenwoordigingsbevoegde brengt de door hem vastgestelde organisatie- mandaat- en volmachtbesluiten
      onmiddellijk en in elk geval voor de bekendmaking ter kennis aan de mandaat- respectievelijk volmachtgever en –
      indien deze niet tevens de directe leidinggevende is – aan de directe leidinggevende, alsmede aan de secretaris-
      generaal.
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel24
  - number: '24.2'
    text: |-
      Binnen het ministerie wordt een mandaat-, volmacht- en machtigingsregister SZW bijgehouden. De
      vertegenwoordigingsbevoegde draagt zorg voor een juiste, volledige en tijdige aanlevering van de door hem
      vastgestelde besluiten tot doorverlening van mandaten, volmachten en machtigingen, alsmede van aanwijzingen
      van plaatsvervangers als bedoeld in [artikel 18][ref1], aan de beheerder van het mandaat-, volmacht- en
      machtigingsregister SZW.


      [ref1]: https://wetten.overheid.nl/BWBR0024956#Artikel18
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0024956
        artikel: '18'
        hoofdstuk: '4'
  - number: '25.1'
    text: |-
      Aan de uitoefening van de bij dit besluit opgedragen taken en van de bij en krachtens dit besluit verleende
      bevoegdheden kunnen door iedere leidinggevende algemene en bijzondere aanwijzingen aan zijn ondergeschikten worden
      verbonden.
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel25
  - number: '25.2'
    text: De vertegenwoordigingsbevoegde is gehouden de algemene en bijzondere aanwijzingen op te volgen.
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel25
  - number: '25.3'
    text: |-
      Elke leidinggevende is gehouden toe te zien op de naleving door zijn ondergeschikten van deze en andere mandaat-
      en volmachtbesluiten en van de aan de uitoefening van het mandaat, de volmacht of machtiging verbonden algemene en
      bijzondere aanwijzingen.
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel25
  - number: '25.4'
    text: |-
      De vertegenwoordigingsbevoegde is gehouden met inachtneming van de door zijn leidinggevende(n) te geven algemene
      en bijzondere aanwijzingen aan zijn leidinggevende(n) te rapporteren over de wijze waarop hij zijn taken heeft
      uitgeoefend en van zijn vertegenwoordigingsbevoegdheden gebruik heeft gemaakt. De leidinggevende(n) kan/kunnen
      algemene en bijzondere aanwijzingen geven omtrent de vorm, inhoud, tijdstippen en perioden van de rapportage.
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel25
  - number: '25.5'
    text: |-
      Alle in deze regeling genoemde bedragen zijn inclusief BTW, met uitzondering van het bedrag, genoemd in
      [artikel 22, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024956#Artikel22
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0024956
        artikel: '22'
        hoofdstuk: '4'
  - number: '29.1'
    text: |-
      Het [Organisatie-, mandaat- en volmachtbesluit SZW 2004][ref1] en de
      [Regeling taken en bevoegdheden bezwaar- en beroepszaken werktijdverkorting][ref2] worden ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0016199
      [ref2]: https://wetten.overheid.nl/BWBR0016492
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0016199
      - id: ref2
        bwb_id: BWBR0016492
  - number: '29.2'
    text: |-
      Na inwerkingtreding van dit besluit berust het [Mandaat projectdirectie Leren en Werken][ref1] op
      [artikel 23, eerste lid][ref2], van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0018705
      [ref2]: https://wetten.overheid.nl/BWBR0024956#Artikel23
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0018705
      - id: ref2
        bwb_id: BWBR0024956
        artikel: '23'
        hoofdstuk: '4'
  - number: '29.3'
    text: |-
      Na de inwerkingtreding van deze regeling berusten de volgende regelingen die genomen zijn krachtens
      [artikel 22, eerste en derde lid, van het Organisatie-, mandaat- en volmachtbesluit SZW 2004][ref1] op
      [artikel 23, eerste en derde lid][ref2], van deze regeling:


      [ref1]: https://wetten.overheid.nl/BWBR0016199#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0024956#Artikel23
    url: https://wetten.overheid.nl/BWBR0024956/2026-02-19#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0016199
        artikel: '22'
      - id: ref2
        bwb_id: BWBR0024956
        artikel: '23'
        hoofdstuk: '4'
  - number: 29.3.a
    text: de [Mandaatregeling Farbo](onbekend);
