        artikel: '4'
  - number: 1.1.d
    text: 'Onze Minister: Onze Minister voor Wonen en Rijksdienst.'
    url: https://wetten.overheid.nl/BWBR0019388/2018-06-13#Artikel1
  - number: '1.2'
    text: |-
      Op de huisvestingsvergunning, bedoeld in het eerste lid, onderdeel a, en de huisvestingsverordening, bedoeld in het
      eerste lid, onderdeel c, zijn de [artikelen 5][ref1], [6][ref2], [8][ref3], [9, eerste lid][ref4], [18][ref5],
      [19][ref6] en [32 tot en met 35 van de Huisvestingswet 2014 ][ref7]van overeenkomstige toepassing, met dien
      verstande dat in die artikelen voor «[artikel 7][ref8]» wordt gelezen: [artikel 8][ref9], [9][ref10] of [10][ref11]
      van de Wet bijzondere maatregelen grootstedelijke problematiek.


      [ref1]: https://wetten.overheid.nl/BWBR0035303#Artikel5
