  - number: '2'
    text: |-
      Dit hoofdstuk is van toepassing in kansenzones, die door de gemeenteraad zijn aangewezen overeenkomstig
      [artikel 3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019388#Artikel3
    url: https://wetten.overheid.nl/BWBR0019388/2018-06-13#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0019388
        artikel: '3'
        hoofdstuk: '2'
  - number: '3.1'
    text: |-
      Een gebied binnen een gemeente dat een bijzondere behoefte heeft aan omschakeling wegens lokale sociaal-economische
      problemen kan door de gemeenteraad als kansenzone worden aangewezen indien het voldoet aan de volgende eisen:
    url: https://wetten.overheid.nl/BWBR0019388/2018-06-13#Artikel3
  - number: 3.1.a
    text: binnen het gebied bedraagt
    url: https://wetten.overheid.nl/BWBR0019388/2018-06-13#Artikel3
  - number: 3.1.a.1°
    text: het aantal niet-actieven ten minste 25 percent, en
    url: https://wetten.overheid.nl/BWBR0019388/2018-06-13#Artikel3
  - number: 3.1.a.2°
    text: het aantal huishoudens met een laag inkomen ten minste 45 percent,
    url: https://wetten.overheid.nl/BWBR0019388/2018-06-13#Artikel3
  - number: 3.1.b
    text: het gebied heeft ten minste 5.000 en ten hoogste 30.000 inwoners.
    url: https://wetten.overheid.nl/BWBR0019388/2018-06-13#Artikel3
  - number: '3.2'
    text: |-
      Voor het vaststellen van de percentages, bedoeld in het eerste lid, wordt gebruik gemaakt van de meest recente
      cijfers zoals die zijn vastgesteld door het Centraal bureau voor de statistiek, op basis van de definities die dat
      bureau hanteert voor de in dat lid genoemde begrippen.
    url: https://wetten.overheid.nl/BWBR0019388/2018-06-13#Artikel3
  - number: '3.3'
    text: |-
      Het besluit waarin een kansenzone wordt aangewezen bevat een beschrijving van de kansenzone die ten minste de
      volgende elementen omvat:
    url: https://wetten.overheid.nl/BWBR0019388/2018-06-13#Artikel3
  - number: 3.3.a
    text: het gebied van de kansenzone, vergezeld van een kaart;
    url: https://wetten.overheid.nl/BWBR0019388/2018-06-13#Artikel3
  - number: 3.3.b
    text: |-
      een beschrijving van de sociaal-economische situatie in de kansenzone, inclusief een toets aan de eisen, bedoeld in
      het eerste lid, waarbij de herkomst van de gegevens zodanig is, dat zij controleerbaar zijn.
    url: https://wetten.overheid.nl/BWBR0019388/2018-06-13#Artikel3
  - number: '3.4'
    text: |-
      Een kansenzone kan slechts een maal als zodanig worden aangewezen. Deze aanwijzing geldt voor de duur van ten
      hoogste vier jaar. Deze termijn kan vier maal met telkens ten hoogste vier jaar worden verlengd. Het eerste tot en
      met derde lid zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0019388/2018-06-13#Artikel3
  - number: '4.1'
    text: |-
      In de verordening op de heffing en invordering van de onroerendezaakbelastingen, bedoeld in
      [artikel 220 van de Gemeentewet][ref1], kan worden bepaald dat de belastingaanslag ter zake van onroerende zaken,
      die niet in hoofdzaak tot woning dienen zoals bedoeld in [artikel 220a, tweede lid, van de Gemeentewet][ref2],
      waarvan de waarde zoals die op grond van de [Wet waardering onroerende zaken][ref3] is vastgesteld, niet hoger is
      dan € 500.000,– wordt verminderd.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel220
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel220a
      [ref3]: https://wetten.overheid.nl/BWBR0007119
    url: https://wetten.overheid.nl/BWBR0019388/2018-06-13#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '220'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: 220a
      - id: ref3
        bwb_id: BWBR0007119
  - number: '4.2'
    text: De vermindering wordt zodanig vastgesteld dat deze niet leidt tot een negatieve aanslag.
    url: https://wetten.overheid.nl/BWBR0019388/2018-06-13#Artikel4
  - number: '4.3'
    text: Het bedrag van de vermindering wordt op het aanslagbiljet vermeld.
    url: https://wetten.overheid.nl/BWBR0019388/2018-06-13#Artikel4
  - number: '4.4'
    text: |-
      Indien binnen het grondgebied van een gemeente meer dan een kansenzone is aangewezen wordt de vermindering van de
      belastingaanslag, bedoeld in het eerste lid, voor alle kansenzones op dezelfde wijze bepaald.
    url: https://wetten.overheid.nl/BWBR0019388/2018-06-13#Artikel4
  - number: '4.5'
    text: |-
      Het eerste tot met vierde lid zijn van overeenkomstige toepassing op de belastingen, bedoeld in
      [artikel 221 van de Gemeentewet][ref1], voor zover die worden geheven ter zake van bedrijfsruimten.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel221
    url: https://wetten.overheid.nl/BWBR0019388/2018-06-13#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '221'
  - number: '5.1'
    text: |-
      Onze Minister kan op aanvraag van de gemeenteraad complexen, straten of gebieden aanwijzen waarin aan
      woningzoekenden op grond van [artikel 8][ref1] eisen kunnen worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0019388#Artikel8
    url: https://wetten.overheid.nl/BWBR0019388/2018-06-13#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0019388
        artikel: '8'
        hoofdstuk: '3'
  - number: '5.2'
    text: |-
      Onze Minister kan op aanvraag van de gemeenteraad complexen, straten of gebieden aanwijzen waarin aan
      woningzoekenden op grond van [artikel 9][ref1] voorrang wordt verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0019388#Artikel9
    url: https://wetten.overheid.nl/BWBR0019388/2018-06-13#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0019388
        artikel: '9'
        hoofdstuk: '3'
  - number: '5.3'
    text: |-
      Ter beperking van overlast en criminaliteit kan Onze Minister op aanvraag van de gemeenteraad complexen, straten
      of gebieden aanwijzen, waar aan personen die op het tijdstip van de aanvraag van een huisvestingsvergunning de
      leeftijd van 16 jaar hebben bereikt, geen huisvestingsvergunning voor in de huisvestingsverordening aangewezen
      categorieën van woonruimte wordt verleend, indien:
    url: https://wetten.overheid.nl/BWBR0019388/2018-06-13#Artikel5
  - number: 5.3.a
    text: |-
      zij geen verklaring omtrent het gedrag als bedoeld in
      [artikel 28 van de Wet justitiële en strafvorderlijke gegevens][ref1] overleggen, of


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel28
    url: https://wetten.overheid.nl/BWBR0019388/2018-06-13#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: '28'
  - number: 5.3.b
    text: |-
      op grond van het onderzoek, bedoeld in [artikel 10a, eerste lid][ref1], blijkt dat er een gegrond vermoeden is dat
      hun huisvesting zal leiden tot een toename van overlast of criminaliteit in dat complex, die straat of dat gebied.


      [ref1]: https://wetten.overheid.nl/BWBR0019388#Artikel10a
    url: https://wetten.overheid.nl/BWBR0019388/2018-06-13#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0019388
        artikel: 10a
        hoofdstuk: '3'
  - number: '5.4'
    text: |-
      De aanwijzing, bedoeld in het eerste, tweede of derde lid, geschiedt voor de duur van ten hoogste vier jaar.
      Deze termijn kan op aanvraag van de gemeenteraad vier maal met telkens ten hoogste vier jaar worden verlengd.
      Het eerste, tweede of derde lid van dit artikel en de [artikelen 6][ref1] en [7][ref2] zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0019388#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0019388#Artikel7
    url: https://wetten.overheid.nl/BWBR0019388/2018-06-13#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0019388
        artikel: '6'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0019388
        artikel: '7'
        hoofdstuk: '3'
  - number: '5.5'
    text: |-
      Van een aanvraag tot verlenging, als bedoeld in het vierde lid, maakt in ieder geval deel uit een evaluatie van
      de maatregel die op grond van de aanwijzing, bedoeld in het eerste, tweede of derde lid, in een complex, straat of
      gebied is toegepast. Het college van burgemeester en wethouders houdt voor dit doel de noodzakelijke gegevens bij.
      Bij algemene maatregel van bestuur kunnen hieromtrent nadere voorschriften worden gegeven.
    url: https://wetten.overheid.nl/BWBR0019388/2018-06-13#Artikel5
  - number: '6.1'
    text: |-
      Bij de aanvraag, bedoeld in [artikel 5, eerste, tweede of derde lid][ref1], maakt de gemeenteraad naar het oordeel
      van Onze Minister voldoende aannemelijk dat de beoogde aanwijzing van de in de aanvraag genoemde complexen, straten
      of gebieden:


      [ref1]: https://wetten.overheid.nl/BWBR0019388#Artikel5
    url: https://wetten.overheid.nl/BWBR0019388/2018-06-13#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0019388
        artikel: '5'
        hoofdstuk: '3'
  - number: 6.1.a
    text: noodzakelijk en geschikt is voor het bestrijden van grootstedelijke problematiek in de gemeente, en
    url: https://wetten.overheid.nl/BWBR0019388/2018-06-13#Artikel6
  - number: 6.1.b
    text: voldoet aan de eisen van subsidiariteit en proportionaliteit.
    url: https://wetten.overheid.nl/BWBR0019388/2018-06-13#Artikel6
  - number: '6.2'
    text: |-
      De aanwijzing, bedoeld in [artikel 5, eerste of derde lid][ref1], geschiedt uitsluitend indien is voldaan aan
      het eerste lid, en de gemeenteraad naar het oordeel van Onze Minister voldoende aannemelijk heeft gemaakt dat
      woningzoekenden, aan wie als gevolg van die aanwijzing geen huisvestingsvergunning kan worden verleend voor het
      in gebruik nemen van woonruimte in de aangewezen complexen, straten of gebieden, voldoende mogelijkheden houden om
      binnen de regio waarin de gemeente is gelegen passende huisvesting te vinden.


      [ref1]: https://wetten.overheid.nl/BWBR0019388#Artikel5
    url: https://wetten.overheid.nl/BWBR0019388/2018-06-13#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0019388
        artikel: '5'
        hoofdstuk: '3'
  - number: '6.3'
    text: |-
      Bij de aanvraag bedoeld in [artikel 5, derde lid][ref1], maakt de gemeenteraad naar het oordeel van Onze Minister
      voldoende aannemelijk waarom de verklaring omtrent het gedrag, bedoeld in artikel 5, derde lid, onderdeel a, of
      het onderzoek op basis van politiegegevens, bedoeld in artikel 5, derde lid, onderdeel b, het meest geschikte
      instrument is voor het bestrijden van overlast en criminaliteit.


      [ref1]: https://wetten.overheid.nl/BWBR0019388#Artikel5
    url: https://wetten.overheid.nl/BWBR0019388/2018-06-13#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0019388
        artikel: '5'
        hoofdstuk: '3'
  - number: '6.4'
    text: Onze Minister kan gedeputeerde staten advies vragen over de mogelijkheden, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0019388/2018-06-13#Artikel6
  - number: '6.5'
    text: |-
      Onze Minister neemt binnen acht weken na ontvangst van de aanvraag tot aanwijzing van een complex, straat of
      gebied, bedoeld in [artikel 5, eerste, tweede of derde lid][ref1], een besluit omtrent die aanwijzing. Indien
      Onze Minister zijn besluit niet binnen de termijn, genoemd in de eerste volzin, aan de gemeenteraad bekend heeft
      gemaakt, wordt het besluit tot aanwijzing geacht te zijn genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0019388#Artikel5
    url: https://wetten.overheid.nl/BWBR0019388/2018-06-13#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0019388
        artikel: '5'
        hoofdstuk: '3'
  - number: '7.1'
    text: |-
      Onze Minister trekt de aanwijzing, bedoeld in [artikel 5][ref1], in indien hem is gebleken dat:


      [ref1]: https://wetten.overheid.nl/BWBR0019388#Artikel5
    url: https://wetten.overheid.nl/BWBR0019388/2018-06-13#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0019388
        artikel: '5'
        hoofdstuk: '3'
  - number: 7.1.a
    text: |-
      niet langer wordt voldaan aan de voorwaarden gesteld in [artikel 6, eerste lid][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0019388#Artikel6
    url: https://wetten.overheid.nl/BWBR0019388/2018-06-13#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0019388
        artikel: '6'
        hoofdstuk: '3'
  - number: 7.1.b
    text: |-
      de woningzoekenden, aan wie als gevolg van de aanwijzing, bedoeld in [artikel 5, eerste of derde lid][ref1], geen
      huisvestingsvergunning kan worden verleend voor het in gebruik nemen van woonruimte in de aangewezen complexen,
      straten of gebieden, onvoldoende mogelijkheden hebben om binnen de regio waarin de gemeente is gelegen voor hen
      passende huisvesting te vinden.


      [ref1]: https://wetten.overheid.nl/BWBR0019388#Artikel5
    url: https://wetten.overheid.nl/BWBR0019388/2018-06-13#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0019388
        artikel: '5'
        hoofdstuk: '3'
  - number: '7.2'
    text: |-
      Onze Minister trekt de aanwijzing, bedoeld in [artikel 5][ref1], voorts in indien de gemeenteraad daarom verzoekt.


      [ref1]: https://wetten.overheid.nl/BWBR0019388#Artikel5
    url: https://wetten.overheid.nl/BWBR0019388/2018-06-13#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0019388
        artikel: '5'
        hoofdstuk: '3'
  - number: '8.1'
    text: |-
      De gemeenteraad kan, indien dat naar zijn oordeel noodzakelijk en geschikt is voor het bestrijden van
      grootstedelijke problematiek in de gemeente en voldoet aan de eisen van subsidiariteit en proportionaliteit, in
      de huisvestingsverordening bepalen dat woningzoekenden die minder dan zes jaar voorafgaand aan de aanvraag van een
      huisvestingsvergunning onafgebroken ingezetene zijn van de regio waarin de gemeente is gelegen, slechts voor een
      huisvestingsvergunning voor het in gebruik nemen van in die verordening aangewezen categorieën van woonruimte in
      aanmerking komen indien zij beschikken over:
    url: https://wetten.overheid.nl/BWBR0019388/2018-06-13#Artikel8
  - number: 8.1.a
    text: een inkomen op grond van het in dienstbetrekking verrichten van arbeid;
    url: https://wetten.overheid.nl/BWBR0019388/2018-06-13#Artikel8
  - number: 8.1.b
    text: een inkomen uit zelfstandig beroep of bedrijf;
    url: https://wetten.overheid.nl/BWBR0019388/2018-06-13#Artikel8
  - number: 8.1.c
    text: een inkomen op grond van een regeling voor vrijwillig vervroegd uittreden;
    url: https://wetten.overheid.nl/BWBR0019388/2018-06-13#Artikel8
  - number: 8.1.d
    text: |-
      een ouderdomspensioen als bedoeld in de [Algemene Ouderdomswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002221
    url: https://wetten.overheid.nl/BWBR0019388/2018-06-13#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002221
  - number: 8.1.e
    text: |-
      een ouderdoms- of nabestaandenpensioen als bedoeld in de [Wet op de loonbelasting 1964][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0002471
    url: https://wetten.overheid.nl/BWBR0019388/2018-06-13#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002471
  - number: 8.1.f
    text: |-
      een aanspraak op studiefinanciering als bedoeld in de [Wet studiefinanciering 2000][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011453
    url: https://wetten.overheid.nl/BWBR0019388/2018-06-13#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0011453
  - number: '8.2'
    text: |-
      De gemeenteraad bepaalt in de huisvestingsverordening dat burgemeester en wethouders aan een woningzoekende die
      niet voldoet aan de eisen, genoemd in het eerste lid, een huisvestingsvergunning voor het in gebruik nemen van
      woonruimte als bedoeld in dat lid kunnen verlenen, indien het weigeren van die huisvestingsvergunning tot een
      onbillijkheid van overwegende aard zou leiden.
    url: https://wetten.overheid.nl/BWBR0019388/2018-06-13#Artikel8
  - number: '9.1'
    text: |-
      De gemeenteraad kan, indien dat naar zijn oordeel noodzakelijk en geschikt is voor het bestrijden van
      grootstedelijke problematiek in de gemeente en voldoet aan de eisen van subsidiariteit en proportionaliteit, in
      de huisvestingsverordening bepalen dat voor daarbij aan te wijzen categorieën van woonruimte bij het verlenen van
      huisvestingsvergunningen voorrang wordt gegeven aan woningzoekenden die voldoen aan in die verordening vastgelegde
      sociaal-economische kenmerken.
    url: https://wetten.overheid.nl/BWBR0019388/2018-06-13#Artikel9
  - number: '9.2'
    text: |-
      De gemeenteraad bepaalt in de huisvestingsverordening of aan woningzoekenden als bedoeld in het eerste
      lid voorrang wordt gegeven boven woningzoekenden als bedoeld in [artikel 12, eerste lid][ref1], of
      [artikel 14, van de Huisvestingswet 2014][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0035303#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0035303#Artikel14
    url: https://wetten.overheid.nl/BWBR0019388/2018-06-13#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0035303
        artikel: '12'
      - id: ref2
        bwb_id: BWBR0035303
        artikel: '14'
  - number: '10.1'
    text: |-
      De gemeenteraad kan in de huisvestingsverordening bepalen dat een huisvestingsvergunning voor in die verordening
      aangewezen categorieën van woonruimte in de op basis van [artikel 5, derde lid][ref1], aangewezen complexen,
      straten of gebieden, niet wordt verleend indien op basis van het in die aanwijzing genoemde instrument, bedoeld
      in artikel 5, derde lid, blijkt dat er een gegrond vermoeden is dat het huisvesten van de personen van 16 jaar en
      ouder die zich in een woonruimte in dat complex, die straat of dat gebied willen huisvesten, zal leiden tot een
      toename van overlast of criminaliteit in dat complex, die straat of dat gebied.


      [ref1]: https://wetten.overheid.nl/BWBR0019388#Artikel5
    url: https://wetten.overheid.nl/BWBR0019388/2018-06-13#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0019388
        artikel: '5'
        hoofdstuk: '3'
  - number: '10.2'
    text: |-
      De gemeenteraad kan in de huisvestingsverordening bepalen dat een persoon van 16 jaar en ouder die zich op een
      later tijdstip bij de houder van een huisvestingsvergunning als bedoeld in het eerste lid, wil huisvesten over een
      huisvestingsvergunning dient te beschikken. Zulk een huisvestingsvergunning wordt niet verleend indien op basis
      van het in die aanwijzing genoemde instrument, bedoeld in [artikel 5, derde lid][ref1], blijkt dat er een gegrond
      vermoeden is dat het huisvesten van die persoon zal leiden tot een toename van overlast of criminaliteit in het
      complex, de straat of het gebied waarin de woonruimte is gelegen.


      [ref1]: https://wetten.overheid.nl/BWBR0019388#Artikel5
    url: https://wetten.overheid.nl/BWBR0019388/2018-06-13#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0019388
        artikel: '5'
        hoofdstuk: '3'
  - number: '10.3'
    text: |-
      De gemeenteraad past de bevoegdheid, bedoeld in het eerste en tweede lid, toe indien dat naar zijn oordeel
      noodzakelijk en geschikt is voor het bestrijden van grootstedelijke problematiek in de gemeente en voldoet aan de
      eisen van subsidiariteit en proportionaliteit.
    url: https://wetten.overheid.nl/BWBR0019388/2018-06-13#Artikel10
  - number: '10.4'
    text: |-
      De gemeenteraad kan in de huisvestingsverordening bepalen dat een last onder bestuursdwang of een
      bestuurlijke boete kan worden opgelegd ter zake van de overtreding van de voorschriften, bedoeld in
      [artikel 10b, vijfde lid][ref1]. De bestuurlijke boete bedraagt ten hoogste het bedrag dat is vastgesteld voor de
      eerste categorie, bedoeld in [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0019388#Artikel10b
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel23
    url: https://wetten.overheid.nl/BWBR0019388/2018-06-13#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0019388
        artikel: 10b
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '23'
  - number: '10.5'
    text: |-
      Het college van burgemeester en wethouders kan aan een woningzoekende aan wie onder toepassing van het eerste of
      tweede lid geen huisvestingsvergunning zou kunnen worden verleend, alsnog een huisvestingsvergunning voor het in
      gebruik nemen van woonruimte als bedoeld in die leden verlenen, indien het weigeren ervan tot een onbillijkheid van
      overwegende aard zou leiden.
    url: https://wetten.overheid.nl/BWBR0019388/2018-06-13#Artikel10
  - number: 10a.1
    text: |-
      Indien op basis van de aanwijzing, bedoeld in [artikel 5, derde lid][ref1], in een aangewezen complex,
      straat of gebied een onderzoek op basis van politiegegevens wordt verlangd, bepaalt de gemeenteraad in de
      huisvestingsverordening op basis van de aard van de problematiek in een aangewezen complex, straat of gebied welke
      van de in het tweede lid genoemde politiegegevens betrokken mogen worden bij dat onderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0019388#Artikel5
    url: https://wetten.overheid.nl/BWBR0019388/2018-06-13#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0019388
        artikel: '5'
        hoofdstuk: '3'
  - number: 10a.2
    text: |-
      Bij een onderzoek als bedoeld in het eerste lid kan uitsluitend rekening worden gehouden met de volgende
      gedragingen uit de politiegegevens:
    url: https://wetten.overheid.nl/BWBR0019388/2018-06-13#Artikel10a
  - number: 10a.2.a
    text: |-
      het veroorzaken van overlast die hinderlijk of schadelijk is voor personen of een gevaar oplevert voor de
      veiligheid of gezondheid van personen door:
    url: https://wetten.overheid.nl/BWBR0019388/2018-06-13#Artikel10a
  - number: 10a.2.a.1°
    text: geluid of trillingen;
    url: https://wetten.overheid.nl/BWBR0019388/2018-06-13#Artikel10a
  - number: 10a.2.a.2°
    text: het plaatsen, werpen of hebben van stoffen of voorwerpen;
    url: https://wetten.overheid.nl/BWBR0019388/2018-06-13#Artikel10a
  - number: 10a.2.a.3°
    text: |-
      het verrichten van handelingen waardoor op voor de omgeving hinderlijke of schadelijke wijze rook, roet, walm,
      stof, stank of irriterend materiaal wordt verspreid;
    url: https://wetten.overheid.nl/BWBR0019388/2018-06-13#Artikel10a
  - number: 10a.2.a.4°
    text: vervuiling, verontreiniging of schadelijk of hinderlijk gedierte in de woning of de directe omgeving ervan;
    url: https://wetten.overheid.nl/BWBR0019388/2018-06-13#Artikel10a
  - number: 10a.2.b
    text: onrechtmatig gebruik van een woning;
    url: https://wetten.overheid.nl/BWBR0019388/2018-06-13#Artikel10a
  - number: 10a.2.c
    text: gebruik van beledigende of discriminerende taal of uitingen jegens of intimidatie van omwonenden of bezoekers;
    url: https://wetten.overheid.nl/BWBR0019388/2018-06-13#Artikel10a
  - number: 10a.2.d
    text: gewelddadigheden of openlijke geweldpleging tegen, dan wel bedreiging of mishandeling van omwonenden of bezoekers;
    url: https://wetten.overheid.nl/BWBR0019388/2018-06-13#Artikel10a
  - number: 10a.2.e
    text: |-
      activiteiten die strafbaar zijn gesteld op grond van de [Opiumwet][ref1] in of in de omgeving van de woning;


      [ref1]: https://wetten.overheid.nl/BWBR0001941
    url: https://wetten.overheid.nl/BWBR0019388/2018-06-13#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0001941
  - number: 10a.2.f
    text: openbare dronkenschap in de omgeving van de woning;
    url: https://wetten.overheid.nl/BWBR0019388/2018-06-13#Artikel10a
  - number: 10a.2.g
    text: het plegen van vermogensdelicten met een directe relatie tot de woonomgeving;
    url: https://wetten.overheid.nl/BWBR0019388/2018-06-13#Artikel10a
  - number: 10a.2.h
    text: brandstichting, vernieling en vandalisme in de omgeving van de woning;
    url: https://wetten.overheid.nl/BWBR0019388/2018-06-13#Artikel10a
  - number: 10a.2.i
    text: |-
      radicaliserende, extremistische of terroristische gedragingen die strafbaar zijn gesteld op grond van het
      [Wetboek van Strafrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001854
    url: https://wetten.overheid.nl/BWBR0019388/2018-06-13#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0001854
  - number: 10b.1
    text: |-
      Indien bij de aanvraag van een huisvestingsvergunning, voor een in de huisvestingsverordening aangewezen woonruimte
      in een complex, straat of gebied, op grond van [artikel 5, derde lid, onderdeel b][ref1], een onderzoek op basis
      van politiegegevens wordt verlangd, stelt het college van burgemeester en wethouders de burgemeester hiervan in
      kennis. De burgemeester verzoekt daarop de politiechef van de regionale eenheid waarin de gemeente gelegen is,
      zo spoedig mogelijk een overzicht van de politiegegevens te verstrekken die betrekking hebben op de op grond van
      [artikel 10a, eerste lid][ref2], in de huisvestingsverordening genoemde gedragingen van de woningzoekende, alsmede
      van de personen van 16 jaar en ouder die met hem de woonruimte willen betrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0019388#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0019388#Artikel10a
    url: https://wetten.overheid.nl/BWBR0019388/2018-06-13#Artikel10b
    references:
      - id: ref1
        bwb_id: BWBR0019388
        artikel: '5'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0019388
        artikel: 10a
        hoofdstuk: '3'
  - number: 10b.2
    text: |-
      De politiechef, verstrekt aan de burgemeester uitsluitend de in [artikel 10a, eerste lid][ref1], bedoelde relevante
      politiegegevens over gedragingen die hebben plaatsgevonden in de periode van ten hoogste vier jaren voor het
      tijdstip van de aanvraag van de huisvestingsvergunning. Deze periode bedraagt ten hoogste twee jaren indien
      de betrokkene op het tijdstip van die aanvraag nog niet de leeftijd van 18 jaar heeft bereikt. De politiechef
      verstrekt de politiegegevens niet indien het verstrekken ervan een nog niet afgerond strafrechtelijk onderzoek
      kan belemmeren.


      [ref1]: https://wetten.overheid.nl/BWBR0019388#Artikel10a
    url: https://wetten.overheid.nl/BWBR0019388/2018-06-13#Artikel10b
    references:
      - id: ref1
        bwb_id: BWBR0019388
        artikel: 10a
        hoofdstuk: '3'
  - number: 10b.3
    text: De politiechef voorziet de te verstrekken politiegegevens van een duiding.
    url: https://wetten.overheid.nl/BWBR0019388/2018-06-13#Artikel10b
  - number: 10b.4
    text: |-
      De burgemeester beoordeelt op basis van de volgende criteria de verstrekte politiegegevens en de duiding ervan door
      de politiechef:
    url: https://wetten.overheid.nl/BWBR0019388/2018-06-13#Artikel10b
  - number: 10b.4.a
    text: |-
      de aard en ernst van de gedragingen, waarbij zwaarder gewicht wordt toegekend aan gedragingen die bij wet strafbaar
      gesteld zijn dan aan andere gedragingen;
    url: https://wetten.overheid.nl/BWBR0019388/2018-06-13#Artikel10b
  - number: 10b.4.b
    text: de frequentie en onderlinge samenhang van de gedragingen;
    url: https://wetten.overheid.nl/BWBR0019388/2018-06-13#Artikel10b
  - number: 10b.4.c
    text: de overlast die de gedragingen hebben veroorzaakt;
    url: https://wetten.overheid.nl/BWBR0019388/2018-06-13#Artikel10b
  - number: 10b.4.d
    text: het tijdsverloop sinds de gedragingen zijn geconstateerd;
    url: https://wetten.overheid.nl/BWBR0019388/2018-06-13#Artikel10b
  - number: 10b.4.e
    text: |-
      de relatie tussen de geconstateerde overlastgevende gedragingen en de mogelijke invloed van deze gedragingen op de
      leefbaarheid in een aangewezen complex, straat of gebied.
    url: https://wetten.overheid.nl/BWBR0019388/2018-06-13#Artikel10b
  - number: 10b.5
    text: |-
      Behoudens in gevallen als bedoeld in [artikel 10, vijfde lid][ref1], weigert het college van burgemeester en
      wethouders een huisvestingsvergunning, indien de overgelegde woonverklaring daartoe aanleiding geeft. Indien aan de
      woonverklaring voorschriften zijn verbonden, worden deze voorschriften opgenomen in de huisvestingsvergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0019388#Artikel10
    url: https://wetten.overheid.nl/BWBR0019388/2018-06-13#Artikel10b
    references:
      - id: ref1
        bwb_id: BWBR0019388
        artikel: '10'
        hoofdstuk: '3'
  - number: 10b.6
    text: |-
      Indien de burgemeester voornemens is een negatieve woonverklaring af te geven op grond van de beoordeling,
      bedoeld in het vierde lid, of aan de woonverklaring voorschriften te verbinden, stelt hij de aanvrager van de
      huisvestingsvergunning in de gelegenheid te worden gehoord.
    url: https://wetten.overheid.nl/BWBR0019388/2018-06-13#Artikel10b
  - number: 10b.7
    text: |-
      De burgemeester verwerkt de aan hem op basis van het tweede lid verstrekte politiegegevens en de duiding, bedoeld
      in het derde lid, uitsluitend ten behoeve van de beoordeling van de aanvraag van een huisvestingsvergunning,
      bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0019388/2018-06-13#Artikel10b
  - number: 10b.8
    text: |-
      De burgemeester kan van de bevoegdheden in dit artikel uitsluitend mandaat verlenen aan de bij algemene maatregel
      van bestuur te bepalen personen die onder zijn verantwoordelijkheid werkzaam zijn.
    url: https://wetten.overheid.nl/BWBR0019388/2018-06-13#Artikel10b
  - number: 10b.9
    text: 'Bij algemene maatregel van bestuur worden nadere regels gesteld over:'
    url: https://wetten.overheid.nl/BWBR0019388/2018-06-13#Artikel10b
  - number: 10b.9.a
    text: |-
      het onderzoek, bedoeld in [artikel 10a, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0019388#Artikel10a
    url: https://wetten.overheid.nl/BWBR0019388/2018-06-13#Artikel10b
    references:
      - id: ref1
        bwb_id: BWBR0019388
        artikel: 10a
        hoofdstuk: '3'
  - number: 10b.9.b
    text: |-
      de evaluatie ten behoeve van het verslag, bedoeld in [artikel 17][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0019388#Artikel17
    url: https://wetten.overheid.nl/BWBR0019388/2018-06-13#Artikel10b
    references:
      - id: ref1
        bwb_id: BWBR0019388
        artikel: '17'
        hoofdstuk: '5'
  - number: 10b.9.c
    text: |-
      de verwerking van de persoonsgegevens ten behoeve van het onderzoek bedoeld in onderdeel a, en de evaluatie,
      bedoeld in onderdeel b. Deze nadere regels hebben in ieder geval betrekking op de vastlegging, de beveiliging, de
      bewaartermijn en de vernietiging van de persoonsgegevens.
    url: https://wetten.overheid.nl/BWBR0019388/2018-06-13#Artikel10b
  - number: 10c
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat het college van burgemeester en wethouders beslist op
      een aanvraag voor een vergunning als bedoeld in dit hoofdstuk binnen een bij die algemene maatregel van bestuur te
      stellen termijn.
    url: https://wetten.overheid.nl/BWBR0019388/2018-06-13#Artikel10c
  - number: '17'
    text: |-
      Onze Minister zendt iedere vijf jaar na de inwerkingtreding van deze wet aan de Staten-Generaal een verslag over de
      doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0019388/2018-06-13#Artikel17
  - number: '18'
    text: |-
      Deze wet treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin zij wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0019388/2018-06-13#Artikel18
  - number: '19'
    text: 'Deze wet wordt aangehaald als: Wet bijzondere maatregelen grootstedelijke problematiek.'
    url: https://wetten.overheid.nl/BWBR0019388/2018-06-13#Artikel19
