preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is om in daartoe aan te wijzen gebieden binnen gemeenten
    de wettelijke mogelijkheden te verruimen om grootstedelijke problemen aan te pakken;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0019388/2018-06-13#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0019388/2018-06-13#Artikel1
  - number: 1.1.a
    text: |-
      huisvestingsvergunning: vergunning als bedoeld in [artikel 8 van de Huisvestingswet 2014][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0035303#Artikel8
    url: https://wetten.overheid.nl/BWBR0019388/2018-06-13#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0035303
        artikel: '8'
  - number: 1.1.b
    text: |-
      regio: gebied dat uit een oogpunt van het functioneren van de woonruimtemarkt als een samenhangend geheel kan
      worden beschouwd;
    url: https://wetten.overheid.nl/BWBR0019388/2018-06-13#Artikel1
  - number: 1.1.c
    text: |-
      huisvestingsverordening: verordening als bedoeld in [artikel 4 van de Huisvestingswet 2014][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0035303#Artikel4
    url: https://wetten.overheid.nl/BWBR0019388/2018-06-13#Artikel1
    references:
      - id: ref1
