---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht-mvp/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_bijzondere_maatregelen_grootstedelijke_problematiek
regulatory_layer: WET
publication_date: '2024-12-10'
valid_from: '2015-01-01'
bwb_id: BWBR0019388
url: https://wetten.overheid.nl/BWBR0019388/2015-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is om in daartoe aan te wijzen gebieden binnen gemeenten
    de wettelijke mogelijkheden te verruimen om grootstedelijke problemen aan te pakken;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0019388/2015-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0019388/2015-01-01#Artikel1
  - number: 1.a
    text: 'huisvestingsvergunning: vergunning als bedoeld in [artikel 8 van de Huisvestingswet 2014](onbekend);'
    url: https://wetten.overheid.nl/BWBR0019388/2015-01-01#Artikel1
  - number: 1.b
    text: |-
      regio: gebied dat uit een oogpunt van het functioneren van de woonruimtemarkt als een samenhangend geheel kan
      worden beschouwd;
    url: https://wetten.overheid.nl/BWBR0019388/2015-01-01#Artikel1
  - number: 1.c
    text: 'huisvestingsverordening: verordening als bedoeld in [artikel 4 van de Huisvestingswet 2014](onbekend);'
    url: https://wetten.overheid.nl/BWBR0019388/2015-01-01#Artikel1
  - number: 1.d
    text: 'Onze Minister: Onze Minister voor Wonen en Rijksdienst;'
    url: https://wetten.overheid.nl/BWBR0019388/2015-01-01#Artikel1
  - number: 1.e
    text: |-
      persoonsgegeven: persoonsgegeven als bedoeld in
      [artikel 1, onderdeel a, van de Wet bescherming persoonsgegevens][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel1
    url: https://wetten.overheid.nl/BWBR0019388/2015-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '1'
  - number: '2'
    text: |-
      Dit hoofdstuk is van toepassing in kansenzones, die door de gemeenteraad zijn aangewezen overeenkomstig
      [artikel 3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019388#Artikel3
    url: https://wetten.overheid.nl/BWBR0019388/2015-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0019388
        artikel: '3'
        hoofdstuk: '2'
  - number: '3.1'
    text: |-
      Een gebied binnen een gemeente dat een bijzondere behoefte heeft aan omschakeling wegens lokale sociaal-economische
      problemen kan door de gemeenteraad als kansenzone worden aangewezen indien het voldoet aan de volgende eisen:
    url: https://wetten.overheid.nl/BWBR0019388/2015-01-01#Artikel3
  - number: 3.1.a
    text: binnen het gebied bedraagt
    url: https://wetten.overheid.nl/BWBR0019388/2015-01-01#Artikel3
  - number: 3.1.a.1°
    text: het aantal niet-actieven ten minste 25 percent, en
    url: https://wetten.overheid.nl/BWBR0019388/2015-01-01#Artikel3
  - number: 3.1.a.2°
    text: het aantal huishoudens met een laag inkomen ten minste 45 percent,
    url: https://wetten.overheid.nl/BWBR0019388/2015-01-01#Artikel3
  - number: 3.1.b
    text: het gebied heeft ten minste 5.000 en ten hoogste 30.000 inwoners.
    url: https://wetten.overheid.nl/BWBR0019388/2015-01-01#Artikel3
  - number: '3.2'
    text: |-
      Voor het vaststellen van de percentages, bedoeld in het eerste lid, wordt gebruik gemaakt van de meest recente
      cijfers zoals die zijn vastgesteld door het Centraal bureau voor de statistiek, op basis van de definities die dat
      bureau hanteert voor de in dat lid genoemde begrippen.
    url: https://wetten.overheid.nl/BWBR0019388/2015-01-01#Artikel3
  - number: '3.3'
    text: |-
      Het besluit waarin een kansenzone wordt aangewezen bevat een beschrijving van de kansenzone die ten minste de
      volgende elementen omvat:
    url: https://wetten.overheid.nl/BWBR0019388/2015-01-01#Artikel3
  - number: 3.3.a
    text: het gebied van de kansenzone, vergezeld van een kaart;
    url: https://wetten.overheid.nl/BWBR0019388/2015-01-01#Artikel3
  - number: 3.3.b
    text: |-
      een beschrijving van de sociaal-economische situatie in de kansenzone, inclusief een toets aan de eisen, bedoeld in
      het eerste lid, waarbij de herkomst van de gegevens zodanig is, dat zij controleerbaar zijn.
    url: https://wetten.overheid.nl/BWBR0019388/2015-01-01#Artikel3
  - number: '3.4'
    text: |-
      Een kansenzone kan slechts een maal als zodanig worden aangewezen. Deze aanwijzing geldt voor de duur van ten
      hoogste vier jaar. Deze termijn kan vier maal met telkens ten hoogste vier jaar worden verlengd. Het eerste tot en
      met derde lid zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0019388/2015-01-01#Artikel3
  - number: '4.1'
    text: |-
      In de verordening op de heffing en invordering van de onroerendezaakbelastingen, bedoeld in
      [artikel 220 van de Gemeentewet][ref1], kan worden bepaald dat de belastingaanslag ter zake van onroerende zaken,
      die niet in hoofdzaak tot woning dienen zoals bedoeld in [artikel 220a, tweede lid, van de Gemeentewet][ref2],
      waarvan de waarde zoals die op grond van de [Wet waardering onroerende zaken][ref3] is vastgesteld, niet hoger is
      dan € 500.000,– wordt verminderd.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel220
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel220a
      [ref3]: https://wetten.overheid.nl/BWBR0007119
    url: https://wetten.overheid.nl/BWBR0019388/2015-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '220'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: 220a
      - id: ref3
        bwb_id: BWBR0007119
  - number: '4.2'
    text: De vermindering wordt zodanig vastgesteld dat deze niet leidt tot een negatieve aanslag.
    url: https://wetten.overheid.nl/BWBR0019388/2015-01-01#Artikel4
  - number: '4.3'
    text: Het bedrag van de vermindering wordt op het aanslagbiljet vermeld.
    url: https://wetten.overheid.nl/BWBR0019388/2015-01-01#Artikel4
  - number: '4.4'
    text: |-
      Indien binnen het grondgebied van een gemeente meer dan een kansenzone is aangewezen wordt de vermindering van de
      belastingaanslag, bedoeld in het eerste lid, voor alle kansenzones op dezelfde wijze bepaald.
    url: https://wetten.overheid.nl/BWBR0019388/2015-01-01#Artikel4
  - number: '4.5'
    text: |-
      Het eerste tot met vierde lid zijn van overeenkomstige toepassing op de belastingen, bedoeld in
      [artikel 221 van de Gemeentewet][ref1], voor zover die worden geheven ter zake van bedrijfsruimten.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel221
    url: https://wetten.overheid.nl/BWBR0019388/2015-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '221'
  - number: '5.1'
    text: |-
      Onze Minister kan op aanvraag van de gemeenteraad gebieden aanwijzen waarin aan woningzoekenden op grond van de
      [artikelen 8][ref1] en [9][ref2] eisen kunnen worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0019388#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0019388#Artikel9
    url: https://wetten.overheid.nl/BWBR0019388/2015-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0019388
        artikel: '8'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0019388
        artikel: '9'
        hoofdstuk: '3'
  - number: '5.2'
    text: |-
      De aanwijzing, bedoeld in het eerste lid, geschiedt voor de duur van ten hoogste vier jaar. Deze termijn kan op
      aanvraag van de gemeenteraad vier maal met telkens ten hoogste vier jaar worden verlengd. Het eerste lid van dit
      artikel en de [artikelen 6][ref1] en [7][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0019388#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0019388#Artikel7
    url: https://wetten.overheid.nl/BWBR0019388/2015-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0019388
        artikel: '6'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0019388
        artikel: '7'
        hoofdstuk: '3'
  - number: '6.1'
    text: |-
      Bij de aanvraag, bedoeld in [artikel 5, eerste lid][ref1], maakt de gemeenteraad naar het oordeel van Onze Minister
      voldoende aannemelijk dat de beoogde aanwijzing van de in de aanvraag genoemde gebieden:


      [ref1]: https://wetten.overheid.nl/BWBR0019388#Artikel5
    url: https://wetten.overheid.nl/BWBR0019388/2015-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0019388
        artikel: '5'
        hoofdstuk: '3'
  - number: 6.1.a
    text: noodzakelijk en geschikt is voor het bestrijden van grootstedelijke problematiek in de gemeente, en
    url: https://wetten.overheid.nl/BWBR0019388/2015-01-01#Artikel6
  - number: 6.1.b
    text: voldoet aan de eisen van subsidiariteit en proportionaliteit.
    url: https://wetten.overheid.nl/BWBR0019388/2015-01-01#Artikel6
  - number: '6.2'
    text: |-
      De aanwijzing, bedoeld in [artikel 5][ref1], geschiedt uitsluitend indien is voldaan aan het eerste lid, en de
      gemeenteraad naar het oordeel van Onze Minister voldoende aannemelijk heeft gemaakt dat woningzoekenden, aan
      wie als gevolg van die aanwijzing geen huisvestingsvergunning kan worden verleend voor het in gebruik nemen van
      woonruimte in de aangewezen gebieden, voldoende mogelijkheden houden om binnen de regio waarin de gemeente is
      gelegen passende huisvesting te vinden.


      [ref1]: https://wetten.overheid.nl/BWBR0019388#Artikel5
    url: https://wetten.overheid.nl/BWBR0019388/2015-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0019388
        artikel: '5'
        hoofdstuk: '3'
  - number: '6.3'
    text: Onze Minister kan gedeputeerde staten advies vragen over de mogelijkheden, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0019388/2015-01-01#Artikel6
  - number: '6.4'
    text: |-
      Onze Minister neemt binnen dertien weken na verzending door de gemeenteraad van de aanvraag tot aanwijzing van een
      gebied, bedoeld in [artikel 5, eerste lid][ref1], een besluit omtrent die aanwijzing. Indien Onze Minister zijn
      besluit niet binnen de termijn, genoemd in de eerste volzin, aan de gemeenteraad bekend heeft gemaakt, wordt het
      besluit tot aanwijzing geacht te zijn genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0019388#Artikel5
    url: https://wetten.overheid.nl/BWBR0019388/2015-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0019388
        artikel: '5'
        hoofdstuk: '3'
  - number: '7.1'
    text: |-
      Onze Minister trekt de aanwijzing, bedoeld in [artikel 5][ref1], in indien hem is gebleken dat:


      [ref1]: https://wetten.overheid.nl/BWBR0019388#Artikel5
    url: https://wetten.overheid.nl/BWBR0019388/2015-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0019388
        artikel: '5'
        hoofdstuk: '3'
  - number: 7.1.a
    text: |-
      niet langer wordt voldaan aan de voorwaarden gesteld in [artikel 6, eerste lid][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0019388#Artikel6
    url: https://wetten.overheid.nl/BWBR0019388/2015-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0019388
        artikel: '6'
        hoofdstuk: '3'
  - number: 7.1.b
    text: |-
      de woningzoekenden, aan wie als gevolg van de aanwijzing, bedoeld in [artikel 5][ref1], geen huisvestingsvergunning
      kan worden verleend voor het in gebruik nemen van woonruimte in de aangewezen gebieden, onvoldoende mogelijkheden
      hebben om binnen de regio waarin de gemeente is gelegen voor hen passende huisvesting te vinden.


      [ref1]: https://wetten.overheid.nl/BWBR0019388#Artikel5
    url: https://wetten.overheid.nl/BWBR0019388/2015-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0019388
        artikel: '5'
        hoofdstuk: '3'
  - number: '7.2'
    text: |-
      Onze Minister trekt de aanwijzing, bedoeld in [artikel 5][ref1], voorts in indien de gemeenteraad daarom verzoekt.


      [ref1]: https://wetten.overheid.nl/BWBR0019388#Artikel5
    url: https://wetten.overheid.nl/BWBR0019388/2015-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0019388
        artikel: '5'
        hoofdstuk: '3'
  - number: '8.1'
    text: |-
      De gemeenteraad kan, indien dat naar zijn oordeel noodzakelijk en geschikt is voor het bestrijden van
      grootstedelijke problematiek in de gemeente en voldoet aan de eisen van subsidiariteit en proportionaliteit, in
      de huisvestingsverordening bepalen dat woningzoekenden die minder dan zes jaar voorafgaand aan de aanvraag van een
      huisvestingsvergunning onafgebroken ingezetene zijn van de regio waarin de gemeente is gelegen, slechts voor een
      huisvestingsvergunning voor het in gebruik nemen van in die verordening aangewezen categorieën van woonruimte in
      aanmerking komen indien zij beschikken over:
    url: https://wetten.overheid.nl/BWBR0019388/2015-01-01#Artikel8
  - number: 8.1.a
    text: een inkomen op grond van het in dienstbetrekking verrichten van arbeid;
    url: https://wetten.overheid.nl/BWBR0019388/2015-01-01#Artikel8
  - number: 8.1.b
    text: een inkomen uit zelfstandig beroep of bedrijf;
    url: https://wetten.overheid.nl/BWBR0019388/2015-01-01#Artikel8
  - number: 8.1.c
    text: een inkomen op grond van een regeling voor vrijwillig vervroegd uittreden;
    url: https://wetten.overheid.nl/BWBR0019388/2015-01-01#Artikel8
  - number: 8.1.d
    text: |-
      een ouderdomspensioen als bedoeld in de [Algemene Ouderdomswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002221
    url: https://wetten.overheid.nl/BWBR0019388/2015-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002221
  - number: 8.1.e
    text: |-
      een ouderdoms- of nabestaandenpensioen als bedoeld in de [Wet op de loonbelasting 1964][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0002471
    url: https://wetten.overheid.nl/BWBR0019388/2015-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002471
  - number: 8.1.f
    text: |-
      studiefinanciering als bedoeld in de [Wet studiefinanciering 2000][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011453
    url: https://wetten.overheid.nl/BWBR0019388/2015-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0011453
  - number: '8.2'
    text: |-
      De gemeenteraad bepaalt in de huisvestingsverordening dat burgemeester en wethouders aan een woningzoekende die
      niet voldoet aan de eisen, genoemd in het eerste lid, een huisvestingsvergunning voor het in gebruik nemen van
      woonruimte als bedoeld in dat lid kunnen verlenen, indien het weigeren van die huisvestingsvergunning tot een
      onbillijkheid van overwegende aard zou leiden.
    url: https://wetten.overheid.nl/BWBR0019388/2015-01-01#Artikel8
  - number: '8.3'
    text: De [artikelen 8](onbekend) en [35 van de Huisvestingswet 2014](onbekend) zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0019388/2015-01-01#Artikel8
  - number: '8.4'
    text: De [artikelen 14](onbekend) en [15 van de Huisvestingswet 2014](onbekend) zijn niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0019388/2015-01-01#Artikel8
  - number: '9.1'
    text: |-
      De gemeenteraad kan, indien dat naar zijn oordeel noodzakelijk en geschikt is voor het bestrijden van
      grootstedelijke problematiek in de gemeente en voldoet aan de eisen van subsidiariteit en proportionaliteit, in
      de huisvestingsverordening bepalen dat voor daarbij aan te wijzen categorieën van woonruimte bij het verlenen van
      huisvestingsvergunningen voorrang wordt gegeven aan woningzoekenden die voldoen aan in die verordening vastgelegde
      sociaal-economische kenmerken.
    url: https://wetten.overheid.nl/BWBR0019388/2015-01-01#Artikel9
  - number: '9.2'
    text: |-
      De gemeenteraad bepaalt in de huisvestingsverordening of aan woningzoekenden als bedoeld in het eerste lid voorrang
      wordt gegeven boven woningzoekenden als bedoeld in [artikel 12, eerste lid, van de Huisvestingswet 2014](onbekend).
    url: https://wetten.overheid.nl/BWBR0019388/2015-01-01#Artikel9
  - number: '17'
    text: |-
      Onze Minister zendt iedere vijf jaar na de inwerkingtreding van deze wet aan de Staten-Generaal een verslag over de
      doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0019388/2015-01-01#Artikel17
  - number: '18'
    text: |-
      Deze wet treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin zij wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0019388/2015-01-01#Artikel18
  - number: '19'
    text: 'Deze wet wordt aangehaald als: Wet bijzondere maatregelen grootstedelijke problematiek.'
    url: https://wetten.overheid.nl/BWBR0019388/2015-01-01#Artikel19
