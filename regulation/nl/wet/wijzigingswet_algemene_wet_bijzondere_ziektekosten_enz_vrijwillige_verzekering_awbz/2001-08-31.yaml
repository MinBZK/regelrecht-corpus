preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is een vrijwillige voortzetting van de verzekering
    voor bijzondere ziektekosten mogelijk te maken ten behoeve van bepaalde categorieën van buiten Nederland wonende
    personen van wie de verzekering van rechtswege ingevolge artikel 5 van de Algemene Wet Bijzondere Ziektekosten
    is geëindigd;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0012087/2001-08-31#ArtikelAanhef
articles:
  - number: III
    text: |-
      1 In afwijking van [artikel 32b, eerste lid, van de Algemene Wet Bijzondere Ziektekosten][ref1]
      geschiedt aanmelding voor de vrijwillige verzekering van de in
      [artikel 32a, eerste en tweede lid, van de Algemene Wet Bijzondere Ziektekosten][ref2] bedoelde personen, van wie
      de verzekering ingevolge [artikel 5 van die wet][ref3] is geëindigd vóór het tijdstip van inwerkingtreding van deze
      wet, uiterlijk twaalf maanden na de inwerkingtreding van deze wet.

      2 De vrijwillige verzekering ingevolge [Hoofdstuk IV van de Algemene Wet Bijzondere Ziektekosten][ref4]
      gaat voor de in het eerste lid bedoelde personen in op de dag volgend op die waarop de verzekering ingevolge
      [artikel 5 van de Algemene Wet Bijzondere Ziektekosten][ref5] is geëindigd, doch niet vroeger dan 1 januari 2000.

      3 In afwijking van [artikel 25 van de Wet financiering volksverzekeringen][ref6] zijn personen, bedoeld in het
      eerste lid, eerst premie verschuldigd met ingang van het tijdstip van inwerkingtreding van deze wet.

      4 Indien een persoon als bedoeld in het eerste lid is overleden tussen 31 december 1999 en de datum van
      inwerkingtreding van deze wet, hebben diens erfgenamen, ten laste van het Algemeen Fonds Bijzondere Ziektekosten,
      bedoeld in [artikel 1, eerste lid, onder g, van de Algemene Wet Bijzondere Ziektekosten][ref7], ter zake van
      kosten van zorg als bedoeld in het [Besluit zorgaanspraken bijzondere ziektekostenverzekering][ref8], niet
      omvattende de intramurale zorg als bedoeld in de [paragrafen 3][ref9], [4][ref10], [5][ref11], [6][ref12],
      en [7, van dat besluit][ref13], recht op een vergoeding ter zake van die kosten, voorzover de overledene op
      31 december 1999, ingevolge [artikel 34, eerste lid, onderdeel b, en derde lid, van dat besluit][ref14], in
      verbinding met de Regeling hulp in bijzondere omstandigheden AWBZ, voor rekening van het Algemeen Fonds Bijzondere
      Ziektekosten die aanspraak had, en die zorg op een tijdstip gelegen uiterlijk op die dag is aangevangen.
      __REF008___________________________________________________________________________________________________________
      __________, in verbinding met de Regeling hulp in bijzondere omstandigheden AWBZ, is van overeenkomstige
      toepassing.

      5 De erfgenamen, bedoeld in het vierde lid, wenden zich voor het tot gelding brengen van het recht op vergoeding,
      binnen twaalf maanden na inwerkingtreding van deze wet tot de Sociale Verzekeringsbank. De Sociale Verzekeringsbank
      beoordeelt of de overledene tot de vrijwillige verzekering had kunnen toetreden indien hij nog had geleefd, met
      dien verstande dat bij die beoordeling [artikel 32a, tweede lid, van de Algemene Wet Bijzondere Ziektekosten][ref16]
      buiten toepassing blijft. De Sociale Verzekeringsbank geeft aan de erfgenamen een verklaring af. Voor het
      verkrijgen van een vergoeding wenden de erfgenamen zich tot het uitvoeringsorgaan waarbij de overledene tot het
      overlijden als verzekerde was ingeschreven, onder overlegging van de door de SVB afgegeven verklaring.


