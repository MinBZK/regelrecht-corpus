preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging hebben genomen dat het noodzakelijk is ter uitvoering van Verordening (EU) Nr. 528/2012
    van het Europees Parlement en de Raad van 22 mei 2012 betreffende het op de markt aanbieden en het gebruik van
    biociden (PbEU, L 167), wijzigingen aan te brengen in de Wet gewasbeschermingsmiddelen en biociden en de Wet op de
    economische delicten;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0034208/2013-11-21#ArtikelAanhef
articles:
  - number: III
    text: |-
      De [Wet op de economische delicten][ref1], zoals deze luidde vóór 1 september 2013, blijft van toepassing
      op economische delicten als bedoeld in [artikel 1a][ref2] van de genoemde wet, die overtredingen zijn van de
      voorschriften, gesteld bij of krachtens de [Wet gewasbeschermingsmiddelen en biociden][ref3] zoals die luidde voor
      het tijdstip van inwerkingtreding van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002063
      [ref2]: https://wetten.overheid.nl/BWBR0002063#Artikel1a
      [ref3]: https://wetten.overheid.nl/BWBR0021670
    url: https://wetten.overheid.nl/BWBR0034208/2013-11-21#ArtikelIII
