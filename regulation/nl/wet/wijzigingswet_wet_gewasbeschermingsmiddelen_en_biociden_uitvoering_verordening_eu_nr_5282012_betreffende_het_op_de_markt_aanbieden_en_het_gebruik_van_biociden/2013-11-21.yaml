  - number: IV
    text: |-
      Deze wet treedt in werking met ingang van 1 september 2013. Indien het Staatsblad waarin deze wet wordt geplaatst,
      wordt uitgegeven na 31 augustus 2013, treedt zij in werking met ingang van de dag na de datum van uitgifte van het
      Staatsblad waarin zij wordt geplaatst, en werkt zij terug tot en met 1 september 2013.
    url: https://wetten.overheid.nl/BWBR0034208/2013-11-21#ArtikelIV
