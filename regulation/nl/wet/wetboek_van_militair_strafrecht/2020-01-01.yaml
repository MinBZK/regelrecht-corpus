    text: |-
      1 De samenspanning tot de in de [artikelen 84][ref1], [85][ref2] en [87, tweede lid][ref3], omschreven misdrijven
      wordt gestraft met gevangenisstraf van ten hoogste tien jaren of geldboete van de vijfde categorie.

      2 [Artikel 83][ref4] is toepasselijk.


      [ref1]: https://wetten.overheid.nl/BWBR0001869#Artikel84
      [ref2]: https://wetten.overheid.nl/BWBR0001869#Artikel85
