        artikel: '159'
  - number: '72'
    text: |-
      Waar gesproken wordt van een misdrijf, gepleegd in tijd van oorlog, wordt daaronder mede begrepen het geval, dat de
      schuldige het misdrijf pleegt met het oog op een door hem aanstaand geachte oorlog tegen Nederland.
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel72
  - number: '73'
    text: |-
      Waar gesproken wordt van een misdrijf, gepleegd bij een gevecht met de vijand, wordt daaronder mede begrepen
      het geval, dat de schuldige het misdrijf pleegt met het oog op een door hem aanstaand geacht gevecht of bij een
      terugtocht uit een gevecht met de vijand.
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel73
  - number: '75'
    text: |-
      1 De bepalingen van dit wetboek zijn toepasselijk, indien de daarin omschreven feiten worden gepleegd tegen of met
      betrekking tot vreemde mogendheden, hun krijgsmachten of personen, die daarvan deel uitmaken, voor zover:

      a. hetzij die mogendheden bondgenoten zijn van de Staat in een gemeenschappelijke oorlog;

      b. hetzij strijdkrachten van die mogendheden gemeenschappelijk optreden met strijdkrachten van de Staat in een
      gewapend conflict als bedoeld in [artikel 71][ref1];

      c. hetzij met die mogendheden een overeenkomst is gesloten ter collectieve zelfverdediging en een
      gemeenschappelijke oorlog dreigende is.

      2 De bepalingen van dit wetboek zijn voorts toepasselijk indien de feiten omschreven in de [titels IV-VI][ref2],
      [VIII][ref3] en [IX van het tweede boek][ref4] worden gepleegd tegen of met betrekking tot vreemde mogendheden
      waarmede een overeenkomst is gesloten ter collectieve zelfverdediging, hun krijgsmachten of personen, die daarvan
      deel uitmaken.


      [ref1]: https://wetten.overheid.nl/BWBR0001869#Artikel71
      [ref2]: https://wetten.overheid.nl/BWBR0001869
      [ref3]: https://wetten.overheid.nl/BWBR0001869
      [ref4]: https://wetten.overheid.nl/BWBR0001869
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0001869
        artikel: '71'
      - id: ref2
        bwb_id: BWBR0001869
      - id: ref3
        bwb_id: BWBR0001869
      - id: ref4
        bwb_id: BWBR0001869
  - number: 75a
    text: |-
      Een verhouding van meerdere tot mindere bestaat ten opzichte van vreemde militairen slechts voor zover dit
      bij algemene maatregel van rijksbestuur of door een bij algemene maatregel van rijksbestuur daartoe aangewezen
      autoriteit is bepaald.
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel75a
  - number: 75b
    text: |-
      Voor de toepassing van de [artikelen 164][ref1], [166][ref2] en [169][ref3] worden onder rij-, voer-, vaar- en
      luchtvaartuigen, die bij de krijgsmacht in gebruik zijn, mede begrepen rij-, voer-, vaar- en luchtvaartuigen in
      gebruik bij een vreemde krijgsmacht als bedoeld in [artikel 75][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0001869#Artikel164
      [ref2]: https://wetten.overheid.nl/BWBR0001869#Artikel166
      [ref3]: https://wetten.overheid.nl/BWBR0001869#Artikel169
      [ref4]: https://wetten.overheid.nl/BWBR0001869#Artikel75
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel75b
    references:
      - id: ref1
        bwb_id: BWBR0001869
        artikel: '164'
      - id: ref2
        bwb_id: BWBR0001869
        artikel: '166'
      - id: ref3
        bwb_id: BWBR0001869
        artikel: '169'
      - id: ref4
        bwb_id: BWBR0001869
        artikel: '75'
  - number: '77'
    text: |-
      1 De militair die in tijd van oorlog opzettelijk de vijand hulp verleent of de Staat tegenover de vijand benadeelt,
      wordt, als schuldig aan militair verraad, gestraft met, levenslange gevangenisstraf of tijdelijke van ten hoogste
      dertig jaren of geldboete van de vijfde categorie.

      2 Met gelijke straf wordt gestraft de militair die in tijd van oorlog tot het plegen van militair verraad
      samenspant.
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel77
  - number: '78'
    text: |-
      1 Als schuldig aan verspieding wordt gestraft met, levenslange gevangenisstraf of tijdelijke van ten hoogste dertig
      jaren of geldboete van de vijfde categorie:

      1°. hij die opzettelijk ten behoeve van de vijand een inlichting betreffende enig krijgsbelang tracht in te winnen
      aan boord van een vaartuig of luchtvaartuig der krijgsmacht, binnen de voorpostenlinie, in een versterkte of
      bezette plaats of post, of in een inrichting van de krijgsmacht, dan wel in een verboden plaats;

      2°. hij die in tijd van oorlog tersluik, onder een vals voorgeven, door middel van een vermomming of langs een
      andere dan de gewone toegang binnen een van de in onderdeel 1° vermelde plaatsen tracht te komen, aldaar in
      dier voege aanwezig wordt gevonden, of zich op een van die wijzen of door een van die middelen vandaar tracht te
      verwijderen;

      3°. hij die in tijd van oorlog opzettelijk een opneming doet of een afbeelding of beschrijving maakt, betreffende
      enige zaak van militair belang.

      2 Het eerste lid, onder 2° en 3°, is niet van toepassing, indien de rechter blijkt, dat de dader niet ten behoeve
      van de vijand heeft gehandeld.
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel78
  - number: '80'
    text: |-
      De in geval van een oorlog waarin Nederland niet betrokken is, hier te lande geïnterneerde militair van een der
      oorlogvoerende mogendheden, die opzettelijk in strijd met een door hem gegeven belofte zich verwijdert of een
      door hem gegeven belofte of aangenomen voorwaarde waaronder hem verlof is verleend om zich tijdelijk of voorgoed
      te verwijderen, schendt, wordt gestraft met gevangenisstraf van ten hoogste zes jaren of geldboete van de vierde
      categorie.
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel80
  - number: '81'
    text: |-
      De militair die, hetzij enige handeling waarvan hij weet, althans redelijkerwijze kan vermoeden, dat de staat
      daardoor in gevaar van oorlogsverwikkeling wordt gebracht, opzettelijk, zonder daartoe gerechtigd te zijn,
      verricht, hetzij opzettelijk enig voorschrift tot handhaving van de goede betrekkingen van de Staat met andere
      mogendheden van regeringswege gegeven en bekendgemaakt, overtreedt, wordt gestraft met gevangenisstraf van ten
      hoogste twaalf jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel81
  - number: '83'
    text: |-
      1 Tegen de deelnemer aan enige in deze titel vermelde samenspanning, die, voordat de overheid met het bestaan
      daarvan bekend is, haar op zodanige wijze daarvan kennis geeft, dat dientengevolge het plegen van het voorgenomen
      misdrijf wordt voorkomen, is de strafvervolging uitgesloten.

      2 Deze bepaling geldt niet voor hem van wie blijkt, dat hij aanlegger is.
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel83
  - number: '84'
    text: |-
      Met levenslange gevangenisstraf of tijdelijke van ten hoogste dertig jaren of geldboete van de vijfde categorie
      wordt gestraft de militair die in tijd van oorlog opzettelijk:

      1°. enige onder zijn bevelen staande versterkte of bezette plaats of post, ofwel de krijgsmacht of enig deel
      daarvan aan de vijand overgeeft of in 's vijands macht doet of laat overgaan, zonder daarvoor of daarbij alles
      gedaan of bedongen te hebben wat zijn plicht onder die omstandigheden van hem eiste;

      2°. de onder zijn bevelen staande plaats, post, vaartuig of luchtvaartuig der krijgsmacht buiten noodzaak
      eigendunkelijk ontruimt of verlaat;

      3°. bij een gevecht met de vijand zijn plicht niet nakomt om met de onder zijn bevelen staande krijgsmacht aan het
      gevecht deel te nemen of tegenover de vijand stand te houden.

      4°. de onder zijn bevelen staande krijgsmacht, geheel of ten dele, buiten noodzaak naar onzijdig gebied doet of
      laat overgaan.
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel84
  - number: '85'
    text: |-
      Met levenslange gevangenisstraf of tijdelijke van ten hoogste dertig jaren of geldboete van de vijfde categorie
      wordt gestraft:

      1°. hij die opzettelijk bij een gevecht met de vijand of in een door de vijand aangevallen of met aanval bedreigde
      plaats of post zonder uitdrukkelijke last van of vanwege de ter plaatse aanwezige met het hoogste gezag beklede
      militair het teken van overgave geeft;

      2°. hij die in tijd van oorlog het krijgsvolk tracht te misleiden, te ontmoedigen of in verwarring te brengen.
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel85
  - number: '86'
    text: |-
      1 Met gevangenisstraf van ten hoogste vijftien jaren of geldboete van de vijfde categorie wordt gestraft:

      1°. de militair die opzettelijk bij een gevecht met de vijand, met schending van zijn plicht als militair, hetzij
      op de vlucht gaat, hetzij enig oorlogsmaterieel vernielt, beschadigt of onbruikbaar maakt, hetzij zich ontdoet
      van enig wapen, munitie of krijgstoerusting, hem van rijkswege verstrekt of tot zijn voorgeschreven wapening of
      uitrusting behorende, hetzij zich krijgsgevangen geeft;

      2°. de militair die zich in tijd van oorlog opzettelijk, hetzij tersluik, hetzij door een listige kunstgreep of een
      samenweefsel van verdichtsels, hetzij door dronkenschap of zelfverminking aan het gevecht of aan het ogenblikkelijk
      gevaar in het gevecht onttrekt.

      2 De schuldige wordt gestraft met, levenslange gevangenisstraf of tijdelijke van ten hoogste dertig jaren of
      geldboete van de vijfde categorie, indien hij tevens een andere militair tot een der in het eerste lid omschreven
      handelingen aanzet, alsmede indien hij het misdrijf begaat als bevelvoerend militair.
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel86
  - number: '87'
    text: |-
      1 Hij die in tijd van oorlog opzettelijk een militaire operatie doet mislukken, wordt gestraft met gevangenisstraf
      van ten hoogste vijftien jaren of geldboete van de vijfde categorie.

      2 De schuldige wordt gestraft met, levenslange gevangenisstraf of tijdelijke van ten hoogste dertig jaren of
      geldboete van de vijfde categorie, indien hij het misdrijf begaat als bevelvoerend militair of als belast zijnde
      met het bestuur of toezicht over benodigdheden ten dienste van de krijgsmacht.
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel87
  - number: '88'
    text: |-
      Met gevangenisstraf van ten hoogste tien jaren of geldboete van de vijfde categorie wordt gestraft:

      1°. hij die zonder verlof van of vanwege de ter plaatse aanwezige met het hoogste gezag beklede militair zich in
      betrekking stelt tot iemand die zich bij de vijandelijke krijgsmacht of in 's vijands macht bevindt, of tot een
      onderdaan ener vijandelijke mogendheid of macht;

      2°. hij die een bescheid, bericht, inlichting of vraag van iemand die zich bij de vijandelijke krijgsmacht of
      in 's vijands macht bevindt, of van een onderdaan ener vijandelijke mogendheid of macht ontvangen of onderschept
      hebbende, opzettelijk nalaat daarvan dadelijk aan de militaire overheid mededeling te doen;

      3°. hij die in tijd van oorlog een gebeurtenis, bijzonderheid of beschouwing, welker ruchtbaarheid enig
      krijgsbelang kan schaden, opzettelijk bekendmaakt, zonder van ambtswege daartoe verplicht of bevoegd te zijn.
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel88
  - number: '89'
    text: |-
      1 Met gevangenisstraf van ten hoogste vier jaren of geldboete van de vierde categorie wordt gestraft hij die in
      tijd van oorlog opzettelijk een bevel, gegeven door een daartoe bevoegde militair, niet opvolgt, of opzettelijk
      een maatregel, door een militair in het belang van de dienst ondernomen of bevolen, belet, belemmert of verijdelt,
      indien als rechtstreeks en onmiddellijk gevolg daarvan schade ontstaat aan of te duchten is voor de gereedheid tot
      het daadwerkelijk uitvoeren van een operatie of oefening van enig onderdeel van de krijgsmacht.

      2 [Het derde lid van artikel 127][ref1] en [de artikelen 131][ref2], [132][ref3] en [150][ref4] zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001869#Artikel127
