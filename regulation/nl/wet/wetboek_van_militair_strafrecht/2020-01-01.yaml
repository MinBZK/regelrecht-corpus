        artikel: '83'
  - number: '94'
    text: |-
      1 Hij aan wiens schuld te wijten is dat, in tijd van oorlog, enige versterkte of bezette plaats of post, ofwel
      de krijgsmacht of enig deel daarvan verloren gaat, dat een militaire operatie mislukt, of dat een vaartuig of
      luchtvaartuig der krijgsmacht onbruikbaar wordt, wordt gestraft met gevangenisstraf van ten hoogste zes jaren of
      geldboete van de vierde categorie.

      2 Indien de schuldige het misdrijf pleegt als bevelvoerend militair of als belast zijnde met het bestuur of
      toezicht over benodigdheden ten dienste van de krijgsmacht, wordt hij gestraft met gevangenisstraf van ten hoogste
      tien jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel94
  - number: '95'
    text: |-
      1 De militair, aan wiens schuld te wijten is dat enige versterkte of bezette plaats of post, ofwel de krijgsmacht
      of enig deel daarvan door de vijand wordt overvallen, wordt gestraft met gevangenisstraf van ten hoogste drie jaren
      of geldboete van de vierde categorie.

      2 Indien de schuldige het misdrijf pleegt als bevelvoerend militair, wordt hij gestraft met gevangenisstraf van ten
      hoogste vijf jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel95
  - number: '96'
    text: |-
      Met gevangenisstraf of hechtenis van ten hoogste een jaar of geldboete van de derde categorie wordt gestraft de
      militair wiens ongeoorloofde afwezigheid in tijd van vrede aan zijn schuld is te wijten:

      1°. indien als rechtstreeks en onmiddellijk gevolg daarvan schade ontstaat aan of te duchten is voor de gereedheid
      tot het daadwerkelijk uitvoeren van een operatie of oefening van enig onderdeel van de krijgsmacht;

      2°. indien de afwezigheid langer dan vier dagen duurt;

      3°. indien hij daardoor een reis naar of van een plaats buiten het Koninkrijk of naar een plaats in een ander
      rijksdeel die, naar hij weet of redelijkerwijs moet vermoeden, is bevolen, geheel of gedeeltelijk niet meemaakt.
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel96
  - number: '97'
    text: |-
      Met gevangenisstraf van ten hoogste een jaar en zes maanden of geldboete van de vierde categorie wordt gestraft de
      militair wiens ongeoorloofde afwezigheid in tijd van oorlog aan zijn schuld is te wijten:

      1°. indien hij daardoor niet kan deelnemen aan een gevecht met de vijand;

      2°. indien hij daardoor een bevolen reis, bedoeld in [artikel 96, onder 3°][ref1], niet of niet geheel meemaakt;

      3°. indien als rechtstreeks en onmiddellijk gevolg daarvan schade ontstaat aan of te duchten is voor de gereedheid
      tot het daadwerkelijk uitvoeren van een operatie of oefening van enig onderdeel van de krijgsmacht;

      4°. indien de afwezigheid langer dan vier dagen duurt.


      [ref1]: https://wetten.overheid.nl/BWBR0001869#Artikel96
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel97
    references:
      - id: ref1
        bwb_id: BWBR0001869
        artikel: '96'
  - number: '98'
    text: |-
      Met gevangenisstraf van ten hoogste een jaar of geldboete van de derde categorie wordt gestraft de militair die
      zich in tijd van vrede schuldig maakt aan opzettelijke ongeoorloofde afwezigheid:

      1°. indien als rechtstreeks en onmiddellijk gevolg daarvan schade ontstaat aan of te duchten is voor de gereedheid
      tot het daadwerkelijk uitvoeren van een operatie of oefening van enig onderdeel van de krijgsmacht;

      2°. indien de afwezigheid langer dan vier dagen duurt.
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel98
  - number: '99'
    text: |-
      Met gevangenisstraf van ten hoogste twee jaar of geldboete van de vierde categorie wordt gestraft de militair die
      zich in tijd van oorlog schuldig maakt aan opzettelijke ongeoorloofde afwezigheid:

      1°. indien als rechtstreeks en onmiddellijk gevolg daarvan schade ontstaat aan of te duchten is voor de gereedheid
      tot het daadwerkelijk uitvoeren van een operatie of oefening van enig onderdeel van de krijgsmacht;

      2°. indien de afwezigheid langer dan twee dagen duurt.
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel99
  - number: '100'
    text: |-
      1 Als schuldig aan desertie wordt gestraft de militair:

      1°. die zich verwijdert met het oogmerk zich voorgoed aan zijn dienstverplichtingen te onttrekken, het
      oorlogsgevaar te ontgaan, naar de vijand over te lopen of, zonder daartoe gemachtigd te zijn, bij een andere
      mogendheid in krijgsdienst te treden;

      2°. wiens ongeoorloofde afwezigheid in tijd van vrede langer dan dertig, in tijd van oorlog langer dan zeven dagen
      duurt;

      3°. die zich schuldig maakt aan opzettelijke ongeoorloofde afwezigheid en daardoor een bevolen reis, bedoeld in
      [artikel 96, onder 3°][ref1], niet of niet geheel meemaakt.

      2 Desertie, in tijd van vrede gepleegd, wordt gestraft met gevangenisstraf van ten hoogste twee jaren of geldboete
      van de vierde categorie.

      3 Desertie, in tijd van oorlog gepleegd, wordt gestraft met gevangenisstraf van ten hoogste zeven jaar en zes
      maanden of geldboete van de vijfde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0001869#Artikel96
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel100
    references:
      - id: ref1
        bwb_id: BWBR0001869
        artikel: '96'
  - number: '101'
    text: |-
      Het maximum der in de [artikelen 98-100][ref1] gestelde gevangenisstraffen wordt verdubbeld:

      1°. Indien twee of meer personen gezamenlijk of ten gevolge van samenspanning het misdrijf plegen;

      2°. indien de schuldige bevelvoerend militair is;

      3°. indien hij het misdrijf pleegt terwijl hij dienst doet;

      4°. indien hij zich naar of in het buitenland verwijdert;

      5°. indien hij, zich van een vaartuig van de krijgsmacht verwijderende, het misdrijf pleegt met behulp van een tot
      de krijgsmacht behorende sloep of ander licht vaartuig;

      6°. indien hij het misdrijf pleegt met medeneming van een ten behoeve van de krijgsmacht gebruikt luchtvaartuig of
      motorvoertuig, wapen of munitie.


      [ref1]: https://wetten.overheid.nl/BWBR0001869#Artikel98
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel101
    references:
      - id: ref1
        bwb_id: BWBR0001869
        artikel: '98'
  - number: '102'
    text: |-
      Met levenslange gevangenisstraf of tijdelijke van ten hoogste dertig jaren of geldboete van de vijfde categorie
      wordt gestraft:

      1°. desertie naar de vijand;

      2°. desertie met het oogmerk om in een door de schuldige aanstaand geachte oorlog van het Koninkrijk met een andere
      mogendheid of macht bij deze in krijgsdienst te treden.
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel102
  - number: '103'
    text: |-
      1 De samenspanning tot het in [artikel 102][ref1] omschreven misdrijf wordt gestraft met gevangenisstraf van ten
      hoogste tien jaren of geldboete van de vijfde categorie.

      2 [Artikel 83][ref2] is toepasselijk.


      [ref1]: https://wetten.overheid.nl/BWBR0001869#Artikel102
      [ref2]: https://wetten.overheid.nl/BWBR0001869#Artikel83
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel103
