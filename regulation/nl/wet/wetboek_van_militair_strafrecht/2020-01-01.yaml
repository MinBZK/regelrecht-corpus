        bwb_id: BWBR0001869
        artikel: '102'
      - id: ref2
        bwb_id: BWBR0001869
        artikel: '83'
  - number: '104'
    text: |-
      1 Naar de onderscheidingen, gemaakt in de [artikelen 98-102][ref1] en met de daarbij gestelde straffen wordt
      gestraft de militair die zich opzettelijk door een listige kunstgreep of een samenweefsel van verdichtsels aan de
      vervulling van zijn dienstverplichtingen onttrekt of die zich opzettelijk daarvoor ongeschikt maakt of laat maken.

      2 Bij de toepassing van het eerste lid wordt met afwezigheid, bedoeld in de [artikelen 98-102][ref2], gelijkgesteld
      de tijd, gedurende welke de militair zijn dienstverplichtingen niet heeft vervuld.


      [ref1]: https://wetten.overheid.nl/BWBR0001869#Artikel98
      [ref2]: https://wetten.overheid.nl/BWBR0001869#Artikel98
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0001869
        artikel: '98'
      - id: ref2
        bwb_id: BWBR0001869
        artikel: '98'
  - number: '105'
    text: |-
      1 Met gevangenisstraf van ten hoogste twee jaren of geldboete van de vierde categorie wordt gestraft hij die
      opzettelijk een militair op diens verzoek voor de vervulling van dienstverplichting ongeschikt maakt.

      2 Indien het feit wordt begaan in tijd van oorlog wordt gevangenisstraf van ten hoogste vier jaren of geldboete van
      de vierde categorie opgelegd.

      3 Indien het feit de dood ten gevolge heeft wordt gevangenisstraf van ten hoogste zes jaren of geldboete van de
      vierde categorie opgelegd.
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel105
  - number: '106'
    text: |-
      1 Met gevangenisstraf van ten hoogste een jaar of geldboete van de derde categorie wordt gestraft de militair die
      zich opzettelijk aan de vervulling van een bepaalde soort van dienstverplichtingen onttrekt of zich opzettelijk
      daarvoor ongeschikt maakt of laat maken, indien als rechtstreeks en onmiddellijk gevolg daarvan schade ontstaat
      aan of te duchten is voor de bestrijding van gemeen gevaar voor personen of goederen, dan wel de gereedheid tot het
      daadwerkelijk uitvoeren van een operatie of oefening van enig onderdeel van de krijgsmacht.

      2 Indien het feit wordt gepleegd in tijd van oorlog wordt gevangenisstraf van ten hoogste vier jaren of geldboete
      van de vierde categorie opgelegd.
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel106
  - number: '107'
    text: |-
      1 Met gevangenisstraf van ten hoogste drie jaren of geldboete van de vierde categorie wordt gestraft de militair
      die zich opzettelijk aan een bijzondere verplichting betreffende de waakzaamheid of veiligheid onttrekt of zich
      opzettelijk daarvoor ongeschikt maakt of laat maken, indien als rechtstreeks en onmiddellijk gevolg daarvan schade
      ontstaat aan of te duchten is voor de bestrijding van gemeen gevaar voor personen of goederen, de gereedheid
      tot het daadwerkelijke uitvoeren van een operatie of oefening van enig onderdeel van de krijgsmacht, dan wel de
      veiligheid.

      2 Indien het feit wordt gepleegd in tijd van oorlog wordt gevangenisstraf van ten hoogste tien jaren of geldboete
      van de vijfde categorie opgelegd.

      3 Indien het feit wordt gepleegd op een door de vijand aangevallen of met aanval bedreigde plaats, dan wel op een
      voor de oorlogvoering essentiële plaats, wordt de schuldige gestraft met levenslange gevangenisstraf of tijdelijke
      van ten hoogste dertig jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel107
  - number: '108'
    text: |-
      1 Met gevangenisstraf of hechtenis van ten hoogste drie maanden of geldboete van de tweede categorie wordt gestraft
      de militair aan wiens schuld het is te wijten dat hij een bijzondere verplichting betreffende de waakzaamheid of
      veiligheid niet vervult of niet in staat is te vervullen, indien als rechtstreeks en onmiddellijk gevolg daarvan
      schade ontstaat aan of te duchten is voor de bestrijding van gemeen gevaar voor personen of goederen, de gereedheid
      tot het daadwerkelijk uitvoeren van een operatie of oefening van enig onderdeel van de krijgsmacht, dan wel de
      veiligheid.

      2 Indien het feit wordt gepleegd in tijd van oorlog wordt gevangenisstraf of hechtenis van ten hoogste zes maanden
      of geldboete van de derde categorie opgelegd.

      3 Indien het feit wordt gepleegd op een door de vijand aangevallen of met aanval bedreigde plaats, dan wel op een
      voor de oorlogvoering essentiële plaats, wordt gevangenisstraf of hechtenis van ten hoogste een jaar of geldboete
      van de derde categorie opgelegd.
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel108
  - number: '109'
    text: |-
      Met gevangenisstraf van ten hoogste twee jaren of geldboete van de vierde categorie wordt gestraft de militair
      die opzettelijk niet voldoet aan een wettige oproeping voor de werkelijke dienst. Indien het feit wordt gepleegd
      in tijd van oorlog kan gevangenisstraf van ten hoogste vijf jaren of geldboete van de vierde categorie worden
      opgelegd.
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel109
  - number: '110'
    text: |-
      Met gevangenisstraf of hechtenis van ten hoogste negen maanden of geldboete van de derde categorie wordt gestraft
      de militair aan wiens schuld het is te wijten, dat hij niet voldoet aan een wettige oproeping voor de werkelijke
      dienst.
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel110
  - number: '111'
    text: |-
      1 Hij die een verlofpas valselijk opmaakt of vervalst, of die zodanig stuk op een valse naam of voornaam of met
      aanwijzing van een valse hoedanigheid doet afgeven, met het oogmerk om het te gebruiken of door een militair te
      doen gebruiken als ware het echt en onvervalst of als ware de inhoud in overeenstemming met de waarheid, wordt
      gestraft met gevangenisstraf van ten hoogste twee jaren of een geldboete van de vierde categorie.

      2 Met gelijke straf wordt gestraft de militair die opzettelijk gebruik maakt van een valse of vervalste verlofpas
      als ware hij echt en onvervalst of als ware de inhoud in overeenstemming met de waarheid.
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel111
  - number: '112'
    text: |-
      De militair die opzettelijk van eens anders reispas, veiligheidskaart, reisorder of verlofpas gebruik maakt, als
      ware hij de daarin genoemde persoon, wordt gestraft met gevangenisstraf van ten hoogste een jaar en zes maanden of
      geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel112
  - number: '113'
    text: |-
      Indien een der misdrijven, omschreven in de [artikelen 111][ref1] en [112 van dit wetboek][ref2] of in de
      [artikelen 228, eerste en derde lid][ref3], of [229 van het Wetboek van Strafrecht][ref4], door een militair in
      tijd van oorlog wordt gepleegd ten einde het misdrijf van desertie gemakkelijk te maken, wordt hij gestraft met
      gevangenisstraf van ten hoogste zes jaren of geldboete van de vierde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0001869#Artikel111
      [ref2]: https://wetten.overheid.nl/BWBR0001869#Artikel112
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel228
      [ref4]: https://wetten.overheid.nl/BWBR0001854#Artikel229
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel113
    references:
      - id: ref1
        bwb_id: BWBR0001869
        artikel: '111'
      - id: ref2
        bwb_id: BWBR0001869
        artikel: '112'
      - id: ref3
        bwb_id: BWBR0001854
        artikel: '228'
      - id: ref4
        bwb_id: BWBR0001854
        artikel: '229'
  - number: '114'
    text: |-
      1 Onder zich verwijderen wordt in deze titel mede begrepen het zich schuilhouden of zich niet bevinden op de
      plaats, waar de militair zijn dienstverplichtingen behoort te vervullen.

      2 Onder afwezigheid wordt verstaan het afwezig zijn van de in het vorige lid bedoelde plaats. De afwezigheid wordt
      geacht te zijn beëindigd op het tijdstip dat de militair wederom ter beschikking van de militaire autoriteiten is.

      3 Onder ongeoorloofde afwezigheid wordt mede verstaan de afwezigheid van de militair zolang deze nalatig is in de
      uitvoering van de bij algemene maatregel van rijksbestuur opgelegde verplichtingen of de door Onze Minister van
      Defensie vastgestelde regelen voor het geval van verhindering tot dienstverrichting.
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel114
  - number: '115'
    text: |-
      1 Met gevangenisstraf van ten hoogste een jaar en negen maanden of geldboete van de vierde categorie wordt gestraft
      de militair die door het stelselmatig niet nakomen van dienstverplichtingen het functioneren van de krijgsmacht
      belemmert.

      2 Indien het feit wordt gepleegd in tijd van oorlog wordt gevangenisstraf van ten hoogste vier jaren of geldboete
      van de vierde categorie opgelegd.
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel115
  - number: '116'
    text: |-
      1 Met gevangenisstraf van ten hoogste drie jaren of geldboete van de vierde categorie wordt gestraft de militair
      die het functioneren van de krijgsmacht belemmert door in gezamenlijk verband met een of meer militairen
      opzettelijk dienstverplichtingen niet na te komen.

      2 Indien het feit wordt gepleegd in tijd van oorlog wordt gevangenisstraf van ten hoogste acht jaren of geldboete
      van de vijfde categorie opgelegd.
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel116
  - number: '117'
    text: |-
      1 Met gevangenisstraf van ten hoogste drie jaren of geldboete van de vierde categorie wordt gestraft de militair
      die opzettelijk wederrechtelijk de uitvoering van enige maatregel belet of belemmert, indien als rechtstreeks en
      onmiddellijk gevolg daarvan schade ontstaat aan of te duchten is voor de gereedheid tot het daadwerkelijk uitvoeren
      van een operatie of oefening van enig onderdeel van de krijgsmacht.

      2 Indien het feit wordt gepleegd in tijd van oorlog wordt gevangenisstraf van ten hoogste vijftien jaren of
      geldboete van de vijfde categorie opgelegd.
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel117
  - number: '118'
    text: |-
      1 Als schuldig aan feitelijke insubordinatie wordt met gevangenisstraf van ten hoogste vier jaren of geldboete van
      de vierde categorie gestraft de militair die opzettelijk met geweld of bedreiging met geweld hetzij zich tegen een
      meerdere in de uitoefening van diens functie verzet, hetzij hem de vrijheid in die uitoefening ontneemt, hetzij hem
      dwingt enige dienst te verrichten of na te laten.

      2 De schuldige wordt gestraft:

      1°. met gevangenisstraf van ten hoogste vijf jaren of geldboete van de vierde categorie, indien het misdrijf of de
      daarmee gepaard gaande feitelijkheden enig lichamelijk letsel ten gevolge hebben;

      2°. met gevangenisstraf van ten hoogste tien jaren of geldboete van de vijfde categorie, indien zij zwaar
      lichamelijk letsel ten gevolge hebben;

      3°. met gevangenisstraf van ten hoogste vijftien jaren of geldboete van de vijfde categorie, indien zij de dood ten
      gevolge hebben.
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel118
  - number: '119'
    text: |-
      1 Feitelijke insubordinatie, door twee of meer militairen met verenigde krachten gepleegd, wordt als muiterij,
      gestraft met gevangenisstraf van ten hoogste acht jaren of geldboete van de vijfde categorie.

      2 De schuldige wordt gestraft:

      1°. met gevangenisstraf van ten hoogste tien jaren of geldboete van de vijfde categorie indien het door hem
      gepleegde misdrijf of de daarbij door hem gepleegde feitelijkheden enig lichamelijk letsel ten gevolge hebben;

      2°. met gevangenisstraf van ten hoogste vijftien jaren of geldboete van de vijfde categorie, indien zij zwaar
      lichamelijk letsel ten gevolge hebben;

      3°. met gevangenisstraf van ten hoogste twintig jaren of geldboete van de vijfde categorie, indien zij de dood ten
      gevolge hebben.
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel119
  - number: '120'
    text: |-
      Met levenslange gevangenisstraf of tijdelijke van ten hoogste dertig jaren of geldboete van de vijfde categorie
      wordt gestraft:

      1°. feitelijke insubordinatie in tijd van oorlog;

      2°. muiterij aan boord van een oorlogsvaartuig of luchtvaartuig van de krijgsmacht dat zich ergens bevindt waar
      geen onmiddellijke hulp te verkrijgen is.
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel120
  - number: '121'
    text: |-
      1 De samenspanning tot het in [artikel 120][ref1] omschreven misdrijf wordt gestraft met gevangenisstraf van ten
      hoogste tien jaren of geldboete van de vijfde categorie.

      2 [Artikel 83][ref2] is toepasselijk.


      [ref1]: https://wetten.overheid.nl/BWBR0001869#Artikel120
      [ref2]: https://wetten.overheid.nl/BWBR0001869#Artikel83
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel121
    references:
      - id: ref1
        bwb_id: BWBR0001869
        artikel: '120'
      - id: ref2
        bwb_id: BWBR0001869
        artikel: '83'
  - number: '122'
    text: |-
      1 De militair die opzettelijk met vier of meer andere militairen samenschoolt om in vereniging hun plicht te
      verzaken wordt, indien het tot enige gewelddadigheid of bedreiging daarmee is gekomen, als schuldig aan deelneming
      aan militaire oproer gestraft met gevangenisstraf van ten hoogste twaalf jaren of geldboete van de vijfde
      categorie.

      2 Indien het feit is gepleegd in tijd van oorlog wordt de schuldige gestraft met gevangenisstraf van ten hoogste
      twintig jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel122
  - number: '123'
    text: |-
      1 De deelnemer aan samenscholing met vier of meer andere militairen om in vereniging hun plicht te verzaken, die
      tot de orde terugkeert voordat het tot enige gewelddadigheid of bedreiging daarmee is gekomen, wordt gestraft met
      gevangenisstraf van ten hoogste drie jaren of geldboete van de vierde categorie.

      2 Indien de samenscholing is gepleegd in tijd van oorlog wordt de schuldige gestraft met gevangenisstraf van ten
      hoogste vijf jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel123
  - number: '124'
    text: |-
      Ten aanzien van de feiten gepleegd tegen een meerdere wordt een troepenafdeling belast met wacht- of
      patrouilledienst, of een schildwacht gelijkgesteld met een meerdere, behalve in geval het feit is begaan door hem
      aan wie zij, als zodanig, ondergeschikt zijn.
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel124
  - number: '125'
    text: |-
      Onder een dienstbevel wordt verstaan een bevel dat enig militair dienstbelang betreft en gegeven is door een
      meerdere aan een mindere.
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel125
  - number: '126'
    text: |-
      De militair die opzettelijk een dienstbevel niet opvolgt, wordt gestraft:

      1°. met gevangenisstraf van ten hoogste twee jaren of geldboete van de vierde categorie, indien daarvan gemeen
      gevaar voor personen of goederen te duchten is;

      2°. met gevangenisstraf van ten hoogste drie jaren of geldboete van de vierde categorie, indien daarvan
      levensgevaar voor een ander te duchten is;

      3°. met gevangenisstraf van ten hoogste vijf jaren of geldboete van de vierde categorie, indien daarvan
      levensgevaar voor een ander te duchten is en het feit iemands dood ten gevolge heeft.
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel126
  - number: '127'
    text: |-
      1 Met gevangenisstraf van ten hoogste een jaar en negen maanden of geldboete van de vierde categorie wordt gestraft
      de militair die opzettelijk een dienstbevel niet opvolgt, indien als rechtstreeks en onmiddellijk gevolg daarvan
      schade ontstaat aan of te duchten is voor de gereedheid tot het daadwerkelijk uitvoeren van een operatie of
      oefening van enig onderdeel van de krijgsmacht.

      2 Indien het feit is gepleegd in tijd van oorlog wordt hij gestraft met gevangenisstraf van ten hoogste vier jaren
      of geldboete van de vierde categorie.

      3 Het maximum der in het eerste en tweede lid gestelde gevangenisstraffen wordt verdubbeld:

      1°. indien twee of meer personen gezamenlijk het misdrijf plegen;

      2°. indien de schuldige tevens een andere militair tot het misdrijf aanzet;

      3°. indien hij het misdrijf pleegt bij een gevecht met de vijand.
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel127
  - number: '128'
    text: |-
      Met levenslange gevangenisstraf of tijdelijke van ten hoogste dertig jaren of geldboete van de vijfde categorie
      wordt gestraft de militair die opzettelijk een dienstbevel om aan een gevecht met de vijand deel te nemen, of
      tegenover deze stand te houden, niet opvolgt.
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel128
  - number: '129'
    text: |-
      1 De samenspanning tot het in [artikel 128][ref1] omschreven misdrijf wordt gestraft met gevangenisstraf van ten
      hoogste tien jaren of geldboete van de vijfde categorie.

      2 [Artikel 83][ref2] is toepasselijk.


      [ref1]: https://wetten.overheid.nl/BWBR0001869#Artikel128
      [ref2]: https://wetten.overheid.nl/BWBR0001869#Artikel83
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel129
    references:
      - id: ref1
        bwb_id: BWBR0001869
        artikel: '128'
      - id: ref2
        bwb_id: BWBR0001869
        artikel: '83'
  - number: '130'
    text: |-
      De militair aan wiens schuld het is te wijten, dat hij een dienstbevel niet opvolgt, wordt gestraft:

      1°. met gevangenisstraf of hechtenis van ten hoogste drie maanden of geldboete van de tweede categorie, indien
      daardoor gemeen gevaar voor personen of goederen ontstaat;

      2°. met gevangenisstraf of hechtenis van ten hoogste zes maanden of geldboete van de derde categorie, indien
      daardoor levensgevaar voor een ander ontstaat;

      3°. met gevangenisstraf van ten hoogste een jaar of geldboete van de derde categorie indien het feit iemands dood
      ten gevolge heeft;

      4°. met gevangenisstraf van ten hoogste twee jaren of geldboete van de vierde categorie, indien als rechtstreeks en
      onmiddellijk gevolg daarvan schade ontstaat aan of te duchten is voor de gereedheid tot het daadwerkelijk uitvoeren
      van een operatie of oefening van enig onderdeel van de krijgsmacht en het feit is gepleegd in tijd van oorlog;

      5°. met gevangenisstraf van ten hoogste zes jaren of geldboete van de vierde categorie, indien het feit een bevel
      betrof om aan een gevecht met de vijand deel te nemen of tegenover deze stand te houden.
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel130
  - number: 130a
    text: |-
      Onder het niet opvolgen van een dienstbevel wordt mede verstaan het weigeren een dienstbevel op te volgen of het
      eigendunkelijk overschrijden daarvan.
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel130a
  - number: '131'
    text: |-
      Een feit, bedoeld in de [artikelen 126-130][ref1], is niet strafbaar, indien de bevolen gedraging onrechtmatig is.


      [ref1]: https://wetten.overheid.nl/BWBR0001869#Artikel126
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel131
    references:
      - id: ref1
        bwb_id: BWBR0001869
        artikel: '126'
  - number: '132'
    text: |-
      Niet strafbaar is de militair die een feit begaat, genoemd in de [artikelen 126-128][ref1], indien hij de bevolen
      gedraging te goeder trouw als onrechtmatig beschouwde.


      [ref1]: https://wetten.overheid.nl/BWBR0001869#Artikel126
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel132
    references:
      - id: ref1
        bwb_id: BWBR0001869
        artikel: '126'
  - number: '133'
    text: |-
      Een feit, bedoeld in de [artikelen 126-130][ref1], is niet strafbaar, indien onderling strijdige dienstbevelen zijn
      gegeven en het niet opgevolgde dienstbevel voorafgaat aan het laatst gehandhaafde.


      [ref1]: https://wetten.overheid.nl/BWBR0001869#Artikel126
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel133
    references:
      - id: ref1
        bwb_id: BWBR0001869
        artikel: '126'
  - number: '134'
    text: |-
      Met betrekking tot het dienstbevel wordt een troepenafdeling belast met wacht- of patrouilledienst, of een
      schildwacht gelijkgesteld met een meerdere, behalve in het geval het feit is begaan door hem aan wie zij, als
      zodanig, ondergeschikt zijn.
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel134
  - number: '135'
    text: |-
      Onder dienstvoorschrift wordt verstaan een bij of krachtens algemene maatregel van rijksbestuur of van bestuur dan
      wel een bij of krachtens landsverordening onderscheidenlijk landsbesluit gegeven schriftelijk besluit van algemene
      strekking dat enig militair dienstbelang betreft en een tot de militair gericht ge- of verbod bevat.
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel135
  - number: '136'
    text: |-
      1 De militair die opzettelijk een dienstvoorschrift niet opvolgt wordt gestraft:

      1°. met gevangenisstraf van ten hoogste een jaar en negen maanden of geldboete van de vierde categorie, indien
      als rechtstreeks en onmiddellijk gevolg daarvan schade ontstaat aan of te duchten is voor de gereedheid tot het
      daadwerkelijk uitvoeren van een operatie of oefening van enig onderdeel van de krijgsmacht;

      2°. met gevangenisstraf van ten hoogste twee jaren of geldboete van de vierde categorie, indien daarvan gemeen
      gevaar voor personen of goederen te duchten is;

      3°. met gevangenisstraf van ten hoogste drie jaren of geldboete van de vierde categorie, indien daarvan
      levensgevaar voor een ander te duchten is;

      4°. met gevangenisstraf van ten hoogste vijf jaren of geldboete van de vierde categorie, indien daarvan
      levensgevaar voor een ander te duchten is en het feit iemands dood ten gevolge heeft.

      2 Indien het feit bedoeld onder 1° is gepleegd in tijd van oorlog, wordt de schuldige gestraft met gevangenisstraf
      van ten hoogste vier jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel136
  - number: '137'
    text: |-
      De militair aan wiens schuld het is te wijten, dat hij een dienstvoorschrift niet opvolgt, wordt gestraft:

      1°. met gevangenisstraf of hechtenis van ten hoogste drie maanden of geldboete van de tweede categorie, indien
      daardoor gemeen gevaar voor personen of goederen ontstaat;

      2°. met gevangenisstraf of hechtenis van ten hoogste zes maanden of geldboete van de derde categorie, indien
      daardoor levensgevaar voor een ander ontstaat;

      3°. met gevangenisstraf of hechtenis van ten hoogste een jaar of geldboete van de derde categorie, indien het feit
      iemands dood ten gevolge heeft;

      4°. met gevangenisstraf van ten hoogste twee jaren of geldboete van de vierde categorie, indien als rechtstreeks en
      onmiddellijk gevolg daarvan schade ontstaat aan of te duchten is voor de gereedheid tot het daadwerkelijk uitvoeren
      van een operatie of oefening van enig onderdeel van de krijgsmacht en het feit is gepleegd in tijd van oorlog.
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel137
  - number: '138'
    text: |-
      Een feit, bedoeld in een van beide voorgaande artikelen, is niet strafbaar indien een van het dienstvoorschrift
      afwijkend dienstbevel is opgevolgd.
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel138
  - number: '139'
    text: |-
      1 De militair die weigert of opzettelijk nalaat iedere dienst, van welke soort ook, te verrichten wordt gestraft
      met gevangenisstraf van ten hoogste twee jaren of geldboete van de vierde categorie.

      2 Indien het feit is gepleegd in tijd van oorlog wordt de schuldige gestraft met gevangenisstraf van ten hoogste
      vijf jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel139
  - number: '140'
    text: |-
      Met gevangenisstraf van ten hoogste twee jaren of geldboete van de vierde categorie wordt gestraft de militair
      die opzettelijk een andere militair of iemand, die anderszins bij of ten behoeve van de krijgsmacht werkzaam is,
      feitelijk bedreigt met geweld of feitelijk aanrandt.
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel140
  - number: '141'
    text: |-
      Indien een in de [artikelen 300-303 van het Wetboek van Strafrecht][ref1] bedoeld misdrijf door een militair wordt
      gepleegd tegen een andere militair of iemand, die anderszins bij of ten behoeve van de krijgsmacht werkzaam is,
      kunnen de in die artikelen bepaalde gevangenisstraffen met een derde worden verhoogd.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel300
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel141
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '300'
  - number: '142'
    text: |-
      1 Met levenslange gevangenisstraf of tijdelijke van ten hoogste dertig jaren of geldboete van de vijfde categorie
      worden gestraft de militairen die in tijd van oorlog met vereende krachten geweld tegen een of meer personen
      plegen en bij het plegen van het feit misbruik maken of dreigen te maken van macht, gelegenheid of middel, hun als
      militair gegeven.

      2 Met gelijke straf worden gestraft de in [artikel 2 van de Wet militaire strafrechtspraak][ref1] genoemde personen
      die gelijke handelingen plegen en daarbij misbruik maken of dreigen te maken van macht, gelegenheid of middel, hun
      door hun betrekking tot de krijgsmacht gegeven.

      3 [Artikel 81 van het Wetboek van Strafrecht][ref2] blijft buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004789#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel81
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel142
    references:
      - id: ref1
        bwb_id: BWBR0004789
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '81'
  - number: '143'
    text: |-
      1 Hij, die geweld pleegt tegen een dode, zieke of gewonde, behorende tot de krijgsmacht van een der strijdende
      partijen, wordt gestraft met levenslange gevangenisstraf of tijdelijke van ten hoogste dertig jaren of geldboete
      van de vijfde categorie.

      2 Onder hen, die behoren tot de krijgsmacht van een der strijdende partijen, worden voor de toepassing van dit
      artikel gerekend allen, die bij deze krijgsmacht in dienstbetrekking zijn of haar met toestemming van de militaire
      overheid vergezellen of volgen.
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel143
  - number: '144'
    text: |-
      1 Met gevangenisstraf van ten hoogste twee jaren of geldboete van de vierde categorie wordt gestraft hij
      die opzettelijk een mededeling, die hij uit hoofde van zijn ambt moet doen, niet of onjuist doet, indien als
      rechtstreeks en onmiddellijk gevolg daarvan schade ontstaat aan of te duchten is voor de veiligheid van de Staat
      dan wel de gereedheid tot het daadwerkelijk uitvoeren van een operatie of oefening van enig onderdeel van de
      krijgsmacht.

      2 Indien het feit wordt gepleegd in tijd van oorlog wordt de schuldige gestraft met gevangenisstraf van ten hoogste
      negen jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel144
  - number: '145'
    text: |-
      Met gevangenisstraf van ten hoogste drie jaren of geldboete van de vierde categorie wordt gestraft hij aan wiens
      schuld het is te wijten dat hij in tijd van oorlog een mededeling, die hij uit hoofde van zijn ambt moet doen, niet
      of onjuist doet, indien als rechtstreeks en onmiddellijk gevolg daarvan schade ontstaat aan of te duchten is voor
      de veiligheid van de Staat dan wel de gereedheid tot het daadwerkelijk uitvoeren van een operatie of oefening van
      enig onderdeel van de krijgsmacht.
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel145
  - number: '146'
    text: |-
      Indien het in [artikel 365 van het Wetboek van Strafrecht][ref1] omschreven misdrijf wordt gepleegd door een
      militair kan de in dat artikel bepaalde gevangenisstraf met een derde worden verhoogd.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel365
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel146
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '365'
  - number: '147'
    text: |-
      Met gevangenisstraf van ten hoogste drie jaren of geldboete van de vierde categorie wordt gestraft de militair die
      een andere militair opzettelijk door gift, belofte, bedreiging of misleiding weerhoudt van het doen van een klacht
      of aangifte ter zake van een strafbaar feit.
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel147
  - number: '148'
    text: |-
      De militair, die opzettelijk toelaat, dat een mindere een misdrijf pleegt, of die, getuige van een door een mindere
      gepleegd misdrijf, opzettelijk nalaat maatregelen te nemen, voorzover die nodig zijn en van hem kunnen worden
      gevergd, wordt gestraft als de medeplichtige.
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel148
  - number: '149'
    text: |-
      Met gevangenisstraf van ten hoogste zes maanden of geldboete van de derde categorie wordt gestraft de militair die
      opzettelijk nalaat maatregelen te nemen, voor zover die nodig zijn en van hem kunnen worden gevergd, indien een
      onder zijn bevelen staande militair, naar hij redelijkerwijs moet vermoeden, een misdrijf pleegt of voornemens is
      te plegen.
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel149
  - number: '150'
    text: |-
      1 De militair die opzettelijk een mindere een bevel geeft, inhoudende het plegen van een misdrijf, wordt, indien
      het bevel is uitgevoerd, als dader van dat misdrijf gestraft.

      2 Indien een bevel als in het eerste lid bedoeld niet is uitgevoerd, wordt de meerdere gestraft met gevangenisstraf
      van ten hoogste vijf jaren of geldboete van de vierde categorie, echter met dien verstande dat nooit een zwaardere
      straf mag worden uitgesproken dan terzake van poging tot het bevolen misdrijf, of, indien zodanige poging niet
      strafbaar is, terzake van het misdrijf zelf kan worden opgelegd.
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel150
  - number: '151'
    text: |-
      1 Hij die kennis draagt van enige in dit wetboek strafbaar gestelde samenspanning tot misdrijf of van voornemen tot
      het plegen van een misdrijf ter zake waarvan levenslange gevangenisstraf kan worden opgelegd of van een misdrijf
      tegen de veiligheid van de Staat, desertie in tijd van oorlog, feitelijke insubordinatie of militair oproer, en
      op een tijdstip, waarop het begaan van het misdrijf nog kan worden voorkomen, opzettelijk nalaat daarvan tijdig
      kennis te geven hetzij aan de overheid, hetzij aan de bedreigde, wordt indien het misdrijf is gevolgd, gestraft als
      de medeplichtige.

      2 Met gelijke straf wordt gestraft hij die kennis draagt van enig in het eerste lid vermeld reeds gepleegd
      misdrijf, en op een tijdstip, waarop de gevolgen nog kunnen worden afgewend, opzettelijk nalaat daarvan kennis
      te doen.
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel151
  - number: '152'
    text: |-
      [Artikel 151][ref1] is niet van toepassing op hem die door de kennisgeving gevaar voor een strafvervolging zou
      doen ontstaan voor zichzelf, voor een van zijn bloedverwanten of aangehuwden in de rechte lijn of in de tweede
      of derde graad van de zijlijn, voor zijn echtgenoot of gewezen echtgenoot of degene met wie hij een geregistreerd
      partnerschap is of was aangegaan, of voor een ander, bij wiens vervolging hij zich, uit hoofde van zijn ambt of
      beroep, van het afleggen van getuigenis zou kunnen verschonen.


      [ref1]: https://wetten.overheid.nl/BWBR0001869#Artikel151
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel152
    references:
      - id: ref1
        bwb_id: BWBR0001869
        artikel: '151'
  - number: '153'
    text: |-
      1 Hij die, mondeling of bij geschrifte, een militair opruit tot enig misdrijf, in dit wetboek omschreven of door
      hem te begaan onder een der in [artikel 44 van het Wetboek van Strafrecht][ref1] vermelde omstandigheden, wordt
      gestraft met gevangenisstraf van ten hoogste vijf jaren of geldboete van de vierde categorie.

      2 De schuldige wordt gestraft met gevangenisstraf van ten hoogste vijftien jaren of geldboete van de vijfde
      categorie, indien de opruiing betreft een der misdrijven omschreven in de [artikelen 92-101][ref2] of
      [121 van het Wetboek van Strafrecht][ref3], desertie, strafbare schending van een dienstbevel in tijd van oorlog,
      muiterij of militair oproer buiten tijd van oorlog.

      3 De schuldige wordt gestraft met levenslange gevangenisstraf of tijdelijke van ten hoogste dertig jaren of
      geldboete van de vijfde categorie:

      1°. indien de opruiing geschiedt in tijd van oorlog en zij betreft een der in de [artikelen 92][ref4] en
      [93 van het Wetboek van Strafrecht][ref5] omschreven misdrijven, militair verraad, desertie in een der in
      [artikel 102][ref6] omschreven gevallen, schending van een dienstbevel als bedoeld in [artikel 128][ref7],
      muiterij, militair oproer of een der in de [artikelen 142][ref8] en [160][ref9] omschreven misdrijven;

      2°. indien de opruiing geschiedt aan boord van een oorlogsvaartuig of luchtvaartuig der krijgsmacht, zich ergens
      bevindende waar geen onmiddellijke hulp te verkrijgen is, en zij muiterij of militair oproer betreft.

      4 Met gelijke straffen wordt gestraft hij die een der in dit artikel vermelde geschriften, waarvan hij de inhoud
      kent, verspreidt, tentoonstelt, aanslaat of ter verspreiding in voorraad heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel44
