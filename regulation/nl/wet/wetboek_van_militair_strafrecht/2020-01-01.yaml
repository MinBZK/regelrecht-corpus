  - number: '154'
    text: |-
      Met gevangenisstraf van ten hoogste zes jaren of geldboete van de vierde categorie wordt gestraft hij die diefstal
      pleegt en daarbij misbruik heeft gemaakt van de gelegenheid, hem verschaft door zijn inkwartiering of door zijn
      huisvesting op openbaar gezag.
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel154
  - number: '155'
    text: |-
      Met gevangenisstraf van ten hoogste negen jaren of geldboete van de vijfde categorie wordt gestraft diefstal door
      een militair gepleegd op een onder zijn bijzondere bewaking of bescherming gestelde plaats.
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel155
  - number: '156'
    text: |-
      1 Met gevangenisstraf van ten hoogste twaalf jaren of geldboete van de vijfde categorie wordt, als schuldig aan
      plundering, gestraft:

      1°. de militair die in tijd van oorlog bij het plegen van diefstal misbruik maakt of dreigt te maken van macht,
      gelegenheid of middel, hem als militair gegeven;

      2°. de persoon, behorende tot de in [artikel 2 van de Wet militaire strafrechtspraak][ref1] genoemden, die bij het
      plegen van diefstal misbruik maakt of dreigt te maken van macht, gelegenheid of middel, hem door zijn betrekking
      tot de krijgsmacht gegeven;

      3°. hij die diefstal pleegt aan of tegen een dode, zieke of verwonde, behorende tot de krijgsmacht van een der
      strijdende partijen. Onder hen, die behoren tot de krijgsmacht van een der strijdende partijen, worden voor
      de toepassing van deze bepaling gerekend allen, die bij deze krijgsmacht in dienstbetrekking zijn of haar met
      toestemming van de militaire overheid vergezellen of volgen.

      2 Indien het feit gepleegd is door twee of meer verenigde personen, worden de schuldigen gestraft met levenslange
      gevangenisstraf of tijdelijke van ten hoogste dertig jaren of geldboete van de vijfde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0004789#Artikel2
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel156
    references:
      - id: ref1
        bwb_id: BWBR0004789
        artikel: '2'
  - number: '157'
    text: |-
      1 Als schuldig aan opzetheling wordt gestraft met gevangenisstraf van ten hoogste zes jaren of geldboete van de
      vierde categorie de militair die:

      a. een goed verwerft, voorhanden heeft of overdraagt, dan wel een persoonlijk recht op of een zakelijk recht ten
      aanzien van een goed vestigt of overdraagt, terwijl hij ten tijde van de verwerving of het voorhanden krijgen
      van het goed dan wel het vestigen van het recht wist dat het een door een der in deze titel omschreven misdrijven
      verkregen goed betrof;

      b. opzettelijk uit winstbejag een door een der in deze titel omschreven misdrijven verkregen goed voorhanden
      heeft of overdraagt, dan wel een persoonlijk recht op of zakelijk recht ten aanzien van een door zodanig misdrijf
      verkregen goed overdraagt.

      2 Met dezelfde straf wordt gestraft hij die opzettelijk uit de opbrengst van enig door zodanig misdrijf verkregen
      goed voordeel trekt.
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel157
  - number: '158'
    text: |-
      1 Als schuldig aan schuldheling wordt gestraft met gevangenisstraf van ten hoogste twee jaar of geldboete van de
      vierde categorie de militair die:

      a. een goed verwerft, voorhanden heeft of overdraagt, dan wel een persoonlijk recht op of zakelijk recht ten
      aanzien van een goed vestigt of overdraagt, terwijl hij ten tijde van de verwerving of het voorhanden krijgen van
      het goed dan wel het vestigen van het recht redelijkerwijs had moeten vermoeden dat het een door een der in deze
      titel omschreven misdrijven verkregen goed betrof;

      b. uit winstbejag een goed voorhanden heeft of overdraagt dan wel een persoonlijk recht op of zakelijk recht ten
      aanzien van een goed overdraagt, terwijl hij redelijkerwijs moet vermoeden dat het een door een der in deze titel
      omschreven misdrijven verkregen goed betreft.

      2 Met dezelfde straf wordt gestraft hij die uit de opbrengst van enig goed voordeel trekt, terwijl hij
      redelijkerwijs moet vermoeden dat het een door zodanig misdrijf verkregen goed betreft.
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel158
  - number: '159'
    text: |-
      1 Hij die opzettelijk en wederrechtelijk een dier, dat ten behoeve van de krijgsmacht wordt gebruikt, doodt,
      mishandelt, voor de dienst ongeschikt maakt of wegmaakt, wordt gestraft met gevangenisstraf van ten hoogste vier
      jaren of geldboete van de vierde categorie.

      2 Indien hij het feit pleegt in tijd van oorlog wordt gevangenisstraf van ten hoogste tien jaren opgelegd of
      geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel159
  - number: '160'
    text: |-
      1 Met levenslange gevangenisstraf of tijdelijke van ten hoogste dertig jaren of geldboete van de vijfde categorie
      worden gestraft de militairen die in tijd van oorlog met verenigde krachten opzettelijk en wederrechtelijk enig
      goed dat geheel of gedeeltelijk aan een ander toebehoort, vernielen, beschadigen, onbruikbaar maken of wegmaken, en
      bij het plegen van dat feit misbruik maken of dreigen te maken van macht, gelegenheid of middel, hun als militair
      gegeven.

      2 Met gelijke straf worden gestraft de in [artikel 2 van de Wet militaire strafrechtspraak][ref1] genoemde personen
      die gelijke handelingen plegen en daarbij misbruik maken of dreigen te maken van macht, gelegenheid of middel, hun
      door hun betrekking tot de krijgsmacht gegeven.

      3 [Artikel 81 van het Wetboek van Strafrecht][ref2] blijft buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004789#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel81
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel160
    references:
      - id: ref1
        bwb_id: BWBR0004789
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '81'
  - number: '161'
    text: |-
      De militair, die in tijd van oorlog opzettelijk en wederrechtelijk enige oorlogsbehoefte vernielt, beschadigt,
      onbruikbaar maakt of wegmaakt, of die zich opzettelijk en eigendunkelijk ontdoet van enig hem van rijkswege
      verstrekt wapen, munitie, krijgstoerusting of voedingsmiddel, wordt gestraft met gevangenisstraf van ten hoogste
      tien jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel161
  - number: '162'
    text: |-
      De militair, die in tijd van oorlog enig aan hem of aan een andere militair van rijkswege verstrekt goed, wetende
      dat dit behoort tot de militaire kleding of uitrusting, hetzij zonder schriftelijke vergunning, door of vanwege de
      bevoegde officier afgegeven, verkoopt, ruilt, ten geschenke, in pand, gebruik of bewaring geeft, hetzij wegmaakt,
      wordt gestraft met gevangenisstraf van ten hoogste vier jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel162
  - number: '163'
    text: |-
      Hij die als bestuurder van een motorrijtuig, een rijwiel of enig ander rij- of voertuig daarmede over enige
      voor het openbaar of militair verkeer openstaande weg rijdt dan wel als bestuurder van een vaartuig daarmede op
      enig voor de openbare of militaire scheepvaart openstaand water vaart, onder zodanige invloed van het gebruik
      van alcoholhoudende drank, dat hij niet in staat moet worden geacht het rij-, voer- of vaartuig naar behoren te
      besturen, wordt gestraft met gevangenisstraf van ten hoogste drie maanden of geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel163
  - number: '164'
    text: |-
      Hij die optreedt als bestuurder van een motorrijtuig, een rijwiel of enig ander rij-, voer- of vaartuig, dat bij de
      krijgsmacht in gebruik is, onder zodanige invloed van het gebruik van alcoholhoudende drank, dat hij niet in staat
      moet worden geacht zijn taak, als zodanig, naar behoren te vervullen, wordt gestraft met gevangenisstraf van ten
      hoogste zes maanden of geldboete van de derde categorie.
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel164
  - number: '165'
    text: |-
      Voor de toepassing van de [artikelen 163][ref1] en [164][ref2] wordt met alcoholhoudende drank gelijkgesteld elke
      stof, waarvan de bestuurder weet of redelijkerwijze moet weten, dat het gebruik de rijvaardigheid kan verminderen.


      [ref1]: https://wetten.overheid.nl/BWBR0001869#Artikel163
      [ref2]: https://wetten.overheid.nl/BWBR0001869#Artikel164
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel165
    references:
      - id: ref1
        bwb_id: BWBR0001869
        artikel: '163'
      - id: ref2
        bwb_id: BWBR0001869
        artikel: '164'
  - number: '166'
    text: |-
      Hij die opzettelijk wederrechtelijk enig motorrijtuig, vaartuig of luchtvaartuig gebruikt, dat bij de krijgsmacht
      in gebruik is, wordt gestraft met gevangenisstraf van ten hoogste zes maanden of geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel166
  - number: '167'
    text: |-
      Hij die zich op een voor het openbaar of militair verkeer openstaande weg dan wel op een voor de openbare of
      militaire scheepvaart openstaand water zodanig gedraagt, dat de vrijheid van het verkeer dan wel van de scheepvaart
      zonder noodzaak wordt belemmerd, of de veiligheid op de weg of op het water in gevaar wordt gebracht of dat
      redelijkerwijze is aan te nemen dat dit het geval kan zijn, wordt gestraft met hechtenis van ten hoogste drie
      maanden of geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel167
  - number: '168'
    text: |-
      Hij die zich als lid van de bemanning van een luchtvaartuig zodanig gedraagt, dat de vrijheid van het verkeer
      zonder noodzaak wordt belemmerd of de veiligheid in het luchtruim dan wel op de grond of op het water in gevaar
      wordt gebracht of dat redelijkerwijze is aan te nemen, dat dit het geval kan zijn, wordt gestraft met hechtenis van
      ten hoogste zes maanden of geldboete van de derde categorie.
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel168
  - number: '169'
    text: |-
      Hij die als gebruiker van een voor het openbaar of militair verkeer openstaande weg of als gebruiker van een voor
      de openbare of militaire scheepvaart openstaand water, dan wel als bestuurder van een motorrijtuig, een rijwiel,
      enig ander rij- of voertuig, een vaartuig of een luchtvaartuig, dat bij de krijgsmacht in gebruik is, de door of
      vanwege het bevoegd gezag met betrekking tot het verkeer of de scheepvaart gegeven regels en aanwijzingen niet in
      acht neemt, wordt gestraft met hechtenis van ten hoogste vier maanden of geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel169
  - number: '170'
    text: |-
      1 Hij die buiten het Koninkrijk een feit begaat, dat niet met straf wordt bedreigd door enige ingevolge dit wetboek
      toepasselijke strafbepaling, doch waarvoor hij ingevolge enige op hem toepasselijke wet van het land, waar het feit
      begaan wordt, strafbaar is, wordt gestraft met hetzij hechtenis van ten hoogste zes maanden en geldboete van de
      derde categorie, hetzij één van deze straffen. De opgelegde hechtenis mag in duur het maximum van de tegen het feit
      in de buitenlandse wet bedreigde vrijheidsstraf niet overtreffen. De opgelegde geldboete mag evenmin het maximum
      van de in de buitenlandse wet tegen het feit bedreigde geldboete te boven gaan.

      2 De vrijheidsstraf en de geldboete mogen slechts gezamenlijk worden opgelegd, indien dit ook bij toepassing van de
      buitenlandse wet mogelijk ware geweest.
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel170
