        bwb_id: BWBR0001869
        artikel: 71b
      - id: ref5
        bwb_id: BWBR0001869
        artikel: '72'
  - number: 71b
    text: |-
      Voor de toepassing van de [artikelen 122][ref1], [123][ref2], [142][ref3], [156][ref4] en [159-162][ref5] wordt
      tijd van oorlog mede aanwezig geacht indien de in die artikelen omschreven feiten worden begaan aan boord van
      een oorlogsvaartuig of luchtvaartuig van de krijgsmacht dat zich ergens bevindt waar geen onmiddellijke hulp te
      verkrijgen is.


      [ref1]: https://wetten.overheid.nl/BWBR0001869#Artikel122
      [ref2]: https://wetten.overheid.nl/BWBR0001869#Artikel123
      [ref3]: https://wetten.overheid.nl/BWBR0001869#Artikel142
      [ref4]: https://wetten.overheid.nl/BWBR0001869#Artikel156
      [ref5]: https://wetten.overheid.nl/BWBR0001869#Artikel159
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel71b
    references:
      - id: ref1
        bwb_id: BWBR0001869
        artikel: '122'
      - id: ref2
        bwb_id: BWBR0001869
