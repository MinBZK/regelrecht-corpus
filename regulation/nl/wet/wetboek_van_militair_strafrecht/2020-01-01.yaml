preamble:
  text: |-
    Wij WILHELMINA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of hooren lezen, saluut! doen te weten:

    Alzoo Wij in overweging genomen hebben, dat het noodzakelijk is een nieuw Wetboek van Militair Strafrecht vast
    te stellen;

    Zoo is het, dat Wij, den Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze, vast te stellen de volgende bepalingen, welke zullen uitmaken
    het WETBOEK VAN MILITAIR STRAFRECHT.
  url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Bij de toepassing van dit wetboek gelden de bepalingen van het gemene strafrecht, daaronder begrepen de
      [negende titel van het eerste boek van het Wetboek van Strafrecht](onbekend), behoudens de afwijkingen bij de wet
      vastgesteld.

      2 In dit wetboek wordt verstaan onder:

        - *Wetboek van Strafrecht:* het [Wetboek van Strafrecht][ref1] van het Europese deel van Nederland.
        - *Wetboek van Strafvordering:* het [Wetboek van Strafvordering][ref2] van het Europese deel van Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0001854
      [ref2]: https://wetten.overheid.nl/BWBR0001903
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001854
      - id: ref2
        bwb_id: BWBR0001903
  - number: '2'
    text: |-
      Op de niet in dit wetboek omschreven strafbare feiten, begaan door in
      [artikel 2 van de Wet militaire strafrechtspraak][ref1] genoemde personen, is het gemene strafrecht toepasselijk,
      behoudens de afwijkingen bij de wet vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004789#Artikel2
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0004789
        artikel: '2'
  - number: '3'
    text: |-
      De in het [Wetboek van Strafrecht][ref1] voorkomende bepalingen betreffende feiten, begaan aan boord van of met
      betrekking tot een Nederlands schip, zijn ook toepasselijk op die feiten, begaan aan boord van of met betrekking
      tot een vaartuig der krijgsmacht, tenzij de inhoud dier bepalingen deze toepasselijkheid uitsluit of het feit valt
      onder een zwaardere strafbepaling.


      [ref1]: https://wetten.overheid.nl/BWBR0001854
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0001854
  - number: '4'
    text: |-
      De Nederlandse strafwet is toepasselijk op de militair, die zich buiten Nederland aan enig strafbaar feit schuldig
      maakt.
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel4
  - number: '5'
    text: |-
      De Nederlandse strafwet is toepasselijk op ieder die zich, in tijd van oorlog, buiten Nederland schuldig maakt
      aan een strafbaar feit, waarvan onder die omstandigheden de kennisneming behoort aan de gerechten bedoeld in de
      [Wet militaire strafrechtspraak][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004789
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0004789
  - number: 5a
    text: |-
      1 Op feiten door in [artikel 2 van de Wet militaire strafrechtspraak][ref1] genoemde personen begaan in of met
      betrekking tot Aruba, Curaçao of Sint Maarten of in of met betrekking tot de openbare lichamen Bonaire, Sint
      Eustatius en Saba, is het aldaar geldende strafrecht toepasselijk, indien de Nederlandse strafwet tegen zodanige
      feiten geen straf bedreigt.

      2 Indien het strafrecht van een der in het vorige lid genoemde Rijksdelen wordt toegepast, kunnen tevens worden
      toegepast de bepalingen van de Nederlandse strafwet, die betrekking hebben op de voorwaardelijke veroordeling en op
      de terbeschikkingstelling wegens psychische stoornis of verstandelijke beperking.


      [ref1]: https://wetten.overheid.nl/BWBR0004789#Artikel2
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0004789
        artikel: '2'
  - number: 5b
    text: |-
      Indien de Nederlandse strafwet op feiten door in [artikel 2 van de Wet militaire strafrechtspraak][ref1] genoemde
      personen begaan in of met betrekking tot Aruba, Curaçao of Sint Maarten of in of met betrekking tot de openbare
      lichamen Bonaire, Sint Eustatius of Saba, een lagere vrijheidsstraf of geldboete stelt dan de strafwet van
      Aruba, Curaçao of Sint Maarten of de openbare lichamen Bonaire, Sint Eustatius en Saba, kan een vrijheidsstraf of
      geldboete worden opgelegd van ten hoogste de tijd dan wel het bedrag, gesteld bij laatstbedoelde strafwet.


      [ref1]: https://wetten.overheid.nl/BWBR0004789#Artikel2
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel5b
    references:
      - id: ref1
        bwb_id: BWBR0004789
        artikel: '2'
  - number: '6'
    text: |-
      Onverminderd het bepaalde met betrekking tot de straffen in het gemene strafrecht kan de militair worden opgelegd:

      a. als hoofdstraf: militaire detentie;

      b. als bijkomende straf: ontzegging van bepaalde bevoegdheden.
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel6
  - number: '10'
    text: |-
      Voor de gevangenisstraf en de hechtenis gelden de in het gemene recht daarvoor gegeven regelen met dien verstande
      dat bij algemene maatregel van rijksbestuur voor militairen bijzondere voorschriften met betrekking tot de arbeid,
      de bestemming van de opbrengst van de verplichte arbeid en de geestelijke, culturele en sociale verzorging kunnen
      worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel10
  - number: '11'
    text: |-
      1 Ingeval gevangenisstraf of hechtenis kan worden uitgesproken is de rechter bevoegd in plaats daarvan tot
      militaire detentie te veroordelen.

      2 De duur van de militaire detentie zal de duur van de tegen het feit bedreigde vrijheidsstraf en die van zes
      maanden niet mogen overschrijden.

      3 [Artikel 27 van het Wetboek van Strafrecht][ref1] is bij het opleggen van militaire detentie van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel27
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '27'
  - number: '12'
    text: |-
      1 Militaire detentie wordt als regel in algehele of beperkte gemeenschap ondergaan. De straf wordt ten uitvoer
      gelegd in een inrichting als bedoeld in [artikel 1, onder b, van de Penitentiaire beginselenwet][ref1].

      2 Voor militairen die in een penitentiaire inrichting een vrijheidsstraf ondergaan, kunnen bij of krachtens
      algemene maatregel van bestuur en in afwijking van de bij of krachtens de [Penitentiaire beginselenwet][ref2]
      gestelde regels bijzondere voorschriften worden vastgesteld met betrekking tot:

      a. de indeling en het beheer van en het regime in de desbetreffende inrichtingen;

      b. de arbeid en de bestemming van de opbrengst van de verplichte arbeid;

      c. de geestelijke, culturele en sociale verzorging; en

      d. de tucht.


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0009709
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0009709
  - number: '14'
    text: |-
      Voor de toepassing van de bepalingen, die betrekking hebben op de voorwaardelijke veroordeling, wordt de militaire
      detentie als gevangenisstraf beschouwd.
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel14
  - number: '15'
    text: |-
      Een opdracht tot het verlenen van bijstand aan een voorwaardelijk veroordeelde kan aan elke instelling, houder van
      een inrichting of bijzondere ambtenaar, die daarmede in een der rijksdelen belast is, worden gegeven.
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel15
  - number: '21'
    text: |-
      1 Veroordelingen tot vrijheidsstraffen, vervangende hechtenis daaronder begrepen, kunnen, in de gevallen en op
      de wijze bij algemene maatregel van rijksbestuur te bepalen, geheel of gedeeltelijk ten uitvoer worden gelegd in
      inrichtingen in Aruba, Curaçao of Sint Maarten of in de openbare lichamen Bonaire, Sint Eustatius en Saba.

      2 Veroordelingen tot gevangenisstraf, militaire detentie of hechtenis, vervangende hechtenis daaronder begrepen,
      kunnen, indien de gelegenheid ontbreekt om gebruik te maken van een daartoe bestemde inrichting of een daartoe
      bestemd gebouw, in de gevallen en op de wijze bij algemene maatregel van rijksbestuur te bepalen, geheel of
      gedeeltelijk ten uitvoer worden gelegd hetzij in een inrichting buiten het Koninkrijk, hetzij op een andere plaats
      geschikt tot het ondergaan van straf.
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel21
  - number: '35'
    text: |-
      1 Ontzetting van de rechten, vermeld in
      [artikel 28, eerste lid, onder 1° en 2°, van het Wetboek van Strafrecht][ref1], kan worden uitgesproken bij
      veroordeling wegens enig opzettelijk gepleegd misdrijf, in dit wetboek omschreven.

      2 Ontzetting van het recht, vermeld in [artikel 28, eerste lid, onder 3°, van het Wetboek van Strafrecht][ref2],
      kan worden uitgesproken bij veroordeling tot gevangenisstraf van tenminste een jaar wegens het plegen van een
      misdrijf als omschreven in het [Tweede Boek, Titel I, van dit wetboek][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0001869#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0001869
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0001869
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '28'
      - id: ref3
        bwb_id: BWBR0001869
  - number: 35a
    text: |-
      Indien een persoon genoemd in [artikel 2 van de Wet militaire strafrechtspraak][ref1] naar
      aanleiding van een strafbaar feit begaan in of met betrekking tot Aruba, Curaçao en Sint Maarten of
      de openbare lichamen Bonaire, Sint Eustatius en Saba, is ontzet uit een van de rechten vermeld in
      [artikel 28, eerste lid, onderdelen 1° tot en met 5°, van het Wetboek van Strafrecht][ref2], heeft deze
      ontzetting ook betrekking op de uitoefening van die rechten in de betrokken rijksdelen en openbare lichamen.


      [ref1]: https://wetten.overheid.nl/BWBR0004789#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel28
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel35a
    references:
      - id: ref1
        bwb_id: BWBR0004789
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '28'
  - number: 35b
    text: |-
      1 Ingeval tegen de bestuurder van een motorrijtuig proces-verbaal wordt opgemaakt ter zake van overtreding van
      [artikel 163][ref1] of [artikel 164][ref2] van dit wetboek, is [artikel 164 van de Wegenverkeerswet 1994][ref3]
      van overeenkomstige toepassing, met dien verstande dat de in laatstgenoemd artikel omschreven verplichting tot
      overgifte betrekking heeft op elk aan de bestuurder ingevolge enige binnen het Koninkrijk geldende regeling
      afgegeven rijbewijs alsmede op het hem in het buitenland uitgereikt internationaal rijbewijs.

      2 Indien [artikel 164 van de Wegenverkeerswet 1994][ref4] wordt toegepast in een geval dat zich voordoet
      in Aruba, Curaçao of Sint Maarten of in de openbare lichamen Bonaire, Sint Eustatius en Saba, worden onder
      opsporingsambtenaren als bedoeld in dat artikel mede begrepen de militairen die aldaar zijn aangesteld als
      opsporingsambtenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0001869#Artikel163
      [ref2]: https://wetten.overheid.nl/BWBR0001869#Artikel164
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel164
      [ref4]: https://wetten.overheid.nl/BWBR0006622#Artikel164
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel35b
    references:
      - id: ref1
        bwb_id: BWBR0001869
        artikel: '163'
      - id: ref2
        bwb_id: BWBR0001869
        artikel: '164'
      - id: ref3
        bwb_id: BWBR0006622
        artikel: '164'
      - id: ref4
        bwb_id: BWBR0006622
        artikel: '164'
  - number: '36'
    text: |-
      1 Bij veroordeling van de bestuurder van een motorrijtuig wegens overtreding van [artikel 163][ref1], [164][ref2],
      [167][ref3] of [169][ref4] kan hem de bevoegdheid motorrijtuigen te besturen voor de duur van ten hoogste vijf
      jaren worden ontzegd.

      2 Voor de toepassing van het eerste lid wordt een strafbeschikking als bedoeld in
      [Titel IVA van het Tweede Boek van het Wetboek van Strafvordering][ref5] met een veroordeling gelijkgesteld.

      3 [Artikel 179, vierde en zesde lid, van de Wegenverkeerswet 1994][ref6] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001869#Artikel163
      [ref2]: https://wetten.overheid.nl/BWBR0001869#Artikel164
      [ref3]: https://wetten.overheid.nl/BWBR0001869#Artikel167
      [ref4]: https://wetten.overheid.nl/BWBR0001869#Artikel169
      [ref5]: https://wetten.overheid.nl/BWBR0001903
      [ref6]: https://wetten.overheid.nl/BWBR0006622#Artikel179
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0001869
        artikel: '163'
      - id: ref2
        bwb_id: BWBR0001869
        artikel: '164'
      - id: ref3
        bwb_id: BWBR0001869
        artikel: '167'
      - id: ref4
        bwb_id: BWBR0001869
        artikel: '169'
      - id: ref5
        bwb_id: BWBR0001903
      - id: ref6
        bwb_id: BWBR0006622
        artikel: '179'
  - number: 36a
    text: |-
      Bij veroordeling van een lid van de bemanning van een luchtvaartuig wegens overtreding van [artikel 168][ref1] en
      [artikel 169][ref2] kan aan hem de bevoegdheid de luchtvaart uit te oefenen voor ten hoogste zes maanden worden
      ontzegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001869#Artikel168
      [ref2]: https://wetten.overheid.nl/BWBR0001869#Artikel169
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel36a
    references:
      - id: ref1
        bwb_id: BWBR0001869
        artikel: '168'
      - id: ref2
        bwb_id: BWBR0001869
        artikel: '169'
  - number: 36b
    text: |-
      Bij algemene maatregel van rijksbestuur kunnen regels worden gesteld met betrekking tot het tijdstip van ingang van
      de bijkomende straffen, bedoeld in de [artikelen 36][ref1] en [36a][ref2], en de daaraan verbonden administratieve
      gevolgen.


      [ref1]: https://wetten.overheid.nl/BWBR0001869#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0001869#Artikel36a
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel36b
    references:
      - id: ref1
        bwb_id: BWBR0001869
        artikel: '36'
      - id: ref2
        bwb_id: BWBR0001869
        artikel: 36a
  - number: '38'
    text: |-
      1 Niet strafbaar is hij die in tijd van oorlog binnen de grenzen zijner bevoegdheid een naar de regelen van het
      oorlogsrecht geoorloofd feit begaat, of wiens bestraffing strijdig zou zijn met een verdrag, geldende tussen
      Nederland en de mogendheid waarmede Nederland in oorlog is, of met enig voorschrift, ingevolge zodanig verdrag
      vastgesteld.

      2 Niet strafbaar is de militair die geweld gebruikt in de rechtmatige uitoefening van zijn taak en in
      overeenstemming met de regels die voor de uitoefening van die taak zijn vastgesteld.
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel38
  - number: 44a
    text: |-
      De verpleging van personen die krachtens uitspraak van een van de gerechten bedoeld in de
      [Wet militaire strafrechtspraak][ref1] ter beschikking zijn gesteld, kan in de gevallen en op de wijze bij algemene
      maatregel van rijksbestuur te bepalen geschieden in Aruba, Curaçao of Sint Maarten of in de openbare lichamen
      Bonaire, Sint Eustatius en Saba.


      [ref1]: https://wetten.overheid.nl/BWBR0004789
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel44a
    references:
      - id: ref1
        bwb_id: BWBR0004789
  - number: '46'
    text: |-
      Indien een militair door het begaan van een misdrijf waarop hechtenis is gesteld, een dienstplicht schendt, wordt
      hij, onverminderd de toepassing van [artikel 44 van het Wetboek van Strafrecht][ref1], gestraft met gevangenisstraf
      van ten hoogste de duur der op dat misdrijf gestelde hechtenis.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel44
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '44'
  - number: '48'
    text: |-
      Ten aanzien van een militair die opzettelijk met een militair van mindere rang of stand aan enig opzettelijk
      gepleegd misdrijf deelneemt, wordt het maximum van de daarop gestelde tijdelijke gevangenisstraf met de helft
      verhoogd.
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel48
  - number: '54'
    text: |-
      Indien een der misdrijven, omschreven in de [artikelen 245][ref1], [248a][ref2] en
      [281 van het Wetboek van Strafrecht][ref3], gepleegd is in tijd van oorlog, door een persoon, genoemd in
      [artikel 2 van de Wet militaire strafrechtspraak][ref4], kan de vervolging ambtshalve plaatshebben.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel245
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel248a
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel281
      [ref4]: https://wetten.overheid.nl/BWBR0004789#Artikel2
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '245'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: 248a
      - id: ref3
        bwb_id: BWBR0001854
        artikel: '281'
      - id: ref4
        bwb_id: BWBR0004789
        artikel: '2'
  - number: '56'
    text: |-
      Het recht tot strafvordering ter zake van de misdrijven omschreven in de [artikelen 100][ref1], [109][ref2] en
      [110][ref3], vervalt door verjaring in twaalf jaren.


      [ref1]: https://wetten.overheid.nl/BWBR0001869#Artikel100
      [ref2]: https://wetten.overheid.nl/BWBR0001869#Artikel109
      [ref3]: https://wetten.overheid.nl/BWBR0001869#Artikel110
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0001869
        artikel: '100'
      - id: ref2
        bwb_id: BWBR0001869
        artikel: '109'
      - id: ref3
        bwb_id: BWBR0001869
        artikel: '110'
  - number: '57'
    text: |-
      1 Ten aanzien van een persoon die ten tijde van het begaan van het misdrijf de leeftijd van achttien jaren nog
      niet heeft bereikt, wordt de in [artikel 56][ref1] vermelde verjaringstermijn tot de helft van de daar bedoelde
      duur ingekort.

      2 Ten aanzien van zodanige persoon is de termijn der verjaring van het recht tot uitvoering der straf, opgelegd
      wegens een misdrijf als bedoeld bij [artikel 56][ref2], een derde langer dan de bij het voorgaande lid bepaalde
      termijn der verjaring van het recht tot strafvordering wegens dat misdrijf.


      [ref1]: https://wetten.overheid.nl/BWBR0001869#Artikel56
      [ref2]: https://wetten.overheid.nl/BWBR0001869#Artikel56
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0001869
        artikel: '56'
      - id: ref2
        bwb_id: BWBR0001869
        artikel: '56'
  - number: '58'
    text: |-
      De termijn van verjaring van het recht tot strafvordering ter zake van ongeoorloofde afwezigheid, van desertie
      en van de misdrijven omschreven in de [artikelen 109][ref1] en [110][ref2], vangt aan met de dag na die waarop de
      afwezigheid is aangevangen.


      [ref1]: https://wetten.overheid.nl/BWBR0001869#Artikel109
      [ref2]: https://wetten.overheid.nl/BWBR0001869#Artikel110
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0001869
        artikel: '109'
      - id: ref2
        bwb_id: BWBR0001869
        artikel: '110'
  - number: '59'
    text: |-
      1 De krachtens [artikel 59 van de Wet militaire strafrechtspraak][ref1] aangewezen bevelvoerende
      militairen kunnen buiten het Koninkrijk of binnen de territoriale zee, onder omstandigheden en in
      zaken bij algemene maatregel van rijksbestuur vast te stellen, een strafbeschikking als bedoeld in
      [Titel IVA van het Tweede Boek van het Wetboek van Strafvordering][ref2] uitvaardigen.

      2 Bij algemene maatregel van Rijksbestuur worden voorschriften gegeven met betrekking tot de wijze waarop de in het
      voorgaande lid bedoelde bevoegdheid wordt uitgeoefend.

      3 De bevelvoerende militairen bekleed met de bevoegdheid, bedoeld in het eerste lid, maken hiervan gebruik volgens
      richtlijnen, vast te stellen door het College van procureurs-generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0004789#Artikel59
      [ref2]: https://wetten.overheid.nl/BWBR0001903
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0004789
        artikel: '59'
      - id: ref2
        bwb_id: BWBR0001903
  - number: '60'
    text: |-
      Onder militairen worden verstaan:

      1°. zij wier vrijwillig dienstverband bij de krijgsmacht tot doorlopende werkelijke dienst verplicht, tijdens de
      gehele duur van dat dienstverband;

      2°. alle andere vrijwilligers bij de krijgsmacht en de dienstplichtigen, zo vaak en zolang zij in werkelijke dienst
      zijn, alsmede wanneer zij buiten werkelijke dienst in het tijdvak gedurende hetwelk zij voor die dienst kunnen
      worden opgeroepen, een der feiten plegen omschreven in de [artikelen 109][ref1] en [110 van dit wetboek][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001869#Artikel109
      [ref2]: https://wetten.overheid.nl/BWBR0001869#Artikel110
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0001869
        artikel: '109'
      - id: ref2
        bwb_id: BWBR0001869
        artikel: '110'
  - number: 60a
    text: |-
      Bij algemene maatregel van rijksbestuur kan worden bepaald dat vreemde militairen en een vreemde krijgsmacht voor
      de toepassing van daarbij aan te wijzen wettelijke bepalingen worden gelijkgesteld met Nederlandse militairen dan
      wel de Nederlandse krijgsmacht.
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel60a
  - number: '61'
    text: |-
      Hij die feitelijk dient bij de krijgsmacht, wordt van rechtswege als militair aangemerkt, tenzij aannemelijk wordt
      gemaakt, dat hij niet onder een der bepalingen van [artikel 60][ref1] valt.


      [ref1]: https://wetten.overheid.nl/BWBR0001869#Artikel60
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0001869
        artikel: '60'
  - number: '62'
    text: |-
      De in [artikel 60, onder 2°][ref1], bedoelde vrijwilliger bij de krijgsmacht of de dienstplichtige wordt geacht in
      werkelijke dienst te zijn:

      1°. zodra hij, voor de werkelijke dienst opgeroepen of vrijwillig in werkelijke dienst komende, op de plaats van
      zijn bestemming is aangekomen, zodra hij zich voor deze dienst heeft aangemeld of zodra hij voor deze dienst is
      overgenomen, een en ander totdat hij met groot verlof vertrekt;

      2°. zolang hij deelneemt aan militaire oefening of militair onderricht, dan wel enige andere militaire werkzaamheid
      verricht;

      3°. zolang hij als vrijwilliger of dienstplichtige of als verdachte in een militaire strafzaak bij enig onderzoek
      tegenwoordig is;

      4°. zolang hij uniformkleding of het voor hem vastgestelde kenteken of onderscheidingsteken draagt;

      5°. zolang hij in een militaire inrichting of aan boord van een vaartuig der krijgsmacht straf ondergaat.


      [ref1]: https://wetten.overheid.nl/BWBR0001869#Artikel60
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0001869
        artikel: '60'
  - number: '63'
    text: |-
      Onder militairen worden mede begrepen de tot enige militaire dienst gebruikt wordende gewezen militairen, in welk
      geval zij worden geacht de laatstelijk door hen beklede rang of de hogere, die hun bij of na het verlaten van de
      militaire dienst is toegekend, te bekleden.
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel63
  - number: '65'
    text: |-
      1 Krijgsgevangenen en geïnterneerde personen die ingevolge artikel 4, onder B, van het Verdrag van Genève
      betreffende de behandeling van krijgsgevangenen, van 12 augustus 1949 als krijgsgevangenen moeten worden
      behandeld, daaronder begrepen degenen die onder belofte of voorwaarde zijn vrijgelaten, worden, met inachtneming
      van de door hen beklede rang, gelijkgesteld met Nederlandse militairen ten aanzien van door hen begane strafbare
      feiten, waartegen is voorzien bij het gemene recht, bij [artikel 80][ref1] of bij de [titels IV-VI][ref2]
      en [VIII-XI van het tweede boek van dit wetboek][ref3], met uitzondering van de [artikelen 159-162][ref4].
      Geïnterneerde vreemde militairen die krachtens beschikking van het bevoegd Nederlands gezag andere vreemde
      militairen onder hun bevelen hebben, worden ten aanzien van hun verhouding tot die andere personen, met
      inachtneming van de door hen beklede rang gelijkgesteld met Nederlandse militairen.

      2 Zij worden geacht tot dat deel van de krijgsmacht te behoren, onder welks bewaring zij zich bevinden.


      [ref1]: https://wetten.overheid.nl/BWBR0001869#Artikel80
      [ref2]: https://wetten.overheid.nl/BWBR0001869
      [ref3]: https://wetten.overheid.nl/BWBR0001869
      [ref4]: https://wetten.overheid.nl/BWBR0001869#Artikel159
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0001869
        artikel: '80'
      - id: ref2
        bwb_id: BWBR0001869
      - id: ref3
        bwb_id: BWBR0001869
      - id: ref4
        bwb_id: BWBR0001869
        artikel: '159'
  - number: '66'
    text: |-
      In de uitdrukking "hij die ....", gebezigd in de omschrijving van een strafbaar feit wordt onder het woord "hij"
      verstaan ieder persoon genoemd in [artikel 2 van de Wet militaire strafrechtspraak][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004789#Artikel2
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0004789
        artikel: '2'
  - number: '67'
    text: |-
      De verhouding van meerdere tot mindere bestaat tussen militairen:

      1°. krachtens hogere militaire rang of stand;

      2°. bij gelijkheid van rang of stand, krachtens meerdere ouderdom daarin, doch alleen in betrekking tot
      dienstaangelegenheden;

      3°. onafhankelijk van hun rang of stand, wanneer en voor zover de ene, hetzij krachtens zijn betrekking als
      bevelvoerend militair, hetzij krachtens beschikking van het bevoegd gezag, de andere onder zijn bevelen heeft.
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel67
  - number: 67a
    text: |-
      Ten aanzien van vreemde militairen kan een gelijkstelling van vreemde militaire rangen met Nederlandse plaatsvinden
      bij of krachtens algemene maatregel van rijksbestuur.
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel67a
  - number: '69'
    text: |-
      Onder schildwacht wordt verstaan iedere militair, die met een door Onze Minister van Defensie vast te stellen
      wapen uitgerust of van een door Onze Minister van Defensie vast te stellen kenteken voorzien, op post of uitkijk
      is gesteld.
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel69
  - number: '70'
    text: |-
      Onder oorlogsvaartuig wordt verstaan elk ten behoeve der zeemacht gebezigd vaartuig, waarover een militair der
      zeemacht het bevel voert.
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel70
  - number: '71'
    text: |-
      In dit wetboek wordt onder oorlog mede verstaan: een gewapend conflict dat niet als oorlog kan worden aangemerkt en
      waarbij het Koninkrijk is betrokken, hetzij ter individuele of collectieve zelfverdediging, hetzij tot herstel van
      internationale vrede en veiligheid.
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel71
  - number: 71a
    text: |-
      1 Voor de toepassing van de [titels III-X][ref1] en de [artikelen 156][ref2] en [159-162 van het tweede boek][ref3]
      zal de rechter, onverminderd het bepaalde in de [artikelen 71b][ref4] en [72][ref5], de aanwezigheid van tijd van
      oorlog slechts aannemen, hetzij onder feitelijke oorlogsomstandigheden, hetzij indien bij koninklijk besluit is
      bepaald dat een oorlog dreigende is.

      2 Het in het eerste lid bedoelde besluit kan betrekking hebben op de gehele krijgsmacht of op een deel daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0001869
      [ref2]: https://wetten.overheid.nl/BWBR0001869#Artikel156
      [ref3]: https://wetten.overheid.nl/BWBR0001869#Artikel159
      [ref4]: https://wetten.overheid.nl/BWBR0001869#Artikel71b
      [ref5]: https://wetten.overheid.nl/BWBR0001869#Artikel72
    url: https://wetten.overheid.nl/BWBR0001869/2020-01-01#Artikel71a
    references:
      - id: ref1
        bwb_id: BWBR0001869
      - id: ref2
        bwb_id: BWBR0001869
