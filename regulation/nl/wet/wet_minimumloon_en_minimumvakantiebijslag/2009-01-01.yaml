    text: |-
      een verordening als bedoeld in [artikel 16, derde lid][ref1], of
      [86, derde lid, van de Wet op de Bedrijfsorganisatie][ref2] (*Stb.* 1950, K 22);


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0002058#Artikel86
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel1
    references:
