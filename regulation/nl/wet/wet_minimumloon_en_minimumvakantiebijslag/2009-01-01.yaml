        bwb_id: BWBR0002058
        artikel: '16'
      - id: ref2
        bwb_id: BWBR0002058
        artikel: '86'
  - number: 1.1.b.3°
    text: |-
      een verordening als bedoeld in [artikel 93, tweede lid, onder d, van de Wet op de Bedrijfsorganisatie][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel93
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002058
        artikel: '93'
  - number: 1.1.c
    text: |-
      beboetbaar feit: een handelen of nalaten waardoor het bij of krachtens deze wet bepaalde niet wordt nageleefd en
      terzake waarvan een boete kan worden opgelegd;
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel1
  - number: 1.1.d
    text: |-
      boete: de bestuurlijke sanctie die bestaat uit de onvoorwaardelijke verplichting tot het betalen van een bepaalde
      geldsom aan de Staat.
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel1
  - number: '1.2'
    text: |-
      Voor de toepassing van het bij of krachtens deze wet bepaalde worden onder collectieve
      arbeidsovereenkomst mede verstaan bepalingen van een collectieve arbeidsovereenkomst, welke krachtens
      __REF000___________________________________________________________________________________________________________
      _______________________ (*Stb.* 1937, 801) algemeen verbindend zijn verklaard.


      [ref1]: https://wetten.overheid.nl/BWBR0001987#Artikel2
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001987
        artikel: '2'
  - number: '2.1'
    text: |-
      Voor de toepassing van het bij of krachtens deze wet bepaalde wordt onder dienstbetrekking verstaan de
      dienstbetrekking krachtens arbeidsovereenkomst naar burgerlijk recht.
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel2
  - number: '2.2'
    text: |-
      Onder dienstbetrekking wordt mede verstaan de arbeidsverhouding van degene, die krachtens overeenkomst met een
      ander tegen beloning geregeld bemiddeling verleent bij het tot stand komen van overeenkomsten van die ander - of
      een opdrachtgever van deze - met derden, mits hij de bedoelde bemiddeling uitsluitend voor die ander verleent, het
      verlenen van die bemiddeling niet een voor hem bijkomstige werkzaamheid is en hij zich daarbij doorgaans niet door
      meer dan twee andere personen laat bijstaan.
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel2
  - number: '2.3'
    text: |-
      Onder dienstbetrekking wordt niet verstaan de arbeidsverhouding van degene, die door of vanwege het Rijk of
      het bevoegde gezag van een provincie, gemeente, waterschap, veenschap en veenpolder op arbeidsovereenkomst
      naar burgerlijk recht in dienst is genomen, met uitzondering van de dienstbetrekking, bedoeld in de
      [Wet inschakeling werkzoekenden][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009083
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0009083
  - number: '3.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regelen worden gesteld, ingevolge welke de arbeidsverhouding
      van degene, die tegen beloning persoonlijk arbeid verricht, die niet een voor hem bijkomstige werkzaamheid is, en
      wiens arbeidsverhouding niet reeds ingevolge de voorgaande bepalingen als dienstbetrekking wordt beschouwd, doch
      hiermede maatschappelijk gelijk kan worden gesteld, eveneens onder dienstbetrekking wordt verstaan.
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel3
  - number: '3.2'
    text: |-
      Indien hiertoe naar Ons oordeel in verband met de bijzondere aard van de arbeidsverhouding dan wel in verband
      met bijzondere omstandigheden aanleiding bestaat, kan bij algemene maatregel van bestuur worden bepaald, dat de
      arbeidsverhouding van tot een daarbij aangewezen categorie behorende personen niet onder dienstbetrekking wordt
      verstaan.
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel3
  - number: '4.1'
    text: |-
      Voor de toepassing van het bij of krachtens deze wet bepaalde wordt onder werknemer verstaan de natuurlijke
      persoon, die in dienstbetrekking staat.
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel4
  - number: '4.2'
    text: |-
      Wie zijn dienstbetrekking niet binnen het Rijk vervult, wordt slechts als werknemer beschouwd, indien hij binnen
      het Rijk woont en zijn werkgever eveneens binnen het Rijk woont of gevestigd is. Voor zover een werkgever binnen
      het Rijk een vaste inrichting voor de uitoefening van zijn bedrijf of beroep of een binnen het Rijk wonende of
      gevestigde vaste vertegenwoordiger heeft, wordt hij voor de toepassing van de vorige volzin gelijkgesteld met een
      binnen het Rijk gevestigde werkgever. Wie als werknemer als bedoeld in de [Wet arbeid mijnbouw Noordzee][ref1] zijn
      dienstbetrekking vervult, wordt in elk geval als werknemer beschouwd.


      [ref1]: https://wetten.overheid.nl/BWBR0005703
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005703
  - number: '4.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan worden bepaald, dat personen, die niet binnen het Rijk wonen,
      ook als werknemer worden beschouwd, voor zover zij hun dienstbetrekking buiten het Rijk vervullen.
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel4
  - number: '4.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan van het bepaalde in het eerste en het tweede lid worden
      afgeweken ten aanzien van personen, die slechts tijdelijk binnen het Rijk wonen of tijdelijk binnen het Rijk
      werkzaam zijn.
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel4
  - number: '4.5'
    text: |-
      Voor de toepassing van de vorige leden worden schepen en luchtvaartuigen, welke binnen het Rijk hun thuishaven
      hebben, ten opzichte van de werkgever en de bemanning beschouwd als deel van het Rijk.
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel4
  - number: '5.1'
    text: |-
      Voor de toepassing van het bij of krachtens deze wet bepaalde wordt onder werkgever verstaan de persoon, tot wie
      een werknemer in dienstbetrekking staat.
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel5
  - number: '5.2'
    text: |-
      In het geval, bedoeld in [artikel 2, tweede lid][ref1], wordt onder werkgever verstaan de persoon, met wie de
      overeenkomst tot het verlenen van bemiddeling is gesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel2
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '2'
        hoofdstuk: I
  - number: '5.3'
    text: |-
      Ingeval toepassing wordt gegeven aan [artikel 3, eerste lid][ref1], wordt tevens bij of krachtens algemene
      maatregel van bestuur bepaald wie in de daarbij betrokken gevallen onder werkgever wordt verstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel3
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '3'
        hoofdstuk: I
  - number: '6.1'
    text: |-
      Voor de toepassing van het bij of krachtens deze wet bepaalde worden onder loon verstaan de geldelijke inkomsten
      uit hoofde van de dienstbetrekking, met uitzondering van:
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel6
  - number: 6.1.a
    text: verdiensten uit overwerk;
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel6
  - number: 6.1.b
    text: vakantiebijslagen;
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel6
  - number: 6.1.c
    text: winstuitkeringen;
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel6
  - number: 6.1.d
    text: uitkeringen bij bijzondere gelegenheden;
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel6
  - number: 6.1.e
    text: |-
      uitkeringen ingevolge aanspraken om na verloop van tijd of onder een voorwaarde één of meer uitkeringen te
      ontvangen;
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel6
  - number: 6.1.f
    text: |-
      vergoedingen voor zover zij geacht kunnen worden te strekken tot bestrijding van noodzakelijke kosten, die de
      werknemer in verband met zijn dienstbetrekking heeft te maken;
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel6
  - number: 6.1.g
    text: bijzondere vergoedingen voor kostwinners en gezinshoofden;
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel6
  - number: 6.1.h
    text: |-
      uitkeringen ingevolge een spaarloonregeling als bedoeld in
      [artikel 32, eerste lid, van de Wet op de loonbelasting 1964][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel32
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '32'
  - number: 6.1.i
    text: eindejaarsuitkeringen;
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel6
  - number: 6.1.j
    text: |-
      een vergoeding als bedoeld in [artikel 46 van de Zorgverzekeringswet][ref1] of een
      werkgeversbijdrage in de premie voor de ziektekostenverzekering van een persoon, bedoeld in
      [artikel 2, tweede lid, onderdeel a, van de Zorgverzekeringswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel2
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '46'
      - id: ref2
        bwb_id: BWBR0018450
        artikel: '2'
  - number: '6.2'
    text: Bij algemene maatregel van bestuur kunnen andere uitzonderingen dan de in het eerste lid genoemde worden gesteld.
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel6
  - number: '6.3'
    text: |-
      Onze Minister kan regelen stellen naar welke wordt beoordeeld welke inkomsten moeten worden aangemerkt als
      uitkeringen of vergoedingen als bedoeld in het eerste lid, onder *c-i*.
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel6
  - number: '7.1'
    text: |-
      Uit de overeenkomst, waarop een dienstbetrekking berust, heeft de werknemer, die de leeftijd van 23 jaar doch
      niet die van 65 jaar heeft bereikt, voor de arbeid door hem in dien dienstbetrekking verricht, jegens de werkgever
      aanspraak op een loon ten minste tot het bedrag, bij of krachtens de volgende artikelen onder de benaming
      minimumloon vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel7
  - number: '7.2'
    text: |-
      Indien daartoe naar Ons oordeel aanleiding bestaat op grond van de ontwikkeling in collectieve
      arbeidsovereenkomsten ter zake van de leeftijd waarop aanspraak op een loon tenminste tot de in
      [artikel 8, eerste lid][ref1], genoemde bedragen ontstaat, kan bij algemene maatregel van bestuur worden bepaald,
      dat werknemers beneden de leeftijd van 23 jaar, die de leeftijd van 22 jaar dan wel die de leeftijd van 21 jaar
      hebben bereikt, eveneens de in het eerste lid bedoelde aanspraak hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel8
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '8'
        hoofdstuk: II
  - number: '7.3'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald, dat werknemers - dan wel dat werknemers, behorende tot een
      bij de maatregel aangewezen categorie - beneden de leeftijd van 23 jaar of, zo toepassing is gegeven aan het tweede
      lid, beneden de krachtens dat lid bepaalde leeftijd, die een bij de maatregel aangewezen lagere leeftijd hebben
      bereikt, eveneens de in het eerste lid bedoelde aanspraak hebben.
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel7
  - number: '7.4'
    text: |-
      Beloningen, die de werknemer voor arbeid, door hem in de dienstbetrekking verricht, van derden ontvangt, worden,
      voor zover zij deel uitmaken van de arbeidsvoorwaarden, voor de toepassing van het bij of krachtens het eerste,
      tweede of derde lid bepaalde geacht van de werkgever te zijn ontvangen.
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel7
  - number: '7.5'
    text: |-
      Loon waarop de werknemer ingevolge enige wettelijke bepaling uit de overeenkomst, waarop de dienstbetrekking
      berust, recht heeft over een periode, waarin hij geen arbeid verricht, wordt voor de toepassing van het bij
      of krachtens het eerste, tweede of derde lid bepaalde aangemerkt als loon voor de arbeid door hem in die
      dienstbetrekking verricht. Bedragen, waarmede het loon ingevolge die bepaling wordt verminderd, worden voor de
      toepassing van het bij of krachtens het eerste, tweede of derde lid bepaalde geacht van de werkgever te zijn
      ontvangen.
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel7
  - number: '8.1'
    text: 'Het minimumloon bedraagt over elke uitbetalingstermijn van:'
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel8
  - number: 8.1.a
    text: 'een maand of een veelvoud van een maand: € 1264,80 , onderscheidenlijk een gelijk veelvoud hiervan;'
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel8
  - number: 8.1.b
    text: 'een week of een veelvoud van een week: € 291,90 , onderscheidenlijk een gelijk veelvoud hiervan;'
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel8
  - number: 8.1.c
    text: |-
      een andere tijdsduur: € 58,38  vermenigvuldigd met het aantal van de in die termijn begrepen werkdagen. Onder
      werkdag wordt verstaan een dag, waarop de werknemer arbeid heeft verricht of waarover hij recht op loon heeft als
      bedoeld in [artikel 7, vijfde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel7
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '7'
        hoofdstuk: II
  - number: '8.2'
    text: |-
      Waar in deze wet wordt verwezen naar de in het vorige lid genoemde bedragen, worden als zodanig, indien toepassing
      is gegeven aan [artikel 14][ref1], de daarbij laatstelijk in hun plaats gestelde bedragen aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel14
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '14'
        hoofdstuk: II
  - number: '8.3'
    text: |-
      In afwijking van het eerste lid bedraagt het minimumloon voor werknemers aan wie de in
      [artikel 7, eerste lid][ref1], bedoelde aanspraak is toegekend bij een algemene maatregel van bestuur als bedoeld
      in het derde lid van dat artikel, een bij die maatregel vast te stellen percentage van de in het eerste lid van
      het onderhavige artikel genoemde bedragen. Dit percentage kan voor naar leeftijd en tak van bedrijf of beroep te
      onderscheiden categorieën van deze werknemers verschillend zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel7
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '7'
        hoofdstuk: II
  - number: '9'
    text: |-
      De uitbetaling van het loon aan werknemers, wier dienstbetrekking niet op een arbeidsovereenkomst berust,
      geschiedt, voor wat het bedrag van het minimumloon betreft, telkens na een kwartaal, tenzij partijen een kortere
      uitbetalingstermijn zijn overeengekomen.
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel9
  - number: '10.1'
    text: |-
      Onze Minister kan op verzoek van een werkgever of van een rechtspersoonlijkheid bezittende organisatie van
      werkgevers of werknemers het minimumloon van tot een door hem aangewezen categorie behorende werknemers in
      een onderneming dan wel een tak van bedrijf of beroep voor een door hem te bepalen termijn op lagere dan de
      krachtens [artikel 8][ref1] geldende bedragen vaststellen, indien naar zijn oordeel het voortbestaan van of
      de omvang der bedrijvigheid in die onderneming dan wel die tak van bedrijf of beroep ernstig wordt bedreigd.
      Aan deze vaststelling kunnen voorwaarden worden verbonden. Op een verzoek wordt niet beslist, zolang niet is
      gebleken, dat de verzoeker met de naar het oordeel van Onze Minister representatieve organisaties van werknemers
      onderscheidenlijk werkgevers ter zake overleg heeft gepleegd.


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel8
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '8'
        hoofdstuk: II
  - number: '10.2'
    text: |-
      Onze Minister kan een besluit van de in het eerste lid bedoelde strekking ten aanzien van tot door hem aangewezen
      categorieën behorende werknemers, die uitsluitend of in hoofdzaak huishoudelijke of persoonlijke diensten
      verrichten in de huishouding van natuurlijke personen, ook ambtshalve nemen.
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel10
  - number: '10.3'
    text: |-
      Een besluit tot toepassing van het eerste of het tweede lid ten aanzien van werknemers in een tak van bedrijf of
      beroep wordt in de *Staatscourant* bekend gemaakt.
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel10
  - number: '11'
    text: |-
      Indien bij publiekrechtelijke regeling of collectieve arbeidsovereenkomst een periode van afrekening, welke
      meerdere uitbetalingstermijnen omvat, is vastgesteld, wordt zodanige periode van afrekening voor de toepassing
      van [artikel 8][ref1] als uitbetalingstermijn beschouwd. Een periode van afrekening kan ten hoogste twaalf maanden
      omvatten.


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel8
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '8'
        hoofdstuk: II
  - number: '12.1'
    text: |-
      Indien werkgever en werknemer een arbeidsduur zijn overeengekomen, welke korter is dan de normale arbeidsduur,
      wordt het bedrag, dat krachtens de[ artikelen 8-11][ref1] voor de werknemer als minimumloon geldt, naar
      evenredigheid verminderd.


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel8
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '8'
        hoofdstuk: II
  - number: '12.2'
    text: |-
      Onder normale arbeidsduur wordt verstaan de arbeidsduur die in overeenkomstige arbeidsverhoudingen in de regel
      geacht wordt een volledige dienstbetrekking te vormen.
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel12
  - number: '12.3'
    text: |-
      Onze Minister kan ambtshalve dan wel op gezamenlijk verzoek van een rechtspersoonlijkheid bezittende organisatie
      van werkgevers en een zodanige organisatie van werknemers voor tot een in zijn besluit aangewezen categorie
      behorende werknemers een andere arbeidsduur als normale arbeidsduur vaststellen.
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel12
  - number: '12.4'
    text: |-
      Voor zover het loon niet naar tijdruimte is vastgesteld maar afhankelijk is van de uitkomsten van de verrichte
      arbeid, wordt voor de toepassing van het bij of krachtens deze wet bepaalde als arbeidsduur aangemerkt: de tijd,
      die redelijkerwijs met de uitvoering van de verrichte arbeid is gemoeid.
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel12
  - number: '14.1'
    text: |-
      Het bedrag, genoemd in [artikel 8, eerste lid, onder a][ref1], wordt telkens met ingang van 1 januari door Onze
      Minister herzien overeenkomstig:


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel8
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '8'
        hoofdstuk: II
  - number: 14.1.a
    text: |-
      de helft van de ontwikkeling van de contractlonen zoals deze voor het betrokken jaar, blijkens bekendmaking in de
      Macro-Economische Verkenningen in het voorafgaande jaar, is geraamd; en
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel14
  - number: 14.1.b
    text: |-
      het verschil tussen de ontwikkeling van de contractlonen zoals deze voor het voorafgaande jaar, blijkens
      bekendmaking in het Centraal Economisch Plan in dat jaar, was geraamd en de ontwikkeling van de contractlonen zoals
      deze voor het voorafgaande jaar, blijkens bekendmaking in de Macro-Economische Verkenningen in dat jaar, nader
      is geraamd.
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel14
  - number: '14.2'
    text: |-
      Het bedrag, genoemd in [artikel 8, eerste lid, onder a][ref1], wordt telkens met ingang van 1 juli door Onze
      Minister opnieuw herzien overeenkomstig het verschil tussen de helft van de ontwikkeling van de contractlonen zoals
      deze voor het betrokken jaar, blijkens bekendmaking in de Macro-Economische Verkenningen in het voorafgaande jaar,
      was geraamd en de ontwikkeling van de contractlonen zoals deze voor het betrokken jaar, blijkens bekendmaking in
      het Centraal Economisch Plan in dat jaar, nader is geraamd.


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel8
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '8'
        hoofdstuk: II
  - number: '14.3'
    text: |-
      Voor de toepassing van het eerste en tweede lid wordt onder ontwikkeling van de contractlonen verstaan: het
      gemiddelde van de procentuele ontwikkeling van de contractlonen in marktsector, gepremieerde en gesubsidieerde
      sector, en bij de overheid, zoals deze door het Centraal Planbureau wordt bekend gemaakt.
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel14
  - number: '14.4'
    text: |-
      Indien de toepassing van het eerste, dan wel het tweede lid zou leiden tot verlaging van het bedrag, genoemd
      in [artikel 8, eerste lid, onder a][ref1], wordt dat bedrag ongewijzigd vastgesteld. Voor zover hierdoor geen
      toepassing wordt gegeven aan het eerste, dan wel het tweede lid wordt het daarmee gemoeide percentage bij de
      eerstvolgende herziening en voor zover nodig tevens bij de daarop volgende herzieningen, alsnog in aanmerking
      genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel8
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '8'
        hoofdstuk: II
  - number: '14.5'
    text: |-
      Het bedrag, genoemd in [artikel 8, eerste lid, onder a][ref1], kan met ingang van 1 januari en van 1 juli bij
      algemene maatregel van bestuur in afwijking van het eerste tot en met het vierde lid worden vastgesteld, naar
      gelang sprake is van een bovenmatige loonontwikkeling zodanig dat hiervan schade voor de werkgelegenheid kan
      worden verwacht dan wel van een zodanige volume-ontwikkeling in de sociale zekerheidsregelingen dat daardoor een
      betekenende premie- of belastingdrukverhoging noodzakelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel8
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '8'
        hoofdstuk: II
  - number: '14.6'
    text: |-
      Indien per 1 januari toepassing is gegeven aan het vijde lid, blijft per 1 juli van hetzelfde jaar de toepassing
      van het tweede lid achterwege. Indien echter inmiddels gebleken is dat de grond voor de toepassing van het vijfde
      lid niet langer aanwezig is, wordt het bedrag, genoemd in [artikel 8, eerste lid, onder a][ref1], met ingang van
      1 juli van hetzelfde jaar alsnog door Onze Minister herzien overeenkomstig het verschil tussen de ontwikkeling van
      de contractlonen zoals deze voor het betrokken jaar, blijkens bekendmaking in het Centraal Economisch Plan in dat
      jaar, is geraamd en de herziening die per 1 januari heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel8
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '8'
        hoofdstuk: II
  - number: '14.7'
    text: |-
      Indien per 1 juli toepassing wordt gegeven aan het vijfde lid dan wel het zesde lid, eerste volzin, toepassing
      heeft gevonden, blijft per 1 januari van het eerstvolgende jaar de toepassing van het eerste lid, onder b,
      achterwege.
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel14
  - number: '14.8'
    text: |-
      Indien een algemene maatregel van bestuur als bedoeld in het vijfde lid wordt voorbereid legt Onze Minister het
      ontwerp van die maatregel met de daarbij behorende nota van toelichting over aan de beide Kamers der Staten-
      Generaal. De voordracht tot de maatregel kan worden gedaan nadat tien dagen na de overlegging zijn verstreken of
      zoveel eerder als beide Kamers te kennen hebben gegeven dat geen verdere inlichtingen worden verlangd.
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel14
  - number: '14.9'
    text: |-
      Het overeenkomstig het eerste tot en met het vierde en het zesde lid herziene bedrag wordt afgerond op het
      dichtstbijzijnde veelvoud van € 0,60. Indien het restbedrag € 0,30 bedraagt, geschiedt de afronding naar boven.
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel14
  - number: '14.10'
    text: |-
      Bij een herziening overeenkomstig het eerste tot en met het zesde lid worden tevens de bedragen, genoemd in
      [artikel 8, eerste lid, onder b en c][ref1], herzien en wel in dier voege, dat het onder b genoemde bedrag wordt
      gesteld op 3/13 en het onder c genoemde bedrag op 3/65 van het herziene bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel8
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '8'
        hoofdstuk: II
  - number: '14.11'
    text: |-
      De overeenkomstig het eerste tot en met het zesde en het tiende lid herziene bedragen treden in de plaats van de
      bedragen, genoemd in [artikel 8, eerste lid][ref1], met dien verstande dat de afronding, bedoeld in het negende
      lid, bij de eerstvolgende herziening buiten beschouwing blijft.


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel8
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '8'
        hoofdstuk: II
  - number: '14.12'
    text: |-
      Indien te voorzien valt dat een algemene maatregel van bestuur als bedoeld in het vijfde lid niet tijdig voor
      1 januari respectievelijk 1 juli tot stand zal kunnen komen, kan Onze Minister bepalen dat de laatstelijk
      vastgestelde bedragen, genoemd in [artikel 8, eerste lid][ref1], nog gedurende een bij zijn besluit vast te stellen
      periode van ten hoogste drie maanden van kracht blijven en kan een algemene maatregel van bestuur in aansluiting op
      die periode worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel8
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '8'
        hoofdstuk: II
  - number: '14.13'
    text: |-
      Onze Minister gaat telkens na verloop van een termijn van ten hoogste vier jaar, voor het eerst uiterlijk in 1994,
      na of er omstandigheden aanwezig zijn die een bijzondere wijziging wenselijk maken van de bedragen, genoemd in
      [artikel 8, eerste lid][ref1]. Bij algemene maatregel van bestuur kunnen vervolgens bedragen worden vastgesteld
      die in de plaats treden van de bedragen, genoemd in [artikel 8, eerste lid][ref2]. Het achtste lid is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002638#Artikel8
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '8'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0002638
        artikel: '8'
        hoofdstuk: II
  - number: '14.14'
    text: |-
      Het bedrag, genoemd in [artikel 8, eerste lid, onder a][ref1], wordt bij algemene maatregel van bestuur
      verlaagd in de mate waarin en met ingang van het tijdstip waarop de minimumvakantiebijslag met toepassing
      van [artikel 15, vierde lid][ref2], wordt verhoogd. Het negende, tiende en elfde lid zijn van overeenkomstige
      toepassing. Wanneer een verlaging op grond van dit lid samenvalt met een bijzondere wijziging op grond van het
      dertiende lid, worden de in [artikel 8, eerste lid][ref3], genoemde bedragen in één algemene maatregel van bestuur
      opnieuw vastgesteld en is tevens het achtste lid van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002638#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0002638#Artikel8
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '8'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0002638
        artikel: '15'
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0002638
        artikel: '8'
        hoofdstuk: II
  - number: '14.15'
    text: |-
      Wanneer een bijzondere wijziging of een verlaging op grond van het dertiende en veertiende lid samenvalt met een
      toepassing van het eerste tot en met het zesde en het tiende lid, worden de in [artikel 8, eerste lid][ref1],
      genoemde bedragen in één algemene maatregel van bestuur opnieuw vastgesteld, met dien verstande dat in dat geval
      voor de toepassing van het eerste tot en met het zesde en het tiende lid wordt uitgegaan van de op grond van het
      dertiende en veertiende lid herziene bedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel8
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '8'
        hoofdstuk: II
  - number: '15.1'
    text: |-
      Uit de overeenkomst, waarop een dienstbetrekking berust, heeft de werknemer jegens de werkgever aanspraak op
      een vakantiebijslag ten minste tot een bedrag van 8% van zijn ten laste van de werkgever komende loon, alsmede
      van de uitkeringen waarop hij tijdens de dienstbetrekking krachtens de [Ziektewet][ref1], [hoofdstuk 3, afdeling
      2, paragraaf 1, van de Wet arbeid en zorg](onbekend) en de [Werkloosheidswet][ref2] aanspraak heeft, met dien
      verstande, dat het bedrag waarmede de som van dit loon en deze uitkeringen het drievoud van het minimumloon
      overschrijdt buiten beschouwing blijft.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0004045
  - number: '15.2'
    text: |-
      De in het eerste lid bedoelde som wordt geacht het drievoud van het minimumloon te overschrijden indien deze over
      de uitbetalingstermijn, liggende in het tijdvak waarover de aanspraak op vakantiebijslag bestaat, gemiddeld meer
      bedraagt dan het drievoud van het in [artikel 8][ref1] genoemde bedrag van het minimumloon.


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel8
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '8'
        hoofdstuk: II
  - number: '15.3'
    text: |-
      Beloningen die de werknemer voor arbeid, door hem in de dienstbetrekking verricht, van derden ontvangt, worden,
      voor zover zij deel uitmaken van de arbeidsvoorwaarden, voor de toepassing van de voorgaande leden geacht ten laste
      van de werkgever komend loon te zijn.
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel15
  - number: '15.4'
    text: |-
      Gelijktijdig met de toepassing van [artikel 14, dertiende lid][ref1], gaat Onze Minister na of de ontwikkeling
      van het niveau van de in collectieve arbeidsovereenkomsten overeengekomen vakantiebijslag een verhoging van de
      minimumvakantiebijslag wenselijk maakt. Bij algemene maatregel van bestuur kan vervolgens het percentage, genoemd
      in het eerste lid, en dienovereenkomstig het percentage, genoemd in [artikel 16, tweede en derde lid][ref2], worden
      verhoogd; daarbij kan tevens een minimum-bedrag worden vastgesteld voor de aanspraak van de werknemer jegens zijn
      werkgever ingevolge het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0002638#Artikel16
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '14'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0002638
        artikel: '16'
        hoofdstuk: III
  - number: '16.1'
    text: |-
      Behoudens het bij het tweede, derde en vierde lid bepaalde kan bij publiekrechtelijke regeling of collectieve
      arbeidsovereenkomst worden bepaald, dat de werknemer geen aanspraak heeft op vakantiebijslag dan wel aanspraak
      heeft op een lager bedrag aan vakantiebijslag dan uit [artikel 15][ref1] voortvloeit.


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel15
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '15'
        hoofdstuk: III
  - number: '16.2'
    text: |-
      Indien de som van het loon, waarop de werknemer op 1 juni van enig jaar over het daaraan voorafgaande tijdvak
      van een jaar aanspraak heeft verworven, en de vakantiebijslag, voor zover de werknemer daarop over dat tijdvak
      aanspraak heeft verworven, minder bedraagt dan 108% van het bedrag, waarop de werknemer over dat tijdvak als
      minimumloon aanspraak heeft verworven, heeft de werknemer over dat tijdvak bovendien aanspraak op een bedrag aan
      vakantiebijslag ter grootte van het bedrag waarmee genoemde 108% eerdergenoemde som te boven gaat.
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel16
  - number: '16.3'
    text: |-
      Voor zover de werknemer over een tijdvak als bedoeld in het tweede lid aanspraak op uitkeringen krachtens
      de [Ziektewet][ref1], [hoofdstuk 3, afdeling 2, paragraaf 1, van de Wet arbeid en zorg](onbekend) en de
      [Werkloosheidswet][ref2] tijdens dienstbetrekking heeft verworven, heeft de werknemer over deze uitkeringen
      jegens de werkgever aanspraak op een zodanig bedrag aan vakantiebijslag, dat dit bedrag vermeerderd met die
      uitkeringen ten minste 108% bedraagt van het bedrag waarop de werknemer over dit tijdvak aan uitkeringen
      krachtens de [Ziektewet][ref3], [hoofdstuk 3, afdeling 2, paragraaf 1, van de Wet arbeid en zorg][ref4] en de
      [Werkloosheidswet][ref5] berekend over het minimumloon, aanspraak heeft of zou hebben verworven.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0004045
      [ref3]: https://wetten.overheid.nl/BWBR0001888
      [ref4]: https://wetten.overheid.nl/BWBR0013008#Paragraaf1
      [ref5]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0004045
      - id: ref3
        bwb_id: BWBR0001888
      - id: ref4
        bwb_id: BWBR0013008
        paragraaf: '1'
      - id: ref5
        bwb_id: BWBR0004045
  - number: '16.4'
    text: |-
      Ingeval toepassing is gegeven aan [artikel 15, vierde lid][ref1], heeft de werknemer over een tijdvak als bedoeld
      in het tweede lid tenminste aanspraak op een zodanig bedrag aan vakantiebijslag dat dit bedrag vermeerderd
      met het loon, respectievelijk de uitkeringen krachtens de [Ziektewet][ref2], [hoofdstuk 3, afdeling 2,
      paragraaf 1, van de Wet arbeid en zorg](onbekend) en de [Werkloosheidswet][ref3], waarop de werknemer over dat
      tijdvak aanspraak heeft verworven, niet lager is dan de som van het krachtens [artikel 15, vierde lid][ref4],
      vastgestelde minimumbedrag en het minimumloon, respectievelijk de uitkeringen krachtens de [Ziektewet][ref5],
      [hoofdstuk 3, afdeling 2, paragraaf 1, van de Wet arbeid en zorg][ref6] en de [Werkloosheidswet][ref7] berekend
      over het minimumloon, waarop de werknemer over dat tijdvak aanspraak heeft of zou hebben verworven.


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0001888
      [ref3]: https://wetten.overheid.nl/BWBR0004045
      [ref4]: https://wetten.overheid.nl/BWBR0002638#Artikel15
      [ref5]: https://wetten.overheid.nl/BWBR0001888
      [ref6]: https://wetten.overheid.nl/BWBR0013008#Paragraaf1
      [ref7]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '15'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0001888
      - id: ref3
        bwb_id: BWBR0004045
      - id: ref4
        bwb_id: BWBR0002638
        artikel: '15'
        hoofdstuk: III
      - id: ref5
        bwb_id: BWBR0001888
      - id: ref6
        bwb_id: BWBR0013008
        paragraaf: '1'
      - id: ref7
        bwb_id: BWBR0004045
  - number: '16.5'
    text: |-
      Ingeval het door de werkgever en werknemer overeengekomen loon het drievoud van het minimumloon overschrijdt, kan
      ook bij schriftelijke overeenkomst worden bepaald, dat de werknemer geen aanspraak heeft op vakantiebijslag dan
      wel aanspraak heeft op een lager bedrag aan vakantiebijslag. [Artikel 15, tweede lid][ref1], is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel15
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '15'
        hoofdstuk: III
  - number: '16.6'
    text: |-
      Ingeval de werkgever die jegens zijn werknemers verplicht is tot toepassing van een publiekrechtelijke regeling
      of collectieve arbeidsovereenkomst, dan wel algemeen verbindend verklaarde bepalingen van een collectieve
      arbeidsovereenkomst, waarbij op grond van het eerste lid is afgeweken van [artikel 15][ref1], tevens werknemers
      in dienst heeft jegens wie die verplichting niet bestaat, kan ten aanzien van laatstbedoelde werknemers bij
      schriftelijke overeenkomst op overeenkomstige wijze van [artikel 15][ref2] worden afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002638#Artikel15
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '15'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0002638
        artikel: '15'
        hoofdstuk: III
  - number: '16.7'
    text: |-
      Indien de werknemer ingevolge enige wettelijke bepaling uit de overeenkomst, waarop de dienstbetrekking
      berust, recht heeft op loon over een periode, waarin hij geen arbeid verricht, worden de uitkeringen
      krachtens de [Ziektewet][ref1], [hoofdstuk 3, afdeling 2, paragraaf 1, van de Wet arbeid en zorg][ref2] en de
      [Werkloosheidswet][ref3], waarmede het loon ingevolge die bepaling wordt verminderd, voor de toepassing van dit
      artikel geacht ten laste van de werkgever komend loon te zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Paragraaf1
      [ref3]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0013008
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0004045
  - number: '17.1'
    text: |-
      De vakantiebijslag, waarop de werknemer over het loon en de uitkeringen krachtens de [Ziektewet][ref1],
      [hoofdstuk 3, afdeling 2, paragraaf 1, van de Wet arbeid en zorg][ref2] en de [Werkloosheidswet][ref3], voor
      zover een en ander tot en met 31 mei van het lopende jaar opeisbaar is geworden, aanspraak heeft verworven, wordt
      behoudens het bepaalde in de volgende leden in de maand juni uitbetaald.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Paragraaf1
      [ref3]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0013008
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0004045
  - number: '17.2'
    text: |-
      Bij publiekrechtelijke regeling of schriftelijke overeenkomst kan ter zake van het tijdstip van uitbetaling van
      het eerste lid worden afgeweken, met dien verstande, dat uitbetaling ten minste eenmaal per kalenderjaar dient
      te geschieden.
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel17
  - number: '17.3'
    text: |-
      Bij het einde van de dienstbetrekking wordt aan de werknemer het bedrag aan vakantiebijslag uitbetaald, waarop hij
      op dat tijdstip aanspraak heeft verworven.
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel17
  - number: '18.1'
    text: |-
      Indien hierin bij publiekrechtelijke regeling of collectieve arbeidsovereenkomst is voorzien, kan de werkgever
      aan zijn verplichtingen tegenover de werknemer betreffende de vakantiebijslag voldoen hetzij door aan de werknemer
      vakantiebonnen over te dragen ten laste van een fonds, hetzij door betaling van de vakantiebijslag aan een fonds
      ten laste waarvan de werknemer de aanspraak op vakantiebijslag verwerft, mits het bedrag, waarop de werknemer door
      deze overdracht onderscheidenlijk deze betaling, op dat fonds aanspraak verwerft, niet lager ligt dan het bedrag,
      waarop de werknemer krachtens de[ artikelen 15][ref1] en [16][ref2] aanspraak heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002638#Artikel16
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '15'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0002638
        artikel: '16'
        hoofdstuk: III
  - number: '18.2'
    text: |-
      Een fonds als bedoeld in het eerste lid dient te zijn ingericht overeenkomstig de voorwaarden, gesteld krachtens
      [artikel 631, derde lid onder ][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel631
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '631'
  - number: 18a
    text: |-
      Met het toezicht op de naleving van deze wet en daarop berustende bepalingen zijn belast de bij besluit van Onze
      Minister aangewezen, onder hem ressorterende ambtenaren.
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel18a
  - number: 18b.1
    text: |-
      Als beboetbaar feit wordt aangemerkt het door een werkgever niet of onvoldoende nakomen van de op hem op grond van
      [artikel 7][ref1] rustende verplichting aangaande het voldoen van hetgeen in [hoofdstuk II][ref2] is aangeduid als
      minimumloon alsmede het door de werkgever niet of onvoldoende nakomen van de op hem op grond van [artikel 15][ref3]
      rustende verplichting.


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002638#HoofdstukII
      [ref3]: https://wetten.overheid.nl/BWBR0002638#Artikel15
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel18b
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '7'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0002638
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0002638
        artikel: '15'
        hoofdstuk: III
  - number: 18b.2
    text: |-
      Als beboetbaar feit wordt tevens aangemerkt het door de werkgever niet of onvoldoende kunnen overleggen van enige
      schriftelijke bescheiden waaruit de aard van de arbeidsrelatie, het door hem betaalde loon of de door hem betaalde
      vakantiebijslag of het aantal gewerkte uren blijkt van een in zijn onderneming, bedrijf of inrichting aangetroffen
      persoon.
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel18b
  - number: 18c.1
    text: Beboetbare feiten kunnen worden begaan door natuurlijke personen en rechtspersonen.
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel18c
  - number: 18c.2
    text: 'Indien een beboetbaar feit wordt begaan door een rechtspersoon, kan de boete worden opgelegd aan:'
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel18c
  - number: 18c.2.1°
    text: de rechtspersoon, of
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel18c
  - number: 18c.2.2°
    text: |-
      degene die opdracht heeft gegeven tot de gedraging waardoor de verplichtingen die voortvloeien uit deze wet of de
      daarop berustende bepalingen niet zijn nageleefd alsmede tegen hem die feitelijke leiding heeft gegeven aan die
      gedraging, of
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel18c
  - number: 18c.2.3°
    text: de onder 1° en 2° genoemden tezamen.
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel18c
  - number: 18c.3
    text: |-
      Voor de toepassing van het eerste en tweede lid wordt met een rechtspersoon gelijkgesteld: de vennootschap zonder
      rechtspersoonlijkheid, de maatschap, de rederij en het doelvermogen.
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel18c
  - number: 18d.1
    text: |-
      Indien een daartoe aangewezen ambtenaar als bedoeld in [artikel 18a][ref1] vaststelt dat een beboetbaar feit is
      begaan, maakt hij daarvan een rapport op.


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel18a
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel18d
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: 18a
        hoofdstuk: IV
        paragraaf: '1'
  - number: 18d.2
    text: 'Het rapport is gedagtekend en vermeldt in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel18d
  - number: 18d.2.a
    text: de naam van degene die het beboetbare feit heeft begaan;
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel18d
  - number: 18d.2.b
    text: de aard van het beboetbare feit onder vermelding van het wettelijke voorschrift dat niet is nageleefd;
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel18d
  - number: 18d.2.c
    text: de bij het beboetbare feit betrokken persoon of personen;
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel18d
  - number: 18d.2.d
    text: de natuurlijke of rechtspersoon op wie de verplichting rust tot naleving van het beboetbare wettelijke voorschrift.
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel18d
  - number: 18d.3
    text: |-
      Indien een ambtenaar als bedoeld in het eerste lid jegens de bij het beboetbare feit betrokken persoon een
      handeling verricht waaraan deze in redelijkheid de gevolgtrekking kan verbinden dat jegens hem wegens het begaan
      van een beboetbaar feit een rapport als bedoeld in het eerste lid zal worden opgemaakt, is die persoon niet langer
      verplicht terzake enige verklaring af te leggen. De in de eerste zin bedoelde persoon wordt hiervan in kennis
      gesteld alvorens hem mondeling om informatie wordt gevraagd.
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel18d
  - number: 18d.4
    text: |-
      Het rapport wordt toegezonden aan de op grond van [artikel 18e, eerste lid][ref1], aangewezen ambtenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel18e
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel18d
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: 18e
        hoofdstuk: IV
        paragraaf: '2'
  - number: 18d.5
    text: |-
      Gelijktijdig met de toezending, bedoeld in het vierde lid, wordt het rapport in afschrift toegezonden of uitgereikt
      aan de persoon of personen, bedoeld in het tweede lid, onderdeel d.
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel18d
  - number: 18d.6
    text: |-
      Op verzoek van de in het vijfde lid, eerste zin, bedoelde persoon die het rapport wegens zijn gebrekkige kennis van
      de Nederlandse taal onvoldoende begrijpt, zorgt de ambtenaar, bedoeld in het eerste lid, er zoveel mogelijk voor
      dat de in het rapport vermelde informatie aan hem wordt medegedeeld in een voor hem begrijpelijke taal.
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel18d
  - number: 18e.1
    text: |-
      Een daartoe door Onze Minister aangewezen, onder hem ressorterende ambtenaar kan een boete opleggen aan de
      natuurlijke of rechtspersoon op wie de verplichtingen rusten die voortvloeien uit deze wet, voor zover het niet
      naleven daarvan is aangeduid als beboetbaar feit.
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel18e
  - number: 18e.2
    text: |-
      De terzake van het bij of krachtens deze wet beboetbaar gestelde feiten gelden ten opzichte van elke persoon met of
      ten aanzien van wie het beboetbare feit is begaan.
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel18e
  - number: 18e.3
    text: |-
      Geen boete wordt opgelegd indien degene op wie de verplichtingen rusten die voortvloeien uit deze wet, bedoeld in
      het eerste lid, is overleden.
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel18e
  - number: 18f.1
    text: |-
      Indien de op grond van [artikel 18e, eerste lid][ref1], aangewezen ambtenaar voornemens is om de natuurlijke
      persoon of rechtspersoon door wie een beboetbaar feit is begaan een boete op te leggen, wordt deze hiervan in
      kennis gesteld onder vermelding van de gronden waarop het voornemen berust.


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel18e
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel18f
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: 18e
        hoofdstuk: IV
        paragraaf: '2'
  - number: 18f.2
    text: |-
      In afwijking van [afdeling 4.1.2 van de Algemene wet bestuursrecht][ref1] stelt de op grond van
      [artikel 18e, eerste lid][ref2], aangewezen ambtenaar binnen een door hem te bepalen termijn de persoon, bedoeld
      in het eerste lid, in de gelegenheid om naar keuze schriftelijk of mondeling zijn zienswijze naar voren te brengen
      alvorens de boete wordt opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.1.2
      [ref2]: https://wetten.overheid.nl/BWBR0002638#Artikel18e
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel18f
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 4.1.2
      - id: ref2
        bwb_id: BWBR0002638
        artikel: 18e
        hoofdstuk: IV
        paragraaf: '2'
  - number: 18f.3
    text: |-
      Indien de persoon, bedoeld in het tweede lid, zijn zienswijze mondeling naar voren brengt en hij de Nederlandse
      taal onvoldoende begrijpt, zorgt de op grond van [artikel 18e, eerste lid][ref1], aangewezen ambtenaar, op diens
      verzoek ervoor dat een tolk wordt benoemd die hem kan bijstaan, tenzij redelijkerwijs kan worden aangenomen dat
      daaraan geen behoefte bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel18e
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel18f
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: 18e
        hoofdstuk: IV
        paragraaf: '2'
  - number: 18g.1
    text: |-
      De boete, die ten hoogste voor een beboetbaar feit kan worden opgelegd, is gelijk aan de geldsom van ten hoogste €
      6 700,–, behoudens het tweede lid.
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel18g
  - number: 18g.2
    text: |-
      De op grond van [artikel 18e, eerste lid][ref1], aangewezen ambtenaar verhoogt de op te leggen boete met 50%,
      indien op de dag van het constateren van het beboetbare feit nog geen 24 maanden zijn verstreken nadat een eerder
      beboetbaar feit bestaande uit het niet naleven van eenzelfde wettelijke verplichting is geconstateerd en de boete
      wegens het eerdere beboetbare feit onherroepelijk is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel18e
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel18g
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: 18e
        hoofdstuk: IV
        paragraaf: '2'
  - number: 18g.3
    text: |-
      Onze Minister stelt beleidsregels vast waarin onder meer de boetebedragen voor ieder beboetbaar feit worden
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel18g
  - number: 18g.4
    text: |-
      In afwijking van [artikel 8:69 van de Algemene wet bestuursrecht][ref1] kan de rechter in beroep of hoger beroep de
      hoogte van de boete ook ten nadele van de belanghebbende wijzigen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel18g
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 18h.1
    text: |-
      Een boete wordt opgelegd bij beschikking van de op grond van [artikel 18e, eerste lid][ref1], aangewezen ambtenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel18e
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel18h
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: 18e
        hoofdstuk: IV
        paragraaf: '2'
  - number: 18h.2
    text: 'In de beschikking wordt in ieder geval vermeld:'
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel18h
  - number: 18h.2.a
    text: de hoogte van de boete;
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel18h
  - number: 18h.2.b
    text: het beboetbare feit ter zake waarvan de boete opgelegd wordt;
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel18h
  - number: 18h.2.c
    text: de bij het beboetbare feit betrokken persoon of personen;
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel18h
  - number: 18h.2.d
    text: |-
      de natuurlijke of rechtspersoon op wie de verplichting rust tot naleving van het bepaalde van het bij of krachtens
      deze wet, voor zover dit is aangeduid als beboetbaar feit;
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel18h
  - number: 18h.2.e
    text: de termijn waarbinnen de boete moet worden betaald.
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel18h
  - number: 18h.3
    text: |-
      De beschikking wordt gegeven binnen 13 weken na dagtekening van het rapport, bedoeld in [artikel 18d][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel18d
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel18h
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: 18d
        hoofdstuk: IV
        paragraaf: '2'
  - number: 18h.4
    text: |-
      Op verzoek van de in het tweede lid, onderdelen c en d, bedoelde persoon die de inhoud van de beschikking wegens
      zijn gebrekkige kennis van de Nederlandse taal onvoldoende begrijpt, zorgt de ambtenaar, bedoeld in het eerste lid,
      er zoveel mogelijk voor dat de in die beschikking vermelde informatie aan hem wordt medegedeeld in een voor hem
      begrijpelijke taal.
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel18h
  - number: 18i.1
    text: |-
      De bevoegdheid om een boete op te leggen vervalt na verloop van 2 jaren na de dag waarop het beboetbare feit is
      geconstateerd.
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel18i
  - number: 18i.2
    text: De beslissing om een boete op te leggen stuit de in het eerste lid bedoelde termijn.
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel18i
  - number: 18j.1
    text: |-
      De boete wordt betaald binnen 6 weken nadat de beschikking, bedoeld in [artikel 18h][ref1], is bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel18h
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel18j
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: 18h
        hoofdstuk: IV
        paragraaf: '2'
  - number: 18j.2
    text: |-
      Degene aan wie een boete is opgelegd, verstrekt desgevraagd aan de daartoe op grond van
      [artikel 18e eerste lid][ref1], aangewezen ambtenaar de inlichtingen die redelijkerwijs voor de tenuitvoerlegging
      van de boete nodig zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel18e
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel18j
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: 18e
        hoofdstuk: IV
        paragraaf: '2'
  - number: 18j.3
    text: |-
      Bij overlijden van degene aan wie een boete is opgelegd, vervalt de opgelegde boete voor zover de geldsom nog niet
      is geïnd.
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel18j
  - number: 18k.1
    text: |-
      Bij gebreke van betaling maant de op grond van [artikel 18e, eerste lid][ref1], aangewezen ambtenaar degene aan wie
      de boete is opgelegd schriftelijk aan binnen een termijn van 2 weken alsnog aan zijn verplichtingen te voldoen. De
      verschuldigde boete wordt verhoogd met de kosten die op de aanmaning betrekking hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel18e
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel18k
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: 18e
        hoofdstuk: IV
        paragraaf: '2'
  - number: 18k.2
    text: |-
      De aanmaning bevat de aanzegging, dat de boete, voor zover deze binnen de in de aanmaning gestelde termijn niet
      wordt voldaan, wordt ingevorderd overeenkomstig [artikel 18l][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel18l
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel18k
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: 18l
        hoofdstuk: IV
        paragraaf: '2'
  - number: 18l.1
    text: |-
      Bij gebreke van betaling vordert de op grond van [artikel 18e][ref1], eerste lid, aangewezen ambtenaar van degene
      aan wie de boete is opgelegd de verschuldigde boete, verhoogd met de op de aanmaning en invordering betrekking
      hebbende kosten, bij dwangbevel in.


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel18e
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel18l
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: 18e
        hoofdstuk: IV
        paragraaf: '2'
  - number: 18l.2
    text: |-
      Het dwangbevel wordt op kosten van de degene aan wie de boete is opgelegd bij deurwaardersexploot betekend en
      levert een executoriale titel op in de zin van [Boek 2 van het Wetboek van Burgerlijke Rechtsvordering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel18l
    references:
      - id: ref1
        bwb_id: BWBR0001827
  - number: 18l.3
    text: |-
      Gedurende 6 weken na de dag van betekening van het dwangbevel staat verzet tegen het dwangbevel open door
      dagvaarding van de Staat.
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel18l
  - number: 18l.4
    text: |-
      Het verzet kan niet worden gegrond op de stelling dat de beschikking, bedoeld in [artikel 18h][ref1], niet is
      ontvangen of dat de bij die beschikking opgelegde boete ten onrechte of op een te hoge geldsom is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel18h
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel18l
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: 18h
        hoofdstuk: IV
        paragraaf: '2'
  - number: 18l.5
    text: Het verzet schorst de tenuitvoerlegging niet, tenzij de voorzieningenrechter desgevraagd anders beslist.
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel18l
  - number: 18m
    text: |-
      Indien een boete ten onrechte is opgelegd, wordt de betaalde geldsom, vermeerderd met de wettelijke rente, binnen 6
      weken nadat is vastgesteld dat de boete ten onrechte is opgelegd, aan de rechthebbende terugbetaald.
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel18m
  - number: 18n.1
    text: |-
      Een daartoe door Onze Minister aangewezen onder hem ressorterende ambtenaar kan een werkgever die de op hem
      op grond van [artikel 7][ref1] rustende verplichting aangaande het voldoen van hetgeen in [hoofdstuk II][ref2]
      is aangeduid als minimumloon niet of onvoldoende nakomt alsmede een werkgever de op hem op grond van
      [artikel 15][ref3] rustende verplichting niet of onvoldoende nakomt een last onder dwangsom opleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002638#HoofdstukII
      [ref3]: https://wetten.overheid.nl/BWBR0002638#Artikel15
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel18n
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '7'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0002638
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0002638
        artikel: '15'
        hoofdstuk: III
  - number: 18n.2
    text: Een bestuurlijke boete en een last onder dwangsom kunnen tezamen worden opgelegd.
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel18n
  - number: 18n.3
    text: De last onder dwangsom kan voor ten hoogste een periode van 2 jaar gelden.
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel18n
  - number: 18n.4
    text: Onze Minister stelt beleidsregels vast omtrent de last onder dwangsom.
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel18n
  - number: 18o
    text: |-
      Indien een dwangsom ten onrechte is ingevorderd, wordt de betaalde geldsom, vermeerderd met de wettelijke rente,
      binnen 6 weken nadat is vastgesteld dat de dwangsom ten onrechte is ingevorderd, aan de rechthebbende terugbetaald.
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel18o
  - number: 18p
    text: |-
      Indien aan een werkgever een boete is opgelegd worden de daarvoor in aanmerking komende verenigingen van werkgevers
      en werknemers daarvan in kennis gesteld.
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel18p
  - number: 18q
    text: |-
      Een beschikking op grond van deze wet van de ambtenaar, bedoeld in de [artikelen 18e, eerste lid][ref1], en
      [18n, eerste lid][ref2], wordt genomen namens Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel18e
      [ref2]: https://wetten.overheid.nl/BWBR0002638#Artikel18n
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel18q
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: 18e
        hoofdstuk: IV
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002638
        artikel: 18n
        hoofdstuk: IV
        paragraaf: '3'
  - number: '19'
    text: Bedingen, die strijdig zijn met het bij of krachtens deze wet bepaalde, zijn nietig.
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel19
  - number: '20'
    text: |-
      Ieder vorderingsrecht tot betaling van vakantiebijslag als bedoeld in [Hoofdstuk III][ref1] verjaart na verloop van
      twee jaren na het tijdstip, waarop de uitbetaling had moeten geschieden.


      [ref1]: https://wetten.overheid.nl/BWBR0002638#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0002638
        hoofdstuk: III
  - number: 23a
    text: |-
      [Artikel 6, eerste lid, onderdeel h][ref1], zoals dat onderdeel luidde op 31 december 2002, blijft tot en met
      het kalenderjaar 2007 van toepassing op na 31 december 2002 toegekende spaarpremies of voorlopig bijgeschreven
      spaarpremies ter zake van voor 1 januari 2003 ingehouden besparingen op de voet van een premiespaarregeling als
      bedoeld in [artikel 31a van de Wet op de loonbelasting 1964][ref2], zoals dat artikel luidde op 31 december 2002.


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel31a
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel23a
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '6'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 31a
  - number: '24'
    text: 'Deze wet kan worden aangehaald als: Wet minimumloon en minimumvakantiebijslag.'
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel24
  - number: '25'
    text: |-
      Deze wet treedt in werking met ingang van de tiende kalenderweek na de datum van uitgifte van het *Staatsblad*
      waarin zij wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0002638/2009-01-01#Artikel25
