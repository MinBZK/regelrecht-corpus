  - number: '8'
    text: |-
      1 Het minimumloon bedraagt:

      a. voor de toepassing van deze wet: per uur € 10,60;

      b. voor de toepassing van wetten die ten aanzien van de berekening van uitkeringen of tegemoetkomingen naar deze
      wet verwijzen: over elke uitbetalingstermijn van een maand € 1.653,60;

      c. voor de toepassing van de [artikelen 7][ref1], [7a][ref2], [11][ref3], [13][ref4], [13a][ref5], [15][ref6]
      en [16][ref7] wordt naar evenredigheid met een werkweek van 36 uren gerekend met inachtneming van een
      uitbetalingstermijn van een dag, een week of een maand.

      2 Waar in deze wet wordt verwezen naar de in het vorige lid genoemde bedragen, worden als zodanig, indien
      toepassing is gegeven aan [artikel 14][ref8], de daarbij laatstelijk in hun plaats gestelde bedragen aangemerkt.

      3 In afwijking van het eerste lid bedraagt het minimumloon voor werknemers aan wie het in
      [artikel 7, eerste lid][ref9], bedoelde recht is toegekend bij een algemene maatregel van bestuur als bedoeld
      in het derde lid van dat artikel, een bij die maatregel vast te stellen percentage van de in het eerste lid van
      het onderhavige artikel genoemde bedragen. Dit percentage kan voor naar leeftijd en tak van bedrijf of beroep te
      onderscheiden categorieën van deze werknemers verschillend zijn.

      4 Bij algemene maatregel van bestuur kan ten aanzien van de werknemer die werkzaam is op basis van
      een arbeidsovereenkomst die is aangegaan in verband met een beroepsbegeleidende leerweg als bedoeld in
      [artikel 7.2.2 van de Wet educatie en beroepsonderwijs][ref10] een percentage van de in het eerste lid genoemde
      bedragen worden vastgesteld. Dit percentage kan voor naar leeftijd te onderscheiden categorieën van deze werknemers
      verschillend zijn.


