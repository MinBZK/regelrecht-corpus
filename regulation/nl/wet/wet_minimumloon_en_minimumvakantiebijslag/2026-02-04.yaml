  - number: 12a
    text: |-
      1 Bij ministeriële regeling kunnen op verzoek van de Stichting van de Arbeid specifieke werkzaamheden in een
      bedrijfstak worden aangewezen voor welke, in afwijking van [artikel 5a, tweede lid][ref1], voor de toepassing
      van het bij of krachtens deze wet bepaalde als arbeidsduur wordt aangemerkt, de tijd die redelijkerwijs met de
      uitvoering van de te verrichten arbeid is gemoeid, indien dat noodzakelijk wordt geacht, gelet op:

      a. de vrijheid van de werknemer bij de inrichting van de werkzaamheden; en

      b. de mogelijkheden voor de werkgever, of een derde aan wie de werknemer ter beschikking is gesteld voor het onder
      diens toezicht en leiding verrichten van arbeid, om op de uitvoering hiervan toezicht te houden.

      2 Onder de werkgever, bedoeld in het eerste lid, onderdeel b, wordt niet verstaan een werkgever die een werknemer
      ter beschikking stelt aan een derde voor het onder diens toezicht en leiding verrichten van arbeid.

      3 Voorafgaand aan het verzoek, bedoeld in het eerste lid, wordt aan de Stichting van de Arbeid de berekening van
      de tijd die redelijkerwijs met de uitvoering van de te verrichten arbeid is gemoeid, bedoeld in het eerste lid,
      en de elementen die zijn meegewogen in deze berekening, waaronder begrepen de vaststelling van de arbeidsduur ter
      uitvoering van die arbeid door een gemiddeld productieve werknemer, verstrekt:

      a. gezamenlijk door de hiervoor in aanmerking komende rechtspersoonlijkheid bezittende organisatie of organisaties
      van werkgevers met een zodanige organisatie of organisaties van werknemers in de bedrijfstak waar de specifieke
      werkzaamheden worden verricht onder bij ministeriële regeling te stellen voorwaarden; of

      b. uitsluitend door de rechtspersoonlijkheid bezittende organisatie of organisaties van werkgevers in voornoemde
      bedrijfstak onder bij ministeriële regeling te stellen voorwaarden.

      4 Indien de berekening overeenkomstig het derde lid aan de Stichting van de Arbeid is verstrekt maar naar het
      oordeel van een of meer van de in de Stichting van de Arbeid vertegenwoordigde organisaties van werkgevers of
      werknemers een verzoek als bedoeld in het eerste lid achterwege blijft op gronden die geen verband houden met de
      criteria, genoemd in het eerste lid, kunnen deze organisaties een verzoek als bedoeld in het eerste lid indienen.

      5 Onze Minister stelt de in de Stichting van de Arbeid vertegenwoordigde organisaties van werkgevers of werknemers
      die geen verzoek indienen, bedoeld in het vierde lid, in de gelegenheid binnen vier weken na ontvangst van het
      verzoek, bedoeld in het vierde lid, hun zienswijze ter zake kenbaar te maken.

      6 Indien de specifieke werkzaamheden zijn aangewezen op grond van het eerste lid, wordt voor 1 december van elk
      kalenderjaar aan de Stichting van de Arbeid een geactualiseerde opgave van de berekening, bedoeld in het derde
      lid, verstrekt.

      7 De Stichting van de Arbeid draagt zorg voor de bekendmaking van de berekening, bedoeld in het derde en zesde lid,
      op een bij ministeriële regeling te bepalen wijze.


