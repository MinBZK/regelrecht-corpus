  - number: 18o
    text: |-
      Indien een dwangsom ten onrechte is ingevorderd, wordt de betaalde geldsom, vermeerderd met de wettelijke rente,
      binnen 6 weken nadat is vastgesteld dat de dwangsom ten onrechte is ingevorderd, aan de rechthebbende terugbetaald.
    url: https://wetten.overheid.nl/BWBR0002638/2026-02-04#Artikel18o
  - number: 18p
    text: |-
      1 Bestuursorganen zijn bevoegd uit eigen beweging en verplicht desgevraagd aan Onze Minister en de ambtenaren,
      bedoeld in [artikel 18a, eerste en tweede lid][ref1], kosteloos alle gegevens en inlichtingen te verstrekken die
      noodzakelijk zijn voor de uitvoering en het toezicht op de naleving van het bepaalde bij of krachtens deze wet en
      dit noodzakelijk is ten behoeve van een samenwerkingsverband tussen twee of meer van de voornoemde instanties.

      2 Onze Minister en de ambtenaren, bedoeld in [artikel 18a, eerste en tweede lid][ref2], verstrekken andere
      bestuursorganen kosteloos alle gegevens en inlichtingen, die zijn verkregen door de uitvoering of het toezicht
      op de naleving van het bepaalde bij of krachtens deze wet, welke noodzakelijk zijn voor de uitvoering van hun
      wettelijke taak en dit noodzakelijk is ten behoeve van een samenwerkingsverband tussen twee of meer van de
      voornoemde instanties.

      3 Onze Minister, bestuursorganen en de ambtenaren, bedoeld in [artikel 18a, eerste en tweede lid][ref3], kunnen bij
      het verwerken van persoonsgegevens gebruik maken van het burgerservicenummer.

      4 De gegevensverstrekking, bedoeld in het eerste en tweede lid, vindt niet plaats indien de persoonlijke
      levenssfeer van de betrokkene daardoor onevenredig wordt geschaad.

      5 De door Onze Minister aangewezen ambtenaren, bedoeld in [artikel 18a, eerste lid][ref4], kunnen kosteloos
      aan een naar het oordeel van Onze Minister in aanmerking komende rechtspersoon met volledige rechtsbevoegdheid
      die door de organisaties van werkgevers en werknemers is belast of mede is belast met het toezicht op de
      naleving van collectieve arbeidsovereenkomsten gegevens verstrekken omtrent opgelegde bestuurlijke boeten voor
      het niet naleven van de [artikelen 7][ref5], [7a][ref6], [13][ref7], [13a][ref8], [15][ref9], [16][ref10] of
      [18b, tweede lid][ref11], van deze wet.

      6 Indien aan een werkgever een boete is opgelegd worden de daarvoor in aanmerking komende verenigingen van
      werknemers en werkgevers daarvan in kennis gesteld.

      7 De ambtenaren, bedoeld in [artikel 18a, eerste en tweede lid][ref12], kunnen aan de daarvoor in
      aanmerking komende organisaties van werknemers en werkgevers, aan een naar het oordeel van Onze
      Minister in aanmerking komende rechtspersoon, bedoeld in het vijfde lid, of de stichting, bedoeld in
      [artikel 14b, vijfde lid, van de Wet allocatie arbeidskrachten door intermediairs][ref13], de bij algemene
      maatregel van bestuur aangewezen gegevens verstrekken, indien deze informatie bij de uitvoering van het toezicht op
      de naleving van het bepaalde bij of krachtens deze wet wordt verkregen, die noodzakelijk is voor het toezicht op de
      collectieve arbeidsovereenkomst door die organisaties of rechtspersoon of voor de beoordeling van de geldigheid van
      een door de certificerende instelling afgegeven certificaat.

      8 Indien naar aanleiding van onderzoek naar de naleving van deze wet wordt vermoed dat de berekening van de tijd,
      bedoeld in [artikel 12a][ref14], ten aanzien van de uitvoering van de desbetreffende specifieke werkzaamheden niet
      de tijd is, die redelijkerwijs met de uitvoering van de te verrichten arbeid is gemoeid, verstrekt Onze Minister
      een verslag aan de Stichting van de Arbeid. Het verslag bevat geen gegevens waaruit de identiteit van de in het
      onderzoek betrokken werknemers kan worden afgeleid.

      9 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent de gevallen waarin en de
      wijze waarop in ieder geval gegevens worden verstrekt.


