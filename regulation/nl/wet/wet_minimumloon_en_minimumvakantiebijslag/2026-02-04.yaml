  - number: '16'
    text: |-
      1 Behoudens het bij het tweede, derde en vierde lid bepaalde kan bij publiekrechtelijke regeling of collectieve
      arbeidsovereenkomst worden bepaald, dat de werknemer geen recht heeft op vakantiebijslag dan wel recht heeft op een
      lager bedrag aan vakantiebijslag dan uit [artikel 15][ref1] voortvloeit.

      2 Indien de som van het ten laste van de werkgever komende loon en de vakantiebijslag, voldaan over het tijdvak,
      bedoeld in [artikel 17][ref2], minder bedraagt dan 108% van het bedrag, waarop de werknemer over dat tijdvak
      als minimumloon recht heeft verworven, heeft de werknemer over dat tijdvak bovendien recht op een bedrag aan
      vakantiebijslag ter grootte van het bedrag liggende tussen het bedrag waarop de werknemer over dat tijdvak als
      minimumloon recht heeft verworven en het bedrag waarmee genoemde 108% eerdergenoemde som te boven gaat.

      3 Voor zover de werknemer over een tijdvak als bedoeld in [artikel 17][ref3] aanspraak op uitkeringen krachtens
      de [Ziektewet][ref4], [hoofdstuk 3, afdeling 2, paragraaf 1](onbekend) of de [artikelen 4:2b][ref5] of
      [6:3 van de Wet arbeid en zorg][ref6] en de [Werkloosheidswet][ref7] tijdens dienstbetrekking heeft verworven,
      heeft de werknemer over deze uitkeringen jegens de werkgever recht op een zodanig bedrag aan vakantiebijslag, dat
      dit bedrag vermeerderd met die uitkeringen ten minste 108% bedraagt van het bedrag waarop de werknemer over dit
      tijdvak aan uitkeringen krachtens de [Ziektewet][ref8], hoofdstuk 3, afdeling 2, paragraaf 1 of de artikelen 4:2b
      of 6:3 van de Wet arbeid en zorg en de [Werkloosheidswet][ref9] berekend over het minimumloon, aanspraak heeft of
      zou hebben verworven.

      4 Ingeval toepassing is gegeven aan [artikel 15, vierde lid][ref10], heeft de werknemer over een tijdvak als
      bedoeld in het tweede lid tenminste recht op een zodanig bedrag aan vakantiebijslag dat dit bedrag vermeerderd met
      het loon, respectievelijk de uitkeringen krachtens de [Ziektewet][ref11], [hoofdstuk 3, afdeling 2, paragraaf 1]
      (onbekend) of de [artikelen 4:2b][ref12] of [6:3 van de Wet arbeid en zorg][ref13] en de [Werkloosheidswet][ref14],
      waarop de werknemer over dat tijdvak recht, dan wel aanspraak heeft verworven, niet lager is dan de som van het
      krachtens [artikel 15, vierde lid][ref15], vastgestelde minimumbedrag en het minimumloon, respectievelijk de
      uitkeringen krachtens de [Ziektewet][ref16], hoofdstuk 3, afdeling 2, paragraaf 1 of de artikelen 4:2b of 6:3 van
      de Wet arbeid en zorg en de [Werkloosheidswet][ref17] berekend over het minimumloon, waarop de werknemer over dat
      tijdvak recht, dan wel aanspraak heeft of zou hebben verworven.

      5 Ingeval het door de werkgever en werknemer overeengekomen loon het drievoud van het minimumloon overschrijdt,
      kan ook bij schriftelijke overeenkomst worden bepaald, dat de werknemer geen recht heeft op vakantiebijslag dan
      wel recht heeft op een lager bedrag aan vakantiebijslag. [Artikel 15, tweede lid][ref18], is van overeenkomstige
      toepassing.

      6 Ingeval de werkgever die jegens zijn werknemers verplicht is tot toepassing van een publiekrechtelijke regeling
      of collectieve arbeidsovereenkomst, dan wel algemeen verbindend verklaarde bepalingen van een collectieve
      arbeidsovereenkomst, waarbij op grond van het eerste lid is afgeweken van [artikel 15][ref19], tevens werknemers
      in dienst heeft jegens wie die verplichting niet bestaat, kan ten aanzien van laatstbedoelde werknemers bij
      schriftelijke overeenkomst op overeenkomstige wijze van [artikel 15][ref20] worden afgeweken.

      7 Indien de werknemer recht heeft op loon over een periode, waarin hij geen arbeid verricht, worden de uitkeringen
      krachtens de [Ziektewet][ref21], [hoofdstuk 3, afdeling 2, paragraaf 1][ref22] of de [artikelen 4:2b][ref23]
      of [6:3 van de Wet arbeid en zorg][ref24] en de [Werkloosheidswet][ref25], waarmee het loon overeenkomstig die
      bepaling wordt verminderd, voor de toepassing van dit artikel geacht ten laste van de werkgever komend loon te
      zijn.


