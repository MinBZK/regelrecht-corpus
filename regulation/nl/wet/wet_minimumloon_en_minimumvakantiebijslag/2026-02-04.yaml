  - number: 18c
    text: |-
      1 Een daartoe door Onze Minister aangewezen, onder hem ressorterende ambtenaar legt namens hem de bestuurlijke
      boete op aan degene op wie de verplichtingen rusten welke voortvloeien uit deze wet, voor zover het niet naleven
      daarvan is aangeduid als een overtreding.

      2 De ter zake van de bij of krachtens deze wet gestelde overtredingen gelden ten opzichte van elke persoon met of
      ten aanzien van wie de overtreding is begaan.
    url: https://wetten.overheid.nl/BWBR0002638/2026-02-04#Artikel18c
  - number: 18e
    text: |-
      1 Onverminderd [artikel 5:48, tweede lid, van de Algemene wet bestuursrecht][ref1] vermeldt het rapport in ieder
      geval:

      a. de bij de overtreding betrokken persoon of personen;

      b. het officiële nummer waaronder het betreffende vervoermiddel is geregistreerd, voor zover in verband met de
      overtreding van belang.

      2 Het rapport wordt toegezonden aan de op grond van [artikel 18c, eerste lid][ref2], aangewezen ambtenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel548
