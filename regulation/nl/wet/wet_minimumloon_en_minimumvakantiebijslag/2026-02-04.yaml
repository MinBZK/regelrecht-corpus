  - number: 6a
    text: |-
      De werkgever mag de werknemer niet benadelen wegens de omstandigheid dat de werknemer in of buiten rechte de in
      deze wet aan hem toegekende rechten of zijn recht op het in de collectieve arbeidsovereenkomst geregelde laagste
      schaalbedrag in de laagste loonschaal of andere minimumvergoeding voor de verrichte arbeid geldend maakt, ter zake
      bijstand heeft verleend of een klacht hierover heeft ingediend.
    url: https://wetten.overheid.nl/BWBR0002638/2026-02-04#Artikel6a
  - number: '7'
    text: |-
      1 De werknemer die de leeftijd van 21 jaar heeft bereikt heeft voor de arbeid door hem in dienstbetrekking
      verricht, jegens de werkgever recht op een loon ten minste tot het bedrag, bij of krachtens de volgende artikelen
      onder de benaming minimumloon vastgesteld.

      2 Indien daartoe naar Ons oordeel aanleiding bestaat op grond van de ontwikkeling in collectieve
      arbeidsovereenkomsten ter zake van de leeftijd waarop recht op een loon tenminste tot de in
      [artikel 8, eerste lid][ref1], genoemde bedragen ontstaat, kan bij algemene maatregel van bestuur worden bepaald,
      dat werknemers beneden de leeftijd van 21 jaar, die de leeftijd van 20 jaar dan wel die de leeftijd van 19 jaar
      hebben bereikt, eveneens het in het eerste lid bedoelde recht hebben.

      3 Bij algemene maatregel van bestuur kan worden bepaald, dat werknemers - dan wel dat werknemers, behorende tot een
      bij de maatregel aangewezen categorie - beneden de leeftijd van 21 jaar of, zo toepassing is gegeven aan het tweede
      lid, beneden de krachtens dat lid bepaalde leeftijd, die een bij de maatregel aangewezen lagere leeftijd hebben
      bereikt, eveneens het in het eerste lid bedoelde recht hebben.

      4 Beloningen, die de werknemer voor arbeid, door hem in de dienstbetrekking verricht, van derden ontvangt, worden,
      voor zover zij deel uitmaken van de arbeidsvoorwaarden, voor de toepassing van het bij of krachtens het eerste,
      tweede of derde lid bepaalde geacht van de werkgever te zijn ontvangen.

      5 Loon waarop de werknemer op grond van enige wettelijke bepaling recht heeft over een periode, waarin hij geen
      arbeid verricht, wordt voor de toepassing van het bij of krachtens het eerste, tweede of derde lid bepaalde
      aangemerkt als loon voor de arbeid door hem in die dienstbetrekking verricht. Bedragen, waarmee het loon
      overeenkomstig die bepaling wordt verminderd, worden voor de toepassing van het bij of krachtens het eerste, tweede
      of derde lid bepaalde geacht van de werkgever te zijn ontvangen.

      6 De werkgever is met toepassing van [artikel 623 van Boek 7 van het Burgerlijk Wetboek][ref2] verplicht het
      minimumloon tijdig te voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel623
