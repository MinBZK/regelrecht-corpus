  - number: '6'
    text: |-
      1 Voor de toepassing van het bij of krachtens deze wet bepaalde worden onder loon verstaan de geldelijke inkomsten
      uit hoofde van de dienstbetrekking, met uitzondering van:

      a. vakantiebijslagen;

      b. winstuitkeringen;

      c. uitkeringen bij bijzondere gelegenheden;

      d. uitkeringen ingevolge aanspraken om na verloop van tijd of onder een voorwaarde één of meer uitkeringen te
      ontvangen;

      e. vergoedingen voor zover zij geacht kunnen worden te strekken tot bestrijding van noodzakelijke kosten, die de
      werknemer in verband met zijn dienstbetrekking heeft te maken, waaronder in ieder geval worden begrepen kosten
      voor reizen, huisvesting of voeding, die de werknemer in verband met zijn dienstbetrekking heeft te maken, ook
      in verband met het verrichten van arbeid in een ander land dan waar de werknemer gewoonlijk arbeid verricht of
      verblijft;

      f. een transitievergoeding als bedoeld in [artikel 673 van Boek 7 van het Burgerlijk Wetboek][ref1];

      g. uitkeringen ingevolge een spaarloonregeling als bedoeld in
      [artikel 32, eerste lid, van de Wet op de loonbelasting 1964][ref2];

      h. eindejaarsuitkeringen;

      i. een werkgeversbijdrage in de premie voor de ziektekostenverzekering van een persoon, bedoeld in
      [artikel 2, tweede lid, onderdeel a, van de Zorgverzekeringswet][ref3].

      2 Bij algemene maatregel van bestuur kunnen andere uitzonderingen dan de in het eerste lid genoemde worden gesteld.

      3 Onze Minister kan regelen stellen naar welke wordt beoordeeld welke inkomsten moeten worden aangemerkt als
      uitkeringen of vergoedingen als bedoeld in het eerste lid, onder b tot en met h.

      4 Indien niet blijkt uit de arbeidsvoorwaarden en -omstandigheden die van toepassing zijn op de dienstbetrekking
      van een werknemer die tijdelijk arbeid verricht in een ander land dan waar hij gewoonlijk arbeid verricht of
      verblijft of, en zo ja welke, onderdelen van een vergoeding strekken tot bestrijding van noodzakelijke kosten, die
      deze werknemer heeft te maken in verband met het verrichten van arbeid in een ander land dan waar hij gewoonlijk
      arbeid verricht of verblijft, wordt de volledige vergoeding aangemerkt als vergoeding in de zin van het eerste lid,
      onderdeel e. Bij algemene maatregel van bestuur kunnen regels worden gesteld omtrent de wijze waarop onderdelen van
      een vergoeding worden gespecificeerd.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel673
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel32
      [ref3]: https://wetten.overheid.nl/BWBR0018450#Artikel2
