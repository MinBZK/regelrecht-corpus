  - number: 18n
    text: |-
      1 Een daartoe door Onze Minister aangewezen onder hem ressorterende ambtenaar kan een werkgever die de op hem op
      grond van [artikel 7][ref1] rustende verplichting aangaande het voldoen van hetgeen in [hoofdstuk II][ref2] is
      aangeduid als minimumloon niet of onvoldoende nakomt, een werkgever die inhoudt op of verrekent met het minimumloon
      in strijd met [artikel 13][ref3], alsmede een werkgever die de op hem op grond van de [artikelen 15][ref4] of
      [16][ref5] rustende verplichting niet of onvoldoende nakomt, een last onder dwangsom opleggen.

      2 De last onder dwangsom kan voor ten hoogste een periode van 2 jaar gelden.

      3 Onze Minister stelt beleidsregels vast omtrent de last onder dwangsom.


