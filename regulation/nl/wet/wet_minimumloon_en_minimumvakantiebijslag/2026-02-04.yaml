  - number: 18a
    text: |-
      1 Met het toezicht op de naleving van deze wet en de daarop berustende bepalingen zijn belast de bij besluit van
      Onze Minister aangewezen, onder hem ressorterende ambtenaren.

      2 Met betrekking tot door Onze Minister aangewezen categorieën van arbeid zijn met het toezicht op de naleving van
      deze wet en de daarop berustende bepalingen belast of mede belast de door hem aangewezen andere ambtenaren dan de
      in het eerste lid bedoelde. Indien ambtenaren worden aangewezen die ressorteren onder een andere minister, wordt
      het besluit tot aanwijzing van die ambtenaren genomen door Onze Minister en die andere minister gezamenlijk.

      3 Van een besluit als bedoeld in het eerste en tweede lid wordt mededeling gedaan door plaatsing in de
      Staatscourant.

      4 De op grond van het eerste of tweede lid aangewezen ambtenaar is te allen tijde bevoegd tot inbeslagneming van
      daarvoor vatbare voorwerpen. Hij kan daartoe de uitlevering vorderen tegen een door hem afgegeven schriftelijk
      bewijs. Zodra het belang van onderzoek omtrent de overtreding zulks toelaat wordt het in beslag genomen voorwerp
      teruggegeven aan degene bij wie het in beslag is genomen.
    url: https://wetten.overheid.nl/BWBR0002638/2026-02-04#Artikel18a
  - number: 18b
    text: |-
      1 Als overtreding wordt aangemerkt:

      a. het door een werkgever niet of onvoldoende nakomen van de op hem rustende verplichting tot girale voldoening van
      het minimumloon, bedoeld in [artikel 7][ref1] en [7a][ref2];

      b. het door een werkgever niet of onvoldoende nakomen van de op hem rustende verplichting tot voldoening van de
      minimumvakantiebijslag, bedoeld in de [artikelen 15][ref3] of [16][ref4];

      c. het door een werkgever verrichten van inhouding op of verrekening met het minimumloon, in strijd met het
      bepaalde bij of krachtens [artikel 13][ref5];

      d. het door een werkgever niet of onvoldoende nakomen van de op hem rustende verplichting de werkzaamheden
      schriftelijk overeen te komen op grond van [artikel 12b][ref6]; en

      e. het door een werkgever niet of onvoldoende nakomen van de op hem rustende verplichting de langere arbeidsduur
      geheel of gedeeltelijk in tijd te compenseren of te betalen, bedoeld in [artikel 13a][ref7].

      2 Als overtreding wordt tevens aangemerkt het door de werkgever desgevraagd niet of niet tijdig aan de
      toezichthouder verstrekken van:

      a. een opgave als bedoeld in [artikel 626 van Boek 7 van het Burgerlijk Wetboek][ref8], dan wel andere bescheiden
      waaruit de in dat artikel voorgeschreven gegevens blijken;

      b. bescheiden waaruit blijkt welk loon en welke vakantiebijslag aan de werknemer zijn voldaan;

      c. bescheiden waaruit blijkt hoeveel uren de werknemer heeft gewerkt;

      d. bescheiden waaruit de betalingsverplichtingen of voorschotten blijken welke met in achtneming van
      [artikel 13][ref9] zijn ingehouden op of verrekend met het minimumloon;

      e. bescheiden waaruit voor de toepassing van [artikel 12b][ref10] de volgende gegevens blijken:

      1°. de schriftelijke overeenkomst, bedoeld in dat artikel;

      2°. de omvang van de productie van de werknemer, waar nodig uitgesplitst naar de verschillende onderdelen
      per stukloonnorm op grond van [artikel 12a, derde lid][ref11], die hierop van toepassing is, in een
      uitbetalingstermijn;

      f. bescheiden waaruit voor de toepassing van [artikel 13a][ref12] de volgende gegevens blijken:

      1°. de periode waarin de langere feitelijke arbeidsduur is ontstaan;

      2°. de omvang van de langere feitelijke arbeidsduur;

      3°. het tijdstip waarop de langere feitelijke arbeidsduur is gecompenseerd in betaalde vrije tijd of giraal is
      uitbetaald;

      4°. de omvang van de langere feitelijke arbeidsduur in gecompenseerde tijd en de hoogte van de giraal uitbetaalde
      langere feitelijke arbeidsduur.

      3 Voor de toepassing van het tweede lid wordt als werkgever aangemerkt degene in of ten behoeve van wiens
      onderneming, bedrijf of inrichting een persoon arbeid verricht of heeft verricht of waarvan op grond van feiten en
      omstandigheden naar redelijk vermoeden een persoon arbeid verricht of heeft verricht. De in de eerste zin bedoelde
      persoon wordt in dat geval voor de toepassing van het tweede lid aangemerkt als werknemer. Hetgeen in de eerste zin
      is bepaald geldt behoudens tegenbewijs.


