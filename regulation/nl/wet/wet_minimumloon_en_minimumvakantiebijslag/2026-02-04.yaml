  - number: '14'
    text: |-
      1 Het bedrag, genoemd in [artikel 8, eerste lid, onder b][ref1], wordt telkens met ingang van 1 januari door Onze
      Minister herzien overeenkomstig:

      a. de helft van de ontwikkeling van de contractlonen zoals deze voor het betrokken jaar, blijkens bekendmaking in
      de Macro-Economische Verkenningen in het voorafgaande jaar, is geraamd; en

      b. het verschil tussen de ontwikkeling van de contractlonen zoals deze voor het voorafgaande jaar, blijkens
      bekendmaking in het Centraal Economisch Plan in dat jaar, was geraamd en de ontwikkeling van de contractlonen zoals
      deze voor het voorafgaande jaar, blijkens bekendmaking in de Macro-Economische Verkenningen in dat jaar, nader
      is geraamd.

      2 Het bedrag, genoemd in [artikel 8, eerste lid, onder b][ref2], wordt telkens met ingang van 1 juli door Onze
      Minister opnieuw herzien overeenkomstig het verschil tussen de helft van de ontwikkeling van de contractlonen zoals
      deze voor het betrokken jaar, blijkens bekendmaking in de Macro-Economische Verkenningen in het voorafgaande jaar,
      was geraamd en de ontwikkeling van de contractlonen zoals deze voor het betrokken jaar, blijkens bekendmaking in
      het Centraal Economisch Plan in dat jaar, nader is geraamd.

      3 Voor de toepassing van het eerste en tweede lid wordt onder ontwikkeling van de contractlonen verstaan: het
      gemiddelde van de procentuele ontwikkeling van de contractlonen in marktsector, gepremieerde en gesubsidieerde
      sector, en bij de overheid, zoals deze door het Centraal Planbureau wordt bekend gemaakt.

      4 Indien de toepassing van het eerste, dan wel het tweede lid zou leiden tot verlaging van het bedrag, genoemd
      in [artikel 8, eerste lid, onder b][ref3], wordt dat bedrag ongewijzigd vastgesteld. Voor zover hierdoor geen
      toepassing wordt gegeven aan het eerste, dan wel het tweede lid wordt het daarmee gemoeide percentage bij de
      eerstvolgende herziening en voor zover nodig tevens bij de daarop volgende herzieningen, alsnog in aanmerking
      genomen.

      5 Het bedrag, genoemd in [artikel 8, eerste lid, onder b][ref4], kan met ingang van 1 januari en van 1 juli bij
      algemene maatregel van bestuur in afwijking van het eerste tot en met het vierde lid worden vastgesteld, naar
      gelang sprake is van een bovenmatige loonontwikkeling zodanig dat hiervan schade voor de werkgelegenheid kan
      worden verwacht dan wel van een zodanige volume-ontwikkeling in de sociale zekerheidsregelingen dat daardoor een
      betekenende premie- of belastingdrukverhoging noodzakelijk is. Bij de vaststelling worden de criteria, genoemd in
      het zestiende lid, onderdeel a, subonderdelen 1 tot en met 4, meegewogen.

      6 Indien per 1 januari toepassing is gegeven aan het vijfde lid, blijft per 1 juli van hetzelfde jaar de toepassing
      van het tweede lid achterwege. Indien echter inmiddels gebleken is dat de grond voor de toepassing van het vijfde
      lid niet langer aanwezig is, wordt het bedrag, genoemd in [artikel 8, eerste lid, onder b][ref5], met ingang van
      1 juli van hetzelfde jaar alsnog door Onze Minister herzien overeenkomstig het verschil tussen de ontwikkeling van
      de contractlonen zoals deze voor het betrokken jaar, blijkens bekendmaking in het Centraal Economisch Plan in dat
      jaar, is geraamd en de herziening die per 1 januari heeft plaatsgevonden.

      7 Indien per 1 juli toepassing wordt gegeven aan het vijfde lid dan wel het zesde lid, eerste volzin, toepassing
      heeft gevonden, blijft per 1 januari van het eerstvolgende jaar de toepassing van het eerste lid, onder b,
      achterwege.

      8 Indien een algemene maatregel van bestuur als bedoeld in het vijfde lid wordt voorbereid legt Onze Minister
      het ontwerp van die maatregel met de daarbij behorende nota van toelichting over aan de beide Kamers der Staten-
      Generaal. De voordracht tot de maatregel kan worden gedaan nadat tien dagen na de overlegging zijn verstreken of
      zoveel eerder als beide Kamers te kennen hebben gegeven dat geen verdere inlichtingen worden verlangd.

      9 Het overeenkomstig het eerste tot en met het vierde en het zesde lid herziene bedrag wordt afgerond op het
      dichtstbijzijnde veelvoud van € 0,60. Indien het restbedrag € 0,30 bedraagt, geschiedt de afronding naar boven.

      10 Bij een herziening overeenkomstig het eerste tot en met zesde lid wordt tevens het minimumuurloon, genoemd in
      artikel 8, eerste lid, onder a, herzien overeenkomstig de volgende formule, waarbij het resultaat naar boven wordt
      afgerond op een veelvoud van € 0,01:

      waarbij:

      A = het herziene minimummaandloon overeenkomstig het eerste tot en met zesde lid.

      B = het aantal weken per maand dat wordt gesteld op 4 1/3.

      C = het aantal uren per week dat wordt gesteld op 36.

      11 De overeenkomstig het eerste tot en met het zesde en het tiende lid herziene bedragen treden in de plaats van
      de bedragen, genoemd in [artikel 8, eerste lid][ref6], met dien verstande dat de afronding, bedoeld in het negende
      lid, bij de eerstvolgende herziening buiten beschouwing blijft.

      12 Indien te voorzien valt dat een algemene maatregel van bestuur als bedoeld in het vijfde lid niet tijdig
      voor 1 januari respectievelijk 1 juli tot stand zal kunnen komen, kan Onze Minister bepalen dat de laatstelijk
      vastgestelde bedragen, genoemd in [artikel 8, eerste lid][ref7], nog gedurende een bij zijn besluit vast te stellen
      periode van ten hoogste drie maanden van kracht blijven en kan een algemene maatregel van bestuur in aansluiting op
      die periode worden vastgesteld.

      13 Onze Minister gaat telkens na verloop van een termijn van ten hoogste vier jaar, voor het eerst uiterlijk in
      1994, na of er omstandigheden aanwezig zijn die een bijzondere wijziging wenselijk maken van de bedragen, genoemd
      in [artikel 8, eerste lid][ref8]. Bij algemene maatregel van bestuur kunnen vervolgens bedragen worden vastgesteld
      die in de plaats treden van de bedragen, genoemd in [artikel 8, eerste lid][ref9]. Het achtste lid is van
      overeenkomstige toepassing.

      14 Het bedrag, genoemd in [artikel 8, eerste lid, onder b][ref10], wordt bij algemene maatregel van bestuur
      verlaagd in de mate waarin en met ingang van het tijdstip waarop de minimumvakantiebijslag met toepassing van
      [artikel 15, vierde lid][ref11], wordt verhoogd. Het negende, tiende en elfde lid zijn van overeenkomstige
      toepassing. Wanneer een verlaging op grond van dit lid samenvalt met een bijzondere wijziging op grond van het
      dertiende lid, worden de in [artikel 8, eerste lid][ref12], genoemde bedragen in één algemene maatregel van bestuur
      opnieuw vastgesteld en is tevens het achtste lid van overeenkomstige toepassing.

      15 Wanneer een bijzondere wijziging of een verlaging op grond van het dertiende en veertiende lid samenvalt met
      een toepassing van het eerste tot en met het zesde en het tiende lid, worden de in [artikel 8, eerste lid][ref13],
      genoemde bedragen in één algemene maatregel van bestuur opnieuw vastgesteld, met dien verstande dat in dat geval
      voor de toepassing van het eerste tot en met het zesde en het tiende lid wordt uitgegaan van de op grond van het
      dertiende en veertiende lid herziene bedragen.

      16 Bij toepassing van het dertiende lid, geldt dat:

      a. de hoogte van het minimumloon wordt geëvalueerd aan de hand van de volgende criteria:

      1°. de koopkracht van het minimumloon, rekening houdend met de kosten voor levensonderhoud;

      2°. het algemene niveau van de lonen en de verdeling ervan;

      3°. het groeipercentage van de lonen; en

      4°. nationale productiviteitsniveaus en -ontwikkelingen op lange termijn.

      b. bij de beoordeling van de toereikendheid van het minimumloon worden bij ministeriële regeling vast te stellen
      indicatieve referentiewaarden als richtsnoer gebruikt.

      17 Bij of krachtens algemene maatregel van bestuur kunnen aanvullende criteria worden vastgesteld.


