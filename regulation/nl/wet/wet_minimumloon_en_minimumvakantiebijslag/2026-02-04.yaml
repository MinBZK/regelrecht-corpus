    text: |-
      1 Voor de toepassing van het bij of krachtens deze wet bepaalde wordt verstaan onder:

      a. Onze Minister: Onze Minister van Sociale Zaken en Werkgelegenheid;

      b. publiekrechtelijke regeling: een regeling als bedoeld in [artikel 5][ref1] of
      [6 van de Wet op de loonvorming][ref2].

      2 Voor de toepassing van het bij of krachtens deze wet bepaalde worden onder collectieve
      arbeidsovereenkomst mede verstaan bepalingen van een collectieve arbeidsovereenkomst, welke krachtens
