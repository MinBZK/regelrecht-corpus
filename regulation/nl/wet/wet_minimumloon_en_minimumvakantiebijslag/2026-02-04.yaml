  - number: '5'
    text: |-
      1 Voor de toepassing van het bij of krachtens deze wet bepaalde wordt onder werkgever verstaan de persoon, tot wie
      een werknemer in dienstbetrekking staat.

      2 In het geval, bedoeld in [artikel 2, tweede lid][ref1], wordt onder werkgever verstaan de persoon, met wie de
      overeenkomst van opdracht is gesloten.

      3 Ingeval toepassing wordt gegeven aan [artikel 2, derde lid][ref2], wordt tevens bij of krachtens algemene
      maatregel van bestuur bepaald wie in de daarbij betrokken gevallen onder werkgever wordt verstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002638#Artikel2
