  - number: '11'
    text: |-
      1 Indien ten aanzien van een werknemer op grond van een collectieve arbeidsovereenkomst, publiekrechtelijke
      regeling of een schriftelijke arbeidsovereenkomst sprake is van een vaste overeengekomen arbeidsduur per week en
      een vaste beloning per maand, wordt aan de werknemer ten minste het minimumuurloon dat geldt in het betreffende
      tijdvak over het gemiddeld aantal arbeidsuren van de betreffende maand, afgeleid van het totaal aantal arbeidsuren
      dat de betreffende werknemer arbeid verricht in dat kalenderjaar, betaald.

      2 Indien bij publiekrechtelijke regeling of collectieve arbeidsovereenkomst een periode van afrekening, welke
      meerdere uitbetalingstermijnen omvat, is vastgesteld, wordt zodanige periode van afrekening voor de toepassing van
      de [artikelen 7, zesde lid][ref1], [8][ref2] en [13a][ref3] als uitbetalingstermijn beschouwd. Een periode van
      afrekening kan ten hoogste twaalf maanden omvatten.


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002638#Artikel8
