  - number: 5.3.1
    text: |-
      De meetverantwoordelijke:

      a. verzamelt bij uurlijks bemeten meetinrichtingen op elektronische wijze uurlijks de in
      [4.3.4.1 onderdeel a][ref1] genoemde meetgegevens en slaat deze op in niet-vluchtige databuffers;

      b. verzamelt bij minimaal maandelijks bemeten meetinrichtingen op elektronische wijze maandelijks, of zoveel vaker
      als nodig vanwege de opslagcapaciteit van de vluchtige databuffer, de in [4.3.4.1 onderdeel a][ref2] genoemde
      meetgegevens, waarbij geldt dat de resolutie van de meetgegevens niet beïnvloed wordt en dat er geen gegevens
      verloren gaan en slaat deze op in niet-vluchtige databuffers;

      c. verzamelt maandelijks de in [4.3.4.1 sub b][ref3] genoemde gegevens en slaat deze op in niet-vluchtige
      databuffers.


      [ref1]: https://wetten.overheid.nl/BWBR0037925#Artikel4.3.4.1
      [ref2]: https://wetten.overheid.nl/BWBR0037925#Artikel4.3.4.1
      [ref3]: https://wetten.overheid.nl/BWBR0037925#Artikel4.3.4.1
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel5.3.1
