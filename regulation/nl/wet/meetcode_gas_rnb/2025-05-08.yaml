        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 5.3.4
    text: |-
      Kennisneming van de in [5.3.1][ref1], [5.3.2][ref2] en [5.3.3][ref3] bedoelde meetgegevens is voorbehouden aan die
      partijen die daartoe op grond van deze code, wetgeving en/of rechtsgeldig gesloten overeenkomsten zijn gerechtigd.


      [ref1]: https://wetten.overheid.nl/BWBR0037925#Artikel5.3.1
