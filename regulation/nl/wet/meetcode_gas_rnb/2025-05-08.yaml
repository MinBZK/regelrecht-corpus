preamble:
  text: |-
    Gelet op artikel 12f, eerste lid van de Gaswet;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#ArtikelAanhef
articles:
  - number: 1.1.1
    text: |-
      Deze code bevat de voorwaarden zoals bedoeld in [artikel 12b, eerste lid, onderdeel b, van de Gaswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel12b
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel1.1.1
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: 12b
  - number: 1.1.2
    text: |-
      Meetinrichtingen voldoen ten minste aan de daaraan in of krachtens de [wet][ref1] gestelde eisen. Ingeval van
      strijdigheid tussen een dwingende wettelijke eis en een eis uit deze code, geldt de dwingende wettelijke eis.


      [ref1]: https://wetten.overheid.nl/BWBR0011440
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel1.1.2
    references:
      - id: ref1
        bwb_id: BWBR0011440
  - number: 1.1.3
    text: |-
      De in deze code gebruikte begrippen die ook in de [Gaswet][ref1] worden gebruikt, hebben de betekenis die daaraan
      in de Gaswet is toegekend. Van de overige in deze code gebruikte begrippen is de betekenis vastgelegd in de
      [Begrippencode gas][ref2] behorende bij de voorwaarden bedoeld in [artikel 12b van de Gaswet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0011440
      [ref2]: https://wetten.overheid.nl/BWBR0037923
      [ref3]: https://wetten.overheid.nl/BWBR0011440#Artikel12b
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel1.1.3
    references:
      - id: ref1
        bwb_id: BWBR0011440
      - id: ref2
        bwb_id: BWBR0037923
      - id: ref3
        bwb_id: BWBR0011440
        artikel: 12b
  - number: 1.1.4
    text: |-
      In zoverre een meetinrichting onder de [Metrologiewet][ref1] valt, is deze code niet van toepassing ten aanzien van
      een onderwerp dat voor die meetinrichting in de Metrologiewet wordt geregeld.


      [ref1]: https://wetten.overheid.nl/BWBR0019517
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel1.1.4
    references:
      - id: ref1
        bwb_id: BWBR0019517
  - number: 1.2.1.1
    text: |-
      De meterbeheerder participeert in het door de toezichthouder op de [Metrologiewet][ref1] goedgekeurde systeem van
      systematische (steekproefsgewijze) periodieke controle van in gebruik zijnde meters zoals uitgevoerd in opdracht
      van de deelnemende meterbeheerders gezamenlijk of toont aan op andere, ter beoordeling van de toezichthouder op de
      Metrologiewet, aanvaardbare gelijkwaardige wijze te voorzien in een dergelijke controle.


      [ref1]: https://wetten.overheid.nl/BWBR0019517
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel1.2.1.1
    references:
      - id: ref1
        bwb_id: BWBR0019517
  - number: 1.2.2.1
    text: |-
      Het deel van de op afstand uitleesbare kleinverbruikmeetinrichting dat geplaatst moet worden in het perceel
      van de aangeslotene wordt geplaatst door een meterplaatser die is erkend conform bijlage 4 of door de regionale
      netbeheerder.
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel1.2.2.1
  - number: 1.2.2.2
    text: |-
      De regionale netbeheerder verstrekt aan de meterplaatser op diens verzoek:

      a. de bedrijfsspecifieke informatie die nodig is voor het uitvoeren van werkzaamheden, aan of in de onmiddellijke
      nabijheid van de aansluiting, die verband houden met de plaatsing van meetinrichtingen;

      b. het recht om verzegelingen die door of vanwege de regionale netbeheerder zijn aangebracht te schenden of
      verbreken indien dit noodzakelijk is voor het uitvoeren van werkzaamheden aan of in de onmiddellijke nabijheid van
      de aansluiting, die verband houden met de plaatsing van meetinrichtingen;

      c. het recht om namens de regionale netbeheerder verzegelingen aan te brengen conform de in [4.1.2 ][ref1] genoemde
      voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0037925#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel1.2.2.2
    references:
      - id: ref1
        bwb_id: BWBR0037925
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 1.2.3.1
    text: |-
      Tot het uitoefenen van meetverantwoordelijkheid voor een grootverbruikaansluiting zijn personen toegelaten die
      hiervoor conform bijlage 3.2 zijn erkend.
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel1.2.3.1
  - number: 1.2.3.2
    text: |-
      Per grootverbruikaansluiting is er één meetverantwoordelijke voor alle uit de [hoofdstukken 4][ref1], [5][ref2] en
      [6][ref3] van deze code voortvloeiende werkzaamheden.


      [ref1]: https://wetten.overheid.nl/BWBR0037925#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0037925#Hoofdstuk5
      [ref3]: https://wetten.overheid.nl/BWBR0037925#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel1.2.3.2
    references:
      - id: ref1
        bwb_id: BWBR0037925
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0037925
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0037925
        hoofdstuk: '6'
  - number: 1.2.3.3
    text: |-
      Een aangeslotene die de meetverantwoordelijkheid voor zijn grootverbruikaansluiting(en) niet zelf uitoefent, draagt
      die meetverantwoordelijkheid over aan een in [1.2.3.1][ref1] bedoelde persoon.


      [ref1]: https://wetten.overheid.nl/BWBR0037925#Artikel1.2.3.1
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel1.2.3.3
    references:
      - id: ref1
        bwb_id: BWBR0037925
        artikel: 1.2.3.1
        hoofdstuk: '1'
        paragraaf: '1.2'
  - number: 1.2.3.4
    text: |-
      Indien de aangeslotene bij ingebruikname van de grootverbruikaansluiting geen meetverantwoordelijke aanwijst,
      of indien de aangeslotene de regionale netbeheerder hieromtrent verzoekt, wijst de regionale netbeheerder voor
      de aangeslotene een meetverantwoordelijke aan. De aangeslotene heeft het recht om van meetverantwoordelijke te
      wisselen.
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel1.2.3.4
  - number: 1.2.3.5
    text: |-
      Een aangeslotene die de meetverantwoordelijkheid voor zijn aansluiting(en) niet zelf uitoefent, machtigt een
      meetverantwoordelijke voor het opvragen van informatie uit het aansluitingenregister van de regionale netbeheerder,
      betrekking hebbend op de aansluiting van de aangeslotene alsmede voor het afwikkelen van het proces van overdracht
      van meetverantwoordelijkheid.
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel1.2.3.5
  - number: 1.2.4.1
    text: |-
      De eigenaar van de meetinrichting is gerechtigd vanaf tien werkdagen na de datum waarop de beheerovereenkomst
      afloopt (delen van) de meetinrichting te (laten) verwijderen. Hierbij dient de meetverantwoordelijke ervoor te
      zorgen dat het overdrachtspunt in goede en veilige toestand achter blijft.
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel1.2.4.1
  - number: 1.2.4.2
    text: |-
      Ingeval tussen de aangeslotene en een andere meetverantwoordelijke binnen tien werkdagen na beëindiging van de
      oude beheerovereenkomst alsnog een beheerovereenkomst in werking treedt, wordt voor zover van toepassing vanaf dat
      moment de werkwijze volgens [4.6 van de Informatiecode Elektriciteit en Gas][ref1] gevolgd.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Paragraaf4.6
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel1.2.4.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        paragraaf: '4.6'
  - number: 1.2.4.3
    text: Indien niet voldaan wordt aan het gestelde in 1.2.4.3, deactiveert de regionale netbeheerder de aansluiting.
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel1.2.4.3
  - number: 1.2.5.1
    text: |-
      De vangnetregeling is van toepassing vanaf het moment dat de erkenning van de meetverantwoordelijke is ingetrokken
      tot het moment dat er voor de desbetreffende aansluiting een nieuwe meetverantwoordelijke is aangewezen.
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel1.2.5.1
  - number: 1.2.5.2
    text: |-
      Telemetriegrootverbruikers hebben tien werkdagen de tijd om een nieuwe meetverantwoordelijke aan te wijzen. De
      overige aangeslotenen hebben 40 werkdagen de tijd om een nieuwe meetverantwoordelijke aan te wijzen.
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel1.2.5.2
  - number: 1.2.5.3
    text: |-
      Indien de aangeslotene niet zelf binnen de in [1.2.5.2][ref1] genoemde termijn een nieuwe meetverantwoordelijke
      aanwijst, wijst de regionale netbeheerder voor de aangeslotene een nieuwe meetverantwoordelijke aan.


      [ref1]: https://wetten.overheid.nl/BWBR0037925#Artikel1.2.5.2
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel1.2.5.3
    references:
      - id: ref1
        bwb_id: BWBR0037925
        artikel: 1.2.5.2
        hoofdstuk: '1'
        paragraaf: '1.2'
  - number: 1.2.5.4
    text: |-
      Onverwijld nadat hij bericht heeft ontvangen van de intrekking van de erkenning meldt de regionale netbeheerder de
      desbetreffende aangeslotene of diens gemachtigde bij aangetekende brief, dat:

      a. de erkenning van de door of namens hem aangewezen meetverantwoordelijke is ingetrokken;

      b. in verband met het intrekken van de erkenning van de door of namens de aangeslotene aangewezen
      meetverantwoordelijke de vangnetregeling in werking treedt;

      c. de aangeslotene verplicht is er alles aan te doen om te voorkomen dat zolang de vangnetregeling van toepassing
      is, de meetinrichting en de eventueel daarbij behorende communicatiemiddelen worden verwijderd of gewijzigd of niet
      meer functioneren of kunnen functioneren;

      d. de aangeslotene de gelegenheid heeft om binnen de in [1.2.5.2][ref1] genoemde termijn een nieuwe
      meetverantwoordelijke aan te wijzen;

      e. indien de aangeslotene niet zelf binnen de in [1.2.5.2][ref2] genoemde termijn een nieuwe meetverantwoordelijke
      aanwijst, de regionale netbeheerder voor de aangeslotene een nieuwe meetverantwoordelijke aanwijst, waarbij de
      regionale netbeheerder ten behoeve van de aangeslotene aangeeft wat de tarieven en voorwaarden zijn die door de
      door hem aan te wijzen meetverantwoordelijke worden gehanteerd, dan wel aangeeft op welke wijze deze tarieven en
      voorwaarden voor de aangeslotene toegankelijk zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0037925#Artikel1.2.5.2
      [ref2]: https://wetten.overheid.nl/BWBR0037925#Artikel1.2.5.2
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel1.2.5.4
    references:
      - id: ref1
        bwb_id: BWBR0037925
        artikel: 1.2.5.2
        hoofdstuk: '1'
        paragraaf: '1.2'
      - id: ref2
        bwb_id: BWBR0037925
        artikel: 1.2.5.2
        hoofdstuk: '1'
        paragraaf: '1.2'
  - number: 1.2.5.5
    text: |-
      Indien mogelijk treft de regionale netbeheerder bij aangeslotenen met een telemetriegrootverbruikmeetinrichting,
      waarbij de verzameling van meetgegevens, zoals bedoeld in [5.3.1][ref1], en de overdracht van meetgegevens, zoals
      bedoeld in [6.4.2 van de Informatiecode Elektriciteit en Gas][ref2], ondanks de intrekking van de erkenning van de
      meetverantwoordelijke correct blijven functioneren, een regeling met de desbetreffende programmaverantwoordelijke
      om de desbetreffende meetgegevens te gebruiken zolang de vangnetregeling van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0037925#Artikel5.3.1
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Paragraaf6.4.2
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel1.2.5.5
    references:
      - id: ref1
        bwb_id: BWBR0037925
        artikel: 5.3.1
        hoofdstuk: '5'
        paragraaf: '5.3'
      - id: ref2
        bwb_id: BWBR0037934
        paragraaf: 6.4.2
  - number: 1.2.5.6
    text: |-
      Indien de in [1.2.5.5][ref1] genoemde oplossing niet mogelijk is, worden, zolang de vangnetregeling van toepassing
      is, de meetgegevens ten behoeve van de allocatie, voor aansluitingen met een telemetriegrootverbruikmeetinrichting,
      vastgesteld op basis van:

      a. het jaarverbruik van de voorafgaande periode en

      b. een profiel dat, indien mogelijk, is gebaseerd op historische meetgegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0037925#Artikel1.2.5.5
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel1.2.5.6
    references:
      - id: ref1
        bwb_id: BWBR0037925
        artikel: 1.2.5.5
        hoofdstuk: '1'
        paragraaf: '1.2'
  - number: 1.2.5.7
    text: |-
      Het in [1.2.5.6][ref1] bedoelde, op historische meetgegevens gebaseerde profiel wordt door de regionale
      netbeheerder vastgesteld na overleg met de aangeslotene.


      [ref1]: https://wetten.overheid.nl/BWBR0037925#Artikel1.2.5.6
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel1.2.5.7
    references:
      - id: ref1
        bwb_id: BWBR0037925
        artikel: 1.2.5.6
        hoofdstuk: '1'
        paragraaf: '1.2'
  - number: 1.2.5.8
    text: |-
      Indien voor het in [1.2.5.6][ref1] bedoelde profiel geen gebruik gemaakt kan worden van historische meetgegevens
      wordt gebruik gemaakt van een, door de gezamenlijke netbeheerders en de programma-verantwoordelijken vooraf
      vastgesteld, noodprofiel.


      [ref1]: https://wetten.overheid.nl/BWBR0037925#Artikel1.2.5.6
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel1.2.5.8
    references:
      - id: ref1
        bwb_id: BWBR0037925
        artikel: 1.2.5.6
        hoofdstuk: '1'
        paragraaf: '1.2'
  - number: 1.2.5.9
    text: |-
      Zolang de vangnetregeling van toepassing is, is de meetverantwoordelijke wiens erkenning is ingetrokken,
      alsmede een eventuele beoogde nieuwe meetverantwoordelijke verplicht er alles aan te doen om te voorkomen dat de
      meetinrichting en de eventueel daarbij behorende communicatiemiddelen worden verwijderd of gewijzigd of niet meer
      functioneren of kunnen functioneren.
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel1.2.5.9
  - number: 1.2.5.10
    text: |-
      In het geval de meetverantwoordelijke in faillissement verkeert of surseance van betaling is verleend, wijst
      de MV-erkenner de curator respectievelijk bewindvoerder op de verplichting zoals genoemd in [1.2.5.9.][ref1] Zo
      nodig stelt de MV-erkenner zich garant voor de eventuele kosten hiervan, maximaal gedurende de periode dat de
      vangnetregeling van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0037925#Artikel1.2.5.9
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel1.2.5.10
    references:
      - id: ref1
        bwb_id: BWBR0037925
        artikel: 1.2.5.9
        hoofdstuk: '1'
        paragraaf: '1.2'
  - number: 1.2.5.11
    text: |-
      Indien er, nadat de nieuwe meetverantwoordelijke is aangewezen, nog geen overdracht van meetgegevens kan plaats
      vinden zoals bedoeld in [6.4.2 van de Informatiecode Elektriciteit en Gas][ref1], treft de regionale netbeheerder
      met de nieuwe meetverantwoordelijke en de programmaverantwoordelijke die het aangaat een regeling omtrent de te
      gebruiken meetwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Paragraaf6.4.2
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel1.2.5.11
    references:
      - id: ref1
        bwb_id: BWBR0037934
        paragraaf: 6.4.2
  - number: 1.2.5.12
    text: |-
      Indien er sprake is van een telemetriegrootverbruikmeetinrichting, stelt de nieuwe meetverantwoordelijke onverwijld
      vast wat de meterstanden zijn aan het begin en het einde van de periode waarop de vangnetregeling van toepassing is
      geweest, alsmede het verbruik gedurende die periode, en geeft deze door aan de regionale netbeheerder.
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel1.2.5.12
  - number: 1.2.5.13
    text: |-
      Indien er geen sprake is van een telemetriegrootverbruikmeetinrichting en indien de dataverzameling als bedoeld in
      [5.2.1][ref1] of [5.2.2][ref2] plaats zou moeten vinden in de periode waarin de vangnetregeling van toepassing is,
      wordt deze datacollectie opgeschort en vindt deze plaats binnen een maand nadat de nieuwe meetverantwoordelijke
      is aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0037925#Artikel5.2.1
      [ref2]: https://wetten.overheid.nl/BWBR0037925#Artikel5.2.2
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel1.2.5.13
    references:
      - id: ref1
        bwb_id: BWBR0037925
        artikel: 5.2.1
        hoofdstuk: '5'
        paragraaf: '5.2'
      - id: ref2
        bwb_id: BWBR0037925
        artikel: 5.2.2
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: 2.1.1
    text: |-
      De bepalingen van [hoofdstuk 2][ref1] zijn van toepassing op meetinrichtingen die verbonden zijn met netkoppelingen
      en de aansluiting van aangeslotenen.


      [ref1]: https://wetten.overheid.nl/BWBR0037925#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel2.1.1
    references:
      - id: ref1
        bwb_id: BWBR0037925
        hoofdstuk: '2'
  - number: 2.1.2
    text: |-
      Meetinrichtingen in het overdrachtspunt van een aansluiting op een gastransportnet waarvan de gasdruk hoger is
      dan 8 bar (overdruk) on meetinrichtingen in het overdrachtspunt tussen twee gastransportnetten waarbij de gasdruk
      in den of beide gastransportnetten hoger is dan 8 bar (overdruk) voldoen aan de technische eisen genoemd in de
      [Meetcode gas LNB][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037935
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel2.1.2
    references:
      - id: ref1
        bwb_id: BWBR0037935
  - number: 2.2.1
    text: |-
      In het (de) overdrachtspunt(en) van een aansluiting met een totale maximale capaciteit van ten hoogste 40
      m3(n) per uur is een niet op afstand uitleesbare kleinverbruikmeetinrichting of een op afstand uitleesbare
      kleinverbruikmeetinrichting aanwezig.
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel2.2.1
  - number: 2.3.1
    text: |-
      Een aansluiting, waarop de aangeslotene conform [4.3.1.3][ref1] of [4.3.1.8 van de Allocatiecode gas][ref2] de
      afnamecategorie GGV respectievelijk GIS toegekend heeft gekregen, alsmede een netkoppeling tussen twee regionale
      gastransportnetten zoals bedoeld in [B5.2.4 van de Allocatiecode gas](onbekend), dient een uurlijks uitleesbare
      telemetriegrootverbruikmeetinrichting, zoals beschreven in [4.3.4][ref3] te hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0037931#Artikel4.3.1.3
      [ref2]: https://wetten.overheid.nl/BWBR0037931#Artikel4.3.1.8
      [ref3]: https://wetten.overheid.nl/BWBR0037925#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel2.3.1
    references:
      - id: ref1
        bwb_id: BWBR0037931
        artikel: 4.3.1.3
      - id: ref2
        bwb_id: BWBR0037931
        artikel: 4.3.1.8
      - id: ref3
        bwb_id: BWBR0037925
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 2.3.2
    text: |-
      Een aansluiting, waarop de aangeslotene conform [4.3.1.5][ref1] of [4.3.1.10 van de Allocatiecode gas][ref2] de
      afnamecategorie GXX respectievelijk GIN toegekend heeft gekregen, dient een minimaal maandelijks uitleesbare of een
      uurlijks uitleesbare telemetriegrootverbruikmeetinrichting, zoals beschreven in [4.3.4][ref3] te hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0037931#Artikel4.3.1.5
      [ref2]: https://wetten.overheid.nl/BWBR0037931#Artikel4.3.1.10
      [ref3]: https://wetten.overheid.nl/BWBR0037925#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel2.3.2
    references:
      - id: ref1
        bwb_id: BWBR0037931
        artikel: 4.3.1.5
      - id: ref2
        bwb_id: BWBR0037931
        artikel: 4.3.1.10
      - id: ref3
        bwb_id: BWBR0037925
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 2.3.3
    text: |-
      Een aansluiting, waarop de aangeslotene conform [4.3.1.7 van de Allocatiecode gas][ref1] de afnamecategorie
      G2C toegekend heeft gekregen, dient een profielgrootverbruikmeetinrichting zoals beschreven in [4.3.3][ref2],
      een minimaal maandelijks uitleesbare of een uurlijks uitleesbare telemetriegrootverbruikmeetinrichting, zoals
      beschreven in[ 4.3.4][ref3] te hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0037931#Artikel4.3.1.7
      [ref2]: https://wetten.overheid.nl/BWBR0037925#Hoofdstuk4
      [ref3]: https://wetten.overheid.nl/BWBR0037925#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel2.3.3
    references:
      - id: ref1
        bwb_id: BWBR0037931
        artikel: 4.3.1.7
      - id: ref2
        bwb_id: BWBR0037925
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref3
        bwb_id: BWBR0037925
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 2.4.1
    text: |-
      De meterbeheerder van een meetinrichting in de netkoppeling van regionale netbeheerders is een door de beide
      regionale netbeheerders aangewezen meetverantwoordelijke.
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel2.4.1
  - number: 2.4.2
    text: De meterbeheerder van een meetinrichting van een kleinverbruikaansluiting is de regionale netbeheerder.
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel2.4.2
  - number: 2.4.3
    text: |-
      De meterbeheerder van een meetinrichting van een grootverbruikaansluiting is de door de aangeslotene aangewezen
      meetverantwoordelijke.
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel2.4.3
  - number: 3.1.1
    text: |-
      Er is sprake van prioriteitsplaatsing indien de aangeslotene op zijn verzoek of op verzoek van een derde ten
      behoeve van zijn kleinverbruikaansluiting – voorafgaande aan de collectieve uitrol van op afstand uitleesbare
      kleinverbruikmeetinrichtingen in de desbetreffende wijk, de beschikking krijgt over een door of namens de regionale
      netbeheerder geplaatste op afstand uitleesbare kleinverbruikmeetinrichting.
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel3.1.1
  - number: 3.1.2
    text: |-
      Indien de aangeslotene dit verzoekt, komt hij in aanmerking voor een prioriteitsplaatsing. Voor de aanvraag van een
      prioriteitsplaatsing is [paragraaf 3.2][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0037925#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel3.1.2
    references:
      - id: ref1
        bwb_id: BWBR0037925
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 3.1.3
    text: |-
      Er is sprake van een plaatsing door derden van een op afstand uitleesbare kleinverbruikmeetinrichting indien een
      aangeslotene ten behoeve van zijn kleinverbruikaansluiting – voorafgaande aan de collectieve uitrol van op afstand
      uitleesbare kleinverbruikmeetinrichtingen in de desbetreffende wijk -de beschikking krijgt over een door een
      meterplaatser geplaatste op afstand uitleesbare kleinverbruikmeetinrichting.
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel3.1.3
  - number: 3.1.4
    text: |-
      Voor het op verzoek van de aangeslotene door een ander dan de regionale netbeheerder ter beschikking stellen
      van een door de regionale netbeheerder te leveren op afstand uitleesbare kleinverbruikmeetinrichting, is
      [paragraaf 3.3][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0037925#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel3.1.4
    references:
      - id: ref1
        bwb_id: BWBR0037925
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: 3.1.5
    text: |-
      Voor het op verzoek van de aangeslotene door een ander dan de regionale netbeheerder ter beschikking stellen
      van een niet door de regionale netbeheerder te leveren op afstand uitleesbare kleinverbruikmeetinrichting, is
      [paragraaf 3.4][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0037925#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel3.1.5
    references:
      - id: ref1
        bwb_id: BWBR0037925
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: 3.2.1
    text: |-
      Indien de aangeslotene of een derde een prioriteitsplaatsing wenst, geeft de aangeslotene of diens gemachtigde de
      regionale netbeheerder opdracht voor een prioriteitsplaatsing en verstrekt daarbij de volgende gegevens:

      a. de EAN-code van de aansluiting;

      b. de naam van de aangeslotene met wie de aansluit- en transportovereenkomst is gesloten, alsmede de adresgegevens,
      zijnde straatnaam, huisnummer met eventuele toevoegingen, postcode en plaatsnaam of eventuele alternatieve
      locatieaanduidingen, behorend bij het overdrachtspunt van de aansluiting;

      c. correspondentieadres en gegevens voor facturering van de kosten voor de prioriteitsplaatsing.
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel3.2.1
  - number: 3.2.2
    text: |-
      De regionale netbeheerder controleert:

      a. of de melding aan de juiste regionale netbeheerder is gedaan;

      b. of het een aansluiting betreft die in aanmerking komt voor plaatsing van een op afstand uitleesbare
      kleinverbruikmeetinrichting;

      c. of er op de desbetreffende aansluiting nog geen op afstand uitleesbare kleinverbruikmeetinrichting is geplaatst;

      d. of plaatsing van de meter op het adres niet binnen drie maanden is ingepland door de regionale netbeheerder;

      e. voor zover dit op afstand is te bepalen: of plaatsing van de meter technisch mogelijk is;

      f. voor zover dit op afstand is te bepalen: of plaatsing van de meter financieel redelijk is en of dit in
      verhouding staat tot potentiële energiebesparingen.
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel3.2.2
  - number: 3.2.3
    text: |-
      Het resultaat van de in [3.2.2][ref1] genoemde vaststelling wordt binnen vijf werkdagen na de in [3.2.1][ref2]
      bedoelde aanvraag meegedeeld aan de aangeslotene of diens gemachtigde. Indien niet aan alle in 3.2.2 genoemde
      criteria wordt voldaan, wordt de procedure prioriteitsplaatsing gestopt.


      [ref1]: https://wetten.overheid.nl/BWBR0037925#Artikel3.2.2
      [ref2]: https://wetten.overheid.nl/BWBR0037925#Artikel3.2.1
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel3.2.3
    references:
      - id: ref1
        bwb_id: BWBR0037925
        artikel: 3.2.2
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0037925
        artikel: 3.2.1
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 3.2.4
    text: |-
      De regionale netbeheerder neemt binnen drie maanden na de in [3.2.1][ref1] bedoelde aanvraag de oude meetinrichting
      weg en plaatst de nieuwe op afstand uitleesbare kleinverbruikmeetinrichting.


      [ref1]: https://wetten.overheid.nl/BWBR0037925#Artikel3.2.1
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel3.2.4
    references:
      - id: ref1
        bwb_id: BWBR0037925
        artikel: 3.2.1
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 3.2.5
    text: |-
      De in [3.2.4][ref1] genoemde verplichting van de regionale netbeheerder vervalt indien het niet lukt om in de in
      3.2.4 genoemde periode een afspraak over de plaatsing te maken met de aangeslotene of indien de aangeslotene zich
      niet houdt aan de gemaakte afspraak.


      [ref1]: https://wetten.overheid.nl/BWBR0037925#Artikel3.2.4
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel3.2.5
    references:
      - id: ref1
        bwb_id: BWBR0037925
        artikel: 3.2.4
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 3.2.6
    text: |-
      Nadat geconstateerd is dat de nieuwe meetinrichting gedurende vijf aaneengesloten dagen op afstand uitleesbaar is,
      wordt de aangeslotene of diens gemachtigde hierover door de regionale netbeheerder geïnformeerd.
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel3.2.6
  - number: 3.3.1
    text: |-
      Een ander dan de regionale netbeheerder die op verzoek van de aangeslotene, conform [artikel 13d, lid 6][ref1] of
      [artikel 13e, lid 7 van de Wet][ref2], er zorg voor draagt dat de afnemer beschikt over een op afstand uitleesbare
      kleinverbruikmeetinrichting meldt de voorgenomen plaatsing van een door de regionale netbeheerder te leveren op
      afstand uitleesbare kleinverbruikmeetinrichting aan de regionale netbeheerder en verstrekt daarbij de volgende
      gegevens:

      a. de EAN-code van de aansluiting;

      b. de naam van de aangeslotene met wie de aansluit- en transportovereenkomst is gesloten, alsmede de adresgegevens,
      zijnde straatnaam, huisnummer met eventuele toevoegingen, postcode en plaatsnaam of eventuele alternatieve
      locatieaanduidingen, behorend bij het overdrachtspunt van de aansluiting;

      c. naam en contactgegevens van de meterplaatser;

      d. naam en contactgegevens van de aanvrager.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel13d
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel13e
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel3.3.1
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: 13d
      - id: ref2
        bwb_id: BWBR0011440
        artikel: 13e
  - number: 3.3.2
    text: |-
      De regionale netbeheerder controleert of:

      a. de meterplaatser is erkend;

      b. het een aansluiting betreft die in aanmerking komt voor plaatsing van een op afstand uitleesbare
      kleinverbruikmeetinrichting;

      c. de melding aan de juiste regionale netbeheerder is gedaan;

      d. er op de desbetreffende aansluiting nog geen op afstand uitleesbare kleinverbruikmeetinrichting is geplaatst;

      e. plaatsing van de meter op het adres niet binnen drie maanden is ingepland door de regionale netbeheerder.
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel3.3.2
  - number: 3.3.3
    text: |-
      Het resultaat van de in [3.3.2][ref1] genoemde vaststelling wordt binnen vijf werkdagen na de in [3.3.1][ref2]
      bedoelde melding meegedeeld aan de ander dan de regionale netbeheerder die op verzoek van de aangeslotene conform
      [artikel 13d, zesde lid][ref3], of [artikel 13e, zevende lid, van de Wet][ref4], er zorg voor draagt dat de
      aangeslotene beschikt over een op afstand uitleesbare kleinverbruikmeetinrichting. Indien niet aan alle in 3.3.2
      genoemde criteria wordt voldaan, wordt de procedure plaatsing door derden van een door de regionale netbeheerder
      geleverde meetinrichting gestopt.


      [ref1]: https://wetten.overheid.nl/BWBR0037925#Artikel3.3.2
      [ref2]: https://wetten.overheid.nl/BWBR0037925#Artikel3.3.1
      [ref3]: https://wetten.overheid.nl/BWBR0011440#Artikel13d
      [ref4]: https://wetten.overheid.nl/BWBR0011440#Artikel13e
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel3.3.3
    references:
      - id: ref1
        bwb_id: BWBR0037925
        artikel: 3.3.2
        hoofdstuk: '3'
        paragraaf: '3.3'
      - id: ref2
        bwb_id: BWBR0037925
        artikel: 3.3.1
        hoofdstuk: '3'
        paragraaf: '3.3'
      - id: ref3
        bwb_id: BWBR0011440
        artikel: 13d
      - id: ref4
        bwb_id: BWBR0011440
        artikel: 13e
  - number: 3.3.4
    text: |-
      De meterplaatser neemt binnen vijftien werkdagen na de in [3.3.3][ref1] bedoelde melding contact op met de
      regionale netbeheerder voor het maken van afspraken over de datum en het tijdstip van de verwijdering van de oude
      meetinrichting en plaatsing van de nieuwe meetinrichting.


      [ref1]: https://wetten.overheid.nl/BWBR0037925#Artikel3.3.3
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel3.3.4
    references:
      - id: ref1
        bwb_id: BWBR0037925
        artikel: 3.3.3
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: 3.3.5
    text: |-
      De regionale netbeheerder verstrekt uiterlijk vijf werkdagen voor de conform [3.3.4][ref1] geplande plaatsing:

      a. de te plaatsen op afstand uitleesbare kleinverbruikmeetinrichting met de daarbij behorende gebruiks- en montage-
      en transportinstructies

      b. de meterwisselgegevens:

        - het meternummer van de huidige meetinrichting;
        - de marge waarbinnen de tellerstand(en) van de huidige meetinrichting moeten liggen ten tijde van de plaatsing.


      [ref1]: https://wetten.overheid.nl/BWBR0037925#Artikel3.3.4
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel3.3.5
    references:
      - id: ref1
        bwb_id: BWBR0037925
        artikel: 3.3.4
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: 3.3.6
    text: |-
      De meterplaatser controleert of de vastgelegde tellerstanden van de oude meetinrichting zich binnen de in
      [3.3.5][ref1] bedoelde marge bevinden en of het meternummer van de oude meetinrichting klopt.


      [ref1]: https://wetten.overheid.nl/BWBR0037925#Artikel3.3.5
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel3.3.6
    references:
      - id: ref1
        bwb_id: BWBR0037925
        artikel: 3.3.5
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: 3.3.7
    text: |-
      De meterplaatser neemt de oude meetinrichting weg en plaatst de door de regionale netbeheerder verstrekte op
      afstand uitleesbare kleinverbruikmeetinrichting.
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel3.3.7
  - number: 3.3.8
    text: |-
      De meterplaatser legt ter plekke vast:

      a. de naam van de aangeslotene met wie de aansluit- en transportovereenkomst is gesloten, alsmede de adresgegevens,
      zijnde straatnaam, huisnummer met eventuele toevoegingen, postcode en plaatsnaam of eventuele alternatieve
      locatieaanduidingen, behorend bij het overdrachtspunt van de aansluiting;

      b. de datum van de meterwisseling;

      c. het meternummer en de tellerstand(en) van de oude meetinrichting;

      d. het meternummer en de tellerstand(en) van de nieuwe meetinrichting;

      en laat de aangeslotene met het plaatsen van zijn/haar handtekening verklaren dat hij/zij akkoord gaat met
      bovengenoemde gegevens.
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel3.3.8
  - number: 3.3.9
    text: |-
      Indien de aangeslotene niet verklaart dat de tellerstand(en) van de oude meetinrichting juist zijn, zorgt de
      meterplaatser voor een foto met tellerstanden en meternummer.
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel3.3.9
  - number: 3.3.10
    text: |-
      De meterplaatser verzendt de in [3.3.8][ref1] genoemde gegevens binnen een werkdag na de dag van plaatsing in
      een door de gezamenlijke netbeheerders opgesteld format voor elektronische gegevensuitwisseling aan de regionale
      netbeheerder.


      [ref1]: https://wetten.overheid.nl/BWBR0037925#Artikel3.3.8
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel3.3.10
    references:
      - id: ref1
        bwb_id: BWBR0037925
        artikel: 3.3.8
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: 3.3.11
    text: |-
      De meterplaatser levert de oude meetinrichting conform de in [3.3.4][ref1] genoemde afspraken af bij de regionale
      netbeheerder.


      [ref1]: https://wetten.overheid.nl/BWBR0037925#Artikel3.3.4
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel3.3.11
    references:
      - id: ref1
        bwb_id: BWBR0037925
        artikel: 3.3.4
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: 3.3.12
    text: |-
      De regionale netbeheerder controleert of de nieuwe meetinrichting gedurende vijf aaneengesloten dagen op afstand
      uitleesbaar is. Indien dit niet het geval is wordt de meterplaatser in de gelegenheid gesteld om het probleem
      uiterlijk binnen tien werkdagen op te lossen.
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel3.3.12
  - number: 3.3.13
    text: |-
      Nadat geconstateerd is dat de nieuwe meetinrichting gedurende vijf aaneengesloten dagen op afstand
      uitleesbaar is, wordt de plaatsing geaccepteerd door de regionale netbeheerder en worden de ander dan
      de regionale netbeheerder die op verzoek van de aangeslotene conform [artikel 13d, zesde lid][ref1], of
      [artikel 13e, zevende lid, van de Wet][ref2], er zorg voor draagt dat de aangeslotene beschikt over een op afstand
      uitleesbare kleinverbruikmeetinrichting en de meterplaatser hierover geïnformeerd door de regionale netbeheerder.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel13d
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel13e
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel3.3.13
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: 13d
      - id: ref2
        bwb_id: BWBR0011440
        artikel: 13e
  - number: 3.3.14
    text: |-
      De regionale netbeheerder neemt, na acceptatie, de nieuw geplaatste op afstand uitleesbare
      kleinverbruikmeetinrichting in beheer en betaalt de bij of krachtens de [Wet][ref1] daartoe vastgestelde
      vergoeding.


      [ref1]: https://wetten.overheid.nl/BWBR0011440
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel3.3.14
    references:
      - id: ref1
        bwb_id: BWBR0011440
  - number: 3.3.15
    text: |-
      De regionale netbeheerder bewaart de op grond van [3.3.10][ref1] ontvangen gegevens tenminste twee jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0037925#Artikel3.3.10
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel3.3.15
    references:
      - id: ref1
        bwb_id: BWBR0037925
        artikel: 3.3.10
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: 3.4.1
    text: |-
      Een ander dan de regionale netbeheerder die op verzoek van de aangeslotene conform [artikel 13d, zesde lid][ref1],
      of [artikel 13e, zevende lid, van de Wet][ref2], er zorg voor draagt dat de aangeslotene beschikt over een op
      afstand uitleesbare kleinverbruikmeetinrichting meldt de voorgenomen plaatsing van een niet door de regionale
      netbeheerder geleverde op afstand uitleesbare kleinverbruikmeetinrichting aan de regionale netbeheerder en
      verstrekt daarbij de volgende gegevens:

      a. de EAN-code van de aansluiting;

      b. de naam van de aangeslotene met wie de aansluit- en transportovereenkomst is gesloten, alsmede de adresgegevens,
      zijnde straatnaam, huisnummer met eventuele toevoegingen, postcode en plaatsnaam of eventuele alternatieve
      locatieaanduidingen, behorend bij het overdrachtspunt van de aansluiting;

      c. naam en contactgegevens van de meterplaatser;

      d. merk en type-aanduiding van de te plaatsen op afstand uitleesbare kleinverbruikmeetinrichting;

      e. naam en contactgegevens van de aanvrager.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel13d
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel13e
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel3.4.1
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: 13d
      - id: ref2
        bwb_id: BWBR0011440
        artikel: 13e
  - number: 3.4.2
    text: |-
      De regionale netbeheerder controleert of:

      a. de melding aan de juiste regionale netbeheerder is gedaan;

      b. het een aansluiting betreft die in aanmerking komt voor plaatsing van een op afstand uitleesbare
      kleinverbruikmeetinrichting;

      c. er op de desbetreffende aansluiting nog geen op afstand uitleesbare kleinverbruikmeetinrichting is geplaatst;

      d. de plaatsing van de meter op het adres niet binnen drie maanden is ingepland door de regionale netbeheerder;

      e. de meterplaatser erkend is;

      f. de te plaatsen op afstand uitleesbare kleinverbruikmeetinrichting voldoet aan de bij of krachtens de in het
      [Besluit op afstand uitleesbare meetinrichtingen][ref1] gestelde eisen en of deze meetinrichting informatie kan
      uitwisselen met (het informatiesysteem van) de regionale netbeheerder zonder dat dit specifieke aanpassingen aan
      het informatie- c.q. uitleessysteem van de betreffende regionale netbeheerder behoeft;


      [ref1]: https://wetten.overheid.nl/BWBR0030605
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel3.4.2
    references:
      - id: ref1
        bwb_id: BWBR0030605
  - number: 3.4.3
    text: |-
      Het resultaat van de in [3.4.2][ref1] genoemde vaststelling wordt binnen vijf werkdagen na de in [3.4.1][ref2]
      bedoelde melding meegedeeld aan de ander dan de regionale netbeheerder die op verzoek van de aangeslotene conform
      [artikel 13d, lid 6][ref3] of [artikel 13e, lid 7 van de Wet][ref4], er zorg voor draagt dat de aangeslotene
      beschikt over een op afstand uitleesbare kleinverbruikmeetinrichting. Indien niet aan alle in 3.4.2 genoemde
      criteria wordt voldaan, wordt de procedure plaatsing door derden van een niet door de regionale netbeheerder
      geleverde meetinrichting gestopt.


      [ref1]: https://wetten.overheid.nl/BWBR0037925#Artikel3.4.2
      [ref2]: https://wetten.overheid.nl/BWBR0037925#Artikel3.4.1
      [ref3]: https://wetten.overheid.nl/BWBR0011440#Artikel13d
      [ref4]: https://wetten.overheid.nl/BWBR0011440#Artikel13e
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel3.4.3
    references:
      - id: ref1
        bwb_id: BWBR0037925
        artikel: 3.4.2
        hoofdstuk: '3'
        paragraaf: '3.4'
      - id: ref2
        bwb_id: BWBR0037925
        artikel: 3.4.1
        hoofdstuk: '3'
        paragraaf: '3.4'
      - id: ref3
        bwb_id: BWBR0011440
        artikel: 13d
      - id: ref4
        bwb_id: BWBR0011440
        artikel: 13e
  - number: 3.4.4
    text: |-
      De meterplaatser neemt binnen vijftien werkdagen na de in [3.4.3][ref1] bedoelde melding contact op met
      de regionale netbeheerder voor het maken van afspraken over de datum en het tijdstip van de verwijdering
      van de oude meetinrichting en plaatsing van de nieuwe meetinrichting en over de toegankelijkheid van de
      communicatievoorziening.


      [ref1]: https://wetten.overheid.nl/BWBR0037925#Artikel3.4.3
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel3.4.4
    references:
      - id: ref1
        bwb_id: BWBR0037925
        artikel: 3.4.3
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: 3.4.5
    text: |-
      De regionale netbeheerder verstrekt uiterlijk vijf werkdagen voor de conform [3.4.4][ref1] geplande plaatsing de
      meterwisselgegevens:

      a. het meternummer van de huidige meetinrichting;

      b. de marge waarbinnen de tellerstand(en) van de huidige meetinrichting moeten liggen ten tijde van de plaatsing.


      [ref1]: https://wetten.overheid.nl/BWBR0037925#Artikel3.4.4
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel3.4.5
    references:
      - id: ref1
        bwb_id: BWBR0037925
        artikel: 3.4.4
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: 3.4.6
    text: |-
      De meterplaatser controleert of de vastgelegde tellerstanden van de oude meetinrichting zich binnen de in
      [3.4.5][ref1] bedoelde marge bevinden en of het meternummer van de oude meetinrichting klopt.


      [ref1]: https://wetten.overheid.nl/BWBR0037925#Artikel3.4.5
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel3.4.6
    references:
      - id: ref1
        bwb_id: BWBR0037925
        artikel: 3.4.5
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: 3.4.7
    text: De meterplaatser neemt de oude meetinrichting weg en plaatst de op afstand uitleesbare kleinverbruikmeetinrichting.
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel3.4.7
  - number: 3.4.8
    text: |-
      De meterplaatser legt ter plekke vast:

      a. de naam van de aangeslotene met wie de aansluit- en transportovereenkomst is gesloten, alsmede de adresgegevens,
      zijnde straatnaam, huisnummer met eventuele toevoegingen, postcode en plaatsnaam of eventuele alternatieve
      locatieaanduidingen, behorend bij het overdrachtspunt van de aansluiting;

      b. de datum en de tijd van de meterwisseling;

      c. het meternummer en de tellerstand(en) van de oude meetinrichting;

      d. serienummer, metercode en bouwjaar van de nieuwe meetinrichting;

      e. de tellerstand(en) van de nieuwe meetinrichting;

      en laat de aangeslotene met het plaatsen van zijn/haar handtekening verklaren dat hij/zij akkoord gaat met
      bovengenoemde gegevens.
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel3.4.8
  - number: 3.4.9
    text: |-
      Indien de aangeslotene niet verklaart dat de tellerstand(en) van de oude meetinrichting juist zijn, zorgt de
      meterplaatser voor een foto met tellerstanden en meternummer.
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel3.4.9
  - number: 3.4.10
    text: |-
      De meterplaatser verzamelt de additionele gegevens die de regionale netbeheerder nodig heeft voor de uitvoering
      van [3.11.1 van de Informatiecode Elektriciteit en Gas][ref1], te weten voor elk telwerk van de geplaatste of
      gewijzigde meetinrichting, indien van toepassing, de volgende gegevens:

        - de telwerkindicatie;
        - de tariefzone;
        - de energierichting;
        - de meeteenheid;
        - het aantal posities voor de komma;
        - de vermenigvuldigingsfactor.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Paragraaf3.11.1
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel3.4.10
    references:
      - id: ref1
        bwb_id: BWBR0037934
        paragraaf: 3.11.1
  - number: 3.4.11
    text: |-
      De meterplaatser verzamelt de gegevens omtrent het type meetinrichting en de wijze van communicatie die nodig zijn
      voor het functioneren van de meetinrichting met inbegrip van het tot stand komen van de communicatie.
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel3.4.11
  - number: 3.4.12
    text: |-
      De meterplaatser verzendt de in [3.4.8][ref1], [3.4.10][ref2] en [3.4.11][ref3] genoemde gegevens binnen één
      werkdag na de dag van plaatsing in een door de gezamenlijke netbeheerders opgesteld format voor elektronische
      gegevensuitwisseling aan de regionale netbeheerder.


      [ref1]: https://wetten.overheid.nl/BWBR0037925#Artikel3.4.8
      [ref2]: https://wetten.overheid.nl/BWBR0037925#Artikel3.4.10
      [ref3]: https://wetten.overheid.nl/BWBR0037925#Artikel3.4.11
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel3.4.12
    references:
      - id: ref1
        bwb_id: BWBR0037925
        artikel: 3.4.8
        hoofdstuk: '3'
        paragraaf: '3.4'
      - id: ref2
        bwb_id: BWBR0037925
        artikel: 3.4.10
        hoofdstuk: '3'
        paragraaf: '3.4'
      - id: ref3
        bwb_id: BWBR0037925
        artikel: 3.4.11
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: 3.4.13
    text: |-
      De meterplaatser levert de oude meetinrichting conform de in [3.4.4][ref1] genoemde afspraken af bij de regionale
      netbeheerder.


      [ref1]: https://wetten.overheid.nl/BWBR0037925#Artikel3.4.4
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel3.4.13
    references:
      - id: ref1
        bwb_id: BWBR0037925
        artikel: 3.4.4
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: 3.4.14
    text: |-
      De regionale netbeheerder controleert of de nieuwe meetinrichting gedurende vijf aaneengesloten dagen op afstand
      uitleesbaar is. Indien dit niet het geval is wordt de meterplaatser in de gelegenheid gesteld om het probleem
      uiterlijk binnen tien werkdagen op te lossen.
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel3.4.14
  - number: 3.4.15
    text: |-
      Nadat geconstateerd is dat de nieuwe meetinrichting gedurende vijf aaneengesloten dagen op afstand
      uitleesbaar is, wordt de plaatsing geaccepteerd door de regionale netbeheerder en worden de ander dan
      de regionale netbeheerder die op verzoek van de aangeslotene conform [artikel 13d, zesde lid][ref1], of
      [artikel 13e, zevende lid, van de Wet][ref2], er zorg voor draagt dat de aangeslotene beschikt over een op afstand
      uitleesbare kleinverbruikmeetinrichting en de meterplaatser hierover door de regionale netbeheerder geïnformeerd.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel13d
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel13e
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel3.4.15
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: 13d
      - id: ref2
        bwb_id: BWBR0011440
        artikel: 13e
  - number: 3.4.16
    text: |-
      De regionale netbeheerder neemt, na acceptatie, de nieuw geplaatste op afstand uitleesbare
      kleinverbruikmeetinrichting in beheer en betaalt de bij of krachtens de [Wet][ref1] daartoe vastgestelde
      vergoeding.


      [ref1]: https://wetten.overheid.nl/BWBR0011440
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel3.4.16
    references:
      - id: ref1
        bwb_id: BWBR0011440
  - number: 4.1.1.1
    text: |-
      Ter voorkoming van ongewenste gaslekkage is de meetinrichting, met inbegrip van de daarbij behorende appendages,
      technisch gasdicht.
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel4.1.1.1
  - number: 4.1.1.2
    text: |-
      Het ontwerp en de aanleg van de meetinrichting voldoet tenminste aan de bepalingen op grond van NEN 1059: 2010
      "Nederlandse editie op basis van NEN-EN 12186 en NEN EN 12279 – Gasvoorzieningssystemen – Gasdrukregelstations voor
      transport en distributie".
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel4.1.1.2
  - number: 4.1.1.3
    text: |-
      Met de in [4.1.1.2][ref1] bedoelde meetinrichting wordt gelijkgesteld een meetinrichting die rechtmatig is
      vervaardigd of in de handel is gebracht in een andere lidstaat van de Europese Unie dan wel rechtmatig is
      vervaardigd in een staat, niet zijnde een lidstaat van de Europese Unie, die partij is bij een daartoe strekkend of
      mede daartoe strekkend Verdrag dat Nederland bindt, en die voldoet aan eisen die een beschermingsniveau bieden dat
      ten minste gelijkwaardig is aan het niveau dat met de eisen genoemd in 4.1.1.2 wordt nagestreefd.


      [ref1]: https://wetten.overheid.nl/BWBR0037925#Artikel4.1.1.2
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel4.1.1.3
    references:
      - id: ref1
        bwb_id: BWBR0037925
        artikel: 4.1.1.2
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 4.1.1.4
    text: De meetinrichting wordt zodanig onderhouden, dat zij voortdurend aan de in deze code opgenomen eisen voldoet.
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel4.1.1.4
  - number: 4.1.2.1
    text: |-
      Onverminderd de verzegelingen op grond van de [Metrologiewet][ref1] wordt de meetinrichting door de meterbeheerder
      zodanig verzegeld dat niet in de meetinrichting kan worden ingegrepen zonder de verzegeling te verbreken.


      [ref1]: https://wetten.overheid.nl/BWBR0019517
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel4.1.2.1
    references:
      - id: ref1
        bwb_id: BWBR0019517
  - number: 4.1.2.2
    text: |-
      De verzegeling bestaat uit een hardwarematige en/of een daaraan gelijkwaardige softwarematige verzegeling.
      Softwarematige verzegelingen worden tenminste eenmaal per twee jaar gewijzigd.
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel4.1.2.2
  - number: 4.1.2.3
    text: |-
      De hardwarematige zegels dragen een kenmerk van de meterbeheerder en de functionaris die het zegel heeft
      aangebracht.
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel4.1.2.3
  - number: 4.1.2.4
    text: |-
      De meterbeheerder heeft een zegeltangadministratie en een schriftelijke instructie voor het gebruik van zegeltangen
      en zegels.
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel4.1.2.4
  - number: 4.1.2.5
    text: |-
      Verzegelingen die door of vanwege de meterbeheerder zijn aangebracht op de meetinrichting worden niet geschonden of
      verbroken tenzij de meterbeheerder uitdrukkelijk toestemming geeft tot het verbreken van de verzegeling.
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel4.1.2.5
  - number: 4.1.3.1
    text: |-
      De nauwkeurigheid voor het vaststellen van het herleid volume in normaal kubieke meter [m3(n)] wordt bepaald door
      de nauwkeurigheid van de afzonderlijke componenten en/of de toegepaste berekeningssystematiek.
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel4.1.3.1
  - number: 4.1.3.2
    text: |-
      De maximaal toelaatbare afwijking van een voor de eerste maal in gebruik te nemen meetinrichting overschrijdt de in
      onderstaande tabel genoemde waarden van de maximaal toelaatbare afwijking niet.











