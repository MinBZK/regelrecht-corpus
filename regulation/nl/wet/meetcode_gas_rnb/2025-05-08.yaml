  - number: 6.3.3
    text: |-
      Voor zover in deze code wordt verwezen naar normen en richtlijnen, geldt dat indien een nieuwe versie daarvan wordt
      vastgesteld, die nieuwe norm of richtlijn geldt. Indien een norm wordt neergelegd in een wettelijke regeling dan
      wordt deze toegepast zodra deze van kracht wordt.
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel6.3.3
  - number: 6.3.4
    text: |-
      De Meetvoorwaarden Gas – RNB, zoals vastgesteld bij besluit van 21 november 2006 en nadien diverse malen gewijzigd,
      wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel6.3.4
  - number: 6.3.5
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van de Staatscourant waarin het is
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel6.3.5
  - number: 6.3.6
    text: 'Dit besluit wordt aangehaald als: Meetcode gas RNB.'
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel6.3.6
