  - number: 5.4.1.1
    text: |-
      Wanneer de meetgegevens die zijn uitgelezen en opgeslagen door de meterbeheerder verschillen van de meetgegevens
      die zijn opgeslagen in de databuffers van de meetinrichting, gelden de laatstbedoelde meetgegevens.
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel5.4.1.1
  - number: 5.4.1.2
    text: |-
      Wanneer het geregistreerd volume van de gasmeter verschilt met het geregistreerd volume voor het niet herleid
      volume van het volumeherleidingsinstrument, geldt het geregistreerd volume van de gasmeter.
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel5.4.1.2
  - number: 5.4.1.3
    text: |-
      Het in [5.4.1.1][ref1] of in [5.4.1.2][ref2] geconstateerde verschil wordt als restvolume verwerkt in de maand
      van uit- of aflezen, nadat dit is herleid tot normaal kubieke meters [m3(n)] met behulp van de gemiddelde
      herleidingsfactor voor de uurmetingen van de desbetreffende periode. Indien het geconstateerde verschil zo groot
      is dat de op afstand bepaalde meetgegevens voor de desbetreffende periode niet voldoen aan de eisen gesteld in
      [4.1.3.3][ref3] voor volumemeting en/of capaciteitsmeting, vindt een onderzoek plaats naar de datacollectie en
      wordt, in plaats van de hierboven genoemde werkwijze, de werkwijze volgens [5.4][ref4] en volgens [paragraaf 6.4.4
      van de Informatiecode Elektriciteit en Gas](onbekend) gevolgd.


      [ref1]: https://wetten.overheid.nl/BWBR0037925#Artikel5.4.1.1
      [ref2]: https://wetten.overheid.nl/BWBR0037925#Artikel5.4.1.2
      [ref3]: https://wetten.overheid.nl/BWBR0037925#Artikel4.1.3.3
      [ref4]: https://wetten.overheid.nl/BWBR0037934#Paragraaf5.4
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel5.4.1.3
    references:
      - id: ref1
        bwb_id: BWBR0037925
        artikel: 5.4.1.1
        hoofdstuk: '5'
        paragraaf: '5.4'
      - id: ref2
        bwb_id: BWBR0037925
        artikel: 5.4.1.2
        hoofdstuk: '5'
        paragraaf: '5.4'
      - id: ref3
        bwb_id: BWBR0037925
        artikel: 4.1.3.3
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref4
        bwb_id: BWBR0037934
        paragraaf: '5.4'
  - number: 5.4.2.1
    text: |-
      Een storing in de afstanduitlezing van de databuffers van een telemetriegrootverbruikmeetinrichting, en indien
      van toepassing van het niet herleid volume van het volumeherleidingsinstrument en van het herleid volume van het
      volumeherleidingsinstrument wordt uiterlijk tijdens de eerstvolgende poging tot afstanduitlezing na het optreden
      van die storing, gesignaleerd door de meetverantwoordelijke. Indien er een verschil is tussen het geregistreerde
      volume van de gasmeter en het volumeherleidingsinstrument, dan moet dit verschil worden herleid met de gemiddelde
      herleidingsfactor voor die aansluiting.
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel5.4.2.1
  - number: 5.4.2.2
    text: |-
      Wanneer afstanduitlezing van de databuffers als gevolg van een storing niet mogelijk is, leest de
      meetverantwoordelijke de databuffers van de telemetriegrootverbruikmeetinrichting ter plaatse uit.
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel5.4.2.2
  - number: 5.4.2.3
    text: |-
      De werkwijze van de meetverantwoordelijke voorziet in een maximale tijdsduur tussen het tijdstip dat
      een storing wordt geconstateerd en het tijdstip van uitlezing ter plaatse. Bij het vaststellen van die
      tijdsduur houdt de meetverantwoordelijke rekening met de opslagcapaciteit van de databuffers van de
      telemetriegrootverbruikmeetinrichting.
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel5.4.2.3
  - number: 5.4.3.1
    text: |-
      Indien het totale verbruik per dag bekend is, worden de ontbrekende waarden in de meetgegevens automatisch
      gerepareerd als het meetgegevens betreft over één meetperiode.
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel5.4.3.1
  - number: 5.4.3.2
    text: |-
      Het repareren van meetgegevens zoals bedoeld in [5.4.3.1][ref1] is per aansluiting slechts eenmaal per dag
      toegestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0037925#Artikel5.4.3.1
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel5.4.3.2
    references:
      - id: ref1
        bwb_id: BWBR0037925
        artikel: 5.4.3.1
        hoofdstuk: '5'
        paragraaf: '5.4'
  - number: 5.4.3.3
    text: |-
      Indien het ontbreken van correcte meetgegevens wordt veroorzaakt door een fout in de gegevensuitwisseling met de
      telemetriegrootverbruikmeetinrichting, worden de in de buffer aanwezige meetgegevens ter plaatse uitgelezen.
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel5.4.3.3
  - number: 5.4.3.4
    text: |-
      Reparatie van grotere hiaten in de meetgegevens dan een meetperiode dan wel meer niet aaneengesloten hiaten op een
      dag, worden gerepareerd door het kopiëren van de belastingcurve van een vergelijkbare dag. Deze wijze van reparatie
      mag per belastingcurve maximaal één maal per week worden doorgevoerd over perioden van maximaal één dag.
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel5.4.3.4
  - number: 5.4.3.5
    text: |-
      Reparatie van meetgegevens over perioden langer dan een dag zal bij meetinrichtingen uitgelezen op pulsen
      plaatsvinden door de tellerstand van de gasmeter, en indien van toepassing van het niet herleid volume van het
      volumeherleidingsinstrument en van het herleid volume van het volumeherleidingsinstrument ter plaatse op te nemen.
      Het verschil tussen de opgenomen tellerstand en de laatst bekende tellerstand (=berekende tellerstand) wordt over
      de tussenliggende perioden verdeeld overeenkomstig de belastingcurve van een vergelijkbare dag.
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel5.4.3.5
  - number: 5.4.3.6
    text: |-
      De meetverantwoordelijke registreert alle reparaties die conform [5.4.3.1 tot en met 5.4.3.5][ref1] zijn uitgevoerd
      en verstrekt de aangeslotene en de regionale netbeheerder desgevraagd een rapportage over deze reparaties.


      [ref1]: https://wetten.overheid.nl/BWBR0037925#Artikel5.4.3.1
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel5.4.3.6
    references:
      - id: ref1
        bwb_id: BWBR0037925
        artikel: 5.4.3.1
        hoofdstuk: '5'
        paragraaf: '5.4'
  - number: 5.4.3.7
    text: |-
      Desgevraagd geeft de meetverantwoordelijke aan de MV-erkenner inzage in de registratie met betrekking tot de onder
      punt [5.4.3.6][ref1] genoemde reparaties.


      [ref1]: https://wetten.overheid.nl/BWBR0037925#Artikel5.4.3.6
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel5.4.3.7
    references:
      - id: ref1
        bwb_id: BWBR0037925
        artikel: 5.4.3.6
        hoofdstuk: '5'
        paragraaf: '5.4'
  - number: 5a.1.1
    text: |-
      Met betrekking tot de plaatsing, de bedrijfsvoering, het beheer en het onderhoud aan de gaskwaliteitsmeting toont
      de invoeder aan dat:

      a. hij de gaskwaliteitsmeting en de overige voorzieningen, zoals bedoeld in
      [2.5.2 van de Aansluit- en transportcode Gas – RNB][ref1] bedrijft en onderhoudt volgens de voorschriften van de
      leveranciers van deze voorzieningen. Het bedienend personeel is dienovereenkomstig opgeleid.

      b. het onderhoud en de inspectie aan de in onderdeel a bedoelde voorzieningen worden uitgevoerd door gekwalificeerd
      en competent personeel.

      c. de periodieke controle van de in onderdeel a bedoelde voorzieningen en de onderhoudsprocessen alleen worden
      uitgeoefend door personen of organisaties in het bezit van een geldig certificaat waaruit blijkt dat deze persoon
      of geoormerkt deel van de organisatie is gekwalificeerd voor de uitvoering van gaskwaliteitsmeting, afgegeven
      door een binnen- of buitenlandse geaccrediteerde certificeringsinstelling (bijvoorbeeld een ISO 9001- of 14001-
      certificaat of een daarmee vergelijkbaar certificaat).


      [ref1]: https://wetten.overheid.nl/BWBR0037926#Paragraaf2.5.2
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel5a.1.1
    references:
      - id: ref1
        bwb_id: BWBR0037926
        paragraaf: 2.5.2
  - number: 5a.2.1
    text: |-
