  - number: 5.3.2
    text: |-
      In afwijking van het gestelde in [5.3.1][ref1] worden, indien sprake is van dataoverdracht met behulp van pulsen
      tussen de verschillende onderdelen van de meetinrichting of tussen de meetinrichting en de meetverantwoordelijke,
      de maandelijkse tellerstanden van de gasmeter, en indien van toepassing van het niet herleid volume van
      het volumeherleidingsinstrument en van het herleid volume van het volumeherleidingsinstrument door de
      meetverantwoordelijke berekend op basis van deze pulsen.


      [ref1]: https://wetten.overheid.nl/BWBR0037925#Artikel5.3.1
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel5.3.2
    references:
      - id: ref1
        bwb_id: BWBR0037925
        artikel: 5.3.1
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: 5.3.3
    text: |-
      Indien [5.3.2][ref1] van toepassing is, worden tenminste eenmaal per zes maanden de tellerstanden van de gasmeter,
      en indien van toepassing van het niet herleid volume van het volumeherleidingsinstrument en van het herleid volume
      van het volumeherleidingsinstrument bepaald door het ter plaatse uit- of aflezen van de meetinrichting door de
      meetverantwoordelijke. Het eventueel geconstateerde verschil met de op afstand bepaalde standen wordt restvolume
      genoemd. De oorzaak van het ontstaan van dit restvolume wordt door de meetverantwoordelijke onderzocht. Indien
      uit dit onderzoek blijkt dat (een deel van) het restvolume naar grote waarschijnlijkheid is ontstaan in concreet
      te duiden uren van de afgelopen maand, verdeelt de meetverantwoordelijke (dit deel van) het restvolume naar beste
      kunnen over de desbetreffende uren. Het eventueel resterende restvolume wordt verwerkt in de maand van uit- of
      aflezen, nadat dit is herleid tot normaal kubieke meters [m3(n)] met behulp van de gemiddelde herleidingsfactor
      voor de uurmetingen van de afgelopen maand. Indien het geconstateerde verschil zo groot is dat de op afstand
      bepaalde meetgegevens voor de onderhavige maand niet voldoen aan de eisen gesteld in [4.1.3.3][ref2] voor
      volumemeting en/of capaciteitsmeting, vindt een onderzoek plaats naar de datacollectie en wordt, in plaats van de
      hierboven genoemde werkwijze, de werkwijze volgens [paragraaf 6.4.4 van de Informatiecode Elektriciteit en Gas]
      (onbekend) gevolgd.


      [ref1]: https://wetten.overheid.nl/BWBR0037925#Artikel5.3.2
      [ref2]: https://wetten.overheid.nl/BWBR0037925#Artikel4.1.3.3
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel5.3.3
