    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel4.1.3.2
  - number: 4.1.3.3
    text: |-
      De maximaal toelaatbare afwijking van een in gebruik zijnde meetinrichting overschrijden de in onderstaande tabel
      genoemde waarden van de maximaal toelaatbare afwijking niet.











