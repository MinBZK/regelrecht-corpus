        paragraaf: 5a.2
  - number: 5a.2.6
    text: |-
      De monstername bedoeld in [5a.2.5][ref1] vindt plaats zoals beschreven in NEN-EN-ISO 10715:2000 “Aardgas –
      Richtlijnen voor monsterneming”.


      [ref1]: https://wetten.overheid.nl/BWBR0037925#Artikel5a.2.5
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel5a.2.6
    references:
      - id: ref1
        bwb_id: BWBR0037925
        artikel: 5a.2.5
        hoofdstuk: 5a
        paragraaf: 5a.2
  - number: 5a.2.7
    text: De meetwaarden en bewakingssignalen worden ten minste vijf jaar opgeslagen in een niet vluchtige databuffer.
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel5a.2.7
  - number: 5a.2.8
    text: |-
      Systematische afwijkingen van de gaskwaliteitsmeting dienen terug te worden gedrongen door middel van de CUSUM
      techniek, conform ISO/TR 7871:1997 “Cumulative sum charts – Guidance on quality control and data analysis using
      CUSUM techniques” of een daarmee vergelijkbare techniek.
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel5a.2.8
  - number: 5a.3.1
    text: |-
      Een lokaal data acquisitiesysteem registreert op de plek van de meting voor elke analyseslag de verkregen
      analysewaarden en bepaalde waarden volgens [5a.2.1][ref1] en [5a.2.2][ref2], alsmede het tijdstip van registratie.


      [ref1]: https://wetten.overheid.nl/BWBR0037925#Artikel5a.2.1
      [ref2]: https://wetten.overheid.nl/BWBR0037925#Artikel5a.2.2
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel5a.3.1
    references:
      - id: ref1
        bwb_id: BWBR0037925
        artikel: 5a.2.1
        hoofdstuk: 5a
        paragraaf: 5a.2
      - id: ref2
        bwb_id: BWBR0037925
        artikel: 5a.2.2
        hoofdstuk: 5a
        paragraaf: 5a.2
  - number: 5a.3.2
    text: De klok van het lokale data acquisitiesysteem wordt tenminste dagelijks gesynchroniseerd met een centrale klok.
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel5a.3.2
  - number: 5a.3.3
    text: |-
      Het lokale data acquisitiesysteem legt met de data tevens de door de meetinstallatie gegenereerde
      storingsinformatie vast.
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel5a.3.3
  - number: 5a.3.4
    text: |-
      De geregistreerde waarden, zoals bedoeld in [5a.2.1][ref1], worden door de invoeder aangeboden aan de regionale
      netbeheerder door middel van een on-line verbinding.


      [ref1]: https://wetten.overheid.nl/BWBR0037925#Artikel5a.2.1
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel5a.3.4
    references:
      - id: ref1
        bwb_id: BWBR0037925
        artikel: 5a.2.1
        hoofdstuk: 5a
        paragraaf: 5a.2
  - number: 5a.3.5
    text: |-
      De invoeder dient de geregistreerde waarden van de gaskwaliteitsmeetinrichting, zoals bedoeld in [5a.2.1][ref1],
      vijf jaar te archiveren.


      [ref1]: https://wetten.overheid.nl/BWBR0037925#Artikel5a.2.1
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel5a.3.5
    references:
      - id: ref1
        bwb_id: BWBR0037925
        artikel: 5a.2.1
        hoofdstuk: 5a
        paragraaf: 5a.2
  - number: 5a.3.6
    text: |-
      Twee maal per jaar verstrekt de invoeder de rapportage met de resultaten van de metingen en analyses zoals bedoel
      in [5a.2.5][ref1], alsmede de conclusie daaruit, aan de regionale netbeheerder.


      [ref1]: https://wetten.overheid.nl/BWBR0037925#Artikel5a.2.5
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel5a.3.6
    references:
      - id: ref1
        bwb_id: BWBR0037925
        artikel: 5a.2.5
        hoofdstuk: 5a
        paragraaf: 5a.2
  - number: 5a.3.7
    text: |-
      De samenstelling (keuze en concentratie van de componenten) van het testgas en het kalibratiegas wordt bepaald op
      basis van de samenstelling van het procesgas.
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel5a.3.7
  - number: 5a.3.8
    text: |-
      Kalibratiegassen worden gravimetrisch aangemaakt conform NEN-EN-ISO 6142:2006 “Gas analysis – Preparation of
      calibration gas mixtures – Gravimetric method“ en van een certificaat voorzien conform NEN-EN-ISO 6143:2006
      “Gas analysis – Comparison methods for determining and checking the composition of calibration gas mixtures”.
      De onnauwkeurigheid van het mengsel op basis van Wobbe en calorische bovenwaarde, dient te voldoen aan de in
      [5a.2.1][ref1] gestelde specificaties.


      [ref1]: https://wetten.overheid.nl/BWBR0037925#Artikel5a.2.1
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel5a.3.8
    references:
      - id: ref1
        bwb_id: BWBR0037925
        artikel: 5a.2.1
        hoofdstuk: 5a
        paragraaf: 5a.2
  - number: 5a.3.9
    text: |-
      Alle werkzaamheden aan de gaskwaliteitsmeetinrichting worden vastgelegd in een logboek. Door middel van de
      volgende rapportages wordt de regionale netbeheerder één keer per jaar geïnformeerd over de performance van de
      gaskwaliteitsmeetinrichting:

        - CUSUM resultaten van de gaskwaliteitsmeting;
        - Maandelijkse resultaten van de (nulpunt)drift (indien van toepassing);
        - Keuringsrapport(en) resultaat discontinue controlemetingen.
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel5a.3.9
  - number: 5a.3.10
    text: |-
      De invoeder draagt zorg voor periodieke inspectie ter bepaling van het juist functioneren van de
      kwaliteitsmeetinrichting en legt conform de aangegeven periodes zoals aangegeven in hoofdstuk 5a van de “Meetcode
      gas RNB” de bevindingen hiervan vast in een keuringsrapport.
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel5a.3.10
  - number: 5a.4.1.1
    text: |-
      Voor aanvang van de invoeding wordt er een gaskwaliteitsmeetprotocol opgesteld. In het gaskwaliteitsmeetprotocol
      legt de invoeder vast hoe de gaskwaliteitsmeting wordt uitgevoerd. In het gaskwaliteitsmeetprotocol wordt ten
      minste beschreven:

        - Het gaskwaliteitsmeetsysteem;
        - Data-acquisitie, -verwerking, -logging en communicatie;
        - Kwaliteitsborging en onderhoud van het gaskwaliteitsmeetsysteem;
        - Onzekerheid van het gaskwaliteitsmeetsysteem;
        - Afhandeling van herberekeningen.
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel5a.4.1.1
  - number: 5a.4.1.2
    text: |-
      De goedkeuring van de gaskwaliteitsmeetinrichting kan door de invoeder plaats vinden en dient tenminste vijf
      werkdagen voor aanvang van de geplande invoeding gemeld te worden aan de regionale netbeheerder.
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel5a.4.1.2
  - number: 5a.4.1.3
    text: |-
      De invoeder geeft een schriftelijke verklaring over het juist functioneren af aan de regionale netbeheerder en dat
      de metingen aangeven dat het geproduceerde gas conform de specificaties is, voorafgaand aan de start van invoeding
      in het regionale gastransportnet en vertrekt hiertoe de volgende documenten:

        - Gemeten waarden en conclusies over kwaliteit van het gas n.a.v. de monstername;
        - Keuringsrapport van de gaskwaliteitsmeetinstallatie;
        - Tekeningen gaskwaliteitsmeetinstallatie;
        - Standaard gaskwaliteitsmeetprotocol;
        - Gemeten continue waarden van tenminste 24 uur met een opgave of aan de criteria voor invoeding voldaan wordt;
        - Goedkeuring van de kwaliteitsmeting door de netbeheerder.
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel5a.4.1.3
  - number: 5a.4.1.4
    text: |-
      De gaskwaliteitsmeetinrichting dient initieel gekalibreerd te worden met een kalibratiegas dat op het werkgebied
      van het procesgas ligt, volgens de NEN-EN-ISO 10723:2002 “Natural gas – Performance evaluation for on-line
      analytical systems”. Deze kalibratie wordt herhaald na het overschrijden van de afkeurgrens of CUSUM-grens van
      de testgasprocedure.
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel5a.4.1.4
  - number: 5a.4.2.1
    text: De invoeder voert een keer per maand testgasprocedure uit.
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel5a.4.2.1
  - number: 5a.4.2.2
    text: |-
      De invoeder inspecteert tenminste één keer per maand de gaskwaliteitsmeting uitwendig en controleert of de
      hoeveelheden draaggas, testgas en kalibratiegas toereikend zijn.
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel5a.4.2.2
  - number: 5a.4.2.3
    text: |-
      De invoeder controleert tenminste één keer per maand de compleetheid van de gegevens in het logboek en valideert
      deze op basis van:

        - de werking van de gaskwaliteitsmeting op basis van de CUSUM kaarten;
        - tijdsynchronisatie van de gaskwaliteitsmeting en de meetperiode;
        - aanwezigheid van alle metingen en een waarde.
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel5a.4.2.3
  - number: 5a.4.2.4
    text: |-
      De invoeder controleert tenminste één keer per maand de werking van het bedieningspaneel en de
      gaskwaliteitsmeetinrichting na storingen (die geen consequenties hebben gehad voor het functioneren van de
      gaskwaliteitsmeetinrichting).
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel5a.4.2.4
  - number: 5a.4.2.5
    text: |-
      De invoeder justeert de gaskwaliteitsmeetinrichting door middel van kalibratie als daartoe aanleiding is op basis
      van de maandelijkse validatie door de testgas procedure.
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel5a.4.2.5
  - number: 5a.4.2.6
    text: |-
      De invoeder controleert of de houdbaarheidsdatum van het testgas en kalibratiegas, die op het bijbehorende
      certificaat vermeld staat, niet verstreken is.
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel5a.4.2.6
  - number: 5a.4.3.1
    text: |-
      Componenten van de gaskwaliteitsmeetinrichting dienen conform de fabrikantspecificaties uitgewisseld, geplaatst,
      onderhouden en beheerd te worden.
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel5a.4.3.1
  - number: 5a.4.3.2
    text: Indien de gaskwaliteitsmeetinrichting onderhoud behoeft, dient de invoeding gestaakt te worden.
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel5a.4.3.2
  - number: 5a.4.4.1
    text: |-
      Ter controle van de juiste werking van de gaschromatograaf, deel uit makend van de gaskwaliteitsmeetinrichting,
      voert de invoeder periodiek een testgas analyse uit.
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel5a.4.4.1
  - number: 5a.4.4.2
    text: Het testgas bestaat uit de hoofdcomponenten CH, CO, O, N.
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel5a.4.4.2
  - number: 5a.4.4.3
    text: |-
      De testgassen zijn voorzien van een certificaat waarvan de Hs (MJ/m3(n)) waarde is vastgesteld op basis van een
      laboratoriumanalyse.
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel5a.4.4.3
  - number: 5a.4.4.4
    text: |-
      De gaskwaliteit van het testgas voor een gaschromatograaf moet liggen in het gerealiseerde werkgebied van de
      betreffende gaschromatograaf.
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel5a.4.4.4
  - number: 5a.4.4.5
    text: |-
      De testgas-test omvat minimaal 3 analyses. Er wordt gerekend op basis van het gemiddelde van de laatste twee
      analyses. Bij een verschil tussen analyse resultaat en het certificaat groter dan 0,3% wordt een onderzoek
      ingesteld, zo nodig gevolgd door een correctieve actie aan de gaschromatograaf, en dient de invoeder een voorstel
      tot correctie van de meetwaarden conform [4.1.7][ref1] of [4.6.5 van de Meetcode gas LNB][ref2] te doen.


      [ref1]: https://wetten.overheid.nl/BWBR0037935#Artikel4.1.7
      [ref2]: https://wetten.overheid.nl/BWBR0037935#Artikel4.6.5
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel5a.4.4.5
    references:
      - id: ref1
        bwb_id: BWBR0037935
        artikel: 4.1.7
      - id: ref2
        bwb_id: BWBR0037935
        artikel: 4.6.5
  - number: 5a.4.4.6
    text: |-
      In het testgas-proces vindt een bewaking plaats op systematische afwijkingen. Deze bewaking vindt plaats
      volgens ISO 7871 of een vergelijkbare methode. Deze methode staat bekend als de CUSUM methode, zie
      [2.7.3 van de Meetcode gas LNB][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037935#Artikel2.7.3
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel5a.4.4.6
    references:
      - id: ref1
        bwb_id: BWBR0037935
        artikel: 2.7.3
  - number: 5a.4.4.7
    text: De afwijkingen vanuit de testgasprocedure worden in een CUSUM controlekaart bijgehouden.
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel5a.4.4.7
  - number: 5a.4.4.8
    text: |-
      Als de kalibratie is uitgevoerd, wordt de nieuwe kalibratielijn in de gaskwaliteitsmeetinrichting geregistreerd
      (de feitelijke justering) en wordt de testgasprocedure nogmaals uitgevoerd met beide testgassen. Daarmee wordt de
      nieuwe kalibratielijn gevalideerd.
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel5a.4.4.8
  - number: 5a.5.1
    text: |-
      De invoeder houdt alle correcties in de data in logboeken bij. In deze logboeken worden minimaal vermeld de
      originele meetwaarde, de vervangende meetwaarde, de reden van wijziging, de wijze van wijziging, het tijdstip van
      wijziging en de uitvoerder van de wijziging.
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel5a.5.1
  - number: 5a.6.1
    text: Periodiek bepaalt de gaschromatograaf de samenstelling van het gas
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel5a.6.1
  - number: 5a.6.2
    text: Uit de componentensamenstelling wordt de calorische bovenwaarde berekend.
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel5a.6.2
  - number: 5a.6.3
    text: |-
      De meetverantwoordelijke bepaalt het aantal normaal kubieke meters [m3(n)] (volume) van het gas dat de gasmeter in
      datzelfde interval heeft gemeten.
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel5a.6.3
  - number: 5a.6.4
    text: |-
      De energie-inhoud van het gas dat in het voorbije interval is gemeten wordt bepaald door de calorische bovenwaarde
      te vermenigvuldigen met het aantal normaal kubieke meters gas als bedoeld in [5a.6.3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037925#Artikel5a.6.3
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel5a.6.4
    references:
      - id: ref1
        bwb_id: BWBR0037925
        artikel: 5a.6.3
        hoofdstuk: 5a
        paragraaf: 5a.6
  - number: 5a.6.5
    text: |-
      De stappen [5a.6.1 tot en met 5a.6.4][ref1] worden minimaal 1 maal per 5 minuten uitgevoerd. De totale ingevoede
      hoeveelheid energie van enig uur wordt bepaald door de waarden uit stap [5a.6.4][ref2] bij elkaar op te tellen.
      Het totale ingevoede aantal normaal kubieke meters [m3(n)] (volume) wordt bepaald door de waarden uit stap
      [5a.6.3][ref3] bij elkaar op te tellen. De gemiddelde calorische waarde over het uur is gelijk aan de totale
      hoeveelheid energie gedeeld door het totale volume. Indien het totaal ingevoede aantal normaal kubieke meters
      [m3(n)] (volume) in enig uur gelijk is aan nul, dan wordt de calorische waarde voor dat uur op nul gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0037925#Artikel5a.6.1
      [ref2]: https://wetten.overheid.nl/BWBR0037925#Artikel5a.6.1
      [ref3]: https://wetten.overheid.nl/BWBR0037925#Artikel5a.6.3
