        paragraaf: 5a.6
  - number: 5a.6.6
    text: |-
      De meetverantwoordelijke zorgt ervoor dat de intervallen van de stappen [5a.6.1][ref1] en [5a.6.3][ref2] niet meer
      dan zestig seconden van elkaar afwijken.


      [ref1]: https://wetten.overheid.nl/BWBR0037925#Artikel5a.6.3
      [ref2]: https://wetten.overheid.nl/BWBR0037925#Artikel5a.6.3
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel5a.6.6
    references:
      - id: ref1
        bwb_id: BWBR0037925
        artikel: 5a.6.3
        hoofdstuk: 5a
        paragraaf: 5a.6
      - id: ref2
        bwb_id: BWBR0037925
        artikel: 5a.6.3
        hoofdstuk: 5a
        paragraaf: 5a.6
  - number: 5a.6.7
    text: |-
      Indien de meetverantwoordelijke de in [5a.6.1][ref1] bedoelde bepaling niet zelf uitvoert, geschiedt de overdracht
      van de in [5a.6.2][ref2] bedoelde gegevens aan de meetverantwoordelijke automatisch en is deze beveiligd tegen
      wijziging ervan.


      [ref1]: https://wetten.overheid.nl/BWBR0037925#Artikel5a.6.1
      [ref2]: https://wetten.overheid.nl/BWBR0037925#Artikel5a.6.2
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel5a.6.7
    references:
      - id: ref1
        bwb_id: BWBR0037925
        artikel: 5a.6.1
        hoofdstuk: 5a
        paragraaf: 5a.6
      - id: ref2
        bwb_id: BWBR0037925
        artikel: 5a.6.2
        hoofdstuk: 5a
        paragraaf: 5a.6
  - number: 6.1.1
    text: |-
      Bij een verwisseling of wijziging van de meetinrichting registreert de meterbeheerder van de geplaatste of
      gewijzigde meetinrichting, indien van toepassing, de volgende gegevens:

      a. de identificatiecode van de meetinrichting, zijnde het meternummer

      b. de opnamedatum,

      c. het kenmerk van de opname, te weten: fysieke opname,

      d. de procesidentificatie die van toepassing is,

      e. voor elk telwerk van de geplaatste of gewijzigde meetinrichting de volgende gegevens:

        - de telwerkindicatie
        - de meeteenheid
        - het aantal posities voor de komma
        - de vermenigvuldigingsfactor
        - de tellerstand op het moment van plaatsing of wijziging van de meetinrichting

      en van de weggenomen meetinrichting, indien van toepassing, de volgende gegevens:

      f. de identificatiecode van de meetinrichting, zijnde het meternummer

      g. de opnamedatum,

      h. het kenmerk van de opname, te weten: fysieke opname,

      i. de procesidentificatie die van toepassing is,

      j. voor elk telwerk van de geplaatste of gewijzigde meetinrichting de volgende gegevens:

        - de telwerkindicatie
        - de meeteenheid
        - het aantal posities voor de komma
        - de vermenigvuldigingsfactor
        - de tellerstand op het moment van plaatsing of wijziging van de meetinrichting
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel6.1.1
  - number: 6.1.2
    text: |-
      De verwisseling of wijziging van de kleinverbruikmeetinrichting wordt binnen vijf werkdagen nadat de fysieke
      werkzaamheden zijn uitgevoerd en daarvan melding is gemaakt door de meterplaatser, door de regionale netbeheerder
      verwerkt in het aansluitingenregister.
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel6.1.2
  - number: 6.1.3
    text: |-
      De tijdsduur tussen het buiten gebruik stellen van de oude meetinrichting en de ingebruikname van de nieuwe cq.
      gewijzigde meetinrichting bedraagt maximaal een uur.
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel6.1.3
  - number: 6.2.1
    text: |-
      Indien er zich situaties voordoen die niet zijn voorzien in de bepalingen van deze code, bepaalt de regionale
      netbeheerder in overleg met de aangeslotene welke maatregelen nodig zijn, rekening houdend met de technische
      hoedanigheden van de installatie van de desbetreffende aangeslotene en de belangen van alle aangeslotenen.
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel6.2.1
  - number: 6.3.1
    text: |-
      De regionale netbeheerder beslist na overleg met de aangeslotene over de toelaatbaarheid van een bestaande
      (gaskwaliteits)meetinrichting die voor de inwerkingtreding van deze regeling is geïnstalleerd en die niet aan
      de in [hoofdstuk 4][ref1] of [5a][ref2] genoemde eisen voldoet. Indien de bestaande meetinrichting geheel of
      gedeeltelijk niet toelaatbaar wordt geoordeeld, stelt de regionale netbeheerder een redelijke termijn binnen welke
      de aangeslotene de meetinrichting alsnog aan de eisen genoemd in hoofdstuk 4 moet laten voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0037925#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0037925#Hoofdstuk5a
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel6.3.1
    references:
      - id: ref1
        bwb_id: BWBR0037925
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0037925
        hoofdstuk: 5a
  - number: 6.3.2
    text: |-
      De in [6.3.1][ref1] genoemde termijn bedraagt maximaal vijf jaar voor de in [hoofdstuk 4][ref2] genoemde eisen en
      maximaal 2 jaar voor de in [hoofdstuk 5a][ref3] genoemde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0037925#Artikel6.3.1
      [ref2]: https://wetten.overheid.nl/BWBR0037925#Hoofdstuk4
      [ref3]: https://wetten.overheid.nl/BWBR0037925#Hoofdstuk5a
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel6.3.2
    references:
      - id: ref1
        bwb_id: BWBR0037925
        artikel: 6.3.1
        hoofdstuk: '6'
        paragraaf: '6.3'
      - id: ref2
        bwb_id: BWBR0037925
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0037925
        hoofdstuk: 5a
  - number: 6.3.2a
    text: |-
      Indien de in [6.3.1][ref1] bedoelde aanpassing van de bestaande meetinrichting betrekking heeft op een
      uurlijkse afstanduitlezing zoals bedoeld in [artikel 2.3.2][ref2], bedraagt de maximale termijn in afwijking
      van [6.3.2][ref3] maximaal 6 weken. Indien de bedoelde aanpassing na verstrijken van deze termijn niet heeft
      plaatsgevonden of is aangevangen, stelt de regionale netbeheerder de desbetreffende aangeslotene en diens
      meetverantwoordelijke schriftelijk in gebreke. De regionale netbeheerder meldt de ingebrekestelling van de
      aangeslotene aan de desbetreffende programmaverantwoordelijke en de ingebrekestelling van de meetverantwoordelijke
      aan TenneT. Indien de bedoelde aanpassing van de meetinrichting binnen 6 weken na deze ingebrekestelling niet
      alsnog is uitgevoerd of aangevangen, gaat de regionale netbeheerder over tot de-activering van de desbetreffende
      aansluiting.


      [ref1]: https://wetten.overheid.nl/BWBR0037925#Artikel6.3.1
      [ref2]: https://wetten.overheid.nl/BWBR0037925#Artikel2.3.2
      [ref3]: https://wetten.overheid.nl/BWBR0037925#Artikel6.3.2
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel6.3.2a
