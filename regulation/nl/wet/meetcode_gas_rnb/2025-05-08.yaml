    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel4.1.3.3
  - number: 4.1.3.4
    text: Het minimale en het maximale debiet dienen binnen het meetbereik van de gasmeter te liggen.
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel4.1.3.4
  - number: 4.1.3.5
    text: |-
      Op verzoek van TenneT toont de meetverantwoordelijke aan dat de maximaal toelaatbare afwijking van de
      meetinrichting niet de in [4.1.3.2][ref1] en [4.1.3.3][ref2] genoemde waarden van de maximaal toelaatbare afwijking
      overschrijdt, met dien verstande dat:

      a. aan het bepaalde in [4.1.3.2][ref3] is voldaan indien de meetinrichting is ontworpen en geïnstalleerd
      overeenkomstig bijlage 1 en voldaan wordt aan de uitgangspunten voor de desbetreffende volumeherleidingsmethodiek;

      b. aan het bepaalde in [4.1.3.3][ref4] is voldaan indien de meetinrichting is gecontroleerd overeenkomstig bijlage
      1 en voldaan wordt aan de uitgangspunten voor de desbetreffende volumeherleidingsmethodiek.


      [ref1]: https://wetten.overheid.nl/BWBR0037925#Artikel4.1.3.2
      [ref2]: https://wetten.overheid.nl/BWBR0037925#Artikel4.1.3.3
      [ref3]: https://wetten.overheid.nl/BWBR0037925#Artikel4.1.3.2
      [ref4]: https://wetten.overheid.nl/BWBR0037925#Artikel4.1.3.3
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel4.1.3.5
    references:
      - id: ref1
        bwb_id: BWBR0037925
        artikel: 4.1.3.2
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref2
        bwb_id: BWBR0037925
        artikel: 4.1.3.3
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref3
        bwb_id: BWBR0037925
        artikel: 4.1.3.2
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref4
        bwb_id: BWBR0037925
        artikel: 4.1.3.3
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 4.1.3.6
    text: |-
      In andere dan de genoemde gevallen, toont de meetverantwoordelijke op andere wijze aan dat de maximaal toelaatbare
      afwijking van de meetinrichting de in [4.1.3.2][ref1] en [4.1.3.3 ][ref2]genoemde waarden van de maximaal
      toelaatbare afwijking niet overschrijdt.


      [ref1]: https://wetten.overheid.nl/BWBR0037925#Artikel4.1.3.2
      [ref2]: https://wetten.overheid.nl/BWBR0037925#Artikel4.1.3.3
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel4.1.3.6
    references:
      - id: ref1
        bwb_id: BWBR0037925
        artikel: 4.1.3.2
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref2
        bwb_id: BWBR0037925
        artikel: 4.1.3.3
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 4.2.1.1
    text: |-
      Een meetinrichting registreert de totale op het overdrachtspunt uitgewisselde hoeveelheid gas, uitgedrukt in
      kubieke meters [m3] en/of in normaal kubieke meters [m3(n)]. De standen van elk telwerk zijn ter plaatse van de
      meetinrichting op elk willekeurig moment afleesbaar.
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel4.2.1.1
  - number: 4.2.2.1
    text: |-
      De op afstand uitleesbare kleinverbruikmeetinrichting voldoet aan de op het moment van plaatsing geldende versie
      van het [Besluit op afstand uitleesbare meetinrichtingen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030605
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel4.2.2.1
    references:
      - id: ref1
        bwb_id: BWBR0030605
  - number: 4.2.4.1
    text: |-
      Een storing in de gegevensoverdracht vanuit de op afstand uitleesbare meetinrichting wordt zo spoedig mogelijk,
      doch uiterlijk binnen twee maanden nadat de storing door de regionale netbeheerder is gesignaleerd, verholpen.
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel4.2.4.1
  - number: 4.2.4.2
    text: |-
      Een storing in het meetgedeelte van de meetinrichting wordt zo spoedig mogelijk, doch uiterlijk binnen tien
      werkdagen, nadat de storing is gesignaleerd door de regionale netbeheerder, verholpen.
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel4.2.4.2
  - number: 4.3.1.1
    text: |-
      De regionale netbeheerder verleent een namens de meetverantwoordelijke opererende medewerker toegang tot de
      meetinrichting in een aan de regionale netbeheerder ter beschikking staande ruimte. De regionale netbeheerder
      verleent deze toegang door:

      a. het verstrekken van een op naam gestelde aanwijzing en een sleutel aan de medewerker van de
      meetverantwoordelijke, of

      b. het in onderling overleg binnen vijf werkdagen na ontvangst van het verzoek om toegang, begeleiden van de
      medewerker van de meetverantwoordelijke door een bevoegde medewerker van de regionale netbeheerder, of

      c. het (laten) plaatsen van alle essentiële onderdelen van de meetinrichting in een voor de meetverantwoordelijke
      vrij toegankelijke ruimte.
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel4.3.1.1
  - number: 4.3.2.1
    text: |-
      De meetverantwoordelijke legt, voor zover van toepassing, de volgende gegevens van elke door hem beheerde
      meetinrichting vast in een meterregister en houdt deze gegevens actueel:

      a. de EAN-code van de aansluiting waar de meetinrichting bij hoort;

      b. van elk in gebruik zijnd telwerk:

        - het nummer van de gasmeter of het volumeherleidingsinstrument waarvan het telwerk deel uitmaakt,
        - de omschrijving van de te meten grootheid,
        - de vermenigvuldigingsfactor,
        - het aantal posities voor de komma,
        - de stand op het moment van ingebruikname en
        - de datum en het tijdstip van ingebruikname;

      c. van elk gedurende de afgelopen drie jaar buiten gebruik gesteld telwerk:

        - het nummer van de gasmeter of het volumeherleidingsinstrument waarvan het telwerk deel uitmaakte,
        - de omschrijving van de te meten grootheid,
        - de vermenigvuldigingsfactor,
        - het aantal posities voor de komma,
        - de stand op het moment van ingebruikname,
        - de datum en het tijdstip van ingebruikname,
        - de stand op het moment van buitengebruikstelling,
        - de datum en het tijdstip van buitengebruikstelling en
        - een schatting van de hoeveelheid niet gemeten energie tussen de buitengebruikstelling van het telwerk en de
      ingebruikname van het nieuwe vervangende telwerk;

      d. de G-waarde van de gasmeter;

      e. Qmax en Qmin van de gasmeter;

      f. de bedrijfsdruk van de gasmeter;

      g. fabrikaat, type, fabrieksnummer, bouwjaar en soort van de geïnstalleerde apparatuur;

      h. het jaar waarin de gasmeters voor het laatst zijn gereviseerd;

      i. de instelparameters van alle componenten;

      j. de wijze waarop de systematische (steekproefsgewijze) periodieke controle van in gebruik zijnde gasmeters
      conform 1.3.1.1 wordt uitgevoerd;

      k. het jaar waarin de meetinrichting voor het laatst is gecontroleerd;

      l. de resultaten van de aan de meetinrichting uitgevoerde controles;

      m. kalibratiecertificaten van de verschillende meetmiddelen van de meetinrichting;

      n. de impulswaarde van het zendcontact of van de impulsuitgang;

      o. de vermenigvuldigingsfactor(en) voor de gegevens opgeslagen in de databuffers;

      p. het soort zegel waarmee de gasmeter is verzegeld;

      q. de gegevens met betrekking tot het ontwerp en de structuur van de meetinrichting;

      r. de actuele waarde van de op de aansluiting gecontracteerde transportcapaciteit (in m3(n;35,17)/uur);

      s. het door de afnemer opgegeven maximum en minimum debiet;

      t. de naam van de aangeslotene met wie de aansluit- en transportovereenkomst is gesloten, alsmede de adresgegevens,
      zijnde straatnaam, huisnummer met eventuele toevoegingen, postcode en plaatsnaam of eventuele alternatieve
      locatieaanduidingen, behorend bij het overdrachtspunt van de aansluiting.
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel4.3.2.1
  - number: 4.3.2.2
    text: |-
      De meetverantwoordelijke verstrekt de regionale netbeheerder van wiens net de desbetreffende aansluiting
      deel uitmaakt op diens verzoek de onder [4.3.2.1, onderdelen a tot en met d][ref1], genoemde gegevens uit het
      meterregister, voor zover deze gegevens nodig zijn voor de door de regionale netbeheerder in rekening te brengen
      tarieven.


      [ref1]: https://wetten.overheid.nl/BWBR0037925#Artikel4.3.2.1
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel4.3.2.2
    references:
      - id: ref1
        bwb_id: BWBR0037925
        artikel: 4.3.2.1
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 4.3.2.3
    text: |-
      De in [4.3.2.1][ref1] genoemde gegevens in het meterregister kunnen desgevraagd worden ingezien door TenneT.


      [ref1]: https://wetten.overheid.nl/BWBR0037925#Artikel4.3.2.1
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel4.3.2.3
    references:
      - id: ref1
        bwb_id: BWBR0037925
        artikel: 4.3.2.1
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 4.3.2.4
    text: |-
      Bij beëindiging van de beheerovereenkomst met de meetverantwoordelijke, bewaart de meetverantwoordelijke de
      gegevens zoals bedoeld in [4.3.2.1][ref1] gedurende een periode van tenminste zeven jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0037925#Artikel4.3.2.1
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel4.3.2.4
    references:
      - id: ref1
        bwb_id: BWBR0037925
        artikel: 4.3.2.1
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 4.3.3.1
    text: |-
      Een meetinrichting registreert de totale op het overdrachtspunt uitgewisselde hoeveelheid gas, uitgedrukt in
      kubieke meters (m3) en/of in normaal kubieke meters [m3(n)]. De standen van elk telwerk zijn minimaal maandelijks
      uit- of afleesbaar. De standen van elk telwerk zijn ter plaatse van de meetinrichting op elk willekeurig moment
      afleesbaar.
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel4.3.3.1
  - number: 4.3.4.1
    text: |-
      Een meetinrichting registreert:

      a. per meetperiode van één uur zowel het aantal kubieke meters [m3], als het aantal normaal kubieke meters [m3(n)]
      uitgewisseld op het overdrachtspunt;

      b. de totale op het overdrachtspunt uitgewisselde hoeveelheid gas, uitgedrukt in kubieke meters [m3] en in normaal
      kubieke meters [m3(n)]; de hiervoor benodigde standen van elk telwerk zijn ter plaatse van de meetinrichting op elk
      willekeurig moment afleesbaar.
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel4.3.4.1
  - number: 4.3.4.2
    text: |-
      Een meetperiode is gerelateerd aan het tijdstip 00:00:00 volgens de nationale standaardtijd. De interne klok van de
      meetinrichting wijkt maximaal tien seconden of van de nationale standaardtijd.
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel4.3.4.2
  - number: 4.3.4.3
    text: |-
      De afwijking van de starttijden en stoptijden van de meetperiode is niet groter dan tien seconden in de reguliere
      tijd tussen twee uitlezingen van de databuffers van de meetinrichting.
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel4.3.4.3
  - number: 4.3.4.4
    text: |-
      In afwijking van [4.3.4.3][ref1] is bij uitval van het synchronisatiesysteem de afwijking van de start- en
      stoptijden van de meetperiode minder dan tien seconden gedurende een periode van maximaal een week.


      [ref1]: https://wetten.overheid.nl/BWBR0037925#Artikel4.3.4.3
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel4.3.4.4
    references:
      - id: ref1
        bwb_id: BWBR0037925
        artikel: 4.3.4.3
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 4.3.4.5
    text: |-
      Bij een uurlijks uitleesbare meetinrichting kunnen de gegevens zoals bedoeld in
      [artikel 4.3.4.1, onderdeel a][ref1], uurlijks op afstand elektronisch worden uitgelezen.


      [ref1]: https://wetten.overheid.nl/BWBR0037925#Artikel4.3.4.1
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel4.3.4.5
    references:
      - id: ref1
        bwb_id: BWBR0037925
        artikel: 4.3.4.1
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 4.3.4.6
    text: |-
      Bij een minimaal maandelijks uitleesbare meetinrichting kunnen de gegevens zoals bedoeld in
      [artikel 4.3.4.1, onderdeel a][ref1], minimaal maandelijks, of zoveel vaker als nodig op grond van de
      opslagcapaciteit van de vluchtige data-buffer, op afstand elektronisch worden uitgelezen.


      [ref1]: https://wetten.overheid.nl/BWBR0037925#Artikel4.3.4.1
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel4.3.4.6
    references:
      - id: ref1
        bwb_id: BWBR0037925
        artikel: 4.3.4.1
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 4.3.5.1
    text: |-
      Een storing in de meetinrichting bij de meting of bij de in [hoofdstuk 5][ref1] bedoelde gegevensoverdracht dient
      zo spoedig mogelijk, doch binnen twee werkdagen nadat de storing is opgemerkt verholpen te zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0037925#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel4.3.5.1
    references:
      - id: ref1
        bwb_id: BWBR0037925
        hoofdstuk: '5'
  - number: 4.3.5.2
    text: |-
      Indien, in afwijking van [4.3.5.1][ref1], een oplossing van de in 4.3.5.1 genoemde termijn niet mogelijk is,
      ontvangen de aangeslotene en de regionale netbeheerder binnen twee werkdagen bericht binnen welke termijn de
      storing zal zijn verholpen.


      [ref1]: https://wetten.overheid.nl/BWBR0037925#Artikel4.3.5.1
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel4.3.5.2
    references:
      - id: ref1
        bwb_id: BWBR0037925
        artikel: 4.3.5.1
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 4.3.5.3
    text: |-
      Indien het voor het verhelpen van een storing nodig is dat een medewerker van de meetverantwoordelijke wordt
      begeleid door een bevoegde medewerker van de regionale netbeheerder, geldt hiervoor in aanvulling tot hetgeen is
      bepaald in [4.3.1.1][ref1], dat het verzoek om begeleiding binnen één werkdag wordt gehonoreerd.


      [ref1]: https://wetten.overheid.nl/BWBR0037925#Artikel4.3.1.1
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel4.3.5.3
    references:
      - id: ref1
        bwb_id: BWBR0037925
        artikel: 4.3.1.1
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 5.1.1
    text: |-
      Ten minste eenmaal in de 36 maanden bepaalt de regionale netbeheerder bij niet op afstand uitleesbare
      kleinverbruikmeetinrichtingen de in [4.2.1.1][ref1] bedoelde meetgegevens door middel van aflezing op de
      meetinrichting bij de aangeslotene.


      [ref1]: https://wetten.overheid.nl/BWBR0037925#Artikel4.2.1.1
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel5.1.1
    references:
      - id: ref1
        bwb_id: BWBR0037925
        artikel: 4.2.1.1
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 5.1.2
    text: |-
      Kennisneming van de in [5.1.1][ref1] bedoelde meetgegevens is voorbehouden aan die partijen die daartoe op grond
      van deze code, wetgeving en/of rechtsgeldig gesloten overeenkomsten zijn gerechtigd.


      [ref1]: https://wetten.overheid.nl/BWBR0037925#Artikel5.1.1
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel5.1.2
    references:
      - id: ref1
        bwb_id: BWBR0037925
        artikel: 5.1.1
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 5.1.3
    text: |-
      De in [5.1.1][ref1] bedoelde meetgegevens zijn beveiligd tegen wijziging ervan.


      [ref1]: https://wetten.overheid.nl/BWBR0037925#Artikel5.1.1
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel5.1.3
    references:
      - id: ref1
        bwb_id: BWBR0037925
        artikel: 5.1.1
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 5.2.1
    text: |-
      Ten minste eenmaal per maand, tussen de vijfde werkdag voor en de vijfde werkdag na de maandwisseling, bepaalt
      de meetverantwoordelijke bij profielgrootverbruikmeetinrichtingen op profielgrootverbruikaansluitingen de in
      [4.3.3.1][ref1] bedoelde meetgegevens en slaat deze op in niet-vluchtige databuffers.


      [ref1]: https://wetten.overheid.nl/BWBR0037925#Artikel4.3.3.1
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel5.2.1
    references:
      - id: ref1
        bwb_id: BWBR0037925
        artikel: 4.3.3.1
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 5.2.1a
    text: |-
      Onverminderd [5.2.1][ref1] bepaalt de meetverantwoordelijke bij de meetinrichting op
      profielgrootverbruikaansluitingen die nog niet maandelijks uit- of afgelezen kunnen worden
      ten minste eenmaal per jaar, in de zes weken voorafgaande aan de maand die op grond van
      [2.1.2, onderdeel c, van de Informatiecode elektriciteit en gas][ref2] is opgenomen in het aansluitingenregister,
      de in [4.3.3.1][ref3] bedoelde meetgegevens en slaat deze op in niet-vluchtige databuffers.


      [ref1]: https://wetten.overheid.nl/BWBR0037925#Artikel5.2.1
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel2.1.2
      [ref3]: https://wetten.overheid.nl/BWBR0037925#Artikel4.3.3.1
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel5.2.1a
    references:
      - id: ref1
        bwb_id: BWBR0037925
        artikel: 5.2.1
        hoofdstuk: '5'
        paragraaf: '5.2'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 2.1.2
      - id: ref3
        bwb_id: BWBR0037925
        artikel: 4.3.3.1
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 5.2.2
    text: |-
      De in [5.2.1][ref1] en [5.2.1a][ref2] bedoelde bepaling van de meetgegevens vindt in de regel plaats door
      uit- of aflezing van de meetinrichting door de meetverantwoordelijke. De meetverantwoordelijke kan van de
      aangeslotene verlangen dat de aangeslotene zelf de tellerstand opneemt en deze tellerstand op een door de
      meetverantwoordelijke te bepalen wijze en binnen een door de meetverantwoordelijke aangegeven termijn ter kennis
      van de meetverantwoordelijke brengt.


      [ref1]: https://wetten.overheid.nl/BWBR0037925#Artikel5.2.1
      [ref2]: https://wetten.overheid.nl/BWBR0037925#Artikel5.2.1a
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel5.2.2
    references:
      - id: ref1
        bwb_id: BWBR0037925
        artikel: 5.2.1
        hoofdstuk: '5'
        paragraaf: '5.2'
      - id: ref2
        bwb_id: BWBR0037925
        artikel: 5.2.1a
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: 5.2.2a
    text: |-
      Indien sprake is van dataoverdracht met behulp van pulsen tussen de verschillende onderdelen van de
      meetinrichting of tussen de meetinrichting en de meetverantwoordelijke, worden in afwijking van het gestelde
      in [5.2.1][ref1] de maandelijkse tellerstanden van de gasmeter, en indien van toepassing van het niet herleid
      volume van het volumeherleidingsinstrument en van het herleid volume van het volumeherleidingsinstrument door de
      meetverantwoordelijke berekend op basis van deze pulsen.


      [ref1]: https://wetten.overheid.nl/BWBR0037925#Artikel5.2.1
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel5.2.2a
    references:
      - id: ref1
        bwb_id: BWBR0037925
        artikel: 5.2.1
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: 5.2.3
    text: |-
      Indien [5.2.2a][ref1] van toepassing is, worden ten minste eenmaal per 36 maanden de tellerstanden van de gasmeter,
      en indien van toepassing van het niet herleid volume van het volumeherleidingsinstrument en van het herleid volume
      van het volumeherleidingsinstrument bepaald door het ter plaatse uit- of aflezen van de meetinrichting door de
      meetverantwoordelijke. Het eventueel geconstateerde verschil met de op afstand bepaalde standen wordt restvolume
      genoemd. De oorzaak van het ontstaan van dit restvolume wordt door de meetverantwoordelijke onderzocht. Indien uit
      dit onderzoek blijkt dat (een deel van) het restvolume naar grote waarschijnlijkheid is ontstaan in een concreet
      te duiden maand van de afgelopen twaalf maanden, wijst de meetverantwoordelijke (dit deel van) het restvolume toe
      aan de desbetreffende maand. Het (deel van) het restvolume dat niet kan worden toegewezen aan een concrete maand
      wordt door de meetverantwoordelijke evenredig toegewezen aan de afgelopen 12 maanden. Indien het geconstateerde
      verschil zo groot is dat de bepaalde meetgegevens voor de afgelopen 36 maanden niet voldoen aan de eisen gesteld
      in [4.1.3.3][ref2] voor volumemeting en/of capaciteitsmeting, vindt een onderzoek plaats naar de datacollectie en
      maakt de meetverantwoordelijke een schatting van het werkelijke verbruik gedurende de (vermoedelijke) periode dat
      de meting onjuist was. Dit verbruik wordt door de meetverantwoordelijke evenredig toegewezen aan de (vermoedelijke)
      periode dat de meting onjuist was, of, indien deze periode langer dan 12 maanden geleden is, aan de afgelopen
      12 maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0037925#Artikel5.2.2a
      [ref2]: https://wetten.overheid.nl/BWBR0037925#Artikel4.1.3.3
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel5.2.3
    references:
      - id: ref1
        bwb_id: BWBR0037925
        artikel: 5.2.2a
        hoofdstuk: '5'
        paragraaf: '5.2'
      - id: ref2
        bwb_id: BWBR0037925
        artikel: 4.1.3.3
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 5.2.3a
    text: |-
      Onverminderd [5.2.1][ref1] bepaalt de meetverantwoordelijke eenmaal in de 36 maanden bij
      profielgrootverbruikmeetinrichtingen die nog niet maandelijks uit- of afgelezen kunnen worden de meetgegevens
      genoemd in [5.2.1a][ref2] door aflezing op de meetinrichting bij de aangeslotene en slaat deze meetgegevens op in
      niet-vluchtige databuffers.


      [ref1]: https://wetten.overheid.nl/BWBR0037925#Artikel5.2.1
      [ref2]: https://wetten.overheid.nl/BWBR0037925#Artikel5.2.1a
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel5.2.3a
    references:
      - id: ref1
        bwb_id: BWBR0037925
        artikel: 5.2.1
        hoofdstuk: '5'
        paragraaf: '5.2'
      - id: ref2
        bwb_id: BWBR0037925
        artikel: 5.2.1a
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: 5.2.4
    text: |-
      Kennisneming van de in [5.2.1][ref1], [5.2.1a][ref2], [5.2.2][ref3], [5.2.2a][ref4], [5.2.3][ref5] en
      [5.2.3a][ref6] bedoelde meetgegevens is voorbehouden aan die partijen die daartoe op grond van deze regeling,
      wetgeving en/of rechtsgeldig gesloten overeenkomsten zijn gerechtigd.


      [ref1]: https://wetten.overheid.nl/BWBR0037925#Artikel5.2.1
      [ref2]: https://wetten.overheid.nl/BWBR0037925#Artikel5.2.1a
      [ref3]: https://wetten.overheid.nl/BWBR0037925#Artikel5.2.2
      [ref4]: https://wetten.overheid.nl/BWBR0037925#Artikel5.2.2a
      [ref5]: https://wetten.overheid.nl/BWBR0037925#Artikel5.2.3
      [ref6]: https://wetten.overheid.nl/BWBR0037925#Artikel5.2.3a
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel5.2.4
    references:
      - id: ref1
        bwb_id: BWBR0037925
        artikel: 5.2.1
        hoofdstuk: '5'
        paragraaf: '5.2'
      - id: ref2
        bwb_id: BWBR0037925
        artikel: 5.2.1a
        hoofdstuk: '5'
        paragraaf: '5.2'
      - id: ref3
        bwb_id: BWBR0037925
        artikel: 5.2.2
        hoofdstuk: '5'
        paragraaf: '5.2'
      - id: ref4
        bwb_id: BWBR0037925
        artikel: 5.2.2a
        hoofdstuk: '5'
        paragraaf: '5.2'
      - id: ref5
        bwb_id: BWBR0037925
        artikel: 5.2.3
        hoofdstuk: '5'
        paragraaf: '5.2'
      - id: ref6
        bwb_id: BWBR0037925
        artikel: 5.2.3a
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: 5.2.5
    text: |-
      De meetverantwoordelijke draagt er zorg voor dat de in [5.2.1][ref1], [5.2.1a][ref2], [5.2.2][ref3],
      [5.2.2a][ref4], [5.2.3][ref5] en [5.2.3a][ref6] bedoelde meetgegevens zijn beveiligd tegen wijziging ervan.


