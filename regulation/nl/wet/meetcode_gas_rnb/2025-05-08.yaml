    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel5a.2.1
  - number: 5a.2.2
    text: |-
      Indien de invoeder met een andere meetmethode, gelijkwaardig aan die zoals bedoeld in [5a.2.1][ref1], de
      gaskwaliteit wil bepalen, wordt dit in overleg met de netbeheerder toegestaan, indien de invoeder aantoont dat deze
      meetmethode gelijkwaardige meetresultaten oplevert. Metingen dienen te geschieden met gelijke bepalingsintervallen
      zoals genoemd in 5a.2.1. Indien de toegepaste meetinstrumenten leiden tot afwijkende onderhouds- en
      beheerfrequentie, dient dit te worden goedgekeurd door de in [5a.1.1, onderdeel c][ref2], bedoelde persoon of
      organisatie.


      [ref1]: https://wetten.overheid.nl/BWBR0037925#Artikel5a.2.1
      [ref2]: https://wetten.overheid.nl/BWBR0037925#Artikel5a.1.1
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel5a.2.2
    references:
      - id: ref1
        bwb_id: BWBR0037925
        artikel: 5a.2.1
        hoofdstuk: 5a
        paragraaf: 5a.2
      - id: ref2
        bwb_id: BWBR0037925
        artikel: 5a.1.1
        hoofdstuk: 5a
        paragraaf: 5a.1
  - number: 5a.2.3
    text: |-
      In aanvulling op [5a.2.1][ref1] wordt tevens een bewakingssignaal aangeboden voor de bewaking van de THT-
      voorziening.


      [ref1]: https://wetten.overheid.nl/BWBR0037925#Artikel5a.2.1
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel5a.2.3
    references:
      - id: ref1
        bwb_id: BWBR0037925
        artikel: 5a.2.1
        hoofdstuk: 5a
        paragraaf: 5a.2
  - number: 5a.2.4
    text: |-
      Indien de invoedingsinstallatie is voorzien van een bijmenginstallatie van stikstof, zal het gehalte aan
      stikstof via een gaschromatische meting worden vastgesteld, tezamen met een flowmeting van het gas of de gassen
      die bijgemengd worden, tenzij de invoedingsinstallatie beschikt over een gaskwaliteitsmeting waarmee de Wobbe-
      Index kan worden bepaald zonder het gehalte aan stikstof te bepalen. In aanvulling op [5a.2.1][ref1] worden deze
      bewakingssignalen aangeboden.


      [ref1]: https://wetten.overheid.nl/BWBR0037925#Artikel5a.2.1
    url: https://wetten.overheid.nl/BWBR0037925/2025-05-08#Artikel5a.2.4
    references:
      - id: ref1
        bwb_id: BWBR0037925
        artikel: 5a.2.1
        hoofdstuk: 5a
        paragraaf: 5a.2
  - number: 5a.2.5
    text: |-
      Met een halfjaarlijks interval wordt een monstername van het gas gedaan. Hierop wordt een laboratoriumanalyse
      conform onderstaande tabel uitgevoerd. Daarbij geldt dat:

      a. voor de componenten THT, CO en Siloxanen de gaschromatografische bepalingsmethode moet worden toegepast of
      apparatuur met gelijkwaardige eigenschappen;

      b. voor de THT-bepaling de invoeder in gelegenheid wordt gesteld om door middel van het monsternamepunt zoals
      omschreven in [2.5.1a.2 van de Aansluit- en transportcode Gas – RNB][ref1] een monster te nemen;

      c. in de opstartfase van de invoeding de netbeheerder in overleg met de invoeder een ander dan halfjaarlijkse
      interval kan vaststellen;

      d. voor de componenten CH, CO, N en O de totale onnauwkeurigheid van het gasmengsel moet voldoen aan de Wobbe- en
      calorische waarde specificaties, zoals vermeld in [5a.2.1][ref2]; en

      e. in de rapportage van de laboratoriumtest voor micro-organismen wordt aangegeven wat de wijze van monsterneming,
      de wijze van analyse en het criterium voor een positieve test is.










