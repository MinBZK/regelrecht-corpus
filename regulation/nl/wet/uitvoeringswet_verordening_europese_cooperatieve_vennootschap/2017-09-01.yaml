preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat Verordening (EG) 1435/2003 van de Raad van de Europese Unie van 22 juli
    2003 betreffende het statuut voor een Europese Coöperatieve Vennootschap (SCE) (PbEU L 207) moet worden uitgevoerd;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0020302/2017-09-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Voor de toepassing van de [artikelen 2 tot en met 21][ref1] van deze wet wordt verstaan onder:

      a. Verordening: de [Verordening (EG) nr. 1435/2003](32003R1435) van de Raad van de Europese Unie van 22 juli 2003
      betreffende het statuut voor een Europese Coöperatieve Vennootschap (SCE) (PbEU L 207);

      b. Europese coöperatieve vennootschap: een vennootschap, opgericht overeenkomstig de Verordening.


      [ref1]: https://wetten.overheid.nl/BWBR0020302#Artikel2
    url: https://wetten.overheid.nl/BWBR0020302/2017-09-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0020302
        artikel: '2'
        hoofdstuk: '1'
  - number: '2'
    text: |-
      Een juridisch lichaam in de zin van artikel 2, tweede lid, van de Verordening kan deelnemen aan de oprichting van
      een Europese coöperatieve vennootschap met statutaire zetel in Nederland.
    url: https://wetten.overheid.nl/BWBR0020302/2017-09-01#Artikel2
  - number: '3'
    text: |-
      Tenzij de statuten anders bepalen, zijn de [leden 2 en 3 van artikel 86c van Boek 2 van het Burgerlijk Wetboek][ref1]
      van overeenkomstige toepassing op de levering van aandelen van een Europese coöperatieve vennootschap.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel86c
    url: https://wetten.overheid.nl/BWBR0020302/2017-09-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 86c
  - number: '4'
    text: |-
      Ten behoeve van de verplaatsing van de statutaire zetel naar een andere lidstaat van de Europese Unie, legt een
      Europese coöperatieve vennootschap met statutaire zetel in Nederland een voorstel tot zetelverplaatsing als bedoeld
      in artikel 7, tweede lid, van de Verordening neer ten kantore van het handelsregister. De Europese coöperatieve
      vennootschap kondigt in een landelijk verspreid dagblad aan dat het voorstel is neergelegd, met opgave van het
      handelsregister waar het voorstel ligt en van het adres waar krachtens artikel 7, vierde lid, van de Verordening
      van het voorstel kennis kan worden genomen.
    url: https://wetten.overheid.nl/BWBR0020302/2017-09-01#Artikel4
  - number: '5'
    text: |-
      1 Een Europese coöperatieve vennootschap met statutaire zetel in Nederland die tot zetelverplaatsing naar een
      andere lidstaat van de Europese Unie wil overgaan moet, op straffe van gegrondverklaring van een verzet als bedoeld
      in het tweede lid, voor iedere schuldeiser die dit verlangt zekerheid stellen of hem een andere waarborg geven voor
      de voldoening van zijn vordering die voor de zetelverplaatsing is ontstaan of kan ontstaan. Dit geldt niet, indien
      de schuldeiser voldoende waarborgen heeft of de vermogenstoestand van de vennootschap voldoende zekerheid biedt dat
      de vordering zal worden voldaan.

      2 Tot twee maanden nadat de vennootschap de nederlegging van het voorstel tot zetelverplaatsing heeft aangekondigd
      kan iedere schuldeiser door indiening van een verzoek bij de rechtbank tegen het voorstel tot zetelverplaatsing in
      verzet komen met vermelding van de waarborg die wordt verlangd.

      3 Voordat de rechter beslist, kan hij de vennootschap in de gelegenheid stellen binnen een door hem te stellen
      termijn een door hem omschreven waarborg te geven.

      4 Indien tijdig verzet is gedaan, mag de verklaring in de zin van artikel 7, achtste lid, van de Verordening eerst
      worden afgegeven, zodra het verzet is ingetrokken of de opheffing van het verzet uitvoerbaar is.

      5 Indien de zetelverplaatsing al heeft plaatsgevonden, kan de rechter op een ingesteld rechtsmiddel het stellen van
      een door hem omschreven waarborg bevelen en daaraan een dwangsom verbinden.
    url: https://wetten.overheid.nl/BWBR0020302/2017-09-01#Artikel5
  - number: '6'
    text: |-
      1 De zetelverplaatsing van een Europese coöperatieve vennootschap met statutaire zetel in Nederland naar een andere
      lidstaat van de Europese Unie heeft geen rechtsgevolg wanneer Onze Minister van Justitie zich daartegen verzet om
      redenen van algemeen belang door nederlegging van een daarop betrekking hebbende verklaring ten kantore van het
      handelsregister, binnen twee maanden na de aankondiging van de nederlegging van het voorstel. De verklaring in de
      zin van artikel 7, achtste lid, van de Verordening mag eerst worden afgegeven, zodra het verzet is ingetrokken of
      de opheffing van het verzet onherroepelijk is.

      2 Voor de toepassing van artikel 7, veertiende lid, tweede alinea, van de Verordening is de tweede zin van het
      eerste lid van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0020302/2017-09-01#Artikel6
  - number: '7'
    text: |-
      1 Als register voor de inschrijving van een Europese coöperatieve vennootschap met statutaire zetel in
      Nederland of van een Nederlandse nevenvestiging van een Europese coöperatieve vennootschap wordt aangewezen: het
      handelsregister, bedoeld in [artikel 2 van de Handelsregisterwet 2007][ref1].

      2 Bij inschrijving van de zetelverplaatsing van een Europese coöperatieve vennootschap naar Nederland
      wordt een notariële akte die de statuten van de vennootschap bevat en is verleden door een notaris met
      standplaats in Nederland neergelegd ten kantore van het handelsregister. De [artikelen 65][ref2] en
      [69 van Boek 2 van het Burgerlijk Wetboek][ref3] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0021777#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel65
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Artikel69
    url: https://wetten.overheid.nl/BWBR0020302/2017-09-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0021777
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '65'
      - id: ref3
        bwb_id: BWBR0003045
        artikel: '69'
  - number: '8'
    text: |-
      De statuten van een Europese coöperatieve vennootschap met statutaire zetel in Nederland kunnen bepalen dat het
      lidmaatschap open staat voor niet-gebruikende leden, bedoeld in artikel 14, eerste lid, van de Verordening. Worden
      in de statuten aan niet-gebruikende leden, bedoeld in artikel 14, eerste lid, van de Verordening, stemrechten
      toegekend dan bedragen deze tezamen ten hoogste een kwart van het totale aantal stemrechten op grond van de
      statuten.
    url: https://wetten.overheid.nl/BWBR0020302/2017-09-01#Artikel8
  - number: '9'
    text: |-
      Een coöperatie met statutaire zetel in Nederland kan niet aan de oprichting van een Europese coöperatieve
      vennootschap door fusie deelnemen wanneer Onze Minister van Justitie zich daartegen verzet om redenen van algemeen
      belang door nederlegging van een daarop betrekking hebbende verklaring ten kantore van het handelsregister
      binnen een maand na de bekendmaking van de gegevens als bedoeld in artikel 24, tweede lid, van de Verordening. De
      deelneming aan de fusie heeft eerst rechtsgevolg zodra het verzet is ingetrokken of de opheffing van het verzet
      onherroepelijk is.
    url: https://wetten.overheid.nl/BWBR0020302/2017-09-01#Artikel9
  - number: '10'
    text: |-
      De coöperatie met statutaire zetel in Nederland die overeenkomstig artikel 35 van de Verordening een voorstel
      tot omzetting in een Europese coöperatieve vennootschap heeft opgesteld, legt het voorstel neer ten kantore
      van het handelsregister en kondigt de nederlegging aan in een landelijk verspreid dagblad. Een accountant als
      bedoeld in [artikel 393 lid 1 van Boek 2 van het Burgerlijk Wetboek][ref1] stelt, voorafgaand aan de algemene
      vergadering, vast dat het voorstel tot omzetting voldoet aan het bepaalde in artikel 22, eerste lid, onder b, van
      de Verordening.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0020302/2017-09-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '11'
    text: |-
      1 De benoeming van de leden van het leidinggevend orgaan geschiedt door het toezichthoudend orgaan, tenzij in de
      statuten is bepaald dat benoeming geschiedt door de algemene vergadering.

      2 Voor de toepassing van artikel 37, tweede lid, van de Verordening zijn de
      [leden 2, 4, 5 en 6 van artikel 37 van Boek 2 van het Burgerlijk Wetboek][ref1] van overeenkomstige toepassing op
      de Europese coöperatieve vennootschap met statutaire zetel in Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel37
    url: https://wetten.overheid.nl/BWBR0020302/2017-09-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '37'
  - number: '12'
    text: |-
      De statuten van de Europese coöperatieve vennootschap met statutaire zetel in Nederland moeten voorschriften
      bevatten omtrent de wijze, waarop voorlopig in het bestuur wordt voorzien ingeval van ontstentenis of belet van
      bestuurders.
    url: https://wetten.overheid.nl/BWBR0020302/2017-09-01#Artikel12
  - number: '13'
    text: |-
      1 Het bestuursorgaan als bedoeld in artikel 42 van de Verordening bestaat uit ten minste drie leden.

      2 De [artikelen 7][ref1] en [45 van Boek 2 van het Burgerlijk Wetboek][ref2] zijn van overeenkomstige toepassing op
      een Europese coöperatieve vennootschap met statutaire zetel in Nederland.

      3 Voor de toepassing van artikel 46, eerste lid, van de Verordening geldt dat de leden van het bestuursorgaan
      die overeenkomstig een onderlinge taakverdeling niet belast zijn met het uitvoerend bestuur, natuurlijke personen
      moeten zijn.

      3 Voor de toepassing van artikel 46, eerste lid, van de Verordening geldt dat de leden van het bestuursorgaan die
      overeenkomstig een taakverdeling niet belast zijn met het uitvoerend bestuur, natuurlijke personen moeten zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel45
    url: https://wetten.overheid.nl/BWBR0020302/2017-09-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '45'
  - number: '14'
    text: |-
      Voor de toepassing van artikel 54 van de Verordening geldt dat de eerste algemene vergadering binnen achttien
      maanden na de oprichting mag plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0020302/2017-09-01#Artikel14
  - number: '15'
    text: |-
      In de in artikel 63, eerste lid, van de Verordening bedoelde gevallen kunnen de statuten van een Europese
      coöperatieve vennootschap voorzien in sectorvergaderingen of afdelingsvergaderingen.
    url: https://wetten.overheid.nl/BWBR0020302/2017-09-01#Artikel15
  - number: '16'
    text: |-
      In de in artikel 73, eerste lid, van de Verordening bedoelde gevallen wordt een Europese coöperatieve vennootschap
      met statutaire zetel in Nederland door de rechtbank op verzoek van een belanghebbende dan wel op verzoek van
      het Openbaar Ministerie ontbonden. Alvorens de ontbinding uit te spreken kan de rechtbank de vennootschap in de
      gelegenheid stellen de geconstateerde gebreken binnen een door haar te bepalen termijn op te heffen.
    url: https://wetten.overheid.nl/BWBR0020302/2017-09-01#Artikel16
  - number: '17'
    text: |-
      Een Europese coöperatieve vennootschap met statutaire zetel in Nederland wordt door de rechtbank op verzoek van het
      Openbaar Ministerie ontbonden indien het hoofdbestuur niet in Nederland is gevestigd. Alvorens de ontbinding uit
      te spreken kan de rechtbank de vennootschap in de gelegenheid stellen binnen een door haar te bepalen termijn het
      hoofdbestuur naar Nederland te verplaatsen dan wel de statutaire zetel te verplaatsen overeenkomstig artikel 7 van
      de Verordening.
    url: https://wetten.overheid.nl/BWBR0020302/2017-09-01#Artikel17
  - number: '18'
    text: |-
      In de statuten kan de bestemming van het batig saldo, bedoeld in artikel 75 van de Verordening, in geval van
      ontbinding worden bepaald, of de wijze waarop de bestemming zal worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0020302/2017-09-01#Artikel18
  - number: '19'
    text: |-
      De Europese coöperatieve vennootschap met statutaire zetel in Nederland die overeenkomstig artikel 76 van de
      Verordening een voorstel tot omzetting in een coöperatie heeft opgesteld, legt het voorstel neer ten kantore van
      het handelsregister en kondigt de nederlegging aan in een landelijk verspreid dagblad. Een accountant als bedoeld
      in [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1] stelt, voorafgaand aan de algemene
      vergadering, vast dat de in een coöperatie om te zetten Europese coöperatieve vennootschap over activa beschikt die
      minimaal overeenstemmen met het kapitaal.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0020302/2017-09-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '20'
    text: |-
      Als bevoegde autoriteit in de zin van artikel 7, achtste lid, artikel 29, tweede lid, en artikel 30, eerste lid,
      van de Verordening wordt aangewezen: een notaris met vestigingsplaats in Nederland.
    url: https://wetten.overheid.nl/BWBR0020302/2017-09-01#Artikel20
  - number: '21'
    text: |-
      Als bevoegde autoriteit in de zin van artikel 73, vijfde lid, van de Verordening wordt aangewezen: het hoofd van
      het ressortsparket.
    url: https://wetten.overheid.nl/BWBR0020302/2017-09-01#Artikel21
  - number: '25'
    text: 'Deze wet wordt aangehaald als: Uitvoeringswet verordening Europese coöperatieve vennootschap.'
    url: https://wetten.overheid.nl/BWBR0020302/2017-09-01#Artikel25
  - number: '26'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0020302/2017-09-01#Artikel26
