  - number: '18'
    text: |-
      1 Algemene maatregelen van bestuur en ministeriële regelingen die voor het tijdstip van inwerkingtreding
      van deze wet een grondslag vonden in bepalingen, gesteld bij of krachtens de [Wet Justitie-subsidies][ref1]
      of de [Woningwet][ref2], berusten, voor zover zij voorzien in subsidies binnen het toepassingsgebied van
      de [Kaderwet overige BZK-subsidies][ref3], vanaf het tijdstip van inwerkingtreding van deze wet op de
      [artikelen 3][ref4] en [4 van de Kaderwet overige BZK-subsidies][ref5] of mede op die artikelen.

      2 Algemene maatregelen van bestuur en ministeriële regelingen die voor het tijdstip van inwerkingtreding
      van deze wet een grondslag vonden in bepalingen, gesteld bij of krachtens [artikel 14][ref6] of
      [15 van de Wet overige BZK-subsidies][ref7], berusten, voor zover zij voorzien in subsidies binnen het
      toepassingsgebied van [hoofdstuk 4E van de Wet Justitie-subsidies][ref8], vanaf het tijdstip van inwerkingtreding
      van deze wet op [artikel 48s][ref9] onderscheidenlijk [artikel 48t van de Wet Justitie-subsidies][ref10] of mede op
      die artikelen.


