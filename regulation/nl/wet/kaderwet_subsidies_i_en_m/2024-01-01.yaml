preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is een algemeen wettelijk kader te stellen met betrekking
    tot de verstrekking van subsidies door Onze Minister van Infrastructuur en Milieu en wijziging aan te brengen in
    het wettelijk kader met betrekking tot de verstrekking van subsidies door Onze Minister van Binnenlandse Zaken en
    Koninkrijksrelaties, Onze Minister voor Immigratie en Asiel en Onze Minister van Veiligheid en Justitie;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0032789/2024-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder Onze Minister: Onze Minister van Infrastructuur
      en Milieu.
    url: https://wetten.overheid.nl/BWBR0032789/2024-01-01#Artikel1
  - number: '2'
    text: |-
      In afwijking van [artikel 4:21, derde lid, van de Algemene wet bestuursrecht][ref1] is
      [titel 4.2 van die wet][ref2] van toepassing op subsidies die worden verstrekt op grond van een algemene maatregel
      van bestuur of ministeriële regeling als bedoeld in [artikel 4][ref3], die uitsluitend voorziet in verstrekking aan
      rechtspersonen die krachtens publiekrecht zijn ingesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel421
      [ref2]: https://wetten.overheid.nl/BWBR0005537
      [ref3]: https://wetten.overheid.nl/BWBR0032789#Artikel4
    url: https://wetten.overheid.nl/BWBR0032789/2024-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:21
      - id: ref2
        bwb_id: BWBR0005537
      - id: ref3
        bwb_id: BWBR0032789
        artikel: '4'
  - number: '3'
    text: |-
      1 Onze Minister kan subsidies verstrekken voor activiteiten die passen in het beleid inzake:

      a. infrastructuur;

      b. milieubeheer;

      c. luchtvaart en luchtverkeer;

      d. ruimtelijke ordening;

      e. scheepvaart en maritieme zaken;

      f. verkeer en vervoer;

      g. water.

      2 Onze Minister kan voorts subsidies verstrekken voor activiteiten op het gebied van de onderwerpen, die zijn
      genoemd in de begrotingsstaat, onderdeel uitgaven en verplichtingen, behorend bij de wet, houdende vaststelling
      van de begrotingsstaten van het Ministerie van Infrastructuur en Milieu voor het desbetreffende jaar, of voor een
      voorafgaand jaar, voor zover daarin een beschikking tot subsidieverstrekking is gegeven. Indien bij de aanvang
      van enig jaar bedoelde wet nog niet in werking is getreden, wordt tot die inwerkingtreding het voorstel daartoe in
      aanmerking genomen.
    url: https://wetten.overheid.nl/BWBR0032789/2024-01-01#Artikel3
  - number: '4'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur of bij regeling van Onze Minister kunnen de in [artikel 3][ref1]
      bedoelde activiteiten waarvoor subsidie kan worden verstrekt nader worden bepaald en kunnen criteria voor die
      verstrekking worden vastgesteld.

      2 Bij een algemene maatregel van bestuur of een ministeriële regeling als bedoeld in het eerste lid wordt voorzien
      in de vaststelling van een subsidieplafond en de regeling van de wijze van verdeling ervan, tenzij Onze Minister
      van Financiën heeft ingestemd met het achterwege laten daarvan.

      3 Indien de in het eerste lid bedoelde regels bepalen dat de subsidie kan worden verstrekt in de openbare lichamen
      Bonaire, Sint Eustatius en Saba, is deze wet voor die subsidie aldaar van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0032789#Artikel3
    url: https://wetten.overheid.nl/BWBR0032789/2024-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0032789
        artikel: '3'
  - number: '5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur of bij regeling van Onze Minister kunnen regels dan wel nadere
      regels worden gesteld met betrekking tot:

      a. de aanvraag van de subsidie, de daarbij over te leggen gegevens en bescheiden, en de besluitvorming daarover;

      b. het bedrag van de subsidie dan wel de wijze waarop dit bedrag wordt bepaald;

      c. de voorwaarden waaronder de subsidie wordt verleend;

      d. de verplichtingen van de subsidie-ontvanger;

      e. de vaststelling van de subsidie;

      f. de betaling van de subsidie en het verlenen van voorschotten;

      g. intrekking of wijziging van de subsidieverlening of -vaststelling;

      h. de wijze van verdeling van beschikbare bedragen;

      i. de vergoeding die verschuldigd is bij vermogensvorming, bedoeld in
      [artikel 4:41 van de Algemene wet bestuursrecht][ref1];

      j. de termijn van publicatie en de inrichting van het verslag over de doeltreffendheid en de effecten van de
      subsidie in de praktijk;

      k. de openbaarmaking van de resultaten van de gesubsidieerde activiteiten;

      l. het geven van informatie aan derden over de gesubsidieerde activiteiten door de subsidie-ontvanger.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel441
    url: https://wetten.overheid.nl/BWBR0032789/2024-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:41
  - number: '6'
    text: |-
      1 Voor zover subsidieverstrekking in strijd is met ingevolge een verdrag voor de staat geldende verplichtingen, kan
      Onze Minister:

      a. de subsidieverstrekking weigeren;

      b. de subsidie lager vaststellen dan overeenkomstig de subsidieverlening;

      c. de subsidieverlening of -vaststelling intrekken of ten nadele van de subsidie-ontvanger wijzigen.

      2 Bij de vaststelling, intrekking of wijziging, bedoeld in het eerste lid, kan worden bepaald dat over een
      onverschuldigd betaalde subsidie een rentevergoeding is verschuldigd.

      3 De intrekking of wijziging, bedoeld in het eerste lid, werkt terug tot en met het tijdstip waarop de subsidie is
      verstrekt, tenzij bij die intrekking of wijziging anders is bepaald.

      4 De [artikelen 4:49, derde lid][ref1], en [4:57, vierde lid, van de Algemene wet bestuursrecht][ref2] zijn niet
      van toepassing op de vaststelling, intrekking en wijziging, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel449
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel457
    url: https://wetten.overheid.nl/BWBR0032789/2024-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:49
      - id: ref2
        bwb_id: BWBR0005537
        artikel: 4:57
  - number: 6a
    text: |-
      Onze Minister kan de uitvoering van een algemene maatregel van bestuur of een ministeriële regeling over het
      verstrekken van subsidies voor de in [artikel 3][ref1] genoemde activiteiten met inbegrip van het nemen van
      besluiten op grond van die regels delegeren aan bestuursorganen van provincie of gemeente.


      [ref1]: https://wetten.overheid.nl/BWBR0032789#Artikel3
    url: https://wetten.overheid.nl/BWBR0032789/2024-01-01#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0032789
        artikel: '3'
  - number: '7'
    text: |-
      1 Met het toezicht op de naleving van de bij of krachtens deze wet aan de subsidie-ontvanger opgelegde
      verplichtingen zijn belast de bij besluit van Onze Minister aangewezen personen.

      2 De toezichthouder beschikt niet over de bevoegdheden, vermeld in de [artikelen 5:18][ref1] en
      [5:19 van de Algemene wet bestuursrecht][ref2].

      3 Aan subsidies die op grond van deze wet zijn verstrekt, is de verplichting verbonden dat de subsidie-ontvanger
      aan een toezichthouder alle medewerking verleent die deze redelijkerwijze kan vorderen bij de uitoefening van zijn
      bevoegdheden.

      4 Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel518
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel519
    url: https://wetten.overheid.nl/BWBR0032789/2024-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 5:18
      - id: ref2
        bwb_id: BWBR0005537
        artikel: 5:19
  - number: '17'
    text: |-
      Algemene maatregelen van bestuur en ministeriële regelingen die voor de inwerkingtreding van deze wet een grondslag
      vonden in bepalingen, gesteld bij of krachtens de [Wet milieubeheer][ref1], de [Wet ruimtelijke ordening][ref2]
      of de [Kaderwet subsidies Verkeer en Waterstaat][ref3] berusten, voor zover zij voorzien in subsidies binnen het
      toepassingsgebied van deze wet, vanaf het tijdstip van inwerkingtreding van deze wet op de [artikelen 4][ref4] en
      [5][ref5] van deze wet of mede op die artikelen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245
      [ref2]: https://wetten.overheid.nl/BWBR0020449
