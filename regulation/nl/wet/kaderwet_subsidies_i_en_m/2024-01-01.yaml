  - number: '19'
    text: Deze wet is niet van toepassing op subsidies die voor de inwerkingtreding van deze wet zijn verstrekt.
    url: https://wetten.overheid.nl/BWBR0032789/2024-01-01#Artikel19
  - number: '20'
    text: |-
      Onze Minister zendt binnen vijf jaar na de inwerkingtreding van deze wet aan de Staten-Generaal een verslag over de
      doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0032789/2024-01-01#Artikel20
  - number: '21'
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0032789/2024-01-01#Artikel21
  - number: '22'
    text: 'Deze wet wordt aangehaald als: Kaderwet subsidies I en M.'
    url: https://wetten.overheid.nl/BWBR0032789/2024-01-01#Artikel22
