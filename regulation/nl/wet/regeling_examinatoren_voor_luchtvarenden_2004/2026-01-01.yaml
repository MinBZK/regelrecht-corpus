---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: regeling_examinatoren_voor_luchtvarenden_2004
regulatory_layer: WET
publication_date: '2025-12-17'
valid_from: '2026-01-01'
bwb_id: BWBR0017236
url: https://wetten.overheid.nl/BWBR0017236/2026-01-01
preamble:
  text: |-
    Gelet op de artikelen 14, vierde lid, en 15, tweede lid, van het Besluit bewijzen van bevoegdheid voor de
    luchtvaart;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0017236/2026-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In deze regeling wordt verstaan onder: - *acceptatietest:* vaardigheidstest voor examinatoren als beschreven in FCL
      1.020 van verordening (EU) nr. 1178/2011;
        - *minister:* Minister van Infrastructuur en Waterstaat;
        - *praktijkexamen:* onderzoek naar de mate waarin een kandidaat voldoet aan de bedrevenheideisen, bedoeld in
      de [Regeling bewijzen van bevoegdheid en bevoegdverklaringen voor luchtvarenden 2001][ref1], ten behoeve van de
      afgifte van een bewijs van bevoegdheid of een bevoegdverklaring;
        - *proeve van bekwaamheid:* onderzoek naar de mate waarin een kandidaat voldoet aan de bedrevenheideisen als
      bedoeld in de [Regeling bewijzen van bevoegdheid en bevoegdverklaringen voor luchtvarenden 2001][ref2], ten behoeve
      van de verlenging of de hernieuwde afgifte van een bevoegdverklaring;
        - *RFE:* examinator recreatief vlieger (Recreational Flight Examiner);
        - *RFIE:* examinator voor de bevoegdverklaring tot recreatief vlieginstructeur (Recreational Flight Instructor
      Examiner);
        - *wet:* [Wet luchtvaart][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0021240
      [ref2]: https://wetten.overheid.nl/BWBR0021240
      [ref3]: https://wetten.overheid.nl/BWBR0005555
    url: https://wetten.overheid.nl/BWBR0017236/2026-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0021240
      - id: ref2
        bwb_id: BWBR0021240
      - id: ref3
        bwb_id: BWBR0005555
  - number: '1.2'
    text: 'In deze regeling wordt met de volgende toevoegingen bedoeld:'
    url: https://wetten.overheid.nl/BWBR0017236/2026-01-01#Artikel1
  - number: 1.2.a
    text: 'A: de categorie vliegtuigen (Aeroplanes);'
    url: https://wetten.overheid.nl/BWBR0017236/2026-01-01#Artikel1
  - number: 1.2.b
    text: 'H: de categorie helikopters (Helicopters);'
    url: https://wetten.overheid.nl/BWBR0017236/2026-01-01#Artikel1
  - number: 1.2.c
    text: 'FB: de categorie vrije ballonnen (Free Balloons);'
    url: https://wetten.overheid.nl/BWBR0017236/2026-01-01#Artikel1
  - number: 1.2.d
    text: 'GC: de categorie gyrokopters (Gyrocopters).'
    url: https://wetten.overheid.nl/BWBR0017236/2026-01-01#Artikel1
  - number: '1.3'
    text: |-
      Verwijzingen naar JAR-FCL in deze regeling hebben betrekking op de Nederlandstalige versie van JAR-FCL 1, 2 of 4,
      zoals deze ter inzage liggen bij het Ministerie van Infrastructuur en Waterstaat.
    url: https://wetten.overheid.nl/BWBR0017236/2026-01-01#Artikel1
  - number: 1a
    text: |-
      Deze regeling berust tevens op [artikel 1.5 van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel1
    url: https://wetten.overheid.nl/BWBR0017236/2026-01-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '1'
  - number: '2.1'
    text: 'Aan vliegers worden de volgende autorisaties afgegeven:'
    url: https://wetten.overheid.nl/BWBR0017236/2026-01-01#Artikel2
  - number: 2.1.a
    text: |-
      RFE(A), RFE(H) dan wel RFE(GC), die de bevoegdheid geeft tot het afnemen van praktijkexamens en proeven van
      bekwaamheid voor de afgifte, verlenging en hernieuwde afgifte van een RPL(A), een RPL(H) dan wel een RPL(GC)
      inclusief de daarbij behorende bijzondere bevoegdverklaringen, indien is voldaan aan de eis van ten minste 500
      vlieguren op vliegtuigen, helikopters dan wel gyrokopters, waaronder ten minste 100 uren vliegonderricht voor de
      afgifte van een RPL(A), RPL(H) dan wel RPL(GC) in de desbetreffende bijzondere bevoegdverklaring;
    url: https://wetten.overheid.nl/BWBR0017236/2026-01-01#Artikel2
  - number: 2.1.b
    text: |-
      RFIE(A), RFIE(H) dan wel RFIE(GC), die de bevoegdheid geeft tot het afnemen van praktijkexamens en proeven
      van bekwaamheid voor de afgifte van een RFE(A), RFE(H) dan wel RFE(GC) voor de desbetreffende bijzondere
      bevoegdverklaring, indien is voldaan aan de eis van minimaal 50 uren vliegonderricht voor de afgifte van RFI.
    url: https://wetten.overheid.nl/BWBR0017236/2026-01-01#Artikel2
  - number: '2.2'
    text: |-
      De houders van een examinatorcertificaat FE(A) of FE(H) respectievelijk FIE(A) of FIE(H) afgegeven overeenkomstig
      verordening (EU) nr. 1178/2011 worden geacht te voldoen aan de eisen die gesteld worden aan de afgifte van een
      RFE(A) of RFE(H) respectievelijk RFIE(A) of RFIE(H) in onderdeel a respectievelijk onderdeel b van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0017236/2026-01-01#Artikel2
  - number: '2.3'
    text: |-
      De houders van een examinatorcertificaat FE(A) of FE(H) respectievelijk FIE(A) of FIE(H) afgegeven overeenkomstig
      verordening (EU) nr. 1178/2011 worden geacht te voldoen aan de eisen die gesteld worden aan de afgifte van een
      RFE(GC) respectievelijk RFIE(GC) in onderdeel a respectievelijk onderdeel b van het eerste lid met betrekking tot
      het aantal vlieguren en uren vliegonderricht, indien zij in het bezit zijn van een geldig bewijs van bevoegdheid
      voor RPL(GC) en RFI(GC).
    url: https://wetten.overheid.nl/BWBR0017236/2026-01-01#Artikel2
  - number: '2.4'
    text: |-
      Voor ballonvaarders zijn voor het verkrijgen van de autorisatie tot FE(FB) de eisen, genoemd in onderdeel b van
      het eerste lid van overeenkomstige toepassing en wordt voldaan aan de eis van ten minste 500 vaaruren op een vrije
      ballon, waaronder ten minste 100 uren vaaronderricht voor de afgifte van een CPL(FB). Het tweede lid, onderdeel b,
      is met betrekking tot JAR-FCL 1.430 van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0017236/2026-01-01#Artikel2
  - number: '2.5'
    text: |-
      In het geval van een aanvraag tot afgifte van een autorisatie tot RFE of RFIE vervult een senior-examinator bij de
      acceptatietest, de rol van kandidaat
    url: https://wetten.overheid.nl/BWBR0017236/2026-01-01#Artikel2
  - number: '2.6'
    text: |-
      De autorisaties, bedoeld in dit artikel, zijn beperkt tot het bewijs van bevoegdheid en de bevoegdverklaringen,
      waarvan de examinator houder is en waarvoor hij bevoegd is om instructie te geven.
    url: https://wetten.overheid.nl/BWBR0017236/2026-01-01#Artikel2
  - number: '3'
    text: |-
      Voor examinatoren voor typebevoegdverklaringen voor een luchtvaartuig als bedoeld in bijlage I behorende bij de
      basisverordening zijn de eisen bedoeld in deel FCL, subdeel K, sectie 1 en sectie 3, van [verordening (EU) nr.
      1178/2011](32011R1178) van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0017236/2026-01-01#Artikel3
  - number: '5.1'
    text: |-
      Een autorisatie tot examinator kan worden afgegeven op voordracht van een geregistreerde dan wel gekwalificeerde
      opleidingsinstelling of van een luchtvaartmaatschappij en na het Nationaal Expert Team-Praktijk te hebben gehoord.
    url: https://wetten.overheid.nl/BWBR0017236/2026-01-01#Artikel5
  - number: '5.2'
    text: Een voordracht, als bedoeld in het eerste lid, wordt gedaan op een daartoe door de minister verstrekt formulier.
    url: https://wetten.overheid.nl/BWBR0017236/2026-01-01#Artikel5
  - number: '7'
    text: |-
      Een autorisatie is ongeldig gedurende de periode dat de examinator niet voldoet aan een of meer eisen als bedoeld
      in [artikel 2][ref1]. Indien een dergelijke situatie zich voordoet, is de examinator verplicht dit onverwijld te
      melden aan de minister.


      [ref1]: https://wetten.overheid.nl/BWBR0017236#Artikel2
    url: https://wetten.overheid.nl/BWBR0017236/2026-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0017236
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '8'
    text: |-
      Een examinator is bevoegd om, indien een kandidaat aan alle voorwaarden heeft voldaan, de desbetreffende
      bevoegdverklaring te verlengen dan wel hernieuwd af te geven door daarvan namens de minister aantekening te maken
      op het document, waarop bewijzen van bevoegdheid en bevoegdverklaringen worden weergegeven, en dit document af
      te tekenen.
    url: https://wetten.overheid.nl/BWBR0017236/2026-01-01#Artikel8
  - number: '10'
    text: Er kunnen senior-examinatoren benoemd worden.
    url: https://wetten.overheid.nl/BWBR0017236/2026-01-01#Artikel10
  - number: '11.1'
    text: 'Een senior-examinator heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0017236/2026-01-01#Artikel11
  - number: 11.1.a
    text: |-
      het uitoefenen van supervisie met betrekking tot acceptatietesten, zoals uitgevoerd door een kandidaat-examinator
      ter verkrijging van een autorisatie tot examinator als bedoeld in [artikel 2][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0017236#Artikel2
    url: https://wetten.overheid.nl/BWBR0017236/2026-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0017236
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 11.1.b
    text: |-
      tijdens het uitoefenen van supervisie met betrekking tot acceptatietesten als bedoeld in onderdeel a, uitoefenen
      van de bevoegdheden van een examinator ten opzichte van de examenkandidaat;
    url: https://wetten.overheid.nl/BWBR0017236/2026-01-01#Artikel11
  - number: 11.1.c
    text: |-
      het beoordelen van het afnemen van praktijkexamens en proeven van bekwaamheid door een examinator, in het kader van
      een verlenging van een autorisatie tot examinator als bedoeld in [artikel 2][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0017236#Artikel2
    url: https://wetten.overheid.nl/BWBR0017236/2026-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0017236
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 11.1.d
    text: het leveren van een bijdrage aan de standaardisatie van praktijkexamens en proeven van bekwaamheid;
    url: https://wetten.overheid.nl/BWBR0017236/2026-01-01#Artikel11
  - number: 11.1.e
    text: |-
      het leveren van een bijdrage aan de waarborging van de kwaliteit van praktijkexamens, proeven van bekwaamheid en
      praktijkexaminatoren;
    url: https://wetten.overheid.nl/BWBR0017236/2026-01-01#Artikel11
  - number: 11.1.f
    text: het leveren van ondersteuning aan werkzaamheden ten behoeve van praktijkexamens en proeven van bekwaamheid.
    url: https://wetten.overheid.nl/BWBR0017236/2026-01-01#Artikel11
  - number: '11.2'
    text: |-
      De taken, bedoeld in het eerste lid, worden slechts uitgeoefend ten aanzien van de autorisatie tot examinator met
      betrekking waartoe de senior-examinator is benoemd.
    url: https://wetten.overheid.nl/BWBR0017236/2026-01-01#Artikel11
  - number: '12.1'
    text: |-
      Een senior-examinator die hetzij niet meer in het bezit is van de autorisatie tot examinator met betrekking waartoe
      deze als senior-examinator is benoemd, hetzij niet gerechtigd is de bij deze autorisatie behorende bevoegdheden
      uit te oefenen, oefent geen supervisie uit met betrekking tot acceptatietesten ter verkrijging van een autorisatie
      tot examinator.
    url: https://wetten.overheid.nl/BWBR0017236/2026-01-01#Artikel12
  - number: '12.2'
    text: |-
      Een senior-examinator oefent geen supervisie uit met betrekking tot acceptatietesten respectievelijk beoordeelt
      niet het afnemen van examens of proeven van bekwaamheid als deze een acceptatietest respectievelijk een examen of
      proeve van bekwaamheid voor een type- of klassebevoegdheid inhouden en de senior-examinator binnen de relevante
      autorisatie niet de bevoegdheid heeft tot het examineren voor tenminste één type- of klassebevoegdverklaring.
    url: https://wetten.overheid.nl/BWBR0017236/2026-01-01#Artikel12
  - number: '13'
    text: |-
      Een senior-examinator, die in dienst is van een luchtvaartmaatschappij of opleidingsinstelling, oefent geen
      supervisie uit met betrekking tot een acceptatietest als deze wordt uitgevoerd door een kandidaat-examinator die in
      dienst is van dezelfde luchtvaartmaatschappij of opleidingsinstelling.
    url: https://wetten.overheid.nl/BWBR0017236/2026-01-01#Artikel13
  - number: '14.1'
    text: |-
      Een senior-examinator kan indien deze een taak uitoefent als bedoeld in [artikel 11][ref1] hiervoor een vergoeding
      declareren bij de minister.


      [ref1]: https://wetten.overheid.nl/BWBR0017236#Artikel11
    url: https://wetten.overheid.nl/BWBR0017236/2026-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0017236
        artikel: '11'
        hoofdstuk: '3'
  - number: '14.2'
    text: 'De vergoeding, bedoeld in het eerste lid, bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0017236/2026-01-01#Artikel14
  - number: 14.2.a
    text: een honorarium dat € 372 bedraagt, en
    url: https://wetten.overheid.nl/BWBR0017236/2026-01-01#Artikel14
  - number: 14.2.b
    text: |-
      de ten behoeve van het uitoefenen van de taak gemaakte reis- en verblijfkosten, die volgens hetgeen daarover
      overeengekomen is in de laatste afgesloten collectieve arbeidsovereenkomst voor ambtenaren die krachtens een
      arbeidsovereenkomst met de Staat werkzaam zijn worden vergoed.
    url: https://wetten.overheid.nl/BWBR0017236/2026-01-01#Artikel14
  - number: '14.3'
    text: 'De vergoeding, genoemd in het tweede lid, onderdeel a, kan als volgt gedeclareerd worden:'
    url: https://wetten.overheid.nl/BWBR0017236/2026-01-01#Artikel14
  - number: 14.3.1°
    text: tweemaal voor het afnemen van een examen met inbegrip van de voorbereiding;
    url: https://wetten.overheid.nl/BWBR0017236/2026-01-01#Artikel14
  - number: 14.3.2°
    text: tweemaal voor de deelname aan een vergadering met inbegrip van de voorbereiding;
    url: https://wetten.overheid.nl/BWBR0017236/2026-01-01#Artikel14
  - number: 14.3.3°
    text: tweemaal voor het geven van een seminar met inbegrip van de voorbereiding;
    url: https://wetten.overheid.nl/BWBR0017236/2026-01-01#Artikel14
  - number: 14.3.4°
    text: eenmaal voor het volgen van educatie per dag of een gedeelte daarvan;
    url: https://wetten.overheid.nl/BWBR0017236/2026-01-01#Artikel14
  - number: 14.3.5°
    text: eenmaal voor administratieve werkzaamheden in opdracht van de Inspectie Leefomgeving en Transport.
    url: https://wetten.overheid.nl/BWBR0017236/2026-01-01#Artikel14
  - number: '14.4'
    text: |-
      Reis- en verblijfkosten die een senior-examinator in het buitenland maakt worden niet vergoed door de minister.
      Een senior-examinator, die in dienst is van een luchtvaartmaatschappij of opleidingsinstelling, declareert
      geen vergoeding bij de minister wanneer hij in het kader van een verlenging van een autorisatie tot examinator,
      het afnemen van een praktijkexamen of proeve van bekwaamheid door een examinator in dienst van dezelfde
      luchtvaartmaatschappij of opleidingsinstelling beoordeelt.
    url: https://wetten.overheid.nl/BWBR0017236/2026-01-01#Artikel14
  - number: '15.1'
    text: |-
      Senior-examinatoren worden voor een periode van ten hoogste drie jaren benoemd. Na afloop van deze termijn kunnen
      zij telkens voor ten hoogste drie jaren worden herbenoemd
    url: https://wetten.overheid.nl/BWBR0017236/2026-01-01#Artikel15
  - number: '15.2'
    text: 'Een benoeming tot senior-examinator vervalt van rechtswege:'
    url: https://wetten.overheid.nl/BWBR0017236/2026-01-01#Artikel15
  - number: 15.2.a
    text: |-
      als de autorisatie tot examinator met betrekking waartoe de seniorexaminator is benoemd op grond van
      [artikel 2.6, derde lid, van de wet][ref1] is ingetrokken;


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel2
    url: https://wetten.overheid.nl/BWBR0017236/2026-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '2'
  - number: 15.2.b
    text: |-
      op de eerste dag van de maand nadat de senior-examinator drie jaar hetzij niet meer in het bezit is van de
      autorisatie tot examinator met betrekking waartoe deze is benoemd, hetzij niet meer gerechtigd is de bij deze
      autorisatie behorende bevoegdheden uit te oefenen.
    url: https://wetten.overheid.nl/BWBR0017236/2026-01-01#Artikel15
  - number: '15.2'
    text: Een benoeming tot senior-examinator vervalt op schriftelijk verzoek van de senior-examinator.
    url: https://wetten.overheid.nl/BWBR0017236/2026-01-01#Artikel15
  - number: '15.3'
    text: |-
      Een benoeming tot senior-examinator is geschorst gedurende de periode waarin de autorisatie tot examinator dan wel
      de bevoegdverklaring afgegeven op grond van verordening (EU) nr. 1178/2011 is geschorst.
    url: https://wetten.overheid.nl/BWBR0017236/2026-01-01#Artikel15
  - number: '15.4'
    text: Herbenoeming tot senior-examinator vindt niet plaats als de betrokkene de leeftijd van 65 jaar heeft bereikt.
    url: https://wetten.overheid.nl/BWBR0017236/2026-01-01#Artikel15
  - number: '16.1'
    text: |-
      Om in aanmerking te kunnen komen voor een benoeming tot senior-examinator met betrekking tot een bepaalde
      autorisatie tot examinator:
    url: https://wetten.overheid.nl/BWBR0017236/2026-01-01#Artikel16
  - number: 16.1.a
    text: |-
      is de betrokkene binnen de vijf jaar voorafgaand aan de eventuele benoeming tenminste drie jaar werkzaam geweest
      als examinator binnen de desbetreffende autorisatie, en
    url: https://wetten.overheid.nl/BWBR0017236/2026-01-01#Artikel16
  - number: 16.1.b
    text: |-
      heeft de betrokkene minimaal 1000 uur instructie gegeven binnen de instructeurbevoegdverklaring, benodigd voor de
      afgifte van de desbetreffende autorisatie.
    url: https://wetten.overheid.nl/BWBR0017236/2026-01-01#Artikel16
  - number: '16.2'
    text: |-
      De in het eerste lid, onder b, en het tweede lid genoemde eisen zijn niet van toepassing op een benoeming tot
      senior-examinator voor de categorie vrije ballonnen.
    url: https://wetten.overheid.nl/BWBR0017236/2026-01-01#Artikel16
  - number: '17'
    text: 'De volgende regelingen worden ingetrokken:'
    url: https://wetten.overheid.nl/BWBR0017236/2026-01-01#Artikel17
  - number: 17.a
    text: Regeling examinatoren voor luchtvarenden 2001,
    url: https://wetten.overheid.nl/BWBR0017236/2026-01-01#Artikel17
  - number: 17.b
    text: |-
      [Regeling senior-examinatoren voor luchtvarenden][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012780
    url: https://wetten.overheid.nl/BWBR0017236/2026-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0012780
  - number: '18'
    text: |-
      Deze regeling treedt in werking met ingang van 1 oktober 2004. Indien de Staatscourant, waarin deze regeling wordt
      geplaatst, wordt uitgegeven na 29 september 2004, treedt zij in werking met ingang van de tweede dag na de datum
      van uitgifte van de Staatscourant waarin zij wordt geplaatst en werkt zij terug tot en met 1 oktober 2004.
    url: https://wetten.overheid.nl/BWBR0017236/2026-01-01#Artikel18
  - number: '19'
    text: 'Deze regeling wordt aangehaald als: Regeling examinatoren voor luchtvarenden 2004.'
    url: https://wetten.overheid.nl/BWBR0017236/2026-01-01#Artikel19
