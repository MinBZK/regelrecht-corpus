preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het noodzakelijk is de Elektriciteitswet 1998 en de Gaswet aan te passen
    aan de wijziging van de richtlijn 2019/692 van het Europees Parlement en de Raad van 17 april 2019 tot wijziging
    van Richtlijn 2009/73/EG betreffende gemeenschappelijke regels voor de interne markt voor aardgas (Pb EU 2019,
    L 117); de verordening 2019/942 van het Europees Parlement en de Raad van 5 juni 2019 tot oprichting van een
    Agentschap van de Europese Unie voor de samenwerking tussen energieregulators (herschikking) (Pb EU 2019, L 158);
    de verordening 2019/941 van het Europees Parlement en de Raad van 5 juni 2019 betreffende risicoparaatheid in de
    elektriciteitssector en tot intrekking van Richtlijn 2005/89/EG (Pb EU 2019, L 158); de verordening 2019/943 van
    het Europees Parlement en de Raad van 5 juni 2019 betreffende de interne markt voor elektriciteit en tot intrekking
    van Verordening 2009/714 (Pb EU 2019, L 158); en de verordening 2017/1938 van het Europees Parlement en de Raad van
    25 oktober 2017 betreffende maatregelen tot veiligstelling van de gasleveringszekerheid en houdende intrekking van
    Verordening nr. 994/2017 (Pb EU 2017, L 280);

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0043813/2020-07-10#ArtikelAanhef
articles:
  - number: III
    text: |-
      Op ontheffingen die zijn verleend op basis van [artikel 18h van de Gaswet][ref1] zoals dit luidde voor het
      tijdstip van inwerkingtreding van [artikel II, onder K][ref2], blijven de bepalingen van toepassing zoals
      die golden ingevolge de [Gaswet][ref3] zoals dat luidde op de dag voor het tijdstip van inwerkingtreding van
      artikel II, onder K.


