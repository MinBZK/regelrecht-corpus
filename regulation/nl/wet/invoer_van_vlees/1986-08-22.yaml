preamble:
  text: |-
    Gelet op artikel 6, tweede lid, onder g, van Koninklijk besluit van 16 juli 1965 (Stb. 345), houdende uitvoering
    van artikel 30a van de Vleeskeuringswet (Stb. 1958, 72) laatstelijk gewijzigd bij besluit van 9 juli 1975 (Stb.
    428) en artikel 4, onder b, van het Koninklijk besluit van 26 april 1922 (Stb. 225) tot uitvoering van de artikelen
    27, 28 en 29 van de Vleeskeuringswet, laatstelijk gewijzigd bij besluit van 28 april 1978 (Stb. 276):

    Besluit:
  url: https://wetten.overheid.nl/BWBR0003350/1986-08-22#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      De volgende stoffen, welke niet eigen aan vlees zijn, mogen niet in vlees aanwezig zijn:

      1e. stoffen met hormonale, dan wel anti-hormonale werking;

      2e. antibiotica;

      3e. chemotherapeutica.
    url: https://wetten.overheid.nl/BWBR0003350/1986-08-22#Artikel1
  - number: '2'
    text: |-
      De toegestane tolerantie van residuen van Caesium 134 en 137 tezamen wordt vastgesteld op maximaal 600 Becquerel
      per kg.
    url: https://wetten.overheid.nl/BWBR0003350/1986-08-22#Artikel2
  - number: '3'
    text: |-
      Dit besluit treedt in werking met ingang van de tweede dag na die van zijn bekendmaking in de Nederlandse
      Staatscourant.
    url: https://wetten.overheid.nl/BWBR0003350/1986-08-22#Artikel3
