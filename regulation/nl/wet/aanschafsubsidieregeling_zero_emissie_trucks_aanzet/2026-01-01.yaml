        hoofdstuk: '2'
  - number: 1.5.1.c.ii
    text: |-
      € 22.228.000 voor aanvragen gedaan in de periode bedoeld in [artikel 2.2, tweede lid, onderdeel c, onder ii][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0046589#Artikel2
