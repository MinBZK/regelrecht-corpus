      [artikel 2.2, tweede lid, onderdeel e, onder i][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0046589#Artikel2
    url: https://wetten.overheid.nl/BWBR0046589/2026-01-01#Artikel1.5
    references:
      - id: ref1
