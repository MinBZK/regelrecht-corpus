    url: https://wetten.overheid.nl/BWBR0046589/2026-01-01#Artikel1.5
  - number: 1.5.1.d.i
    text: |-
      € 35.300.000 voor aanvragen gedaan in de periode bedoeld in
      [artikel 2.2, tweede lid, onderdeel d, onder i][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0046589#Artikel2
    url: https://wetten.overheid.nl/BWBR0046589/2026-01-01#Artikel1.5
    references:
