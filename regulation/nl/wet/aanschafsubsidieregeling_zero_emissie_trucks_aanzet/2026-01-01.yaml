  - number: '1.2'
    text: |-
      Deze regeling heeft tot doel het stimuleren van de aanschaf van nieuwe emissieloze vrachtauto’s door ondernemingen
      en non-profitinstellingen, teneinde de emissie van CO en luchtverontreinigende stoffen te verminderen.
    url: https://wetten.overheid.nl/BWBR0046589/2026-01-01#Artikel1.2
  - number: '1.3'
    text: |-
      De Minister kan, overeenkomstig het bepaalde bij deze regeling, aan een aanvrager subsidie verstrekken voor de
      aanschaf van een nieuwe emissieloze vrachtauto.
    url: https://wetten.overheid.nl/BWBR0046589/2026-01-01#Artikel1.3
  - number: 1.4.1
    text: 'De subsidie bedraagt:'
    url: https://wetten.overheid.nl/BWBR0046589/2026-01-01#Artikel1.4
  - number: 1.4.1.a
    text: |-
      voor een nieuwe emissieloze vrachtauto die valt onder de voertuigclassificatie N2 bakwagenchassis met een gewicht
      van minstens 10.000 kilogram:
    url: https://wetten.overheid.nl/BWBR0046589/2026-01-01#Artikel1.4
  - number: 1.4.1.a.1°
    text: 'bij grote ondernemingen: 6,1% van de verkoopprijs tot een maximum van € 15.200;'
    url: https://wetten.overheid.nl/BWBR0046589/2026-01-01#Artikel1.4
  - number: 1.4.1.a.2°
    text: 'bij middelgrote ondernemingen: 12% van de verkoopprijs tot een maximum van € 29.900;'
    url: https://wetten.overheid.nl/BWBR0046589/2026-01-01#Artikel1.4
  - number: 1.4.1.a.3°
    text: 'bij kleine ondernemingen en non-profitinstellingen: 14,8% van de verkoopprijs tot een maximum van € 36.900;'
    url: https://wetten.overheid.nl/BWBR0046589/2026-01-01#Artikel1.4
  - number: 1.4.1.b
    text: 'voor een nieuwe emissieloze vrachtauto die valt onder de voertuigclassificatie N3 bakwagenchassis:'
    url: https://wetten.overheid.nl/BWBR0046589/2026-01-01#Artikel1.4
  - number: 1.4.1.b.1°
    text: 'bij grote ondernemingen: 11,1% van de verkoopprijs tot een maximum van € 43.900;'
    url: https://wetten.overheid.nl/BWBR0046589/2026-01-01#Artikel1.4
  - number: 1.4.1.b.2°
    text: 'bij middelgrote ondernemingen: 21% van de verkoopprijs tot een maximum van € 83.200;'
    url: https://wetten.overheid.nl/BWBR0046589/2026-01-01#Artikel1.4
  - number: 1.4.1.b.3°
    text: 'bij kleine ondernemingen en non-profitinstellingen: 29% van de verkoopprijs tot een maximum van € 115.200;'
    url: https://wetten.overheid.nl/BWBR0046589/2026-01-01#Artikel1.4
  - number: 1.4.1.c
    text: 'voor een nieuwe emissieloze vrachtauto die valt onder de voertuigclassificatie N3 opleggertrekker:'
    url: https://wetten.overheid.nl/BWBR0046589/2026-01-01#Artikel1.4
  - number: 1.4.1.c.1°
    text: 'bij grote ondernemingen: 11,1% van de verkoopprijs tot een maximum van € 43.900;'
    url: https://wetten.overheid.nl/BWBR0046589/2026-01-01#Artikel1.4
  - number: 1.4.1.c.2°
    text: 'bij middelgrote ondernemingen: 21% van de verkoopprijs tot een maximum van € 83.200;'
    url: https://wetten.overheid.nl/BWBR0046589/2026-01-01#Artikel1.4
  - number: 1.4.1.c.3°
    text: 'bij kleine ondernemingen en non-profitinstellingen: 29% van de verkoopprijs tot een maximum van € 115.200.'
    url: https://wetten.overheid.nl/BWBR0046589/2026-01-01#Artikel1.4
  - number: 1.4.2
    text: |-
      Wanneer het subsidiebedrag, bedoeld in het eerste lid, de maximale steunruimte van de algemene
      groepsvrijstellingsverordening overschrijdt, wordt de overschrijding in mindering gebracht op het subsidiebedrag.
    url: https://wetten.overheid.nl/BWBR0046589/2026-01-01#Artikel1.4
  - number: 1.4.3
    text: |-
      Indien reeds door een bestuursorgaan of de Commissie van de Europese Unie subsidie is verstrekt voor de aanschaf
      van een nieuwe emissieloze vrachtauto wordt het bedrag dat door een bestuursorgaan of de Commissie van de Europese
      Unie is verstrekt in mindering gebracht op de subsidie waarvoor de aanvrager krachtens deze regeling in aanmerking
      komt.
    url: https://wetten.overheid.nl/BWBR0046589/2026-01-01#Artikel1.4
  - number: 1.5.1
    text: 'Het subsidieplafond is:'
    url: https://wetten.overheid.nl/BWBR0046589/2026-01-01#Artikel1.5
  - number: 1.5.1.a
    text: voor het jaar 2022 € 25.000.000;
    url: https://wetten.overheid.nl/BWBR0046589/2026-01-01#Artikel1.5
  - number: 1.5.1.b
    text: voor het jaar 2023 € 57.400.000;
    url: https://wetten.overheid.nl/BWBR0046589/2026-01-01#Artikel1.5
  - number: 1.5.1.c
    text: 'voor het jaar 2024:'
    url: https://wetten.overheid.nl/BWBR0046589/2026-01-01#Artikel1.5
  - number: 1.5.1.c.i
    text: |-
      € 45.000.000 voor aanvragen gedaan in de periode bedoeld in [artikel 2.2, tweede lid, onderdeel c, onder i][ref1],


