  text: |-
    Gelet op de artikelen 3, eerste lid, aanhef en onder b en f, 4, eerste en tweede lid, en 5 van de Kaderwet
    subsidies I en M;

    BESLUIT:
  url: https://wetten.overheid.nl/BWBR0046589/2026-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In deze regeling wordt verstaan onder: - *aanschaf:* verkrijging van de eigendom, bedoeld in
      [artikel 3:84, eerste lid, van het Burgerlijk Wetboek][ref1] krachtens koop of financial leasing, als bedoeld in
      [paragraaf 3.2 van het Besluit Omzetbelasting. Leasing](onbekend) van 25 januari 2007, nr. CPP2006/2847M, Stcrt
      2007, nr. 24;
        - *aanvrager:* onderneming of non-profitinstelling, niet zijnde een publiekrechtelijk zelfstandig bestuursorgaan
      met rechtspersoonlijkheid, een provincie, gemeente, waterschap of openbaar lichaam als bedoeld in de
      [Wet gemeenschappelijke regelingen][ref2], die is ingeschreven bij de Kamer van Koophandel, met een vestiging in
      Nederland en die een subsidie aanvraagt op grond van deze regeling;
        - *algemene groepsvrijstellingsverordening:* Verordening (EU) nr. 651/2014 van de Commissie van 17 juni 2014
      waarbij bepaalde categorieën steun op grond van de artikelen 107 en 108 van het Verdrag met de interne markt
      verenigbaar worden verklaard (PbEU 2014, L 187);
        - *bakwagenchassis:* motorvoertuig als bedoeld in voertuigcategorie N2 of N3 volgens [verordening (EU) 2018/858]
      (32758R2018) waarop een laadmogelijkheid gecreëerd kan worden; in ieder geval wordt als bakwagenchassis aangemerkt
      een voertuig met carrosserietype BX of BA volgens [verordening (EU) 2018/858](32758R2018);
        - *eerste inschrijving en tenaamstelling:* eerste inschrijving en tenaamstelling als bedoeld in
      [artikel 25 van het Kentekenreglement][ref3];
        - *emissieloze vrachtauto:* emissievrij vervoermiddel als bedoeld in artikel 2, punt 102 octies, onderdeel c,
      van de algemene groepsvrijstellingsverordening, dat als motorvoertuig kwalificeert en dat valt onder de
      voertuigcategorie N2 of N3 volgens [verordening (EU) 2018/858](32018R0858);
        - *gewicht:* technisch toegestane maximummassa als bedoeld in [artikel 1.1 van de Regeling voertuigen][ref4];
        - *groep:* groep als bedoeld in [artikel 2:24b van het Burgerlijk Wetboek][ref5];
        - *grote onderneming:* onderneming die niet aan de in bijlage I van de algemene groepsvrijstellingsverordening
      vastgestelde criteria voldoet;
        - *kentekenregister:* kentekenregister als bedoeld in [artikel 42 van de Wegenverkeerswet 1994][ref6];
        - *kleine onderneming:* onderneming als bedoeld in artikel 2, onder 2, van de algemene
      groepsvrijstellingsverordening en die aan de in bijlage I van de algemene groepsvrijstellingsverordening
      vastgestelde criteria voldoet;
        - *middelgrote onderneming:* onderneming als bedoeld in artikel 2, onder 2, van de algemene
      groepsvrijstellingsverordening en die aan de in bijlage I van de algemene groepsvrijstellingsverordening
      vastgestelde criteria voldoet;
        - *Minister:* Minister van Infrastructuur en Waterstaat;
        - *nieuwe emissieloze vrachtauto:* emissieloze vrachtauto waarvan, blijkens vermelding in het kentekenregister, de
      datum eerste toelating, de datum eerste inschrijving in Nederland en de datum tenaamstelling, gelijk zijn;
        - *non-profitinstelling:* rechtspersoonlijkheid bezittende entiteit zonder winstoogmerk, die tot doel heeft de
      ondersteuning van private of publieke aangelegenheden van niet-commerciële aard;
        - *onderneming:* iedere entiteit, ongeacht haar rechtsvorm die een economische activiteit uitoefent;
        - *overeenkomst:* schriftelijke overeenkomst tot koop als bedoeld in [artikel 7:1 van het Burgerlijk Wetboek][ref7]
      of een schriftelijke overeenkomst tot financial leasing, bedoeld in [paragraaf 3.2 van het Besluit Omzetbelasting.
      Leasing](onbekend) van 25 januari 2007, nr. CPP2006/2847M, Stcrt. 2007, nr. 24;
        - *RVO:* Rijksdienst voor Ondernemend Nederland;
        - *opleggertrekker:* motorvoertuig als bedoeld in voertuigcategorie N2 of N3 volgens [verordening (EU) 2018/858]
      (32758R2018) dat hoofdzakelijk is ontworpen en gebouwd voor het trekken van opleggers; in ieder geval wordt als
      opleggertrekker aangemerkt een voertuig met carrosserietype BC volgens [verordening (EU) 2018/858](32758R2018);
        - *verkoopprijs:* prijs van de emissieloze vrachtauto inclusief af-fabriekopties, exclusief de opbouw die
      bovenop het bakwagenchassis wordt gebouwd, en zoals vermeld op de overeenkomst verminderd met de daarin begrepen
      omzetbelasting;
        - *verordening (EU) 2018/858:* [Verordening (EU) 2018/858](32758R2018) van het Europees Parlement en de Raad
      van 30 mei 2018 betreffende de goedkeuring van en het markttoezicht op motorvoertuigen en aanhangwagens daarvan
      en systemen, onderdelen en technische eenheden die voor dergelijke voertuigen zijn bestemd, tot wijziging van
      Verordeningen (EG) nr. 715/2007 en (EG) nr. 595/2009 en tot intrekking van [Richtlijn 2007/46/EG](32007L0046) (PbEU
      2018, L151);
        - *verstrekkingsvoorbehoud:* registratie als bedoeld in [artikel 25 van het Kentekenreglement][ref8] van de
      rechtspersoon of natuurlijk persoon die over de tenaamstellingscode van een voertuig in het kentekenregister kan
      beschikken;
        - *voertuigclassificatie N2 en N3:* voertuigclassificaties N2 en N3 als bedoeld in [verordening (EU) 2018/858]
      (32758R2018).


