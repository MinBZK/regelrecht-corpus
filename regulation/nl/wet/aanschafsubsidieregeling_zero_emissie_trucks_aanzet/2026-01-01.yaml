  - number: 1.5.2
    text: |-
      De Minister stelt het subsidieplafond vast voor de jaren na 2024 en geeft hiervan kennis in de Staatscourant voor
      aanvang van het kalenderjaar waarvoor het betreffende subsidieplafond wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0046589/2026-01-01#Artikel1.5
  - number: 1.6.1
    text: |-
      De Minister verdeelt de in de betreffende subsidieperiode beschikbare gelden op volgorde van binnenkomst van de
      aanvragen.
    url: https://wetten.overheid.nl/BWBR0046589/2026-01-01#Artikel1.6
  - number: 1.6.2
    text: |-
      Indien een aanvrager niet heeft voldaan aan enig wettelijk voorschrift voor het in behandeling nemen van de
      aanvraag en met toepassing van [artikel 4:5 van de Algemene wet bestuursrecht][ref1] de gelegenheid heeft gehad
      de aanvraag aan te vullen, geldt de dag waarop de aanvraag voldoet aan deze wettelijke voorschriften als datum
      van ontvangst.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0046589/2026-01-01#Artikel1.6
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 1.6.3
    text: |-
      Indien de Minister op de dag waarop het subsidieplafond is bereikt meer dan één volledige aanvraag om
      subsidieverlening heeft ontvangen, stelt hij de onderlinge rangschikking van die aanvragen vast door middel van
      loting.
    url: https://wetten.overheid.nl/BWBR0046589/2026-01-01#Artikel1.6
  - number: '2.1'
    text: 'Voor de subsidieverlening moet zijn voldaan aan de volgende voorwaarden:'
    url: https://wetten.overheid.nl/BWBR0046589/2026-01-01#Artikel2.1
  - number: 2.1.a
    text: het gewicht van de nieuwe emissieloze vrachtauto bedraagt minstens 10.000 kilogram;
    url: https://wetten.overheid.nl/BWBR0046589/2026-01-01#Artikel2.1
  - number: 2.1.b
    text: |-
      de aanschaf van de nieuwe emissieloze vrachtauto door de aanvrager vindt plaats op basis van een overeenkomst die
      ten tijde van de aanvraag om subsidieverlening geen onherroepelijke verplichtingen mag bevatten;
    url: https://wetten.overheid.nl/BWBR0046589/2026-01-01#Artikel2.1
  - number: 2.1.c
    text: ten tijde van de aanvraag om subsidieverlening is de nieuwe emissieloze vrachtauto nog niet tenaamgesteld; en
    url: https://wetten.overheid.nl/BWBR0046589/2026-01-01#Artikel2.1
  - number: 2.1.d
    text: |-
      indien de energie voor de aandrijving van de nieuwe emissieloze vrachtauto wordt geleverd door een accupakket mag
      dit geen lood bevatten.
    url: https://wetten.overheid.nl/BWBR0046589/2026-01-01#Artikel2.1
  - number: 2.2.1
    text: |-
      Een aanvrager kan bij de Minister een aanvraag om subsidie indienen door middel van een daartoe vastgesteld
      formulier dat beschikbaar is via de website van RVO.
    url: https://wetten.overheid.nl/BWBR0046589/2026-01-01#Artikel2.2
  - number: 2.2.2
    text: 'Een aanvraag tot subsidieverlening op grond van deze regeling kan worden ingediend:'
    url: https://wetten.overheid.nl/BWBR0046589/2026-01-01#Artikel2.2
  - number: 2.2.2.a
    text: in 2022 van 9 mei 2022, 9.00 uur tot en met 31 december 2022, 12.00 uur;
    url: https://wetten.overheid.nl/BWBR0046589/2026-01-01#Artikel2.2
  - number: 2.2.2.b
    text: in 2023 van 4 april 2023, 9.00 uur tot en met 29 december 2023, 12.00 uur;
    url: https://wetten.overheid.nl/BWBR0046589/2026-01-01#Artikel2.2
  - number: 2.2.2.c
    text: 'in 2024:'
    url: https://wetten.overheid.nl/BWBR0046589/2026-01-01#Artikel2.2
  - number: 2.2.2.c.i
    text: van 26 maart 2024, 9.00 uur tot en met 24 mei 2024, 12.00 uur;
    url: https://wetten.overheid.nl/BWBR0046589/2026-01-01#Artikel2.2
  - number: 2.2.2.c.ii
    text: van 1 oktober 2024, 9.00 uur tot en met 8 oktober 2024, 12.00 uur;
    url: https://wetten.overheid.nl/BWBR0046589/2026-01-01#Artikel2.2
  - number: 2.2.2.d
    text: 'in 2025:'
    url: https://wetten.overheid.nl/BWBR0046589/2026-01-01#Artikel2.2
  - number: 2.2.2.d.i
    text: van 28 januari 2025, 9.00 uur tot en met 7 februari 2025, 12.00 uur;
    url: https://wetten.overheid.nl/BWBR0046589/2026-01-01#Artikel2.2
  - number: 2.2.2.d.ii
    text: van 30 september 2025, 9.00 uur tot en met 10 oktober 2025, 12.00 uur;
    url: https://wetten.overheid.nl/BWBR0046589/2026-01-01#Artikel2.2
  - number: 2.2.2.e
    text: 'in 2026:'
    url: https://wetten.overheid.nl/BWBR0046589/2026-01-01#Artikel2.2
  - number: 2.2.2.e.i
    text: van 27 januari 2026, 9.00 uur tot en met 13 februari 2026, 12.00 uur;
    url: https://wetten.overheid.nl/BWBR0046589/2026-01-01#Artikel2.2
  - number: 2.2.2.e.ii
    text: van 29 september 2026, 9.00 uur tot en met 16 oktober 2026, 12.00 uur.
    url: https://wetten.overheid.nl/BWBR0046589/2026-01-01#Artikel2.2
  - number: 2.2.3
    text: Als tijdstip van indiening van een aanvraag geldt de datum van ontvangst van de volledige aanvraag.
    url: https://wetten.overheid.nl/BWBR0046589/2026-01-01#Artikel2.2
  - number: 2.2.4
    text: 'Een aanvrager kan:'
    url: https://wetten.overheid.nl/BWBR0046589/2026-01-01#Artikel2.2
  - number: 2.2.4.a
    text: |-
      zowel op de eerste werkdag als op de tweede werkdag van de aanvraagperiode één aanvraag indienen voor de aanschaf
      van ten hoogste twee emissieloze vrachtauto’s;
    url: https://wetten.overheid.nl/BWBR0046589/2026-01-01#Artikel2.2
  - number: 2.2.4.b
    text: |-
      vanaf de derde werkdag van de aanvraagperiode één aanvraag per werkdag indienen voor de aanschaf van ten hoogste
      tien emissieloze vrachtauto’s.
    url: https://wetten.overheid.nl/BWBR0046589/2026-01-01#Artikel2.2
  - number: 2.2.5
    text: |-
      Indien een aanvrager op een werkdag meerdere aanvragen indient, of indien meerdere aanvragers die tot eenzelfde
      groep behoren op een werkdag een aanvraag indienen, neemt de Minister uitsluitend de eerst ingediende aanvraag
      in behandeling.
    url: https://wetten.overheid.nl/BWBR0046589/2026-01-01#Artikel2.2
  - number: 2.2.6
    text: |-
      Na bekendmaking van het bereiken van het subsidieplafond als bedoeld in [artikel 1.5, derde lid][ref1], kan in
      afwijking van het tweede lid, geen aanvraag meer worden ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0046589#Artikel1
    url: https://wetten.overheid.nl/BWBR0046589/2026-01-01#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0046589
        artikel: '1'
        hoofdstuk: '1'
  - number: 2.3.1
    text: |-
      Een aanvrager kan bij de Minister een aanvraag tot verlening van de subsidie indienen door middel van een daartoe
      vastgesteld formulier dat beschikbaar is via de website van RVO.
    url: https://wetten.overheid.nl/BWBR0046589/2026-01-01#Artikel2.3
  - number: 2.3.2
    text: 'Bij de aanvraag tot verlening van de subsidie worden in elk geval de volgende gegevens en bescheiden verstrekt:'
    url: https://wetten.overheid.nl/BWBR0046589/2026-01-01#Artikel2.3
  - number: 2.3.2.a
    text: naam en adres van de aanvrager;
    url: https://wetten.overheid.nl/BWBR0046589/2026-01-01#Artikel2.3
  - number: 2.3.2.b
    text: contactpersoon met contactgegevens van de aanvrager;
    url: https://wetten.overheid.nl/BWBR0046589/2026-01-01#Artikel2.3
  - number: 2.3.2.c
    text: inschrijfnummer van de aanvrager bij de Kamer van Koophandel;
    url: https://wetten.overheid.nl/BWBR0046589/2026-01-01#Artikel2.3
  - number: 2.3.2.d
    text: BSN-nummer van de aanvrager wanneer een onderneming door een natuurlijk persoon wordt gedreven;
    url: https://wetten.overheid.nl/BWBR0046589/2026-01-01#Artikel2.3
  - number: 2.3.2.e
    text: merk, type en handelsbenaming van de nieuwe emissieloze vrachtauto waarvoor subsidie wordt aangevraagd;
    url: https://wetten.overheid.nl/BWBR0046589/2026-01-01#Artikel2.3
  - number: 2.3.2.f
    text: de hoogte van de verkoopprijs;
    url: https://wetten.overheid.nl/BWBR0046589/2026-01-01#Artikel2.3
  - number: 2.3.2.g
    text: |-
      hoogte van het bedrag van eventuele reeds aangevraagde of ontvangen subsidies van een bestuursorgaan of de
      Commissie van de Europese Unie voor de aanschaf van een of meerdere nieuwe emissieloze vrachtauto’s; en
    url: https://wetten.overheid.nl/BWBR0046589/2026-01-01#Artikel2.3
  - number: 2.3.2.h
    text: kopie van de overeenkomst met betrekking tot de voorgenomen aanschaf van de nieuwe emissieloze vrachtauto.
    url: https://wetten.overheid.nl/BWBR0046589/2026-01-01#Artikel2.3
  - number: 2.3.3
    text: |-
      De Minister kan de aanvrager naar aanleiding van de aanvraag verzoeken documenten te overleggen met betrekking tot
      de aanschaf van de emissieloze vrachtauto.
    url: https://wetten.overheid.nl/BWBR0046589/2026-01-01#Artikel2.3
  - number: '2.4'
    text: 'De Minister beslist afwijzend op een aanvraag om subsidie:'
    url: https://wetten.overheid.nl/BWBR0046589/2026-01-01#Artikel2.4
  - number: 2.4.a
    text: indien de aanvraag niet voldoet aan het bepaalde in deze regeling;
    url: https://wetten.overheid.nl/BWBR0046589/2026-01-01#Artikel2.4
  - number: 2.4.b
    text: |-
      indien voor het voertuig reeds subsidie is verleend op basis van de
      [Subsidieregeling schoon en emissieloos bouwmaterieel][ref1] of de
      [Tijdelijke subsidieregeling zero-emissie mobiliteit][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0046464
      [ref2]: https://wetten.overheid.nl/BWBR0049842
    url: https://wetten.overheid.nl/BWBR0046589/2026-01-01#Artikel2.4
    references:
      - id: ref1
        bwb_id: BWBR0046464
      - id: ref2
        bwb_id: BWBR0049842
  - number: 2.4.c
    text: |-
      als het een aanvrager betreft tegen wie een bevel tot terugvordering uitstaat als bedoeld in artikel 1, zesde lid,
      onderdeel a, van de algemene groepsvrijstellingsverordening;
    url: https://wetten.overheid.nl/BWBR0046589/2026-01-01#Artikel2.4
  - number: 2.4.d
    text: |-
      voor zover er sprake is van ongeoorloofde cumulatie van steun als bedoeld in artikel 8 van de algemene
      groepsvrijstellingsverordening;
    url: https://wetten.overheid.nl/BWBR0046589/2026-01-01#Artikel2.4
  - number: 2.4.e
    text: |-
      indien er sprake is van een onderneming in moeilijkheden als bedoeld in artikel 2, achttiende lid, van de algemene
      groepsvrijstellingsverordening; of
    url: https://wetten.overheid.nl/BWBR0046589/2026-01-01#Artikel2.4
  - number: 2.4.f
    text: |-
      indien de subsidieverstrekking niet in overeenstemming is met enige andere bepaling van de algemene
      groepsvrijstellingsverordening.
    url: https://wetten.overheid.nl/BWBR0046589/2026-01-01#Artikel2.4
  - number: 2.5.1
    text: |-
      Een aanvrager kan bij de Minister een aanvraag tot vaststelling van de subsidie indienen door middel van een
      daartoe vastgesteld formulier dat beschikbaar is via de website van RVO.
    url: https://wetten.overheid.nl/BWBR0046589/2026-01-01#Artikel2.5
  - number: 2.5.2
    text: |-
      De aanvraag tot subsidievaststelling kan worden ingediend tot uiterlijk 12 maanden na de datum van verlening van
      de subsidie.
    url: https://wetten.overheid.nl/BWBR0046589/2026-01-01#Artikel2.5
  - number: 2.5.3
    text: |-
      De subsidieontvanger kan bij de minister een verzoek doen tot uitstel van maximaal 12 maanden van de indiening van
      de aanvraag, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0046589/2026-01-01#Artikel2.5
  - number: 2.5.4
    text: |-
      De minister kan uitstel als bedoeld in het derde lid verlenen indien de subsidieontvanger op basis van een
      verklaring van een opbouwbedrijf kan aantonen dat de levertijd voor het bouwen en monteren van de opbouw op het
      bakwagenchassis van de nieuwe emissieloze vrachtauto langer is dan de periode, genoemd in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0046589/2026-01-01#Artikel2.5
  - number: '2.6'
    text: 'Bij de aanvraag tot vaststelling van de subsidie worden in elk geval de volgende gegevens verstrekt:'
    url: https://wetten.overheid.nl/BWBR0046589/2026-01-01#Artikel2.6
  - number: 2.6.a
    text: het kenteken van de nieuwe emissieloze vrachtauto dat is vermeld in de overeenkomst; en
    url: https://wetten.overheid.nl/BWBR0046589/2026-01-01#Artikel2.6
  - number: 2.6.b
    text: de gespecificeerde factuur tot betaling.
    url: https://wetten.overheid.nl/BWBR0046589/2026-01-01#Artikel2.6
  - number: 2.7.1
    text: De beschikking op een aanvraag wordt gegeven binnen 13 weken na de datum van ontvangst van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0046589/2026-01-01#Artikel2.7
  - number: 2.7.2
    text: |-
      Indien de beschikking niet binnen 13 weken kan worden gegeven, kan deze termijn eenmaal met diezelfde termijn
      worden verlengd.
    url: https://wetten.overheid.nl/BWBR0046589/2026-01-01#Artikel2.7
  - number: '2.8'
    text: |-
      Gelijktijdig met de beschikking tot subsidieverlening wordt 70% van het subsidiebedrag als voorschot verstrekt. De
      betaling daarvan vindt plaats op een bankrekening die op naam staat van de aanvrager.
    url: https://wetten.overheid.nl/BWBR0046589/2026-01-01#Artikel2.8
  - number: '2.9'
    text: |-
      Na vaststelling van de subsidie vindt de betaling van het resterende subsidiebedrag plaats op een bankrekening die
      op naam staat van de aanvrager.
    url: https://wetten.overheid.nl/BWBR0046589/2026-01-01#Artikel2.9
  - number: 2.10.1
    text: |-
      Indien niet is voldaan aan het bepaalde in [artikel 3.2, eerste lid, onder b][ref1], kan de Minister, onverminderd
      het bepaalde in de [artikelen 4:49][ref2] en [4:57 van de Algemene wet bestuursrecht][ref3], besluiten de
      vaststelling van de subsidie te wijzigen en het onverschuldigd betaalde deel van de subsidie terug te vorderen.


      [ref1]: https://wetten.overheid.nl/BWBR0046589#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0046589/2026-01-01#Artikel2.10
    references:
      - id: ref1
        bwb_id: BWBR0046589
        artikel: '3'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 2.10.2
    text: |-
      Het terug te vorderen bedrag wordt bepaald door de subsidie te verminderen met 1/48e van het verstrekte
      subsidiebedrag vermenigvuldigd met het aantal volledige maanden waarin niet is voldaan aan de verplichting, bedoeld
      in [artikel 3.2, eerste lid, onder b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0046589#Artikel3
    url: https://wetten.overheid.nl/BWBR0046589/2026-01-01#Artikel2.10
    references:
      - id: ref1
        bwb_id: BWBR0046589
        artikel: '3'
        hoofdstuk: '3'
  - number: 3.1.1
    text: 'De subsidieontvanger is verplicht:'
    url: https://wetten.overheid.nl/BWBR0046589/2026-01-01#Artikel3.1
  - number: 3.1.1.a
    text: |-
      onverwijld schriftelijk mededeling aan de Minister te doen van de indiening bij de rechtbank van een verzoek
      tot het op hem van toepassing verklaren van de schuldsaneringsregeling natuurlijke personen, tot verlening van
      surseance van betaling aan hem of tot faillietverklaring van hem;
    url: https://wetten.overheid.nl/BWBR0046589/2026-01-01#Artikel3.1
  - number: 3.1.1.b
    text: |-
      onverwijld schriftelijk mededeling aan de Minister te doen van gewijzigde omstandigheden of wijziging van zijn
      gegevens die van belang zijn in verband met de subsidieverstrekking op grond van deze regeling;
    url: https://wetten.overheid.nl/BWBR0046589/2026-01-01#Artikel3.1
  - number: 3.1.1.c
    text: |-
      om op verzoek van de Minister alle gevraagde medewerking te verlenen aan de controle op de uitvoering van de
      verplichtingen die zijn gesteld in deze regeling en de beschikkingen;
    url: https://wetten.overheid.nl/BWBR0046589/2026-01-01#Artikel3.1
  - number: 3.1.1.d
    text: |-
      om op verzoek van de Minister alle gevraagde medewerking te verlenen aan een door de Minister ter zake van de
      toepassing en de effecten van deze regeling ingesteld evaluatieonderzoek, die de Minister redelijkerwijs nodig
      heeft voor de uitvoering van dat evaluatieonderzoek.
    url: https://wetten.overheid.nl/BWBR0046589/2026-01-01#Artikel3.1
  - number: 3.1.2
    text: |-
      Zodra het redelijkerwijs aannemelijk is dat niet, niet tijdig of niet geheel aan de aan de subsidie verbonden
      verplichtingen wordt of zal worden voldaan, doet de subsidieontvanger hiervan onverwijld mededeling aan de
      Minister.
    url: https://wetten.overheid.nl/BWBR0046589/2026-01-01#Artikel3.1
  - number: 3.1.3
    text: De Minister kan in de beschikking tot subsidieverlening nadere verplichtingen opleggen.
    url: https://wetten.overheid.nl/BWBR0046589/2026-01-01#Artikel3.1
  - number: 3.2.1
    text: 'De subsidieontvanger is verplicht:'
    url: https://wetten.overheid.nl/BWBR0046589/2026-01-01#Artikel3.2
  - number: 3.2.1.a
    text: |-
      de nieuwe emissieloze vrachtauto of vrachtauto’s waarvoor subsidie is verleend op zijn naam te stellen of een
      verstrekkingsvoorbehoud op zijn naam te registreren in het kentekenregister; en
    url: https://wetten.overheid.nl/BWBR0046589/2026-01-01#Artikel3.2
  - number: 3.2.1.b
    text: |-
      er zorg voor te dragen dat de nieuwe emissieloze vrachtauto gedurende vier jaar vanaf de datum van de eerste
      inschrijving en tenaamstelling of registratie van het verstrekkingsvoorbehoud, ononderbroken op zijn naam is
      gesteld of een verstrekkingsvoorbehoud op zijn naam is geregistreerd in het kentekenregister.
    url: https://wetten.overheid.nl/BWBR0046589/2026-01-01#Artikel3.2
  - number: 3.2.2
    text: |-
      De verplichting, bedoeld in het eerste lid, onder b, geldt niet indien de subsidieontvanger de nieuwe emissieloze
      vrachtauto vervangt door een andere nieuwe emissieloze vrachtauto die ook in aanmerking zou zijn gekomen voor
      subsidie op grond van deze regeling en deze andere vrachtauto gedurende de nog resterende termijn van de periode,
      genoemd in het eerste lid, onder b, op zijn naam is gesteld of middels een verstrekkingsvoorbehoud op zijn naam is
      geregistreerd. In dit geval wordt de vaststellingsbeschikking op verzoek van de subsidieontvanger, na verstrekking
      van het kenteken, overeenkomst en factuur van deze andere vrachtauto, dienovereenkomstig gewijzigd.
    url: https://wetten.overheid.nl/BWBR0046589/2026-01-01#Artikel3.2
  - number: 3.2.3
    text: |-
      De uitzondering van het tweede lid geldt niet wanneer de subsidieontvanger voor de vervangende nieuwe emissieloze
      vrachtauto subsidie aanvraagt.
    url: https://wetten.overheid.nl/BWBR0046589/2026-01-01#Artikel3.2
  - number: 3.2.4
    text: |-
      Indien de nieuwe emissieloze vrachtauto wordt vervangen door een andere nieuwe emissieloze vrachtauto als bedoeld
      in het tweede lid, is de subsidieontvanger verplicht om gedurende de in dat lid bedoelde resterende termijn te
      beschikken over de overeenkomst tot aanschaf van de vervangende nieuwe emissieloze vrachtauto.
    url: https://wetten.overheid.nl/BWBR0046589/2026-01-01#Artikel3.2
  - number: 4.1.1
    text: |-
      De Minister houdt ter voorkoming van misbruik en oneigenlijk gebruik van subsidie een registratie bij waarin wordt
      vastgelegd:
    url: https://wetten.overheid.nl/BWBR0046589/2026-01-01#Artikel4.1
  - number: 4.1.1.a
    text: |-
      het opleggen van een boete aan een subsidieontvanger op grond van de
      [Wet bestuurlijke boete meldingsplichten door Minister verstrekte subsidies][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0032155
    url: https://wetten.overheid.nl/BWBR0046589/2026-01-01#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0032155
  - number: 4.1.1.b
    text: |-
      het lager vaststellen van de subsidie op grond van
      [artikel 4:46, tweede lid, van de Algemene wet bestuursrecht][ref1], het intrekken
      of ten nadele van de subsidieontvanger wijzigen van de subsidieverlening op grond van
      [artikel 4:48 van de Algemene wet bestuursrecht][ref2] en het intrekken of ten nadele van de subsidieontvanger
      wijzigen van de subsidievaststelling op grond van [artikel 4:49 van de Algemene wet bestuursrecht][ref3], indien de
      subsidieontvanger een verwijt kan worden gemaakt van de lagere vaststelling, intrekking of wijziging als hiervoor
      bedoeld;


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0046589/2026-01-01#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 4.1.1.c
    text: |-
      de aard van de gedragingen die tot maatregelen als bedoeld in onderdelen a en b hebben geleid en, in geval van
      maatregelen als bedoeld in onderdeel b, het subsidiebedrag dat daarmee is gemoeid;
    url: https://wetten.overheid.nl/BWBR0046589/2026-01-01#Artikel4.1
  - number: 4.1.1.d
    text: |-
      de naam- en adresgegevens van de subsidieontvanger jegens wie de maatregelen als bedoeld in de onderdelen a en b,
      worden getroffen.
    url: https://wetten.overheid.nl/BWBR0046589/2026-01-01#Artikel4.1
  - number: 4.1.2
    text: |-
      De registratie kan worden geraadpleegd door daartoe door de Minister aangewezen ambtenaren die zich bezighouden met
      het verstrekken van subsidies door de Minister.
    url: https://wetten.overheid.nl/BWBR0046589/2026-01-01#Artikel4.1
  - number: 4.1.3
    text: |-
      De registratie van gegevens vindt plaats voor de duur van drie jaar na de datum van registratie, waarna de
      betreffende gegevens uit de registratie worden verwijderd.
    url: https://wetten.overheid.nl/BWBR0046589/2026-01-01#Artikel4.1
  - number: 4.1.4
    text: |-
      Indien blijkt dat een aanvrager in de in het eerste lid bedoelde registratie is opgenomen kan de Minister aan
      de geregistreerde gegevens gevolgtrekkingen verbinden bij de beoordeling van de aanvraag, de in het kader van de
      subsidieverstrekking op te leggen verplichtingen en de controle op de naleving van die verplichtingen.
    url: https://wetten.overheid.nl/BWBR0046589/2026-01-01#Artikel4.1
  - number: '4.2'
    text: |-
      Deze regeling treedt in werking met ingang van 9 mei 2022 en vervalt met ingang van 8 mei 2027, met dien verstande
      dat zij van toepassing blijft op subsidies die voor de laatstgenoemde datum zijn aangevraagd.
    url: https://wetten.overheid.nl/BWBR0046589/2026-01-01#Artikel4.2
  - number: '4.3'
    text: 'Deze regeling wordt aangehaald als: Aanschafsubsidieregeling zero-emissie trucks AanZET.'
    url: https://wetten.overheid.nl/BWBR0046589/2026-01-01#Artikel4.3
