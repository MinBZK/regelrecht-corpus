  - number: '2.25'
    text: |-
      1 Indien er twijfel is over de lichamelijke en geestelijke geschiktheid van de schipper, die houder is van een
      als gelijkwaardig erkend vaarbevoegdheidsbewijs, kan de bevoegde autoriteit of de bevoegde rechtbank een tijdelijk
      vaarverbod op de Rijn opleggen, tot een nieuwe medische verklaring als bedoeld in [bijlage B2][ref1] of een door de
      CCR als gelijkwaardig erkend bewijs wordt overgelegd; de bevoegde autoriteit informeert de CCR en de autoriteit die
      het vaarbevoegdheidsbewijs heeft afgegeven over dit besluit. Wordt de twijfel op vertoon van de medische verklaring
      weggenomen, dan moet het opgelegde vaarverbod worden opgeheven.

      De kosten voor de afgifte van de nieuwe medische verklaring worden alleen dan gedragen door de houder van het
      patent indien het vermoeden gegrond blijkt te zijn.

      2 De bevoegde autoriteit of de bevoegde rechtbank kan aan een schipper, die houder van een als gelijkwaardig erkend
      vaarbevoegdheidsbewijs is, een tijdelijk of definitief vaarverbod op de Rijn opleggen:

      a. bij bewezen lichamelijke of geestelijke ongeschiktheid, of

      b. bij veelvuldig overtreden van belangrijke veiligheids- of gedragsvoorschriften, in het bijzonder
      bij het herhaald voeren van een schip met een alcoholconcentratie in het bloed, die het in het
      [Rijnvaartpolitiereglement][ref2] vastgelegde promillage overschrijdt.

      3 In geval er geen urgentie is, wordt de beschikking na verhoor van de houder van het bedoelde
      vaarbevoegdheidsbewijs vastgesteld; de autoriteit die het vaarbevoegdheidsbewijs heeft afgegeven en de CCR worden
      van het verhoor en van de door de bevoegde autoriteit genomen beslissing in kennis gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0026045
      [ref2]: https://wetten.overheid.nl/BWBR0006923
    url: https://wetten.overheid.nl/BWBR0026045/2010-05-07#Artikel2.25
    references:
      - id: ref1
