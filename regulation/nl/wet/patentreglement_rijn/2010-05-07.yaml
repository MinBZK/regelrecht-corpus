  - number: '2.04'
    text: |-
      1 Degene die het overheidspatent wil verkrijgen moet:

      a. ten minste 21 jaar oud zijn;

      b. deel uit maken van een politie- of douanedienst, een andere autoriteit dan wel van een erkende brandweerdienst;

      c. lichamelijk en geestelijk geschikt zijn om een schip te voeren. De geschiktheid wordt aangetoond door het
      overleggen van een medische verklaring, als bedoeld in de [bijlagen B1][ref1] en [B2][ref2], afgegeven door een
      arts, die door de bevoegde autoriteit is aangewezen;

      d. bekwaam zijn, dat wil zeggen beschikt over de noodzakelijke beroepsmatige vaardigheden en kennis, ook in
      nautisch opzicht, alsmede over voldoende kennis van de reglementen en van de vaarweg. Aan de eisen wordt geacht te
      zijn voldaan wanneer de gegadigde het daartoe ingestelde examen met goed gevolg heeft afgelegd;

      e. ten minste drie jaren de binnenvaart in de praktijk hebben uitgeoefend, waarvan ten minste drie maanden
      gedurende het laatste jaar.

      2 De dienst waarvan de aanvrager deel uitmaakt moet een verklaring hebben afgegeven, waarin de informatie bedoeld
      in het eerste lid, onderdelen b en e en de [artikelen 2.05][ref3] en [2.06][ref4] wordt bevestigd.


