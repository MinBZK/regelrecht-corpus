        artikel: '2.08'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '2.02'
    text: |-
      1 Degene die het kleine patent wil verkrijgen moet ten minste 21 jaar oud zijn.

      2 De gegadigde moet in het bezit zijn van een marifoonbedieningscertificaat.

      3 De gegadigde moet de nodige kwalificatie bezitten; gekwalificeerd is degene die:

      a. lichamelijk en geestelijk geschikt is om een schip te voeren. De geschiktheid wordt aangetoond door het
      overleggen van een medische verklaring, als bedoeld in de [bijlagen B1][ref1] en [B2][ref2], afgegeven door een
      arts, die door de bevoegde autoriteit is aangewezen;

      b. geen strafbare feiten in de scheepvaart heeft begaan, terwijl uit voorgaand gedrag verwacht mag worden dat een
      schip veilig gevoerd en het bevel over een bemanning uitgeoefend kan worden;

      c. bekwaam is, dat wil zeggen beschikt over de noodzakelijke beroepsmatige vaardigheden en kennis, ook in nautisch
      opzicht, alsmede over voldoende kennis van de reglementen en van de vaarweg. Aan de voorwaarden wordt geacht te
      zijn voldaan wanneer de gegadigde het daartoe ingestelde examen met goed gevolg heeft afgelegd.

      4 De gegadigde moet een vaartijd aantonen van ten minste drie jaar in de binnenvaart als lid van dekpersoneel
      waarvan tenminste één jaar in de binnenvaart als matroos of matroos-motordrijver. De vaartijd moet op motorschepen
      zijn volbracht, waarvoor het grote patent of het kleine patent noodzakelijk is. De berekening van de vaartijd wordt
      gedaan volgens [artikel 2.08][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0026045
      [ref2]: https://wetten.overheid.nl/BWBR0026045
      [ref3]: https://wetten.overheid.nl/BWBR0026045#Artikel2.08
