  - number: '2.16'
    text: |-
      1 De bevoegde autoriteit geeft aan degene die het examen met goed gevolg heeft afgelegd het betreffende Rijnpatent
      af volgens het model van de [bijlage A1][ref1].

      De patentkaart heeft één der navolgende opdrukken:

      ‘Groot Patent’, ‘Klein Patent’, ‘Sportpatent’ of ‘Overheidspatent’.

      2 De voorwaarden bedoeld in [artikel 2.13, eerste lid, derde volzin][ref2], worden in het patent aangetekend.

      3 Voor de tijd gelegen tussen het slagen voor het examen en de afgifte van het patent volgens het model van de
      [bijlage A1][ref3], verstrekt de autoriteit die het patent afgeeft een voorlopig Rijnpatent volgens het model van
      de [bijlage A2][ref4]; ook kan de bevoegde autoriteit een voorlopig Rijnpatent verstrekken voor de tijd tussen de
      vervaldatum voor de vernieuwing van het patent en de afgifte van het nieuwe patent.

      4 Ingeval van een uitbreiding kan een bevoegde autoriteit het document als bedoeld in het derde lid ook afgeven
      ter overbrugging van de tijd gelegen tussen het slagen voor het examen en de afgifte van het nieuwe Rijnpatent. In
      verband met de afgifte van een nieuw Rijnpatent volgens het model van de [bijlage A1][ref5] wordt de autoriteit die
      het patent heeft afgegeven hiervan in kennis gesteld.

      5 De autoriteit die het patent heeft afgegeven geeft op verzoek een vervangend patent af indien het Rijnpatent
      onbruikbaar is geworden, verloren is gegaan of anderszins in het ongerede is geraakt. Dit patent wordt als zodanig
      gewaarmerkt. Het verlies moet bij de bevoegde autoriteit aannemelijk worden gemaakt. Een onbruikbaar geworden of
      een teruggevonden patent moet bij de autoriteit die het heeft afgegeven worden ingeleverd of worden overgelegd om
      ongeldig te worden verklaard.


      [ref1]: https://wetten.overheid.nl/BWBR0026045
      [ref2]: https://wetten.overheid.nl/BWBR0026045#Artikel2.13
      [ref3]: https://wetten.overheid.nl/BWBR0026045
      [ref4]: https://wetten.overheid.nl/BWBR0026045
