  - number: '2.27'
    text: |-
      1 Bestaat een ernstig vermoeden, dat een vaarbevoegdheidsbewijs door de autoriteit die het heeft afgegeven wordt
      ingetrokken of opgeschort, of bestaat er een ernstige verdenking van een frauduleus verkregen document, dan kan de
      bevoegde autoriteit gelasten tot het tijdelijk in beslag nemen van het patent.

      2 Een tijdelijk in beslag genomen bevoegdheidsbewijs moet onverwijld aan de autoriteit die dit heeft afgegeven
      worden overgelegd.

      3 De autoriteit die het vaarbevoegdheidsbewijs heeft afgegeven voert de noodzakelijke controles uit en stelt de
      bevoegde autoriteit die het bevoegdheidsbewijs in beslag genomen heeft en de CCR onverwijld van de geldigheid van
      het document in kennis.
    url: https://wetten.overheid.nl/BWBR0026045/2010-05-07#Artikel2.27
  - number: '3.01'
    text: |-
      Degene die een radarpatent wil verkrijgen moet:

      a. ten minste 18 jaar oud,

      b. houder van een schipperspatent, en

      c. houder van een marifoonbedieningscertificaat zijn.
    url: https://wetten.overheid.nl/BWBR0026045/2010-05-07#Artikel3.01
  - number: '3.02'
    text: |-
      1 De gegadigde voor een radarpatent moet een aanvraag voor toelating tot het examen en tot afgifte van een patent
      richten aan de bevoegde autoriteit, onder opgave van de volgende gegevens:

      a. voor- en achternaam;

      b. geboortedatum en geboorteplaats;

      c. adres.

      2 Bij de aanvraag moeten worden overgelegd:

      a. een recente pasfoto;

      b. een kopie van de identiteitskaart of het paspoort;

      c. een kopie van het schipperspatent;

      d. een kopie van het marifoonbedieningscertificaat.
    url: https://wetten.overheid.nl/BWBR0026045/2010-05-07#Artikel3.02
  - number: '3.03'
    text: |-
      1 De bevoegde autoriteit benoemt één of meer examencommissies voor het afnemen van de examens. Iedere
      examencommissie bestaat uit een voorzitter, die vertegenwoordiger is van de bevoegde autoriteit, en ten minste twee
      examinatoren die voldoende ter zake kundig zijn.

      2 De examinator die toeziet op het verloop van het praktische deel van het examen moet houder van het radarpatent
      zijn.
    url: https://wetten.overheid.nl/BWBR0026045/2010-05-07#Artikel3.03
  - number: '3.04'
    text: |-
      1 De gegadigde moet tijdens het examen ten overstaan van een examencommissie als bedoeld in [artikel 3.03][ref1]
      aantonen dat hij overeenkomstig het examenprogramma, bedoeld in [bijlage D2][ref2] (theoretisch en praktisch deel),
      beschikt over voldoende kennis ter zake van het voeren van een schip met behulp van radar.

      2 Het praktische examen kan ook op een door de bevoegde autoriteit hiervoor toegelaten radarsimulator worden
      afgenomen.

      3 Aan het in het eerste lid gestelde vereiste wordt voldaan wanneer de gegadigde een ander bewijs bezit dan
      voorgeschreven volgens dit reglement, voor zover dit bewijs door de bevoegde autoriteit van één der Rijnoeverstaten
      of België als gelijkwaardig is erkend.

      4 De gegadigde die voor het theoretische of praktische onderdeel van het examen is gezakt, kan voor dit onderdeel
      binnen een door de bevoegde autoriteit vastgestelde termijn, die niet korter dan twee maanden mag zijn, bij
      dezelfde examencommissie een herexamen doen.

      Indien de gegadigde niet binnen een jaar voor het herexamen is geslaagd, moet hij opnieuw worden geëxamineerd voor
      het volledige examenprogramma.

      5 De examencommissie deelt aan iedere gegadigde persoonlijk de uitslag van het examen mee. Op verzoek van de
      gegadigde moet de examencommissie mondeling inlichtingen geven over de door hem gemaakte fouten en kan zij hem
      tevens het inzien van de examendocumenten toestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0026045#Artikel3.03
      [ref2]: https://wetten.overheid.nl/BWBR0026045
    url: https://wetten.overheid.nl/BWBR0026045/2010-05-07#Artikel3.04
    references:
      - id: ref1
        bwb_id: BWBR0026045
        artikel: '3.03'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0026045
  - number: '3.05'
    text: |-
      1 Indien de gegadigde voor het examen is geslaagd, geeft de bevoegde autoriteit aan hem het radarpatent af volgens
      het model van [bijlage A4][ref1].

      2 Het bezit van het radarpatent kan op de schipperspatentkaart met het woord ‘Radar’ worden aangegeven.

      3 Op de radarpatenten, bedoeld in [artikel 1.04, tweede lid][ref2], wordt aangetekend:

      4 Is een radarpatent onbruikbaar geworden, verloren gegaan of anderszins in het ongerede geraakt, dan geeft
      de autoriteit die het heeft afgegeven op aanvraag een vervangend patent af, dat als zodanig is gewaarmerkt. De
      houder moet ten overstaan van de bevoegde autoriteit het verlies aannemelijk maken. Een onbruikbaar geworden of
      een teruggevonden patent moet bij de autoriteit die het heeft afgegeven worden ingeleverd of worden overgelegd om
      ongeldig te te worden verklaard.


      [ref1]: https://wetten.overheid.nl/BWBR0026045
      [ref2]: https://wetten.overheid.nl/BWBR0026045#Artikel1.04
    url: https://wetten.overheid.nl/BWBR0026045/2010-05-07#Artikel3.05
    references:
      - id: ref1
        bwb_id: BWBR0026045
      - id: ref2
        bwb_id: BWBR0026045
        artikel: '1.04'
        hoofdstuk: '1'
  - number: '3.06'
    text: |-
      Het radarpatent kan door de bevoegde autoriteit worden ingetrokken, wanneer de houder bij het voeren van een
      schip met behulp van radar een voor de scheepvaart gevaar veroorzakende onbekwaamheid aan de dag heeft gelegd. Het
      radarpatent kan tijdelijk dan wel permanent worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0026045/2010-05-07#Artikel3.06
  - number: '3.07'
    text: |-
      1 De bevoegde autoriteit of de bevoegde rechter kan de schipper, die houder van een als gelijkwaardig erkend
      radargetuigschrift is, een tijdelijk of definitief verbod voor het voeren van een schip met radar op de Rijn
      opleggen, wanneer de houder bij het voeren van een schip een voor de scheepvaart gevaarzettende onbekwaamheid heeft
      begaan.

      2 In geval er geen urgentie is, wordt de beschikking na verhoor van de houder van het bedoelde radargetuigschrift
      vastgesteld; de autoriteit die dat getuigschrift heeft afgegeven en de CCR worden van het verhoor en van de door de
      bevoegde autoriteit genomen beslissing in kennis gesteld.
    url: https://wetten.overheid.nl/BWBR0026045/2010-05-07#Artikel3.07
  - number: '3.08'
    text: |-
      Het examen, de afgifte, het vervangen en het omruilen van het radarpatent worden gedaan tegen een redelijke
      vergoeding van de kosten door de aanvrager. De hoogte van de kosten wordt door de bevoegde autoriteit vastgesteld.
      Deze kan de kosten geheel of ten dele vanaf het tijdstip van aanvraag vorderen.
    url: https://wetten.overheid.nl/BWBR0026045/2010-05-07#Artikel3.08
  - number: '4.01'
    text: |-
      1 Patenten, afgegeven overeenkomstig de voorschriften die van toepassing zijn tot aan de inwerkingtreding van dit
      reglement dan wel waarvan de geldigheid volgens die voorschriften is verlengd, blijven geldig met inachtneming van
      die voorschriften tot de eerste vernieuwing van het bewijs van lichamelijke en geestelijke geschiktheid.

      2 [Artikel 2.19][ref1] betreffende de controle van de lichamelijke en geestelijke geschiktheid is van toepassing op
      het in het eerste lid bedoelde Rijnschipperspatent, kleine patent en sportpatent, waarbij het anomaalquotiënt bij
      het kleuronderscheidingsvermogen 0,7 tot 3,0 mag bedragen. De houders van een patent die bij de inwerkingtreding
      van dit reglement reeds de leeftijd, bedoeld in [artikel 2.19, eerste lid, onderdeel a][ref2], hebben bereikt
      moeten hun lichamelijke en geestelijke geschiktheid bij de eerstvolgende voorgeschreven onderzoeksdatum laten
      controleren. Bij de eerste verlenging van de gebleken lichamelijke en geestelijke geschiktheid wordt aan hun een
      patent volgens het model van de [bijlage A1][ref3] afgegeven.

      3 De [artikelen 2.22][ref4] en [2.24][ref5] zijn van toepassing op de patenten als bedoeld in het eerste lid.

      4 Diploma’s voor het voeren van een schip met radar en radarpatenten afgegeven volgens de voorschriften die
      van toepassing zijn tot aan de inwerkingtreding van dit reglement, blijven geldig met inachtneming van die
      voorschriften. Zij kunnen door radarpatenten conform dit reglement worden omgewisseld.


      [ref1]: https://wetten.overheid.nl/BWBR0026045#Artikel2.19
      [ref2]: https://wetten.overheid.nl/BWBR0026045#Artikel2.19
      [ref3]: https://wetten.overheid.nl/BWBR0026045
      [ref4]: https://wetten.overheid.nl/BWBR0026045#Artikel2.22
      [ref5]: https://wetten.overheid.nl/BWBR0026045#Artikel2.24
