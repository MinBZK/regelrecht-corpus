  - number: '2.21'
    text: |-
      1 De bevoegde autoriteit, zoals deze in [artikel 2.19, derde lid][ref1] wordt gedefinieerd, geeft op vertoon
      van de medische verklaring, en op basis daarvan, de houder van een door de CCR als gelijkwaardig erkend
      vaarbevoegdheidsbewijs vanaf de leeftijd van 50 jaar een bewijs van lichamelijke en geestelijke geschiktheid
      conform het model van de [bijlage B3][ref2].

      2 Blijkt uit de medische verklaring slechts een beperkte lichamelijke en geestelijke geschiktheid, dan vult de
      bevoegde autoriteit op het bewijs van lichamelijke en geestelijke geschiktheid de aanvullende voorwaarden dan wel
      de geldigheid van het als gelijkwaardig erkende vaarbevoegdheidsbewijs op de Rijn in.

      3 Het als gelijkwaardig erkende vaarbevoegdheidsbewijs, waarvan de houder meer dan 50 jaar is, is op de Rijn alleen
      geldig, als deze in het bezit is van een bewijs van lichamelijke en geestelijke geschiktheid conform het model van
      de [bijlage B3][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0026045#Artikel2.19
      [ref2]: https://wetten.overheid.nl/BWBR0026045
      [ref3]: https://wetten.overheid.nl/BWBR0026045
    url: https://wetten.overheid.nl/BWBR0026045/2010-05-07#Artikel2.21
