        artikel: '1.03'
        hoofdstuk: '1'
  - number: '1.06'
    text: |-
      De Centrale Commissie voor de Rijnvaart kan voor de toepassing van dit reglement richtlijnen vaststellen. De
      bevoegde autoriteiten dienen zich aan deze richtlijnen te houden.
    url: https://wetten.overheid.nl/BWBR0026045/2010-05-07#Artikel1.06
  - number: '1.07'
    text: |-
      De Centrale Commissie voor de Rijnvaart kan voorschriften van tijdelijke aard vaststellen, wanneer het voor een
      aanpassing aan de technische ontwikkeling van de binnenscheepvaart noodzakelijk wordt geacht om in dringende
      gevallen afwijkingen van dit reglement toe te laten dan wel proefnemingen mogelijk te maken, waardoor de veiligheid
      en de vlotte afwikkeling van het scheepvaartverkeer niet worden benadeeld. Deze voorschriften van tijdelijke aard
      worden door de bevoegde autoriteit gepubliceerd en hebben een geldigheidsduur van ten hoogste drie jaren.

      Zij worden in alle Oeverstaten en België op hetzelfde tijdstip in werking gesteld en worden onder dezelfde
      voorwaarden buiten werking gesteld.
    url: https://wetten.overheid.nl/BWBR0026045/2010-05-07#Artikel1.07
  - number: '2.01'
    text: |-
      1 Degene die het grote patent wil verkrijgen moet ten minste 21 jaar oud zijn.

      2 De gegadigde moet in het bezit zijn van een marifoonbedieningscertificaat.

      3 De gegadigde moet de nodige kwalificatie bezitten; gekwalificeerd is degene die:

      a. lichamelijk en geestelijk geschikt is om een schip te voeren.

      De geschiktheid wordt aangetoond door het overleggen van een medische verklaring, als bedoeld in de
      [bijlagen B1][ref1] en [B2][ref2], afgegeven door een arts, die door de bevoegde autoriteit is aangewezen;

      b. geen strafbare feiten in de scheepvaart heeft begaan, terwijl uit voorgaand gedrag verwacht mag worden dat een
      schip veilig gevoerd en het bevel over een bemanning uitgeoefend kan worden;

      c. bekwaam is, dat wil zeggen beschikt over de noodzakelijke beroepsmatige vaardigheden en kennis, ook in nautisch
      opzicht, alsmede over voldoende kennis van de reglementen en van de vaarweg. Aan de voorwaarden wordt geacht te
      zijn voldaan wanneer de gegadigde het daartoe ingestelde examen met goed gevolg heeft afgelegd.

      4 De gegadigde moet een vaartijd aantonen van ten minste vier jaar als lid van een dekbemanning, waarvan ten minste
      twee jaren in de binnenvaart als matroos of matroos-motordrijver dan wel ten minste één jaar als volmatroos. De
      vaartijd moet op motorschepen zijn volbracht, waarvoor het grote patent of het kleine patent noodzakelijk is. De
      berekening van de vaartijd wordt gedaan volgens [artikel 2.08][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0026045
      [ref2]: https://wetten.overheid.nl/BWBR0026045
      [ref3]: https://wetten.overheid.nl/BWBR0026045#Artikel2.08
    url: https://wetten.overheid.nl/BWBR0026045/2010-05-07#Artikel2.01
