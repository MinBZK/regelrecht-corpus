  - number: '2.05'
    text: |-
      Ongeacht het soort patent is specifieke kennis van riviergedeelten daarenboven verplicht tussen de sluizen te
      Iffezheim (km 335,92) en het Spijksche Veer (km 857,40).
    url: https://wetten.overheid.nl/BWBR0026045/2010-05-07#Artikel2.05
  - number: '2.06'
    text: |-
      1 Degene die een Rijnpatent of een bewijs voor riviergedeelten verkrijgen wil, moet het aangevraagde gedeelte, dat
      zich tussen de sluizen te Iffezheim en het Spijksche Veer bevindt, in de laatste tien jaren ten minste zestien maal
      hebben bevaren, waarvan binnen de laatste drie jaren ten minste drie maal in elke richting.

      a. Degene die een grote patent, een kleine patent of een bewijs voor riviergedeelten verkrijgen wil, moet zijn
      reizen als matroos, matroosmotordrijver, volmatroos of stuurman aan boord van een motorschip hebben gemaakt, voor
      het voeren waarvan het aangevraagde patent of een door de CCR als gelijkwaardig erkend vaarbevoegdheidsbewijs is
      voorgeschreven.

      b. Degene die een sportpatent wil verkrijgen, moet zijn reizen aan boord van een schip met een lengte van 15
      m of meer hebben gemaakt; de reizen komen slechts in aanmerking, als de persoon ten minste 15 jaar oud is. Het
      aantal van de voorgeschreven reizen kan verminderd worden tot vier reizen in elke richting binnen het laatste jaar
      voorafgaand aan de aanvraag, als de reizen het kader van een vakkundige opleiding zijn gemaakt.

      c. Degene die een overheidspatent wil verkrijgen, moet zijn reizen aan boord van een schip met een lengte van 15 m
      of meer hebben gemaakt;

      de reizen komen slechts in aanmerking, als de persoon ten minste 15 jaar oud is.

      2 In dit examen wordt de beschrijving van de vaarweg in de open de afvaart evenals de beschrijving van de
      afmetingen van de scheepvaartweg gevraagd. Daartoe moet de kandidaat ook de politievoorschriften voor die
      riviergedeelte kunnen toepassen ([bijlage D1][ref1]).


      [ref1]: https://wetten.overheid.nl/BWBR0026045
    url: https://wetten.overheid.nl/BWBR0026045/2010-05-07#Artikel2.06
    references:
      - id: ref1
        bwb_id: BWBR0026045
  - number: '2.07'
    text: |-
      1 De gegadigde voor een patent voor een gedeelte, dat de in [artikel 2.05][ref1] gedefinieerde riviergedeelte
      geheel of gedeeltelijk omvat, en de houder van een als gelijkwaardig erkend vaarbevoegdheidsbewijs, die de in
      [artikel 2.05][ref2] gedefinieerde riviergedeelte geheel of gedeeltelijk willen bevaren, moeten de noodzakelijke
      kennis van riviergedeelten kunnen aantonen.

      2 Als bewijs van de kennis van riviergedeelten wordt op de patentkaart het riviergedeelte aangegeven, waarvoor deze
      patentkaart van toepassing is. Voor de met het grote patent als gelijkwaardig erkende vaarbevoegdheidsbewijs wordt
      de kennis van het riviergedeelte door middel van een bewijs voor riviergedeelten bedoeld in [bijlage A3][ref3]
      aangetoond.


      [ref1]: https://wetten.overheid.nl/BWBR0026045#Artikel2.05
