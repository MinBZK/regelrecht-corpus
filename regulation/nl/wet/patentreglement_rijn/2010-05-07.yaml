  - number: '2.12'
    text: |-
      1 Degene die een bewijs voor riviergedeelten verkrijgen of uitbreiden wil, moet een aanvraag voor toelating tot het
      examen en afgifte van een bewijs voor riviergedeelten met de volgende bijlagen tot de bevoegde autoriteit richten:

      a. voor- en achternamen, geboortedatum, geboorteplaats en adres;

      b. gedeelte van de Rijn waarvoor het bewijs voor riviergedeelten moet worden verkregen.

      2 Bij de aanvraag voor het verkrijgen of uitbreiden van een bewijs voor riviergdeelten moeten worden gevoegd:

      a. een recente pasfoto;

      b. een kopie van de identiteitskaart of het paspoort;

      c. een kopie van het door de CCR, ingevolge [artikel 1.03, eerste lid][ref1], als gelijkwaardig erkend geldig
      vaarbevoegdheidsbewijs

      d. het bewijs van de reizen op de riviergedeelten.


      [ref1]: https://wetten.overheid.nl/BWBR0026045#Artikel1.03
    url: https://wetten.overheid.nl/BWBR0026045/2010-05-07#Artikel2.12
    references:
