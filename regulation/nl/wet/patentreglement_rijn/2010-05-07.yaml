      - id: ref2
        bwb_id: BWBR0006923
  - number: '2.26'
    text: |-
      1 Indien er dringende redenen aanwezig zijn om het patent in te trekken ([artikel 2.24][ref1]) of om de geldigheid
      daarvan op te schorten ([artikel 2.22, eerste lid, onderdeel a][ref2]) kan de bevoegde autoriteit besluiten dat het
      patent tijdelijk wordt ingevorderd.

      2 Een Rijnpatent dat tijdelijk is ingevorderd wordt onverwijld en onder opgave van redenen bij de autoriteit die
      het heeft afgegeven of bij de ingevolge de nationale voorschriften bevoegde rechtbank, overgelegd.

      3 De autoriteit die het patent heeft afgegeven moet onverwijld, nadat zij van het besluit van de tijdelijke
      invordering kennis heeft genomen, een beslissing nemen over het opschorten van de geldigheid van het patent of het
      intrekken daarvan. Indien een rechtbank bevoegd is, wordt besloten overeenkomstig de nationale voorschriften van de
      Rijnoeverstaten of België. Totdat een besluit als bedoeld in eerste en tweede zin is genomen, geldt het besluit van
      de tijdelijke invordering tevens als een besluit als bedoeld in [artikel 2.22, eerste lid, onderdeel a][ref3].

      4 Het tijdelijk invorderen van het patent moet worden opgeheven en het patent moet aan de houder worden
      teruggegeven, wanneer de oorzaak daarvan is komen te vervallen, of wanneer een opschorting niet wordt
      voorgeschreven dan wel het patent niet wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0026045#Artikel2.24
      [ref2]: https://wetten.overheid.nl/BWBR0026045#Artikel2.22
      [ref3]: https://wetten.overheid.nl/BWBR0026045#Artikel2.22
    url: https://wetten.overheid.nl/BWBR0026045/2010-05-07#Artikel2.26
