  - number: '1.02'
    text: |-
      Dit reglement regelt de verplichting tot het hebben van een patent voor de scheepvaart op de Rijn voor het
      betreffende scheepstype en -afmetingen en voor de te bevaren riviergedeelten alsmede de voorwaarden betreffende het
      verkrijgen van een patent.
    url: https://wetten.overheid.nl/BWBR0026045/2010-05-07#Artikel1.02
  - number: '1.03'
    text: |-
      1 Degene die op de Rijn een schip wil voeren, moet ingevolge dit reglement zijn voorzien van een Rijnpatent of een
      door de CCR als gelijkwaardig erkend vaarbevoegdheidsbewijs voor betreffende scheepstype en -afmetingen alsmede
      voor het te bevaren riviergedeelte; de lijst van de als gelijkwaardig erkende vaarbevoegdheidsbewijzen alsmede de
      eventuele aanvullende voorwaarden voor deze erkenning zijn in de [bijlage C1][ref1] opgenomen.

      2 Het Rijnpatent wordt verleend voor de gehele Rijn of voor afzonderlijke gedeelten daarvan; wordt het voor
      afzonderlijke riviergedeelten afgegeven, dan geldt het ook voor de vaart benedenstrooms van het Spijksche Veer (km
      857,40) en op het gedeelte tussen Bazel (Mittlere Rheinbrücke km 166,64) en de sluizen te Iffezheim (km 335,92). De
      als gelijkwaardig erkende vaarbevoegdheidsbewijzen gelden op de in artikel 2.05 beschreven riviergedeelten slechts,
      als de bezitter een bewijs voor riviergedeelten conform het model van de [bijlage A3][ref2] bezit.

      3 Voor de vaart benedenstrooms van het Spijksche Veer (km 857,40) en op het riviergedeelte tussen Bazel (Mittlere
      Rheinbrücke – km 166,64) en de sluis Iffezheim (km 335,92), kan worden volstaan met:

      a. in plaats van het patent bedoeld in [artikel 2.01][ref3] een vaarbewijs als bedoeld in de bijlage I van de
      [Richtlijn 91/672/EEG](31991L0672), of een vaarbewijs afgegeven ingevolge de [Richtlijn 96/50/EG](31996L0050);

      b. in plaats van het patent, bedoeld in de [artikelen 2.02 tot en met 2.04][ref4], een ander door de bevoegde
      autoriteit als gelijkwaardig erkend bewijs van vaarbekwaamheid.

      4 Voor schepen met een lengte van minder dan 15 m, met uitzondering van passagiersschepen, duw- en sleepboten,
      kan worden volstaan met een bewijs van vaarbekwaamheid voor de binnenwateren, dat in overeenstemming is met de
      nationale voorschriften van de Rijnoeverstaten en België.

      5 De patentverplichting voor veerponten en voorschepen, die slechts door spierkracht worden voortbewogen alsmede
      voor schepen met een lengte van minder dan 15 m die slechts

      a. door middel van zeilen worden voortbewogen, dan wel

      b. zijn uitgerust met mechanische middelen tot voortbeweging van niet meer dan 3,68 kW, wordt de verplichting tot
      het hebben van een patent uitsluitend geregeld door de nationale voorschriften van de Rijnoeverstaten.


      [ref1]: https://wetten.overheid.nl/BWBR0026045
      [ref2]: https://wetten.overheid.nl/BWBR0026045
      [ref3]: https://wetten.overheid.nl/BWBR0026045#Artikel2.01
      [ref4]: https://wetten.overheid.nl/BWBR0026045#Artikel2.02
