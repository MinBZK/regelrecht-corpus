  - number: '2.23'
    text: |-
      Het door de CCR als gelijkwaardig erkend vaarbevoegdheidsbewijs verliest, ook zonder beschikking, of zonder
      dat daarvoor een bijzondere beslissing nodig is, de geldigheid op de Rijn, wanneer het bewijs van lichamelijke
      en geestelijke geschiktheid conform [bijlage B3][ref1] niet wordt getoond, of binnen drie maanden na de in
      [artikel 2.19, eerste lid][ref2], bedoelde verlengingstermijn niet wordt voorgelegd of vernieuwd.


      [ref1]: https://wetten.overheid.nl/BWBR0026045
      [ref2]: https://wetten.overheid.nl/BWBR0026045#Artikel2.19
    url: https://wetten.overheid.nl/BWBR0026045/2010-05-07#Artikel2.23
