  - number: '2.03'
    text: |-
      1 Degene die het sportpatent wil verkrijgen moet ten minste 18 jaar oud zijn.

      2 De gegadigde moet de nodige kwalificatie bezitten; gekwalificeerd is degene die:

      a. lichamelijk en geestelijk geschikt is om een schip te voeren. De geschiktheid wordt aangetoond door het
      overleggen van een medische verklaring, als bedoeld in de [bijlagen B1][ref1] en [B2][ref2], afgegeven door een
      arts, die door de bevoegde autoriteit is aangewezen;

      b. geen strafbare feiten in de scheepvaart heeft begaan, terwijl uit voorgaand gedrag verwacht mag worden dat een
      schip veilig kan worden gevoerd;

      c. bekwaam is, dat wil zeggen beschikt over de noodzakelijke beroepsmatige vaardigheden en kennis, ook in nautisch
      opzicht, alsmede over voldoende kennis van de reglementen en van de vaarweg. Aan de voorwaarden wordt geacht te
      zijn voldaan wanneer de gegadigde het daartoe ingestelde examen met goed gevolg heeft afgelegd.


