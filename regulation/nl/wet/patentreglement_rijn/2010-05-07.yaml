  - number: '2.15'
    text: |-
      1 Degene die het eindexamen van een beroepsopleiding met goed gevolg heeft afgelegd kan worden vrijgesteld van die
      gedeelten van het examen, die betrekking hebben op kennis en vaardigheden, die reeds onderwerp van een door de CCR
      als gelijkwaardig erkend examen waren.

      2 De houder van een bewijs van vaarbekwaamheid als bedoeld in [artikel 1.03, vierde lid][ref1], kan bij het
      verwerven van het sportpatent van dat gedeelte van het examen worden vrijgesteld dat betrekking heeft op nautische
      kennis.

      3 De houder van een vaarbewijs van één der Rijnoeverstaten of België dan wel een ander geldig en door de Centrale
      Commissie voor de Rijnvaart als gelijkwaardig erkend bewijs van vaarbekwaamheid voor het voeren van een schip
      op andere vaarwegen moet voor het verkrijgen van een Rijnpatent voldoen aan de toelatingseisen als bedoeld in
      [artikel 2.13][ref2], doch tijdens het examen slechts de kennis van de op de Rijn van toepassing zijnde reglementen
      en bepalingen en de kennis van het betreffende riviergedeelte conform [artikel 2.05][ref3] aantonen.

      4 De houder van een overheidspatent verkrijgt op aanvraag een sportpatent voor hetzelfde riviergedeelte zonder
      daarvoor examen te doen.

      5 Voor het verkrijgen van een ander patent als bedoeld in [artikel 1.04][ref4] of van een uitbreiding tot een ander
      riviergedeelte kan de houder van een Rijnpatent van dat deel van het examen worden vrijgesteld, dat betrekking
      heeft op de kennis of de vaardigheden, welke reeds voor het verkrijgen van zijn huidige patent moesten worden
      aangetoond.


      [ref1]: https://wetten.overheid.nl/BWBR0026045#Artikel1.03
      [ref2]: https://wetten.overheid.nl/BWBR0026045#Artikel2.13
