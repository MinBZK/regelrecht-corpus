      - id: ref2
        bwb_id: BWBR0026045
  - number: '2.18'
    text: |-
      Het examen, de afgifte, de uitbreiding en het verstrekken van het Rijnpatent of een bewijs voor riviergedeelten,
      evenals het vervangen en het omruilen worden gedaan tegen een redelijke vergoeding van de kosten door de aanvrager.
      De hoogte van de kosten wordt door de bevoegde autoriteit vastgesteld. Deze kan de kosten geheel of ten dele vanaf
      het tijdstip van aanvraag vorderen.
    url: https://wetten.overheid.nl/BWBR0026045/2010-05-07#Artikel2.18
  - number: '2.19'
    text: |-
      1 De houder van het grote patent, het kleine patent, het sportpatent of een door de CCR als gelijkwaardig erkend
      vaarbevoegdheidsbewijs moet zijn lichamelijke en geestelijke geschiktheid opnieuw aantonen door het overleggen van
      een medische verklaring, als bedoeld in de [bijlage B2][ref1] of een als gelijkwaardig erkende medische verklaring,
      die niet ouder dan drie maanden mag zijn:

      a. iedere vijf jaren vanaf het bereiken van de leeftijd van 50 jaar tot de leeftijd van 65 jaar;

      b. ieder jaar vanaf het bereiken van de leeftijd van 65 jaar.

      2 Het aangehaalde bewijs van de lichamelijke en geestelijke geschiktheid moet worden overgelegd aan de autoriteit,
      die het patent heeft afgegeven. Het kan ook bij een andere bevoegde autoriteit worden overgelegd. Deze autoriteit
      geleidt de bescheiden verder naar de autoriteit die het patent afgeeft en geeft zo nodig een tijdelijke verklaring
      als vervangend document af.

      3 Voor de bezitters van een als gelijkwaardig erkende verklaring moet de medische verklaring worden overgelegd aan
      de autoriteit, die voor de afgifte van een Rijnpatent gerechtigd is/of die autoriteit te overleggen, die het als
      gelijkwaardig erkende verklaring heeft afgegeven. De met deze aanvraag belaste autoriteit geeft een document voor
      de lichamelijke en geestelijke geschiktheid overeenkomstig het model volgens [bijlage B3][ref2] af.


      [ref1]: https://wetten.overheid.nl/BWBR0026045
      [ref2]: https://wetten.overheid.nl/BWBR0026045
    url: https://wetten.overheid.nl/BWBR0026045/2010-05-07#Artikel2.19
    references:
      - id: ref1
        bwb_id: BWBR0026045
      - id: ref2
        bwb_id: BWBR0026045
  - number: '2.20'
    text: |-
      1 De autoriteit die het patent afgeeft geeft de houder van een patent op vertoon van een medische verklaring, op
      basis van deze verklaring de navolgende bescheiden af:

      a. een nieuwe patentkaart bij het bereiken van de leeftijd van 50 en 65 jaar;

      b. een nieuwe patentkaart of een bewijs van lichamelijke en geestelijke geschiktheid als bedoeld in
      [bijlage B3][ref1], bij het bereiken van de leeftijd van 55 en 60 jaar;

      c. een beschikking over de lichamelijke en geestelijke geschiktheid als bedoeld in [bijlage B3][ref2], voor de
      controles die na het bereiken van de leeftijd van 65 jaar zullen plaatsvinden.

      Op het bewijs van lichamelijke en geestelijke geschiktheid als bedoeld in [bijlage B3][ref3] moet ook een
      vervaldatum worden aangebracht, die de vervaldatum van de patentkaart vervangt.

      2 Het bewijs als bedoeld in het eerste lid onder b en c kan door de bevoegde autoriteit ook op de medische
      verklaring bedoeld in [bijlage B2][ref4] worden aangebracht. Deze moet in dit geval ook de datum aangeven, tot
      wanneer de patentkaart geldig is.

      3 Blijkt uit de medische verklaring slechts een beperkte lichamelijke en geestelijke geschiktheid, geeft de
      autoriteit die het afgeeft op de vernieuwde patentkaart, op het bewijs van lichamelijke en geestelijke geschiktheid
      of de medische verklaring bedoeld in [bijlage B2][ref5] de aanvullende voorwaarden dan wel de geldigheid van het
      patent weer.

      4 Wordt geen nieuwe patentkaart afgegeven, dan is het Rijnpatent slechts geldig, als de houder van het patent in
      het bezit is van een bewijs van lichamelijke en geestelijke geschiktheid bedoeld in [bijlage B3][ref6] of van een
      door de bevoegde autoriteit gewaarmerkte medische verklaring bedoeld in [bijlage B2][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0026045
      [ref2]: https://wetten.overheid.nl/BWBR0026045
      [ref3]: https://wetten.overheid.nl/BWBR0026045
      [ref4]: https://wetten.overheid.nl/BWBR0026045
      [ref5]: https://wetten.overheid.nl/BWBR0026045
      [ref6]: https://wetten.overheid.nl/BWBR0026045
      [ref7]: https://wetten.overheid.nl/BWBR0026045
