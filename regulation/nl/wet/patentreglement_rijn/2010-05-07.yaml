  - number: '1.01'
    text: |-
      In dit reglement wordt verstaan onder:

      1. *schip:* een binnenschip, een zeeschip of een drijvend werktuig;

      2. *binnenschip:* een schip dat uitsluitend of overwegend bestemd is voor de vaart op de binnenwateren;

      3. *zeeschip:* een schip dat is toegelaten voor de zee- of kustvaart en overwegend daartoe bestemd is;

      4. *drijvend werktuig:* een drijvend bouwsel waarop zich werkinstallaties bevinden (zoals kranen, baggermolens,
      hei-installaties, drijvende bokken, elevatoren, enz.);

      5. *veerpont:* een schip dat een veerdienst onderhoudt, waarbij de vaarweg wordt overgestoken, en dat door de
      bevoegde autoriteit als veerpont wordt aangemerkt;

      6. *passagiersschip:* een schip dat is gebouwd en ingericht voor het vervoer van meer dan 12 passagiers;

      7. *pleziervaartuig:* een schip dat is bestemd voor sportieve of recreatieve doeleinden en dat geen passagiersschip
      is;

      8. *sleepboot:* een schip dat speciaal is gebouwd om te slepen;

      9. *duwboot:* een schip dat speciaal is gebouwd voor het voortbewegen van een duwstel;

      10. *gekoppeld samenstel:* een hecht samenstel van langszijde van elkaar vastgemaakte schepen, waarvan er geen is
      geplaatst vóór het motorschip dat dient voor het voortbewegen van het samenstel;

      11. *overheidsvaartuig:* een schip waarvan de lengte niet meer dan 25 m bedraagt en dat ter uitvoering van
      overheidstaken wordt ingezet;

      12. *brandweerboot:* een schip waarvan de lengte 15 m of meer bedraagt en dat ter uitvoering van brandweerdiensten
      wordt ingezet;

      13. *lengte:* de grootste lengte van de scheepsromp in m, het roer en de boegspriet niet inbegrepen.

      14. *breedte:* de grootste breedte van de scheepsromp in m, gemeten op de buitenkant van de huidbeplating
      (schoepraderen, schuurlijsten en dergelijke niet inbegrepen);

      15. *dekbemanning:* de minimum bemanning met uitzondering van machinisten;

      16. *matroos, matroos-motordrijver, volmatroos, stuurman:* een persoon, die de bekwaamheid bedoeld in de
      bemanningsvoorschriften van het [Reglement onderzoek schepen op de Rijn][ref1] bezit;

      17. *vaartijd:* de tijd aan boord van een schip, dat een reis maakt;

      18. *radarvaart:* de vaart bij slecht zicht, waarbij de radar voor het voeren het schip wordt gebruikt;

      19. *marifoonbedieningscertificaat:* een op basis van bijlage 5 van de Regionale regeling betreffende de
      marifoondienst in de binnenvaart afgegeven certificaat;

      20. *Rijnpatent:* een bevoegdheidsbewijs voor het voeren van schepen op de Rijn;

      21. *Schipperspatent:* een Rijnpatent of een ander bevoegdheidsbewijs voor het voeren van schepen in de
      binnenvaart;

      22. *Radarpatent:* een bevoegdheidsbewijs voor de radarvaart;

      23. *bewijs voor riviergedeelten:* een aan de houder, van een door de CCR als gelijkwaardig erkend
      vaarbevoegdheidsbewijs, afgegeven bewijs, waarmee wordt bevestigd, dat de schipper de voor de Rijn vereiste kennis
      van bepaalde riviergedeelten bezit.


      [ref1]: https://wetten.overheid.nl/BWBR0025973
