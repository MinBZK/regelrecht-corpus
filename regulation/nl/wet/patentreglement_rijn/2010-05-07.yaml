  - number: '2.08'
    text: |-
      1 Als één jaar vaartijd gelden 180 effectieve vaardagen in de binnenvaart.

      Binnen een periode van 365 opeenvolgende dagen kunnen maximaal 180 dagen als vaartijd worden meegerekend.

      2 Tot de vaartijd wordt meegerekend:

      a. de tijd van de opleiding, met een maximum van drie jaren, indien de gegadigde in het bezit is van een door de
      bevoegde autoriteit erkende verklaring inzake een met goed gevolg afgesloten beroepsopleiding met praktijkgedeelten
      op het gebied van de binnenvaart,

      b. de aangetoonde vaartijd, met een maximum van twee jaren, die op zee als lid van een dekbemanning is
      doorgebracht, waarbij 250 zeedagen als één jaar vaartijd gelden.
    url: https://wetten.overheid.nl/BWBR0026045/2010-05-07#Artikel2.08
  - number: '2.09'
    text: |-
      1 De vereiste vaartijd en de reizen op bepaalde riviergedeelten van de Rijn moeten worden
      aangetoond aan de hand van een behoorlijk ingevuld en gewaarmerkt dienstboekje, als bedoeld in de
      [bijlage F van het Reglement onderzoek schepen op de Rijn][ref1] of aan de hand van een door de CCR voor de Rijn
      als gelijkwaardig erkend dienstboekje. Het dienstboekje moet door de bevoegde autoriteit in ten minste één van de
      CCR voertalen zijn afgegeven.

      2 Voor zover een dienstboekje ingevolge nationale voorschriften van de Rijnoeverstaten en België voor de vaarwegen
      buiten de Rijn niet is voorgeschreven, kan de vaartijd ook worden aangetoond door een geldig ambtelijk document,
      dat tenminste de volgende gegevens bevat:

      a. soort, grootte, aantal passagiers, naam en vermogen van de schepen, waarop de aanvrager heeft gevaren;

      b. de naam van de schipper;

      c. het tijdstip van het begin en het einde van de reizen;

      d. de uitgeoefende functie;

      e. de bevaren riviergedeelten (precieze aanduiding met plaatsen van vertrek en aankomst).

      Voor het overheidspatent worden de voorgeschreven reizen en vaartijden aan de hand van een certificaat aangetoond,
      dat door de dienst waarvan de aanvrager deel uitmaakt wordt opgesteld.

      3 De vaartijd kan eveneens worden aangetoond met een bewijs van vaarbekwaamheid als bedoeld in
      [artikel 2.15, derde lid][ref2], tot de omvang die voor het verkrijgen van dit bewijs reeds is aangetoond.

      4 De vaartijd op zee moet worden aangetoond door middel van een monsterboekje.

      5 De tijd doorgebracht op een vakschool voor schippers moet worden aangetoond door een getuigschrift van die
      school.

      6 Voor zover noodzakelijk, moeten de documenten, als bedoeld in het tweede tot en met het vijfde lid, vergezeld van
      een officiële vertaling in de Duitse, Franse of Nederlandse taal worden overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0025973
      [ref2]: https://wetten.overheid.nl/BWBR0026045#Artikel2.15
    url: https://wetten.overheid.nl/BWBR0026045/2010-05-07#Artikel2.09
