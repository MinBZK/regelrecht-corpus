  - number: '2.10'
    text: |-
      1 De bevoegde autoriteit benoemt één of meer examencommissies voor het afnemen van de examens. Iedere
      examencommissie bestaat uit een voorzitter, die vertegenwoordiger is van de overheid van één der Rijnoeverstaten of
      België, en ten minste twee bijzitters, die voldoende ter zake kundig zijn.

      2 De examencommissie voor het Rijnpatent moet zo zijn samengesteld, dat ten minste één examinator houder is van het
      patent van het type dat wordt aangevraagd dan wel van het grote patent en deze, of een andere examinator, houder is
      van het patent voor het aangevraagde riviergedeelte.
    url: https://wetten.overheid.nl/BWBR0026045/2010-05-07#Artikel2.10
  - number: '2.11'
    text: |-
      1 Degene die een Rijnpatent wil verkrijgen of uitbreiden moet een aanvraag voor toelating tot het examen en afgifte
      van het patent aan de bevoegde autoriteit richten, onder opgave van het volgende:

      a. voor- en achternamen, geboortedatum, geboorteplaats en adres;

      b. soort patent dat men wil verkrijgen;

      c. gedeelte van de Rijn waarvoor het patent wordt aangevraagd.

      2 Bij de aanvraag van een Rijnpatent moeten worden overgelegd:

      a. een recente pasfoto;

      b. een kopie van de identiteitskaart of het paspoort;

      c. een medische verklaring als bedoeld in [bijlage B2][ref1], die niet ouder dan drie maanden mag zijn. Ingeval van
      twijfel aan de lichamelijke en geestelijke geschiktheid kan de bevoegde autoriteit verlangen dat verklaringen van
      een arts of een specialist worden overgelegd.

      d. een bewijs van de vaartijd en van de reizen op bepaalde riviergedeelten;

      e. bij aanvraag van een groot of een klein patent een kopie van het marifoonbedieningscertificaat;

      f. een uittreksel uit het strafregister.

      3 Een bewijs van lichamelijke en geestelijke geschiktheid kan in plaats van een medische verklaring als bedoeld in
      [bijlage B2][ref2], eveneens worden aangetoond met een door de CCR erkend

      a. geldig vaarbevoegdheidsbewijs, waarvoor dezelfde eisen gelden als bedoeld in [bijlage B1][ref3] en [B2][ref4] en
      dat conform [artikel 2.17][ref5] is vernieuwd, of

      b. medische verklaring, die niet ouder dan drie maanden is en voor de afgifte waarvan tenminste dezelfde eisen
      gelden als bedoeld in [bijlage B1][ref6] en [B2][ref7].

      4 In plaats van het uittreksel uit het strafregister kan het aantonen ook met een ander, naar het geldende recht
      van de woonplaats, gelijkwaardig document, worden gedaan. Dit geldige document mag in elk geval niet ouder zijn dan
      6 maanden.

      5 Indien het patent tot een ander riviergedeelte moet worden uitgebreid moet bij de aanvraag worden bijgevoegd:

      a. een recente pasfoto;

      b. een kopie van de identiteitskaart of het paspoort;

      c. een kopie van het geldige Rijnpatent;

      d. het bewijs van de reizen op de riviergedeelten.

      6 Voor de aanvraag voor een ander type Rijnpatent door een houder van een Rijnpatent moet worden bijgevoegd:

      a. een recente pasfoto;

      b. een kopie van de identiteitskaart of het paspoort;

      c. een kopie van het geldige Rijnpatent.


      [ref1]: https://wetten.overheid.nl/BWBR0026045
      [ref2]: https://wetten.overheid.nl/BWBR0026045
