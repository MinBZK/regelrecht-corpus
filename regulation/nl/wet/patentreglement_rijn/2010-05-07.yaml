  - number: '2.22'
    text: |-
      1 De geldigheid van een patent wordt opgeschort

      a. door een beslissing van de bevoegde autoriteit die daarbij de duur van het opschorten vaststelt. De bevoegde
      autoriteit kan een dergelijke beslissing tot opschorten nemen wanneer de voorwaarden voor intrekken nog niet zijn
      vervuld maar er twijfel bestaat over de bekwaamheid van de patenthouder. Indien deze twijfel vóór het einde van de
      termijn van opschorten wordt weggenomen, dient de beslissing te worden ingetrokken;

      b. automatisch zonder dat een dergelijke beslissing is genomen, tot aan de verlenging van het bewijs van
      lichamelijke en geestelijke geschiktheid, indien de lichamelijke en geestelijke geschiktheid niet binnen 3 maanden
      na de verlengingstermijn, bedoeld in [artikel 2.19, eerste lid][ref1], opnieuw is aangetoond.

      2 Heeft de bevoegde autoriteit twijfel aan de lichamelijke en geestelijke geschiktheid van de Rijnpatenthouder,

      a. informeert ze de autoriteit die het patent heeft afgegeven. Deze kan verlangen dat een medische verklaring
      als bedoeld in [bijlage B2][ref2] of een door de CCR als gelijkwaardig erkend medische verklaring betreffende de
      huidige staat van de lichamelijke en geestelijke geschiktheid wordt overgelegd. De kosten hiervoor worden alleen
      dan gedragen door de houder van het patent indien het vermoeden gegrond blijkt te zijn;

      b. kan ze de geldigheid voor een bepaalde tijd opschorten. Deze mag de door de autoriteit die het patent heeft
      afgegeven vastgestelde datum van de nieuwe medische verklaring niet overschrijden. De CCR en de autoriteit die het
      patent heeft afgeven wordt daarbij in kennis gesteld van haar beslissing.

      3 In het geval bedoeld in het eerste lid, onderdeel a, moet het Rijnpatent bij de bevoegde autoriteit in bewaring
      worden gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0026045#Artikel2.19
      [ref2]: https://wetten.overheid.nl/BWBR0026045
    url: https://wetten.overheid.nl/BWBR0026045/2010-05-07#Artikel2.22
