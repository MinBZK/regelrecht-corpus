  - number: '1.05'
    text: |-
      Ingevolge dit reglement zijn te onderscheiden

      1 vier soorten Rijnpatenten:

      a. het grote patent voor het voeren van alle schepen,

      b. het kleine patent voor het voeren van een schip met een lengte van minder dan 35 m, mits het geen sleep- of
      duwboot is dan wel het niet voor het voortbewegen van een gekoppeld samenstel dient, of voor het voeren van een
      schip, dat bestemd is voor het vervoer van niet meer dan 12 passagiers,

      c. het sportpatent voor het voeren van een pleziervaartuig met een lengte van minder dan 25 m,

      d. het overheidspatent voor het voeren van overheidsschepen en van brandweerboten.

      De hiervoor aangehaalde patenten mogen eveneens worden gebruikt voor het voeren van een schip als bedoeld in
      [artikel 1.03, vierde lid][ref1].

      2 Een radarpatent voor de radarvaart.


      [ref1]: https://wetten.overheid.nl/BWBR0026045#Artikel1.03
