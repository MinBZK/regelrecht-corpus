  - number: '2.14'
    text: |-
      1 De gegadigde moet tijdens het examen voor de examencommissie aantonen dat hij

      a. beschikt over voldoende kennis van de voorschriften ter zake van het voeren van schepen en de voor het veilig
      voeren daarvan vereiste nautische en scheepstechnische kennis, beroepsvaardigheden en kennis van de grondbeginselen
      van het voorkomen van ongevallen; deze kennis wordt tijdens het examen overeenkomstig het examenprogramma bedoeld
      in de [bijlage D1][ref1] nagegaan;

      b. beschikt over de vereiste kennis, indien conform [artikel 2.05][ref2] van het betreffende riviergedeelte een
      dergelijk examen is vereist.

      2 Voor het verkrijgen van het grote patent en het kleine patent is een theoretisch examen, en voor het verkrijgen
      van het sportpatent en het overheidspatent een theoretisch en een praktisch examen vereist.

      3 Indien het examen niet wordt gehaald worden de redenen van afwijzing medegedeeld aan de gegadigde. De
      examencommissie kan aan het opnieuw deelnemen aan een examen verplichtingen of voorwaarden verbinden dan wel
      daarvoor vrijstellingen verlenen.


      [ref1]: https://wetten.overheid.nl/BWBR0026045
      [ref2]: https://wetten.overheid.nl/BWBR0026045#Artikel2.05
