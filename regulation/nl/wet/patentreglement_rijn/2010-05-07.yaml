        artikel: '1.03'
        hoofdstuk: '1'
  - number: '2.13'
    text: |-
      1 Na het overleggen van alle bijlagen bij de aanvraag conform [artikel 2.11, eerste tot en met vierde lid][ref1],
      wordt tot het examen voor het verkrijgen van een Rijnpatent toegelaten, degene die aan de eisen
      voldoet, conform [artikel 2.01][ref2], [2.02 met uitzondering van het derde lid, onder c][ref3] of
      [artikel 2.03 met uitzondering van het tweede lid, onder c][ref4]. Indien uit de medische verklaring slechts een
      beperkte geschiktheid blijkt, wordt de gegadigde toch tot het examen toegelaten. De bevoegde autoriteit kan in dit
      geval aan het patent voorwaarden verbinden, die bij afgifte in het patent worden aangetekend. Een afwijzing van
      de aanvraag moet met redenen worden omkleed. De bevoegde autoriteit kan voor een gegadigde, wiens uitreksel uit
      het strafregister of ander gelijkwaardig document niet voldoende is, bepalen dat deze vóór afloop van een bepaalde
      termijn niet tot een examen kan worden toegelaten (uitsluitingstermijn).

      2 Degene die een Rijnpatent met een ander riviergedeelte wil uitbreiden, wordt na het overleggen van alle bijlagen
      bij de aanvraag conform [artikel 2.11, eerste en vijfde lid][ref5], toegelaten.

      3 Degene die een Rijnpatent op een ander type Rijnpatent wil verkrijgen, wordt na het overleggen van alle bijlagen
      bij de aanvraag conform [artikel 2.11 eerste en zesde lid][ref6] toegelaten.

      4 Degene die een bewijs voor riviergedeelten wil verkrijgen of uitbreiden, wordt na het overleggen van alle
      bijlagen bij de aanvraag conform [artikel 2.12][ref7] voor het examen toegelaten.


