  - number: '1.04'
    text: |-
      1 Degene die op radar wil varen moet, naast het voor het te bevaren riviergedeelte benodigde schipperspatent,
      in het bezit zijn van een radarpatent dat in overeenstemming is met dit reglement of een ander door de CCR als
      gelijkwaardig erkend radardiploma. De lijst van de als gelijkwaardig erkende radardiploma’s alsmede de eventuele
      aanvullende voorwaarden voor deze erkenning zijn in de [bijlage C2][ref1] opgenomen.

      2 De bevoegde autoriteit kan, in afwijking van [artikel 3.04][ref2] voor het voeren van een veerpont binnen het
      gebied van zijn bevoegdheid een radarpatent onder voorwaarden afgeven, die rekening houden met de bijzonderheden
      van het traject waarop de veerpont vaart en waarvoor het radarpatent moet gelden.


      [ref1]: https://wetten.overheid.nl/BWBR0026045
