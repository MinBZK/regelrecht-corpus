  - number: '2.17'
    text: |-
      De bevoegde autoriteit geeft aan degene die het examen voor de riviergedeelten ingevolge
      [artikel 2.06, tweede lid][ref1], met goed gevolg heeft afgelegd een bewijs voor riviergedeelten af volgens het
      model van de [bijlage A3][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0026045#Artikel2.06
      [ref2]: https://wetten.overheid.nl/BWBR0026045
    url: https://wetten.overheid.nl/BWBR0026045/2010-05-07#Artikel2.17
    references:
