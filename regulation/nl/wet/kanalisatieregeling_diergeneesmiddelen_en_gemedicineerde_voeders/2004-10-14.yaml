  - number: 5b
    text: |-
      Als diergeneesmiddelen als bedoeld in [artikel 31, tweede lid, onderdeel e, van de wet](onbekend) worden aangewezen
      de diergeneesmiddelen, bedoeld in artikel 2, eerste lid.
    url: https://wetten.overheid.nl/BWBR0004033/2004-10-14#Artikel5b
  - number: '6'
    text: |-
      1 Deze regeling treedt in werking met ingang van het tijdstip waarop [artikel 29 van de wet][ref1] in werking
      treedt met uitzondering van [artikel 4][ref2], hetwelk in werking treedt met ingang van het tijdstip waarop
      [artikel 35 van de wet][ref3] in werking treedt.

      2 Deze regeling kan worden aangehaald als ‘Kanalisatieregeling diergeneesmiddelen en -gemedicineerde voeders’.


