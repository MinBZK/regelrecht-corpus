  - number: '2'
    text: |-
      1 Als diergeneesmiddelen bedoeld in [artikel 29, eerste lid, van de wet][ref1], waarop de bepalingen van
      [hoofdstuk IV van de wet][ref2] van toepassing zijn worden aangewezen:

      a. antimicrobiële diergeneesmiddelen;

      b. resistentie-inducerende diergeneesmiddelen;

      c. hormoonpreparaten;

      d. sera en entstoffen en biologische diagnostica;

      e. diergeneesmiddelen die kunnen worden toegediend door middel van injectie of implantatie, tenzij uitsluitend
      subcutane, intramusculaire of intramammaire toediening is toegestaan;

      f. diergeneesmiddelen bestemd voor algehele verdoving, alsmede per injectie toe te dienen middelen voor
      plaatselijke verdoving;

      g. spierrelaxantia;

      h. de diergeneesmiddelen, genoemd in [bijlage I][ref3], bij deze regeling;

      i. diergeneesmiddelen, die een werkzaam bestanddeel bevatten dat niet gedurende ten minste 5 jaar in een
      geregistreerd diergeneesmiddel of in een onder de [Vrijstellingsregeling ectoparasiticiden][ref4] vallend
      ectoparasiticum is verwerkt.

      2 De in het eerste lid, onderdeel a tot en met g gegeven aanwijzing is niet van toepassing op de diergeneesmiddelen
      die zijn genoemd in [bijlage II][ref5] bij deze regeling.


