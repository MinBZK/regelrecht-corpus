  - number: '3'
    text: |-
      1 Van de diergeneesmiddelen bedoeld in [artikel 2][ref1] die ingevolge [artikel 30, vierde lid, van de wet][ref2],
      niet aan apothekers of houders van dieren mogen worden afgeleverd worden aangewezen:

      a. hormoonpreparaten met een gestagene, oestrogene of androgene werking;

      b. sera, entstoffen en biologische diagnostica;

      c. diergeneesmiddelen die kunnen worden toegediend door middel van injectie of implantatie, tenzij uitsluitend
      subcutane, intramusculaire of intramammaire toediening is toegestaan;

      d. diergeneesmiddelen voor algehele verdoving, alsmede per injectie toe te dienen middelen voor plaatselijke
      verdoving;

      e. spierrelaxantia;

      f. diergeneesmiddelen genoemd in [bijlage III][ref3] bij de regeling.

      2 De in het eerste lid, onderdeel a tot en met e, gegeven aanwijzing is niet van toepassing op de
      diergeneesmiddelen, die zijn genoemd in [bijlage IV][ref4] bij deze regeling.

      3 De aanwijzing van entstoffen, bedoeld in het eerste lid, onderdeel b, is niet van toepassing op een entstof
      die is bestemd om te worden toegepast bij varkens ter voorkoming van influenza, vlekziekte, porcine reproductive
      and respiratory syndrome, atrofische rhinitis of een besmetting met escherichia coli, clostridium perfringens,
      mycoplasma hyopneumoniae, actinobacillus pleuropneumoniae, parvovirus of rotavirus, voorzover:

      a. de entstof aan een houder van varkens wordt afgeleverd:

      1°. door een dierenarts op grond van een overeenkomst tot begeleiding bij het gebruik van entstoffen, of

      2°. door een apotheker op recept van een dierenarts die een overeenkomst als bedoeld onder 1° met de houder heeft
      gesloten, en

      b. is voldaan aan elk van de voorwaarden, opgenomen in de [punten 2 tot en met 5 van bijlage V][ref5] bij deze
      regeling.


