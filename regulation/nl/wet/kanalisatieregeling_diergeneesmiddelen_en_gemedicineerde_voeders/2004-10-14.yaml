preamble:
  text: |-
    Gelet op de artikelen 29, eerste lid, 30, tweede en vierde lid, artikel 31, eerste lid en 35, tweede lid, van de
    Diergeneesmiddelenwet (Stb. 1985, 410);

    Gehoord de Koninklijke Nederlandse Maatschappij voor Diergeneeskunde, het Landbouwschap, het Produktschap voor
    Vee en Vlees, het Produktschap voor Pluimvee en Eieren, het Produktschap voor Veevoeder, de Fidin, de Nefato, de
    Dibevo, de Fagrovet en de Nederlandse Vereniging voor Dierverloskundigen en Castreurs;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0004033/2004-10-14#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Voor de toepassing van deze regeling wordt verstaan onder:




                *wet:*


                [Diergeneesmiddelenwet][ref1] (Stb. 1985, 410);




                *antimicrobiële diergeneesmiddelen:*


                diergeneesmiddelen, niet zijnde sera of entstoffen, die substanties bevatten die al dan niet na
      omzetting, in staat zijn in een dier de vermeerdering van micro-organismen of virussen te verhinderen bij een
      concentratie van 10 microgram/ml of lager, of die in staat zijn de groei van een cultuur van micro-organismen of
      virussen tegen te gaan bij een concentratie van 5 microgram/ml of lager;




                *resistentie-inducerende diergeneesmiddelen:*


                diergeneesmiddelen die een blijvende resistentie induceren bij voordien voor dat diergeneesmiddel
      gevoelige pathogene micro-organismen, virussen of inwendige parasieten;




                *hormoonpreparaten:*


                diergeneesmiddelen die geheel of gedeeltelijk bestaan uit een of meer substanties die in een dier een
      fysiologisch gelijksoortige of tegengestelde werking uitoefenen als een of meer natuurlijke hormonen of die bestemd
      zijn om de werking van hormonen of endocriene organen rechtstreeks te beïnvloeden;




                *middelen voor verdoving:*


                middelen die het dier ongevoelig maken voor pijnprikkels, zodanig dat een operatie kan worden uitgevoerd;




                *ectoparasiticum:*


                middel dat door uitwendige toepassing op dieren dient tot bestrijding of afwering van op dieren
      voorkomende insekten of mijten.




      2 Deze regeling berust op de [artikelen 29, eerste lid][ref2], [30, tweede en vierde lid][ref3],
      [31, eerste en tweede lid][ref4], en [35, tweede lid, van de Diergeneesmiddelenwet][ref5].


