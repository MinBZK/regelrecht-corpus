  - number: 5a
    text: |-
      Als diergeneeskundige instellingen, onderscheidenlijk instellingen van wetenschap of onderzoek als bedoeld in de
      [artikelen 30, tweede lid, onderdeel e][ref1], en [31, tweede lid, onderdeel e, van de wet][ref2] worden aangewezen
      de in [bijlage VI][ref3] bij de regeling opgenomen instellingen.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel30
