preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten: Alzo Wij in overweging genomen hebben, dat het
    ter bescherming van de belangen van Nederland als kuststaat, alsook met het oog op de toepassing van het op 29
    november 1969 te Brussel tot stand gekomen Verdrag inzake optreden in volle zee bij ongevallen die verontreiniging
    door olie kunnen veroorzaken (met Bijlage) (Trb. 1970, 197) en van het op 2 november 1973 te Londen tot stand
    gekomen Protocol inzake optreden in volle zee bij ongevallen die verontreiniging door andere stoffen dan olie
    kunnen veroorzaken (Trb. 1977, 162), wenselijk is aanvullende regelen te stellen met betrekking tot het voorkomen,
    beperken of ongedaan maken van schadelijke gevolgen van ongevallen op de Noordzee;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0005444/2004-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. Onze Minister: Onze Minister van Verkeer en Waterstaat;

      b. schip: elke zaak, geen luchtvaartuig zijnde, die blijkens zijn constructie bestemd is om te drijven en drijft of
      heeft gedreven;

      c. kapitein: degene die het gezag heeft over het schip;

      d. ongeval: een aanvaring, een stranding of een ander incident met een schip bij de navigatie, dan wel een ander
      voorval aan boord van het schip of daarbuiten, dat materiële schade aan het schip of aan zaken aan boord daarvan
      veroorzaakt of dreigt te veroorzaken.

      2 Indien het schip toebehoort aan een rederij die een boekhouder heeft aangesteld, of indien er sprake is van
      rompbevrachting, treedt de boekhouder, onderscheidenlijk de rompbevrachter voor de toepassing van deze wet en de
      daarop berustende bepalingen in de plaats van de scheepseigenaar.

      3 Voor de toepassing van deze wet en de daarop berustende bepalingen wordt onder het verlenen van hulp aan een
      schip mede verstaan het verlenen van hulp aan zaken die zich aan boord daarvan bevinden of aan van dat schip
      afkomstige driftige, of gezonken zaken.

      4 Onverminderd het bepaalde in het zesde lid, is het bij of krachtens deze wet ten aanzien van een schip bepaalde
      van overeenkomstige toepassing op:

      a. elke installatie;

      b. elke andere zaak in drijvende of gezonken staat.

      5 Het bij of krachtens deze wet ten aanzien van de kapitein bepaalde is van overeenkomstige toepassing op degene
      die ter plaatse de leiding of het opzicht heeft over een installatie of een andere zaak, bedoeld in het vierde lid.

      6 Van de toepassing van deze wet en de daarop berustende bepalingen zijn uitgezonderd:

      a. mijnbouwinstallaties als bedoeld in [artikel 1 van het Mijnreglement continentaal plat][ref1] (*Stb.* 1983, 83)
      en [artikel 1 van het Mijnreglement 1964][ref2] (*Stb.* 538);

      b. installaties of schepen, die tot opsporing of winning van delfstoffen in gebruik zijn op een ander dan het
      Nederlandse deel van het continentaal plat.


      [ref1]: https://wetten.overheid.nl/BWBR0002564#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002474#Artikel1
