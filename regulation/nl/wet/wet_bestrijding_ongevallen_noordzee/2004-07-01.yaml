  - number: '13'
    text: |-
      1 Indien een persoon, nadat een ongeval heeft plaatsgevonden, hulp heeft verleend aan het desbetreffende
      schip en als gevolg van aanwijzingen, gegeven ingevolge [artikel 5][ref1], of maatregelen, genomen ingevolge
      [artikel 6][ref2] bij de hulpverlening schade heeft geleden die hij niet kan verhalen op de eigenaar van dat schip
      of de rechthebbende op de zaken als bedoeld in [artikel 1, derde lid][ref3], dan wel op een andere persoon, kent
      Onze Minister de hulpverlener op diens verzoek een billijke tegemoetkoming in die schade toe.

      2 Een tegemoetkoming als bedoeld in het eerste lid wordt geweigerd of kan slechts gedeeltelijk worden toegekend,
      indien de door de hulpverlener geleden schade geheel respectievelijk gedeeltelijk is te wijten aan diens schuld of
      de schuld van degenen voor wie hij aansprakelijk is.

      3 Onze Minister neemt bij de toepassing van het eerste lid bij de bepaling van de door de hulpverlener geleden
      schade in het bijzonder in aanmerking:

      a. de bij de hulpverlening gemaakte kosten;

      b. het verlies of de beschadiging van het bij de hulpverlening ingezet materieel of gebruikte materialen;

      c. de bij de hulpverlening gelopen risico's;

      d. het gederfde hulploon.


