  - number: '12'
    text: |-
      Indien, nadat een ongeval heeft plaatsgevonden, het desbetreffende schip ingevolge
      [artikel 6, tweede lid, onderdeel ][ref1], naar een Nederlandse haven, in beheer bij het Rijk of een ander openbaar
      lichaam, wordt gebracht, vergoedt het Rijk de redelijke kosten van die maatregelen van het daartoe bevoegde gezag,
      die redelijkerwijs noodzakelijk zijn om het gevaar verbonden aan het brengen van het schip naar en het verblijf in
      de haven, te voorkomen, te beperken of ongedaan te maken.


      [ref1]: https://wetten.overheid.nl/BWBR0005444#Artikel6
