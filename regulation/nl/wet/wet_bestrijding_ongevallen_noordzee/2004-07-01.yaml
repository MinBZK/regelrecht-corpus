  - number: '2'
    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt onder de Noordzee verstaan de Nederlandse territoriale zee,
      alsmede het gedeelte van de volle zee dat daarop aansluit en zich uitstrekt in het noorden tot de breedtegraad van
      56° noorderbreedte, en in het zuiden tot de breedtegraad van 51°10' noorderbreedte.

      2 Voor de toepassingen van het bepaalde in deze wet en de daarop berustende bepalingen wordt onder de Nederlandse
      territoriale zee mede verstaan het gedeelte van de Westerschelde, dat is gelegen tussen de territoriale zee en de
      lengtegraad van 3°35' oosterlengte.
    url: https://wetten.overheid.nl/BWBR0005444/2004-07-01#Artikel2
  - number: '3'
    text: |-
      1 In deze wet en de daarop berustende bepalingen worden onder schadelijke gevolgen van een ongeval begrepen:

      a. een ernstig en dreigend gevaar vanuit de Noordzee voor de Nederlandse kust of voor daarmee samenhangende
      belangen van Nederland door verontreiniging of dreigende verontreiniging, welk gevaar ontstaat als gevolg van
      een ongeval of van daarmee verband houdende handelingen waarvan redelijkerwijs kan worden aangenomen dat zij zeer
      ernstige schade tot gevolg zullen hebben;

      b. een ernstige belemmering van de scheepvaart in de Nederlandse territoriale zee, die ontstaat of dreigt te
      ontstaan als gevolg van een ongeval of van daarmee verband houdende handelingen, waarbij het schip niet is
      gestrand, gezonken of aan de grond geraakt;

      c. een ernstige schade vanuit de Noordzee aan:

      1°. zeeweringen aan de Nederlandse kust, of

      2°. andere waterstaatswerken die in de Nederlandse territoriale zee zijn gelegen of installaties die zijn opgericht
      op de bodem van de Nederlandse territoriale zee,

      die ontstaat of dreigt te ontstaan als gevolg van een ongeval of daarmee verband houdende handelingen, waarbij het
      schip niet is vastgeraakt op of in een zeewering of een ander waterstaatswerk, als bedoeld onder 1° en 2°.

      2 In het eerste lid, onderdeel *a*, worden onder "daarmee samenhangende belangen van Nederland" verstaan de
      belangen van Nederland als kuststaat, die door schadelijke gevolgen van een ongeval als bedoeld in die bepaling,
      rechtstreeks worden getroffen of bedreigd, zoals:

      a. maritieme bedrijvigheid op of voor de kust, in een haven of zeearm, met inbegrip van de visserij die een
      hoofdmiddel van bestaan vormt voor de betrokken personen;

      b. toeristische attracties in het betrokken gebied;

      c. de gezondheid van de kustbevolking en het welzijn van het betrokken gebied, met inbegrip van het behoud van de
      levende rijkdommen van de zee en van de in het wild levende dieren.
    url: https://wetten.overheid.nl/BWBR0005444/2004-07-01#Artikel3
  - number: '4'
    text: |-
      1 Indien zich een ongeval heeft voorgedaan ten gevolge waarvan schadelijke gevolgen ontstaan of, naar
      redelijkerwijs is te voorzien, zullen ontstaan en het desbetreffende schip zich in de Nederlandse territoriale zee
      bevindt, dient de kapitein van dat ongeval zo spoedig mogelijk melding te maken aan een daartoe door Onze Minister
      aangewezen instantie.

      2 In een situatie als bedoeld in het eerste lid is de kapitein van het desbetreffende schip verder verplicht om
      alle in verband met het ongeval gevraagde gegevens terstond te verstrekken en om desgevraagd terstond mededeling te
      doen van alle maatregelen die vanwege het schip in verband met het ongeval zijn genomen.

      3 Indien zich een ongeval heeft voorgedaan ten gevolge waarvan schadelijke gevolgen als bedoeld in
      [artikel 3, eerste lid, onderdeel ][ref1], ontstaan of, naar redelijkerwijs is te voorzien, zullen ontstaan, zijn
      het eerste en tweede lid ook van toepassing als het desbetreffende schip zich buiten de Nederlandse territoriale
      zee in de Noordzee bevindt.

      4 Bij ministeriële regeling worden regels gesteld met betrekking tot de inhoud van de melding en van de te
      verstrekken informatie, en de wijze waarop de melding geschiedt en de informatie wordt verstrekt.

      5 Indien de kapitein in een situatie als bedoeld in het eerste lid van het ongeval
      melding heeft gemaakt overeenkomstig de daartoe geregelde verplichtingen in en krachtens
      [artikel 12 van de Wet voorkoming verontreiniging door schepen][ref2] (*Stb.* 1983, 683), geldt de in het eerste
      lid bedoelde verplichting niet.


      [ref1]: https://wetten.overheid.nl/BWBR0005444#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003642#Artikel12
