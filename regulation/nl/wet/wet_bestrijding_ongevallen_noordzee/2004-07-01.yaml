  - number: '9'
    text: |-
      1 Indien zich schadelijke gevolgen van een ongeval voordoen die van invloed zijn voor het gebied van een gemeente,
      verstrekt Onze Minister de nodige inlichtingen aan de burgemeester en de commissaris van de Koning.

      2 Indien de tenuitvoerlegging van de ingevolge [artikel 5][ref1] gegeven aanwijzingen of de uitvoering van de
      ingevolge [artikel 6][ref2] genomen maatregelen van invloed zal zijn voor het gebied van de gemeente, dient over de
      gevolgen van de aanwijzingen of maatregelen vooraf overleg te worden gevoerd met de burgemeester, tenzij zich een
      situatie voordoet die onmiddellijk ingrijpen noodzakelijk maakt. In dat geval wordt dit overleg zo spoedig mogelijk
      gevoerd. Onze Minister verstrekt de commissaris van de Koning de nodige inlichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0005444#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005444#Artikel6
