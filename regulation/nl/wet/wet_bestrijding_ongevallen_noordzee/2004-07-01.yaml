  - number: '6'
    text: |-
      1 Indien naar het oordeel van Onze Minister en Onze Ministers wie het mede aangaat door het geven van aanwijzingen
      ingevolge [artikel 5][ref1] niet kan worden bereikt of niet wordt bereikt, dat schadelijke gevolgen van het ongeval
      worden voorkomen, in voldoende mate worden beperkt, of ongedaan worden gemaakt, kan Onze Minister maatregelen nemen
      tot het voorkomen, beperken of ongedaan maken van schadelijke gevolgen van het ongeval.

      2 De in het eerste lid bedoelde maatregelen kunnen inhouden:

      a. het verrichten van datgene, met betrekking waartoe ingevolge [artikel 5][ref2] aanwijzingen kunnen worden
      gegeven;

      b. het verrichten van onderzoek naar de toestand van het schip en de aard en de toestand van de zaken die zich aan
      boord daarvan bevinden;

      c. het overnemen van het gezag over het schip;

      d. het brengen van het schip naar een Nederlandse haven, in beheer bij het Rijk of een andere openbaar
      lichaam, indien het schip een ongeval is overkomen dat schadelijke gevolgen heeft als bedoeld in
      [artikel 3, eerste lid, onderdeel ][ref3].

      3 Bij een maatregel als bedoeld in het tweede lid, onderdeel *d*, kunnen aan de kapitein of de scheepseigenaar
      met betrekking tot de toegang van het schip tot of het verblijf van het schip in de haven beperkende voorschriften
      worden opgelegd in het belang van de openbare veiligheid van het gebied waarin de haven is gelegen.

      4 Ten aanzien van de in het eerste en tweede lid bedoelde maatregelen is
      [artikel 5, vierde, vijfde en zesde lid][ref4], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005444#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005444#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005444#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0005444#Artikel5
