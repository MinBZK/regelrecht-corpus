  - number: '14'
    text: |-
      1 De hulpverlener kan tegen een beschikking van Onze Minister, genomen op een verzoek om een tegemoetkoming als
      bedoeld in [artikel 13, eerste lid][ref1], binnen zes weken na de bekendmaking beroep instellen bij de rechtbank
      te Rotterdam.

      2 Het beroep wordt ingesteld door indiening van een verzoekschrift bij de rechtbank te Rotterdam.


      [ref1]: https://wetten.overheid.nl/BWBR0005444#Artikel13
    url: https://wetten.overheid.nl/BWBR0005444/2004-07-01#Artikel14
