    text: |-
      1 Indien, nadat een ongeval heeft plaatsgevonden, Onze Minister ingevolge [artikel 6, tweede lid, onderdeel ][ref1],
      het desbetreffende schip naar een Nederlandse haven, in beheer bij het Rijk of een ander openbaar lichaam, doet
      brengen, dient het daartoe bevoegde gezag het schip in de aangewezen haven toe te laten.

      2 De in het eerste lid bedoelde maatregel mag slechts worden genomen na overleg met het in het eerste lid bedoelde
      gezag.


      [ref1]: https://wetten.overheid.nl/BWBR0005444#Artikel6
