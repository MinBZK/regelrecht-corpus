  - number: '5'
    text: |-
      1 Indien een ongeval heeft plaatsgevonden en naar het oordeel van Onze Minister en Onze Ministers wie het mede
      aangaat door de maatregelen van de kapitein of de scheepseigenaar schadelijke gevolgen van het ongeval niet
      worden voorkomen, niet in voldoende mate worden beperkt, of niet ongedaan worden gemaakt, kan Onze Minister aan de
      kapitein, de scheepseigenaar en degenen die hulp verlenen aan het desbetreffende schip aanwijzingen geven tot het
      voorkomen, beperken of ongedaan maken van de schadelijke gevolgen van het ongeval.

      2 De aan de kapitein en de scheepseigenaar te geven aanwijzingen kunnen betrekking hebben op:

      a. de aanwezigheid van het schip en de zaken die zich aan boord daarvan bevinden op een bepaalde plaats of in een
      bepaald gebied;

      b. het verplaatsen van het schip en de zaken die zich aan boord daarvan bevinden van of naar een bepaalde plaats of
      een bepaald gebied;

      c. het verlenen van hulp aan het schip;

      d. het aan de grond zetten, tot zinken brengen of vernietigen van het schip alsmede het onschadelijk maken,
      verwijderen, overboord zetten, tot zinken brengen of vernietigen van de zaken die zich aan boord van het schip
      bevinden op een bepaalde plaats of in een bepaald gebied.

      3 Aanwijzingen aan degenen die hulp verlenen aan het schip kunnen slechts een verbod tot het uitvoeren van
      overeengekomen hulpverlening of tot het voortzetten van reeds aangevangen hulpverlening inhouden.

      4 Aanwijzingen moeten evenredig zijn aan de schadelijke gevolgen van het ongeval en mogen niet verder gaan dan
      redelijkerwijs noodzakelijk is om die schadelijke gevolgen te voorkomen, te beperken of ongedaan te maken.

      5 Aanwijzingen tot het voorkomen, beperken of ongedaan maken van schadelijke gevolgen als bedoeld in
      [artikel 3, eerste lid, onderdeel ][ref1], mogen worden gegeven wanneer het desbetreffende schip zich op de
      Noordzee bevindt.

      6 Aanwijzingen tot het voorkomen, beperken of ongedaan maken van schadelijke gevolgen van het ongeval, bedoeld in
      [artikel 3, eerste lid, onderdeel ][ref2], mogen alleen worden gegeven, wanneer het desbetreffende schip zich in de
      Nederlandse territoriale zee bevindt.


      [ref1]: https://wetten.overheid.nl/BWBR0005444#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005444#Artikel3
