      - id: ref2
        bwb_id: BWBR0005444
        artikel: '3'
        hoofdstuk: '1'
  - number: '19'
    text: De toepasselijkheid van deze wet wordt beperkt door de in het volkenrecht erkende uitzonderingen.
    url: https://wetten.overheid.nl/BWBR0005444/2004-07-01#Artikel19
  - number: '20'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0005444/2004-07-01#Artikel20
  - number: '21'
    text: 'Deze wet kan worden aangehaald als: Wet bestrijding ongevallen Noordzee.'
    url: https://wetten.overheid.nl/BWBR0005444/2004-07-01#Artikel21
