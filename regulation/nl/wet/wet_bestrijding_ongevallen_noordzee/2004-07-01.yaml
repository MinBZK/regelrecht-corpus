  - number: '7'
    text: |-
      1 Onze Minister oefent zijn bevoegdheid om op grond van [artikel 5][ref1] aanwijzingen te geven of om op grond van
      [artikel 6][ref2] maatregelen te nemen niet uit dan na overleg met de scheepseigenaar en, indien hulpverlening is
      aangevangen of overeengekomen, na overleg met de hulpverlener, tenzij zich een situatie voordoet die onmiddellijk
      ingrijpen noodzakelijk maakt.

      2 Onze Minister oefent zijn bevoegdheid om op grond van [artikel 5][ref3] aanwijzingen te geven of om op grond van
      [artikel 6][ref4] maatregelen te nemen niet uit ten aanzien van een schip onder buitenlandse vlag dan nadat met de
      vlaggestaat overleg is gepleegd, tenzij zich een situatie voordoet die onmiddellijk ingrijpen noodzakelijk maakt.


