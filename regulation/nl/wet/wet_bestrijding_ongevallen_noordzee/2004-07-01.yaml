  - number: '15'
    text: |-
      De kapitein of de scheepseigenaar neemt, nadat een ongeval heeft plaatsgevonden, de nodige maatregelen om
      schadelijke gevolgen van het ongeval als bedoeld in [artikel 3, eerste lid][ref1], te voorkomen, te beperken of
      ongedaan te maken.


      [ref1]: https://wetten.overheid.nl/BWBR0005444#Artikel3
    url: https://wetten.overheid.nl/BWBR0005444/2004-07-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005444
        artikel: '3'
        hoofdstuk: '1'
  - number: '17'
    text: |-
      1 Deze wet is niet van toepassing op buitenlandse oorlogsschepen en buitenlandse militaire luchtvaartuigen, alsmede
      buitenlandse schepen of buitenlandse luchtvaartuigen, die eigendom zijn van of in beheer zijn bij een Staat ten
      tijde dat zij uitsluitend worden gebruikt in dienst van de overheid voor andere dan handelsdoeleinden.

      2 Deze wet is, behoudens het bepaalde in het derde lid van dit artikel, niet van toepassing op Nederlandse
      oorlogsschepen en Nederlandse militaire luchtvaartuigen.

      3 Onze Minister van Defensie treft na overleg met Onze Minister en Onze Ministers wie het mede aangaat ten aanzien
      van Nederlandse oorlogsschepen en Nederlandse militaire luchtvaartuigen de maatregelen die zijn geboden om de
      schadelijke gevolgen van ongevallen met deze schepen of luchtvaartuigen te voorkomen, te beperken of ongedaan te
      maken.
    url: https://wetten.overheid.nl/BWBR0005444/2004-07-01#Artikel17
  - number: '18'
    text: |-
      De [Wrakkenwet][ref1] (*Stb.* 1934, 401) is niet van toepassing in de Nederlandse territoriale zee met betrekking
      tot een ongeval dat schadelijke gevolgen heeft als bedoeld in [artikel 3, eerste lid, onderdeel ][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001963
      [ref2]: https://wetten.overheid.nl/BWBR0005444#Artikel3
