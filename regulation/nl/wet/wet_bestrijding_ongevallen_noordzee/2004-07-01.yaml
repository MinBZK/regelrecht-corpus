  - number: '11'
    text: |-
      1 Ten behoeve van de goede uitvoering van de [artikelen 5][ref1], [6][ref2] en [8][ref3] worden bij koninklijk
      besluit regels gesteld inzake de organisatie en de coördinatie van de bestrijding van schadelijke gevolgen van
      ongevallen.

      2 Met het toezicht op de naleving van de aanwijzingen, gegeven krachtens [artikel 5][ref4], zijn belast de bij
      besluit van Onze Minister aangewezen ambtenaren. Zij zijn tevens belast met het uitvoeren van maatregelen, genomen
      krachtens [artikel 6][ref5].

      3 De krachtens het tweede lid aangewezen ambtenaren zijn bevoegd een schip te betreden, voor zover dat
      redelijkerwijs nodig is voor de uitoefening van de in het tweede lid bedoelde taken.

      4 Zij gebruiken zo nodig de hulp van de sterke arm voor het betreden van het schip en voor het aan boord uitvoeren
      van maatregelen, genomen ingevolge [artikel 6][ref6].

      5 Bij toepassing van het derde lid legitimeren de daarin bedoelde ambtenaren zich desgevraagd en doen zij
      mededeling van het doel van het betreden van het schip.

      6 De krachtens het tweede lid aangewezen ambtenaren kunnen zich bij toepassing van het derde lid door bepaalde door
      hen aan te wijzen personen doen vergezellen.


