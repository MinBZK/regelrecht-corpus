    text: |-
      Een herziening als bedoeld in het tweede lid de onderdelen a, b, c, voor zover het betreft de vorm van de
      studiefinanciering, e of f, kan, behoudens het geval van bedrog, slechts geschieden binnen 5 jaren na het einde
      van het desbetreffende studiefinancieringstijdvak, het kalenderjaar waarvoor de termijn is vastgesteld of het
      kalenderjaar waarvoor de draagkracht van de debiteur is vastgesteld. Behoudens in geval van bedrog, kan een
      herziening als bedoeld in het tweede lid onder c, voor zover het betreft de hoogte van de veronderstelde ouderlijke
      bijdrage, slechts geschieden binnen 3 jaren na het einde van het desbetreffende studiefinancieringstijdvak.
      Behoudens in geval van bedrog, kan een herziening anders dan bedoeld in de eerste en tweede volzin, slechts
      geschieden binnen 18 maanden na het einde van het desbetreffende studiefinancieringstijdvak, het kalenderjaar
      waarvoor de termijn is vastgesteld of het kalenderjaar waarvoor de draagkracht van de debiteur is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel7.1
  - number: 7.1.4
    text: |-
      Het eerste lid is niet van toepassing op een beschikking waarbij de vorm van de studiefinanciering op grond van
      [artikel 10.7, zevende lid][ref1], onvoorwaardelijk is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel10
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel7.1
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '10'
        hoofdstuk: '10'
  - number: '7.3'
    text: |-
      De [artikelen 7:2 tot en met 7:9 van de Algemene wet bestuursrecht][ref1] zijn niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel7.3
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: 7.4.1
    text: |-
      Indien een herzieningsbeschikking als bedoeld in [artikel 7.1, eerste en tweede lid][ref1], of een beslissing op
      bezwaar daartoe aanleiding geeft, wordt het bedrag van de basisbeurs of aanvullende beurs dat teveel is uitbetaald,
      door de betrokkene terugbetaald of met hem verrekend. Tevens vindt verrekening plaats van de bedragen, bedoeld in
      de [artikelen 3.27, tweede lid][ref2], en [3.29, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011453#Artikel3
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel7.4
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '7'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0011453
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.7'
      - id: ref3
        bwb_id: BWBR0011453
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.7'
  - number: 7.4.2
    text: |-
      Indien een herzieningsbeschikking als bedoeld in [artikel 7.1, eerste en tweede lid][ref1], of een beslissing
      op bezwaar daartoe aanleiding geeft, wordt voor zover het bedrag waarvoor het recht om een lening af te sluiten
      te hoog is toegekend, het deel dat te hoog is toegekend en uitbetaald door de betrokkene terugbetaald of met hem
      verrekend.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel7
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel7.4
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '7'
        hoofdstuk: '7'
  - number: 7.4.3
    text: |-
      Indien een herzieningsbeschikking als bedoeld in
      [artikel 7.1 van de Wet tegemoetkoming onderwijsbijdrage en schoolkosten][ref1], of een beslissing op bezwaar
      daartoe aanleiding geeft, wordt het bedrag aan tegemoetkoming dat teveel is uitbetaald, door de betrokkene
      terugbetaald of met hem verrekend.


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Artikel7
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel7.4
    references:
      - id: ref1
        bwb_id: BWBR0012438
        artikel: '7'
  - number: 7.4.4
    text: |-
      Indien na een voorlopige voorziening als bedoeld in [titel 8.3 van de Algemene wet bestuursrecht][ref1], de
      beslissing in hoofdzaak daartoe aanleiding geeft, wordt het bedrag dat op grond van de voorlopige voorziening
      teveel is uitbetaald, door de betrokkene terugbetaald of met hem verrekend.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel7.4
    references:
      - id: ref1
        bwb_id: BWBR0005537
  - number: 7.4.5
    text: |-
      De in het eerste tot en met vierde lid bedoelde terugbetaling, voor zover [artikel 6.17][ref1] niet van
      toepassing is, en verrekening geschieden overeenkomstig bij ministeriële regeling vast te stellen redelijke
      terugbetalingsregels.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel6
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel7.4
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 7.4.7
    text: |-
      [Artikel 4:93, vierde lid, van de Algemene wet bestuursrecht][ref1] is niet van toepassing op deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel7.4
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 8.1.1
    text: |-
      Met betrekking tot de uitbetaling van de studiefinanciering en de verrekening van het toegekende bedrag aan
      studiefinanciering met de aan Onze Minister verschuldigde onderwijsbijdrage, worden bij algemene maatregel van
      bestuur regelen gesteld.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel8.1
  - number: 8.1.2
    text: |-
      Indien een toegekend bedrag aan studiefinanciering 12 maanden na het einde van het kalenderjaar waarin de
      desbetreffende beschikking is gegeven, niet kan worden uitbetaald als gevolg van nalatigheid van degene aan wie
      die beschikking is gericht, verrekent Onze Minister het toegekende bedrag aan studiefinanciering met het niet
      uitbetaalde bedrag.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel8.1
  - number: 8.1.3
    text: |-
      De studerende kan bij Onze Minister een aanvraag indienen een lager maandbedrag aan lening aan hem uit te betalen
      dan het maandbedrag aan lening dat aan hem is toegekend of hem een bedrag van € 0,00 toe te kennen. De in de vorige
      volzin bedoelde aanvraag kan geen betrekking hebben op een periode die gelegen is voor de datum van indiening van
      de aanvraag. Door zijn aanvraag doet de studerende afstand van zijn recht om het bedrag van de verlaging van de
      lening alsnog te lenen. Indien aan de studerende een bedrag van € 0,00 wordt toegekend, geldt hij voor de periode
      waarop die toekenning betrekking heeft, als studiefinancieringsgenietende.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel8.1
  - number: '8.2'
    text: |-
      In het studiejaar waarin een deelnemer de leeftijd van 18 jaren bereikt, wordt de tegemoetkoming in de
      onderwijsbijdrage, bedoeld in [artikel 3.2, derde lid, onderdeel a][ref1], voor dat studiejaar niet toegekend. De
      eerste volzin is tevens van toepassing op een deelnemer die in de periode na 1 juli voorafgaand aan het betreffende
      studiejaar de leeftijd van 18 jaren bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel3
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel8.2
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '8.3'
    text: |-
      Onze Minister vaardigt een dwangbevel uit aan de nalatige, indien een bij of krachtens deze wet verschuldigd bedrag
      geheel of gedeeltelijk niet tijdig is voldaan.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel8.3
  - number: '9.1'
    text: |-
      Het toezicht door de inspectie, bedoeld in de [Wet op het onderwijstoezicht][ref1], heeft mede betrekking
      op de vraag of de instelling of de opleiding voldoet aan de van toepassing zijnde voorwaarden, bedoeld in de
      [artikelen 2.5, eerste lid][ref2], [2.13, onderdeel c][ref3], en [4.5][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0013800
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0011453#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0011453#Artikel4
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel9.1
    references:
      - id: ref1
        bwb_id: BWBR0013800
      - id: ref2
        bwb_id: BWBR0011453
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref3
        bwb_id: BWBR0011453
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref4
        bwb_id: BWBR0011453
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.1.1
        afdeling: '4.1'
  - number: 9.2.1
    text: |-
      Een ieder is verplicht aan Onze Minister of aan een daartoe door of vanwege Onze Minister aangewezen persoon of
      instantie desgevraagd de ten behoeve van de uitvoering van deze wet benodigde inlichtingen over zichzelf te geven.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel9.2
  - number: 9.2.2
    text: |-
      De inlichtingen worden verstrekt binnen een door Onze Minister of door een in het eerste lid bedoelde persoon of
      instantie te stellen redelijke termijn.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel9.2
  - number: 9.2.3
    text: |-
      Inlichtingen over zichzelf, voor zover zij kunnen leiden tot de toekenning van minder studiefinanciering of tot
      verhoging van het bedrag van de terugbetalingstermijn worden steeds ongevraagd en schriftelijk verstrekt door de
      studerende onderscheidenlijk door de debiteur, onmiddellijk na het bekend worden van die gegevens.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel9.2
  - number: 9.2.4
    text: |-
      Onze Minister kan bepalen dat de inlichtingen, bedoeld in het eerste tot en met het derde lid, worden verstrekt op
      een bij ministeriële regeling vast te stellen wijze.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel9.2
  - number: '9.3'
    text: |-
      Een studentendecaan aan een op grond van de [WHW][ref1] uit 's Rijks kas bekostigde instelling voor hoger onderwijs
      kan zich verschonen betreffende hetgeen een studerende aan hem heeft toevertrouwd:


      [ref1]: https://wetten.overheid.nl/BWBR0005682
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel9.3
    references:
      - id: ref1
        bwb_id: BWBR0005682
  - number: 9.3.a
    text: |-
      in afwijking van [artikel 5:17 van de Algemene wet bestuursrecht][ref1] bij de verplichting tot inzage van gegevens
      en bescheiden en het verstrekken van inlichtingen, en


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel9.3
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 9.3.b
    text: |-
      in afwijking van [artikel 8:33, eerste lid, van de Algemene wet bestuursrecht][ref1] bij de behandeling van een
      beroep of hoger beroep tegen een besluit, genomen op grond van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel9.3
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 9.5.1
    text: |-
      De natuurlijke persoon van wie of het bestuur van de rechtspersoon waarvan een instelling als bedoeld in de
      [artikelen 2.4][ref1], [2.8][ref2], [2.9][ref3], [2.10][ref4] en [2.11][ref5], uitgaat, is verplicht op een bij
      ministeriële regeling aan te geven wijze kosteloos inlichtingen te verstrekken, benodigd voor de uitvoering van
      deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0011453#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0011453#Artikel2
      [ref5]: https://wetten.overheid.nl/BWBR0011453#Artikel2
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel9.5
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0011453
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref3
        bwb_id: BWBR0011453
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref4
        bwb_id: BWBR0011453
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref5
        bwb_id: BWBR0011453
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 9.5.2
    text: |-
      De natuurlijke persoon van wie of het bestuur van de rechtspersoon waarvan een instelling uitgaat als bedoeld
      in [artikel 2.10][ref1], alsmede als bedoeld in de [artikelen 2.8][ref2] en [2.9][ref3], voor zover het van
      een bijzondere instelling uitgaande opleidingen godgeleerdheid of opleidingen gericht op een godsdienstig of
      levensbeschouwelijk ambt betreft, stelt aan het einde van elk studiejaar de studievoortgang, bedoeld in het eerste
      en tweede lid, van iedere aan de instelling ingeschreven student vast en stelt betrokkene voor 1 november van het
      kalenderjaar waarin het desbetreffende studiejaar is geëindigd, van deze voortgang in kennis.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0011453#Artikel2
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel9.5
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref2
        bwb_id: BWBR0011453
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref3
        bwb_id: BWBR0011453
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 9.5.3
    text: |-
      Voorts stelt de natuurlijke persoon of het bestuur, bedoeld in het tweede lid, na het einde van elk studiejaar
      vóór 1 november daaropvolgend Onze Minister in kennis welke studenten de norm van 30 of 20 studiepunten niet hebben
      behaald.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel9.5
  - number: 9.5.4
    text: |-
      De natuurlijke persoon of het bestuur, bedoeld in het tweede lid, stuurt gelijktijdig een afschrift aan de
      betrokkene van de gegevens die hij over de betrokkene aan Onze Minister verstrekt en geeft daarbij tevens aan wat
      de consequenties op grond van deze wet zijn voor de vorm van de studiefinanciering van betrokkene alsmede welke
      beroepsgang voor betrokkene open staat.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel9.5
  - number: 9.5.5
    text: |-
      Onze Minister kan voor instellingen of groepen van instellingen waarop [artikel 7.9d van de WHW][ref1] niet
      van toepassing is, bepalen dat de natuurlijke persoon van wie of het bestuur van de rechtspersoon waarvan die
      instelling uitgaat, voor het einde van de maand volgend op de maand waarin een student het afsluitend examen van
      een opleiding in het hoger onderwijs met goed gevolg heeft afgelegd, daarvan mededeling doet aan Onze Minister en
      gelijktijdig de student van die mededeling in kennis stelt.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel9.5
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
  - number: '9.6'
    text: |-
      Organen met een publiekrechtelijke taak zijn verplicht op een bij algemene maatregel van bestuur aan te geven wijze
      kosteloos inlichtingen te verstrekken, benodigd voor de uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel9.6
  - number: 9.6b.1
    text: |-
      Onze Minister kan de gegevens die bij haar bekend zijn als gevolg van de uitvoering van haar wettelijke taken
      verstrekken aan de voor de verstrekking van een tegemoetkoming in de kosten voor toegang tot het onderwijs of
      voor levensonderhoud voor studerenden verantwoordelijke autoriteit van een andere staat die partij is bij de
      Overeenkomst betreffende de Europese Economische Ruimte.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel9.6b
  - number: 9.6b.2
    text: |-
      De in het eerste lid bedoelde verantwoordelijke autoriteit toont voor de verstrekking van gegevens aan dat de
      studerende ten laste van die autoriteit een tegemoetkoming in de kosten voor de toegang tot het onderwijs of voor
      levensonderhoud heeft aangevraagd dan wel reeds ontvangt.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel9.6b
  - number: 9.6b.3
    text: |-
      Onze Minister kan, voor de uitvoering van de wet, inlichtingen over een studerende die studiefinanciering aanvraagt
      danwel reeds ontvangt, opvragen bij het bevoegd gezag van een staat die partij is bij de Overeenkomst betreffende
      de Europese Economische Ruimte waar de studerende een opleiding wil gaan volgen of volgt met studiefinanciering op
      grond van [artikel 2.14, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel2
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel9.6b
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: 9.6c.1
    text: |-
      Onze Minister kan, overeenkomstig [artikel 9.6b][ref1], gegevens, die bij haar bekend zijn als gevolg van
      de uitvoering van haar wettelijke taken, uitwisselen met een staat die geen partij is bij de Overeenkomst
      betreffende de Europese Economische Ruimte indien deze staat een passend beschermingsniveau als bedoeld in
      [artikel 76 van de Wet bescherming persoonsgegevens][ref2] waarborgt.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0011468#Artikel76
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel9.6c
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '9.2'
      - id: ref2
        bwb_id: BWBR0011468
        artikel: '76'
  - number: 9.6c.2
    text: |-
      Voor gegevensuitwisseling als bedoeld in [artikel 9.6b][ref1] met een staat die geen
      passend beschermingsniveau kan waarborgen, kan Onze Minister een vergunning als bedoeld in
      [artikel 77, tweede lid, van de Wet bescherming persoonsgegevens][ref2] aanvragen bij Onze Minister van Justitie.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0011468#Artikel77
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel9.6c
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '9.2'
      - id: ref2
        bwb_id: BWBR0011468
        artikel: '77'
  - number: '9.7'
    text: |-
      Indien een instelling als bedoeld in de [artikelen 2.9][ref1], [2.10][ref2] en [2.11][ref3], niet
      uiterlijk 1 november volgend op het einde van het studiejaar aan Onze Minister de gegevens, bedoeld in
      [artikel 7.9a van de WHW][ref4], of in de [artikelen 9.5, derde lid][ref5], of [10.6, vierde lid][ref6], heeft
      verstrekt, ontstaat er een vordering van Onze Minister op de instelling ter grootte van 15% van het bedrag aan
      onvoorwaardelijk als gift vastgestelde studiefinanciering, bedoeld in de [artikelen 10a.3, vijfde lid][ref7],
      of [10.7][ref8], dat aan de studenten aan die instelling is toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0011453#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref5]: https://wetten.overheid.nl/BWBR0011453#Artikel9
      [ref6]: https://wetten.overheid.nl/BWBR0011453#Artikel10
