  - number: '4.9'
    text: |-
      De diplomatermijn beroepsonderwijs is een periode van 10 jaren. Deze periode vangt aan op de eerste dag van de
      maand waarover voor het eerst prestatiebeurs is toegekend voor het volgen van een opleiding niveau 3 of 4.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel4.9
  - number: 4.10.1
    text: |-
      Indien een deelnemer binnen de diplomatermijn beroepsonderwijs het afsluitend examen van een opleiding niveau
      3 of 4 met goed gevolg heeft afgelegd, wordt de aan hem ingevolge [artikel 4.7, eerste lid][ref1], toegekende
      prestatiebeurs omgezet in een gift.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel4
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel4.10
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.1.2
        afdeling: '4.1'
  - number: 4.10.2
    text: |-
      Indien een deelnemer binnen de diplomatermijn beroepsonderwijs het afsluitend examen van een specialistenopleiding
      met goed gevolg heeft afgelegd, wordt de aan hem ingevolge [artikel 4.7, tweede lid][ref1], toegekende
      prestatiebeurs omgezet in een gift.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel4
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel4.10
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.1.2
        afdeling: '4.1'
  - number: 4.10.3
    text: |-
      Indien een deelnemer binnen de diplomatermijn beroepsonderwijs het afsluitend examen van een opleiding niveau 3 of
      4 met goed gevolg heeft afgelegd, wordt de resterende periode van zijn prestatiebeurs verstrekt in de vorm van een
      gift indien hij een andere opleiding niveau 3 of 4 aanvangt.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel4.10
  - number: 4.10.4
    text: |-
      Met een afsluitend examen van een opleiding niveau 3 of 4 of een afsluitend examen van een specialistenopleiding
      wordt gelijkgesteld het afsluitend examen van een opleiding in het hoger onderwijs.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel4.10
  - number: 4.10.5
    text: |-
      Omzetting vindt plaats per 1 januari volgend op het kalenderjaar waarin Onze Minister heeft vastgesteld dat een
      deelnemer heeft voldaan aan de voorwaarden, bedoeld in het eerste of tweede lid.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel4.10
  - number: '4.11'
    text: |-
      Indien een deelnemer in het eerste jaar van een opleiding voor het eerst prestatiebeurs geniet en hij in dat
      studiejaar ophoudt studiefinanciering te genieten vóór 1 februari, en hij niet over datzelfde studiejaar opnieuw
      studiefinanciering voor het volgen van een opleiding niveau 3 of 4 dan wel voor hoger onderwijs krijgt toegekend,
      wordt op zijn aanvraag per 1 januari van het kalenderjaar volgend op het einde van dat studiejaar de over dat
      studiejaar toegekende prestatiebeurs omgezet in een gift.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel4.11
  - number: '4.12'
    text: |-
      Onze Minister verlengt op aanvraag van de deelnemer de duur van de prestatiebeurs eenmalig met 1 jaar indien
      de deelnemer blijkens gedagtekende verklaringen van een arts en van het bestuur van de rechtspersoon van
      de onderwijsinstelling waar hij is ingeschreven, als gevolg van een lichamelijke, zintuiglijke of andere
      functiestoornis niet in staat is het afsluitend examen van een opleiding niveau 3 of 4 met goed gevolg af te ronden
      binnen dat aantal jaren prestatiebeurs.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel4.12
  - number: '4.13'
    text: |-
      Indien een deelnemer op enig moment binnen de diplomatermijn beroepsonderwijs in staat
      wordt om met arbeid niet meer dan 20% te verdienen van het maatmaninkomen in de zin van de
      [Wet werk en arbeidsondersteuning jonggehandicapten][ref1], wordt de aan hem toegekende prestatiebeurs omgezet in
      een gift.


      [ref1]: https://wetten.overheid.nl/BWBR0008657
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel4.13
    references:
      - id: ref1
        bwb_id: BWBR0008657
  - number: 4.14.1
    text: |-
      Indien een deelnemer als direct gevolg van bijzondere omstandigheden van tijdelijke aard niet in staat is binnen de
      diplomatermijn beroepsonderwijs met goed gevolg het afsluitend examen van een opleiding niveau 3 of 4 te behalen,
      wordt deze termijn verlengd met de duur van die bijzondere omstandigheden.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel4.14
  - number: 4.14.2
    text: |-
      Indien een deelnemer als direct gevolg van bijzondere omstandigheden van structurele aard niet in staat is met goed
      gevolg het afsluitend examen van een opleiding niveau 3 of 4 te behalen, wordt de aan hem toegekende prestatiebeurs
      omgezet in een gift. Onder bijzondere omstandigheden van structurele aard kunnen in ieder geval worden verstaan
      functiebeperking of chronische ziekte.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel4.14
  - number: 4.14.3
    text: |-
      Indien een deelnemer als direct gevolg van een tijdens de studie verworven handicap, ten gevolge van een zich
      tijdens de studie verergerende handicap of ten gevolge van een zich tijdens de studie manifesterende chronische
      ziekte genoodzaakt is een reeds begonnen opleiding te beëindigen, ontvangt de deelnemer bij keuze voor een
      passender opleiding nieuwe aanspraak op studiefinanciering.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel4.14
  - number: 4.14.4
    text: |-
      Onze Minister stelt op aanvraag van de deelnemer vast of er sprake is van bijzondere omstandigheden in de zin
      van dit artikel. De bijzondere omstandigheden kunnen uitsluitend worden aangetoond door gedagtekende verklaringen
      van een arts en de natuurlijke persoon of het bestuur van de rechtspersoon van de onderwijsinstelling waar
      hij is ingeschreven. Indien de bijzondere omstandigheden uitsluitend van niet-medische aard zijn, volstaat een
      gedagtekende verklaring van de natuurlijke persoon of het bestuur van de rechtspersoon van de onderwijsinstelling
      waar de deelnemer is ingeschreven.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel4.14
  - number: '4.15'
    text: |-
      Bij omzetting van een prestatiebeurs of een deel daarvan in een gift gaat de over het om te zetten bedrag
      opgebouwde rente teniet.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel4.15
  - number: '4.16'
    text: |-
      Deze afdeling is uitsluitend van toepassing op deelnemers die zijn ingeschreven voor het volgen van
      beroepsonderwijs als bedoeld in [artikel 2.13a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel2
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel4.16
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: '4.17'
    text: |-
      Deze paragraaf is uitsluitend van toepassing op deelnemers die zijn ingeschreven voor het volgen van een opleiding
      buiten Nederland als bedoeld in [artikel 2.13a][ref1] en waarvan Onze Minister heeft vastgesteld dat deze wordt
      aangemerkt als een opleiding niveau 1 of 2.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel2
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel4.17
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: 4.18.1
    text: Studiefinanciering wordt gedurende ten hoogste 4 jaren verstrekt in de vorm van een gift.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel4.18
  - number: 4.18.2
    text: |-
      Studiefinanciering wordt gedurende 36 maanden na de periode, bedoeld in het eerste lid, verstrekt
      in de vorm van een lening. Het bedrag dat per maand kan worden geleend, bedraagt in afwijking van de
      [artikelen 3.1, derde lid][ref1], [3.2][ref2], [3.13][ref3] en [3.18][ref4], naar de maatstaf van 1 januari 2004
      € 770,53. Tevens kan een reisvoorziening worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011453#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0011453#Artikel3
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel4.18
    references:
