preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de Wet op de studiefinanciering te wijzigen als
    uitvloeisel van het regeerakkoord 1998 en van de nota «Flexibele studiefinanciering; een stelsel dat past»; dat
    het voorts wenselijk is de leesbaarheid van de Wet op de studiefinanciering te vergroten; dat het in verband met
    het grote aantal wijzigingen wenselijk is de Wet op de studiefinanciering in te trekken en te vervangen door een
    nieuwe wet;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#ArtikelAanhef
articles:
  - number: 1.1.1
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder: **afsluitend examen**: a. voor wat betreft
      [hoofdstuk 4][ref1] het examen, bedoeld in [artikel 7.4.2 van de Wet educatie en beroepsonderwijs][ref2],
      alsmede het daarmee overeenkomende examen van een opleiding buiten Nederland als bedoeld in
      [artikel 2.13a][ref3], b. voor wat betreft de [hoofdstukken 5][ref4] en [10][ref5] het examen,
      bedoeld in [artikel 7.10a van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref6],
      alsmede het daarmee overeenkomende examen van een opleiding buiten Nederland als
      bedoeld in [artikel 2.14][ref7], **bacheloropleiding**: opleiding als bedoeld in
      __REF007___________________________________________________________________________________________________________
      _______________________, die is geaccrediteerd als bedoeld in
      [artikel 1.1, onderdeel s, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref9], of
      die de toets nieuwe opleiding, bedoeld in [artikel 1.1, onderdeel t, van die wet][ref10], met positief
      gevolg heeft ondergaan, **belastbaar minimumloon**: bij of krachtens algemene maatregel van bestuur
      vast te stellen bedrag, afgeleid van het totaal van het minimumloon en de minimumvakantiebijslag voor
      een 23-jarige op grond van de [Wet minimumloon en minimumvakantiebijslag][ref11], **beroepsonderwijs**:
      opleiding als bedoeld in [artikel 7.2.7, derde lid, van de Wet educatie en beroepsonderwijs][ref12] en
      als bedoeld in [artikel 2.13a][ref13], **collegegeldkrediet**: lening voor betaling van het collegegeld
      in het hoger onderwijs, **debiteur**: degene die zich krachtens [artikel 6.2][ref14] heeft verplicht
      tot terugbetaling, **deelnemer**: degene die beroepsonderwijs volgt, **hoger beroepsonderwijs**: hoger
      beroepsonderwijs in de zin van de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref15], **hoger
      onderwijs**: wetenschappelijk onderwijs en hoger beroepsonderwijs als bedoeld in [paragraaf 2.3][ref16]
      en in [artikel 2.14][ref17], **lening**: rentedragende lening die niet kan worden omgezet in een gift,
      onverminderd omzetting, bedoeld in [artikel 10.8][ref18], **masteropleiding**: opleiding als bedoeld in
      __REF018___________________________________________________________________________________________________________
      ________________________, die is geaccrediteerd als bedoeld in
      [artikel 1.1, onderdeel s, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref20], of die de
      toets nieuwe opleiding, bedoeld in [artikel 1.1, onderdeel t, van die wet][ref21], met positief gevolg heeft
      ondergaan, **onderwijsnummer**: door Onze Minister uitgegeven persoonsgebonden nummer, toegekend aan een persoon
      aan wie niet van overheidswege een burgerservicenummer is verstrekt, **Onze Minister**: Onze Minister van
      Onderwijs, Cultuur en Wetenschap, **opleiding niveau 1 of 2**: a. assistentopleiding en basisberoepsopleiding
      als bedoeld in [artikel 7.2.2, eerste lid, onderdelen a en b, van de Wet educatie en beroepsonderwijs][ref22],
      b. andere opleiding als bedoeld in [artikel 7.2.2, eerste lid, onderdeel f, van die wet][ref23], waarvan
      bij ministeriële regeling is aangegeven dat deze voor de toepassing van deze wet wordt aangemerkt als
      een opleiding niveau 1 of 2, en c. opleiding buiten Nederland als bedoeld in [artikel 2.13a][ref24]
      en waarvan Onze Minister heeft vastgesteld dat deze wordt aangemerkt als een opleiding niveau 1 of 2,
      **opleiding niveau 3 of 4**: a. vakopleiding, middenkaderopleiding en specialistenopleiding als bedoeld in
      [artikel 7.2.2, eerste lid, onderdelen c, d en e, van de Wet educatie en beroepsonderwijs][ref25], b. andere
      opleiding als bedoeld in [artikel 7.2.2, eerste lid, onderdeel f, van die wet][ref26], waarvan bij ministeriële
      regeling is aangegeven dat deze voor de toepassing van deze wet wordt aangemerkt als een opleiding niveau
      3 of 4, en c. opleiding buiten Nederland als bedoeld in [artikel 2.13a][ref27] en waarvan Onze Minister
      heeft vastgesteld dat deze wordt aangemerkt als een opleiding niveau 3 of 4, **ouder**: natuurlijke ouder of
      adoptiefouder in de zin van de [artikelen 197 tot en met 232 van Boek 1 van het Burgerlijk Wetboek][ref28],
      **partner**: partner als bedoeld in [artikel 3 van de Algemene wet inkomensafhankelijke regelingen][ref29],
      **peiljaar**: tweede jaar voorafgaand aan het jaar waarin het studiefinancieringstijdvak aanvangt, dan wel
      het tweede jaar voorafgaand aan het jaar waarvoor de draagkracht in de zin van [hoofdstuk 6][ref30] wordt
      vastgesteld, **prestatiebeurs**: rentedragende lening die onder voorwaarden kan worden omgezet in een gift,
      waarbij de rente teniet gaat, niet zijnde de rentedragende lening die niet kan worden omgezet in een gift,
      **reisrecht**: recht om te reizen als bedoeld in [artikel 3.7, eerste lid][ref31], **reisvoorziening**:
      voorziening als bedoeld in [artikel 3.7][ref32] en [paragraaf 3.7][ref33], **RSR**: Regisseur Studenten
      Reisrecht, de rechtspersoon die in opdracht van het vervoerbedrijf tot taak heeft de digitale administratie
      van de OV-chipkaart voor studerenden te voeren, **specialistenopleiding**: specialistenopleiding als
      bedoeld in [artikel 7.2.2, eerste lid, onderdeel e, van de Wet educatie en beroepsonderwijs][ref34],
      **student**: degene die hoger onderwijs volgt, niet zijnde een extraneus, **studerende**: deelnemer of
      student, **studiefinanciering**: door Onze Minister verstrekte toekenning in verband met het volgen van
      een opleiding in het beroepsonderwijs of in het hoger onderwijs waarop uitsluitend op grond van deze wet
      aanspraak bestaat, **studiefinancieringstijdvak**: kalenderjaar of een gedeelte daarvan waarop de toekenning
      van studiefinanciering betrekking heeft, met dien verstande dat deze periode ten minste 1 kalendermaand
      is, **studiejaar**: 1°. in het hoger onderwijs: tijdvak dat aanvangt op 1 september van enig kalenderjaar
      en eindigt op 31 augustus daaropvolgend, 2°. in het beroepsonderwijs: tijdvak dat aanvangt op 1 augustus
      van enig kalenderjaar en eindigt op 31 juli daaropvolgend, **studiepunt**: eenheid waarin de studielast,
      bedoeld in [artikel 7.4, eerste lid, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref35],
      wordt uitgedrukt, **thuiswonende studerende**: studerende die woont op het adres
      van zijn ouders of van een van hen, **toetsingsinkomen**: inkomen als bedoeld in
      [artikel 8, eerste en tweede lid, van de Algemene wet inkomensafhankelijke regelingen][ref36], met dien verstande
      dat, behoudens bij de toepassing van de [artikelen 3.4][ref37] en [3.17][ref38], voor berekeningsjaar wordt
      gelezen: 'peiljaar, **uitwonende studerende**: studerende die niet een thuiswonende studerende is, **veronderstelde'
      ouderlijke bijdrage**: bedrag dat verondersteld wordt door de ouders bijgedragen te worden waarmee de aanvullende
      beurs van de studerende wordt verminderd, **vervoerbedrijf**: rechtspersoon die op grond van een overeenkomst met
      de Staat als partij of als derde verantwoordelijk is voor de uitvoering van het reisrecht, **voltijdse opleiding**:
      opleiding in de zin van de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref39], met uitzondering
      van deeltijds onderwijs, **vreemdeling**: hetgeen daaronder wordt verstaan in de [Vreemdelingenwet 2000][ref40],
      **WEB**: [Wet educatie en beroepsonderwijs][ref41], **wetenschappelijk onderwijs**: wetenschappelijk
      onderwijs in de zin van de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref42], **WHW**:
      [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref43].


