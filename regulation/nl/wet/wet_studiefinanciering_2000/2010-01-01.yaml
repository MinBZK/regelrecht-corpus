  - number: 4.22.1
    text: |-
      De deelnemer zendt uiterlijk 3 maanden na het verstrijken van de diplomatermijn, een gewaarmerkt bewijs van het met
      goed gevolg afleggen van het afsluitend examen van de opleiding aan Onze Minister en dient daarbij een aanvraag in
      tot omzetting van de prestatiebeurs. Op het gewaarmerkt bewijs vermeldt de instelling de datum waarop het examen
      met goed gevolg is afgesloten.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel4.22
  - number: 4.22.2
    text: |-
      De omzetting, bedoeld in [artikel 4.10][ref1], vindt plaats per 1 januari van het kalenderjaar volgend op de
      aanvraag. Zo spoedig mogelijk na de omzetting stelt Onze Minister de deelnemer daarvan in kennis.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel4
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel4.22
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.1.2
        afdeling: '4.1'
  - number: '4.23'
    text: |-
      Voorzover deze afdeling daarin niet voorziet, alsmede indien noodzakelijk, kunnen in afwijking van het in deze
      afdeling bepaalde bij ministeriële regeling regels worden vastgesteld ten behoeve van een goede uitvoering van
      deze afdeling.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel4.23
  - number: '5.1'
    text: |-
      Dit hoofdstuk is uitsluitend van toepassing op studenten die na 31 augustus 1996 voor het volgen van hoger
      onderwijs voor het eerst studiefinanciering ontvingen.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel5.1
  - number: 5.2.1
    text: |-
      Studiefinanciering, met uitzondering van het collegegeldkrediet, de basislening en de aanvullende
      lening, wordt gedurende 4 jaren of het aantal jaren genoemd in [artikel 5.6][ref1], dan wel bedoeld in
      [artikel 2.14, derde lid][ref2], verstrekt in de vorm van een prestatiebeurs, met dien verstande dat de aanvullende
      beurs in de eerste 12 maanden waarvoor aanspraak op studiefinanciering bestaat wordt verstrekt in de vorm van een
      gift.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel2
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel5.2
