    text: |-
      In dit hoofdstuk wordt onder tempobeurs verstaan een voorwaardelijke gift die onder voorwaarden kan worden omgezet
      in een lening. De tempobeurs omvat niet de reisvoorziening.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel10.1
  - number: 10.2.1
    text: |-
      Dit hoofdstuk is uitsluitend van toepassing op studenten die na 31 juli 1991 en voor 1 september
      1996 voor het eerst voor het volgen van hoger onderwijs studiefinanciering ontvingen op grond van de
      [Wet op de studiefinanciering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003955
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel10.2
    references:
      - id: ref1
        bwb_id: BWBR0003955
  - number: 10.2.2
    text: |-
      Dit hoofdstuk is niet van toepassing op studenten die onderwijs volgen aan een opleiding als bedoeld in de
      [artikelen 2.11][ref1] en [2.14][ref2]. De studiefinanciering aan deze studenten wordt op grond van artikel VI van
      de wet van 28 maart 1996 (Stb. 226) gedurende 6 jaren verstrekt in de vorm van een gift. Indien Onze Minister heeft
      bepaald dat het een langere opleiding betreft, wordt het aantal van 6 jaren verhoogd met het meerdere.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel2
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel10.2
