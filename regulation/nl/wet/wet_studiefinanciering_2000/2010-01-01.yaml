  - number: 1.1.2
    text: |-
      Onder voltijdse opleiding wordt mede verstaan een duale opleiding in de zin van de [WHW][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel1.1
    references:
      - id: ref1
        bwb_id: BWBR0005682
  - number: '1.2'
    text: |-
      Voor de toepassing van het bepaalde bij of krachtens deze wet is bepalend de toestand op de eerste dag van de
      maand, tenzij anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel1.2
  - number: '1.3'
    text: |-
      Aan welke voorwaarden een aanvraag moet voldoen, kan bij ministeriële regeling worden bepaald. In ieder geval wordt
      daarbij bepaald dat de aanvrager zijn burgerservicenummer of onderwijsnummer verstrekt.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel1.3
  - number: 1.5.1
    text: |-
      Indien bij controle door Onze Minister blijkt dat het door de studerende verstrekte adres afwijkt van het adres
      waarop de studerende in de gemeentelijke basisadministratie persoonsgegevens staat ingeschreven, maakt Onze
      Minister dit aan hem bekend en stelt hem in de gelegenheid de afwijking te herstellen.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel1.5
  - number: 1.5.2
    text: |-
      Indien een uitwonende studerende de afwijking niet binnen 4 weken na de bekendmaking herstelt, wordt met ingang van
      de maand waarin de afwijking is ontstaan, de aan hem toegekende beurs omgezet in een beurs voor een thuiswonende
      studerende, tenzij hem van de afwijking redelijkerwijs geen verwijt kan worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel1.5
  - number: 1.5.3
    text: |-
      Indien een uitwonende studerende de afwijking na de termijn van 4 weken alsnog herstelt, wordt met ingang van de
      maand daaropvolgend de beurs voor een thuiswonende studerende omgezet in een beurs voor een uitwonende studerende.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel1.5
  - number: 1.7.1
    text: |-
      Onze Minister gebruikt het burgerservicenummer of onderwijsnummer van een studerende of debiteur ter zake van de
      uitvoering van deze wet slechts:
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel1.7
  - number: 1.7.1.a
    text: in contacten met die studerende of debiteur,
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel1.7
  - number: 1.7.1.b
    text: |-
      in contacten met personen en instanties voorzover deze zelf gemachtigd zijn tot het opnemen van het
      burgerservicenummer of onderwijsnummer in een persoonsregistratie, en
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel1.7
  - number: 1.7.1.c
    text: |-
      teneinde de gegevens van die studerende of debiteur te vergelijken met de gegevens die over hem zijn opgenomen
      in het basisregister onderwijs, bedoeld in [artikel 24b van de Wet op het onderwijstoezicht][ref1], voorzover dat
      noodzakelijk is voor de uitvoering van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel24b
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel1.7
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: 24b
  - number: 1.7.2
    text: |-
      Het burgerservicenummer of onderwijsnummer van de partner of ouder van een studerende of debiteur kan ter zake van
      de uitvoering van deze wet slechts worden gebruikt in contacten met die partner of ouder of met de desbetreffende
      studerende of debiteur, alsmede, voorzover het betreft de controle op de rechtmatigheid, in contacten met personen
      en instanties voorzover deze zelf gemachtigd zijn tot het opnemen van het burgerservicenummer of onderwijsnummer in
      een persoonsregistratie.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel1.7
