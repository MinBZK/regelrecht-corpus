    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.18
  - number: 3.19.1
    text: |-
      Onze Minister kent studiefinanciering toe aan degene die daartoe een aanvraag heeft ingediend en die voldoet aan de
      voorschriften gegeven bij of krachtens deze wet.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.19
  - number: 3.19.2
    text: 'Onze Minister besluit op een aanvraag om studiefinanciering:'
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.19
  - number: 3.19.2.a
    text: |-
      indien de aanvraag is ingediend vóór 1 november van het jaar voorafgaand aan het kalenderjaar waarop de
      studiefinanciering betrekking heeft: vóór 31 december van dat voorafgaande jaar, en
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.19
  - number: 3.19.2.b
    text: |-
      indien de aanvraag is ingediend na het in onderdeel a bedoelde tijdstip: binnen 8 weken na de indiening van de
      aanvraag.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.19
  - number: '3.20'
    text: |-
      Indien het op basis van de verstrekte gegevens onmogelijk is het bedrag van de aanvullende beurs vast te stellen,
      kent Onze Minister het gevraagde bedrag toe in de vorm van een lening.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.20
  - number: 3.21.1
    text: Studiefinanciering wordt toegekend per studiefinancieringstijdvak.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.21
  - number: 3.21.2
    text: |-
      Studiefinanciering wordt niet toegekend voor een periode die gelegen is voor de datum van indiening van de
      aanvraag.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.21
  - number: 3.21.3
    text: |-
      Aan de studerende die reeds studiefinanciering ontvangt en een aanvraag heeft ingediend om in aanmerking te komen
      voor:
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.21
  - number: 3.21.3.a
    text: het normbedrag voor een uitwonende studerende,
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.21
  - number: 3.21.3.b
    text: een toeslag voor een partner, of
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.21
  - number: 3.21.3.c
    text: een toeslag voor een één-oudergezin,
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.21
  - number: 3.21.4
    text: |-
      Op aanvraag van de studerende onderbreekt of beëindigt Onze Minister de studiefinanciering met ingang van de
      kalendermaand die de studerende in zijn aanvraag aangeeft. De onderbreking omvat ten minste 1 maand.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.21
  - number: 3.23.1
    text: |-
      In afwijking van [artikel 1.7][ref1] gebruikt Onze Minister het burgerservicenummer van een studerende ter zake van
      de toekenning van diens reisrecht in contacten met RSR.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel1
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.23
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '1'
        hoofdstuk: '1'
  - number: 3.23.2
    text: 'RSR gebruikt het burgerservicenummer van een studerende slechts:'
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.23
  - number: 3.23.2.a
    text: |-
      ter vaststelling van de identiteit van een studerende wanneer deze zich tot het vervoerbedrijf wendt om zijn
      gegevens te laten koppelen aan een daarvoor bestemde OV-chipkaart als bedoeld in [artikel 3.26, eerste lid][ref1],
      en


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel3
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.23
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.7'
  - number: 3.23.2.b
    text: in contacten met Onze Minister.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.23
  - number: 3.26.1
    text: |-
      Het reisrecht vangt aan op het moment dat de studerende het heeft geactiveerd op een daarvoor bestemde OV-
      chipkaart.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.26
  - number: 3.26.2
    text: Het reisrecht wordt naar keuze van de studerende toegekend als weekreisrecht of weekendreisrecht.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.26
  - number: 3.26.3
    text: |-
      Bij ministeriële regeling worden regels gesteld met betrekking tot de wijze van verkrijgen van het reisrecht en
      de omvang van de aan de soorten reisrecht, bedoeld in het tweede lid, verbonden rechten. Daarbij worden tevens
      voorschriften vastgesteld met betrekking tot de wijze waarop en de termijn waarbinnen de studerende de keuze
      tussen soorten reisrecht dient te maken en met betrekking tot de aanvraag tot herziening door de studerende van een
      gemaakte keuze in soorten reisrecht.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.26
  - number: 3.27.1
    text: |-
      De studerende is verplicht het reisrecht te beëindigen door het deactiveren van het reisrecht, uiterlijk op de
      vijfde werkdag nadat:
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.27
  - number: 3.27.1.a
    text: zijn aanspraak op studiefinanciering is beëindigd, of
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.27
  - number: 3.27.1.b
    text: |-
      zijn reisrecht op grond van [artikel 3.7, tweede of derde lid][ref1], is vervangen door een reisvoorziening in de
      vorm van geld.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel3
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.27
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 3.27.2
    text: |-
      Bij het ten onrechte beschikken over een op een OV-chipkaart geactiveerd reisrecht, is degene aan wie het
      reisrecht is toegekend aan Onze Minister een bedrag van € 68,– per halve kalendermaand of een deel van een halve
      kalendermaand verschuldigd, ongeacht of gebruik is gemaakt van het reisrecht. De eerste helft van een kalendermaand
      loopt tot en met de vijftiende dag van een maand. De tweede helft loopt tot en met het einde van die maand.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.27
  - number: 3.27.3
    text: |-
      Het eerste lid is niet van toepassing op een periode waarin het niet tijdig beëindigen van het reisrecht
      aantoonbaar niet kan worden toegerekend aan degene aan wie het reisrecht is toegekend.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.27
  - number: 3.27.4
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld met betrekking tot de wijze van beëindigen van het
      reisrecht, en kunnen nadere regels worden gesteld met betrekking tot de wijze waarop en het tijdstip waarvoor de
      niet-toerekenbaarheid, bedoeld in het derde lid, moet worden aangetoond.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.27
  - number: 3.29.1
    text: |-
      Wanneer een studerende door toedoen van Onze Minister over een periode ten onrechte niet over te activeren
      reisrecht beschikt, heeft hij over die periode jegens Onze Minister aanspraak op een vergoeding ter grootte
      van het bedrag, bedoeld in [artikel 3.27, tweede lid][ref1], mits hij meer dan 3 maanden voor het begin van de
      desbetreffende kalendermaand, zowel de studiefinanciering heeft aangevraagd als alle benodigde gegevens voor
      het kunnen toekennen van studiefinanciering heeft verstrekt. Indien het betreft een reisrecht als bedoeld in
      [artikel 3.7, tweede lid][ref2], heeft hij slechts aanspraak op een vergoeding als bedoeld in de vorige volzin,
      indien hij tevens binnen een bij ministeriële regeling vast te stellen termijn, een aanvraag om dit reisrecht heeft
      ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel3
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.29
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.7'
      - id: ref2
        bwb_id: BWBR0011453
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 3.29.2
    text: |-
      De studerende vraagt de vergoeding aan binnen 2 weken na de dag waarop hij op de aanvraag voor het eerst
      studiefinanciering heeft toegekend gekregen of, indien dit later is, binnen 2 weken na de dag waarop voor het eerst
      zijn recht op studiefinanciering inging.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.29
  - number: 3.29.3
    text: 'De studerende heeft geen recht op enige vergoeding:'
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.29
  - number: 3.29.3.a
    text: wegens het geen of slechts gedeeltelijk gebruik maken van het reisrecht, of
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.29
  - number: 3.29.3.b
    text: |-
      in geval van inname, verlies, diefstal, beschadiging of een defect van de OV-chipkaart, bedoeld in
      [artikel 3.26, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel3
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.29
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.7'
  - number: '3.30'
    text: |-
      Ten behoeve van het reizen tussen Waddeneilanden en het vaste land kan Onze Minister met de gemeenten van deze
      eilanden een overeenkomst sluiten over een aanvullende voorziening die deze gemeenten aan bepaalde groepen
      studerenden verstrekken.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.30
  - number: '4.1'
    text: 'Deze paragraaf is uitsluitend van toepassing:'
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel4.1
  - number: 4.1.a
    text: op deelnemers die in Nederland een opleiding niveau 1 of 2 volgen, en
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel4.1
  - number: 4.1.b
    text: |-
      op deelnemers die in Nederland een beroepsopleiding volgen en die voor 1 augustus 2005 voor het volgen van
      beroepsonderwijs studiefinanciering ontvingen.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel4.1
  - number: '4.2'
    text: Studiefinanciering wordt verstrekt in de vorm van een gift of een lening.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel4.2
  - number: 4.3.1
    text: |-
      De studiefinanciering van de deelnemer die zonder geldige reden niet aan het onderwijs heeft deelgenomen gedurende
      een aaneengesloten periode van ten minste 5 weken, bestaat met uitzondering van de reisvoorziening geheel uit een
      lening met ingang van de eerste dag van de maand volgend op de maand waarin de afwezigheid zonder geldige reden
      aanving. De periode van 5 weken wordt verlengd met de weken waarin vanwege vakantie geen onderwijs werd verzorgd.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel4.3
  - number: 4.3.2
    text: |-
      In afwijking van het eerste lid kan bij ministeriële regeling worden bepaald dat voor soorten van beroepsonderwijs
      het eerste lid van overeenkomstige toepassing is, indien een deelnemer in een of meer onderwijseenheden zonder
      geldige reden niet aan het onderwijs heeft deelgenomen.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel4.3
  - number: 4.3.3
    text: |-
      Onder afwezigheid met geldige reden wordt uitsluitend verstaan afwezigheid wegens ziekte van de deelnemer, welke
      ziekte uitsluitend kan worden aangetoond door middel van een gedagtekende verklaring van een arts, of afwezigheid
      wegens bijzondere familieomstandigheden.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel4.3
  - number: '4.4'
    text: |-
      [Artikel 4.3][ref1] is niet van toepassing met ingang van de eerste dag van de maand volgend op de maand waarin de
      deelnemer weer aan het onderwijs is gaan deelnemen, voor zover die studiefinanciering niet reeds mede op grond van
      een andere bepaling dan dit artikel, de vorm van een lening had. Voorwaarde voor de toepassing van de vorige volzin
      is dat de deelnemer aan het onderwijs is gaan deelnemen binnen 8 weken na de aanvang van de periode van 5 weken. De
      periodes van 5 en 8 weken worden verlengd met de weken waarin vanwege vakantie geen onderwijs werd verzorgd.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel4
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel4.4
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.1.1
        afdeling: '4.1'
  - number: 4.5.1
    text: |-
      Het bestuur van de rechtspersoon waarvan de instelling, bedoeld in [artikel 2.4, onderdeel b][ref1], uitgaat of
      de natuurlijke persoon die deze instelling in stand houdt, stelt uiterlijk op de derde werkdag na afloop van een
      periode van afwezigheid van 5 weken de deelnemer in kennis dat daarvan in de administratie van de instelling een
      aantekening is gemaakt en verzoekt de deelnemer om opgaaf van de reden van de afwezigheid.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel2
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel4.5
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 4.5.2
    text: |-
      Uiterlijk op de vijfde werkdag na de periode van 8 weken stelt het bestuur van de rechtspersoon of de natuurlijke
      persoon vast:
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel4.5
  - number: 4.5.2.a
    text: |-
      of de reden die de deelnemer binnen 8 weken na de aanvang van de periode van 5 weken gaf voor zijn afwezigheid, een
      geldige is, of
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel4.5
  - number: 4.5.2.b
    text: |-
      dat de deelnemer binnen 8 weken na de aanvang van de periode van 5 weken geen reden heeft opgegeven voor zijn
      afwezigheid.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel4.5
  - number: 4.5.3
    text: |-
      Het bestuur van de rechtspersoon of de natuurlijke persoon stelt tevens uiterlijk op de vijfde werkdag na afloop
      van de periode van 8 weken vast of de deelnemer voor het einde van die periode weer aan het onderwijs is gaan
      deelnemen.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel4.5
  - number: 4.5.4
    text: |-
      Het bestuur van de rechtspersoon of de natuurlijke persoon meldt uiterlijk de vijfde werkdag na afloop van een
      periode van 8 weken aan Onze Minister dat de deelnemer gedurende een aaneengesloten periode van ten minste 5 weken
      zonder opgave van geldige reden niet aan het onderwijs heeft deelgenomen. Tevens meldt hij, indien die deelnemer
      voor het einde van die periode van 8 weken weer aan het onderwijs is gaan deelnemen, de datum daarvan.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel4.5
  - number: 4.5.5
    text: De periodes van 5 en 8 weken worden verlengd met de weken waarin vanwege vakantie geen onderwijs werd verzorgd.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel4.5
  - number: 4.5.6
    text: |-
      Het bestuur van de rechtspersoon of de natuurlijke persoon stuurt gelijktijdig met de mededelingen, bedoeld in
      het vierde lid, een afschrift van de gegevens die over de betrokkene aan Onze Minister zijn verstrekt, aan deze
      betrokkene en geeft daarbij tevens aan dat afwezigheid als bedoeld in [artikel 4.3][ref1], gevolgen heeft voor
      de studiefinanciering van betrokkene, alsmede welke beroepsgang voor betrokkene open staat tegen de mededelingen,
      bedoeld in het vierde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel4
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel4.5
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.1.1
        afdeling: '4.1'
  - number: '4.6'
    text: |-
      Deze paragraaf is uitsluitend van toepassing op deelnemers die in Nederland een opleiding niveau 3 of 4 volgen, en
      die na 31 juli 2005 voor het volgen van beroepsonderwijs voor het eerst studiefinanciering ontvingen.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel4.6
  - number: 4.7.1
    text: |-
      Studiefinanciering, met uitzondering van de basislening en de aanvullende lening, wordt voor een opleiding niveau 3
      of 4 binnen en buiten Nederland tezamen gedurende ten hoogste 4 jaren verstrekt in de vorm van een prestatiebeurs,
      met dien verstande dat de aanvullende beurs in de eerste 12 maanden waarvoor aanspraak op studiefinanciering
      bestaat wordt verstrekt in de vorm van een gift.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel4.7
  - number: 4.7.2
    text: |-
      Indien een deelnemer een specialistenopleiding volgt en hij 4 jaren studiefinanciering in de vorm van
      prestatiebeurs heeft genoten, wordt aan hem studiefinanciering, met uitzondering van de basislening en de
      aanvullende lening, voor die opleiding op aanvraag gedurende ten hoogste 2 jaren verstrekt in de vorm van een
      prestatiebeurs.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel4.7
  - number: 4.7.3
    text: Indien aan de voorwaarden, bedoeld in deze paragraaf, wordt voldaan wordt de prestatiebeurs omgezet in een gift.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel4.7
  - number: 4.7.4
    text: |-
      Studiefinanciering wordt gedurende in totaal ten hoogste 36 maanden na de perioden, bedoeld in het eerste en tweede
      lid, verstrekt in de vorm van een lening. Het bedrag dat per maand kan worden geleend, bedraagt in afwijking van
      de [artikelen 3.1, derde lid][ref1], [3.2][ref2], [3.13][ref3] en [3.18][ref4], naar de maatstaf van 1 januari 2005
      € 787,02. Tevens kan een reisvoorziening worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011453#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0011453#Artikel3
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel4.7
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0011453
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref3
        bwb_id: BWBR0011453
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.3'
      - id: ref4
        bwb_id: BWBR0011453
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.5'
  - number: 4.7.5
    text: |-
      Op aanvraag kan een deelnemer als bedoeld in [artikel 3.4][ref1], gedurende de periode, bedoeld in het vierde lid,
      tevens in aanmerking komen voor een lening ter grootte van het bedrag, bedoeld in [artikel 3.4, derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel3
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel4.7
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0011453
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 4.7.6
    text: |-
      Op aanvraag kan een deelnemer als bedoeld in [artikel 3.5][ref1], gedurende de periode bedoeld in het vierde lid,
      tevens in aanmerking komen voor een lening ter grootte van het bedrag, bedoeld in [artikel 3.5, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel3
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel4.7
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0011453
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 4.8.1
    text: |-
      In afwijking van [artikel 4.7, eerste en tweede lid][ref1], wordt de studiefinanciering in de vorm van een
      reisvoorziening verstrekt in de vorm van een prestatiebeurs gedurende het in deze leden bedoelde aantal jaren,
      vermeerderd met 3 jaren. Indien [artikel 4.12][ref2] is toegepast, wordt de uitkomst van de vorige volzin met 1
      jaar vermeerderd.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel4
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel4.8
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.1.2
        afdeling: '4.1'
      - id: ref2
        bwb_id: BWBR0011453
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.1.2
        afdeling: '4.1'
  - number: 4.8.2
    text: |-
      Het deel van de prestatiebeurs dat betrekking heeft op het recht op de reisvoorziening, is gelijk aan eentwaalfde
      deel van de waarde die daarvoor per studerende door het vervoerbedrijf aan Onze Minister in rekening wordt
      gebracht. De waarde wordt berekend door de voorlopige vergoeding voor het lopende kalenderjaar te corrigeren
      naar de correctie die de voorlopige vergoeding voor het voorafgaande kalenderjaar onderging. Dit deel van de
      prestatiebeurs wordt niet uitbetaald of verrekend.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel4.8
  - number: 4.8.3
    text: |-
      Indien de prestatiebeurs niet kan worden omgezet in een gift, wordt de tegenwaarde van de reisvoorziening
      kwijtgescholden over een maand waarover het reisrecht niet op een OV-chipkaart is geactiveerd als bedoeld in
      [artikel 3.26][ref1] of is beëindigd als bedoeld in [artikel 3.27][ref2]. In afwijking van [artikel 1.2][ref3]
      is bepalend de toestand op enig moment van de maand. De over het kwijt te schelden bedrag opgebouwde rente
      gaat dan teniet. De kwijtschelding is niet van toepassing op een maand waarin een vergoeding als bedoeld in
      [artikel 3.7, tweede of derde lid][ref4], is toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011453#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0011453#Artikel3
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel4.8
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '3'
