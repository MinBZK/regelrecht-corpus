      Op besluiten met betrekking tot studiefinanciering voor de
      kalenderjaren 2008 en volgende zijn de bepalingen, opgenomen in
      [hoofdstuk 1, afdeling C, artikel III, van de Aanpassingswet Algemene wet inkomensafhankelijke regelingen][ref1]
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018471#ArtikelIII
