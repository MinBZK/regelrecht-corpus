    text: |-
      Dit artikel is uitsluitend van toepassing op studenten die voor 1 september 2007 zonder aanspraak op prestatiebeurs
      of visiebeurs buiten Nederland ingeschreven stonden voor het volgen van een hoger onderwijsopleiding en om deze
      reden niet kunnen voldoen aan de verblijfsvoorwaarde, genoemd in [artikel 2.14, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel2
