      - id: ref7
        bwb_id: BWBR0011453
        artikel: '10'
        hoofdstuk: '10'
  - number: 11.1.2
    text: |-
      De bedragen maximale aanvullende beurs/lening in de kolom hoger onderwijs, genoemd in overzicht 2 van
      [artikel 3.18][ref1], worden voor de studiejaren 2009–2010 tot en met 2018–2019 jaarlijks op 1 september verhoogd
      met een bedrag van € 1,84. Het bedrag basislening in de kolom hoger onderwijs, genoemd in overzicht 2 van
      [artikel 3.18][ref2], wordt gelijktijdig met hetzelfde bedrag verlaagd.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel3
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel11.1
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.5'
      - id: ref2
        bwb_id: BWBR0011453
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.5'
  - number: 11.1.3
    text: De aangepaste bedragen treden in de plaats van de in het eerste en tweede lid bedoelde, aan te passen bedragen.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel11.1
  - number: '11.2'
    text: |-
      [Titel 4.2 van de Algemene wet bestuursrecht][ref1] is niet van toepassing op deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel11.2
    references:
      - id: ref1
        bwb_id: BWBR0005537
  - number: 11.3.1
    text: |-
      Studiefinanciering is niet vatbaar voor vervreemding, verpanding, belening en beslag, waaronder begrepen beslag
      ingevolge faillissement of toepassing van de schuldsaneringsregeling natuurlijke personen.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel11.3
  - number: 11.3.2
    text: Elk beding, strijdig met dit artikel, is nietig.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel11.3
  - number: 11.5.1
    text: |-
      Onze Minister kan voor bepaalde gevallen de wet buiten toepassing laten of daarvan afwijken voor zover toepassing
      gelet op het belang dat deze wet beoogt te beschermen, zal leiden tot een onbillijkheid van overwegende aard.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel11.5
  - number: 11.5.2
    text: 'Het eerste lid is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel11.5
  - number: 11.5.2.a
    text: het begrip partner,
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel11.5
  - number: 11.5.2.b
    text: het begrip toetsingsinkomen,
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel11.5
  - number: 11.5.2.c
    text: het begrip vreemdeling,
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel11.5
  - number: 11.5.2.d
    text: |-
      [artikel 1.8][ref1], en

      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel1
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel11.5
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '1'
        hoofdstuk: '1'
  - number: 11.5.2.e
    text: |-
      [artikel 3.4, vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel3
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel11.5
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 12.1.6
    text: |-
      Onder de begripsbepaling van «bacheloropleiding» in [artikel 1.1, eerste lid][ref1], wordt mede verstaan:
      opleiding als bedoeld in [artikel 7.3a, eerste lid, onderdeel a, van de WHW][ref2], en ten aanzien waarvan
      [artikel 18.18 van de WHW][ref3] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel18
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel12.1
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0005682
        artikel: '18'
  - number: 12.1.7
    text: |-
      Onder de begripsbepaling van «masteropleiding» in [artikel 1.1, eerste lid][ref1], wordt mede verstaan:
      opleiding als bedoeld in [artikel 7.3a, eerste lid, onderdeel b, van de WHW][ref2], en ten aanzien waarvan
      [artikel 18.18 van de WHW][ref3] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel18
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel12.1
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0005682
        artikel: '18'
  - number: 12.1a
    text: |-
      Voor deelnemers die voor 1 augustus onderscheidenlijk voor studenten
      die voor 1 september volgend op het tijdstip van inwerkingtreding van
