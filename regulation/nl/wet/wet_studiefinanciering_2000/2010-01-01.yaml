      tweede lid, verstrekt in de vorm van een lening. De reisvoorziening wordt verstrekt in de vorm van een gift. Het
      bedrag dat per maand gedurende deze periode kan worden geleend, bedraagt, in afwijking van de [artikelen 3.2][ref1]
      en [3.3][ref2], naar de maatstaf van 1 januari 2007 € 809,93 . De [artikelen 3.13][ref3] en [3.18][ref4] zijn niet
