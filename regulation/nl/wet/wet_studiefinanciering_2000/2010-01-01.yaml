  - number: 12.1c.2
    text: |-
      In afwijking van [artikel 2.14, eerste en tweede lid][ref1], kan de student, bedoeld in het eerste
      lid, voor studiefinanciering voor het volgen van een opleiding die voldoet aan de criteria, bedoeld in
      [artikel 2.14, tweede lid][ref2], in aanmerking komen als hij ten minste 3 jaren van de 6 jaren voorafgaand aan de
      inschrijving aan de opleiding, bedoeld in het eerste lid, in Nederland heeft gewoond.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel2
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel12.1c
