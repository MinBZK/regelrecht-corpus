    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref2
        bwb_id: BWBR0011453
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref3
        bwb_id: BWBR0011453
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 10.6.2
    text: |-
      De tempobeurs bestaat geheel uit lening in het studiejaar waarin de student niet ten minste 30
      studiepunten heeft behaald. De vorige volzin is niet van toepassing op opleidingen als bedoeld in
      [artikel 7.4, vierde lid, eerste volzin, van de WHW][ref1], zoals dat artikel luidde op 31 augustus 2002, en in
      [artikel 7.4a, derde lid, van de WHW][ref2] en [artikel 7.4b, derde lid, van de WHW][ref3]. Voor een student die
      zich als student in het onderwijs, bedoeld in de eerste volzin, inschrijft na 31 januari van een studiejaar, geldt,
      in afwijking van de eerste volzin een norm van 20 studiepunten.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel10.6
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0005682
        artikel: '7'
  - number: 10.6.3
    text: |-
      In afwijking van het tweede lid kan Onze Minister naar aanleiding van een door een instelling als bedoeld
      in [artikel 2.10][ref1], alsmede als bedoeld in de [artikelen 2.8][ref2] en [2.9][ref3], voor zover het van
      een bijzondere instelling uitgaande opleidingen godgeleerdheid of opleidingen gericht op een godsdienstig of
      levensbeschouwelijk ambt betreft, in te dienen aanvraag, toestaan dat in plaats van studiepunten een andere norm
      voor de beoordeling van studievoortgang wordt gehanteerd. Deze andere norm dient gelijkwaardig te zijn aan de norm
      uitgedrukt in studiepunten. De opleiding dient zodanig te worden ingericht dat een student in redelijkheid kan
      voldoen aan de in de vorige volzin bedoelde norm.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0011453#Artikel2
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel10.6
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref2
        bwb_id: BWBR0011453
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref3
        bwb_id: BWBR0011453
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 10.6.4
    text: |-
      De natuurlijke persoon van wie of het bestuur van de rechtspersoon waarvan een instelling uitgaat als bedoeld
      in [artikel 2.10][ref1], alsmede als bedoeld in [de artikelen 2.8][ref2] en [2.9][ref3], voor zover het van
      een bijzondere instelling uitgaande opleidingen godgeleerdheid of opleidingen gericht op een godsdienstig of
      levensbeschouwelijk ambt betreft, stelt aan het einde van elk studiejaar de studievoortgang, bedoeld in het eerste
      en tweede lid, van iedere aan de instelling ingeschreven student vast en stelt betrokkene voor 1 november van het
      kalenderjaar waarin het desbetreffende studiejaar is geëindigd, van deze voortgang in kennis.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0011453#Artikel2
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel10.6
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref2
        bwb_id: BWBR0011453
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref3
        bwb_id: BWBR0011453
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 10.6.5
    text: |-
      Voorts stelt de natuurlijke persoon of het bestuur, bedoeld in het vierde lid, na het einde van elk studiejaar
      vóór 1 november daaropvolgend Onze Minister in kennis welke studenten de norm van de studievoortgang, bedoeld
      in het tweede of derde lid, niet hebben behaald. Op de verstrekking van die gegevens zijn de krachtens
      [artikel 9.5, eerste lid][ref1], vastgestelde regels van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel9
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel10.6
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '9.2'
  - number: 10.6.6
    text: |-
      De natuurlijke persoon of het bestuur, bedoeld in het vierde lid, stuurt gelijktijdig een afschrift aan de
      betrokkene van de gegevens die hij over de betrokkene aan Onze Minister verstrekt en geeft daarbij tevens aan wat
      de consequenties op grond van deze wet zijn voor de vorm van de studiefinanciering van betrokkene alsmede welke
      beroepsgang voor betrokkene open staat.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel10.6
  - number: 10.6.7
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de mogelijkheid om studiepunten,
      behaald in een voorafgaand studiejaar mee te laten tellen bij de beoordeling van de vraag of aan de norm,
      bedoeld in het tweede lid, is voldaan. Bij algemene maatregel van bestuur kunnen tevens regels worden gesteld met
      betrekking tot de voorwaarden waaronder studiepunten die in enig jaar zijn behaald, leiden tot herziening van een
      beschikking, inhoudende de onvoorwaardelijke vorm van de aan de student toegekende studiefinanciering op grond
      van [artikel 10.7][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel10
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel10.6
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '10'
        hoofdstuk: '10'
  - number: 10.7.1
    text: |-
      Dit artikel is uitsluitend van toepassing op studenten die een opleiding volgen aan een onderwijsinstelling als
      bedoeld in de[ artikelen 2.8][ref1], [2.9][ref2] en [2.10][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0011453#Artikel2
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel10.7
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref2
        bwb_id: BWBR0011453
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref3
        bwb_id: BWBR0011453
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 10.7.2
    text: |-
      Ten aanzien van een student wordt de tempobeurs toegekend onder de voorwaarde dat de student over een studiejaar
      het in [artikel 10.6, tweede lid][ref1], of het krachtens [artikel 10.6, derde lid][ref2], vastgestelde resultaat
      behaalt.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel10
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel10.7
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '10'
        hoofdstuk: '10'
      - id: ref2
        bwb_id: BWBR0011453
        artikel: '10'
        hoofdstuk: '10'
  - number: 10.7.3
    text: |-
      Over het studiejaar waarin de student blijkens de mededeling aan Onze Minister, bedoeld
      in [artikel 10.6, vierde lid, tweede volzin][ref1], of de mededeling, bedoeld in
      [artikel 7.9a, tweede lid, van de WHW][ref2], de norm van de studievoortgang niet heeft behaald, wordt met
      ingang van 31 december van het kalenderjaar waarin het desbetreffende studiejaar is geëindigd, de tempobeurs
      van rechtswege omgezet in lening. Onze Minister maakt de omzetting zo spoedig mogelijk aan de student bekend.
      De tempobeurs van de studenten voor wie Onze Minister niet een mededeling als bedoeld in de eerste volzin, heeft
      ontvangen, wordt op 31 december van het kalenderjaar waarin het desbetreffende studiejaar is geëindigd, van
      rechtswege onvoorwaardelijk als gift vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel10.7
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '10'
        hoofdstuk: '10'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
  - number: 10.7.4
    text: |-
      Bij de beoordeling van de studievoortgang tellen de studiepunten mee die zijn behaald in
      opleidingen waarop [artikel 10.6][ref1] van toepassing is. Bij de beoordeling van de studievoortgang
      tellen niet mee de studiepunten die zijn behaald als gevolg van een vrijstelling als bedoeld in
      [artikel 7.13, tweede lid, onderdeel r, van de WHW][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel10.7
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '10'
        hoofdstuk: '10'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
  - number: 10.7.5
    text: |-
      Indien een student als bedoeld in het tweede lid, in het eerste studiejaar van inschrijving in het hoger onderwijs
      waarvoor hij op enig moment studiefinanciering geniet, ophoudt studiefinanciering te genieten vóór 1 februari,
      en hij niet over datzelfde studiejaar opnieuw studiefinanciering in de zin van dit hoofdstuk voor het volgen
      van hoger onderwijs krijgt toegekend, wordt aan het einde van dat studiejaar de tempobeurs voor dat studiejaar
      onvoorwaardelijk als gift vastgesteld.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel10.7
  - number: 10.7.6
    text: |-
      In het studiejaar waarin de student, bedoeld in het tweede lid, een opleiding waarvoor de student staat
      ingeschreven, met goed gevolg afrondt, wordt de tempobeurs voor dat studiejaar onvoorwaardelijk als gift
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel10.7
  - number: 10.7.7
    text: |-
      Indien een onderwijsinstelling als bedoeld in [artikel 10.6, tweede lid][ref1], niet na het einde van elk
      studiejaar voor 1 november daaropvolgend aan Onze Minister de gegevens, bedoeld in [artikel 7.9a van de WHW][ref2],
      of [artikel 10.6, vierde lid][ref3], heeft verstrekt, wordt de tempobeurs onvoorwaardelijk als gift vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0011453#Artikel10
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel10.7
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '10'
        hoofdstuk: '10'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0011453
        artikel: '10'
        hoofdstuk: '10'
  - number: 10.8.1
    text: 'Dit artikel is uitsluitend van toepassing op studenten die:'
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel10.8
  - number: 10.8.1.a
    text: |-
      na 31 augustus 1995 en voor 1 september 1996 voor het eerst voor het volgen van hoger onderwijs studiefinanciering
      ontvingen op grond van de [Wet op de studiefinanciering][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0003955
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel10.8
    references:
      - id: ref1
        bwb_id: BWBR0003955
  - number: 10.8.1.b
    text: |-
      een voltijdse opleiding volgen als bedoeld in [artikel 7.4, zesde lid, van de WHW][ref1] ,
      zoals dat artikel luidde op 31 augustus 2002, of het geheel van een bacheloropleiding als
      bedoeld in [artikel 7.4a, eerste lid, van de WHW][ref2] en een masteropleiding als bedoeld in
      [artikel 7.4a, vijfde lid, van de WHW][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel10.8
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0005682
        artikel: '7'
  - number: 10.8.2
    text: |-
      Indien aan een student na de periode van 5 jaren, genoemd in [artikel 10.3, tweede lid][ref1], op grond
      van [artikel 10.3, derde lid][ref2], studiefinanciering in de vorm van lening is verstrekt voor een periode
      van 2 jaren, vermeerderd met 1 jaar, en hij een door de onderwijsinstelling gewaarmerkte kopie van het
      getuigschrift van het met goed gevolg afgelegd hebben van het afsluitend examen van een zodanige opleiding
      aan Onze Minister overlegt, wordt zijn studiefinanciering over die leenperiode opnieuw vastgesteld alsof
      [artikel 10.3, derde lid, eerste volzin][ref3], over die periode niet van toepassing was geweest. Indien die
      leenperiode langer is dan 12 maanden, wordt de werking van de vorige volzin beperkt tot de eerste 12 maanden van
      die leenperiode.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0011453#Artikel10
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel10.8
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '10'
        hoofdstuk: '10'
      - id: ref2
        bwb_id: BWBR0011453
        artikel: '10'
        hoofdstuk: '10'
      - id: ref3
        bwb_id: BWBR0011453
        artikel: '10'
        hoofdstuk: '10'
  - number: 10.8.3
    text: |-
      Het tweede lid is niet van toepassing op maanden die deel uitmaken van een studiejaar waarin de student niet het
      in [artikel 10.6, tweede lid][ref1], genoemde aantal studiepunten heeft behaald. De eerste volzin is niet van
      toepassing op maanden van het studiejaar waarin de student de opleiding waarvoor hij staat ingeschreven, met goed
      gevolg afrondt.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel10
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel10.8
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '10'
        hoofdstuk: '10'
  - number: 10.8.4
    text: |-
      Het tweede lid is niet van toepassing, indien de daar bedoelde gewaarmerkte kopie van het getuigschrift niet binnen
      2 jaren na het einde van de leenperiode waarop het tweede lid, laatste volzin, betrekking heeft, of wanneer dat
      eerder is, binnen 6 maanden na de uitreiking van dat getuigschrift, aan Onze Minister is overgelegd.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel10.8
  - number: 10.8.5
    text: |-
      Bij het in het tweede lid bedoelde opnieuw vaststellen van de studiefinanciering wordt de per maand in aanmerking
      te nemen aanvullende beurs vastgesteld op het gemiddelde van de maandbedragen aan aanvullende beurs die aan de
      aanvrager voorwaardelijk zijn toegekend over de laatste 12 maanden van de in het tweede lid bedoelde periode van 5
      jaren. De toekenning van gift op grond van het tweede lid is een onvoorwaardelijke.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel10.8
  - number: 10a.1
    text: |-
      Dit hoofdstuk is uitsluitend van toepassing op debiteuren die voor het studiejaar 2009–2010 voor het eerst
      studiefinanciering ontvingen, tenzij zij een aanvraag hebben ingediend als bedoeld in [artikel 10a.2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel10a
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel10a.1
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: 10a
        hoofdstuk: 10a
  - number: 10a.2.1
    text: |-
      Een debiteur die voor het studiejaar 2009-2010 voor het eerst studiefinanciering ontving en voor wie op 31 december
      2011 nog geen aflosfase is aangevangen, kan, op aanvraag, zijn schuld aflossen op grond van [hoofdstuk 6][ref1].
      Een debiteur dient een aanvraag als bedoeld in de eerste volzin uitsluitend voor de aanvang van zijn aflosfase in.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel10a.2
    references:
      - id: ref1
        bwb_id: BWBR0011453
        hoofdstuk: '6'
  - number: 10a.2.2
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de goede uitvoering van het eerste
      lid.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel10a.2
  - number: 10a.3
    text: |-
      De [artikelen 6.1 tot en met 6.6][ref1], [6.8][ref2], [6.12][ref3], en [6.14 tot en met 6.17][ref4] zijn van
      overeenkomstige toepassing op debiteuren die onder dit hoofdstuk vallen.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0011453#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0011453#Artikel6
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel10a.3
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
      - id: ref2
        bwb_id: BWBR0011453
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
      - id: ref3
        bwb_id: BWBR0011453
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
      - id: ref4
        bwb_id: BWBR0011453
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 10a.4
    text: |-
      De aflosfase beslaat behoudens toepassing van [artikel 10a.6, derde lid][ref1], 15 kalenderjaren volgend op de
      aanloopfase. Deze periode wordt verlengd indien [artikel 10a.11, tweede lid][ref2], van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel10a
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel10a
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel10a.4
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: 10a
        hoofdstuk: 10a
      - id: ref2
        bwb_id: BWBR0011453
        artikel: 10a
        hoofdstuk: 10a
  - number: 10a.5.1
    text: |-
      In afwijking van [artikel 10a.4][ref1] kan een debiteur met ingang van 1 januari 2012 op aanvraag de terugbetaling
      voor ten hoogste 5 kalenderjaren opschorten.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel10a
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel10a.5
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: 10a
        hoofdstuk: 10a
  - number: 10a.5.2
    text: |-
      De aflosfase wordt verlengd met het aantal maanden dat gebruik is gemaakt van de aflosvrije periode op grond van
      het eerste lid.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel10a.5
  - number: 10a.5.3
    text: |-
      Bij ministeriële regeling kunnen voorschriften worden vastgesteld met betrekking tot de opschorting, bedoeld in het
      eerste lid.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel10a.5
  - number: 10a.6.1
    text: Rente en aflossing van de lening vervallen gedurende de aflosfase in maandelijkse termijnen.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel10a.6
  - number: 10a.6.2
    text: |-
      De hoogte van de maandelijkse termijnen wordt op basis van het aantal maanden van de aflosfase onderscheidenlijk
      het nog resterende aantal maanden van de aflosfase tot gelijke bedragen vastgesteld bij de aanvang van:
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel10a.6
  - number: 10a.6.2.a
    text: het eerste jaar van de aflosfase,
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel10a.6
  - number: 10a.6.2.b
    text: het vierde jaar van de aflosfase, en
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel10a.6
  - number: 10a.6.2.c
    text: ieder vijfde jaar na het vierde jaar van de aflosfase.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel10a.6
  - number: 10a.6.3
    text: |-
      Onverminderd [artikel 10a.7, eerste lid][ref1], bedraagt het totaal per jaar te betalen bedrag aan maandelijkse
      termijnen ten minste € 545,–. Bij ministeriële regeling kan dit bedrag gelet op de loonontwikkeling worden herzien.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel10a
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel10a.6
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: 10a
        hoofdstuk: 10a
  - number: 10a.6.4
    text: |-
      Rente en aflossing van de lening van een debiteur die in het buitenland woont, vervallen, in afwijking van
      het eerste lid, gedurende de aflosfase in jaarlijkse termijnen. Indien die debiteur zich voor het einde van
      een jaartermijn metterwoon in Nederland vestigt, wordt hij tot het einde van die jaartermijn behandeld als een
      debiteur die in het buitenland woont. De [artikelen 6.4][ref1] en [6.6][ref2] zijn in dat geval van overeenkomstige
      toepassing. Op aanvraag van een in de eerste volzin bedoelde debiteur besluit Onze Minister dat de rente en
      aflossing van de lening niet vervallen in jaarlijkse termijnen maar in maandelijkse termijnen.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel6
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel10a.6
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
      - id: ref2
        bwb_id: BWBR0011453
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 10a.6.5
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld voor de vaststelling en betaling van de
      terugbetalingstermijnen.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel10a.6
  - number: 10a.7.1
    text: |-
      Indien de debiteur niet in staat is de vastgestelde termijn te voldoen, kan hij gedurende de aflosfase bij de IB-
      Groep een aanvraag indienen om zijn draagkracht vast te stellen voor de resterende aflosfase.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel10a.7
  - number: 10a.7.2
    text: De draagkracht van de debiteur is zijn draagkracht uit inkomen.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel10a.7
  - number: 10a.7.3
    text: |-
      Bij ministeriële regeling kunnen voorschriften worden vastgesteld met betrekking tot de in het eerste lid bedoelde
      aanvraag.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel10a.7
  - number: 10a.7.4
    text: |-
      Indien het bedrag van de draagkracht hoger is dan het bedrag van de vastgestelde termijn, betaalt de debiteur het
      bedrag van de vastgestelde termijn.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel10a.7
  - number: 10a.8.1
    text: |-
      Maatstaf voor de vaststelling van de draagkracht van de debiteur uit inkomen is zijn toetsingsinkomen in het tweede
      jaar voorafgaande aan het jaar waarvoor de draagkracht wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel10a.8
  - number: 10a.8.2
    text: |-
      Op het toetsingsinkomen wordt in mindering gebracht de draagkrachtvrije voet. Deze voet is gelijk aan
      het belastbare minimumloon in het tweede jaar voorafgaande aan het jaar waarvoor de draagkracht wordt
      vastgesteld, indien voor de debiteur voor de inkomstenbelasting – naast de algemene heffingskorting – de
      alleenstaande-ouderkorting, of voor zijn partner de verhoging van de gecombineerde heffingskorting, bedoeld in
      [artikel 8.9 van de Wet inkomstenbelasting 2001][ref1], van toepassing is. Indien voor de debiteur de verhoging
      van de gecombineerde heffingskorting, bedoeld in [artikel 8.9 van de Wet inkomstenbelasting 2001][ref2], of
      de algemene heffingskorting maar niet de alleenstaande-ouderkorting van toepassing is, is de draagkrachtvrije
      voet 0%, onderscheidenlijk 50% van de voet die van toepassing zou zijn indien voor de debiteur – naast de
      algemene heffingskorting – voor zijn partner de verhoging van de gecombineerde heffingskorting, bedoeld in
      [artikel 8.9 van de Wet inkomstenbelasting 2001][ref3] van toepassing zou zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel8
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel10a.8
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0011353
        artikel: '8'
  - number: 10a.8.3
    text: |-
      Het resterende inkomen wordt verdeeld in 2 schijven ter grootte van de helft van de in het tweede lid bedoelde
      draagkrachtvrije voet alsmede een derde schijf ter grootte van 260% van het belastbare minimumloon in het tweede
      jaar voorafgaande aan het jaar waarvoor de draagkracht wordt vastgesteld, verminderd met de draagkrachtvrije voet
      en de eerste en de tweede schijf.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel10a.8
  - number: 10a.8.4
    text: |-
      Indien de debiteur of zijn partner een toetsingsinkomen heeft dat kleiner is dan de som van de in het tweede lid
      bedoelde draagkrachtvrije voet en de eerste 3 volle schijven, bedoeld in het derde lid, wordt het deel van de
      draagkrachtvrije voet en de eerste 3 schijven dat nog niet is benut, overgeheveld naar de ander. Daarbij wordt het
      onbenutte deel van een schijf toegevoegd aan de overeenkomstige schijf van de ander en het onbenutte deel van de
      draagkrachtvrije voet aan de draagkrachtvrije voet van de ander.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel10a.8
  - number: 10a.8.5
    text: |-
      Indien de debiteur en zijn partner een toetsingsinkomen hebben dat kleiner is dan de som van de in het tweede
      lid bedoelde draagkrachtvrije voet en de eerste 3 volle schijven, bedoeld in het derde lid, wordt het vierde lid
      toegepast in die zin dat van de debiteur of zijn partner met het laagste toetsingsinkomen het onbenutte deel van de
      draagkrachtvrije voet en de eerste 3 schijven wordt overgeheveld naar de ander.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel10a.8
  - number: 10a.8.6
    text: |-
      De draagkracht van de debiteur uit inkomen is 7,9% van de eerste schijf plus 15,8% van de tweede schijf plus 23,7%
      van de derde schijf plus 30% van het meerdere.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel10a.8
  - number: 10a.8.7
    text: |-
      In afwijking van het tweede tot en met het zesde lid is de draagkracht uit inkomen van een debiteur met een
      toetsingsinkomen lager dan een bij ministeriële regeling vast te stellen minimumbedrag nihil. Deze regeling wordt
      jaarlijks voor 1 januari vastgesteld en kan voor verschillende groepen debiteuren verschillend luiden.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel10a.8
  - number: 10a.8.8
    text: |-
      Voor de toepassing van dit artikel wordt indien het toetsingsinkomen of het belastbaar loon in het tweede jaar
      voorafgaande aan het jaar waarvoor de draagkracht wordt vastgesteld, nog niet bekend is, door de IB-Groep daarvoor
      in de plaats gesteld een bedrag dat het vast te stellen toetsingsinkomen of het belastbaar loon benadert.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel10a.8
  - number: 10a.9
    text: |-
      Indien voor de debiteur voor de inkomstenbelasting na het tweede jaar voorafgaande aan het jaar
      waarvoor de draagkracht wordt vastgesteld – naast de algemene heffingskorting – de alleenstaande-
      ouderkorting, of voor zijn partner de verhoging van de gecombineerde heffingskorting, bedoeld in
      [artikel 8.9 van de Wet inkomstenbelasting 2001][ref1], van toepassing wordt, wordt op aanvraag van de debiteur de
      hoogte van zijn draagkracht dienovereenkomstig aangepast.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel8
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel10a.9
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '8'
  - number: 10a.10.1
    text: |-
      Indien de debiteur op grond van zijn draagkracht niet in staat is de vastgestelde termijn te betalen, wordt de
      draagkracht van de partner berekend overeenkomstig de artikelen [10a.7][ref1], [10a.8][ref2], [6.12][ref3] en
      [6.13][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel10a
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel10a
      [ref3]: https://wetten.overheid.nl/BWBR0011453#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0011453#Artikel6
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel10a.10
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: 10a
        hoofdstuk: 10a
      - id: ref2
        bwb_id: BWBR0011453
        artikel: 10a
        hoofdstuk: 10a
      - id: ref3
        bwb_id: BWBR0011453
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
      - id: ref4
        bwb_id: BWBR0011453
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 10a.10.2
    text: |-
      Indien de draagkracht van de debiteur niet voldoende is voor het betalen van de termijn, bedoeld in artikel
      [10a.6, tweede lid][ref1], wordt de draagkracht van de partner aangewend voor het resterende gedeelte.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel10a
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel10a.10
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: 10a
        hoofdstuk: 10a
  - number: 10a.11.1
    text: |-
      Bij de bepaling van de draagkracht van de debiteur wordt geen rekening gehouden met het inkomen van de partner
      indien een van beiden hiertoe een aanvraag indient.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel10a.11
  - number: 10a.11.2
    text: |-
      Voor ieder jaar dat op grond van de toepassing van het eerste lid geen rekening wordt gehouden met het inkomen van
      de partner van de debiteur wordt de aflosfase verlengd met een jaar.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel10a.11
  - number: 10a.12
    text: |-
      Indien de partner van de debiteur ook een debiteur is en op beide debiteuren hoofdstuk 10a van toepassing is,
      wordt zijn draagkracht eerst aangewend voor de eigen termijn. Op het bedrag dat aan draagkracht resteert is
      [artikel 10a.10, tweede lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel10a
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel10a.12
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: 10a
        hoofdstuk: 10a
  - number: 10a.13.1
    text: |-
      Indien de partner van de debiteur een debiteur is op wie [hoofdstuk 6][ref1] van toepassing is, blijft
      [artikel 10a.10, eerste lid][ref2], buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Hoofdstuk6
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel10a
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel10a.13
    references:
      - id: ref1
        bwb_id: BWBR0011453
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0011453
        artikel: 10a
        hoofdstuk: 10a
  - number: 10a.13.2
    text: |-
      Bij de toepassing van [artikel 10a.10, tweede lid][ref1], wordt de draagkracht van de debiteur op wie
      [hoofdstuk 6][ref2] van toepassing is, aangewend, voor zover het bedrag van de draagkracht groter is dan de
      vastgestelde termijn, bedoeld in [artikel 6.9, tweede lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel10a
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Hoofdstuk6
      [ref3]: https://wetten.overheid.nl/BWBR0011453#Artikel6
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel10a.13
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: 10a
        hoofdstuk: 10a
      - id: ref2
        bwb_id: BWBR0011453
        hoofdstuk: '6'
      - id: ref3
        bwb_id: BWBR0011453
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 11.1.1
    text: |-
      Per 1 januari van ieder kalenderjaar past Onze Minister de bedragen, genoemd in de
      [artikelen 3.4, tweede lid][ref1], [3.9, derde lid][ref2], [3.18][ref3], met uitzondering van de maximale
      aanvullende beurs, [4.7][ref4], [4.18][ref5], [5.2][ref6] en [10.3][ref7], aan op een bij of krachtens algemene
      maatregel van bestuur aan te geven wijze aan de hand van de loon- of prijsontwikkelingen in het tweede daaraan
      voorafgaande kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011453#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0011453#Artikel4
      [ref5]: https://wetten.overheid.nl/BWBR0011453#Artikel4
      [ref6]: https://wetten.overheid.nl/BWBR0011453#Artikel5
      [ref7]: https://wetten.overheid.nl/BWBR0011453#Artikel10
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel11.1
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref2
