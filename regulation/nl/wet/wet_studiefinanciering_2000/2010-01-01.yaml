  - number: 12.1ca
    text: |-
      Voor een studerende die reeds voor de inwerkingtreding van [artikel 2.17][ref1] studiefinanciering ontving en wiens
      vrijheid op de dag voorafgaande aan de inwerkingtreding van [artikel 2.17][ref2] rechtens was ontnomen, wordt voor
      de toepassing van [dat artikel][ref3] als eerste dag waarop de vrijheidsontneming plaatsvindt, aangemerkt de dag
      van inwerkingtreding van [artikel 2.17][ref4] en eindigt de aanspraak op studiefinanciering voor uitwonenden in
      afwijking van [artikel 2.17, eerste lid][ref5], vanaf de dag dat deze vrijheidsontneming zes maanden heeft geduurd.
      De beëindiging gaat in op de eerste dag van de maand volgend op de maand waarin de vrijheidsontneming als bedoeld
      in de eerste zin zes maanden heeft geduurd.


