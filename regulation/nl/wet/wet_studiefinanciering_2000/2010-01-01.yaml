      - id: ref3
        bwb_id: BWBR0026016
  - number: 12.13.1
    text: |-
      Aanvragen op grond van de [Wet op de studiefinanciering][ref1] worden van rechtswege omgezet in een aanvraag op
      grond van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0003955
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel12.13
    references:
      - id: ref1
        bwb_id: BWBR0003955
  - number: 12.13.2
    text: |-
      Studiefinanciering die op grond van de [Wet op de studiefinanciering][ref1] is toegekend, wordt van rechtswege
      omgezet in studiefinanciering op grond van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0003955
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel12.13
    references:
      - id: ref1
        bwb_id: BWBR0003955
  - number: 12.13.3
    text: |-
      Verplichtingen die op grond van de [Wet op de studiefinanciering][ref1] bestaan, worden van rechtswege omgezet in
      verplichtingen op grond van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0003955
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel12.13
    references:
      - id: ref1
        bwb_id: BWBR0003955
  - number: 14.1.1
    text: |-
      De [Wet op de studiefinanciering][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0003955
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel14.1
    references:
      - id: ref1
        bwb_id: BWBR0003955
  - number: 14.1.2
    text: |-
      In afwijking van het eerste lid blijft [hoofdstuk VII van de Wet op de studiefinanciering][ref1] met uitzondering
      van artikel 119b van kracht tot een bij koninklijk besluit te bepalen tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0003955#HoofdstukVII
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel14.1
    references:
