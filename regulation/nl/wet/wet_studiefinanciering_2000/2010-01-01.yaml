      Onze Minister verlengt op aanvraag van de student het aantal jaren tempobeurs, bedoeld in dit artikel,
      eenmalig met 12 maanden, indien de student blijkens gedagtekende verklaringen van een arts en van het bestuur
      van de onderwijsinstelling waar hij is ingeschreven, als gevolg van een lichamelijke, zintuiglijke of andere
      functiestoornis niet in staat is het afsluitend examen met goed gevolg af te ronden binnen dat aantal jaren
      tempobeurs.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel10.5
  - number: 10.5.7
    text: |-
      Indien een student gelijktijdig staat ingeschreven voor meer dan een studie, waaronder een studie als bedoeld in
      het derde, vierde of vijfde lid, wordt de periode van 5 jaren, genoemd in [artikel 10.3, tweede lid][ref1], slechts
      verlengd nadat hij aan Onze Minister een verklaring van het instellingsbestuur verstrekt waaruit blijkt dat de
      student 240 studiepunten heeft behaald van een studie die moet leiden tot verlenging. De verklaring, bedoeld in de
      eerste volzin, dient eveneens te worden verstrekt, indien de gelijktijdige inschrijving voor meer dan een studie
      aanvangt nadat reeds een verlenging is verleend op grond van het tweede, derde of vierde lid, en de inschrijving
      voor de studie op grond waarvan die verlenging is verleend niet wordt gestaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel10
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel10.5
