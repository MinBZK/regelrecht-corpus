  - number: 12.11.1
    text: |-
      Op besluiten met betrekking tot studiefinanciering voor het kalenderjaar 2006 zijn de bepalingen, opgenomen in
      [hoofdstuk 1, afdeling C, artikel I, van de Aanpassingswet Algemene wet inkomensafhankelijke regelingen][ref1]
      van toepassing.


