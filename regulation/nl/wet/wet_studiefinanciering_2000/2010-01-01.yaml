  - number: 6.16.1
    text: De schuld die resteert bij het einde van de aflosfase, gaat op dat ogenblik teniet.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel6.16
  - number: 6.16.2
    text: De schuld die resteert bij het overlijden van de debiteur, gaat op dat ogenblik teniet.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel6.16
  - number: 6.17.1
    text: |-
      Op het ogenblik van beëindiging van het recht op studiefinanciering van een studerende wordt zijn schuld, ontstaan
      in het kader van de toepassing van deze wet, van rechtswege omgezet in een lening.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel6.17
  - number: 6.17.2
    text: |-
      Indien na beëindiging van het recht op studiefinanciering van een studerende door een beschikking op grond
      van [artikel 7.1][ref1] een vordering ontstaat van Onze Minister, wordt die vordering omgezet in een lening
      op de eerste dag van de maand na de herziening. Bij de berekening van de rente voor die vordering wordt het
      rentepercentage gehanteerd dat geldt met ingang van 1 januari volgend op het kalenderjaar waarin de studerende is
      opgehouden studerende te zijn. Indien de omzetting plaatsvindt in het kalenderjaar waarin de studerende ophoudt
      studerende te zijn, wordt het rentepercentage gehanteerd dat geldt met ingang van 1 januari van dat kalenderjaar.
      [Artikel 6.4, derde lid, laatste volzin][ref2], is bij de berekening van rente van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel6
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel6.17
    references:
