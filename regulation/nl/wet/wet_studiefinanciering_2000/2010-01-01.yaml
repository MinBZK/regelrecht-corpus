      [hoofdstuk 1, afdeling C, artikel II, van de Aanpassingswet Algemene wet inkomensafhankelijke regelingen][ref1]
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018471#ArtikelII
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel12.11
