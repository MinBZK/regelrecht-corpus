        paragraaf: '6.1'
  - number: 6.14.2
    text: |-
      Indien de debiteur een partner heeft op wie hoofdstuk 10a van toepassing is, wordt het op grond van
      [artikel 6.10][ref1] berekende bedrag van de draagkracht van de debiteur verminderd met de op grond
      van [artikel 10a.6][ref2] voor zijn partner vastgestelde terugbetalingstermijn, danwel de op grond van
      [artikel 10a.7][ref3] berekende draagkracht van zijn partner. Indien de uitkomst negatief is wordt de draagkracht
      van de debiteur op nihil vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel10a
      [ref3]: https://wetten.overheid.nl/BWBR0011453#Artikel10a
