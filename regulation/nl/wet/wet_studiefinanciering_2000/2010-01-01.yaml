    text: |-
      Studiefinanciering met uitzondering van de reisvoorziening wordt gedurende 5 jaren of het aantal jaren genoemd in
      [artikel 10.5][ref1], verstrekt in de vorm van een tempobeurs. De reisvoorziening wordt verstrekt in de vorm van
      een gift.


