  - number: '6.15'
    text: |-
      Indien een debiteur gedurende een kalenderjaar op grond van zijn draagkracht minder heeft betaald dan de termijn,
      bedoeld in [artikel 6.9, tweede lid][ref1], wordt zijn termijn opnieuw vastgesteld per 1 januari van het jaar
      daaropvolgend. De gewijzigde termijn wordt vastgesteld op basis van het resterende aantal maanden van de aflosfase.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel6
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel6.15
