  - number: 5.2.2
    text: Indien aan de voorwaarden, bedoeld in dit hoofdstuk, wordt voldaan wordt de prestatiebeurs omgezet in een gift.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel5.2
  - number: 5.2.3
    text: |-
      Studiefinanciering, met uitzondering van het collegegeldkrediet, wordt gedurende 36 maanden na de periode, bedoeld
      in het eerste lid, verstrekt in de vorm van een lening. Het bedrag dat per maand kan worden geleend, bedraagt in
      afwijking van de [artikelen 3.1, derde lid][ref1], [3.2][ref2], [3.3][ref3], [3.13][ref4] en [3.18][ref5], naar de
      maatstaf van 1 januari 2007 € 809,93 . Tevens kan een reisvoorziening worden verstrekt.


