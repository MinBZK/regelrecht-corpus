        paragraaf: '3.3'
      - id: ref5
        bwb_id: BWBR0011453
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.5'
  - number: 5.2.4
    text: |-
      De basislening en de aanvullende lening kunnen gedurende de periode, bedoeld in het eerste lid, worden verstrekt.
      Het collegegeldkrediet kan gedurende de periode bedoeld in het eerste en derde lid worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel5.2
  - number: 5.2.5
    text: |-
      Op aanvraag kan een student als bedoeld in [artikel 3.4][ref1], gedurende de in het derde lid bedoelde periode
      tevens in aanmerking komen voor een lening ter grootte van het bedrag, bedoeld in [artikel 3.4, derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel3
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel5.2
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0011453
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 5.2.6
    text: |-
      Op aanvraag kan een student als bedoeld in [artikel 3.5][ref1], gedurende de in het derde lid bedoelde periode
      tevens in aanmerking komen voor een lening ter grootte van het bedrag, bedoeld in [artikel 3.5, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel3
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel5.2
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0011453
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 5.3.1
    text: |-
      In afwijking van [artikel 5.2, eerste lid][ref1], wordt de studiefinanciering in de vorm van een reisvoorziening
      verstrekt in de vorm van een prestatiebeurs gedurende het in dat lid bedoelde aantal jaren, vermeerderd met 3
      jaren.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel5
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel5.3
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 5.3.2
    text: |-
      Het deel van de prestatiebeurs dat betrekking heeft op het recht op de reisvoorziening, is gelijk aan eentwaalfde
      deel van de waarde die daarvoor per studerende door het vervoerbedrijf aan Onze Minister in rekening wordt
      gebracht. De waarde wordt berekend door de voorlopige vergoeding voor het lopende kalenderjaar te corrigeren naar
      de correctie die de voorlopige vergoeding voor het tweede daaraan voorafgaande kalenderjaar onderging. Dit deel van
      de prestatiebeurs wordt niet uitbetaald of verrekend.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel5.3
  - number: 5.3.3
    text: |-
      Indien de prestatiebeurs niet kan worden omgezet in een gift, wordt de tegenwaarde van de reisvoorziening
      kwijtgescholden over een maand waarover het reisrecht niet op een OV-chipkaart is geactiveerd als bedoeld in
      [artikel 3.26][ref1] of is beëindigd als bedoeld in [artikel 3.27][ref2]. In afwijking van [artikel 1.2][ref3]
      is bepalend de toestand op enig moment van de maand. De over het kwijt te schelden bedrag opgebouwde rente
      gaat dan teniet. De kwijtschelding is niet van toepassing op een maand waarin een vergoeding als bedoeld in
      [artikel 3.7, tweede of derde lid][ref4], is toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011453#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0011453#Artikel3
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel5.3
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.7'
      - id: ref2
        bwb_id: BWBR0011453
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.7'
      - id: ref3
        bwb_id: BWBR0011453
        artikel: '1'
        hoofdstuk: '1'
      - id: ref4
        bwb_id: BWBR0011453
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '5.5'
    text: |-
      De diplomatermijn hoger onderwijs is een periode van 10 jaren. Deze periode vangt aan op de eerste dag van de maand
      waarover voor het eerst studiefinanciering is toegekend voor het volgen van hoger onderwijs.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel5.5
  - number: 5.6.1
    text: |-
      De prestatiebeurs wordt gedurende meer dan 4 jaren verstrekt voor het geheel van een bacheloropleiding
      als bedoeld in [artikel 7.4a, eerste lid van de WHW][ref1] en een masteropleiding als bedoeld in
      [artikel 7.4a, derde, vierde, vijfde of zesde lid, van de WHW][ref2]. De duur van de prestatiebeurs van 48
      maanden wordt met een maand verlengd voor elke 5 studiepunten die de studielast van de masteropleiding boven de 60
      studiepunten telt. Indien het aantal studiepunten boven de 60 geen veelvoud van 5 betreft, wordt de prestatiebeurs
      voor het geheel van studiepunten dat overblijft na toepassing van de vorige volzin, met een maand verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel5.6
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
  - number: 5.6.2
    text: 'De prestatiebeurs wordt gedurende 6,5 jaren verstrekt indien het betreft:'
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel5.6
  - number: 5.6.2.a
    text: |-
      het geheel van een bacheloropleiding en een masteropleiding in de godgeleerdheid aan een openbare of bijzondere
      universiteit dat, blijkens het onderwijs- en examenprogramma, wordt gevolgd in combinatie met het onderwijs in het
      kader van een opleiding vanwege een kerkgenootschap tot leraar of ambtsdrager van dat kerkgenootschap, en
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel5.6
  - number: 5.6.2.b
    text: |-
      een opleiding met een studielast van 360 studiepunten gericht op een godsdienstig of levensbeschouwelijk ambt
      aan een bijzondere instelling voor wetenschappelijk onderwijs of het geheel van een bacheloropleiding en een
      masteropleiding godgeleerdheid binnen het wetenschappelijk onderwijs aan een aangewezen instelling als bedoeld in
      [artikel 6.9 van de WHW][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel6
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel5.6
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '6'
  - number: 5.6.3
    text: |-
      De prestatiebeurs wordt gedurende 7 jaar verstrekt voor het geheel van een bacheloropleiding als bedoeld
      in [artikel 7.4a, eerste lid, eerste volzin, van de WHW ][ref1]en een masteropleiding als bedoeld in
      [artikel 7.4a, zevende lid, van de WHW][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel5.6
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
  - number: 5.6.4
    text: |-
      De duur van de prestatiebeurs wordt ten hoogste met 1 jaar verlengd indien het een bacheloropleiding als bedoeld in
      [artikel 7.4a, eerste lid, tweede volzin, van de WHW][ref1] betreft. Het eerste lid, tweede en derde volzin, is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel5.6
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
  - number: 5.6.5
    text: 'De duur van de prestatiebeurs wordt op aanvraag met 1 jaar verlengd indien het betreft:'
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel5.6
  - number: 5.6.5.a
    text: |-
      een student die met goed gevolg het afsluitende examen van een bacheloropleiding heeft behaald, voorzover bij
      ministeriële regeling aangewezen, of een daarmee gelijk gesteld diploma, en
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel5.6
  - number: 5.6.5.b
    text: |-
      deze student is ingeschreven voor de hbo-lerarenopleiding, voor een daarbinnen te volgen eenjarig programma,
      waarvan in bedoelde ministeriële regeling is aangegeven dat die opleiding verwant is aan de onder a bedoelde
      opleiding.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel5.6
  - number: 5.6.6
    text: |-
      De duur van de prestatiebeurs wordt op aanvraag met 1 jaar verlengd indien het een masteropleiding als bedoeld in
      [artikel 7.30c van de WHW][ref1] betreft. De eerste volzin is niet van toepassing indien eerder op grond van het
      zevende lid van dit artikel prestatiebeurs is toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel5.6
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
  - number: 5.6.7
    text: |-
      De duur van de prestatiebeurs wordt op aanvraag met 1 jaar verlengd indien met goed gevolg het afsluitende examen
      van een masteropleiding als bedoeld in [artikel 7.4a, met uitzondering van het derde lid, van de WHW][ref1] is
      behaald en daarna een masteropleiding als bedoeld in [artikel 7.4a, derde lid, van de WHW][ref2] wordt gevolgd.
      De eerste volzin is niet van toepassing indien eerder op grond van het vijfde of zesde lid van dit artikel
      prestatiebeurs is toegekend. De eerste volzin is eveneens niet van toepassing indien eerder op grond van het
      negende lid van dit artikel prestatiebeurs is toegekend, voor zover dat betrekking had op een opleiding tot leraar
      voortgezet onderwijs van de eerste graad in algemene vakken.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel5.6
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
  - number: 5.6.8
    text: |-
      De duur van de prestatiebeurs wordt op aanvraag met 1 jaar verlengd indien reeds eerder prestatiebeurs is toegekend
      op grond van het vijfde lid en een masteropleiding als bedoeld in [artikel 7.4a, derde lid, van de WHW][ref1] wordt
      gevolgd.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel5.6
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
  - number: 5.6.9
    text: |-
      De duur van de prestatiebeurs wordt met 1 jaar verlengd indien het een masteropleiding als bedoeld in
      [artikel 7.4b, tweede lid, van de WHW][ref1] betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel5.6
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
  - number: 5.6.10
    text: |-
      Onze Minister verlengt op aanvraag van de student de duur van de prestatiebeurs eenmalig met 1 jaar indien de
      student blijkens gedagtekende verklaringen van een arts en van het bestuur van de onderwijsinstelling waar hij
      is ingeschreven, als gevolg van een lichamelijke, zintuiglijke of andere functiestoornis niet in staat is het
      afsluitend examen met goed gevolg af te ronden binnen dat aantal jaren prestatiebeurs.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel5.6
  - number: 5.7.1
    text: |-
      Indien een student binnen de diplomatermijn hoger onderwijs het afsluitend examen van een hbo bacheloropleiding
      als bedoeld in [artikel 7.3a, tweede lid, onderdeel a][ref1], of het geheel van een wo-bacheloropleiding en een
      wo-masteropleiding als bedoeld in [artikel 7.3a, eerste lid, onderdelen a en b, van de WHW][ref2] met goed gevolg
      heeft afgesloten, wordt de aan hem toegekende prestatiebeurs omgezet in een gift.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel5.7
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
  - number: 5.7.2
    text: |-
      Indien een student binnen de diplomatermijn hoger onderwijs het afsluitend examen van een opleiding in
      het hoger onderwijs met goed gevolg heeft afgesloten, wordt de resterende periode van zijn prestatiebeurs
      verstrekt in de vorm van een gift indien hij een andere opleiding in de zin van deze wet of een voltijdse
      masteropleiding als bedoeld in [artikel 7.3b van de WHW][ref1] die is geaccrediteerd als bedoeld in
      [artikel 1.1, onderdeel s, van de WHW][ref2] aanvangt.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel5.7
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '1'
  - number: 5.7.3
    text: |-
      Met een afsluitend examen wordt gelijkgesteld het examen van een deeltijdse opleiding of een opleiding van de Open
      Universiteit, voor zover deze examens door de [WHW][ref1] daarmee gelijk worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005682
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel5.7
    references:
      - id: ref1
        bwb_id: BWBR0005682
  - number: 5.7.4
    text: |-
      Met een afsluitend examen wordt eveneens gelijkgesteld het examen van een bacheloropleiding in het wetenschappelijk
      onderwijs en het examen van een programma als bedoeld in [artikel 7.8a van de WHW][ref1], voorzover de student
      daartoe een aanvraag heeft ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel5.7
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
  - number: 5.8.1
    text: |-
      Indien een student met goed gevolg het afsluitend examen heeft behaald van een opleiding waarvan de studielast is
      gebaseerd op een periode van minder dan 4 jaren overeenkomstig [artikel 5.2, eerste lid][ref1], wordt het aantal om
      te zetten maanden van zijn prestatiebeurs met dit verschil verminderd.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel5
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel5.8
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 5.8.2
    text: |-
      Het aantal om te zetten maanden van zijn prestatiebeurs wordt met 12 verminderd, indien een student met goed
      gevolg het afsluitend examen heeft behaald van een opleiding ten aanzien waarvan [artikel 7.31a van de WHW][ref1]
      is toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel5.8
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
  - number: 5.8.3
    text: |-
      Indien een student een aanvraag als bedoeld in [artikel 5.7, vierde lid][ref1], heeft ingediend, wordt het aantal
      maanden, bedoeld in het eerste lid, van de aan hem toegekende prestatiebeurs omgezet in een gift.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel5
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel5.8
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: 5.9.1
    text: |-
      De omzetting, bedoeld in [artikel 5.7][ref1], vindt plaats per 1 januari van het kalenderjaar volgend op
      de verzending van de mededeling, bedoeld in [artikel 7.9d van de WHW][ref2], of de mededeling, bedoeld in
      [artikel 9.5, derde lid][ref3]. Zo spoedig mogelijk na de omzetting stelt Onze Minister de student daarvan in
      kennis.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0011453#Artikel9
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel5.9
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.2'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0011453
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '9.2'
  - number: 5.9.2
    text: |-
      Een student die het examen, bedoeld in de [artikelen 5.7][ref1] of [5.8][ref2], met goed gevolg heeft afgelegd
      aan een instelling waarop [artikel 7.9d van de WHW][ref3] niet van toepassing is, zendt uiterlijk 3 maanden
      na het verstrijken van de diplomatermijn hoger onderwijs, een door de betrokken instelling van hoger onderwijs
      gewaarmerkte kopie van het aan dat examen verbonden diploma aan Onze Minister en dient daarbij een aanvraag in tot
      omzetting van de prestatiebeurs. Op die kopie vermeldt de instelling de datum waarop het examen met goed gevolg is
      afgesloten. De omzetting vindt plaats per 1 januari van het kalenderjaar volgend op de aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel5.9
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.2'
      - id: ref2
        bwb_id: BWBR0011453
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.2'
      - id: ref3
        bwb_id: BWBR0005682
        artikel: '7'
  - number: 5.9.3
    text: |-
      Het tweede lid is van overeenkomstige toepassing op de omzetting van de prestatiebeurs ingevolge
      [artikel 5.7, vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel5
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel5.9
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: '5.10'
    text: |-
      Indien een student in het studiejaar waarvoor hij op enig moment voor het eerst prestatiebeurs geniet, ophoudt
      studiefinanciering te genieten vóór 1 februari, en hij niet over datzelfde studiejaar opnieuw studiefinanciering
      voor het volgen van hoger onderwijs krijgt toegekend, wordt op 1 januari van het kalenderjaar volgend op dat
      studiejaar de in dat studiejaar toegekende prestatiebeurs omgezet in een gift.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel5.10
  - number: '5.11'
    text: |-
      Indien een student in het studiejaar waarvoor hij op enig moment na 31 januari voor het eerst prestatiebeurs
      geniet, ophoudt studiefinanciering te genieten vóór 1 september, en hij niet vóór 1 februari van het daaropvolgende
      studiejaar opnieuw studiefinanciering voor het volgen van hoger onderwijs krijgt toegekend, wordt per 1 januari
      van het kalenderjaar volgend op het laatstbedoelde studiejaar de in het eerste studiejaar toegekende prestatiebeurs
      omgezet in een gift.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel5.11
  - number: '5.15'
    text: |-
      Indien een student op enig moment binnen de diplomatermijn hoger onderwijs in staat wordt
      om met arbeid niet meer dan 20% te verdienen van het maatmaninkomen in de zin van de
      [Wet werk en arbeidsondersteuning jonggehandicapten][ref1], wordt de aan hem toegekende prestatiebeurs omgezet in
      een gift.


      [ref1]: https://wetten.overheid.nl/BWBR0008657
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel5.15
    references:
      - id: ref1
        bwb_id: BWBR0008657
  - number: 5.16.1
    text: |-
      Indien een student als direct gevolg van bijzondere omstandigheden van tijdelijke aard niet in staat is binnen de
      diplomatermijn hoger onderwijs met goed gevolg het afsluitend examen te behalen, wordt deze termijn verlengd met de
      duur van die bijzondere omstandigheden.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel5.16
  - number: 5.16.2
    text: |-
      Indien een student als direct gevolg van bijzondere omstandigheden van structurele aard niet in staat is met goed
      gevolg het afsluitend examen te behalen, wordt de aan hem toegekende prestatiebeurs omgezet in een gift. Onder
      bijzondere omstandigheden van structurele aard kunnen in ieder geval worden verstaan functiebeperking of chronische
      ziekte.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel5.16
  - number: 5.16.3
    text: |-
      Indien een student als direct gevolg van een tijdens de studie verworven handicap, ten gevolge van een zich
      tijdens de studie verergerende handicap of ten gevolge van een zich tijdens de studie manifesterende chronische
      ziekte genoodzaakt is een reeds begonnen opleiding te beëindigen, ontvangt de student bij keuze voor een passender
      opleiding nieuwe aanspraak op studiefinanciering.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel5.16
  - number: 5.16.4
    text: |-
      Onze Minister stelt op aanvraag van de student vast of er sprake is van bijzondere omstandigheden in de zin van
      dit artikel. De bijzondere omstandigheden kunnen uitsluitend worden aangetoond door gedagtekende verklaringen
      van een arts en de natuurlijke persoon of het bestuur van de rechtspersoon van de onderwijsinstelling waar
      hij is ingeschreven. Indien de bijzondere omstandigheden uitsluitend van niet-medische aard zijn, volstaat een
      gedagtekende verklaring van de natuurlijke persoon of het bestuur van de rechtspersoon van de onderwijsinstelling
      waar de student is ingeschreven.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel5.16
  - number: '5.17'
    text: |-
      Bij omzetting van een prestatiebeurs of een deel daarvan in een gift gaat de over het om te zetten bedrag
      opgebouwde rente teniet.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel5.17
  - number: '6.1'
    text: In dit hoofdstuk wordt onder lening mede verstaan de prestatiebeurs.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel6.1
  - number: 6.2.1
    text: |-
      Ontvangst van een lening of omzetting in een lening, of omzetting als bedoeld in [artikel 6.17][ref1], verplicht
      degene die studiefinanciering heeft ontvangen tot terugbetaling van de lening vermeerderd met de volgens dit
      hoofdstuk berekende rente.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel6
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 6.2.2
    text: |-
      De vanaf de dertiende maand waarvoor na het studiejaar 2000–2001 aanspraak op studiefinanciering bestaat ingevolge
      [hoofdstukken 4][ref1] en [5][ref2] toegekende en niet in gift om te zetten aanvullende beurs kan op aanvraag van
      de debiteur worden kwijtgescholden.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0011453
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0011453
        hoofdstuk: '5'
  - number: 6.2.3
    text: 'Bij algemene maatregel van bestuur wordt bepaald:'
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel6.2
  - number: 6.2.3.a
    text: |-
      tot welk toetsingsinkomen van de debiteur en zijn partner geheel of gedeeltelijk kwijtschelding als bedoeld in het
      tweede lid, mogelijk is,
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel6.2
  - number: 6.2.3.b
    text: |-
      of daarbij onderscheid gemaakt wordt voor een debiteur met partner en een debiteur zonder partner die al dan niet
      studerende is in de zin van deze wet, en
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel6.2
  - number: 6.2.3.c
    text: tot welk tijdstip een aanvraag kan worden ingediend.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel6.2
  - number: 6.2.4
    text: |-
      De over het kwijt te schelden bedrag opgebouwde rente gaat op het tijdstip van kwijtschelding als bedoeld in het
      tweede lid, teniet.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel6.2
  - number: 6.2.5
    text: |-
      Bij kwijtschelding als bedoeld in het tweede lid, zijn de [artikelen 6.10, eerste en vijfde lid][ref1], van
      overeenkomstige toepassing, en is [artikel 6.12][ref2] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel6
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
      - id: ref2
        bwb_id: BWBR0011453
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 6.2.6
    text: |-
      Indien de debiteur tevens een schuld uit een lening heeft als bedoeld in
      [hoofdstuk 4 van de Wet tegemoetkoming onderwijsbijdrage en schoolkosten][ref1], wordt die schuld voor de
      toepassing van dit hoofdstuk aangemerkt als een schuld in de zin van dit hoofdstuk.


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0012438
        hoofdstuk: '4'
  - number: 6.2.7
    text: |-
      Een krachtens het derde lid vastgestelde algemene maatregel van bestuur wordt aan de beide kamers der Staten-
      Generaal overgelegd. Hij treedt in werking op een tijdstip dat nadat vier weken na de overlegging zijn verstreken
      bij koninklijk besluit wordt vastgesteld, tenzij binnen die termijn door of namens een der kamers of door ten
      minste een vijfde van het grondwettelijk aantal leden van een der kamers de wens te kennen wordt gegeven dat het
      onderwerp bij wet wordt geregeld. In dat geval wordt een daartoe strekkend voorstel van wet zo spoedig mogelijk
      ingediend. Indien het voorstel van wet wordt ingetrokken of indien een van de beide kamers van de Staten-Generaal
      besluit het voorstel niet aan te nemen, wordt de algemene maatregel van bestuur ingetrokken.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel6.2
  - number: '6.3'
    text: |-
      Onze Minister stelt jaarlijks uiterlijk in december een rentepercentage vast dat gelijk is aan het gemiddeld
      effectief rendement over de maand oktober van dat jaar van de openbare lening, uitgegeven door de Staat der
      Nederlanden en toegelaten tot de notering aan de officiële markt ter beurze van Amsterdam, met een gemiddelde
      resterende looptijd van 3 tot 5 jaren.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel6.3
  - number: 6.4.1
    text: |-
      Over de aangegane leningen is, voor zover het niet betreft achterstallige schuld als bedoeld in
      [artikel 6.8][ref1], rente verschuldigd overeenkomstig het tweede en derde lid. De renteberekening gaat in op
      de eerste dag van de maand die volgt op de dag waarop het bedrag aan lening bij de verstrekker van die lening is
      afgeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel6
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel6.4
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 6.4.2
    text: |-
      De rente over de door de studerende in een studiefinancieringstijdvak opgenomen lening wordt berekend per dag op
      basis van samengestelde interest. Indien de terugbetaling niet binnen 2 weken na de vervaldatum is ontvangen, wordt
      de op voet van deze bepaling berekende rente bijgeschreven bij de hoofdsom.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel6.4
  - number: 6.4.3
    text: |-
      In de periode die aan de terugbetalingsperiode voorafgaat, wordt bij de berekening van de rente, bedoeld in het
      eerste en tweede lid, voor elk kalenderjaar het rentepercentage gehanteerd dat op grond van [artikel 6.3][ref1]
      uiterlijk in december van het aan dat jaar voorafgaande jaar is vastgesteld. In de terugbetalingsperiode wordt bij
      de berekening van de rente, bedoeld in het eerste en tweede lid, voor elke periode van 5 kalenderjaren na aanvang
      van de terugbetalingsperiode, het rentepercentage gehanteerd dat op grond van [artikel 6.3][ref2] uiterlijk in
      december van het aan die periode voorafgaande jaar is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel6
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel6.4
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
      - id: ref2
        bwb_id: BWBR0011453
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 6.4.4
    text: |-
      Voor de berekening van de rente op de voet van het tweede lid wordt een maand gesteld op 30 dagen en een jaar
      gesteld op 360 dagen.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel6.4
  - number: 6.4.5
    text: |-
      Indien op grond van [artikel 10.7, derde lid][ref1], de over een studiejaar toegekende studiefinanciering lening
      wordt, gaat de renteberekening in op 1 januari van het kalenderjaar volgend op de datum waarop de vorm van de aan
      een studerende toegekende studiefinanciering onvoorwaardelijk is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel10
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel6.4
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '10'
        hoofdstuk: '10'
  - number: 6.4.6
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot het tweede tot en met het
      vijfde lid.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel6.4
  - number: 6.5.1
    text: |-
      De terugbetalingsperiode vangt aan op 1 januari van het jaar volgend op het jaar waarin iemand is opgehouden
      studiefinanciering te genieten.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel6.5
  - number: 6.5.2
    text: De terugbetalingsperiode bestaat uit een aanloopfase en een aflosfase.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel6.5
  - number: 6.5.3
    text: |-
      Indien de debiteur gedurende de voor hem geldende diplomatermijn beroepsonderwijs dan wel diplomatermijn hoger
      onderwijs opnieuw studiefinanciering geniet, of op aanvraag van de debiteur indien hij binnen bovengenoemde termijn
      opnieuw studerende wordt zonder hiervoor studiefinanciering te genieten, wordt de terugbetalingsperiode geschorst.
      Voor debiteuren die niet op grond van onderscheidenlijk [artikel 4.9][ref1] en [artikel 5.5][ref2] onder een
      diplomatermijn vallen geldt, in afwijking van de eerste volzin, dat de terugbetaling wordt geschorst zolang de
      debiteur opnieuw studiefinanciering geniet, of op aanvraag van de debiteur indien hij binnen bovengenoemde termijn
      opnieuw studerende wordt zonder hiervoor studiefinanciering te genieten.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel5
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel6.5
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.1.2
        afdeling: '4.1'
      - id: ref2
        bwb_id: BWBR0011453
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 6.5.4
    text: |-
      De schorsing, bedoeld in het derde lid, wordt beëindigd indien de debiteur niet binnen 8 weken na de verzending
      van een daartoe strekkend verzoek van Onze Minister of de debiteur nog studerende is, daarop heeft geantwoord.
      De beëindiging werkt terug tot de datum van verzending van het verzoek, of zoveel eerder als de debiteur ophield
      studerende te zijn. Een aanvraag om de terugbetaling wederom te schorsen wordt niet toegestaan voor een periode die
      gelegen is vóór de datum van indiening van de aanvraag. De schorsing wordt tevens beëindigd aan het einde van de
      diplomatermijn beroepsonderwijs dan wel de diplomatermijn hoger onderwijs.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel6.5
  - number: 6.6.1
    text: De aanloopfase beslaat de eerste 2 kalenderjaren na aanvang van de terugbetalingsperiode.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel6.6
  - number: 6.6.2
    text: Gedurende de aanloopfase bestaat geen verplichting tot terugbetaling.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel6.6
  - number: 6.7.1
    text: |-
      De aflosfase beslaat behoudens toepassing van [artikel 6.9, derde lid][ref1], 15 kalenderjaren volgend op de
      aanloopfase. Deze periode wordt verlengd met het aantal maanden dat gebruik is gemaakt van de aflosvrije periode op
      grond van het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel6
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel6.7
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 6.7.2
    text: Op aanvraag van de debiteur wordt de terugbetaling voor ten hoogste 5 kalenderjaren opgeschort.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel6.7
  - number: 6.7.3
    text: |-
      Bij ministeriële regeling kunnen voorschriften worden vastgesteld met betrekking tot de opschorting, bedoeld in het
      tweede lid.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel6.7
  - number: 6.8.1
    text: |-
      Onder achterstallige schuld wordt verstaan het bedrag van de verplichte terugbetaling uit hoofde van dit hoofdstuk
      of uit hoofde van [artikel 7.4][ref1] dat 2 weken na de vervaldatum nog niet is ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel7
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel6.8
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '7'
        hoofdstuk: '7'
  - number: 6.8.2
    text: |-
      Over de achterstallige schuld is rente verschuldigd. Als rentepercentage wordt het percentage van de wettelijke
      rente gehanteerd. Deze rente wordt berekend per dag op basis van samengesteld interest, waarbij een maand wordt
      gesteld op 30 dagen en een jaar wordt gesteld op 360 dagen.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel6.8
  - number: 6.8.3
    text: |-
      Indien de debiteur achterstallig is bij de betaling wordt met deze achterstallige schuld bij de duur van
      de aflosfase, bedoeld in [artikel 6.7][ref1], bij de vaststelling van de maandelijkse termijn, bedoeld in
      [artikel 6.9][ref2] en [6.15][ref3], alsmede bij het tenietgaan van de schuld, bedoeld in [artikel 6.16][ref4],
      geen rekening gehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0011453#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0011453#Artikel6
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel6.8
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
      - id: ref2
        bwb_id: BWBR0011453
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
      - id: ref3
        bwb_id: BWBR0011453
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
      - id: ref4
        bwb_id: BWBR0011453
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 6.8.4
    text: |-
      [Artikel 6.4][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel6
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel6.8
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 6.9.1
    text: Rente en aflossing van de lening vervallen gedurende de aflosfase in maandelijkse termijnen.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel6.9
  - number: 6.9.2
    text: |-
      De hoogte van de maandelijkse termijnen wordt op basis van het aantal maanden van de aflosfase onderscheidenlijk
      het nog resterende aantal maanden van de aflosfase tot gelijke bedragen vastgesteld bij de aanvang van:
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel6.9
  - number: 6.9.2.a
    text: het eerste jaar van de aflosfase,
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel6.9
  - number: 6.9.2.b
    text: het vierde jaar van de aflosfase, en
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel6.9
  - number: 6.9.2.c
    text: ieder vijfde jaar na het vierde jaar van de aflosfase.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel6.9
  - number: 6.9.3
    text: |-
      Onverminderd toepassing van [artikel 6.10][ref1] bedraagt het totaal per jaar te betalen bedrag aan maandelijkse
      termijnen ten minste € 545,–. Bij ministeriële regeling kan dit bedrag gelet op de loonontwikkeling worden herzien.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel6
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel6.9
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 6.9.4
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld voor de vaststelling en betaling van de
      terugbetalingstermijnen. Hierbij kan tevens worden bepaald dat betaling geschiedt door middel van een daartoe
      verleende doorlopende machtiging om het verschuldigde bedrag maandelijks te doen afschrijven van een bank- of
      postbankrekening.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel6.9
  - number: 6.10.1
    text: |-
      Maatstaf voor de vaststelling van de draagkracht van de debiteur uit inkomen is het totaal van zijn
      toetsingsinkomen en dat van zijn partner in het tweede jaar voorafgaande aan het jaar waarvoor de draagkracht wordt
      vastgesteld. Het aldus bepaalde inkomen is het draagkrachtinkomen.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel6.10
  - number: 6.10.2
    text: 'Op het draagkrachtinkomen wordt in mindering gebracht de draagkrachtvrije voet. Deze voet is gelijk aan:'
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel6.10
  - number: 6.10.2.a
    text: 120% van het belastbaar minimumloon voor een debiteur met partner,
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel6.10
  - number: 6.10.2.b
    text: |-
      120% van het belastbaar minimumloon voor een debiteur op wie de alleenstaande-ouderkorting, bedoeld in
      [artikel 8.15 van de Wet inkomstenbelasting 2001][ref1], van toepassing is, of


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel8
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel6.10
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '8'
  - number: 6.10.2.c
    text: 84% van het belastbaar minimumloon voor overige debiteuren zonder partner.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel6.10
  - number: 6.10.3
    text: De draagkracht van de debiteur uit inkomen is 12% van het inkomen boven de draagkrachtvrije voet.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel6.10
  - number: 6.10.4
    text: |-
      Indien het bedrag van de draagkracht lager is dan het bedrag van de vastgestelde termijn, berekend op grond van
      [artikel 6.9][ref1], betaalt de debiteur, in afwijking van [dat artikel][ref2], het bedrag van zijn draagkracht.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel6
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel6.10
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
      - id: ref2
        bwb_id: BWBR0011453
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 6.10.5
    text: |-
      Voor de toepassing van dit artikel, wordt indien het toetsingsinkomen in het tweede jaar voorafgaande aan het jaar
      waarvoor de draagkracht wordt vastgesteld, nog niet bekend is, door Onze Minister daarvoor in de plaats gesteld een
      bedrag dat het vast te stellen toetsingsinkomen benadert.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel6.10
  - number: 6.10.6
    text: |-
      Het vierde lid is niet van toepassing indien het voor Onze Minister niet mogelijk is op grond van het vijfde lid
      bij benadering een bedrag vast te stellen.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel6.10
  - number: 6.11.1
    text: |-
      Voor een debiteur die in het peiljaar niet binnenlands belastingplichtig is in de zin van de
      [Wet inkomstenbelasting 2001][ref1] en die niet op grond van [artikel 2.5, eerste lid, van die wet][ref2] als
      zodanig is aangemerkt, kan [artikel 6.10][ref3] slechts toepassing vinden als de debiteur daartoe bij Onze Minister
      een aanvraag indient.


      [ref1]: https://wetten.overheid.nl/BWBR0011353
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0011453#Artikel6
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel6.11
    references:
      - id: ref1
        bwb_id: BWBR0011353
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0011453
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 6.11.2
    text: |-
      Indien de debiteur zich voor het einde van een jaartermijn metterwoon in Nederland vestigt, wordt hij tot het
      einde van die jaartermijn behandeld als een debiteur die niet binnenlands belastingplichtig is in de zin van de
      [Wet inkomstenbelasting 2001][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011353
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel6.11
    references:
      - id: ref1
        bwb_id: BWBR0011353
  - number: 6.11.3
    text: |-
      Bij ministeriële regeling kunnen voorschriften worden vastgesteld met betrekking tot de in het eerste lid bedoelde
      aanvraag.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel6.11
  - number: 6.12.1
    text: |-
      Op aanvraag van de debiteur wordt bij de toepassing van [artikel 6.10][ref1] uitgegaan van het inkomen van
      een ander jaar dan het inkomen over het tweede jaar voorafgaande aan het jaar waarvoor de draagkracht wordt
      vastgesteld, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel6
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel6.12
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 6.12.1.a
    text: |-
      sprake is van een terugval in inkomen over het jaar voorafgaande aan het jaar waarvoor de draagkracht wordt
      vastgesteld, in welk geval wordt uitgegaan van het jaar voorafgaande aan het jaar waarvoor de draagkracht wordt
      vastgesteld, of
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel6.12
  - number: 6.12.1.b
    text: |-
      sprake is van een terugval in inkomen over het jaar waarvoor de draagkracht wordt vastgesteld, in welk geval wordt
      uitgegaan van het jaar waarvoor de draagkracht wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel6.12
  - number: 6.12.2
    text: |-
      Voor de toepassing van het eerste lid wordt onder een terugval in inkomen verstaan een vermindering van het
      toetsingsinkomen van de debiteur van ten minste 15% ten opzichte van het tweede jaar voorafgaande aan het jaar
      waarvoor de draagkracht wordt vastgesteld, met dien verstande dat:
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel6.12
  - number: 6.12.2.a
    text: |-
      de vermindering niet kan worden gerekend tot inkomensschommelingen die in het algemeen normaal kunnen worden geacht
      bij de gekozen wijze van inkomensverwerving, en
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel6.12
  - number: 6.12.2.b
    text: |-
      aannemelijk wordt gemaakt dat gedurende ten minste 3 kalenderjaren zal worden voldaan aan de voorwaarden, genoemd
      in de aanhef alsmede in onderdeel a.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel6.12
  - number: 6.12.3
    text: |-
      Voor de toepassing van het eerste lid wordt zolang het belastbaar minimumloon over het tweede jaar voorafgaande
      aan het jaar waarvoor de draagkracht wordt vastgesteld, het jaar voorafgaande aan het jaar waarvoor de draagkracht
      wordt vastgesteld, of het jaar waarvoor de draagkracht wordt vastgesteld nog niet definitief bekend is, daarvoor
      in de plaats gesteld het bedrag dat naar het oordeel van Onze Minister het uiteindelijke belastbaar minimumloon
      benadert.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel6.12
  - number: '6.13'
    text: |-
      Indien voor de debiteur voor de inkomstenbelasting na het tweede jaar voorafgaande aan het jaar waarvoor de
      draagkracht wordt vastgesteld de alleenstaande-ouderkorting van toepassing wordt, wordt op aanvraag van de debiteur
      de hoogte van zijn draagkracht dienovereenkomstig aangepast.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel6.13
  - number: 6.14.1
    text: 'Indien de partner van de debiteur ook een debiteur op wie dit hoofdstuk van toepassing is is, wordt:'
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel6.14
  - number: 6.14.1.a
    text: |-
      [artikel 6.10, eerste en derde lid][ref1], slechts eenmaal toegepast op het totaal van het toetsingsinkomen voor
      beide partners samen;


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel6
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel6.14
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 6.14.1.b
    text: |-
      de draagkracht per debiteur vastgesteld op basis van de verhouding tussen de hoogte van het toetsingsinkomen van
      beide debiteuren afzonderlijk;
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel6.14
  - number: 6.14.1.c
    text: |-
      de draagkracht van de debiteur eerst aangewend voor de betaling van de eigen termijn op grond van
      [artikel 6.9][ref1]. Het bedrag aan resterende draagkracht van de debiteur wordt toegevoegd aan de draagkracht van
      de partner van wie de draagkracht zonder deze toevoeging lager is dan de voor hem op grond van [artikel 6.9][ref2]
      vastgestelde termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel6
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel6.14
    references:
