        paragraaf: '3.5'
  - number: 4.19.1
    text: |-
      Een deelnemer verstrekt jaarlijks binnen een door Onze Minister te bepalen termijn aan Onze Minister een
      gewaarmerkt afschrift van het bewijs waaruit blijkt voor welke maanden van het desbetreffende studiejaar hij is
      ingeschreven voor de opleiding waarvoor hij studiefinanciering heeft aangevraagd.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel4.19
  - number: 4.19.2
    text: |-
      Een deelnemer verstrekt jaarlijks binnen een door Onze Minister te bepalen termijn aan Onze Minister een
      gewaarmerkt afschrift van een overzicht van in het desbetreffende studiejaar behaalde studieresultaten.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel4.19
  - number: '4.20'
    text: |-
      Deze paragraaf is uitsluitend van toepassing op deelnemers die zijn ingeschreven voor het volgen van een opleiding
      buiten Nederland als bedoeld in [artikel 2.13a][ref1] en waarvan Onze Minister heeft vastgesteld dat deze wordt
      aangemerkt als een opleiding niveau 3 of 4.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel2
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel4.20
