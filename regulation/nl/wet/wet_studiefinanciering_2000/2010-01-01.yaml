      leeftijd als bedoeld in [artikel 2.3][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel2
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 2.1.c
    text: |-
      onderwijssoort als bedoeld in de [paragrafen 2.2 tot en met 2.4.][ref1]


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0011453
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 2.2.1
    text: 'Voor studiefinanciering kan een studerende in aanmerking komen die:'
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel2.2
  - number: 2.2.1.a
    text: de Nederlandse nationaliteit bezit,
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel2.2
  - number: 2.2.1.b
    text: |-
      niet de Nederlandse nationaliteit bezit maar wel ingevolge een verdrag of een besluit van een volkenrechtelijke
      organisatie op het terrein van de studiefinanciering met een Nederlander wordt gelijkgesteld, of
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel2.2
  - number: 2.2.1.c
    text: |-
      niet de Nederlandse nationaliteit bezit maar wel in Nederland woont en behoort tot een bij algemene maatregel
      van bestuur aangewezen groep van personen die voor het terrein van de studiefinanciering met Nederlanders worden
      gelijkgesteld.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel2.2
  - number: 2.2.2
    text: |-
      Onverminderd het eerste lid, onderdeel b, kunnen bij algemene maatregel van bestuur groepen van personen worden
      aangewezen voor wie de gelijkstelling, bedoeld in het eerste lid, onderdeel b, slechts een tegemoetkoming in de
      kosten van de toegang tot het onderwijs betreft. Bij algemene maatregel van bestuur kunnen regels worden gesteld
      met betrekking tot de hoogte en de vorm van deze tegemoetkoming.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel2.2
  - number: 2.3.1
    text: |-
      Voor studiefinanciering kan een deelnemer in aanmerking komen met ingang van de eerste dag van het kwartaal waarop
      hij de leeftijd van 18 jaren heeft bereikt.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel2.3
  - number: 2.3.2
    text: |-
      Voor studiefinanciering kan een student in aanmerking komen die op de eerste dag van het kwartaal waarin hij hoger
      onderwijs is gaan volgen:
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel2.3
  - number: 2.3.2.a
    text: 'jonger is dan 18 jaren: met ingang van de eerste dag van het daaropvolgende kwartaal, of'
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel2.3
  - number: 2.3.2.b
    text: '18 jaren is of ouder: met ingang van de eerste dag van de maand waarin hij hoger onderwijs is gaan volgen.'
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel2.3
  - number: 2.3.3
    text: |-
      Voor studiefinanciering kan een studerende in aanmerking komen tot en met de maand waarin hij de leeftijd van 30
      jaren heeft bereikt.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel2.3
  - number: 2.3.4
    text: |-
      In afwijking van het derde lid behoudt een studerende bij het bereiken van de leeftijd van 30 jaren zijn aanspraak,
      zolang hij zonder onderbreking studiefinanciering geniet.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel2.3
  - number: '2.4'
    text: 'Voor studiefinanciering kan een deelnemer in aanmerking komen die is ingeschreven aan:'
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel2.4
  - number: 2.4.a
    text: |-
      een instelling als bedoeld in [artikel 1.1.1, onderdeel b, van de WEB][ref1], voor zover het een uit 's Rijks kas
      bekostigde beroepsopleiding betreft, of


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel2.4
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
  - number: 2.4.b
    text: |-
      een instelling die ten aanzien van de beroepsopleiding het in [artikel 1.4.1 van de WEB][ref1] bedoelde recht heeft
      verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel2.4
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
  - number: 2.5.1
    text: |-
      Een deelnemer heeft geen aanspraak op studiefinanciering indien hij is ingeschreven aan een opleiding waarvan de
      duur, daaronder begrepen ten hoogste 12 vakantieweken, korter is dan 1 jaar.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel2.5
  - number: 2.5.2
    text: |-
      De aanspraak op studiefinanciering van een deelnemer als bedoeld in [artikel 2.4][ref1], die gedurende een
      aaneengesloten periode van 8 weken geen lessen, stages of beroepspraktijkvorming heeft gevolgd, vervalt met ingang
      van de eerste dag van de maand volgend op die waarin de instelling de afwezigheid, bedoeld in [artikel 4.3][ref2],
      aan Onze Minister heeft medegedeeld. De periode van 8 weken wordt verlengd met de weken waarin vanwege vakantie
      geen onderwijs werd verzorgd.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel4
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel2.5
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0011453
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.1.1
        afdeling: '4.1'
  - number: 2.5.3
    text: |-
      De aanspraak op studiefinanciering vervalt over het tijdvak waarover een deelnemer de gegevens, bedoeld in
      [artikel 4.19][ref1], niet verstrekt. Zolang hij deze gegevens over een studiejaar niet verstrekt, heeft hij tevens
      geen aanspraak op studiefinanciering voor de daarop volgende studiejaren. Indien hij ontbrekende gegevens alsnog
      levert, herleeft de aanspraak.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel4
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel2.5
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.2.2
        afdeling: '4.2'
  - number: 2.7.1
    text: |-
      De aanspraak op studiefinanciering vervalt met ingang van de maand die volgt op de dag waarop de deelnemer het
      laatste studiejaar van een opleiding met goed gevolg heeft afgesloten.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel2.7
  - number: 2.7.2
    text: |-
      Indien de deelnemer aansluitend aan het studiejaar dat als laatste studiejaar was aangemerkt, opnieuw dat laatste
      studiejaar aanvangt, ontstaat aanspraak op studiefinanciering voor het resterende gedeelte van het kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel2.7
  - number: 2.7.3
    text: |-
      Indien de deelnemer na zijn uitschrijving voor een opleiding binnen 4 maanden opnieuw deze opleiding aanvangt
      of een andere opleiding in de zin van deze wet gaat volgen, blijft, in afwijking van het eerste lid, op zijn
      aanvraag de aanspraak op studiefinanciering in de tussen beide opleidingen liggende periode voor ten hoogste
      4 maanden bestaan. Hij wordt in die periode aangemerkt als deelnemer aan de eerste opleiding. In afwijking van
      [artikel 3.21, tweede lid][ref1], wordt die aanvraag ingediend voor het einde van de periode van 4 maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel3
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel2.7
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.6'
  - number: 2.7a
    text: |-
      Een deelnemer aan een opleiding niveau 3 of 4 die na 31 juli 2005 voor het eerst studiefinanciering ontving voor
      het volgen van beroepsonderwijs, heeft geen aanspraak op studiefinanciering beroepsonderwijs:
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel2.7a
  - number: 2.7a.a
    text: |-
      indien hij na het verstrijken van zijn aanspraak op de prestatiebeurs, bedoeld in [artikel 4.7][ref1], gedurende 36
      maanden een lening heeft genoten, of


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel4
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel2.7a
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.1.2
        afdeling: '4.1'
  - number: 2.7a.b
    text: |-
      indien er 10 jaren verstreken zijn met ingang van de maand waarover voor het eerst studiefinanciering in de zin van
      de [paragrafen 4.1.2][ref1] of [4.2.3][ref2] is toegekend voor het volgen van beroepsonderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel2.7a
    references:
      - id: ref1
        bwb_id: BWBR0011453
        hoofdstuk: '4'
        paragraaf: 4.1.2
        afdeling: '4.1'
      - id: ref2
        bwb_id: BWBR0011453
        hoofdstuk: '4'
        paragraaf: 4.2.3
        afdeling: '4.2'
  - number: 2.8.1
    text: |-
      Voor studiefinanciering kan een student in aanmerking komen die is ingeschreven voor het volgen van een voltijdse
      bacheloropleiding of een voltijdse masteropleiding aan een bekostigde universiteit of hogeschool, opgenomen in de
      [bijlage van de WHW](onbekend).
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel2.8
  - number: 2.8.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing gedurende de termijn, bedoeld in de
      [artikelen 5a.12, eerste, vijfde en zesde lid][ref1], [5a.12a, eerste en tweede lid][ref2],
      [5a.15, tweede lid][ref3], of [6.5, tweede lid, van de WHW][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
      [ref4]: https://wetten.overheid.nl/BWBR0005682#Artikel6
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel2.8
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: 5a
      - id: ref2
        bwb_id: BWBR0005682
        artikel: 5a
      - id: ref3
        bwb_id: BWBR0005682
        artikel: 5a
      - id: ref4
        bwb_id: BWBR0005682
        artikel: '6'
  - number: 2.9.1
    text: |-
      Voor studiefinanciering kan een student in aanmerking komen die is ingeschreven voor het volgen van een
      voltijdse bacheloropleiding of een voltijdse masteropleiding aan een aangewezen instelling als bedoeld in de
      [artikelen 6.9][ref1] of [16.10 van de WHW][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel16
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '16'
  - number: 2.9.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing gedurende de termijn, bedoeld in de
      [artikelen 5a.12, eerste, vijfde en zesde lid][ref1], [5a.12a, eerste en tweede lid][ref2],
      [5a.15, tweede lid][ref3], of [6.10, derde lid, van de WHW][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
      [ref4]: https://wetten.overheid.nl/BWBR0005682#Artikel6
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: 5a
      - id: ref2
        bwb_id: BWBR0005682
        artikel: 5a
      - id: ref3
        bwb_id: BWBR0005682
        artikel: 5a
      - id: ref4
        bwb_id: BWBR0005682
        artikel: '6'
  - number: '2.10'
    text: |-
      Voor studiefinanciering kan een student in aanmerking komen die is ingeschreven voor het volgen van een voltijdse
      wetenschappelijk theologische opleiding ten behoeve waarvan aan het desbetreffende kerkgenootschap vanwege het Rijk
      een bijdrage wordt verleend.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel2.10
  - number: '2.11'
    text: |-
      Voor studiefinanciering kan een student in aanmerking komen die is ingeschreven voor het volgen van bij algemene
      maatregel van bestuur aangewezen hoger onderwijs dat anders dan op grond van de [WHW][ref1], volledig en
      rechtstreeks uit de openbare kas wordt bekostigd.


      [ref1]: https://wetten.overheid.nl/BWBR0005682
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel2.11
    references:
      - id: ref1
        bwb_id: BWBR0005682
  - number: 2.13.1
    text: 'Een student heeft geen aanspraak op studiefinanciering:'
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel2.13
  - number: 2.13.1.a
    text: |-
      indien hij na het verstrijken van zijn aanspraak op de prestatiebeurs in het hoger onderwijs gedurende 36 maanden
      een lening heeft genoten,
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel2.13
  - number: 2.13.1.b
    text: |-
      indien er 10 jaren verstreken zijn met ingang van de maand waarover voor het eerst studiefinanciering is toegekend
      voor het volgen van hoger onderwijs,
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel2.13
  - number: 2.13.1.c
    text: |-
      indien hij is ingeschreven aan een opleiding waarvan de duur, daaronder begrepen ten hoogste 12 vakantieweken,
      korter is dan 1 jaar, of
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel2.13
  - number: 2.13.1.d
    text: |-
      indien hij in het betreffende studiefinancieringstijdvak aanspraak maakt op een tegemoetkoming in de kosten voor
      de toegang tot het onderwijs of voor levensonderhoud, die door de voor de verstrekking van deze tegemoetkomingen
      verantwoordelijke autoriteit van een ander land wordt verstrekt.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel2.13
  - number: 2.13.2
    text: |-
      De aanspraak van een student die een opleiding volgt als bedoeld in [artikel 2.14][ref1] vervalt over het
      tijdvak waarover hij de inlichtingen, bedoeld in [artikel 9.2, eerste lid][ref2], niet verstrekt. Zolang hij die
      inlichtingen over een studiejaar niet verstrekt, heeft hij tevens geen aanspraak op studiefinanciering voor de
      daarop volgende studiejaren. Indien hij die inlichtingen alsnog verstrekt, herleeft de aanspraak.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel9
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel2.13
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.4'
      - id: ref2
        bwb_id: BWBR0011453
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '9.2'
  - number: 2.13a.1
    text: |-
      Voor studiefinanciering kan een deelnemer in aanmerking komen die is ingeschreven voor het volgen van onderwijs aan
      een opleiding buiten Nederland:
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel2.13a
  - number: 2.13a.1.a
    text: |-
      waarvan het niveau en de kwaliteit vergelijkbaar is met overeenkomstige Nederlandse opleidingen in de zin van de
      [WEB][ref1] en waarvan het afsluitend examen vergelijkbaar is met een afsluitend examen voor een opleiding in de
      zin van de WEB, en


      [ref1]: https://wetten.overheid.nl/BWBR0007625
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel2.13a
    references:
      - id: ref1
        bwb_id: BWBR0007625
  - number: 2.13a.1.b
    text: die overigens voldoet aan bij ministeriële regeling vastgestelde criteria.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel2.13a
  - number: 2.13a.2
    text: |-
      Onze Minister stelt vast of een opleiding buiten Nederland voldoet aan de criteria, bedoeld in het eerste lid. Onze
      Minister stelt tevens vast of de opleiding wordt aangemerkt als een opleiding niveau 1 of 2 of een opleiding niveau
      3 of 4. De opleiding wordt aangemerkt als een opleiding niveau 1 of 2 onderscheidenlijk een opleiding niveau 3 of 4
      indien deze vergelijkbaar is met een opleiding niveau 1 of 2 onderscheidenlijk een opleiding niveau 3 of 4.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel2.13a
  - number: 2.13a.3
    text: |-
      Dit artikel is niet van toepassing op deelnemers die op grond van [artikel 2.2, tweede lid][ref1], slechts een
      tegemoetkoming in de kosten van de toegang tot het onderwijs ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel2
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel2.13a
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 2.14.1
    text: |-
      Dit artikel is uitsluitend van toepassing op studenten die na 31 augustus 2007 zijn ingeschreven voor het volgen
      van hoger onderwijs aan een opleiding buiten Nederland. Dit artikel is niet van toepassing op studenten die op
      grond van [artikel 2.2, tweede lid][ref1], slechts een tegemoetkoming in de kosten van de toegang tot het onderwijs
      ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel2
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel2.14
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 2.14.2
    text: 'Voor studiefinanciering kan een student in aanmerking komen die:'
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel2.14
  - number: 2.14.2.a
    text: |-
      is ingeschreven voor het volgen van onderwijs aan een opleiding buiten Nederland, voorzover in Nederland voor
      een vergelijkbaar soort opleiding studiefinanciering wordt verstrekt, het niveau en de kwaliteit van de opleiding
      vergelijkbaar zijn met overeenkomstige opleidingen in de zin van de [WHW][ref1] en het afsluitend examen voor de
      opleiding vergelijkbaar is met een afsluitend examen voor overeenkomstige opleidingen in de zin van de [WHW][ref2],


      [ref1]: https://wetten.overheid.nl/BWBR0005682
      [ref2]: https://wetten.overheid.nl/BWBR0005682
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel2.14
    references:
      - id: ref1
        bwb_id: BWBR0005682
      - id: ref2
        bwb_id: BWBR0005682
  - number: 2.14.2.b
    text: |-
      is ingeschreven voor het volgen van onderwijs aan een opleiding buiten Nederland die, onverminderd onderdeel a,
      overigens voldoet aan bij ministeriële regeling vastgestelde criteria, en
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel2.14
  - number: 2.14.2.c
    text: |-
      ten minste 3 jaren van de 6 jaren voorafgaand aan diens inschrijving aan die opleiding in Nederland heeft gewoond
      en gedurende deze periode rechtmatig verblijf heeft gehad.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel2.14
  - number: 2.14.3
    text: |-
      Onze Minister stelt vast of een opleiding buiten Nederland voldoet aan de criteria, bedoeld in het tweede lid.
      Indien voor een vergelijkbare opleiding of vergelijkbaar geheel van een bacheloropleiding en een masteropleiding in
      Nederland de prestatiebeurs voor meer dan 4 jaren wordt verstrekt stelt Onze Minister voor de betreffende opleiding
      buiten Nederland de duur van de prestatiebeurs vast op de duur van de periode gedurende welke studiefinanciering
      wordt verstrekt in de vorm van een prestatiebeurs voor die opleiding in Nederland. Indien de studielast van een
      vergelijkbare opleiding of vergelijkbaar geheel van een bacheloropleiding en een masteropleiding in Nederland
      minder dan 4 jaren betreft, stelt Onze Minister de studielast van de opleiding buiten Nederland vast op de
      studielast van die opleiding in Nederland.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel2.14
  - number: 2.14.4
    text: |-
      Het [tweede en derde lid van artikel 2.2 van de Wet inkomstenbelasting 2001][ref1] zijn van overeenkomstige
      toepassing op het tweede lid. Het [tweede en derde lid van artikel 2.2 van de Wet inkomstenbelasting 2001][ref2]
      zijn, voor de toepassing van de eerste volzin, tevens van overeenkomstige toepassing op personen met een andere dan
      de Nederlandse nationaliteit.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel2
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel2.14
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '2'
  - number: '2.15'
    text: |-
      De studerende die lesgeld is verschuldigd op grond van [artikel 5, tweede lid, van de Les- en cursusgeldwet][ref1]
      en tevens voor het volgen van hoger onderwijs aanspraak heeft op studiefinanciering, geldt voor de toekenning van
      studiefinanciering niet als deelnemer.


      [ref1]: https://wetten.overheid.nl/BWBR0004188#Artikel5
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel2.15
    references:
      - id: ref1
        bwb_id: BWBR0004188
        artikel: '5'
  - number: 2.15a.1
    text: |-
      De deelnemer die na 31 juli 2005 voor het volgen van beroepsonderwijs voor het eerst studiefinanciering ontving en
      die aanspraak heeft op studiefinanciering voor het volgen van een opleiding niveau 3 of 4, heeft geen aanspraak op
      studiefinanciering voor een opleiding niveau 1 of 2.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel2.15a
  - number: 2.15a.2
    text: |-
      De deelnemer die aanspraak heeft op studiefinanciering voor een opleiding niveau 1 of 2 buiten Nederland heeft geen
      aanspraak op studiefinanciering voor een opleiding niveau 1 of 2 in Nederland.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel2.15a
  - number: 2.15a.3
    text: |-
      De deelnemer die voor 1 augustus 2005 voor het volgen van beroepsonderwijs studiefinanciering ontving en die
      studiefinanciering ontvangt voor een opleiding op niveau 3 of 4 buiten Nederland, heeft geen aanspraak op
      studiefinanciering voor een opleiding niveau 1 of 2.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel2.15a
  - number: 2.15a.4
    text: |-
      De deelnemer die voor 1 augustus 2005 voor het volgen van beroepsonderwijs studiefinanciering ontving en die
      studiefinanciering ontvangt voor een beroepsopleiding buiten Nederland, heeft geen aanspraak op studiefinanciering
      voor een opleiding niveau 3 of 4 in Nederland.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel2.15a
  - number: 2.16.1
    text: |-
      De deelnemer heeft geen aanspraak op studiefinanciering voor een opleiding niveau 1 of 2, indien hij reeds 4 jaren
      prestatiebeurs voor het volgen van een opleiding beroepsonderwijs heeft genoten.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel2.16
  - number: 2.16.2
    text: |-
      De studerende heeft geen aanspraak op studiefinanciering beroepsonderwijs indien hij reeds 4 jaren
      studiefinanciering heeft genoten voor het volgen van een opleiding in het hoger onderwijs.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel2.16
  - number: 2.17.1
    text: |-
      Een studerende die voor ten minste één maand rechtens zijn vrijheid is ontnomen, heeft, behoudens
      in de gevallen, bedoeld in de [Wet bijzondere opnemingen in psychiatrische ziekenhuizen][ref1] en in
      [artikel 37, eerste lid, van het Wetboek van Strafrecht][ref2] en de gevallen, bedoeld in hoofdstuk VIa,
      van de [Wet op de Jeugdzorg][ref3], met ingang van de eerste dag van de maand volgend op de maand waarin de
      vrijheidsontneming ten minste één maand heeft geduurd slechts aanspraak op studiefinanciering voor een thuiswonende
      studerende.


      [ref1]: https://wetten.overheid.nl/BWBR0005700
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel37
      [ref3]: https://wetten.overheid.nl/BWBR0016637
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel2.17
    references:
      - id: ref1
        bwb_id: BWBR0005700
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '37'
      - id: ref3
        bwb_id: BWBR0016637
  - number: 2.17.2
    text: |-
      Voor de toepassing van het eerste lid worden perioden van vrijheidsontneming samengeteld, indien zij elkaar met een
      onderbreking van minder dan vier weken opvolgen.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel2.17
  - number: 2.17.3
    text: |-
      Het eerste en tweede lid zijn niet van toepassing op bij algemene maatregel van bestuur aan te wijzen groepen van
      personen waarbij tenuitvoerlegging van een vrijheidsstraf of vrijheidsbenemende maatregel buiten een justitiële
      inrichting plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel2.17
  - number: 3.1.1
    text: |-
      Studiefinanciering bestaat uit basisbeurs, uit basislening en uit aanvullende beurs of aanvullende lening en voor
      studenten ook uit collegegeldkrediet.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.1
  - number: 3.1.2
    text: 'Studiefinanciering kan geheel of gedeeltelijk worden toegekend in de vorm van:'
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.1
  - number: 3.1.2.a
    text: gift,
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.1
  - number: 3.1.2.b
    text: prestatiebeurs, of
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.1
  - number: 3.1.2.c
    text: lening.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.1
  - number: 3.1.3
    text: |-
      De hoogte van de studiefinanciering wordt vastgesteld op basis van een budget voor een kalendermaand en voor
      studenten ook op basis van het collegegeldkrediet.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.1
  - number: 3.1.4
    text: |-
      In afwijking van het derde lid kan de hoogte van de studiefinanciering ook worden vastgesteld op een tegemoetkoming
      in de kosten van de toegang tot het onderwijs.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.1
  - number: 3.2.1
    text: 'Het budget voor een deelnemer voor een kalendermaand is het totaal van:'
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.2
  - number: 3.2.1.a
    text: een normbedrag voor de kosten van levensonderhoud,
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.2
  - number: 3.2.1.b
    text: een tegemoetkoming in de kosten van het lesgeld, en
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.2
  - number: 3.2.1.c
    text: een reisvoorziening.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.2
  - number: 3.2.2
    text: 'Dit budget kan worden verhoogd met:'
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.2
  - number: 3.2.2.a
    text: |-
      een toeslag voor een partner ingevolge [artikel 3.4][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel3
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 3.2.2.b
    text: |-
      een toeslag voor een één-oudergezin ingevolge [artikel 3.5][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel3
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 3.2.3
    text: |-
      De tegemoetkoming in de kosten van het lesgeld wordt voor een deelnemer vastgesteld op eentwaalfde deel van het
      op grond van [artikel 5, tweede lid, van de Les- en cursusgeldwet][ref1] vastgestelde of herziene bedrag van het
      lesgeld.


      [ref1]: https://wetten.overheid.nl/BWBR0004188#Artikel5
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0004188
        artikel: '5'
  - number: 3.2.4
    text: |-
      De bedragen zijn opgenomen in [artikel 3.18][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel3
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.5'
  - number: 3.3.1
    text: 'Het budget voor een student voor een kalendermaand is het totaal van:'
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.3
  - number: 3.3.1.a
    text: een normbedrag voor de kosten van levensonderhoud, en
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.3
  - number: 3.3.1.b
    text: een reisvoorziening.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.3
  - number: 3.3.2
    text: 'Dit budget kan worden verhoogd met:'
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.3
  - number: 3.3.2.a
    text: |-
      een toeslag voor een partner ingevolge [artikel 3.4][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel3
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 3.3.2.b
    text: |-
      een toeslag voor een één-oudergezin ingevolge [artikel 3.5][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel3
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 3.3.3
    text: |-
      De bedragen zijn opgenomen in [artikel 3.18][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel3
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.5'
  - number: 3.4.1
    text: |-
      Aan een studerende met een partner die financieel van hem afhankelijk is en die niet in aanmerking komt voor
      studiefinanciering, wordt een toeslag voor een partner toegekend.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.4
  - number: 3.4.2
    text: |-
      Uitsluitend als financieel afhankelijk wordt aangemerkt de partner die een toetsingsinkomen heeft dat
      naar de maatstaf van 1 januari 2008 minder bedraagt dan € 8 129,26 en die de verzorging heeft van een
      of meer kinderen die jonger zijn dan 12 jaar waarvoor op grond van de [Algemene Kinderbijslagwet][ref1]
      aanspraak op kinderbijslag bestaat. Bij de bepaling van het toetsingsinkomen van de partner is
      [artikel 8, derde, vijfde en zesde lid van de Algemene wet inkomensafhankelijke regelingen][ref2] en
      [artikel 3.17, derde tot en met zesde en tiende lid][ref3], van deze wet, van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002368
      [ref2]: https://wetten.overheid.nl/BWBR0018472#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0011453#Artikel3
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0002368
      - id: ref2
        bwb_id: BWBR0018472
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0011453
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: 3.4.3
    text: |-
      Het bedrag, bedoeld in het eerste lid, is opgenomen in [artikel 3.18][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel3
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.5'
  - number: 3.4.4
    text: |-
      [Artikel 9, tweede lid, van de Algemene wet inkomensafhankelijke regelingen][ref1] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018472#Artikel9
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0018472
        artikel: '9'
  - number: 3.5.1
    text: |-
      Aan een studerende zonder partner die een of meer kinderen heeft van jonger dan 18 jaren die niet tot het
      huishouden van een ander behoren, voor wie deze op grond van de [Algemene Kinderbijslagwet][ref1] aanspraak op
      kinderbijslag heeft, wordt een toeslag voor een één-oudergezin toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0002368
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0002368
  - number: 3.5.2
    text: |-
      Het bedrag is opgenomen in [artikel 3.18][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel3
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.5'
  - number: 3.6.1
    text: |-
      De hoogte van de basisbeurs is verschillend voor uit- en thuiswonende studerenden en voor beroepsonderwijs en hoger
      onderwijs. De bedragen zijn opgenomen in [artikel 3.18][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel3
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.6
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.5'
  - number: 3.6.2
    text: Van de basisbeurs maakt een reisvoorziening deel uit, tenzij anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.6
  - number: 3.6.3
    text: |-
      Van de basisbeurs kunnen de toeslagen, bedoeld in de [artikelen 3.4][ref1] en [3.5][ref2], deel uitmaken.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel3
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.6
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0011453
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 3.7.1
    text: |-
      Voor studerenden aan een opleiding binnen Nederland bestaat de reisvoorziening uit een reisrecht gedurende
      een bepaald deel van de week waarvoor de studerende geen bedrag of een lager bedrag verschuldigd is aan het
      vervoerbedrijf.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.7
  - number: 3.7.2
    text: |-
      Voor studerenden die aanspraak hebben op studiefinanciering voor het volgen van een opleiding buiten Nederland,
      bestaat de reisvoorziening uit het bedrag, bedoeld in [artikel 4.8, tweede lid][ref1], respectievelijk
      [artikel 5.3, tweede lid][ref2]. In afwijking van de eerste volzin kan een studerende als bedoeld in de eerste
      volzin op aanvraag als reisvoorziening een reisrecht ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel5
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.7
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.1.2
        afdeling: '4.1'
      - id: ref2
        bwb_id: BWBR0011453
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 3.7.3
    text: |-
      Voor studerenden voor wie geen burgerservicenummer kan worden gebruikt in het contact tussen Onze Minister en
      RSR, bestaat de reisvoorziening uit het bedrag, bedoeld in [artikel 4.8, tweede lid][ref1], respectievelijk
      [artikel 5.3, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel5
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.7
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.1.2
        afdeling: '4.1'
      - id: ref2
        bwb_id: BWBR0011453
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 3.7.4
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over de wijze van aanvraag en toekenning van de
      reisvoorziening in geld, bedoeld in het tweede en derde lid alsmede regels met het oog op een goede uitvoering van
      dit artikel.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.7
  - number: 3.8.1
    text: |-
      De hoogte van de aanvullende beurs is afhankelijk van het ouderlijk inkomen en wordt berekend ingevolge de
      [artikelen 3.9 tot en met 3.13][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel3
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.8
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: 3.8.2
    text: |-
      Het maximale bedrag van de aanvullende beurs is opgenomen in [artikel 3.18][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel3
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.8
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.5'
  - number: 3.9.1
    text: |-
      Maatstaf voor de bepaling van de veronderstelde ouderlijke bijdrage is het toetsingsinkomen van de afzonderlijke
      ouders van de studerende in het peiljaar.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.9
  - number: 3.9.3
    text: |-
      Op het toetsingsinkomen in het peiljaar wordt in mindering gebracht de vrije voet. Deze voet is naar de
      maatstaf van 2008 gelijk aan € 15 928,16. Indien een van de ouders is overleden, geldt voor de andere ouder
      een dubbele vrije voet. Indien een studerende die niet geadopteerd is en die als ingezetene in de gemeentelijke
      basisadministratie persoonsgegevens is ingeschreven, blijkens die basisadministratie slechts één ouder heeft of
      [artikel 3.14][ref1] toepassing heeft gevonden, is de vorige volzin van overeenkomstige toepassing. Indien voor
      een ouder voor de inkomstenbelasting – naast de algemene heffingskorting – de alleenstaande-ouderkorting of de
      aanvullende alleenstaande-ouderkorting van toepassing is, en voor hem geen dubbele vrije voet geldt, geldt voor hem
      in afwijking van de tweede volzin een vrije voet die naar de maatstaf van 2008 gelijk is aan € 20 199,42.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel3
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.9
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: 3.9.4
    text: |-
      Het bruto kortingsbedrag op jaarbasis is 26% van het verschil tussen het toetsingsinkomen in het peiljaar en de
      vrije voet in het toekenningsjaar.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.9
  - number: 3.9.5
    text: 'Op het bruto kortingsbedrag, bedoeld in het vierde lid, worden in mindering gebracht:'
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.9
  - number: 3.9.5.a
    text: |-
      de ingevolge [hoofdstuk 6][ref1] vastgestelde termijnen over een jaar of, indien dit minder is, de berekende
      draagkracht indien de ouder tevens debiteur is, en


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.9
    references:
      - id: ref1
        bwb_id: BWBR0011453
        hoofdstuk: '6'
  - number: 3.9.5.b
    text: |-
      € 363,– voor ieder kind dat in het studiejaar dat aanvangt in het jaar voorafgaand
      aan het studiefinancieringstijdvak, onder de werking van de [hoofdstukken 3][ref1]
      of [4 van de Wet tegemoetkoming onderwijsbijdrage en schoolkosten][ref2] of van
      [artikel 2, derde tot en met vijfde lid, van de Wet op het kindgebonden budget][ref3] valt.


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0012438#Hoofdstuk4
      [ref3]: https://wetten.overheid.nl/BWBR0022751#Artikel2
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.9
    references:
      - id: ref1
        bwb_id: BWBR0012438
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0012438
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0022751
        artikel: '2'
  - number: 3.9.7
    text: |-
      Het bedrag dat na de toepassing van het vijfde lid resteert, is de berekeningsgrondslag voor een ouder van de
      veronderstelde ouderlijke bijdrage op jaarbasis.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.9
  - number: 3.9.8
    text: |-
      Indien een kind waarvoor de aftrek, bedoeld in het vijfde lid, onderdeel b, heeft plaatsgevonden, onder de werking
      van deze wet gaat vallen, wordt met ingang van het tijdstip waarop dit kind onder de werking van deze wet gaat
      vallen, de veronderstelde ouderlijke bijdrage, bedoeld in het zevende lid, opnieuw berekend.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.9
  - number: 3.9.9
    text: |-
      De berekeningsgrondslag voor een ouder van de veronderstelde ouderlijke bijdrage op maandbasis is de bijdrage,
      bedoeld in het zevende lid, gedeeld door 12.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.9
  - number: 3.10.1
    text: |-
      Op aanvraag van de ouders of een van hen of op aanvraag van de studerende wordt bij toepassing van
      [artikel 3.9][ref1], indien sprake is van een terugval in inkomen over het eerste of het tweede jaar na het
      peiljaar, uitgegaan van het toetsingsinkomen in dat jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel3
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.10
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: 3.10.2
    text: |-
      Voor de toepassing van het eerste lid wordt onder een terugval in inkomen verstaan een vermindering van de som
      van de toetsingsinkomens van de beide ouders tezamen met ten minste 15% ten opzichte van het peiljaar, met dien
      verstande dat:
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.10
  - number: 3.10.2.a
    text: |-
      de vermindering niet kan worden gerekend tot inkomensschommelingen die in het algemeen normaal kunnen worden geacht
      bij de gekozen wijze van inkomensverwerving, en
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.10
  - number: 3.10.2.b
    text: |-
      aannemelijk wordt gemaakt dat gedurende ten minste 3 kalenderjaren zal worden voldaan aan de vereisten genoemd in
      de aanhef, alsmede in onderdeel a.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.10
  - number: '3.11'
    text: |-
      Voor de toepassing van de [artikelen 3.9][ref1] en [3.10][ref2] wordt zolang het toetsingsinkomen over het
      peiljaar, het eerste of het tweede jaar na het peiljaar nog niet kan worden bepaald, door Onze Minister daarvoor in
      de plaats gesteld een bedrag dat het desbetreffende toetsingsinkomen zo goed mogelijk benadert.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel3
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.11
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.3'
      - id: ref2
        bwb_id: BWBR0011453
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: '3.12'
    text: |-
      Indien voor een ouder voor de inkomstenbelasting na het peiljaar – naast de algemene heffingskorting – de
      alleenstaande-ouderkorting van toepassing wordt, wordt op aanvraag van die ouder of de studerende de hoogte van de
      vrije voet, bedoeld in [artikel 3.9, derde lid][ref1], dienovereenkomstig aangepast.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel3
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.12
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: 3.13.1
    text: |-
      De veronderstelde ouderlijke bijdrage is de som van de maandbedragen, bedoeld in [artikel 3.9, negende lid][ref1].
      De veronderstelde ouderlijke bijdrage kan nooit meer bedragen dan de maximale aanvullende beurs voor een
      studerende.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel3
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.13
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: 3.13.2
    text: |-
      De aanvullende beurs van een studerende wordt verminderd met de in het eerste lid bedoelde veronderstelde
      ouderlijke bijdrage. De vermindering is nihil, indien de veronderstelde ouderlijke bijdrage negatief is.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.13
  - number: 3.13.3
    text: |-
      Indien een ouder meer dan een kind heeft dat recht heeft op studiefinanciering, met uitzondering van het kind dat
      tevens valt onder [artikel 3.9, vijfde lid, onder b][ref1], en dat met betrekking tot de desbetreffende maand een
      aanvullende beurs heeft aangevraagd, wordt het maandbedrag, bedoeld in het eerste lid, verdeeld over deze kinderen.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel3
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.13
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: 3.14.1
    text: |-
      Op aanvraag van een studerende kan de aan hem toegekende aanvullende lening worden verstrekt in de vorm van een
      aanvullende beurs, indien er sprake is van een langdurig ernstig verstoorde verhouding tussen ouder en studerende
      of van onvindbaarheid van de ouder. Onder een langdurig ernstig verstoorde verhouding wordt in ieder geval niet
      begrepen een conflict van financiële aard dat verband houdt met de studie.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.14
  - number: 3.14.2
    text: |-
      Indien het eerste lid toepassing vindt, is voor de berekening van de veronderstelde ouderlijke bijdrage van
      de andere ouder aan de studerende bedoeld in het eerste lid, [artikel 3.9, derde lid, derde volzin][ref1], van
      overeenkomstige toepassing. De hoogte van de aanvullende beurs van andere kinderen van beide ouders verandert
      hierdoor niet.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel3
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.14
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: 3.14.3
    text: |-
      Bij algemene maatregel van bestuur worden in ieder geval criteria gegeven ter beoordeling van de vraag of sprake
      is van:
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.14
  - number: 3.14.3.a
    text: een situatie als bedoeld in het eerste lid, en
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.14
  - number: 3.14.3.b
    text: de voorwaarden waaronder de toekenning van de aanvraag geschiedt.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.14
  - number: '3.15'
    text: |-
      De basislening is een lening. De hoogte van de basislening is opgenomen in [artikel 3.18][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel3
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.15
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.5'
  - number: '3.16'
    text: |-
      Het verschil tussen het maximale bedrag van de aanvullende beurs en de voor een studerende berekende aanvullende
      beurs wordt aan hem op aanvraag als een aanvullende lening toegekend.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.16
  - number: 3.16a.1
    text: Het collegegeldkrediet is een lening die aan de student op aanvraag wordt toegekend.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.16a
  - number: 3.16a.2
    text: |-
      Het bedrag dat per maand kan worden geleend bedraagt ten hoogste eentwaalfde deel van het bedrag,
      genoemd in [artikel 7.43, eerste lid, van de WHW][ref1]. Indien het door de student voor een periode van
      twaalf maanden te betalen bedrag voor het volgen van hoger onderwijs hoger is dan het bedrag, genoemd in
      [artikel 7.43, eerste lid, van de WHW][ref2], bedraagt het bedrag dat per maand kan worden geleend, in afwijking
      van de eerste volzin, ten hoogste eentwaalfde deel van het door de student voor een periode van twaalf maanden te
      betalen bedrag voor het volgen van hoger onderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.16a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
  - number: 3.16a.3
    text: |-
      Het collegegeldkrediet bedraagt per maand maximaal vijftwaalfde deel van het in
      [artikel 7.43, eerste lid, van de WHW][ref1] genoemde bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.16a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
  - number: 3.17.1
    text: |-
      Indien een studerende in een kalenderjaar meerinkomen heeft, leidt dit tot een vordering van Onze Minister op de
      studerende. Meerinkomen is het toetsingsinkomen, verminderd met een vrije voet van € 13 215,83.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.17
  - number: 3.17.3
    text: 'Tot het meerinkomen worden niet gerekend:'
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.17
  - number: 3.17.3.a
    text: |-
      een uitkering op grond van de [Wet werk en bijstand][ref1], de
      [Wet investeren in jongeren][ref2], de [Toeslagenwet][ref3] of de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref4] of de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref5], en


      [ref1]: https://wetten.overheid.nl/BWBR0015703
      [ref2]: https://wetten.overheid.nl/BWBR0026054
      [ref3]: https://wetten.overheid.nl/BWBR0004043
      [ref4]: https://wetten.overheid.nl/BWBR0004044
      [ref5]: https://wetten.overheid.nl/BWBR0004163
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.17
    references:
      - id: ref1
        bwb_id: BWBR0015703
      - id: ref2
        bwb_id: BWBR0026054
      - id: ref3
        bwb_id: BWBR0004043
      - id: ref4
        bwb_id: BWBR0004044
      - id: ref5
        bwb_id: BWBR0004163
  - number: 3.17.3.b
    text: de studiefinanciering verstrekt op grond van deze wet en voor zover in deze inkomsten begrepen.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.17
  - number: 3.17.4
    text: |-
      Voor iedere maand dat een studerende een uitkering ontvangt in de zin van de [Algemene nabestaandenwet][ref1],
      blijft daarvan een bedrag ter grootte van het bedrag voor een thuiswonende deelnemer, bedoeld in
      [artikel 3.8][ref2], buiten beschouwing.


      [ref1]: https://wetten.overheid.nl/BWBR0007795
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel3
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.17
    references:
      - id: ref1
        bwb_id: BWBR0007795
      - id: ref2
        bwb_id: BWBR0011453
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: 3.17.5
    text: |-
      Bij de berekening van het meerinkomen blijft buiten beschouwing inkomen waarvan de studerende aantoont dat het is
      verworven over de periode in het kalenderjaar waarin hij zonder onderbreking geen studerende was in de zin van deze
      wet of waarin hij heeft afgezien van zijn aanspraak op studiefinanciering. Dit kan slechts de periode betreffen:
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.17
  - number: 3.17.5.a
    text: die begint bij de aanvang van het kalenderjaar, of
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.17
  - number: 3.17.5.b
    text: die eindigt bij het einde van het kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.17
  - number: 3.17.6
    text: |-
      Voor de toepassing van het vijfde lid worden de volgende onderdelen van het toetsingsinkomen op verzoek van de
      studerende herleid tot maandbedragen door de desbetreffende bedragen te delen door 12:
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.17
  - number: 3.17.6.a
    text: |-
      de belastbare winst uit onderneming, bedoeld in
      [artikel 3.1, tweede lid, onder a van de Wet inkomstenbelasting 2001][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.17
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 3.17.6.b
    text: |-
      de negatieve persoonsgebonden aftrekposten, bedoeld in
      [artikel 3.1, tweede lid, onderdeel g, van de Wet inkomstenbelasting 2001][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.17
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 3.17.6.c
    text: |-
      de persoonsgebonden aftrek, bedoeld in
      [artikel 3.1, tweede lid, onderdeel j, van de Wet inkomstenbelasting 2001][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.17
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 3.17.6.d
    text: |-
      het inkomen uit aanmerkelijk belang, bedoeld in [hoofdstuk 4 van de Wet inkomstenbelasting 2001][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.17
    references:
      - id: ref1
        bwb_id: BWBR0011353
        hoofdstuk: '4'
  - number: 3.17.6.e
    text: |-
      het belastbare inkomen uit sparen en beleggen, bedoeld in [hoofdstuk 5 van de Wet inkomstenbelasting 2001][ref1],
      verminderd met daarin begrepen te conserveren inkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.17
    references:
      - id: ref1
        bwb_id: BWBR0011353
        hoofdstuk: '5'
  - number: 3.17.7
    text: |-
      Indien een studerende in een kalenderjaar meerinkomen heeft, is die studerende aan Onze Minister een bedrag ter
      grootte van het meerinkomen verschuldigd, met dien verstande dat dit bedrag niet groter kan zijn dan de som van de
      met betrekking tot dat kalenderjaar aan die studerende toegekende bedragen aan:
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.17
  - number: 3.17.7.a
    text: basisbeurs,
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.17
  - number: 3.17.7.b
    text: aanvullende beurs, en
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.17
  - number: 3.17.7.c
    text: |-
      voor iedere maand waarin hij op enig moment beschikte over de reisvoorziening, het bedrag gelijk aan eentwaalfde
      deel van de waarde van de reisvoorziening, bedoeld in [artikel 5.3, tweede lid][ref1], vermenigvuldigd met het
      aantal maanden waarover met inachtneming van het vijfde lid het toetsingsinkomen is berekend.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel5
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.17
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 3.17.8
    text: |-
      Over de verschuldigde bedragen, bedoeld in het zevende lid, wordt rente berekend op de voet van de
      [artikelen 6.3][ref1] en [6.4][ref2], met ingang van de eerste dag van de kalendermaand volgend op de dag waarop de
      beschikking terzake is gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel6
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.17
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
      - id: ref2
        bwb_id: BWBR0011453
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 3.17.9
    text: |-
      Indien een studerende voor 1 juni van een kalenderjaar aan Onze Minister schriftelijk opgave doet van het bedrag
      aan meerinkomen in het aan dat kalenderjaar voorafgaande kalenderjaar, is het achtste lid op deze studerende niet
      van toepassing, voor zover dat bedrag voor die datum door hem is betaald.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.17
  - number: 3.17.10
    text: |-
      De vordering die ontstaat door toepassing van het zevende lid, wordt in mindering gebracht op de met betrekking tot
      dat kalenderjaar aan de studerende toegekende prestatiebeurs. Voor zover de prestatiebeurs over dat kalenderjaar
      niet is uitbetaald, wordt de vordering verrekend met die prestatiebeurs. De opgebouwde rente over het in mindering
      gebrachte bedrag gaat teniet.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.17
  - number: 3.17.11
    text: |-
      Een aanvraag van de studerende aan Onze Minister om zijn studiefinanciering te beëindigen heeft voor de toepassing
      van het vijfde lid uitsluitend werking indien dat verzoek is ingediend voor 1 juli van het daaropvolgende
      kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel3.17
  - number: '3.18'
    text: |-
