    text: |-
      van 1 januari 2006 tot 1 januari 2007: 3. Het gecorrigeerde verzamelinkomen in het peiljaar wordt, indien het
      een negatief bedrag is, gesteld op nihil. Vervolgens wordt daarop in mindering gebracht de vrije voet. Deze voet
      is gelijk aan € 15 275,67. Indien een van de ouders is overleden, geldt voor de andere ouder een dubbele vrije
      voet. Indien een studerende die niet geadopteerd is en die als ingezetene in de gemeentelijke basisadministratie
      persoonsgegevens is ingeschreven, blijkens die basisadministratie slechts één ouder heeft of [artikel 3.14][ref1]
      toepassing heeft gevonden, is de vorige volzin van overeenkomstige toepassing. Indien voor een ouder voor de
      inkomstenbelasting – naast de algemene heffingskorting – de alleenstaande-ouderkorting van toepassing is, en voor
      hem geen dubbele vrije voet geldt, geldt voor hem in afwijking van de derde volzin een vrije voet die gelijk is aan
      € 19 546,93.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel3
