  - number: '2.1'
    text: 'Deze wet regelt de studiefinanciering en is van toepassing op studerenden die voldoen aan de voorwaarden inzake:'
    url: https://wetten.overheid.nl/BWBR0011453/2010-01-01#Artikel2.1
  - number: 2.1.a
    text: |-
      nationaliteit als bedoeld in [artikel 2.2][ref1],


