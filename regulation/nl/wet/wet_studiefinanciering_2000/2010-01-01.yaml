  - number: 4.21.2
    text: |-
      [Artikel 4.19][ref1] is van overeenkomstige toepassing voorzover de studiefinanciering in de vorm van een gift
      is toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel4
