  - number: 9.6b
    text: |-
      1 Onze Minister is bevoegd de persoonsgegevens die bij hem bekend zijn als gevolg van de uitvoering van zijn
      wettelijke taken te verstrekken aan of uit te wisselen met de voor de verstrekking van een tegemoetkoming in de
      kosten voor toegang tot het onderwijs of voor levensonderhoud voor studenten verantwoordelijke autoriteit van een
      andere staat.

      2 De in het eerste lid bedoelde verantwoordelijke autoriteit toont voor de verstrekking van persoonsgegevens aan
      dat de student ten laste van die autoriteit een tegemoetkoming in de kosten voor de toegang tot het onderwijs of
      voor levensonderhoud heeft aangevraagd dan wel reeds ontvangt.

      3 Onze Minister kan, voor de uitvoering van de wet, inlichtingen over een student die studiefinanciering aanvraagt
      dan wel reeds ontvangt, opvragen bij het bevoegd gezag van een andere staat waar de student een opleiding wil gaan
      volgen of volgt met studiefinanciering op grond van [artikel 2.14, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel2.14
    url: https://wetten.overheid.nl/BWBR0011453/2026-01-01#Artikel9.6b
