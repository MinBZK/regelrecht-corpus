  - number: '6.12'
    text: |-
      1 Op aanvraag van de debiteur wordt bij de toepassing van [artikel 6.10][ref1] uitgegaan van het inkomen van een
      ander jaar dan het inkomen in het peiljaar, indien:

      a. sprake is van een terugval in inkomen over het jaar voorafgaande aan het jaar waarvoor de draagkracht wordt
      vastgesteld, in welk geval wordt uitgegaan van het jaar voorafgaande aan het jaar waarvoor de draagkracht wordt
      vastgesteld, of

      b. sprake is van een terugval in inkomen over het jaar waarvoor de draagkracht wordt vastgesteld, in welk geval
      wordt uitgegaan van het jaar waarvoor de draagkracht wordt vastgesteld.

      2 Voor de toepassing van het eerste lid wordt onder een terugval in inkomen verstaan: een vermindering van het
      toetsingsinkomen van de debiteur van ten minste 15% ten opzichte van het peiljaar.

      3 Voor de toepassing van het eerste lid wordt zolang het belastbaar minimumloon in het peiljaar, het jaar
      voorafgaande aan het jaar waarvoor de draagkracht wordt vastgesteld, of het jaar waarvoor de draagkracht wordt
      vastgesteld nog niet definitief bekend is, daarvoor in de plaats gesteld het bedrag dat naar het oordeel van Onze
      Minister het uiteindelijke belastbaar minimumloon benadert.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel6.10
    url: https://wetten.overheid.nl/BWBR0011453/2026-01-01#Artikel6.12
