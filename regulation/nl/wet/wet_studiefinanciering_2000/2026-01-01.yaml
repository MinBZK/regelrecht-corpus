  - number: '9.9'
    text: |-
      1 Indien een student het normbedrag voor een uitwonende student toegekend heeft gekregen maar niet heeft voldaan
      aan de verplichtingen, bedoeld in [artikel 1.5][ref1], kan Onze Minister hem een bestuurlijke boete opleggen
      van ten hoogste 50 procent van het bedrag dat van de student in verband daarmee wordt teruggevorderd bij een
      herziening.

      2 De herziening vindt plaats met ingang van de datum van de laatste adreswijziging van de student in de
      basisregistratie personen. Indien de ouders van de student of een van hen na de laatste adreswijziging, bedoeld in
      de vorige volzin, zijn of is ingeschreven op hetzelfde woonadres als de student, dan vindt de herziening plaats met
      ingang van de dag van deze adreswijziging.

      3 Degene aan wie een bestuurlijke boete is opgelegd is verplicht desgevraagd aan Onze Minister de inlichtingen te
      verstrekken die voor de tenuitvoerlegging van de bestuurlijke boete van belang zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel1.5
    url: https://wetten.overheid.nl/BWBR0011453/2026-01-01#Artikel9.9
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '1.5'
        hoofdstuk: '1'
  - number: 9.9a
    text: |-
      1 Indien Onze Minister de student een bestuurlijke boete als bedoeld in [artikel 9.9, eerste lid][ref1], heeft
      opgelegd en de student heeft, nadat voormelde bestuurlijke boete onherroepelijk is geworden, voor een tweede maal
      niet voldaan aan de verplichtingen, bedoeld in [artikel 1.5][ref2], kan Onze Minister hem een bestuurlijke boete
      opleggen van ten hoogste 100 procent van het bedrag dat van de student in verband daarmee wordt teruggevorderd bij
      een herziening.

      2 De herziening vindt plaats met ingang van de dag na de laatste dag van de periode waarop de herziening,
      bedoeld in [artikel 9.9, eerste lid][ref3], ziet of, indien dit een latere datum betreft, de dag van de laatste
      adreswijziging van de student in de basisregistratie personen. Indien de ouders van de student of een van hen
      na de laatste dag van de periode waarop de herziening, bedoeld in artikel 9.9, eerste lid, ziet of na de laatste
      adreswijziging, bedoeld in de vorige volzin, zijn of is ingeschreven op hetzelfde woonadres als de student, dan
      vindt de herziening plaats met ingang van de dag van deze adreswijziging.

      3 Indien Onze Minister de student een boete als bedoeld in het eerste lid heeft opgelegd kan hij tevens beslissen
      dat elke aanspraak op studiefinanciering vervalt.

      4 Degene aan wie een bestuurlijke boete is opgelegd is verplicht desgevraagd aan Onze Minister de inlichtingen te
      verstrekken die voor de tenuitvoerlegging van de bestuurlijke boete van belang zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel9.9
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel1.5
      [ref3]: https://wetten.overheid.nl/BWBR0011453#Artikel9.9
