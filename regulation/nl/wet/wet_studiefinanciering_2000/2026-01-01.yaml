  - number: '9.6'
    text: |-
      1 Organen met een publiekrechtelijke taak zijn verplicht op een bij algemene maatregel van bestuur aan te geven
      wijze kosteloos inlichtingen te verstrekken, benodigd voor de uitvoering van deze wet.

      2 RSR verstrekt op verzoek van Onze Minister voor de uitvoering van [artikel 3.27, tweede lid][ref1], het gegeven
      of een persoon in een bepaalde periode nadat zijn reisproduct op grond van artikel 3.27, eerste lid, zou moeten
      zijn stopgezet, gebruik heeft gemaakt van het reisproduct.

      3 Voor de uitvoering van het eerste lid, verstrekt de rechtspersoon die tot taak heeft het beheer van de aan de
      dragers van het reisproduct gekoppelde reisgegevens, op verzoek van RSR het gegeven of binnen een bepaalde periode
      gebruik is gemaakt van het reisproduct gekoppeld aan een bepaalde drager.

      4 Onze Minister verwerkt de persoonsgegevens die hij ontvangt of bezit voor de uitvoering van
      [artikel 3.27, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel3.27
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel3.27
