  - number: '2.14'
    text: |-
      1 Dit artikel is niet van toepassing op het levenlanglerenkrediet en op ho-studenten die op grond van
      [artikel 2.2, tweede lid][ref1], slechts een tegemoetkoming in de kosten van de toegang tot het onderwijs
      ontvangen.

      2 Een ho-student die is ingeschreven voor het volgen van onderwijs aan een opleiding in het hoger onderwijs buiten
      Nederland, bedoeld in het derde lid, komt in aanmerking voor studiefinanciering indien hij:

      a. gebruik heeft gemaakt van het vrij verkeer bedoeld in het Verdrag betreffende de werking van de Europese Unie en
      op grond van bij algemene maatregel van bestuur vastgestelde criteria een band heeft met Nederland; of

      b. ten minste 3 jaren van de 6 jaren voorafgaand aan diens inschrijving aan die opleiding in Nederland heeft
      gewoond en gedurende deze periode rechtmatig verblijf heeft gehad, waarbij de periode gedurende welke een ho-
      student is ingeschreven aan een opleiding buiten Nederland als bedoeld in het derde lid, niet meetelt voor de
      bepaling van deze 6 jaren.

      3 Van een opleiding in het hoger onderwijs buiten Nederland waarvoor studiefinanciering wordt toegekend is sprake
      indien:

      a. in Nederland voor een vergelijkbaar soort opleiding studiefinanciering wordt verstrekt;

      b. het niveau en de kwaliteit van de opleiding vergelijkbaar zijn met overeenkomstige opleidingen in de zin van
      de WHW;

      c. het afsluitend examen voor de opleiding vergelijkbaar is met een afsluitend examen voor overeenkomstige
      opleidingen in de zin van de WHW; en

      d. de opleiding voldoet aan criteria die bij ministeriële regeling kunnen worden vastgesteld.

      4 Onze Minister stelt vast of een opleiding buiten Nederland voldoet aan de criteria, bedoeld in het derde
      lid. Onze Minister stelt voor de opleiding buiten Nederland de duur en de vorm van de studiefinanciering vast
      overeenkomstig de duur en de vorm waarin deze voor een vergelijkbare opleiding in Nederland wordt verstrekt.

      5 Het [tweede en derde lid van artikel 2.2 van de Wet inkomstenbelasting 2001][ref2] zijn van overeenkomstige
      toepassing op het tweede lid. Het tweede en derde lid van artikel 2.2 van de Wet inkomstenbelasting 2001 zijn,
      voor de toepassing van de eerste volzin, tevens van overeenkomstige toepassing op personen met een andere dan de
      Nederlandse nationaliteit.

      6 Bij ministeriële regeling kan een maximum worden gesteld aan het aantal aanvragen van ho-studenten voor
      studiefinanciering voor het volgen van onderwijs buiten Nederland.

      7 Het zesde lid is niet van toepassing op aanvragen van ho-studenten die in de 12 maanden voorafgaand aan de
      periode waarvoor studiefinanciering voor het volgen van onderwijs buiten Nederland wordt aangevraagd, reeds
      studiefinanciering voor het volgen van onderwijs buiten Nederland toegekend hebben gekregen.

      8 Bij ministeriële regeling kunnen nadere regels met betrekking tot de uitvoering van dit artikel worden
      vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel2.2
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel2.2
