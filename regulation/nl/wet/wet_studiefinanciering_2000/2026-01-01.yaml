  - number: '4.19'
    text: |-
      1 Een mbo-student verstrekt jaarlijks binnen een door Onze Minister te bepalen termijn aan Onze Minister een
      gewaarmerkt afschrift van het bewijs waaruit blijkt voor welke maanden van het desbetreffende studiejaar hij is
