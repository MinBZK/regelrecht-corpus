  - number: 13.2b
    text: |-
      In afwijking van [artikel 3.16a, tweede lid][ref1], onderscheidenlijk
      [artikel 3.16d, eerste lid, onderdeel a][ref2], kan een ho-student voor het studiejaar 2021–2022 in totaal ten
      hoogste € 903,33 per maand lenen.


