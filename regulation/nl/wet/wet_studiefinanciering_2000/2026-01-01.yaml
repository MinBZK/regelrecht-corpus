  - number: '6.13'
    text: |-
      Indien het een debiteur betreft die na het peiljaar een ouder zonder partner is, wordt op aanvraag van de debiteur
      de hoogte van zijn draagkracht dienovereenkomstig aangepast.
    url: https://wetten.overheid.nl/BWBR0011453/2026-01-01#Artikel6.13
  - number: '6.14'
    text: |-
      1 Indien de partner van de debiteur ook een debiteur is op wie dit hoofdstuk van toepassing is, wordt:

      a. [artikel 6.10, eerste en derde lid][ref1], slechts eenmaal toegepast op het totaal van het toetsingsinkomen voor
      beide partners samen;

      b. de draagkracht per debiteur vastgesteld op basis van de verhouding tussen de hoogte van het toetsingsinkomen van
      beide debiteuren afzonderlijk;

      c. de draagkracht van de debiteur eerst aangewend voor de eigen termijnbetaling. Het bedrag aan resterende
      draagkracht van de debiteur wordt toegevoegd aan de draagkracht van de partner van wie de draagkracht zonder deze
      toevoeging lager is dan diens termijnbetaling.

      2 Indien de debiteur een partner heeft op wie hoofdstuk 10a van toepassing is, wordt het op grond van
      [artikel 6.10][ref2] berekende bedrag van de draagkracht van de debiteur verminderd met de op grond van
      [artikel 10a.6][ref3] voor zijn partner vastgestelde termijnbetaling, dan wel de op grond van [artikel 10a.7][ref4]
      berekende draagkracht van zijn partner. Indien de uitkomst negatief is wordt de draagkracht van de debiteur op
      nihil vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel6.10
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel6.10
      [ref3]: https://wetten.overheid.nl/BWBR0011453#Artikel10a.6
      [ref4]: https://wetten.overheid.nl/BWBR0011453#Artikel10a.7
    url: https://wetten.overheid.nl/BWBR0011453/2026-01-01#Artikel6.14
