  - number: '3.14'
    text: |-
      1 Op aanvraag van een student kan de aan hem toegekende aanvullende lening worden verstrekt in de vorm van een
      aanvullende beurs, indien er sprake is van een langdurig ernstig verstoorde verhouding tussen ouder en student
      of van onvindbaarheid van de ouder. Onder een langdurig ernstig verstoorde verhouding wordt in ieder geval niet
      begrepen een conflict van financiële aard dat verband houdt met de studie.

      2 Indien het eerste lid toepassing vindt, is voor de berekening van de veronderstelde ouderlijke bijdrage van
      de andere ouder aan de student bedoeld in het eerste lid, [artikel 3.9, tweede lid, derde volzin][ref1], van
      overeenkomstige toepassing. De hoogte van de aanvullende beurs van andere kinderen van beide ouders verandert
      hierdoor niet.

      3 Bij algemene maatregel van bestuur worden in ieder geval criteria gegeven ter beoordeling van de vraag of sprake
      is van:

      a. een situatie als bedoeld in het eerste lid, en

      b. de voorwaarden waaronder de toekenning van de aanvraag geschiedt.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel3.9
    url: https://wetten.overheid.nl/BWBR0011453/2026-01-01#Artikel3.14
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '3.9'
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: '3.15'
    text: |-
      Op aanvraag wordt een basislening toegekend. De maximale hoogte van de basislening is opgenomen in
      [artikel 3.18][ref1], waarbij verschillende bedragen zijn vastgesteld voor mbo-studenten en ho-studenten.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel3.18
    url: https://wetten.overheid.nl/BWBR0011453/2026-01-01#Artikel3.15
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '3.18'
        hoofdstuk: '3'
        paragraaf: '3.5'
  - number: '3.16'
    text: |-
      Het verschil tussen het maximale bedrag van de aanvullende beurs en de voor een student berekende aanvullende beurs
      wordt aan hem op aanvraag als een aanvullende lening toegekend.
    url: https://wetten.overheid.nl/BWBR0011453/2026-01-01#Artikel3.16
  - number: 3.16a
    text: |-
      1 Het collegegeldkrediet is een lening die aan de ho-student op aanvraag wordt toegekend.

      2 Het bedrag dat per maand kan worden geleend bedraagt niet meer dan een twaalfde deel van het feitelijk door
      de ho-student voor een periode van twaalf maanden te betalen bedrag aan collegegeld voor het volgen van hoger
      onderwijs en in totaal ten hoogste vijf maal een twaalfde deel van het volledige wettelijk collegegeld, bedoeld in
      [artikel 7.45, eerste lid, WHW][ref1].

      3 Bij ministeriële regeling kunnen nadere regels worden gesteld over de aanvraag, toekenning, betaling en andere
      uitvoeringsaspecten van het collegegeldkrediet.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7.45
    url: https://wetten.overheid.nl/BWBR0011453/2026-01-01#Artikel3.16a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7.45'
  - number: 3.16b
    text: |-
      1 Het levenlanglerenkrediet is een lening die aan een student op aanvraag wordt toegekend.

      2 Het levenlanglerenkrediet wordt slechts verstrekt:

      a. indien de student niet in aanmerking komt voor studiefinanciering als bedoeld in
      [artikel 3.1, eerste of tweede lid][ref1];

      b. in geval het krediet wordt gevraagd voor een voltijdse of duale opleiding in het hoger onderwijs en de ho-
      student nog niet de leeftijd van dertig jaren heeft bereikt, die ho-student een hbo-bacheloropleiding als bedoeld
      in [artikel 7.3a, tweede lid, onderdeel b, WHW][ref2] of het geheel van een wo-bacheloropleiding en een wo-
      masteropleiding als bedoeld in artikel 7.3a, eerste lid, onderdelen a en b, WHW met goed gevolg heeft afgesloten;
      en

      c. voor zover de kosten voor het lesgeld of collegegeld niet door een derde worden vergoed.

      3 Bij algemene maatregel van bestuur kunnen gronden worden vastgesteld op basis waarvan een aanvraag gelet op
      terugbetalingsrisico’s kan worden geweigerd.

      4 De [hoofdstukken 4][ref3] en[ 5][ref4] zijn niet van toepassing op het levenlanglerenkrediet.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel3.1
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7.3a
      [ref3]: https://wetten.overheid.nl/BWBR0011453#Hoofdstuk4
      [ref4]: https://wetten.overheid.nl/BWBR0011453#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0011453/2026-01-01#Artikel3.16b
    references:
