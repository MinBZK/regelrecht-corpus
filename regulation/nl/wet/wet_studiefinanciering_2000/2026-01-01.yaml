    text: |-
      Voor studiefinanciering kan een ho-student in aanmerking komen die is ingeschreven voor het volgen van een
      voltijdse wetenschappelijk theologische opleiding ten behoeve waarvan aan het desbetreffende kerkgenootschap
      vanwege het Rijk een bijdrage wordt verleend.
    url: https://wetten.overheid.nl/BWBR0011453/2026-01-01#Artikel2.10
  - number: '2.11'
    text: |-
      Voor studiefinanciering kan een ho-student in aanmerking komen die is ingeschreven voor het volgen van bij
      algemene maatregel van bestuur aangewezen hoger onderwijs dat anders dan op grond van de [WHW][ref1], volledig en
      rechtstreeks uit de openbare kas wordt bekostigd.


      [ref1]: https://wetten.overheid.nl/BWBR0005682
    url: https://wetten.overheid.nl/BWBR0011453/2026-01-01#Artikel2.11
    references:
      - id: ref1
        bwb_id: BWBR0005682
  - number: '2.12'
    text: |-
      Een ho-student kan in aanmerking komen voor levenlanglerenkrediet, indien hij is ingeschreven voor het volgen van:

      a. een opleiding als bedoeld in de [artikelen 2.8 tot en met 2.11][ref1];

      b. een postinitiële masteropleiding als bedoeld in [artikel 7.3b WHW][ref2];

      c. een deeltijdse opleiding in het hoger onderwijs, bedoeld in [artikel 7.7, eerste lid, WHW][ref3], waaraan
      accreditatie als bedoeld in [artikel 1.1, onderdeel q, WHW][ref4] is verleend; of

      d. een of meer onderwijseenheden als bedoeld in [artikel 7.3, tweede lid, WHW][ref5], van een opleiding waaraan
      accreditatie als bedoeld in [artikel 1.1, onderdeel q, WHW][ref6] is verleend, aan:

      1°. de Open Universiteit;

      2°. een rechtspersoon voor hoger onderwijs als bedoeld in [artikel 1.1 WHW][ref7]; of

      3°. een bekostigde instelling voor hoger onderwijs als bedoeld in [artikel 1.8, eerste lid, WHW][ref8], met
      uitzondering van de Open Universiteit, in bij ministeriële regeling te bepalen gevallen, waarin bij wijze
      van experiment op grond van [artikel 1.7a WHW][ref9], in afwijking van [artikel 7.32, derde lid, WHW][ref10],
      inschrijving voor een onderwijseenheid is toegestaan.


