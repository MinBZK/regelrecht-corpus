        paragraaf: '2.2'
  - number: '2.2'
    text: |-
      1 Voor studiefinanciering kan een student in aanmerking komen die:

      a. de Nederlandse nationaliteit bezit,

      b. niet de Nederlandse nationaliteit bezit maar wel ingevolge een verdrag of een besluit van een volkenrechtelijke
      organisatie op het terrein van de studiefinanciering met een Nederlander wordt gelijkgesteld, of

      c. niet de Nederlandse nationaliteit bezit maar wel in Nederland woont en behoort tot een bij algemene maatregel
      van bestuur aangewezen groep van personen die voor het terrein van de studiefinanciering met Nederlanders worden
      gelijkgesteld.

      2 Onverminderd het eerste lid, onderdeel b, kunnen bij algemene maatregel van bestuur groepen van personen worden
      aangewezen voor wie de gelijkstelling, bedoeld in het eerste lid, onderdeel b, slechts een tegemoetkoming in de
      kosten van de toegang tot het onderwijs betreft. Bij algemene maatregel van bestuur kunnen regels worden gesteld
      met betrekking tot de hoogte en de vorm van deze tegemoetkoming.
    url: https://wetten.overheid.nl/BWBR0011453/2026-01-01#Artikel2.2
  - number: '2.3'
    text: |-
      1 Een mbo-student kan in aanmerking komen voor:

      a. een reisvoorziening met ingang van de eerste dag van de maand waarin hij beroepsonderwijs is gaan volgen;

      b. studiefinanciering met ingang van:

      1°. de eerste dag van de maand volgend op het kwartaal waarin hij de leeftijd van 18 jaren heeft bereikt; of

      2°. de eerste dag van het kwartaal indien hij op die dag de leeftijd van 18 jaren heeft bereikt.

      2 Voor studiefinanciering kan een ho-student in aanmerking komen met ingang van de eerste dag van de maand waarin
      hij hoger onderwijs is gaan volgen.

      3 Voor studiefinanciering kan een student in aanmerking komen tot en met de maand waarin hij de leeftijd van 30
      jaren heeft bereikt.

      4 In afwijking van het derde lid behoudt een student bij het bereiken van de leeftijd van 30 jaren zijn aanspraak,
      zolang hij zonder onderbreking studiefinanciering geniet.
    url: https://wetten.overheid.nl/BWBR0011453/2026-01-01#Artikel2.3
  - number: 2.3a
    text: |-
      1 In afwijking van [artikel 2.3, eerste en derde lid][ref1], kan een mbo-student voor levenlanglerenkrediet in
      aanmerking komen die 30 jaren of ouder is maar nog niet de maximumleeftijd heeft bereikt.

      2 In afwijking van [artikel 2.3, tweede en derde lid][ref2], kan een ho-student voor levenlanglerenkrediet in
      aanmerking komen die nog niet de maximumleeftijd heeft bereikt.

      3 In afwijking van het eerste en tweede lid behoudt een student bij het bereiken van de maximumleeftijd zijn
      aanspraak, zolang hij zonder onderbreking levenlanglerenkrediet geniet.

      4 De maximumleeftijd bedraagt 56 jaar .

      5 De maximumleeftijd wordt telkens verhoogd met een volledig jaar met ingang van het studiejaar
      dat aanvangt in hetzelfde jaar als waarin de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a van de Algemene ouderdomswet][ref3], cumulatief met een volledig jaar is verhoogd.

      6 De verhoogde maximumleeftijd wordt bekendgemaakt door plaatsing in de Staatscourant en vervangt de
      maximumleeftijd, bedoeld in het vierde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel2.3
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel2.3
      [ref3]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
    url: https://wetten.overheid.nl/BWBR0011453/2026-01-01#Artikel2.3a
