  - number: '3.24'
    text: |-
      1 Voor studenten aan een opleiding binnen Nederland bestaat de reisvoorziening uit een reisrecht gedurende
      een bepaald deel van de week waarvoor de student geen bedrag of een lager bedrag verschuldigd is aan de
      vervoersbedrijven.

      2 Voor studenten die aanspraak hebben op studiefinanciering voor het volgen van een opleiding buiten Nederland,
      bestaat de reisvoorziening uit het bedrag, bedoeld in [artikel 4.8, eerste lid][ref1], onderscheidenlijk
      [artikel 5.3, eerste lid][ref2]. In afwijking van de eerste volzin kan een student als bedoeld in de eerste volzin
      op aanvraag als reisvoorziening een reisrecht ontvangen.

      3 Voor studenten aan een opleiding binnen Nederland die een deel van deze opleiding buiten Nederland volgen is het
      tweede lid van overeenkomstige toepassing.

      4 Voor studenten voor wie geen burgerservicenummer kan worden gebruikt in het contact tussen Onze Minister en
      RSR, bestaat de reisvoorziening uit het bedrag, bedoeld in [artikel 4.8, eerste lid][ref3], onderscheidenlijk
      [artikel 5.3, eerste lid][ref4].

      5 Bij ministeriële regeling kunnen regels worden gesteld over de wijze van aanvraag en toekenning van de
      reisvoorziening in geld, bedoeld in het tweede, derde en vierde lid alsmede regels met het oog op een goede
      uitvoering van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel4.8
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel5.3
      [ref3]: https://wetten.overheid.nl/BWBR0011453#Artikel4.8
      [ref4]: https://wetten.overheid.nl/BWBR0011453#Artikel5.3
