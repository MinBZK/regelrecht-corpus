  - number: 6.19a
    text: |-
      De terugbetaling van de lening die is ontstaan door toekenning van het levenlanglerenkrediet wordt geschorst
      gedurende de eerste vier maanden van de terugbetalingsperiode.
    url: https://wetten.overheid.nl/BWBR0011453/2026-01-01#Artikel6.19a
  - number: 6.19b
    text: |-
      Voor een debiteur voor wie de terugbetalingsperiode is begonnen van een lening beroepsonderwijs, lening
      hoger onderwijs of een lening die is ontstaan door toekenning van het levenlanglerenkrediet, en aan wie
      levenlanglerenkrediet of studiefinanciering als bedoeld in [artikel 3.1, eerste of tweede lid][ref1], wordt
      toegekend of die student wordt zonder studiefinanciering te ontvangen, kan op bij ministeriële regeling te bepalen
      wijze schorsing plaatsvinden van:

      a. de terugbetalingsperiode van de lening beroepsonderwijs of lening hoger onderwijs; en

      b. de terugbetalingsperiode van de lening die is ontstaan door toekenning van het levenlanglerenkrediet.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel3.1
