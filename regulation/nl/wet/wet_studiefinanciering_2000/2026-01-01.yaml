  - number: '3.13'
    text: |-
      1 De veronderstelde ouderlijke bijdrage is voor een mbo-student de som van de maandbedragen, bedoeld in
      [artikel 3.9, vijfde lid][ref1], en voor een ho-student de som van de maandbedragen die zijn bepaald door
      toepassing van[ artikel 3.9a][ref2]. De veronderstelde ouderlijke bijdrage kan nooit meer bedragen dan de maximale
      aanvullende beurs voor een student.

      2 Indien de veronderstelde ouderlijke bijdrage negatief is, wordt deze vastgesteld op nihil.

      3 Bij de berekening van de veronderstelde ouderlijke bijdrage per studerend kind wordt de bijdrage verdeeld over de
      studerende kinderen van een ouder indien:

      a. meer dan een van deze kinderen voor de betreffende maand aanspraak heeft op studiefinanciering; en

      b. de kinderen voor de betreffende maand een aanvullende beurs hebben aangevraagd.

      4 Bij de verdeling van de veronderstelde ouderlijke bijdrage, bedoeld in het derde lid, wordt een kind dat tevens
      onder de reikwijdte van [artikel 3.9, vierde lid, onderdeel b][ref3], valt, buiten beschouwing gelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel3.9
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel3.9a
      [ref3]: https://wetten.overheid.nl/BWBR0011453#Artikel3.9
    url: https://wetten.overheid.nl/BWBR0011453/2026-01-01#Artikel3.13
