        artikel: '4.3'
        hoofdstuk: '4'
        paragraaf: 4.1.1
        afdeling: '4.1'
  - number: '4.5'
    text: |-
      1 Het bestuur van de rechtspersoon waarvan de instelling, bedoeld in [artikel 2.4, onderdeel b][ref1], uitgaat of
      de natuurlijke persoon die deze instelling in stand houdt, stelt uiterlijk op de derde werkdag na afloop van een
      periode van afwezigheid van 4 weken de mbo-student in kennis dat daarvan in de administratie van de instelling een
      aantekening is gemaakt en verzoekt de mbo-student om opgaaf van de reden van de afwezigheid.

      2 Uiterlijk op de vijfde werkdag na de periode van 8 weken stelt het bestuur van de rechtspersoon of de natuurlijke
      persoon vast:

      a. of de reden die de mbo-student binnen 8 weken na de aanvang van de periode van 5 weken gaf voor zijn
      afwezigheid, een geldige reden als bedoeld in [artikel 8.1.7, negende lid, WEB][ref2], is, of

      b. dat de mbo-student binnen 8 weken na de aanvang van de periode van 5 weken geen reden heeft opgegeven voor zijn
      afwezigheid.

      3 Het bestuur van de rechtspersoon of de natuurlijke persoon stelt tevens uiterlijk op de vijfde werkdag na afloop
      van de periode van 8 weken vast of de mbo-student voor het einde van die periode weer aan het onderwijs is gaan
      deelnemen.

      4 Het bestuur van de rechtspersoon of de natuurlijke persoon meldt uiterlijk de vijfde werkdag na afloop van een
      periode van 8 weken aan Onze Minister dat de mbo-student gedurende een aaneengesloten periode van ten minste 5
      weken zonder opgave van geldige reden niet aan het onderwijs heeft deelgenomen. Tevens meldt hij, indien die mbo-
      student voor het einde van die periode van 8 weken weer aan het onderwijs is gaan deelnemen, de datum daarvan.

      5 De periodes van 5 en 8 weken worden verlengd met de weken waarin vanwege vakantie geen onderwijs werd verzorgd.

      6 Het bestuur van de rechtspersoon of de natuurlijke persoon stuurt gelijktijdig met de mededelingen, bedoeld in
      het vierde lid, een afschrift van de gegevens die over de betrokkene aan Onze Minister zijn verstrekt, aan deze
      betrokkene en geeft daarbij tevens aan dat afwezigheid als bedoeld in [artikel 4.3][ref3], gevolgen heeft voor
      de studiefinanciering van betrokkene, alsmede welke beroepsgang voor betrokkene open staat tegen de mededelingen,
      bedoeld in het vierde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel2.4
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel8.1.7
      [ref3]: https://wetten.overheid.nl/BWBR0011453#Artikel4.3
