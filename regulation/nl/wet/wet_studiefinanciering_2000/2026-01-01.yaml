  - number: '3.12'
    text: |-
      Indien een ouder na het peiljaar een ouder zonder partner wordt, wordt op aanvraag van die ouder of de student
      de hoogte van de vrije voet, bedoeld in [artikel 3.9, tweede lid][ref1], onderscheidenlijk [artikel 3.9a][ref2],
      dienovereenkomstig aangepast.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel3.9
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel3.9a
    url: https://wetten.overheid.nl/BWBR0011453/2026-01-01#Artikel3.12
