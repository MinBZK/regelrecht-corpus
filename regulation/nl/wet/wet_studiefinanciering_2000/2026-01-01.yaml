  - number: '13.3'
    text: Dit hoofdstuk vervalt op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0011453/2026-01-01#Artikel13.3
  - number: '14.1'
    text: |-
      1 De [Wet op de studiefinanciering][ref1] wordt ingetrokken.

      2 In afwijking van het eerste lid blijft [hoofdstuk VII van de Wet op de studiefinanciering][ref2] met uitzondering
      van [artikel 119b][ref3] van kracht tot een bij koninklijk besluit te bepalen tijdstip.

      3 In afwijking van het eerste lid blijven de [artikelen 141 tot en met 148 van de Wet op de studiefinanciering][ref4]
      van kracht.


