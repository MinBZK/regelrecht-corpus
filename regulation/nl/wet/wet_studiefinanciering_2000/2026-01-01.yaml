      De student die lesgeld is verschuldigd op grond van [artikel 5, tweede lid, van de Les- en cursusgeldwet][ref1]
      en tevens voor het volgen van hoger onderwijs aanspraak heeft op studiefinanciering, geldt voor de toekenning van
      studiefinanciering niet als mbo-student.


