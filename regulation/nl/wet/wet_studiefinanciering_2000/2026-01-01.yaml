  - number: 10a.9
    text: |-
      Indien het na het peiljaar een debiteur betreft die ouder zonder partner is of voor zijn partner de verhoging van
      de gecombineerde heffingskorting, bedoeld in [artikel 8.9 van de Wet inkomstenbelasting 2001][ref1], van toepassing
      wordt na het tweede jaar voorafgaande aan het jaar waarvoor de draagkracht wordt vastgesteld, wordt op aanvraag van
      de debiteur de hoogte van zijn draagkracht dienovereenkomstig aangepast.


