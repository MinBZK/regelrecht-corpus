  - number: '2.8'
    text: |-
      1 Voor studiefinanciering kan een ho-student in aanmerking komen die is ingeschreven voor het volgen van een
      voltijdse associate degree-opleiding, voltijdse bacheloropleiding of een voltijdse masteropleiding aan een
      universiteit of hogeschool, opgenomen in de [bijlage van de WHW](onbekend) of aan een rechtspersoon voor hoger
      onderwijs als bedoeld in [artikel 1.1 WHW][ref1].

      2 Indien de accreditatie van een opleiding wordt geweigerd, beëindigd of ingetrokken of aan een opleiding het recht
      op bekostiging of graadverlening, genoemd in [artikel 1.9, eerste en tweede lid, WHW][ref2], wordt ontnomen, is
      het eerste lid van overeenkomstige toepassing gedurende de termijn waarin de student de betreffende opleiding op
      grond van [artikel 5.21, derde en zesde lid][ref3], [5.32][ref4] of [6.5, tweede lid, WHW][ref5], mag vervolgen.


