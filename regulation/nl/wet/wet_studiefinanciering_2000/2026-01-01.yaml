  - number: '8.1'
    text: |-
      1 Bij algemene maatregel van bestuur worden regels gesteld over de wijze van uitbetaling van de studiefinanciering
      en verrekening van het toegekende bedrag aan studiefinanciering met de aan Onze Minister verschuldigde
      onderwijsbijdrage.

      2 Indien een toegekend bedrag aan studiefinanciering 12 maanden na het einde van het kalenderjaar waarin de
      desbetreffende beschikking is gegeven, niet kan worden uitbetaald als gevolg van nalatigheid van degene aan wie
      die beschikking is gericht, verrekent Onze Minister het toegekende bedrag aan studiefinanciering met het niet
      uitbetaalde bedrag.

      3 De student kan bij Onze Minister een aanvraag indienen een lager maandbedrag aan lening aan hem uit te betalen
      dan het maandbedrag aan lening dat aan hem is toegekend of hem een bedrag van € 0,00 toe te kennen. De in de vorige
      volzin bedoelde aanvraag kan geen betrekking hebben op een periode die gelegen is voor de datum van indiening van
      de aanvraag. Indien aan de student een bedrag van € 0,00 wordt toegekend, geldt hij voor de periode waarop die
      toekenning betrekking heeft, als studiefinancieringsgenietende.
    url: https://wetten.overheid.nl/BWBR0011453/2026-01-01#Artikel8.1
