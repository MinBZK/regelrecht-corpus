$id: wet_studiefinanciering_2000
regulatory_layer: WET
publication_date: '2021-08-31'
valid_from: '2026-01-01'
bwb_id: BWBR0011453
url: https://wetten.overheid.nl/BWBR0011453/2026-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de Wet op de studiefinanciering te wijzigen als
    uitvloeisel van het regeerakkoord 1998 en van de nota «Flexibele studiefinanciering; een stelsel dat past»; dat
    het voorts wenselijk is de leesbaarheid van de Wet op de studiefinanciering te vergroten; dat het in verband met
    het grote aantal wijzigingen wenselijk is de Wet op de studiefinanciering in te trekken en te vervangen door een
    nieuwe wet;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0011453/2026-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      **achterstallige schuld**: achterstallige schuld als bedoeld in [artikel 6.8][ref1],

      **afsluitend examen**:

      a. voor wat betreft [hoofdstuk 4][ref2] het examen, bedoeld in [artikel 7.4.2 WEB][ref3], alsmede het daarmee
      overeenkomende examen van een opleiding buiten Nederland als bedoeld in [artikel 2.13a][ref4],

      b. voor wat betreft [hoofdstuk 5][ref5] het examen, bedoeld in [artikel 7.10a WHW][ref6], alsmede het daarmee
      overeenkomende examen van een opleiding buiten Nederland als bedoeld in [artikel 2.14][ref7],

      **associate degree-opleiding**: opleiding als bedoeld in [artikel 7.3a, tweede lid, onderdeel a, WHW][ref8],
      waaraan accreditatie als bedoeld in [artikel 1.1, onderdeel q, WHW][ref9] is verleend,

      **bacheloropleiding**: opleiding als bedoeld in
      [artikel 7.3a, eerste lid, onderdeel a, of tweede lid, onderdeel b, WHW][ref10], die is geaccrediteerd als bedoeld
      in [artikel 1.1, onderdeel q, WHW][ref11], of die de toets nieuwe opleiding, bedoeld in artikel 1.1, onderdeel r,
      van die wet, met positief gevolg heeft ondergaan,

      **belastbaar minimumloon**: belastbaar minimumloon als bedoeld in [artikel 6.1a][ref12],

      **beroepsonderwijs**: opleiding als bedoeld in [artikel 7.2.7, derde lid, WEB][ref13] en als bedoeld in
      [artikel 2.13a][ref14],

      **collegegeldkrediet**: lening voor betaling van het collegegeld in het hoger onderwijs,

      **debiteur**: degene die zich krachtens [artikel 6.1a][ref15] heeft verplicht tot terugbetaling,

      **diplomatermijn beroepsonderwijs**: termijn als bedoeld in [artikel 4.9][ref16],

      **diplomatermijn hoger onderwijs**: termijn als bedoeld in [artikel 5.5][ref17],

      **hoger beroepsonderwijs**: hoger beroepsonderwijs in de zin van de [WHW][ref18],

      **hoger onderwijs**: wetenschappelijk onderwijs en hoger beroepsonderwijs als bedoeld in [paragraaf 2.3][ref19] en
      in [artikel 2.14][ref20],

      **ho-student**: degene die hoger onderwijs volgt, niet zijnde een extraneus,

      **lening**: rentedragende lening die niet kan worden omgezet in een gift,

      **levenlanglerenkrediet**: lening voor betaling van het lesgeld in het beroepsonderwijs of het collegegeld in het
      hoger onderwijs,

      **masteropleiding**: opleiding als bedoeld in
      [artikel 7.3a, eerste lid, onderdeel b, of tweede lid, onderdeel c, WHW][ref21], die is geaccrediteerd als bedoeld
      in [artikel 1.1, onderdeel q, WHW][ref22], of die de toets nieuwe opleiding, bedoeld in artikel 1.1, onderdeel r,
      van die wet, met positief gevolg heeft ondergaan,

      **mbo-student**: degene die beroepsonderwijs volgt,

      **onderwijsnummer**: door Onze Minister uitgegeven persoonsgebonden nummer, toegekend aan een persoon aan wie niet
      van overheidswege een burgerservicenummer is verstrekt,

      **Onze Minister**: Onze Minister van Onderwijs, Cultuur en Wetenschap,

      **opleiding niveau 1 of 2**:

      a. entreeopleiding en basisberoepsopleiding als bedoeld in
      [artikel 7.2.2, eerste lid, onderdelen a en b, WEB][ref23], en

      b. opleiding buiten Nederland als bedoeld in [artikel 2.13a][ref24] waarvan Onze Minister heeft vastgesteld dat
      deze wordt aangemerkt als een opleiding niveau 1 of 2,

      **opleiding niveau 3 of 4**:

      a. vakopleiding, middenkaderopleiding en specialistenopleiding als bedoeld in
      [artikel 7.2.2, eerste lid, onderdelen c, d en e, WEB][ref25], en

      b. opleiding buiten Nederland als bedoeld in [artikel 2.13a][ref26] waarvan Onze Minister heeft vastgesteld dat
      deze wordt aangemerkt als een opleiding niveau 3 of 4,

      **ouder**: natuurlijke ouder of adoptiefouder in de zin van de
      [artikelen 197 tot en met 232 van Boek 1 van het Burgerlijk Wetboek][ref27],

      **ouder zonder partner**: ouder die geen partner heeft als bedoeld in
      [artikel 2, zesde lid, van de Wet op het kindgebonden budget][ref28],

      **partner**: partner als bedoeld in [artikel 3 van de Algemene wet inkomensafhankelijke regelingen][ref29],

      **peiljaar**: tweede jaar voorafgaand aan het jaar waarin het studiefinancieringstijdvak aanvangt, dan wel het
      tweede jaar voorafgaand aan het jaar waarvoor de draagkracht in de zin van [hoofdstuk 6][ref30] wordt vastgesteld,

      **prestatiebeurs**: rentedragende lening die onder voorwaarden kan worden omgezet in een gift, waarbij de rente
      teniet gaat, niet zijnde de rentedragende lening die niet kan worden omgezet in een gift,

      **prestatiebeurs beroepsonderwijs**: prestatiebeurs als bedoeld in [artikel 4.6a][ref31],

      **prestatiebeurs hoger onderwijs**: prestatiebeurs als bedoeld in [artikel 5.1][ref32],

      **reisproduct**: reisproduct als bedoeld in [artikel 3.25][ref33],

      **reisrecht**: recht om te reizen als bedoeld in [artikel 3.7, eerste lid][ref34],

      **reisvoorziening**: voorziening als bedoeld in [artikel 3.7][ref35] en [paragraaf 3.7][ref36],

      **RSR**: Regisseur Studenten Reisrecht, de rechtspersoon die in opdracht van de vervoersbedrijven tot taak heeft de
      digitale administratie van het reisproduct voor studenten te voeren,

      **specialistenopleiding**: specialistenopleiding als bedoeld in
      [artikel 7.2.2, eerste lid, onderdeel e, WEB][ref37],

      **student**: ho-student of mbo-student,

      **studiefinanciering**: door Onze Minister verstrekte toekenning in verband met het volgen van een opleiding in het
      beroepsonderwijs of in het hoger onderwijs waarop uitsluitend op grond van deze wet aanspraak bestaat,

      **studiefinancieringstijdvak**: kalenderjaar of een gedeelte daarvan waarop de toekenning van studiefinanciering
      betrekking heeft, met dien verstande dat deze periode ten minste 1 kalendermaand is,

      **studiejaar**:

      a. in het hoger onderwijs: tijdvak dat aanvangt op 1 september van enig kalenderjaar en eindigt op 31 augustus
      daaropvolgend,

      b. in het beroepsonderwijs: tijdvak dat aanvangt op 1 augustus van enig kalenderjaar en eindigt op 31 juli
      daaropvolgend,

      **studiepunt**: eenheid waarin de studielast, bedoeld in [artikel 7.4, eerste lid, WHW][ref38], wordt uitgedrukt,

      **termijnbetaling**: bedrag als bedoeld in [artikel 6.9][ref39], of als het een debiteur betreft op wie
      [hoofdstuk 10a][ref40] van toepassing is: bedrag als bedoeld in [artikel 10a.6][ref41],

      **thuiswonende student**: student die niet een uitwonende student is,

      **toetsingsinkomen**: inkomen als bedoeld in
      [artikel 8, eerste en tweede lid, van de Algemene wet inkomensafhankelijke regelingen][ref42], met dien verstande
      dat voor berekeningsjaar wordt gelezen: peiljaar,

      **uitwonende student**: student die voldoet aan de verplichtingen, bedoeld in [artikel 1.5][ref43],

      **veronderstelde ouderlijke bijdrage**: bedrag dat verondersteld wordt door de ouders bijgedragen te worden waarmee
      de aanvullende beurs van de student wordt verminderd,

      **vervoerbedrijf**: rechtspersoon die op grond van een overeenkomst met de Staat als partij of als derde
      verantwoordelijk is voor de uitvoering van het reisrecht,

      **voltijdse opleiding**: opleiding in de zin van de [WHW][ref44], met uitzondering van deeltijds onderwijs,

      **vreemdeling**: hetgeen daaronder wordt verstaan in de [Vreemdelingenwet 2000][ref45],

      **WEB**: [Wet educatie en beroepsonderwijs][ref46],

      **wetenschappelijk onderwijs**: wetenschappelijk onderwijs in de zin van de [WHW][ref47],

      **wettelijk collegegeld**: wettelijk collegegeld als bedoeld in [artikel 7.45 WHW][ref48],

      **WHW**: [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref49].

      2 Onder voltijdse opleiding wordt mede verstaan een duale opleiding in de zin van de [WHW][ref50].


