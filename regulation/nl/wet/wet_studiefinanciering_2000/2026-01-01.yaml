  - number: 3.18a
    text: |-
      In het studiejaar 2023–2024 worden de normbedragen voor de kosten van levensonderhoud en de bedragen van de
      basisbeurs voor uitwonende mbo- en ho-studenten, genoemd in [artikel 3.18][ref1], verhoogd met € 164,30.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel3.18
    url: https://wetten.overheid.nl/BWBR0011453/2026-01-01#Artikel3.18a
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '3.18'
        hoofdstuk: '3'
        paragraaf: '3.5'
  - number: 3.18b
    text: |-
      1 Bij algemene maatregel van bestuur kan worden bepaald dat de normbedragen, genoemd in [artikel 3.18][ref1], in
      studiejaren na het studiejaar 2023–2024 worden verhoogd met een bij die algemene maatregel van bestuur te bepalen
      bedrag.

      2 De voordracht voor een krachtens het eerste lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel3.18
    url: https://wetten.overheid.nl/BWBR0011453/2026-01-01#Artikel3.18b
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '3.18'
        hoofdstuk: '3'
        paragraaf: '3.5'
  - number: '3.19'
    text: |-
      1 Onze Minister kent studiefinanciering toe aan degene die daartoe een aanvraag heeft ingediend en die voldoet aan
      de voorschriften gegeven bij of krachtens deze wet.

      2 Onze Minister besluit op een aanvraag om studiefinanciering:

      a. indien de aanvraag is ingediend vóór 1 november van het jaar voorafgaand aan het kalenderjaar waarop de
      studiefinanciering betrekking heeft: vóór 31 december van dat voorafgaande jaar, en

      b. indien de aanvraag is ingediend na het in onderdeel a bedoelde tijdstip: binnen 8 weken na de indiening van
      de aanvraag.
    url: https://wetten.overheid.nl/BWBR0011453/2026-01-01#Artikel3.19
  - number: '3.20'
    text: |-
      Zolang het op basis van de verstrekte gegevens onmogelijk is het bedrag van de aanvullende beurs vast te stellen,
      kent Onze Minister het gevraagde bedrag toe in de vorm van een lening.
    url: https://wetten.overheid.nl/BWBR0011453/2026-01-01#Artikel3.20
  - number: '3.21'
    text: |-
      1 Studiefinanciering wordt toegekend per studiefinancieringstijdvak.

      2 Een aanvraag voor studiefinanciering wordt vóór het einde van het studiejaar waarop de aanvraag betrekking heeft
      ingediend.

      3 Studiefinanciering of de verhoging daarvan wordt niet toegekend voor een periode voorafgaand aan het studiejaar
      waarin de aanvraag is ingediend.

      4 De reisvoorziening of het levenlanglerenkrediet wordt niet toegekend voor een periode voorafgaand aan de datum
      van indiening van de aanvraag.

      5 Op aanvraag van de student onderbreekt of beëindigt Onze Minister de studiefinanciering met ingang van de
      kalendermaand die de student in zijn aanvraag aangeeft, met dien verstande dat de onderbreking of beëindiging niet
      plaatsvindt voor een periode voorafgaand aan de datum van de indiening van de aanvraag. De onderbreking omvat ten
      minste 1 maand.
    url: https://wetten.overheid.nl/BWBR0011453/2026-01-01#Artikel3.21
  - number: '3.23'
    text: |-
      1 In afwijking van [artikel 1.7][ref1] gebruikt Onze Minister in contacten met RSR het burgerservicenummer van:

      a. een student voor de toekenning en beëindiging van diens reisrecht; en

      b. de persoon die een reisrecht toegekend heeft gekregen en van wie nadat sprake was van één van de situaties
      genoemd in [artikel 3.27, eerste lid, onder a en b][ref2], het reisproduct niet tijdig is stopgezet, voor de
      uitvoering van artikel 3.27, tweede lid.

      2 RSR gebruikt het burgerservicenummer van een student slechts:

      a. ter vaststelling van de identiteit van een student wanneer deze zich tot de vervoersbedrijven wendt om zijn
      gegevens te laten koppelen aan het reisproduct, bedoeld in [artikel 3.25][ref3], en

      b. in contacten met Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel1.7
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel3.27
      [ref3]: https://wetten.overheid.nl/BWBR0011453#Artikel3.25
