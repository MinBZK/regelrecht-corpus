    text: |-
      1 Maatstaf voor de bepaling van de veronderstelde ouderlijke bijdrage is het toetsingsinkomen van de afzonderlijke
      ouders van de mbo-student in het peiljaar.

      2 Op het toetsingsinkomen in het peiljaar wordt in mindering gebracht de vrije voet. Deze voet is naar de maatstaf
      van 1 januari 2014 gelijk aan € 16.736,64 . Indien één van de ouders is overleden, geldt voor de andere ouder een
      dubbele vrije voet. Indien een mbo-student die niet geadopteerd is en die als ingezetene in de basisregistratie
      personen is ingeschreven, blijkens de basisregistratie personen slechts één ouder heeft of [artikel 3.14][ref1]
      toepassing heeft gevonden, is de vorige volzin van overeenkomstige toepassing. Indien het in het peiljaar een ouder
      zonder partner betreft en voor hem geen dubbele vrije voet geldt, geldt voor hem in afwijking van de tweede volzin
      een vrije voet die naar de maatstaf van 1 januari 2014 gelijk is aan € 21.204,43 .

      3 Het bruto kortingsbedrag op jaarbasis is 26% van het verschil tussen het toetsingsinkomen in het peiljaar en de
      vrije voet in het toekenningsjaar.

      4 Op het bruto kortingsbedrag, bedoeld in het derde lid, worden in mindering gebracht:

      a. de ingevolge [paragraaf 6.1][ref2] vastgestelde termijnbetalingen over een jaar of, indien dit minder is, de
      berekende draagkracht indien de ouder tevens debiteur is; en

      b. € 363 voor ieder kind dat in het studiejaar dat aanvangt in het jaar voorafgaand aan het
      studiefinancieringstijdvak, onder de werking van [hoofdstuk 4 van de Wet tegemoetkoming onderwijsbijdrage][ref3] en
      schoolkosten of van [artikel 2, derde tot en met vijfde lid, van de Wet op het kindgebonden budget][ref4] valt.

      5 Een twaalfde deel van het bedrag dat na de toepassing van het vierde lid resteert, is de berekeningsgrondslag per
      maand voor een ouder van de veronderstelde ouderlijke bijdrage.

      6 Indien een kind waarvoor de aftrek, bedoeld in het vierde lid, onderdeel b, heeft plaatsgevonden, onder de
      werking van deze wet gaat vallen, wordt met ingang van het tijdstip waarop dit kind onder de werking van deze wet
      gaat vallen, de veronderstelde ouderlijke bijdrage, bedoeld in het vijfde lid, opnieuw berekend.

      7 Het zesde lid is niet van toepassing op een mbo-student die uitsluitend een reisvoorziening bedoeld in
      [artikel 4.6b][ref5] toegekend heeft gekregen.


