  - number: '13.1'
    text: |-
      1 Een student in de laatste fase van diens opleiding die in verband met de uitbraak van COVID-19 studievertraging
      heeft opgelopen, komt in aanmerking voor een tegemoetkoming, niet zijnde studiefinanciering in de zin van
      [artikel 3.1][ref1].

      2 Bij ministeriële regeling wordt in ieder geval vastgesteld:

      a. wat wordt verstaan onder laatste fase als bedoeld in het eerste lid;

      b. welke opleidingen aanspraak geven;

      c. wat wordt verstaan onder studievertraging in verband met de uitbraak van COVID-19 als bedoeld in het eerste lid;

      d. in welke gevallen de tegemoetkoming op aanvraag dan wel ambtshalve wordt toegekend; en

      e. welke gegevens bij een aanvraag worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel3.1
    url: https://wetten.overheid.nl/BWBR0011453/2026-01-01#Artikel13.1
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '3.1'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '13.2'
    text: |-
      De omvang van de tegemoetkoming, bedoeld in [artikel 13.1][ref1], wordt vastgesteld bij ministeriële regeling.
      Daarbij kan in ieder geval aan de hand van het aantal maanden studievertraging onderscheid worden gemaakt tussen
      verschillende groepen studenten.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel13.1
    url: https://wetten.overheid.nl/BWBR0011453/2026-01-01#Artikel13.2
