  - number: '6.3'
    text: |-
      Onze Minister stelt ten aanzien van de lening beroepsonderwijs en de lening hoger onderwijs jaarlijks uiterlijk
      in december een rentepercentage vast dat gelijk is aan het gemiddeld effectief rendement over de periode van 12
      maanden, gerekend van oktober van het voorafgaande jaar tot en met september van het lopende jaar, van de openbare
      lening, uitgegeven door de Staat der Nederlanden en toegelaten tot de notering aan de officiële markt ter beurze
      van Amsterdam, met een gemiddelde resterende looptijd van 5 jaren. Het rentepercentage wordt vastgesteld op nul
      indien deze overeenkomstig de eerste volzin minder dan nul procent bedraagt.
    url: https://wetten.overheid.nl/BWBR0011453/2026-01-01#Artikel6.3
  - number: '6.4'
    text: |-
      1 Over de aangegane leningen is, voor zover het niet betreft achterstallige schuld, rente verschuldigd
      overeenkomstig het tweede en derde lid. De renteberekening gaat in op de eerste dag van de maand die volgt op de
      dag waarop het bedrag aan lening bij de verstrekker van die lening is afgeschreven.

      2 De rente over de door de student in een studiefinancieringstijdvak opgenomen lening wordt berekend per dag op
      basis van samengestelde interest. Indien de terugbetaling niet binnen 2 weken na de vervaldatum is ontvangen, wordt
      de op voet van deze bepaling berekende rente bijgeschreven bij de hoofdsom.

      3 In de periode die aan de terugbetalingsperiode voorafgaat, wordt bij de berekening van de rente, bedoeld in het
      eerste en tweede lid, voor elk kalenderjaar het rentepercentage gehanteerd dat op grond van [artikel 6.3][ref1]
      uiterlijk in december van het aan dat jaar voorafgaande jaar is vastgesteld. In de terugbetalingsperiode wordt bij
      de berekening van de rente, bedoeld in het eerste en tweede lid, voor elke periode van 5 kalenderjaren na aanvang
      van de terugbetalingsperiode, het rentepercentage gehanteerd dat op grond van artikel 6.3 uiterlijk in december van
      het aan die periode voorafgaande jaar is vastgesteld.

      4 Voor de berekening van de rente op de voet van het tweede lid wordt een maand gesteld op 30 dagen en een jaar
      gesteld op 360 dagen.

      5 Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot het tweede tot en met
      het vierde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel6.3
    url: https://wetten.overheid.nl/BWBR0011453/2026-01-01#Artikel6.4
