  - number: '7.4'
    text: |-
      1 Indien een herzieningsbeschikking als bedoeld in [artikel 7.1, eerste en tweede lid][ref1], of een beslissing op
      bezwaar daartoe aanleiding geeft, wordt het bedrag van de basisbeurs of aanvullende beurs dat teveel is uitbetaald,
      door de betrokkene terugbetaald of met hem verrekend. Tevens vindt verrekening plaats van de bedragen, bedoeld in
      de [artikelen 3.27, tweede lid][ref2], en [3.29, eerste lid][ref3].

      2 Indien een herzieningsbeschikking als bedoeld in [artikel 7.1, eerste en tweede lid][ref4], of een beslissing
      op bezwaar daartoe aanleiding geeft, wordt voor zover het bedrag waarvoor het recht om een lening af te sluiten
      te hoog is toegekend, het deel dat te hoog is toegekend en uitbetaald door de betrokkene terugbetaald of met hem
      verrekend.

      3 Indien een herzieningsbeschikking als bedoeld in
      [artikel 7.1 van de Wet tegemoetkoming onderwijsbijdrage en schoolkosten][ref5], of een beslissing op bezwaar
      daartoe aanleiding geeft, wordt het bedrag aan tegemoetkoming dat teveel is uitbetaald, door de betrokkene
      terugbetaald of met hem verrekend.

      4 Indien na een voorlopige voorziening als bedoeld in [titel 8.3 van de Algemene wet bestuursrecht][ref6], de
      beslissing in hoofdzaak daartoe aanleiding geeft, wordt het bedrag dat op grond van de voorlopige voorziening
      teveel is uitbetaald, door de betrokkene terugbetaald of met hem verrekend.

      5 De in het eerste tot en met vierde lid bedoelde terugbetaling, voor zover [artikel 6.17][ref7] niet van
      toepassing is, en verrekening geschieden overeenkomstig bij ministeriële regeling vast te stellen redelijke
      terugbetalingsregels.

      6 [Artikel 4:93, vierde lid, van de Algemene wet bestuursrecht][ref8] is niet van toepassing op deze wet.


