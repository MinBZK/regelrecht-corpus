  - number: '6.9'
    text: |-
      1 Rente en aflossing van de lening vervallen gedurende de aflosfase in maandelijkse termijnen.

      2 De hoogte van de maandelijkse termijnbetalingen wordt op basis van het aantal maanden van de aflosfase
      onderscheidenlijk het nog resterende aantal maanden van de aflosfase tot gelijke bedragen vastgesteld bij de
      aanvang van:

      a. het eerste jaar van de aflosfase,

      b. het vierde jaar van de aflosfase, en

      c. ieder vijfde jaar na het vierde jaar van de aflosfase.

      3 Onverminderd toepassing van [artikel 6.10][ref1] bedraagt het totaal per jaar te betalen bedrag aan maandelijkse
      termijnbetalingen voor de terugbetaling van de lening beroepsonderwijs dan wel de lening hoger onderwijs ten minste
      € 60.

      4 Bij ministeriële regeling kunnen nadere regels worden gesteld voor de vaststelling en betaling van de
      termijnbetalingen. Hierbij kan tevens worden bepaald dat betaling geschiedt door middel van een daartoe verleende
      doorlopende machtiging om het verschuldigde bedrag maandelijks te doen afschrijven van een bankrekening.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel6.10
    url: https://wetten.overheid.nl/BWBR0011453/2026-01-01#Artikel6.9
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '6.10'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 6.9a
    text: |-
      1 De debiteur is bevoegd om bovenop de termijnbetalingen, kosteloos extra aflossingen te doen.

      2 Bij ministeriële regeling kunnen over de aflossing, genoemd in het eerste lid, regels worden gesteld met
      betrekking tot onder meer:

      a. de wijze waarop extra aflossingen kunnen worden gedaan;

      b. de voorwaarden waaronder, in afwijking van [artikel 6.9, tweede lid][ref1], tot herberekening van de
      termijnbetalingen kan worden besloten; en

      c. de goede uitvoering van extra aflossingen.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel6.9
