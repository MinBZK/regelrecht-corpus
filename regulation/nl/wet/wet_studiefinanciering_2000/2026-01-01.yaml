      [artikel 41, derde lid, van de Wet op de studiefinanciering][ref2], zoals dat luidde op 31 augustus 2000, zo
      toegepast dat het minimumbedrag van f 1.200,– wordt verminderd met het in het desbetreffende jaar terug te betalen
      bedrag aan renteloos voorschot.


