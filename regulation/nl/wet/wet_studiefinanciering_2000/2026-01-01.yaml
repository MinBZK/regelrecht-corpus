  - number: '12.15'
    text: |-
      1 In dit artikel wordt onder tegemoetkoming begrepen: een tegemoetkoming van Onze Minister, niet zijnde
      studiefinanciering in de zin van [artikel 3.1][ref1], in verband met het volgen van hoger onderwijs in een periode
      waarin de extra investeringen in het hoger onderwijs vanwege de Wet studievoorschot hoger onderwijs nog niet waren
      gedaan.

      2 Voor een tegemoetkoming komt in aanmerking, degene die:

      a. in één van de vier studiejaren vanaf 1 september 2015 voor het eerst studiefinanciering heeft ontvangen voor het
      volgen van een bacheloropleiding in het hoger onderwijs;

      b. binnen de diplomatermijn hoger onderwijs met goed gevolg een hbo-bacheloropleiding of het geheel van een wo-
      bacheloropleiding en een wo-masteropleiding heeft afgerond; en

      c. niet eerder het gehele vouchertegoed van een voucher als bedoeld in
      [artikel 12.15][ref2], zoals dit artikel luidde voor de inwerkingtreding van
      [artikel I, onderdeel X, van de Wet herinvoering basisbeurs hoger onderwijs][ref3], heeft verzilverd.

      3 De tegemoetkoming bedraagt voor een rechthebbende die de in het tweede lid, onderdeel c, bedoelde voucher niet
      heeft verzilverd € 1.835,94 . Indien een rechthebbende de voucher reeds gedeeltelijk heeft verzilverd, bedraagt
      voor deze rechthebbende de tegemoetkoming de resterende waarde van de voucher, met een maximum van het bedrag
      genoemd in de eerste volzin.

      4 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over de uitvoering van dit
      artikel en worden in ieder geval nadere regels gesteld over de wijze van verstrekking van de tegemoetkoming.

      5 De tegemoetkoming wordt toegekend vanaf een bij koninklijk besluit te bepalen tijdstip.

      6 [Artikel 1.7][ref4] is van overeenkomstige toepassing met dien verstande dat voor student wordt gelezen:
      rechthebbende op een tegemoetkoming.


