  - number: 10a.7
    text: |-
      1 Indien de debiteur niet in staat is de vastgestelde termijnbetaling te voldoen, kan hij gedurende de aflosfase
      bij Onze Minister een aanvraag indienen om zijn draagkracht vast te stellen voor de resterende aflosfase.

      2 De draagkracht van de debiteur is zijn draagkracht uit inkomen.

      3 Bij ministeriële regeling kunnen voorschriften worden vastgesteld met betrekking tot de in het eerste lid
      bedoelde aanvraag.

      4 Indien het bedrag van de draagkracht hoger is dan het bedrag van de vastgestelde termijnbetaling, betaalt de
      debiteur het bedrag van de vastgestelde termijnbetaling.
    url: https://wetten.overheid.nl/BWBR0011453/2026-01-01#Artikel10a.7
  - number: 10a.8
    text: |-
      1 Maatstaf voor de vaststelling van de draagkracht van de debiteur uit inkomen is zijn toetsingsinkomen in het
      tweede jaar voorafgaande aan het jaar waarvoor de draagkracht wordt vastgesteld.

      2 Op het toetsingsinkomen wordt in mindering gebracht de draagkrachtvrije voet. Deze voet is gelijk aan het
      belastbare minimumloon in het peiljaar, indien de debiteur in het peiljaar een ouder zonder partner is, of
      voor zijn partner voor de inkomstenbelasting de verhoging van de gecombineerde heffingskorting, bedoeld in
      [artikel 8.9 van de Wet inkomstenbelasting 2001][ref1], van toepassing is. Indien voor de debiteur de verhoging
      van de gecombineerde heffingskorting, bedoeld in artikel 8.9 van de Wet inkomstenbelasting 2001, of de algemene
      heffingskorting van toepassing is, is de draagkrachtvrije voet 0%, onderscheidenlijk 50% van de voet die van
      toepassing zou zijn indien voor de debiteur – naast de algemene heffingskorting – voor zijn partner de verhoging
      van de gecombineerde heffingskorting, bedoeld in artikel 8.9 van de Wet inkomstenbelasting 2001 van toepassing
      zou zijn.

      3 Het resterende inkomen wordt verdeeld in 2 schijven ter grootte van de helft van de in het tweede lid bedoelde
      draagkrachtvrije voet alsmede een derde schijf ter grootte van 260% van het belastbare minimumloon in het tweede
      jaar voorafgaande aan het jaar waarvoor de draagkracht wordt vastgesteld, verminderd met de draagkrachtvrije voet
      en de eerste en de tweede schijf.

      4 Indien de debiteur of zijn partner een toetsingsinkomen heeft dat kleiner is dan de som van de in het tweede
      lid bedoelde draagkrachtvrije voet en de eerste 3 volle schijven, bedoeld in het derde lid, wordt het deel van de
      draagkrachtvrije voet en de eerste 3 schijven dat nog niet is benut, overgeheveld naar de ander. Daarbij wordt het
      onbenutte deel van een schijf toegevoegd aan de overeenkomstige schijf van de ander en het onbenutte deel van de
      draagkrachtvrije voet aan de draagkrachtvrije voet van de ander.

      5 Indien de debiteur en zijn partner een toetsingsinkomen hebben dat kleiner is dan de som van de in het tweede
      lid bedoelde draagkrachtvrije voet en de eerste 3 volle schijven, bedoeld in het derde lid, wordt het vierde lid
      toegepast in die zin dat van de debiteur of zijn partner met het laagste toetsingsinkomen het onbenutte deel van de
      draagkrachtvrije voet en de eerste 3 schijven wordt overgeheveld naar de ander.

      6 De draagkracht van de debiteur uit inkomen is 7,9% van de eerste schijf plus 15,8% van de tweede schijf plus
      23,7% van de derde schijf plus 30% van het meerdere.

      7 In afwijking van het tweede tot en met het zesde lid is de draagkracht uit inkomen van een debiteur met een
      toetsingsinkomen lager dan een bij ministeriële regeling vast te stellen minimumbedrag nihil. Deze regeling wordt
      jaarlijks voor 1 januari vastgesteld en kan voor verschillende groepen debiteuren verschillend luiden.

      8 Voor de toepassing van dit artikel wordt indien het toetsingsinkomen of het belastbaar loon in het tweede
      jaar voorafgaande aan het jaar waarvoor de draagkracht wordt vastgesteld, nog niet bekend is, door Onze Minister
      daarvoor in de plaats gesteld een bedrag dat het vast te stellen toetsingsinkomen of het belastbaar loon benadert.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel8.9
    url: https://wetten.overheid.nl/BWBR0011453/2026-01-01#Artikel10a.8
