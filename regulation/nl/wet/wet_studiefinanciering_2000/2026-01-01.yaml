    text: |-
      1 In geval van samenloop van terugbetalingen van renteloze voorschotten, verstrekt door Onze Minister met
      betrekking tot de lasten, verbonden aan het bezoeken van een school voor voortgezet onderwijs dan wel een
      instelling van wetenschappelijk onderwijs en terugbetaling van rentedragende lening, wordt het door de debiteur
      op jaarbasis te betalen bedrag gevormd door de som van het op jaarbasis vastgestelde terug te betalen bedrag aan
      renteloze voorschotten en van het jaarbedrag aan termijnen, waarin de rente en aflossing van de rentedragende
      lening ingevolge [artikel 41 van de Wet op de studiefinanciering][ref1], zoals dat luidde op 31 augustus 2000,
      vervallen.

      2 De [artikelen 40, eerste en derde lid][ref2], [41 tot en met 48][ref3], [50][ref4], [107][ref5],
      [121 tot en met 127][ref6], [130][ref7] en [132 van de Wet op de studiefinanciering][ref8], zoals die luidden op
      31 augustus 2000, zijn van overeenkomstige toepassing, met dien verstande dat indien de draagkracht van de debiteur
      lager is dan de te betalen termijn, de terugbetaling allereerst strekt ter voldoening van de oudste openstaande
      schuld.


