  - number: '3.10'
    text: |-
      1 Op aanvraag van de ouders of een van hen of op aanvraag van de student wordt bij toepassing van de
      [artikelen 3.9][ref1] en [3.9a][ref2], indien sprake is van een terugval in inkomen over het eerste of het tweede
      jaar na het peiljaar, uitgegaan van het toetsingsinkomen in dat jaar.

      2 Voor de toepassing van het eerste lid wordt onder een terugval in inkomen verstaan: een vermindering van de som
      van de toetsingsinkomens van de beide ouders tezamen met ten minste 15% ten opzichte van het peiljaar.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel3.9
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel3.9a
