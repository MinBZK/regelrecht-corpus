  - number: '4.22'
    text: |-
      1 De mbo-student zendt uiterlijk 3 maanden na het verstrijken van de diplomatermijn beroepsonderwijs, een
      gewaarmerkt bewijs van het met goed gevolg afleggen van het afsluitend examen van de opleiding aan Onze Minister
      en dient daarbij een aanvraag in tot omzetting van de prestatiebeurs beroepsonderwijs. Op het gewaarmerkt bewijs
      vermeldt de instelling de datum waarop het examen met goed gevolg is afgesloten.

      2 De omzetting, bedoeld in [artikel 4.10][ref1], vindt plaats uiterlijk per 1 januari van het kalenderjaar volgend
      op de aanvraag. Zo spoedig mogelijk na de omzetting stelt Onze Minister de mbo-student daarvan in kennis.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel4.10
