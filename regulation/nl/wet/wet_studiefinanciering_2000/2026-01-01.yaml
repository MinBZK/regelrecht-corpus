  - number: 2.15a
    text: |-
      1 De mbo-student die aanspraak heeft op studiefinanciering voor het volgen van een opleiding niveau 3 of 4, heeft
      geen aanspraak op studiefinanciering voor een opleiding niveau 1 of 2.

      2 De mbo-student die aanspraak heeft op studiefinanciering voor een opleiding niveau 1 of 2 buiten Nederland heeft
      geen aanspraak op studiefinanciering voor een opleiding niveau 1 of 2 in Nederland.

      3 De mbo-student die voor 1 augustus 2005 voor het volgen van beroepsonderwijs studiefinanciering ontving en
      die studiefinanciering ontvangt voor een opleiding op niveau 3 of 4 buiten Nederland, heeft geen aanspraak op
      studiefinanciering voor een opleiding niveau 1 of 2.

      4 De mbo-student die voor 1 augustus 2005 voor het volgen van beroepsonderwijs studiefinanciering ontving en die
      studiefinanciering ontvangt voor een beroepsopleiding buiten Nederland, heeft geen aanspraak op studiefinanciering
      voor een opleiding niveau 3 of 4 in Nederland.
    url: https://wetten.overheid.nl/BWBR0011453/2026-01-01#Artikel2.15a
  - number: '2.16'
    text: |-
      1 De mbo-student heeft geen aanspraak op studiefinanciering voor een opleiding niveau 1 of 2, indien hij reeds 4
      jaren prestatiebeurs beroepsonderwijs heeft genoten.

      2 De student heeft geen aanspraak op studiefinanciering voor beroepsonderwijs indien hij reeds 4 jaren
      prestatiebeurs hoger onderwijs heeft genoten.

      3 Het eerste en tweede lid zijn niet van toepassing op het levenlanglerenkrediet.
    url: https://wetten.overheid.nl/BWBR0011453/2026-01-01#Artikel2.16
  - number: '2.17'
    text: |-
      1 Een student wiens vrijheid voor ten minste een maand rechtens is ontnomen, heeft, behoudens
      in de gevallen, bedoeld in de [Wet verplichte geestelijke gezondheidszorg][ref1], in de
      [Wet zorg en dwang psychogeriatrische en verstandelijk gehandicapte cliënten][ref2] en in
      [artikel 2.3 van de Wet forensische zorg][ref3] en de gevallen, bedoeld in [hoofdstuk 6 van de Jeugdwet][ref4], met
      ingang van de eerste dag van de maand volgend op de maand waarin de vrijheidsontneming ten minste één maand heeft
      geduurd slechts aanspraak op studiefinanciering voor een thuiswonende student.

      2 Voor de toepassing van het eerste lid worden perioden van vrijheidsontneming samengeteld, indien zij elkaar met
      een onderbreking van minder dan vier weken opvolgen.

      3 Het eerste en tweede lid zijn niet van toepassing op bij algemene maatregel van bestuur aan te wijzen groepen
      van personen waarbij tenuitvoerlegging van een vrijheidsstraf of vrijheidsbenemende maatregel buiten een justitiële
      inrichting plaatsvindt.


