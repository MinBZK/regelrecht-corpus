  - number: '6.5'
    text: |-
      1 De terugbetalingsperiode vangt aan op 1 januari van het jaar volgend op het jaar waarin iemand is opgehouden
      studiefinanciering te genieten.

      2 De terugbetalingsperiode bestaat uit een aanloopfase en een aflosfase.

      3 Gedurende de voor de debiteur geldende diplomatermijn wordt de terugbetalingsperiode geschorst:

      a. van rechtswege indien de debiteur opnieuw studiefinanciering als bedoeld in
      [artikel 3.1, eerste of tweede lid][ref1], geniet;

      b. op aanvraag zolang de debiteur opnieuw student is en geen studiefinanciering geniet; of

      c. op de wijze bepaald krachtens [artikel 6.19b][ref2] zolang de debiteur opnieuw student is en
      levenlanglerenkrediet geniet.

      4 Voor debiteuren voor wie nooit een diplomatermijn beroepsonderwijs of diplomatermijn hoger onderwijs heeft
      gegolden geldt, in afwijking van het derde lid, dat de terugbetaling wordt geschorst:

      a. van rechtswege zolang de debiteur opnieuw studiefinanciering als bedoeld in
      [artikel 3.1, eerste of tweede lid][ref3], geniet;

      b. op aanvraag zolang de debiteur opnieuw student is en geen studiefinanciering geniet; of

      c. op de wijze bepaald krachtens [artikel 6.19b][ref4] zolang de debiteur opnieuw student is en
      levenlanglerenkrediet geniet.

      5 De schorsing, bedoeld in het derde of vierde lid, wordt beëindigd indien de debiteur niet binnen 8 weken na
      de verzending van een daartoe strekkend verzoek van Onze Minister of de debiteur nog student is, daarop heeft
      geantwoord. De beëindiging werkt terug tot de datum van verzending van het verzoek, of zoveel eerder als de
      debiteur ophield student te zijn. Een aanvraag om de terugbetaling wederom te schorsen wordt niet toegestaan voor
      een periode die gelegen is vóór de datum van indiening van de aanvraag. De schorsing wordt tevens beëindigd aan het
      einde van de diplomatermijn beroepsonderwijs dan wel de diplomatermijn hoger onderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel3.1
