  - number: '9.8'
    text: |-
      Indien een instelling als bedoeld in [artikel 2.4, onderdeel b][ref1], op enig moment in een studiejaar
      niet een administratie als bedoeld in [artikel 4.5, eerste lid][ref2], voert of niet na afloop van de in de
      [artikelen 4.3][ref3], [4.4][ref4] en [4.5][ref5] bedoelde periodes van onafgebroken afwezigheid zonder geldige
      reden aan Onze Minister de vereiste gegevens verstrekt, ontstaat er een vordering van Onze Minister op de
      instelling ter grootte van 15% van het bedrag van als gift vastgestelde studiefinanciering dat aan de mbo-studenten
      aan die instelling in het studiejaar waarin deze in gebreke was, is toegekend.


