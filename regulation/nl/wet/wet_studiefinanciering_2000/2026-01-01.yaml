  - number: 5.2a
    text: |-
      In aanvulling op [artikel 5.2, eerste lid][ref1], wordt de prestatiebeurs hoger onderwijs op aanvraag eenmalig 1
      jaar langer verstrekt, indien de aanvrager een ho-student betreft die:

      a. het afsluitende examen van een bacheloropleiding heeft behaald of in het bezit is van een daarmee gelijkgesteld
      diploma;

      b. is ingeschreven bij een aan een hogeschool verbonden opleiding gericht op het beroep van leraar in het
      voortgezet onderwijs; en

      c. niet eerder een opleiding heeft afgerond welke is opgenomen in het onderdeel onderwijs van het register, bedoeld
      in [artikel 6.13, eerste lid, van de WHW][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel5.2
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel6.13
