        bwb_id: BWBR0011453
        artikel: '13.1'
        hoofdstuk: '13'
  - number: 13.2a
    text: |-
      1 Een student kan in verband met de uitbraak van COVID-19 in aanmerking komen voor een extra reisvoorziening.

      2 Bij ministeriële regeling wordt in ieder geval vastgesteld:

      a. onder welke voorwaarden en in welke gevallen een student voor de extra reisvoorziening in aanmerking komt;

      b. wat de omvang van de extra reisvoorziening is;

      c. in welke gevallen de extra reisvoorziening op aanvraag dan wel ambtshalve wordt toegekend.

      3 In afwijking van [artikel 3.21][ref1] kan de extra reisvoorziening met terugwerkende kracht en voor een periode
      in een eerder studiejaar worden toegekend, waarbij onderscheid kan worden gemaakt tussen het reisrecht en de
      vergoeding als bedoeld in [artikel 3.24, tweede of vierde lid][ref2].

      4 [Artikel 3.29][ref3] is niet van toepassing op de extra reisvoorziening, bedoeld in het eerste lid.


