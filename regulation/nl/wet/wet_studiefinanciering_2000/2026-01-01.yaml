  - number: '6.6'
    text: |-
      1 De aanloopfase beslaat de eerste 2 kalenderjaren na aanvang van de terugbetalingsperiode.

      2 Gedurende de aanloopfase bestaat geen verplichting tot terugbetaling.
    url: https://wetten.overheid.nl/BWBR0011453/2026-01-01#Artikel6.6
  - number: '6.7'
    text: |-
      1 De aflosfase volgt op de aanloopfase en beslaat behoudens toepassing van [artikel 6.9, derde lid][ref1], 35
      kalenderjaren. Deze periode wordt verlengd met het aantal maanden dat gebruik is gemaakt van de aflosvrije periode
      op grond van het tweede lid.

      2 Op aanvraag van de debiteur wordt de terugbetaling voor ten hoogste 5 kalenderjaren opgeschort.

      3 Bij ministeriële regeling kunnen voorschriften worden vastgesteld met betrekking tot de opschorting, bedoeld in
      het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel6.9
    url: https://wetten.overheid.nl/BWBR0011453/2026-01-01#Artikel6.7
