  - number: '2.7'
    text: |-
      1 De aanspraak op studiefinanciering vervalt met ingang van de maand die volgt op de dag waarop de mbo-student het
      laatste studiejaar van een opleiding met goed gevolg heeft afgesloten.

      2 Indien de mbo-student aansluitend aan het studiejaar dat als laatste studiejaar was aangemerkt, opnieuw dat
      laatste studiejaar aanvangt, ontstaat aanspraak op studiefinanciering voor het resterende gedeelte van het
      kalenderjaar.

      3 Indien de mbo-student na zijn uitschrijving voor een opleiding binnen 4 maanden opnieuw deze opleiding aanvangt
      of een andere opleiding in de zin van deze wet gaat volgen, blijft, in afwijking van het eerste lid, op zijn
      aanvraag de aanspraak op studiefinanciering in de tussen beide opleidingen liggende periode voor ten hoogste 4
      maanden bestaan. Hij wordt in die periode aangemerkt als mbo-student aan de eerste opleiding. In afwijking van
      [artikel 3.21, tweede lid][ref1], kan de aanvraag in het daarop volgende studiejaar worden ingediend indien de
      uitschrijving binnen vier maanden voor het einde van het desbetreffende studiejaar heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel3.21
    url: https://wetten.overheid.nl/BWBR0011453/2026-01-01#Artikel2.7
