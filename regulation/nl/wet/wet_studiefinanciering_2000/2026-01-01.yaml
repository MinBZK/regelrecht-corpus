  - number: '2.1'
    text: |-
      Deze wet regelt de studiefinanciering en is van toepassing op studenten die voldoen aan de voorwaarden inzake:

      a. nationaliteit als bedoeld in [artikel 2.2][ref1],

      b. leeftijd als bedoeld in [artikel 2.3][ref2] of [2.3a][ref3], en

      c. onderwijssoort als bedoeld in de [paragrafen 2.2 tot en met 2.4.][ref4]


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel2.2
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel2.3
      [ref3]: https://wetten.overheid.nl/BWBR0011453#Artikel2.3a
      [ref4]: https://wetten.overheid.nl/BWBR0011453#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0011453/2026-01-01#Artikel2.1
