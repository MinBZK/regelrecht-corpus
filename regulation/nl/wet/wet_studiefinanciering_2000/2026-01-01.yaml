  - number: 6.5a
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent de samenloop van de verplichting
      tot terugbetaling uit hoofde van deze wet en de [Wet studiefinanciering BES][ref1] met dien verstande dat de
      verplichting tot terugbetaling de hoogst vastgestelde draagkracht van de debiteur niet mag overschrijden.


      [ref1]: https://wetten.overheid.nl/BWBR0028393
    url: https://wetten.overheid.nl/BWBR0011453/2026-01-01#Artikel6.5a
