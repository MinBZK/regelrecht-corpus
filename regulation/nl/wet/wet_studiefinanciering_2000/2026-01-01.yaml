  - number: 9.1a
    text: |-
      1 Met het toezicht op de naleving van [artikel 1.5][ref1] zijn belast:

      a. de bij besluit van Onze Minister aangewezen ambtenaren of andere personen,

      b. de bij besluit van het college van burgemeester en wethouders aangewezen ambtenaren.

      2 Indien de ambtenaren of andere personen, bedoeld in het eerste lid, onder a, die worden aangewezen, ressorteren
      onder een andere minister, wordt het besluit samen met die minister genomen.

      3 Van een besluit als bedoeld in het eerste lid, onder b, wordt mededeling gedaan door plaatsing in de
      Staatscourant.

      4 De toezichthouder beschikt niet over de bevoegdheden, genoemd in de [artikelen 5:18][ref2] en
      [5:19 van de Algemene wet bestuursrecht][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel1.5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel518
