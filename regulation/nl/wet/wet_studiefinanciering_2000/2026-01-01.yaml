  - number: '9.5'
    text: |-
      1 De natuurlijke persoon van wie of het bestuur van de rechtspersoon waarvan een instelling uitgaat die onderwijs
      aanbiedt als bedoeld in de [artikelen 2.4][ref1], [2.8][ref2], [2.10][ref3], [2.11][ref4] en [2.12][ref5], is
      verplicht op een bij ministeriële regeling aan te geven wijze kosteloos inlichtingen te verstrekken, benodigd voor
      de uitvoering van deze wet.

      2 Onze Minister kan voor instellingen of groepen van instellingen waarop [artikel 7.9d WHW][ref6] niet van
      toepassing is, bepalen dat de natuurlijke persoon van wie of het bestuur van de rechtspersoon waarvan die
      instelling uitgaat, voor het einde van de maand volgend op de maand waarin een ho-student het afsluitend examen van
      een opleiding in het hoger onderwijs met goed gevolg heeft afgelegd, daarvan mededeling doet aan Onze Minister en
      gelijktijdig de ho-student van die mededeling in kennis stelt.


