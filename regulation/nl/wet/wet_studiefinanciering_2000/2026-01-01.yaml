  - number: 10a.5
    text: |-
      1 In afwijking van [artikel 10a.4][ref1] kan een debiteur met ingang van 1 januari 2012 op aanvraag de
      terugbetaling voor ten hoogste 5 kalenderjaren opschorten.

      2 De aflosfase wordt verlengd met het aantal maanden dat gebruik is gemaakt van de aflosvrije periode op grond van
      het eerste lid.

      3 Bij ministeriële regeling kunnen voorschriften worden vastgesteld met betrekking tot de opschorting, bedoeld in
      het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel10a.4
    url: https://wetten.overheid.nl/BWBR0011453/2026-01-01#Artikel10a.5
