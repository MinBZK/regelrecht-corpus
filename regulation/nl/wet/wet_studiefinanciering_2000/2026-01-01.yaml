  - number: '5.3'
    text: |-
      1 Het deel van de prestatiebeurs hoger onderwijs dat betrekking heeft op het recht op de reisvoorziening, is gelijk
      aan een twaalfde deel van de waarde die daarvoor per student door het vervoerbedrijf aan Onze Minister in rekening
      wordt gebracht. De waarde wordt berekend door de voorlopige vergoeding voor het lopende kalenderjaar te corrigeren
      naar de correctie die de voorlopige vergoeding voor het tweede daaraan voorafgaande kalenderjaar onderging. Dit
      deel van de prestatiebeurs hoger onderwijs wordt niet uitbetaald of verrekend.

      2 Indien de prestatiebeurs hoger onderwijs niet kan worden omgezet in een gift, wordt de tegenwaarde van de
      reisvoorziening kwijtgescholden over een maand waarover het reisproduct niet is gekoppeld aan een drager als
      bedoeld in [artikel 3.25, eerste lid][ref1]. In afwijking van [artikel 1.2][ref2] is bepalend de toestand op enig
      moment van de maand. De over het kwijt te schelden bedrag opgebouwde rente gaat dan teniet. De kwijtschelding is
      niet van toepassing op een maand waarin een vergoeding als bedoeld in [artikel 3.24, tweede of vierde lid][ref3],
      is toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel3.25
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel1.2
      [ref3]: https://wetten.overheid.nl/BWBR0011453#Artikel3.24
