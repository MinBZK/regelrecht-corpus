  - number: '6.10'
    text: |-
      1 Maatstaf voor de vaststelling van de draagkracht van de debiteur uit inkomen is het totaal van zijn
      toetsingsinkomen en dat van zijn partner in het peiljaar. Het aldus bepaalde inkomen is het draagkrachtinkomen.

      2 Op het draagkrachtinkomen wordt in mindering gebracht de draagkrachtvrije voet. Deze voet is voor de
      terugbetaling van een lening beroepsonderwijs dan wel een lening hoger onderwijs gelijk aan:

      a. 143% van het belastbaar minimumloon voor een debiteur met partner;

      b. 143% van het belastbaar minimumloon voor een debiteur die in het peiljaar een ouder zonder partner is; of

      c. 100% van het belastbaar minimumloon voor overige debiteuren zonder partner.

      3 De draagkracht van de debiteur uit inkomen is voor de terugbetaling van een lening beroepsonderwijs dan wel een
      lening hoger onderwijs 4% van het inkomen boven de draagkrachtvrije voet.

      4 Indien het bedrag van de draagkracht lager is dan het bedrag van de termijnbetaling betaalt de debiteur, in
      afwijking van dat artikel, het bedrag van zijn draagkracht.

      5 Voor de toepassing van dit artikel, wordt indien het toetsingsinkomen in het peiljaar nog niet bekend is, door
      Onze Minister daarvoor in de plaats gesteld een bedrag dat het vast te stellen toetsingsinkomen benadert.

      6 Het vierde lid is niet van toepassing indien het voor Onze Minister niet mogelijk is op grond van het vijfde lid
      bij benadering een bedrag vast te stellen.
    url: https://wetten.overheid.nl/BWBR0011453/2026-01-01#Artikel6.10
  - number: '6.11'
    text: |-
      1 Voor een debiteur die in het peiljaar niet binnenlands belastingplichtig is in de zin van de
      [Wet inkomstenbelasting 2001][ref1] en die niet op grond van [artikel 2.5, eerste lid, van die wet][ref2] als
      zodanig is aangemerkt, kan [artikel 6.10][ref3] slechts toepassing vinden als de debiteur daartoe bij Onze Minister
      een aanvraag indient.

      2 Indien de debiteur zich voor het einde van een jaartermijn metterwoon in Nederland vestigt, wordt hij tot het
      einde van die jaartermijn behandeld als een debiteur die niet binnenlands belastingplichtig is in de zin van de
      [Wet inkomstenbelasting 2001][ref4].

      3 Bij ministeriële regeling kunnen voorschriften worden vastgesteld met betrekking tot de in het eerste lid
      bedoelde aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0011353
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel2.5
      [ref3]: https://wetten.overheid.nl/BWBR0011453#Artikel6.10
      [ref4]: https://wetten.overheid.nl/BWBR0011353
