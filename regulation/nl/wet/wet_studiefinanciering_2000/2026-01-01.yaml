      1 In afwijking van [artikel 2.8][ref1] komt tot een bij koninklijk besluit te bepalen tijdstip voor
      studiefinanciering mede in aanmerking een ho-student die is ingeschreven voor het volgen van een voltijdse
      opleiding als bedoeld in de [artikelen 18.14][ref2] of [18.15 WHW][ref3], zoals die artikelen luidden
      op 31 augustus 2010, of [18.16 WHW][ref4] voor zover aan die opleiding accreditatie als bedoeld in
      [artikel 1.1, onderdeel q, WHW][ref5] is verleend.

      2 In afwijking van [artikel 2.8][ref6] komt tot een bij koninklijk besluit
      te bepalen tijdstip voor studiefinanciering mede in aanmerking een ho-student
      die is ingeschreven voor het volgen van een voltijdse opleiding als bedoeld in
      __REF001___________________________________________________________________________________________________________
      ___________________________________________________________________________________________________________________
      ____________________________ (Stb. 1998, 216) voor zover aan die opleiding accreditatie als bedoeld in
      [artikel 1.1, onderdeel q, WHW][ref8] is verleend.

      3 In aanvulling op [artikel 2.8][ref9] kan tot een bij koninklijk besluit te bepalen tijdstip een ho-student voor
      studiefinanciering in aanmerking komen die is ingeschreven voor het volgen van een voltijdse associate degree-
      opleiding, een voltijdse bacheloropleiding of een voltijdse masteropleiding aan een aangewezen instelling als
      bedoeld in de [artikelen 6.9][ref10] of [16.10 WHW][ref11], zoals die artikelen luidden op 31 augustus 2010.


