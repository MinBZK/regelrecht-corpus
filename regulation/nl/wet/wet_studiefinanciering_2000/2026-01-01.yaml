  - number: '14.2'
    text: |-
      Deze wet treedt in werking op 1 september 2000, met uitzondering van:

      a. artikel 13.6 dat voor wat betreft de onderdelen B en C in werking treedt met ingang van de dag na de datum van
      uitgifte van het Staatsblad waarin zij wordt geplaatst en terugwerkt tot en met 1 augustus 2000,

      b. artikel 13.13 dat voor wat betreft onderdeel A in werking treedt met ingang van de dag na de datum van uitgifte
      van het Staatsblad waarin zij wordt geplaatst en terugwerkt tot en met 1 september 1996, en

      c. artikel 13.13 dat voor wat betreft onderdeel B in werking treedt met ingang van de dag na de datum van uitgifte
      van het Staatsblad waarin zij wordt geplaatst.
