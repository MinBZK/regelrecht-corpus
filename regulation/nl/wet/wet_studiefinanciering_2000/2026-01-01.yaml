  - number: 5.2b
    text: |-
      1 De prestatiebeurs hoger onderwijs wordt op aanvraag eenmalig 1 jaar langer verstrekt indien de ho-student
      blijkens gedagtekende verklaringen van een arts en van het bestuur van de onderwijsinstelling waar hij is
      ingeschreven, als gevolg van een handicap of chronische ziekte niet in staat is het afsluitend examen met goed
      gevolg af te ronden binnen het aantal jaren prestatiebeurs hoger onderwijs dat zonder deze verlenging aan de ho-
      student kan worden verstrekt.

      2 In afwijking van het eerste lid wordt de prestatiebeurs hoger onderwijs eenmalig 6 maanden langer verstrekt
      aan de ho-student, bedoeld in het eerste lid, die studiefinanciering toegekend heeft gekregen voor een associate
      degree-opleiding.
    url: https://wetten.overheid.nl/BWBR0011453/2026-01-01#Artikel5.2b
  - number: 5.2c
    text: |-
      1 In aanvulling op [artikel 5.2, eerste lid][ref1], wordt de prestatiebeurs hoger onderwijs op aanvraag eenmalig
      1 jaar langer verstrekt, indien:

      a. het een masteropleiding als bedoeld in [artikel 7.30c WHW][ref2] betreft;

      b. met goed gevolg het afsluitende examen van een masteropleiding in het wetenschappelijk onderwijs is
      afgelegd en daarna een masteropleiding als bedoeld in [artikel 7.5a, aanhef en onderdeel a][ref3], of
      [7.5c, vijfde lid, WHW][ref4] wordt gevolgd waarvan niet eerder het afsluitende examen met goed gevolg is afgelegd;
      of

      c. reeds eerder prestatiebeurs hoger onderwijs is toegekend op grond van [artikel 5.2a][ref5] en een
      masteropleiding als bedoeld in [artikel 7.5a, aanhef en onderdeel a][ref6], of [7.5c, vijfde lid, WHW][ref7] wordt
      gevolgd.

      2 Het eerste lid, onderdeel a, is niet van toepassing, indien reeds eerder op grond van onderdeel b van dat lid
      prestatiebeurs hoger onderwijs is toegekend.

      3 Het eerste lid, onderdeel b, is niet van toepassing indien reeds eerder:

      a. op grond van het eerste lid, onderdeel a, of [artikel 5.2a][ref8] prestatiebeurs hoger onderwijs is toegekend;
      of

      b. op grond van [artikel 5.2, eerste lid][ref9], prestatiebeurs hoger onderwijs is toegekend, voor zover die
      toekenning betrekking had op een opleiding als bedoeld in [7.5b, eerste lid, aanhef en onderdeel b, WHW][ref10].


