      1 Onverminderd [artikel 6.1, derde lid][ref1], blijven de [artikelen 6.3][ref2],
      [6.7, eerste lid][ref3], [6.9, derde lid][ref4], [6.10, tweede en derde lid][ref5], en
      [6.14, tweede lid][ref6], zoals deze luidden voor het tijdstip van inwerkingtreding van
      [artikel I, onderdelen N, O, P, Q en R, van de Wet herinvoering basisbeurs hoger onderwijs][ref7], van toepassing
      op een debiteur met een schuld uit een lening beroepsonderwijs die uitsluitend voor dat tijdstip studiefinanciering
      beroepsonderwijs ontving.

      2 Onverminderd [artikel 6.1, derde lid][ref8], kan een debiteur met een schuld
      uit een lening beroepsonderwijs die voor het tijdstip van inwerkingtreding van
      [artikel I, onderdelen N, O, P, Q en R, van de Wet herinvoering basisbeurs hoger onderwijs][ref9] voor het eerst
      studiefinanciering beroepsonderwijs ontving en ook na dat tijdstip studiefinanciering beroepsonderwijs ontving,
      indien hij daartoe vóór aanvang van de aflosfase een aanvraag indient, de schuld aflossen overeenkomstig het eerste
      lid.

      3 Het eerste en tweede lid zijn van overeenkomstige toepassing op een debiteur als bedoeld in
      [artikel 12.14, vierde lid][ref10].

      4 [Artikel 6.14, tweede lid][ref11], zoals dit luidde voor het tijdstip van inwerkingtreding van
      [artikel I, onderdeel R, van de Wet herinvoering basisbeurs hoger onderwijs][ref12], blijft eveneens van toepassing
      op een debiteur met een lening hoger onderwijs met een partner die een debiteur als bedoeld in het eerste lid is of
      die op grond van het tweede of derde lid de schuld aflost overeenkomstig het eerste lid.

      5 Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de goede uitvoering van het tweede
      lid.


