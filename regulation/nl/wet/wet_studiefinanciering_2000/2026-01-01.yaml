  - number: '6.19'
    text: |-
      1 Met uitzondering van de [artikelen 6.5, tweede, derde en vierde lid][ref1][6.6][ref2],
      [6.7, eerste lid, tweede volzin, en tweede en derde lid][ref3], en [6.14][ref4] is [paragraaf 6.1][ref5] van
      overeenkomstige toepassing op de terugbetaling van het levenlanglerenkrediet, waarbij deze lening wordt aangemerkt
      als een lening beroepsonderwijs.

      2 In afwijking van het eerste lid wordt:

      a. bij de toepassing van [artikel 6.7, eerste lid, eerste volzin][ref6], voor de aflosfase een periode van
      15 kalenderjaren gelezen.

      b. bij de toepassing van [artikel 6.9, derde lid][ref7], voor het totaal per jaar te betalen bedrag aan
      maandelijkse termijnbetalingen ten minste € 545 gelezen.

      c. bij de toepassing van [artikel 6.10, tweede lid, onderdelen a en b][ref8], voor de draagkrachtvrije voet een
      percentage gelezen van 120% van het belastbaar minimumloon.

      d. bij de toepassing van [artikel 6.10, tweede lid, onderdeel c][ref9], voor de draagkrachtvrije voet een
      percentage gelezen van 84% van het belastbaar minimumloon.

      e. bij de toepassing van [artikel 6.10, derde lid][ref10], voor de draagkracht van de debiteur uit inkomen een
      percentage gelezen van 12% van het inkomen boven de draagkrachtvrije voet.


