  - number: 2.17a
    text: |-
      1 Een student heeft geen aanspraak op studiefinanciering indien hij een uitreiziger is.

      2 Onze Minister kan besluiten dat een student een uitreiziger is indien het betreft een persoon ten aanzien van wie
      uit een melding van de door de daartoe bevoegde opsporingsdiensten of inlichtingen- en veiligheidsdiensten, gericht
      aan Onze Minister, is gebleken dat het gegronde vermoeden bestaat dat de student zich buiten het land Nederland
      bevindt met het doel zich aan te sluiten bij een organisatie die door Onze Minister van Veiligheid en Justitie, in
      overeenstemming met het gevoelen van de Rijksministerraad, is geplaatst op een lijst van organisaties die deelnemen
      aan een nationaal of internationaal gewapend conflict en een bedreiging vormen voor de nationale veiligheid.

      3 In het besluit van Onze Minister dat een student een uitreiziger is, wordt vermeld vanaf welk moment een student
      als uitreiziger is aangemerkt.
