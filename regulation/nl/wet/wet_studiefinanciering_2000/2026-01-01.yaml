  - number: '5.15'
    text: |-
      Indien een ho-student op enig moment binnen de diplomatermijn hoger onderwijs duurzaam geen mogelijkheden tot
      arbeidsparticipatie meer heeft in de zin van de [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref1] of
      op enig moment niet langer in staat is om met arbeid meer dan 20% te verdienen van het maatmaninkomen in de zin van
      die wet en recht op arbeidsongeschiktheidsuitkering op grond van [hoofdstuk 3 van die wet][ref2] bestaat, wordt de
      aan hem toegekende prestatiebeurs hoger onderwijs omgezet in een gift.


      [ref1]: https://wetten.overheid.nl/BWBR0008657
      [ref2]: https://wetten.overheid.nl/BWBR0008657#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0011453/2026-01-01#Artikel5.15
    references:
      - id: ref1
        bwb_id: BWBR0008657
      - id: ref2
        bwb_id: BWBR0008657
        hoofdstuk: '3'
  - number: '5.16'
    text: |-
      1 Indien een ho-student als direct gevolg van bijzondere omstandigheden van tijdelijke aard niet in staat is binnen
      de diplomatermijn hoger onderwijs met goed gevolg het afsluitend examen te behalen, wordt deze termijn verlengd met
      de duur van die bijzondere omstandigheden.

      2 Indien een ho-student als direct gevolg van bijzondere omstandigheden van structurele aard niet in staat is
      binnen de diplomatermijn hoger onderwijs met goed gevolg het afsluitend examen te behalen, wordt deze termijn, op
      aanvraag, verlengd met 5 jaren. Onder bijzondere omstandigheden van structurele aard kunnen in ieder geval worden
      verstaan functiebeperking of chronische ziekte.

      3 Indien een ho-student als direct gevolg van bijzondere omstandigheden van structurele aard niet in staat is
      binnen de diplomatermijn hoger onderwijs of binnen de, op grond van het tweede lid, verlengde diplomatermijn
      hoger onderwijs met goed gevolg het afsluitend examen te behalen, wordt de aan hem toegekende prestatiebeurs hoger
      onderwijs omgezet in een gift.

      4 Indien een ho-student als direct gevolg van een tijdens de studie verworven handicap, ten gevolge van een zich
      tijdens de studie verergerende handicap of ten gevolge van een zich tijdens de studie manifesterende chronische
      ziekte genoodzaakt is een reeds begonnen opleiding te beëindigen, ontvangt de ho-student bij keuze voor een
      passender opleiding nieuwe aanspraak op studiefinanciering.

      5 Onze Minister stelt op aanvraag van de ho-student vast of er sprake is van bijzondere omstandigheden in de zin
      van dit artikel. De bijzondere omstandigheden kunnen uitsluitend worden aangetoond door gedagtekende verklaringen
      van een arts en de natuurlijke persoon of het bestuur van de rechtspersoon van de onderwijsinstelling waar
      hij is ingeschreven. Indien de bijzondere omstandigheden uitsluitend van niet-medische aard zijn, volstaat een
      gedagtekende verklaring van de natuurlijke persoon of het bestuur van de rechtspersoon van de onderwijsinstelling
      waar de ho-student is ingeschreven.
    url: https://wetten.overheid.nl/BWBR0011453/2026-01-01#Artikel5.16
  - number: '5.17'
    text: |-
      Bij omzetting van de prestatiebeurs hoger onderwijs of een deel daarvan in een gift gaat de over het om te zetten
      bedrag opgebouwde rente teniet.
    url: https://wetten.overheid.nl/BWBR0011453/2026-01-01#Artikel5.17
  - number: '6.1'
    text: |-
      1 In dit hoofdstuk wordt onder lening mede verstaan de prestatiebeurs.

      2 In dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder:

        - *lening beroepsonderwijs:* lening die uitsluitend is aangegaan voor het volgen van beroepsonderwijs;
        - *lening hoger onderwijs:* lening die is aangegaan voor het volgen van hoger onderwijs.

      3 Vanaf de dag waarop een student met een lening beroepsonderwijs tevens een lening hoger onderwijs aangaat, wordt
      de lening beroepsonderwijs aangemerkt als een lening hoger onderwijs.

      4 Voor de toepassing van deze paragraaf wordt onder debiteur uitsluitend verstaan degene die een lening heeft
      opgebouwd anders dan door de toekenning van het levenlanglerenkrediet.

      5 Indien de debiteur tevens een schuld uit een lening heeft als bedoeld in
      [hoofdstuk 4 van de Wet tegemoetkoming onderwijsbijdrage en schoolkosten][ref1], wordt die schuld voor de
      toepassing van dit hoofdstuk aangemerkt als een schuld in de zin van dit hoofdstuk.


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0011453/2026-01-01#Artikel6.1
    references:
      - id: ref1
        bwb_id: BWBR0012438
        hoofdstuk: '4'
  - number: 6.1a
    text: |-
      Het belastbaar minimumloon in de zin van deze wet is een bij of krachtens algemene maatregel van bestuur
      vast te stellen bedrag, afgeleid van het totaal van het minimumloon en de minimumvakantiebijslag, bedoeld in
      [artikel 7, eerste lid, van de Wet minimumloon en minimumvakantiebijslag][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel7
    url: https://wetten.overheid.nl/BWBR0011453/2026-01-01#Artikel6.1a
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '7'
  - number: 6.1b
    text: |-
      Ontvangst van een lening of omzetting in een lening, of omzetting als bedoeld in [artikel 6.17][ref1], verplicht
      degene die studiefinanciering heeft ontvangen tot terugbetaling van de lening vermeerderd met de volgens dit
      hoofdstuk berekende rente.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel6.17
    url: https://wetten.overheid.nl/BWBR0011453/2026-01-01#Artikel6.1b
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '6.17'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: '6.2'
    text: |-
      1 De ingevolge [hoofdstukken 4][ref1] en [5][ref2] toegekende en niet in gift om te zetten aanvullende beurs kan
      op aanvraag van de debiteur worden kwijtgescholden.

      2 Bij algemene maatregel van bestuur wordt bepaald:

      a. tot welk toetsingsinkomen van de debiteur en zijn partner geheel of gedeeltelijk kwijtschelding als bedoeld in
      het eerste lid, mogelijk is,

      b. of daarbij onderscheid gemaakt wordt voor een debiteur met partner en een debiteur zonder partner die al dan
      niet student is in de zin van deze wet, en

      c. tot welk tijdstip een aanvraag kan worden ingediend.

      3 De over het kwijt te schelden bedrag opgebouwde rente gaat op het tijdstip van kwijtschelding als bedoeld in het
      eerste lid, teniet.

      4 Bij kwijtschelding als bedoeld in het eerste lid, zijn de [artikelen 6.10, eerste en vijfde lid][ref3], van
      overeenkomstige toepassing, en is [artikel 6.12][ref4] niet van toepassing.

      5 Een krachtens het tweede lid vastgestelde algemene maatregel van bestuur wordt aan de beide kamers der Staten-
      Generaal overgelegd. Hij treedt in werking op een tijdstip dat nadat vier weken na de overlegging zijn verstreken
      bij koninklijk besluit wordt vastgesteld, tenzij binnen die termijn door of namens een der kamers of door ten
      minste een vijfde van het grondwettelijk aantal leden van een der kamers de wens te kennen wordt gegeven dat het
      onderwerp bij wet wordt geregeld. In dat geval wordt een daartoe strekkend voorstel van wet zo spoedig mogelijk
      ingediend. Indien het voorstel van wet wordt ingetrokken of indien een van de beide kamers van de Staten-Generaal
      besluit het voorstel niet aan te nemen, wordt de algemene maatregel van bestuur ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Hoofdstuk4
