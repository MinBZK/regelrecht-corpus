  - number: '4.6'
    text: Deze paragraaf is uitsluitend van toepassing op mbo-studenten die in Nederland een opleiding niveau 3 of 4 volgen.
    url: https://wetten.overheid.nl/BWBR0011453/2026-01-01#Artikel4.6
  - number: 4.6a
    text: |-
      Een mbo-student aan een opleiding niveau 3 of 4 komt voor zover wordt voldaan aan de van toepassing zijnde
      voorwaarden in aanmerking voor studiefinanciering in de vorm van een prestatiebeurs, inhoudende:

      a. een basisbeurs;

      b. een aanvullende beurs;

      c. een reisvoorziening; en

      d. een toeslag eenoudergezin.
    url: https://wetten.overheid.nl/BWBR0011453/2026-01-01#Artikel4.6a
  - number: 4.6b
    text: |-
      Onverminderd[ artikel 4.7, eerste en tweede lid][ref1], komt een mbo-student die jonger is dan 18 jaren in
      aanmerking voor een reisvoorziening in de vorm van een prestatiebeurs.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel4.7
    url: https://wetten.overheid.nl/BWBR0011453/2026-01-01#Artikel4.6b
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '4.7'
        hoofdstuk: '4'
        paragraaf: 4.1.2
        afdeling: '4.1'
  - number: '4.7'
    text: |-
      1 Prestatiebeurs beroepsonderwijs wordt voor een opleiding niveau 3 of 4 binnen en buiten Nederland tezamen
      gedurende ten hoogste 4 jaren verstrekt in de vorm van een prestatiebeurs, met dien verstande dat de aanvullende
      beurs in de eerste 12 maanden waarvoor aanspraak op studiefinanciering bestaat wordt verstrekt in de vorm van een
      gift.

      2 Indien een mbo-student een specialistenopleiding volgt en hij 4 jaren prestatiebeurs beroepsonderwijs heeft
      genoten, wordt aan hem voor die opleiding op aanvraag gedurende ten hoogste 2 jaren prestatiebeurs beroepsonderwijs
      verstrekt.

      3 Studiefinanciering wordt gedurende in totaal ten hoogste 36 maanden na de perioden, bedoeld in het eerste en
      tweede lid, verstrekt in de vorm van een lening. Het bedrag dat per maand kan worden geleend, bedraagt in afwijking
      van de [artikelen 3.1, vierde lid][ref1], [3.2][ref2], [3.13][ref3] en [3.18][ref4], naar de maatstaf van 1 januari
      2005 € 787,02 . Tevens kan gedurende deze 36 maanden een reisvoorziening worden verstrekt in de vorm van een
      prestatiebeurs, waarbij het aantal maanden dat op grond van [artikel 4.6b][ref5] reisvoorziening is toegekend in
      mindering wordt gebracht op dit aantal maanden.

      4 Op aanvraag kan een mbo-student als bedoeld in [artikel 3.5][ref6], gedurende de periode bedoeld in het derde
      lid, tevens in aanmerking komen voor een lening ter grootte van het bedrag van de toeslag eenoudergezin, bedoeld
      in [artikel 3.18][ref7].


