  - number: '5.10'
    text: |-
      Indien een ho-student in het studiejaar waarvoor hij op enig moment voor het eerst prestatiebeurs hoger onderwijs
      geniet, ophoudt studiefinanciering te genieten vóór 1 februari, en hij niet over datzelfde studiejaar opnieuw
      studiefinanciering voor het volgen van hoger onderwijs krijgt toegekend, wordt uiterlijk per 1 januari van het
      kalenderjaar volgend op dat studiejaar de in dat studiejaar toegekende prestatiebeurs hoger onderwijs omgezet in
      een gift.
    url: https://wetten.overheid.nl/BWBR0011453/2026-01-01#Artikel5.10
  - number: '5.11'
    text: |-
      Indien een ho-student in het studiejaar waarvoor hij op enig moment na 31 januari voor het eerst prestatiebeurs
      hoger onderwijs geniet, ophoudt studiefinanciering te genieten vóór 1 september, en hij niet vóór 1 februari van
      het daaropvolgende studiejaar opnieuw studiefinanciering voor het volgen van hoger onderwijs krijgt toegekend,
      wordt uiterlijk per 1 januari van het kalenderjaar volgend op het laatstbedoelde studiejaar de in het eerste
      studiejaar toegekende prestatiebeurs hoger onderwijs omgezet in een gift.
    url: https://wetten.overheid.nl/BWBR0011453/2026-01-01#Artikel5.11
  - number: 5.11a
    text: |-
      1 Onverminderd [artikel 5.10][ref1] onderscheidenlijk [artikel 5.11][ref2] wordt de prestatiebeurs van de ho-
      student die eerder een opleiding in het beroepsonderwijs heeft afgerond, omgezet in een gift, indien:

      a. hij uiterlijk op 31 augustus van het studiejaar waarvoor hij op enig moment voor het eerst prestatiebeurs
      hoger onderwijs geniet ophoudt studiefinanciering te genieten, en hij niet vóór 1 februari van het daaropvolgende
      studiejaar opnieuw studiefinanciering voor het volgen van hoger onderwijs krijgt toegekend; of

      b. hij uiterlijk op 31 januari van het studiejaar volgend op het studiejaar waarvoor hij op enig moment op of na
      1 februari voor het eerst prestatiebeurs hoger onderwijs geniet ophoudt studiefinanciering te genieten, en hij
      niet vóór de start van het daaropvolgende studiejaar opnieuw studiefinanciering voor het volgen van hoger onderwijs
      krijgt toegekend.

      2 De omzetting, bedoeld in het eerste lid, vindt plaats uiterlijk per 1 januari van het kalenderjaar volgend op het
      kalenderjaar waarin de periode eindigt waarin de student geen studiefinanciering toegekend mag hebben gekregen om
      aanspraak te kunnen maken op deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel5.10
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel5.11
    url: https://wetten.overheid.nl/BWBR0011453/2026-01-01#Artikel5.11a
