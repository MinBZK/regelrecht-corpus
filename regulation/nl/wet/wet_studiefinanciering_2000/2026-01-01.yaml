  - number: '6.20'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld over de terugbetaling van de
      lening die is ontstaan door toekenning van het levenlanglerenkrediet waarbij tenminste regels worden gesteld
      over de samenloop met de terugbetaling van de lening die is ontstaan anders dan door toekenning van het
      levenlanglerenkrediet en over de samenloop met de terugbetaling door een partner van het levenlanglerenkrediet of
      een andere lening die is toegekend op grond van deze wet.
    url: https://wetten.overheid.nl/BWBR0011453/2026-01-01#Artikel6.20
  - number: '7.1'
    text: |-
      1 Onze Minister kan een beschikking herzien waarbij:

      a. studiefinanciering is toegekend,

      b. de vorm van de studiefinanciering is vastgelegd,

      c. de termijnbetaling wordt vastgesteld of gewijzigd,

      d. de draagkracht van de debiteur wordt vastgesteld,

      e. de hoogte van de lening wordt vastgesteld of gewijzigd,

      f. de hoogte van de veronderstelde ouderlijke bijdrage wordt vastgesteld of gewijzigd,

      g. de hoogte van het bedrag van de kwijtschelding, bedoeld in [artikel 6.2, eerste lid][ref1], wordt vastgesteld
      of gewijzigd,

      h. de hoogte van het collegegeldkrediet wordt vastgesteld of gewijzigd,

      i. de hoogte van het levenlanglerenkrediet wordt vastgesteld of gewijzigd,

      j. een herziening van de keuze in een soort reisvoorziening is geweigerd,

      k. een bedrag is vastgesteld dat de student verschuldigd is omdat hij gebruik heeft gemaakt van het reisproduct na
      de termijn, genoemd in [artikel 3.27, eerste lid][ref2],

      l. studiefinanciering ingevolge [artikel 2.17a][ref3] is geweigerd of stopgezet, of

      m. de aanvraag van een student, bedoeld in [artikel 3.24, tweede lid][ref4], om als reisvoorziening een reisrecht
      te ontvangen, is toegekend of geweigerd.

      2 Herziening vindt plaats op grond van het feit dat:

      a. een beschikking genomen is waarvan de student of de debiteur onderscheidenlijk zijn ouder wist of redelijkerwijs
      had kunnen weten dat deze onjuist was,

      b. de situatie van langdurige afwezigheid, bedoeld in [artikel 4.3][ref5], zich niet heeft voorgedaan,

      c. te veel of te weinig studiefinanciering is toegekend, de vorm van de studiefinanciering onjuist is vastgelegd
      anders dan bedoeld in onderdeel b, de termijnbetaling te hoog of te laag is vastgesteld , de draagkracht van
      de debiteur te hoog of te laag is vastgesteld, de hoogte van het bedrag van de kwijtschelding, bedoeld in
      [artikel 6.2, eerste lid][ref6], te hoog of te laag is vastgesteld, de hoogte van de veronderstelde ouderlijke
      bijdrage te hoog of te laag is vastgesteld, of een onjuist besluit met betrekking tot de reisvoorziening is genomen
      op basis van onjuiste of onjuist verwerkte gegevens anders dan bedoeld onder a,

      d. betrokkene heeft gehandeld in strijd met het bepaalde bij of krachtens deze wet,

      e. geen gevolg is gegeven aan de aanvraag tot peiljaarverlegging van de ouders, één van de ouders, of de student op
      grond van [artikel 3.10][ref7] of aan de aanvraag van de debiteur op grond van [artikel 6.12][ref8], omdat op dat
      moment niet werd voldaan aan de voorwaarde, genoemd in artikel 3.10, tweede lid, onderscheidenlijk artikel 6.12,
      tweede lid, maar blijkt dat wel aan die voorwaarde is voldaan,

      f. gevolg is gegeven aan de aanvraag tot peiljaarverlegging van de ouders, één van de ouders, of de student op
      grond van [artikel 3.10][ref9] of aan de aanvraag van de debiteur op grond van [artikel 6.12][ref10], en blijkt dat
      niet is voldaan aan de voorwaarde, genoemd in artikel 3.10, tweede lid, onderscheidenlijk artikel 6.12, tweede lid,

      g. achteraf is gebleken van feiten of omstandigheden, die, waren zij eerder bekend geweest, niet tot toepassing van
      [artikel 2.17a][ref11] zouden hebben geleid, of

      h. andere, nader gebleken feiten of omstandigheden, die, waren zij eerder bekend geweest, tot een andere
      beschikking zouden hebben geleid.

      3 Een herziening als bedoeld in het tweede lid de onderdelen a, b, c, voor zover het betreft de vorm van de
      studiefinanciering, e of f, kan, behoudens het geval van bedrog, slechts geschieden binnen 5 jaren na het einde
      van het desbetreffende studiefinancieringstijdvak, het kalenderjaar waarvoor de termijnbetaling is vastgesteld of
      het kalenderjaar waarvoor de draagkracht van de debiteur is vastgesteld. Behoudens in geval van bedrog, kan een
      herziening als bedoeld in het tweede lid onder c, voor zover het betreft de hoogte van de veronderstelde ouderlijke
      bijdrage, slechts geschieden binnen 3 jaren na het einde van het desbetreffende studiefinancieringstijdvak.
      Behoudens in geval van bedrog, kan een herziening anders dan bedoeld in de eerste en tweede volzin, slechts
      geschieden binnen 18 maanden na het einde van het desbetreffende studiefinancieringstijdvak, het kalenderjaar
      waarvoor de termijnbetaling is vastgesteld of het kalenderjaar waarvoor de draagkracht van de debiteur is
      vastgesteld.


