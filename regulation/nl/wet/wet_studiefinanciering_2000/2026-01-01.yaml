  - number: 10a.6
    text: |-
      1 Rente en aflossing van de lening vervallen gedurende de aflosfase in maandelijkse termijnen.

      2 De hoogte van de maandelijkse termijnbetalingen wordt op basis van het aantal maanden van de aflosfase
      onderscheidenlijk het nog resterende aantal maanden van de aflosfase tot gelijke bedragen vastgesteld bij de
      aanvang van:

      a. het eerste jaar van de aflosfase,

      b. het vierde jaar van de aflosfase, en

      c. ieder vijfde jaar na het vierde jaar van de aflosfase.

      3 Onverminderd [artikel 10a.7, eerste lid][ref1], bedraagt het totaal per jaar te betalen bedrag aan maandelijkse
      termijnbetalingen ten minste € 545,–.

      4 Rente en aflossing van de lening van een debiteur die in het buitenland woont, vervallen, in afwijking van
      het eerste lid, gedurende de aflosfase in jaarlijkse termijnen. Indien die debiteur zich voor het einde van
      een jaartermijn metterwoon in Nederland vestigt, wordt hij tot het einde van die jaartermijn behandeld als een
      debiteur die in het buitenland woont. De [artikelen 6.4][ref2] en [6.6][ref3] zijn in dat geval van overeenkomstige
      toepassing. Op aanvraag van een in de eerste volzin bedoelde debiteur besluit Onze Minister dat de rente en
      aflossing van de lening niet vervallen in jaarlijkse termijnen maar in maandelijkse termijnen.

      5 Bij ministeriële regeling kunnen nadere regels worden gesteld voor de vaststelling en betaling van de
      termijnbetalingen.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel10a.7
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel6.4
      [ref3]: https://wetten.overheid.nl/BWBR0011453#Artikel6.6
