  - number: 3.16d
    text: |-
      1 Het levenlanglerenkrediet bedraagt per maand niet meer dan een twaalfde deel van het feitelijk door de
      student voor een periode van twaalf maanden te betalen bedrag aan collegegeld of lesgeld voor het volgen van de
      desbetreffende opleiding en in totaal ten hoogste:

      a. vijf maal een twaalfde deel van het volledige wettelijk collegegeld, bedoeld in
      [artikel 7.45, eerste lid, WHW][ref1], voor een opleiding in het hoger onderwijs;

      b. vijf maal een twaalfde deel van het lesgeld, bedoeld in
      [artikel 5, tweede lid, van de Les- en cursusgeldwet][ref2], voor een opleiding in het beroepsonderwijs; of

      c. een in afwijking van de onderdelen a en b bij algemene maatregel van bestuur te bepalen lager maximum.

      2 In afwijking van het eerste lid kan aan bij ministeriële regeling vast te stellen groepen studenten een hoger
      bedrag per maand worden toegekend, waarbij het totale levenlanglerenkrediet voor een periode van twaalf maanden
      niet meer bedraagt dan twaalf maal het bedrag, genoemd in het eerste lid, onderdeel a, b of c.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7.45
      [ref2]: https://wetten.overheid.nl/BWBR0004188#Artikel5
    url: https://wetten.overheid.nl/BWBR0011453/2026-01-01#Artikel3.16d
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7.45'
      - id: ref2
        bwb_id: BWBR0004188
        artikel: '5'
  - number: 3.16e
    text: |-
      Voor een goede uitvoering van de [artikelen 3.16b tot en met 3.16d][ref1] worden bij ministeriële regeling regels
      vastgesteld over de aanvraag, toekenning, berekening, betaling en andere uitvoeringsaspecten.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel3.16b
    url: https://wetten.overheid.nl/BWBR0011453/2026-01-01#Artikel3.16e
