  - number: 2.13a
    text: |-
      1 Dit artikel is niet van toepassing op het levenlanglerenkrediet en op mbo-studenten die op grond van
      [artikel 2.2, tweede lid][ref1], slechts een tegemoetkoming in de kosten van de toegang tot het onderwijs
      ontvangen.

      2 Voor studiefinanciering kan een mbo-student in aanmerking komen die is ingeschreven voor het volgen van onderwijs
      aan een opleiding buiten Nederland:

      a. waarvan het niveau en de kwaliteit vergelijkbaar is met overeenkomstige Nederlandse opleidingen in de zin van
      de [WEB][ref2] en waarvan het afsluitend examen vergelijkbaar is met een afsluitend examen voor een opleiding in de
      zin van de WEB, en

      b. die overigens voldoet aan bij ministeriële regeling vastgestelde criteria.

      3 Onze Minister stelt vast of een opleiding buiten Nederland voldoet aan de criteria, bedoeld in het tweede lid.
      Onze Minister stelt tevens vast of de opleiding wordt aangemerkt als een opleiding niveau 1 of 2 of een opleiding
      niveau 3 of 4. De opleiding wordt aangemerkt als een opleiding niveau 1 of 2 onderscheidenlijk een opleiding niveau
      3 of 4 indien deze vergelijkbaar is met een opleiding niveau 1 of 2 onderscheidenlijk een opleiding niveau 3 of 4.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel2.2
      [ref2]: https://wetten.overheid.nl/BWBR0007625
