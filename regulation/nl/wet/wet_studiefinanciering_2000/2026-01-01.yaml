  - number: '2.13'
    text: |-
      1 Een ho-student heeft geen aanspraak op studiefinanciering:

      a. indien hij na het verstrijken van zijn aanspraak op prestatiebeurs hoger onderwijs gedurende 36 maanden een
      lening heeft genoten,

      b. indien er 10 jaren verstreken zijn met ingang van de maand waarover voor het eerst studiefinanciering
      is toegekend voor het volgen van hoger onderwijs, op grond van deze wet of op grond van de
      [Wet studiefinanciering BES][ref1],

      c. indien hij is ingeschreven aan een opleiding waarvan de duur, daaronder begrepen ten hoogste 12 vakantieweken,
      korter is dan 1 jaar, of

      d. indien hij in het betreffende studiefinancieringstijdvak aanspraak maakt op een tegemoetkoming in de kosten voor
      de toegang tot het onderwijs of voor levensonderhoud, die door de voor de verstrekking van deze tegemoetkomingen
      verantwoordelijke autoriteit van een ander land wordt verstrekt.

      2 De aanspraak van een ho-student die een opleiding volgt als bedoeld in [artikel 2.14][ref2] vervalt over het
      tijdvak waarover hij de inlichtingen, bedoeld in [artikel 9.2, eerste lid][ref3], niet verstrekt. Zolang hij die
      inlichtingen over een studiejaar niet verstrekt, heeft hij tevens geen aanspraak op studiefinanciering voor de
      daarop volgende studiejaren. Indien hij die inlichtingen alsnog verstrekt, herleeft de aanspraak.

      3 In afwijking van het eerste lid, onderdeel b, wordt, indien [artikel 5.16, eerste lid][ref4], toepassing vindt,
      de termijn van 10 jaren, genoemd in het eerste lid, onderdeel b, verlengd met de duur van de in dat artikel
      bedoelde bijzondere omstandigheden.

      4 In afwijking van het eerste lid, onderdeel b, wordt, indien [artikel 5.16, tweede lid][ref5], toepassing vindt,
      de termijn van 10 jaren, genoemd in het eerste lid, onderdeel b, verlengd met 5 jaren.

      5 Het eerste lid, onderdelen a en b, en het tweede tot en met vierde lid zijn niet van toepassing op het
      levenlanglerenkrediet.


      [ref1]: https://wetten.overheid.nl/BWBR0028393
