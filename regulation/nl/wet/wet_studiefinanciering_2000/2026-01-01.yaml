        bwb_id: BWBR0011453
        artikel: '3.27'
        hoofdstuk: '3'
        paragraaf: '3.7'
  - number: '3.29'
    text: |-
      1 Wanneer een student door toedoen van Onze Minister over een periode ten onrechte geen gebruik kan maken van
      het reisrecht, heeft hij over die periode jegens Onze Minister aanspraak op een vergoeding ter grootte van het
      bedrag, bedoeld in [artikel 3.27, tweede lid, onder b][ref1], mits hij meer dan 8 weken vóór het begin van de
      desbetreffende kalendermaand, zowel de studiefinanciering heeft aangevraagd als alle benodigde gegevens voor
      het kunnen toekennen van studiefinanciering heeft verstrekt. Indien het betreft een reisvoorziening als bedoeld
      in [artikel 3.24, tweede lid][ref2], heeft hij slechts aanspraak op een vergoeding als bedoeld in de vorige
      volzin, indien hij tevens binnen een bij ministeriële regeling vast te stellen termijn, een aanvraag om deze
      reisvoorziening heeft ingediend.

      2 De student vraagt de vergoeding aan binnen 2 weken na de dag waarop hij op de aanvraag voor het eerst
      studiefinanciering heeft toegekend gekregen of, indien dit later is, binnen 2 weken na de dag waarop voor het eerst
      zijn recht op studiefinanciering inging.

      3 De student heeft geen recht op enige vergoeding:

      a. wegens het geen of slechts gedeeltelijk gebruik maken van het reisrecht, of

      b. in geval van inname, verlies, diefstal, beschadiging of een defect van de drager, bedoeld in
      [artikel 3.25, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel3.27
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel3.24
      [ref3]: https://wetten.overheid.nl/BWBR0011453#Artikel3.25
