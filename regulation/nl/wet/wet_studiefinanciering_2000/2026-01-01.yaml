  - number: '2.5'
    text: |-
      1 Een mbo-student heeft geen aanspraak op studiefinanciering indien hij is ingeschreven aan een opleiding waarvan
      de duur, daaronder begrepen ten hoogste 12 vakantieweken, korter is dan 1 jaar.

      2 De aanspraak op studiefinanciering van een mbo-student als bedoeld in [artikel 4.1, onderdeel a of b][ref1],
      die gedurende een aaneengesloten periode van 8 weken geen lessen of beroepspraktijkvorming heeft gevolgd,
      vervalt met ingang van de eerste dag van de maand volgend op die waarin de instelling de afwezigheid, bedoeld in
      [artikel 4.3][ref2], aan Onze Minister heeft medegedeeld. De periode van 8 weken wordt verlengd met de weken waarin
      vanwege vakantie geen onderwijs werd verzorgd.

      3 De aanspraak op studiefinanciering vervalt over het tijdvak waarover een mbo-student de gegevens, bedoeld in
      [artikel 4.19][ref3], niet verstrekt. Zolang hij deze gegevens over een studiejaar niet verstrekt, heeft hij tevens
      geen aanspraak op studiefinanciering voor de daarop volgende studiejaren. Indien hij ontbrekende gegevens alsnog
      levert, herleeft de aanspraak.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel4.1
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel4.3
      [ref3]: https://wetten.overheid.nl/BWBR0011453#Artikel4.19
