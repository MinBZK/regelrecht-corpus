  - number: 9.1b
    text: |-
      1 De toezichthouders, bedoeld in [artikel 9.1a][ref1], en Onze Minister wisselen de persoonsgegevens en
      inlichtingen uit die nodig zijn voor de uitoefening van het toezicht onder vermelding van het burgerservicenummer
      of, bij het ontbreken daarvan, het onderwijsnummer van de student op wie de persoonsgegevens of inlichtingen
      betrekking hebben.

      2 Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld over de wijze van verstrekking van
      persoonsgegevens en inlichtingen op grond van het eerste lid en wordt een nadere specificatie gegeven van de
      persoonsgegevens en inlichtingen die op grond van het eerste lid worden verwerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel9.1a
