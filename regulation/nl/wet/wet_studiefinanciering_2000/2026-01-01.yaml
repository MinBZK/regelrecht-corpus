      1 Ingeval de verplichting tot terugbetaling van renteloze voorschotten verstrekt door Onze Minister
      met betrekking tot de lasten, verbonden aan het bezoeken van een school voor voortgezet onderwijs dan
      wel een instelling van wetenschappelijk onderwijs is aangevangen voor dan wel op 1 oktober 1986, zijn
      de [artikelen 40, eerste en derde lid][ref1], [42 tot en met 48][ref2], [50][ref3], [107][ref4],
      [121 tot en met 127][ref5], [130][ref6] en [132 van de Wet op de studiefinanciering][ref7], zoals die luidden op
      31 augustus 2000, van overeenkomstige toepassing.

      2 Voor de toepassing van de [artikelen 42 tot en met 50 van de Wet op de studiefinanciering][ref8], zoals die
      luidden op 31 augustus 2000, wordt de aflosfase gesteld op 15 jaar en vangt de aflosfase aan op 1 januari 1987.


