  - number: '4.9'
    text: |-
      De diplomatermijn beroepsonderwijs is een periode van 10 jaren. Deze periode vangt aan op de eerste dag van de
      maand waarover voor het eerst prestatiebeurs beroepsonderwijs is toegekend.
    url: https://wetten.overheid.nl/BWBR0011453/2026-01-01#Artikel4.9
  - number: '4.10'
    text: |-
      1 Indien een mbo-student binnen de diplomatermijn beroepsonderwijs het afsluitend examen van een opleiding niveau
      3 of 4 met goed gevolg heeft afgelegd, wordt de aan hem ingevolge [artikel 4.7, eerste lid][ref1], toegekende
      prestatiebeurs beroepsonderwijs omgezet in een gift.

      2 Indien een mbo-student binnen de diplomatermijn beroepsonderwijs het afsluitend examen van een
      specialistenopleiding met goed gevolg heeft afgelegd, wordt de aan hem ingevolge [artikel 4.7, tweede lid][ref2],
      toegekende prestatiebeurs beroepsonderwijs omgezet in een gift.

      3 Indien een mbo-student binnen de diplomatermijn beroepsonderwijs het afsluitend examen van een opleiding niveau 3
      of 4 met goed gevolg heeft afgelegd, wordt de resterende periode van zijn prestatiebeurs beroepsonderwijs verstrekt
      in de vorm van een gift indien hij een andere opleiding niveau 3 of 4 aanvangt.

      4 Met een afsluitend examen van een opleiding niveau 3 of 4 wordt gelijkgesteld het afsluitend examen van een
      opleiding in het hoger onderwijs.

      5 Omzetting vindt plaats uiterlijk per 1 januari volgend op het kalenderjaar waarin Onze Minister heeft vastgesteld
      dat een mbo-student heeft voldaan aan de voorwaarden, bedoeld in het eerste of tweede lid.

      6 Het eerste, tweede en derde lid zijn van overeenkomstige toepassing op een mbo-student die binnen
      de diplomatermijn beroepsonderwijs het afsluitend examen van een vakopleiding, middenkaderopleiding of
      specialistenopleiding als bedoeld in [artikel 7.2.2, eerste lid, onderdelen c, d en e, WEB][ref3] in de
      beroepsbegeleidende leerweg, bedoeld in [artikel 7.2.7, vierde lid, WEB][ref4] met goed gevolg heeft afgelegd,
      voor zover de mbo-student eerder een prestatiebeurs beroepsonderwijs heeft ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel4.7
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel4.7
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel7.2.2
      [ref4]: https://wetten.overheid.nl/BWBR0007625#Artikel7.2.7
    url: https://wetten.overheid.nl/BWBR0011453/2026-01-01#Artikel4.10
