  - number: '12.10'
    text: |-
      1 Tot een bij koninklijk besluit te bepalen tijdstip, wordt in afwijking van [artikel 5.6][ref1], zoals dat luidde
      op 31 augustus 2015, de prestatiebeurs mede gedurende 5 jaren verstrekt, indien het betreft een opleiding:

      a. genoemd in [artikel 7.4, derde lid, eerste volzin, WHW][ref2], zoals dat artikel op 31 augustus 2002 luidde,

      b. genoemd in [artikel 7.4, zesde lid, WHW][ref3], zoals dat artikel op 31 augustus 2002 luidde, of

      c. genoemd in [artikel 18.20 WHW][ref4].

      2 Tot een bij koninklijk besluit te bepalen tijdstip, wordt in afwijking van [artikel 5.6][ref5], zoals dat luidde
      op 31 augustus 2015, de prestatiebeurs mede gedurende 6 jaren verstrekt, indien het betreft een opleiding, genoemd
      in [artikel 7.4, derde lid, tweede volzin, WHW][ref6], zoals dat artikel op 31 augustus 2002 luidde. Het aantal om
      te zetten maanden wordt verminderd met het verschil tussen 360 studiepunten en de studielast die is gebaseerd op
      een geringer aantal maanden, indien een ho-student:

      a. met goed gevolg een examen heeft afgelegd van een deel van een opleiding, en

      b. dat deel ten minste 240 studiepunten bedraagt.

      3 Tot een bij koninklijk besluit te bepalen tijdstip, wordt in afwijking van [artikel 5.6][ref7], zoals dat luidde
      op 31 augustus 2015, de prestatiebeurs mede gedurende 6,5 jaar verstrekt, indien het betreft:

      a. een opleiding als bedoeld in [artikel 18.15 WHW][ref8], zoals dat artikel luidde op 31 augustus 2010, in de
      godgeleerdheid aan een openbare universiteit die, blijkens het onderwijs- en examenprogramma, wordt gevolgd in
      combinatie met het onderwijs in het kader van een opleiding vanwege een kerkgenootschap tot leraar of ambtsdrager
      van dat kerkgenootschap, en

      b. een opleiding als bedoeld in [artikel 18.15 WHW][ref9], zoals dat artikel luidde op 31 augustus 2010, met
      een studielast van 360 studiepunten gericht op een godsdienstig of levensbeschouwelijk ambt aan een bijzondere
      instelling voor wetenschappelijk onderwijs of een opleiding in de zin van [artikel 18.15 WHW][ref10], zoals dat
      artikel luidde op 31 augustus 2010, in de godgeleerdheid aan een op grond van [artikel 6.9 WHW][ref11], zoals dat
      artikel luidde op 31 augustus 2010, aangewezen instelling.

      4 In afwijking van [artikel 5.6][ref12], zoals dat luidde op 31 augustus 2015, wordt de prestatiebeurs gedurende
      6,5 jaar verstrekt aan een ho-student die vóór 1 september 2010 studiefinanciering ontving voor:

      a. het geheel van een bacheloropleiding en een masteropleiding in de godgeleerdheid aan een openbare of bijzondere
      universiteit dat, blijkens het onderwijs- en examenprogramma, wordt gevolgd in combinatie met het onderwijs in het
      kader van een opleiding vanwege een kerkgenootschap tot leraar of ambtsdrager van dat kerkgenootschap, of

      b. een opleiding met een studielast van 360 studiepunten gericht op een godsdienstig of levensbeschouwelijk ambt
      aan een bijzondere instelling voor wetenschappelijk onderwijs of het geheel van een bacheloropleiding en een
      masteropleiding godgeleerdheid binnen het wetenschappelijk onderwijs aan een aangewezen instelling als bedoeld in
      [artikel 6.9 WHW][ref13], zoals dat artikel luidde op 31 augustus 2010.


