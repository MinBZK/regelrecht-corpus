        hoofdstuk: '5'
  - number: 3.16c
    text: |-
      1 Het levenlanglerenkrediet kan worden verstrekt gedurende vier jaar.

      2 De periode, bedoeld in het eerste lid, kan worden verlengd indien de student in de laatste maand van die periode
      een opleiding volgt met een langere nominale duur dan vier jaar en die opleiding onafgebroken blijft volgen. Het
      levenlanglerenkrediet kan ten hoogste zoveel langer worden verstrekt als het verschil tussen 48 maanden en het
      aantal maanden waarop de studielast is gebaseerd op grond van:

      a. [artikel 7.5, eerste lid, onderdelen a tot en met d][ref1];

      b. [artikel 7.5a WHW][ref2];

      c. [artikel 7.5b, eerste lid, WHW][ref3]; of

      d. [artikel 7.5c WHW][ref4].

      3 Indien de ho-student in de laatste maand van de periode, bedoeld in het eerste of tweede lid, een deeltijdse
      opleiding volgt en deze opleiding onafgebroken blijft volgen, wordt de periode met één jaar verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7.5
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7.5a
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel7.5b
      [ref4]: https://wetten.overheid.nl/BWBR0005682#Artikel7.5c
    url: https://wetten.overheid.nl/BWBR0011453/2026-01-01#Artikel3.16c
