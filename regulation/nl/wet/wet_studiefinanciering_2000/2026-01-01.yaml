  - number: '5.9'
    text: |-
      1 De omzetting, bedoeld in [artikel 5.7][ref1], vindt plaats uiterlijk per 1 januari van het kalenderjaar
      volgend op de verzending van de mededeling, bedoeld in [artikel 7.9d WHW][ref2], of de mededeling, bedoeld in
      [artikel 9.5, tweede lid][ref3]. Zo spoedig mogelijk na de omzetting stelt Onze Minister de ho-student daarvan
      in kennis.

      2 Een ho-student die het examen, bedoeld in [artikel 5.7][ref4], met goed gevolg heeft afgelegd aan een instelling
      waarop [artikel 7.9d WHW][ref5] niet van toepassing is, zendt uiterlijk 3 maanden na het verstrijken van de
      diplomatermijn hoger onderwijs, een door de betrokken instelling van hoger onderwijs gewaarmerkte kopie van het aan
      dat examen verbonden diploma aan Onze Minister en dient daarbij een aanvraag in tot omzetting van de prestatiebeurs
      hoger onderwijs. Op die kopie vermeldt de instelling de datum waarop het examen met goed gevolg is afgesloten. De
      omzetting vindt plaats uiterlijk per 1 januari van het kalenderjaar volgend op de aanvraag.

      3 Het tweede lid is van overeenkomstige toepassing op de omzetting van de prestatiebeurs hoger onderwijs ingevolge
      [artikel 5.7, zesde lid][ref6].


