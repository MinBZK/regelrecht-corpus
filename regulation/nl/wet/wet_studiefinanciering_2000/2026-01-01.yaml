        paragraaf: '2.4'
  - number: '4.17'
    text: |-
      Deze paragraaf is uitsluitend van toepassing op mbo-studenten die zijn ingeschreven voor het volgen van een
      opleiding buiten Nederland als bedoeld in [artikel 2.13a][ref1] en waarvan Onze Minister heeft vastgesteld dat deze
      wordt aangemerkt als een opleiding niveau 1 of 2.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel2.13a
