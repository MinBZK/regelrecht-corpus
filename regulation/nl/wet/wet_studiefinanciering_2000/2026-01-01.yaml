        paragraaf: '3.7'
  - number: '3.28'
    text: |-
      Onverminderd [artikel 3.27, eerste lid][ref1], kan de student uit eigen beweging het verzoek aan RSR doen tot
      stopzetting van het reisproduct.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel3.27
    url: https://wetten.overheid.nl/BWBR0011453/2026-01-01#Artikel3.28
