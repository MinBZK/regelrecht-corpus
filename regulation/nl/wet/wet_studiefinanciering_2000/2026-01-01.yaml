  - number: '1.2'
    text: |-
      Voor de toepassing van het bepaalde bij of krachtens deze wet is bepalend de toestand op de eerste dag van de
      maand, tenzij anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0011453/2026-01-01#Artikel1.2
  - number: '1.3'
    text: |-
      Aan welke voorwaarden een aanvraag moet voldoen, kan bij ministeriële regeling worden bepaald. In ieder geval wordt
      daarbij bepaald dat de aanvrager zijn burgerservicenummer of onderwijsnummer verstrekt.
    url: https://wetten.overheid.nl/BWBR0011453/2026-01-01#Artikel1.3
  - number: '1.5'
    text: |-
      1 Voor het normbedrag voor een uitwonende student komt in aanmerking de student die voldoet aan de volgende
      verplichtingen:

      a. de student woont op het adres waaronder hij in de basisregistratie personen staat ingeschreven, en

      b. het woonadres van de student is niet het adres waaronder zijn ouders of een van hen in de basisregistratie
      personen staat of staan ingeschreven.

      2 Op een student die ingevolge de [artikelen 2.13a][ref1] of [2.14][ref2] in aanmerking komt voor
      studiefinanciering voor een opleiding buiten Nederland is het eerste lid, onderdeel a, niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel2.13a
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel2.14
    url: https://wetten.overheid.nl/BWBR0011453/2026-01-01#Artikel1.5
