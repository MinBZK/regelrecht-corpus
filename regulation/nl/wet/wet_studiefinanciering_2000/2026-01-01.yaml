  - number: '2.4'
    text: |-
      Voor studiefinanciering kan een mbo-student in aanmerking komen die is ingeschreven aan:

      a. een instelling als bedoeld in [artikel 1.1.1 WEB][ref1], voor zover het een uit 's Rijks kas bekostigde
      beroepsopleiding betreft, of

      b. een instelling die ten aanzien van de beroepsopleiding het in [artikel 1.4.1 WEB][ref2] bedoelde recht heeft
      verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1.1.1
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel1.4.1
