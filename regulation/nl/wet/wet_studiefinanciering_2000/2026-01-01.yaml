  - number: '4.23'
    text: |-
      Voor zover deze afdeling daarin niet voorziet, alsmede indien noodzakelijk, kunnen in afwijking van het in deze
      afdeling bepaalde bij ministeriële regeling regels worden vastgesteld ten behoeve van een goede uitvoering van
      deze afdeling.
    url: https://wetten.overheid.nl/BWBR0011453/2026-01-01#Artikel4.23
  - number: '5.1'
    text: |-
      Een ho-student komt voor zover wordt voldaan aan de van toepassing zijnde voorwaarden in aanmerking voor
      studiefinanciering in de vorm van een prestatiebeurs, inhoudende:

      a. een basisbeurs;

      b. een aanvullende beurs;

      c. een reisvoorziening; en

      d. een toeslag eenoudergezin.
    url: https://wetten.overheid.nl/BWBR0011453/2026-01-01#Artikel5.1
  - number: '5.2'
    text: |-
      1 De prestatiebeurs hoger onderwijs wordt eenmalig aan een ho-student verstrekt gedurende 4 jaar, vermeerderd met:

      a. eenmalig het aantal maanden dat het resultaat is van het aantal studiepunten, genoemd in de
      [artikelen 7.5, eerste lid, onderdeel d][ref1], [7.5b, eerste lid][ref2] en [7.5c, tweede en vierde lid WHW][ref3],
      gedeeld door vijf, indien een student is ingeschreven aan een in de betreffende artikelleden genoemde
      masteropleiding in het hoger beroepsonderwijs;

      b. eenmalig het aantal maanden dat het resultaat is van het aantal studiepunten, genoemd in de
      [artikelen 7.5a][ref4] en [7.5c, tweede tot en met vijfde lid, WHW][ref5] minus zestig en gedeeld door vijf, indien
      een ho-student is ingeschreven aan een in de betreffende artikelleden genoemde opleiding in het wetenschappelijk
      onderwijs.

      2 In afwijking van het eerste lid, wordt de aanvullende beurs in de eerste 5 maanden waarvoor aanspraak op
      studiefinanciering bestaat, verstrekt in de vorm van een gift.

      3 De basislening, aanvullende lening en het collegegeldkrediet kunnen worden verstrekt gedurende de periode waarin
      aanspraak kan worden gemaakt op de prestatiebeurs hoger onderwijs.

      4 Gedurende 36 maanden na de periode, bedoeld in het eerste lid, kan het collegegeldkrediet worden verstrekt en
      kan daarnaast studiefinanciering worden verstrekt in de vorm van een lening. Het bedrag van de lening, bedraagt in
      afwijking van de [artikelen 3.1, vierde lid][ref6], [3.3][ref7], [3.13][ref8] en [3.18][ref9] naar de maatstaf van
      1 januari 2014 per maand € 894,51 . In de eerste 12 maanden kan tevens een reisvoorziening worden verstrekt in de
      vorm van een prestatiebeurs.

      5 Op aanvraag kan een ho-student als bedoeld in [artikel 3.5][ref10] gedurende de 36 maanden, bedoeld in het vierde
      lid, tevens in aanmerking komen voor een lening ter grootte van het bedrag, bedoeld in artikel 3.5, tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7.5
