  - number: '6.15'
    text: |-
      Indien een debiteur gedurende een kalenderjaar op grond van zijn draagkracht minder heeft betaald dan de
      termijnbetaling, wordt zijn termijnbetaling opnieuw vastgesteld per 1 januari van het jaar daaropvolgend. De
      gewijzigde termijnbetaling wordt vastgesteld op basis van het resterende aantal maanden van de aflosfase.
    url: https://wetten.overheid.nl/BWBR0011453/2026-01-01#Artikel6.15
  - number: '6.16'
    text: |-
      1 De schuld die resteert bij het einde van de aflosfase, gaat op dat ogenblik teniet.

      2 De schuld die resteert bij het overlijden van de debiteur, gaat op dat ogenblik teniet.
    url: https://wetten.overheid.nl/BWBR0011453/2026-01-01#Artikel6.16
  - number: '6.17'
    text: |-
      1 Op het ogenblik van beëindiging van het recht op studiefinanciering van een student wordt zijn schuld, ontstaan
      in het kader van de toepassing van deze wet, van rechtswege omgezet in een lening.

      2 Indien na beëindiging van het recht op studiefinanciering van een student door een beschikking op grond
      van [artikel 7.1][ref1] een vordering ontstaat van Onze Minister, wordt die vordering omgezet in een lening
      op de eerste dag van de maand na de herziening. Bij de berekening van de rente voor die vordering wordt het
      rentepercentage gehanteerd dat geldt met ingang van 1 januari volgend op het kalenderjaar waarin de student
      is opgehouden student te zijn. Indien de omzetting plaatsvindt in het kalenderjaar waarin de student ophoudt
      student te zijn, wordt het rentepercentage gehanteerd dat geldt met ingang van 1 januari van dat kalenderjaar.
      [Artikel 6.4, derde lid, laatste volzin][ref2], is bij de berekening van rente van overeenkomstige toepassing.

      3 In afwijking van het eerste en tweede lid wordt een schuld uit een lening en een schuld, ontstaan door de
      toepassing van [artikel 3.27, tweede lid][ref3], niet omgezet.

      4 De in het eerste of tweede lid bedoelde lening wordt rentedragend met ingang van het tijdstip van de daar
      bedoelde omzetting.


