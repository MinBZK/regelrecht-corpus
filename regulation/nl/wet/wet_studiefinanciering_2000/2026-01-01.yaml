    text: |-
      Op een studerende aan wie tot 1 oktober 1986 op grond van een onderwijswet een rijksstudietoelage werd toegekend
      onafhankelijk van het inkomen van de ouders of een van hen, is met ingang van 1 oktober 1986 [hoofdstuk II][ref1]
      uitgezonderd [paragraaf 2 van titel 3 van de Wet op de studiefinanciering][ref2], zoals dat luidde op 31 augustus
      2000, van overeenkomstige toepassing tot het moment waarop hij de voor 1 oktober 1986 aangevangen studie heeft
      voltooid dan wel gestaakt.


