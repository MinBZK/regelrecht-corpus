  - number: 12.0g
    text: |-
      Op een studerende van 18 jaren of ouder aan wie tot 1 oktober 1986 op grond van een onderwijswet een
      rijksstudietoelage werd toegekend voor het volgen van wetenschappelijk onderwijs of hoger beroepsonderwijs dan
      wel op een studerende van 21 jaren of ouder aan wie een soortgelijke rijksstudietoelage werd toegekend voor het
      volgen van overig voortgezet onderwijs, is met ingang van 1 oktober 1986 [hoofdstuk II][ref1] met uitzondering van
      [artikel 8 van de Wet op de studiefinanciering][ref2], zoals dat luidde op 31 augustus 2000, van overeenkomstige
      toepassing tot het moment waarop hij de voor 1 oktober 1986 aangevangen studie heeft voltooid dan wel gestaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0003955#HoofdstukII
