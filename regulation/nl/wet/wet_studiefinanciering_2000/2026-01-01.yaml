  - number: '5.5'
    text: |-
      De diplomatermijn hoger onderwijs is een periode van 10 jaren. Deze periode vangt aan op de eerste dag van de maand
      waarover voor het eerst studiefinanciering is toegekend voor het volgen van hoger onderwijs.
    url: https://wetten.overheid.nl/BWBR0011453/2026-01-01#Artikel5.5
  - number: '5.7'
    text: |-
      1 Indien een ho-student binnen de diplomatermijn hoger onderwijs met goed gevolg een associate degree-opleiding
      afrondt, wordt de toegekende prestatiebeurs hoger onderwijs voor de duur van de desbetreffende opleiding omgezet in
      een gift. Onverminderd de eerste volzin, wordt de toegekende reisvoorziening volledig omgezet in een gift.

      2 Indien een ho-student binnen de diplomatermijn hoger onderwijs met goed gevolg een opleiding als bedoeld in het
      eerste lid afrondt, wordt de resterende periode van de prestatiebeurs hoger onderwijs die ingevolge het eerste lid
      had kunnen worden omgezet in een gift verstrekt in de vorm van een gift indien hij een andere opleiding in de zin
      van deze wet, of een voltijdse masteropleiding als bedoeld in [artikel 7.3b WHW][ref1] die is geaccrediteerd als
      bedoeld in [artikel 1.1, onderdeel q, WHW][ref2] aanvangt.

      3 Indien een ho-student binnen de diplomatermijn hoger onderwijs met goed gevolg een hbo-bacheloropleiding, hbo-
      masteropleiding of het geheel van een wo-bacheloropleiding en een wo-masteropleiding afrondt, wordt de aan hem
      toegekende prestatiebeurs hoger onderwijs voor de duur van de desbetreffende opleiding omgezet in een gift.
      Onverminderd de eerste volzin, wordt van de toegekende reisvoorziening één jaar extra omgezet in een gift.

      4 Indien een ho-student binnen de diplomatermijn hoger onderwijs met goed gevolg een opleiding als bedoeld
      in het derde lid afrondt, wordt de resterende periode van zijn prestatiebeurs hoger onderwijs verstrekt in
      de vorm van een gift indien hij een andere opleiding in de zin van deze wet, of een voltijdse postinitiële
      masteropleiding als bedoeld in [artikel 7.3b WHW][ref3] aanvangt waaraan accreditatie als bedoeld in
      [artikel 1.1, onderdeel q, WHW][ref4] is verleend.

      5 Met het afronden van een opleiding als bedoeld in het eerste of derde lid wordt gelijkgesteld het afronden
      van een deeltijdse opleiding of een opleiding van de Open Universiteit, voor zover deze opleiding krachtens de
      [WHW][ref5] daarmee gelijk wordt gesteld.

      6 Met het afronden van een opleiding als bedoeld in het derde lid wordt eveneens gelijkgesteld het afronden van een
      wo-bacheloropleiding, voor zover de ho-student een aanvraag heeft ingediend tot gelijkstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7.3b
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel1.1
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel7.3a
      [ref4]: https://wetten.overheid.nl/BWBR0005682#Artikel1.1
      [ref5]: https://wetten.overheid.nl/BWBR0005682
