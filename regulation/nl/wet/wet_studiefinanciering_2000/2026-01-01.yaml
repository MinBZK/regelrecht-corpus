  - number: '4.18'
    text: |-
      1 Studiefinanciering wordt gedurende ten hoogste 4 jaren verstrekt in de vorm van een gift.

      2 Studiefinanciering wordt gedurende 36 maanden na de periode, bedoeld in het eerste lid, verstrekt
      in de vorm van een lening. Het bedrag dat per maand kan worden geleend, bedraagt in afwijking van de
      [artikelen 3.1, vierde lid][ref1], [3.2][ref2], [3.13][ref3] en [3.18][ref4], naar de maatstaf van 1 januari 2004
      € 770,53 . Tevens kan gedurende deze 36 maanden een reisvoorziening worden verstrekt in de vorm van een gift.

      3 Op aanvraag kan een mbo-student als bedoeld in [artikel 3.5][ref5], gedurende de periode, bedoeld in het tweede
      lid, tevens in aanmerking komen voor een lening ter grootte van het bedrag van de toeslag eenoudergezin, bedoeld
      in [artikel 3.18][ref6].


