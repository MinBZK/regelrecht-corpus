  - number: '3.1'
    text: |-
      1 Studiefinanciering bestaat voor een opleiding in het beroepsonderwijs uit een basisbeurs, een basislening en een
      aanvullende beurs of aanvullende lening, en kan geheel of gedeeltelijk worden toegekend in de vorm van:

      a. een gift;

      b. een prestatiebeurs; of

      c. een lening.

      2 Studiefinanciering bestaat voor een opleiding in het hoger onderwijs uit een basisbeurs, een basislening, een
      aanvullende beurs of aanvullende lening en collegegeldkrediet, en kan geheel of gedeeltelijk worden toegekend in de
      vorm van:

      a. een gift;

      b. een prestatiebeurs; of

      c. een lening.

      3 Indien een student geen aanspraak heeft op studiefinanciering als bedoeld in het eerste of tweede lid bestaat
      studiefinanciering uit levenlanglerenkrediet.

      4 De hoogte van de studiefinanciering wordt vastgesteld op basis van een budget voor een kalendermaand.

      5 In afwijking van het vierde lid kan de hoogte van de studiefinanciering ook worden vastgesteld op een
      tegemoetkoming in de kosten van de toegang tot het onderwijs.
    url: https://wetten.overheid.nl/BWBR0011453/2026-01-01#Artikel3.1
  - number: '3.2'
    text: |-
      1 Het budget voor een mbo-student voor een kalendermaand is het totaal van:

      a. een normbedrag voor de kosten van levensonderhoud,

      b. een tegemoetkoming in de kosten van het lesgeld, en

      c. een reisvoorziening.

      2 Dit budget kan worden verhoogd met een toeslag voor een eenoudergezin ingevolge [artikel 3.5][ref1].

      3 De tegemoetkoming in de kosten van het lesgeld wordt voor een mbo-student vastgesteld op een twaalfde deel van
      het op grond van [artikel 5, tweede lid, van de Les- en cursusgeldwet][ref2] geldende bedrag van het lesgeld.
      Het bedrag van de maximale aanvullende beurs, bedoeld in de [artikelen 3.13, eerste lid][ref3], [3.16][ref4] en
      [3.18][ref5], wordt voor een mbo-student verhoogd met het bedrag van de tegemoetkoming.

      4 De tegemoetkoming, bedoeld in het derde lid, wordt niet toegekend voor het studiejaar waarin de mbo-student de
      leeftijd van 18 jaren bereikt.

      5 In afwijking van het eerste lid bestaat het budget voor een mbo-student die in aanmerking komt voor
      levenlanglerenkrediet alleen uit dat krediet.

      6 De bedragen zijn opgenomen in [artikel 3.18][ref6].


