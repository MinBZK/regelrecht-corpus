    text: |-
      [Artikel 3.9][ref1] is van overeenkomstige toepassing op de bepaling van de veronderstelde ouderlijke bijdrage voor
      ho-studenten, met dien verstande dat:

      a. voor de vrije voet, bedoeld in [artikel 3.9, tweede lid, tweede volzin][ref2], naar de maatstaf van 1 januari
      2014 een bedrag wordt gelezen gelijk aan € 15.000 ;

      b. voor de vrije voet, bedoeld in [artikel 3.9, tweede lid, laatste volzin][ref3], naar de maatstaf van 1 januari
      2014 een bedrag wordt gelezen gelijk aan € 19.004 ; en

      c. voor het bruto kortingsbedrag op jaarbasis, bedoeld in [artikel 3.9, derde lid][ref4], een percentage
      wordt gelezen van 13,6% van het verschil tussen het toetsingsinkomen in het peiljaar en de vrije voet in het
      toekenningsjaar.


