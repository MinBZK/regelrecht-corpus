  - number: 10a.2
    text: |-
      1 Een debiteur die voor het studiejaar 2009–2010 voor het eerst studiefinanciering ontving en voor wie op
      31 december 2011 nog geen aflosfase is aangevangen, kan, op aanvraag, zijn schuld aflossen op grond van
      [paragraaf 6.1][ref1], waarbij de debiteur verzoekt dat de schuld wordt aangemerkt als:

      a. een lening beroepsonderwijs als bedoeld in [artikel 6.1, tweede lid][ref2], of;

      b. een lening hoger onderwijs als bedoeld in[ artikel 6.1, tweede lid][ref3], uitsluitend voor zover het een
      debiteur betreft als bedoeld in[ artikel 12.14, vijfde lid][ref4].

      2 Een debiteur dient een aanvraag als bedoeld in het eerste lid uitsluitend voor de aanvang van zijn aflosfase in.

      3 Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de goede uitvoering van het eerste
      lid.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Hoofdstuk6
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel6.1
