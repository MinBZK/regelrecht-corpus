  - number: '12.14'
    text: |-
      1 Op een ho-student die vóór 1 september 2015 stond ingeschreven aan een bacheloropleiding, masteropleiding of
      ongedeelde opleiding of die onderwijs volgde volgend op een opleiding gericht op een levensbeschouwelijk ambt of
      beroep als bedoeld in [artikel 7.5c, derde lid, WHW][ref1], en die studiefinanciering toegekend heeft gekregen voor
      een opleiding in het hoger onderwijs, blijven de volgende artikelen, zoals die luidden op 31 augustus 2015, voor de
      nominale duur van die opleiding van toepassing:

      a. van [hoofdstuk 1][ref2], de [artikelen 1.1][ref3] en [1.5][ref4];

      b. van [hoofdstuk 2][ref5], de [artikelen 2.13, eerste lid][ref6], [2.16, tweede lid][ref7], en [2.17][ref8];

      c. van [hoofdstuk 3][ref9], de [artikelen 3.1, eerste en tweede lid][ref10], [3.6][ref11], en
      [paragraaf 3.3][ref12], met uitzondering van [artikel 3.10, tweede lid][ref13]; en

      d. [hoofdstuk 5][ref14], met uitzondering van [artikel 5.9, eerste lid][ref15], en
      [artikel 5.16, derde lid][ref16], waarbij voor «prestatiebeurs hoger onderwijs» wordt gelezen: prestatiebeurs;

      e. van [hoofdstuk 9][ref17], de [artikelen 9.1b][ref18], [9.9][ref19] en [9.9a][ref20].

      2 In afwijking van [artikel 3.18][ref21] gelden voor de thuiswonende onderscheidenlijk uitwonende ho-student die
      overeenkomstig het eerste lid studiefinanciering toegekend heeft gekregen de volgende bedragen per maand, naar de
      maatstaf van 1 januari 2014:










                    *thuiswonende*


                    *uitwonende*






                    a. maandbedrag als bedoeld in overzicht 1 van [artikel 3.18][ref22]


                    € 633,44



                    € 833,22





                    b. basisbeurs als bedoeld in overzicht 2 van [artikel 3.18][ref23]


                    € 100,25



                    € 279,14





                    c. maximale aanvullende beurs of lening als bedoeld in overzicht 2 van [artikel 3.18][ref24]


                    € 237,46



                    € 258,35





                    d. basislening als bedoeld in overzicht 2 van [artikel 3.18][ref25]


                    € 295,73



                    € 295,73







      3 [Artikel 6.2a][ref26] is niet van toepassing op het afronden van een opleiding waarvoor de debiteur
      overeenkomstig het eerste lid studiefinanciering toegekend heeft gekregen.

      4 Voor de debiteur met een schuld uit een lening die is ontstaan door verstrekking van studiefinanciering
      overeenkomstig het eerste lid, wordt de lening aangemerkt als een lening beroepsonderwijs als bedoeld in
      [artikel 6.1, tweede lid][ref27], tenzij [artikel 10a.1][ref28] van toepassing is.

      5 Indien een debiteur als bedoeld in het vierde lid ingevolge de [Wet studievoorschot hoger onderwijs][ref29] geen
      basisbeurs toegekend heeft gekregen voor een masteropleiding of voor onderwijs volgend op een opleiding gericht op
      een levensbeschouwelijk ambt of beroep als bedoeld in [artikel 7.5c, derde lid, WHW][ref30], kan de lening worden
      aangemerkt als een lening hoger onderwijs als bedoeld in [artikel 6.1, tweede lid][ref31], indien de debiteur vóór
      aanvang van de aflosfase, maar na 31 december 2016, daartoe een aanvraag indient.

      6 Bij ministeriële regeling kunnen nadere regels worden gesteld met het oog op een goede uitvoering van dit
      artikel.


