      1 In dit artikel wordt onder tegemoetkoming begrepen: een tegemoetkoming van Onze Minister, niet zijnde
      studiefinanciering in de zin van [artikel 3.1][ref1], in verband met het volgen van hoger onderwijs in een periode
      waarin een ho-student ingevolge de [Wet studievoorschot hoger onderwijs][ref2] geen aanspraak kon maken op een
      basisbeurs.

      2 Voor een tegemoetkoming komt in aanmerking, degene die:

      a. in de periode van 1 september 2015 tot en met 31 augustus 2023 ingevolge de
      [Wet studievoorschot hoger onderwijs][ref3] geen aanspraak kon maken op een basisbeurs;

      b. gedurende de periode, bedoeld in onderdeel a, ten minste twaalf maanden aanspraak maakte op studiefinanciering
      als bedoeld in [artikel 3.1, tweede lid][ref4], niet zijnde het collegegeldkrediet; en

      c. binnen de diplomatermijn hoger onderwijs of, indien hij geen studiefinanciering heeft aangevraagd, binnen tien
      jaar nadat hij zich voor het eerst heeft ingeschreven voor het hoger onderwijs, met goed gevolg een opleiding als
      bedoeld in [artikel 5.7][ref5] heeft afgerond.

      3 De tegemoetkoming bedraagt € 29,92  per maand voor iedere maand binnen de periode, genoemd in het tweede lid,
      onderdeel a, dat de rechthebbende op een tegemoetkoming aanspraak maakte op studiefinanciering, niet zijnde het
      collegegeldkrediet, tot een maximum van de periode, genoemd in [artikel 5.2, eerste lid][ref6], en indien van
      toepassing, vermeerderd met de periode, genoemd in [artikel 5.2b, eerste of tweede lid][ref7].

      4 In afwijking van het derde lid wordt, indien van toepassing, voor de periode, genoemd in
      [artikel 5.2, eerste lid][ref8], gelezen: de duur, genoemd in [artikel 5.7, eerste of derde lid][ref9].

      5 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over de uitvoering van dit
      artikel en worden in ieder geval regels gesteld over:

      a. de wijze van verstrekking van de tegemoetkoming;

      b. in welke gevallen de tegemoetkoming op aanvraag dan wel ambtshalve wordt toegekend.

      6 Onze Minister past het bedrag, genoemd in het derde lid, overeenkomstig [artikel 11.1][ref10] aan.

      7 [Artikel 1.7][ref11] is van overeenkomstige toepassing met dien verstande dat voor student wordt gelezen: de
      rechthebbende op een tegemoetkoming.


