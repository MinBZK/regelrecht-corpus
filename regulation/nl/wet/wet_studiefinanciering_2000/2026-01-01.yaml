  - number: '9.2'
    text: |-
      1 Een ieder is verplicht aan Onze Minister of aan een daartoe door of vanwege Onze Minister aangewezen persoon of
      instantie desgevraagd de ten behoeve van de uitvoering van deze wet benodigde inlichtingen over zichzelf te geven.

      2 De inlichtingen worden verstrekt binnen een door Onze Minister of door een in het eerste lid bedoelde persoon of
      instantie te stellen redelijke termijn.

      3 Inlichtingen over zichzelf, voor zover zij kunnen leiden tot de toekenning van minder studiefinanciering of
      tot verhoging van het bedrag van de termijnbetalingen worden steeds ongevraagd en schriftelijk verstrekt door de
      student onderscheidenlijk door de debiteur, onmiddellijk na het bekend worden van die gegevens. De inlichtingen,
      bedoeld in de eerste volzin, omvatten niet het doorgeven van een wijziging van het adres als bedoeld in de
      [Wet basisregistratie personen][ref1].

      4 Onze Minister kan bepalen dat de inlichtingen, bedoeld in het eerste tot en met het derde lid, worden verstrekt
      op een bij ministeriële regeling vast te stellen wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0033715
    url: https://wetten.overheid.nl/BWBR0011453/2026-01-01#Artikel9.2
    references:
      - id: ref1
        bwb_id: BWBR0033715
  - number: '9.3'
    text: |-
      Een studentendecaan aan een op grond van de [WHW][ref1] uit 's Rijks kas bekostigde instelling voor hoger onderwijs
      kan zich verschonen betreffende hetgeen een ho-student aan hem heeft toevertrouwd:

      a. in afwijking van [artikel 5:17 van de Algemene wet bestuursrecht][ref2] bij de verplichting tot inzage van
      gegevens en bescheiden en het verstrekken van inlichtingen, en

      b. in afwijking van [artikel 8:33, eerste lid, van de Algemene wet bestuursrecht][ref3] bij de behandeling van een
      beroep of hoger beroep tegen een besluit, genomen op grond van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0005682
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel517
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel833
