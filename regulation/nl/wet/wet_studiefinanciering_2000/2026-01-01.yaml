  - number: '1.7'
    text: |-
      1 Onze Minister gebruikt het burgerservicenummer of onderwijsnummer van een student of debiteur ter zake van de
      uitvoering van deze wet slechts:

      a. in contacten met die student of debiteur,

      b. in contacten met personen en instanties voor zover deze zelf gemachtigd zijn tot het opnemen van het
      burgerservicenummer of onderwijsnummer in een persoonsregistratie,

      c. om de gegevens van die student of debiteur te vergelijken met de gegevens die over hem zijn opgenomen in het
      register onderwijsdeelnemers, bedoeld in [artikel 4 van de Wet register onderwijsdeelnemers][ref1], voor zover dat
      noodzakelijk is voor de uitvoering van deze wet, en

      d. in contacten met de toezichthouders, bedoeld in [artikel 9.1a][ref2].

      2 Het burgerservicenummer of onderwijsnummer van de partner of ouder van een student of debiteur kan ter zake van
      de uitvoering van deze wet slechts worden gebruikt in contacten met die partner of ouder of met de desbetreffende
      student of debiteur, alsmede, voor zover het betreft de controle op de rechtmatigheid, in contacten met personen en
      instanties voor zover deze zelf gemachtigd zijn tot het opnemen van het burgerservicenummer of onderwijsnummer in
      een persoonsregistratie.


      [ref1]: https://wetten.overheid.nl/BWBR0042012#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel9.1a
