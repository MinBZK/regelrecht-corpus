  - number: 2.7a
    text: |-
      1 Een mbo-student aan een opleiding niveau 3 of 4 heeft geen aanspraak op studiefinanciering voor beroepsonderwijs:

      a. indien hij na het verstrijken van zijn aanspraak op prestatiebeurs beroepsonderwijs gedurende 36 maanden een
      lening heeft genoten, of

      b. indien er 10 jaren verstreken zijn met ingang van de maand waarover voor het eerst studiefinanciering in de zin
      van de [paragrafen 4.1.2][ref1] of [4.2.3][ref2] is toegekend voor het volgen van beroepsonderwijs of op grond van
      de [Wet studiefinanciering BES][ref3] is toegekend voor het volgen van beroepsonderwijs aan een opleiding niveau 3
      of 4.

      2 In afwijking van het eerste lid, onderdeel b, wordt, indien [artikel 4.14, eerste lid][ref4], toepassing vindt,
      de termijn van 10 jaren, genoemd in het eerste lid, onderdeel b, verlengd met de duur van de in dat artikel
      bedoelde bijzondere omstandigheden.

      3 In afwijking van het eerste lid, onderdeel b, wordt, indien [artikel 4.14, tweede lid][ref5], toepassing vindt,
      de termijn van 10 jaren, genoemd in het eerste lid, onderdeel b, verlengd met 5 jaren.


