  - number: 10a.11
    text: |-
      1 Bij de bepaling van de draagkracht van de debiteur wordt geen rekening gehouden met het inkomen van de partner
      indien een van beiden hiertoe een aanvraag indient.

      2 Voor ieder jaar dat op grond van de toepassing van het eerste lid geen rekening wordt gehouden met het inkomen
      van de partner van de debiteur wordt de aflosfase verlengd met een jaar.
    url: https://wetten.overheid.nl/BWBR0011453/2026-01-01#Artikel10a.11
  - number: 10a.12
    text: |-
      Indien de partner van de debiteur ook een debiteur is en op beide debiteuren hoofdstuk 10a van toepassing is,
      wordt zijn draagkracht eerst aangewend voor de eigen termijnbetaling. Op het bedrag dat aan draagkracht resteert is
      [artikel 10a.10, tweede lid][ref1], van overeenkomstige toepassing.


