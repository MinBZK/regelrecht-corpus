  - number: 3.16f
    text: |-
      In afwijking van de [artikelen 3.16a, tweede lid][ref1], en [3.16d, eerste lid][ref2], kan een student die een
      vergoeding als bedoeld in [artikel 7.49a van de WHW][ref3] betaalt voor het gebruikmaken van een educatieve module
      of premaster met een studielast van minder dan 60 studiepunten, Onze Minister verzoeken om de hoogte van het
      collegegeldkrediet of levenlanglerenkrediet dat hij per maand ontvangt, gelijk te stellen aan de vergoeding die hij
      naar rato per 5 studiepunten betaalt.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel3.16a
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel3.16d
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel7.49a
