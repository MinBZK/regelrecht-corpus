  - number: '3.30'
    text: |-
      Ten behoeve van het reizen tussen Waddeneilanden en het vaste land kan Onze Minister met de gemeenten van deze
      eilanden een overeenkomst sluiten over een aanvullende voorziening die deze gemeenten aan bepaalde groepen
      studenten verstrekken.
    url: https://wetten.overheid.nl/BWBR0011453/2026-01-01#Artikel3.30
  - number: '4.1'
    text: |-
      Deze paragraaf is uitsluitend van toepassing:

      a. op mbo-studenten die in Nederland een opleiding niveau 1 of 2 volgen, en

      b. op mbo-studenten die in Nederland een beroepsopleiding volgen en die voor 1 augustus 2005 voor het volgen van
      beroepsonderwijs studiefinanciering ontvingen.
    url: https://wetten.overheid.nl/BWBR0011453/2026-01-01#Artikel4.1
  - number: '4.2'
    text: Studiefinanciering wordt verstrekt in de vorm van een gift of een lening.
    url: https://wetten.overheid.nl/BWBR0011453/2026-01-01#Artikel4.2
  - number: '4.3'
    text: |-
      1 De studiefinanciering van de mbo-student die zonder geldige reden niet aan het onderwijs heeft deelgenomen
      gedurende een aaneengesloten periode van ten minste 5 weken, bestaat met uitzondering van de reisvoorziening geheel
      uit een lening met ingang van de eerste dag van de maand volgend op de maand waarin de afwezigheid zonder geldige
      reden aanving. De periode van 5 weken wordt verlengd met de weken waarin vanwege vakantie geen onderwijs werd
      verzorgd.

      2 In afwijking van het eerste lid kan bij ministeriële regeling worden bepaald dat voor soorten van
      beroepsonderwijs het eerste lid van overeenkomstige toepassing is, indien een mbo-student in een of meer
      onderwijseenheden zonder geldige reden niet aan het onderwijs heeft deelgenomen.

      3 Uitsluitend de in [artikel 8.1.7, negende lid, WEB][ref1] genoemde redenen voor afwezigheid zijn geldige redenen.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8.1.7
    url: https://wetten.overheid.nl/BWBR0011453/2026-01-01#Artikel4.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: 8.1.7
  - number: '4.4'
    text: |-
      [Artikel 4.3][ref1] is niet van toepassing met ingang van de eerste dag van de maand volgend op de maand waarin de
      mbo-student weer aan het onderwijs is gaan deelnemen, voor zover die studiefinanciering niet reeds mede op grond
      van een andere bepaling dan dit artikel, de vorm van een lening had. Voorwaarde voor de toepassing van de vorige
      volzin is dat de mbo-student aan het onderwijs is gaan deelnemen binnen 8 weken na de aanvang van de periode van
      5 weken. De periodes van 5 en 8 weken worden verlengd met de weken waarin vanwege vakantie geen onderwijs werd
      verzorgd.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel4.3
    url: https://wetten.overheid.nl/BWBR0011453/2026-01-01#Artikel4.4
