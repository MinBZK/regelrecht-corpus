  - number: '3.25'
    text: |-
      1 Het reisproduct is een elektronisch product dat studenten met een reisrecht kunnen koppelen aan een drager.

      2 Bij ministeriële regeling worden dragers als bedoeld in het eerste lid aangewezen en wordt bepaald op welke wijze
      het reisproduct gekoppeld wordt aan de drager.
    url: https://wetten.overheid.nl/BWBR0011453/2026-01-01#Artikel3.25
  - number: '3.26'
    text: |-
      1 Het reisrecht vangt aan op het moment dat de student overeenkomstig [artikel 3.25][ref1] het reisproduct heeft
      gekoppeld aan de drager.

      2 Het reisrecht wordt naar keuze van de student toegekend als weekreisrecht of weekendreisrecht.

      3 Bij ministeriële regeling worden regels gesteld met betrekking tot de wijze van verkrijgen van het reisrecht
      en de omvang van de aan de soorten reisrecht, bedoeld in het tweede lid, verbonden rechten. Daarbij worden tevens
      voorschriften vastgesteld met betrekking tot de wijze waarop en de termijn waarbinnen de student de keuze tussen
      soorten reisrecht dient te maken en met betrekking tot de aanvraag tot herziening door de student van een gemaakte
      keuze in soorten reisrecht.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel3.25
    url: https://wetten.overheid.nl/BWBR0011453/2026-01-01#Artikel3.26
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '3.25'
        hoofdstuk: '3'
        paragraaf: '3.7'
  - number: '3.27'
    text: |-
      1 Het reisproduct wordt door RSR stopgezet op verzoek van Onze Minister of de student op uiterlijk de tiende
      kalenderdag van de maand waarin:

      a. de aanspraak op het reisrecht is beëindigd; of

      b. het reisproduct op grond van [artikel 3.24, tweede of vierde lid][ref1], is vervangen door een reisvoorziening
      in de vorm van geld.

      2 Indien gebruik is gemaakt van het reisproduct na het moment, bedoeld in het eerste lid, aanhef, is degene aan wie
      het reisrecht is toegekend aan Onze Minister per halve kalendermaand een bedrag verschuldigd van, naar de maatstaf
      van 1 januari 2019:

      a. € 75,00  voor zover het de eerste en de tweede halve kalendermaand betreft; en

      b. € 150,00  voor zover het de derde en daaropvolgende halve kalendermaanden betreft.

      3 De eerste helft van een kalendermaand loopt tot en met de vijftiende dag van die maand.

      4 De opbouw van de bedragen, genoemd in het tweede lid, vangt aan op het moment dat sprake is van één van de
      situaties genoemd in het eerste lid, onderdelen a en b, waarbij voor de eerste halve kalendermaand waarin € 75,00
      verschuldigd is uitsluitend wordt gekeken naar het gebruik van het reisproduct tijdens de elfde tot en met de
      vijftiende dag van die maand.

      5 Er is geen bedrag verschuldigd over de halve kalendermaanden waarin geen gebruik gemaakt is van het reisproduct.

      6 Indien een student na het beëindigen van zijn aanspraak op het reisrecht opnieuw een reisrecht toegekend
      heeft gekregen, is na het beëindigen van het laatst toegekende reisrecht wederom sprake van een eerste halve
      kalendermaand, als bedoeld in het tweede lid, onder a.

      7 Het tweede lid is niet van toepassing op een periode waarin het degene aan wie het reisrecht is toegekend,
      aantoonbaar niet kan worden toegerekend dat het reisproduct niet tijdig is stopgezet.

      8 Het reisproduct wordt stopgezet op een bij ministeriële regeling te bepalen wijze.

      9 Bij ministeriële regeling worden nadere regels gesteld met betrekking tot de wijze van beëindigen van het
      reisrecht, en kunnen nadere regels worden gesteld met betrekking tot de wijze waarop en het tijdstip waarvoor de
      niet-toerekenbaarheid, bedoeld in het zevende lid, moet worden aangetoond.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel3.24
    url: https://wetten.overheid.nl/BWBR0011453/2026-01-01#Artikel3.27
