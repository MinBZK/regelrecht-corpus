  - number: 10a.3
    text: |-
      De [artikelen 6.1 tot en met 6.6][ref1], [6.8][ref2], [6.9a][ref3], [6.12][ref4], en [6.14 tot en met 6.17][ref5]
      zijn van overeenkomstige toepassing op debiteuren die onder dit hoofdstuk vallen, waarbij de lening van de debiteur
      wordt aangemerkt als een lening beroepsonderwijs.


