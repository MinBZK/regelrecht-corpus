      hoger onderwijs of een lening die is ontstaan door toekenning van het levenlanglerenkrediet, en aan wie
      levenlanglerenkrediet of studiefinanciering als bedoeld in [artikel 3.1, eerste of tweede lid][ref1], wordt
      toegekend of die student wordt zonder studiefinanciering te ontvangen, kan op bij ministeriële regeling te bepalen
