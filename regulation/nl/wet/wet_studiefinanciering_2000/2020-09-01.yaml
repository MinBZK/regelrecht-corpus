  - number: 3.2.4
    text: |-
      De tegemoetkoming, bedoeld in het derde lid, wordt niet toegekend voor het studiejaar waarin de mbo-student de
      leeftijd van 18 jaren bereikt.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.2
  - number: 3.2.5
    text: |-
      In afwijking van het eerste lid bestaat het budget voor een mbo-student die in aanmerking komt voor
      levenlanglerenkrediet alleen uit dat krediet.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.2
  - number: 3.2.6
    text: |-
      De bedragen zijn opgenomen in [artikel 3.18][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel3
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.5'
  - number: 3.3.1
    text: 'Het budget voor een ho-student voor een kalendermaand is het totaal van:'
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.3
  - number: 3.3.1.a
    text: een normbedrag voor de kosten van levensonderhoud;
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.3
  - number: 3.3.1.b
    text: het collegegeldkrediet; en
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.3
  - number: 3.3.1.c
    text: een reisvoorziening.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.3
  - number: 3.3.2
    text: |-
      Dit budget kan worden verhoogd met een toeslag voor een eenoudergezin ingevolge [artikel 3.5][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel3
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 3.3.3
    text: |-
      In afwijking van het eerste lid bestaat het budget voor een ho-student die in aanmerking komt voor
      levenlanglerenkrediet alleen uit dat krediet.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.3
  - number: 3.3.4
    text: |-
      De bedragen zijn opgenomen in [artikel 3.18][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel3
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.5'
  - number: 3.5.1
    text: |-
      Aan een student zonder partner die een of meer kinderen heeft van jonger dan 18 jaren die niet tot het huishouden
      van een ander behoren, voor wie deze op grond van de [Algemene Kinderbijslagwet][ref1] aanspraak op kinderbijslag
      heeft, wordt een toeslag voor een eenoudergezin toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0002368
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0002368
  - number: 3.5.2
    text: |-
      Het bedrag is opgenomen in [artikel 3.18][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel3
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.5'
  - number: 3.6.1
    text: |-
      De hoogte van de basisbeurs is verschillend voor uit- en thuiswonende mbo-studenten. De bedragen zijn opgenomen
      in [artikel 3.18][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel3
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.6
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.5'
  - number: 3.6.2
    text: Voor een opleiding niveau 1 of 2 maakt een reisvoorziening deel uit van de basisbeurs.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.6
  - number: 3.6.3
    text: |-
      Voor een opleiding niveau 1 of 2 kan de toeslag, bedoeld in [artikel 3.5][ref1], onderdeel uitmaken van de
      basisbeurs.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel3
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.6
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 3.7.1
    text: |-
      Voor studenten aan een opleiding binnen Nederland bestaat de reisvoorziening uit een reisrecht gedurende
      een bepaald deel van de week waarvoor de student geen bedrag of een lager bedrag verschuldigd is aan de
      vervoersbedrijven.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.7
  - number: 3.7.2
    text: |-
      Voor studenten die aanspraak hebben op studiefinanciering voor het volgen van een opleiding buiten Nederland,
      bestaat de reisvoorziening uit het bedrag, bedoeld in [artikel 4.8, eerste lid][ref1], onderscheidenlijk
      [artikel 5.3, eerste lid][ref2]. In afwijking van de eerste volzin kan een student als bedoeld in de eerste volzin
      op aanvraag als reisvoorziening een reisrecht ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel5
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.7
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.1.2
        afdeling: '4.1'
      - id: ref2
        bwb_id: BWBR0011453
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 3.7.3
    text: |-
      Voor studenten aan een opleiding binnen Nederland die een deel van deze opleiding buiten Nederland volgen is het
      tweede lid van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.7
  - number: 3.7.4
    text: |-
      Voor studenten voor wie geen burgerservicenummer kan worden gebruikt in het contact tussen Onze Minister en
      RSR, bestaat de reisvoorziening uit het bedrag, bedoeld in [artikel 4.8, eerste lid][ref1], onderscheidenlijk
      [artikel 5.3, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel5
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.7
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.1.2
        afdeling: '4.1'
      - id: ref2
        bwb_id: BWBR0011453
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 3.7.5
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over de wijze van aanvraag en toekenning van de
      reisvoorziening in geld, bedoeld in het tweede, derde en vierde lid alsmede regels met het oog op een goede
      uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.7
  - number: 3.8.1
    text: |-
      De hoogte van de aanvullende beurs is afhankelijk van het ouderlijk inkomen en wordt berekend ingevolge de
      [artikelen 3.9 tot en met 3.13][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel3
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.8
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: 3.8.2
    text: |-
      Het maximale bedrag van de aanvullende beurs is opgenomen in [artikel 3.18][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel3
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.8
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.5'
  - number: 3.9.1
    text: |-
      Maatstaf voor de bepaling van de veronderstelde ouderlijke bijdrage is het toetsingsinkomen van de afzonderlijke
      ouders van de mbo-student in het peiljaar.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.9
  - number: 3.9.2
    text: |-
      Op het toetsingsinkomen in het peiljaar wordt in mindering gebracht de vrije voet. Deze voet is naar de maatstaf
      van 1 januari 2014 gelijk aan € 16.736,64 . Indien één van de ouders is overleden, geldt voor de andere ouder een
      dubbele vrije voet. Indien een mbo-student die niet geadopteerd is en die als ingezetene in de basisregistratie
      personen is ingeschreven, blijkens de basisregistratie personen slechts één ouder heeft of [artikel 3.14][ref1]
      toepassing heeft gevonden, is de vorige volzin van overeenkomstige toepassing. Indien het in het peiljaar een ouder
      zonder partner betreft als bedoeld in [artikel 2, zesde lid, van de Wet op het kindgebonden budget][ref2] en voor
      hem geen dubbele vrije voet geldt, geldt voor hem in afwijking van de tweede volzin een vrije voet die naar de
      maatstaf van 1 januari 2014 gelijk is aan € 21.204,43 .


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0022751#Artikel2
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.9
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.3'
      - id: ref2
        bwb_id: BWBR0022751
        artikel: '2'
  - number: 3.9.3
    text: |-
      Het bruto kortingsbedrag op jaarbasis is 26% van het verschil tussen het toetsingsinkomen in het peiljaar en de
      vrije voet in het toekenningsjaar.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.9
  - number: 3.9.4
    text: 'Op het bruto kortingsbedrag, bedoeld in het derde lid, worden in mindering gebracht:'
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.9
  - number: 3.9.4.a
    text: |-
      de ingevolge [paragraaf 6.1][ref1] vastgestelde termijnbetalingen over een jaar of, indien dit minder is, de
      berekende draagkracht indien de ouder tevens debiteur is; en


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.9
    references:
      - id: ref1
        bwb_id: BWBR0011453
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 3.9.4.b
    text: |-
      € 363 voor ieder kind dat in het studiejaar dat aanvangt in het jaar voorafgaand aan het
      studiefinancieringstijdvak, onder de werking van [hoofdstuk 4 van de Wet tegemoetkoming onderwijsbijdrage][ref1] en
      schoolkosten of van [artikel 2, derde tot en met vijfde lid, van de Wet op het kindgebonden budget][ref2] valt.


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0022751#Artikel2
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.9
    references:
      - id: ref1
        bwb_id: BWBR0012438
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0022751
        artikel: '2'
  - number: 3.9.5
    text: |-
      Een twaalfde deel van het bedrag dat na de toepassing van het vierde lid resteert, is de berekeningsgrondslag per
      maand voor een ouder van de veronderstelde ouderlijke bijdrage.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.9
  - number: 3.9.6
    text: |-
      Indien een kind waarvoor de aftrek, bedoeld in het vierde lid, onderdeel b, heeft plaatsgevonden, onder de werking
      van deze wet gaat vallen, wordt met ingang van het tijdstip waarop dit kind onder de werking van deze wet gaat
      vallen, de veronderstelde ouderlijke bijdrage, bedoeld in het vijfde lid, opnieuw berekend.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.9
  - number: 3.9.7
    text: |-
      Het zesde lid is niet van toepassing op een mbo-student die uitsluitend een reisvoorziening bedoeld in
      [artikel 4.6b][ref1] toegekend heeft gekregen.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel4
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.9
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.1.2
        afdeling: '4.1'
  - number: 3.9a
    text: |-
      [Artikel 3.9][ref1] is van overeenkomstige toepassing op de bepaling van de veronderstelde ouderlijke bijdrage voor
      ho-studenten, met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel3
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.9a
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: 3.9a.a
    text: |-
      voor de vrije voet, bedoeld in [artikel 3.9, tweede lid, tweede volzin][ref1], naar de maatstaf van 1 januari 2014
      een bedrag wordt gelezen gelijk aan € 15.000 ; en


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel3
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.9a
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: 3.9a.b
    text: |-
      voor de vrije voet, bedoeld in [artikel 3.9, tweede lid, laatste volzin][ref1], naar de maatstaf van 1 januari 2014
      een bedrag wordt gelezen gelijk aan € 19.004 .


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel3
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.9a
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: 3.10.1
    text: |-
      Op aanvraag van de ouders of een van hen of op aanvraag van de student wordt bij toepassing van de
      [artikelen 3.9][ref1] en [3.9a][ref2], indien sprake is van een terugval in inkomen over het eerste of het tweede
      jaar na het peiljaar, uitgegaan van het toetsingsinkomen in dat jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel3
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.10
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.3'
      - id: ref2
        bwb_id: BWBR0011453
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: 3.10.2
    text: |-
      Voor de toepassing van het eerste lid wordt onder een terugval in inkomen verstaan: een vermindering van de som van
      de toetsingsinkomens van de beide ouders tezamen met ten minste 15% ten opzichte van het peiljaar.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.10
  - number: '3.11'
    text: |-
      Voor de toepassing van de [artikelen 3.9][ref1], [3.9a][ref2] en [3.10][ref3] wordt zolang het toetsingsinkomen
      over het peiljaar, het eerste of het tweede jaar na het peiljaar nog niet kan worden bepaald, door Onze Minister
      daarvoor in de plaats gesteld een bedrag dat het desbetreffende toetsingsinkomen zo goed mogelijk benadert.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011453#Artikel3
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.11
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.3'
      - id: ref2
        bwb_id: BWBR0011453
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.3'
      - id: ref3
        bwb_id: BWBR0011453
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: '3.12'
    text: |-
      Indien het na het peiljaar een ouder zonder partner betreft als bedoeld in
      [artikel 2, zesde lid, van de Wet op het kindgebonden budget][ref1], wordt op aanvraag van die ouder of de student
      de hoogte van de vrije voet, bedoeld in [artikel 3.9, tweede lid][ref2], onderscheidenlijk [artikel 3.9a][ref3],
      dienovereenkomstig aangepast.


      [ref1]: https://wetten.overheid.nl/BWBR0022751#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011453#Artikel3
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.12
    references:
      - id: ref1
        bwb_id: BWBR0022751
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0011453
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.3'
      - id: ref3
        bwb_id: BWBR0011453
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: 3.13.1
    text: |-
      De veronderstelde ouderlijke bijdrage is voor een mbo-student de som van de maandbedragen, bedoeld in
      [artikel 3.9, vijfde lid][ref1], en voor een ho-student de som van de maandbedragen die zijn bepaald door
      toepassing van[ artikel 3.9a][ref2]. De veronderstelde ouderlijke bijdrage kan nooit meer bedragen dan de maximale
      aanvullende beurs voor een student.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel3
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.13
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.3'
      - id: ref2
        bwb_id: BWBR0011453
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: 3.13.2
    text: |-
      De aanvullende beurs van een student wordt verminderd met de in het eerste lid bedoelde veronderstelde ouderlijke
      bijdrage. De vermindering is nihil, indien de veronderstelde ouderlijke bijdrage negatief is.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.13
  - number: 3.13.3
    text: |-
      Indien een ouder meer dan één kind heeft dat recht heeft op studiefinanciering, met uitzondering van het kind dat
      tevens valt onder[ artikel 3.9, vierde lid, onderdeel b][ref1], en dat kind met betrekking tot de desbetreffende
      maand een aanvullende beurs heeft aangevraagd, wordt het maandbedrag, bedoeld in het eerste lid, gedeeld door dat
      aantal kinderen.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel3
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.13
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: 3.14.1
    text: |-
      Op aanvraag van een student kan de aan hem toegekende aanvullende lening worden verstrekt in de vorm van een
      aanvullende beurs, indien er sprake is van een langdurig ernstig verstoorde verhouding tussen ouder en student
      of van onvindbaarheid van de ouder. Onder een langdurig ernstig verstoorde verhouding wordt in ieder geval niet
      begrepen een conflict van financiële aard dat verband houdt met de studie.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.14
  - number: 3.14.2
    text: |-
      Indien het eerste lid toepassing vindt, is voor de berekening van de veronderstelde ouderlijke bijdrage van
      de andere ouder aan de student bedoeld in het eerste lid, [artikel 3.9, tweede lid, derde volzin][ref1], van
      overeenkomstige toepassing. De hoogte van de aanvullende beurs van andere kinderen van beide ouders verandert
      hierdoor niet.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel3
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.14
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: 3.14.3
    text: |-
      Bij algemene maatregel van bestuur worden in ieder geval criteria gegeven ter beoordeling van de vraag of sprake
      is van:
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.14
  - number: 3.14.3.a
    text: een situatie als bedoeld in het eerste lid, en
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.14
  - number: 3.14.3.b
    text: de voorwaarden waaronder de toekenning van de aanvraag geschiedt.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.14
  - number: '3.15'
    text: |-
      Op aanvraag wordt een basislening toegekend. De maximale hoogte van de basislening is opgenomen in
      [artikel 3.18][ref1], waarbij verschillende bedragen zijn vastgesteld voor mbo-studenten en ho-studenten.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel3
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.15
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.5'
  - number: '3.16'
    text: |-
      Het verschil tussen het maximale bedrag van de aanvullende beurs en de voor een student berekende aanvullende beurs
      wordt aan hem op aanvraag als een aanvullende lening toegekend.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.16
  - number: 3.16a.1
    text: Het collegegeldkrediet is een lening die aan de ho-student op aanvraag wordt toegekend.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.16a
  - number: 3.16a.2
    text: |-
      Het bedrag dat per maand kan worden geleend bedraagt niet meer dan een twaalfde deel van het feitelijk door
      de ho-student voor een periode van twaalf maanden te betalen bedrag aan collegegeld voor het volgen van hoger
      onderwijs en in totaal ten hoogste vijf maal een twaalfde deel van het volledige wettelijk collegegeld, bedoeld in
      [artikel 7.45, eerste lid, van de WHW][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.16a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
  - number: 3.16a.3
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld over de aanvraag, toekenning, betaling en andere
      uitvoeringsaspecten van het collegegeldkrediet.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.16a
  - number: 3.16b.1
    text: Het levenlanglerenkrediet is een lening die aan een student op aanvraag wordt toegekend.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.16b
  - number: 3.16b.2
    text: 'Het levenlanglerenkrediet wordt slechts verstrekt:'
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.16b
  - number: 3.16b.2.a
    text: |-
      indien de student niet in aanmerking komt voor studiefinanciering als bedoeld in
      [artikel 3.1, eerste of tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel3
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.16b
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 3.16b.2.b
    text: |-
      in geval het krediet wordt gevraagd voor een voltijdse of duale opleiding in het hoger onderwijs en de ho-student
      nog niet de leeftijd van dertig jaren heeft bereikt, die ho-student een hbo-bacheloropleiding als bedoeld in
      [artikel 7.3a, tweede lid, onderdeel b, van de WHW][ref1] of het geheel van een wo-bacheloropleiding en een wo-
      masteropleiding als bedoeld in artikel 7.3a, eerste lid, onderdelen a en b, van de WHW met goed gevolg heeft
      afgesloten; en


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.16b
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
  - number: 3.16b.2.c
    text: voor zover de kosten voor het lesgeld of collegegeld niet door een derde worden vergoed.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.16b
  - number: 3.16b.3
    text: |-
      Bij algemene maatregel van bestuur kunnen gronden worden vastgesteld op basis waarvan een aanvraag gelet op
      terugbetalingsrisico’s kan worden geweigerd.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.16b
  - number: 3.16b.4
    text: |-
      De [hoofdstukken 4][ref1] en[ 5][ref2] zijn niet van toepassing op het levenlanglerenkrediet.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.16b
    references:
      - id: ref1
        bwb_id: BWBR0011453
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0011453
        hoofdstuk: '5'
  - number: 3.16c.1
    text: Het levenlanglerenkrediet kan worden verstrekt gedurende vier jaar.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.16c
  - number: 3.16c.2
    text: |-
      De periode, bedoeld in het eerste lid, kan worden verlengd indien de student in de laatste maand van die periode
      een opleiding volgt met een langere nominale duur dan vier jaar en die opleiding onafgebroken blijft volgen. Het
      levenlanglerenkrediet kan ten hoogste zoveel langer worden verstrekt als het verschil tussen 48 maanden en het
      aantal maanden waarop de studielast is gebaseerd op grond van:
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.16c
  - number: 3.16c.2.a
    text: |-
      [artikel 7.4a, eerste tot en met zevende lid, van de WHW][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.16c
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
  - number: 3.16c.2.b
    text: |-
      [artikel 7.4b, tweede tot en met achtste lid, van de WHW][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.16c
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
  - number: 3.16c.3
    text: |-
      Indien de ho-student in de laatste maand van de periode, bedoeld in het eerste of tweede lid, een deeltijdse
      opleiding volgt en deze opleiding onafgebroken blijft volgen, wordt de periode met één jaar verlengd.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.16c
  - number: 3.16d.1
    text: |-
      Het levenlanglerenkrediet bedraagt per maand niet meer dan een twaalfde deel van het feitelijk door de student voor
      een periode van twaalf maanden te betalen bedrag aan collegegeld of lesgeld voor het volgen van de desbetreffende
      opleiding en in totaal ten hoogste:
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.16d
  - number: 3.16d.1.a
    text: |-
      vijf maal een twaalfde deel van het volledige wettelijk collegegeld, bedoeld in
      [artikel 7.45, eerste lid, van de WHW][ref1], voor een opleiding in het hoger onderwijs;


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.16d
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
  - number: 3.16d.1.b
    text: |-
      vijf maal een twaalfde deel van het lesgeld, bedoeld in [artikel 5, tweede lid, van de Les- en cursusgeldwet][ref1],
      voor een opleiding in het beroepsonderwijs; of


      [ref1]: https://wetten.overheid.nl/BWBR0004188#Artikel5
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.16d
    references:
      - id: ref1
        bwb_id: BWBR0004188
        artikel: '5'
  - number: 3.16d.1.c
    text: een in afwijking van de onderdelen a en b bij algemene maatregel van bestuur te bepalen lager maximum.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.16d
  - number: 3.16d.2
    text: |-
      In afwijking van het eerste lid kan aan bij ministeriële regeling vast te stellen groepen studenten een hoger
      bedrag per maand worden toegekend, waarbij het totale levenlanglerenkrediet voor een periode van twaalf maanden
      niet meer bedraagt dan twaalf maal het bedrag, genoemd in het eerste lid, onderdeel a, b of c.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.16d
  - number: 3.16e
    text: |-
      Voor een goede uitvoering van de [artikelen 3.16b tot en met 3.16d][ref1] worden bij ministeriële regeling regels
      vastgesteld over de aanvraag, toekenning, berekening, betaling en andere uitvoeringsaspecten.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel3
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.16e
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: 3.17.1
    text: |-
      Indien een mbo-student in een kalenderjaar meerinkomen heeft, leidt dit tot een vordering van Onze Minister op de
      mbo-student. Meerinkomen is het toetsingsinkomen, verminderd met een vrije voet naar de maatstaf van 1 januari 2011
      van € 13 215,83 .
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.17
  - number: 3.17.3
    text: 'Tot het meerinkomen worden niet gerekend:'
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.17
  - number: 3.17.3.a
    text: |-
      een uitkering op grond van de [Participatiewet][ref1], de [Toeslagenwet][ref2] of de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref3] of de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref4],


      [ref1]: https://wetten.overheid.nl/BWBR0015703
      [ref2]: https://wetten.overheid.nl/BWBR0004043
      [ref3]: https://wetten.overheid.nl/BWBR0004044
      [ref4]: https://wetten.overheid.nl/BWBR0004163
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.17
    references:
      - id: ref1
        bwb_id: BWBR0015703
      - id: ref2
        bwb_id: BWBR0004043
      - id: ref3
        bwb_id: BWBR0004044
      - id: ref4
        bwb_id: BWBR0004163
  - number: 3.17.3.b
    text: de studiefinanciering verstrekt op grond van deze wet en voor zover in deze inkomsten begrepen, en
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.17
  - number: 3.17.3.c
    text: |-
      de belastbare winst uit onderneming, bedoeld in
      [artikel 3.1, tweede lid, onderdeel a, van de Wet inkomstenbelasting 2001][ref1], die in het kalenderjaar waarin
      de mbo-student zijn afsluitend examen behaalt, is verworven, met dien verstande dat een mbo-student hier slechts
      eenmaal voor in aanmerking komt.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.17
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 3.17.4
    text: |-
      Voor iedere maand dat een mbo-student een uitkering ontvangt in de zin van de [Algemene nabestaandenwet][ref1],
      blijft daarvan naar de maatstaf van 1 januari 2014 een bedrag ter grootte van € 324,10  buiten beschouwing.


      [ref1]: https://wetten.overheid.nl/BWBR0007795
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.17
    references:
      - id: ref1
        bwb_id: BWBR0007795
  - number: 3.17.5
    text: |-
      Bij de berekening van het meerinkomen blijft buiten beschouwing inkomen waarvan de mbo-student aantoont dat het
      is verworven over de periode in het kalenderjaar waarin hij zonder onderbreking geen mbo-student was in de zin
      van deze wet of waarin hij heeft afgezien van zijn aanspraak op studiefinanciering. Dit kan slechts de periode
      betreffen:
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.17
  - number: 3.17.5.a
    text: die begint bij de aanvang van het kalenderjaar, of
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.17
  - number: 3.17.5.b
    text: die eindigt bij het einde van het kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.17
  - number: 3.17.6
    text: |-
      Voor de toepassing van het vijfde lid worden de volgende onderdelen van het toetsingsinkomen op verzoek van de mbo-
      student herleid tot maandbedragen door de desbetreffende bedragen te delen door 12:
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.17
  - number: 3.17.6.a
    text: |-
      de belastbare winst uit onderneming, bedoeld in
      [artikel 3.1, tweede lid, onder a van de Wet inkomstenbelasting 2001][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.17
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 3.17.6.b
    text: |-
      de negatieve persoonsgebonden aftrekposten, bedoeld in
      [artikel 3.1, tweede lid, onderdeel g, van de Wet inkomstenbelasting 2001][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.17
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 3.17.6.c
    text: |-
      de persoonsgebonden aftrek, bedoeld in
      [artikel 3.1, tweede lid, onderdeel j, van de Wet inkomstenbelasting 2001][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.17
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 3.17.6.d
    text: |-
      het inkomen uit aanmerkelijk belang, bedoeld in [hoofdstuk 4 van de Wet inkomstenbelasting 2001][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.17
    references:
      - id: ref1
        bwb_id: BWBR0011353
        hoofdstuk: '4'
  - number: 3.17.6.e
    text: |-
      het belastbare inkomen uit sparen en beleggen, bedoeld in [hoofdstuk 5 van de Wet inkomstenbelasting 2001][ref1],
      verminderd met daarin begrepen te conserveren inkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.17
    references:
      - id: ref1
        bwb_id: BWBR0011353
        hoofdstuk: '5'
  - number: 3.17.7
    text: |-
      Indien een mbo-student in een kalenderjaar meerinkomen heeft, is die mbo-student aan Onze Minister een bedrag ter
      grootte van het meerinkomen verschuldigd, met dien verstande dat dit bedrag niet groter kan zijn dan de som van de
      met betrekking tot dat kalenderjaar aan die mbo-student toegekende bedragen aan:
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.17
  - number: 3.17.7.a
    text: basisbeurs,
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.17
  - number: 3.17.7.b
    text: aanvullende beurs,
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.17
  - number: 3.17.7.c
    text: toeslag eenoudergezin, en
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.17
  - number: 3.17.7.d
    text: |-
      voor iedere maand waarin de mbo-student op enig moment beschikte over de reisvoorziening, een bedrag gelijk aan een
      twaalfde deel van de waarde van de reisvoorziening, bedoeld in [artikel 4.8, eerste lid][ref1], vermenigvuldigd met
      het aantal maanden waarover met inachtneming van het vijfde lid het toetsingsinkomen is berekend.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel4
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.17
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.1.2
        afdeling: '4.1'
  - number: 3.17.8
    text: |-
      Over de verschuldigde bedragen, bedoeld in het zevende lid, wordt rente berekend op de voet van de
      [artikelen 6.3, eerste lid][ref1], en [6.4][ref2], met ingang van de eerste dag van de kalendermaand volgend op de
      dag waarop de beschikking terzake is gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel6
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.17
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
      - id: ref2
        bwb_id: BWBR0011453
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 3.17.9
    text: |-
      Indien een mbo-student voor 1 juni van een kalenderjaar aan Onze Minister schriftelijk opgave doet van het bedrag
      aan meerinkomen in het aan dat kalenderjaar voorafgaande kalenderjaar, is het achtste lid op deze mbo-student niet
      van toepassing, voor zover dat bedrag voor die datum door hem is betaald.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.17
  - number: 3.17.10
    text: |-
      De vordering die ontstaat door toepassing van het zevende lid, wordt in mindering gebracht op de met betrekking tot
      dat kalenderjaar aan de mbo-student toegekende prestatiebeurs beroepsonderwijs. Voor zover de prestatiebeurs over
      dat kalenderjaar niet is uitbetaald, wordt de vordering verrekend met die prestatiebeurs. De opgebouwde rente over
      het in mindering gebrachte bedrag gaat teniet.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.17
  - number: 3.17.11
    text: |-
      Een aanvraag van de mbo-student aan Onze Minister om zijn studiefinanciering te beëindigen heeft voor de toepassing
      van het vijfde lid uitsluitend werking indien dat verzoek is ingediend voor 1 juli van het daaropvolgende
      kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.17
  - number: '3.18'
    text: |-
