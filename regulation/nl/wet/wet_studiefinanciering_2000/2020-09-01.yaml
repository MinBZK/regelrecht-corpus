  - number: 12.1a
    text: |-
      Voor mbo-studenten die vóór 1 augustus 2002 onderscheidenlijk voor ho-studenten die vóór 1 september 2002
      studiefinanciering op grond van de [Wet op de studiefinanciering][ref1] of van deze wet ontvingen, geldt in
      afwijking van [artikel 1.5][ref2], zoals dat artikel luidde op 31 december 2011, dat waar de student woont naar de
      omstandigheden wordt beoordeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0003955
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel1
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel12.1a
