    text: |-
      Tot een bij koninklijk besluit te bepalen tijdstip, wordt in afwijking van [artikel 5.6][ref1], zoals dat luidde op
      31 augustus 2015, de prestatiebeurs mede gedurende 6 jaren verstrekt, indien het betreft een opleiding, genoemd in
      [artikel 7.4, derde lid, tweede volzin, van de WHW][ref2], zoals dat artikel op 31 augustus 2002 luidde. Het aantal
      om te zetten maanden wordt verminderd met het verschil tussen 360 studiepunten en de studielast die is gebaseerd op
      een geringer aantal maanden, indien een ho-student:


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel5
