  - number: 4.7.4
    text: |-
      Op aanvraag kan een mbo-student als bedoeld in [artikel 3.5][ref1], gedurende de periode bedoeld in het derde
      lid, tevens in aanmerking komen voor een lening ter grootte van het bedrag van de toeslag eenoudergezin, bedoeld
      in [artikel 3.18][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel3
