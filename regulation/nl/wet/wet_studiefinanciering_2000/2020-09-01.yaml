$id: wet_studiefinanciering_2000
regulatory_layer: WET
publication_date: '2021-08-31'
valid_from: '2020-09-01'
bwb_id: BWBR0011453
url: https://wetten.overheid.nl/BWBR0011453/2020-09-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de Wet op de studiefinanciering te wijzigen als
    uitvloeisel van het regeerakkoord 1998 en van de nota «Flexibele studiefinanciering; een stelsel dat past»; dat
    het voorts wenselijk is de leesbaarheid van de Wet op de studiefinanciering te vergroten; dat het in verband met
    het grote aantal wijzigingen wenselijk is de Wet op de studiefinanciering in te trekken en te vervangen door een
    nieuwe wet;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#ArtikelAanhef
articles:
  - number: 1.1.1
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder: **achterstallige schuld**:
      achterstallige schuld als bedoeld in [artikel 6.8][ref1], **afsluitend examen**: a. voor wat betreft
      [hoofdstuk 4][ref2] het examen, bedoeld in [artikel 7.4.2 van de Wet educatie en beroepsonderwijs][ref3],
      alsmede het daarmee overeenkomende examen van een opleiding buiten Nederland als bedoeld
      in [artikel 2.13a][ref4], b. voor wat betreft [hoofdstuk 5][ref5] het examen, bedoeld in
      [artikel 7.10a van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref6], alsmede het daarmee
      overeenkomende examen van een opleiding buiten Nederland als bedoeld in [artikel 2.14][ref7], **associate
      degree-opleiding**: opleiding als bedoeld in [artikel 7.3a, tweede lid, onderdeel a, van de WHW][ref8], waaraan
      accreditatie als bedoeld in [artikel 1.1, onderdeel q, van de WHW][ref9] is verleend, **bacheloropleiding**:
      opleiding als bedoeld in [artikel 7.3a, eerste lid, onderdeel a, of tweede lid, onderdeel b, van de WHW][ref10],
      die is geaccrediteerd als bedoeld in [artikel 1.1, onderdeel q, van de WHW][ref11], of die de toets nieuwe
      opleiding, bedoeld in artikel 1.1, onderdeel r, van die wet, met positief gevolg heeft ondergaan, **belastbaar
      minimumloon**: belastbaar minimumloon als bedoeld in [artikel 6.1a][ref12], **beroepsonderwijs**: opleiding
      als bedoeld in [artikel 7.2.7, derde lid, van de Wet educatie en beroepsonderwijs][ref13] en als bedoeld in
      [artikel 2.13a][ref14], **collegegeldkrediet**: lening voor betaling van het collegegeld in het hoger onderwijs,
      **debiteur**: degene die zich krachtens [artikel 6.2][ref15] heeft verplicht tot terugbetaling, **diplomatermijn
      beroepsonderwijs**: termijn als bedoeld in [artikel 4.9][ref16], **diplomatermijn hoger onderwijs**: termijn
      als bedoeld in [artikel 5.5][ref17], **hoger beroepsonderwijs**: hoger beroepsonderwijs in de zin van de
      [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref18], **hoger onderwijs**: wetenschappelijk
      onderwijs en hoger beroepsonderwijs als bedoeld in [paragraaf 2.3][ref19] en in [artikel 2.14][ref20], **ho-
      student**: degene die hoger onderwijs volgt, niet zijnde een extraneus, **lening**: rentedragende lening die
      niet kan worden omgezet in een gift, **levenlanglerenkrediet**: lening voor betaling van het lesgeld in het
      beroepsonderwijs of het collegegeld in het hoger onderwijs, **masteropleiding**: opleiding als bedoeld in
      [artikel 7.3a, eerste lid, onderdeel b, of tweede lid, onderdeel c, van de WHW][ref21], die is geaccrediteerd als
      bedoeld in [artikel 1.1, onderdeel q, van de WHW][ref22], of die de toets nieuwe opleiding, bedoeld in artikel
      1.1, onderdeel r, van die wet, met positief gevolg heeft ondergaan, **mbo-student**: degene die beroepsonderwijs
      volgt, **onderwijsnummer**: door Onze Minister uitgegeven persoonsgebonden nummer, toegekend aan een persoon
      aan wie niet van overheidswege een burgerservicenummer is verstrekt, **Onze Minister**: Onze Minister van
      Onderwijs, Cultuur en Wetenschap, **opleiding niveau 1 of 2**: a. entreeopleiding en basisberoepsopleiding
      als bedoeld in [artikel 7.2.2, eerste lid, onderdelen a en b, van de Wet educatie en beroepsonderwijs][ref23],
      en b. opleiding buiten Nederland als bedoeld in [artikel 2.13a][ref24] waarvan Onze Minister
      heeft vastgesteld dat deze wordt aangemerkt als een opleiding niveau 1 of 2, **opleiding
      niveau 3 of 4**: a. vakopleiding, middenkaderopleiding en specialistenopleiding als bedoeld in
      [artikel 7.2.2, eerste lid, onderdelen c, d en e, van de Wet educatie en beroepsonderwijs][ref25], en b. opleiding
      buiten Nederland als bedoeld in [artikel 2.13a][ref26] waarvan Onze Minister heeft vastgesteld dat deze wordt
      aangemerkt als een opleiding niveau 3 of 4, **ouder**: natuurlijke ouder of adoptiefouder in de zin van de
      [artikelen 197 tot en met 232 van Boek 1 van het Burgerlijk Wetboek][ref27], **partner**: partner als bedoeld in
      [artikel 3 van de Algemene wet inkomensafhankelijke regelingen][ref28], **peiljaar**: tweede jaar voorafgaand aan
      het jaar waarin het studiefinancieringstijdvak aanvangt, dan wel het tweede jaar voorafgaand aan het jaar waarvoor
      de draagkracht in de zin van [hoofdstuk 6][ref29] wordt vastgesteld, **prestatiebeurs**: rentedragende lening
      die onder voorwaarden kan worden omgezet in een gift, waarbij de rente teniet gaat, niet zijnde de rentedragende
      lening die niet kan worden omgezet in een gift, **prestatiebeurs beroepsonderwijs**: prestatiebeurs als bedoeld
      in [artikel 4.6a][ref30], **prestatiebeurs hoger onderwijs**: prestatiebeurs als bedoeld in [artikel 5.1][ref31],
      **reisproduct**: elektronisch product dat studenten kunnen laden op een OV-chipkaart wanneer zij beschikken over
      reisrecht, **reisrecht**: recht om te reizen als bedoeld in [artikel 3.7, eerste lid][ref32], **reisvoorziening**:
      voorziening als bedoeld in [artikel 3.7][ref33] en [paragraaf 3.7][ref34], **RSR**: Regisseur Studenten
      Reisrecht, de rechtspersoon die in opdracht van de vervoersbedrijven tot taak heeft de digitale administratie
      van het reisproduct voor studenten op de OV-chipkaart te voeren, **specialistenopleiding**: specialistenopleiding
      als bedoeld in [artikel 7.2.2, eerste lid, onderdeel e, van de Wet educatie en beroepsonderwijs][ref35],
      **student**: ho-student of mbo-student, **studiefinanciering**: door Onze Minister verstrekte toekenning in
      verband met het volgen van een opleiding in het beroepsonderwijs of in het hoger onderwijs waarop uitsluitend
      op grond van deze wet aanspraak bestaat, **studiefinancieringstijdvak**: kalenderjaar of een gedeelte daarvan
      waarop de toekenning van studiefinanciering betrekking heeft, met dien verstande dat deze periode ten minste
      1 kalendermaand is, **studiejaar**: 1°. in het hoger onderwijs: tijdvak dat aanvangt op 1 september van enig
      kalenderjaar en eindigt op 31 augustus daaropvolgend, 2°. in het beroepsonderwijs: tijdvak dat aanvangt op 1
      augustus van enig kalenderjaar en eindigt op 31 juli daaropvolgend, **studiepunt**: eenheid waarin de studielast,
      bedoeld in [artikel 7.4, eerste lid, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref36],
      wordt uitgedrukt, **termijnbetaling**: bedrag als bedoeld in [artikel 6.9][ref37], of als het een debiteur
      betreft op wie [hoofdstuk 10a][ref38] van toepassing is: bedrag als bedoeld in [artikel 10a.6][ref39],
      **thuiswonende deelnemer**: mbo-student die niet een uitwonende mbo-student is, **toetsingsinkomen**: inkomen
      als bedoeld in [artikel 8, eerste en tweede lid, van de Algemene wet inkomensafhankelijke regelingen][ref40],
      met dien verstande dat, behoudens bij de toepassing van artikel [3.17][ref41], voor berekeningsjaar
      wordt gelezen: peiljaar, **uitwonende deelnemer**: mbo-student die voldoet aan de verplichtingen,
      bedoeld in [artikel 1.5][ref42], **veronderstelde ouderlijke bijdrage**: bedrag dat verondersteld wordt
      door de ouders bijgedragen te worden waarmee de aanvullende beurs van de student wordt verminderd,
      **vervoerbedrijf**: rechtspersoon die op grond van een overeenkomst met de Staat als partij of als derde
      verantwoordelijk is voor de uitvoering van het reisrecht, **voltijdse opleiding**: opleiding in de zin
      van de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref43], met uitzondering van deeltijds
      onderwijs, **vreemdeling**: hetgeen daaronder wordt verstaan in de [Vreemdelingenwet 2000][ref44], **WEB**:
      [Wet educatie en beroepsonderwijs][ref45], **wetenschappelijk onderwijs**: wetenschappelijk onderwijs in de zin
      van de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref46], **wettelijk collegegeld**: wettelijk
      collegegeld als bedoeld in [artikel 7.45 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref47],
      **WHW**: [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref48].


