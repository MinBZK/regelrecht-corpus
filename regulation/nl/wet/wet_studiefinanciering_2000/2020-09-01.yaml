  - number: 4.8.1
    text: |-
      Het deel van de prestatiebeurs beroepsonderwijs dat betrekking heeft op het recht op de reisvoorziening, is gelijk
      aan een twaalfde deel van de waarde die daarvoor per student door het vervoerbedrijf aan Onze Minister in rekening
      wordt gebracht. De waarde wordt berekend door de voorlopige vergoeding voor het lopende kalenderjaar te corrigeren
      naar de correctie die de voorlopige vergoeding voor het tweede daaraan voorafgaande kalenderjaar onderging. Dit
      deel van de prestatiebeurs beroepsonderwijs wordt niet uitbetaald of verrekend.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel4.8
  - number: 4.8.2
    text: |-
      Indien de prestatiebeurs beroepsonderwijs niet kan worden omgezet in een gift, wordt de tegenwaarde van de
      reisvoorziening kwijtgescholden over een maand waarover het reisproduct niet op een OV-chipkaart is geladen
      als bedoeld in [artikel 3.26][ref1] of is stopgezet als bedoeld in [artikel 3.27][ref2]. In afwijking van
      [artikel 1.2][ref3] is bepalend de toestand op enig moment van de maand. De over het kwijt te schelden bedrag
      opgebouwde rente gaat dan teniet. De kwijtschelding is niet van toepassing op een maand waarin een vergoeding als
      bedoeld in [artikel 3.7, tweede of vierde lid][ref4], is toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011453#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0011453#Artikel3
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel4.8
    references:
