      Voor de debiteur met een schuld uit een lening die is ontstaan door verstrekking van studiefinanciering
      overeenkomstig het eerste lid, wordt de lening aangemerkt als een lening beroepsonderwijs als bedoeld in
      [artikel 6.1, eerste lid][ref1], tenzij [artikel 10a.1][ref2] van toepassing is.


