      opleiding als bedoeld in [artikel 7.3a, eerste lid, onderdeel a, van de WHW][ref2], en ten aanzien waarvan
      [artikel 18.18 van de WHW][ref3] zoals dat artikel luidde op de dag voorafgaand aan de inwerkingtreding van de wet
      van 4 februari 2010 (Stb. 119) van toepassing is.


