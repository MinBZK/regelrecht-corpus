    text: wat wordt verstaan onder studievertraging in verband met de uitbraak van COVID-19 als bedoeld in het eerste lid;
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel13.1
  - number: 13.1.2.d
    text: in welke gevallen de tegemoetkoming op aanvraag dan wel ambtshalve wordt toegekend; en
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel13.1
  - number: 13.1.2.e
    text: welke gegevens bij een aanvraag worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel13.1
  - number: '13.2'
    text: |-
      De omvang van de tegemoetkoming, bedoeld in [artikel 13.1][ref1], wordt vastgesteld bij ministeriële regeling.
      Daarbij kan in ieder geval aan de hand van het aantal maanden studievertraging onderscheid worden gemaakt tussen
      verschillende groepen studenten.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel13
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel13.2
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '13'
        hoofdstuk: '13'
  - number: '13.3'
    text: Dit hoofdstuk vervalt op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel13.3
  - number: 14.1.1
    text: |-
      De [Wet op de studiefinanciering][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0003955
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel14.1
    references:
      - id: ref1
        bwb_id: BWBR0003955
  - number: 14.1.2
    text: |-
      In afwijking van het eerste lid blijft [hoofdstuk VII van de Wet op de studiefinanciering][ref1] met uitzondering
      van [artikel 119b][ref2] van kracht tot een bij koninklijk besluit te bepalen tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0003955#HoofdstukVII
      [ref2]: https://wetten.overheid.nl/BWBR0003955#Artikel119b
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel14.1
    references:
      - id: ref1
        bwb_id: BWBR0003955
        hoofdstuk: VII
      - id: ref2
        bwb_id: BWBR0003955
        artikel: 119b
  - number: 14.1.3
    text: |-
      In afwijking van het eerste lid blijven de [artikelen 141 tot en met 148 van de Wet op de studiefinanciering][ref1]
      van kracht.


      [ref1]: https://wetten.overheid.nl/BWBR0003955#Artikel141
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel14.1
    references:
      - id: ref1
        bwb_id: BWBR0003955
        artikel: '141'
  - number: '14.2'
    text: 'Deze wet treedt in werking op 1 september 2000, met uitzondering van:'
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel14.2
  - number: 14.2.a
    text: |-
      artikel 13.6 dat voor wat betreft de onderdelen B en C in werking treedt met ingang van de dag na de datum van
      uitgifte van het Staatsblad waarin zij wordt geplaatst en terugwerkt tot en met 1 augustus 2000,
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel14.2
  - number: 14.2.b
    text: |-
      artikel 13.13 dat voor wat betreft onderdeel A in werking treedt met ingang van de dag na de datum van uitgifte van
      het Staatsblad waarin zij wordt geplaatst en terugwerkt tot en met 1 september 1996, en
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel14.2
  - number: 14.2.c
    text: |-
      artikel 13.13 dat voor wat betreft onderdeel B in werking treedt met ingang van de dag na de datum van uitgifte van
      het Staatsblad waarin zij wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel14.2
  - number: '14.3'
    text: 'Deze wet wordt aangehaald als: Wet studiefinanciering 2000.'
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel14.3
