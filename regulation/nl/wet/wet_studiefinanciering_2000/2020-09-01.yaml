      Indien een debiteur als bedoeld in het vierde lid ingevolge de [Wet studievoorschot hoger onderwijs][ref1] geen
      basisbeurs toegekend heeft gekregen voor een masteropleiding of voor onderwijs volgend op een opleiding gericht op
      een levensbeschouwelijk ambt of beroep als bedoeld in [artikel 7.4a, vijfde lid, van de WHW][ref2], kan de lening
      worden aangemerkt als een lening hoger onderwijs als bedoeld in [artikel 6.1, tweede lid][ref3], indien de debiteur
      vóór aanvang van de aflosfase, maar na 31 december 2016, daartoe een aanvraag indient.


      [ref1]: https://wetten.overheid.nl/BWBR0036261
