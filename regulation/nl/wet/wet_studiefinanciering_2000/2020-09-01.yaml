      op grond van [artikel 2.14][ref1], zoals dat luidde onmiddellijk voorafgaand aan het tijdstip waarop artikel
      I, onderdeel A, van de Wet houdende wijziging van de Wet studiefinanciering 2000 met het oog op het wijzigen
      van de criteria voor de toekenning van meeneembare studiefinanciering (Stb. 2019, 20) in werking is getreden,
      blijft artikel 2.14 van toepassing zoals dat luidde onmiddellijk voorafgaand aan het genoemde tijdstip van
      inwerkingtreding zolang de student zonder onderbreking studiefinanciering geniet.


