      Indien een herzieningsbeschikking als bedoeld in
      [artikel 7.1 van de Wet tegemoetkoming onderwijsbijdrage en schoolkosten][ref1], of een beslissing op bezwaar
      daartoe aanleiding geeft, wordt het bedrag aan tegemoetkoming dat teveel is uitbetaald, door de betrokkene
      terugbetaald of met hem verrekend.


