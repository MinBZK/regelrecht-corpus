      De persoon die voorafgaand aan de inwerkingtreding van artikel V, onderdeel A, van de Wet tot wijziging van de
      Wet studiefinanciering 2000 met het oog op het verminderen van het aantal OV-boetes (Kamerstukken ) reeds op grond
      van [artikel 3.27, tweede lid][ref1], een bedrag verschuldigd was, wordt voor de berekening van de hoogte van het
      bedrag dat hij vanaf de inwerkingtreding van artikel V, onderdeel A, van de genoemde wet op grond van artikel 3.27,
      tweede lid, verschuldigd is, gelijkgesteld met de student wiens aanspraak op reisrecht is beëindigd op het moment
      van inwerkingtreding van dat artikel V, onderdeel A.


