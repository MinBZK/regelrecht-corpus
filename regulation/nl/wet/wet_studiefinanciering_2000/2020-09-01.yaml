        hoofdstuk: '1'
  - number: 12.1a0.1
    text: |-
      In afwijking van [artikel 2.1][ref1] regelt dit artikel het langstudeerderskrediet.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel2
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel12.1a0
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 12.1a0.2
    text: |-
      Het langstudeerderskrediet is een lening die op aanvraag kan worden toegekend voor het studiejaar 2011–2012 en
      2012–2013. Het langstudeerderskrediet kan worden toegekend aan iemand die:
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel12.1a0
  - number: 12.1a0.2.a
    text: voor 1 september 2011 aanspraak op studiefinanciering had;
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel12.1a0
  - number: 12.1a0.2.b
    text: op het moment van aanvraag geen aanspraak op studiefinanciering heeft; en
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel12.1a0
  - number: 12.1a0.2.c
    text: |-
      het verhoogde wettelijke collegegeld verschuldigd is op grond van [artikel 7.45b van de WHW][ref1] zoals dat luidde
      op 1 september 2011.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel12.1a0
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
  - number: 12.1a0.3
    text: |-
      Het langstudeerderskrediet voor het desbetreffende studiejaar wordt in een keer uitgekeerd en bedraagt maximaal de
      hoogte van de opslag, bedoeld in [artikel 7.45, eerste lid, van de WHW][ref1] zoals dat luidde op 1 september 2011.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel12.1a0
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
  - number: 12.1a0.4
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld over de aanvraag, toekenning, betaling en andere
      uitvoeringsaspecten van het langstudeerderskrediet.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel12.1a0
  - number: 12.1a0.5
    text: |-
      [Hoofdstuk 10a][ref1], [paragraaf 6.1][ref2], voor de toepassing waarvan het langstudeerderskrediet wordt
      aangemerkt als een lening beroepsonderwijs, en de [artikelen 7.1][ref3], [7.3][ref4] en [12.10a1][ref5] zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Hoofdstuk10a
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Hoofdstuk6
      [ref3]: https://wetten.overheid.nl/BWBR0011453#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0011453#Artikel7
      [ref5]: https://wetten.overheid.nl/BWBR0011453#Artikel12
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel12.1a0
