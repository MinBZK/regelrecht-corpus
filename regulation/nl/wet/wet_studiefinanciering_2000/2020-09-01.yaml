  - number: 4.22.1
    text: |-
      De mbo-student zendt uiterlijk 3 maanden na het verstrijken van de diplomatermijn beroepsonderwijs, een gewaarmerkt
      bewijs van het met goed gevolg afleggen van het afsluitend examen van de opleiding aan Onze Minister en dient
      daarbij een aanvraag in tot omzetting van de prestatiebeurs beroepsonderwijs. Op het gewaarmerkt bewijs vermeldt de
      instelling de datum waarop het examen met goed gevolg is afgesloten.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel4.22
  - number: 4.22.2
    text: |-
      De omzetting, bedoeld in [artikel 4.10][ref1], vindt plaats uiterlijk per 1 januari van het kalenderjaar volgend op
      de aanvraag. Zo spoedig mogelijk na de omzetting stelt Onze Minister de mbo-student daarvan in kennis.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel4
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel4.22
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.1.2
        afdeling: '4.1'
  - number: '4.23'
    text: |-
      Voor zover deze afdeling daarin niet voorziet, alsmede indien noodzakelijk, kunnen in afwijking van het in deze
      afdeling bepaalde bij ministeriële regeling regels worden vastgesteld ten behoeve van een goede uitvoering van
      deze afdeling.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel4.23
  - number: '5.1'
    text: |-
      Een ho-student komt voor zover wordt voldaan aan de van toepassing zijnde voorwaarden in aanmerking voor
      studiefinanciering in de vorm van een prestatiebeurs, inhoudende:
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel5.1
  - number: 5.1.a
    text: een aanvullende beurs;
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel5.1
  - number: 5.1.b
    text: een reisvoorziening; en
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel5.1
  - number: 5.1.c
    text: een toeslag eenoudergezin.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel5.1
  - number: 5.2.1
    text: 'De prestatiebeurs hoger onderwijs wordt eenmalig aan een ho-student verstrekt gedurende 4 jaar, vermeerderd met:'
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel5.2
  - number: 5.2.1.a
    text: |-
      eenmalig een jaar indien een ho-student is ingeschreven aan een masteropleiding, bedoeld in
      [artikel 7.4b, derde tot met achtste lid, van de WHW][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel5.2
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
  - number: 5.2.1.b
    text: |-
      eenmalig het aantal maanden dat het resultaat is van het aantal studiepunten, genoemd in
      [artikel 7.4a, derde tot en met zevende lid, van de WHW][ref1], minus zestig en gedeeld door vijf, indien een ho-
      student is ingeschreven aan een in de betreffende artikelleden genoemde opleiding.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel5.2
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
  - number: 5.2.2
    text: |-
      In afwijking van het eerste lid, wordt de aanvullende beurs in de eerste 5 maanden waarvoor aanspraak op
      studiefinanciering bestaat, verstrekt in de vorm van een gift.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel5.2
  - number: 5.2.3
    text: |-
      De basislening, aanvullende lening en het collegegeldkrediet kunnen worden verstrekt gedurende de periode waarin
      aanspraak kan worden gemaakt op de prestatiebeurs hoger onderwijs.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel5.2
  - number: 5.2.4
    text: |-
      Gedurende 36 maanden na de periode, bedoeld in het eerste lid, kan het collegegeldkrediet worden verstrekt en kan
      daarnaast studiefinanciering worden verstrekt in de vorm van een lening. Het bedrag van de lening, bedraagt in
      afwijking van de [artikelen 3.1, vierde lid][ref1], [3.3][ref2], [3.13][ref3] en [3.18][ref4] naar de maatstaf van
      1 januari 2014 per maand € 894,51 . In de eerste 12 maanden kan tevens een reisvoorziening worden verstrekt in de
      vorm van een prestatiebeurs.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011453#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0011453#Artikel3
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel5.2
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0011453
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref3
        bwb_id: BWBR0011453
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.3'
      - id: ref4
        bwb_id: BWBR0011453
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.5'
  - number: 5.2.5
    text: |-
      Op aanvraag kan een ho-student als bedoeld in [artikel 3.5][ref1] gedurende de 36 maanden, bedoeld in het vierde
      lid, tevens in aanmerking komen voor een lening ter grootte van het bedrag, bedoeld in artikel 3.5, tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel3
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel5.2
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 5.2a
    text: 'De prestatiebeurs hoger onderwijs wordt op aanvraag eenmalig 1 jaar langer verstrekt, indien:'
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel5.2a
  - number: 5.2a.a
    text: |-
      het een ho-student betreft die met goed gevolg het afsluitende examen van een bacheloropleiding heeft behaald, voor
      zover bij ministeriële regeling aangewezen, of een daarmee gelijkgesteld diploma; en
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel5.2a
  - number: 5.2a.b
    text: |-
      deze ho-student is ingeschreven voor de hbo-lerarenopleiding, voor een daarbinnen te volgen eenjarig programma,
      waarvan in de onder a bedoelde ministeriële regeling is aangegeven dat die opleiding verwant is aan de onder a
      bedoelde opleiding.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel5.2a
  - number: 5.2b.1
    text: |-
      De prestatiebeurs hoger onderwijs wordt op aanvraag eenmalig 1 jaar langer verstrekt indien de ho-student blijkens
      gedagtekende verklaringen van een arts en van het bestuur van de onderwijsinstelling waar hij is ingeschreven, als
      gevolg van een handicap of chronische ziekte niet in staat is het afsluitend examen met goed gevolg af te ronden
      binnen het aantal jaren prestatiebeurs hoger onderwijs dat zonder deze verlenging aan de ho-student kan worden
      verstrekt.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel5.2b
  - number: 5.2b.2
    text: |-
      In afwijking van het eerste lid wordt de prestatiebeurs hoger onderwijs eenmalig 6 maanden langer verstrekt aan de
      ho-student, bedoeld in het eerste lid, die studiefinanciering toegekend heeft gekregen voor een associate degree-
      opleiding.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel5.2b
  - number: 5.2c.1
    text: |-
      In aanvulling op [artikel 5.2, eerste lid][ref1], wordt de prestatiebeurs hoger onderwijs op aanvraag eenmalig
      1 jaar langer verstrekt, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel5
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel5.2c
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 5.2c.1.a
    text: |-
      het een masteropleiding als bedoeld in [artikel 7.30c van de WHW][ref1] betreft;


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel5.2c
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
  - number: 5.2c.1.b
    text: |-
      met goed gevolg het afsluitende examen van een masteropleiding als bedoeld in
      [artikel 7.4a, met uitzondering van het derde lid, van de WHW][ref1] is behaald en daarna een masteropleiding als
      bedoeld in artikel 7.4a, derde lid, van de WHW wordt gevolgd; of


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel5.2c
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
  - number: 5.2c.1.c
    text: |-
      reeds eerder prestatiebeurs hoger onderwijs is toegekend op grond van [artikel 5.2a][ref1] en een masteropleiding
      als bedoeld in [artikel 7.4a, derde lid, van de WHW][ref2] wordt gevolgd.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel5.2c
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.1'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
  - number: 5.2c.2
    text: |-
      Het eerste lid, onderdeel a, is niet van toepassing, indien reeds eerder op grond van onderdeel b van dat lid
      prestatiebeurs hoger onderwijs is toegekend.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel5.2c
  - number: 5.2c.3
    text: 'Het eerste lid, onderdeel b, is niet van toepassing indien reeds eerder:'
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel5.2c
  - number: 5.2c.3.a
    text: |-
      op grond van het eerste lid, onderdeel a, of [artikel 5.2a][ref1] prestatiebeurs hoger onderwijs is toegekend; of


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel5
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel5.2c
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 5.2c.3.b
    text: |-
      op grond van [artikel 5.2, eerste lid][ref1], prestatiebeurs hoger onderwijs is toegekend, voor zover die
      toekenning betrekking had op een opleiding als bedoeld in [7.4b, vijfde lid, van de WHW][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel5.2c
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.1'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
  - number: 5.3.1
    text: |-
      Het deel van de prestatiebeurs hoger onderwijs dat betrekking heeft op het recht op de reisvoorziening, is gelijk
      aan een twaalfde deel van de waarde die daarvoor per student door het vervoerbedrijf aan Onze Minister in rekening
      wordt gebracht. De waarde wordt berekend door de voorlopige vergoeding voor het lopende kalenderjaar te corrigeren
      naar de correctie die de voorlopige vergoeding voor het tweede daaraan voorafgaande kalenderjaar onderging. Dit
      deel van de prestatiebeurs hoger onderwijs wordt niet uitbetaald of verrekend.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel5.3
  - number: 5.3.2
    text: |-
      Indien de prestatiebeurs hoger onderwijs niet kan worden omgezet in een gift, wordt de tegenwaarde van de
      reisvoorziening kwijtgescholden over een maand waarover het reisproduct niet op een OV-chipkaart is geladen
      als bedoeld in [artikel 3.26][ref1] of is stopgezet als bedoeld in [artikel 3.27][ref2]. In afwijking van
      [artikel 1.2][ref3] is bepalend de toestand op enig moment van de maand. De over het kwijt te schelden bedrag
      opgebouwde rente gaat dan teniet. De kwijtschelding is niet van toepassing op een maand waarin een vergoeding als
      bedoeld in [artikel 3.7, tweede of vierde lid][ref4], is toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011453#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0011453#Artikel3
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel5.3
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.7'
      - id: ref2
        bwb_id: BWBR0011453
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.7'
      - id: ref3
        bwb_id: BWBR0011453
        artikel: '1'
        hoofdstuk: '1'
      - id: ref4
        bwb_id: BWBR0011453
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '5.5'
    text: |-
      De diplomatermijn hoger onderwijs is een periode van 10 jaren. Deze periode vangt aan op de eerste dag van de maand
      waarover voor het eerst studiefinanciering is toegekend voor het volgen van hoger onderwijs.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel5.5
  - number: 5.7.1
    text: |-
      Indien een ho-student binnen de diplomatermijn hoger onderwijs met goed gevolg een associate degree-opleiding
      afrondt, wordt de toegekende prestatiebeurs hoger onderwijs voor de duur van de desbetreffende opleiding omgezet in
      een gift. Onverminderd de eerste volzin, wordt de toegekende reisvoorziening volledig omgezet in een gift.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel5.7
  - number: 5.7.2
    text: |-
      Indien een ho-student binnen de diplomatermijn hoger onderwijs met goed gevolg een opleiding als bedoeld in het
      eerste lid afrondt, wordt de resterende periode van de prestatiebeurs hoger onderwijs die ingevolge het eerste lid
      had kunnen worden omgezet in een gift verstrekt in de vorm van een gift indien hij een andere opleiding in de zin
      van deze wet, of een voltijdse masteropleiding als bedoeld in [artikel 7.3b van de WHW][ref1] die is geaccrediteerd
      als bedoeld in [artikel 1.1, onderdeel q, van de WHW][ref2] aanvangt.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel5.7
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '1'
  - number: 5.7.3
    text: |-
      Indien een ho-student binnen de diplomatermijn hoger onderwijs met goed gevolg een hbo-bacheloropleiding of het
      geheel van een wo-bacheloropleiding en een wo-masteropleiding afrondt, wordt de aan hem toegekende prestatiebeurs
      hoger onderwijs voor de duur van de desbetreffende opleiding omgezet in een gift. Onverminderd de eerste volzin,
      wordt van de toegekende reisvoorziening één jaar extra omgezet in een gift.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel5.7
  - number: 5.7.4
    text: |-
      Indien een ho-student binnen de diplomatermijn hoger onderwijs met goed gevolg een opleiding als bedoeld
      in het derde lid afrondt, wordt de resterende periode van zijn prestatiebeurs hoger onderwijs verstrekt in
      de vorm van een gift indien hij een andere opleiding in de zin van deze wet, of een voltijdse postinitiële
      masteropleiding als bedoeld in [artikel 7.3b van de WHW][ref1] aanvangt waaraan accreditatie als bedoeld in
      [artikel 1.1, onderdeel q, van de WHW][ref2] is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel5.7
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '1'
  - number: 5.7.5
    text: |-
      Met het afronden van een opleiding als bedoeld in het eerste of derde lid wordt gelijkgesteld het afronden van een
      deeltijdse opleiding of een opleiding van de Open Universiteit, voor zover deze opleiding krachtens de [WHW][ref1]
      daarmee gelijk wordt gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005682
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel5.7
    references:
      - id: ref1
        bwb_id: BWBR0005682
  - number: 5.7.6
    text: |-
      Met het afronden van een opleiding als bedoeld in het derde lid wordt eveneens gelijkgesteld het afronden van een
      wo-bacheloropleiding, voor zover de ho-student een aanvraag heeft ingediend tot gelijkstelling.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel5.7
  - number: 5.9.1
    text: |-
      De omzetting, bedoeld in [artikel 5.7][ref1], vindt plaats uiterlijk per 1 januari van het kalenderjaar volgend
      op de verzending van de mededeling, bedoeld in [artikel 7.9d van de WHW][ref2], of de mededeling, bedoeld in
      [artikel 9.5, tweede lid][ref3]. Zo spoedig mogelijk na de omzetting stelt Onze Minister de ho-student daarvan
      in kennis.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0011453#Artikel9
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel5.9
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.2'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0011453
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '9.2'
  - number: 5.9.2
    text: |-
      Een ho-student die het examen, bedoeld in [artikel 5.7][ref1], met goed gevolg heeft afgelegd aan een instelling
      waarop [artikel 7.9d van de WHW][ref2] niet van toepassing is, zendt uiterlijk 3 maanden na het verstrijken van de
      diplomatermijn hoger onderwijs, een door de betrokken instelling van hoger onderwijs gewaarmerkte kopie van het aan
      dat examen verbonden diploma aan Onze Minister en dient daarbij een aanvraag in tot omzetting van de prestatiebeurs
      hoger onderwijs. Op die kopie vermeldt de instelling de datum waarop het examen met goed gevolg is afgesloten. De
      omzetting vindt plaats uiterlijk per 1 januari van het kalenderjaar volgend op de aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel5.9
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.2'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
  - number: 5.9.3
    text: |-
      Het tweede lid is van overeenkomstige toepassing op de omzetting van de prestatiebeurs hoger onderwijs ingevolge
      [artikel 5.7, zesde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel5
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel5.9
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: '5.10'
    text: |-
      Indien een ho-student in het studiejaar waarvoor hij op enig moment voor het eerst prestatiebeurs hoger onderwijs
      geniet, ophoudt studiefinanciering te genieten vóór 1 februari, en hij niet over datzelfde studiejaar opnieuw
      studiefinanciering voor het volgen van hoger onderwijs krijgt toegekend, wordt uiterlijk per 1 januari van het
      kalenderjaar volgend op dat studiejaar de in dat studiejaar toegekende prestatiebeurs hoger onderwijs omgezet in
      een gift.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel5.10
  - number: '5.11'
    text: |-
      Indien een ho-student in het studiejaar waarvoor hij op enig moment na 31 januari voor het eerst prestatiebeurs
      hoger onderwijs geniet, ophoudt studiefinanciering te genieten vóór 1 september, en hij niet vóór 1 februari van
      het daaropvolgende studiejaar opnieuw studiefinanciering voor het volgen van hoger onderwijs krijgt toegekend,
      wordt uiterlijk per 1 januari van het kalenderjaar volgend op het laatstbedoelde studiejaar de in het eerste
      studiejaar toegekende prestatiebeurs hoger onderwijs omgezet in een gift.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel5.11
  - number: '5.15'
    text: |-
      Indien een ho-student op enig moment binnen de diplomatermijn hoger onderwijs in staat
      wordt om met arbeid niet meer dan 20% te verdienen van het maatmaninkomen in de zin van de
      [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref1] en recht op arbeidsongeschiktheidsuitkering op
      grond van [hoofdstuk 3 van die wet][ref2] bestaat, of duurzaam geen mogelijkheden tot arbeidsparticipatie meer
      heeft in de zin van die wet, wordt de aan hem toegekende prestatiebeurs hoger onderwijs omgezet in een gift.


      [ref1]: https://wetten.overheid.nl/BWBR0008657
      [ref2]: https://wetten.overheid.nl/BWBR0008657#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel5.15
    references:
      - id: ref1
        bwb_id: BWBR0008657
      - id: ref2
        bwb_id: BWBR0008657
        hoofdstuk: '3'
  - number: 5.16.1
    text: |-
      Indien een ho-student als direct gevolg van bijzondere omstandigheden van tijdelijke aard niet in staat is binnen
      de diplomatermijn hoger onderwijs met goed gevolg het afsluitend examen te behalen, wordt deze termijn verlengd met
      de duur van die bijzondere omstandigheden.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel5.16
  - number: 5.16.2
    text: |-
      Indien een ho-student als direct gevolg van bijzondere omstandigheden van structurele aard niet in staat is
      binnen de diplomatermijn hoger onderwijs met goed gevolg het afsluitend examen te behalen, wordt deze termijn, op
      aanvraag, verlengd met 5 jaren. Onder bijzondere omstandigheden van structurele aard kunnen in ieder geval worden
      verstaan functiebeperking of chronische ziekte.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel5.16
  - number: 5.16.3
    text: |-
      Indien een ho-student als direct gevolg van bijzondere omstandigheden van structurele aard niet in staat is
      binnen de diplomatermijn hoger onderwijs of binnen de, op grond van het tweede lid, verlengde diplomatermijn
      hoger onderwijs met goed gevolg het afsluitend examen te behalen, wordt de aan hem toegekende prestatiebeurs hoger
      onderwijs omgezet in een gift.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel5.16
  - number: 5.16.4
    text: |-
      Indien een ho-student als direct gevolg van een tijdens de studie verworven handicap, ten gevolge van een zich
      tijdens de studie verergerende handicap of ten gevolge van een zich tijdens de studie manifesterende chronische
      ziekte genoodzaakt is een reeds begonnen opleiding te beëindigen, ontvangt de ho-student bij keuze voor een
      passender opleiding nieuwe aanspraak op studiefinanciering.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel5.16
  - number: 5.16.5
    text: |-
      Onze Minister stelt op aanvraag van de ho-student vast of er sprake is van bijzondere omstandigheden in de zin
      van dit artikel. De bijzondere omstandigheden kunnen uitsluitend worden aangetoond door gedagtekende verklaringen
      van een arts en de natuurlijke persoon of het bestuur van de rechtspersoon van de onderwijsinstelling waar
      hij is ingeschreven. Indien de bijzondere omstandigheden uitsluitend van niet-medische aard zijn, volstaat een
      gedagtekende verklaring van de natuurlijke persoon of het bestuur van de rechtspersoon van de onderwijsinstelling
      waar de ho-student is ingeschreven.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel5.16
  - number: '5.17'
    text: |-
      Bij omzetting van de prestatiebeurs hoger onderwijs of een deel daarvan in een gift gaat de over het om te zetten
      bedrag opgebouwde rente teniet.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel5.17
  - number: 6.1.1
    text: In dit hoofdstuk wordt onder lening mede verstaan de prestatiebeurs.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel6.1
  - number: 6.1.2
    text: |-
      In dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder: - *lening beroepsonderwijs:* lening die
      uitsluitend is aangegaan voor het volgen van beroepsonderwijs;
        - *lening hoger onderwijs:* lening die is aangegaan voor het volgen van hoger onderwijs.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel6.1
  - number: 6.1.3
    text: |-
      Vanaf de dag waarop een student met een lening beroepsonderwijs tevens een lening hoger onderwijs aangaat, wordt de
      lening beroepsonderwijs aangemerkt als een lening hoger onderwijs.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel6.1
  - number: 6.1.4
    text: |-
      Voor de toepassing van deze paragraaf wordt onder debiteur uitsluitend verstaan degene die een lening heeft
      opgebouwd anders dan door de toekenning van het levenlanglerenkrediet.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel6.1
  - number: 6.1.5
    text: |-
      Indien de debiteur tevens een schuld uit een lening heeft als bedoeld in
      [hoofdstuk 4 van de Wet tegemoetkoming onderwijsbijdrage en schoolkosten][ref1], wordt die schuld voor de
      toepassing van dit hoofdstuk aangemerkt als een schuld in de zin van dit hoofdstuk.


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel6.1
    references:
      - id: ref1
        bwb_id: BWBR0012438
        hoofdstuk: '4'
  - number: 6.1a
    text: |-
      Het belastbaar minimumloon in de zin van deze wet is een bij of krachtens algemene maatregel van bestuur
      vast te stellen bedrag, afgeleid van het totaal van het minimumloon en de minimumvakantiebijslag, bedoeld in
      [artikel 7, eerste lid, van de Wet minimumloon en minimumvakantiebijslag][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel7
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel6.1a
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '7'
  - number: 6.2.1
    text: |-
      Ontvangst van een lening of omzetting in een lening, of omzetting als bedoeld in [artikel 6.17][ref1], verplicht
      degene die studiefinanciering heeft ontvangen tot terugbetaling van de lening vermeerderd met de volgens dit
      hoofdstuk berekende rente.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel6
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 6.2.2
    text: |-
      De vanaf de zesde maand waarvoor na het studiejaar 2000–2001 aanspraak op studiefinanciering bestaat ingevolge
      [hoofdstukken 4][ref1] en [5][ref2] toegekende en niet in gift om te zetten aanvullende beurs kan op aanvraag van
      de debiteur worden kwijtgescholden.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0011453
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0011453
        hoofdstuk: '5'
  - number: 6.2.3
    text: 'Bij algemene maatregel van bestuur wordt bepaald:'
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel6.2
  - number: 6.2.3.a
    text: |-
      tot welk toetsingsinkomen van de debiteur en zijn partner geheel of gedeeltelijk kwijtschelding als bedoeld in het
      tweede lid, mogelijk is,
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel6.2
  - number: 6.2.3.b
    text: |-
      of daarbij onderscheid gemaakt wordt voor een debiteur met partner en een debiteur zonder partner die al dan niet
      student is in de zin van deze wet, en
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel6.2
  - number: 6.2.3.c
    text: tot welk tijdstip een aanvraag kan worden ingediend.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel6.2
  - number: 6.2.4
    text: |-
      De over het kwijt te schelden bedrag opgebouwde rente gaat op het tijdstip van kwijtschelding als bedoeld in het
      tweede lid, teniet.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel6.2
  - number: 6.2.5
    text: |-
      Bij kwijtschelding als bedoeld in het tweede lid, zijn de [artikelen 6.10, eerste en vijfde lid][ref1], van
      overeenkomstige toepassing, en is [artikel 6.12][ref2] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel6
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
      - id: ref2
        bwb_id: BWBR0011453
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 6.2.6
    text: |-
      Een krachtens het derde lid vastgestelde algemene maatregel van bestuur wordt aan de beide kamers der Staten-
      Generaal overgelegd. Hij treedt in werking op een tijdstip dat nadat vier weken na de overlegging zijn verstreken
      bij koninklijk besluit wordt vastgesteld, tenzij binnen die termijn door of namens een der kamers of door ten
      minste een vijfde van het grondwettelijk aantal leden van een der kamers de wens te kennen wordt gegeven dat het
      onderwerp bij wet wordt geregeld. In dat geval wordt een daartoe strekkend voorstel van wet zo spoedig mogelijk
      ingediend. Indien het voorstel van wet wordt ingetrokken of indien een van de beide kamers van de Staten-Generaal
      besluit het voorstel niet aan te nemen, wordt de algemene maatregel van bestuur ingetrokken.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel6.2
  - number: 6.2a.1
    text: |-
      Aan de debiteur wordt gelijktijdig met de omzetting, bedoeld in [artikel 5.7][ref1], een deel van de lening hoger
      onderwijs kwijtgescholden indien:


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel5
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel6.2a
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: 6.2a.1.a
    text: |-
      aan de debiteur op grond van [artikel 5.2b, eerste lid][ref1], voor een opleiding een extra jaar prestatiebeurs
      hoger onderwijs is toegekend; en


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel5
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel6.2a
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 6.2a.1.b
    text: |-
      de desbetreffende bacheloropleiding of masteropleiding met goed gevolg is afgerond binnen de diplomatermijn hoger
      onderwijs.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel6.2a
  - number: 6.2a.2
    text: |-
      Voor de waarde van de kwijtschelding is bepalend het jaar waarin voor het eerst is voldaan aan de voorwaarden,
      bedoeld in het eerste lid. De kwijtschelding bedraagt naar de maatstaf van 1 januari 2014 € 1.200 . .
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel6.2a
  - number: 6.2a.3
    text: |-
      Voor een debiteur aan wie op grond van [artikel 5.2b, tweede lid][ref1], 6 maanden extra prestatiebeurs hoger
      onderwijs is toegekend en die binnen de diplomatermijn hoger onderwijs een associate degree-opleiding met goed
      gevolg heeft afgerond, zijn het eerste en tweede lid van overeenkomstige toepassing, met dien verstande dat de
      waarde van de kwijtschelding 50% bedraagt van het bedrag, genoemd in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel5
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel6.2a
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 6.2a.4
    text: Bij ministeriële regeling worden regels gesteld voor een goede uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel6.2a
  - number: 6.3.1
    text: |-
      Ten aanzien van de lening beroepsonderwijs stelt Onze Minister jaarlijks uiterlijk in december een rentepercentage
      vast dat gelijk is aan het gemiddeld effectief rendement over de maand september van dat jaar van de openbare
      lening, uitgegeven door de Staat der Nederlanden en toegelaten tot de notering aan de officiële markt ter beurze
      van Amsterdam, met een gemiddelde resterende looptijd van 3 tot 5 jaren. Het rentepercentage wordt vastgesteld op
      nul indien deze overeenkomstig de eerste volzin minder dan nul procent bedraagt.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel6.3
  - number: 6.3.2
    text: |-
      Ten aanzien van de lening hoger onderwijs stelt Onze Minister jaarlijks uiterlijk in december een rentepercentage
      vast dat gelijk is aan het gemiddeld effectief rendement over de periode van 12 maanden, gerekend van oktober van
      het voorafgaande jaar tot en met september van het lopende jaar, van de openbare lening, uitgegeven door de Staat
      der Nederlanden en toegelaten tot de notering aan de officiële markt ter beurze van Amsterdam, met een gemiddelde
      resterende looptijd van 5 jaren. Het rentepercentage wordt vastgesteld op nul indien deze overeenkomstig de eerste
      volzin minder dan nul procent bedraagt.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel6.3
  - number: 6.4.1
    text: |-
      Over de aangegane leningen is, voor zover het niet betreft achterstallige schuld, rente verschuldigd overeenkomstig
      het tweede en derde lid. De renteberekening gaat in op de eerste dag van de maand die volgt op de dag waarop het
      bedrag aan lening bij de verstrekker van die lening is afgeschreven.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel6.4
  - number: 6.4.2
    text: |-
      De rente over de door de student in een studiefinancieringstijdvak opgenomen lening wordt berekend per dag op basis
      van samengestelde interest. Indien de terugbetaling niet binnen 2 weken na de vervaldatum is ontvangen, wordt de op
      voet van deze bepaling berekende rente bijgeschreven bij de hoofdsom.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel6.4
  - number: 6.4.3
    text: |-
      In de periode die aan de terugbetalingsperiode voorafgaat, wordt bij de berekening van de rente, bedoeld in het
      eerste en tweede lid, voor elk kalenderjaar het rentepercentage gehanteerd dat op grond van [artikel 6.3][ref1]
      uiterlijk in december van het aan dat jaar voorafgaande jaar is vastgesteld. In de terugbetalingsperiode wordt bij
      de berekening van de rente, bedoeld in het eerste en tweede lid, voor elke periode van 5 kalenderjaren na aanvang
      van de terugbetalingsperiode, het rentepercentage gehanteerd dat op grond van artikel 6.3 uiterlijk in december van
      het aan die periode voorafgaande jaar is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel6
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel6.4
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 6.4.4
    text: |-
      Voor de berekening van de rente op de voet van het tweede lid wordt een maand gesteld op 30 dagen en een jaar
      gesteld op 360 dagen.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel6.4
  - number: 6.4.5
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot het tweede tot en met het
      vierde lid.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel6.4
  - number: 6.5.1
    text: |-
      De terugbetalingsperiode vangt aan op 1 januari van het jaar volgend op het jaar waarin iemand is opgehouden
      studiefinanciering te genieten.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel6.5
  - number: 6.5.2
    text: De terugbetalingsperiode bestaat uit een aanloopfase en een aflosfase.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel6.5
  - number: 6.5.3
    text: 'Gedurende de voor de debiteur geldende diplomatermijn wordt de terugbetalingsperiode geschorst:'
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel6.5
  - number: 6.5.3.a
    text: |-
      van rechtswege indien de debiteur opnieuw studiefinanciering als bedoeld in
      [artikel 3.1, eerste of tweede lid][ref1], geniet;


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel3
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel6.5
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 6.5.3.b
    text: op aanvraag zolang de debiteur opnieuw student is en geen studiefinanciering geniet; of
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel6.5
  - number: 6.5.3.c
    text: |-
      op de wijze bepaald krachtens [artikel 6.19b][ref1] zolang de debiteur opnieuw student is en levenlanglerenkrediet
      geniet.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel6
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel6.5
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: 6.5.4
    text: |-
      Voor debiteuren voor wie nooit een diplomatermijn beroepsonderwijs of diplomatermijn hoger onderwijs heeft gegolden
      geldt, in afwijking van het derde lid, dat de terugbetaling wordt geschorst:
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel6.5
  - number: 6.5.4.a
    text: |-
      van rechtswege zolang de debiteur opnieuw studiefinanciering als bedoeld in
      [artikel 3.1, eerste of tweede lid][ref1], geniet;


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel3
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel6.5
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 6.5.4.b
    text: op aanvraag zolang de debiteur opnieuw student is en geen studiefinanciering geniet; of
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel6.5
  - number: 6.5.4.c
    text: |-
      op de wijze bepaald krachtens [artikel 6.19b][ref1] zolang de debiteur opnieuw student is en levenlanglerenkrediet
      geniet.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel6
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel6.5
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: 6.5.5
    text: |-
      De schorsing, bedoeld in het derde of vierde lid, wordt beëindigd indien de debiteur niet binnen 8 weken na
      de verzending van een daartoe strekkend verzoek van Onze Minister of de debiteur nog student is, daarop heeft
      geantwoord. De beëindiging werkt terug tot de datum van verzending van het verzoek, of zoveel eerder als de
      debiteur ophield student te zijn. Een aanvraag om de terugbetaling wederom te schorsen wordt niet toegestaan voor
      een periode die gelegen is vóór de datum van indiening van de aanvraag. De schorsing wordt tevens beëindigd aan het
      einde van de diplomatermijn beroepsonderwijs dan wel de diplomatermijn hoger onderwijs.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel6.5
  - number: 6.5a
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent de samenloop van de verplichting
      tot terugbetaling uit hoofde van deze wet en de [Wet studiefinanciering BES][ref1] met dien verstande dat de
      verplichting tot terugbetaling de laagst vastgestelde draagkracht van de debiteur niet mag overschrijden.


      [ref1]: https://wetten.overheid.nl/BWBR0028393
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel6.5a
    references:
      - id: ref1
        bwb_id: BWBR0028393
  - number: 6.6.1
    text: De aanloopfase beslaat de eerste 2 kalenderjaren na aanvang van de terugbetalingsperiode.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel6.6
  - number: 6.6.2
    text: Gedurende de aanloopfase bestaat geen verplichting tot terugbetaling.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel6.6
  - number: 6.7.1
    text: |-
      De aflosfase volgt op de aanloopfase en beslaat behoudens toepassing van [artikel 6.9, derde lid][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel6
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel6.7
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 6.7.1.a
    text: 15 kalenderjaren voor de terugbetaling van een lening beroepsonderwijs;
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel6.7
  - number: 6.7.1.b
    text: 35 kalenderjaren voor de terugbetaling van een lening hoger onderwijs.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel6.7
  - number: 6.7.2
    text: Op aanvraag van de debiteur wordt de terugbetaling voor ten hoogste 5 kalenderjaren opgeschort.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel6.7
  - number: 6.7.3
    text: |-
      Bij ministeriële regeling kunnen voorschriften worden vastgesteld met betrekking tot de opschorting, bedoeld in het
      tweede lid.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel6.7
  - number: 6.8.1
    text: |-
      Onder achterstallige schuld wordt verstaan het bedrag van de verplichte terugbetaling uit hoofde van dit hoofdstuk
      of uit hoofde van [artikel 7.4][ref1] dat 2 weken na de vervaldatum nog niet is ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel7
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel6.8
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '7'
        hoofdstuk: '7'
  - number: 6.8.2
    text: |-
      Over de achterstallige schuld is rente verschuldigd. Als rentepercentage wordt het percentage van de wettelijke
      rente gehanteerd. Deze rente wordt berekend per dag op basis van samengesteld interest, waarbij een maand wordt
      gesteld op 30 dagen en een jaar wordt gesteld op 360 dagen.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel6.8
  - number: 6.8.3
    text: |-
      Indien de debiteur achterstallig is bij de betaling wordt met deze achterstallige schuld bij de duur van
      de aflosfase, bedoeld in [artikel 6.7][ref1], bij de vaststelling van de termijnbetaling en de gewijzigde
      termijnbetaling, bedoeld in [artikel 6.15][ref2], alsmede bij het tenietgaan van de schuld, bedoeld in
      [artikel 6.16, eerste lid][ref3], geen rekening gehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0011453#Artikel6
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel6.8
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
      - id: ref2
        bwb_id: BWBR0011453
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
      - id: ref3
        bwb_id: BWBR0011453
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 6.8.4
    text: |-
      [Artikel 6.4][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel6
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel6.8
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 6.9.1
    text: Rente en aflossing van de lening vervallen gedurende de aflosfase in maandelijkse termijnen.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel6.9
  - number: 6.9.2
    text: |-
      De hoogte van de maandelijkse termijnbetalingen wordt op basis van het aantal maanden van de aflosfase
      onderscheidenlijk het nog resterende aantal maanden van de aflosfase tot gelijke bedragen vastgesteld bij de
      aanvang van:
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel6.9
  - number: 6.9.2.a
    text: het eerste jaar van de aflosfase,
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel6.9
  - number: 6.9.2.b
    text: het vierde jaar van de aflosfase, en
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel6.9
  - number: 6.9.2.c
    text: ieder vijfde jaar na het vierde jaar van de aflosfase.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel6.9
  - number: 6.9.3
    text: |-
      Onverminderd toepassing van [artikel 6.10][ref1] bedraagt het totaal per jaar te betalen bedrag aan maandelijkse
      termijnbetalingen voor de terugbetaling van de lening beroepsonderwijs onderscheidenlijk lening hoger onderwijs ten
      minste € 545 onderscheidenlijk € 60.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel6
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel6.9
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 6.9.4
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld voor de vaststelling en betaling van de
      termijnbetalingen. Hierbij kan tevens worden bepaald dat betaling geschiedt door middel van een daartoe verleende
      doorlopende machtiging om het verschuldigde bedrag maandelijks te doen afschrijven van een bankrekening.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel6.9
  - number: 6.9a.1
    text: De debiteur is bevoegd om bovenop de termijnbetalingen, kosteloos extra aflossingen te doen.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel6.9a
  - number: 6.9a.2
    text: |-
      Bij ministeriële regeling kunnen over de aflossing, genoemd in het eerste lid, regels worden gesteld met betrekking
      tot onder meer:
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel6.9a
  - number: 6.9a.2.a
    text: de wijze waarop extra aflossingen kunnen worden gedaan;
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel6.9a
  - number: 6.9a.2.b
    text: |-
      de voorwaarden waaronder, in afwijking van [artikel 6.9, tweede lid][ref1], tot herberekening van de
      termijnbetalingen kan worden besloten; en


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel6
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel6.9a
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 6.9a.2.c
    text: de goede uitvoering van extra aflossingen.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel6.9a
  - number: 6.10.1
    text: |-
      Maatstaf voor de vaststelling van de draagkracht van de debiteur uit inkomen is het totaal van zijn
      toetsingsinkomen en dat van zijn partner in het peiljaar. Het aldus bepaalde inkomen is het draagkrachtinkomen.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel6.10
  - number: 6.10.2
    text: |-
      Op het draagkrachtinkomen wordt in mindering gebracht de draagkrachtvrije voet. Deze voet is voor de terugbetaling
      van een lening beroepsonderwijs onderscheidenlijk een lening hoger onderwijs gelijk aan:
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel6.10
  - number: 6.10.2.a
    text: 120% onderscheidenlijk 143% van het belastbaar minimumloon voor een debiteur met partner;
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel6.10
  - number: 6.10.2.b
    text: |-
      120% onderscheidenlijk 143% van het belastbaar minimumloon voor een debiteur die in het peiljaar een ouder zonder
      partner is als bedoeld in [artikel 2, zesde lid, van de Wet op het kindgebonden budget][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0022751#Artikel2
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel6.10
    references:
      - id: ref1
        bwb_id: BWBR0022751
        artikel: '2'
  - number: 6.10.2.c
    text: 84% onderscheidenlijk 100% van het belastbaar minimumloon voor overige debiteuren zonder partner.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel6.10
  - number: 6.10.3
    text: |-
      De draagkracht van de debiteur uit inkomen is voor de terugbetaling van een lening beroepsonderwijs
      onderscheidenlijk een lening hoger onderwijs 12% onderscheidenlijk 4% van het inkomen boven de draagkrachtvrije
      voet.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel6.10
  - number: 6.10.4
    text: |-
      Indien het bedrag van de draagkracht lager is dan het bedrag van de termijnbetaling betaalt de debiteur, in
      afwijking van dat artikel, het bedrag van zijn draagkracht.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel6.10
  - number: 6.10.5
    text: |-
      Voor de toepassing van dit artikel, wordt indien het toetsingsinkomen in het peiljaar nog niet bekend is, door Onze
      Minister daarvoor in de plaats gesteld een bedrag dat het vast te stellen toetsingsinkomen benadert.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel6.10
  - number: 6.10.6
    text: |-
      Het vierde lid is niet van toepassing indien het voor Onze Minister niet mogelijk is op grond van het vijfde lid
      bij benadering een bedrag vast te stellen.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel6.10
  - number: 6.11.1
    text: |-
      Voor een debiteur die in het peiljaar niet binnenlands belastingplichtig is in de zin van de
      [Wet inkomstenbelasting 2001][ref1] en die niet op grond van [artikel 2.5, eerste lid, van die wet][ref2] als
      zodanig is aangemerkt, kan [artikel 6.10][ref3] slechts toepassing vinden als de debiteur daartoe bij Onze Minister
      een aanvraag indient.


      [ref1]: https://wetten.overheid.nl/BWBR0011353
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0011453#Artikel6
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel6.11
    references:
      - id: ref1
        bwb_id: BWBR0011353
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0011453
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 6.11.2
    text: |-
      Indien de debiteur zich voor het einde van een jaartermijn metterwoon in Nederland vestigt, wordt hij tot het
      einde van die jaartermijn behandeld als een debiteur die niet binnenlands belastingplichtig is in de zin van de
      [Wet inkomstenbelasting 2001][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011353
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel6.11
    references:
      - id: ref1
        bwb_id: BWBR0011353
  - number: 6.11.3
    text: |-
      Bij ministeriële regeling kunnen voorschriften worden vastgesteld met betrekking tot de in het eerste lid bedoelde
      aanvraag.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel6.11
  - number: 6.12.1
    text: |-
      Op aanvraag van de debiteur wordt bij de toepassing van [artikel 6.10][ref1] uitgegaan van het inkomen van een
      ander jaar dan het inkomen in het peiljaar, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel6
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel6.12
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 6.12.1.a
    text: |-
      sprake is van een terugval in inkomen over het jaar voorafgaande aan het jaar waarvoor de draagkracht wordt
      vastgesteld, in welk geval wordt uitgegaan van het jaar voorafgaande aan het jaar waarvoor de draagkracht wordt
      vastgesteld, of
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel6.12
  - number: 6.12.1.b
    text: |-
      sprake is van een terugval in inkomen over het jaar waarvoor de draagkracht wordt vastgesteld, in welk geval wordt
      uitgegaan van het jaar waarvoor de draagkracht wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel6.12
  - number: 6.12.2
    text: |-
      Voor de toepassing van het eerste lid wordt onder een terugval in inkomen verstaan: een vermindering van het
      toetsingsinkomen van de debiteur van ten minste 15% ten opzichte van het peiljaar.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel6.12
  - number: 6.12.3
    text: |-
      Voor de toepassing van het eerste lid wordt zolang het belastbaar minimumloon in het peiljaar, het jaar
      voorafgaande aan het jaar waarvoor de draagkracht wordt vastgesteld, of het jaar waarvoor de draagkracht wordt
      vastgesteld nog niet definitief bekend is, daarvoor in de plaats gesteld het bedrag dat naar het oordeel van Onze
      Minister het uiteindelijke belastbaar minimumloon benadert.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel6.12
  - number: '6.13'
    text: |-
      Indien het een debiteur betreft die na het peiljaar een ouder zonder partner als bedoeld in
      [artikel 2, zesde lid, van de Wet op het kindgebonden budget][ref1] is, wordt op aanvraag van de debiteur de hoogte
      van zijn draagkracht dienovereenkomstig aangepast.


      [ref1]: https://wetten.overheid.nl/BWBR0022751#Artikel2
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel6.13
    references:
      - id: ref1
        bwb_id: BWBR0022751
        artikel: '2'
  - number: 6.14.1
    text: 'Indien de partner van de debiteur ook een debiteur is op wie dit hoofdstuk van toepassing is, wordt:'
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel6.14
  - number: 6.14.1.a
    text: |-
      [artikel 6.10, eerste en derde lid][ref1], slechts eenmaal toegepast op het totaal van het toetsingsinkomen voor
      beide partners samen;


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel6
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel6.14
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 6.14.1.b
    text: |-
      de draagkracht per debiteur vastgesteld op basis van de verhouding tussen de hoogte van het toetsingsinkomen van
      beide debiteuren afzonderlijk;
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel6.14
  - number: 6.14.1.c
    text: |-
      de draagkracht van de debiteur eerst aangewend voor de eigen termijnbetaling. Het bedrag aan resterende draagkracht
      van de debiteur wordt toegevoegd aan de draagkracht van de partner van wie de draagkracht zonder deze toevoeging
      lager is dan diens termijnbetaling.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel6.14
  - number: 6.14.2
    text: |-
      Indien een van de partners een lening beroepsonderwijs en de andere partner een lening hoger onderwijs
      terugbetaalt, wordt onverminderd het eerste lid voor beide partners [artikel 6.10, tweede en derde lid][ref1],
      afzonderlijk toegepast volgens de percentages die van toepassing zijn op de terugbetaling van de desbetreffende
      lening.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel6
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel6.14
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 6.14.3
    text: |-
      Indien de debiteur een partner heeft op wie hoofdstuk 10a van toepassing is, wordt het op grond van
      [artikel 6.10][ref1] berekende bedrag van de draagkracht van de debiteur verminderd met de op grond van
      [artikel 10a.6][ref2] voor zijn partner vastgestelde termijnbetaling, dan wel de op grond van [artikel 10a.7][ref3]
      berekende draagkracht van zijn partner. Indien de uitkomst negatief is wordt de draagkracht van de debiteur op
      nihil vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel10a
      [ref3]: https://wetten.overheid.nl/BWBR0011453#Artikel10a
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel6.14
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
      - id: ref2
        bwb_id: BWBR0011453
        artikel: 10a
        hoofdstuk: 10a
      - id: ref3
        bwb_id: BWBR0011453
        artikel: 10a
        hoofdstuk: 10a
  - number: '6.15'
    text: |-
      Indien een debiteur gedurende een kalenderjaar op grond van zijn draagkracht minder heeft betaald dan de
      termijnbetaling, wordt zijn termijnbetaling opnieuw vastgesteld per 1 januari van het jaar daaropvolgend. De
      gewijzigde termijnbetaling wordt vastgesteld op basis van het resterende aantal maanden van de aflosfase.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel6.15
  - number: 6.16.1
    text: De schuld die resteert bij het einde van de aflosfase, gaat op dat ogenblik teniet.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel6.16
  - number: 6.16.2
    text: De schuld die resteert bij het overlijden van de debiteur, gaat op dat ogenblik teniet.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel6.16
  - number: 6.17.1
    text: |-
      Op het ogenblik van beëindiging van het recht op studiefinanciering van een student wordt zijn schuld, ontstaan in
      het kader van de toepassing van deze wet, van rechtswege omgezet in een lening.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel6.17
  - number: 6.17.2
    text: |-
      Indien na beëindiging van het recht op studiefinanciering van een student door een beschikking op grond van
      [artikel 7.1][ref1] een vordering ontstaat van Onze Minister, wordt die vordering omgezet in een lening op
      de eerste dag van de maand na de herziening. Bij de berekening van de rente voor die vordering wordt het
      rentepercentage gehanteerd dat geldt met ingang van 1 januari volgend op het kalenderjaar waarin de student
      is opgehouden student te zijn. Indien de omzetting plaatsvindt in het kalenderjaar waarin de student ophoudt
      student te zijn, wordt het rentepercentage gehanteerd dat geldt met ingang van 1 januari van dat kalenderjaar.
      [Artikel 6.4, derde lid, laatste volzin][ref2], is bij de berekening van rente van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel6
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel6.17
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '7'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0011453
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 6.17.3
    text: |-
      In afwijking van het eerste en tweede lid wordt een schuld uit een lening en een schuld, ontstaan door de
      toepassing van [artikel 3.27, tweede lid][ref1], niet omgezet.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel3
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel6.17
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.7'
  - number: 6.17.4
    text: |-
      De in het eerste of tweede lid bedoelde lening wordt rentedragend met ingang van het tijdstip van de daar bedoelde
      omzetting.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel6.17
  - number: 6.18.1
    text: |-
      Deze paragraaf is uitsluitend van toepassing op de terugbetaling van de lening die is ontstaan door de toekenning
      van het levenlanglerenkrediet.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel6.18
  - number: 6.18.2
    text: |-
      [Artikel 299a van de Faillissementswet][ref1] is van overeenkomstige toepassing op de lening die is ontstaan door
      de toekenning van het levenlanglerenkrediet.


      [ref1]: https://wetten.overheid.nl/BWBR0001860#Artikel299a
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel6.18
    references:
      - id: ref1
        bwb_id: BWBR0001860
        artikel: 299a
  - number: 6.19.1
    text: |-
      Met uitzondering van de [artikelen 6.2a][ref1], [6.5, tweede, derde en vierde lid][ref2][6.6][ref3],
      [6.7, eerste lid, tweede volzin, en tweede en derde lid][ref4], en [6.14][ref5] is [paragraaf 6.1][ref6] van
      overeenkomstige toepassing op de terugbetaling van het levenlanglerenkrediet, waarbij deze lening wordt aangemerkt
      als een lening beroepsonderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0011453#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0011453#Artikel6
