  - number: 12.1b.1
    text: |-
      In afwijking van [artikel 2.8][ref1] komt tot een bij koninklijk besluit te bepalen tijdstip voor
      studiefinanciering mede in aanmerking een ho-student die is ingeschreven voor het volgen van een voltijdse
      opleiding als bedoeld in de [artikelen 18.14][ref2] of [18.15 van de WHW][ref3], zoals die artikelen luidden
      op 31 augustus 2010, of [18.16 van de WHW][ref4] voor zover aan die opleiding accreditatie als bedoeld in
      [artikel 1.1, onderdeel q, van de WHW][ref5] is verleend.


