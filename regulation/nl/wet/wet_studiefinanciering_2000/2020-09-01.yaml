        artikel: '10'
  - number: '2.1'
    text: 'Deze wet regelt de studiefinanciering en is van toepassing op studenten die voldoen aan de voorwaarden inzake:'
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel2.1
  - number: 2.1.a
    text: |-
      nationaliteit als bedoeld in [artikel 2.2][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel2
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 2.1.b
    text: |-
      leeftijd als bedoeld in [artikel 2.3][ref1] of [2.3a][ref2], en


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel2
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0011453
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 2.1.c
    text: |-
      onderwijssoort als bedoeld in de [paragrafen 2.2 tot en met 2.4.][ref1]


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0011453
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 2.2.1
    text: 'Voor studiefinanciering kan een student in aanmerking komen die:'
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel2.2
  - number: 2.2.1.a
    text: de Nederlandse nationaliteit bezit,
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel2.2
  - number: 2.2.1.b
    text: |-
      niet de Nederlandse nationaliteit bezit maar wel ingevolge een verdrag of een besluit van een volkenrechtelijke
      organisatie op het terrein van de studiefinanciering met een Nederlander wordt gelijkgesteld, of
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel2.2
  - number: 2.2.1.c
    text: |-
      niet de Nederlandse nationaliteit bezit maar wel in Nederland woont en behoort tot een bij algemene maatregel
      van bestuur aangewezen groep van personen die voor het terrein van de studiefinanciering met Nederlanders worden
      gelijkgesteld.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel2.2
  - number: 2.2.2
    text: |-
      Onverminderd het eerste lid, onderdeel b, kunnen bij algemene maatregel van bestuur groepen van personen worden
      aangewezen voor wie de gelijkstelling, bedoeld in het eerste lid, onderdeel b, slechts een tegemoetkoming in de
      kosten van de toegang tot het onderwijs betreft. Bij algemene maatregel van bestuur kunnen regels worden gesteld
      met betrekking tot de hoogte en de vorm van deze tegemoetkoming.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel2.2
  - number: 2.3.1
    text: 'Een mbo-student kan in aanmerking komen voor:'
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel2.3
  - number: 2.3.1.a
    text: een reisvoorziening met ingang van de eerste dag van de maand waarin hij beroepsonderwijs is gaan volgen;
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel2.3
  - number: 2.3.1.b
    text: 'studiefinanciering met ingang van:'
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel2.3
  - number: 2.3.1.b.1°
    text: de eerste dag van de maand volgend op het kwartaal waarin hij de leeftijd van 18 jaren heeft bereikt; of
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel2.3
  - number: 2.3.1.b.2°
    text: de eerste dag van het kwartaal indien hij op die dag de leeftijd van 18 jaren heeft bereikt.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel2.3
  - number: 2.3.2
    text: |-
      Voor studiefinanciering kan een ho-student in aanmerking komen met ingang van de eerste dag van de maand waarin hij
      hoger onderwijs is gaan volgen.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel2.3
  - number: 2.3.3
    text: |-
      Voor studiefinanciering kan een student in aanmerking komen tot en met de maand waarin hij de leeftijd van 30 jaren
      heeft bereikt.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel2.3
  - number: 2.3.4
    text: |-
      In afwijking van het derde lid behoudt een student bij het bereiken van de leeftijd van 30 jaren zijn aanspraak,
      zolang hij zonder onderbreking studiefinanciering geniet.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel2.3
  - number: 2.3a.1
    text: |-
      In afwijking van [artikel 2.3, eerste en derde lid][ref1], kan een mbo-student voor levenlanglerenkrediet in
      aanmerking komen die 30 jaren of ouder is maar nog niet de leeftijd van 55 jaren heeft bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel2
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel2.3a
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 2.3a.2
    text: |-
      In afwijking van [artikel 2.3, tweede en derde lid][ref1], kan een ho-student voor levenlanglerenkrediet in
      aanmerking komen die nog niet de leeftijd van 55 jaren heeft bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel2
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel2.3a
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 2.3a.3
    text: |-
      In afwijking van het eerste en tweede lid behoudt een student bij het bereiken van de leeftijd van 55 jaren zijn
      aanspraak, zolang hij zonder onderbreking levenlanglerenkrediet geniet.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel2.3a
  - number: '2.4'
    text: 'Voor studiefinanciering kan een mbo-student in aanmerking komen die is ingeschreven aan:'
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel2.4
  - number: 2.4.a
    text: |-
      een instelling als bedoeld in [artikel 1.1.1, onderdeel b, van de WEB][ref1], voor zover het een uit 's Rijks kas
      bekostigde beroepsopleiding betreft, of


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel2.4
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
  - number: 2.4.b
    text: |-
      een instelling die ten aanzien van de beroepsopleiding het in [artikel 1.4.1 van de WEB][ref1] bedoelde recht heeft
      verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel2.4
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
  - number: 2.5.1
    text: |-
      Een mbo-student heeft geen aanspraak op studiefinanciering indien hij is ingeschreven aan een opleiding waarvan de
      duur, daaronder begrepen ten hoogste 12 vakantieweken, korter is dan 1 jaar.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel2.5
  - number: 2.5.2
    text: |-
      De aanspraak op studiefinanciering van een mbo-student als bedoeld in [artikel 4.1, onderdeel a of b][ref1],
      die gedurende een aaneengesloten periode van 8 weken geen lessen of beroepspraktijkvorming heeft gevolgd,
      vervalt met ingang van de eerste dag van de maand volgend op die waarin de instelling de afwezigheid, bedoeld in
      [artikel 4.3][ref2], aan Onze Minister heeft medegedeeld. De periode van 8 weken wordt verlengd met de weken waarin
      vanwege vakantie geen onderwijs werd verzorgd.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel4
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel2.5
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.1.1
        afdeling: '4.1'
      - id: ref2
        bwb_id: BWBR0011453
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.1.1
        afdeling: '4.1'
  - number: 2.5.3
    text: |-
      De aanspraak op studiefinanciering vervalt over het tijdvak waarover een mbo-student de gegevens, bedoeld in
      [artikel 4.19][ref1], niet verstrekt. Zolang hij deze gegevens over een studiejaar niet verstrekt, heeft hij tevens
      geen aanspraak op studiefinanciering voor de daarop volgende studiejaren. Indien hij ontbrekende gegevens alsnog
      levert, herleeft de aanspraak.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel4
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel2.5
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.2.2
        afdeling: '4.2'
  - number: 2.7.1
    text: |-
      De aanspraak op studiefinanciering vervalt met ingang van de maand die volgt op de dag waarop de mbo-student het
      laatste studiejaar van een opleiding met goed gevolg heeft afgesloten.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel2.7
  - number: 2.7.2
    text: |-
      Indien de mbo-student aansluitend aan het studiejaar dat als laatste studiejaar was aangemerkt, opnieuw dat laatste
      studiejaar aanvangt, ontstaat aanspraak op studiefinanciering voor het resterende gedeelte van het kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel2.7
  - number: 2.7.3
    text: |-
      Indien de mbo-student na zijn uitschrijving voor een opleiding binnen 4 maanden opnieuw deze opleiding aanvangt
      of een andere opleiding in de zin van deze wet gaat volgen, blijft, in afwijking van het eerste lid, op zijn
      aanvraag de aanspraak op studiefinanciering in de tussen beide opleidingen liggende periode voor ten hoogste 4
      maanden bestaan. Hij wordt in die periode aangemerkt als mbo-student aan de eerste opleiding. In afwijking van
      [artikel 3.21, tweede lid][ref1], kan de aanvraag in het daarop volgende studiejaar worden ingediend indien de
      uitschrijving binnen vier maanden voor het einde van het desbetreffende studiejaar heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel3
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel2.7
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.6'
  - number: 2.7a
    text: 'Een mbo-student aan een opleiding niveau 3 of 4 heeft geen aanspraak op studiefinanciering beroepsonderwijs:'
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel2.7a
  - number: 2.7a.a
    text: |-
      indien hij na het verstrijken van zijn aanspraak op prestatiebeurs beroepsonderwijs gedurende 36 maanden een lening
      heeft genoten, of
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel2.7a
  - number: 2.7a.b
    text: |-
      indien er 10 jaren verstreken zijn met ingang van de maand waarover voor het eerst studiefinanciering in de zin
      van de [paragrafen 4.1.2][ref1] of [4.2.3][ref2] is toegekend voor het volgen van beroepsonderwijs of op grond van
      de [Wet studiefinanciering BES][ref3] is toegekend voor het volgen van beroepsonderwijs aan een opleiding niveau 3
      of 4.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Hoofdstuk4
      [ref3]: https://wetten.overheid.nl/BWBR0028393
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel2.7a
    references:
      - id: ref1
        bwb_id: BWBR0011453
        hoofdstuk: '4'
        paragraaf: 4.1.2
        afdeling: '4.1'
      - id: ref2
        bwb_id: BWBR0011453
        hoofdstuk: '4'
        paragraaf: 4.2.3
        afdeling: '4.2'
      - id: ref3
        bwb_id: BWBR0028393
  - number: 2.7a.c
    text: |-
      In afwijking van onderdeel b wordt, indien [artikel 4.14, eerste lid][ref1], toepassing vindt, de termijn van 10
      jaren, genoemd in onderdeel b, verlengd met de duur van de in dat artikel bedoelde bijzondere omstandigheden.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel4
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel2.7a
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.1.2
        afdeling: '4.1'
  - number: 2.7a.d
    text: |-
      In afwijking van onderdeel b wordt, indien [artikel 4.14, tweede lid][ref1], toepassing vindt, de termijn van 10
      jaren, genoemd in onderdeel b, verlengd met 5 jaren.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel4
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel2.7a
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.1.2
        afdeling: '4.1'
  - number: 2.7b
    text: |-
      De [artikelen 2.7][ref1] en [2.7a][ref2] zijn niet van toepassing op het levenlanglerenkrediet.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel2
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel2.7b
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0011453
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 2.8.1
    text: |-
      Voor studiefinanciering kan een ho-student in aanmerking komen die is ingeschreven voor het volgen van een
      voltijdse associate degree-opleiding, voltijdse bacheloropleiding of een voltijdse masteropleiding aan een
      universiteit of hogeschool, opgenomen in de [bijlage van de WHW](onbekend) of aan een rechtspersoon voor hoger
      onderwijs als bedoeld in [artikel 1.1 van de WHW][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel2.8
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
  - number: 2.8.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing gedurende de termijn, bedoeld in de
      [artikelen 5.21, tweede en zesde lid][ref1], 5.33 en [6.5, tweede lid, van de WHW][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel6
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel2.8
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '6'
  - number: '2.10'
    text: |-
      Voor studiefinanciering kan een ho-student in aanmerking komen die is ingeschreven voor het volgen van een
      voltijdse wetenschappelijk theologische opleiding ten behoeve waarvan aan het desbetreffende kerkgenootschap
      vanwege het Rijk een bijdrage wordt verleend.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel2.10
  - number: '2.11'
    text: |-
      Voor studiefinanciering kan een ho-student in aanmerking komen die is ingeschreven voor het volgen van bij
      algemene maatregel van bestuur aangewezen hoger onderwijs dat anders dan op grond van de [WHW][ref1], volledig en
      rechtstreeks uit de openbare kas wordt bekostigd.


      [ref1]: https://wetten.overheid.nl/BWBR0005682
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel2.11
    references:
      - id: ref1
        bwb_id: BWBR0005682
  - number: '2.12'
    text: 'Een ho-student kan in aanmerking komen voor levenlanglerenkrediet, indien hij is ingeschreven voor het volgen van:'
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel2.12
  - number: 2.12.a
    text: |-
      een opleiding als bedoeld in de [artikelen 2.8 tot en met 2.11][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel2
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel2.12
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 2.12.b
    text: |-
      een postinitiële masteropleiding als bedoeld in [artikel 7.3b van de WHW][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel2.12
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
  - number: 2.12.c
    text: |-
      een deeltijdse opleiding in het hoger onderwijs, bedoeld in [artikel 7.7, eerste lid, van de WHW][ref1], waaraan
      accreditatie als bedoeld in [artikel 1.1, onderdeel q, van de WHW][ref2] is verleend; of


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel2.12
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '1'
  - number: 2.12.d
    text: |-
      een of meer onderwijseenheden als bedoeld in [artikel 7.3, tweede lid, van de WHW][ref1], van een opleiding waaraan
      accreditatie als bedoeld in [artikel 1.1, onderdeel q, van de WHW][ref2] is verleend, aan:


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel2.12
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '1'
  - number: 2.12.d.1°
    text: de Open Universiteit;
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel2.12
  - number: 2.12.d.2°
    text: |-
      een rechtspersoon voor hoger onderwijs als bedoeld in [artikel 1.1 van de WHW][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel2.12
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
  - number: 2.12.d.3°
    text: |-
      een bekostigde instelling voor hoger onderwijs als bedoeld in [artikel 1.8, eerste lid, van de WHW][ref1],
      met uitzondering van de Open Universiteit, in bij ministeriële regeling te bepalen gevallen,
      waarin bij wijze van experiment op grond van [artikel 1.7a van de WHW][ref2], in afwijking van
      [artikel 7.32, derde lid, van de WHW][ref3], inschrijving voor een onderwijseenheid is toegestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel2.12
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0005682
        artikel: '7'
  - number: 2.13.1
    text: 'Een ho-student heeft geen aanspraak op studiefinanciering:'
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel2.13
  - number: 2.13.1.a
    text: |-
      indien hij na het verstrijken van zijn aanspraak op prestatiebeurs hoger onderwijs gedurende 36 maanden een lening
      heeft genoten,
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel2.13
  - number: 2.13.1.b
    text: |-
      indien er 10 jaren verstreken zijn met ingang van de maand waarover voor het eerst studiefinanciering is toegekend
      voor het volgen van hoger onderwijs, op grond van deze wet of op grond van de [Wet studiefinanciering BES][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0028393
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel2.13
    references:
      - id: ref1
        bwb_id: BWBR0028393
  - number: 2.13.1.c
    text: |-
      indien hij is ingeschreven aan een opleiding waarvan de duur, daaronder begrepen ten hoogste 12 vakantieweken,
      korter is dan 1 jaar, of
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel2.13
  - number: 2.13.1.d
    text: |-
      indien hij in het betreffende studiefinancieringstijdvak aanspraak maakt op een tegemoetkoming in de kosten voor
      de toegang tot het onderwijs of voor levensonderhoud, die door de voor de verstrekking van deze tegemoetkomingen
      verantwoordelijke autoriteit van een ander land wordt verstrekt.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel2.13
  - number: 2.13.2
    text: |-
      De aanspraak van een ho-student die een opleiding volgt als bedoeld in [artikel 2.14][ref1] vervalt over het
      tijdvak waarover hij de inlichtingen, bedoeld in [artikel 9.2, eerste lid][ref2], niet verstrekt. Zolang hij die
      inlichtingen over een studiejaar niet verstrekt, heeft hij tevens geen aanspraak op studiefinanciering voor de
      daarop volgende studiejaren. Indien hij die inlichtingen alsnog verstrekt, herleeft de aanspraak.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel9
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel2.13
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.4'
      - id: ref2
        bwb_id: BWBR0011453
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '9.2'
  - number: 2.13.3
    text: |-
      In afwijking van het eerste lid, onderdeel b, wordt, indien [artikel 5.16, eerste lid][ref1], toepassing vindt, de
      termijn van 10 jaren, genoemd in het eerste lid, onderdeel b, verlengd met de duur van de in dat artikel bedoelde
      bijzondere omstandigheden.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel5
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel2.13
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.7'
  - number: 2.13.4
    text: |-
      In afwijking van het eerste lid, onderdeel b, wordt, indien [artikel 5.16, tweede lid][ref1], toepassing vindt, de
      termijn van 10 jaren, genoemd in het eerste lid, onderdeel b, verlengd met 5 jaren.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel5
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel2.13
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.7'
  - number: 2.13.5
    text: |-
      Het eerste lid, onderdelen a en b, en het tweede tot en met vierde lid zijn niet van toepassing op het
      levenlanglerenkrediet.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel2.13
  - number: 2.13a.1
    text: |-
      Voor studiefinanciering, met uitzondering van het levenlanglerenkrediet, kan een mbo-student in aanmerking komen
      die is ingeschreven voor het volgen van onderwijs aan een opleiding buiten Nederland:
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel2.13a
  - number: 2.13a.1.a
    text: |-
      waarvan het niveau en de kwaliteit vergelijkbaar is met overeenkomstige Nederlandse opleidingen in de zin van de
      [WEB][ref1] en waarvan het afsluitend examen vergelijkbaar is met een afsluitend examen voor een opleiding in de
      zin van de WEB, en


      [ref1]: https://wetten.overheid.nl/BWBR0007625
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel2.13a
    references:
      - id: ref1
        bwb_id: BWBR0007625
  - number: 2.13a.1.b
    text: die overigens voldoet aan bij ministeriële regeling vastgestelde criteria.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel2.13a
  - number: 2.13a.2
    text: |-
      Onze Minister stelt vast of een opleiding buiten Nederland voldoet aan de criteria, bedoeld in het eerste lid. Onze
      Minister stelt tevens vast of de opleiding wordt aangemerkt als een opleiding niveau 1 of 2 of een opleiding niveau
      3 of 4. De opleiding wordt aangemerkt als een opleiding niveau 1 of 2 onderscheidenlijk een opleiding niveau 3 of 4
      indien deze vergelijkbaar is met een opleiding niveau 1 of 2 onderscheidenlijk een opleiding niveau 3 of 4.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel2.13a
  - number: 2.13a.3
    text: |-
      Dit artikel is niet van toepassing op mbo-studenten die op grond van [artikel 2.2, tweede lid][ref1], slechts een
      tegemoetkoming in de kosten van de toegang tot het onderwijs ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel2
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel2.13a
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 2.14.1
    text: |-
      Dit artikel is niet van toepassing op het levenlanglerenkrediet en op ho-studenten die op grond van
      [artikel 2.2, tweede lid][ref1], slechts een tegemoetkoming in de kosten van de toegang tot het onderwijs
      ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel2
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel2.14
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 2.14.2
    text: |-
      Een ho-student die is ingeschreven voor het volgen van onderwijs aan een opleiding in het hoger onderwijs buiten
      Nederland, bedoeld in het derde lid, komt in aanmerking voor studiefinanciering indien hij:
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel2.14
  - number: 2.14.2.a
    text: |-
      gebruik heeft gemaakt van het vrij verkeer bedoeld in het Verdrag betreffende de werking van de Europese Unie en op
      grond van bij algemene maatregel van bestuur vastgestelde criteria een band heeft met Nederland; of
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel2.14
  - number: 2.14.2.b
    text: |-
      ten minste 3 jaren van de 6 jaren voorafgaand aan diens inschrijving aan die opleiding in Nederland heeft gewoond
      en gedurende deze periode rechtmatig verblijf heeft gehad, waarbij de periode gedurende welke een ho-student is
      ingeschreven aan een opleiding buiten Nederland als bedoeld in het derde lid, niet meetelt voor de bepaling van
      deze 6 jaren.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel2.14
  - number: 2.14.3
    text: |-
      Van een opleiding in het hoger onderwijs buiten Nederland waarvoor studiefinanciering wordt toegekend is sprake
      indien:
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel2.14
  - number: 2.14.3.a
    text: in Nederland voor een vergelijkbaar soort opleiding studiefinanciering wordt verstrekt;
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel2.14
  - number: 2.14.3.b
    text: |-
      het niveau en de kwaliteit van de opleiding vergelijkbaar zijn met overeenkomstige opleidingen in de zin van de
      WHW;
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel2.14
  - number: 2.14.3.c
    text: |-
      het afsluitend examen voor de opleiding vergelijkbaar is met een afsluitend examen voor overeenkomstige opleidingen
      in de zin van de WHW; en
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel2.14
  - number: 2.14.3.d
    text: de opleiding voldoet aan criteria die bij ministeriële regeling kunnen worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel2.14
  - number: 2.14.4
    text: |-
      Onze Minister stelt vast of een opleiding buiten Nederland voldoet aan de criteria, bedoeld in het derde lid. Onze
      Minister stelt voor de opleiding buiten Nederland de duur en de vorm van de studiefinanciering vast overeenkomstig
      de duur en de vorm waarin deze voor een vergelijkbare opleiding in Nederland wordt verstrekt.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel2.14
  - number: 2.14.5
    text: |-
      Het [tweede en derde lid van artikel 2.2 van de Wet inkomstenbelasting 2001][ref1] zijn van overeenkomstige
      toepassing op het tweede lid. Het tweede en derde lid van artikel 2.2 van de Wet inkomstenbelasting 2001 zijn,
      voor de toepassing van de eerste volzin, tevens van overeenkomstige toepassing op personen met een andere dan de
      Nederlandse nationaliteit.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel2
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel2.14
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '2'
  - number: 2.14.6
    text: |-
      Bij ministeriële regeling kan een maximum worden gesteld aan het aantal aanvragen van ho-studenten voor
      studiefinanciering voor het volgen van onderwijs buiten Nederland.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel2.14
  - number: 2.14.7
    text: |-
      Het zesde lid is niet van toepassing op aanvragen van ho-studenten die in de 12 maanden voorafgaand aan de
      periode waarvoor studiefinanciering voor het volgen van onderwijs buiten Nederland wordt aangevraagd, reeds
      studiefinanciering voor het volgen van onderwijs buiten Nederland toegekend hebben gekregen.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel2.14
  - number: 2.14.8
    text: Bij ministeriële regeling kunnen nadere regels met betrekking tot de uitvoering van dit artikel worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel2.14
  - number: '2.15'
    text: |-
      De student die lesgeld is verschuldigd op grond van [artikel 5, tweede lid, van de Les- en cursusgeldwet][ref1]
      en tevens voor het volgen van hoger onderwijs aanspraak heeft op studiefinanciering, geldt voor de toekenning van
      studiefinanciering niet als mbo-student.


      [ref1]: https://wetten.overheid.nl/BWBR0004188#Artikel5
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel2.15
    references:
      - id: ref1
        bwb_id: BWBR0004188
        artikel: '5'
  - number: 2.15a.1
    text: |-
      De mbo-student die aanspraak heeft op studiefinanciering voor het volgen van een opleiding niveau 3 of 4, heeft
      geen aanspraak op studiefinanciering voor een opleiding niveau 1 of 2.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel2.15a
  - number: 2.15a.2
    text: |-
      De mbo-student die aanspraak heeft op studiefinanciering voor een opleiding niveau 1 of 2 buiten Nederland heeft
      geen aanspraak op studiefinanciering voor een opleiding niveau 1 of 2 in Nederland.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel2.15a
  - number: 2.15a.3
    text: |-
      De mbo-student die voor 1 augustus 2005 voor het volgen van beroepsonderwijs studiefinanciering ontving en
      die studiefinanciering ontvangt voor een opleiding op niveau 3 of 4 buiten Nederland, heeft geen aanspraak op
      studiefinanciering voor een opleiding niveau 1 of 2.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel2.15a
  - number: 2.15a.4
    text: |-
      De mbo-student die voor 1 augustus 2005 voor het volgen van beroepsonderwijs studiefinanciering ontving en die
      studiefinanciering ontvangt voor een beroepsopleiding buiten Nederland, heeft geen aanspraak op studiefinanciering
      voor een opleiding niveau 3 of 4 in Nederland.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel2.15a
  - number: 2.16.1
    text: |-
      De mbo-student heeft geen aanspraak op studiefinanciering voor een opleiding niveau 1 of 2, indien hij reeds 4
      jaren prestatiebeurs beroepsonderwijs heeft genoten.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel2.16
  - number: 2.16.2
    text: |-
      De student heeft geen aanspraak op studiefinanciering beroepsonderwijs indien hij reeds 4 jaren prestatiebeurs
      hoger onderwijs heeft genoten.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel2.16
  - number: 2.16.3
    text: Het eerste en tweede lid zijn niet van toepassing op het levenlanglerenkrediet.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel2.16
  - number: 2.17.1
    text: |-
      Een mbo-student die voor ten minste één maand rechtens zijn vrijheid is ontnomen, heeft,
      behoudens in de gevallen, bedoeld in de [Wet verplichte geestelijke gezondheidszorg][ref1], in
      de [Wet zorg en dwang psychogeriatrische en verstandelijk gehandicapte cliënten][ref2] en in
      [artikel 2.3 van de Wet forensische zorg][ref3] en de gevallen, bedoeld in [hoofdstuk 6 van de Jeugdwet][ref4], met
      ingang van de eerste dag van de maand volgend op de maand waarin de vrijheidsontneming ten minste één maand heeft
      geduurd slechts aanspraak op studiefinanciering voor een thuiswonende mbo-student.


      [ref1]: https://wetten.overheid.nl/BWBR0040635
      [ref2]: https://wetten.overheid.nl/BWBR0040632
      [ref3]: https://wetten.overheid.nl/BWBR0040634#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0034925#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel2.17
    references:
      - id: ref1
        bwb_id: BWBR0040635
      - id: ref2
        bwb_id: BWBR0040632
      - id: ref3
        bwb_id: BWBR0040634
        artikel: '2'
      - id: ref4
        bwb_id: BWBR0034925
        hoofdstuk: '6'
  - number: 2.17.2
    text: |-
      Voor de toepassing van het eerste lid worden perioden van vrijheidsontneming samengeteld, indien zij elkaar met een
      onderbreking van minder dan vier weken opvolgen.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel2.17
  - number: 2.17.3
    text: |-
      Het eerste en tweede lid zijn niet van toepassing op bij algemene maatregel van bestuur aan te wijzen groepen van
      personen waarbij tenuitvoerlegging van een vrijheidsstraf of vrijheidsbenemende maatregel buiten een justitiële
      inrichting plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel2.17
  - number: 2.17a.1
    text: Een student heeft geen aanspraak op studiefinanciering indien hij een uitreiziger is.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel2.17a
  - number: 2.17a.2
    text: |-
      Onze Minister kan besluiten dat een student een uitreiziger is indien het betreft een persoon ten aanzien van wie
      uit een melding van de door de daartoe bevoegde opsporingsdiensten of inlichtingen- en veiligheidsdiensten, gericht
      aan Onze Minister, is gebleken dat het gegronde vermoeden bestaat dat de student zich buiten het land Nederland
      bevindt met het doel zich aan te sluiten bij een organisatie die door Onze Minister van Veiligheid en Justitie, in
      overeenstemming met het gevoelen van de Rijksministerraad, is geplaatst op een lijst van organisaties die deelnemen
      aan een nationaal of internationaal gewapend conflict en een bedreiging vormen voor de nationale veiligheid.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel2.17a
  - number: 2.17a.3
    text: |-
      In het besluit van Onze Minister dat een student een uitreiziger is, wordt vermeld vanaf welk moment een student
      als uitreiziger is aangemerkt.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel2.17a
  - number: 3.1.1
    text: |-
      Studiefinanciering bestaat voor een opleiding in het beroepsonderwijs uit een basisbeurs, een basislening en een
      aanvullende beurs of aanvullende lening, en kan geheel of gedeeltelijk worden toegekend in de vorm van:
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.1
  - number: 3.1.1.a
    text: een gift;
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.1
  - number: 3.1.1.b
    text: een prestatiebeurs; of
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.1
  - number: 3.1.1.c
    text: een lening.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.1
  - number: 3.1.2
    text: |-
      Studiefinanciering bestaat voor een opleiding in het hoger onderwijs uit een basislening, een aanvullende beurs of
      aanvullende lening en collegegeldkrediet, en kan geheel of gedeeltelijk worden toegekend in de vorm van:
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.1
  - number: 3.1.2.a
    text: een gift;
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.1
  - number: 3.1.2.b
    text: een prestatiebeurs; of
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.1
  - number: 3.1.2.c
    text: een lening.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.1
  - number: 3.1.3
    text: |-
      Indien een student geen aanspraak heeft op studiefinanciering als bedoeld in het eerste of tweede lid bestaat
      studiefinanciering uit levenlanglerenkrediet.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.1
  - number: 3.1.4
    text: De hoogte van de studiefinanciering wordt vastgesteld op basis van een budget voor een kalendermaand.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.1
  - number: 3.1.5
    text: |-
      In afwijking van het vierde lid kan de hoogte van de studiefinanciering ook worden vastgesteld op een
      tegemoetkoming in de kosten van de toegang tot het onderwijs.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.1
  - number: 3.2.1
    text: 'Het budget voor een mbo-student voor een kalendermaand is het totaal van:'
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.2
  - number: 3.2.1.a
    text: een normbedrag voor de kosten van levensonderhoud,
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.2
  - number: 3.2.1.b
    text: een tegemoetkoming in de kosten van het lesgeld, en
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.2
  - number: 3.2.1.c
    text: een reisvoorziening.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.2
  - number: 3.2.2
    text: |-
      Dit budget kan worden verhoogd met een toeslag voor een eenoudergezin ingevolge [artikel 3.5][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel3
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 3.2.3
    text: |-
      De tegemoetkoming in de kosten van het lesgeld wordt voor een mbo-student vastgesteld op eentwaalfde deel van
      het op grond van [artikel 5, tweede lid, van de Les- en cursusgeldwet][ref1] vastgestelde of herziene bedrag
      van het lesgeld. Het bedrag van de maximale aanvullende beurs, bedoeld in de [artikelen 3.13, eerste lid][ref2],
      [3.16][ref3] en [3.18][ref4], wordt voor een mbo-student verhoogd met het bedrag van de tegemoetkoming.


      [ref1]: https://wetten.overheid.nl/BWBR0004188#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011453#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0011453#Artikel3
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.2
    references:
      - id: ref1
