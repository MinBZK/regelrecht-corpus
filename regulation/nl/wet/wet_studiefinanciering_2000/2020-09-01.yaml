  - number: 12.1b.3
    text: |-
      In aanvulling op [artikel 2.8][ref1] kan tot een bij koninklijk besluit te bepalen tijdstip een ho-student voor
      studiefinanciering in aanmerking komen die is ingeschreven voor het volgen van een voltijdse associate degree-
      opleiding, een voltijdse bacheloropleiding of een voltijdse masteropleiding aan een aangewezen instelling als
      bedoeld in de [artikelen 6.9][ref2] of [16.10 van de WHW][ref3], zoals die artikelen luidden op 31 augustus 2010.


