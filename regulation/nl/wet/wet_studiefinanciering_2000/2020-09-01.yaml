  - number: 9.1a.1.b
    text: de bij besluit van het college van burgemeester en wethouders aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel9.1a
  - number: 9.1a.2
    text: |-
      Indien de ambtenaren of andere personen, bedoeld in het eerste lid, onder a, die worden aangewezen, ressorteren
      onder een andere minister, wordt het besluit samen met die minister genomen.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel9.1a
  - number: 9.1a.3
    text: Van een besluit als bedoeld in het eerste lid, onder b, wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel9.1a
  - number: 9.1a.4
    text: |-
      De toezichthouder beschikt niet over de bevoegdheden, genoemd in de [artikelen 5:18][ref1] en
      [5:19 van de Algemene wet bestuursrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel9.1a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 9.1b.1
    text: |-
      De toezichthouders, bedoeld in [artikel 9.1a][ref1], en Onze Minister wisselen de persoonsgegevens en inlichtingen
      uit die nodig zijn voor de uitoefening van het toezicht onder vermelding van het burgerservicenummer of, bij het
      ontbreken daarvan, het onderwijsnummer van de mbo-student op wie de persoonsgegevens of inlichtingen betrekking
      hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel9
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel9.1b
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '9.1'
  - number: 9.1b.2
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld over de wijze van verstrekking van
      persoonsgegevens en inlichtingen op grond van het eerste lid en wordt een nadere specificatie gegeven van de
      persoonsgegevens en inlichtingen die op grond van het eerste lid worden verwerkt.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel9.1b
  - number: 9.2.1
    text: |-
      Een ieder is verplicht aan Onze Minister of aan een daartoe door of vanwege Onze Minister aangewezen persoon of
      instantie desgevraagd de ten behoeve van de uitvoering van deze wet benodigde inlichtingen over zichzelf te geven.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel9.2
  - number: 9.2.2
    text: |-
      De inlichtingen worden verstrekt binnen een door Onze Minister of door een in het eerste lid bedoelde persoon of
      instantie te stellen redelijke termijn.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel9.2
  - number: 9.2.3
    text: |-
      Inlichtingen over zichzelf, voor zover zij kunnen leiden tot de toekenning van minder studiefinanciering of tot
      verhoging van het bedrag van de termijnbetalingen worden steeds ongevraagd en schriftelijk verstrekt door de
      student onderscheidenlijk door de debiteur, onmiddellijk na het bekend worden van die gegevens. De inlichtingen,
      bedoeld in de eerste volzin, omvatten niet het doorgeven van een wijziging van het adres als bedoeld in de
      [Wet basisregistratie personen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0033715
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel9.2
    references:
      - id: ref1
        bwb_id: BWBR0033715
  - number: 9.2.4
    text: |-
      Onze Minister kan bepalen dat de inlichtingen, bedoeld in het eerste tot en met het derde lid, worden verstrekt op
      een bij ministeriële regeling vast te stellen wijze.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel9.2
  - number: '9.3'
    text: |-
      Een studentendecaan aan een op grond van de [WHW][ref1] uit 's Rijks kas bekostigde instelling voor hoger onderwijs
      kan zich verschonen betreffende hetgeen een ho-student aan hem heeft toevertrouwd:


      [ref1]: https://wetten.overheid.nl/BWBR0005682
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel9.3
    references:
      - id: ref1
        bwb_id: BWBR0005682
  - number: 9.3.a
    text: |-
      in afwijking van [artikel 5:17 van de Algemene wet bestuursrecht][ref1] bij de verplichting tot inzage van gegevens
      en bescheiden en het verstrekken van inlichtingen, en


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel9.3
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 9.3.b
    text: |-
      in afwijking van [artikel 8:33, eerste lid, van de Algemene wet bestuursrecht][ref1] bij de behandeling van een
      beroep of hoger beroep tegen een besluit, genomen op grond van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel9.3
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 9.5.1
    text: |-
      De natuurlijke persoon van wie of het bestuur van de rechtspersoon waarvan een instelling uitgaat die onderwijs
      aanbiedt als bedoeld in de [artikelen 2.4][ref1], [2.8][ref2], [2.10][ref3], [2.11][ref4] en [2.12][ref5], is
      verplicht op een bij ministeriële regeling aan te geven wijze kosteloos inlichtingen te verstrekken, benodigd voor
      de uitvoering van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0011453#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0011453#Artikel2
      [ref5]: https://wetten.overheid.nl/BWBR0011453#Artikel2
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel9.5
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0011453
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref3
        bwb_id: BWBR0011453
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref4
        bwb_id: BWBR0011453
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref5
        bwb_id: BWBR0011453
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 9.5.2
    text: |-
      Onze Minister kan voor instellingen of groepen van instellingen waarop [artikel 7.9d van de WHW][ref1] niet
      van toepassing is, bepalen dat de natuurlijke persoon van wie of het bestuur van de rechtspersoon waarvan die
      instelling uitgaat, voor het einde van de maand volgend op de maand waarin een ho-student het afsluitend examen van
      een opleiding in het hoger onderwijs met goed gevolg heeft afgelegd, daarvan mededeling doet aan Onze Minister en
      gelijktijdig de ho-student van die mededeling in kennis stelt.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel9.5
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
  - number: 9.6.1
    text: |-
      Organen met een publiekrechtelijke taak zijn verplicht op een bij algemene maatregel van bestuur aan te geven wijze
      kosteloos inlichtingen te verstrekken, benodigd voor de uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel9.6
  - number: 9.6.2
    text: |-
      RSR verstrekt op verzoek van Onze Minister voor de uitvoering van [artikel 3.27, tweede lid][ref1], het gegeven of
      een persoon in een bepaalde periode nadat zijn reisproduct op grond van artikel 3.27, eerste lid, zou moeten zijn
      stopgezet, gebruik heeft gemaakt van het reisproduct.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel3
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel9.6
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.7'
  - number: 9.6.3
    text: |-
      Voor de uitvoering van het eerste lid, verstrekt de rechtspersoon die tot taak heeft de uitgifte van OV-chipkaarten
      en het beheer van de aan de OV-chipkaart gekoppelde reisgegevens, op verzoek van RSR het gegeven of binnen een
      bepaalde periode gebruik is gemaakt van het reisproduct op een bepaalde OV-chipkaart.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel9.6
  - number: 9.6.4
    text: |-
      Onze Minister verwerkt de persoonsgegevens die hij ontvangt of bezit voor de uitvoering van
      [artikel 3.27, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel3
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel9.6
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.7'
  - number: 9.6a.1
    text: |-
      Onze Minister verwerkt de persoonsgegevens die hij ontvangt of bezit ten behoeve van de toepassing van
      [artikel 2.17a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel2
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel9.6a
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: 9.6a.2
    text: |-
      Bij de verwerking van gegevens op grond van het eerste lid kunnen bijzondere categorieën van persoonsgegevens
      en persoonsgegevens van strafrechtelijke aard als bedoeld in [paragraaf 3.1][ref1] onderscheidenlijk
      [paragraaf 3.2 van de Uitvoeringswet Algemene verordening gegevensbescherming][ref2] worden verwerkt, voor zover
      deze gegevens noodzakelijk zijn voor de toepassing van [artikel 2.17a][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.1
      [ref2]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.2
      [ref3]: https://wetten.overheid.nl/BWBR0011453#Artikel2
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel9.6a
    references:
      - id: ref1
        bwb_id: BWBR0040940
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0040940
        paragraaf: '3.2'
      - id: ref3
        bwb_id: BWBR0011453
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: 9.6a.3
    text: |-
      Ten behoeve van de toepassing van [artikel 2.17a][ref1] verstrekt Onze Minister uitsluitend het gegeven of een
      persoon studiefinanciering heeft aangevraagd dan wel reeds ontvangt.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel2
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel9.6a
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: 9.6a.4
    text: |-
      [Artikel 1.7][ref1] is voor de gegevensverwerking, bedoeld in dit artikel, van overeenkomstige toepassing voor een
      persoon die studiefinanciering heeft aangevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel1
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel9.6a
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '1'
        hoofdstuk: '1'
  - number: 9.6a.5
    text: |-
      Bij ministeriële regeling worden regels gesteld ter waarborging van de persoonlijke levenssfeer. Daarbij worden in
      ieder geval regels gesteld over:
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel9.6a
  - number: 9.6a.5.a
    text: op welke wijze de gegevensverwerking bedoeld in dit artikel, plaatsvindt;
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel9.6a
  - number: 9.6a.5.b
    text: |-
      op welke wijze door passende technische en organisatorische maatregelen deze gegevens worden beveiligd tegen
      verlies of onrechtmatige verwerking;
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel9.6a
  - number: 9.6a.5.c
    text: |-
      op welke wijze wordt gewaarborgd dat de verwerkte persoonsgegevens slechts worden verwerkt voor het doel waarvoor
      zij zijn verzameld, alsmede hoe daarop wordt toegezien.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel9.6a
  - number: 9.6b.1
    text: |-
      Onze Minister is bevoegd de persoonsgegevens die bij hem bekend zijn als gevolg van de uitvoering van zijn
      wettelijke taken te verstrekken aan of uit te wisselen met de voor de verstrekking van een tegemoetkoming in de
      kosten voor toegang tot het onderwijs of voor levensonderhoud voor studenten verantwoordelijke autoriteit van een
      andere staat.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel9.6b
  - number: 9.6b.2
    text: |-
      De in het eerste lid bedoelde verantwoordelijke autoriteit toont voor de verstrekking van persoonsgegevens aan dat
      de student ten laste van die autoriteit een tegemoetkoming in de kosten voor de toegang tot het onderwijs of voor
      levensonderhoud heeft aangevraagd dan wel reeds ontvangt.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel9.6b
  - number: 9.6b.3
    text: |-
      Onze Minister kan, voor de uitvoering van de wet, inlichtingen over een student die studiefinanciering aanvraagt
      dan wel reeds ontvangt, opvragen bij het bevoegd gezag van een andere staat waar de student een opleiding wil gaan
      volgen of volgt met studiefinanciering op grond van [artikel 2.14, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel2
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel9.6b
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: '9.8'
    text: |-
      Indien een instelling als bedoeld in [artikel 2.4, onderdeel b][ref1], op enig moment in een studiejaar
      niet een administratie als bedoeld in [artikel 4.5, eerste lid][ref2], voert of niet na afloop van de in de
      [artikelen 4.3][ref3], [4.4][ref4] en [4.5][ref5] bedoelde periodes van onafgebroken afwezigheid zonder geldige
      reden aan Onze Minister de vereiste gegevens verstrekt, ontstaat er een vordering van Onze Minister op de
      instelling ter grootte van 15% van het bedrag van als gift vastgestelde studiefinanciering dat aan de mbo-studenten
      aan die instelling in het studiejaar waarin deze in gebreke was, is toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0011453#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0011453#Artikel4
      [ref5]: https://wetten.overheid.nl/BWBR0011453#Artikel4
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel9.8
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0011453
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.1.1
        afdeling: '4.1'
      - id: ref3
        bwb_id: BWBR0011453
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.1.1
        afdeling: '4.1'
      - id: ref4
        bwb_id: BWBR0011453
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.1.1
        afdeling: '4.1'
      - id: ref5
        bwb_id: BWBR0011453
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.1.1
        afdeling: '4.1'
  - number: 9.9.1
    text: |-
      Indien een mbo-student het normbedrag voor een uitwonende mbo-student toegekend heeft gekregen maar niet heeft
      voldaan aan de verplichtingen, bedoeld in [artikel 1.5][ref1], kan Onze Minister hem een bestuurlijke boete
      opleggen van ten hoogste 50 procent van het bedrag dat van de mbo-student in verband daarmee wordt teruggevorderd
      bij een herziening.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel1
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel9.9
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '1'
        hoofdstuk: '1'
  - number: 9.9.2
    text: |-
      De herziening vindt plaats met ingang van de datum van de laatste adreswijziging van de mbo-student in de
      basisregistratie personen. Indien de ouders van de mbo-student of een van hen na de laatste adreswijziging, bedoeld
      in de vorige volzin, zijn of is ingeschreven op hetzelfde woonadres als de mbo-student, dan vindt de herziening
      plaats met ingang van de dag van deze adreswijziging.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel9.9
  - number: 9.9.3
    text: |-
      Degene aan wie een bestuurlijke boete is opgelegd is verplicht desgevraagd aan Onze Minister de inlichtingen te
      verstrekken die voor de tenuitvoerlegging van de bestuurlijke boete van belang zijn.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel9.9
  - number: 9.9a.1
    text: |-
      Indien Onze Minister de mbo-student een bestuurlijke boete als bedoeld in [artikel 9.9, eerste lid][ref1], heeft
      opgelegd en de mbo-student heeft, nadat voormelde bestuurlijke boete onherroepelijk is geworden, voor een tweede
      maal niet voldaan aan de verplichtingen, bedoeld in [artikel 1.5][ref2], kan Onze Minister hem een bestuurlijke
      boete opleggen van ten hoogste 100 procent van het bedrag dat van de mbo-student in verband daarmee wordt
      teruggevorderd bij een herziening.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel1
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel9.9a
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '9.3'
      - id: ref2
        bwb_id: BWBR0011453
        artikel: '1'
        hoofdstuk: '1'
  - number: 9.9a.2
    text: |-
      De herziening vindt plaats met ingang van de dag na de laatste dag van de periode waarop de herziening, bedoeld in
      [artikel 9.9, eerste lid][ref1], ziet of, indien dit een latere datum betreft, de dag van de laatste adreswijziging
      van de mbo-student in de basisregistratie personen. Indien de ouders van de mbo-student of een van hen na de
      laatste dag van de periode waarop de herziening, bedoeld in artikel 9.9, eerste lid, ziet of na de laatste
      adreswijziging, bedoeld in de vorige volzin, zijn of is ingeschreven op hetzelfde woonadres als de mbo-student, dan
      vindt de herziening plaats met ingang van de dag van deze adreswijziging.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel9
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel9.9a
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '9.3'
  - number: 9.9a.3
    text: |-
      Indien Onze Minister de mbo-student een boete als bedoeld in het eerste lid heeft opgelegd kan hij tevens beslissen
      dat elke aanspraak op studiefinanciering vervalt.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel9.9a
  - number: 9.9a.4
    text: |-
      Degene aan wie een bestuurlijke boete is opgelegd is verplicht desgevraagd aan Onze Minister de inlichtingen te
      verstrekken die voor de tenuitvoerlegging van de bestuurlijke boete van belang zijn.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel9.9a
  - number: '9.10'
    text: |-
      Hij die niet voldoet aan een van de verplichtingen, bedoeld in [artikel 9.5][ref1], wordt gestraft met hechtenis
      van ten hoogste 6 maanden of geldboete van de derde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel9
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel9.10
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '9.2'
  - number: '9.11'
    text: |-
      Overtreding van bepalingen van een krachtens deze wet uitgevaardigde algemene maatregel van bestuur, voor zover
      uitdrukkelijk als strafbaar feit in de zin van dit artikel aangeduid, wordt gestraft met hechtenis van ten hoogste
      1 maand of geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel9.11
  - number: '9.12'
    text: |-
      De in de [artikelen 9.10][ref1] en [9.11][ref2] strafbaar gestelde feiten zijn overtredingen.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel9
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel9.12
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '9.4'
      - id: ref2
        bwb_id: BWBR0011453
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '9.4'
  - number: 10a.1
    text: |-
      Dit hoofdstuk is uitsluitend van toepassing op debiteuren die voor het studiejaar 2009–2010 voor het eerst
      studiefinanciering ontvingen, tenzij zij een aanvraag hebben ingediend als bedoeld in [artikel 10a.2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel10a
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel10a.1
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: 10a
        hoofdstuk: 10a
  - number: 10a.2.1
    text: |-
      Een debiteur die voor het studiejaar 2009–2010 voor het eerst studiefinanciering ontving en voor wie op 31 december
      2011 nog geen aflosfase is aangevangen, kan, op aanvraag, zijn schuld aflossen op grond van [paragraaf 6.1][ref1],
      waarbij de debiteur verzoekt dat de schuld wordt aangemerkt als:


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel10a.2
    references:
      - id: ref1
        bwb_id: BWBR0011453
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 10a.2.1.a
    text: |-
      een lening beroepsonderwijs als bedoeld in [artikel 6.1, tweede lid][ref1], of;


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel6
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel10a.2
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 10a.2.1.b
    text: |-
      een lening hoger onderwijs als bedoeld in[ artikel 6.1, tweede lid][ref1], uitsluitend voor zover het een debiteur
      betreft als bedoeld in[ artikel 12.14, vijfde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel12
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel10a.2
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
      - id: ref2
        bwb_id: BWBR0011453
        artikel: '12'
        hoofdstuk: '12'
        paragraaf: '12.2'
  - number: 10a.2.2
    text: Een debiteur dient een aanvraag als bedoeld in het eerste lid uitsluitend voor de aanvang van zijn aflosfase in.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel10a.2
  - number: 10a.2.3
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de goede uitvoering van het eerste
      lid.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel10a.2
  - number: 10a.3
    text: |-
      De [artikelen 6.1 tot en met 6.6][ref1], [6.8][ref2], [6.12][ref3], en [6.14 tot en met 6.17][ref4] zijn van
      overeenkomstige toepassing op debiteuren die onder dit hoofdstuk vallen, waarbij de lening van de debiteur wordt
      aangemerkt als een lening beroepsonderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0011453#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0011453#Artikel6
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel10a.3
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
      - id: ref2
        bwb_id: BWBR0011453
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
      - id: ref3
        bwb_id: BWBR0011453
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
      - id: ref4
        bwb_id: BWBR0011453
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 10a.4
    text: |-
      De aflosfase beslaat behoudens toepassing van [artikel 10a.6, derde lid][ref1], 15 kalenderjaren volgend op de
      aanloopfase. Deze periode wordt verlengd indien [artikel 10a.11, tweede lid][ref2], van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel10a
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel10a
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel10a.4
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: 10a
        hoofdstuk: 10a
      - id: ref2
        bwb_id: BWBR0011453
        artikel: 10a
        hoofdstuk: 10a
  - number: 10a.5.1
    text: |-
      In afwijking van [artikel 10a.4][ref1] kan een debiteur met ingang van 1 januari 2012 op aanvraag de terugbetaling
      voor ten hoogste 5 kalenderjaren opschorten.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel10a
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel10a.5
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: 10a
        hoofdstuk: 10a
  - number: 10a.5.2
    text: |-
      De aflosfase wordt verlengd met het aantal maanden dat gebruik is gemaakt van de aflosvrije periode op grond van
      het eerste lid.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel10a.5
  - number: 10a.5.3
    text: |-
      Bij ministeriële regeling kunnen voorschriften worden vastgesteld met betrekking tot de opschorting, bedoeld in het
      eerste lid.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel10a.5
  - number: 10a.6.1
    text: Rente en aflossing van de lening vervallen gedurende de aflosfase in maandelijkse termijnen.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel10a.6
  - number: 10a.6.2
    text: |-
      De hoogte van de maandelijkse termijnbetalingen wordt op basis van het aantal maanden van de aflosfase
      onderscheidenlijk het nog resterende aantal maanden van de aflosfase tot gelijke bedragen vastgesteld bij de
      aanvang van:
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel10a.6
  - number: 10a.6.2.a
    text: het eerste jaar van de aflosfase,
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel10a.6
  - number: 10a.6.2.b
    text: het vierde jaar van de aflosfase, en
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel10a.6
  - number: 10a.6.2.c
    text: ieder vijfde jaar na het vierde jaar van de aflosfase.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel10a.6
  - number: 10a.6.3
    text: |-
      Onverminderd [artikel 10a.7, eerste lid][ref1], bedraagt het totaal per jaar te betalen bedrag aan maandelijkse
      termijnbetalingen ten minste € 545,–.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel10a
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel10a.6
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: 10a
        hoofdstuk: 10a
  - number: 10a.6.4
    text: |-
      Rente en aflossing van de lening van een debiteur die in het buitenland woont, vervallen, in afwijking van
      het eerste lid, gedurende de aflosfase in jaarlijkse termijnen. Indien die debiteur zich voor het einde van
      een jaartermijn metterwoon in Nederland vestigt, wordt hij tot het einde van die jaartermijn behandeld als een
      debiteur die in het buitenland woont. De [artikelen 6.4][ref1] en [6.6][ref2] zijn in dat geval van overeenkomstige
      toepassing. Op aanvraag van een in de eerste volzin bedoelde debiteur besluit Onze Minister dat de rente en
      aflossing van de lening niet vervallen in jaarlijkse termijnen maar in maandelijkse termijnen.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel6
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel10a.6
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
      - id: ref2
        bwb_id: BWBR0011453
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 10a.6.5
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld voor de vaststelling en betaling van de
      termijnbetalingen.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel10a.6
  - number: 10a.7.1
    text: |-
      Indien de debiteur niet in staat is de vastgestelde termijnbetaling te voldoen, kan hij gedurende de aflosfase bij
      Onze Minister een aanvraag indienen om zijn draagkracht vast te stellen voor de resterende aflosfase.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel10a.7
  - number: 10a.7.2
    text: De draagkracht van de debiteur is zijn draagkracht uit inkomen.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel10a.7
  - number: 10a.7.3
    text: |-
      Bij ministeriële regeling kunnen voorschriften worden vastgesteld met betrekking tot de in het eerste lid bedoelde
      aanvraag.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel10a.7
  - number: 10a.7.4
    text: |-
      Indien het bedrag van de draagkracht hoger is dan het bedrag van de vastgestelde termijnbetaling, betaalt de
      debiteur het bedrag van de vastgestelde termijnbetaling.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel10a.7
  - number: 10a.8.1
    text: |-
      Maatstaf voor de vaststelling van de draagkracht van de debiteur uit inkomen is zijn toetsingsinkomen in het tweede
      jaar voorafgaande aan het jaar waarvoor de draagkracht wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel10a.8
  - number: 10a.8.2
    text: |-
      Op het toetsingsinkomen wordt in mindering gebracht de draagkrachtvrije voet. Deze voet is gelijk
      aan het belastbare minimumloon in het peiljaar, indien de debiteur in het peiljaar een ouder zonder
      partner is als bedoeld in [artikel 2, zesde lid, van de Wet op het kindgebonden budget][ref1], of voor
      zijn partner voor de inkomstenbelasting de verhoging van de gecombineerde heffingskorting, bedoeld in
      [artikel 8.9 van de Wet inkomstenbelasting 2001][ref2], van toepassing is. Indien voor de debiteur de verhoging
      van de gecombineerde heffingskorting, bedoeld in artikel 8.9 van de Wet inkomstenbelasting 2001, of de algemene
      heffingskorting van toepassing is, is de draagkrachtvrije voet 0%, onderscheidenlijk 50% van de voet die van
      toepassing zou zijn indien voor de debiteur – naast de algemene heffingskorting – voor zijn partner de verhoging
      van de gecombineerde heffingskorting, bedoeld in artikel 8.9 van de Wet inkomstenbelasting 2001 van toepassing
      zou zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0022751#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel8
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel10a.8
    references:
      - id: ref1
        bwb_id: BWBR0022751
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '8'
  - number: 10a.8.3
    text: |-
      Het resterende inkomen wordt verdeeld in 2 schijven ter grootte van de helft van de in het tweede lid bedoelde
      draagkrachtvrije voet alsmede een derde schijf ter grootte van 260% van het belastbare minimumloon in het tweede
      jaar voorafgaande aan het jaar waarvoor de draagkracht wordt vastgesteld, verminderd met de draagkrachtvrije voet
      en de eerste en de tweede schijf.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel10a.8
  - number: 10a.8.4
    text: |-
      Indien de debiteur of zijn partner een toetsingsinkomen heeft dat kleiner is dan de som van de in het tweede lid
      bedoelde draagkrachtvrije voet en de eerste 3 volle schijven, bedoeld in het derde lid, wordt het deel van de
      draagkrachtvrije voet en de eerste 3 schijven dat nog niet is benut, overgeheveld naar de ander. Daarbij wordt het
      onbenutte deel van een schijf toegevoegd aan de overeenkomstige schijf van de ander en het onbenutte deel van de
      draagkrachtvrije voet aan de draagkrachtvrije voet van de ander.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel10a.8
  - number: 10a.8.5
    text: |-
      Indien de debiteur en zijn partner een toetsingsinkomen hebben dat kleiner is dan de som van de in het tweede
      lid bedoelde draagkrachtvrije voet en de eerste 3 volle schijven, bedoeld in het derde lid, wordt het vierde lid
      toegepast in die zin dat van de debiteur of zijn partner met het laagste toetsingsinkomen het onbenutte deel van de
      draagkrachtvrije voet en de eerste 3 schijven wordt overgeheveld naar de ander.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel10a.8
  - number: 10a.8.6
    text: |-
      De draagkracht van de debiteur uit inkomen is 7,9% van de eerste schijf plus 15,8% van de tweede schijf plus 23,7%
      van de derde schijf plus 30% van het meerdere.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel10a.8
  - number: 10a.8.7
    text: |-
      In afwijking van het tweede tot en met het zesde lid is de draagkracht uit inkomen van een debiteur met een
      toetsingsinkomen lager dan een bij ministeriële regeling vast te stellen minimumbedrag nihil. Deze regeling wordt
      jaarlijks voor 1 januari vastgesteld en kan voor verschillende groepen debiteuren verschillend luiden.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel10a.8
  - number: 10a.8.8
    text: |-
      Voor de toepassing van dit artikel wordt indien het toetsingsinkomen of het belastbaar loon in het tweede jaar
      voorafgaande aan het jaar waarvoor de draagkracht wordt vastgesteld, nog niet bekend is, door Onze Minister
      daarvoor in de plaats gesteld een bedrag dat het vast te stellen toetsingsinkomen of het belastbaar loon benadert.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel10a.8
  - number: 10a.9
    text: |-
      Indien het na het peiljaar een debiteur betreft die ouder zonder partner is als bedoeld in
      [artikel 2, zesde lid, van de Wet op het kindgebonden budget][ref1] of voor zijn partner de verhoging van de
      gecombineerde heffingskorting, bedoeld in [artikel 8.9 van de Wet inkomstenbelasting 2001][ref2], van toepassing
      wordt na het tweede jaar voorafgaande aan het jaar waarvoor de draagkracht wordt vastgesteld, wordt op aanvraag van
      de debiteur de hoogte van zijn draagkracht dienovereenkomstig aangepast.


      [ref1]: https://wetten.overheid.nl/BWBR0022751#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel8
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel10a.9
    references:
      - id: ref1
        bwb_id: BWBR0022751
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '8'
  - number: 10a.10.1
    text: |-
      Indien de debiteur op grond van zijn draagkracht niet in staat is de vastgestelde termijnbetaling te betalen, wordt
      de draagkracht van de partner berekend overeenkomstig de artikelen [10a.7][ref1], [10a.8][ref2], [6.12][ref3] en
      [6.13][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel10a
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel10a
      [ref3]: https://wetten.overheid.nl/BWBR0011453#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0011453#Artikel6
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel10a.10
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: 10a
        hoofdstuk: 10a
      - id: ref2
        bwb_id: BWBR0011453
        artikel: 10a
        hoofdstuk: 10a
      - id: ref3
        bwb_id: BWBR0011453
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
      - id: ref4
        bwb_id: BWBR0011453
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 10a.10.2
    text: |-
      Indien de draagkracht van de debiteur niet voldoende is voor het betalen van de termijnbetaling wordt de
      draagkracht van de partner aangewend voor het resterende gedeelte.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel10a.10
  - number: 10a.11.1
    text: |-
      Bij de bepaling van de draagkracht van de debiteur wordt geen rekening gehouden met het inkomen van de partner
      indien een van beiden hiertoe een aanvraag indient.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel10a.11
  - number: 10a.11.2
    text: |-
      Voor ieder jaar dat op grond van de toepassing van het eerste lid geen rekening wordt gehouden met het inkomen van
      de partner van de debiteur wordt de aflosfase verlengd met een jaar.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel10a.11
  - number: 10a.12
    text: |-
      Indien de partner van de debiteur ook een debiteur is en op beide debiteuren hoofdstuk 10a van toepassing is,
      wordt zijn draagkracht eerst aangewend voor de eigen termijnbetaling. Op het bedrag dat aan draagkracht resteert is
      [artikel 10a.10, tweede lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel10a
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel10a.12
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: 10a
        hoofdstuk: 10a
  - number: 10a.13.1
    text: |-
      Indien de partner van de debiteur een debiteur is op wie [hoofdstuk 6][ref1] van toepassing is, blijft
      [artikel 10a.10, eerste lid][ref2], buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Hoofdstuk6
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel10a
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel10a.13
    references:
      - id: ref1
        bwb_id: BWBR0011453
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0011453
        artikel: 10a
        hoofdstuk: 10a
  - number: 10a.13.2
    text: |-
      Bij de toepassing van [artikel 10a.10, tweede lid][ref1], wordt de draagkracht van de debiteur op wie
      [hoofdstuk 6][ref2] van toepassing is, aangewend, voor zover het bedrag van de draagkracht groter is dan de
      vastgestelde termijnbetaling, bedoeld in [artikel 6.9, tweede lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel10a
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Hoofdstuk6
      [ref3]: https://wetten.overheid.nl/BWBR0011453#Artikel6
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel10a.13
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: 10a
        hoofdstuk: 10a
      - id: ref2
        bwb_id: BWBR0011453
        hoofdstuk: '6'
      - id: ref3
        bwb_id: BWBR0011453
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 11.1.1
    text: |-
      Per 1 januari van ieder kalenderjaar wijzigt Onze Minister de bedragen, genoemd in de
      [artikelen 3.9, tweede lid][ref1], [3.9a][ref2], [3.17, eerste en vierde lid][ref3], [3.18][ref4], met
      uitzondering van de maximale aanvullende beurs, [3.27, tweede lid][ref5], [4.7][ref6], [4.18][ref7], [5.2][ref8] en
      [6.2a][ref9], op een bij of krachtens algemene maatregel van bestuur aan te geven wijze aan de hand van de loon- of
      prijsontwikkelingen in het tweede daaraan voorafgaande kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011453#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0011453#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0011453#Artikel3
      [ref6]: https://wetten.overheid.nl/BWBR0011453#Artikel4
      [ref7]: https://wetten.overheid.nl/BWBR0011453#Artikel4
      [ref8]: https://wetten.overheid.nl/BWBR0011453#Artikel5
      [ref9]: https://wetten.overheid.nl/BWBR0011453#Artikel6
