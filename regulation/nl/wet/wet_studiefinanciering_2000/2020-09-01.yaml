    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.18
  - number: 3.19.1
    text: |-
      Onze Minister kent studiefinanciering toe aan degene die daartoe een aanvraag heeft ingediend en die voldoet aan de
      voorschriften gegeven bij of krachtens deze wet.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.19
  - number: 3.19.2
    text: 'Onze Minister besluit op een aanvraag om studiefinanciering:'
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.19
  - number: 3.19.2.a
    text: |-
      indien de aanvraag is ingediend vóór 1 november van het jaar voorafgaand aan het kalenderjaar waarop de
      studiefinanciering betrekking heeft: vóór 31 december van dat voorafgaande jaar, en
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.19
  - number: 3.19.2.b
    text: |-
      indien de aanvraag is ingediend na het in onderdeel a bedoelde tijdstip: binnen 8 weken na de indiening van de
      aanvraag.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.19
  - number: '3.20'
    text: |-
      Indien het op basis van de verstrekte gegevens onmogelijk is het bedrag van de aanvullende beurs vast te stellen,
      kent Onze Minister het gevraagde bedrag toe in de vorm van een lening.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.20
  - number: 3.21.1
    text: Studiefinanciering wordt toegekend per studiefinancieringstijdvak.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.21
  - number: 3.21.2
    text: |-
      Een aanvraag voor studiefinanciering wordt vóór het einde van het studiejaar waarop de aanvraag betrekking heeft
      ingediend.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.21
  - number: 3.21.3
    text: |-
      Studiefinanciering of de verhoging daarvan wordt niet toegekend voor een periode voorafgaand aan het studiejaar
      waarin de aanvraag is ingediend.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.21
  - number: 3.21.4
    text: |-
      De reisvoorziening of het levenlanglerenkrediet wordt niet toegekend voor een periode voorafgaand aan de datum van
      indiening van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.21
  - number: 3.21.5
    text: |-
      Op aanvraag van de student onderbreekt of beëindigt Onze Minister de studiefinanciering met ingang van de
      kalendermaand die de student in zijn aanvraag aangeeft, met dien verstande dat de onderbreking of beëindiging niet
      plaatsvindt voor een periode voorafgaand aan de datum van de indiening van de aanvraag. De onderbreking omvat ten
      minste 1 maand.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.21
  - number: 3.23.1
    text: |-
      In afwijking van [artikel 1.7][ref1] gebruikt Onze Minister in contacten met RSR het burgerservicenummer van:


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel1
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.23
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '1'
        hoofdstuk: '1'
  - number: 3.23.1.a
    text: een student voor de toekenning en beëindiging van diens reisrecht; en
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.23
  - number: 3.23.1.b
    text: |-
      de persoon die een reisrecht toegekend heeft gekregen en van wie nadat sprake was van één van de situaties genoemd
      in [artikel 3.27, eerste lid, onder a en b][ref1], het reisproduct niet tijdig is stopgezet, voor de uitvoering van
      artikel 3.27, tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel3
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.23
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.7'
  - number: 3.23.2
    text: 'RSR gebruikt het burgerservicenummer van een student slechts:'
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.23
  - number: 3.23.2.a
    text: |-
      ter vaststelling van de identiteit van een student wanneer deze zich tot de vervoersbedrijven wendt om zijn
      gegevens te laten koppelen aan een daarvoor bestemde OV-chipkaart als bedoeld in [artikel 3.26, eerste lid][ref1],
      en


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel3
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.23
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.7'
  - number: 3.23.2.b
    text: in contacten met Onze Minister.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.23
  - number: 3.26.1
    text: |-
      Het reisrecht vangt aan op het moment dat de student het reisproduct heeft geladen op een daarvoor bestemde OV-
      chipkaart.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.26
  - number: 3.26.2
    text: Het reisrecht wordt naar keuze van de student toegekend als weekreisrecht of weekendreisrecht.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.26
  - number: 3.26.3
    text: |-
      Bij ministeriële regeling worden regels gesteld met betrekking tot de wijze van verkrijgen van het reisrecht en
      de omvang van de aan de soorten reisrecht, bedoeld in het tweede lid, verbonden rechten. Daarbij worden tevens
      voorschriften vastgesteld met betrekking tot de wijze waarop en de termijn waarbinnen de student de keuze tussen
      soorten reisrecht dient te maken en met betrekking tot de aanvraag tot herziening door de student van een gemaakte
      keuze in soorten reisrecht.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.26
  - number: 3.27.1
    text: |-
      De persoon die een reisrecht toegekend heeft gekregen is verplicht er zorg voor te dragen dat het reisproduct is
      stopgezet op uiterlijk de tiende kalenderdag van de maand waarin:
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.27
  - number: 3.27.1.a
    text: zijn aanspraak op reisrecht is beëindigd; of
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.27
  - number: 3.27.1.b
    text: |-
      zijn reisproduct op grond van [artikel 3.7, tweede of vierde lid][ref1], is vervangen door een reisvoorziening in
      de vorm van geld.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel3
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.27
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 3.27.2
    text: |-
      Indien het reisproduct niet is stopgezet na de termijn, genoemd in het eerste lid, aanhef, en er gebruik van
      is gemaakt, is degene aan wie het reisrecht is toegekend aan Onze Minister per halve kalendermaand een bedrag
      verschuldigd van, naar de maatstaf van 1 januari 2019:
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.27
  - number: 3.27.2.a
    text: € 75,00 voor zover het de eerste en de tweede halve kalendermaand betreft; en
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.27
  - number: 3.27.2.b
    text: € 150,00 voor zover het de derde en daaropvolgende halve kalendermaanden betreft.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.27
  - number: 3.27.3
    text: De eerste helft van een kalendermaand loopt tot en met de vijftiende dag van die maand.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.27
  - number: 3.27.4
    text: |-
      De opbouw van de bedragen, genoemd in het tweede lid, vangt aan op het moment dat sprake is van één van de
      situaties genoemd in het eerste lid, onderdelen a en b, waarbij voor de eerste halve kalendermaand waarin € 75,00
      verschuldigd is uitsluitend wordt gekeken naar het gebruik van het reisproduct tijdens de elfde tot en met de
      vijftiende dag van die maand.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.27
  - number: 3.27.5
    text: Er is geen bedrag verschuldigd over de halve kalendermaanden waarin geen gebruik gemaakt is van het reisproduct.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.27
  - number: 3.27.6
    text: |-
      Indien een student na het beëindigen van zijn aanspraak op het reisrecht opnieuw een reisrecht toegekend
      heeft gekregen, is na het beëindigen van het laatst toegekende reisrecht wederom sprake van een eerste halve
      kalendermaand, als bedoeld in het tweede lid, onder a.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.27
  - number: 3.27.7
    text: |-
      Het tweede lid is niet van toepassing op een periode waarin het degene aan wie het reisrecht is toegekend,
      aantoonbaar niet kan worden toegerekend dat het reisproduct niet tijdig is stopgezet.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.27
  - number: 3.27.8
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld met betrekking tot de wijze van beëindigen van het
      reisrecht, en kunnen nadere regels worden gesteld met betrekking tot de wijze waarop en het tijdstip waarvoor de
      niet-toerekenbaarheid, bedoeld in het zevende lid, moet worden aangetoond.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.27
  - number: 3.29.1
    text: |-
      Wanneer een student door toedoen van Onze Minister over een periode ten onrechte niet over een geladen reisproduct
      beschikt, heeft hij over die periode jegens Onze Minister aanspraak op een vergoeding ter grootte van het
      bedrag, bedoeld in [artikel 3.27, tweede lid, onder b][ref1], mits hij meer dan 8 weken vóór het begin van de
      desbetreffende kalendermaand, zowel de studiefinanciering heeft aangevraagd als alle benodigde gegevens voor
      het kunnen toekennen van studiefinanciering heeft verstrekt. Indien het betreft een reisvoorziening als bedoeld
      in [artikel 3.7, tweede lid][ref2], heeft hij slechts aanspraak op een vergoeding als bedoeld in de vorige
      volzin, indien hij tevens binnen een bij ministeriële regeling vast te stellen termijn, een aanvraag om deze
      reisvoorziening heeft ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel3
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.29
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.7'
      - id: ref2
        bwb_id: BWBR0011453
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 3.29.2
    text: |-
      De student vraagt de vergoeding aan binnen 2 weken na de dag waarop hij op de aanvraag voor het eerst
      studiefinanciering heeft toegekend gekregen of, indien dit later is, binnen 2 weken na de dag waarop voor het eerst
      zijn recht op studiefinanciering inging.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.29
  - number: 3.29.3
    text: 'De student heeft geen recht op enige vergoeding:'
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.29
  - number: 3.29.3.a
    text: wegens het geen of slechts gedeeltelijk gebruik maken van het reisrecht, of
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.29
  - number: 3.29.3.b
    text: |-
      in geval van inname, verlies, diefstal, beschadiging of een defect van de OV-chipkaart, bedoeld in
      [artikel 3.26, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel3
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.29
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.7'
  - number: '3.30'
    text: |-
      Ten behoeve van het reizen tussen Waddeneilanden en het vaste land kan Onze Minister met de gemeenten van deze
      eilanden een overeenkomst sluiten over een aanvullende voorziening die deze gemeenten aan bepaalde groepen
      studenten verstrekken.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel3.30
  - number: '4.1'
    text: 'Deze paragraaf is uitsluitend van toepassing:'
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel4.1
  - number: 4.1.a
    text: op mbo-studenten die in Nederland een opleiding niveau 1 of 2 volgen, en
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel4.1
  - number: 4.1.b
    text: |-
      op mbo-studenten die in Nederland een beroepsopleiding volgen en die voor 1 augustus 2005 voor het volgen van
      beroepsonderwijs studiefinanciering ontvingen.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel4.1
  - number: '4.2'
    text: Studiefinanciering wordt verstrekt in de vorm van een gift of een lening.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel4.2
  - number: 4.3.1
    text: |-
      De studiefinanciering van de mbo-student die zonder geldige reden niet aan het onderwijs heeft deelgenomen
      gedurende een aaneengesloten periode van ten minste 5 weken, bestaat met uitzondering van de reisvoorziening geheel
      uit een lening met ingang van de eerste dag van de maand volgend op de maand waarin de afwezigheid zonder geldige
      reden aanving. De periode van 5 weken wordt verlengd met de weken waarin vanwege vakantie geen onderwijs werd
      verzorgd.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel4.3
  - number: 4.3.2
    text: |-
      In afwijking van het eerste lid kan bij ministeriële regeling worden bepaald dat voor soorten van beroepsonderwijs
      het eerste lid van overeenkomstige toepassing is, indien een mbo-student in een of meer onderwijseenheden zonder
      geldige reden niet aan het onderwijs heeft deelgenomen.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel4.3
  - number: 4.3.3
    text: |-
      Uitsluitend de in [artikel 8.1.7, negende lid, van de WEB][ref1] genoemde redenen voor afwezigheid zijn geldige
      redenen.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel4.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '8'
  - number: '4.4'
    text: |-
      [Artikel 4.3][ref1] is niet van toepassing met ingang van de eerste dag van de maand volgend op de maand waarin de
      mbo-student weer aan het onderwijs is gaan deelnemen, voor zover die studiefinanciering niet reeds mede op grond
      van een andere bepaling dan dit artikel, de vorm van een lening had. Voorwaarde voor de toepassing van de vorige
      volzin is dat de mbo-student aan het onderwijs is gaan deelnemen binnen 8 weken na de aanvang van de periode van
      5 weken. De periodes van 5 en 8 weken worden verlengd met de weken waarin vanwege vakantie geen onderwijs werd
      verzorgd.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel4
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel4.4
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.1.1
        afdeling: '4.1'
  - number: 4.5.1
    text: |-
      Het bestuur van de rechtspersoon waarvan de instelling, bedoeld in [artikel 2.4, onderdeel b][ref1], uitgaat of
      de natuurlijke persoon die deze instelling in stand houdt, stelt uiterlijk op de derde werkdag na afloop van een
      periode van afwezigheid van 4 weken de mbo-student in kennis dat daarvan in de administratie van de instelling een
      aantekening is gemaakt en verzoekt de mbo-student om opgaaf van de reden van de afwezigheid.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel2
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel4.5
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 4.5.2
    text: |-
      Uiterlijk op de vijfde werkdag na de periode van 8 weken stelt het bestuur van de rechtspersoon of de natuurlijke
      persoon vast:
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel4.5
  - number: 4.5.2.a
    text: |-
      of de reden die de mbo-student binnen 8 weken na de aanvang van de periode van 5 weken gaf voor zijn afwezigheid,
      een geldige reden als bedoeld in [artikel 8.1.7, negende lid, van de WEB][ref1], is, of


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel4.5
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '8'
  - number: 4.5.2.b
    text: |-
      dat de mbo-student binnen 8 weken na de aanvang van de periode van 5 weken geen reden heeft opgegeven voor zijn
      afwezigheid.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel4.5
  - number: 4.5.3
    text: |-
      Het bestuur van de rechtspersoon of de natuurlijke persoon stelt tevens uiterlijk op de vijfde werkdag na afloop
      van de periode van 8 weken vast of de mbo-student voor het einde van die periode weer aan het onderwijs is gaan
      deelnemen.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel4.5
  - number: 4.5.4
    text: |-
      Het bestuur van de rechtspersoon of de natuurlijke persoon meldt uiterlijk de vijfde werkdag na afloop van een
      periode van 8 weken aan Onze Minister dat de mbo-student gedurende een aaneengesloten periode van ten minste 5
      weken zonder opgave van geldige reden niet aan het onderwijs heeft deelgenomen. Tevens meldt hij, indien die mbo-
      student voor het einde van die periode van 8 weken weer aan het onderwijs is gaan deelnemen, de datum daarvan.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel4.5
  - number: 4.5.5
    text: De periodes van 5 en 8 weken worden verlengd met de weken waarin vanwege vakantie geen onderwijs werd verzorgd.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel4.5
  - number: 4.5.6
    text: |-
      Het bestuur van de rechtspersoon of de natuurlijke persoon stuurt gelijktijdig met de mededelingen, bedoeld in
      het vierde lid, een afschrift van de gegevens die over de betrokkene aan Onze Minister zijn verstrekt, aan deze
      betrokkene en geeft daarbij tevens aan dat afwezigheid als bedoeld in [artikel 4.3][ref1], gevolgen heeft voor
      de studiefinanciering van betrokkene, alsmede welke beroepsgang voor betrokkene open staat tegen de mededelingen,
      bedoeld in het vierde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel4
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel4.5
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.1.1
        afdeling: '4.1'
  - number: '4.6'
    text: Deze paragraaf is uitsluitend van toepassing op mbo-studenten die in Nederland een opleiding niveau 3 of 4 volgen.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel4.6
  - number: 4.6a
    text: |-
      Een mbo-student aan een opleiding niveau 3 of 4 komt voor zover wordt voldaan aan de van toepassing zijnde
      voorwaarden in aanmerking voor studiefinanciering in de vorm van een prestatiebeurs, inhoudende:
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel4.6a
  - number: 4.6a.a
    text: een basisbeurs;
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel4.6a
  - number: 4.6a.b
    text: een aanvullende beurs;
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel4.6a
  - number: 4.6a.c
    text: een reisvoorziening; en
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel4.6a
  - number: 4.6a.d
    text: een toeslag eenoudergezin.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel4.6a
  - number: 4.6b
    text: |-
      Onverminderd[ artikel 4.7, eerste en tweede lid][ref1], komt een mbo-student die jonger is dan 18 jaren in
      aanmerking voor een reisvoorziening in de vorm van een prestatiebeurs.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel4
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel4.6b
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.1.2
        afdeling: '4.1'
  - number: 4.7.1
    text: |-
      Prestatiebeurs beroepsonderwijs wordt voor een opleiding niveau 3 of 4 binnen en buiten Nederland tezamen gedurende
      ten hoogste 4 jaren verstrekt in de vorm van een prestatiebeurs, met dien verstande dat de aanvullende beurs in de
      eerste 12 maanden waarvoor aanspraak op studiefinanciering bestaat wordt verstrekt in de vorm van een gift.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel4.7
  - number: 4.7.2
    text: |-
      Indien een mbo-student een specialistenopleiding volgt en hij 4 jaren prestatiebeurs beroepsonderwijs heeft
      genoten, wordt aan hem voor die opleiding op aanvraag gedurende ten hoogste 2 jaren prestatiebeurs beroepsonderwijs
      verstrekt.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel4.7
  - number: 4.7.3
    text: |-
      Studiefinanciering wordt gedurende in totaal ten hoogste 36 maanden na de perioden, bedoeld in het eerste en tweede
      lid, verstrekt in de vorm van een lening. Het bedrag dat per maand kan worden geleend, bedraagt in afwijking van
      de [artikelen 3.1, vierde lid][ref1], [3.2][ref2], [3.13][ref3] en [3.18][ref4], naar de maatstaf van 1 januari
      2005 € 787,02 . Tevens kan gedurende deze 36 maanden een reisvoorziening worden verstrekt in de vorm van een
      prestatiebeurs, waarbij het aantal maanden dat op grond van [artikel 4.6b][ref5] reisvoorziening is toegekend in
      mindering wordt gebracht op dit aantal maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011453#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0011453#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0011453#Artikel4
