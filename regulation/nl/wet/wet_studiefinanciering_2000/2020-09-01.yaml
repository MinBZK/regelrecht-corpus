  - number: 1.1.2
    text: |-
      Onder voltijdse opleiding wordt mede verstaan een duale opleiding in de zin van de [WHW][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel1.1
    references:
      - id: ref1
        bwb_id: BWBR0005682
  - number: '1.2'
    text: |-
      Voor de toepassing van het bepaalde bij of krachtens deze wet is bepalend de toestand op de eerste dag van de
      maand, tenzij anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel1.2
  - number: '1.3'
    text: |-
      Aan welke voorwaarden een aanvraag moet voldoen, kan bij ministeriële regeling worden bepaald. In ieder geval wordt
      daarbij bepaald dat de aanvrager zijn burgerservicenummer of onderwijsnummer verstrekt.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel1.3
  - number: 1.5.1
    text: |-
      Voor het normbedrag voor een uitwonende mbo-student komt in aanmerking de mbo-student die voldoet aan de volgende
      verplichtingen:
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel1.5
  - number: 1.5.1.a
    text: de mbo-student woont op het adres waaronder hij in de basisregistratie personen staat ingeschreven, en
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel1.5
  - number: 1.5.1.b
    text: |-
      het woonadres van de mbo-student is niet het adres waaronder zijn ouders of een van hen in de basisregistratie
      personen staat of staan ingeschreven.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel1.5
  - number: 1.5.2
    text: |-
      Op een mbo-student die ingevolge [artikel 2.13a][ref1] in aanmerking komt voor studiefinanciering voor een
      opleiding buiten Nederland is het eerste lid, onderdeel a, niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel2
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel1.5
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: 1.7.1
    text: |-
      Onze Minister gebruikt het burgerservicenummer of onderwijsnummer van een student of debiteur ter zake van de
      uitvoering van deze wet slechts:
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel1.7
  - number: 1.7.1.a
    text: in contacten met die student of debiteur,
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel1.7
  - number: 1.7.1.b
    text: |-
      in contacten met personen en instanties voorzover deze zelf gemachtigd zijn tot het opnemen van het
      burgerservicenummer of onderwijsnummer in een persoonsregistratie,
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel1.7
  - number: 1.7.1.c
    text: |-
      teneinde de gegevens van die student of debiteur te vergelijken met de gegevens die over hem zijn opgenomen in het
      register onderwijsdeelnemers, bedoeld in [artikel 4 van de Wet register onderwijsdeelnemers][ref1], voorzover dat
      noodzakelijk is voor de uitvoering van deze wet, en


      [ref1]: https://wetten.overheid.nl/BWBR0042012#Artikel4
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel1.7
    references:
      - id: ref1
        bwb_id: BWBR0042012
        artikel: '4'
  - number: 1.7.1.d
    text: |-
      in contacten met de toezichthouders, bedoeld in [artikel 9.1a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel9
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel1.7
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '9.1'
  - number: 1.7.2
    text: |-
      Het burgerservicenummer of onderwijsnummer van de partner of ouder van een student of debiteur kan ter zake van
      de uitvoering van deze wet slechts worden gebruikt in contacten met die partner of ouder of met de desbetreffende
      student of debiteur, alsmede, voorzover het betreft de controle op de rechtmatigheid, in contacten met personen en
      instanties voorzover deze zelf gemachtigd zijn tot het opnemen van het burgerservicenummer of onderwijsnummer in
      een persoonsregistratie.
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel1.7
  - number: '1.8'
    text: |-
      Van de [Algemene wet inkomensafhankelijke regelingen][ref1] is [artikel 6][ref2] op deze wet van toepassing en zijn
      de [artikelen 9, eerste lid][ref3], en [10, eerste lid][ref4], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018472
      [ref2]: https://wetten.overheid.nl/BWBR0018472#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0018472#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0018472#Artikel10
    url: https://wetten.overheid.nl/BWBR0011453/2020-09-01#Artikel1.8
    references:
      - id: ref1
        bwb_id: BWBR0018472
      - id: ref2
