preamble:
  text: |-
    Gelet op de artikelen 4, eerste lid, 6, eerste lid, en 8, eerste en tweede lid, van het Frequentiebesluit, en
    artikel 2, eerste en tweede lid, van het Besluit tarieven openbaarheid van bestuur;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0017886/2005-01-20#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze regeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0017886/2005-01-20#Artikel1
  - number: 1.a
    text: 'minister: Minister van Economische Zaken;'
    url: https://wetten.overheid.nl/BWBR0017886/2005-01-20#Artikel1
  - number: 1.b
    text: |-
      WLL: digitale radiosystemen gebaseerd op multipunt technologie, zoals beschreven in de geldende, door het Europese
      Telecommunicatie Standaardisatie Instituut (ETSI) opgestelde geharmoniseerde norm, waarmee radioverbindingen in
      duplex gerealiseerd kunnen worden tussen een vast centraal punt en meerdere vast opgestelde aansluitpunten;
    url: https://wetten.overheid.nl/BWBR0017886/2005-01-20#Artikel1
  - number: 1.c
    text: 'vergunning: vergunning voor WLL;'
    url: https://wetten.overheid.nl/BWBR0017886/2005-01-20#Artikel1
  - number: 1.d
    text: |-
      aanvraagdocument: document als bedoeld in [artikel 5, eerste lid, van het Frequentiebesluit][ref1] ten behoeve van
      de verdeling van frequentieruimte voor WLL;


      [ref1]: https://wetten.overheid.nl/BWBR0009997#Artikel5
    url: https://wetten.overheid.nl/BWBR0017886/2005-01-20#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009997
        artikel: '5'
  - number: 1.e
    text: 'aanvrager: degene die een aanvraag voor een vergunning voor WLL doet;'
    url: https://wetten.overheid.nl/BWBR0017886/2005-01-20#Artikel1
  - number: 1.f
    text: |-
      frequentieruimte 3,5 GHz: frequentieruimte, bedoeld in
      [artikel 2, onder a, van de Regeling aanvraagprocedure en veiling gebruiksrecht frequentieruimte voor WLL][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0015491#Artikel2
    url: https://wetten.overheid.nl/BWBR0017886/2005-01-20#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0015491
        artikel: '2'
  - number: 1.g
    text: 'deelnemer: aanvrager die gerechtigd is een bod uit te brengen;'
    url: https://wetten.overheid.nl/BWBR0017886/2005-01-20#Artikel1
  - number: 1.h
    text: 'kavel: aantal frequenties dat ter beschikking is voor de exploitatie van een vergunning voor WLL.'
    url: https://wetten.overheid.nl/BWBR0017886/2005-01-20#Artikel1
  - number: '2'
    text: |-
      Ingevolge het besluit van de minister van 10 januari 2005 (Stcrt. 2005, 12) zijn voor WLL de volgende vergunningen
      beschikbaar die door middel van een veiling zullen worden verleend:
    url: https://wetten.overheid.nl/BWBR0017886/2005-01-20#Artikel2
  - number: 2.a
    text: |-
      een vergunning in de 26 GHz band, met frequentiebereik 24,549–24,661 GHz met 25,557–25,669 GHz, met een bandbreedte
      van 2x112 MHz;
    url: https://wetten.overheid.nl/BWBR0017886/2005-01-20#Artikel2
  - number: 2.b
    text: |-
      een vergunning in de 26 GHz band, met frequentiebereik 24,689–24,745 GHz met 25,697–25,753 GHz, met een bandbreedte
      van 2x56 MHz;
    url: https://wetten.overheid.nl/BWBR0017886/2005-01-20#Artikel2
  - number: 2.c
    text: |-
      een vergunning in de 26 GHz band, met frequentiebereik 24,773–24,829 GHz met 25,781–25,837 GHz, met een bandbreedte
      van 2x56 MHz;
    url: https://wetten.overheid.nl/BWBR0017886/2005-01-20#Artikel2
  - number: 2.d
    text: |-
      een vergunning in de 26 GHz band, met frequentiebereik 24,857–24,913 GHz met 25,865–25,921 GHz, met een bandbreedte
      van 2x56 MHz;
    url: https://wetten.overheid.nl/BWBR0017886/2005-01-20#Artikel2
  - number: 2.e
    text: |-
      een vergunning in de 26 GHz band, met frequentiebereik 24,941–25,025 GHz met 25,949–26,033 GHz, met een bandbreedte
      van 2x84 MHz, en
    url: https://wetten.overheid.nl/BWBR0017886/2005-01-20#Artikel2
  - number: 2.f
    text: |-
      een vergunning in de 26 GHz band, met frequentiebereik 24,773–24,913 GHz met 25,781–25,921 GHz, met een bandbreedte
      van 2x140 MHz.
    url: https://wetten.overheid.nl/BWBR0017886/2005-01-20#Artikel2
  - number: '3'
    text: |-
      De radiofrequenties, bedoeld in [artikel 2][ref1], worden ten behoeve van de veiling verdeeld in de volgende
      kavels:


      [ref1]: https://wetten.overheid.nl/BWBR0017886#Artikel2
    url: https://wetten.overheid.nl/BWBR0017886/2005-01-20#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0017886
        artikel: '2'
        paragraaf: '2'
  - number: 3.a
    text: |-
      de radiofrequenties, bedoeld in [artikel 2, onder a][ref1], in kavel A;


      [ref1]: https://wetten.overheid.nl/BWBR0017886#Artikel2
    url: https://wetten.overheid.nl/BWBR0017886/2005-01-20#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0017886
        artikel: '2'
        paragraaf: '2'
  - number: 3.b
    text: |-
      de radiofrequenties, bedoeld in [artikel 2, onder b][ref1], in kavel B;


      [ref1]: https://wetten.overheid.nl/BWBR0017886#Artikel2
    url: https://wetten.overheid.nl/BWBR0017886/2005-01-20#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0017886
        artikel: '2'
        paragraaf: '2'
  - number: 3.c
    text: |-
      de radiofrequenties, bedoeld in [artikel 2, onder c][ref1], in kavel C;


      [ref1]: https://wetten.overheid.nl/BWBR0017886#Artikel2
    url: https://wetten.overheid.nl/BWBR0017886/2005-01-20#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0017886
        artikel: '2'
        paragraaf: '2'
  - number: 3.d
    text: |-
      de radiofrequenties, bedoeld in [artikel 2, onder d][ref1], in kavel D;


      [ref1]: https://wetten.overheid.nl/BWBR0017886#Artikel2
    url: https://wetten.overheid.nl/BWBR0017886/2005-01-20#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0017886
        artikel: '2'
        paragraaf: '2'
  - number: 3.e
    text: |-
      de radiofrequenties, bedoeld in [artikel 2, onder e][ref1], in kavel E;


      [ref1]: https://wetten.overheid.nl/BWBR0017886#Artikel2
    url: https://wetten.overheid.nl/BWBR0017886/2005-01-20#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0017886
        artikel: '2'
        paragraaf: '2'
  - number: 3.f
    text: |-
      de radiofrequenties, bedoeld in [artikel 2, onder c][ref1], gecombineerd met de radiofrequenties, bedoeld in
      [artikel 2, onder d][ref2], alsmede de radiofrequenties 24,829–24,857 GHz en 25,837–25,865 GHz, in kavel CD.


      [ref1]: https://wetten.overheid.nl/BWBR0017886#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0017886#Artikel2
    url: https://wetten.overheid.nl/BWBR0017886/2005-01-20#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0017886
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0017886
        artikel: '2'
        paragraaf: '2'
  - number: '4.1'
    text: |-
      Degene die de beschikking wil hebben over het aanvraagdocument, kan een daartoe strekkend verzoek per brief of per
      elektronische post bij de minister indienen. Het aanvraagdocument kan worden opgevraagd met ingang van 24 januari
      2005, 09.00 uur. Het aanvraagdocument kan worden afgehaald op het in het vierde lid genoemde adres, of wordt,
      indien daar in de brief expliciet om is verzocht, toegezonden.
    url: https://wetten.overheid.nl/BWBR0017886/2005-01-20#Artikel4
  - number: '4.2'
    text: |-
      Het verzoek wordt als volgt geadresseerd: De Minister van Economische Zaken p/a notaris mr. C.A. de Zeeuw Pels
      Rijcken & Droogleever Fortuijn Postbus 11756 2502 AT Den Haag e-mail wll@prdf.nl
    url: https://wetten.overheid.nl/BWBR0017886/2005-01-20#Artikel4
  - number: '4.3'
    text: |-
      Voor de beschikbaarstelling van het aanvraagdocument is een bedrag van € 50 verschuldigd. Het bedrag kan worden
      voldaan door middel van contante betaling bij het afhalen van het aanvraagdocument dan wel door middel van
      overboeking onder vermelding van ‘aanvraagdocument vergunningen WLL 26 GHz’ naar het volgende bankrekeningnummer:
      21.30.13.495, Fortis bank Nederland N.V., Den Haag, t.n.v. Pels Rijcken & Droogleever Fortuijn, inzake derdengelden
      notariaat.
    url: https://wetten.overheid.nl/BWBR0017886/2005-01-20#Artikel4
  - number: '4.4'
    text: |-
      Beschikbaarstelling van het aanvraagdocument door overhandiging bij het afhalen dan wel door toezending geschiedt
      nadat het in het derde lid genoemde bedrag is voldaan. Het afhalen geschiedt op het volgende adres: De Minister van
      Economische Zaken p/a notaris mr. C.A. de Zeeuw Pels Rijcken & Droogleever Fortuijn Koningin Julianaplein 30 Gebouw
      Babylon Kantoren A, receptie vijfde verdieping 2595 AA Den Haag
    url: https://wetten.overheid.nl/BWBR0017886/2005-01-20#Artikel4
  - number: '4.5'
    text: Het bedrag, genoemd in het derde lid, wordt niet geretourneerd.
    url: https://wetten.overheid.nl/BWBR0017886/2005-01-20#Artikel4
  - number: '5.1'
    text: |-
      Eenieder aan wie overeenkomstig [artikel 4][ref1] een aanvraagdocument is verstrekt, kan met betrekking
      tot dat document per brief of per elektronische post en per brief vragen stellen aan de minister. Indien er
      verschillen bestaan tussen de schriftelijke en de elektronische versie van de vragen, is de schriftelijke versie
      bepalend. De vragen worden uiterlijk op 4 februari 2005 om 14.00 uur, door tussenkomst van de notaris op het
      in [artikel 4, tweede lid][ref2], genoemde adres, door de minister ontvangen. Na voornoemde datum en voornoemd
      tijdstip ontvangen vragen worden niet beantwoord.


      [ref1]: https://wetten.overheid.nl/BWBR0017886#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0017886#Artikel4
    url: https://wetten.overheid.nl/BWBR0017886/2005-01-20#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0017886
        artikel: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0017886
        artikel: '4'
        paragraaf: '2'
  - number: '5.2'
    text: |-
      De vragen worden op niet tot de vragensteller te herleiden briefpapier gesteld en zodanig geformuleerd dat ook
      daaruit niet de identiteit van de vragensteller kan worden herleid. De vragen worden in de Nederlandse taal
      gesteld. De identiteit van de vragensteller is uitsluitend aan de notaris bekend.
    url: https://wetten.overheid.nl/BWBR0017886/2005-01-20#Artikel5
  - number: '5.3'
    text: |-
      Uiterlijk op 18 februari 2005 zendt de minister aan eenieder aan wie een aanvraagdocument is verstrekt schriftelijk
      antwoord op de vragen die tijdig zijn ontvangen, die voldoen aan de eisen, bedoeld in het eerste en tweede lid, en
      betrekking hebben op het aanvraagdocument, vergezeld van de gestelde vragen.
    url: https://wetten.overheid.nl/BWBR0017886/2005-01-20#Artikel5
  - number: '6.1'
    text: |-
      De aanvraag bevat de gegevens en bescheiden, bedoeld in de bij deze regeling behorende [bijlage I][ref1], en wordt
      overeenkomstig het model in die bijlage ingedeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0017886
    url: https://wetten.overheid.nl/BWBR0017886/2005-01-20#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0017886
  - number: '6.2'
    text: |-
      De aanvraag bevat tevens de gegevens, bedoeld in [artikel 7, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017886#Artikel7
    url: https://wetten.overheid.nl/BWBR0017886/2005-01-20#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0017886
        artikel: '7'
        paragraaf: '2'
  - number: '6.3'
    text: |-
      De aanvraag is in de Nederlandse taal gesteld en aangeduid als het originele exemplaar. Dit exemplaar wordt door de
      aanvrager ondertekend.
    url: https://wetten.overheid.nl/BWBR0017886/2005-01-20#Artikel6
  - number: '6.4'
    text: |-
      De aanvraag gaat vergezeld van drie als zodanig aangeduide afschriften. Indien er verschillen bestaan tussen het
      originele exemplaar en de afschriften, is het originele exemplaar bepalend.
    url: https://wetten.overheid.nl/BWBR0017886/2005-01-20#Artikel6
  - number: '6.5'
    text: |-
      De aanvrager informeert de minister per brief, die wordt geadresseerd op de in [artikel 4, tweede lid][ref1],
      genoemde wijze, onverwijld over wijzigingen met betrekking tot de in het eerste lid bedoelde gegevens en
      bescheiden.


      [ref1]: https://wetten.overheid.nl/BWBR0017886#Artikel4
    url: https://wetten.overheid.nl/BWBR0017886/2005-01-20#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0017886
        artikel: '4'
        paragraaf: '2'
  - number: '6.6'
    text: |-
      Met de gegevens en bescheiden, bedoeld in het eerste lid, worden gelijkgesteld zodanige gegevens en bescheiden
      krachtens het recht van een van de andere lidstaten van de Europese Unie of een van de andere staten die partij
      zijn bij de Overeenkomst betreffende de Europese Economische Ruimte.
    url: https://wetten.overheid.nl/BWBR0017886/2005-01-20#Artikel6
  - number: '7.1'
    text: |-
      De aanvrager geeft in de aanvraag aan op welke kavel of kavels als bedoeld in [artikel 3][ref1], de aanvraag
      betrekking heeft. De aanvraag kan op alle kavels betrekking hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0017886#Artikel3
    url: https://wetten.overheid.nl/BWBR0017886/2005-01-20#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0017886
        artikel: '3'
        paragraaf: '2'
  - number: '7.2'
    text: |-
      Onverminderd het eerste lid kan een aanvrager in totaal slechts minder dan de helft van de frequentieruimte,
      bestaande uit de frequentieruimte 3,5 GHz en de frequentieruimte, bedoeld in [artikel 2][ref1], verwerven.


      [ref1]: https://wetten.overheid.nl/BWBR0017886#Artikel2
    url: https://wetten.overheid.nl/BWBR0017886/2005-01-20#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0017886
        artikel: '2'
        paragraaf: '2'
  - number: '8.1'
    text: Elke aanvrager dient slechts één aanvraag in.
    url: https://wetten.overheid.nl/BWBR0017886/2005-01-20#Artikel8
  - number: '8.2'
    text: |-
      De aanvraag wordt uiterlijk op 25 februari 2005 om 14.00 uur per post dan wel door middel van persoonlijke
      overhandiging ingediend bij het adres, genoemd in [artikel 4, tweede respectievelijk vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017886#Artikel4
    url: https://wetten.overheid.nl/BWBR0017886/2005-01-20#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0017886
        artikel: '4'
        paragraaf: '2'
  - number: '8.3'
    text: De minister bevestigt onverwijld schriftelijk de ontvangst van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0017886/2005-01-20#Artikel8
  - number: '9'
    text: |-
      Indien de aanvrager niet heeft voldaan aan de in [artikel 8, tweede en derde lid][ref1], gestelde eisen, wordt de
      aanvraag niet in behandeling genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0017886#Artikel8
    url: https://wetten.overheid.nl/BWBR0017886/2005-01-20#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0017886
        artikel: '8'
        paragraaf: '2'
  - number: '10.1'
    text: |-
      Indien de aanvrager niet heeft voldaan aan de in de [artikelen 6][ref1], [7][ref2] of [8, eerste lid][ref3],
      gestelde eisen, deelt de minister de aanvrager dit schriftelijk mee.


      [ref1]: https://wetten.overheid.nl/BWBR0017886#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0017886#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0017886#Artikel8
    url: https://wetten.overheid.nl/BWBR0017886/2005-01-20#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0017886
        artikel: '6'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0017886
        artikel: '7'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0017886
        artikel: '8'
        paragraaf: '2'
  - number: '10.2'
    text: |-
      De aanvrager heeft gedurende vijf werkdagen, te rekenen vanaf de dag nadat de mededeling, bedoeld in het eerste
      lid, is verstuurd, de gelegenheid dit verzuim te herstellen.
    url: https://wetten.overheid.nl/BWBR0017886/2005-01-20#Artikel10
  - number: '10.3'
    text: |-
      De gegevens ten behoeve van het verzuimherstel, bedoeld in het eerste lid, worden per post
      dan wel door middel van persoonlijke overhandiging ingediend bij het adres, genoemd in
      [artikel 4, tweede respectievelijk vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017886#Artikel4
    url: https://wetten.overheid.nl/BWBR0017886/2005-01-20#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0017886
        artikel: '4'
        paragraaf: '2'
  - number: '10.4'
    text: |-
      Indien het verzuim, bedoeld in het eerste lid, binnen de termijn, genoemd in het tweede lid, niet is hersteld of
      de aanvraag na herstel niet voldoet aan de in de [artikelen 6][ref1], [7][ref2] of [8, eerste lid][ref3], gestelde
      eisen, wordt de aanvraag niet in behandeling genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0017886#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0017886#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0017886#Artikel8
    url: https://wetten.overheid.nl/BWBR0017886/2005-01-20#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0017886
        artikel: '6'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0017886
        artikel: '7'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0017886
        artikel: '8'
        paragraaf: '2'
  - number: '11.1'
    text: |-
      De minister deelt de aanvrager binnen drie weken na de datum, genoemd in [artikel 8, tweede lid][ref1],
      schriftelijk mee of zijn aanvraag in behandeling wordt genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0017886#Artikel8
    url: https://wetten.overheid.nl/BWBR0017886/2005-01-20#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0017886
        artikel: '8'
        paragraaf: '2'
  - number: '11.2'
    text: |-
      Indien is voldaan aan de in de [artikelen 6][ref1], [7][ref2] en [8][ref3] gestelde eisen, wordt de aanvrager
      getoetst aan de eisen, bedoeld in [artikel 12][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0017886#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0017886#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0017886#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0017886#Artikel12
    url: https://wetten.overheid.nl/BWBR0017886/2005-01-20#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0017886
        artikel: '6'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0017886
        artikel: '7'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0017886
        artikel: '8'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0017886
        artikel: '12'
        paragraaf: '2'
  - number: '12'
    text: 'Een aanvrager voldoet aan de volgende eisen:'
    url: https://wetten.overheid.nl/BWBR0017886/2005-01-20#Artikel12
  - number: 12.a
    text: |-
      de aanvrager is een rechtspersoon, opgericht in overeenstemming met het recht van een van de lidstaten van de
      Europese Unie of een van de overige staten die partij zijn bij de Overeenkomst betreffende de Europese Economische
      Ruimte, en heeft zijn statutaire zetel, zijn hoofdbestuur of zijn hoofdvestiging binnen de Europese Economische
      Ruimte;
    url: https://wetten.overheid.nl/BWBR0017886/2005-01-20#Artikel12
  - number: 12.b
    text: 'wat betreft de financiële positie van de aanvrager:'
    url: https://wetten.overheid.nl/BWBR0017886/2005-01-20#Artikel12
  - number: 12.b.1°
    text: de aanvrager verkeert niet in staat van faillissement;
    url: https://wetten.overheid.nl/BWBR0017886/2005-01-20#Artikel12
  - number: 12.b.2°
    text: |-
      de aanvrager is geen surseance van betaling verleend, noch is door de aanvrager surseance van betaling aangevraagd,
      en
    url: https://wetten.overheid.nl/BWBR0017886/2005-01-20#Artikel12
  - number: 12.b.3°
    text: geen substantieel beslag is gelegd op bedrijfsmiddelen van de aanvrager.
    url: https://wetten.overheid.nl/BWBR0017886/2005-01-20#Artikel12
  - number: '13.1'
    text: |-
      De minister stelt binnen vier weken na de datum, genoemd in [artikel 8, tweede lid][ref1], vast of de aanvrager
      voldoet aan de eisen, bedoeld in [artikel 12][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0017886#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0017886#Artikel12
    url: https://wetten.overheid.nl/BWBR0017886/2005-01-20#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0017886
        artikel: '8'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0017886
        artikel: '12'
        paragraaf: '2'
  - number: '13.2'
    text: |-
      Indien uit de aanvraag niet blijkt dat aan de eisen, bedoeld in [artikel 12][ref1] is voldaan, wijst de minister de
      aanvraag af. De minister stelt de desbetreffende aanvrager schriftelijk op de hoogte van zijn besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0017886#Artikel12
    url: https://wetten.overheid.nl/BWBR0017886/2005-01-20#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0017886
        artikel: '12'
        paragraaf: '2'
  - number: '14.1'
    text: |-
      Na de vaststelling, bedoeld in [artikel 13, eerste lid][ref1], stelt de minister aan de hand van de opgave, bedoeld
      in [artikel 7, eerste lid][ref2], van de aanvragers die aan de eisen, bedoeld in [artikel 12][ref3], voldoen, vast
      of de voor WLL beschikbare vergunningen zonder toepassing van een veiling kunnen worden verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0017886#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0017886#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0017886#Artikel12
    url: https://wetten.overheid.nl/BWBR0017886/2005-01-20#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0017886
        artikel: '13'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0017886
        artikel: '7'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0017886
        artikel: '12'
        paragraaf: '2'
  - number: '14.2'
    text: |-
      Indien voor een kavel als bedoeld in [artikel 3][ref1] slechts één van de aanvragers, bedoeld in het eerste lid,
      zijn belangstelling heeft opgegeven, vindt veiling van die kavel niet plaats en wordt met betrekking tot die kavel
      aan de desbetreffende aanvrager vergunning verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0017886#Artikel3
    url: https://wetten.overheid.nl/BWBR0017886/2005-01-20#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0017886
        artikel: '3'
        paragraaf: '2'
  - number: '14.3'
    text: |-
      In afwijking van het tweede lid vindt veiling plaats indien voor de kavels, bedoeld in
      [artikel 3, onder c en d][ref1], slechts één van de aanvragers, bedoeld in het eerste lid, zijn belangstelling
      heeft opgegeven en tevens één van de andere aanvragers, bedoeld in het eerste lid, zijn belangstelling heeft
      opgegeven voor de kavel, bedoeld in [artikel 3, onder f][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0017886#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0017886#Artikel3
    url: https://wetten.overheid.nl/BWBR0017886/2005-01-20#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0017886
        artikel: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0017886
        artikel: '3'
        paragraaf: '2'
  - number: '14.4'
    text: |-
      Indien in het geval van het tweede lid de desbetreffende aanvrager als enige zijn belangstelling heeft aangegeven
      voor meer kavels dan hij op grond van [artikel 7, tweede lid][ref1], kan verwerven, wordt aan hem de keuze
      voorgelegd welke van deze kavels hij wenst te verwerven.


      [ref1]: https://wetten.overheid.nl/BWBR0017886#Artikel7
    url: https://wetten.overheid.nl/BWBR0017886/2005-01-20#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0017886
        artikel: '7'
        paragraaf: '2'
  - number: '14.5'
    text: |-
      Indien voor een kavel als bedoeld in [artikel 3][ref1] meer dan één van de aanvragers, bedoeld in het eerste lid,
      zijn belangstelling heeft opgegeven, vindt met betrekking tot die kavel veiling plaats waaraan alle aanvragers,
      bedoeld in het eerste lid, die voor die kavel hun belangstelling hebben aangegeven, deelnemen.


      [ref1]: https://wetten.overheid.nl/BWBR0017886#Artikel3
    url: https://wetten.overheid.nl/BWBR0017886/2005-01-20#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0017886
        artikel: '3'
        paragraaf: '2'
  - number: '15.1'
    text: |-
      Indien uit de aanvraag blijkt dat is voldaan aan de eisen, bedoeld in [artikel 12][ref1], en na toepassing
      van [artikel 14][ref2] de noodzaak van veilen is komen vast te staan, stelt de minister de aanvrager hiervan
      schriftelijk in kennis. De minister deelt de aanvrager hierbij tevens mede voor welke kavel of kavels als bedoeld
      in [artikel 3][ref3] hij als deelnemer wordt toegelaten tot de veiling.


      [ref1]: https://wetten.overheid.nl/BWBR0017886#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0017886#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0017886#Artikel3
    url: https://wetten.overheid.nl/BWBR0017886/2005-01-20#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0017886
        artikel: '12'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0017886
        artikel: '14'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0017886
        artikel: '3'
        paragraaf: '2'
  - number: '15.2'
    text: |-
      Bij de kennisgeving, bedoeld in het eerste lid, wordt aan de aanvragers van een kavel als bedoeld in
      [artikel 3][ref1], tevens bekendgemaakt hoeveel als deelnemer toegelaten aanvragers er voor die kavel zijn, alsmede
      hoeveel aanvragers er in totaal zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0017886#Artikel3
    url: https://wetten.overheid.nl/BWBR0017886/2005-01-20#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0017886
        artikel: '3'
        paragraaf: '2'
  - number: '15.3'
    text: |-
      Onverminderd het tweede lid wordt aan de aanvragers van de kavels, bedoeld in [artikel 3, onder c en d][ref1],
      tevens het aantal aanvragers voor de kavel, bedoeld in [artikel 3, onder f][ref2], bekendgemaakt. Aan
      de aanvragers van laatstgenoemde kavel wordt tevens het aantal aanvragers voor de kavels, bedoeld in
      [artikel 3, onder c en d][ref3], bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0017886#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0017886#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0017886#Artikel3
    url: https://wetten.overheid.nl/BWBR0017886/2005-01-20#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0017886
        artikel: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0017886
        artikel: '3'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0017886
        artikel: '3'
        paragraaf: '2'
  - number: '16.1'
    text: |-
      Voor het geval na toepassing van [artikel 14][ref1] is gebleken dat één of meer vergunningen als bedoeld in
      [artikel 2][ref2], niet op de in [artikel 7 van het Frequentiebesluit][ref3] bedoelde wijze kunnen worden verleend,
      wijst de minister een veilingmeester en een notaris aan.


      [ref1]: https://wetten.overheid.nl/BWBR0017886#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0017886#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0009997#Artikel7
    url: https://wetten.overheid.nl/BWBR0017886/2005-01-20#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0017886
        artikel: '14'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0017886
        artikel: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0009997
        artikel: '7'
  - number: '16.2'
    text: De veilingmeester leidt de veiling en draagt zorg voor een goed en ordelijk verloop van de veiling.
    url: https://wetten.overheid.nl/BWBR0017886/2005-01-20#Artikel16
  - number: '16.3'
    text: De veilingmeester handelt bij de uitoefening van zijn taak in overeenstemming met de minister.
    url: https://wetten.overheid.nl/BWBR0017886/2005-01-20#Artikel16
  - number: '16.4'
    text: |-
      De notaris heeft tijdens de veilingprocedure een controlerende taak ten behoeve van een ordelijk verloop van de
      veiling.
    url: https://wetten.overheid.nl/BWBR0017886/2005-01-20#Artikel16
  - number: '17.1'
    text: |-
      Een deelnemer onthoudt zich voorafgaand aan en gedurende de veilingprocedure van afspraken of onderling afgestemde
      feitelijke gedragingen die afbreuk doen aan de tot stand te brengen mededinging in de veilingprocedure.
    url: https://wetten.overheid.nl/BWBR0017886/2005-01-20#Artikel17
  - number: '17.2'
    text: De minister kan een deelnemer die handelt in strijd met het eerste lid van deelname aan de veiling uitsluiten.
    url: https://wetten.overheid.nl/BWBR0017886/2005-01-20#Artikel17
  - number: '17.3'
    text: Een tijdens de veiling uitgebracht bod door een van deelname aan de veiling uitgesloten deelnemer is ongeldig.
    url: https://wetten.overheid.nl/BWBR0017886/2005-01-20#Artikel17
  - number: '18.1'
    text: De minister kan de veiling opschorten.
    url: https://wetten.overheid.nl/BWBR0017886/2005-01-20#Artikel18
  - number: '18.2'
    text: |-
      De minister kan onder meer tot opschorting van de veiling overgaan indien naar zijn oordeel sprake is van afspraken
      of gedragingen in strijd met [artikel 17, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017886#Artikel17
    url: https://wetten.overheid.nl/BWBR0017886/2005-01-20#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0017886
        artikel: '17'
        paragraaf: '5'
  - number: '19.1'
    text: De kavels worden via een veiling met gesloten bod geveild.
    url: https://wetten.overheid.nl/BWBR0017886/2005-01-20#Artikel19
  - number: '19.2'
    text: De veiling met gesloten bod omvat één veilingronde.
    url: https://wetten.overheid.nl/BWBR0017886/2005-01-20#Artikel19
  - number: '19.3'
    text: De kavels worden gelijktijdig geveild.
    url: https://wetten.overheid.nl/BWBR0017886/2005-01-20#Artikel19
  - number: '19.4'
    text: |-
      De deelnemers kunnen een bod uitbrengen op de kavel of kavels die zijn aangegeven in de kennisgeving, bedoeld in
      [artikel 16, eerste lid][ref1]. Daarbij kan hij aangeven hoeveel frequentieruimte hij maximaal wenst te verwerven.


      [ref1]: https://wetten.overheid.nl/BWBR0017886#Artikel16
    url: https://wetten.overheid.nl/BWBR0017886/2005-01-20#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0017886
        artikel: '16'
        paragraaf: '4'
  - number: '20'
    text: |-
      Een deelnemer is vanaf het moment dat hij een bod heeft uitgebracht tot en met het tijdstip waarop de
      veiling is afgerond onvoorwaardelijk en onherroepelijk aan zijn bod gebonden, tenzij hij op grond van
      [artikel 17, tweede lid][ref1], wordt uitgesloten van verdere deelname aan de veiling.


      [ref1]: https://wetten.overheid.nl/BWBR0017886#Artikel17
    url: https://wetten.overheid.nl/BWBR0017886/2005-01-20#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0017886
        artikel: '17'
        paragraaf: '5'
  - number: '21.1'
    text: |-
      Tegelijk met de kennisgeving, bedoeld in [artikel 15, eerste lid][ref1], wordt aan iedere deelnemer een biedkaart
      verstrekt. Het model van deze biedkaart is als [bijlage II][ref2] bij deze regeling gevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0017886#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0017886
    url: https://wetten.overheid.nl/BWBR0017886/2005-01-20#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0017886
        artikel: '15'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0017886
  - number: '21.2'
    text: 'Bij het verstrekken van de biedkaart wordt tevens vermeld:'
    url: https://wetten.overheid.nl/BWBR0017886/2005-01-20#Artikel21
  - number: 21.2.a
    text: vanaf welk tijdstip de biedkaart kan worden ingediend;
    url: https://wetten.overheid.nl/BWBR0017886/2005-01-20#Artikel21
  - number: 21.2.b
    text: op welk tijdstip de biedkaart uiterlijk moet zijn ingediend;
    url: https://wetten.overheid.nl/BWBR0017886/2005-01-20#Artikel21
  - number: 21.2.c
    text: op welk adres de biedkaart per post dan wel door middel van persoonlijke overhandiging moet worden ingediend.
    url: https://wetten.overheid.nl/BWBR0017886/2005-01-20#Artikel21
  - number: '21.3'
    text: |-
      Een bod wordt uitsluitend uitgebracht door middel van de in het eerste lid bedoelde biedkaart op het in het tweede
      lid, onder c, bedoelde adres.
    url: https://wetten.overheid.nl/BWBR0017886/2005-01-20#Artikel21
  - number: '21.4'
    text: De biedkaart wordt in de Nederlandse taal ingevuld.
    url: https://wetten.overheid.nl/BWBR0017886/2005-01-20#Artikel21
  - number: '21.5'
    text: Het bedrag van het bod wordt in letters geschreven en wordt vermeld in hele euro’s.
    url: https://wetten.overheid.nl/BWBR0017886/2005-01-20#Artikel21
  - number: '21.6'
    text: |-
      De deelnemer aan de veiling die een bod uitbrengt, voldoet een bedrag ter hoogte van zijn bod tot zekerheid van de
      gestanddoening van zijn bod. Het bedrag is gelijk aan het maximum bedrag ter gestanddoening van het bod op de kavel
      of het samenstel van kavels dat de deelnemer wenst en, gelet op [artikel 7, tweede lid][ref1], kan verwerven. Het
      bedrag dient mede ter zekerheid van al hetgeen de deelnemer overigens in verband met de veiling verschuldigd is.


      [ref1]: https://wetten.overheid.nl/BWBR0017886#Artikel7
    url: https://wetten.overheid.nl/BWBR0017886/2005-01-20#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0017886
        artikel: '7'
        paragraaf: '2'
  - number: '21.7'
    text: |-
      Uiterlijk op het in het tweede lid, onder b, bedoelde tijdstip, is het bedoelde bedrag, onder vermelding van
      ‘zekerheidstelling WLL’ ontvangen op het bankrekeningnummer, genoemd in [artikel 4, derde lid][ref1], of is voor
      het bedoelde bedrag ter zekerheidstelling een bankgarantie volgens het model dat als [bijlage III][ref2] bij deze
      regeling is gevoegd, overgelegd aan de notaris op het in [artikel 4, vierde lid][ref3], genoemde adres.


      [ref1]: https://wetten.overheid.nl/BWBR0017886#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0017886
      [ref3]: https://wetten.overheid.nl/BWBR0017886#Artikel4
    url: https://wetten.overheid.nl/BWBR0017886/2005-01-20#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0017886
        artikel: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0017886
      - id: ref3
        bwb_id: BWBR0017886
        artikel: '4'
        paragraaf: '2'
  - number: '22.1'
    text: |-
      Een bod, alsmede de hoeveelheid frequentieruimte die een deelnemer maximaal wenst te verwerven, wordt uitgebracht
      op een biedkaart die:
    url: https://wetten.overheid.nl/BWBR0017886/2005-01-20#Artikel22
  - number: 22.1.a
    text: |-
      niet eerder dan het in [artikel 21, tweede lid, onder a][ref1], bedoelde tijdstip en niet later dan het in
      [artikel 21, tweede lid, onder b][ref2], bedoelde tijdstip wordt ingediend;


      [ref1]: https://wetten.overheid.nl/BWBR0017886#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0017886#Artikel21
    url: https://wetten.overheid.nl/BWBR0017886/2005-01-20#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0017886
        artikel: '21'
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0017886
        artikel: '21'
        paragraaf: '6'
  - number: 22.1.b
    text: volledig en op de juiste wijze is ingevuld en ondertekend.
    url: https://wetten.overheid.nl/BWBR0017886/2005-01-20#Artikel22
  - number: '22.2'
    text: |-
      De notaris stelt vast of de biedkaart niet eerder, onderscheidenlijk niet later dan de in het eerste lid, onder a,
      bedoelde tijdstippen is ingediend.
    url: https://wetten.overheid.nl/BWBR0017886/2005-01-20#Artikel22
  - number: '23.1'
    text: |-
      Indien een bod niet voldoet aan de [artikelen 21, derde, vierde, vijfde, zesde of zevende lid][ref1], of
      [22, eerste lid, onder b][ref2], wordt de deelnemer op aanwijzing van de veilingmeester door tussenkomst van de
      notaris in de gelegenheid gesteld alsnog aan genoemde bepalingen te voldoen binnen een door de veilingmeester te
      stellen termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0017886#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0017886#Artikel22
    url: https://wetten.overheid.nl/BWBR0017886/2005-01-20#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0017886
        artikel: '21'
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0017886
        artikel: '22'
        paragraaf: '6'
  - number: '23.2'
    text: 'Een bod is ongeldig indien:'
    url: https://wetten.overheid.nl/BWBR0017886/2005-01-20#Artikel23
  - number: 23.2.a
    text: |-
      het niet voldoet aan [artikel 22, eerste lid, onder a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0017886#Artikel22
    url: https://wetten.overheid.nl/BWBR0017886/2005-01-20#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0017886
        artikel: '22'
        paragraaf: '6'
  - number: 23.2.b
    text: na toepassing van het eerste lid nog niet is voldaan aan de daarin genoemde bepalingen.
    url: https://wetten.overheid.nl/BWBR0017886/2005-01-20#Artikel23
  - number: '23.3'
    text: |-
      De deelnemer van wie de veilingmeester heeft vastgesteld dat deze een ongeldig bod als bedoeld in het tweede lid
      heeft uitgebracht, wordt hiervan door de veilingmeester via de notaris afzonderlijk op de hoogte gesteld.
    url: https://wetten.overheid.nl/BWBR0017886/2005-01-20#Artikel23
  - number: '24'
    text: 'De verdeling van de kavels geschiedt aan de hand van de volgende volgorde:'
    url: https://wetten.overheid.nl/BWBR0017886/2005-01-20#Artikel24
  - number: 24.a
    text: |-
      de veilingmeester stelt na de veilingronde vast welke verdeling van uitgebrachte en geldige biedingen leidt tot
      de uitgifte van het grootste aantal kavels. Daarbij wordt de kavel, bedoeld in [artikel 3, onder f][ref1], als een
      samenstel van twee kavels geteld;


      [ref1]: https://wetten.overheid.nl/BWBR0017886#Artikel3
    url: https://wetten.overheid.nl/BWBR0017886/2005-01-20#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0017886
        artikel: '3'
        paragraaf: '2'
  - number: 24.b
    text: |-
      in geval van het bepaalde onder a. twee of meer verdelingen van uitgebrachte en geldige biedingen dezelfde grootste
      hoeveelheid kavels opleveren, stelt de veilingmeester vast bij welke verdeling de hoogste totaalopbrengst wordt
      gerealiseerd;
    url: https://wetten.overheid.nl/BWBR0017886/2005-01-20#Artikel24
  - number: 24.c
    text: |-
      in geval het bepaalde onder b. bij twee of meer verdelingen van uitgebrachte en geldige biedingen dezelfde
      hoogste totaalopbrengst wordt gerealiseerd, stelt de veilingmeester vast bij welke verdeling hiervan de grootste
      hoeveelheid frequentieruimte wordt uitgegeven;
    url: https://wetten.overheid.nl/BWBR0017886/2005-01-20#Artikel24
  - number: 24.d
    text: |-
      in geval het bepaalde onder c er twee of meer verdelingen van uitgebrachte en geldige biedingen dezelfde grootste
      hoeveelheid frequentieruimte uitgeven, stelt de veilingmeester, na loting door de notaris, vast welke verdeling
      hiervan wordt aangemerkt als de verdeling.
    url: https://wetten.overheid.nl/BWBR0017886/2005-01-20#Artikel24
  - number: '25.1'
    text: |-
      Met de vaststelling, bedoeld in [artikel 24][ref1], worden de kavels toegewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0017886#Artikel24
    url: https://wetten.overheid.nl/BWBR0017886/2005-01-20#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0017886
        artikel: '24'
        paragraaf: '6'
  - number: '25.2'
    text: |-
      Na de vaststelling, bedoeld in [artikel 24][ref1], deelt de veilingmeester door tussenkomst van de notaris aan de
      deelnemers de uitslag van de veiling mee, alsmede aan elke deelnemer aan wie een kavel is toegewezen, welke kavel
      aan hem is toegewezen. Hiermee is de veiling geëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0017886#Artikel24
    url: https://wetten.overheid.nl/BWBR0017886/2005-01-20#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0017886
        artikel: '24'
        paragraaf: '6'
  - number: '26.1'
    text: |-
      Na het einde van de veiling verleent de minister onverwijld aan de deelnemer, bedoeld in [artikel 25][ref1], de
      vergunning voor de betreffende kavel.


      [ref1]: https://wetten.overheid.nl/BWBR0017886#Artikel25
    url: https://wetten.overheid.nl/BWBR0017886/2005-01-20#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0017886
        artikel: '25'
        paragraaf: '6'
  - number: '26.2'
    text: |-
      De deelnemer, bedoeld in het eerste lid, die ter voldoening van het bedrag ter zekerheidstelling een bankgarantie
      heeft overgelegd, betaalt het door hem verschuldigde bedrag ter hoogte van zijn bod binnen twee weken volgend op
      het tijdstip waarop de veiling is geëindigd op het bankrekeningnummer, genoemd in [artikel 4, derde lid][ref1],
      onder vermelding van ‘WLL-veilingbod’. Zodra het verschuldigde bedrag is ontvangen wordt de bankgarantie
      teruggegeven aan de bank die deze bankgarantie heeft afgegeven door middel van de procedure zoals beschreven in het
      als [bijlage III][ref2] bij deze regeling opgenomen model van de bankgarantie. De Minister van Economische Zaken
      stelt de vergunninghouder onverwijld op de hoogte van het teruggeven van de bankgarantie.


      [ref1]: https://wetten.overheid.nl/BWBR0017886#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0017886
    url: https://wetten.overheid.nl/BWBR0017886/2005-01-20#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0017886
        artikel: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0017886
  - number: '26.3'
    text: |-
      Indien de deelnemer, bedoeld in het eerste lid, niet aan zijn betalingsverplichting als bedoeld in het tweede lid
      voldoet, wordt de door hem overgelegde bankgarantie voor de betaling aangewend.
    url: https://wetten.overheid.nl/BWBR0017886/2005-01-20#Artikel26
  - number: '26.4'
    text: |-
      Indien de deelnemer, bedoeld in het eerste lid, ter voldoening van het bedrag ter zekerheidstelling een waarborgsom
      heeft gestort, wordt de door hem gestorte waarborgsom voor de betaling van het door hem verschuldigde bedrag ter
      hoogte van zijn bod aangewend.
    url: https://wetten.overheid.nl/BWBR0017886/2005-01-20#Artikel26
  - number: '26.5'
    text: |-
      De minister betaalt de deelnemer aan wie geen kavel is toegewezen, en die ter voldoening van het bedrag
      ter zekerheidstelling, een waarborgsom heeft gestort, deze waarborgsom, vermeerderd met de rente van een
      éénmaandsdeposito van de bank, bedoeld in [artikel 4, derde lid][ref1], terug of geeft, indien de deelnemer
      ter voldoening van het bedrag ter zekerheidstelling een bankgarantie heeft overgelegd, deze bankgarantie terug
      aan de bank die deze bankgarantie heeft afgegeven door middel van de procedure zoals beschreven in het als
      [bijlage III][ref2] bij deze regeling opgenomen model van de bankgarantie. De Minister van Economische Zaken stelt
      de vergunninghouder onverwijld op de hoogte van het teruggeven van de bankgarantie.


      [ref1]: https://wetten.overheid.nl/BWBR0017886#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0017886
    url: https://wetten.overheid.nl/BWBR0017886/2005-01-20#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0017886
        artikel: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0017886
  - number: '27'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0017886/2005-01-20#Artikel27
  - number: '28'
    text: |-
      Deze regeling wordt aangehaald als: Regeling aanvraagprocedure en veiling gebruiksrecht frequentieruimte voor WLL
      26 GHz.
    url: https://wetten.overheid.nl/BWBR0017886/2005-01-20#Artikel28
