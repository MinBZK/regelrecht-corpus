preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben dat het wenselijk is de positie van de referent in het reguliere
    vreemdelingenrecht te versterken en de reguliere vreemdelingenrechtelijke procedure te versnellen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0027930/2013-09-21#ArtikelAanhef
articles:
  - number: XI
    text: |-
      1 Op het tijdstip waarop deze wet in werking treedt, wordt als referent in de zin van
      [artikel 2c van de Vreemdelingenwet 2000][ref1] erkend de onderneming of rechtspersoon waarmee Onze
      Minister voor de inwerkingtreding van deze wet een convenant met betrekking tot de uitvoering van de
      [Vreemdelingenwet 2000][ref2] heeft gesloten, voor zover in de periode van een jaar direct voorafgaand aan de
      inwerkingtreding van deze wet ter uitvoering van dat convenant een machtiging tot voorlopig verblijf of een
      verblijfsvergunning als bedoeld in [artikel 14 van de Vreemdelingenwet 2000][ref3] is verleend.

      2 Met Onze Minister gesloten convenanten als bedoeld in het eerste lid zijn met ingang van het tijdstip waarop deze
      wet in werking treedt, beëindigd.

      3 Voor de toepassing van het eerste lid wordt met convenant gelijk gesteld de verklaring, bedoeld in
      [artikel 1d, eerste lid, van het Besluit uitvoering Wet arbeid vreemdelingen][ref4].

      4 Onze Minister stelt de onderneming of rechtspersoon, met wie een convenant als bedoeld in het eerste lid, is
      gesloten of die een verklaring als bedoeld in het derde lid heeft afgelegd, binnen vier weken na inwerkingtreding
      van deze wet in kennis van diens positie als erkend referent.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel2c
