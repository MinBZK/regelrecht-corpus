  - number: XIII
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot de invoering
      van deze wet.
    url: https://wetten.overheid.nl/BWBR0027930/2013-09-21#ArtikelXIII
  - number: XIV
    text: |-
      Onze Minister zendt vijf jaar na de inwerkingtreding van deze wet en vervolgens na vijf jaar aan de Staten-Generaal
      een verslag over de doeltreffendheid en de effecten in de praktijk van de onderdelen van deze wet.
    url: https://wetten.overheid.nl/BWBR0027930/2013-09-21#ArtikelXIV
  - number: XV
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip dat voor de
      verschillende artikelen en onderdelen daarvan en voor de verschillende verblijfsdoelen verschillend kan zijn.
    url: https://wetten.overheid.nl/BWBR0027930/2013-09-21#ArtikelXV
  - number: XVI
    text: 'Deze wet wordt aangehaald als: Wet modern migratiebeleid.'
    url: https://wetten.overheid.nl/BWBR0027930/2013-09-21#ArtikelXVI
