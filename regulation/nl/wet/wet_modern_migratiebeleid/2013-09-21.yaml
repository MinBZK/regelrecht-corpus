  - number: XII
    text: |-
      1 Op het tijdstip waarop deze wet in werking treedt, wordt de bij of krachtens algemene maatregel van bestuur
      aangewezen persoon of organisatie referent van de houder van een verblijfsvergunning als bedoeld in artikel 14 van
      de Wet.

      2 Gedurende vijf jaren na het tijdstip van inwerkingtreding van deze wet is het eerste lid niet van toepassing,
      indien de aanvraag tot het verlenen of wijzigen van de verblijfsvergunning is ingediend voor een bij algemene
      maatregel van bestuur vastgesteld tijdstip, met dien verstande dat de kosten van uitzetting, bedoeld in
      [artikel 66 van de Vreemdelingenwet 2000][ref1], kunnen worden verhaald op de persoon of organisatie, bedoeld in
      het eerste lid, die in de periode van vijf jaar voordat deze kosten zijn gemaakt, ten behoeve van het verblijf van
      de vreemdeling een garantverklaring heeft ondertekend.

      3 Het tweede lid is niet van toepassing, indien de referent voor het tijdstip van inwerkingtreding van deze wet een
      convenant als bedoeld in [artikel XI, eerste lid][ref2], van deze wet heeft gesloten, dan wel een verklaring als
      bedoeld in artikel XI, derde lid, heeft afgelegd.

      4 Onze Minister stelt de persoon of organisatie, bedoeld in het eerste lid, binnen vier weken na inwerkingtreding
      van deze wet in kennis van diens positie als referent.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel66
      [ref2]: https://wetten.overheid.nl/BWBR0027930#ArtikelXI
