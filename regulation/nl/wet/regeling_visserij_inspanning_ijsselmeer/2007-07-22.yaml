---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: regeling_visserij_inspanning_ijsselmeer
regulatory_layer: WET
publication_date: '2008-09-26'
valid_from: '2007-07-22'
bwb_id: BWBR0008072
url: https://wetten.overheid.nl/BWBR0008072/2007-07-22
preamble:
  text: |-
    Gelet op de artikelen 6, derde lid, 8, 12 en 13 van het Reglement voor de binnenvisserij 1985;

    Gezien het advies van het Produktschap Vis;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0008072/2007-07-22#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

            a

              *minister:*


              Minister van Landbouw Natuur en Voedselkwaliteit;



            b

              *vergunning:*


              vergunning als bedoeld in artikel 8 van het Reglement voor de binnenvisserij 1985;



            c

              *merkje:*


              door of vanwege de minister verstrekt, bij een vergunning behorend merkteken;



            d

              *verordening:*


              [verordening (EG) nr. 3759/92](31992R3759) van de Raad van de Europese Gemeenschappen van 17 december 1992
      houdende een gemeenschappelijke ordening der markten in de sector visserijprodukten en produkten van de aquacultuur
      (PbEG L 388);



            e

              *producentenorganisatie:*


              organisatie als bedoeld in artikel 4 van de verordening;



            f

              *PO-IJsselmeer:*


              erkende producentenorganisatie als bedoeld in [artikel 2, tweede lid, onderdeel a][ref1];



            g

              *aangeslotene:*


              aangeslotene bij de PO-IJsselmeer;



            h

              *LASER:*


              dienst Landelijke Service bij Regelingen van het Ministerie van Landbouw, Natuurbeheer en Visserij.


      [ref1]: https://wetten.overheid.nl/BWBR0008072#Artikel2
    url: https://wetten.overheid.nl/BWBR0008072/2007-07-22#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0008072
        artikel: '2'
  - number: '2.1'
    text: |-
      Onverminderd het bepaalde in de [Regeling IJsselmeervisserij 1993][ref1] is het verboden te vissen in het
      IJsselmeer gedurende een door de minister te bepalen en in de Staatscourant bekend te maken periode, met alle
      vistuigen behalve de hengel, de peur en het spieringtuig.


      [ref1]: https://wetten.overheid.nl/BWBR0005886
    url: https://wetten.overheid.nl/BWBR0008072/2007-07-22#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005886
  - number: '2.2'
    text: 'Van het verbod, bedoeld in het eerste lid, wordt vrijstelling verleend indien de minister:'
    url: https://wetten.overheid.nl/BWBR0008072/2007-07-22#Artikel2
  - number: 2.2.a
    text: een producentenorganisatie voor het IJsselmeer heeft erkend overeenkomstig artikel 4bis van de verordening;
    url: https://wetten.overheid.nl/BWBR0008072/2007-07-22#Artikel2
  - number: 2.2.b
    text: heeft vastgesteld dat het aantal aangeslotenen tenminste 59% bedraagt van het totaal aantal vergunninghouders;
    url: https://wetten.overheid.nl/BWBR0008072/2007-07-22#Artikel2
  - number: 2.2.c
    text: |-
      de statuten en het huishoudelijk reglement van de PO-IJsselmeer alsmede het door die organisatie opgestelde visplan
      voor het eerstvolgende visseizoen heeft goedgekeurd, en
    url: https://wetten.overheid.nl/BWBR0008072/2007-07-22#Artikel2
  - number: 2.2.d
    text: |-
      van oordeel is dat de naleving van deze regeling en van de afspraken die zijn gemaakt binnen de PO-IJsselmeer
      voldoende verzekerd is.
    url: https://wetten.overheid.nl/BWBR0008072/2007-07-22#Artikel2
  - number: '2.3'
    text: 'Een vrijstelling als bedoeld in het tweede lid:'
    url: https://wetten.overheid.nl/BWBR0008072/2007-07-22#Artikel2
  - number: 2.3.a
    text: |-
      geldt slechts voor de aangeslotenen wier aansluiting dateert van vóór 1 januari van het jaar waarin de periode is
      gelegen waarop de vrijstelling betrekking heeft, en
    url: https://wetten.overheid.nl/BWBR0008072/2007-07-22#Artikel2
  - number: 2.3.b
    text: gaat in op het tijdstip dat door de minister in de Staatscourant is bekend gemaakt.
    url: https://wetten.overheid.nl/BWBR0008072/2007-07-22#Artikel2
  - number: '2.4'
    text: |-
      De minister kan de in het tweede lid bedoelde vrijstelling intrekken, indien naar zijn oordeel niet langer is
      voldaan aan één of meer van de in het tweede lid, onderdelen a tot en met d, bedoelde voorwaarden.
    url: https://wetten.overheid.nl/BWBR0008072/2007-07-22#Artikel2
  - number: '2.5'
    text: |-
      De minister komt in ieder geval tot het oordeel dat niet langer aan het tweede lid, onderdeel d, is voldaan, indien
      het bestuur van de PO-IJsselmeer naar zijn oordeel onvoldoende zorgdraagt voor:
    url: https://wetten.overheid.nl/BWBR0008072/2007-07-22#Artikel2
  - number: 2.5.a
    text: de controle op de naleving van het goedgekeurde visplan;
    url: https://wetten.overheid.nl/BWBR0008072/2007-07-22#Artikel2
  - number: 2.5.b
    text: |-
      de controle op de naleving door de aangeslotenen van de statuten, het huishoudelijk reglement en andere binnen de
      PO-IJsselmeer gemaakte huishoudelijke afspraken;
    url: https://wetten.overheid.nl/BWBR0008072/2007-07-22#Artikel2
  - number: 2.5.c
    text: |-
      het in voorkomende gevallen overeenkomstig deze regeling wijzigen van de vergunningen, bedoeld in
      [artikel 7, derde lid][ref1], en [artikel 8, eerste lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0008072#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0008072#Artikel8
    url: https://wetten.overheid.nl/BWBR0008072/2007-07-22#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0008072
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0008072
        artikel: '8'
  - number: 2.5.d
    text: |-
      het voeren van een deugdelijke registratie en administratie van overdrachtstransacties van delen van vergunningen
      door aangeslotenen;
    url: https://wetten.overheid.nl/BWBR0008072/2007-07-22#Artikel2
  - number: 2.5.e
    text: |-
      het voeren van een deugdelijke administratie, waaruit te allen tijde blijkt: - wie aangeslotene is en vanaf welk
      tijdstip;
        - ten behoeve van wie de PO-IJsselmeer namens de minister een vergunning heeft gewijzigd, alsmede de reikwijdte van
      die vergunningen;
    url: https://wetten.overheid.nl/BWBR0008072/2007-07-22#Artikel2
  - number: 2.5.f
    text: het terstond berichten aan de Dienst Regelingen welke aangeslotenen de PO hebben verlaten;
    url: https://wetten.overheid.nl/BWBR0008072/2007-07-22#Artikel2
  - number: 2.5.g
    text: het onverwijld doorgeven aan de minister van elke wijziging van de statuten en huishoudelijke reglementen;
    url: https://wetten.overheid.nl/BWBR0008072/2007-07-22#Artikel2
  - number: 2.5.h
    text: |-
      het aan de Algemene Inspectie-dienst van het Ministerie van Landbouw, Natuur en Voedselkwaliteit te allen tijd
      inzage geven in de gegevens, bedoeld in onderdeel d, e en f;
    url: https://wetten.overheid.nl/BWBR0008072/2007-07-22#Artikel2
  - number: 2.5.i
    text: |-
      het desverzocht onverwijld verstrekken aan de Dienst Regelingen van een afschrift van de in onderdeel d, e en f
      bedoelde gegevens.
    url: https://wetten.overheid.nl/BWBR0008072/2007-07-22#Artikel2
  - number: '3.1'
    text: |-
      Goedkeuring door de minister van een visplan als bedoeld in [artikel 2, tweede lid, onderdeel c][ref1], kan slechts
      plaatsvinden indien:


      [ref1]: https://wetten.overheid.nl/BWBR0008072#Artikel2
    url: https://wetten.overheid.nl/BWBR0008072/2007-07-22#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0008072
        artikel: '2'
  - number: 3.1.a
    text: het plan vóór 1 januari van het desbetreffende jaar ter goedkeuring aan de minister is voorgelegd, en
    url: https://wetten.overheid.nl/BWBR0008072/2007-07-22#Artikel3
  - number: 3.1.b
    text: |-
      daarin tenminste is aangegeven welke maatregelen genomen zijn of zullen worden genomen om de ten tijde van de
      inwerkingtreding van deze regeling op basis van [artikel 8 van het Reglement voor de binnenvisserij 1985][ref1]
      toegestane visserij-inspanning van de aangeslotenen, te reduceren met 32% met ingang van het jaar 2007.


      [ref1]: https://wetten.overheid.nl/BWBR0009027#Artikel8
    url: https://wetten.overheid.nl/BWBR0008072/2007-07-22#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0009027
        artikel: '8'
  - number: '3.2'
    text: |-
      In afwijking van het eerste lid, onderdeel a, kan voor 2007 ten genoegen van de Minister een andere datum dan 1
      januari worden aangehouden, die naar het oordeel van de Minister geen afbreuk doet aan de effectiviteit van het
      visplan.
    url: https://wetten.overheid.nl/BWBR0008072/2007-07-22#Artikel3
  - number: '4'
    text: 'Een vergunning wordt slechts verleend, voor zover:'
    url: https://wetten.overheid.nl/BWBR0008072/2007-07-22#Artikel4
  - number: 4.a
    text: |-
      de bij de desbetreffende vergunning behorende merkjes op of aan het betrokken vistuig of de betrokken vistuigen
      zijn bevestigd;
    url: https://wetten.overheid.nl/BWBR0008072/2007-07-22#Artikel4
  - number: 4.b
    text: |-
      niet wordt gevist met meer of andere vistuigen dan het aantal onderscheidenlijk de soort of soorten vistuigen
      waarmee de betrokken ondernemer op grond van de hem verleende vergunning gerechtigd is te vissen, en
    url: https://wetten.overheid.nl/BWBR0008072/2007-07-22#Artikel4
  - number: 4.c
    text: niet wordt gevist in strijd met de nadere voorschriften zoals deze in de desbetreffende vergunning zijn opgenomen.
    url: https://wetten.overheid.nl/BWBR0008072/2007-07-22#Artikel4
  - number: '5.1'
    text: |-
      Een vergunning als bedoeld in [artikel 4][ref1] wordt slechts verleend aan een
      ondernemer ten behoeve van een vissersvaartuig, dat in het visserijregister, bedoeld in
      [artikel 4 van het Besluit registratie vissersvaartuigen 1998][ref2], staat geregistreerd.


      [ref1]: https://wetten.overheid.nl/BWBR0008072#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0009353#Artikel4
    url: https://wetten.overheid.nl/BWBR0008072/2007-07-22#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0008072
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0009353
        artikel: '4'
  - number: '5.2'
    text: |-
      De minister verleent aan de ondernemer die op 31 mei 1996 om 24.00 uur op grond van artikel 8 van het Reglement
      voor de binnenvisserij 1985 gerechtigd was te vissen in het IJsselmeer, voor het desbetreffende vissersvaartuig
      een vergunning als bedoeld in [artikel 4][ref1]. De reikwijdte van de vergunning wordt vastgesteld met inachtneming
      van de historische rechten waarover de desbetreffende ondernemer in de periode van 1 juni 1995 tot en met 31 mei
      1996 op basis van artikel 8 van het Reglement voor de binnenvisserij 1985 kon beschikken, met een minimum van 30
      merkjes.


      [ref1]: https://wetten.overheid.nl/BWBR0008072#Artikel4
    url: https://wetten.overheid.nl/BWBR0008072/2007-07-22#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0008072
        artikel: '4'
  - number: '6.1'
    text: |-
      Overdracht van een gehele vergunning is slechts mogelijk - in het geval dat ten behoeve van de ondernemer een
      pandrecht op een vergunning is verleend, indien een verklaring van de pandhouder is overgelegd waaruit blijkt dat
      deze met de overdracht instemt, en
        - in het geval dat een aangeslotene is betrokken, indien een schriftelijke verklaring van de PO-IJsselmeer is
      overgelegd waaruit blijkt dat deze organisatie een afschrift van de desbetreffende overdrachtstransactie heeft
      ontvangen.
    url: https://wetten.overheid.nl/BWBR0008072/2007-07-22#Artikel6
  - number: '6.2'
    text: |-
      De instemming van de pandhouder, bedoeld in het eerste lid, is slechts vereist indien de pandhouder de minister
      door middel van een afschrift van de akte van verpanding in kennis heeft gesteld van het gevestigde pandrecht.
    url: https://wetten.overheid.nl/BWBR0008072/2007-07-22#Artikel6
  - number: '6.4'
    text: |-
      De overdracht vindt plaats door een gelijktijdige kennisgeving door de minister aan de aanvrager en aan de
      ondernemer aan wie de vergunning wordt overgedragen, dat laatstgenoemde de vergunning is verleend.
    url: https://wetten.overheid.nl/BWBR0008072/2007-07-22#Artikel6
  - number: '7.1'
    text: |-
      Overdracht van een deel van de vergunning is slechts mogelijk voor zover daarin is voorzien door het goedgekeurde
      visplan, bedoeld in [artikel 2, tweede lid, onderdeel c][ref1], en kan tijdelijk zijn of voor onbepaalde tijd.
      Een tijdelijke overdracht kan slechts betrekking hebben op een aaneengesloten periode van ten hoogste 12 maanden,
      gerekend vanaf 1 juni.


      [ref1]: https://wetten.overheid.nl/BWBR0008072#Artikel2
    url: https://wetten.overheid.nl/BWBR0008072/2007-07-22#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0008072
        artikel: '2'
  - number: '7.2'
    text: |-
      Een overdracht als bedoeld in het eerste lid, ongeacht of deze tijdelijk dan wel voor onbepaalde tijd is, is
      slechts mogelijk indien:
    url: https://wetten.overheid.nl/BWBR0008072/2007-07-22#Artikel7
  - number: 7.2.a
    text: |-
      de vrijstelling, bedoeld in [artikel 2, tweede lid][ref1], van kracht is, en


      [ref1]: https://wetten.overheid.nl/BWBR0008072#Artikel2
    url: https://wetten.overheid.nl/BWBR0008072/2007-07-22#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0008072
        artikel: '2'
  - number: 7.2.b
    text: zowel degene die overdraagt als degene aan wie wordt overgedragen aangeslotene zijn.
    url: https://wetten.overheid.nl/BWBR0008072/2007-07-22#Artikel7
  - number: '7.3'
    text: |-
      In geval van een overdracht als bedoeld in het eerste lid, wijzigt de PO-IJsselmeer namens de minister de
      desbetreffende vergunningen dienovereenkomstig, op verzoek van de betrokken aangeslotenen, mits is voldaan aan het
      tweede lid.
    url: https://wetten.overheid.nl/BWBR0008072/2007-07-22#Artikel7
  - number: '8.1'
    text: |-
      De PO-IJsselmeer wijzigt namens de minister jaarlijks, voor zover nodig, de vergunningen van de aangeslotenen,
      om de reduktie te bereiken van de visserij-inspanning, zoals vastgesteld in het goedgekeurde visplan, bedoeld in
      [artikel 2, tweede lid, onderdeel c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008072#Artikel2
    url: https://wetten.overheid.nl/BWBR0008072/2007-07-22#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0008072
        artikel: '2'
  - number: '8.2'
    text: |-
      Indien met het oog op de te bereiken reductie de PO merkjes van aangeslotenen inneemt en te hunnen name reserveert,
      vindt de berekening ten behoeve van de wijziging van de vergunningen, bedoeld in het eerste lid, plaats aan de hand
      van de omrekentabel, opgenomen in de bijlage bij deze regeling.
    url: https://wetten.overheid.nl/BWBR0008072/2007-07-22#Artikel8
  - number: '8.3'
    text: |-
      Het bepaalde in het eerste lid is slechts van toepassing indien de vrijstelling, bedoeld in
      [artikel 2, tweede lid][ref1], van kracht is.


      [ref1]: https://wetten.overheid.nl/BWBR0008072#Artikel2
    url: https://wetten.overheid.nl/BWBR0008072/2007-07-22#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0008072
        artikel: '2'
  - number: '9.1'
    text: |-
      Indien de vrijstelling, bedoeld in [artikel 2, tweede lid][ref1], wordt ingetrokken, worden de vergunningen van de
      aangeslotenen door de minister vervangen door een nieuwe vergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0008072#Artikel2
    url: https://wetten.overheid.nl/BWBR0008072/2007-07-22#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0008072
        artikel: '2'
  - number: '9.2'
    text: |-
      Bij een verlening van een nieuwe vergunning als bedoeld in het eerste lid is [artikel 5, tweede lid][ref1], van
      overeenkomstige toepassing, met uitzondering van het aldaar bedoelde minimumaantal van 30 merkjes.


      [ref1]: https://wetten.overheid.nl/BWBR0008072#Artikel5
    url: https://wetten.overheid.nl/BWBR0008072/2007-07-22#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0008072
        artikel: '5'
  - number: '9.3'
    text: |-
      In afwijking in zoverre van het tweede lid, worden bij de vaststelling van de reikwijdte van de nieuwe vergunning
      van de ondernemer, die ten tijde van de intrekking van de vrijstelling per saldo gedeelten van zijn vergunning voor
      onbepaalde tijd heeft overgedragen, die overgedragen gedeelten niet in aanmerking genomen.
    url: https://wetten.overheid.nl/BWBR0008072/2007-07-22#Artikel9
  - number: '9.4'
    text: |-
      Indien een aangeslotene de PO-IJsselmeer verlaat, door welke oorzaak ook, zijn de voorgaande leden van
      overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0008072/2007-07-22#Artikel9
  - number: '10'
    text: Deze regeling treedt in werking met ingang van 1 juni 1996.
    url: https://wetten.overheid.nl/BWBR0008072/2007-07-22#Artikel10
  - number: '11'
    text: 'Deze regeling wordt aangehaald als: Regeling visserij-inspanning IJsselmeer.'
    url: https://wetten.overheid.nl/BWBR0008072/2007-07-22#Artikel11
