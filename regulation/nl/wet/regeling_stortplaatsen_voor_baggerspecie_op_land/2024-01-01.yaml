    afvalstoffen (PbEG L 182), en op de artikelen 8.5, eerste lid, 8.15, eerste lid, 8.44, eerste lid, 8.45, eerste
    lid, 8.49, vijfde lid, 21.2, tweede lid, en 21.6, zesde lid, van de Wet milieubeheer;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0012665/2024-01-01#ArtikelAanhef
articles:
   - number: '31'
     text: |-
       Dit hoofdstuk is niet van toepassing op stortplaatsen die op grond van
       [artikel 8.47, derde lid, van de Wet milieubeheer][ref1] gesloten zijn verklaard op het tijdstip waarop deze
       regeling in werking treedt.

       [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8.47
   - number: '32'
     text: |-
       1 Ten aanzien van een gesloten stortplaats zijn de
       [artikelen 8.62g, eerste, tweede en derde lid, onder a][ref1], [8.62h][ref2], [8.62i][ref3],
       [8.62k][ref4], [8.62l][ref5], [8.62m][ref6], [8.62n, eerste en tweede lid, onder h][ref7], en
       [8.62o van het Besluit kwaliteit leefomgeving][ref8], [artikel 10.47a van het Omgevingsbesluit][ref9] en de
       [artikelen 9.28 tot en met 9.32 van de Omgevingsregeling][ref10] van overeenkomstige toepassing, met dien verstande
       dat:
 
       a. in [artikel 9.28, tweede lid, van de Omgevingsregeling][ref11], in plaats van `drie maanden' wordt gelezen:
       zes maanden;
 
       b. in het uitgewerkte urgentieplan, bedoeld in
       [artikel 8.62m, aanhef en onder b, van het Besluit kwaliteit leefomgeving,][ref12] mede wordt aangegeven of het
       noodzakelijk is dat alsnog een afdeklaag wordt aangebracht.
 
       2 Indien de stortplaats niet langer zodanig gevaar voor het milieu kan opleveren dat de verplichtingen, bedoeld in
       het eerste lid, ongewijzigd moeten worden voorgezet, kan het bevoegd gezag besluiten dat deze verplichtingen geheel
       of ten dele worden beëindigd of aangepast, dan wel worden vervangen door andere verplichtingen.
 
 
