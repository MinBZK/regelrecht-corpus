  - number: 5.11.2
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de uitoefening van de in het
      eerste lid bedoelde bevoegdheid.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel5.11
  - number: 5.11.3
    text: |-
      De [artikelen 7:32 tot en met 7:38 van de Wet financiële markten BES][ref1] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0030883#Artikel7
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel5.11
    references:
      - id: ref1
        bwb_id: BWBR0030883
        artikel: '7'
  - number: 5.12.1
    text: |-
      Het bedrag van de bestuurlijke boete wordt bepaald bij algemene maatregel van bestuur. Het bedrag van de
      bestuurlijke boete voor een afzonderlijke overtreding bedraagt ten hoogste USD 250 000, tenzij ten tijde van
      het plegen van de overtreding nog geen vijf jaren zijn verstreken sinds het opleggen aan de overtreder van een
      bestuurlijke boete ter zake van eenzelfde overtreding, in welk geval het bedrag van de bestuurlijke boete voor een
      afzonderlijke overtreding ten hoogste USD 500 000 bedraagt.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel5.12
  - number: 5.12.2
    text: |-
      De maatregel, bedoeld in het eerste lid, bepaalt voor elke daarin omschreven overtreding het bedrag van de deswege
      op te leggen bestuurlijke boete. De overtredingen kunnen worden gerangschikt in categorieën naar zwaarte van de
      overtreding met de daarbij behorende basisbedragen, minimumbedragen en maximumbedragen.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel5.12
  - number: 5.12.3
    text: |-
      In afwijking van het eerste lid kan de toezichtautoriteit, indien het voordeel dat de overtreder door de
      overtreding heeft verkregen, groter is dan de helft van het bedrag dat op grond van de in het eerste lid bedoelde
      algemene maatregel van bestuur ten hoogste voor die overtreding kan worden opgelegd, het bedrag van de bestuurlijke
      boete vaststellen op ten hoogste twee keer het bedrag van het door de overtreder verkregen voordeel.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel5.12
  - number: 5.12.4
    text: |-
      [Artikel 1, tweede lid, van het Wetboek van Strafrecht BES][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel1
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel5.12
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '1'
  - number: '5.13'
    text: |-
      Voor zover een bestuurlijke sanctie verplicht tot betaling van een geldsom, komt deze geldsom toe aan het
      bestuursorgaan dat de sanctie heeft opgelegd.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel5.13
  - number: 5.14.1
    text: |-
      Betaling van een verbeurde dwangsom of een bestuurlijke boete geschiedt aan een door de toezichtautoriteit te
      bepalen kantoor dan wel door bijschrijving op een daartoe door de toezichtautoriteit bestemde bankrekening.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel5.14
  - number: 5.14.2
    text: |-
      Betaling geschiedt in het wettig betaalmiddel van de openbare lichamen, tenzij door de toezichtautoriteit anders
      is bepaald.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel5.14
  - number: 5.14.3
    text: |-
      De betaling heeft plaats op het tijdstip waarop de betaling aan het kantoor wordt verricht dan wel, in geval van
      bijschrijving, de rekening van de toezichtautoriteit wordt gecrediteerd.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel5.14
  - number: 5.14.4
    text: De kosten van betaling komen ten laste van de schuldenaar.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel5.14
  - number: 5.14.5
    text: |-
      [Artikel 7:41 van de Wet financiële markten BES][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0030883#Artikel7
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel5.14
    references:
      - id: ref1
        bwb_id: BWBR0030883
        artikel: '7'
  - number: 5.15.1
    text: |-
      De bevoegdheid tot invordering van een verbeurde dwangsom verjaart door verloop van één jaar na de dag waarop de
      dwangsom is verbeurd.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel5.15
  - number: 5.15.2
    text: |-
      De rechtsvordering tot betaling van een geldsom, voortvloeiend uit een bestuurlijke boete, verjaart door verloop
      van vijf jaren, nadat de voorgeschreven betalingstermijn is verstreken.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel5.15
  - number: 5.15.3
    text: |-
      De [artikelen 7:43 tot en met 7:45 van de Wet financiële markten BES][ref1] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0030883#Artikel7
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel5.15
    references:
      - id: ref1
        bwb_id: BWBR0030883
        artikel: '7'
  - number: 5.16.1
    text: |-
      De toezichtautoriteit kan, met het oog op de belangen die deze wet beoogt te beschermen, bij overtreding van de in
      [artikel 5.11][ref1] bedoelde bepalingen een openbare waarschuwing uitvaardigen.


      [ref1]: https://wetten.overheid.nl/BWBR0030824#Artikel5
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel5.16
    references:
      - id: ref1
        bwb_id: BWBR0030824
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '3'
  - number: 5.16.2
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de uitoefening van de in het
      eerste lid bedoelde bevoegdheid.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel5.16
  - number: 5.16.3
    text: |-
      De [artikelen 7:47][ref1], [7:48][ref2] en [7:49 van de Wet financiële markten BES][ref3] zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0030883#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0030883#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0030883#Artikel7
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel5.16
    references:
      - id: ref1
        bwb_id: BWBR0030883
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0030883
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0030883
        artikel: '7'
  - number: 5.17.1
    text: |-
      De toezichtautoriteit maakt een beslissing tot het opleggen van een bestuurlijke boete op grond van deze wet
      na bekendmaking van die beslissing openbaar, indien de boete is opgelegd ter zake van overtreding van de in
      [artikel 6.1, eerste lid][ref1], bedoelde bepalingen.


      [ref1]: https://wetten.overheid.nl/BWBR0030824#Artikel6
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel5.17
    references:
      - id: ref1
        bwb_id: BWBR0030824
        artikel: '6'
        hoofdstuk: '6'
  - number: 5.17.2
    text: |-
      De openbaarmaking van een beslissing tot het opleggen van een bestuurlijke boete geschiedt
      niet eerder dan nadat vijf werkdagen zijn verstreken na de dag waarop die beslissing
      aan de betrokken persoon is bekendgemaakt. De [artikelen 7:47][ref1], [7:48][ref2] en
      [7:49, tweede tot en met vierde lid, van de Wet financiële markten BES][ref3] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0030883#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0030883#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0030883#Artikel7
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel5.17
    references:
      - id: ref1
        bwb_id: BWBR0030883
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0030883
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0030883
        artikel: '7'
  - number: 5.17.3
    text: |-
      De toezichtautoriteit kan beslissen niet tot openbaarmaking van een beslissing tot het opleggen van een
      bestuurlijke boete over te gaan, indien openbaarmaking van die beslissing in strijd is of in strijd zou kunnen
      komen met het doel van het door de toezichtautoriteit uit te oefenen toezicht op de naleving van deze wet.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel5.17
  - number: '5.18'
    text: |-
      De toezichtautoriteit maakt, onverminderd [artikel 5.17][ref1], een beslissing tot het opleggen van een
      bestuurlijke boete op grond van deze wet openbaar, nadat die beslissing onherroepelijk is geworden. Artikel 5.17,
      derde lid, is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0030824#Artikel5
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel5.18
    references:
      - id: ref1
        bwb_id: BWBR0030824
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '3'
  - number: '5.19'
    text: |-
      De toezichtautoriteit maakt een beslissing tot het opleggen van een last onder dwangsom op grond
      van deze wet openbaar, wanneer een dwangsom is verbeurd. [Artikel 5.17, derde lid][ref1], en de
      [artikelen 7:47 tot en met 7:49 van de Wet financiële markten BES][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0030824#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0030883#Artikel7
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel5.19
    references:
      - id: ref1
        bwb_id: BWBR0030824
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0030883
        artikel: '7'
  - number: 6.1.1
    text: |-
      Overtreding van de [artikelen 1.6][ref1], [2.2, eerste lid][ref2],[ 2.4, eerste lid][ref3], 2.4, tweede lid,
      [2.10][ref4], [2.11][ref5], [2.13 tot en met 2.19][ref6], [3.5][ref7], [3.6, tweede lid][ref8], 3.5, derde lid,
      [3.10][ref9], [3.13][ref10], [4.2][ref11], [4.3][ref12] en [5.7, eerste lid][ref13], wordt, voor zover opzettelijk
      begaan, gestraft met gevangenisstraf van ten hoogste twee jaren of geldboete van de vierde categorie.


