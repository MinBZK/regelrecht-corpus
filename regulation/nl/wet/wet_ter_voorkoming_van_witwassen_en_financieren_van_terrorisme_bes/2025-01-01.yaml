preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is om de Wet identificatie bij dienstverlening BES, de
    Wet melding ongebruikelijke transacties BES en de Wet grensoverschrijdende geldtransporten BES samen te voegen tot
    één wet, gericht op het voorkomen van het misbruik van het financiële stelsel voor het witwassen van geld en het
    financieren van terrorisme;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#ArtikelAanhef
articles:
  - number: 1.1.1
    text: |-
      In deze wet en de daarop berustende bepalingen wordt, tenzij anders bepaald, verstaan onder: - *buitenland:* ander
      land van het Koninkrijk of andere staat, alsmede het Europese deel van Nederland;
        - *cliënt:* degene met wie een zakelijke relatie wordt aangegaan of die een transactie laat uitvoeren, daaronder
      begrepen in geval van het sluiten, het verlenen van bemiddeling bij het sluiten, of het doen van een uitkering
      uit hoofde van een levensverzekering als bedoeld in de [Wet financiële markten BES][ref1], degene die de premie
      betaalt alsmede degene aan wie de uitkering wordt gedaan;
        - *correspondentbankrelatie:* vaste relatie tussen kredietinstellingen in verschillende landen of staten voor de
      afwikkeling van transacties of de uitvoering van opdrachten;
        - *dienst:* een in [bijlage A][ref2] bij deze wet omschreven dienst, verricht door een dienstverlener in of vanuit
      Bonaire, Sint Eustatius of Saba;
        - *dienstverlener:* een ieder die beroeps- of bedrijfsmatig een dienst verleent;
        - *identificeren:* opgave van de identiteit laten doen;
        - *financieren van terrorisme:* de gedraging strafbaar gesteld in
      [artikel 435e van het Wetboek van Strafrecht BES][ref3];
        - *liquide middelen:* binnenlandse en buitenlandse bankbiljetten en munten, alsmede aan toonder gestelde
      verhandelbare waardepapieren, alsmede goud en diamanten, alsmede andere bij algemene maatregel van bestuur aan te
      wijzen waardedragers of goederen;
        - *melding:* melding als bedoeld in [artikel 3.5][ref4];
        - *meldpunt:* het Meldpunt ongebruikelijke transacties, bedoeld in [artikel 3.1, eerste lid][ref5];
        - *Nederlandsche Bank:* De Nederlandsche Bank N.V.;
        - *ongebruikelijke transactie:* transactie die ingevolge [artikel 3.4][ref6] als zodanig is aangemerkt;
        - *Onze Minister:* Onze Minister van Financiën;
        - *openbare lichamen:* de openbare lichamen Bonaire, Sint Eustatius en Saba;
        - *politiek prominente persoon:* persoon die in of buiten de openbare lichamen een prominente publieke functie
      bekleedt of heeft bekleed, met uitzondering van degenen die deze functie ten minste een jaar hebben beëindigd, en
      de directe familieleden of naaste geassocieerde als bedoeld in [artikel 1.2, eerste en tweede lid][ref7], van deze
      persoon;
        - *toezichtautoriteit* 1°. de bij besluit van Onze Minister en Onze Minister van Veiligheid en Justitie gezamenlijk
      aangewezen bestuursorganen, elk voor zover zij ingevolge dat besluit zijn belast met de handhaving van het bij
      of krachtens deze wet bepaalde; 2°. een door de algemene raad van de Nederlandse orde van advocaten aan te wijzen
      deken als bedoeld in [artikel 22, tweede lid, van de Advocatenwet][ref8], betreffende het toezicht op advocaten bij
      de uitvoering van diensten als bedoeld in [Bijlage A][ref9], onderdeel i, subonderdelen n en o; 3°. Onze Minister,
      voor zover de onder 1° en 2° bedoelde bestuursorganen niet zijn belast met de handhaving van het bij of krachtens
      deze wet bepaalde;
        - *toezichthouder:* persoon, krachtens [artikel 5.4][ref10] belast met het houden van toezicht op de naleving van
      het bij of krachtens deze wet bepaalde;
        - *transactie:* handeling of samenstel van handelingen van of ten behoeve van een cliënt in verband met het afnemen
      of het verlenen van diensten;
        - *uiteindelijk belanghebbende:* natuurlijke persoon die de uiteindelijke eigenaar is van of zeggenschap heeft over
      een cliënt, dan wel de natuurlijke persoon voor wiens rekening een transactie of activiteit wordt verricht;
        - *transitrekening:* bankrekening die bij een in de openbare lichamen gevestigde kredietinstelling wordt
      aangehouden door een buitenlandse kredietinstelling en die door een cliënt van laatstbedoelde kredietinstelling
      gedebiteerd of gecrediteerd kan worden zonder tussenkomst van de in de openbare lichamen gevestigde
      kredietinstelling;
        - *trust:* een trust in de zin van het op 1 juli 1985 te ’s-Gravenhage tot stand gekomen Verdrag inzake het recht
      dat toepasselijk is op trusts en inzake de erkenning van trusts (Trb. 1985, 141);
        - *verifiëren van de identiteit:* vaststellen dat de opgegeven identiteit overeenkomt met de werkelijke identiteit;
        - *zakelijke relatie:* zakelijke, professionele, of commerciële relatie tussen een dienstverlener en een
      natuurlijke persoon of een rechtspersoon, die verband houdt met de professionele activiteiten van die
      dienstverlener en waarvan op het tijdstip dat het contact wordt gelegd, wordt aangenomen dat deze enige tijd zal
      duren.


