        artikel: '1'
  - number: 3.3.4
    text: |-
      Bij regeling van Onze Minister van Justitie en Veiligheid kunnen nadere regels worden gesteld met betrekking tot de
      indiening en behandeling van verzoeken tot het verstrekken van gegevens. Daarbij kan worden bepaald dat het verzoek
      wordt behandeld door tussenkomst van een bij die regeling aan te wijzen persoon.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel3.3
  - number: '3.4'
    text: |-
      Bij regeling van Onze Minister worden, zo nodig per daarbij te onderscheiden categorieën transacties, indicatoren
      vastgesteld aan de hand waarvan wordt beoordeeld of een transactie wordt aangemerkt als een ongebruikelijke
      transactie.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel3.4
  - number: 3.5.1
    text: |-
      Een dienstverlener meldt een verrichte of voorgenomen ongebruikelijke transactie onverwijld nadat het
      ongebruikelijke karakter van de transactie bekend is geworden, aan het meldpunt.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel3.5
  - number: 3.5.2
    text: 'Bij een melding als bedoeld in het eerste lid verstrekt de dienstverlener de volgende gegevens:'
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel3.5
  - number: 3.5.2.a
    text: |-
      de identiteit van de cliënt, de identiteit van de uiteindelijk belanghebbenden en, voor zover mogelijk, de
      identiteit van degene ten behoeve van wie de transactie wordt uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel3.5
  - number: 3.5.2.b
    text: |-
      de aard en het nummer van het identiteitsbewijs van de cliënt en, voorzover mogelijk, van de overige in onderdeel a
      bedoelde personen;
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel3.5
  - number: 3.5.2.c
    text: de aard, het tijdstip en de plaats van de transactie;
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel3.5
  - number: 3.5.2.d
    text: |-
      de omvang en de bestemming en herkomst van de gelden, effecten, edele metalen of andere waarden die bij de
      transactie betrokken zijn;
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel3.5
  - number: 3.5.2.e
    text: de omstandigheden op grond waarvan de transactie als ongebruikelijk wordt aangemerkt;
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel3.5
  - number: 3.5.2.f
    text: een omschrijving van de bij de transactie betrokken zaken van grote waarde;
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel3.5
  - number: 3.5.2.g
    text: aanvullende, bij algemene maatregel van bestuur aan te wijzen, gegevens.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel3.5
  - number: 3.5.3
    text: |-
      Een dienstverlener bewaart de gegevens, bedoeld in het tweede lid, op toegankelijke wijze gedurende vijf jaar na
      het tijdstip van het doen van de melding.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel3.5
  - number: 3.5.4
    text: 'De meldingsplicht, bedoeld in het eerste lid, is van overeenkomstige toepassing indien:'
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel3.5
  - number: 3.5.4.a
    text: |-
      een cliëntenonderzoek als bedoeld in [artikel 2.2, eerste lid][ref1], niet leidt tot het in artikel 2.2, tweede
      lid, onderdelen a, b, c, e, en f, bedoelde resultaat, en er tevens indicaties zijn dat de desbetreffende cliënt
      betrokken is bij witwassen of financieren van terrorisme;


      [ref1]: https://wetten.overheid.nl/BWBR0030824#Artikel2
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0030824
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 3.5.4.b
    text: |-
      een zakelijke relatie wordt beëindigd ingevolge [artikel 2.4, derde lid][ref1], en er tevens indicaties zijn dat de
      desbetreffende cliënt betrokken is bij witwassen of financieren van terrorisme.


      [ref1]: https://wetten.overheid.nl/BWBR0030824#Artikel2
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0030824
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 3.5.5
    text: |-
      Bij een melding ingevolge het vierde lid verstrekt een dienstverlener naast de gegevens, bedoeld in het tweede lid,
      een beschrijving van de redenen waarom het vierde lid van toepassing is.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel3.5
  - number: 3.6.1
    text: |-
      Het meldpunt kan ten behoeve van de uitvoering van zijn taak, bedoeld in [artikel 3.2, onderdeel b][ref1], gegevens
      of inlichtingen opvragen bij een dienstverlener die een melding heeft gedaan of bij een dienstverlener die naar
      het oordeel van het meldpunt beschikt over gegevens of inlichtingen die relevant zijn voor het analyseren door het
      meldpunt van een transactie of voorgenomen transactie of van een zakelijke relatie.


      [ref1]: https://wetten.overheid.nl/BWBR0030824#Artikel3
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel3.6
    references:
      - id: ref1
        bwb_id: BWBR0030824
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3.6.2
    text: |-
      De dienstverlener waaraan overeenkomstig het eerste lid gegevens of inlichtingen zijn gevraagd, verstrekt deze
      onverwijld en in schriftelijke vorm, alsmede in spoedeisende gevallen mondeling, aan het meldpunt.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel3.6
  - number: '3.7'
    text: |-
      Het meldpunt bepaalt de wijze waarop een melding moet worden gedaan, of gegevens of inlichtingen als bedoeld in
      [artikel 3.6, eerste lid][ref1], moeten worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0030824#Artikel3
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel3.7
    references:
      - id: ref1
        bwb_id: BWBR0030824
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 3.8.1
    text: |-
      Gegevens of inlichtingen die in overeenstemming met de [artikelen 3.5][ref1] of [3.6][ref2] zijn verstrekt, kunnen
      niet dienen als grondslag voor of ten behoeve van een opsporingsonderzoek of een vervolging wegens verdenking
      van, of als bewijs ter zake van een tenlastelegging wegens witwassen of financieren van terrorisme door de
      dienstverlener die deze gegevens of inlichtingen heeft verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0030824#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0030824#Artikel3
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel3.8
    references:
      - id: ref1
        bwb_id: BWBR0030824
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0030824
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 3.8.2
    text: |-
      Gegevens of inlichtingen die zijn verstrekt in de redelijke veronderstelling dat uitvoering wordt gegeven
      aan de [artikelen 3.5][ref1] of [3.6][ref2] kunnen niet dienen als grondslag voor of ten behoeve van een
      opsporingsonderzoek of een vervolging wegens verdenking van, of als bewijs ter zake van een tenlastelegging wegens,
      overtreding van [artikel 285 van het Wetboek van Strafrecht BES][ref3] door de dienstverlener die deze gegevens of
      inlichtingen heeft verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0030824#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0030824#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0028570#Artikel285
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel3.8
    references:
      - id: ref1
        bwb_id: BWBR0030824
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0030824
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0028570
        artikel: '285'
  - number: 3.8.3
    text: |-
      Het eerste en tweede lid zijn van overeenkomstige toepassing ten aanzien van personen die bestuurder zijn van of
      werkzaam zijn voor een dienstverlener die gegevens of inlichtingen heeft verstrekt als omschreven in het eerste of
      tweede lid en die daaraan hebben meegewerkt.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel3.8
  - number: '3.9'
    text: |-
      De dienstverlener die tot een melding op de voet van [artikel 3.5][ref1] is overgegaan, is niet aansprakelijk
      voor schade die een derde dientengevolge lijdt, tenzij aannemelijk wordt gemaakt dat gelet op alle feiten en
      omstandigheden in redelijkheid niet tot melding had mogen worden overgegaan.


      [ref1]: https://wetten.overheid.nl/BWBR0030824#Artikel3
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel3.9
    references:
      - id: ref1
        bwb_id: BWBR0030824
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 3.9a
    text: |-
      Ten behoeve van de naleving van de in de [artikelen 3.5][ref1] en [3.6][ref2] opgenomen verplichtingen, zijn
      notarissen, kandidaat-notarissen en advocaten die diensten verlenen, bedoeld in [bijlage A][ref3], onderdeel i,
      subonderdelen n en o, niet gehouden aan de geheimhoudingsplicht die geldt uit hoofde van hun beroep.


      [ref1]: https://wetten.overheid.nl/BWBR0030824#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0030824#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0030824
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel3.9a
    references:
      - id: ref1
        bwb_id: BWBR0030824
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0030824
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0030824
  - number: 3.10.1
    text: |-
      Een dienstverlener die ingevolge [artikel 3.5][ref1] een melding heeft gedaan of die ingevolge [artikel 3.6][ref2]
      nadere informatie heeft verstrekt, is verplicht tot geheimhouding hiervan, alsmede van het gegeven dat deze
      melding of verstrekking aanleiding kan geven tot nader onderzoek, behoudens voor zover uit deze wet de noodzaak tot
      bekendmaking voortvloeit.


      [ref1]: https://wetten.overheid.nl/BWBR0030824#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0030824#Artikel3
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel3.10
    references:
      - id: ref1
        bwb_id: BWBR0030824
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0030824
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 3.10.2
    text: |-
      De dienstverlener die ingevolge [artikel 3.2, onderdeel c][ref1], gegevens of inlichtingen verkrijgt, is verplicht
      tot geheimhouding daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0030824#Artikel3
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel3.10
    references:
      - id: ref1
        bwb_id: BWBR0030824
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3.11.1
    text: |-
      Een dienstverlener kan, in afwijking van [artikel 3.10][ref1], mededelingen doen aan:


      [ref1]: https://wetten.overheid.nl/BWBR0030824#Artikel3
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel3.11
    references:
      - id: ref1
        bwb_id: BWBR0030824
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: 3.11.1.a
    text: |-
      dienstverleners die behoren tot dezelfde groep en die ten minste hebben voldaan aan de verplichting tot het
      vereenvoudigd cliëntenonderzoek, bedoeld in de [artikelen 2.8][ref1] en [2.9][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0030824#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0030824#Artikel2
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel3.11
    references:
      - id: ref1
        bwb_id: BWBR0030824
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0030824
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 3.11.1.b
    text: |-
      dienstverleners gevestigd of met zetel in een openbaar lichaam of een bij regeling van Onze Minister aan te wijzen
      buitenland, die hun werkzaamheden, al dan niet als werknemer, uitoefenen binnen eenzelfde rechtspersoon of netwerk;
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel3.11
  - number: 3.11.1.c
    text: |-
      een advocaat, notaris, kandidaat-notaris, accountant of financiële onderneming gevestigd of met zetel in een
      openbaar lichaam, mits het dezelfde cliënt en dezelfde transactie betreft en de mededeling uitsluitend is bedoeld
      ter voorkoming van witwassen en financieren van terrorisme;
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel3.11
  - number: 3.11.1.d
    text: |-
      een advocaat, notaris, kandidaat-notaris, accountant of financiële onderneming gevestigd of met zetel in een
      buitenland dat eisen stelt die gelijkwaardig zijn aan die in deze wet, die zijn onderworpen aan gelijkwaardige
      verplichtingen op het gebied van het beroepsgeheim en de bescherming van persoonsgegevens, en tot dezelfde
      beroepscategorie behoren, mits het dezelfde cliënt en dezelfde transactie betreft en de mededeling uitsluitend is
      bedoeld ter voorkoming van witwassen en financieren van terrorisme.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel3.11
  - number: 3.11.2
    text: |-
      Voor de toepassing van dit artikel wordt verstaan onder netwerk: de grotere structuur waartoe de persoon behoort en
      die eigendom, beheer, of controle op de naleving van de verplichtingen gezamenlijk deelt.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel3.11
  - number: '3.12'
    text: |-
      Een dienstverlener draagt er zorg voor dat zijn werknemers, alsmede de dagelijks beleidsbepalers voor zover
      relevant voor de uitoefening van hun taken en rekening houdend met de risico’s, aard en omvang van de instelling,
      bekend zijn met de bepalingen van deze wet en periodiek opleidingen genieten die hen in staat stellen een
      ongebruikelijke transactie te herkennen en een cliëntenonderzoek goed en volledig uit te voeren.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel3.12
  - number: 3.13.1
    text: |-
      Indien een dienstverlener, zijnde een financiële onderneming, constateert dat de identiteit van een relatie
      overeenkomt met een natuurlijke persoon, rechtspersoon of entiteit als bedoeld in de [Sanctiewet 1977][ref1] en
      de op grond van die wet vastgestelde regelingen en besluiten met betrekking tot het financieel verkeer, meldt de
      dienstverlener dit onverwijld aan de Nederlandsche Bank. Bij de melding legt de dienstverlener tevens de gegevens
      over van de identiteit van die relatie.


      [ref1]: https://wetten.overheid.nl/BWBR0003296
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel3.13
    references:
      - id: ref1
        bwb_id: BWBR0003296
  - number: 3.13.2
    text: De Nederlandsche Bank bepaalt de wijze waarop een melding als bedoeld in het eerste lid moet worden gedaan.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel3.13
  - number: 3.13.3
    text: |-
      De dienstverlener bewaart de in het eerste lid bedoelde meldingen alsmede de gegevens van rekeningen van, en
      transacties met de bij de meldingen betrokken relaties tot vijf jaar nadat de regeling, waarin de desbetreffende
      natuurlijke persoon, rechtspersoon of entiteit is genoemd, niet meer van kracht is of buiten werking is gesteld.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel3.13
  - number: 3.13.4
    text: |-
      Een dienstverlener als bedoeld in het eerste lid stelt desgevraagd gegevens ter beschikking aan de Nederlandsche
      Bank met betrekking tot de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel3.13
  - number: 3.13.5
    text: |-
      Voor de toepassing van dit artikel wordt onder relatie verstaan een ieder die betrokken is bij een financiële
      dienst of een financiële transactie.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel3.13
  - number: '4.1'
    text: |-
      In dit hoofdstuk en de daarop berustende bepalingen wordt, voor zover niet anders is bepaald, verstaan onder: -
      *aangifte:* een aangifte als bedoeld in [artikel 4.2, eerste lid][ref1];
        - *kennisgeving:* een kennisgeving als bedoeld in de [artikelen 4.2, tweede lid][ref2], en [4.3][ref3];
        - *aanmelder:* degene die de aangifte of kennisgeving doet of heeft gedaan;
        - *douaneambtenaar:* ambtenaar als bedoeld in [artikel 1:1, onderdeel f, van de Douane- en Accijnswet BES][ref4];
        - *inspecteur van douane:* inspecteur als bedoeld in
      [artikel 1:1, onderdeel h, van de Douane- en Accijnswet BES][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0030824#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0030824#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0030824#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0029236#Artikel1
      [ref5]: https://wetten.overheid.nl/BWBR0029236#Artikel1
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0030824
        artikel: '4'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0030824
        artikel: '4'
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0030824
        artikel: '4'
        hoofdstuk: '4'
      - id: ref4
        bwb_id: BWBR0029236
        artikel: '1'
      - id: ref5
        bwb_id: BWBR0029236
        artikel: '1'
  - number: 4.2.1
    text: |-
      Personen die de openbare lichamen binnenkomen of verlaten en liquide middelen met een gezamenlijke waarde van
      USD 10.000 of meer met zich meevoeren, moeten die liquide middelen aangeven bij de douaneambtenaren en hen deze
      voor controle ter beschikking stellen. De eerste volzin is ook van toepassing indien het gaat om binnenkomende
      of uitgaande personen, die aantoonbaar samen reizen en gezamenlijk liquide middelen ter waarde van USD 10.000 of
      meer met zich meevoeren, waarbij de bij of krachtens deze wet gestelde verplichtingen op alle bedoelde personen
      afzonderlijk rusten.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel4.2
  - number: 4.2.2
    text: |-
      Personen die de openbare lichamen binnenkomen of verlaten en liquide middelen onder de in het eerste lid genoemde
      waarde met zich mee voeren, waarvoor aanwijzingen zijn dat de liquide middelen verband houden met criminele
      activiteiten, dienen op verzoek van douaneambtenaren een kennisgeving te doen en hen deze de liquide middelen
      desgevraagd voor controle ter beschikking te stellen.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel4.2
  - number: 4.2.3
    text: |-
      Er wordt geacht niet aan de verplichting tot aangifte of kennisgeving van liquide middelen te zijn voldaan indien
      de verstrekte informatie niet, onjuist of onvolledig is of indien de liquide middelen niet voor controle ter
      beschikking worden gesteld.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel4.2
  - number: 4.2.4
    text: Bij algemene maatregel van bestuur worden de gegevens als bedoeld in het eerste en tweede lid vastgesteld.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel4.2
  - number: 4.2.5
    text: |-
      De gegevens in het vierde lid worden schriftelijk verstrekt met behulp van het bij regeling van Onze minister
      vastgestelde formulier.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel4.2
  - number: 4.3.1
    text: |-
      Wanneer onbegeleide liquide middelen met een gezamenlijke waarde van USD 10.000 of meer het openbare lichaam
      binnenkomen of verlaten, dient de afzender, of de ontvanger, of zijn vertegenwoordiger, op verzoek van
      douaneambtenaren een kennisgeving te doen en hen deze liquide middelen of goederen desgevraagd voor controle ter
      beschikking te stellen.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel4.3
  - number: 4.3.2
    text: |-
      Wanneer onbegeleide liquide middelen onder de in het eerste lid genoemde waarde het openbare lichaam binnenkomen
      of verlaten zonder begeleiding van een persoon en waarvoor er aanwijzingen zijn dat de liquide middelen verband
      houden met criminele activiteiten dan dient de afzender, of de ontvanger, of zijn vertegenwoordiger, op verzoek van
      douaneambtenaren een kennisgeving te doen en hen deze de liquide middelen of goederen desgevraagd voor controle ter
      beschikking stellen.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel4.3
  - number: 4.3.3
    text: |-
      Er wordt geacht niet aan de verplichting tot kennisgeving van liquide middelen te zijn voldaan indien de verstrekte
      informatie niet, onjuist of onvolledig is of indien de liquide middelen niet voor controle ter beschikking zijn
      gesteld binnen een termijn van dertig dagen.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel4.3
  - number: 4.3.4
    text: Bij algemene maatregel van bestuur worden de gegevens als bedoeld in het eerste en tweede lid vastgesteld.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel4.3
  - number: 4.3.5
    text: |-
      De gegevens in het vierde lid worden schriftelijk verstrekt met behulp van het bij regeling van Onze minister
      vastgestelde formulier.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel4.3
  - number: 4.4.1
    text: |-
      Het meldpunt beheert de gegevens die op grond van [artikel 4.2][ref1] worden verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0030824#Artikel4
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel4.4
    references:
      - id: ref1
        bwb_id: BWBR0030824
        artikel: '4'
        hoofdstuk: '4'
  - number: 4.4.2
    text: 'Aan het meldpunt worden door de inspecteur van douane onverwijld doorgezonden:'
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel4.4
  - number: 4.4.2.a
    text: |-
      de aangiftes, bedoeld in [artikel 4.2, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0030824#Artikel4
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel4.4
    references:
      - id: ref1
        bwb_id: BWBR0030824
        artikel: '4'
        hoofdstuk: '4'
  - number: 4.4.2.b
    text: |-
      de kennisgevingen, bedoeld in de [artikelen 4.2, tweede lid][ref1] en [4.3][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0030824#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0030824#Artikel4
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel4.4
    references:
      - id: ref1
        bwb_id: BWBR0030824
        artikel: '4'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0030824
        artikel: '4'
        hoofdstuk: '4'
  - number: 4.4.2.c
    text: afschriften van processen-verbaal van inbeslagneming van geld.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel4.4
  - number: 4.5.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de aangifte of
      kennisgeving van geldtransporten waarvan het vervoer op andere wijze plaatsvindt dan in deze wet voorzien.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel4.5
  - number: 4.5.2
    text: |-
      Bij regeling van Onze Minister kan, zo nodig onder het stellen van aanvullende voorschriften, aan
      beroepsvervoerders vrijstelling worden verleend van de [artikelen 4.2][ref1] en [4.3][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0030824#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0030824#Artikel4
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel4.5
    references:
      - id: ref1
        bwb_id: BWBR0030824
        artikel: '4'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0030824
        artikel: '4'
        hoofdstuk: '4'
  - number: '5.1'
    text: |-
      In dit hoofdstuk wordt verstaan onder: - *aanwijzing:* door de toezichtautoriteit opgelegde verplichting om binnen
      een door die autoriteit gestelde termijn ten aanzien van in de aanwijzingsbeschikking aan te geven onderwerpen een
      bepaalde gedragslijn te volgen;
        - *bestraffende sanctie:* bestuurlijke sanctie, voor zover deze beoogt de overtreder leed toe te voegen;
        - *bestuurlijke boete:* bestraffende sanctie, inhoudende een onvoorwaardelijke verplichting tot betaling van een
      geldsom;
        - *bestuurlijke sanctie:* door de toezichtautoriteit wegens een overtreding opgelegde verplichting, niet zijnde
      een aanwijzing;
        - *herstelsanctie:* bestuurlijke sanctie die strekt tot het geheel of gedeeltelijk ongedaan maken of beëindigen van
      een overtreding, tot het voorkomen van herhaling van een overtreding, dan wel tot het wegnemen of beperken van de
      gevolgen van een overtreding;
        - *last onder dwangsom:* herstelsanctie, inhoudende: 1°. een last tot geheel of gedeeltelijk herstel van de
      overtreding, en 2°. de verplichting tot betaling van een geldsom indien de last niet of niet tijdig wordt
      uitgevoerd;
        - *overtreder:* degene die een overtreding pleegt of medepleegt;
        - *overtreding:* gedraging in strijd met het bij of krachtens deze wet bepaalde.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel5.1
  - number: '5.2'
    text: |-
      Overtredingen kunnen worden begaan door natuurlijke personen en rechtspersonen.
      [Artikel 53, tweede en derde lid, van het Wetboek van Strafrecht BES][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel53
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel5.2
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '53'
  - number: 5.3.1
    text: |-
      De toezichtautoriteit legt geen bestuurlijke sanctie op, voor zover voor de overtreding een rechtvaardigingsgrond
      bestond.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel5.3
  - number: 5.3.2
    text: |-
      Indien twee of meer voorschriften zijn overtreden, kan voor de overtreding van elk afzonderlijk voorschrift een
      bestuurlijke sanctie worden opgelegd.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel5.3
  - number: 5.4.1
    text: |-
      Met het toezicht op de naleving van het bij of krachtens de [hoofdstukken 1 tot en met 3][ref1] bepaalde zijn
      belast de daartoe bij besluit van de toezichtautoriteit aangewezen personen.


      [ref1]: https://wetten.overheid.nl/BWBR0030824#Hoofdstuk1
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel5.4
    references:
      - id: ref1
        bwb_id: BWBR0030824
        hoofdstuk: '1'
  - number: 5.4.2
    text: |-
      Bij besluit van Onze Minister kunnen personen worden aangewezen die, naast de daartoe bij of krachtens de
      [Douane- en Accijnswet BES][ref1] aangewezen personen, zijn belast met het toezicht op de naleving van het bij of
      krachtens [hoofdstuk 4 ][ref2]bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0029236
      [ref2]: https://wetten.overheid.nl/BWBR0030824#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel5.4
    references:
      - id: ref1
        bwb_id: BWBR0029236
      - id: ref2
        bwb_id: BWBR0030824
        hoofdstuk: '4'
  - number: 5.4.3
    text: |-
      In afwijking van het eerste lid, is de deken, bedoeld in
      [artikel 1.1, eerste lid, onderdeel p, subonderdeel 2°][ref1], belast met het toezicht op de naleving van de bij
      of krachtens deze wet gestelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0030824#Artikel1
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel5.4
    references:
      - id: ref1
        bwb_id: BWBR0030824
        artikel: '1'
        hoofdstuk: '1'
  - number: 5.4.4
    text: Van een besluit als bedoeld in het eerste of tweede lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel5.4
  - number: 5.4.5
    text: |-
      Bij regeling van Onze Minister kunnen regels worden gesteld met betrekking tot de wijze van taakuitoefening door
      toezichthouders, met uitzondering van de deken, bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel5.4
  - number: 5.4a
    text: |-
      Ten behoeve van het houden van het toezicht, bedoeld in [artikel 5.4, derde lid][ref1], geldt voor de deken alsmede
      voor de door hem ten behoeve van de uitoefening van het toezicht ingeschakelde medewerkers, personeel en andere
      personen een geheimhoudingsplicht, gelijk aan die van de advocaat.


      [ref1]: https://wetten.overheid.nl/BWBR0030824#Artikel5
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel5.4a
    references:
      - id: ref1
        bwb_id: BWBR0030824
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: 5.5.1
    text: |-
      Een toezichthouder beschikt over de bevoegdheden, bedoeld in de
      [artikelen 7:7 tot en met 7:10 van de Wet financiële markten BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030883#Artikel7
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel5.5
    references:
      - id: ref1
        bwb_id: BWBR0030883
        artikel: '7'
  - number: 5.5.2
    text: |-
      De douaneambtenaren zijn tevens bevoegd liquide middelen in bewaring te nemen, indien de aanmelder hun niet
      onverwijld de gegevens, bedoeld in [artikel 4.2][ref1] of [artikel 4.3][ref2], verstrekt, of indien bij hen gerede
      twijfel bestaat omtrent de juistheid van de door de aanmelder verstrekte gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0030824#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0030824#Artikel4
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel5.5
    references:
      - id: ref1
        bwb_id: BWBR0030824
        artikel: '4'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0030824
        artikel: '4'
        hoofdstuk: '4'
  - number: 5.5.3
    text: |-
      De [artikelen 7:5][ref1] en [7:6 van de Wet financiële markten BES][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0030883#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0030883#Artikel7
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel5.5
    references:
      - id: ref1
        bwb_id: BWBR0030883
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0030883
        artikel: '7'
  - number: '5.6'
    text: |-
      Van de inbewaringneming, bedoeld in [artikel 5.5, tweede lid][ref1], maken de douaneambtenaren onverwijld proces-
      verbaal op. De inbewaringneming kan geschieden voor maximaal dertig dagen. Deze termijn kan door de inspecteur
      van douane eenmaal met maximaal dertig dagen worden verlengd. Na afloop van deze termijn wordt het geld onverwijld
      teruggegeven aan de aanmelder, tenzij het in beslag wordt genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0030824#Artikel5
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel5.6
    references:
      - id: ref1
        bwb_id: BWBR0030824
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: 5.7.1
    text: |-
      Een ieder is verplicht aan een toezichthouder binnen de door hem gestelde redelijke termijn alle medewerking te
      verlenen die deze redelijkerwijs kan vorderen bij de uitoefening van zijn bevoegdheden.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel5.7
  - number: 5.7.2
    text: |-
      Zij die uit hoofde van ambt, beroep of wettelijk voorschrift verplicht zijn tot geheimhouding, kunnen het verlenen
      van medewerking weigeren, voor zover dit uit hun geheimhoudingsplicht voortvloeit.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel5.7
  - number: 5.7.3
    text: |-
      Ten behoeve van het toezicht op de naleving van deze wet zijn notarissen, kandidaat-notarissen en advocaten en de
      onder hun verantwoordelijkheid werkzame personen ten opzichte van de aangewezen personen en de deken niet gehouden
      aan de geheimhoudingsplicht die geldt uit hoofde van hun beroep.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel5.7
  - number: '5.8'
    text: |-
      De toezichtautoriteit kan het toezicht voor zover betrekking hebbend op de diensten, bedoeld in
      [bijlage A, deel I, onderdelen k tot en met o][ref1], op een risicogeoriënteerde wijze uitoefenen.


      [ref1]: https://wetten.overheid.nl/BWBR0030824
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel5.8
    references:
      - id: ref1
        bwb_id: BWBR0030824
  - number: 5.9.1
    text: |-
      De toezichtautoriteit kan een dienstverlener die niet voldoet aan het bij of krachtens de
      [hoofdstukken 1 tot en met 3 van deze wet][ref1] bepaalde, een aanwijzing geven.


      [ref1]: https://wetten.overheid.nl/BWBR0030824#Hoofdstuk1
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel5.9
    references:
      - id: ref1
        bwb_id: BWBR0030824
        hoofdstuk: '1'
  - number: 5.9.2
    text: |-
      De beslissing tot het geven van een aanwijzing is met redenen omkleed en wordt schriftelijk bekendgemaakt aan
      degene tot wie de aanwijzing is gericht.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel5.9
  - number: 5.10.1
    text: |-
      De toezichtautoriteit kan een last onder dwangsom opleggen ter zake van overtreding van de [artikelen 1.6][ref1],
      [1.9, eerste, tweede en derde lid][ref2], [1.10 tot en met 1.12][ref3], [2.2, eerste, tweede en vijfde lid][ref4],
      [2.3, eerste lid][ref5], [2.4, eerste en tweede lid][ref6], [2.5, eerste lid][ref7],
      [2.7, eerste lid, tweede volzin][ref8], 2.7, tweede lid, tweede volzin, 2.7, derde lid, [2.8, tweede lid][ref9],
      [2.9, tweede lid][ref10], [2.10 tot en met 2.19][ref11], [3.5][ref12], [3.6, tweede lid][ref13], [3.10][ref14],
      [3.12][ref15], [3.13][ref16], [4.2][ref17], [4.3][ref18] en [5.7, eerste lid][ref19], alsmede ter zake van het
      geen gevolg geven dan wel niet tijdig of onvolledig gevolg geven aan een krachtens [artikel 5.9][ref20] gegeven
      aanwijzing.


      [ref1]: https://wetten.overheid.nl/BWBR0030824#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0030824#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0030824#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0030824#Artikel2
      [ref5]: https://wetten.overheid.nl/BWBR0030824#Artikel2
      [ref6]: https://wetten.overheid.nl/BWBR0030824#Artikel2
      [ref7]: https://wetten.overheid.nl/BWBR0030824#Artikel2
      [ref8]: https://wetten.overheid.nl/BWBR0030824#Artikel2
