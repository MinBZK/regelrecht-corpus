  - number: 5.11.1
    text: |-
      De toezichtautoriteit kan een boete opleggen ter zake van overtreding van de [artikelen 1.6][ref1],
      [1.9, eerste, tweede en derde lid][ref2], [1.10 tot en met 1.12][ref3], [2.2, eerste, tweede en vijfde lid][ref4],
      [2.3, eerste lid][ref5], [2.4, eerste en tweede lid][ref6], [2.5, eerste lid][ref7],
      [2.7, eerste lid, tweede volzin][ref8], 2.7, tweede lid, tweede volzin, 2.7, derde lid, [2.8, tweede lid][ref9],
      [2.9, tweede lid][ref10], [2.10 tot en met 2.19][ref11], [3.5][ref12], [3.6, tweede lid][ref13], [3.10][ref14],
