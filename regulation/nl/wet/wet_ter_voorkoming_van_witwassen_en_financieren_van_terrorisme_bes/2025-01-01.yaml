  - number: 6.1.2
    text: |-
      Overtreding van de [artikelen 1.6][ref1], [2.2, eerste lid][ref2], [2.4, eerste lid][ref3], 2.4, tweede lid,
      [2.10][ref4], [2.11][ref5], [2.13 tot en met 2.19][ref6], [3.5][ref7], [3.6, tweede lid][ref8], 3.5, derde lid,
      [3.10][ref9], [3.13][ref10], [4.2][ref11], [4.3][ref12] en [5.7, eerste lid][ref13], wordt, voor zover niet
      opzettelijk begaan, gestraft met hechtenis van ten hoogste zes maanden of geldboete van de vierde categorie.


