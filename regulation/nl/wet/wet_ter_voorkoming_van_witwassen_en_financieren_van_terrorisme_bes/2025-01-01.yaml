  - number: 5.10.2
    text: Een last onder dwangsom kan worden opgelegd, zodra het gevaar van een overtreding klaarblijkelijk dreigt.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel5.10
  - number: 5.10.3
    text: |-
      De toezichtautoriteit legt geen last onder dwangsom op, zolang een andere wegens dezelfde overtreding opgelegde
      last onder dwangsom van kracht is.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel5.10
  - number: 5.10.4
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot de uitoefening van de in
      het eerste lid bedoelde bevoegdheid.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel5.10
  - number: 5.10.5
    text: |-
      De [artikelen 7:22 tot en met 7:29 van de Wet financiële markten BES][ref1] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0030883#Artikel7
