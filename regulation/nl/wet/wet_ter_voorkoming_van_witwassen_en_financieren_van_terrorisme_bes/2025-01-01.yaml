  - number: 1.1.2
    text: |-
      In deze wet en de daarop berustende bepalingen wordt onder de begrippen «beleggingsinstelling», «effectenbeurs»,
      «elektronischgeldinstelling», «externe deskundige», «financiële onderneming», «gekwalificeerde deelneming»,
      «geldtransactiekantoor», «groep», «kredietinstelling», «levensverzekeraar», «levensverzekering»,
      «trustdiensten», «trustkantoor», «verzekeraar», «vestiging» en «zetel» verstaan: hetgeen daaronder in de
      [Wet financiële markten BES][ref1] wordt verstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0030883
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel1.1
    references:
      - id: ref1
        bwb_id: BWBR0030883
  - number: 1.1.3
    text: |-
      De in het [eerste lid, onderdeel d, bedoelde bijlage][ref1] kan bij algemene maatregel van bestuur worden
      gewijzigd. Deze algemene maatregel van bestuur treedt niet eerder in werking dan vier weken na de datum van
      uitgifte van het Staatsblad waarin hij is geplaatst. Van de plaatsing wordt onverwijld mededeling gedaan aan de
      beide kamers der Staten-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0030824
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel1.1
    references:
      - id: ref1
        bwb_id: BWBR0030824
  - number: 1.1.4
    text: |-
      Bij algemene maatregel van bestuur worden de categorieën natuurlijke personen aangewezen die in elk geval worden
      aangemerkt als uiteindelijk belanghebbende.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel1.1
  - number: 1.1.5
    text: |-
      Een algemene maatregel van bestuur als bedoeld in het derde of vierde lid wordt vastgesteld op voordracht van Onze
      Minister en Onze Minister van Justitie en Veiligheid.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel1.1
  - number: 1.2.1
    text: 'Als directe familieleden van politiek prominente personen worden aangemerkt:'
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel1.2
  - number: 1.2.1.a
    text: de echtgenoot of echtgenote;
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel1.2
  - number: 1.2.1.b
    text: een partner die naar nationaal recht als gelijkwaardig met een echtgenoot of echtgenote wordt aangemerkt;
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel1.2
  - number: 1.2.1.c
    text: de kinderen en hun echtgenoten of partners;
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel1.2
  - number: 1.2.1.d
    text: de ouders.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel1.2
  - number: 1.2.2
    text: 'Als naaste geassocieerde van politiek prominente personen wordt aangemerkt:'
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel1.2
  - number: 1.2.2.a
    text: |-
      een natuurlijke persoon van wie bekend is, dat deze met een persoon die een prominente publieke functie bekleedt of
      heeft bekleed de gezamenlijke uiteindelijke begunstigde is van juridische entiteiten of juridische constructies of
      met die persoon andere nauwe zakelijke relaties heeft;
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel1.2
  - number: 1.2.2.b
    text: |-
      een natuurlijke persoon die de enige begunstigde is van een juridische entiteit of juridische constructie waarvan
      bekend is, dat deze is opgezet ten behoeve van de feitelijke begunstiging van een persoon die een prominente
      publieke functie bekleedt of heeft bekleed.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel1.2
  - number: '1.3'
    text: Deze wet is van toepassing in de openbare lichamen Bonaire, Sint Eustatius en Saba.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel1.3
  - number: '1.4'
    text: |-
      Deze wet is niet van toepassing op de personen, bedoeld in
      [bijlage A bij deze wet, deel I, onderdelen n en o][ref1], voor zover zij voor een cliënt werkzaamheden verrichten
      betreffende de bepaling van diens rechtspositie, diens vertegenwoordiging en verdediging in rechte, het geven
      van advies voor, tijdens en na een rechtsgeding of het geven van advies over het instellen of vermijden van een
      rechtsgeding.


      [ref1]: https://wetten.overheid.nl/BWBR0030824
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel1.4
    references:
      - id: ref1
        bwb_id: BWBR0030824
  - number: 1.5.1
    text: |-
      Het is aan een ieder die uit hoofde van de toepassing van deze wet of van krachtens deze wet genomen besluiten
      enige taak vervult of heeft vervuld verboden van gegevens of inlichtingen, die ingevolge deze wet zijn verstrekt of
      ontvangen, of van een buitenlandse toezichthoudende instantie zijn ontvangen, verder of anders gebruik te maken of
      daaraan verder of anders bekendheid te geven dan voor de uitoefening van zijn taak of door deze wet wordt geëist.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel1.5
  - number: 1.5.2
    text: |-
      De toezichtautoriteit is in afwijking van het eerste lid bevoegd gegevens of inlichtingen, die ingevolge deze wet
      zijn verstrekt of ontvangen of van een buitenlandse toezichthoudende instantie zijn ontvangen, te verstrekken aan:
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel1.5
  - number: 1.5.2.a
    text: de andere toezichtautoriteit of een buitenlandse toezichthoudende instantie;
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel1.5
  - number: 1.5.2.b
    text: |-
      de Belastingdienst, de Fiscale Inlichtingen- en Opsporingsdienst, de Koninklijke Marechaussee, het Korps Politie
      Caribisch Nederland, het meldpunt, en het Openbaar Ministerie met het oog op risico’s van inbreuken op de
      integriteit van het financiële stelsel, of onderdelen daarvan en voor zover dat noodzakelijk is voor de uitoefening
      van publiekrechtelijke taken en bevoegdheden van deze instanties.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel1.5
  - number: 1.5.3
    text: |-
      Onder risico’s als bedoeld in het tweede lid, onderdeel b, worden verstaan risico’s met betrekking tot de
      integriteit van natuurlijke of rechtspersonen die binnen het financiële stelsel werkzaam zijn, alsmede risico’s als
      gevolg van het doen en nalaten van partijen binnen het financiële stelsel of onderdelen daarvan, met betrekking tot
      financieel-economische criminaliteit en andere ernstige vormen van criminaliteit of van terrorismefinanciering.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel1.5
  - number: 1.5.4
    text: 'De toezichthouder verstrekt geen vertrouwelijke gegevens of inlichtingen op grond van het tweede lid indien:'
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel1.5
  - number: 1.5.4.a
    text: het doel waarvoor de gegevens of inlichtingen zullen worden gebruikt onvoldoende bepaald is;
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel1.5
  - number: 1.5.4.b
    text: |-
      het beoogde gebruik van de gegevens of inlichtingen niet past in het kader van het toezicht op wetgeving ter
      voorkoming van witwassen en financieren van terrorisme;
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel1.5
  - number: 1.5.4.c
    text: |-
      de verstrekking van de gegevens of inlichtingen zich niet zou verdragen met de wet of de openbare orde van de
      openbare lichamen;
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel1.5
  - number: 1.5.4.d
    text: de geheimhouding van de gegevens of inlichtingen niet in voldoende mate is gewaarborgd;
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel1.5
  - number: 1.5.4.e
    text: |-
      de verstrekking van de gegevens of inlichtingen redelijkerwijs in strijd is of zou kunnen komen met de belangen die
      deze wet beoogt te beschermen;
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel1.5
  - number: 1.5.4.f
    text: |-
      onvoldoende is gewaarborgd dat de gegevens of inlichtingen niet zullen worden gebruikt voor een ander doel dan
      waarvoor deze worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel1.5
  - number: 1.5.5
    text: |-
      Voor zover de gegevens of inlichtingen, bedoeld in het tweede lid, zijn verkregen van een buitenlandse
      toezichthoudende instantie, verstrekt de toezichtautoriteit deze niet aan een andere toezichtautoriteit of aan
      een andere buitenlandse toezichthoudende instantie, tenzij de buitenlandse toezichthoudende instantie waarvan
      de gegevens of inlichtingen zijn verkregen uitdrukkelijk heeft ingestemd met de verstrekking van de gegevens of
      inlichtingen en in voorkomend geval heeft ingestemd met het gebruik voor een ander doel dan waarvoor de gegevens of
      inlichtingen zijn verstrekt.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel1.5
  - number: 1.5.6
    text: |-
      Indien een buitenlandse toezichthoudende instantie aan de toezichtautoriteit die de gegevens of inlichtingen op
      grond van het tweede of vijfde lid heeft verstrekt, verzoekt om die gegevens of inlichtingen te mogen gebruiken
      voor een ander doel dan waarvoor zij zijn verstrekt, willigt de toezichtautoriteit dat verzoek slechts in:
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel1.5
  - number: 1.5.6.a
    text: indien het beoogde gebruik niet in strijd is met het vierde of vijfde lid; of
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel1.5
  - number: 1.5.6.b
    text: |-
      voorzover die toezichthoudende instantie op een andere wijze dan in deze wet voorzien vanuit Nederland met
      inachtneming van de daarvoor geldende wettelijke procedures voor dat andere doel de beschikking over die gegevens
      of inlichtingen zou kunnen verkrijgen; en
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel1.5
  - number: 1.5.6.c
    text: |-
      na overleg met Onze Minister van Justitie en Veiligheid, indien het in de aanhef bedoelde verzoek betrekking heeft
      op een onderzoek naar strafbare feiten.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel1.5
  - number: 1.5.7
    text: |-
      Indien de toezichtautoriteit bij de uitoefening van haar taak feiten ontdekt die kunnen duiden op witwassen of
      financieren van terrorisme, licht zij, in afwijking van het eerste lid en eventuele andere toepasselijke wettelijke
      geheimhoudingsbepalingen, het meldpunt in.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel1.5
  - number: 1.5.8
    text: |-
      Onze Minister kan ontheffing verlenen van het in het eerste lid vervatte verbod aan de personen die ingevolge
      de [Douane- en Accijnswet BES of artikel 5.4, tweede lid][ref1], zijn belast met het toezicht op de naleving van
      [hoofdstuk 4][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0029236#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0030824#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel1.5
    references:
      - id: ref1
        bwb_id: BWBR0029236
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0030824
        hoofdstuk: '4'
  - number: 1.5.9
    text: |-
      Onze Minister van Justitie en Veiligheid kan ontheffing verlenen van het in het eerste lid vervatte verbod aan de
      ambtenaren bevoegd inzake paspoortcontrole.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel1.5
  - number: 1.6.1
    text: |-
      Een dienstverlener, zijnde een financiële onderneming anders dan een geldtransactiekantoor of een trustkantoor,
      die een bijkantoor of een dochtermaatschappij heeft in het buitenland, draagt er zorg voor dat het bijkantoor
      onderscheidenlijk de dochtermaatschappij cliëntenonderzoek verricht dat gelijkwaardig is aan dat, geregeld in
      [artikel 2.2][ref1] en gegevens met betrekking tot het cliëntenonderzoek vastlegt en bewaart op een wijze die
      gelijkwaardig is aan hetgeen is geregeld ingevolge [artikel 2.13][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0030824#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0030824#Artikel2
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel1.6
    references:
      - id: ref1
        bwb_id: BWBR0030824
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0030824
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 1.6.2
    text: |-
      Indien het recht van het betrokken buitenland toepassing van het eerste lid niet toelaat, stelt de dienstverlener
      de toezichtautoriteit daarvan in kennis en neemt hij maatregelen om het risico van witwassen en financieren van
      terrorisme te voorkomen.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel1.6
  - number: '1.7'
    text: |-
      De rechtsgeldigheid van een privaatrechtelijke rechtshandeling van een dienstverlener welke is verricht in strijd
      met de bij of krachtens deze wet gestelde regels is niet uit dien hoofde aantastbaar.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel1.7
  - number: 1.8.1
    text: |-
      Ter voorkoming van witwassen en financieren van terrorisme verricht een dienstverlener cliëntenonderzoek
      en meldt hij verrichte of voorgenomen ongebruikelijke transacties overeenkomstig de bij of krachtens de
      [hoofdstukken 2][ref1] en [3][ref2] gestelde regels. Daarbij besteedt een dienstverlener bijzondere aandacht
      aan ongebruikelijke transactiepatronen en aan transacties die naar hun aard een hoger risico op witwassen of
      financieren van terrorisme met zich brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0030824#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0030824#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel1.8
    references:
      - id: ref1
        bwb_id: BWBR0030824
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0030824
        hoofdstuk: '3'
  - number: 1.8.2
    text: |-
      Een dienstverlener treft adequate maatregelen ter voorkoming van risico’s op witwassen en financieren van
      terrorisme die kunnen ontstaan door het gebruik van nieuwe technologieën in het economisch verkeer.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel1.8
  - number: 1.9.1
    text: |-
      Een dienstverlener neemt maatregelen om zijn risico’s op witwassen en financieren van terrorisme vast te stellen en
      te beoordelen, waarbij de maatregelen in verhouding staan tot de aard en de omvang van de dienstverlener.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel1.9
  - number: 1.9.2
    text: |-
      Bij het vaststellen en beoordelen van de risico’s, bedoeld in het eerste lid, houdt de dienstverlener in ieder
      geval rekening met de risicofactoren die verband houden met het type cliënt, product, dienst, transactie en
      leveringskanaal en met landen of geografische gebieden.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel1.9
  - number: 1.9.3
    text: |-
      Een dienstverlener legt de resultaten van het vaststellen en beoordelen van zijn risico’s vast, houdt deze actueel
      en verstrekt deze resultaten desgevraagd aan de toezichthoudende autoriteit.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel1.9
  - number: 1.9.4
    text: |-
      De toezichthoudende autoriteit kan ontheffing verlenen van het eerste tot en met derde lid, indien de
      dienstverlener behoort tot een sector waarvan de inherente specifieke risico’s op witwassen en financieren van
      terrorisme duidelijk en inzichtelijk zijn.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel1.9
  - number: 1.10.1
    text: |-
      Een dienstverlener beschikt over gedragslijnen, procedures en maatregelen om de risico’s op witwassen en
      financieren van terrorisme en de risico’s die zijn geïdentificeerd in de nationale risicobeoordeling te beperken en
      effectief te beheersen.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel1.10
  - number: 1.10.2
    text: |-
      De gedragslijnen, procedures en maatregelen, bedoeld in het eerste lid, zijn evenredig aan de aard en
      de omvang van de dienstverlener en hebben ten minste betrekking op de naleving van de bepalingen in de
      [artikelen 1.5][ref1], [1.6][ref2], [1.8][ref3], [1.9][ref4], [1.11][ref5] en [1.12][ref6], [hoofdstuk 2][ref7] en
      [hoofdstuk 3, paragraaf 2][ref8].


      [ref1]: https://wetten.overheid.nl/BWBR0030824#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0030824#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0030824#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0030824#Artikel1
      [ref5]: https://wetten.overheid.nl/BWBR0030824#Artikel1
      [ref6]: https://wetten.overheid.nl/BWBR0030824#Artikel1
      [ref7]: https://wetten.overheid.nl/BWBR0030824#Hoofdstuk2
      [ref8]: https://wetten.overheid.nl/BWBR0030824#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel1.10
    references:
      - id: ref1
        bwb_id: BWBR0030824
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0030824
        artikel: '1'
        hoofdstuk: '1'
      - id: ref3
        bwb_id: BWBR0030824
        artikel: '1'
        hoofdstuk: '1'
      - id: ref4
        bwb_id: BWBR0030824
        artikel: '1'
        hoofdstuk: '1'
      - id: ref5
        bwb_id: BWBR0030824
        artikel: '1'
        hoofdstuk: '1'
      - id: ref6
        bwb_id: BWBR0030824
        artikel: '1'
        hoofdstuk: '1'
      - id: ref7
        bwb_id: BWBR0030824
        hoofdstuk: '2'
      - id: ref8
        bwb_id: BWBR0030824
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 1.10.3
    text: |-
      De gedragslijnen, procedures en maatregelen behoeven de goedkeuring van de personen die het dagelijks beleid van
      een dienstverlener bepalen.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel1.10
  - number: 1.10.4
    text: |-
      Een dienstverlener draagt zorg voor een systematische toetsing van de gedragslijnen, procedures en maatregelen en
      draagt waar nodig zorg voor een bijstelling hiervan.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel1.10
  - number: 1.11.1
    text: |-
      Indien het dagelijks beleid van een dienstverlener wordt bepaald door twee of meer personen, wijst een
      dienstverlener één van de personen die het dagelijks beleid van de dienstverlener bepalen aan die is belast met de
      verantwoordelijkheid voor de naleving door de dienstverlener van het bij of krachtens deze wet bepaalde.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel1.11
  - number: 1.11.2
    text: |-
      Voor zover passend bij de aard en omvang van de dienstverlener, beschikt een dienstverlener over een onafhankelijke
      en effectieve compliancefunctie.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel1.11
  - number: 1.11.3
    text: |-
      De compliancefunctie is gericht op het controleren van de naleving van wettelijke regels en interne regels die de
      dienstverlener zelf heeft opgesteld en omvat onder meer de taak die strekt tot het verstrekken van de gegevens,
      bedoeld in [artikel 3.5][ref1], aan het meldpunt.


      [ref1]: https://wetten.overheid.nl/BWBR0030824#Artikel3
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel1.11
    references:
      - id: ref1
        bwb_id: BWBR0030824
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 1.11.4
    text: |-
      Indien van toepassing en voor zover passend bij de aard en de omvang van de dienstverlener, draagt een
      dienstverlener er zorg voor dat op onafhankelijke wijze een auditfunctie wordt uitgeoefend ten aanzien van zijn
      werkzaamheden. De auditfunctie controleert de naleving door een dienstverlener van de bij of krachtens deze wet
      gestelde regels en de uitoefening van de compliancefunctie.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel1.11
  - number: 1.12.1
    text: |-
      Een dienstverlener die deel uitmaakt van een groep past de op het niveau van de groep geldende gedragslijnen en
      procedures op effectieve wijze toe, voor zover die voldoen aan de bij of krachtens deze wet gestelde regels.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel1.12
  - number: 1.12.2
    text: |-
      Een dienstverlener draagt tevens zorg voor een effectieve toepassing van de in het eerste lid bedoelde
      gedragslijnen en procedures door zijn bijkantoren of meerderheidsdochterondernemingen met zetel buiten de openbare
      lichamen.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel1.12
  - number: 1.12.3
    text: |-
      Onder de gedragslijnen en procedures, bedoeld in het eerste en tweede lid, worden in ieder geval verstaan
      gedragslijnen en procedures inzake gegevensbescherming en gedragslijnen en procedures voor het delen van informatie
      binnen de groep, voor zover deze gegevens en informatie betrekking hebben op het voorkomen van witwassen en
      financieren van terrorisme.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel1.12
  - number: 1.12.4
    text: |-
      Indien het recht van een betrokken staat in de weg staat aan de toepassing van het tweede lid, stelt de
      dienstverlener de toezichthoudende autoriteit hiervan in kennis en ziet de instelling erop toe dat het bijkantoor
      of de meerderheidsdochteronderneming aanvullende maatregelen neemt om het risico op witwassen en financieren van
      terrorisme doeltreffend te beheersen.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel1.12
  - number: 1.12.5
    text: |-
      Indien de aanvullende maatregelen, bedoeld in het vierde lid, onvoldoende zijn, neemt de toezichthoudende
      autoriteit aanvullende toezichtmaatregelen, waarbij onder meer wordt verlangd dat de groep geen zakelijke relaties
      aangaat of die relaties beëindigt en geen transacties uitvoert, dan wel waarbij de groep, indien nodig, wordt
      verzocht haar bedrijfsactiviteiten in de betrokken staat te beëindigen.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel1.12
  - number: '1.13'
    text: |-
      De [artikelen 1.9 tot en met 1.12][ref1] zijn niet van toepassing op de dienstverleners, bedoeld in
      [Bijlage A][ref2], onder I, aanhef, onder j., l., m., n. en o.


      [ref1]: https://wetten.overheid.nl/BWBR0030824#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0030824
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel1.13
    references:
      - id: ref1
        bwb_id: BWBR0030824
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0030824
  - number: '1.14'
    text: |-
      Onze Minister van Financiën en Onze Minister van Justitie en Veiligheid gezamenlijk publiceren periodiek een
      verslag van de geïdentificeerde, geanalyseerde en beoordeelde risico’s op witwassen en financieren van terrorisme.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel1.14
  - number: '2.1'
    text: |-
      In dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onderdoelvennootschap: een rechtspersoon of
      vennootschap waaraan een trustkantoor trustdiensten verleent.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel2.1
  - number: 2.2.1
    text: Een dienstverlener verricht ter voorkoming van witwassen en financieren van terrorisme cliëntenonderzoek.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel2.2
  - number: 2.2.2
    text: 'Het cliëntenonderzoek stelt de dienstverlener in staat om:'
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel2.2
  - number: 2.2.2.a
    text: de cliënt te identificeren en zijn identiteit te verifiëren;
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel2.2
  - number: 2.2.2.b
    text: |-
      de uiteindelijk belanghebbende te identificeren en adequate maatregelen te nemen om zijn identiteit te verifiëren,
      en indien het een rechtspersoon of een trust als bedoeld in het Verdrag inzake het recht dat toepasselijk is op
      trusts en inzake de erkenning van trusts (Trb. 1985, 141) betreft, redelijke maatregelen te nemen om inzicht te
      verwerven in de eigendoms- en zeggenschapsstructuur van de cliënt;
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel2.2
  - number: 2.2.2.c
    text: het doel en de beoogde aard van de zakelijke relatie vast te stellen;
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel2.2
  - number: 2.2.2.d
    text: |-
      een voortdurende controle op de zakelijke relatie en de tijdens de duur van deze relatie verrichte transacties uit
      te oefenen, teneinde te verzekeren dat deze overeenkomen met de kennis die de dienstverlener heeft van de cliënt
      en diens risicoprofiel, met zo nodig een onderzoek naar de bron van de middelen die bij de zakelijke relatie of de
      transactie gebruikt worden;
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel2.2
  - number: 2.2.2.e
    text: |-
      vast te stellen of de natuurlijke persoon die de cliënt vertegenwoordigt daartoe bevoegd is en in voorkomend geval
      de natuurlijke persoon te identificeren en diens identiteit te verifiëren;
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel2.2
  - number: 2.2.2.f
    text: redelijke maatregelen te nemen om te verifiëren of de cliënt voor zichzelf optreedt dan wel voor een derde.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel2.2
  - number: 2.2.3
    text: |-
      Een dienstverlener stemt het cliëntenonderzoek aantoonbaar af op de risicogevoeligheid voor witwassen of
      financieren van terrorisme van het type cliënt, zakelijke relatie, product of transactie.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel2.2
  - number: 2.2.4
    text: |-
      De toezichtautoriteit kan op aanvraag geheel of gedeeltelijk, al dan niet voor bepaalde tijd, ontheffing verlenen
      van het eerste of tweede lid.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel2.2
  - number: 2.2.5
    text: Aan een ontheffing kunnen beperkingen worden gesteld en voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel2.2
  - number: 2.2.6
    text: |-
      Een dienstverlener neemt redelijke maatregelen om ervoor te zorgen dat de gegevens die ingevolge het tweede lid
      zijn verzameld over daar bedoelde personen juist en volledig zijn en actueel gehouden worden.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel2.2
  - number: '2.3'
    text: 'Een dienstverlener verricht het cliëntenonderzoek in de volgende gevallen:'
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel2.3
  - number: 2.3.a
    text: indien hij in of vanuit een openbaar lichaam een zakelijke relatie aangaat;
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel2.3
  - number: 2.3.b
    text: |-
      indien hij in of vanuit een openbaar lichaam een incidentele transactie verricht ten behoeve van de cliënt
      boven een bij regeling van Onze Minister vast te stellen bedrag dat voor de onderscheiden soorten van diensten
      verschillend kan zijn;
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel2.3
  - number: 2.3.c
    text: indien er indicaties zijn dat de cliënt betrokken is bij witwassen of financieren van terrorisme;
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel2.3
  - number: 2.3.d
    text: indien hij twijfelt aan de betrouwbaarheid van eerder verkregen gegevens van de cliënt; of
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel2.3
  - number: 2.3.e
    text: |-
      indien het risico van betrokkenheid van een bestaande cliënt bij witwassen of financieren van terrorisme daartoe
      aanleiding geeft.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel2.3
  - number: 2.4.1
    text: |-
      Een dienstverlener voldoet aan [artikel 2.2, tweede lid, onderdelen a en b][ref1], voordat de zakelijke relatie
      wordt aangegaan of een incidentele transactie als bedoeld in [artikel 2.3, eerste lid, onderdeel b][ref2], wordt
      uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0030824#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0030824#Artikel2
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel2.4
    references:
      - id: ref1
        bwb_id: BWBR0030824
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0030824
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.4.2
    text: |-
      Het is een dienstverlener verboden een zakelijke relatie aan te gaan of een transactie uit te voeren voor
      een cliënt indien hij geen cliëntenonderzoek heeft verricht als bedoeld in [artikel 2.2][ref1] of indien het
      cliëntenonderzoek niet heeft geleid tot het in artikel 2.2, tweede lid, aanhef en onderdelen a, b, c, e en f,
      bedoelde resultaat.


      [ref1]: https://wetten.overheid.nl/BWBR0030824#Artikel2
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel2.4
    references:
      - id: ref1
        bwb_id: BWBR0030824
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.4.3
    text: |-
      Indien de dienstverlener reeds een zakelijke relatie met de cliënt heeft en de dienstverlener niet kan voldoen aan
      [artikel 2.2, eerste en tweede lid, aanhef en onderdelen a, b, c, e en f][ref1], beëindigt de dienstverlener die
      zakelijke relatie.


      [ref1]: https://wetten.overheid.nl/BWBR0030824#Artikel2
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel2.4
    references:
      - id: ref1
        bwb_id: BWBR0030824
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.5.1
    text: |-
      Een dienstverlener stelt van elke cliënt met wie hij een zakelijke relatie onderhoudt een risicoprofiel op. Hij
      voert een voortdurende controle uit op de zakelijke relatie en de tijdens de duur van die relatie uit te voeren
      transacties, ten einde te verzekeren dat deze overeenkomen met de kennis die de dienstverlener heeft van de cliënt
      en van het risicoprofiel, met in voorkomend geval een onderzoek naar de bron van de middelen die bij de zakelijke
      relatie of de transactie gebruikt worden.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel2.5
  - number: 2.5.2
    text: |-
      Een dienstverlener houdt bij het bepalen van de risicogevoeligheid, bedoeld in het eerste lid, ten minste rekening
      met bij regeling van Onze Minister aan te wijzen risicofactoren.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel2.5
  - number: 2.5.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot het op te
      stellen risicoprofiel en de uit te voeren controle.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel2.5
  - number: '2.6'
    text: |-
      [Artikel 2.4, tweede lid][ref1], is niet van toepassing ten aanzien van een cliënt die bij een dienstverlener wordt
      geïntroduceerd indien:


      [ref1]: https://wetten.overheid.nl/BWBR0030824#Artikel2
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel2.6
    references:
      - id: ref1
        bwb_id: BWBR0030824
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.6.a
    text: |-
      de cliënt is geïdentificeerd en de identiteit reeds is geverifieerd, ingevolge [artikel 2.2][ref1] of op daarmee
      overeenkomende wijze, door:


      [ref1]: https://wetten.overheid.nl/BWBR0030824#Artikel2
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel2.6
    references:
      - id: ref1
        bwb_id: BWBR0030824
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.6.a.1°
    text: een advocaat, notaris of kandidaat-notaris die in Bonaire, Sint Eustatius of Saba is gevestigd;
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel2.6
  - number: 2.6.a.2°
    text: |-
      een beleggingsinstelling, levensverzekeraar, bemiddelaar in levensverzekeringen, kredietinstelling of
      geldtransactiekantoor die beschikt over een vergunning op grond van de [Wet financiële markten BES][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0030883
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel2.6
    references:
      - id: ref1
        bwb_id: BWBR0030883
  - number: 2.6.a.3°
    text: een onderneming of instelling van een bij algemene maatregel van bestuur aan te wijzen categorie;
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel2.6
  - number: 2.6.b
    text: |-
      de dienstverlener waarbij de cliënt wordt geïntroduceerd beschikt over de identificatie- en verificatiegegevens
      en overige gegevens en bescheiden inzake de identiteit van de cliënt en, indien van toepassing, de uiteindelijk
      belanghebbende.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel2.6
  - number: 2.7.1
    text: |-
      In afwijking van [artikel 2.4, eerste en tweede lid,][ref1] is het een dienstverlener toegestaan de identiteit van
      de cliënt en, indien van toepassing, de identiteit van de uiteindelijk belanghebbende te verifiëren tijdens het
      aangaan van de zakelijke relatie, indien dit noodzakelijk is om de dienstverlening niet te verstoren en er weinig
      risico op witwassen of financieren van terrorisme bestaat. In dat geval verifieert de dienstverlener de identiteit
      zo spoedig mogelijk na het eerste contact met de cliënt.


      [ref1]: https://wetten.overheid.nl/BWBR0030824#Artikel2
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel2.7
    references:
      - id: ref1
        bwb_id: BWBR0030824
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.7.2
    text: |-
      In afwijking van [artikel 2.4, eerste en tweede lid][ref1], is het een levensverzekeraar toegestaan de begunstigde
      van een polis te identificeren en de identiteit te verifiëren nadat de zakelijke relatie is aangegaan. In dat geval
      vindt het identificeren en het verifiëren van de identiteit plaats op of voor het tijdstip van uitbetaling, dan wel
      op of voor het tijdstip waarop de begunstigde zijn rechten krachtens de polis wil uitoefenen.


      [ref1]: https://wetten.overheid.nl/BWBR0030824#Artikel2
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel2.7
    references:
      - id: ref1
        bwb_id: BWBR0030824
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.7.3
    text: |-
      In afwijking van [artikel 2.4, eerste en tweede lid][ref1], is het een kredietinstelling toegestaan een rekening te
      openen voordat de verificatie van de identiteit van de cliënt heeft plaatsgevonden, indien zij waarborgt dat deze
      rekening niet kan worden gebruikt voordat de verificatie heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0030824#Artikel2
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel2.7
    references:
      - id: ref1
        bwb_id: BWBR0030824
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.8.1
    text: |-
      In afwijking van [artikel 2.2, tweede lid][ref1], kan een dienstverlener een vereenvoudigd cliëntenonderzoek
      verrichten indien een zakelijke relatie, transactie of cliënt naar zijn aard een laag risico op witwassen of
      financieren van terrorisme met zich brengt. De instelling houdt daarbij ten minste rekening met bij regeling van
      Onze Minister aan te wijzen risicofactoren.


      [ref1]: https://wetten.overheid.nl/BWBR0030824#Artikel2
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel2.8
    references:
      - id: ref1
        bwb_id: BWBR0030824
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.8.2
    text: |-
      Een dienstverlener verzamelt aantoonbaar voldoende gegevens om te kunnen vaststellen of met betrekking tot een
      cliënt een vereenvoudigd cliëntenonderzoek als bedoeld in het eerste lid kan worden verricht.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel2.8
  - number: 2.8.3
    text: |-
      Een dienstverlener neemt redelijke maatregelen om ervoor te zorgen dat de gegevens die ingevolge het tweede lid
      zijn verzameld en de daarop gebaseerde vaststelling actueel gehouden worden.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel2.8
  - number: 2.8.4
    text: |-
      Een dienstverlener zorgt voor een toereikende controle van de transacties of de zakelijke relatie om te verzekeren
      dat kan worden voldaan aan het bepaalde in [artikel 3.5][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030824#Artikel3
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel2.8
    references:
      - id: ref1
        bwb_id: BWBR0030824
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 2.8.5
    text: |-
      Bij algemene maatregel van bestuur kunnen producten, transacties en categorieën dienstverleners worden aangewezen
      waarop het eerste lid in ieder geval van toepassing is.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel2.8
  - number: 2.10.1
    text: |-
      Een dienstverlener verricht in aanvulling op het cliëntenonderzoek, bedoeld in [artikel 2.2, eerste lid][ref1],
      nader onderzoek indien en naar gelang een zakelijke relatie of transactie naar haar aard of in verband met de staat
      waar de cliënt woonachtig of gevestigd is of zijn zetel heeft een hoger risico op witwassen of financieren van
      terrorisme met zich brengt. Bij ministeriële regeling kunnen categorieën zakelijke relaties en transacties worden
      aangewezen die naar hun aard een hoger risico op witwassen of financieren van terrorisme met zich brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0030824#Artikel2
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel2.10
    references:
      - id: ref1
        bwb_id: BWBR0030824
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.10.2
    text: |-
      Onverminderd het eerste lid neemt een dienstverlener, indien een cliënt niet fysiek aanwezig is voor verificatie
      van diens identiteit, maatregelen om het hogere risico te compenseren. De dienstverlener kan aan de vorige volzin
      voldoen indien hij:
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel2.10
  - number: 2.10.2.a
    text: de identiteit van de cliënt verifieert aan de hand van aanvullende documenten, gegevens of informatie;
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel2.10
  - number: 2.10.2.b
    text: de overgelegde documenten beoordeelt op echtheid; of
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel2.10
  - number: 2.10.2.c
    text: |-
      waarborgt dat de eerste betaling die met de zakelijke relatie of transactie verband houdt, wordt gedaan ten gunste
      of ten laste van een rekening van de cliënt bij een kredietinstelling met zetel in een bij regeling van Onze
      Minister aangewezen land die beschikt over een vergunning om in dat land haar bedrijf te mogen uitoefenen.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel2.10
  - number: 2.10.3
    text: |-
      Een dienstverlener draagt er zorg voor dat hij over op risico gebaseerde procedures beschikt om te bepalen of de
      cliënt een politiek prominent persoon is. Onverminderd het eerste lid draagt een dienstverlener die een zakelijke
      relatie aangaat met of een transactie verricht voor een politiek prominent persoon, er tevens zorg voor dat:
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel2.10
  - number: 2.10.3.a
    text: |-
      de beslissing tot het aangaan van de relatie of het verrichten van de transactie wordt genomen of goedgekeurd door
      personen die daartoe door de dienstverlener zijn gemachtigd;
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel2.10
  - number: 2.10.3.b
    text: |-
      hij adequate maatregelen treft om de bron van het vermogen vast te stellen dat bij de zakelijke relatie of
      transactie wordt gebruikt;
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel2.10
  - number: 2.10.3.c
    text: hij doorlopend controle uitoefent op de zakelijke relatie.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel2.10
  - number: '2.11'
    text: |-
      Onverminderd [artikel 2.10, eerste lid][ref1], draagt een kredietinstelling die een correspondentbankrelatie
      aangaat of is aangegaan er zorg voor dat:


      [ref1]: https://wetten.overheid.nl/BWBR0030824#Artikel2
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel2.11
    references:
      - id: ref1
        bwb_id: BWBR0030824
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 2.11.a
    text: |-
      zij voldoende informatie over de betrokken kredietinstelling verzamelt om een compleet beeld te krijgen van
      de aard van haar bedrijfsactiviteiten, en op basis van openbaar beschikbare informatie de reputatie van de
      kredietinstelling en de kwaliteit van het toezicht dat op de kredietinstelling wordt uitgeoefend beoordeelt;
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel2.11
  - number: 2.11.b
    text: |-
      zij de procedures en maatregelen ter voorkoming van witwassen en financieren van terrorisme van de betrokken
      kredietinstelling beoordeelt;
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel2.11
  - number: 2.11.c
    text: |-
      indien het een nieuwe correspondentbankrelatie betreft, de beslissing tot het aangaan van die relatie wordt genomen
      of goedgekeurd door personen die daartoe door de kredietinstelling gemachtigd zijn;
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel2.11
  - number: 2.11.d
    text: de verantwoordelijkheden van beide kredietinstellingen schriftelijk worden vastgelegd;
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel2.11
  - number: 2.11.e
    text: |-
      de betrokken kredietinstelling de cliënt heeft geïdentificeerd en zijn identiteit heeft geverifieerd en daarnaast
      doorlopend toezicht houdt op de cliënten die rechtstreeks toegang hebben tot transitrekeningen en dat deze in staat
      is om op haar verzoek de relevante cliëntgegevens te verstrekken.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel2.11
  - number: 2.12.1
    text: |-
      Indien de cliënt een natuurlijke persoon is, een rechtspersoon opgericht naar het recht van de openbare lichamen
      die in de openbare lichamen zijn zetel heeft of een buitenlandse rechtspersoon die in de openbare lichamen is
      gevestigd, wordt diens identiteit geverifieerd aan de hand van documenten, gegevens of inlichtingen uit betrouwbare
      en onafhankelijke bron.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel2.12
  - number: 2.12.2
    text: |-
      Indien de cliënt een buitenlandse rechtspersoon is die niet in een openbaar lichaam is gevestigd, wordt diens
      identiteit geverifieerd op basis van betrouwbare en in het internationale verkeer gebruikelijke documenten,
      gegevens of inlichtingen of op basis van documenten, gegevens of inlichtingen die bij wet als geldig middel voor
      identificatie zijn erkend in het land of de staat van herkomst van de cliënt.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel2.12
  - number: 2.12.3
    text: |-
      Bij regeling van Onze Minister kunnen documenten, gegevens of inlichtingen worden aangewezen op basis waarvan
      kan worden voldaan aan het in het eerste of tweede lid bepaalde. Bij die regeling kunnen tevens regels worden
      vastgesteld met betrekking tot het verifiëren van de identiteit van cliënten of uiteindelijk belanghebbenden die
      niet onder het eerste of tweede lid vallen.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel2.12
  - number: 2.13.1
    text: |-
      Een dienstverlener die het cliëntenonderzoek, bedoeld in [artikel 2.2, eerste lid][ref1], heeft uitgevoerd, legt op
      toegankelijke wijze de gegevens bedoeld in [bijlage B bij deze wet][ref2] vast.


      [ref1]: https://wetten.overheid.nl/BWBR0030824#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0030824
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel2.13
    references:
      - id: ref1
        bwb_id: BWBR0030824
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0030824
  - number: 2.13.2
    text: |-
      Een dienstverlener bewaart de in het eerste lid bedoelde gegevens op toegankelijke wijze gedurende vijf jaar na
      het tijdstip van het beëindigen van de zakelijke relatie of tot vijf jaar na het uitvoeren van de desbetreffende
      transactie.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel2.13
  - number: 2.13.3
    text: |-
      De in het eerste lid bedoelde bijlage kan bij algemene maatregel van bestuur worden gewijzigd. Deze algemene
      maatregel van bestuur treedt niet eerder in werking dan vier weken na de datum van uitgifte van het Staatsblad
      waarin hij is geplaatst. Van de plaatsing wordt onverwijld mededeling gedaan aan de beide kamers der Staten-
      Generaal.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel2.13
  - number: 2.13.4
    text: |-
      Een algemene maatregel van bestuur als bedoeld in het derde lid wordt vastgesteld op voordracht van Onze Minister
      en Onze Minister van Justitie en Veiligheid.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel2.13
  - number: 2.14.1
    text: |-
      Een trustkantoor identificeert de uiteindelijk belanghebbende van een doelvennootschap en neemt adequate
      maatregelen om zijn identiteit te verifiëren.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel2.14
  - number: 2.14.2
    text: |-
      Het trustkantoor beschikt over gegevens aan de hand waarvan is bepaald wie als uiteindelijk belanghebbende
      kwalificeert en aan de hand waarvan de identiteit van de uiteindelijk belanghebbende is geverifieerd. Indien
      een doelvennootschap geen uiteindelijk belanghebbende heeft, beschikt het trustkantoor over gegevens aan de hand
      waarvan dit is bepaald.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel2.14
  - number: 2.14.3
    text: Het trustkantoor verleent geen trustdienst voordat aan het eerste of tweede lid is voldaan.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel2.14
  - number: 2.15.1
    text: |-
      Een trustkantoor heeft bij het verlenen van een trustdienst aan een doelvennootschap kennis van de herkomst van het
      vermogen van de doelvennootschap en legt de gegevens omtrent het onderzoek naar de herkomst van het vermogen vast.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel2.15
  - number: 2.15.2
    text: |-
      Een trustkantoor beschikt over gegevens die ten grondslag liggen aan de herkomst en bestemming van middelen van de
      doelvennootschap en beoordeelt of hieraan integriteitsrisico’s zijn verbonden.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel2.15
  - number: '2.16'
    text: |-
      Een trustkantoor heeft kennis van de relevante delen van de structuur van de groep waartoe de doelvennootschap
      behoort en het doel waarmee de structuur is opgezet en beschikt over gegevens waaruit deze relevante delen en het
      doel van de structuur blijken.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel2.16
  - number: '2.17'
    text: 'Een trustkantoor:'
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel2.17
  - number: 2.17.a
    text: |-
      beschikt over een op risico gebaseerd beleid om te bepalen of de uiteindelijk belanghebbende van een
      doelvennootschap een politiek prominent persoon is die niet in een openbaar lichaam woont;
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel2.17
  - number: 2.17.b
    text: |-
      laat de beslissing tot het aangaan van een relatie met een politiek prominent persoon nemen of goedkeuren door
      personen die daartoe door het trustkantoor gemachtigd zijn;
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel2.17
  - number: 2.17.c
    text: treft adequate maatregelen om de bron van het vermogen vast te stellen dat bij de zakelijke relatie wordt gebruikt;
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel2.17
  - number: 2.17.d
    text: oefent doorlopende controle uit op de zakelijke relatie.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel2.17
  - number: 2.18.1
    text: |-
      Indien een trustkantoor optreedt als trustee van een trust, kent het trustkantoor de identiteit van de insteller
      van de trust en van de uiteindelijk belanghebbende bij de trust en beschikt het trustkantoor over gegevens aan
      de hand waarvan is bepaald wie de insteller is en welke natuurlijke persoon als uiteindelijk belanghebbende
      kwalificeert. Ook beschikt het trustkantoor over gegevens aan de hand waarvan de identiteit van de insteller en van
      de uiteindelijk belanghebbende is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel2.18
  - number: 2.18.2
    text: |-
      Indien er geen uiteindelijk belanghebbende is, beschikt een trustkantoor over gegevens aan de hand waarvan dit
      is bepaald.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel2.18
  - number: 2.18.3
    text: |-
      Een trustkantoor heeft bij het verlenen van de in het eerste lid genoemde dienst kennis van de herkomst van het
      vermogen van de insteller van de trust en legt de gegevens omtrent het onderzoek naar de herkomst van het vermogen
      vast.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel2.18
  - number: '2.19'
    text: |-
      Een trustkantoor bewaart de in deze paragraaf bedoelde gegevens op toegankelijke wijze gedurende vijf jaar na
      het tijdstip van het beëindigen van de zakelijke relatie of tot vijf jaar na het uitvoeren van de desbetreffende
      transactie.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel2.19
  - number: 3.1.1
    text: Er is een Meldpunt ongebruikelijke transacties.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel3.1
  - number: 3.1.2
    text: |-
      De algemene leiding, de organisatie en het beheer van het meldpunt berusten bij Onze Minister van Justitie en
      Veiligheid.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel3.1
  - number: 3.1.3
    text: |-
      Benoeming, schorsing en ontslag van het hoofd van het meldpunt geschieden bij koninklijk besluit op voordracht van
      Onze Minister van Justitie en Veiligheid, in overeenstemming met Onze Minister.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel3.1
  - number: 3.1.4
    text: |-
      Onze Minister van Justitie en Veiligheid bepaalt in overeenstemming met Onze Minister de begroting van het
      meldpunt.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel3.1
  - number: '3.2'
    text: 'Het meldpunt heeft met het oog op het voorkomen en opsporen van witwassen en financieren van terrorisme tot taak:'
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel3.2
  - number: 3.2.a
    text: |-
      het verzamelen, registreren, bewerken en analyseren van de gegevens die het verkrijgt, teneinde te bezien of deze
      gegevens van belang kunnen zijn voor het voorkomen en opsporen van misdrijven;
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel3.2
  - number: 3.2.b
    text: |-
      het verstrekken van persoonsgegevens en andere gegevens in overeenstemming met deze wet en het bij of krachtens de
      [Wet politiegegevens][ref1] bepaalde;


      [ref1]: https://wetten.overheid.nl/BWBR0022463
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0022463
  - number: 3.2.c
    text: |-
      de dienstverlener die overeenkomstig [artikel 3.5][ref1] een melding heeft gedaan, te berichten over de afdoening
      van de melding;


      [ref1]: https://wetten.overheid.nl/BWBR0030824#Artikel3
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0030824
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 3.2.d
    text: |-
      het verrichten van onderzoek naar ontwikkelingen op het gebied van witwassen en financieren van terrorisme en naar
      de verbetering van de methoden om witwassen en financieren van terrorisme te voorkomen en op te sporen;
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel3.2
  - number: 3.2.e
    text: |-
      het geven van aanbevelingen voor de bedrijfstakken omtrent de invoering van passende procedures voor interne
      controle en communicatie en andere te treffen maatregelen tot voorkoming van het gebruik van die bedrijfstakken
      voor witwassen en financieren van terrorisme;
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel3.2
  - number: 3.2.f
    text: 'het geven van voorlichting omtrent het voorkomen en opsporen van witwassen en financieren van terrorisme aan:'
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel3.2
  - number: 3.2.f.1°
    text: de bedrijfstakken en beroepsgroepen;
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel3.2
  - number: 3.2.f.2°
    text: de toezichtautoriteiten;
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel3.2
  - number: 3.2.f.3°
    text: het openbaar ministerie en de overige ambtenaren belast met de opsporing van strafbare feiten;
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel3.2
  - number: 3.2.f.4°
    text: het publiek;
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel3.2
  - number: 3.2.g
    text: |-
      het geven van inlichtingen aangaande het meldgedrag van de dienstverleners aan de toezichtautoriteiten en de
      personen, bedoeld in onderdeel f, onder 3°;
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel3.2
  - number: 3.2.h
    text: |-
      het onderhouden van contacten met buitenlandse van overheidswege aangewezen instanties die een vergelijkbare taak
      hebben als het meldpunt;
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel3.2
  - number: 3.2.i
    text: |-
      het jaarlijks uitbrengen van een verslag met betrekking tot de taakuitoefening en zijn werkzaamheden in het
      voorafgaande jaar en van zijn voornemens voor het komende jaar, dat wordt aangeboden aan Onze Minister van Justitie
      en Veiligheid en ter kennis gebracht van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel3.2
  - number: 3.3.1
    text: |-
      Bij het meldpunt kunnen persoonsgegevens worden verwerkt ten behoeve van de taak, bedoeld in [artikel 3.2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030824#Artikel3
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0030824
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3.3.2
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld over de categorieën van personen waarover het meldpunt
      gegevens verwerkt, de gegevensverstrekking, de bewaring en vernietiging van gegevens en de protocolplicht.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel3.3
  - number: 3.3.3
    text: |-
      Op de verwerking van persoonsgegevens door het meldpunt zijn de [artikelen 1][ref1], [2][ref2],
      [3, eerste en tweede lid][ref3], [4][ref4], [5][ref5], [6][ref6], [7][ref7], [15][ref8], [17][ref9],
      [22][ref10] en [23][ref11],[ 25 tot en met 30][ref12], [33][ref13], [36d, eerste lid][ref14],
      [36e, tweede lid][ref15], en [36f van de Wet politiegegevens][ref16] van overeenkomstige toepassing, met dien
      verstande dat voor het meldpunt als verantwoordelijke in de zin van [artikel 1, onderdeel f, van die wet][ref17]
      wordt aangemerkt Onze Minister van Justitie en Veiligheid.


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0022463#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0022463#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0022463#Artikel4
      [ref5]: https://wetten.overheid.nl/BWBR0022463#Artikel5
      [ref6]: https://wetten.overheid.nl/BWBR0022463#Artikel6
      [ref7]: https://wetten.overheid.nl/BWBR0022463#Artikel7
      [ref8]: https://wetten.overheid.nl/BWBR0022463#Artikel15
      [ref9]: https://wetten.overheid.nl/BWBR0022463#Artikel17
      [ref10]: https://wetten.overheid.nl/BWBR0022463#Artikel22
      [ref11]: https://wetten.overheid.nl/BWBR0022463#Artikel23
      [ref12]: https://wetten.overheid.nl/BWBR0022463#Artikel25
      [ref13]: https://wetten.overheid.nl/BWBR0022463#Artikel33
      [ref14]: https://wetten.overheid.nl/BWBR0022463#Artikel36d
      [ref15]: https://wetten.overheid.nl/BWBR0022463#Artikel36e
      [ref16]: https://wetten.overheid.nl/BWBR0022463#Artikel36f
      [ref17]: https://wetten.overheid.nl/BWBR0022463#Artikel1
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel3.3
