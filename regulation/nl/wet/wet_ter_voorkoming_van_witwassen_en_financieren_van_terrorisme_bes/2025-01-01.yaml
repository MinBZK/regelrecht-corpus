  - number: 6.1.3
    text: |-
      De in het eerste lid strafbaar gestelde feiten zijn misdrijven. De in het tweede lid strafbaar gestelde feiten
      zijn overtredingen.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel6.1
  - number: 6.2.1
    text: |-
      Met de opsporing van de in [artikel 6.1][ref1] strafbaar gestelde feiten zijn, naast de in
      [artikel 184 van het Wetboek van Strafvordering BES][ref2] bedoelde ambtenaren, belast de daartoe bij besluit van
      Onze Minister van Justitie en Veiligheid in overeenstemming met Onze Minister aangewezen ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0030824#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel184
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0030824
        artikel: '6'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0028681
        artikel: '184'
  - number: 6.2.2
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel6.2
  - number: '7.1'
    text: |-
      Een ontheffing, verleend op grond van
      [artikel 2, vijfde lid, van de Wet identificatie bij dienstverlening BES][ref1], berust vanaf het tijdstip van
      inwerkingtreding van deze wet op[ artikel 2.2, vijfde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0028490#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0030824#Artikel2
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel7.1
    references:
      - id: ref1
        bwb_id: BWBR0028490
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0030824
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 7.2.1
    text: |-
      Onverminderd [artikel 2.3, eerste lid, onderdeel e][ref1], is [artikel 2.2, eerste lid][ref2], niet van toepassing
      ten aanzien van cliënten die reeds op grond van de [Wet identificatie bij dienstverlening BES][ref3] zijn
      geïdentificeerd of ten aanzien van wie geen verplichting tot identificatie op grond van die wet was vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0030824#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0030824#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0028490
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel7.2
    references:
      - id: ref1
        bwb_id: BWBR0030824
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0030824
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0028490
  - number: 7.2.2
    text: |-
      Gegevens van de in het eerste lid bedoelde personen die reeds op grond van de
      [Wet identificatie bij dienstverlening BES][ref1] zijn vastgelegd, worden geacht te zijn vastgelegd ingevolge deze
      wet.


      [ref1]: https://wetten.overheid.nl/BWBR0028490
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel7.2
    references:
      - id: ref1
        bwb_id: BWBR0028490
  - number: '7.3'
    text: |-
      Een bestuurlijke boete, opgelegd ter zake van overtreding van een voorschrift, gesteld bij of krachtens de
      [Wet identificatie bij dienstverlening BES][ref1] of de [Wet melding ongebruikelijke transacties BES][ref2],
      wordt vanaf het tijdstip van inwerkingtreding van deze wet gelijkgesteld met een op grond van [artikel 5.11][ref3]
      opgelegde bestuurlijke boete.


      [ref1]: https://wetten.overheid.nl/BWBR0028490
      [ref2]: https://wetten.overheid.nl/BWBR0028598
      [ref3]: https://wetten.overheid.nl/BWBR0030824#Artikel5
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel7.3
    references:
      - id: ref1
        bwb_id: BWBR0028490
      - id: ref2
        bwb_id: BWBR0028598
      - id: ref3
        bwb_id: BWBR0030824
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '3'
  - number: 7.4.1
    text: |-
      De toezichtautoriteit kan na inwerkingtreding van deze wet tot drie jaren na de dag waarop de overtreding is
      begaan een bestuurlijke boete opleggen ter zake van overtreding van een voorschrift gesteld bij of krachtens de
      [Wet identificatie bij dienstverlening BES][ref1]of de [Wet melding ongebruikelijke transacties BES][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0028490
      [ref2]: https://wetten.overheid.nl/BWBR0028598
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel7.4
    references:
      - id: ref1
        bwb_id: BWBR0028490
      - id: ref2
        bwb_id: BWBR0028598
  - number: 7.4.2
    text: |-
      Op een bestuurlijke boete als bedoeld in het eerste lid blijft het recht van toepassing dat gold voor het tijdstip
      van inwerkingtreding van deze wet.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel7.4
  - number: '7.5'
    text: |-
      Op bezwaar of beroep, ingesteld vóór het tijdstip van inwerkingtreding van deze wet tegen een besluit op grond van
      de [Wet identificatie bij dienstverlening BES][ref1] of de [Wet melding ongebruikelijke transacties BES][ref2],
      blijft het recht van toepassing dat gold voor het tijdstip van inwerkingtreding van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0028490
      [ref2]: https://wetten.overheid.nl/BWBR0028598
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel7.5
    references:
      - id: ref1
        bwb_id: BWBR0028490
      - id: ref2
        bwb_id: BWBR0028598
  - number: '7.6'
    text: |-
      Een op grond van [artikel 23 van de Wet melding ongebruikelijke transacties BES ][ref1]gegeven aanwijzing
      wordt vanaf het tijdstip van inwerkingtreding van deze wet aangemerkt als een aanwijzing als bedoeld in
      [artikel 5.9][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0028598#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0030824#Artikel5
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel7.6
    references:
      - id: ref1
        bwb_id: BWBR0028598
        artikel: '23'
      - id: ref2
        bwb_id: BWBR0030824
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '3'
  - number: '7.7'
    text: |-
      De [Wet identificatie bij dienstverlening BES][ref1], de[ Wet melding ongebruikelijke transacties BES][ref2] en de
      [Wet grensoverschrijdende geldtransporten BES][ref3] worden ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0028490
      [ref2]: https://wetten.overheid.nl/BWBR0028598
      [ref3]: https://wetten.overheid.nl/BWBR0028165
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel7.7
    references:
      - id: ref1
        bwb_id: BWBR0028490
      - id: ref2
        bwb_id: BWBR0028598
      - id: ref3
        bwb_id: BWBR0028165
  - number: '7.8'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel7.8
  - number: '7.9'
    text: 'Deze wet wordt aangehaald als: Wet ter voorkoming van witwassen en financieren van terrorisme BES.'
    url: https://wetten.overheid.nl/BWBR0030824/2025-01-01#Artikel7.9
