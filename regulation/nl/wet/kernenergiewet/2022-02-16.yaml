  - number: '76.2'
    text: |-
      Een algemene maatregel van bestuur als bedoeld in het eerste lid wordt, nadat hij is vastgesteld, toegezonden aan
      beide kamers der Staten-Generaal. Hij treedt niet eerder in werking dan vier weken na de datum van uitgifte van het
      *Staatsblad* waarin hij is geplaatst.
    url: https://wetten.overheid.nl/BWBR0002402/2022-02-16#Artikel76
  - number: '76.3'
    text: |-
      Ten aanzien van bij een algemene maatregel van bestuur, vastgesteld krachtens [artikel 67][ref1], geregelde
      onderwerpen kunnen Onze betrokken Ministers nadere regelen stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel67
    url: https://wetten.overheid.nl/BWBR0002402/2022-02-16#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '67'
        hoofdstuk: IX
  - number: '76.4'
    text: |-
      Hetgeen ingevolge deze wet bij algemene maatregel van bestuur kan worden geregeld, kan in afwijking daarvan bij
      ministeriële regeling worden geregeld, indien de regels uitsluitend strekken ter uitvoering van een voor Nederland
      verbindend verdrag of een voor Nederland verbindend besluit van een volkenrechtelijke organisatie, tenzij voor een
      juiste uitvoering wijziging van een algemene maatregel van bestuur of de wet noodzakelijk is. Op de vaststelling
      van een ministeriële regeling zijn de [artikelen 26][ref1] en [35][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0002402#Artikel35
    url: https://wetten.overheid.nl/BWBR0002402/2022-02-16#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '26'
        hoofdstuk: III
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0002402
        artikel: '35'
        hoofdstuk: IV
        afdeling: '3'
  - number: 76a
    text: |-
      Een gedraging in strijd met een voorschrift dat is verbonden aan een krachtens deze wet verleende vergunning, is
      verboden.
    url: https://wetten.overheid.nl/BWBR0002402/2022-02-16#Artikel76a
  - number: '79'
    text: 'Degene die:'
    url: https://wetten.overheid.nl/BWBR0002402/2022-02-16#Artikel79
  - number: 79.a
    text: |-
      splijtstoffen of ertsen vervoert, voorhanden heeft, toepast, binnen of buiten Nederlands grondgebied brengt of doet
      brengen, ter beschikking stelt dan wel zich deze verschaft of zich daarvan ontdoet,
    url: https://wetten.overheid.nl/BWBR0002402/2022-02-16#Artikel79
  - number: 79.b
    text: |-
      een inrichting waarin kernenergie kan worden vrijgemaakt, splijtstoffen kunnen worden vervaardigd, bewerkt of
      verwerkt, dan wel splijtstoffen worden opgeslagen, opricht, in werking brengt, in werking houdt of wijzigt,
    url: https://wetten.overheid.nl/BWBR0002402/2022-02-16#Artikel79
  - number: 79.c
    text: |-
      een uitrusting, geschikt om een vaartuig of een ander vervoermiddel door middel van kernenergie voort te bewegen,
      daarin aanbrengt of aangebracht houdt, dan wel zodanige daarin aangebrachte uitrusting in werking brengt, in
      werking houdt of wijzigt,
    url: https://wetten.overheid.nl/BWBR0002402/2022-02-16#Artikel79
  - number: 79.d
    text: |-
      radioactieve stoffen bereidt, vervoert, voorhanden heeft, toepast, binnen of buiten Nederlands grondgebied brengt
      of doet brengen, ter beschikking stelt, dan wel zich deze verschaft of zich daarvan ontdoet,
    url: https://wetten.overheid.nl/BWBR0002402/2022-02-16#Artikel79
  - number: 79.e
    text: |-
      ioniserende stralen uitzendende toestellen vervaardigt, vervoert, voorhanden heeft, toepast, binnen of buiten
      Nederlands grondgebied brengt of doet brengen, ter beschikking stelt, dan wel zich een zodanig toestel verschaft of
      zich daarvan ontdoet,
    url: https://wetten.overheid.nl/BWBR0002402/2022-02-16#Artikel79
  - number: '80.1'
    text: |-
      Indien van het opzettelijk handelen in strijd met het bij of krachtens de [artikelen 15][ref1], [21][ref2],
      [26][ref3], of [76a][ref4], voor zover betrekking hebbend op een vergunning als bedoeld in [artikel 15][ref5],
      bepaalde gevaar voor ernstig lichamelijk letsel voor een ander of aanzienlijke schade aan goederen of het milieu
      te duchten is, wordt de schuldige gestraft met gevangenisstraf van ten hoogste twaalf jaren of geldboete van de
      vijfde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002402#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0002402#Artikel26
      [ref4]: https://wetten.overheid.nl/BWBR0002402#Artikel76a
      [ref5]: https://wetten.overheid.nl/BWBR0002402#Artikel15
    url: https://wetten.overheid.nl/BWBR0002402/2022-02-16#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
        hoofdstuk: III
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0002402
        artikel: '21'
        hoofdstuk: III
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0002402
        artikel: '26'
        hoofdstuk: III
        afdeling: '5'
      - id: ref4
        bwb_id: BWBR0002402
        artikel: 76a
        hoofdstuk: IX
      - id: ref5
        bwb_id: BWBR0002402
        artikel: '15'
        hoofdstuk: III
        afdeling: '2'
  - number: '80.2'
    text: |-
      Indien van het opzettelijk handelen in strijd met het bij of krachtens de [artikelen 15][ref1], [21][ref2],
      [26][ref3] of [76a][ref4], voor zover betrekking hebbend op een vergunning als bedoeld in [artikel 15][ref5],
      bepaalde levensgevaar voor een ander te duchten is en het feit iemands dood ten gevolge heeft, wordt de schuldige
      gestraft met levenslange gevangenisstraf of tijdelijke van ten hoogste dertig jaren of geldboete van de vijfde
      categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002402#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0002402#Artikel26
      [ref4]: https://wetten.overheid.nl/BWBR0002402#Artikel76a
      [ref5]: https://wetten.overheid.nl/BWBR0002402#Artikel15
