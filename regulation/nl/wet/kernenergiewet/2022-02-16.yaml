      - id: ref3
        bwb_id: BWBR0001854
        artikel: '179'
      - id: ref4
        bwb_id: BWBR0001854
        artikel: '184'
  - number: '83.2'
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0002402/2022-02-16#Artikel83
  - number: 83a
    text: |-
      Met betrekking tot de handhaving van het bij of krachtens deze wet bepaalde zijn
      de [artikelen 5.15 tot en met 5.18][ref1], [5.19, eerste en derde lid][ref2], en
      [5.21 tot en met 5.23 van de Wet algemene bepalingen omgevingsrecht][ref3] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0024779#Artikel5
    url: https://wetten.overheid.nl/BWBR0002402/2022-02-16#Artikel83a
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0024779
        artikel: '5'
  - number: 83b.1
    text: |-
      De [artikelen 5:13][ref1] en [5:15 tot en met 5:20, eerste en tweede lid, van de Algemene wet bestuursrecht][ref2]
      zijn van overeenkomstige toepassing ten aanzien van de in [artikel 83][ref3] bedoelde ambtenaren bij de uitoefening
      van de in dat artikel bedoelde taken.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0002402#Artikel83
    url: https://wetten.overheid.nl/BWBR0002402/2022-02-16#Artikel83b
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0002402
        artikel: '83'
        hoofdstuk: X
  - number: 83b.2
    text: |-
      De in [artikel 83][ref1] bedoelde ambtenaren zijn bij de uitoefening van de in dat artikel bedoelde taken bevoegd,
      met medeneming van de benodigde apparatuur, een woning binnen te treden zonder toestemming van de bewoner.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel83
    url: https://wetten.overheid.nl/BWBR0002402/2022-02-16#Artikel83b
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '83'
        hoofdstuk: X
  - number: 83c
    text: |-
      De Autoriteit is bevoegd tot oplegging van een last onder bestuursdwang ter handhaving van de bij of krachtens deze
      wet gestelde verplichtingen, voor zover het het werkterrein van de Autoriteit betreft en voor zover die bevoegdheid
      niet al voortvloeit uit andere voorschriften van deze wet.
    url: https://wetten.overheid.nl/BWBR0002402/2022-02-16#Artikel83c
  - number: '85'
    text: |-
      Krachtens de Hinderwet voor inrichtingen als in [artikel 15, onder ][ref1], bedoeld verleende vergunningen worden
      geacht te zijn verleend op grond van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
    url: https://wetten.overheid.nl/BWBR0002402/2022-02-16#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
        hoofdstuk: III
        afdeling: '2'
  - number: '87'
    text: De Röntgenstralenwet (*Stb.* 1931, 299) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0002402/2022-02-16#Artikel87
  - number: '88'
    text: 'Deze wet kan worden aangehaald als: Kernenergiewet.'
    url: https://wetten.overheid.nl/BWBR0002402/2022-02-16#Artikel88
  - number: '89.1'
    text: |-
      [Hoofdstuk II van deze wet][ref1] treedt in werking met ingang van de dag na de datum van uitgifte van het
      *Staatsblad*, waarin zij wordt geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0002402/2022-02-16#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0002402
        hoofdstuk: II
  - number: '89.2'
    text: |-
      Haar onderscheidene overige bepalingen treden in werking op door Ons te bepalen tijdstippen. De voordrachten
      hiertoe worden Ons gedaan door Onze Ministers, wie het aangaat, de Centrale Raad gehoord.
    url: https://wetten.overheid.nl/BWBR0002402/2022-02-16#Artikel89
