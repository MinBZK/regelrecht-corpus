  - number: '81'
    text: |-
      De in de [artikelen 79][ref1] en [80][ref2] strafbaar gestelde feiten zijn misdrijven.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel79
      [ref2]: https://wetten.overheid.nl/BWBR0002402#Artikel80
    url: https://wetten.overheid.nl/BWBR0002402/2022-02-16#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '79'
        hoofdstuk: X
      - id: ref2
        bwb_id: BWBR0002402
        artikel: '80'
        hoofdstuk: X
  - number: '82'
    text: |-
      Ingeval bij of krachtens deze wet regels worden gesteld met gebruikmaking van door het Internationaal
      Atoomenergieagentschap vastgestelde veiligheidsnormen, kan overtreding van die regels ook als strafbaar feit worden
      aangemerkt dan wel worden bestraft met een bestuurlijke sanctie indien deze regels in de Engelse taal zijn gesteld
      en bekend gemaakt.
    url: https://wetten.overheid.nl/BWBR0002402/2022-02-16#Artikel82
  - number: '83.1'
    text: |-
      Met de opsporing van de bij of krachtens deze wet strafbaar gestelde feiten zijn, onverminderd
      [artikel 141 van het Wetboek van Strafvordering][ref1], belast de in [artikel 58][ref2] bedoelde ambtenaren,
      voor zover zij bij besluit van Onze Minister van Veiligheid en Justitie zijn aangewezen. Deze ambtenaren zijn
      tevens belast met de opsporing van de feiten, strafbaar gesteld in de [artikelen 179 tot en met 182][ref3] en
      [184 van het Wetboek van Strafrecht][ref4], voor zover deze feiten betrekking hebben op een bevel, vordering of
      handeling, gedaan of ondernomen door henzelf.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
      [ref2]: https://wetten.overheid.nl/BWBR0002402#Artikel58
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel179
      [ref4]: https://wetten.overheid.nl/BWBR0001854#Artikel184
    url: https://wetten.overheid.nl/BWBR0002402/2022-02-16#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
      - id: ref2
        bwb_id: BWBR0002402
        artikel: '58'
