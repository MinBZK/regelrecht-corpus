        hoofdstuk: III
        afdeling: '2'
  - number: '80.3'
    text: |-
      De samenspanning tot de in het eerste en tweede lid omschreven misdrijven, te begaan met een
      terroristisch oogmerk als bedoeld in [artikel 83a van het Wetboek van Strafrecht][ref1], wordt
      gestraft met gevangenisstraf van ten hoogste tien jaren of geldboete van de vijfde categorie.
      [Artikel 96, tweede lid, van het Wetboek van Strafrecht][ref2] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel83a
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel96
    url: https://wetten.overheid.nl/BWBR0002402/2022-02-16#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 83a
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '96'
  - number: 80a
    text: |-
      In geval van vervolging wegens een strafbaar feit, vallende onder de omschrijvingen van artikel 7, eerste
      lid, onder a en d, van het op 3 maart 1980 te Wenen/New York tot stand gekomen Verdrag inzake de fysieke
      beveiliging van kernmateriaal (Trb. 1981, 7), zoals gewijzigd bij de op 8 juli 2005 te Wenen tot stand
      gekomen Wijziging van dat verdrag (Trb. 2006, 81), op grond van een der bevoegdheidsregels, bedoeld in
      [artikel 8, eerste lid, onder b][ref1], of [artikel 8, tweede lid][ref2], van dat Verdrag, wordt bij de toepassing
      van deze wet


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002402#Artikel8
    url: https://wetten.overheid.nl/BWBR0002402/2022-02-16#Artikel80a
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '8'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0002402
        artikel: '8'
        hoofdstuk: II
  - number: 80a.a
    text: |-
      elk handelen zonder vergunning te verlenen door het bevoegd gezag van een Staat, Partij bij dat Verdrag, of in
      strijd met de in zulk een Staat geldende voorschriften gelijk gesteld met eenzelfde handelen zonder vergunning te
      verlenen ingevolge deze wet of in strijd met overeenkomstige bij of krachtens deze wet gestelde voorschriften,
    url: https://wetten.overheid.nl/BWBR0002402/2022-02-16#Artikel80a
  - number: 80a.b
    text: |-
      het binnen of buiten het grondgebied van een Staat, Partij bij dat Verdrag, brengen of doen brengen gelijk gesteld
      met het binnen of buiten Nederlands grondgebied brengen of doen brengen, en
    url: https://wetten.overheid.nl/BWBR0002402/2022-02-16#Artikel80a
  - number: 80a.c
    text: de veiligheid van de Staat gelijk gesteld met de veiligheid van een vreemde Staat, Partij bij dat Verdrag.
    url: https://wetten.overheid.nl/BWBR0002402/2022-02-16#Artikel80a
  - number: 80b
    text: |-
      Bij veroordeling wegens een der misdrijven omschreven in de [artikelen 79][ref1] en [80, derde lid][ref2],
      alsmede bij veroordeling wegens een der misdrijven omschreven in artikel 80, tweede lid, begaan met een
      terroristisch oogmerk als bedoeld in [artikel 83a van het Wetboek van Strafrecht][ref3], kan ontzetting van het in
      [artikel 28, eerste lid, onder 3°, van het Wetboek van Strafrecht][ref4] vermelde recht worden uitgesproken.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel79
      [ref2]: https://wetten.overheid.nl/BWBR0002402#Artikel80
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel83a
