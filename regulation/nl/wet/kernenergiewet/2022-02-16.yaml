        bwb_id: BWBR0005416
        artikel: '176'
  - number: 49e.1.a
    text: de schade niet langs burgerrechtelijke weg is of kan worden verhaald;
    url: https://wetten.overheid.nl/BWBR0002402/2022-02-16#Artikel49e
  - number: 49e.1.b
    text: in de vergoeding van de schade niet op andere wijze is of kan worden voorzien.
    url: https://wetten.overheid.nl/BWBR0002402/2022-02-16#Artikel49e
  - number: 49e.2
    text: 'Het in het vijfde lid aangewezen bestuursorgaan kan regels stellen:'
    url: https://wetten.overheid.nl/BWBR0002402/2022-02-16#Artikel49e
  - number: 49e.2.a
    text: |-
      waarbij categorieën van gevallen worden aangewezen, ten aanzien waarvan toepassing zal worden gegeven aan het
      eerste lid;
    url: https://wetten.overheid.nl/BWBR0002402/2022-02-16#Artikel49e
  - number: 49e.2.b
    text: |-
      omtrent de indiening en behandeling van en de beslissing op een verzoek om een vergoeding als bedoeld in het eerste
      lid.
    url: https://wetten.overheid.nl/BWBR0002402/2022-02-16#Artikel49e
  - number: 49e.3
    text: |-
      Het in het vijfde lid aangewezen bestuursorgaan kan regels stellen, waarbij wordt bepaald dat een vergoeding kan
      worden toegekend indien de vaststelling vooraf of zich al dan niet schade als bedoeld in het eerste lid, onder *a*
      of *b*, voordoet, zou leiden tot onredelijke vertraging in de behandeling van het verzoek of tot kosten ten aanzien
      waarvan in redelijkheid niet kan worden gevergd dat de belanghebbende deze draagt.
    url: https://wetten.overheid.nl/BWBR0002402/2022-02-16#Artikel49e
  - number: 49e.4
    text: |-
      Een vergoeding krachtens het derde lid kan alleen aan de belanghebbende worden toegekend onder de voorwaarde dat
      hij voor het toegekende bedrag de rechten die hij terzake van de door hem geleden schade tegenover derden heeft,
      overdraagt aan het bestuursorgaan dat de vergoeding toekent.
    url: https://wetten.overheid.nl/BWBR0002402/2022-02-16#Artikel49e
  - number: 49e.5
    text: 'Regels als bedoeld in het tweede en derde lid worden gesteld door:'
    url: https://wetten.overheid.nl/BWBR0002402/2022-02-16#Artikel49e
  - number: 49e.5.a
    text: |-
      Onze Minister wie het aangaat, indien het betreft schade ten gevolge van de toepassing van [artikel 46][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel46
    url: https://wetten.overheid.nl/BWBR0002402/2022-02-16#Artikel49e
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '46'
        hoofdstuk: VI
        afdeling: '4'
  - number: 49e.5.b
    text: |-
      de gemeenteraad, indien het betreft schade ten gevolge van de toepassing van [artikel 49b][ref1] of van de
      toepassing van [artikel 175][ref2] of [176 van de Gemeentewet][ref3] bij een ongeval met een categorie B-object;


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel49b
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel175
      [ref3]: https://wetten.overheid.nl/BWBR0005416#Artikel176
    url: https://wetten.overheid.nl/BWBR0002402/2022-02-16#Artikel49e
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: 49b
        hoofdstuk: VI
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '175'
      - id: ref3
        bwb_id: BWBR0005416
        artikel: '176'
  - number: 49e.5.c
    text: |-
      de beheerder van het oppervlaktewater indien het betreft schade ten gevolge van de toepassing van
      [artikel 49d][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel49d
    url: https://wetten.overheid.nl/BWBR0002402/2022-02-16#Artikel49e
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: 49d
        hoofdstuk: VI
        afdeling: '4'
  - number: 49e.6
    text: 'De beslissing op een verzoek om vergoeding van schade als bedoeld in het eerste lid wordt genomen door:'
    url: https://wetten.overheid.nl/BWBR0002402/2022-02-16#Artikel49e
  - number: 49e.6.a
    text: Onze Minister wie het aangaat, indien het betreft schade ten gevolge van de toepassing van artikel 46;
    url: https://wetten.overheid.nl/BWBR0002402/2022-02-16#Artikel49e
  - number: 49e.6.b
    text: |-
      het college van burgemeester en wethouders, indien het betreft schade ten gevolge van de toepassing van
      [artikel 49b][ref1] of van de toepassing van [artikel 175][ref2] of [176 van de Gemeentewet][ref3] bij een ongeval
      met een categorie B-object;


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel49b
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel175
      [ref3]: https://wetten.overheid.nl/BWBR0005416#Artikel176
    url: https://wetten.overheid.nl/BWBR0002402/2022-02-16#Artikel49e
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: 49b
        hoofdstuk: VI
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '175'
      - id: ref3
        bwb_id: BWBR0005416
        artikel: '176'
  - number: 49e.6.c
    text: |-
      de beheerder van het oppervlaktewater, indien het betreft schade ten gevolge van de toepassing van
      [artikel 49d][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel49d
    url: https://wetten.overheid.nl/BWBR0002402/2022-02-16#Artikel49e
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: 49d
        hoofdstuk: VI
        afdeling: '4'
  - number: '58.1'
    text: 'Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast:'
    url: https://wetten.overheid.nl/BWBR0002402/2022-02-16#Artikel58
  - number: 58.1.a
    text: |-
      de bij besluit van de Autoriteit aangewezen ambtenaren die deel uitmaken van het personeel, bedoeld in
      [artikel 10][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel10
    url: https://wetten.overheid.nl/BWBR0002402/2022-02-16#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '10'
        hoofdstuk: II
  - number: 58.1.b
    text: de bij besluit van Onze Ministers, wie het aangaat, aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0002402/2022-02-16#Artikel58
  - number: '58.2'
    text: |-
      Onze Ministers van Infrastructuur en Milieu en van Sociale Zaken en Werkgelegenheid wijzen, in overeenstemming
      met Onze Ministers wie het mede aangaat, ambtenaren aan belast met het meten van doses ioniserende straling en het
      bepalen van radioactieve besmetting, alsmede met de in [artikel 37][ref1] bedoelde registratie daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel37
    url: https://wetten.overheid.nl/BWBR0002402/2022-02-16#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '37'
        hoofdstuk: Va
  - number: '58.3'
    text: |-
      Met de uitoefening van de in het eerste lid, onderdeel b, en het tweede lid bedoelde taken zijn mede belast
      de door Onze Minister van Volksgezondheid, Welzijn en Sport daartoe aangewezen ambtenaren, bedoeld in
      [artikel 25, eerste lid, onder ][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001969#Artikel25
    url: https://wetten.overheid.nl/BWBR0002402/2022-02-16#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0001969
        artikel: '25'
  - number: '58.4'
    text: |-
      Onze betrokken Ministers stellen regelen betreffende de taakvervulling van de krachtens het eerste lid, onderdeel
      b, en het tweede en derde lid aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0002402/2022-02-16#Artikel58
  - number: '58.5'
    text: |-
      Van een besluit als bedoeld in het eerste, tweede of derde lid wordt mededeling gedaan door plaatsing in de
      *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0002402/2022-02-16#Artikel58
  - number: '59.1'
    text: |-
      De [artikelen 5:13][ref1] en [5:15 tot en met 5:20, eerste en tweede lid, van de Algemene wet bestuursrecht][ref2]
      zijn van overeenkomstige toepassing ten aanzien van de in [artikel 58, tweede en derde lid][ref3], bedoelde
      ambtenaren bij de uitoefening van de in [artikel 58, tweede lid][ref4], bedoelde taken.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0002402#Artikel58
      [ref4]: https://wetten.overheid.nl/BWBR0002402#Artikel58
    url: https://wetten.overheid.nl/BWBR0002402/2022-02-16#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0002402
        artikel: '58'
        hoofdstuk: VIII
      - id: ref4
        bwb_id: BWBR0002402
        artikel: '58'
        hoofdstuk: VIII
  - number: '59.2'
    text: |-
      De in [artikel 58, eerste, tweede en derde lid][ref1], bedoelde ambtenaren zijn bevoegd, met medeneming van de
      benodigde apparatuur, een woning binnen te treden zonder toestemming van de bewoner.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel58
    url: https://wetten.overheid.nl/BWBR0002402/2022-02-16#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '58'
        hoofdstuk: VIII
  - number: '65.1'
    text: |-
      De Autoriteit kan personen, die zijn aangewezen om de naleving van internationale overeenkomsten en door
      volkenrechtelijke organisaties genomen besluiten, geheel of gedeeltelijk betrekking hebbende op het gebied van de
      kernenergie of van de ioniserende straling, te controleren, toelaten deze taak te vervullen.
    url: https://wetten.overheid.nl/BWBR0002402/2022-02-16#Artikel65
  - number: '65.2'
    text: |-
      De [artikelen 5:13][ref1] en [5:15 tot en met 5:20, eerste en tweede lid, van de Algemene wet bestuursrecht][ref2]
      zijn van overeenkomstige toepassing ten aanzien van de in het eerste lid bedoelde personen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0002402/2022-02-16#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '65.3'
    text: |-
      De in het eerste lid bedoelde personen zijn bevoegd, met medeneming van de benodigde apparatuur, een woning binnen
      te treden zonder toestemming van de bewoner, met dien verstande dat bedoelde personen daarbij vergezeld zijn van
      een ambtenaar als bedoeld in [artikel 58][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel58
    url: https://wetten.overheid.nl/BWBR0002402/2022-02-16#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '58'
        hoofdstuk: VIII
  - number: '65.4'
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0002402/2022-02-16#Artikel65
  - number: '66'
    text: |-
      Het bevoegd gezag is bevoegd tot overeenkomstige toepassing van
      [artikel 5:20, derde lid, van de Algemene wet bestuursrecht][ref1] ter handhaving van de
      [artikelen 59, eerste lid][ref2], en [65, tweede lid][ref3], voor zover het betreft de verplichting tot het
      verlenen van medewerking aan een krachtens [artikel 58, tweede en derde lid][ref4], aangewezen ambtenaar of een
      krachtens artikel 65 toegelaten persoon.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0002402#Artikel59
      [ref3]: https://wetten.overheid.nl/BWBR0002402#Artikel65
      [ref4]: https://wetten.overheid.nl/BWBR0002402#Artikel58
    url: https://wetten.overheid.nl/BWBR0002402/2022-02-16#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0002402
        artikel: '59'
        hoofdstuk: VIII
      - id: ref3
        bwb_id: BWBR0002402
        artikel: '65'
        hoofdstuk: VIII
      - id: ref4
        bwb_id: BWBR0002402
        artikel: '58'
        hoofdstuk: VIII
  - number: '67.1'
    text: |-
      Bij algemene maatregel van bestuur kunnen regelen worden gesteld ter uitvoering van internationale overeenkomsten
      en door volkenrechtelijke organisaties genomen besluiten, geheel of gedeeltelijk betrekking hebbende op het gebied
      van de kernenergie of van de ioniserende straling.
    url: https://wetten.overheid.nl/BWBR0002402/2022-02-16#Artikel67
  - number: '67.2'
    text: 'Hiertoe kunnen behoren:'
    url: https://wetten.overheid.nl/BWBR0002402/2022-02-16#Artikel67
  - number: 67.2.a
    text: |-
      regelen, welke een verbod inhouden hulpstoffen of hulptoestellen, welke voor de vrijmaking van kernenergie of voor
      de opslag, vervaardiging, bewerking of verwerking van splijtstoffen dienstig kunnen zijn, voorhanden te hebben dan
      wel binnen of buiten Nederlands grondgebied te brengen zonder vergunning;
    url: https://wetten.overheid.nl/BWBR0002402/2022-02-16#Artikel67
  - number: 67.2.b
    text: regelen, welke de verplichting inhouden tot mededeling van daarbij aangewezen gegevens.
    url: https://wetten.overheid.nl/BWBR0002402/2022-02-16#Artikel67
  - number: '67.3'
    text: |-
      In geval van toepassing van het tweede lid, onder *a,* is [artikel 16][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel16
    url: https://wetten.overheid.nl/BWBR0002402/2022-02-16#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '16'
        hoofdstuk: III
        afdeling: '2'
  - number: '67.4'
    text: Aan een vergunning als in het tweede lid, onder *a,* bedoeld kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0002402/2022-02-16#Artikel67
  - number: '67.5'
    text: |-
      Zodanige voorschriften kunnen, voor zover bij de maatregel niet anders is bepaald, de verplichting inhouden te
      voldoen aan door bestuursorganen, die bij het voorschrift zijn aangewezen, gestelde nadere eisen. Bij het stellen
      van zodanige eis wordt tevens het tijdstip bepaald, waarop ten aanzien van die eis de verplichting ingaat.
    url: https://wetten.overheid.nl/BWBR0002402/2022-02-16#Artikel67
  - number: '67.6'
    text: |-
      Een vergunning als bedoeld in het tweede lid, onder *a,* kan te allen tijde worden ingetrokken op grond van
      gewichtige redenen aan het algemeen belang ontleend. De aan een vergunning verbonden voorschriften kunnen te allen
      tijde worden gewijzigd, aangevuld of ingetrokken.
    url: https://wetten.overheid.nl/BWBR0002402/2022-02-16#Artikel67
  - number: '68'
    text: 'Bij algemene maatregel van bestuur kunnen regelen worden gesteld ter verzekering van de geheimhouding van:'
    url: https://wetten.overheid.nl/BWBR0002402/2022-02-16#Artikel68
  - number: 68.a
    text: 'gegevens, hulpmiddelen en materialen voor:'
    url: https://wetten.overheid.nl/BWBR0002402/2022-02-16#Artikel68
  - number: 68.a.1°
    text: de vrijmaking van kernenergie,
    url: https://wetten.overheid.nl/BWBR0002402/2022-02-16#Artikel68
  - number: 68.a.2°
    text: de opslag, vervaardiging, bewerking of verwerking van splijtstoffen en
    url: https://wetten.overheid.nl/BWBR0002402/2022-02-16#Artikel68
  - number: 68.a.3°
    text: |-
      de beveiliging van bij die maatregel aangewezen categorieën van splijtstoffen, ertsen, radioactieve stoffen en
      inrichtingen als bedoeld in [artikel 15, onder b][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
    url: https://wetten.overheid.nl/BWBR0002402/2022-02-16#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
        hoofdstuk: III
        afdeling: '2'
  - number: 68.b
    text: |-
      met behulp van zodanige gegevens, hulpmiddelen en materialen verrichte onderzoekingen en toegepaste werkmethoden,
      voor zover deze onderzoekingen en werkmethoden door Onze Ministers, wie het aangaat, zijn aangewezen.
    url: https://wetten.overheid.nl/BWBR0002402/2022-02-16#Artikel68
  - number: '69.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur wordt bepaald welke taken worden verricht door een deskundige en
      worden regels gesteld met betrekking tot de vaardigheden en bekwaamheden, waaraan deskundigen moeten voldoen.
    url: https://wetten.overheid.nl/BWBR0002402/2022-02-16#Artikel69
  - number: '69.2'
    text: |-
      Bij de maatregel kan worden bepaald dat daarbij aangewezen taken slechts mogen worden verricht door een persoon die
      met het oog op de uitvoering van die taken is ingeschreven in een door de Autoriteit beheerd register.
    url: https://wetten.overheid.nl/BWBR0002402/2022-02-16#Artikel69
  - number: '69.3'
    text: |-
      De Autoriteit beslist op de aanvraag voor inschrijving in een register als bedoeld in het tweede lid. Zij is
      bevoegd de inschrijving door te halen.
    url: https://wetten.overheid.nl/BWBR0002402/2022-02-16#Artikel69
  - number: '69.4'
    text: |-
      Een inschrijving in een register geldt voor een bepaalde tijd. Aan een inschrijving kunnen voorschriften worden
      verbonden.
    url: https://wetten.overheid.nl/BWBR0002402/2022-02-16#Artikel69
  - number: '69.5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de eisen met betrekking tot vaardigheden
      en bekwaamheden waaraan een persoon moet voldoen om als deskundige in een register te kunnen worden ingeschreven.
    url: https://wetten.overheid.nl/BWBR0002402/2022-02-16#Artikel69
  - number: '69.6'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de inschrijving in een register,
      die in ieder geval betrekking kunnen hebben op:
    url: https://wetten.overheid.nl/BWBR0002402/2022-02-16#Artikel69
  - number: 69.6.a
    text: |-
      de wijze waarop de aanvraag voor inschrijving in een register wordt gedaan en de door de aanvrager te verschaffen
      gegevens en bescheiden;
    url: https://wetten.overheid.nl/BWBR0002402/2022-02-16#Artikel69
  - number: 69.6.b
    text: de gronden waarop en de gevallen waarin de inschrijving kan worden geweigerd, doorgehaald of geschorst;
    url: https://wetten.overheid.nl/BWBR0002402/2022-02-16#Artikel69
  - number: 69.6.c
    text: de vergoeding die is verschuldigd in verband met de inschrijving in een register;
    url: https://wetten.overheid.nl/BWBR0002402/2022-02-16#Artikel69
  - number: 69.6.d
    text: het beheer van een register.
    url: https://wetten.overheid.nl/BWBR0002402/2022-02-16#Artikel69
  - number: '70.1'
    text: Een krachtens deze wet verleende vergunning is persoonlijk.
    url: https://wetten.overheid.nl/BWBR0002402/2022-02-16#Artikel70
  - number: '70.2'
    text: |-
      Na het overlijden van een vergunninghouder blijft de vergunning gedurende vier weken van kracht ten behoeve van
      diens rechtverkrijgenden, die het bedrijf voortzetten, mits door of namens hen binnen een week na dit overlijden
      daarvan aan de Autoriteit kennis wordt gegeven onder opgaaf van de namen van hen, die het bedrijf voortzetten.
      Wanneer binnen deze vier weken een aanvraag om een nieuwe vergunning is ingediend, blijft eerstbedoelde vergunning
      verder van kracht totdat op die aanvraag onherroepelijk is beslist. Gedurende het van kracht blijven van de
      vergunning kan zij overeenkomstig de [artikelen 19 tot en met 20a][ref1] worden gewijzigd of ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel19
    url: https://wetten.overheid.nl/BWBR0002402/2022-02-16#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '19'
        hoofdstuk: III
        afdeling: '2'
  - number: '70.3'
    text: |-
      De vergunninghouder kan de vergunning geheel of gedeeltelijk aan een ander overdragen, indien daarvoor toestemming
      is gegeven door de Autoriteit. Aan de toestemming kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0002402/2022-02-16#Artikel70
  - number: 70a
    text: |-
      Op een overeenkomst, gesloten door de eigenaar van een inrichting als bedoeld in [artikel 15, onder b][ref1],
      waarin kernenergie kan worden vrijgemaakt, met de Staat der Nederlanden, die verband houdt met die inrichting, is
      [artikel 252 van Boek 6 van het Burgerlijk Wetboek][ref2] van overeenkomstige toepassing, met dien verstande dat
      de in dat artikel bedoelde rechtsgevolgen mede zullen gelden voor verplichtingen van eerstgenoemde partij om ten
      aanzien van die inrichting iets te doen.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0005289#Artikel252
    url: https://wetten.overheid.nl/BWBR0002402/2022-02-16#Artikel70a
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
        hoofdstuk: III
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005289
        artikel: '252'
  - number: '71'
    text: |-
      Een vergunning als in [artikel 15, onder ][ref1] bedoeld wordt voor de toepassing van de
      [Belemmeringenwet Verordeningen][ref2] (*Stb.* 1899, 129) aangemerkt als een van Onzentwege verleende concessie als
      in artikel 1 van die wet bedoeld en voor de toepassing van de [Belemmeringenwet Privaatrecht][ref3] (*Stb.* 1927,
      159) als een door het openbaar gezag verleende concessie als in [artikel 1 van die wet][ref4] bedoeld.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0001865
      [ref3]: https://wetten.overheid.nl/BWBR0001936
      [ref4]: https://wetten.overheid.nl/BWBR0001936#Artikel1
    url: https://wetten.overheid.nl/BWBR0002402/2022-02-16#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
        hoofdstuk: III
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0001865
      - id: ref3
        bwb_id: BWBR0001936
      - id: ref4
        bwb_id: BWBR0001936
        artikel: '1'
  - number: '72.1'
    text: |-
      Bij algemene maatregel van bestuur kunnen bij of krachtens andere wetten gestelde regelen geheel of gedeeltelijk
      buiten toepassing worden verklaard, voor zover de belangen, welke die regelen beogen te beschermen, naar Ons
      oordeel in voldoende mate door toepassing van deze wet kunnen worden beschermd.
    url: https://wetten.overheid.nl/BWBR0002402/2022-02-16#Artikel72
  - number: '72.2'
    text: |-
      Indien Wij niet binnen twaalf weken na het in werking treden van een algemene maatregel van bestuur, waarbij
      bepalingen van een andere wet geheel of gedeeltelijk buiten toepassing zijn verklaard, aan de Staten-Generaal een
      voorstel van wet tot wijziging van die wet of tot afwijking daarvan hebben doen toekomen of indien zodanig voorstel
      wordt ingetrokken of verworpen, trekken Wij de maatregel onverwijld in.
    url: https://wetten.overheid.nl/BWBR0002402/2022-02-16#Artikel72
  - number: '73'
    text: |-
      Indien in deze wet geregelde onderwerpen in het belang van een goede uitvoering van de wet nadere regeling
      behoeven, kan deze geschieden bij algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0002402/2022-02-16#Artikel73
  - number: '74'
    text: |-
      De bij de toepassing van deze wet betrokken personen zijn verplicht in bij algemene maatregel van bestuur bepaalde
      gevallen en overeenkomstig daarbij gestelde regelen bij de maatregel vastgestelde bedragen aan de staat te betalen
      als bijdrage in de aan de uitvoering van deze wet verbonden kosten.
    url: https://wetten.overheid.nl/BWBR0002402/2022-02-16#Artikel74
  - number: '75.1'
    text: |-
      Wij kunnen ten behoeve van instellingen van wetenschap of in het belang van de landsverdediging van de in de
      [artikelen 15][ref1] en [29][ref2] vervatte verboden:


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002402#Artikel29
    url: https://wetten.overheid.nl/BWBR0002402/2022-02-16#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
        hoofdstuk: III
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0002402
        artikel: '29'
        hoofdstuk: IV
        afdeling: '1'
  - number: 75.1.a
    text: bij algemene maatregel van bestuur vrijstelling verlenen;
    url: https://wetten.overheid.nl/BWBR0002402/2022-02-16#Artikel75
  - number: 75.1.b
    text: op daartoe strekkend verzoek ontheffing verlenen.
    url: https://wetten.overheid.nl/BWBR0002402/2022-02-16#Artikel75
  - number: '75.2'
    text: |-
      Aan een vrijstelling of ontheffing worden de voorschriften verbonden, welke naar Ons oordeel nodig zijn met het oog
      op de bij of krachtens [artikel 15][ref1] aangewezen belangen.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15b
    url: https://wetten.overheid.nl/BWBR0002402/2022-02-16#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: 15b
        hoofdstuk: III
        afdeling: '2'
  - number: '76.1'
    text: |-
      Het ontwerp van een algemene maatregel van bestuur krachtens [artikel 4][ref1], [14][ref2], [15c][ref3],
      [15f][ref4], [16][ref5], [17][ref6], [17a][ref7], [18a][ref8], [21][ref9], [29][ref10], [32][ref11], [34][ref12],
      [37][ref13], [38a][ref14], [67][ref15], [68][ref16], [73][ref17] of [75][ref18] wordt overgelegd aan de beide
      kamers der Staten-Generaal en in de Staatscourant bekendgemaakt. Aan een ieder wordt de gelegenheid geboden
      binnen een bij die bekendmaking vast te stellen termijn van ten minste vier weken opmerkingen over het ontwerp
      schriftelijk ter kennis te brengen van Onze Ministers van Infrastructuur en Milieu, van Sociale Zaken en
      Werkgelegenheid en, behoudens ingeval het een maatregel krachtens artikel 21 betreft, van Volksgezondheid, Welzijn
      en Sport.


