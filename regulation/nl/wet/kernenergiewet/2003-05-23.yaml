        artikel: '18'
      - id: ref5
        bwb_id: BWBR0003245
        artikel: '18'
      - id: ref6
        bwb_id: BWBR0003245
        artikel: '18'
  - number: 83b.1
    text: |-
      De [artikelen 5:13][ref1] en [5:15 tot en met 5:20 van de Algemene wet bestuursrecht][ref2] zijn van
      overeenkomstige toepassing ten aanzien van de in [artikel 83][ref3] bedoelde ambtenaren bij de uitoefening van de
      in dat artikel bedoelde taken.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0002402#Artikel83
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel83b
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0002402
        artikel: '83'
        hoofdstuk: X
  - number: 83b.2
    text: |-
      De in [artikel 83][ref1] bedoelde ambtenaren zijn bij de uitoefening van de in dat artikel bedoelde taken bevoegd,
      met medeneming van de benodigde apparatuur, een woning binnen te treden zonder toestemming van de bewoner.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel83
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel83b
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '83'
        hoofdstuk: X
  - number: '85'
    text: |-
      Krachtens de Hinderwet voor inrichtingen als in [artikel 15, onder ][ref1], bedoeld verleende vergunningen worden
      geacht te zijn verleend op grond van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
        hoofdstuk: III
        afdeling: '2'
  - number: '87'
    text: De Röntgenstralenwet (*Stb.* 1931, 299) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel87
  - number: '88'
    text: 'Deze wet kan worden aangehaald als: Kernenergiewet.'
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel88
  - number: '89.1'
    text: |-
      [Hoofdstuk II van deze wet][ref1] treedt in werking met ingang van de dag na de datum van uitgifte van het
      *Staatsblad*, waarin zij wordt geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0002402
        hoofdstuk: II
  - number: '89.2'
    text: |-
      Haar onderscheidene overige bepalingen treden in werking op door Ons te bepalen tijdstippen. De voordrachten
      hiertoe worden Ons gedaan door Onze Ministers, wie het aangaat, de Centrale Raad gehoord.
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel89
