---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: kernenergiewet
regulatory_layer: WET
publication_date: '2010-01-21'
valid_from: '2003-05-23'
bwb_id: BWBR0002402
url: https://wetten.overheid.nl/BWBR0002402/2003-05-23
preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is op het gebied van de kernenergie en de ioniserende
    stralen een regeling te treffen, in het bijzonder ter bevordering van een goede ontwikkeling op het gebied van de
    vrijmaking van kernenergie en de aanwending van radioactieve stoffen en ioniserende stralen uitzendende toestellen,
    zomede ter bescherming tegen de hieraan verbonden gevaren;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel1
  - number: 1.1.a
    text: 'kernenergie: energie, vrijkomend bij splijting of versmelting van atoomkernen;'
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel1
  - number: 1.1.b
    text: |-
      splijtstoffen: stoffen, welke ten minste een bij algemene maatregel van bestuur te bepalen percentage uranium,
      plutonium, thorium of andere daarbij aangewezen elementen bevatten;
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel1
  - number: 1.1.c
    text: |-
      ertsen: ertsen die naar gewicht gerekend ten minste een tiende procent uranium of drie procent thorium bevatten en
      waarmee handelingen worden verricht wegens hun splijt- of kweekeigenschappen;
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel1
  - number: 1.1.d
    text: |-
      radioactieve stoffen: stoffen met uitzondering van splijtstoffen en ertsen, die in zodanige mate radionucliden
      bevatten dat zij, voorzover het de bescherming tegen ioniserende straling betreft, niet mogen worden verwaarloosd;
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel1
  - number: 1.1.e
    text: |-
      ioniserende straling: röntgen- en gammastraling, alsmede corpusculaire straling, die in staat is ionenvorming te
      veroorzaken;
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel1
  - number: 1.1.f
    text: 'toestel: toestel dat ioniserende straling kan uitzenden en geen radioactieve stof, splijtstof of erts bevat;'
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel1
  - number: 1.1.g
    text: 'bevoegd gezag: bestuursorgaan dat bevoegd is tot het geven van een beschikking.'
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel1
  - number: '1.2'
    text: |-
      De voordracht tot vaststelling, wijziging of intrekking van een algemene maatregel van bestuur als in het
      eerste lid, onder b, bedoeld wordt Ons gedaan door Onze Ministers van Volkshuisvesting, Ruimtelijke Ordening en
      Milieubeheer, van Economische Zaken en van Sociale Zaken en Werkgelegenheid.
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel1
  - number: '2'
    text: |-
      Het bij of krachtens deze wet bepaalde is mede van toepassing op een verkenningsonderzoek, het opsporen of het
      winnen van delfstoffen of aardwarmte, dan wel het opslaan van stoffen voorzover dit plaatsvindt op het continentaal
      plat, bedoeld in de [Mijnbouwwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014168
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0014168
  - number: '13.1'
    text: |-
      Er is een register, waarin worden ingeschreven de gegevens van splijtstoffen, ertsen en andere stoffen waaruit
      splijtstoffen kunnen worden verkregen en die naar gewicht gerekend ten minste een tiende procent uranium of drie
      procent thorium bevatten, waarvan overeenkomstig [artikel 14][ref1] aangifte is gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel14
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '14'
        hoofdstuk: III
        afdeling: '1'
  - number: '13.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur wordt de inrichting van het register geregeld en worden de gevallen
      aangewezen, waarin inlichtingen uit het register kunnen worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel13
  - number: '13.3'
    text: |-
      Onze Minister van Economische Zaken is belast met het beheer van het register en de verstrekking van inlichtingen
      daaruit.
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel13
  - number: '14.1'
    text: |-
      Ieder, die met inachtneming van deze wet splijtstoffen of ertsen of andere stoffen waaruit splijtstoffen kunnen
      worden verkregen en die naar gewicht gerekend ten minste een tiende procent uranium of drie procent thorium
      bevatten vervoert, voorhanden heeft, binnen of buiten Nederlands grondgebied brengt of doet brengen, dan wel zich
      daarvan ontdoet, is verplicht daaromtrent administratie te voeren en ten behoeve van de in [artikel 13][ref1]
      bedoelde inschrijving aangifte te doen, een en ander in bij algemene maatregel van bestuur te bepalen gevallen en
      overeenkomstig bij de maatregel te stellen regelen.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel13
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '13'
        hoofdstuk: III
        afdeling: '1'
  - number: '14.2'
    text: |-
      Ieder, die de aanwezigheid van ertsen of andere stoffen waaruit splijtstoffen kunnen worden verkregen en die
      naar gewicht gerekend ten minste een tiende procent uranium of drie procent thorium bevatten in de bodem heeft
      vastgesteld, is verplicht in bij algemene maatregel van bestuur te bepalen gevallen en overeenkomstig bij de
      maatregel te stellen regelen daarvan ten behoeve van de in [artikel 13][ref1] bedoelde inschrijving aangifte te
      doen.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel13
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '13'
        hoofdstuk: III
        afdeling: '1'
  - number: '15'
    text: 'Het is verboden zonder vergunning:'
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel15
  - number: 15.a
    text: |-
      splijtstoffen of ertsen te vervoeren, voorhanden te hebben, binnen of buiten Nederlands grondgebied te brengen of
      te doen brengen, dan wel zich daarvan te ontdoen;
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel15
  - number: 15.b
    text: |-
      een inrichting, waarin kernenergie kan worden vrijgemaakt, splijtstoffen kunnen worden vervaardigd, bewerkt of
      verwerkt, dan wel splijtstoffen worden opgeslagen, op te richten, inwerking te brengen, in werking te houden,
      buiten gebruik te stellen, te ontmantelen of te wijzigen;
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel15
  - number: 15.c
    text: |-
      een uitrusting, geschikt om een vaartuig of ander vervoermiddel door middel van kernenergie voort te bewegen,
      daarin aan te brengen of aangebracht te houden, dan wel zodanige daarin aangebrachte uitrusting in werking te
      brengen, in werking te houden of te wijzigen.
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel15
  - number: 15a
    text: |-
      Onze Ministers van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer, van Economische Zaken en van Sociale
      Zaken en Werkgelegenheid tezamen zijn, in overeenstemming met Onze Minister van Verkeer en Waterstaat indien
      het vervoer van splijtstoffen of ertsen, of lozing in oppervlaktewater betreft, met Onze Minister van Landbouw,
      Natuurbeheer en Visserij indien het lozing in oppervlaktewater of lozing in lucht betreft, en met Onze Minister
      van Volksgezondheid, Welzijn en Sport indien het medische stralingstoepassingen betreft, bevoegd te beslissen op de
      aanvraag om een vergunning als bedoeld in [artikel 15][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
        hoofdstuk: III
        afdeling: '2'
  - number: 15aa
    text: |-
      Indien een vergunning als bedoeld in [artikel 15, onder b][ref1], voor het wijzigen van een inrichting wordt
      aangevraagd en voor die inrichting al een of meer vergunningen krachtens deze wet zijn verleend, is artikel
      8.4, eerste, tweede en vierde lid, van de Wet milieubeheer van overeenkomstige toepassing. Het bevoegd gezag kan
      de rechten die de vergunninghouder aan de al eerder verleende vergunningen ontleende, niet wijzigen anders dan
      mogelijk zou zijn met toepassing van [artikel 18a][ref2] of [artikel 19][ref3] van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002402#Artikel18a
      [ref3]: https://wetten.overheid.nl/BWBR0002402#Artikel19
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel15aa
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
        hoofdstuk: III
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0002402
        artikel: 18a
        hoofdstuk: III
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0002402
        artikel: '19'
        hoofdstuk: III
        afdeling: '2'
  - number: 15b.1
    text: 'De vergunning kan slechts worden geweigerd in het belang van:'
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel15b
  - number: 15b.1.a
    text: de bescherming van mensen, dieren, planten en goederen;
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel15b
  - number: 15b.1.b
    text: de veiligheid van de staat;
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel15b
  - number: 15b.1.c
    text: de bewaring en bewaking van splijtstoffen en van ertsen;
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel15b
  - number: 15b.1.d
    text: de energievoorziening;
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel15b
  - number: 15b.1.e
    text: het zeker stellen van de betaling van de vergoeding, aan derden toekomende voor schade of letsel, hun toegebracht;
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel15b
  - number: 15b.1.f
    text: de nakoming van internationale verplichtingen.
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel15b
  - number: 15b.2
    text: |-
      Bij algemene maatregel van bestuur kunnen naast de in het eerste lid bedoelde belangen andere belangen worden
      aangewezen.
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel15b
  - number: 15b.3
    text: |-
      Indien Wij niet binnen drie maanden na het in werking treden van een algemene maatregel van bestuur als in het
      tweede lid bedoeld aan de Tweede Kamer der Staten-Generaal een voorstel van wet hebben doen toekomen tot wijziging
      van deze wet overeenkomstig die maatregel of indien zodanig voorstel wordt ingetrokken of verworpen, trekken Wij de
      maatregel onverwijld in.
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel15b
  - number: 15c.1
    text: |-
      In een vergunning wordt duidelijk aangegeven waarop zij betrekking heeft. De aanvraag om de vergunning maakt deel
      uit van de vergunning, voor zover dat in de vergunning is aangegeven.
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel15c
  - number: 15c.2
    text: |-
      Een vergunning kan ter bescherming van de bij of krachtens [artikel 15][ref1] aangewezen belangen onder beperkingen
      worden verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15b
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel15c
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: 15b
        hoofdstuk: III
        afdeling: '2'
  - number: 15c.3
    text: |-
      Aan een vergunning worden, met inachtneming van de dienaangaande bij algemene maatregel van bestuur gestelde
      regels, de voorschriften verbonden, die nodig zijn ter bescherming van de bij of krachtens [artikel 15 ][ref1]
      aangewezen belangen. Voor zover door het verbinden van voorschriften aan de vergunning de nadelige gevolgen van
      de betrokken activiteit voor mensen, dieren, planten en goederen niet kunnen worden voorkomen, worden daaraan de
      voorschriften verbonden, die de grootst mogelijke bescherming bieden tegen die gevolgen, tenzij dat redelijkerwijs
      niet kan worden gevergd.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15b
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel15c
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: 15b
        hoofdstuk: III
        afdeling: '2'
  - number: 15c.4
    text: |-
      Voor zover ten aanzien van de betrokken splijtstoffen, ertsen, inrichtingen of uitrustingen regels gelden krachtens
      [artikel 21][ref1], kunnen de voorschriften daarvan alleen afwijken, voor zover dat bij die regels is toegestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel21
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel15c
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '21'
        hoofdstuk: III
        afdeling: '2'
  - number: 15d.1
    text: |-
      De aan een vergunning te verbinden voorschriften geven de doeleinden aan, die de vergunninghouder ter bescherming
      van de bij of krachtens [artikel 15][ref1] aangewezen belangen op een door hem te bepalen wijze dient te
      verwezenlijken.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15b
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel15d
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: 15b
        hoofdstuk: III
        afdeling: '2'
  - number: 15d.2
    text: |-
      Voor zover dit naar het oordeel van het bevoegd gezag noodzakelijk is, kunnen de voorschriften inhouden dat daarbij
      aangegeven middelen ter bescherming van de bij of krachtens [artikel 15][ref1] aangewezen belangen moeten worden
      toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15b
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel15d
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: 15b
        hoofdstuk: III
        afdeling: '2'
  - number: 15e.1
    text: |-
      Aan een vergunning kunnen ter bescherming van de bij of krachtens [artikel 15][ref1] aangewezen belangen andere dan
      de in [artikel 15][ref2] bedoelde voorschriften worden verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15b
      [ref2]: https://wetten.overheid.nl/BWBR0002402#Artikel15d
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel15e
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: 15b
        hoofdstuk: III
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0002402
        artikel: 15d
        hoofdstuk: III
        afdeling: '2'
  - number: 15e.2
    text: |-
      Een voorschrift kan de verplichting inhouden dat met betrekking tot in het voorschrift geregelde, daarbij
      aangegeven onderwerpen moet worden voldaan aan nadere eisen die door een bij het voorschrift aangewezen
      bestuursorgaan worden gesteld. Bij het voorschrift kan worden aangegeven hoe die eisen door het betrokken
      bestuursorgaan moeten worden bekendgemaakt. Bij het stellen van een nadere eis wordt het tijdstip bepaald, waarop
      ten aanzien van die eis de verplichting ingaat.
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel15e
  - number: '16.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regelen gesteld betreffende de wijze, waarop de aanvraag om
      een vergunning dient te geschieden, en de gegevens, welke van de aanvrager kunnen worden verlangd.
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel16
  - number: '16.2'
    text: |-
      [Artikel 8.5, tweede en derde lid, van de Wet milieubeheer][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
  - number: '17.1'
    text: |-
      Met betrekking tot een vergunning krachtens [artikel 15][ref1] zijn de
      [paragrafen 3.5.2 tot en met 3.5.5 van de Algemene wet bestuursrecht][ref2] alsmede de [paragrafen 8.1.3.2][ref3]
      en [8.1.3.3][ref4] en [afdeling 13.2 van de Wet milieubeheer][ref5] van overeenkomstige toepassing, met dien
      verstande dat daarbij hetgeen in de [artikelen 17][ref6] van deze wet is bepaald, in acht wordt genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Paragraaf3.5.2
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Paragraaf8.1.3.2
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Paragraaf8.1.3.3
      [ref5]: https://wetten.overheid.nl/BWBR0003245#Afdeling13.2
      [ref6]: https://wetten.overheid.nl/BWBR0002402#Artikel17a
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
        hoofdstuk: III
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005537
        paragraaf: 3.5.2
      - id: ref3
        bwb_id: BWBR0003245
        paragraaf: 8.1.3.2
      - id: ref4
        bwb_id: BWBR0003245
        paragraaf: 8.1.3.3
      - id: ref5
        bwb_id: BWBR0003245
        afdeling: '13.2'
      - id: ref6
        bwb_id: BWBR0002402
        artikel: 17a
        hoofdstuk: III
        afdeling: '2'
  - number: '17.2'
    text: |-
      In afwijking van het eerste lid zijn de in dat lid genoemde onderdelen van de [Wet milieubeheer][ref1] en van de
      [Algemene wet bestuursrecht][ref2] niet van toepassing met betrekking tot de totstandkoming van beschikkingen op de
      aanvraag om een vergunning krachtens:


      [ref1]: https://wetten.overheid.nl/BWBR0003245
      [ref2]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0003245
      - id: ref2
        bwb_id: BWBR0005537
  - number: 17.2.a
    text: |-
      [artikel 15, onder ][ref1], voor het vervoeren, het voorhanden hebben bij opslag in verband met het vervoer, dan
      wel het binnen of buiten Nederlands grondgebied brengen of doen brengen van splijtstoffen of ertsen;


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
        hoofdstuk: III
        afdeling: '2'
  - number: 17.2.b
    text: |-
      [artikel 15, onder ][ref1], voor het voorhanden hebben van splijtstoffen in een inrichting of uitrusting, ten
      aanzien waarvan een vergunning krachtens [artikel 15, onder ][ref2], is vereist, dan wel voor het zich ontdoen van
      splijtstoffen die rechtstreeks afkomstig zijn uit een zodanige inrichting of uitrusting;


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002402#Artikel15
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
        hoofdstuk: III
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0002402
        artikel: '15'
        hoofdstuk: III
        afdeling: '2'
  - number: 17.2.c
    text: |-
      [artikel 15, onder ][ref1], voor het voorhanden hebben of zich ontdoen van splijtstoffen in gevallen als bedoeld in
      het derde lid;


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
        hoofdstuk: III
        afdeling: '2'
  - number: 17.2.d
    text: |-
      [artikel 15, onder ][ref1], indien al eerder een vergunning met betrekking tot dezelfde inrichting,
      onderscheidenlijk uitrusting was verleend en naar het oordeel van Onze Ministers van Volkshuisvesting, Ruimtelijke
      Ordening en Milieubeheer, van Economische Zaken en van Sociale Zaken en Werkgelegenheid, alsmede van Onze Ministers
      wie het mede aangaat, niet te verwachten is dat door gebruikmaking van de gevraagde vergunning nadeliger gevolgen
      voor mensen, planten, dieren en goederen kunnen worden veroorzaakt dan bij de eerder verleende vergunning in
      aanmerking zijn genomen;


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
        hoofdstuk: III
        afdeling: '2'
  - number: 17.2.e
    text: |-
      [artikel 15, onder ][ref1], in gevallen waarin de uitrusting slechts buiten Nederland in werking zal worden
      gebracht of gehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
        hoofdstuk: III
        afdeling: '2'
  - number: '17.3'
    text: 'Gevallen als bedoeld in het tweede lid, onder *c*, zijn die gevallen:'
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel17
  - number: 17.3.a
    text: 'waarin het voorhanden hebben van splijtstoffen of het zich daarvan ontdoen geschiedt:'
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel17
  - number: 17.3.a.1°
    text: in een voertuig of aan boord van een vaartuig of van een luchtvaartuig;
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel17
  - number: 17.3.a.2°
    text: |-
      op steeds wisselende plaatsen, indien die gevallen behoren tot een bij algemene
      maatregel van bestuur aangegeven categorie waarin het belang van de toepassing van de
      [paragrafen 3.5.2 tot en met 3.5.5 van de Algemene wet bestuursrecht][ref1] niet opweegt tegen de daaraan verbonden
      bezwaren;


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Paragraaf3.5.2
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0005537
        paragraaf: 3.5.2
  - number: 17.3.a.3°
    text: |-
      indien al eerder een overeenkomstige vergunning met betrekking tot dezelfde plaats was verleend aan de aanvrager
      of aan degene wiens vergunning ingevolge [artikel 70][ref1] voor hem geldt, en naar het oordeel van Onze Ministers
      van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer, van Economische Zaken en van Sociale Zaken en
      Werkgelegenheid niet te verwachten is dat door gebruikmaking van de gevraagde vergunning nadeliger gevolgen voor
      mensen, dieren, planten en goederen kunnen worden veroorzaakt dan bij de eerder verleende vergunning in aanmerking
      zijn genomen;


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel70
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '70'
        hoofdstuk: IX
  - number: 17.3.b
    text: |-
      waarin bij algemene maatregel van bestuur aangegeven splijtstoffen op een daarbij aan te geven wijze hetzij zijn
      opgenomen in vaste stoffen die geen ioniserende straling uitzenden, hetzij zijn omgeven door een omhulsel;
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel17
  - number: 17.3.c
    text: |-
      behorende tot een bij algemene maatregel van bestuur aangewezen categorie, waarin, gezien de wijze
      waarop de daarbij aangegeven splijtstoffen worden toegepast, het belang van de toepassing van de
      [paragrafen 3.5.2 tot en met 3.5.5 van de Algemene wet bestuursrecht][ref1] niet opweegt tegen de daaraan verbonden
      bezwaren.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Paragraaf3.5.2
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0005537
        paragraaf: 3.5.2
  - number: 17a.1
    text: |-
      Bij algemene maatregel van bestuur worden de bestuursorganen aangewezen, die - anders dan als adviseurs -
      overeenkomstig de [Algemene wet bestuursrecht][ref1] bij de totstandkoming van de beschikking op de aanvraag worden
      betrokken. Bij de maatregel kunnen bestuursorganen worden aangewezen, die in de gelegenheid worden gesteld advies
      uit te brengen over het ontwerp van de beschikking op de aanvraag om een vergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0005537
  - number: 17a.2
    text: |-
      Bedenkingen tegen het ontwerp van de beschikking op de aanvraag kunnen op grond van
      [afdeling 3.5 van de Algemene wet bestuursrecht][ref1] door anderen dan de krachtens het eerste lid aangewezen
      bestuursorganen slechts worden ingebracht indien zij zijn ontleend aan vrees voor nadelige gevolgen voor mensen,
      dieren, planten en goederen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.5
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.5'
  - number: '18'
    text: |-
      Op een voor een inrichting verleende vergunning als bedoeld in [artikel 15, onder b][ref1], zijn de regels gesteld
      bij of krachtens [artikel 8.19, tweede tot en met zevende lid, van de Wet milieubeheer][ref2] van overeenkomstige
      toepassing, met dien verstande dat in plaats van «de [artikelen 8.22][ref3], [8.23][ref4] of[ 8.25][ref5]» wordt
      gelezen: [artikel 18a van de Kernenergiewet][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref5]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref6]: https://wetten.overheid.nl/BWBR0002402#Artikel18a
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
        hoofdstuk: III
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '8'
      - id: ref4
        bwb_id: BWBR0003245
        artikel: '8'
      - id: ref5
        bwb_id: BWBR0003245
        artikel: '8'
      - id: ref6
        bwb_id: BWBR0002402
        artikel: 18a
        hoofdstuk: III
        afdeling: '2'
  - number: 18a.1
    text: |-
      Het bevoegd gezag beziet regelmatig of de beperkingen waaronder een vergunning is verleend, en de voorschriften
      die aan een vergunning zijn verbonden, nog toereikend zijn gezien de ontwikkelingen op het gebied van de technische
      mogelijkheden tot bescherming van mensen, dieren, planten en goederen.
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel18a
  - number: 18a.2
    text: |-
      Het bevoegd gezag wijzigt de beperkingen waaronder de vergunning is verleend en de voorschriften die daaraan zijn
      verbonden, vult deze aan of trekt ze in, dan wel brengt alsnog beperkingen aan, of verbindt alsnog voorschriften
      aan de vergunning, voor zover blijkt dat de nadelige gevolgen die de betrokken activiteit voor mensen, dieren,
      planten en goederen veroorzaakt, gezien de ontwikkeling van de technische mogelijkheden tot bescherming daarvan
      verder kunnen worden beperkt.
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel18a
  - number: 18a.3
    text: |-
      Bij algemene maatregel van bestuur kunnen in het belang van de bescherming van mensen, dieren, planten en goederen
      regels worden gesteld met betrekking tot de wijze waarop het eerste lid wordt toegepast met betrekking tot daarbij
      aangewezen categorieën van handelingen. Bij de maatregel kan worden bepaald dat daarbij gestelde regels slechts
      gelden in daarbij aangegeven categorieën van gevallen.
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel18a
  - number: 18a.4
    text: |-
      Met betrekking tot de beslissing ter zake en de inhoud van die beperkingen en voorschriften zijn de
      [artikelen 15][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15b
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel18a
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: 15b
        hoofdstuk: III
        afdeling: '2'
  - number: '19.1'
    text: |-
      Het bevoegd gezag kan beperkingen waaronder een vergunning is verleend, en voorschriften die daaraan zijn
      verbonden, wijzigen, aanvullen of intrekken, dan wel alsnog beperkingen aanbrengen of voorschriften aan een
      vergunning verbinden ter bescherming van de bij of krachtens [artikel 15][ref1] aangewezen belangen.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15b
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: 15b
        hoofdstuk: III
        afdeling: '2'
  - number: '19.2'
    text: |-
      Een ieder, met uitzondering van de vergunninghouder, kan het bevoegd gezag verzoeken een vergunning in het belang
      van de bescherming van mensen, dieren, planten en goederen met toepassing van het eerste lid te wijzigen.
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel19
  - number: '19.3'
    text: |-
      Op aanvraag van de vergunninghouder kan het bevoegd gezag beperkingen waaronder een vergunning is verleend, en
      voorschriften die daaraan zijn verbonden, wijzigen, aanvullen of intrekken, dan wel alsnog beperkingen aanbrengen
      of voorschriften aan een vergunning verbinden.
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel19
  - number: '19.4'
    text: |-
      In een geval als bedoeld in [artikel 15][ref1], trekt het bevoegd gezag zo spoedig mogelijk nadat de betrokken
      algemene maatregel van bestuur is ingetrokken, de ingevolge die maatregel aan een vergunning verbonden
      voorschriften in. Tot het tijdstip waarop de beschikking tot intrekking van kracht wordt, blijven de voorschriften
      gelden.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15b
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: 15b
        hoofdstuk: III
        afdeling: '2'
  - number: '20.1'
    text: |-
      Met betrekking tot een beschikking krachtens [artikel 18a, tweede lid][ref1], of
      [artikel 19, eerste of derde lid][ref2], zijn - tenzij het een geval betreft als bedoeld in
      [artikel 17, tweede lid][ref3] - de [paragrafen 3.5.2 tot en met 3.5.5 van de Algemene wet bestuursrecht][ref4]
      alsmede de [paragrafen 8.1.3.2][ref5] en [8.1.3.3][ref6] en [afdeling 13.2 van de Wet milieubeheer][ref7]
      van overeenkomstige toepassing. Met betrekking tot een beschikking krachtens [artikel 19, tweede lid][ref8],
      zijn - tenzij het een geval betreft als bedoeld in [artikel 17, tweede lid][ref9] -
      [paragraaf 3.5.6 van de Algemene wet bestuursrecht][ref10] alsmede de [paragrafen 8.1.3.2][ref11] en
      [8.1.3.3][ref12] en [afdeling 13.2 van de Wet milieubeheer][ref13] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel18a
      [ref2]: https://wetten.overheid.nl/BWBR0002402#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0002402#Artikel17
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Paragraaf3.5.2
      [ref5]: https://wetten.overheid.nl/BWBR0003245#Paragraaf8.1.3.2
      [ref6]: https://wetten.overheid.nl/BWBR0003245#Paragraaf8.1.3.3
      [ref7]: https://wetten.overheid.nl/BWBR0003245#Afdeling13.2
      [ref8]: https://wetten.overheid.nl/BWBR0002402#Artikel19
      [ref9]: https://wetten.overheid.nl/BWBR0002402#Artikel17
      [ref10]: https://wetten.overheid.nl/BWBR0005537#Paragraaf3.5.6
      [ref11]: https://wetten.overheid.nl/BWBR0003245#Paragraaf8.1.3.2
      [ref12]: https://wetten.overheid.nl/BWBR0003245#Paragraaf8.1.3.3
      [ref13]: https://wetten.overheid.nl/BWBR0003245#Afdeling13.2
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: 18a
        hoofdstuk: III
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0002402
        artikel: '19'
        hoofdstuk: III
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0002402
        artikel: '17'
        hoofdstuk: III
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0005537
        paragraaf: 3.5.2
      - id: ref5
        bwb_id: BWBR0003245
        paragraaf: 8.1.3.2
      - id: ref6
        bwb_id: BWBR0003245
        paragraaf: 8.1.3.3
      - id: ref7
        bwb_id: BWBR0003245
        afdeling: '13.2'
      - id: ref8
        bwb_id: BWBR0002402
        artikel: '19'
        hoofdstuk: III
        afdeling: '2'
      - id: ref9
        bwb_id: BWBR0002402
        artikel: '17'
        hoofdstuk: III
        afdeling: '2'
      - id: ref10
        bwb_id: BWBR0005537
        paragraaf: 3.5.6
      - id: ref11
        bwb_id: BWBR0003245
        paragraaf: 8.1.3.2
      - id: ref12
        bwb_id: BWBR0003245
        paragraaf: 8.1.3.3
      - id: ref13
        bwb_id: BWBR0003245
        afdeling: '13.2'
  - number: '20.2'
    text: |-
      Indien een verzoek wordt gedaan als bedoeld in [artikel 19, tweede lid][ref1], stelt het bevoegd gezag de houder
      van de betrokken vergunning daarvan in kennis. Deze wordt voor zover zijn belang dat vordert, mede als verzoeker
      beschouwd.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel19
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '19'
        hoofdstuk: III
        afdeling: '2'
  - number: 20a.1
    text: |-
      Het bevoegd gezag kan de vergunning intrekken indien dat ter bescherming van de bij of krachtens [artikel 15][ref1]
      aangewezen belangen noodzakelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15b
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel20a
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: 15b
        hoofdstuk: III
        afdeling: '2'
  - number: 20a.2
    text: |-
      Met betrekking tot de totstandkoming van een beschikking krachtens het eerste lid, zijn
      [paragraaf 3.5.6 van de Algemene wet bestuursrecht][ref1] alsmede de [paragrafen 8.1.3.2][ref2] en [8.1.3.3][ref3]
      en [afdeling 13.2 van de Wet milieubeheer][ref4] van overeenkomstige toepassing, tenzij het een geval betreft als
      bedoeld in [artikel 17, tweede lid][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Paragraaf3.5.6
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Paragraaf8.1.3.2
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Paragraaf8.1.3.3
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Afdeling13.2
      [ref5]: https://wetten.overheid.nl/BWBR0002402#Artikel17
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel20a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        paragraaf: 3.5.6
      - id: ref2
        bwb_id: BWBR0003245
        paragraaf: 8.1.3.2
      - id: ref3
        bwb_id: BWBR0003245
        paragraaf: 8.1.3.3
      - id: ref4
        bwb_id: BWBR0003245
        afdeling: '13.2'
      - id: ref5
        bwb_id: BWBR0002402
        artikel: '17'
        hoofdstuk: III
        afdeling: '2'
  - number: '21.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen ter bescherming van de bij of krachtens [artikel 15][ref1]
      aangewezen belangen regels worden gesteld met betrekking tot daartoe bij de maatregel aangewezen categorieën van
      splijtstoffen, ertsen, inrichtingen of uitrustingen dan wel onderdelen van inrichtingen of uitrustingen. Bij de
      maatregel kan worden bepaald dat daarbij gestelde regels slechts gelden in daarbij aangegeven categorieën van
      gevallen.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15b
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: 15b
        hoofdstuk: III
        afdeling: '2'
  - number: '21.2'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat de bij [artikel 15][ref1] gestelde verboden in daarbij
      aangewezen categorieën van gevallen niet gelden met betrekking tot splijtstoffen, ertsen, inrichtingen of
      uitrustingen, behorende tot een bij die maatregel aangewezen categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
        hoofdstuk: III
        afdeling: '2'
  - number: '21.3'
    text: |-
      Ten aanzien van bij de regels te stellen voorschriften zijn de
      [artikelen 8.12 tot en met 8.16 van de Wet milieubeheer][ref1] van overeenkomstige toepassing, met dien verstande
      dat, bij toepassing van het tweede lid, het stellen van financiële zekerheid slechts kan worden voorgeschreven
      in de vorm van het sluiten van een verzekering tegen aansprakelijkheid voor schade, voortvloeiend uit de nadelige
      gevolgen voor de bij of krachtens [artikel 15][ref2] aangewezen belangen, die de inrichting veroorzaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002402#Artikel15b
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0002402
        artikel: 15b
        hoofdstuk: III
        afdeling: '2'
  - number: '21.4'
    text: |-
      Indien bij een maatregel krachtens het eerste lid tevens toepassing wordt gegeven aan het tweede lid, kan de
      verplichting worden opgelegd tot het melden van de handelingen ten aanzien waarvan de bij [artikel 15][ref1]
      gestelde verboden niet gelden.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
        hoofdstuk: III
        afdeling: '2'
  - number: '21.5'
    text: |-
      De [artikelen 8.40, tweede lid][ref1], [8.41, tweede, derde en vierde lid][ref2] en
      [8.42 van de Wet milieubeheer][ref3] zijn van overeenkomstige toepassing, met dien verstande dat onder "Onze
      Minister" wordt verstaan: Onze Ministers van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer, van
      Economische Zaken en van Sociale Zaken en Werkgelegenheid te zamen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '8'
  - number: '22.1'
    text: |-
      Ieder, die zonder daartoe bevoegd te zijn splijtstoffen of ertsen, dan wel stoffen, waarvan hij redelijkerwijs moet
      vermoeden, dat het splijtstoffen of ertsen zijn, onder zich heeft of krijgt, is verplicht daarvan terstond aangifte
      te doen bij de burgemeester van de gemeente, waar die goederen zich bevinden.
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel22
  - number: '22.2'
    text: |-
      De burgemeester geeft van de gedane aangifte onverwijld kennis aan een der krachtens
      [artikel 58, eerste lid][ref1], aangewezen ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel58
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '58'
        hoofdstuk: VIII
  - number: '22.3'
    text: |-
      De krachtens [artikel 58, eerste lid][ref1], aangewezen ambtenaren zijn bevoegd met betrekking tot ongeoorloofd
      aanwezig bevonden splijtstoffen en ertsen en de voorwerpen, welke tot hun verpakking of berging dienen of hebben
      gediend, bestuursdwang toe te passen.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel58
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '58'
        hoofdstuk: VIII
  - number: '22.4'
    text: |-
      Door toepassing van bestuursdwang in bezit genomen goederen worden overgedragen aan een door Ons, op voordracht
      van Onze Ministers van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer, van Economische Zaken en van
      Sociale Zaken en Werkgelegenheid, aan te wijzen instelling of persoon. Deze geeft van de overdracht kennis in de
      *Staatscourant* en een of meer nieuwsbladen.
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel22
  - number: '23.1'
    text: |-
      Hij, die bevoegd is de in bezit genomen splijtstoffen of ertsen onder zich te hebben, kan binnen drie maanden na de
      in [artikel 22, vierde lid][ref1], bedoelde kennisgeving de afgifte van de in bezit genomen goederen vorderen bij
      een verzoekschrift, te richten tot de arrondissementsrechtbank, binnen welker rechtsgebied de inbezitneming heeft
      plaats gevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel22
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '22'
        hoofdstuk: III
        afdeling: '3'
  - number: '23.2'
    text: |-
      De rechtbank behandelt het verzoek overeenkomstig de bepalingen van de zesde afdeling van Titel I van het Eerste
      Boek van het Wetboek van Strafvordering en beslist zo spoedig mogelijk bij met redenen omklede beschikking.
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel23
  - number: '24.1'
    text: |-
      Ingeval niet binnen de in [artikel 23, eerste lid][ref1], genoemde termijn een verzoekschrift is ingediend
      of ingeval een krachtens dat lid gedaan verzoek ongegrond is verklaard, vervallen alle rechten op de in bezit
      genomen goederen aan de staat, met uitzondering van de rechten, welke ingevolge internationale overeenkomsten of
      besluiten van volkenrechtelijke organisaties daarop rusten. De krachtens [artikel 22, vierde lid][ref2], aangewezen
      instelling of persoon geeft hiervan kennis in de *Staatscourant* en een of meer nieuwsbladen.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0002402#Artikel22
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '23'
        hoofdstuk: III
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0002402
        artikel: '22'
        hoofdstuk: III
        afdeling: '3'
  - number: '24.2'
    text: |-
      Hij, wiens rechten ingevolge het eerste lid aan de staat zijn vervallen, kan binnen een jaar na de krachtens het
      eerste lid gedane kennisgeving deze rechten van de staat terugvorderen.
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel24
  - number: '26.1'
    text: |-
      De voordracht tot vaststelling, wijziging of intrekking van een algemene maatregel van bestuur als in
      [dit hoofdstuk][ref1] bedoeld wordt Ons gedaan, indien het betreft:


      [ref1]: https://wetten.overheid.nl/BWBR0002402#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0002402
        hoofdstuk: III
  - number: 26.1.a
    text: |-
      een maatregel als in [artikel 13][ref1] bedoeld: door Onze Minister van Economische Zaken;


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel13
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '13'
        hoofdstuk: III
        afdeling: '1'
  - number: 26.1.b
    text: |-
      een maatregel als in [artikel 14][ref1] bedoeld: door Onze Minister van Economische Zaken;


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel14
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '14'
        hoofdstuk: III
        afdeling: '1'
  - number: 26.1.c
    text: |-
      een maatregel als in [artikel 15][ref1] bedoeld: door Onze Ministers, wie het aangaat;


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15b
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: 15b
        hoofdstuk: III
        afdeling: '2'
  - number: 26.1.d
    text: |-
      een maatregel als in [artikel 16][ref1], [17][ref2] of [21][ref3] bedoeld: door Onze Ministers van
      Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer, van Economische Zaken en van Sociale Zaken en
      Werkgelegenheid, met dien verstande dat, indien de maatregel betrekking heeft op het vervoeren van splijtstoffen of
      ertsen, de voordracht mede wordt gedaan door Onze Minister van Verkeer en Waterstaat.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0002402#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0002402#Artikel21
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '16'
        hoofdstuk: III
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0002402
        artikel: '17'
        hoofdstuk: III
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0002402
        artikel: '21'
        hoofdstuk: III
        afdeling: '2'
  - number: '26.2'
    text: |-
      Ten aanzien van bij een algemene maatregel van bestuur, vastgesteld krachtens [artikel 14][ref1], geregelde
      onderwerpen, kan Onze Minister van Economische Zaken nadere regels stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel14
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '14'
        hoofdstuk: III
        afdeling: '1'
  - number: '28'
    text: |-
      Ieder die radioactieve stoffen bereidt, vervoert, voorhanden heeft, toepast, binnen of buiten Nederlands
      grondgebied brengt of doet brengen, dan wel zich daarvan ontdoet, is verplicht daaromtrent een administratie te
      voeren, overeenkomstig bij of krachtens algemene maatregel van bestuur gestelde regels.
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel28
  - number: '29.1'
    text: |-
      Het is verboden zonder vergunning bij of krachtens algemene maatregel van bestuur aan te wijzen radioactieve
      stoffen of in daarbij aan te wijzen gevallen radioactieve stoffen te bereiden, te vervoeren, voorhanden te hebben,
      toe te passen, binnen of buiten Nederlands grondgebied te brengen of te doen brengen, dan wel zich daarvan te
      ontdoen.
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel29
  - number: '29.2'
    text: |-
      Voor zover het bij of krachtens het eerste lid bepaalde afwijkt van bij of krachtens andere wetten gestelde
      regelen, blijven deze buiten toepassing.
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel29
  - number: 29a.1
    text: |-
      De [paragrafen 3.5.2 tot en met 3.5.5 van de Algemene wet bestuursrecht][ref1] en
      [afdeling 13.2 van de Wet milieubeheer][ref2] zijn van toepassing met betrekking tot de totstandkoming van de
      beschikking op de aanvraag om een vergunning krachtens [artikel 29][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Paragraaf3.5.2
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Afdeling13.2
      [ref3]: https://wetten.overheid.nl/BWBR0002402#Artikel29
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel29a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        paragraaf: 3.5.2
      - id: ref2
        bwb_id: BWBR0003245
        afdeling: '13.2'
      - id: ref3
        bwb_id: BWBR0002402
        artikel: '29'
        hoofdstuk: IV
        afdeling: '1'
  - number: 29a.2
    text: |-
      In afwijking van het eerste lid zijn de [paragrafen 3.5.2 tot en met 3.5.5 van de Algemene wet bestuursrecht][ref1]
      en [afdeling 13.2 van de Wet milieubeheer][ref2] niet van toepassing met betrekking tot de totstandkoming van de
      beschikking op de aanvraag om een vergunning krachtens [artikel 29][ref3]:


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Paragraaf3.5.2
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Afdeling13.2
      [ref3]: https://wetten.overheid.nl/BWBR0002402#Artikel29
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel29a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        paragraaf: 3.5.2
      - id: ref2
        bwb_id: BWBR0003245
        afdeling: '13.2'
      - id: ref3
        bwb_id: BWBR0002402
        artikel: '29'
        hoofdstuk: IV
        afdeling: '1'
  - number: 29a.2.a
    text: |-
      voor het vervoeren, het voorhanden hebben bij opslag in verband met het vervoer, het binnen of buiten Nederlands
      grondgebied brengen of doen brengen van radioactieve stoffen, dan wel het voorhanden hebben of zich ontdoen van
      zodanige stoffen die zullen ontstaan tijdens het gebruik van splijtstoffen in een inrichting of uitrusting, ten
      aanzien waarvan een vergunning krachtens [artikel 15, onder b of c][ref1], is vereist;


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel29a
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
        hoofdstuk: III
        afdeling: '2'
  - number: 29a.2.b
    text: |-
      voor het bereiden, voorhanden hebben, toepassen of zich ontdoen van radioactieve stoffen in overeenkomstige
      gevallen als bedoeld in [artikel 17, derde lid][ref1], met dien verstande dat de in dat lid, onder a, 3°, bedoelde
      bevoegdheden worden uitgeoefend door Onze Ministers van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer, van
      Sociale Zaken en Werkgelegenheid en van Volksgezondheid, Welzijn en Sport;


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel17
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel29a
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '17'
        hoofdstuk: III
        afdeling: '2'
  - number: 29a.2.c
    text: |-
      voor medische toepassingen, indien naar het oordeel van Onze Ministers van Volkshuisvesting, Ruimtelijke Ordening
      en Milieubeheer, van Sociale Zaken en Werkgelegenheid en van Volksgezondheid, Welzijn en Sport het belang van de
      patiënt onverwijlde toepassing van die stoffen vereist.
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel29a
  - number: 29a.3
    text: |-
      De [artikelen 15c, eerste lid][ref1], [16][ref2] en [17a][ref3] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15c
      [ref2]: https://wetten.overheid.nl/BWBR0002402#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0002402#Artikel17a
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel29a
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: 15c
        hoofdstuk: III
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0002402
        artikel: '16'
        hoofdstuk: III
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0002402
        artikel: 17a
        hoofdstuk: III
        afdeling: '2'
  - number: '30'
    text: |-
      Onze Ministers van Sociale Zaken en Werkgelegenheid en van Volkshuisvesting, Ruimtelijke Ordening en
      Milieubeheer zijn, in overeenstemming met Onze Minister van Volksgezondheid, Welzijn en Sport indien het
      medische stralingstoepassingen betreft, met Onze Minister van Economische Zaken indien het toepassingen betreft
      in het kader van activiteiten in de zin van de [Mijnwet 1903][ref1] of de [Mijnwet continentaal plat][ref2],
      met Onze Minister van Landbouw, Natuurbeheer en Visserij indien het lozing in oppervlaktewater of lozing in
      lucht betreft, en met Onze Minister van Verkeer en Waterstaat indien het het vervoer van radioactieve stoffen
      of lozing in oppervlaktewater betreft, bevoegd te beslissen op de aanvraag om een vergunning als bedoeld in
      [artikel 29, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0001870
      [ref2]: https://wetten.overheid.nl/BWBR0002504
      [ref3]: https://wetten.overheid.nl/BWBR0002402#Artikel29
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0001870
      - id: ref2
        bwb_id: BWBR0002504
      - id: ref3
        bwb_id: BWBR0002402
        artikel: '29'
        hoofdstuk: IV
        afdeling: '1'
  - number: '31.1'
    text: |-
      Aan een vergunning worden met inachtneming van de dienaangaande bij algemene maatregel van bestuur gestelde regelen
      de met het oog op de bescherming van mensen, dieren, planten en goederen nodige voorschriften verbonden. Voor
      zover door het verbinden van voorschriften aan de vergunning de nadelige gevolgen van de betrokken activiteit voor
      mensen, dieren, planten en goederen niet kunnen worden voorkomen, worden daaraan de voorschriften verbonden, die de
      grootst mogelijke bescherming bieden tegen die gevolgen, tenzij dat redelijkerwijs niet kan worden gevergd.
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel31
  - number: '31.2'
    text: |-
      Zodanige voorschriften kunnen de verplichting inhouden te voldoen aan door bestuursorganen, die bij het voorschrift
      zijn aangewezen, gestelde nadere eisen. Bij het stellen van zodanige eis wordt tevens het tijdstip bepaald, waarop
      ten aanzien van die eis de verplichting ingaat.
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel31
  - number: '31.3'
    text: Een vergunning kan ter bescherming van de in het eerste lid genoemde belangen onder beperkingen worden verleend.
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel31
  - number: '31.4'
    text: |-
      De [artikelen 18][ref1] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel18a
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: 18a
        hoofdstuk: III
        afdeling: '2'
  - number: '32.1'
    text: |-
      Onverminderd het in [artikel 29][ref1] bepaalde kunnen bij of krachtens algemene maatregel van bestuur met het oog
      op de bescherming van mensen, dieren, planten en goederen regelen worden gesteld betreffende radioactieve stoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel29
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '29'
        hoofdstuk: IV
        afdeling: '1'
  - number: '32.2'
    text: 'Hiertoe kunnen behoren:'
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel32
  - number: 32.2.a
    text: |-
      regelen, welke voorwaarden inhouden, waaraan degene, die bij de maatregel aangewezen radioactieve stoffen bereidt,
      vervoert, voorhanden heeft of toepast, dan wel zich daarvan ontdoet, moet voldoen;
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel32
  - number: 32.2.b
    text: |-
      regelen betreffende de plaatsen, waar, de wijze, waarop en de omstandigheden, waaronder bij de maatregel aangewezen
      radioactieve stoffen mogen worden bereid, vervoerd, voorhanden gehouden of toegepast, en de wijze, waarop en de
      omstandigheden, waaronder men zich van deze stoffen mag ontdoen;
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel32
  - number: 32.2.c
    text: |-
      regelen, welke voorwaarden inhouden, waaraan vervoermiddelen, waarmede bij de maatregel aangewezen radioactieve
      stoffen worden vervoerd, moeten voldoen.
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel32
  - number: '32.3'
    text: |-
      Een algemene maatregel van bestuur, waarbij regelen als in het tweede lid, onder a, b of c, bedoeld worden gesteld,
      kan tevens de verplichting inhouden te voldoen aan door bestuursorganen, die bij de maatregel zijn aangewezen, aan
      de betrokkene gestelde nadere eisen. Bij het stellen van zodanige eis wordt tevens het tijdstip bepaald, waarop ten
      aanzien van die eis de verplichting ingaat.
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel32
  - number: '32.4'
    text: |-
      Bij of krachtens de algemene maatregel van bestuur, bedoeld in het eerste lid, kan een verplichting worden opgelegd
      tot het melden van bij die maatregel aangewezen handelingen.
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel32
  - number: '32.5'
    text: |-
      Ten aanzien van het bepaalde in het vierde lid, zijn de [artikelen 8.40, tweede lid][ref1],
      [8.41, tweede, derde en vierde lid][ref2], en [8.42 van de Wet milieubeheer][ref3] van overeenkomstige toepassing,
      met dien verstande dat met betrekking tot de toepassing van [artikel 8.41, derde lid, van die wet](onbekend)
      onder «Onze Minister» wordt verstaan: Onze Ministers van Sociale Zaken en Werkgelegenheid en van Volkshuisvesting,
      Ruimtelijke Ordening en Milieubeheer, en:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '8'
  - number: 32.5.a
    text: |-
      indien de in dat artikellid bedoelde nadere regels betrekking hebben op medische stralingstoepassingen, Onze
      Minister van Volksgezondheid, Welzijn en Sport;
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel32
  - number: 32.5.b
    text: |-
      indien de in dat artikellid bedoelde nadere regels betrekking hebben op toepassingen met radioactieve stoffen of
      toestellen in het kader van activiteiten in de zin van de [Mijnwet 1903][ref1] of de [Mijnwet continentaal plat]
      (onbekend), Onze Minister van Economische Zaken;


      [ref1]: https://wetten.overheid.nl/BWBR0001870
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0001870
  - number: 32.5.c
    text: |-
      indien de in dat artikellid bedoelde nadere regels betrekking hebben op het vervoer van radioactieve stoffen of
      lozing in oppervlaktewater, Onze Minister van Verkeer en Waterstaat;
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel32
  - number: 32.5.d
    text: |-
      indien de in dat artikellid bedoelde nadere regels betrekking hebben op lozing in oppervlaktewater of lozing in
      lucht, Onze Minister van Landbouw, Natuurbeheer en Visserij.
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel32
  - number: '32.6'
    text: |-
      Indien bij een algemene maatregel van bestuur als in het eerste lid bedoeld wordt afgeweken van bij of krachtens
      andere wetten gestelde regelen, blijven deze in zoverre buiten toepassing.
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel32
  - number: '33.1'
    text: |-
      Ieder, die zonder daartoe bevoegd te zijn radioactieve stoffen dan wel stoffen, waarvan hij redelijkerwijs moet
      vermoeden dat het radioactieve stoffen zijn, onder zich heeft of krijgt, is verplicht daarvan terstond aangifte te
      doen bij de burgemeester van de gemeente, waar die goederen zich bevinden.
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel33
  - number: '33.2'
    text: |-
      De burgemeester geeft van de gedane aangifte onverwijld kennis aan een der krachtens
      [artikel 58, eerste lid][ref1], aangewezen ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel58
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '58'
        hoofdstuk: VIII
  - number: '33.3'
    text: |-
      De krachtens [artikel 58, eerste lid][ref1], aangewezen ambtenaren zijn bevoegd met betrekking tot ongeoorloofd
      aanwezig bevonden radioactieve stoffen en de voorwerpen, welke tot hun verpakking of berging dienen of hebben
      gediend, bestuursdwang toe te passen.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel58
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '58'
        hoofdstuk: VIII
  - number: '33.4'
    text: |-
      Door toepassing van bestuursdwang in bezit genomen goederen worden overgedragen aan een door Ons, op voordracht van
      Onze Ministers van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer, van Sociale Zaken en Werkgelegenheid en
      van Volksgezondheid, Welzijn en Sport, aan te wijzen instelling of persoon. Deze geeft van de overdracht kennis in
      de *Staatscourant* en een of meer nieuwsbladen.
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel33
  - number: '33.5'
    text: |-
      De [artikelen 23][ref1] en [24][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0002402#Artikel24
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '23'
        hoofdstuk: III
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0002402
        artikel: '24'
        hoofdstuk: III
        afdeling: '3'
  - number: '34.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen met het oog op de bescherming van mensen, dieren, planten en
      goederen regelen worden gesteld betreffende toestellen.
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel34
  - number: '34.2'
    text: 'Hiertoe kunnen behoren:'
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel34
  - number: 34.2.a
    text: |-
      regelen, welke een verbod inhouden bij de maatregel aangewezen toestellen te gebruiken, voor zover naar Ons oordeel
      het nut van het gebruik daarvan niet opweegt tegen de nadelige gevolgen voor de openbare gezondheid;
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel34
  - number: 34.2.b
    text: regelen, welke een verbod inhouden bij de maatregel aangewezen toestellen te gebruiken zonder vergunning;
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel34
  - number: 34.2.c
    text: |-
      regelen, welke voorwaarden inhouden, waaraan degene, die bij de maatregel aangewezen toestellen gebruikt, moet
      voldoen;
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel34
  - number: 34.2.d
    text: regelen, welke voorwaarden inhouden, waaraan bij de maatregel aangewezen toestellen moeten voldoen;
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel34
  - number: 34.2.e
    text: |-
      regelen betreffende de plaatsen, waar, de wijze, waarop en de omstandigheden, waaronder bij de maatregel aangewezen
      toestellen mogen worden gebruikt;
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel34
  - number: 34.2.f
    text: regelen, welke de verplichting inhouden tot melding van het gebruik van bij de maatregel aangewezen toestellen.
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel34
  - number: '34.3'
    text: |-
      In geval van toepassing van het tweede lid, onder b, zijn de
      [paragrafen 3.5.2 tot en met 3.5.5 van de Algemene wet bestuursrecht][ref1] en
      [afdeling 13.2 van de Wet milieubeheer][ref2] van toepassing, voor zover dat bij die regelen is bepaald. De
      [artikelen 15c, eerste lid][ref3], [16, eerste lid][ref4], en [17a][ref5] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Paragraaf3.5.2
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Afdeling13.2
      [ref3]: https://wetten.overheid.nl/BWBR0002402#Artikel15c
      [ref4]: https://wetten.overheid.nl/BWBR0002402#Artikel16
      [ref5]: https://wetten.overheid.nl/BWBR0002402#Artikel17a
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0005537
        paragraaf: 3.5.2
      - id: ref2
        bwb_id: BWBR0003245
        afdeling: '13.2'
      - id: ref3
        bwb_id: BWBR0002402
        artikel: 15c
        hoofdstuk: III
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0002402
        artikel: '16'
        hoofdstuk: III
        afdeling: '2'
      - id: ref5
        bwb_id: BWBR0002402
        artikel: 17a
        hoofdstuk: III
        afdeling: '2'
  - number: '34.4'
    text: |-
      Een vergunning als bedoeld in het tweede lid, onder b, kan ter bescherming tegen nadelige gevolgen voor mensen,
      dieren, planten of goederen onder beperkingen worden verleend.
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel34
  - number: '34.5'
    text: |-
      Aan een vergunning als in het tweede lid, onder b, bedoeld kunnen voorschriften worden verbonden. Voor zover door
      het verbinden van voorschriften aan de vergunning de nadelige gevolgen van de betrokken activiteit voor mensen,
      dieren, planten en goederen niet kunnen worden voorkomen, worden daaraan de voorschriften verbonden, die de grootst
      mogelijke bescherming bieden tegen die gevolgen, tenzij dat redelijkerwijs niet kan worden gevergd.
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel34
  - number: '34.6'
    text: |-
      Zodanige voorschriften kunnen, voor zover bij de maatregel niet anders is bepaald, de verplichting inhouden te
      voldoen aan door bestuursorganen, die bij het voorschrift zijn aangewezen, gestelde nadere eisen. Bij het stellen
      van zodanige eis wordt tevens het tijdstip bepaald, waarop ten aanzien van die eis de verplichting ingaat.
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel34
  - number: '34.7'
    text: |-
      De [artikelen 18a tot en met 20a][ref1] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel18a
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: 18a
        hoofdstuk: III
        afdeling: '2'
  - number: '34.8'
    text: |-
      Een algemene maatregel van bestuur, waarbij regelen als in het tweede lid, onder c, d of e, bedoeld worden gesteld,
      kan tevens de verplichting inhouden te voldoen aan door bestuursorganen, die bij de maatregel zijn aangewezen, aan
      de betrokkene gestelde nadere eisen. Het vijfde lid, tweede volzin, is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel34
  - number: '34.9'
    text: |-
      Indien bij een algemene maatregel van bestuur als in het eerste lid bedoeld wordt afgeweken van bij of krachtens
      andere wetten gestelde regelen, blijven deze in zoverre buiten toepassing.
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel34
  - number: '35'
    text: |-
      De voordracht tot vaststelling, wijziging of intrekking van een algemene maatregel van bestuur krachtens dit
      hoofdstuk wordt Ons gedaan door Onze Ministers van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer en van
      Sociale Zaken en Werkgelegenheid. Indien de maatregel betrekking heeft op medische stralingstoepassingen, wordt
      de voordracht mede door Onze Minister van Volksgezondheid, Welzijn en Sport gedaan. Indien de maatregel betrekking
      heeft op toepassingen met radioactieve stoffen of toestellen in het kader van activiteiten in de zin van de
      [Mijnwet 1903][ref1] of de [Mijnwet continentaal plat][ref2], wordt de voordracht mede door Onze Minister van
      Economische Zaken gedaan. Indien de maatregel betrekking heeft op lozing in oppervlaktewater of lozing in lucht,
      wordt de voordracht mede door Onze Minister van Landbouw, Natuurbeheer en Visserij gedaan. Indien de maatregel
      betrekking heeft op het vervoer van radioactieve stoffen of lozing in oppervlaktewater, wordt de voordracht mede
      door Onze Minister van Verkeer en Waterstaat gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0001870
      [ref2]: https://wetten.overheid.nl/BWBR0002504
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0001870
      - id: ref2
        bwb_id: BWBR0002504
  - number: '36.1'
    text: |-
      Indien ten aanzien van een inrichting als in [artikel 15, onder b][ref1], bedoeld of ten aanzien van een uitrusting
      als in dat artikel, onder c, bedoeld, welke in een vaartuig of ander vervoermiddel is of wordt aangebracht, dan wel
      ten aanzien van splijtstoffen, ertsen, radioactieve stoffen of toestellen in strijd met het bij of krachtens deze
      wet bepaalde is gehandeld, kunnen de krachtens [artikel 58, eerste lid][ref2], aangewezen ambtenaren, ingeval dit
      handelen naar hun oordeel ten gevolge heeft, dat personen door het verrichten van werkzaamheden in bepaalde ruimten
      of door het verblijf in die ruimten zich aan een aanmerkelijk gevaar blootstellen, de betrokkene bij beschikking
      bevelen een ieder, dan wel personen, behorende tot daarbij aangewezen categorieën, te beletten werkzaamheden in die
      ruimten te verrichten of aldaar te verblijven.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002402#Artikel58
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
        hoofdstuk: III
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0002402
        artikel: '58'
        hoofdstuk: VIII
  - number: '36.2'
    text: |-
      De ambtenaar, die een beschikking krachtens het eerste lid heeft vastgesteld, kan - zo nodig met behulp van de
      sterke arm - alle maatregelen treffen, die hij ter verzekering van de uitvoering van de beschikking nodig acht.
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel36
  - number: '36.3'
    text: |-
      Een krachtens het eerste lid vastgestelde beschikking heeft een werkingsduur van één week, tenzij vóór het
      verstrijken van die termijn door Onze betrokken Ministers anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel36
  - number: '37.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regelen worden gesteld betreffende het meten van doses
      ioniserende straling en het bepalen van radioactieve besmetting, zomede betreffende de registratie daarvan.
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel37
  - number: '37.2'
    text: 'Hiertoe kunnen behoren:'
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel37
  - number: 37.2.a
    text: |-
      regelen, welke voor bij de maatregel aangewezen personen de verplichting inhouden tot het bij zich dragen van een
      middel ter controle van de dosis ioniserende straling, waaraan zij blootgesteld zijn geweest;
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel37
  - number: 37.2.b
    text: |-
      regelen, welke voor bij de maatregel aangewezen personen de verplichting inhouden tot het houden van een register,
      waarin wordt bijgehouden de dosis ioniserende straling, waaraan de houder is blootgesteld geweest;
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel37
  - number: 37.2.c
    text: |-
      regelen, welke voor degene onder wiens verantwoordelijkheid de houder van een register als onder b bedoeld aan
      ioniserende straling blootgesteld is geweest, de verplichting inhouden tot het registreren van de dosis in dit
      register;
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel37
  - number: 37.2.d
    text: |-
      regelen, welke voor bij de maatregelen aangewezen personen de verplichting inhouden tot het zich onderwerpen aan
      een geneeskundig onderzoek in verband met stralingsgevaar;
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel37
  - number: 37.2.e
    text: |-
      regelen, welke de verplichting inhouden apparaten, dienende tot het meten van doses ioniserende straling en tot het
      bepalen van radioactieve besmetting, te doen ijken.
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel37
  - number: 37a.1
    text: |-
      De voordracht tot vaststelling, wijziging of intrekking van een algemene maatregel van bestuur als in
      [artikel 37][ref1] bedoeld wordt gedaan door Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en
      Milieubeheer en, indien het een maatregel betreft met het oog op de arbeidsbescherming dan wel de medische aspecten
      van bescherming tegen ioniserende straling, Onze Minister van Sociale Zaken en Werkgelegenheid onderscheidenlijk
      Onze Minister van Volksgezondheid, Welzijn en Sport.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel37
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel37a
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '37'
        hoofdstuk: Va
  - number: 37a.2
    text: |-
      Ten aanzien van bij een algemene maatregel van bestuur, vastgesteld krachtens het eerste lid, geregelde onderwerpen
      kan Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer en, indien het een maatregel betreft
      met het oog op de arbeidsbescherming dan wel medische aspecten van bescherming tegen ioniserende straling, Onze
      Minister van Sociale Zaken en Werkgelegenheid onderscheidenlijk Onze Minister van Volksgezondheid, Welzijn en
      Sport, nadere regels stellen.
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel37a
  - number: 37b.1
    text: |-
      Indien naar het oordeel van Onze Ministers van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer en van
      Sociale Zaken en Werkgelegenheid de bedrijfsvoering van een inrichting als bedoeld in [artikel 15, onder b][ref1],
      ernstige tekortkomingen vertoont, treffen zij alle maatregelen die zij met het oog op de omstandigheden geboden
      achten.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel37b
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
        hoofdstuk: III
        afdeling: '2'
  - number: 37b.2
    text: |-
      Tot de in het eerste lid bedoelde maatregelen kunnen behoren het treffen van de nodige technische,
      organisatorische, personele en administratieve voorzieningen.
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel37b
  - number: 37b.3
    text: |-
      Indien de inrichting in gebruik is dan wel is bestemd voor gebruik bij de Nederlandse krijgsmacht of bij
      de krijgsmacht van een bondgenootschappelijke mogendheid, oefenen Onze Ministers hun bevoegdheid uit in
      overeenstemming met Onze Minister van Defensie, onderscheidenlijk de verantwoordelijke autoriteit van de
      desbetreffende mogendheid.
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel37b
  - number: '38'
    text: 'Voor de toepassing van dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel38
  - number: 38.a
    text: 'Onze Minister: Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer;'
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel38
  - number: 38.b
    text: 'ongeval: gebeurtenis'
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel38
  - number: 38.b.1°
    text: |-
      als gevolg waarvan straling vrijkomt of dreigt vrij te komen die tot een verhoogd risico leidt of kan leiden voor
      mens of milieu, of
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel38
  - number: 38.b.2°
    text: |-
      die ter voorkoming of vermindering van een verhoogd stralingsrisico voor mens of milieu een gecoördineerde inzet
      van diensten en organisaties van verschillende disciplines vergt;
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel38
  - number: 38.c
    text: 'categorie A-object:'
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel38
  - number: 38.c.1°
    text: |-
      een inrichting als bedoeld in [artikel 15, onder ][ref1], met uitzondering van een inrichting waarin uitsluitend
      splijtstoffen worden opgeslagen of verwerkt, alsmede een inrichting voor uraniumverrijking,


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
        hoofdstuk: III
        afdeling: '2'
  - number: 38.c.2°
    text: |-
      een ruimtevaartuig of een vervoermiddel met een uitrusting als bedoeld in [artikel 15, onder ][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
        hoofdstuk: III
        afdeling: '2'
  - number: 38.c.3°
    text: |-
      inrichtingen als bedoeld in [artikel 15, onder ][ref1], uitrustingen als bedoeld in [artikel 15, onder ][ref2],
      alsmede inrichtingen of vervoermiddelen waarin of waarmee handelingen worden verricht als bedoeld in
      [artikel 15, onder ][ref3], met betrekking tot splijtstoffen of ertsen voor zover bestemd voor of in gebruik bij de
      Nederlandse krijgsmacht of bij de krijgsmacht van een bondgenootschappelijke mogendheid, of


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002402#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0002402#Artikel15
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
        hoofdstuk: III
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0002402
        artikel: '15'
        hoofdstuk: III
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0002402
        artikel: '15'
        hoofdstuk: III
        afdeling: '2'
  - number: 38.c.4°
    text: een met een object als bedoeld onder 1° tot en met 3° en onder *d* vergelijkbaar object buiten Nederland;
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel38
  - number: 38.d
    text: 'categorie B-object:'
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel38
  - number: 38.d.1°
    text: een inrichting voor uraniumverrijking,
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel38
  - number: 38.d.2°
    text: een inrichting waarin uitsluitend splijtstoffen of radioactieve stoffen worden opgeslagen of verwerkt,
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel38
  - number: 38.d.3°
    text: een inrichting waarin radioactieve stoffen kunnen worden bereid of toegepast,
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel38
  - number: 38.d.4°
    text: een inrichting waarin zich toestellen bevinden,
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel38
  - number: 38.d.5°
    text: een vervoermiddel waarin zich splijtstoffen of ertsen bevinden, of
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel38
  - number: 38.d.6°
    text: een vervoermiddel waarin zich radioactieve stoffen of toestellen bevinden;
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel38
  - number: 38.e
    text: |-
      radiologische noodsituatie: een situatie die een dringend optreden vereist om mensen, dieren, planten en goederen
      tegen blootstelling aan ioniserende straling te beschermen;
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel38
  - number: 38.f
    text: |-
      interventie: een verrichting, bestaande uit het treffen van maatregelen bij stralingsbronnen, stralingsroutes en
      mensen, dieren, planten en goederen, ter voorkoming of vermindering van de blootstelling aan ioniserende straling
      van mensen, dieren, planten en goederen ten gevolge van:
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel38
  - number: 38.f.1°
    text: een radiologische noodsituatie, of
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel38
  - number: 38.f.2°
    text: |-
      een langdurige blootstelling tengevolge van een radiologische noodsituatie of een handeling of werkzaamheid met
      splijtstoffen, radioactieve stoffen of toestellen die in het verleden heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel38
  - number: 38a.1
    text: |-
      Onze Minister en Onze Minister wie het aangaat zijn verantwoordelijk voor de voorbereiding van interventies en
      voor de coördinatie en uitvoering daarvan. Bij of krachtens algemene maatregel van bestuur kunnen omtrent deze
      voorbereiding, uitvoering en coördinatie regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel38a
  - number: 38a.2
    text: |-
      De voordracht tot vaststelling, wijziging of intrekking van een algemene maatregel van bestuur als bedoeld in het
      eerste lid wordt gedaan door Onze Minister en Onze Minister wie het aangaat.
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel38a
  - number: '39.1'
    text: |-
      Ieder die weet of redelijkerwijs kan vermoeden dat zich een ongeval voordoet met een categorie A- of B-object is
      verplicht dit terstond te melden aan de burgemeester van de gemeente, waar hij zich bevindt.
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel39
  - number: '39.2'
    text: De burgemeester geeft van de gedane melding onverwijld kennis aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel39
  - number: '39.3'
    text: |-
      De exploitant van een inrichting als bedoeld in [artikel 15, onder ][ref1], verschaft de burgemeester, al of niet
      op diens verzoek, onverwijld alle informatie die bij de uitoefening van diens taak nodig is.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
        hoofdstuk: III
        afdeling: '2'
  - number: '40.1'
    text: |-
      Onze Minister en Onze Minister wie het aangaat, zijn verantwoordelijk voor de voorbereiding van de organisatie
      ten behoeve van een doelmatige bestrijding van ongevallen binnen of buiten Nederland met categorie A-objecten en
      voor de coördinatie van die bestrijding. Zij bevorderen voorts in het bijzonder het houden van oefeningen en de
      totstandkoming van afspraken, die nodig zijn voor een doelmatige bestrijding van deze ongevallen.
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel40
  - number: '40.2'
    text: |-
      Burgemeester en wethouders zijn verantwoordelijk voor de voorbereiding van de organisatie ten behoeve van een
      doelmatige bestrijding van ongevallen met categorie B-objecten. De burgemeester is verantwoordelijk voor de
      coördinatie van die bestrijding.
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel40
  - number: '41'
    text: |-
      De voorbereiding door provincies en gemeenten van de bestrijding van ongevallen met
      categorie A-objecten en categorie B-objecten geschiedt overeenkomstig de bepalingen van
      [Hoofdstuk II van de Wet rampen en zware ongevallen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003765#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0003765
        hoofdstuk: II
  - number: '42.1'
    text: |-
      Onze Minister kan, na overleg met Onze Minister wie het aangaat, gelet op de meer dan plaatselijke betekenis van
      een ongeval met een categorie B-object, zoveel mogelijk na overleg met de burgemeester van de gemeente waar zich
      dat ongeval heeft voorgedaan en de commissaris van de Koning, besluiten dat een ongeval met een categorie B-object
      wordt bestreden als een ongeval met een categorie A-object.
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel42
  - number: '42.2'
    text: |-
      De burgemeester van de gemeente waar zich dat ongeval heeft voorgedaan, of de commissaris van de Koning kan Onze
      Minister verzoeken gebruik te maken van de bevoegdheid, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel42
  - number: '43.1'
    text: |-
      Onze Minister en Onze Minister wie het aangaat, dragen er zorg voor dat de Nederlandse bevolking op passende wijze
      informatie wordt verstrekt over mogelijke ongevallen met een categorie A-object, de maatregelen ter voorkoming en
      bestrijding daarvan, daaronder begrepen maatregelen ter bescherming van de gezondheid, en de bij deze ongevallen te
      volgen gedragslijn.
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel43
  - number: '43.2'
    text: 'De in het eerste lid bedoelde informatie heeft in ieder geval betrekking op:'
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel43
  - number: 43.2.a
    text: gegevens inhoudende basiskennis over radioactiviteit en de gevolgen daarvan op mens en milieu;
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel43
  - number: 43.2.b
    text: de gevaren en de gevolgen van een ongeval;
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel43
  - number: 43.2.c
    text: de wijze waarop de bevolking bij een ongeval wordt gewaarschuwd, op de hoogte gehouden en beschermd;
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel43
  - number: 43.2.d
    text: de wijze waarop de bevolking dreigend gevaar kan herkennen;
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel43
  - number: 43.2.e
    text: |-
      de door de bevolking te volgen gedragslijn en de maatregelen die zij bij een ongeval dient te treffen om de
      schadelijke gevolgen daarvan zoveel mogelijk te beperken.
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel43
  - number: '43.3'
    text: |-
      De verschaffing van de informatie, bedoeld in het tweede lid, onder *c, d* en *e*, geschiedt ten minste één maal
      per jaar en daarnaast wanneer in de beschreven maatregelen significante wijzigingen worden aangebracht. Voor zover
      nodig wordt de te verstrekken informatie dan bijgewerkt.
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel43
  - number: '43.4'
    text: |-
      De verschaffing van de informatie, bedoeld in het tweede lid, onder *a* en *b*, geschiedt ten minste één maal per
      vijf jaar en daarnaast wanneer in de beschreven maatregelen significante wijzigingen worden aangebracht. Voor zover
      nodig wordt de te verstrekken informatie dan bijgewerkt.
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel43
  - number: '43.5'
    text: |-
      Onze Minister en Onze Minister wie het aangaat verschaffen de informatie, bedoeld in het vierde lid, eerder en
      werken deze eerder bij, indien naar hun oordeel ontwikkelingen in de kennis over de veiligheid, over de beoordeling
      van risico’s of over een doelmatige ongevallenbestrijding hiertoe nopen.
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel43
  - number: 43a.1
    text: |-
      Onze Minister en Onze Minister wie het aangaat, dragen er zorg voor dat de bevolking die wordt getroffen door een
      ongeval met een categorie A-object of door een ongeval met een categorie B-object dat krachtens [artikel 42][ref1]
      als een ongeval met een categorie A-object wordt bestreden, onverwijld en bij herhaling doelmatige informatie
      wordt verstrekt over de te volgen gedragslijn en de maatregelen die zijn getroffen ter bestrijding van dat ongeval,
      daaronder begrepen maatregelen ter bescherming van de gezondheid.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel42
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel43a
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '42'
        hoofdstuk: VI
        afdeling: '2'
  - number: 43a.2
    text: 'De in het eerste lid bedoelde informatie heeft in ieder geval betrekking op:'
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel43a
  - number: 43a.2.a
    text: |-
      het ongeval, met name over de oorzaak, de omvang en de te verwachten gevolgen voor mens en milieu, alsmede over het
      te verwachten verloop van het ongeval;
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel43a
  - number: 43a.2.b
    text: de wijze waarop de bevolking wordt gewaarschuwd, op de hoogte gehouden en beschermd;
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel43a
  - number: 43a.2.c
    text: |-
      instructies aan de bevolking die afhankelijk van de aard van het ongeval betrekking kunnen hebben op onder meer
      het gebruik van verontreinigde levensmiddelen, de hygiëne en ontsmetting, het verblijf binnenshuis, distributie en
      gebruik van beschermende stoffen en evacuatie;
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel43a
  - number: 43a.2.d
    text: de diensten of personen bij wie nadere informatie kan worden ingewonnen.
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel43a
  - number: '44'
    text: |-
      Onze Minister, Onze Minister wie het aangaat, en de burgemeester dragen er zorg voor dat de personen werkzaam bij
      diensten of organisaties die kunnen worden ingeschakeld bij de bestrijding van een ongeval met een categorie A-
      object of van een ongeval met een categorie B-object dat krachtens [artikel 42][ref1] als een ongeval met een
      categorie A-object wordt bestreden, regelmatig worden geïnformeerd over de tot deze categorie behorende ongevallen,
      over de risico’s die zij bij de uitvoering van hun taak lopen, en over de daarbij te nemen voorzorgsmaatregelen.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel42
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '42'
        hoofdstuk: VI
        afdeling: '2'
  - number: '45.1'
    text: |-
      De verstrekking van informatie aan de bevolking en aan personen die bij de bestrijding van een ongeval
      met een categorie B-object zijn betrokken, geschiedt overeenkomstig het bepaalde bij of krachtens de
      [Hoofdstukken II][ref1] en [III van de Wet rampen en zware ongevallen][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003765#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0003765#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0003765
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0003765
        hoofdstuk: III
  - number: '45.2'
    text: |-
      Burgemeester en wethouders dragen er zorg voor dat de door hen verstrekte informatie in overeenstemming is met de
      informatie, bedoeld in [artikel 43, tweede lid, onder ][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel43
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '43'
        hoofdstuk: VI
        afdeling: '3'
  - number: '46.1'
    text: |-
      Indien zich een ongeval voordoet met een categorie A-object of met een categorie B-object dat krachtens
      [artikel 42][ref1] als een ongeval met een A-object wordt bestreden, stelt Onze Minister wie het aangaat, regels
      of treft hij maatregelen, zo nodig met behulp van de sterke arm, om de gevolgen van dat ongeval zoveel mogelijk te
      beperken of ongedaan te maken.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel42
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '42'
        hoofdstuk: VI
        afdeling: '2'
  - number: '46.2'
    text: 'De in het eerste lid bedoelde regels en maatregelen kunnen onder meer betrekking hebben op:'
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel46
  - number: 46.2.a
    text: de toegang van mensen, dieren, planten of goederen tot het verontreinigde gebied,
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel46
  - number: 46.2.b
    text: het verblijf binnenshuis van mens en dier,
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel46
  - number: 46.2.c
    text: |-
      het brengen van mensen, dieren, planten of goederen binnen het verontreinigde gebied naar elders binnen of buiten
      het verontreinigde gebied,
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel46
  - number: 46.2.d
    text: |-
      het uitwendig ontsmetten en het behandelen van inwendige besmetting van mensen, alsmede het verstrekken van
      beschermende stoffen aan mensen,
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel46
  - number: 46.2.e
    text: het in verband met stralingsgevaar onderwerpen van personen of dieren aan een geneeskundig of veterinair onderzoek,
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel46
  - number: 46.2.f
    text: |-
      het begraven, verbranden, bewaren, behandelen of vervoeren van lijken van personen, die mogelijk radioactief besmet
      zijn,
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel46
  - number: 46.2.g
    text: het in beslag nemen of het vernietigen van dieren, planten en goederen, die mogelijk radioactief besmet zijn,
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel46
  - number: 46.2.h
    text: het ontsmetten van dieren of goederen,
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel46
  - number: 46.2.i
    text: het versnellen van de afvoer of het doorspoelen van verontreinigd oppervlaktewater,
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel46
  - number: 46.2.j
    text: het beschermen van oppervlaktewater en de drinkwatervoorziening,
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel46
  - number: 46.2.k
    text: |-
      het onttrekken van primair slib aan het slibverwerkingsproces, of het verbieden of beperken van het gebruik van
      oppervlaktewater, en
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel46
  - number: 46.2.l
    text: |-
      het telen en oogsten van land- en tuinbouwprodukten, het sluiten van kassen, het weiden, vangen en slachten van
      dieren en het vissen.
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel46
  - number: '46.3'
    text: |-
      Onze Minister wie het aangaat, stelt geen regels en treft geen maatregelen dan na overleg met Onze Minister
      alsmede met de burgemeester en de commissaris van de Koning, die hierbij in het bijzonder betrokken zijn, tenzij de
      vereiste spoed zich daartegen verzet.
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel46
  - number: '47.1'
    text: |-
      Indien zich een ongeval voordoet met een categorie A-object, als bedoeld in [artikel 38, onderdeel ][ref1],
      kan Onze Minister degene die het daarbij betrokken object onder zijn beheer heeft, bij beschikking bevelen de
      maatregelen te nemen die naar zijn oordeel nodig zijn om de gevolgen van dat ongeval zoveel mogelijk te beperken en
      ongedaan te maken.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel38
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '38'
        hoofdstuk: VI
        afdeling: '1'
  - number: '47.2'
    text: |-
      Tot de in het eerste lid bedoelde maatregelen kunnen behoren het stilleggen van de betrokken inrichting, het buiten
      werking stellen van de betrokken uitrusting of het beëindigen van het verblijf van het betrokken vervoermiddel
      in Nederland.
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel47
  - number: '47.3'
    text: |-
      Indien de gevolgen van het ongeval zich waarschijnlijk zullen beperken tot de veiligheid binnen de betrokken
      inrichting, worden de in het eerste lid bedoelde bevelen gegeven door Onze Minister en Onze Minister van Sociale
      Zaken en Werkgelegenheid tezamen.
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel47
  - number: '47.4'
    text: |-
      De burgemeester van de gemeente waar zich het ongeval heeft voorgedaan kan Onze Minister, onderscheidenlijk Onze
      Minister en Onze Minister van Sociale Zaken en Werkgelegenheid, verzoeken gebruik te maken van de bevoegdheid,
      bedoeld in het eerste onderscheidenlijk derde lid. Op dit verzoek wordt zo spoedig mogelijk beschikt.
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel47
  - number: '47.5'
    text: |-
      Van een krachtens het eerste lid vastgestelde beschikking wordt mededeling gedaan door toezending van een afschrift
      aan de burgemeester van de gemeente, waar zich het ongeval heeft voorgedaan.
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel47
  - number: '48.1'
    text: |-
      Indien zich een ongeval voordoet met een categorie A-object, als bedoeld in [artikel 38, onderdeel ][ref1],
      kan Onze Minister van Defensie, in overeenstemming met Onze Minister en Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties, degene die het daarbij betrokken object onder zijn beheer heeft, bij beschikking bevelen de
      maatregelen te nemen die naar zijn oordeel nodig zijn om de gevolgen van dat ongeval zoveel mogelijk te beperken en
      ongedaan te maken. [Artikel 47, tweede lid][ref2], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0002402#Artikel47
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '38'
        hoofdstuk: VI
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002402
        artikel: '47'
        hoofdstuk: VI
        afdeling: '4'
  - number: '48.2'
    text: |-
      De burgemeester van de gemeente waar zich het ongeval heeft voorgedaan, kan Onze Minister van Defensie verzoeken
      gebruik te maken van de bevoegdheid, bedoeld in het eerste lid. Op dit verzoek wordt zo spoedig mogelijk beschikt.
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel48
  - number: '48.3'
    text: |-
      [Artikel 47, vijfde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel47
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '47'
        hoofdstuk: VI
        afdeling: '4'
  - number: '49.1'
    text: |-
      De commissaris van de Koning, de burgemeester en het dagelijks bestuur van het waterschap en van andere openbare
      lichamen verlenen, op verzoek van Onze Minister wie het aangaat, medewerking aan de uitvoering of handhaving van de
      in [artikel 46, eerste lid][ref1], bedoelde regels en maatregelen.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel46
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '46'
        hoofdstuk: VI
        afdeling: '4'
  - number: '49.2'
    text: |-
      Onze Minister wie het aangaat, geeft van de regels en maatregelen, bedoeld in [artikel 46, eerste lid][ref1],
      onmiddellijk kennis aan de commissaris van de Koning, aan de burgemeester en, voor zover nodig, aan het dagelijks
      bestuur van het waterschap en van andere openbare lichamen.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel46
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '46'
        hoofdstuk: VI
        afdeling: '4'
  - number: 49a.1
    text: |-
      Onze Minister wie het aangaat, trekt, zodra de omstandigheden dit toelaten, de regels in en beëindigt de getroffen
      maatregelen.
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel49a
  - number: 49a.2
    text: |-
      Indien de krachtens [artikel 46, eerste lid][ref1], gestelde regels of getroffen maatregelen met onmiddellijke
      ingang in werking moeten treden of van kracht moeten worden, kan met het oog daarop, vooruitlopend op de
      gebruikelijke bekendmaking, bekendmaking plaatsvinden door middel van de locale, regionale of landelijke omroep.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel46
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel49a
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '46'
        hoofdstuk: VI
        afdeling: '4'
  - number: 49b.1
    text: |-
      De burgemeester van een gemeente kan naar aanleiding van een ongeval met een categorie A-object bij verordening
      voorschriften vaststellen of kan, zonodig met behulp van de sterke arm, maatregelen treffen om de gevolgen van
      dat ongeval zoveel mogelijk te beperken of ongedaan te maken. De voorschriften en maatregelen kunnen onder meer
      betrekking hebben op de onderwerpen, bedoeld in [artikel 46, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel46
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel49b
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '46'
        hoofdstuk: VI
        afdeling: '4'
  - number: 49b.2
    text: |-
      De burgemeester deelt de voorschriften of maatregelen die hij krachtens het eerste lid heeft vastgesteld of
      getroffen, onmiddellijk mee aan Onze Minister, Onze Minister wie het aangaat, en de commissaris van de Koning.
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel49b
  - number: 49b.3
    text: |-
      De burgemeester trekt de door hem vastgestelde voorschriften in en beëindigt de door hem getroffen maatregelen,
      zodra Onze Minister wie het aangaat, overeenkomstige regels stelt of overeenkomstige maatregelen treft krachtens
      [artikel 46, eerste lid][ref1], of aan de burgemeester meedeelt dat de door deze vastgestelde voorschriften moeten
      worden ingetrokken of de door hem getroffen maatregelen moeten worden beëindigd. Onze Minister wie het aangaat,
      handelt hierbij voor zover mogelijk in overleg met de burgemeester.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel46
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel49b
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '46'
        hoofdstuk: VI
        afdeling: '4'
  - number: 49b.4
    text: |-
      [Artikel 49][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel49a
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel49b
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: 49a
        hoofdstuk: VI
        afdeling: '4'
  - number: 49c
    text: |-
      De burgemeester deelt de bevelen en algemeen verbindende voorschriften die hij op grond van de
      [artikelen 173][ref1] en [175][ref2] onderscheidenlijk [176 van de Gemeentewet][ref3] bij een ongeval met een
      categorie B-object heeft gegeven, onmiddellijk mee aan Onze Minister, Onze Minister wie het aangaat, en aan de
      commissaris van de Koning.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel173
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel175
      [ref3]: https://wetten.overheid.nl/BWBR0005416#Artikel176
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel49c
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '173'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '175'
      - id: ref3
        bwb_id: BWBR0005416
        artikel: '176'
  - number: 49d.1
    text: |-
      Indien zich een ongeval voordoet met een categorie B-object, treft de beheerder van het oppervlaktewater
      maatregelen, zonodig met behulp van de sterke arm, die naar zijn oordeel nodig zijn om de gevolgen voor het
      oppervlaktewater zoveel mogelijk te beperken of ongedaan te maken.
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel49d
  - number: 49d.2
    text: 'De in het eerste lid bedoelde maatregelen kunnen in ieder geval betrekking hebben op:'
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel49d
  - number: 49d.2.a
    text: het versnellen van de afvoer of het doorspoelen van verontreinigd oppervlaktewater,
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel49d
  - number: 49d.2.b
    text: het beschermen van oppervlaktewater en de drinkwatervoorziening, en
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel49d
  - number: 49d.2.c
    text: |-
      het onttrekken van primair slib aan het slibverwerkingsproces, of het verbieden of beperken van het gebruik van
      oppervlaktewater.
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel49d
  - number: 49d.3
    text: |-
      De [artikelen 49][ref1], [49][ref2], en [49][ref3] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel49a
      [ref2]: https://wetten.overheid.nl/BWBR0002402#Artikel49b
      [ref3]: https://wetten.overheid.nl/BWBR0002402#Artikel49c
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel49d
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: 49a
        hoofdstuk: VI
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0002402
        artikel: 49b
        hoofdstuk: VI
        afdeling: '4'
      - id: ref3
        bwb_id: BWBR0002402
        artikel: 49c
        hoofdstuk: VI
        afdeling: '4'
  - number: 49e.1
    text: |-
      Aan degene voor wie uit de toepassing van [artikel 46][ref1], [49b ][ref2] of [49d ][ref3] of uit de toepassing
      van [artikel 173][ref4], [175][ref5] of [176 van de Gemeentewet][ref6] bij een ongeval met een categorie B-object
      rechtstreeks en onmiddellijk schade ontstaat, die redelijkerwijs niet of niet geheel te zijnen laste behoort te
      blijven, kan op zijn verzoek door het in het vijfde lid aangewezen bestuursorgaan een naar billijkheid te bepalen
      vergoeding worden toegekend, voor zover:


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0002402#Artikel49b
      [ref3]: https://wetten.overheid.nl/BWBR0002402#Artikel49d
      [ref4]: https://wetten.overheid.nl/BWBR0005416#Artikel173
      [ref5]: https://wetten.overheid.nl/BWBR0005416#Artikel175
      [ref6]: https://wetten.overheid.nl/BWBR0005416#Artikel176
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel49e
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '46'
        hoofdstuk: VI
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0002402
        artikel: 49b
        hoofdstuk: VI
        afdeling: '4'
      - id: ref3
        bwb_id: BWBR0002402
        artikel: 49d
        hoofdstuk: VI
        afdeling: '4'
      - id: ref4
        bwb_id: BWBR0005416
        artikel: '173'
      - id: ref5
        bwb_id: BWBR0005416
        artikel: '175'
      - id: ref6
        bwb_id: BWBR0005416
        artikel: '176'
  - number: 49e.1.a
    text: de schade niet langs burgerrechtelijke weg is of kan worden verhaald;
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel49e
  - number: 49e.1.b
    text: in de vergoeding van de schade niet op andere wijze is of kan worden voorzien.
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel49e
  - number: 49e.2
    text: 'Het in het vijfde lid aangewezen bestuursorgaan kan regels stellen:'
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel49e
  - number: 49e.2.a
    text: |-
      waarbij categorieën van gevallen worden aangewezen, ten aanzien waarvan toepassing zal worden gegeven aan het
      eerste lid;
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel49e
  - number: 49e.2.b
    text: |-
      omtrent de indiening en behandeling van en de beslissing op een verzoek om een vergoeding als bedoeld in het eerste
      lid.
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel49e
  - number: 49e.3
    text: |-
      Het in het vijfde lid aangewezen bestuursorgaan kan regels stellen, waarbij wordt bepaald dat een vergoeding kan
      worden toegekend indien de vaststelling vooraf of zich al dan niet schade als bedoeld in het eerste lid, onder a
      of b, voordoet, zou leiden tot onredelijke vertraging in de behandeling van het verzoek of tot kosten ten aanzien
      waarvan in redelijkheid niet kan worden gevergd dat de belanghebbende deze draagt.
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel49e
  - number: 49e.4
    text: |-
      Een vergoeding krachtens het derde lid kan alleen aan de belanghebbende worden toegekend onder de voorwaarde dat
      hij voor het toegekende bedrag de rechten die hij terzake van de door hem geleden schade tegenover derden heeft,
      overdraagt aan het bestuursorgaan dat de vergoeding toekent.
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel49e
  - number: 49e.5
    text: |-
      De beslissing op een verzoek om vergoeding van schade als bedoeld in het eerste lid, wordt genomen en regels als
      bedoeld in het tweede lid en derde lid worden gesteld door:
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel49e
  - number: 49e.5.a
    text: |-
      Onze Minister wie het aangaat, indien het betreft schade ten gevolge van de toepassing van [artikel 46][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel46
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel49e
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '46'
        hoofdstuk: VI
        afdeling: '4'
  - number: 49e.5.b
    text: |-
      de gemeenteraad, indien het betreft schade ten gevolge van de toepassing van [artikel 49b ][ref1] of van de
      toepassing van [artikel 173][ref2], [175][ref3] of [176 van de Gemeentewet][ref4] bij een ongeval met een categorie
      B-object;


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel49b
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel173
      [ref3]: https://wetten.overheid.nl/BWBR0005416#Artikel175
      [ref4]: https://wetten.overheid.nl/BWBR0005416#Artikel176
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel49e
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: 49b
        hoofdstuk: VI
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '173'
      - id: ref3
        bwb_id: BWBR0005416
        artikel: '175'
      - id: ref4
        bwb_id: BWBR0005416
        artikel: '176'
  - number: 49e.5.c
    text: |-
      de beheerder van het oppervlaktewater indien het betreft schade ten gevolge van de toepassing van
      [artikel 49d][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel49d
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel49e
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: 49d
        hoofdstuk: VI
        afdeling: '4'
  - number: '50'
    text: |-
      Beroep op de administratieve rechter staat open overeenkomstig [hoofdstuk 20 van de Wet milieubeheer][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk20
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0003245
        hoofdstuk: '20'
  - number: '58.1'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de bij besluit van Onze
      Ministers, wie het aangaat, aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel58
  - number: '58.2'
    text: |-
      Onze Ministers van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer en van Sociale Zaken en Werkgelegenheid
      wijzen, in overeenstemming met Onze Ministers wie het mede aangaat, ambtenaren aan belast met het meten van doses
      ioniserende straling en het bepalen van radioactieve besmetting, alsmede met de in [artikel 37][ref1] bedoelde
      registratie daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel37
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '37'
        hoofdstuk: Va
  - number: '58.3'
    text: |-
      Met de uitoefening van de in het eerste en tweede lid bedoelde taken zijn mede belast de door Onze Minister van
      Volksgezondheid, Welzijn en Sport daartoe aangewezen ambtenaren, bedoeld in [artikel 25, eerste lid, onder ][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001969#Artikel25
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0001969
        artikel: '25'
  - number: '58.4'
    text: |-
      Onze betrokken Ministers stellen regelen betreffende de taakvervulling van de krachtens het eerste, tweede en derde
      lid aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel58
  - number: '58.5'
    text: |-
      Van een besluit als bedoeld in het eerste, tweede of derde lid wordt mededeling gedaan door plaatsing in de
      *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel58
  - number: '59.1'
    text: |-
      De [artikelen 5:13][ref1] en [5:15 tot en met 5:20 van de Algemene wet bestuursrecht][ref2] zijn van
      overeenkomstige toepassing ten aanzien van de in [artikel 58, tweede en derde lid][ref3], bedoelde ambtenaren bij
      de uitoefening van de in [artikel 58, tweede lid][ref4], bedoelde taken.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0002402#Artikel58
      [ref4]: https://wetten.overheid.nl/BWBR0002402#Artikel58
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0002402
        artikel: '58'
        hoofdstuk: VIII
      - id: ref4
        bwb_id: BWBR0002402
        artikel: '58'
        hoofdstuk: VIII
  - number: '59.2'
    text: |-
      De in [artikel 58, eerste, tweede en derde lid][ref1], bedoelde ambtenaren zijn bevoegd, met medeneming van de
      benodigde apparatuur, een woning binnen te treden zonder toestemming van de bewoner.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel58
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '58'
        hoofdstuk: VIII
  - number: '65.1'
    text: |-
      Onze Ministers, wie het aangaat, kunnen personen, die zijn aangewezen om de naleving van internationale
      overeenkomsten en door volkenrechtelijke organisaties genomen besluiten, geheel of gedeeltelijk betrekking hebbende
      op het gebied van de kernenergie of van de ioniserende straling, te controleren, toelaten deze taak te vervullen.
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel65
  - number: '65.2'
    text: |-
      De [artikelen 5:13][ref1] en [5:15 tot en met 5.20 van de Algemene wet bestuursrecht][ref2] zijn van
      overeenkomstige toepassing ten aanzien van de in het eerste lid bedoelde personen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '65.3'
    text: |-
      De in het eerste lid bedoelde personen zijn bevoegd, met medeneming van de benodigde apparatuur, een woning binnen
      te treden zonder toestemming van de bewoner, met dien verstande dat bedoelde personen daarbij vergezeld zijn van
      een ambtenaar als bedoeld in [artikel 58][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel58
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '58'
        hoofdstuk: VIII
  - number: '65.4'
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel65
  - number: '66'
    text: |-
      Het bevoegd gezag is bevoegd tot toepassing van bestuursdwang ter handhaving van
      [artikel 5:20 van de Algemene wet bestuursrecht][ref1], voor zover het betreft de verplichting tot het verlenen van
      medewerking aan een krachtens de [artikelen 58][ref2] en [65][ref3] aangewezen persoon of ambtenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0002402#Artikel58
      [ref3]: https://wetten.overheid.nl/BWBR0002402#Artikel65
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0002402
        artikel: '58'
        hoofdstuk: VIII
      - id: ref3
        bwb_id: BWBR0002402
        artikel: '65'
        hoofdstuk: VIII
  - number: '67.1'
    text: |-
      Bij algemene maatregel van bestuur kunnen regelen worden gesteld ter uitvoering van internationale overeenkomsten
      en door volkenrechtelijke organisaties genomen besluiten, geheel of gedeeltelijk betrekking hebbende op het gebied
      van de kernenergie of van de ioniserende straling.
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel67
  - number: '67.2'
    text: 'Hiertoe kunnen behoren:'
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel67
  - number: 67.2.a
    text: |-
      regelen, welke een verbod inhouden hulpstoffen of hulptoestellen, welke voor de vrijmaking van kernenergie of voor
      de opslag, vervaardiging, bewerking of verwerking van splijtstoffen dienstig kunnen zijn, voorhanden te hebben dan
      wel binnen of buiten Nederlands grondgebied te brengen zonder vergunning;
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel67
  - number: 67.2.b
    text: regelen, welke de verplichting inhouden tot mededeling van daarbij aangewezen gegevens.
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel67
  - number: '67.3'
    text: |-
      In geval van toepassing van het tweede lid, onder *a,* is [artikel 16][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel16
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '16'
        hoofdstuk: III
        afdeling: '2'
  - number: '67.4'
    text: Aan een vergunning als in het tweede lid, onder *a,* bedoeld kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel67
  - number: '67.5'
    text: |-
      Zodanige voorschriften kunnen, voor zover bij de maatregel niet anders is bepaald, de verplichting inhouden te
      voldoen aan door bestuursorganen, die bij het voorschrift zijn aangewezen, gestelde nadere eisen. Bij het stellen
      van zodanige eis wordt tevens het tijdstip bepaald, waarop ten aanzien van die eis de verplichting ingaat.
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel67
  - number: '67.6'
    text: |-
      Een vergunning als bedoeld in het tweede lid, onder *a,* kan te allen tijde worden ingetrokken op grond van
      gewichtige redenen aan het algemeen belang ontleend. De aan een vergunning verbonden voorschriften kunnen te allen
      tijde worden gewijzigd, aangevuld of ingetrokken.
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel67
  - number: '68'
    text: 'Bij algemene maatregel van bestuur kunnen regelen worden gesteld ter verzekering van de geheimhouding van:'
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel68
  - number: 68.a
    text: |-
      gegevens, hulpmiddelen en materialen voor de vrijmaking van kernenergie en voor de opslag, vervaardiging, bewerking
      of verwerking van splijtstoffen, voor zover deze gegevens, hulpmiddelen en materialen, hetzij rechtstreeks van de
      overheid, hetzij met instemming van het bevoegde gezag, onder verplichting tot geheimhouding zijn verkregen, dan
      wel door Onze Ministers, wie het aangaat, zijn aangewezen;
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel68
  - number: 68.b
    text: |-
      met behulp van zodanige gegevens, hulpmiddelen en materialen verrichte onderzoekingen en toegepaste werkmethoden,
      voor zover deze onderzoekingen en werkmethoden door Onze Ministers, wie het aangaat, zijn aangewezen.
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel68
  - number: '69.1'
    text: |-
      Een taak die ingevolge bij of krachtens deze wet gestelde regels wordt verricht door een deskundige, wordt slechts
      uitgevoerd door een persoon die als zodanig met het oog op de uitvoering van de betrokken taak is ingeschreven
      in een door Onze Ministers van Sociale Zaken en Werkgelegenheid en van Volkshuisvesting, Ruimtelijke Ordening en
      Milieubeheer aan te wijzen register.
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel69
  - number: '69.2'
    text: |-
      Onze Ministers van Sociale Zaken en Werkgelegenheid en van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer
      beslissen op de aanvraag voor inschrijving in een register als bedoeld in het eerste lid. Zij zijn bevoegd de
      inschrijving door te halen.
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel69
  - number: '69.3'
    text: |-
      Een inschrijving in een register geldt voor een bepaalde tijd. Aan een inschrijving kunnen voorschriften worden
      verbonden.
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel69
  - number: '69.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de eisen met betrekking tot vaardigheden
      en bekwaamheden waaraan een persoon moet voldoen om als deskundige in een register te kunnen worden ingeschreven.
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel69
  - number: '69.5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de inschrijving in een register,
      die in ieder geval betrekking kunnen hebben op:
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel69
  - number: 69.5.a
    text: |-
      de wijze waarop de aanvraag voor inschrijving in een register wordt gedaan en de door de aanvrager te verschaffen
      gegevens en bescheiden;
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel69
  - number: 69.5.b
    text: de gronden waarop en de gevallen waarin de inschrijving kan worden geweigerd of doorgehaald;
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel69
  - number: 69.5.c
    text: de vergoeding die is verschuldigd in verband met de inschrijving in een register;
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel69
  - number: 69.5.d
    text: de aanwijzing van een register;
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel69
  - number: 69.5.e
    text: het beheer van een register;
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel69
  - number: 69.5.f
    text: de taakverdeling tussen Onze in het eerste lid genoemde Ministers.
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel69
  - number: 69a.1
    text: |-
      Onze Ministers van Sociale Zaken en Werkgelegenheid en van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer
      kunnen op verzoek een instelling aanwijzen die de bevoegdheden, bedoeld in [artikel 69, tweede lid][ref1],
      uitoefent.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel69
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel69a
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '69'
        hoofdstuk: IX
  - number: 69a.2
    text: Aan de aanwijzing van een instelling, bedoeld in het eerste lid, kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel69a
  - number: 69a.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de gronden waarop
      een instelling kan worden aangewezen, alsmede met betrekking tot de gronden waarop een aanwijzing kan worden
      ingetrokken dan wel gewijzigd.
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel69a
  - number: 69b.1
    text: |-
      Een krachtens [artikel 69a, eerste lid][ref1], aangewezen instelling verstrekt desgevraagd kosteloos aan Onze
      in dat artikellid genoemde Ministers de voor de uitoefening van hun taak benodigde inlichtingen. Onze genoemde
      Ministers kunnen inzage vorderen van zakelijke gegevens en bescheiden voor zover dat voor vervulling van hun taak
      redelijkerwijs nodig is.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel69a
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel69b
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: 69a
        hoofdstuk: IX
  - number: 69b.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan een krachtens [artikel 69a, eerste lid][ref1], aangewezen
      instelling worden verplicht tot het periodiek opstellen en toezenden aan Onze genoemde Ministers van een verslag
      van de in [artikel 69, tweede lid][ref2], bedoelde werkzaamheden en de rechtmatigheid en doeltreffendheid van die
      werkzaamheden en werkwijze in de afgelopen periode.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel69a
      [ref2]: https://wetten.overheid.nl/BWBR0002402#Artikel69
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel69b
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: 69a
        hoofdstuk: IX
      - id: ref2
        bwb_id: BWBR0002402
        artikel: '69'
        hoofdstuk: IX
  - number: 69c.1
    text: |-
      Onze Ministers van Sociale Zaken en Werkgelegenheid en van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer
      kunnen een krachtens [artikel 69a, eerste lid][ref1], aangewezen instelling aanwijzingen geven met betrekking tot
      de uitoefening van haar taak. Zij treden daarbij niet in individuele gevallen.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel69a
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel69c
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: 69a
        hoofdstuk: IX
  - number: 69c.2
    text: |-
      Een krachtens [artikel 69a, eerste lid][ref1], aangewezen instelling is gehouden overeenkomstig de aanwijzing,
      bedoeld in het eerste lid, te handelen.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel69a
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel69c
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: 69a
        hoofdstuk: IX
  - number: 69d
    text: |-
      Bij algemene maatregel van bestuur kunnen, voor zover nodig in afwijking van deze wet, voorzieningen worden
      getroffen voor het geval een krachtens [artikel 69a, eerste lid][ref1], aangewezen instelling haar uit deze wet
      voortvloeiende verplichtingen niet naar behoren nakomt.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel69a
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel69d
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: 69a
        hoofdstuk: IX
  - number: '70.1'
    text: Een krachtens deze wet verleende vergunning is persoonlijk.
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel70
  - number: '70.2'
    text: |-
      Na het overlijden van een vergunninghouder blijft de vergunning gedurende vier weken van kracht ten behoeve van
      diens rechtverkrijgenden, die het bedrijf voortzetten, mits door of namens hen binnen een week na dit overlijden
      daarvan aan Onze Minister, die de vergunning heeft verleend, kennis wordt gegeven onder opgaaf van de namen
      van hen, die het bedrijf voortzetten. Wanneer binnen deze vier weken een aanvraag om een nieuwe vergunning is
      ingediend, blijft eerstbedoelde vergunning verder van kracht totdat op die aanvraag onherroepelijk is beslist.
      Gedurende het van kracht blijven van de vergunning kan zij overeenkomstig de [artikelen 19 tot en met 20][ref1]
      worden gewijzigd of ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel19
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '19'
        hoofdstuk: III
        afdeling: '2'
  - number: '70.3'
    text: |-
      Een vergunning, die krachtens deze wet is verleend aan een rechtspersoon, kan door deze aan een andere
      rechtspersoon worden overgedragen, indien daarvoor toestemming is gegeven door Onze Ministers, die de vergunning
      hebben verleend.
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel70
  - number: '71'
    text: |-
      Een vergunning als in [artikel 15, onder ][ref1] bedoeld wordt voor de toepassing van de
      [Belemmeringenwet Verordeningen][ref2] (*Stb.* 1899, 129) aangemerkt als een van Onzentwege verleende concessie als
      in artikel 1 van die wet bedoeld en voor de toepassing van de [Belemmeringenwet Privaatrecht][ref3] (*Stb.* 1927,
      159) als een door het openbaar gezag verleende concessie als in [artikel 1 van die wet][ref4] bedoeld.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0001865
      [ref3]: https://wetten.overheid.nl/BWBR0001936
      [ref4]: https://wetten.overheid.nl/BWBR0001936#Artikel1
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
        hoofdstuk: III
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0001865
      - id: ref3
        bwb_id: BWBR0001936
      - id: ref4
        bwb_id: BWBR0001936
        artikel: '1'
  - number: '72.1'
    text: |-
      Bij algemene maatregel van bestuur kunnen bij of krachtens andere wetten gestelde regelen geheel of gedeeltelijk
      buiten toepassing worden verklaard, voor zover de belangen, welke die regelen beogen te beschermen, naar Ons
      oordeel in voldoende mate door toepassing van deze wet kunnen worden beschermd.
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel72
  - number: '72.2'
    text: |-
      Indien Wij niet binnen twaalf weken na het in werking treden van een algemene maatregel van bestuur, waarbij
      bepalingen van een andere wet geheel of gedeeltelijk buiten toepassing zijn verklaard, aan de Staten-Generaal een
      voorstel van wet tot wijziging van die wet of tot afwijking daarvan hebben doen toekomen of indien zodanig voorstel
      wordt ingetrokken of verworpen, trekken Wij de maatregel onverwijld in.
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel72
  - number: '73'
    text: |-
      Indien in deze wet geregelde onderwerpen in het belang van een goede uitvoering van de wet nadere regeling
      behoeven, kan deze geschieden bij algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel73
  - number: '74'
    text: |-
      De bij de toepassing van deze wet betrokken personen zijn verplicht in bij algemene maatregel van bestuur bepaalde
      gevallen en overeenkomstig daarbij gestelde regelen bij de maatregel vastgestelde bedragen aan de staat te betalen
      als bijdrage in de aan de uitvoering van deze wet verbonden kosten.
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel74
  - number: '75.1'
    text: |-
      Wij kunnen ten behoeve van instellingen van wetenschap of in het belang van de landsverdediging van de in de
      [artikelen 15][ref1] en [29][ref2] vervatte verboden:


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002402#Artikel29
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
        hoofdstuk: III
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0002402
        artikel: '29'
        hoofdstuk: IV
        afdeling: '1'
  - number: 75.1.a
    text: bij algemene maatregel van bestuur vrijstelling verlenen;
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel75
  - number: 75.1.b
    text: op daartoe strekkend verzoek ontheffing verlenen.
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel75
  - number: '75.2'
    text: |-
      Aan een vrijstelling of ontheffing worden de voorschriften verbonden, welke naar Ons oordeel nodig zijn met het oog
      op de bij of krachtens [artikel 15][ref1] aangewezen belangen.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15b
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: 15b
        hoofdstuk: III
        afdeling: '2'
  - number: '76.1'
    text: |-
      Het ontwerp van een algemene maatregel van bestuur krachtens [artikel 21][ref1], [29][ref2], [32][ref3],
      [34][ref4], [37][ref5] of [38a][ref6] wordt overgelegd aan de beide kamers der Staten-Generaal en in de
      *Staatscourant* bekendgemaakt. Aan een ieder wordt de gelegenheid geboden binnen een bij die bekendmaking vast te
      stellen termijn van ten minste vier weken opmerkingen over het ontwerp schriftelijk ter kennis te brengen van Onze
      Ministers van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer, van Sociale Zaken en Werkgelegenheid, en,
      behoudens ingeval het een maatregel krachtens [artikel 21][ref7] betreft, van Volksgezondheid, Welzijn en Sport.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0002402#Artikel29
      [ref3]: https://wetten.overheid.nl/BWBR0002402#Artikel32
      [ref4]: https://wetten.overheid.nl/BWBR0002402#Artikel34
      [ref5]: https://wetten.overheid.nl/BWBR0002402#Artikel37
      [ref6]: https://wetten.overheid.nl/BWBR0002402#Artikel38a
      [ref7]: https://wetten.overheid.nl/BWBR0002402#Artikel21
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '21'
        hoofdstuk: III
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0002402
        artikel: '29'
        hoofdstuk: IV
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0002402
        artikel: '32'
        hoofdstuk: IV
        afdeling: '1'
      - id: ref4
        bwb_id: BWBR0002402
        artikel: '34'
        hoofdstuk: IV
        afdeling: '2'
      - id: ref5
        bwb_id: BWBR0002402
        artikel: '37'
        hoofdstuk: Va
      - id: ref6
        bwb_id: BWBR0002402
        artikel: 38a
        hoofdstuk: VI
        afdeling: '1'
      - id: ref7
        bwb_id: BWBR0002402
        artikel: '21'
        hoofdstuk: III
        afdeling: '2'
  - number: '76.2'
    text: |-
      Een algemene maatregel van bestuur als bedoeld in het eerste lid wordt, nadat hij is vastgesteld, toegezonden aan
      beide Kamers der Staten-Generaal. Hij treedt niet eerder in werking dan vier weken na de datum van uitgifte van het
      *Staatsblad* waarin hij is geplaatst.
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel76
  - number: '76.3'
    text: |-
      Ten aanzien van bij een algemene maatregel van bestuur, vastgesteld krachtens [artikel 67][ref1], geregelde
      onderwerpen kunnen Onze betrokken Ministers nadere regelen stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel67
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '67'
        hoofdstuk: IX
  - number: 76a
    text: |-
      Een gedraging in strijd met een voorschrift dat is verbonden aan een krachtens deze wet verleende vergunning, is
      verboden.
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel76a
  - number: '80.1'
    text: |-
      Indien van het opzettelijk handelen in strijd met het bij of krachtens de [artikelen 15][ref1], [21][ref2],
      [26][ref3], of [76][ref4], voor zover betrekking hebbend op een vergunning als bedoeld in [artikel 15][ref5],
      bepaalde gevaar voor ernstig lichamelijk letsel voor een ander of aanzienlijke schade aan goederen te duchten is,
      wordt de schuldige gestraft met gevangenisstraf van ten hoogste twaalf jaren of geldboete van de vijfde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002402#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0002402#Artikel26
      [ref4]: https://wetten.overheid.nl/BWBR0002402#Artikel76a
      [ref5]: https://wetten.overheid.nl/BWBR0002402#Artikel15
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
        hoofdstuk: III
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0002402
        artikel: '21'
        hoofdstuk: III
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0002402
        artikel: '26'
        hoofdstuk: III
        afdeling: '5'
      - id: ref4
        bwb_id: BWBR0002402
        artikel: 76a
        hoofdstuk: IX
      - id: ref5
        bwb_id: BWBR0002402
        artikel: '15'
        hoofdstuk: III
        afdeling: '2'
  - number: '80.2'
    text: |-
      Indien van het opzettelijk handelen in strijd met het bij of krachtens de [artikelen 15][ref1], [21][ref2],
      [26][ref3] of [76][ref4], voor zover betrekking hebbend op een vergunning als bedoeld in [artikel 15][ref5],
      bepaalde levensgevaar voor een ander te duchten is en het feit iemands dood ten gevolge heeft, wordt de schuldige
      gestraft met levenslange gevangenisstraf of tijdelijke van ten hoogste twintig jaren of geldboete van de vijfde
      categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002402#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0002402#Artikel26
      [ref4]: https://wetten.overheid.nl/BWBR0002402#Artikel76a
      [ref5]: https://wetten.overheid.nl/BWBR0002402#Artikel15
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
        hoofdstuk: III
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0002402
        artikel: '21'
        hoofdstuk: III
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0002402
        artikel: '26'
        hoofdstuk: III
        afdeling: '5'
      - id: ref4
        bwb_id: BWBR0002402
        artikel: 76a
        hoofdstuk: IX
      - id: ref5
        bwb_id: BWBR0002402
        artikel: '15'
        hoofdstuk: III
        afdeling: '2'
  - number: 80a
    text: |-
      In geval van vervolging wegens een strafbaar feit, vallende onder de omschrijvingen van artikel 7, eerste
      lid, onder *a*, van het op 3 maart 1980 te Wenen/New York tot stand gekomen Verdrag inzake de fysieke
      beveiliging van kernmateriaal (*Trb.* 1981, 7) op grond van een der bevoegdheidsregels, bedoeld in
      [artikel 8, eerste lid, onder ][ref1], of [artikel 8, tweede lid][ref2], van dat Verdrag, wordt bij de toepassing
      van deze wet


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002402#Artikel8
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel80a
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '8'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0002402
        artikel: '8'
        hoofdstuk: II
  - number: 80a.a
    text: |-
      elk handelen zonder vergunning te verlenen door het bevoegd gezag van een Staat, Partij bij dat Verdrag, of in
      strijd met de in zulk een Staat geldende voorschriften gelijk gesteld met eenzelfde handelen zonder vergunning te
      verlenen ingevolge deze wet of in strijd met overeenkomstige bij of krachtens deze wet gestelde voorschriften,
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel80a
  - number: 80a.b
    text: |-
      het binnen of buiten het grondgebied van een Staat, Partij bij dat Verdrag, brengen of doen brengen gelijk gesteld
      met het binnen of buiten Nederlands grondgebied brengen of doen brengen, en
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel80a
  - number: 80a.c
    text: de veiligheid van de Staat gelijk gesteld met de veiligheid van een vreemde Staat, Partij bij dat Verdrag.
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel80a
  - number: '81'
    text: |-
      De in [artikel 80][ref1] strafbaar gestelde feiten zijn misdrijven.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel80
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '80'
        hoofdstuk: X
  - number: '83.1'
    text: |-
      Met de opsporing van de bij of krachtens deze wet strafbaar gestelde feiten zijn, onverminderd
      [artikel 141 van het Wetboek van Strafvordering][ref1], belast de in [artikel 58][ref2] bedoelde ambtenaren,
      voor zover zij bij besluit van Onze Minister van Justitie zijn aangewezen. Deze ambtenaren zijn tevens
      belast met de opsporing van de feiten, strafbaar gesteld in de [artikelen 179 tot en met 182][ref3] en
      [184 van het Wetboek van Strafrecht][ref4], voor zover deze feiten betrekking hebben op een bevel, vordering of
      handeling, gedaan of ondernomen door henzelf.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
      [ref2]: https://wetten.overheid.nl/BWBR0002402#Artikel58
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel179
      [ref4]: https://wetten.overheid.nl/BWBR0001854#Artikel184
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
      - id: ref2
        bwb_id: BWBR0002402
        artikel: '58'
        hoofdstuk: VIII
      - id: ref3
        bwb_id: BWBR0001854
        artikel: '179'
      - id: ref4
        bwb_id: BWBR0001854
        artikel: '184'
  - number: '83.2'
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel83
  - number: 83a
    text: |-
      Met betrekking tot de handhaving van het bij of krachtens deze wet bepaalde zijn de [artikelen 18.7][ref1],
      [18.11][ref2], [18.12, eerste en derde lid][ref3], [18.14, eerste lid][ref4], [18.15][ref5] en
      [18.16 van de Wet milieubeheer][ref6] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel18
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Artikel18
      [ref5]: https://wetten.overheid.nl/BWBR0003245#Artikel18
      [ref6]: https://wetten.overheid.nl/BWBR0003245#Artikel18
    url: https://wetten.overheid.nl/BWBR0002402/2003-05-23#Artikel83a
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '18'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '18'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '18'
      - id: ref4
