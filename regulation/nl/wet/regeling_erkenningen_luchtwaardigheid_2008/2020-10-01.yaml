    text: Van de erkenning wordt een bewijs afgegeven.
    url: https://wetten.overheid.nl/BWBR0024682/2020-10-01#Artikel32
  - number: '34.1'
    text: |-
      De houder van een erkenning bereidt wijzigingen in het functioneren van de organisatie zodanig voor en voert deze
      zodanig uit, dat het kwaliteitssysteem van de houder van de erkenning aantoonbaar in stand en effectief blijft.
    url: https://wetten.overheid.nl/BWBR0024682/2020-10-01#Artikel34
  - number: '34.2'
    text: |-
      De houder van een erkenning dient een aanvraag in voor acceptatie van wijziging van de bij de oorspronkelijke
      aanvraag verstrekte gegevens bij wijziging van:
    url: https://wetten.overheid.nl/BWBR0024682/2020-10-01#Artikel34
  - number: 34.2.a
    text: de benaming van de organisatie;
    url: https://wetten.overheid.nl/BWBR0024682/2020-10-01#Artikel34
  - number: 34.2.b
    text: de locatie van de organisatie;
    url: https://wetten.overheid.nl/BWBR0024682/2020-10-01#Artikel34
  - number: 34.2.c
    text: de aanvullende locaties van de organisatie;
    url: https://wetten.overheid.nl/BWBR0024682/2020-10-01#Artikel34
  - number: 34.2.d
    text: de verantwoordelijke manager;
    url: https://wetten.overheid.nl/BWBR0024682/2020-10-01#Artikel34
  - number: 34.2.e
    text: het personeel verantwoordelijk voor de naleving door de organisatie van de van toepassing zijnde eisen;
    url: https://wetten.overheid.nl/BWBR0024682/2020-10-01#Artikel34
  - number: 34.2.f
    text: de faciliteiten, procedures, reikwijdte van werkzaamheden en personeel die de erkenning kunnen beïnvloeden.
    url: https://wetten.overheid.nl/BWBR0024682/2020-10-01#Artikel34
  - number: '35.1'
    text: |-
      Een aanvraag tot wijziging wordt door de minister goedgekeurd nadat is aangetoond, dat het bedrijf ook na de
      invoering van de wijziging aan de voor de verkrijging van een erkenning gestelde voorwaarden zal blijven voldoen.
    url: https://wetten.overheid.nl/BWBR0024682/2020-10-01#Artikel35
  - number: '35.2'
    text: |-
      De [artikelen 30][ref1] en [31][ref2] zijn van toepassing, met dien verstande dat kan worden volstaan met de
      gegevens, die voor de aangevraagde wijziging relevant zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0024682#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0024682#Artikel31
    url: https://wetten.overheid.nl/BWBR0024682/2020-10-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0024682
        artikel: '30'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0024682
        artikel: '31'
        hoofdstuk: '5'
  - number: '35.3'
    text: Bij wijziging wordt zo nodig een nieuw bewijs van erkenning afgegeven.
    url: https://wetten.overheid.nl/BWBR0024682/2020-10-01#Artikel35
  - number: '35.4'
    text: Een aanvraag om wijziging wordt uiterlijk vier weken voor de gewenste datum van wijziging ingediend.
    url: https://wetten.overheid.nl/BWBR0024682/2020-10-01#Artikel35
  - number: '36.1'
    text: |-
      Vanaf het tijdstip van schorsing mag de houder die bevoegdheden, waarop de schorsing van de erkenning betrekking
      heeft, niet uitoefenen.
    url: https://wetten.overheid.nl/BWBR0024682/2020-10-01#Artikel36
  - number: '36.2'
    text: |-
      Om een schorsing op te heffen wordt aangetoond, dat de omstandigheden, die tot schorsing hebben geleid, zijn
      opgeheven.
    url: https://wetten.overheid.nl/BWBR0024682/2020-10-01#Artikel36
  - number: 36a.1
    text: |-
      De minister kan de bevoegdheid tot het uitvoeren van BvL-verlengingsinspecties of acceptatiekeuringen als bedoeld
      in [artikel 29a, tweede lid][ref1], intrekken, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0024682#Artikel29a
    url: https://wetten.overheid.nl/BWBR0024682/2020-10-01#Artikel36a
    references:
      - id: ref1
        bwb_id: BWBR0024682
        artikel: 29a
        hoofdstuk: '5'
  - number: 36a.1.a
    text: een positief advies is uitgebracht over een niet-luchtwaardig luchtvaartuig; of
    url: https://wetten.overheid.nl/BWBR0024682/2020-10-01#Artikel36a
  - number: 36a.1.b
    text: |-
      positieve adviezen zijn uitgebracht die op onderdelen onjuist zijn, zonder dat er sprake is van niet-luchtwaardige
      luchtvaartuigen.
    url: https://wetten.overheid.nl/BWBR0024682/2020-10-01#Artikel36a
  - number: '37.1'
    text: |-
      Vanaf het tijdstip van intrekking mag de houder die bevoegdheden, waarop de intrekking van de erkenning betrekking
      heeft, niet uitoefenen.
    url: https://wetten.overheid.nl/BWBR0024682/2020-10-01#Artikel37
  - number: '37.2'
    text: De houder van de erkenning is verplicht het bewijs van erkenning zo spoedig mogelijk aan de minister te zenden.
    url: https://wetten.overheid.nl/BWBR0024682/2020-10-01#Artikel37
  - number: '37.3'
    text: |-
      De minister neemt het bewijs van erkenning in en geeft, in geval van gedeeltelijke intrekking, een nieuw bewijs van
      erkenning af.
    url: https://wetten.overheid.nl/BWBR0024682/2020-10-01#Artikel37
  - number: '38.1'
    text: |-
      Het handboek van de aanvrager van een erkenning als bedoeld in [artikel 29a, eerste lid, onderdelen a en b][ref1],
      bevat in ieder geval de informatie die is voorgeschreven in de bij deze regeling behorende [bijlage C][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0024682#Artikel29a
      [ref2]: https://wetten.overheid.nl/BWBR0024682
    url: https://wetten.overheid.nl/BWBR0024682/2020-10-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0024682
        artikel: 29a
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0024682
  - number: '38.2'
    text: |-
      Het handboek van de aanvrager van een erkenning als bedoeld in [artikel 29a, eerste lid, onderdeel c][ref1], bevat
      de informatie die is voorgeschreven in onderdeel 21.A.243 van Part 21 bij verordening (EU) nr. 748/2012, met in
      achtneming van de van toepassing zijnde aanvullingen en afwijkingen als bedoeld in de bij deze regeling behorende
      [bijlage E][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0024682#Artikel29a
      [ref2]: https://wetten.overheid.nl/BWBR0024682
    url: https://wetten.overheid.nl/BWBR0024682/2020-10-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0024682
        artikel: 29a
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0024682
  - number: '38.3'
    text: |-
      In door de minister te bepalen gevallen beschikt de aanvrager over een centraal handboek. Het centrale handboek
      bevat de hoofdlijnen van en verwijzingen naar het handboek.
    url: https://wetten.overheid.nl/BWBR0024682/2020-10-01#Artikel38
  - number: '38.4'
    text: De aanvrager zendt wijzigingen in het handboek zo spoedig mogelijk aan de minister.
    url: https://wetten.overheid.nl/BWBR0024682/2020-10-01#Artikel38
  - number: '39.1'
    text: |-
      De houder van een erkenning als bedoeld in [artikel 29a, eerste lid, onderdelen a en b][ref1], bewaart de volgende
      gegevens ten minste gedurende de aangegeven termijn:


      [ref1]: https://wetten.overheid.nl/BWBR0024682#Artikel29a
    url: https://wetten.overheid.nl/BWBR0024682/2020-10-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0024682
        artikel: 29a
        hoofdstuk: '5'
  - number: 39.1.a
    text: |-
      de gegevens met betrekking tot onderhoud van onderdelen of producten: tien jaren na het beëindigen van de
      werkzaamheden;
    url: https://wetten.overheid.nl/BWBR0024682/2020-10-01#Artikel39
  - number: 39.1.b
    text: |-
      de administratie betreffende de afgegeven certificaten van vrijgave en certificaten van vrijgave voor gebruik: tien
      jaren na de autorisatie daarvan;
    url: https://wetten.overheid.nl/BWBR0024682/2020-10-01#Artikel39
  - number: 39.1.c
    text: |-
      de ontvangen certificaten van vrijgave voor gebruik of verklaringen van conformiteit voor materialen of onderdelen,
      welke van derden zijn betrokken: tien jaren na de verwerking van deze materialen of onderdelen.
    url: https://wetten.overheid.nl/BWBR0024682/2020-10-01#Artikel39
  - number: '39.2'
    text: |-
      De houder van een erkenning als bedoeld in [artikel 29a, eerste lid, onderdeel a][ref1], die in het bezit is van
      een MOA of MOA-F, bewaart de gegevens, bedoeld in Part M, subpart F, van verordening (EU) nr. 1321/2014, ten minste
      gedurende de daarin aangegeven termijnen.


      [ref1]: https://wetten.overheid.nl/BWBR0024682#Artikel29a
    url: https://wetten.overheid.nl/BWBR0024682/2020-10-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0024682
        artikel: 29a
        hoofdstuk: '5'
  - number: '39.3'
    text: |-
      De houder van een erkenning als bedoeld in [artikel 29a, eerste lid, onderdeel b][ref1], bewaart de gegevens,
      bedoeld in Part M, subpart G, van verordening (EU) nr. 1321/2014, ten minste gedurende de daarin aangegeven
      termijnen.


      [ref1]: https://wetten.overheid.nl/BWBR0024682#Artikel29a
    url: https://wetten.overheid.nl/BWBR0024682/2020-10-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0024682
        artikel: 29a
        hoofdstuk: '5'
  - number: '39.4'
    text: |-
      De houder van een erkenning als bedoeld in [artikel 29a, eerste lid, onderdeel c][ref1], bewaart de verklaring van
      goedkeuring, de ontwerpgegevens en de technische onderbouwing ten minste tot 2 jaar na het uit dienst nemen van het
      goedgekeurde ontwerp.


      [ref1]: https://wetten.overheid.nl/BWBR0024682#Artikel29a
    url: https://wetten.overheid.nl/BWBR0024682/2020-10-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0024682
        artikel: 29a
        hoofdstuk: '5'
  - number: '40.1'
    text: |-
      De houder van een erkenning meldt ernstige tekortkomingen die tijdens het productieproces ontstaan, een ernstig
      defect of een ernstig gebrek zo spoedig mogelijk, doch in elk geval binnen 72 uur na constatering of het bekend
      worden ervan, schriftelijk aan de minister.
    url: https://wetten.overheid.nl/BWBR0024682/2020-10-01#Artikel40
  - number: '40.2'
    text: |-
      De melding gaat vergezeld van een zo volledig mogelijke beschrijving van hetgeen werd gevonden en een opgave van de
      overige van belang zijnde gegevens.
    url: https://wetten.overheid.nl/BWBR0024682/2020-10-01#Artikel40
  - number: '40.3'
    text: |-
      Indien er sprake is van direct gevaar voor het veilig gebruik of de inzittende, meldt de houder van een erkenning
      de tekortkoming, het ernstig defect of gebrek onmiddellijk aan de minister.
    url: https://wetten.overheid.nl/BWBR0024682/2020-10-01#Artikel40
  - number: '41'
    text: |-
      Indien naar het oordeel van de minister een verbetering van het kwaliteitssysteem noodzakelijk is, treft de houder
      van een erkenning, met inachtneming van de door de minister gegeven aanwijzingen, maatregelen ter verbetering van
      het kwaliteitssysteem.
    url: https://wetten.overheid.nl/BWBR0024682/2020-10-01#Artikel41
  - number: '42.1'
    text: 'De aanvrager wordt erkend nadat deze naar het oordeel van de minister genoegzaam heeft aangetoond, dat hij:'
    url: https://wetten.overheid.nl/BWBR0024682/2020-10-01#Artikel42
  - number: 42.1.a
    text: |-
      aan de erkenningsvoorwaarden, opgenomen in de bij deze regeling behorende [bijlage D][ref1] voldoet;


      [ref1]: https://wetten.overheid.nl/BWBR0024682
    url: https://wetten.overheid.nl/BWBR0024682/2020-10-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0024682
  - number: 42.1.b
    text: in Nederland is gevestigd.
    url: https://wetten.overheid.nl/BWBR0024682/2020-10-01#Artikel42
  - number: '42.2'
    text: |-
      De aanvraag wordt ingediend door de functionaris van de organisatie, die de eindverantwoordelijkheid draagt ten
      aanzien van het door de organisatie gevoerde beleid.
    url: https://wetten.overheid.nl/BWBR0024682/2020-10-01#Artikel42
  - number: '43'
    text: 'Bij de aanvraag verstrekt de aanvrager de volgende gegevens:'
    url: https://wetten.overheid.nl/BWBR0024682/2020-10-01#Artikel43
  - number: 43.a
    text: |-
      een korte levensbeschrijving van de aanvrager, de uitvoerder van de kwaliteitsborgingsfunctie, en het
      autoriseringspersoneel, waarin in ieder geval opleiding, ervaring en vroegere functies zijn opgenomen;
    url: https://wetten.overheid.nl/BWBR0024682/2020-10-01#Artikel43
  - number: 43.b
    text: |-
      in het geval van een eenmansorganisatie, een afschrift van de overeenkomst met de uitvoerder van de
      kwaliteitsborgingsfunctie;
    url: https://wetten.overheid.nl/BWBR0024682/2020-10-01#Artikel43
  - number: 43.c
    text: |-
      een exemplaar van het handboek, bedoeld in [artikel 16][ref1] van de bij deze regeling behorende [bijlage D][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0024682#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0024682
    url: https://wetten.overheid.nl/BWBR0024682/2020-10-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0024682
        artikel: '16'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0024682
  - number: 43.d
    text: een exemplaar van te gebruiken modellen van het geluidsmeetrapport;
    url: https://wetten.overheid.nl/BWBR0024682/2020-10-01#Artikel43
  - number: 43.e
    text: |-
      een uittreksel, niet ouder dan drie maanden, uit het Handelsregister indien de organisatie aldaar is ingeschreven,
      of in het geval van een eenmansorganisatie, een gewaarmerkt afschrift, niet ouder dan drie maanden, uit de
      basisregistratie personen;
    url: https://wetten.overheid.nl/BWBR0024682/2020-10-01#Artikel43
  - number: 43.f
    text: |-
      een zelfevaluatie, waarin is opgenomen op welke wijze de aanvrager aan de in de van toepassing zijnde regelgeving
      bedoelde eisen voldoet, en waar dit in het handboek staat beschreven.
    url: https://wetten.overheid.nl/BWBR0024682/2020-10-01#Artikel43
  - number: '44'
    text: Van de erkenning wordt een bewijs afgegeven.
    url: https://wetten.overheid.nl/BWBR0024682/2020-10-01#Artikel44
  - number: '46.1'
    text: |-
      De houder van een erkenning, niet zijnde een eenmansorganisatie, bereidt wijzigingen in het functioneren van
      de organisatie zodanig voor en voert deze op zodanige wijze uit, dat het kwaliteitssysteem van de houder van de
      erkenning aantoonbaar in stand en effectief blijft.
    url: https://wetten.overheid.nl/BWBR0024682/2020-10-01#Artikel46
  - number: '46.2'
    text: |-
      De houder van een erkenning, niet zijnde een eenmansorganisatie, dient een aanvraag voor acceptatie van wijziging
      van de bij de oorspronkelijke aanvraag verstrekte gegevens in bij:
    url: https://wetten.overheid.nl/BWBR0024682/2020-10-01#Artikel46
  - number: 46.2.a
    text: een wijziging in het kwaliteitsbeleid;
    url: https://wetten.overheid.nl/BWBR0024682/2020-10-01#Artikel46
  - number: 46.2.b
    text: een belangrijke wijziging van de organisatie;
    url: https://wetten.overheid.nl/BWBR0024682/2020-10-01#Artikel46
  - number: 46.2.c
    text: een wijziging van de erkenningaanvrager, of de leiding van de kwaliteitsafdeling;
    url: https://wetten.overheid.nl/BWBR0024682/2020-10-01#Artikel46
  - number: 46.2.d
    text: een wijziging in de lijst van autoriseringspersoneel, tenzij anderszins met het bedrijf is overeengekomen;
    url: https://wetten.overheid.nl/BWBR0024682/2020-10-01#Artikel46
  - number: 46.2.e
    text: een belangrijke wijziging in de toegepaste werkwijzen;
    url: https://wetten.overheid.nl/BWBR0024682/2020-10-01#Artikel46
  - number: 46.2.f
    text: verandering in de meetuitrusting van het bedrijf;
    url: https://wetten.overheid.nl/BWBR0024682/2020-10-01#Artikel46
  - number: 46.2.g
    text: de ingebruikname van een nieuwe geluidsmeetlocatie.
    url: https://wetten.overheid.nl/BWBR0024682/2020-10-01#Artikel46
  - number: '46.3'
    text: |-
      De houder van een erkenning, zijnde een eenmansorganisatie, deelt de minister onverwijld
      iedere wijziging mee van de bij de laatst ingediende aanvraag verstrekte gegevens volgens
      [artikel 43, aanhef en onder b tot en met f][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024682#Artikel43
    url: https://wetten.overheid.nl/BWBR0024682/2020-10-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0024682
        artikel: '43'
        hoofdstuk: '6'
  - number: '46.4'
    text: De minister kan voorwaarden stellen waaronder de in het derde lid bedoelde wijzigingen worden geaccepteerd.
    url: https://wetten.overheid.nl/BWBR0024682/2020-10-01#Artikel46
  - number: '47.1'
    text: |-
      Een aanvraag tot wijziging, wordt door de minister goedgekeurd, nadat is aangetoond, dat de organisatie ook na de
      invoering van de wijziging aan de voor de verkrijging van een erkenning gestelde voorwaarden zal blijven voldoen.
    url: https://wetten.overheid.nl/BWBR0024682/2020-10-01#Artikel47
  - number: '47.2'
    text: |-
      De erkenning als eenmansorganisatie wordt gewijzigd, nadat door tussenkomst van de uitvoerder van de
      kwaliteitsborgingsfunctie is aangetoond, dat de houder ook na de invoering van de wijziging aan de voor de
      verkrijging van een erkenning als geluidsmeetorganisatie gestelde voorwaarden zal blijven voldoen.
    url: https://wetten.overheid.nl/BWBR0024682/2020-10-01#Artikel47
  - number: '47.3'
    text: |-
      De [artikelen 42][ref1] en [43][ref2] zijn van toepassing, met dien verstande dat kan worden volstaan met de
      gegevens, die voor de aangevraagde wijziging relevant zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0024682#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0024682#Artikel43
    url: https://wetten.overheid.nl/BWBR0024682/2020-10-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0024682
        artikel: '42'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0024682
        artikel: '43'
        hoofdstuk: '6'
  - number: '47.4'
    text: Bij wijziging wordt zo nodig een nieuw bewijs van erkenning afgegeven.
    url: https://wetten.overheid.nl/BWBR0024682/2020-10-01#Artikel47
  - number: '47.5'
    text: Een aanvraag om wijziging wordt uiterlijk acht weken voor de gewenste datum van wijziging ingediend.
    url: https://wetten.overheid.nl/BWBR0024682/2020-10-01#Artikel47
  - number: '48.1'
    text: |-
      Vanaf het tijdstip van schorsing mag de houder die bevoegdheden, waarop de schorsing van de erkenning betrekking
      heeft, niet uitoefenen.
    url: https://wetten.overheid.nl/BWBR0024682/2020-10-01#Artikel48
  - number: '48.2'
    text: |-
      Om een schorsing op te heffen wordt aangetoond, dat de omstandigheden, die tot schorsing hebben geleid, zijn
      opgeheven.
    url: https://wetten.overheid.nl/BWBR0024682/2020-10-01#Artikel48
  - number: '49.1'
    text: |-
      Vanaf het tijdstip van intrekking mag de houder de bevoegdheden, waarop de intrekking van de erkenning betrekking
      heeft, niet uitoefenen.
    url: https://wetten.overheid.nl/BWBR0024682/2020-10-01#Artikel49
  - number: '49.2'
    text: De houder van de erkenning is verplicht het bewijs van erkenning zo spoedig mogelijk aan de minister te zenden.
    url: https://wetten.overheid.nl/BWBR0024682/2020-10-01#Artikel49
  - number: '49.3'
    text: |-
      De minister neemt het bewijs van erkenning in en geeft, in geval van gedeeltelijke intrekking, een nieuw bewijs van
      erkenning af.
    url: https://wetten.overheid.nl/BWBR0024682/2020-10-01#Artikel49
  - number: '50.1'
    text: |-
      Het handboek van de aanvrager bevat in ieder geval de informatie die is voorgeschreven in de bij deze regeling
      behorende [bijlage D][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024682
    url: https://wetten.overheid.nl/BWBR0024682/2020-10-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0024682
  - number: '50.2'
    text: De aanvrager zendt wijzigingen in het handboek zo spoedig mogelijk aan de minister.
    url: https://wetten.overheid.nl/BWBR0024682/2020-10-01#Artikel50
  - number: '51'
    text: 'De houder van een erkenning bewaart de volgende gegevens ten minste gedurende de aangegeven termijn:'
    url: https://wetten.overheid.nl/BWBR0024682/2020-10-01#Artikel51
  - number: 51.a
    text: |-
      de geluidsmeetrapporten en overige gegevens met betrekking tot de geluidsmetingen die hebben plaatsgevonden: twee
      jaren na de geluidsmeting;
    url: https://wetten.overheid.nl/BWBR0024682/2020-10-01#Artikel51
  - number: 51.b
    text: 'de administratie betreffende de afgegeven geluidsmeetrapporten: twee jaren na de autorisatie daarvan.'
    url: https://wetten.overheid.nl/BWBR0024682/2020-10-01#Artikel51
  - number: '52.1'
    text: |-
      De houder van een erkenning meldt een defect of een gebrek zo spoedig mogelijk, doch in elk geval binnen 72 uur na
      de ontdekking ervan, schriftelijk aan de minister.
    url: https://wetten.overheid.nl/BWBR0024682/2020-10-01#Artikel52
  - number: '52.2'
    text: |-
      De melding gaat vergezeld van een zo volledig mogelijke beschrijving van hetgeen werd gevonden en een opgave van de
      overige van belang zijnde gegevens.
    url: https://wetten.overheid.nl/BWBR0024682/2020-10-01#Artikel52
  - number: '52.3'
    text: |-
      Indien er sprake is van een ernstig defect of gebrek meldt de houder van de erkenning het ernstige defect of het
      ernstige gebrek onmiddellijk aan de minister.
    url: https://wetten.overheid.nl/BWBR0024682/2020-10-01#Artikel52
  - number: '53'
    text: |-
      Indien naar het oordeel van de minister een verbetering van het kwaliteitssysteem noodzakelijk is, treft de erkende
      geluidsmeetorganisatie, met inachtneming van de door de minister gegeven aanwijzingen, maatregelen ter verbetering
      van het kwaliteitssysteem.
    url: https://wetten.overheid.nl/BWBR0024682/2020-10-01#Artikel53
  - number: '54'
    text: 'De minister publiceert periodiek de volgende gegevens van de houders van een erkenning:'
    url: https://wetten.overheid.nl/BWBR0024682/2020-10-01#Artikel54
  - number: 54.a
    text: naam;
    url: https://wetten.overheid.nl/BWBR0024682/2020-10-01#Artikel54
  - number: 54.b
    text: vestigingsplaats of -plaatsen;
    url: https://wetten.overheid.nl/BWBR0024682/2020-10-01#Artikel54
  - number: 54.c
    text: omschrijving van de werkzaamheden, waarvoor de houder van een erkenning is erkend.
    url: https://wetten.overheid.nl/BWBR0024682/2020-10-01#Artikel54
  - number: '55'
    text: |-
      De [Regeling erkenningen luchtwaardigheid][ref1] en de [Regeling JAR-147 opleidingsinstellingen][ref2] worden
      ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0012877
      [ref2]: https://wetten.overheid.nl/BWBR0012920
    url: https://wetten.overheid.nl/BWBR0024682/2020-10-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0012877
      - id: ref2
        bwb_id: BWBR0012920
  - number: '56'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0024682/2020-10-01#Artikel56
  - number: '57'
    text: 'Deze regeling wordt aangehaald als: Regeling erkenningen luchtwaardigheid 2008.'
    url: https://wetten.overheid.nl/BWBR0024682/2020-10-01#Artikel57
