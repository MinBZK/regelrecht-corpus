  - number: '2.1'
    text: |-
      De aanvraag voor een erkenning als bedoeld in verordening (EU) nr. 1321/2014 en verordening (EU) nr. 748/2012 wordt
      ingediend door de functionaris van het bedrijf, die de eindverantwoordelijkheid draagt ten aanzien van het door het
      bedrijf gevoerde beleid.
    url: https://wetten.overheid.nl/BWBR0024682/2020-10-01#Artikel2
  - number: '2.2'
    text: |-
      Bij de aanvraag verstrekt de aanvrager naast de in de van toepassing zijnde Parts genoemde gegevens de volgende
      gegevens
    url: https://wetten.overheid.nl/BWBR0024682/2020-10-01#Artikel2
  - number: 2.2.a
    text: een uittreksel, niet ouder dan drie maanden, uit het Handelsregister; en
    url: https://wetten.overheid.nl/BWBR0024682/2020-10-01#Artikel2
  - number: 2.2.b
    text: |-
      een zelfevaluatie, waarin is opgenomen op welke wijze de aanvrager aan de in de van toepassing zijnde regelgeving
      bedoelde eisen voldoet, en waar dit in het handboek staat beschreven.
    url: https://wetten.overheid.nl/BWBR0024682/2020-10-01#Artikel2
  - number: '3.1'
    text: |-
      [Artikel 2][ref1] is van toepassing op de aanvraag voor een wijziging van een erkenning, met dien verstande dat kan
      worden volstaan met de gegevens, die voor de aangevraagde wijziging relevant zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0024682#Artikel2
    url: https://wetten.overheid.nl/BWBR0024682/2020-10-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0024682
        artikel: '2'
        hoofdstuk: '2'
  - number: '3.2'
    text: Bij wijziging wordt zo nodig een nieuw bewijs van erkenning afgegeven.
    url: https://wetten.overheid.nl/BWBR0024682/2020-10-01#Artikel3
  - number: '3.3'
    text: Een aanvraag om wijziging wordt uiterlijk vier weken voor de gewenste datum van wijziging ingediend.
    url: https://wetten.overheid.nl/BWBR0024682/2020-10-01#Artikel3
  - number: '4.1'
    text: |-
      Vanaf het tijdstip van schorsing van een erkenning mag de houder die bevoegdheden, waarop de schorsing van de
      erkenning betrekking heeft, niet uitoefenen.
    url: https://wetten.overheid.nl/BWBR0024682/2020-10-01#Artikel4
  - number: '4.2'
    text: Om een schorsing op te heffen toont de houder aan, dat de redenen, die tot schorsing hebben geleid, zijn vervallen.
    url: https://wetten.overheid.nl/BWBR0024682/2020-10-01#Artikel4
  - number: '5.1'
    text: |-
      Vanaf het tijdstip van intrekking van een erkenning mag de houder die bevoegdheden, waarop de intrekking van de
      erkenning betrekking heeft, niet uitoefenen.
    url: https://wetten.overheid.nl/BWBR0024682/2020-10-01#Artikel5
  - number: '5.2'
    text: |-
      De minister neemt het bewijs van erkenning in en geeft, in geval van gedeeltelijke intrekking, een nieuw bewijs van
      erkenning af.
    url: https://wetten.overheid.nl/BWBR0024682/2020-10-01#Artikel5
  - number: '6'
    text: |-
      De houder van een POA zal de te melden afwijkingen volgens 21 A.165(f)2 van Part 21 bij verordening (EU) nr.
      748/2012 schriftelijk en onverwijld maar uiterlijk binnen 72 uur na constatering aan de Minister melden.
    url: https://wetten.overheid.nl/BWBR0024682/2020-10-01#Artikel6
  - number: 6a.1
    text: |-
      De minister kan op aanvraag de houder van een door de minister afgegeven CAMO-erkenning aanvullend erkennen voor
      het uitvoeren van een acceptatiekeuring ten behoeve van de afgifte van een EASA-standaard-BvL, een EASA-beperkt-BvL
      dan wel een export-BvL voor een, in Nederland geregistreerd, luchtvaartuig als bedoeld in artikel 2, eerste lid,
      onderdeel b, onder i, van de basisverordening en de daarbij behorende verklaringen.
    url: https://wetten.overheid.nl/BWBR0024682/2020-10-01#Artikel6a
  - number: 6a.2
    text: |-
      De minister geeft deze aanvullende erkenning af indien de aanvrager zijn handboek heeft aangevuld met een procedure
      met betrekking tot deze keuringen en verklaringen.
    url: https://wetten.overheid.nl/BWBR0024682/2020-10-01#Artikel6a
  - number: 6a.3
    text: 'De minister kan de aanvullende erkenning tot het uitvoeren van acceptatiekeuringen intrekken, indien:'
    url: https://wetten.overheid.nl/BWBR0024682/2020-10-01#Artikel6a
  - number: 6a.3.a
    text: een positief advies is uitgebracht over een niet-luchtwaardig luchtvaartuig; of
    url: https://wetten.overheid.nl/BWBR0024682/2020-10-01#Artikel6a
  - number: 6a.3.b
    text: |-
      positieve adviezen zijn uitgebracht die op onderdelen onjuist zijn, zonder dat er sprake is van niet-luchtwaardige
      luchtvaartuigen.
    url: https://wetten.overheid.nl/BWBR0024682/2020-10-01#Artikel6a
  - number: 29a.1
    text: 'De minister kan op aanvraag aan een bedrijf de volgende erkenningen afgeven:'
    url: https://wetten.overheid.nl/BWBR0024682/2020-10-01#Artikel29a
  - number: 29a.1.a
    text: een erkenning tot het onderhoud van een Nederlands luchtvaartuig;
    url: https://wetten.overheid.nl/BWBR0024682/2020-10-01#Artikel29a
  - number: 29a.1.b
    text: een erkenning tot het onderhoudsmanagement van een Nederlands luchtvaartuig;
    url: https://wetten.overheid.nl/BWBR0024682/2020-10-01#Artikel29a
  - number: 29a.1.c
    text: een erkenning voor het verrichten van ontwerpwerkzaamheden voor een Nederlands luchtvaartuig, en
    url: https://wetten.overheid.nl/BWBR0024682/2020-10-01#Artikel29a
  - number: 29a.1.d
    text: |-
      een erkenning tot het uitvoeren van een acceptatiekeuring ten behoeve van de afgifte van een speciaal-BvL voor
      een RPA.
    url: https://wetten.overheid.nl/BWBR0024682/2020-10-01#Artikel29a
  - number: 29a.2
    text: |-
      De minister kan op aanvraag de houder van een erkenning als bedoeld in het eerste lid, onderdelen a en b, de
      bevoegdheid verlenen tot het aanvullend erkennen voor:
    url: https://wetten.overheid.nl/BWBR0024682/2020-10-01#Artikel29a
  - number: 29a.2.a
    text: |-
      het uitvoeren van een BvL-verlengingsinspectie aan een luchtvaartuig als bedoeld in onderdeel 1, onder a, b, en
      d, van bijlage I bij de basisverordening of dat volledig wordt ingezet voor niet-militaire staatsactiviteiten of
      diensten, en dat is ingeschreven in het Nederlands register voor burgerluchtvaartuigen; en
    url: https://wetten.overheid.nl/BWBR0024682/2020-10-01#Artikel29a
  - number: 29a.2.b
    text: |-
      het uitvoeren van een acceptatiekeuring ten behoeve van de afgifte van een EASA-standaard-BvL, een EASA-beperkt-
      BvL, een ICAO-standaard-BvL dan wel een export-BvL en de daarbij behorende verklaringen.
    url: https://wetten.overheid.nl/BWBR0024682/2020-10-01#Artikel29a
  - number: '30.1'
    text: |-
