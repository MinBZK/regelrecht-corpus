articles:
  - number: '1.1'
    text: |-
      In deze regeling wordt verstaan onder: - *autoriseringspersoneel:* personeel dat door de houder van een
      erkenning volgens een door de Minister aanvaarde procedure is gemachtigd geluidsmeetrapporten af te geven nadat
      geluidsmetingen zijn verricht;
        - *BvL-acceptatiekeuring:* inspectie zoals gedefinieerd in
      [artikel 1 van de Regeling nationale veiligheidsvoorschriften luchtvaartuigen][ref1];
        - *BvL-verlengingsinspectie:* inspectie zoals gedefinieerd in
      [artikel 1 van de Regeling nationale veiligheidsvoorschriften luchtvaartuigen][ref2];
        - *CAMO-erkenning:* erkenning voor het beheren van de blijvende luchtwaardigheid van luchtvaartuigen en de
      onderdelen daarvan, als bedoeld in verordening (EU) nr. 1321/2014, Part M, section A, subpart G;
        - *certificeringspersoneel:* personeel dat door de houder van een erkenning volgens een door de Minister aanvaarde
      procedure is gemachtigd luchtvaartuigen of onderdelen daarvan als geschikt voor gebruik te certificeren;
        - *ernstig defect of gebrek:* defect of gebrek van zodanige aard, dat als gevolg hiervan de veilige uitvoering
      van de vlucht niet meer is gewaarborgd of een ernstige verwonding van een inzittende tot gevolg kan hebben of zijn
      leven in gevaar kan brengen;
        - *houder van een erkenning:* natuurlijk of rechtspersoon, erkend door de minister voor de werkzaamheden die zijn
      opgenomen in het bewijs van erkenning;
        - *kwaliteitssysteem:* stelsel van vastgelegde bedrijfskundige procedures, regels en voorzieningen dat betrekking
      heeft op het productieproces en ten doel heeft te verzekeren dat de resultaten van het productieproces aan de
      vooraf gestelde eisen voldoen;
        - *kwaliteitsborging:* het aantoonbaar op het vereiste peil houden van het kwaliteitssysteem;
        - *kwaliteitsborgingsfunctie:* inspectie- en kwaliteitsorganisatie, aanvaard door de Minister voor het houden
      van toezicht en het beoordelen van de kwaliteit van de werkzaamheden, teneinde het vereiste kwaliteitsniveau te
      handhaven;
        - *luchtwaardigheidsgegevens:* alle informatie die nodig is om ervoor te zorgen dat het luchtvaartuig of het
      onderdeel daarvan in een zodanige staat kan worden gehouden dat de luchtwaardigheid van het luchtvaartuig of het
      goed functioneren van de operationele uitrusting of de nooduitrusting verzekerd is;
        - *minister:* Minister van Infrastructuur en Waterstaat;
        - *MOA:* erkenning voor het onderhoud van vliegtuigen, helikopters en luchtschepen of onderdelen daarvan, als
      bedoeld in bijlage II bij verordening (EU) nr. 1321/2014, (Maintenance Organisation Approval).


      [ref1]: https://wetten.overheid.nl/BWBR0043696#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0043696#Artikel1
