preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de definities van gezin en middelen te herzien met het
    oog op het recht op bijstand van gehuwden met meerderjarige inwonende kinderen en alleenstaande of alleenstaande
    ouder met meerderjarige inwonende kinderen;

    Zo is het dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-Generaal,
    hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0031793/2012-07-18#ArtikelAanhef
articles:
  - number: VI
    text: |-
      De artikelen van deze wet treden in werking met ingang van de dag na de datum van uitgifte van het Staatsblad
      waarin zij wordt geplaatst, waarbij:

      a. de [artikelen I][ref1], [III][ref2], [IV][ref3] en [V][ref4] terugwerken tot en met 1 januari 2012; en

      b. [artikel II][ref5] terugwerkt tot en met 1 juli 2012.


