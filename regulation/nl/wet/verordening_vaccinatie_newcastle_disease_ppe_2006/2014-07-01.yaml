  - number: '4'
    text: |-
      1 In afwijking van [artikel 2, eerste lid][ref1], en [artikel 3][ref2], kan de voorzitter in het geval van een
      dreiging van een uitbraak van NCD bij besluit gelasten dat pluimvee in bepaalde delen van Nederland binnen een
      daarbij bepaalde termijn moet worden gevaccineerd.

      2 Het besluit als bedoeld in het eerste lid wordt gepubliceerd in het Verordeningenblad Bedrijfsorganisatie.


      [ref1]: https://wetten.overheid.nl/BWBR0019971#Artikel2
