  - number: '2'
    text: |-
      1 De ondernemer zorgt ervoor dat het op zijn pluimveehedrijf aanwezige pluimvee overeenkomstig de door het bestuur
      bij besluit vastgestelde voorschriften wordt gevaccineerd tegen NCD.

      2 Ter controle van het effect van de in het eerste lid bedoelde vaccinaties op de immuniteit, zorgt de ondernemer
      ervoor dat overeenkomstig de door het bestuur bij besluit vastgestelde voorschriften, bloedmonsters worden genomen
      van het op zijn pluimveebedrijf aanwezige pluimvee en dat deze bloedmonsters door middel van de HAR-test worden
      onderzocht op de aanwezigheid van antistoffen tegen NCD.

      3 Het eerste lid is niet van toepassing op vermeerderingsdieren of leghennen die voorafgaand aan de
      aanvoer op het pluimveebedrijf van de ondernemer overeenkomstig het eerste lid zijn gevaccineerd en
      waarvan de ondernemer door middel van de uitslag van het bloedonderzoek aantoont dat de dieren aan de in
      [artikel 5, derde lid, onder a. of b.][ref1], bedoelde waarde voldoen.

      4 Het in het tweede lid bedoelde onderzoek van bloedmonsters wordt uitgevoerd door het met betrekking tot NCD in de
      [Regeling erkenning en aanwijzing veterinaire laboratoria][ref2] aangewezen laboratorium.

      5 De vaccinatie, het nemen van bloedmonsters en het onderzoeken van bloedmonsters, zoals bedoeld in het eerste en
      tweede lid van dit artikel, worden verricht op kosten van de ondernemer.

      6 De in het eerste en tweede lid bedoelde besluiten worden gepubliceerd in het Verordeningblad Bedrijfsorganisatie.


      [ref1]: https://wetten.overheid.nl/BWBR0019971#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0019575
