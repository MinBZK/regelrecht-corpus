preamble:
  text: |-
    Gelet op richtlijn 92/66/EEG van de Raad van 14 juli 1992 tot vaststelling van communautaire maatregelen voor de
    bestrijding van de ziekte van Newcastle (PbEG L 260) en richtlijn 90/539/EEG van de Raad van 15 oktober 1990 tot
    vaststelling van veterinairrechtelijke voorschriften voor het intracommunautaire handelsverkeer en de invoer uit
    derde landen van pluimvee en broedeieren (PbEG L 303), alsmede de artikelen 92 en 93 van de Regeling preventie,
    bestrijding en monitoring van besmettelijke dierziekten en zoönosen en TSE’s en de artikelen 96, 97 en 98 van de
    Wet op de bedrijfsorganisatie;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0019971/2014-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Voor de toepassing van deze verordening wordt verstaan onder:

      a. productschap: Productschap Pluimvee en Eieren;

      b. bestuur: bestuur van het productschap;

      c. voorzitter: voorzitter van het productschap;

      d. NCD: Newcastle Disease (pseudovogelpest);

      e. vleeskuikens: kippen, waarvan de punt van het borstbeen nog niet is verbeend, die worden gehouden voor de
      vleesproductie;

      f. vleeskalkoenen: kalkoenen die worden gehouden voor de vleesproductie;

      g. vermeerderingsdieren: kippen of kalkoenen die worden gehouden voor de productie van broedeieren, alsmede kippen
      of kalkoenen die voor dit doel worden opgefokt;

      h. leghennen: kippen die worden gehouden voor de productie van andere eieren dan broedeieren, alsmede kippen die
      voor dit doel worden opgefokt;

      i. pluimvee: vleeskuikens, vleeskalkoenen, vermeerderingsdieren of leghennen;

      j. pluimveebedrijf: voorziening – die een inrichting kan omvatten – die wordt gebruikt voor het op een locatie
      (op)fokken of houden van pluimvee en die als zodanig bij het productschap is geregistreerd, dan wel geregistreerd
      had moeten zijn;

      k. koppel: groep pluimvee met dezelfde gezondheidsstatus en van dezelfde leeftijd, die een epidemiologische eenheid
      vormt;

      l. ondernemer: een natuurlijk persoon of rechtspersoon die een pluimveebedrijf uitoefent;

      m. dierenarts: diegene die is ingeschreven in het register van praktizerende dierenartsen, bedoeld in
      [artikel 10, eerste lid, van de Wet op de uitoefening van de diergeneeskunde 1990][ref1];

      n. paraveterinair: een op aanwijzing van en onder een dierenarts handelende dierenartsassistent als bedoeld in
      [artikel 9 van het Besluit paraveterinairen][ref2] (Stb. 1991, 526);

      o. [richtlijn 92/66/EEG](31992L0066): [richtlijn 92/66/EEG](31992L0066) van de Raad van 14 juli 1992 tot
      vaststelling van communautaire maatregelen voor de bestrijding van de ziekte van Newcastle (PbEG L 260);

      p. HAR-test: Hemagglutinatieremmingstest.


      [ref1]: https://wetten.overheid.nl/BWBR0004730#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0005210#Artikel9
