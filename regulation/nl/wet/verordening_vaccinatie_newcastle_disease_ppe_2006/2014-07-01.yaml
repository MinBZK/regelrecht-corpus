  - number: '3'
    text: |-
      Ter uitvoering van de in [artikel 2, eerste lid][ref1], bedoelde vaccinatieverplichting zorgt de ondernemer ervoor
      dat:

      a. het op het pluimveebedrijf aanwezige pluimvee met een leeftijd vanaf 72 uur na de geboorte tot en met een
      leeftijd van 18 dagen, uiterlijk de 18e levensdag ten minste eenmaal wordt gevaccineerd;

      b. indien het onder a. bedoelde pluimvee afkomstig is van vermeerderingsdieren die niet zijn gevaccineerd tegen
      NCD, de onder a. bedoelde vaccinatie in ieder geval onmiddellijk na plaatsing op het pluimveebedrijf wordt
      uitgevoerd;

      c. het op het pluimveebedrijf aanwezige pluimvee dat ouder is dan 18 dagen, afkomstig van een buiten Nederland
      gelegen bedrijf en dat niet is gevaccineerd tegen NCD, onmiddellijk na plaatsing op het pluimveebedrijf wordt
      gevaccineerd;

      d. de op het pluimveebedrijf aanwezige leghennen of vermeerderingsdieren, niet zijnde kalkoenen, onverminderd
      de onder b. of c. bedoelde vaccinatie, voordat zij de leeftijd van 22 weken hebben bereikt, door middel van een
      injectie worden gevaccineerd met een geïnactiveerd vaccin; en

      e. voor wat betreft kalkoenen, de op het pluimveebedrijf aanwezige vermeerderingsdieren, onverminderd de onder b.
      of c. bedoelde vaccinatie, voordat zij de leeftijd van 30 weken hebben bereikt, door middel van een injectie worden
      gevaccineerd met een geïnactiveerd vaccin.


      [ref1]: https://wetten.overheid.nl/BWBR0019971#Artikel2
