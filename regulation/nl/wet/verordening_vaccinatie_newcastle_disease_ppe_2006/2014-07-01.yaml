  - number: '7'
    text: |-
      1 Onverminderd de in [artikel 2, eerste lid][ref1], bedoelde vaccinaties zorgt de ondernemer ervoor dat indien op
      zijn pluimveebedrijf aanwezig pluimvee verplaatst wordt naar een ander pluimveebedrijf, in het geval:

      a. het koppel pluimvee jonger is dan 28 dagen, dit koppel ten minste 7 dagen vóór de verplaatsing door middel van
      een spray of aërosol is gevaccineerd met een levend vaccin;

      b. het koppel pluimvee ouder is dan 28 dagen doch jonger dan 70 dagen, dit koppel slechts wordt verplaatst indien
      de immuniteit van het koppel aantoonbaar voldoet aan de in [artikel 5, tweede lid][ref2], bedoelde waarde en het
      ten minste 7 en ten hoogste 42 dagen vóór de datum van de verplaatsing door middel van een spray of aërosol is
      gevaccineerd met een levend vaccin;

      c. het een koppel vermeerderingsdieren of leghennen betreft dat ouder is dan 70 dagen, dit koppel voldoet aan
      [artikel 5, derde lid, onder a. of b.][ref3];

      d. het koppel vermeerderingsdieren of leghennen dat ouder is dan 70 dagen en waarvan de immuniteit niet voldoet
      aan de in [artikel 5, derde lid, onder a. of b.][ref4] bepaalde waarde, maar dat sinds de geboorte met tussenpozen
      van ten hoogste zes weken door middel van een spray of aërosol is gevaccineerd met een levende entstof, de laatste
      vaccinatie met een levende entstof ten minste zeven dagen vóór de verplaatsing is uitgevoerd;

      e. het koppel vleeskalkoenen of vleeskuikens ouder is dan 70 dagen, de immuniteit voldoet aan de in
      [artikel 5, derde lid, onder c.][ref5], bepaalde waarde.

      2 Het eerste lid, onder a., is niet van toepassing op koppels pluimvee die jonger zijn dan 8 dagen en afkomstig
      zijn van ouderdieren die aantoonbaar gevaccineerd zijn tegen NCD.

      3 Het eerste lid is van overeenkomstige toepassing indien de koppels binnen één pluimveebedrijf worden verplaatst
      en daarbij vervoer over de openbare weg plaatsvindt.

      4 Vaccinatie als bedoeld in het eerste of derde lid, vindt, op kosten van de ondernemer, plaats overeenkomstig het
      in [artikel 3][ref6] vermelde schema.


