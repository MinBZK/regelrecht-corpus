  - number: '9'
    text: |-
      De ondernemer is verplicht de daartoe bevoegde ambtenaren alsmede de door of namens het bestuur aangewezen personen
      alle medewerking ten behoeve van de uitvoering van deze verordening te verlenen. Deze medewerking kan onder
      meer bestaan uit het desgevraagd toegang geven tot het bedrijf, het ter inzage verstrekken van bescheiden en het
      verschaffen van inlichtingen.
    url: https://wetten.overheid.nl/BWBR0019971/2014-07-01#Artikel9
  - number: '10'
    text: |-
      1 Het toezicht op de naleving van de bij of krachtens deze verordening gestelde voorschriften wordt namens het
      productschap uitgeoefend door een door het bestuur bij besluit aangewezen dienst en door het bestuur aangewezen
      personen.

      2 Ondernemers zijn verplicht:

      a. Aan de door het bestuur aangewezen dienst en personen al die gegevens te verstrekken of te doen verstrekken, die
      nodig zijn voor de vervulling van hun taak;

      b. Aan de door het bestuur aangewezen dienst en personen inzage te geven of te doen geven van die boeken en
      bescheiden, die nodig zijn voor de vervulling van hun taak;

      c. Aan de door het bestuur aangewezen dienst en personen te allen tijde toegang te geven of te doen geven tot hun
      bedrijfsruimten en tot die plaatsen of vervoermiddelen, waar dan wel waarin voorraden (waaronder begrepen pluimvee,
      karkassen, monsters en verpakkingsmateriaal), tot het bedrijf van de ondernemer behorende, zijn opgeslagen dan wel
      worden vervoerd;

      d. Te gedogen dat de door het bestuur aangewezen dienst en personen monsters nemen uit de voorraden van het bedrijf
      van de ondernemer (waaronder begrepen pluimvee, karkassen, monsters en verpakkingsmateriaal), ongeacht de plaats
      waar of waarin zich die voorraden bevinden en de ondernemer zal alsdan de van hem gevorderde medewerking verlenen
      overeenkomstig de aanwijzingen van de door het bestuur aangewezen dienst en personen.

      3 De in het eerste lid bedoelde personen zijn bevoegd berechtingsrapporten op te maken ten behoeve van
      tuchtrechtelijke afhandeling van overtredingen.
    url: https://wetten.overheid.nl/BWBR0019971/2014-07-01#Artikel10
  - number: '11'
    text: |-
      1 Op overtreding van het in de [artikelen 2 tot en met 10][ref1] bepaalde worden tuchtrechtelijke maatregelen
      gesteld.

      2 De tuchtrechtelijke maatregelen zijn:

      a. een berisping;

      b. een geldboete tot ten hoogste het bedrag van de derde categorie bedoeld in
      [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref2];

      c. het stellen van de betrokkene onder verscherpte controle op zijn kosten, voor ten hoogste 2 jaren;

      d. openbaarmaking van de tuchtbeschikking op kosten van de betrokkene.


      [ref1]: https://wetten.overheid.nl/BWBR0019971#Artikel2
