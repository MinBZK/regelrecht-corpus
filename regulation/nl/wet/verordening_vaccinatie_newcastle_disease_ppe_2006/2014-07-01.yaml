  - number: '12'
    text: |-
      1 De voorzitter kan de ondernemer, namens het bestuur, in uitzonderlijke gevallen en voor zover het belang van de
      bestrijding van dierziekten zich daartegen niet verzet, op schriftelijk verzoek vrijstelling of ontheffing verlenen
      van de verplichtingen bedoeld in de [artikelen 2 tot en met 8][ref1].

      2 Aan een vrijstelling of ontheffing als bedoeld in het eerste lid, kunnen voorschriften of voorwaarden worden
      verbonden.

      3 Een verleende vrijstelling of ontheffing als bedoeld in het eerste lid, kan te allen tijde worden ingetrokken.


