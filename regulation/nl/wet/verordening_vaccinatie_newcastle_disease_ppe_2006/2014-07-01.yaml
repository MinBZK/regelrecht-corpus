  - number: '5'
    text: |-
      1 De met het in [artikel 2, tweede lid][ref1], bedoelde onderzoek vastgestelde immuniteit van koppels pluimvee
      voldoet aan de in het tweede of derde lid bedoelde waarde.

      2 Van een koppel pluimvee met een leeftijd van ten minste 28 dagen, voldoet ten minste één van de onderzochte
      bloedmonsters als bedoeld in [artikel 2, tweede lid][ref2], aan de waarde van 1:8 of hoger.

      3 Van een koppel:

      a. vermeerderingsdieren of leghennen dat is gevaccineerd met een geïnactiveerd vaccin voldoet, vanaf zes weken na
      de datum waarop de vaccinatie met het geïnactiveerde vaccin heeft plaatsgevonden, ten minste 83% van het aantal
      onderzochte bloedmonsters aan de waarde van 1:8 of hoger;

      b. vermeerderingsdieren of leghennen, dat nog niet is gevaccineerd met een geïnactiveerd vaccin of waarvan de
      vaccinatie met een geïnactiveerd vaccin minder dan zes weken geleden heeft plaatsgevonden, voldoet vanaf een
      leeftijd van 70 dagen ten minste 83% van het aantal onderzochte bloedmonsters aan de waarde van 1:8 of hoger,
      tenzij het betreffende koppel sinds de geboorte steeds, met tussenpozen van ten hoogste 6 weken, door een
      dierenarts is gevaccineerd met een levende entstof en die vaccinaties via een spray of aërosol zijn uitgevoerd en
      ten minste één van de onderzochte bloedmonsters als bedoeld in [artikel 2, tweede lid][ref3], voldoet aan de waarde
      1:8 of hoger;

      c. vleeskalkoenen en vleeskuikens vanaf een leeftijd van 70 dagen, voldoet ten minste 83% van het aantal
      onderzochte monsters aan de waarde van 1:8 of hoger, tenzij het betreffende koppel sinds de geboorte
      steeds, met tussenpozen van ten hoogste 6 weken, door een dierenarts door middel van een spray of aerosol
      is gevaccineerd met een levende entstof en ten minste één van de onderzochte bloedmonsters als bedoeld in
      [artikel 2, tweede lid][ref4], voldoet aan de waarde 1:8 of hoger.


