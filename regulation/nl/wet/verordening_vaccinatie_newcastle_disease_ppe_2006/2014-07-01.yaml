  - number: '6'
    text: |-
      1 Onverminderd de in [artikel 2, eerste lid][ref1], bedoelde vaccinaties zorgt de ondernemer ervoor dat, indien de
      met het in [artikel 2, tweede lid][ref2], bedoelde onderzoek vastgestelde immuniteit van:

      a. een koppel vermeerderingsdieren of leghennen niet voldoet aan de in [artikel 5, tweede of derde lid][ref3]
      bedoelde waarde, het betreffende koppel terstond wordt gevaccineerd en dat het koppel uiterlijk vier weken na deze
      vaccinatie, overeenkomstig [artikel 2, tweede lid][ref4], wordt onderzocht tenzij het voordien is geslacht;

      b. een koppel vleeskuikens niet voldoet aan de in [artikel 5, tweede lid][ref5], bedoelde waarde, de eerstvolgende
      twee koppels vleeskuikens op zijn bedrijf worden gevaccineerd;

      c. de onder b. bedoelde eerstvolgende twee koppels niet voldoen of als één van deze twee koppels niet voldoet, aan
      de in [artikel 5, tweede lid][ref6], bedoelde waarde, de eerstvolgende zes koppels vleeskuikens op zijn bedrijf
      worden gevaccineerd;

      d. een koppel vleeskalkoenen van een leeftijd van ten minste 70 dagen, niet voldoet aan de in
      [artikel 5, derde lid, onder c.][ref7], bedoelde waarde, de eerstvolgende twee koppels vleeskalkoenen worden
      gevaccineerd;

      e. de onder d. hedoelde eerstvolgende twee koppels, niet voldoet aan de in [artikel 5, derde lid, onder c.][ref8],
      bedoelde waarde, de eerstvolgende drie koppels vleeskalkoenen (die op zijn pluimveebedrijf worden gehouden) worden
      gevaccineerd.

      2 Vaccinatie als bedoeld in het eerste lid, onder a. tot en met e., vindt, op kosten van de ondernemer, plaats
      overeenkomstig het in [artikel 2, eerste lid][ref9], bedoelde besluit.

      3 De in het eerste lid, onder a. tot en met e. bedoelde vaccinaties, worden uitgevoerd door een dierenarts. Indien
      de vaccinaties van de eerstvolgende zes koppels vleeskuikens, bedoeld in het eerste lid, onder c. worden uitgevoerd
      via het drinkwater, dient de dierenarts op het bedrijf aanwezig te zijn vanaf het moment dat het drinkwater wordt
      onthouden aan het te vaccineren pluimvee, tot het moment dat alle entstof is toegediend.

      4 De ondernemer is verplicht een kopie van de vaccinatieverklaringen van de in
      [artikel 6, eerste lid, onder a. tot en met e.][ref10], bedoelde vaccinaties binnen twee weken nadat de vaccinaties
      zijn verricht te zenden naar de het bestuur bij besluit aangewezen uitvoerende instantie.

      5 Het besluit als bedoeld in het vierde lid wordt gepubliceerd in het Verordeningenblad Bedrijfsorganisatie.


