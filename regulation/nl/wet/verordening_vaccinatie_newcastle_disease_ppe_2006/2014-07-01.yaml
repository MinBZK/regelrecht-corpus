  - number: '8'
    text: |-
      1 De ondernemer draagt er voor zorg dat terstond nadat de in deze verordening bedoelde vaccinaties zijn verricht,
      de vaccinatieverklaring overeenkomstig het door het bestuur bij besluit vastgestelde model naar waarheid wordt
      ingevuld en ondertekend.

      2 De ondernemer bewaart de in het eerste lid bedoelde vaccinatieverklaringen alsmede de resultaten van het
      in [artikel 2, tweede en derde lid][ref1], bedoelde onderzoek, gedurende een periode van twee jaren in zijn
      bedrijfsadministratie.

      3 De ondernemer die leghennen dan wel vermeerderingsdieren houdt bewaart de in het eerste lid bedoelde
      vaccinatieverklaringen en de uitslagen van het in [artikel 2, tweede en derde lid][ref2], bedoelde onderzoek
      gedurende een periode van twee jaren op zijn bedrijf, voorzover de genoemde gegevens betrekking hebben op
      vaccinaties en bloedonderzoeken van koppels pluimvee die op zijn bedrijf zijn of worden gehouden en de vaccinaties
      en bloedonderzoeken op zijn bedrijf of op een bedrijf waar de koppels eerder werden gehouden, zijn uitgevoerd.

      4 Het in het eerste lid bedoelde besluit wordt gepubliceerd in het Verordeningenblad Bedrijfsorganisatie.


      [ref1]: https://wetten.overheid.nl/BWBR0019971#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0019971#Artikel2
