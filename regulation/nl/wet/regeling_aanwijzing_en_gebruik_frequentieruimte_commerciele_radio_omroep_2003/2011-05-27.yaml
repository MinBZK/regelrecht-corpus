  - number: '8'
    text: |-
      1 In afwijking van [artikel 6:24, eerste lid, van de Mediawet 2008][ref1], mag voor de uitzending via de FM-
      band van radioprogramma's, andere dan bedoeld in [artikel 7, eerste lid][ref2], van eenzelfde commerciële
      omroepinstelling meer dan één FM-frequentie of samenstel van FM-frequenties worden gebruikt, met dien verstande
      dat:

      a. niet meer of andere frequentieruimte in de FM-band wordt gebruikt
      dan de frequentieruimte van ten hoogste twee kavels, bedoeld in
      __REF000___________________________________________________________________________________________________________
      _________________ en het besluit van de Minister van Economische Zaken, Landbouw en Innovatie van .26 april 2011,
      nr. AT-EL&I/ 6614918, houdende de vaststelling van twee vergunningen voor landelijke commerciële radio-omroep
      (kavels A7 en A8) alsmede twee vergunningen voor digitale radio-omroep (Stcrt. 2011, 7602) voor zover het de kavels
      A7 en A8 betreft, voor zover het de kavels A7 en A8 betreft, en

      b. één van de kavels, bedoeld in onderdeel a, frequentieruimte betreft waarop
      [artikel 2, eerste en tweede lid][ref4], [artikel 3, eerste en tweede lid][ref5],
      [artikel 4 eerste en tweede lid][ref6], [artikel 5, eerste en tweede lid][ref7], of
      [artikel 6, eerste en tweede lid][ref8], van toepassing is.

      2 In afwijking van [artikel 6.24, eerste lid, van de Mediawet 2008][ref9], mag voor de uitzending via de FM-band
      van radioprogramma's als bedoeld in [artikel 7, eerste lid][ref10], van eenzelfde commerciële omroepinstelling
      meer dan één FM-frequentie of samenstel van FM-frequenties, behorende tot de in [artikel 7, tweede lid][ref11],
      aangewezen frequentieruimte, worden gebruikt, mits

      a. het demografisch bereik van de desbetreffende FM-frequenties of samenstellen van FM-frequenties tezamen niet
      meer bedraagt dan 30 procent; en

      b. er geen sprake is van een combinatie als bedoeld in
      [bijlage 2a van de Regeling aanvraag en vergelijkende toets vergunningen commerciële radio-omroep 2003][ref12]
      en [bijlage 2 van de Regeling aanvraag en vergelijkende toets vergunningen commerciële radio-omroep 2007][ref13]
      en, voor zover het betreft de kavels B2, B11 en B26,
      [bijlage 2a van de Regeling vervolg verdeling frequenties commerciële radio-omroep 2003][ref14], waarbij het
      demografisch bereik van de kleinste FM-frequentie of samenstel van FM-frequenties voor 35 procent of meer valt
      binnen het demografisch bereik van de andere FM-frequentie of samenstel van FM-frequenties, dan wel, indien
      dit percentage lager is dan 35 procent, meer dan 100.000 inwoners binnen het demografisch bereik van beide FM-
      frequenties of samenstellen van FM-frequenties vallen.


