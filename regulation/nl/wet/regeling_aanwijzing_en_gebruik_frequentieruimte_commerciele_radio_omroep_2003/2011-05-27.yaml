      d. het radioprogramma tussen 07.00 uur en 19.00 uur ten minste 10 procent muziek bevat van muziekproducties die
      niet langer dan één jaar geleden zijn uitgebracht; en

      e. het radioprogramma tussen 07.00 uur en 19.00 uur minder dan 50 procent klassieke muziek, moderne klassieke
      muziek daaronder begrepen, of jazzmuziek bevat.

      2 Als frequentieruimte, bedoeld in het eerste lid, wordt aangewezen: de frequentieruimte in de kavel A5, bedoeld in
