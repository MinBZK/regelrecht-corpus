        artikel: '6'
  - number: '4'
    text: |-
      1 De frequentieruimte in de FM-band, aangewezen in het tweede lid, wordt slechts gebruikt voor het uitzenden van
      radioprogramma's van commerciële omroepinstellingen, die overwegend bestaan uit klassieke muziek, moderne klassieke
      muziek daaronder begrepen, of jazzmuziek. Een radioprogramma wordt aangemerkt als een radioprogramma, bedoeld in de
      vorige volzin, indien:

      a. het radioprogramma in elk geval wordt uitgezonden gedurende de uren van 07.00 uur tot 19.00 uur; en

      b. het radioprogramma tussen 07.00 uur en 19.00 uur ten minste 50 procent klassieke muziek, moderne klassieke
      muziek daaronder begrepen, of jazzmuziek bevat.

      2 Als frequentieruimte als bedoeld in het eerste lid wordt aangewezen: de frequentieruimte behorend bij kavel A8,
      bedoeld in het [besluit van de Minister van Economische Zaken, Landbouw en Innovatie van 26 april 2011, nr. AT-
      EL&I/ 6614918, houdende de vaststelling van twee vergunningen voor landelijke commerciële radio-omroep (kavels A7
      en A8) alsmede twee vergunningen voor digitale radio-omroep](onbekend) (Stcrt. 2011, 7602).

      3 Bij de toepassing van het eerste lid, onderdeel b, wordt de zendtijd besteed aan reclameboodschappen en nieuws
      buiten beschouwing gelaten.

      4 Het eerste tot en met derde lid zijn niet van toepassing indien de Minister van Economische Zaken in
      overeenstemming met de minister besluit dat de in het tweede lid bedoelde frequentieruimte wordt bestemd voor
      ongeclausuleerde landelijke commerciële radio-omroep.
    url: https://wetten.overheid.nl/BWBR0014740/2011-05-27#Artikel4
  - number: '5'
    text: |-
      1 De frequentieruimte in de FM-band, aangewezen in het tweede lid, wordt slechts gebruikt voor het uitzenden
      van radioprogramma's van commerciële omroepinstellingen, die overwegend bestaan uit bijzondere muziek. Een
      radioprogramma wordt aangemerkt als een radioprogramma, bedoeld in de vorige volzin, indien:

      a. het radioprogramma in elk geval wordt uitgezonden gedurende de uren van 07.00 uur tot 19.00 uur;

      b. het radioprogramma tussen 07.00 uur en 19.00 uur ten minste 50 procent muziek bevat;

      c. het radioprogramma tussen 07.00 uur en 19.00 uur ten hoogste 25 procent muziek bevat die genoteerd staat of
      heeft gestaan op een van de gangbare hitlijsten voor popmuziek in Nederland, waarbij hitnoteringen van vijf jaar of
      langer geleden niet meetellen; en

      d. het radioprogramma tussen 07.00 uur en 19.00 uur minder dan 50 procent klassieke muziek, moderne klassieke
      muziek daaronder begrepen, of jazzmuziek bevat.

      2 Als frequentieruimte, bedoeld in het eerste lid, wordt aangewezen: de frequentieruimte in de kavel A2, bedoeld in
      tabel 2 van bijlage 1 van de Regeling aanvraag en vergelijkende toets vergunningen commerciële radio-omroep 2003.

      3 Bij de toepassing van het eerste lid, onderdelen b tot en met d, wordt de zendtijd besteed aan
      reclameboodschappen en nieuws buiten beschouwing gelaten.

      4 Het eerste tot en met derde lid zijn niet van toepassing indien met toepassing van artikel 2, derde lid, van de
      Regeling aanvraag en vergelijkende toets vergunningen commerciële radio-omroep 2003, de in het tweede lid bedoelde
      frequentieruimte wordt bestemd voor ongeclausuleerde landelijke commerciële radio-omroep.
    url: https://wetten.overheid.nl/BWBR0014740/2011-05-27#Artikel5
