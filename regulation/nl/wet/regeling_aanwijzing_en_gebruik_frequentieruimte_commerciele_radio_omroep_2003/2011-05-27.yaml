        artikel: '1'
  - number: '2'
    text: |-
      1 De frequentieruimte in de FM-band, aangewezen in het tweede lid, wordt slechts gebruikt voor het uitzenden
      van radioprogramma's van commerciële omroepinstellingen, die overwegend bestaan uit nieuws, actualiteiten en
      informatie, gericht op de Nederlandse samenleving. Een radioprogramma wordt aangemerkt als een radioprogramma,
      bedoeld in de vorige volzin, indien:

      a. het radioprogramma in elk geval wordt uitgezonden gedurende de uren van 07.00 uur tot 19.00 uur;

      b. het radioprogramma tussen 07.00 uur en 19.00 uur ten minste 50 procent nieuws, actualiteiten en informatie
      bevat; en

      c. in het radioprogramma tussen 07.00 uur en 19.00 uur en tussen 19.00 uur en 23.00 uur, voor zover in
      laatstgenoemde uren wordt uitgezonden, ten minste eenmaal per uur op het hele uur en tussen 23.00 uur en 07.00 uur,
      voor zover in deze uren wordt uitgezonden, ten minste eenmaal per twee uur op het hele uur een programmaonderdeel
      bestaande uit nieuws is opgenomen.

      2 Als frequentieruimte, bedoeld in het eerste lid, wordt aangewezen: de frequentieruimte in de kavel A4, bedoeld in
      tabel 2 van bijlage 1 van de Regeling aanvraag en vergelijkende toets vergunningen commerciële radio-omroep 2003.

      3 Bij de toepassing van het eerste lid, onderdeel b, wordt de zendtijd besteed aan reclameboodschappen buiten
      beschouwing gelaten.

      4 Het eerste tot en met derde lid zijn niet van toepassing indien met toepassing van artikel 2, derde lid, van de
      Regeling aanvraag en vergelijkende toets vergunningen commerciële radio-omroep 2003, de in het tweede lid bedoelde
      frequentieruimte wordt bestemd voor ongeclausuleerde landelijke commerciële radio-omroep.
    url: https://wetten.overheid.nl/BWBR0014740/2011-05-27#Artikel2
  - number: '3'
    text: |-
      1 De frequentieruimte in de FM-band, aangewezen in het tweede lid, wordt slechts gebruikt voor het uitzenden van
      een radioprogramma van een commerciële omroepinstelling, dat overwegend bestaat uit Nederlandstalige muziek. Een
      radioprogramma wordt aangemerkt als een radioprogramma, bedoeld in de vorige volzin, indien:

      a. het radioprogramma in elk geval wordt uitgezonden gedurende de uren van 07.00 uur tot 19.00 uur;

      b. het radioprogramma tussen 07.00 uur en 19.00 uur ten minste 30 procent Nederlandstalige muziek bevat;

      c. het radioprogramma tussen 07.00 uur en 19.00 uur ten minste 20 procent muziek, andere dan bedoeld in onderdeel
      b, van Europese producties bevat; en

      d. het radioprogramma tussen 07.00 uur en 19.00 uur ten minste 10 procent muziek als bedoeld in onderdeel b of c
      bevat van muziekproducties die niet langer dan één jaar geleden zijn uitgebracht.

      2 Als frequentieruimte, bedoeld in het eerste lid, wordt aangewezen: de frequentieruimte in de kavel A9, bedoeld in
      tabel 2 van bijlage 1 van de Regeling aanvraag en vergelijkende toets vergunningen commerciële radio-omroep 2003.

      3 Voor de toepassing van het eerste lid worden als Europese producties aangemerkt muziekproducties die met
      overeenkomstige toepassing van de criteria van [artikel 6][ref1] van de Europese richtlijn als Europese productie
      kunnen worden aangemerkt.

      4 Bij de toepassing van het eerste lid, onderdelen b tot en met d, wordt de zendtijd besteed aan
      reclameboodschappen en nieuws buiten beschouwing gelaten.

      5 Het eerste tot en met vierde lid zijn niet van toepassing indien met toepassing van artikel 2, derde lid, van de
      Regeling aanvraag en vergelijkende toets vergunningen commerciële radio-omroep 2003, de in het tweede lid bedoelde
      frequentieruimte wordt bestemd voor ongeclausuleerde landelijke commerciële radio-omroep.


      [ref1]: https://wetten.overheid.nl/BWBR0014740#Artikel6
