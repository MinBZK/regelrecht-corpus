$id: regeling_aanwijzing_en_gebruik_frequentieruimte_commerciele_radio_omroep_2003
regulatory_layer: WET
publication_date: '2024-11-25'
valid_from: '2024-11-26'
bwb_id: BWBR0014740
url: https://wetten.overheid.nl/BWBR0014740/2024-11-26
preamble:
  text: |-
    Handelende in overeenstemming met het gevoelen van de ministerraad;

    Gelet op artikel 82e van de Mediawet, en artikel 53c, tweede lid, van het Mediabesluit;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0014740/2024-11-26#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder: - *muziek:* uitgezonden muziekproductie, al dan niet in samenloop met spraak
      die dient ter aankondiging of afkondiging daarvan.
    url: https://wetten.overheid.nl/BWBR0014740/2024-11-26#Artikel1
  - number: '2.1'
    text: |-
      De frequentieruimte in de FM-band, aangewezen in het tweede lid, wordt slechts gebruikt voor het uitzenden
      van radioprogramma's van commerciële omroepinstellingen, die overwegend bestaan uit nieuws, actualiteiten en
      informatie, gericht op de Nederlandse samenleving. Een radioprogramma wordt aangemerkt als een radioprogramma,
      bedoeld in de vorige volzin, indien:
    url: https://wetten.overheid.nl/BWBR0014740/2024-11-26#Artikel2
  - number: 2.1.a
    text: het radioprogramma in elk geval wordt uitgezonden gedurende de uren van 07.00 uur tot 19.00 uur;
    url: https://wetten.overheid.nl/BWBR0014740/2024-11-26#Artikel2
  - number: 2.1.b
    text: het radioprogramma tussen 07.00 uur en 19.00 uur meer dan 70 procent nieuws, actualiteiten en informatie bevat; en
    url: https://wetten.overheid.nl/BWBR0014740/2024-11-26#Artikel2
  - number: 2.1.c
    text: |-
      in het radioprogramma tussen 07.00 uur en 19.00 uur en tussen 19.00 uur en 23.00 uur, voor zover in laatstgenoemde
      uren wordt uitgezonden, ten minste eenmaal per uur op het hele uur en tussen 23.00 uur en 07.00 uur, voor zover in
      deze uren wordt uitgezonden, ten minste eenmaal per twee uur op het hele uur een programmaonderdeel bestaande uit
      nieuws is opgenomen.
    url: https://wetten.overheid.nl/BWBR0014740/2024-11-26#Artikel2
  - number: '2.2'
    text: |-
      Als frequentieruimte als bedoeld in het eerste lid wordt aangewezen de frequentieruimte in de FM-vergunning A04,
      genoemd in [artikel 2][ref1] van de Regeling aanvraag- en veilingprocedure vergunningen landelijke commerciële
      radioomroep 2023.


      [ref1]: https://wetten.overheid.nl/BWBR0014740#Artikel2
    url: https://wetten.overheid.nl/BWBR0014740/2024-11-26#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0014740
        artikel: '2'
  - number: '2.3'
    text: |-
      Bij de toepassing van het eerste lid, onderdeel b, wordt de zendtijd besteed aan reclameboodschappen buiten
      beschouwing gelaten.
    url: https://wetten.overheid.nl/BWBR0014740/2024-11-26#Artikel2
  - number: '3.1'
    text: |-
      De frequentieruimte in de FM-band, aangewezen in het tweede lid, wordt slechts gebruikt voor het uitzenden van
      een radioprogramma van een commerciële omroepinstelling, dat overwegend bestaat uit Nederlandstalige muziek. Een
      radioprogramma wordt aangemerkt als een radioprogramma, bedoeld in de vorige volzin, indien:
    url: https://wetten.overheid.nl/BWBR0014740/2024-11-26#Artikel3
  - number: 3.1.a
    text: het radioprogramma in elk geval wordt uitgezonden gedurende de uren van 07.00 uur tot 19.00 uur en,
    url: https://wetten.overheid.nl/BWBR0014740/2024-11-26#Artikel3
  - number: 3.1.b
    text: het radioprogramma tussen 07.00 uur en 19.00 uur meer dan 50 procent Nederlandstalige muziek bevat.
    url: https://wetten.overheid.nl/BWBR0014740/2024-11-26#Artikel3
  - number: '3.2'
    text: |-
      Als frequentieruimte als bedoeld in het eerste lid wordt aangewezen de frequentieruimte in de FM-vergunning A09,
      genoemd in [artikel 2][ref1] van de Regeling aanvraag- en veilingprocedure vergunningen landelijke commerciële
      radioomroep 2023.


      [ref1]: https://wetten.overheid.nl/BWBR0014740#Artikel2
    url: https://wetten.overheid.nl/BWBR0014740/2024-11-26#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0014740
        artikel: '2'
  - number: '3.3'
    text: |-
      Bij de toepassing van het eerste lid, onderdeel b, wordt de zendtijd besteed aan reclameboodschappen en nieuws
      buiten beschouwing gelaten.
    url: https://wetten.overheid.nl/BWBR0014740/2024-11-26#Artikel3
  - number: '7.1'
    text: |-
      De frequentieruimte in de FM-band, aangewezen in het tweede lid, wordt slechts gebruikt voor het uitzenden
      van regionale radioprogramma's van commerciële omroepinstellingen. Een radioprogramma wordt aangemerkt als een
      radioprogramma, bedoeld in de vorige volzin, indien:
    url: https://wetten.overheid.nl/BWBR0014740/2024-11-26#Artikel7
  - number: 7.1.a
    text: het radioprogramma in elk geval wordt uitgezonden gedurende de uren van 07.00 uur tot 19.00 uur;
    url: https://wetten.overheid.nl/BWBR0014740/2024-11-26#Artikel7
  - number: 7.1.b
    text: |-
      in het radioprogramma tussen 07.00 uur en 19.00 uur en tussen 19.00 uur en 23.00 uur voor zover er in
      laatstgenoemde uren wordt uitgezonden ten minste eenmaal per uur op het hele uur een programmaonderdeel bestaande
      uit nieuws is opgenomen;
    url: https://wetten.overheid.nl/BWBR0014740/2024-11-26#Artikel7
  - number: 7.1.c
    text: |-
      het radioprogramma verzorgd wordt door een commerciële omroepinstelling, waarvan alle door haar verzorgde en via
      omroepnetwerken analoog uitgezonden programma's tezamen door niet meer dan 30 procent van het aantal inwoners van
      Nederland kunnen worden ontvangen; en
    url: https://wetten.overheid.nl/BWBR0014740/2024-11-26#Artikel7
  - number: 7.1.d
    text: het radioprogramma door niet meer dan 30 procent van het aantal inwoners in Nederland kan worden ontvangen.
    url: https://wetten.overheid.nl/BWBR0014740/2024-11-26#Artikel7
  - number: '7.2'
    text: |-
      Als frequentieruimte, bedoeld in het eerste lid, wordt aangewezen de voor niet-landelijke commerciële radio-omroep
      bestemde kavels B1 tot en met B27.
    url: https://wetten.overheid.nl/BWBR0014740/2024-11-26#Artikel7
  - number: '7.3'
    text: |-
      De frequentieruimte, aangewezen in het tweede lid, wordt niet gebruikt voor het uitzenden van een radioprogramma
      dat wordt uitgezonden met gebruikmaking van een vergunning voor landelijke commerciële radio-omroep in de FM-band.
    url: https://wetten.overheid.nl/BWBR0014740/2024-11-26#Artikel7
  - number: '9'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0014740/2024-11-26#Artikel9
  - number: '10'
    text: 'Deze regeling wordt aangehaald als: Regeling aanwijzing en gebruik frequentieruimte commerciële radio-omroep 2003.'
    url: https://wetten.overheid.nl/BWBR0014740/2024-11-26#Artikel10
