        artikel: '1'
  - number: '2.1'
    text: |-
      De frequentieruimte in de FM-band, aangewezen in het tweede lid, wordt slechts gebruikt voor het uitzenden
      van radioprogramma's van commerciële omroepinstellingen, die overwegend bestaan uit nieuws, actualiteiten en
      informatie, gericht op de Nederlandse samenleving. Een radioprogramma wordt aangemerkt als een radioprogramma,
      bedoeld in de vorige volzin, indien:
    url: https://wetten.overheid.nl/BWBR0014740/2017-09-01#Artikel2
  - number: 2.1.a
    text: het radioprogramma in elk geval wordt uitgezonden gedurende de uren van 07.00 uur tot 19.00 uur;
    url: https://wetten.overheid.nl/BWBR0014740/2017-09-01#Artikel2
  - number: 2.1.b
    text: |-
      het radioprogramma tussen 07.00 uur en 19.00 uur ten minste 50 procent nieuws, actualiteiten en informatie bevat;
      en
    url: https://wetten.overheid.nl/BWBR0014740/2017-09-01#Artikel2
  - number: 2.1.c
    text: |-
      in het radioprogramma tussen 07.00 uur en 19.00 uur en tussen 19.00 uur en 23.00 uur, voor zover in laatstgenoemde
      uren wordt uitgezonden, ten minste eenmaal per uur op het hele uur en tussen 23.00 uur en 07.00 uur, voor zover in
      deze uren wordt uitgezonden, ten minste eenmaal per twee uur op het hele uur een programmaonderdeel bestaande uit
      nieuws is opgenomen.
    url: https://wetten.overheid.nl/BWBR0014740/2017-09-01#Artikel2
  - number: '2.2'
    text: |-
      Als frequentieruimte, bedoeld in het eerste lid, wordt aangewezen: de frequentieruimte in de kavel A4, bedoeld in
      tabel 2 van bijlage 1 van de Regeling aanvraag en vergelijkende toets vergunningen commerciële radio-omroep 2003.
    url: https://wetten.overheid.nl/BWBR0014740/2017-09-01#Artikel2
  - number: '2.3'
    text: |-
      Bij de toepassing van het eerste lid, onderdeel b, wordt de zendtijd besteed aan reclameboodschappen buiten
      beschouwing gelaten.
    url: https://wetten.overheid.nl/BWBR0014740/2017-09-01#Artikel2
  - number: '2.4'
    text: |-
      Het eerste tot en met derde lid zijn niet van toepassing indien met toepassing van artikel 2, derde lid, van de
      Regeling aanvraag en vergelijkende toets vergunningen commerciële radio-omroep 2003, de in het tweede lid bedoelde
      frequentieruimte wordt bestemd voor ongeclausuleerde landelijke commerciële radio-omroep.
    url: https://wetten.overheid.nl/BWBR0014740/2017-09-01#Artikel2
  - number: '3.1'
    text: |-
      De frequentieruimte in de FM-band, aangewezen in het tweede lid, wordt slechts gebruikt voor het uitzenden van
      een radioprogramma van een commerciële omroepinstelling, dat overwegend bestaat uit Nederlandstalige muziek. Een
      radioprogramma wordt aangemerkt als een radioprogramma, bedoeld in de vorige volzin, indien:
    url: https://wetten.overheid.nl/BWBR0014740/2017-09-01#Artikel3
  - number: 3.1.a
    text: het radioprogramma in elk geval wordt uitgezonden gedurende de uren van 07.00 uur tot 19.00 uur;
    url: https://wetten.overheid.nl/BWBR0014740/2017-09-01#Artikel3
  - number: 3.1.b
    text: het radioprogramma tussen 07.00 uur en 19.00 uur ten minste 30 procent Nederlandstalige muziek bevat;
    url: https://wetten.overheid.nl/BWBR0014740/2017-09-01#Artikel3
  - number: 3.1.c
    text: |-
      het radioprogramma tussen 07.00 uur en 19.00 uur ten minste 20 procent muziek, andere dan bedoeld in onderdeel b,
      van Europese producties bevat; en
    url: https://wetten.overheid.nl/BWBR0014740/2017-09-01#Artikel3
  - number: 3.1.d
    text: |-
      het radioprogramma tussen 07.00 uur en 19.00 uur ten minste 10 procent muziek als bedoeld in onderdeel b of c bevat
      van muziekproducties die niet langer dan één jaar geleden zijn uitgebracht.
    url: https://wetten.overheid.nl/BWBR0014740/2017-09-01#Artikel3
  - number: '3.2'
    text: |-
      Als frequentieruimte, bedoeld in het eerste lid, wordt aangewezen: de frequentieruimte in de kavel A9, bedoeld in
      tabel 2 van bijlage 1 van de Regeling aanvraag en vergelijkende toets vergunningen commerciële radio-omroep 2003.
    url: https://wetten.overheid.nl/BWBR0014740/2017-09-01#Artikel3
  - number: '3.3'
    text: |-
      Voor de toepassing van het eerste lid worden als Europese producties aangemerkt muziekproducties die met
      overeenkomstige toepassing van de criteria van [artikel 6][ref1] van de Europese richtlijn als Europese productie
      kunnen worden aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0014740#Artikel6
    url: https://wetten.overheid.nl/BWBR0014740/2017-09-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0014740
        artikel: '6'
  - number: '3.4'
    text: |-
      Bij de toepassing van het eerste lid, onderdelen b tot en met d, wordt de zendtijd besteed aan reclameboodschappen
      en nieuws buiten beschouwing gelaten.
    url: https://wetten.overheid.nl/BWBR0014740/2017-09-01#Artikel3
  - number: '3.5'
    text: |-
      Het eerste tot en met vierde lid zijn niet van toepassing indien met toepassing van artikel 2, derde lid, van de
      Regeling aanvraag en vergelijkende toets vergunningen commerciële radio-omroep 2003, de in het tweede lid bedoelde
      frequentieruimte wordt bestemd voor ongeclausuleerde landelijke commerciële radio-omroep.
    url: https://wetten.overheid.nl/BWBR0014740/2017-09-01#Artikel3
  - number: '4.1'
    text: |-
      De frequentieruimte in de FM-band, aangewezen in het tweede lid, wordt slechts gebruikt voor het uitzenden van
      radioprogramma's van commerciële omroepinstellingen, die overwegend bestaan uit klassieke muziek, moderne klassieke
      muziek daaronder begrepen, of jazzmuziek. Een radioprogramma wordt aangemerkt als een radioprogramma, bedoeld in de
      vorige volzin, indien:
    url: https://wetten.overheid.nl/BWBR0014740/2017-09-01#Artikel4
  - number: 4.1.a
    text: het radioprogramma in elk geval wordt uitgezonden gedurende de uren van 07.00 uur tot 19.00 uur; en
    url: https://wetten.overheid.nl/BWBR0014740/2017-09-01#Artikel4
  - number: 4.1.b
    text: |-
      het radioprogramma tussen 07.00 uur en 19.00 uur ten minste 50 procent klassieke muziek, moderne klassieke muziek
      daaronder begrepen, of jazzmuziek bevat.
    url: https://wetten.overheid.nl/BWBR0014740/2017-09-01#Artikel4
  - number: '4.2'
    text: |-
      Als frequentieruimte als bedoeld in het eerste lid wordt aangewezen: de frequentieruimte behorend bij kavel A8,
      bedoeld in het [besluit van de Minister van Economische Zaken, Landbouw en Innovatie van 26 april 2011, nr. AT-
      EL&I/ 6614918, houdende de vaststelling van twee vergunningen voor landelijke commerciële radio-omroep (kavels A7
      en A8) alsmede twee vergunningen voor digitale radio-omroep](onbekend) (Stcrt. 2011, 7602).
    url: https://wetten.overheid.nl/BWBR0014740/2017-09-01#Artikel4
  - number: '4.3'
    text: |-
      Bij de toepassing van het eerste lid, onderdeel b, wordt de zendtijd besteed aan reclameboodschappen en nieuws
      buiten beschouwing gelaten.
    url: https://wetten.overheid.nl/BWBR0014740/2017-09-01#Artikel4
  - number: '4.4'
    text: |-
      Het eerste tot en met derde lid zijn niet van toepassing indien de Minister van Economische Zaken in
      overeenstemming met de minister besluit dat de in het tweede lid bedoelde frequentieruimte wordt bestemd voor
      ongeclausuleerde landelijke commerciële radio-omroep.
    url: https://wetten.overheid.nl/BWBR0014740/2017-09-01#Artikel4
  - number: '5.1'
    text: |-
      De frequentieruimte in de FM-band, aangewezen in het tweede lid, wordt slechts gebruikt voor het uitzenden
      van radioprogramma's van commerciële omroepinstellingen, die overwegend bestaan uit bijzondere muziek. Een
      radioprogramma wordt aangemerkt als een radioprogramma, bedoeld in de vorige volzin, indien:
    url: https://wetten.overheid.nl/BWBR0014740/2017-09-01#Artikel5
  - number: 5.1.a
    text: het radioprogramma in elk geval wordt uitgezonden gedurende de uren van 07.00 uur tot 19.00 uur;
    url: https://wetten.overheid.nl/BWBR0014740/2017-09-01#Artikel5
  - number: 5.1.b
    text: het radioprogramma tussen 07.00 uur en 19.00 uur ten minste 50 procent muziek bevat;
    url: https://wetten.overheid.nl/BWBR0014740/2017-09-01#Artikel5
  - number: 5.1.c
    text: |-
      het radioprogramma tussen 07.00 uur en 19.00 uur ten hoogste 25 procent muziek bevat die genoteerd staat of heeft
      gestaan op een van de gangbare hitlijsten voor popmuziek in Nederland, waarbij hitnoteringen van vijf jaar of
      langer geleden niet meetellen; en
    url: https://wetten.overheid.nl/BWBR0014740/2017-09-01#Artikel5
  - number: 5.1.d
    text: |-
      het radioprogramma tussen 07.00 uur en 19.00 uur minder dan 50 procent klassieke muziek, moderne klassieke muziek
      daaronder begrepen, of jazzmuziek bevat.
    url: https://wetten.overheid.nl/BWBR0014740/2017-09-01#Artikel5
  - number: '5.2'
    text: |-
      Als frequentieruimte, bedoeld in het eerste lid, wordt aangewezen: de frequentieruimte in de kavel A2, bedoeld in
      tabel 2 van bijlage 1 van de Regeling aanvraag en vergelijkende toets vergunningen commerciële radio-omroep 2003.
    url: https://wetten.overheid.nl/BWBR0014740/2017-09-01#Artikel5
  - number: '5.3'
    text: |-
      Bij de toepassing van het eerste lid, onderdelen b tot en met d, wordt de zendtijd besteed aan reclameboodschappen
      en nieuws buiten beschouwing gelaten.
    url: https://wetten.overheid.nl/BWBR0014740/2017-09-01#Artikel5
  - number: '5.4'
    text: |-
      Het eerste tot en met derde lid zijn niet van toepassing indien met toepassing van artikel 2, derde lid, van de
      Regeling aanvraag en vergelijkende toets vergunningen commerciële radio-omroep 2003, de in het tweede lid bedoelde
      frequentieruimte wordt bestemd voor ongeclausuleerde landelijke commerciële radio-omroep.
    url: https://wetten.overheid.nl/BWBR0014740/2017-09-01#Artikel5
  - number: '6.1'
    text: |-
      De frequentieruimte in de FM-band, aangewezen in het tweede lid, wordt slechts gebruikt voor het uitzenden
      van radioprogramma's van commerciële omroepinstellingen, die overwegend bestaan uit bijzondere muziek. Een
      radioprogramma wordt aangemerkt als een radioprogramma, bedoeld in de vorige volzin, indien:
    url: https://wetten.overheid.nl/BWBR0014740/2017-09-01#Artikel6
  - number: 6.1.a
    text: het radioprogramma in elk geval wordt uitgezonden gedurende de uren van 07.00 uur tot 19.00 uur;
    url: https://wetten.overheid.nl/BWBR0014740/2017-09-01#Artikel6
  - number: 6.1.b
    text: het radioprogramma tussen 07.00 uur en 19.00 uur ten minste 50 procent muziek bevat;
    url: https://wetten.overheid.nl/BWBR0014740/2017-09-01#Artikel6
  - number: 6.1.c
    text: |-
      het radioprogramma tussen 07.00 uur en 19.00 uur ten hoogste 25 procent muziek bevat die genoteerd staat of heeft
      gestaan op een van de gangbare hitlijsten voor popmuziek in Nederland;
    url: https://wetten.overheid.nl/BWBR0014740/2017-09-01#Artikel6
  - number: 6.1.d
    text: |-
      het radioprogramma tussen 07.00 uur en 19.00 uur ten minste 10 procent muziek bevat van muziekproducties die niet
      langer dan één jaar geleden zijn uitgebracht; en
    url: https://wetten.overheid.nl/BWBR0014740/2017-09-01#Artikel6
  - number: 6.1.e
    text: |-
      het radioprogramma tussen 07.00 uur en 19.00 uur minder dan 50 procent klassieke muziek, moderne klassieke muziek
      daaronder begrepen, of jazzmuziek bevat.
    url: https://wetten.overheid.nl/BWBR0014740/2017-09-01#Artikel6
  - number: '6.2'
    text: |-
      Als frequentieruimte, bedoeld in het eerste lid, wordt aangewezen: de frequentieruimte in de kavel A5, bedoeld in
      tabel 2 van bijlage 1 van de Regeling aanvraag en vergelijkende toets vergunningen commerciële radio-omroep 2003.
    url: https://wetten.overheid.nl/BWBR0014740/2017-09-01#Artikel6
  - number: '6.3'
    text: |-
      Bij de toepassing van het eerste lid, onderdelen b tot en met e, wordt de zendtijd besteed aan reclameboodschappen
      en nieuws buiten beschouwing gelaten.
    url: https://wetten.overheid.nl/BWBR0014740/2017-09-01#Artikel6
  - number: '6.4'
    text: |-
      Het eerste tot en met derde lid zijn niet van toepassing indien met toepassing van artikel 2, derde lid, van de
      Regeling aanvraag en vergelijkende toets vergunningen commerciële radio-omroep 2003, de in het tweede lid bedoelde
      frequentieruimte wordt bestemd voor ongeclausuleerde landelijke commerciële radio-omroep.
    url: https://wetten.overheid.nl/BWBR0014740/2017-09-01#Artikel6
  - number: '7.1'
    text: |-
      De frequentieruimte in de FM-band, aangewezen in het tweede lid, wordt slechts gebruikt voor het uitzenden van
      regionale radioprogramma's van commerciële omroepinstellingen die in het bijzonder gericht zijn op het gebied
      waarvoor de programma’s zijn bestemd. Een radioprogramma wordt aangemerkt als een radioprogramma, bedoeld in de
      vorige volzin, indien:
    url: https://wetten.overheid.nl/BWBR0014740/2017-09-01#Artikel7
  - number: 7.1.a
    text: het radioprogramma in elk geval wordt uitgezonden gedurende de uren van 07.00 uur tot 19.00 uur;
    url: https://wetten.overheid.nl/BWBR0014740/2017-09-01#Artikel7
  - number: 7.1.b
    text: |-
      het radioprogramma tussen 07.00 uur en 19.00 uur voor ten minste 10 procent in het bijzonder gericht is op het
      gebied waarvoor het programma is bestemd, waarbij tot 1 september 2022 geldt dat het gebied waarvoor het programma
      bestemd is tevens omvat het gebied dat behoort bij het het allotment, bedoeld in nationale voetnoot 006 van het
      Nationaal Frequentieplan 2014, dat gekoppeld is aan de betreffende kavel, en
    url: https://wetten.overheid.nl/BWBR0014740/2017-09-01#Artikel7
  - number: 7.1.c
    text: |-
      verzorgd wordt door een commerciële omroepinstelling, waarvan alle door haar verzorgde en via omroepnetwerken
      analoog uitgezonden programma's tezamen door niet meer dan 30 procent van het aantal inwoners van Nederland kunnen
      worden ontvangen.
    url: https://wetten.overheid.nl/BWBR0014740/2017-09-01#Artikel7
  - number: '7.2'
    text: |-
      Als frequentieruimte, bedoeld in het eerste lid, wordt aangewezen de voor niet-landelijke commerciële radio-omroep
      bestemde kavels B1 tot en met B38.
    url: https://wetten.overheid.nl/BWBR0014740/2017-09-01#Artikel7
  - number: '7.3'
    text: |-
      Bij de toepassing van het eerste lid, onderdeel b, wordt de zendtijd besteed aan reclameboodschappen buiten
      beschouwing gelaten.
    url: https://wetten.overheid.nl/BWBR0014740/2017-09-01#Artikel7
  - number: '7.4'
    text: |-
      De frequentieruimte, aangewezen in het tweede lid, wordt niet gebruikt voor het uitzenden van een radioprogramma
      dat wordt uitgezonden met gebruikmaking van een vergunning voor landelijke commerciële radio-omroep in de FM-band.
    url: https://wetten.overheid.nl/BWBR0014740/2017-09-01#Artikel7
  - number: '8.1'
    text: |-
      In afwijking van [artikel 6.24, eerste lid, van de Mediawet 2008][ref1], mogen voor de uitzending via de FM-
      band van radioprogramma’s, andere dan bedoeld in [artikel 7, eerste lid][ref2], van eenzelfde commerciële
      omroepinstelling ten hoogste vier FM-frequenties of samenstellen van FM-frequenties worden gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0014740#Artikel7
    url: https://wetten.overheid.nl/BWBR0014740/2017-09-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0014740
        artikel: '7'
  - number: '8.2'
    text: |-
      In afwijking van [artikel 6.24, eerste lid, van de Mediawet 2008][ref1], mag voor de uitzending via de FM-band van
      radioprogramma's als bedoeld in [artikel 7, eerste lid][ref2], van eenzelfde commerciële omroepinstelling meer dan
      één FM-frequentie of samenstel van FM-frequenties, behorende tot de in [artikel 7, tweede lid][ref3], aangewezen
      frequentieruimte, worden gebruikt, mits


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0014740#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0014740#Artikel7
    url: https://wetten.overheid.nl/BWBR0014740/2017-09-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0014740
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0014740
        artikel: '7'
  - number: 8.2.a
    text: |-
      het demografisch bereik van de desbetreffende FM-frequenties of samenstellen van FM-frequenties tezamen niet meer
      bedraagt dan 30 procent; en
    url: https://wetten.overheid.nl/BWBR0014740/2017-09-01#Artikel8
  - number: 8.2.b
    text: |-
      er geen sprake is van een combinatie als bedoeld in
      [bijlage 2a van de Regeling aanvraag en vergelijkende toets vergunningen commerciële radio-omroep 2003][ref1]
      en [bijlage 2 van de Regeling aanvraag en vergelijkende toets vergunningen commerciële radio-omroep 2007][ref2]
      en, voor zover het betreft de kavels B2, B11 en B26,
      [bijlage 2a van de Regeling vervolg verdeling frequenties commerciële radio-omroep 2003][ref3], waarbij het
      demografisch bereik van de kleinste FM-frequentie of samenstel van FM-frequenties voor 35 procent of meer valt
      binnen het demografisch bereik van de andere FM-frequentie of samenstel van FM-frequenties, dan wel, indien
      dit percentage lager is dan 35 procent, meer dan 100.000 inwoners binnen het demografisch bereik van beide FM-
      frequenties of samenstellen van FM-frequenties vallen.


      [ref1]: https://wetten.overheid.nl/BWBR0014741
      [ref2]: https://wetten.overheid.nl/BWBR0022818
      [ref3]: https://wetten.overheid.nl/BWBR0015414
    url: https://wetten.overheid.nl/BWBR0014740/2017-09-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0014741
      - id: ref2
        bwb_id: BWBR0022818
      - id: ref3
        bwb_id: BWBR0015414
  - number: '8.3'
    text: |-
      Het tweede lid, onderdeel b, geldt niet voor combinaties die mede bestaan
      uit frequenties of samenstellen van frequenties die met toepassing van de
      [Regeling aanvraag- en veilingprocedure voor vergunningen kavels B27 en B31][ref1] zijn verdeeld of voor
      combinaties die mede bestaan uit frequenties of samenstellen van frequenties die na inwerkingtreding van die
      regeling zijn verdeeld overeenkomstig [artikel 3.10 van de Telecommunicatiewet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0038511
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0014740/2017-09-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0038511
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '3'
  - number: '9'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0014740/2017-09-01#Artikel9
  - number: '10'
    text: 'Deze regeling wordt aangehaald als: Regeling aanwijzing en gebruik frequentieruimte commerciële radio-omroep 2003.'
    url: https://wetten.overheid.nl/BWBR0014740/2017-09-01#Artikel10
