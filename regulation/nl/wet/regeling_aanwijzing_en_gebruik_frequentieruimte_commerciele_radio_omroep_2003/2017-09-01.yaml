      In deze regeling wordt verstaan onder demografisch bereik: het demografisch bereik, bedoeld in
      __REF000___________________________________________________________________________________________________________
      ________, en
      [artikel 1, onderdeel m, van de Regeling vervolg verdeling frequenties commerciële radio-omroep 2003][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0014741#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0015414#Artikel1
    url: https://wetten.overheid.nl/BWBR0014740/2017-09-01#Artikel1
