valid_to: '2008-12-31'
bwb_id: BWBR0019015
url: https://wetten.overheid.nl/BWBR0019015/2005-11-24
preamble:
  text: 'Besluit:'
  url: https://wetten.overheid.nl/BWBR0019015/2005-11-24#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. fonds: de Stichting Fonds voor Podiumprogrammering en Marketing, gevestigd te Den Haag;

      b. commissie: de commissie die aan het fonds een advies uitbrengt als bedoeld in artikel 8 van de statuten van het
      Fonds voor Podiumprogrammering en Marketing gevestigd te Den Haag;

      c. festival: reeks van presentaties op het gebied van de podiumkunsten met inhoudelijke samenhang, onder één noemer
      gepresenteerd en van een beperkte tijdsduur;

      d. festivalorganisatie: organisatie waarvan het organiseren van festivals uit de statutaire doelstellingen valt af
      te leiden;

      e. concours:

        - (met regelmaat terugkerende) wedstrijd op het gebied van podiumkunsten waar het dingen naar een uitgeschreven
      prijs centraal staat;
        - organisatie waarvan statutair is vastgelegd dat het produceren van een concours of concoursen de kerntaak is;

      f. podium:

        - een faciliteit bestemd voor de presentatie van podiumkunsten, of
        - een organisatie/vereniging zonder winstoogmerk, niet zijnde een podiumkunstaanbieder of impresario, die met
      regelmaat openbaar toegankelijke voorstellingen op het gebied van podiumkunsten programmeert of doet programmeren;
        - een vereniging of koepelorganisatie van de hiervoor genoemde faciliteiten of organisaties;

      g. podiumkunstaanbieder: de producent van podiumkunst (theater- of dansgezelschap; muziekensemble; individuele
      musici, dj’s, acteurs, dansers, performers);

      h. marketing: afstemming op de markt met behulp van instrumenten zoals product, promotie, prijs, plaats, personeel
      en partners.

      Waar in deze regeling ‘festivalorganisatie’ staat kan ook ‘concours’ of ‘podium’ worden gelezen.
    url: https://wetten.overheid.nl/BWBR0019015/2005-11-24#Artikel1
  - number: '2'
    text: |-
      Het doel van de subsidieregeling is om met subsidie festivalorganisaties in staat te stellen:

      a. veelzijdigheid tot stand te brengen in de programmering van podiumkunsten;

      b. in te zetten op het optimaal bereiken van (potentieel) publiek;

      c. de programmering af te stemmen op een landelijke spreiding.
    url: https://wetten.overheid.nl/BWBR0019015/2005-11-24#Artikel2
  - number: '3'
    text: |-
      Een aanvrager voldoet aan de volgende verplichtingen:

      a. de aanvrager is in Nederland gevestigd;

      b. de aanvrager bezit rechtspersoonlijkheid.
    url: https://wetten.overheid.nl/BWBR0019015/2005-11-24#Artikel3
  - number: '4'
    text: |-
      Subsidie kan uitsluitend worden aangevraagd door festivalorganisaties, concoursen en podia waarvan de statutaire
      doelstellingen van artistiek-inhoudelijke aard zijn.
    url: https://wetten.overheid.nl/BWBR0019015/2005-11-24#Artikel4
  - number: '5'
    text: |-
      1 De aanvraag dient te voldoen aan de volgende voorwaarden:

      a. het festival vindt plaats in Nederland;

      b. het festival is openbaar toegankelijk;

      c. het festival programmeert professioneel podiumkunstaanbod;

      d. de gesubsidieerde activiteiten hebben een in de tijd beperkt karakter (één, twee of maximaal drie jaar).

      2 Het aantal aanvragen per aanvrager

      Indien reeds een meerjarige aanvraag in het kader van deze regeling is gehonoreerd, is het niet mogelijk voor de
      aanvrager gedurende de subsidieperiode één- of meerjarige festivalaanvragen te doen bij het fonds.

      3 Bij de aanvraag overlegt u bij een eerste subsidieverzoek aan het fonds:

      a. een afschrift van de oprichtingsakte of statuten;

      b. een afschrift, niet ouder dan twaalf maanden, waaruit de inschrijving van de aanvrager in het geldende openbaar
      register blijkt.
    url: https://wetten.overheid.nl/BWBR0019015/2005-11-24#Artikel5
  - number: '6'
    text: |-
      De subsidiabele kosten zijn:

      a. de kosten van specifiek te benoemen risicovolle programmaonderdelen alsmede de kosten voor de marketing voor
      zover deze betrekking hebben op deze programmaonderdelen, en/of

      b. de kosten voor extra te ontwikkelen marketingactiviteiten van het festival in zijn totaliteit.

      In het plan dient aannemelijk te zijn gemaakt dat de beschikbare financiële middelen, met inbegrip van de
      financiële steun verleend door het fonds, voldoende zijn om het project uit te voeren.

      Voor zover de aanvrager voor dezelfde begrote uitgaven tevens financiële steun heeft aangevraagd bij één of meer
      andere bestuursorganen of particuliere fondsen of sponsors, doet hij daarvan mededeling in de aanvraag, onder
      vermelding van de stand van zaken met betrekking tot de beoordeling van die aanvraag of aanvragen.

      In de begroting zijn de uitkoopsommen/partageregelingen vermeld. Festivalorganisaties dienen reële afspraken met
      podiumkunstaanbieders te maken over de te betalen uitkoopsommen. Uitgangspunt daarbij wordt gevormd door de in de
      sector gangbare salaris- en honorariumregelingen.

      In de begroting wordt de verhouding tussen de eigen inkomsten (recettes, uitkoopsommen, partageregelingen),
      sponsorgelden, bijdragen van particuliere fondsen, provinciale of lokale overheden en de uitvoeringskosten
      duidelijk beschreven.
    url: https://wetten.overheid.nl/BWBR0019015/2005-11-24#Artikel6
  - number: '7'
    text: |-
      Voor het indienen van aanvragen wordt gebruik gemaakt van het aanvraagformulier ‘Festivalregeling’ van het fonds.
      Dit formulier kan worden gedownload van www.fppm.nl of bij het fonds worden opgevraagd.

      De aanvraag dient in tienvoud naar het Fonds voor Podiumprogrammering en Marketing te worden gezonden onder
      vermelding ‘Aanvraag Festivalregeling’ op de envelop.
    url: https://wetten.overheid.nl/BWBR0019015/2005-11-24#Artikel7
  - number: '8'
    text: |-
      Subsidieaanvragen kunnen het gehele jaar worden ingediend, maar het fonds behandelt ingediende aanvragen in twee
      subsidierondes per jaar. Hierbij gelden de volgende bepalingen:

        - één- of meerjarige aanvragen voor festivals die plaatsvinden in de periode februari tot en met augustus worden
      uiterlijk medio november van het voorafgaande jaar ingediend;
        - één- of meerjarige aanvragen voor festivals die plaatsvinden in de periode september tot en met februari van het
      volgend jaar worden ingediend uiterlijk medio maart van het jaar waarin deze septembermaand valt;
        - een eenjarige aanvraag heeft altijd betrekking op het eerstvolgend festival;
        - een meerjarige aanvraag heeft altijd betrekking op de periode vanaf het eerstvolgend festival.

      De uiterlijke indiendata van de subsidierondes kunnen per jaar verschillen en worden vermeld op www.fppm.nl of zijn
      bij het fonds telefonisch op te vragen.
    url: https://wetten.overheid.nl/BWBR0019015/2005-11-24#Artikel8
  - number: '9'
    text: |-
      Aanvragen worden bij ontvangst getoetst op volledigheid. Aanvragers van wie het subsidieverzoek niet voldoet aan de
      [artikelen 3 tot en met 8][ref1] worden in de gelegenheid gesteld om de aanvraag binnen een termijn van twee weken
      aan te vullen. Aanvragen die dan nog niet volledig zijn worden niet in behandeling genomen.

      Het fonds maakt gebruik van een commissie die adviseert over de subsidieaanvragen. Tijdens de behandeling van een
      aanvraag wordt over de voortgang daarvan geen informatie verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0019015#Artikel3
    url: https://wetten.overheid.nl/BWBR0019015/2005-11-24#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0019015
        artikel: '3'
  - number: '10'
    text: |-
      De commissie beoordeelt de aanvragen aan de hand van de onderstaande toetsingscriteria. Acceptatie van de aanvraag
      is afhankelijk van de mate waarin de aanvraag beantwoordt aan deze criteria:

      1. Programmering

      De programmering levert een bijdrage aan de (meerjarige) artistieke visie die ten grondslag ligt aan het festival.

      2. Marketing

      De marketingstrategie bevordert een gevarieerder en/of groter publieksbereik.

      3. Spreiding

      Het festival levert een bijdrage aan de spreiding van de podiumkunsten in Nederland of de regio.

      4. Bedrijfsvoering

      De kwaliteit van het festival op het gebied van productie, organisatie en financieel beheer.
    url: https://wetten.overheid.nl/BWBR0019015/2005-11-24#Artikel10
  - number: '11'
    text: |-
      1 Het Fonds besluit na uiterlijk acht weken, gerekend vanaf de voor dat jaar vastgestelde uiterlijke
      indiendata, over de subsidieaanvraag met inachtneming van het advies van de commissie. Indien de beschikking
      tot subsidieverlening niet binnen acht weken kan worden gegeven, stelt het fonds de aanvrager daarvan in kennis
      en noemt daarbij de termijn waarbinnen de beschikking tegemoet gezien kan worden. Het advies wordt met de
      subsidiebeschikking meegezonden. Wanneer het bestuur van het fonds afwijkt van het advies van de commissie wordt
      dit besluit gemotiveerd.

      2 De beschikking vermeldt de hoogte van de verleende subsidie en voor welke activiteiten en voor welke periode de
      subsidieverlening geldt. In de beschikking kunnen voorwaarden en nadere verplichtingen worden vermeld.
    url: https://wetten.overheid.nl/BWBR0019015/2005-11-24#Artikel11
  - number: '12'
    text: |-
      Het subsidieplafond kan per kalenderjaar verschillen en wordt voor het betreffende jaar gepubliceerd in de
      Staatscourant en op www.fppm.nl. Gepubliceerd wordt het budget dat totaal voor de Festivalregeling beschikbaar
      is in dat jaar en het maximumbedrag dat per festivalorganisatie per jaar kan worden aangevraagd. Subsidie wordt
      slechts verleend voorzover de middelen van het fonds toereikend zijn. Onder meer vanwege de beperkte hoeveelheid
      middelen kan het voorkomen dat het fonds niet alle aanvragen kan honoreren of aanvragen met een positief advies
      voor het gevraagde bedrag kan honoreren.

      De wijze waarop het budget over de verschillende aanvragen wordt verdeeld ingeval van krapte, wordt tegelijk met de
      bekendmaking van het subsidieplafond bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0019015/2005-11-24#Artikel12
  - number: '13'
    text: |-
      Indien uw aanvraag wordt gehonoreerd gelden de subsidieverplichtingen die deel uitmaken van de Festivalregeling.
      Deze zijn opgenomen in Bijlage 1 – Subsidieverplichtingen Festivalregeling.
    url: https://wetten.overheid.nl/BWBR0019015/2005-11-24#Artikel13
  - number: '14'
    text: |-
      Een aanvrager kan bezwaar maken tegen een beslissing van het fonds. Op de bezwaarschriftenprocedure is de
      [Algemene wet bestuursrecht][ref1] van toepassing. Indien een brief van het Fonds een beslissing bevat staan in de
      brief de rechtsmiddelen aangegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0019015/2005-11-24#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0005537
  - number: '15'
    text: Deze regeling zal met de toelichting en bijlagen in de Staatscourant worden gepubliceerd.
    url: https://wetten.overheid.nl/BWBR0019015/2005-11-24#Artikel15
  - number: '16'
    text: Deze regeling treedt in werking met ingang van de derde dag na de datum van uitgifte van de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0019015/2005-11-24#Artikel16
