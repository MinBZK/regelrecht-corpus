preamble:
  text: |-
    Wij WILHELMINA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of hooren lezen, salut! doen te weten:

    Alzoo Wij in overweging genomen hebben, dat wettelijke maatregelen noodig zijn tegen aantasting van metalen
    voorwerpen in den bodem door zwerfstroomen, afkomstig van de spoorstaven van electrische spoor- en tramwegen;

    Zoo is het, dat Wij, den Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0001921/2009-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Deze wet is van toepassing op de bij de [Spoorwegwet][ref1] of bij een der
      [artikelen 1, 6 of 8 der Locaalspoor- en Tramwegwet][ref2] bedoelde spoor- en tramwegen, op welke vervoer
      plaats heeft door middel van als gelijkstroom opgewekte electriciteit en met terugleiding van den stroom door de
      spoorstaven.


      [ref1]: https://wetten.overheid.nl/BWBR0001848
      [ref2]: https://wetten.overheid.nl/BWBR0001866#Artikel1
    url: https://wetten.overheid.nl/BWBR0001921/2009-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001848
      - id: ref2
        bwb_id: BWBR0001866
        artikel: '1'
  - number: '2.1'
    text: |-
      Ter voorkoming van aantasting van metalen voorwerpen in den bodem door zwerfstroomen, afkomstig van de spoorstaven,
      worden bij algemeenen maatregel van bestuur bepalingen vastgesteld betreffende de samenstelling van den bovenbouw
      der spoor- en tramwegen en tegen afvloeiing van den electrischen stroom naar den bodem.
    url: https://wetten.overheid.nl/BWBR0001921/2009-07-01#Artikel2
  - number: '2.2'
    text: |-
      In den algemeenen maatregel van bestuur wordt omschreven, in hoeverre van zijne bepalingen ontheffing kan worden
      verleend ten aanzien van niet op openbare wegen aangelegde gedeelten van spoor- en tramwegen, en ten aanzien van de
      spoor- en tramwegen, waarop bij het in werking treden dezer wet de dienst wordt uitgeoefend.
    url: https://wetten.overheid.nl/BWBR0001921/2009-07-01#Artikel2
  - number: '3.1'
    text: |-
      Ingeval van kruising van spoor- of tramwegen en van onderlinge nadering tot bij den algemeenen maatregel van
      bestuur, bedoeld bij [artikel 2][ref1], te bepalen afstanden worden de kosten van de krachtens dien algemeenen
      maatregel te treffen voorzieningen omgeslagen over de ondernemers.


      [ref1]: https://wetten.overheid.nl/BWBR0001921#Artikel2
    url: https://wetten.overheid.nl/BWBR0001921/2009-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0001921
        artikel: '2'
  - number: '3.2'
    text: Bij gebreke van overeenstemming beslist Onze Minister van Verkeer en Waterstaat.
    url: https://wetten.overheid.nl/BWBR0001921/2009-07-01#Artikel3
  - number: '4.1'
    text: |-
      Overtreding van de bij [artikel 2][ref1] bedoelde algemene maatregel van bestuur wordt gestraft met geldboete van
      de tweede categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0001921#Artikel2
    url: https://wetten.overheid.nl/BWBR0001921/2009-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0001921
        artikel: '2'
  - number: '4.2'
    text: |-
      De beambten en bedienden van een spoor- of tramwegdienst zijn niet strafbaar, zoo hunne overtreding een gevolg is
      van den last, door de bestuurders van zoodanigen dienst gegeven.
    url: https://wetten.overheid.nl/BWBR0001921/2009-07-01#Artikel4
  - number: '4.4'
    text: De krachtens het eerste lid strafbaar gestelde feiten worden beschouwd als overtredingen.
    url: https://wetten.overheid.nl/BWBR0001921/2009-07-01#Artikel4
  - number: '5.1'
    text: |-
      Met de opsporing van overtredingen van de in [artikel 2][ref1] bedoelde algemene maatregel van bestuur zijn,
      onverminderd [artikel 141 van het Wetboek van Strafvordering][ref2], belast de daartoe door Onze Minister
      van Verkeer en Waterstaat aangewezen buitengewone opsporingsambtenaren. Deze ambtenaren zijn tevens belast
      met de opsporing van de feiten, strafbaar gesteld in de [artikelen 179][ref3] tot en met [182][ref4] en
      [184 van het Wetboek van Strafrecht][ref5], voor zover deze feiten betrekking hebben op een bevel, vordering of
      handeling, gedaan of ondernomen door henzelf.


      [ref1]: https://wetten.overheid.nl/BWBR0001921#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel141
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel179
      [ref4]: https://wetten.overheid.nl/BWBR0001854#Artikel182
      [ref5]: https://wetten.overheid.nl/BWBR0001854#Artikel184
    url: https://wetten.overheid.nl/BWBR0001921/2009-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0001921
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '141'
      - id: ref3
        bwb_id: BWBR0001854
        artikel: '179'
      - id: ref4
        bwb_id: BWBR0001854
        artikel: '182'
      - id: ref5
        bwb_id: BWBR0001854
        artikel: '184'
  - number: '5.2'
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0001921/2009-07-01#Artikel5
  - number: '5.3'
    text: |-
      De [artikelen 5:13][ref1], [5:15][ref2], [5:16][ref3], [5:17][ref4] en
      [5:20 van de Algemene wet bestuursrecht][ref5] zijn van overeenkomstige toepassing ten aanzien van de in het eerste
      lid bedoelde ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0001921/2009-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref5
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '5.4'
    text: |-
      Onze Minister van Verkeer en Waterstaat is bevoegd tot oplegging van een last onder bestuursdwang ter handhaving
      van de in [artikel 2][ref1] bedoelde algemene maatregel van bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0001921#Artikel2
    url: https://wetten.overheid.nl/BWBR0001921/2009-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0001921
        artikel: '2'
  - number: '5.5'
    text: |-
      Onze Minister van Verkeer en Waterstaat is bevoegd tot oplegging van een last onder bestuursdwang ter handhaving
      van [artikel 5:20 van de Algemene wet bestuursrecht][ref1], voor zover het betreft de verplichting tot het verlenen
      van medewerking aan een krachtens het eerste lid aangewezen ambtenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0001921/2009-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '6'
    text: Deze wet treedt in werking op een nader door Ons te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0001921/2009-07-01#Artikel6
