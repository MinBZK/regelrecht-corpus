  - number: '2'
    text: |-
      Het UWV is, naast de in [artikel 1, onderdelen a tot en met l][ref1], genoemde wetten opgenomen bevoegdheden tot
      verrekening van vorderingen op werknemers, tevens bevoegd tot verrekening van een vordering op de werkgever met een
      aan de werkgever te betalen bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0026017#Artikel1
    url: https://wetten.overheid.nl/BWBR0026017/2025-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0026017
        artikel: '1'
  - number: '3.1'
    text: |-
      Het UWV of de SVB stelt de termijn waarvoor uitstel van betaling wordt verleend, alsmede de daaraan verbonden
      periodieke betalingen en verrekeningen, vast na overleg met de schuldenaar en met inachtneming van dit artikel.
    url: https://wetten.overheid.nl/BWBR0026017/2025-01-01#Artikel3
  - number: '3.2'
    text: |-
      Het UWV of de SVB verleent uitstel van betaling voor ten hoogste 36 maanden. De vordering wordt gedurende die
      periode in termijnen ter hoogte van de volledige aflossingscapaciteit betaald of verrekend.
    url: https://wetten.overheid.nl/BWBR0026017/2025-01-01#Artikel3
  - number: '3.3'
    text: |-
      In afwijking van het tweede lid kan het UWV of de SVB uitstel van betaling verlenen conform een voorstel van de
      schuldenaar indien:
    url: https://wetten.overheid.nl/BWBR0026017/2025-01-01#Artikel3
  - number: 3.3.a
    text: |-
      de schuldenaar uiterlijk zes weken na bekendmaking van een beschikking tot betaling van de vordering een
      gemotiveerd voorstel indient; en
    url: https://wetten.overheid.nl/BWBR0026017/2025-01-01#Artikel3
  - number: 3.3.b
    text: |-
      het voorstel inhoudt dat de gehele vordering binnen 36 maanden, eventueel door middel van periodieke betalingen of
      verrekeningen, wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0026017/2025-01-01#Artikel3
  - number: '3.4'
    text: |-
      In afwijking van het tweede lid kan het UWV of de SVB uitstel van betaling verlenen voor ten hoogste 60
      maanden waarbij de periodieke betaling of verrekening wordt gesteld op een bedrag lager dan de volledige
      aflossingscapaciteit indien:
    url: https://wetten.overheid.nl/BWBR0026017/2025-01-01#Artikel3
  - number: 3.4.a
    text: |-
      de schuldenaar met aanwending van zijn volledige aflossingscapaciteit niet in staat is de vordering binnen
      36 maanden te voldoen, en;
    url: https://wetten.overheid.nl/BWBR0026017/2025-01-01#Artikel3
  - number: 3.4.b
    text: |-
      periodieke betaling of verrekening gedurende ten hoogste 60 maanden leidt tot ten minste dezelfde voldoening van de
      vordering als betaling of verrekening gedurende 36 maanden met volledige aflossingscapaciteit.
    url: https://wetten.overheid.nl/BWBR0026017/2025-01-01#Artikel3
  - number: '3.5'
    text: |-
      Indien het UWV of de SVB vaststelt dat de schuldenaar bij toepassing van het tweede of vierde lid naar verwachting
      de vordering niet volledig zal kunnen voldoen, kan het UWV of de SVB de schuldenaar verplichten zijn vermogen
      binnen een redelijke termijn aan te wenden zodanig dat de resterende vordering naar verwachting wel zal worden
      voldaan bij toepassing van het tweede of vierde lid.
    url: https://wetten.overheid.nl/BWBR0026017/2025-01-01#Artikel3
  - number: '3.6'
    text: |-
      Indien toepassing van dit artikel leidt tot een kennelijk onredelijk resultaat kan het UWV of de SVB afwijken van
      het eerste tot en met vijfde lid.
    url: https://wetten.overheid.nl/BWBR0026017/2025-01-01#Artikel3
  - number: '5'
    text: |-
      Indien de vordering op de schuldenaar niet meer bedraagt dan € 300,– stelt het UWV of de SVB, in afwijking van
      [artikel 3][ref1], de wijze waarop deze vordering moet worden voldaan vast zonder de schuldenaar in de gelegenheid
      te stellen een voorstel te doen met betrekking tot de wijze van voldoening van de vordering, met dien verstande dat
      per periode van een maand de aflossing op niet meer dan € 25,– kan worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0026017#Artikel3
    url: https://wetten.overheid.nl/BWBR0026017/2025-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0026017
        artikel: '3'
  - number: '7'
    text: 'Het UWV en de SVB verbinden aan een beschikking tot uitstel van betaling in ieder geval de voorschriften dat:'
    url: https://wetten.overheid.nl/BWBR0026017/2025-01-01#Artikel7
  - number: 7.a
    text: |-
      de vordering gedurende de periode waarover uitstel van betaling is verleend door middel van betalingen of
      verrekeningen, in periodieken of ineens, wordt voldaan; en
    url: https://wetten.overheid.nl/BWBR0026017/2025-01-01#Artikel7
  - number: 7.b
    text: |-
      de beschikking tot uitstel van betaling kan worden ingetrokken of gewijzigd indien wijziging plaatsvindt in de
      hoogte van de inkomsten van de schuldenaar.
    url: https://wetten.overheid.nl/BWBR0026017/2025-01-01#Artikel7
  - number: '9'
    text: |-
      Tenzij de schuldenaar een andere vordering aanwijst wordt een betaling, die zou kunnen worden toegerekend aan
      meerdere vorderingen, eerst toegerekend aan een verschuldigde bestuurlijke boete.
    url: https://wetten.overheid.nl/BWBR0026017/2025-01-01#Artikel9
  - number: '10'
    text: |-
      [Artikel 3][ref1] is niet van toepassing op de werkgever.


      [ref1]: https://wetten.overheid.nl/BWBR0026017#Artikel3
    url: https://wetten.overheid.nl/BWBR0026017/2025-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0026017
        artikel: '3'
  - number: '11'
    text: |-
      Het UWV en de SVB kunnen op verzoek van de schuldenaar de regeling voor uitstel van betaling die is vastgesteld
      voor 1 januari 2025 herzien conform de regels geldend vanaf 1 januari 2025.
    url: https://wetten.overheid.nl/BWBR0026017/2025-01-01#Artikel11
  - number: '12'
    text: |-
      Deze regeling treedt in werking op het tijdstip waarop de Vierde tranche Algemene wet bestuursrecht in werking
      treedt.
    url: https://wetten.overheid.nl/BWBR0026017/2025-01-01#Artikel12
  - number: '13'
    text: |-
      Deze regeling wordt aangehaald als: Regeling tenuitvoerlegging bestuurlijke boeten en terugvordering
      onverschuldigde betalingen.
    url: https://wetten.overheid.nl/BWBR0026017/2025-01-01#Artikel13
