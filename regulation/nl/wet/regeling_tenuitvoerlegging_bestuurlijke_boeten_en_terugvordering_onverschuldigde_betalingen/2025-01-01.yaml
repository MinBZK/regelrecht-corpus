    text: |-
      *vermogen:* vermogensrechten, onroerende en roerende zaken, waarover de schuldenaar beschikt of redelijkerwijs kan
      beschikken, waarbij niet als vermogen in aanmerking wordt genomen:
    url: https://wetten.overheid.nl/BWBR0026017/2025-01-01#Artikel1
  - number: 1.r.a
    text: |-
      geldmiddelen als bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref1] voor zover het de bedragen
      genoemd in [artikel 475da, eerste lid, van het Wetboek van Burgerlijke Rechtsvordering][ref2] niet overtreft;


