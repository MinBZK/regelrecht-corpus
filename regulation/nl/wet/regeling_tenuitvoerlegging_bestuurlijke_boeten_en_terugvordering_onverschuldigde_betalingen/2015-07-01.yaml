  - number: 10a.2
    text: |-
      Voor zover de hoogte van de toeslag, de uitkering, de kinderbijslag of het ouderdomspensioen daartoe de ruimte
      biedt, is het vrijgelaten deel, bedoeld in het eerste lid, met inachtneming van het vierde en vijfde lid, gelijk
      aan de som van een naar een tijdseenheid te herleiden gedeelte voor:
    url: https://wetten.overheid.nl/BWBR0026017/2015-07-01#Artikel10a
  - number: 10a.2.a
    text: |-
      zorgkosten: € 530 per kalenderjaar voor een alleenstaande en € 1031 per kalenderjaar voor een belanghebbende met
      een echtgenoot of geregistreerd partner met wie hij een gezamenlijke huishouding voert, en
    url: https://wetten.overheid.nl/BWBR0026017/2015-07-01#Artikel10a
  - number: 10a.2.b
    text: |-
      kosten van kinderen: indien de belanghebbende ouder is en voor een kind voor wie aan die ouder op grond van
      [artikel 18 van de Algemene Kinderbijslagwet][ref1] kinderbijslag wordt betaald: 50 procent van het bedrag, bedoeld
      in [artikel 2, tweede lid, van de Wet op het kindgebonden budget][ref2], dat gelet op het aantal kinderen van
      toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0022751#Artikel2
    url: https://wetten.overheid.nl/BWBR0026017/2015-07-01#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '18'
      - id: ref2
        bwb_id: BWBR0022751
        artikel: '2'
  - number: 10a.3
    text: |-
      Voor zover dit artikel berust op [artikel 27h, vijfde lid, van de Werkloosheidswet][ref1] of
      [artikel 17h, vijfde lid, van de Algemene Kinderbijslagwet][ref2] wordt als echtgenoot of geregistreerd partner
      als bedoeld in het tweede lid, onderdeel a, mede aangemerkt de ongehuwde meerderjarige die met een andere ongehuwde
      meerderjarige een gezamenlijke huishouding voert, tenzij het betreft een bloedverwant in de eerste graad. Voor de
      toepassing van de eerste zin wordt mede als ongehuwd aangemerkt degene die duurzaam gescheiden leeft van de persoon
      met wie hij gehuwd is.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel27h
      [ref2]: https://wetten.overheid.nl/BWBR0002368#Artikel17h
    url: https://wetten.overheid.nl/BWBR0026017/2015-07-01#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: 27h
      - id: ref2
        bwb_id: BWBR0002368
        artikel: 17h
  - number: 10a.4
    text: |-
      Voor zover dit artikel berust op [artikel 27h, vijfde lid, van de Werkloosheidswet][ref1] of
      [artikel 17h, vijfde lid, van de Algemene Kinderbijslagwet][ref2] is sprake van een gezamenlijke huishouding,
      bedoeld in het tweede lid, onderdeel a indien twee personen hun hoofdverblijf in dezelfde woning hebben en zij
      blijk geven zorg te dragen voor elkaar door middel van het leveren van een bijdrage in de kosten van de huishouding
      dan wel anderszins.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel27h
      [ref2]: https://wetten.overheid.nl/BWBR0002368#Artikel17h
    url: https://wetten.overheid.nl/BWBR0026017/2015-07-01#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: 27h
      - id: ref2
        bwb_id: BWBR0002368
        artikel: 17h
  - number: 10a.5
    text: |-
      Het bedrag van het vrijgelaten deel, bedoeld in het tweede lid, wordt in verband met woonkosten vermeerderd
      indien de belanghebbende huurder is van een woning met een kale huur van niet meer dan € 681 per maand of mede een
      huurwoning bewoont met zo’n huur.
    url: https://wetten.overheid.nl/BWBR0026017/2015-07-01#Artikel10a
  - number: 10a.6
    text: |-
      De vermeerdering, bedoeld in het vijfde lid, bedraagt 50 procent van een naar tijdseenheid te herleiden bedrag
      gelijk aan het verschil tussen de kale huur per maand minus een basisbedrag van € 222 per maand.
    url: https://wetten.overheid.nl/BWBR0026017/2015-07-01#Artikel10a
  - number: 10a.7
    text: |-
      Onder kale huur als bedoel in het vijfde en zesde lid wordt verstaan de huurprijs die bij huur en verhuur is
      verschuldigd voor het enkele gebruik van een woning.
    url: https://wetten.overheid.nl/BWBR0026017/2015-07-01#Artikel10a
  - number: 10a.8
    text: |-
      De aanvraag, bedoeld in het eerste lid, wordt ingediend bij het UWV indien de verrekening plaatsvindt op grond
      van de [TW][ref1], [WW][ref2], [WAZ][ref3], [IOW][ref4], [WAO][ref5], [Wet Wajong][ref6], [Wet WIA][ref7] of
      de [ZW][ref8] en bij de SVB indien de verrekening plaatsvindt op grond van de [AKW][ref9], [Anw][ref10] of de
      [AOW][ref11].


      [ref1]: https://wetten.overheid.nl/BWBR0004043
      [ref2]: https://wetten.overheid.nl/BWBR0004045
      [ref3]: https://wetten.overheid.nl/BWBR0008656
      [ref4]: https://wetten.overheid.nl/BWBR0024394
      [ref5]: https://wetten.overheid.nl/BWBR0002524
      [ref6]: https://wetten.overheid.nl/BWBR0008657
      [ref7]: https://wetten.overheid.nl/BWBR0019057
      [ref8]: https://wetten.overheid.nl/BWBR0001888
      [ref9]: https://wetten.overheid.nl/BWBR0002368
      [ref10]: https://wetten.overheid.nl/BWBR0007795
      [ref11]: https://wetten.overheid.nl/BWBR0002221
    url: https://wetten.overheid.nl/BWBR0026017/2015-07-01#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0004043
      - id: ref2
        bwb_id: BWBR0004045
      - id: ref3
        bwb_id: BWBR0008656
      - id: ref4
        bwb_id: BWBR0024394
      - id: ref5
        bwb_id: BWBR0002524
      - id: ref6
        bwb_id: BWBR0008657
      - id: ref7
        bwb_id: BWBR0019057
      - id: ref8
        bwb_id: BWBR0001888
      - id: ref9
        bwb_id: BWBR0002368
      - id: ref10
        bwb_id: BWBR0007795
      - id: ref11
        bwb_id: BWBR0002221
  - number: 10a.9
    text: |-
      Door het UWV en de SVB kunnen bewijsstukken worden verlangd die noodzakelijk zijn voor de vaststelling van het vrij
      te laten deel en die de belanghebbende bij de aanvraag dient te overleggen.
    url: https://wetten.overheid.nl/BWBR0026017/2015-07-01#Artikel10a
  - number: 10a.10
    text: |-
      Het op grond van het tweede, vijfde en zesde lid vastgestelde bedrag van de vrijlating wordt slechts op aanvraag
      herzien met ingang van de eerste betaling na de datum van aanvraag, in geval er sprake is van een wijziging van
      de persoonlijke omstandigheden die zouden hebben geleid tot een wijziging van de zorgkosten, bedoeld in het tweede
      lid, onderdeel a, de kosten van kinderen, bedoeld in het tweede lid, onderdeel b, of de woonkosten, bedoeld in het
      vijfde lid.
    url: https://wetten.overheid.nl/BWBR0026017/2015-07-01#Artikel10a
  - number: '11.1'
    text: |-
      De Regeling betaling, terugvordering en tenuitvoerlegging van boeten en onverschuldigde betalingen, het Besluit
      incasso boeten en onverschuldigde betalingen werkgevers en het Besluit invordering boeten en onverschuldigd
      betaalde bedragen AOW, Anw en AKW worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0026017/2015-07-01#Artikel11
  - number: '11.2'
    text: |-
      Een regeling als bedoeld in het eerste lid blijft van toepassing ten aanzien van een verplichting tot betaling van
      een geldsom die is vastgesteld voor het tijdstip waarop deze regeling in werking treedt.
    url: https://wetten.overheid.nl/BWBR0026017/2015-07-01#Artikel11
  - number: 11a
    text: |-
      Voor de toepassing van [artikel 8][ref1] geldt ten aanzien van vorderingen die zijn ontstaan voor 1 januari 2013
      een tijdsduur van 5 jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0026017#Artikel8
    url: https://wetten.overheid.nl/BWBR0026017/2015-07-01#Artikel11a
    references:
      - id: ref1
        bwb_id: BWBR0026017
        artikel: '8'
  - number: '12'
    text: |-
      Deze regeling treedt in werking op het tijdstip waarop de Vierde tranche Algemene wet bestuursrecht in werking
      treedt.
    url: https://wetten.overheid.nl/BWBR0026017/2015-07-01#Artikel12
  - number: '13'
    text: |-
      Deze regeling wordt aangehaald als: Regeling tenuitvoerlegging bestuurlijke boeten en terugvordering
      onverschuldigde betalingen.
    url: https://wetten.overheid.nl/BWBR0026017/2015-07-01#Artikel13
