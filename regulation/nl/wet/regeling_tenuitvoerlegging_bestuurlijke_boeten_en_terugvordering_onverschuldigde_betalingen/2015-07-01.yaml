      [ref12]: https://wetten.overheid.nl/BWBR0002524#Artikel57
      [ref13]: https://wetten.overheid.nl/BWBR0019057#Artikel77
      [ref14]: https://wetten.overheid.nl/BWBR0001888#Artikel33
    url: https://wetten.overheid.nl/BWBR0026017/2015-07-01#Artikel3
