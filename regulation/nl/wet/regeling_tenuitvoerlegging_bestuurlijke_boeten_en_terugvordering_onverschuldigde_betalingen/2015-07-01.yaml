      [ref10]: https://wetten.overheid.nl/BWBR0007795#Artikel45a
      [ref11]: https://wetten.overheid.nl/BWBR0002221#Artikel17j
    url: https://wetten.overheid.nl/BWBR0026017/2015-07-01#Artikel10a
