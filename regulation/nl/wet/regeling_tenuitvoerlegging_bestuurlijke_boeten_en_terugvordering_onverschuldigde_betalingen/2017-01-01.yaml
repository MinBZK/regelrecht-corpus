  - number: '2'
    text: |-
      Het UWV is, naast de in [artikel 1, onderdelen a tot en met l][ref1], genoemde wetten opgenomen bevoegdheden tot
      verrekening van vorderingen op werknemers, tevens bevoegd tot verrekening van een vordering op de werkgever met een
      aan de werkgever te betalen bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0026017#Artikel1
    url: https://wetten.overheid.nl/BWBR0026017/2017-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0026017
        artikel: '1'
  - number: '3.1'
    text: |-
      Het UWV en de SVB stellen de termijn waarvoor uitstel van betaling wordt verleend, alsmede de daaraan verbonden
      periodieke betalingen of verrekeningen, vast na overleg met de schuldenaar en met inachtneming van dit artikel,
      tenzij:
    url: https://wetten.overheid.nl/BWBR0026017/2017-01-01#Artikel3
  - number: 3.1.a
    text: de vordering een bestuurlijke boete betreft;
    url: https://wetten.overheid.nl/BWBR0026017/2017-01-01#Artikel3
  - number: 3.1.b
    text: |-
      de onverschuldigde betaling het gevolg is van een gedraging waarvoor aan de schuldenaar een bestuurlijke boete
      is opgelegd;
    url: https://wetten.overheid.nl/BWBR0026017/2017-01-01#Artikel3
  - number: 3.1.c
    text: |-
      de onverschuldigde betaling het gevolg is van een gedraging waarvan het UWV of de SVB aangifte heeft gedaan of
      waarvan proces-verbaal is opgemaakt en ingezonden; of
    url: https://wetten.overheid.nl/BWBR0026017/2017-01-01#Artikel3
  - number: 3.1.d
    text: de vordering het gevolg is van het niet nakomen van de inlichtingenverplichting.
    url: https://wetten.overheid.nl/BWBR0026017/2017-01-01#Artikel3
  - number: '3.2'
    text: |-
      Het UWV en de SVB verlenen uitstel van betaling voor ten hoogste 36 maanden. De geldschuld wordt gedurende die
      periode in termijnen ter hoogte van de volledige aflossingscapaciteit betaald of verrekend.
    url: https://wetten.overheid.nl/BWBR0026017/2017-01-01#Artikel3
  - number: '3.3'
    text: |-
      In afwijking van het tweede lid, tweede zin, wordt op verzoek van de schuldenaar ten minste de halve
      aflossingscapaciteit toegepast onder de voorwaarde dat de vordering geheel wordt voldaan binnen de in
      het tweede lid genoemde termijn van 36 maanden. De schuldenaar wordt erop gewezen dat kwijtschelding
      als bedoeld in de [artikelen 24, vijfde lid, van de AKW][ref1], [53, vijfde lid, van de Anw][ref2],
      [24, vijfde lid, van de AOW][ref3], [35, vierde lid, van de IOW][ref4], [20, vijfde lid, van de TW][ref5],
      [36, vijfde lid, van de WW][ref6], [3:16][ref7] en [3:27 van de WAZO][ref8], [2:59, vijfde lid][ref9], of
      [3:56, vijfde lid, van de Wajong][ref10], [63, vijfde lid, van de WAZ][ref11], [57, vijfde lid, van de WAO][ref12],
      [77, vijfde lid, van de Wet WIA][ref13] of [33, vijfde lid, van de ZW][ref14] niet mogelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0007795#Artikel53
      [ref3]: https://wetten.overheid.nl/BWBR0002221#Artikel24
