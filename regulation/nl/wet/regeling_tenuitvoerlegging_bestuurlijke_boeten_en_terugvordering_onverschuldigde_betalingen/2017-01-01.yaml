  - number: '3.4'
    text: |-
      Indien de schuldenaar hogere periodieke betalingen of verrekeningen voorstelt dan het bedrag, bedoeld in het tweede
      lid, stelt het UWV of de SVB de termijnen conform dit voorstel vast.
    url: https://wetten.overheid.nl/BWBR0026017/2017-01-01#Artikel3
  - number: '3.5'
    text: |-
      De periodieke betaling of verrekening wordt gesteld op de volledige aflossingscapaciteit verminderd met 5% van de
      bijstandsnorm indien:
    url: https://wetten.overheid.nl/BWBR0026017/2017-01-01#Artikel3
  - number: 3.5.a
    text: |-
      de schuldenaar met aanwending van zijn volledige aflossingscapaciteit en vermogen niet in staat is de vordering
      binnen 36 maanden te voldoen; en
    url: https://wetten.overheid.nl/BWBR0026017/2017-01-01#Artikel3
  - number: 3.5.b
    text: |-
      periodieke betaling of verrekening gedurende 60 maanden van het aldus verkregen bedrag leidt tot een grotere
      voldoening van de vordering dan betaling of verrekening gedurende 36 maanden van het op grond van het tweede en
      derde lid verkregen bedrag.
    url: https://wetten.overheid.nl/BWBR0026017/2017-01-01#Artikel3
  - number: '3.6'
    text: |-
      Indien de schuldenaar, bij aanwending van zijn volledige aflossingscapaciteit, de vordering niet binnen 36 maanden
      of bij aanwending van de volledige aflossingscapaciteit verminderd met 5% van de bijstandsnorm, niet binnen 60
      maanden volledig zal kunnen voldoen, wendt hij zijn vermogen aan zodat een zodanig gedeelte van de vordering
      binnen zes weken, nadat het UWV of de SVB aan de schuldenaar uitstel van betaling heeft verleend, wordt voldaan
      dat hij het resterende deel van de geldschuld binnen 36 maanden, dan wel 60 maanden, kan voldoen. Indien echter de
      schuldenaar ten genoegen van het UWV of de SVB zekerheid stelt voor voldoening van de gehele vordering binnen 36
      maanden, dan wel 60 maanden, nadat uitstel van betaling is verleend, behoeft de schuldenaar zijn vermogen niet aan
      te wenden.
    url: https://wetten.overheid.nl/BWBR0026017/2017-01-01#Artikel3
  - number: '3.7'
    text: |-
      Indien toepassing van dit artikel tot een kennelijk onredelijk resultaat leidt kan het UWV of de SVB van het eerste
      tot en met zesde lid afwijken.
    url: https://wetten.overheid.nl/BWBR0026017/2017-01-01#Artikel3
  - number: '4.1'
    text: |-
      Het UWV en de SVB stellen in de uitzonderingsgevallen genoemd in artikel 3, eerste lid, onderdelen a tot en met
      d, de termijn waarvoor uitstel van betaling wordt verleend, alsmede de daaraan verbonden periodieke betalingen of
      verrekeningen, vast na overleg met de schuldenaar en met inachtneming van dit artikel.
    url: https://wetten.overheid.nl/BWBR0026017/2017-01-01#Artikel4
  - number: '4.2'
    text: |-
      De periodieke betalingen of verrekeningen worden door het UWV en de SVB zodanig vastgesteld dat gebruik wordt
      gemaakt van de volledige aflossingscapaciteit van de schuldenaar.
    url: https://wetten.overheid.nl/BWBR0026017/2017-01-01#Artikel4
  - number: '4.3'
    text: |-
      Indien de schuldenaar hogere periodieke betalingen of verrekeningen voorstelt dan het bedrag, bedoeld in het tweede
      lid, dan stelt het UWV of de SVB het bedrag conform dit voorstel vast.
    url: https://wetten.overheid.nl/BWBR0026017/2017-01-01#Artikel4
  - number: '4.4'
    text: |-
      Indien de schuldenaar de vordering niet binnen 12 maanden volledig zal kunnen voldoen, wendt hij zijn vermogen aan
      zodat een zodanig gedeelte van de vordering binnen zes weken, nadat het UWV of de SVB aan de schuldenaar uitstel
      van betaling heeft verleend, wordt voldaan dat hij de resterende vordering binnen 12 maanden kan voldoen. Indien
      echter de schuldenaar ten genoegen van het UWV of de SVB zekerheid stelt voor voldoening van de gehele vordering
      binnen 12 maanden, nadat uitstel van betaling is verleend, behoeft de schuldenaar zijn vermogen niet aan te wenden.
    url: https://wetten.overheid.nl/BWBR0026017/2017-01-01#Artikel4
  - number: '4.5'
    text: |-
      Onverminderd het bepaalde in artikel 8 stelt het UWV of de SVB de termijnen waarbinnen wordt verrekend of moet
      worden betaald vast over een periode van meer dan 12 maanden indien de schuldenaar, ook na aanwending van zijn
      vermogen, niet in staat is de vordering binnen 12 maanden te voldoen.
    url: https://wetten.overheid.nl/BWBR0026017/2017-01-01#Artikel4
  - number: '4.6'
    text: Artikel 3, zevende lid, is van overeenkomstige toepassing op dit artikel.
    url: https://wetten.overheid.nl/BWBR0026017/2017-01-01#Artikel4
  - number: '5'
    text: |-
      Indien de vordering op de schuldenaar niet meer bedraagt dan € 300,– stelt het UWV of de SVB, in afwijking van de
      artikelen 3 en 4, de wijze waarop deze vordering moet worden voldaan vast zonder de schuldenaar in de gelegenheid
      te stellen een voorstel te doen met betrekking tot de wijze van voldoening van de vordering, met dien verstande dat
      per periode van een maand de aflossing op niet meer dan € 52,– kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0026017/2017-01-01#Artikel5
  - number: '6'
    text: |-
      Het UWV en de SVB kunnen, in afwijking van de artikelen 3 en 4, uitstel van betaling verlenen conform een voorstel
      van de schuldenaar indien:
    url: https://wetten.overheid.nl/BWBR0026017/2017-01-01#Artikel6
  - number: 6.a
    text: |-
      de schuldenaar hierom gemotiveerd verzoekt tot uiterlijk zes weken na bekendmaking van een beschikking tot betaling
      van een geldschuld; en
    url: https://wetten.overheid.nl/BWBR0026017/2017-01-01#Artikel6
  - number: 6.b
    text: |-
      het voorstel inhoudt dat de gehele vordering binnen 12 maanden, eventueel door middel van periodieke betalingen of
      verrekeningen, wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0026017/2017-01-01#Artikel6
  - number: '7.1'
    text: 'Het UWV en de SVB verbinden aan een beschikking tot uitstel van betaling in ieder geval de voorschriften dat:'
    url: https://wetten.overheid.nl/BWBR0026017/2017-01-01#Artikel7
  - number: 7.1.a
    text: |-
      de vordering gedurende de periode waarover uitstel van betaling is verleend door middel van betalingen of
      verrekeningen, in periodieken of ineens, wordt voldaan; en
    url: https://wetten.overheid.nl/BWBR0026017/2017-01-01#Artikel7
  - number: 7.1.b
    text: |-
      de beschikking tot uitstel van betaling kan worden ingetrokken of gewijzigd indien wijziging plaatsvindt in de
      hoogte van de inkomsten van de schuldenaar.
    url: https://wetten.overheid.nl/BWBR0026017/2017-01-01#Artikel7
  - number: '7.2'
    text: |-
      Het UWV en de SVB bepalen in de beschikking tot uitstel van betaling dat wettelijke rente als bedoeld in artikel
      4:98 van de Algemene wet bestuursrecht is verschuldigd vanaf het tijdstip dat de termijn is verstreken waarbinnen
      volgens die beschikking de betaling had moeten plaatsvinden of had moeten worden verrekend en dat deze rente
      verschuldigd is over de resterende vordering.
    url: https://wetten.overheid.nl/BWBR0026017/2017-01-01#Artikel7
  - number: '8'
    text: |-
      Indien de schuldenaar de vordering na tien jaren, waarin hij zich heeft gehouden aan de vastgestelde periodieke
      betalingen of verrekeningen, nog niet volledig heeft voldaan wordt de periodieke betaling of verrekening gesteld op
      de volledige aflossingscapaciteit verminderd met 5% van de bijstandsnorm.
    url: https://wetten.overheid.nl/BWBR0026017/2017-01-01#Artikel8
  - number: '9'
    text: |-
      Tenzij de schuldenaar een andere vordering aanwijst wordt een betaling, die zou kunnen worden toegerekend aan
      meerdere vorderingen, eerst toegerekend aan een verschuldigde bestuurlijke boete.
    url: https://wetten.overheid.nl/BWBR0026017/2017-01-01#Artikel9
  - number: '10'
    text: De artikelen 3, 4 en 8 zijn niet van toepassing op de werkgever.
    url: https://wetten.overheid.nl/BWBR0026017/2017-01-01#Artikel10
  - number: '11.1'
    text: |-
      De Regeling betaling, terugvordering en tenuitvoerlegging van boeten en onverschuldigde betalingen, het Besluit
      incasso boeten en onverschuldigde betalingen werkgevers en het Besluit invordering boeten en onverschuldigd
      betaalde bedragen AOW, Anw en AKW worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0026017/2017-01-01#Artikel11
  - number: '11.2'
    text: |-
      Een regeling als bedoeld in het eerste lid blijft van toepassing ten aanzien van een verplichting tot betaling van
      een geldsom die is vastgesteld voor het tijdstip waarop deze regeling in werking treedt.
    url: https://wetten.overheid.nl/BWBR0026017/2017-01-01#Artikel11
  - number: 11a
    text: |-
      Voor de toepassing van [artikel 8][ref1] geldt ten aanzien van vorderingen die zijn ontstaan voor 1 januari 2013
      een tijdsduur van 5 jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0026017#Artikel8
    url: https://wetten.overheid.nl/BWBR0026017/2017-01-01#Artikel11a
    references:
      - id: ref1
        bwb_id: BWBR0026017
        artikel: '8'
  - number: '12'
    text: |-
      Deze regeling treedt in werking op het tijdstip waarop de Vierde tranche Algemene wet bestuursrecht in werking
      treedt.
    url: https://wetten.overheid.nl/BWBR0026017/2017-01-01#Artikel12
  - number: '13'
    text: |-
      Deze regeling wordt aangehaald als: Regeling tenuitvoerlegging bestuurlijke boeten en terugvordering
      onverschuldigde betalingen.
    url: https://wetten.overheid.nl/BWBR0026017/2017-01-01#Artikel13
