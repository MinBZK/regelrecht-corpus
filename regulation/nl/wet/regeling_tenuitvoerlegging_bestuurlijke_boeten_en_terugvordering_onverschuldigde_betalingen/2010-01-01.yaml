url: https://wetten.overheid.nl/BWBR0026017/2010-01-01
preamble:
  text: |-
    Handelende in overeenstemming met de Minister voor Jeugd en Gezin en de Staatssecretaris van Sociale Zaken en
    Werkgelegenheid;

    Gelet op de artikelen 17c en 24b van de Algemene Kinderbijslagwet, 41 en 55 van de Algemene nabestaandenwet,17e en
    24b van de Algemene Ouderdomswet, 14c en 20b van de Toeslagenwet, 27c en 36b van de Werkloosheidswet, 42 en 57 van
    de Wet arbeidsongeschiktheidsvoorziening jonggehandicapten, 50 en 65 van de Wet arbeidsongeschiktheidsverzekering
    zelfstandigen, 29c en 57b van de Wet op de arbeidsongeschiktheidsverzekering, 79 en 93 van de Wet werk en inkomen
    naar arbeidsvermogen en 33b en 45c van de Ziektewet;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0026017/2010-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. *AKW:* [Algemene Kinderbijslagwet][ref1];

      b. *Anw:* [Algemene nabestaandenwet][ref2];

      c. *AOW:* [Algemene Ouderdomswet][ref3];

      d. IOW: [Wet inkomensvoorziening oudere werklozen][ref4];

      e. *TW:* [Toeslagenwet][ref5];

      f. *WW:* [Werkloosheidswet][ref6];

      g. *WAZO:* [Wet arbeid en zorg][ref7];

      h. *Wet Wajong:* [Wet werk en arbeidsondersteuning jonggehandicapten][ref8];

      i. *WAZ:* [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref9];

      j. *WAO:* [Wet op de arbeidsongeschiktheidsverzekering][ref10];

      k. *Wet WIA:* [Wet werk en inkomen naar arbeidsvermogen][ref11];

      l. *ZW:* [Ziektewet][ref12];

      m. *schuldenaar:* degene aan wie een bestuurlijke boete is opgelegd of van wie een bedrag wordt teruggevorderd;

      n. *werkgever:* de schuldenaar die tevens werkgever of eigenrisicodrager is;

      o. *bestuurlijke boete:* een bestuurlijke boete als bedoeld in het eerste lid van de
      [artikelen 17a van de AKW][ref13], [39 van de Anw][ref14], [17c van de AOW][ref15], [21 van de IOW][ref16],
      [14a van de TW][ref17], [27a van de WW][ref18], [3:16][ref19] en [3:27 van de WAZO][ref20], [2:69][ref21] en
      [3:40 van de Wet Wajong][ref22], [48 van de WAZ][ref23], [29a van de WAO][ref24], [91 van de Wet WIA][ref25],
      en in de [artikelen 38, vierde lid][ref26], [38a, zevende lid][ref27], [45a, eerste lid][ref28], en
      [63c van de ZW][ref29];

      p. *vordering:*

      a. het bedrag dat wordt teruggevorderd op grond van de [artikelen 24 van de AKW][ref30], [53 van de Anw][ref31],
      [24 van de AOW][ref32], [34 van de IOW][ref33], [20 van de TW][ref34], [36 van de WW][ref35], [3:16][ref36]
      en [3:27 van de WAZO][ref37], [2:59][ref38] of [3:56 van de Wet Wajong][ref39], [63 van de WAZ][ref40],
      [57 van de WAO][ref41], [77 van de Wet WIA][ref42], of [33 van de ZW][ref43]; ;

      b. het bedrag dat als bestuurlijke boete is opgelegd;

      c. het bedrag dat het UWV op de werkgever verhaalt op grond van de [artikelen 71, tweede lid][ref44],
      [75a, vierde lid][ref45], [75b, zevende lid][ref46], [75f, eerste lid, van de WAO][ref47], [72, tweede lid][ref48],
      [83, derde lid][ref49], [84, tweede of vierde lid, van de Wet WIA][ref50], [39a, eerste lid][ref51], of
      [63a, derde, vierde of vijfde lid, van de ZW][ref52] of

      d. het bedrag van een aan een werkgever verstrekt re-integratie-instrument dat wordt teruggevorderd op grond van
      [artikel 77 van de Wet WIA][ref53];

      q. *aflossingscapaciteit:* het deel van het inkomen van de schuldenaar dat met inachtneming van de beslagvrije
      voet, bedoeld in de [artikelen 475c tot en met 475e van het Wetboek van Burgerlijke Rechtsvordering][ref54], kan
      worden aangewend voor betaling of verrekening van de vordering;

      r. *vermogen:* vermogensrechten, onroerende en roerende zaken, niet zijnde gebruikelijke huisraad, waarvan de
      dagwaarde per zaak € 1 134 of meer bedraagt;

      s. *inlichtingenverplichting:* de verplichting, bedoeld in de [artikelen 15 van de AKW][ref55],
      [35 van de Anw][ref56], [49 van de AOW][ref57], [12, eerste lid, van de IOW][ref58], [12 van de TW][ref59],
      [25 van de WW][ref60], [3:16][ref61] en [3:27 van de WAZO][ref62], [2:7][ref63] en [3:74 van de Wet Wajong][ref64],
      [70 van de WAZ][ref65], [80 van de WAO][ref66], [27, eerste lid, van de Wet WIA][ref67] en [31, eerste lid][ref68],
      en [49 van de ZW][ref69];

      t. *bijstandsnorm:* de voor de schuldenaar op grond van [hoofdstuk 3, paragraaf 3.2][ref70] en
      [paragraaf 3.3, van de Wet werk en bijstand][ref71] geldende bijstandsnorm;

      u. *UWV:* Uitvoeringsinstituut werknemersverzekeringen, genoemd in
      [hoofdstuk 5 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref72];

      v. *SVB:* de Sociale verzekeringsbank, genoemd in
      [hoofdstuk 6 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref73].


