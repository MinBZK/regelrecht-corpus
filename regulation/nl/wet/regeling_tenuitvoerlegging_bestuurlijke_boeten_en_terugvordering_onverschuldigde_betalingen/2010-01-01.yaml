  - number: '2'
    text: |-
      Het UWV is, naast de in [artikel 1, onderdelen a tot en met l][ref1], genoemde wetten opgenomen bevoegdheden tot
      verrekening van vorderingen op werknemers, tevens bevoegd tot verrekening van een vordering op de werkgever met een
      aan de werkgever te betalen bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0026017#Artikel1
    url: https://wetten.overheid.nl/BWBR0026017/2010-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0026017
        artikel: '1'
  - number: '3'
    text: |-
      1 Het UWV en de SVB stellen de termijn waarvoor uitstel van betaling wordt verleend, alsmede de daaraan verbonden
      periodieke betalingen of verrekeningen, vast na overleg met de schuldenaar en met inachtneming van dit artikel,
      tenzij:

      a. de vordering een bestuurlijke boete betreft;

      b. de onverschuldigde betaling het gevolg is van een gedraging waarvoor aan de schuldenaar een bestuurlijke boete
      is opgelegd;

      c. de onverschuldigde betaling het gevolg is van een gedraging waarvan het UWV of de SVB aangifte heeft gedaan of
      waarvan proces-verbaal is opgemaakt en ingezonden; of

      d. de vordering het gevolg is van het niet nakomen van de inlichtingenverplichting.

      2 Het UWV en de SVB verlenen uitstel van betaling voor ten hoogste 36 maanden. De geldschuld wordt gedurende die
      periode in termijnen ter hoogte van de volledige aflossingscapaciteit betaald of verrekend.

      3 In afwijking van het tweede lid, tweede zin, wordt op verzoek van de schuldenaar ten minste de halve
      aflossingscapaciteit toegepast onder de voorwaarde dat de vordering geheel wordt voldaan binnen de in het tweede
      lid genoemde termijn van 36 maanden. De schuldenaar wordt erop gewezen dat kwijtschelding als bedoeld in de
      [artikelen 24, derde lid, van de AKW][ref1], [53, derde lid, van de Anw][ref2], [24, derde lid, van de AOW][ref3],
      [35, tweede lid, van de IOW][ref4], [20, derde lid, van de TW][ref5], [36, derde lid, van de WW][ref6],
      [3:16][ref7] en [3:27 van de WAZO][ref8], [2:59, derde lid][ref9], of [3:56, derde lid, van de Wet Wajong][ref10],
      [63, derde lid, van de WAZ][ref11], [57, derde lid, van de WAO][ref12], [77, derde lid, van de Wet WIA][ref13] of
      [33, derde lid, van de ZW][ref14] niet mogelijk is.

      4 Indien de schuldenaar hogere periodieke betalingen of verrekeningen voorstelt dan het bedrag, bedoeld in het
      tweede lid, stelt het UWV of de SVB de termijnen conform dit voorstel vast.

      5 De periodieke betaling of verrekening wordt gesteld op de volledige aflossingscapaciteit verminderd met 5% van de
      bijstandsnorm indien:

      a. de schuldenaar met aanwending van zijn volledige aflossingscapaciteit en vermogen niet in staat is de vordering
      binnen 36 maanden te voldoen; en

      b. periodieke betaling of verrekening gedurende 60 maanden van het aldus verkregen bedrag leidt tot een grotere
      voldoening van de vordering dan betaling of verrekening gedurende 36 maanden van het op grond van het tweede en
      derde lid verkregen bedrag.

      6 Indien de schuldenaar, bij aanwending van zijn volledige aflossingscapaciteit, de vordering niet binnen 36
      maanden of bij aanwending van de volledige aflossingscapaciteit verminderd met 5% van de bijstandsnorm, niet binnen
      60 maanden volledig zal kunnen voldoen, wendt hij zijn vermogen aan zodat een zodanig gedeelte van de vordering
      binnen zes weken, nadat het UWV of de SVB aan de schuldenaar uitstel van betaling heeft verleend, wordt voldaan dat
      hij het resterende deel van de geldschuld binnen 36 maanden, dan wel 60 maanden, kan voldoen.

      Indien echter de schuldenaar ten genoegen van het UWV of de SVB zekerheid stelt voor voldoening van de gehele
      vordering binnen 36 maanden, dan wel 60 maanden, nadat uitstel van betaling is verleend, behoeft de schuldenaar
      zijn vermogen niet aan te wenden.

      7 Indien toepassing van dit artikel tot een kennelijk onredelijk resultaat leidt kan het UWV of de SVB van het
      eerste tot en met zesde lid afwijken.


