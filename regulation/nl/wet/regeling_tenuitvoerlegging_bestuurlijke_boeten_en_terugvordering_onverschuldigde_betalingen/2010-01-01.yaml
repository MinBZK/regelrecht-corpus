  - number: '4'
    text: |-
      1 Het UWV en de SVB stellen in de uitzonderingsgevallen genoemd in artikel 3, eerste lid, onderdelen a tot en met
      d, de termijn waarvoor uitstel van betaling wordt verleend, alsmede de daaraan verbonden periodieke betalingen of
      verrekeningen, vast na overleg met de schuldenaar en met inachtneming van dit artikel.

      2 De periodieke betalingen of verrekeningen worden door het UWV en de SVB zodanig vastgesteld dat gebruik wordt
      gemaakt van de volledige aflossingscapaciteit van de schuldenaar.

      3 Indien de schuldenaar hogere periodieke betalingen of verrekeningen voorstelt dan het bedrag, bedoeld in het
      tweede lid, dan stelt het UWV of de SVB het bedrag conform dit voorstel vast.

      4 Indien de schuldenaar de vordering niet binnen 12 maanden volledig zal kunnen voldoen, wendt hij zijn vermogen
      aan zodat een zodanig gedeelte van de vordering binnen zes weken, nadat het UWV of de SVB aan de schuldenaar
      uitstel van betaling heeft verleend, wordt voldaan dat hij de resterende vordering binnen 12 maanden kan voldoen.
      Indien echter de schuldenaar ten genoegen van het UWV of de SVB zekerheid stelt voor voldoening van de gehele
      vordering binnen 12 maanden, nadat uitstel van betaling is verleend, behoeft de schuldenaar zijn vermogen niet aan
      te wenden.

      5 Onverminderd het bepaalde in artikel 8 stelt het UWV of de SVB de termijnen waarbinnen wordt verrekend of moet
      worden betaald vast over een periode van meer dan 12 maanden indien de schuldenaar, ook na aanwending van zijn
      vermogen, niet in staat is de vordering binnen 12 maanden te voldoen.

      6 Artikel 3, zevende lid, is van overeenkomstige toepassing op dit artikel.
    url: https://wetten.overheid.nl/BWBR0026017/2010-01-01#Artikel4
  - number: '5'
    text: |-
      Indien de vordering op de schuldenaar niet meer bedraagt dan € 300,– stelt het UWV of de SVB, in afwijking van de
      artikelen 3 en 4, de wijze waarop deze vordering moet worden voldaan vast zonder de schuldenaar in de gelegenheid
      te stellen een voorstel te doen met betrekking tot de wijze van voldoening van de vordering, met dien verstande dat
      per periode van een maand de aflossing op niet meer dan € 52,– kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0026017/2010-01-01#Artikel5
  - number: '6'
    text: |-
      Het UWV en de SVB kunnen, in afwijking van de artikelen 3 en 4, uitstel van betaling verlenen conform een voorstel
      van de schuldenaar indien:

      a. de schuldenaar hierom gemotiveerd verzoekt tot uiterlijk zes weken na bekendmaking van een beschikking tot
      betaling van een geldschuld; en

      b. het voorstel inhoudt dat de gehele vordering binnen 12 maanden, eventueel door middel van periodieke betalingen
      of verrekeningen, wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0026017/2010-01-01#Artikel6
  - number: '7'
    text: |-
      1 Het UWV en de SVB verbinden aan een beschikking tot uitstel van betaling in ieder geval de voorschriften dat:

      a. de vordering gedurende de periode waarover uitstel van betaling is verleend door middel van betalingen of
      verrekeningen, in periodieken of ineens, wordt voldaan; en

      b. de beschikking tot uitstel van betaling kan worden ingetrokken of gewijzigd indien wijziging plaatsvindt in de
      hoogte van de inkomsten van de schuldenaar.

      2 Het UWV en de SVB bepalen in de beschikking tot uitstel van betaling dat slechts wettelijke rente als bedoeld
      in artikel 4:98 van de Algemene wet bestuursrecht is verschuldigd vanaf het tijdstip dat de termijn is verstreken
      waarbinnen volgens die beschikking de betaling had moeten plaatsvinden of had moeten worden verrekend en dat deze
      rente slechts verschuldigd is over de resterende vordering.
    url: https://wetten.overheid.nl/BWBR0026017/2010-01-01#Artikel7
  - number: '8'
    text: |-
      Indien de schuldenaar de vordering na vijf jaren, waarin hij zich heeft gehouden aan de vastgestelde periodieke
      betalingen of verrekeningen, nog niet volledig heeft voldaan wordt de periodieke betaling of verrekening gesteld op
      de volledige aflossingscapaciteit verminderd met 5% van de bijstandsnorm.
    url: https://wetten.overheid.nl/BWBR0026017/2010-01-01#Artikel8
  - number: '9'
    text: |-
      Tenzij de schuldenaar een andere vordering aanwijst wordt een betaling, die zou kunnen worden toegerekend aan
      meerdere vorderingen, eerst toegerekend aan een verschuldigde bestuurlijke boete.
    url: https://wetten.overheid.nl/BWBR0026017/2010-01-01#Artikel9
  - number: '10'
    text: De artikelen 3, 4 en 8 zijn niet van toepassing op de werkgever.
    url: https://wetten.overheid.nl/BWBR0026017/2010-01-01#Artikel10
  - number: '11'
    text: |-
      1 De Regeling betaling, terugvordering en tenuitvoerlegging van boeten en onverschuldigde betalingen, het Besluit
      incasso boeten en onverschuldigde betalingen werkgevers en het Besluit invordering boeten en onverschuldigd
      betaalde bedragen AOW, Anw en AKW worden ingetrokken.

      2 Een regeling als bedoeld in het eerste lid blijft van toepassing ten aanzien van een verplichting tot betaling
      van een geldsom die is vastgesteld voor het tijdstip waarop deze regeling in werking treedt.
    url: https://wetten.overheid.nl/BWBR0026017/2010-01-01#Artikel11
  - number: '12'
    text: |-
      Deze regeling treedt in werking op het tijdstip waarop de Vierde tranche Algemene wet bestuursrecht in werking
      treedt.
    url: https://wetten.overheid.nl/BWBR0026017/2010-01-01#Artikel12
  - number: '13'
    text: |-
      Deze regeling wordt aangehaald als: Regeling tenuitvoerlegging bestuurlijke boeten en terugvordering
      onverschuldigde betalingen.
    url: https://wetten.overheid.nl/BWBR0026017/2010-01-01#Artikel13
