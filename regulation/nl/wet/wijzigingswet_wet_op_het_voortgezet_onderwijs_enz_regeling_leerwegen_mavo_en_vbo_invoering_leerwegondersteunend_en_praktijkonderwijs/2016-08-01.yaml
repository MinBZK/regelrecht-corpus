  - number: VI
    text: |-
      1 Uiterlijk tot 1 augustus 2002 kan het bevoegd gezag van een in [artikel III, eerste lid][ref1], bedoelde
      school onderscheidenlijk van een in [artikel III, tweede lid][ref2], bedoelde school ten behoeve van de daaraan
      verbonden afdeling voor speciaal voortgezet onderwijs, in overeenstemming met de bevoegde gezagsorganen in het
      samenwerkingsverband waarvan het bevoegd gezag ten aanzien van die school onderscheidenlijk van de aan die school
      verbonden afdeling deel uitmaakt, mededeling doen aan Onze Minister van Onderwijs, Cultuur en Wetenschappen dat, in
      afwijking van de [artikelen IV][ref3] en [V][ref4]:

      a. de taken en bevoegdheden ten behoeve van de ondersteuning van het onderwijs voor leerlingen voor wie een
      orthopedagogische en orthodidactische benadering is geboden, worden overgedragen aan een door de bevoegde
      gezagsorganen in het samenwerkingsverband gezamenlijk in te stellen orgaan, en

      b. de leerlingen van die school onderscheidenlijk van de aan die school verbonden afdeling worden ingeschreven aan
      een of meer andere scholen in het samenwerkingsverband waaraan een afdeling voor leerwegondersteunend onderwijs
      is verbonden.

      De bevoegde gezagsorganen in het samenwerkingsverband kunnen gezamenlijk toestaan dat ten behoeve van de in
      onderdeel b bedoelde leerlingen het onderwijs tijdelijk niet wordt verzorgd door de in onderdeel b bedoelde scholen
      maar door het in onderdeel a bedoelde orgaan.

      2 De in het eerste lid bedoelde mededeling bevat in ieder geval een omschrijving van de in het eerste lid,
      onderdeel a, bedoelde ondersteuning, en geeft in ieder geval aan op welke wijze binnen het samenwerkingsverband
      de leerlingen van de in [artikel III, eerste lid][ref5], bedoelde school onderscheidenlijk van de in
      [artikel III, tweede lid][ref6], bedoelde afdeling worden opgevangen door de andere bevoegde gezagsorganen. De
      mededeling geeft tevens aan dat ten behoeve van het personeel van de in [artikel III, eerste lid][ref7], bedoelde
      school onderscheidenlijk van de in [artikel III, tweede lid][ref8], bedoelde school voor zover werkzaam aan de aan
      die school verbonden afdeling adequate voorzieningen zijn getroffen bij een of meer van de bevoegde gezagsorganen
      in het samenwerkingsverband, dan wel bij het in het eerste lid, onderdeel a, bedoelde orgaan.

      3 Bij algemene maatregel van bestuur worden nadere voorschriften vastgesteld omtrent het eerste en tweede lid. De
      algemene maatregel van bestuur bevat in ieder geval voorschriften met betrekking tot:

      a. de beëindiging van de bekostiging van de in [artikel III, eerste lid][ref9], bedoelde school onderscheidenlijk
      de in [artikel III, tweede lid][ref10], bedoelde afdeling,

      b. de bekostiging van de andere scholen in het samenwerkingsverband waaraan de leerlingen worden ingeschreven, en

      c. de rechtspositie van het in het tweede lid bedoelde personeel, waaronder in ieder geval begrepen voorschriften
      met betrekking tot het behoud van de aanspraak op salariëring conform de schaal die gold voor de functie op het
      tijdstip voorafgaand aan het tijdstip waarop toepassing wordt gegeven aan het eerste en tweede lid.


