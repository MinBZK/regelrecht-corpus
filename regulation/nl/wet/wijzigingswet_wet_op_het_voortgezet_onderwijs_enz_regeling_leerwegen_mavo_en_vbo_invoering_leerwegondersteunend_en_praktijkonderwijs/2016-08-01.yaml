  - number: VIII
    text: |-
      1 Uiterlijk voor 1 augustus 2002 brengt Onze Minister van Onderwijs, Cultuur en Wetenschappen op aanvraag van
      het bevoegd gezag van een in [artikel VII][ref1] bedoelde school die school onderscheidenlijk de aan die school
      verbonden afdeling in aanmerking voor bekostiging als school voor praktijkonderwijs onderscheidenlijk als afdeling
      voor praktijkonderwijs, bedoeld in [artikel 10f van de Wet op het voortgezet onderwijs][ref2] zoals luidend
      ingevolge deze wet, verbonden aan een school voor voorbereidend beroepsonderwijs of aan een scholengemeenschap
      waarvan ten minste een school voor voorbereidend beroepsonderwijs deel uitmaakt, tenzij dat niet in overeenstemming
      is met een evenwichtig geheel van onderwijsvoorzieningen.

      2 In afwijking van het eerste lid, kan Onze Minister van Onderwijs, Cultuur en Wetenschappen op aanvraag
      van het bevoegd gezag een in [artikel VII, tweede lid][ref3], bedoelde afdeling voor speciaal voortgezet
      onderwijs in aanmerking brengen voor bekostiging als school voor praktijkonderwijs, tenzij dat niet in
      overeenstemming is met een evenwichtig geheel van onderwijsvoorzieningen. De eerste volzin is van overeenkomstige
      toepassing op de afdelingen voor speciaal voortgezet onderwijs die zijn verbonden aan twee of meer in
      [artikel VII, tweede lid][ref4], bedoelde scholen, met dien verstande dat de aanvraag wordt ingediend door de
      bevoegde gezagsorganen van die scholen gezamenlijk. Bij algemene maatregel van bestuur kan het aantal leerlingen
      worden bepaald dat ten minste onderwijs volgt aan de afdelingen, genoemd in dit lid, voordat Onze Minister van
      Onderwijs, Cultuur en Wetenschappen toepassing geeft aan het de eerste of tweede volzin.

      3 Het bevoegd gezag overlegt bij zijn aanvraag het advies van de bevoegde gezagsorganen in het samenwerkingsverband
      waarvan het bevoegd gezag op grond van artikel XIII van deze wet deel uitmaakt, alsmede van de gemeente waarin de
      in [artikel VII][ref5] bedoelde school is gevestigd.

      4 [Artikel IV, tweede, derde en vierde lid][ref6], is van overeenkomstige toepassing.

      5 Het bevoegd gezag zendt een aanvraag om toepassing van het eerste lid uiterlijk 1 december van het voorafgaande
      kalenderjaar voorafgaand aan het schooljaar waarop de aanvraag betrekking heeft, aan Onze Minister van Onderwijs,
      Cultuur en Wetenschappen. Onze Minister beslist binnen drie maanden op de aanvraag. Indien de beschikking niet
      binnen drie maanden kan worden gegeven, stelt Onze Minister het bevoegd gezag daarvan in kennis en noemt hij
      daarbij een termijn waarbinnen de beschikking wel tegemoet kan worden gezien.


      [ref1]: https://wetten.overheid.nl/BWBR0009638#ArtikelVII
