  - number: IX
    text: |-
      1 Onze Minister van Onderwijs, Cultuur en Wetenschappen stelt een landelijke geschillencommissie voor
      samenwerkingsverbanden in.

      2 De geschillencommissie bestaat uit een voorzitter en vier leden, die allen door Onze Minister van Onderwijs,
      Cultuur en Wetenschappen worden benoemd. De vier leden worden benoemd op voordracht van de gezamenlijke
      besturenorganisaties en de Vereniging van Nederlandse Gemeenten. De voorzitter is een jurist.

      3 De voorzitter en de leden worden benoemd voor een termijn van vier jaar. Zij zijn opnieuw benoembaar. Op eigen
      verzoek wordt aan hen ontslag verleend.

      4 Het bevoegd gezag van een school, bedoeld in [artikel III][ref1] of [artikel VII][ref2], kan voorziening vragen
      bij de landelijke geschillencommissie tegen de weigering door het bevoegd gezag van de andere in die artikelen
      bedoelde school of scholen in het samenwerkingsverband medewerking te verlenen aan onderscheidenlijk in te stemmen
      met:

      a. het indienen van de aanvraag, bedoeld in [artikel IV, eerste of derde lid][ref3],

      b. het indienen van de aanvraag, bedoeld in artikel IVa, tweede lid, onderdeel c,

      c. het indienen van de aanvraag, bedoeld in [artikel V, eerste lid][ref4], onderscheidenlijk het uitbrengen van het
      advies, bedoeld in [artikel V, tweede lid][ref5],

      d. het doen van de mededeling, bedoeld in [artikel VI, eerste lid][ref6], of

      e. het indienen van de aanvraag, bedoeld in [artikel VIII, eerste of tweede lid][ref7], onderscheidenlijk het
      uitbrengen van het advies, bedoeld in [artikel VIII, derde lid][ref8].

      Het vragen van voorziening, bedoeld in de eerste volzin, wordt gelijkgesteld met het instellen van administratief
      beroep.

      5 De uitspraak van de geschillencommissie is bindend voor de bevoegde gezagsorganen in het samenwerkingsverband.

      6 Tegen de uitspraak van de geschillencommissie kan beroep worden ingesteld bij de Afdeling bestuursrechtspraak
      van de Raad van State. De uitspraak, bedoeld in de eerste volzin, wordt gelijkgesteld met een uitspraak in
      administratief beroep.

      7 De bevoegde gezagsorganen in een samenwerkingsverband kunnen gezamenlijk besluiten dat de in het vierde lid
      bedoelde geschillen worden voorgelegd aan een geschillencommissie die door de bevoegde gezagsorganen, al dan niet
      te zamen met de bevoegde gezagsorganen van een ander samenwerkingsverband, is ingesteld. In dat geval is het vierde
      lid niet van toepassing, en zijn het vijfde en zesde lid van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009638#ArtikelIII
