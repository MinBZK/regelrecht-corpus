  - number: XVIII
    text: |-
      1 Bij algemene maatregel van bestuur kunnen de vakken, genoemd in de a[rtikelen 10, zesde en zevende lid][ref1],
      [10b, zesde lid][ref2], en [10d, zesde en zevende lid][ref3], worden vervangen door andere vakken.

      2 Bij algemene maatregel van bestuur kan voor de invoering van de andere vakken in de onderscheiden leerwegen
      respectievelijk sectoren verschillende tijdstippen vaststellen. Indien dat noodzakelijk is in verband met de
      toepassing van de eerste volzin, kan de desbetreffende algemene maatregel van bestuur voorzien in herformulering
      van [artikel 10b, zesde lid, van de Wet op het voortgezet onderwijs][ref4] zoals luidend ingevolge deze wet.

      3 De algemene maatregel van bestuur wordt aan de beide kamers der Staten-Generaal overgelegd. De maatregel treedt
      niet in werking dan nadat vier weken na de overlegging zijn verstreken en gedurende die termijn niet door of namens
      een van beide kamers de wens wordt te kennen gegeven dat het in die maatregel geregelde onderwerp bij de wet wordt
      geregeld. Alsdan wordt een daartoe strekkend wetsvoorstel zo spoedig mogelijk ingediend. Het bepaalde in de drie
      vorige volzinnen is niet van toepassing indien het ontwerp van de algemene maatregel van bestuur voordien aan de
      beide kamers is overgelegd en door of namens de kamers te kennen is gegeven dat van de procedure, bedoeld in vorige
      drie volzinnen, kan worden afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel10b
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel10d
      [ref4]: https://wetten.overheid.nl/BWBR0002399#Artikel10b
