      1 Uiterlijk met ingang van 1 januari 1999 voldoet het bevoegd gezag van een school voor
      middelbaar algemeen voortgezet onderwijs, een school voor voorbereidend beroepsonderwijs, een
      scholengemeenschap waarvan ten minste deel uitmaakt een school voor middelbaar algemeen voortgezet
      onderwijs of een school voor voorbereidend beroepsonderwijs en een school voor praktijkonderwijs aan
      [artikel 10h van de Wet op het voortgezet onderwijs][ref1] zoals luidend ingevolge deze wet.

      2 Indien het bevoegd gezag op 31 juli 1998 is aangesloten bij een samenwerkingsverband als bedoeld in de
      Regeling regionale samenwerkingsverbanden vo-vso 1997–1998 (Uitleg OCenW-Regelingen 1997, nr. 2 en 3), voldoet
      hij met ingang van 1 augustus 1998 aan [artikel 10h van de Wet op het voortgezet onderwijs][ref2] zoals luidend
      ingevolge deze wet. De op basis van de genoemde regeling tot stand gekomen samenwerkingsverbanden waarvan
      ten minste deel uitmaken een in [artikel III, eerste lid][ref3], of [artikel VII, eerste lid][ref4], bedoelde
      school, en drie scholen voor middelbaar algemeen voortgezet onderwijs of voor voorbereidend beroepsonderwijs
      waaronder in ieder geval een school voor middelbaar algemeen voortgezet onderwijs en een school voor
      voorbereidend beroepsonderwijs, zijn met ingang van 1 augustus 1998 samenwerkingsverbanden als bedoeld in
      [artikel 10h van de Wet op het voortgezet onderwijs][ref5] zoals luidend ingevolge deze wet.

      3 Onverminderd het eerste lid en in afwijking van het daargenoemde
      [artikel 10h van de Wet op het voortgezet onderwijs][ref6], zijn tot een bij koninklijk besluit te bepalen
      tijdstip met betrekking tot de toelating van leerlingen tot de scholen voor leerwegondersteunend onderwijs en de
      afdelingen voor leerwegondersteunend onderwijs, bedoeld in de [artikelen II][ref7] en [IV][ref8] van deze wet, van
      overeenkomstige toepassing de voorschriften omtrent de toelating tot het praktijkonderwijs, bedoeld in artikel 10g
      van de Wet op het voortgezet zoals luidend ingevolge deze wet. Een regionale verwijzingscommissie neemt een besluit
      op grond van de eerste volzin telkens voor een periode van ten hoogste twee jaar. De ouders van de desbetreffende
      leerling kunnen een beschikking van de regionale verwijzingscommissie voorleggen aan een andere regionale
      verwijzingscommissie met het verzoek daarover een deskundigheidsadvies uit te brengen. Indien toepassing wordt
      gegeven aan de derde volzin, worden de termijnen van bezwaar en beroep opgeschort.

      4 Het derde lid is niet van toepassing ten aanzien van leerlingen die overeenkomstig de op 31 juli 1998 geldende
      voorschriften reeds met ingang van 1 augustus 1998 waren toegelaten tot de in [artikel II, eerste lid][ref9],
      bedoelde afdelingen voor individueel voorbereidend beroepsonderwijs, en de in [artikel III, eerste lid][ref10],
      bedoelde scholen voor voortgezet speciaal onderwijs en scholen voor speciaal en voortgezet speciaal onderwijs.


