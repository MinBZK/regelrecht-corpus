      1 In afwijking van [artikel 10h van de Wet op het voortgezet onderwijs][ref1] zoals luidend ingevolge deze wet,
      sluiten het bevoegd gezag van een school voor speciaal voortgezet onderwijs, het bevoegd gezag van een school
      waaraan een afdeling voor speciaal voortgezet onderwijs is verbonden en het bevoegd gezag van een school voor
      leerwegondersteunend onderwijs, zich uiterlijk met ingang van 1 januari 1999 aan bij een samenwerkingsverband als
      bedoeld in [artikel 10h van de Wet op het voortgezet onderwijs][ref2].

      2 [Artikel 10h, tweede lid, van de Wet op het voortgezet onderwijs][ref3] zoals luidend ingevolge deze wet, is
      van toepassing.

      3 In de periode van 1 augustus 1998 tot en met 31 juli 2002 wordt een besluit van het samenwerkingsverband, bedoeld
      in [artikel 10h van de Wet op het voortgezet onderwijs][ref4], slechts genomen met de instemming van het bevoegd
      gezag van elk van de aangesloten scholen, bedoeld in het eerste lid.


