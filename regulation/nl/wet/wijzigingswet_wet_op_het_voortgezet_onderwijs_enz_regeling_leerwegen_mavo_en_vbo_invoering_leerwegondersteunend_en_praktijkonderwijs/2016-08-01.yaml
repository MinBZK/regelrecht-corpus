      1 Met ingang van een bij koninklijk besluit te bepalen tijdstip worden de scholen voor leerwegondersteunend
      onderwijs en de afdelingen voor leerwegondersteunend onderwijs, bedoeld in artikel II, tweede lid,
      onderscheidenlijk in de artikelen II, eerste lid, en IV, eerste lid, opgeheven voor zover het openbaar onderwijs
      betreft, dan wel gaat de aanspraak op bekostiging ten behoeve van die scholen en afdelingen verloren voor zover het
      bijzonder onderwijs betreft.

      2 De leerlingen die op de dag voorafgaand aan het in het eerste lid bedoelde tijdstip zijn ingeschreven aan de
      in het eerste lid bedoelde scholen en afdelingen, zijn met ingang van dat tijdstip ten behoeve van het volgen
      van leerwegondersteunend onderwijs als bedoeld in [artikel 10e van de Wet op het voortgezet onderwijs][ref1]
      zoals luidend ingevolge deze wet, ingeschreven aan de school waaraan die scholen voor leerwegondersteunend worden
      verbonden onderscheidenlijk aan de school waaraan die afdelingen op de dag voorafgaand aan dat tijdstip waren
      verbonden.


