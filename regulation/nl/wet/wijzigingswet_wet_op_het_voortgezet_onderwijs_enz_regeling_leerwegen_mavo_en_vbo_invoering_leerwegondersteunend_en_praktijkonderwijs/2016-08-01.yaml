preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is te komen tot verbetering van de aansluiting van het
    middelbaar algemeen voortgezet onderwijs en het voorbereidend beroepsonderwijs op het vervolgonderwijs en de
    arbeidsmarkt, door deze onderwijsvormen meer het karakter te geven van voorbereidend middelbaar beroepsonderwijs;

    dat het in verband daarmee noodzakelijk is de Wet op het voortgezet onderwijs te wijzigen door het invoeren
    van leerwegen in de hogere leerjaren van het middelbaar algemeen voortgezet onderwijs en het voorbereidend
    beroepsonderwijs, door het invoeren van leerwegondersteunend onderwijs als voorziening voor leerlingen die met
    behulp daarvan dit onderwijs met goed gevolg kunnen voltooien, door het invoeren van de verplichting voor scholen
    om deel te nemen aan een samenwerkingsverband, alsmede door het in de wet opnemen van scholen en afdelingen voor
    praktijkonderwijs die tot taak hebben het verzorgen van niet-diplomagericht onderwijs;

    dat het mede in verband met de afloop van de geldigheidsduur van de Interimwet op het speciaal onderwijs en
    het voortgezet speciaal onderwijs noodzakelijk is het voortgezet speciaal onderwijs aan leerlingen met leer-
    en opvoedingsmoeilijkheden, aan moeilijk lerende kinderen en aan zeer moeilijk opvoedbare kinderen binnen het
    voortgezet onderwijs te positioneren, ten einde te bevorderen dat zo veel mogelijk van deze leerlingen de leerwegen
    van het voortgezet onderwijs met goed gevolg voltooien en dat de in het voortgezet speciaal onderwijs aanwezige
    deskundigheid zo veel mogelijk ten behoeve van het voortgezet onderwijs kan worden ingezet;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
