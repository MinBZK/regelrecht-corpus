  - number: XXIII
    text: |-
      1 Onze Minister van Onderwijs, Cultuur en Wetenschappen zendt, in overeenstemming met Onze Minister van
      Landbouw, Natuurbeheer en Visserij, voor 1 augustus 2000 een verslag aan de beide Kamers der Staten-
      Generaal over de voortgang van het in de [artikelen II][ref1] tot en met [VIII][ref2], en [XI][ref3]
      tot en met XXI geregelde proces, alsmede over de stand van zaken met betrekking tot de uitvoering van
      [artikel 77, vierde lid, van de Wet op het voortgezet onderwijs][ref4] zoals luidend ingevolge deze
      wet. Indien uit dat verslag onvoldoende voortgang blijkt, geeft het verslag de oorzaken daarvan aan,
      en vermeldt het de ter oplossing daarvan te treffen maatregelen ten aanzien van het genoemde proces,
      onderscheidenlijk doet het voorstellen voor het vaststellen van een later tijdstip van inwerkingtreding van
      [genoemd artikel 77, vierde lid][ref5], dan genoemd in artikel XXVIII, onderdeel a.

      2 Indien daartoe door een of beide kamers der Staten-Generaal de wens wordt te kennen gegeven, wordt, in afwijking
      van het bepaalde in deze wet, bij koninklijk besluit een latere datum vastgesteld dan de datum, genoemd in de
      [artikelen II, vijfde lid][ref6], [IV, eerste lid][ref7], IVa, eerste lid, V, eerste lid, VI, eerste lid, VIII,
      eerste lid, en XXVIII, onderdeel a, wat [artikel 77, vierde lid][ref8], betreft. Het koninklijk besluit kan voor de
      verschillende genoemde artikelen verschillende data vaststellen.


