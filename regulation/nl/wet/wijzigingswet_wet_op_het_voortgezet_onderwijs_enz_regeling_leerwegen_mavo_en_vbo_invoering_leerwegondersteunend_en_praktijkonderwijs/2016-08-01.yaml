  - number: XVI
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur worden ten behoeve van het personeel dat op de dag voorafgaand
      aan het tijdstip met ingang waarvan aan de [artikelen II][ref1], [IV][ref2], [V][ref3] en [VIII][ref4] toepassing
      wordt gegeven, was verbonden aan

      a. een in [artikel II, eerste en tweede lid][ref5], V, eerste lid, of VIII, eerste lid, bedoelde school
      voor voorbereidend beroepsonderwijs of scholengemeenschap waarvan ten minste een school voor voorbereidend
      beroepsonderwijs deel uitmaakt,

      b. een in [artikel III, eerste lid][ref6], of VII, eerste lid, bedoelde school voor speciaal voortgezet onderwijs
      of afdeling voor speciaal voortgezet onderwijs, of

      c. een in [artikel IV, eerste lid][ref7], bedoelde school voor middelbaar algemeen voortgezet onderwijs of
      scholengemeenschap waarvan ten minste een school voor middelbaar algemeen voortgezet onderwijs en een school
      voor voorbereidend beroepsonderwijs deel uitmaken, voorschriften vastgesteld met betrekking tot het behoud van
      de aanspraak op salariëring conform de schaal die gold voor de functie ten tijde van het in de aanhef bedoelde
      tijdstip.

      2 Ten behoeve van een goede uitvoering van het eerste lid door de bevoegde gezagsorganen van de in het eerste lid
      bedoelde scholen en scholengemeenschappen, wordt volgens bij ministeriële regeling vast te stellen voorschriften
      de omvang van de normatieve personele bekostiging, vastgesteld op basis van de ministeriële regeling, bedoeld in
      de [artikelen II, zesde lid][ref8], [IV, tweede lid][ref9], [V, derde lid][ref10], en [VIII, vierde lid][ref11],
      normatief verhoogd dan wel verlaagd. De ministeriële regeling bevat tevens voorschriften met betrekking tot:

      a. de periode en de mate waarin de in de eerste volzin bedoelde verhoging dan wel verlaging van de omvang van de
      bekostiging wordt toegepast, en

      b. de afrekening van de personeelskosten die betrekking hebben op de periode voor het in het eerste lid bedoelde
      tijdstip ten aanzien van de scholen en afdelingen, bedoeld in het eerste lid, onderdeel b.

      3 De in het eerste lid bedoelde algemene maatregel van bestuur wordt aan de beide kamers der Staten-Generaal
      overgelegd. De maatregel treedt niet eerder in werking dan nadat vier weken na de overlegging zijn verstreken
      en gedurende die termijn niet door of namens een van beide kamers de wens wordt te kennen gegeven dat het in die
      maatregel geregelde onderwerp bij de wet wordt geregeld. Alsdan wordt een daartoe strekkend wetsvoorstel zo spoedig
      mogelijk ingediend.


