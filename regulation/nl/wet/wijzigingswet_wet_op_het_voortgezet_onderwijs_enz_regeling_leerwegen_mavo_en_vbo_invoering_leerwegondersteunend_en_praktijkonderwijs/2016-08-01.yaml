  - number: XXII
    text: |-
      1 Voor zover deze wet daarin niet voorziet, alsmede indien nodig in afwijking van het bij en krachtens deze wet
      bepaalde, kunnen bij ministeriële regeling voor bepaalde tijd regels worden vastgesteld ten behoeve van een goede
      invoering van de door deze wet gewijzigde of toegevoegde bepalingen van de [Wet op het voortgezet onderwijs][ref1]
      en de [Wet educatie en beroepsonderwijs][ref2]. Ten behoeve van de goede invoering van de in de eerste volzin
      bedoelde gewijzigde of toegevoegde bepalingen kan bij ministeriële regeling voor bepaalde tijd eveneens worden
      afgeweken van het overigens bepaalde bij en krachtens de in die volzin genoemde wetten.

      2 Het ontwerp van een ministeriële regeling als bedoeld in het eerste lid wordt ten minste vier weken voordat de
      regeling wordt vastgesteld, toegezonden aan de beide kamers der Staten-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0002399
      [ref2]: https://wetten.overheid.nl/BWBR0007625
