articles:
  - number: II
    text: |-
      1 Met ingang van 1 augustus 1998 zijn de afdelingen voor individueel voorbereidend beroepsonderwijs die op grond
      van de bij of krachtens de [Wet op het voortgezet onderwijs][ref1] vastgestelde voorschriften zoals die luidden
      op 31 juli 1998, aan scholen voor voorbereidend beroepsonderwijs of scholengemeenschappen waarvan ten minste een
      school voor voorbereidend beroepsonderwijs deel uitmaakt, zijn verbonden, afdelingen voor leerwegondersteunend
      onderwijs verbonden aan die scholen of scholengemeenschappen. Indien aan een in de eerste volzin bedoelde school of
      scholengemeenschap twee of meer afdelingen voor individueel voorbereidend beroepsonderwijs zijn verbonden, worden
      zij gezamenlijk één afdeling voor leerwegondersteunend onderwijs. Onverminderd artikel IVa, verzorgen de afdelingen
      voor leerwegondersteunend onderwijs, verbonden aan een in de eerste en tweede volzin bedoelde scholengemeenschap,
      dat leerwegondersteunend onderwijs uitsluitend voor die leerlingen van de scholengemeenschap die voorbereidend
      beroepsonderwijs volgen.

      2 Het eerste lid is van overeenkomstige toepassing ten aanzien van de scholen voor individueel voorbereidend
      beroepsonderwijs, met dien verstande dat deze scholen scholen voor leerwegondersteunend onderwijs zijn.

      3 Op de in het eerste lid bedoelde afdelingen voor leerwegondersteunend onderwijs en op de in het tweede
      lid bedoelde scholen voor leerwegondersteunend onderwijs blijven tot 1 augustus 2002 van toepassing de
      voorschriften met betrekking tot het individueel voorbereidend beroepsonderwijs, vastgesteld bij of krachtens
      de [Wet op het voortgezet onderwijs][ref2] zoals die voorschriften luidden op 31 juli 1998. In afwijking van de
      eerste volzin zijn op de in de eerste volzin bedoelde afdelingen en scholen voor leerwegondersteunend onderwijs ter
      zake van de inhoud van het onderwijs van toepassing de voorschriften met betrekking tot het leerwegondersteunend
      onderwijs, bedoeld in [artikel 10e van de Wet op het voortgezet onderwijs][ref3] zoals luidend ingevolge deze wet.

      4 Van de in het derde lid, eerste volzin, bedoelde voorschriften die bij wet of algemene maatregel van bestuur
      zijn vastgesteld, kan in verband met nieuwe ontwikkelingen worden afgeweken bij algemene maatregel van bestuur
      onderscheidenlijk ministeriële regeling.

      5 Uiterlijk voor 1 augustus 2002 kan Onze Minister van Onderwijs, Cultuur en Wetenschappen of, voor zover het
      betreft het landbouwonderwijs, Onze Minister van Landbouw, Natuurbeheer en Visserij, in afwijking van het eerste
      en tweede lid, op aanvraag van het bevoegd gezag van een in het eerste lid bedoelde school voor voorbereidend
      beroepsonderwijs waaraan een afdeling voor leerwegondersteunend onderwijs is verbonden onderscheidenlijk van een in
      het tweede lid bedoelde school voor leerwegondersteunend onderwijs een of meer van de afdelingen voor individueel
      voorbereidend beroepsonderwijs die op grond van het eerste lid zijn opgegaan in de aan die school verbonden
      afdeling voor leerwegondersteunend onderwijs onderscheidenlijk die school voor leerwegondersteunend onderwijs
      in aanmerking brengen voor bekostiging als afdeling voor praktijkonderwijs onderscheidenlijk als school voor
      praktijkonderwijs, tenzij dat niet in overeenstemming is met een evenwichtig geheel van onderwijsvoorzieningen.
      Het bevoegd gezag overlegt bij zijn aanvraag het advies van de bevoegde gezagsorganen in het samenwerkingsverband
      waarvan het bevoegd gezag op grond van [artikel 10h van de Wet op het voortgezet onderwijs][ref4], deel uitmaakt,
      alsmede het advies van de gemeente waarin de afdeling voor praktijkonderwijs onderscheidenlijk school voor
      praktijkonderwijs is gevestigd.

      6 Bij ministeriële regeling worden ten behoeve van de afdelingen onderscheidenlijk scholen voor praktijkonderwijs,
      bedoeld in het vijfde lid, voorschriften vastgesteld met betrekking tot de bekostiging en rechtspositionele
      voorschriften. De voorschriften zijn op de in de eerste volzin bedoelde afdelingen onderscheidenlijk scholen van
      toepassing tot 1 augustus 2003.

      7 Het in het eerste lid bedoelde bevoegd gezag zendt een aanvraag om toepassing van het vijfde lid uiterlijk 1
      december van het kalenderjaar voorafgaand aan het schooljaar waarop de aanvraag betrekking heeft, aan Onze Minister
      van Onderwijs, Cultuur en Wetenschappen dan wel aan Onze Minister van Landbouw, Natuurbeheer en Visserij. Onze
      Minister beslist binnen drie maanden op de aanvraag. Indien de beschikking niet binnen drie maanden kan worden
      gegeven, stelt Onze Minister het bevoegd gezag daarvan in kennis en noemt hij daarbij een termijn waarbinnen de
      beschikking wel tegemoet kan worden gezien.


