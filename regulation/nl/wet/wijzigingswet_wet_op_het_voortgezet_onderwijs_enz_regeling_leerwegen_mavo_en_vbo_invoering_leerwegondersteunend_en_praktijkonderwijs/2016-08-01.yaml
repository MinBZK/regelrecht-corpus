  - number: XXVIII
    text: |-
      Deze wet treedt in werking met ingang van 1 augustus 1998, met uitzondering van:

      a. [artikel I, onderdelen][ref1] JJ, onder 3, tot en met VV, EEE en FFF, dat in werking treedt met ingang van 1
      augustus 2002,

      b. [artikel I, onderdeel H][ref2], en artikel XXIV, onderdelen F, G en H, die in werking treden met ingang van 1
      augustus 2003.

      c. [artikel I, onderdelen][ref3] CCC en DDD, dat in werking treedt met ingang van de dag na de datum van uitgifte
      van het Staatsblad waarin deze wet wordt geplaatst en terugwerkt tot en met 1 januari 1996,

      d. artikel XXI, dat in werking treedt met ingang van een bij koninklijk besluit te bepalen tijdstip, en

      e. de [artikelen XVII, derde lid][ref4], XXV en XXVI, die in werking treden met ingang van de dag na de datum van
      uitgifte van het Staatsblad waarin deze wet wordt geplaatst.


