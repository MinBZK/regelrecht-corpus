  - number: IV
    text: |-
      1 Uiterlijk voor 1 augustus 2002 brengt Onze Minister van Onderwijs, Cultuur en Wetenschappen op aanvraag
      van het bevoegd gezag van een in [artikel III][ref1] bedoelde school die school onderscheidenlijk de aan die
      school verbonden afdeling in aanmerking voor bekostiging als afdeling voor leerwegondersteunend onderwijs,
      verbonden aan een school voor middelbaar algemeen voortgezet onderwijs die staat onder het bestuur van een
      bevoegd gezag dat tevens bevoegd gezag is van in ieder geval een school voor voorbereidend beroepsonderwijs,
      aan een school voor voorbereidend beroepsonderwijs of aan een scholengemeenschap waarvan ten minste een school
      voor middelbaar algemeen voortgezet onderwijs en een school voor voorbereidend beroepsonderwijs deel uitmaken,
      tenzij dat niet in overeenstemming is met een evenwichtig geheel van onderwijsvoorzieningen. Op de in de
      eerste volzin bedoelde afdelingen voor leerwegondersteunend onderwijs zijn ter zake van de inhoud van het
      onderwijs van toepassing de voorschriften met betrekking tot het leerwegondersteunend onderwijs, bedoeld in
      [artikel 10e van de Wet op het voortgezet onderwijs][ref2] zoals luidend ingevolge deze wet.

      2 Bij ministeriële regeling worden ten behoeve van de afdelingen, bedoeld in het eerste lid, voorschriften
      vastgesteld met betrekking tot de bekostiging en rechtspositionele voorschriften. De voorschriften zijn op de in de
      eerste volzin bedoelde afdelingen van toepassing tot 1 augustus 2003.

      3 Het bevoegd gezag van een in [artikel III][ref3] bedoelde school kan bij zijn aanvraag, bedoeld in het eerste
      lid, en in overeenstemming met het bevoegd gezag van de school of scholengemeenschap waaraan de afdeling voor
      leerwegondersteunend onderwijs zal worden verbonden, tevens verzoeken om die afdeling voor leerwegondersteunend
      onderwijs als nevenvestiging aan te merken, indien de in [artikel III, eerste lid][ref4], bedoelde school
      onderscheidenlijk de in [artikel III, tweede lid][ref5], bedoelde afdeling voor zover het betreft het voortgezet
      speciaal onderwijs, voorafgaand aan de aanvraag, als een zelfstandige school functioneerde. Onze Minister van
      Onderwijs, Cultuur en Wetenschappen willigt de in de eerste volzin bedoelde aanvraag in, tenzij dat niet in
      overeenstemming is met een evenwichtig geheel van onderwijsvoorzieningen.

      4 Bij ministeriële regeling kunnen nadere voorschriften worden vastgesteld omtrent het in het derde lid bepaalde.

      5 Het bevoegd gezag zendt een aanvraag om toepassing van het eerste en derde lid uiterlijk 1 december van het
      kalenderjaar voorafgaand aan het schooljaar waarop de aanvraag betrekking heeft, aan Onze Minister van Onderwijs,
      Cultuur en Wetenschappen. Onze Minister beslist binnen drie maanden op de aanvraag. Indien de beschikking niet
      binnen drie maanden kan worden gegeven, stelt Onze Minister het bevoegd gezag daarvan in kennis en noemt hij
      daarbij een termijn waarbinnen de beschikking wel tegemoet kan worden gezien.


