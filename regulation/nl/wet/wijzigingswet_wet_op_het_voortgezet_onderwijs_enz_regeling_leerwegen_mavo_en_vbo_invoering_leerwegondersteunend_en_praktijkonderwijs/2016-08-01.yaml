  - number: IVA
    text: |-
      1 Tot 1 augustus 2002 kan leerwegondersteunend onderwijs, bedoeld in
      [artikel 10e van de Wet op het voortgezet onderwijs][ref1], ten behoeve van leerlingen van een scholengemeenschap
      als bedoeld in [artikel II, eerste lid][ref2], slechts worden verzorgd voor zover die leerlingen onderwijs volgen
      in een van de beroepsgerichte leerwegen, genoemd in [artikel 10b van de Wet op het voortgezet onderwijs][ref3],
      met dien verstande dat vanaf het tijdstip waarop Onze Minister van Onderwijs, Cultuur en Wetenschappen
      toepassing geeft aan [artikel IV, eerste lid][ref4], leerwegondersteunend onderwijs in dat geval
      tevens kan worden verzorgd ten behoeve van leerlingen die aan die scholengemeenschap onderwijs volgen
      in de theoretische leerweg of de gemengde leerweg, bedoeld in [artikel 10][ref5] onderscheidenlijk
      [artikel 10d van de Wet op het voortgezet onderwijs][ref6].

      2 Onze Minister van Onderwijs, Cultuur en Wetenschappen kan het eerste lid van overeenkomstige toepassing
      verklaren, indien

      a. [artikel IV, eerste lid][ref7], ten behoeve van het bevoegd gezag van een in [artikel III][ref8] bedoelde school
      of afdeling, nog geen toepassing heeft gevonden,

      b. dat bevoegd gezag op basis van [artikel XIII][ref9] deel uitmaakt van een samenwerkingsverband waarvan tevens
      ten minste een scholengemeenschap als bedoeld in [artikel II, eerste lid][ref10], deel uitmaakt, en

      c. het bevoegd gezag van de in onderdeel b bedoelde scholengemeenschap in overeenstemming met de bevoegde
      gezagsorganen in het samenwerkingsverband, een aanvraag daartoe indient bij Onze Minister van Onderwijs, Cultuur
      en Wetenschappen.


