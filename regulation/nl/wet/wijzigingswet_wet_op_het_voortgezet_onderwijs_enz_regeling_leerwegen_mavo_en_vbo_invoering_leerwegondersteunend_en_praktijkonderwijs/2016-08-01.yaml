  - number: VII
    text: |-
      1 Met ingang van 1 augustus 1998 worden scholen voor voortgezet speciaal onderwijs aan moeilijk lerende kinderen,
      bedoeld in [deel II van de Wet op het voortgezet onderwijs](onbekend), aangeduid als scholen voor speciaal
      voortgezet onderwijs.

      2 Met ingang van 1 augustus 1998 worden afdelingen voor voortgezet speciaal onderwijs aan
      moeilijk lerende kinderen, verbonden aan speciale scholen voor basisonderwijs als bedoeld in
      [artikel XXXVII van de Wet van 2 april 1998][ref1] (Stb. 228), aangeduid als afdelingen voor speciaal voortgezet
      onderwijs.

      3 Op de in het eerste en tweede lid bedoelde scholen en afdelingen zijn ter zake van de toelating van leerlingen
      de voorwaarden voor toelating van de [artikelen 10g][ref2] en [27 van de Wet op het voortgezet onderwijs][ref3] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009525#ArtikelXVIII
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel10g
