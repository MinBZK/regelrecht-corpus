  - number: XIX
    text: |-
      A 1. In het jaar 2002 wordt voor de laatste maal gelegenheid gegeven tot het afleggen van het eindexamen of het
      staatsexamen middelbaar algemeen voortgezet onderwijs volgens de op 31 juli 1998 geldende bij en krachtens de
      [Wet op het voortgezet onderwijs][ref1] vastgestelde voorschriften. Degenen die in dat jaar dit eindexamen of
      staatsexamen hebben afgelegd en zijn afgewezen, worden in het jaar 2003 voor de laatste maal in de gelegenheid
      gesteld dit eindexamen of staatsexamen af te leggen.

      2. In het schooljaar 2001–2002 wordt voor de laatste maal gelegenheid gegeven tot het afleggen van
      het eindexamen voorbereidend beroepsonderwijs volgens de op 31 juli 1998 geldende bij en krachtens de
      [Wet op het voortgezet onderwijs][ref2] vastgestelde voorschriften. Degenen die in dat schooljaar dit eindexamen
      hebben afgelegd en zijn afgewezen, worden in het schooljaar 2002–2003 voor de laatste maal in de gelegenheid
      gesteld dit eindexamen af te leggen.

      3. In het studiejaar 2001–2002 wordt voor de laatste maal gelegenheid gegeven tot het afleggen
      van het examen van een opleiding voortgezet algemeen volwassenenonderwijs als bedoeld in
      [artikel 7.3.1, eerste lid, onderdeel a, van de Wet educatie en beroepsonderwijs][ref3], voor zover gericht op
      het behalen van het diploma middelbaar algemeen voortgezet onderwijs, volgens de op 31 juli 1998 geldende bij en
      krachtens de Wet educatie en beroepsonderwijs vastgestelde voorschriften. Degenen die in dat studiejaar dit examen
      hebben afgelegd en zijn afgewezen, worden in het studiejaar 2002–2003 voor de laatste maal in de gelegenheid
      gesteld dit examen af te leggen.

      4. In afwijking van het eerste lid, tweede volzin, en tweede lid, tweede volzin, worden degenen ten aanzien van
      wie de inspectie [artikel 27, vijfde tot en met zevende lid, van de Wet op het voortgezet onderwijs][ref4] heeft
      toegepast, in het jaar 2004 onderscheidenlijk in het schooljaar 2003–2004 voor de laatste maal in de gelegenheid
      gesteld het in het eerste of tweede lid bedoelde eindexamen of staatsexamen af te leggen.

      B Bij ministeriële regeling kan worden afgeweken van de op 31 juli 1998 geldende voorschriften die ingevolge
      onderdeel A blijven gelden, voor zover dit voor een goede gang van zaken noodzakelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0002399
      [ref2]: https://wetten.overheid.nl/BWBR0002399
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel7.3.1
      [ref4]: https://wetten.overheid.nl/BWBR0002399#Artikel27
