  - number: XVII
    text: |-
      1 Het bevoegd gezag van een school voor middelbaar algemeen voortgezet onderwijs of van een school voor
      voorbereidend beroepsonderwijs verzorgt met ingang van het schooljaar 1999–2000 het onderwijs met het oog op de
      bij en krachtens de [Wet op het voortgezet onderwijs][ref1] zoals luidend ingevolge deze wet, gegeven voorschriften
      vanaf het eerste leerjaar.

      2 Gedurende het schooljaar 1998–1999, alsmede in de leerjaren waarin geen toepassing wordt gegeven aan het eerste
      lid, blijven de voorschriften bij en krachtens de [Wet op het voortgezet onderwijs][ref2] zoals die wet luidde op
      31 juli 1998, van toepassing.

      3 In afwijking van [artikel 27, derde lid, van de Wet op het voortgezet onderwijs][ref3], kunnen leerlingen die:

      a. uiterlijk met ingang van het schooljaar 1998–1999 zijn aangevangen met middelbaar algemeen voortgezet onderwijs
      of voorbereidend beroepsonderwijs,

      b. het onderwijs in het eerste, tweede of derde leerjaar voor de tweede maal volgen of hebben gevolgd, en

      c. het onderwijs na afloop van het vierde leerjaar niet met succes hebben afgerond,

      alsnog en uiterlijk in het schooljaar 2003–2004 het onderwijs in het vierde leerjaar volgen en een volledig
      eindexamen afleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0002399
      [ref2]: https://wetten.overheid.nl/BWBR0002399
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel27
