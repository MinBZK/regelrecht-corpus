  - number: V
    text: |-
      1 In afwijking van [artikel IV][ref1], kan Onze Minister van Onderwijs, Cultuur en Wetenschappen op aanvraag
      van het bevoegd gezag van een in [artikel III, eerste lid][ref2], bedoelde school die school onderscheidenlijk
      de aan die school verbonden afdeling uiterlijk voor 1 augustus 2002 in aanmerking brengen voor bekostiging
      als school voor praktijkonderwijs onderscheidenlijk als afdeling voor praktijkonderwijs, verbonden aan een
      school voor voorbereidend beroepsonderwijs of aan een scholengemeenschap waarvan ten minste een school voor
      voorbereidend beroepsonderwijs deel uitmaakt, tenzij dat niet in overeenstemming is met een evenwichtig geheel
      van onderwijsvoorzieningen.

      2 Het in het eerste lid bedoelde bevoegd gezag overlegt bij zijn aanvraag het advies van de bevoegde gezagsorganen
      in het samenwerkingsverband waarvan het bevoegd gezag op grond van artikel XIII van deze wet deel uitmaakt, alsmede
      het advies van de gemeente waarin de in [artikel III, eerste lid][ref3], bedoelde school is gevestigd.

      3 [Artikel IV, tweede, derde, vierde en vijfde lid][ref4], is van overeenkomstige toepassing.


