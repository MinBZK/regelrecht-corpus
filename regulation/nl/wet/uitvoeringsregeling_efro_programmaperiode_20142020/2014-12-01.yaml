preamble:
  text: |-
    Gelet op de artikelen 37, 65, eerste lid, 71, eerste lid, en 125, derde lid, van Verordening (EU) Nr. 1303/2013 van
    het Europees Parlement en de Raad van 17 december 2013 houdende gemeenschappelijke bepalingen inzake het Europees
    Fonds voor regionale ontwikkeling, het Europees Sociaal Fonds, het Cohesiefonds, het Europees Landbouwfonds voor
    plattelandsontwikkeling en het Europees Fonds voor maritieme zaken en visserij en algemene bepalingen inzake het
    Europees Fonds voor regionale ontwikkeling, het Europees Sociaal Fonds, het Cohesiefonds en het Europees Fonds
    voor maritieme zaken en visserij, en tot intrekking van Verordening (EG) nr. 1083/2006 van de Raad (PbEU L 347), en
    artikel 6 van de Uitvoeringswet EFRO;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0035808/2014-12-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In deze regeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0035808/2014-12-01#Artikel1.1
  - number: 1.1.a
    text: '*minister:* Minister van Economische Zaken;'
    url: https://wetten.overheid.nl/BWBR0035808/2014-12-01#Artikel1.1
  - number: 1.1.b
    text: '*auditautoriteit:* door de minister als zodanig aangewezen autoriteit;'
    url: https://wetten.overheid.nl/BWBR0035808/2014-12-01#Artikel1.1
  - number: 1.1.c
    text: '*certificeringsautoriteit:* door de minister als zodanig aangewezen autoriteit;'
    url: https://wetten.overheid.nl/BWBR0035808/2014-12-01#Artikel1.1
  - number: 1.1.d
    text: '*managementautoriteit:* door de minister als zodanig aangewezen autoriteit;'
    url: https://wetten.overheid.nl/BWBR0035808/2014-12-01#Artikel1.1
  - number: 1.1.e
    text: |-
      *verordening 1299/2013:* Verordening (EU) nr. 1299/2013 van het Europees Parlement en de Raad van 17 december 2013
      betreffende specifieke bepalingen voor steun uit het Europees Fonds voor regionale ontwikkeling ter verwezenlijking
      van de doelstelling "Europese territoriale samenwerking" (PbEU L 347);
    url: https://wetten.overheid.nl/BWBR0035808/2014-12-01#Artikel1.1
  - number: 1.1.f
    text: |-
      *verordening 1301/2013:* Verordening (EU) nr. 1301/2013 van het Europees Parlement en de Raad van 17 december
      2013 betreffende het Europees Fonds voor Regionale Ontwikkeling en specifieke bepalingen met betrekking tot de
      doelstelling ‘investeren in groei en werkgelegenheid’, en tot intrekking van [Verordening (EG) nr. 1080/2006]
      (32006R1080) (PbEU L 347);
    url: https://wetten.overheid.nl/BWBR0035808/2014-12-01#Artikel1.1
  - number: 1.1.g
    text: |-
      *verordening 1303/2013:* Verordening (EU) nr. 1303/2013 van het Europees Parlement en de Raad van 17 december
      2013 houdende gemeenschappelijke bepalingen inzake het Europees Fonds voor regionale ontwikkeling, het Europees
      Sociaal Fonds, het Cohesiefonds, het Europees Landbouwfonds voor plattelandsontwikkeling en het Europees Fonds
      voor maritieme zaken en visserij en algemene bepalingen inzake het Europees Fonds voor regionale ontwikkeling, het
      Europees Sociaal Fonds, het Cohesiefonds en het Europees Fonds voor maritieme zaken en visserij, en tot intrekking
      van [Verordening (EG) nr. 1083/2006](32006R1083) van de Raad (PbEU L 347);
    url: https://wetten.overheid.nl/BWBR0035808/2014-12-01#Artikel1.1
  - number: 1.1.h
    text: |-
      *bruto jaarloon:* bruto jaarsalaris, inclusief een niet-prestatiegebonden eindejaarsuitkering of een beloning in de
      vorm van een dertiende maand, zijnde een vast bedrag of vastgesteld percentage van het salaris, dat werknemers als
      extra loon ontvangen, voor zover dit is geregeld in de geldende CAO of arbeidsovereenkomst, exclusief vakantiegeld,
      exclusief (overige) vergoedingen, bijzondere beloningen, winst- of prestatieafhankelijke uitkeringen en aanvullende
      werkgeverslasten;
    url: https://wetten.overheid.nl/BWBR0035808/2014-12-01#Artikel1.1
  - number: 1.1.i
    text: |-
      *financieringsinstrument:* financieringsinstrument als bedoeld in artikel 37, eerste lid, van [verordening
      1303/2013](32013R1303);
    url: https://wetten.overheid.nl/BWBR0035808/2014-12-01#Artikel1.1
  - number: 1.1.j
    text: |-
      *mkb:* midden- en kleinbedrijf, zoals gedefinieerd in artikel 2, onderdeel 28, van [verordening 1303/2013]
      (32013R1303);
    url: https://wetten.overheid.nl/BWBR0035808/2014-12-01#Artikel1.1
  - number: 1.1.k
    text: |-
      *programmasubsidie:* subsidie die wordt verstrekt aan een autoriteit van een grensoverschrijdend programma ten
      behoeve van het financieren van projecten die binnen dat grensoverschrijdende programma vallen;
    url: https://wetten.overheid.nl/BWBR0035808/2014-12-01#Artikel1.1
  - number: 1.1.l
    text: '*subsidieontvanger:* begunstigde als bedoeld in artikel 2, onderdeel 10, van [verordening 1303/2013](32013R1303).'
    url: https://wetten.overheid.nl/BWBR0035808/2014-12-01#Artikel1.1
  - number: 2.1.1
    text: |-
      De managementautoriteit verstrekt subsidie voor activiteiten passend binnen het programma waarvoor de
      managementautoriteit is aangewezen.
    url: https://wetten.overheid.nl/BWBR0035808/2014-12-01#Artikel2.1
  - number: 2.1.2
    text: |-
      Een subsidie als bedoeld in het eerste lid kan worden verstrekt in de vorm van een bijdrage aan een
      financieringsinstrument.
    url: https://wetten.overheid.nl/BWBR0035808/2014-12-01#Artikel2.1
  - number: 2.2.1
    text: |-
      De managementautoriteit stelt een subsidieplafond of twee of meer deelplafonds ter uitvoering van deze regeling
      vast, alsmede de wijze van verdeling van het beschikbare bedrag onder het desbetreffende plafond.
    url: https://wetten.overheid.nl/BWBR0035808/2014-12-01#Artikel2.2
  - number: 2.2.2
    text: De managementautoriteit kan een beschikbaar subsidiebedrag bestemmen voor een of meer financieringsinstrumenten.
    url: https://wetten.overheid.nl/BWBR0035808/2014-12-01#Artikel2.2
  - number: 2.2.3
    text: |-
      De managementautoriteit maakt de criteria, bedoeld in artikel 125, derde lid, van [verordening 1303/2013]
      (32013R1303), die worden gehanteerd binnen de wijze van verdeling, bedoeld in het eerste lid, bekend.
    url: https://wetten.overheid.nl/BWBR0035808/2014-12-01#Artikel2.2
  - number: '2.3'
    text: |-
      Een aanvraag om subsidie wordt ingediend met gebruikmaking van een middel dat door de managementautoriteit
      beschikbaar wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0035808/2014-12-01#Artikel2.3
  - number: 2.4.1
    text: De managementautoriteit geeft binnen 26 weken een beschikking op een aanvraag tot subsidieverlening.
    url: https://wetten.overheid.nl/BWBR0035808/2014-12-01#Artikel2.4
  - number: 2.4.2
    text: |-
      In het geval van de verdeling van een beschikbaar subsidiebedrag, als bedoeld in [artikel 2.6, onderdeel b][ref1],
      begint de termijn, bedoeld in het eerste lid, op de eerste dag na afloop van de aanvraagperiode.


      [ref1]: https://wetten.overheid.nl/BWBR0035808#Artikel2
    url: https://wetten.overheid.nl/BWBR0035808/2014-12-01#Artikel2.4
    references:
      - id: ref1
        bwb_id: BWBR0035808
        artikel: '2'
        paragraaf: '2'
  - number: 2.5.1
    text: 'De managementautoriteit beslist afwijzend op een aanvraag indien:'
    url: https://wetten.overheid.nl/BWBR0035808/2014-12-01#Artikel2.5
  - number: 2.5.1.a
    text: de totale subsidiabele kosten van het project minder bedragen dan € 200.000;
    url: https://wetten.overheid.nl/BWBR0035808/2014-12-01#Artikel2.5
  - number: 2.5.1.b
    text: |-
      het project niet voldoet aan deze regeling, de EFRO-verordeningen, of de wijze van verdeling van het beschikbare
      bedrag, bedoeld in [artikel 2.2, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0035808#Artikel2
    url: https://wetten.overheid.nl/BWBR0035808/2014-12-01#Artikel2.5
    references:
      - id: ref1
        bwb_id: BWBR0035808
        artikel: '2'
        paragraaf: '2'
  - number: 2.5.1.c
    text: |-
      het project niet voldoende bijdraagt aan de verwezenlijking van de specifieke doelstellingen binnen het programma
      of het gedeelte van het programma waarvoor het deelplafond beschikbaar is gesteld;
    url: https://wetten.overheid.nl/BWBR0035808/2014-12-01#Artikel2.5
  - number: 2.5.1.d
    text: |-
      de aanvrager niet heeft voldaan aan enig wettelijk voorschrift voor het in behandeling nemen van de aanvraag op de
      uiterste datum van indiening in het geval van verdeling zoals bedoeld in [artikel 2.6, onderdeel b][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0035808#Artikel2
    url: https://wetten.overheid.nl/BWBR0035808/2014-12-01#Artikel2.5
    references:
      - id: ref1
        bwb_id: BWBR0035808
        artikel: '2'
        paragraaf: '2'
  - number: 2.5.1.e
    text: |-
      de managementautoriteit door toewijzing niet zou voldoen aan een van de verplichtingen gesteld in artikel 125 van
      [verordening 1303/2013](32013R1303), of
    url: https://wetten.overheid.nl/BWBR0035808/2014-12-01#Artikel2.5
  - number: 2.5.1.f
    text: |-
      de aanvrager een ondernemer is tegen wie een bevel tot terugvordering uitstaat als bedoeld in artikel 1, vierde
      lid, onderdeel a, van Verordening (EU) 651/2014 van de Commissie van 17 juni 2014 waarbij bepaalde categorieën
      steun op grond van de artikelen 107 en 108 van het verdrag met de interne markt verenigbaar worden geacht (PbEU L
      2014, 187).
    url: https://wetten.overheid.nl/BWBR0035808/2014-12-01#Artikel2.5
  - number: 2.5.2
    text: |-
      De managementautoriteit kan geheel of gedeeltelijk afwijzend beslissen op een aanvraag indien blijkt dat de beoogde
      financiering door de overige financiers geheel of gedeeltelijk niet zal worden verleend.
    url: https://wetten.overheid.nl/BWBR0035808/2014-12-01#Artikel2.5
  - number: 2.5.3
    text: |-
      De managementautoriteit kan in afwijking van het eerste lid, aanhef en onderdeel a, bij de wijze van verdeling,
      bedoeld in [artikel 2.2, eerste lid][ref1], bepalen dat het eerste lid, onderdeel a, niet van toepassing is op
      subsidies voor het mkb.


      [ref1]: https://wetten.overheid.nl/BWBR0035808#Artikel2
    url: https://wetten.overheid.nl/BWBR0035808/2014-12-01#Artikel2.5
    references:
      - id: ref1
        bwb_id: BWBR0035808
        artikel: '2'
        paragraaf: '2'
  - number: '2.6'
    text: |-
      Behoudens de bijdrage aan een financieringsinstrument, bedoeld in [artikel 2.2, tweede lid][ref1], verdeelt de
      managementautoriteit een beschikbaar subsidiebedrag


      [ref1]: https://wetten.overheid.nl/BWBR0035808#Artikel2
    url: https://wetten.overheid.nl/BWBR0035808/2014-12-01#Artikel2.6
    references:
      - id: ref1
        bwb_id: BWBR0035808
        artikel: '2'
        paragraaf: '2'
  - number: 2.6.a
    text: |-
      op volgorde van ontvangst van de aanvragen, overeenkomstig [artikel 2.7][ref1] of


      [ref1]: https://wetten.overheid.nl/BWBR0035808#Artikel2
    url: https://wetten.overheid.nl/BWBR0035808/2014-12-01#Artikel2.6
    references:
      - id: ref1
        bwb_id: BWBR0035808
        artikel: '2'
        paragraaf: '2'
  - number: 2.6.b
    text: |-
      op basis van rangschikking naar geschiktheid, overeenkomstig [artikel 2.8][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0035808#Artikel2
    url: https://wetten.overheid.nl/BWBR0035808/2014-12-01#Artikel2.6
    references:
      - id: ref1
        bwb_id: BWBR0035808
        artikel: '2'
        paragraaf: '2'
  - number: 2.7.1
    text: |-
      Volgens de volgorde van ontvangst, bedoeld in [artikel 2.6, onderdeel a][ref1], komt de eerst ontvangen aanvraag
      het eerst voor subsidie in aanmerking.


      [ref1]: https://wetten.overheid.nl/BWBR0035808#Artikel2
    url: https://wetten.overheid.nl/BWBR0035808/2014-12-01#Artikel2.7
    references:
      - id: ref1
        bwb_id: BWBR0035808
        artikel: '2'
        paragraaf: '2'
  - number: 2.7.2
    text: |-
      Indien een aanvrager niet heeft voldaan aan enig wettelijk voorschrift voor het in behandeling nemen van de
      aanvraag en met toepassing van [artikel 4:5 van de Algemene wet bestuursrecht][ref1] de gelegenheid heeft gehad de
      aanvraag aan te vullen, geldt met betrekking tot de verdeling de dag waarop de aanvraag voldoet aan de wettelijke
      voorschriften als datum van ontvangst.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0035808/2014-12-01#Artikel2.7
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 2.7.3
    text: |-
      Indien de managementautoriteit op de dag dat het subsidieplafond wordt bereikt meer dan één aanvraag ontvangt,
      stelt zij de onderlinge rangschikking van die aanvragen vast door middel van loting.
    url: https://wetten.overheid.nl/BWBR0035808/2014-12-01#Artikel2.7
  - number: 2.8.1
    text: |-
      Volgens de rangschikking naar geschiktheid, bedoeld in [artikel 2.6, onderdeel b][ref1], komt de hoogst
      gerangschikte aanvraag het eerst voor subsidie in aanmerking.


      [ref1]: https://wetten.overheid.nl/BWBR0035808#Artikel2
    url: https://wetten.overheid.nl/BWBR0035808/2014-12-01#Artikel2.8
    references:
      - id: ref1
        bwb_id: BWBR0035808
        artikel: '2'
        paragraaf: '2'
  - number: 2.8.2
    text: |-
      Voor zover het subsidieplafond dreigt te worden overschreden, stelt de managementautoriteit de onderlinge
      rangschikking van die aanvragen die bij de beoordeling gelijk zijn gerangschikt vast door middel van loting.
    url: https://wetten.overheid.nl/BWBR0035808/2014-12-01#Artikel2.8
  - number: 2.9.1
    text: |-
      De subsidieontvanger voert het project uit overeenkomstig het projectplan waarop de subsidieverlening betrekking
      heeft en voltooit het uiterlijk op het bij de verlening bepaalde tijdstip.
    url: https://wetten.overheid.nl/BWBR0035808/2014-12-01#Artikel2.9
  - number: 2.9.2
    text: |-
      De in artikel 71, eerste lid, van [verordening 1303/2013](32013R1303) bedoelde termijn van vijf jaar wordt in geval
      van het behoud van investeringen of van door het mkb gecreëerde werkgelegenheid, verkort tot drie jaar.
    url: https://wetten.overheid.nl/BWBR0035808/2014-12-01#Artikel2.9
  - number: '2.10'
    text: Een wijziging van een project waarvoor subsidie wordt verstrekt, betreffende
    url: https://wetten.overheid.nl/BWBR0035808/2014-12-01#Artikel2.10
  - number: 2.10.a
    text: de subsidieontvanger,
    url: https://wetten.overheid.nl/BWBR0035808/2014-12-01#Artikel2.10
  - number: 2.10.b
    text: de uit te voeren activiteiten of de te realiseren doelstellingen,
    url: https://wetten.overheid.nl/BWBR0035808/2014-12-01#Artikel2.10
  - number: 2.10.c
    text: de financiering van het project, of
    url: https://wetten.overheid.nl/BWBR0035808/2014-12-01#Artikel2.10
  - number: 2.10.d
    text: de planning of looptijd,
    url: https://wetten.overheid.nl/BWBR0035808/2014-12-01#Artikel2.10
  - number: 2.11.1
    text: De subsidieontvanger doet onverwijld schriftelijk melding aan de managementautoriteit zodra aannemelijk is dat
    url: https://wetten.overheid.nl/BWBR0035808/2014-12-01#Artikel2.11
  - number: 2.11.1.a
    text: de activiteiten waarvoor subsidie is verleend niet, niet tijdig of niet geheel zullen worden verricht, of
    url: https://wetten.overheid.nl/BWBR0035808/2014-12-01#Artikel2.11
  - number: 2.11.1.b
    text: |-
      niet, niet tijdig of niet geheel aan de aan de beschikking tot subsidieverlening verbonden verplichtingen zal
      worden voldaan.
    url: https://wetten.overheid.nl/BWBR0035808/2014-12-01#Artikel2.11
  - number: '2.12'
    text: |-
      De subsidieontvanger voert een administratie die zodanig is ingericht dat daaruit te allen tijde op
      eenvoudige en duidelijke wijze alle door hem gemaakte en betaalde kosten en de aan het project toe te rekenen
      opbrengsten kunnen worden afgelezen en gespecificeerd, met dien verstande dat ter zake van de kosten bedoeld
      in [artikel 2.13, tweede lid][ref1], een door middel van een inzichtelijke tijdschrijving controleerbare
      urenverantwoording per werknemer aanwezig dient te zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0035808#Artikel2
    url: https://wetten.overheid.nl/BWBR0035808/2014-12-01#Artikel2.12
    references:
      - id: ref1
        bwb_id: BWBR0035808
        artikel: '2'
        paragraaf: '2'
  - number: 2.13.1
    text: 'Als subsidiabele kosten komen in aanmerking aan het project toe te rekenen:'
    url: https://wetten.overheid.nl/BWBR0035808/2014-12-01#Artikel2.13
  - number: 2.13.1.a
    text: loonkosten en overheadkosten voor zover berekend overeenkomstig het tweede lid;
    url: https://wetten.overheid.nl/BWBR0035808/2014-12-01#Artikel2.13
  - number: 2.13.1.b
    text: bijdragen in natura van de subsidieontvanger;
    url: https://wetten.overheid.nl/BWBR0035808/2014-12-01#Artikel2.13
  - number: 2.13.1.c
    text: afschrijvingskosten;
    url: https://wetten.overheid.nl/BWBR0035808/2014-12-01#Artikel2.13
  - number: 2.13.1.d
    text: andere kosten waarvoor een factuur of document met gelijkwaardige bewijskracht kan worden overgelegd.
    url: https://wetten.overheid.nl/BWBR0035808/2014-12-01#Artikel2.13
  - number: 2.13.2
    text: |-
      Loonkosten worden berekend door het aantal aan het project bestede uren te vermenigvuldigen met een volgens één van
      de volgende methodieken berekend tarief:
    url: https://wetten.overheid.nl/BWBR0035808/2014-12-01#Artikel2.13
  - number: 2.13.2.a
    text: |-
      een per medewerker bepaald individueel uurtarief, berekend op basis van bruto jaarloon, vermeerderd met een
      opslag van 32% voor werkgeverslasten, waarna over dat bedrag 15% aan overheadkosten wordt berekend en dat bedrag
      vervolgens door 1.720 uur op basis van een 40-urige werkweek wordt gedeeld;
    url: https://wetten.overheid.nl/BWBR0035808/2014-12-01#Artikel2.13
  - number: 2.13.2.b
    text: |-
      de integrale kostensystematiek, bedoeld in [artikel 12 van het Kaderbesluit EZ-subsidies][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel12
    url: https://wetten.overheid.nl/BWBR0035808/2014-12-01#Artikel2.13
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '12'
  - number: 2.13.2.c
    text: |-
      een door de Europese Commissie goedgekeurde methodiek voor soortgelijke concrete acties en subsidieontvangers, als
      bedoeld in artikel 67, vijfde lid, onderdeel b, van [verordening 1303/2013](32013R1303).
    url: https://wetten.overheid.nl/BWBR0035808/2014-12-01#Artikel2.13
  - number: 2.13.3
    text: |-
      De kosten van de door een subsidieontvanger verrichte eigen arbeid ten behoeve van het project worden, indien een
      berekening overeenkomstig het tweede lid niet mogelijk is, berekend door het aantal uren dat de betrokken persoon
      aan het project ten behoeve van deze activiteiten heeft gemaakt te vermenigvuldigen met een vast uurtarief van
      € 39.
    url: https://wetten.overheid.nl/BWBR0035808/2014-12-01#Artikel2.13
  - number: 2.13.4
    text: 'De volgende kosten komen niet in aanmerking voor subsidie:'
    url: https://wetten.overheid.nl/BWBR0035808/2014-12-01#Artikel2.13
  - number: 2.13.4.a
    text: fooien en geschenken;
    url: https://wetten.overheid.nl/BWBR0035808/2014-12-01#Artikel2.13
  - number: 2.13.4.b
    text: representatiekosten en -vergoedingen;
    url: https://wetten.overheid.nl/BWBR0035808/2014-12-01#Artikel2.13
  - number: 2.13.4.c
    text: kosten van personeelsactiviteiten;
    url: https://wetten.overheid.nl/BWBR0035808/2014-12-01#Artikel2.13
  - number: 2.13.4.d
    text: kosten van overboekingen en annuleringen;
    url: https://wetten.overheid.nl/BWBR0035808/2014-12-01#Artikel2.13
  - number: 2.13.4.e
    text: gratificaties en bonussen;
    url: https://wetten.overheid.nl/BWBR0035808/2014-12-01#Artikel2.13
  - number: 2.13.4.f
    text: kosten van outplacementtrajecten en
    url: https://wetten.overheid.nl/BWBR0035808/2014-12-01#Artikel2.13
  - number: 2.13.4.g
    text: administratieve en financiële sancties en boetes.
    url: https://wetten.overheid.nl/BWBR0035808/2014-12-01#Artikel2.13
  - number: '2.14'
    text: |-
      Indien subsidie wordt verleend in de vorm, bedoeld in artikel 67, eerste lid, onder c, van [verordening 1303/2013]
      (32013R1303), is [artikel 2.13][ref1] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0035808#Artikel2
    url: https://wetten.overheid.nl/BWBR0035808/2014-12-01#Artikel2.14
    references:
      - id: ref1
        bwb_id: BWBR0035808
        artikel: '2'
        paragraaf: '2'
  - number: 2.15.1
    text: De managementautoriteit kan verplichtingen verbinden aan de subsidie.
    url: https://wetten.overheid.nl/BWBR0035808/2014-12-01#Artikel2.15
  - number: 2.15.2
    text: |-
      De managementautoriteit verbindt zodanig verplichtingen aan de subsidie dat de subsidieontvanger aan de
      certificeringsautoriteit en de auditautoriteit de medewerking verleent die zij voor hun taakvervulling nodig
      hebben.
    url: https://wetten.overheid.nl/BWBR0035808/2014-12-01#Artikel2.15
  - number: '2.16'
    text: |-
      Een aanvraag om subsidievaststelling wordt ingediend met gebruikmaking van een middel dat door de
      managementautoriteit beschikbaar wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0035808/2014-12-01#Artikel2.16
  - number: '2.17'
    text: De managementautoriteit geeft binnen 26 weken een beschikking op een aanvraag tot subsidievaststelling.
    url: https://wetten.overheid.nl/BWBR0035808/2014-12-01#Artikel2.17
  - number: 2:18
    text: |-
      De managementautoriteit stelt beleidsregels vast voor de toepassing van financiële correcties, als bedoeld in
      artikel 143, tweede lid, van [Verordening 1303/2013](32013R1303).
    url: https://wetten.overheid.nl/BWBR0035808/2014-12-01#Artikel218
  - number: '2.19'
    text: |-
      Als procedure, bedoeld in artikel 140, vijfde lid, van [verordening 1303/2013](32013R1303) wordt vastgesteld de
      procedure van de bijlage bij deze regeling.
    url: https://wetten.overheid.nl/BWBR0035808/2014-12-01#Artikel2.19
  - number: '3.1'
    text: |-
      De minister verstrekt op aanvraag subsidie aan degene die een project tot stand brengt dat past in een programma en
      dat bijdraagt aan de realisatie van het Rijksbeleid op het gebied van innovatie en koolstofarme economie.
    url: https://wetten.overheid.nl/BWBR0035808/2014-12-01#Artikel3.1
  - number: 3.2.1
    text: |-
      Het subsidieplafond voor subsidies als bedoeld in [artikel 3.1][ref1] is voor de gehele programmaperiode:


      [ref1]: https://wetten.overheid.nl/BWBR0035808#Artikel3
    url: https://wetten.overheid.nl/BWBR0035808/2014-12-01#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0035808
        artikel: '3'
        paragraaf: '3'
  - number: 3.2.1.a
    text: 'voor het programma dat de provincies Groningen, Friesland en Drenthe beslaat: € 18.573.000;'
    url: https://wetten.overheid.nl/BWBR0035808/2014-12-01#Artikel3.2
  - number: 3.2.1.b
    text: 'voor het programma dat de provincies Overijssel en Gelderland beslaat: € 17.991.000;'
    url: https://wetten.overheid.nl/BWBR0035808/2014-12-01#Artikel3.2
  - number: 3.2.1.c
    text: 'voor het programma dat de provincies Limburg, Noord-Brabant en Zeeland beslaat: € 20.384.000;'
    url: https://wetten.overheid.nl/BWBR0035808/2014-12-01#Artikel3.2
  - number: 3.2.1.d
    text: 'voor het programma dat de provincies Zuid-Holland, Noord-Holland, Utrecht en Flevoland beslaat: € 34.052.000.'
    url: https://wetten.overheid.nl/BWBR0035808/2014-12-01#Artikel3.2
  - number: 3.2.2
    text: Het voor de cofinanciering beschikbare bedrag wordt in jaarlijkse tranches beschikbaar gesteld.
    url: https://wetten.overheid.nl/BWBR0035808/2014-12-01#Artikel3.2
  - number: '3.3'
    text: |-
      De minister beslist afwijzend op een aanvraag om subsidie indien het project onvoldoende bijdraagt aan de
      realisatie van het in [artikel 3.1][ref1] bedoelde Rijksbeleid.


      [ref1]: https://wetten.overheid.nl/BWBR0035808#Artikel3
    url: https://wetten.overheid.nl/BWBR0035808/2014-12-01#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0035808
        artikel: '3'
        paragraaf: '3'
  - number: '3.4'
    text: |-
      De [artikelen 2.3 tot en met 2.19][ref1] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0035808#Artikel2
    url: https://wetten.overheid.nl/BWBR0035808/2014-12-01#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0035808
        artikel: '2'
        paragraaf: '2'
  - number: '4.1'
    text: De minister verstrekt op aanvraag een programmasubsidie.
    url: https://wetten.overheid.nl/BWBR0035808/2014-12-01#Artikel4.1
  - number: 4.2.1
    text: |-
      Het subsidieplafond voor subsidies als bedoeld in [artikel 4.1][ref1] is voor de gehele programmaperiode:


      [ref1]: https://wetten.overheid.nl/BWBR0035808#Artikel4
    url: https://wetten.overheid.nl/BWBR0035808/2014-12-01#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0035808
        artikel: '4'
        paragraaf: '4'
  - number: 4.2.1.a
    text: |-
      voor het programma dat de provincies Groningen, Friesland, Drenthe, Overijssel, Flevoland, Gelderland en de COROP-
      gebieden Noordoost-Noord-Brabant, Zuidoost-Noord Brabant, Noord-Limburg, Midden-Limburg alsmede de in aanmerking
      komende Duitse gebieden beslaat: € 22.300.000;
    url: https://wetten.overheid.nl/BWBR0035808/2014-12-01#Artikel4.2
  - number: 4.2.1.b
    text: |-
      voor het programma dat de provincies Zeeland, Noord-Brabant, Limburg alsmede de in aanmerking komende Vlaamse
      gebieden beslaat: € 14.900.000;
    url: https://wetten.overheid.nl/BWBR0035808/2014-12-01#Artikel4.2
  - number: 4.2.1.c
    text: |-
      voor het programma dat de provincie Zeeland en de COROP-gebieden Kop van Noord-Holland, Alkmaar en omgeving,
      IJmond, Agglomeratie Haarlem, Agglomeratie ’s-Gravenhage, Delft en Westland, Agglomeratie Leiden en Bollenstreek,
      Groot-Rijnmond, Zuidoost-Zuid-Holland, West-Noord-Brabant alsmede de in aanmerking komende Engelse, Belgische en
      Franse gebieden beslaat: € 8.200.000, en
    url: https://wetten.overheid.nl/BWBR0035808/2014-12-01#Artikel4.2
  - number: 4.2.1.d
    text: |-
      voor het programma dat de COROP-gebieden Midden-Limburg, Zuid-Limburg, Zuidoost-Noord Brabant alsmede de in
      aanmerking komende Belgische en Duitse gebieden beslaat: € 3.600.000.
    url: https://wetten.overheid.nl/BWBR0035808/2014-12-01#Artikel4.2
  - number: 4.2.2
    text: De minister verleent eenmaal per jaar een voorschot.
    url: https://wetten.overheid.nl/BWBR0035808/2014-12-01#Artikel4.2
  - number: 4.2.3
    text: Rentebaten over een voorschot worden op dezelfde wijze besteed als de programmasubsidie.
    url: https://wetten.overheid.nl/BWBR0035808/2014-12-01#Artikel4.2
  - number: 4.3.1
    text: |-
      De ontvanger van een programmasubsidie financiert geen projecten ten laste van de programmasubsidie zonder
      voorafgaande schriftelijke instemming van de minister.
    url: https://wetten.overheid.nl/BWBR0035808/2014-12-01#Artikel4.3
  - number: 4.3.2
    text: 'De minister onthoudt de instemming, bedoeld in het eerste lid, indien:'
    url: https://wetten.overheid.nl/BWBR0035808/2014-12-01#Artikel4.3
  - number: 4.3.2.a
    text: |-
      het project niet voldoet aan [verordening 1303/2013](32013R1303), [verordening 1301/2013](32013R1301), [verordening
      1299/2013](32013R1299) of deze regeling, of
    url: https://wetten.overheid.nl/BWBR0035808/2014-12-01#Artikel4.3
  - number: 4.3.2.b
    text: |-
      de beoogde financiering door de overige financiers niet of niet volledig is aangevraagd, dan wel niet of niet
      volledig zal worden verleend.
    url: https://wetten.overheid.nl/BWBR0035808/2014-12-01#Artikel4.3
  - number: 4.3.3
    text: |-
      In aanvulling op het tweede lid onthoudt de minister de instemming indien het project niet in voldoende mate
      bijdraagt aan tenminste vier van de volgende aspecten:
    url: https://wetten.overheid.nl/BWBR0035808/2014-12-01#Artikel4.3
  - number: 4.3.3.a
    text: |-
      de ontwikkeling van nieuwe kennis of innovatie dan wel de toepassing van kennis in nieuwe projecten, diensten,
      organisatievormen, processen, markten of combinaties hiervan;
    url: https://wetten.overheid.nl/BWBR0035808/2014-12-01#Artikel4.3
  - number: 4.3.3.b
    text: verbeteren van de aansluiting tussen onderwijs en arbeidsmarkt of arbeidsmobiliteit;
    url: https://wetten.overheid.nl/BWBR0035808/2014-12-01#Artikel4.3
  - number: 4.3.3.c
    text: bijdragen aan het realiseren van een koolstofarme economie;
    url: https://wetten.overheid.nl/BWBR0035808/2014-12-01#Artikel4.3
  - number: 4.3.3.d
    text: efficiënt omgaan met grondstoffen;
    url: https://wetten.overheid.nl/BWBR0035808/2014-12-01#Artikel4.3
  - number: 4.3.3.e
    text: economische structuurversterking binnen economische sectoren of in het programmagebied;
    url: https://wetten.overheid.nl/BWBR0035808/2014-12-01#Artikel4.3
  - number: 4.3.3.f
    text: de deelname van of een brede en intensieve samenwerking met een relevant consortium;
    url: https://wetten.overheid.nl/BWBR0035808/2014-12-01#Artikel4.3
  - number: 4.3.3.g
    text: aannemelijkheid van marktperspectief of kansen op een vervolg;
    url: https://wetten.overheid.nl/BWBR0035808/2014-12-01#Artikel4.3
  - number: 4.3.3.h
    text: |-
      de realisatie van Rijksbeleid op het gebied van innovatie, koolstofarme economie, efficiënt omgaan met grondstoffen
      of verbeteren van de aansluiting tussen onderwijs en arbeidsmarkt;
    url: https://wetten.overheid.nl/BWBR0035808/2014-12-01#Artikel4.3
  - number: 4.3.3.i
    text: |-
      een kruising tussen prioritaire sectoren of een kruising tussen een prioritaire sector en één van de volgende
      sector overstijgende thema’s:
    url: https://wetten.overheid.nl/BWBR0035808/2014-12-01#Artikel4.3
  - number: 4.3.3.i.1°
    text: nanotechnologie,
    url: https://wetten.overheid.nl/BWBR0035808/2014-12-01#Artikel4.3
  - number: 4.3.3.i.2°
    text: ICT;
    url: https://wetten.overheid.nl/BWBR0035808/2014-12-01#Artikel4.3
  - number: 4.3.3.i.3°
    text: circulaire economie, of
    url: https://wetten.overheid.nl/BWBR0035808/2014-12-01#Artikel4.3
  - number: 4.3.3.i.4°
    text: Slimme industrie.
    url: https://wetten.overheid.nl/BWBR0035808/2014-12-01#Artikel4.3
  - number: 4.3.4
    text: Het derde lid is niet van toepassing op projecten in de prioriteit Technische Bijstand.
    url: https://wetten.overheid.nl/BWBR0035808/2014-12-01#Artikel4.3
  - number: '5.1'
    text: Deze regeling treedt in werking met ingang van 1 december 2014.
    url: https://wetten.overheid.nl/BWBR0035808/2014-12-01#Artikel5.1
  - number: '5.2'
    text: 'Deze regeling wordt aangehaald als: Uitvoeringsregeling EFRO programmaperiode 2014–2020.'
    url: https://wetten.overheid.nl/BWBR0035808/2014-12-01#Artikel5.2
