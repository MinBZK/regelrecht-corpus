  text: |-
    Gelet op artikel 3.13, vijfde lid, van de Wet luchtvaart, de artikelen 17 en 22 onderdelen a, b en c van het
    Besluit luchtwaardigheid, artikel 56 van het Luchtverkeersreglement, artikel 116 van de Regeling Toezicht
    Luchtvaart en artikel 7 van het Besluit ongeregeld luchtvervoer;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0017356/2016-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze regeling wordt verstaan onder:

        - historisch luchtvaartuig: een luchtvaartuig, a. waarvan het type of model voor Nederland een toegevoegde
      historische waarde heeft, gelet op de rol die het heeft gespeeld in de historie van Nederland, Nederlandse
      bedrijven, overheidsdiensten of instellingen dan wel bij de bevrijding van het Koninkrijk der Nederlanden tijdens
      de tweede wereldoorlog, en b. dat voldoet aan een of meer van de criteria als bedoeld in bijlage II onder a) bij de
      verordening (EG) nr. 216/2008 van het Europees Parlement en de Raad van de Europese Unie van 20 februari 2008 tot
      vaststelling van gemeenschappelijke regels op het gebied van burgerluchtvaart en tot oprichting van een Europees
      Agentschap voor de veiligheid van de luchtvaart, houdende intrekking van Richtlijn 91/670/EEG, Verordening (EG) nr.
      1592/2002 en Richtlijn 2004/36/EG (PbEU L 79);
        - minister: Minister van Infrastructuur en Milieu;
        - niet-commercieel vervoer: vervoer zonder winstoogmerk door een rechtspersoonlijkheid bezittende organisatie
      als houder van een luchtvaartuig of door een particuliere houder van een luchtvaartuig waarbij, a. uitsluitend
      de vervoerskosten en de kosten van het trainen van de bemanning worden doorberekend en b. het uitsluitend vervoer
      betreft van sponsors van een organisatie tot instandhouding van historische luchtvaart en hun genodigden, alsmede
      van leden van een vereniging of begunstigers van een stichting met als een statutair doel instandhouding van
      historische luchtvaart;
        - vervoerskosten: de kosten van verzekering, brandstof, onderhouds- en reparatiekosten alsmede landingsgelden.

      2 Een historisch luchtvaartuig verkeert in originele staat, tenzij de minister heeft ingestemd met bepaalde
      aanpassingen of deze voorschrijft in verband met de vliegveiligheid.
    url: https://wetten.overheid.nl/BWBR0017356/2016-07-01#Artikel1
