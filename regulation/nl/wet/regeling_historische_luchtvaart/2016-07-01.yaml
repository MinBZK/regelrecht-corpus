  - number: '11'
    text: |-
      Speciaal-BvL’s met betrekking tot historische luchtvaartuigen, die op het tijdstip van inwerkingtreding van deze
      regeling geldig zijn, worden aangemerkt als speciaal-BvL’s op grond van a[rtikel 2][ref1] van deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0017356#Artikel2
