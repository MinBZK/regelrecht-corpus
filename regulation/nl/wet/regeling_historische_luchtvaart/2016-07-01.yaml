  - number: '12'
    text: |-
      Op een aanvraag voor een speciaal-BvL met betrekking tot een historisch luchtvaartuig waarop op het tijdstip van
      inwerkingtreding van deze regeling nog niet is beslist, wordt beslist overeenkomstig deze regeling.
    url: https://wetten.overheid.nl/BWBR0017356/2016-07-01#Artikel12
