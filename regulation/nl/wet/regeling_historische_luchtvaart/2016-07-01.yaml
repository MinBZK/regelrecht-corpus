      [artikelen 9][ref2] en [13, onderdelen a, b en c, van het Besluit luchtvaartuigen 2008][ref3],
      [artikel 4 van het Besluit luchtverkeer 2014][ref4], [artikel 7 van het Besluit vluchtuitvoering][ref5] en
      [artikel 7 van het Besluit ongeregeld luchtvervoer][ref6].


