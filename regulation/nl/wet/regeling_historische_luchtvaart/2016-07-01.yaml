  - number: '2'
    text: |-
      1 Met betrekking tot een historisch luchtvaartuig dat als een luchtvaartuig met een duidelijk historisch belang als
      bedoeld in bijlage II bij de verordening (EG) nr. 216/2008 van het Europees Parlement en de Raad van de Europese
      Unie van 20 februari 2008 tot vaststelling van gemeenschappelijke regels op het gebied van burgerluchtvaart en
      tot oprichting van een Europees Agentschap voor de veiligheid van de luchtvaart, houdende intrekking van Richtlijn
      91/670/EEG, Verordening (EG) nr. 1592/2002 en Richtlijn 2004/36/EG (PbEU L 79) dient te worden aangemerkt, kan na
      de beoordeling van de luchtwaardigheid van dat luchtvaartuig een speciaal-BvL worden afgegeven.

      2 Ten aanzien van straalvliegtuigen en van helikopters van buitenlands militair ontwerp, niet voorzien van een
      bewijs van luchtwaardigheid of slechts voorzien van een bewijs van luchtwaardigheid, dat door een buitenlandse
      militaire autoriteit is afgegeven, wordt geen speciaal-BvL afgegeven.
    url: https://wetten.overheid.nl/BWBR0017356/2016-07-01#Artikel2
  - number: '3'
    text: |-
      1 De aanvraag van een speciaal-BvL wordt ingediend bij de minister door middel van een volledig ingevuld en
      ondertekend formulier waarvan exemplaren kosteloos bij de minister zijn te verkrijgen.

      2 De aanvraag van een speciaal-BvL gaat vergezeld van de door de minister met betrekking tot het desbetreffende
      luchtvaartuig voor de beoordeling van dat luchtvaartuig nodig geachte bescheiden.

      3 Het model van het speciaal-BvL is opgenomen in de bij deze regeling behorende bijlage.
    url: https://wetten.overheid.nl/BWBR0017356/2016-07-01#Artikel3
  - number: '4'
    text: |-
      1 De aanvraag van een wijziging van het speciaal-BvL wordt ingediend bij de minister door middel van een volledig
      ingevuld en ondertekend formulier waarvan exemplaren kosteloos bij de minister zijn te verkrijgen. Bij de aanvraag
      worden de voor de beoordeling van de aanvraag noodzakelijke gegevens gevoegd.

      2 De aanvraag van verlenging van de termijn van geldigheid van een speciaal-BvL wordt ingediend bij de minister
      door middel van een volledig ingevuld en ondertekend formulier waarvan exemplaren kosteloos bij de minister zijn te
      verkrijgen. [Artikel 3, tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0017356#Artikel3
    url: https://wetten.overheid.nl/BWBR0017356/2016-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0017356
        artikel: '3'
        paragraaf: '2'
  - number: '5'
    text: |-
      1 Tenzij ten behoeve van het starten en landen, is het verboden in de uitvoering van niet-commerciële vluchten
      met een historisch luchtvaartuig lager te vliegen dan 300 m (1000 voet) boven de grond. Dit verbod geldt niet voor
      vluchten uitgevoerd met een historisch luchtvaartuig met een maximum startmassa van ten hoogste 2000 kg.

      2 Tenzij ten behoeve van het starten en landen, is het verboden in de uitvoering van niet-commerciële vluchten met
      een historisch luchtvaartuig als bedoeld in het eerste lid waar de zichtvliegvoorschriften van toepassing zijn te
      vliegen boven aaneengesloten bebouwing, industriegebieden of concentraties van mensen.

      3 Het tweede lid geldt niet voor:

      a. historische zweefvliegtuigen;

      b. meermotorige historische vliegtuigen, mits deze in geval van nood het gebied boven aaneengesloten bebouwing,
      industriegebieden of concentraties van mensen kunnen verlaten.

      4 Met een historisch luchtvaartuig worden per jaar niet meer dan 200 vlieguren gemaakt, zulks exclusief het
      jaarlijks, vooraf in overleg met de minister vastgestelde, aantal noodzakelijk geachte uren voor opleiding,
      training en bekwaamheidseisen.

      5 In afwijking van het vierde lid is het voor straalvliegtuigen met een omloopverhouding van minder dan 2 verboden
      meer dan 100 vlieguren per jaar te maken.

      6 Het is verboden tijdens de vluchtuitvoering ten behoeve van opleiding, training en bekwaamheid andere personen
      dan de instructeur en de voor de vluchtuitvoering noodzakelijke bemanningsleden aan boord van het desbetreffende
      historisch luchtvaartuig te hebben.

      7 Het is verboden met een historisch straalvliegtuig te vliegen:

      a. gedurende werkdagen voor 08.00 uur en na 18.00 uur,

      b. op zaterdagen voor 09.00 uur en na 16.00 uur, en

      c. op zondagen.

      8 Onverminderd het bovenstaande mogen met een historisch luchtvaartuig slechts vluchten worden uitgevoerd met
      inachtneming van de gebruiksbeperkingen die in het vlieghandboek van de fabrikant zijn opgenomen en op dat
      luchtvaartuig betrekking hebben.
    url: https://wetten.overheid.nl/BWBR0017356/2016-07-01#Artikel5
  - number: '6'
    text: |-
      Ten behoeve van niet-commercieel vervoer met een historisch luchtvaartuig beschikt de desbetreffende organisatie
      over een kwaliteitshandboek waarin die organisatie heeft vastgelegd op welke wijze zij de veilige exploitatie van
      dat historisch luchtvaartuig verzekert.
    url: https://wetten.overheid.nl/BWBR0017356/2016-07-01#Artikel6
  - number: '7'
    text: |-
      1 De sponsor van een organisatie tot instandhouding van historische luchtvaart maakt voor de vluchtuitvoering zijn
      naam en de naam van zijn genodigden schriftelijk aan de organisatie bekend.

      2 De leden van een vereniging en de begunstigers van een stichting met als een statutair doel instandhouding van
      historische luchtvaart moeten voor, tijdens en na de vlucht kunnen aantonen dat zij lid van de desbetreffende
      vereniging respectievelijk begunstiger van de desbetreffende stichting zijn.
    url: https://wetten.overheid.nl/BWBR0017356/2016-07-01#Artikel7
  - number: '8'
    text: |-
      De organisatie, de vereniging of de stichting moet kunnen aantonen, dat elke passagier een redelijke tijd voor
      de vluchtuitvoering zowel mondeling als schriftelijk in een voor elke passagier begrijpelijke taal op de hoogte
      is gesteld van het feit dat het vervoer met een historisch luchtvaartuig betreft dat voldoet aan gedateerde
      en dus ten opzichte van de ten tijde van de desbetreffende vlucht geldende luchtwaardigheidseisen lagere
      luchtwaardigheidseisen.
    url: https://wetten.overheid.nl/BWBR0017356/2016-07-01#Artikel8
  - number: '9'
    text: |-
      De houder van het historisch luchtvaartuig, die particulier of niet-commercieel vervoer verzorgt, is verplicht ten
      behoeve van elke vervoersactiviteit verzekerd te zijn tegen de aansprakelijkheid tegenover de vervoerde passagiers
      ten belope van de bij de ‘Wet houdende voorzieningen inzake luchtvervoer’ gestelde limieten alsmede tegen de
      aansprakelijkheid voor schade, veroorzaakt aan derden.
    url: https://wetten.overheid.nl/BWBR0017356/2016-07-01#Artikel9
  - number: '10'
    text: |-
