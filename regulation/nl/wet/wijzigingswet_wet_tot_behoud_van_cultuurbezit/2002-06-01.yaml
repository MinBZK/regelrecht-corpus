preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het op basis van de uitkomsten van een evaluatie van de Wet tot behoud
    van cultuurbezit wenselijk is om in die wet zelf de criteria op te nemen aan de hand waarvan wordt bepaald of
    een voorwerp onder het regime van die wet kan worden gebracht, alsmede om de termijnen van de procedure voor het
    aankopen van beschermde voorwerpen te bekorten en die procedure te vereenvoudigen en dat het voorts wenselijk is om
    in die wet een aantal wijzigingen van technische en redactionele aard aan te brengen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0013497/2002-06-01#ArtikelAanhef
articles:
  - number: III
    text: |-
      De artikelen [7 tot en met 14 van de Wet tot behoud van cultuurbezit][ref1], zoals die op de dag voor de
      inwerkingtreding van deze wet luidden, zijn van toepassing op voorafgaand aan de inwerkingtreding van deze wet:

      a. aan de inspecteur gemelde ontwerpovereenkomsten, en

      b. door Onze Minister tegen voorgenomen handelingen aangevoerde bedenkingen.


      [ref1]: https://wetten.overheid.nl/BWBR0003659#Artikel7
    url: https://wetten.overheid.nl/BWBR0013497/2002-06-01#ArtikelIII
    references:
      - id: ref1
        bwb_id: BWBR0003659
        artikel: '7'
  - number: IV
    text: |-
      Deze wet treedt in werking met ingang van de eerste dag van de derde kalendermaand na de datum van de uitgifte van
      het Staatsblad waarin zij wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0013497/2002-06-01#ArtikelIV
