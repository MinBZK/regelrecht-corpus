articles:
  - number: '1'
    text: |-
      Het zwavelgehalte van de brandstoffen, bedoeld in [artikel 1 van het Besluit zwavelgehalte brandstoffen][ref1]
      (Stb. 1974, 549), wordt als volgt vastgesteld:


      [ref1]: https://wetten.overheid.nl/BWBR0002939#Artikel1
    url: https://wetten.overheid.nl/BWBR0002943/2000-07-20#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002939
        artikel: '1'
  - number: '1.1'
    text: de te onderzoeken brandstof wordt, wanneer het
    url: https://wetten.overheid.nl/BWBR0002943/2000-07-20#Artikel1
  - number: 1.1.a
    text: een vaste stof is, bemonsterd volgens de Nederlandse norm NEN 3010,
    url: https://wetten.overheid.nl/BWBR0002943/2000-07-20#Artikel1
  - number: 1.1.b
    text: een vloeistof is, bemonsterd volgens de methode van de American Society for Testing and Materials, ASTM D4057,
    url: https://wetten.overheid.nl/BWBR0002943/2000-07-20#Artikel1
  - number: 1.1.c
    text: een gas is, bemonsterd volgens de methode ASTM D 1145,
    url: https://wetten.overheid.nl/BWBR0002943/2000-07-20#Artikel1
  - number: 1.1.d
    text: een vloeibaar gemaakt gas is, bemonsterd volgens de methode ASTM D 1265;
    url: https://wetten.overheid.nl/BWBR0002943/2000-07-20#Artikel1
  - number: '1.2'
    text: het zwavelgehalte wordt bepaald, van een monster bedoeld in
    url: https://wetten.overheid.nl/BWBR0002943/2000-07-20#Artikel1
  - number: 1.2.a
    text: onderdeel 1, onder a, volgens de norm NEN/ISO 351,
    url: https://wetten.overheid.nl/BWBR0002943/2000-07-20#Artikel1
  - number: 1.2.b
    text: onderdeel 1, onder b, volgens de methode EN ISO 14596,
    url: https://wetten.overheid.nl/BWBR0002943/2000-07-20#Artikel1
  - number: 1.2.c
    text: onderdeel 1, onder c of d, volgens de methode ASTM D 2784;
    url: https://wetten.overheid.nl/BWBR0002943/2000-07-20#Artikel1
  - number: '1.3'
    text: |-
      de interpretatie van de waarde, welke is gevonden volgens een in onderdeel 2 genoemde methode, geschiedt
      overeenkomstig de norm ISO 4259 (1992)
    url: https://wetten.overheid.nl/BWBR0002943/2000-07-20#Artikel1
  - number: '2'
    text: Dit besluit kan worden aangehaald als Besluit bepalingsmethode zwavelgehalte brandstoffen.
    url: https://wetten.overheid.nl/BWBR0002943/2000-07-20#Artikel2
  - number: '3'
    text: Het besluit wordt in de Nederlandse Staatcourant bekendgemaakt. Het treedt in werking op 1 november 1974.
    url: https://wetten.overheid.nl/BWBR0002943/2000-07-20#Artikel3
