preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben dat het wenselijk is dat de overheidszorg op het gebied van meteorologie en
    seismologie wordt vastgelegd;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0037074/2016-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

        - *Onze Minister:* Onze Minister van Infrastructuur en Milieu;
        - *openbaar lichaam:* openbaar lichaam Bonaire, Sint Eustatius of Saba;
        - *overheidsbedrijven:* overheidsbedrijven als bedoeld in [artikel 25g van de Mededingingswet][ref1], voor zover
      zij een publiekrechtelijke taak uitvoeren.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel25g
    url: https://wetten.overheid.nl/BWBR0037074/2016-01-01#Artikel1
