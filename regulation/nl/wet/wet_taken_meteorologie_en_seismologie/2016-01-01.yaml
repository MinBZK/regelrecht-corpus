  - number: '11'
    text: |-
      Onze Minister zendt binnen vijf jaar na de inwerkingtreding van deze wet, en vervolgens telkens na vijf jaar, aan
      de Staten-Generaal een verslag over de doeltreffendheid en de effecten van deze wet in de praktijk. Hiertoe behoort
      in ieder geval de mate van toegankelijkheid van de algemene weerberichten en de waarschuwingen aan het algemeen
      publiek in geval van gevaarlijk of maatschappij-ontwrichtend weer.
    url: https://wetten.overheid.nl/BWBR0037074/2016-01-01#Artikel11
  - number: '13'
    text: |-
