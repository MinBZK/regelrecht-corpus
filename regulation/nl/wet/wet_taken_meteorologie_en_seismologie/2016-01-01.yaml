  - number: '4'
    text: |-
      1 Onze Minister stelt ten minste elke vier jaar een programma vast waarin alle activiteiten zijn opgenomen die hij
      ingevolge het bij of krachtens deze wet bepaalde voornemens is uit te voeren.

      2 Bij ministeriële regeling kunnen regels gesteld worden omtrent de voorbereiding, inrichting en inhoud van het
      programma.
    url: https://wetten.overheid.nl/BWBR0037074/2016-01-01#Artikel4
  - number: '5'
    text: |-
      Bestuursorganen nemen de ondersteuning, bedoeld in [artikel 3, eerste lid, onderdeel g][ref1], af bij Onze Minister
      indien sprake is van verwacht of werkelijk maatschappij-ontwrichtend weer of calamiteiten waarbij het weer een
      belangrijke rol speelt.


      [ref1]: https://wetten.overheid.nl/BWBR0037074#Artikel3
    url: https://wetten.overheid.nl/BWBR0037074/2016-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0037074
        artikel: '3'
        hoofdstuk: '2'
  - number: '6'
    text: |-
      1 Onze Minister geeft geen aanwijzingen met betrekking tot de methoden, volgens welke de onderzoeken, bedoeld in
      [artikel 3, eerste lid, onderdeel h][ref1], worden uitgevoerd en de resultaten die daarvan worden gerapporteerd.

      2 Er is een raad van toezicht die tot zorg heeft de wetenschappelijke kwaliteit van alle producten en activiteiten,
      bedoeld in [artikel 3, eerste lid][ref2], de onderzoeksmethodiek en de onafhankelijkheid van het onderzoek te
      bewaken. De raad rapporteert jaarlijks hierover aan Onze Minister. Deze rapporten worden ter inzage gelegd.

      3 Het totaal aantal leden van de raad van toezicht bedraagt ten minste vijf leden en ten hoogste zeven leden,
      waaronder een voorzitter.

      4 Onze Minister benoemt leden, waaronder hen die deskundig zijn op het terrein van wetenschappelijk onderzoek op
      het gebied van meteorologie, seismologie of andere geofysische terreinen, voor een periode van vier jaren. Een lid
      van de raad van toezicht is geen door het Rijk aangestelde ambtenaar.

      5 De voorzitter en de leden van de raad van toezicht ontvangen een vergoeding overeenkomstig het bepaalde bij de
      [Wet vergoedingen adviescolleges en commissies][ref3].

      6 Bij ministeriële regeling kunnen nadere regels worden gesteld over de samenstelling, taken en werkzaamheden van
      de raad van toezicht en de rechtspositie van zijn leden.


      [ref1]: https://wetten.overheid.nl/BWBR0037074#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0037074#Artikel3
