  - number: '7'
    text: |-
      1 De volgende kosten worden ten minste integraal doorberekend aan bestuursorganen en overheidsbedrijven, voor zover
      deze niet tot de Staat behoren, indien zij afnemen:

      a. de ondersteuning, bedoeld in [artikel 3, eerste lid, onderdeel g][ref1]; en

      b. de aanvullende dienstverlening, bedoeld in [artikel 3, eerste lid, onderdeel j][ref2].

      Onze Minister maakt dit inzichtelijk in de administratie.

      2 Artikel 25i, eerste en derde lid, en de krachtens [artikel 25m van de Mededingingswet][ref3] gestelde regels zijn
      van overeenkomstige toepassing op het berekenen van de integrale kosten, bedoeld in het eerste lid.


