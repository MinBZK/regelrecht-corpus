  - number: '2'
    text: Deze wet is mede van toepassing in de openbare lichamen.
    url: https://wetten.overheid.nl/BWBR0037074/2016-01-01#Artikel2
  - number: '3'
    text: |-
      1 Onze Minister draagt zorg voor:

      a. het kosteloos verstrekken van algemene weerberichten omtrent de toestand van het huidige weer en het te
      verwachten weer;

      b. waarschuwingen aan het algemeen publiek bij verwacht of werkelijk gevaarlijk of maatschappij-ontwrichtend weer
      of waarschuwingen bij calamiteiten waarbij het weer een belangrijke rol speelt;

      c. het onverwijld informeren van het algemeen publiek bij een significante bodembeweging door geofysische bronnen
      of vulkanische activiteit;

      d. het kosteloos ondersteunen van bestuursorganen in de gevallen, bedoeld in [artikel 5][ref1].

      e. het voortbrengen of verzamelen van meteorologische, seismologische en andere geofysische gegevens in het kader
      van de uitvoering van de taken bedoeld in dit artikel;

      f. het beheer en onderhoud van de voor de uitvoering van zijn taken noodzakelijke technische infrastructuur;

      g. het overeenkomstig ministeriële regeling desgevraagd ondersteunen van bestuursorganen, de rechterlijke
      organisatie, overheidsbedrijven of openbare lichamen op het terrein van meteorologie, seismologie of andere
      geofysische terreinen bij de uitvoering van aan hen bij of krachtens wet opgedragen taken;

      h. onafhankelijk wetenschappelijk onderzoek en technologische ontwikkeling met betrekking tot meteorologie,
      seismologie en andere geofysische terreinen;

      i. meteorologische, seismologische en andere geofysische gegevens of het onderzoek, bedoeld in onderdeel h, op
      verzoek van internationale organisaties voortbrengen, verzamelen of beschikbaar stellen;

      j. het voor hergebruik als bedoeld in de [Wet hergebruik van overheidsinformatie][ref2], zonder dat daartoe
      een verzoek is gedaan op grond van die wet, beschikbaar stellen van meteorologische, seismologische en andere
      geofysische gegevens of onderzoeksresultaten, of de opzet daarvan, voor zover intellectuele eigendomsrechten
      van anderen dat niet beperken, waarbij er op basis van een overeenkomst aanvullende dienstverlening kan worden
      verleend;

      k. internationale samenwerking op het gebied van meteorologie en seismologie en andere geofysische terreinen; en

      l. het verlenen van meteorologische diensten voor de luchtvaartnavigatie.

      2 Bij ministeriële regeling worden regels gesteld over:

      a. de inhoud, verwachtingstermijn en openbare bekendmaking van algemene weerberichten, waarschuwingen of
      informatie, bedoeld in het eerste lid, respectievelijk onderdeel a, onderdeel b en onderdeel c;

      b. het leveren van de ondersteuning, bedoeld in het eerste lid, onderdeel g, waarbij de volgende verzoeken altijd
      worden ingewilligd:

      1°. een verzoek om ondersteuning op het terrein van openbare orde, veiligheid en bevolkingsonderzoek bij
      significante bodembeweging door geofysische bronnen of vulkanische activiteit;

      2°. een verzoek van de rechterlijke organisatie; of

      3°. een verzoek van de raad, bedoeld in
      [artikel 2, eerste lid, van de Rijkswet Onderzoeksraad voor Veiligheid][ref3];

      c. onderzoek en technologische ontwikkeling als bedoeld in het eerste lid, onderdeel h, en het daartoe aangaan van
      samenwerkingsovereenkomsten; en

      d. beschikbaar stellen van meteorologische, seismologische en andere geofysische gegevens en aanvullende
      dienstverlening als bedoeld in het eerste lid, onderdeel j.

      3 Bij ministeriele regeling kunnen regels gesteld worden over internationale verplichtingen op het gebied van
      meteorologie, seismologie en andere geofysische terreinen.


      [ref1]: https://wetten.overheid.nl/BWBR0037074#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0036795
      [ref3]: https://wetten.overheid.nl/BWBR0017613#Artikel2
