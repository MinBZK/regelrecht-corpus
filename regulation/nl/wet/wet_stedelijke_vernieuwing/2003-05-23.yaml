  - number: '2'
    text: |-
      De gemeenteraad draagt zorg voor stedelijke vernieuwing. Hiertoe stelt hij een ontwikkelingsprogramma vast of treft
      anderszins maatregelen in het belang van de stedelijke vernieuwing.
    url: https://wetten.overheid.nl/BWBR0011788/2003-05-23#Artikel2
  - number: '3'
    text: |-
      Provinciale staten dragen uitsluitend zorg voor de bevordering en ondersteuning van stedelijke vernieuwing, in het
      bijzonder ten aanzien van gemeenten waaraan de provincies investeringsbudget kunnen verlenen.
    url: https://wetten.overheid.nl/BWBR0011788/2003-05-23#Artikel3
  - number: '4'
    text: |-
      1 Onze Ministers wie het aangaat, Onze Minister daaronder begrepen, dragen zorg voor de bevordering en
      ondersteuning van stedelijke vernieuwing.

      2 Waar bij of krachtens deze wet bevoegdheden zijn toegekend aan Onze Minister, oefent hij deze uit in
      overeenstemming met Onze Ministers wie het mede aangaat.
    url: https://wetten.overheid.nl/BWBR0011788/2003-05-23#Artikel4
  - number: '5'
    text: |-
      1 Onze Minister kan aan gemeenten investeringsbudget verstrekken ten behoeve van de uitvoering van het
      gemeentelijke beleid inzake stedelijke vernieuwing.

      2 Bij algemene maatregel van bestuur worden de gemeenten aangewezen, waaraan Onze Minister, mede gelet op de
      aard en omvang van de stedelijke vernieuwingsopgave in die gemeenten, investeringsbudget kan verstrekken. De
      bij de maatregel aangewezen gemeenten blijven in elk geval voor de duur van een investeringstijdvak als zodanig
      aangewezen.

      3 Ten behoeve van andere gemeenten dan die, bedoeld in het tweede lid, verstrekt Onze Minister de middelen voor
      investeringsbudget aan de onderscheidene provincies. Onze Minister kan hieraan voorschriften verbinden.

      4 Gedeputeerde staten kunnen investeringsbudget verstrekken aan de gemeenten, bedoeld in het derde lid, ten behoeve
      van de uitvoering van het gemeentelijke beleid inzake stedelijke vernieuwing.
    url: https://wetten.overheid.nl/BWBR0011788/2003-05-23#Artikel5
  - number: '6'
    text: |-
      1 Uiterlijk op 1 april van het jaar dat voorafgaat aan het investeringstijdvak geeft Onze Minister inzicht in:

      a. voor een gemeente waaraan hij investeringsbudget kan verstrekken: een indicatie van de hoogte van dat budget,
      waarbij hij tevens aangeeft welk deel van dat budget afkomstig is uit gelden voor onderscheidenlijk bodemsanering
      en stadseconomie, en

      b. voor een provincie: de hoogte van het provinciale budget ten behoeve van de verstrekking van investeringsbudget
      aan de overige gemeenten.

      2 De berekening van de budgetten, bedoeld in het eerste lid, geschiedt volgens bij algemene maatregel van bestuur
      te geven regels.

      3 Uiterlijk op 1 juli van het jaar dat voorafgaat aan het investeringstijdvak geven gedeputeerde staten inzicht
      in de verdeling van de middelen voor investeringsbudget over in hun provincie gelegen gemeenten waaraan zij
      investeringsbudget kunnen verstrekken. Daarbij wijzen zij de gemeenten aan waarvan naar hun oordeel gelet op de
      aard en de omvang van de stedelijke vernieuwingsopgave een ontwikkelingsprogramma wordt verlangd om in aanmerking
      te komen voor investeringsbudget en geven zij een indicatie van de hoogte van dat budget voor deze gemeenten.

      4 Bij provinciale verordening worden regels gegeven omtrent de wijze waarop de verdeling tussen de gemeenten van de
      middelen voor investeringsbudget wordt vastgesteld. Bij de verdeling houdt de provincie rekening met de aard en de
      omvang van de stedelijke vernieuwingsopgave in die gemeenten.

      5 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gegeven omtrent de verdeling, bedoeld in het
      derde en vierde lid. Deze regels kunnen onder meer inhouden dat beperkingen worden aangebracht in de mate waarin
      gedeputeerde staten bij de verdeling van de middelen voor investeringsbudget andere criteria kunnen hanteren dan
      die welke krachtens het tweede lid gelden voor de berekening van de budgetten van de in het eerste lid, onder a,
      bedoelde gemeenten.
    url: https://wetten.overheid.nl/BWBR0011788/2003-05-23#Artikel6
  - number: '7'
    text: |-
      1 Investeringsbudget wordt verleend aan een gemeente die beschikt over een door de gemeenteraad vastgesteld
      ontwikkelingsprogramma:

      a. waarin de gemeentelijke doelstellingen van stedelijke vernieuwing voldoende zijn onderbouwd en worden
      weergegeven in termen van toetsbare resultaten,

      b. waarin wordt ingegaan op de relatie met stedelijke vernieuwing die zich niet richt op de fysieke leefomgeving,

      c. dat betrekking heeft op het investeringstijdvak en inzicht geeft in het daaropvolgende tijdvak,

      d. dat een financiële paragraaf bevat, die inzicht geeft in de van stedelijke vernieuwing te verwachten kosten
      en opbrengsten,

      e. dat vermeldt op welke wijze de ingezetenen van de gemeente en degenen die in de gemeenten een belang hebben bij
      het programma, worden gehoord en met welk resultaat zij worden betrokken bij de voorbereiding en realisering van
      het programma, en

      f. waarin de in het tweede lid bedoelde landelijke doelstellingen van stedelijke vernieuwing in acht zijn genomen.

      2 Bij algemene maatregel van bestuur worden de landelijke doelstellingen van stedelijke vernieuwing vastgesteld en
      kunnen nadere regels worden gegeven omtrent de in het eerste en derde lid gestelde eisen.

      3 Bij de voorbereiding van het ontwikkelingsprogramma betrekken burgemeester en wethouders in elk geval:

      a. de ingezetenen van de gemeente en degenen die in de gemeente een belang hebben bij het programma, op de wijze
      als is voorzien in de verordening die is vastgesteld krachtens [artikel 150 van de Gemeentewet][ref1], en

      b. de besturen van gemeenten wier belangen hierbij rechtstreeks in het geding zijn.

      4 In afwijking van het eerste lid kunnen gedeputeerde staten aan een gemeente, die niet is aangewezen ingevolge
      [artikel 6, derde lid, tweede volzin][ref2], investeringsbudget verlenen ten behoeve van een activiteit in het
      kader van stedelijke vernieuwing, indien de daartoe strekkende aanvraag vergezeld gaat van een onderbouwing van
      de voorgenomen stedelijke vernieuwing, waarin in elk geval een financiële paragraaf is opgenomen en welke vermeldt
      hoe en met welk resultaat met betrokken partijen overleg is gevoerd alsmede hoe deze bij de uitvoering van die
      activiteit worden betrokken.

      5 De beschikking tot verlening van investeringsbudget vermeldt het bedrag van dat budget.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel150
      [ref2]: https://wetten.overheid.nl/BWBR0011788#Artikel6
