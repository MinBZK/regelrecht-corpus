  - number: '9'
    text: |-
      1 Aan de verlening van investeringsbudget kunnen verplichtingen worden verbonden, voorzover de verwezenlijking
      van het doel van het investeringsbudget dit vordert. De verplichtingen kunnen slechts betrekking hebben op
      aangelegenheden ten aanzien waarvan Onze Minister onderscheidenlijk gedeputeerde staten op grond van een wettelijk
      voorschrift bevoegdheid hebben.

      2 Aan de verlening van investeringsbudget is in elk geval de verplichting verbonden dat:

      a. indien de ingevolge [artikel 7, tweede lid][ref1], vastgestelde landelijke doelstellingen van stedelijke
      vernieuwing gedurende het investeringstijdvak worden gewijzigd, het ontwikkelingsprogramma voorzover mogelijk
      hieraan wordt aangepast, en

      b. indien een gemeentelijke beleidswijziging leidt tot wijziging van de gemeentelijke doelstellingen van stedelijke
      vernieuwing gedurende het investeringstijdvak, het ontwikkelingsprogramma slechts wordt aangepast na instemming van
      Onze Minister, gedeputeerde staten gehoord, onderscheidenlijk van gedeputeerde staten.

      3 Aan de verlening van investeringbudget aan een gemeente die beschikt over een ontwikkelingsprogramma is tevens
      de verplichting verbonden dat die gemeente, zoveel mogelijk in samenwerking met andere gemeenten, een stelsel
      van kwaliteitszorg inricht ter bewaking en verbetering van de kwaliteit van de stedelijke vernieuwing. Dit
      stelsel houdt ten minste in dat de gemeente, afgestemd op de aard en omvang van de uitvoering van de stedelijke
      vernieuwing, zorgdraagt voor:

      a. het op systematische wijze toetsen in hoeverre de wijze van uitvoering van de stedelijke vernieuwing leidt tot
      de daarmee beoogde resultaten, en

      b. het op basis van de uitkomsten daarvan zonodig aanpassen van het gemeentelijke beleid inzake stedelijke
      vernieuwing of de wijze waarop de stedelijke vernieuwing wordt uitgevoerd.

      4 De aan de verlening van investeringsbudget verbonden verplichtingen kunnen na die verlening worden uitgewerkt,
      voorzover de beschikking tot verlening dit vermeldt.


      [ref1]: https://wetten.overheid.nl/BWBR0011788#Artikel7
