    text: Deze wet treedt in werking op een bij de wet te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0011788/2003-05-23#Artikel27
  - number: '28'
    text: 'Deze wet wordt aangehaald als: Wet stedelijke vernieuwing.'
