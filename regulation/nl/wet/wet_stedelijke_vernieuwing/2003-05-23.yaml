preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is bij stedelijke vernieuwing, met inbegrip van lokale
    milieubescherming, te kiezen voor een meer samenhangende, interactieve en innoverende aanpak;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0011788/2003-05-23#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. stedelijke vernieuwing: op stedelijk gebied gerichte inspanningen die strekken tot verbetering van
      de leefbaarheid en veiligheid, bevordering van een duurzame ontwikkeling en verbetering van de woon- en
      milieukwaliteit, versterking van het economisch draagvlak, bevordering van de sociale samenhang, verbetering van de
      bereikbaarheid, verhoging van de kwaliteit van de openbare ruimte of anderszins tot structurele kwaliteitsverhoging
      van dat stedelijk gebied;

      b. ontwikkelingsprogramma: programma als bedoeld in [artikel 7, eerste lid][ref1];

      c. investeringsbudget: subsidie aan een gemeente krachtens [hoofdstuk 3][ref2], ter tegemoetkoming in de kosten
      van de uitvoering van een ontwikkelingsprogramma of van een activiteit in het kader van stedelijke vernieuwing, als
      bedoeld in [artikel 7, vierde lid][ref3];

      d. investeringstijdvak: tijdvak van vijf kalenderjaren, waarvoor investeringsbudget wordt verstrekt;

      e. Onze Minister: Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer.

      2 De in deze wet neergelegde taken en bevoegdheden ten aanzien van stedelijke vernieuwing hebben slechts betrekking
      op stedelijke vernieuwing, die gericht is op de fysieke leefomgeving.


      [ref1]: https://wetten.overheid.nl/BWBR0011788#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0011788#Hoofdstuk3
      [ref3]: https://wetten.overheid.nl/BWBR0011788#Artikel7
