  - number: '14'
    text: |-
      1 Onze Minister stelt onderscheidenlijk gedeputeerde staten stellen het bedrag van het investeringsbudget vast.
      Met uitzondering van aanvragen van de gemeenten Amsterdam, Rotterdam, Den Haag en Utrecht, alsmede van de gemeenten
      waarop [artikel 88, eerste lid, van de Wet bodembescherming][ref1] krachtens het negende lid van dat artikel
      van overeenkomstige toepassing is verklaard, beslist Onze Minister niet dan nadat hij gedeputeerde staten van de
      provincie waarin de gemeente is gelegen gedurende ten minste vier weken in de gelegenheid heeft gesteld hem van
      advies te dienen ten aanzien van de verwezenlijking van de in het ontwikkelingsprogramma opgenomen gemeentelijke
      doelstellingen van bodemsanering. Het bedrag van het investeringsbudget wordt vastgesteld op het bedrag van
      het verleende investeringsbudget, indien geen van de in [artikel 10, eerste en tweede lid][ref2], bedoelde
      omstandigheden zich voordoet.

      2 De vaststelling geeft aanspraak op betaling van het vastgestelde bedrag.

      3 Het investeringsbudget wordt overeenkomstig de vaststelling ervan betaald, onder verrekening van de betaalde
      voorschotten.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel88
      [ref2]: https://wetten.overheid.nl/BWBR0011788#Artikel10
    url: https://wetten.overheid.nl/BWBR0011788/2003-05-23#Artikel14
