  - number: '10'
    text: |-
      1 Zolang het investeringsbudget niet is vastgesteld, kan Onze Minister onderscheidenlijk kunnen gedeputeerde
      staten, indien ten minste twee jaren van het investeringstijdvak zijn verstreken, ten hoogste éénmaal de verlening
      van investeringsbudget intrekken of ten nadele van de gemeente wijzigen, indien:

      a. de doelstellingen waarvoor investeringsbudget is verleend kennelijk niet of niet geheel zullen worden
      verwezenlijkt en dit de gemeente kan worden toegerekend, of

      b. de gemeente niet heeft voldaan aan de aan de verlening van investeringsbudget verbonden verplichtingen.

      2 Zolang het investeringsbudget niet is vastgesteld, kan Onze Minister onderscheidenlijk kunnen gedeputeerde staten
      de verlening van investeringsbudget intrekken of ten nadele van de gemeente wijzigen, indien:

      a. verleende voorschotten zijn besteed aan een ander doel dan stedelijke vernieuwing,

      b. de gemeente onjuiste of onvolledige gegevens heeft verstrekt en de verstrekking van juiste of volledige gegevens
      tot een andere beschikking op de aanvraag tot verlening van investeringsbudget zou hebben geleid, of

      c. de verlening van investeringsbudget anderszins onjuist was en de gemeente dit wist of behoorde te weten.

      3 De intrekking of wijziging werkt terug tot en met het tijdstip waarop het investeringsbudget is verleend, tenzij
      bij de intrekking of wijziging anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0011788/2003-05-23#Artikel10
  - number: '11'
    text: |-
      1 Een aanvraag tot verlening van investeringsbudget wordt gedaan door burgemeester en wethouders en gaat vergezeld
      van het ontwikkelingsprogramma.

      2 De aanvraag wordt ingediend uiterlijk op 1 juli van het eerste jaar van het investeringstijdvak. Indien in een
      bepaald geval het wegens overschrijding van de indieningstermijn buiten behandeling laten van een aanvraag zou
      leiden tot onbillijkheden van overwegende aard, kan Onze Minister onderscheidenlijk kunnen gedeputeerde staten
      besluiten de aanvraag alsnog te behandelen. In dat geval kan een lager investeringsbudget worden verleend dan het
      bedrag dat op grond van [artikel 6, eerste of derde lid][ref1], voor de betrokken gemeente als investeringsbudget
      is geïndiceerd.

      3 Op een aanvraag wordt beslist binnen acht weken na de dag waarop die aanvraag is ontvangen. Deze termijn
      kan eenmaal met vier weken worden verlengd. Indien toepassing wordt gegeven aan het vijfde lid, kan de termijn
      nogmaals, met ten hoogste vier weken, worden verlengd.

      4 Onze Minister beslist niet op de aanvraag van een gemeente waaraan hij investeringsbudget kan verlenen dan nadat
      hij gedeputeerde staten van de betrokken provincie gedurende ten minste vier weken in de gelegenheid heeft gesteld
      hem van advies te dienen ten aanzien van in elk geval:

      a. de intergemeentelijke afstemming van het ontwikkelingsprogramma, en

      b. de verenigbaarheid van het ontwikkelingsprogramma met op grond van een wettelijke bevoegdheid vastgesteld
      provinciaal beleid.

      5 Indien het advies van gedeputeerde staten inhoudt dat het ontwikkelingsprogramma niet verenigbaar is met het
      vastgesteld provinciaal bodembeleid, nodigt Onze Minister de betrokken bestuursorganen uit voor een nader overleg,
      onder leiding van een door hem aan te wijzen voorzitter. De voorzitter deelt binnen vier weken aan Onze Minister
      mee tot welke uitkomst het overleg heeft geleid.

      6 Het vijfde lid is niet van toepassing op de gemeenten Amsterdam, Rotterdam, Den Haag en Utrecht, alsmede op de
      gemeenten waarop [artikel 88, eerste lid, van de Wet bodembescherming][ref2] krachtens het negende lid van dat
      artikel van overeenkomstige toepassing is verklaard.

      7 Het tweede lid, eerste volzin, is niet van toepassing op gemeenten als bedoeld in [artikel 7, vierde lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0011788#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0003994#Artikel88
