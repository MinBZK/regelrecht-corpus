  - number: '16'
    text: |-
      1 Onze Minister kan onderscheidenlijk gedeputeerde staten kunnen jegens de betrokken gemeente verplichtingen
      verbinden aan investeringsbudget dat voor het op dat moment lopende investeringstijdvak wordt of is verleend,
      indien met betrekking tot het afgelopen investeringstijdvak:

      a. de in het ontwikkelingsprogramma opgenomen gemeentelijke doelstellingen van stedelijke vernieuwing naar het
      oordeel van Onze Minister onderscheidenlijk gedeputeerde staten onvoldoende zijn bereikt en dit de gemeente kan
      worden toegerekend,

      b. de activiteit in het kader van stedelijke vernieuwing, bedoeld in [artikel 7, vierde lid][ref1], naar het
      oordeel van gedeputeerde staten niet of niet geheel heeft plaatsgevonden en dit de gemeente kan worden toegerekend,

      c. de gemeente niet heeft voldaan aan de aan de verlening van investeringsbudget verbonden verplichtingen,

      d. de verleende voorschotten door de gemeente zijn besteed aan een ander doel dan stedelijke vernieuwing, of

      e. de aanvraag tot vaststelling van investeringsbudget niet of niet tijdig is ingediend.

      2 Indien naar het oordeel van Onze Minister onderscheidenlijk gedeputeerde staten genoegzaam vaststaat dat
      met de in het eerste lid bedoelde verplichtingen niet kan worden volstaan, dan wel van het opleggen daarvan
      in redelijkheid onvoldoende resultaat kan worden verwacht, kan het investeringsbudget over het afgelopen
      investeringstijdvak, zo nodig ambtshalve, lager worden vastgesteld dan het voor dat tijdvak verleende
      investeringsbudget.

      3 Onverschuldigd betaalde bedragen aan investeringsbudget en voorschotten kunnen worden teruggevorderd, voorzover
      na de dag waarop het investeringsbudget is vastgesteld nog geen vijf jaren zijn verstreken. Bij de terugvordering
      kan worden bepaald dat over de onverschuldigd betaalde bedragen een rentevergoeding verschuldigd is.


      [ref1]: https://wetten.overheid.nl/BWBR0011788#Artikel7
    url: https://wetten.overheid.nl/BWBR0011788/2003-05-23#Artikel16
