  - number: '8'
    text: |-
      1 De verlening van investeringsbudget kan geheel of gedeeltelijk worden geweigerd, indien:

      a. de gemeente geen ontwikkelingsprogramma heeft vastgesteld,

      b. het ontwikkelingsprogramma niet verenigbaar is met de eisen die zijn gesteld in
      [artikel 7, eerste of derde lid][ref1], of

      c. het ontwikkelingsprogramma naar het oordeel van Onze Minister onderscheidenlijk gedeputeerde staten niet
      verenigbaar is met de ingevolge [artikel 7, tweede lid][ref2], gegeven regels.

      2 De verlening van investeringsbudget kan tevens geheel of gedeeltelijk worden geweigerd, indien er gegronde reden
      bestaat om aan te nemen, dat:

      a. het ontwikkelingsprogramma niet of niet geheel zal worden verwezenlijkt,

      b. de gemeente niet zal voldoen aan de aan het investeringsbudget verbonden verplichtingen, of

      c. de gemeente in het kader van de aanvraag onjuiste of onvolledige gegevens heeft verstrekt en de verstrekking van
      deze gegevens tot een onjuiste beschikking op de aanvraag zou hebben geleid.

      3 De verlening van investeringsbudget kan voorts slechts geheel of gedeeltelijk worden geweigerd, indien:

      a. het ontwikkelingsprogramma onvoldoende intergemeentelijk is afgestemd, of

      b. het ontwikkelingsprogramma niet verenigbaar is met op grond van een wettelijke bevoegdheid vastgesteld
      provinciaal of rijksbeleid.

      4 Onze Minister gaat onderscheidenlijk gedeputeerde staten gaan niet over tot weigering van verlening van
      investeringsbudget dan nadat de gemeente in de gelegenheid is gesteld het ontwikkelingsprogramma aan te passen
      binnen een door Onze Minister onderscheidenlijk gedeputeerde staten te bepalen termijn.

      5 In afwijking van het eerste lid kan de provincie in geval van een andere gemeente dan aangewezen ingevolge
      [artikel 6, derde lid, tweede volzin][ref3], de verlening van investeringsbudget geheel of gedeeltelijk
      weigeren, indien de aanvraag niet voldoet aan de eisen, gesteld in [artikel 7, vierde lid][ref4], en
      indien de beoogde activiteit in het kader van stedelijke vernieuwing niet verenigbaar is met de ingevolge
      [artikel 7, tweede lid][ref5], gegeven regels en kan de provincie deze aanvraag overigens geheel of gedeeltelijk
      weigeren, indien de beoogde stedelijke vernieuwing niet verenigbaar is met op grond van een wettelijke bevoegdheid
      vastgesteld provinciaal of rijksbeleid. Het vierde lid is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011788#Artikel7
