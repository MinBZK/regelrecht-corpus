  - number: '14'
    text: |-
      1 Onze Minister stelt onderscheidenlijk gedeputeerde staten stellen binnen vier maanden na de indieningstermijn
      genoemd in [artikel 13, eerste of zesde lid][ref1], het bedrag van het investeringsbudget vast. Het bedrag van
      het investeringsbudget wordt vastgesteld op het bedrag van het verleende investeringsbudget, indien geen van de in
      [artikel 10, eerste en tweede lid][ref2], bedoelde omstandigheden zich voordoet.

      2 De vaststelling geeft aanspraak op betaling van het vastgestelde bedrag.

      3 Het investeringsbudget wordt overeenkomstig de vaststelling ervan betaald, onder verrekening van de betaalde
      voorschotten.


      [ref1]: https://wetten.overheid.nl/BWBR0011788#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0011788#Artikel10
