  - number: '12'
    text: |-
      1 Onze Minister verleent gedurende het investeringstijdvak per jaar een voorschot aan de provincies en de gemeenten
      waaraan hij investeringsbudget heeft verleend.

      2 Gedeputeerde staten verlenen gedurende het investeringstijdvak per jaar een voorschot aan de gemeenten die zijn
      aangewezen ingevolge [artikel 6, derde lid, onder a][ref1], en waaraan zij investeringsbudget hebben verleend.

      3 Aan andere gemeenten dan die aangewezen ingevolge [artikel 6, derde lid, onder a][ref2], kunnen gedeputeerde
      staten een voorschot verlenen.

      4 Voorschotten worden overeenkomstig de voorschotverlening betaald. Het voorschot wordt binnen vier weken na de
      voorschotverlening betaald.

      5 De beschikking tot voorschotverlening vermeldt het bedrag van het voorschot, dan wel de wijze waarop dit bedrag
      wordt bepaald.

      6 Indien budgettaire omstandigheden daartoe aanleiding geven, kan de verlening van voorschot in afwijking van het
      eerste en tweede lid plaatsvinden over zeven kalenderjaren, waarbij over de uitgestelde betalingen van voorschotten
      geen rente wordt vergoed.


      [ref1]: https://wetten.overheid.nl/BWBR0011788#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0011788#Artikel6
