  - number: '13'
    text: |-
      1 Burgemeester en wethouders van een gemeente waaraan investeringsbudget is verleend, dienen uiterlijk
      op de 15e juli volgende op de afloop van het investeringstijdvak een aanvraag in tot vaststelling van het
      investeringsbudget bij Onze Minister, indien het een gemeente betreft als bedoeld in [artikel 5, tweede lid][ref1],
      of bij gedeputeerde staten, indien het een gemeente betreft als bedoeld in [artikel 5, derde lid][ref2].

      2 Bij de aanvraag wordt een verantwoordingsverslag gevoegd. Dit verslag bevat een vergelijking van de in het
      ontwikkelingsprogramma opgenomen gemeentelijke doelstellingen van stedelijke vernieuwing, dan wel, indien het een
      gemeente betreft als bedoeld in [artikel 7, vijfde lid][ref3], van de in de aanvraag opgenomen onderbouwing van
      de activiteit in het kader van stedelijke vernieuwing, en de aan het investeringsbudget verbonden verplichtingen
      met de bereikte resultaten en een toelichting van de verschillen. Bij de aanvraag wordt tevens een verslag over de
      besteding van de verleende voorschotten gezonden. Dit verslag gaat vergezeld van een verklaring van een accountant
      als bedoeld in [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref4] omtrent de in dat verslag
      vermelde bestedingen. Bij algemene maatregel van bestuur worden regels gegeven omtrent de verslagen, bedoeld in de
      tweede en derde volzin, en de verklaring, bedoeld in de vierde volzin.

      3 Indien een aanvraag tot vaststelling van de onderscheidenlijke uitkeringen van het Grotestedenbeleid voor
      het investeringstijdvak bij Onze Minister belast met de coördinatie van het Grotestedenbeleid wordt ingediend,
      wordt, in afwijking van het eerste lid, die aanvraag mede aangemerkt als een aanvraag tot vaststelling van het
      investeringsbudget.

      4 Het verantwoordingsverslag, bedoeld in het tweede lid, maakt, indien van toepassing, deel uit van het
      verantwoordingsverslag dat bij de bij Onze Minister belast met de coördinatie van het Grotestedenbeleid ingediende
      aanvraag is gevoegd.

      5 Gedeputeerde staten vatten ten aanzien van gemeenten waaraan zij investeringsbudget hebben verleend, de
      bevindingen samen die zij hebben verkregen uit de stukken, bedoeld in het eerste en tweede dan wel zesde lid, en
      dienen deze samenvatting, vergezeld van die stukken, in bij Onze Minister uiterlijk op de 1e augustus volgende op
      de afloop van het investeringstijdvak.

      6 Indien het investeringsbudget betreft ter tegemoetkoming in de kosten van de uitvoering van een activiteit in het
      kader van stedelijke vernieuwing, als bedoeld in [artikel 7, vijfde lid][ref5], en voornoemde activiteit aan het
      einde van het investeringstijdvak niet is verwezenlijkt, geldt in afwijking van het eerste en tweede lid dat:

      a. burgemeester en wethouders van de desbetreffende gemeente uiterlijk op de in het eerste lid bedoelde datum
      aan gedeputeerde staten een verklaring overleggen omtrent de reden van het niet verwezenlijken van voornoemde
      activiteit;

      b. zij een aanvraag tot vaststelling van het investeringsbudget indienen uiterlijk zes maanden nadat voornoemde
      activiteit is verwezenlijkt, onder overlegging van de in het tweede lid bedoelde bescheiden.


      [ref1]: https://wetten.overheid.nl/BWBR0011788#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0011788#Artikel5
