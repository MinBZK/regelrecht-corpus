  - number: '7'
    text: |-
      1 Investeringsbudget kan worden verleend aan een gemeente die beschikt over een door de gemeenteraad vastgesteld
      ontwikkelingsprogramma:

      a. waarin de gemeentelijke doelstellingen van stedelijke vernieuwing voldoende zijn onderbouwd en worden
      weergegeven in termen van toetsbare resultaten,

      b. waarin wordt ingegaan op de relatie met stedelijke vernieuwing die zich niet richt op de fysieke leefomgeving,

      c. dat betrekking heeft op het investeringstijdvak en inzicht geeft in het daaropvolgende tijdvak,

      d. dat een financiële paragraaf bevat, die inzicht geeft in de van stedelijke vernieuwing te verwachten kosten
      en opbrengsten,

      e. dat vermeldt met welk resultaat intergemeentelijke afstemming van de ontwikkelingsprogramma's heeft
      plaatsgevonden, en

      f. waarin de in het tweede lid bedoelde landelijke doelstellingen van stedelijke vernieuwing in acht zijn genomen.

      2 Bij algemene maatregel van bestuur worden de landelijke doelstellingen van stedelijke vernieuwing vastgesteld
      en kunnen:

      a. nadere regels worden gegeven omtrent de in het eerste en derde lid gestelde eisen en

      b. eisen worden gesteld aan de intergemeentelijke afstemming van de ontwikkelingsprogramma's.

      3 Bij de voorbereiding van het ontwikkelingsprogramma betrekken burgemeester en wethouders in elk geval:

      a. de ingezetenen van de gemeente en degenen die in de gemeente een belang hebben bij het programma, op de wijze
      als is voorzien in de verordening die is vastgesteld krachtens [artikel 150 van de Gemeentewet][ref1],

      b. burgemeester en wethouders van de gemeenten, indien van toepassing, die behoren tot dezelfde groep, bedoeld in
      [artikel 6, derde lid, onder c][ref2], als die waartoe de gemeente behoort, dan wel dezelfde plusregio als waarin
      de gemeente is gelegen, en

      c. burgemeester en wethouders van andere gemeenten wier belangen hierbij rechtstreeks in het geding zijn.

      4 De raad van een gemeente als bedoeld in [artikel 5, tweede lid][ref3], die een meerjarenprogramma voor de
      onderscheidenlijke uitkeringen van het Grotestedenbeleid voor het investeringstijdvak vaststelt, laat het
      ontwikkelingsprogramma daarvan deel uitmaken.

      5 In afwijking van het eerste lid kunnen gedeputeerde staten gedurende het investeringstijdvak op aanvraag aan
      een gemeente, die niet is aangewezen ingevolge [artikel 6, derde lid, onder a][ref4], investeringsbudget verlenen
      ten behoeve van een activiteit in het kader van de stedelijke vernieuwing, indien de daartoe strekkende aanvraag
      vergezeld gaat van een onderbouwing van de voorgenomen stedelijke vernieuwing, waarin in elk geval een financiële
      paragraaf is opgenomen en welke vermeldt met welk resultaat overleg is gevoerd met betrokken partijen, waaronder,
      indien van toepassing, mede begrepen burgemeester en wethouders van de gemeenten die behoren tot dezelfde groep,
      bedoeld in [artikel 6, derde lid, onder c][ref5], als die waartoe de gemeente behoort, dan wel dezelfde plusregio
      als waarin de gemeente is gelegen.

      6 De beschikking tot verlening van investeringsbudget vermeldt het bedrag van dat budget.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel150
      [ref2]: https://wetten.overheid.nl/BWBR0011788#Artikel6
