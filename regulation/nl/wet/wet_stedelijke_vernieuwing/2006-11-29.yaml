  - number: '19'
    text: |-
      1 Onze Minister kan ter bevordering van innovatieve ontwikkelingen in de stedelijke vernieuwing volgens bij
      algemene maatregel van bestuur gegeven regels subsidie verstrekken.

      2 Bij algemene maatregel van bestuur kunnen ieder jaar subsidieplafonds worden vastgesteld voor de verschillende
      activiteiten waarvoor subsidie kan worden verstrekt. Daarbij wordt de wijze van verdeling van het beschikbare
      bedrag bepaald.
    url: https://wetten.overheid.nl/BWBR0011788/2006-11-29#Artikel19
  - number: '20'
    text: |-
      1 Onze Minister kan bij wijze van uitzonderlijke en tijdelijke stimulans subsidie verstrekken voor activiteiten op
      het gebied van de stedelijke vernieuwing volgens bij of krachtens algemene maatregel van bestuur of, indien spoed
      vereist is, bij ministeriële regeling gegeven regels.

      2 Bij of krachtens algemene maatregel van bestuur kunnen ieder jaar subsidieplafonds worden vastgesteld voor de
      verschillende activiteiten waarvoor subsidie kan worden verstrekt. Daarbij wordt de wijze van verdeling van het
      beschikbare bedrag bepaald.
    url: https://wetten.overheid.nl/BWBR0011788/2006-11-29#Artikel20
  - number: '21'
    text: |-
      Het totaal van de in dit hoofdstuk genoemde subsidies dat uit 's Rijks kas beschikbaar is voor een tijdvak van vijf
      kalenderjaren dat samenvalt met een investeringstijdvak, beloopt ten hoogste tien procent van het bedrag dat uit 's
      Rijks kas beschikbaar is voor investeringsbudget in dat tijdvak.
    url: https://wetten.overheid.nl/BWBR0011788/2006-11-29#Artikel21
  - number: '22'
    text: |-
      1 De verlening van investeringsbudget of andere subsidie op grond van deze wet kan worden ingetrokken of gewijzigd
      wegens strijd met een uit een verdrag voor de staat voortvloeiende verplichting. Bij de intrekking of wijziging kan
      worden bepaald, dat over onverschuldigd betaalde subsidiebedragen een rentevergoeding verschuldigd is.

      2 De intrekking of wijziging werkt terug tot en met het tijdstip waarop de subsidie is verleend, tenzij bij de
      intrekking of wijziging anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0011788/2006-11-29#Artikel22
  - number: '23'
    text: |-
      1 Desgevraagd verstrekken burgemeester en wethouders Onze Minister gegevens over de uitvoering van deze wet en
      geven hem inzage in de desbetreffende stukken.

      2 Burgemeester en wethouders verlenen op verzoek van Onze Minister medewerking aan openbaarmaking van de resultaten
      van de stedelijke vernieuwing.

      3 Het eerste en tweede lid zijn, jegens gedeputeerde staten, van overeenkomstige toepassing op burgemeester en
      wethouders van gemeenten waaraan gedeputeerde staten investeringsbudget hebben verleend.

      4 Het eerste en tweede lid zijn, jegens Onze Minister, van overeenkomstige toepassing op gedeputeerde staten.

      5 De financiële gevolgen van de informatieverstrekking, bedoeld in het eerste lid, worden niet gecompenseerd.

      6 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent de
      informatievoorziening.
    url: https://wetten.overheid.nl/BWBR0011788/2006-11-29#Artikel23
  - number: '24'
    text: |-
      1 Na afloop van een investeringstijdvak doet Onze Minister verslag aan de Staten-Generaal over de toepassing en de
      effecten van deze wet.

      2 Burgemeester en wethouders, gedeputeerde staten, alsmede het dagelijks bestuur van een plusregio, verlenen
      desgevraagd medewerking aan het door Onze Minister uit te brengen verslag.
    url: https://wetten.overheid.nl/BWBR0011788/2006-11-29#Artikel24
  - number: '25'
    text: |-
      Met het toezicht op de naleving van het bij of krachtens deze wet bepaalde zijn belast:

      a. in het gehele Rijk: de bij besluit van Onze Minister aan te wijzen rijksambtenaren,

      b. in een provincie: de door de Commissaris van de Koning aan te wijzen personen.
    url: https://wetten.overheid.nl/BWBR0011788/2006-11-29#Artikel25
  - number: '26'
    text: |-
      1 De in deze wet voorziene algemene maatregelen van bestuur, met uitzondering van de algemene maatregel van
      bestuur, bedoeld in [artikel 5, tweede lid][ref1], treden niet eerder in werking dan acht weken na de dagtekening
      van het Staatsblad waarin de desbetreffende besluiten zijn geplaatst. Van de plaatsing wordt onverwijld aan de
      Staten-Generaal mededeling gedaan.

      2 Een krachtens [artikel 5, tweede lid][ref2], vastgestelde algemene maatregel van bestuur wordt aan de beide
      kamers der Staten-Generaal overgelegd. Hij treedt in werking op een tijdstip dat nadat acht weken na de overlegging
      zijn verstreken bij koninklijk besluit wordt vastgesteld, tenzij binnen die termijn door of namens een der kamers
      of door ten minste een vijfde van het grondwettelijk aantal leden van een der kamers de wens te kennen wordt
      gegeven dat het onderwerp van de algemene maatregel van bestuur bij wet wordt geregeld. In dat geval wordt een
      daartoe strekkend voorstel van wet zo spoedig mogelijk ingediend. Indien het voorstel van wet wordt ingetrokken
      of indien een van de beide kamers van de Staten-Generaal besluit het voorstel niet aan te nemen, wordt de algemene
      maatregel van bestuur ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0011788#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0011788#Artikel5
