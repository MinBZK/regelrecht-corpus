  - number: '10'
    text: |-
      1 Zolang het investeringsbudget niet is vastgesteld, kan Onze Minister onderscheidenlijk kunnen gedeputeerde
      staten, indien ten minste twee jaren van het investeringstijdvak zijn verstreken, ten hoogste éénmaal de verlening
      van investeringsbudget intrekken of ten nadele van de gemeente wijzigen, indien:

      a. de doelstellingen waarvoor investeringsbudget is verleend kennelijk niet of niet geheel zullen worden
      verwezenlijkt en dit de gemeente kan worden toegerekend, of

      b. de gemeente niet heeft voldaan aan de aan de verlening van investeringsbudget verbonden verplichtingen.

      2 Zolang het investeringsbudget niet is vastgesteld, kan Onze Minister onderscheidenlijk kunnen gedeputeerde staten
      de verlening van investeringsbudget intrekken of ten nadele van de gemeente wijzigen, indien:

      a. verleende voorschotten zijn besteed aan een ander doel dan stedelijke vernieuwing,

      b. de gemeente onjuiste of onvolledige gegevens heeft verstrekt en de verstrekking van juiste of volledige gegevens
      tot een andere beschikking op de aanvraag tot verlening van investeringsbudget zou hebben geleid, of

      c. de verlening van investeringsbudget anderszins onjuist was en de gemeente dit wist of behoorde te weten.

      3 De intrekking of wijziging werkt terug tot en met het tijdstip waarop het investeringsbudget is verleend, tenzij
      bij de intrekking of wijziging anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0011788/2006-11-29#Artikel10
  - number: '11'
    text: |-
      1 Een aanvraag tot verlening van investeringsbudget wordt gedaan door burgemeester en wethouders, gaat vergezeld
      van het ontwikkelingsprogramma en wordt ingediend:

      a. indien het een gemeente betreft als bedoeld in [artikel 5, tweede lid][ref1], bij Onze Minister en

      b. indien het een gemeente betreft die is aangewezen ingevolge [artikel 6, derde lid, onder a][ref2], bij
      gedeputeerde staten.

      2 Indien een aanvraag tot verlening van de onderscheidenlijke uitkeringen van het Grotestedenbeleid bij Onze
      Minister belast met de coördinatie van het Grotestedenbeleid wordt ingediend, wordt, in afwijking van het eerste
      lid, die aanvraag mede aangemerkt als een aanvraag tot verlening van investeringsbudget.

      3 De aanvraag wordt ingediend uiterlijk op 15 november van het jaar dat voorafgaat aan het investeringstijdvak,
      indien het een gemeente betreft als bedoeld in [artikel 5, tweede lid][ref3], en uiterlijk op 15 februari
      van het eerste jaar van het investeringstijdvak, indien het een gemeente betreft die is aangewezen ingevolge
      [artikel 6, derde lid, onder a][ref4]. Indien in een bepaald geval het wegens overschrijding van de
      indieningstermijn buiten behandeling laten van een aanvraag zou leiden tot onbillijkheden van overwegende
      aard, kan Onze Minister onderscheidenlijk kunnen gedeputeerde staten besluiten de aanvraag alsnog te
      behandelen. In dat geval kan een lager investeringsbudget worden verleend dan het bedrag dat op grond van
      [artikel 6, eerste of derde lid][ref5], voor de betrokken gemeente als investeringsbudget is geïndiceerd.

      4 Onze Minister, onderscheidenlijk gedeputeerde staten, beslissen op een aanvraag binnen acht weken na de dag
      waarop die aanvraag door Onze Minister, onderscheidenlijk gedeputeerde staten, dan wel waarop de aanvraag tot
      verlening van de onderscheidenlijke uitkeringen van het Grotestedenbeleid voor het investeringstijdvak door Onze
      Minister belast met de coördinatie van het Grotestedenbeleid, is ontvangen. Deze termijn kan eenmaal met vier weken
      worden verlengd.

      5 Onze Minister beslist niet op de aanvraag van een gemeente waaraan hij investeringsbudget kan verlenen dan nadat
      hij gedeputeerde staten van de betrokken provincie gedurende ten minste vier weken in de gelegenheid heeft gesteld
      hem van advies te dienen ten aanzien van in elk geval:

      a. de intergemeentelijke afstemming van het ontwikkelingsprogramma, met dien verstande dat het advies geen
      betrekking heeft op de intergemeentelijke afstemming van een ontwikkelingsprogramma van een gemeente die is gelegen
      in een plusregio, en

      b. de verenigbaarheid van het ontwikkelingsprogramma met op grond van een wettelijke bevoegdheid vastgesteld
      provinciaal beleid.

      6 Onze Minister beslist niet op de aanvraag van een gemeente waaraan hij investeringsbudget kan verlenen en
      die is gelegen in een plusregio, dan nadat hij het dagelijks bestuur van de betreffende plusregio gedurende ten
      minste vier weken in de gelegenheid heeft gesteld hem van advies te dienen ten aanzien van de intergemeentelijke
      afstemming van het ontwikkelingsprogramma.

      7 Gedeputeerde staten beslissen niet op de aanvraag van een gemeente waaraan zij investeringsbudget kunnen verlenen
      en die is gelegen in een plusregio, dan nadat zij het dagelijks bestuur van de betreffende plusregio gedurende ten
      minste vier weken in de gelegenheid hebben gesteld hen van advies te dienen ten aanzien van de intergemeentelijke
      afstemming van het ontwikkelingsprogramma of de activiteit in het kader van de stedelijke vernieuwing, bedoeld in
      [artikel 7, vijfde lid][ref6].


