  - number: '15'
    text: |-
      1 Indien de in [artikel 13, eerste of zesde lid][ref1], bedoelde termijn voor indiening van de aanvraag
      om vaststelling van het investeringsbudget is verstreken zonder dat een aanvraag is ingediend, kan het
      investeringsbudget ambtshalve worden vastgesteld.

      2 Onze Minister gaat onderscheidenlijk gedeputeerde staten gaan niet over tot ambtshalve vaststelling dan nadat
      de gemeente in de gelegenheid is gesteld een aanvraag in te dienen binnen een door Onze Minister onderscheidenlijk
      gedeputeerde staten te bepalen termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0011788#Artikel13
