  - number: '17'
    text: |-
      1 Onze Minister kan een provincie een aanwijzing geven, indien:

      a. de verdeling van de door haar verkregen middelen ten behoeve van het aan gemeenten te verlenen
      investeringsbudget, of

      b. de wijze van beoordeling van de aanvragen om investeringsbudget van de gemeenten

      naar zijn oordeel niet verenigbaar is met de bij of krachtens deze wet gegeven regels.

      2 Onze Minister kan een provincie tevens een aanwijzing geven, indien het provinciale budget niet is besteed ten
      behoeve van verlening van investeringsbudget.
    url: https://wetten.overheid.nl/BWBR0011788/2006-11-29#Artikel17
  - number: '18'
    text: |-
      1 Indien het bedrag dat uit 's Rijks kas beschikbaar is voor investeringsbudget gedurende het investeringstijdvak
      wordt verhoogd, kan Onze Minister een aanvullend investeringsbudget onderscheidenlijk aanvullende middelen voor
      investeringsbudget verstrekken volgens regels die worden gegeven bij of krachtens algemene maatregel van bestuur,
      waarbij zo nodig kan worden afgeweken van het bepaalde bij of krachtens de [artikelen 6][ref1], [7][ref2],
      [9][ref3] en [11][ref4].

      2 Indien gedurende een investeringstijdvak een gemeente als bedoeld in [artikel 5, derde lid][ref5], wordt
      aangewezen als een gemeente als bedoeld in het [tweede lid van dat artikel][ref6], kan Onze Minister die gemeente
      investeringsbudget verstrekken volgens regels die worden gegeven bij of krachtens algemene maatregel van bestuur,
      waarbij zo nodig kan worden afgeweken van het bepaalde bij of krachtens de [artikelen 5][ref7], [6][ref8],
      [7][ref9], [11][ref10] en [12][ref11].

      3 In de gevallen, bedoeld in het tweede lid, wijzigt Onze Minister het bedrag van het reeds voor het betrokken
      investeringstijdvak aan de betrokken provincie verleende investeringsbudget ten nadele van die provincie tot ten
      hoogste het bedrag van het reeds door gedeputeerde staten van die provincie aan de betrokken gemeente verleende
      investeringsbudget en wijzigen gedeputeerde staten van die provincie de verlening van investeringsbudget aan
      die gemeente ten nadele van die gemeente met hetzelfde bedrag. De door Onze Minister reeds aan de betrokken
      provincie en de door die provincie reeds aan de betrokken gemeente bij wijze van voorschot betaalde bedragen aan
      investeringsbudget worden onderling verrekend.


