  - number: '2'
    text: |-
      De gemeenteraad draagt zorg voor stedelijke vernieuwing. Hiertoe stelt hij een ontwikkelingsprogramma vast of treft
      anderszins maatregelen in het belang van de stedelijke vernieuwing.
    url: https://wetten.overheid.nl/BWBR0011788/2006-11-29#Artikel2
  - number: '3'
    text: |-
      Provinciale staten dragen uitsluitend zorg voor de bevordering en ondersteuning van stedelijke vernieuwing, in het
      bijzonder ten aanzien van gemeenten waaraan gedeputeerde staten investeringsbudget kunnen verlenen.
    url: https://wetten.overheid.nl/BWBR0011788/2006-11-29#Artikel3
  - number: '4'
    text: |-
      1 Onze Ministers wie het aangaat, Onze Minister daaronder begrepen, dragen zorg voor de bevordering en
      ondersteuning van stedelijke vernieuwing.

      2 Waar bij of krachtens deze wet bevoegdheden zijn toegekend aan Onze Minister, oefent hij deze uit in
      overeenstemming met Onze Ministers wie het mede aangaat.
    url: https://wetten.overheid.nl/BWBR0011788/2006-11-29#Artikel4
  - number: '5'
    text: |-
      1 Onze Minister kan aan gemeenten investeringsbudget verstrekken ten behoeve van de uitvoering van het
      gemeentelijke beleid inzake stedelijke vernieuwing.

      2 Bij algemene maatregel van bestuur worden de gemeenten aangewezen, waaraan Onze Minister, mede gelet op de
      aard en omvang van de stedelijke vernieuwingsopgave in die gemeenten, investeringsbudget kan verstrekken. De
      bij de maatregel aangewezen gemeenten blijven in elk geval voor de duur van een investeringstijdvak als zodanig
      aangewezen.

      3 Ten behoeve van andere gemeenten dan die, bedoeld in het tweede lid, verstrekt Onze Minister de middelen voor
      investeringsbudget aan de onderscheidene provincies. Onze Minister kan hieraan voorschriften verbinden.

      4 Gedeputeerde staten kunnen investeringsbudget verstrekken aan de gemeenten, bedoeld in het derde lid, ten behoeve
      van de uitvoering van het gemeentelijke beleid inzake stedelijke vernieuwing.
    url: https://wetten.overheid.nl/BWBR0011788/2006-11-29#Artikel5
  - number: '6'
    text: |-
      1 Uiterlijk op 1 april van het jaar dat voorafgaat aan het investeringstijdvak geeft Onze Minister inzicht in:

      a. voor een gemeente waaraan hij investeringsbudget kan verstrekken: een indicatie van de hoogte van dat budget,
      waarbij hij tevens aangeeft welk deel van dat budget afkomstig is uit gelden voor bodemsanering, en

      b. voor een provincie: de hoogte van het provinciale budget ten behoeve van de verstrekking van investeringsbudget
      aan de overige gemeenten.

      2 De berekening van de budgetten, bedoeld in het eerste lid, geschiedt volgens bij algemene maatregel van bestuur
      te geven regels.

      3 Uiterlijk drie maanden na de bekendmaking van het provinciale budget, bedoeld in het eerste lid, onder b, geven
      gedeputeerde staten inzicht in de verdeling van de middelen voor investeringsbudget over in hun provincie gelegen
      gemeenten waaraan zij investeringsbudget kunnen verstrekken. Daarbij:

      a. wijzen gedeputeerde staten de gemeenten aan waarvan naar hun oordeel gelet op de aard en de omvang van
      de stedelijke vernieuwingsopgave een ontwikkelingsprogramma wordt verlangd om in aanmerking te komen voor
      investeringsbudget,

      b. geven gedeputeerde staten een indicatie van de hoogte van het budget voor deze gemeenten en

      c. maken gedeputeerde staten, gehoord burgemeester en wethouders van de betrokken gemeenten,
      met het oog op de toepassing van [artikel 11, vijfde lid, aanhef en onder a][ref1],
      [artikel 8, derde lid, aanhef en onder a, en vijfde lid, aanhef en onder c][ref2], bekend binnen welke groepen van
      gemeenten onderlinge afstemming van de ontwikkelingsprogramma's en de activiteiten in het kader van de stedelijke
      vernieuwing, bedoeld in [artikel 7, vijfde lid][ref3], hun gewenst voorkomt, welke bekendmaking geen betrekking
      heeft op gemeenten die zijn gelegen in een plusregio.

      4 Bij provinciale verordening worden regels gegeven omtrent de wijze waarop de verdeling tussen de gemeenten van de
      middelen voor investeringsbudget wordt vastgesteld. Bij de verdeling houdt de provincie rekening met de aard en de
      omvang van de stedelijke vernieuwingsopgave in die gemeenten.

      5 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gegeven omtrent de verdeling, bedoeld in het
      derde en vierde lid. Deze regels kunnen onder meer inhouden dat beperkingen worden aangebracht in de mate waarin
      gedeputeerde staten bij de verdeling van de middelen voor investeringsbudget andere criteria kunnen hanteren dan
      die welke krachtens het tweede lid gelden voor de berekening van de budgetten van de in het eerste lid, onder a,
      bedoelde gemeenten.


      [ref1]: https://wetten.overheid.nl/BWBR0011788#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0011788#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0011788#Artikel7
