    text: |-
      De volgende regelingen worden ingetrokken:

      a. [Erkenningsregeling fabrikanten kentekenplaten][ref1];

      b. [Erkenningsregeling foliefabrikanten][ref2];

      c. [Erkenningsregeling lamineerders][ref3];

      d. [Regeling erkenning bedrijfsvoorraad][ref4];

      e. [Regeling erkenning exportdienstverlening][ref5];

      f. [Regeling erkenning tenaamstelling][ref6];

      g. [Regeling aanpassing voertuigen][ref7];

      i. [Regeling erkenning en keuringsbevoegdheid APK][ref8];

      j. [Regeling handelaarskentekens en -kentekenbewijzen][ref9].


