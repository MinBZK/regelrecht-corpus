  - number: '11'
    text: |-
      Bij de aanvraag wordt door de aanvrager zekerheid gesteld aan de Dienst Wegverkeer voor een bedrag ter grootte van
      de geschatte omzet van de te verlenen tenaamstellingen en schorsingen over twee maanden.
    url: https://wetten.overheid.nl/BWBR0051669/2026-01-01#Artikel11
  - number: '12'
    text: |-
      1 Het erkende bedrijf heeft:

      a. in de eerste twee jaar na verlening van de erkenning in ten minste 80% van de gemeenten met meer dan 10.000
      inwoners een loket waar een aanvraag voor tenaamstelling of schorsing van voertuigen kan worden gedaan;

      b. vanaf twee jaar na verlening van de erkenning in tenminste 90% van de gemeenten met meer dan 10.000 inwoners
      een loket;

      c. in de gemeenten waarin het bedrijf geen loket heeft, een loket in een naastliggende gemeente.

      2 In de bedrijfsvoering van het erkende bedrijf is een kwaliteitsmanagementsysteem geïmplementeerd. De wijze
      waarop het kwaliteitsmanagementsysteem is geïmplementeerd, wordt omschreven in een kwaliteitshandboek. In het
      kwaliteitsmanagementsysteem wordt in ieder geval invulling gegeven aan de gestelde voorschriften van het eerste,
      zesde, zevende, negende, tiende en elfde lid. Het erkende bedrijf handelt overeenkomstig het kwaliteitshandboek.

      3 Het erkende bedrijf meldt wijzigingen in het kwaliteitshandboek onmiddellijk aan de Dienst Wegverkeer voor zover
      deze van belang kunnen zijn voor de erkenning.

      4 Elk loket van het erkende bedrijf is minimaal vijf dagen per week gedurende ten minste drie aaneengesloten uren
      voor het publiek geopend.

      5 Het erkende bedrijf meldt veiligheidsincidenten met betrekking tot digitale communicatie onmiddellijk aan de
      Dienst Wegverkeer.

      6 De gegevens die het erkende bedrijf verwerkt dan wel waarin het inzage heeft, worden uitsluitend gebruikt ten
      behoeve van de tenaamstelling en de schorsing van voertuigen.

      7 Het erkende bedrijf zorgt voor unieke identificatie van de medewerkers op de werkplek waar de tenaamstelling of
      schorsing wordt uitgevoerd, waarbij het vereiste beveiligingsniveau op een door de Dienst Wegverkeer te bepalen
      wijze wordt vastgesteld.

      8 Het erkende bedrijf stuurt informatie aan de Dienst Wegverkeer waaruit het loket blijkt waar de tenaamstelling of
      schorsing is aangevraagd.

      9 Het erkende bedrijf zorgt ervoor dat het personeel van het erkende bedrijf voldoende is opgeleid in
      identiteitsvaststelling en documentherkenning.

      10 Het erkende bedrijf zorgt ervoor dat er richtlijnen voor medewerkers zijn met betrekking tot het veilig gebruik
      van applicaties, wachtwoorden, de herkenning en melding van veiligheidsincidenten en de vernietiging van documenten
      met gevoelige informatie na het afronden van processen.

      11 In afwijking van [artikel 5][ref1] is vanaf de buitenkant van elk loket van het erkende bedrijf op een door
      de Dienst Wegverkeer vastgestelde wijze zichtbaar dat hier tenaamstellingen en schorsingen van voertuigen kunnen
      worden verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0051669#Artikel5
    url: https://wetten.overheid.nl/BWBR0051669/2026-01-01#Artikel12
    references:
      - id: ref1
