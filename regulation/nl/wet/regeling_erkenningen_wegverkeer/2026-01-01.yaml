  - number: '98'
    text: |-
      1 De LPG-technicus controleert alvorens hij aan zijn werkzaamheden begint of hij de beschikking heeft over de
      Regelgeving keuring gasinstallatie.

      2 Bij keuring van:

      a. een G3-installatie is de G3-fabrikantenverklaring aanwezig;

      b. een installatie volgens VN/ECE-reglement 115 is de inbouwhandleiding en een afschrift van de VN/ECE-goedkeuring
      aanwezig.
    url: https://wetten.overheid.nl/BWBR0051669/2026-01-01#Artikel98
  - number: '99'
    text: |-
      1 Als bij het erkende bedrijf een keuring van een gasinstallatie wordt aangevraagd, stelt deze, na overleg met
      de aanvrager, onverwijld het tijdstip voor de keuring vast. De keuring vindt zo spoedig mogelijk na de aanvraag
      plaats.

      2 Er wordt geen keuring verricht voordat het kentekenregister is geraadpleegd ten aanzien van:

      a. het voor het voertuig opgegeven kenteken;

      b. het voertuigidentificatienummer van het ter keuring van de gasinstallatie aangeboden voertuig.

      3 Er wordt geen keuring verricht en de aanvrager van een keuring van een gasinstallatie wordt naar de Dienst
      Wegverkeer doorverwezen als:

      a. het raadplegen van het kentekenregister niet mogelijk is door een onjuiste combinatie van het kenteken
      en de laatste vier posities van het voertuigidentificatienummer of indien de laatste vier posities van het
      voertuigidentificatienummer niet bekend zijn;

      b. het voertuigidentificatienummer van het voertuig niet in overeenstemming is met het kentekenregister;

      c. in geval van een tenaamstelling met een beperkte geldigheidsduur als bedoeld in
      [artikel 40a van het Kentekenreglement][ref1], de tenaamstelling is vervallen;

      d. het aantal cilinders van de motor in het voertuig niet overeenkomt met het aantal cilinders vermeld in het
      kentekenregister.

      4 Als het raadplegen van de voertuiggegevens als gevolg van een storing in een door de Dienst Wegverkeer
      geaccepteerd netwerk, als bedoeld in [artikel 55, zevende lid][ref2], niet mogelijk is, wordt niet tot keuring van
      de gasinstallatie overgegaan.

      5 Indien het voertuig is voorzien van kentekenplaten dient het kenteken vermeld op de kentekenplaten overeen te
      komen met het kenteken zoals vermeld in het kentekenregister. Is dit niet het geval, dan wordt de aanvrager van de
      keuring doorverwezen naar de Dienst Wegverkeer.

      6 Het voertuigidentificatienummer dient zonder demontage van onderdelen van de gasinstallatie leesbaar te zijn. Is
      dit niet mogelijk, dan wordt de aanvrager doorverwezen naar de Dienst Wegverkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel40a
      [ref2]: https://wetten.overheid.nl/BWBR0051669#Artikel55
