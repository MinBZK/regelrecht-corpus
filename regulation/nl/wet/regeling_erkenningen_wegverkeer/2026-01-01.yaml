        artikel: '5'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '13'
    text: |-
      Het erkende bedrijf overlegt jaarlijks op een door de Dienst Wegverkeer te bepalen datum over het voorafgaande
      kalenderjaar een door een registeraccountant opgesteld rapport, waaruit blijkt dat het voldoet aan de eisen van
      [artikel 12][ref1] van deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0051669#Artikel12
    url: https://wetten.overheid.nl/BWBR0051669/2026-01-01#Artikel13
