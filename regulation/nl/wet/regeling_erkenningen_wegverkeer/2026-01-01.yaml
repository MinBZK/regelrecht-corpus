        artikel: 186c
  - number: '133'
    text: |-
      Deze regeling treedt in werking op het tijdstip waarop de Wet van 10 mei 2023 tot wijziging van de Wegenverkeerswet
      1994 in verband met de modernisering van het erkenningenstelsel, het verbeteren van de handhaafbaarheid en enkele
      andere wijzigingen van technische aard (Stb. 2023, 195) in werking treedt.
    url: https://wetten.overheid.nl/BWBR0051669/2026-01-01#Artikel133
  - number: '134'
    text: 'Deze regeling wordt aangehaald als: Regeling erkenningen wegverkeer.'
    url: https://wetten.overheid.nl/BWBR0051669/2026-01-01#Artikel134
