  - number: '67'
    text: |-
      1 Indien zich wijzigingen voordoen in de samenstelling van de economische eenheid als bedoeld in [artikel 54][ref1]
      worden deze door het erkende bedrijf schriftelijk aan de Dienst Wegverkeer gemeld.

      2 Indien als gevolg van een wijziging, als bedoeld in [artikel 4][ref2], de bedrijfsvoering van de natuurlijke
      persoon, de rechtspersoon of de rechtsvorm waaraan een erkenning APK is verleend, wordt voortgezet door een andere
      natuurlijke persoon of rechtspersoon, worden de toegekende bonus- en strafpunten van het systeem als bedoeld in
      [artikel 75][ref3] en eventuele opgelegde sancties beschouwd als te zijn toegekend aan deze natuurlijke persoon
      of rechtspersoon.

      3 Wijziging en uitbreiding van een erkenning is niet mogelijk indien de erkenning op grond van
      [artikel 4auh van de wet][ref4] is ingetrokken.


