  - number: '42'
    text: |-
      Het erkende bedrijf bewaart de twee helften van de afgekeurde blanco-kentekenplaten of kentekenplaten waarop de
      laatste tien meldingen, bedoeld in [artikel 41, derde lid][ref1], betrekking hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0051669#Artikel41
    url: https://wetten.overheid.nl/BWBR0051669/2026-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0051669
        artikel: '41'
        hoofdstuk: '3'
        paragraaf: '3.12'
  - number: '43'
    text: |-
      1 Het erkende bedrijf controleert bij de afgifte van de kentekenplaat dat het kenteken op de kentekenplaat
      overeenkomt met het kenteken zoals gemeld aan de Dienst Wegverkeer en met het kentekenbewijs, indien dat getoond
      moet worden.

      2 Het erkende bedrijf geeft kentekenplaten, bedoeld in [artikel 41, eerste lid][ref1], slechts af conform de
      [Regeling legitimatievoorschriften tenaamstelling en kentekenplaten][ref2].

      3 Onverminderd het tweede lid, geeft het erkende bedrijf kentekenplaten volgens het model 18.2A tot en met
      18.2E van de [bijlage bij de Regeling kentekens en kentekenplaten](onbekend) slechts af indien blijkens het
      kentekenregister toestemming is verleend voor het voeren van kentekenplaten volgens dat model.

      4 Onverminderd het tweede lid, geeft het erkende bedrijf donkerblauwe kentekenplaten slechts af indien aan de
      voorwaarden wordt voldaan volgens [artikel 3, tweede lid, van de Regeling kentekens en kentekenplaten][ref3].

      5 Indien de Dienst Wegverkeer meldt dat er geen kentekenplaten mogen worden afgegeven, geeft het erkende bedrijf
      geen kentekenplaten voor het desbetreffende kenteken af.

      6 Bij de afgifte van kentekenplaten volgens de modellen 27.15A tot en met 27.17E, 30.7 en 30.8 voorziet het
      erkende bedrijf de kentekenplaten van een maandaanduiding. Aangeduid wordt het nummer van de lopende maand. Indien
      de afgifte plaatsvindt na de zevende dag van de lopende maand, wordt aangeduid het nummer van de lopende of de
      volgende maand.


      [ref1]: https://wetten.overheid.nl/BWBR0051669#Artikel41
      [ref2]: https://wetten.overheid.nl/BWBR0007091
      [ref3]: https://wetten.overheid.nl/BWBR0009071#Artikel3
