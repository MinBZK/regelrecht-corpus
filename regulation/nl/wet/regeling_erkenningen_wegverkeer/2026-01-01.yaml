  - number: '47'
    text: |-
      1 Het erkende bedrijf voorziet bij vervanging, de kentekenplaten met een lamineercode van een door de Dienst
      Wegverkeer aan het erkende bedrijf gemelde duplicaatcode.

      2 Dit artikel is niet van toepassing op kentekenplaten van het model 18.2 van de [bijlage bij de Regeling kentekens
      en kentekenplaten](onbekend).

      3 Handelaarskentekenplaten van de modellen 27.11 t/m 27.14, 30.5, 30.6 en 31.5 van de [bijlage bij de Regeling
      kentekens en kentekenplaten](onbekend) worden niet vervangen.
    url: https://wetten.overheid.nl/BWBR0051669/2026-01-01#Artikel47
  - number: '48'
    text: |-
      1 Het erkende bedrijf meldt bij de afgifte van kentekenplaten, die voorzien behoren te zijn van een lamineercode,
      bij de Dienst Wegverkeer, ten behoeve van het register, bedoeld in [artikel 70b van de wet][ref1], de volgende
      gegevens:

      a. het betrokken kenteken;

      b. indien dat bewijs moet worden overgelegd: het documenttype, het nummer en het land van afgifte van het
      legitimatiebewijs van degene die de kentekenplaten in ontvangst neemt;

      d. de lamineercodes van de afgegeven kentekenplaten

      e. indien van toepassing: dienstenpasnummer en bedrijfsnummer of door de Dienst Wegverkeer te bepalen gegevens;

      f. de lamineercodes en indien van toepassing modellen en kleuren van de om te wisselen kentekenplaten, indien deze
      moeten zijn voorzien van een lamineercode;

      g. indien de kentekenplaten zijn voorzien van een duplicaatcode: de duplicaatcode; en

      h. de reden voor afgifte.

      2 Indien de lamineercode niet meer in zijn geheel aanwezig is op de kentekenplaat, mag, in afwijking van het eerste
      lid onder f, als de Dienst Wegverkeer hiervoor toestemming verleent, de melding zonder lamineercode worden gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel70b
    url: https://wetten.overheid.nl/BWBR0051669/2026-01-01#Artikel48
    references:
