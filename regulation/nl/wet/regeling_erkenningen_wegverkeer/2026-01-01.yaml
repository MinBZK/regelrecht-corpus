  - number: '22'
    text: |-
      1 Het is de houder van een handelaarskenteken met de lettercombinatie FH, HA, HF of HH toegestaan om maximaal vijf
      bijbehorende kentekenplaten te hebben. Daarbij is het enkel toegestaan:

      a. van de modellen 27.11, 27.12 en 27.14 van de [bijlage bij de Regeling kentekens en kentekenplaten](onbekend) ten
      hoogste twee kentekenplaten per model te hebben; en

      b. van het model 27.13 van de [bijlage bij de Regeling kentekens en kentekenplaten](onbekend) ten hoogste één
      kentekenplaat te hebben.

      2 Het is de houder van een handelaarskenteken met de lettercombinatie OA of LH toegestaan om over één bijbehorende
      kentekenplaat van het model 27.11, één van het model 27.12 en één van het model 27.13 van de [bijlage bij de
      Regeling kentekens en kentekenplaten](onbekend) te beschikken.

      3 Het is de houder van een handelaarskenteken met de lettercombinatie HC toegestaan te beschikken over één
      bijbehorende kentekenplaat van het model 30.5, één van het model 30.6, en één van het model 31.5 van de [bijlage
      bij de Regeling kentekens en kentekenplaten](onbekend).
    url: https://wetten.overheid.nl/BWBR0051669/2026-01-01#Artikel22
  - number: '23'
    text: |-
      1 Een erkenning demontage kan op aanvraag worden verleend aan een natuurlijke persoon of rechtspersoon, die
      exploitant is van een onderneming waar volgens het handelsregister bedrijfsmatig activiteiten met betrekking tot
      het demonteren van motorrijtuigen en aanhangwagens worden uitgevoerd.

      2 De aanvrager van de erkenning heeft voor elke vestiging:

      a. een omgevingsvergunning als bedoeld in [artikel 3.153 van het Besluit activiteiten leefomgeving][ref1];

      b. een omgevingsvergunning als bedoeld in [artikel 3.186 van het Besluit activiteiten leefomgeving][ref2] voor het
      demonteren van voertuigen; of

      c. als er geen vergunning als bedoeld in onderdeel a of b vereist is, een melding als bedoeld in
      [artikel 4.574, eerste lid, van het Besluit activiteiten leefomgeving][ref3] gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0041330#Artikel3.153
      [ref2]: https://wetten.overheid.nl/BWBR0041330#Artikel3.186
      [ref3]: https://wetten.overheid.nl/BWBR0041330#Artikel4.574
