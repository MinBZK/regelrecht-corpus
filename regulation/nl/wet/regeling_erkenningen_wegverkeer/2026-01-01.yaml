  - number: '51'
    text: |-
      1 Het afgeven van kentekenplaten op een andere locatie dan de productieplaats, in afwijking van
      [artikel 36, derde lid][ref1], mag uitsluitend worden verricht door een erkend bedrijf kentekenplaatfabrikant.

      2 Bij levering als bedoeld in het eerste lid zijn de [artikelen 43 tot en met 47][ref2] van overeenkomstige
      toepassing, met uitzondering van [artikel 45, tweede lid][ref3].

      3 Voorafgaand aan de afgifte van kentekenplaten die voorzien behoren te zijn van een lamineercode, op een andere
      locatie dan de productieplaats, meldt het erkende bedrijf bij de Dienst Wegverkeer, op een door deze dienst te
      bepalen wijze, de volgende gegevens:

      a. de betrokken kentekens en, indien aanwezig, de duplicaatcodes;

      b. de lamineercodes, en;

      c. de reden van afgifte.

      4 Het erkende bedrijf levert geen kentekenplaten op een andere locatie dan de productieplaats als de Dienst
      Wegverkeer meldt dat er geen kentekenplaten mogen worden geleverd.

      5 Op de dag van de afgifte van kentekenplaten op een andere locatie dan de productieplaats doet het erkende bedrijf
      de melding, bedoeld in [artikel 48, eerste lid][ref4].


