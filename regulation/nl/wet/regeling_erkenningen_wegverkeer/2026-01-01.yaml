  - number: '94'
    text: |-
      Op de keuringsruimte bestemd voor het keuren van gasinstallaties zijn de
      [artikelen 56, eerste, tweede en vierde lid][ref1], en [57][ref2] van overeenkomstige toepassing, met dien
      verstande dat onder APK-keurmeester, bedoeld in artikel 56, wordt verstaan: LPG-technicus.


      [ref1]: https://wetten.overheid.nl/BWBR0051669#Artikel56
      [ref2]: https://wetten.overheid.nl/BWBR0051669#Artikel57
