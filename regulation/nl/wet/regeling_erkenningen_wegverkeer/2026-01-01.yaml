  - number: '27'
    text: |-
      Ten behoeve van het melden dat voertuigen voorgoed buiten Nederland worden gebracht, verstrekt de Dienst Wegverkeer
      aan het erkende bedrijf blanco documenten om te worden gebruikt als kentekenbewijzen deel II welke bij de melding
      door het erkende bedrijf worden aangemaakt en verstrekt.
    url: https://wetten.overheid.nl/BWBR0051669/2026-01-01#Artikel27
  - number: '28'
    text: |-
      De erkenning foliefabrikant kan op aanvraag worden verleend aan een natuurlijke persoon of een rechtspersoon
      die volgens het handelsregister of gelijkwaardig buitenlands register exploitant is van een productieplaats die
      geschikt is voor het fabriceren van folie die geschikt is voor de productie van kentekenplaten.
    url: https://wetten.overheid.nl/BWBR0051669/2026-01-01#Artikel28
  - number: '29'
    text: |-
      De aanvrager van een erkenning overlegt bij de aanvraag een testrapport van een door de Dienst Wegverkeer
      aangewezen onderzoeksinstelling, waaruit blijkt dat de aanvrager folie kan produceren die geschikt is
      voor de productie van kentekenplaten overeenkomstig de [Regeling kentekens en kentekenplaten][ref1] en de
      [Regeling eisen goedkeuring kentekenplaten 2000][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009071
      [ref2]: https://wetten.overheid.nl/BWBR0012172
    url: https://wetten.overheid.nl/BWBR0051669/2026-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0009071
      - id: ref2
        bwb_id: BWBR0012172
  - number: '30'
    text: |-
      1 Het erkende bedrijf zorgt ervoor dat de folie bij de productie van folie en bij de levering aan
      een erkend bedrijf lamineerder voldoet aan de [Regeling kentekens en kentekenplaten][ref1] en de
      [Regeling eisen goedkeuring kentekenplaten 2000][ref2].

      2 Het erkende bedrijf beschikt over een goed afsluitbare ruimte, welke voldoende bescherming biedt om beschadiging,
      diefstal of achteruitgang van de folie te voorkomen, waarin de folie bewaard moet worden.

      3 In geval van diefstal van folie stelt het erkende bedrijf de Dienst Wegverkeer hiervan onmiddellijk op de hoogte.

      4 Folie wordt uitsluitend afgeleverd aan erkende lamineerders.

      5 Bij de aflevering is de folie voorzien van een document, waarin in ieder geval is vermeld:

      a. de hoeveelheid en de soort folie, onderverdeeld naar kleur en model;

      b. de datum van levering;

      c. de naam en het adres van de foliefabrikant; en

      d. de naam en het adres van het erkende bedrijf lamineerder.

      6 Van het in het zesde lid bedoelde document wordt gedurende twee jaren een afschrift bewaard.

      7 Het erkende bedrijf foliefabrikant levert op verzoek van de Dienst Wegverkeer een rapport van een
      door de Dienst Wegverkeer aangewezen onderzoeksinstelling, waaruit blijkt dat door het erkende bedrijf
      geproduceerde, folie geschikt is voor de productie van kentekenplaten die voldoen aan de eisen, gesteld in de
      [Regeling kentekens en kentekenplaten][ref3] en de [Regeling eisen goedkeuring kentekenplaten 2000][ref4].

      8 De uitoefening van de erkenning heeft slechts plaats vanaf de productieplaats waaraan de erkenning is toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0009071
      [ref2]: https://wetten.overheid.nl/BWBR0012172
