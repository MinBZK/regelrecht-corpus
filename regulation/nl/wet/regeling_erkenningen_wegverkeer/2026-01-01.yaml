  - number: '70'
    text: |-
      1 Het resultaat van elke keuring wordt door de APK-keurmeester schriftelijk vastgelegd op het keuringsrapport.
      Onmiddellijk na de keuring wordt het resultaat door de APK-keurmeester gemeld aan de Dienst Wegverkeer.

      2 Voor dit keuringsrapport wordt gebruikgemaakt van het door de Dienst Wegverkeer vastgestelde model
      keuringsrapport, dat bekend is gemaakt in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0051669/2026-01-01#Artikel70
  - number: '71'
    text: |-
      1 Na afloop van elke keuring wordt het bepaalde in het tweede tot en met vijfde lid in acht genomen voordat een
      keuringsrapport wordt afgegeven aan de aanvrager van een keuring.

      2 Het voertuig wordt na authenticatie door de APK-keurmeester bij de Dienst Wegverkeer afgemeld onder verstrekking
      van de volgende gegevens:

      a. het pasnummer op de bevoegdheidspas van de APK-keurmeester;

      b. het kenteken van het voertuig;

      c. de meldcode, gevormd door de laatste vier cijfers van het voertuigidentificatienummer, letters en leestekens
      buiten beschouwing gelaten;

      d. indien het een voertuig betreft dat is voorzien van een kilometerteller, de afgelezen kilometerstand van het
      voertuig;

      e. het resultaat van de keuring;

      f. ten aanzien van de voor de verbruiksmonitoring uit te lezen personenauto’s en lichte bedrijfsvoertuigen, de
      werkelijke gegevens en het voertuigidentificatienummer, tenzij:

      1°. de eigenaar of houder van het voertuig uitdrukkelijk heeft geweigerd deze gegevens beschikbaar te stellen; of

      2°. het beschikbaar stellen van deze gegevens niet mogelijk is vanwege een technische reden.

      3 Na acceptatie van de afmelding wordt weergegeven:

      1°. de transactiecode en het tijdstip van de afmelding;

      2°. indien het voertuig is goedgekeurd: tevens een nieuwe vervaldatum;

      3°. indien het voertuig aan een steekproef moet worden onderworpen: tevens de einde wachttijd van de steekproef;

      4 Op het keuringsrapport wordt schriftelijk vermeld:

      a. het pasnummer op de bevoegdheidspas als bedoeld in het tweede lid, onderdeel a, en het bepaalde in de onderdelen
      b en c;

      b. de afgelezen kilometerstand indien het voertuig is voorzien van een kilometerteller;

      c. het resultaat van de keuring;

      d. de transactiecode, en uitsluitend indien de schriftelijke invulling rechtstreeks plaatsvindt uit het door de
      Dienst Wegverkeer bijgehouden kentekenregister de tekst ‘afdruk RDW’;

      e. indien het voertuig is goedgekeurd de vervaldatum, waarbij de maand van de vervaldatum voluit in letters is
      geschreven;

      f. indien het voertuig aan een steekproef wordt onderworpen de einde wachttijd van de steekproef;

      g. de naam, adresgegevens en het keuringsinstantienummer van het erkende bedrijf.

      5 Voordat hij het keuringsrapport ondertekent, gaat de APK-keurmeester na of het rapport volledig is ingevuld.

      6 Een APK-keurmeester meldt niet meer dan vier voertuigen per zestig minuten af.

      7 Het keuringsrapport wordt onverwijld aan de aanvrager afgegeven als het voertuig niet aan een steekproef wordt
      onderworpen.

      8 Als het voertuig aan een steekproef wordt onderworpen, deelt het erkende bedrijf dit aan de aanvrager mede en
      houdt het erkende bedrijf het keuringsrapport onder zich voor een periode van ten hoogste negentig minuten, vanaf
      het tijdstip van afmelding.
    url: https://wetten.overheid.nl/BWBR0051669/2026-01-01#Artikel71
  - number: '72'
    text: |-
      Het aantal voertuigen, bedoeld in [artikel 86, eerste lid, van de wet][ref1], dat na een verrichte keuring
      steekproefsgewijs aan een herkeuring wordt onderworpen, bedraagt ten minste zevenentwintig van elke duizend
      voertuigen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel86
    url: https://wetten.overheid.nl/BWBR0051669/2026-01-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '86'
  - number: '73'
    text: |-
      1 Er worden gedurende negentig minuten na het tijdstip van afmelding geen wijzigingen aangebracht in de staat van
      het voertuig dat aan een steekproef wordt onderworpen. Er worden met betrekking tot een dergelijk voertuig ook geen
      metingen verricht.

      2 Het erkende bedrijf wijst de eigenaar of houder van het voertuig dat aan een steekproef wordt onderworpen erop
      dat deze verplicht is het voertuig voor de uitvoering van de steekproef beschikbaar te houden.

      3 Voorafgaande aan de steekproefherkeuring wordt het keuringsrapport door het erkende bedrijf of de APK-keurmeester
      aan de daartoe aangewezen functionaris van de Dienst Wegverkeer overhandigd. Als [artikel 69, derde lid][ref1],
      van toepassing is, overhandigt het erkende bedrijf of de APK-keurmeester ook het in dat artikellid bedoelde
      goedkeuringsdocument.

      4 Aan een steekproef wordt alle medewerking verleend en de terzake door de Dienst Wegverkeer gegeven aanwijzingen
      worden in acht genomen. Onder alle medewerking wordt in ieder geval verstaan dat:

      a. bij uitsluiting de APK-keurmeester die het voertuig aan een keuring heeft onderworpen, aanwezig is vanaf het
      moment dat de mededeling, bedoeld in het eerste lid, is gedaan en zelf feitelijke assistentie verleent bij het
      uitvoeren van de steekproef;

      b. het voertuig niet van de keuringsruimte wordt verwijderd gedurende de steekproef;

      c. de desbetreffende ruimte en apparatuur gedurende de steekproef beschikbaar worden gesteld.

      5 Als bij de steekproef wordt vastgesteld dat het voertuig niet voldoet aan de keuringseisen, het voertuig
      onterecht is af- of goedgekeurd, het keuringsrapport onjuist of onvolledig is ingevuld of indien wordt
      geconstateerd dat de voorschriften met betrekking tot de steekproef niet in acht zijn genomen, wordt door de
      daartoe aangewezen functionaris van de Dienst Wegverkeer een steekproefcontrolerapport opgemaakt dat door deze
      wordt ondertekend alsmede door de APK-keurmeester.


      [ref1]: https://wetten.overheid.nl/BWBR0051669#Artikel69
    url: https://wetten.overheid.nl/BWBR0051669/2026-01-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0051669
        artikel: '69'
        hoofdstuk: '3'
        paragraaf: '3.13'
  - number: '74'
    text: |-
      1 Als de eigenaar of houder van een voertuig dat aan een steekproef wordt onderworpen met het betreffende voertuig
      de keuringsruimte verlaat, wordt dit onverwijld door de APK-keurmeester aan de Dienst Wegverkeer gemeld. Een
      eventuele goedkeuring van het betreffende voertuig wordt door de Dienst Wegverkeer ingetrokken en dat voertuig kan
      niet meer worden afgemeld.

      2 Het erkende bedrijf draagt er zorg voor dat de eigenaar of houder van een voertuig dat aan een steekproef wordt
      onderworpen in het geval, bedoeld in het eerste lid, op de hoogte is gesteld van de verplichting om een nieuwe
      aanvraag van een keuringsrapport bij de Dienst Wegverkeer in te dienen.
    url: https://wetten.overheid.nl/BWBR0051669/2026-01-01#Artikel74
  - number: '75'
    text: |-
      1 De Dienst Wegverkeer kan in het kader van het toezicht op het erkende bedrijf of de APK-keurmeester een systeem
      van bonus- en strafpunten vaststellen, dat wordt bekendgemaakt in de Staatscourant.

      2 Als een systeem als bedoeld in het eerste lid is vastgesteld, wordt aan de hand daarvan, afhankelijk van de
      resultaten van het uitgeoefende toezicht, beoordeeld of het toezicht wordt verminderd of verscherpt dan wel of een
      erkenning of een keuringsbevoegdheid wordt gewijzigd of ingetrokken.
    url: https://wetten.overheid.nl/BWBR0051669/2026-01-01#Artikel75
  - number: '76'
    text: |-
      De Dienst Wegverkeer kan steekproefsgewijs anonieme keuringen uitvoeren door middel van het ter keuring aanbieden
      van een voertuig, in het kader van het toezicht op de erkenning en het verrichten van keuringen.
    url: https://wetten.overheid.nl/BWBR0051669/2026-01-01#Artikel76
  - number: '77'
    text: |-
      1 Een wijziging, schorsing of intrekking van een erkenning als bedoeld in
      [artikel 4auh, zesde lid, van de wet][ref1], geldt in beginsel uitsluitend voor de betrokken keuringsplaats.

      2 In afwijking van het eerste lid kan de Dienst Wegverkeer, als omstandigheden daartoe aanleiding geven, bepalen
      dat een wijziging, schorsing of intrekking alle keuringsplaatsen betreft waarvoor de erkenning geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel4auh
    url: https://wetten.overheid.nl/BWBR0051669/2026-01-01#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 4auh
  - number: '78'
    text: |-
      De in [artikel 4auh, zesde lid van de wet][ref1] bedoelde wijziging, schorsing of intrekking van de erkenning kan,
      als de erkenningseis of het erkenningsvoorschrift waaraan niet wordt voldaan slechts betrekking heeft op het keuren
      van een bepaalde groep voertuigen, beperkt blijven tot het keuren van die desbetreffende groep voertuigen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel4auh
    url: https://wetten.overheid.nl/BWBR0051669/2026-01-01#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 4auh
  - number: '79'
    text: |-
        - *werkplaats:* perceel of enkele kadastraal aangrenzende percelen waarop een erkend bedrijf wijziging goedkeuring
      voertuigen zijn werkzaamheden verricht met daarop een werkruimte. De werkruimte kan bestaan uit één of meer
      besloten ruimten gelegen in één gebouw, dan wel in verscheidene belendende of nagenoeg belendende gebouwen, bedoeld
      om deel uit te maken van een werkplaats.
    url: https://wetten.overheid.nl/BWBR0051669/2026-01-01#Artikel79
  - number: '80'
    text: |-
      1 Een erkenning wijziging goedkeuring voertuigen kan op aanvraag worden verleend aan een natuurlijke persoon of
      rechtspersoon, die volgens het handelsregister exploitant is van een of meer ondernemingen waar bedrijfsmatig
      wijzigingen in de goedkeuring van geregistreerde voertuigen worden uitgevoerd.

      2 De aanvrager dient te beschikken over:

      a. Een goedgekeurd rapport van de Dienst Wegverkeer waaruit blijkt dat de aanvrager voldoende in staat is
      seriematige wijzigingen in voertuigen uit te voeren.

      b. Ten minste één door de Dienst Wegverkeer afgegeven geldige toestemming voor een seriematige wijziging van
      voertuigen.
    url: https://wetten.overheid.nl/BWBR0051669/2026-01-01#Artikel80
  - number: '81'
    text: |-
      1 De erkenning is alleen geldig voor de seriematige wijzigingen waarvoor toestemming is verleend door de Dienst
      Wegverkeer.

      2 Een erkend bedrijf heeft tenminste één geldige toestemming voor een seriematige wijziging.
    url: https://wetten.overheid.nl/BWBR0051669/2026-01-01#Artikel81
  - number: '82'
    text: |-
      1 Een aanvraag voor een seriematige wijziging bevat de volgende elementen:

      a. het voertuigtype waarop de seriematige wijziging betrekking heeft;

      b. het merk van het voertuigtype waarop de seriematige wijziging betrekking heeft;

      c. indien beschikbaar, de handelsbenaming van het voertuigtype waarop de seriematige wijziging betrekking heeft;

      d. de voertuigcategorie van het voertuigtype waarop de seriematige wijziging betrekking heeft;

      e. naam en adres van het erkende bedrijf; en

      f. een omschrijving van de seriematige wijziging, waaronder in ieder geval:

      1°. overige relevante voertuiggegevens van het voertuigtype waarop de seriematige wijziging betrekking heeft;

      2°. de wijziging die wordt aangebracht, bedoeld in [hoofdstuk 6 van de Regeling voertuigen][ref1].

      2 Een seriematige wijziging kan meerdere voertuigtypes, merknamen of handelsbenamingen bevatten, mits een
      basisvoertuig dat wordt gebruikt bij die seriematige wijziging is typegoedgekeurd op grond van de dezelfde
      goedkeuringscertificaten of testrapporten.


      [ref1]: https://wetten.overheid.nl/BWBR0025798#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0051669/2026-01-01#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0025798
        hoofdstuk: '6'
  - number: '83'
    text: |-
      1 Voordat toestemming, als bedoeld in [artikel 80, tweede lid, onder b][ref1], wordt verleend, stelt het erkende
      bedrijf één of meerdere voertuigen van het voertuigtype waarop een seriematige wijziging betrekking heeft en
      waarvoor toestemming wordt aangevraagd, ter beoordeling beschikbaar aan de Dienst Wegverkeer. Een toestemming
      wordt verleend als de ter beschikking gestelde exemplaren voldoen aan de eisen van wijziging in de goedkeuring van
      voertuigen uit [hoofdstuk 6 van de Regeling voertuigen][ref2].

      2 Bij het verlenen van toestemming krijgt de seriematige wijziging een uniek WGV-nummer.


      [ref1]: https://wetten.overheid.nl/BWBR0051669#Artikel80
      [ref2]: https://wetten.overheid.nl/BWBR0025798#Hoofdstuk6
