  - number: '50'
    text: |-
      1 Kentekenplaten die zijn doorgeleverd, mogen niet opnieuw worden doorgeleverd.

      2 Het erkende bedrijf aan wie de kentekenplaten zijn geleverd, dient de geleverde kentekenplaten bij afgifte te
      voorzien van een keurmerk als bedoeld in [artikel 5, eerste lid, van de Regeling kentekens en kentekenplaten][ref1].


