  - number: '68'
    text: |-
      1 Keuringen worden slechts verricht door een APK-keurmeester in de keuringsruimte waarvoor de erkenning geldt.

      2 In de keuringsruimte worden slechts keuringen verricht van voertuigen waarvoor de erkenning geldt.

      3 Het erkende bedrijf stelt een actuele versie van de Regelgeving APK beschikbaar aan de APK-keurmeester.

      4 De keuring wordt verricht in een keuringsruimte met behulp van de vereiste apparatuur, genoemd in
      [paragraaf 3.13.3.2][ref1]. Van deze eis kan worden afgeweken indien volgens de wijze van keuren zoals vermeld in
      [hoofdstuk 5 van de Regeling voertuigen][ref2] een rij- of remproef buiten de keuringsruimte wordt uitgevoerd, mits
      de buitentemperatuur binnen het temperatuurgebied van de verplichte apparatuur ligt.

      5 Bij de keuring wordt het voertuig tevens gecontroleerd aan de hand van de in [bijlage 1][ref3] opgenomen
      reparatieadviespunten.


      [ref1]: https://wetten.overheid.nl/BWBR0051669#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0025798#Hoofdstuk5
      [ref3]: https://wetten.overheid.nl/BWBR0051669
