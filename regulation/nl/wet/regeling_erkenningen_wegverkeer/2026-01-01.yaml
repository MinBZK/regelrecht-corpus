  - number: '46'
    text: |-
      Bij omwisseling van kentekenplaten in verband met het voorgenomen gebruik van het voertuig als taxi dan wel in
      verband met de beëindiging van zodanig gebruik, is [artikel 45][ref1] van overeenkomstige toepassing, met dien
      verstande dat de omwisseling slechts kan plaatsvinden per twee kentekenplaten.


      [ref1]: https://wetten.overheid.nl/BWBR0051669#Artikel45
