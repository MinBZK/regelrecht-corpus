  - number: '20'
    text: |-
      Een erkenning handelaarskenteken kan op aanvraag worden verleend aan:

      a. een erkend bedrijf bedrijfsvoorraad;

      b. een erkend bedrijf inschrijven zonder onderzoek;

      c. een erkend bedrijf inschrijven met onderzoek; of

      b. een natuurlijke persoon of rechtspersoon, die volgens het handelsregister exploitant is van een onderneming,
      waar voertuigen bedrijfsmatig voor derden worden hersteld, bewerkt of gereinigd.
    url: https://wetten.overheid.nl/BWBR0051669/2026-01-01#Artikel20
  - number: '21'
    text: |-
      1 Bij het verlenen van de erkenning wordt aan het erkende bedrijf het handelaarskentekenbewijs voor de opgegeven
      categorieën bedoeld in [artikel 3 van het Kentekenreglement][ref1] verstrekt.

      2 Het erkende bedrijf kan op aanvraag en tegen betaling meerdere handelaarskentekenbewijzen verkrijgen.

      3 De erkenning geldt uitsluitend voor de vestigingen die in de erkenning worden vermeld.

      4 Een handelaarskenteken mag slechts worden gebruikt voor de categorie waarvoor het is opgegeven.

      5 Het erkende bedrijf handelaarskenteken bewaart het handelaarskentekenbewijs en de bijbehorende
      handelaarskentekenplaten als die niet gebruikt worden in een goed afsluitbare voorziening op het adres van de
      vestiging waaraan de erkenning is toegekend, die naar het oordeel van de Dienst Wegverkeer voldoende bescherming
      tegen inbraak, diefstal en brand biedt.

      6 Indien een handelaarskentekenbewijs dan wel een handelaarskentekenplaat verloren is geraakt of teniet is gegaan,
      dient het erkende bedrijf dit onmiddellijk te melden aan de Dienst Wegverkeer.

      7 Degene aan wie de erkenning handelaarskenteken is verleend, vernietigt de handelaarskentekenplaten onmiddellijk
      nadat de erkenning is ingetrokken of nadat het handelaarskentekenbewijs ongeldig is verklaard dan wel is verloren
      of tenietgegaan.

      8 Het handelaarskenteken mag uitsluitend voor de bedrijfsactiviteiten gebruikt worden voor voertuigen die:

      a. nog niet zijn ingeschreven;

      b. behoren tot een importeursvoorraad;

      c. behoren tot de bedrijfsvoorraad van degene aan wie het kenteken is opgegeven;

      d. ter bewerking, reiniging of herstel aan degene aan wie het handelaarskenteken is opgegeven ter beschikking zijn
      gesteld.

      9 Wanneer gebruik wordt gemaakt van het handelaarskenteken, is het niet toegestaan om goederen of personen
      te vervoeren, tenzij dit aantoonbaar gebeurt in het kader van beproeving van aan het voertuig verrichte of te
      verrichten werkzaamheden. In dat geval moeten de goederen op het adres, waar deze zijn ingeladen, ook worden
      uitgeladen en personen moeten op het adres waar ze zijn ingestapt ook weer uitstappen.

      10 Bij een motorrijtuig of een aanhangwagen voorzien van een handelaarskentekenplaat, dient het bijbehorende
      kentekenbewijs aanwezig te zijn.

      11 Het erkende bedrijf heeft het handelaarskenteken verzekerd op grond van
      [artikel 13, zesde lid, van de Wet aansprakelijkheidsverzekering motorrijtuigen][ref2].

      12 Het erkende bedrijf, bedoeld in [artikel 7, aanhef en onder a, van het besluit][ref3], beschikt op zijn
      vestiging bedoeld in het derde lid over een overdekte en behoorlijk af te sluiten ruimte waar onder alle
      weersomstandigheden werkzaamheden voor het herstellen, bewerken en reinigen van een voertuig plaats kunnen vinden.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002415#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0051671#Artikel7
