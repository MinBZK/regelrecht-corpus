        artikel: '33'
        hoofdstuk: '3'
        paragraaf: '3.11'
  - number: '35'
    text: |-
      Een erkenning kentekenplaatfabrikant kan op aanvraag worden verleend aan een natuurlijke persoon of rechtspersoon,
      die volgens het handelsregister exploitant is van een productieplaats die geschikt is voor het fabriceren van
      kentekenplaten worden uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0051669/2026-01-01#Artikel35
  - number: '36'
    text: |-
      1 Op de in [artikel 12, eerste lid, van het besluit][ref1] genoemde productieplaats:

      a. is een overdekte en behoorlijk af te sluiten en goed verlichte ruimte die is voorzien van een passende
      verwarming;

      b. is een goed afsluitbare ruimte, welke naar het oordeel van de Dienst Wegverkeer voldoende bescherming tegen
      inbraak, diefstal en brand biedt, waarin de op de erkenning betrekking hebbende bescheiden worden afgesloten
      en bewaard. In de ruimte worden de blanco-kentekenplaten en kentekenplaten gescheiden van elkaar afgesloten en
      bewaard;

      c. zijn middelen, waaronder ten minste een matrijzenset, een pers, een apparaat waarmee een keurmerk kan worden
      aangebracht en een hotprintmachine of verfwals. Deze middelen zijn deugdelijk en in goede staat van onderhoud.

      2 Het erkende bedrijf produceert geen platen die onvoldoende te onderscheiden zijn van officiële kentekenplaten.


      [ref1]: https://wetten.overheid.nl/BWBR0051671#Artikel12
    url: https://wetten.overheid.nl/BWBR0051669/2026-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0051671
        artikel: '12'
  - number: '37'
    text: |-
      1 Het erkende bedrijf draagt zorg voor een zodanige behandeling van blanco-kentekenplaten en kentekenplaten
      dat beschadiging of achteruitgang wordt voorkomen. Deze zorg strekt zich uit tot en met de afgifte van de
      kentekenplaten.

      2 Het erkende bedrijf voorkomt gebruik van blanco-kentekenplaten en kentekenplaten voor een ander doel dan waarvoor
      deze zijn bestemd.

      3 In geval van diefstal van blanco-kentekenplaten en kentekenplaten doet het erkende bedrijf daarvan aangifte bij
      een van de in [artikel 141][ref1] en [142 van het Wetboek van Strafvordering][ref2] bedoelde personen. Het erkende
      bedrijf stelt de Dienst Wegverkeer hiervan onmiddellijk op de hoogte en deelt onmiddellijk een afschrift van het
      proces-verbaal.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel142
    url: https://wetten.overheid.nl/BWBR0051669/2026-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '142'
  - number: '38'
    text: |-
      Het erkende bedrijf kan te allen tijde aangeven waar in ontvangst genomen blanco-kentekenplaten en de
      kentekenplaten die nog niet zijn afgeleverd, zich bevinden.
    url: https://wetten.overheid.nl/BWBR0051669/2026-01-01#Artikel38
  - number: '39'
    text: De uitoefening van de erkenning heeft slechts plaats vanaf de productieplaats waaraan de erkenning is toegekend.
    url: https://wetten.overheid.nl/BWBR0051669/2026-01-01#Artikel39
  - number: '40'
    text: |-
      1 Het erkende bedrijf neemt uitsluitend blanco-kentekenplaten in ontvangst van een erkende lamineerder, die
      zijn voorzien van het door de lamineerder aangebrachte lamineerderswaarmerk, indien dat is voorgeschreven. Het
      erkende bedrijf meldt, ten behoeve van het register, bedoeld in [artikel 70b, eerste lid, van de wet][ref1],
      bij de Dienst Wegverkeer binnen één week na de ontvangst van blanco-kentekenplaten die op grond van de
      [Regeling kentekens en kentekenplaten][ref2] voorzien zijn van een lamineercode, dat de blanco-kentekenplaten zijn
      ontvangen, op een door deze dienst te bepalen wijze.

      2 Een erkend bedrijf mag geen blanco-kentekenplaten doorleveren aan een ander erkend bedrijf kentekenplaatfabrikant
      of een erkend bedrijf lamineerder, tenzij hiervoor door de Dienst Wegverkeer toestemming is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel70b
      [ref2]: https://wetten.overheid.nl/BWBR0009071
    url: https://wetten.overheid.nl/BWBR0051669/2026-01-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 70b
      - id: ref2
        bwb_id: BWBR0009071
  - number: '41'
    text: |-
      1 Alvorens het erkende bedrijf overgaat tot aflevering van kentekenplaten controleert hij of deze voldoen aan de
      in de [Regeling kentekens en kentekenplaten][ref1] en de [Regeling eisen goedkeuring kentekenplaten 2000][ref2]
      gestelde eisen.

      2 Het erkende bedrijf maakt de blanco-kentekenplaten en kentekenplaten die beschadigd
      zijn, dan wel niet aan de eisen van de [Regeling kentekens en kentekenplaten][ref3] of de
      [Regeling eisen goedkeuring kentekenplaten 2000][ref4] voldoen, binnen één week na constatering onbruikbaar door
      deze op zodanige wijze doormidden te knippen dat de lamineercode goed leesbaar blijft.

      3 Het erkende bedrijf meldt, ten behoeve van het register, bedoeld in [artikel 70b, eerste lid, van de wet][ref5],
      onmiddellijk het onbruikbaar maken van blanco-kentekenplaten en kentekenplaten die voorzien zijn van een
      lamineercode aan de Dienst Wegverkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0009071
