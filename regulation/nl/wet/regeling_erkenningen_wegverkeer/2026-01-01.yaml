  - number: '117'
    text: |-
      De exameninstantie voldoet aan de volgende eisen:

      a. de exameninstantie is onafhankelijk en onpartijdig en neemt bij de uitvoering van de werkzaamheden het
      examenreglement in acht;

      b. de exameninstantie neemt afdoende maatregelen om fraude, voor, tijdens en na het examen te voorkomen.
    url: https://wetten.overheid.nl/BWBR0051669/2026-01-01#Artikel117
  - number: '118'
    text: |-
      In de [artikelen 2 tot en met 114][ref1] zijn de voorwaarden opgenomen, bedoeld in de [artikelen 21][ref2] en
