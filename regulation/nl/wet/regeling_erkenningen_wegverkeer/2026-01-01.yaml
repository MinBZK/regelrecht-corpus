  - number: '84'
    text: |-
      1 Het erkende bedrijf beschikt over een werkplaats bestemd voor de uitvoering van de werkzaamheden.

      2 Op de werkplaats is een ruimte die, afhankelijk van de in de erkenning opgenomen voertuigcategorie, voorzien
      is van een doelmatige inspectieput of hefinrichting, die geschikt is voor deze gewijzigde voertuigen, en van
      doelmatige verlichting.

      3 De ruimte is overdekt, behoorlijk af te sluiten, goed verlicht en voorzien van een vlakke vloer en verwarming.

      4 Op de werkplaats kan de administratie behoorlijk worden uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0051669/2026-01-01#Artikel84
  - number: '85'
    text: |-
      1 In de ruimte is de volgende apparatuur aanwezig:

      a. een dubbel geïsoleerde veiligheidslooplamp dan wel een zaklantaarn die enerzijds een zodanige lichtsterkte heeft
      dat ook moeilijk bereikbare onderdelen van een voertuig voldoende helder kunnen worden verlicht om een nauwkeurige
      inspectie van een voertuig mogelijk te maken en die anderzijds zodanig is afgeschermd dat degene die de keuring
      uitvoert niet door het uitgestraalde licht wordt verblind;

      b. basisgereedschap voor de uitvoering van de wijzigingen aan voertuigen; en

      c. alle noodzakelijke apparatuur en meetmiddelen voor het uitvoeren van de werkzaamheden voor elke seriematige
      wijziging waarvoor de toestemming, bedoeld in [artikel 80, tweede lid, onder b][ref1], is verleend.

      2 De apparatuur is deugdelijk, verkeert in een goede staat van onderhoud en is, indien noodzakelijk, voorzien van
      geldige ijkcertificaten afgegeven door een geaccrediteerd meetinstituut.


      [ref1]: https://wetten.overheid.nl/BWBR0051669#Artikel80
    url: https://wetten.overheid.nl/BWBR0051669/2026-01-01#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0051669
        artikel: '80'
        hoofdstuk: '3'
        paragraaf: '3.14'
  - number: '86'
    text: |-
      1 Het erkende bedrijf beschikt over een adequaat systeem van maatregelen en procedures voor een effectieve controle
      van de werkzaamheden om zeker te stellen dat de uitvoering van de seriematige wijziging waarvoor toestemming is
      verleend, overeenstemmen met [hoofdstuk 6 van de Regeling voertuigen][ref1].

      2 Het erkende bedrijf is verantwoordelijk voor het invoeren van en het op peil houden van het kwaliteitssysteem.

      3 Het erkende bedrijf is verantwoordelijk voor de juiste uitvoering van de aan de erkenning verbonden voorschriften
      en het nemen van maatregelen om ervoor te zorgen dat aan de voorschriften wordt voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0025798#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0051669/2026-01-01#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0025798
        hoofdstuk: '6'
  - number: '87'
    text: |-
      Wanneer een erkend bedrijf voornemens is een technische verandering aan te brengen in de seriematige wijziging
      waarvoor toestemming is verleend, moet deze hiervan vooraf melding doen aan de Dienst Wegverkeer. De Dienst
      Wegverkeer beoordeelt vervolgens of er voor de seriematige wijziging opnieuw toestemming, als bedoeld in
      [artikel 80, tweede lid, onder b][ref1], dient te worden verkregen door het erkende bedrijf.


      [ref1]: https://wetten.overheid.nl/BWBR0051669#Artikel80
    url: https://wetten.overheid.nl/BWBR0051669/2026-01-01#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0051669
        artikel: '80'
        hoofdstuk: '3'
        paragraaf: '3.14'
  - number: '88'
    text: |-
      Het erkende bedrijf dient voor elk gewijzigd voertuig vast te stellen dat aangebrachte wijzigingen, als bedoeld
      in [hoofdstuk 6 van de Regeling voertuigen][ref1], geheel overeenstemmen met de seriematige wijziging waarvoor
      toestemming is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0025798#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0051669/2026-01-01#Artikel88
    references:
      - id: ref1
        bwb_id: BWBR0025798
        hoofdstuk: '6'
  - number: '89'
    text: |-
      1 Als een wijziging als bedoeld in [hoofdstuk 6 van de Regeling voertuigen][ref1] is aangebracht wordt voor elk
      gewijzigd voertuig een ombouwverklaring, conform het door de Dienst Wegverkeer vastgestelde model, compleet en
      volledig ingevuld.

      2 De ombouwverklaring wordt onmiddellijk na de wijziging aan de Dienst Wegverkeer toegezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0025798#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0051669/2026-01-01#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0025798
        hoofdstuk: '6'
  - number: '90'
    text: |-
      1 Het erkende bedrijf draagt er zorg voor dat:

      a. de relevante regelgeving, voorschriften, specificaties en documentatie betreffende de toe te passen materialen
      en onderdelen binnen het erkende bedrijf beschikbaar en toegankelijk zijn voor het personeel;

      b. de administratie doelmatig en deugdelijk is, waardoor voldoende inzicht wordt geboden in de verschillende fasen
      die het voertuig tijdens en na fabricage van de wijziging doorloopt, en

      c. de administratie omtrent geproduceerde wijzigingen in de goedkeuring van voertuigen ten minste 10 jaar
      beschikbaar blijft.
    url: https://wetten.overheid.nl/BWBR0051669/2026-01-01#Artikel90
  - number: '91'
    text: |-
      1 In deze paragraaf wordt verstaan onder:

        - *keuring:* keuring als bedoeld in [artikel 98 van de wet][ref1];
        - *keuringseisen:* voor de desbetreffende voertuigcategorie geldende goedkeuringseisen als bedoeld in
      [artikel 21, tweede lid, van de wet][ref2];
        - *opnamekaart gasinstallatie:* bewijs volgens een door de Dienst Wegverkeer vastgesteld model dat de
      gasinstallatie overeenkomstig deze regeling is gekeurd;
        - *Regelgeving keuring gasinstallatie:* editie van het boekwerk Regelgeving keuring gasinstallatie of de via de
      website van de Dienst Wegverkeer bekendgemaakte Regelgeving keuring gasinstallatie die door de Dienst Wegverkeer is
      vastgesteld en geldig is op het moment van de keuring;
        - *steekproef:* steekproefsgewijze herkeuring.

      2 [Artikel 1.3 van de Regeling voertuigen][ref3] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel98
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0025798#Artikel1.3
