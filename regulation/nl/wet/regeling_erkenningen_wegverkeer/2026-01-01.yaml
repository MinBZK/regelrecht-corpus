  - number: '52'
    text: |-
      In deze paragraaf wordt verstaan onder:

        - *adviespunt:* in het kader van een keuring geconstateerd te verwachten gebrek;
        - *afkeurpunt:* in het kader van een keuring geconstateerd gebrek;
        - *anonieme keuring:* keuring als bedoeld in [artikel 86a van de wet][ref1];
        - *bevoegdheidspas:* pas als bedoeld in [artikel 111][ref2];
        - *Regelgeving APK:* via de website van de Dienst Wegverkeer bekendgemaakte Regelgeving Algemene Periodieke Keuring
      die door de Dienst Wegverkeer is vastgesteld en geldig is op het moment van de keuring;
        - *erkenning APK:* erkenning om keuringsrapporten af te geven voor motorrijtuigen en aanhangwagens, als bedoeld in
      [artikel 14 van het besluit][ref3];
        - *exameninstantie:* door de Minister aangewezen instantie als bedoeld in [artikel 115 van de wet][ref4];
        - *keuring:* periodieke keuring als bedoeld in [artikel 75 van de wet][ref5];
        - *keuringseisen:* op de desbetreffende voertuigcategorie toepasselijke permanente eisen in de
      [Regeling voertuigen][ref6];
        - *keuringsinstelling:* keuringsinstelling als bedoeld in [artikel 8.1.1 van de Regeling voertuigen][ref7];
        - *landbouw- en bosbouwtrekkers:* landbouw- en bosbouwtrekkers op wielen met een maximumconstructiesnelheid van
      meer dan 40 km/h;
        - *lichte voertuigen:* motorrijtuigen of aanhangwagens met een toegestane maximummassa van minder dan of gelijk
      aan 3.500 kg;
        - *onderzoeksgerechtigde:* erkende onderneming of instelling als bedoeld in
      [artikel 8.1.1 van de Regeling voertuigen][ref8];
        - *reparatiepunt:* in het kader van een keuring gerepareerd gebrek;
        - *reparatieadviespunt:* in het kader van een keuring geconstateerd gebrek ten aanzien van de controlepunten
      opgenomen in [bijlage 1][ref9];
        - *resultaat van de keuring:* goedkeuring dan wel afkeuring, alsmede eventuele adviespunten, reparatieadviespunten,
      reparatiepunten, afkeurpunten en opmerkingen inzake de uitvoering van de keuring;
        - *spelingsdetector:* inrichting om de wielophanging te controleren zonder de as op te tillen;
        - *steekproef:* steekproefsgewijze herkeuring als bedoeld in [artikel 86 van de wet][ref10];
        - *voor de verbruiksmonitoring uit te lezen personenauto’s en lichte bedrijfsvoertuigen:* nieuwe personenauto’s
      en nieuwe lichte bedrijfsvoertuigen, als bedoeld in artikel 2, eerste lid, onderdelen a en b, van [Verordening
      (EU) 2019/631](32019R0631), die met ingang van 1 januari 2021 zijn geregistreerd en die zijn uitgerust met
      boordinstrumenten voor de meting van het brandstof- en/of elektriciteitsverbruik overeenkomstig artikel 4 bis van
      [Verordening (EU) 2017/1151](32017R1151);
        - *werkelijke gegevens:* gegevens, als bedoeld in artikel 2, onderdeel c, van [Uitvoeringsverordening (EU)
      2021/392](32021R0392);
        - *zware voertuigen:* motorrijtuigen of aanhangwagens met een toegestane maximummassa van meer dan 3.500 kg.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel86a
