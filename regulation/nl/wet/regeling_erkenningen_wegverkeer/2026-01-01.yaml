articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

        - *APK-keurmeester:* natuurlijk persoon aan wie de bevoegdheid, bedoeld in
      [artikel 14, vijfde lid, van het besluit][ref1] is verleend;
        - *besluit:* [Besluit erkenningen wegverkeer][ref2];
        - *bevoegdheid APK-keurmeester:* bevoegdheid bedoeld in [artikel 14, vijfde lid, van het besluit][ref3];
        - *bevoegdheid LPG-technicus:* bevoegdheid bedoeld in [artikel 16, tweede lid, van het besluit][ref4];
        - *blanco-kentekenplaat:* plaat, gebaseerd op een halffabricaat als bedoeld in de
      [Regeling eisen goedkeuring kentekenplaten 2000][ref5], die geschikt is voor het produceren van een kentekenplaat;
        - *Dienst Wegverkeer:* dienst, genoemd in [artikel 4a van de wet][ref6];
        - *erkenning voor specifieke handelingen:* erkenning als bedoeld in [artikel 4aud, eerste lid, van de wet][ref7];
        - *folie:* folie geschikt voor het produceren van gele, lichtblauwe, lichtgroene of witte kentekenplaten volgens de
      modellen in de [bijlage van de Regeling kenteken en kentekenplaten](onbekend);
        - *fabrikantenkeurmerk:* door de fabrikant van de kentekenplaat aan te brengen merk volgens model M. 3 in de
      [bijlage bij de Regeling kentekens en kentekenplaten][ref8];
        - *foliefabrikant:* bedrijf met een erkenning foliefabrikant;
        - *foliefabrikantwaarmerk:* door de foliefabrikant aan te brengen waarmerk als bedoeld in
      [bijlage 5 van de Regeling eisen goedkeuring kentekenplaten 2000][ref9];
        - *handelsregister:* handelsregister, genoemd in [artikel 2 van de Handelsregisterwet 2007][ref10];
        - *hologram:* hologram als bedoeld in [artikel 2 van de Regeling kentekens en kentekenplaten][ref11];
        - *kentekenplaat:* een plaat die bestemd is om te worden gebruikt als kentekenplaat;
        - *kentekenplaatfabrikant:* bedrijf met een erkenning kentekenfabrikant;
        - *keuringsplaats:* perceel of enkele kadastraal aangrenzende percelen waarop een erkend bedrijf de keuring
      verricht met daarop een keuringsruimte. De ruimte kan bestaan uit één of meer besloten ruimten gelegen in één
      gebouw, dan wel in verscheidene belendende of nagenoeg belendende gebouwen, bedoeld om deel uit te maken van een
      keuringsplaats;
        - *lamineercode:* lamineercode als bedoeld in
      [artikel 6, tweede lid, van de Regeling kentekens en kentekenplaten][ref12];
        - *lamineerder:* bedrijf met een erkenning lamineerder;
        - *lamineerderswaarmerk:* door de lamineerder aan te brengen waarmerk als bedoeld in
      [bijlage 8 van de Regeling eisen goedkeuring kentekenplaten 2000][ref13];
        - *LPG-technicus:* natuurlijk persoon aan wie de bevoegdheid, bedoeld in
      [artikel 16, tweede lid, van het besluit][ref14] is verleend;
        - *ombouwverklaring:* bewijs volgens een door de Dienst Wegverkeer vastgesteld model dat de seriematige wijziging
      in de goedkeuring van een voertuig conform [hoofdstuk 6 van de Regeling voertuigen][ref15] is uitgevoerd;
        - *seriematige wijziging:* op een seriematige manier aangebrachte wijziging in de goedkeuring van voertuigen als
      bedoeld in [hoofdstuk 6 van de Regeling voertuigen][ref16];
        - *wet:* [Wegenverkeerswet 1994](onbekend);
        - *wijziging in de goedkeuring van voertuigen:* wijziging als bedoeld in
      [hoofdstuk 6 van de Regeling voertuigen][ref17].


