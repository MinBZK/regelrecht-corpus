        paragraaf: '4.1'
  - number: '111'
    text: |-
      1 Als bewijs voor een bevoegdheid APK-keurmeester of een bevoegdheid LPG-technicus wordt door de Dienst Wegverkeer
      een bevoegdheidspas verstrekt, behorende bij de betreffende bevoegdheid, overeenkomstig een door de Dienst
      Wegverkeer vastgesteld model.

      2 De APK-keurmeester en LPG-technicus geven op verzoek van de aanvrager van een keuringsrapport, onderscheidenlijk
      een keuring, als bedoeld in [§3.15][ref1], zijn bevoegdheidspas ter inzage.


      [ref1]: https://wetten.overheid.nl/BWBR0051669#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0051669/2026-01-01#Artikel111
    references:
      - id: ref1
        bwb_id: BWBR0051669
        hoofdstuk: '3'
        paragraaf: '3.15'
  - number: '112'
    text: |-
      De APK-keurmeester en de LPG-technicus dragen er zorg voor dat zij bij datacommunicatie met de Dienst Wegverkeer
      gebruikmaken van een door die Dienst voorgeschreven authenticatiemethode en dat een ander niet namens hen de
      datacommunicatie kan verrichten.
    url: https://wetten.overheid.nl/BWBR0051669/2026-01-01#Artikel112
  - number: '113'
    text: |-
      1 De in [artikel 4auh, zesde lid, van de wet][ref1] bedoelde intrekking van de bevoegdheid APK-
      keurmeester kan worden beperkt tot een intrekking voor het keuren van een bepaalde groep voertuigen, als de
      keuringsbevoegdheidseis, het keuringsbevoegdheidsvoorschrift of het keuringsvoorschrift waaraan niet wordt voldaan
      slechts betrekking heeft op het keuren van de desbetreffende groep.

      2 Bij een intrekking kan worden bepaald dat een toets moet worden afgelegd bij de exameninstantie alvorens de
      bevoegdheid opnieuw kan worden gebruikt.

      3 Het erkende bedrijf namens wie de bevoegde persoon optreedt is verantwoordelijk voor de handelingen in het kader
      van de erkenning van de bevoegde persoon.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel4auh
    url: https://wetten.overheid.nl/BWBR0051669/2026-01-01#Artikel113
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 4auh
  - number: '114'
    text: |-
      1 Als er sprake is van een situatie waarin een APK-keurmeester of LPG-technicus niet voldoet aan een of meer
      keuringsbevoegdheidseisen, keuringsbevoegdheidsvoorschriften of keuringsvoorschriften, terwijl die situatie op
      korte termijn kan worden hersteld, kan, in plaats van intrekking van de betreffende bevoegdheid, overgegaan worden
      tot schorsing van die bevoegdheid voor een termijn van ten hoogste twaalf weken.

      2 Wordt binnen de in het eerste lid genoemde termijn niet aangetoond dat wederom aan de keuringsbevoegdheidseisen,
      keuringsbevoegdheidsvoorschriften of keuringsvoorschriften wordt voldaan, dan volgt alsnog intrekking van de
      betreffende bevoegdheid.
    url: https://wetten.overheid.nl/BWBR0051669/2026-01-01#Artikel114
  - number: '115'
    text: |-
      Het exameninstituut IBKI van de Stichting VAM is de exameninstantie voor de examens, bedoeld in
      [artikel 109, eerste lid][ref1], en de toetsen, bedoeld in [artikel 110, eerste en tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0051669#Artikel109
      [ref2]: https://wetten.overheid.nl/BWBR0051669#Artikel110
    url: https://wetten.overheid.nl/BWBR0051669/2026-01-01#Artikel115
