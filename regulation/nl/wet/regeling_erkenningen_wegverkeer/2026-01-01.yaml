        artikel: '64'
        hoofdstuk: '3'
        paragraaf: '3.13'
  - number: '59'
    text: |-
      Naast de in [artikel 58][ref1] genoemde apparatuur is, afhankelijk van de groep voertuigen waarvoor de erkenning
      voor de betrokken keuringsplaats wordt of is verleend, tevens de volgende apparatuur aanwezig die voldoet aan de in
      [artikel 60][ref2] gestelde eisen:

      a. voor zware voertuigen en lichte voertuigen:

      1°. een koplamptestapparaat;

      2°. een pedaalkrachtmeter; deze is niet verplicht in geval van een vóór 1 maart 2000 afgegeven erkenning voor
      het eigen wagenpark en in geval van een erkenning die uitsluitend geldt voor het keuren van voertuigen die zijn
      voorzien van een druklucht-remsysteem;

      3°. een apparaat om LPG-, CNG- of LNG-lekkages op te sporen;

      4°. een universele toerenteller; en

      5°. een hulpstuk waarmee de speling op de sluiting van 2 inch koppelingsschotels meetbaar gemaakt kan worden;

      b. voor zware voertuigen:

      1°. twee manometers met slangen en aansluitstukken voor drukmeetpunten alsmede aansluitkoppen voor
      aanhangwagenremsystemen, waarmee de druk in drukluchtremsystemen en in gasveersystemen kan worden gemeten;

      2°. een stalen rei met een lengte van ten minste 0,90 m;

      3°. een hulpstuk waarmee de speling op de sluiting van 2 inch koppelingsschotels meetbaar gemaakt kan worden; en

      4°. een spelingsdetector;

      c. voor lichte voertuigen:

      1°. een uitleesapparaat ten behoeve van het uitlezen van het emissiegerelateerd diagnostisch boordsysteem;

      2°. een apparaat om verbinding te maken met de elektronische voertuiginterface, ten behoeve van het uitlezen van de
      werkelijke gegevens en het voertuigidentificatienummer.

      d. voor landbouw- en bosbouwtrekkers:

      1°. de apparatuur genoemd in onderdeel a, onder 1°, 2° en 3°;

      2°. de apparatuur genoemd in onderdeel b, onder 1°, 2° en 4°;

      3°. een hydraulische manometer met slangen en aansluitstukken voor drukmeetpunten alsmede aansluitkoppen voor
      hydraulische aanhangwagenremsystemen, waarmee de druk in hydraulische remsystemen kan worden gemeten;

      e. voor motorrijtuigen met een verbrandingsmotor met compressie-ontsteking die niet is voorzien van een roetfilter,
      niet zijnde landbouw- of bosbouwtrekkers: een roetmeter en olietemperatuurmeter;

      f. voor motorrijtuigen met een verbrandingsmotor met compressie-ontsteking die is voorzien van een roetfilter, niet
      zijnde landbouw- of bosbouwtrekkers: een deeltjesteller;

      g. voor motorrijtuigen die zijn voorzien van een verbrandingsmotor met elektrische ontsteking, niet zijnde
      landbouw- of bosbouwtrekkers: een uitlaatgastester met lambda-bepaling;

      h. voor lichte bedrijfsauto’s die zijn voorzien van een drukluchtremsysteem en een vangmuilkoppeling ten behoeve
      van een aanhangwagen: de apparatuur, genoemd in onderdeel b, onder 1°.

      i. voor lichte bedrijfsauto’s die zijn voorzien van een drukluchtremsysteem en een schotelkoppeling ten behoeve van
      een aanhangwagen: de apparatuur, genoemd in onderdeel b, onder 1° tot en met 3°.


      [ref1]: https://wetten.overheid.nl/BWBR0051669#Artikel58
      [ref2]: https://wetten.overheid.nl/BWBR0051669#Artikel60
