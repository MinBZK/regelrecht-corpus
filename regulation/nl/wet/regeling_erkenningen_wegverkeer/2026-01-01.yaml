        paragraaf: '3.3'
  - number: '14'
    text: |-
      Een erkenning tenaamstellen voertuigen bedrijfsvoorraad of importeursvoorraad kan op aanvraag worden verleend aan
      een natuurlijke persoon of rechtspersoon, die volgens het handelsregister exploitant is van een onderneming waar
      handelsactiviteiten met betrekking tot voertuigen worden verricht.
    url: https://wetten.overheid.nl/BWBR0051669/2026-01-01#Artikel14
  - number: '15'
    text: |-
      1 Een aanvraag om een tenaamstelling namens een natuurlijk persoon door het erkende
      bedrijf vindt plaats nadat het erkende bedrijf heeft vastgesteld dat de identiteit van de
      natuurlijk persoon overeenstemt met het door deze persoon overgelegde rijbewijs, bedoeld in
      [artikel 2, eerste lid, van de Regeling legitimatievoorschriften tenaamstelling en kentekenplaten][ref1], door
      middel van een door de natuurlijk persoon ondertekende verklaring met de volgende gegevens:

      a. de naam en het adres van de betreffende natuurlijk persoon namens wie tenaamstelling door het erkende bedrijf
      wordt aangevraagd,

      c. het kenteken van het voertuig dat wordt overgedragen,

      d. de naam en het RDW-bedrijfsnummer van het erkende bedrijf dat de aanvraag indient, en

      e. de handtekening van de betreffende natuurlijk persoon.

      2 Ten behoeve van het opmaken van de verklaring als bedoeld in [artikel 25a, tweede lid][ref2], of
      [artikel 28a, tweede lid, van het Kentekenreglement][ref3] of de machtiging als bedoeld in artikel 25a,
      derde lid, onder b, of artikel 28a, derde lid onder b, van het Kentekenreglement neemt het erkende bedrijf de
      legitimatiegegevens over.

      3 Een aanvraag om een tenaamstelling namens een rechtspersoon vindt plaats nadat het erkende
      bedrijf heeft vastgesteld dat de identiteit van een tekenbevoegde van rechtspersoon overeenstemt
      met het door de tekenbevoegde van de rechtspersoon overgelegde rijbewijs, bedoeld in
      [artikel 2, eerste lid, onder a, van de Regeling legitimatievoorschriften tenaamstelling en kentekenplaten][ref4],
      door middel van een door de tekenbevoegde ondertekende machtiging als bedoeld in
      [artikel 25a, derde lid onder b][ref5], of [artikel 28a, derde lid onder b, van het Kentekenreglement][ref6] met de
      volgende gegevens:

      a. de naam van de rechtspersoon,

      b. unieke nummer, bedoeld in [artikel 9, onderdeel a, van de Handelsregisterwet 2007][ref7];

      c. het kenteken van het voertuig dat wordt overgedragen,

      d. de naam en het RDW-bedrijfsnummer van het erkende bedrijf die de aanvraag indient, en

      e. de handtekening van de persoon die de rechtspersoon vertegenwoordigt indien de machtiging niet digitaal is
      ondertekend door de persoon die de rechtspersoon vertegenwoordigt.

      4 Ten behoeve van het opmaken van de machtiging als bedoeld in [artikel 25a, derde lid onder b][ref8], of
      [artikel 28a, derde lid onder b, van het Kentekenreglement][ref9] neemt het erkende bedrijf de legitimatiegegevens
      over.

      5 Als een voertuig dat is tenaamgesteld in de bedrijfsvoorraad van het erkende bedrijf en ophoudt te behoren tot de
      bedrijfsvoorraad ten behoeve van de natuurlijke of rechtspersoon zelf, zijn het eerste tot en met vierde lid niet
      van toepassing.

      6 Als door de Dienst Wegverkeer niet positief op de aanvraag wordt beslist, verwijst het erkende bedrijf de
      aanvrager naar de Dienst Wegverkeer.

      7 De erkenning geldt voor de vestigingen die in de erkenning worden vermeld.

      8 Het erkende bedrijf beschikt over een goed afsluitbare voorziening, welke naar het oordeel van de Dienst
      Wegverkeer voldoende bescherming tegen inbraak, diefstal en brand biedt, waarin de op de erkenning betrekking
      hebbende bescheiden en documenten moeten worden bewaard.

      9 Het erkende bedrijf zorgt ervoor dat het personeel van het erkende bedrijf, dat betrokken is bij de
      tenaamstelling een opleidingsmodule van de Dienst Wegverkeer met betrekking tot identiteitsvaststelling en
      documentherkenning heeft gevolgd.

      10 De verklaring, bedoeld in het [artikel 25a, tweede lid, van het Kentekenreglement][ref10] en
      [artikel 28a, tweede lid, van het Kentekenreglement][ref11], of een machtiging als bedoeld in artikel 25a, derde
      lid, onder b en artikel 28a, derde lid, onder b, van het Kentekenreglement worden bewaard in een afsluitbare
      voorziening als bedoeld in het achtste lid en door het erkende bedrijf vernietigd wanneer ten minste een en ten
      hoogste twee jaren zijn verstreken sinds de dag van tenaamstelling. De bewaarplicht is niet van toepassing indien
      de verklaring digitaal met een door de Dienst Wegverkeer te bepalen authenticatiemiddel is ondertekend.

      11 Het erkende bedrijf verwerkt de gegevens uitsluitend voor de tenaamstelling van voertuigen.

      12 Het erkende bedrijf meldt veiligheidsincidenten rondom de digitale communicatie bij de Dienst Wegverkeer.

      13 Aan de verplichting als bedoeld in [artikel 23k van het Besluit voertuigen][ref12], wordt gevolg gegeven
      door de tellerstand van een motorrijtuig te verstrekken aan de Dienst Wegverkeer zoals voorgeschreven in
      [artikel 6][ref13].


