  - number: '132'
    text: |-
      De datum waarop de verklaring omtrent het gedrag, bedoeld in
      [artikel 186c, derde lid onderdeel a, van de wet][ref1], wordt overlegd, wordt door de Dienst Wegverkeer bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel186c
    url: https://wetten.overheid.nl/BWBR0051669/2026-01-01#Artikel132
    references:
