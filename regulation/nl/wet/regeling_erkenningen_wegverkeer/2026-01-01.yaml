  - number: '31'
    text: |-
      1 De erkenning lamineerder kan op aanvraag worden verleend aan een natuurlijke persoon of een rechtspersoon
      die volgens het handelsregister of gelijkwaardig buitenlands register exploitant is van een productieplaats die
      geschikt is voor het fabriceren van blanco kentekenplaten.

      2 De productieplaats van de aanvrager is gevestigd in de Europese Unie of in een staat die partij is bij het
      Overeenkomst betreffende de Europese Economische Ruimte of Zwitserland.
    url: https://wetten.overheid.nl/BWBR0051669/2026-01-01#Artikel31
  - number: '32'
    text: |-
      De aanvrager van een erkenning overlegt bij de aanvraag een testrapport van een door de Dienst
      Wegverkeer aangewezen onderzoeksinstelling, waaruit blijkt dat de aanvrager blanco-kentekenplaten kan
      produceren die voldoen aan de eisen gesteld in de [Regeling kentekens en kentekenplaten][ref1] en de
      [Regeling eisen goedkeuring kentekenplaten 2000][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009071
      [ref2]: https://wetten.overheid.nl/BWBR0012172
