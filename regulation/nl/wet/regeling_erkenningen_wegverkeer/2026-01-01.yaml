  - number: '2'
    text: |-
      Een rechtspersoon of de onderneming van de natuurlijke persoon die niet in Nederland is gevestigd en een
      basiserkenning uitsluitend aanvraagt met het oog op het verkrijgen van de erkenning foliefabrikant, de erkenning
      lamineerder of de erkenning wijziging goedkeuring voertuigen overlegt een met een bewijs van inschrijving in het
      handelsregister gelijkwaardig document, afgegeven in het land van vestiging.
    url: https://wetten.overheid.nl/BWBR0051669/2026-01-01#Artikel2
  - number: '3'
    text: |-
      Het erkende bedrijf overlegt op verzoek van de Dienst Wegverkeer overeenkomstig
      [artikel 4auc, tweede lid, van de wet][ref1] binnen zes weken een verklaring omtrent het gedrag die niet ouder is
      dan twee maanden, indien daartoe naar het oordeel van deze dienst aanleiding bestaat als gevolg van:

      a. een rechterlijke veroordeling;

      b. de toetreding van een nieuw lid tot het bestuur van de onderneming; of

      c. berichten en meldingen die doen vermoeden dat er in relatie tot de erkenning strafbare feiten zijn begaan.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel4auc
    url: https://wetten.overheid.nl/BWBR0051669/2026-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 4auc
  - number: '4'
    text: |-
      1 De natuurlijke persoon of rechtspersoon, inclusief alle vestigingen waarvoor de erkenning wordt aangevraagd, is
      blijkens het handelsregister gevestigd in Nederland.

      2 Het eerste lid is niet van toepassing op de erkenningen foliefabrikant, lamineerder en wijziging goedkeuring
      voertuigen.

      3 Een bedrijf met een erkenning voor specifieke handelingen meldt wijzigingen in de bedrijfsactiviteit of in de
      bedrijfsgegevens onmiddellijk schriftelijk aan de Dienst Wegverkeer voor zover deze wijzigingen van belang kunnen
      zijn voor de erkenning.
    url: https://wetten.overheid.nl/BWBR0051669/2026-01-01#Artikel4
  - number: '5'
    text: |-
      Vanaf de buitenkant van een bedrijf met een erkenning voor specifieke handelingen is op een door de Dienst
      Wegverkeer vastgestelde en in de Staatscourant gepubliceerde wijze kenbaar dat een erkenning is verleend.
    url: https://wetten.overheid.nl/BWBR0051669/2026-01-01#Artikel5
  - number: '6'
    text: |-
      1 Als in het kader van een erkenning voor specifieke handelingen communicatie met de Dienst Wegverkeer is
      voorgeschreven, vindt deze communicatie plaats langs elektronische weg, waarbij de digitale identiteit van het
      erkende bedrijf verifieerbaar is.

      2 Het erkende bedrijf maakt daarbij alleen gebruik van de door de Dienst Wegverkeer toegestane
      authenticatiemiddelen en handelt overeenkomstig de bijbehorende gebruikersvoorwaarden.

      3 Het erkende bedrijf is verantwoordelijk voor de handelingen die door of namens hem worden verricht.

      4 Het eerste lid is van overeenkomstige toepassing op de bevoegdheid, bedoeld in
      [artikel 4aue, eerste lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel4aue
    url: https://wetten.overheid.nl/BWBR0051669/2026-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 4aue
  - number: '7'
    text: |-
      Als een erkend bedrijf een onjuistheid constateert binnen de kaders van de erkenning, wordt dat binnen een door de
      Dienst Wegverkeer te bepalen termijn gemeld aan de Dienst Wegverkeer op een door de Dienst Wegverkeer te bepalen
      wijze.
    url: https://wetten.overheid.nl/BWBR0051669/2026-01-01#Artikel7
  - number: '8'
    text: |-
      1 De Dienst Wegverkeer kan bij de aanvraag voor een erkenning voor specifieke handelingen toetsen of de aanvrager
      aan de eisen en voorwaarden voor de erkenning kan voldoen.

      2 Het erkende bedrijf voldoet bij voortduring aan de eisen en voorwaarden die gelden voor de aanvrager.
    url: https://wetten.overheid.nl/BWBR0051669/2026-01-01#Artikel8
  - number: '9'
    text: |-
      1 Een erkenning bedrijfsvoorraad kan op aanvraag worden verleend aan:

      a. een natuurlijke persoon of rechtspersoon, die volgens het handelsregister exploitant is van een onderneming waar
      voertuigen bedrijfsmatig worden verkocht, verhuurd, verleaset of gedemonteerd;

      b. Domeinen Roerende Zaken van het Ministerie van Financiën;

      c. een verzekeringsmaatschappij;

      d. een gemeente;

      e. een waterschap.

      2 De aanvrager van de erkenning als bedoeld onder c, beschikt over een geldige
      vergunning als bedoeld in [artikel 2:27, eerste lid][ref1], [2.36, eerste lid][ref2], of
      [2:40, eerste lid, van de Wet op het financieel toezicht][ref3].

      3 Het erkende bedrijf beschikt over een of meer terreinen niet zijnde een weg waarop de bedrijfsvoorraad wordt
      gestald.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel227
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel236
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel240
    url: https://wetten.overheid.nl/BWBR0051669/2026-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: 2:27
      - id: ref2
