  - number: '34'
    text: |-
      1 Het erkende bedrijf mag, in afwijking van [artikel 33, twaalfde lid][ref1], blanco-kentekenplaten die hij
      zelf gemaakt heeft doorleveren aan een ander erkend bedrijf lamineerder. Deze blanco-kentekenplaten zijn bij die
      levering, indien van toepassing, voorzien van het hologram, en van het lamineerderswaarmerk van het erkende bedrijf
      dat de blanco-kentekenplaten levert.

      2 De doorgeleverde blanco-kentekenplaten worden, indien van toepassing, bij de levering door het erkende bedrijf
      dat levert, voorzien van de lamineercode van het erkende bedrijf lamineerder aan wie wordt geleverd.

      3 Het erkende bedrijf dat levert, registreert bij de levering de:

      a. hoeveelheid en de soort blanco-kentekenplaten, onderverdeeld naar kleur en model;

      b. lamineercodes, indien een lamineercode is voorgeschreven;

      c. datum van levering; en

      d. naam en het adres van het erkende bedrijf aan wie is geleverd.

      4 Het erkende bedrijf aan wie wordt geleverd registreert bij de inontvangstneming van die kentekenplaten:

      a. de gegevens, bedoeld in artikel, derde lid, onder a, b en c, en

      b. de naam en het adres van het erkende bedrijf dat heeft geleverd.

      5 Als blanco-kentekenplaten zijn doorgeleverd, worden deze niet opnieuw doorgeleverd aan een ander erkende bedrijf
      lamineerder.

      6 De registraties, bedoeld in het derde en vierde lid, worden gedurende twee  jaar op de productieplaats bewaard.


      [ref1]: https://wetten.overheid.nl/BWBR0051669#Artikel33
    url: https://wetten.overheid.nl/BWBR0051669/2026-01-01#Artikel34
