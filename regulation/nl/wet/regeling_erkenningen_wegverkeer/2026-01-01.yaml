  - number: '62'
    text: |-
      De eis van kenbaarheid van het erkende bedrijf, bedoeld in [artikel 5][ref1], geldt niet voor keuringsplaatsen
      waarvan in het erkenningsbesluit is vastgelegd dat de erkenning alleen geldt voor voertuigen die behoren tot het
      eigen wagenpark.


      [ref1]: https://wetten.overheid.nl/BWBR0051669#Artikel5
