  - number: '103'
    text: |-
      1 In het kader van het toezicht kan de Dienst Wegverkeer steekproefsgewijs een herkeuring uitvoeren van de in het
      voertuig aangebrachte gasinstallatie.

      2 Op steekproeven zijn [artikel 73][ref1] en [74][ref2] van overeenkomstige toepassing, met dien verstande dat
      onder APK-keurmeester wordt verstaan: LPG-technicus, en onder ‘keuringsrapport’ wordt verstaan: ‘opnamekaart’.

      a. De tweede zin van het derde lid van [artikel 73][ref3] is niet van toepassing.

      3 Een wijziging, schorsing of intrekking van een erkenning als bedoeld in
      [artikel 4auh, zesde lid, van de wet][ref4], geldt in beginsel uitsluitend voor de betrokken keuringsplaats.

      4 In afwijking van het eerste lid kan de Dienst Wegverkeer, als omstandigheden daartoe aanleiding geven, bepalen
      dat een wijziging, schorsing of intrekking alle keuringsplaatsen betreft waarvoor de erkenning geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0051669#Artikel73
      [ref2]: https://wetten.overheid.nl/BWBR0051669#Artikel74
      [ref3]: https://wetten.overheid.nl/BWBR0051669#Artikel73
      [ref4]: https://wetten.overheid.nl/BWBR0006622#Artikel4auh
