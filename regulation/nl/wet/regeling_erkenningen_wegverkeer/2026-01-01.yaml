  - number: '44'
    text: |-
      1 Het erkende bedrijf geeft bij de afgifte van kentekenplaten volgens de modellen 18.2A tot en met 18.2E, 27.1A tot
      en met 27.2H, 27.10A tot en met 27.14, 27.30A tot en met 27.31E, 30.1A tot en met 30.6 en 31.1 van de [bijlage bij
      de Regeling kentekens en kentekenplaten](onbekend) per kenteken:

      a. één kentekenplaat af voor een motorrijtuig op twee of drie wielen met of zonder zijspanwagen, niet zijnde een
      bromfiets, een landbouw- of bosbouwtrekker, een motorrijtuig met beperkte snelheid of een mobiele machine;

      b. twee kentekenplaten af voor een motorrijtuig op meer dan drie wielen, niet zijnde een bromfiets, een landbouw-
      of bosbouwtrekker, een motorrijtuig met beperkte snelheid of een mobiele machine;

      c. één kentekenplaat af voor een bromfiets, een landbouw- of bosbouwtrekker, een motorrijtuig met beperkte snelheid
      of een mobiele machine, en

      d. één kentekenplaat af voor een aanhangwagen.

      2 Indien een handelaarskentekenbewijs voor een motorrijtuig op twee of drie wielen met of zonder zijspanwagen,
      niet zijnde een bromfiets, een landbouw- of bosbouwtrekker, een motorrijtuig met beperkte snelheid of een
      mobiele machine, of voor een motorrijtuig op meer dan drie wielen, niet zijnde een bromfiets, een landbouw- of
      bosbouwtrekker, een motorrijtuig met beperkte snelheid of een mobiele machine wordt overgelegd, worden in afwijking
      van het eerste lid, ten minste één en ten hoogste vijf kentekenplaten afgegeven, met dien verstande dat van de
      modellen 27.11, 27.12 en 27.14 per model ten hoogste twee kentekenplaten worden afgegeven, en van model 27.13, ten
      hoogste één kentekenplaat wordt afgegeven.

      3 In afwijking van het eerste lid mogen per handelaarskentekenbewijs voor aanhangwagens ten hoogste drie
      bijbehorende handelaarskentekenplaten worden afgegeven, waarvan ten hoogste één per model van de modellen 27.11,
      27.12 en 27.13.

      4 In afwijking van het eerste lid mogen per handelaarskentekenbewijs voor bromfietsen ten hoogste drie bijbehorende
      handelaarskentekenplaten worden afgegeven, waarvan ten hoogste één per model van de modellen 30.5, 30.6 en 31.5.

      5 In afwijking van het eerste lid mogen per handelaarskentekenbewijs voor een landbouw- of bosbouwtrekker, een
      motorrijtuig met beperkte snelheid of een mobiele machine ten hoogste drie bijbehorende kentekenplaten worden
      afgegeven, waarvan ten hoogste één per model van de modellen 27.11, 27.12 en 27.13.
    url: https://wetten.overheid.nl/BWBR0051669/2026-01-01#Artikel44
  - number: '45'
    text: |-
      1 In geval van omwisseling van kentekenplaten met een lamineercode mogen deze kentekenplaten worden afgegeven met
      hetzelfde kenteken en, indien aanwezig, dezelfde duplicaatcode.

      2 Het erkende bedrijf geeft de nieuwe kentekenplaten af nadat hij de om te wisselen kentekenplaten in ontvangst
      heeft genomen en heeft geregistreerd overeenkomstig [artikel 48, eerste lid][ref1].

      3 In afwijking van [artikel 44, eerste lid][ref2], mag voor een kenteken ingeval van omwisseling ten hoogste het
      aantal kentekenplaten worden afgegeven dat aan om te wisselen kentekenplaten in ontvangst is genomen.

      4 Het erkende bedrijf maakt de omgewisselde kentekenplaten binnen één dag onbruikbaar door deze doormidden
      te knippen. Het erkende bedrijf meldt de lamineercodes aan de Dienst Wegverkeer zoals bedoeld in
      [artikel 48, eerste lid][ref3] en bewaart de twee helften van de kentekenplaten waarop de laatste tien meldingen
      betrekking hebben.

      5 In geval van omwisseling van kentekenplaten volgens de modellen 27.11 tot en met 27.14, 30.5, 30.6 en 31.5 dienen
      de af te geven kentekenplaten van hetzelfde model te zijn als de ingenomen kentekenplaten.


      [ref1]: https://wetten.overheid.nl/BWBR0051669#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0051669#Artikel44
      [ref3]: https://wetten.overheid.nl/BWBR0051669#Artikel48
