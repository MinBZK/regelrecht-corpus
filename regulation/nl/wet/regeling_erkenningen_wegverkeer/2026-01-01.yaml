  - number: '92'
    text: |-
      Een erkenning gasinstallaties kan op aanvraag worden verleend aan een natuurlijke persoon of rechtspersoon, die
      exploitant is van een of meer keuringsplaatsen.
    url: https://wetten.overheid.nl/BWBR0051669/2026-01-01#Artikel92
  - number: '93'
    text: |-
      1 In de keuringsruimte bestemd voor het keuren van gasinstallaties is
      [artikel 55, eerste, tweede, zesde en zevende lid][ref1], van overeenkomstige toepassing, met dien verstande dat de
      voorziening die conform het zevende lid aanwezig is ten behoeve van afdrukken van keuringsrapporten, wordt gebruikt
      ten behoeve van het afdrukken van opnamekaarten gasinstallatie.

      2 In de in het eerste lid bedoelde ruimte is een voorziening aanwezig waarmee uitlaatgassen en andere gassen direct
      door een daartoe bestemde opening naar buiten kunnen worden gevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0051669#Artikel55
    url: https://wetten.overheid.nl/BWBR0051669/2026-01-01#Artikel93
