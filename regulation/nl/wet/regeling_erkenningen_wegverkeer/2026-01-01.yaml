  - number: '95'
    text: |-
      1 In de keuringsruimte is de volgende apparatuur aanwezig:

      a. een dubbel geïsoleerde veiligheidslooplamp dan wel een zaklantaarn, al dan niet voorzien van een oplaadbare
      accu, die enerzijds een zodanige lichtsterkte heeft dat ook moeilijk bereikbare onderdelen van een voertuig
      voldoende helder kunnen worden verlicht om een nauwkeurige inspectie van een voertuig mogelijk te maken en die
      anderzijds zodanig is afgeschermd dat degene die de keuring uitvoert niet door het uitgestraalde licht wordt
      verblind;

      b. een meetband met een minimale nauwkeurigheidsklasse III van voldoende lengte;

      c. een doelmatige bandenspanningsmeter en een doelmatige bandenpomp;

      d. een koplamptestapparaat;

      e. een universele toerenteller;

      f. een uitlaatgastester met lambda-bepaling;

      g. een apparaat waarmee een gasconcentratie overeenkomende met 800 ppm koolwaterstoffen gedetecteerd kan worden; en

      h. basisgereedschap voor de keuring van de inbouw van een gasinstallatie.

      2 Op de apparatuur zijn de [artikelen 60, eerste tot en met zesde lid][ref1], en [61][ref2] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0051669#Artikel60
      [ref2]: https://wetten.overheid.nl/BWBR0051669#Artikel61
