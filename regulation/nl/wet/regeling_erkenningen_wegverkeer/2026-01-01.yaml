  - number: '33'
    text: |-
      1 De uitoefening van de erkenning heeft slechts plaats vanaf de productieplaats waaraan de erkenning is toegekend.

      2 Het erkende bedrijf zorgt ervoor dat de blanco-kentekenplaten bij levering aan een erkend
      bedrijf kentekenplaatfabrikant voldoen aan de [Regeling kentekens en kentekenplaten][ref1] en de
      [Regeling eisen goedkeuring kentekenplaten 2000][ref2].

      3 Het erkende bedrijf beschikt op de productieplaats over een goed afsluitbare ruimte, welke naar het oordeel
      van de Dienst Wegverkeer voldoende bescherming tegen inbraak, diefstal en brand biedt, waarin de op de erkenning
      betrekking hebbende bescheiden worden bewaard.

      4 Het erkende bedrijf neemt enkel folie in ontvangst van een erkend bedrijf foliefabrikant.

      5 Het erkende bedrijf draagt er zorg voor dat folie die het in bezit heeft niet beschadigt of achteruitgaat en dat
      de blanco kentekenplaten in goede staat worden afgeleverd op de plaats van bestemming.

      6 In afwachting van gebruik of aflevering maakt het erkende bedrijf gebruik van aangewezen afsluitbare opslag- of
      voorraadruimten om beschadiging, diefstal of achteruitgang van folie en blanco-kentekenplaten te voorkomen.

      7 Het erkende bedrijf voorkomt gebruik van folie en blanco-kentekenplaten voor een ander doel dan waarvoor het
      is bedoeld.

      8 In geval van diefstal van folie of blanco-kentekenplaten doet het erkende bedrijf daarvan onmiddellijk aangifte
      bij een van de in [artikel 141][ref3] en [142 van het Wetboek van Strafvordering][ref4] bedoelde personen of bij
      bevoegde personen in het land van vestiging. Het erkende bedrijf stelt de Dienst Wegverkeer hiervan onmiddellijk op
      de hoogte en deelt onmiddellijk een afschrift van het proces-verbaal of een gelijkwaardig buitenlands document.

      9 Het erkende bedrijf kan aangeven waar door hem in ontvangst genomen folie, hologrammen en blanco-kentekenplaten
      die nog niet zijn afgeleverd, zich bevinden.

      10 Folie die in het bezit is van het erkende bedrijf, is voorzien van een foliefabrikantwaarmerk, indien een
      dergelijk waarmerk is voorgeschreven en is vergezeld van een document van de foliefabrikant dat tenminste de
      volgende gegevens bevat:

      a. naam en adres van de foliefabrikant;

      b. datum van afgifte; en

      c. hoeveelheid en soort van de folie, onderverdeeld naar kleur en model.

      11 Folie die niet aan de eisen van het achtste lid voldoet wordt binnen een week na constatering door het erkende
      bedrijf vernietigd.

      12 Indien het erkende bedrijf de afgekeurde folie vernietigt, wordt daarvan door het erkende bedrijf een rapport
      opgemaakt en bewaard, dat tenminste bevat:

      a. de naam en adres van de betrokken foliefabrikant;

      b. de hoeveelheid en de soort folie, onderverdeeld naar kleur en model;

      c. de datum van levering;

      d. het in achtste lid bedoelde document; en

      e. de reden van afkeuring.

      13 Blanco-kentekenplaten die niet aan de eisen voldoen worden binnen een week na constatering vernietigd. Van de
      vernietiging wordt onmiddellijk een rapport opgemaakt dat in ieder geval de volgende gegevens per kentekenplaat
      bevat:

      a. de lamineercode indien deze is voorgeschreven;

      b. het model en, indien van toepassing, de kleur van de blanco-kentekenplaat, en

      c. de naam en adres van de fabrikant van de folie.

      14 Blanco-kentekenplaten worden uitsluitend afgegeven aan erkende kentekenplaatfabrikanten.

      15 Voorafgaand aan de levering van blanco-kentekenplaten, die voorzien zijn van een lamineercode, meldt het erkende
      bedrijf bij de Dienst Wegverkeer, op door deze dienst te bepalen wijze, ten behoeve van het register, bedoeld in
      [artikel 70b, eerste lid, van de wet][ref5], de volgende gegevens:

      a. de lamineercodes;

      b. de hoeveelheid blanco-kentekenplaten;

      c. het model, en indien van toepassing de kleur, van de blanco-kentekenplaten; en

      d. de kentekenplatenfabrikant aan wie de blanco-kentekenplaten worden geleverd.

      16 Het erkende bedrijf bewaart de volgende bescheiden gedurende een termijn van twee jaar:

      a. de documenten, bedoeld in het achtste lid;

      b. de rapporten, bedoeld in het tiende lid; en

      c. de rapporten, bedoeld in het elfde lid.

      17 Op verzoek van de Dienst Wegverkeer stelt het erkende bedrijf een gedeelte van de door het erkende bedrijf in
      ontvangst genomen folie voor onderzoek ter beschikking aan de Dienst Wegverkeer.

      18 Op verzoek van de Dienst Wegverkeer legt het erkende bedrijf een testrapport over met betrekking tot
      een of meer door de Dienst Wegverkeer aan te wijzen blanco-kentekenplaten van een door de Dienst Wegverkeer
      aangewezen onderzoeksinstelling waaruit blijkt dat de blanco-kentekenplaten voldoen aan de eisen, gesteld in de
      [Regeling kentekens en kentekenplaten][ref6] en de [Regeling eisen goedkeuring kentekenplaten 2000][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0009071
      [ref2]: https://wetten.overheid.nl/BWBR0012172
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel141
      [ref4]: https://wetten.overheid.nl/BWBR0001903#Artikel142
      [ref5]: https://wetten.overheid.nl/BWBR0006622#Artikel70b
      [ref6]: https://wetten.overheid.nl/BWBR0009071
      [ref7]: https://wetten.overheid.nl/BWBR0012172
