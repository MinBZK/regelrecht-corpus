  - number: '102'
    text: |-
      1 Na afloop van elke keuring, als bedoeld in [artikel 99][ref1], wordt het bepaalde in het tweede tot en met zesde
      lid in acht genomen, alvorens de opnamekaart gasinstallatie af te geven aan de aanvrager.

      2 Het voertuig wordt na authenticatie door de LPG-technicus bij de Dienst Wegverkeer afgemeld onder verstrekking
      van de volgende gegevens:

      a. het pasnummer op de bevoegdheidspas van de LPG-technicus;

      b. het kenteken van het voertuig;

      c. de meldcode, gevormd door de laatste vier cijfers van het voertuigidentificatienummer, letters en leestekens
      buiten beschouwing gelaten;

      d. indien het een voertuig betreft dat is voorzien van een kilometerteller, de afgelezen tellerstand;

      e. als de keuring van de gasinstallatie de inbouw van een LPG-installatie betreft:

      1°. het merk en typegoedkeuringsnummer van de LPG-installatie;

      2°. de totale inhoud van de aanwezige LPG-tanks.

      3 Op de opnamekaart gasinstallatie moet schriftelijk worden vermeld:

      a. het bepaalde in het tweede lid, onderdeel a tot en met e;

      b. als het voertuig aan een steekproef wordt onderworpen, het einde van de wachttijd van de steekproef;

      c. de naam, adresgegevens en het keuringsinstantienummer van het erkende bedrijf;

      d. de transactiecode.

      4 Voordat de opnamekaart gasinstallatie wordt ondertekend, wordt door de LPG-technicus nagegaan of de opnamekaart
      gasinstallatie volledig is ingevuld.

      5 De opnamekaart gasinstallatie wordt onverwijld aan de aanvrager afgegeven indien de gasinstallatie niet aan een
      steekproef wordt onderworpen.

      6 Voor de opnamekaart gasinstallatie wordt gebruikt gemaakt van het door de Dienst Wegverkeer vastgestelde model
      opnamekaart gasinstallatie, zoals bekend gemaakt in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0051669#Artikel99
    url: https://wetten.overheid.nl/BWBR0051669/2026-01-01#Artikel102
