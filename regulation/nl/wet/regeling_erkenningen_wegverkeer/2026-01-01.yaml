  - number: '53'
    text: |-
      1 Een erkenning APK kan op aanvraag worden verleend aan een natuurlijk persoon of rechtspersoon voor één of meer in
      Nederland gevestigde keuringsplaatsen.

      2 Een erkenning APK kan worden verleend voor het afgegeven van keuringsrapporten voor:

      a. zware voertuigen;

      b. lichte voertuigen; of

      c. landbouw- en bosbouwtrekkers.

      3 Een erkenning APK kan ook met beperkingen worden verleend, waaronder in ieder geval voor het uitsluitend afgeven
      van keuringsrapporten voor:

      a. motorrijtuigen dan wel aanhangwagens;

      b. motorrijtuigen met een verbrandingsmotor met een elektrische ontsteking;

      c. motorrijtuigen met een verbrandingsmotor met een compressie-ontsteking die wel dan wel niet is voorzien van
      een roetfilter;

      d. motorrijtuigen die wel dan wel niet zijn voorzien van een druklucht-remsysteem;

      e. motorrijtuigen met een beperkte voertuiglengte; of

      f. motorrijtuigen behorende tot het eigen wagenpark.
    url: https://wetten.overheid.nl/BWBR0051669/2026-01-01#Artikel53
  - number: '54'
    text: |-
      1 Als een erkenning wordt of is verleend voor het eigen wagenpark en een andere rechtspersoon of andere
      rechtspersonen in een zodanig verband tot een erkend bedrijf staan dat er sprake is van één economische eenheid,
      kunnen alle voertuigen van de desbetreffende economische eenheid worden beschouwd als voertuigen van het eigen
      wagenpark.

      2 Bij een erkenning, als bedoeld in het eerste lid, doet de exploitant onder opgave van de naam en het adres van
      die rechtspersoon of rechtspersonen, terstond na de verlening van de erkenning schriftelijk opgave hiervan aan de
      Dienst Wegverkeer. Het verband moet bij de Dienst Wegverkeer worden aangetoond door middel van een uittreksel uit
      het register van de Kamer van Koophandel of een accountantsverklaring.
    url: https://wetten.overheid.nl/BWBR0051669/2026-01-01#Artikel54
  - number: '55'
    text: |-
      1 De keuringsruimte is overdekt, behoorlijk af te sluiten, goed verlicht en voorzien van een vlakke vloer en
      verwarming.

      2 De inrichting en afmetingen van de keuringsruimte zijn zodanig dat de voertuigen die behoren tot de groep
      waarvoor de erkenning is verleend, in deze ruimte kunnen worden opgesteld zodat zij van alle zijden goed
      toegankelijk zijn.

      3 Als een keuringsruimte bestemd is voor het keuren van motorrijtuigen met verbrandingsmotor met een elektrische
      ontsteking en motorrijtuigen met een compressie-ontsteking die is voorzien van een roetfilter, is een voorziening
      aanwezig waarmee uitlaatgassen direct door een daartoe bestemde opening naar buiten kunnen worden gevoerd.

      4 Als een keuringsruimte bestemd is voor het keuren van motorrijtuigen met een verbrandingsmotor met compressie-
      ontsteking die niet is voorzien van een roetfilter, is een voorziening aanwezig die bestaat uit:

      a. een afzuigventilator met voldoende capaciteit voor de te keuren voertuigen;

      b. een afvoersysteem dat voorkomt dat uitlaatgassen in de keuringsruimte terecht kunnen komen;

      c. een systeem dat ervoor zorgt dat de uitlaatgassen die door de roetmeter gaan eveneens worden afgevoerd, en

      d. afvoerkanalen die bovenstaande onderdelen met elkaar verbinden waardoor de uitlaatgassen direct naar buiten
      worden afgevoerd.

      5 In afwijking van het vierde lid is in de keuringsruimte die uitsluitend is bestemd voor de keuring van landbouw-
      of bosbouwtrekkers een voorziening aanwezig waarmee uitlaatgassen direct door een daartoe bestemde opening naar
      buiten kunnen worden gevoerd.

      6 In de keuringsruimte kan de administratie van de keuringen behoorlijk worden uitgevoerd.

      7 In de keuringsruimte is een voorziening aanwezig, geschikt voor het raadplegen van het kentekenregister, het
      afmelden van voertuigen en het bewaren van steekproefcontrolerapporten. In de keuringsruimte is een voorziening
      aanwezig, ten behoeve van het afdrukken van keuringsrapporten.

      8 Gezamenlijk gebruik van een keuringsruimte door meerdere erkende bedrijven is niet toegestaan.
    url: https://wetten.overheid.nl/BWBR0051669/2026-01-01#Artikel55
  - number: '56'
    text: |-
      1 In de keuringsruimte is een doelmatige inspectieput of hefinrichting aanwezig. Deze is geschikt voor de groep
      voertuigen waarvoor de erkenning is verleend en is voorzien van een doelmatige verlichting. Wanneer niet duidelijk
      blijkt wat het draagvermogen van een hefinrichting is, wordt hiervoor door de fabrikant of een onafhankelijk
      instituut een verklaring overgelegd. Het erkende bedrijf stelt in dat geval deze verklaring op aanvraag ter
      beschikking aan de Dienst Wegverkeer. Het draagvermogen wordt zichtbaar op de hefinrichting aangebracht.

      2 De inspectieput en de hefinrichting zijn zodanig uitgevoerd dat de APK-keurmeester in staat is de onderkant van
      een voertuig nagenoeg over de hele lengte rechtopstaand te inspecteren. Dit houdt in dat in een keuringsruimte die
      bestemd is voor het keuren van:

      a. zware voertuigen de hefinrichting een hefhoogte heeft van ten minste 1,35 meter en de inspectieput een diepte
      heeft van ten minste 1,35 meter;

      b. lichte voertuigen de hefinrichting een hefhoogte heeft van ten minste 1,65 meter en de inspectieput een diepte
      heeft van ten minste 1,55 meter.

      3 De hefinrichting kan ten minste vier wielen van het voertuig ondersteunen. Een met steunpoten gecombineerde
      hefinrichting voldoet niet aan deze eis.

      4 De hefinrichting is deugdelijk en verkeert in een goede staat van onderhoud.

      5 In afwijking van het eerste lid, hoeft er geen inspectieput of hefinrichting aanwezig te zijn in de
      keuringsruimte die uitsluitend wordt gebruikt voor APK landbouw- en bosbouwtrekkers. Indien in de keuringsruimte
      een inspectieput of hefinrichting aanwezig is, zijn het eerste tot en met vierde lid van toepassing.
    url: https://wetten.overheid.nl/BWBR0051669/2026-01-01#Artikel56
  - number: '57'
    text: |-
      1 In de keuringsruimte die bestemd is voor het keuren van motorrijtuigen is een aangewezen plaats aanwezig ten
      behoeve van de controle van de afstelling van dimlichten en mistvoorlichten. Deze aangewezen plaats is duidelijk
      gemarkeerd in de keuringsruimte en is voorzien van:

      a. een horizontale vlakke vloer van voldoende afmetingen waarop gelijktijdig zowel het te keuren voertuig als het
      koplamptestapparaat kan worden geplaatst;

      b. een horizontaal geplaatste hefinrichting waarop gelijktijdig het koplamptestapparaat en het te keuren voertuig
      kan worden geplaatst; of

      c. een horizontaal geplaatste hefinrichting waarop het te keuren voertuig kan worden geplaatst met voor de
      hefinrichting een horizontale vlakke vloer of rails. De vloer of de rails bevinden zich in hetzelfde horizontale
      vlak als de hefinrichting. De rails bevinden zich haaks op de rijplaten van de hefinrichting.

      2 Als het koplamptestapparaat is ontworpen voor uitsluitend gebruik op rails moeten deze rails aanwezig zijn en
      zich in hetzelfde horizontale vlak als de vloer of hefinrichting bevinden.

      3 De keuringsruimte voor de keuring van landbouw- of bosbouwtrekkers is geschikt voor de controle van de afstelling
      van de dimlichten, bedoeld in [artikel 113 van bijlage VIII bij de Regeling voertuigen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025798
    url: https://wetten.overheid.nl/BWBR0051669/2026-01-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0025798
  - number: '58'
    text: |-
      In de keuringsruimte is de volgende apparatuur aanwezig:

      a. een doelmatige krik die voldoende draagvermogen heeft om van de voertuigen van de groep waarvoor de erkenning is
      verleend, de wielen van de voorste as gelijktijdig en de wielen van de achterste as afzonderlijk op zodanige wijze
      te kunnen heffen, dat deze vrij kunnen draaien;

      b. een dubbel geïsoleerde veiligheidslooplamp dan wel een zaklantaarn, al dan niet voorzien van een oplaadbare
      accu, die enerzijds een zodanige lichtsterkte heeft dat ook moeilijk bereikbare onderdelen van een voertuig
      voldoende helder kunnen worden verlicht om een nauwkeurige inspectie van een voertuig mogelijk te maken en die
      anderzijds zodanig is afgeschermd dat degene die de keuring uitvoert niet door het uitgestraalde licht wordt
      verblind;

      c. een meetband met een minimale nauwkeurigheidsklasse III van:

      i. ten minste 12,00 meter voor het afgeven van keuringsbewijzen voor lichte voertuigen;

      ii ten minste 20,00 meter voor het afgeven van keuringsbewijzen voor zware voertuigen of landbouw- of
      bosbouwtrekkers.

      Als een erkend bedrijf uitsluitend keuringsbewijzen afgeeft voor voertuigen met een beperkte lengte, heeft de
      meetband tenminste dezelfde lengte als de toegestane voertuiglengte;

      d. een doelmatige schuifmaat die is voorzien van een meetstift voor dieptemeting;

      e. basisgereedschap voor de controle op het vastzitten van nagels en bouten en andere verbindingen, te weten
      een set steek- en ringsleutels, schroevendraaiers en een hamer, alsmede een bolkophamertje voor de controle op
      corrosie;

      f. een doelmatige bandenspanningsmeter en een doelmatige bandenpomp;

      g. hulpmiddelen om speling in voertuigonderdelen zichtbaar te maken, zoals een bandijzer, wielbewegingsapparaat of
      een koevoet;

      h. een rollenremtestbank of platenremtestbank, die voldoet aan de in [artikel 64][ref1] gestelde eisen. Voor APK
      landbouw- en bosbouwtrekkers is een rollenrembanktest of een zelfregistrerende remvertragingsmeter aanwezig. Voor
      APK zware voertuigen is in elk geval een rollenremtestbank aanwezig. Het draagvermogen van een rollenremtestbank of
      platenremtestbank is voldoende voor de groep voertuigen waarvoor de erkenning wordt of is verleend;

      i. een doelmatige bandenprofieldieptemeter, met verende meetstift en een meetnauwkeurigheid van 0,1 mm.


      [ref1]: https://wetten.overheid.nl/BWBR0051669#Artikel64
    url: https://wetten.overheid.nl/BWBR0051669/2026-01-01#Artikel58
