  - number: '116'
    text: |-
      1 De exameninstantie is belast met het:

      a. afnemen van de examens, bedoeld in [artikel 109][ref1];

      b. afgeven van een diploma als bedoeld, in [artikel 108, eerste lid, onderdelen a tot en met c, en derde lid][ref2];

      c. afnemen van een toets als bedoeld in [artikel 110, eerste en tweede lid][ref3], en het afgeven van een afschrift
      van het resultaat van deze toets;

      d. afnemen van een toets, als bedoeld in [artikel 113, tweede lid][ref4], en het afgeven van een afschrift van het
      resultaat van deze toets;

      e. na goedkeuring door de Dienst Wegverkeer vaststellen van een reglement, als bedoeld in de
      [artikelen 109, derde lid][ref5], en [110, derde lid][ref6];

      f. vaststellen van de tarieven voor de voornoemde taken.

      2 De exameninstantie is verder met betrekking tot het afnemen van de examens, bedoeld in [artikel 109][ref7] en de
      toetsen, bedoeld in [artikel 110][ref8], belast met het:

      a. geven van voorlichting en bekendheid aan het examen;

      b. vaststellen van de examendatum, het tijdstip en de plaats;

      c. toezenden van de uitnodiging voor de deelname aan het examen;

      d. factureren van de tarieven, bedoeld in het eerste lid, onderdeel e, aan een deelnemer; en

      e. registreren van individuele en algemene resultaten van de examens;

      f. behandelen van bezwaar tegen de uitslag van een examen of toets.


      [ref1]: https://wetten.overheid.nl/BWBR0051669#Artikel109
