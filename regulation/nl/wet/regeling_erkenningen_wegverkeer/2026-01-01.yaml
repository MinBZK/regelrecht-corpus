  - number: '97'
    text: |-
      Aan de verplichting als bedoeld in [artikel 23k van het Besluit voertuigen][ref1], wordt gevolg gegeven door de
      tellerstand van een motorrijtuig te verstrekken aan de Dienst Wegverkeer zoals voorgeschreven in [artikel 6][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0025554#Artikel23k
      [ref2]: https://wetten.overheid.nl/BWBR0051669#Artikel6
