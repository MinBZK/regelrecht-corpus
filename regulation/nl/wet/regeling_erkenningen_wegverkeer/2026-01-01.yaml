        artikel: 70b
  - number: '49'
    text: |-
      1 Het erkende bedrijf mag kentekenplaten, niet zijnde blanco-kentekenplaten, volgens de modellen 1.1 tot en
      met 18.2E, 27.11, 27.12, 27.14, 27.30A tot en met 27.31E en kentekenplaten met de tekens van de modellen C1,
      indien uitgevoerd in kunststof, C2 en C3 van de [bijlage bij de Regeling kentekens en kentekenplaten](onbekend),
      uitsluitend doorleveren aan een ander erkende bedrijf kentekenplaatfabrikant.

      2 Kentekenplaten zijn bij doorlevering, indien van toepassing, reeds voorzien van een duplicaatcode. Zij zijn niet
      voorzien van een merk als bedoeld in [artikel 5, eerste lid, van de Regeling kentekens en kentekenplaten][ref1].

      3 Bij doorlevering als bedoeld in het eerste lid zijn de [artikelen 43, tweede, derde en vijfde lid][ref2],
      [44][ref3], [45, eerste lid][ref4], [46][ref5], en [47][ref6] van overeenkomstige toepassing.

      4 Het erkende bedrijf meldt voorafgaand aan de doorlevering van kentekenplaten die voorzien behoren te zijn van een
      lamineercode, aan de Dienst Wegverkeer, ten behoeve van het register, bedoeld in [artikel 70b van de wet][ref7], de
      volgende gegevens:

      a. de betrokken kentekens en, indien aanwezig, de duplicaatcodes;

      b. de lamineercodes;

      c. de hoeveelheid kentekenplaten;

      d. de reden voor doorlevering;

      e. de kentekenplaatfabrikant aan wie de kentekenplaten worden doorgeleverd.

      5 Het erkende bedrijf levert geen kentekenplaten door aan een ander erkend bedrijf, indien de Dienst Wegverkeer
      meldt dat er geen kentekenplaten mogen worden geleverd.


