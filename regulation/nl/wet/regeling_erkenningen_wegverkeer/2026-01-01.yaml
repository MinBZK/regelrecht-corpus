        artikel: 2:40
  - number: '10'
    text: |-
      1 Voertuigen die bestemd zijn voor demontage betreffen bromfietsen die gedurende een periode van ten hoogste vier
      aaneengesloten weken worden of zijn opgenomen in de bedrijfsvoorraad.

      2 Voor voertuigen die in de bedrijfsvoorraad worden opgenomen geldt voor de kentekenplaten het volgende:

      a. het erkende bedrijf neemt bij de opname van een voertuig in zijn bedrijfsvoorraad de bijbehorende kentekenplaten
      in ontvangst en bewaart ze bij het voertuig zolang dit voertuig in de bedrijfsvoorraad is opgenomen;

      b. wanneer het een voertuig betreft met één of meerdere ontbrekende kentekenplaten waarvoor de Dienst
      Wegverkeer heeft bepaald dat met het voertuig niet op de weg mag worden gereden met betrekking tot de
      [artikel 51a, derde lid, onderdeel d, van de wet][ref1] bedoelde eis, geldt de inname- en bewaarplicht alleen voor
      de bij het voertuig aanwezige kentekenplaten. Het erkende bedrijf voorziet het voertuig alsnog van de benodigde
      kentekenplaten wanneer het verbod voor rijden op de weg wordt opgeheven of wanneer het voertuig ophoudt te behoren
      tot de bedrijfsvoorraad van het erkende bedrijf, behalve wanneer het voertuig in de bedrijfsvoorraad van een ander
      erkend bedrijf wordt opgenomen;

      c. voor zover het een voertuig betreft dat werd gebruikt voor taxivervoer met kentekenplaten met
      een lichtblauwe achtergrond, dienen deze kentekenplaten omgewisseld te worden voor kentekenplaten
      met een gele achtergrond of kentekenplaten met een donkerblauwe achtergrond, als bedoeld in
      [artikel 3 van de Regeling kentekens en kentekenplaten][ref2] als het voertuig ophoudt te behoren tot de
      bedrijfsvoorraad van het erkende bedrijf;

      d. voor zover het een voertuig betreft dat direct na inschrijving in de bedrijfsvoorraad is opgenomen, voorziet het
      erkende bedrijf het voertuig binnen drie werkdagen na opname in bedrijfsvoorraad van de bij het voertuig behorende
      kentekenplaten, of eerder als het voertuig ophoudt te behoren tot de bedrijfsvoorraad van het erkende bedrijf.

      3 De erkenning geldt uitsluitend voor de vestigingen die in de erkenning worden vermeld.

      4 Het erkende bedrijf draagt er zorg voor dat met voertuigen die nog niet zijn ingeschreven of niet zijn
      tenaamgesteld in het kentekenregister, alsmede met voertuigen die in de bedrijfsvoorraad van het erkende bedrijf
      zijn opgenomen, geen gebruik wordt gemaakt van de weg zonder dat zij zijn voorzien van een aan het bedrijf
      opgegeven handelaarskenteken.

      5 Voertuigen kunnen uitsluitend in de bedrijfsvoorraad zijn opgenomen zolang de erkenning bedrijfsvoorraad niet
      is ingetrokken voor onbepaalde tijd. Ingeval de erkenning bedrijfsvoorraad voor onbepaalde tijd wordt ingetrokken,
      houden de voertuigen binnen een door de Dienst Wegverkeer te bepalen termijn op te behoren tot de bedrijfsvoorraad.

      6 Het erkende bedrijf zorgt ervoor dat de voertuigen in zijn importeursvoorraad bij overdracht worden
      tenaamgesteld, tenzij de overdracht op een door de Dienst Wegverkeer te bepalen wijze aan een erkend bedrijf
      bedrijfsvoorraad plaatsvindt zonder dat het voertuig wordt tenaamgesteld.

      7 Het erkende bedrijf zorgt ervoor dat de voertuigen die in zijn bedrijfsvoorraad staan bij verkoop, lease of
      verhuur ophouden te behoren tot de bedrijfsvoorraad.

      8 Aan de verplichting als bedoeld in [artikel 23k van het Besluit voertuigen][ref3], wordt gevolg gegeven door de
      tellerstand van een motorrijtuig te verstrekken aan de Dienst Wegverkeer zoals voorgeschreven in [artikel 6][ref4].


