  - number: '104'
    text: |-
      1 De Dienst Wegverkeer kan in het kader van het toezicht op een erkend bedrijf een systeem van bonus- en
      strafpunten vaststellen, dat wordt bekendgemaakt in de Staatscourant.

      2 Als een systeem als bedoeld in het eerste lid is vastgesteld, wordt aan de hand daarvan, afhankelijk van de
      resultaten van het uitgeoefende toezicht, beoordeeld of het toezicht wordt verminderd of verscherpt dan wel of een
      erkenning wordt gewijzigd of ingetrokken.

      3 Indien als gevolg van een wijziging, als bedoeld in [artikel 4][ref1], de bedrijfsvoering van de natuurlijke
      persoon, de rechtspersoon of de rechtsvorm waaraan een erkenning gasinstallaties is verleend, wordt voortgezet
      door een andere natuurlijke persoon of rechtspersoon, worden de toegekende bonus- en strafpunten en de opgelegde
      sancties beschouwd als te zijn toegekend aan deze natuurlijke persoon of rechtspersoon.


      [ref1]: https://wetten.overheid.nl/BWBR0051669#Artikel4
    url: https://wetten.overheid.nl/BWBR0051669/2026-01-01#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0051669
        artikel: '4'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '105'
    text: |-
      Een erkenning voorbehoud en verplichtingen kan op aanvraag worden verleend aan een natuurlijke persoon of een
      rechtspersoon die zich volgens het handelsregister richt op lease of financiering van voertuigen.
    url: https://wetten.overheid.nl/BWBR0051669/2026-01-01#Artikel105
  - number: '106'
    text: |-
      1 Een erkend bedrijf vraagt de Dienst Wegverkeer onmiddellijk de aantekeningen als bedoeld in
      [artikel 17, eerste lid, van het besluit][ref1], door te halen wanneer de instemming, bedoeld in artikel 17, eerste
      lid, van het besluit is komen te vervallen en maakt, in geval het gaat om een aantekening als bedoeld in artikel
      17, eerste lid, onderdeel b, van het besluit, de tenaamstellingscode onmiddellijk kenbaar aan de kentekenhouder.

      2 Wanneer het erkende bedrijf namens een rechtspersoon het erkende bedrijf tenaamstellen bedrijfsvoorraad
      of importeursvoorraad heeft verzocht de aanvraag voor de tenaamstelling in te dienen, blijkt uit een daartoe
      strekkende bepaling in de lease- of financieringsovereenkomst dat de rechtspersoon toestemming heeft gegeven om het
      voertuig op naam te krijgen.


      [ref1]: https://wetten.overheid.nl/BWBR0051671#Artikel17
    url: https://wetten.overheid.nl/BWBR0051669/2026-01-01#Artikel106
    references:
      - id: ref1
        bwb_id: BWBR0051671
        artikel: '17'
  - number: '107'
    text: |-
      Een erkend bedrijf kan een tijdelijk document aanvragen voor de voertuigen die het op naam
      heeft, of voertuigen die het in eigendom heeft waarover een aantekening als bedoeld in
      [artikel 17, eerste lid, onderdeel b, van het besluit][ref1], in het kentekenregister is opgenomen. Zolang deze
      aantekening in het kentekenregister is opgenomen, wordt het tijdelijk document enkel gezonden aan het erkende
      bedrijf.


      [ref1]: https://wetten.overheid.nl/BWBR0051671#Artikel17
    url: https://wetten.overheid.nl/BWBR0051669/2026-01-01#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0051671
        artikel: '17'
  - number: '108'
    text: |-
      1 Een bevoegdheid APK-keurmeester kan op aanvraag worden verleend aan een natuurlijk persoon die in het bezit is
      van een:

      a. diploma keurmeester periodieke keuring zware (bedrijfs)voertuigen;

      b. diploma keurmeester periodieke keuring lichte voertuigen; of

      c. diploma keurmeester landbouw- en bosbouwtrekkers.

      2 Een bevoegdheid APK-keurmeester wordt uitsluitend verleend voor het afgeven van keuringsrapporten voor de groep
      motorrijtuigen en aanhangwagens waarvoor een natuurlijk persoon een diploma, als bedoeld in het eerste lid, bezit.

      3 Een bevoegdheid LPG-technicus kan worden verleend aan een natuurlijk persoon die in het bezit is van een diploma
      LPG-technicus.

      4 Een bevoegdheid APK-keurmeester is twee jaar geldig en kan telkens met twee  jaar worden verlengd. Een
      bevoegdheid LPG-technicus is vier jaar geldig en kan telkens met vier jaar worden verlengd.
    url: https://wetten.overheid.nl/BWBR0051669/2026-01-01#Artikel108
  - number: '109'
    text: |-
      1 Een diploma als bedoeld in [artikel 108, eerste lid, onderdelen a tot en met c][ref1], en een diploma als bedoeld
      in artikel 108, derde lid, wordt verleend na het met goed gevolg afleggen van het examen voor het betreffende
      diploma.

      2 De Dienst Wegverkeer bepaalt aan welke voorwaarden is voldaan voordat kan worden deelgenomen aan een examen. Deze
      voorwaarden worden in de Staatscourant bekendgemaakt.

      3 Een examen wordt afgenomen overeenkomstig een reglement als bedoeld in [artikel 116, eerste lid, onder e][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0051669#Artikel108
      [ref2]: https://wetten.overheid.nl/BWBR0051669#Artikel116
    url: https://wetten.overheid.nl/BWBR0051669/2026-01-01#Artikel109
    references:
      - id: ref1
        bwb_id: BWBR0051669
        artikel: '108'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref2
        bwb_id: BWBR0051669
        artikel: '116'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: '110'
    text: |-
      1 Een natuurlijk persoon aan wie een bevoegdheid APK-keurmeester is verleend, legt iedere twee jaar een toets af
      voor de verlenging van de bevoegdheid APK-keurmeester.

      2 Een natuurlijk persoon aan wie een bevoegdheid LPG-technicus is verleend, legt iedere vier jaar een toets af voor
      de verlenging van de bevoegdheid LPG-technicus.

      3 Een toets, als bedoeld in het eerste en tweede lid, wordt afgenomen overeenkomstig een reglement als bedoeld in
      [artikel 116, eerste lid, onder e][ref1].

      4 Afhankelijk van het resultaat van een toets als bedoeld in het eerste lid wordt de bevoegdheid APK-keurmeester
      verlengd met de termijn, genoemd in [artikel 108, vierde lid][ref2], dan wel niet verlengd. Afhankelijk van het
      resultaat van een toets als bedoeld in het tweede lid, wordt de bevoegdheid LPG-technicus verlengd voor de termijn,
      genoemd in artikel 108, vierde lid, dan wel niet verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0051669#Artikel116
      [ref2]: https://wetten.overheid.nl/BWBR0051669#Artikel108
    url: https://wetten.overheid.nl/BWBR0051669/2026-01-01#Artikel110
    references:
