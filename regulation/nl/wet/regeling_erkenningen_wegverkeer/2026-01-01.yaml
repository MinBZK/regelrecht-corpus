  - number: '18'
    text: |-
      1 Een erkenning inschrijven met onderzoek kan op aanvraag worden verleend aan een natuurlijke persoon of
      rechtspersoon, die volgens het handelsregister exploitant is van een onderneming waar bedrijfsmatig aanvragen voor
      de inschrijving van voertuigen worden ingediend.

      2 De aanvrager van de erkenning beschikt over een of meer terreinen niet zijnde een weg waarop de niet ingeschreven
      voertuigen en ingeschreven voertuigen tot het moment van overdracht na inschrijving worden gestald.
    url: https://wetten.overheid.nl/BWBR0051669/2026-01-01#Artikel18
  - number: '19'
    text: |-
      1 Het erkende bedrijf beschikt over een goed afsluitbare voorziening, welke naar het oordeel van de Dienst
      Wegverkeer voldoende bescherming tegen inbraak, diefstal en brand biedt, waarin de op de erkenning betrekking
      hebbende bescheiden en documenten moeten worden bewaard.

      2 Het erkende bedrijf zorgt ervoor dat de voertuigen in zijn importeursvoorraad bij overdracht worden
      tenaamgesteld, tenzij de overdracht plaatsvindt op een door de Dienst Wegverkeer te bepalen wijze aan een erkend
      bedrijf bedrijfsvoorraad.

      3 Alvorens tot het indienen van de aanvraag tot inschrijving wordt overgegaan, stelt het erkende bedrijf vast
      dat de gegevens op het originele volledige buitenlandse kentekenbewijs overeenkomen met het voertuig waarvoor de
      inschrijving wordt aangevraagd.

      4 Het erkende bedrijf:

      a. vraagt alleen een inschrijving aan voor door de Dienst Wegverkeer te bepalen voertuigsoorten;

      b. verstrekt de door de Dienst Wegverkeer te bepalen gegevens en aanvullende informatie met betrekking tot het
      voertuig waarvoor een inschrijving wordt aangevraagd;

      c. stuurt op verzoek van de Dienst Wegverkeer op een door de Dienst Wegverkeer te bepalen wijze en binnen een door
      de Dienst Wegverkeer vastgestelde termijn na inschrijving het buitenlands kentekenbewijs naar de Dienst Wegverkeer;

      d. bewaart het originele buitenlandse kentekenbewijs in de afsluitbare voorziening tot het moment waarop de
      documenten aan de Dienst Wegverkeer worden gestuurd.

      5 De erkenning geldt uitsluitend voor de vestigingen die in de erkenning worden vermeld.

      6 Het erkende bedrijf draagt er zorg voor dat er met de voertuigen in zijn importeursvoorraad, bedoeld in
      [artikel 18, tweede lid][ref1], geen gebruik wordt gemaakt van de weg zonder dat zij zijn voorzien van een aan het
      bedrijf afgegeven handelaarskenteken.


      [ref1]: https://wetten.overheid.nl/BWBR0051669#Artikel18
