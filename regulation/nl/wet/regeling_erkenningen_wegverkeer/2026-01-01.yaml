  - number: '24'
    text: |-
      1 Het erkende bedrijf meldt slechts voertuigen aan die voor demontage bestemd zijn. Het erkende bedrijf is
      verantwoordelijk voor de demontage.

      2 De erkenning geldt voor de vestigingen die in de erkenning worden vermeld.

      3 Het erkende bedrijf vernietigt de aanwezige kentekenplaten behorende bij het voor demontage afgemelde voertuig
      bij aankomst op het terrein van het erkende bedrijf, maar uiterlijk binnen vijf werkdagen na de melding.

      4 Het erkende bedrijf registreert bij de melding dat een voertuig voorgoed buiten gebruik is gesteld tevens hoeveel
      kentekenplaten hij heeft vernietigd.

      5 Het erkende bedrijf draagt er zorg voor dat de voertuigen die afgemeld zijn voor demontage geen gebruik maken van
      de weg.
    url: https://wetten.overheid.nl/BWBR0051669/2026-01-01#Artikel24
  - number: '25'
    text: |-
      Een erkenning export kan op aanvraag worden verleend aan een natuurlijke persoon of rechtspersoon, die exploitant
      is van een onderneming waar volgens het handelsregister bedrijfsmatig activiteiten worden verricht met betrekking
      tot het exporteren van tenaamgestelde voertuigen of daaraan gerelateerde handelingen ten behoeve van export,
      waardoor deze gerechtigd is aan de Dienst Wegverkeer te melden dat een voertuig dat in het kentekenregister is
      geregistreerd, voorgoed buiten Nederland wordt gebracht.
    url: https://wetten.overheid.nl/BWBR0051669/2026-01-01#Artikel25
  - number: '26'
    text: |-
      1 De erkenning geldt voor de vestigingen die in de erkenning worden vermeld.

      2 Het erkende bedrijf beschikt op zijn vestiging, bedoeld in het eerste lid over een goed afsluitbare voorziening,
      welke naar het oordeel van de Dienst Wegverkeer voldoende bescherming tegen inbraak, diefstal en brand biedt,
      waarin de op de erkenning betrekking hebbende bescheiden en documenten kunnen worden opgeborgen.

      3 In geval van diefstal van op de erkenning betrekking hebbende bescheiden en documenten doet het erkende bedrijf
      daarvan aangifte bij een van de in [artikel 141][ref1] en [142 van het Wetboek van Strafvordering][ref2] bedoelde
      personen.

      4 Het erkende bedrijf bewaart de blanco kentekenbewijzen deel II van de voor export afgemelde voertuigen in de
      voorziening, bedoeld in het tweede lid.

      5 Bij de melding dat het voertuig voorgoed buiten Nederland wordt gebracht, dient het erkende bedrijf in door de
      Dienst Wegverkeer bepaalde gevallen de lamineercodes van de kentekenplaten van het voertuig op te geven.

      6 Het erkende bedrijf neemt voorafgaand aan de melding voor export de kentekenplaten in van het voertuig en maakt
      de ingenomen kentekenplaten onbruikbaar door deze op zodanige wijze doormidden te knippen dat de lamineercode goed
      leesbaar blijft.

      7 Het erkende bedrijf bewaart de twee helften van de ingenomen kentekenplaten waarop de laatste tien meldingen voor
      het voorgoed buiten Nederland brengen van een voertuig betrekking hebben.

      8 Als de kentekenplaten of een deel van de kentekenplaten als gevolg van diefstal niet aanwezig zijn bij het
      voertuig:

      a. zijn het vijfde tot en met zevende lid niet van toepassing;

      b. legt de aanvrager een afschrift van het proces-verbaal over waaruit blijkt dat de kentekenplaten van het
      voertuig gestolen zijn; en

      c. bewaart het erkende bedrijf het afschrift, bedoeld in onderdeel b, gedurende een termijn van minimaal één jaar
      maar maximaal twee jaar in de voorziening, bedoeld in het tweede lid.

      9 Als één of meerdere kentekenplaten niet aanwezig zijn bij een voertuig waarvoor de Dienst
      Wegverkeer heeft bepaald dat hiermee niet op de weg mag worden gereden met betrekking tot de in
      [artikel 51a, derde lid, onderdeel d, van de wet][ref3] bedoelde eis, zijn het derde tot en met vijfde lid niet van
      toepassing voor de kentekenplaten die niet meer aanwezig zijn.

      10 In geval van vermissing of diefstal van blanco kentekendelen II doet het erkende bedrijf, onder opgave van de
      nummers, daarvan onmiddellijk mededeling aan de Dienst Wegverkeer.

      11 Het erkende bedrijf stuurt een digitale kopie van het verkeerd geprinte kentekenbewijs deel II aan de Dienst
      Wegverkeer en vernietigt het verkeerd geprinte kentekenbewijs deel II daarna onmiddellijk.

      12 Bij beëindiging van de erkenning stuurt het erkende bedrijf de blanco kentekenbewijzen delen II binnen een
      termijn van een week terug aan de Dienst Wegverkeer.

      13 Aan een op grond van [artikel 23k van het Besluit voertuigen][ref4] bestaande verplichting wordt gevolg
      gegeven door de tellerstand van een motorrijtuig te verstrekken aan de Dienst Wegverkeer zoals voorgeschreven in
      [artikel 6][ref5].

      14 Het erkende bedrijf handelt conform de [Regeling tenaamstelling en kentekenbewijzen][ref6].

      15 De uitoefening van de erkenning heeft slechts plaats vanaf het adres van de vestiging waaraan de erkenning is
      toegekend.


