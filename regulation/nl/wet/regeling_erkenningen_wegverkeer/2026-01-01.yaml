  - number: '16'
    text: |-
      1 Een erkenning inschrijven zonder onderzoek kan op aanvraag worden verleend aan een natuurlijke persoon of
      rechtspersoon, die volgens het handelsregister exploitant is van een onderneming die bedrijfsmatig nieuwe en
      ongebruikte voertuigen fabriceert of invoert.

      2 Het erkende bedrijf beschikt over een of meer terreinen, niet zijnde een weg, waarop de ingeschreven en niet
      ingeschreven voertuigen kunnen worden gestald.
    url: https://wetten.overheid.nl/BWBR0051669/2026-01-01#Artikel16
  - number: '17'
    text: |-
      1 Het erkende bedrijf is, voor zover van toepassing op de voertuigen of de categorie voertuigen waarvoor
      inschrijving wordt gevraagd, in het bezit van:

      a. de toestemming, bedoeld in
      [artikel 8 van de Wet op de belasting van personenauto’s en motorrijwielen 1992][ref1];

      b. een algemeen verbindend verklaarde overeenkomst ten behoeve van de afdracht van de door het bedrijf
      verschuldigde afvalbeheerbijdrage voor autowrakken, bedoeld in [artikel 49, eerste lid, onder c, van de wet][ref2],
      dan wel een instemming als bedoeld in [artikel 13, eerste lid, van het Besluit beheer autowrakken][ref3].

      2 Het erkende bedrijf zorgt ervoor dat de voertuigen in zijn importeursvoorraad bij overdracht worden
      tenaamgesteld, tenzij de overdracht op een door de Dienst Wegverkeer te bepalen wijze aan een erkend bedrijf
      bedrijfsvoorraad plaatsvindt.

      3 Het erkende bedrijf vraagt alleen inschrijving van voertuigen aan die:

      a. nog niet eerder in gebruik zijn genomen;

      b. conform zijn aan een type met een geldige nationale dan wel Europese typegoedkeuring als bedoeld in
      [artikel 21, tweede lid, van de wet][ref4] en waarbij alle certificaten van overeenstemming aanwezig zijn; en

      c. die volledig afgebouwd zijn conform het certificaat van overeenstemming.

      4 Het erkende bedrijf draagt zorg voor een correcte afdracht van de verschuldigde belasting van personenauto’s
      en motorrijwielen;

      5 Het erkende bedrijf voldoet de verschuldigde afvalbeheerbijdrage voor autowrakken, bedoeld in
      [artikel 49, eerste lid, onder c, van de wet][ref5], dan wel neemt maatregelen waarop de instemming, bedoeld in
      [artikel 13, eerste lid, van het Besluit beheer autowrakken][ref6] van toepassing is;

      6 Het erkende bedrijf verstrekt de door de Dienst Wegverkeer te bepalen voertuiggegevens die overeen dienen te
      komen met het voertuig en de voertuiggegevens op het certificaat van overeenstemming.

      7 Het erkende bedrijf toont op verzoek van de Dienst Wegverkeer binnen een door de Dienst Wegverkeer te bepalen
      termijn de voertuigen waarvoor inschrijving is aangevraagd, alsmede de daarbij behorende certificaten van
      overeenstemming indien deze niet op grond van artikel 36 en 37 van [Verordening (EU) nr. 2018/858](32018R0858)
      reeds digitaal zijn aangeleverd aan de Dienst Wegverkeer.

      8 De erkenning geldt uitsluitend voor de vestigingen die in de erkenning worden vermeld.

      9 Het erkende bedrijf draagt er zorg voor dat met voertuigen die nog niet zijn ingeschreven in het
      kentekenregister, alsmede met voertuigen die in de importeursvoorraad van het erkende bedrijf zijn opgenomen, geen
      gebruik wordt gemaakt van de weg zonder dat zij zijn voorzien van een aan het bedrijf afgegeven handelaarskenteken.

      10 Het erkende bedrijf verstrekt de door de Dienst Wegverkeer te bepalen gegevens en aanvullende informatie met
      betrekking tot het voertuig waarvoor een inschrijving wordt aangevraagd.

      11 Het erkende bedrijf stuurt op verzoek van de Dienst Wegverkeer op een door de Dienst Wegverkeer te bepalen wijze
      na inschrijving het certificaat van overeenstemming naar de Dienst Wegverkeer.


