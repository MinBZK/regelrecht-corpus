---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: regeling_inburgering_oudkomers_g30_2006
regulatory_layer: WET
publication_date: '2018-12-13'
valid_from: '2006-10-18'
bwb_id: BWBR0019824
url: https://wetten.overheid.nl/BWBR0019824/2006-10-18
preamble:
  text: |-
    Handelende in overeenstemming met de Minister voor Bestuurlijke Vernieuwing en Koninkrijksrelaties;

    Gelet op de artikelen 6, tweede lid, en 14 van het Besluit brede doeluitkering sociaal, integratie en veiligheid;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0019824/2006-10-18#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze regeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0019824/2006-10-18#Artikel1
  - number: 1.a
    text: 'Minister: de Minister voor Vreemdelingenzaken en Integratie;'
    url: https://wetten.overheid.nl/BWBR0019824/2006-10-18#Artikel1
  - number: 1.b
    text: |-
      Besluit: het [Besluit brede doeluitkering sociaal, integratie en veiligheid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018238
    url: https://wetten.overheid.nl/BWBR0019824/2006-10-18#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0018238
  - number: 1.c
    text: |-
      Uitvoeringsregeling: de [Uitvoeringsregeling brede doeluitkering sociaal, integratie en veiligheid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018516
    url: https://wetten.overheid.nl/BWBR0019824/2006-10-18#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0018516
  - number: 1.d
    text: |-
      gemeente: een gemeente als bedoeld in [artikel 1, aanhef en onder b, van het Besluit][ref1], behoudens de gemeente
      Sittard-Geleen;


      [ref1]: https://wetten.overheid.nl/BWBR0018238#Artikel1
    url: https://wetten.overheid.nl/BWBR0019824/2006-10-18#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0018238
        artikel: '1'
  - number: 1.e
    text: |-
      college: het college van burgemeester en wethouders van een gemeente, als bedoeld in
      [artikel 1, onderdeel d][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0019824#Artikel1
    url: https://wetten.overheid.nl/BWBR0019824/2006-10-18#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0019824
        artikel: '1'
        hoofdstuk: '1'
  - number: 1.f
    text: |-
      oudkomer: een oudkomer als bedoeld in [artikel 1, aanhef en onder i, van het Besluit][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018238#Artikel1
    url: https://wetten.overheid.nl/BWBR0019824/2006-10-18#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0018238
        artikel: '1'
  - number: 1.g
    text: |-
      inburgeringsprogramma: een inburgeringsprogramma als bedoeld in
      [artikel 1, aanhef en onder j, van het Besluit][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018238#Artikel1
    url: https://wetten.overheid.nl/BWBR0019824/2006-10-18#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0018238
        artikel: '1'
  - number: 1.h
    text: |-
      prognose: het aantal oudkomers dat naar de verwachting van het college in de periode van 1 januari tot en met 30
      juni 2006 zal aanvangen met een inburgeringsprogramma.
    url: https://wetten.overheid.nl/BWBR0019824/2006-10-18#Artikel1
  - number: '2'
    text: |-
      Het college verstrekt binnen zes weken na inwerkingtreding van deze regeling aan de Minister een prognose conform
      het in [bijlage 2][ref1] opgenomen model indien een gemeente in aanmerking wenst te komen voor verlening van een
      aandeel in de middelen voor de inburgering van oudkomers als bedoeld in [artikel 10 van het Besluit][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0019824
      [ref2]: https://wetten.overheid.nl/BWBR0018238#Artikel10
    url: https://wetten.overheid.nl/BWBR0019824/2006-10-18#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0019824
      - id: ref2
        bwb_id: BWBR0018238
        artikel: '10'
  - number: '3.1'
    text: |-
      De Minister beoordeelt alle door de gemeenten ingediende prognoses gezamenlijk en stelt de factor T als bedoeld in
      [artikel 15b, eerste lid, van de Uitvoeringsregeling][ref1] vast aan de hand van de formule T = S x 2.


      [ref1]: https://wetten.overheid.nl/BWBR0018516#Artikel15b
    url: https://wetten.overheid.nl/BWBR0019824/2006-10-18#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0018516
        artikel: 15b
  - number: '3.2'
    text: 'De hoogte van de factor S wordt per gemeente met inachtneming van de ingediende prognose als volgt vastgesteld:'
    url: https://wetten.overheid.nl/BWBR0019824/2006-10-18#Artikel3
  - number: 3.2.a
    text: |-
      indien de prognose overeenkomt met het aantal oudkomers als genoemd in de vierde kolom van [bijlage 1][ref1], is de
      factor S het in de vierde kolom genoemde getal;


      [ref1]: https://wetten.overheid.nl/BWBR0019824
    url: https://wetten.overheid.nl/BWBR0019824/2006-10-18#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0019824
  - number: 3.2.b
    text: |-
      indien de prognose lager is dan het in de vierde kolom van [bijlage 1][ref1] genoemde aantal oudkomers, wordt de
      hoogte van de factor S dienovereenkomstig verlaagd;


      [ref1]: https://wetten.overheid.nl/BWBR0019824
    url: https://wetten.overheid.nl/BWBR0019824/2006-10-18#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0019824
  - number: 3.2.c
    text: |-
      indien de prognose hoger is dan het in de vierde kolom van [bijlage 1][ref1] genoemde aantal oudkomers, wordt de
      hoogte van de factor S:


      [ref1]: https://wetten.overheid.nl/BWBR0019824
    url: https://wetten.overheid.nl/BWBR0019824/2006-10-18#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0019824
  - number: 3.2.c.1°
    text: in het geval het beschikbare budget toereikend is, naar evenredigheid verhoogd;
    url: https://wetten.overheid.nl/BWBR0019824/2006-10-18#Artikel3
  - number: 3.2.c.2°
    text: |-
      in het geval het beschikbare budget niet toereikend is, vastgesteld conform het in de vierde kolom genoemde getal,
      welk getal wordt verhoogd met een getal dat afhankelijk is van de verdeling van de resterende middelen uit het
      beschikbare budget naar evenredigheid van het aantal oudkomers als genoemd in [bijlage 1, vierde kolom][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019824
    url: https://wetten.overheid.nl/BWBR0019824/2006-10-18#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0019824
  - number: '3.3'
    text: |-
      De hoogte van de factor S wordt binnen acht weken na inwerkingtreding van deze regeling vastgesteld en aan het
      college bekend gemaakt.
    url: https://wetten.overheid.nl/BWBR0019824/2006-10-18#Artikel3
  - number: '4.1'
    text: |-
      Het college stelt het inburgeringsprogramma vast, waarbij zoveel mogelijk wordt aangesloten bij de persoonlijke
      situatie van de desbetreffende oudkomer.
    url: https://wetten.overheid.nl/BWBR0019824/2006-10-18#Artikel4
  - number: '4.2'
    text: Het inburgeringsprogramma vangt aan in 2006 en is op uiterlijk 31 december 2007 afgerond.
    url: https://wetten.overheid.nl/BWBR0019824/2006-10-18#Artikel4
  - number: '4.3'
    text: Het college draagt er zorg voor dat een inburgeringsprogramma ten minste 300 contacturen omvat.
    url: https://wetten.overheid.nl/BWBR0019824/2006-10-18#Artikel4
  - number: '5.1'
    text: |-
      Het college sluit een overeenkomst met de oudkomer die een inburgeringsprogramma gaat volgen. De datum van
      ondertekening van de overeenkomst geldt als aanvangsdatum van het inburgeringsprogramma.
    url: https://wetten.overheid.nl/BWBR0019824/2006-10-18#Artikel5
  - number: '5.2'
    text: 'De overeenkomst bevat ten minste bepalingen met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0019824/2006-10-18#Artikel5
  - number: 5.2.a
    text: het doel van het inburgeringsprogramma;
    url: https://wetten.overheid.nl/BWBR0019824/2006-10-18#Artikel5
  - number: 5.2.b
    text: de onderdelen van het inburgeringsprogramma;
    url: https://wetten.overheid.nl/BWBR0019824/2006-10-18#Artikel5
  - number: 5.2.c
    text: het aantal contacturen van het inburgeringsprogramma;
    url: https://wetten.overheid.nl/BWBR0019824/2006-10-18#Artikel5
  - number: 5.2.d
    text: de aard en de omvang van de individuele begeleiding;
    url: https://wetten.overheid.nl/BWBR0019824/2006-10-18#Artikel5
  - number: 5.2.e
    text: de verplichtingen van het college;
    url: https://wetten.overheid.nl/BWBR0019824/2006-10-18#Artikel5
  - number: 5.2.f
    text: de verplichtingen van de oudkomer;
    url: https://wetten.overheid.nl/BWBR0019824/2006-10-18#Artikel5
  - number: 5.2.g
    text: |-
      de informatieoverdracht tussen het college, de bij het aanbieden van het inburgeringsprogramma betrokken
      instellingen en de oudkomer met betrekking tot de voortgang van het inburgeringsprogramma;
    url: https://wetten.overheid.nl/BWBR0019824/2006-10-18#Artikel5
  - number: 5.2.h
    text: de gevolgen welke zijn verbonden aan niet-nakoming van de overeenkomst door de oudkomer.
    url: https://wetten.overheid.nl/BWBR0019824/2006-10-18#Artikel5
  - number: '5.3'
    text: Het college sluit op grond van deze regeling met een oudkomer slechts één overeenkomst.
    url: https://wetten.overheid.nl/BWBR0019824/2006-10-18#Artikel5
  - number: '6.1'
    text: |-
      Het college waaraan ingevolge artikel 15b van de Uitvoeringsregeling een voorschot op het inburgeringsdeel is
      verleend, draagt er zorg voor dat de oudkomer met wie een overeenkomst als bedoeld in [artikel 5][ref1] is gesloten
      een begintoets en een eindtoets aflegt aan de hand waarvan het niveau Nederlands als tweede taal van de oudkomer
      wordt vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0019824#Artikel5
    url: https://wetten.overheid.nl/BWBR0019824/2006-10-18#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0019824
        artikel: '5'
        hoofdstuk: '3'
  - number: '6.2'
    text: |-
      Voor de begintoets en de eindtoets wordt uitsluitend gebruik gemaakt van de hierna volgende combinaties van
      toetsen:
    url: https://wetten.overheid.nl/BWBR0019824/2006-10-18#Artikel6
  - number: 6.2.a
    text: de Intaketoets NT2 als begintoets met de NT2-Profieltoets als eindtoets; of
    url: https://wetten.overheid.nl/BWBR0019824/2006-10-18#Artikel6
  - number: 6.2.b
    text: de Intaketoets Alfabetisering NT2 als begintoets met de NT2-Profieltoets Alfabetisering als eindtoets.
    url: https://wetten.overheid.nl/BWBR0019824/2006-10-18#Artikel6
  - number: '7'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0019824/2006-10-18#Artikel7
  - number: '8'
    text: 'Deze regeling wordt aangehaald als: Regeling inburgering oudkomers G30 2006.'
    url: https://wetten.overheid.nl/BWBR0019824/2006-10-18#Artikel8
