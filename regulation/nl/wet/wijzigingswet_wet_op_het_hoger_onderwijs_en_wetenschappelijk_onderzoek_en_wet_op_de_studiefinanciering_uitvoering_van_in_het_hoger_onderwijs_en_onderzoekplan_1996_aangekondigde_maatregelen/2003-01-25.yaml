  - number: IX.6
    text: |-
      [Artikel I, onderdeel][ref1] FFFa, treedt in werking met ingang van de dag na de datum van uitgifte van het
      Staatsblad waarin deze wet wordt geplaatst, en werkt terug tot en met 19 maart 1997 wat betreft de openbare
      universiteiten en tot en met 11 juli 1997 wat betreft de Open Universiteit.


      [ref1]: https://wetten.overheid.nl/BWBR0009524#ArtikelI
    url: https://wetten.overheid.nl/BWBR0009524/2003-01-25#ArtikelIX
    references:
      - id: ref1
        bwb_id: BWBR0009524
        artikel: I
  - number: IX.7
    text: |-
      De artikelen Ia en IIIa treden in werking op een bij koninklijk besluit te bepalen tijdstip. De voordracht voor
      dit koninklijk besluit wordt niet eerder gedaan dan nadat uit het evaluatieverslag, bedoeld in artikel VIIId,
      blijkt dat de duale opleidingen in het wetenschappelijk onderwijs, bedoeld in artikel 7.7a van de Wet op het hoger
      onderwijs en wetenschappelijk onderzoek, in een behoefte voorzien en de Tweede Kamer der Staten-Generaal te kennen
      heeft gegeven daarmee in te stemmen.
    url: https://wetten.overheid.nl/BWBR0009524/2003-01-25#ArtikelIX
  - number: IX.8
    text: |-
      Artikel VIIa treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin deze wet
      wordt geplaatst, en werkt terug tot en met 1 augustus 1997.
    url: https://wetten.overheid.nl/BWBR0009524/2003-01-25#ArtikelIX
  - number: IX.9
    text: |-
      De [artikelen VIII][ref1], VIIIb en VIIIc treden in werking met ingang van de dag na de datum van uitgifte van het
      Staatsblad waarin deze wet wordt geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0009524#ArtikelVIII
    url: https://wetten.overheid.nl/BWBR0009524/2003-01-25#ArtikelIX
    references:
