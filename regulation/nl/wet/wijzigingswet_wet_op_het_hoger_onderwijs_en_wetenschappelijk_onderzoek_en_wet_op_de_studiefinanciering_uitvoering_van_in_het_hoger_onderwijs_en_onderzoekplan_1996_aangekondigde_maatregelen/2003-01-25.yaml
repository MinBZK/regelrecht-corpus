        artikel: I
  - number: IX.5
    text: |-
      [Artikel I onderdeel T][ref1] voor zover het betreft artikel 7.9f van de Wet op het hoger onderwijs en
      wetenschappelijk onderzoek, en [artikel III onderdeel C][ref2] voor zover het betreft artikel 9, lid 1f, van de Wet
      op de studiefinanciering, en onderdeel J, treden in werking met ingang van 1 juni 1998.


      [ref1]: https://wetten.overheid.nl/BWBR0009524#ArtikelI
      [ref2]: https://wetten.overheid.nl/BWBR0009524#ArtikelIII
    url: https://wetten.overheid.nl/BWBR0009524/2003-01-25#ArtikelIX
    references:
