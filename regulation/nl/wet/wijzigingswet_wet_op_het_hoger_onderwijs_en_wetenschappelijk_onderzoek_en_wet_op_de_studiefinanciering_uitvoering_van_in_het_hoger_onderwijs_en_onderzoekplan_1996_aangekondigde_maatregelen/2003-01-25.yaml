preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is uitvoering te geven aan in het hoger onderwijs-
    en onderzoekplan 1996 aangekondigde maatregelen, waartoe wijziging van de Wet op het hoger onderwijs en
    wetenschappelijk onderzoek en de Wet op de studiefinanciering noodzakelijk is;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0009524/2003-01-25#ArtikelAanhef
articles:
  - number: IV
    text: |-
      Indien het instellingsbestuur van een in de bijlage van de Wet op het hoger onderwijs en wetenschappelijk
      onderzoek opgenomen instelling waaraan opleidingen in het wetenschappelijk onderwijs zijn verbonden, toepassing
      geeft aan artikel 7.8a van de Wet op het hoger onderwijs en wetenschappelijk onderzoek, worden studenten die in
      het studiejaar 1997–1998 aan die opleiding zijn ingeschreven, in de gelegenheid gesteld de opleiding te voltooien
      volgens de voorschriften en regelingen, zoals deze luidden op 31 augustus 1998.
    url: https://wetten.overheid.nl/BWBR0009524/2003-01-25#ArtikelIV
  - number: V
    text: |-
      De artikelen 7.31a en 7.31b van de Wet op het hoger onderwijs en wetenschappelijk onderzoek zijn niet van
      toepassing op een student of extraneus die voorafgaand aan het studiejaar 1998–1999 is ingeschreven voor een
      opleiding aan een hogeschool, tenzij deze student of extraneus in het studiejaar 1998–1999 of in een later
      studiejaar voor de eerste maal wordt ingeschreven voor een andere opleiding aan een hogeschool.
    url: https://wetten.overheid.nl/BWBR0009524/2003-01-25#ArtikelV
  - number: VI.1
    text: |-
      Studenten die zijn ingeschreven voor een opleiding in het hoger beroepsonderwijs en in het studiejaar 1997–1998
      of in een eerder studiejaar gebruik hebben gemaakt van de mogelijkheid, bedoeld in artikel 7.3, vierde lid, van
      de Wet op het hoger onderwijs en wetenschappelijk onderzoek, zoals deze bepaling op 31 augustus 1998 luidde, zijn
      gerechtigd het desbetreffende programma aan de hogeschool waar zij dat programma hebben samengesteld, te voltooien
      met dien verstande dat het daaraan verbonden examen tot en met uiterlijk 31 augustus 2004 kan worden afgelegd.
    url: https://wetten.overheid.nl/BWBR0009524/2003-01-25#ArtikelVI
  - number: VI.2
    text: |-
      Op de in het eerste lid bedoelde programma's en de daaraan verbonden examens blijven de voorschriften van de in dat
      lid genoemde wet van toepassing, zoals deze luidden op 31 augustus 1998.
    url: https://wetten.overheid.nl/BWBR0009524/2003-01-25#ArtikelVI
  - number: VI.3
    text: |-
      Artikel 7.3, vierde lid, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek zoals dit artikellid
      luidde op 31 augustus 1998 blijft van kracht ten aanzien van degenen die in het studiejaar 1998–1999 voor de eerste
      keer zijn ingeschreven aan een van de volgende opleidingen:
    url: https://wetten.overheid.nl/BWBR0009524/2003-01-25#ArtikelVI
  - number: VI.3.a
    text: |-
      de opleiding tot leraar voortgezet onderwijs van de tweede graad in Nederlands, de opleiding tot leraar voortgezet
      onderwijs van de tweede graad in tekenen of de opleiding tot leraar voortgezet onderwijs van de tweede graad in
      handvaardigheid aan de Fontys Hogeschool Katholieke Leergangen Sittard,
    url: https://wetten.overheid.nl/BWBR0009524/2003-01-25#ArtikelVI
  - number: VI.3.b
    text: |-
      de opleiding tot leraar voortgezet onderwijs van de eerste graad in tekenen, de opleiding tot leraar voortgezet
      onderwijs van de eerste graad in handvaardigheid of de opleiding tot leraar voortgezet onderwijs van de eerste
      graad in textiele werkvormen aan de Fontys Hogeschool Katholieke Leergangen Tilburg, of
    url: https://wetten.overheid.nl/BWBR0009524/2003-01-25#ArtikelVI
  - number: VI.3.c
    text: |-
      de opleiding beeldende kunst en vormgeving, de opleiding muziek, de opleiding theater, de opleiding tot leraar
      voortgezet onderwijs van de eerste graad in tekenen, de opleiding tot leraar voortgezet onderwijs van de eerste
      graad in handvaardigheid, de opleiding voor het getuigschrift muziekonderwijs B schoolmuziek, of de opleiding voor
      het docentschap drama aan de Hogeschool voor de Kunsten Utrecht.
    url: https://wetten.overheid.nl/BWBR0009524/2003-01-25#ArtikelVI
  - number: VI.4
    text: |-
      Artikel 7.3, vierde lid, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek zoals dit artikellid
      luidde op 31 augustus 1998 blijft van kracht ten aanzien van degenen die in het studiejaar 1998–1999 of het
      studiejaar 1999–2000 voor de eerste keer zijn ingeschreven aan de opleiding voeding en diëtetiek aan de Hogeschool
      van Arnhem en Nijmegen. Het eerste en tweede lid zijn van overeenkomstige toepassing met dien verstande dat het
      examen dat is verbonden aan deze opleiding tot en met uiterlijk 31 augustus 2006 kan worden afgelegd.
    url: https://wetten.overheid.nl/BWBR0009524/2003-01-25#ArtikelVI
  - number: VII.1
    text: |-
      Tot een bij koninklijk besluit te bepalen tijdstip kunnen aan een bekostigde of aangewezen instelling voor hoger
      onderwijs als bedoeld in de Wet op het hoger onderwijs en wetenschappelijk onderzoek opleidingen met een studielast
      van minder dan 168 studiepunten volgens het op 31 augustus 1998 bestaande studielaststelsel worden verzorgd,
      voor zover deze op die datum aan die instelling zijn verbonden. Op deze opleidingen en de daarvoor ingeschreven
      studenten en extraneï blijven de voorschriften van de in de eerste volzin genoemde wet en de daarop gebaseerde
      uitvoeringsregelingen van toepassing.
    url: https://wetten.overheid.nl/BWBR0009524/2003-01-25#ArtikelVII
  - number: VII.2
    text: |-
      Artikel 6.5, derde lid, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek is van overeenkomstige
      toepassing met ingang van het tijdstip, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0009524/2003-01-25#ArtikelVII
  - number: VIIa.1
    text: |-
      Aan de Hogeschool Holland te Diemen, de Fontys Hogeschool Eindhoven te Eindhoven en de Hogeschool van Utrecht te
      Utrecht is tot 1 september 2001 inservice onderwijs verbonden.
    url: https://wetten.overheid.nl/BWBR0009524/2003-01-25#ArtikelVIIa
  - number: VIIa.2
    text: |-
      Degenen die op 31 juli 1997 stonden ingeschreven aan een opleiding inservice onderwijs tot verpleegkundige of
      verzorgende beroepen, die geheel of gedeeltelijk is overgedragen aan een in het eerste lid genoemde hogeschool,
      kunnen deze opleiding met ingang van 1 augustus 1997 voortzetten aan die hogeschool.
    url: https://wetten.overheid.nl/BWBR0009524/2003-01-25#ArtikelVIIa
  - number: VIIa.3
    text: |-
      De in het tweede lid bedoelde personen zijn voor de toepassing van de [Wet studiefinanciering 2000][ref1] geen
      studerenden.


      [ref1]: https://wetten.overheid.nl/BWBR0011453
    url: https://wetten.overheid.nl/BWBR0009524/2003-01-25#ArtikelVIIa
    references:
      - id: ref1
        bwb_id: BWBR0011453
  - number: VIIa.4
    text: |-
      De in het tweede lid bedoelde personen worden in de gelegenheid gesteld deze opleiding te voltooien overeenkomstig
      de op 31 juli 1997 voor de desbetreffende opleiding geldende voorschriften.
    url: https://wetten.overheid.nl/BWBR0009524/2003-01-25#ArtikelVIIa
  - number: VIIa.5
    text: |-
      De in het tweede lid bedoelde personen die de opleiding met goed gevolg voltooien, ontvangen een diploma
      overeenkomstig de op 31 juli 1997 voor de desbetreffende opleiding geldende voorschriften.
    url: https://wetten.overheid.nl/BWBR0009524/2003-01-25#ArtikelVIIa
  - number: VIIa.6
    text: |-
      De bevoegdheid van het college van beroep voor de examens van de desbetreffende hogeschool strekt zich mede uit tot
      de examens, verbonden aan de in het tweede lid bedoelde opleiding.
    url: https://wetten.overheid.nl/BWBR0009524/2003-01-25#ArtikelVIIa
  - number: VIII.1
    text: |-
      Artikel 7.56a van de Wet op het hoger onderwijs en wetenschappelijk onderzoek kan voor de eerste maal toepassing
      vinden met betrekking tot het studiejaar 1999–2000. In dat geval wordt afgeweken van genoemd artikel in die zin
      dat de ministeriële regeling betrekking heeft op een studiejaar en deze regeling wordt vastgesteld uiterlijk
      drie maanden na het tijdstip waarop Onze Minister van Onderwijs, Cultuur en Wetenschappen de regeling heeft
      bekendgemaakt aan de Tweede Kamer der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0009524/2003-01-25#ArtikelVIII
  - number: VIII.2
    text: |-
      Het instellingsbestuur van een bekostigde of aangewezen hogeschool waaraan een of meer opleidingen op het gebied
      van de kunst dan wel een of meer lerarenopleidingen op het gebied van de kunst zijn verbonden, verschaft de
      Informatie Beheer Groep, genoemd in de Wet verzelfstandiging Informatiseringsbank, ten behoeve van het Centraal
      register opleidingen hoger onderwijs, bedoeld in artikel 6.13 van de Wet op het hoger onderwijs en wetenschappelijk
      onderzoek, voor 1 mei 1998 de informatie betreffende de differentiaties, bedoeld in het vierde lid, onder d, van
      genoemd artikel, zoals deze bepaling met ingang van het tijdstip van de inwerkingtreding van deze wet luidt.
    url: https://wetten.overheid.nl/BWBR0009524/2003-01-25#ArtikelVIII
  - number: VIIIb.1
    text: |-
      Indien het instellingsbestuur van een hogeschool, opgenomen in de
      [bijlage van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1], een opleiding met ingang van 1
      september 1998 of 1 september 1999, overeenkomstig [artikel 7.7, tweede lid, van die wet][ref2] tevens duaal wenst
      in te richten, maakt dat bestuur van die wens melding aan Onze Minister van Onderwijs, Cultuur en Wetenschappen
      dan wel voor zover het betreft het landbouwonderwijs aan Onze Minister van Landbouw, Natuurbeheer en Visserij. Deze
      opleidingen worden opgenomen in een ministeriële regeling, die voor 1 juni 1998 onderscheidenlijk voor 1 mei 1999
      wordt vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005682
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0009524/2003-01-25#ArtikelVIIIb
    references:
      - id: ref1
        bwb_id: BWBR0005682
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
  - number: VIIIb.2
    text: |-
      Indien het instellingsbestuur van een hogeschool, aangewezen op grond van
      [artikel 6.9 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1], een opleiding met ingang van 1
      september 1999 overeenkomstig [artikel 7.7, tweede lid, van die wet][ref2] tevens duaal wenst in te richten, maakt
      dat bestuur van die wens melding aan Onze Minister van Onderwijs, Cultuur en Wetenschappen. Deze opleidingen worden
      opgenomen in een ministeriële regeling die voor 1 mei 1999 wordt vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0009524/2003-01-25#ArtikelVIIIb
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
  - number: VIIIb.3
    text: |-
      In afwijking van de termijnbepalingen, bedoeld in de [artikelen 6.13, tweede lid][ref1], en
      [6.14, tweede lid, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref2], neemt
      de Informatie Beheer Groep, genoemd in de [Wet verzelfstandiging Informatiseringsbank][ref3],
      van de opleidingen die zijn opgenomen in de ministeriële regeling, bedoeld in het
      [eerste en tweede lid, in het in artikel 6.13 van eerstgenoemde wet][ref4] bedoeld Centraal register opleidingen
      hoger onderwijs dat betrekking heeft op het studiejaar 1998–1999 dan wel op het studiejaar 1999–2000, het gegeven
      op dat deze opleidingen tevens duaal zijn ingericht, alsmede voor zover nodig het gegeven in welke gemeente of
      gemeenten de desbetreffende opleiding duaal wordt verzorgd. De Informatie Beheer Groep maakt de uit het eerste lid
      voortvloeiende wijzigingen bekend wat betreft het register dat betrekking heeft op het studiejaar 1998–1999 voor 1
      juli 1998, en wat betreft het register dat betrekking heeft op het studiejaar 1999–2000 voor 1 juli 1999. Van deze
      bekendmaking wordt mededeling gedaan in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0006320
      [ref4]: https://wetten.overheid.nl/BWBR0005682#Artikel6
    url: https://wetten.overheid.nl/BWBR0009524/2003-01-25#ArtikelVIIIb
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0006320
      - id: ref4
        bwb_id: BWBR0005682
        artikel: '6'
  - number: VIIIc.1
    text: |-
      De opleidingen waarvoor Onze Minister van Onderwijs, Cultuur en Wetenschappen en voorzover het betreft het
      landbouwonderwijs Onze Minister van Landbouw, Natuurbeheer en Visserij de toestemming, bedoeld in artikel 7.7a,
      eerste lid, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek voor het studiejaar 1998–1999 of voor
      het studiejaar 1999–2000 heeft gegeven, worden opgenomen in een ministeriële regeling die uiterlijk 1 juni 1998
      onderscheidenlijk uiterlijk 1 mei 1999 wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0009524/2003-01-25#ArtikelVIIIc
  - number: VIIIc.2
    text: |-
      In afwijking van de termijnbepalingen, bedoeld in de artikelen 6.13, tweede lid, en 6.14, tweede lid, van de
      Wet op het hoger onderwijs en wetenschappelijk onderzoek neemt de Informatie Beheer Groep, genoemd in de Wet
      verzelfstandiging Informatiseringsbank, van de opleidingen die zijn opgenomen in de ministeriële regeling, bedoeld
      in het eerste lid, in het in artikel 6.13 van eerstgenoemde wet bedoeld Centraal register opleidingen hoger
      onderwijs dat betrekking heeft op het studiejaar 1998–1999 dan wel op het studiejaar 1999–2000, het gegeven op dat
      deze opleidingen tevens duaal zijn ingericht.
    url: https://wetten.overheid.nl/BWBR0009524/2003-01-25#ArtikelVIIIc
  - number: VIIId
    text: |-
      Onze Minister van Onderwijs, Cultuur en Wetenschappen brengt mede namens Onze Minister van Landbouw, Natuurbeheer
      en Visserij voor 1 september 2001 een evaluatieverslag uit aan de beide Kamers der Staten-Generaal over de werking
      van de duale opleidingen in het wetenschappelijk onderwijs, bedoeld in artikel 7.7a van de Wet op het hoger
      onderwijs en wetenschappelijk onderzoek.
    url: https://wetten.overheid.nl/BWBR0009524/2003-01-25#ArtikelVIIId
  - number: IX.1
    text: |-
      Deze wet treedt in werking met ingang van 1 september 1998, met dien verstande dat de bepalingen, genoemd in het
      tweede tot en met negende lid, in werking treden met ingang van de in die leden vermelde tijdstippen.
    url: https://wetten.overheid.nl/BWBR0009524/2003-01-25#ArtikelIX
  - number: IX.2
    text: |-
      Uitsluitend met het oog op de toepassing van de artikelen VIIIb en VIIIc werkt [artikel I onderdelen P][ref1] en Pa
      betreffende de artikelen 7.7 en 7.7a van de Wet op het hoger onderwijs en wetenschappelijk onderzoek, terug tot en
      met 1 januari 1998.


      [ref1]: https://wetten.overheid.nl/BWBR0009524#ArtikelI
