  - number: IX.7
    text: |-
      Artikel Ia treedt in werking op een bij koninklijk besluit te bepalen tijdstip. De voordracht voor dit koninklijk
      besluit wordt niet eerder gedaan dan nadat uit het evaluatieverslag, bedoeld in artikel VIIId, blijkt dat de
      duale opleidingen in het wetenschappelijk onderwijs, bedoeld in artikel 7.7a van de Wet op het hoger onderwijs en
      wetenschappelijk onderzoek, in een behoefte voorzien en de Tweede Kamer der Staten-Generaal te kennen heeft gegeven
      daarmee in te stemmen.
    url: https://wetten.overheid.nl/BWBR0009524/2005-08-03#ArtikelIX
