preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is uitvoering te geven aan in het hoger onderwijs-
    en onderzoekplan 1996 aangekondigde maatregelen, waartoe wijziging van de Wet op het hoger onderwijs en
    wetenschappelijk onderzoek en de Wet op de studiefinanciering noodzakelijk is;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0009524/2005-08-03#ArtikelAanhef
articles:
  - number: IX.1
    text: |-
      Deze wet treedt in werking met ingang van 1 september 1998, met dien verstande dat de bepalingen, genoemd in het
      tweede tot en met negende lid, in werking treden met ingang van de in die leden vermelde tijdstippen.
    url: https://wetten.overheid.nl/BWBR0009524/2005-08-03#ArtikelIX
  - number: IX.2
    text: |-
      Uitsluitend met het oog op de toepassing van de artikelen VIIIb en VIIIc werkt [artikel I onderdelen P][ref1] en Pa
      betreffende de artikelen 7.7 en 7.7a van de Wet op het hoger onderwijs en wetenschappelijk onderzoek, terug tot en
      met 1 januari 1998.


      [ref1]: https://wetten.overheid.nl/BWBR0009524#ArtikelI
    url: https://wetten.overheid.nl/BWBR0009524/2005-08-03#ArtikelIX
