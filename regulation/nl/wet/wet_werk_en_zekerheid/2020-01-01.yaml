    text: |-
      1 [Artikel 1.1.1, onderdeel z, onder 2][ref1], [artikel 1.1.3, tweede lid][ref2],
      [hoofdstuk 4, titel 1, paragraaf 2][ref3], en [artikel 4.3.3 van de Wet educatie en beroepsonderwijs][ref4],
      zoals deze luidden de dag voor het tijdstip van inwerkingtreding van [artikel XXIa][ref5]
      blijven van toepassing op een beslissing die voor dat tijdstip is genomen op grond van
      [artikel 4.1.5, eerste lid, van de Wet educatie en beroepsonderwijs][ref6].

      2 De [artikelen 63 tot en met 65][ref7] en [69, derde en zesde lid, van de Wet op de expertisecentra][ref8],
      zoals deze luidden de dag voor het tijdstip van inwerkingtreding van [artikel XXIb][ref9]
      blijven van toepassing op een beslissing die voor dat tijdstip is genomen op grond van
      [artikel 63, eerste lid, van de Wet op de expertisecentra][ref10].

      3 De [artikelen 1.15, eerste lid, onderdeel b][ref11], en
      [4.7 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref12], zoals deze luidden de dag voor het
      tijdstip van inwerkingtreding van [artikel XXIc][ref13] blijven van toepassing op een beslissing die voor dat
      tijdstip is genomen op grond van artikel 4.7, eerste lid, van de Wet op het hoger onderwijs en wetenschappelijk
      onderzoek.

      4 De [artikelen 60 tot en met 62][ref14] en [68, derde en zesde lid, van de Wet op het primair onderwijs][ref15],
      zoals deze luidden de dag voor het tijdstip van inwerkingtreding van [artikel XXId][ref16]
      blijven van toepassing op een beslissing die voor dat tijdstip is genomen op grond van
      [artikel 60, eerste lid, van de Wet op het primair onderwijs][ref17].

      5 De [artikelen 1][ref18], [24e1, derde lid][ref19], [52 tot en met 53][ref20] en
      [53b, derde en zesde lid, van de Wet op het voortgezet onderwijs][ref21], zoals deze luidden de dag voor het
      tijdstip van inwerkingtreding van [artikel XXIe][ref22] blijven van toepassing op een beslissing die voor dat
      tijdstip is genomen op grond van [artikel 52, eerste lid, van de Wet op het voortgezet onderwijs][ref23].


