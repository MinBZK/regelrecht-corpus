preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is om het ontslagrecht te vereenvoudigen, de
    rechtsgelijkheid en rechtszekerheid bij ontslag te bevorderen, de vergoeding bij ontslag te beperken en aanwending
    daarvan voor snelle werkhervatting te bevorderen, dat het wenselijk is de rechtspositie van werknemers met
    een arbeidsovereenkomst voor bepaalde tijd en met een arbeidsovereenkomst met wisselende uren te versterken,
    de doorstroom van flexibele naar vaste arbeid te bevorderen en de langdurige inzet van flexibele arbeid te
    beperken en het wenselijk is om tegelijkertijd de Werkloosheidswet een meer activerend karakter te geven en de
    inkomensvoorziening via de Wet inkomensvoorziening oudere werklozen uit te breiden onder gelijktijdige beperking
    van de toegang tot de Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers en tot
    slot de uitkering vanwege betalingsonmacht van de werkgever te maximeren op anderhalf maal het maximumdagloon;

    Zo is het dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-Generaal,
    hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0035254/2020-01-01#ArtikelAanhef
articles:
  - number: III
    text: |-
      Het [Buitengewoon Besluit Arbeidsverhoudingen 1945][ref1] wordt ingetrokken, met dien verstande dat voor de
      verschillende artikelen of onderdelen van de artikelen van het Buitengewoon Besluit Arbeidsverhoudingen 1945 bij
      koninklijk besluit het tijdstip waarop deze vervallen verschillend kan worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002014
    url: https://wetten.overheid.nl/BWBR0035254/2020-01-01#ArtikelIII
