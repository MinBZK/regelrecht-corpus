  - number: XXIId
    text: |-
      [Artikel 668, leden 1, 2, 3 en 4, onderdeel a, van Boek 7 van het Burgerlijk Wetboek][ref1], zoals dat artikel
      komt te luiden na het tijdstip van inwerkingtreding van [artikel I, onderdeel M][ref2], van deze wet, is niet van
      toepassing op arbeidsovereenkomsten die eindigen binnen een maand na het tijdstip van inwerkingtreding van dat
      onderdeel.


